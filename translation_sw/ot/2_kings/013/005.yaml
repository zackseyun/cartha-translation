base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/005.yaml
  text: And Yahweh gave Israel a deliverer[a], so that they went out from under the hand of Aram[c][b]; and the sons of Israel lived in their tents as formerly.
translation:
  language: sw
  text: Yahwe akawapa Israeli mkombozi[a], nao wakatoka chini ya mamlaka ya Aramu[b], na wana wa Israeli wakaishi katika hema zao kama zamani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwokozi.” Neno la Kiebrania humaanisha mtu anayeleta wokovu au ukombozi.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “chini ya mkono wa Aramu,” nahau inayomaanisha kutoka katika nguvu au utawala wa Aramu.'
    reason: cultural_note
  - marker: c
    text: Au, “kama hapo awali” au “kama nyakati za zamani.” Kihalisi, nahau ya Kiebrania husema, “kama jana na juzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la agano kwa namna ya kulitaja moja kwa moja, kwa tahajia ya Kiswahili iliyo wazi.
- source_word: מוֹשִׁיעַ
  choice: mkombozi
  rationale: Neno hili humaanisha mtu anayeleta wokovu au ukombozi. Katika muktadha huu ni mkombozi kutoka kwa utawala wa Aramu, bila kulifanya moja kwa moja kuwa cheo cha kimasiya.
- source_word: מִתַּחַת יַד אֲרָם
  choice: chini ya mamlaka ya Aramu
  rationale: Nahau ya Kiebrania ya kuwa ‘chini ya mkono’ inaeleza kuwa chini ya nguvu au utawala wa Aramu; ‘mamlaka’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: אֲרָם
  choice: Aramu
  rationale: Linatunza jina la kihistoria la taifa hilo badala ya kutumia jina la baadaye, Siria.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Linatunza usemi wa kifamilia wa Kiebrania na utambulisho wake wa agano, huku likibaki wazi kwa msomaji wa Kiswahili.
- source_word: בְּאָהֳלֵיהֶם
  choice: katika hema zao
  rationale: Linatunza picha halisi ya hema iliyomo katika Kiebrania badala ya kuibadili kuwa ‘nyumba’ au ‘makao.’
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: kama zamani
  rationale: Hii ndiyo maana ya nahau inayorejelea siku za awali; tafsiri hii ni ya asili na inayoeleweka katika Kiswahili.
- source_word: וַיֵּצְאוּ
  choice: wakaondoka
  rationale: Kitenzi kina maana ya kutoka; hapa kinaonyesha kuondoka katika hali ya kutawaliwa, jambo linalofafanuliwa na kirai kinachofuata.
- source_word: וַיֵּשְׁבוּ
  choice: wakakaa
  rationale: Kitenzi kinaweza kumaanisha kukaa au kuishi; ‘wakakaa’ kinatunza upana wake na kinaendana vizuri na ‘katika hema zao.’
theological_decisions:
- issue: Ikiwa מוֹשִׁיעַ itafsiriwe ‘mkombozi’ au ‘mwokozi’
  choice: mkombozi
  alternative: mwokozi
  rationale: Muktadha unaeleza ukombozi wa kihistoria kutoka kwa utawala wa Aramu. ‘Mkombozi’ linaonyesha tendo la kuokoa bila kuingiza utambulisho wa kimasiya ambao mstari wenyewe hautaji.
- issue: Ikiwa בְנֵי יִשְׂרָאֵל itafsiriwe kwa usemi wa kifamilia au kwa jina la jumla
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: Usemi wa Kiebrania ni wa kifamilia na wa kiume kisarufi; tafsiri hii inautunza badala ya kuugeuza kuwa jina la jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa masimulizi umetumia mfululizo wa vitenzi vya ‘-ka-’. ‘Mamlaka’ limetumiwa katika matini kuu kufafanua nahau ya Kiebrania, huku taswira halisi ya ‘mkono’ ikihifadhiwa katika tanbihi.
