  text: Then Hazael king of Aram died[a], and Ben-hadad his son became king in his place.
translation:
  language: sw
  text: Kisha Hazaeli, mfalme wa Aramu,[a] akafa, na Ben-Hadadi, mwanawe, akawa mfalme mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Siria.” Kiebrania kina “Aramu,” jina la ufalme ambalo kwa kawaida limetafsiriwa “Siria” katika tafsiri za zamani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Ni kitenzi cha simulizi cha מות katika Qal, kinachoeleza tukio lililokamilika; “akafa” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: חֲזָאֵל
  choice: Hazaeli
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: אֲרָם ni jina la kihistoria la ufalme huo; “Aramu” huhifadhi jina la Kiebrania moja kwa moja kuliko “Siria.”
- source_word: וַיִּמְלֹךְ
  choice: akawa mfalme
  rationale: Katika muktadha huu wa urithi wa kiti cha enzi, מלך inaeleza kuingia kwake katika ufalme, si muda wote wa utawala wake.
- source_word: בֶּן־הֲדַד
  choice: Ben-hadadi
  rationale: Jina limetoholewa kwa namna ya Kiswahili huku kiunganishi cha sehemu zake kikihifadhiwa.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Kiambishi cha nafsi kinamrejelea Hazaeli, na uhusiano wa baba na mwana umeelezwa wazi.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika kauli ya urithi wa kifalme, neno hili linaonyesha kwamba Ben-hadadi alichukua nafasi ya Hazaeli.
