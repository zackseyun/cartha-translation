  to: Ndipo mtu wa Mungu akamkasirikia, akasema, “Ungalipaswa kuipiga ardhi[a] mara tano au sita; ndipo ungaliipiga Aramu mpaka kuimaliza kabisa[b]. Lakini sasa utaipiga Aramu mara tatu tu.”
