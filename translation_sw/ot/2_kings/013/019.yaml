    reason: cross_reference
  - marker: b
    text: Au, “mpaka kuiangamiza kabisa.”
    reason: lexical_alternative
  revision_rationale: The revision avoids making total annihilation the main-text meaning where the Hebrew permits the broader military sense of bringing Aram to an end. It also relocates the contextual-supply footnote to the word it explains. All other wording is retained because it is faithful and natural.
