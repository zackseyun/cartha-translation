base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/019.yaml
  text: Then the man of God was angry with him and said[a], “You should have struck the ground five or six times; then you would have struck Aram until it was finished[b]. But now you will strike Aram only three times.”
translation:
  language: sw
  text: Ndipo mtu wa Mungu akamkasirikia, akasema, “Ungalipaswa kuipiga ardhi[a] mara tano au sita; ndipo ungaliipiga Aramu mpaka kuimaliza kabisa[b]. Lakini sasa utaipiga Aramu mara tatu tu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema tu “kupiga”; neno “ardhi” limeongezwa kutokana na tendo lililotangulia mara moja katika mstari wa 18.
    reason: cross_reference
  - marker: b
    text: Au, “mpaka kuiangamiza kabisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף עָלָיו
  choice: akamkasirikia
  rationale: Kitenzi קצף pamoja na עַל kinaonyesha kumkasirikia mtu; tafsiri hii ni ya kawaida na yenye hadhi bila kuzidisha ukali wa hasira.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Huhifadhi usemi wa kawaida wa Kiebrania badala ya kuufasiri moja kwa moja kuwa ‘nabii wa Mungu.’
- source_word: לְהַכּוֹת
  choice: kuipiga ardhi
  rationale: Kiebrania kinasema tu ‘kupiga,’ lakini kitu kinachopigwa, yaani ardhi, kinaeleweka wazi kutokana na tendo la mstari wa 18; kimeongezwa kwa uwazi na kuwekewa tanbihi.
- source_word: חָמֵשׁ אוֹ שֵׁשׁ פְּעָמִים
  choice: mara tano au sita
  rationale: Ni uwasilishaji wa moja kwa moja na wa kawaida wa hesabu hiyo.
- source_word: אָז הִכִּיתָ אֶת אֲרָם
  choice: ndipo ungaliipiga Aramu
  rationale: ‘Ndipo’ huonyesha matokeo ya jambo ambalo halikutendeka, na kurudia ‘piga’ huhifadhi uhusiano kati ya ishara ya kuipiga ardhi na ushindi dhidi ya Aramu.
- source_word: עַד כַּלֵּה
  choice: mpaka kuiangamiza kabisa
  rationale: Kitenzi כלה hapa kinaashiria kufikisha mwisho kamili katika muktadha wa kijeshi. Kiswahili hiki ni cha asili na kinaweka wazi ukamilifu huo bila kudai kuangamizwa kwa kila mtu mmoja mmoja.
- source_word: וְעַתָּה
  choice: Lakini sasa
  rationale: Huonyesha tofauti kati ya ushindi kamili ambao ungewezekana na matokeo yaliyowekewa kikomo.
- source_word: שָׁלֹשׁ פְּעָמִים תַּכֶּה אֶת אֲרָם
  choice: utaipiga Aramu mara tatu tu
  rationale: Umbo la kitenzi ni la utabiri hapa; ‘tu’ huonyesha kikomo kinachodokezwa na tofauti na mara tano au sita.
theological_decisions:
- issue: Kuhifadhi uhusiano wa kiishara kati ya kuipiga ardhi na kuipiga Aramu
  choice: Kutumia kitenzi ‘piga’ kwa matendo yote mawili, huku ‘ardhi’ ikiongezwa kutokana na muktadha.
  alternative: Kutumia ‘gonga ardhi’ na ‘ishinda Aramu.’
  rationale: Kurudiwa kwa kitenzi katika Kiebrania kunaunganisha tendo la ishara na ushindi wa kijeshi; kulihifadhi humwezesha msomaji kuona uhusiano huo bila kuongeza fundisho la ziada.
- issue: Nguvu ya maana ya עַד כַּלֵּה
  choice: mpaka kuiangamiza kabisa
  alternative: mpaka kuimaliza
  rationale: Usemi huo unaonyesha kukomesha Aramu kikamilifu katika maana ya kijeshi. Tanbihi huhifadhi uwezekano wa tafsiri isiyo kali zaidi wa ‘kuimaliza kabisa.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo ‘ungalipaswa ... ungali-’ unaonyesha wazi tendo ambalo halikutendeka na matokeo yake ambayo hayakutimia.
