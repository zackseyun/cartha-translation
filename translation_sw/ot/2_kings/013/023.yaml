base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/023.yaml
  text: But Yahweh was gracious to them and had compassion on them[a], and he turned toward them because of his covenant with Abraham, Isaac, and Jacob. He was not willing to destroy them, and he did not cast them from his presence until now.
translation:
  language: sw
  text: Lakini Yahwe aliwaonyesha neema na kuwahurumia; akawageukia kwa sababu ya agano lake[a] na Abrahamu, Isaka na Yakobo. Hakutaka kuwaangamiza, wala hakuwatupa kutoka mbele zake hadi sasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya agano lake na Abrahamu, Isaka na Yakobo.”
    reason: Mbadala huu unaonyesha maana nyingine ya kawaida ya לְמַעַן, inayoweza kusisitiza kutenda kwa ajili ya agano badala ya kulitaja tu kama sababu.
lexical_decisions:
- source_word: וַיָּחָן
  choice: akawaonyesha neema
  rationale: Kitenzi חנן kinaonyesha kumpa mtu fadhili au neema. Kauli hii ni ya asili katika Kiswahili na inadumisha wazo la fadhili za Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama jina maalumu badala ya kubadilishwa kuwa cheo.
- source_word: וַיְרַחֲמֵם
  choice: kuwahurumia
  rationale: Kitenzi רחם kinaeleza huruma ya ndani; ‘kuwahurumia’ ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: וַיִּפֶן אֲלֵיהֶם
  choice: akawaelekea
  rationale: Tafsiri hii inadumisha picha halisi ya kugeukia watu, huku muktadha ukionyesha kuwa Mungu aliwaangalia kwa kibali.
- source_word: לְמַעַן בְּרִיתוֹ
  choice: kwa sababu ya agano lake
  rationale: למען hapa inaonyesha sababu au msingi wa tendo la Mungu; kauli hii ni wazi bila kuongeza ufafanuzi wa kiteolojia.
- source_word: וְלֹא אָבָה הַשְׁחִיתָם
  choice: Hakutaka kuwaangamiza
  rationale: אָבָה huhusu kutaka au kuwa tayari kufanya jambo, hivyo tafsiri hii inadumisha maana ya hiari.
- source_word: וְלֹא הִשְׁלִיכָם מֵעַל פָּנָיו
  choice: wala hakuwatupa kutoka mbele zake
  rationale: Kauli hii inadumisha picha ya Kiebrania ya kuwatupa mbali na mbele ya uso wake, yaani kuwaondoa katika uwepo wake.
- source_word: עַד עָתָּה
  choice: mpaka sasa
  rationale: Kauli hii inaonyesha hali iliyoendelea hadi wakati wa msimulizi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina maalumu la agano; kulitohowa kama ‘Yahwe’ kunalitofautisha na cheo.
- issue: Agano kama msingi wa huruma na kujizuia kwa Mungu
  choice: kwa sababu ya agano lake na Abrahamu, Isaka na Yakobo
  alternative: kwa ajili ya agano lake na Abrahamu, Isaka na Yakobo
  rationale: Tafsiri inaweka wazi uhusiano uliomo katika maandishi kati ya matendo ya Mungu na agano lake, bila kuufafanua zaidi ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unafuata mfululizo wa vitendo vya Kiebrania bila kuwa mgumu kupita kiasi.
