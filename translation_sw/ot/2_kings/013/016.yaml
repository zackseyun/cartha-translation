base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/016.yaml
  text: Then he said to the king of Israel[a], “Put your hand on the bow.” So he put his hand on it, and Elisha laid his hands on the king’s hands.
translation:
  language: sw
  text: Kisha akamwambia mfalme wa Israeli, “Weka mkono wako juu ya upinde.”[a] Akaweka mkono wake juu yake, naye Elisha akaweka mikono yake juu ya mikono ya mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa usemi wa karibu zaidi: “Weka mkono wako juu ya upinde.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְכֵּב
  choice: Weka
  rationale: Hili ni agizo katika kausativi ya רכב. Katika muktadha huu linamaanisha kuuweka mkono juu ya upinde; “weka” ni Kiswahili cha kawaida na kinaeleza kitendo bila kutumia tafsiri halisi isiyo ya kawaida ya “panda.”
- source_word: יָדְךָ עַל הַקֶּשֶׁת
  choice: mkono wako kwenye upinde
  rationale: “Kwenye upinde” ni usemi wa kawaida wa Kiswahili kwa mahali mkono unapowekwa, huku ukihifadhi uhusiano wa mkono na upinde.
- source_word: וַיַּרְכֵּב יָדוֹ
  choice: Akaweka mkono wake juu yake
  rationale: Kiebrania hakirudii neno “upinde.” Kiwakilishi “juu yake” kinarejelea upinde kwa uwazi na kudumisha mtiririko wa simulizi.
- source_word: וַיָּשֶׂם
  choice: akaweka
  rationale: “Akaweka” ni kitenzi cha kawaida na cha moja kwa moja kwa kitendo cha Elisha kuweka mikono yake juu ya mikono ya mfalme.
- source_word: יָדָיו עַל יְדֵי הַמֶּלֶךְ
  choice: mikono yake juu ya mikono ya mfalme
  rationale: Wingi wa “mikono” kwa Elisha na kwa mfalme umehifadhiwa, hivyo taswira ya Elisha kuifunika au kuiongoza mikono ya mfalme haipotei.
- source_word: וַיֹּאמֶר לְמֶלֶךְ יִשְׂרָאֵל
  choice: Kisha akamwambia mfalme wa Israeli
  rationale: “Kisha” linaendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida; kiambishi cha yambwa katika “akamwambia” kinaonyesha kuwa maneno yanaelekezwa kwa mfalme.
theological_decisions:
- issue: Maana ya Elisha kuweka mikono yake juu ya mikono ya mfalme
  choice: Kitendo kimesimuliwa moja kwa moja bila kukipa maana ya kiishara ndani ya tafsiri.
  alternative: Kukieleza kama ishara ya kumwezesha mfalme kinabii au ya mwongozo wa Mungu vitani.
  rationale: Aya yenyewe inataja kitendo lakini haifafanui maana yake ya kitheolojia. Muktadha unaofuata ndio unaoonyesha umuhimu wake, hivyo tafsiri haipaswi kuongeza ufafanuzi wa kimadhehebu au wa kiufasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Maneno ya kitendo yamewekwa wazi bila kuongeza tafsiri ya ishara ya kinabii.
