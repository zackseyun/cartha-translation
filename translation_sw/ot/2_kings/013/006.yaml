base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/006.yaml
  text: Yet they did not turn away from the sins of the house of Jeroboam[a], by which he caused Israel to sin; in them he walked, and even the Asherah remained standing in Samaria.
translation:
  language: sw
  text: Hata hivyo, hawakuacha dhambi za nyumba ya Yeroboamu, ambazo kwazo aliifanya Israeli itende dhambi; aliendelea kufuata njia hiyo. Hata Ashera[a] iliendelea kusimama katika Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguzo ya Ashera.” Neno la Kiebrania linaweza kumaanisha mungu wa kike wa Kanaani aliyeitwa Ashera au, kama inavyoelekea hapa, kifaa cha ibada kilichohusishwa na ibada yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hata hivyo
  rationale: Inaonyesha tofauti kati ya ukombozi uliotajwa kabla na kuendelea kwa Israeli katika dhambi.
- source_word: לֹא סָרוּ מֵחַטֹּאות
  choice: hawakuacha dhambi
  rationale: Kitenzi pamoja na kihusishi kina maana ya kugeuka au kujitenga na jambo; ‘hawakuacha’ ni Kiswahili cha kawaida kinachoonyesha kutotupilia mbali mwenendo wa dhambi.
- source_word: בֵּית יָרָבְעָם
  choice: nyumba ya Yeroboamu
  rationale: Inadumisha taswira ya Kiebrania ya ‘nyumba,’ ambayo hapa inahusu urithi na mfumo ulioanzishwa na Yeroboamu bila kuufupisha kuwa nasaba pekee.
- source_word: אֲשֶׁר החטי אֶת יִשְׂרָאֵל
  choice: ambazo kwazo aliifanya Israeli itende dhambi
  rationale: Hiphil ya חטא ina maana ya kusababisha kutenda dhambi; ‘kwazo’ inadumisha maana ya dhambi hizo kuwa njia au mfumo uliosababisha Israeli kutenda dhambi.
- source_word: בָּהּ הָלָךְ
  choice: aliendelea kufuata njia hiyo
  rationale: הלך pamoja na ב inaeleza mwenendo au kuendelea kufuata njia fulani. Tafsiri hii ni ya asili kwa Kiswahili na inadumisha umoja wa kiambishi cha Kiebrania kinachorejelea mfumo huo wa dhambi.
- source_word: וְגַם
  choice: Hata
  rationale: 'Inaongeza mkazo: licha ya hayo yote, Ashera pia haikuondolewa.'
- source_word: הָאֲשֵׁרָה
  choice: Ashera
  rationale: Neno la Kiebrania linaweza kumaanisha mungu wa kike Ashera au kifaa cha ibada kilichohusishwa naye. Kutumia jina lenyewe huepuka kuongeza neno ‘nguzo’ lisilomo wazi katika matini.
- source_word: עָמְדָה
  choice: iliendelea kusimama
  rationale: Inahifadhi picha halisi ya kusimama na pia maana ya kuendelea kuwapo mahali hapo.
- source_word: בְּשֹׁמְרוֹן
  choice: Samaria
  rationale: Ni usemi wa kawaida wa mahali kwa mji mkuu wa Samaria.
theological_decisions:
- issue: Rejeleo na maana ya הָאֲשֵׁרָה
  choice: Ashera, ikieleweka kwa muktadha kuwa kifaa cha ibada kilichohusishwa na Ashera
  alternative: mungu wa kike Ashera; nguzo ya Ashera
  rationale: Kauli kwamba iliendelea kusimama Samaria inaelekea kuashiria kifaa cha ibada, lakini neno lenyewe linaweza pia kumtaja mungu huyo wa kike. Matini kuu inadumisha jina Ashera, na tanbihi inaeleza uwezekano huo.
- issue: Mabadiliko kutoka kiima cha wingi katika לֹא סָרוּ kwenda kitenzi cha umoja katika הָלָךְ
  choice: Kudumisha umoja kwa ‘aliendelea kufuata njia hiyo’ bila kumtaja kiima kwa jina
  alternative: waliendelea kufuata njia hiyo
  rationale: Kiebrania kina kitenzi cha umoja katika kishazi hiki. Tafsiri haibadili kuwa wingi wala kuamua wazi kama kiima ni mfalme aliyekuwa akizungumziwa katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Nyumba ya Yeroboamu’ inadumisha nahau ya Biblia, huku ‘kufuata njia hiyo’ ikitoa kwa kawaida maana ya mwenendo wa kudumu.
