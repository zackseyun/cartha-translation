base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/007.yaml
  text: For he left Jehoahaz no people except fifty horsemen[a], ten chariots, and ten thousand foot soldiers, because the king of Aram had destroyed them and made them like dust at threshing.
translation:
  language: sw
  text: Kwa maana hakumwachia Yehoahazi jeshi lolote isipokuwa wapanda farasi hamsini, magari kumi ya vita, na askari wa miguu elfu kumi, kwa sababu mfalme wa Aramu alikuwa amewaangamiza na kuwafanya kama mavumbi yanayokanyagwa wakati wa kupura nafaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama mavumbi ya kupuria nafaka.” Kitenzi cha Kiebrania kinaweza kumaanisha kukanyaga au kupura nafaka, hivyo picha hizo mbili zinaingiliana.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁאִיר
  choice: hakumwachia
  rationale: Hifili ya שׁאר ina maana ya kuacha kitu kibaki; muundo huu wa Kiswahili unaonyesha kwamba Yehoahazi aliachiwa mabaki hayo tu.
- source_word: עָם
  choice: jeshi lolote
  rationale: Ingawa עָם kwa kawaida ni ‘watu,’ orodha inayofuata ya wapanda farasi, magari ya vita, na askari wa miguu inaonyesha kuwa hapa inahusu jeshi.
- source_word: כִּי אִם
  choice: isipokuwa
  rationale: Baada ya kauli hasi, nahau hii hutambulisha kile pekee kilichobaki.
- source_word: פָּרָשִׁים
  choice: wapanda farasi
  rationale: Neno hili linataja wanajeshi waliopanda farasi; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: רֶכֶב
  choice: magari ya vita
  rationale: Nomino ya umoja imetumiwa kwa maana ya kijumla, lakini pamoja na idadi inataja magari kumi ya vita.
- source_word: רַגְלִי
  choice: askari wa miguu
  rationale: Hutaja wanajeshi wanaopigana kwa miguu, tofauti na wapanda farasi na magari ya vita.
- source_word: אִבְּדָם
  choice: alikuwa amewaangamiza
  rationale: Pieli ya אבד inaonyesha kuharibu kabisa au kuangamiza; wakati uliotangulia unaeleza chanzo cha jeshi kupungua.
- source_word: כֶּעָפָר לָדוּשׁ
  choice: kama mavumbi yanayokanyagwa wakati wa kupura nafaka
  rationale: Tafsiri hii huhifadhi tashbihi ya mavumbi na maana ya דושׁ, ambayo inaweza kumaanisha kukanyaga na pia kupura nafaka.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa msomaji wa kawaida. ‘Magari ya vita’ yametumiwa badala ya neno la kiufundi zaidi, na taswira ya jadi ya kupura nafaka imehifadhiwa.
