base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/022.yaml
  text: Hazael king of Aram oppressed Israel all the days of Jehoahaz[a].
translation:
  language: sw
  text: Hazaeli, mfalme wa Aramu[a], aliikandamiza Israeli siku zote za Yehoahazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Aramu”; katika baadhi ya tafsiri za kimapokeo huitwa “Shamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזָאֵל
  choice: Hazaeli
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili. Kiunganishi וַ־ kinaendeleza simulizi, lakini hakihitaji kutafsiriwa kwa neno la ziada katika sentensi hii.
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: Muundo wa Kiebrania umetafsiriwa moja kwa moja. “Aramu” huhifadhi jina la asili badala ya kutumia jina la kimapokeo “Shamu.”
- source_word: לָחַץ
  choice: aliikandamiza
  rationale: Kitenzi hiki huonyesha kuonea au kusonga kwa nguvu; hapa kinaeleza ukandamizaji wa kisiasa na kijeshi ulioendelea kwa muda.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Ni yambwa ya moja kwa moja na hapa inamaanisha taifa, hasa ufalme wa kaskazini.
- source_word: כֹּל יְמֵי
  choice: siku zote za
  rationale: Nahau hii huhifadhi wazo la muda wote unaohusishwa na Yehoahazi bila kuamua wazi ikiwa unamaanisha maisha yake yote au kipindi chake cha kutawala.
- source_word: יְהוֹאָחָז
  choice: Yehoahazi
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili inayokaribiana na umbo la Kiebrania.
