base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/001.yaml
  text: In the twenty-third year of Joash son of Ahaziah, king of Judah, Jehoahaz son of Jehu began to reign over Israel in Samaria, and he reigned seventeen years.
translation:
  language: sw
  text: Katika mwaka wa ishirini na tatu wa utawala wa Yoashi mwana wa Ahazia, mfalme wa Yuda, Yehoahazi mwana wa Yehu alianza kutawala Israeli katika Samaria, naye alitawala kwa miaka kumi na saba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה לְיוֹאָשׁ
  choice: Katika mwaka wa ishirini na tatu wa utawala wa Yoashi
  rationale: Kirai cha Kiebrania kinataja mwaka wa ishirini na tatu unaohesabiwa kwa Yoashi; kuongeza “wa utawala” huweka maana hiyo wazi kwa Kiswahili cha kawaida bila kubadili taarifa.
- source_word: מָלַךְ
  choice: alianza kutawala ... naye alitawala
  rationale: Kitenzi kilekile kinaanza taarifa ya utawala na kisha muda wake; Kiswahili hutumia kwa kawaida “alianza kutawala” katika fomula ya mwanzo wa utawala na “alitawala” kwa muda wake.
- source_word: עַל־יִשְׂרָאֵל
  choice: kutawala Israeli
  rationale: Muundo wa kawaida wa Kiswahili haudai kihusishi baada ya “kutawala”; maana ya mamlaka juu ya Israeli inabaki kamili.
- source_word: בְּשֹׁמְרוֹן
  choice: huko Samaria
  rationale: “Huko” linaonyesha kwamba Samaria ndicho kituo au mahali pa utawala, si kwamba Israeli yote ilikuwa ndani ya Samaria.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: kwa miaka kumi na saba
  rationale: Huu ni usemi wa kawaida na wazi wa muda katika Kiswahili.
