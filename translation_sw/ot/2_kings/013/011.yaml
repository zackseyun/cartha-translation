base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/011.yaml
  text: He did what was evil in the sight of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], by which he caused Israel to sin; he walked in them.
translation:
  language: sw
  text: Alifanya maovu machoni pa Yahwe. Hakuacha kufuata hata dhambi moja miongoni mwa dhambi za Yeroboamu mwana wa Nebati, ambazo Yeroboamu aliwafanya Waisraeli watende; aliifuata njia hiyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri nyingine: “alifuata dhambi hizo.” Kiebrania kinasema kwa umoja, “aliifuata hiyo,” kikirejelea kwa ujumla njia ya dhambi ya Yeroboamu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: Alifanya yaliyo maovu
  rationale: Muundo huu unatafsiri kwa Kiswahili cha kawaida fomula ya tathmini ya kifalme, bila kupunguza hukumu yake ya kimaadili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi sitiari ya Kiebrania ya kuwa mbele ya tathmini ya Mungu na kulitaja jina la agano moja kwa moja.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: Hakuacha dhambi yoyote
  rationale: Katika muktadha hasi, מִכָּל huonyesha kwamba hakujitenga na hata mojawapo ya dhambi hizo; usemi huu ni wazi na wa kawaida kwa Kiswahili.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Hutumia maumbo ya majina yaliyozoeleka katika Biblia za Kiswahili na kuhifadhi patronimia ya Kiebrania.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ambazo kwa hizo aliifanya Israeli itende dhambi
  rationale: Hiphil ya חטא inaeleza kusababisha au kuongoza mwingine atende dhambi; kishazi kinahusishwa na dhambi hizo kama njia aliyotumia Yeroboamu.
- source_word: בָּהּ הָלָךְ
  choice: aliendelea kuenenda katika njia hiyo
  rationale: הָלָךְ hapa ni sitiari ya mwenendo. Kiambishi cha umoja cha kike בָּהּ kimehifadhiwa kwa wazo la pamoja la njia ya dhambi, huku 'aliendelea' kikionyesha kudumu katika mwenendo huo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; 'Yahwe' huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Rejeo la kishazi אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: dhambi ambazo kwa hizo Yeroboamu aliifanya Israeli itende dhambi
  alternative: Yeroboamu, ambaye aliifanya Israeli itende dhambi
  rationale: Muundo wa Kiebrania unaruhusu uhusiano na dhambi kama njia iliyosababisha Israeli kutenda dhambi. Tafsiri kuu huhifadhi uhusiano huo bila kuficha jukumu la Yeroboamu.
- issue: Umoja wa בָּהּ baada ya wingi חַטֹּאות
  choice: katika njia hiyo
  alternative: katika dhambi hizo
  rationale: Kiambishi ni cha umoja ingawa kinarejelea kwa ujumla mkondo wa dhambi za Yeroboamu. Tafsiri kuu huhifadhi mvutano huo kwa kuifanya njia ya pamoja iwe rejeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya kuenenda imehifadhiwa, huku sentensi ikiwekwa katika mtiririko wa asili wa Kiswahili.
