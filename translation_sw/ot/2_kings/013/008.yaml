base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/008.yaml
  text: The rest of the acts of Jehoahaz[a], and all that he did[b], and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: sw
  text: Matendo mengine ya Yehoahazi, na mambo yote aliyofanya, na ushujaa wake[a]—je, hayo hayakuandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguvu zake” au “matendo yake makuu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Kitabu cha Kumbukumbu za Wafalme wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָחָז
  choice: Matendo mengine ya Yehoahazi
  rationale: Katika muhtasari wa utawala wa mfalme, דִּבְרֵי humaanisha kwa upana matendo au mambo yanayohusu mfalme, si maneno aliyosema tu. “Matendo mengine” ni Kiswahili cha kawaida kinachowasilisha יֶתֶר kwa ufupi.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: mambo yote aliyofanya
  rationale: Hifadhi upana wa kishazi cha Kiebrania bila kukifungamanisha na mafanikio au matendo ya aina fulani.
- source_word: וּגְבוּרָתוֹ
  choice: na ushujaa wake
  rationale: גְּבוּרָה inaweza kumaanisha nguvu, ushujaa, au matendo makuu. “Ushujaa” ni neno la asili na lenye hadhi katika muktadha wa mfalme, huku tanbihi ikihifadhi maana mbadala.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: je, hayo hayakuandikwa
  rationale: Hili ni swali la balagha katika fomula ya muhtasari wa kifalme. “Hayo” linarejelea kwa wazi mambo yaliyotajwa na kuhifadhi wingi wa הֵם.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kimsingi ni “juu ya,” katika usemi wa kumbukumbu zilizoandikwa Kiswahili cha kawaida hutumia “katika kitabu.”
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: Mambo ya Nyakati za Wafalme wa Israeli
  rationale: דִּבְרֵי הַיָּמִים hapa ni kumbukumbu za kifalme. “Mambo ya Nyakati” ni tafsiri iliyozoeleka, huku tanbihi ikitoa “Kumbukumbu” kama mbadala wa maana.
