  text: וַ/יָּ֜שָׁב יְהוֹאָ֣שׁ בֶּן יְהוֹאָחָ֗ז וַ/יִּקַּ֤ח אֶת הֶֽ/עָרִים֙ מִ/יַּד֙ בֶּן הֲדַ֣ד בֶּן חֲזָאֵ֔ל אֲשֶׁ֣ר לָקַ֗ח מִ/יַּ֛ד יְהוֹאָחָ֥ז אָבִ֖י/ו בַּ/מִּלְחָמָ֑ה שָׁלֹ֤שׁ פְּעָמִים֙ הִכָּ֣/הוּ יוֹאָ֔שׁ וַ/יָּ֖שֶׁב אֶת עָרֵ֥י יִשְׂרָאֵֽל־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/025.yaml
  text: Then Jehoash son of Jehoahaz regained and took back the cities from the hand of Ben-hadad son of Hazael[a], which he had taken from the hand of Jehoahaz his father in war. Three times Joash struck him[b], and he restored the cities of Israel.
translation:
  language: sw
  text: Kisha Yehoashi mwana wa Yehoahazi akatwaa tena miji ile kutoka mikononi mwa Ben-Hadadi mwana wa Hazaeli[a], ambayo Ben-Hadadi alikuwa ameiteka kutoka mikononi mwa Yehoahazi, baba yake Yehoashi, vitani. Yoashi akamshinda mara tatu[b], akarejesha miji ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinatumia maumbo mawili ya jina lilelile la kifalme katika mstari huu: “Yehoashi” mwanzoni na “Yoashi” baadaye.'
    reason: lexical_alternative
  - marker: b
    text: Au “alimpiga.” Kitenzi cha Kiebrania kinaweza kumaanisha kupiga vitani, kwa maana ya kumshinda kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּקַּח
  choice: akayateka tena
  rationale: Vitenzi hivi kwa pamoja vinaeleza kurejesha chini ya mamlaka yake miji iliyokuwa imepotea; Kiswahili cha asili 'akayateka tena' huepuka urudufu usio wa lazima huku kikihifadhi wazo la kuipata tena.
- source_word: הֶעָרִים
  choice: miji
  rationale: Hili ndilo neno la kawaida kwa vituo vya watu, mara nyingi vilivyoimarishwa, katika simulizi hili la kihistoria.
- source_word: מִיַּד
  choice: kutoka mikononi mwa
  rationale: Nahau ya Kiebrania yenye maana ya kuondoa katika mamlaka au udhibiti wa mtu; 'kutoka mikononi mwa' ni nahau ya Kiswahili iliyo wazi na ya asili.
- source_word: בֶּן־הֲדַד בֶּן־חֲזָאֵל
  choice: Ben-hadadi mwana wa Hazaeli
  rationale: Majina yameandikwa kwa mwandiko unaofaa fonolojia na matumizi ya Biblia za Kiswahili.
- source_word: אֲשֶׁר לָקַח
  choice: ambayo alikuwa ameiteka
  rationale: Muundo unaonyesha tendo lililotangulia kabla ya Yehoashi kuiteka tena miji hiyo.
- source_word: בַּמִּלְחָמָה
  choice: vitani
  rationale: Ni Kiswahili cha kawaida na kifupi kinachoonyesha mazingira ya mapigano ya kijeshi.
- source_word: שָׁלֹשׁ פְּעָמִים הִכָּהוּ
  choice: alimshinda mara tatu
  rationale: Katika muktadha wa vita, נכה inaweza kumaanisha kumpiga au kumshinda; 'alimshinda' huwasilisha ushindi wa kijeshi bila kudokeza kwamba alimwua mara tatu.
- source_word: יְהוֹאָשׁ / יוֹאָשׁ
  choice: Yehoashi / Yoashi
  rationale: Tofauti ya maumbo mawili ya jina moja katika Kiebrania imehifadhiwa na kuelezwa katika tanbihi.
- source_word: וַיָּשֶׁב אֶת־עָרֵי יִשְׂרָאֵל
  choice: akairudisha miji ya Israeli
  rationale: Kitenzi hapa kina kitu cha moja kwa moja, miji, na humaanisha kuirudisha chini ya mamlaka ya Israeli.
theological_decisions:
- issue: Maana ya הִכָּהוּ katika vita
  choice: alimshinda
  alternative: alimpiga
  rationale: Muktadha wa mashambulizi matatu na kurejeshwa kwa miji unaunga mkono maana ya ushindi wa kijeshi, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Nahau 'kutoka mikononi mwa' imehifadhiwa kwa kuwa inaeleweka kwa urahisi; mpangilio wa sentensi umerekebishwa ili virejeshi vya miji viwe wazi.
