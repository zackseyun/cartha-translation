base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/010.yaml
  text: In the thirty-seventh year of Joash king of Judah[a], Jehoash son of Jehoahaz became king over Israel in Samaria, and he reigned sixteen years.
translation:
  language: sw
  text: Katika mwaka wa thelathini na saba wa utawala wa Yoashi mfalme wa Yuda[a], Yehoashi mwana wa Yehoahazi alianza kutawala Israeli katika Samaria, akatawala kwa miaka kumi na sita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutofautisha jina la mfalme wa Yuda, יוֹאָשׁ (Yoashi), na la mfalme wa Israeli, יְהוֹאָשׁ (Yehoashi); katika mapokeo fulani ya tafsiri, majina yote mawili huandikwa “Yoashi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁלֹשִׁים וָ/שֶׁבַע שָׁנָה
  choice: Katika mwaka wa thelathini na saba wa utawala
  rationale: Kauli ya Kiebrania ni fomula ya kutaja mwaka wa utawala; nyongeza ya 'wa utawala' hufanya rejeleo la mwaka lieleweke kwa Kiswahili cha kawaida.
- source_word: לְ/יוֹאָשׁ מֶלֶךְ יְהוּדָה
  choice: wa Yoashi mfalme wa Yuda
  rationale: Herufi ל huonyesha kuwa mwaka huo unahesabiwa katika utawala wa Yoashi; 'mfalme wa Yuda' ni maelezo ya utambulisho.
- source_word: מָלַךְ
  choice: alianza kutawala
  rationale: Katika taarifa hii ya kifalme, kitenzi kina maana ya kuingia au kuanza katika ufalme, huku muda wote wa utawala ukitajwa baadaye.
- source_word: יְהוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: Yehoashi mwana wa Yehoahazi
  rationale: Tahajia ya jina la mfalme wa Israeli יְהוֹאָשׁ imetofautishwa na יוֹאָשׁ la mfalme wa Yuda kwa kutumia 'Yehoashi' dhidi ya 'Yoashi'.
- source_word: עַל יִשְׂרָאֵל
  choice: kutawala Israeli
  rationale: עַל pamoja na מלך huonyesha kutawala watu au nchi; Kiswahili hutumia kitenzi 'kutawala' moja kwa moja pamoja na yambwa 'Israeli'.
- source_word: בְּ/שֹׁמְרוֹן
  choice: huko Samaria
  rationale: ב huonyesha mahali; 'huko Samaria' hutambulisha kwa kawaida mji uliokuwa makao ya utawala.
- source_word: שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: kwa miaka kumi na sita
  rationale: Kirai hiki kinaonyesha muda wa utawala; 'kwa miaka kumi na sita' ni Kiswahili cha kawaida na wazi.
