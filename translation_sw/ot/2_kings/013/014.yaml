base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/014.yaml
  text: Elisha had become sick with the illness from which he would die[a]. And Joash king of Israel went down to him and wept over him and said, “My father[b], my father! The chariots of Israel and its horsemen!”
translation:
  language: sw
  text: Elisha alikuwa ameugua ugonjwa ambao angekufa nao. Naye Yoashi, mfalme wa Israeli, akateremka kwenda kwake, akamlilia[a] na kusema, “Baba yangu[b], baba yangu! Magari ya vita ya Israeli na wapanda farasi wa Israeli!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “akalia juu ya uso wake.”
    reason: lexical_alternative
  - marker: b
    text: Kilio hiki kinarudia maneno ya 2 Wafalme 2:12, ambapo Elisha alimwambia Eliya maneno hayohayo.
    reason: cross_reference
lexical_decisions:
- source_word: חָלָה אֶת חָלְיוֹ
  choice: alikuwa amekuwa mgonjwa kwa ugonjwa
  rationale: Kirai hiki kinahifadhi msisitizo wa Kiebrania unaotumia kitenzi na nomino zenye mzizi mmoja, huku wakati timilifu ukitoa hali ya usuli kabla ya kuwasili kwa Yoashi.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: ambao ungemwua
  rationale: Hii inaonyesha kutoka kwa mtazamo wa simulizi kwamba huo ndio ugonjwa ambao ungeleta kifo chake; Kiswahili hiki ni cha kawaida na kinaweka wazi uhusiano wa kisababishi.
- source_word: וַיֵּרֶד אֵלָיו
  choice: akateremka kwenda kumwona
  rationale: ‘Akateremka’ huhifadhi maelezo ya mwelekeo katika ירד; ‘kwenda kumwona’ huwasilisha kwa kawaida kwamba Yoashi alikwenda kwa Elisha.
- source_word: וַיֵּבְךְּ עַל־פָּנָיו
  choice: akamlilia
  rationale: Kiebrania halisi ni ‘akalia juu ya uso wake,’ lakini katika muktadha kinaeleza kumlilia Elisha akiwa mbele yake au ameinama juu yake. ‘Akamlilia’ ni Kiswahili asilia bila kulazimisha picha isiyo wazi.
- source_word: אָבִי אָבִי
  choice: Baba yangu, baba yangu!
  rationale: Huhifadhi viambishi vya umilikaji, urudiaji, heshima, na nguvu ya maombolezo.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: Gari la vita la Israeli na wapanda farasi wake!
  rationale: רֶכֶב iko katika umoja wa kisarufi, hivyo ‘gari la vita’ linafuata umbo la Kiebrania. Sitiari imeachwa bila kufafanuliwa ili kuhifadhi mwangwi na utata wake.
theological_decisions:
- issue: Nguvu ya kisitiari ya ‘gari la vita la Israeli na wapanda farasi wake’
  choice: Kauli imehifadhiwa kama mshangao wa moja kwa moja unaoelekezwa kwa Elisha bila kuongeza ufafanuzi katika matini.
  alternative: Kuifafanua kwamba Elisha ndiye ulinzi wa kweli wa Israeli, au kuichukulia kama taarifa ya maono ya magari ya mbinguni.
  rationale: Muktadha na mwangwi wa 2 Wafalme 2:12 unaonyesha umuhimu wa kinabii, lakini tafsiri haipaswi kuondoa mvutano wa sitiari kwa kuigeuza kuwa maelezo ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia ‘naye’ na vitenzi vya mfululizo kwa mtiririko wa kawaida. Sitiari ya mwisho imehifadhiwa, na viashiria vyote vya tanbihi [a], [b] vimo katika matini.
