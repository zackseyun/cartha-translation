base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/004.yaml
  text: Then Jehoahaz sought the favor of Yahweh[a], and Yahweh listened to him, for he saw the oppression of Israel[b], because the king of Aram oppressed them.
translation:
  language: sw
  text: Ndipo Yehoahazi akamsihi Yahwe[a], naye Yahwe akamsikiliza, kwa maana aliona ukandamizaji wa Israeli, kwa sababu mfalme wa Aramu[b] alikuwa akiwakandamiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akatafuta kibali cha Yahwe”; kihalisi, nahau hiyo hutaja “uso wa Yahwe” na humaanisha kumsihi au kutafuta kibali chake.
    reason: lexical_alternative
  - marker: b
    text: Aramu ni jina la Kiebrania la eneo ambalo katika tafsiri nyingine huitwa Siria.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: akamsihi Yahwe
  rationale: Nahau hii ina maana ya kumwomba mtu kwa bidii au kutafuta kibali chake. “Akamsihi” ni Kiswahili cha kawaida kinachoonyesha ombi la dhati bila kutafsiri neno “uso” kwa namna ngumu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetoholewa moja kwa moja kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: akamsikiliza
  rationale: Kitenzi שׁמע pamoja na אֶל hapa kinamaanisha kusikiliza au kuitikia ombi, si kusikia sauti tu. “Akamsikiliza” hakizidishi maelezo ya matokeo.
- source_word: כִּי רָאָה
  choice: kwa maana aliona
  rationale: כִּי ya kwanza inatoa sababu ya Yahwe kumsikiliza Yehoahazi.
- source_word: לַחַץ יִשְׂרָאֵל
  choice: jinsi watu wa Israeli walivyokandamizwa
  rationale: לַחַץ inaonyesha dhiki au ukandamizaji uliosababishwa na adui. Muundo huu wa Kiswahili unaweka wazi kwamba Israeli ndio waliotendewa ukandamizaji, huku “watu wa” ikifafanua rejeo la pamoja.
- source_word: כִּי לָחַץ אֹתָם
  choice: kwa sababu ... alikuwa akiwakandamiza
  rationale: כִּי ya pili inaeleza chanzo cha ukandamizaji, na hali ya kuendelea inaonyesha shinikizo la wakati huo. Kurudia mzizi kwa “walivyokandamizwa/akiwakandamiza” kunaakisi marudio ya לַחַץ katika Kiebrania.
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: “Aramu” linahifadhi jina la mahali la Kiebrania badala ya kulibadilisha kuwa jina la baadaye, “Siria”.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Kifungu kinatumia jina binafsi la Mungu, YHWH. “Yahwe” huhifadhi jina hilo badala ya kuweka cheo mahali pake.
- issue: Nahau וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: akamsihi Yahwe
  alternative: akatafuta kibali cha Yahwe; akaulainisha uso wa Yahwe
  rationale: “Akamsihi” hutoa maana ya ombi la bidii kwa lugha ya kawaida bila kuingiza hitimisho kwamba tayari alimridhisha Mungu. Tafsiri halisi ya “uso” imewekwa katika tanbihi kwa sababu ni nahau.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. “Akamsihi” na “akamsikiliza” ni maneno ya sasa yanayoeleweka kwa urahisi; “alikuwa akiwakandamiza” huhifadhi hali ya ukandamizaji uliokuwa ukiendelea.
