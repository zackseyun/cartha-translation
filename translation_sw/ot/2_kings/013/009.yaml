translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kusomeka. Nahau ya kifalme ya kifo imehifadhiwa kwa ‘akalala pamoja na mababu zake.’ Kidokezo cha Kiingereza kuhusu tofauti ya majina hakikuhamishwa kwa kuwa kinahusu hasa mapokeo ya tafsiri za Kiingereza, si ushahidi wa lazima wa maandishi ya Kiebrania katika mstari huu.
