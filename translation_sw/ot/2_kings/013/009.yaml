  text: Yehoahazi akalala na mababu zake, nao wakamzika Samaria. Kisha Yoashi mwanawe akatawala badala yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Katika kauli ya kifalme inayofuatiwa na ‘pamoja na mababu zake,’ kitenzi hiki ni nahau ya kifo. ‘Akalala’ kinahifadhi taswira ya Kiebrania bila kuifanya moja kwa moja kuwa ‘akafa.’
- source_word: עִם אֲבֹתָיו
  choice: pamoja na mababu zake
  rationale: ‘Mababu’ ni Kiswahili cha kawaida na chenye heshima kwa waliotangulia katika ukoo; kinaepuka maana finyu ya baba wa moja kwa moja.
- source_word: וַיִּקְבְּרֻהוּ
  choice: nao wakamzika
  rationale: Umbo la Kiebrania ni nafsi ya tatu wingi yenye yambwa, hivyo kauli tendaji ya wahusika wasiotajwa imehifadhiwa.
- source_word: בְּשֹׁמְרוֹן
  choice: huko Samaria
  rationale: Kiambishi ב kinaonyesha mahali pa maziko; ‘huko Samaria’ ni usemi wa asili katika Kiswahili.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika taarifa ya urithi wa kifalme, kitenzi kinaweza kumaanisha kushika ufalme na kutawala; ‘akatawala’ ni kifupi na cha kawaida.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Kifungu kinaonyesha mwana kuchukua nafasi ya baba yake katika urithi wa kifalme.
- source_word: יְהוֹאָחָז
  choice: Yehoahazi
  rationale: Jina limetolewa kwa umbo linalotumika katika mapokeo ya Biblia ya Kiswahili.
- source_word: יוֹאָשׁ
  choice: Yoashi
  rationale: Hili linafuata umbo la Kiebrania יוֹאָשׁ na matumizi yanayoeleweka katika Biblia ya Kiswahili.
