  text: Then Elisha died, and they buried him. Now raiding bands of Moab used to come into the land at the coming of the year.
translation:
  language: sw
  text: Kisha Elisha akafa, wakamzika. Makundi ya wavamizi wa Moabu yalikuwa yakiingia nchini wakati wa kuanza kwa mwaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa majira ya kuchipua.” Kiebrania kinasema kihalisi, “wakati mwaka unapowadia,” yaani kipindi cha kuanza kwa mwaka, ambacho mara nyingi kilihusishwa na msimu wa kwenda vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Kisha ... akafa
  rationale: Waw ya kisimulizi inaendeleza mfuatano wa matukio; “Kisha” ni ya kawaida katika Kiswahili na kitenzi “akafa” kinadumisha maana rahisi ya מות.
- source_word: אֱלִישָׁע
  choice: Elisha
  rationale: Hili ndilo umbo la jina linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: וַיִּקְבְּרֻהוּ
  choice: wakamzika
  rationale: 'Kiebrania kina kitenzi cha kutenda katika wingi na kiambishi cha mtendwa nafsi ya tatu umoja: kihalisi, “wakazika yeye.” Kiswahili “wakamzika” huhifadhi muundo huo kwa asili.'
- source_word: גְדוּדֵי מוֹאָב
  choice: makundi ya wavamizi kutoka Moabu
  rationale: גְּדוּד huashiria mara nyingi kundi la watu wanaofanya mashambulizi ya kuvamia kuliko jeshi rasmi; “kutoka Moabu” huonyesha uhusiano wa kundi hilo na Moabu kwa Kiswahili cha kawaida.
- source_word: יָבֹאוּ
  choice: yalikuwa yakija
  rationale: Ingawa umbo hilo ni imperfect, hapa linaeleza tendo la mazoea lililorudiwa; “yalikuwa yakija” huwasilisha maana hiyo bila kulifanya tukio la mara moja.
- source_word: בָאָרֶץ
  choice: nchini
  rationale: Pamoja na בוא, kirai hiki kina wazo la kuingia katika nchi; “yakija nchini” ni Kiswahili cha asili kinachobeba mwelekeo huo.
- source_word: בָּא שָׁנָה
  choice: mwanzoni mwa mwaka
  rationale: Kihalisi ni “wakati mwaka unapoingia/kuja.” “Mwanzoni mwa mwaka” huwasilisha nahau hiyo kwa Kiswahili kinachoeleweka, huku tanbihi ikihifadhi uwezekano wa kurejelea majira ya kuchipua na msimu wa vita.
