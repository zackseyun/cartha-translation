lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Mfuatano wa simulizi unaonyeshwa kwa “Ndipo,” huku “akamwambia” ikiwasilisha tendo la kusema pamoja na yule aliyeambiwa kwa Kiswahili cha kawaida.
- source_word: אֱלִישָׁע
  choice: Elisha
  rationale: Jina limetolewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: קַח
  choice: Chukua
  rationale: Ni amri ya moja kwa moja ya kitenzi לקח, na “chukua” ni sawa ya kawaida na ya wazi katika muktadha huu.
- source_word: קֶשֶׁת וְחִצִּים
  choice: upinde na mishale
  rationale: Maneno hayo yanataja silaha ya upinde na mishale mingi; Kiswahili hakihitaji kibainishi kisicho dhahiri kama ‘a’ ya Kiingereza.
- source_word: וַיִּקַּח
  choice: Basi akachukua
  rationale: “Basi” na umbo la mfululizo “akachukua” vinaonyesha hatua iliyofuata kama kuitikia amri.
- source_word: אֵלָיו
  choice: akamletea
  rationale: אֶל pamoja na kiambishi cha nafsi ya tatu ya kiume huonyesha mwelekeo ‘kwake’; “akamletea” huiweka wazi kwa Kiswahili kwamba vitu vilichukuliwa na kupelekwa kwa Elisha, bila kuacha neno la Kiebrania lisitafsiriwe.
