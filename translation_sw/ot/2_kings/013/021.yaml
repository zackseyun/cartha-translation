base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/021.yaml
  text: And it happened, as they were burying a man, that behold, they saw the raiding band; so they threw the man into Elisha’s grave. And when the man went and touched Elisha’s bones, he came to life and stood up on his feet.
translation:
  language: sw
  text: Walipokuwa wakimzika mtu mmoja, ghafla wakaona kikosi cha wavamizi; basi wakamtupa mtu huyo ndani ya kaburi la Elisha. Mtu huyo alipogusa mifupa ya Elisha[a], akapata uhai tena, akasimama kwa miguu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, Kiebrania kinasema, “mtu huyo akaenda, akaigusa mifupa ya Elisha.”
    reason: Muundo wa Kiebrania si wa kawaida katika muktadha wa maiti iliyotupwa kaburini. Tafsiri kuu inaeleza tendo la kugusa kwa muktadha, huku tanbihi ikihifadhi neno “akaenda” na utata wa chanzo.
lexical_decisions:
- source_word: הַגְּדוּד
  choice: kikosi cha wavamizi
  rationale: Neno hili humaanisha kundi au kikosi kinachofanya uvamizi; tafsiri hii inaeleza kusudi lake kwa Kiswahili cha kawaida.
- source_word: וַיַּשְׁלִיכוּ אֶת־הָאִישׁ
  choice: wakamtupa mtu huyo
  rationale: Inahifadhi tendo la haraka na lenye nguvu la kitenzi cha Kiebrania bila kuongeza kwamba walimzika kwa utaratibu.
- source_word: וַיְחִי
  choice: akarudi kuwa hai
  rationale: Inaonyesha wazi kwamba mtu aliyekuwa amekufa alipata uhai tena, bila kuingiza maelezo ya ziada kuhusu jinsi muujiza huo ulivyotokea.
- source_word: וַיָּקָם עַל־רַגְלָיו
  choice: na kusimama kwa miguu yake
  rationale: Ni uhamisho wa moja kwa moja na wa kawaida wa picha ya Kiebrania kwamba alisimama kwa miguu yake mwenyewe.
theological_decisions:
- issue: Uhusiano kati ya kugusa mifupa ya Elisha na kurudi kwa mtu huyo kuwa hai
  choice: 'Tukio limesimuliwa kwa mfuatano tu: alipogusana na mifupa, akarudi kuwa hai.'
  alternative: Kusema kwamba mifupa yenyewe ilikuwa na nguvu ya kumfufua.
  rationale: Kiebrania kinasimulia tukio bila kueleza chanzo au utaratibu wa muujiza; tafsiri haipaswi kuongeza fundisho kuhusu nguvu ya mabaki ya mwili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha simulizi na chenye heshima. “Mara wakaona” linawakilisha mshangao wa וְהִנֵּה kwa namna ya asili; sentensi fupi zinadumisha kasi ya tukio.
