base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/039.yaml
  text: Then one man went out into the field to gather herbs[a], and he found a wild vine and gathered from it wild gourds, filling his garment. Then he came and sliced them into the pot of stew[c][b], though they did not know what they were.
translation:
  language: sw
  text: Kisha mtu mmoja akaenda shambani kukusanya mboga za majani[a]. Akapata mmea wa kutambaa wa porini, akachuma kutoka humo maboga ya mwituni[b], hata akajaza vazi lake. Kisha akarudi, akayakata-kata na kuyatia ndani ya chungu cha kitoweo, kwa maana hawakuyajua[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mimea ya kuliwa.” Neno la Kiebrania linarejelea kwa upana mimea inayokusanywa shambani ili kuliwa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mzabibu wa shambani” na “maboga ya shambani”; yaani, mmea wa kutambaa wa porini wenye matunda hayo. Huenda yalikuwa matunda yanayoitwa colocynth, lakini utambulisho wake si hakika.
    reason: lexical_alternative
  - marker: c
    text: Au, “ingawa hawakuyajua.” Kiunganishi cha Kiebrania kinaweza kueleweka kuwa kinatoa sababu au maelezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד
  choice: mtu mmoja
  rationale: Neno hili limetumiwa kama nomino kumaanisha mtu mmoja katika kundi; tafsiri hii ni ya kawaida na inahifadhi umoja wa rejeleo.
- source_word: לְלַקֵּט אֹרֹת
  choice: kukusanya mboga za majani
  rationale: אֹרֹת ni mimea ya kuliwa inayokusanywa shambani; ‘mboga za majani’ ni wazi na ya kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: גֶּפֶן שָׂדֶה
  choice: mzabibu wa mwituni
  rationale: Kirai hiki kinaeleza mzabibu ulioota bila kulimwa; ‘wa mwituni’ huwasilisha maana hiyo kwa lugha ya kawaida.
- source_word: פַּקֻּעֹת שָׂדֶה
  choice: maboga ya mwituni
  rationale: Jina linaelekea kurejelea matunda kama maboga, huenda colocynth, lakini ‘maboga ya mwituni’ huepuka usahihi wa kupita kiasi.
- source_word: מְלֹא בִגְדוֹ
  choice: hata akajaza vazi lake
  rationale: Kirai kinaonyesha kiasi kilichojaza vazi lake, ambalo lilitumika kubebea alichokusanya; picha ya asili imehifadhiwa.
- source_word: וַיְפַלַּח
  choice: kuyakata-kata
  rationale: Kitenzi kina maana ya kupasua au kukata vipande; uradidi unaeleza kwa kawaida kitendo cha kukata matunda hayo vipande.
- source_word: סִיר הַנָּזִיד
  choice: chungu cha mchuzi
  rationale: נָזִיד ni chakula cha majimaji kilichopikwa; ‘chungu cha mchuzi’ ni usemi wa kawaida, ingawa ‘kitoweo’ pia kinawezekana.
- source_word: כִּי לֹא יָדָעוּ
  choice: kwa maana hawakuyajua
  rationale: כִּי hapa inaweza kutoa sababu au maelezo. ‘Kwa maana’ huhifadhi uhusiano huo, na kiambishi cha kitu ‘-ya-’ kinarejelea maboga bila kuongeza maelezo yasiyo katika Kiebrania.
