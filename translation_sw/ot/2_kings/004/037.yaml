  text: Then she came and fell at his feet and bowed to the ground[a]. Then she picked up her son and went out.
translation:
  language: sw
  text: Ndipo akaja, akaanguka miguuni pake, akajinama hadi nchi[a]. Kisha akamwinua mwanawe, akatoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akajilaza kifudifudi hadi nchi.” Kitenzi cha Kiebrania kinaweza pia kutafsiriwa “akaabudu” katika mazingira mengine, lakini hapa yaelekea kinaonyesha heshima kubwa kwa Elisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Ndipo akaja
  rationale: Muundo wa simulizi unaendeleza mfuatano wa matukio; “ndipo” na “akaja” huutoa kwa Kiswahili cha kawaida bila kurudia kiunganishi “na” kwa namna isiyo ya lazima.
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: akaanguka miguuni pake
  rationale: Hii inaonyesha tendo la kujishusha mbele ya Elisha. “Miguuni pake” ni usemi wa kawaida wa Kiswahili na huepuka tafsiri ngumu ya moja kwa moja ya “juu ya miguu yake.”
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: akainama mpaka chini
  rationale: Kitenzi kinaweza kumaanisha kuinama sana au kujilaza kifudifudi, na katika mazingira mengine kuabudu. Hapa tafsiri inaonyesha ishara ya kimwili ya heshima na shukrani mbele ya Elisha bila kuamua kwamba alikuwa akimwabudu.
- source_word: וַתִּשָּׂא אֶת בְּנָהּ
  choice: akamwinua mwanawe
  rationale: Kitenzi נשׂא kina wigo wa maana wa kuinua, kuchukua, au kubeba. “Akamwinua mwanawe” huhifadhi tendo halisi linaloelezwa katika simulizi.
- source_word: וַתֵּצֵא
  choice: akatoka
  rationale: Hii ndiyo tafsiri rahisi na ya moja kwa moja ya יצא katika mwendo wa simulizi.
theological_decisions:
- issue: Maana ya וַתִּשְׁתַּחוּ kuhusiana na Elisha
  choice: Imefasiriwa kuwa tendo la kuinama sana mbele ya Elisha kwa heshima na shukrani.
  alternative: “Akasujudu” au “akaabudu,” kwa kuwa kitenzi hicho kinaweza kutumiwa kuhusu ibada katika mazingira mengine.
  rationale: Muktadha unaeleza tendo la mwanamke mbele ya Elisha baada ya mwanawe kufufuliwa. “Akainama mpaka chini” huhifadhi ishara ya unyenyekevu bila kuingiza dai lisilo wazi kwamba alimwabudu Elisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa kawaida, wenye heshima na unaoeleweka kwa wasomaji wa leo. Mfuatano wa vitenzi vya “aka-” unadumisha mwendo wa simulizi la Kiebrania.
