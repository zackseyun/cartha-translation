base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/044.yaml
  text: So he set it before them[a], and they ate and had some left over, according to the word of Yahweh.
translation:
  language: sw
  text: Basi akaweka chakula mbele yao; nao wakala na wakabakiza[a], sawasawa na neno la Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na baadhi ya chakula kikabaki.”
    reason: Tofauti hii huonyesha matokeo—kwamba kulikuwa na chakula kilichobaki—ilhali maandishi ya Kiebrania kwa umbo lake la kisarufi yanaweza kutafsiriwa kwa karibu zaidi kuwa ‘wakabakiza.’
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akaweka chakula
  rationale: Kitenzi נתן kinaweza kumaanisha ‘kutoa’ au ‘kuweka.’ Pamoja na לִפְנֵיהֶם, maana ya ‘kuweka mbele yao’ inafaa katika muktadha wa kuandaa chakula. Neno ‘chakula’ limetolewa katika muktadha wa mstari uliotangulia ili Kiswahili kiwe wazi na cha kawaida.
- source_word: לִפְנֵיהֶם
  choice: mbele yao
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kishazi hiki, hasa chakula kinapowekwa ili watu wale.
- source_word: וַיֹּאכְלוּ
  choice: wakala
  rationale: Ni tafsiri ya moja kwa moja ya אכל katika mfuatano wa masimulizi.
- source_word: וַיּוֹתִרוּ
  choice: wakabakiza
  rationale: Hiphil ya יתר inaonyesha kwamba walibakiza sehemu baada ya kula. ‘Wakabakiza’ huhifadhi hali ya kitenzi na wingi wa mtendaji wa Kiebrania; tanbihi inatoa uwezekano wa kueleza matokeo kuwa chakula kilibaki.
- source_word: כִּדְבַר
  choice: sawasawa na neno la
  rationale: ‘Sawasawa na neno la’ huhifadhi rejeo rasmi kwa tamko lililotolewa, badala ya kulifanya tu kuwa ‘kama alivyosema.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetolewa kwa unukuzi ‘Yahweh,’ bila kulibadilisha kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu lenye herufi nne. ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa mabaki ya chakula na neno la Mungu
  choice: sawasawa na neno la Yahweh
  alternative: kama Yahweh alivyokuwa amesema
  rationale: Muundo huu huhifadhi neno דְבַר na kuonyesha kwamba kula na kubakiza kulitimiza tamko la Yahweh, bila kuongeza maelezo ya kitheolojia yasiyokuwapo katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida lakini wenye hadhi. ‘Basi’ linaendeleza simulizi; ‘sawasawa na neno la’ linahifadhi mtindo wa kinabii. Alama ya tanbihi imewekwa kwenye kishazi kinachohusika moja kwa moja na tofauti ya kileksika.
