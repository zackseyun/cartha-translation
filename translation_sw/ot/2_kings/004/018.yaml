lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: akakua
  rationale: Kitenzi גדל hapa kinaeleza kukua kwa mtoto. “Akakua” ni tafsiri ya kawaida na haiongezi wazo pana zaidi la kwamba alikuwa amemaliza kukua.
- source_word: הַיָּלֶד
  choice: mvulana huyo
  rationale: יֶלֶד yaweza kumaanisha mtoto au mvulana. Muktadha na maumbo ya kiume yanaunga mkono “mvulana,” huku kibadala kisichoainisha jinsia kikihifadhiwa katika tanbihi.
- source_word: וַיְהִי הַיּוֹם
  choice: siku moja
  rationale: Hii ni nahau ya Kiebrania inayoanzisha tukio fulani katika simulizi. “Siku moja” ni Kiswahili cha asili na kinawasilisha kazi ya nahau hiyo.
- source_word: וַיֵּצֵא
  choice: akatoka kwenda
  rationale: יצא hubeba maana ya kutoka na kuelekea nje; “akatoka kwenda” huhifadhi mwendo huo kwa Kiswahili kinachoeleweka.
- source_word: אֶל אָבִיו
  choice: kwa baba yake
  rationale: אֶל huonyesha kuelekea kwa mtu au mahali. “Kwa baba yake” ni usemi wa kawaida wa Kiswahili.
- source_word: אֶל הַקֹּצְרִים
  choice: kule kwa wavunaji
  rationale: קֹצְרִים ni watu wanaokata mazao wakati wa mavuno. “Wavunaji” ni neno la kawaida, na “kule kwa” huhifadhi wazo la kuelekea mahali walipokuwa bila kulazimisha zaidi uhusiano wa baba na kundi hilo.
