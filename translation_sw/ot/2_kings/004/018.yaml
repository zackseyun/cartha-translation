translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Mfuatano wa vitenzi vyenye kiambishi -ka- unadumisha mwendo wa simulizi la Kiebrania; “kule kwa wavunaji” huwasilisha kirai cha pili cha mwelekeo kwa njia ya asili.
