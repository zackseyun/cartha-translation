  text: Mvulana huyo akakua.[a] Siku moja,[b] akatoka akamwendea baba yake, kwa wavunaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtoto huyo.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “ikawa siku”; hii ni nahau yenye maana ya “siku moja” au “siku hiyo ilipofika.”
