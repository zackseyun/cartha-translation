base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/040.yaml
  text: So they poured it out for the men to eat. But as they were eating from the stew[a], they cried out and said, “There is death in the pot, man of God!” And they could not eat.
translation:
  language: sw
  text: Basi wakawamiminia wanaume wale mchuzi ili wale. Lakini walipokuwa wakila mchuzi huo, wakapaza sauti wakisema, “Kuna mauti ndani ya chungu,[a] ee mtu wa Mungu!” Nao hawakuweza kula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mauti ndani ya chungu.” Huenda maneno haya yakamaanisha kwamba mchuzi huo ulikuwa na sumu au ungeweza kuua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְקוּ
  choice: wakawamiminia
  rationale: Kitenzi יצק humaanisha kumimina. Tafsiri hii inadumisha tendo halisi la kumimina mchuzi ili kuwagawia waliokusanyika.
- source_word: לַאֲנָשִׁים
  choice: wanaume wale
  rationale: אֲנָשִׁים hapa inawarejelea wanaume waliokusanyika; uchaguzi huu unadumisha jinsia iliyo wazi katika chanzo.
- source_word: לֶאֱכֹל
  choice: ili wale
  rationale: 'Hii ni kauli ya kusudi iliyo wazi: walipewa chakula wapate kula.'
- source_word: כְּאָכְלָם מֵהַנָּזִיד
  choice: walipokuwa wakila mchuzi huo
  rationale: Muundo unaonyesha kitendo kilichokuwa kikiendelea walipogundua hatari. נָזִיד ni chakula kilichochemshwa chenye mchuzi; “mchuzi” ni neno la kawaida na linaloeleweka katika Kiswahili cha Afrika Mashariki katika muktadha huu.
- source_word: צָעָקוּ
  choice: wakapaza sauti
  rationale: Kitenzi kinaonyesha kilio kikubwa cha ghafula kutokana na hofu.
- source_word: מָוֶת בַּסִּיר
  choice: Kuna mauti ndani ya chungu
  rationale: Tafsiri hii inadumisha tamathali hai ya Kiebrania badala ya kuifasiri moja kwa moja kuwa sumu.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ee mtu wa Mungu
  rationale: “Mtu wa Mungu” ni cheo cha kawaida cha Elisha; “ee” huonyesha kwa ufasaha kwamba anasemeshwa moja kwa moja.
- source_word: וְלֹא יָכְלוּ לֶאֱכֹל
  choice: Nao hawakuweza kula
  rationale: Inafuata chanzo kwa karibu bila kuongeza kiwakilishi cha kitu ambacho hakipo wazi katika Kiebrania.
