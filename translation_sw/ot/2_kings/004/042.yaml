translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Yaani” huonyesha kwamba mikate ishirini ya shayiri inaeleza mikate ya malimbuko, huku “pamoja na” ikitenganisha nafaka kama kitu kingine katika orodha. Mtendaji wa kauli ya mwisho ametajwa kama “yule mtu wa Mungu” ili kuepuka utata wa viwakilishi katika Kiswahili.
