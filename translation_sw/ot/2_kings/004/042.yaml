base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/042.yaml
  text: And a man came from Baal-shalishah and brought to the man of God bread of the firstfruits[a], twenty loaves of barley, and fresh grain in his sack. And he said, “Give it to the people[b], so that they may eat.”
translation:
  language: sw
  text: Mtu mmoja akaja kutoka Baal-Shalisha, akamletea mtu wa Mungu mikate ya malimbuko—mikate ishirini ya shayiri—na nafaka changa[a] katika gunia lake.[b] Yule mtu wa Mungu akasema, “Wape watu ili wale.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafaka iliyokaangwa.” Neno la Kiebrania linaweza kumaanisha nafaka iliyotayarishwa ili kuliwa, si nafaka changa tu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “gunia” ni adimu na maana yake si hakika; huenda likamaanisha mfuko, kifuniko, au labda nafaka ikiwa bado katika maganda yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: mtu mmoja
  rationale: Nomino hii humaanisha mtu wa kiume; katika simulizi hili, “mtu mmoja” ni ya asili na haiongezi utambulisho ambao maandishi hayatoi.
- source_word: מִבַּעַל שָׁלִשָׁה
  choice: kutoka Baal-shalisha
  rationale: Hili ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Tafsiri hii inadumisha cheo halisi cha Kiebrania na mwangwi wake wa kifasihi badala ya kukibadili moja kwa moja kuwa “nabii.”
- source_word: לֶחֶם בִּכּוּרִים
  choice: mikate ya malimbuko
  rationale: Kirai hiki kinaonyesha mikate inayohusiana na mazao ya kwanza; “malimbuko” ni istilahi ya kawaida na yenye heshima katika Kiswahili cha Biblia.
- source_word: עֶשְׂרִים לֶחֶם שְׂעֹרִים
  choice: mikate ishirini ya shayiri
  rationale: Katika muktadha wa kuhesabu, לֶחֶם ina maana ya mikate; mpangilio huu ni wa kawaida katika Kiswahili.
- source_word: כַרְמֶל
  choice: nafaka changa
  rationale: Hapa neno linahusu nafaka katika hali mpya au iliyotayarishwa, si Mlima Karmeli. Tafsiri hii haisisitizi kupikwa kwake, huku uwezekano wa “nafaka iliyokaangwa” ukihifadhiwa katika tanbihi.
- source_word: בְּצִקְלֹנוֹ
  choice: katika gunia lake
  rationale: Nomino hii ni adimu na maana yake si hakika. Inaelekea kutaja chombo au kifuniko cha kubebea nafaka; “gunia” hutoa maana inayoeleweka, huku kutokuwa na uhakika kukielezwa katika tanbihi.
- source_word: תֵּן לָעָם וְיֹאכֵלוּ
  choice: Wape watu ili wale
  rationale: Amri ikifuatwa na kitenzi hiki huonyesha kusudi au matokeo yaliyokusudiwa. Kiswahili hakihitaji kutaja kiwakilishi cha kitu hapa kwa sababu chakula kilichotajwa kinaeleweka.
