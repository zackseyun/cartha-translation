lexical_decisions:
- source_word: וַתַּהַר
  choice: akapata mimba
  rationale: Kitenzi הרה kinaonyesha kushika au kupata mimba; “akapata mimba” ni Kiswahili cha kawaida na kinachofaa katika simulizi.
- source_word: הָאִשָּׁה
  choice: yule mwanamke
  rationale: אִשָּׁה hapa humrejelea mwanamke Mshunemu ambaye tayari ametambulishwa; “yule mwanamke” hudumisha rejeleo hilo la kisimulizi.
- source_word: וַתֵּלֶד בֵּן
  choice: akazaa mwana
  rationale: ילד pamoja na בֵּן ni usemi wa kawaida wa kuzaa mtoto wa kiume; “akazaa mwana” ni wa asili na wenye hadhi.
- source_word: לַמּוֹעֵד הַזֶּה
  choice: wakati ule uliowekwa
  rationale: מוֹעֵד ni wakati ulioteuliwa au uliowekwa. Katika simulizi linalotazama nyuma, “ule” hurejelea kwa kawaida wakati uliotajwa hapo awali.
- source_word: כָּעֵת חַיָּה
  choice: majira kama hayo mwaka uliofuata
  rationale: Huu ni usemi wa Kiebrania unaoelekeza kwenye takribani majira hayo katika mwaka uliofuata; tafsiri hii huwasilisha maana ya muda bila kulazimisha usemi halisi usio wazi kwa Kiswahili.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיהָ
  choice: kama vile Elisha alivyomwambia
  rationale: Kishazi hiki huonyesha kuwa tukio lilitimiza neno la Elisha. “Kama vile” hudumisha ulinganifu huo, na “alivyomwambia” ni ya asili katika Kiswahili.
- source_word: אֱלִישָׁע
  choice: Elisha
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Biblia za Kiswahili.
