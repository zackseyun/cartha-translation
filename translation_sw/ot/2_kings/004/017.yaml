  text: So the woman conceived and bore a son at that appointed time[a], about this time next year, just as Elisha had spoken to her.
translation:
  language: sw
  text: Basi yule mwanamke akapata mimba, akazaa mwana wakati ule uliowekwa[a], majira kama hayo mwaka uliofuata, kama vile Elisha alivyomwambia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wakati huu uliowekwa, wakati wa uhai”; ni usemi unaomaanisha takribani majira kama hayo mwaka uliofuata.'
