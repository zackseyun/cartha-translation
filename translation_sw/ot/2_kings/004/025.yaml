base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/025.yaml
  text: So she went and came to the man of God at Mount Carmel. And when the man of God saw her from a distance[a], he said to Gehazi his servant, “Look, that Shunammite woman.”
translation:
  language: sw
  text: Basi akaenda akafika kwa mtu wa Mungu kwenye Mlima Karmeli. Mtu wa Mungu alipomwona kwa mbali[a], akamwambia Gehazi, mtumishi wake, “Tazama, yule mwanamke wa Shunemu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akiwa bado mbali.” Usemi wa Kiebrania unaonyesha kwamba alimwona akiwa bado umbali fulani kutoka kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: Basi akaenda akafika
  rationale: Mfululizo wa vitenzi unasogeza simulizi mbele; ‘akaenda akafika’ ni Kiswahili cha kawaida na huhifadhi hatua zote mbili.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Huhifadhi moja kwa moja cheo cha Kiebrania bila kukifasiri kuwa ‘nabii.’
- source_word: אֶל הַר הַכַּרְמֶל
  choice: katika Mlima Karmeli
  rationale: Katika sentensi hii kirai kinaonyesha mahali alipokuwa mtu wa Mungu, huku mwendo kuelekea kwake ukiwakilishwa na ‘kwa mtu wa Mungu.’
- source_word: וַיְהִי כִּרְאוֹת
  choice: alipomwona
  rationale: Muundo huu huanzisha kishazi cha wakati; tafsiri hii ni ya asili katika Kiswahili bila kuongeza maneno yasiyohitajika.
- source_word: מִנֶּגֶד
  choice: kwa mbali
  rationale: Katika muktadha huu inaonyesha kwamba alimwona akiwa bado umbali fulani kutoka kwake.
- source_word: נַעֲרוֹ
  choice: mtumishi wake
  rationale: Ingawa neno hilo laweza kumaanisha kijana, hapa linaonyesha nafasi ya Gehazi kama mhudumu wa Elisha.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira za msikilizaji kwa mtu anayeonekana; ‘Tazama’ huhifadhi nguvu hiyo kwa lugha yenye hadhi.
- source_word: הַשּׁוּנַמִּית הַלָּז
  choice: yule mwanamke Mshunemu
  rationale: ‘Yule’ huonyesha mtu aliye mbali kiasi, na ‘Mshunemu’ huhifadhi utambulisho wake wa kutoka Shunemu.
