  yaml_path: translation/ot/2_kings/004/007.yaml
  text: Then she came and told the man of God[a], and he said, “Go, sell the oil, and pay your debts[b]; and you and your sons can live on what is left.”
translation:
  language: sw
  text: Kisha akaja akamweleza mtu wa Mungu. Naye akamwambia, “Nenda ukauze mafuta hayo, ulipe madeni yako[a]. Wewe na wana wako mtaishi kwa yaliyobaki[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uwalipe wadai wako,” ikiwa neno la Kiebrania linaeleweka kuwa linarejelea watu wanaodai badala ya madeni yenyewe.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa neno: “wewe na wana wako utaishi kwa yaliyobaki.” Kitenzi cha Kiebrania kiko katika umoja wa kike na kinamrejelea mwanamke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא וַתַּגֵּד
  choice: Kisha akaja akamweleza
  rationale: Vitenzi vya mfululizo vinaendeleza simulizi. “Akaja akamweleza” huhifadhi mwendo na tendo la kutoa taarifa kwa Kiswahili cha kawaida.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Huhifadhi cheo cha Kiebrania moja kwa moja badala ya kukifasiri tu kuwa “nabii.”
- source_word: לְכִי מִכְרִי
  choice: Nenda ukauze
  rationale: Amri mbili za umoja wa kike zinatolewa kwa mtiririko wa kawaida wa Kiswahili; ngeli ya jinsia haiwezi kuonyeshwa katika umbo la amri.
- source_word: אֶת הַשֶּׁמֶן
  choice: mafuta hayo
  rationale: “Mafuta” ndiyo maana ya msingi; kiashiria “hayo” kinatambulisha mafuta yaliyotajwa katika muktadha bila kuongeza kwamba ni mafuta ya zeituni.
- source_word: וְשַׁלְּמִי אֶת נִשְׁיֵךְ
  choice: ulipe madeni yako
  rationale: Katika muktadha wa fedha, שלם humaanisha kulipa, na umbo la נִשְׁיֵךְ linaeleweka vizuri zaidi kama madeni anayodaiwa, huku uwezekano wa kurejelea wadai ukiwekwa katika tanbihi.
- source_word: וְאַתְּ וּבָנַיִךְ
  choice: Wewe na wanao
  rationale: Kiebrania kinataja wana wa kiume waziwazi; “wanao” huhifadhi taarifa hiyo kwa lugha ya asili na yenye heshima.
- source_word: תִּחְיִי בַּנּוֹתָר
  choice: mtaishi kwa yaliyobaki
  rationale: Kauli hii inaonyesha kwamba mabaki ya mapato yatawategemeza. Umoja wa kitenzi cha Kiebrania umeelezwa katika tanbihi, huku Kiswahili kikitumia upatanisho wa kawaida wa kiima cha wingi.
