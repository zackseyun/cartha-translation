  text: When Elisha came into the house[a], behold, the boy was dead, laid on his bed.
translation:
  language: sw
  text: Elisha alipoingia ndani ya nyumba, tazama, yule mvulana alikuwa amekufa, amelazwa kitandani mwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa amelala kitandani mwake.” Umbo la Kiebrania linaweza kueleza hali ya kuwa amenyooshwa au amelala hapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: alipofika ndani
  rationale: Kauli hii inaendeleza simulizi kwa tendo lililopita; pamoja na הַבָּיְתָה inaonyesha kufika na kuingia ndani ya nyumba.
- source_word: אֱלִישָׁע
  choice: Elisha
  rationale: Jina limetolewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: הַבָּיְתָה
  choice: ya nyumba
  rationale: Nomino yenye he ya mwelekeo inaonyesha mwendo kuelekea au kuingia ndani ya nyumba; maana hiyo imewasilishwa katika kirai ‘alipofika ndani ya nyumba.’
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili huvuta uangalifu na kuwasilisha kwa uwazi jambo alilolikuta Elisha; ‘tazama’ huhifadhi nguvu hiyo ya kisimulizi kwa lugha yenye hadhi.
- source_word: הַנַּעַר
  choice: yule mvulana
  rationale: Katika muktadha huu נַעַר ni mwana wa mwanamke Mshunemu. ‘Mvulana’ ni ya kawaida na mahususi, huku ‘yule’ ikionyesha mhusika anayejulikana katika simulizi.
- source_word: מֵת
  choice: alikuwa amekufa
  rationale: Hueleza hali ya mvulana wakati Elisha alipofika. Kiswahili cha kawaida hutumia ‘alikuwa amekufa’ kueleza hali hiyo bila kuifanya kuwa tendo jipya katika mstari huu.
- source_word: מֻשְׁכָּב
  choice: amelazwa
  rationale: Umbo la kushurutishwa linaeleza hali iliyotokana na kulazwa au kuwekwa hapo, si tu tendo la kujilaza mwenyewe.
- source_word: עַל מִטָּתוֹ
  choice: juu ya kitanda chake
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha mahali pamoja na kiambishi cha umilikaji.
