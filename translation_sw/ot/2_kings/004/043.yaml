base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/043.yaml
  text: 'But his servant said[a], “How am I to set this before a hundred men?” And he said, “Give it to the people, and let them eat[b], for thus says Yahweh: ‘They shall eat and have some left over.’”'
translation:
  language: sw
  text: 'Lakini mtumishi wake akasema[a], “Nitawekaje chakula hiki mbele ya watu mia moja?” Naye akasema, “Wape watu chakula, ili wale[b], kwa maana Yahwe asema hivi: ‘Watakula, na chakula kitabaki.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitawezaje kuwapa watu mia moja chakula hiki?” Kiebrania kinasema kihalisi, “Nitoe nini hiki mbele ya watu mia moja?”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “watakula na kubakiza”; yaani, chakula kitabaki baada ya wao kula.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתוֹ
  choice: mtumishi wake
  rationale: Neno hili humaanisha mtu anayemhudumia mwingine katika nafasi binafsi au rasmi; “mtumishi wake” ni la kawaida, lenye heshima, na linafaa kwa uhusiano wake na Elisha.
- source_word: מָה אֶתֵּן זֶה לִפְנֵי מֵאָה אִישׁ
  choice: Nitawekaje chakula hiki mbele ya watu mia moja?
  rationale: Kauli ya Kiebrania ina picha halisi ya kuweka kitu mbele ya watu ili wale na inaonyesha mshangao kuhusu kutosheleza kwa chakula. Kuongeza “chakula” kunabainisha rejeo la זֶה kwa Kiswahili cha kawaida.
- source_word: מֵאָה אִישׁ
  choice: watu mia moja
  rationale: אִישׁ ni ya kiume kisarufi na hapa imetumiwa kwa mgawanyo baada ya namba; “watu mia moja” ndiyo namna ya kawaida ya Kiswahili na haiamui zaidi ya muktadha kuhusu jinsia ya kundi.
- source_word: תֵּן לָעָם
  choice: Wape watu wale
  rationale: עָם ni kundi la watu kwa pamoja. “Wape watu wale” ni amri ya asili katika Kiswahili na kishazi kinachofuata kinaweka wazi kuwa kinachotolewa ni chakula.
- source_word: וְיֹאכֵלוּ
  choice: ili wale
  rationale: Kitenzi baada ya amri kinaonyesha kusudi au matokeo yanayokusudiwa; “ili wale” kinatoa maana hiyo kwa Kiswahili fasaha.
- source_word: כִּי כֹה אָמַר יְהוָה
  choice: kwa maana Yahwe asema hivi
  rationale: Hii inahifadhi fomula ya kawaida ya ujumbe wa kinabii huku ikitumia mpangilio wa maneno unaoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limeandikwa moja kwa moja katika matini; “Yahwe” ni umbo linalofaa kifonolojia katika Kiswahili na linahifadhi jina badala ya kulibadilisha kuwa cheo.
- source_word: אָכֹל וְהוֹתֵר
  choice: Watakula, na chakula kingine kitabaki
  rationale: 'Muundo huu unahakikisha matokeo mawili: watu watakula na kutakuwa na masalio. Tafsiri inaweka wazi kwa Kiswahili kuwa kinachobaki ni chakula, bila kubadili ahadi.'
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia jina maalumu la Mungu, si cheo. “Yahwe” hulihifadhi jina hilo wazi huku likifuata maumbo ya sauti na tahajia yanayotumika kwa kawaida katika Kiswahili.
- issue: Nguvu ya ahadi katika אָכֹל וְהוֹתֵר
  choice: Watakula, na chakula kingine kitabaki
  alternative: Wale na waache masalio
  rationale: Muundo wa Kiebrania katika fomula ya kinabii unaonyesha uhakika wa matokeo, si amri kwa watu waache chakula kwa makusudi. Wakati ujao unahifadhi hakikisho hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha imewekwa rahisi kwa usomaji wa kawaida huku picha ya kuweka chakula mbele ya kundi, fomula ya kinabii, na uhakika wa masalio vikihifadhiwa.
