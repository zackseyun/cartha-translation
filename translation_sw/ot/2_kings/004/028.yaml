  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usinipotoshe,” au, “Usinipe tumaini la uongo.” Kitenzi cha Kiebrania kinaweza kumaanisha kumdanganya au kumpotosha mtu; hapa kinarejelea kuamsha tumaini ambalo hatimaye lingekuwa bure.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Akasema
  rationale: Waw ya masimulizi pamoja na אמר inaendeleza simulizi na kutambulisha maneno yake; “Akasema” ni ya kawaida na huhifadhi mwendelezo huo.
- source_word: הֲשָׁאַלְתִּי
  choice: Je, nilimwomba
  rationale: Kiulizi pamoja na שאל kinauliza swali la balagha kuhusu kama alikuwa ameomba apewe mtoto; wakati uliopita unafaa muktadha.
- source_word: בֵן
  choice: mwana
  rationale: Neno la Kiebrania linamaanisha mwana wa kiume, si mtoto kwa ujumla; “mwana” huhifadhi maana hiyo huku likiwa la heshima na la kawaida katika lugha ya Biblia.
- source_word: מֵאֵת אֲדֹנִי
  choice: bwana wangu
  rationale: Kirai hiki humtaja Elisha kwa heshima kama chanzo au mtu aliyeombwa; “bwana wangu” ni cheo cha heshima kwa mwanadamu hapa, wala si jina la Mungu.
- source_word: הֲלֹא אָמַרְתִּי
  choice: Je, sikusema
  rationale: Hili ni swali la pili la balagha linalokumbusha alichokuwa amesema hapo awali; “sikusema” hukaribia maana ya אמר bila kuongeza mtendewa ambaye ametajwa kwa muktadha tu.
- source_word: לֹא תַשְׁלֶה אֹתִי
  choice: Usinidanganye
  rationale: Hiphil ya שלה hapa inaweza kumaanisha kumdanganya au kumpotosha mtu, hasa kwa kuamsha tumaini ambalo baadaye litakuwa tupu. “Usinidanganye” ni kauli ya moja kwa moja na ya kawaida; uwezekano wa ‘kunipa tumaini la uongo’ umeelezwa katika tanbihi.
