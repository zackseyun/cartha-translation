base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/002.yaml
  text: And Elisha said to her[a], “What shall I do for you? Tell me, what do you have in the house?” And she said, “Your female servant has nothing at all in the house except a flask of oil.”
translation:
  language: sw
  text: Elisha akamwambia, “Nikufanyie nini? Niambie, una kitu gani nyumbani?” Naye akasema, “Mimi, mjakazi wako, sina chochote kabisa nyumbani isipokuwa chupa ndogo ya mafuta[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtungi mdogo wa mafuta”; neno la Kiebrania linamaanisha chombo kidogo cha kuhifadhia mafuta.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: Nikufanyie nini?
  rationale: Huwasilisha swali la Elisha kuhusu tendo analopaswa kumfanyia mwanamke kwa Kiswahili cha kawaida, huku likihifadhi wazo la kutenda kwa niaba yake.
- source_word: הַגִּידִי לִי
  choice: Niambie
  rationale: Ni amri ya moja kwa moja na ya asili; hakuna neno la Kiebrania linalolazimisha kuongeza ‘tafadhali’.
- source_word: מַה יֶּשׁ לָכִי בַּבָּיִת
  choice: una kitu gani nyumbani?
  rationale: Muundo wa uwepo pamoja na kihusishi cha mwenye kitu umeelezwa kwa kawaida kama umilikaji, huku mazingira ya nyumbani yakidumishwa.
- source_word: לְשִׁפְחָתְךָ
  choice: Mimi mtumishi wako
  rationale: Hifadhi namna ya mwanamke kujitaja kwa unyenyekevu mbele ya Elisha. Kiswahili hakihitaji kutaja jinsia katika nomino hii kwa kuwa muktadha tayari unaonyesha msemaji ni mwanamke.
- source_word: אֵין ... כֹל
  choice: sina chochote kabisa
  rationale: ‘Chochote kabisa’ huonyesha msisitizo wa ukanushaji uliopo katika אֵין pamoja na כֹל.
- source_word: כִּי אִם
  choice: isipokuwa
  rationale: Hutambulisha kwa uwazi kitu pekee kilichobaki baada ya kauli ya kutokuwa na kitu.
- source_word: אָסוּךְ שָׁמֶן
  choice: chupa ndogo ya mafuta
  rationale: אָסוּךְ ni chombo kidogo cha kuhifadhia mafuta; ‘chupa ndogo’ huonyesha ukubwa bila kuingiza maana ya matumizi ya kiibada.
