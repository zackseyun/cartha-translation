base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/016.yaml
  text: Then he said[a], "At this appointed time next year, you will be embracing a son." But she said, "No, my lord, man of God; do not deceive your servant."
translation:
  language: sw
  text: Kisha akasema, “Mwaka ujao, majira kama haya[a], utakuwa umemshika mwana mikononi.” Lakini akasema, “La, bwana wangu, mtu wa Mungu! Tafadhali usimdanganye mtumishi wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya karibu, “wakati kama huu wa uhai”; yaani, majira kama haya mwaka ujao.
    reason: Nahau ya Kiebrania כָּעֵת חַיָּה hurejelea, katika muktadha huu, wakati huohuo wa mwaka unaofuata. Tanbihi huhifadhi maana ya karibu ya nahau bila kuifanya matini kuu isiwe ya asili katika Kiswahili.
lexical_decisions:
- source_word: לַמּוֹעֵד הַזֶּה כָּעֵת חַיָּה
  choice: Majira kama haya mwakani
  rationale: Kirai hiki kinaunganisha wazo la wakati uliowekwa na nahau כָּעֵת חַיָּה, ambayo katika muktadha huu inaelekeza kwenye majira hayahaya mwaka unaofuata. Tafsiri hii ni ya kawaida katika Kiswahili, huku maana ya karibu zaidi ya nahau ikihifadhiwa katika tanbihi.
- source_word: אתי
  choice: utakuwa
  rationale: Kiwakilishi huru cha Kiebrania kinakazia kwamba mwanamke mwenyewe ndiye atakayemkumbatia mwana. Katika Kiswahili, nafsi tayari imo katika kiambishi u-; kuongeza “wewe” kungewezekana, lakini si lazima ili sentensi iwe ya asili.
- source_word: חֹבֶקֶת
  choice: umemkumbatia
  rationale: Kitenzi kina maana ya kukumbatia au kushika mikononi. “Umemkumbatia” kinadumisha taswira hai ya mama akiwa amemshika mwanawe mikononi.
- source_word: בֵּן
  choice: mwana
  rationale: Neno la Kiebrania linataja mwana wa kiume, si mtoto kwa ujumla. “Mwana” ni la heshima na la kawaida katika mtindo wa kibiblia wa Kiswahili.
- source_word: אַל
  choice: La
  rationale: Hapa neno la kwanza la kukanusha ni mshangao wa hisia katika jibu la mwanamke, si amri pekee. “La” linaonyesha kukataa kwake kwa hofu na kutokuamini.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Ni namna ya heshima ya kumwambia Elisha. “Bwana wangu” huhifadhi heshima hiyo bila kumaanisha kwamba anazungumza na Mungu.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ni jina la kawaida la Kiebrania kwa nabii au mtu aliyewekwa wakfu kwa huduma ya Mungu. “Mtu wa Mungu” ni tafsiri sahihi na iliyozoeleka katika Kiswahili.
- source_word: תְּכַזֵּב
  choice: usimdanganye
  rationale: Kitenzi kinaweza kumaanisha kusema uongo, kudanganya, au kuthibitika kuwa si kweli. Katika muktadha huu mwanamke anaomba asipewe tumaini ambalo halitatimia; “usimdanganye” huhifadhi maana ya moja kwa moja na uzito wa kihisia.
- source_word: בְּשִׁפְחָתֶךָ
  choice: mtumishi wako
  rationale: Neno la Kiebrania ni la jinsia ya kike na ni namna ya kujishusha mbele ya mwenye cheo. Kwa kuwa msemaji ametambulishwa wazi kuwa mwanamke, “mtumishi wako” ni ya asili na hudumisha unyenyekevu wake.
theological_decisions:
- issue: Maana ya heshima katika אֲדֹנִי
  choice: bwana wangu
  alternative: mheshimiwa wangu; mkuu wangu
  rationale: Anayeambiwa ni Elisha, si Mungu. Tafsiri hii hudumisha heshima ya kijamii katika hotuba bila kulipa neno hilo maana ya kiungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. “Majira kama haya mwakani” ni ya asili kuliko tafsiri ya neno kwa neno. “Tafadhali” huonyesha nguvu ya ombi la אַל bila kulifanya jibu liwe kali kupita kiasi. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachoifafanua.
