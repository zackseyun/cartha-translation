lexical_decisions:
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Ni njia ya kawaida na ya moja kwa moja katika Kiswahili ya kuuliza sababu.
- source_word: אתי הלכתי
  choice: unakwenda
  rationale: Ingawa maandishi ya Kiebrania yana umbo lisilo la kawaida, maana katika muktadha ni tendo la sasa linaloelekezwa kwa mwanamke mmoja.
- source_word: אֵלָיו
  choice: kwake
  rationale: Kiwakilishi kinamrejelea Elisha; tafsiri hii inadumisha kiwakilishi badala ya kutaja jina ambalo halipo katika mstari.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni kielezi cha wakati cha kawaida na cha asili katika Kiswahili.
- source_word: לֹא חֹדֶשׁ וְלֹא שַׁבָּת
  choice: Leo si mwandamo wa mwezi wala Sabato
  rationale: Muundo wa “si...wala...” unaonyesha kwa ufasaha kwamba siku hiyo si mojawapo ya nyakati hizo mbili za kidini.
- source_word: חֹדֶשׁ
  choice: mwandamo wa mwezi
  rationale: Katika muktadha huu wa kalenda na ibada, neno hilo linamaanisha sikukuu au wakati wa mwezi mpya, si mwezi kama kipindi tu.
- source_word: שַׁבָּת
  choice: Sabato
  rationale: Hili ndilo neno la kawaida la kibiblia katika Kiswahili kwa siku takatifu ya mapumziko ya Israeli.
- source_word: שָׁלוֹם
  choice: Amani
  rationale: Huhifadhi neno halisi la Kiebrania na ufupi wa jibu, huku tanbihi ikieleza maana yake ya kimuktadha.
