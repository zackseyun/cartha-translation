  yaml_path: translation/ot/2_kings/004/030.yaml
  text: Then the boy’s mother said[a], “As Yahweh lives, and as your soul lives, I will not leave you.” So he arose and went after her.
translation:
  language: sw
  text: Ndipo mama wa yule kijana akasema[a], “Yahwe aishivyo, na wewe uishivyo, sitakuacha.” Basi akainuka, akamfuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hii ni kanuni ya kiapo ya Kiebrania: “Yahwe aishivyo, na nafsi yako iishivyo”; yaani, “Hakika, Yahwe alivyo hai na wewe ulivyo hai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵם הַנַּעַר
  choice: mama yake yule kijana
  rationale: Muundo wa Kiebrania una maana halisi ya ‘mama wa kijana.’ Kiswahili hiki ni cha kawaida na kinadumisha utambulisho maalumu wa mama huyo katika muktadha.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: Kama Yahwe aishivyo, na kama nafsi yako iishivyo
  rationale: Hii ni kanuni ya kiapo inayotaja uhai wa Yahwe na uhai wa anayezungumziwa. Tafsiri inadumisha umbo na uzito wa usemi wa Kiebrania; tanbihi inaeleza maana yake ya kiidioma.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa namna ya kawaida ya Kiswahili ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: sitakuacha
  rationale: Baada ya kanuni ya kiapo, אִם ni uthibitisho wa kukataa kwa nguvu, si sharti la kawaida. ‘Sitakuacha’ hutoa maana hiyo wazi na kwa Kiswahili asilia.
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום katika masimulizi kinamaanisha kuinuka na kuchukua hatua; ‘akainuka’ kinadumisha hadhi na mfuatano wa simulizi.
- source_word: וַיֵּלֶךְ אַחֲרֶיהָ
  choice: akaenda nyuma yake
  rationale: Hii inadumisha taswira ya Kiebrania ya kwenda ‘baada/nyuma yake’ na inaeleweka kuwa alimfuata.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה katika kanuni ya kiapo
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja Tetragramatoni יהוה. ‘Yahwe’ linadumisha jina la Mungu badala ya kulibadilisha kuwa cheo.
- issue: Maana ya נַפְשְׁךָ katika kiapo
  choice: nafsi yako
  alternative: wewe uishivyo; uhai wako
  rationale: ‘Nafsi yako’ inadumisha usemi halisi na mvutano wa kanuni ya kiapo bila kuifanya kauli ya kawaida tu; tanbihi hufafanua maana yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Muundo wa kiapo umehifadhiwa kwa ukaribu na chanzo, huku tanbihi ikitoa maana yake ya kiidioma.
