  text: וְ/אִשָּׁ֣ה אַחַ֣ת מִ/נְּשֵׁ֣י בְנֵֽי הַ֠/נְּבִיאִים צָעֲקָ֨ה אֶל אֱלִישָׁ֜ע לֵ/אמֹ֗ר עַבְדְּ/ךָ֤ אִישִׁ/י֙ מֵ֔ת וְ/אַתָּ֣ה יָדַ֔עְתָּ כִּ֣י עַבְדְּ/ךָ֔ הָיָ֥ה יָרֵ֖א אֶת יְהוָ֑ה וְ/הַ֨/נֹּשֶׁ֔ה בָּ֗א לָ/קַ֜חַת אֶת שְׁנֵ֧י יְלָדַ֛/י ל֖/וֹ לַ/עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/001.yaml
  text: One woman from the wives of the sons of the prophets cried out to Elisha, saying, “Your servant, my husband, has died, and you know that your servant feared Yahweh. And the creditor has come to take my two children for himself as servants.”
translation:
  language: sw
  text: Mwanamke mmoja miongoni mwa wake wa wana wa manabii akamlilia Elisha, akisema, “Mtumishi wako, mume wangu, amekufa. Nawe unajua kwamba mtumishi wako alimcha Yahweh. Na mdai amekuja kuwachukua watoto wangu wawili[a] ili wawe watumwa wake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wana wangu wawili.” Kiebrania kinasema “watoto wangu wawili,” neno ambalo katika muktadha huu linaweza kueleweka hasa kuwa “wana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה אַחַת
  choice: Mwanamke mmoja
  rationale: Hutambulisha mhusika mpya bila kumtaja; “mmoja” huhifadhi maana ya אַחַת, huku kiunganishi cha mwanzo kikionyeshwa kwa mtiririko wa simulizi badala ya kulazimishwa kuwa neno tofauti.
- source_word: מִנְּשֵׁי בְנֵי הַנְּבִיאִים
  choice: miongoni mwa wake za wana wa manabii
  rationale: Huhifadhi jina la kijamii la Kiebrania “wana wa manabii,” yaani jumuiya ya manabii, bila kulibadili kuwa dhehebu au taasisi maalumu.
- source_word: צָעֲקָה אֶל
  choice: akamlilia
  rationale: Kitenzi hiki huonyesha kilio cha dhiki na ombi la haraka lililoelekezwa kwa Elisha, si kusema tu.
- source_word: עַבְדְּךָ אִישִׁי
  choice: Mtumishi wako, yaani mume wangu
  rationale: 'Huweka wazi mahusiano yote mawili: marehemu alikuwa mtumishi wa Elisha na mume wa mwanamke huyo.'
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: alimcha Yahweh
  rationale: “Kumcha” huhifadhi nahau ya kibiblia yenye maana ya hofu yenye heshima na uaminifu kwa Mungu.
- source_word: הַנֹּשֶׁה
  choice: yule anayemdai
  rationale: Ni usemi wa kawaida na unaoeleweka kwa mtu ambaye deni la marehemu linadaiwa kwake; kiambishi “-m-” kinamrejelea mume aliyekufa.
- source_word: בָּא לָקַחַת
  choice: amekuja kuwachukua
  rationale: Wakati timilifu huonyesha kuwa tishio hilo limefika na lina matokeo ya sasa.
- source_word: שְׁנֵי יְלָדַי
  choice: watoto wangu wawili
  rationale: Huhifadhi maana pana ya יְלָדַי bila kuibana kimuktadha kuwa “wana wangu wawili.”
- source_word: לוֹ לַעֲבָדִים
  choice: wawe watumishi wake
  rationale: Huonyesha kuwa wadaiwa hao wangekuwa chini ya mamlaka na kwa manufaa ya mdai; “watumishi” inafaa hapa bila kuficha hali ya utumwa wa deni.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Matini ina jina binafsi la Mungu, tetragramatoni, hivyo “Yahweh” hulihifadhi badala ya kulibadili kuwa cheo.
- issue: Maana ya “wana wa manabii”
  choice: wana wa manabii
  alternative: jumuiya ya manabii / wanafunzi wa manabii
  rationale: Tafsiri rasmi huhifadhi nahau ya Kiebrania na kuepuka kuamua bila msingi kwamba walikuwa wanafunzi tu au watoto wa kimwili wa manabii.
- issue: Hali ya watoto wanaochukuliwa kwa deni
  choice: watumishi wake
  alternative: watumwa wake
  rationale: עֲבָדִים inaweza kumaanisha watumishi au watumwa. “Watumishi wake” huhifadhi upana wa neno, ilhali muktadha unaonyesha wazi kuwa wangetwaliwa kwa lazima kwa sababu ya deni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa sasa. “Akamlilia” huwasilisha dhiki kwa lugha ya asili; “yaani” hufafanua apposition bila kubadili maana. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachohusika.
