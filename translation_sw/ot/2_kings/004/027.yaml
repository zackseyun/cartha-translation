base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/027.yaml
  text: When she came to the man of God at the mountain[a], she took hold of his feet. Gehazi came near to push her away, but the man of God said, “Leave her alone, for her soul is bitter within her[b], and Yahweh has hidden it from me and has not told me.”
translation:
  language: sw
  text: Alipomfikia mtu wa Mungu huko mlimani, akamshika miguu. Gehazi akakaribia ili amsukume aondoke, lakini mtu wa Mungu akasema, “Mwache, kwa maana nafsi yake ina uchungu[a]. Yahwe amenificha jambo hili, wala hakuniambia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “nafsi yake ni chungu kwake”; usemi huu unaonyesha dhiki kubwa ya ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Huhifadhi moja kwa moja cheo cha Kiebrania kinachotumiwa kumtaja nabii bila kukibadili kuwa neno la ufafanuzi ‘nabii.’
- source_word: אֶל הָהָר
  choice: huko mlimani
  rationale: Muktadha unaonyesha mahali alipokuwa Elisha; ‘huko mlimani’ ni Kiswahili cha kawaida kinachohifadhi mazingira bila kueleza zaidi ya maandishi.
- source_word: וַתַּחֲזֵק בְּרַגְלָיו
  choice: akamshika miguu
  rationale: Kitenzi pamoja na kihusishi kinaonyesha kushika kwa uthabiti; usemi huu ni wa kawaida na unaonyesha tendo la dharura bila kulitia nguvu kupita kiasi.
- source_word: וַיִּגַּשׁ
  choice: akakaribia
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya tendo la kumkaribia mtu.
- source_word: לְהָדְפָהּ
  choice: ili amsukume aondoke
  rationale: Huwasilisha kusukumwa kwa nguvu ili aondolewe, kwa Kiswahili kinachoeleweka kwa urahisi.
- source_word: הַרְפֵּה לָהּ
  choice: Mwache
  rationale: Katika muktadha huu amri hiyo inamtaka Gehazi aache kumzuia au kumsukuma mwanamke.
- source_word: נַפְשָׁהּ מָרָה לָהּ
  choice: nafsi yake ina uchungu mwingi
  rationale: Huhifadhi neno ‘nafsi’ na taswira ya uchungu, huku ‘mwingi’ ikionyesha uzito wa dhiki ya ndani kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina la Mungu lililo katika maandishi ya Kiebrania; ‘Yahwe’ ni umbo linalofaa matamshi na tahajia ya Kiswahili.
- source_word: הֶעְלִים מִמֶּנִּי
  choice: amenificha jambo hili
  rationale: Huhifadhi dai la Elisha kwamba Mungu hakumfunulia jambo hilo.
- source_word: וְלֹא הִגִּיד לִי
  choice: wala hakuniambia
  rationale: Huhifadhi ulinganifu na kishazi kilichotangulia na kusema wazi kwamba jambo hilo halikufunuliwa kwake.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina maalumu la Mungu, si cheo; kwa hiyo jina linahifadhiwa badala ya kubadilishwa kuwa ‘BWANA.’
- issue: Maana ya נֶפֶשׁ katika usemi wa dhiki
  choice: nafsi yake ina uchungu mwingi
  alternative: ana huzuni kubwa moyoni
  rationale: Chaguo hili huhifadhi istilahi ya Kiebrania na taswira yake ya uchungu wa ndani bila kuibadili kuwa maelezo ya kisaikolojia pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa simulizi ni mwepesi kueleweka, huku cheo ‘mtu wa Mungu,’ jina ‘Yahwe,’ na taswira ya ‘nafsi’ vikihifadhi muundo muhimu wa chanzo.
