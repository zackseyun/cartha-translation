  text: Then go in and shut the door behind yourself and behind your sons[a], and pour into all these containers[b]; and set aside the full ones.
translation:
  language: sw
  text: Kisha ingia ndani, ufunge mlango nyuma yako na wana wako, halafu umimine katika vyombo hivyo vyote[a]. Vyombo vilivyojaa uviweke kando.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania ni pana na linaweza kumaanisha vyombo vya aina mbalimbali.
    reason: lexical_alternative
  - marker: b
    text: Au, “uviondoe vilivyojaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאת
  choice: Kisha ingia ndani
  rationale: Kitenzi בוא hapa kinaelekeza kuingia nyumbani au chumbani; “kisha” linaonyesha mfuatano wa maagizo kwa Kiswahili cha kawaida.
- source_word: וְסָגַרְתְּ הַדֶּלֶת בַּעֲדֵךְ וּבְעַד בָּנַיִךְ
  choice: ujifungie mlango wewe na wanao
  rationale: Usemi huu unaonyesha kwamba mwanamke na wanawe wanapaswa kuwa ndani huku mlango ukiwa umefungwa, na wengine wabaki nje. “Ujifungie” ni usemi wa asili wa Kiswahili unaobeba maana hiyo bila kuwa mzito.
- source_word: וְיָצַקְתְּ עַל
  choice: halafu umimine katika
  rationale: יצק ni kumimina; ingawa עַל kwa umbo ni “juu ya,” katika muktadha wa vyombo maana ya asili kwa Kiswahili ni kumimina ndani yake. Kitu kinachomiminwa kinaachwa kudokezwa kama katika Kiebrania.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: vyombo hivyo vyote
  rationale: כְּלִים ni neno pana linaloweza kumaanisha vyombo vya aina mbalimbali. “Vyombo” ni la kawaida na halibani maana kuwa mitungi pekee.
- source_word: וְהַמָּלֵא תַּסִּיעִי
  choice: Chombo kilichojaa ukiweke kando
  rationale: Kivumishi cha umoja chenye kibainishi kinatumika kama nomino, “kilichojaa.” Kutaja “chombo” kwa uwazi kunaleta Kiswahili cha asili, huku umoja ukihifadhiwa kama maagizo ya jumla kwa kila chombo kinachojaa. Hiphil ya נסע hapa ina maana ya kukiondoa mahali pa kumiminia au kukiweka kando.
