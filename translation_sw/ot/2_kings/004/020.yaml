  text: And he carried him and brought him to his mother[a], and he sat on her knees until noon; then he died.
translation:
  language: sw
  text: Yule mtumishi akambeba na kumpeleka kwa mama yake. Mtoto akakaa mapajani mwa mama yake[a] mpaka adhuhuri, kisha akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “juu ya magoti yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֵהוּ
  choice: akambeba
  rationale: Kitenzi נשׂא hapa kinaonyesha kwamba mtumishi alimchukua mtoto na kumbeba; “akambeba” huwasilisha mwendo unaoendelea kwa Kiswahili cha kawaida.
- source_word: וַיְבִיאֵהוּ
  choice: na kumpeleka
  rationale: Hifili ya בוא humaanisha kuleta au kupeleka kwa mtu fulani. Kwa kuwa mwelekeo unaelezwa kwa “kwa mama yake,” “kumpeleka” ni ya asili na inahifadhi mwelekeo huo.
- source_word: אֶל אִמּוֹ
  choice: kwa mama yake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya uhusiano na mwelekeo.
- source_word: וַיֵּשֶׁב
  choice: akakaa
  rationale: ישׁב inaweza kumaanisha kuketi au kukaa. Katika muktadha wa mtoto kuwa juu ya magoti/mapajani ya mama yake, “akakaa” ni ya asili na haiamui zaidi ya maandishi.
- source_word: עַל בִּרְכֶּיהָ
  choice: mapajani mwa mama yake
  rationale: Kiebrania kinasema kihalisi “juu ya magoti yake,” lakini katika Kiswahili mtoto hukaa “mapajani.” Kumtaja tena mama huondoa utata wa kiwakilishi na kutoa sentensi ya kawaida.
- source_word: עַד הַצָּהֳרַיִם
  choice: mpaka adhuhuri
  rationale: צָהֳרַיִם ni wakati wa katikati ya mchana; “adhuhuri” ni neno sanifu na linaloeleweka.
- source_word: וַיָּמֹת
  choice: kisha akafa
  rationale: “Kisha” huonyesha hatua inayofuata katika mfululizo wa simulizi unaowasilishwa na waw-consecutive bila kuongeza sababu au ufafanuzi.
