  yaml_path: translation/ot/2_kings/004/006.yaml
  text: And when the containers were full[a], she said to her son, “Bring me another container.” But he said to her[b], “There is not another container.” Then the oil stopped.
translation:
  language: sw
  text: Vyombo[a] vilipojaa, akamwambia mwanawe, “Niletee chombo kingine.” Lakini akamwambia, “Hakuna chombo kingine.” Ndipo mafuta yakakoma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lina maana pana ya vyombo au vifaa; hapa linamaanisha vyombo vya kutia mafuta.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “mafuta yakasimama”; maana yake ni kwamba yaliacha kutoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְלֹאת
  choice: vilipojaa
  rationale: Muundo wenye כִּ unaonyesha wakati. “Vilipojaa” ni Kiswahili cha kawaida kinachowasilisha hali ya vyombo kuwa vimejaa bila kufanya sentensi kuwa nzito.
- source_word: הַכֵּלִים / כֶּלִי
  choice: vyombo / chombo
  rationale: כְּלִי ni neno pana kwa kifaa au kitu cha kuhifadhia. Katika muktadha wa mafuta, “chombo” ni neno la kawaida na pana kuliko “mtungi,” ambalo lingebainisha umbo au aina isiyotajwa.
- source_word: הַגִּישָׁה
  choice: Niletee
  rationale: Amri ya Hifili ya נגשׁ ina maana ya kuleta karibu au kuwasilisha. “Niletee” huonyesha kwa kawaida kwamba mwana anapaswa kumpa mama yake chombo kingine.
- source_word: עוֹד
  choice: kingine
  rationale: Pamoja na nomino ya umoja כֶּלִי, עוֹד humaanisha kitu cha ziada cha aina ileile; “chombo kingine” ni usemi wa asili wa Kiswahili.
- source_word: אֵין עוֹד כֶּלִי
  choice: Hakuna chombo kingine
  rationale: אֵין huonyesha kutokuwapo. Tafsiri hii ni fupi, ya kawaida, na haiongezi wazi wazo la “kilichobaki,” ingawa linaeleweka katika muktadha.
- source_word: וַיַּעֲמֹד הַשָּׁמֶן
  choice: mafuta yakakoma
  rationale: עמד kwa maana ya msingi ni “kusimama,” lakini hapa inaonyesha kuwa mafuta yaliacha kutoka. “Yakakoma” hutoa maana hiyo kwa Kiswahili cha kawaida huku tanbihi ikihifadhi picha halisi ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi na ya kisimulizi. “Mwanawe” imerudiwa katika jibu ili kuondoa utata wa kawaida wa viwakilishi, bila kuongeza mhusika mpya. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
