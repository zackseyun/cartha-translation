lexical_decisions:
- source_word: לְכִי
  choice: Nenda
  rationale: Amri ya nafsi ya pili umoja wa kike inamtuma mwanamke akatende; “Nenda” ni ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: שַׁאֲלִי
  choice: ukakope
  rationale: Kitenzi kinaweza kumaanisha kuomba kwa ujumla, lakini katika muktadha huu vyombo vinapatikana kwa majirani kwa matumizi ya muda; “ukakope” huwasilisha maana hiyo kwa kawaida.
- source_word: כֵּלִים
  choice: vyombo
  rationale: Neno la Kiebrania lina maana pana ya vifaa au vyombo. “Vyombo” linafaa kwa vitu vya kuwekea mafuta bila kuvibainisha isivyofaa kuwa mitungi.
- source_word: לָךְ
  choice: kwa ajili yako
  rationale: Huhifadhi maana ya manufaa binafsi iliyomo katika kiwakilishi cha Kiebrania.
- source_word: מִן הַחוּץ
  choice: kutoka nje
  rationale: Hufuata usemi wa Kiebrania kwa ukaribu na kuonyesha kwamba vyombo vitafutwe nje ya nyumba yake.
- source_word: מֵאֵת כָּל שכנכי
  choice: kwa jirani zako wote
  rationale: Ni tafsiri ya kawaida ya Kiswahili inayoonyesha kwamba aende kwa watu wote wanaoishi karibu naye.
- source_word: כֵּלִים רֵקִים
  choice: vyombo vitupu
  rationale: Inahifadhi kurudiwa kwa “vyombo” na sharti kwamba visiwe na kitu ndani.
- source_word: אַל תַּמְעִיטִי
  choice: Usichukue vichache tu
  rationale: Kauli hii inakataza kufanya idadi iwe ndogo; katika muktadha, maana yake ni asipate vyombo vichache tu.
