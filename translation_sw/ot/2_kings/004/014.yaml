lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Basi akasema
  rationale: Waw-consecutive inaendeleza simulizi; “Basi” huonyesha mwendelezo wa hoja na matukio kwa Kiswahili cha kawaida.
- source_word: וּמֶה
  choice: Sasa ... nini?
  rationale: Kiunganishi pamoja na kiulizi kinaonyesha hatua inayofuata katika mazungumzo; “sasa” ni ya asili katika muktadha huu.
- source_word: לַעֲשׂוֹת לָהּ
  choice: afanyiwe
  rationale: Muundo huu unaeleza jambo la kufanywa kwa manufaa yake; kauli ya kutendewa ni fupi na ya asili kwa Kiswahili.
- source_word: גֵּיחֲזִי
  choice: Gehazi
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: אֲבָל
  choice: Lakini
  rationale: Chembe hii inaweza kuanzisha jambo muhimu au pingamizi katika jibu; “Lakini” huhifadhi mvutano huo bila kuufafanua kupita kiasi.
- source_word: בֵּן אֵין לָהּ
  choice: hana mwana
  rationale: בֵּן humaanisha mwana wa kiume, si mtoto kwa ujumla; muundo wa umilikaji “hana” ni wa kawaida kwa Kiswahili.
- source_word: וְאִישָׁהּ
  choice: na mume wake
  rationale: Katika muktadha huu אִישׁ yenye kiambishi cha umilikaji humrejelea mume wake.
- source_word: זָקֵן
  choice: ni mzee
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayoonyesha hali yake ya kuwa na umri mkubwa.
