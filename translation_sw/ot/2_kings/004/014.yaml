  text: So he said[a], “What then is to be done for her?” And Gehazi said, “Well, she has no son[b], and her husband is old.”
translation:
  language: sw
  text: Basi akasema[a], “Sasa afanyiwe nini?” Gehazi akasema, “Kweli, hana mwana[b], na mume wake ni mzee.”
  philosophy: optimal-equivalence
  footnotes:
