  edition: WLC
  text: וֶ/אֱלִישָׁ֞ע שָׁ֤ב הַ/גִּלְגָּ֨לָ/ה֙ וְ/הָ/רָעָ֣ב בָּ/אָ֔רֶץ וּ/בְנֵי֙ הַ/נְּבִיאִ֔ים יֹשְׁבִ֖ים לְ/פָנָ֑י/ו וַ/יֹּ֣אמֶר לְ/נַעֲר֗/וֹ שְׁפֹת֙ הַ/סִּ֣יר הַ/גְּדוֹלָ֔ה וּ/בַשֵּׁ֥ל נָזִ֖יד לִ/בְנֵ֥י הַ/נְּבִיאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/038.yaml
  text: And Elisha returned to Gilgal[a], and there was a famine in the land. Now the sons of the prophets were sitting before him, and he said to his servant, “Put on the large pot and boil stew for the sons of the prophets.”
translation:
  language: sw
  text: Elisha akarudi Gilgali, na njaa ilikuwa nchini. Wana wa manabii[a] walikuwa wameketi mbele yake, naye akamwambia mtumishi wake, “Weka sufuria kubwa motoni, upike kitoweo kwa ajili ya wana wa manabii.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanafunzi wa manabii,” yaani washiriki wa jumuiya au kundi la manabii.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: akarudi
  rationale: Kitenzi hiki kwa kawaida humaanisha kurudi mahali ambapo mtu alikuwapo hapo awali; ‘akarudi’ ni tafsiri ya kawaida na fupi.
- source_word: הַגִּלְגָּלָה
  choice: Gilgali
  rationale: Herufi ya kuelekeza mwishoni mwa jina inaonyesha mwendo kuelekea Gilgali; katika Kiswahili jambo hilo linaeleweka kwa kitenzi ‘akarudi’ pamoja na jina la mahali.
- source_word: וְהָרָעָב בָּאָרֶץ
  choice: wakati huo kulikuwa na njaa nchini
  rationale: Kishazi kisicho na kitenzi kinatoa mazingira ya simulizi. ‘Wakati huo kulikuwa’ ni Kiswahili cha asili kinachoonyesha hali iliyokuwapo Elisha aliporudi bila kulazimisha uhusiano mkali wa mfuatano.
- source_word: בָּאָרֶץ
  choice: nchini
  rationale: Katika muktadha huu אֶרֶץ ina maana ya eneo au nchi ambamo matukio yanatokea; ‘nchini’ ni ya kawaida na inayoeleweka.
- source_word: בְנֵי הַנְּבִיאִים
  choice: wana wa manabii
  rationale: Tafsiri hii inadumisha tamathali ya kifamilia ya Kiebrania. Tanbihi inaeleza kuwa hapa inarejelea wanafunzi au jumuiya ya manabii, si lazima watoto wao wa kuzaa.
- source_word: יֹשְׁבִים לְפָנָיו
  choice: walikuwa wameketi mbele yake
  rationale: Usemi huu unaonyesha hali iliyoendelea na kuwapo kwao mbele ya Elisha, huenda wakiwa wanafunzi wake; ‘wameketi mbele yake’ huhifadhi picha hiyo.
- source_word: לְנַעֲרוֹ
  choice: mtumishi wake
  rationale: נַעַר inaweza kumaanisha kijana, mhudumu, au mtumishi. Kwa kuwa mtu huyu anaagizwa kufanya kazi ya huduma, ‘mtumishi wake’ inafaa zaidi.
- source_word: שְׁפֹת
  choice: weka ... motoni
  rationale: Katika muktadha wa kupika, kitenzi kinamaanisha kuweka sufuria juu ya moto. Kutaja ‘motoni’ hufanya amri iwe wazi na ya kawaida katika Kiswahili.
- source_word: הַסִּיר הַגְּדוֹלָה
  choice: sufuria kubwa
  rationale: סִיר ni chombo cha kupikia; ‘sufuria kubwa’ ni sawa ya kisasa na inayoeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: וּבַשֵּׁל
  choice: uwapikie
  rationale: Kitenzi kinaweza kumaanisha kuchemsha au kupika. Kwa Kiswahili, ‘uwapikie ... mchuzi’ ni usemi wa asili na pia huhifadhi walengwa wa tendo hilo.
- source_word: נָזִיד
  choice: mchuzi
  rationale: Neno hili linamaanisha chakula kilichochemshwa, hasa mchuzi mzito au kitoweo. ‘Mchuzi’ ni neno rahisi na la kawaida, ingawa aina kamili ya chakula haijaainishwa.
theological_decisions:
- issue: Maana ya tamathali בְנֵי הַנְּבִיאִים
  choice: wana wa manabii
  alternative: wanafunzi wa manabii; jumuiya ya manabii
  rationale: Maandishi makuu yanahifadhi tamathali ya Kiebrania bila kuamua kwamba walikuwa watoto wa kuzaa. Tanbihi inaweka wazi maana yake ya kijumuiya au ya uanafunzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa sasa na wenye heshima. Tamathali ‘wana wa manabii’ imehifadhiwa katika maandishi makuu na kufafanuliwa kwa tanbihi; msamiati wa mapishi umewekwa rahisi na wa kawaida.
