base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/029.yaml
  text: Then he said to Gehazi, “Tuck up your garment, take my staff in your hand, and go. If you meet anyone, do not greet him; and if anyone greets you, do not answer him. Then place my staff on the boy’s face.”
translation:
  language: sw
  text: Kisha akamwambia Gehazi, “Jifunge vazi lako kiunoni[a], chukua fimbo yangu mkononi mwako, uende. Ukikutana na mtu yeyote, usimsalimie; na mtu yeyote akikusalimu, usimjibu.[b] Na uiweke fimbo yangu juu ya uso wa mvulana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kwa maana halisi, “Jifunge viuno,” nahau ya kujiandaa haraka kuchukua hatua.
    reason: lexical_alternative
  - marker: b
    text: Au “usimbariki; na mtu yeyote akikubariki.” Hapa kitenzi cha Kiebrania huenda kinamaanisha kusalimiana njiani.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגֹר מָתְנֶיךָ
  choice: Jifunge vazi lako kiunoni
  rationale: Kirai hiki kwa maana halisi ni ‘jifunge viuno,’ nahau inayomaanisha kujiandaa kwa hatua ya haraka kwa kulifunga vazi refu kiunoni. Tafsiri hii inaeleza tendo hilo kwa Kiswahili cha kawaida huku ikihifadhi dharura ya agizo.
- source_word: מִשְׁעַנְתִּי
  choice: fimbo yangu
  rationale: Nomino hii humaanisha fimbo ya kutembelea au ya kujiegemeza. ‘Fimbo’ ni tafsiri ya kawaida na inayofaa katika simulizi hili.
- source_word: וָלֵךְ
  choice: uende
  rationale: Ni amri ya moja kwa moja ya kwenda; muundo huu unaendeleza mfululizo wa maagizo kwa lugha ya asili.
- source_word: כִּי תִמְצָא אִישׁ
  choice: Ukikutana na mtu yeyote
  rationale: Ingawa אִישׁ kwa kawaida ni ‘mwanamume,’ hapa ina maana jumuishi ya mtu yeyote ambaye angekutana naye njiani.
- source_word: לֹא תְבָרְכֶנּוּ / וְכִי יְבָרֶכְךָ אִישׁ
  choice: usimsalimie / mtu yeyote akikusalimu
  rationale: Katika muktadha wa kukutana njiani, ברך inaelekea kumaanisha kutoa salamu badala ya kutoa baraka rasmi. ‘Salimia’ inaonyesha maana hiyo kwa Kiswahili cha kawaida.
- source_word: לֹא תַעֲנֶנּוּ
  choice: usimjibu
  rationale: ענה hapa ni kujibu au kuitikia. ‘Usimjibu’ inahifadhi ufupi na ukali wa agizo.
- source_word: וְשַׂמְתָּ ... עַל פְּנֵי הַנָּעַר
  choice: Na uiweke fimbo yangu juu ya uso wa mvulana
  rationale: Tafsiri hii inahifadhi kiunganishi cha Kiebrania, tendo la kuweka, na maelezo ya wazi ‘juu ya uso’ bila kuyafanya kuwa ya jumla.
- source_word: הַנָּעַר
  choice: mvulana
  rationale: נַעַר inaweza kumaanisha mvulana, kijana, au mtumishi. Katika muktadha huu wa mwana wa mwanamke Mshunemu, ‘mvulana’ ni wazi na inafaa.
