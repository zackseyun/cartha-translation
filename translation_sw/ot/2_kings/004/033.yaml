  text: He went in and shut the door behind the two of them[a], and prayed to Yahweh.
translation:
  language: sw
  text: Akaingia, akaufunga mlango nyuma yake na mtoto, akasali kwa Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akajifungia ndani pamoja na mtoto”; yaani, yeye na mtoto walikuwa peke yao chumbani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Akaingia
  rationale: Kitenzi בוא katika mfululizo wa masimulizi kinaonyesha kwamba Elisha aliingia ndani ya chumba; “akaingia” ni wazi na cha kawaida katika Kiswahili.
- source_word: וַיִּסְגֹּר הַדֶּלֶת
  choice: akaufunga mlango
  rationale: סגר pamoja na דלת humaanisha kufunga mlango. Kiambishi “-u-” kinarejelea mlango kwa Kiswahili cha kawaida.
- source_word: בְּעַד שְׁנֵיהֶם
  choice: nyuma yao wote wawili
  rationale: בְּעַד katika muktadha wa kufunga mlango inaweza kumaanisha kuufunga nyuma ya watu waliomo, hivyo kuwabakiza ndani. Tafsiri hii inadumisha picha ya Kiebrania na rejeo la Elisha pamoja na mtoto.
- source_word: וַיִּתְפַּלֵּל
  choice: akasali
  rationale: Umbo la hitpaeli la פלל hapa humaanisha kusali. “Akasali” ni usemi wa kawaida, wenye heshima, na unaendeleza mfululizo wa masimulizi.
- source_word: אֶל יְהוָה
  choice: kwa Yahwe
  rationale: Baada ya “kusali,” kihusishi “kwa” kinaonyesha yule aliyeelekezewa sala. Jina la agano יְהוָה limetoholewa kuwa “Yahwe” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kama jina huku likifuata tahajia inayosomeka kwa urahisi katika Kiswahili.
- issue: Ni nani wanaomaanishwa na “wote wawili”
  choice: Kudumisha kiwakilishi bila kuongeza majina katika mstari
  alternative: “Elisha na mtoto”
  rationale: Kiebrania kinasema tu “wote wawili.” Muktadha unaonyesha kuwa ni Elisha na mtoto, lakini kutoweka majina katika mstari kunahifadhi namna ya usemi wa chanzo; ufafanuzi unatolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko rahisi wa masimulizi na hadhi inayofaa maandiko. Tafsiri inadumisha utata mdogo wa בְּעַד huku tanbihi ikieleza maana inayowezekana katika muktadha.
