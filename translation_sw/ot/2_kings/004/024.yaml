  yaml_path: translation/ot/2_kings/004/024.yaml
  text: Then she saddled the donkey and said to her servant[a], “Drive on and go; do not slow down for me unless I tell you.”
translation:
  language: sw
  text: Kisha akamtandika punda jike, akamwambia mtumishi wake, “Endesha na uendelee; usipunguze mwendo kwa ajili yangu nisipokuambia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּחֲבֹשׁ הָאָתוֹן
  choice: akamtandika punda jike
  rationale: Katika muktadha huu חבש ni kumwandaa mnyama kwa kumpanda, yaani kumtandika; אָתוֹן humaanisha hasa punda jike.
- source_word: נַעֲרָהּ
  choice: mtumishi wake
  rationale: נַעַר hapa humtaja kijana wa kiume anayehudumu kama mtumishi au msindikizaji; jukumu lake ndilo la msingi katika muktadha.
- source_word: נְהַג וָלֵךְ
  choice: Mwongoze, uendelee kwenda
  rationale: נהג ni kumwongoza au kumsukuma mnyama aende mbele, na וָלֵךְ inaongeza wazo la kuendelea na safari kwa haraka.
- source_word: אַל תַּעֲצָר לִי לִרְכֹּב
  choice: usipunguze mwendo kwa ajili yangu
  rationale: עצר inaweza kumaanisha kuzuia, kusimamisha, au kupunguza mwendo. Hapa maana ya kimuktadha ni kutokwamisha safari yake akiwa amepanda.
- source_word: כִּי אִם אָמַרְתִּי לָךְ
  choice: nisipokuambia
  rationale: 'Baada ya katazo, כִּי אִם huanzisha sharti la pekee: isipokuwa au mpaka aseme; Kiswahili cha kawaida hutumia ‘nisipokuambia’.'
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Punda jike’ huhifadhi taarifa ya kijinsia iliyo wazi katika Kiebrania. Kauli ya safari imetolewa kwa lugha ya kawaida huku dhana ya kutosimamisha au kutopunguza mwendo ikihifadhiwa.
