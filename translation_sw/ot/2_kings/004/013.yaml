base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/013.yaml
  text: And he said to him[a], “Please say to her, ‘Look, you have taken all this trouble for us. What is to be done for you? Is there anything to be spoken for you to the king or to the commander of the army?’” And she said[c][b], “I am living among my own people.”
translation:
  language: sw
  text: Naye akamwambia Gehazi, “Tafadhali mwambie, ‘Tazama, umejitaabisha sana kwa ajili yetu kwa mambo haya yote.[a] Ni nini kinachoweza kufanywa kwa ajili yako? Je, kuna jambo lolote la kusemwa kwa niaba yako mbele ya mfalme au mbele ya mkuu wa jeshi?’”[b] Naye akajibu, “Mimi ninaishi miongoni mwa watu wangu.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi zaidi, “umehangaika kwa ajili yetu kwa mahangaiko haya yote”; hapa ni nahau inayomaanisha kuwa amewajali sana na kujitaabisha kwa ajili yao.
    reason: lexical_alternative
  - marker: b
    text: Au, “Je, kuna jambo lolote la kusemwa kwa niaba yako kwa mfalme au kwa mkuu wa jeshi?”
    reason: lexical_alternative
  - marker: c
    text: Huenda jibu hili likadokeza kwamba ameridhika na ameimarika katika jumuiya yake, wala hahitaji upendeleo maalumu kutoka kwa mfalme au mamlaka ya kijeshi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: Naye akamwambia Gehazi
  rationale: Kiebrania kinasema kihalisi ‘akamwambia yeye’; muktadha wa aya iliyotangulia unamtambulisha anayesemeshwa kuwa Gehazi. Kutaja jina kunazuia utata wa viwakilishi katika Kiswahili bila kubadili mhusika.
- source_word: חָרַדְתְּ / חֲרָדָה
  choice: umejitaabisha sana hivi kwa ajili yetu
  rationale: Kitenzi na nomino zinazohusiana zina maana ya kutetemeka, kuwa na wasiwasi, au kujishughulisha kwa bidii. Katika muktadha wa ukarimu, nahau hii inaonyesha juhudi na uangalifu mkubwa wa mwanamke kwa ajili yao.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta fikira kwa jambo linalofuata; ‘Tazama’ ni la heshima na linaeleweka katika Kiswahili cha Biblia cha sasa.
- source_word: מֶה לַעֲשׂוֹת לָךְ
  choice: Tufanye nini kwa ajili yako?
  rationale: Muundo wa Kiebrania unauliza tendo gani lifanywe kwa manufaa yake. Kiswahili huhitaji usemi wa asili zaidi; wingi unamjumuisha Elisha pamoja na mtumishi wake huku maana ya msaada ikihifadhiwa.
- source_word: הֲיֵשׁ לְדַבֵּר לָךְ
  choice: Je, ungependa tuseme kwa niaba yako
  rationale: Kihalisi ni kusema kwa ajili yake, yaani kumwakilisha au kumwombea jambo kwa mwenye mamlaka. ‘Kwa niaba yako’ huonyesha maana hiyo wazi bila kutaja ombi maalumu ambalo halipo katika matini.
- source_word: שַׂר הַצָּבָא
  choice: mkuu wa jeshi
  rationale: שַׂר hapa ni mkuu au kamanda mwenye mamlaka ya kijeshi; ‘mkuu wa jeshi’ ni Kiswahili sanifu na cha kawaida.
- source_word: בְּתוֹךְ עַמִּי אָנֹכִי יֹשָׁבֶת
  choice: Mimi ninaishi kati ya watu wangu mwenyewe
  rationale: Tafsiri hii huhifadhi picha ya kuishi katikati ya jumuiya yake. Jibu linaweza kudokeza usalama na kutohitaji upendeleo wa watawala, lakini dokezo hilo halijaingizwa moja kwa moja katika matini.
- source_word: נָא
  choice: Tafadhali
  rationale: Ni chembe ya adabu inayolainisha agizo; ‘Tafadhali’ ndiyo kisawe cha kawaida katika Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya jibu la mwanamke kuhusu kuishi kati ya watu wake
  choice: Kuhifadhi kauli halisi katika matini na kueleza dokezo lake katika tanbihi
  alternative: Kutafsiri moja kwa moja kuwa hana haja yoyote au yuko salama
  rationale: Kiebrania hakisemi wazi kwamba hana haja au yuko salama, ingawa muktadha unaweza kudokeza hivyo. Tafsiri haipaswi kufunga maana hiyo kwa kauli moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa katika mtindo wa simulizi wa Biblia unaoeleweka kwa wasomaji wa kawaida. Jina ‘Gehazi’ limewekwa wazi kutokana na muktadha ili kuondoa utata wa kiwakilishi cha Kiswahili; tanbihi zimewekwa mara moja katika sehemu zinazohusika.
