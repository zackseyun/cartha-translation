  text: וְ/גֵחֲזִ֞י עָבַ֣ר לִ/פְנֵי/הֶ֗ם וַ/יָּ֤שֶׂם אֶת הַ/מִּשְׁעֶ֨נֶת֙ עַל פְּנֵ֣י הַ/נַּ֔עַר וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין קָ֑שֶׁב וַ/יָּ֤שָׁב לִ/קְרָאת/וֹ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר לֹ֥א הֵקִ֖יץ הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/031.yaml
  text: And Gehazi went on ahead of them and laid the staff on the boy’s face[a], but there was no sound and no response. So he returned to meet him and told him, saying, “The boy has not awakened.”
translation:
  language: sw
  text: Gehazi akatangulia mbele yao, akaiweka ile fimbo juu ya uso wa mvulana, lakini hakukuwa na sauti wala mwitikio.[a] Basi akarudi kumlaki, akamwambia, “Mvulana hajaamka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “hakukuwa na sauti wala usikivu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבַר לִפְנֵיהֶם
  choice: akatangulia mbele yao
  rationale: Kirai hiki kinaonyesha kwamba Gehazi alikwenda akiwa mbele ya Elisha na mwanamke. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha maana ya mwendo wa kutangulia.
- source_word: הַמִּשְׁעֶנֶת
  choice: ile fimbo
  rationale: Katika muktadha huu ni fimbo ya Elisha. “Fimbo” ni neno la kawaida na lenye hadhi, lisiloongeza wazo lisilokuwamo la silaha au aina maalumu ya bakora.
- source_word: עַל פְּנֵי הַנַּעַר
  choice: juu ya uso wa mvulana
  rationale: פָּנִים hapa humaanisha uso halisi, na נַעַר inamrejelea mtoto wa kiume katika simulizi hili. “Mvulana” ni ya kawaida zaidi kuliko “kijana,” ambalo lingeweza kudokeza umri mkubwa zaidi.
- source_word: וְאֵין קוֹל
  choice: hakukuwa na sauti
  rationale: קוֹל humaanisha sauti; tafsiri hii ni ya moja kwa moja na haiongezi fasiri pana kama “ishara ya uhai.”
- source_word: וְאֵין קָשֶׁב
  choice: wala mwitikio
  rationale: קָשֶׁב huonyesha usikivu au kuitikia. Katika muktadha wa kutokuwapo kwa sauti, “mwitikio” huwasilisha maana ya kwamba mvulana hakutoa jibu au dalili ya kuitikia, huku tanbihi ikihifadhi usemi wa karibu zaidi na muundo wa Kiebrania.
- source_word: וַיָּשָׁב לִקְרָאתוֹ
  choice: akarudi kumlaki
  rationale: Kirai kinaonyesha kwamba Gehazi alirudi ili akutane naye. Kiwakilishi kinaachwa kama kilivyo katika chanzo badala ya kutaja Elisha waziwazi, na “kumlaki” ni usemi mfupi, wa kawaida na wenye hadhi.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: akamwambia
  rationale: Huu ni mfumo wa kawaida wa Kiebrania wa kuanzisha maneno ya moja kwa moja. Kiswahili cha kawaida hakihitaji kurudia “akisema” baada ya “akamwambia,” hivyo maana kamili inadumishwa bila uzito usio wa lazima.
- source_word: לֹא הֵקִיץ הַנָּעַר
  choice: Mvulana hajaamka
  rationale: הֵקִיץ humaanisha kuamka au kuzinduka. Wakati timilifu wa Kiswahili unaonyesha matokeo ya jaribio hilo hadi wakati Gehazi alipotoa taarifa.
