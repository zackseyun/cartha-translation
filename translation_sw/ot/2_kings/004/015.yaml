lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo akasema
  rationale: Wayyiqtol ya אמר inaendeleza mfululizo wa matukio; “Ndipo akasema” ni Kiswahili cha kawaida kinachoonyesha hatua inayofuata.
- source_word: קְרָא לָהּ
  choice: Mwite
  rationale: Amri ya kiume umoja ya קרא pamoja na kiwakilishi cha kike ina maana ya kumwita mwanamke huyo; “Mwite” ni ya moja kwa moja na ya asili.
- source_word: וַיִּקְרָא לָהּ
  choice: Basi akamwita
  rationale: Inaonyesha utekelezaji wa amri iliyotangulia; “Basi” huunganisha tendo hilo kwa mtiririko wa kawaida bila kuongeza taarifa.
- source_word: וַתַּעֲמֹד
  choice: naye akasimama
  rationale: עמד humaanisha kusimama au kuchukua nafasi; tafsiri haiongezi wazo la kuja ambalo halijaelezwa wazi katika Kiebrania.
- source_word: בַּפָּתַח
  choice: mlangoni
  rationale: פתח inaweza kumaanisha uwazi wa mlango au eneo la kuingilia; “mlangoni” ni usemi wa kawaida wa Kiswahili unaohifadhi upana huo wa maana.
