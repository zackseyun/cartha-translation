  text: Then he called Gehazi and said[a], “Call this Shunammite woman.” So he called her, and she came to him. Then he said, “Take up your son.”
translation:
  language: sw
  text: Kisha akamwita Gehazi, akamwambia, “Mwite huyu mwanamke wa Shunemu[a].” Basi akamwita, naye akaja kwake. Akamwambia, “Mchukue mwanao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huyu Mshunami.” Kiebrania hutumia gentilic ya kike, yaani jina la kumtaja mwanamke wa Shunemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל גֵּיחֲזִי
  choice: Kisha akamwita Gehazi
  rationale: Muundo wa simulizi wa wayyiqtol unaendeleza mfululizo wa matukio; “Kisha” ni wa kawaida katika Kiswahili na kitenzi “akamwita” kinawasilisha קרא אל kwa uwazi.
- source_word: קְרָא
  choice: Mwite
  rationale: Amri ya umoja wa kiume ya קרא; “mwite” ni ya moja kwa moja na ya kawaida kuliko “mwitishe,” ambayo ingeweza kudokeza mpatanishi.
- source_word: הַשֻּׁנַמִּית הַזֹּאת
  choice: huyu mwanamke Mshunemu
  rationale: Nomino ya kike ya kumtaja mtu wa Shunemu inafafanuliwa kwa “mwanamke,” huku הַזֹּאת ikihifadhiwa kwa “huyu.” Umbo “Mshunemu” linatambulisha mahali alikotoka kwa ufupi.
- source_word: וַיִּקְרָאֶהָ
  choice: Basi akamwita
  rationale: Marudio ya mzizi קרא yamehifadhiwa ili kuonyesha wazi utekelezaji wa agizo na Gehazi.
- source_word: וַתָּבֹא אֵלָיו
  choice: naye akaja kwake
  rationale: בוא + אֶל inaonyesha kuja kwa mtu; “akaja kwake” ni Kiswahili cha asili bila kuongeza wazo la kuingia ndani ya chumba.
- source_word: שְׂאִי
  choice: Mchukue
  rationale: Amri ya kike ya נשׂא katika muktadha huu inamtaka mama amchukue mwanawe. “Mchukue” ni ya kawaida na inaweza kujumuisha kumwinua na kwenda naye bila kulazimisha mojawapo tu.
- source_word: בְנֵךְ
  choice: mwanao
  rationale: בן pamoja na kiambishi cha nafsi ya pili umoja wa kike humaanisha kwa usahihi “mwanao,” na huhifadhi kwamba mtoto ni wa kiume.
