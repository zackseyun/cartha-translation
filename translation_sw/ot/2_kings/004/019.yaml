base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/019.yaml
  text: And he said to his father[a], “My head, my head!” Then he said to the young man, “Carry him to his mother.”
translation:
  language: sw
  text: Akamwambia baba yake, “Kichwa changu! Kichwa changu!” Basi baba yake akamwambia yule kijana[a], “Mbebe umpeleke kwa mama yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi” badala ya “kijana”; neno la Kiebrania נַעַר linaweza kumaanisha kijana, mhudumu, au mtumishi kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אָבִיו
  choice: Akamwambia baba yake
  rationale: Kitenzi אמר kimetafsiriwa kwa maana yake ya kawaida, “sema/ambia,” bila kuongeza wazo la kupiga kelele; maneno yanayorudiwa ndiyo yanayoonyesha uchungu na dharura.
- source_word: רֹאשִׁי רֹאשִׁי
  choice: Kichwa changu! Kichwa changu!
  rationale: Tafsiri hii inadumisha urudiaji mfupi na wenye nguvu wa Kiebrania bila kuongeza maelezo kama “kinauma.”
- source_word: וַיֹּאמֶר אֶל הַנַּעַר
  choice: Basi baba yake akamwambia yule kijana[a]
  rationale: “Basi” linaendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida. Mtendaji aliyedokezwa katika Kiebrania ametajwa kuwa baba yake ili kuzuia utata usio wa lazima katika Kiswahili. נַעַר limetafsiriwa “kijana,” huku maana mbadala ya “mtumishi” ikihifadhiwa katika tanbihi.
- source_word: שָׂאֵהוּ
  choice: Mbebe umpeleke
  rationale: Amri hii inahusu kumbeba mtoto kimwili; “mbebe” inawasilisha jambo hilo wazi, na “umpeleke” huunganisha kwa njia ya asili mahali anakopelekwa.
- source_word: אֶל אִמּוֹ
  choice: kwa mama yake
  rationale: Hii ni tafsiri ya kawaida na ya asili ya uhusiano wa kifamilia katika Kiswahili.
