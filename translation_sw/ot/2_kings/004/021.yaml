  text: Then she went up and laid him on the bed of the man of God[a], shut the door behind him[b], and went out.
translation:
  language: sw
  text: Kisha akapanda, akamlaza juu ya kitanda cha mtu wa Mungu, akaufunga mlango, akamwacha ndani[a], kisha akatoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, akaufunga mlango huku mtoto akiwa ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: Kisha akapanda
  rationale: Kitenzi עלה kina maana ya kupanda au kwenda juu. “Kisha” linaonyesha mfuatano wa masimulizi kwa Kiswahili cha kawaida bila kupoteza mwendo wa kuelekea juu.
- source_word: וַתַּשְׁכִּבֵהוּ
  choice: akamlaza
  rationale: Hii ni kausativi ya שׁכב, yaani kumfanya mtu alale; “akamlaza” ni tafsiri fupi na ya kawaida.
- source_word: עַל מִטַּת
  choice: juu ya kitanda
  rationale: עַל ni “juu ya,” na מִטָּה kwa kawaida ni kitanda au mahali pa kulala. Kauli hii inadumisha tendo halisi la kumweka mtoto kitandani.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ni jina la cheo la Kiebrania. Tafsiri ya moja kwa moja inalihifadhi badala ya kulifasiri kwa kulifanya “nabii wa Mungu.”
- source_word: וַתִּסְגֹּר בַּעֲדוֹ
  choice: akamfungia ndani[a]
  rationale: Muundo סגר בעד unaonyesha kufunga na kumwacha mtu upande wa ndani. Kiswahili “akamfungia ndani” kinaeleza kwa kawaida kwamba alifunga mlango huku mtoto akiwa chumbani, ingawa neno “mlango” halitajwi wazi katika Kiebrania.
- source_word: וַתֵּצֵא
  choice: kisha akatoka
  rationale: יצא ni kutoka. “Kisha” linaweka wazi hatua inayofuata katika masimulizi bila kuongeza mahali ambapo hakutajwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Biblia. “Akamfungia ndani” huepuka picha isiyo ya kawaida ya kufunga mlango ‘nyuma’ ya mtoto aliyekuwa amelazwa kitandani, huku tanbihi ikihifadhi uwezekano huo wa muundo wa Kiebrania.
