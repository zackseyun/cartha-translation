  yaml_path: translation/ot/2_kings/004/012.yaml
  text: Then he said to Gehazi his servant[a], “Call this Shunammite woman.” So he called her, and she stood before him.
translation:
  language: sw
  text: Kisha akamwambia Gehazi, mtumishi wake, “Mwite mwanamke huyu Mshunami.” Basi akamwita, naye akasimama mbele yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha akamwambia
  rationale: Kiunganishi cha usimulizi kinaendeleza mfuatano wa matukio; “Kisha” ni Kiswahili cha kawaida kinachoonyesha hatua inayofuata.
- source_word: גֵּחֲזִי
  choice: Gehazi
  rationale: Jina la mtu limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili cha Biblia.
- source_word: נַעֲרוֹ
  choice: mtumishi wake
  rationale: Ingawa neno linaweza kumaanisha kijana au mhudumu, hapa linaeleza wajibu wa Gehazi katika kumhudumia Elisha; “mtumishi wake” huwasilisha kazi hiyo wazi.
- source_word: קְרָא
  choice: Mwite
  rationale: Katika muktadha huu kitenzi kinamaanisha kumwita mtu aje mbele ya msemaji; “Mwite” ni cha kawaida na hakiongezi ukali wa ‘kumwagiza afike’.
- source_word: לַשּׁוּנַמִּית הַזֹּאת
  choice: huyu mwanamke Mshunemu
  rationale: Kirai kinamtambulisha kwa asili yake ya Shunemu. “Mwanamke Mshunemu” ni wazi na cha kawaida katika Kiswahili, huku “huyu” ikihifadhi kiashiria cha Kiebrania.
- source_word: וַיִּקְרָא לָהּ
  choice: Basi akamwita
  rationale: Marudio ya kitenzi yamehifadhiwa, na “Basi” huonyesha kwamba Gehazi alitekeleza agizo katika mfuatano wa simulizi.
- source_word: וַתַּעֲמֹד
  choice: naye akasimama
  rationale: Tafsiri hii hudumisha maana ya moja kwa moja ya ‘kusimama’ bila kuongeza kwamba alikuja, jambo ambalo halijasemwa wazi katika Kiebrania.
- source_word: לְפָנָיו
  choice: mbele yake
  rationale: Hii inaweza kueleza mahali au kuwapo mbele ya mtu, na ni tafsiri fupi ya kawaida ya kirai hiki.
