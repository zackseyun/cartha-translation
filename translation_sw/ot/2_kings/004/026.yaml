  yaml_path: translation/ot/2_kings/004/026.yaml
  text: Now please run to meet her and say to her[a], ‘Is it well with you? Is it well with your husband? Is it well with the child?’ And she said[b], ‘It is well.’
translation:
  language: sw
  text: Sasa, tafadhali kimbia ukutane naye, umwambie, “Je, una hali njema?[a] Je, mume wako ana hali njema? Je, mtoto[b] ana hali njema?” Naye akasema, “Hali ni njema.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Neno la Kiebrania shalom, linalotumiwa mara nne katika mstari huu, linaweza kumaanisha amani, ukamilifu, usalama, au hali njema. Hapa linahusu ustawi: “Je, una hali njema?” / “Hali ni njema.”'
    reason: lexical_alternative
  - marker: b
    text: Au “mvulana.” Neno la Kiebrania yeled linaweza kumaanisha “mtoto” au “mvulana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Sasa
  rationale: Kielezi hiki kinaanzisha agizo la haraka; “sasa” huhifadhi maana ya wakati bila kuongeza wazo lisilo wazi la “mara moja.”
- source_word: רוּץ נָא
  choice: tafadhali kimbia
  rationale: Kitenzi ni agizo la kukimbia, na נָא huonyesha ombi la heshima au msisitizo wa upole; “tafadhali” huhifadhi nuance hiyo.
- source_word: לִקְרָאתָהּ
  choice: ukamlaki
  rationale: Kirai cha Kiebrania humaanisha kwenda kumkabili mtu anayekuja ili kukutana naye; “kumlaki” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: וֶאֱמָר לָהּ
  choice: umwambie
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya kusema maneno fulani kwa mtu.
- source_word: הֲשָׁלוֹם לָךְ
  choice: Je, una hali njema?
  rationale: שָׁלוֹם hapa ni swali kuhusu ustawi kwa upana, si afya ya mwili pekee. “Hali njema” huhifadhi upana huo na kuruhusu muundo urudiwe.
- source_word: הֲשָׁלוֹם לְאִישֵׁךְ
  choice: Je, mume wako ana hali njema?
  rationale: אִישׁ katika uhusiano huu humaanisha “mume,” na muundo unaorudiwa unaakisi marudio ya Kiebrania.
- source_word: הֲשָׁלוֹם לַיָּלֶד
  choice: Je, mtoto ana hali njema?
  rationale: יֶלֶד inaweza kumaanisha mtoto au mvulana. “Mtoto” ni pana zaidi na haiongezi ubainishaji usiolazimishwa na neno lenyewe.
- source_word: וַתֹּאמֶר שָׁלוֹם
  choice: Naye akasema, “Ni salama.”
  rationale: Jibu la neno moja שָׁלוֹם linamaanisha kuwa hali ni njema au salama. “Ni salama” ni fupi, linaeleweka, na haliondoi mvutano wa simulizi.
