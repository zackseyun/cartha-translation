  text: Then he said[a], “Bring some flour.” And he threw it into the pot and said, “Pour it out for the people[b], so that they may eat.” And there was nothing harmful in the pot.
translation:
  language: sw
  text: Ndipo akasema, “Leteni unga.” Akautupa ndani ya chungu, kisha akasema, “Pakulie watu[a] ili wale.” Wala hakukuwa na kitu chochote chenye madhara ndani ya chungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mimina kwa ajili ya watu.” Kitenzi cha Kiebrania kwa maana ya moja kwa moja ni “mimina,” lakini hapa kinahusu kupakua au kugawa chakula kilichopikwa kwa watu.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya moja kwa moja, “hakukuwa na kitu kibaya/kiovu ndani ya chungu,” yaani chakula hicho hakikuwa tena na madhara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo akasema
  rationale: Kiunganishi cha simulizi kinaendeleza mfuatano wa matukio; “ndipo” kinaonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: וּקְחוּ
  choice: Leteni
  rationale: Ni amri ya wingi. Katika muktadha huu, wanaagizwa waupate unga na kuuleta ili utumiwe mara moja.
- source_word: קֶמַח
  choice: unga
  rationale: Neno hili humaanisha unga au unga wa nafaka; “unga” ni neno wazi na la kawaida katika Kiswahili.
- source_word: וַיַּשְׁלֵךְ אֶל־הַסִּיר
  choice: Akautupa ndani ya chungu
  rationale: Kitenzi שלך humaanisha kutupa au kurusha, na אֶל hapa huonyesha kuelekea ndani ya chungu.
- source_word: הַסִּיר
  choice: chungu
  rationale: Ni chombo cha kupikia kilichokuwa na chakula; “chungu” ni neno la kawaida na linalofaa muktadha.
- source_word: צַק לָעָם
  choice: Wamiminie watu
  rationale: Kitenzi יצק kimsingi huhusu kumimina. Tafsiri hii inadumisha taswira ya kugawa chakula kutoka chunguni, ingawa maana ya kimuktadha ni kuwapa watu chakula.
- source_word: וְיֹאכֵלוּ
  choice: ili wale
  rationale: Muundo huu unaonyesha kusudi au matokeo ya amri iliyotangulia; “ili wale” ni wa asili na mfupi.
- source_word: וְלֹא הָיָה דָבָר רָע בַּסִּיר
  choice: Wala hakukuwa na kitu chochote chenye madhara ndani ya chungu
  rationale: דָבָר רָע ni kwa neno moja moja “kitu kibaya/kiovu,” lakini hapa huzungumzia chakula kilichokuwa hatari, si uovu wa kimaadili. “Chenye madhara” huwasilisha maana ya kimuktadha bila kuificha tafsiri halisi.
