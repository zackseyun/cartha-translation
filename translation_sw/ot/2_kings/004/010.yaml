  text: נַֽעֲשֶׂה נָּ֤א עֲלִיַּת קִיר֙ קְטַנָּ֔ה וְ/נָשִׂ֨ים ל֥/וֹ שָׁ֛ם מִטָּ֥ה וְ/שֻׁלְחָ֖ן וְ/כִסֵּ֣א וּ/מְנוֹרָ֑ה וְ/הָיָ֛ה בְּ/בֹא֥/וֹ אֵלֵ֖י/נוּ יָס֥וּר שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/010.yaml
  text: Please let us make a small upper room on the wall[a], and let us put there for him a bed, a table, a chair, and a lampstand; and whenever he comes to us[b], he can turn in there.
translation:
  language: sw
  text: Tafadhali, tujenge chumba kidogo cha juu ukutani[a], na tumwekee humo kitanda, meza, kiti na kinara cha taa; kila atakapokuja kwetu, aweze kupumzika humo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chumba kidogo cha juu chenye ukuta,” au kwa urahisi, “chumba kidogo cha juu.” Usemi wa Kiebrania ni mfupi na unaweza kueleweka kwa namna zaidi ya moja; “ukutani” huhifadhi neno lake halisi.
    reason: lexical_alternative
  - marker: b
    text: Au, “aweze kugeukia huko.” Kitenzi cha Kiebrania kwa kawaida humaanisha “kugeuka kando” au “kuacha njia,” na hapa kinahusu kusimama hapo kwa ajili ya malazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשֶׂה נָּא
  choice: Tafadhali, na tujenge
  rationale: Kauli ya kusihi ya nafsi ya kwanza wingi pamoja na נָא ni pendekezo la heshima; usemi huu unawakilisha kusihi na tendo la pamoja kwa Kiswahili cha kawaida.
- source_word: עֲלִיַּת קִיר קְטַנָּה
  choice: chumba kidogo cha juu ukutani
  rationale: עֲלִיָּה ni chumba cha juu, קִיר ni ukuta, na קְטַנָּה ni kidogo. 'Ukutani' huhifadhi picha halisi ya Kiebrania bila kuamua kabisa kama chumba kilikuwa juu ya ukuta au kimejengwa kwa kuushikilia.
- source_word: וְנָשִׂים לוֹ שָׁם
  choice: na humo tumwekee
  rationale: שׂים humaanisha kuweka; 'tumwekee' huhifadhi maana ya kusudi la kumwandalia yeye, na 'humo' hurejelea mahali ndani ya chumba.
- source_word: מִטָּה
  choice: kitanda
  rationale: Katika muktadha wa kumwandalia msafiri mahali pa kulala, maana ya kawaida ni kitanda.
- source_word: שֻׁלְחָן
  choice: meza
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa kifaa hiki cha nyumbani.
- source_word: כִסֵּא
  choice: kiti
  rationale: Katika orodha ya samani za chumbani, 'kiti' ni sahihi kuliko neno pana zaidi 'kikalio'.
- source_word: מְנוֹרָה
  choice: kinara cha taa
  rationale: Neno hilo hutaja kifaa cha kushikilia taa, si taa yenyewe tu; 'kinara cha taa' huhifadhi umahususi huo.
- source_word: וְהָיָה בְּבֹאוֹ אֵלֵינוּ
  choice: Kila anapokuja kwetu
  rationale: Muundo huo unaeleza hali ya wakati ujao inayojirudia; Kiswahili hiki ni cha asili na huhifadhi maana ya 'wakati wowote anapokuja'.
- source_word: יָסוּר שָׁמָּה
  choice: ataweza kugeukia humo
  rationale: סוּר kimsingi ni kugeuka au kukengeuka njia, na katika muktadha wa safari inaweza kumaanisha kuingia mahali na kupumzika au kulala. 'Kugeukia humo' huhifadhi picha ya kitenzi bila kuifanya iwe 'kukaa' kwa muda usiotajwa.
