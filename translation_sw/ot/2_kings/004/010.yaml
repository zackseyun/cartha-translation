translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji, huku taswira halisi ya 'ukutani' na 'kugeukia' ikihifadhiwa na utata wake kufafanuliwa katika tanbihi.
