translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. Mfuatano wa vitenzi wenye “aka-” umehifadhi mwendo wa simulizi la Kiebrania. Alama [a] imewekwa baada ya kishazi kinachohusika.
