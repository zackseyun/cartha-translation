  text: One day he came there[a], turned aside into the upper room, and lay down there.
translation:
  language: sw
  text: Siku moja akaja huko, akageuka na kuingia katika chumba cha juu, akajilaza huko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akalala huko.” Kitenzi cha Kiebrania kinaweza kumaanisha kujilaza au kulala usingizi; muktadha haulazimishi maana iliyo mahsusi zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Siku moja
  rationale: Nahau hii ya Kiebrania hutambulisha tukio fulani katika simulizi. “Siku moja” ni Kiswahili cha kawaida na huhifadhi maana ya wakati bila kutafsiri fomula ya Kiebrania neno kwa neno.
- source_word: וַיָּבֹא שָׁמָּה
  choice: alifika huko
  rationale: Kitenzi בוא hapa kinaeleza kuja au kufika mahali palipotajwa. “Alifika huko” ni cha asili katika simulizi la Kiswahili na huhifadhi שָׁמָּה, “huko.”
- source_word: וַיָּסַר
  choice: akaingia
  rationale: סור inaweza kumaanisha kugeuka au kuacha njia na kuelekea mahali fulani. Katika muktadha huu, tendo linalokusudiwa ni kuingia katika chumba alichoandaliwa; “akaingia” huwasilisha hilo kwa Kiswahili cha kawaida bila kudokeza kujiondoa au kujitenga.
- source_word: אֶל הָעֲלִיָּה
  choice: katika chumba cha juu
  rationale: עֲלִיָּה ni chumba kilicho sehemu ya juu ya jengo. “Chumba cha juu” ni wazi, cha heshima, na huhifadhi maana ya kimuundo ya neno hilo.
- source_word: וַיִּשְׁכַּב שָׁמָּה
  choice: akalala huko
  rationale: שׁכב inaweza kueleza kujilaza au kulala. Kiswahili “kulala” pia kinaweza kueleweka kama kujilaza au kupata usingizi; tanbihi inaweka wazi uwezekano huo bila kuamua maana mahsusi kuliko muktadha unavyoruhusu.
