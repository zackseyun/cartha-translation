base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/008.yaml
  text: And one day Elisha passed through Shunem[a], where there was a prominent woman, and she urged him to eat bread. So whenever he passed by[b], he would turn in there to eat bread.
translation:
  language: sw
  text: Siku moja Elisha alipita Shunemu. Huko kulikuwa na mwanamke mashuhuri[a], naye akamsihi Elisha ale chakula. Kila mara Elisha alipokuwa akipita huko, alikuwa akigeukia huko ili ale chakula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mwanamke mkuu”; huenda usemi huu unamaanisha mwanamke mwenye hadhi katika jamii au mwenye mali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Siku moja
  rationale: Hiki ni kifungu cha kawaida cha Kiebrania cha kufungua tukio la simulizi; “Siku moja” ni cha asili katika Kiswahili na kinahifadhi maana ya wakati.
- source_word: וַיַּעֲבֹר ... אֶל שׁוּנֵם
  choice: alipitia Shunemu
  rationale: Katika muktadha wa safari, kitenzi kinaonyesha kwamba Elisha alipita katika au karibu na mahali hapo; “alipitia” pia huandaa matumizi ya kurudia baadaye katika mstari.
- source_word: שׁוּנֵם
  choice: Shunemu
  rationale: Jina la mahali limetoholewa kwa muundo unaotumika kwa kawaida katika Kiswahili.
- source_word: אִשָּׁה גְדוֹלָה
  choice: mwanamke mwenye cheo
  rationale: Neno גְדוֹלָה hapa linaelekea kueleza hadhi au uwezo wa kijamii, si ukubwa wa mwili wala ubora wa maadili. Tanbihi inahifadhi uwezekano wa maana ya utajiri au umaarufu.
- source_word: וַתַּחֲזֶק בּוֹ
  choice: akamsisitiza Elisha
  rationale: Nahau hii ina wazo la kumshinikiza au kumsihi mtu kwa nguvu. “Akamsisitiza” ni ya kawaida na inaonyesha ukakamavu wa ukarimu wake; jina limerudiwa ili kuepuka utata wa viwakilishi vya Kiswahili.
- source_word: לֶאֱכָל לָחֶם
  choice: ale chakula
  rationale: Ingawa לֶחֶם kwa msingi ni “mkate,” kifungu “kula mkate” hutumiwa kwa maana pana ya kula mlo. “Ale chakula” huwasilisha nahau hiyo kwa Kiswahili cha sasa bila kudokeza kuwa mkate pekee ndio ulioliwa.
- source_word: מִדֵּי עָבְרוֹ
  choice: kila mara Elisha alipopitia huko
  rationale: Muundo huu unaonyesha tukio lililorudiwa. “Kila mara ... alipopitia” huonyesha wazi maana hiyo.
- source_word: יָסֻר שָׁמָּה
  choice: alikuwa akipitia nyumbani kwake
  rationale: סור hapa ni kugeuka kutoka njiani na kuingia au kusimama mahali hapo. Muktadha unaonyesha nyumba ya mwanamke; “kupitia nyumbani kwake” ni Kiswahili asilia na kinahifadhi wazo la kuacha njia kwa muda.
