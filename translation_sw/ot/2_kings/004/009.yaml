base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/009.yaml
  text: And she said to her husband[a], “Look now, I know that this is a holy man of God who regularly passes by us.”
translation:
  language: sw
  text: Akamwambia mume wake, “Tazama, najua kwamba huyu ni mtu mtakatifu wa Mungu, ambaye hupita kwetu mara kwa mara.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye hupita kwetu daima.”
    reason: '"Daima" ni tafsiri ya karibu ya תָּמִיד; katika muktadha huu, usemi "mara kwa mara" hueleza kwa kawaida zaidi kupita kunakorudiwa.'
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Akamwambia
  rationale: Wayyiqtol inaendeleza simulizi; ‘akamwambia’ ni mtiririko wa kawaida wa masimulizi ya Kiswahili na pia hujumuisha kiambishi cha mtendewa.
- source_word: אֶל אִישָׁהּ
  choice: mume wake
  rationale: Katika muktadha huu wa nyumbani, אִישׁ yenye kiambishi cha nafsi ya tatu ya kike humaanisha mume wake.
- source_word: הִנֵּה נָא
  choice: Tazama, sasa
  rationale: ‘Tazama’ huvuta fikira kama הִנֵּה, huku ‘sasa’ ikihifadhi msisitizo mpole wa נָא kwa Kiswahili cha sasa.
- source_word: יָדַעְתִּי
  choice: najua
  rationale: Kauli timilifu hapa inaonyesha utambuzi uliothibitika kutokana na kumwona mara nyingi; ‘najua’ ni ya asili na haiongezi tafsiri isiyokuwamo.
- source_word: כִּי
  choice: kwamba
  rationale: Neno hili linaanzisha maudhui ya kile anachojua.
- source_word: אִישׁ אֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ni jina la cheo linalotumiwa kwa nabii au mtu aliyepewa utume na Mungu; tafsiri hii huhifadhi nguvu yake ya kifasihi na kitheolojia.
- source_word: קָדוֹשׁ
  choice: mtakatifu
  rationale: Neno hili linaonyesha kuwa mtu huyo ni mtakatifu au ametengwa kwa Mungu.
- source_word: הוּא
  choice: huyu ni
  rationale: Kiwakilishi kinamtambulisha mtu anayezungumziwa; ‘huyu ni’ ni muundo wa kawaida wa Kiswahili katika kauli hii.
- source_word: עֹבֵר עָלֵינוּ
  choice: hupita hapa kwetu
  rationale: Katika muktadha wa safari, kirai hiki kinaeleza kupita karibu na makao yao; ‘hapa kwetu’ huwasilisha maana hiyo kwa uwazi na kwa lugha ya kawaida.
- source_word: תָּמִיד
  choice: daima
  rationale: ‘Daima’ huhifadhi moja kwa moja wazo la tendo la kawaida linalojirudia; katika muktadha huu halimaanishi lazima tendo lisilokatika.
theological_decisions:
- issue: Tafsiri ya cheo אִישׁ אֱלֹהִים
  choice: mtu wa Mungu
  alternative: mtu anayemcha Mungu
  rationale: ‘Mtu wa Mungu’ huhifadhi cheo kinachotambulika katika vitabu vya kihistoria bila kukibadili kuwa maelezo ya jumla kuhusu tabia yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Akamwambia’ na ‘hupita hapa kwetu’ ni miundo ya kawaida na inayoeleweka, huku ‘mtu mtakatifu wa Mungu’ ikihifadhi mpangilio na uzito wa usemi wa Kiebrania.
