  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֜עַל וַ/יִּשְׁכַּ֣ב עַל הַ/יֶּ֗לֶד וַ/יָּשֶׂם֩ פִּ֨י/ו עַל פִּ֜י/ו וְ/עֵינָ֤י/ו עַל עֵינָי/ו֙ וְ/כַפָּ֣י/ו עַל כפ/ו וַ/יִּגְהַ֖ר עָלָ֑י/ו וַ/יָּ֖חָם בְּשַׂ֥ר הַ/יָּֽלֶד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/034.yaml
  text: Then he went up and lay on the boy[a], and put his mouth on his mouth, his eyes on his eyes, and his palms on his palms; and he stretched himself over him, and the boy’s flesh became warm.
translation:
  language: sw
  text: Kisha akapanda, akajilaza juu ya mvulana, akaweka kinywa chake juu ya kinywa chake, macho yake juu ya macho yake, na viganja vyake juu ya viganja vyake. Akajinyoosha juu yake[a], na mwili wa mvulana ukapata joto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akainama juu yake.” Kitenzi cha Kiebrania ni adimu na huenda kinaeleza kuinama au kujinyoosha juu ya mtoto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Kisha akapanda
  rationale: Kitenzi עלה humaanisha kupanda au kwenda juu. Mahali anapopanda yanaeleweka kutokana na muktadha, kwa hiyo hayajaongezwa katika maandishi.
- source_word: וַיִּשְׁכַּב עַל הַיֶּלֶד
  choice: akajilaza juu ya mvulana
  rationale: שׁכב inaeleza kulala au kujilaza. Umbo la kujirejelea ‘akajilaza’ linaeleza tendo la Elisha kwa Kiswahili cha kawaida bila kupunguza mgusano wa mwili unaotajwa.
- source_word: וַיָּשֶׂם פִּיו עַל פִּיו
  choice: akaweka kinywa chake juu ya kinywa chake
  rationale: שׂים ni ‘kuweka,’ na tafsiri hii inadumisha maelezo halisi ya mgusano bila kuyafasiri kama mbinu ya kitabibu.
- source_word: וְעֵינָיו עַל עֵינָיו
  choice: macho yake juu ya macho yake
  rationale: Kirai hiki kinaendeleza kitenzi ‘akaweka.’ Kurudia ‘yake’ kunahifadhi ulinganifu wa viungo vya Elisha na vya mvulana.
- source_word: וְכַפָּיו עַל כַּפָּיו
  choice: viganja vyake juu ya viganja vyake
  rationale: כַּף hapa ni hasa kiganja, si mkono kwa ujumla; ‘viganja’ kinahifadhi usahihi wa kimwili wa Kiebrania.
- source_word: וַיִּגְהַר עָלָיו
  choice: Akajinyoosha juu yake
  rationale: גהר ni kitenzi adimu kinachoeleza kuinama, kujikunja, au kujinyoosha juu ya mtu. Katika muktadha wa kuoanisha viungo vyao, ‘akajinyoosha juu yake’ ni wazi, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: וַיָּחָם בְּשַׂר הַיָּלֶד
  choice: mwili wa mvulana ukapata joto
  rationale: חם hapa ni kupata joto. Ingawa בָּשָׂר kihalisi ni ‘nyama,’ ‘mwili’ ni Kiswahili cha kawaida kinachowasilisha maana ya mwili hai bila kuleta dhana isiyokusudiwa ya nyama ya chakula.
- source_word: הַיֶּלֶד / הַיָּלֶד
  choice: mvulana
  rationale: יֶלֶד inaweza kumaanisha mtoto au mvulana. Muktadha unamtambulisha kama mwana, hivyo ‘mvulana’ ni sahihi na ya kawaida.
theological_decisions:
- issue: Asili ya tendo la Elisha kwa mtoto aliyekufa
  choice: Matendo ya mwili yameelezwa moja kwa moja bila kuyaita mbinu ya kumrudishia pumzi wala tendo la kisakramenti.
  alternative: Kulieleza kama kumpa pumzi mdomo kwa mdomo, au kutumia maneno yasiyo ya moja kwa moja ili kuficha mgusano wa mwili.
  rationale: Kiebrania kinaeleza tendo la kinabii linalohusiana na kurejeshwa kwa mtoto, lakini hakifafanui utaratibu uliotumika. Tafsiri kwa hiyo inadumisha mvutano huo na haiongezi ufafanuzi wa kitabibu au wa kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi unahifadhi mfululizo na ulinganifu wa maelezo ya Kiebrania bila kuwa mgumu kupita kiasi.
