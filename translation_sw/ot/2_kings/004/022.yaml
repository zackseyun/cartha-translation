  text: Then she called to her husband and said[a], “Please send me one of the young men and one of the female donkeys[b], so that I may run to the man of God and return.”
translation:
  language: sw
  text: Ndipo akamwita mume wake, akamwambia, “Tafadhali nitumie mmoja wa vijana na mmoja wa punda jike[b], ili nikimbie kwa mtu wa Mungu na nirudi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Neno la Kiebrania linamtaja punda jike hasa; tafsiri nyingine husema tu “punda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא אֶל אִישָׁהּ
  choice: akamwita mume wake
  rationale: Katika muktadha huu wa nyumbani, אִישָׁהּ humaanisha ‘mume wake’; ‘akamwita’ huendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: שִׁלְחָה נָא לִי
  choice: Tafadhali nitumie
  rationale: Kauli ya amri pamoja na נָא ni ombi la heshima. ‘Tafadhali nitumie’ hudumisha ombi hilo bila kulifanya kuwa kali.
- source_word: אֶחָד מִן הַנְּעָרִים
  choice: mmoja wa vijana
  rationale: נַעַר inaweza kumaanisha kijana au mtumishi. ‘Mmoja wa vijana’ huhifadhi maana ya msingi bila kuamua kwa lazima kwamba alikuwa mtumishi.
- source_word: וְאַחַת הָאֲתֹנוֹת
  choice: na punda mmoja jike
  rationale: אָתוֹן ni nomino inayomtaja punda jike hasa; tafsiri hii inadumisha ubainisho wa jinsia uliomo katika Kiebrania.
- source_word: וְאָרוּצָה
  choice: ili niende haraka
  rationale: Kitenzi hiki maana yake halisi ni ‘nikimbie,’ lakini katika safari inayohusisha punda kinaonyesha hasa haraka na dharura. ‘Ili niende haraka’ ni Kiswahili cha asili kinachodumisha kusudi la cohortative na nguvu ya usemi.
- source_word: עַד אִישׁ הָאֱלֹהִים
  choice: kwa mtu wa Mungu
  rationale: Katika muktadha wa mwendo, עַד huonyesha mahali anapoelekea. ‘Mtu wa Mungu’ inadumisha cheo cha Kiebrania badala ya kukibadili kuwa ‘nabii.’
- source_word: וְאָשׁוּבָה
  choice: kisha nirudi
  rationale: Cohortative inaendeleza nia ya msemaji. ‘Kisha nirudi’ huonyesha kwa kawaida kwamba kurudi kunafuata safari ya kwenda.
