  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa simulizi la kawaida; ‘niende haraka’ huepuka taswira isiyo ya kawaida ya mwanamke kukimbia kwa miguu huku akiomba punda, lakini tanbihi inadumisha maana halisi ya kitenzi cha Kiebrania.
