  text: So she went from him and shut the door behind herself and behind her sons; they were bringing the vessels to her[a], and she was pouring.
translation:
  language: sw
  text: Basi akaondoka kwa Elisha, akafunga mlango, yeye na wanawe wakiwa ndani. Wanawe walikuwa wakimletea vyombo[a], naye alikuwa akimimina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema tu, “walikuwa wakimletea”; neno “vyombo” limetolewa katika muktadha wa vyombo vitupu vilivyotajwa katika mistari iliyotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: Basi akaondoka kwa Elisha
  rationale: Mfuatano wa simulizi unaendelezwa kwa “Basi”; kitenzi na kihusishi vinaonyesha kwamba mwanamke aliondoka alipokuwa pamoja naye. Jina “Elisha” limetumiwa kwa uwazi wa kawaida wa Kiswahili kutokana na muktadha.
- source_word: וַתִּסְגֹּר הַדֶּלֶת בַּעֲדָהּ וּבְעַד בָּנֶיהָ
  choice: akajifungia ndani pamoja na wanawe
  rationale: Nahau ya Kiebrania, kwa maana halisi kufunga mlango nyuma yake na nyuma ya wanawe, inaeleza kuwa alifunga mlango wao wakiwa ndani. Kiswahili hiki ni cha kawaida na kinahifadhi hali ya kujitenga ndani.
- source_word: הֵם מַגִּשִׁים אֵלֶיהָ
  choice: Wao walikuwa wakimletea vyombo[a]
  rationale: Kiambishi cha msisitizo “Wao” kinatofautisha kazi ya wanawe na yake; umbo la kuendelea linaonyesha tendo lililokuwa likiendelea. “Vyombo” kimetolewa katika muktadha kwa kuwa Kiebrania hakitaji yambwa wazi.
- source_word: וְהִיא מיצקת
  choice: naye alikuwa akimimina mafuta
  rationale: Kirai cha kuendelea kinaonyesha tendo sambamba na la wanawe. “Mafuta” yameelezwa kutokana na muktadha ili kitenzi “kumimina” kisikike kamili na wazi kwa Kiswahili.
