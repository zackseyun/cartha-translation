base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/035.yaml
  text: Then he returned and walked in the house[a], once here and once there; then he went up and stretched himself over him, and the boy sneezed seven times[b], and the boy opened his eyes.
translation:
  language: sw
  text: Kisha akarudi, akatembea ndani ya nyumba, mara huku, mara kule[a]. Kisha akapanda na kujiinamisha juu ya mtoto[b]. Mtoto akapiga chafya mara saba, kisha akafumbua macho yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akakwenda huku na huku.” Kiebrania kinasema kihalisi, “mara huku, mara kule.”
    reason: lexical_alternative
  - marker: b
    text: Au “kujinyoosha juu yake.” Kitenzi cha Kiebrania kinaweza kumaanisha kuinama au kujipinda juu ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Kisha akarudi
  rationale: Kitenzi שׁוּב hapa kinaendeleza simulizi kwa maana ya kurudi; “kisha” kinaonyesha mfuatano wa matukio kwa Kiswahili cha kawaida.
- source_word: וַיֵּלֶךְ בַּבַּיִת
  choice: na kutembea ndani ya nyumba
  rationale: Kirai hiki kinaonyesha kutembea katika eneo la nyumba; tafsiri hii ni ya moja kwa moja bila kuongeza wazo la kuhangaika au kuwa na wasiwasi.
- source_word: אַחַת הֵנָּה וְאַחַת הֵנָּה
  choice: mara huku, mara kule
  rationale: Hii inahifadhi taswira ya Kiebrania ya kwenda upande mmoja na kisha mwingine, huku ikiwa ya asili katika Kiswahili.
- source_word: וַיַּעַל
  choice: akapanda
  rationale: עלה ina maana ya kwenda juu, yaelekea kwenda mahali pa juu alipolala mtoto; maana ya mwendo wa kupanda imehifadhiwa.
- source_word: וַיִּגְהַר עָלָיו
  choice: kujiinamisha juu ya mtoto
  rationale: גהר inaweza kumaanisha kuinama au kujipinda juu ya mtu. Tafsiri hii inaeleza mkao wa Elisha bila kudai jinsi tendo hilo lilivyohusiana na muujiza.
- source_word: וַיְזוֹרֵר
  choice: akapiga chafya
  rationale: Kitenzi hiki adimu kwa kawaida hueleweka kuwa kupiga chafya; idadi inayofuata inaonyesha tendo lililorudiwa.
- source_word: הַנַּעַר
  choice: mtoto
  rationale: נַעַר ina wigo wa maana unaojumuisha mvulana au mtoto. Katika muktadha huu ni mwana wa mwanamke Mshunemu, hivyo “mtoto” ni wazi na ya asili.
- source_word: עַד שֶׁבַע פְּעָמִים
  choice: mara saba
  rationale: 'Ingawa עַד wakati mwingine humaanisha “hadi,” pamoja na idadi ya matukio hapa inaonyesha jumla iliyotimia: mara saba.'
- source_word: וַיִּפְקַח ... אֶת עֵינָיו
  choice: akafumbua macho yake
  rationale: Hii ni namna ya kawaida na wazi ya Kiswahili ya kueleza kufunguka kwa macho, sawasawa na nahau ya Kiebrania.
theological_decisions:
- issue: Maana ya tendo la Elisha juu ya mtoto
  choice: Tendo limetafsiriwa kama kujiinamisha juu ya mtoto, bila kueleza kuwa lenyewe lilikuwa njia ya kichawi au ya kisakramenti.
  alternative: “Akajinyoosha juu yake” au “akajilaza juu yake.”
  rationale: Kiebrania kinasimulia mkao wa mwili wa Elisha lakini hakielezi utaratibu uliosababisha mtoto kufufuka. Tafsiri inadumisha jambo lililotokea bila kuingiza ufafanuzi wa kiteolojia usiotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi zinafuata hatua za simulizi kwa uwazi. “Mtoto” imetumiwa badala ya neno la kizamani au lenye kudokeza umri mkubwa zaidi.
