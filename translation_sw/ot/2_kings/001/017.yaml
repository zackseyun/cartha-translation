source:
  edition: WLC
  text: וַ/יָּ֜מָת כִּ/דְבַ֥ר יְהוָ֣ה אֲשֶׁר דִּבֶּ֣ר אֵלִיָּ֗הוּ וַ/יִּמְלֹ֤ךְ יְהוֹרָם֙ תַּחְתָּ֔י/ו בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לִ/יהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה כִּ֛י לֹֽא הָ֥יָה ל֖/וֹ בֵּֽן׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/017.yaml
  text: So he died[a], according to the word of Yahweh that Elijah had spoken. And Jehoram became king in his place in the second year of Jehoram son of Jehoshaphat, king of Judah, because he had no son.
translation:
  language: sw
  text: Akafa[a], kulingana na neno la Yahwe alilolisema Eliya. Yehoramu akawa mfalme badala yake katika mwaka wa pili wa utawala wa Yehoramu, mwana wa Yehoshafati, mfalme wa Yuda, kwa kuwa hakuwa na mwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Akafa ... Yehoramu akatawala badala yake.” Vitenzi vya Kiebrania ni maumbo ya kawaida ya masimulizi; “akawa mfalme” hukazia kuingia kwake madarakani, na “akatawala” ni tafsiri rasmi zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Basi akafa
  rationale: Umbo la masimulizi linaendeleza mfuatano wa matukio; “Basi” linaonyesha matokeo na mwendelezo bila kuongeza maana mpya.
- source_word: כִּדְבַר יְהוָה
  choice: sawasawa na neno la Yahwe
  rationale: כִּדְבַר huonyesha kwamba kifo kilitokea kwa kupatana na neno lililotamkwa; jina la Mungu יְהוָה limetafsiriwa “Yahwe.”
- source_word: אֲשֶׁר דִּבֶּר אֵלִיָּהוּ
  choice: ambalo Eliya alikuwa amesema
  rationale: Kishazi hiki kinarejelea neno lililotangulia, na wakati uliopita timilifu unaonyesha kuwa Eliya alikuwa amelisema kabla ya kifo hicho.
- source_word: וַיִּמְלֹךְ יְהוֹרָם תַּחְתָּיו
  choice: Yehoramu akawa mfalme mahali pake
  rationale: Katika muktadha huu מלך inaashiria kuingia madarakani; “akawa mfalme” ni Kiswahili cha kawaida, huku “mahali pake” ikihifadhi תַּחְתָּיו.
- source_word: בִּשְׁנַת שְׁתַּיִם לִיהוֹרָם
  choice: katika mwaka wa pili wa Yehoramu
  rationale: Hii ni kauli ya kuhesabu wakati kwa miaka ya utawala, na tafsiri hii ni ya kawaida na wazi.
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: mwana wa Yehoshafati, mfalme wa Yuda
  rationale: Kirai hiki kinamtambulisha Yehoramu anayekusudiwa na kumtofautisha na Yehoramu wa ufalme wa kaskazini.
- source_word: כִּי לֹא הָיָה לוֹ בֵּן
  choice: kwa sababu hakuwa na mwana
  rationale: כִּי hapa inatoa sababu ya Yehoramu kurithi ufalme badala ya mwana wa mfalme aliyekufa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה; “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina yametolewa kwa maumbo yaliyozoeleka katika tafsiri za Kiswahili: Eliya, Yehoramu, Yehoshafati na Yuda. Sentensi inadumisha tofauti kati ya Yehoramu wawili bila kuongeza ufafanuzi usiokuwamo katika maandishi.'
