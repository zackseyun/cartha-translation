  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּפֹּ֨ל אֲחַזְיָ֜ה בְּעַ֣ד הַ/שְּׂבָכָ֗ה בַּ/עֲלִיָּת֛/וֹ אֲשֶׁ֥ר בְּ/שֹׁמְר֖וֹן וַ/יָּ֑חַל וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ לְכ֣וּ דִרְשׁ֗וּ בְּ/בַ֤עַל זְבוּב֙ אֱלֹהֵ֣י עֶקְר֔וֹן אִם אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/002.yaml
  text: Ahaziah fell through the lattice in his upper room[a], which was in Samaria, and was injured. So he sent messengers and said to them, “Go, inquire of Baal-zebub, the god of Ekron, whether I will recover from this sickness.”
translation:
  language: sw
  text: Ahazia alianguka kupitia kimiani cha chumba chake cha juu huko Samaria, akawa mgonjwa. Basi akawatuma wajumbe na kuwaambia, “Nendeni mkamwulize Baal-Zebubu[a], mungu wa Ekroni, kama nitapona ugonjwa huu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-Zebubu ni umbo la Kiebrania la jina hili; umbo la baadaye Beelzebuli linapatikana katika Kigiriki na katika baadhi ya mapokeo ya tafsiri.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעַד הַשְּׂבָכָה
  choice: kupitia kimiani
  rationale: Kirai hiki kinaonyesha kuanguka kupitia uwazi wenye kimia au wavu. “Kupitia kimiani” kinahifadhi picha halisi bila kupunguza maana kuwa dirisha la kawaida tu.
- source_word: עֲלִיָּתוֹ
  choice: chumba chake cha juu
  rationale: Neno hili humaanisha chumba kilicho sehemu ya juu ya jengo; tafsiri hii ni ya kawaida, wazi, na yenye heshima katika Kiswahili cha sasa.
- source_word: וַיָּחַל
  choice: akaumia
  rationale: Kitenzi kwa msingi wake kinaweza kumaanisha kuwa mgonjwa au dhaifu; katika muktadha wa kuanguka, “akaumia” kinaeleza hali iliyotokana na ajali na kuandaa swali linalofuata kuhusu kupona.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Hapa ni watu waliotumwa na mfalme, si malaika; “wajumbe” ndilo neno la kimuktadha.
- source_word: דִרְשׁוּ
  choice: mkamwulize
  rationale: Katika muktadha huu kitenzi kina maana ya kutafuta jibu la kiungu kwa kushauriana na mungu huyo. “Mkamwulize” ni Kiswahili cha kawaida kinachohifadhi tendo hilo la kutafuta jibu.
- source_word: בַּעַל זְבוּב
  choice: Baal-Zebubu
  rationale: Jina limetoholewa moja kwa moja kutoka umbo la Kiebrania badala ya kubadilishwa kuwa umbo la baadaye la Kigiriki.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: mungu wa Ekroni
  rationale: Hiki ni kirai cha umilikaji kinachomtambulisha Baal-Zebubu kuwa mungu wa Ekroni.
- source_word: אִם אֶחְיֶה מֵחֳלִי זֶה
  choice: kama nitapona ugonjwa huu
  rationale: Ingawa kwa karibu ni “kama nitaishi kutokana na ugonjwa huu,” Kiswahili cha kawaida hueleza wazo hilo kwa “nitapona ugonjwa huu,” huku kikihifadhi kutokuwa na uhakika kuhusu matokeo.
- source_word: וַיִּפֹּל
  choice: alianguka
  rationale: Kitenzi rahisi cha simulizi kimetafsiriwa moja kwa moja.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili.
theological_decisions:
- issue: Namna ya kuandika jina la mungu wa kipagani
  choice: Baal-Zebubu
  alternative: Beelzebuli
  rationale: Maandishi ya Kiebrania yana בַּעַל זְבוּב, kwa hiyo matini kuu inafuata umbo la Kiebrania. Umbo linalojulikana zaidi kutoka mapokeo ya Kigiriki linawekwa katika tanbihi bila kupewa nafasi ya umbo la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. Kiunganishi “Basi” kinaonyesha mwendelezo wa matokeo bila kuongeza neno la wakati lisilokuwapo katika chanzo. Alama ya tanbihi imewekwa baada ya jina linaloelezwa.
