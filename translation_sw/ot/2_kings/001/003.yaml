reference: 2 Kings 1:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מַלְאַ֣ךְ יְהוָ֗ה דִּבֶּר֙ אֶל אֵלִיָּ֣ה הַ/תִּשְׁבִּ֔י ק֣וּם עֲלֵ֔ה לִ/קְרַ֖את מַלְאֲכֵ֣י מֶֽלֶךְ שֹׁמְר֑וֹן וְ/דַבֵּ֣ר אֲלֵ/הֶ֔ם הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתֶּם֙ הֹֽלְכִ֔ים לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֥י עֶקְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/003.yaml
  text: But the angel of Yahweh spoke to Elijah the Tishbite[a], “Get up, go up to meet the messengers of the king of Samaria, and say to them, ‘Is it because there is no God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?’”
translation:
  language: sw
  text: Lakini malaika wa Yahwe akamwambia Eliya Mtishbi, “Ondoka, panda ukakutane na wajumbe wa mfalme wa Samaria, waambie, ‘Je, ni kwa sababu hakuna Mungu katika Israeli, ndiyo maana mnaenda kumwuliza Baal-Zebubu, mungu wa Ekroni?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: Lakini malaika wa Yahwe
  rationale: Kiunganishi וּ kinaonyesha tofauti na hatua ya mfalme katika mstari uliotangulia, hivyo ‘Lakini’ kinafaa katika mtiririko wa simulizi. Katika muktadha huu מַלְאַךְ ni kiumbe wa mbinguni, kwa hiyo ‘malaika’ ni ya kawaida na huitofautisha na wajumbe wa kibinadamu wanaotajwa baadaye.
- source_word: דִּבֶּר אֶל
  choice: akamwambia
  rationale: Katika Kiswahili cha simulizi, ‘akamwambia’ huwasilisha kwa kawaida kitendo cha kusema kilichofuatana na matukio yaliyotangulia; kiambishi cha yambwa kinaonyesha kuwa maneno yalimwelekea Eliya.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: Eliya Mtishbi
  rationale: Jina linatolewa kwa umbo lililozoeleka la Kiswahili, na gentiliki הַתִּשְׁבִּי inatafsiriwa kwa muundo wa kawaida wa Kiswahili ‘Mtishbi’.
- source_word: קוּם עֲלֵה
  choice: Ondoka, panda
  rationale: Amri zote mbili zimehifadhiwa. ‘Ondoka’ ni Kiswahili cha sasa na cha kawaida kwa קוּם katika amri ya kuanza safari; ‘panda’ huhifadhi mwelekeo wa עֲלֵה.
- source_word: לִקְרַאת
  choice: ukakutane na
  rationale: Muundo huu unaonyesha kusudi la kwenda kukutana nao bila kuongeza wazo la kuwakabili kwa uhasama.
- source_word: מַלְאֲכֵי מֶלֶךְ שֹׁמְרוֹן
  choice: wajumbe wa mfalme wa Samaria
  rationale: Hapa מַלְאָךְ inawahusu wanadamu waliotumwa na mfalme, hivyo ‘wajumbe’ huepuka kuwachanganya na malaika wa Yahwe. ‘Mfalme wa Samaria’ huhifadhi namna eneo hilo lilivyotajwa katika Kiebrania.
- source_word: וְדַבֵּר אֲלֵהֶם
  choice: uwaambie
  rationale: Kabla ya usemi wa moja kwa moja, ‘uwaambie’ ni usemi wa asili katika Kiswahili na huhifadhi amri pamoja na walengwa wake.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Je, ni kwa sababu hakuna Mungu katika Israeli
  rationale: Huu ni muundo wa swali la balagha lenye kukemea. Tafsiri hii ni wazi na ya asili huku ikihifadhi madai ya swali bila kuligeuza kuwa kauli ya moja kwa moja.
- source_word: אַתֶּם הֹלְכִים
  choice: mnaenda
  rationale: Umbo la wakati wa sasa linaonyesha hatua inayokusudiwa au inayoendelea, kama participle ya Kiebrania.
- source_word: לִדְרֹשׁ
  choice: kuuliza kwa
  rationale: Katika muktadha wa kutafuta jibu la kiungu, ‘kuuliza kwa’ hueleza kwenda kupata jibu kutoka kwa mungu huyo. ‘Kushauriana na’ lingeweza kudokeza mazungumzo ya pande mbili kuliko ilivyo lazima.
- source_word: בַּעַל זְבוּב
  choice: Baal-Zebubu
  rationale: Jina la pekee limetoholewa kwa tahajia inayoweza kutamkwa kwa urahisi katika Kiswahili, huku kistari kikionyesha jina ambatani.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: mungu wa Ekroni
  rationale: Muundo wa uhusiano wa Kiebrania umetolewa kwa Kiswahili cha kawaida, ukitambulisha uhusiano wa Baal-Zebubu na Ekroni.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Jina la agano limetolewa moja kwa moja kama ‘Yahwe’, kwa umbo la Kiswahili, badala ya kubadilishwa kuwa cheo. Hii huhifadhi tofauti kati ya jina hilo na אֱלֹהִים (‘Mungu’) inayotokea baadaye katika mstari.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa Yahwe
  alternative: mjumbe wa Yahwe
  rationale: Katika simulizi hili ‘malaika’ ndiyo maana ya kawaida zaidi, lakini tafsiri haiongezi dai lolote kuhusu asili au utambulisho wake zaidi ya maneno ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa simulizi umetolewa kwa viambishi vya mfululizo ‘aka-’, huku amri mbili za Kiebrania zikihifadhiwa. Hakuna tanbihi iliyoongezwa kwa sababu mbadala wa Kiingereza uliotolewa unaeleza maana ileile ya swali la balagha na hauhitaji kuonyeshwa kama tofauti muhimu ya Kiswahili.
