base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/011.yaml
  text: 'Again he sent to him another captain of fifty with his fifty. He answered and said to him[a], “Man of God, thus says the king: ‘Come down quickly.’”'
translation:
  language: sw
  text: 'Kisha mfalme akamtumia tena mkuu mwingine wa askari hamsini pamoja na askari wake hamsini. Mkuu huyo akamwambia, “Mtu wa Mungu, hivi ndivyo asemavyo mfalme: ‘Shuka upesi.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּשְׁלַח אֵלָיו
  choice: Kisha mfalme akamtumia tena
  rationale: וַיָּשָׁב pamoja na kitenzi kinachofuata huonyesha kurudiwa kwa tendo, si lazima kurudi kimwili. Kiima ‘mfalme’ kimewekwa wazi kutokana na muktadha ili Kiswahili kisomeke kwa kawaida.
- source_word: שַׂר חֲמִשִּׁים
  choice: mkuu ... wa askari hamsini
  rationale: Cheo hiki kinamtaja afisa aliyesimamia kikosi cha watu hamsini. ‘Mkuu wa askari hamsini’ ni wazi na ya kawaida katika Kiswahili.
- source_word: אַחֵר
  choice: mwingine
  rationale: Huonyesha kwamba afisa mpya alitumwa badala ya yule wa kwanza.
- source_word: וַחֲמִשָּׁיו
  choice: pamoja na askari wake hamsini
  rationale: Ingawa kwa muundo wa moja kwa moja ni ‘na hamsini wake,’ maana ni kwamba mkuu aliandamana na askari hamsini waliokuwa chini yake.
- source_word: וַיַּעַן וַיְדַבֵּר אֵלָיו
  choice: Mkuu huyo akamwambia
  rationale: Jozi ya vitenzi vya Kiebrania ni fomula ya simulizi ya kuanzisha usemi. Kiswahili cha kawaida hakihitaji kurudia ‘akajibu na kusema,’ hasa bila swali lililotangulia.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mtu wa Mungu
  rationale: Ni cheo kinachotambulika cha Eliya na pia hapa ni namna ya kumwita moja kwa moja.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: hivi ndivyo asemavyo mfalme
  rationale: Inahifadhi fomula rasmi na yenye mamlaka ya ujumbe wa kifalme huku ikibaki ya kueleweka katika Kiswahili.
- source_word: מְהֵרָה
  choice: upesi
  rationale: Kielezi hiki huonyesha uharaka wa amri.
- source_word: רֵדָה
  choice: Shuka
  rationale: Kitenzi cha Kiebrania humaanisha kushuka bila kubainisha kwa asili tofauti ya Kiingereza kati ya ‘come’ na ‘go.’ ‘Shuka’ kinahifadhi maana hiyo moja kwa moja na kinafaa kwa mazingira ya Eliya kuwa juu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Fomula ya kifalme imehifadhiwa kwa lugha yenye uzito bila kuwa ya kale kupita kiasi.
