base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/010.yaml
  text: Elijah answered and said to the captain of fifty, “But if I am a man of God, let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: sw
  text: Eliya akamjibu mkuu wa askari hamsini, akasema, “Lakini ikiwa mimi ni mtu wa Mungu, moto ushuke kutoka mbinguni na ukuteketeze wewe pamoja na askari wako hamsini.” Ndipo moto ukashuka kutoka mbinguni, ukamteketeza yeye pamoja na askari wake hamsini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂר הַחֲמִשִּׁים
  choice: mkuu wa askari hamsini
  rationale: Kirai hiki kinamtaja afisa aliyesimamia kikosi cha watu hamsini; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Waw ya mwanzo inaweza kuonyesha mwendelezo au msisitizo wa kujibu changamoto; “Lakini” inahifadhi tofauti iliyopo katika muktadha, huku “ikiwa” ikihifadhi muundo wa sharti.
- source_word: אִישׁ אֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ndilo jina la moja kwa moja na lililozoeleka kwa mtu anayetambuliwa kuwa mjumbe wa Mungu.
- source_word: תֵּרֶד אֵשׁ מִן־הַשָּׁמַיִם
  choice: moto na ushuke kutoka mbinguni
  rationale: Muundo wa Kiswahili wenye “na” unatoa ombi/amri ya nafsi ya tatu na kuhifadhi picha ya moto kushuka kutoka mbinguni.
- source_word: וְתֹאכַל
  choice: ukuteketeze
  rationale: Kitenzi cha Kiebrania kwa msingi ni “kula,” lakini kinapotumiwa kuhusu moto humaanisha kuangamiza au kuteketeza; chaguo hili ni la asili katika Kiswahili.
- source_word: חֲמִשֶּׁיךָ
  choice: askari wako hamsini
  rationale: Kwa maana halisi ni “hamsini wako,” lakini muktadha unaonyesha kikosi cha askari hamsini; kuongeza “askari” huondoa utata usio wa msingi katika Kiswahili.
theological_decisions:
- issue: Sharti la Eliya kuhusu utambulisho wake kama mtu wa Mungu
  choice: ikiwa mimi ni mtu wa Mungu
  alternative: kwa kuwa mimi ni mtu wa Mungu
  rationale: Kiebrania kina אִם, “ikiwa”; tafsiri haipaswi kuligeuza sharti la usemi kuwa dai la sababu, hata kama matokeo yanathibitisha utambulisho wake.
- issue: Chanzo na utekelezaji wa moto
  choice: moto na ushuke ... Ndipo moto ukashuka
  alternative: Mungu na ateremshe moto
  rationale: Matini humtaja moto ukishuka bila kumtaja Mungu moja kwa moja kama kiima cha tendo; tafsiri inahifadhi namna hiyo ya usimulizi bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumiwa kwa vitenzi vya mfululizo (“akamjibu,” “akasema,” “ukashuka”), na lugha imewekwa wazi kwa msomaji wa kawaida bila kupunguza ukali wa tukio.
