  yaml_path: translation/ot/2_kings/001/008.yaml
  text: They said to him[a], “He was a hairy man, with a leather belt fastened around his waist.” And he said, “It is Elijah the Tishbite.”
translation:
  language: sw
  text: Wakamwambia[a], “Alikuwa mtu mwenye nywele nyingi, naye alikuwa amejifunga mkanda wa ngozi kiunoni.” Akasema, “Huyo ni Eliya Mtishbi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alikuwa mtu aliyevaa vazi lililotengenezwa kwa nywele.” Usemi wa Kiebrania kwa halisi ni “mtu mwenye nywele,” nao unaweza kumaanisha mtu mwenye nywele nyingi au mtu aliyevaa vazi lililotengenezwa kwa nywele.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: mtu
  rationale: Katika muktadha huu neno hilo linamtaja mwanamume, lakini Kiswahili cha kawaida hutumia “mtu” kwa urahisi katika maelezo haya bila kupoteza rejeleo lake.
- source_word: בַּעַל שֵׂעָר
  choice: mtu mwenye nywele nyingi
  rationale: Usemi huu kwa halisi ni “mwenye nywele”; unaweza kumweleza mtu mwenye nywele nyingi au mtu aliyevaa vazi la manyoya. Maandishi makuu yanahifadhi maana ya moja kwa moja ya maumbile, huku uwezekano mwingine ukitajwa katika tanbihi.
- source_word: וְאֵזוֹר עוֹר
  choice: mkanda wa ngozi
  rationale: אֵזוֹר ni mkanda au mshipi, na עוֹר hutaja nyenzo yake kuwa ngozi; “mkanda wa ngozi” ni Kiswahili cha sasa na wazi.
- source_word: אָזוּר בְּמָתְנָיו
  choice: alikuwa amejifunga ... kiunoni
  rationale: Kirai kinaeleza mkanda uliovaliwa au kufungwa katika sehemu ya kiuno. “Amejifunga ... kiunoni” ni usemi wa kawaida unaowasilisha hali hiyo.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: Eliya Mtishbi
  rationale: Jina limeandikwa kwa umbo la Kiswahili “Eliya,” na nisba הַתִּשְׁבִּי imetolewa kwa umbo fupi la kawaida “Mtishbi.”
- source_word: הוּא
  choice: Huyo ni
  rationale: Katika Kiswahili, “Huyo ni Eliya” ni njia ya asili ya kumtambua mtu kutokana na maelezo yaliyotolewa.
