  text: 'Therefore[a], this is what Yahweh says: ‘You will not come down from the bed that you have gone up onto[c][b], for you will surely die.’ And Elijah went.'
translation:
  language: sw
  text: 'Kwa hiyo, hivi ndivyo Yahwe anavyosema: “Hutashuka kutoka kwenye kitanda ulichopanda juu yake, kwa maana hakika utakufa.” Kisha Eliya akaenda.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָכֵן
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho la hukumu kutokana na karipio lililotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: כֹּה אָמַר יְהוָה
  choice: hivi ndivyo Yahwe anavyosema
  rationale: Inawasilisha kwa lugha ya sasa fomula rasmi ya ujumbe wa kinabii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha moja kwa moja jina la Mungu, YHWH, badala ya kulibadili kuwa cheo.
- source_word: הַמִּטָּה
  choice: kitanda
  rationale: Ni maana ya kawaida ya neno hili katika muktadha huu; ‘kitanda cha mgonjwa’ kingeongeza ufafanuzi usiotajwa wazi.
- source_word: אֲשֶׁר עָלִיתָ שָּׁם
  choice: ulichopanda
  rationale: ‘Kupanda’ huhifadhi taswira ya kwenda juu na ulinganifu wake na ‘kushuka’; kiwakilishi cha mahali שׁם hakihitaji kutafsiriwa kando katika muundo wa kawaida wa Kiswahili.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  choice: Hutashuka kutoka kwenye
  rationale: Inahifadhi kinyume cha kimakusudi kati ya kupanda na kushuka huku ikibaki ya kawaida katika Kiswahili.
- source_word: כִּי מוֹת תָּמוּת
  choice: kwa maana hakika utakufa
  rationale: ‘Hakika’ huonyesha msisitizo na uhakika unaotolewa na muundo wa kitenzi kisoukomo pamoja na kitenzi kamili.
- source_word: וַיֵּלֶךְ אֵלִיָּה
  choice: Kisha Eliya akaenda
  rationale: ‘Kisha’ na muundo wa ‘aka-’ huendeleza simulizi kwa kawaida; ‘akaenda’ huhifadhi maana ya msingi ya הלך.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina maalumu la Mungu, si cheo; ‘Yahwe’ hulihifadhi moja kwa moja bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Tafsiri imehifadhi mkabala wa Kiebrania kati ya ‘kupanda’ na ‘kushuka’ bila kuiga muundo wa Kiebrania unaosikika mzito katika Kiswahili.
