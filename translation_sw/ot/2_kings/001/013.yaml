  text: וַ/יָּ֗שָׁב וַ/יִּשְׁלַ֛ח שַׂר חֲמִשִּׁ֥ים שְׁלִשִׁ֖ים וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֡עַל וַ/יָּבֹא֩ שַׂר הַ/חֲמִשִּׁ֨ים הַ/שְּׁלִישִׁ֜י וַ/יִּכְרַ֥ע עַל בִּרְכָּ֣י/ו לְ/נֶ֣גֶד אֵלִיָּ֗הוּ וַ/יִּתְחַנֵּ֤ן אֵלָי/ו֙ וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָֽ/אֱלֹהִ֔ים תִּֽיקַר נָ֣א נַפְשִׁ֗/י וְ/נֶ֨פֶשׁ עֲבָדֶ֥י/ךָֽ אֵ֛לֶּה חֲמִשִּׁ֖ים בְּ/עֵינֶֽי/ךָ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/013.yaml
  text: Again he sent a third captain of fifty with his fifty[a]. He went up and came, and the third captain of fifty knelt on his knees before Elijah and pleaded with him and said to him, “Man of God[b], please let my life and the life of these fifty servants of yours be precious in your sight.”
translation:
  language: sw
  text: Akatuma tena mkuu wa hamsini, pamoja na watu wake hamsini. Mkuu huyo wa tatu akapanda, akafika, akapiga magoti mbele ya Eliya, akamsihi, akamwambia, “Ee mtu wa Mungu, tafadhali, maisha yangu na maisha ya hawa watumishi wako hamsini yawe ya thamani machoni pako[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi yangu na nafsi ya hawa watumishi wako hamsini.” Neno la Kiebrania nefesh linaweza kumaanisha “uhai,” “mtu mwenyewe,” au “nafsi,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: Akatuma tena
  rationale: Katika mfululizo huu wa masimulizi, וַיָּשָׁב inaonyesha kurudiwa kwa tendo la kutuma; “tena” ni Kiswahili cha kawaida kuliko tafsiri ya neno kwa neno “akarudi akatuma.”
- source_word: שַׂר חֲמִשִּׁים שְׁלִשִׁים וַחֲמִשָּׁיו
  choice: mkuu wa tatu wa kikosi cha askari hamsini pamoja na askari wake hamsini
  rationale: “Mkuu wa tatu” huhifadhi mpangilio wa tatu, na “kikosi cha askari hamsini” hufafanua kwa kawaida cheo cha שַׂר־חֲמִשִּׁים. Neno “askari” katika sehemu ya pili limeelezwa kutokana na muktadha wa kikosi, ingawa Kiebrania kinasema kwa ufupi “hamsini wake.”
- source_word: וַיַּעַל וַיָּבֹא
  choice: akapanda, akamjia Eliya
  rationale: Vitenzi vyote viwili vimehifadhiwa. Yule mkuu ndiye kiima kinachofuata vitenzi katika Kiebrania; “akamjia Eliya” huweka wazi kwa Kiswahili mahali alikofika bila kubadili tendo.
- source_word: וַיִּכְרַע עַל בִּרְכָּיו
  choice: akapiga magoti
  rationale: Hii ni nahau ya kawaida ya Kiswahili inayoonyesha kwa usahihi kupiga au kukunja magoti kwa unyenyekevu.
- source_word: וַיִּתְחַנֵּן אֵלָיו וַיְדַבֵּר אֵלָיו
  choice: akamsihi na kumwambia
  rationale: “Akamsihi” huonyesha ombi la dhati la kitenzi חנן, huku “na kumwambia” kikihifadhi kitenzi tofauti cha kusema.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Ee mtu wa Mungu
  rationale: “Mtu wa Mungu” ni cheo kinachotambulika cha nabii; “Ee” huonyesha wazi matumizi ya kumwita mtu moja kwa moja.
- source_word: תִּיקַר נָא ... בְּעֵינֶיךָ
  choice: tafadhali ... yawe ya thamani machoni pako
  rationale: Tafsiri hii huhifadhi sitiari ya Kiebrania ya kuwa wa thamani machoni pa mtu, badala ya kuifupisha kuwa “uyaokoe” au “uyasamehe.”
- source_word: נַפְשִׁי וְנֶפֶשׁ
  choice: maisha yangu na maisha
  rationale: Katika hatari hii ya kuuawa, נֶפֶשׁ humaanisha uhai wa mtu. Kiswahili hutumia “maisha” kwa kawaida katika maana hii, ingawa umbo lake ni la wingi.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika ombi lililotolewa mbele ya hatari ya kifo
  choice: maisha
  alternative: nafsi
  rationale: Muktadha unahusu kuachwa hai kwa mkuu na askari wake, si ufafanuzi wa kimaandiko kuhusu sehemu isiyo ya mwili ya mwanadamu. “Maisha” huepuka kuingiza dhana ya baadaye ya “roho” bila msingi katika mstari huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa masimulizi umetumia viambishi vya mfululizo “aka-”; maneno ya kijeshi yamewekwa wazi kwa lugha inayoeleweka na wasomaji wa kawaida.
