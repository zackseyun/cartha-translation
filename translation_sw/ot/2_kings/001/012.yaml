base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/012.yaml
  text: Elijah answered and said to them[a], “If I am a man of God[c][b], let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: sw
  text: Eliya akawajibu, akawaambia, “Ikiwa mimi ni mtu wa Mungu[a], moto ushuke kutoka mbinguni na ukuteketeze wewe na watu wako hamsini[b].” Ndipo moto wa Mungu[c] ukashuka kutoka mbinguni, ukamteketeza yeye na watu wake hamsini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule mtu wa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “hamsini wako”; yaani, kikosi cha nahodha cha watu hamsini.
    reason: cultural_note
  - marker: c
    text: Au, “moto kutoka kwa Mungu ukashuka kutoka mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אֵלִיָּה וַיְדַבֵּר אֲלֵיהֶם
  choice: Eliya akawajibu, akawaambia
  rationale: Huhifadhi muundo wa simulizi wa Kiebrania unaounganisha kujibu na kusema, huku ukisomeka kwa Kiswahili cha kawaida.
- source_word: אִם אִישׁ הָאֱלֹהִים אָנִי
  choice: Ikiwa mimi ni mtu wa Mungu
  rationale: Kirai hiki ni dai la hadhi ya kinabii; “mtu wa Mungu” ni tafsiri ya kawaida na haiongezi maana ya kimadhehebu.
- source_word: תֵּרֶד אֵשׁ מִן הַשָּׁמַיִם
  choice: moto na ushuke kutoka mbinguni
  rationale: Muundo wa “na ushuke” unaonyesha nguvu ya jussive/ombi la hukumu, si utabiri wa kawaida tu.
- source_word: וְתֹאכַל
  choice: ukuteketeze
  rationale: Kitenzi אכל kinapotumiwa kuhusu moto humaanisha kuangamiza kwa kuteketeza; neno hili ni la asili na lenye hadhi katika Kiswahili.
- source_word: אֹתְךָ וְאֶת חֲמִשֶּׁיךָ
  choice: wewe pamoja na hao watu wako hamsini
  rationale: “Wewe” ni nahodha anayesemeshwa kwa umoja, na “hamsini wako” ni kikosi chake; kuongeza “watu” huifanya maana iwe wazi kwa msomaji wa Kiswahili.
- source_word: וַתֵּרֶד אֵשׁ אֱלֹהִים מִן הַשָּׁמַיִם
  choice: Ndipo moto wa Mungu ukashuka kutoka mbinguni
  rationale: Hufuata kwa karibu muundo wa Kiebrania אֵשׁ אֱלֹהִים na kudumisha uhusiano wa moto huo na Mungu bila kueleza zaidi namna ulivyotokea.
- source_word: וַתֹּאכַל אֹתוֹ וְאֶת חֲמִשָּׁיו
  choice: ukamteketeza yeye pamoja na hao watu wake hamsini
  rationale: Hurudia kitenzi kilekile kwa ulinganifu na kutofautisha nahodha mmoja na kikosi chake cha watu hamsini.
theological_decisions:
- issue: Cheo cha kinabii אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  alternative: yule mtu wa Mungu
  rationale: Katika sentensi hii kirai ni kiarifu na kinadai hadhi ya kinabii; “mtu wa Mungu” hudumisha maana hiyo bila kulazimisha umahususi usio lazima.
- issue: Maana ya אֵשׁ אֱלֹהִים
  choice: moto wa Mungu
  alternative: moto kutoka kwa Mungu
  rationale: Tafsiri hii huhifadhi uhusiano wa moja kwa moja wa moto na Mungu ulio katika maandishi ya Kiebrania, bila kuamua ikiwa muundo huo unasisitiza chanzo, umiliki, au sifa ya kimungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa sasa. “Watu wako hamsini” hutumiwa badala ya “hamsini wako” ili kuondoa utata wa Kiswahili, na “moto na ushuke” huhifadhi nguvu ya tamko la Eliya.
