  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֲחַזְיָ֖הוּ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/018.yaml
  text: The rest of the acts of Ahaziah[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: sw
  text: Matendo mengine ya Ahazia, ambayo aliyafanya—je, hayakuandikwa[a] katika Kitabu cha Kumbukumbu za Wafalme wa Israeli?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hayakuwekwa katika kumbukumbu”; Kiebrania kinasema kihalisi “hayakuandikwa,” kwa kutumia kaida ya kawaida ya kutaja nyaraka za kifalme.
    reason: lexical_alternative
  - marker: b
    text: “Kitabu cha Kumbukumbu za Wafalme wa Israeli” ni chanzo cha kumbukumbu za kifalme kinachotajwa katika kitabu cha Wafalme; si lazima kiwe kitabu cha Biblia cha Mambo ya Nyakati.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר
  choice: mengine
  rationale: Katika kaida ya muhtasari wa utawala, neno hili humaanisha sehemu iliyobaki; Kiswahili cha asili husema “matendo mengine” bila kulazimisha kiunganishi cha “na” mwanzoni.
- source_word: דִּבְרֵי
  choice: matendo
  rationale: Katika muktadha wa kumbukumbu za mfalme, neno hili hurejelea mambo au matendo yake, si maneno aliyosema tu.
- source_word: אֲחַזְיָהוּ
  choice: Ahazia
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֲשֶׁר עָשָׂה
  choice: ambayo aliyafanya
  rationale: Huhifadhi kishazi cha Kiebrania kinachofafanua matendo ya mfalme, hata ingawa kina urudiaji wa kimakusudi.
- source_word: הֲלוֹא
  choice: je, hayakuandikwa
  rationale: Muundo wa swali la balagha unaotarajia jibu la kukubali umehifadhiwa kwa “je ... hayaku-?”
- source_word: הֵמָּה כְתוּבִים
  choice: hayakuandikwa
  rationale: Kitenzi cha Kiebrania kinasema kihalisi “yameandikwa”; umbo la Kiswahili limepatana na “matendo” na wakati wa simulizi.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa kihusishi kinaweza kuwa “juu ya,” katika kaida hii ya nyaraka maana ya kawaida ni habari kupatikana ndani ya kitabu au hati.
- source_word: דִּבְרֵי הַיָּמִים
  choice: Kumbukumbu
  rationale: Kirai hiki hutaja rekodi za matukio ya kifalme; “Kumbukumbu” ni wazi na cha kawaida katika kichwa cha chanzo hicho.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: za Wafalme wa Israeli
  rationale: Hiki ni kiambatisho cha kichwa cha kumbukumbu, na “za” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Utambulisho wa Kitabu cha Kumbukumbu za Wafalme wa Israeli
  choice: Kimetajwa kama chanzo cha kumbukumbu za kifalme bila kukitambulisha na kitabu cha Biblia cha Mambo ya Nyakati.
  alternative: Kukitaja kana kwamba ni kitabu cha Biblia cha Mambo ya Nyakati.
  rationale: Muktadha wa Wafalme unaelekeza kwenye chanzo cha kumbukumbu za utawala; maandishi yenyewe hayathibitishi kuwa ni kitabu cha kikanoni cha Mambo ya Nyakati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa msomaji wa kawaida. Swali la balagha na urudiaji wa kishazi cha chanzo vimehifadhiwa bila kufanya sentensi kuwa ngumu kupita kiasi.
