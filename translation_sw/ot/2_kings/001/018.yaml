  source_fidelity: 'Maana ya kaida ya Kiebrania imehifadhiwa kwa usahihi: sehemu iliyobaki ya matendo ya Ahazia, kishazi kinachoyafafanua, swali la balagha, na rejeo la rekodi ya kifalme. “Hayakuandikwa” ni umbo linalokubalika katika Kiswahili kwa swali hili la kiutaratibu wa kumbukumbu za zamani.'
