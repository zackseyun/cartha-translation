  text: הִ֠נֵּה יָ֤רְדָה אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ֠/תֹּאכַל אֶת שְׁנֵ֞י שָׂרֵ֧י הַ/חֲמִשִּׁ֛ים הָ/רִאשֹׁנִ֖ים וְ/אֶת חֲמִשֵּׁי/הֶ֑ם וְ/עַתָּ֕ה תִּיקַ֥ר נַפְשִׁ֖/י בְּ/עֵינֶֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/014.yaml
  text: Look[a], fire came down from heaven and consumed the first two captains of fifty and their fifties. But now[b], let my life be precious in your sight.
translation:
  language: sw
  text: Tazama, moto ulishuka kutoka mbinguni, ukawateketeza wale maakida wawili wa kwanza wa vikosi vya watu hamsini, pamoja na vikosi vyao vya watu hamsini. Lakini sasa, maisha yangu na yawe ya thamani machoni pako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi yangu na iwe ya thamani machoni pako.” Hapa “nafsi yangu” inamaanisha maisha ya msemaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa msisitizo kwenye jambo lililotokea; “Tazama” ni la kawaida, lenye heshima, na linahifadhi nguvu ya uashiriaji.
- source_word: יָרְדָה אֵשׁ מִן הַשָּׁמַיִם
  choice: moto ulishuka kutoka mbinguni
  rationale: Hili ni tamko la moja kwa moja na la asili katika Kiswahili, linalohifadhi tendo, mhusika, na chanzo chake.
- source_word: וַתֹּאכַל
  choice: kuwateketeza
  rationale: Ingawa kitenzi cha Kiebrania kwa msingi ni “kula,” moto unapokuwa mhusika, “teketeza” huwasilisha kwa usahihi kuangamizwa kabisa.
- source_word: שְׁנֵי שָׂרֵי הַחֲמִשִּׁים הָרִאשֹׁנִים
  choice: wale makamanda wawili wa kwanza wa vikosi vya askari hamsini
  rationale: “Makamanda” linafaa katika muktadha wa kijeshi; maelezo ya vikosi vya askari hamsini yanafafanua kwa Kiswahili cheo kilichotajwa katika Kiebrania, na “wa kwanza” huwarejelea wale wawili waliotangulia.
- source_word: וְאֶת חֲמִשֵּׁיהֶם
  choice: pamoja na vikosi vyao
  rationale: Kiebrania ni kwa maana halisi “hamsini zao,” yaani vikosi vya watu hamsini walivyoviongoza. “Vikosi vyao” ni Kiswahili cha asili na hakiongezi dai lisilo katika muktadha.
- source_word: וְעַתָּה
  choice: Lakini sasa
  rationale: Inaonyesha mgeuko wenye utofauti kutoka hukumu iliyowapata waliotangulia kwenda kwenye ombi la msemaji.
- source_word: תִּיקַר נַפְשִׁי בְּעֵינֶיךָ
  choice: naomba uione maisha yangu kuwa ya thamani mbele yako
  rationale: Hapa נֶפֶשׁ ni uhai wa msemaji unaokabili hatari. Muundo wa ombi unaonyesha maana ya kitenzi cha hali ya amri/ombi, huku “ya thamani mbele yako” ikihifadhi taswira ya Kiebrania kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika ombi la kuokolewa na kifo
  choice: maisha yangu
  alternative: nafsi yangu
  rationale: Katika simulizi hili msemaji anaomba asiuawe kama vikosi vilivyotangulia. “Maisha yangu” huonyesha maana halisi ya uhai ulio hatarini bila kuingiza wazo la nafsi iliyotenganishwa na mwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Istilahi za kijeshi zimewekwa wazi bila kuwa nzito; ombi la mwisho limeandikwa kwa lugha ya kawaida huku taswira ya kuthamini maisha ikihifadhiwa.
