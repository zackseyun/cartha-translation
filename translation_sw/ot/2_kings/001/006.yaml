source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אִ֣ישׁ עָלָ֣ה לִ/קְרָאתֵ֗/נוּ וַ/יֹּ֣אמֶר אֵלֵי/נוּ֮ לְכ֣וּ שׁוּבוּ֮ אֶל הַ/מֶּ֣לֶךְ אֲשֶׁר שָׁלַ֣ח אֶתְ/כֶם֒ וְ/דִבַּרְתֶּ֣ם אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתָּ֣ה שֹׁלֵ֔חַ לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֣י עֶקְר֑וֹן לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/006.yaml
  text: 'And they said to him[a], “A man came up to meet us and said to us, ‘Go, return to the king who sent you, and speak to him: Thus says Yahweh, “Is it because there is no God in Israel that you are sending to inquire of Baal-zebub, the god of Ekron? Therefore the bed to which you have gone up—you will not come down from it[b], for you will surely die.”’”'
translation:
  language: sw
  text: 'Nao wakamwambia, “Mtu mmoja alikuja kutukutana, akatuambia, ‘Nendeni, mrudi kwa mfalme aliyewatuma, mkamwambie: Yahweh asema hivi: Je, ni kwa sababu hakuna Mungu katika Israeli[a] kwamba unatuma watu kumwuliza Baal-Zebubu, mungu wa Ekroni? Kwa hiyo hutashuka kutoka katika kitanda ulichokipanda, kwa maana hakika utakufa.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, ni kwa kukosekana kwa Mungu katika Israeli...?”
    reason: Nahau ya Kiebrania inaweza kutolewa ama kama sababu—“kwa sababu hakuna”—ama kama ukosefu—“kwa kukosekana kwa.”
lexical_decisions:
- source_word: אִישׁ
  choice: mtu mmoja
  rationale: Huhifadhi mtazamo wa wajumbe, ambao bado hawamtaji Eliya kwa jina, na hudokeza umoja bila kutumia lugha isiyo ya kawaida.
- source_word: עָלָה לִקְרָאתֵנוּ
  choice: alikuja juu kut întâ întâ întâ meet? us
  rationale: עָלָה ina wazo la kupanda au kuja juu, huku לִקְרָאתֵנוּ ikimaanisha kuja kukutana nasi; tafsiri hii inalenga kuhifadhi mwendo ulioelekezwa kwa wasemaji.
- source_word: לְכוּ שׁוּבוּ
  choice: Nendeni, mrudi
  rationale: Amri zote mbili zimehifadhiwa badala ya kuunganishwa kuwa amri moja ya kurudi tu.
- source_word: וְדִבַּרְתֶּם אֵלָיו
  choice: mkamwambie
  rationale: Katika Kiswahili cha kawaida, ‘mkamwambie’ huunganisha kwa uwazi tendo la kwenda na kuwasilisha ujumbe unaofuata, ingawa kitenzi cha Kiebrania kwa msingi ni ‘semeni naye’.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Huhifadhi fomula ya kinabii na kulitaja jina la agano יהוה kwa kulitamka kama Yahweh.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Je, ni kwa sababu hakuna Mungu katika Israeli
  rationale: Huhifadhi swali la kejeli na karipio lake bila kuligeuza kuwa kauli ya moja kwa moja.
- source_word: שֹׁלֵחַ לִדְרֹשׁ
  choice: unatuma watu waende kumwuliza
  rationale: דרש hapa ni kutafuta jibu au shauri la kiungu. ‘Kumwuliza’ ni ya kawaida na inaeleweka, na ‘watu’ huweka wazi yambwa inayodokezwa na kitenzi cha kutuma.
- source_word: בַּעַל זְבוּב
  choice: Baal-Zebubu
  rationale: Jina la mungu limetoholewa badala ya kutafsiriwa.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: mungu wa Ekroni
  rationale: Hutambulisha kwa kawaida uhusiano wa Baal-Zebubu na mji wa Ekroni.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם
  choice: kitanda ulichokipandia
  rationale: Huhifadhi wazo la kupanda kitandani kwa Kiswahili cha asili, bila kurudia kihalisi kiwakilishi cha mahali cha Kiebrania.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  choice: hutashuka kutoka katika kitanda
  rationale: Huhifadhi taswira ya kupanda na kushuka ambayo ni muhimu kwa tangazo la kwamba mgonjwa hataondoka kitandani akiwa hai.
- source_word: מוֹת תָּמוּת
  choice: hakika utakufa
  rationale: Muundo wa msisitizo wa Kiebrania umetolewa kwa ‘hakika,’ badala ya kurudia kitenzi kwa namna isiyo ya kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, יהוה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya swali kuhusu Mungu katika Israeli
  choice: 'Swali la kejeli: ‘Je, ni kwa sababu hakuna Mungu katika Israeli...?’'
  alternative: Kauli ya moja kwa moja kwamba mfalme ametenda kana kwamba hakuna Mungu Israeli
  rationale: Muundo wa chanzo ni swali lenye karipio; tafsiri hailifafanui kupita kiasi wala kuondoa mvutano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi wa kinabii umehifadhiwa kwa mpangilio wa moja kwa moja, huku miundo ya Kisemiti iliyo mizito ikifanywa kuwa ya kawaida katika Kiswahili.
