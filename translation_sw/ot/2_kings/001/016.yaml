source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֵלָ֜י/ו כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֜עַן אֲשֶׁר שָׁלַ֣חְתָּ מַלְאָכִים֮ לִ/דְרֹשׁ֮ בְּ/בַ֣עַל זְבוּב֮ אֱלֹהֵ֣י עֶקְרוֹן֒ הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל לִ/דְרֹ֖שׁ בִּ/דְבָר֑/וֹ לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/016.yaml
  text: 'And he spoke to him[a], “Thus says Yahweh: Because you have sent messengers to inquire of Baal-zebub, the god of Ekron—is it because there is no God in Israel to inquire of his word? Therefore the bed on which you have gone up[c][b], you will not come down from it, for you shall surely die.”'
translation:
  language: sw
  text: 'Naye akamwambia, “Yahweh asema hivi: ‘Kwa sababu umetuma wajumbe wamwulize Baal-zebubu, mungu wa Ekroni[a]—je, ni kwa sababu hakuna Mungu katika Israeli ili uulize neno lake?[b] Kwa hiyo, kitanda ulichopanda juu yake[c], hutashuka kutoka humo, kwa maana hakika utakufa.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili limeandikwa Baal-zebubu katika maandishi ya Kiebrania; umbo linalohusiana, Baal-zebuli, linapatikana katika mapokeo ya baadaye.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “uulize neno lake,” yaelekea ikiwa na maana ya kutafuta ujumbe au jibu la kimungu kutoka kwake.'
    reason: lexical_alternative
  - marker: c
    text: Au, “kitanda ulichopanda huko.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָיו
  choice: Naye akamwambia
  rationale: Ingawa דִּבֵּר kimsingi ni ‘alisema/alinena’, katika Kiswahili ‘akamwambia’ huunganisha kwa kawaida simulizi na maneno yanayofuata huku ikihifadhi mhusika anayeelekezewa maneno.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Hii ni kauli rasmi ya kinabii; ‘asema hivi’ ni ya sasa, ya kawaida na yenye hadhi katika Kiswahili. Jina la agano יְהוָה limetolewa kama ‘Yahweh’.
- source_word: שָׁלַחְתָּ מַלְאָכִים
  choice: umetuma wajumbe
  rationale: מַלְאָכִים hapa ni wajumbe wa kibinadamu, si malaika; wakati timilifu ‘umetuma’ unalingana na tendo lililokamilika lenye matokeo ya sasa.
- source_word: לִדְרֹשׁ בְּבַעַל זְבוּב
  choice: wamwulize Baal-zebubu
  rationale: Katika muktadha huu דרש ni kumwendea mungu ili kupata ujumbe au jibu. ‘Kumwuliza’ ni Kiswahili cha kawaida na hakilazimishi tafsiri maalumu ya kiibada.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: mungu wa Ekroni
  rationale: Muundo wa umilikaji unatambulisha Baal-zebubu kuwa mungu aliyeabudiwa Ekroni.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: je, ni kwa sababu hakuna Mungu katika Israeli
  rationale: Muundo umehifadhiwa kama swali la kukemea. Herufi kubwa katika ‘Mungu’ inaonyesha kuwa rejeo ni kwa Mungu wa Israeli.
- source_word: לִדְרֹשׁ בִּדְבָרוֹ
  choice: ili uulize neno lake
  rationale: Tafsiri hii inadumisha kutajwa wazi kwa דָּבָר, ‘neno/ujumbe’, badala ya kuliondoa kwa kusema tu ‘umwulize yeye’. Tanbihi inaeleza maana inayowezekana ya kutafuta ujumbe wa kimungu.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם לֹא תֵרֵד מִמֶּנָּה
  choice: kitanda ulichopanda, hutashuka kutoka humo
  rationale: Mpangilio uliotanguliza ‘kitanda’ na taswira ya kupanda/kushuka vimehifadhiwa. שָׁם ni rejeo la kurudia ndani ya kishazi; halihitaji kutafsiriwa wazi katika Kiswahili isipokuwa kama mbadala wa karibu zaidi.
- source_word: כִּי מוֹת תָּמוּת
  choice: kwa maana hakika utakufa
  rationale: Muundo wa Kiebrania unaosisitiza kifo umetolewa kwa kielezi ‘hakika’.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לִדְרֹשׁ בִּדְבָרוֹ
  choice: uulize neno lake
  alternative: utafute shauri lake / umwulize yeye
  rationale: Chaguo kuu linahifadhi nomino ‘neno’ iliyopo katika Kiebrania na hivyo halifuti uwezekano wa maana ya ujumbe au unabii wa kimungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaosomeka kwa urahisi. Kauli ya kinabii na mpangilio uliotanguliza ‘kitanda’ vimehifadhiwa, huku maelezo yanayoweza kufanya sentensi kuu kuwa nzito yakiwekwa katika tanbihi.
