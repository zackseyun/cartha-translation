base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/009.yaml
  text: Then he sent to him a captain of fifty with his fifty men[a]. He went up to him, and behold, he was sitting on the top of the hill. He spoke to him, “Man of God, the king says[b], ‘Come down.’”
translation:
  language: sw
  text: Ndipo akamtumia mkuu wa askari hamsini pamoja na askari wake hamsini. Mkuu huyo akapanda kumwendea, na tazama, alikuwa ameketi juu ya kilele cha mlima[a]. Akamwambia, “Mtu wa Mungu, mfalme asema[b], ‘Shuka.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kilele cha kilima.” Neno la Kiebrania הַר laweza kumaanisha mlima au kilima kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: 'Kihalisi, “mfalme amesema: ‘Shuka.’” Hii ni fomula ya Kiebrania ya kuwasilisha ujumbe; hapa imetafsiriwa kwa njia ya kawaida kuwa “mfalme asema.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ndipo akamtumia
  rationale: Wayyiqtol inaendeleza mfululizo wa simulizi; “Ndipo” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: שַׂר חֲמִשִּׁים
  choice: mkuu wa askari hamsini
  rationale: Kirai hiki humaanisha afisa wa kijeshi anayesimamia kikosi cha watu hamsini; “mkuu wa askari hamsini” ni wazi na cha kawaida.
- source_word: וַחֲמִשָּׁיו
  choice: pamoja na askari wake hamsini
  rationale: Kiambishi cha umilikaji hurejelea kikosi kilicho chini ya mkuu huyo; “askari” imewekwa wazi kutokana na muktadha wa kijeshi.
- source_word: וַיַּעַל אֵלָיו
  choice: Mkuu huyo akamwendea juu
  rationale: עלה huonyesha kusogea kwenda mahali palipoinuka alipokuwa Eliya. Kurudia “Mkuu huyo” huondoa utata wa kiwakilishi katika Kiswahili.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi nguvu ya kuonyesha tukio kwa uhai na kuvuta fikira za msomaji.
- source_word: יֹשֵׁב
  choice: alikuwa ameketi
  rationale: Kitenzi-shirikishi kinaonyesha hali ya Eliya wakati mkuu alipomfikia.
- source_word: עַל רֹאשׁ הָהָר
  choice: juu ya kilele cha mlima
  rationale: רֹאשׁ ni kilele au sehemu ya juu, na הַר yaweza kumaanisha mlima au kilima. “Mlima” ni chaguo rasmi linalohifadhi maana pana, huku mbadala ukitajwa katika tanbihi.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: Akamwambia
  rationale: Ingawa דבר kimsingi ni “kusema/kuzungumza,” katika utangulizi wa usemi wa moja kwa moja “akamwambia” ni Kiswahili cha asili na hudumisha mlengwa wa usemi.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mtu wa Mungu
  rationale: Ni cheo kinachotambuliwa cha nabii na kimetafsiriwa moja kwa moja bila kuongeza ufafanuzi wa kidhehebu.
- source_word: הַמֶּלֶךְ דִּבֶּר
  choice: mfalme asema
  rationale: Kiebrania kihalisi ni “mfalme amesema/amenena,” lakini hapa ni fomula ya mjumbe inayotanguliza ujumbe wa mfalme; wakati wa sasa ni wa kawaida katika Kiswahili.
- source_word: רֵדָה
  choice: Shuka
  rationale: Amri ya ירד inamtaka Eliya ashuke kutoka mahali palipoinuka; Kiswahili hakihitaji kutofautisha “come down” na “go down” kwa kuongeza kielezi hapa.
