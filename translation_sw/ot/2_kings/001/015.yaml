  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְדַבֵּ֞ר מַלְאַ֤ךְ יְהוָה֙ אֶל אֵ֣לִיָּ֔הוּ רֵ֣ד אוֹת֔/וֹ אַל תִּירָ֖א מִ/פָּנָ֑י/ו וַ/יָּ֛קָם וַ/יֵּ֥רֶד אוֹת֖/וֹ אֶל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/015.yaml
  text: Then the angel of Yahweh spoke to Elijah[a], “Go down with him; do not be afraid of him.” So he arose and went down with him to the king.
translation:
  language: sw
  text: Kisha malaika wa Yahweh akamwambia Eliya, “Shuka pamoja naye; usimwogope[a].” Basi Eliya akainuka, akashuka pamoja naye kwenda kwa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya karibu zaidi ya maneno yenyewe, “usiogope kutoka mbele yake,” yaani, “usiogope kwa sababu ya kuwapo kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: Ingawa מַלְאַךְ inaweza kumaanisha ‘mjumbe’ au ‘malaika,’ katika simulizi hili la amri inayotoka kwa Mungu, ‘malaika’ ndiyo tafsiri ya kawaida na inayofaa zaidi.
- source_word: רֵד אוֹתוֹ
  choice: Shuka pamoja naye
  rationale: Kitenzi ירד kinamaanisha kushuka, na אוֹתוֹ hapa huonyesha kuandamana na huyo mtu; ‘pamoja naye’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: אַל תִּירָא מִפָּנָיו
  choice: usimwogope[a]
  rationale: Usemi wa Kiebrania una maana halisi ya kuogopa ‘kutoka mbele yake/uso wake,’ lakini katika muktadha huu ni nahau yenye maana ya kutomwogopa huyo mtu. Tanbihi inahifadhi picha halisi ya maneno ya chanzo.
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Hili linahifadhi tendo la kuitikia amri na mtiririko wa kawaida wa simulizi la Kiebrania.
- source_word: וַיֵּרֶד אוֹתוֹ אֶל הַמֶּלֶךְ
  choice: akashuka pamoja naye kwenda kwa mfalme
  rationale: Tafsiri hii inadumisha mwendo wa kushuka, kuandamana na yule mtu, na mahali walipokwenda.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, יְהוָה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa urahisi. ‘Akamwambia’ ni ya asili zaidi kuliko ‘akanena na,’ huku ‘Basi’ ikionyesha mwitikio unaofuata bila kuongezea maana.
