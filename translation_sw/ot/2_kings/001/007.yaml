  text: Then he said to them[a], “What was the appearance of the man who came up to meet you and spoke these words to you?”
translation:
  language: sw
  text: Kisha akawauliza, “Mtu aliyekuja kukutana nanyi na kuwaambia maneno haya alikuwa wa namna gani?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwonekano wa mtu huyo ulikuwa gani?” Kihalisi, “Mishpati ya mtu huyo ilikuwa nini?” Neno la Kiebrania mishpati hapa linaweza kumaanisha namna, maelezo, au mwonekano unaomwezesha mtu kutambulika.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה מִשְׁפַּט הָאִישׁ
  choice: alikuwa na sura gani?
  rationale: Kirai hiki kinauliza sifa za kumtambua mtu. Katika muktadha, jibu la mstari wa 8 linaeleza mwonekano na mavazi yake; ‘alikuwa na sura gani?’ ni Kiswahili cha kawaida kinachodumisha maana hiyo bila kutumia maana ya kawaida ya מִשְׁפַּט, ‘hukumu.’
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: Kiwakilishi cha kuonyesha ‘yule’ kinarejelea kwa kawaida mtu maalumu ambaye wajumbe walikuwa wamekutana naye.
- source_word: עָלָה לִקְרַאתְכֶם
  choice: aliyekuja kuwalaki
  rationale: ‘Kuwalaki’ ni usemi wa kawaida wa Kiswahili kwa kumwendea mtu anayekuja ili kukutana naye. Kitenzi עָלָה kina dhana halisi ya kwenda au kupanda, lakini hapa ‘kuja’ huwasilisha mwelekeo wa tukio kwa kawaida.
- source_word: וַיְדַבֵּר אֲלֵיכֶם אֶת הַדְּבָרִים הָאֵלֶּה
  choice: na kuwaambia maneno hayo
  rationale: Huwasilisha kwa Kiswahili cha kawaida tendo la kusema na kubakiza ‘maneno hayo’ kama rejeo la ujumbe uliotangulia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kuwalaki’ ni neno la kawaida na linaloeleweka katika eneo hili; sentensi imepangwa upya kidogo ili swali lisikike kwa ufasaha wa asili.
