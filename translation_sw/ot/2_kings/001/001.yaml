- source_word: אַחֲרֵי מוֹת
  choice: Baada ya ... kufa
  rationale: Hii ni tafsiri ya asili na wazi ya kirai cha wakati katika Kiswahili cha sasa.
- source_word: אַחְאָב
  choice: Ahabu
  rationale: Hili ni umbo la kawaida la jina hili katika mapokeo ya Biblia za Kiswahili.
