  text: Wajumbe wakarudi kwake, naye akawaambia, “Kwa nini mmerudi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: wakarudi
  rationale: Kitenzi שוב katika mfululizo wa simulizi kinaonyesha kurudi kwa yule aliyewatuma; “wakarudi” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: הַמַּלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu ni watu waliotumwa na mfalme, si viumbe wa mbinguni; “wajumbe” linafaa kwa mawakala wa kibinadamu.
- source_word: אֵלָיו
  choice: kwake
  rationale: Kihusishi kinaonyesha mwelekeo wa kurudi kwa mfalme; “kwake” kinatoa maana hiyo kwa ufupi.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: naye akawaambia
  rationale: Tafsiri hii inadumisha kitenzi cha kawaida אמר, “sema,” badala ya kukibadili kuwa “akauliza,” huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: מַה זֶּה
  choice: Kwa nini
  rationale: Ingawa kwa neno moja moja ni “Hii ni nini...?”, hapa ni nahau inayouliza sababu; “Kwa nini” huwasilisha kazi yake wazi na kwa lugha ya kawaida.
- source_word: שַׁבְתֶּם
  choice: mmerudi
  rationale: Ni nafsi ya pili wingi wa שוב na inauliza kuhusu tendo la kurudi ambalo matokeo yake yanaonekana wakati huo; “mmerudi” ni ya asili katika mazungumzo ya Kiswahili.
