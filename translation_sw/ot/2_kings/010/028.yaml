lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: akamwangamiza
  rationale: Hiphil ya שׁמד ina maana ya kusababisha kuangamizwa au kuondolewa kabisa. ‘Akamwangamiza’ ni ya asili katika Kiswahili na inadumisha nguvu ya kitenzi bila kuongeza maelezo yasiyomo katika mstari.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: הַבַּעַל
  choice: Baali
  rationale: Ingawa Kiebrania kina kibainishi (‘yule Baali’), Kiswahili kwa kawaida hutumia jina la mungu huyu bila kukitafsiri. Kumtaja ‘Baali’ kunahifadhi utata wa asili kati ya mungu huyo na ibada yake bila kuingiza ufafanuzi katika matini.
- source_word: מִיִּשְׂרָאֵל
  choice: kutoka Israeli
  rationale: Kihusishi מִן huonyesha kutenganishwa au kuondolewa. ‘Kutoka Israeli’ kinawakilisha moja kwa moja muundo wa chanzo, ingawa maana ya kimuktadha ni kuondolewa katika Israeli.
- source_word: וַ
  choice: Hivyo
  rationale: Waw inayotangulia kitenzi inaendeleza simulizi na hapa pia inafaa kuonyesha matokeo ya matendo yaliyotangulia.
theological_decisions:
- issue: Kirejelewa cha ‘Baali’
  choice: Baali ametajwa kama jina la mungu aliyeondolewa kutoka Israeli, bila kupanua kuwa ‘ibada ya Baali.’
  alternative: ibada ya Baali
  rationale: Kiebrania kinasema tu ‘הַבַּעַל’ (‘Baali’). Matini kuu inadumisha usemi huo, huku muktadha ukionyesha kwamba kuangamizwa kwake kulihusisha kukomeshwa kwa ibada yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Viambishi vya ngeli ya mtu kwa Baali vinafuata matumizi ya kawaida ya Kiswahili kwa kiumbe anayetendewa, bila kuthibitisha uhalisi wake wa kitheolojia.
