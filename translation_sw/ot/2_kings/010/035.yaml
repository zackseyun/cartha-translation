base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/035.yaml
  text: And Jehu lay down with his fathers, and they buried him in Samaria. And Jehoahaz his son became king in his place.
translation:
  language: sw
  text: Yehu akalala pamoja na mababu zake, wakamzika katika Samaria. Naye Yehoahazi mwanawe akawa mfalme badala yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Kitenzi שׁכב kwa msingi humaanisha kulala au kujilaza, na katika taarifa za kifalme ni nahau ya kufa. “Akalala” huhifadhi picha ya Kiebrania kwa lugha ya kawaida ya Biblia bila kuibadili moja kwa moja kuwa “akafa.”
- source_word: עִם אֲבֹתָיו
  choice: pamoja na mababu zake
  rationale: Hii ni sehemu ya fomula ya kawaida ya taarifa za vifo vya wafalme. “Mababu zake” huwasilisha maana ya wazazi wa kale au wahenga kwa Kiswahili cha sasa, kuliko “baba zake,” ambacho kingeweza kueleweka kuwa baba wa moja kwa moja kwa wingi.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: wakamzika
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu wingi chenye mtendaji asiyetajwa. Kiswahili kinaweza kuhifadhi muundo huo kwa “wakamzika” bila kubuni waliomzika.
- source_word: בְּשֹׁמְרוֹן
  choice: huko Samaria
  rationale: Kiambishi ב ni cha mahali. “Huko Samaria” ni usemi wa kawaida unaoonyesha mahali alipozikwa.
- source_word: וַיִּמְלֹךְ
  choice: akawa mfalme
  rationale: Katika taarifa ya urithi wa kiti cha enzi, מלך hapa huonyesha kuingia katika ufalme. “Akawa mfalme” huonyesha wazi mabadiliko hayo badala ya kudokeza kipindi chote cha kutawala.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Kirai hiki kinaonyesha kuchukua nafasi ya mtangulizi katika cheo. “Mahali pake” ni cha asili katika Kiswahili na kinabaki karibu na picha ya Kiebrania.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: יְהוֹאָחָז
  choice: Yehoahazi
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
