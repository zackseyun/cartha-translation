  register: Lugha ni ya Kiswahili Sanifu cha Afrika Mashariki, yenye hadhi ya simulizi la kifalme lakini inayoeleweka kwa msomaji wa kawaida. Nahau ya kifo imehifadhiwa kwa “akalala pamoja na mababu zake”; hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika.
