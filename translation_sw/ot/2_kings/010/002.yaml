base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/002.yaml
  text: Now when this letter comes to you[a], since your master's sons are with you, and the chariots and the horses, a fortified city also being with you, and the weapons[c][b],
translation:
  language: sw
  text: Na sasa, barua hii itakapowafikia[a], kwa kuwa wana wa bwana wenu[b] wako pamoja nanyi, nanyi mna magari ya vita, farasi, mji wenye ngome[c], na silaha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hati hii itakapowafikia.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, wana wa mfalme ambaye waandikiwa walimtumikia.
    reason: cultural_note
  - marker: c
    text: Au, “mji ulioimarishwa.” Maana yake ni mji ambao waandikiwa wangeweza kuutumia kujilinda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Ni kiashiria cha mazungumzo kinachoanzisha hatua inayofuata katika ujumbe wa Yehu; “Basi sasa” huhifadhi kiunganishi na mpito wa hoja kwa Kiswahili cha kawaida.
- source_word: כְּבֹא הַסֵּפֶר הַזֶּה אֲלֵיכֶם
  choice: barua hii itakapowafikia
  rationale: Muundo wa wakati wa בוא umetafsiriwa kwa “itakapowafikia.” Katika muktadha wa mawasiliano ya kifalme, סֵפֶר ni barua au ujumbe ulioandikwa, si kitabu.
- source_word: בְּנֵי אֲדֹנֵיכֶם
  choice: wana wa bwana wenu
  rationale: אדון hapa humaanisha mtawala ambaye waandikiwa walimtumikia, wala si jina la Mungu. “Bwana wenu” hudumisha uhusiano wa mamlaka bila kuongeza ufafanuzi ndani ya mstari.
- source_word: הָרֶכֶב
  choice: magari ya vita
  rationale: Nomino hii ina maana ya kijumla ya magari ya kijeshi; “magari ya vita” ni wazi na ya kawaida katika Kiswahili.
- source_word: וְהַסּוּסִים
  choice: farasi
  rationale: Tafsiri ya moja kwa moja na ya kawaida; muktadha tayari unaonyesha kuwa ni rasilimali za kijeshi.
- source_word: וְעִיר מִבְצָר
  choice: mji wenye ngome
  rationale: Kirai hiki humaanisha mji ulioimarishwa kwa ulinzi. “Mji wenye ngome” ni cha kawaida na kinaeleweka kwa wasomaji wa sasa.
- source_word: וְהַנָּשֶׁק
  choice: silaha
  rationale: נשק hapa humaanisha zana za kivita kwa ujumla; “silaha” ni pana na haibanwi kuwa mavazi ya kujikinga pekee.
- source_word: וְאִתְּכֶם ... וְאִתְּכֶם
  choice: wako pamoja nanyi, nanyi mna
  rationale: Kiebrania kinarudia wazo la vitu kuwa “pamoja nanyi.” Kiswahili cha asili hutumia “wako pamoja nanyi” kwa watu na “mna” kwa rasilimali, huku maana ya upatikanaji wao kwa waandikiwa ikihifadhiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mstari umeachwa na koma mwishoni kwa sababu sentensi ya ujumbe inaendelea katika mstari unaofuata. Orodha ya rasilimali za kijeshi imetolewa kwa mtiririko wa kawaida wa Kiswahili bila kufuta msisitizo kwamba vitu hivyo vilikuwa mikononi mwa waandikiwa.
