  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: דְּע֣וּ אֵפ֗וֹא כִּי֩ לֹ֨א יִפֹּ֜ל מִ/דְּבַ֤ר יְהוָה֙ אַ֔רְצָ/ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עַל בֵּ֣ית אַחְאָ֑ב וַ/יהוָ֣ה עָשָׂ֔ה אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עַבְדּ֥/וֹ אֵלִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/010.yaml
  text: Know[a], then, that not a word of Yahweh that he spoke against the house of Ahab will fall to the ground[b], and Yahweh has done what he spoke by the hand of his servant Elijah.
translation:
  language: sw
  text: Basi, jueni kwamba hakuna hata neno lolote ambalo Yahweh alinena dhidi ya nyumba ya Ahabu litakaloanguka chini[a]. Naye Yahweh ametenda yale aliyoyanena kwa mkono wa mtumishi wake Eliya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kuanguka chini” ni nahau yenye maana ya kushindwa au kutotimia.
    reason: lexical_alternative
  - marker: b
    text: Au, “kupitia mtumishi wake Eliya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ אֵפוֹא
  choice: Basi, jueni
  rationale: Kitenzi ni amri ya wingi, na אֵפוֹא huleta hitimisho au matokeo ya hoja. “Basi, jueni” ni kauli ya moja kwa moja na ya kawaida katika Kiswahili sanifu.
- source_word: לֹא יִפֹּל ... אַרְצָה
  choice: hakuna hata neno moja ... litakaloanguka chini
  rationale: 'Tafsiri inadumisha taswira halisi ya Kiebrania ya neno ‘kuanguka chini,’ huku “hata neno moja” ikionyesha maana ya מן ya kugawa: hakuna sehemu yoyote ya ujumbe itakayokosa kutimia.'
- source_word: מִדְּבַר יְהוָה
  choice: hata neno moja la Yahwe
  rationale: Hii huwasilisha kwa Kiswahili maana kwamba hakuna lolote katika neno la Yahwe litakaloshindwa kutimia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi kwa tahajia inayopatana na mfumo wa sauti na maandishi wa Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: עַל בֵּית אַחְאָב
  choice: dhidi ya nyumba ya Ahabu
  rationale: Katika muktadha wa hukumu, עַל ina maana ya uadui, yaani ‘dhidi ya.’ “Nyumba” inadumisha nahau ya kibiblia inayoweza kumaanisha ukoo au nasaba ya kifalme.
- source_word: וַיהוָה עָשָׂה
  choice: Naye Yahwe ametenda
  rationale: Wakati timilifu unaonyesha tendo lililokamilishwa; “ametenda” huonyesha utimilifu huo katika hali ya sasa ya hotuba.
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: yale aliyoyanena
  rationale: Kauli hii ni ya asili katika Kiswahili na inadumisha uhusiano wa kitenzi ‘kunena’ na tangazo la kinabii lililotajwa awali.
- source_word: בְּיַד עַבְדּוֹ אֵלִיָּהוּ
  choice: kwa mkono wa mtumishi wake Eliya
  rationale: Tafsiri inadumisha nahau ya Kiebrania ya uwakala wa kinabii. Maana yake ni kwamba Yahwe alinena kupitia Eliya.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; kulihifadhi huepuka kulibadilisha kimya kimya kuwa cheo.
- issue: Nahau ya uhakika wa kutimia kwa unabii
  choice: litakaloanguka chini
  alternative: litakaloshindwa kutimia
  rationale: Taswira ya Kiebrania imehifadhiwa katika maandishi, huku tanbihi ikieleza maana yake bila kuondoa mvutano kati ya picha halisi na maana ya kiidioma.
- issue: Uwakala wa Eliya katika ujumbe wa kinabii
  choice: kwa mkono wa mtumishi wake Eliya
  alternative: kupitia mtumishi wake Eliya
  rationale: Nahau ya chanzo imehifadhiwa, bila kudokeza kwamba Eliya ndiye aliyekuwa chanzo cha neno badala ya kuwa mjumbe wa Yahwe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na ulio wazi. “Ahabu” na “Eliya” ni maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika, zikisahihisha kutolingana kwa nafasi za alama katika safu ya ushauri ya Kiingereza.
