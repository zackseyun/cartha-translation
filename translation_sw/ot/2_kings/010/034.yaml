  text: The rest of the acts of Jehu[a], and all that he did[b], and all his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: sw
  text: Matendo mengine ya Yehu, na yote aliyofanya, na nguvu zake zote[a]—je, hayakuandikwa katika Kitabu cha Kumbukumbu za Wafalme wa Israeli?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matendo yake yote makuu,” badala ya “nguvu zake zote.”
    reason: lexical_alternative
  - marker: b
    text: Hii ni rejeo la kumbukumbu rasmi za kifalme; si lazima iwe Kitabu cha Mambo ya Nyakati kilichomo katika Biblia.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֵהוּא
  choice: Matendo mengine ya Yehu
  rationale: Katika muhtasari huu wa kawaida wa tawala za wafalme, דִּבְרֵי humaanisha mambo au matendo yaliyorekodiwa, si maneno tu; “matendo mengine” ni Kiswahili cha kawaida na wazi.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: na yote aliyofanya
  rationale: Huhifadhi maana ya ujumla ya כָל na muundo wa kishazi husishi bila kuondoa marudio yaliyomo katika Kiebrania.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: na ushujaa wake wote
  rationale: גְּבוּרָה inaweza kumaanisha nguvu, ushujaa, au matendo makuu yanayoonyesha uwezo. “Ushujaa wake wote” huhifadhi ufupi na kiasi cha utata wa neno la chanzo.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: je, hayajaandikwa
  rationale: Huhifadhi swali la balagha linalotarajia jibu la ndiyo. Upatanisho wa ngeli unarejelea matendo na mambo yaliyotajwa.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: katika Kitabu cha Kumbukumbu
  rationale: Ingawa עַל kimsingi ni “juu ya,” katika fomula hii ya nyaraka Kiswahili cha kawaida ni “yameandikwa katika.” “Kumbukumbu” huwasilisha vizuri maana ya kumbukumbu rasmi za matukio ya kifalme.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: za Wafalme wa Israeli
  rationale: 'לְ hapa huonyesha uhusiano: kumbukumbu zinazowahusu wafalme wa Israeli.'
