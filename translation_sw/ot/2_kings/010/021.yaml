base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/021.yaml
  text: So Jehu sent throughout all Israel[a], and all the worshipers of Baal came; not a man was left who did not come. They entered the house of Baal, and the house of Baal was filled from end to end.
translation:
  language: sw
  text: Kisha Yehu akatuma ujumbe kotekote Israeli, na waabudu wote wa Baali wakaja; hakubaki hata mtu mmoja ambaye hakuja. Wakaingia katika nyumba ya Baali, nayo nyumba hiyo ikajaa kutoka upande mmoja hadi mwingine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kinywa kwa kinywa,” nahau inayomaanisha kuwa nyumba ilijaa kabisa, kutoka upande mmoja hadi mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח יֵהוּא בְּכָל יִשְׂרָאֵל
  choice: Yehu akatuma ujumbe kotekote Israeli
  rationale: Kitenzi שׁלח ni ‘kutuma’; pamoja na בְּכָל יִשְׂרָאֵל kinaonyesha kwamba wito au ujumbe ulitumwa katika eneo lote. ‘Kotékote Israeli’ ni Kiswahili cha kawaida kinachohifadhi wigo huo mpana, na ‘ujumbe’ huweka wazi kitu kilichotumwa bila kudai kwamba Yehu mwenyewe alienda.
- source_word: עֹבְדֵי הַבַּעַל
  choice: waabudu wote wa Baali
  rationale: Katika muktadha wa ibada, participio ya עבד inamaanisha wale wanaomtumikia Baali kwa kumwabudu; ‘waabudu’ huepuka wazo la watumishi wa nyumbani.
- source_word: וְלֹא נִשְׁאַר אִישׁ אֲשֶׁר לֹא בָא
  choice: hakubaki hata mtu mmoja ambaye hakuja
  rationale: Kauli hii ya Kiswahili huhifadhi msisitizo wa mahudhurio kamili. ‘Mtu mmoja’ huwakilisha אִישׁ kwa kawaida bila kulazimisha jinsia ambayo Kiswahili haiainishi katika nomino ‘mtu’.
- source_word: וַיָּבֹאוּ בֵּית הַבַּעַל
  choice: Wakaingia katika nyumba ya Baali
  rationale: Kitenzi בוא kinapotumiwa kuhusu jengo humaanisha kuingia. ‘Nyumba ya Baali’ huhifadhi neno la Kiebrania בֵּית badala ya kulifafanua moja kwa moja kuwa ‘hekalu’.
- source_word: וַיִּמָּלֵא בֵית הַבַּעַל
  choice: nayo nyumba hiyo ikajaa
  rationale: Nifali ya מלא inaonyesha kuwa nyumba ilijaa. Kiwakilishi ‘hiyo’ huepuka urudiaji mzito huku kikirejelea wazi nyumba ya Baali.
- source_word: פֶּה לָפֶה
  choice: kutoka upande mmoja hadi mwingine
  rationale: Nahau hii, ambayo kwa neno moja moja ni ‘kinywa kwa kinywa,’ inaonyesha kwamba jengo lilijaa katika nafasi yake yote. Tafsiri hii ni ya kawaida na inaeleweka katika Kiswahili.
theological_decisions:
- issue: Lugha wakilishi yenye jinsia katika אִישׁ
  choice: hakubaki hata mtu mmoja ambaye hakuja
  alternative: hakubaki hata mwanamume mmoja ambaye hakuja
  rationale: אִישׁ hapa iko katika usemi wa jumla unaosisitiza kwamba hakuna hata mmoja aliyekosa kuja. Kiswahili ‘mtu mmoja’ huhifadhi maana hiyo kwa usahihi na kwa kawaida; ‘mwanamume’ ingeongeza msisitizo wa jinsia usio lazima katika muktadha huu.
- issue: Utambulisho wa בֵית הַבַּעַל
  choice: nyumba ya Baali
  alternative: hekalu la Baali
  rationale: Ingawa jengo hilo ni mahali pa ibada, Kiebrania kinasema kihalisi ‘nyumba ya Baali.’ Chaguo hili huhifadhi taswira ya matini bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa simulizi umehifadhiwa kwa vitenzi vinavyofuatana, na istilahi rahisi kama ‘waabudu’ na ‘ikajaa’ zinasaidia usomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kirai inachokifafanua.
