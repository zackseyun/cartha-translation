base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/023.yaml
  text: Then Jehu and Jehonadab son of Rechab entered the house of Baal[a], and he said to the worshipers of Baal, “Search and see that there is no servant of the LORD here among you, but only worshipers of Baal.”
translation:
  language: sw
  text: Ndipo Yehu na Yehonadabu mwana wa Rekabu wakaingia katika nyumba ya Baali[a]. Yehu akawaambia waabudu wa Baali, “Tafuteni na mhakikishe kwamba hakuna mtumishi yeyote wa Yahwe hapa miongoni mwenu, bali waabudu wa Baali peke yao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hekalu la Baali.” Kiebrania kihalisi, “nyumba ya Baali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: wakaingia
  rationale: Kitenzi בוא pamoja na mahali wanakoelekea kinaonyesha kuingia ndani; “wakaingia” ni Kiswahili cha kawaida na sahihi.
- source_word: בֵּית הַבָּעַל
  choice: nyumba ya Baali
  rationale: Huhifadhi kwa karibu usemi halisi wa Kiebrania; katika muktadha ni mahali pa ibada, jambo linalofafanuliwa katika tanbihi.
- source_word: עֹבְדֵי הַבַּעַל
  choice: waabudu wa Baali
  rationale: Ingawa mzizi עבד unaweza kumaanisha watumishi, hapa muktadha wa ibada katika nyumba ya Baali unaonyesha waabudu wake.
- source_word: חַפְּשׂוּ וּרְאוּ
  choice: Tafuteni kwa makini mhakikishe
  rationale: Muungano wa amri hizi mbili unadai uchunguzi na uthibitisho; tafsiri hii ni ya asili katika Kiswahili bila kupunguza uzito wa amri.
- source_word: פֶּן יֶשׁ פֹּה עִמָּכֶם
  choice: kwamba hakuna ... hapa miongoni mwenu
  rationale: פֶּן inaonyesha tahadhari ili kuhakikisha kwamba mtu wa kundi jingine hayupo; muundo huu unaeleza kusudi hilo kwa Kiswahili sanifu.
- source_word: מֵעַבְדֵי יְהוָה
  choice: mtumishi yeyote wa BWANA
  rationale: Kiebrania ni usemi wa sehemu ya wingi, yaani yeyote miongoni mwa watumishi wa YHWH; “mtumishi yeyote” huwasilisha maana hiyo wazi.
- source_word: יְהוָה
  choice: BWANA
  rationale: Inafuata desturi ya Kiswahili ya kuwakilisha jina la Mungu YHWH kwa “BWANA” kwa herufi kubwa, huku likitofautishwa na cheo cha kawaida.
- source_word: כִּי אִם ... לְבַדָּם
  choice: bali ... peke yao
  rationale: Muundo huu unaonyesha utoaji wa kundi moja na kuwapo kwa kundi jingine pekee.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” kwa herufi kubwa ni desturi inayotambulika sana katika Biblia za Kiswahili na huhifadhi tofauti ya jina la agano bila kuingiza matamshi yenye mjadala.
- issue: Maana ya עֹבְדֵי katika muktadha wa Baali
  choice: waabudu wa Baali
  alternative: watumishi wa Baali
  rationale: Muktadha wa hekalu na ibada unaunga mkono maana ya kidini “waabudu,” lakini neno la Kiebrania pia linaweza kutafsiriwa “watumishi.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Jina “Yehonadabu” limehifadhi umbo kamili la Kiebrania, na “Baali” limetumika kama umbo la kawaida la Kiswahili. Kiima “Yehu” kimerudiwa katika sentensi ya pili ili kuondoa utata wa kiwakilishi cha umoja baada ya watu wawili kutajwa.
