translation:
  language: sw
  text: Kisha Yehu akawakusanya watu wote, akawaambia[a], “Ahabu alimtumikia Baali kidogo[b]; Yehu atamtumikia sana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kauli ya Yehu ina kejeli katika muktadha: anasema atamtumikia Baali “sana,” lakini simulizi linaonyesha kuwa huu ulikuwa mtego wa kuwakusanya waabudu wa Baali.'
    reason: cross_reference
  - marker: b
    text: Au “alimwabudu Baali” / “atamwabudu”; kitenzi cha Kiebrania kinachomaanisha “kutumikia” hutumiwa pia kwa huduma ya kidini au ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: akawakusanya
  rationale: Kitenzi קבץ kinaonyesha kuwaleta watu pamoja; “akawakusanya” ni Kiswahili cha kawaida na kinahifadhi tendo hilo.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Huhifadhi upana wa kirai cha Kiebrania bila kukibana kuwa kundi maalumu.
- source_word: עָבַד אֶת הַבַּעַל
  choice: alimtumikia Baali
  rationale: עבד ikitumiwa kuhusu mungu inaweza kumaanisha huduma ya kidini au ibada. “Alimtumikia” iko karibu na umbo la Kiebrania na bado inaeleweka katika muktadha wa kidini.
- source_word: מְעָט
  choice: kidogo
  rationale: Hueleza kiwango na kudumisha ulinganifu mfupi na הַרְבֵּה.
- source_word: יַעַבְדֶנּוּ
  choice: atamtumikia
  rationale: Kiambishi cha yambwa kinamrejelea Baali; umbo la wakati ujao linafaa kwa kauli ya moja kwa moja.
- source_word: הַרְבֵּה
  choice: sana
  rationale: Ni kielezi cha kiwango kinachokinzana kwa kawaida na “kidogo”; “sana” ni Kiswahili fasaha na cha kawaida kuliko tafsiri ya neno kwa neno kama “mengi” katika nafasi hii.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: אַחְאָב
  choice: Ahabu
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: הַבַּעַל
  choice: Baali
  rationale: Ingawa Kiebrania kina kibainishi, katika Kiswahili “Baali” hutumiwa kama jina maalumu bila kukihamisha kibainishi hicho kwa namna isiyo ya kawaida.
theological_decisions:
- issue: Kauli ya Yehu kuhusu kumtumikia Baali
  choice: Kauli imetafsiriwa moja kwa moja bila kuongeza ishara ya udanganyifu au kejeli katika matini kuu.
  alternative: Kuandika kwamba Yehu “alijifanya” au “alidai” atamtumikia Baali.
  rationale: Maneno ya Kiebrania yenyewe yanaripoti kauli yake moja kwa moja. Muktadha unaonyesha kuwa huu ulikuwa mtego, lakini tafsiri haipaswi kutatua kejeli hiyo kwa kuongeza maneno yasiyokuwamo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “kidogo … sana” unahifadhi ulinganifu na ukali wa kauli ya Kiebrania.
