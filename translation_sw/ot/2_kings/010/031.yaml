source:
  edition: WLC
  text: וְ/יֵה֗וּא לֹ֥א שָׁמַ֛ר לָ/לֶ֛כֶת בְּ/תֽוֹרַת יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בְּ/כָל לְבָב֑/וֹ לֹ֣א סָ֗ר מֵ/עַל֙ חַטֹּ֣אות יָֽרָבְעָ֔ם אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/031.yaml
  text: But Jehu was not careful to walk in the law of Yahweh[a], the God of Israel, with all his heart. He did not turn away from the sins of Jeroboam[b], with which he caused Israel to sin.
translation:
  language: sw
  text: Lakini Yehu hakuwa mwangalifu kuifuata sheria ya Yahwe[a], Mungu wa Israeli, kwa moyo wake wote. Hakuachana na dhambi za Yeroboamu[b], ambazo kwazo aliwafanya Israeli watende dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakutunza kuenenda katika sheria ya Yahwe.” Kitenzi cha Kiebrania kinaweza kusisitiza kutunza au kutii kwa uangalifu.
    reason: lexical_alternative
  - marker: b
    text: Yaani, dhambi za ibada zilizohusishwa na mfumo wa Yeroboamu wa sanamu; kauli hii inarudiwa mara nyingi katika vitabu vya Wafalme.
    reason: cross_reference
lexical_decisions:
- source_word: שָׁמַר לָלֶכֶת
  choice: hakujitahidi kufuata
  rationale: Muundo huu unaonyesha kutokuwa mwangalifu au kutotia bidii katika kutii; ‘hakujitahidi kufuata’ ni Kiswahili cha kawaida kinachohifadhi wazo la uangalifu wa makusudi.
- source_word: תּוֹרַת
  choice: sheria
  rationale: Katika muktadha huu wa agano, neno hilo linahusu sheria au mafundisho yenye mamlaka ya Yahwe; ‘sheria’ linafaa katika kauli hii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: בְּכָל לְבָבוֹ
  choice: kwa moyo wake wote
  rationale: Hii ni nahau inayoonyesha kujitoa kikamilifu kwa ndani, na tafsiri hii ni sahihi na ya kawaida katika Kiswahili.
- source_word: לֹא סָר מֵעַל
  choice: hakuachana na
  rationale: Kauli hii huonyesha kutogeuka wala kujitenga na jambo; ‘hakuachana na’ ni ya asili katika muktadha wa dhambi.
- source_word: חַטֹּאות
  choice: dhambi
  rationale: Inawakilisha moja kwa moja wingi wa makosa ya kidini yanayohusishwa na Yeroboamu.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: aliwasababisha Israeli watende dhambi
  rationale: Hifili ya חטא ina maana ya kusababisha kutenda dhambi. Upatanisho wa wingi kwa ‘Israeli’ unaelekeza kwa watu wa Israeli.
theological_decisions:
- issue: Tathmini ya uaminifu wa Yehu kwa agano
  choice: Aya inaonyesha kwamba Yehu hakumtii Yahwe kwa moyo wote, ingawa alikuwa amefanya marekebisho fulani hapo awali.
  alternative: Aya inakosoa tu kutokamilika kwa mageuzi yake ya kisiasa, si kujitoa kwake binafsi.
  rationale: Maneno ‘kwa moyo wake wote’ na kutokuachana na dhambi za Yeroboamu yanaweka tathmini katika uwanja wa uaminifu wa kiagano na wa kidini, bila kufuta mvutano uliopo katika simulizi.
- issue: Uhusiano wa kishazi אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: Kishazi kinarejelea dhambi za Yeroboamu kuwa njia ambayo kwa hiyo aliwasababisha Israeli watende dhambi.
  alternative: Kishazi kinaweza kutafsiriwa kwa urahisi kama ‘dhambi ambazo aliwasababisha Israeli wazitende.’
  rationale: Kiebrania kinaweza kubeba uhusiano wa kimatumizi; muundo ‘ambazo kwa hizo’ unahifadhi rejeo kwa dhambi bila kuamua kimyakimya kwamba Israeli walitenda matendo yale yale tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kufuata sheria’ limetumiwa badala ya tafsiri ngumu ya moja kwa moja ‘kutembea katika sheria,’ huku maana ya mwenendo wa maisha ikihifadhiwa. Alama zote za tanbihi zimewekwa katika matini.
