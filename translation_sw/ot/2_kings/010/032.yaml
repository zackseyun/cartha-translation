base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/032.yaml
  text: In those days Yahweh began to cut off parts of Israel[b][a], and Hazael struck them down throughout all the territory of Israel.
translation:
  language: sw
  text: Katika siku hizo, Yahwe alianza kuipunguza Israeli[a], naye Hazaeli akawapiga katika eneo lote la Israeli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alianza kuikatia Israeli sehemu za nchi yake.” Kitenzi cha Kiebrania kinaonyesha mwanzo wa kupunguzwa kwa Israeli, huenda kwa kupoteza maeneo yake.
    reason: lexical_alternative
  - marker: b
    text: Au, “kando ya mpaka wote wa Israeli.” Neno la Kiebrania linaweza kumaanisha mpaka au eneo; hapa huenda linamaanisha eneo lote la utawala wa Israeli lililoshambuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Katika siku hizo
  rationale: Huhifadhi usemi wa wakati wa Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: הֵחֵל
  choice: alianza
  rationale: Hueleza wazi mwanzo wa tendo hilo kama ilivyo katika kitenzi cha Kiebrania.
- source_word: לְקַצּוֹת בְּיִשְׂרָאֵל
  choice: kuikatia Israeli sehemu za nchi yake
  rationale: Huhifadhi picha ya kukata huku ikionyesha kupunguzwa kwa Israeli sehemu kwa sehemu, hasa kwa kupoteza maeneo, bila kudokeza kuangamizwa kabisa mara moja.
- source_word: וַיַּכֵּם
  choice: akawapiga
  rationale: Kitenzi נכה katika muktadha wa vita kina maana ya kupiga au kushinda; “akawapiga” huhifadhi nguvu na upana wa maana yake pamoja na kiambishi cha wingi kinachowarejelea Waisraeli.
- source_word: חֲזָאֵל
  choice: Hazaeli
  rationale: Ni umbo la jina linalosomeka kwa kawaida katika Kiswahili.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: katika eneo lote la Israeli
  rationale: גְּבוּל inaweza kuwa mpaka au eneo; katika muktadha huu wa mashambulizi, “eneo lote” huwasilisha kwa kawaida ukubwa wa sehemu iliyoshambuliwa huku tanbihi ikihifadhi maana nyingine.
theological_decisions:
- issue: Namna ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. Kulitaja “Yahwe” kunalihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Wakala wa kupunguzwa kwa Israeli
  choice: Yahwe alianza kuikatia Israeli sehemu za nchi yake
  alternative: Israeli ilianza kupoteza sehemu za nchi yake
  rationale: Muundo wa Kiebrania unamtaja Yahwe moja kwa moja kuwa mwanzilishi wa tendo; tafsiri haifichi mvutano wa kiteolojia kwa kuugeuza kuwa tukio lisilo na wakala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Kuikatia Israeli sehemu za nchi yake” ni usemi wa asili unaohifadhi picha ya kukata na wazo la upotevu wa maeneo hatua kwa hatua.
