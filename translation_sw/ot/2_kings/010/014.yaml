base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/014.yaml
  text: And he said[a], “Capture them alive.” So they captured them alive and slaughtered them at the pit of Beth-eked, forty-two men[c][b]; he did not leave a man of them.
translation:
  language: sw
  text: Akasema, “Wakamateni wakiwa hai.” Basi wakawakamata wakiwa hai, wakawachinja kwenye shimo la Beth-ekedi[a][b]—wanaume arobaini na wawili. Naye hakumwacha hata mmoja wao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kando ya shimo” au “ndani ya shimo.” Kihusishi cha Kiebrania hapa kinaweza kueleweka kwa namna zaidi ya moja kuhusu mahali.
    reason: lexical_alternative
  - marker: b
    text: Beth-ekedi ni jina la mahali. Jina hilo huenda lina maana ya asili kama “nyumba ya kufungia” au “nyumba ya kukusanyia,” lakini hapa linatumika kama jina maalumu.
    reason: cultural_note
  - marker: c
    text: 'Kiebrania: “hakumwacha hata mtu mmoja miongoni mwao,” likisisitiza kwamba hakuna aliyeachwa hai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּם
  choice: Wakamateni
  rationale: Kitenzi תפשׂ humaanisha kushika au kukamata. “Wakamateni” kinafaa kwa amri ya kuwakamata watu na kinaungana kwa kawaida na “wakiwa hai.”
- source_word: חַיִּים
  choice: wakiwa hai
  rationale: 'Neno hili limetumiwa kwa maana ya hali ambamo walipaswa kukamatwa: hai, si kuuawa papo hapo.'
- source_word: וַיִּשְׁחָטוּם
  choice: wakawachinja
  rationale: שׁחט ni kali na mahususi kuliko neno la jumla “kuua”; “kuwachinja” kinadumisha ukali wa tendo lililoelezwa.
- source_word: אֶל־בּוֹר
  choice: kwenye shimo
  rationale: אֶל linaweza kueleza mwendo kuelekea au uhusiano wa mahali. “Kwenye shimo” ni Kiswahili cha kawaida bila kulazimisha ikiwa tendo lilifanyika kandokando au ndani ya shimo.
- source_word: בֵּית עֵקֶד
  choice: Beth-ekedi
  rationale: Hili linatumika kama jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa kama kirai cha kawaida.
- source_word: אַרְבָּעִים וּשְׁנַיִם אִישׁ
  choice: wanaume arobaini na wawili
  rationale: אִישׁ hapa ni neno la kuhesabu wanaume; tafsiri hii inadumisha jinsia ya kisarufi na maana ya kundi linalotajwa.
- source_word: וְלֹא הִשְׁאִיר אִישׁ מֵהֶם
  choice: Hakumwacha hata mmoja wao
  rationale: Kitenzi cha umoja kinaonyesha Yehu ndiye mtendaji. “Hata mmoja” kinaonyesha ukamilifu wa maangamizi bila kuongeza maneno yasiyokuwamo moja kwa moja katika Kiebrania.
