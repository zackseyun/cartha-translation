  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa vitenzi wenye “waka-” unadumisha kasi ya simulizi. “Kuwachinja” limechaguliwa kwa makusudi ili kuhifadhi ukali wa שׁחט, huku maelezo ya chini yakihifadhi utata wa kihusishi אֶל.
