base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/011.yaml
  text: So Jehu struck down all who remained of the house of Ahab in Jezreel[a], and all his great men, his close associates, and his priests[c][b], until he left him no survivor.
translation:
  language: sw
  text: Basi Yehu akawaua wote waliobaki wa nyumba ya Ahabu huko Yezreeli, pamoja na wakuu wake wote[a], watu wake wa karibu[b], na makuhani wake, mpaka hakumwachia hata mmoja aliyenusurika.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wake mashuhuri.”
    reason: lexical_alternative
  - marker: b
    text: Au, “watu aliowajua” au “watu wake wa ndani.”
    reason: lexical_alternative
  - marker: c
    text: Kwa tafsiri ya karibu, “mpaka hakumwachia mtu aliyenusurika.” Kiambishi kinachotafsiriwa “-m-” kinaweza kumrejelea Ahabu au nyumba ya Ahabu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּךְ
  choice: akawaua
  rationale: Katika muktadha huu, kitenzi נכה kinaonyesha shambulio lililosababisha kifo. “Akawaua” ni wazi na cha kawaida katika Kiswahili cha sasa.
- source_word: הַנִּשְׁאָרִים
  choice: wote waliobaki
  rationale: Muundo huu unaendeleza maana ya watu waliokuwa bado hai baada ya mauaji yaliyotangulia na unasomeka kwa kawaida baada ya “wote.”
- source_word: לְבֵית אַחְאָב
  choice: wa nyumba ya Ahabu
  rationale: “Nyumba ya Ahabu” inaonyesha ukoo wa kifalme au nasaba yake, si jengo tu.
- source_word: בְּיִזְרְעֶאל
  choice: huko Yezreeli
  rationale: Kihusishi kinaonyesha mahali; “huko Yezreeli” ni usemi wa kawaida kwa tukio linalotendeka katika mji huo.
- source_word: גְּדֹלָיו
  choice: wakuu wake
  rationale: Neno hili linawahusu watu wenye cheo au ushawishi waliokuwa upande wa Ahabu. “Wakuu” ni fupi, ya heshima, na hailazimishi maana finyu ya tabaka la kiungwana.
- source_word: מְיֻדָּעָיו
  choice: watu wake wa karibu
  rationale: Neno linalotokana na ידע hapa linaweza kumaanisha watu wanaojulikana kwake, washirika, au watu wa ndani. “Watu wake wa karibu” linaonyesha uhusiano huo bila kuufanya kuwa rasmi kupita kiasi.
- source_word: כֹהֲנָיו
  choice: makuhani wake
  rationale: Hii ndiyo maana ya moja kwa moja ya neno la Kiebrania na haibainishi zaidi taasisi au majukumu yao kuliko chanzo.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: mpaka hakumwachia hata mmoja aliyenusurika
  rationale: Usemi huu unaonyesha kwamba hakuna aliyebaki hai. Kiambishi “-m-” katika “hakumwachia” kinahifadhi rejeo la nafsi ya kiume kwa Ahabu, huku tanbihi ikitaja uwezekano wa kurejelea nyumba yake.
theological_decisions:
- issue: Rejeo la kiwakilishi לוֹ katika kishazi cha mwisho
  choice: Kimehifadhiwa kama rejeo la nafsi ya kiume katika “hakumwachia,” linaloweza kueleweka kumhusu Ahabu.
  alternative: Kutafsiri kwa uwazi kuwa “hakuiachia nyumba ya Ahabu” au kuacha kiwakilishi kabisa na kusema “hakumwacha yeyote.”
  rationale: Kiebrania kina kiwakilishi cha umoja wa kiume, lakini rejeo lake limebanwa na linaweza kumaanisha Ahabu au nyumba yake. Tafsiri kuu inadumisha umbo hilo bila kulazimisha ufafanuzi mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mfuatano wa makundi katika Kiebrania, huku “pamoja na” ikisaidia mtiririko wa kawaida. Alama zote za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
