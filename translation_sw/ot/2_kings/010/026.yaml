translation:
  language: sw
  text: Kisha wakazitoa nguzo za ibada za nyumba ya Baali[a], wakaziteketeza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hekalu la Baali.” Neno “nyumba” katika muktadha huu linaweza kumaanisha mahali pa ibada.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “wakakiteketeza,” kwa kiambishi cha yambwa cha umoja, ingawa “nguzo” ni wingi; huenda maana yake ni ya jumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצִאוּ
  choice: Kisha wakazitoa
  rationale: Hifili ya יצא ina maana ya ‘kutoa’ au ‘kuleta nje’; ‘Kisha’ linaendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: מַצְּבוֹת
  choice: nguzo za ibada
  rationale: מַצֵּבָה ni jiwe lililosimamishwa au nguzo inayohusishwa na ibada. ‘Nguzo za ibada’ ni wazi kwa msomaji wa sasa bila kuifanya kuwa sanamu kwa namna isiyo sahihi.
- source_word: בֵּית הַבַּעַל
  choice: nyumba ya Baali
  rationale: בַּיִת kwa msingi ni ‘nyumba,’ ingawa katika muktadha huu ni mahali pa ibada, yaani hekalu; tafsiri ya msingi imehifadhiwa na mbadala umewekwa katika tanbihi.
- source_word: וַיִּשְׂרְפוּהָ
  choice: wakaziteketeza
  rationale: Ingawa Kiebrania kina kiambishi cha yambwa cha umoja wa kike, nomino iliyotangulia ni ya wingi. Kiswahili hutumia kiambishi cha wingi ‘-zi-’ ili kueleza wazi kwamba nguzo ndizo zilizoteketezwa.
