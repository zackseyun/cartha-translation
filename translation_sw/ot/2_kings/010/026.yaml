translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Baali’ limetumiwa kama umbo la kawaida la jina Baal katika tafsiri za Kiswahili. ‘Wakaziteketeza’ linaonyesha kuchoma kabisa na linafaa kwa tendo la kuharibu vifaa vya ibada.
