  text: But they were very[a], very afraid, and they said, “Look, the two kings could not stand before him; so how can we stand?”
translation:
  language: sw
  text: Wakaogopa sana sana,[a] wakasema, “Tazama, wafalme wawili hawakuweza kusimama mbele yake; basi sisi tunawezaje kusimama?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kuweka maana wazi zaidi, “hawakuweza kumhimili … sisi tunawezaje kumhimili?” Kiebrania kinatumia kitenzi kilekile, “kusimama,” katika vifungu vyote viwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: wakaogopa
  rationale: Kitenzi ירא katika mfululizo wa simulizi kinaonyesha mwitikio wao wa hofu; “wakaogopa” ni Kiswahili cha kawaida na chenye mtiririko wa masimulizi.
- source_word: מְאֹד מְאֹד
  choice: sana, sana
  rationale: Kurudia “sana” kunahifadhi uradidi na msisitizo wa Kiebrania badala ya kuufupisha kuwa kielezi kimoja.
- source_word: הִנֵּה
  choice: Tazama
  rationale: “Tazama” huvuta fikira kwa jambo linalofuata na kudumisha hadhi ya usemi bila kutumia lugha isiyoeleweka.
- source_word: שְׁנֵי הַמְּלָכִים
  choice: wale wafalme wawili
  rationale: Kiashiria “wale” kinaonyesha kuwa ni wafalme wawili waliokwisha tajwa katika muktadha.
- source_word: לֹא עָמְדוּ לְפָנָיו
  choice: hawakuweza kusimama mbele yake
  rationale: Katika muktadha huu, עמד לפני hudokeza kutoweza kumpinga au kustahimili mashambulizi yake; tafsiri hii huhifadhi taswira ya “kusimama” na kuweka wazi maana ya kutoweza.
- source_word: וְאֵיךְ נַעֲמֹד אֲנָחְנוּ
  choice: basi sisi tutawezaje kusimama?
  rationale: “Basi” huonyesha hitimisho linalotokana na yaliyotangulia; kurudia “kusimama” kunahifadhi ulinganifu wa kibalagha wa kitenzi עמד katika vifungu vyote viwili.
