base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/029.yaml
  text: Only[a], Jehu did not turn away from the sins of Jeroboam son of Nebat, by which he caused Israel to sin—the golden calves that were at Bethel and at Dan.
translation:
  language: sw
  text: Lakini Yehu hakuacha kuzifuata[a] dhambi za Yeroboamu mwana wa Nebati, ambaye aliwafanya Waisraeli watende dhambi—yaani, ndama wa dhahabu waliokuwa Betheli na Dani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno kwa neno: “hakungeuka kutoka nyuma yao.” Nahau ya Kiebrania humaanisha kwamba hakuacha kuzifuata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Katika muktadha huu neno hilo linaweka tofauti yenye ukomo kati ya matendo ya Yehu yaliyotangulia na kushindwa kwake kuacha dhambi za Yeroboamu. “Lakini” ni ya kawaida na hudumisha nguvu hiyo ya kupinga.
- source_word: חֲטָאֵי
  choice: dhambi
  rationale: Wingi huu unarejelea matendo maalumu ya ibada yaliyohusishwa na Yeroboamu; “dhambi” ni tafsiri ya moja kwa moja na iliyo wazi.
- source_word: הֶחֱטִיא
  choice: alizoifanya Israeli izitende
  rationale: Muundo wa Hiphil ni wa kusababisha. Kauli hii inaonyesha kwamba Yeroboamu aliifanya Israeli itende dhambi hizo, bila kupunguza nguvu ya kisababishi.
- source_word: לֹא סָר ... מֵאַחֲרֵיהֶם
  choice: hakuacha kuzifuata
  rationale: Nahau ya Kiebrania inamaanisha kwamba Yehu hakuacha mwenendo huo. Tafsiri hii ni ya asili katika Kiswahili huku wazo la kufuata likihifadhiwa.
- source_word: עֶגְלֵי הַזָּהָב
  choice: ndama wa dhahabu
  rationale: Hutaja kwa wazi sanamu za ibada zilizokuwa kiini cha dhambi zinazozungumziwa.
- source_word: אֲשֶׁר בֵּית אֵל וַאֲשֶׁר בְּדָן
  choice: waliokuwa Betheli na Dani
  rationale: Vishazi hivi vinaonyesha mahali ndama hao walipokuwa; majina ya mahali yametolewa kwa maumbo yanayotumika kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Uhusiano kati ya “dhambi za Yeroboamu” na “ndama wa dhahabu”
  choice: “Ndama wa dhahabu” limetolewa kama ufafanuzi wa dhambi zilizotajwa, kwa kutumia “yaani” baada ya kistari kirefu.
  alternative: Maneno hayo yanaweza kueleweka kama ufafanuzi wa kurejea baada ya mpito wa kisintaksia, bila neno la wazi “yaani.”
  rationale: Kiebrania hutoka katika dhana ya jumla ya dhambi hadi vitu halisi vya ibada. “Yaani” huweka uhusiano huo wazi bila kuongeza fundisho la dhehebu.
- issue: Mhusika aliyesababisha Israeli kutenda dhambi
  choice: Yeroboamu ndiye anayeeleweka kuwa aliifanya Israeli itende dhambi hizo.
  alternative: Kisarufi, kiwakilishi cha uhusiano kinaweza kuhusishwa kwa upana na dhambi au sera ya ibada iliyotajwa.
  rationale: Yeroboamu ndiye mtendaji wa karibu na anayetarajiwa katika nahau hii inayorudiwa katika Wafalme; muundo wa Kiswahili unahifadhi dhambi zenyewe kama yambwa zilizotendwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Hakuacha kuzifuata” ni ya asili kuliko kufuata neno kwa neno nahau ya Kiebrania; majina Yehu, Yeroboamu, Nebati, Betheli na Dani yanafuata matumizi mapana ya Biblia za Kiswahili.
