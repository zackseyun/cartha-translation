translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa asili bila kuficha ukali wa tukio. Alama ya tanbihi imewekwa baada ya ‘malundo mawili,’ ambako mbadala wa kileksia unahusika.
