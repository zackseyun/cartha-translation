  yaml_path: translation/ot/2_kings/010/008.yaml
  text: The messenger came and told him[a], saying, “They have brought the heads of the king’s sons.” And he said, “Put them in two heaps at the entrance of the gate until morning.”
translation:
  language: sw
  text: Mjumbe akaja na kumwambia, “Wameleta vichwa vya wana wa mfalme.” Naye akasema, “Viwekeni katika malundo mawili[a] kwenye mwingilio wa lango mpaka asubuhi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika marundo mawili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: Mjumbe
  rationale: Katika muktadha huu neno hili linamaanisha mleta habari wa kibinadamu, si kiumbe wa mbinguni.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: na kumwambia
  rationale: Huwasilisha kitendo cha kutoa taarifa na kuanzisha maneno ya moja kwa moja kwa Kiswahili cha kawaida bila uradidi usio wa asili wa ‘akisema.’
- source_word: הֵבִיאוּ
  choice: Wameleta
  rationale: Kauli hii inaripoti tendo lililokamilika ambalo matokeo yake yapo mbele yao wakati huo.
- source_word: רָאשֵׁי
  choice: vichwa
  rationale: Wingi huu unarejelea wazi vichwa vilivyokatwa vinavyotajwa katika muktadha.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: wana wa mfalme
  rationale: Huhifadhi maana ya mnyororo wa umilikaji na marejeo ya wana wa kiume katika muktadha.
- source_word: שִׂימוּ אֹתָם
  choice: Viwekeni
  rationale: Amri ya moja kwa moja; kiambishi ‘vi-’ kinarejelea vichwa kwa uwazi na kwa Kiswahili cha asili.
- source_word: שְׁנֵי צִבֻּרִים
  choice: katika malundo mawili
  rationale: ‘Malundo’ huonyesha vitu vilivyokusanywa na kuwekwa juu ya vingine, maana halisi ya צִבֻּרִים katika muktadha huu.
- source_word: פֶּתַח הַשַּׁעַר
  choice: kwenye mwingilio wa lango
  rationale: Hutaja kwa uwazi eneo la kuingilia kupitia lango na kuhifadhi taswira ya mahali katika Kiebrania.
- source_word: עַד הַבֹּקֶר
  choice: mpaka asubuhi
  rationale: Hueleza muda unaoendelea hadi asubuhi inayofuata kwa Kiswahili cha kawaida.
