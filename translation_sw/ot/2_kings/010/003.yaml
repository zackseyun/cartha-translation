base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/003.yaml
  text: Then choose the best and most upright of your master's sons[a], set him on his father's throne[b], and fight for your master's house.
translation:
  language: sw
  text: Basi, mchagueni yule aliye bora zaidi na mwadilifu zaidi miongoni mwa wana wa bwana wenu[a], mwekeni kwenye kiti cha enzi cha baba yake, kisha mpiganie nyumba ya bwana wenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtazameni aliye mwema na mwadilifu miongoni mwa wana wa bwana wenu.” Kitenzi cha Kiebrania kwa maana ya msingi ni “kuona,” lakini hapa kinadokeza kumchagua mtu baada ya kuwachunguza.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba” hapa ni jamaa au ukoo wa kifalme wa bwana wenu, si jengo tu.
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: mchagueni
  rationale: Kitenzi hiki kwa maana ya msingi ni ‘kuona,’ lakini katika muktadha huu kinamaanisha kumtambua na kumteua mtu baada ya kuwachunguza wana waliopo. ‘Mchagueni’ huwasilisha tendo linalokusudiwa kwa Kiswahili cha kawaida.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: aliye bora na mwadilifu zaidi
  rationale: Vivumishi hivi viwili vinamtaja mgombea anayefaa zaidi kwa sifa na unyofu kati ya wana hao. Neno ‘zaidi’ linaonyesha ulinganisho unaodokezwa na muktadha bila kudai kwamba Kiebrania kina umbo maalumu la kiwango cha juu.
- source_word: מִבְּנֵי אֲדֹנֵיכֶם
  choice: miongoni mwa wana wa bwana wenu
  rationale: Kirai kinaonyesha uteuzi kutoka kati ya wana wa mkuu wao wa kibinadamu. ‘Bwana wenu’ ni namna ya kawaida na yenye heshima ya kumrejelea mwenye mamlaka wa kibinadamu hapa, bila kuitumia kama jina la Mungu.
- source_word: וְשַׂמְתֶּם עַל כִּסֵּא אָבִיו
  choice: mkalishe kwenye kiti cha ufalme cha baba yake
  rationale: Usemi huu unamaanisha kumweka katika nafasi ya kifalme ya baba yake. ‘Kiti cha ufalme’ ni cha asili na wazi zaidi kwa wasomaji wa Kiswahili kuliko tafsiri ya neno kwa neno isiyoeleza maana ya kifalme.
- source_word: וְהִלָּחֲמוּ עַל בֵּית אֲדֹנֵיכֶם
  choice: kisha mpiganie nyumba ya bwana wenu
  rationale: ‘Mpiganie’ huonyesha kupigana kwa niaba ya au kuitetea nyumba hiyo. ‘Nyumba’ imehifadhiwa katika matini, huku tanbihi ikifafanua maana yake ya ukoo wa kifalme.
theological_decisions:
- issue: Maana ya אֲדֹנֵיכֶם
  choice: bwana wenu
  alternative: Bwana wenu; mkuu wenu
  rationale: Katika simulizi hili neno linamrejelea mtawala wa kibinadamu, si YHWH. Herufi ndogo katika ‘bwana’ na kiwakilishi ‘wenu’ huweka wazi kuwa ni cheo cha kibinadamu.
- issue: Maana ya בֵּית אֲדֹנֵיכֶם
  choice: nyumba ya bwana wenu
  alternative: ukoo wa kifalme wa bwana wenu
  rationale: Neno ‘nyumba’ linaweza kumaanisha jamaa ya kifalme au nasaba ya utawala. Kulihifadhi katika matini hudumisha sitiari ya Kiebrania, na tanbihi huzuia lisieleweke kuwa jengo tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa urahisi. Maumbo ya wingi ‘mchagueni,’ ‘mkalishe,’ na ‘mpiganie’ yanahifadhi kwamba hotuba inaelekezwa kwa kundi. Sitiari ya ‘nyumba’ imehifadhiwa na kufafanuliwa katika tanbihi.
