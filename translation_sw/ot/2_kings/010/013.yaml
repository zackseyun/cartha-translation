  yaml_path: translation/ot/2_kings/010/013.yaml
  text: Jehu found the brothers of Ahaziah king of Judah and said[a], “Who are you?” They said, “We are the brothers of Ahaziah[c][b], and we have come down to ask about the welfare of the sons of the king and the sons of the queen mother.”
translation:
  language: sw
  text: Yehu akawakuta ndugu wa Ahazia[a], mfalme wa Yuda, akawauliza, “Ninyi ni nani?” Wakasema, “Sisi ni ndugu wa Ahazia, nasi tumeshuka kuuliza hali[b] ya wana wa mfalme na wana wa malkia mama[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “ndugu” linaweza kumaanisha pia jamaa wa karibu, hasa katika simulizi kuhusu familia ya kifalme.
    reason: lexical_alternative
  - marker: b
    text: Au “kuona kama wana wa mfalme na wana wa malkia mama wako salama.”
    reason: lexical_alternative
  - marker: c
    text: “Malkia mama” ni tafsiri ya neno la Kiebrania gebirah, cheo cha kifalme cha mama wa mfalme.
    reason: cultural_note
lexical_decisions:
- source_word: מָצָא
  choice: akawakuta
  rationale: Huwasilisha moja kwa moja tendo la Yehu kuwakuta au kukutana nao, huku ikidumisha mtiririko wa simulizi.
- source_word: אֲחֵי אֲחַזְיָהוּ
  choice: ndugu wa Ahazia
  rationale: Neno la Kiebrania kimsingi ni ‘ndugu,’ lakini katika simulizi la kifalme linaweza pia kuwahusu jamaa wa karibu; maana hiyo pana imeelezwa katika tanbihi.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya cheo cha kifalme kinachomhusu Ahazia.
- source_word: מִי אַתֶּם
  choice: Ninyi ni nani?
  rationale: Swali fupi na la kawaida katika Kiswahili, lenye msisitizo unaofaa kwa wingi wa wahusika wanaoulizwa.
- source_word: וַנֵּרֶד
  choice: tumeshuka
  rationale: Inahifadhi wazo la kushuka kijiografia na inasikika kwa kawaida kutoka kwa mtazamo wa wasemaji.
- source_word: לִשְׁלוֹם
  choice: kuuliza hali
  rationale: Katika muktadha huu ni nahau ya kuulizia ustawi wa mtu, si salamu ya kawaida tu.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: wana wa mfalme
  rationale: Inadumisha neno mahususi ‘wana’ na muundo sambamba wa Kiebrania.
- source_word: הַגְּבִירָה
  choice: malkia mama
  rationale: Katika mazingira ya kifalme ya Yuda, hili ni jina la cheo cha mama wa mfalme, wala si neno la jumla tu kwa mwanamke mwenye hadhi.
- source_word: וּבְנֵי הַגְּבִירָה
  choice: na wana wa malkia mama
  rationale: Inahifadhi usambamba na ‘wana wa mfalme’ pamoja na utofautishaji uliopo katika Kiebrania.
