translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa orodha umesawazishwa kwa Kiswahili cha kawaida, na nahau ‘machoni pako’ imehifadhiwa kwa kuwa inaeleweka na kudumisha ladha ya chanzo.
