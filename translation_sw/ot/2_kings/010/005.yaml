base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/005.yaml
  text: So the one who was over the palace[a], and the one who was over the city, along with the elders and the guardians, sent to Jehu, saying, “We are your servants, and all that you say to us we will do. We will not make any man king. Do what is good in your eyes.”
translation:
  language: sw
  text: Basi msimamizi wa jumba la kifalme, msimamizi wa mji, wazee, na walezi[a] wakatuma ujumbe kwa Yehu wakisema, “Sisi ni watumishi wako, nasi tutafanya kila utakachotuambia. Hatutamweka mtu yeyote kuwa mfalme. Fanya lililo jema machoni pako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walezi wa kiume” au “watunzaji.” Neno la Kiebrania linarejelea watu waliokabidhiwa jukumu la kuwatunza wana wa kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: msimamizi wa jumba la kifalme
  rationale: Kirai hiki kinaeleza afisa aliyesimamia nyumba ya mfalme. ‘Jumba la kifalme’ linafaa katika muktadha huu kuliko ‘nyumba,’ huku ‘msimamizi’ likihifadhi maana ya wadhifa bila kuubainisha kupita kiasi.
- source_word: וַאֲשֶׁר עַל הָעִיר
  choice: msimamizi wa mji
  rationale: Kiebrania kinaeleza wadhifa badala ya kutumia cheo rasmi. Tafsiri hii ni ya kawaida katika Kiswahili na haiongezi dhana maalumu kama ‘gavana.’
- source_word: הַזְּקֵנִים
  choice: wazee
  rationale: ‘Wazee’ ni istilahi ya kawaida ya kibiblia kwa viongozi wa kijamii na kisiasa wanaotajwa hapa.
- source_word: הָאֹמְנִים
  choice: walezi
  rationale: Katika muktadha wa wana wa kifalme waliokabidhiwa kwa wengine, neno hili linamaanisha watu waliowajibika kuwatunza na kuwalea. ‘Walezi’ ni wazi na halidokezi lazima uhusiano wa kibaolojia.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Hapa neno linatumika kama kauli ya kujishusha na kuahidi utii wa kisiasa, si kusisitiza hali ya utumwa.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלֵינוּ נַעֲשֶׂה
  choice: nasi tutafanya kila utakachotuambia
  rationale: Hii ni ahadi ya moja kwa moja ya kutii, iliyotolewa kwa Kiswahili cha kawaida bila kupoteza upana wa ‘kila.’
- source_word: לֹא נַמְלִיךְ אִישׁ
  choice: Hatutamweka mtu yeyote kuwa mfalme
  rationale: Kauli ya Kiebrania ina maana ya kumsababisha mtu atawale au kumweka kuwa mfalme; tafsiri hii inahifadhi nguvu hiyo ya kisababishi.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: lililo jema machoni pako
  rationale: Tafsiri hii inahifadhi nahau ya Kiebrania na bado inaeleweka vizuri katika Kiswahili cha heshima.
- source_word: עֲשֵׂה
  choice: Fanya
  rationale: Amri fupi na ya moja kwa moja inaakisi ufupi wa Kiebrania.
