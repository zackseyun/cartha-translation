base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/025.yaml
  text: And when he had finished offering the burnt offering[a], Jehu said to the runners and to the officers, “Go in; strike them down. Let no man come out.” So they struck them down with the edge of the sword, and the runners and the officers threw them out and went as far as the inner shrine of the house of Baal.
translation:
  language: sw
  text: Ikawa alipomaliza kutoa sadaka ya kuteketezwa, Yehu akawaambia wakimbiaji na maafisa, “Ingieni, wapigeni; mtu yeyote asitoke.” Basi wakawapiga kwa makali ya upanga. Wakimbiaji na maafisa wakawatupa nje, kisha wakaenda mpaka eneo la ndani la nyumba ya Baali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “mpaka mji wa nyumba ya Baali.” Neno linalotafsiriwa “eneo la ndani” linaweza pia kumaanisha eneo lenye ngome au eneo takatifu la ndani katika eneo la jengo la ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ
  choice: alipomaliza
  rationale: 'Muundo wa כְּ pamoja na kitenzi-jina na kiambishi cha nafsi huonyesha wakati: ‘alipomaliza’ au ‘mara tu alipomaliza.’'
- source_word: לַעֲשׂוֹת הָעֹלָה
  choice: kutoa sadaka ya kuteketezwa
  rationale: Hii ni nahau ya ibada ya dhabihu; ‘kutoa’ ni Kiswahili cha kawaida, na ‘sadaka ya kuteketezwa’ huhifadhi aina maalumu ya sadaka עֹלָה.
- source_word: לָרָצִים
  choice: wakimbiaji
  rationale: Neno hili kihalisi ni ‘wakimbiaji’ na katika mazingira ya kifalme laweza kutaja walinzi au wajumbe wa mfalme. Tafsiri ya moja kwa moja inahifadhi istilahi ya Kiebrania bila kuamua kazi yao kwa usahihi usio na hakika.
- source_word: לַשָּׁלִשִׁים
  choice: maafisa
  rationale: שָׁלִישׁ humaanisha afisa wa kijeshi au wa kifalme, pengine hapo awali afisa wa magari ya vita; ‘maafisa’ haibani cheo hicho kupita ushahidi.
- source_word: בֹּאוּ
  choice: Ingieni
  rationale: Amri inawaelekeza watu wa Yehu kuingia katika eneo la hekalu; ‘Ingieni’ ni ya asili na huhifadhi nguvu ya amri.
- source_word: הַכּוּם
  choice: mkawaangamize
  rationale: נכה humaanisha kupiga na katika muktadha huu tendo hilo ni la kuua. ‘Mkawaangamize’ huwasilisha wazi nguvu ya amri, ingawa ‘wapigeni’ pia inawezekana.
- source_word: אִישׁ אַל יֵצֵא
  choice: mtu yeyote asitoke
  rationale: Umoja אִישׁ una maana ya kugawa kwa kila mmoja; Kiswahili cha kawaida ‘mtu yeyote asitoke’ kinahifadhi katazo bila kufanya jinsia kuwa hoja kuu.
- source_word: לְפִי חָרֶב
  choice: kwa makali ya upanga
  rationale: Nahau hiyo ni ‘kwa kinywa cha upanga’; ‘kwa makali ya upanga’ huhifadhi taswira yake kwa Kiswahili kinachoeleweka.
- source_word: וַיַּשְׁלִכוּ
  choice: wakawatupa nje
  rationale: Kitenzi humaanisha kutupa au kurusha. Katika mfuatano huu, wale waliouawa ndio wanaotupwa nje; neno ‘nje’ linaonyesha mwelekeo unaodokezwa na muktadha.
- source_word: עַד עִיר בֵּית הַבָּעַל
  choice: mpaka sehemu ya ndani ya hekalu la Baali
  rationale: עִיר kwa kawaida ni ‘mji,’ lakini hapa linaweza kutaja eneo la ndani au lenye ulinzi katika jengo la hekalu. Muktadha wa kuingia zaidi katika eneo takatifu unaunga mkono tafsiri hii, huku maana ya uso ikihifadhiwa katika tanbihi.
