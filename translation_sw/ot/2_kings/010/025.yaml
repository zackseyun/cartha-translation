translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa masimulizi ‘Ikawa ... basi ... kisha’ huhifadhi mfuatano wa Kiebrania bila kufanya sentensi kuwa nzito. Alama ya tanbihi imewekwa kwenye kishazi kinachohusika nacho, si baada ya ‘sadaka ya kuteketezwa.’
