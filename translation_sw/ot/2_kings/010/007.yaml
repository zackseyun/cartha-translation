base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/007.yaml
  text: And when the letter came to them[a], they took the king’s sons and slaughtered seventy men, and put their heads in baskets and sent them to him at Jezreel.
translation:
  language: sw
  text: Ikawa, barua hiyo ilipowafikia, wakawachukua wana wa mfalme sabini na kuwachinja. Wakavitia vichwa vyao katika vikapu[a] na kuvipeleka kwake huko Yezreeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika vyungu” au “katika mitungi”; neno la Kiebrania humaanisha vyombo na halithibitishi kwa hakika kwamba vilikuwa vikapu vilivyofumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: barua
  rationale: Katika muktadha huu neno hilo linamaanisha ujumbe ulioandikwa ambao Yehu alikuwa amewatumia; “barua” ni tafsiri ya kawaida na mahususi.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: wana wa mfalme
  rationale: Huhifadhi maana ya kifamilia na ya nasaba ya kifalme bila kuipanua kuwa wazao kwa ujumla.
- source_word: וַיִּשְׁחֲטוּ
  choice: kuwachinja
  rationale: Kitenzi cha Kiebrania huonyesha uchinjaji; “kuwachinja” huhifadhi ukatili wa tendo kuliko “kuwaua”.
- source_word: שִׁבְעִים אִישׁ
  choice: watu sabini
  rationale: Katika Kiswahili, “watu sabini” ni njia ya asili ya kuhesabu wanaume waliotajwa tayari kama wana wa mfalme, bila kurudia kwa mtindo mzito.
- source_word: רָאשֵׁיהֶם
  choice: vichwa vyao
  rationale: Ni tafsiri ya moja kwa moja inayohitajika na muktadha; hakuna sababu ya kutumia lugha ya kuficha ukatili.
- source_word: בַּדּוּדִים
  choice: katika vikapu
  rationale: Neno la Kiebrania linataja vyombo vikubwa na linaweza kumaanisha vikapu, vyungu, au mitungi; “vikapu” ni uwezekano unaofaa katika muktadha wa kusafirisha vichwa, huku tanbihi ikihifadhi kutokuwa na uhakika.
- source_word: אֵלָיו
  choice: kwake
  rationale: Kiwakilishi kinamrejelea Yehu katika muktadha wa karibu; tafsiri inadumisha kiwakilishi badala ya kuweka jina.
- source_word: יִזְרְעֶאלָה
  choice: huko Yezreeli
  rationale: He ya mwelekeo huonyesha mwendo kuelekea Yezreeli; “huko Yezreeli” ni Kiswahili cha kawaida kinachoonyesha mahali alikokuwa mpokeaji baada ya kitenzi “kuvituma”.
