  yaml_path: translation/ot/2_kings/010/015.yaml
  text: He went on from there and found Jehonadab the son of Rechab coming to meet him. He greeted him and said to him, “Is your heart upright, as my heart is with your heart?” Jehonadab said, “It is, it is.” Jehu said, “Give me your hand.” So he gave him his hand, and Jehu took him up to himself into the chariot.
translation:
  language: sw
  text: Akaendelea kutoka huko, akamkuta Yehonadabu mwana wa Rekabu akija kumlaki. Akamsalimu[a] na kumwambia, “Je, moyo wako ni mnyofu kama moyo wangu ulivyo pamoja na moyo wako?”[b] Yehonadabu akajibu, “Ndivyo, ndivyo.”[c] Yehu akasema, “Nipe mkono wako.” Basi akampa mkono wake, naye Yehu akampandisha kwake ndani ya gari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Akambariki.” Kitenzi cha Kiebrania kinaweza kumaanisha “kubariki,” lakini katika tukio hili la kukutana huenda kinamaanisha kutoa salamu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni, “Je, moyo wako ni mnyofu kama moyo wangu ulivyo pamoja na moyo wako?” Usemi huo unaashiria uaminifu wa pande zote au kulingana kwa makusudi.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania ni, “Ndivyo, na ndivyo”—jibu la kusisitiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: Akaendelea kutoka huko
  rationale: Inaonyesha mwendo wa simulizi unaoendelea kutoka mahali palipotajwa awali, kwa Kiswahili cha kawaida.
- source_word: וַיִּמְצָא אֶת־יְהוֹנָדָב בֶּן־רֵכָב
  choice: akamkuta Yehonadabu mwana wa Rekabu
  rationale: Kitenzi מצא kimehifadhiwa kwa maana yake ya msingi ya ‘kukuta/kupata,’ huku majina yakitoholewa kwa Kiswahili.
- source_word: לִקְרָאתוֹ
  choice: akija kumlaki
  rationale: ‘Kumlaki’ huonyesha kwamba Yehonadabu alikuwa akimjia Yehu kwa kusudi la kukutana naye.
- source_word: וַיְבָרְכֵהוּ
  choice: Akamsalimu
  rationale: Ingawa ברך mara nyingi humaanisha ‘bariki,’ katika tukio la watu kukutana inaweza kumaanisha kutoa salamu.
- source_word: הֲיֵשׁ אֶת־לְבָבְךָ יָשָׁר
  choice: Je, moyo wako ni mnyofu
  rationale: ‘Mnyofu’ huhifadhi taswira ya moyo ulionyooka na inaweza kuhusisha uaminifu wa ndani bila kuufafanua kupita kiasi.
- source_word: כַּאֲשֶׁר לְבָבִי עִם־לְבָבֶךָ
  choice: kama moyo wangu ulivyo pamoja na moyo wako
  rationale: Muundo usio wa kawaida na taswira ya ‘moyo’ imerudiwa ili kuhifadhi usemi wa Kiebrania na kutougeuza moja kwa moja kuwa tafsiri ya kiitikadi.
- source_word: יֵשׁ וָיֵשׁ
  choice: Ndivyo, ndivyo
  rationale: Marudio yanahifadhi mkazo wa jibu la Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: תְּנָה אֶת־יָדֶךָ
  choice: Nipe mkono wako
  rationale: Ni ombi la kawaida la kunyoosha au kutoa mkono, linalolingana moja kwa moja na tendo linalofuata.
- source_word: וַיִּתֵּן יָדוֹ
  choice: akampa mkono wake
  rationale: Hifadhi jibu la moja kwa moja kwa ombi la Yehu, bila kuongeza maana ya kiapo isiyotajwa wazi.
- source_word: וַיַּעֲלֵהוּ אֵלָיו אֶל־הַמֶּרְכָּבָה
  choice: Yehu akampandisha kwake ndani ya gari la vita
  rationale: ‘Akampandisha’ huonyesha Hifili ya עלה, ‘kwake’ huwakilisha אֵלָיו, na ‘gari la vita’ huepuka kueleweka kama gari la kisasa.
theological_decisions:
- issue: Maana ya moyo mnyofu na mioyo kuwa pamoja
  choice: Kuhifadhi taswira ya moyo na muundo wa uhusiano
  alternative: Kufafanua kuwa ‘Je, wewe ni mwaminifu kwangu kama mimi nilivyo mwaminifu kwako?’
  rationale: Kiebrania kinaweza kuonyesha uaminifu au kulingana kwa makusudi, lakini hakifafanui kikamilifu aina ya uhusiano; tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa simulizi umetumia viambishi vya mfululizo ‘aka-’. ‘Gari la vita’ limetumiwa badala ya ‘gari’ pekee ili kuonyesha chombo cha kale kinachokusudiwa.
