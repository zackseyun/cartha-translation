base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/016.yaml
  text: Then he said[a], “Come with me and see my zeal for Yahweh.” So they had him ride in his chariot.
translation:
  language: sw
  text: Kisha akasema, “Njoo pamoja nami, ukaone bidii[a] yangu kwa ajili ya Yahweh.” Basi wakampandisha katika gari lake la vita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wivu wangu.” Neno la Kiebrania linaweza kumaanisha bidii au wivu, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה אִתִּי
  choice: Njoo pamoja nami
  rationale: Imperative לְכָה functions here as an invitation or summons, and אִתִּי expresses accompaniment. This is natural, direct Swahili.
- source_word: וּרְאֵה
  choice: ukaone
  rationale: The singular imperative of ראה is retained as a direct invitation to observe, while the Swahili consecutive form connects it naturally to the preceding command.
- source_word: בְּקִנְאָתִי
  choice: bidii yangu
  rationale: קִנְאָה can express either zeal or jealousy. In the immediate context Jehu presents his vigorous devotion to Yahweh, so “bidii” is the clearest main-text rendering; the alternative “wivu” is preserved in a footnote.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahwe
  rationale: The lamed identifies Yahweh as the object or cause of Jehu’s zeal. The divine name יהוה is transliterated as “Yahwe.”
- source_word: וַיַּרְכִּיבוּ אֹתוֹ
  choice: wakampandisha
  rationale: The Hiphil form is causative, meaning that unspecified people caused him to ride or put him aboard. “Wakampandisha” preserves both the causative force and the plural subject.
- source_word: בְּרִכְבּוֹ
  choice: katika gari lake
  rationale: רֶכֶב here denotes a chariot or vehicle. “Gari” is understandable modern Swahili in this historical context, and the possessive suffix is retained without explicitly resolving its referent.
theological_decisions:
- issue: Rendering the divine name יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: The source text directly uses the covenant name יהוה. “Yahwe” preserves it as a proper name rather than replacing it with a title.
- issue: The sense of קִנְאָה in Jehu’s claim
  choice: bidii yangu
  alternative: wivu wangu
  rationale: The noun genuinely permits both zeal and jealousy. The context favors energetic devotion as the main sense, but the lexical tension is not eliminated; the alternative is stated in the footnote.
translation_notes:
  register: Standard East African Swahili; direct, dignified, and readily understandable. The pronoun in “gari lake” remains formally ambiguous, as in the Hebrew. The footnote marker is attached to the debated expression rather than to the reporting verb.
