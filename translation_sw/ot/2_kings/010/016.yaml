  terminology: “Bidii yangu kwa ajili ya Yahweh” appropriately renders Jehu’s claimed קִנְאָה without prejudging its possible nuance of jealousy. The lexical alternative is retained in a footnote anchored directly to “bidii.” “Yahweh” consistently represents יהוה.
