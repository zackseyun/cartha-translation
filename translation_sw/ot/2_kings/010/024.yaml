base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/024.yaml
  text: And they went in to offer sacrifices and burnt offerings. Now Jehu had stationed for himself outside eighty men[a], and he said, “The man who lets any of the men whom I am delivering into your hands escape—his life for that man’s life.”
translation:
  language: sw
  text: Nao wakaingia kutoa dhabihu na sadaka za kuteketezwa. Yehu alikuwa ameweka watu themanini nje, akawaambia, “Yeyote atakayemwacha mmoja wa watu ninaowatia mikononi mwenu atoroke—uhai wake utakuwa badala ya uhai wa mtu huyo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa neno halisi, “uhai wake badala ya uhai wake”; maana yake ni kwamba mlinzi atakayemruhusu mtu atoroke atapoteza uhai wake badala ya uhai wa huyo aliyetoroka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: wakaingia
  rationale: בוא katika muktadha huu inaonyesha kuingia ndani kwa kusudi la ibada; “wakaingia” ni ya kawaida na huendeleza simulizi.
- source_word: לַעֲשׂוֹת זְבָחִים וְעֹלוֹת
  choice: kutoa dhabihu na sadaka za kuteketezwa
  rationale: עשה pamoja na vitu vya dhabihu ina maana ya kufanya tendo la kutoa sadaka. “Sadaka za kuteketezwa” ni istilahi wazi kwa עֹלוֹת.
- source_word: שָׂם לוֹ בַחוּץ שְׁמֹנִים אִישׁ
  choice: alikuwa amewaweka watu themanini nje
  rationale: שׂים hapa ni kuwaweka watu mahali kama kikosi cha ulinzi. “Watu” huhifadhi אִישׁ bila kuongeza kwamba walikuwa askari.
- source_word: הָאִישׁ אֲשֶׁר יִמָּלֵט מִן הָאֲנָשִׁים
  choice: Yeyote atakayemwacha mmoja wa watu ... atoroke
  rationale: Muundo wa Kiebrania kwa karibu unasema kuhusu mtu anayeponyoka, lakini muktadha wa onyo kwa walinzi unaonyesha wajibu wa yule anayemruhusu kutoroka. Kiswahili hiki kinaeleza wajibu huo kwa kawaida bila kubadili adhabu iliyotajwa.
- source_word: אֲשֶׁר אֲנִי מֵבִיא עַל יְדֵיכֶם
  choice: ninaowatia mikononi mwenu
  rationale: “Kuweka mikononi” huhifadhi nahau ya Kiebrania ya kuwakabidhi watu chini ya mamlaka ya wengine.
- source_word: נַפְשׁוֹ תַּחַת נַפְשׁוֹ
  choice: uhai wake utakuwa badala ya uhai wa mtu huyo
  rationale: נפש hapa ni uhai. “Mtu huyo” hutofautisha kwa uwazi uhai wa mlinzi asiyezuia kutoroka na uhai wa mtu aliyetoroka.
theological_decisions:
- issue: Utambulisho wa wahusika katika kauli “uhai wake badala ya uhai wake”
  choice: Kumtaja wa pili kuwa “mtu huyo,” yaani aliyetoroka
  alternative: 'Kuhifadhi viwakilishi viwili vilevile: “uhai wake badala ya uhai wake”'
  rationale: Kiebrania kina viwakilishi vinavyofanana, lakini muktadha unaonyesha adhabu ya mlinzi badala ya mtu aliyemwacha atoroke. Ufafanuzi huu ni wa kisarufi na kimuktadha, si msimamo wa kimadhehebu; tanbihi huhifadhi umbo halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka, huku nahau ya “kuwatia mikononi” ikihifadhi picha ya maandishi ya Kiebrania. Alama ya tanbihi imewekwa baada ya kauli inayofafanuliwa.
