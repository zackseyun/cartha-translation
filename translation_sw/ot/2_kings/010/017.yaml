base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/017.yaml
  text: When he came to Samaria[a], he struck down all who remained of Ahab in Samaria, until he had destroyed them, according to the word of Yahweh that he had spoken to Elijah.
translation:
  language: sw
  text: Alipofika Samaria, akawaua watu wote wa Ahabu waliokuwa wamebaki huko Samaria, mpaka alipowaangamiza[a], kulingana na neno ambalo Yahweh alikuwa amemwambia Eliya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka alipoiharibu,” kiambishi cha umoja kikieleweka kuwa kinarejelea nyumba ya Ahabu kama kundi moja. Kiebrania kina kiambishi cha umoja kinachoweza kueleweka kwa njia hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: Alipofika Samaria
  rationale: Muundo wa ‘alipo-’ unaunganisha kufika kwake na tendo linalofuata kwa Kiswahili cha kawaida, huku ukiendeleza mtiririko wa simulizi.
- source_word: וַיַּךְ
  choice: akawaua
  rationale: Katika muktadha huu נכה inaonyesha kuwapiga kwa kusudi la kuwaua; ‘akawaua’ ni wazi na ya asili kuliko tafsiri halisi isiyoeleza matokeo.
- source_word: כָּל הַנִּשְׁאָרִים לְאַחְאָב
  choice: watu wote wa Ahabu waliokuwa wamebaki
  rationale: Kirai hiki kinawataja wote waliobaki ambao walihusishwa na Ahabu. ‘Watu wa Ahabu’ huhifadhi upana huo bila kulazimisha maana kuwa wazao wa ukoo pekee.
- source_word: בְּשֹׁמְרוֹן
  choice: huko Samaria
  rationale: ‘Huko’ hurejelea kwa kawaida mahali palipotajwa tayari na pia huhifadhi kurudiwa kwa jina Samaria katika Kiebrania.
- source_word: עַד הִשְׁמִידוֹ
  choice: mpaka alipowaangamiza kabisa
  rationale: שׁמד huonyesha kuangamiza au kufutilia mbali. Wingi unalingana kwa Kiswahili na watu waliotajwa, huku kiambishi cha umoja cha Kiebrania na uwezekano wa rejeo la kijumla vikielezwa katika tanbihi.
- source_word: כִּדְבַר יְהוָה
  choice: sawasawa na neno la Yahweh
  rationale: ‘Neno’ huhifadhi mtindo wa utimilifu wa unabii, na ‘sawasawa na’ huonyesha kuwa tendo hilo lilitimiza yaliyosemwa.
- source_word: אֲשֶׁר דִּבֶּר אֶל אֵלִיָּהוּ
  choice: alilokuwa amemwambia Eliya
  rationale: Wakati timilifu huonyesha kuwa Yahweh alikuwa amekwisha kutoa neno hilo kwa Eliya kabla ya utimilifu wake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Rejeo la kiambishi cha umoja katika הִשְׁמִידוֹ
  choice: Kilitafsiriwa kwa wingi katika matini kuu kikirejelea watu waliobaki, huku maana ya kijumla ikiwekwa katika tanbihi.
  alternative: mpaka alipoifuta kabisa nyumba ya Ahabu
  rationale: Kiambishi ni cha umoja kisarufi, lakini kinaweza kumrejelea Ahabu kwa maana ya nyumba yake kama kundi moja. Matini kuu inafuata wahusika wa karibu wa wingi bila kuficha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. ‘Akawaua’ hutaja wazi ukali wa tendo bila kutumia usemi wa zamani usio wa kawaida; ‘watu wa Ahabu’ huepuka kuongeza kwa lazima kwamba wote walikuwa watu wa ukoo wake.
