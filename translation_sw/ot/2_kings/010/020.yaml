  language: sw
  text: Ndipo Yehu akasema, “Takaseni kusanyiko takatifu kwa ajili ya Baali.” Basi wakalitangaza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: קַדְּשׁוּ
  choice: Takaseni
  rationale: Amri ya wingi kutoka קדשׁ ina maana ya kulitenga rasmi kusanyiko kwa matumizi ya kidini; “takaseni” inadumisha uzito wa kiibada.
- source_word: עֲצָרָה
  choice: kusanyiko maalumu
  rationale: Neno linaashiria mkutano rasmi wa kidini. “Kusanyiko maalumu” ni la asili na linaeleweka, bila kuongeza kwa lazima wazo la huzuni ambalo “kusanyiko la huzuni” lingeweza kudokeza.
- source_word: לַבַּעַל
  choice: kwa ajili ya Baali
  rationale: 'Kiambishi ל hapa kinaonyesha kusudi au uhusiano: kusanyiko linafanywa kwa heshima au ibada ya Baali.'
- source_word: וַיִּקְרָאוּ
  choice: Basi wakalitangaza
  rationale: Katika muktadha huu קרא ni kutoa tangazo la hadharani. Kiambishi “-li-” kinarejelea kusanyiko lililotajwa.
