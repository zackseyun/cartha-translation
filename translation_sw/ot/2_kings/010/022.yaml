base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/022.yaml
  text: He said to the one who was over the wardrobe[b][a], “Bring out clothing for all the worshipers of Baal.” So he brought out the clothing for them.
translation:
  language: sw
  text: Akamwambia yule aliyekuwa msimamizi wa chumba cha mavazi, “Toa mavazi kwa ajili ya waabudu wote wa Baali.”[a] Basi akawatolea mavazi hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “watumishi wote wa Baali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלְתָּחָה
  choice: chumba cha mavazi
  rationale: Nomino hiyo inaonyesha mahali au idara ya kuhifadhia mavazi. ‘Chumba cha mavazi’ ni Kiswahili cha kawaida na huepuka maana za baadaye za kidini zinazoweza kuambatana na istilahi kama ‘sakristia’.
- source_word: לַאֲשֶׁר עַל הַמֶּלְתָּחָה
  choice: yule aliyekuwa msimamizi wa chumba cha mavazi
  rationale: Muundo wa Kiebrania una maana ya mtu aliyekuwa na mamlaka juu ya mahali pa mavazi; ‘msimamizi’ huwasilisha wazi wajibu wake kwa Kiswahili cha sasa.
- source_word: הוֹצֵא
  choice: Toa
  rationale: Hii ni amri ya kitenzi יצא katika kausativi, ikimaanisha kuyatoa mavazi kutoka mahali yalipohifadhiwa.
- source_word: לְבוּשׁ / הַמַּלְבּוּשׁ
  choice: mavazi / mavazi hayo
  rationale: Nomino hizi hurejelea kwa ujumla vitu vinavyovaliwa. ‘Mavazi’ ni neno la asili, lenye hadhi, na linafaa kwa umoja wa kijumla wa Kiebrania.
- source_word: עֹבְדֵי הַבָּעַל
  choice: waabudu wote wa Baali
  rationale: Ingawa muundo huo unaweza kutafsiriwa kihalisi ‘watumishi wa Baali,’ katika muktadha wa ibada unamaanisha watu waliojitolea kumtumikia Baali katika ibada.
- source_word: וַיֹּצֵא לָהֶם הַמַּלְבּוּשׁ
  choice: Basi akawatolea mavazi hayo
  rationale: Kitenzi chenye kiambishi cha watendewa kinaonyesha kuwa aliwatolea wao mavazi; ‘hayo’ huakisi kibainishi cha Kiebrania na kurejelea mavazi yaliyoagizwa.
theological_decisions:
- issue: Maana ya עֹבְדֵי הַבָּעַל
  choice: waabudu wa Baali
  alternative: watumishi wa Baali
  rationale: ‘Waabudu’ hufanya maana ya kiibada iwe wazi katika muktadha huu, huku tanbihi ikihifadhi tafsiri halisi inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka simulizi kwa wakati uliopita, amri fupi ya moja kwa moja, na istilahi inayoeleweka ya mahali pa kuhifadhia mavazi.
