  text: The time that Jehu reigned over Israel was twenty-eight years in Samaria.
translation:
  language: sw
  text: Muda ambao Yehu alitawala Israeli akiwa Samaria ulikuwa miaka ishirini na minane.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים
  choice: Muda
  rationale: Ingawa maana ya moja kwa moja ni “siku,” hapa neno hilo ni nahau inayoonyesha kipindi chote cha utawala; “muda” ni Kiswahili cha kawaida na sahihi katika muhtasari huu wa kifalme.
- source_word: אֲשֶׁר
  choice: ambao
  rationale: Kiwakilishi hiki cha uhusiano kinaunganisha “muda” na utawala wa Yehu kwa mtiririko wa kawaida wa Kiswahili.
- source_word: מָלַךְ
  choice: alitawala
  rationale: Kitenzi hiki hapa kinamaanisha kutawala akiwa mfalme; “alitawala” ni cha asili katika Kiswahili na kinahifadhi maana ya kifalme katika muktadha.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Jina limeandikwa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: עַל יִשְׂרָאֵל
  choice: Israeli
  rationale: Pamoja na kitenzi “kutawala,” Kiswahili cha kawaida hakihitaji kihusishi kinacholingana moja kwa moja na עַל; Israeli ndio watu au ufalme uliotawaliwa.
- source_word: עֶשְׂרִים וּשְׁמֹנֶה שָׁנָה
  choice: miaka ishirini na minane
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kutaja muda wa miaka 28.
- source_word: בְּשֹׁמְרוֹן
  choice: akiwa Samaria
  rationale: Kirai hiki kinaonyesha Samaria kuwa makao ya kifalme ambako Yehu alitawala; “akiwa Samaria” huepuka dai lisilo la asili kwamba miaka yenyewe ilikuwa Samaria.
