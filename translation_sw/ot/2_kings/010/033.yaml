base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/033.yaml
  text: from the Jordan eastward[a], all the land of Gilead—the Gadites, the Reubenites, and the Manassites—from Aroer, which is by the Arnon Valley, even Gilead and Bashan.
translation:
  language: sw
  text: kutoka Yordani kuelekea mashariki, nchi yote ya Gileadi—ya Wagadi, Wareubeni na Wamanase—kuanzia Aroeri, iliyo kando ya Bonde la Arnoni,[a] pamoja na Gileadi na Bashani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyo kando ya Arnoni.” Neno la Kiebrania נַחַל linaweza kumaanisha bonde, kijito cha msimu, au mkondo wa maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיַּרְדֵּן מִזְרַח הַשֶּׁמֶשׁ
  choice: kutoka Yordani kuelekea mashariki
  rationale: Kirai cha Kiebrania kinataja Yordani kama mahali pa kuanzia na, kwa maneno halisi, upande wa kuchomoza kwa jua. Kiswahili cha kijiografia ‘kuelekea mashariki’ ni cha kawaida na sahihi.
- source_word: אֵת כָּל אֶרֶץ הַגִּלְעָד
  choice: nchi yote ya Gileadi
  rationale: אֵת huendeleza yambwa la kitenzi cha mstari uliotangulia, huku כָּל אֶרֶץ ikimaanisha eneo lote. ‘Nchi yote ya Gileadi’ ni ya asili na huhifadhi jina la eneo.
- source_word: הַגָּדִי וְהָרֻאובֵנִי וְהַמְנַשִּׁי
  choice: ya Wagadi, Wareubeni na Wamanase
  rationale: Majina haya ya kimakabila yanarejelea kwa pamoja watu wa makabila yaliyokaa katika eneo hilo. Kiunganishi ‘ya’ kinaonyesha kwamba nchi inayotajwa ni eneo lao.
- source_word: מֵעֲרֹעֵר
  choice: kuanzia Aroeri
  rationale: מִן huonyesha mpaka au sehemu ya kuanzia ya eneo; ‘kuanzia’ huwasilisha kazi hiyo wazi.
- source_word: אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: iliyo kando ya Bonde la Arnoni
  rationale: עַל hapa ni ya mahali, na נַחַל inaweza kumaanisha bonde, kijito cha msimu, au mkondo wake. ‘Bonde la Arnoni’ ni wazi katika maelezo ya kijiografia, huku tanbihi ikihifadhi upana wa neno la Kiebrania.
- source_word: וְהַגִּלְעָד וְהַבָּשָׁן
  choice: pamoja na Gileadi na Bashani
  rationale: ‘Pamoja na’ huhifadhi nguvu ya nyongeza ya וְ bila kulazimisha tafsiri ya kilele inayoweza kudokezwa na ‘hata’.
