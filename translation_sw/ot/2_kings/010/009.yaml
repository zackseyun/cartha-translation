base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/009.yaml
  text: And it happened in the morning that he went out and stood and said to all the people[a], “You are righteous. Look, I conspired against my master and killed him, but who struck down all these?”
translation:
  language: sw
  text: Asubuhi ilipofika, akatoka, akasimama, akasema kwa watu wote, “Ninyi hamna hatia.[a] Tazama, mimi nilifanya njama dhidi ya bwana wangu nikamuua; lakini ni nani aliyewaua hawa wote?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninyi ni wenye haki” au “Ninyi mko upande wa haki.” Neno la Kiebrania linaweza kumaanisha kuwa waadilifu au kutokuwa na hatia; hapa mazingira ya hadhara na ya kimahakama yanapendelea “hamna hatia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Asubuhi ilipofika
  rationale: Huwasilisha kwa Kiswahili cha kawaida na chenye hadhi fomula ya masimulizi ya Kiebrania, bila kulazimisha tafsiri isiyo ya kawaida kama ‘ikawa katika asubuhi.’
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: akatoka, akasimama
  rationale: Hudumisha mfuatano wa vitenzi na hali ya Yehu kusimama hadharani kabla ya kusema.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida kwa mkusanyiko mzima unaohutubiwa.
- source_word: צַדִּקִים אַתֶּם
  choice: Ninyi hamna hatia
  rationale: Katika mazingira haya ya hadhara na lawama kuhusu mauaji, kauli ina maana ya kutokuwa na hatia au lawama. Tanbihi huhifadhi maana mbadala ya kuwa wenye haki.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huhifadhi msisitizo wa kumwelekeza msikilizaji kwenye hoja inayofuata, kwa lugha yenye hadhi lakini inayoeleweka.
- source_word: קָשַׁרְתִּי עַל
  choice: nilifanya njama dhidi ya
  rationale: Kitenzi pamoja na kihusishi chake hueleza kupanga njama dhidi ya mtawala au mkuu.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Hapa humaanisha mkuu wa Yehu wa kibinadamu, si jina la Mungu; herufi ndogo husaidia kuonyesha hilo.
- source_word: וָאֶהְרְגֵהוּ
  choice: nikamuua
  rationale: Ni Kiswahili cha sasa, wazi na cha moja kwa moja kwa kitendo cha kumuua mtu huyo.
- source_word: וּמִי הִכָּה אֶת כָּל אֵלֶּה
  choice: lakini ni nani aliyewaua hawa wote?
  rationale: Kiunganishi kimetolewa kwa maana ya ulinganisho unaokusudiwa na swali la balagha. Ingawa נכה kimsingi ni kupiga, hapa muktadha wa vichwa vya waliouawa unahitaji maana ya kuwaua; ‘hawa wote’ hudumisha uwazi mdogo wa Kiebrania bila kuongeza ‘wanaume.’
theological_decisions:
- issue: Nguvu ya kauli צַדִּקִים אַתֶּם
  choice: Ninyi hamna hatia
  alternative: Ninyi ni wenye haki
  rationale: 'Kauli ya Yehu katika mazingira haya ina nguvu ya kimahakama na ya balagha: anawatenga wasikilizaji wake na lawama ya tendo lake huku akiwakabili kuhusu waliouawa. Tafsiri haidai kwamba wao ni waadilifu kabisa mbele za Mungu; maana pana imehifadhiwa katika tanbihi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa masimulizi umehifadhiwa kwa vitenzi vya -ka-, huku swali la mwisho likibaki la balagha na lenye nguvu.
