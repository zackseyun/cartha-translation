base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/027.yaml
  text: They tore down the pillar of Baal[a], and they tore down the house of Baal, and made it a latrine to this day.
translation:
  language: sw
  text: Wakaibomoa nguzo ya Baali, wakaibomoa nyumba ya Baali[a], wakaigeuza kuwa choo hadi leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “hekalu la Baali.” Kiebrania: “nyumba ya Baali.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּצוּ
  choice: wakaibomoa
  rationale: Kitenzi נתץ kinaonyesha kubomoa kwa nguvu jengo au kitu cha ibada. “Kubomoa” ni Kiswahili cha kawaida kinachofaa kwa nguzo na nyumba, na kurudiwa kwake kunahifadhi urudiaji wa Kiebrania.
- source_word: מַצְּבַת
  choice: nguzo
  rationale: מַצֵּבָה hapa ni jiwe lililosimamishwa au nguzo ya ibada. “Nguzo” ni wazi na fupi; uhusiano wake na Baali unaonyesha kazi yake ya kidini.
- source_word: הַבָּעַל
  choice: Baali
  rationale: Hili ni jina au cheo cha mungu wa Kanaani; “Baali” ni umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: בֵּית הַבַּעַל
  choice: nyumba ya Baali
  rationale: בַּיִת maana yake ya msingi ni “nyumba,” ingawa katika muktadha huu ni mahali pa ibada na inaweza kutafsiriwa “hekalu.” Tafsiri kuu inahifadhi usemi halisi wa Kiebrania, huku tanbihi ikitoa maana ya kimuktadha.
- source_word: וַיְשִׂמֻהוּ
  choice: wakaigeuza kuwa
  rationale: שׂוּם ikifuatwa na ל hapa ina maana ya kukifanya kitu kiwe na matumizi au hali nyingine. “Kuigeuza kuwa” ni ya kawaida na inaonyesha mabadiliko hayo wazi.
- source_word: למחראות
  choice: vyoo
  rationale: Nomino hii inarejelea mahali pa kujisaidia au vyoo. Wingi “vyoo” unafuata umbo la Kiebrania na unaeleza wazi kunajisiwa kwa mahali hapo bila kutumia lugha ya kizamani.
- source_word: עַד הַיּוֹם
  choice: hadi leo
  rationale: Huu ni usemi wa kawaida wa Kiebrania unaosema kwamba hali hiyo iliendelea mpaka wakati wa msimulizi. “Hadi leo” ni Kiswahili cha asili na sahihi.
theological_decisions:
- issue: Tafsiri ya neno la mahali pa ibada ya Baali
  choice: nyumba ya Baali
  alternative: hekalu la Baali
  rationale: “Nyumba” inahifadhi maana ya msingi ya בַּיִת bila kuficha kwamba katika muktadha inaweza kuwa hekalu; maana hiyo mbadala imetolewa katika tanbihi.
- issue: Tafsiri ya neno למחראות linaloonyesha kunajisiwa
  choice: vyoo
  alternative: mahali pa kujisaidia
  rationale: Andiko linasisitiza kuaibishwa na kunajisiwa kabisa kwa mahali pa ibada ya Baali. “Vyoo” ni neno la sasa, la moja kwa moja, na linahifadhi wingi wa neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi mfululizo na urudiaji wa “wakaibomoa” huhifadhi mwendo na msisitizo wa simulizi la Kiebrania.
