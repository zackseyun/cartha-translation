  text: וְ/עַתָּ֣ה כָל נְבִיאֵ֣י הַ/בַּ֡עַל כָּל עֹבְדָ֣י/ו וְ/כָל כֹּהֲנָי/ו֩ קִרְא֨וּ אֵלַ֜/י אִ֣ישׁ אַל יִפָּקֵ֗ד כִּי֩ זֶ֨בַח גָּד֥וֹל לִ/י֙ לַ/בַּ֔עַל כֹּ֥ל אֲשֶׁר יִפָּקֵ֖ד לֹ֣א יִֽחְיֶ֑ה וְ/יֵהוּא֙ עָשָׂ֣ה בְ/עָקְבָּ֔ה לְמַ֥עַן הַאֲבִ֖יד אֶת עֹבְדֵ֥י הַ/בָּֽעַל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/019.yaml
  text: Summon to me all the prophets of Baal[a], all his worshipers, and all his priests; let no man be missing, for I have a great sacrifice for Baal. Whoever is missing shall not live.” But Jehu did it in deceit[b], in order to destroy the worshipers of Baal.
translation:
  language: sw
  text: “Sasa, niitieni manabii wote wa Baali, waabudu wake wote na makuhani wake wote. Mtu hata mmoja asikose kuwapo, kwa maana nina dhabihu kubwa ya kumtolea Baali. Yeyote atakayekosekana hataishi.” Lakini Yehu alifanya hivyo kwa hila[a], ili kuwaangamiza waabudu wa Baali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa udanganyifu” au “kwa ujanja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Kiunganishi וְ pamoja na kielezi עַתָּה vinaonyesha mpito wenye msisitizo wa wakati; “Basi sasa” ni ya kawaida na haiondoi neno la wazi “sasa” katika Kiebrania.
- source_word: נְבִיאֵי הַבַּעַל
  choice: manabii wote wa Baali
  rationale: Muundo wa umilikaji unaonyesha manabii waliohusishwa na ibada ya Baali.
- source_word: עֹבְדָיו
  choice: waabudu wake wote
  rationale: Katika muktadha huu wa kidini, עבד inawahusu watu wanaomtumikia Baali kwa ibada; “waabudu” huonyesha maana hiyo wazi.
- source_word: כֹּהֲנָיו
  choice: makuhani wake wote
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa maofisa wa ibada, na kiambishi cha nafsi kinamrejelea Baali.
- source_word: קִרְאוּ אֵלַי
  choice: niitieni
  rationale: Amri ya wingi inataka watu hao waitwe waje mbele ya Yehu; “niitieni” ni fupi na ya asili katika Kiswahili.
- source_word: אִישׁ אַל יִפָּקֵד
  choice: Mtu hata mmoja asikose kuwapo
  rationale: Niphal ya פקד hapa humaanisha kukosekana katika mkusanyiko. “Mtu hata mmoja” huhifadhi msisitizo wa mtu mmoja mmoja kwa Kiswahili cha kawaida.
- source_word: זֶבַח גָּדוֹל לִי לַבַּעַל
  choice: nina dhabihu kubwa ya kumtolea Baali
  rationale: Huhifadhi dai la Yehu kwamba ana dhabihu kubwa kwa ajili ya Baali bila kubainisha aina ya sadaka zaidi ya chanzo.
- source_word: כֹּל אֲשֶׁר יִפָּקֵד לֹא יִחְיֶה
  choice: Yeyote atakayekosekana hataishi
  rationale: Hurudia maana ileile ya פקד na kuhifadhi tishio kali la “hataishi.”
- source_word: בְעָקְבָּה
  choice: kwa hila
  rationale: Neno hilo linaweza kuonyesha udanganyifu, ujanja au hila; “kwa hila” ni la asili na linaacha wigo huo wa maana wazi.
- source_word: לְמַעַן הַאֲבִיד
  choice: ili kuwaangamiza
  rationale: Muundo huu ni kishazi cha kusudi, na Hiphil ya אבד hapa inaonyesha kusababisha maangamizi.
theological_decisions:
- issue: Tathmini ya msimulizi kuhusu tendo la Yehu
  choice: Lakini Yehu alifanya hivyo kwa hila
  alternative: Yehu alitenda kwa udanganyifu / kwa ujanja
  rationale: Maelezo ya msimulizi yanaonyesha wazi kwamba wito wa Yehu ulikuwa mbinu ya kuwadanganya. Tafsiri haihalalishi tendo hilo wala kuondoa mvutano wa kimaadili.
- issue: Umoja wa kiume אִישׁ unaotumiwa kwa ujumla
  choice: Mtu hata mmoja asikose kuwapo
  alternative: Mwanamume hata mmoja asikose kuwapo
  rationale: Katika Kiswahili, “mtu hata mmoja” huwasilisha kwa asili matumizi ya uwakilishi ya אִישׁ na msisitizo kwamba hakuna hata mmoja anayepaswa kukosekana, bila kudai kwamba jinsia ndiyo hoja ya kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kauli ya moja kwa moja imetolewa kwa mtiririko wa kawaida, huku tishio na maoni ya msimulizi yakihifadhiwa kwa ukali wake.
