id: 2KI.10.1
reference: 2 Kings 10:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/לְ/אַחְאָ֛ב שִׁבְעִ֥ים בָּנִ֖ים בְּ/שֹׁמְר֑וֹן וַ/יִּכְתֹּב֩ יֵה֨וּא סְפָרִ֜ים וַ/יִּשְׁלַ֣ח שֹׁמְר֗וֹן אֶל שָׂרֵ֤י יִזְרְעֶאל֙ הַ/זְּקֵנִ֔ים וְ/אֶל הָ/אֹמְנִ֥ים אַחְאָ֖ב לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/001.yaml
  text: Ahab had seventy sons in Samaria[a]. And Jehu wrote letters and sent them to Samaria, to the rulers of Jezreel, the elders, and the guardians of Ahab's sons, saying[b],
translation:
  language: sw
  text: Ahabu alikuwa na wana sabini huko Samaria. Yehu akaandika barua na kuzituma Samaria kwa wakuu wa Yezreeli[a], wazee, na walezi wa wana wa Ahabu[b], akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wakuu wa Yezreeli.” Kwa kuwa barua hizo zinasemwa kuwa zilitumwa Samaria, wengine huona kuwa hawa walikuwa wakuu waliohusishwa na Yezreeli lakini waliokuwa wakiishi Samaria; baadhi ya tafsiri za kale na wafasiri wengine hupendelea “wakuu wa Samaria.” Maandishi makuu yanahifadhi maneno ya Kimasora.'
    reason: textual_variant
  - marker: b
    text: Au “wazazi walezi” au “watunzaji.” Neno la Kiebrania linawataja watu waliokuwa na jukumu la kuwalea au kuwasimamia wana wa Ahabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַחְאָב
  choice: Ahabu alikuwa na
  rationale: Muundo wa Kiebrania unaanzisha hali inayohusu Ahabu na unaonyesha kwamba alikuwa na wana; Kiswahili hiki ni cha kawaida bila kuongeza neno la wakati lisilokuwapo wazi katika chanzo.
- source_word: שִׁבְעִים בָּנִים
  choice: wana sabini
  rationale: בָּנִים humaanisha wana wa kiume, jambo muhimu katika muktadha wa ukoo wa kifalme.
- source_word: בְּשֹׁמְרוֹן
  choice: huko Samaria
  rationale: Kiambishi בְּ kinaonyesha mahali; “huko Samaria” hutaja kwa kawaida mahali walikokuwapo wana hao.
- source_word: וַיִּכְתֹּב ... סְפָרִים
  choice: akaandika barua
  rationale: סְפָרִים hapa ni mawasiliano yaliyoandikwa, kwa hiyo “barua” inafaa katika muktadha.
- source_word: וַיִּשְׁלַח שֹׁמְרוֹן
  choice: na kuzituma Samaria
  rationale: Kiwakilishi “-zi-” kinarejelea barua zilizotajwa, huku Samaria ikihifadhiwa kama mahali zilipotumwa.
- source_word: אֶל שָׂרֵי יִזְרְעֶאל
  choice: kwa wakuu wa Yezreeli
  rationale: שָׂרֵי humaanisha viongozi au maafisa wenye mamlaka. “Wakuu” ni neno la kawaida na pana; usomaji wa Kimasora “wa Yezreeli” umehifadhiwa licha ya ugumu wake wa kimuktadha.
- source_word: הַזְּקֵנִים
  choice: wazee
  rationale: Katika muktadha wa kiraia, neno hili linataja viongozi wanaotambuliwa wa jumuiya, si watu wenye umri mkubwa tu.
- source_word: הָאֹמְנִים אַחְאָב
  choice: walezi wa wana wa Ahabu
  rationale: הָאֹמְנִים ni watu waliokabidhiwa kuwalea au kuwasimamia wana wa kifalme. Kutaja “wana” wazi kunafanya uhusiano unaodokezwa na muktadha ueleweke kwa Kiswahili.
- source_word: לֵאמֹר
  choice: akisema,
  rationale: Neno hili linatanguliza yaliyomo katika ujumbe unaofuata.
