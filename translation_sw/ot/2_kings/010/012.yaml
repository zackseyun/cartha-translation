base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/012.yaml
  text: Then he arose and went and traveled to Samaria[a]. He was at Beth-eked of the shepherds on the way.
translation:
  language: sw
  text: Kisha Yehu akaondoka, akaenda, akasafiri kuelekea Samaria. Alikuwa katika Beth-ekedi ya wachungaji, njiani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Beth-ekedi huenda likawa na maana kama “nyumba ya kukusanyika”; katika tafsiri nyingine za jina hilo, huenda likahusishwa na mahali pa kukatia manyoya ya kondoo au pa kufungia. Kiebrania kinatendewa vyema zaidi hapa kama jina la mahali katika maandishi makuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: Katika masimulizi, kitenzi קום mara nyingi huonyesha kuanza kwa tendo linalofuata au kuondoka. “Akaondoka” ni Kiswahili cha kawaida na kinachofaa katika mfuatano huu.
- source_word: וַיָּבֹא וַיֵּלֶךְ שֹׁמְרוֹן
  choice: akaelekea Samaria
  rationale: Mfuatano wa vitenzi vya mwendo unaonyesha safari kuelekea Samaria. “Akaelekea” huepuka urudiaji usio wa kawaida katika Kiswahili bila kupoteza mwelekeo wa safari.
- source_word: הוּא ... בַּדָּרֶךְ
  choice: Alikuwa njiani
  rationale: Kiwakilishi huru הוּא pamoja na kishazi cha mahali kinaeleweka hapa kama maelezo ya mahali alipokuwa katika safari.
- source_word: בֵּית עֵקֶד
  choice: Beth-ekedi
  rationale: Maneno haya yanafanya kazi kama jina la mahali. Jina limetoholewa badala ya kutafsiriwa kwa sababu maana kamili ya עֵקֶד katika jina hili haina uhakika.
- source_word: הָרֹעִים
  choice: ya Wachungaji
  rationale: רֹעִים humaanisha moja kwa moja “wachungaji” au “wafugaji.” “Wachungaji” linahifadhi maana ya kawaida na sehemu ya jina la mahali.
- source_word: בַּדָּרֶךְ
  choice: njiani
  rationale: Neno hili linaonyesha kwamba Beth-ekedi ilikuwa kwenye njia aliyokuwa akisafiria Yehu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Jina “Yehu” limetajwa wazi ili kuepuka utata wa kiwakilishi katika mstari unaosimama peke yake. Muundo wenye vitenzi vingi vya mwendo umewekwa katika Kiswahili cha kawaida, huku Beth-ekedi likihifadhiwa kama jina la mahali.
