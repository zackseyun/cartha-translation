review_pass:
  verdict: revise
  source_fidelity: Draft faithfully conveys Yahweh's commendation of Jehu's action toward Ahab's house and the four-generation dynastic promise. The Hebrew royal idiom is more directly represented by ‘watakalia kiti cha enzi’ than by ‘wataketi kwenye kiti cha enzi.’
  naturalness: The draft is generally clear Standard East African Swahili. Adding ‘kwa’ in ‘umefanya vyema kwa kutenda’ produces a more natural construction, and ‘watakalia kiti cha enzi’ is the established Swahili royal expression.
  terminology: ‘Yahwe,’ ‘nyumba ya Ahabu,’ ‘machoni pangu,’ ‘moyoni mwangu,’ and ‘kiti cha enzi cha Israeli’ are appropriate and preserve the Hebrew imagery and register. The footnote should avoid presenting an overly simplified wording as strictly literal.
  issues:
  - severity: low
    issue: Royal enthronement idiom
    rationale: ‘Wataketi kwenye kiti cha enzi’ is understandable, but ‘watakalia kiti cha enzi’ is more idiomatic in formal biblical Swahili and directly conveys sitting upon a throne.
  - severity: low
    issue: Infinitive construction
    rationale: ‘Umefanya vyema kutenda’ is possible but somewhat compressed; ‘umefanya vyema kwa kutenda’ is smoother while preserving the infinitival sense.
  - severity: low
    issue: Footnote's literal gloss
    rationale: בני רבעים is an idiomatic and compressed Hebrew expression. ‘Wana wa nne’ is not a sufficiently transparent literal gloss in Swahili; identifying it as an idiom and giving ‘wana wa kizazi cha nne’ better informs readers without overstating the form.
  revised_text: Yahwe akamwambia Yehu, “Kwa kuwa umefanya vyema kwa kutenda yaliyo sawa machoni pangu, na umeitendea nyumba ya Ahabu sawasawa na yote yaliyokuwa moyoni mwangu, wana wako hadi kizazi cha nne[a] watakalia kiti cha enzi cha Israeli.”
