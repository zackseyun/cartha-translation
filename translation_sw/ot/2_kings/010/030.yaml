  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יֵה֗וּא יַ֤עַן אֲשֶׁר הֱטִיבֹ֨תָ֙ לַ/עֲשׂ֤וֹת הַ/יָּשָׁר֙ בְּ/עֵינַ֔/י כְּ/כֹל֙ אֲשֶׁ֣ר בִּ/לְבָבִ֔/י עָשִׂ֖יתָ לְ/בֵ֣ית אַחְאָ֑ב בְּנֵ֣י רְבִעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֥א יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/030.yaml
  text: And Yahweh said to Jehu[a], “Because you have done well in carrying out what is right in my eyes, and have done to the house of Ahab according to all that was in my heart, your sons to the fourth generation shall sit on the throne of Israel.”
translation:
  language: sw
  text: Yahwe akamwambia Yehu, “Kwa kuwa umefanya vyema kwa kutenda yaliyo sawa machoni pangu, na umeitendea nyumba ya Ahabu sawasawa na yote yaliyokuwa moyoni mwangu, wana wako hadi kizazi cha nne[a] watakalia kiti cha enzi cha Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa kizazi cha nne”; ni nahau inayomaanisha ukoo wa kifalme wa vizazi vinne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatamka jina la agano la Mungu kwa umbo la Kiswahili linalosomeka kwa urahisi, badala ya kulibadilisha kuwa cheo.
- source_word: יַעַן אֲשֶׁר
  choice: Kwa kuwa
  rationale: Kiunganishi hiki kinaonyesha sababu ya tamko la Mungu kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: הֱטִיבֹתָ לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: umefanya vyema kutenda yaliyo sawa machoni pangu
  rationale: Kinahifadhi pongezi iliyo wazi katika kitenzi pamoja na nahau ya Kiebrania ya kupima jambo kuwa sawa machoni pa Mungu.
- source_word: כְּכֹל אֲשֶׁר בִּלְבָבִי
  choice: sawasawa na yote yaliyokuwa moyoni mwangu
  rationale: Kinahifadhi sitiari ya moyo, ambayo hapa inaweza kumaanisha kusudi au mapenzi ya ndani, bila kuifafanua kupita kiasi.
- source_word: עָשִׂיתָ לְבֵית אַחְאָב
  choice: umeitendea nyumba ya Ahabu
  rationale: ‘Kuitendea’ kinadumisha upana wa usemi wa chanzo bila kuongeza moja kwa moja maneno kama ‘kuangamiza’; ‘nyumba’ inadumisha maana ya ukoo wa kifalme katika muktadha.
- source_word: בְּנֵי רְבִעִים
  choice: wana wako hadi kizazi cha nne
  rationale: Ni tafsiri ya nahau inayoonyesha mfululizo wa kifalme wa vizazi vinne huku ikidumisha neno ‘wana’ la chanzo.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: wataketi kwenye kiti cha enzi cha Israeli
  rationale: Inahifadhi taswira ya kifalme ya kuketi kwenye kiti cha enzi; uhusiano wa dynastia unaeleweka tayari kupitia ‘wana wako’.
theological_decisions:
- issue: Kibali cha Mungu kwa matendo ya Yehu
  choice: Tamko linaonyesha wazi kwamba Mungu aliidhinisha utekelezaji wa hukumu dhidi ya nyumba ya Ahabu, bila kulipanua kuwa kibali kwa mwenendo wote wa Yehu.
  alternative: Kupunguza nguvu ya pongezi ili kuepuka kuonekana kuidhinisha matendo yote ya Yehu, au kuipanua kuwa kibali kamili kwa utawala wake wote.
  rationale: Kiebrania kinapongeza jambo maalumu alilofanyia nyumba ya Ahabu. Tafsiri inadumisha upeo huo na mvutano wa kiteolojia bila kuongeza maelezo yasiyomo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa wasomaji wa kawaida huku nahau kuu za Kiebrania—‘machoni pangu,’ ‘moyoni mwangu,’ na ‘kiti cha enzi’—zikihifadhiwa.
