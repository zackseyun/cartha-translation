reference: Numbers 13:33
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/שָׁ֣ם רָאִ֗ינוּ אֶת הַ/נְּפִילִ֛ים בְּנֵ֥י עֲנָ֖ק מִן הַ/נְּפִלִ֑ים וַ/נְּהִ֤י בְ/עֵינֵ֨י/נוּ֙ כַּֽ/חֲגָבִ֔ים וְ/כֵ֥ן הָיִ֖ינוּ בְּ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/033.yaml
  text: And there we saw the Nephilim—the sons of Anak[a], from the Nephilim—and we seemed in our own eyes like grasshoppers, and so we were in their eyes.
translation:
  language: sw
  text: Na huko tuliwaona Wanefili[a]—wana wa Anaki, waliotokana na Wanefili—nasi tulijiona kama panzi, nao pia walituona hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya kimapokeo, “majitu.” Maana ya neno la Kiebrania haijulikani kwa uhakika, kwa hiyo limetoholewa katika maandishi makuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִילִים
  choice: Wanefili
  rationale: Jina hili la Kiebrania lina maana na rejeleo lisilo hakika; limetoholewa badala ya kufasiriwa kuwa “majitu” au “walioanguka.” Kiambishi Wa- kinalifanya lisomeke kwa kawaida kama jina la kundi la watu katika Kiswahili.
- source_word: בְּנֵי עֲנָק
  choice: wana wa Anaki
  rationale: Huhifadhi usemi wa ukoo wa Kiebrania kwa lugha ya Kiswahili yenye hadhi na inayoeleweka; katika muktadha, “wana” inaweza kumaanisha wazao.
- source_word: מִן הַנְּפִלִים
  choice: waliotokana na Wanefili
  rationale: Huwasilisha kwa kawaida wazo la asili au nasaba linalowezekana katika מן, bila kufafanua zaidi uhusiano huo.
- source_word: וַנְּהִי בְעֵינֵינוּ
  choice: nasi tulijiona
  rationale: Nahau hiyo inaeleza mtazamo wao wenyewe, si mabadiliko halisi ya hali; “tulijiona” ni Kiswahili cha kawaida kinachobeba maana hiyo.
- source_word: כַּחֲגָבִים
  choice: kama panzi
  rationale: “Panzi” linafaa kwa picha ya wadudu wadogo ikilinganishwa na watu wakubwa, na ni neno la kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: וְכֵן הָיִינוּ בְעֵינֵיהֶם
  choice: nao pia walituona hivyo
  rationale: Huhifadhi ulinganifu kati ya jinsi wapelelezi walivyojiona na jinsi walivyodai kuonekana na wale wengine, kwa Kiswahili cha asili.
theological_decisions:
- issue: Tafsiri ya נְפִילִים
  choice: Wanefili
  alternative: majitu; walioanguka
  rationale: Neno hili linalopatikana pia katika Mwanzo 6:4 lina utambulisho unaobishaniwa. Kulitohoa kunahifadhi kutokuwa na uhakika kwa maandishi ya Kiebrania bila kuingiza tafsiri fulani ya kitheolojia au ya kimapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa kawaida kwa wasomaji wengi huku ukihifadhi urudiaji wa “Wanefili” na dai la kimtazamo lililo katika Kiebrania.
