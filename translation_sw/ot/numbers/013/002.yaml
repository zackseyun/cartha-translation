source:
  edition: WLC
  text: שְׁלַח לְ/ךָ֣ אֲנָשִׁ֗ים וְ/יָתֻ֨רוּ֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל אִ֣ישׁ אֶחָד֩ אִ֨ישׁ אֶחָ֜ד לְ/מַטֵּ֤ה אֲבֹתָי/ו֙ תִּשְׁלָ֔חוּ כֹּ֖ל נָשִׂ֥יא בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/002.yaml
  text: Send for yourself men[a], and let them scout out the land of Canaan, which I am giving to the sons of Israel. You shall send one man from each tribe of his fathers[c][b], every one a leader among them.
translation:
  language: sw
  text: Tuma wanaume kwa ajili yako, nao waipeleleze[a] nchi ya Kanaani, ninayowapa wana wa Israeli.[b] Mtatuma mtu mmoja kutoka kila kabila la mababu zao, kila mmoja akiwa kiongozi[c] miongoni mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waichunguze” au “wafanye upelelezi wa nchi.”
    reason: Neno la Kiebrania תור linaweza kueleza kuchunguza, kupeleleza, au kufanya upelelezi wa nchi.
  - marker: b
    text: Kwa Kiebrania, “wana wa Israeli,” nahau ya kawaida ya kifamilia na ya agano inayowataja watu wa Israeli kwa jumla.
    reason: Ufafanuzi huu huzuia msomaji kuelewa nahau hiyo kana kwamba inawahusu wanaume pekee.
  - marker: c
    text: Au “mkuu”; neno la Kiebrania linaweza kumaanisha kiongozi, mkuu wa kabila, au mwenye cheo kikuu.
    reason: Neno נָשִׂיא lina upeo wa maana ambao “kiongozi” pekee hauonyeshi kikamilifu.
lexical_decisions:
- source_word: שְׁלַח לְךָ
  choice: Tuma kwa ajili yako
  rationale: Kitenzi cha amri שְׁלַח kimetafsiriwa “Tuma,” na לְךָ imehifadhiwa kwa “kwa ajili yako” ili kutofuta msisitizo au maana yake inayoweza kuwa ya ruhusa, uwakilishi, au kuhusika kwa Musa mwenyewe.
- source_word: אֲנָשִׁים
  choice: wanaume
  rationale: Katika muktadha huu neno hili linamaanisha wawakilishi wa kiume waliochaguliwa kutoka makabila, hivyo “wanaume” ni sahihi kuliko neno lisilobainisha jinsia.
- source_word: וְיָתֻרוּ
  choice: nao waipeleleze
  rationale: תור hapa ni kuichunguza au kuipeleleza nchi kwa kusudi la kupata habari. “Waipeleleze” linafaa kwa shughuli ya upelelezi bila kulazimisha maana hasi ya ujasusi.
- source_word: אֶרֶץ כְּנַעַן
  choice: nchi ya Kanaani
  rationale: Muundo wa Kiebrania unaonyesha nchi inayojulikana kwa jina Kanaani; Kiswahili cha kawaida na wazi ni “nchi ya Kanaani.”
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: ninayowapa
  rationale: Kauli endelevu נֹתֵן inaonyesha utoaji wa Mungu unaoendelea au ulio karibu kutimizwa; “ninayowapa” huhifadhi hali hiyo.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii huhifadhi nahau ya kifamilia na ya agano ya Kiebrania badala ya kuibadilisha tu kuwa jina la taifa, huku ikirejelea watu wa Israeli kwa jumla.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: mtu mmoja kutoka katika kila
  rationale: 'Urudiaji wa Kiebrania una nguvu ya kugawa: mtu mmoja kwa kila kabila. Kiswahili hiki kinawasilisha nguvu hiyo kwa njia ya asili.'
- source_word: לְמַטֵּה אֲבֹתָיו
  choice: kutoka katika kila kabila la baba zake
  rationale: מַטֶּה hapa ni “kabila,” na אֲבֹתָיו hudokeza ukoo wa mababu wa upande wa baba; muundo huu huhifadhi lugha ya nasaba ya chanzo.
- source_word: תִּשְׁלָחוּ
  choice: Mtatuma
  rationale: Hii ni kauli ya maagizo yenye nafsi ya pili wingi, tofauti na amri ya umoja mwanzoni; “Mtatuma” huhifadhi mabadiliko hayo ya idadi.
- source_word: כֹּל נָשִׂיא בָהֶם
  choice: kila mmoja akiwa kiongozi miongoni mwao
  rationale: נָשִׂיא linaweza kumaanisha kiongozi, mkuu, au mwana wa kifalme. “Kiongozi” ni neno la sasa na wazi linaloonyesha hadhi yao inayotambuliwa katika makabila.
theological_decisions:
- issue: Maana ya לְךָ katika amri ya Mungu
  choice: Imehifadhiwa katika matini kama “kwa ajili yako.”
  alternative: Kuiacha bila tafsiri kama chembe ya kinahau, au kutafsiri “kwa niaba yako.”
  rationale: Kuhifadhi kirai hiki huacha wazi mvutano wa matini kuhusu kama kinaonyesha ruhusa, msisitizo, au kuhusika binafsi kwa Musa, badala ya kuamua tafsiri moja kimyakimya.
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: “Wana wa Israeli” huhifadhi umbo la kifamilia na la agano la Kiebrania. Katika muktadha huu ni jina la pamoja la watu wote wa Israeli, si wanaume pekee.
- issue: Mabadiliko kutoka amri ya umoja kwenda maagizo ya wingi
  choice: “Tuma” kisha “Mtatuma”
  alternative: Kusawazisha zote ziwe amri kwa Musa katika umoja
  rationale: Kiebrania hubadili kutoka nafsi ya pili umoja שְׁלַח kwenda nafsi ya pili wingi תִּשְׁלָחוּ. Tafsiri imehifadhi mabadiliko hayo bila kuamua kimyakimya anayehusishwa na wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. “Waipeleleze” linaonyesha shughuli ya kukusanya habari; “wana wa Israeli” linahifadhi nahau ya chanzo; na mabadiliko ya “Tuma” hadi “Mtatuma” yanatunza tofauti ya umoja na wingi iliyopo katika Kiebrania.
