lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: kutoka kabila la
  rationale: Katika orodha hii, לְ pamoja na מַטֶּה huonyesha kabila analotoka au kuliwakilisha mtu aliyetajwa. ‘Kutoka kabila la’ ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: זְבוּלֻן
  choice: Zabuloni
  rationale: Jina la kabila limetoholewa kwa umbo linalotambulika na lililozoeleka katika Kiswahili cha Biblia.
- source_word: גַּדִּיאֵל
  choice: Gadieli
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya Kiebrania na muundo wa kawaida wa majina katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ndio usemi mfupi na wa kawaida wa Kiswahili unaowasilisha uhusiano wa ukoo katika orodha ya majina.
- source_word: סוֹדִי
  choice: Sodi
  rationale: Jina la mtu limetoholewa moja kwa moja, bila kutafsiri maana inayoweza kuhusishwa nalo.
