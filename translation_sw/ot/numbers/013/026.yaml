base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/026.yaml
  text: They went and came to Moses and Aaron and to all the congregation of the sons of Israel in the wilderness of Paran[a], at Kadesh. They brought back word to them and to all the congregation, and showed them the fruit of the land.
translation:
  language: sw
  text: Wakaenda, wakafika kwa Musa na Haruni, na kwa kusanyiko lote la wana wa Israeli[a] katika nyika ya Parani, huko Kadeshi. Wakawapa Musa na Haruni, pamoja na kusanyiko lote, habari, wakawaonyesha matunda ya nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusanyiko lote la Waisraeli.” Kiebrania kihalisi ni “kusanyiko lote la wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: Wakaenda, wakafika
  rationale: Inahifadhi mfuatano wa vitenzi viwili vya simulizi—kwenda na kisha kufika—kwa Kiswahili cha kawaida.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: kusanyiko lote la wana wa Israeli
  rationale: Neno 'kusanyiko' linawakilisha עֵדָה, na 'wana wa Israeli' linahifadhi kwa karibu muundo wa Kiebrania בְּנֵי יִשְׂרָאֵל bila kuufanya kuwa dhehebu maalumu.
- source_word: מִדְבַּר פָּארָן
  choice: nyika ya Parani
  rationale: '''Nyika'' ni neno la kawaida na linalofaa kwa מִדְבָּר katika simulizi za safari za Israeli.'
- source_word: קָדֵשָׁה
  choice: huko Kadeshi
  rationale: Kiambishi cha mwelekeo/mahali katika Kiebrania kinaelekeza Kadeshi; katika muktadha huu Kiswahili hutaja kwa kawaida mahali walipofikia kwa kusema 'huko Kadeshi.'
- source_word: וַיָּשִׁיבוּ אוֹתָם דָּבָר
  choice: Wakawapa habari
  rationale: '''Habari'' linawasilisha דָּבָר katika maana ya taarifa waliyoleta baada ya upelelezi; muundo huu ni wa asili kuliko tafsiri ya neno kwa neno ya ''kurudisha neno.'''
- source_word: וְאֶת כָּל הָעֵדָה
  choice: wao pamoja na kusanyiko lote
  rationale: Kiunganishi 'pamoja na' kinaonyesha kwamba Musa na Haruni, pamoja na kusanyiko lote, ndio waliopokea habari hiyo.
- source_word: וַיַּרְאוּם
  choice: wakawaonyesha
  rationale: Hifili ya ראה hapa ina maana ya kuwafanya waone, yaani kuwaonyesha.
- source_word: פְּרִי הָאָרֶץ
  choice: matunda ya nchi
  rationale: Tafsiri hii inahifadhi picha halisi ya mazao yaliyoletwa na kuonyeshwa, badala ya kutumia neno pana zaidi la 'mazao.'
