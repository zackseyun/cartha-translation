- source_word: לְ/מַטֵּה
  choice: kutoka kabila la
  rationale: Katika orodha hii, לְ pamoja na מַטֶּה huonyesha kabila analotoka au analoliwakilisha mtu; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: אֶפְרָיִם
  choice: Efraimu
  rationale: Jina la kabila limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: הוֹשֵׁעַ
  choice: Hoshea
  rationale: Unukuzi huu hutofautisha mtu huyu, ambaye baadaye anaitwa Yoshua katika Hesabu 13:16, na nabii Hosea.
- source_word: בִּן
  choice: mwana wa
  rationale: Huu ni usemi mfupi na wa kawaida wa Kiswahili kwa uhusiano wa kifamilia katika orodha.
- source_word: נוּן
  choice: Nuni
  rationale: Jina limetolewa kwa umbo la Kiswahili lililozoeleka katika tafsiri za Biblia.
