  text: עֲמָלֵ֥ק יוֹשֵׁ֖ב בְּ/אֶ֣רֶץ הַ/נֶּ֑גֶב וְ֠/הַֽ/חִתִּי וְ/הַ/יְבוּסִ֤י וְ/הָֽ/אֱמֹרִי֙ יוֹשֵׁ֣ב בָּ/הָ֔ר וְ/הַֽ/כְּנַעֲנִי֙ יֹשֵׁ֣ב עַל הַ/יָּ֔ם וְ/עַ֖ל יַ֥ד הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/029.yaml
  text: Amalek lives in the land of the Negev[a], and the Hittites, the Jebusites, and the Amorites live in the hill country[c][b], and the Canaanites live by the sea and along the Jordan.
translation:
  language: sw
  text: Waamaleki wanaishi katika nchi ya Negebu[a]; Wahiti, Wayebusi na Waamori wanaishi katika eneo la milima; nao Wakanaani wanaishi kando ya bahari na kandokando ya Mto Yordani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Negebu” pia linaweza kutafsiriwa “nchi ya kusini”; hapa huenda ni jina la eneo maalumu la kusini mwa Kanaani.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָלֵק
  choice: Waamaleki
  rationale: Jina hili la pamoja linarejelea watu wa Amaleki; umbo la Kiswahili la wingi linaeleza kwa kawaida kundi hilo la kikabila.
- source_word: יוֹשֵׁב / יֹשֵׁב
  choice: wanaishi
  rationale: Kitenzi kishirikishi cha Kiebrania kinaonyesha makao ya kudumu katika eneo fulani; “wanaishi” ni Kiswahili cha sasa na cha kawaida kinachohifadhi maana hiyo.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: katika nchi ya Negebu
  rationale: “Negebu” linahifadhi rejeo la eneo maalumu la kusini, huku “nchi ya” likiwakilisha אֶרֶץ kwa lugha ya kawaida.
- source_word: הַחִתִּי / הַיְבוּסִי / הָאֱמֹרִי / הַכְּנַעֲנִי
  choice: Wahiti / Wayebusi / Waamori / Wakanaani
  rationale: Ingawa majina ya Kiebrania yana umbo la umoja wa kijumla, hapa yanataja makundi ya watu; Kiswahili huyatoa kwa kawaida katika ngeli ya watu na umbo la wingi.
- source_word: בָּהָר
  choice: katika eneo la milima
  rationale: Katika muktadha huu הַר inataja ukanda wa milima, si lazima mlima mmoja; tafsiri hii ni ya kawaida na inafaa kijiografia.
- source_word: עַל הַיָּם
  choice: kando ya bahari
  rationale: Huhifadhi maana ya mahali karibu na bahari bila kuongeza ufafanuzi kwamba ni pwani fulani.
- source_word: עַל יַד הַיַּרְדֵּן
  choice: kandokando ya Mto Yordani
  rationale: Neno יָד, yaani “mkono,” limetumiwa hapa katika nahau ya mahali yenye maana ya upande au kando; “kandokando” linaonyesha eneo linaloenea pembezoni mwa mto.
