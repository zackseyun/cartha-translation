base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/021.yaml
  text: So they went up and spied out the land from the wilderness of Zin as far as Rehob[a], at Lebo-hamath.
translation:
  language: sw
  text: Basi wakapanda na kuipeleleza nchi, kutoka nyika ya Sini hadi Rehobu[a], kwenye maingilio ya Hamathi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi Rehobu, kwenye Lebo-Hamathi.” Maneno ya Kiebrania yanaweza kueleweka kama maelezo ya mahali pa kuingia Hamathi badala ya jina la mahali Lebo-Hamathi.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: wakapanda
  rationale: Kitenzi עלה kina maana ya kupanda au kwenda juu. “Wakapanda” ni cha asili katika simulizi la safari na kinahifadhi mwelekeo wa mwendo.
- source_word: וַיָּתֻרוּ
  choice: kuipeleleza
  rationale: Katika muktadha huu תור inahusu kuchunguza nchi kwa kusudi la kupata taarifa. “Kuipeleleza” linafaa kwa kazi ya wale waliotumwa na ni la kawaida katika Kiswahili.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika Hesabu 13 neno hili linarejelea nchi ya Kanaani iliyokuwa ikichunguzwa; “nchi” ni tafsiri fupi na sahihi.
- source_word: מִמִּדְבַּר צִן
  choice: kuanzia nyika ya Sini
  rationale: מִדְבָּר ni eneo kame lisilokaliwa kwa wingi. “Nyika” ni Kiswahili sanifu na cha kibiblia, huku “kuanzia” ikionyesha mwanzo wa eneo walilolipeleleza.
- source_word: עַד רְחֹב
  choice: hadi Rehobu
  rationale: עַד huonyesha mpaka wa safari au uchunguzi. “Hadi Rehobu” linaeleza wazi upeo huo wa kijiografia.
- source_word: לְבֹא חֲמָת
  choice: kwenye njia inayoelekea Hamathi
  rationale: Muundo wa Kiebrania unaweza kumaanisha mahali pa kuingilia Hamathi au kuelekea huko. Tafsiri hii ya kimaelezo ni ya asili kwa Kiswahili na haibuni jina la mahali lisilo na uhakika.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yameandikwa Sini, Rehobu, na Hamathi kwa maumbo yanayotamkika kwa urahisi katika Kiswahili. Utata wa kijiografia katika לְבֹא חֲמָת umehifadhiwa kwa tanbihi.
