translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Alama ya tanbihi imewekwa baada ya “wazao wa Anaki,” ambako lahaja ya kileksika inahusika.
