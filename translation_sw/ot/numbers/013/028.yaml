base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/028.yaml
  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
translation:
  language: sw
  text: Lakini watu wanaoishi katika nchi hiyo wana nguvu, nayo miji yenye maboma ni mikubwa sana; tena tuliwaona huko wazao wa Anaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wa Anaki.” Usemi wa Kiebrania unamaanisha watu waliotokana na Anaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
  choice: Lakini
  rationale: Kirai hiki kinaweka pingamizi kubwa dhidi ya taarifa nzuri ya nchi iliyotangulia. “Lakini” ni ya kawaida na huhifadhi nguvu ya utofautishaji.
- source_word: עַז
  choice: wana nguvu
  rationale: Hueleza uwezo na hali ya kutisha ya watu hao bila kuongeza wazo la ukali au uadui ambalo si lazima liwe katika neno lenyewe.
- source_word: הָעָם הַיֹּשֵׁב בָּאָרֶץ
  choice: watu wanaoishi katika nchi hiyo
  rationale: Muundo wa kishirikishi umetafsiriwa kwa kishazi tegemezi cha kawaida katika Kiswahili, huku “hiyo” ikirejelea nchi iliyokuwa imetajwa.
- source_word: וְהֶעָרִים בְּצֻרוֹת גְּדֹלֹת מְאֹד
  choice: nayo miji ina ngome na ni mikubwa sana
  rationale: “Ina ngome” huwasilisha ulinzi wa miji kwa lugha ya kawaida, na “mikubwa sana” huhifadhi ukubwa pamoja na msisitizo wa מְאֹד.
- source_word: וְגַם
  choice: tena
  rationale: Huongeza jambo jingine la kutisha katika taarifa yao kwa mtiririko wa kawaida wa Kiswahili.
- source_word: יְלִדֵי הָעֲנָק
  choice: wazao wa Anaki
  rationale: Kirai hiki cha nasaba kinamaanisha watu waliotokana na Anaki. “Wazao” ni wazi na cha kawaida kuliko tafsiri halisi “watoto” katika muktadha huu.
- source_word: רָאִינוּ שָׁם
  choice: tuliwaona huko
  rationale: Wakati uliopita unafaa kwa taarifa ya simulizi, na “huko” huhifadhi msisitizo wa mahali.
