base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/019.yaml
  text: And what is the land like in which he lives? Is it good or bad? And what are the cities like in which he lives? Are they in camps or in fortifications?[a]
translation:
  language: sw
  text: Nayo nchi hiyo ikoje, ambamo wanaishi? Je, ni nzuri au mbaya? Na miji ambamo wanaishi ikoje? Je, ni miji ya makambi au ya ngome?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika makambi ... katika maeneo yenye ngome.” Kiebrania kinatofautisha makambi na mahali palipoimarishwa kwa ngome.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה הָאָרֶץ
  choice: Nayo nchi ... ikoje?
  rationale: Muundo huu wa Kiswahili unauliza kwa kawaida kuhusu hali au sifa ya nchi, huku ukihifadhi maana pana ya swali la Kiebrania.
- source_word: אֲשֶׁר הוּא יֹשֵׁב בָּהּ
  choice: wanamoishi
  rationale: Ingawa Kiebrania kina umoja wa kiwakilishi, hapa umoja huo una maana ya pamoja, ukirejelea watu wanaokaa nchini; wingi ni wa kawaida na wazi katika Kiswahili.
- source_word: הֲטוֹבָה הִוא אִם רָעָה
  choice: Je, ni nzuri au mbaya?
  rationale: Huhifadhi tathmini pana ya Kiebrania bila kuibana maana iwe rutuba ya kilimo pekee.
- source_word: הֶעָרִים
  choice: miji
  rationale: Ni tafsiri ya kawaida ya neno hili na inafaa katika muktadha wa makazi yanayochunguzwa.
- source_word: הַבְּמַחֲנִים
  choice: katika kambi
  rationale: Neno la Kiebrania linaashiria kambi au makazi yasiyo na ulinzi wa ngome, likitofautishwa na maeneo yenye maboma.
- source_word: בְּמִבְצָרִים
  choice: katika ngome
  rationale: Huwakilisha maeneo yenye ulinzi au yaliyoimarishwa, na kudumisha tofauti ya kijeshi na kambi.
