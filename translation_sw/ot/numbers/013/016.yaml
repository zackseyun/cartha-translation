  yaml_path: translation/ot/numbers/013/016.yaml
  text: These are the names of the men whom Moses sent to scout out the land[c][b][a]. And Moses called Hoshea son of Nun Joshua.
translation:
  language: sw
  text: Haya ndiyo majina ya wanaume ambao Musa aliwatuma kuichunguza nchi.[a] Musa akamwita Hoshea[c] mwana wa Nuni kwa jina la Yoshua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupeleleza nchi.” Kitenzi cha Kiebrania kinaweza kumaanisha kuchunguza nchi au kufanya upelelezi ili kupata habari.
    reason: lexical_alternative
  - marker: b
    text: Hoshea ni umbo la awali la jina la Yoshua; hapa Musa anamwita kwa jina la Yoshua.
    reason: cultural_note
  - marker: c
    text: Jina Hoshea pia linaweza kuandikwa “Hosea.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Haya ndiyo majina
  rationale: Muundo huu wa Kiswahili unatambulisha kwa kawaida majina yaliyotajwa, huku ukihifadhi maana elekezi ya Kiebrania.
- source_word: הָאֲנָשִׁים
  choice: wanaume
  rationale: Katika muktadha huu neno linawahusu wajumbe wa kiume waliotajwa, hivyo “wanaume” ni sahihi kuliko neno la jumla “watu.”
- source_word: שָׁלַח
  choice: aliwatuma
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kitenzi katika simulizi; kiambishi “-wa-” kinarejelea wanaume hao.
- source_word: לָתוּר
  choice: kuichunguza
  rationale: Kitenzi kinamaanisha kwenda kuitazama na kuipima nchi kwa madhumuni ya kupata habari. “Kuichunguza” ni lugha ya sasa isiyoamua kupita kiasi kama kazi hiyo ilikuwa upelelezi wa siri.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: “Nchi” ni tafsiri ya kawaida na inayoeleweka katika muktadha wa Kanaani.
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Inabaki karibu na maana ya Kiebrania ya kuita au kumpa jina, bila kulazimisha “akambadilisha jina,” jambo ambalo halijasemwa moja kwa moja.
- source_word: הוֹשֵׁעַ
  choice: Hoshea
  rationale: Unukuzi huu unatofautisha umbo hili la jina na Yoshua na unaakisi konsonanti ya Kiebrania שׁ.
- source_word: בִּן נוּן
  choice: mwana wa Nuni
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa jina la baba; “Nuni” linafuata umbo linaloeleweka katika matumizi ya Biblia ya Kiswahili.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ndilo umbo la kawaida na linalotambulika la jina hili katika Kiswahili.
