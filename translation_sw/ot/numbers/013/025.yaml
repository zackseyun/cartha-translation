base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/025.yaml
  text: They returned from scouting out the land at the end of forty days[a].
translation:
  language: sw
  text: Walirudi kutoka kuichunguza nchi mwishoni mwa siku arobaini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kuipeleleza nchi” au “kutoka kuitembelea nchi ili kuichunguza.” Kitenzi cha Kiebrania hurejelea kuichunguza nchi katika misheni ya upelelezi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Walirudi
  rationale: Kitenzi cha Kiebrania kinaendeleza mfululizo wa simulizi. Kiswahili cha kawaida kinaweza kuwasilisha tukio hilo bila kutafsiri kiunganishi וַ־ kwa neno tofauti.
- source_word: מִתּוּר
  choice: baada ya kuipeleleza
  rationale: Muundo huu unaonyesha kurudi walipomaliza kuichunguza nchi katika safari ya upelelezi. ‘Kuipeleleza’ hudumisha wazo la uchunguzi wa kimakusudi bila kulazimisha maana hasi ya ujasusi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha huu אָרֶץ ni eneo mahususi walilotumwa kulichunguza; ‘nchi’ ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: מִקֵּץ
  choice: baada ya
  rationale: Kirai cha Kiebrania kinaashiria kufikia mwisho wa muda uliotajwa. ‘Baada ya ... kwa siku arobaini’ hutoa maana hiyo kwa Kiswahili cha asili.
- source_word: אַרְבָּעִים יוֹם
  choice: kwa siku arobaini
  rationale: Hiki ni kipimo cha muda cha siku arobaini; muundo huu ni wa kawaida katika Kiswahili.
