  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: sw
  text: Yahwe[a] akanena na Musa, akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH; pia huandikwa “Yahweh.”'
    reason: Huonyesha herufi za jina katika Kiebrania na tahajia nyingine inayotumiwa kwa kawaida.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akanena
  rationale: Kitenzi hiki kinaanzisha tukio linalofuata katika simulizi. “Akanena” ni lugha ya heshima inayoeleweka na pia hutofautisha דבר na אמר (“kusema”) inayofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa mwandiko wa Kiswahili kama “Yahwe,” badala ya kubadilishwa kuwa cheo kama “Bwana.”
- source_word: אֶל
  choice: na
  rationale: Katika muundo wa Kiswahili “kunena na mtu,” kihusishi “na” humtambulisha anayeelekezewa maneno kwa njia ya kawaida.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hili ni tamko la kawaida la Kiebrania linalotanguliza maneno yatakayofuata; “akisema” huhifadhi muundo huo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia moja kwa moja jina la Mungu יהוה. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa leo. “Akanena” limetumiwa ili kuhifadhi tofauti kati ya דבר na אמר bila kufanya sentensi kuwa ngumu.
