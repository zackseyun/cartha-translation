base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/023.yaml
  text: They came to the Valley of Eshcol[a], and from there they cut down a branch with a single cluster of grapes, and two of them carried it on a pole[b]; they also took some of the pomegranates and some of the figs.
translation:
  language: sw
  text: Wakafika katika Bonde la Eshkoli[a]. Huko wakakata tawi la mzabibu lenye kishada kimoja cha zabibu, na watu wawili wakakibeba kwa mti wa kubebea[b]. Pia walichukua baadhi ya makomamanga na baadhi ya tini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Korongo la Eshkoli” au “Kijito cha Eshkoli.” Neno la Kiebrania נַחַל linaweza kumaanisha korongo, bonde lenye mkondo wa maji wa msimu, au kijito.
    reason: lexical_alternative
  - marker: b
    text: Au “tawi la mzabibu lenye kishada kimoja cha zabibu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל אֶשְׁכֹּל
  choice: Bonde la Eshkoli
  rationale: נַחַל huweza kumaanisha bonde, korongo, au mkondo wa maji wa msimu. “Bonde” ni neno la kawaida na linaloeleweka kwa eneo hili la kijiografia; Eshkoli limetoholewa kama jina la mahali.
- source_word: זְמוֹרָה
  choice: tawi la mzabibu
  rationale: Neno hili humaanisha hasa tawi au chipukizi la mzabibu. Kutaja mzabibu waziwazi ni kwa asili katika Kiswahili na kunazuia tawi lisieleweke kuwa la mmea mwingine.
- source_word: אֶשְׁכּוֹל עֲנָבִים אֶחָד
  choice: kishada kimoja cha zabibu
  rationale: Huhifadhi maana ya idadi—kishada kimoja—kwa Kiswahili cha kawaida na sahihi.
- source_word: וַיִּשָּׂאֻהוּ
  choice: wakakibeba
  rationale: Kiambishi cha kitu kimoja kinarejelea kishada, ambacho ndicho kitu kinachosisitizwa kuwa kikubwa na kubebwa.
- source_word: בַמּוֹט
  choice: kwa mti
  rationale: מוֹט ni fito, mti, au nguzo ya kubebea. “Kwa mti” ni usemi wa kawaida wa Kiswahili kwa kifaa hicho, huku tanbihi ikieleza picha ya kukining'iniza.
- source_word: בִּשְׁנָיִם
  choice: watu wawili
  rationale: Kiebrania ni ‘kwa wawili.’ Muktadha unaonyesha kuwa wawili miongoni mwa wapelelezi ndio waliobeba; “watu wawili” huepuka kuongeza jinsia ambayo neno lenyewe halitaji hapa.
- source_word: וּמִן הָרִמֹּנִים וּמִן הַתְּאֵנִים
  choice: Pia walichukua baadhi ya makomamanga na baadhi ya tini
  rationale: Kitenzi ‘walichukua’ kinaeleweka kutoka kwa muktadha na kinawekwa wazi kwa Kiswahili fasaha; kurudia ‘baadhi ya’ huhifadhi ulinganifu wa Kiebrania.
