  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimegawanywa kwa mtiririko wa kawaida wa simulizi. “Makomamanga” limetumiwa kwa tunda la רִמּוֹן; “Eshkoli” limetoholewa kwa tahajia inayosomeka kwa Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
