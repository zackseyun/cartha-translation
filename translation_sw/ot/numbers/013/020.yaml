base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/020.yaml
  text: And whether the land is fertile or lean[a], whether there are trees in it or not. And be strong[b], and take some of the fruit of the land.” Now the days were the days of the first-ripe grapes.
translation:
  language: sw
  text: Na nchi hiyo ikoje—ina rutuba au haina rutuba, ina miti[a] au haina? Jikazeni, na mchukue baadhi ya matunda ya nchi hiyo.” Siku hizo zilikuwa siku za zabibu za kwanza kuiva.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “ina mbao au haina”; neno la Kiebrania linaweza kumaanisha “mti” au “mbao.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “siku hizo zilikuwa siku za zabibu za kwanza kuiva,” yaani, mwanzo wa msimu wa mavuno ya zabibu.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֵנָה ... רָזָה
  choice: ina rutuba au haina rutuba
  rationale: Maneno hayo kihalisi yanaonyesha nchi ‘nono’ dhidi ya ‘iliyokonda,’ lakini katika muktadha wa kilimo yanahusu ardhi yenye uzalishaji mwingi au mdogo. Kiswahili hiki ni cha kawaida na hakiongezi wazo la ukame ambalo halitajwi wazi.
- source_word: הֲיֵשׁ בָּהּ עֵץ אִם אַיִן
  choice: kama ina miti au haina
  rationale: עֵץ inaweza kumaanisha mti, miti, au mbao. ‘Miti’ ndiyo maana ya moja kwa moja katika uchunguzi wa hali ya nchi; uwezekano wa kumaanisha rasilimali ya mbao umehifadhiwa katika tanbihi.
- source_word: וְהִתְחַזַּקְתֶּם
  choice: Jikazeni
  rationale: Kitenzi hiki cha kujirejelea kinawahimiza wajitie nguvu na uthabiti kwa ajili ya kazi yao. ‘Jikazeni’ ni fupi, ya kawaida, na inatunza wazo la kujiimarisha bila kulifupisha kuwa hisia ya ujasiri peke yake.
- source_word: וּלְקַחְתֶּם מִפְּרִי הָאָרֶץ
  choice: mkachukue baadhi ya matunda ya nchi hiyo
  rationale: מִן hapa ina maana ya kuchukua sehemu kutoka katika mazao hayo. ‘Baadhi ya matunda’ ni ya asili katika Kiswahili na haiongezi wazi wazo la kuyarudisha, ingawa muktadha unalidokeza.
- source_word: וְהַיָּמִים יְמֵי בִּכּוּרֵי עֲנָבִים
  choice: Wakati huo ulikuwa wakati wa zabibu za kwanza kuiva
  rationale: Tafsiri hii inadumisha kwa kiasi urudiaji wa Kiebrania na kueleza kwamba ulikuwa mwanzo wa msimu ambapo zabibu zilikuwa zinaanza kuiva, bila kuingiza kwa lazima maana ya kiibada ya malimbuko.
