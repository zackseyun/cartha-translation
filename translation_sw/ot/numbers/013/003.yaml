lexical_decisions:
- source_word: וַיִּשְׁלַח אֹתָם מֹשֶׁה
  choice: Basi Mose akawatuma
  rationale: Kitenzi cha masimulizi kinaonyesha tendo lililofuata; “akawatuma” ni Kiswahili cha kawaida na sahihi, huku “Basi” ikiendeleza mtiririko wa simulizi.
- source_word: מִמִּדְבַּר פָּארָן
  choice: kutoka nyikani ya Parani
  rationale: מִדְבָּר ni eneo la pori lisilolimwa au jangwa; “nyikani” ni usemi wa kawaida wa kijiografia katika Kiswahili cha Biblia bila kulazimisha maana ya ukame mkali.
- source_word: עַל פִּי יְהוָה
  choice: kwa amri ya Yahwe
  rationale: Nahau hii, ambayo kihalisi hurejelea “kinywa,” hapa humaanisha kutenda kwa agizo au amri; tafsiri hii ni ya asili katika Kiswahili, na maana halisi imehifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa kama jina binafsi badala ya kubadilishwa kuwa cheo; “Yahwe” ni umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: כֻּלָּם אֲנָשִׁים
  choice: Wote walikuwa wanaume
  rationale: “Wote” huhifadhi msisitizo wa kundi zima, na “wanaume” huonyesha kwa usahihi kwamba wawakilishi waliotajwa ni wa kiume.
- source_word: רָאשֵׁי בְנֵי יִשְׂרָאֵל
  choice: viongozi wa wana wa Israeli
  rationale: רָאשֵׁי humaanisha wakuu au viongozi. “Viongozi” ni Kiswahili wazi na cha asili, huku “wana wa Israeli” kikihifadhi usemi wa kifamilia wa Klkiebrania.
- source_word: הֵמָּה
  choice: walikuwa
  rationale: Kiwakilishi cha msisitizo kinawakilishwa vya kutosha na “Wote” mwanzoni mwa sentensi, hivyo marudio yasiyo ya kawaida yanaepukwa.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Lugha ya kijinsia katika אֲנָשִׁים
  choice: wanaume
  alternative: watu
  rationale: Katika muktadha huu neno linawahusu wawakilishi wa kiume; “wanaume” huhifadhi taarifa hiyo badala ya kuifanya isiwe ya kijinsia.
- issue: Usemi רָאשֵׁי בְנֵי יִשְׂרָאֵל
  choice: viongozi wa wana wa Israeli
  alternative: wakuu wa Waisraeli
  rationale: Chaguo kuu linadumisha kwa kiasi usemi halisi wa kifamilia “wana wa Israeli,” lakini linatafsiri “vichwa” kwa maana yake ya kiutendaji, “viongozi,” ili Kiswahili kiwe wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kwa msomaji wa kawaida, huku tanbihi zikihifadhi nahau halisi ya Kiebrania na chaguo mbadala la usemi wa uongozi.
