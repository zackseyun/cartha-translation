base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/003.yaml
  text: So Moses sent them from the wilderness of Paran at the command of Yahweh[a]. All of them were men[b], heads of the sons of Israel.
translation:
  language: sw
  text: Musa akawatuma kutoka katika jangwa la Parani kwa amri ya Yahwe[a]. Wote hao walikuwa wanaume, wakuu wa wana wa Israeli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na neno la Yahwe.” Nahau ya Kiebrania kwa maana halisi ni “juu ya kinywa cha Yahwe.”
