  text: But the men who had gone up with him said[a], “We are not able to go up against the people[b], because they are stronger than we are.”
translation:
  language: sw
  text: Lakini wale wanaume waliokuwa wamepanda pamoja naye wakasema, “Hatuwezi kupanda dhidi ya watu hao[a], kwa sababu wana nguvu kuliko sisi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kupanda kwenda kwa watu hao”; katika muktadha huu usemi huo una maana ya kupanda dhidi yao katika mapambano.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania hutumia umoja: “watu ... ni mwenye nguvu kuliko sisi.” “Watu” ni nomino ya kijumla, hivyo Kiswahili hutumia wingi: “wana nguvu kuliko sisi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Lakini wale watu
  rationale: Kiunganishi kinaonyesha tofauti kati ya kauli yao na kauli ya Kalebu katika mstari uliotangulia. “Wale watu” ni Kiswahili cha kawaida kinachowarejelea wanaume waliotumwa kuipeleleza nchi.
- source_word: אֲשֶׁר עָלוּ עִמּוֹ
  choice: waliokuwa wamepanda pamoja naye
  rationale: Kitenzi עָלוּ kina maana ya kupanda; umbo la wakati uliopita linabainisha tendo lililotangulia kusema kwao.
- source_word: אָמְרוּ
  choice: wakasema
  rationale: “Wakasema” linaendeleza mfululizo wa masimulizi kwa njia ya kawaida katika Kiswahili.
- source_word: לֹא נוּכַל
  choice: Hatuwezi
  rationale: Linawasilisha moja kwa moja maana ya kutokuwa na uwezo.
- source_word: לַעֲלוֹת אֶל הָעָם
  choice: kupanda kwenda kupigana na watu hao
  rationale: “Kupanda” huhifadhi maana ya msingi ya עלה, huku “kwenda kupigana na” ikieleza kwa Kiswahili cha kawaida nguvu ya kijeshi ya אֶל katika muktadha huu.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatanguliza sababu ya madai yao.
- source_word: חָזָק הוּא מִמֶּנּוּ
  choice: wana nguvu kuliko sisi
  rationale: Kauli hii huhifadhi ulinganisho wa Kiebrania. Kiswahili hutumia upatanisho wa wingi kwa “watu,” ingawa Kiebrania hutumia umoja kwa nomino hiyo ya kijumla.
