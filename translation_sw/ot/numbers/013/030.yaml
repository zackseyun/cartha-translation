  text: Then Caleb quieted the people before Moses and said[a], “Let us surely go up and take possession of it[c][b], for we are certainly able to do it.”
translation:
  language: sw
  text: Ndipo Kalebu akawatuliza watu mbele ya Musa[a], akasema, “Hakika, na tupande[b] tukaimiliki nchi hiyo, kwa maana tuna uwezo kabisa wa kuimiliki.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawanyamazisha watu mbele ya Musa.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwatuliza, kuwanyamazisha, au kuwafanya watulie.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kwa namna ya mkazo, “kupanda, na tupande.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa maana hakika tutaiweza.” Kiebrania kinatilia mkazo uwezo wao kuhusiana na nchi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַס
  choice: akawatuliza
  rationale: Kitenzi hiki humaanisha kuwafanya watu watulie au wanyamaze. “Akawatuliza” kinafaa kwa tukio hili bila kudokeza kwa lazima kwamba Kalebu aliwakandamiza kwa ukali.
- source_word: אֶת־הָעָם
  choice: watu
  rationale: עָם hapa ni jumuiya ya Waisraeli iliyokusanyika; “watu” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: אֶל־מֹשֶׁה
  choice: mbele ya Musa
  rationale: Ingawa אֶל kwa kawaida humaanisha “kwa” au “kuelekea,” katika muktadha huu inaeleza kitendo kilichofanyika mbele ya Musa au katika uwepo wake.
- source_word: עָלֹה נַעֲלֶה
  choice: Hakika na tupande
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unatilia mkazo kupanda. “Hakika na tupande” huhifadhi mwito na msisitizo huo bila kuongeza wazo lisilo wazi la “mara moja.”
- source_word: וְיָרַשְׁנוּ אֹתָהּ
  choice: tukaimiliki nchi hiyo
  rationale: Kitenzi יָרַשׁ katika muktadha wa Kanaani kinahusu kuitwaa na kuimiliki nchi. Kutaja “nchi hiyo” kwa uwazi kunafanya kiwakilishi cha kike cha Kiebrania kieleweke kwa kawaida katika Kiswahili.
- source_word: כִּי יָכוֹל נוּכַל
  choice: kwa maana tuna uwezo kabisa
  rationale: Muundo huu wa kusisitiza unaonyesha uhakika mkubwa wa Kalebu. “Tuna uwezo kabisa” ni Kiswahili cha asili kinachobeba msisitizo huo.
- source_word: לָהּ
  choice: wa kuimiliki
  rationale: Kiwakilishi cha kike kinarejelea nchi. Kirai hiki kinaunganisha uwezo wao na hatua iliyotajwa ya kuitwaa na kuimiliki, bila kulazimisha tafsiri kali zaidi ya “kuishinda.”
theological_decisions:
- issue: Kitu kinachorejelewa na viwakilishi vya kike אֹתָהּ na לָהּ
  choice: nchi hiyo / kuimiliki
  alternative: kufanya hivyo / kuishinda
  rationale: Kiebrania kinarejelea nchi kwa kiwakilishi cha kike. Tafsiri inaliweka wazi rejeo hilo na kulihusisha na kuitwaa nchi, huku ikiepuka kuongeza kwa lazima wazo mahususi la kuishinda kijeshi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Na tupande” huhifadhi mwito wa pamoja; “tuna uwezo kabisa” huwasilisha msisitizo wa Kiebrania kwa namna ya asili. Alama zote za tanbihi zimewekwa katika matini kuu kwa mpangilio [a], [b], [c].
