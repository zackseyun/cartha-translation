base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/017.yaml
  text: Moses sent them to scout out the land of Canaan[a], and he said to them, “Go up this way into the Negev[c][b], and go up into the hill country.”
translation:
  language: sw
  text: Musa akawatuma kuipeleleza nchi ya Kanaani[a], akawaambia, “Pandeni kwa njia hii kuelekea Negebu[b], kisha mpande kwenda nchi ya vilima[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuichunguza nchi ya Kanaani.”
    reason: lexical_alternative
  - marker: b
    text: Negebu ni eneo kame la kusini.
    reason: cultural_note
  - marker: c
    text: Au “milimani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akawatuma
  rationale: Kitenzi hiki katika mfululizo wa simulizi kinaeleza tendo la Musa la kuwatuma; “akawatuma” ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: לָתוּר
  choice: kuipeleleza
  rationale: Katika muktadha huu kinamaanisha kuichunguza nchi kwa kusafiri ndani yake. “Kuipeleleza” huhifadhi wazo la upelelezi bila kulazimisha maana ya siri iliyo katika “kujasusi.”
- source_word: אֶרֶץ כְּנָעַן
  choice: nchi ya Kanaani
  rationale: Huhifadhi muundo na jina la eneo la Kiebrania kwa Kiswahili cha kawaida cha Biblia.
- source_word: עֲלוּ זֶה
  choice: Pandeni kwa njia hii
  rationale: “Pandeni” huhifadhi maana ya kuelekea juu, na “kwa njia hii” huonyesha matumizi ya kielezi ya זֶה.
- source_word: בַּנֶּגֶב
  choice: kuingia Negebu
  rationale: Negebu ni jina la eneo la kusini lenye ukame; “kuingia” huwasilisha mwelekeo wa maagizo katika muktadha huu.
- source_word: וַעֲלִיתֶם
  choice: kisha mpande
  rationale: Ingawa umbo lake si amri ya moja kwa moja, linaendeleza maagizo yaliyotangulia; “kisha” huonyesha hatua inayofuata kwa Kiswahili cha asili.
- source_word: הָהָר
  choice: nchi ya vilima
  rationale: Katika muktadha huu neno hilo linaashiria eneo la miinuko, si lazima mlima mmoja; “nchi ya vilima” ni wazi na ya kawaida.
