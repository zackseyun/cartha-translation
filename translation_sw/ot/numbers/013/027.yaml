  text: They reported to him and said[a], “We came into the land to which you sent us. It truly flows with milk and honey, and this is its fruit.”
translation:
  language: sw
  text: Wakampa taarifa, wakasema, “Tuliingia katika nchi ambako ulitutuma. Kwa kweli, nchi hiyo inatiririka maziwa na asali,[a] na haya ndiyo matunda yake.”
  philosophy: optimal-equivalence
  footnotes:
