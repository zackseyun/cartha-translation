translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau “inatiririka maziwa na asali” imehifadhiwa kwa kuwa inaeleweka katika lugha ya Biblia na kuwasilisha picha ya chanzo. Alama ya tanbihi imewekwa mara tu baada ya kauli inayohusika.
