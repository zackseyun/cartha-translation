base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/032.yaml
  text: So they brought out to the sons of Israel a bad report about the land that they had explored, saying, “The land through which we passed to explore it is a land that devours its inhabitants, and all the people whom we saw in it are men of great size.”
translation:
  language: sw
  text: Basi wakawapa wana wa Israeli[c] habari mbaya kuhusu nchi waliyoichunguza,[a][b] wakisema, “Nchi tuliyopita ndani yake ili kuichunguza ni nchi inayowameza wakazi wake;[d] na watu wote tuliowaona humo ni watu wenye umbile kubwa.”[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakaeneza habari mbaya”; au, kwa maana kali zaidi, “waliisingizia nchi.”
    reason: lexical_alternative
  - marker: b
    text: Au “waliyopeleleza” au “waliyoitathmini.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania “wana wa Israeli”; jina la kawaida la kijumuiya la watu wa Israeli.
    reason: cultural_note
  - marker: d
    text: Au “nchi inayowateketeza wakazi wake.”
    reason: lexical_alternative
  - marker: e
    text: Au “watu wa kimo kikubwa”; hapa humaanisha ukubwa wa kimwili unaotia fora.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ דִּבַּת
  choice: wakawapelekea ... habari mbaya
  rationale: Muunganiko huu una maana ya kuleta au kueneza taarifa mbaya. Kiswahili hiki ni cha kawaida na hakiamui kwa lazima kwamba ilikuwa kashfa ya uongo, huku tanbihi ikihifadhi uwezekano huo wenye nguvu zaidi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: “Nchi” ni neno la kawaida na linalofaa kwa eneo lililoahidiwa katika simulizi hili.
- source_word: תָּרוּ / לָתוּר
  choice: waliyokuwa wameichunguza / kuichunguza
  rationale: Kitenzi hiki kinamaanisha kuchunguza au kupeleleza eneo. “Kuchunguza” ni wazi na hakiongezi lazima dhana ya ujasusi.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania “wana wa Israeli,” ambao hapa ni jina la kijumuiya la watu wa Israeli.
- source_word: עָבַרְנוּ בָהּ
  choice: tuliyopita ndani yake
  rationale: Huwakilisha mwendo wa kupita katika nchi hiyo kwa Kiswahili cha kawaida.
- source_word: אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  choice: nchi inayowameza wakazi wake
  rationale: “Inayowameza” huhifadhi picha kali na ya kutisha ya Kiebrania kuliko tafsiri hafifu kama “inayowaangamiza.”
- source_word: יוֹשְׁבֶיהָ
  choice: wakazi wake
  rationale: Ni tafsiri ya kawaida na sahihi ya wale wanaokaa nchini humo.
- source_word: אַנְשֵׁי מִדּוֹת
  choice: watu wenye maumbile makubwa
  rationale: Usemi huu unaelekea kueleza ukubwa wa kimwili. “Maumbile makubwa” huepuka kueleweka kama hadhi ya kijamii.
theological_decisions:
- issue: Usemi wa kijumuiya wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: Tafsiri inahifadhi umbo la chanzo, huku ikieleweka kuwa ni jina la kawaida la kijumuiya kwa taifa lote.
- issue: Kauli ya nchi “kuwameza” wakazi wake
  choice: imehifadhiwa kama sitiari ya wasemaji
  alternative: nchi inayowaangamiza wakazi wake
  rationale: Mstari unaripoti madai ya wapelelezi; tafsiri haipaswi kuyafafanua au kuyahalalisha kitheolojia, bali ihifadhi mvutano wa usemi wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Wana wa Israeli” huhifadhi usemi wa agano wa chanzo; “maumbile makubwa” huonyesha ukubwa wa mwili bila kudokeza hadhi ya kijamii.
