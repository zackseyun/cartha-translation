base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/022.yaml
  text: They went up into the Negev, and he came as far as Hebron. Ahiman, Sheshai, and Talmai, the descendants of Anak, were there. Hebron had been built seven years before Zoan of Egypt.
translation:
  language: sw
  text: Wakapanda katika Negebu, naye akafika mpaka Hebroni. Huko walikuwako Ahimani, Sheshai na Talmai, wazao wa Anaki. Hebroni ulikuwa umejengwa miaka saba kabla ya Soani ya Misri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַנֶּגֶב
  choice: kuelekea Negebu
  rationale: Neno hili hapa linataja eneo maalumu la kusini; kulihifadhi kama jina la mahali huepuka kulifanya tu kuwa 'kusini'.
- source_word: וַיָּבֹא
  choice: naye akafika
  rationale: Kitenzi kiko katika umoja ingawa sentensi inaanza na wingi. Tafsiri inadumisha badiliko hilo la idadi badala ya kulisawazisha kimya kimya.
- source_word: יְלִידֵי הָעֲנָק
  choice: wazao wa Anaki
  rationale: Kirai kinaonyesha watu waliotokana na Anaki; 'wazao' ni Kiswahili cha kawaida na chenye hadhi.
- source_word: נִבְנְתָה לִפְנֵי
  choice: ulikuwa umejengwa ... kabla ya
  rationale: Huonyesha kwamba kujengwa kwa Hebroni kulitangulia kujengwa kwa Soani kwa miaka saba.
theological_decisions:
- issue: Badiliko kutoka kiima cha wingi וַיַּעֲלוּ kwenda kitenzi cha umoja וַיָּבֹא
  choice: Wakapanda ... naye akafika
  alternative: Wakapanda ... wakafika
  rationale: Maandishi ya Kiebrania yana umoja katika kitenzi cha pili. Tafsiri inalinda utata huo wa rejea bila kumtaja mtu ambaye chanzo hakimwambui wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili; muundo wa umoja katika sehemu ya pili umehifadhiwa kwa makusudi.
