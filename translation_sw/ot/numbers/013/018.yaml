  text: See what the land is like[a], and whether the people who dwell in it are strong or weak[b], whether they are few or many.
translation:
  language: sw
  text: Tazameni nchi hiyo ilivyo[a], na watu wanaokaa humo, kama ni wenye nguvu au dhaifu, kama ni wachache au wengi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nchi hiyo ni nini.” Maana yake ni kuchunguza hali au sifa za nchi hiyo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Nanyi mtazame
  rationale: Kitenzi ראה hapa kina nguvu ya agizo katika muktadha wa maagizo ya Musa. “Mtazame” ni Kiswahili cha kawaida kinachodokeza kuchunguza, huku “nanyi” ikihifadhi kiunganishi וּ- na wingi wa nafsi ya pili.
- source_word: הָאָרֶץ מַה הִוא
  choice: nchi hiyo ilivyo
  rationale: Kauli hii inauliza hali au sifa za nchi, si utambulisho wake tu. “Nchi hiyo ilivyo” ni ya asili katika Kiswahili na hudumisha maana ya tathmini.
- source_word: הָעָם הַיֹּשֵׁב עָלֶיהָ
  choice: watu wanaokaa humo
  rationale: יֹשֵׁב pamoja na עַל kuhusu nchi humaanisha kuishi au kukaa katika nchi hiyo. “Humo” ni ya kawaida zaidi kwa wakazi kuliko tafsiri ya moja kwa moja “juu yake.”
- source_word: הֶחָזָק
  choice: wenye nguvu
  rationale: חזק hapa hueleza nguvu za watu katika tathmini inayoweza kuwa ya kijeshi. “Wenye nguvu” ni wazi na ya kawaida.
- source_word: הֲרָפֶה
  choice: dhaifu
  rationale: רפה ni kinyume cha חזק hapa na humaanisha kukosa nguvu. “Dhaifu” hudumisha utofautishaji huo kwa ufupi.
- source_word: הַמְעַט
  choice: wachache
  rationale: Neno hili linahusu idadi na linatofautishwa na רָב. “Wachache” ni sawa na upatanisho wa “watu.”
- source_word: רָב
  choice: wengi
  rationale: רָב hapa humaanisha kuwa wengi kwa idadi. “Wengi” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אִם
  choice: kama ... au
  rationale: 'Katika maswali yasiyo ya moja kwa moja yenye uchaguzi, “kama ... au” huwasilisha kwa asili jozi za Kiebrania: wenye nguvu au dhaifu, wachache au wengi.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unaendelea kama agizo la Musa kwa wapelelezi; msamiati ni rahisi kwa wasomaji wa kawaida. Alama ya tanbihi [a] imewekwa baada ya kifungu kinachoelezwa. Tanbihi ya Kiingereza [b] haikuhitajika kwa sababu “humo” tayari ni Kiswahili cha kawaida na haisababishi mvutano wa maana unaohitaji ufafanuzi.
