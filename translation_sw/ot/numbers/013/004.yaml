  text: 'And these were their names: from the tribe of Reuben, Shammua son of Zaccur.'
translation:
  language: sw
  text: 'Na haya ndiyo majina yao: kutoka kabila la Reubeni, Shamua mwana wa Zakuri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Na haya
  rationale: Kiunganishi וְ kimedumishwa kwa “Na” ili kuonyesha mwendelezo wa simulizi na orodha; אֵלֶּה limetafsiriwa kwa kiwakilishi cha karibu “haya,” kinachopatana na nomino ya ngeli ya majina.
- source_word: שְׁמוֹתָם
  choice: ndiyo majina yao
  rationale: Kiebrania kinasema kihalisi “majina yao.” Kiswahili cha kawaida huhitaji kishirikishi katika utangulizi huu, hivyo “ndiyo majina yao” ni wazi na chenye hadhi bila kubadili kazi ya kichwa cha orodha.
- source_word: לְ/מַטֵּה
  choice: kutoka kabila la
  rationale: Katika orodha hii, לְ pamoja na מַטֶּה huonyesha kabila ambalo mjumbe anatoka au analowakilisha. “Kutoka kabila la” ni usemi wa kawaida unaowasilisha uhusiano huo.
- source_word: רְאוּבֵן
  choice: Reubeni
  rationale: Jina la mtu na kabila limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: שַׁמּוּעַ
  choice: Shamua
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa maana yake.
- source_word: בֶּן
  choice: mwana wa
  rationale: Hii ndiyo tafsiri ya kawaida na sahihi ya uhusiano wa nasaba unaoonyeshwa na בֶּן.
- source_word: זַכּוּר
  choice: Zakuri
  rationale: Jina la mtu limetoholewa kwa umbo linalofaa mfumo wa sauti na tahajia ya Kiswahili.
