base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/024.yaml
  text: That place was called the Valley of Eshcol because of the cluster that the sons of Israel cut from there[a][b][c].
translation:
  language: sw
  text: Mahali pale paliitwa Bonde la Eshkoli[a] kwa sababu ya shada[b] ambalo wana wa Israeli[c] walikata kutoka huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wadi ya Eshkoli” au “Korongo la Eshkoli.” Neno la Kiebrania naḥal linaweza kumaanisha mkondo wa maji wa msimu au bonde linalohusiana nao.
    reason: lexical_alternative
  - marker: b
    text: Jina Eshkoli linafanana na neno la Kiebrania linalomaanisha “shada.” Mahali hapo palipewa jina kutokana na shada lililokatwa huko na wana wa Israeli.
    reason: cultural_note
  - marker: c
    text: Au “Waisraeli” au “watoto wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּקוֹם הַהוּא
  choice: Mahali pale
  rationale: Kauli hii inarejelea eneo lililotajwa katika mstari uliotangulia na inadumisha nguvu ya kiashirio cha Kiebrania kwa Kiswahili cha kawaida.
- source_word: קָרָא
  choice: paliitwa
  rationale: Ingawa kitenzi cha Kiebrania ni cha nafsi ya tatu umoja wa kiume, mtendaji hakutajwa na muundo huu hutumiwa kueleza kupewa jina. Kauli tendwa ni ya kawaida na wazi katika Kiswahili.
- source_word: נַחַל
  choice: Bonde
  rationale: Neno hili linaweza kumaanisha bonde, korongo, au mkondo wa maji wa msimu. “Bonde” ni tafsiri ya kijiografia inayoeleweka kwa urahisi, huku tanbihi ikihifadhi maana nyingine.
- source_word: אֶשְׁכּוֹל
  choice: Eshkoli
  rationale: Hapa neno hilo ni jina la mahali, kwa hiyo limetoholewa kama jina maalumu kwa muundo unaotamkika kwa urahisi katika Kiswahili.
- source_word: עַל אֹדוֹת
  choice: kwa sababu ya
  rationale: Kirai hiki kinaonyesha sababu ya eneo hilo kupewa jina; “kwa sababu ya” ni kauli ya sasa na ya kawaida.
- source_word: הָאֶשְׁכּוֹל
  choice: kishada
  rationale: Nomino hii humaanisha kishada au fungu. Muktadha wa mstari uliotangulia unaonyesha kuwa ni kishada cha zabibu, hivyo hakuna haja ya kuongeza “cha zabibu” katika mstari huu.
- source_word: אֲשֶׁר כָּרְתוּ
  choice: ambacho ... walikata
  rationale: Kitenzi כרת humaanisha kukata au kukata kutoka kwenye kitu; “walikata” kinafaa kwa kuvuna kishada.
- source_word: מִשָּׁם
  choice: kutoka huko
  rationale: Tafsiri hii inadumisha rejeleo la moja kwa moja kwa mahali pale bila kuongeza ufafanuzi usiokuwapo katika matini.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inadumisha taswira ya kifamilia ya Kiebrania na pia ni usemi wa Kiswahili unaoeleweka, badala ya kubadili moja kwa moja kuwa jina la kitaifa pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Hakuna fundisho kuu linalotegemea tofauti hii, lakini “wana wa Israeli” huhifadhi kwa karibu lugha ya kifamilia ya matini ya Kiebrania. “Waisraeli” ni laini zaidi, ila haionyeshi wazi taswira hiyo.
- issue: Mtendaji wa tendo la kuupa mahali jina
  choice: paliitwa
  alternative: aliita; mtu akaita
  rationale: Kiebrania kina umbo la kitenzi la nafsi ya tatu umoja wa kiume, lakini hakimtaji mtendaji. Kauli tendwa ya Kiswahili huhifadhi kutotajwa huko bila kumtambua mtendaji kwa kubahatisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. “Mahali pale paliitwa” ni muundo wa asili wa Kiswahili; “Bonde” linaeleweka zaidi kuliko istilahi ya kitaalamu “wadi.” Jina Eshkoli limetoholewa kwa tahajia inayofaa matamshi ya Kiswahili, na mchezo wa maneno wa Kiebrania umeelezwa katika tanbihi.
