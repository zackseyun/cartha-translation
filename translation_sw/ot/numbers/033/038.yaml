  text: וַ/יַּעַל֩ אַהֲרֹ֨ן הַ/כֹּהֵ֜ן אֶל הֹ֥ר הָ/הָ֛ר עַל פִּ֥י יְהוָ֖ה וַ/יָּ֣מָת שָׁ֑ם בִּ/שְׁנַ֣ת הָֽ/אַרְבָּעִ֗ים לְ/צֵ֤את בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִׁ֖י בְּ/אֶחָ֥ד לַ/חֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/038.yaml
  text: And Aaron the priest went up Mount Hor at the command of Yahweh[a], and he died there, in the fortieth year after the Israelites came out from the land of Egypt, in the fifth month, on the first day of the month.
translation:
  language: sw
  text: Naye Haruni, kuhani, akapanda Mlima Hori kwa amri ya Yahwe[a], akafa huko katika mwaka wa arobaini baada ya Waisraeli kutoka katika nchi ya Misri, katika mwezi wa tano, siku ya kwanza ya mwezi huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na neno la Yahwe”; kwa maana halisi, “juu ya kinywa cha Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה kina maana ya kwenda juu au kupanda; “akapanda” ni Kiswahili cha kawaida kinachohifadhi mwelekeo wa tendo.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Tafsiri ya moja kwa moja ya כהן, ikihifadhi cheo cha Haruni.
- source_word: אֶל הֹר הָהָר
  choice: Mlima Hori
  rationale: Ni jina la mahali linalojulikana kama Mount Hor; “Mlima Hori” linafuata muundo wa kawaida wa majina ya milima kwa Kiswahili.
- source_word: עַל פִּי יְהוָה
  choice: kwa amri ya Yahwe
  rationale: Nahau על פי, kwa maana halisi “juu ya kinywa cha,” hapa humaanisha kutenda kwa kufuata agizo au neno la Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: וַיָּמָת שָׁם
  choice: akafia huko
  rationale: “Akafia huko” ni usemi wa asili wa Kiswahili unaowasilisha kifo chake mahali hapo.
- source_word: בִּשְׁנַת הָאַרְבָּעִים
  choice: katika mwaka wa arobaini
  rationale: Huu ni uwasilishaji wa kawaida wa Kiswahili wa fomula ya tarehe ya Kiebrania.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: baada ya Waisraeli kutoka
  rationale: Infinitivu yenye ל huweka tukio la kutoka kama mwanzo wa kuhesabu miaka; “Waisraeli” hapa humaanisha taifa lote.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Huhifadhi nomino “nchi” na kutoa Kiswahili cha kawaida pamoja na kitenzi “kutoka.”
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: mwezi wa tano
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya usemi wa kalenda.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: siku ya kwanza ya mwezi huo
  rationale: Hufafanua kwa kawaida kwamba tarehe ilikuwa siku ya kwanza ya mwezi wa tano uliotajwa.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עַל פִּי יְהוָה
  choice: kwa amri ya Yahwe
  alternative: kulingana na neno la Yahwe; kwa maana halisi, juu ya kinywa cha Yahwe
  rationale: Muktadha unaonyesha utii kwa agizo la Mungu, lakini tanbihi huhifadhi picha halisi na uwezekano wa kutafsiri “neno.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa masimulizi umetolewa kwa viambishi vya mfululizo “aka-,” na tarehe imewekwa kwa lugha ya kawaida bila kupoteza vipengele vya Kiebrania.
