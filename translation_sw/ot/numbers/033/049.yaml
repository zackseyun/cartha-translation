base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/049.yaml
  text: And they camped by the Jordan[a], from Beth-jeshimoth as far as Abel-shittim, in the plains of Moab.
translation:
  language: sw
  text: Wakapiga kambi kando ya Yordani, kuanzia Beth-yeshimothi mpaka Abel-shitimu, katika nchi tambarare za Moabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika nyanda za Moabu.” Neno la Kiebrania linamaanisha eneo tambarare la steppe huko Moabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: Wakapiga kambi
  rationale: Kitenzi חנה katika mfululizo wa masimulizi kinaeleza hatua iliyofuata ya safari; “kupiga kambi” ni Kiswahili cha kawaida na cha asili.
- source_word: עַל הַיַּרְדֵּן
  choice: kando ya Yordani
  rationale: עַל ikitumiwa kuhusu mto huonyesha mahali karibu nao, si juu yake kihalisi; “kando ya” ni wazi na ya kawaida.
- source_word: מִבֵּית הַיְשִׁמֹת
  choice: kuanzia Beth-yeshimothi
  rationale: Kiambishi מִן kinaonyesha mwanzo wa eneo lililofikiwa na kambi. Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: עַד אָבֵל הַשִּׁטִּים
  choice: mpaka Abel-shitimu
  rationale: עַד huonyesha mwisho wa eneo; “mpaka” huwasilisha maana hiyo kwa ufupi na kwa kawaida.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: katika nchi tambarare za Moabu
  rationale: עֲרָבוֹת hurejelea eneo tambarare, kavu la nyika au uwanda wa Moabu; “nchi tambarare” ni wazi kwa wasomaji wa kawaida huku tanbihi ikihifadhi maana mbadala.
