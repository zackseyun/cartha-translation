translation:
  language: sw
  text: 'Ndipo itakuwa: kama nilivyokusudia kuwatendea wao, ndivyo nitakavyowatendea ninyi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: Ndipo itakuwa kwamba
  rationale: Nahau hii inaanzisha matokeo ya onyo lililotangulia; tafsiri hii huhifadhi maana ya wakati ujao na ya matokeo kwa Kiswahili cha sasa.
- source_word: כַּאֲשֶׁר
  choice: kama ... ndivyo
  rationale: Muundo huu wa ulinganisho ni wa kawaida katika Kiswahili na huhifadhi uwiano wa tendo lililokusudiwa kwa wao na litakalofanywa kwa Israeli.
- source_word: דִּמִּיתִי
  choice: nilivyokusudia
  rationale: Katika muktadha huu kitenzi kinaonyesha kusudi au azimio, si wazo la muda tu; “kusudia” huhifadhi nguvu ya onyo bila kuongeza maelezo.
- source_word: לַעֲשׂוֹת לָהֶם
  choice: kuwatendea wao
  rationale: “Kutendea” huwasilisha kwa kawaida tendo linaloelekezwa kwa watu, huku “wao” ikisisitiza kipashio cha ulinganisho kilicho katika Kiebrania.
- source_word: אֶעֱשֶׂה לָכֶם
  choice: nitakavyowatendea ninyi
  rationale: Kurudia “kutendea” huhifadhi ulinganifu mkali wa Kiebrania, na “ninyi” huonyesha wazi kundi linaloonywa.
theological_decisions:
- issue: Nguvu ya onyo la hukumu inayolingana
  choice: Kauli imehifadhiwa kama onyo la moja kwa moja kwamba Mungu atawatendea Israeli kama alivyokusudia kuwatendea wenyeji wa nchi.
  alternative: Kulieleza kama matokeo ya kawaida tu bila kusisitiza tendo la Mungu.
  rationale: Nafsi ya kwanza katika vitenzi vyote viwili humtaja Mungu kuwa mtendaji; tafsiri haififishi hilo wala kuongeza aina ya adhabu ambayo mstari wenyewe hauitaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo wa “kama ... ndivyo” unatiririka kiasili na kuhifadhi uwiano wa sentensi ya Kiebrania; hakuna tanbihi inayohitajika kwa kuwa hakuna tofauti ya maana inayostahili kuchapishwa hapa.
