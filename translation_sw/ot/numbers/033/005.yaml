lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: waliondoka
  rationale: Kitenzi נסע katika orodha ya safari humaanisha kung’oa kambi na kuanza safari kutoka mahali fulani. “Waliondoka” ni Kiswahili cha kawaida na kinafaa kwa muktadha huu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi kwa karibu muundo wa Kiebrania, ambao kihalisi ni “wana wa Israeli,” huku tanbihi ikieleza kuwa katika muktadha huu jina hilo linawarejelea Waisraeli kwa ujumla.
- source_word: מֵרַעְמְסֵס
  choice: Ramesesi
  rationale: Kiambishi מִן kinaonyesha mahali walikotoka. Jina la mahali limetoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה humaanisha kupiga kambi. Muundo wa “waka-” unaendeleza kwa kawaida mfuatano wa matukio katika simulizi la Kiswahili.
- source_word: בְּסֻכֹּת
  choice: Sukothi
  rationale: Kiambishi בְּ kinaonyesha mahali walipopiga kambi. Jina la mahali limetoholewa badala ya kutafsiriwa.
