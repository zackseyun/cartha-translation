translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, yenye hadhi, na ya kawaida kwa orodha ya vituo vya safari. Hakuna tanbihi iliyohitajika kwa sababu tofauti kati ya “walipiga kambi” na “walitua” si utata muhimu wa matini chanzi.
