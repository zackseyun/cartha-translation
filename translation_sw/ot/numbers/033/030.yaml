  text: They set out from Hashmonah and camped at Moseroth[a].
translation:
  language: sw
  text: Wakaondoka Hashmona, wakapiga kambi Moseroth.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika mfumo wa orodha ya safari jangwani, kitenzi נסע kinaonyesha kuondoka katika kituo kimoja ili kuendelea na safari. “Wakaondoka” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: מֵחַשְׁמֹנָה
  choice: Hashmona
  rationale: Kiambishi מֵ kina maana ya kutoka; katika Kiswahili, maana hiyo imejumuishwa ndani ya kitenzi “wakaondoka.” חַשְׁמֹנָה ni jina la mahali, hivyo limetoholewa kuwa “Hashmona” badala ya kutafsiriwa.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika taarifa za safari humaanisha kusimama na kuweka kambi. “Wakapiga kambi” ni usemi wa asili na unaoeleweka katika Kiswahili cha sasa.
- source_word: בְּמֹסֵרֹת
  choice: huko Moseroth
  rationale: Kiambishi בְ hapa kinaonyesha mahali waliposimama. “Huko” huonyesha kituo hicho kwa njia ya kawaida katika Kiswahili, na מֹסֵרֹת limetoholewa kama jina la mahali.
