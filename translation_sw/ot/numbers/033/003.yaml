  text: וַ/יִּסְע֤וּ מֵֽ/רַעְמְסֵס֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן בַּ/חֲמִשָּׁ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן מִֽ/מָּחֳרַ֣ת הַ/פֶּ֗סַח יָצְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/יָ֣ד רָמָ֔ה לְ/עֵינֵ֖י כָּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/003.yaml
  text: They set out from Rameses in the first month[a], on the fifteenth day of the first month[b]; on the day after the Passover the sons of Israel went out with a high hand before the eyes of all the Egyptians.
translation:
  language: sw
  text: Walisafiri kutoka Ramesesi katika mwezi wa kwanza, siku ya kumi na tano ya mwezi wa kwanza; siku iliyofuata Pasaka, wana wa Israeli[a] walitoka kwa mkono ulioinuliwa[b], mbele ya macho ya Wamisri wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kihalisi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: “Kwa mkono ulioinuliwa” ni nahau ya Kiebrania inayomaanisha kutoka waziwazi na kwa ujasiri, hadharani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Waliondoka
  rationale: Katika orodha ya vituo vya safari, kitenzi נסע humaanisha kuondoka mahali ili kuendelea na safari. “Waliondoka” ni cha kawaida na wazi katika Kiswahili.
- source_word: מֵרַעְמְסֵס
  choice: Ramesesi
  rationale: Jina la mahali limetoholewa kwa namna inayoendana na matumizi ya Kiswahili.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: katika mwezi wa kwanza
  rationale: Hii inawasilisha moja kwa moja maana ya kifungu cha wakati na kuhifadhi urudiaji wake katika maandishi ya Kiebrania.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הָרִאשׁוֹן
  choice: siku ya kumi na tano ya mwezi wa kwanza
  rationale: Huu ni usemi wa asili wa Kiswahili wa kutaja tarehe, huku ukifuata maana ya Kiebrania.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: Siku iliyofuata Pasaka
  rationale: מָחֳרַת ni siku inayofuata; tafsiri hii ni ya kawaida na inaendeleza rejeo la sikukuu ya Pasaka.
- source_word: יָצְאוּ
  choice: walitoka
  rationale: Kitenzi יצא kwa msingi humaanisha kutoka. Chaguo hili pia linahifadhi mwangwi wa tukio la kutoka Misri.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: 'Chaguo hili linahifadhi umbo halisi la Kiebrania, huku tanbihi ikionyesha maana ya pamoja iliyo ya kawaida zaidi: Waisraeli.'
- source_word: בְּיָד רָמָה
  choice: kwa mkono ulioinuliwa
  rationale: Tafsiri hii inahifadhi taswira halisi ya nahau ya Kiebrania bila kuifungia katika maana moja tu kama “kwa ujasiri,” “kwa ushindi,” au “kwa ukaidi.”
- source_word: לְעֵינֵי כָּל מִצְרָיִם
  choice: mbele ya macho ya Wamisri wote
  rationale: Inahifadhi taswira ya Kiebrania na kueleza kwamba kuondoka kwao kulionekana waziwazi na Wamisri.
theological_decisions:
- issue: Uwasilishaji wa בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Kiebrania kina usemi wa kiume wa pamoja, “wana wa Israeli.” Umeachwa katika maandishi makuu ili kuhifadhi umbo la chanzo, huku tanbihi ikitoa usemi wa kawaida wa Kiswahili.
- issue: Uwasilishaji wa nahau בְיָד רָמָה
  choice: kwa mkono ulioinuliwa
  alternative: kwa ujasiri / kwa ushindi / kwa ukaidi
  rationale: Nahau inaweza kudokeza kuondoka kwa ujasiri, hadharani, au kwa namna ya kukaidi. Kuhifadhi taswira ya mkono ulioinuliwa kunaepuka kuchagua kimya kimya dokezo moja pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Urudiaji wa “mwezi wa kwanza” umehifadhiwa kutoka Kiebrania, na nahau halisi imebaki katika maandishi huku maana yake ikifafanuliwa katika tanbihi.
