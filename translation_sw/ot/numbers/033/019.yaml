lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakasafiri
  rationale: Katika mtindo wa orodha ya vituo vya jangwani, kitenzi נסע humaanisha kuondoka kambini na kuendelea na safari. “Wakasafiri” ni Kiswahili cha kawaida kinachohifadhi wazo la mwendo bila kuongeza maelezo yasiyotajwa wazi.
- source_word: מֵרִתְמָה
  choice: kutoka Rithma
  rationale: Kiambishi מִן kinaonyesha mahali safari ilipoanzia, hivyo kimetafsiriwa “kutoka.” Jina la mahali limenukuliwa kwa umbo linalosomeka kwa Kiswahili.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה ni kitenzi cha kawaida katika orodha hii kwa kusimamisha au kuweka kambi. “Kupiga kambi” ni usemi wa asili na wa sasa katika Kiswahili.
- source_word: בְּרִמֹּן פָּרֶץ
  choice: huko Rimon-Peresi
  rationale: Kiambishi בְּ kinaonyesha mahali walipopiga kambi. “Huko” ni cha asili kwa kituo cha safari, na jina la sehemu mbili limenukuliwa kama jina moja lenye kistari.
