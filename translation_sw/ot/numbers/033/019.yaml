  text: They set out from Rithmah and camped at Rimmon-perez[a].
translation:
  language: sw
  text: Wakasafiri kutoka Rithma, wakapiga kambi Rimon-Peresi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakaondoka Rithma, wakapiga kambi Rimon-Peresi.”
