  yaml_path: translation/ot/numbers/033/050.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: sw
  text: 'Yahwe akanena na Musa katika nchi tambarare[a] za Moabu, kando ya Yordani upande wa Yeriko, akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika maeneo ya steppe ya Moabu.”
    reason: Neno עַרְבֹת linaweza kurejelea tambarare zilizo wazi au maeneo ya steppe.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akanena
  rationale: Kitenzi hiki kinaendeleza simulizi na kutofautisha tendo la kunena (דבר) na neno אמר linalofuata katika muundo wa ‘akisema.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: אֶל מֹשֶׁה
  choice: na Musa
  rationale: Katika Kiswahili, ‘kunena na Musa’ huonyesha kwa kawaida kwamba Musa ndiye anayeambiwa, bila kufanya sentensi kuwa nzito.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: katika nchi tambarare za Moabu
  rationale: ערבות hapa ni maeneo mapana ya tambarare au nyika; ‘nchi tambarare’ ni usemi wazi na wa kawaida wa kijiografia.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: kando ya Yordani karibu na Yeriko
  rationale: עַל katika maelezo haya ya mahali huonyesha eneo lililo kandokando ya Yordani, katika sehemu inayohusishwa na Yeriko.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi muundo wa Kiebrania unaotanguliza maneno ya Mungu yanayoanza katika mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa kisasa, wenye heshima na unaofaa usomaji wa Biblia. ‘Akanena’ hudumisha tofauti ya vitenzi vya Kiebrania bila kuleta urudiaji usio wa lazima.
