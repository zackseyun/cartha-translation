  yaml_path: translation/ot/numbers/033/010.yaml
  text: They set out from Elim and camped by the Red Sea[a].
translation:
  language: sw
  text: Wakaondoka Elimu, wakapiga kambi kando ya Bahari ya Shamu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bahari ya Matete.” Jina la Kiebrania Yam Sufu hutafsiriwa kwa desturi kuwa “Bahari ya Shamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika fomula ya vituo vya safari ya jangwani, נסע huonyesha kuondoka katika kituo kimoja kuelekea kingine. “Wakaondoka” ni Kiswahili cha kawaida na chenye kueleweka.
- source_word: מֵאֵילִם
  choice: Elimu
  rationale: Kiambishi מִן huonyesha mahali walikotoka, na אֵילִם ni jina la mahali; umbo la Kiswahili lililozoeleka ni “Elimu.”
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika orodha ya safari humaanisha kuweka au kupiga kambi. “Wakapiga kambi” ni usemi wa sasa na wa kawaida wa Kiswahili.
- source_word: עַל
  choice: kando ya
  rationale: Ingawa עַל mara nyingi humaanisha “juu ya,” katika muktadha wa kupiga kambi karibu na eneo la maji huonyesha kuwa kando yake.
- source_word: יַם סוּף
  choice: Bahari ya Shamu
  rationale: Hili ndilo jina la jadi lililozoeleka katika Kiswahili kwa Yam Suph. Maana mbadala inayowezekana, “Bahari ya Matete,” imehifadhiwa katika tanbihi.
