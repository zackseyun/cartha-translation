  text: Naye Aroni alikuwa na umri wa miaka mia moja ishirini na mitatu alipokufa juu ya Mlima Hori.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַהֲרֹן
  choice: Naye Aroni
  rationale: Kiunganishi ו kinaendeleza simulizi; “naye” ni muunganiko wa asili katika Kiswahili. Jina אַהֲרֹן limetolewa kwa umbo la Kiswahili lililozoeleka, “Aroni”.
- source_word: בֶּן שָׁלֹשׁ וְ/עֶשְׂרִים וּ/מְאַת שָׁנָה
  choice: alikuwa na umri wa miaka mia moja ishirini na mitatu
  rationale: Nahau ya Kiebrania בן + idadi + שנה huonyesha umri. Kiswahili cha kawaida hutumia “alikuwa na umri wa miaka ...”; jumla ya idadi ni 123.
- source_word: בְּ/מֹת/וֹ
  choice: alipokufa
  rationale: ב pamoja na nomino ya kitendo “kufa” na kiambishi cha nafsi ina maana ya wakati hapa, kwa hiyo “alipokufa” ni ya asili na sahihi.
- source_word: בְּ/הֹר הָ/הָר
  choice: juu ya Mlima Hori
  rationale: הֹר הָהָר ni jina la mahali, Mlima Hori. Kihusishi ב katika muktadha huu kinaonyesha kwamba kifo kilitokea juu ya mlima.
