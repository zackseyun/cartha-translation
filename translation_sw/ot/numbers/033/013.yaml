  text: Wakaondoka Dofka, wakapiga kambi Alushi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika mtindo wa orodha ya hatua za safari jangwani, kitenzi נסע humaanisha kuondoka mahali walipopiga kambi ili kuendelea na safari. “Wakaondoka” ni Kiswahili cha kawaida na cha asili.
- source_word: מִדָּפְקָה
  choice: Dofka
  rationale: Kiambishi מִן kinaonyesha chanzo, yaani kuondoka kutoka mahali fulani. Jina la mahali דָּפְקָה limetoholewa kwa mfumo unaofaa matamshi ya Kiswahili kuwa “Dofka.”
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika orodha za safari humaanisha kusimama na kuweka kambi. “Kupiga kambi” ni usemi wa kawaida na unaoeleweka katika Kiswahili cha sasa.
- source_word: בְּאָלוּשׁ
  choice: Alushi
  rationale: Kiambishi בְּ kinaonyesha mahali walipopiga kambi. Jina אָלוּשׁ limetoholewa kama “Alushi” ili muundo wake uweze kutamkwa kwa kawaida katika Kiswahili.
