base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/007.yaml
  text: They set out from Etham and turned back to Pi-hahiroth[a], which is opposite Baal-zephon, and camped before Migdol.
translation:
  language: sw
  text: Wakaondoka Ethamu, wakageuka kurudi[a] kuelekea Pi-Hahirothi, mahali palipo mkabala na Baal-Sefoni, wakapiga kambi mbele ya Migdoli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakarudi.” Kitenzi cha Kiebrania kinaweza kumaanisha kurudi au kugeuza mwelekeo; hapa huenda kinaeleza kubadilika kwa njia waliyofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika orodha za safari, נסע humaanisha kuvunja kambi na kuanza safari; “wakaondoka” ni Kiswahili cha kawaida kinachowasilisha hatua hiyo kwa ufupi.
- source_word: מֵאֵתָם
  choice: Ethamu
  rationale: Ni jina la mahali; limetoholewa kwa kufuata matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: וַיָּשָׁב
  choice: wakageuka kurudi
  rationale: שׁוב inaweza kumaanisha kurudi au kubadili mwelekeo. Kirai hiki kinahifadhi dhana zote mbili bila kudai kwamba walifika tena mahali walikokuwa hapo awali.
- source_word: עַל פִּי הַחִירֹת
  choice: kuelekea Pi-Hahirothi
  rationale: עַל pamoja na jina hili inaonyesha uelekeo au mahali walipoelekea katika simulizi la safari; “kuelekea” ni ya asili na haidai kwa nguvu zaidi ya Kiebrania kwamba hapo ndipo mwisho wa hatua ulikuwa.
- source_word: אֲשֶׁר עַל פְּנֵי בַּעַל צְפֹון
  choice: ulio mkabala na Baal-Sefoni
  rationale: עַל־פְּנֵי hapa inaonyesha uhusiano wa kijiografia, yaani kuwa mbele au upande unaokabiliana na mahali pengine; “mkabala na” ni wazi na ya kawaida.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: חנה humaanisha kukaa kambini; “kupiga kambi” ni usemi wa kawaida wa Kiswahili na huhifadhi tendo halisi.
- source_word: לִפְנֵי מִגְדֹּל
  choice: mbele ya Migdoli
  rationale: לִפְנֵי huonyesha mahali palipo mbele ya au panapokabiliana na Migdoli. Jina Migdoli limehifadhiwa kama jina la mahali badala ya kutafsiriwa “mnara.”
