lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika orodha ya safari za jangwani, kitenzi נסע humaanisha kuvunja kambi na kuendelea na safari. “Wakaondoka” ni Kiswahili cha kawaida na kinachofaa katika mtindo huu unaorudiwa.
- source_word: מִמֹּסֵרֹות
  choice: Moserothi
  rationale: Kiambishi מִן kimetolewa kwa maana ya kutoka, iliyo ndani ya muundo “wakaondoka Moserothi.” Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Waswahili badala ya kutafsiriwa.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Katika muktadha wa safari, חנה humaanisha kuweka au kupiga kambi. “Wakapiga kambi” ni usemi wa asili na wa sasa katika Kiswahili.
- source_word: בִּבְנֵי יַעֲקָן
  choice: Bene-Yaakani
  rationale: Ingawa maneno haya kihalisi ni “wana wa Yaakani,” hapa yanafanya kazi kama jina la mahali. Kwa hiyo jina limetoholewa, huku ב ikieleweka kwa kawaida kama mahali walipopiga kambi.
