  text: They set out from Moseroth and camped at Bene-jaakan[a].
translation:
  language: sw
  text: Wakaondoka kutoka Moserothi, wakapiga kambi Bene-Yaakani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, Bene-Yaakani kihalisi ni “wana wa Yaakani,” lakini hapa ni jina la mahali.
