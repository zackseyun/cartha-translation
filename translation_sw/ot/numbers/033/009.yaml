  text: וַ/יִּסְעוּ֙ מִ/מָּרָ֔ה וַ/יָּבֹ֖אוּ אֵילִ֑מָ/ה וּ֠/בְ/אֵילִם שְׁתֵּ֣ים עֶשְׂרֵ֞ה עֵינֹ֥ת מַ֛יִם וְ/שִׁבְעִ֥ים תְּמָרִ֖ים וַ/יַּחֲנוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/009.yaml
  text: They set out from Marah and came to Elim. At Elim there were twelve springs of water and seventy palm trees, and they camped there.
translation:
  language: sw
  text: Wakaondoka Mara, wakafika Elimu. Huko Elimu kulikuwa na chemchemi kumi na mbili za maji na mitende sabini, nao wakapiga kambi huko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika fomula ya orodha ya safari, kitenzi נסע humaanisha kuvunja kambi na kuendelea na safari; “wakaondoka” ni Kiswahili cha kawaida kinachoonyesha kuondoka mahali hapo.
- source_word: מִמָּרָה
  choice: Mara
  rationale: Ni jina la mahali; limetoholewa kwa tahajia inayosomeka kwa Kiswahili badala ya kutafsiriwa.
- source_word: וַיָּבֹאוּ
  choice: wakafika
  rationale: Kitenzi בוא hapa kinaonyesha kufika mwisho wa hatua ya safari; “wakafika” ni cha asili zaidi katika muktadha huu kuliko “wakaja.”
- source_word: אֵילִמָה / בְאֵילִם
  choice: Elimu / Huko Elimu
  rationale: Umbo la kwanza linaonyesha mwendo kuelekea mahali, na kishazi cha pili kinaonyesha mahali vitu vilipokuwa. Jina limetoholewa kama “Elimu,” huku “huko” likitoa uhusiano wa mahali kwa Kiswahili cha kawaida.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: kumi na mbili
  rationale: Namba ya jumla imetafsiriwa kwa muundo wa kawaida wa Kiswahili.
- source_word: עֵינֹת מַיִם
  choice: chemchemi kumi na mbili za maji
  rationale: עַיִן katika muktadha huu ni chanzo cha asili cha maji; “chemchemi za maji” ni sahihi na haidokezi visima vilivyochimbwa.
- source_word: וְשִׁבְעִים
  choice: na ... sabini
  rationale: Namba imetolewa moja kwa moja, ikiunganishwa na nomino inayofuata.
- source_word: תְּמָרִים
  choice: mitende
  rationale: Neno hilo humaanisha miti ya jamii ya mitende, huenda mitende ya tende; “mitende” huhifadhi upana wa neno bila kuongeza ubainisho usiotajwa wazi.
- source_word: וַיַּחֲנוּ שָׁם
  choice: nao wakapiga kambi huko
  rationale: חנה katika orodha za safari humaanisha kuweka kambi. “Kupiga kambi” ni usemi wa sasa na unaoeleweka kwa urahisi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi na mpangilio wa vitu katika Kiebrania umehifadhiwa bila kufanya sentensi kuwa ngumu.
