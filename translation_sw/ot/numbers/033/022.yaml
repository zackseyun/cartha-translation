  yaml_path: translation/ot/numbers/033/022.yaml
  text: They set out from Rissah and camped at Kehelathah.
translation:
  language: sw
  text: Wakaondoka Risa, wakapiga kambi Kehelatha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika mfumo wa orodha ya safari jangwani, kitenzi נסע kinaonyesha kuondoka katika kituo kimoja ili kuendelea na safari. “Wakaondoka” ni Kiswahili cha kawaida na cha wazi.
- source_word: מֵרִסָּה
  choice: Risa
  rationale: Jina la mahali רִסָּה limetoholewa kuwa “Risa.” Maana ya kihusishi מֵ־ tayari imebebwa na kitenzi “wakaondoka,” ambacho kwa kawaida kinaweza kufuatwa moja kwa moja na mahali pa kuondokea.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika muktadha huu kinamaanisha kusimama na kuweka makao ya muda. “Kupiga kambi” ni usemi wa sasa, wa kawaida na unaoeleweka vizuri.
- source_word: בִּקְהֵלָתָה
  choice: Kehelatha
  rationale: Jina la mahali קְהֵלָתָה limetoholewa kuwa “Kehelatha.” Mahali wanapopiga kambi panaeleweka moja kwa moja baada ya usemi “wakapiga kambi,” hivyo hakuna haja ya kuongeza kihusishi.
