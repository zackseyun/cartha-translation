lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika kauli za ratiba ya safari katika Hesabu, kitenzi נסע kinaonyesha kuondoka katika kituo kimoja cha kupiga kambi ili kuendelea na safari. “Wakaondoka” ni Kiswahili cha kawaida na huonyesha wazi hatua hiyo ya kuanza safari.
- source_word: מֵעִיִּים
  choice: Iimu
  rationale: Kiambishi מֵ kimetafsiriwa kwa maana ya kuondoka mahali, ambayo tayari imejumuishwa katika “wakaondoka.” Jina עִיִּים limenukuliwa kwa umbo la Kiswahili “Iimu,” bila kulitafsiri maana yake.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika taarifa za safari humaanisha kusimama na kuweka kambi. “Wakapiga kambi” ni usemi wa kawaida, wazi na wa sasa katika Kiswahili.
- source_word: בְּדִיבֹן גָּד
  choice: huko Diboni-Gadi
  rationale: Kihusishi בְּ mbele ya jina la mahali katika muktadha huu kinaonyesha mahali walipopiga kambi. “Huko” ni cha asili katika Kiswahili, na jina la mahali דִיבֹן גָּד limenukuliwa kama jina moja, “Diboni-Gadi.”
