base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/008.yaml
  text: They set out from before Hahiroth and passed through the midst of the sea into the wilderness[b][a], and they went a three-day journey in the wilderness of Etham and camped at Marah.
translation:
  language: sw
  text: Wakasafiri kutoka mbele ya Hahirothi[a], wakapita katikati ya bahari mpaka nyikani, kisha wakasafiri mwendo wa siku tatu[b] katika nyika ya Ethamu, wakapiga kambi huko Mara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka mbele ya Hahirothi.” Katika kitabu cha Kutoka mahali hapa kwa kawaida huitwa “Pi-Hahirothi”; lakini Hesabu 33:8 haina sehemu “Pi-,” kwa hiyo jina fupi limehifadhiwa bila kulinganishwa na lile la Kutoka.'
    reason: alternative_reading
  - marker: b
    text: 'Au: “wakasafiri kwa siku tatu katika nyika ya Ethamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakasafiri
  rationale: Katika orodha ya vituo vya safari, נסע humaanisha kuondoka mahali pa kupiga kambi na kuendelea na safari; “wakasafiri” ni Kiswahili cha kawaida kinachofaa muktadha huu.
- source_word: מִפְּנֵי הַחִירֹת
  choice: kutoka mbele ya Hahirothi
  rationale: Tafsiri hii inahifadhi מן + פנים na jina fupi החירת lililo katika mstari huu, bila kulilinganisha kimyakimya na Pi-Hahirothi katika Kutoka.
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: wakapita katikati ya bahari
  rationale: עבר pamoja na בתוך huonyesha kupita ndani au katikati ya bahari; usemi huu unahifadhi picha ya njia yao bila kuongeza maelezo yasiyomo.
- source_word: הַמִּדְבָּרָה
  choice: kuelekea nyikani
  rationale: He ya mwelekeo inaonyesha mwendo kuelekea nyika. “Kuelekea nyikani” huhifadhi mwelekeo huo bila kulazimisha maana ya ndani zaidi kuliko muundo wa Kiebrania.
- source_word: וַיֵּלְכוּ דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: wakasafiri mwendo wa siku tatu
  rationale: Muundo huu hutaja safari au mwendo unaopimwa kwa siku tatu. Tafsiri hii ni ya asili katika Kiswahili na huhifadhi wazo la umbali wa safari, badala ya kudai wazi kwamba walitembea kwa muda wa siku tatu kamili.
- source_word: בְּמִדְבַּר אֵתָם
  choice: katika nyika ya Ethamu
  rationale: Huu ni mnyororo wa uhusiano wenye jina la mahali; “nyika ya Ethamu” ni muundo wa kawaida wa Kiswahili.
- source_word: וַיַּחֲנוּ בְּמָרָה
  choice: wakapiga kambi huko Mara
  rationale: חנה katika orodha ya safari ni kupiga kambi; “huko Mara” linaonyesha kituo kilichotajwa kwa jina kwa Kiswahili cha kawaida.
