  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa masimulizi umehifadhiwa kwa vitenzi vya mfululizo vyenye “waka-”; majina ya mahali yametoholewa kwa maumbo Hahirothi, Ethamu, na Mara. Alama za tanbihi [a] na [b] zimewekwa mara moja katika matini kuu.
