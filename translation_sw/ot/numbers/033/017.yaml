lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika fomula ya ratiba ya jangwani, kitenzi נסע kinaonyesha kuondoka katika kituo kimoja kuelekea kingine; “wakaondoka” ni Kiswahili cha kawaida na sahihi.
- source_word: מִקִּבְרֹת הַתַּאֲוָה
  choice: Kibroth-hataava
  rationale: Ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa katika matini kuu; kiambishi מִן kimewakilishwa na muundo wa kuondoka mahali.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Katika muktadha wa safari, חנה humaanisha kuweka kambi; “kupiga kambi” ni usemi wa asili na unaoeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: בַּחֲצֵרֹת
  choice: Hazeroth
  rationale: Ni jina la mahali na limetoholewa; kihusishi ב katika taarifa hii ya safari kinaeleweka kwa kawaida kupitia muundo “wakapiga kambi Hazeroth.”
