lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika orodha ya vituo vya safari ya jangwani, kitenzi נסע kinaonyesha kuondoka katika kituo kimoja kuelekea kingine; “wakaondoka” ni Kiswahili cha kawaida na sahihi.
- source_word: מֵעַבְרֹנָה
  choice: Abrona
  rationale: Kiambishi מֵ kinaonyesha mahali walikotoka; katika Kiswahili, wazo hilo linaeleweka moja kwa moja baada ya “wakaondoka.” עַבְרֹנָה ni jina la mahali na limetoholewa kuwa “Abrona.”
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Katika muktadha wa vituo vya safari, חנה humaanisha kusimama na kuweka kambi; “kupiga kambi” ni usemi wa kawaida wa Kiswahili.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: huko Esion-geberi
  rationale: Kiambishi בְּ kinaonyesha mahali walipopiga kambi. עֶצְיוֹן גָּבֶר ni jina la mahali, limetoholewa kwa namna inayoeleweka kwa wasomaji wa Kiswahili; “huko” huonyesha wazi mahali panapolengwa.
