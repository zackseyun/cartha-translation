  yaml_path: translation/ot/numbers/033/053.yaml
  text: You shall take possession of the land and live in it, because I have given the land to you to possess it.
translation:
  language: sw
  text: Mtaimiliki nchi hiyo na mtakaa humo, kwa sababu nimewapa nchi hiyo ili muimiliki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili muirithi.” Kitenzi cha Kiebrania ירשׁ kinaweza kumaanisha pia kurithi, hasa katika muktadha wa ahadi ya Mungu kuhusu nchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: Mtaimiliki
  rationale: Kitenzi ירשׁ katika Hiphil kinaweza kuhusisha kuwanyang’anya wengine milki na kisha kuitwaa. Kwa kuwa yambwa hapa ni “nchi,” si wakazi wake, “mtaimiliki” linaeleza matokeo yanayokusudiwa kwa Kiswahili cha kawaida bila kudokeza kwamba nchi yenyewe ndiyo inayofukuzwa.
- source_word: הָאָרֶץ
  choice: nchi hiyo
  rationale: אֶרֶץ hapa ni eneo la nchi iliyoahidiwa. “Nchi hiyo” ni ya kawaida na huonyesha wazi eneo linalorejelewa.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: na kukaa humo
  rationale: ישׁב hapa humaanisha kuishi au kufanya makao mahali. “Kukaa humo” ni usemi wa asili unaoonyesha kuishi kwa kudumu katika nchi hiyo.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya amri; “kwa sababu” huhifadhi maana hiyo wazi katika Kiswahili cha sasa.
- source_word: לָכֶם נָתַתִּי
  choice: nimewapa
  rationale: Kauli timilifu ya Kiebrania inaonyesha tendo la Mungu la kutoa kama jambo lililotimizwa ambalo ndilo msingi wa amri. “Nimewapa” huhifadhi hali hiyo pamoja na walengwa walio katika wingi.
- source_word: לָרֶשֶׁת אֹתָהּ
  choice: ili muimiliki
  rationale: Muundo huu unaonyesha kusudi la kuitoa nchi. “Ili muimiliki” ni mfupi, wazi, na hudumisha maana ya kuipata na kuishikilia nchi kama milki.
theological_decisions:
- issue: Maana ya ירשׁ katika muktadha wa ahadi ya nchi
  choice: kumiliki
  alternative: kurithi; kuwanyang’anya wengine milki
  rationale: Muktadha wa karibu unasisitiza Israeli kuitwaa na kuishi katika nchi ambayo Mungu amewapa. Ingawa ירשׁ linaweza kuwa na maana ya kurithi, na katika Hiphil linaweza pia kusisitiza kuwanyang’anya waliomo, yambwa la kitenzi katika mstari huu ni nchi yenyewe. Kwa hiyo “kumiliki” linafaa katika matini kuu, huku “kurithi” likihifadhiwa katika tanbihi kama maana halali ya kimkataba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kukaa humo” ni cha kawaida na wazi kuliko usemi mzito zaidi, huku “nchi hiyo” ikizuia utata wa kiwakilishi.
