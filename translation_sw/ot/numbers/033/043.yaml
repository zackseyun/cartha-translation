  text: They set out from Punon and camped at Oboth.
translation:
  language: sw
  text: Wakaondoka Punoni, wakapiga kambi Obothi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika mtindo wa orodha ya safari jangwani, kitenzi נסע humaanisha kuondoka kambini na kuendelea na safari. “Wakaondoka” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: מִפּוּנֹן
  choice: Punoni
  rationale: Kiambishi מִן huonyesha mahali walikotoka. Katika Kiswahili, jina la mahali lenye umbo “Punoni” tayari huweza kufanya kazi ya kuonyesha walikotoka baada ya kitenzi “wakaondoka,” bila kuongeza “kutoka.” Jina limetoholewa kwa tahajia ya Kiswahili.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika taarifa za safari humaanisha kuweka au kupiga kambi. “Wakapiga kambi” ni usemi wa asili na unaoeleweka katika Kiswahili cha sasa.
- source_word: בְּאֹבֹת
  choice: Obothi
  rationale: Kiambishi בְּ huonyesha eneo la kambi. Baada ya “kupiga kambi,” Kiswahili hakihitaji kihusishi cha ziada. Jina limetoholewa kuwa “Obothi” kulingana na matamshi na tahajia ya Kiswahili.
