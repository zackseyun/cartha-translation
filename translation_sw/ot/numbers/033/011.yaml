base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/011.yaml
  text: They set out from the Red Sea and camped in the wilderness of Sin[a][b].
translation:
  language: sw
  text: Wakaondoka kutoka Bahari ya Shamu[a], wakapiga kambi katika nyika ya Sini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bahari ya Matete.” Jina la Kiebrania yam suf hutafsiriwa kimapokeo “Bahari ya Shamu,” lakini tafsiri yake ya karibu zaidi na maneno ya Kiebrania mara nyingi hueleweka kuwa “Bahari ya Matete.”
    reason: lexical_alternative
  - marker: b
    text: “Sini” ni jina la eneo la nyika; halimaanishi dhambi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika mtindo wa orodha ya safari wa Hesabu 33, kitenzi נסע kinaonyesha kuondoka mahali walipopiga kambi; “wakaondoka” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: מִיַּם סוּף
  choice: kutoka Bahari ya Shamu
  rationale: יַם־סוּף ni jina la kijiografia linalotafsiriwa kimapokeo kuwa “Bahari ya Shamu.” Maana halisi inayowezekana, “Bahari ya Matete,” imehifadhiwa katika tanbihi.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה humaanisha kuweka au kupiga kambi. “Wakapiga kambi” ni usemi wa asili katika Kiswahili cha sasa na unaendeleza mfuatano wa simulizi.
- source_word: בְּמִדְבַּר סִין
  choice: katika nyika ya Sini
  rationale: מִדְבָּר ni eneo kame lisilokaliwa sana, hivyo “nyika” linafaa katika muktadha huu. סִין ni jina la mahali na limetoholewa kuwa “Sini,” si kutafsiriwa kama dhana ya dhambi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “wakaondoka … wakapiga kambi” unadumisha mtindo wa orodha ya safari bila kuwa mzito; majina ya mahali yamewasilishwa kwa maumbo yanayotambulika katika Kiswahili.
