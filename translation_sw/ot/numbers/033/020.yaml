  text: Wakaondoka Rimoni-Perezi, wakapiga kambi Libna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakasafiri kutoka
  rationale: Kitenzi נסע katika orodha ya vituo vya safari kinaonyesha kuondoka mahali fulani na kuendelea na safari. “Wakasafiri kutoka” ni lugha ya kawaida ya Kiswahili na inafaa katika mtindo huu wa simulizi.
- source_word: מֵרִמֹּן פָּרֶץ
  choice: kutoka Rimon-Peresi
  rationale: מִן huonyesha mahali walipoondoka. Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili, huku sehemu zake mbili zikihifadhiwa kwa kistari.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: חנה katika muktadha huu humaanisha kusimama na kuweka kambi. “Kupiga kambi” ni usemi wa kawaida na wazi katika Kiswahili cha kisasa.
- source_word: בְּלִבְנָה
  choice: huko Libna
  rationale: בְּ hapa hutaja kituo walichoweka kambi. “Huko” huonyesha mahali bila kulazimisha maana finyu ya “ndani ya,” na Libna limetoholewa kama jina la mahali.
