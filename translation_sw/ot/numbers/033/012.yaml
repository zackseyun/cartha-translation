translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi unahifadhi mtindo wa orodha ya vituo vya safari, huku “wakaondoka” na “wakapiga kambi” zikitumia lugha ya kawaida.
