  yaml_path: translation/ot/numbers/033/012.yaml
  text: They set out from the wilderness of Sin and camped at Dophkah[a].
translation:
  language: sw
  text: Wakaondoka kutoka jangwa la Sini[a], wakapiga kambi Dofka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sini ni jina la eneo la jangwani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika orodha ya safari, kitenzi נסע humaanisha kuvunja kambi na kuanza safari. “Wakaondoka” ni usemi wa kawaida na unaoeleweka vizuri katika Kiswahili.
- source_word: מִמִּדְבַּר
  choice: katika jangwa la
  rationale: מִדְבָּר hurejelea eneo la nyika au jangwa; “jangwa” linafaa katika simulizi hili la safari na linaungana kwa kawaida na jina la eneo.
- source_word: סִין
  choice: Sini
  rationale: Hili ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה humaanisha kuweka au kupiga kambi. “Wakapiga kambi” ni Kiswahili cha kawaida na hudumisha mfuatano wa matukio.
- source_word: בְּדָפְקָה
  choice: Dofka
  rationale: Kiambishi בְּ kinaonyesha mahali, na katika Kiswahili mahali panapofuatia “kupiga kambi” hapahitaji kihusishi kingine. Jina דָפְקָה limetoholewa kuwa “Dofka.”
