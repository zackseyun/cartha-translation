  text: They set out from Terah and camped at Mithkah.
translation:
  language: sw
  text: Wakasafiri kutoka Tera, wakapiga kambi Mitka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika fomula ya ratiba ya jangwani, kitenzi נסע humaanisha kuondoka mahali pa kupiga kambi ili kuendelea na safari. “Wakaondoka” ni Kiswahili cha kawaida na fasaha kinachohifadhi maana hiyo.
- source_word: מִתָּרַח
  choice: Tera
  rationale: Kiambishi מִן kinaonyesha mahali walikotoka. תָּרַח ni jina la mahali, limetoholewa kwa tahajia ya Kiswahili kuwa “Tera”.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika ratiba hii humaanisha kusimama na kuweka makao ya muda. “Wakapiga kambi” ni usemi wa asili wa Kiswahili unaohifadhi picha halisi ya tendo hilo.
- source_word: בְּמִתְקָה
  choice: Mitka
  rationale: Kiambishi בְּ kinaonyesha mahali walipopiga kambi. מִתְקָה ni jina la mahali, limetoholewa kwa tahajia ya Kiswahili kuwa “Mitka”; katika muundo “kupiga kambi Mitka,” kihusishi cha mahali si lazima kwa Kiswahili cha kawaida.
