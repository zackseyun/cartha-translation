base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/051.yaml
  text: Speak to the sons of Israel and say to them, ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: sw
  text: Sema na wana wa Israeli, uwaambie, ‘Mtakapovuka Yordani na kuingia katika nchi ya Kanaani,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana mnakaribia kuvuka Yordani na kuingia katika nchi ya Kanaani.” Kiebrania kinaweza kusisitiza kuwa kuvuka huko kumekaribia.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sema
  rationale: Amri ya moja kwa moja ya kuwasilisha ujumbe; inadumisha tofauti na kitenzi kinachofuata, ‘uwaambie.’
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hufuata kwa uwazi usemi wa Kiebrania, ‘wana wa Israeli,’ huku ikiwa lugha ya heshima inayoeleweka katika Kiswahili cha Biblia.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: uwaambie
  rationale: Ni tafsiri ya kawaida na ya asili ya ‘na useme kwao,’ bila kufuta kabisa marudio ya tendo la kusema.
- source_word: כִּי אַתֶּם עֹבְרִים
  choice: Mtakapovuka
  rationale: Katika muktadha huu, kiunganishi pamoja na kiima na kitenzi cha hali endelevu hutambulisha tukio la karibu linalotarajiwa; umbo hili la Kiswahili linaeleza kwa asili ‘wakati mtakapovuka.’
- source_word: אֶת הַיַּרְדֵּן
  choice: Yordani
  rationale: Jina linalotumika kwa kawaida katika Kiswahili kwa Mto Yordani; muktadha wa kuvuka unadhihirisha kuwa ni mto.
- source_word: אֶל אֶרֶץ כְּנָעַן
  choice: na kuingia katika nchi ya Kanaani
  rationale: Kitenzi ‘kuingia’ kinaweka wazi mwendo kuelekea ndani unaodokezwa na אֶל, huku ‘nchi ya Kanaani’ ikihifadhi אֶרֶץ כְּנָעַן.
theological_decisions:
- issue: Nguvu ya כִּי pamoja na אַתֶּם עֹבְרִים
  choice: Mtakapovuka
  alternative: Kwa maana mnauvuka / mnakaribia kuuvuka
  rationale: Muktadha unaelekeza kwenye maagizo yatakayotumika baada ya kuvuka. Tafsiri ya wakati ujao haitatui jambo la kiteolojia, bali huwasilisha kwa Kiswahili maana ya tukio la karibu linalotarajiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Wana wa Israeli’ limehifadhi usemi wa kifamilia wa Kiebrania; ‘Mtakapovuka’ ni la asili kuliko tafsiri ya neno kwa neno ya kauli endelevu.
