  text: They set out from Hazeroth and camped at Rithmah.
translation:
  language: sw
  text: Wakasafiri kutoka Haserothi, wakapiga kambi Rithma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakasafiri
  rationale: Kitenzi נסע katika orodha ya safari za jangwani humaanisha kuondoka kambini na kuendelea na safari. ‘Wakasafiri kutoka’ ni Kiswahili cha kawaida kinachoonyesha mwendo huo.
- source_word: מֵחֲצֵרֹת
  choice: kutoka Haserothi
  rationale: Kiambishi מִן kinaonyesha mahali walikotoka. Jina la mahali חֲצֵרֹת limetoholewa kuwa ‘Haserothi’ kwa tahajia inayosomeka kwa Kiswahili.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה ni usemi wa kawaida wa kusimamisha au kuweka kambi. ‘Wakapiga kambi’ ni usemi wa sasa na wa asili katika Kiswahili.
- source_word: בְּרִתְמָה
  choice: Rithma
  rationale: Kiambishi בְּ kinaonyesha mahali walipopiga kambi; katika Kiswahili, ‘kupiga kambi Rithma’ hakuhitaji kihusishi cha ziada. Jina רִתְמָה limetoholewa kuwa ‘Rithma’.
