  text: They set out from the mountains of Abarim and camped in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: sw
  text: Wakaondoka kutoka milima ya Abarimu, wakapiga kambi katika tambarare za Moabu[a], kando ya Yordani karibu na Yeriko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nyanda za Moabu.” Neno la Kiebrania linaweza kumaanisha eneo la nyika au tambarare.
    reason: lexical_alternative
  - marker: b
    text: Au, “kando ya Yordani mkabala na Yeriko.” Baadhi ya tafsiri huelewa kifungu hiki kama kikieleza eneo lililokuwa mkabala na Yeriko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika orodha ya vituo vya safari, kitenzi נסע humaanisha kuvunja kambi na kuanza hatua inayofuata ya safari. “Wakaondoka” ni cha kawaida na wazi katika Kiswahili.
- source_word: מֵהָרֵי הָעֲבָרִים
  choice: katika milima ya Abarimu
  rationale: הָרֵי ni wingi wa hali ya kuunganisha wa neno linalomaanisha milima au vilima. “Milima ya Abarimu” linawasilisha moja kwa moja jina hili la kijiografia.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika taarifa za safari humaanisha kusimamisha kambi. “Kupiga kambi” ni usemi wa sasa, wa kawaida, na sahihi katika Kiswahili.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: katika tambarare za Moabu
  rationale: עַרְבֹת huonyesha eneo tambarare, kame au la nyika. “Tambarare” ni neno linaloeleweka kwa urahisi, huku tanbihi ikihifadhi maana mbadala ya “nyanda.”
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: kando ya Yordani karibu na Yeriko
  rationale: עַל pamoja na mto huonyesha mahali kando au karibu nao. Muundo wa Kiebrania unaunganisha Yordani na Yeriko kwa ufupi; tafsiri hii ni ya asili katika Kiswahili bila kudai kwamba maandishi yana neno dhahiri la “mkabala na.”
