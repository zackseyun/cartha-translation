base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/055.yaml
  text: But if you do not drive out the inhabitants of the land from before you[a], then those whom you let remain from among them will become barbs in your eyes and thorns in your sides[c][b], and they will harass you on the land where you are living.
translation:
  language: sw
  text: Lakini msipowafukuza wenyeji wa nchi mbele yenu, wale mtakaowaacha wabaki watakuwa kama vichomi machoni penu[a] na miiba mbavuni mwenu[b], nao watawasumbua[c] katika nchi mnamoishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama miiba machoni penu.” Nomino ya Kiebrania ni adimu na inaashiria kitu chenye ncha kinachochoma.
    reason: lexical_alternative
  - marker: b
    text: Au, “michongoma mbavuni mwenu” au “kulabu mbavuni mwenu.” Taswira hizi mbili zinaeleza mateso makali na ya kudumu yatakayosababishwa na wenyeji watakaoachwa.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania pia kinaweza kutafsiriwa, “nao watawataabisha” au “nao watawatesa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹרִישׁוּ
  choice: msipowafukuza
  rationale: Hifili ya ירשׁ hapa ina maana ya kuwaondoa wenyeji na kuwanyima umiliki wao. “Kuwafukuza” ni Kiswahili cha kawaida chenye nguvu inayofaa muktadha.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: wenyeji wa nchi
  rationale: Huwasilisha kwa ufupi na kwa kawaida watu wanaokaa katika nchi hiyo.
- source_word: מִפְּנֵיכֶם
  choice: mbele yenu
  rationale: Hudumisha taswira ya Kiebrania ya kuwaondoa mbele ya Israeli bila kuongeza wazo lisilomo katika matini.
- source_word: תּוֹתִירוּ
  choice: mtakaowaacha wabaki
  rationale: Huhifadhi maana sababishi ya kuacha watu fulani waendelee kuwapo, bila kuingiza dhana maalumu ya kuwaonea huruma.
- source_word: לְשִׂכִּים בְּעֵינֵיכֶם
  choice: kama vichomi machoni penu
  rationale: Nomino adimu שׂכים hurejelea vitu vyenye ncha vinavyochoma. “Vichomi” hudumisha taswira ya maumivu na kuitofautisha na “miiba” katika kishazi kinachofuata.
- source_word: לִצְנִינִם בְּצִדֵּיכֶם
  choice: miiba mbavuni mwenu
  rationale: Huhifadhi taswira ya vitu vyenye ncha vinavyoleta maumivu ya kudumu; “mbavuni” ni usemi wa kawaida zaidi hapa kuliko tafsiri pana ya “pembeni.”
- source_word: וְצָרֲרוּ אֶתְכֶם
  choice: nao watawasumbua
  rationale: Kitenzi צרר kinaweza kueleza uhasama, kusumbua, au kudhulumu. “Watawasumbua” hudumisha upana huo bila kuzidisha kiwango cha mateso.
- source_word: עַל הָאָרֶץ אֲשֶׁר אַתֶּם יֹשְׁבִים בָּהּ
  choice: katika nchi mnamoishi
  rationale: Ingawa עַל kimsingi ni “juu ya,” Kiswahili cha kawaida husema kuishi “katika nchi”; muundo huu pia huhifadhi hali ya sasa ya makao yao.
