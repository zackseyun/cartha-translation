  text: They set out from Mount Hor and camped at Zalmonah.
translation:
  language: sw
  text: Wakaondoka kutoka Mlima Hori, wakapiga kambi huko Salmona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika orodha za safari, נסע humaanisha kuvunja kambi na kuanza hatua inayofuata ya safari. “Wakaondoka” ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: מֵהֹר הָהָר
  choice: kutoka Mlima Hori
  rationale: הֹר הָהָר ni jina la mahali linalotambulika kama Mlima Hori; muundo huu wa Kiswahili ni wa kawaida na huhifadhi jina hilo.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה hapa kinamaanisha kusimama na kuweka kambi. “Wakapiga kambi” ni usemi wa sasa, wazi, na wa kawaida katika Kiswahili.
- source_word: בְּצַלְמֹנָה
  choice: huko Salmona
  rationale: Kiambishi בְּ kinaonyesha mahali walipopiga kambi. “Huko” huonyesha kituo cha safari kwa ufasaha, na צַלְמֹנָה limetoholewa kuwa “Salmona” kwa tahajia ya Kiswahili.
