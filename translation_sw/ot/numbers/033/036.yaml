base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/036.yaml
  text: They set out from Ezion-geber and camped in the wilderness of Zin (that is[a], Kadesh).
translation:
  language: sw
  text: Wakaondoka Esion-geberi, wakapiga kambi katika nyika ya Sini (yaani[a], Kadeshi).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambayo ni Kadeshi.” Kiwakilishi cha Kiebrania kinatambulisha eneo hilo kuwa Kadeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika orodha ya safari, נסע humaanisha kuvunja kambi na kuanza safari. “Wakaondoka” ni Kiswahili cha kawaida na huwasilisha tendo hilo kwa ufupi.
- source_word: מֵעֶצְיוֹן גָּבֶר
  choice: Esion-geberi
  rationale: Ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa. Umbo hili linafuata matamshi na mazoea ya majina ya kibiblia katika Kiswahili.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה humaanisha kusimamisha au kuweka kambi. “Wakapiga kambi” ni usemi wa asili na unaoeleweka katika Kiswahili cha sasa.
- source_word: בְמִדְבַּר צִן
  choice: katika nyika ya Sini
  rationale: מִדְבָּר inaweza kumaanisha eneo kame lisilokaliwa sana, si lazima jangwa la mchanga. “Nyika” huhifadhi upana huo wa kijiografia bila kuainisha mazingira kupita kiasi.
- source_word: הִוא
  choice: yaani
  rationale: Kiwakilishi hiki kinatumika hapa kutambulisha au kulinganisha eneo lililotajwa na Kadeshi. “Yaani” huonyesha utambulisho huo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa tafsiri ya moja kwa moja zaidi.
- source_word: קָדֵשׁ
  choice: Kadeshi
  rationale: Ni jina la mahali, kwa hiyo limetoholewa kwa umbo linalosomeka kwa urahisi katika Kiswahili.
