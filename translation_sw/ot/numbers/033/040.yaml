base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/040.yaml
  text: And the Canaanite king of Arad[a], who lived in the Negev in the land of Canaan[b], heard when the sons of Israel came.
translation:
  language: sw
  text: Mfalme Mkanaani wa Aradi, aliyekuwa akiishi Negebu[a] katika nchi ya Kanaani, alisikia wana wa Israeli[b] walipokuja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusini” au “eneo la kusini.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Waisraeli.” Kiebrania kinasema, “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: alisikia
  rationale: Kitenzi cha Kiebrania kwa maana ya msingi ni ‘alisikia.’ Kirai kinachofuata kinaonyesha wakati wa kusikia bila kutaja wazi kitu kilichosikiwa, hivyo tafsiri haiongezi ‘habari.’
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: Mfalme Mkanaani wa Aradi
  rationale: Muundo huu unamtambulisha mtawala kwa asili yake ya Kikanaani na kwa mji alioutawala. Mpangilio huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וְהוּא יֹשֵׁב
  choice: aliyekuwa akiishi
  rationale: Kiwakilishi pamoja na umbo la kitenzi linaloendelea hutoa maelezo ya usuli; kishazi rejeshi cha Kiswahili kinaonyesha hilo kwa kawaida.
- source_word: בַּנֶּגֶב
  choice: Negebu
  rationale: Hapa neno hilo linafaa kueleweka kama jina la eneo la kusini; kulitohoa kama jina la mahali kunadumisha rejeo mahususi la kijiografia.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Tafsiri hii inadumisha neno המפורשת ‘nchi’ pamoja na jina Kanaani.
- source_word: בְּבֹא
  choice: walipokuja
  rationale: 'Herufi ב pamoja na jina-kitenzi la בוא ina matumizi ya wakati: ‘walipokuja.’ Haiongezi mahali walipoingia, kwa kuwa hakutajwi katika mstari huu.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inaakisi kwa karibu usemi wa Kiebrania ‘wana wa Israeli,’ huku ‘Waisraeli’ ikiwa tafsiri mbadala iliyo nyepesi zaidi.
theological_decisions: []
