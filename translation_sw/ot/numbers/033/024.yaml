translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo mfupi wa taarifa ya safari umehifadhiwa. Majina yametoholewa moja kwa moja kutoka Kiebrania, huku sentensi ikibaki ya kawaida, yenye hadhi na rahisi kueleweka.
