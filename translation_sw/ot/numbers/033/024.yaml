  yaml_path: translation/ot/numbers/033/024.yaml
  text: They set out from Mount Shepher and camped at Haradah[a].
translation:
  language: sw
  text: Wakaondoka kutoka Mlima Shaferi, wakapiga kambi Harada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika orodha ya safari za jangwani, kitenzi נסע kinaonyesha kuondoka katika kituo kimoja kuelekea kingine; “wakaondoka” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: מֵהַר
  choice: Mlima
  rationale: Muundo מן + הַר una maana ya kuondoka kutoka mlimani; katika Kiswahili, kitenzi “kuondoka” kinaweza kufuatwa moja kwa moja na mahali pa kuondokea, hivyo “wakaondoka Mlima…” ni ya asili bila kulazimisha “kutoka.”
- source_word: שָׁפֶר
  choice: Shaferi
  rationale: Ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa. “Shaferi” linafuata matamshi ya Kiebrania שָׁפֶר kwa namna inayosomeka kwa urahisi katika Kiswahili.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Katika taarifa za safari, חנה humaanisha kusimama na kuweka kambi. “Wakapiga kambi” ni usemi wa sasa, wazi na wa kawaida katika Kiswahili.
- source_word: בַּחֲרָדָה
  choice: Harada
  rationale: בְּ־ linaonyesha mahali walipopiga kambi. Katika Kiswahili, “kupiga kambi” hufuatiwa moja kwa moja na jina la mahali, hivyo hakuna haja ya kuongeza kihusishi. Harada limetoholewa kama jina la mahali.
