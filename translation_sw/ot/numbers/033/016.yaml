lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakasafiri
  rationale: Katika mtindo unaorudiwa wa ratiba ya safari jangwani, kitenzi נסע humaanisha kuondoka na kuendelea na safari. “Wakasafiri” ni Kiswahili cha kawaida na hudumisha wazo la kusonga kutoka kituo kimoja kwenda kingine.
- source_word: מִמִּדְבַּר סִינָי
  choice: kutoka katika nyika ya Sinai
  rationale: מִדְבָּר ni eneo kame lisilolimwa au nyika. “Nyika ya Sinai” hudumisha uhusiano wa kisarufi wa Kiebrania na ni lugha ya kijiografia yenye hadhi na inayoeleweka.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika ratiba hii humaanisha kusimama na kuweka kambi. “Kupiga kambi” ni usemi wa asili katika Kiswahili cha sasa.
- source_word: בְּקִבְרֹת הַתַּאֲוָה
  choice: huko Kibroth-hataava
  rationale: Hili ni jina la mahali, kwa hiyo limetoholewa katika matini kuu badala ya kutafsiriwa. Maana yake ya moja kwa moja imehifadhiwa katika tanbihi.
