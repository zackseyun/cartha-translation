translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vifungu viwili vya simulizi umehifadhiwa kwa vitenzi vinavyofuatana “Wakasafiri … wakapiga kambi.” Tahajia “Kibroth-hataava” huhifadhi utambulisho wa jina la Kiebrania huku tanbihi ikitoa maana yake.
