  text: They set out from Dibon-gad and camped at Almon-diblathaim.
translation:
  language: sw
  text: Wakaondoka kutoka Diboni-Gadi, wakapiga kambi huko Almoni-Diblathaimu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika mtindo unaorudiwa wa orodha ya safari jangwani, kitenzi נסע humaanisha kuvunja kambi na kuanza safari kutoka mahali fulani; “wakaondoka” ni Kiswahili cha kawaida na wazi.
- source_word: מִדִּיבֹן גָּד
  choice: Diboni-Gadi
  rationale: Hili ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa. Kiambishi מִ־ kimewakilishwa na maana ya kuondoka mahali inayobebwa na “wakaondoka,” na vistari vinaonyesha jina ambatani.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika orodha hii ya safari humaanisha kusimama na kuweka kambi. “Kupiga kambi” ni usemi wa sasa, wa kawaida na unaoeleweka vizuri.
- source_word: בְּעַלְמֹן דִּבְלָתָיְמָה
  choice: Almoni-Diblathaimu
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili. Maana ya kuelekea na kufika mahali, inayodokezwa na בְּ pamoja na kiambishi cha mwelekeo ־ָה, inaeleweka katika mfuatano wa “wakaondoka … wakapiga kambi …” bila kuongezwa maneno yasiyo ya lazima.
