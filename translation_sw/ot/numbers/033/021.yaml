  yaml_path: translation/ot/numbers/033/021.yaml
  text: They set out from Libnah and camped at Rissah.
translation:
  language: sw
  text: Wakaondoka Libna, wakapiga kambi huko Risa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika mtindo wa orodha ya safari za jangwani, kitenzi נסע kinaonyesha kuondoka katika kituo kimoja ili kuendelea na safari. “Wakaondoka” ni Kiswahili cha sasa, wazi na cha kawaida.
- source_word: מִלִּבְנָה
  choice: Libna
  rationale: Kihusishi מִן kinaonyesha mahali walikotoka. Katika Kiswahili, maana hiyo tayari imebebwa na kitenzi “wakaondoka,” kwa hiyo “Libna” linafuata moja kwa moja bila kuhitaji “kutoka.” Jina la mahali limetoholewa kwa kuzingatia matamshi ya Kiebrania.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה ni neno la kawaida katika taarifa hizi kwa maana ya kuweka au kufanya kambi. “Wakapiga kambi” ni usemi wa asili na unaoeleweka kwa urahisi katika Kiswahili cha Afrika Mashariki.
- source_word: בְּרִסָּה
  choice: huko Risa
  rationale: Kihusishi בְּ kinaonyesha mahali. “Huko” huonyesha kwamba walipiga kambi katika eneo hilo, huku jina רִסָּה likitoholewa kuwa “Risa” kwa matamshi ya kawaida ya Kiswahili.
