  verdict: revise
  source_fidelity: Maana kuu ya ugawaji wa nchi kwa kura, kwa koo, na kwa uwiano wa idadi imehifadhiwa. Hata hivyo, “Mtaigawana” inaweza kudokeza kugawana kwa usawa au kwa kubadilishana miongoni mwa wahusika, ilhali Kiebrania kinaagiza ugawaji wa sehemu za urithi; “Mtagawanya” ni wazi zaidi. Tofauti ya umoja/wingi katika sehemu za urithi pia hufafanuliwa vyema kwa “sehemu kubwa/ndogo ya urithi.”
  naturalness: Kiswahili cha rasimu kwa ujumla ni sanifu na cha asili. Marekebisho yanapunguza utata wa “urithi mkubwa/mdogo,” ambao unaweza kusikika kana kwamba urithi wenyewe una sifa ya ukubwa badala ya sehemu iliyotengwa.
  terminology: “Kura,” “koo,” “makabila,” na “urithi” zinafaa katika muktadha huu. “Koo” huhifadhi tofauti na “makabila.” Toleo la tanbihi lilikuwa na usemi usio wa kawaida, “itatokea kwa ajili yake”; limerekebishwa ili kuonyesha nahau ya Kiebrania ya kura ‘kutokea’ kwa mtu/mahali pake.
