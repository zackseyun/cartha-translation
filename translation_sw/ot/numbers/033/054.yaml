translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. “Koo” limetofautishwa na “makabila” ili kuhifadhi viwango viwili vya muundo wa kijamii katika Kiebrania. Alama ya tanbihi imewekwa baada ya sentensi inayofafanuliwa na tanbihi.
