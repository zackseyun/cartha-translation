revisions:
- from: Mtaigawana nchi kwa kura kulingana na koo zenu. Kundi lenye watu wengi mtalipa urithi mkubwa, na kundi lenye watu wachache mtalipa urithi mdogo. Mahali popote ambapo kura itamwangukia mtu, hapo ndipo patakapokuwa pake.[a] Mtapokea urithi wenu kulingana na makabila ya baba zenu.
  to: Mtagawanya nchi kwa kura kulingana na koo zenu. Kundi lenye watu wengi mtalipa sehemu kubwa ya urithi, na kundi lenye watu wachache mtalipa sehemu ndogo ya urithi. Mahali popote ambapo kura itamwangukia mtu, hapo ndipo patakuwa pake.[a] Mtajipatia urithi kulingana na makabila ya baba zenu.
  rationale: Marekebisho yanaweka wazi tendo la kugawa badala ya dhana pana ya kugawana, yanafafanua kuwa ukubwa au udogo unahusu sehemu ya urithi, na yanarekebisha tanbihi ili iwe Kiswahili sanifu huku ikidumisha mbadala wa karibu wa nahau ya Kiebrania. Muundo wa koo na makabila, pamoja na maana ya urithi, umehifadhiwa.
