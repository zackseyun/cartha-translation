base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/054.yaml
  text: You shall apportion the land by lot according to your clans. To the larger group you shall increase its inheritance[a], and to the smaller you shall reduce its inheritance. Wherever the lot falls for anyone, that shall be his. You shall receive your inheritances according to the tribes of your fathers.
translation:
  language: sw
  text: Mtagawanya nchi kwa kura kulingana na koo zenu. Kundi lenye watu wengi mtalipa sehemu kubwa ya urithi, na kundi lenye watu wachache mtalipa sehemu ndogo ya urithi. Mahali popote ambapo kura itamwangukia mtu, hapo ndipo patakuwa pake.[a] Mtajipatia urithi kulingana na makabila ya baba zenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa maneno kwa karibu zaidi, “Mahali ambapo kura itamtokea, huko ndiko kutakuwa kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְנַחַלְתֶּם
  choice: Mtaigawana
  rationale: Hifadhia maana ya kugawana nchi kama urithi katika muktadha wa ugawaji, badala ya kuonyesha tu kitendo cha kuimiliki.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: “Nchi” ni neno la kawaida na linalofaa kwa eneo lililoahidiwa katika muktadha huu.
- source_word: בְּגוֹרָל
  choice: kwa kura
  rationale: Ni tafsiri ya kawaida ya njia ya kugawa maeneo kwa kupiga kura.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: kulingana na koo zenu
  rationale: “Koo” huonyesha vitengo vya kijamii vilivyomo ndani ya makabila, si familia ndogo za nyumbani tu.
- source_word: לָרַב ... וְלַמְעַט
  choice: kundi lenye watu wengi ... kundi lenye watu wachache
  rationale: Muktadha unaonyesha tofauti ya idadi ya watu na hivyo ukubwa wa eneo la urithi.
- source_word: תַּרְבּוּ אֶת נַחֲלָתוֹ ... תַּמְעִיט אֶת נַחֲלָתוֹ
  choice: mtalipa urithi mkubwa ... mtalipa urithi mdogo
  rationale: Muundo huu ni wa asili katika Kiswahili na unaonyesha kwamba ukubwa wa sehemu iliyotolewa unalingana na idadi ya kundi.
- source_word: אֶל אֲשֶׁר יֵצֵא לוֹ שָׁמָּה הַגּוֹרָל
  choice: Mahali popote ambapo kura itamwangukia mtu
  rationale: “Kura kumwangukia mtu” ni nahau inayoeleweka kwa eneo analopewa kwa kura, huku maana ya mahali ikihifadhiwa.
- source_word: לוֹ יִהְיֶה
  choice: hapo ndipo patakapokuwa pake
  rationale: Huhifadhi kauli ya umiliki inayotokana na matokeo ya kura.
- source_word: לְמַטּוֹת אֲבֹתֵיכֶם
  choice: kulingana na makabila ya baba zenu
  rationale: Huhifadhi wazi mpangilio wa urithi kwa kufuata nasaba za makabila ya upande wa baba.
- source_word: תִּתְנֶחָלוּ
  choice: Mtapokea urithi wenu
  rationale: Hurejesha wazo la nchi kama urithi na kufaa kwa ugawaji wa makabila na koo.
