    rationale: Inaweza kumaanisha washiriki wanagawana kwa usawa au miongoni mwao, badala ya kuagiza ugawaji wa nchi kwa kura kwa msingi wa koo.
  - severity: low
    issue: “Mtalipa urithi mkubwa/mdogo” haielezi wazi kuwa ukubwa unahusu sehemu iliyotengwa.
    rationale: Kiebrania husema kufanya sehemu ya urithi kuwa kubwa au ndogo; “sehemu kubwa/ndogo ya urithi” huhifadhi hilo kwa uwazi.
  - severity: low
