  text: They set out from Mithkah and camped at Hashmonah.
translation:
  language: sw
  text: Wakaondoka Mithka, wakapiga kambi Hashmona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika mtindo wa orodha ya safari jangwani, kitenzi נסע kinaeleza kuondoka katika kituo kimoja kuelekea kingine. “Wakaondoka” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: מִמִּתְקָה
  choice: Mitka
  rationale: Kiambishi מִן kinaonyesha mahali walikotoka; katika Kiswahili, maana hiyo imejumuishwa kwa kawaida katika kitenzi “wakaondoka.” Jina la mahali מִתְקָה limetoholewa kuwa “Mitka.”
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה hapa ni fomula ya kawaida ya kufanya kituo katika safari. “Kupiga kambi” ni usemi wa sasa, wa kawaida, na unaoeleweka vizuri.
- source_word: בְּחַשְׁמֹנָה
  choice: Hashmona
  rationale: Kiambishi בְּ kinaonyesha mahali walipopiga kambi; uhusiano huo tayari unaelezwa kiasili na “wakapiga kambi.” Jina חַשְׁמֹנָה limetoholewa kuwa “Hashmona.”
