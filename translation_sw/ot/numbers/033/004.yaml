  text: וּ/מִצְרַ֣יִם מְקַבְּרִ֗ים אֵת֩ אֲשֶׁ֨ר הִכָּ֧ה יְהוָ֛ה בָּ/הֶ֖ם כָּל בְּכ֑וֹר וּ/בֵ/אלֹ֣הֵי/הֶ֔ם עָשָׂ֥ה יְהוָ֖ה שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/004.yaml
  text: while the Egyptians were burying those whom Yahweh had struck down among them[a], all the firstborn; and on their gods Yahweh had executed judgments.
translation:
  language: sw
  text: wakati Wamisri walipokuwa wakiwazika wale ambao Yahwe alikuwa amewapiga kati yao—wazaliwa wote wa kwanza—na Yahwe alikuwa ametekeleza hukumu juu ya miungu yao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhidi ya miungu yao.”
    reason: Kihusishi cha Kiebrania kinaweza kutolewa kwa ‘juu ya’ au kwa ‘dhidi ya’ katika muktadha huu.
lexical_decisions:
- source_word: וּמִצְרַיִם מְקַבְּרִים
  choice: wakati Wamisri walipokuwa wakiwazika
  rationale: Kiunganishi pamoja na nomino na kitenzi-shirikishi kinaweka tendo hili kama hali ya wakati inayoandamana na kuondoka kwa Israeli; muundo huu ni wa asili katika Kiswahili.
- source_word: אֵת אֲשֶׁר הִכָּה יְהוָה בָּהֶם
  choice: wale ambao Yahwe alikuwa amewapiga kati yao
  rationale: Muundo huu unadumisha kishazi cha uhusiano cha Kiebrania. ‘Amewapiga’ huhifadhi taswira ya נכה, huku muktadha wa kuwazika ukionyesha kwamba pigo hilo liliwaua.
- source_word: כָּל בְּכוֹר
  choice: wazaliwa wote wa kwanza
  rationale: Kirai hiki kinabainisha wale waliopigwa bila kuingiza kimyakimya umilikaji ambao haujaonyeshwa wazi katika kirai hiki cha Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania linatolewa kama jina binafsi ‘Yahwe’, si kubadilishwa kuwa cheo.
- source_word: וּבֵאלֹהֵיהֶם
  choice: juu ya miungu yao
  rationale: Kihusishi ב pamoja na עשה שפטים kinaweza kutolewa kwa maana ya hukumu zilizoelekezwa juu ya miungu; ‘juu ya’ hudumisha kwa karibu muundo na maana ya chanzo.
- source_word: עָשָׂה ... שְׁפָטִים
  choice: alikuwa ametekeleza hukumu
  rationale: Nahau ya ‘kufanya hukumu’ ina maana ya kutimiza au kutekeleza matendo ya hukumu; uchaguzi huu ni wazi na wenye uzito katika Kiswahili cha sasa.
theological_decisions:
- issue: Kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; kulitaja kama ‘Yahwe’ huhifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Maana ya אֱלֹהֵיהֶם
  choice: miungu yao
  alternative: sanamu zao; watawala wao
  rationale: Neno hilo linarejelea moja kwa moja miungu ya Misri. Tafsiri hailigeuzi kuwa watawala wa kibinadamu wala kulifafanua kwa neno ‘sanamu’.
- issue: Uhusiano wa hukumu na miungu ya Misri
  choice: hukumu juu ya miungu yao
  alternative: hukumu dhidi ya miungu yao
  rationale: ‘Juu ya’ hudumisha namna ya usemi wa Kiebrania, huku tanbihi ikihifadhi uwezekano wa kulieleza kihusishi hicho wazi zaidi kama ‘dhidi ya’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari mirefu imedhibitiwa kwa vistari virefu ili kuweka ‘wazaliwa wote wa kwanza’ kama ufafanuzi wa wale waliozikwa.
