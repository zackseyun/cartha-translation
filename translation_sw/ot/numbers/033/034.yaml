  text: They set out from Jotbathah and camped at Abronah.
translation:
  language: sw
  text: Wakaondoka Yotbatha, wakapiga kambi Abrona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Kitenzi נסע katika orodha ya hatua za safari kinaonyesha kuondoka katika kituo kimoja kuelekea kingine. “Wakaondoka” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: מִיָּטְבָתָה
  choice: Yotbatha
  rationale: Kihusishi מִן kimetolewa kwa maana ya kuondoka mahali, inayobebwa na muundo “wakaondoka Yotbatha.” Jina la mahali limetoholewa kwa kuzingatia matamshi ya Kiebrania badala ya umbo la Kiingereza.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה hapa humaanisha kusimamisha au kuweka kambi katika kituo kinachofuata. “Wakapiga kambi” ni usemi wa sasa, wa kawaida na unaoeleweka.
- source_word: בְּעַבְרֹנָה
  choice: Abrona
  rationale: Kihusishi בְּ ni cha mahali; katika Kiswahili, “kupiga kambi Abrona” ni muundo wa asili usiohitaji kihusishi cha ziada. Jina limetoholewa moja kwa moja kutoka Kiebrania.
