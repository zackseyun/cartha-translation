  text: They set out from Oboth and camped at Iye-abarim[a], on the border of Moab.
translation:
  language: sw
  text: Wakaondoka kutoka Obothi, wakapiga kambi Iye-abarimu[a], mpakani mwa Moabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Iyye-abarimu”; huenda jina hili lina vipengele vinavyohusiana na “magofu” na “Abarimu/maeneo ya ng’ambo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika mtindo wa taarifa za safari za jangwani, kitenzi נסע humaanisha kuvunja kambi na kuanza safari; “wakaondoka” ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: מֵאֹבֹת
  choice: Obothi
  rationale: Kiambishi מֵ kinaonyesha mahali walikotoka, nacho אֹבֹת ni jina la mahali; “Obothi” ni unukuzi unaofaa katika Kiswahili.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה ni neno la kawaida kwa kusimama na kuweka kambi katika simulizi za safari; “kupiga kambi” ni usemi wa sasa, wa kawaida na ulio wazi.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: huko Iye-abarimu
  rationale: Muunganiko huu hutumiwa kama jina la mahali katika orodha ya safari. Unukuzi huhifadhi jina hilo bila kulazimisha tafsiri ya maana zake za kietimolojia.
- source_word: בִּגְבוּל
  choice: kwenye mpaka wa
  rationale: גְּבוּל inaweza kumaanisha mpaka, eneo la mpakani, au nchi. Hapa “kwenye mpaka wa” inafaa zaidi kwa taarifa ya mahali na haidai kwamba kambi ilikuwa ndani kabisa ya eneo la Moabu.
- source_word: מוֹאָב
  choice: Moabu
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mahali na taifa la Moabu.
