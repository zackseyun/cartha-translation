base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/002.yaml
  text: Moses wrote down their starting points according to their journeys at the command of Yahweh[c][b][a], and these were their journeys according to their starting points.
translation:
  language: sw
  text: Musa aliandika mahali walipoanzia, kulingana na safari zao[b][c], kwa amri ya Yahweh[a]; na hizi ndizo safari zao kulingana na mahali walipoanzia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno kwa neno Kiebrania kinasema, “kwa kinywa cha Yahweh,” nahau yenye maana ya “kwa amri ya Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Au “kuondoka kwao” au “mahali walipotoka” badala ya “mahali walipoanzia.”
    reason: lexical_alternative
  - marker: c
    text: 'Mstari huu unageuza istilahi kwa makusudi: “mahali walipoanzia, kulingana na safari zao” ... “safari zao kulingana na mahali walipoanzia.”'
    reason: literary_structure
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: aliandika
  rationale: Kitenzi hiki kinasimulia tendo lililotokea zamani. Katika muktadha huu, “aliandika” linaeleweka kuwa aliweka habari hizo katika kumbukumbu bila kuongeza maana isiyokuwamo katika Kiebrania.
- source_word: מוֹצָאֵיהֶם
  choice: mahali walipoanzia
  rationale: מוֹצָא inaweza kumaanisha kutoka, kuondoka, au mahali pa kuondokea. Katika orodha hii ya safari, “mahali walipoanzia” ni Kiswahili cha kawaida kinachoonyesha vituo walikotoka huku kikihifadhi uhusiano wake na “safari zao.”
- source_word: לְמַסְעֵיהֶם
  choice: kulingana na safari zao
  rationale: מַסָּע hurejelea safari au hatua ya safari baada ya kuvunja kambi. “Kulingana na” linaonyesha uhusiano unaowasilishwa na לְ na kusaidia kuhifadhi mpangilio wa sentensi ya Kiebrania.
- source_word: עַל פִּי יְהוָה
  choice: kwa amri ya Yahweh
  rationale: Kirai עַל־פִּי kwa neno moja moja ni “kwa kinywa cha,” lakini hapa ni nahau yenye maana ya kutenda kwa amri au maelekezo ya Yahweh.
- source_word: וְאֵלֶּה מַסְעֵיהֶם
  choice: na hizi ndizo safari zao
  rationale: Hiki ni kichwa kinachoingiza orodha inayofuata. “Hizi ndizo” ni usemi wa asili wa Kiswahili na “safari” linaeleweka kwa wasomaji wengi kuliko istilahi finyu zaidi kama “hatua za safari.”
- source_word: לְמוֹצָאֵיהֶם
  choice: kulingana na mahali walipoanzia
  rationale: 'Tafsiri hii inarudia istilahi ya awali na kuhifadhi ugeuzaji wa kimakusudi: mahali walipoanzia—safari zao, kisha safari zao—mahali walipoanzia.'
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandiko ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עַל־פִּי katika uhusiano na Yahweh
  choice: kwa amri ya Yahweh
  alternative: kwa kinywa cha Yahweh
  rationale: Kirai hiki ni nahau ya Kiebrania inayomaanisha kwa amri au maelekezo ya mtu. Tafsiri ya neno kwa neno ingekuwa ngumu na ingeweza kupotosha kwa Kiswahili.
- issue: Ugeuzaji wa מוֹצָאֵיהֶם na מַסְעֵיהֶם
  choice: kuhifadhi mpangilio uliogeuzwa katika vifungu viwili
  alternative: kurahisisha kuwa Musa aliandika ratiba ya safari zao
  rationale: Muundo wa Kiebrania kwa makusudi unaanza na mahali walipoanzia kwa kuhusishwa na safari, kisha unataja safari kwa kuhusishwa na mahali walipoanzia. Tafsiri haipaswi kuondoa mvutano huo wa kifasihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inabaki rahisi kueleweka, lakini inadumisha urudiaji na ugeuzaji wa kimakusudi wa Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
