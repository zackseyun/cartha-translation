base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/014.yaml
  text: They set out from Alush and camped at Rephidim, but there was no water there for the people to drink.
translation:
  language: sw
  text: Wakaondoka Alushi, wakapiga kambi Refidimu; lakini huko hapakuwa na maji ya kunywa kwa ajili ya watu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Waliondoka
  rationale: Katika mtindo wa orodha ya safari za jangwani, kitenzi נסע humaanisha kuvunja kambi na kuendelea na safari; “waliondoka” ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: מֵאָלוּשׁ
  choice: Alushi
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa Kiswahili badala ya kutafsiriwa.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה hapa humaanisha kusimama na kuweka kambi; “wakapiga kambi” ni Kiswahili cha kawaida na cha kisasa.
- source_word: בִּרְפִידִם
  choice: Refidimu
  rationale: Jina la mahali limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: וְלֹא הָיָה שָׁם
  choice: lakini huko hapakuwa na
  rationale: Kiunganishi waw kinaonyesha hali pinzani katika mahali walipopiga kambi; “lakini” huwasilisha uhusiano huo kwa kawaida bila kuongeza maana.
- source_word: מַיִם
  choice: maji
  rationale: Tafsiri ya kawaida na ya moja kwa moja ya מַיִם.
- source_word: לָעָם
  choice: ya watu
  rationale: עָם inawahusu watu wa Israeli kwa ujumla; muundo huu unaunganika kiasili na kishazi cha kusudi kinachofuata.
- source_word: לִשְׁתּוֹת
  choice: kunywa
  rationale: 'Jina-kitenzi linaonyesha kusudi au matumizi: maji ambayo watu wangekunywa.'
