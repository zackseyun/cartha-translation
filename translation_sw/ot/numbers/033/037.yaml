  text: They set out from Kadesh and camped at Mount Hor[b][a], on the edge of the land of Edom.
translation:
  language: sw
  text: Wakaondoka Kadeshi[a], wakapiga kambi kwenye Mlima Hori[b], ukingoni mwa nchi ya Edomu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Kadeshi.” Tafsiri nyingine hupanua jina hili kuwa “Kadeshi-barnea” kwa kutegemea muktadha mpana, lakini hapa maandishi yana jina fupi tu.'
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania kihalisi: “Hori, mlima”; kwa kawaida hutafsiriwa “Mlima Hori.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika fomula ya ratiba ya safari jangwani, kitenzi נסע kinaonyesha kuondoka mahali walipopiga kambi; “wakaondoka” ni Kiswahili cha kawaida na sahihi.
- source_word: מִקָּדֵשׁ
  choice: Kadeshi
  rationale: Maandishi ya Kiebrania yana jina fupi קָדֵשׁ pekee; halijapanuliwa kuwa Kadeshi-barnea.
- source_word: וַיַּחֲנוּ
  choice: na kupiga kambi
  rationale: Kitenzi חנה humaanisha kuweka au kupiga kambi; usemi huu ni wa kawaida katika Kiswahili cha kisasa.
- source_word: בְּהֹר הָהָר
  choice: kwenye Mlima Hori
  rationale: Ingawa muundo wa Kiebrania ni kama “Hori, ule mlima,” jina hili la mahali linatolewa kwa Kiswahili cha kawaida kama “Mlima Hori.”
- source_word: בִּקְצֵה
  choice: ukingoni mwa
  rationale: Neno קצה linaweza kumaanisha mwisho, ukingo, au ncha; “ukingoni mwa” huhifadhi maana ya mahali bila kulifanya kwa lazima kuwa mpaka rasmi wa kisiasa.
- source_word: אֶרֶץ אֱדֹם
  choice: nchi ya Edomu
  rationale: אֶרֶץ humaanisha nchi au eneo; “nchi ya Edomu” ni tafsiri ya moja kwa moja na ya kawaida katika simulizi la kibiblia.
