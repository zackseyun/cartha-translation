  text: Wakaondoka Salmona, wakapiga kambi huko Punoni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika mfumo wa simulizi la vituo vya jangwani, kitenzi נסע humaanisha kuvunja kambi na kuendelea na safari. “Wakaondoka” ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: מִצַּלְמֹנָה
  choice: Salmona
  rationale: Kiambishi מִן kinaonyesha mahali walikotoka; katika Kiswahili maana hiyo imewasilishwa kwa muundo wa kitenzi “wakaondoka Salmona.” Jina la mahali צַלְמֹנָה limetoholewa kuwa “Salmona.”
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika orodha ya vituo vya safari kina maana ya kuweka kambi. “Wakapiga kambi” ni usemi wa asili na unaoeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: בְּפוּנֹן
  choice: huko Punoni
  rationale: Kiambishi בְּ kinaonyesha mahali walipopiga kambi. “Huko” hutoa uhusiano wa mahali kwa njia ya asili, na פוּנֹן limetoholewa kuwa “Punoni.”
