  text: וַ/יִּסְע֖וּ מֵ/עַלְמֹ֣ן דִּבְלָתָ֑יְמָ/ה וַֽ/יַּחֲנ֛וּ בְּ/הָרֵ֥י הָ/עֲבָרִ֖ים לִ/פְנֵ֥י נְבֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/047.yaml
  text: They set out from Almon-diblathaim and camped in the mountains of Abarim[a], before Nebo.
translation:
  language: sw
  text: Wakasafiri kutoka Almon-diblathaimu, wakapiga kambi katika milima ya Abarimu, mbele ya Nebo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkabala na Nebo.” Kihusishi cha Kiebrania kinaonyesha uhusiano wa mahali bila kubainisha maana hususa zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakasafiri
  rationale: Katika mtindo wa orodha ya safari ya Hesabu 33, kitenzi נסע kinaonyesha kuondoka kambini na kuendelea na safari; “wakasafiri” ni Kiswahili cha kawaida na huendeleza mtiririko huo.
- source_word: מֵעַלְמֹן דִּבְלָתָיְמָה
  choice: kutoka Almon-diblathaimu
  rationale: Ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa; kiunganishi kinahifadhi jina hilo kuwa toponimu moja.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika orodha hii humaanisha kusimama na kuweka kambi; “kupiga kambi” ni usemi wa sasa na wa kawaida wa Kiswahili.
- source_word: בְּהָרֵי
  choice: katika milima ya
  rationale: Ni wingi wa neno הַר katika hali ya muundo; “katika milima ya” huonyesha eneo la kambi ndani ya sehemu hiyo yenye milima bila kulazimisha maana ya kuwa juu ya vilele.
- source_word: הָעֲבָרִים
  choice: Abarimu
  rationale: Hapa ni jina maalumu la kijiografia, kwa hiyo limetoholewa; halijatafsiriwa kwa maana yake ya kimsingi inayohusiana na maeneo ya ng’ambo.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Neno hili huonyesha uhusiano wa mahali, yaani kuwa mbele ya au kukabiliana na kitu, bila kubainisha kwa lazima mwelekeo halisi.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Ni jina maalumu la mahali na limetoholewa kwa namna iliyozoeleka katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi mfululizo “wakasafiri… wakapiga kambi” unafaa mtindo wa simulizi la ratiba, huku majina ya maeneo yakitoholewa kwa umbo linalotamkika kwa urahisi katika Kiswahili.
