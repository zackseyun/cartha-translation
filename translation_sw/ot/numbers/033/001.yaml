base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/001.yaml
  text: These are the stages of the journey of the sons of Israel[a], who went out from the land of Egypt by their companies[d][c][b], under the hand of Moses and Aaron.
translation:
  language: sw
  text: Hizi ndizo hatua za safari za wana wa Israeli[a], waliotoka katika nchi ya Misri kwa vikosi vyao[b], wakiongozwa na Musa na Aroni.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “safari za wana wa Israeli” au “kuondoka kwa wana wa Israeli.” Neno la Kiebrania linamaanisha hatua mbalimbali zilizofuatana katika ratiba ya safari yao. “Wana wa Israeli” inaweza pia kutafsiriwa “Waisraeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “kulingana na majeshi yao” au “kwa makundi yao.” Kiebrania kinaweza kuonyesha mpangilio wenye sura ya kijeshi.
    reason: lexical_alternative
  - marker: c
    text: Kwa Kiebrania, “kwa mkono wa Musa na Aroni,” yaani, kwa utendaji au chini ya uongozi wao.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה מַסְעֵי
  choice: Hizi ndizo hatua za safari
  rationale: Kishazi hiki kinatanguliza orodha ya vituo au hatua zilizofuatana katika safari. “Hatua za safari” huonyesha mpangilio huo vizuri kuliko “safari” pekee.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania, unaolitaja taifa lililotokana na Israeli; katika muktadha huu unawahusu watu wote, si wanaume pekee.
- source_word: אֲשֶׁר יָצְאוּ מֵאֶרֶץ מִצְרַיִם
  choice: waliotoka katika nchi ya Misri
  rationale: Hufuata kwa uwazi kishazi tegemezi cha Kiebrania na kuhifadhi neno “nchi.”
- source_word: לְצִבְאֹתָם
  choice: kwa vikosi vyao
  rationale: Neno linaonyesha makundi yaliyopangwa kwa utaratibu na linaweza pia kuwa na maana ya kijeshi. “Vikosi” huhifadhi maana hiyo bila kuongeza kwamba walikuwa wakipigana.
- source_word: בְּיַד מֹשֶׁה וְאַהֲרֹן
  choice: wakiongozwa na Musa na Aroni
  rationale: “Kwa mkono wa” ni nahau ya Kiebrania inayoonyesha utendaji au uongozi. Kiswahili cha asili hueleza maana hiyo kwa “wakiongozwa na.”
