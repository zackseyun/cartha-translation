  text: They set out from Bene-jaakan and camped at Hor-haggidgad[a].
translation:
  language: sw
  text: Wakaondoka kutoka Bene-Yaakani, wakapiga kambi katika Hor-Hagidgadi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina la Kiebrania Bene-Yaakani huenda ni jina la mahali, ingawa maana yake ya moja kwa moja ni “wana wa Yaakani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika mtindo wa orodha ya vituo vya safari jangwani, kitenzi נסע kinaonyesha kuondoka katika kituo kimoja kuelekea kingine. “Wakaondoka” ni Kiswahili cha kawaida na cha sasa.
- source_word: מִבְּנֵי יַעֲקָן
  choice: Bene-Yaakani
  rationale: Hapa umbo hili linatumika kama jina la mahali, si maelezo ya kikundi cha watu; kwa hiyo limetoholewa badala ya kutafsiriwa moja kwa moja kuwa “wana wa Yaakani.” Kiambishi מִן kimewasilishwa kupitia kitenzi “wakaondoka,” ambacho kwa Kiswahili huweza kutaja moja kwa moja mahali pa kuondokea.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika mtindo huu wa safari humaanisha kusimama na kuweka kambi. “Wakapiga kambi” ni usemi wa asili na unaoeleweka kwa urahisi katika Kiswahili cha Afrika Mashariki.
- source_word: בְּחֹר הַגִּדְגָּד
  choice: huko Hor-Hagidgadi
  rationale: Ni jina la mahali, hivyo limetoholewa. “Huko” huonyesha mahali pa kupiga kambi kwa mtiririko wa kawaida wa Kiswahili; konsonanti maradufu ya Kiebrania haijaonyeshwa, na vokali ya mwisho imeongezwa ili jina litamkike kwa kawaida katika Kiswahili.
