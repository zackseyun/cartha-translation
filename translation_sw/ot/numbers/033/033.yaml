  text: Wakaondoka Hori-hagidgadi, wakapiga kambi Yotbatha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika mfumo wa orodha ya vituo vya jangwani, kitenzi נסע humaanisha kuondoka katika kituo kimoja ili kuendelea na safari. “Wakaondoka” ni Kiswahili cha kawaida na wazi.
- source_word: מֵחֹר הַגִּדְגָּד
  choice: Hor-hagidgadi
  rationale: Kihusishi מִן kinaonyesha mahali walikotoka. Jina la mahali limetoholewa badala ya kutafsiriwa, na kistari kinaonyesha uhusiano wa sehemu zake.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Katika muktadha wa safari, חנה ni kusimama na kuweka kambi. “Wakapiga kambi” ni usemi wa asili na unaoeleweka katika Kiswahili cha sasa.
- source_word: בְּיָטְבָתָה
  choice: Yotbatha
  rationale: Kihusishi בְּ kinaonyesha mahali walipopiga kambi. Jina la mahali limetoholewa kwa mfumo unaofaa Kiswahili.
