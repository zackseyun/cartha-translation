  yaml_path: translation/ot/numbers/033/006.yaml
  text: They set out from Sukkoth and camped at Etham[a], which is at the edge of the wilderness.
translation:
  language: sw
  text: Wakaondoka Sukothi, wakapiga kambi Ethamu, iliyoko ukingoni mwa nyika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpakani mwa nyika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Kitenzi נסע katika orodha ya safari humaanisha kuondoka mahali ili kuendelea na safari; “wakaondoka” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: מִסֻּכֹּת
  choice: Sukothi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, bila kutafsiri maana ya jina.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה humaanisha kuweka kambi; “kupiga kambi” ni usemi wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: בְאֵתָם
  choice: Ethamu
  rationale: Jina la mahali limetoholewa kwa muundo unaofaa matamshi ya Kiswahili; kiambishi ב hapa kinaonyesha mahali walipoweka kambi.
- source_word: אֲשֶׁר
  choice: iliyokuwa
  rationale: Huanzisha kishazi tegemezi kinachoeleza mahali paitwapo Ethamu.
- source_word: בִּקְצֵה
  choice: ukingoni mwa
  rationale: Neno קצה hueleza mwisho au mpaka wa eneo; “ukingoni mwa” huhifadhi taswira ya kijiografia bila kudai kuwa ni mpaka rasmi.
- source_word: הַמִּדְבָּר
  choice: nyika
  rationale: Neno מִדְבָּר humaanisha eneo lisilolimwa au pori kame, si lazima jangwa la mchanga; “nyika” ni neno la Kiswahili linalofaa katika muktadha huu.
