  yaml_path: translation/ot/numbers/033/015.yaml
  text: They set out from Rephidim and camped in the wilderness of Sinai.
translation:
  language: sw
  text: Wakaondoka Refidimu, wakapiga kambi katika nyika ya Sinai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika fomula ya orodha ya safari, kitenzi נסע kinaonyesha kuondoka katika kituo kimoja ili kuendelea na safari. “Wakaondoka” ni Kiswahili cha kawaida na cha asili.
- source_word: מֵרְפִידִם
  choice: Refidimu
  rationale: Kiambishi מ־ kinaonyesha mahali walikotoka. Jina la mahali רְפִידִם limetoholewa kuwa “Refidimu,” kwa namna inayoeleweka katika Kiswahili.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika masimulizi ya safari jangwani humaanisha kusimama na kuweka kambi. “Wakapiga kambi” ni usemi wa sasa, wazi na wa kawaida.
- source_word: בְּמִדְבַּר סִינָי
  choice: katika nyika ya Sinai
  rationale: מִדְבָּר hurejelea eneo lisilolimwa au la porini, si lazima jangwa kavu kabisa; “nyika” inadumisha upana huo wa maana. Muundo wa uhusiano umeonyeshwa kwa “ya Sinai.”
