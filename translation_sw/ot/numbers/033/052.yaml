  text: וְ/ה֨וֹרַשְׁתֶּ֜ם אֶת כָּל יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ מִ/פְּנֵי/כֶ֔ם וְ/אִ֨בַּדְתֶּ֔ם אֵ֖ת כָּל מַשְׂכִּיֹּתָ֑/ם וְ/אֵ֨ת כָּל צַלְמֵ֤י מַסֵּֽכֹתָ/ם֙ תְּאַבֵּ֔דוּ וְ/אֵ֥ת כָּל בָּמֹתָ֖/ם תַּשְׁמִֽידוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/052.yaml
  text: and you shall drive out all the inhabitants of the land from before you[a], and you shall destroy all their figured stones, and all their cast-metal images you shall destroy[b], and all their high places you shall demolish.
translation:
  language: sw
  text: Wafukuzeni wenyeji wote wa nchi kutoka mbele yenu. Haribuni vitu vyao vyote vyenye michoro[a], na sanamu zao zote za metali iliyomiminwa mziharibu[b]; pia bomoeeni maeneo yao yote ya ibada yaliyo kwenye miinuko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sanamu zao zote zilizochongwa.” Neno la Kiebrania מַשְׂכִּיּוֹת linamaanisha vitu vyenye taswira au michoro; umbo lake hususa na nyenzo iliyotumiwa havijulikani kwa uhakika.
    reason: lexical_alternative
  - marker: b
    text: Au “sanamu zao zote za metali iliyoyeyushwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: Muwafukuze
  rationale: Kitenzi cha Kiebrania katika Hifili hapa kina maana ya kuwaondoa wakaaji waliopo au kuwafanya wapoteze umiliki. “Muwafukuze” ni amri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: wenyeji wote wa nchi
  rationale: Kirai hiki kinamaanisha watu wanaoishi katika nchi hiyo. “Wenyeji” ni kifupi, cha kawaida, na kinafaa katika muktadha.
- source_word: מִפְּנֵיכֶם
  choice: kutoka mbele yenu
  rationale: Tafsiri hii inadumisha taswira ya nahau ya Kiebrania bila kuifanya isieleweke katika Kiswahili.
- source_word: וְאִבַּדְתֶּם / תְּאַבֵּדוּ
  choice: Mharibu / mharibu
  rationale: Kitenzi אבד katika Pieli hapa kinaagiza kuangamizwa kwa vitu vya ibada. Kurudia “mharibu” kunahifadhi urudiaji na msisitizo wa Kiebrania.
- source_word: מַשְׂכִּיֹּתָם
  choice: mawe yao yote yenye michoro
  rationale: Neno hili linaelekea kumaanisha vitu vyenye taswira au nakshi, huenda vikiwa vya mawe. Tafsiri inatoa maana halisi inayowezekana huku tanbihi ikihifadhi kutokuwa na uhakika kuhusu umbo au kitu kilichotumiwa.
- source_word: צַלְמֵי מַסֵּכֹתָם
  choice: sanamu zao zote za metali ya kumiminwa
  rationale: צֶלֶם ni sanamu au taswira, na מַסֵּכָה hudokeza kitu kilichotengenezwa kwa kumimina metali iliyoyeyushwa. Kauli hii ni wazi na ya kisasa.
- source_word: בָּמֹתָם
  choice: maeneo yao yote ya ibada yaliyo kwenye miinuko
  rationale: בָּמוֹת ni maeneo ya ibada yaliyoinuka. Tafsiri hii inaeleza maana ya kiibada na ya kijiografia kwa Kiswahili cha kawaida.
- source_word: תַּשְׁמִידוּ
  choice: mbomoe
  rationale: Kitenzi שׁמד katika Hifili hapa kinahusu kuondoa kabisa maeneo ya ibada. “Mbomoe” kinafaa kwa maeneo au miundo na kinaonyesha uharibifu wa makusudi.
theological_decisions:
- issue: Amri zinazohusu wakaaji wa Kanaani na ibada zao
  choice: Aya imetafsiriwa moja kwa moja kama amri ya kuwaondoa wenyeji na kuharibu sanamu pamoja na maeneo yao ya ibada.
  alternative: Kutafsiri kitenzi cha kwanza kwa maana dhaifu zaidi ya kuwanyang’anya umiliki tu, au kujumlisha vitu vya ibada kuwa ‘desturi za kipagani.’
  rationale: Kiebrania kinataja wazi kuondolewa kwa wenyeji na kuharibiwa kwa vitu na maeneo mahususi ya ibada. Tafsiri haipunguzi ukali wa amri wala kuongeza hoja ya kitheolojia ambayo haimo katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Miundo ya amri imetumiwa ili kuonyesha nguvu ya maagizo; urudiaji wa “mharibu” umehifadhiwa kwa msisitizo wa matini asili.
