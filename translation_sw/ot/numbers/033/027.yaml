  text: Wakaondoka Tahathi, wakapiga kambi Tera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika mtindo wa orodha ya safari za jangwani, נסע humaanisha kuondoa kambi na kuanza safari kuelekea kituo kingine. “Wakaondoka” ni Kiswahili cha kawaida na cha wazi kinachodumisha mfuatano wa safari.
- source_word: מִתָּחַת
  choice: Tahathi
  rationale: Kihusishi מִן kimedokezwa kwa muundo wa Kiswahili wa kitenzi “kuondoka,” huku jina תָּחַת likinakiliwa kuwa “Tahathi” kwa namna inayofaa matamshi na tahajia ya Kiswahili.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika taarifa hizi za safari humaanisha kusimamisha kambi. “Wakapiga kambi” ni usemi wa asili na unaoeleweka katika Kiswahili cha sasa.
- source_word: בְּתָרַח
  choice: Tera
  rationale: Kihusishi בְּ cha mahali kinawasilishwa kiasili na muundo “kupiga kambi Tera”; jina תָּרַח linanakiliwa kuwa “Tera,” umbo linalotumika kwa jina hili katika mapokeo ya Biblia ya Kiswahili.
