lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika orodha hii ya safari, kitenzi נסע humaanisha kung’oa kambi na kuendelea na safari; “wakaondoka” ni usemi wa kawaida na unaoeleweka kwa urahisi.
- source_word: מִקְּהֵלָתָה
  choice: Kehelatha
  rationale: Jina la mahali limetoholewa kwa kuzingatia matamshi ya Kiebrania, huku kihusishi מִן kikionyeshwa na muktadha wa kitenzi “wakaondoka.”
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika taarifa za safari humaanisha kusimama na kuweka kambi; “kupiga kambi” ni Kiswahili cha sasa na cha kawaida.
- source_word: בְּהַר
  choice: kwenye Mlima
  rationale: הַר hapa inafuatwa na jina maalumu la mahali, hivyo “Mlima” linafaa; kihusishi בְּ kimetafsiriwa “kwenye” kuonyesha mahali walipopiga kambi.
- source_word: שָׁפֶר
  choice: Shaferi
  rationale: 'Jina limetoholewa moja kwa moja kutoka Kiebrania: vokali zake zinaelekeza kwenye “Shafer,” na konsonanti פ isiyo na dagashi hutamkwa kama /f/; irabu ya mwisho imeongezwa ili jina lisomeke kwa urahisi katika Kiswahili.'
