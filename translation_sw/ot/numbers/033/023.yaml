  text: They set out from Kehelathah and camped at Mount Shepher[a].
translation:
  language: sw
  text: Wakaondoka Kehelatha, wakapiga kambi kwenye Mlima Shaferi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mlima Sheferi.” Hili ni toleo jingine la jina שָׁפֶר linalofuata mapokeo ya baadhi ya tafsiri.
