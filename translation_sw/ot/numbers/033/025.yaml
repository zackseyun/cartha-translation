  yaml_path: translation/ot/numbers/033/025.yaml
  text: They set out from Haradah and camped at Makheloth[a].
translation:
  language: sw
  text: Wakaondoka kutoka Harada, wakapiga kambi Makhelothi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika fomula ya ratiba ya jangwani, kitenzi נסע kinaonyesha kuondoka mahali pa kambi ili kuendelea na safari. “Wakaondoka” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: מֵחֲרָדָה
  choice: Harada
  rationale: Kiambishi מֵ־ kinaonyesha mahali walikotoka; maana hiyo tayari imo katika muundo wa Kiswahili “wakaondoka Harada.” Jina la mahali limetoholewa badala ya kutafsiriwa.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika taarifa za safari humaanisha kuweka au kupiga kambi. “Wakapiga kambi” ni usemi wa asili na unaoeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: בְּמַקְהֵלֹת
  choice: Makhelothi
  rationale: Kiambishi בְ־ hapa kinaonyesha mahali pa kupiga kambi. Baada ya “wakapiga kambi,” Kiswahili hakihitaji kihusishi kingine. Jina limetoholewa kwa kuzingatia matamshi ya Kiebrania.
