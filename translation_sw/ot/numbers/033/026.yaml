  text: They set out from Makheloth and camped at Tahath.
translation:
  language: sw
  text: Wakaondoka kutoka Makhelothi, wakapiga kambi Tahathi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika mtindo wa orodha ya safari jangwani, kitenzi נסע kinaonyesha kuondoka katika kituo kimoja kuelekea kingine. “Wakaondoka” ni Kiswahili cha sasa na cha kawaida.
- source_word: מִמַּקְהֵלֹת
  choice: Makhelothi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili; kiambishi מִן (“kutoka”) kinaelezwa tayari na kitenzi “wakaondoka,” ambacho katika Kiswahili huweza kufuatwa moja kwa moja na mahali pa kuondokea.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה katika taarifa za safari humaanisha kusimama na kuweka kambi. “Kupiga kambi” ni usemi wa kawaida na ulio wazi katika Kiswahili cha kisasa.
- source_word: בְּתָחַת
  choice: Tahathi
  rationale: Hili ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa kama neno la kawaida. Kiambishi בְּ cha mahali kinaelezwa kiasili na muundo wa Kiswahili “kupiga kambi” ukifuatwa na jina la mahali.
