reference: Numbers 23:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֤י לֹא נַ֨חַשׁ֙ בְּ/יַעֲקֹ֔ב וְ/לֹא קֶ֖סֶם בְּ/יִשְׂרָאֵ֑ל כָּ/עֵ֗ת יֵאָמֵ֤ר לְ/יַעֲקֹב֙ וּ/לְ/יִשְׂרָאֵ֔ל מַה פָּ֖עַל אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/023.yaml
  text: For there is no divination in Jacob[a], and no sorcery in Israel; at the proper time it will be said to Jacob and to Israel[b], ‘What God has done!’
translation:
  language: sw
  text: Kwa maana hakuna uaguzi katika Yakobo[a], wala hakuna uchawi katika Israeli. Kwa wakati unaofaa itaambiwa Yakobo na Israeli, “Tazama alichofanya Mungu!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuna uaguzi dhidi ya Yakobo, wala uchawi dhidi ya Israeli.” Kihusishi cha Kiebrania kinaweza kueleweka kwa njia zaidi ya moja; muktadha unaweza kuonyesha kwamba uaguzi na uchawi haviwezi kuwa na nguvu dhidi ya Israeli.
    reason: alternative_reading
  - marker: b
    text: Au, “Mungu amefanya nini?” Hapa maneno ya Kiebrania yanaeleweka vizuri zaidi kama mshangao wa kutangaza tendo la Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַשׁ
  choice: uaguzi
  rationale: Neno hili linamaanisha desturi ya kutafuta habari au ishara kwa njia za kifumbo; “uaguzi” ni neno la kawaida na wazi katika Kiswahili.
- source_word: קֶסֶם
  choice: uchawi
  rationale: Neno hili linahusu shughuli za siri za kichawi au za kubashiri. “Uchawi” hulitofautisha kwa kiasi na נַחַשׁ huku ukihifadhi uhusiano wa maana.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: katika Yakobo / katika Israeli
  rationale: Kihusishi ב kimewasilishwa kwa maana yake ya moja kwa moja “katika,” huku uwezekano wa maana ya “dhidi ya” ukihifadhiwa katika tanbihi kwa sababu muktadha wa kauli ya Balaamu unaweza kuielekeza huko.
- source_word: כָּעֵת
  choice: kwa wakati unaofaa
  rationale: Kirai kinaweza kumaanisha “wakati huu/sasa” au wakati unaolingana na tukio; “kwa wakati unaofaa” hudumisha wazo la wakati mwafaka bila kulifanya kuwa tarehe iliyowekwa wazi.
- source_word: יֵאָמֵר
  choice: itaambiwa
  rationale: Huhifadhi kauli tendwa ya kitenzi cha Kiebrania na mwelekeo wake wa wakati ujao katika kauli hii ya kinabii.
- source_word: לְיַעֲקֹב וּלְיִשְׂרָאֵל
  choice: Yakobo na Israeli
  rationale: Baada ya “itaambiwa,” Kiswahili hakihitaji kurudia kihusishi; muundo huu unasomeka kwa kawaida na bado unaonyesha kwamba ujumbe utaelekezwa kwa Yakobo na Israeli.
- source_word: מַה פָּעַל אֵל
  choice: Tazama alichofanya Mungu!
  rationale: מַה hapa imeeleweka kama mshangao wa kutangaza ukuu wa tendo la Mungu, si swali. “Tazama” huwasilisha nguvu hiyo ya mshangao kwa Kiswahili cha kawaida.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa אֵל ni jina la kawaida la Mungu; muktadha haulazimishi nyongeza kama “Mungu Mwenyezi.”
theological_decisions:
- issue: Je, mstari unakanusha kuwapo kwa desturi za uaguzi ndani ya Israeli au uwezo wake dhidi ya Israeli?
  choice: Maandishi makuu yanasema “katika Yakobo/Israeli,” yakifuata kwa karibu kihusishi cha Kiebrania.
  alternative: “Dhidi ya Yakobo/Israeli,” yaani uaguzi na uchawi haviwezi kuwadhuru au kuwatawala.
  rationale: Kihusishi ב kinaweza kueleweka kwa namna zaidi ya moja. Tafsiri ya moja kwa moja imehifadhiwa katika maandishi, na maana inayopendekezwa na muktadha wa kutoweza kulaani Israeli imewekwa tanbihini ili kutofuta utata halisi.
- issue: Je, מַה פָּעַל אֵל ni swali au mshangao?
  choice: 'Mshangao: “Tazama alichofanya Mungu!”'
  alternative: 'Swali: “Mungu amefanya nini?”'
  rationale: Muktadha wa kauli ya kinabii unafikia kilele katika kutangaza tendo kuu la Mungu kwa niaba ya Israeli; hivyo mshangao unafaa zaidi, ingawa umbo la Kiebrania linaweza kuonekana kama swali bila muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa urahisi. “Uaguzi” na “uchawi” ni istilahi za kawaida; “Tazama alichofanya Mungu!” hudumisha nguvu ya kishairi ya kauli.
