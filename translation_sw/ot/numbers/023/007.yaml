base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/007.yaml
  text: 'Then he took up his discourse and said: “From Aram Balak king of Moab has led me[a], from the mountains of the east: ‘Come, curse Jacob for me; yes, come[c][b], denounce Israel.’”'
translation:
  language: sw
  text: 'Ndipo akatamka tamko lake la kishairi[a], akasema:


    “Balaki, mfalme wa Moabu, ameniongoza kutoka Aramu,


    kutoka milima ya mashariki[b]:


    ‘Njoo, unilaanie Yakobo;


    njoo, uitamkie Israeli laana[c].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usemi wake rasmi.” Kiebrania ni, kwa maana halisi, “akainua mashal yake,” nahau inayotanguliza tamko rasmi la kishairi.
    reason: lexical_alternative
  - marker: b
    text: Au “kutoka milima ya upande wa mashariki.” Usemi wa Kiebrania huenda unarejelea eneo lililokuwa mashariki mwa Moabu.
    reason: lexical_alternative
  - marker: c
    text: Kitenzi hiki ni tofauti na kile kilichotafsiriwa “laani” katika mstari uliotangulia. Kinaweza pia kutafsiriwa “ikemee kwa ghadhabu” au “ilaani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: akatamka tamko lake la kishairi
  rationale: Nahau hii ya Kiebrania huanzisha tamko rasmi la kishairi. Tafsiri hii ni ya kawaida na yenye hadhi katika Kiswahili, bila kuibana מָשָׁל kuwa methali wala kuipa moja kwa moja maana mahsusi ya unabii.
- source_word: מִן אֲרָם
  choice: kutoka Aramu
  rationale: Aramu ni jina la mahali; limetoholewa badala ya kubadilishwa kuwa jina la kisasa au la baadaye la eneo hilo.
- source_word: יַנְחֵנִי
  choice: ameniongoza
  rationale: Hifili ya נחה ina maana ya kuongoza au kuelekeza. ‘Ameniongoza’ inadumisha maana hiyo ya kisababishi na mwendo ulioelekezwa.
- source_word: מֵהַרְרֵי קֶדֶם
  choice: kutoka milima ya mashariki
  rationale: Katika muktadha huu קֶדֶם inaeleweka vizuri zaidi kijiografia kuwa ‘mashariki,’ sambamba na Aramu kama eneo alikotoka Balaamu.
- source_word: לְכָה
  choice: Njoo
  rationale: Amri hii inafanya kazi kama mwito au ombi la kwenda kutenda jambo; ‘Njoo’ ni usemi wa asili katika Kiswahili.
- source_word: אָרָה
  choice: unilaanie
  rationale: Kitenzi kina maana wazi ya kulaani, na kiambishi ‘-ni-’ kinawakilisha לִי, yaani kutenda kwa niaba au manufaa ya Balaki.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina la mtu na taifa limedumishwa kwa umbo lake la kawaida la Kiswahili.
- source_word: זֹעֲמָה
  choice: uitamkie ... laana kali
  rationale: Kitenzi hiki ni tofauti na אָרָה na hubeba nguvu ya kulaani au kutamka kwa ghadhabu. Usemi huu unadumisha uzito wake na kutofautisha maneno hayo mawili kwa Kiswahili kinachoeleweka.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la mtu na taifa limedumishwa kwa umbo lake la kawaida la Kiswahili.
theological_decisions:
- issue: Uhusiano wa Yakobo na Israeli katika ombi lililonukuliwa la Balaki
  choice: Majina yote mawili yametafsiriwa tofauti kama majina sambamba ya watu wale wale wa agano.
  alternative: Kuyafupisha yote kuwa neno moja kama ‘Waisraeli.’
  rationale: Kiebrania kinatumia kwa makusudi majina ‘Yakobo’ na ‘Israeli’ katika usambamba wa kishairi. Kuyadumisha kunahifadhi mwangwi wa kifasihi na wa agano bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi wenye hadhi lakini unaoeleweka kwa msomaji wa kawaida. Mistari imepangwa ili kuhifadhi usambamba wa Yakobo/Israeli na muundo wa tamko la Balaamu.
