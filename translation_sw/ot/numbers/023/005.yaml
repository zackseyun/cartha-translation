  text: וַ/יָּ֧שֶׂם יְהוָ֛ה דָּבָ֖ר בְּ/פִ֣י בִלְעָ֑ם וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/005.yaml
  text: Then Yahweh put a word in Balaam’s mouth and said[a], “Return to Balak, and thus you shall speak.”
translation:
  language: sw
  text: Ndipo Yahwe akaweka neno kinywani mwa Balaamu, akasema, “Rudi kwa Balaki, na hivi utasema[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “na useme hivi.”'
    reason: Kitenzi cha Kiebrania kinaweza kutolewa kwa wakati ujao wenye nguvu ya agizo au kwa amri ya moja kwa moja.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: akaweka
  rationale: Kitenzi שׂוּם kina maana ya kuweka au kuleta mahali fulani. “Akaweka” kinahifadhi taswira halisi ya Mungu kuweka neno kinywani mwa Balaamu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: דָּבָר
  choice: neno
  rationale: Nomino ya umoja דָּבָר inaweza kumaanisha neno, jambo, au ujumbe. “Neno” linafuata idadi ya Kiebrania na kudumisha nahau ya kuweka neno kinywani mwa mtu.
- source_word: בְּפִי בִלְעָם
  choice: kinywani mwa Balaamu
  rationale: Hili ni tamko la karibu kabisa na nahau ya Kiebrania, na ni Kiswahili cha kawaida kinachoeleweka.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Katika muktadha, Yahwe anamwelekeza Balaamu moja kwa moja. “Akamwambia” ni ya asili zaidi kwa Kiswahili kuliko “akasema” bila kutaja anayesemeshwa.
- source_word: שׁוּב אֶל בָּלָק
  choice: Rudi kwa Balaki
  rationale: “Rudi” linaonyesha amri ya kurejea; “kwa Balaki” linaeleza kwa kawaida kuelekea kwa mtu.
- source_word: וְכֹה תְדַבֵּר
  choice: nawe utasema hivi
  rationale: כֹה humaanisha “hivi/namna hii,” na תְדַבֵּר ni usemi wenye nguvu ya agizo katika muktadha. Kiswahili hiki ni cha kawaida na kinahifadhi maana hiyo.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Chanzo cha maneno ya Balaamu
  choice: Yahwe akaweka neno kinywani mwa Balaamu
  alternative: Yahwe alimpa Balaamu ujumbe
  rationale: Tafsiri iliyochaguliwa inadumisha taswira thabiti ya Kiebrania na kuonyesha kwamba maneno ya Balaamu yalitoka kwa Yahwe, bila kufafanua zaidi namna msukumo huo ulivyotokea.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kinywani mwa Balaamu” kinadumisha taswira ya chanzo, huku “nawe utasema hivi” kikitoa agizo kwa lugha ya sasa.
