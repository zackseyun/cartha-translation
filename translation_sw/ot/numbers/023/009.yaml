base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/009.yaml
  text: For from the top of the rocks I see him[a], and from the hills I behold him. Look, a people dwelling alone, and not reckoning itself among the nations.
translation:
  language: sw
  text: 'Kwa maana kutoka vilele vya miamba ninawaona,

    na kutoka vilimani ninawatazama.

    Tazama, ni watu wanaokaa peke yao,

    wala hawajihesabu kuwa miongoni mwa mataifa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala hawatahesabiwa miongoni mwa mataifa.” Kitenzi cha Kiebrania kinaweza kueleweka kwa maana ya kutendwa, na pia kwa maana ya kujirejelea au ya kati.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huunganisha mstari huu na unabii uliotangulia kwa kutoa maelezo, bila kulazimisha maana ya sababu kwa kiwango kisichohitajika.
- source_word: מֵרֹאשׁ צֻרִים
  choice: kutoka vilele vya miamba
  rationale: Katika muktadha wa mandhari, רֹאשׁ humaanisha kilele; wingi wa Kiswahili unasikika kwa kawaida kwa vilele vya miamba ambako Balaamu anatazamia.
- source_word: אֶרְאֶנּוּ
  choice: ninawaona
  rationale: Kiebrania humrejelea Israeli kwa kiwakilishi cha umoja kama jamii moja. Kiswahili cha kawaida hutumia upatanisho wa wingi kwa ‘watu,’ hivyo ‘ninawaona’ huhifadhi rejeo la pamoja bila usemi usio wa kawaida.
- source_word: וּמִגְּבָעוֹת
  choice: na kutoka vilimani
  rationale: Huwasilisha picha ya kutazama kutoka kwenye vilima na kudumisha ulinganifu wa kishairi na mstari wa kwanza.
- source_word: אֲשׁוּרֶנּוּ
  choice: ninawatazama
  rationale: Kitenzi hiki kinaashiria kuona au kutazama kwa makini; ‘ninawatazama’ hukitofautisha kwa kiasi na ראה huku kikibaki cha kawaida na chenye hadhi.
- source_word: הֶן
  choice: Tazama
  rationale: Ni neno la kuelekeza usikivu kwenye jambo linalofuata; ‘Tazama’ linafaa kwa ushairi wa kinabii na linaeleweka katika Kiswahili cha sasa.
- source_word: עָם
  choice: watu
  rationale: Hurejelea jamii yenye utambulisho wa pamoja. ‘Watu’ hutofautisha jamii hiyo na ‘mataifa’ yanayotajwa baadaye.
- source_word: לְבָדָד יִשְׁכֹּן
  choice: wanaokaa peke yao
  rationale: Huonyesha hali ya watu hawa kuwa tofauti au kujitenga, huku imperfect ikisomwa kama sifa yao ya kawaida bila kuondoa kabisa mwelekeo wa kinabii.
- source_word: וּבַגּוֹיִם
  choice: miongoni mwa mataifa
  rationale: Hutoa kwa kawaida wazo la kujumlishwa pamoja na jamii nyingine za kitaifa.
- source_word: לֹא יִתְחַשָּׁב
  choice: wala hawajihesabu kuwa
  rationale: 'Huhifadhi maana ya kujirejelea ya umbo la Hitpael: watu hawa hawajiweki katika hesabu au kundi la mataifa mengine. Usomaji wa hali ya kutendwa unabaki katika tanbihi.'
theological_decisions:
- issue: Je, יִתְחַשָּׁב ieleweke kwa maana ya kujirejelea au ya kutendwa?
  choice: wala hawajihesabu kuwa miongoni mwa mataifa
  alternative: wala hawahesabiwi miongoni mwa mataifa
  rationale: Umbo la Hitpael linaweza kuwa la kujirejelea au la kati, lakini pia linaweza kueleweka kwa maana ya kutendwa. Matini kuu inadumisha maana ya kujirejelea, na tanbihi inahifadhi usomaji mwingine unaowezekana bila kuamua mvutano huo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari imepangwa ili kudumisha ulinganifu wa ushairi wa Kiebrania. Upatanisho wa wingi umetumiwa kwa ‘watu’ badala ya kuiga kiwakilishi cha umoja cha Kiebrania kwa namna isiyo ya kawaida katika Kiswahili.
