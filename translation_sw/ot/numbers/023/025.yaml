lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa kawaida wa masimulizi unaoendeleza tukio; ‘akamwambia’ ni wa asili katika Kiswahili na unaonyesha msemaji pamoja na anayesemeshwa.
- source_word: בָּלָק
  choice: Balaki
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: בִּלְעָם
  choice: Balaamu
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: גַּם ... גַּם
  choice: '... wala ...'
  rationale: Katika vifungu viwili vya kukataza, ‘wala’ huunganisha makatazo kwa Kiswahili cha kawaida na kuhifadhi ulinganifu wa Kiebrania.
- source_word: קֹב לֹא תִקֳּבֶנּוּ
  choice: Usimlaani hata kidogo
  rationale: Kitenzi-jina kamili kinachofuatiwa na kitenzi chenye ukomo kinasisitiza katazo. ‘Hata kidogo’ huwasilisha mkazo huo kwa lugha ya kawaida.
- source_word: בָּרֵךְ לֹא תְבָרֲכֶנּוּ
  choice: wala usimbariki hata kidogo
  rationale: Muundo sambamba wa kitenzi-jina kamili na kitenzi chenye ukomo unasisitiza katazo la pili; kurudia ‘hata kidogo’ kunahifadhi uwiano na mkazo.
