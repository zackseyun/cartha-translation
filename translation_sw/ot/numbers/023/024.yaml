  variant: Standard East African Swahili
source:
  edition: WLC
  text: הֶן עָם֙ כְּ/לָבִ֣יא יָק֔וּם וְ/כַ/אֲרִ֖י יִתְנַשָּׂ֑א לֹ֤א יִשְׁכַּב֙ עַד יֹ֣אכַל טֶ֔רֶף וְ/דַם חֲלָלִ֖ים יִשְׁתֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/024.yaml
  text: Look[a], a people rises like a lioness, and lifts itself up like a lion; it will not lie down until it eats the prey and drinks the blood of the slain.
translation:
  language: sw
  text: Tazama, watu wanainuka kama simba jike[a], wanajiinua kama simba; hawatalala mpaka watakapokula mawindo na kunywa damu ya waliouawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “simba.” Neno la Kiebrania לָבִיא linaweza kutafsiriwa kwa maana ya jumla kuwa “simba,” lakini “simba jike” linahifadhi tofauti ya msamiati na אֲרִי (“simba”) katika sehemu inayofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Tazama
  rationale: Kiingizi hiki kinavuta fikira kwa msisitizo. “Tazama” ni cha heshima, kinaeleweka kwa urahisi, na kinadumisha nguvu ya usemi wa kishairi.
- source_word: עָם
  choice: watu
  rationale: Neno hili linamaanisha kundi la watu, hapa Israeli. “Watu” linahifadhi maana hiyo ya pamoja bila kulazimisha dhana pana zaidi ya kisiasa iliyomo katika “taifa.”
- source_word: כְּלָבִיא
  choice: kama simba jike
  rationale: לָבִיא linaweza kumaanisha simba kwa ujumla, lakini katika ushairi mara nyingi hueleweka kuwa simba jike. “Simba jike” pia linahifadhi tofauti ya msamiati na אֲרִי katika mstari unaofuata.
- source_word: יָקוּם
  choice: wanainuka
  rationale: Kitenzi קום kinaonyesha kuinuka au kusimama. Wakati wa sasa wa kishairi unafanya taswira ya mnyama anayeinuka iwe hai na ya moja kwa moja.
- source_word: וְכַאֲרִי
  choice: kama simba
  rationale: אֲרִי ni neno la kawaida kwa simba. Tafsiri hii inadumisha ulinganifu bila kuongeza wazo la umri, ukubwa, au jinsia.
- source_word: יִתְנַשָּׂא
  choice: wanajiinua
  rationale: Muundo wa kitenzi unaonyesha kujinyanyua au kujiweka juu. “Wanajiinua” linafaa kwa mkao wa simba anayejitayarisha na halibadili taswira kuwa kauli ya majivuno ya kiroho.
- source_word: לֹא יִשְׁכַּב
  choice: hawatalala
  rationale: Hali ya baadaye inafaa katika muktadha huu wa kinabii, huku “kulala” kikihifadhi taswira halisi ya simba kutotulia.
- source_word: עַד יֹאכַל טֶרֶף
  choice: mpaka watakapokula mawindo
  rationale: יֹאכַל maana yake ya msingi ni “kula,” na טֶרֶף ni mawindo. Tafsiri hii inadumisha nguvu ya taswira bila kuongeza ukali usio lazima kama “kurarua” au “kumeza kwa pupa.”
- source_word: וְדַם חֲלָלִים יִשְׁתֶּה
  choice: na kunywa damu ya waliouawa
  rationale: חֲלָלִים katika muktadha wa vita humaanisha waliouawa. Maneno haya yanahifadhi taswira kali ya ushindi wa kivita iliyomo katika Kiebrania.
theological_decisions:
- issue: Taswira ya ukatili katika unabii wa Balaamu
  choice: Kudumisha taswira ya kula mawindo na kunywa damu kama lugha ya mfano kuhusu ushindi wa kivita na nguvu isiyozuilika.
  alternative: Kulainisha maneno hayo yawe kauli ya jumla kuhusu ushindi.
  rationale: Kiebrania kimetumia makusudi taswira kali ya simba. Tafsiri haipaswi kuipunguza wala kuifanya kuwa amri ya kunywa damu kihalisi; mvutano wa kishairi unapaswa kubaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Upatanisho wa wingi umetumiwa kwa “watu,” ingawa Kiebrania kinawasilisha kundi hilo kwa umoja; taswira ileile ya simba imehifadhiwa katika sentensi nzima.
