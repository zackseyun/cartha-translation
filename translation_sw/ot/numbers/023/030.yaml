  text: So Balak did as Balaam had said, and he offered up a bull and a ram on the altar.
translation:
  language: sw
  text: Basi Balaki akafanya kama Balaamu alivyosema, akatoa fahali na kondoo dume kuwa dhabihu juu ya madhabahu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi עשה pamoja na כַּאֲשֶׁר אָמַר humaanisha kutenda kulingana na yale yaliyosemwa; “akafanya” ni ya kawaida na ya asili katika Kiswahili.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: Hutambulisha ulinganifu wa tendo la Balaki na maagizo ya Balaamu; “kama ... alivyosema” ni muundo wa kawaida wa Kiswahili.
- source_word: אָמַר
  choice: alivyosema
  rationale: Muundo huu unaonyesha kwamba kauli ya Balaamu ilitangulia tendo la Balaki bila kulazimisha matumizi yasiyo ya asili ya wakati timilifu.
- source_word: וַיַּעַל
  choice: akamtoa
  rationale: Katika muktadha wa dhabihu, עלה humaanisha kumtoa mnyama kama sadaka juu ya madhabahu; “akamtoa” huwasilisha tendo hilo kwa lugha ya kawaida na yenye heshima.
- source_word: פָּר
  choice: fahali
  rationale: “Fahali” ni neno la sasa na lililo wazi kwa ng’ombe dume wa dhabihu; maandishi hayalazimishi kuongeza “mchanga.”
- source_word: אַיִל
  choice: kondoo dume
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa אַיִל.
- source_word: בַּמִּזְבֵּחַ
  choice: juu ya madhabahu
  rationale: Kihusishi ב katika muktadha huu kinaonyesha mahali pa kutolea dhabihu; “juu ya madhabahu” ni tafsiri ya moja kwa moja na ya asili.
- source_word: וַ
  choice: Basi
  rationale: Waw ya mwanzo inaendeleza simulizi na kuonyesha matokeo ya maagizo yaliyotangulia; “Basi” huleta mtiririko huo kwa Kiswahili cha kawaida.
