review_pass:
  verdict: revise
  source_fidelity: Draft accurately renders the narrative sequence, the conformity to Balaam's instruction, the animals, and the altar. However, “akamtoa fahali na kondoo dume” is less idiomatic with two coordinated animals and can be read simply as ‘brought/took out’; the sacrificial force of העלה should be explicit.
  naturalness: The wording is generally fluent Standard East African Swahili. “Akatoa ... kuwa dhabihu” is more natural and unambiguously cultic in this context than “akamtoa.”
  terminology: Balaki, Balaamu, fahali, kondoo dume, and madhabahu are appropriate established terms. “Dhabihu” properly conveys the sacrificial sense without adding doctrinal interpretation.
  issues:
  - severity: medium
    issue: “akamtoa fahali na kondoo dume” is ambiguous and has mismatched singular wording for two animals.
    rationale: In Swahili, kutoa mnyama without a sacrificial complement may mean taking or bringing it out. The Hebrew העלה is a sacrificial offering verb here; “akatoa ... kuwa dhabihu” makes that sense clear while retaining the source meaning.
  revised_text: Basi Balaki akafanya kama Balaamu alivyosema, akatoa fahali na kondoo dume kuwa dhabihu juu ya madhabahu.
