  yaml_path: translation/ot/numbers/023/018.yaml
  text: 'Then he took up his discourse and said: “Rise[a], Balak, and hear; listen to me, son of Zippor.”'
translation:
  language: sw
  text: 'Kisha akatoa tamko lake[a], akasema:


    “Inuka, Balaki, usikie;

    nisikilize, mwana wa Sipori.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usemi wake wa kishairi” au “methali yake.” Neno la Kiebrania מָשָׁל linaweza kumaanisha methali, usemi wa mfano, au tamko rasmi la kishairi; hapa linatanguliza tamko la Balaamu lenye lugha ya juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: akatoa tamko lake
  rationale: Muungano huu wa maneno unaanzisha usemi rasmi wa kishairi. “Akatoa tamko lake” ni Kiswahili cha sasa, chenye hadhi, kinachowasilisha tendo la kutamka bila kulazimisha maana finyu ya unabii au methali.
- source_word: וַיֹּאמַר
  choice: na kusema
  rationale: Huu ni utangulizi wa kawaida wa maneno ya moja kwa moja; muundo huu unaunganika kwa kawaida na kitenzi kilichotangulia katika Kiswahili.
- source_word: קוּם
  choice: Inuka
  rationale: Amri hii imeelekezwa kwa Balaki. “Inuka” huhifadhi maana ya msingi na sauti rasmi kuliko usemi wa kimazungumzo kama “amka” au “ondoka.”
- source_word: וּשֲׁמָע
  choice: usikie
  rationale: “Usikie” huhifadhi kitenzi cha kwanza katika ulinganifu wa kishairi na kukitofautisha na mwito wenye mkazo zaidi unaofuata.
- source_word: הַאֲזִינָה עָדַי
  choice: nisikilize
  rationale: Kitenzi hiki humtaka Balaki atege sikio kwa makini, nacho kiwakilishi cha nafsi katika עָדַי kinaonyeshwa na “ni-.”
- source_word: בְּנוֹ צִפֹּר
  choice: mwana wa Sipori
  rationale: Muundo wa kumtaja mtu kwa baba yake umehifadhiwa, pamoja na sauti yake rasmi. “Sipori” ni unukuzi wa kawaida wa jina צִפֹּר katika Kiswahili.
