  text: מִ֤י מָנָה֙ עֲפַ֣ר יַעֲקֹ֔ב וּ/מִסְפָּ֖ר אֶת רֹ֣בַע יִשְׂרָאֵ֑ל תָּמֹ֤ת נַפְשִׁ/י֙ מ֣וֹת יְשָׁרִ֔ים וּ/תְהִ֥י אַחֲרִיתִ֖/י כָּמֹֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/010.yaml
  text: Who can count the dust of Jacob[a], or number the fourth part of Israel? Let my soul die the death of the upright[c][b], and let my end be like his.
translation:
  language: sw
  text: 'Ni nani anayeweza kuhesabu mavumbi ya Yakobo,

    au kuhesabu robo ya Israeli?[a]

    Nafsi yangu na ife kifo cha wanyoofu,[b]

    na mwisho wangu uwe kama wake.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu za Israeli”; au kwa ufafanuzi zaidi, “kuhesabu hata robo moja ya Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “waadilifu.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema kwa umoja, “kama wake.” Huenda kinamrejelea mtu mmoja mwakilishi aliye mnyoofu, ingawa “wanyoofu” ni kundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי מָנָה
  choice: Ni nani anayeweza kuhesabu
  rationale: Swali la balagha linaonyesha kutowezekana kwa kuhesabu; Kiswahili huleta maana hiyo kwa kawaida kwa kutumia “anayeweza.”
- source_word: עֲפַר יַעֲקֹב
  choice: mavumbi ya Yakobo
  rationale: Inadumisha sitiari ya Kiebrania inayodokeza wazao wengi wasiohesabika, huku jina Yakobo likibaki katika usambamba wa kishairi na Israeli.
- source_word: וּמִסְפָּר אֶת רֹבַע יִשְׂרָאֵל
  choice: au kuhesabu robo ya Israeli
  rationale: Muundo wa kitenzi ni wa kawaida katika Kiswahili na unaendeleza usambamba. “Robo” inadumisha maana ya karibu zaidi ya רֹבַע bila kuamua kimya kimya kuwa ni “umati.”
- source_word: תָּמֹת נַפְשִׁי
  choice: Nafsi yangu na ife
  rationale: Inahifadhi nafsi kama kiima cha Kiebrania na sauti ya kishairi ya ombi, bila kuibadili kuwa “nife” tu.
- source_word: מוֹת יְשָׁרִים
  choice: kifo cha wanyoofu
  rationale: “Wanyoofu” huwasilisha maana ya watu walio sawa au waadilifu kimaadili bila kulazimisha maana pana zaidi ya kimafundisho.
- source_word: וּתְהִי אַחֲרִיתִי
  choice: na mwisho wangu uwe
  rationale: “Mwisho” unafaa katika usambamba na kifo na ni wa asili katika Kiswahili cha sasa.
- source_word: כָּמֹהוּ
  choice: kama wake
  rationale: Inahifadhi kiambishi cha umoja wa kiume cha Kiebrania; “wake” hurejelea mwisho wa mwakilishi mmoja wa kundi la wanyoofu.
theological_decisions:
- issue: Maana ya יְשָׁרִים
  choice: wanyoofu
  alternative: waadilifu
  rationale: “Wanyoofu” inafuata picha ya kile kilicho sawa au nyofu na kuacha nguvu yake ya kimaadili na kidini bila kuifanya kuwa istilahi maalumu ya mfumo fulani wa teolojia.
- issue: Tafsiri ya רֹבַע יִשְׂרָאֵל
  choice: robo ya Israeli
  alternative: umati wa Israeli
  rationale: Tafsiri ya karibu inadumisha utata wa neno na picha kwamba hata sehemu moja ya Israeli haiwezi kuhesabika; “umati” ingeamua maana hiyo kwa ufafanuzi zaidi ya maandishi.
- issue: Umoja katika כָּמֹהוּ baada ya wingi יְשָׁרִים
  choice: kama wake
  alternative: kama wao
  rationale: Kiebrania kina kiambishi cha umoja, ingawa “wanyoofu” ni kundi. Tafsiri inahifadhi mvutano huo badala ya kuugeuza kuwa wingi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari imepangwa kufuata usambamba wa ushairi wa Kiebrania; utata wa “robo” na umoja wa “wake” umehifadhiwa na kufafanuliwa katika tanbihi.
