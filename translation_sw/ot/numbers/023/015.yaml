  text: וַ/יֹּ֨אמֶר֙ אֶל בָּלָ֔ק הִתְיַצֵּ֥ב כֹּ֖ה עַל עֹלָתֶ֑/ךָ וְ/אָנֹכִ֖י אִקָּ֥רֶה כֹּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/015.yaml
  text: And he said to Balak[a], “Stand here beside your burnt offering, and I will go to meet him over there.”
translation:
  language: sw
  text: Akamwambia Balaki, “Simama hapa kando ya sadaka yako ya kuteketezwa, nami nitaenda kukutana naye kule[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nitakutana kule” au “nitakutana naye kule.” Kitenzi cha Kiebrania ni kifupi na kinaweza kutafsiriwa kwa njia kadhaa zinazokaribiana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּלָק
  choice: Akamwambia Balaki
  rationale: Muundo wa kitenzi chenye kiambishi -ka- unaendeleza mtiririko wa simulizi la Kiebrania kwa Kiswahili cha kawaida bila kulazimika kuongeza kiunganishi tofauti.
- source_word: הִתְיַצֵּב
  choice: Simama
  rationale: Amri hii inamaanisha mtu achukue nafasi yake na abaki amesimama; “simama” ni ya kawaida na wazi katika muktadha huu.
- source_word: כֹּה
  choice: hapa
  rationale: Katika agizo kwa Balaki, neno hili linaonyesha mahali alipo, si namna ya kutenda.
- source_word: עַל עֹלָתֶךָ
  choice: kando ya sadaka yako ya kuteketezwa
  rationale: עַל hapa ina maana ya mahali karibu na kitu, na עֹלָה ni sadaka inayoteketezwa kabisa.
- source_word: וְאָנֹכִי
  choice: nami
  rationale: “Nami” huhifadhi uratibu pamoja na mkazo au utofautishaji mdogo kati ya Balaki kubaki hapo na msemaji kwenda kule.
- source_word: אִקָּרֶה
  choice: nitaenda kukutana naye
  rationale: Kitenzi kifupi cha Kiebrania kinahusu kukutana au kufikiwa katika tukio la kukutana. Kiswahili hiki ni cha asili katika muktadha na kinaonyesha kuelekea kwenye mkutano, huku kiwakilishi “naye” kikitolewa na muktadha.
- source_word: כֹּה
  choice: kule
  rationale: Kutokea kwake mara ya pili kunaonyesha mahali tofauti na “hapa” ambapo Balaki anapaswa kusimama; “kule” huhifadhi utofautishaji huo wa mahali.
theological_decisions:
- issue: Mhusika asiyetajwa wazi ambaye Balaamu anakusudia kukutana naye
  choice: Kutafsiri kwa “kukutana naye” bila kumtaja mhusika huyo kwa jina
  alternative: Kutafsiri kwa ujumla zaidi, “nitakutana kule,” au “nitaenda kukutana kule”
  rationale: Muktadha wa simulizi unaelekeza kwenye kukutana na Mungu, lakini mstari huu haumtajii mhusika huyo wazi. “Naye” hufanya sentensi iwe ya kawaida kwa Kiswahili bila kuongeza jina wala kufuta utata halisi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Sadaka ya kuteketezwa” limetumiwa kama istilahi wazi ya ibada; utofautishaji wa mahali kati ya “hapa” na “kule” umehifadhiwa.
