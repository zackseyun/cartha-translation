base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/026.yaml
  text: Balaam answered and said to Balak[a], “Did I not speak to you, saying, ‘All that Yahweh speaks, that I will do’?”
translation:
  language: sw
  text: Balaamu akajibu, akamwambia Balaki, “Je, sikukuambia kwamba, ‘Yote ambayo Yahwe atasema, hayo nitafanya’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן בִּלְעָם וַיֹּאמֶר
  choice: Balaamu akajibu, akamwambia
  rationale: Inahifadhi muundo wa Kiebrania wenye vitenzi viwili, ‘akajibu’ na ‘akasema,’ huku ‘akamwambia’ ikifanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: הֲלֹא דִּבַּרְתִּי אֵלֶיךָ
  choice: Je, sikusema nawe
  rationale: Inawasilisha swali la balagha linalotarajia jibu la kukubali, na inabaki karibu na maana halisi ya ‘nilisema/nilinena kwako.’
- source_word: לֵאמֹר
  choice: kwamba
  rationale: ‘Kwamba’ ni njia ya kawaida ya Kiswahili ya kutambulisha maneno yaliyonukuliwa, bila kufanya muundo kuwa mzito.
- source_word: כֹּל אֲשֶׁר
  choice: Yote ambayo
  rationale: Inahifadhi maana pana na jumuishi ya usemi wa Kiebrania.
- source_word: יְדַבֵּר יְהוָה
  choice: Yahwe atasema
  rationale: Kauli ya wakati ujao inafaa katika muktadha wa Balaamu kueleza kanuni ya yale ambayo Yahwe atamwambia, huku ikihifadhi kitenzi cha ‘kusema.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limetafsiriwa kwa namna ya moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: אֹתוֹ אֶעֱשֶׂה
  choice: hayo ndiyo nitakayofanya
  rationale: Inahifadhi urejezi wenye msisitizo kwa yale yote ambayo Yahwe atasema na ahadi ya Balaamu ya kuyafanya.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia Tetragramatoni, jina binafsi la Mungu; ‘Yahwe’ hulihifadhi wazi bila kulibadilisha kuwa cheo.
- issue: Kauli ya Balaamu kuhusu kutenda anachosema Yahwe
  choice: hayo ndiyo nitakayofanya
  alternative: hayo ndiyo ninayopaswa kufanya
  rationale: Kiebrania kinasema atafanya, lakini hakitumii neno la moja kwa moja la ulazima. Tafsiri haiongezi wazo la ‘kupaswa,’ ingawa muktadha unaonyesha kizuizi chake.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Majina yametolewa kwa maumbo yaliyozoeleka ya Kiswahili: Balaamu na Balaki.'
