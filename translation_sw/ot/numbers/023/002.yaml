base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/002.yaml
  text: Balak did as Balaam had spoken[a], and Balak and Balaam offered a bull and a ram on the altar.
translation:
  language: sw
  text: Balaki akafanya kama Balaamu alivyosema, na Balaki na Balaamu wakatoa[a] fahali na kondoo dume juu ya madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “wakapandisha”; katika muktadha wa dhabihu maana yake ni “wakatoa” au “wakatoa kama dhabihu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Katika usemi עשה כאשר דבר, kitenzi kina maana ya kufanya au kutekeleza yaliyosemwa; “akafanya” ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: kama ... alivyosema
  rationale: Kirai hiki huonyesha kwamba Balaki alifuata maagizo ya Balaamu; muundo huu ni wa asili katika Kiswahili na hudumisha uhusiano wa matendo hayo.
- source_word: וַיַּעַל
  choice: wakamtoa
  rationale: Hifili ya עלה katika muktadha wa dhabihu humaanisha kutoa mnyama kama dhabihu. “Wakamtoa” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kulazimisha taswira isiyoeleweka ya ‘kupandisha.’
- source_word: בָּלָק וּבִלְעָם
  choice: Balaki na Balaamu
  rationale: Majina yaliyounganishwa yanabaki kuwa wahusika wawili wa kitendo hicho, kama ilivyo katika Kiebrania.
- source_word: פָּר
  choice: fahali
  rationale: פָּר humaanisha fahali, hasa katika muktadha wa dhabihu; mstari huu hautaji wazi umri wake.
- source_word: וָאַיִל
  choice: na kondoo dume
  rationale: אַיִל ni kondoo dume; hili ni neno la kawaida na linaloeleweka katika Kiswahili sanifu.
- source_word: בַּמִּזְבֵּחַ
  choice: juu ya madhabahu
  rationale: Katika muktadha wa dhabihu, בְּ pamoja na ‘madhabahu’ huonyesha mahali ambapo dhabihu ilitolewa; “juu ya madhabahu” ni tafsiri ya wazi.
