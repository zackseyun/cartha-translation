base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/016.yaml
  text: And Yahweh met Balaam and put a word in his mouth[a], and said, “Return to Balak, and thus you shall speak.”
translation:
  language: sw
  text: Yahwe akakutana na Balaamu[a], akaweka neno kinywani mwake, akasema, “Rudi kwa Balaki, nawe useme hivi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamtokea Balaamu” au “alikabiliana na Balaamu.”
    reason: mbadala_wa_kileksia
lexical_decisions:
- source_word: וַיִּקָּר
  choice: akakutana na
  rationale: Kitenzi קָרָה hapa kinaonyesha kukutana au kukabiliana moja kwa moja. “Akakutana na” ni Kiswahili cha kawaida na hakiongezi wazo la kuonekana katika maono.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: וַיָּשֶׂם דָּבָר בְּפִיו
  choice: akaweka neno kinywani mwake
  rationale: Hii inahifadhi nahau ya Kiebrania kuhusu usemi uliotolewa na Mungu, pamoja na umoja wa דָּבָר, huku ikiwa wazi katika Kiswahili.
- source_word: דָּבָר
  choice: neno
  rationale: Katika muktadha huu linamaanisha usemi maalumu ambao Balaamu alipaswa kuutoa; “neno” huhifadhi kwa karibu lugha ya unabii ya Kiebrania.
- source_word: שׁוּב
  choice: Rudi
  rationale: Amri hii inamtaka Balaamu arudi kwa Balaki. “Rudi” ni fupi, wazi, na ya kawaida.
- source_word: וְכֹה תְדַבֵּר
  choice: nawe useme hivi
  rationale: כֹה pamoja na דבר hutanguliza maneno yatakayosemwa. “Nawe useme hivi” ni ya asili katika Kiswahili na hudumisha nguvu ya agizo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia Tetragramatoni kama jina binafsi. “Yahwe” hulihifadhi kwa utohozi unaokubalika badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa masimulizi ni wa heshima, wazi, na wa kisasa. Muundo wa vitenzi vinavyofuatana “akakutana… akaweka… akasema” unaakisi mfululizo wa simulizi la Kiebrania bila kufanya sentensi kuwa ngumu.
