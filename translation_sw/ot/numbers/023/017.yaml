base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/017.yaml
  text: He came to him[a], and behold, he was standing by his burnt offering, with the princes of Moab with him. And Balak said to him, “What has Yahweh spoken?”
translation:
  language: sw
  text: Akamjia, na tazama, alikuwa amesimama kando ya sadaka yake ya kuteketezwa, na wakuu[a] wa Moabu walikuwa pamoja naye. Balaki akamwambia, “Yahwe amesema nini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maofisa wa Moabu.”
    reason: שָׂרֵי inaweza kutafsiriwa kuwa ‘wakuu,’ ‘viongozi,’ au ‘maofisa’; tanbihi inahifadhi uwezekano unaofaa wa ‘maofisa.’
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו
  choice: Akamjia
  rationale: Kitenzi בוא kimsingi humaanisha ‘kuja’; umbo hili la Kiswahili linadumisha maana ya moja kwa moja bila kuongeza wazo la ‘kurudi,’ ingawa muktadha unaonyesha kuwa Balamu alikuwa akirejea kutoka kukutana na Yahwe.
- source_word: וְהִנּוֹ
  choice: na tazama
  rationale: Neno hili huvuta uangalifu kwa hali inayofuata. ‘Tazama’ linahifadhi msisitizo na uchangamfu wa simulizi la Kiebrania.
- source_word: נִצָּב
  choice: alikuwa amesimama
  rationale: Kivumishi-tendaji cha Kiebrania kinaonyesha hali iliyoendelea wakati huyo mwingine alipofika.
- source_word: עַל עֹלָתוֹ
  choice: kando ya sadaka yake ya kuteketezwa
  rationale: עַל hapa ina maana ya mahali karibu na dhabihu, si kusimama juu yake. ‘Kando ya’ ni Kiswahili cha kawaida kinachohifadhi uhusiano huo wa mahali.
- source_word: עֹלָתוֹ
  choice: sadaka yake ya kuteketezwa
  rationale: עֹלָה ni istilahi ya kawaida ya dhabihu iliyoteketezwa; tafsiri hii ni wazi na imezoeleka katika lugha ya Biblia ya Kiswahili.
- source_word: וְשָׂרֵי מוֹאָב אִתּוֹ
  choice: pamoja na wakuu wa Moabu
  rationale: שָׂרִים inaweza kumaanisha wakuu, viongozi, au maofisa. ‘Wakuu’ inafaa mazingira ya kifalme bila kudai kwamba wote walikuwa wana wa mfalme.
- source_word: מַה דִּבֶּר יְהוָה
  choice: Yahwe amesema nini?
  rationale: ‘Amesema nini?’ ni Kiswahili cha asili kinachowasilisha usemi wa Mungu na athari yake ya sasa, huku jina la Mungu likitafsiriwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limehifadhiwa kama jina binafsi kwa unukuzi unaosomeka kwa urahisi katika Kiswahili, badala ya kubadilishwa kuwa ‘BWANA.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi YHWH. ‘Yahwe’ hulihifadhi kama jina na ni umbo linalotamkika kwa kawaida katika Kiswahili.
- issue: Utambulisho wa wahusika katika viwakilishi vya mwanzo
  choice: 'Kudumisha viwakilishi visivyotaja majina: “Akamjia ... alikuwa amesimama”'
  alternative: Kutaja wazi “Balamu akamjia Balaki ... Balaki alikuwa amesimama”
  rationale: Kiebrania chenyewe kinatumia viwakilishi, na utambulisho unaeleweka kutokana na muktadha. Kutotaja majina hapa hakutatui kimyakimya muundo wa chanzo, ingawa Balaki anatajwa wazi baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa simulizi umetunzwa kwa ‘Akamjia’ na ‘Balaki akamwambia,’ huku ‘na tazama’ ikihifadhi msisitizo wa chanzo. Alama ya tanbihi imewekwa baada ya neno linalohusika, ‘wakuu[a].’
