base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/027.yaml
  text: Then Balak said to Balaam[a], “Please come, let me take you to another place. Perhaps it will be right in the eyes of God, and you shall curse him for me from there.”
translation:
  language: sw
  text: Kisha Balaki akamwambia Balaamu, “Tafadhali njoo, nikupeleke mahali pengine. Huenda jambo hili likawa sawa machoni pa Mungu[a], nawe umlaani kwa ajili yangu kutoka huko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “likawa la kupendeza machoni pa Mungu.” Nahau ya Kiebrania inaweza kumaanisha kuwa jambo ni sawa au la kupendeza machoni pa mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה נָּא
  choice: Tafadhali njoo
  rationale: Kitenzi cha amri pamoja na נָּא kinaonyesha mwaliko au ombi lililolainishwa; Kiswahili hiki ni cha kawaida katika mazungumzo.
- source_word: אֶקָּחֲךָ
  choice: nikupeleke
  rationale: 'Ingawa umbo ni la nafsi ya kwanza katika hali isiyotimilika, hapa lina nguvu ya hiari baada ya mwaliko: Balaki anajitolea kumpeleka Balaamu.'
- source_word: מָקוֹם אַחֵר
  choice: mahali pengine
  rationale: Huhifadhi maana halisi ya eneo tofauti bila kuongeza maelezo yasiyokuwapo katika Kiebrania.
- source_word: אוּלַי
  choice: Huenda
  rationale: Huonyesha tumaini lisilo na uhakika la Balaki bila kulifanya kuwa jambo la hakika.
- source_word: יִישַׁר בְּעֵינֵי הָאֱלֹהִים
  choice: jambo hilo likawa jema machoni pa Mungu
  rationale: Huhifadhi nahau ya Kiebrania ya kuwa jema au kukubalika machoni pa mtu. ‘Jambo hilo’ limetolewa wazi kwa sababu kitenzi cha Kiebrania hakina kiima kilichotajwa na kinarejelea mpango uliopendekezwa.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno linamrejelea Mungu ambaye Balaamu humwuliza; ‘Mungu’ ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: וְקַבֹּתוֹ לִי
  choice: nawe ukamlaani kwa ajili yangu
  rationale: Mzizi קבב humaanisha ‘kulaani.’ Kiambishi cha kitu katika umoja kinahifadhiwa kwa ‘-m-’, kikirejelea Israeli kama jamii moja, huku muundo wa Kiswahili ukionyesha ombi linaloendelea.
- source_word: מִשָּׁם
  choice: kutoka huko
  rationale: Huhifadhi wazo la mahali ambapo laana ingetolewa baada ya kuhamia eneo jipya.
theological_decisions:
- issue: Anayerejelewa na הָאֱלֹהִים katika maneno ya Balaki
  choice: Mungu, akimaanisha Mungu ambaye Balaamu humwuliza
  alternative: mungu huyo; mungu fulani
  rationale: Simulizi la karibu linaonyesha kuwa Balaamu anazuiwa na Mungu wa Israeli, na Balaki anatumaini kuwa kubadili mahali kutabadilisha kile ambacho Mungu ataruhusu. Tafsiri ‘Mungu’ haitii utata wa miungu mingi ambao muktadha haulazimishi.
- issue: Kiima kisichotajwa cha יִישַׁר
  choice: jambo hilo, yaani mpango wa kwenda mahali pengine na kujaribu tena
  alternative: mahali hapo patakuwa pema; Mungu atapendezwa
  rationale: Kiebrania hakitaji kiima wazi. Tafsiri inabaki pana kwa kutumia ‘jambo hilo’ badala ya kuamua kwamba mahali pekee ndiko kunakomfurahisha Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kisimulizi. Nahau ‘machoni pa Mungu’ imehifadhiwa kwa sababu inaeleweka, huku tanbihi ikifafanua upana wake. Jina ‘Balaamu’ na ‘Balaki’ yanafuata maumbo yaliyozoeleka katika tafsiri za Biblia za Kiswahili.
