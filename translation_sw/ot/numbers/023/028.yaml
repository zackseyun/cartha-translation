  yaml_path: translation/ot/numbers/023/028.yaml
  text: Then Balak took Balaam to the top of Peor[a], which overlooks the face of the wasteland.
translation:
  language: sw
  text: Kisha Balaki akampeleka Balaamu kwenye kilele cha Peori, kinachoelekea upande wa nyika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kinachoelekea upande wa jangwa”; neno la Kiebrania linaweza kueleweka ama kama maelezo ya eneo kame (“nyika/jangwa”) au kama jina la mahali, “Yeshimoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kisha ... akampeleka
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi. Katika muktadha huu, לקח pamoja na mtu na mahali anakopelekwa hutafsiriwa kwa Kiswahili cha kawaida kuwa ‘akampeleka,’ badala ya ‘akamchukua’ pekee.
- source_word: בָּלָק
  choice: Balaki
  rationale: Jina la mtu limeandikwa kwa umbo lililozoeleka katika tafsiri za Kiswahili.
- source_word: אֶת בִּלְעָם
  choice: Balaamu
  rationale: Alama ya yambwa אֶת haitafsiriwi moja kwa moja; jina limeandikwa kwa umbo la kawaida la Kiswahili.
- source_word: רֹאשׁ
  choice: kilele
  rationale: Katika maelezo ya kijiografia, רֹאשׁ humaanisha sehemu ya juu kabisa ya mlima au kilima; ‘kilele’ ni wazi na cha asili katika Kiswahili.
- source_word: הַפְּעוֹר
  choice: Peori
  rationale: Jina la mahali limeandikwa kwa umbo lililozoeleka katika Kiswahili; kibainishi cha Kiebrania hakihitaji kutafsiriwa kando.
- source_word: הַנִּשְׁקָף
  choice: kinachotazamana na
  rationale: Kauli hii ya kijiografia inaonyesha sehemu ya juu inayoelekea au kutoa mtazamo juu ya eneo fulani. ‘Kinachotazamana na’ ni cha asili bila kulazimisha wazo la kutazama chini pekee.
- source_word: עַל פְּנֵי
  choice: na
  rationale: Nahau ya Kiebrania, kihalisi ‘juu ya uso wa,’ hapa inaeleza mwelekeo wa kijiografia. Kiswahili cha kawaida huiwasilisha kwa ‘kutazamana na,’ bila kuhifadhi taswira isiyo ya asili ya ‘uso wa’.
- source_word: הַיְשִׁימֹן
  choice: nyika
  rationale: יְשִׁימֹן inaweza kumaanisha eneo kame na ukiwa au kutumiwa kama jina la mahali. ‘Nyika’ huwasilisha maana yake ya kawaida kwa lugha fupi na ya sasa; uwezekano wa jina la mahali umehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
