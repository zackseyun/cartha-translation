base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/022.yaml
  text: God brings them out of Egypt[b][a]; he has for him the horns of a wild ox.
translation:
  language: sw
  text: Mungu anawatoa Misri; ana, kwa ajili yake, pembe kama za ng’ombe-mwitu[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ana nguvu kama za ng’ombe-mwitu.” Kirai cha Kiebrania ni kigumu; tafsiri katika mstari inadumisha taswira ya pembe badala ya kuibadili kuwa wazo la nguvu pekee.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinamaanisha yaelekea ng’ombe-mwitu mkubwa wa kale, yaani auroksi; katika tafsiri za kimapokeo lilitafsiriwa “mnyama mwenye pembe moja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Mungu
  rationale: Neno אֵל ni kiima cha kauli hii na hapa linaeleweka kwa kawaida kuwa “Mungu,” bila kuongeza wazo la “Mungu mwenye nguvu” ambalo halijasemwa wazi.
- source_word: מוֹצִיאָם
  choice: anawatoa
  rationale: Hii ni participio ya Hifili yenye kiambishi cha nafsi ya tatu wingi. Wakati wa sasa katika Kiswahili unadumisha uhai wa usemi wa kishairi huku ukirejelea tendo la kuwatoa Misri.
- source_word: מִמִּצְרָיִם
  choice: Misri
  rationale: Baada ya kitenzi “anawatoa,” Kiswahili cha kawaida hakihitaji kurudia kihusishi; “anawatoa Misri” hutoa wazi maana ya kuwatoa kutoka Misri.
- source_word: כְּתוֹעֲפֹת
  choice: ni kama pembe za
  rationale: Nomino hii ya Kiebrania ni ngumu na inaweza kuhusishwa na pembe zilizoinuka au nguvu. Tafsiri inadumisha taswira halisi ya mnyama badala ya kuibadili moja kwa moja kuwa dhana ya “nguvu.”
- source_word: רְאֵם
  choice: ng’ombe-mwitu
  rationale: Neno hili linaashiria mnyama mkubwa na mwenye nguvu wa jamii ya ng’ombe, yaelekea ng’ombe-mwitu wa kale (auroksi), wala si mnyama wa hadithi mwenye pembe moja. “Ng’ombe-mwitu” ni wazi zaidi kwa wasomaji wengi kuliko “auroksi.”
- source_word: לוֹ
  choice: kwake yeye
  rationale: Kiambishi hiki ni cha nafsi ya tatu umoja. “Kwake yeye” kinahifadhi umoja wa Kiebrania badala ya kuusawazisha kuwa wingi, ingawa rejeo lake la kishairi linaweza kuwa Israeli kama umoja wa kijamii.
theological_decisions:
- issue: Taswira na utambulisho wa רְאֵם
  choice: ng’ombe-mwitu
  alternative: auroksi; mnyama mwenye pembe moja
  rationale: Maana inayowezekana zaidi ni ng’ombe mkubwa wa porini, na mstari unatumia taswira ya nguvu na pembe zake, si dai kuhusu mnyama wa hadithi.
- issue: Rejeo la kiwakilishi לוֹ
  choice: kwake yeye, kwa umoja
  alternative: kwao, kwa wingi
  rationale: Maandishi ya Kimasora yana kiwakilishi cha umoja baada ya kiambishi cha wingi katika “anawatoa.” Tafsiri hailiondoi badiliko hilo, ambalo huenda linamtazama Israeli kwa pamoja kama mtu mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa, pamoja na mvutano kati ya “wao” katika anawatoa na “yeye” katika kwake yeye. “Ng’ombe-mwitu” limetumiwa kwa urahisi wa kueleweka, huku maelezo ya “auroksi” yakibaki katika tanbihi.
