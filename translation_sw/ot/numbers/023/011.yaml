base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/011.yaml
  text: Then Balak said to Balaam[a], “What have you done to me? I took you to curse my enemies, but look, you have done nothing but bless them!”
translation:
  language: sw
  text: Ndipo Balaki akamwambia Balaamu, “Umenifanyia nini? Nilikuchukua ili uwalaani adui zangu, lakini tazama, umewabariki kweli[a]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania hutumia kitenzi pamoja na infinitive absolute ili kusisitiza: “kwa hakika umebariki” au “kweli umebariki.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu unaendeleza simulizi kwa mfuatano wa kawaida wa Kiswahili na kuhifadhi maana ya waw-consecutive.
- source_word: מֶה עָשִׂיתָ לִי
  choice: Umenifanyia nini?
  rationale: Ni swali la moja kwa moja na la kawaida katika Kiswahili, likionyesha kuwa tendo hilo limemwathiri Balaki.
- source_word: לָקֹב
  choice: ili uwalaani
  rationale: Kitenzi קבב hapa kinamaanisha kutamka laana dhidi ya watu; ‘kuwalaani’ ni tafsiri iliyo wazi na ya moja kwa moja.
- source_word: אֹיְבַי
  choice: adui zangu
  rationale: Huhifadhi nomino ya wingi pamoja na umilikaji wa nafsi ya kwanza.
- source_word: לְקַחְתִּיךָ
  choice: Nilikuchukua
  rationale: Hufuata maana ya msingi ya לקח bila kuongeza wazo maalumu la kuajiri ambalo halijasemwa wazi katika mstari huu.
- source_word: וְהִנֵּה
  choice: lakini tazama
  rationale: ‘Lakini’ huonyesha tofauti inayokusudiwa katika muktadha, na ‘tazama’ huhifadhi msisitizo na mshangao wa הִנֵּה.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: umewabariki kabisa
  rationale: ‘Kabisa’ huwasilisha msisitizo wa kitenzi chenye infinitive absolute kwa Kiswahili cha kawaida; kiwakilishi cha yambwa ‘wa-’ kinarejelea adui waliotajwa katika sentensi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. Majina yametolewa kama Balaki na Balaamu. ‘Tazama’ limehifadhiwa kwa msisitizo wa kifasihi, huku ‘kabisa’ likitoa kwa njia ya kawaida nguvu ya muundo wa Kiebrania.
