  text: לֹֽא הִבִּ֥יט אָ֨וֶן֙ בְּ/יַעֲקֹ֔ב וְ/לֹא רָאָ֥ה עָמָ֖ל בְּ/יִשְׂרָאֵ֑ל יְהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וּ/תְרוּעַ֥ת מֶ֖לֶךְ בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/021.yaml
  text: He has not looked on trouble in Jacob, nor has he seen misery in Israel. The Yahweh his God is with him, and the shout of a king is among them.
translation:
  language: sw
  text: 'Hajaangalia taabu katika Yakobo,

    wala hajaona dhiki katika Israeli.[a]


    Yahwe, Mungu wake, yu pamoja naye,

    na shangilio la mfalme limo ndani yake.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hajaona uovu katika Yakobo, wala hajaona taabu au upotovu katika Israeli.” Maneno ya Kiebrania yanaweza kueleweka kwa maana ya kimaadili (“uovu”) au kwa maana ya taabu na mateso.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “ndani yake.” Yakobo/Israeli anatajwa kama mtu mmoja anayewakilisha taifa zima.'
    reason: lexical_alternative
  - marker: c
    text: Usemi “shangilio la mfalme” unaweza kumaanisha shangilio la kifalme katikati ya Israeli, na huenda ukadokeza uwepo wa Yahwe kama Mfalme.
    reason: alternative_reading
lexical_decisions:
- source_word: הִבִּיט
  choice: hajaangalia
  rationale: Kitenzi hiki kina maana ya kutazama au kuangalia kwa makini. “Hajaangalia” kinadumisha taswira ya kuona na kutofautisha kitenzi hiki na רָאָה katika mstari unaofuata.
- source_word: אָוֶן
  choice: taabu
  rationale: Neno hili linaweza kumaanisha uovu au taabu/msiba. Katika baraka hii, “taabu” linafaa na halidai kwamba Israeli hakuwa na dhambi; maana ya kimaadili imehifadhiwa katika tanbihi.
- source_word: רָאָה
  choice: hajaona
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kitenzi ראה, nayo inadumisha usambamba wa kishairi.
- source_word: עָמָל
  choice: dhiki
  rationale: Neno hili linaweza kuonyesha taabu, mateso, au hali yenye kuleta huzuni. “Dhiki” linatofautiana na “taabu” huku likidumisha maana inayokaribiana.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: katika Yakobo / katika Israeli
  rationale: Kihusishi ב kimetafsiriwa kwa maana ya mahali au ndani ya jamii, kwa kufuata usambamba wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa na cheo.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Kiambishi cha Kiebrania ni umoja wa kiume; Yakobo/Israeli anatajwa kama mtu mmoja anayewakilisha taifa.
- source_word: עִמּוֹ
  choice: yuko pamoja naye
  rationale: Umoja wa kisarufi umehifadhiwa kwa sababu Israeli anawakilishwa kama mtu mmoja.
- source_word: תְרוּעַת מֶלֶךְ
  choice: shangwe za mfalme
  rationale: תְּרוּעָה linaweza kuwa sauti kubwa ya shangwe, mwito, au shangilio la kifalme. Usemi huu unaacha wazi kama shangwe zinamhusu mfalme au zinaonyesha kuwapo kwake.
- source_word: בּוֹ
  choice: ziko miongoni mwao
  rationale: Kiebrania kinasema kihalisi “ndani yake,” kikirejelea Israeli kama umoja wa kijamii. Kiswahili cha wingi hapa huwasilisha kwa kawaida maana ya shangwe kuwapo katikati ya watu.
theological_decisions:
- issue: Je, mstari unasema Israeli hakuwa na dhambi, au kwamba taabu na dhiki hazikuonekana kwake?
  choice: Maandishi makuu yanatumia “taabu” na “dhiki,” yakisisitiza hali ya baraka na uwepo wa Mungu bila kudai kwamba taifa halikuwa na dhambi.
  alternative: “Hajaona uovu katika Yakobo, wala hajaona taabu/upotovu katika Israeli.”
  rationale: אָוֶן na עָמָל yanaweza kuwa na maana ya kimaadili au ya mateso. Muktadha wa baraka unaunga mkono maana ya taabu/dhiki, lakini tanbihi inadumisha uwezekano wa maana ya kimaadili.
- issue: Utambulisho wa “mfalme” katika usemi תְרוּעַת מֶלֶךְ
  choice: Mfalme hatambulishwi wazi katika maandishi makuu.
  alternative: Shangwe zinaweza kuwa shangilio la kifalme linalodokeza uwepo wa Yahwe kama Mfalme.
  rationale: Kiebrania kinaunganisha shangwe na mfalme bila kusema wazi kama mfalme huyo ni nani; kwa hiyo utata halisi umehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Mistari minne inadumisha usambamba wa Kiebrania. “Yahwe” limetumiwa kama jina binafsi la Mungu, na tanbihi zinaeleza utata wa kileksika na umoja wa kijamii bila kuingiza msimamo wa kimadhehebu.
