  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ אֶל בָּלָ֔ק בְּנֵה לִ֥/י בָ/זֶ֖ה שִׁבְעָ֣ה מִזְבְּחֹ֑ת וְ/הָכֵ֥ן לִ/י֙ בָּ/זֶ֔ה שִׁבְעָ֥ה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/001.yaml
  text: Then Balaam said to Balak[a], “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: sw
  text: Kisha Balaamu akamwambia Balaki, “Nijengee hapa madhabahu saba, na uniandalie hapa mafahali saba na kondoo dume saba.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akamwambia” huwasilisha kwa kawaida usemi unaoelekezwa kwa mtu.
- source_word: בִּלְעָם
  choice: Balaamu
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: בָּלָק
  choice: Balaki
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: בְּנֵה לִי
  choice: Nijengee
  rationale: Kauli ya amri pamoja na לִי inaeleza ujenzi unaofanywa kwa ajili ya Balaamu; “nijengee” ni ya moja kwa moja na ya asili katika Kiswahili.
- source_word: בָּזֶה
  choice: hapa
  rationale: Kirai hiki kwa neno halisi ni “katika [mahali] hapa”; katika muktadha huu “hapa” huhifadhi maana ya kuonyesha mahali kwa lugha ya kawaida.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: madhabahu saba
  rationale: Hii ni tafsiri ya moja kwa moja ya kirai cha idadi, kwa mpangilio wa kawaida wa nomino na kivumishi cha idadi katika Kiswahili.
- source_word: וְהָכֵן לִי
  choice: na uniandalie
  rationale: Hifili ya כון ina maana ya kufanya vitu viwe tayari; “uniandalie” pia huhifadhi maana ya לִי, yaani kwa ajili yangu.
- source_word: פָרִים
  choice: mafahali
  rationale: פַּר katika muktadha wa dhabihu humaanisha ng'ombe dume; “mafahali” ni neno sahihi na haliongezi dai la umri ambalo halijaelezwa wazi hapa.
- source_word: אֵילִים
  choice: kondoo dume
  rationale: Neno hili humaanisha kondoo wa kiume; “kondoo dume” ni wazi na sahihi katika Kiswahili cha sasa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Marudio ya “hapa” yamehifadhiwa ili kuendeleza msisitizo wa mahali uliopo mara mbili katika Kiebrania. Hakuna tanbihi inayohitajika kwa kuwa maana hiyo inaweza kuhifadhiwa moja kwa moja katika matini.
