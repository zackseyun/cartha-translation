base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/014.yaml
  text: So he took him to the Field of Zophim[a], to the top of Pisgah, and built seven altars and offered a bull and a ram on each altar.
translation:
  language: sw
  text: Basi akamchukua hadi Uwanja wa Watazamaji[a], kwenye kilele cha Pisga. Akajenga madhabahu saba, akatoa fahali mmoja na kondoo dume mmoja juu ya kila madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uwanja wa Zofimu.” Maneno ya Kiebrania yanaweza kueleweka ama kama maelezo yaliyotafsiriwa ya mahali (“Uwanja wa Watazamaji/Walinzi”) au kama jina la mahali lililohifadhiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: Basi akamchukua
  rationale: Kauli ya masimulizi ya לקח yenye kiambishi cha mtendewa wa nafsi ya tatu umoja; “Basi” huendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida, huku mhusika anayemchukua mwenzake akieleweka kutokana na muktadha.
- source_word: שְׂדֵה צֹפִים
  choice: Uwanja wa Watazamaji
  rationale: Muundo huu wa hali ya kuambatana unaweza kumaanisha kihalisi ‘uwanja wa watazamaji/walinzi’ na pia huenda ukawa jina la mahali. Tafsiri ya maana imewekwa katika matini, huku jina Zofimu likihifadhiwa katika tanbihi.
- source_word: אֶל רֹאשׁ הַפִּסְגָּה
  choice: kwenye kilele cha Pisga
  rationale: רֹאשׁ katika mazingira ya kijiografia ni ‘kilele’; הַפִּסְגָּה hapa imetafsiriwa kama jina la mahali Pisga.
- source_word: וַיִּבֶן שִׁבְעָה מִזְבְּחֹת
  choice: Akajenga madhabahu saba
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya tendo la kujenga pamoja na madhabahu saba.
- source_word: וַיַּעַל
  choice: akatoa
  rationale: Katika muktadha wa dhabihu, עלה humaanisha kutoa sadaka. ‘Akatoa’ ni lugha ya kawaida ya ibada na haiongezi maelezo yasiyokuwamo.
- source_word: פָּר וָאַיִל
  choice: fahali mmoja na kondoo dume mmoja
  rationale: Majina yote mawili yako katika umoja; ‘mmoja’ huonyesha wazi kwamba kila aina ya mnyama ilikuwa mmoja kwa kila madhabahu.
- source_word: בַּמִּזְבֵּחַ
  choice: juu ya kila madhabahu
  rationale: 'Ingawa Kiebrania kina umoja, kutajwa kwa madhabahu saba na muktadha sambamba kunaonyesha maana ya mgawanyo: mnyama mmoja wa kila aina alitolewa kwenye kila madhabahu.'
