  text: He answered and said[a], “Must I not speak what Yahweh puts in my mouth?”
translation:
  language: sw
  text: Akajibu akasema[a], “Je, hainipasi kuwa mwangalifu kusema kile ambacho Yahweh anaweka kinywani mwangu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Je, hainipasi kutunza/kuzingatia kwa makini kusema kile ambacho Yahweh anaweka kinywani mwangu?” Kitenzi kinaweza kusisitiza kushikamana kwa uangalifu na maneno hayo wakati wa kusema.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמַר
  choice: Akajibu akasema
  rationale: Muundo huu wa masimulizi unawakilisha mfuatano wa Kiebrania ‘akajibu na kusema’ kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: הֲלֹא
  choice: Je, hainipasi
  rationale: Swali hili la balagha linatarajia jibu la kukubali na linaonyesha wajibu wa Balaamu bila kuzidisha wazo la kulazimishwa kabisa.
- source_word: אֵת אֲשֶׁר ... אֹתוֹ
  choice: kile ambacho
  rationale: Kiwakilishi cha yambwa kinachorudiwa katika Kiebrania kinatolewa kwa njia ya kawaida katika Kiswahili bila kurudia ‘hicho’.
- source_word: יָשִׂים
  choice: anaweka
  rationale: Kitenzi hiki kinahifadhi taswira ya Kiebrania ya Mungu kuweka maneno kinywani mwa mtu ili ayaseme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limetoholewa badala ya kubadilishwa na cheo.
- source_word: בְּפִי
  choice: kinywani mwangu
  rationale: Huhifadhi nahau ya Kiebrania ya maneno yaliyotolewa na Mungu na inaeleweka vizuri kwa Kiswahili.
- source_word: אֶשְׁמֹר לְדַבֵּר
  choice: sema
  rationale: Usemi mkuu umetolewa kwa Kiswahili cha asili; maana ya kuzingatia kwa makini yaliyowekwa kinywani imehifadhiwa katika tanbihi kwa sababu tafsiri ya moja kwa moja ‘kutunza kusema’ si ya kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko lina jina la Mungu, si cheo; ‘Yahweh’ hulihifadhi kama jina binafsi.
- issue: Kiwango cha wajibu katika jibu la Balaamu
  choice: Je, hainipasi kusema...
  alternative: Je, hainipasi kuwa mwangalifu kusema...
  rationale: Swali la balagha linaonyesha wajibu, huku tanbihi ikihifadhi maana inayowezekana ya uangalifu katika אֶשְׁמֹר bila kufanya sentensi kuu iwe ngumu au kuamua kupita kiasi namna ya uangalifu huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. ‘Akajibu akasema’ ni muundo wa kawaida wa masimulizi; ‘hainipasi’ hudumisha uzito wa swali la wajibu bila kuwa wa kizamani kupita kiasi.
