base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/004.yaml
  text: And God met with Balaam[a], and he said to him, “I have arranged the seven altars and offered a bull and a ram on the altar.”
translation:
  language: sw
  text: Mungu akakutana na Balaamu[a], naye Balaamu akamwambia, “Nimezipanga zile madhabahu saba, nami nimetoa fahali na kondoo dume kuwa sadaka juu ya madhabahu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu alikumbana na Balaamu.” Kitenzi cha Kiebrania kinaweza kumaanisha kukutana au kukumbana na mtu, na katika baadhi ya miktadha kinaweza kuwa na kidokezo cha kutokea bila kutarajiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּר
  choice: akakutana na
  rationale: Kitenzi hiki kinaeleza kukutana au kukabiliwa katika tukio. ‘Akakutana na’ ni Kiswahili cha kawaida kinachoonyesha kwamba Mungu alikutana kweli na Balaamu, bila kulazimisha maana ya ajali.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi cha umoja na muktadha vinaonyesha kwamba hili ni jina la cheo cha Mungu mmoja.
- source_word: בִּלְעָם
  choice: Balaamu
  rationale: Hii ndiyo namna ya kawaida ya kuandika jina hili katika Biblia za Kiswahili.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: naye Balaamu akamwambia
  rationale: Ingawa Kiebrania kinasema kihalisi ‘naye akamwambia,’ maneno ya nafsi ya kwanza yanayofuata yanaonyesha kwamba msemaji ni Balaamu. Kutaja jina lake huondoa utata wa viwakilishi katika Kiswahili bila kubadili maana.
- source_word: אֶת שִׁבְעַת הַמִּזְבְּחֹת
  choice: zile madhabahu saba
  rationale: Kirai ni bainifu na kinarejelea madhabahu saba zilizokwisha tajwa katika muktadha. ‘Zile’ huonyesha urejeleo huo kwa Kiswahili cha kawaida.
- source_word: עָרַכְתִּי
  choice: nimezipanga
  rationale: Neno ערך humaanisha kupanga au kuweka kwa utaratibu. Kauli ya wakati timilifu inaonyesha tendo lililokamilika lenye umuhimu wakati wa taarifa ya Balaamu.
- source_word: וָאַעַל
  choice: nimetoa ... kuwa sadaka
  rationale: Katika muktadha wa dhabihu, עלה humaanisha kutoa mnyama madhabahuni. Tafsiri hii ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
- source_word: פָּר
  choice: fahali
  rationale: ‘Fahali’ ni tafsiri ya kawaida ya פר katika muktadha wa dhabihu; maandishi hapa hayalazimishi kuongeza kwamba alikuwa mchanga.
- source_word: וָאַיִל
  choice: kondoo dume
  rationale: Hii ndiyo maana ya kawaida ya אַיִל katika muktadha wa dhabihu.
- source_word: בַּמִּזְבֵּחַ
  choice: juu ya madhabahu
  rationale: Tafsiri inadumisha umoja wa neno la Kiebrania na hailipanui kimya kimya kuwa ‘juu ya kila madhabahu,’ ingawa muktadha unaweza kuruhusu maana ya mgawanyo.
theological_decisions:
- issue: Asili ya kukutana kwa Mungu na Balaamu katika וַיִּקָּר
  choice: Kutafsiri kama tukio halisi la Mungu kukutana na Balaamu bila kudai kwamba lilitokea kwa bahati
  alternative: Kutumia kauli yenye mkazo mkubwa wa kutokea kwa bahati
  rationale: Mzizi wa neno unaweza kuwa na kidokezo cha kutokea au kukutana bila kutarajiwa katika baadhi ya miktadha, lakini hapa simulizi linaonyesha Mungu akishughulika na Balaamu. Tafsiri kuu inadumisha wazo la kukutana, na tanbihi inaeleza upana wa neno bila kuingiza wazo la kwamba Mungu alitenda kwa bahati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imetaja Balaamu wazi kama msemaji ili kuepuka utata wa viwakilishi. Umoja wa ‘madhabahu’ katika kishazi cha mwisho umehifadhiwa kulingana na Kiebrania.
