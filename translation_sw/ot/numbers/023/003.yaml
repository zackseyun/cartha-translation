  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם לְ/בָלָ֗ק הִתְיַצֵּב֮ עַל עֹלָתֶ/ךָ֒ וְ/אֵֽלְכָ֗ה אוּלַ֞י יִקָּרֵ֤ה יְהוָה֙ לִ/קְרָאתִ֔/י וּ/דְבַ֥ר מַה יַּרְאֵ֖/נִי וְ/הִגַּ֣דְתִּי לָ֑/ךְ וַ/יֵּ֖לֶךְ שֶֽׁפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/003.yaml
  text: Then Balaam said to Balak[a], “Stand beside your burnt offering, and I will go. Perhaps Yahweh will come to meet me, and whatever he shows me I will tell you.” Then he went to a bare height.
translation:
  language: sw
  text: Kisha Balaamu akamwambia Balaki, “Simama kando ya sadaka yako ya kuteketezwa, nami nitaenda. Huenda Yahwe akaja kukutana nami; chochote atakachonionyesha, nitakuambia.” Kisha akaenda mahali pa juu palipo wazi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kilele kisicho na mimea” au “kilima kilicho wazi.” Neno la Kiebrania ni adimu na huenda linamaanisha sehemu ya juu iliyo wazi na isiyo na miti.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַצֵּב עַל עֹלָתֶךָ
  choice: Simama kando ya sadaka yako ya kuteketezwa
  rationale: Kitenzi cha Hitpaeli kinamtaka Balaki ashike nafasi yake, na עַל katika muktadha huu inaonyesha kuwa karibu na dhabihu, si juu yake. עֹלָה ni sadaka inayoteketezwa kabisa.
- source_word: וְאֵלְכָה
  choice: nami nitaenda
  rationale: Umbo la cohortative linaonyesha kusudi la Balaamu kwenda; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אוּלַי
  choice: Huenda
  rationale: Linadumisha maana ya uwezekano na kutokuwa na uhakika katika maneno ya Balaamu.
- source_word: יִקָּרֵה יְהוָה לִקְרָאתִי
  choice: Yahwe akaja kukutana nami
  rationale: קרה katika Nifali hapa inaelekea kumaanisha kutokea kwa mkutano. Tafsiri hii ni ya asili katika Kiswahili, huku ‘Huenda’ ikihifadhi hali ya kutokuwa na uhakika.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa konsonanti nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וּדְבַר מַה יַּרְאֵנִי
  choice: chochote atakachonionyesha
  rationale: Usemi wa Kiebrania umebanwa; katika muktadha unamaanisha maudhui yoyote ambayo Mungu atamwonyesha Balaamu.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: nitakuambia
  rationale: Hiphili ya נגד hapa ina maana ya kumwambia au kumjulisha mtu jambo.
- source_word: שֶׁפִי
  choice: mahali pa juu palipo wazi
  rationale: Neno adimu linaelekea kutaja sehemu ya juu iliyo wazi au isiyo na mimea mingi. Tafsiri hii inadumisha wazo la kijiografia bila kuongeza maelezo yasiyothibitishwa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Hali ya mkutano unaotarajiwa na Mungu
  choice: Huenda Yahwe akaja kukutana nami
  alternative: Labda Yahwe atanitokea
  rationale: Tafsiri iliyochaguliwa huhifadhi uwezekano unaoonyeshwa na אוּלַי bila kudokeza kwamba Mungu hutenda kwa bahati nasibu, wala bila kugeuza mkutano huo kuwa aina mahususi zaidi ya ufunuo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Sadaka ya kuteketezwa’ ni istilahi ya kawaida ya kibiblia, na sentensi zimewekwa kwa mtiririko wa asili bila kuondoa hali ya kutokuwa na uhakika katika kauli ya Balaamu.
