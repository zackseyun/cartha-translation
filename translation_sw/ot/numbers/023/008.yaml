base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/008.yaml
  text: How can I curse whom God has not cursed? And how can I denounce whom Yahweh has not denounced?[a]
translation:
  language: sw
  text: Nitamlaanije yule ambaye Mungu hakumlaani? Nami nitamghadhibikiaje yule ambaye Yahweh hakumghadhibikia?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitamshutumuje yule ambaye Yahweh hakumshutumu?” Kitenzi cha Kiebrania katika mstari wa pili kinaweza kusisitiza kutoa shutuma au ghadhabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶקֹּב
  choice: Nitamlaanije
  rationale: Katika swali hili la balagha, מָה pamoja na kitenzi huonyesha kutowezekana au changamoto, si ombi la taarifa. Muundo wa Kiswahili wenye -je unatoa maana hiyo kwa njia ya asili.
- source_word: לֹא קַבֹּה אֵל
  choice: ambaye Mungu hakumlaani
  rationale: Kitenzi קבב/נקב katika muktadha huu kina maana ya kulaani. Kurudia mzizi wa Kiswahili 'laani' kunadumisha ulinganifu wa kile Balaamu angefanya na kile Mungu hakufanya.
- source_word: אֵל
  choice: Mungu
  rationale: אֵל hapa imetafsiriwa kwa cheo cha kawaida 'Mungu' badala ya kunukuliwa kama 'El', kwa kuwa ndivyo maana yake inavyoeleweka kwa kawaida katika mstari huu.
- source_word: וּמָה אֶזְעֹם
  choice: Nami nitamshutumuje
  rationale: וּ inaendeleza usambamba, na זעם inaweza kumaanisha kuonyesha ghadhabu kwa kumkemea au kumshutumu mtu. 'Kumshutumu' hutofautisha kitenzi hiki na 'kulaani' huku ikihifadhi tendo la usemi lenye uhasama.
- source_word: לֹא זָעַם
  choice: hakumshutumu
  rationale: Mzizi uleule wa Kiswahili umetumiwa katika vipande vyote viwili vya mstari wa pili ili kuhifadhi uhusiano wa kileksia uliopo katika Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa 'Yahwe' badala ya kubadilishwa na cheo kama 'Bwana', hivyo kutofautisha jina hilo na אֵל, 'Mungu'.
theological_decisions:
- issue: Kutofautisha majina אֵל na יהוה katika usambamba wa kishairi
  choice: אֵל limetafsiriwa 'Mungu' na יהוה limetoholewa 'Yahwe'.
  alternative: Kutafsiri yote mawili kwa jina la jumla 'Mungu', au kutumia 'Bwana' badala ya יהוה.
  rationale: Kiebrania kinatumia kwa makusudi cheo אֵל katika mstari wa kwanza na jina יהוה katika wa pili. Tafsiri hii inadumisha tofauti hiyo bila kuingiza dai la kimadhehebu.
- issue: Nguvu ya kitenzi זעם
  choice: Kumshutumu
  alternative: Kumghadhibikia
  rationale: זעם inaweza kueleza ama ghadhabu yenyewe ama kuitoa kwa usemi wa shutuma. Matini kuu inachagua tendo la usemi linalolingana na muktadha wa Balaamu, huku tanbihi ikihifadhi maana mbadala ya ghadhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali ya balagha wenye -je ni wa asili na unaeleweka kwa urahisi; 'yule ambaye' huweka wazi mtendewa anayodokezwa na Kiebrania.
