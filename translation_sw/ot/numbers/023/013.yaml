base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/013.yaml
  text: Then Balak said to him, “Please come with me to another place, from where you may see him. You will see only the edge of him, and you will not see all of him; then curse him for me from there.”
translation:
  language: sw
  text: Kisha Balaki akamwambia, “Tafadhali twende pamoja mahali pengine; ukiwa huko utawaona. Utaona tu sehemu yao ya pembeni,[a] lakini hutawaona wote;[b] kisha uwalaani kwa ajili yangu kutoka huko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mwisho wake tu” au “ukingo wake tu,” ikimaanisha kwamba sehemu ndogo tu ya Israeli ingeonekana.'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia viwakilishi vya umoja (“yeye” na “wote wake”) kwa Israeli kama taifa moja; Kiswahili kinatumia wingi kwa kuwa kinawarejelea watu wa Israeli.
    reason: alternative_reading
lexical_decisions:
- source_word: לך־נא אִתִּי
  choice: Tafadhali fuatana nami kwenda
  rationale: Kauli ya amri pamoja na נָא ni ombi la heshima. ‘Fuatana nami kwenda’ ni Kiswahili cha kawaida kinachoonyesha kwamba Balaki anamwomba Balaamu waondoke pamoja.
- source_word: מָקוֹם אַחֵר
  choice: mahali pengine
  rationale: Huhifadhi maana halisi ya kuhamia eneo tofauti kwa lugha ya kawaida.
- source_word: אֲשֶׁר תִּרְאֶנּוּ מִשָּׁם
  choice: ambako unaweza kuwaona kutoka huko
  rationale: Hulitambulisha eneo jipya kama mahali pa kuwatazama Israeli; ‘unaweza’ linafaa kwa hali inayotarajiwa bila kuifanya ahadi ya hakika.
- source_word: אֶפֶס קָצֵהוּ
  choice: sehemu yao ya pembeni tu
  rationale: אֶפֶס linaweka mpaka wa kile kitakachoonekana, na קָצֶה ni mwisho, ukingo, au sehemu ya pembeni. Tafsiri hii inaeleweka kwa kundi la watu linaloonekana kwa sehemu tu.
- source_word: וְכֻלּוֹ לֹא תִרְאֶה
  choice: lakini hutawaona wote
  rationale: Huweka wazi utofautishaji kati ya kuona sehemu ndogo na kuona taifa lote; wingi wa Kiswahili unarejelea watu wa Israeli kwa kawaida.
- source_word: וְקָבְנוֹ לִי
  choice: kisha unilaanie
  rationale: Mzizi קבב katika simulizi hili unamaanisha kulaani. Umbo ‘unilaanie’ linaonyesha kwamba Balaki anataka laana hiyo itolewe kwa ajili yake.
- source_word: מִשָּׁם
  choice: kutoka huko
  rationale: Kirai cha mahali kimehifadhiwa ili kuonyesha kwamba Balaki alitaka laana itolewe kutoka kwenye eneo hilo jipya.
theological_decisions:
- issue: Viwakilishi vya umoja vinavyowarejelea Israeli kama taifa moja
  choice: Kutumia wingi wa kawaida wa Kiswahili katika matini kuu (‘kuwaona,’ ‘yao,’ ‘wote’) na kueleza umoja wa Kiebrania katika tanbihi
  alternative: Kutumia umoja (‘kumwona,’ ‘yake,’ ‘wote’) ili kuiga moja kwa moja viambishi vya Kiebrania
  rationale: Kiebrania kinawaona Israeli kama jumuiya moja na kutumia viambishi vya umoja. Kiswahili cha kawaida huwarejelea watu kwa wingi; umbo hilo linaepuka lugha isiyo ya kawaida bila kuficha sura ya Kiebrania, ambayo imeainishwa katika tanbihi.
- issue: Nguvu ya amri לך katika muktadha
  choice: 'Kuitafsiri kama ombi la kuandamana: ‘Tafadhali fuatana nami kwenda’'
  alternative: ‘Tafadhali nenda pamoja nami’
  rationale: Ingawa הלך kwa msingi ni ‘kwenda,’ muktadha unaonyesha Balaki akimwalika Balaamu waondoke pamoja. Tafsiri iliyochaguliwa ni ya kawaida na huhifadhi ombi pamoja na mwendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Fuatana nami kwenda’ ni ombi la kawaida lisilo kali, na ‘sehemu yao ya pembeni’ linaeleza mtazamo mdogo wa kundi bila kuleta picha isiyo ya kawaida ya ‘ukingo wa mtu.’
