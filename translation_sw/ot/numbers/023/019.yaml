base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/019.yaml
  text: God is not a man[a], that he should lie, or a son of man, that he should change his mind. Has he said, and will he not do it? Or has he spoken[c][b], and will he not establish it?
translation:
  language: sw
  text: 'Mungu si mwanadamu, hata aseme uongo,

    wala si mwana wa binadamu[b], hata abadili nia yake.[a]

    Je, amesema, naye hatatenda?

    Au amenena, naye hatalitimiza[c]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aghairi”; kwa jadi, “atubu.” Kitenzi cha Kiebrania kinaweza kumaanisha kubadili mwelekeo au kughairi, lakini hapa kinazungumzia uaminifu wa Mungu, si kutubu kosa la kimaadili.
    reason: lexical_alternative
  - marker: b
    text: Hapa “mwana wa binadamu” ni msemo wa Kiebrania unaomaanisha binadamu; si cheo cha Kimasihi.
    reason: cultural_note
  - marker: c
    text: Au “hatalithibitisha” au “hatali­tekeleza.” Kwa maana halisi, Kiebrania kinasema “kulifanya lisimame.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Mungu
  rationale: Katika muktadha huu neno hili linamtaja Mungu wa Israeli; “Mungu” ni tafsiri ya kawaida na hudumisha utofauti kati yake na mwanadamu.
- source_word: אִישׁ
  choice: mwanadamu
  rationale: Hapa neno hili linamweka Mungu kinyume na binadamu. “Mwanadamu” ni wazi katika Kiswahili na hudumisha ulinganifu na “mwana wa binadamu.”
- source_word: וִיכַזֵּב
  choice: hata aseme uongo
  rationale: Kitenzi כזב humaanisha kusema uongo au kuthibitika kuwa mwongo; kauli hii ya Kiswahili inaeleza moja kwa moja uaminifu wa Mungu.
- source_word: בֶן אָדָם
  choice: mwana wa binadamu
  rationale: Tafsiri hii huhifadhi muundo wa kishairi wa Kiebrania. Katika mstari huu ni msemo wa kumaanisha binadamu, wala si cheo cha Kimasihi.
- source_word: וְיִתְנֶחָם
  choice: hata abadili nia yake
  rationale: Katika muktadha huu נחם inaashiria kubadili kusudi au kughairi. “Abadili nia yake” ni Kiswahili cha sasa kisichodokeza kwamba Mungu anatubu kosa la kimaadili.
- source_word: הַהוּא אָמַר
  choice: Je, amesema
  rationale: Ingawa umbo la Kiebrania ni kauli, pamoja na kishazi kinachofuata linaunda swali la balagha; “Je, amesema” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: יַעֲשֶׂה
  choice: naye hatatenda
  rationale: עשה ni kitenzi kipana chenye maana ya kufanya au kutenda. “Hatatenda” hudumisha maana ya kutekeleza alichosema bila kuongeza kitu maalumu kisichotajwa.
- source_word: וְדִבֶּר
  choice: Au amenena
  rationale: דבר hapa ni kusema au kutamka neno. “Amenena” hutofautisha mstari huu na “amesema” huku ikidumisha usambamba wa kishairi kwa lugha yenye heshima.
- source_word: יְקִימֶנָּה
  choice: naye hatalitimiza
  rationale: Hiphil ya קום ni kukifanya kitu kisimame, yaani kukithibitisha au kukitimiza. “Kulitimiza” huwasilisha kwa kawaida wazo la Mungu kutekeleza neno alilolinena.
theological_decisions:
- issue: Lugha kuhusu Mungu kubadili nia katika וְיִתְנֶחָם
  choice: abadili nia yake
  alternative: aghairi; atubu
  rationale: Mstari unasisitiza uaminifu wa Mungu tofauti na ugeugeu wa wanadamu. Tafsiri hii haitumbukizi dai pana la kifalsafa kuliko maandishi yenyewe, wala haidokezi toba ya Mungu kutokana na kosa la kimaadili.
- issue: Ikiwa בֶן אָדָם ni cheo cha Kimasihi
  choice: msemo wa kawaida “mwana wa binadamu” unaomaanisha binadamu
  alternative: kutafsiri kama cheo cha Kimasihi; “binadamu”
  rationale: Katika Hesabu 23:19 msemo huo ni sehemu ya usambamba wa kishairi unaomlinganisha Mungu na mwanadamu; muktadha hauutumii kama cheo cha Masihi.
- issue: Maana ya יְקִימֶנָּה kuhusu neno la Mungu
  choice: kulitimiza
  alternative: kulithibitisha; kulisimamisha
  rationale: Tafsiri hii inaonyesha kuwa Mungu hutekeleza alichonena, huku tanbihi ikihifadhi picha halisi ya Kiebrania ya ‘kukifanya kisimame.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mistari mifupi huhifadhi usambamba na maswali ya balagha ya Kiebrania. “Amenena” imetumiwa kwa ladha ya kishairi bila kufanya sentensi kuwa ya kizamani kupita kiasi.
