translation:
  language: sw
  text: Tazama, nimepokea kubariki[a]; amebariki[b], nami siwezi kuibatilisha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa muundo wa karibu zaidi, “nimepokea kubariki”; Kiebrania hakitaji wazi kitu kilichopokewa.
