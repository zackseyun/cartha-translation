lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni neno la kuvuta usikivu; “Tazama” lina nguvu hiyo kwa Kiswahili cha heshima bila kuwa la kizamani kupita kiasi.
- source_word: בָרֵךְ לָקָחְתִּי
  choice: nimepokea agizo la kubariki
  rationale: 'Kitenzi לָקַחְתִּי kimsingi ni “nimepokea/nimechukua,” huku בָרֵךְ kikionyesha kusudi au yaliyomo: kubariki. “Agizo” linaweka wazi kitu kilichoachwa kudokezwa katika Kiebrania na kufanya sentensi iwe ya kawaida kwa Kiswahili.'
- source_word: וּבֵרֵךְ
  choice: amebariki
  rationale: Umbo la kitenzi ni nafsi ya tatu, umoja, kiume, lakini nomino ya mtendaji haikutajwa. Kiswahili pia kinaweza kuacha mtendaji ndani ya umbo la kitenzi na hivyo kuhifadhi ufupi wa Kiebrania.
- source_word: אֲשִׁיבֶנָּה
  choice: siwezi kuibatilisha
  rationale: Hifili ya שוב ina wazo la kukifanya kitu kirudi au kukigeuza. Katika muktadha huu inamaanisha kutangua au kuondoa baraka iliyotamkwa; “kuibatilisha” ni wazi na ya kawaida.
theological_decisions:
- issue: Mtendaji aliyedokezwa katika “amebariki”
  choice: 'Mtendaji hakuwekewa jina katika matini kuu: “amebariki.”'
  alternative: “Mungu amebariki.”
  rationale: Muktadha unaonyesha kwa nguvu kuwa Mungu ndiye mtendaji, lakini Kiebrania hakitaji jina lake katika kishazi hiki. Kutomwongeza katika matini kuu kunahifadhi ufupi na hali ya kidokezo ya chanzo.
- issue: Kitu kilichopokewa na Balaamu
  choice: “agizo la kubariki”
  alternative: “nimepokea kubariki” au “nimepokea baraka”
  rationale: Kiebrania kinaacha kitu cha “kupokea” bila kutajwa wazi. Muktadha wa usemi wa kinabii unaunga mkono agizo au ujumbe wa kubariki, lakini tanbihi inahifadhi muundo wa moja kwa moja na utata wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Tazama” hudumisha nguvu ya mwito wa usikivu; muundo wa “amebariki” huhifadhi mtendaji aliyedokezwa katika Kiebrania.
