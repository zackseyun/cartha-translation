base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/006.yaml
  text: Then he returned to him, and behold, he was standing beside his burnt offering—he and all the princes of Moab.
translation:
  language: sw
  text: Kisha Balaamu akarudi kwa Balaki, akamkuta amesimama kando ya sadaka yake ya kuteketezwa, yeye pamoja na wakuu wote wa Moabu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב אֵלָיו
  choice: Kisha Balaamu akarudi kwa Balaki
  rationale: 'Kiebrania kina viwakilishi vya nafsi ya tatu ambavyo warejelewa wake hutambulika kutokana na muktadha: Balaamu ndiye anayerudi, na Balaki ndiye anayerejelewa. Kutaja majina kunazuia utata usio wa maana katika Kiswahili.'
- source_word: וְהִנֵּה
  choice: akamkuta
  rationale: Katika simulizi, neno hili linamwelekeza msomaji kwenye jambo aliloliona Balaamu aliporudi. Kiswahili cha asili hutumia ‘akamkuta’ hapa badala ya tafsiri ya moja kwa moja ‘tazama’.
- source_word: נִצָּב עַל־עֹלָתוֹ
  choice: amesimama kando ya sadaka yake ya kuteketezwa
  rationale: ‘Nitsav’ huonyesha kusimama au kuwepo katika hali ya kusimama; ‘al’ hapa ina maana ya kuwa karibu/kando ya sadaka, si juu yake. ‘Olah’ ni sadaka inayoteketezwa yote.
- source_word: שָׂרֵי מוֹאָב
  choice: wakuu wa Moabu
  rationale: ‘Sarim’ hapa ni viongozi au watu wenye cheo wa Moabu; ‘wakuu’ ni neno la kawaida, lenye hadhi, lisilobana maana kuwa ya kifalme pekee.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Majina ya Balaamu na Balaki yamewekwa wazi kwa sababu matumizi mfululizo ya ‘yeye/kwake’ yangekuwa tata katika Kiswahili, ingawa marejeleo yake yako wazi katika muktadha wa Kiebrania.
