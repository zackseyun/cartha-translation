base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/029.yaml
  text: Then Balaam said to Balak, “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: sw
  text: Kisha Balaamu akamwambia Balaki, “Nijengee hapa madhabahu saba, na unitayarishie hapa mafahali saba na kondoo dume saba.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Kisha” pamoja na kitenzi cha Kiswahili chenye kiambishi cha mtendewa hutoa usemi wa kawaida na sahihi.
- source_word: בִּלְעָם
  choice: Balaamu
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אֶל בָּלָק
  choice: akamwambia Balaki
  rationale: Katika Kiswahili, אֶל pamoja na kitenzi cha kusema huwasilishwa kwa kawaida kwa kiambishi cha mtendewa -mw-; “Balaki” ni umbo la jina linalofaa katika nafasi ya yambwa.
- source_word: בְּנֵה לִי
  choice: Nijengee
  rationale: Amri ya בנה na לִי ya manufaa imewasilishwa kwa kauli ya kutendea, inayomaanisha ‘jenga kwa ajili yangu’ kwa Kiswahili cha kawaida.
- source_word: בָּזֶה
  choice: hapa
  rationale: Kirai hiki kina maana ya mahali, ‘katika mahali hapa’; “hapa” ni tafsiri ya asili na fupi.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: madhabahu saba
  rationale: Kirai cha moja kwa moja cha idadi; “madhabahu” ndilo neno la kawaida kwa sehemu za kutolea dhabihu.
- source_word: וְהָכֵן לִי
  choice: na unitayarishie
  rationale: Hiphil ya כון hapa ina maana ya kuweka tayari au kuandaa; kauli ya kutendea huhifadhi maana ya לִי, ‘kwa ajili yangu.’
- source_word: שִׁבְעָה פָרִים
  choice: mafahali saba
  rationale: פָרִים katika muktadha wa dhabihu ni ng’ombe wa kiume; “mafahali” ni neno wazi la Kiswahili bila kuongeza wazo la umri ambalo mstari huu haulazimishi.
- source_word: וְשִׁבְעָה אֵילִים
  choice: na kondoo dume saba
  rationale: אֵילִים ni kondoo wa kiume; “kondoo dume” ni usemi wazi na wa kawaida katika Kiswahili sanifu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Kauli za kutendea “nijengee” na “unitayarishie” zinahifadhi לִי mara zote mbili bila uzito usio wa lazima. Marudio ya “hapa” yamehifadhiwa kwa kuwa yapo katika Kiebrania na yanasisitiza mahali pa maandalizi.
