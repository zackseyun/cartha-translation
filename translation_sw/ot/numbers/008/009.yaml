  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/הִ֨קְהַלְתָּ֔ אֶֽת כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/009.yaml
  text: Then you shall bring the Levites before the tent of meeting[a], and you shall assemble the whole congregation of the sons of Israel.
translation:
  language: sw
  text: Kisha utawaleta Walawi mbele ya hema la kukutania, na utakusanya kusanyiko lote la wana wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Waisraeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Kisha utawaleta
  rationale: Hifili ya קרב humaanisha kuleta karibu au kuwasilisha. “Utawaleta” ni Kiswahili cha kawaida kinachohifadhi tendo la kuwasogeza Walawi kwenye mahali patakatifu; “Kisha” linaonyesha mfuatano wa maagizo.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa watu wa kabila la Lawi waliotengwa kwa huduma ya patakatifu.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Kirai hiki huonyesha kuwa mbele au mkabala wa kitu; “mbele ya” ni cha kawaida na kinafaa katika mazingira rasmi ya ibada.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni neno linalotambulika katika Kiswahili cha Biblia kwa hema takatifu ambako Mungu alikutana na watu wake.
- source_word: וְהִקְהַלְתָּ
  choice: na kulikusanya
  rationale: Hifili ya קהל ina maana ya kukusanya au kuitisha jumuiya. “Kulikusanya” linaeleza kwa kawaida tendo la kuleta kusanyiko pamoja.
- source_word: כָּל עֲדַת
  choice: kusanyiko lote
  rationale: עֵדָה humaanisha jumuiya ya Israeli iliyokusanyika, na כָּל linaonyesha ukamilifu wake. “Kusanyiko lote” ni sahihi na linaeleweka kwa urahisi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inahifadhi taswira halisi ya uhusiano wa kifamilia katika Kiebrania, huku ikiwa usemi unaotambulika katika Kiswahili cha Biblia.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Kiebrania kina umbo la wingi wa kiume linalomaanisha watu wa agano kwa ujumla. Matini kuu inahifadhi usemi wa kifamilia wa chanzo, huku tanbihi ikitoa neno la kawaida zaidi la Kiswahili bila kubadili maana ya kijumuiya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifungu cha maagizo ya ibada lakini kinachoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya “wana wa Israeli,” ambako mbadala wake unahusika moja kwa moja.
