base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/005.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: sw
  text: Yahwe[a] akanena na Musa, akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa kawaida hutafsiriwa “BWANA.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akanena
  rationale: Kitenzi דּבר katika fomula hii ya kisimulizi kina maana ya kusema au kunena na mtu. “Akanena” huhifadhi tofauti yake na לֵאמֹר na kinafaa kwa lugha yenye heshima.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe” badala ya kubadilishwa kuwa cheo “BWANA”.
- source_word: אֶל
  choice: na
  rationale: Katika muundo wa Kiswahili “kunena na mtu,” kihusishi “na” huonyesha kwa njia ya kawaida mtu anayeambiwa.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Jina hili limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kitenzi-jina hiki hutanguliza maneno yanayofuata. “Akisema” huhifadhi fomula ya Kiebrania na kuonyesha kwamba ujumbe wenyewe unafuata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikitaja desturi nyingine ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka. “Akanena ... akisema” kimetumiwa kuhifadhi fomula ya usemi ya Kiebrania na tofauti kati ya וַיְדַבֵּר na לֵאמֹר.
