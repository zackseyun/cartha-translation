  yaml_path: translation/ot/numbers/008/016.yaml
  text: For they are wholly given to me from among the sons of Israel[a]; in place of everyone who opens the womb, the firstborn of all the sons of Israel[c][b], I have taken them for myself.
translation:
  language: sw
  text: Kwa maana wamekabidhiwa kabisa kwangu kutoka miongoni mwa wana wa Israeli[a]. Badala ya kila afunguaye tumbo, yaani, kila mzaliwa wa kwanza miongoni mwa wana wa Israeli[b][c], nimewachukua kwa ajili yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hurudia neno “wamekabidhiwa” ili kutia msisitizo; pia inaweza kutafsiriwa “hakika wamekabidhiwa kwangu” au “wamekabidhiwa kikamilifu kwangu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kila afunguaye tumbo,” nahau inayomaanisha mzaliwa wa kwanza.'
    reason: lexical_alternative
  - marker: c
    text: 'Au “Waisraeli” au “watu wa Israeli”; Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְתֻנִים נְתֻנִים
  choice: wamekabidhiwa kabisa
  rationale: Urudiaji wa neno la Kiebrania unasisitiza kwamba Walawi wametolewa na kuwekwa wakfu kikamilifu kwa Mungu; Kiswahili cha asili hutumia kielezi cha msisitizo badala ya kurudia neno.
- source_word: לִי
  choice: kwangu
  rationale: Katika kishazi cha kwanza, linaonyesha kwamba wamekabidhiwa kwa Mungu na kuwa chini ya milki na utumishi wake.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: kutoka miongoni mwa wana wa Israeli
  rationale: Neno מִתּוֹךְ linaonyesha kuchaguliwa kutoka ndani ya kundi; “miongoni mwa” ni sahihi na la kawaida katika Kiswahili.
- source_word: תַּחַת
  choice: badala ya
  rationale: 'Hapa linaonyesha uwakilishi: Walawi wanachukuliwa mahali pa wazaliwa wa kwanza.'
- source_word: פִּטְרַת כָּל רֶחֶם
  choice: kila mzaliwa wa kwanza anayefungua tumbo la uzazi
  rationale: Tafsiri hii inahifadhi taswira ya nahau ya Kiebrania huku ikibainisha kwa Kiswahili kwamba anayelengwa ni mzaliwa wa kwanza.
- source_word: בְּכוֹר כֹּל מִבְּנֵי יִשְׂרָאֵל
  choice: miongoni mwa wana wa Israeli
  rationale: Neno “mzaliwa wa kwanza” limeunganishwa na nahau iliyotangulia ili kuepuka uradidi usio wa kawaida, huku upeo wa kundi la Israeli ukihifadhiwa.
- source_word: לָקַחְתִּי אֹתָם לִי
  choice: nimewachukua wawe wangu
  rationale: Kauli hii inaonyesha tendo lililokamilika la Mungu kuwadai Walawi kwa ajili yake mwenyewe; “wawe wangu” ni Kiswahili cha kawaida na huhifadhi maana ya umiliki na kuwekwa wakfu.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: Kiebrania kina usemi wa kifamilia wa kiume “wana wa Israeli.” Tafsiri kuu inauhifadhi, huku tanbihi ikieleza maana yake ya kijumuiya.
- issue: Uhusiano wa Walawi na wazaliwa wa kwanza
  choice: Badala ya
  alternative: mahali pa / kwa kubadilishana na
  rationale: תַּחַת hapa linaonyesha uwakilishi bila kufafanua zaidi namna ya kitheolojia ya uwakilishi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa Kiebrania umehifadhiwa pale unapokuwa wa asili katika Kiswahili; urudiaji wa msisitizo umehamishwa kuwa “kabisa,” na nahau ya kufungua tumbo la uzazi imehifadhiwa pamoja na ufafanuzi wa “mzaliwa wa kwanza.”
