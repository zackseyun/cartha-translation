base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/011.yaml
  text: Aaron shall present the Levites as a wave offering before Yahweh from the sons of Israel[b][a], and they shall be to serve the service of Yahweh.
translation:
  language: sw
  text: Haruni atawasilisha[a] Walawi kama sadaka ya kutikiswa mbele ya Yahwe, kutoka kwa wana wa Israeli[b]; nao watakuwa wa kufanya utumishi wa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Haruni atawatikisa Walawi kama sadaka ya kutikiswa mbele ya Yahwe.” Kitenzi cha Kiebrania kinatokana na mzizi uleule wa neno “sadaka ya kutikiswa” na kinaeleza tendo la kiibada la kuwasilisha.
    reason: lexical_alternative
  - marker: b
    text: “Kutoka kwa wana wa Israeli” pia yaweza kueleweka “kwa niaba ya wana wa Israeli,” yaani, Walawi wanawasilishwa wakiwawakilisha Waisraeli katika utumishi wa Yahwe.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: atawasilisha ... kama sadaka ya kutikiswa
  rationale: Kitenzi na nomino zinatokana na mzizi mmoja na zinaeleza tendo la kiibada la kuwasilisha. Kwa kuwa wanaowasilishwa ni watu, ‘atawasilisha’ huepuka kudokeza kwamba Haruni aliwatikisa kimwili, huku ‘sadaka ya kutikiswa’ ikihifadhi istilahi ya ibada.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la kundi la kikabila na la kihuduma katika Kiswahili cha Biblia.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Ni namna ya kawaida na yenye heshima ya kueleza kuwa katika uwepo wa Yahwe.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: kutoka kwa wana wa Israeli
  rationale: Inahifadhi maana ya chanzo au utoaji kutoka kwa Waisraeli, bila kufuta uwezekano wa kwamba Walawi wanawasilishwa kwa niaba yao.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת יְהוָה
  choice: nao watakuwa kwa ajili ya kufanya huduma ya Yahwe
  rationale: Inahifadhi wazo la kusudi au mgawo linalofuata ibada ya kuwasilishwa, pamoja na msisitizo wa Kiebrania unaounganisha kitenzi ‘kutumikia/kufanya’ na nomino ‘huduma’.
theological_decisions:
- issue: Walawi kuitwa sadaka ya kutikiswa
  choice: atawasilisha Walawi kama sadaka ya kutikiswa
  alternative: atawatikisa Walawi kama sadaka ya kutikiswa
  rationale: Chaguo hili linadumisha lugha ya kiibada na ya utoaji bila kudokeza kuwa Walawi walitolewa dhabihu kwa kuuawa au walitikiswa kimwili.
- issue: Maana ya מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: kutoka kwa wana wa Israeli
  alternative: kwa niaba ya wana wa Israeli
  rationale: Kihusishi kinaweza kuonyesha kwamba Walawi wanatolewa kutoka kwa Israeli, huku muktadha pia ukiruhusu wazo la uwakilishi. Tafsiri kuu inahifadhi maana ya msingi, na tanbihi inaonyesha uwezekano mwingine.
- issue: Usemi בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi wa Kiebrania umehifadhiwa kwa ukaribu kama jina la agano la kundi zima, bila kulazimisha tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Istilahi ya kiibada ‘sadaka ya kutikiswa’ imehifadhiwa, huku kitenzi ‘atawasilisha’ kikifanya sentensi iwe ya asili na kuzuia picha potovu ya kuwatikisa watu kimwili.
