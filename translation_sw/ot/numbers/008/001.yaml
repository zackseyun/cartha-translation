  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: sw
  text: Yahwe[a] akazungumza na Musa, akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi limetafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akazungumza
  rationale: Kitenzi דּבר kinaonyesha tendo la kuzungumza; muundo wa Kiswahili wenye kiambishi -ka- unaendeleza simulizi kwa kawaida bila kulazimika kuongeza neno tofauti la ‘na’ au ‘kisha’.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahwe’ ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: אֶל
  choice: na
  rationale: Baada ya kitenzi ‘kuzungumza,’ Kiswahili cha kawaida hutumia ‘na’ kumtaja mtu anayeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: ‘Musa’ ndilo umbo sanifu la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Neno hili linahifadhi fomula ya Kiebrania inayotanguliza maneno yanayofuata, huku likibaki wazi kwamba ujumbe wenyewe utafuata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia moja kwa moja Tetragramatoni יהוה. ‘Yahwe’ huhifadhi jina hilo la agano, ilhali ‘BWANA’ ni uingizwaji wa kimapokeo kwa kutumia cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akazungumza ... akisema’ huhifadhi tofauti ya דּבר na fomula לֵאמֹר, ingawa marudio hayo ni ya kimakusudi kwa sababu yanaakisi muundo wa chanzo.
