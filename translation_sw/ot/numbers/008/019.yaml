review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the Levites’ selection from Israel, their assignment to Aaron and his sons, their tent-of-meeting service, atonement for Israel, and the prevention of a plague when Israelites approach the holy place. However, “nimewatoa ... na kuwapa” foregrounds removal rather than the primary Hebrew assertion that God has given the Levites; a small restructuring better retains the repeated giving language.
  naturalness: The register and principal cultic terms are natural Standard East African Swahili. The revised opening is clearer and more closely follows the Hebrew’s appositional emphasis.
  terminology: “Walawi,” “Hema la Kukutania,” “upatanisho,” “pigo,” and “mahali patakatifu” are appropriate and consistent. “Wana wa Israeli” properly preserves the formal Hebrew people designation.
  issues:
  - severity: medium
    issue: The opening verb “nimewatoa” can mean ‘I have taken them out/removed them,’ whereas וָאֶתְּנָה primarily says ‘I have given [them].’
    rationale: Although the following “kuwapa ... kuwa zawadi” restores much of the intended sense, the main assertion should explicitly be God’s giving of the Levites. Recasting the sentence also allows the repeated נתן language to be represented without suggesting mere physical removal.
  revised_text: Nami nimewapa Haruni na wanawe Walawi, waliotolewa kutoka miongoni mwa wana wa Israeli[b], kuwa zawadi[a], ili wafanye huduma ya wana wa Israeli katika Hema la Kukutania na kufanya upatanisho kwa ajili ya wana wa Israeli, kusudi pigo lisiwapate wana wa Israeli watakapokaribia mahali patakatifu[c].
