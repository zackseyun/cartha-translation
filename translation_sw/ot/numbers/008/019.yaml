  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וָ/אֶתְּנָ֨/ה אֶת הַ/לְוִיִּ֜ם נְתֻנִ֣ים לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֗י/ו מִ/תּוֹךְ֮ בְּנֵ֣י יִשְׂרָאֵל֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד וּ/לְ/כַפֵּ֖ר עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֨א יִהְיֶ֜ה בִּ/בְנֵ֤י יִשְׂרָאֵל֙ נֶ֔גֶף בְּ/גֶ֥שֶׁת בְּנֵֽי יִשְׂרָאֵ֖ל אֶל הַ/קֹּֽדֶשׁ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/019.yaml
  text: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel[a], to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel[c][b], so that there may not be a plague among the sons of Israel when the sons of Israel come near to the holy place.
translation:
  language: sw
  text: Nami nimewapa Haruni na wanawe Walawi, waliotolewa kutoka miongoni mwa wana wa Israeli[b], kuwa zawadi[a], ili wafanye huduma ya wana wa Israeli katika Hema la Kukutania na kufanya upatanisho kwa ajili ya wana wa Israeli, kusudi pigo lisiwapate wana wa Israeli watakapokaribia mahali patakatifu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walawi waliotolewa kwa Haruni na wanawe.” Kiebrania kinarudia mzizi wa neno “kutoa” ili kutia mkazo.
    reason: lexical_alternative
  - marker: b
    text: Au, “Waisraeli.”
    reason: lexical_alternative
  - marker: c
    text: Au, “patakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה ... נְתֻנִים
  choice: nimewatoa ... na kuwapa ... kuwa zawadi
  rationale: Muundo huu wa Kiswahili unaeleza kwamba Walawi walitengwa kutoka katika Israeli na kutolewa kwa Haruni na wanawe. Neno “zawadi” linadumisha mkazo wa Kiebrania unaorudia mzizi נתן, bila kutumia Kiswahili kisicho cha kawaida.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: kwa Haruni na wanawe
  rationale: Kihusishi ל kinaonyesha wanaopokea au kunufaika; “kuwapa Haruni na wanawe” ni usemi wa kawaida na ulio wazi katika Kiswahili.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: kutoka miongoni mwa wana wa Israeli
  rationale: “Miongoni mwa” linaonyesha uteuzi kutoka ndani ya kundi zima, na “wana wa Israeli” linahifadhi namna rasmi ya usemi wa Kiebrania.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: ili wafanye huduma ya
  rationale: Linadumisha lugha ya kazi au huduma waliyopewa, huku likitoa Kiswahili cha asili kuliko kurudia mzizi kama “kutumikia utumishi.”
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika Hema la Kukutania
  rationale: Hili ni jina la kawaida na linaloeleweka la hema takatifu ambako Mungu alikutana na watu wake.
- source_word: וּלְכַפֵּר עַל
  choice: na kufanya upatanisho kwa ajili ya
  rationale: “Kufanya upatanisho” huhifadhi maana ya ibada ya כפר bila kufafanua zaidi utaratibu wake au kupunguza jukumu linalotajwa katika mstari.
- source_word: נֶגֶף
  choice: pigo
  rationale: Katika muktadha wa kukaribia eneo takatifu isivyofaa, neno hili linaweza kumaanisha pigo la hukumu au maafa yenye kuua. “Pigo” ni pana vya kutosha kuliko “tauni,” ambayo huenda ikadokeza ugonjwa tu.
- source_word: בְּגֶשֶׁת
  choice: watakapokaribia
  rationale: 'Kitenzi-jina chenye ב kinaonyesha wakati au hali: pigo lisitokee wana wa Israeli wanapokaribia.'
- source_word: הַקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Katika muktadha huu neno linarejelea eneo takatifu, si utakatifu kama dhana ya jumla. Tafsiri hii haibani rejeo kuliko maandishi ya Kiebrania.
theological_decisions:
- issue: Jukumu la Walawi kuhusiana na Israeli na makuhani
  choice: Walawi wanatolewa kutoka miongoni mwa Israeli kwa Haruni na wanawe ili wafanye huduma ya Israeli na kufanya upatanisho kwa ajili yao.
  alternative: Walawi wanasaidia tu kazi za kawaida na hawana jukumu lolote linalohusiana na upatanisho.
  rationale: Mstari wenyewe unaunganisha huduma yao na kufanya upatanisho. Tafsiri inadumisha mvutano huo bila kuingiza mipaka ya kimafundisho isiyotajwa hapa.
- issue: Maana ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Huu ndio muundo halisi wa Kiebrania na jina rasmi la watu wa agano. Tanbihi inatoa mbadala wa kawaida wa Kiswahili bila kuondoa umbo la chanzo katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Hema la Kukutania,” “kufanya upatanisho,” na “mahali patakatifu” vinafaa sajili ya ibada huku vikibaki wazi kwa msomaji wa kawaida. Kurudiwa kwa “wana wa Israeli” kumedumishwa kwa sababu kunajitokeza mara nyingi katika chanzo na kunasisitiza uhusiano wa Walawi na taifa lote.
