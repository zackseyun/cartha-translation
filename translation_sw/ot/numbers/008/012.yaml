base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
translation:
  language: sw
  text: Kisha Walawi wataweka mikono yao juu ya vichwa vya hao mafahali, nawe utamtolea Yahwe mmoja kuwa sadaka ya dhambi[a] na mwingine kuwa sadaka ya kuteketezwa, ili kufanya upatanisho kwa ajili ya Walawi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha sadaka inayohusishwa na dhambi na utakaso katika taratibu za kikuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְמְכוּ אֶת יְדֵיהֶם
  choice: wataweka mikono yao
  rationale: Katika muktadha wa dhabihu, kitenzi סמך kinaeleza tendo la kiibada la kuweka mikono juu ya mnyama wa sadaka; tafsiri hii ni ya kawaida na wazi kwa Kiswahili.
- source_word: עַל רֹאשׁ הַפָּרִים
  choice: juu ya vichwa vya hao mafahali
  rationale: Ingawa רֹאשׁ iko katika umoja, maana yake hapa ni ya mgawanyo kwa mafahali wawili, hivyo wingi 'vichwa' ni wa asili katika Kiswahili.
- source_word: וַעֲשֵׂה
  choice: nawe utamtoa
  rationale: Amri inaelekezwa kwa mtu mmoja, na עשה ikiwa na sadaka kama yambwa humaanisha kuitoa au kuiandaa kama dhabihu; 'utamtoa' pia hudumisha umoja wa kila fahali.
- source_word: חַטָּאת
  choice: sadaka ya dhambi
  rationale: Hili ndilo neno linalotambulika kwa urahisi katika lugha ya kibiblia ya Kiswahili, huku maana mbadala ya sadaka ya utakaso ikihifadhiwa katika tanbihi.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno la kawaida la kiibada kwa sadaka iliyoteketezwa yote juu ya madhabahu.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi ל kinaonyesha sadaka inayotolewa kwa Mungu, na jina la agano יהוה limetafsiriwa moja kwa moja kuwa 'Yahwe'.
- source_word: לְכַפֵּר עַל הַלְוִיִּם
  choice: ili kufanya upatanisho kwa ajili ya Walawi
  rationale: Huhifadhi maana ya kiibada ya כפר bila kuifungamanisha na nadharia fulani ya kimadhehebu, na 'kwa ajili ya' huonyesha wanaofanyiwa upatanisho.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה; 'Yahwe' hulitaja kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חַטָּאת katika ibada ya dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno la Kiebrania linaweza kuhusishwa na dhambi au utakaso katika maandiko ya kikuhani. Maandishi makuu yanatumia istilahi inayojulikana zaidi, na tanbihi inadumisha uwezekano mwingine.
- issue: Maana ya כפר
  choice: kufanya upatanisho
  alternative: kufunika, kufuta, au kutakasa
  rationale: Tafsiri hii inadumisha uzito wa kiibada na kiteolojia wa kitenzi bila kuamua kwa siri utaratibu mahsusi wa upatanisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha maelekezo ya kiibada, umoja wa anayehudumu, wingi wa Walawi na mafahali, pamoja na utata halisi wa חַטָּאת.
