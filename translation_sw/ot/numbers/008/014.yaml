    text: Au, “watakuwa mali yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתָּ
  choice: Basi utawatenga
  rationale: Hifili ya בדל ina maana ya kutenga au kuweka kando. “Utawatenga” ni ya moja kwa moja, huku “Basi” ikionyesha hatua inayofuata katika utaratibu wa muktadha.
- source_word: אֶת הַלְוִיִּם
  choice: Walawi
  rationale: Hiki ni kihusishi cha yambwa tendwa kikifuatiwa na nomino ya wingi yenye uainisho. “Walawi” ndilo jina la kawaida la Kiswahili kwa watu wa kabila la Lawi.
- source_word: מִתּוֹךְ
  choice: kutoka miongoni mwa
  rationale: Kirai hiki kinaonyesha kutengwa kutoka ndani ya kundi kubwa. “Kutoka miongoni mwa” ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania, “wana wa Israeli,” bila kuufanya tu kuwa “Waisraeli.”
- source_word: וְהָיוּ לִי
  choice: nao ... watakuwa wangu
  rationale: Muundo wa היה pamoja na לִי unaonyesha kuwa mali ya au kuwa wa mtu. “Watakuwa wangu” huhifadhi kauli ya moja kwa moja bila kuingiza wazi dhana ya kuwekwa wakfu ambayo muktadha pekee ndiyo unaidokeza.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Kurudiwa kwa nomino katika Kiebrania kumehifadhiwa badala ya kutumia kiwakilishi pekee, ili kudumisha msisitizo wa chanzo.
theological_decisions:
- issue: Iwapo hali ya Walawi itafsiriwe kama kuwa mali ya Mungu au kama kuwekwa wakfu kwa ibada
  choice: Walawi watakuwa wangu
  alternative: Walawi watakuwa mali yangu; Walawi watawekwa wakfu kwangu
  rationale: Kiebrania לִי pamoja na היה kinaeleza moja kwa moja kuwa wao ni wa Mungu. Ingawa muktadha unahusu huduma takatifu, mstari huu hautumii wazi msamiati wa kuweka wakfu; kwa hiyo tafsiri haiongezi wazo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa msomaji wa leo lakini unahifadhi kurudiwa kwa “Walawi,” usemi “wana wa Israeli,” na maana ya msingi ya kuwa wa Mungu.
