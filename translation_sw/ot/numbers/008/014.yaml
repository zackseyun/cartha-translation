  text: So you shall separate the Levites from among the sons of Israel[c][b][a], and the Levites shall be mine.
translation:
  language: sw
  text: Basi utawatenga[a] Walawi kutoka miongoni mwa wana wa Israeli,[b] nao Walawi watakuwa wangu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utawaweka kando” badala ya “utawatenga.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Waisraeli”; kwa Kiebrania, “wana wa Israeli.”
    reason: lexical_alternative
