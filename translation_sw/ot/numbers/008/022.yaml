base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/022.yaml
  text: And after that the Levites came to perform their service in the tent of meeting before Aaron and before his sons. Just as Yahweh had commanded Moses concerning the Levites[a], so they did for them.
translation:
  language: sw
  text: Baada ya hayo, Walawi wakaja kufanya huduma yao katika Hema la Kukutania mbele ya Haruni na mbele ya wanawe. Kama vile Yahweh alivyomwamuru Musa kuhusu Walawi,[a] ndivyo walivyowatendea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndivyo walivyowafanyia.” Kiebrania kinasema kwa ufupi, na huenda kinarejelea kutekelezwa kwa taratibu zilizoagizwa kwa ajili ya Walawi au kuwahusu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Huonyesha hatua iliyofuata baada ya utakaso na kuwekwa rasmi kwa Walawi katika muktadha uliotangulia; Kiswahili hiki ni cha kawaida na huhifadhi mpangilio wa wakati.
- source_word: בָּאוּ
  choice: wakaja
  rationale: Huhifadhi kitenzi cha kawaida cha mwendo bila kuongeza wazo la kuingia ndani ya hema, ambalo halisemwi wazi na kitenzi chenyewe.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la kundi hilo katika Kiswahili cha Biblia.
- source_word: לַעֲבֹד אֶת עֲבֹדָתָם
  choice: kufanya huduma yao
  rationale: Kirai hiki huwasilisha kazi yao ya ibada katika patakatifu kwa lugha ya kawaida, huku kikiepuka marudio yasiyo ya kawaida kama ‘kutumikia utumishi wao.’
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika Hema la Kukutania
  rationale: Huhifadhi maana ya mahali na jina la hema lililowekwa kwa ajili ya kukutana na Mungu.
- source_word: לִפְנֵי אַהֲרֹן וְלִפְנֵי בָנָיו
  choice: mbele ya Haruni na mbele ya wanawe
  rationale: Tafsiri ya karibu huhifadhi uwezekano wa maana ya kuwapo mbele yao au kufanya huduma chini ya usimamizi wao bila kuamua zaidi ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: עַל הַלְוִיִּם
  choice: kuhusu Walawi
  rationale: Hapa kihusishi kinaonyesha jambo lililohusu amri hiyo.
- source_word: כֵּן עָשׂוּ לָהֶם
  choice: ndivyo walivyowatendea
  rationale: Huhifadhi kiima cha wingi kisichotajwa upya na kiwakilishi kinachowaelekea Walawi, bila kufafanua matendo hayo zaidi ya chanzo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Mhusika wa mwisho katika כֵּן עָשׂוּ לָהֶם
  choice: ndivyo walivyowatendea
  alternative: ndivyo walivyowafanyia
  rationale: Kiebrania hakilitaji tena kundi linalofanya tendo, na kirai chake ni kifupi. Tafsiri inadumisha hali hiyo badala ya kutaja kwa uhakika Musa, Haruni, au kusanyiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo ‘mbele ya ... na mbele ya ...’ umehifadhiwa ili kutofuta msisitizo wa chanzo, na utata wa kirai cha mwisho umeelezwa katika tanbihi.
