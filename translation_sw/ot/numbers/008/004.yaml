- from: 'Hivi ndivyo kinara cha taa kilivyotengenezwa: kilikuwa kazi ya dhahabu iliyofuliwa kwa nyundo[a]. Kuanzia tako lake hadi ua lake, kilikuwa kazi iliyofuliwa kwa nyundo. Alikitengeneza kinara hicho kulingana na kielelezo ambacho Yahwe alikuwa amemwonyesha Musa[b].'
  to: 'Hivi ndivyo kinara cha taa kilivyotengenezwa: kilikuwa kazi ya dhahabu iliyopigwa kwa nyundo[a]. Kuanzia msingi wake hadi mapambo yake ya maua, kilikuwa kazi iliyopigwa kwa nyundo. Kulingana na kielelezo ambacho Yahwe alikuwa amemwonyesha Musa[b], ndivyo alivyokitengeneza kinara hicho.'
  rationale: Revised the metalworking term to the direct and readily understood “iliyopigwa kwa nyundo,” replaced the potentially misleading anatomical “tako” with “msingi,” and rendered the floral feature as “mapambo yake ya maua.” The closing syntax now makes the Hebrew according-to/so correlation explicit, without identifying the unstated maker. Footnote a retains the alternative wording and the interpretive ‘one piece’ possibility as a note rather than as main-text meaning.
