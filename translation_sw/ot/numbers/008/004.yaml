base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/004.yaml
  text: 'This was the workmanship of the lampstand: hammered work of gold[a], from its base to its flower it was hammered work. According to the pattern that Yahweh had shown Moses[b], so he made the lampstand.'
translation:
  language: sw
  text: 'Hivi ndivyo kinara cha taa kilivyotengenezwa: kilikuwa kazi ya dhahabu iliyopigwa kwa nyundo[a]. Kuanzia msingi wake hadi mapambo yake ya maua, kilikuwa kazi iliyopigwa kwa nyundo. Kulingana na kielelezo ambacho Yahwe alikuwa amemwonyesha Musa[b], ndivyo alivyokitengeneza kinara hicho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyofuliwa kwa nyundo.” Kiebrania kinakazia kwamba kinara kilifanyizwa kwa kuipiga dhahabu kwa nyundo. Wengine pia hulielewa neno hilo kuwa na maana ya “kitu kilichotengenezwa kwa kipande kimoja.”
    reason: lexical_alternative
  - marker: b
    text: “Kulingana na kielelezo” pia inaweza kutafsiriwa “kulingana na mwonekano” au “kulingana na maono” ambayo Yahwe alimwonyesha Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: jinsi ... kilivyotengenezwa / kazi
  rationale: Nomino hii inaeleza ufundi au namna ya kutengeneza kinara. Muundo wa Kiswahili ‘jinsi ... kilivyotengenezwa’ ni wa kawaida katika utangulizi, huku ‘kazi’ ikihifadhi msisitizo wa utengenezaji katika maelezo yanayofuata.
- source_word: הַמְּנֹרָה
  choice: kinara cha taa
  rationale: Tafsiri hii ya jina la kifaa ni wazi kwa msomaji wa kawaida na huepuka kulinakili tu kama jina la kigeni.
- source_word: מִקְשָׁה
  choice: iliyofuliwa kwa nyundo / kazi iliyofuliwa kwa nyundo
  rationale: Neno hilo linaonyesha kitu kilichotengenezwa kwa kuipiga metali kwa nyundo. Kurudia usemi huo kunahifadhi msisitizo wa Kiebrania; maana ya ‘kipande kimoja’ imeachwa katika tanbihi kwa kuwa ni fasiri ya ziada.
- source_word: זָהָב
  choice: dhahabu
  rationale: Ni jina la moja kwa moja la metali iliyotumiwa.
- source_word: עַד יְרֵכָהּ עַד פִּרְחָהּ
  choice: kuanzia tako lake hadi ua lake
  rationale: Usemi huu unaonyesha sehemu zote za kinara, kutoka sehemu yake ya chini hadi pambo lake la maua. ‘Tako’ linafaa hapa kuliko maana halisi ya kawaida ya יָרֵךְ, ‘paja.’
- source_word: כַּמַּרְאֶה
  choice: kulingana na kielelezo
  rationale: Katika muktadha wa kutengeneza vifaa vya maskani, neno hili linaelekea kumaanisha umbo au kielelezo alichoonyeshwa Musa. Uwezekano wa ‘mwonekano’ au ‘maono’ umehifadhiwa katika tanbihi.
- source_word: הֶרְאָה
  choice: alikuwa amemwonyesha
  rationale: Hifili ya ראה ina maana ya ‘kuonyesha’; wakati uliotangulia unaonyesha kwamba Musa alionyeshwa kielelezo kabla ya kutengenezwa kwa kinara.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha jina binafsi la Mungu badala ya kulibadilisha kuwa cheo.
- source_word: כֵּן עָשָׂה
  choice: alikitengeneza ... kulingana na
  rationale: Kitenzi kimetafsiriwa kwa kauli tendaji na mtendaji wa kiume ambaye hatajwi kwa jina, kama ilivyo katika Kiebrania. Mpangilio wa sentensi wa Kiswahili unaonyesha uhusiano wa ‘kama alivyoonyeshwa, ndivyo alivyotengeneza.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: ‘Yahwe’ huhifadhi jina binafsi la Mungu kwa namna inayokaribia ushahidi wa matamshi ya Kiebrania, bila kulibadilisha kuwa cheo.
- issue: Mtendaji asiyeelezwa wa עָשָׂה
  choice: Alikitengeneza
  alternative: Kilikuwa kimetengenezwa
  rationale: Kiebrania kina kitenzi cha umoja katika kauli tendaji lakini hakimtaji mtendaji. Kiswahili kinaweza kudumisha hali hiyo kwa kiambishi cha nafsi bila kuongeza jina la fundi; kauli tendwa ingeficha umbo tendaji la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. ‘Kinara cha taa,’ ‘tako,’ na ‘ua’ ni maneno halisi na ya kawaida yanayoeleza kifaa na mapambo yake bila lugha nzito ya kitaalamu.
