source:
  edition: WLC
  text: וְ/כֹֽה תַעֲשֶׂ֤ה לָ/הֶם֙ לְ/טַֽהֲרָ֔/ם הַזֵּ֥ה עֲלֵי/הֶ֖ם מֵ֣י חַטָּ֑את וְ/הֶעֱבִ֤ירוּ תַ֨עַר֙ עַל כָּל בְּשָׂרָ֔/ם וְ/כִבְּס֥וּ בִגְדֵי/הֶ֖ם וְ/הִטֶּהָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/007.yaml
  text: 'And thus you shall do to them to cleanse them: sprinkle on them the water for purification from sin[a], and let them pass a razor over all their flesh, and wash their clothes[b], and so cleanse themselves.'
translation:
  language: sw
  text: 'Na hivi ndivyo utakavyowafanyia ili kuwatakasa: uwanyunyizie maji ya utakaso[a], waache wapitishe wembe juu ya miili yao yote[b], wafue nguo zao, na wajitakase.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maji kwa ajili ya utakaso”; kwa neno kwa neno, “maji ya dhambi.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, wanyoe miili yao yote.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹה
  choice: Na hivi ndivyo
  rationale: Huunganisha agizo hili na muktadha uliotangulia na kutambulisha utaratibu unaopaswa kufuatwa kwa Kiswahili cha kawaida.
- source_word: תַעֲשֶׂה לָהֶם
  choice: utakavyowafanyia
  rationale: Huwakilisha agizo la nafsi ya pili na kiambishi cha walengwa kwa mtiririko wa kawaida wa Kiswahili.
- source_word: לְטַהֲרָם
  choice: ili kuwatakasa
  rationale: Kitenzi טהר hapa kinahusu utakaso wa kiibada; “kuwatakasa” kinaeleweka na hakipunguzi maana hiyo iwe usafi wa kawaida tu.
- source_word: הַזֵּה עֲלֵיהֶם
  choice: wanyunyizie
  rationale: Hutoa maana ya tendo la kunyunyiza kimila huku kiambishi -wa- kikibeba maana ya “juu yao.”
- source_word: מֵי חַטָּאת
  choice: maji ya utakaso
  rationale: Kirai hiki kwa neno kwa neno ni “maji ya dhambi,” lakini katika muktadha huu kinaelekeza kwenye maji yanayotumika kwa utakaso. Tafsiri hii haiamui bila msingi kwamba חטאת lazima imaanishe dhabihu ya dhambi; tanbihi huhifadhi utata wa kirai.
- source_word: וְהֶעֱבִירוּ תַעַר
  choice: wapitishe wembe
  rationale: Huhifadhi taswira halisi ya Kiebrania ya kupitisha wembe badala ya kuifupisha kuwa “wanyoe” pekee.
- source_word: עַל כָּל בְּשָׂרָם
  choice: juu ya mwili wao wote
  rationale: Ingawa בשר kimsingi ni “nyama,” katika muktadha wa kunyoa inarejelea uso wote wa mwili; “mwili wao wote” ni wazi na ya kawaida kwa Kiswahili.
- source_word: וְכִבְּסוּ בִגְדֵיהֶם
  choice: wafue nguo zao
  rationale: כבס hutumiwa hasa kwa kufua mavazi; “wafue nguo zao” ni Kiswahili cha kawaida na sahihi.
- source_word: וְהִטֶּהָרוּ
  choice: nao watajitakasa
  rationale: Umbo la kujirejelea la kitenzi limehifadhiwa kwa “watajitakasa”; wakati ujao baada ya maagizo unaeleza matokeo ya matendo hayo.
theological_decisions:
- issue: Asili ya lugha ya utakaso katika ibada ya kuwaweka Walawi wakfu
  choice: Kutumia lugha inayoonyesha utakaso wa kiibada bila kuufanya kuwa utakaso wa kimaadili pekee
  alternative: Kutafsiri חטאת moja kwa moja kuwa “dhabihu ya dhambi” au kufanya kirai kihusu kuondolewa kwa hatia ya kimaadili pekee
  rationale: Mstari unaeleza ibada halisi ya kuwatakasa Walawi. “Maji ya utakaso” huhifadhi kazi ya kiibada ya maji hayo bila kuingiza dhana ya dhabihu ambayo haikutajwa wazi katika kirai hiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa maagizo umewekwa wazi na wa kawaida, huku istilahi “utakaso” ikihifadhi uzito wa muktadha wa kiibada. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
