base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/010.yaml
  text: You shall bring the Levites before Yahweh[a], and the sons of Israel shall lay their hands on the Levites.
translation:
  language: sw
  text: Utawaleta Walawi mbele ya Yahweh, na wana wa Israeli[a] wataweka mikono yao juu ya Walawi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania kinasema “wana wa Israeli,” usemi wa kawaida unaowarejelea watu wa Israeli kwa pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Utawaleta
  rationale: Hifili ya קרב humaanisha kuleta karibu au kuwasilisha. “Utawaleta” ni ya kawaida katika Kiswahili na, pamoja na “mbele za Yahweh,” inadumisha mwelekeo wa tendo katika mazingira ya ibada.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la Walawi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: לִפְנֵי humaanisha “mbele ya” au “katika uwepo wa.” “Mbele za Yahweh” ni usemi wa asili na wenye heshima katika mazingira haya ya ibada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano limewakilishwa moja kwa moja kama Yahweh badala ya kubadilishwa kuwa cheo.
- source_word: וְסָמְכוּ
  choice: wataweka
  rationale: Katika muundo huu wa ibada, סמך pamoja na mikono na עַל hueleza kitendo cha kuweka mikono juu ya mtu. “Wataweka mikono yao” ni wazi na ya asili kwa Kiswahili cha sasa.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inadumisha umbo halisi la Kiebrania, “wana wa Israeli,” huku tanbihi ikifafanua kuwa ni usemi wa pamoja unaowarejelea Waisraeli.
- source_word: יְדֵיהֶם
  choice: mikono yao
  rationale: Nomino ya wingi yenye kiambishi cha umilikaji imetafsiriwa moja kwa moja.
- source_word: עַל הַלְוִיִּם
  choice: juu ya Walawi
  rationale: עַל katika kauli ya kuweka mikono hutafsiriwa kwa kawaida “juu ya.”
theological_decisions:
- issue: Uwasilishaji wa jina la agano יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Uwasilishaji wa בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli au watu wa Israeli
  rationale: Kiebrania kina usemi halisi “wana wa Israeli.” Umbo hilo limehifadhiwa katika matini, na maana yake ya pamoja imeelezwa katika tanbihi bila kuifanya aya isomeke kama inawahusu wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayofaa mazingira ya ibada. “Mbele za” limetumiwa kama tamko la kawaida la uwepo, na “kuweka mikono juu ya” hudumisha kitendo halisi bila kuongeza maana ya kiteolojia isiyotajwa.
