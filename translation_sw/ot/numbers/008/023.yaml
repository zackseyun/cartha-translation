lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akasema
  rationale: Wayyiqtol ya דבר inaendeleza mfululizo wa masimulizi. “Kisha ... akasema” ni Kiswahili cha kawaida kinachoonyesha tukio linalofuata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: אֶל
  choice: na
  rationale: Katika muundo wa Kiswahili “akasema na Musa,” “na” humtambulisha kwa kawaida mtu anayeambiwa maneno; tafsiri ya neno kwa neno “kwa” si ya kawaida hapa.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ndilo umbo la kawaida la jina משה katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Infinitivu ya אמר ni fomula ya kuanzisha maneno yanayofuata. “Akisema” huhifadhi muundo wa Kiebrania bila kuufanya kuwa mzito kupita kiasi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina יהוה lenyewe. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo; tanbihi inaeleza desturi nyingine ya kulitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Fomula “akasema ... akisema” imehifadhiwa kwa sababu mstari ni utangulizi wa usemi wa moja kwa moja katika mstari unaofuata.
