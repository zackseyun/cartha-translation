  text: וַ/יִּֽתְחַטְּא֣וּ הַ/לְוִיִּ֗ם וַֽ/יְכַבְּסוּ֙ בִּגְדֵי/הֶ֔ם וַ/יָּ֨נֶף אַהֲרֹ֥ן אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְכַפֵּ֧ר עֲלֵי/הֶ֛ם אַהֲרֹ֖ן לְ/טַהֲרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/021.yaml
  text: And the Levites purified themselves and washed their garments[a], and Aaron presented them as a wave offering before Yahweh, and Aaron made atonement for them to cleanse them.
translation:
  language: sw
  text: Walawi wakajitakasa na kufua mavazi yao. Kisha Haruni akawawasilisha mbele za Yahwe kama sadaka ya kutikiswa[a], naye Haruni akawafanyia upatanisho ili kuwatakasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawatikisa kama sadaka ya kutikiswa.” Kiebrania kinatumia usemi wa kawaida wa kiibada wa kuwasilisha kitu mbele za Yahwe kama תְּנוּפָה (sadaka ya kutikiswa).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַטְּאוּ
  choice: wakajitakasa
  rationale: Kitenzi cha Kiebrania katika kauli ya kujirejelea kinaeleza Walawi kupitia tendo la utakaso. “Wakajitakasa” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuongeza waziwazi “dhambi,” neno ambalo halitajwi moja kwa moja katika mstari huu.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la Walawi; umaalumu wa nomino unaeleweka katika matumizi haya.
- source_word: וַיְכַבְּסוּ בִּגְדֵיהֶם
  choice: na kufua mavazi yao
  rationale: “Kufua” ndiyo kauli ya asili ya Kiswahili kwa kuosha nguo, na “mavazi” inafaa kwa muktadha rasmi wa ibada.
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: akawasilisha ... kama sadaka ya kutikiswa
  rationale: Kauli hii inahifadhi wazo la tendo rasmi la kuwasilisha Walawi mbele za Mungu huku ikitumia istilahi ya kawaida ya ibada, “sadaka ya kutikiswa,” bila kudai kwamba Haruni aliwatingisha watu kimwili.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: “Mbele za” ni usemi wa kawaida na wenye heshima kwa uwepo wa Mungu, na jina la agano יְהוָה limetafsiriwa “Yahwe.”
- source_word: וַיְכַפֵּר עֲלֵיהֶם
  choice: akawafanyia upatanisho
  rationale: “Kufanyia upatanisho” huhifadhi maana ya kiibada ya כפר na inaeleweka katika Kiswahili cha kibiblia bila kuingiza ufafanuzi wa kimadhehebu.
- source_word: לְטַהֲרָם
  choice: ili kuwatakasa
  rationale: Kiunganishi “ili” kinaonyesha kusudi la tendo la Haruni, na “kuwatakasa” huhifadhi lugha ya usafi wa kiibada.
theological_decisions:
- issue: Kutofautisha lugha zinazohusiana za utakaso na upatanisho
  choice: “wakajitakasa,” “akawafanyia upatanisho,” na “ili kuwatakasa”
  alternative: “wakajisafisha,” “akawafanyia kafara,” na “ili kuwasafisha”
  rationale: 'Chaguo hili linadumisha hatua zinazotofautiana lakini zinazohusiana katika kuwekwa wakfu kwa Walawi: tendo lao la kujitakasa, tendo la Haruni la kuwafanyia upatanisho, na kusudi la kuwatakasa. Haliongezi “kutoka dhambini,” jambo ambalo halisemwi wazi katika mstari.'
- issue: Jinsi ya kueleza tendo la תְּנוּפָה wakati watu ndio watendewa
  choice: Haruni aliwasilisha Walawi kama sadaka ya kutikiswa
  alternative: Haruni aliwatikisa Walawi kama sadaka ya kutikiswa
  rationale: “Aliwasilisha” huepuka picha isiyokusudiwa ya kuwatikisa watu kimwili, huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi na muundo wa Kiebrania.
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa mara mbili ili kuepuka mfuatano mzito wa viunganishi. Istilahi za ibada “sadaka ya kutikiswa,” “upatanisho,” na “kutakasa” zimehifadhiwa kwa sababu ni muhimu kwa maana ya mstari.
