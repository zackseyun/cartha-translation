translation:
  language: sw
  text: Na kuanzia umri wa miaka hamsini, ataacha utumishi wa kazi hiyo, wala hatafanya kazi tena[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atarudi kutoka katika utumishi wa kazi hiyo.” Kitenzi cha Kiebrania kwa maana yake ya msingi humaanisha “kurudi” au “kugeuka,” lakini hapa kinatumika kwa maana ya kuacha utumishi wa kazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  choice: Lakini kuanzia umri wa miaka hamsini
  rationale: Nahau ya Kiebrania inaonyesha mwanzo wa kikomo cha umri. “Kuanzia umri wa miaka hamsini” ni Kiswahili cha kawaida na sahihi; kiunganishi “lakini” kinaonyesha tofauti na umri wa kuanza uliotajwa katika muktadha.
- source_word: יָשׁוּב
  choice: ataacha
  rationale: Kitenzi שוב kwa msingi humaanisha “kurudi/kugeuka,” lakini hapa, pamoja na מן (“kutoka”), kinamaanisha kujiondoa au kuacha wajibu wa utumishi. “Ataacha” kinaeleza maana hiyo kwa uwazi bila kudokeza safari ya kurudi mahali.
- source_word: מִצְּבָא
  choice: utumishi
  rationale: צָבָא hapa si jeshi la vita bali utumishi au wajibu rasmi wa Walawi. “Utumishi” linafaa kwa mazingira haya ya kazi waliyopewa.
- source_word: הָעֲבֹדָה
  choice: wa kazi hiyo
  rationale: עֲבֹדָה humaanisha kazi au utumishi. Kutumia “kazi” baada ya “utumishi” kunahifadhi kwa kiasi muundo wa maneno mawili tofauti wa Kiebrania bila kufanya Kiswahili kiwe kizito kupita kiasi.
- source_word: וְלֹא יַעֲבֹד עוֹד
  choice: wala hatatumika tena
  rationale: עבד hapa ni kufanya utumishi uliowekwa. “Wala hatatumika tena” ni lugha ya kawaida inayosisitiza kukoma kwa utumishi hai, huku muktadha unaofuata ukiruhusu aina nyingine ya kuwasaidia wenzake.
