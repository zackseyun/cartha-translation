base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/003.yaml
  text: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
translation:
  language: sw
  text: 'Aroni akafanya hivyo: akaweka[b] taa za kinara hicho zielekee upande wa mbele wa kinara cha taa[a], kama vile Yahweh alivyomwamuru Musa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zikabiliane na sehemu ya mbele ya” au “zitazame sehemu ya mbele ya” kinara cha taa.
    reason: lexical_alternative
  - marker: b
    text: Au, “akawasha.” Kitenzi cha Kiebrania maana yake ya msingi ni kusababisha kitu kupanda au kuinuka; kinapotumiwa kuhusu taa, kinaweza kumaanisha kuziweka au kuziwasha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כֵּן
  choice: Aroni akafanya hivyo
  rationale: Nahau hii inaonyesha kwamba Aroni alitekeleza maagizo yaliyotangulia; usemi huu ni wa kawaida na huhifadhi maana ya כֵּן.
- source_word: אֶל מוּל פְּנֵי
  choice: zielekee upande wa mbele wa
  rationale: Kirai hiki kinaonyesha mwelekeo kuelekea uso au sehemu ya mbele ya kinara bila kufafanua kupita kiasi mpangilio wake wa nafasi.
- source_word: הַמְּנוֹרָה
  choice: kinara cha taa
  rationale: Hili ni neno la kawaida na linaloeleweka kwa kifaa chenye taa kadhaa katika maskani, badala ya kunukuu tu neno la Kiebrania.
- source_word: הֶעֱלָה
  choice: akaweka
  rationale: Hifili ya עלה hapa inaweza kumaanisha kuzifanya taa zipande au ziwekwe, na katika muktadha pia inaweza kueleweka kuwa kuziwasha. ‘Akaweka’ hufuata msisitizo wa muktadha juu ya mpangilio na mwelekeo wa taa, huku tanbihi ikihifadhi uwezekano wa ‘akawasha.’
- source_word: נֵרֹתֶיהָ
  choice: taa za kinara hicho
  rationale: Ufafanuzi huu unaonyesha wazi kwamba kiambishi cha umilikaji kinarejelea kinara, na huepuka ‘taa zake’ kueleweka kimakosa kuwa taa za Aroni.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: kama vile Yahwe alivyomwamuru Musa
  rationale: Kirai hiki kinaonyesha kwamba Aroni alifuata kikamilifu amri ambayo Yahwe alikuwa amempa Musa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa na cheo, hivyo kuhifadhi matumizi ya moja kwa moja ya Tetragramatoni katika maandishi ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo; ‘Yehova’ ni umbo jingine la mapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo umefanywa kuwa wa asili kwa Kiswahili, huku utata wa kitenzi הֶעֱלָה na wa mwelekeo אֶל מוּל פְּנֵי ukihifadhiwa katika tanbihi.
