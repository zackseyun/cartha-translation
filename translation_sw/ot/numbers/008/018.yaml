  text: And I took the Levites in place of every firstborn among the sons of Israel[a].
translation:
  language: sw
  text: Nami nikawachukua Walawi badala ya kila mzaliwa wa kwanza miongoni mwa wana wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa Waisraeli.” Kiebrania kinasema, “miongoni mwa wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Nami nikawachukua
  rationale: Qal wayyiqtol nafsi ya kwanza umoja ya לקח ina maana ya kawaida ya kisimulizi, ‘nami nikachukua.’ Kiambishi -wa- kinarejelea Walawi, na ‘chukua’ huhifadhi maana halisi bila kuongeza wazo la kukubali au kuteua.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Nomino ya wingi yenye uainisho inawataja Walawi mahsusi; ‘Walawi’ ndilo jina la kawaida na sahihi katika Kiswahili.
- source_word: תַּחַת
  choice: badala ya
  rationale: Katika muktadha huu neno linaonyesha ubadilishaji au uwakilishi, si mahali pa kuwa chini ya kitu.
- source_word: כָּל בְּכוֹר
  choice: kila mzaliwa wa kwanza
  rationale: כָּל pamoja na nomino ya umoja ina maana ya kugawa kwa kila mmoja; Kiebrania hakiongezi wazi neno ‘mwanamume,’ hivyo halijaongezwa katika matini.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: miongoni mwa wana wa Israeli
  rationale: Huhifadhi kwa usahihi usemi halisi wa Kiebrania, ‘wana wa Israeli,’ huku ‘miongoni mwa’ ikitoa maana ya kihusiano ya kiambishi ב kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Kiebrania kina usemi wa wazi wa kiume katika wingi, ‘wana wa Israeli.’ Matini kuu inahifadhi umbo hilo bila kuligeuza kimya kuwa jina jumuishi, ingawa katika matumizi usemi huo unaweza kulirejelea taifa la agano kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kisimulizi ‘Nami nikawachukua’ ni wa kawaida katika sajili ya Biblia na unaonyesha mwendelezo wa kauli ya Mungu. Alama ya tanbihi [a] imewekwa baada ya sentensi.
