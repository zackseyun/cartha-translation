  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֣י לִ֤/י כָל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה בְּ/י֗וֹם הַכֹּתִ֤/י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם הִקְדַּ֥שְׁתִּי אֹתָ֖/ם לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/017.yaml
  text: For every firstborn among the sons of Israel[a], among man and among beast, is mine. On the day I struck every firstborn in the land of Egypt[b], I consecrated them to myself.
translation:
  language: sw
  text: Kwa maana kila mzaliwa wa kwanza wa Waisraeli, awe wa binadamu au wa wanyama, ni wangu. Siku nilipowapiga wazaliwa wote wa kwanza katika nchi ya Misri, niliwaweka wakfu kwa ajili yangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu ya kauli iliyotangulia na ni kiunganishi cha kawaida chenye hadhi katika Kiswahili.
- source_word: לִי
  choice: ni wangu
  rationale: Kirai hiki kinaonyesha umiliki; Kiswahili cha kawaida huhitaji kiarifu cha umiliki.
- source_word: כָל בְּכוֹר
  choice: kila mzaliwa wa kwanza
  rationale: Inahifadhi umoja wa kijumla wa Kiebrania bila kuongeza neno ‘mwanaume,’ ambalo halipo wazi katika mstari huu.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: miongoni mwa Waisraeli
  rationale: Ni tafsiri ya asili na wazi ya kundi la agano linaloitwa ‘wana wa Israeli,’ bila kupotosha maana.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: wa binadamu na wa wanyama
  rationale: Inahifadhi utofautishaji wa kijumla kati ya wanadamu na wanyama na kuunganisha kwa kawaida aina mbili za wazaliwa wa kwanza katika Kiswahili.
- source_word: בְּיוֹם
  choice: Siku ile
  rationale: Inaonyesha tukio maalumu la kihistoria kwa lugha ya kawaida na yenye hadhi.
- source_word: הַכֹּתִי
  choice: nilipompiga
  rationale: Kitenzi נכה kimetafsiriwa moja kwa moja kuwa ‘kupiga’; muktadha unaonyesha hukumu ya mauti bila kulazimisha maana hiyo ndani ya kitenzi chenyewe.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Inahifadhi kirai kamili cha Kiebrania, pamoja na neno ‘nchi.’
- source_word: הִקְדַּשְׁתִּי אֹתָם לִי
  choice: niliwaweka wakfu kwa ajili yangu
  rationale: ‘Kuweka wakfu’ huhifadhi maana ya kuwatenga kuwa watakatifu na kwa mali ya Mungu, kwa Kiswahili kinachoeleweka bila istilahi nzito isiyo ya lazima.
theological_decisions:
- issue: Maana ya אָדָם katika utofautishaji wa wanadamu na wanyama
  choice: binadamu
  alternative: mwanadamu
  rationale: Hapa neno hilo ni jina la kijumla la jamii ya wanadamu, si rejeo maalumu kwa mwanamume mmoja; ‘binadamu’ linaonyesha maana hiyo kwa uwazi.
- issue: Nguvu ya kidini ya הִקְדַּשְׁתִּי
  choice: niliwaweka wakfu kwa ajili yangu
  alternative: niliwatenga kwa ajili yangu
  rationale: ‘Kuweka wakfu’ huhifadhi wazo la utakatifu na dai maalumu la Mungu juu ya wazaliwa wa kwanza, ilhali ‘kutenga’ pekee lingeweza kudhoofisha maana hiyo ya kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umesawazishwa kwa ufasaha wa Kiswahili huku ukihifadhi sababu ya mstari, dai la Mungu juu ya wazaliwa wa kwanza, utofautishaji wa binadamu na wanyama, na maana ya kuwaweka wakfu.
