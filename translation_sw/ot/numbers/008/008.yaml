  text: וְ/לָֽקְחוּ֙ פַּ֣ר בֶּן בָּקָ֔ר וּ/מִנְחָת֔/וֹ סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן וּ/פַר שֵׁנִ֥י בֶן בָּקָ֖ר תִּקַּ֥ח לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/008.yaml
  text: Then they shall take one young bull and its grain offering of fine flour mixed with oil[a], and you shall take a second young bull for a sin offering.
translation:
  language: sw
  text: Kisha watachukua fahali mmoja mchanga, pamoja na sadaka yake ya nafaka ya unga laini uliochanganywa na mafuta; nawe utamchukua fahali wa pili mchanga kwa ajili ya sadaka ya dhambi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha sadaka ya dhambi au ya utakaso katika taratibu za ibada za kikuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Kisha watachukua
  rationale: Kitenzi cha wingi katika mfululizo wa maagizo kina maana ya jambo litakalofuata; “Kisha” huonyesha mwendelezo wa waw kwa Kiswahili cha kawaida.
- source_word: פַּר בֶּן בָּקָר
  choice: fahali mmoja mchanga
  rationale: Nahau hiyo ya Kiebrania humaanisha fahali mchanga; “mmoja” huwekwa wazi ili kutofautisha mnyama huyu na fahali wa pili.
- source_word: וּמִנְחָתוֹ
  choice: pamoja na sadaka yake ya nafaka
  rationale: Katika muktadha wa ibada, מִנְחָה ni sadaka ya nafaka; kiambishi cha nafsi ya tatu hurejelea sadaka inayoandamana na fahali wa kwanza.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Ni istilahi ya ibada inayomaanisha unga uliosagwa vizuri kwa matumizi ya sadaka.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Huwasilisha kwa lugha ya sasa namna ya kawaida ya kuandaa sadaka hiyo bila kupoteza maana ya kiibada.
- source_word: וּפַר שֵׁנִי בֶן בָּקָר תִּקַּח
  choice: nawe utamchukua fahali wa pili mchanga
  rationale: Kiebrania hubadilika kutoka nafsi ya tatu wingi kwenda nafsi ya pili umoja; “nawe” huhifadhi badiliko hilo na “wa pili” huakisi שֵׁנִי.
- source_word: לְחַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Katika sheria za dhabihu, חַטָּאת ni jina la sadaka inayohusiana na dhambi na utakaso; tafsiri ya kawaida imewekwa katika matini, huku maana ya kiibada ya utakaso ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya חַטָּאת katika sheria za dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: “Sadaka ya dhambi” ni tafsiri iliyozoeleka na inaendeleza uhusiano wa neno hilo na dhambi, lakini dhabihu hiyo pia ina kazi ya utakaso katika ibada za kikuhani. Tanbihi huhifadhi uwezekano huo bila kuamua kimya-kimya kwamba maana moja pekee ndiyo inayokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mtindo huhifadhi mfuatano wa agizo na badiliko la nafsi kutoka “watachukua” kwenda “utamchukua.” “Fahali mchanga” ni ya kawaida kuliko tafsiri sisisi ya nahau ya Kiebrania; “sadaka ya nafaka” na “unga laini” ni wazi katika muktadha wa ibada.
