base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/020.yaml
  text: So Moses and Aaron and all the congregation of the sons of Israel did to the Levites according to all that Yahweh had commanded Moses concerning the Levites[a]; so the sons of Israel did to them.
translation:
  language: sw
  text: Basi Musa, Aroni, na kusanyiko lote la wana wa Israeli wakawatendea Walawi kulingana na yote ambayo Yahweh alikuwa amemwamuru Musa kuhusu Walawi[a]. Ndivyo wana wa Israeli walivyowatendea Walawi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania kinasema “wana wa Israeli,” usemi wa kawaida unaoitaja jumuiya ya agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  choice: wakawatendea / walivyowatendea
  rationale: Kitenzi עשה ni kipana, ‘kufanya/kutenda.’ Hapa kinaeleza mambo yaliyofanywa kwa Walawi; ‘kuwatendea’ huhifadhi maana hiyo bila kubainisha kupita kiasi matendo ya kiibada.
- source_word: עֲדַת
  choice: kusanyiko
  rationale: עֵדָה humaanisha jumuiya ya agano iliyokusanyika. ‘Kusanyiko’ ni neno la kawaida, lenye hadhi, linalohifadhi maana ya kundi rasmi lililokusanyika.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi halisi wa kifamilia wa Kiebrania na utambulisho wake wa jumuiya ya agano; ‘Waisraeli’ ni mbadala wa Kiswahili wenye mtiririko zaidi.
- source_word: לַלְוִיִּם / לָהֶם
  choice: Walawi / kuwa-
  rationale: Kiambishi ל kinawaonyesha Walawi kuwa walengwa wa matendo. Muundo wa Kiswahili ‘kuwatendea Walawi’ huwasilisha uhusiano huo kwa kawaida bila kuufanya kuwa faida tu.
- source_word: כְּכֹל אֲשֶׁר
  choice: kulingana na yote ambayo
  rationale: Usemi huu unaonyesha ulinganifu kamili na amri ya Mungu na kuhifadhi nguvu jumuishi ya כֹל.
- source_word: צִוָּה
  choice: alikuwa amemwamuru
  rationale: Kauli ya wakati uliopita timilifu huonyesha kwa kawaida kwamba amri ilitangulia utekelezaji unaosimuliwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa unukuzi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: אֶת מֹשֶׁה לַלְוִיִּם
  choice: amemwamuru Musa kuhusu Walawi
  rationale: Muundo unaonyesha kwamba amri aliyopewa Musa iliwahusu Walawi; ‘kuhusu’ ni sahihi na ya kawaida katika Kiswahili.
- source_word: כֵּן
  choice: Ndivyo
  rationale: כֵּן inarejelea na kusisitiza kwamba wana wa Israeli walitenda sawasawa na walivyoamriwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יְהוָה. ‘Yahweh’ huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Usemi wa kijumuiya wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Tafsiri kuu huhifadhi taswira ya kifamilia na umbo la kiume la Kiebrania bila kulifanya kuwa usemi usio na jinsia; tanbihi inatoa mbadala wa kawaida wa Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘Walawi’ na ‘wana wa Israeli’ yamehifadhiwa kwa sababu yanaakisi msisitizo na muundo wa Kiebrania.
