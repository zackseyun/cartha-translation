  yaml_path: translation/ot/numbers/008/013.yaml
  text: And you shall set the Levites before Aaron and before his sons[a], and you shall present them as a wave offering to Yahweh.
translation:
  language: sw
  text: Nawe utawaweka Walawi mbele ya Aroni na mbele ya wanawe, nawe utawawasilisha kama sadaka ya kutikiswa kwa Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana halisi zaidi, “utawatikisa kuwa sadaka ya kutikiswa kwa Yahwe.” Kiebrania kinatumia kitenzi cha tendo la kiibada la kutikisa au kuwasilisha pamoja na nomino “sadaka ya kutikiswa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: utawaweka
  rationale: Hifili ya עמד ina maana ya kuwafanya wasimame au kuwaweka mahali fulani; “utawaweka” ni ya kawaida na inafaa katika muktadha huu wa ibada.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la kabila la Lawi; hali ya uainisho inaeleweka kwa jina hili katika muktadha.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Inaonyesha mahali au kuwasilishwa rasmi mbele ya mtu, na “mbele ya” ni usemi wa kawaida wa Kiswahili.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Umbo la jina linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: בָנָיו
  choice: wanawe
  rationale: Hurejelea wana wa kiume wa Aroni, ambao ni makuhani; “wanawe” huhifadhi maana hiyo kwa ufupi na kwa kawaida.
- source_word: וְהֵנַפְתָּ
  choice: kisha utawasilisha
  rationale: Hifili ya נוף katika ibada hueleza tendo rasmi la kutikisa au kuwasilisha sadaka. “Utawasilisha” huepuka picha isiyo ya kawaida ya kuwatikisa watu, huku nomino inayofuata ikihifadhi istilahi ya ibada.
- source_word: אֹתָם
  choice: wa-
  rationale: Kiambishi cha yambwa katika “utawasilisha” kinawarejelea Walawi moja kwa moja.
- source_word: תְּנוּפָה
  choice: kama sadaka ya kutikiswa
  rationale: Ni istilahi maalumu ya ibada. “Sadaka ya kutikiswa” ni tafsiri inayoeleweka katika Kiswahili na huhifadhi aina ya sadaka inayotajwa.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Herufi za jina la Mungu יהוה zimetafsiriwa “Yahwe,” na ל inaonyesha anayepokea au anayelengwa na uwasilishaji huo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano יהוה moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Jinsi ya kueleza tendo la kiibada lililowahusu Walawi
  choice: utawasilisha kwa Yahwe kama sadaka ya kutikiswa
  alternative: utawatikisa kama sadaka ya kutikiswa; utawatoa kama sadaka ya kuwasilishwa
  rationale: Kiebrania kinatumia pamoja kitenzi נוף na nomino תְּנוּפָה. Tafsiri hii inaonyesha uwasilishaji rasmi na kuhifadhi aina ya sadaka bila kudai kwa uhakika kwamba Walawi wenyewe walitikiswa kimwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Kisha” linaonyesha hatua inayofuata katika utaratibu bila kuongeza tofauti ya kitheolojia; istilahi ya jadi “sadaka ya kutikiswa” imehifadhiwa na ufafanuzi umetolewa katika tanbihi.
