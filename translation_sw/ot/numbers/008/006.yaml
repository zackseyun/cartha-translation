translation:
  language: sw
  text: Chukua Walawi kutoka miongoni mwa wana wa Israeli[a], na uwatakase.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli” au “watu wa Israeli.” Kiebrania kihalisi ni “wana wa Israeli.”
