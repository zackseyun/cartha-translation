lexical_decisions:
- source_word: קַח
  choice: Wachukue
  rationale: Ni amri ya nafsi ya pili umoja kutoka לקח, ikimwagiza Musa awachukue Walawi kutoka katika kundi kubwa zaidi. “Wachukue” ni ya kawaida na hudumisha maana ya msingi bila kuongeza wazi wazo la kuwateua.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Ni jina la kawaida la Kiswahili kwa kundi la kabila la Lawi lililotengwa kwa huduma ya maskani.
- source_word: מִתּוֹךְ
  choice: kutoka miongoni mwa
  rationale: Kirai hiki huonyesha kuwatenga watu fulani kutoka ndani ya kundi kubwa zaidi na ni cha asili katika Kiswahili sanifu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi taswira ya kifamilia ya Kiebrania, “wana wa Israeli,” ambayo pia hutumika kwa taifa la agano kwa ujumla. Tanbihi inatoa namna nyingine za kawaida za Kiswahili.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: nawe uwatakase
  rationale: Katika muktadha huu טהר hurejelea utakaso wa kiibada. “Uwatakase” huwasilisha maana hiyo kwa lugha wazi na yenye heshima; “nawe” huunganisha amri ya pili na ya kwanza.
theological_decisions:
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Tafsiri hii huhifadhi usemi halisi wa kifamilia na maana yake ya kiagano bila kudai kwamba kifungu hicho kinawahusu wanaume pekee. Tanbihi inaonyesha tafsiri mbadala zinazowasilisha maana ya taifa kwa ujumla.
- issue: Maana ya utakaso katika וְטִהַרְתָּ אֹתָם
  choice: uwatakase
  alternative: uwasafishe
  rationale: Muktadha unaonyesha utakaso wa kiibada, si usafi wa mwili tu. “Uwatakase” hudumisha maana hiyo bila kuingiza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi kama Kiebrania; “wana wa Israeli” huhifadhi taswira ya asili, huku tanbihi ikisaidia usomaji wa kawaida.
