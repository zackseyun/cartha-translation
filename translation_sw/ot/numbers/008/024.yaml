  yaml_path: translation/ot/numbers/008/024.yaml
  text: 'This is what pertains to the Levites: from twenty-five years old and upward[a], he shall come to do duty in the service of the tent of meeting.'
translation:
  language: sw
  text: 'Hili ndilo linalowahusu Walawi: kuanzia umri wa miaka ishirini na mitano na kuendelea, kila mmoja wao ataingia kutekeleza wajibu[a] katika utumishi wa hema la kukutania.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kufanya huduma.” Nahau ya Kiebrania לִצְבֹא צָבָא ina maana ya kutekeleza huduma au wajibu uliopangwa, ikiwa na kivuli cha lugha ya kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת אֲשֶׁר לַלְוִיִּם
  choice: Hili ndilo linalowahusu Walawi
  rationale: Kifungu hiki kinaanzisha kanuni inayowahusu Walawi; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha maana ya kisheria ya matini.
- source_word: מִבֶּן חָמֵשׁ וְעֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: Kuanzia umri wa miaka ishirini na mitano na kuendelea
  rationale: Hii inaonyesha kwa kawaida na kwa usahihi umri wa chini unaotakiwa.
- source_word: יָבוֹא
  choice: ataingia
  rationale: Kitenzi kinaweza kumaanisha kuja au kuingia; hapa kinaonyesha kuanza kushiriki rasmi katika wajibu wa utumishi.
- source_word: לִצְבֹא צָבָא
  choice: kutekeleza wajibu
  rationale: Nahau hii ina maana ya kujiunga ili kufanya huduma au wajibu uliopangwa, ikiwa na kivuli cha lugha ya kijeshi; 'kutekeleza wajibu' ni ya asili katika Kiswahili na inahifadhi uzito huo.
- source_word: בַּעֲבֹדַת
  choice: katika utumishi wa
  rationale: Neno hili linamaanisha kazi au huduma rasmi iliyopewa; 'utumishi' linafaa katika muktadha wa hema takatifu.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni jina linaloeleweka na lililozoeleka kwa hema ambalo Mungu alikutana humo na watu wake.
theological_decisions:
- issue: Kitenzi cha umoja pamoja na kundi la Walawi
  choice: kila mmoja wao ataingia
  alternative: wataingia
  rationale: Kiebrania kinatumia kitenzi cha umoja katika maagizo yanayowahusu Walawi kwa pamoja. 'Kila mmoja wao' hudumisha maana ya mtu mmoja mmoja bila kupoteza rejeo la kundi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa maagizo na maana ya umoja wa jumla zimehifadhiwa kwa njia ya asili.
