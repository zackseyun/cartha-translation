translation:
  language: sw
  text: 'Sema na Haruni, umwambie hivi: ‘Unapoweka taa mahali pake[a], taa hizo saba zitaangaza kuelekea upande wa mbele wa kinara cha taa.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unapowasha taa.” Kitenzi cha Kiebrania maana yake halisi ni “kupandisha”; katika muktadha huu kinaweza kumaanisha kuwasha taa au kuziweka mahali pake ili ziangaze kuelekea mbele.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל אַהֲרֹן וְאָמַרְתָּ אֵלָיו
  choice: Mwambie Haruni hivi
  rationale: Hii ni njia ya kawaida na yenye heshima ya Kiswahili ya kuwasilisha kauli mbili za Kiebrania zinazotanguliza maagizo ya moja kwa moja, bila kutumia urudiaji usio wa kawaida wa ‘sema ... umwambie’.
- source_word: בְּהַעֲלֹתְךָ
  choice: Unapoweka taa mahali pake
  rationale: Kauli hii hudokeza kuinua, kuweka, au kupanga taa bila kuamua kimya kimya kwamba tendo linalokusudiwa ni kuwasha tu. Maana mbadala ya kuwasha imehifadhiwa katika tanbihi.
- source_word: הַנֵּרֹת
  choice: taa
  rationale: Neno נֵר humaanisha taa halisi katika muktadha wa vifaa vya hema takatifu, si nuru isiyo kitu.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: kuelekea upande wa mbele wa kinara cha taa
  rationale: Tafsiri hii inahifadhi mwelekeo unaoonyeshwa na kifungu cha Kiebrania na ni wazi kuliko ‘mbele ya kinara,’ ambacho kingeweza kueleweka kuwa mahali tu.
- source_word: יָאִירוּ
  choice: zitaangaza
  rationale: Kitenzi hiki kinaonyesha kwamba taa zitatoa nuru; ‘zitaangaza’ ni Kiswahili cha kawaida kinachowasilisha matokeo hayo.
- source_word: שִׁבְעַת הַנֵּרוֹת
  choice: taa hizo saba
  rationale: Huhifadhi idadi kamili na kurejelea taa zilizotajwa tayari.
- source_word: הַמְּנוֹרָה
  choice: kinara cha taa
  rationale: Tafsiri ya maana ni wazi kwa msomaji wa kawaida kuliko kunukuu neno la kigeni ‘menora’.
