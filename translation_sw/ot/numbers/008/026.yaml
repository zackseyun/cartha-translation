base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/026.yaml
  text: But he may minister with his brothers in the tent of meeting[a], to keep the charge, but he shall do no service[b]. Thus you shall do for the Levites in their duties.
translation:
  language: sw
  text: Lakini anaweza kuhudumu pamoja na ndugu zake katika Hema la Kukutania, ili kutimiza wajibu aliopewa[a], lakini hatashiriki katika kazi ya huduma[b]. Hivyo ndivyo utakavyofanya kwa Walawi katika majukumu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili kushika wajibu aliopewa.” Usemi wa Kiebrania לִשְׁמֹר מִשְׁמֶרֶת unamaanisha kutimiza jukumu au wajibu uliokabidhiwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “lakini hatafanya kazi.” Kiebrania kinatofautisha huduma ambayo bado anaruhusiwa kufanya na kazi ya kawaida ya Walawi ambayo sasa ameondolewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: Lakini anaweza kuhudumu
  rationale: Kitenzi שׁרת huonyesha huduma, hasa katika mazingira matakatifu. “Lakini” huonyesha tofauti na agizo la mstari uliotangulia la kuacha kazi ya kawaida, na “anaweza” huonyesha kwamba bado anaruhusiwa kushiriki kwa namna fulani.
- source_word: אֶת־אֶחָיו
  choice: pamoja na ndugu zake
  rationale: Katika muktadha huu, usemi huo unaonyesha kushiriki au kusaidia akiwa pamoja na Walawi wenzake. “Ndugu zake” huhifadhi lugha ya undugu ya Kiebrania.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika hema la kukutania
  rationale: Hili ni neno la kawaida na linaloeleweka kwa אֹהֶל מוֹעֵד, yaani hema ambako Mungu hukutana na watu wake.
- source_word: לִשְׁמֹר מִשְׁמֶרֶת
  choice: ili kutekeleza wajibu
  rationale: Muundo wa kitenzi na nomino zenye mzizi mmoja unamaanisha kutimiza jukumu au dhamana aliyopewa. “Kutekeleza wajibu” ni Kiswahili cha sasa na haubani maana kuwa ulinzi wa usalama pekee.
- source_word: וַעֲבֹדָה לֹא יַעֲבֹד
  choice: lakini asifanye kazi ya huduma
  rationale: Kiebrania kinarudia mzizi עבד kwa msisitizo. Tafsiri hii hutofautisha huduma ambayo bado anaruhusiwa kufanya na kazi rasmi ambayo hafai tena kuifanya.
- source_word: כָּכָה תַּעֲשֶׂה
  choice: Hivyo ndivyo utakavyofanya
  rationale: Ni fomula ya moja kwa moja inayohitimisha agizo, na kitenzi kinamwelekea mtu mmoja kama ilivyo katika Kiebrania.
- source_word: לַלְוִיִּם בְּמִשְׁמְרֹתָם
  choice: kwa Walawi katika majukumu yao
  rationale: Hii inaeleza kwamba kanuni hiyo itumike kwa Walawi kuhusiana na majukumu waliyopewa.
theological_decisions:
- issue: Kutofautisha ushiriki unaoruhusiwa baada ya umri wa kuacha kazi na kazi inayokatazwa
  choice: Mlawii mwenye umri huo bado anaweza kuhudumu pamoja na wenzake katika kutekeleza wajibu, lakini hafanyi tena kazi ya huduma ya kawaida.
  alternative: Mlawii huyo anakatazwa kabisa kushiriki katika huduma yoyote, au anaruhusiwa kufanya ulinzi wa usalama pekee.
  rationale: Tofauti kati ya שׁרת na עֲבֹדָה…עבד inaonyesha aina mbili za ushiriki badala ya marufuku kamili. Tafsiri hutumia “kuhudumu” na “kazi ya huduma” ili kuhifadhi tofauti hiyo bila kufafanua zaidi ya andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Hema la kukutania” limetumiwa kama istilahi ya kibiblia iliyozoeleka. Tofauti kati ya “kuhudumu” na “kufanya kazi ya huduma” huhifadhi mvutano wa Kiebrania bila kuifanya kazi hiyo kuwa ulinzi pekee au kazi nzito pekee.
