base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/017.yaml
  text: So now[a], kill every male among the little ones, and kill every woman who has known a man by lying with him.
translation:
  language: sw
  text: Basi sasa, waueni watoto wote wa kiume, na muueni kila mwanamke ambaye amemjua mwanamume kwa kulala naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ambaye amemjua mwanamume kwa kulala na mwanamume”; hii ni nahau ya Kiebrania inayomaanisha mahusiano ya kingono.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Inaonyesha mpito unaoelekeza kwenye amri ya mara moja; “Basi sasa” ni ya asili katika Kiswahili na huhifadhi nguvu ya וְ pamoja na עַתָּה.
- source_word: הִרְגוּ / הֲרֹגוּ
  choice: waueni / muueni
  rationale: 'Vitenzi hivi ni amri za moja kwa moja kutoka mzizi הרג, ‘kuua.’ Kiswahili kinahitaji upatanisho wa kiambishi cha yambwa: “waueni” kwa watoto wengi na “muueni” kwa kila mwanamke.'
- source_word: כָל זָכָר בַּטָּף
  choice: watoto wote wa kiume
  rationale: זָכָר ni ‘wa kiume,’ huku טַף ikimaanisha watoto wadogo au wategemezi. Katika muktadha huu, “watoto wote wa kiume” ni wazi na ya kawaida bila kuifanya זָכָר imaanishe hasa ‘mvulana’ peke yake.
- source_word: אִשָּׁה
  choice: mwanamke
  rationale: Neno hili hapa linamtaja mwanamke kwa ujumla, si lazima mke.
- source_word: יֹדַעַת אִישׁ
  choice: ambaye amemjua mwanamume
  rationale: Huhifadhi nahau ya Kiebrania ya ‘kumjua’ mtu ikiwa na maana ya mahusiano ya kingono, huku kirai kinachofuata kikifafanua maana hiyo.
- source_word: לְמִשְׁכַּב זָכָר
  choice: kwa kulala naye
  rationale: Ni Kiswahili cha kawaida kinachoonyesha mahusiano ya kingono na mwanamume aliyetajwa, bila kurudia kwa namna nzito ‘mwanamume’ wala kuongeza maelezo yasiyomo katika chanzo.
theological_decisions:
- issue: Kutafsiri amri ngumu kimaadili ya wakati wa vita bila kuipunguza makali au kuiongezea ufafanuzi
  choice: Kutoa amri hiyo moja kwa moja kwa kitenzi “kuua”
  alternative: Kutumia tamathali kama “kuwaondoa” au kuingiza maelezo ya kihistoria ndani ya mstari
  rationale: Kiebrania kinatoa amri kali na ya moja kwa moja. Tafsiri haipaswi kuficha ukali wake wala kuingiza tathmini ya kimaadili au maelezo ya kimadhehebu yasiyomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Basi sasa” na “kwa kulala naye” ni vya kawaida na vinaeleweka, huku amri “waueni/muueni” ikihifadhi ukali wa chanzo bila kutumia lugha ya kizamani au ya kupunguza maana.
