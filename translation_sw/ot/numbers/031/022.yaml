  yaml_path: translation/ot/numbers/031/022.yaml
  text: Only the gold[a], the silver, the bronze, the iron, the tin, and the lead—
translation:
  language: sw
  text: Isipokuwa dhahabu, fedha, shaba[a], chuma, bati na risasi—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shaba ya bati.” Neno la Kiebrania linaweza kumaanisha shaba au, kwa upana, metali ya aloi inayotokana na shaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini ... tu
  rationale: Katika muktadha huu neno hili linaweka mpaka au hali ya pekee dhidi ya maagizo yaliyotangulia. Muundo wa Kiswahili “lakini ... tu” unaonyesha kwa kawaida kwamba orodha inayofuata ndiyo inayotengwa.
- source_word: הַזָּהָב
  choice: dhahabu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa metali ya dhahabu; viambishi vya Kiebrania havihitaji kuwakilishwa kwa kila nomino katika orodha hii.
- source_word: הַכָּסֶף
  choice: fedha
  rationale: Hapa maana ni metali ya fedha, si pesa, kwa kuwa neno limo katika orodha ya metali zinazotakaswa.
- source_word: הַנְּחֹשֶׁת
  choice: shaba
  rationale: Neno la Kiebrania linaweza kutaja shaba tupu au metali ya shaba iliyochanganywa. “Shaba” ni tafsiri ya kawaida na inayosomeka vizuri, huku tanbihi ikihifadhi uwezekano wa aloi ya shaba.
- source_word: הַבַּרְזֶל
  choice: chuma
  rationale: Ni tafsiri ya kawaida ya metali hii katika Kiswahili.
- source_word: הַבְּדִיל
  choice: bati
  rationale: Katika orodha za metali neno hili kwa kawaida humaanisha tin, inayoitwa “bati” katika matumizi ya kawaida ya Kiswahili.
- source_word: הָעֹפָרֶת
  choice: risasi
  rationale: “Risasi” ni jina la kawaida la metali lead katika Kiswahili; muktadha unaiondoa maana ya projectile.
- source_word: אֵת repeated before each noun
  choice: halijatafsiriwa kwa neno maalumu
  rationale: Kiashiria cha yambwa cha Kiebrania kinarudiwa ili kuunda na kusisitiza orodha, lakini hakina kisawe cha moja kwa moja katika Kiswahili; mpangilio na alama za uandishi zinawakilisha muundo huo.
