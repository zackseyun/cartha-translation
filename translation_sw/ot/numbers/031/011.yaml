  text: And they took all the spoil and all the plunder, both man and beast.
translation:
  language: sw
  text: Nao wakachukua nyara zote na watu na wanyama wote waliotekwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלָל (šālāl)
  choice: nyara
  rationale: Neno hili kwa kawaida humaanisha mali iliyotwaliwa vitani; “nyara” ni tafsiri ya kawaida, fupi, na inayoeleweka katika Kiswahili.
- source_word: מַלְקוֹחַ (malqôaḥ)
  choice: mateka
  rationale: Katika muktadha huu linatofautishwa na “nyara” na kufafanuliwa kuwa linahusu watu na wanyama waliotekwa; “mateka” huhifadhi wazo la kutwaliwa hai.
- source_word: אָדָם (ʾādām)
  choice: watu
  rationale: Hapa ni nomino ya jumla inayorejelea wanadamu kama kundi, si mtu mmoja wa kiume.
- source_word: בְּהֵמָה (bəhēmāh)
  choice: wanyama
  rationale: Neno la jumla kwa wanyama, hasa wanyama wa kufugwa katika muktadha huu; “wanyama” huepuka kuongeza umahususi usiotajwa wazi katika mstari.
