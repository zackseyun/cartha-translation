  text: וַ/יֹּ֨אמֶר אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶל אַנְשֵׁ֣י הַ/צָּבָ֔א הַ/בָּאִ֖ים לַ/מִּלְחָמָ֑ה זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/021.yaml
  text: Then Eleazar the priest said to the men of the army who had come to the battle[a], “This is the statute of the law that Yahweh commanded Moses:”
translation:
  language: sw
  text: Kisha kuhani Eleazari akawaambia wanaume wa jeshi waliokuwa wameenda vitani, “Hii ndiyo kanuni ya sheria[a] ambayo Yahwe alimwamuru Musa:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “agizo la sheria” au “kanuni ya mafundisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akawaambia
  rationale: Muundo wa waw-consecutive unaendeleza simulizi. “Kisha” huonyesha mfuatano wa matukio kwa Kiswahili cha kawaida, na “akawaambia” huwasilisha kwa ufasaha usemi ulioelekezwa kwa kundi.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: kuhani Eleazari
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili, na cheo cha הַכֹּהֵן kimetafsiriwa moja kwa moja kuwa “kuhani.”
- source_word: אַנְשֵׁי הַצָּבָא
  choice: wanaume wa jeshi
  rationale: Huhifadhi kwa uwazi jinsia ya neno אַנְשֵׁי na maana ya kijeshi ya צָבָא bila kutumia lugha ya kizamani.
- source_word: הַבָּאִים לַמִּלְחָמָה
  choice: waliokuwa wameenda vitani
  rationale: Huwasilisha kikundi kilichohusika katika vita huku ikihifadhi mwelekeo wa לַמִּלְחָמָה kuelekea vitani; haisemi wazi kwamba walikuwa wakirudi, jambo ambalo Kiebrania cha mstari huu halitamki moja kwa moja.
- source_word: חֻקַּת הַתּוֹרָה
  choice: kanuni ya sheria
  rationale: “Kanuni” huonyesha agizo lililowekwa na lenye nguvu ya kudumu, huku “sheria” ikibeba maana ya תּוֹרָה kama mafundisho au sheria yenye mamlaka.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ambayo Yahwe alimwamuru Musa
  rationale: Alama ya yambwa אֶת humtambulisha Musa kuwa aliyeamriwa. Jina la Mungu limetolewa kama “Yahwe,” na si cheo mbadala.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Kiebrania kinatumia moja kwa moja jina la agano יְהוָה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa Musa na amri
  choice: Yahwe alimwamuru Musa
  alternative: Yahwe aliamuru kupitia Musa
  rationale: Muundo wa Kiebrania una אֶת kabla ya Musa, kwa hiyo Musa ndiye anayeamriwa; mstari huu haumwelezi hapa kama njia ambayo amri ilipitishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Alama ya tanbihi imewekwa baada ya “kanuni ya sheria,” kwa kuwa tanbihi inahusu חֻקַּת הַתּוֹרָה, si maneno yanayohusu kwenda vitani.
