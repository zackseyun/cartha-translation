base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/029.yaml
  text: From their half you shall take it and give it to Eleazar the priest as Yahweh’s contribution[a].
translation:
  language: sw
  text: Kutoka katika nusu yao mtachukua sehemu hiyo na kumkabidhi Eleazari, kuhani, kama mchango wa Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya Yahwe” au “mchango kwa ajili ya Yahwe.” Neno la Kiebrania תְּרוּמָה linamaanisha sehemu iliyotengwa kwa matumizi matakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמַּחֲצִיתָם
  choice: Katika nusu yao
  rationale: Kirai hiki kinaonyesha kwamba sehemu inayotajwa ichukuliwe kutoka katika nusu yao, yaani nusu iliyowagawia wapiganaji katika muktadha.
- source_word: תִּקָּחוּ
  choice: mtachukua
  rationale: Umbo la nafsi ya pili wingi lina nguvu ya agizo; wakati ujao wa Kiswahili huwasilisha agizo hilo kwa lugha ya kawaida na yenye hadhi.
- source_word: וְנָתַתָּה
  choice: na kumpa
  rationale: Kitenzi kinaendelea na mlolongo wa maagizo. Kiswahili hiki cha kawaida hakikazii bila ulazima badiliko la Kiebrania kutoka wingi kwenda umoja.
- source_word: לְאֶלְעָזָר
  choice: Eleazari
  rationale: Tahajia Eleazari inafuata matumizi ya kawaida ya jina hili katika Kiswahili cha Biblia.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ni jina la wadhifa wa Eleazari, na ‘kuhani’ ni tafsiri ya moja kwa moja na iliyozoeleka.
- source_word: תְּרוּמַת יְהוָה
  choice: mchango wa Yahwe
  rationale: תְּרוּמָה hapa ni sehemu iliyotengwa kwa matumizi matakatifu kutoka katika nyara; ‘mchango’ huhifadhi wazo la sehemu iliyotolewa bila kutumia istilahi ya kale isiyoeleweka kwa urahisi. ‘Wa Yahwe’ huhifadhi uhusiano wa Kiebrania bila kuamua kimya kimya kama ni mali ya Yahwe au mchango kwa ajili yake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo ‘BWANA’.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Andiko la Kiebrania linatumia jina la agano lenyewe. ‘Yahwe’ hulihifadhi kama jina binafsi na ni tahajia ya asili katika Kiswahili.
- issue: Maana ya תְּרוּמָה katika muktadha wa ibada
  choice: mchango
  alternative: sadaka; sehemu iliyotengwa kwa ajili ya Yahwe
  rationale: Neno hilo linamaanisha sehemu iliyotengwa kwa matumizi matakatifu. ‘Mchango’ ni wazi na wa kisasa, huku tanbihi ikihifadhi uwezekano wa kutafsiri ‘sadaka’ au kusisitiza kwamba ni kwa ajili ya Yahwe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imehifadhi agizo la kisheria, maana ya sehemu kutoka katika nusu iliyogawiwa, jina Yahwe, na utata halisi wa uhusiano katika ‘mchango wa Yahwe.’
