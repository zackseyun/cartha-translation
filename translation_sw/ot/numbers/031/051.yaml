  text: So Moses and Eleazar the priest took the gold from them[a], every crafted article.
translation:
  language: sw
  text: Basi Musa na kuhani Eleazari wakachukua kutoka kwao dhahabu hiyo—vitu vyote vya dhahabu vilivyofanyizwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: wakapokea
  rationale: Kitenzi לקח kinaweza kumaanisha kuchukua au kupokea. Katika muktadha huu Musa na Eleazari wanapokea dhahabu iliyowasilishwa kwao; “wakapokea” ni ya kawaida na inaonyesha tendo hilo bila kupoteza maana ya msingi.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: וְאֶלְעָזָר הַכֹּהֵן
  choice: na kuhani Eleazari
  rationale: Kiswahili cha kawaida huweka cheo kabla ya jina; tafsiri hii inahifadhi wadhifa wa Eleazari.
- source_word: אֶת הַזָּהָב
  choice: dhahabu hiyo
  rationale: Kiambishi cha uamilifu hakitafsiriwi moja kwa moja; “hiyo” huonyesha kuwa ni dhahabu maalumu inayozungumziwa katika muktadha.
- source_word: מֵאִתָּם
  choice: kutoka kwao
  rationale: Kirai hiki kinaonyesha chanzo cha dhahabu; “kutoka kwao” ni tafsiri sahihi na ya kawaida.
- source_word: כֹּל
  choice: kila
  rationale: Neno hili linafuatiwa na nomino ya umoja yenye maana ya mkusanyiko; “kila” huhifadhi vizuri muundo huo.
- source_word: כְּלִי
  choice: kitu
  rationale: כְּלִי ni neno pana linaloweza kumaanisha chombo, kifaa, au kitu. “Kitu” huepuka kudokeza kuwa vilikuwa vyombo vya kuhifadhia pekee.
- source_word: מַעֲשֶׂה
  choice: kilichotengenezwa kwa ustadi
  rationale: Katika muundo כְּלִי מַעֲשֶׂה, neno hili linaonyesha kitu kilichofanyizwa kwa kazi ya ufundi, si dhahabu ghafi. Kirai hiki ni cha asili na wazi kwa msomaji wa kisasa.
