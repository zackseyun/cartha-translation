  text: And they said to Moses[a], “Your servants have taken a count of the men of war who are under our command[b], and not one man of us is missing.”
translation:
  language: sw
  text: Nao wakamwambia Musa, “Watumishi wako wamewahesabu wanaume wapiganaji walio chini ya amri yetu,[a] wala hakuna hata mmoja miongoni mwetu aliyekosekana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “walio mkononi mwetu”; yaani, walio chini ya uangalizi au amri yetu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: Watumishi wako
  rationale: Katika mazingira haya maofisa wanazungumza na Musa kwa heshima; ‘watumishi’ ni ya kawaida na haiongezi wazo la hali ya utumwa lisilotiliwa mkazo hapa.
- source_word: נָשְׂאוּ אֶת רֹאשׁ
  choice: wamewahesabu
  rationale: Nahau ya Kiebrania, kihalisi ‘wameinua kichwa,’ humaanisha kuhesabu watu katika muktadha wa kijeshi au kiutawala.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: wanaume wa vita
  rationale: Kirai kinawahusu hasa wanaume wapiganaji; tafsiri hii inatunza umahususi wa kijinsia na muktadha wa kijeshi.
- source_word: אֲשֶׁר בְּיָדֵנוּ
  choice: walio chini ya amri yetu
  rationale: Nahau ‘walio mkononi mwetu’ hapa inaonyesha mamlaka au wajibu wa maofisa juu ya wanajeshi.
- source_word: נִפְקַד מִמֶּנּוּ אִישׁ
  choice: hakuna hata mmoja wetu aliyekosekana
  rationale: Katika muktadha wa ukaguzi baada ya vita, kitenzi kinaonyesha kwamba hakuna mtu aliyekuwa hayupo au ambaye hakupatikana katika hesabu.
