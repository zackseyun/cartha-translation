base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/032.yaml
  text: The plunder[a], the remainder of the spoil that the people of the army had plundered, was 675,000 sheep.
translation:
  language: sw
  text: Nyara[a], yaani sehemu iliyobaki ya nyara ambazo watu wa jeshi walikuwa wameziteka, zilikuwa kondoo 675,000.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mali iliyotekwa.” Kiebrania kinatumia maneno mawili yanayokaribiana kwa maana kuhusu vitu au wanyama waliotekwa vitani (מַלְקוֹחַ na בָּז), huenda kwa tofauti ndogo ya mtindo au uainishaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ilikuwa
  rationale: Kitenzi היה hapa kinaanzisha taarifa ya hesabu; ‘ilikuwa’ kinahifadhi maana ya kishirikishi bila kuongeza neno la wakati lisilokuwamo wazi katika Kiebrania.
- source_word: הַמַּלְקוֹחַ
  choice: nyara
  rationale: Neno hili linataja vitu au wanyama waliotwaliwa vitani; ‘nyara’ ni neno la kawaida na linaloeleweka katika muktadha huu.
- source_word: יֶתֶר הַבָּז
  choice: sehemu iliyobaki ya mateka
  rationale: ‘Sehemu iliyobaki’ inaonyesha maana ya יֶתֶר, huku ‘mateka’ likitofautisha kwa kiasi istilahi ya pili ya mali iliyotwaliwa vitani.
- source_word: אֲשֶׁר בָּזְזוּ
  choice: ambayo ... walikuwa wameteka
  rationale: Muundo huu unaonyesha kitendo cha awali cha kutwaa nyara na kuhifadhi nguvu ya mzizi בזז bila kufanya Kiswahili kuwa kizito.
- source_word: עַם הַצָּבָא
  choice: watu wa jeshi
  rationale: Hili ni tafsiri ya karibu ya kirai cha Kiebrania na ni Kiswahili cha asili kinachoeleweka.
- source_word: צֹאן
  choice: kondoo
  rationale: Katika orodha hii ya hesabu, ‘kondoo’ ndiyo tafsiri ya moja kwa moja na ya kawaida; muktadha unaifanya ifae kuliko neno pana ‘mifugo midogo.’
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וְשִׁבְעִים אֶלֶף וַחֲמֵשֶׁת אֲלָפִים
  choice: 675,000
  rationale: Tarakimu zinawasilisha kwa uwazi jumla kamili ya 600,000 + 70,000 + 5,000 katika orodha ya hesabu.
