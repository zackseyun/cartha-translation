source:
  edition: WLC
  text: וַֽ/יִּצְבְּאוּ֙ עַל מִדְיָ֔ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/007.yaml
  text: So they waged war against Midian[a], just as Yahweh had commanded Moses, and they killed every male.
translation:
  language: sw
  text: Wakapigana vita dhidi ya Midiani[a], kama vile Yahwe alivyomwamuru Musa, wakawaua wote wa kiume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakapigana na Midiani.” Kitenzi cha Kiebrania kinaweza kumaanisha kushiriki katika utumishi wa kijeshi au katika vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּאוּ
  choice: wakapigana vita
  rationale: Kitenzi צבא hapa kinaeleza kushiriki katika shughuli za kijeshi au kwenda vitani. “Wakapigana vita” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kijeshi.
- source_word: עַל
  choice: dhidi ya
  rationale: Pamoja na kitenzi cha vita, עַל inaonyesha uelekeo wa uhasama; “dhidi ya” ndiyo tafsiri ya asili katika muktadha huu.
- source_word: מִדְיָן
  choice: Midiani
  rationale: Jina la mahali au taifa limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Kifungu hiki kinaonyesha kuwa walitenda kwa kufuata sawasawa amri iliyotolewa.
- source_word: צִוָּה
  choice: alivyomwamuru
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba amri ilitangulia tendo la kupigana.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֶת מֹשֶׁה
  choice: Musa
  rationale: אֶת humtambulisha Musa kama yule aliyeamriwa; “alivyomwamuru Musa” ni muundo wa kawaida wa Kiswahili.
- source_word: וַיַּהַרְגוּ
  choice: wakawaua
  rationale: הרג humaanisha kuua moja kwa moja; kiambishi cha yambwa kinaelekezwa kwa wale wa kiume wanaotajwa baada yake.
- source_word: כָּל
  choice: wote
  rationale: Kwa nomino ya pamoja “wa kiume,” “wote” huwasilisha kwa asili maana jumuishi ya כָּל.
- source_word: זָכָר
  choice: wa kiume
  rationale: זָכָר hutaja jinsia ya kiume bila kuwekewa mpaka wa umri. “Wa kiume” huepuka kuifanya ihusu wanaume watu wazima pekee.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina na hutumia tahajia inayolingana na matamshi ya Kiswahili.
- issue: Upeo wa זָכָר
  choice: wote wa kiume
  alternative: kila mwanamume
  rationale: Neno la Kiebrania linahusu walio wa jinsia ya kiume, si wanaume watu wazima tu. Tafsiri iliyochaguliwa haiupunguzi upeo huo, ingawa ukali wake unabaki wazi katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na wenye heshima. Muundo wa masimulizi umetumia viambishi vya mfululizo “waka-”; lugha haijaficha wala kupunguza ukali wa tendo linaloelezwa.
