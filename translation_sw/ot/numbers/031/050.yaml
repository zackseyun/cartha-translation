id: NUM.31.50
reference: Numbers 31:50
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/נַּקְרֵ֞ב אֶת קָרְבַּ֣ן יְהוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי זָהָב֙ אֶצְעָדָ֣ה וְ/צָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְ/כוּמָ֑ז לְ/כַפֵּ֥ר עַל נַפְשֹׁתֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/050.yaml
  text: 'So we have brought near Yahweh’s offering: each man what he found—articles of gold[a], armlets and bracelets, rings, earrings[c][b], and pendants—to make atonement for ourselves before Yahweh.'
translation:
  language: sw
  text: 'Kwa hiyo tumemletea Yahweh sadaka: kila mwanamume ametoa kile alichokipata—vitu vya dhahabu, vikuku vya mkono[a], bangili, pete, vipuli, na mapambo[b]—ili kufanya upatanisho kwa ajili yetu[c] mbele za Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda “vikuku vya mguu” (אֶצְעָדָה).
    reason: lexical_alternative
  - marker: b
    text: Maana kamili ya כּוּמָז haijulikani; huenda ikawa mikufu, mapambo, au pete za puani.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kwa ajili ya nafsi zetu” au “kwa ajili ya maisha yetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּקְרֵב
  choice: Kwa hiyo tumemletea
  rationale: Hifili ya קרב ina maana ya kusogeza au kuleta karibu. Katika muktadha wa sadaka, “tumemletea” ni Kiswahili cha kawaida kinachohifadhi tendo la kuwasilisha sadaka kwa Yahweh; “Kwa hiyo” linaakisi waw ya simulizi na hitimisho linalotokana na yaliyotangulia.
- source_word: קָרְבַּן יְהוָה
  choice: Yahweh sadaka yake
  rationale: קָרְבָּן ni kitu kinacholetwa kama sadaka. Muundo huu wa Kiswahili unaonyesha uhusiano wa sadaka na Yahweh bila kubainisha zaidi aina yake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa namna ya kutamkwa badala ya kubadilishwa kuwa cheo.
- source_word: אִישׁ אֲשֶׁר מָצָא
  choice: kila mwanamume kile alichokipata
  rationale: אִישׁ ina nguvu ya ugawaji na katika muktadha inawahusu wanaume wa jeshi. Kiswahili hiki kinahifadhi jinsia na maana ya mchango wa kila mmoja.
- source_word: כְלִי זָהָב
  choice: vitu vya dhahabu
  rationale: כְלִי ni neno pana kwa kitu, chombo, au kifaa. “Vitu vya dhahabu” halibani maana kuwa vito pekee, ingawa orodha inayofuata ni ya mapambo.
- source_word: אֶצְעָדָה
  choice: vikuku vya mkono
  rationale: Neno hilo linaonekana kumaanisha pambo linalovaliwa kwenye kiungo, lakini utambulisho wake si hakika. “Vikuku vya mkono” ni chaguo linaloeleweka, huku uwezekano wa vikuku vya mguu ukihifadhiwa katika tanbihi.
- source_word: צָמִיד
  choice: bangili
  rationale: Neno hili humaanisha pambo la duara linalovaliwa kwenye kifundo au mkono; “bangili” ni neno la kawaida na linalotofautisha kipengee hiki na אֶצְעָדָה.
- source_word: טַבַּעַת
  choice: pete
  rationale: Maana ya msingi ni pete. Ingawa wakati mwingine inaweza kuwa pete ya muhuri, hilo halihitajiki hapa.
- source_word: עָגִיל
  choice: vipuli
  rationale: Katika orodha ya mapambo, neno hili kwa kawaida humaanisha mapambo ya masikio. “Vipuli” ni Kiswahili cha kawaida cha Afrika Mashariki.
- source_word: כוּמָז
  choice: mapambo
  rationale: Aina kamili ya pambo haijulikani. “Mapambo” ni chaguo pana lisilodai uhakika usiokuwapo; mapendekezo mahususi yametajwa katika tanbihi.
- source_word: לְכַפֵּר
  choice: ili kufanya upatanisho
  rationale: כפר katika muktadha wa sadaka hubeba maana ya kitheolojia ya kufanya upatanisho. Tafsiri hii inahifadhi uzito huo bila kueleza utaratibu ambao mstari hauuelezi.
- source_word: עַל נַפְשֹׁתֵינוּ
  choice: kwa ajili yetu
  rationale: Kihalisi ni “kwa ajili ya nafsi/maisha yetu.” Hapa inawahusu wao wenyewe, na tafsiri hii ni ya kawaida bila kuingiza mgawanyo wa baadaye wa mwili na roho.
theological_decisions:
- issue: Uhusiano wa zawadi na כפר
  choice: Sadaka hiyo inahusishwa wazi na kufanya upatanisho kwa ajili ya wanaume mbele za Yahweh.
  alternative: Kuiona kama sadaka ya shukrani tu, au kama njia ya kuondoa hatari bila maana ya kiibada.
  rationale: Mstari unatumia כפר pamoja na קָרְבַּן na usemi “mbele za Yahweh.” Kwa hiyo lugha ya upatanisho inapaswa kuhifadhiwa, bila kufafanua namna yake zaidi ya andiko.
- issue: Jinsia katika אִישׁ
  choice: kila mwanamume
  alternative: kila mmoja; kila mtu
  rationale: Katika muktadha huu neno linawahusu wanaume wa jeshi na lina nguvu ya ugawaji; tafsiri hiyo ni sahihi kwa jinsia na maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Orodha imewasilishwa kwa istilahi za kawaida za mapambo, huku kutokuwa na uhakika kwa maneno mawili adimu kukihifadhiwa katika tanbihi.
