lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: na punda
  rationale: חֲמֹרִים ni nomino ya kawaida ya wingi inayomaanisha punda; kiunganishi וַ kimetafsiriwa “na” ili kuhifadhi muundo wa orodha. Kiswahili hutumia umbo lilelile “punda” kwa umoja na wingi, na muktadha pamoja na idadi vinaonyesha wingi.
- source_word: שְׁלֹשִׁים אֶלֶף
  choice: elfu thelathini
  rationale: Huu ni usemi wa kawaida wa namba ya Kiebrania wenye maana ya elfu thelathini, umetolewa kwa mpangilio wa kawaida wa Kiswahili.
- source_word: וַ/חֲמֵשׁ מֵאוֹת
  choice: na mia tano
  rationale: Kiunganishi וַ kimehifadhiwa kwa “na,” na חֲמֵשׁ מֵאוֹת limetafsiriwa kwa njia ya kawaida ya Kiswahili kama “mia tano,” hivyo jumla ni 30,500.
