  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: שָׂ֗א אֵ֣ת רֹ֤אשׁ מַלְק֨וֹחַ֙ הַ/שְּׁבִ֔י בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה אַתָּה֙ וְ/אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/רָאשֵׁ֖י אֲב֥וֹת הָ/עֵדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/026.yaml
  text: Take a count of the plunder that was taken[c][b][a], both of man and of beast—you and Eleazar the priest and the heads of the fathers’ houses of the congregation.
translation:
  language: sw
  text: “Fanya hesabu ya nyara zilizotekwa[a]—watu[b] na wanyama—wewe pamoja na kuhani Eleazari na viongozi wa jamaa za ukoo[c] za kusanyiko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vilivyotekwa vitani.” Kirai cha Kiebrania kinahusu vyote vilivyotekwa katika vita, hapa vikiwa watu na wanyama.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania אָדָם hapa humaanisha wanadamu, kwa kuwatofautisha na wanyama.
    reason: lexical_clarification
  - marker: c
    text: Au “wakuu wa nyumba za mababu”; kwa tafsiri yenye maana pana zaidi, “viongozi wa koo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא אֵת רֹאשׁ
  choice: Fanya hesabu
  rationale: Hii ni nahau yenye maana ya kuhesabu au kupata jumla, si kuinua kichwa kihalisi. Kauli ya umoja inamhutubia Musa moja kwa moja.
- source_word: מַלְקוֹחַ הַשְּׁבִי
  choice: nyara zilizotekwa
  rationale: Kirai hiki kinamaanisha vitu na viumbe vilivyotekwa vitani. ‘Nyara’ ni neno la sasa na linaloeleweka, huku ‘zilizotekwa’ likihifadhi wazo la kutwaliwa vitani bila kulihusisha na wanadamu pekee.
- source_word: בָּאָדָם
  choice: watu
  rationale: אָדָם hapa ni wanadamu kwa ujumla, wakitofautishwa na wanyama. ‘Watu’ ni wazi na ya kawaida katika Kiswahili.
- source_word: וּבַבְּהֵמָה
  choice: na wanyama
  rationale: בְּהֵמָה humaanisha wanyama, mara nyingi wanyama wa kufugwa. ‘Wanyama’ huhifadhi upana wa neno na utofauti wake na watu.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi kilicho wazi katika Kiebrania kinasisitiza ushiriki wa Musa mwenyewe.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: kuhani Eleazari
  rationale: Jina limetoholewa kwa mazoea ya Kiswahili, na cheo kimetangulia jina kwa mpangilio wa kawaida wa Kiswahili.
- source_word: רָאשֵׁי אֲבוֹת
  choice: viongozi wa jamaa za ukoo
  rationale: Kirai kinawahusu wakuu wa vitengo vya kifamilia vya mababu. Tafsiri hii ni ya asili zaidi kuliko ‘vichwa vya nyumba za baba’ na bado huhifadhi muundo wa kifamilia.
- source_word: הָעֵדָה
  choice: kusanyiko
  rationale: Neno hili humaanisha jumuiya iliyokusanyika ya Israeli. ‘Kusanyiko’ linafaa katika muktadha wa Pentateuki na linaeleweka katika Kiswahili cha sasa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya heshima, ya sasa na inayoeleweka. Mistari mirefu imetumiwa kutenga maelezo ya aina za nyara na kuwataja wanaopaswa kufanya hesabu. Kauli ‘Fanya’ imebaki katika umoja kwa sababu Kiebrania kinamhutubia Musa moja kwa moja, ingawa wengine wanashirikishwa kwa kirai ‘wewe pamoja na’.
