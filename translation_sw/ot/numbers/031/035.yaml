  text: And the persons from the women who had not known the bed of a male[a], all the persons, were thirty-two thousand.
translation:
  language: sw
  text: Nao watu miongoni mwa wanawake ambao hawakuwa wamewahi kulala na mwanamume[a] walikuwa jumla ya elfu thelathini na mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hawakuwa wamejua kulala na mwanamume,” nahau inayomaanisha kwamba hawakuwa wamefanya ngono na mwanamume.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: watu
  rationale: Kirai hiki kinamaanisha watu hai na hapa kinawatofautisha na mifugo iliyohesabiwa katika muktadha. “Watu” ni tafsiri ya kawaida na yenye heshima katika Kiswahili.
- source_word: מִן הַנָּשִׁים
  choice: miongoni mwa wanawake
  rationale: Kihusishi מִן kinaonyesha kwamba kundi hili lilitokana na wanawake waliotekwa; “miongoni mwa wanawake” ni Kiswahili cha kawaida kinachoonyesha uteuzi huo.
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: ambao hawakuwa wamewahi kulala na mwanamume
  rationale: Katika muktadha huu, יָדַע pamoja na מִשְׁכַּב זָכָר ni nahau inayorejelea mahusiano ya kingono. Kiswahili “kulala na mwanamume” huhifadhi nahau ya kulala na kueleza maana kwa kawaida; “wahi” huonyesha kwamba jambo hilo halikuwa limetokea kabla.
- source_word: כָּל נֶפֶשׁ
  choice: jumla
  rationale: Kirai hiki kinajumlisha idadi ya kundi lote. “Jumla” huwasilisha kazi yake ya kihesabu bila marudio yasiyo ya kawaida katika Kiswahili.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אָלֶף
  choice: elfu thelathini na mbili
  rationale: Hii ndiyo namna ya kawaida ya kuandika kwa maneno idadi 32,000 katika Kiswahili.
