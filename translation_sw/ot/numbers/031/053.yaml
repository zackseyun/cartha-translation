translation:
  language: sw
  text: Wanaume wa jeshi walikuwa wamejinyakulia nyara, kila mmoja kwa ajili yake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri iliyo rasmi zaidi, “Wanaume wa jeshi walikuwa wamepora, kila mtu kwa ajili yake.”
