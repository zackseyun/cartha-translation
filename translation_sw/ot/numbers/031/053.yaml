lexical_decisions:
- source_word: אַנְשֵׁי
  choice: wanaume wa
  rationale: Ni umbo la wingi katika hali ya uambatano la אִישׁ; hapa linawarejelea wanaume waliokuwa katika jeshi. ‘Wanaume wa’ linahifadhi jinsia na uhusiano wa maneno ya chanzo.
- source_word: הַצָּבָא
  choice: jeshi
  rationale: Katika simulizi hili צָבָא ni kikosi cha kijeshi; ‘jeshi’ ni neno la kawaida, la sasa, na linaloeleweka vizuri katika Kiswahili.
- source_word: בָּזְזוּ
  choice: walikuwa wamejipatia nyara
  rationale: Kitenzi בזז humaanisha kupora au kutwaa nyara. ‘Walikuwa wamejipatia nyara’ kinaeleza kwa kawaida kuwa kila mmoja alitwaa sehemu yake, huku wakati timilifu uliopita ukionyesha tendo lililotangulia muktadha wa mstari huu.
- source_word: אִישׁ לּוֹ
  choice: kila mmoja kwa ajili yake mwenyewe
  rationale: Usemi huu una nguvu ya ugawaji, yaani kila mwanajeshi alichukua nyara kwa manufaa yake binafsi. Tafsiri hii inahifadhi msisitizo huo bila kuongeza maelezo yasiyokuwapo.
