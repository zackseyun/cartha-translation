  yaml_path: translation/ot/numbers/031/009.yaml
  text: The sons of Israel took captive the women of Midian and their little ones[a], and plundered all their livestock, all their herds[c][b], and all their wealth.
translation:
  language: sw
  text: Wana wa Israeli[a] waliwateka wanawake wa Midiani na watoto wao wadogo[b], wakapora wanyama wao wote wa kufugwa, mifugo yao yote, na mali yao yote.[c]
  philosophy: optimal-equivalence
  footnotes:
