    text: Au “vitu vyao vyote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: waliwateka
  rationale: Kitenzi שׁבה hapa kinahusu kuwachukua watu mateka, si kunyakua vitu kwa ujumla. “Waliwateka” ni Kiswahili cha kawaida na sahihi katika muktadha wa vita.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania בן + jina maalumu, huku “Waisraeli” likibaki kuwa badala ya asili katika tanbihi.
- source_word: נְשֵׁי מִדְיָן
  choice: wanawake wa Midiani
  rationale: נָשִׁים hapa humaanisha wanawake kwa ujumla, si lazima wake; muundo huu pia huhifadhi kirai cha umilikaji cha Kiebrania.
- source_word: טַפָּם
  choice: watoto wao wadogo
  rationale: טַף kwa kawaida huonyesha watoto wadogo au walio chini ya uangalizi. Tafsiri hii huhifadhi wazo la umri mdogo bila kulipanua.
- source_word: בְּהֶמְתָּם
  choice: wanyama wao wote wa kufugwa
  rationale: בְּהֵמָה katika matumizi ya kijumla humaanisha wanyama wa nyumbani au wa kufugwa. Kauli hii ni wazi na huitofautisha kwa kiasi na מִקְנֶה.
- source_word: מִקְנֵהֶם
  choice: mifugo yao yote
  rationale: מִקְנֶה mara nyingi hurejelea mifugo inayomilikiwa, ikiwemo makundi ya kondoo, mbuzi, au ng’ombe. “Mifugo” ni neno la kawaida na linalofaa mazingira ya ufugaji.
- source_word: חֵילָם
  choice: mali yao yote
  rationale: חַיִל hapa ina maana ya mali, utajiri, au rasilimali, si jeshi. Baada ya watu na wanyama kutajwa, “mali” hujumuisha vitu vingine vya thamani.
- source_word: בָּזָזוּ
  choice: wakapora
  rationale: בזז humaanisha kutwaa nyara baada ya ushindi wa kivita. “Wakapora” huhifadhi maana hiyo kwa lugha fupi na ya kawaida.
theological_decisions:
- issue: Tafsiri ya usemi wa kikabila “wana wa Israeli”
  choice: Wana wa Israeli
  alternative: Waisraeli
  rationale: Hakuna fundisho maalumu linaloamuliwa hapa. Tafsiri kuu huhifadhi umbo la chanzo kwa namna inayoeleweka katika Kiswahili, huku tanbihi ikitoa namna ya kawaida zaidi ya kutaja taifa hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usomaji wa Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Mfululizo wa vitu katika Kiebrania umehifadhiwa, pamoja na tofauti kati ya בְּהֵמָה na מִקְנֶה, ingawa maana zake zinakaribiana.
