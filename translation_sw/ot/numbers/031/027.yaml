  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָצִיתָ
  choice: Nawe ugawanye
  rationale: Kitenzi חצה humaanisha kugawanya katika sehemu. Umbo la agizo linafaa muktadha wa maagizo kwa Musa, huku kiunganishi וְ kikionyeshwa kwa “Nawe.”
- source_word: הַמַּלְקוֹחַ
  choice: mateka
  rationale: מַלְקוֹחַ ni kile kilichotwaliwa vitani na katika muktadha huu kinajumuisha watu, mifugo na mali. “Mateka” ni neno pana la Kiswahili katika muktadha wa vita, ingawa linaweza kueleweka hasa kuwa watu; kwa hiyo mbadala umeelezwa katika tanbihi.
- source_word: בֵּין ... וּבֵין
  choice: kati ya ... na
  rationale: Muundo huu unaonyesha kugawa kile kilichotwaliwa baina ya makundi mawili.
- source_word: תֹּפְשֵׂי הַמִּלְחָמָה
  choice: wapiganaji
  rationale: Kirai hiki, kwa maana halisi ‘wanaoshika/kushughulikia vita,’ ni nahau inayowataja washiriki wa mapigano. “Wapiganaji” ni tafsiri ya asili na wazi.
- source_word: הַיֹּצְאִים לַצָּבָא
  choice: walioenda vitani
  rationale: Kirai kinawabainisha wapiganaji kuwa wale waliotoka kwenda katika huduma ya kijeshi au kampeni ya vita.
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה humaanisha jumuiya iliyokusanyika ya Israeli. “Kusanyiko lote” huhifadhi maana ya kundi zima bila kudokeza dhehebu fulani.
