base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/008.yaml
  text: 'They killed the kings of Midian along with the rest of their slain: Evi[a], Rekem, Zur, Hur, and Reba, the five kings of Midian. They also killed Balaam son of Beor with the sword.'
translation:
  language: sw
  text: 'Waliwaua wafalme wa Midiani pamoja na watu wao wengine waliouawa[a]: Evi, Rekemu, Suri, Huri na Reba—hao ndio wafalme watano wa Midiani. Pia walimuua Balaamu mwana wa Beori kwa upanga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa watu wao waliouawa.” Kirai cha Kiebrania ni kifupi na kinaweza kuonyesha kwamba wafalme hao waliuawa miongoni mwa Wamidiani wengine waliokufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: waliwaua
  rationale: Kitenzi cha Kiebrania הרג hapa kinamaanisha kuua moja kwa moja; “waliwaua” ni Kiswahili cha sasa, wazi na cha kawaida.
- source_word: עַל חַלְלֵיהֶם
  choice: pamoja na watu wao wengine waliouawa[a]
  rationale: Kirai hiki ni kifupi na kinaweza kumaanisha kuwa wafalme waliuawa pamoja na wengine wa Midiani waliokufa. Tafsiri hii ni ya asili katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana ya mahali, yaani “miongoni mwa waliouawa.”
- source_word: מַלְכֵי מִדְיָן
  choice: wafalme wa Midiani
  rationale: Huu ni mnyororo wa umilikaji unaomaanisha wazi wafalme wa Midiani; tafsiri ileile imetumiwa tena katika ufafanuzi baada ya orodha ya majina.
- source_word: אֱוִי
  choice: Evi
  rationale: Jina la mtu limenukuliwa kwa umbo linalofaa matamshi ya Kiswahili.
- source_word: רֶקֶם
  choice: Rekemu
  rationale: Jina la mtu limenukuliwa kwa kuongezewa vokali ya mwisho ili lisomeke kwa kawaida katika Kiswahili.
- source_word: צוּר
  choice: Suri
  rationale: Jina la mtu limenukuliwa kwa umbo la Kiswahili, likiwakilisha konsonanti ya Kiebrania צ kwa “s” na kuongeza vokali ya mwisho.
- source_word: חוּר
  choice: Huri
  rationale: Jina la mtu limenukuliwa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: רֶבַע
  choice: Reba
  rationale: Jina la mtu limenukuliwa badala ya kutafsiriwa.
- source_word: חֲמֵשֶׁת מַלְכֵי מִדְיָן
  choice: hao ndio wafalme watano wa Midiani
  rationale: Kirai hiki kinaeleza kwa muhtasari kwamba watu watano waliotajwa ndio wafalme watano; “hao ndio” hufanya uhusiano huo uwe wazi na wa asili katika Kiswahili.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaamu mwana wa Beori
  rationale: Jina na nasaba yake zimetolewa kwa mtindo wa kawaida wa Kiswahili wa majina ya Biblia.
- source_word: בֶּחָרֶב
  choice: kwa upanga
  rationale: Herufi ב inaonyesha chombo kilichotumiwa; “kwa upanga” ni usemi mfupi na wa kawaida wa Kiswahili unaohifadhi chombo halisi.
