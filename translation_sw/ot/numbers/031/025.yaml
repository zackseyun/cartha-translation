lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa vitenzi vya mfululizo unasogeza simulizi mbele. “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida, na “akamwambia” huwasilisha kwa kawaida tendo la kusema kwa mtu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: אֶל
  choice: -mwambia
  rationale: Kiambishi cha mtendewa katika “akamwambia” kinawasilisha kwa ufasaha maana ya kusema kwa Musa.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Katika Kiswahili, alama ya nukta mbili hutambulisha kwa kawaida maneno yanayofuata na kuwasilisha kazi ya נוסחת utangulizi “akisema” bila urudiaji usio wa kawaida.
theological_decisions:
