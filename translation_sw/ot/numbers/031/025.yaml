  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuongeza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri kuu ni ya kawaida na wazi; nukta mbili zinaonyesha kwamba ujumbe unaendelea katika mstari unaofuata.
