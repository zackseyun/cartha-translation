  text: וְ/אַתֶּ֗ם חֲנ֛וּ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים כֹּל֩ הֹרֵ֨ג נֶ֜פֶשׁ וְ/כֹ֣ל נֹגֵ֣עַ בֶּֽ/חָלָ֗ל תִּֽתְחַטְּא֞וּ בַּ/יּ֤וֹם הַ/שְּׁלִישִׁי֙ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֔י אַתֶּ֖ם וּ/שְׁבִי/כֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/019.yaml
  text: And you[a], camp outside the camp for seven days. Everyone who has killed a person, and everyone who has touched one slain, shall purify yourselves on the third day and on the seventh day—you and your captives.
translation:
  language: sw
  text: Nanyi, pigeni kambi nje ya kambi kwa siku saba. Ninyi pamoja na mateka wenu, kila mmoja aliyemuua mtu au aliyegusa maiti ya mtu aliyeuawa, mjitakase siku ya tatu na siku ya saba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲנוּ
  choice: pigeni kambi
  rationale: Ni amri ya wingi kutoka חנה. Kauli hii ni ya kawaida katika Kiswahili na inafaa mazingira ya kijeshi.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Inaonyesha mahali kwa uwazi na kudumisha urudiaji wa neno ‘kambi’ uliopo katika Kiebrania.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kuonyesha muda unaoendelea.
- source_word: כֹּל הֹרֵג נֶפֶשׁ
  choice: kila mmoja aliyemuua mtu
  rationale: נֶפֶשׁ hapa humaanisha mtu, si ‘nafsi’ kwa maana ya kidhahania. Kitenzi kishirikishi kinaelekezwa kwa mauaji yaliyotokea vitani.
- source_word: וְכֹל נֹגֵעַ בֶּחָלָל
  choice: na kila mmoja aliyemgusa mtu aliyeuawa
  rationale: חָלָל humaanisha mtu aliyeuawa, na katika muktadha huu kuguswa kwake kunahusisha kugusa maiti. Tafsiri kuu inahifadhi rejeleo la mtu kama lilivyo katika Kiebrania.
- source_word: תִּתְחַטְּאוּ
  choice: lazima mjitakase
  rationale: Katika muktadha wa ibada, hitpaeli ya חטא humaanisha kujitakasa kutokana na unajisi. ‘Lazima’ huonyesha kwamba hili ni agizo, si utabiri tu.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: siku ya tatu na siku ya saba
  rationale: Inadumisha nyakati mahususi za utaratibu wa utakaso.
- source_word: אַתֶּם וּשְׁבִיכֶם
  choice: ninyi pamoja na mateka wenu
  rationale: שְׁבִי humaanisha watu waliotekwa vitani; ‘mateka’ ni sahihi zaidi kuliko ‘wafungwa’ katika mazingira haya.
theological_decisions:
- issue: Asili ya utakaso baada ya kuua au kugusa aliyeuawa
  choice: utakaso wa kiibada kutokana na unajisi unaohusiana na maiti
  alternative: utakaso wa kimaadili kutokana na hatia ya damu
  rationale: Kitenzi תתחטאו pamoja na kutajwa kwa siku ya tatu na ya saba kinaelekeza kwenye utaratibu wa kiibada wa kuondoa unajisi wa maiti. Tafsiri ‘mjitakase’ haiongezi dai lisilosemwa kuhusu msamaha wa hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri ni wazi kwa msomaji wa kawaida, huku urudiaji na vipengele vya utaratibu wa Kiebrania vikihifadhiwa.
