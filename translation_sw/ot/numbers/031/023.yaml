id: NUM.31.23
reference: Numbers 31:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כָּל דָּבָ֞ר אֲשֶׁר יָבֹ֣א בָ/אֵ֗שׁ תַּעֲבִ֤ירוּ בָ/אֵשׁ֙ וְ/טָהֵ֔ר אַ֕ךְ בְּ/מֵ֥י נִדָּ֖ה יִתְחַטָּ֑א וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יָבֹ֛א בָּ/אֵ֖שׁ תַּעֲבִ֥ירוּ בַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/023.yaml
  text: Everything that can go through the fire[a], you shall pass through the fire, and it shall be clean; only it must be purified with the water for impurity. But everything that cannot go through the fire, you shall pass through the water.
translation:
  language: sw
  text: Kila kitu kinachoweza kupitishwa motoni, mtakipitisha motoni, nacho kitakuwa safi. Ila ni lazima kitakaswe kwa maji ya kuondolea unajisi.[a] Lakini kila kitu kisichoweza kupitishwa motoni, mtakipitisha majini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maji ya unajisi”; kimapokeo, “kwa maji ya utengano” (ling. Hesabu 19).
    reason: Kirai cha Kiebrania בְּמֵי נִדָּה kinaweza kutafsiriwa kwa ukaribu zaidi na muundo wake kuwa “maji ya unajisi”; tafsiri ya kimapokeo huhifadhi wazo la utengano.
lexical_decisions:
- source_word: כָּל דָּבָר
  choice: Kila kitu
  rationale: Katika muktadha huu, kirai hiki kinahusu kila kifaa au kitu kilichotekwa; “kila kitu” ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya ujumla yenye mgawanyo.
- source_word: אֲשֶׁר יָבֹא בָאֵשׁ
  choice: kinachoweza kupitishwa motoni
  rationale: Muktadha unatofautisha vitu vinavyoweza kustahimili moto na vile visivyoweza; tafsiri ya kimodal inaeleza maana ya kiutendaji ya kirai.
- source_word: תַּעֲבִירוּ בָאֵשׁ
  choice: mtakipitisha motoni
  rationale: Hifili ya עבר ina maana ya kusababisha kitu kipite; “kupitisha motoni” huhifadhi tendo la ibada na ulinganifu na kupitisha majini.
- source_word: וְטָהֵר
  choice: nacho kitakuwa safi
  rationale: Kitenzi kinaonyesha hali inayotokana na kupitishwa motoni; “kitakuwa safi” huhifadhi maana hiyo bila kuichanganya na agizo linalofuata la utakaso.
- source_word: אַךְ
  choice: Hata hivyo
  rationale: Neno hili linaweka sharti muhimu linalorekebisha kauli iliyotangulia; “hata hivyo” huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: בְּמֵי נִדָּה
  choice: kwa maji ya kuondolea unajisi
  rationale: Kirai kinarejelea maji maalumu yaliyotumiwa katika utakaso kutoka unajisi wa kiibada (ling. Hesabu 19). “Ya kuondolea unajisi” huonyesha matumizi yake bila kudokeza kwamba maji yenyewe ni najisi.
- source_word: יִתְחַטָּא
  choice: ni lazima kitakaswe
  rationale: Katika sheria za kikuhani, hitpaeli ya חטא hueleza kufanyiwa utakaso kutoka unajisi, si kujisafisha kwa dhambi ya kimaadili. Muundo huu pia unaonyesha wajibu uliomo katika muktadha.
- source_word: וְכֹל אֲשֶׁר לֹא יָבֹא בָּאֵשׁ
  choice: Lakini kila kitu kisichoweza kupitishwa motoni
  rationale: “Lakini” huonyesha tofauti kati ya vitu vinavyostahimili moto na visivyostahimili; muundo huu ni wa kawaida na wazi kwa Kiswahili.
- source_word: תַּעֲבִירוּ בַמָּיִם
  choice: mtakipitisha majini
  rationale: Tafsiri hii huhifadhi kitenzi kilekile cha kisababishi na ulinganifu wa makusudi kati ya moto na maji.
theological_decisions:
- issue: Asili ya lugha ya utakaso katika sheria za kikuhani
  choice: Kutafsiri mstari kwa lugha ya usafi na unajisi wa kiibada.
  alternative: Kutumia lugha ya jumla ya kusafisha au kuhusianisha חטא hapa na msamaha wa dhambi ya kimaadili.
  rationale: Hesabu 31, kwa kuhusiana na Hesabu 19, inazungumzia utakaso wa vitu vilivyoguswa na unajisi. Mstari huu hauzungumzii kusamehewa hatia ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Motoni” na “majini” ni miundo ya kawaida na huhifadhi ulinganifu wa sentensi ya Kiebrania. Alama ya tanbihi [a] imewekwa baada ya kirai inachokifafanua.
