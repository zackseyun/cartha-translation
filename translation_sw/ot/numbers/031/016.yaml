  text: הֵ֣ן הֵ֜נָּה הָי֨וּ לִ/בְנֵ֤י יִשְׂרָאֵל֙ בִּ/דְבַ֣ר בִּלְעָ֔ם לִ/מְסָר מַ֥עַל בַּ/יהוָ֖ה עַל דְּבַר פְּע֑וֹר וַ/תְּהִ֥י הַ/מַּגֵּפָ֖ה בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/016.yaml
  text: Look[a], these women were the ones who, at Balaam’s word, caused the sons of Israel to act unfaithfully against Yahweh in the matter of Peor[b], and so the plague came upon the congregation of Yahweh.
translation:
  language: sw
  text: “Tazama, wanawake hawa ndio waliowafanya wana wa Israeli[b], kwa neno[a] la Balaamu, wakose uaminifu kwa Yahwe katika jambo la Peori; na hivyo pigo likatokea miongoni mwa kusanyiko la Yahwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa shauri la Balaamu” au “kwa ushauri wa Balaamu.” Kiebrania kinasema kihalisi, “kwa neno la Balaamu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wana wa Israeli”; hapa usemi huo unamaanisha watu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן הֵנָּה
  choice: Tazama, wanawake hawa ndio
  rationale: Muundo huu wa msisitizo una kiashirio cha wazi na kiwakilishi cha wingi wa kike. ‘Tazama’ huhifadhi nguvu ya הֵן, na ‘wanawake hawa ndio’ huweka wazi rejeleo la kike kutokana na muktadha.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania ‘wana wa Israeli’, ambao hapa unamaanisha watu wa Israeli kwa ujumla.
- source_word: בִּדְבַר בִּלְעָם
  choice: kwa neno la Balaamu
  rationale: דָּבָר kimsingi ni ‘neno’ au ‘jambo’; katika muktadha huu inaweza kumaanisha maelekezo au shauri la Balaamu. Tafsiri kuu huhifadhi upana huo, huku tanbihi ikitaja maana ya kimuktadha.
- source_word: לִמְסָר מַעַל
  choice: waliowafanya ... wakose uaminifu
  rationale: Muundo huu unaonyesha wanawake hao kuwa njia iliyowashawishi Waisraeli kutenda מַעַל, yaani kuvunja uaminifu wao wa agano. Kiswahili hiki ni cha kawaida na huhifadhi wazo la kusababisha bila kudai kulazimishwa.
- source_word: בַּיהוָה
  choice: kwa Yahwe
  rationale: Pamoja na מַעַל, kihusishi hiki humtaja yule ambaye uaminifu kwake ulivunjwa. ‘Kwa Yahwe’ ni Kiswahili cha kawaida katika usemi ‘kukosa uaminifu kwa’.
- source_word: עַל דְּבַר פְּעוֹר
  choice: katika jambo la Peori
  rationale: Hurejelea tukio au shauri lililohusiana na Peori bila kulipanua kuwa maelezo yasiyosemwa moja kwa moja katika mstari.
- source_word: וַתְּהִי הַמַּגֵּפָה
  choice: na hivyo pigo likatokea
  rationale: Mfuatano wa sentensi unaonyesha matokeo ya ukosefu huo wa uaminifu. ‘Na hivyo’ huonyesha uhusiano wa kimantiki bila kuufanya kuwa mkali kuliko maandishi.
- source_word: בַּעֲדַת יְהוָה
  choice: miongoni mwa kusanyiko la Yahwe
  rationale: עֵדָה ni kusanyiko au jumuiya ya watu; ב hapa linafaa kutafsiriwa ‘miongoni mwa’ kwa kuwa pigo lilitokea ndani ya jamii hiyo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la agano יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu lenye herufi nne moja kwa moja. ‘Yahwe’ hulitambulisha kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Kuweka wazi rejeleo la kike la הֵנָּה
  choice: wanawake hawa
  alternative: hawa; hawa ndio
  rationale: Kiwakilishi cha Kiebrania ni cha wingi wa kike, na muktadha unaonyesha kwamba kinawarejelea wanawake Wamidiani. Kuweka nomino wazi husaidia msomaji bila kuongeza dai jipya.
- issue: Nguvu ya kisababishi katika לִמְסָר
  choice: waliowafanya ... wakose uaminifu
  alternative: waliowaongoza ... wakose uaminifu; waliokuwa sababu ya ...
  rationale: Tafsiri hii inaonyesha ushawishi wa wanawake hao lakini haiamui kwamba wana wa Israeli hawakuwa na uwajibikaji wao wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio wa ‘kwa neno la Balaamu’ umewekwa karibu na tendo la kusababisha, huku alama za tanbihi zikiambatanishwa na maneno yanayofafanuliwa.
