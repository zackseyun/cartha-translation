id: NUM.31.52
reference: Numbers 31:52
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֣י כָּל זְהַ֣ב הַ/תְּרוּמָ֗ה אֲשֶׁ֤ר הֵרִ֨ימוּ֙ לַֽ/יהוָ֔ה שִׁשָּׁ֨ה עָשָׂ֥ר אֶ֛לֶף שְׁבַע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים שָׁ֑קֶל מֵ/אֵת֙ שָׂרֵ֣י הָֽ/אֲלָפִ֔ים וּ/מֵ/אֵ֖ת שָׂרֵ֥י הַ/מֵּאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/052.yaml
  text: And all the gold of the contribution that they presented to Yahweh was sixteen thousand seven hundred and fifty shekels[a], from the commanders of the thousands and from the commanders of the hundreds.
translation:
  language: sw
  text: Jumla ya dhahabu ya mchango walioutoa kwa Yahweh ilikuwa shekeli 16,750[a]. Dhahabu hiyo ilitoka kwa makamanda wa maelfu na makamanda wa mamia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shekeli ilikuwa kipimo cha uzito. Shekeli 16,750 ni karibu kilo 191, ingawa uzito halisi wa shekeli ulitofautiana.
    reason: historical_measurement
lexical_decisions:
- source_word: וַיְהִי כָּל זְהַב
  choice: Jumla ya dhahabu ... ilikuwa
  rationale: Muundo huu wa asili na wazi katika Kiswahili unaonyesha kiasi chote cha dhahabu huku ukihifadhi uhusiano wa kisimulizi wa וַיְהִי.
- source_word: הַתְּרוּמָה
  choice: mchango
  rationale: Neno hili linamaanisha kitu kilichotengwa na kutolewa kwa matumizi matakatifu; “mchango” linafaa katika muktadha wa mali iliyotolewa na linaeleweka kwa urahisi.
- source_word: אֲשֶׁר הֵרִימוּ
  choice: walioutoa
  rationale: Hiphil ya רום hapa inaeleza kutenga na kuwasilisha kitu kama toleo, si lazima kukiinua kihalisi.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Kihusishi ל kinaonyesha anayepokea au anayelengwa na utoaji, na jina la agano יְהוָה limeandikwa “Yahweh.”
- source_word: שִׁשָּׁה עָשָׂר אֶלֶף שְׁבַע מֵאוֹת וַחֲמִשִּׁים שָׁקֶל
  choice: shekeli 16,750
  rationale: Hiki ndicho kiasi cha moja kwa moja katika mpangilio wa kawaida wa Kiswahili; “shekeli” huhifadhi kipimo cha kale.
- source_word: מֵאֵת שָׂרֵי הָאֲלָפִים וּמֵאֵת שָׂרֵי הַמֵּאוֹת
  choice: ilitoka kwa makamanda wa maelfu na makamanda wa mamia
  rationale: מֵאֵת huonyesha chanzo, na שָׂרֵי katika muktadha huu wa kijeshi inafaa kutafsiriwa “makamanda”; “maelfu” na “mamia” yanahifadhi majina ya vikosi vya kijeshi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano, Tetragramatoni; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya kitendo cha הֵרִימוּ katika utoaji mtakatifu
  choice: walioutoa
  alternative: waliouinua; walioutoa kuwa sadaka
  rationale: Tafsiri hii inaonyesha kitendo cha kutenga na kumkabidhi Yahweh bila kulazimisha picha ya kuinua kitu kihalisi au kuongeza istilahi maalumu isiyosemwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili kuepuka muundo mzito na kuweka wazi kwamba dhahabu hiyo ilitoka kwa makundi yote mawili ya makamanda.
