base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/028.yaml
  text: 'And you shall levy a tribute for Yahweh from the men of war who went out to battle: one out of five hundred[b][a], from the people and from the cattle and from the donkeys and from the flock.'
translation:
  language: sw
  text: 'Nawe utamtenga Yahwe fungu la ushuru kutoka kwa wanaume waliokwenda vitani: mmoja katika kila mia tano, kutoka kwa wanadamu, ng’ombe, punda, na kondoo na mbuzi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲרֵמֹתָ
  choice: utatenga
  rationale: Hifili ya רום hapa ina maana ya kutoa au kutenga sehemu iliyokadiriwa; “utatenga” ni ya asili katika Kiswahili na inaonyesha kuwa sehemu hiyo inawekwa kando.
- source_word: מֶכֶס
  choice: kama ushuru
  rationale: Neno hili linamaanisha sehemu ya lazima iliyotozwa, hasa kutoka katika nyara; “ushuru” linafaa kuliko “kodi” katika muktadha huu.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahwe
  rationale: Kirai kinaonyesha kuwa ushuru huo umetengwa kuwa wa Yahwe; jina la agano יהוה limeandikwa “Yahwe.”
- source_word: מֵאֵת אַנְשֵׁי הַמִּלְחָמָה הַיֹּצְאִים לַצָּבָא
  choice: kutoka kwa wanaume wa vita waliokwenda vitani
  rationale: Tafsiri hii huhifadhi kundi la kiume lililoshiriki katika kampeni ya kijeshi na kutoa maana ya kirai kwa Kiswahili cha kawaida.
- source_word: אֶחָד נֶפֶשׁ מֵחֲמֵשׁ הַמֵּאוֹת
  choice: kiumbe hai kimoja kati ya kila mia tano
  rationale: נפש hapa ni neno la kuhesabia kiumbe hai mmoja au mmoja wa wanyama; “kiumbe hai” linaweza kuwahusu wanadamu na wanyama bila kuingiza maana ya kimetafizikia ya “roho.”
- source_word: מִן הָאָדָם
  choice: kutoka kwa wanadamu
  rationale: אָדָם hapa ni jamii ya wanadamu katika nyara, ikitofautishwa na aina za wanyama zinazofuata.
- source_word: וּמִן הַבָּקָר
  choice: ng’ombe
  rationale: בקר humaanisha ng’ombe au wanyama wa kundi la ng’ombe katika orodha ya mifugo.
- source_word: וּמִן הַחֲמֹרִים
  choice: punda
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa חמרים.
- source_word: וּמִן הַצֹּאן
  choice: makundi ya kondoo na mbuzi
  rationale: צאן ni jina la jumla la mifugo midogo, hasa kondoo na mbuzi; kuwataja wote wawili hufafanua upeo wake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo kama “BWANA.”
- issue: Maana ya נֶפֶשׁ katika hesabu ya wanadamu na wanyama
  choice: kiumbe hai kimoja
  alternative: nafsi moja
  rationale: Katika mstari huu נֶפֶשׁ linatumika kwa kila kiumbe kinachohesabiwa, awe mwanadamu au mnyama. Tafsiri haipaswi kulifanya liwe fundisho maalumu kuhusu sehemu isiyo ya mwili ya mwanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. “Makundi ya kondoo na mbuzi” linaweka wazi maana ya pamoja ya צאן, na “utatenga kama ushuru” linahifadhi wazo la sehemu ya lazima iliyowekwa kando.
