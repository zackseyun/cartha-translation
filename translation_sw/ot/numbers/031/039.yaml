base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/039.yaml
  text: The donkeys were 30,500[a], and their tribute to Yahweh was 61.
translation:
  language: sw
  text: Punda walikuwa 30,500, na fungu lao lililotozwa kwa ajili ya Yahweh lilikuwa 61.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: Punda walikuwa
  rationale: חֲמֹרִים ni wingi wa nomino ya kawaida ‘punda’; katika mfululizo huu wa hesabu, Kiswahili cha kawaida huhitaji kitenzi ‘walikuwa’ ili kutaja jumla kwa ufasaha.
- source_word: שְׁלֹשִׁים אֶלֶף וַ/חֲמֵשׁ מֵאוֹת
  choice: 30,500
  rationale: Mfuatano wa namba za Kiebrania unatoa jumla ya elfu thelathini na mia tano; tarakimu zinafaa kwa orodha ya takwimu.
- source_word: וּ/מִכְסָ/ם
  choice: sehemu yao iliyotengwa
  rationale: מֶכֶס hapa ni fungu lililokadiriwa na kutolewa kutoka nyara, si kodi ya kawaida; usemi huu unaeleweka kwa urahisi na unaonyesha kutengwa kwa fungu hilo.
- source_word: לַ/יהוָה
  choice: kwa ajili ya Yahweh
  rationale: Kiambishi ל- kinaonyesha kuwa fungu hilo lilikuwa la Yahweh au lilitolewa kwake; ‘kwa ajili ya’ ni usemi wa asili katika Kiswahili. Jina la agano יהוה limetafsiriwa ‘Yahweh’.
- source_word: אֶחָד וְ/שִׁשִּׁים
  choice: '61'
  rationale: Kiebrania kinataja idadi kamili ya sitini na moja; tarakimu zinadumisha mtindo wa hesabu wa muktadha.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi kulingana na orodha ya hesabu katika muktadha. Hakuna tanbihi iliyoongezwa kwa sababu ‘sehemu yao iliyotengwa’ inaeleza maana ya מֶכֶס bila kuhitaji istilahi yenye utata.
