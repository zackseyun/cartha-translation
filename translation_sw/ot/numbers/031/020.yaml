base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/020.yaml
  text: And every garment[a], and every article of leather, and every work of goats’ hair, and every article of wood, you shall purify.
translation:
  language: sw
  text: Na kila vazi, kila kitu cha ngozi, kila kitu kilichotengenezwa kwa manyoya ya mbuzi, na kila kitu cha mbao, mtakase.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina umbo la kujirejelea, ambalo linaweza kutafsiriwa, “mtajitakasa.” Hata hivyo, katika muktadha huu linaeleweka kuwa amri ya kutakasa vitu vilivyotajwa. Huu ni utakaso wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: vazi
  rationale: “Vazi” ni neno la kawaida na lenye hadhi linalomaanisha nguo au kitu cha kuvaliwa, na linafaa katika orodha hii.
- source_word: כְּלִי עוֹר
  choice: kitu cha ngozi
  rationale: כְּלִי linaweza kumaanisha chombo, kifaa, au kitu kwa upana. “Kitu cha ngozi” hakilazimishi maana finyu ya chombo cha kuwekea vitu na linaonyesha aina ya nyenzo.
- source_word: מַעֲשֵׂה עִזִּים
  choice: kitu kilichotengenezwa kwa manyoya ya mbuzi
  rationale: Kirai hiki kinamaanisha kazi au kitu kilichotengenezwa kwa mazao ya mbuzi; katika orodha ya nyenzo, manyoya ya mbuzi ndiyo maana inayowezekana zaidi kuliko ngozi ya mbuzi. Tafsiri hii ni wazi kwa msomaji wa sasa.
- source_word: כְּלִי עֵץ
  choice: kitu cha mbao
  rationale: Hii inahifadhi upana wa כְּלִי na uainishaji kwa nyenzo bila kukifinya kuwa chombo tu.
- source_word: תִּתְחַטָּאוּ
  choice: mtakitakasa
  rationale: Ingawa umbo la Kiebrania ni la kujirejelea, orodha ya vitu iliyotangulia na muktadha wa utakaso wa vitu baada ya vita vinaelekeza tendo kwa kila kitu kilichoorodheshwa. Umoja wa “-ki-” unarejelea kila kitu katika orodha. Tanbihi inahifadhi mvutano wa kisarufi wa Kiebrania.
theological_decisions:
- issue: Lugha ya utakaso wa kiibada katika mazingira ya vita na unajisi
  choice: Kutafsiri tendo kama kuvitakasa vitu vilivyoorodheshwa, huku tanbihi ikitaja umbo la kujirejelea la Kiebrania.
  alternative: mtajitakasa
  rationale: Muktadha unahusu utakaso wa kiibada baada ya kugusana na wafu, si wongofu wa kimaadili wala utakaso kutoka dhambini kwa maana ya mafundisho ya baadaye. Sintaksia na orodha ya vitu vinaunga mkono kuvitakasa, lakini umbo la kitenzi lenyewe linaacha mvutano unaopaswa kuonekana katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Muundo wa kurudia “kila” umehifadhiwa ili kuonyesha mpangilio wa orodha ya Kiebrania.
