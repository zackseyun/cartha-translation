  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מִ/מַּחֲצִ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל תִּקַּ֣ח אֶחָ֣ד אָחֻ֣ז מִן הַ/חֲמִשִּׁ֗ים מִן הָ/אָדָ֧ם מִן הַ/בָּקָ֛ר מִן הַ/חֲמֹרִ֥ים וּ/מִן הַ/צֹּ֖אן מִ/כָּל הַ/בְּהֵמָ֑ה וְ/נָתַתָּ֤ה אֹתָ/ם֙ לַ/לְוִיִּ֔ם שֹׁמְרֵ֕י מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן יְהוָֽה־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/030.yaml
  text: And from the half belonging to the sons of Israel you shall take one taken from every fifty[a], from the man, from the cattle, from the donkeys, and from the flock, from every kind of livestock[b]; and you shall give them to the Levites who keep charge of the tabernacle of Yahweh.
translation:
  language: sw
  text: Na kutoka katika nusu ya wana wa Israeli utatwaa mmoja katika kila hamsini[a], kutoka kwa watu, ng’ombe, punda, kondoo na mbuzi[b], na kutoka kwa kila aina ya wanyama wa kufugwa; nawe utawapa Walawi wanaosimamia Maskani ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “mmoja aliyetwaliwa kutoka katika kila hamsini.”
    reason: Inadumisha dhana ya hali ya kutendwa katika אָחֻז, huku maandishi makuu yakitumia usemi wa kawaida wa Kiswahili kwa uwiano wa 1:50.
  - marker: b
    text: Neno la Kiebrania ni jina la kijumla la mifugo midogo linaloweza kutia ndani kondoo na mbuzi.
    reason: Linafafanua upana wa maana ya צֹאן.
lexical_decisions:
- source_word: וּמִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: Na katika nusu ya wana wa Israeli
  rationale: Inahifadhi maana ya sehemu ya nusu iliyowekwa kwa wana wa Israeli na muundo wa Kiebrania בְּנֵי יִשְׂרָאֵל, huku ikisomeka kwa Kiswahili cha kawaida.
- source_word: אֶחָד אָחֻז מִן הַחֲמִשִּׁים
  choice: mmoja katika kila hamsini
  rationale: Huwasilisha kwa uwazi kiwango cha ushuru cha 1:50. Tanbihi inadumisha dhana ya אָחֻז ya kitu kilichotwaliwa au kuchukuliwa.
- source_word: מִן הָאָדָם
  choice: kutoka kwa wanadamu
  rationale: אָדָם hapa ni nomino ya umoja yenye maana ya jamii nzima ya binadamu katika orodha ya nyara; ‘wanadamu’ ni ya asili kuliko ‘mtu’ katika Kiswahili huku ikihifadhi maana hiyo ya kijumla.
- source_word: מִן הַבָּקָר מִן הַחֲמֹרִים
  choice: ng’ombe, punda
  rationale: Haya ni majina ya kawaida na ya moja kwa moja ya aina hizi za mifugo katika Kiswahili cha kisasa.
- source_word: וּמִן הַצֹּאן
  choice: kondoo na mbuzi
  rationale: צֹאן ni nomino ya kijumla inayoweza kujumuisha kondoo na mbuzi; kuyataja makundi yote mawili huepuka maana finyu ya ‘kondoo’ pekee.
- source_word: מִכָּל הַבְּהֵמָה
  choice: yaani, kutoka kwa wanyama wote wa kufugwa
  rationale: בְּהֵמָה hapa ni kundi pana la mifugo. ‘Yaani’ huonyesha kwamba kishazi hiki kinajumlisha aina zilizotangulia bila kukifanya kuwa aina nyingine tofauti.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן
  choice: wenye jukumu la kuitunza Maskani
  rationale: Huwasilisha wazo la kulinda na kutekeleza wajibu uliokabidhiwa kuhusu Maskani kwa Kiswahili cha asili na chenye hadhi.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni, jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa amri kwa Musa umehifadhiwa kwa ‘utatwaa’ na ‘utawapa’; ‘Maskani’ limetumika kwa מִשְׁכָּן kama istilahi ya ibada.
