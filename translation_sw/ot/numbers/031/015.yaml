  text: וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם מֹשֶׁ֑ה הַֽ/חִיִּיתֶ֖ם כָּל נְקֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/015.yaml
  text: Moses said to them[a], “Have you kept alive every female?”
translation:
  language: sw
  text: Musa akawaambia, “Je, mmemwacha hai kila mtu wa kike?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Je, mmemruhusu kila mtu wa kike aishi?”
    reason: Njia nyingine ya kutafsiri maana ya kisababishi ya הַחִיִּיתֶם.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Musa akawaambia
  rationale: Muundo huu ni wa kawaida katika masimulizi ya Kiswahili; kitenzi “akawaambia” kinajumuisha tendo la kusema na mwelekeo wa maneno kwa kundi hilo.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: הַחִיִּיתֶם
  choice: mmemwacha hai
  rationale: Kitenzi cha Kiebrania kina maana ya kisababishi, yaani kumwacha mtu aendelee kuishi au kumweka hai. Wakati timilifu unaendana na Musa kukagua kitendo kilichokwisha kufanywa.
- source_word: כָּל
  choice: kila
  rationale: Likifuatiwa na nomino ya umoja, neno hili linaonyesha ujumla unaomhusu mmoja mmoja.
- source_word: נְקֵבָה
  choice: mtu wa kike
  rationale: Neno la Kiebrania linahusu jinsia ya kike bila kuwekea umri maalumu. “Mtu wa kike” huhifadhi upana huo kuliko “mwanamke,” ambalo mara nyingi humaanisha mtu mzima.
theological_decisions:
- issue: Ufasiri wa נְקֵבָה katika muktadha wa vita na mauaji
  choice: mtu wa kike
  alternative: mwanamke; wanawake na wasichana
  rationale: Kifungu hakibainishi umri, kwa hiyo “mtu wa kike” huhifadhi upeo na ukali wa kauli ya Kiebrania bila kuupunguza kwa kuwalenga wanawake watu wazima pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Usemi “mtu wa kike” umetumiwa kimakusudi ili kuonyesha watu wa jinsia ya kike wa umri wowote, ingawa una sauti ya moja kwa moja na kali inayolingana na muktadha.
