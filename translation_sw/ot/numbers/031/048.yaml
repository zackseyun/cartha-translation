base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/048.yaml
  text: Then the officers who were over the thousands of the army[a], the commanders of thousands and the commanders of hundreds[b], came near to Moses.
translation:
  language: sw
  text: Kisha maofisa[a] waliokuwa wakisimamia maelfu ya jeshi, yaani makamanda wa maelfu na makamanda wa mamia, wakamkaribia Musa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “maofisa” linamaanisha watu waliowekwa kusimamia vitengo vya kijeshi; maneno yanayofuata yanawatambulisha kuwa makamanda wa maelfu na wa mamia.
    reason: cultural_note
  - marker: b
    text: Au “wakamjia Musa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: wakamkaribia
  rationale: Kitenzi קרב hapa kinaeleza kusogea kuelekea kwa mtu. “Wakamkaribia” ni Kiswahili cha kawaida kinachohifadhi mwendo huo na mtiririko wa simulizi.
- source_word: הַפְּקֻדִים
  choice: maofisa
  rationale: Umbo hili la פקד linawahusu watu waliowekwa kusimamia vitengo vya kijeshi. “Maofisa” linaeleza kazi yao kwa lugha ya sasa; vyeo vinatajwa wazi katika kishazi kinachofuata.
- source_word: אֲשֶׁר לְאַלְפֵי הַצָּבָא
  choice: waliokuwa wakisimamia maelfu ya jeshi
  rationale: Muktadha pamoja na maelezo yanayofuata unaonyesha uhusiano wa mamlaka juu ya vitengo vya jeshi; “wakisimamia” huufanya uhusiano huo ueleweke bila kubadili maana.
- source_word: אַלְפֵי
  choice: maelfu
  rationale: Ingawa אֶלֶף wakati mwingine inaweza kumaanisha ukoo au kikosi, muktadha wa kijeshi na ulinganifu na “mamia” unaunga mkono maana ya maelfu au vitengo vya elfu.
- source_word: הַצָּבָא
  choice: jeshi
  rationale: Neno צבא hapa linamaanisha nguvu ya kivita iliyopangwa. “Jeshi” ni neno la kawaida na wazi katika Kiswahili cha sasa.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: makamanda wa maelfu
  rationale: שׂר humaanisha kiongozi au mwenye cheo. Katika muktadha huu wa kijeshi, “makamanda” linafaa na kuhifadhi ngazi ya uongozi.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: na makamanda wa mamia
  rationale: Tafsiri hii inadumisha ulinganifu na “makamanda wa maelfu” pamoja na mpangilio wa ngazi za kijeshi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Maofisa” na “makamanda” ni maneno yanayoeleweka kwa urahisi katika muktadha wa kijeshi. Muundo wa “maelfu” na “mamia” umehifadhiwa ili kutatua kwa kiwango cha chini tu uwezekano wa maneno hayo kumaanisha idadi au vitengo vya kijeshi.
