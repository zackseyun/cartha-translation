  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה וְ/אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶת הַ/זָּהָ֔ב מֵ/אֵ֛ת שָׂרֵ֥י הָ/אֲלָפִ֖ים וְ/הַ/מֵּא֑וֹת וַ/יָּבִ֤אוּ אֹת/וֹ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד זִכָּר֥וֹן לִ/בְנֵֽי יִשְׂרָאֵ֖ל לִ/פְנֵ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/054.yaml
  text: So Moses and Eleazar the priest took the gold from the commanders of thousands and of hundreds[a], and they brought it into the tent of meeting as a memorial for the sons of Israel before Yahweh.
translation:
  language: sw
  text: Basi Musa na kuhani Eleazari wakaichukua ile dhahabu kutoka kwa makamanda wa maelfu na wa mamia, wakaileta ndani ya hema la kukutania iwe ukumbusho kwa wana wa Israeli[a] mbele za Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kinasema “wana wa Israeli,” jina la kawaida la watu wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: wakaichukua
  rationale: Kitenzi לקח kina maana ya ‘kuchukua.’ Umbo la wingi linafuata kiima ambatano ‘Musa na kuhani Eleazari’ na ni la kawaida katika Kiswahili.
- source_word: הַזָּהָב
  choice: ile dhahabu
  rationale: Kiwakilishi ‘ile’ kinaonyesha dhahabu maalumu iliyotajwa katika muktadha na kuakisi uamilifu wa kifungu cha Kiebrania.
- source_word: מֵאֵת
  choice: kutoka kwa
  rationale: Kirai hiki kinaonyesha chanzo, yaani dhahabu ilitoka kwa makamanda.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: makamanda wa maelfu na wa mamia
  rationale: Katika muktadha huu שׂרים ni viongozi wa kijeshi; ‘maelfu’ na ‘mamia’ ni vikosi vya kijeshi na kiutawala.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni jina la kawaida na linaloeleweka la mahali pa kukutana palipowekwa wakfu.
- source_word: זִכָּרוֹן
  choice: iwe ukumbusho
  rationale: Neno hili linadumisha maana ya kitu cha kukumbusha au cha kumbukumbu mbele za Mungu.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kwa wana wa Israeli
  rationale: Tafsiri hii inahifadhi muundo halisi wa usemi wa agano ‘wana wa Israeli’ bila kuufanya moja kwa moja kuwa ‘Waisraeli.’
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Kirai ‘mbele za’ kinaonyesha kuwapo mbele au katika uwepo wa Yahwe katika mazingira ya ibada.
- source_word: יְהוָה
  choice: Yahwe
  rationale: ‘Yahwe’ ni umbo la Kiswahili la jina binafsi la Mungu katika Tetragramatoni, badala ya kulibadilisha kuwa cheo kama ‘BWANA.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja; kulitafsiri ‘Yahwe’ huhifadhi jina hilo badala ya kuweka cheo mahali pake.
- issue: Uwasilishaji wa בני ישראל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Usemi wa Kiebrania ni wa kiume kisarufi na ni jina la kawaida la watu wa agano. Tafsiri rasmi inahifadhi ‘wana wa Israeli,’ huku tanbihi ikitoa usemi wa kawaida zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inafuata mtiririko wa simulizi la Kiebrania kwa vitenzi vinavyofuatana, huku ikitumia upatanisho wa kawaida wa Kiswahili kwa kiima ambatano.
