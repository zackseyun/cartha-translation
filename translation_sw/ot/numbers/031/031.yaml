  text: So Moses and Eleazar the priest did as Yahweh had commanded Moses[a].
translation:
  language: sw
  text: Basi Musa na kuhani Eleazari wakafanya kama Yahwe alivyomwamuru Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: wakafanya
  rationale: Kitenzi עשה hapa kinajumlisha utekelezaji wa agizo lililotangulia; “wakafanya kama” ni Kiswahili cha kawaida na huhifadhi maana ya kutii.
- source_word: מֹשֶׁה וְאֶלְעָזָר
  choice: Musa na ... Eleazari
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia; kiunganishi וְ kimetafsiriwa “na”.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Cheo hiki kinamtambulisha Eleazari; mpangilio “kuhani Eleazari” ni wa asili na wazi katika Kiswahili.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: Huonyesha kwamba walitenda sawasawa na agizo walilopewa.
- source_word: צִוָּה
  choice: alivyokuwa amemwamuru
  rationale: Muundo huu unaonyesha kwa kawaida kwamba amri ilitangulia utekelezaji, bila kuongeza maana mpya.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo; “Yahwe” ni umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: אֶת מֹשֶׁה
  choice: Musa
  rationale: אֶת ni kiashiria cha yambwa maalumu kisichohitaji neno tofauti katika Kiswahili.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi YHWH; kulitaja kama “Yahwe” huhifadhi jina hilo, huku tanbihi ikieleza desturi ya kulitafsiri kwa cheo “BWANA”.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Basi” linaunganisha tendo hili na maagizo yaliyotangulia; “kuhani Eleazari” huepuka muundo mzito bila kupoteza cheo chake.
