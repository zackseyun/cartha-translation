  text: But keep alive for yourselves every young girl among the women who has not known the bed of a man[a].
translation:
  language: sw
  text: Lakini kila msichana mdogo miongoni mwa wanawake ambaye hajawahi kulala na mwanamume, mweke hai kwa ajili yenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi, “ambaye hajawahi kujamiiana na mwanamume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Lakini kila
  rationale: וְ inaendeleza amri kwa kuilinganisha kwa ukinzani na amri iliyotangulia; katika muktadha huu “Lakini” huonyesha vizuri nguvu hiyo. כֹל pamoja na nomino ya mkusanyo imetafsiriwa kwa mgawanyo kama “kila.”
- source_word: הַטַּף
  choice: msichana mdogo
  rationale: טַף humaanisha watoto au wadogo. Ingawa neno lenyewe halitaji jinsia, vigezo vinavyofuata vinaweka wazi kuwa hapa linawahusu watoto wa kike au wasichana wachanga.
- source_word: בַּנָּשִׁים
  choice: miongoni mwa wanawake
  rationale: ב pamoja na נָשִׁים inaonyesha kundi ambamo wasichana hao wanapatikana; “miongoni mwa wanawake” huhifadhi maana hiyo ya sehemu ya kundi.
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: ambaye hajajua
  rationale: יָדַע hapa ni lugha ya staha inayohusu uzoefu wa kujamiiana. Umbo la Kiswahili la umoja linaendana na “kila msichana mdogo.”
- source_word: מִשְׁכַּב זָכָר
  choice: kulala na mwanamume
  rationale: Kirai hiki ni lugha ya staha ya Kiebrania kwa kujamiiana na mtu wa kiume. “Kulala na mwanamume” huhifadhi sitiari hiyo kwa Kiswahili cha kawaida bila kutumia lebo ya kiufundi kama “bikira.”
- source_word: הַחֲיוּ לָכֶם
  choice: msiue; wawekeni hai kwa ajili yenu
  rationale: Hifili ya חיה ina maana ya kuwaacha au kuwaweka hai. Kiswahili “msiue; wawekeni hai” kinaweka wazi nguvu ya amri katika muktadha, huku “kwa ajili yenu” ikihifadhi לָכֶם bila kubainisha matumizi yasiyotajwa na maandishi.
theological_decisions:
- issue: Iwapo lugha ya staha kuhusu tendo la ngono ifafanuliwe kabisa katika matini kuu
  choice: Kuhifadhi usemi wa staha “hajajua kulala na mwanamume” katika matini kuu.
  alternative: hajawahi kujamiiana na mwanamume
  rationale: Kiebrania kinatumia lugha ya staha badala ya lebo ya moja kwa moja kama “bikira.” Tafsiri hii huhifadhi namna ya usemi wa chanzo na maelezo ya wazi zaidi yanawekwa katika tanbihi.
- issue: Jinsi ya kuonyesha kuwa הַטַּף hapa inawahusu watoto wa kike
  choice: Kutafsiri “msichana mdogo.”
  alternative: mtoto mdogo
  rationale: Ingawa טַף peke yake si neno linalobainisha jinsia, muktadha wa “miongoni mwa wanawake” na kutomjua mwanamume unadhibiti rejeo kuwa la watoto wa kike au wasichana wachanga.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi wa staha wa chanzo umehifadhiwa katika matini kuu, huku tanbihi ikitoa maana iliyo wazi zaidi. Alama ya tanbihi [a] imewekwa baada ya sentensi inayohusika.
