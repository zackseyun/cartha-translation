base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/002.yaml
  text: Take vengeance for the sons of Israel on the Midianites[b][a]. Afterward you will be gathered to your people.
translation:
  language: sw
  text: “Lipiza kisasi cha Waisraeli dhidi ya Wamidiani.[a] Baada ya hayo, utakusanywa kwa watu wako.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walipizie Waisraeli kisasi dhidi ya Wamidiani.” Kiebrania kwa neno kwa neno ni, “Lipiza kisasi cha wana wa Israeli kutoka kwa/dhidi ya Wamidiani.”
    reason: lexical_alternative
  - marker: b
    text: “Utakusanywa kwa watu wako” ni nahau ya Kiebrania inayomaanisha kufa.
    reason: cultural_note
lexical_decisions:
- source_word: נְקֹם נִקְמַת
  choice: Lipiza kisasi
  rationale: Kitenzi cha amri katika nafsi ya pili umoja kinamwelekea Musa. Muundo wa Kiswahili ‘lipiza kisasi’ ni wa kawaida na wenye nguvu, huku ukikusanya kwa njia ya kiasili urudiaji wa mzizi mmoja katika Kiebrania.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Katika Kiswahili cha sasa, ‘Waisraeli’ ni namna ya kawaida, wazi na jumuishi ya kutaja watu wa Israeli; tafsiri ya neno kwa neno ‘wana wa Israeli’ ingesikika isiyo ya kawaida na ingeweza kueleweka kuwa wanaume pekee.
- source_word: מֵאֵת הַמִּדְיָנִים
  choice: dhidi ya Wamidiani
  rationale: Pamoja na kitenzi נקם, kirai hiki kinataja watu ambao kisasi kinaelekezwa kwao. ‘Dhidi ya’ ni wazi na cha kawaida katika Kiswahili.
- source_word: אַחַר
  choice: Baada ya hayo
  rationale: Huonyesha tukio litakalofuata baada ya amri kutekelezwa.
- source_word: תֵּאָסֵף אֶל עַמֶּיךָ
  choice: utakusanywa kwa watu wako
  rationale: Huhifadhi hali ya kutendwa na taswira ya Kiebrania badala ya kuifafanua moja kwa moja kuwa ‘utakufa.’ Tanbihi inaeleza maana ya nahau hiyo.
theological_decisions:
- issue: Nahau kuhusu kifo cha Musa kinachokaribia
  choice: utakusanywa kwa watu wako
  alternative: utakufa; utaenda kuungana na mababu zako
  rationale: Kuhifadhi nahau ya Kiebrania kunatunza taswira na mvutano wa kifungu bila kuingiza fundisho mahsusi zaidi kuhusu hali ya baada ya kifo. ‘Mababu’ pia ni finyu kuliko neno la Kiebrania ‘watu.’
- issue: Mwenye kisasi kinacholipizwa
  choice: kisasi cha Waisraeli dhidi ya Wamidiani
  alternative: Walipizie Waisraeli kisasi dhidi ya Wamidiani
  rationale: Muundo uliochaguliwa unafuata kwa karibu kirai cha Kiebrania ‘kisasi cha wana wa Israeli,’ huku tanbihi ikionyesha uwezekano wa kukieleza kwa muundo wa kimatendo zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Amri ya umoja kwa Musa imehifadhiwa, pamoja na nahau ya kifo ya Kiebrania.
