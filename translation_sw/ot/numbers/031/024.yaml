  yaml_path: translation/ot/numbers/031/024.yaml
  text: You shall wash your clothes on the seventh day[a], and you shall be clean[b]; afterward you may come into the camp.
translation:
  language: sw
  text: Siku ya saba mtaosha nguo zenu, nanyi mtakuwa safi[a]. Baada ya hapo mtaingia kambini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mtakuwa safi kiibada; pia inaweza kutafsiriwa “mtakuwa wametakaswa.”
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha huu inaweza kumaanisha “mtaweza kuingia kambini,” kwa kuwa kuingia kunaruhusiwa baada ya kukamilika kwa utakaso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִבַּסְתֶּם
  choice: mtaosha
  rationale: Kitenzi כבס katika kauli ya Piel humaanisha kuosha nguo au kitambaa. “Mtaosha” kinawasilisha agizo hili kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בִּגְדֵיכֶם
  choice: nguo zenu
  rationale: בגד humaanisha nguo au mavazi; “nguo zenu” ni usemi wa asili na unaoeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Siku ya saba
  rationale: Huu ni usemi wa kawaida wa wakati, na kuuweka mwanzoni kunaleta mtiririko wa asili wa Kiswahili bila kubadili maana.
- source_word: וּטְהַרְתֶּם
  choice: nanyi mtakuwa safi
  rationale: Kauli ya Qal ya טהר hapa inaeleza hali inayopatikana baada ya utaratibu wa utakaso. “Mtakuwa safi” huhifadhi maana ya hali ya usafi wa kiibada bila kuifanya moja kwa moja kuwa usafi wa kimaadili au wa rohoni.
- source_word: וְאַחַר
  choice: Baada ya hapo
  rationale: 'Usemi huu unaonyesha wazi mfuatano: kuingia kambini kunafuata baada ya kukamilika kwa utakaso.'
- source_word: תָּבֹאוּ אֶל הַמַּחֲנֶה
  choice: mtaingia kambini
  rationale: בוא אל inaweza kumaanisha kuja ndani au kuingia. “Mtaingia kambini” ni Kiswahili cha asili na kinabaki karibu na muundo wa Kiebrania; katika muktadha kinaweza pia kueleweka kuwa ruhusa ya kurudi kambini baada ya utakaso.
theological_decisions:
- issue: Lugha ya usafi wa kiibada
  choice: mtakuwa safi
  alternative: mtatakasika; jitakaseni
  rationale: Muktadha unahusu kuondolewa kwa unajisi wa kiibada baada ya vita. “Mtakuwa safi” huhifadhi lugha ya hali iliyopatikana na huepuka kuingiza bila lazima dhana za usafi wa kimaadili au utakaso wa rohoni.
- issue: Kuingia kambini baada ya utakaso
  choice: mtaingia kambini
  alternative: mtaweza kuingia kambini; mnaruhusiwa kuingia kambini
  rationale: Kiebrania chenyewe kinasema kwa namna ya moja kwa moja “mtaingia,” ingawa muktadha unaashiria kuwa kuingia kunaruhusiwa baada ya utakaso. Tafsiri kuu huhifadhi umbo hilo, na tanbihi inaeleza maana ya ruhusa inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zimetumiwa ili mfuatano wa tendo na matokeo uwe wazi. “Safi” imefafanuliwa katika tanbihi kuwa usafi wa kiibada, na si lazima usafi wa kimaadili.
