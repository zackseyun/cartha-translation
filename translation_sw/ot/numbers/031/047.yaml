review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the Israelite half, the one-in-fifty levy from people and livestock, its transfer to the Levites, and conformity to Yahwe's command. However, “mmoja” normally denotes a person in Swahili and is therefore too narrow where the Hebrew levy explicitly includes both people and livestock.
  naturalness: The narrative is clear and suitably formal. “Nusu iliyokuwa ya Waisraeli” is slightly more explicit and natural for the half allocated to Israel, and “kimoja” avoids implying that only a human individual was taken.
  terminology: “Waisraeli,” “Musa,” “Walawi,” “maskani,” and “Yahwe” are appropriate Standard East African Swahili biblical terminology. The footnote anchors are correctly placed after the relevant expressions.
  issues:
  - severity: medium
    issue: “mmoja kati ya kila hamsini” can refer specifically to a human individual.
    rationale: The phrase הָאָחֻז אֶחָד מִן־הַחֲמִשִּׁים governs both “from the people” and “from the livestock.” A non-human-specific Swahili expression is needed to retain this scope.
  revised_text: Kutoka katika nusu iliyokuwa ya Waisraeli[a], Musa alichukua kimoja katika kila hamsini[b] kutoka kwa watu na kutoka kwa mifugo, akawapa Walawi waliokuwa na jukumu la kuitunza maskani ya Yahwe, kama Yahwe alivyomwamuru Musa.
  revised_footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli”; yaani, Waisraeli.'
    reason: lexical_alternative
  - marker: b
    text: Au, “kimoja kilichochukuliwa katika kila hamsini.”
    reason: alternative_rendering
  revision_rationale: “Kimoja katika kila hamsini” preserves the one-in-fifty assessment while allowing the taken item to be either a person or an animal. The revised wording of the first phrase makes clear that this was the half belonging to the Israelites. No doctrinal interpretation has been added.
