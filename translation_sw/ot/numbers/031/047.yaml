id: NUM.31.47
reference: Numbers 31:47
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/מַּחֲצִ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הָֽ/אָחֻז֙ אֶחָ֣ד מִן הַ/חֲמִשִּׁ֔ים מִן הָ/אָדָ֖ם וּ/מִן הַ/בְּהֵמָ֑ה וַ/יִּתֵּ֨ן אֹתָ֜/ם לַ/לְוִיִּ֗ם שֹֽׁמְרֵי֙ מִשְׁמֶ֨רֶת֙ מִשְׁכַּ֣ן יְהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/047.yaml
  text: From the half belonging to the sons of Israel[a], Moses took one portion out of fifty, from the people and from the livestock, and gave them to the Levites who kept charge of the tabernacle of Yahweh[b], just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Kutoka katika nusu iliyokuwa ya Waisraeli[a], Musa alichukua kimoja katika kila hamsini[b] kutoka kwa watu na kutoka kwa mifugo, akawapa Walawi waliokuwa na jukumu la kuitunza maskani ya Yahwe, kama Yahwe alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli”; yaani, Waisraeli.'
    reason: lexical_alternative
  - marker: b
    text: Au, “kimoja kilichochukuliwa katika kila hamsini.”
    reason: alternative_rendering
lexical_decisions:
- source_word: מִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: Kutoka katika ile nusu ya Waisraeli
  rationale: Mַחֲצִית ni nusu iliyogawiwa Waisraeli katika mgawanyo wa nyara. “Waisraeli” ni Kiswahili cha kawaida na cha asili kwa usemi wa Kiebrania “wana wa Israeli,” ambao umeelezwa katika tanbihi.
- source_word: הָאָחֻז אֶחָד מִן הַחֲמִשִּׁים
  choice: mmoja kati ya kila hamsini
  rationale: Usemi huu unaonyesha ushuru wa mmoja kwa kila hamsini. Tafsiri hii ni wazi katika Kiswahili na inahifadhi idadi na uwiano wa Kiebrania.
- source_word: מִן הָאָדָם
  choice: kutoka kwa watu
  rationale: אָדָם hapa ni jina la jumla kwa wanadamu waliohesabiwa miongoni mwa nyara, si mwanamume mmoja.
- source_word: וּמִן הַבְּהֵמָה
  choice: na kutoka kwa mifugo
  rationale: בְּהֵמָה katika muktadha huu inahusu wanyama wanaofugwa kwa ujumla.
- source_word: וַיִּתֵּן אֹתָם
  choice: akawapa
  rationale: Kiambishi cha Kiebrania ni cha wingi na kinarejelea watu na mifugo waliochukuliwa kuwa sehemu hiyo.
- source_word: לַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la kikabila na kiutumishi linalotajwa.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן יְהוָה
  choice: waliokuwa na jukumu la kuitunza maskani ya Yahwe
  rationale: Kirai cha kitenzi na nomino za mzizi mmoja kinaonyesha wajibu wa kulinda, kutunza, na kusimamia maskani. Kiswahili hiki ni cha asili bila kupoteza maana ya dhamana yao.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa kama jina binafsi badala ya kubadilishwa kuwa cheo “Bwana”; “Yahwe” linafuata tahajia na matamshi ya kawaida ya Kiswahili.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: kama Yahwe alivyomwamuru Musa
  rationale: כַּאֲשֶׁר inaonyesha kwamba Musa alitenda sawasawa na amri iliyotangulia.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu. “Yahwe” huhifadhi jina hilo kwa umbo linalofaa tahajia ya Kiswahili badala ya kulibadilisha kuwa cheo.
- issue: Utoaji wa בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli, pamoja na tanbihi ya maana halisi
  alternative: wana wa Israeli
  rationale: “Waisraeli” ni usemi wa kawaida wa Kiswahili kwa jamii nzima, huku tanbihi ikihifadhi umbo halisi la Kiebrania bila kudokeza kwamba wanaume pekee ndio wanaokusudiwa.
- issue: Hali ya watu wanaotajwa miongoni mwa nyara
  choice: watu
  alternative: wanadamu / mtu
  rationale: אָדָם ni ya pamoja hapa. Tafsiri “watu” inahifadhi rejeo kwa wanadamu bila kuongeza ufafanuzi wa kitheolojia au wa kijamii ambao mstari wenyewe hautoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Maskani” imetumiwa kwa מִשְׁכָּן ili kudumisha istilahi ya kibiblia iliyozoeleka; muundo wa sentensi umewekwa wa asili bila kuficha uwiano wa mmoja kwa hamsini.
