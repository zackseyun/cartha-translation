  text: And they burned with fire all their cities in their dwelling places[b][a], and all their encampments.
translation:
  language: sw
  text: Nao wakachoma kwa moto miji yao yote katika makao yao[a], na kambi zao zote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miji yao yote mahali walipoishi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “maboma yao” au “vijiji vyao.” Neno la Kiebrania linaweza kumaanisha kambi, boma, au aina nyingine ya makazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵיהֶם
  choice: miji yao
  rationale: עִיר humaanisha mji au jiji; “miji” ni neno la kawaida na pana linalofaa katika muktadha huu wa maeneo ya watu.
- source_word: בְּמוֹשְׁבֹתָם
  choice: katika makazi yao
  rationale: מוֹשָׁב humaanisha mahali pa kuishi, makao, au makazi. “Katika makazi yao” inadumisha uhusiano wa mahali uliopo katika Kiebrania bila kuamua kwa hakika aina ya makazi.
- source_word: טִירֹתָם
  choice: kambi zao
  rationale: טִירָה linaweza kumaanisha kambi, boma, au makazi. “Kambi” hutofautisha maeneo haya na miji iliyotajwa kwanza, huku tanbihi ikihifadhi uwezekano mwingine wa maana.
- source_word: שָׂרְפוּ בָּאֵשׁ
  choice: wakaiteketeza kwa moto
  rationale: Kirai hiki kinaeleza kuteketeza kwa kutumia moto. “Kwa moto” huhifadhi wazi matumizi ya moto, na “wakaiteketeza” ni Kiswahili cha kawaida chenye nguvu inayolingana na tendo hilo.
- source_word: וְאֵת ... וְאֵת
  choice: '... yote ... pamoja na ... zote'
  rationale: Muundo huu unaonyesha jumla mbili zilizounganishwa. “Yote” na “zote” huhifadhi msisitizo wa כָּל kwa kila kundi, huku “pamoja na” ikiunganisha sentensi kwa Kiswahili cha asili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa urahisi. Mpangilio na marudio ya wazo la ‘yote/zote’ yanadumisha msisitizo wa Kiebrania, huku tanbihi zikihifadhi upana wa maana wa maneno ya makazi.
