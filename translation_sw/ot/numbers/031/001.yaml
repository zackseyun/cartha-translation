lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akasema
  rationale: Waw inayofuatwa na kitenzi דּבר inaendeleza simulizi kwa mfuatano. “Kisha” huonyesha mfuatano huo kwa Kiswahili cha kawaida, na “akasema na” ni usemi wa asili wa kumtaja anayeelekezewa maneno.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti YHWH limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֶל
  choice: na
  rationale: Katika muundo wa Kiswahili “akasema na Musa,” kihusishi “na” humtaja kwa kawaida mtu aliyeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ndiyo namna sanifu ya Kiswahili ya jina hili.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Katika fomula hii inayotanguliza maneno ya moja kwa moja, alama ya nukta mbili hutekeleza kazi ya “akisema” kwa Kiswahili cha sasa bila kurudia kitenzi kisivyo cha lazima; ujumbe wenyewe unafuata katika mstari unaofuata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina binafsi YHWH. “Yahwe” hulihifadhi kama jina badala ya kuliwakilisha kwa cheo, huku tanbihi ikitaja mapokeo mengine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na wa asili, nao unahifadhi mfuatano wa simulizi na jina binafsi la Mungu.
