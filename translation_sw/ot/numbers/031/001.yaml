  text: 'Kisha Yahwe[a] alinena na Musa, akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa mapokeo hutafsiriwa “BWANA.” Tahajia nyingine ni “Yahweh”; jina hili pia hutolewa “Yehova.”'
