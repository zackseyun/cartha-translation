base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/006.yaml
  text: So Moses sent them to the war[a], a thousand from each tribe, them and Phinehas son of Eleazar the priest, to the war[b], with the holy vessels and the trumpets for the battle cry in his hand.
translation:
  language: sw
  text: Basi Musa akawatuma vitani, watu elfu moja kutoka kila kabila, hao pamoja na Finehasi mwana wa Eleazari, kuhani, akiwa na vyombo vitakatifu[a] na tarumbeta za ishara[b] mkononi mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vyombo vya mahali patakatifu” au “vifaa vitakatifu.”
    reason: lexical_alternative
  - marker: b
    text: Au “tarumbeta za kutoa ishara” au “tarumbeta za tahadhari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akawatuma
  rationale: Kitenzi hiki ni simulizi la kawaida la kumtuma mtu; kiambishi cha yambwa kinaonyesha wale watu waliotajwa katika muktadha.
- source_word: אֶלֶף לַמַּטֶּה
  choice: watu elfu moja kutoka kila kabila
  rationale: Huwasilisha maana ya mgawanyo, yaani kila kabila lilitoa watu elfu moja, kwa Kiswahili cha kawaida.
- source_word: לַצָּבָא
  choice: vitani
  rationale: Katika muktadha huu neno linaelekea kumaanisha shughuli ya vita au kwenda kupigana, si jeshi kama taasisi.
- source_word: אֹתָם ... אֹתָם
  choice: wao pamoja na
  rationale: Kiwakilishi cha pili kimeonyeshwa kwa 'wao' ili kuhifadhi msisitizo na muundo wa kiambatisho wa Kiebrania bila kufanya Kiswahili kiwe kizito kupita kiasi.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Finehasi mwana wa Eleazari kuhani
  rationale: Majina yameandikwa kwa namna iliyozoeleka katika Kiswahili cha Biblia, na kirai cha cheo kimeachwa bila kuongeza ufafanuzi ambao haupo katika chanzo.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: vyombo vitakatifu
  rationale: Huhifadhi kwa ufupi maana ya vitu au vyombo vinavyohusiana na utakatifu; uwezekano wa kumaanisha vyombo vya patakatifu umehifadhiwa katika tanbihi.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: tarumbeta za kutoa ishara ya vita
  rationale: Katika mazingira ya msafara wa kijeshi, teruah ni mlio au ishara yenye kazi ya kijeshi; tafsiri hii ni wazi bila kuifanya iwe kilio cha maneno.
- source_word: בְּיָדוֹ
  choice: Finehasi alikuwa amebeba
  rationale: Umoja wa kiwakilishi unaelekea kwa Finehasi, jina la karibu zaidi katika umoja. Kiswahili hiki kinawasilisha umilikaji au uwekaji chini ya dhamana yake kwa njia ya kawaida kuliko usemi mzito wa 'katika mkono wake'.
theological_decisions:
- issue: Jukumu la Finehasi na vitu vitakatifu katika msafara wa kijeshi
  choice: Finehasi anaandamana na wapiganaji akiwa na vyombo vitakatifu na tarumbeta za ishara ya vita.
  alternative: Finehasi alikuwa mtazamaji tu, au vyombo hivyo havikuwa na uhusiano wowote na huduma yake ya kikuhani.
  rationale: Aya yenyewe inamhusisha Finehasi, kuhani, pamoja na vyombo vitakatifu na tarumbeta katika msafara huo. Tafsiri inadumisha uhusiano huo bila kuongeza mafundisho kuhusu vita vitakatifu ambayo hayajasemwa wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi ya pili imewekwa wazi ili kiwakilishi cha umoja katika Kiebrania kirejelee Finehasi bila utata. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
