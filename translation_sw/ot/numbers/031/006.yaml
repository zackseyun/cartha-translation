  to: Basi Musa akawatuma vitani, watu elfu moja kutoka kila kabila, hao pamoja na Finehasi mwana wa Eleazari, kuhani, akiwa na vyombo vitakatifu[a] na tarumbeta za ishara[b] mkononi mwake.
