    rationale: Muktadha wa vita unaunga mkono ishara ya kijeshi, lakini neno lenyewe linaweza kuwa mlio wa ishara au wa tahadhari. Tafsiri kuu isiyo finyu zaidi na tanbihi huhifadhi wigo huo.
