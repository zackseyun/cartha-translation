  naturalness: Kiswahili ni cha kawaida na cha heshima. Muundo mmoja wa sentensi wenye kirai ‘akiwa na ... mkononi mwake’ unasikika kwa kawaida huku ukifuata uhusiano wa maandishi ya chanzo kwa ukaribu zaidi.
  terminology: “Musa,” “Finehasi,” “Eleazari,” “kuhani,” na “vyombo vitakatifu” zinafaa kwa Kiswahili Sanifu cha Afrika Mashariki. “Tarumbeta za ishara” huepuka kuingiza ‘vita’ katika maana ya teru‘ah, ingawa muktadha ni wa kijeshi; tanbihi huhifadhi mbadala wa ishara ya vita/tahadhari.
