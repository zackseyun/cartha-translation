lexical_decisions:
- source_word: וּ/מִֽ/מַּחֲצִית
  choice: Na kutoka katika nusu
  rationale: Viambishi vya kiunganishi na kihusishi vimewakilishwa; “nusu” ni ya kawaida na sahihi katika muktadha wa kugawa nyara.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ya wana wa Israeli
  rationale: Huhifadhi kwa uwazi usemi wa Kiebrania wenye maana ya “wana wa Israeli” na kuonyesha kuwa nusu hiyo ilikuwa yao.
- source_word: אֲשֶׁר
  choice: ambayo
  rationale: Kiwakilishi hiki cha uhusiano kinarejelea “nusu” kwa Kiswahili sanifu.
- source_word: חָצָה
  choice: alikuwa ameitenga
  rationale: Katika muktadha wa kugawa nyara katika mafungu mawili, kitenzi kinaonyesha kuitenga nusu moja na nyingine; umbo la wakati uliotangulia linafaa katika sentensi hii.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: מִן הָאֲנָשִׁים
  choice: na ile ya wanaume
  rationale: “Wanaume” huhifadhi maana ya אֲנָשִׁים katika muktadha wa wapiganaji; “ile ya” huweka wazi kwa Kiswahili kwamba nusu ya Waisraeli ilitengwa na nusu ya wanaume hao.
- source_word: הַצֹּבְאִים
  choice: waliotumika jeshini
  rationale: Hutoa maana ya kushiriki katika utumishi wa kijeshi kwa lugha ya sasa bila kuibana kwa tukio moja tu la kupigana.
