  text: And from the half belonging to the sons of Israel[a], which Moses had separated from the men who served in the army—
translation:
  language: sw
  text: Na kutoka katika nusu ya wana wa Israeli, ambayo Musa alikuwa ameitenga kutoka kwa wanaume waliokwenda vitani[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa kwenye kampeni” / “waliotumika jeshini.”
