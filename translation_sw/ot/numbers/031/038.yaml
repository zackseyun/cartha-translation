  text: And the cattle were thirty-six thousand, and their tribute for the LORD was seventy-two.
translation:
  language: sw
  text: Na ng’ombe walikuwa elfu thelathini na sita, na ushuru wao kwa Yahweh ulikuwa sabini na wawili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּקָר
  choice: ng’ombe
  rationale: בָּקָר ni jina la jumla la mifugo ya jamii ya ng’ombe; katika orodha hii ya nyara, “ng’ombe” ni tafsiri ya kawaida na wazi katika Kiswahili.
- source_word: שִׁשָּׁה וּשְׁלֹשִׁים אָלֶף
  choice: elfu thelathini na sita
  rationale: Mpangilio wa namba wa Kiebrania unabadilishwa kuwa mpangilio wa kawaida wa Kiswahili bila kubadili maana.
- source_word: מִכְסָם
  choice: sehemu yao iliyotolewa
  rationale: מֶכֶס hapa ni sehemu iliyotozwa au kutengwa kutoka katika nyara. Kauli hii inaeleza maana hiyo kwa Kiswahili cha kawaida bila kuifanya ionekane kama kodi ya kawaida ya fedha.
- source_word: לַיהוָה
  choice: kwa YAHWE
  rationale: Kiambishi ל־ kinaonyesha sehemu iliyotengwa kwa ajili ya YHWH; “kwa” ni ya asili katika muktadha huu, na jina la agano linawakilishwa moja kwa moja kama YAHWE.
- source_word: שְׁנַיִם וְשִׁבְעִים
  choice: sabini na wawili
  rationale: Huu ndio mpangilio wa kawaida wa namba hiyo katika Kiswahili.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: YAHWE
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina la Mungu יהוה moja kwa moja. “YAHWE” hulihifadhi kama jina maalumu badala ya kulibadilisha kuwa cheo; herufi kubwa zinasaidia kulitofautisha na cheo “Bwana” katika matumizi ya Biblia ya Kiswahili.
- issue: Maana ya מִכְסָם katika mgao wa nyara
  choice: sehemu yao iliyotolewa kwa YAHWE
  alternative: ushuru wao kwa YAHWE
  rationale: Neno linaweza kutafsiriwa “ushuru,” lakini hapa linamaanisha mgao uliotengwa kutoka kwa nyara kama wa YHWH. Tafsiri iliyochaguliwa huepuka kuingiza dhana finyu ya kodi ya kawaida huku ikihifadhi wazo la sehemu inayodaiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi muundo wa kuorodhesha wa muktadha, lakini imetumia mpangilio wa namba ulio wa kawaida katika Kiswahili. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zilizohitajika.
