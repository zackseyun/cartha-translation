base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/041.yaml
  text: And Moses gave the tribute[a], the contribution for Yahweh, to Eleazar the priest[b], just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Musa akampa Eleazari, kuhani, lile fungu la ushuru[a], yaani, mchango uliotengwa kwa Yahweh[b], kama vile Yahweh alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tozo” au “kodi”; ni fungu lililokadiriwa na kuchukuliwa kutoka katika nyara.
    reason: lexical_alternative
  - marker: b
    text: Au “toleo la Yahweh”; kwa tafsiri ya mapokeo, “sadaka ya kuinuliwa ya Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akampa
  rationale: Kitenzi נתן katika mfululizo wa simulizi kinaonyesha tendo lililokamilika; “akampa” ni ya kawaida na pia humtaja mpokeaji kwa kiambishi -m-.
- source_word: מֶכֶס
  choice: fungu la ushuru
  rationale: Katika muktadha wa nyara za vita, neno hili ni sehemu iliyokadiriwa na kutengwa kama ushuru. “Fungu la ushuru” huepuka kulifanya lisikike kama kodi ya kawaida ya kisasa.
- source_word: תְּרוּמַת יְהוָה
  choice: mchango kwa ajili ya Yahweh
  rationale: תְּרוּמָה ni mchango au toleo lililotengwa kwa matumizi matakatifu. Kauli hii inaonyesha kwamba fungu hilo lilitengwa kwa Yahweh bila kulazimisha maana maalumu ya ibada ya kuinua sadaka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: akampa Eleazari kuhani
  rationale: Muundo huu unawasilisha kwa kawaida mpokeaji, Eleazari, pamoja na wadhifa wake wa kuhani.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: kama vile Yahweh alivyomwamuru Musa
  rationale: “Kama vile” huonyesha kwamba tendo la Musa lililingana na agizo la awali la Yahweh.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia jina la Mungu lenyewe, si cheo; “Yahweh” hulihifadhi kama jina binafsi.
- issue: Maana ya תְּרוּמַת יְהוָה
  choice: mchango kwa ajili ya Yahweh
  alternative: toleo la Yahweh
  rationale: Muundo wa Kiebrania unaweza kueleweka kuwa mchango uliotengwa kwa Yahweh au toleo linalohusishwa naye. Tafsiri kuu inaweka wazi kusudi katika muktadha, huku tanbihi ikihifadhi namna nyingine ya kueleza muundo huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. “Fungu la ushuru” linafafanua dhana ya sehemu ya nyara iliyotozwa, na “mchango kwa ajili ya Yahweh” ni ya kawaida kuliko istilahi ya kiibada ya mapokeo.
