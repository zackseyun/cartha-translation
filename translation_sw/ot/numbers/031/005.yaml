lexical_decisions:
- source_word: וַיִּמָּסְרוּ
  choice: waliwekwa
  rationale: Kauli ya kutendwa ya Kiebrania inaonyesha kwamba watu hao walitolewa au walipangwa kwa ajili ya huduma ya kijeshi. “Waliwekwa” ni ya asili katika Kiswahili na haibani maana kuwa kuhesabiwa pekee.
- source_word: מֵאַלְפֵי יִשְׂרָאֵל
  choice: kutoka katika maelfu ya Israeli
  rationale: “Maelfu” huhifadhi maana ya moja kwa moja, huku tanbihi ikieleza kwamba neno hilo pia linaweza kumaanisha koo kubwa au vikosi vya Israeli.
- source_word: אֶלֶף לַמַּטֶּה
  choice: elfu moja kutoka kila kabila
  rationale: Katika muktadha huu, kihusishi kina maana ya mgao kwa kila kabila; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: שְׁנֵים עָשָׂר אֶלֶף
  choice: jumla ya watu elfu kumi na mbili
  rationale: Hii inaonyesha wazi kwamba idadi hiyo ni jumla ya watu waliotolewa na makabila yote.
- source_word: חֲלוּצֵי צָבָא
  choice: watu ... waliokuwa wamejiandaa kwa vita
  rationale: Neno linaeleza watu waliokuwa wameandaliwa, wamewekewa silaha, au tayari kwenda vitani. Chaguo hili ni la asili na huhifadhi upana huo.
