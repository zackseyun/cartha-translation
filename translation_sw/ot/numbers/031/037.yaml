base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/037.yaml
  text: And the tribute for Yahweh from the flock was six hundred seventy-five.
translation:
  language: sw
  text: Na ushuru kwa ajili ya Yahweh kutoka katika kundi ulikuwa mia sita sabini na tano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ulikuwa
  rationale: Katika mfululizo huu wa masimulizi, umbo hili la היה ni kiunganishi cha kawaida kinachotaja kiasi; ‘ulikuwa’ ni Kiswahili cha asili na wazi.
- source_word: הַמֶּכֶס
  choice: ushuru
  rationale: מֶכֶס hapa ni sehemu iliyotozwa katika nyara za vita na kutengwa kwa kusudi maalumu. ‘Ushuru’ huwasilisha wazo la sehemu inayodaiwa bila kuifanya kuwa kodi ya kisasa.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahweh
  rationale: Kihusishi ל kinaonyesha kwamba sehemu hiyo ilitengwa kwa Yahweh; ‘kwa ajili ya’ linaeleza kusudi au kuwekwa wakfu kwake kwa kawaida katika Kiswahili.
- source_word: יהוה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa kwa ‘Yahweh,’ likihifadhi jina la pekee lililo katika matini ya Kiebrania.
- source_word: מִן הַצֹּאן
  choice: kutoka katika kundi
  rationale: צֹאן ni jina la jumla la mifugo midogo, hasa kondoo na mbuzi. ‘Kundi’ linadumisha ujumla huo bila kulibana kuwa kondoo pekee.
- source_word: שֵׁשׁ מֵאוֹת חָמֵשׁ וְשִׁבְעִים
  choice: mia sita sabini na tano
  rationale: Hii ndiyo jumla kamili ya 675 kwa mpangilio wa kawaida wa nambari katika Kiswahili.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini inatumia moja kwa moja Tetragramatoni יהוה. ‘Yahweh’ huhifadhi jina la agano badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. Muundo umehifadhi uhusiano wa mstari huu na orodha inayotangulia, huku ‘kundi’ likiacha צֹאן ikiwa neno la jumla.
