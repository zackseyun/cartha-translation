  yaml_path: translation/ot/numbers/031/040.yaml
  text: And the persons of mankind were sixteen thousand, and their tribute for Yahweh was thirty-two persons.
translation:
  language: sw
  text: Na watu[a] walikuwa elfu kumi na sita, na sehemu yao ya ushuru[b] kwa Yahweh ilikuwa watu thelathini na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nafsi za mwanadamu”; hapa maana yake ni watu wanaohesabiwa mmoja mmoja.'
    reason: lexical_alternative
  - marker: b
    text: Au “utozo wao.” Neno la Kiebrania linamaanisha sehemu ya nyara iliyokadiriwa na kutengwa kwa ajili ya Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: watu
  rationale: Katika orodha hii, kirai hiki kinahesabu wanadamu mmoja mmoja kwa kuwatofautisha na wanyama. “Watu” ni Kiswahili cha kawaida na wazi, bila kuingiza maana ya kimetafizikia ya “roho.”
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: elfu kumi na sita
  rationale: Hii ndiyo namna ya kawaida ya kutaja idadi 16,000 kwa Kiswahili.
- source_word: מִכְסָם
  choice: ushuru wao
  rationale: Neno hili linamaanisha sehemu iliyokadiriwa na kutengwa kutoka katika nyara. “Ushuru wao” linafaa katika muktadha huu wa mgao uliotolewa kwa Yahweh.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahweh
  rationale: Kihusishi kinaonyesha kwamba sehemu hiyo ilitengwa na kupewa Yahweh; “kwa ajili ya” huonyesha wazi kusudi la mgao huo.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים נָפֶשׁ
  choice: watu thelathini na wawili
  rationale: נֶפֶשׁ limetumiwa tena kama neno la kuhesabia wanadamu mmoja mmoja; “watu” hudumisha uwazi na ulinganifu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Jinsi ya kutafsiri נֶפֶשׁ אָדָם katika orodha ya wanadamu na wanyama
  choice: watu
  alternative: nafsi za wanadamu
  rationale: Kirai hiki kinataja wanadamu kama kundi tofauti na wanyama na kinahesabu watu mmoja mmoja. “Watu” huhifadhi maana inayokusudiwa bila kudokeza fundisho maalumu kuhusu muundo wa mwanadamu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku marudio ya “watu” yakihifadhi mtindo wa orodha ya Kiebrania.
