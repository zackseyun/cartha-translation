base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/036.yaml
  text: And the half[a], the portion of those who went out to war, was in number 337,500 sheep.
translation:
  language: sw
  text: Na ile nusu[a], fungu la wale waliokwenda vitani, idadi ya kondoo ilikuwa 337,500.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ya wale waliokwenda vitani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: ilikuwa na
  rationale: Katika muktadha huu kitenzi kinaeleza jumla iliyopatikana. Muundo “ilikuwa na” unasomeka kwa kawaida katika Kiswahili unaposema idadi ya wanyama waliomo katika fungu.
- source_word: הַמֶּחֱצָה
  choice: ile nusu
  rationale: Neno hili linarejelea moja ya nusu mbili za nyara zilizogawanywa katika muktadha unaotangulia; “ile nusu” inadumisha uhusiano huo wazi.
- source_word: חֵלֶק
  choice: sehemu ya
  rationale: Neno hili linafafanua kwa mkabala nusu inayokusudiwa, yaani sehemu iliyowahusu waliokwenda vitani. “Sehemu ya” ni rasmi kiasi bila kuwa ngumu.
- source_word: הַיֹּצְאִים בַּצָּבָא
  choice: wale waliokwenda vitani
  rationale: Kirai hiki kihalisi kinawahusu waliotoka katika jeshi au kampeni. “Waliokwenda vitani” ni Kiswahili cha kawaida kinachoeleza wazi kwamba ni wapiganaji bila kuongeza cheo maalumu.
- source_word: מִסְפַּר הַצֹּאן
  choice: kondoo 337,500
  rationale: Muktadha unahesabu kondoo, na muundo wa Kiswahili “ilikuwa na kondoo [idadi]” unawasilisha jumla kwa ufupi na kwa uwazi.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 337,500
  rationale: Hesabu ya Kiebrania ni 300,000 + 30,000 + 7,000 + 500. Tarakimu hurahisisha usomaji huku zikihifadhi idadi kamili.
