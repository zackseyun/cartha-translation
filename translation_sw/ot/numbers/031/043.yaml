base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/043.yaml
  text: And the half belonging to the congregation, from the flock, was 337,500.
translation:
  language: sw
  text: Na fungu la jumuiya, nusu ya kundi la kondoo na mbuzi, lilikuwa 337,500.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: ilikuwa
  rationale: Katika taarifa hii ya hesabu, kitenzi hiki kinaonyesha jumla iliyopatikana; “ilikuwa” ni cha kawaida na hakiongezi ufafanuzi usio katika maandishi.
- source_word: מֶחֱצַת הָעֵדָה
  choice: nusu iliyokuwa ya jumuiya
  rationale: Muundo huu unaonyesha ile nusu iliyokuwa sehemu ya jumuiya. Usemi huu huepuka kueleweka kana kwamba nusu ya watu wa jumuiya ndiyo inayozungumziwa.
- source_word: הָעֵדָה
  choice: jumuiya
  rationale: Neno hili humaanisha jamii ya Israeli kwa pamoja; “jumuiya” ni Kiswahili cha sasa, chenye heshima, bila kudokeza taasisi ya kidini ya baadaye.
- source_word: מִן הַצֹּאן
  choice: kutoka katika kundi la kondoo na mbuzi
  rationale: צֹאן ni jina la jumla la mifugo midogo, hasa kondoo na mbuzi. Kutaja wanyama hao huhifadhi upana wa neno la Kiebrania kuliko kutumia “kondoo” peke yake.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 337,500
  rationale: Mfuatano wa namba za Kiebrania ni 300,000 + 30,000 + 7,000 + 500. Tarakimu hurahisisha kusoma orodha hii huku zikihifadhi idadi kamili.
theological_decisions: []
