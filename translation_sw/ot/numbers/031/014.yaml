base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/014.yaml
  text: And Moses was angry with the officers of the army[a], the commanders of thousands and the commanders of hundreds, who were coming from the service of the war.
translation:
  language: sw
  text: Musa akawakasirikia maafisa wa jeshi, yaani makamanda wa maelfu na makamanda wa mamia, waliokuwa wakija kutoka katika utumishi wa vita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika jeshi la vita.” Maneno ya Kiebrania yanaunganisha dhana za jeshi au utumishi wa kijeshi na vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: akawakasirikia
  rationale: Kitenzi קצף kinaonyesha hasira iliyoelekezwa kwa watu fulani. “Akawakasirikia” ni Kiswahili cha kawaida na kinaonyesha wazi kwamba Musa aliwakasirikia maafisa hao bila kuzidisha kuwa alighadhabika sana.
- source_word: פְּקוּדֵי הֶחָיִל
  choice: maafisa wa jeshi
  rationale: פְּקוּדֵי hapa ni watu waliowekwa katika mamlaka ndani ya kikosi cha kijeshi. “Maafisa wa jeshi” huwasilisha kwa uwazi maana hiyo ya kiutawala na kijeshi.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: makamanda wa maelfu
  rationale: שָׂרֵי ni viongozi wenye mamlaka; katika muktadha wa kijeshi, “makamanda” ni neno la kisasa na wazi. “Wa maelfu” huhifadhi mpangilio wa kijeshi unaotajwa katika Kiebrania.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: na makamanda wa mamia
  rationale: Tafsiri hii inadumisha ulinganifu na “makamanda wa maelfu” na kuhifadhi mgawanyo wa kijeshi wa maandishi ya Kiebrania.
- source_word: הַבָּאִים
  choice: waliokuwa wakija
  rationale: Umbo la participle linaonyesha tendo linaloendelea au linalowatambulisha watu hao. “Waliokuwa wakija” hulihifadhi bila kuongeza dhana ya “kurudi,” ambayo haimo wazi katika kitenzi chenyewe.
- source_word: מִצְּבָא הַמִּלְחָמָה
  choice: kutoka katika utumishi wa vita
  rationale: צָבָא inaweza kumaanisha jeshi, shughuli au utumishi wa kijeshi. Pamoja na הַמִּלְחָמָה, “utumishi wa vita” huhifadhi mkusanyiko huo wa maana kuliko kuubana kuwa “uwanja wa vita” au “kampeni” pekee.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisasa na wenye heshima. “Yaani” hufafanua kwamba makamanda wa maelfu na wa mamia ndio maafisa wa jeshi waliotajwa, huku sentensi ikihifadhi muundo na utata halisi wa usemi wa kijeshi wa Kiebrania.
