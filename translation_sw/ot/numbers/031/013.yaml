  yaml_path: translation/ot/numbers/031/013.yaml
  text: Then Moses[a], Eleazar the priest, and all the leaders of the congregation went out to meet them outside the camp.
translation:
  language: sw
  text: Ndipo Musa, Eleazari kuhani, na viongozi wote wa kusanyiko[a] wakatoka nje ya kambi kwenda kuwalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakuu wote wa kusanyiko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: wakatoka
  rationale: Kitenzi יצא kinaonyesha kutoka mahali walipokuwa; muundo wa simulizi wa Kiebrania unaendelezwa kwa “wakatoka” kwa Kiswahili cha kawaida.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Eleazari kuhani
  rationale: Cheo hiki kinamtambulisha Eleazari kwa kazi yake ya ukuhani; Kiswahili kinaweza kukiweka baada ya jina bila alama ya mkato.
- source_word: כָל נְשִׂיאֵי הָעֵדָה
  choice: viongozi wote wa kusanyiko
  rationale: נְשִׂיאִים hapa ni viongozi wanaotambuliwa katika jamii, si wafalme; הָעֵדָה ni kusanyiko la Israeli. “Viongozi” ni neno la sasa na linaloeleweka kwa urahisi.
- source_word: לִקְרָאתָם
  choice: kwenda kuwalaki
  rationale: Muundo huu unaonyesha kusudi la kutoka. “Kuwalaki” huonyesha kwenda kukutana na watu wanaowasili na inafaa katika muktadha huu.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Kirai hiki kinaonyesha eneo lililo ng’ambo ya mipaka ya kambi; “nje ya kambi” ni tafsiri ya kawaida na ya asili.
