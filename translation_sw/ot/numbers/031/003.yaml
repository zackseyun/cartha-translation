  source_fidelity: The verse’s command to mobilize men from among the people for warfare and its attribution of vengeance to Yahwe are retained. However, the final target phrase is more accurately and naturally expressed in Swahili as ‘dhidi ya Midiani’ rather than ‘juu ya Midiani.’
  naturalness: The draft is generally clear, formal, and idiomatic Standard East African Swahili. Replacing ‘juu ya Midiani’ with ‘dhidi ya Midiani’ gives the required target sense of vengeance in natural contemporary usage.
  terminology: ‘Musa,’ ‘Midiani,’ ‘vita,’ ‘kisasi,’ and ‘Yahwe’ are suitable. ‘Kisasi cha Yahwe’ properly retains the construct ambiguity, while the footnote appropriately records the alternative sense.
