    issue: ‘juu ya Midiani’ is not the most natural Swahili expression for the target of vengeance.
    rationale: Although it follows a literal ‘upon Midian’ phrasing, Standard Swahili normally says that vengeance is ‘dhidi ya’ a people or party. This conveys the Hebrew target relation without unnatural calquing.
