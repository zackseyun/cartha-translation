base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/003.yaml
  text: So Moses spoke to the people, saying, “Arm men from among you for the army, and let them go against Midian to execute Yahweh’s vengeance on Midian.”
translation:
  language: sw
  text: Basi Musa akawaambia watu, “Waandaeni wanaume miongoni mwenu kwa ajili ya vita, ili waende kupigana na Midiani na kutekeleza kisasi cha Yahwe[a] dhidi ya Midiani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kisasi kwa ajili ya Yahwe.” Kiebrania kinaweza kumaanisha kisasi kilicho cha Yahwe au kinachotekelezwa kwa niaba yake.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akawaambia
  rationale: Katika masimulizi, kitenzi hiki huanzisha usemi wa moja kwa moja; ‘akawaambia’ ni Kiswahili cha kawaida na kinaonyesha kuwa Musa aliwahutubia watu.
- source_word: הֵחָלְצוּ
  choice: Waandaeni
  rationale: Katika muktadha wa kijeshi, kitenzi hiki humaanisha kuwaandaa au kuwapa silaha watu kwa vita. ‘Waandaeni’ ni cha asili na hakibani maana kwenye silaha pekee.
- source_word: מֵאִתְּכֶם אֲנָשִׁים
  choice: wanaume miongoni mwenu
  rationale: Kirai kinaonyesha kuchaguliwa kwa wanaume kutoka ndani ya kusanyiko; jinsia ya kiume iliyotajwa wazi imehifadhiwa.
- source_word: לַצָּבָא
  choice: kwa ajili ya vita
  rationale: צָבָא hapa inahusu shughuli au kampeni ya kijeshi. ‘Kwa ajili ya vita’ ni ya kawaida zaidi katika Kiswahili kuliko ‘kwa ajili ya jeshi’ katika amri hii.
- source_word: וְיִהְיוּ עַל מִדְיָן
  choice: ili waende kupigana na Midiani
  rationale: Muundo היה על katika muktadha huu unaonyesha kuwa dhidi ya adui kwa uhasama wa kijeshi. Tafsiri hii huwasilisha maana ya kimuktadha kwa Kiswahili cha asili, ingawa kwenda hakutajwi moja kwa moja.
- source_word: לָתֵת נִקְמַת
  choice: kutekeleza kisasi
  rationale: Ingawa לָתֵת kwa msingi ni ‘kutoa,’ pamoja na נִקְמַת humaanisha kukifanya au kukitekeleza kisasi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: בְּמִדְיָן
  choice: juu ya Midiani
  rationale: Kihusishi kinaonyesha Midiani kama mlengwa wa kisasi; ‘juu ya Midiani’ huhifadhi muundo huo kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Uhusiano wa kisasi na Yahwe katika נִקְמַת יְהוָה
  choice: kisasi cha Yahwe
  alternative: kisasi kwa ajili ya Yahwe
  rationale: Muundo wa Kiebrania unaweza kumaanisha kisasi kilicho cha Yahwe au kinachotekelezwa kwa niaba yake. Maandishi makuu yanahifadhi muundo wa umilikaji, huku tanbihi ikitaja uwezekano mwingine bila kuondoa mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri umewekwa wazi na kwa lugha inayoeleweka kwa wasomaji wa kawaida; ukali wa ‘kisasi’ haujalainishwa.
