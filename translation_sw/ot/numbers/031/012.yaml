  yaml_path: translation/ot/numbers/031/012.yaml
  text: And they brought the captives[a], the prey, and the spoil to Moses, to Eleazar the priest, and to the congregation of the sons of Israel, to the camp on the plains of Moab[c][b], which are by the Jordan at Jericho.
translation:
  language: sw
  text: Nao wakaleta mateka, vitu vilivyotekwa, na nyara kwa Musa, kwa kuhani Eleazari, na kwa kusanyiko la wana wa Israeli,[a] kwenye kambi katika nyanda za Moabu,[b] zilizo kando ya Yordani karibu na Yeriko.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kusanyiko la Waisraeli.” Kiebrania kinasema “kusanyiko la wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “tambare za Moabu.”
    reason: lexical_alternative
  - marker: c
    text: Au “zilizo kando ya Yordani mkabala na Yeriko.”
    reason: geographical_ambiguity
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Nao wakawaleta
  rationale: Hifili ya בוא hapa ina maana ya kusababisha kuja, yaani ‘kuleta’; kiambishi -wa- kinarejelea mateka walio watu.
- source_word: הַשְּׁבִי
  choice: mateka
  rationale: Katika muktadha wa vita neno hili linamaanisha watu waliotekwa, si hali dhahania ya utumwa.
- source_word: הַמַּלְקוֹחַ
  choice: nyara
  rationale: Neno hili linahusu vitu au wanyama waliotwaliwa vitani; ‘nyara’ ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: הַשָּׁלָל
  choice: mali zilizotekwa
  rationale: Tafsiri hii hutofautisha שׁלל na מלקוח huku ikibaki wazi kwamba kinachozungumziwa ni mali ya vita.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: kusanyiko la wana wa Israeli
  rationale: ‘Kusanyiko’ huwakilisha עֵדָה, na ‘wana wa Israeli’ huhifadhi taswira ya kifamilia ya Kiebrania bila kuifanya kuwa dhehebu maalumu.
- source_word: אֶל הַמַּחֲנֶה
  choice: kwenye kambi
  rationale: אֶל huonyesha mahali walikoelekea; ‘kwenye kambi’ ni Kiswahili cha kawaida bila kulazimisha wazo la kuingia ndani kabisa.
- source_word: עַרְבֹת מוֹאָב
  choice: nyanda za Moabu
  rationale: ‘Nyanda’ hutoa maana ya maeneo tambarare ya kijiografia kwa lugha ya sasa; ‘tambare za Moabu’ ni mbadala unaowezekana.
- source_word: אֲשֶׁר עַל יַרְדֵּן יְרֵחוֹ
  choice: kando ya Yordani, mkabala na Yeriko
  rationale: Kirai kinaweka nyanda karibu na Yordani kwa uhusiano na Yeriko; ‘mkabala na Yeriko’ hufafanua mahali bila kudai kwamba עַל peke yake humaanisha ‘mkabala na.’
