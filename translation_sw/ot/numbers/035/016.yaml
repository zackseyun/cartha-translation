base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/016.yaml
  text: But if he struck him with an iron tool and he died[a], he is a murderer; the murderer must surely be put to death.
translation:
  language: sw
  text: Lakini ikiwa alimpiga kwa kifaa cha chuma[a], naye akafa, huyo ni muuaji; muuaji huyo lazima auawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa chombo cha chuma” au “kwa kitu cha chuma.” Neno la Kiebrania lina maana pana, wala halitaji silaha mahususi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Hutanguliza sharti jingine katika mfululizo wa sheria na kuonyesha ulinganisho na kesi iliyotangulia.
- source_word: בִּכְלִי בַרְזֶל
  choice: kwa kifaa cha chuma
  rationale: כְּלִי ni neno pana linaloweza kumaanisha kifaa, chombo, au kitu kinachotumiwa; “kifaa cha chuma” halikifanyi kwa lazima kuwa silaha.
- source_word: הִכָּהוּ
  choice: alimpiga
  rationale: Huwakilisha kwa kawaida Hiphil ya נכה katika muktadha wa kisheria na kuhifadhi kitendo cha kumpiga mtu.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Huhifadhi mfuatano wa Kiebrania bila kuongeza kwa maneno uhusiano wa kisababishi ambao muktadha tayari unaonyesha.
- source_word: רֹצֵחַ הוּא
  choice: huyo ni muuaji
  rationale: Katika sheria hii רצח humtambulisha mtu mwenye hatia ya kuua, tofauti na aliyeua bila kukusudia katika sehemu nyingine za sura.
- source_word: מוֹת יוּמַת
  choice: lazima auawe
  rationale: Muundo wa Kiebrania wa infinitive absolute pamoja na kitenzi cha hali ya kutendwa unasisitiza wajibu wa hukumu ya kifo; Kiswahili hiki ni cha kawaida na chenye nguvu ya kisheria.
- source_word: הָרֹצֵחַ
  choice: muuaji huyo
  rationale: Umbo bainifu linarudia hadhi ya kisheria ya mkosaji; “huyo” hufanya ubainifu huo uwe wa kawaida katika Kiswahili.
theological_decisions:
- issue: Uainishaji wa kisheria wa רצח katika mstari huu
  choice: muuaji
  alternative: mwuaji wa mtu / mwenye kuua
  rationale: Muktadha unamtenga aliye na hatia ya kuua na mtu aliyeua bila kukusudia, kisha unaagiza hukumu ya kifo. “Muuaji” linaonyesha uzito wa kisheria na kimaadili bila kuingiza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisheria. Sentensi ni wazi kwa wasomaji wa kawaida; istilahi pana ya Kiebrania imehifadhiwa, na mkazo wa adhabu umeelezwa kwa “lazima auawe.”
