base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/002.yaml
  text: Command the sons of Israel that they give to the Levites[a], from the inheritance of their possession, cities to live in[b]; and you shall give to the Levites pasturelands around the cities.
translation:
  language: sw
  text: “Waamuru wana wa Israeli[a] wawape Walawi, kutoka katika urithi wa milki yao, miji ya kukaa; nanyi mtawapa Walawi maeneo ya malisho[b] yanayozunguka miji hiyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli”; kwa neno halisi Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Neno hili linamaanisha ardhi iliyo wazi inayozunguka miji, hasa kwa malisho na matumizi mengine ya pamoja.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: Waamuru
  rationale: Kitenzi cha amri kwa Musa kinadumisha uzito wa agizo la Kiebrania bila kukifanya kuwa maelekezo hafifu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hufuata kwa uwazi maana ya moja kwa moja, ‘wana wa Israeli,’ huku ikiwataja watu wa agano kwa ujumla.
- source_word: וְנָתְנוּ
  choice: wawape
  rationale: Baada ya ‘Waamuru,’ umbo hili linaonyesha matokeo yanayoamriwa kwa Kiswahili cha kawaida.
- source_word: לַלְוִיִּם
  choice: Walawi
  rationale: Ni jina la kawaida la Kiswahili kwa Walawi, ambao ndio wapokeaji.
- source_word: מִנַּחֲלַת אֲחֻזָּתָם
  choice: kutoka katika urithi wa milki yao
  rationale: ‘Urithi’ na ‘milki’ zinahifadhi kwa kiasi kikubwa maneno mawili yenye uzito wa kisheria kuhusu sehemu ya ardhi waliyorithi na kuimiliki.
- source_word: עָרִים לָשָׁבֶת
  choice: miji ya kukaa
  rationale: Inaonyesha kusudi la miji hiyo kwa lugha ya sasa na iliyo wazi.
- source_word: מִגְרָשׁ
  choice: maeneo ya malisho
  rationale: Katika muktadha huu ni ardhi iliyo wazi kandokando ya mji, hasa kwa malisho na matumizi ya pamoja; wingi wa Kiswahili unafaa kwa maeneo yanayohusishwa na miji kadhaa.
- source_word: לֶעָרִים סְבִיבֹתֵיהֶם
  choice: yanayoizunguka miji hiyo
  rationale: Inaeleza kwa kawaida kwamba maeneo hayo yako pande zote za miji iliyotajwa.
- source_word: תִּתְּנוּ
  choice: nanyi mtawapa
  rationale: Inahifadhi badiliko kutoka nafsi ya tatu wingi ‘wawape’ kwenda nafsi ya pili wingi, ambalo limo wazi katika Kiebrania.
