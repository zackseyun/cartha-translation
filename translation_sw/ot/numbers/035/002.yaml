translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi badiliko muhimu la nafsi ya kisarufi kutoka ‘wawape’ hadi ‘nanyi mtawapa,’ pamoja na istilahi mbili za urithi na milki.
