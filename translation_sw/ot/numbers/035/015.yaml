base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/015.yaml
  text: These six cities shall be for refuge for the sons of Israel[a], and for the sojourner and for the resident among them[c][b], so that anyone who kills a person unintentionally may flee there.
translation:
  language: sw
  text: Miji hii sita itakuwa makimbilio kwa wana wa Israeli[a], kwa mgeni na mkazi wanaoishi miongoni mwao[b], ili mtu yeyote anayemuua mtu[c] bila kukusudia aweze kukimbilia huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli” au “watoto wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: “Mgeni” na “mkazi” yametafsiri maneno mawili tofauti ya Kiebrania (גֵּר na תּוֹשָׁב) yanayotaja watu wasio wazawa waliokuwa wakiishi katika jamii ya Israeli.
    reason: cultural_note
  - marker: c
    text: Kiebrania, kwa maana ya neno kwa neno, ni “anayempiga mtu”; katika muktadha huu humaanisha mtu anayesababisha kifo cha mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kwa wana wa Israeli
  rationale: Huhifadhi muundo wa kawaida wa Kiebrania wa kulitaja taifa la Israeli, huku ukiwa usemi unaoeleweka na wa kawaida katika Kiswahili cha Biblia.
- source_word: גֵּר
  choice: mgeni
  rationale: Neno hili humaanisha mtu asiye mzawa anayeishi ndani ya jamii ya Israeli; “mgeni” ni la kawaida na halina mtindo mzito wa kisheria.
- source_word: תּוֹשָׁב
  choice: mkazi
  rationale: Hutaja mtu anayekaa katika nchi au jamii bila hadhi kamili ya mzawa. “Mkazi” huhifadhi tofauti ya neno hili na גֵּר.
- source_word: בְּתוֹכָם
  choice: aliye miongoni mwao
  rationale: Hueleza kwamba mkazi huyo anaishi ndani ya jamii ya Israeli, kwa Kiswahili cha asili na kinachoeleweka.
- source_word: תִּהְיֶינָה שֵׁשׁ הֶעָרִים הָאֵלֶּה לְמִקְלָט
  choice: Miji hii sita itakuwa mahali pa kukimbilia
  rationale: Huwasilisha rasmi kusudi la kisheria la miji hiyo bila kutumia istilahi isiyo ya kawaida; “mahali pa kukimbilia” linaeleza maana ya מִקְלָט kwa uwazi.
- source_word: לָנוּס שָׁמָּה
  choice: aweze kukimbilia huko
  rationale: Muundo huu unaonyesha kusudi la miji hiyo kwa Kiswahili cha kawaida.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: mtu yeyote anayemuua mtu
  rationale: Katika muktadha huu usemi wa Kiebrania unahusu mtu anayesababisha kifo cha binadamu. Tafsiri hii ni wazi kuliko tafsiri sisisi ya ‘anayempiga mtu’.
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Hapa נֶפֶשׁ humaanisha binadamu aliyeuawa, si ‘nafsi’ kama sehemu isiyo ya mwili.
- source_word: בִּשְׁגָגָה
  choice: bila kukusudia
  rationale: Huhifadhi tofauti ya kisheria kati ya mauaji ya kukusudia na kifo kinachosababishwa pasipo nia.
theological_decisions:
- issue: Mtajo wa agano wenye umbo la kiume katika בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: “Wana wa Israeli” huhifadhi umbo la Kiebrania na mtajo wake wa jadi wa taifa bila kulibadili kimya kuwa jina la kikabila lisiloonyesha muundo wa asili. Katika muktadha huu usemi huo unalitaja taifa kwa ujumla.
- issue: Kiwango cha nia katika בִּשְׁגָגָה
  choice: bila kukusudia
  alternative: kwa bahati mbaya; kwa kosa
  rationale: “Bila kukusudia” huweka wazi ukosefu wa nia bila kudai kwamba tukio hilo lilikuwa ajali isiyoweza kuepukika, hivyo huhifadhi upana wa neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mtindo wa kisheria wa kifungu umehifadhiwa bila kutumia lugha ya kale au istilahi nzito zisizo za lazima.
