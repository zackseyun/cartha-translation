base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/024.yaml
  text: then the congregation shall judge between the one who struck him and the avenger of blood, according to these ordinances.
translation:
  language: sw
  text: Ndipo kusanyiko litahukumu kati ya yule aliyepiga na mlipiza kisasi cha damu[a], kwa mujibu wa kanuni hizi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkombozi wa damu.” Kirai cha Kiebrania kinamtaja mtu mwenye wajibu wa kulipiza damu ya jamaa aliyeuawa.
    reason: lexical_alternative
  - marker: b
    text: Au “hukumu hizi.” Neno la Kiebrania linaweza kumaanisha hukumu au kanuni za kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: Ndipo ... litahukumu
  rationale: Kitenzi cha Kiebrania katika mfuatano wa sheria kinaeleza hatua inayofuata ya utaratibu wa kisheria; “ndipo ... litahukumu” huhifadhi maana hiyo na nguvu ya kimahakama.
- source_word: הָעֵדָה
  choice: kusanyiko
  rationale: Neno עֵדָה hapa linamaanisha jumuiya ya Israeli ikiwa katika jukumu la pamoja la kutoa hukumu; “kusanyiko” linafaa katika muktadha rasmi bila kulifanya kuwa mahakama nyembamba isiyotajwa wazi.
- source_word: בֵּין ... וּבֵין
  choice: kati ya ... na
  rationale: Huu ndio usemi wa kawaida wa Kiswahili unaowakilisha pande mbili zinazohusika.
- source_word: הַמַּכֶּה
  choice: yule aliyempiga
  rationale: Kirai hiki huhifadhi maana ya kishiriki cha נכה, yaani mtu aliyepiga, bila kumwita tayari “muuaji” na hivyo kuamua hatia kabla ya hukumu.
- source_word: גֹּאֵל הַדָּם
  choice: mlipiza kisasi cha damu
  rationale: Huhifadhi nahau ya kisheria ya Kiebrania kuhusu mtu mwenye wajibu wa kulipiza damu ya jamaa, bila kuongeza wazi undugu ambao haukutajwa katika mstari huu.
- source_word: עַל
  choice: kwa kufuata
  rationale: Katika muktadha huu wa sheria, עַל huonyesha kwamba hukumu itolewe kwa mujibu wa viwango vya kisheria vilivyotangulia.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: kanuni hizi
  rationale: מִשְׁפָּטִים inaweza kumaanisha kanuni au hukumu za kisheria; “kanuni hizi” ni ya asili na rasmi katika Kiswahili huku tanbihi ikihifadhi uwezekano wa “hukumu hizi.”
theological_decisions:
- issue: Jukumu la kusanyiko katika kuamua kesi ya kifo
  choice: Kusanyiko linaonyeshwa likihukumu kati ya aliyepiga na mlipiza kisasi cha damu, bila kumtangaza aliyepiga kuwa muuaji mwenye hatia.
  alternative: Kulielewa “kusanyiko” kuwa baraza maalumu tu, au kumwita aliyepiga “muuaji.”
  rationale: Kiebrania kinaonyesha utaratibu wa hukumu ya pamoja na hudumisha kutokuwapo kwa uamuzi wa hatia katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rejesta rasmi ya kisheria. Muundo unabaki wazi kwa wasomaji wa kawaida na unahifadhi kutokuwapo kwa uamuzi wa hatia katika maandishi ya Kiebrania.
