base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/019.yaml
  text: The avenger of blood himself shall put the murderer to death; when he meets him[a], he himself shall put him to death.
translation:
  language: sw
  text: Mlipiza kisasi cha damu[a] mwenyewe atamuua muuaji; atakapokutana naye, yeye mwenyewe atamuua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkombozi wa damu.” Kirai cha Kiebrania ni istilahi maalumu ya kisheria inayomtaja mwanafamilia mwenye jukumu la kulipiza kisasi kwa damu iliyomwagwa isivyo halali.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: mlipiza-kisasi cha damu
  rationale: Katika sheria hii, kirai hiki ni istilahi maalumu kwa mwanafamilia mwenye wajibu wa kulipiza kisasi kwa damu iliyomwagwa isivyo halali. Tafsiri hii inaonyesha jukumu hilo la kisheria bila kuingiza maana pana ya ukombozi ya גֹּאֵל.
- source_word: הוּא
  choice: mwenyewe / yeye mwenyewe
  rationale: Kiwakilishi huru cha Kiebrania kinaweka mkazo juu ya mhusika anayetekeleza hukumu binafsi; kurudia ‘mwenyewe’ kunahifadhi mkazo huo.
- source_word: יָמִית
  choice: atamuua
  rationale: Hifili ya מות ina maana ya kusababisha mtu afe. Katika muktadha huu wa sheria ya mauaji, ‘atamuua’ ni wazi, ya kawaida, na haiongezi dhana ya utaratibu rasmi wa kunyonga ambayo haijasemwa moja kwa moja.
- source_word: הָרֹצֵחַ
  choice: muuaji
  rationale: רצח humtaja aliyeua kinyume cha sheria. ‘Muuaji’ ni neno la kawaida na linaloeleweka katika Kiswahili, huku muktadha wa sheria unaobainisha mwenye hatia ukidhibiti maana yake.
- source_word: בְּפִגְעוֹ בוֹ
  choice: atakapokutana naye
  rationale: Kirai hiki hapa kinaonyesha wakati wa kukutana au kumfikia mtu. ‘Atakapokutana naye’ ni tafsiri ya asili inayohifadhi maana hiyo bila kudai kwamba kitendo cha kumpiga tayari kimetokea.
theological_decisions:
- issue: Jukumu la kisheria la גֹּאֵל הַדָּם
  choice: Kutafsiri kama ‘mlipiza-kisasi cha damu,’ yaani mwanafamilia mwenye jukumu maalumu katika sheria ya Israeli.
  alternative: mkombozi wa damu
  rationale: Muktadha ni sheria ya mauaji na jukumu la kifamilia la kushughulikia damu iliyomwagwa, si fundisho pana la ukombozi. Chaguo hili linahifadhi taasisi ya kisheria bila kuingiza maana za baadaye za kiteolojia.
- issue: Mkazo wa הוּא unaorudiwa
  choice: Kuhifadhi mkazo kwa ‘mwenyewe’ na ‘yeye mwenyewe.’
  alternative: Kutumia kiambishi cha nafsi katika kitenzi pekee bila kiwakilishi cha mkazo.
  rationale: Kurudiwa kwa kiwakilishi katika Kiebrania kunasisitiza kwamba mlipiza-kisasi wa damu ndiye anayetekeleza tendo hilo; tafsiri haipaswi kufuta msisitizo huu wa kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umehifadhi urudiaji na mkazo wa Kiebrania; istilahi isiyo ya kawaida ‘mlipiza-kisasi cha damu’ imefafanuliwa kwa tanbihi.
