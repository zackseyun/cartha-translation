  text: כִּ֣י בְ/עִ֤יר מִקְלָט/וֹ֙ יֵשֵׁ֔ב עַד מ֖וֹת הַ/כֹּהֵ֣ן הַ/גָּדֹ֑ל וְ/אַחֲרֵ֥י מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל יָשׁוּב֙ הָ/רֹצֵ֔חַ אֶל אֶ֖רֶץ אֲחֻזָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/028.yaml
  text: For he must remain in his city of refuge until the death of the high priest[b][a], and after the death of the high priest the manslayer may return to the land of his possession.
translation:
  language: sw
  text: Kwa maana ni lazima akae katika mji wake wa makimbilio mpaka kifo cha kuhani mkuu; na baada ya kifo cha kuhani mkuu, mtu aliyeua[a] anaweza kurudi katika ardhi ya milki yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “muuaji.” Neno la Kiebrania hapa linamtaja mtu aliyeua kama kundi la kisheria katika sheria za miji ya makimbilio; halimaanishi moja kwa moja kwamba aliua kwa kukusudia.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwenye ardhi yake mwenyewe” au “katika ardhi ya mali yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha kuwa sentensi hii inatoa sababu ya matokeo ya kisheria yaliyotajwa kabla yake.
- source_word: בְעִיר מִקְלָטוֹ
  choice: katika mji wake wa makimbilio
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida kwa mji uliowekwa kisheria kuwa mahali pa kukimbilia.
- source_word: יֵשֵׁב
  choice: ni lazima akae
  rationale: Katika muktadha huu wa sheria, kitenzi cha kukaa kina maana ya wajibu na kizuizi cha kuondoka, si taarifa ya makazi tu.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: mpaka kuhani mkuu afe
  rationale: Muundo huu ni wa asili katika Kiswahili na unawasilisha kwa usahihi kikomo cha muda kilicho katika Kiebrania.
- source_word: הַכֹּהֵן הַגָּדֹל
  choice: kuhani mkuu
  rationale: Hili ndilo jina la kawaida na sahihi la cheo hicho.
- source_word: וְאַחֲרֵי מוֹת הַכֹּהֵן הַגָּדֹל
  choice: na baada ya kuhani mkuu kufa
  rationale: Inahifadhi kurudiwa kwa tukio hilo na mpangilio wa wakati katika kanuni ya Kiebrania.
- source_word: הָרֹצֵחַ
  choice: mtu aliyeua
  rationale: Ni usemi usiotoa hukumu mapema kwamba tendo hilo lilikuwa mauaji ya kukusudia; hapa neno ni kundi la kisheria katika sheria za miji ya makimbilio.
- source_word: יָשׁוּב
  choice: anaweza kurudi
  rationale: Katika muktadha, kurudi kunaruhusiwa baada ya kizuizi cha awali kuondolewa; usemi huu unaonyesha ruhusa badala ya utabiri au amri.
- source_word: אֶל אֶרֶץ אֲחֻזָּתוֹ
  choice: katika nchi ya milki yake
  rationale: Inadumisha maana ya eneo la ardhi analomiliki kisheria bila kutumia neno lenye maana pana zaidi ya kitheolojia kama ‘urithi’.
theological_decisions:
- issue: Ikiwa הָרֹצֵחַ itafsiriwe kwa neno linalomaanisha muuaji wa kukusudia au kwa usemi usiotoa hukumu hiyo
  choice: mtu aliyeua
  alternative: muuaji; mwuaji wa kukusudia
  rationale: Sheria za miji ya makimbilio zinatofautisha mauaji ya kukusudia na kuua bila kukusudia. ‘Mtu aliyeua’ huhifadhi aina ya kisheria bila kuamua katika mstari huu kiwango cha hatia ambacho neno ‘muuaji’ linaweza kudokeza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa wasomaji wa kawaida huku ukihifadhi mtindo wa kisheria, marudio ya ‘kuhani mkuu,’ na kutokuwapo kwa uamuzi wa wazi kuhusu nia ya mtu aliyeua.
