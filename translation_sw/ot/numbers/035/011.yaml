  text: then you shall designate cities for yourselves; they shall be cities of refuge for you, and the manslayer who strikes down a person unintentionally shall flee there.
translation:
  language: sw
  text: Basi mtajiteulia[a] miji; itakuwa miji ya makimbilio kwenu, na muuaji aliyemuua mtu bila kukusudia[b] atakimbilia huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtajichagulia” au “mtaweka kando miji kwa ajili yenu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “muuaji anayempiga mtu bila kukusudia”; yaani, mtu aliyesababisha kifo bila kukusudia, si aliyeua kwa makusudi.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיתֶם
  choice: mtajiteulia
  rationale: Hifili ya קרה hapa ina maana ya kusababisha miji fulani ichaguliwe au itengwe kwa kusudi maalumu. “Mtajiteulia” ni ya kawaida katika Kiswahili na inafaa muktadha wa kisheria.
- source_word: עָרִים ... עָרֵי מִקְלָט
  choice: miji; itakuwa miji ya makimbilio
  rationale: Marudio ya “miji” yamehifadhiwa kwa uwazi na msisitizo wa kisheria uliomo katika Kiebrania.
- source_word: מִקְלָט
  choice: makimbilio
  rationale: Neno hili linamaanisha mahali pa usalama anapokimbilia mtu. “Miji ya makimbilio” ni usemi wa asili na unaoeleweka katika Kiswahili cha Biblia.
- source_word: וְנָס שָׁמָּה
  choice: atakimbilia huko
  rationale: Muundo huu katika mfululizo wa sheria una maana ya wakati ujao yenye nguvu ya agizo au matokeo yaliyowekwa. “Atakimbilia huko” ni ya asili na haiongezi lazima au ruhusa isiyotajwa wazi.
- source_word: רֹצֵחַ
  choice: muuaji
  rationale: Ingawa neno linaweza kutumiwa kuhusu mauaji kwa upana, kirai “bila kukusudia” kinaondoa wazo la mauaji ya kukusudia. “Muuaji” halilazimishi uamuzi wa kwamba mtu huyo ni mwuaji wa kukusudia.
- source_word: מַכֵּה נֶפֶשׁ
  choice: aliyemuua mtu
  rationale: Kihalisi ni ‘anayempiga mtu/uhai,’ lakini katika muktadha huu matokeo ni kifo. “Aliyemuua mtu” ni wazi na sahihi katika Kiswahili cha sasa.
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Hapa נֶפֶשׁ humaanisha mwanadamu aliyeuawa, si nafsi isiyo ya kimwili.
- source_word: בִּשְׁגָגָה
  choice: bila kukusudia
  rationale: Usemi huu unaonyesha kutokuwapo kwa nia, na hivyo unahifadhi tofauti ya kisheria kati ya kuua bila kukusudia na kuua kwa makusudi.
theological_decisions:
- issue: Uainishaji wa kisheria wa aliyesababisha kifo
  choice: “Muuaji” limefafanuliwa na “bila kukusudia,” badala ya kutumia neno linalomaanisha moja kwa moja mwuaji wa kukusudia.
  alternative: “Mwuaji wa kukusudia” au “mhalifu wa mauaji”
  rationale: Hii haiingizi hukumu ya kimaadili au ya kisheria inayozidi kauli ya aya, na inadumisha tofauti ya Torati kati ya mauaji ya kukusudia na kusababisha kifo bila kukusudia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kisheria na marudio ya Kiebrania yamehifadhiwa bila kufanya sentensi kuwa nzito. Alama zote za tanbihi zimewekwa katika matini kuu.
