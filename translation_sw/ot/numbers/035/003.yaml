base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/003.yaml
  text: The cities shall be for them to live in[a], and their pasturelands shall be for their livestock, for their possessions[b], and for all their animals.
translation:
  language: sw
  text: Miji hiyo itakuwa yao ili wakae humo, na maeneo yao ya wazi[a] yatakuwa kwa ajili ya mifugo yao, mali zao, na wanyama wao wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maeneo yao ya malisho.” Neno la Kiebrania linamaanisha eneo la wazi linalozunguka miji, ambalo hapa lilitumiwa hasa kwa mifugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: miji hiyo
  rationale: עִיר humaanisha mji au makazi ya mjini; “miji” ni neno la kawaida katika muktadha huu wa ugawaji wa makazi.
- source_word: לָשָׁבֶת
  choice: ili wakae humo
  rationale: Kitenzi ישׁב kina maana ya kukaa au kuishi mahali. “Ili wakae humo” ni Kiswahili cha kawaida kinachohifadhi maana ya kusudi na kurejelea miji.
- source_word: מִגְרְשֵׁיהֶם
  choice: maeneo yao ya wazi
  rationale: מִגְרָשׁ hurejelea ardhi ya wazi inayozunguka mji na kutumiwa na wenyeji, hapa hasa kwa mifugo. “Maeneo ya wazi” huhifadhi upana wa maana kuliko kuyaita malisho pekee.
- source_word: לִבְהֶמְתָּם
  choice: kwa ajili ya mifugo yao
  rationale: בְּהֵמָה hapa ni jina la jumla la wanyama wanaofugwa; “mifugo” ni neno wazi na la kawaida katika Kiswahili cha kisasa.
- source_word: לִרְכֻשָׁם
  choice: mali zao
  rationale: רְכוּשׁ humaanisha mali au vitu vinavyomilikiwa. “Mali zao” inafaa katika muktadha wa kisheria na kiutawala bila kupunguza maana kwa vitu vya aina moja.
- source_word: וּלְכֹל חַיָּתָם
  choice: na wanyama wao wote
  rationale: חַיָּה inaweza kumaanisha kiumbe hai au mnyama. Katika muktadha huu, “wanyama wao wote” ni wazi na huhifadhi upana unaofuata baada ya kutajwa kwa mifugo.
theological_decisions: []
