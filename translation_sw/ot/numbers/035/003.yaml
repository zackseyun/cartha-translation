  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi uhusiano wa kusudi wa maandishi ya Kiebrania, huku “maeneo ya wazi” yakiepuka kupunguza maana ya מִגְרָשׁ kuwa malisho tu.
