  text: 'Sema na wana wa Israeli, uwaambie: ‘Mtakapovuka Yordani kuelekea nchi ya Kanaani,’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sema na
  rationale: Amri ya Piel ya דבר pamoja na אֶל inaelekeza Musa azungumze na watu; “sema na” huhifadhi nguvu ya amri na ni Kiswahili cha kawaida.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu usemi wa kifamilia wa Kiebrania, badala ya kuufanya moja kwa moja kuwa jina la kitaifa; “Waisraeli” ni tafsiri mbadala ya kawaida.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: uwaambie
  rationale: Huhifadhi kitenzi cha pili katika mfuatano wa Kiebrania huku ikitoa sentensi ya Kiswahili iliyo ya kawaida na yenye mtiririko mzuri.
- source_word: כִּי
  choice: Mtakapovuka
  rationale: Katika muktadha huu כִּי inaanzisha hali ya wakati ujao; kiambishi cha wakati “-taka-” katika Kiswahili huwasilisha maana ya “wakati mtakapovuka.”
- source_word: אַתֶּם עֹבְרִים
  choice: mtakapovuka
  rationale: Kiwakilishi na umbo la participle vinaonyesha tendo linalokaribia kutokea; “mtakapovuka” ni usemi wa kawaida wa Kiswahili katika kishazi cha wakati.
- source_word: אֶת הַיַּרְדֵּן
  choice: Yordani
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la mto; neno “Mto” linaeleweka katika jina na si lazima liongezwe.
- source_word: אַרְצָה כְּנָעַן
  choice: na kuingia katika nchi ya Kanaani
  rationale: Kiambishi elekezi katika אַרְצָה kinaonyesha mwendo kuelekea na kuingia ndani ya nchi; “na kuingia katika” huweka wazi mwelekeo huo kwa Kiswahili asilia.
