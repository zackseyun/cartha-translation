  text: וְ/הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ מֵ/אֲחֻזַּ֣ת בְּנֵי יִשְׂרָאֵ֔ל מֵ/אֵ֤ת הָ/רַב֙ תַּרְבּ֔וּ וּ/מֵ/אֵ֥ת הַ/מְעַ֖ט תַּמְעִ֑יטוּ אִ֗ישׁ כְּ/פִ֤י נַחֲלָת/וֹ֙ אֲשֶׁ֣ר יִנְחָ֔לוּ יִתֵּ֥ן מֵ/עָרָ֖י/ו לַ/לְוִיִּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/008.yaml
  text: And the cities that you give from the possession of the sons of Israel—from the many you shall increase[a], and from the few you shall diminish. Each one, according to his inheritance that they inherit[b], shall give some of his cities to the Levites.
translation:
  language: sw
  text: 'Na miji mtakayotoa kutoka katika milki ya Waisraeli: kutoka kwa walio na sehemu kubwa mtatoa miji mingi zaidi, na kutoka kwa walio na sehemu ndogo mtatoa miji michache zaidi.[a] Kila mmoja atawapa Walawi baadhi ya miji yake, kwa kadiri ya urithi wake watakaourithi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa halisi, Kiebrania kinasema, “kutoka kwa wengi mtaongeza, na kutoka kwa wachache mtapunguza.” Maana ni kwamba waliopokea urithi mkubwa watoe miji mingi zaidi, na waliopokea urithi mdogo watoe miji michache zaidi.
    reason: lexical_alternative
  - marker: b
    text: Kwa halisi, “kila mmoja ... kwa kadiri ya urithi wake watakaourithi.” Kiebrania hubadilika kutoka umoja wa kugawa (“kila mmoja,” “wake”) hadi kitenzi cha wingi (“watarithi”), kikirejelea makabila au Waisraeli kwa pamoja.
    reason: source_ambiguity
lexical_decisions:
- source_word: הֶעָרִים
  choice: miji
  rationale: עִיר humaanisha mji au makazi ya mjini; “miji” ni istilahi ya kawaida katika muktadha huu wa miji ya Walawi.
- source_word: אֲחֻזַּת בְּנֵי יִשְׂרָאֵל
  choice: milki ya Waisraeli
  rationale: אֲחֻזָּה ni ardhi au mali iliyoshikiliwa kama milki; “Waisraeli” huwasilisha kwa kawaida maana ya pamoja ya בְּנֵי יִשְׂרָאֵל katika Kiswahili.
- source_word: מֵאֵת הָרַב תַּרְבּוּ וּמֵאֵת הַמְעַט תַּמְעִיטוּ
  choice: kutoka kwa walio na sehemu kubwa mtatoa miji mingi zaidi, na kutoka kwa walio na sehemu ndogo mtatoa miji michache zaidi
  rationale: Maneno ya Kiebrania kwa halisi yanatofautisha “mengi” na “machache.” Muktadha unaonyesha ugawaji unaolingana na ukubwa wa sehemu ya urithi, hivyo tafsiri hii inaweka wazi maana bila kutaja moja kwa moja “makabila” katika kishazi hiki.
- source_word: אִישׁ
  choice: kila kabila
  rationale: אִישׁ ina nguvu ya kugawa, “kila mmoja.” Katika muktadha, wahusika wanaotoa miji ni makundi ya kikabila yaliyopokea urithi; “kila kabila” ni Kiswahili cha kawaida kinachoeleza mrejeo huo.
- source_word: כְּפִי נַחֲלָתוֹ
  choice: kwa kadiri ya urithi wake
  rationale: כְּפִי ni nahau yenye maana ya kulingana na kipimo au uwiano; “kwa kadiri ya” huhifadhi wazo la uwiano.
- source_word: יִתֵּן מֵעָרָיו לַלְוִיִּם
  choice: litawapa Walawi baadhi ya miji yake
  rationale: מִן ni ya kugawa sehemu ya jumla, hivyo “baadhi ya miji yake” ni ya kawaida na sahihi; לַלְוִיִּם ni “Walawi.”
theological_decisions:
- issue: Mabadiliko ya idadi ya kisarufi kati ya אִישׁ ... נַחֲלָתוֹ ... יִנְחָלוּ
  choice: Kila kabila, kwa kadiri ya urithi wake
  alternative: Kila mmoja, kwa kadiri ya urithi wake ambao watarithi
  rationale: Kiebrania huanza na umoja wa kugawa lakini hutumia kitenzi cha wingi יִנְחָלוּ. Tafsiri kuu inatambulisha makabila kama wahusika wa pamoja ili Kiswahili kiwe cha kawaida; tanbihi inahifadhi taarifa ya mabadiliko hayo badala ya kulificha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Milki,” “urithi,” na “Walawi” hudumisha msamiati wa kawaida wa kibiblia; miundo iliyofafanuliwa huwasilisha kwa uwazi kanuni ya ugawaji wa miji kwa uwiano.
