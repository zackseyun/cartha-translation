  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/001.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho, saying,
translation:
  language: sw
  text: Yahwe akamwambia Musa katika nchi tambarare za Moabu, kando ya Yordani karibu na Yeriko, akisema,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Katika fomula hii ya masimulizi, kitenzi דבר kinaonyesha tukio jipya la kusema. Kiswahili cha kawaida hutumia “akasema na” kwa mtu anayeelekezewa maneno, huku “akisema” mwishoni kikitambulisha yaliyosemwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limeandikwa kama jina binafsi, si kubadilishwa kuwa cheo kama “BWANA.” Umbo “Yahwe” linafuata tahajia ya kawaida ya Kiswahili.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: בְּעַרְבֹת
  choice: katika nchi tambarare
  rationale: Neno עֲרָבוֹת humaanisha maeneo ya uwanda au nyika tambarare. “Nchi tambarare” ni ya asili na inaeleweka wazi katika muktadha wa kijiografia.
- source_word: מוֹאָב
  choice: Moabu
  rationale: Hili ni umbo la kawaida la jina la mahali katika Kiswahili cha Biblia.
- source_word: עַל
  choice: kando ya
  rationale: Katika maelezo haya ya mahali, kihusishi kinaonyesha ukaribu na Yordani, si kuwa juu yake.
- source_word: יַרְדֵּן
  choice: Yordani
  rationale: Hili ndilo umbo la kawaida la jina la mto katika Kiswahili; muktadha unatosha bila kuongeza neno “Mto.”
- source_word: יְרֵחוֹ
  choice: karibu na Yeriko
  rationale: Mfuatano עַל־יַרְדֵּן יְרֵחוֹ ni usemi wa kijiografia unaoeleza sehemu ya Yordani iliyo mkabala au karibu na Yeriko. “Karibu na Yeriko” huwasilisha uhusiano huo kwa Kiswahili cha asili bila kudai kuwa tambarare hizo zilikuwa ndani ya Yeriko.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kitenzi-jina hiki hutambulisha maudhui ya hotuba inayofuata. “Akisema” kinadumisha uhusiano huo wa kifomula.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, na tahajia yake inafaa Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kifomula wa hotuba ya Kiebrania umehifadhiwa kwa “akasema na … akisema,” bila kuifanya sentensi kuwa nzito isivyo lazima.
