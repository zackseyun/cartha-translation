source:
  edition: WLC
  text: וְ/לֹ֧א תְטַמֵּ֣א אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ יֹשְׁבִ֣ים בָּ֔/הּ אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֣ן בְּ/תוֹכָ֑/הּ כִּ֚י אֲנִ֣י יְהוָ֔ה שֹׁכֵ֕ן בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/034.yaml
  text: And you shall not defile the land in which you dwell[a], in the midst of which I dwell, for I, Yahweh, dwell in the midst of the sons of Israel.
translation:
  language: sw
  text: Nanyi msiitie nchi unajisi mnayoishi, ambayo mimi ninakaa ndani yake; kwa maana mimi, Yahwe, ninakaa katikati ya wana wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa lugha ya kawaida zaidi, “Waisraeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְטַמֵּא
  choice: msiitie unajisi
  rationale: Kitenzi cha Kiebrania katika Piel kinamaanisha kufanya kitu kiwe najisi kidini au kimaadili. ‘Kuitia unajisi’ huhifadhi nguvu hizo zote mbili kuliko ‘kuichafua,’ ambalo linaweza kueleweka hasa kimazingira.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha huu אֶרֶץ ni nchi ambamo Israeli wanaishi, wala si dunia yote.
- source_word: יֹשְׁבִים בָּהּ
  choice: mnamoishi
  rationale: ישב hapa humaanisha kuishi au kukaa mahali. ‘Mnamoishi’ ni Kiswahili cha kawaida na hudumisha uhusiano na ‘nchi.’
- source_word: שֹׁכֵן
  choice: ninakaa
  rationale: שכן hueleza kukaa au kuwapo kwa kudumu, hapa ikiwa na uzito wa uwepo wa Mungu kati ya watu wake. ‘Ninakaa’ ni ya asili na haiongezi istilahi maalumu isiyomo katika kitenzi.
- source_word: בְּתוֹכָהּ
  choice: katikati yake
  rationale: תוך huonyesha kuwapo ndani au katikati ya kitu. Tafsiri hii pia huhifadhi mwangwi wa neno hilo linaporudiwa mwishoni mwa mstari.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי inatoa sababu ya katazo lililotangulia; ‘kwa maana’ huwasilisha uhusiano huo wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa kama jina binafsi badala ya kubadilishwa kuwa cheo kama ‘Bwana.’ Umbo ‘Yahwe’ linafaa matamshi na tahajia ya Kiswahili.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: katikati ya wana wa Israeli
  rationale: Huhifadhi kwa ukaribu muundo wa Kiebrania ‘wana wa Israeli’ na pia kurudia kwa ‘katikati’; maana ya kawaida zaidi imeonyeshwa katika tanbihi.
theological_decisions:
- issue: Utoaji wa jina יְהוָה
  choice: Yahwe
  alternative: Bwana; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina bila kulibadilisha kuwa cheo.
- issue: Maana ya uwepo wa Mungu unaoelezwa kwa שכן
  choice: ninakaa
  alternative: ninatabernakulo; ninaishi
  rationale: ‘Ninakaa’ huhifadhi lugha ya uwepo wa Mungu bila kuingiza ufafanuzi maalumu wa kiteolojia ambao kitenzi chenyewe haulazimishi.
- issue: Usemi wa kiume בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Tafsiri kuu huhifadhi umbo halisi la Kiebrania, huku tanbihi ikitoa maana yake ya kawaida inayowahusu watu wa Israeli kwa ujumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi umehifadhi marudio ya ‘ninakaa’ na ‘katikati’ kwa sababu ni sehemu muhimu ya msisitizo wa Kiebrania.
