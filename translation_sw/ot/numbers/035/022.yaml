lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Kifungu hiki kinaanzisha hali ya masharti inayotofautiana na matendo ya kukusudia katika mistari iliyotangulia.
- source_word: בְּפֶתַע
  choice: ghafula
  rationale: Neno hili linaonyesha tendo lililotokea kwa ghafla; ‘ghafula’ ni la kawaida, fupi, na wazi katika Kiswahili.
- source_word: בְּלֹא אֵיבָה
  choice: bila uadui
  rationale: אֵיבָה humaanisha uhasama au chuki ya mtu dhidi ya mwingine; ‘bila uadui’ huhifadhi maana hiyo ya uhusiano kati ya watu.
- source_word: הֲדָפוֹ
  choice: alimsukuma
  rationale: Kitenzi hiki humaanisha kumsukuma au kumthrust mtu; ‘alimsukuma’ ni tafsiri ya kawaida na wazi katika muktadha huu wa kisheria.
- source_word: אוֹ
  choice: au
  rationale: Kiunganishi hiki kinatambulisha hali nyingine inayowezekana.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: akamtupia
  rationale: Kitenzi pamoja na עַל humaanisha kutupa kitu kuelekea au juu ya mtu; ‘akamtupia’ huwasilisha hilo kwa Kiswahili cha kawaida.
- source_word: כָּל כְּלִי
  choice: kitu chochote
  rationale: כְּלִי ni neno pana linaloweza kumaanisha chombo, kifaa, au kitu; hapa ‘kitu chochote’ huepuka kulipatia maana finyu isiyodaiwa na muktadha.
- source_word: בְּלֹא צְדִיָּה
  choice: bila kumvizia
  rationale: צְדִיָּה hurejelea kuvizia au kungojea kwa kujificha ili kushambulia; tafsiri hii huhifadhi picha halisi badala ya kuingiza istilahi pana ya kisasa ya kisheria.
