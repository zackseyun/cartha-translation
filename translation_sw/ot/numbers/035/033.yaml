language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לֹֽא תַחֲנִ֣יפוּ אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ בָּ֔/הּ כִּ֣י הַ/דָּ֔ם ה֥וּא יַחֲנִ֖יף אֶת הָ/אָ֑רֶץ וְ/לָ/אָ֣רֶץ לֹֽא יְכֻפַּ֗ר לַ/דָּם֙ אֲשֶׁ֣ר שֻׁפַּךְ בָּ֔/הּ כִּי אִ֖ם בְּ/דַ֥ם שֹׁפְכֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/033.yaml
  text: You shall not pollute the land in which you are[a], for blood pollutes the land, and no atonement can be made for the land for the blood that was shed in it[b], except by the blood of the one who shed it.
translation:
  language: sw
  text: Msiitie nchi mnayoishi unajisi, kwa maana damu huitia nchi unajisi; wala nchi haiwezi kufanyiwa upatanisho kwa ajili ya damu iliyomwagwa ndani yake, isipokuwa kwa damu ya yule aliyeimwaga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַחֲנִיפוּ / יַחֲנִיף (חנף, Hiphil)
  choice: tia unajisi
  rationale: Katika muktadha wa umwagaji damu, kitenzi hiki kinaonyesha kuifanya nchi iwe na uchafu wa kimaadili na kidini. “Tia unajisi” huhifadhi uzito huo kuliko lugha inayoweza kueleweka kama uchafuzi wa mazingira tu.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Hapa neno hilo linarejelea nchi wanamoishi Waisraeli, si dunia nzima; “nchi” ni ya kawaida na huhifadhi maana ya eneo maalumu.
- source_word: כִּי הַדָּם הוּא
  choice: kwa maana damu
  rationale: Kiwakilishi הוּא kinakazia damu kama kisababishi, lakini Kiswahili cha kawaida hakihitaji kuongeza “yenyewe”; mpangilio wa sentensi unadumisha mkazo bila kuongeza uzito usio wa lazima.
- source_word: יְכֻפַּר
  choice: haiwezi kufanyiwa upatanisho
  rationale: Kauli tendwa ya כפר hapa inahusu kuondolewa kwa hatia ya damu iliyoitia nchi unajisi. “Kufanyiwa upatanisho” huhifadhi maana ya kidini na kimaadili huku ikibaki inaeleweka.
- source_word: וְלָאָרֶץ לֹא יְכֻפַּר לַדָּם
  choice: wala nchi haiwezi kufanyiwa upatanisho kwa ajili ya damu
  rationale: Muundo huu hudumisha nchi kama kitu kinachohitaji upatanisho na huunganisha hitaji hilo na damu iliyomwagwa.
- source_word: שֻׁפַּךְ
  choice: iliyomwagwa
  rationale: “Kumwaga damu” ni usemi wa kawaida na unaofaa katika muktadha wa kisheria wa kuua.
- source_word: כִּי אִם
  choice: isipokuwa
  rationale: Kifungu hiki kinaanzisha njia pekee au ubaguzi pekee, na “isipokuwa” huwasilisha jambo hilo kwa ufupi.
- source_word: בְּדַם שֹׁפְכוֹ
  choice: kwa damu ya yule aliyeimwaga
  rationale: Hii inaonyesha kwa uwazi kwamba ni damu ya muuaji, yaani yule aliyemwaga damu iliyotajwa, bila kutumia muundo mgumu au usio wa kawaida.
theological_decisions:
- issue: Maana ya nchi kutiwa unajisi kwa umwagaji damu
  choice: Tafsiri inaonyesha kwamba umwagaji damu huitia nchi unajisi wa kweli wa kimaadili na kidini, na kwamba upatanisho wake unahusishwa pekee na damu ya muuaji.
  alternative: Kuelewa lugha hii kama sitiari ya vurugu za kijamii tu au kama suala la haki ya kiraia lisilo na maana ya kidini.
  rationale: Kurudiwa kwa חנף na matumizi ya כפר kunaonyesha zaidi ya machafuko ya kijamii. Tafsiri inadumisha mvutano wa kisheria na kidini wa mstari bila kuingiza mafundisho ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “damu” na “nchi” yamedumishwa kwa sababu ni muhimu katika hoja ya Kiebrania. “Mnamoishi” ni muundo wa asili zaidi kuliko tafsiri ya neno kwa neno ya ‘mlimo.’
