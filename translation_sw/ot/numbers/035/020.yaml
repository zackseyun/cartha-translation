  text: But if he pushed him in hatred[a], or threw something at him intentionally, and he died,
translation:
  language: sw
  text: Lakini ikiwa kwa chuki alimsukuma, au akamtupia kitu kwa kumvizia[a], naye akafa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kukusudia” au “kwa nia ya uadui”; neno la Kiebrania kwa kawaida huonyesha kuvizia au kulalia shabaha, na linaweza pia kudokeza kusudi la uadui la makusudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Huanzisha sharti linalotofautiana na hali iliyotangulia; “Lakini ikiwa” linaonyesha utofauti huo kwa Kiswahili cha kawaida.
- source_word: בְּשִׂנְאָה
  choice: kwa chuki
  rationale: Kirai hiki kinaonyesha msukumo au namna ya tendo; “kwa chuki” ni cha asili na huhifadhi maana ya uadui.
- source_word: יֶהְדָּפֶנּוּ
  choice: alimsukuma
  rationale: Kitenzi kina maana ya kusukuma au kusukuma kwa nguvu; uchaguzi huu haungezi wazo la kumpiga ambalo halijasemwa wazi.
- source_word: אוֹ
  choice: au
  rationale: Kiunganishi cha kutenganisha kinachoanzisha tendo jingine linalowezekana.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: akamtupia kitu
  rationale: Kitenzi humaanisha kutupa, na yambwa halikutajwa katika Kiebrania; “kitu” kinaongezwa kwa uwazi wa kawaida wa Kiswahili bila kubainisha aina yake.
- source_word: בִּצְדִיָּה
  choice: kwa nia mbaya
  rationale: Neno linaonyesha kusudi la uadui na huenda likajumuisha kuvizia au kupanga tendo mapema. “Kwa nia mbaya” huhifadhi uadui wa makusudi bila kulifanya wazo la kuvizia kuwa maana pekee.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Hutoa matokeo ya tendo kwa mtiririko wa kawaida wa masimulizi na kuhifadhi uhusiano usiofafanuliwa zaidi katika Kiebrania.
