  edition: WLC
  text: וְ/הָי֨וּ לָ/כֶ֧ם הֶ/עָרִ֛ים לְ/מִקְלָ֖ט מִ/גֹּאֵ֑ל וְ/לֹ֤א יָמוּת֙ הָ/רֹצֵ֔חַ עַד עָמְד֛/וֹ לִ/פְנֵ֥י הָ/עֵדָ֖ה לַ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/012.yaml
  text: The cities shall be for you as a refuge from the avenger[a], so that the manslayer may not die until he stands before the congregation for judgment.
translation:
  language: sw
  text: Miji hiyo itakuwa kwenu mahali pa kukimbilia dhidi ya mlipiza kisasi[a], ili mtu aliyeua asife mpaka asimame mbele ya kusanyiko kwa hukumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mlipiza kisasi cha damu” au “jamaa anayelipiza kisasi.” Kiebrania go'el ni neno linalohusu wajibu wa jamaa wa karibu; hapa linamaanisha mtu anayelipiza kisasi kwa ajili ya damu iliyomwagika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: itakuwa
  rationale: Kauli hii ya kisheria ina maana ya wakati ujao yenye nguvu ya agizo; Kiswahili cha kawaida hutumia wakati ujao bila kulazimisha mtindo mzito wa kisheria.
- source_word: הֶעָרִים
  choice: Miji hiyo
  rationale: Nomino hii inarejelea miji iliyotajwa katika muktadha uliotangulia; “hiyo” huonyesha rejeo hilo kwa kawaida.
- source_word: לְמִקְלָט
  choice: mahali pa kukimbilia
  rationale: מִקְלָט ni mahali pa kupata hifadhi na ulinzi. Kauli hii ni ya asili na inaeleweka kwa urahisi kuliko istilahi ya kitaasisi kama “hifadhi.”
- source_word: מִגֹּאֵל
  choice: ili kumwepa mlipiza kisasi
  rationale: Katika sheria hii גֹאֵל ni jamaa mwenye wajibu wa kulipiza damu. “Mlipiza kisasi” huonyesha kazi yake katika muktadha, huku tanbihi ikihifadhi maana ya ujamaa.
- source_word: וְלֹא יָמוּת
  choice: kusudi ... asife
  rationale: Kishazi kinaonyesha kusudi au matokeo ya miji ya kukimbilia. “Asife” haiamui wazi mhusika wa kifo, sawa na Kiebrania.
- source_word: הָרֹצֵחַ
  choice: mtu aliyeua
  rationale: Neno linaweza kumaanisha mtu aliyesababisha kifo bila kuamua mapema kama alikuwa muuaji wa kukusudia. Tafsiri hii huepuka hukumu kabla ya kusikilizwa.
- source_word: עַד עָמְדוֹ
  choice: kabla hajasimama
  rationale: Baada ya kauli hasi, Kiswahili hutumia kwa kawaida “kabla haja-” kueleza mpaka wa muda unaokusudiwa na עַד pamoja na kitenzi-jina chenye kiambishi.
- source_word: לִפְנֵי הָעֵדָה
  choice: mbele ya kusanyiko
  rationale: עֵדָה hapa ni jumuiya iliyokusanyika katika jukumu la kutoa uamuzi; “kusanyiko” huhifadhi maana ya kundi lililokusanyika bila kulifanya kuwa istilahi ya dhehebu.
- source_word: לַמִּשְׁפָּט
  choice: ili ahukumiwe
  rationale: מִשְׁפָּט hapa ni mchakato au uamuzi wa kisheria. Kauli ya kitenzi ni ya kawaida katika Kiswahili na inaonyesha kusudi la kusimama mbele ya kusanyiko.
theological_decisions:
- issue: Hadhi ya הָרֹצֵחַ kabla ya uamuzi
  choice: mtu aliyeua
  alternative: muuaji; mwuaji wa kukusudia
  rationale: Aya inaahirisha matokeo hadi mtu asimame mbele ya kusanyiko kwa hukumu. “Mtu aliyeua” hakatai kwamba kifo kilitokea, lakini haamui mapema kama kilikuwa cha kukusudia au kama ana hatia ya mauaji.
- issue: Maana maalumu ya גֹאֵל katika sheria ya mauaji
  choice: mlipiza kisasi katika matini, pamoja na tanbihi kuhusu jamaa anayelipiza kisasi cha damu
  alternative: mlipiza kisasi cha damu; jamaa-mlipiza kisasi; mkombozi-mlipiza kisasi
  rationale: Neno la Kiebrania lina maana pana inayohusu wajibu wa jamaa wa karibu, lakini katika muktadha huu kazi yake ni kulipiza damu iliyomwagika. Matini kuu inabaki wazi na inayosomeka, na tanbihi inahifadhi maana ya ujamaa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kifungu cha sheria, lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo huepuka neno “muuaji” kwa kuwa linaweza kuashiria hatia iliyokwisha kuthibitishwa.
