  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִצִּ֨ילוּ הָ/עֵדָ֜ה אֶת הָ/רֹצֵ֗חַ מִ/יַּד֮ גֹּאֵ֣ל הַ/דָּם֒ וְ/הֵשִׁ֤יבוּ אֹת/וֹ֙ הָֽ/עֵדָ֔ה אֶל עִ֥יר מִקְלָט֖/וֹ אֲשֶׁר נָ֣ס שָׁ֑מָּ/ה וְ/יָ֣שַׁב בָּ֗/הּ עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל אֲשֶׁר מָשַׁ֥ח אֹת֖/וֹ בְּ/שֶׁ֥מֶן הַ/קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/025.yaml
  text: Then the congregation shall rescue the manslayer from the hand of the avenger of blood[a], and the congregation shall return him to his city of refuge, where he fled; and he shall live in it until the death of the high priest[c][b], whom he was anointed with the holy oil.
translation:
  language: sw
  text: Ndipo kusanyiko litamwokoa yule aliyeua kutoka mkononi mwa mlipiza kisasi cha damu[a], nalo kusanyiko litamrudisha katika mji wake wa makimbilio, ambako alikimbilia. Atakaa humo[b] mpaka kuhani mkuu aliyetiwa mafuta kwa mafuta matakatifu atakapokufa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mlipiza damu.” Kirai cha Kiebrania kinamtaja mtu mwenye wajibu wa kisheria wa kulipiza damu iliyomwagwa, mara nyingi ndugu wa karibu.
    reason: lexical_alternative
  - marker: b
    text: Au “ataishi humo” au “atabaki humo.”
    reason: lexical_alternative
  - marker: c
    text: Kwa neno halisi, Kiebrania kina “ambaye alimtia mafuta kwa mafuta matakatifu.” Mtendaji wa kitendo cha kutia mafuta hajatajwa wazi; ndiyo sababu hapa imetumiwa kauli tendwa.
    reason: alternative_reading
lexical_decisions:
- source_word: הִצִּילוּ
  choice: litamwokoa
  rationale: Hifili ya נצל hapa ina maana ya kumtoa mtu katika mamlaka au hatari ya mwingine; “kumwokoa” ni ya kawaida na inafaa katika muktadha huu wa ulinzi wa kisheria.
- source_word: הָעֵדָה
  choice: kusanyiko
  rationale: Neno hili humaanisha jamii iliyokusanyika na inayotekeleza wajibu wa pamoja, hapa wajibu wa hukumu; “kusanyiko” linadumisha dhana hiyo rasmi.
- source_word: הָרֹצֵחַ
  choice: yule aliyeua
  rationale: Katika sura hii neno hilo linaweza kumtaja mtu aliyesababisha kifo bila kuamua mapema kwamba aliua kwa kukusudia. “Yule aliyeua” huepuka kumhukumu kama muuaji wa kukusudia kabla ya uamuzi wa kusanyiko.
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Nahau halisi ya Kiebrania imehifadhiwa kwa Kiswahili cha kawaida na inaonyesha kuondolewa katika uwezo wa mtu mwingine.
- source_word: גֹּאֵל הַדָּם
  choice: mlipiza kisasi cha damu
  rationale: Hili ni jukumu la kisheria la mtu mwenye wajibu wa kulipiza damu iliyomwagwa. Tafsiri haiongezi wazi kwamba ni ndugu wa karibu, ingawa mara nyingi jambo hilo hudokezwa na גאל.
- source_word: וְהֵשִׁיבוּ אֹתוֹ
  choice: litamrudisha
  rationale: Hifili ya שוב humaanisha kusababisha mtu arudi; “litamrudisha” ni fupi, wazi, na ya karibu na muundo wa chanzo.
- source_word: עִיר מִקְלָטוֹ
  choice: mji wake wa makimbilio
  rationale: “Mji wa makimbilio” ni istilahi ya kawaida na inahifadhi maana ya taasisi maalumu ya kisheria katika sura hii.
- source_word: אֲשֶׁר נָס שָׁמָּה
  choice: ambako alikimbilia
  rationale: Kielezi שָׁמָּה kinaelekeza mahali alipokimbilia; Kiswahili hiki ni cha asili na kinabainisha uhusiano na mji.
- source_word: וְיָשַׁב בָּהּ
  choice: Atakaa humo
  rationale: ישב hapa inaweza kumaanisha kukaa, kuishi, au kubaki mahali. “Atakaa humo” ni ya kawaida na bado inadumisha upana huo wa maana.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: mpaka kuhani mkuu ... atakapokufa
  rationale: Muundo wa kitenzi ni wa asili zaidi katika Kiswahili kuliko nomino “mpaka kifo cha,” huku maana na cheo cha kuhani mkuu vikihifadhiwa.
- source_word: אֲשֶׁר מָשַׁח אֹתוֹ
  choice: aliyetiwa mafuta
  rationale: Kiebrania kina kitenzi tendaji cha nafsi ya tatu umoja pamoja na kiambishi cha yambwa, lakini mtendaji hatajwi. Kauli tendwa ya Kiswahili inawasilisha kwa usahihi kwamba kuhani mkuu ndiye aliyetiwa mafuta bila kubuni mtendaji; maelezo ya chini yanahifadhi hali isiyo ya kawaida ya muundo wa chanzo.
- source_word: בְּשֶׁמֶן הַקֹּדֶשׁ
  choice: kwa mafuta matakatifu
  rationale: Kirai hiki kinataja mafuta yaliyowekwa wakfu kwa upako; “mafuta matakatifu” ni wazi, cha heshima, na karibu na Kiebrania.
theological_decisions:
- issue: Hadhi ya kisheria ya הָרֹצֵחַ katika sheria ya miji ya makimbilio
  choice: yule aliyeua
  alternative: muuaji; muuaji wa kukusudia
  rationale: Sura inatofautisha kuua kwa kukusudia na kusababisha kifo bila kukusudia. “Yule aliyeua” haingizi hatia ya mauaji ya kukusudia kabla ya hukumu.
- issue: Mtendaji asiyetajwa wa מָשַׁח אֹתוֹ
  choice: Kauli tendwa “aliyetiwa mafuta,” huku umbo la Kiebrania likielezwa katika tanbihi
  alternative: ambaye alimpa mafuta; ambaye mtu fulani alimtia mafuta
  rationale: Chanzo kina umbo tendaji na kuhani mkuu akiwa yambwa, lakini hakimwambii mtendaji. Kauli tendwa huepuka kumtambua mtendaji bila ushahidi, na tanbihi inadumisha uwazi kuhusu mvutano wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Istilahi “kusanyiko,” “mji wa makimbilio,” na “kuhani mkuu” zinadumisha mazingira rasmi ya kisheria na kidini. “Yule aliyeua” limechaguliwa badala ya “muuaji” ili kuepuka maana ya hatia iliyokwisha kuthibitishwa.
