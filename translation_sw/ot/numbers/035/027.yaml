base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/027.yaml
  text: and the avenger of blood finds him outside the boundary of his city of refuge[a], and the avenger of blood kills the manslayer[b], he is not guilty of blood.
translation:
  language: sw
  text: Na mlipiza kisasi cha damu akimkuta nje ya mpaka wa mji wake wa makimbilio, naye mlipiza kisasi cha damu akamuua yule aliyeua, mlipiza kisasi huyo hana hatia ya damu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hana damu,” yaani, hana hatia ya damu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: mlipiza-kisasi cha damu
  rationale: Katika sheria hii, kirai hiki humtaja mtu mwenye mamlaka ya kulipiza kisasi kwa damu iliyomwagwa. Tafsiri hii ni wazi kwa msomaji wa Kiswahili na haiingizi waziwazi undugu ambao haukutajwa katika mstari huu.
- source_word: מִחוּץ לִגְבוּל
  choice: nje ya mpaka
  rationale: Huhifadhi maana ya mahali pamoja na mpaka wa kisheria wa eneo lenye ulinzi.
- source_word: עִיר מִקְלָטוֹ
  choice: mji wake wa makimbilio
  rationale: Ni istilahi ya kawaida na inayoeleweka kwa taasisi ya kisheria ya mji ambako muuaji alikimbilia kupata hifadhi.
- source_word: וְרָצַח
  choice: akamuua
  rationale: Kitenzi kisichoamua mapema kuwa tendo hilo ni mauaji ya jinai kinafaa hapa, kwa sababu kifungu kinachofuata kinaondoa hatia ya damu kwa mlipiza-kisasi.
- source_word: הָרֹצֵחַ
  choice: yule aliyeua
  rationale: Katika muktadha wa miji ya makimbilio, neno humaanisha mtu aliyesababisha kifo, bila kulazimisha hitimisho kwamba aliua kwa kukusudia. Kiswahili hiki ni cha kawaida na hakiongezi hukumu ya kisheria.
- source_word: אֵין לוֹ דָּם
  choice: mlipiza-kisasi huyo hatakuwa na hatia ya damu
  rationale: Hutoa maana ya nahau ya Kiebrania kwa uwazi na kumtambua mhusika anayerejelewa, huku tanbihi ikihifadhi muundo wake halisi.
theological_decisions:
- issue: Nguvu ya kimaadili na kisheria ya רצח katika muktadha wa kuua kunakoruhusiwa na sheria hii
  choice: Kutafsiri kwa kitenzi kisicho na hukumu ya jinai, “akamuua.”
  alternative: Kutafsiri “akamwua kwa jinai” au “akamwua kikatili.”
  rationale: Mstari unasema kwamba mlipiza-kisasi hana hatia ya damu; kwa hiyo tafsiri inayodokeza moja kwa moja mauaji ya jinai ingeleta mgongano usiokuwapo katika muktadha wa sheria ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa kuwa wa kisheria lakini unaosomeka kwa urahisi. “Mlipiza-kisasi cha damu” ni sahihi zaidi kisarufi kuliko “mlipiza-kisasi wa damu,” kwa kuwa kinacholipizwa ni kisasi cha damu iliyomwagwa.
