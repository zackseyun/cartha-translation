  yaml_path: translation/ot/numbers/035/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: sw
  text: 'Yahwe[a] akamwambia Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH; kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akamwambia
  rationale: Kitenzi דבר katika fomula hii ya simulizi kinaonyesha kwamba Yahwe alisema maneno kwa Musa. Kiswahili cha kawaida hutumia “akamwambia” kwa mtendaji, mpokeaji, na kauli inayofuata, huku kiunganishi “aka-” kikionyesha hatua mpya katika simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA,” ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: אֶל־מֹשֶׁה
  choice: Musa
  rationale: Katika “akamwambia Musa,” kiambishi cha yambwa “-mw-” pamoja na jina Musa huwasilisha kwa kawaida maana ya kwamba maneno yalielekezwa kwa Musa; Musa ni umbo lililozoeleka katika Kiswahili.
- source_word: לֵאמֹר
  choice: '[imewasilishwa kwa alama ya mkato]'
  rationale: Ingawa neno hili kihalisi ni “akisema/kusema,” katika fomula ya Kiebrania linaanzisha maneno yanayofuata. Kiswahili asilia hulionyesha vizuri kwa alama ya mkato baada ya “akamwambia,” bila kurudia “akisema.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la pekee יהוה, si cheo. “Yahwe” hulihifadhi kama jina na ni utohozi unaokubalika wa matamshi yanayokadiriwa; tanbihi inaonyesha desturi nyingine bila kuibadili matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “akamwambia Musa” ni wa kawaida na unaepuka tafsiri nzito isiyo ya lazima ya fomula ya Kiebrania “alisema ... akisema.”
