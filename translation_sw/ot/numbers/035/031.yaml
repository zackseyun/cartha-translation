base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/031.yaml
  text: You shall not accept a ransom for the life of a murderer who is guilty of death[c][b][a], for he must surely be put to death.
translation:
  language: sw
  text: Msikubali fidia kwa ajili ya maisha ya muuaji anayestahili hukumu ya kifo, kwa maana ni lazima auawe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִקְחוּ
  choice: msikubali
  rationale: Katika muktadha wa kisheria pamoja na כֹּפֶר, kitenzi hiki kina maana ya kukubali au kupokea malipo; “msikubali” ni Kiswahili cha kawaida na huonyesha wazi katazo.
- source_word: כֹּפֶר
  choice: fidia
  rationale: Neno hili humaanisha malipo yanayokusudiwa kuondoa adhabu au kumwachilia mtu; “fidia” huhifadhi maana hiyo ya kisheria bila kulifanya kuwa rushwa tu.
- source_word: לְנֶפֶשׁ רֹצֵחַ
  choice: ili kuokoa maisha ya muuaji
  rationale: Kiebrania ni kwa ukaribu “kwa ajili ya uhai/nafsi ya muuaji.” Katika muktadha, malipo hayo yangetumiwa kuzuia kuuawa kwake; usemi huu unaweka maana hiyo wazi kwa Kiswahili cha kawaida.
- source_word: רֹצֵחַ
  choice: muuaji
  rationale: Sura hii hutofautisha mauaji ya bahati mbaya na mauaji yenye hatia. “Muuaji” ni neno la kawaida la Kiswahili, huku kishazi kinachofuata kikibainisha kwamba huyu anastahili kufa.
- source_word: רָשָׁע לָמוּת
  choice: anayestahili kufa
  rationale: Usemi huu wa kimahakama unaonyesha kwamba mtu ana hatia inayomfanya awajibike kwa hukumu ya kifo. “Anayestahili kufa” ni wa asili na unaeleweka vizuri kwa wasomaji wa sasa.
- source_word: כִּי מוֹת יוּמָת
  choice: kwa maana lazima auawe
  rationale: Muundo wa Kiebrania wenye kitenzi-jina na kitenzi kilichonyambuliwa unasisitiza uhakika au wajibu wa adhabu. “Lazima auawe” huhifadhi nguvu ya lazima na hali ya kutendwa kwa lugha ya asili.
theological_decisions:
- issue: Nguvu ya kisheria ya hukumu ya kifo
  choice: Aya inaweka amri ya kisheria kwamba fidia isikubaliwe ili kuondoa hukumu ya kifo ya muuaji anayestahili kufa.
  alternative: Aya inaeleza tu desturi iliyokuwapo bila kuweka wajibu mkali.
  rationale: Katazo לֹא תִקְחוּ pamoja na msisitizo wa מוֹת יוּמָת huonyesha sharti thabiti la kisheria, si maelezo ya desturi tu. Tafsiri “msikubali” na “lazima auawe” huhifadhi nguvu hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Ili kuokoa maisha” hufafanua kwa kawaida kusudi la fidia katika muktadha huu bila kuongeza fundisho la kidhehebu.
