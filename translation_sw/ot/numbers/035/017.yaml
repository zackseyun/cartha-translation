  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִ֡ם בְּ/אֶ֣בֶן יָד֩ אֲשֶׁר יָמ֨וּת בָּ֥/הּ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/017.yaml
  text: Or if he struck him with a stone in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: sw
  text: Au ikiwa alimpiga kwa jiwe la mkononi[a] ambalo lingeweza kuua, naye akafa, yeye ni muuaji; muuaji huyo lazima auawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kwa jiwe la mkono,” yaani jiwe lililoshikwa mkononi au linalofaa kutumiwa kwa mkono kama silaha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Au ikiwa
  rationale: Inaanzisha kisa kingine katika mfuatano wa masharti ya kisheria; “Au ikiwa” linaonyesha vizuri uhusiano huo katika Kiswahili.
- source_word: בְּאֶבֶן יָד
  choice: kwa jiwe la mkononi
  rationale: Kirai cha Kiebrania kihalisi ni “jiwe la mkono,” yaani jiwe linaloshikika au kufaa kutumiwa kwa mkono kama silaha; tafsiri hii inadumisha picha halisi bila kubainisha kupita kiasi.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: ambalo lingeweza kuua
  rationale: Kishazi kinaeleza uwezo wa jiwe kusababisha kifo. Hii ni lugha ya kawaida ya Kiswahili na haifungi maana kwa mhanga huyu peke yake.
- source_word: הִכָּהוּ
  choice: alimpiga
  rationale: Kitenzi נכה hapa humaanisha kupiga; “alimpiga” ni cha kawaida na hakiongezi matokeo ambayo yametajwa kando.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Kinadumisha mfuatano wa Kiebrania wa tendo na matokeo bila kuongeza maelezo.
- source_word: רֹצֵחַ הוּא
  choice: yeye ni muuaji
  rationale: Katika muktadha huu wa hukumu, רצח humtaja mtu mwenye hatia ya kuua, si mtu yeyote aliyesababisha kifo.
- source_word: מוֹת יוּמַת
  choice: lazima auawe
  rationale: Muundo wa Kiebrania unasisitiza adhabu ya kifo. “Lazima auawe” huwasilisha wajibu wa kisheria na msisitizo huo kwa Kiswahili cha asili.
- source_word: הָרֹצֵחַ
  choice: muuaji huyo
  rationale: Kurudiwa kwa nomino kunadumisha msisitizo wa kisheria, huku “huyo” likirejelea wazi mtu aliyetajwa.
theological_decisions:
- issue: Uainishaji wa kisheria wa aliyeua katika sheria kuhusu miji ya makimbilio
  choice: Kutafsiri רצח kama “muuaji,” kwa maana ya mtu mwenye hatia ya kuua.
  alternative: “mwuaji” kwa maana pana au “aliyesababisha kifo”
  rationale: Muktadha una tofautisha kuua kwa kukusudia na kuua bila kukusudia. “Muuaji” hapa hubeba hukumu ya kisheria ya kifungu bila kuingiza fundisho la dhehebu; maana yake maalumu inawekwa wazi na tendo na adhabu zinazotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi ya kisheria. Muundo umehifadhi mfuatano na msisitizo wa Kiebrania bila kuwa mgumu kusomeka.
