translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa kisheria ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi [a] imewekwa baada ya idadi ya miji ili kufuata safu ya mashauriano, ingawa tanbihi yenyewe inafafanua neno la maeneo yanayoizunguka miji.
