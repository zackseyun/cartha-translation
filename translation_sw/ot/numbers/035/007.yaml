  text: All the cities that you give to the Levites shall be forty-eight cities[a], them and their pasturelands.
translation:
  language: sw
  text: Jumla ya miji yote mtakayowapa Walawi itakuwa miji arobaini na minane, pamoja na maeneo ya malisho yanayozunguka miji hiyo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maeneo ya pamoja” au “ardhi ya wazi” kwa eneo linalozunguka miji.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: Miji yote
  rationale: Kifungu hiki kinataja jumla kamili ya miji inayozungumziwa; mpangilio huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: mtakayowapa
  rationale: Kitenzi cha nafsi ya pili wingi kinaeleza kile ambacho Waisraeli watawapa Walawi kwa mujibu wa agizo.
- source_word: לַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa watu wa kabila la Lawi.
- source_word: אַרְבָּעִים וּשְׁמֹנֶה עִיר
  choice: miji arobaini na minane
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa idadi arobaini na nane, huku nomino ikitumika katika wingi.
- source_word: אֶתְהֶן
  choice: itakuwa miji ... pamoja na
  rationale: Kiwakilishi kilichoambatanishwa na kiashiria cha yambwa kinarejelea miji iliyohesabiwa na kuisisitiza; Kiswahili cha asili huwasilisha muundo huo kwa kauli ya jumla ikifuatiwa na kile kinachojumuishwa.
- source_word: וְאֶת מִגְרְשֵׁיהֶן
  choice: pamoja na maeneo ya malisho yanayoizunguka
  rationale: מִגְרָשׁ ni eneo la wazi lililo kandokando ya mji, linaloweza kutumiwa kwa malisho. Tafsiri hii inaonyesha kazi yake na uhusiano wake na miji bila kudokeza kuwa ni mashamba ya ndani ya mji.
