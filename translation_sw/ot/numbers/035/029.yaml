translation:
  language: sw
  text: Haya yatakuwa kwenu sheria ya hukumu katika vizazi vyenu vyote, katika makazi yenu yote.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amri ya kudumu kuhusu hukumu” au “sheria ya maamuzi ya kimahakama.” Kirai cha Kiebrania kinaunganisha neno la amri au sheria iliyowekwa na neno la hukumu au utaratibu wa kimahakama.
    reason: lexical_alternative
  - marker: b
    text: Au “katika kila mahali mtakapoishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: yatakuwa
  rationale: Muundo huu katika muktadha wa sheria unaonyesha hali ya kudumu yenye nguvu ya agizo; “yatakuwa” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: אֵלֶּה
  choice: Haya
  rationale: Kiwakilishi hiki cha wingi kinarejelea masharti ya kisheria yaliyotangulia.
- source_word: לָכֶם
  choice: kwenu
  rationale: Huonyesha kwamba masharti hayo yamewekwa kwa ajili ya watu wanaozungumziwa; “kwenu” ni fupi na ya asili.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: sheria ya hukumu
  rationale: Kirai cha Kiebrania kinaunganisha amri iliyowekwa na hukumu au utaratibu wa kimahakama. Tafsiri hii inadumisha tabia yake ya kisheria bila kuondoa uwezekano wa maana zinazokaribiana.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Hueleza kutumika kwa sheria hiyo kwa mfululizo katika vizazi vyao.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: katika kila mahali mtakapoishi
  rationale: Huwasilisha kwa Kiswahili cha kawaida wigo wa maeneo yote ya makazi yao, bila kuufanya kuwa mwembamba kuliko asili.
