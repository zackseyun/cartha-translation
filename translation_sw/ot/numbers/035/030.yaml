base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/030.yaml
  text: Whoever strikes down a person[a], the murderer shall be put to death on the testimony of witnesses[b]; but one witness shall not testify against a person for death.
translation:
  language: sw
  text: Mtu yeyote anayemuua mtu[a], muuaji atauawa[b] kwa ushahidi wa mashahidi[c]; lakini shahidi mmoja hatatoa ushahidi dhidi ya mtu katika shauri la kifo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “anayempiga mtu”; katika muktadha huu wa sheria, kirai hicho humaanisha mtu aliyesababisha kifo.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hutumia mzizi uleule kwa “muuaji” na kwa tendo la kumwondolea uhai kwa hukumu; Kiswahili huepuka wazo kwamba mahakama inafanya mauaji ya jinai.
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “kwa kinywa cha mashahidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה נֶפֶשׁ
  choice: anayemuua mtu
  rationale: Katika sheria hii, kirai hiki kinamaanisha mtu anayempiga mwingine hadi kufa. Kiswahili “anayemuua mtu” kinaeleza tendo hilo kwa kawaida bila kuingiza wazo la ‘nafsi’ lisilokusudiwa hapa.
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Katika sehemu zote mbili neno hili linarejelea mwanadamu au uhai wake katika muktadha wa mahakama; “mtu” ndilo neno la kawaida na wazi zaidi.
- source_word: לְפִי עֵדִים
  choice: kwa ushahidi wa mashahidi
  rationale: Nahau ya Kiebrania “kwa kinywa cha mashahidi” humaanisha kwa msingi wa ushahidi wao. Tafsiri hii ni ya kawaida katika Kiswahili cha kisheria.
- source_word: יִרְצַח אֶת הָרֹצֵחַ
  choice: muuaji atauawa
  rationale: Kiebrania kinatumia mzizi mmoja kwa muuaji na tendo la kumwondolea uhai kwa hukumu. Muundo huu wa Kiswahili unawasilisha adhabu ya kisheria bila kusema kwamba mahakama inafanya mauaji ya jinai.
- source_word: הָרֹצֵחַ
  choice: muuaji
  rationale: Katika muktadha huu ni mtu mwenye hatia ya kuua anayestahili adhabu ya kifo. “Muuaji” ni neno la Kiswahili linaloeleweka na haliongezi ufafanuzi usiotolewa na mstari wenyewe.
- source_word: וְעֵד אֶחָד
  choice: lakini shahidi mmoja
  rationale: Kiunganishi kinaonyesha tofauti kati ya ushahidi wa mashahidi wengi na ushahidi usiotosha wa shahidi mmoja, hivyo “lakini” kinafaa kimuktadha.
- source_word: לֹא יַעֲנֶה
  choice: hatatoa ushahidi
  rationale: Katika matumizi ya mahakamani, kitenzi hiki humaanisha kujibu kama shahidi au kutoa ushahidi.
- source_word: בְנֶפֶשׁ לָמוּת
  choice: dhidi ya mtu ili auawe
  rationale: Kirai kifupi cha kisheria kinaonyesha ushahidi dhidi ya mtu unaolenga au kusababisha hukumu ya kifo. Tafsiri hii huhifadhi mhusika na matokeo ya kifo kwa Kiswahili cha kawaida.
