translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mwisho unaacha wazi kama לָמוּת inaonyesha kusudi au matokeo, kwa kutumia “ili auawe.”
