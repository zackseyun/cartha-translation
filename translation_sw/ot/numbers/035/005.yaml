translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Urudiaji wa pande nne na vipimo umehifadhiwa ili kuakisi muundo wa kisheria wa Kiebrania. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
