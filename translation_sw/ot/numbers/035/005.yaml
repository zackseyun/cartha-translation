  text: וּ/מַדֹּתֶ֞ם מִ/ח֣וּץ לָ/עִ֗יר אֶת פְּאַת קֵ֣דְמָ/ה אַלְפַּ֪יִם בָּֽ/אַמָּ֟ה וְ/אֶת פְּאַת נֶגֶב֩ אַלְפַּ֨יִם בָּ/אַמָּ֜ה וְ/אֶת פְּאַת יָ֣ם אַלְפַּ֣יִם בָּֽ/אַמָּ֗ה וְ/אֵ֨ת פְּאַ֥ת צָפ֛וֹן אַלְפַּ֥יִם בָּ/אַמָּ֖ה וְ/הָ/עִ֣יר בַּ/תָּ֑וֶךְ זֶ֚ה יִהְיֶ֣ה לָ/הֶ֔ם מִגְרְשֵׁ֖י הֶ/עָרִֽים־־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/005.yaml
  text: 'You shall measure outside the city: the east side[a], two thousand cubits; the south side, two thousand cubits; the west side, two thousand cubits; and the north side, two thousand cubits, with the city in the middle[b]. This shall be for them the pasture lands of the cities.'
translation:
  language: sw
  text: 'Mtapima nje ya mji: upande wa mashariki, dhiraa elfu mbili; upande wa kusini, dhiraa elfu mbili; upande wa magharibi[a], dhiraa elfu mbili; na upande wa kaskazini, dhiraa elfu mbili, huku mji ukiwa katikati. Haya yatakuwa kwa ajili yao malisho[b] ya miji.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi ni “bahari,” yaani upande wa magharibi kwa mujibu wa nahau ya kawaida iliyotegemea mahali ilipo Bahari ya Mediterania.
    reason: lexical_alternative
  - marker: b
    text: Au “ardhi ya pamoja” au “ardhi ya wazi” ya miji. Neno la Kiebrania hutaja ardhi inayozunguka mji, ambayo mara nyingi ilitumiwa kwa malisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדֹּתֶם
  choice: Nanyi mtapima
  rationale: Kauli hii ina nguvu ya agizo katika sheria. “Mtapima” ni ya kawaida katika Kiswahili na inadumisha tendo halisi la kupima eneo.
- source_word: מִחוּץ לָעִיר
  choice: nje ya mji
  rationale: Kirai kinaonyesha eneo linalopimwa liko nje ya mipaka ya mji.
- source_word: פְּאַת
  choice: upande
  rationale: Katika muktadha wa upimaji, neno hili linataja kila upande unaoelekea moja ya pande kuu za dira.
- source_word: קֵדְמָה
  choice: mashariki
  rationale: Ni neno la mwelekeo linalomaanisha mashariki.
- source_word: נֶגֶב
  choice: kusini
  rationale: Hapa ni mwelekeo wa dira, si jina la eneo la Negebu.
- source_word: יָם
  choice: magharibi
  rationale: Maana yake halisi ni “bahari,” lakini katika nahau ya Kiebrania hutaja magharibi, upande wa Bahari ya Mediterania; tanbihi inadumisha picha hiyo ya asili.
- source_word: צָפוֹן
  choice: kaskazini
  rationale: Ni neno la kawaida la mwelekeo wa kaskazini.
- source_word: אַלְפַּיִם בָּאַמָּה
  choice: dhiraa elfu mbili
  rationale: Kipimo cha kale kimehifadhiwa badala ya kubadilishwa kuwa kipimo cha kisasa, ili kudumisha umahususi wa matini.
- source_word: וְהָעִיר בַּתָּוֶךְ
  choice: huku mji ukiwa katikati
  rationale: Hii inaeleza mpangilio wa eneo linalozunguka mji kwa Kiswahili cha asili na wazi.
- source_word: זֶה יִהְיֶה לָהֶם
  choice: Hilo litakuwa ... lao
  rationale: Muundo huu unaonyesha eneo lililotengwa kwa ajili yao bila kuamua zaidi ya matini kuhusu aina ya umiliki.
- source_word: מִגְרְשֵׁי הֶעָרִים
  choice: eneo lao la malisho la miji
  rationale: Neno la Kiebrania hutaja ardhi ya wazi inayozunguka mji, ambayo mara nyingi hutumiwa kwa malisho. “Eneo la malisho” ni wazi kwa wasomaji wa sasa, huku tanbihi ikihifadhi upana wa maana.
