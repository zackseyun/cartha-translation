  text: וּ/מִגְרְשֵׁי֙ הֶֽ/עָרִ֔ים אֲשֶׁ֥ר תִּתְּנ֖וּ לַ/לְוִיִּ֑ם מִ/קִּ֤יר הָ/עִיר֙ וָ/ח֔וּצָ/ה אֶ֥לֶף אַמָּ֖ה סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/004.yaml
  text: And the pasture lands of the cities that you give to the Levites shall be from the wall of the city outward a thousand cubits all around[a][b].
translation:
  language: sw
  text: Na maeneo ya malisho[a] ya miji mtakayowapa Walawi yawe dhiraa elfu moja kutoka kwenye ukuta wa mji[b] kuelekea nje, kuzunguka pande zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maeneo ya matumizi ya pamoja” au “ardhi ya wazi” inayozunguka miji.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kutoka kwenye ukuta wa mji”; baadhi huelewa kwa maana pana zaidi kuwa “kutoka kwenye mpaka wa mji.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרְשֵׁי
  choice: maeneo ya malisho
  rationale: Neno hili linamaanisha ardhi ya wazi inayozunguka makazi na iliyotengwa kwa matumizi ya miji ya Walawi; katika muktadha huu, “maeneo ya malisho” linaeleza matumizi yake kwa lugha ya kawaida bila kuficha kwamba ni ardhi iliyo wazi.
- source_word: הֶעָרִים
  choice: miji
  rationale: עִיר linaweza kumaanisha mji mkubwa au mdogo; “miji” linafaa hapa na linadumisha istilahi ya kifungu kinachohusu miji ya Walawi.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: mtakayowapa
  rationale: Muundo huu unaonyesha miji ambayo wasikilizaji watawapa Walawi; “mtakayowapa” ni wa asili katika Kiswahili na unahifadhi nguvu ya wakati ujao katika agizo.
- source_word: לַלְוִיִּם
  choice: Walawi
  rationale: Hili linawataja moja kwa moja wale watakaopewa miji na maeneo yake.
- source_word: מִקִּיר הָעִיר
  choice: kutoka kwenye ukuta wa mji
  rationale: קִיר kwa kawaida ni “ukuta.” Tafsiri hii inahifadhi maana ya wazi ya Kiebrania, huku tanbihi ikitaja uwezekano wa kuelewa mpaka wa mji kwa maana pana zaidi.
- source_word: וָחוּצָה
  choice: kuelekea nje
  rationale: Umbo la Kiebrania linaonyesha mwelekeo wa kutoka ndani kwenda nje; “kuelekea nje” ni wazi na la kawaida katika Kiswahili.
- source_word: אֶלֶף אַמָּה
  choice: dhiraa elfu moja
  rationale: Kipimo cha kale kimehifadhiwa badala ya kubadilishwa kuwa kipimo cha kisasa; “dhiraa elfu moja” ni usemi uliozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: סָבִיב
  choice: kuzunguka pande zote
  rationale: Usemi huu unaonyesha kwamba kipimo kinahusu eneo lote linalouzunguka mji, si upande mmoja tu.
