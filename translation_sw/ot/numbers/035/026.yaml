  text: וְ/אִם יָצֹ֥א יֵצֵ֖א הָ/רֹצֵ֑חַ אֶת גְּבוּל֙ עִ֣יר מִקְלָט֔/וֹ אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/026.yaml
  text: But if the manslayer does indeed go out beyond the boundary of his city of refuge, to which he fled,[a]
translation:
  language: sw
  text: Lakini ikiwa mtu huyo aliyeua atatoka nje ya mpaka wa mji wake wa makimbilio ambako alikimbilia,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinarudia kitenzi kwa muundo wa kusisitiza (kihalisi, “kutoka atatoka”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Kifungu hiki kinaanzisha sharti linalotofautiana na masharti ya ulinzi yaliyotangulia; “lakini ikiwa” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: יָצֹא יֵצֵא
  choice: atatoka kabisa nje
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye nafsi unasisitiza tendo la kutoka. “Atatoka kabisa nje” hudumisha msisitizo huo na pia huonyesha wazi kuvuka mpaka.
- source_word: הָרֹצֵחַ
  choice: mtu huyo aliyeua
  rationale: Katika sheria ya miji ya makimbilio, neno hili humtaja mtu aliyesababisha kifo bila kuamua hapa kwamba alikuwa muuaji wa kukusudia. Usemi huu ni wa kawaida na haumtangulizii hukumu ya hatia.
- source_word: אֶת גְּבוּל
  choice: nje ya mpaka
  rationale: Baada ya kitenzi ‘kutoka,’ kirai hiki kina maana ya kuvuka mpaka na kwenda upande wa nje wa eneo linalolindwa.
- source_word: עִיר מִקְלָטוֹ
  choice: mji wake wa makimbilio
  rationale: Huu ni usemi wazi na wa kawaida kwa mji uliotengwa kumpa hifadhi mtu aliyeua, nao unahifadhi kiambishi cha umilikaji.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: ambako alikimbilia
  rationale: Kielezi שָׁמָּה kinaonyesha mwendo kuelekea mahali; ‘ambako alikimbilia’ huwasilisha maana hiyo kwa Kiswahili cha asili.
theological_decisions:
- issue: Iwapo הָרֹצֵחַ humhukumu mhusika kuwa muuaji wa kukusudia
  choice: mtu huyo aliyeua
  alternative: muuaji
  rationale: Muktadha wa miji ya makimbilio unajumuisha mtu aliyeua bila kukusudia. Tafsiri haipaswi kuamua mapema kiwango cha hatia ambacho kifungu hiki hakiamui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umeachwa wazi kuendelea katika mstari unaofuata, kama ilivyo katika chanzo.
