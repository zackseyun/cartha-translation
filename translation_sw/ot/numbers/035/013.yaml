base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/013.yaml
  text: And the cities that you give shall be six cities of refuge for you.
translation:
  language: sw
  text: Nayo miji mtakayotoa itakuwa miji sita ya makimbilio kwa ajili yenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֶ/עָרִים
  choice: Nayo miji
  rationale: Kiunganishi וְ pamoja na nomino yenye uainisho kimetafsiriwa kwa muunganiko wa kawaida wa Kiswahili unaoendeleza maelezo na kuipa ‘miji’ uzito wa mada.
- source_word: אֲשֶׁר תִּתֵּנוּ
  choice: mtakayotoa
  rationale: Kishazi rejeshi na kitenzi cha wakati ujao katika muktadha wa maagizo kimeunganishwa kwa umbo la Kiswahili linaloeleweka kwa urahisi; ‘kutoa’ huhifadhi maana ya msingi ya נתן bila kuongeza dhana ya kugawa.
- source_word: שֵׁשׁ
  choice: sita
  rationale: Namba imewasilishwa moja kwa moja kwa neno la kawaida la Kiswahili.
- source_word: עָרֵי מִקְלָט
  choice: miji sita ya makimbilio
  rationale: Muundo wa utegemezi umetafsiriwa kwa ‘miji ... ya makimbilio,’ usemi wa kawaida na wazi kwa mahali pa kukimbilia ili kupata usalama.
- source_word: תִּהְיֶינָה
  choice: itakuwa
  rationale: Kitenzi cha wingi wa kike kinachopatana na ‘miji’ kwa Kiebrania kimetolewa kwa upatanisho wa ngeli ya miji katika Kiswahili, huku nguvu ya matokeo/maagizo ya wakati ujao ikihifadhiwa.
- source_word: לָ/כֶם
  choice: kwa ajili yenu
  rationale: Huwasilisha kwa kawaida maana ya manufaa au mpango unaowahusu watu wanaosemewa katika wingi.
