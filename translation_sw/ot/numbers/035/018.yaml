base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/018.yaml
  text: Or if he struck him with a wooden object in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: sw
  text: Au ikiwa mtu alimpiga kwa kitu cha mbao mkononi[a], ambacho kinaweza kuua, naye akafa, huyo ni muuaji; muuaji lazima auawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kifaa cha mbao kilichoshikwa mkononi” au “kwa kitu cha mbao cha kushikwa kwa mkono.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּכְלִי עֵץ
  choice: kwa kitu cha mbao
  rationale: כְּלִי ni neno pana linaloweza kumaanisha kifaa, chombo, au silaha. Katika sheria hii ya mauaji, “kitu cha mbao” ni Kiswahili cha kawaida na hakibani maana kuliko Kiebrania.
- source_word: יָד
  choice: kilichokuwa mkononi
  rationale: Muundo huu unaelekea kueleza kitu kinachoshikiliwa au kutumiwa kwa mkono. Tafsiri hii inadumisha picha ya mkono bila kukifanya kitu hicho kiwe silaha kwa lazima.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: ambacho kingeweza kumuua
  rationale: Kishazi hiki kinaeleza uwezo wa kitu kusababisha kifo. “Kingeweza kumuua” ni usemi wa asili unaoweka wazi uwezo huo wa kuua.
- source_word: הִכָּהוּ
  choice: amempiga
  rationale: נכה humaanisha kupiga. “Amempiga” ni wazi na haisemi mapema kwamba pigo lenyewe lilimwangusha au kumuua kabla ya kishazi kinachofuata.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Hii inafuata mfuatano wa Kiebrania kwa njia ya kawaida katika Kiswahili, huku kiwakilishi kikirejelea aliyepigwa.
- source_word: רֹצֵחַ
  choice: muuaji
  rationale: Katika muktadha huu wa kisheria, “muuaji” humtaja mtu aliyepatikana na hatia ya kuua, huku Kiswahili cha kawaida kikitegemea muktadha kutofautisha mauaji ya kukusudia na kuua kwa bahati mbaya.
- source_word: מוֹת יוּמַת
  choice: lazima auawe
  rationale: Muundo wa Kiebrania unasisitiza hukumu ya kifo. “Lazima auawe” huonyesha ulazima wa kisheria na uzito wa kauli kwa Kiswahili cha sasa.
theological_decisions:
- issue: Uainishaji wa kisheria wa רֹצֵחַ katika sheria ya mauaji
  choice: muuaji
  alternative: mwuaji wa kukusudia; mtu aliyeua
  rationale: Muktadha wa karibu unatofautisha mauaji yenye hatia na kifo cha bahati mbaya na unaweka adhabu ya kifo. “Muuaji” huhifadhi hukumu ya kisheria bila kuongeza maelezo kuhusu nia ambayo hayajasemwa moja kwa moja katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya lugha ya sheria. Muundo ni wa moja kwa moja, na tanbihi huhifadhi uwezekano wa kuelewa יָד kuwa kitu kinachoshikwa au kutumiwa kwa mkono.
