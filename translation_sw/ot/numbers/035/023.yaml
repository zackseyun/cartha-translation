  rationale: Inaendeleza mfululizo wa matukio mbadala katika sheria hii.
- source_word: בְּכָל אֶבֶן אֲשֶׁר יָמוּת בָּהּ
  choice: jiwe lolote linaloweza kusababisha kifo
  rationale: Huwasilisha kwa Kiswahili cha kawaida uwezo wa jiwe kusababisha kifo, huku כָל ikibaki na maana pana ya ‘lolote.’
- source_word: בְּלֹא רְאוֹת
  choice: bila kuona
