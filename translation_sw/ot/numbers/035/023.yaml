- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Hutoa matokeo ya kitendo kwa mtiririko wa kawaida wa simulizi la kisheria.
- source_word: וְהוּא לֹא אֹיֵב לוֹ
  choice: ingawa hakuwa adui yake
  rationale: ‘Ingawa’ huonyesha nguvu ya maelezo ya kukana uadui katika muktadha bila kuongeza fundisho.
- source_word: וְלֹא מְבַקֵּשׁ רָעָתוֹ
  choice: wala hakukusudia kumdhuru
  rationale: Katika muktadha huu רָעָה ni madhara kwa mtu; usemi huu wa Kiswahili unaeleza kutokuwapo kwa nia ya kudhuru.
