base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/014.yaml
  text: You shall appoint three of the cities beyond the Jordan[a], and three of the cities in the land of Canaan[b]; they shall be cities of refuge.
translation:
  language: sw
  text: Mtatenga miji mitatu kati ya miji hiyo upande wa pili wa Yordani[a], na miji mitatu kati ya miji hiyo katika nchi ya Kanaani; miji hiyo itakuwa miji ya makimbilio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ng’ambo ya Yordani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנוּ / תִּתְּנ֖וּ
  choice: mtatenga
  rationale: Kitenzi נתן maana yake ya msingi ni ‘kutoa,’ lakini hapa katika muktadha wa kisheria kinamaanisha kutenga au kuteua miji kwa kusudi maalumu. ‘Mtatenga’ ni Kiswahili cha kawaida na huonyesha kuwekwa kwa miji hiyo kwa matumizi haya bila kuwa cha kiufundi kupita kiasi.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: upande wa pili wa Yordani
  rationale: Usemi huu unaonyesha upande mwingine wa Mto Yordani kwa mtazamo wa kijiografia. ‘Upande wa pili wa Yordani’ huhifadhi uhusiano huo bila kuamua kwa lazima ni mashariki au magharibi.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Tafsiri hii huhifadhi nomino אֶרֶץ, ‘nchi,’ na mkazo wa kifungu juu ya eneo la Kanaani.
- source_word: עָרֵי מִקְלָט
  choice: miji ya makimbilio
  rationale: Huu ni usemi wazi na wenye hadhi kwa miji iliyotengwa kuwa mahali pa kukimbilia na kupata ulinzi, bila kuleta maana za kisasa za hifadhi ya kisiasa.
- source_word: אֵת שְׁלֹשׁ הֶעָרִים ... וְאֵת שְׁלֹשׁ הֶעָרִים
  choice: miji mitatu kati ya miji hiyo ... na miji mitatu kati ya miji hiyo
  rationale: Nomino yenye uainisho ‘miji hiyo’ inaelekeza kwenye kundi la miji ambalo tayari linazungumziwa. ‘Kati ya miji hiyo’ huonyesha kwamba mitatu inachaguliwa kutoka katika kundi hilo.
- source_word: תִּהְיֶינָה
  choice: hiyo itakuwa
  rationale: Wakati usiotimilifu wa היה hapa unaonyesha hali au kazi itakayokuwa ya miji sita iliyotengwa. ‘Hiyo itakuwa’ ni ya kawaida na inafaa kwa agizo la kisheria.
