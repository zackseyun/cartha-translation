base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/021.yaml
  text: Or if he struck him with his hand in enmity and he died[a], the one who struck him must surely be put to death; he is a murderer[b]. The avenger of blood shall put the murderer to death when he meets him.
translation:
  language: sw
  text: Au ikiwa alimpiga kwa mkono kwa uadui, naye akafa,[a] basi aliyempiga sharti auawe; yeye ni muuaji. Mlipiza kisasi cha damu[b] atamuua huyo muuaji atakapokutana naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa chuki” au “kwa uhasama” badala ya “kwa uadui.”
    reason: lexical_alternative
  - marker: b
    text: Au “mlipiza damu”; kwa ufafanuzi, “jamaa mwenye wajibu wa kulipiza damu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵיבָה
  choice: kwa uadui
  rationale: Nomino אֵיבָה inaonyesha uadui au chuki. “Kwa uadui” ni Kiswahili cha kawaida katika muktadha wa kisheria na huhifadhi wazo la nia ya uhasama bila kulipanua.
- source_word: הִכָּהוּ בְיָדוֹ
  choice: alimpiga kwa mkono
  rationale: Huhifadhi kitenzi cha kawaida cha kupiga na kutaja wazi mkono kuwa njia iliyotumiwa, kama ilivyo katika tofauti za kesi za kifungu hiki.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Hufuata mfuatano rahisi wa Kiebrania huku uhusiano wa kisababishi ukibaki wazi kutokana na muktadha.
- source_word: מוֹת יוּמַת
  choice: lazima atauawa
  rationale: Muundo wa Kiebrania unasisitiza adhabu ya kifo. “Lazima atauawa” huwasilisha ulazima wa kisheria na msisitizo huo kwa Kiswahili cha asili.
- source_word: הַמַּכֶּה
  choice: aliyempiga
  rationale: Kirai hiki hurejelea mtu aliyempiga mwathiriwa; umbo la kitenzi cha uhusiano ni la kawaida na wazi kwa Kiswahili.
- source_word: רֹצֵחַ הוּא
  choice: yeye ni muuaji
  rationale: Katika muktadha huu uadui unatenganisha mauaji ya kukusudia na kifo cha bahati mbaya; “muuaji” ni neno la kawaida linalofaa kwa hatia hiyo.
- source_word: גֹּאֵל הַדָּם
  choice: mlipiza-kisasi cha damu
  rationale: Huhifadhi cheo cha kisheria na taswira ya damu katika Kiebrania. Tanbihi inaeleza maana ya jamaa bila kuiongeza moja kwa moja katika matini.
- source_word: יָמִית
  choice: atamuua
  rationale: Kitenzi hapa humtaja mlipiza-kisasi kuwa mhusika wa tendo. “Atamuua” ni wazi, cha moja kwa moja, na hakifichi nguvu ya neno la Kiebrania.
- source_word: בְּפִגְעוֹ בוֹ
  choice: atakapokutana naye
  rationale: Kirai kinaonyesha kukutana na mtu au kumkuta; tafsiri hii ni ya kawaida katika Kiswahili na haiongezi hali isiyotajwa.
theological_decisions:
- issue: Aina ya kisheria ya mauaji ya kukusudia
  choice: muuaji
  alternative: mwuaji wa mtu / aliyeua
  rationale: Kutajwa kwa uadui kunaonyesha nia ya uhasama, hivyo kifungu kinamhukumu mtu huyu kuwa na hatia ya mauaji ya kukusudia, si kusababisha kifo kwa bahati mbaya.
- issue: Maana ya גֹּאֵל הַדָּם
  choice: mlipiza-kisasi cha damu
  alternative: jamaa mwenye wajibu wa kulipiza damu
  rationale: Matini kuu huhifadhi taasisi ya kisheria ya Israeli kwa lugha fupi, huku tanbihi ikihifadhi wazi maana ya kijamaa ya גֹּאֵל bila kuingiza maelezo marefu katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi msisitizo wa adhabu, nia ya uadui, na cheo maalumu cha mlipiza-kisasi bila kuingiza msimamo wa dhehebu.
