  text: וְ/אֵ֣ת הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַ/לְוִיִּ֔ם אֵ֚ת שֵׁשׁ עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁ֣ר תִּתְּנ֔וּ לָ/נֻ֥ס שָׁ֖מָּ/ה הָ/רֹצֵ֑חַ וַ/עֲלֵי/הֶ֣ם תִּתְּנ֔וּ אַרְבָּעִ֥ים וּ/שְׁתַּ֖יִם עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/006.yaml
  text: And the cities that you give to the Levites shall be the six cities of refuge[a], which you shall give for the manslayer to flee there; and besides them you shall give forty-two cities.
translation:
  language: sw
  text: Na miji mtakayowapa Walawi itakuwa ni miji sita ya makimbilio, ambayo mtawapa ili mtu aliyeua[a] akimbilie huko; na zaidi ya hiyo mtawapa miji arobaini na miwili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwuaji.” Neno la Kiebrania hapa linatumika katika muktadha wa sheria ya miji ya makimbilio, nalo lenyewe halibainishi kama kuua kulikuwa kwa kukusudia au bila kukusudia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: miji
  rationale: עִיר inaweza kumaanisha mji; “miji” ni neno la kawaida na linalofaa katika muktadha huu wa kugawa makao.
- source_word: לַלְוִיִּם
  choice: Walawi
  rationale: Kirai hiki kinaonyesha wapokeaji wa miji; “Walawi” ndilo jina la kawaida la kundi hili katika Kiswahili cha Biblia.
- source_word: שֵׁשׁ עָרֵי הַמִּקְלָט
  choice: miji sita ya makimbilio
  rationale: מִקְלָט ni mahali pa kukimbilia ili kupata hifadhi; “miji ya makimbilio” ni usemi wa asili, wazi, na unaofaa kwa taasisi hii ya kisheria.
- source_word: לָנוּס שָׁמָּה
  choice: akimbilie huko
  rationale: נוּס humaanisha kukimbia kutoka hatarini, na שָׁמָּה huonyesha mwelekeo; “akimbilie huko” huhifadhi vipengele vyote viwili kwa Kiswahili cha kawaida.
- source_word: הָרֹצֵחַ
  choice: mtu aliyeua
  rationale: Katika sheria ya miji ya makimbilio, neno hili humtaja mtu aliyesababisha kifo bila lenyewe kuamua kama tendo lilikuwa la kukusudia au la bahati mbaya; “mtu aliyeua” huhifadhi kutobainishwa huko.
- source_word: וַעֲלֵיהֶם
  choice: na zaidi ya hiyo
  rationale: Hapa על ina maana ya nyongeza. Kiwakilishi cha Kiswahili kinarejelea jumla ya miji sita iliyotajwa, hivyo “hiyo” ni ya asili kuliko tafsiri ya neno kwa neno.
- source_word: אַרְבָּעִים וּשְׁתַּיִם עִיר
  choice: miji arobaini na miwili
  rationale: Ingawa Kiebrania hutumia nomino ya umoja baada ya hesabu, Kiswahili cha kawaida hutumia wingi “miji” pamoja na upatanisho “miwili”.
theological_decisions:
- issue: Ikiwa הָרֹצֵחַ inamaanisha muuaji wa kukusudia au mtu aliyeua bila kukusudia
  choice: mtu aliyeua
  alternative: muuaji
  rationale: “Muuaji” katika matumizi ya kawaida huweza kudokeza mauaji ya kukusudia na hivyo kuondoa utata wa kisheria uliopo katika neno la Kiebrania hapa. Tafsiri iliyochaguliwa haijaamua nia kabla ya kesi kusikilizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi umewekwa karibu na Kiebrania bila kuwa mgumu; “miji ya makimbilio” huhifadhi istilahi ya kisheria, na “mtu aliyeua” huepuka kuingiza hukumu kuhusu nia.
