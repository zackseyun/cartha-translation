base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/032.yaml
  text: And you shall not take a ransom for him who has fled to his city of refuge[b][a], so that he may return to live in the land before the death of the priest.
translation:
  language: sw
  text: Wala msipokee fidia[a] kwa ajili ya mtu aliyekimbilia mji wake wa makimbilio[b], ili arudi kukaa katika nchi kabla ya kuhani kufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “malipo ya ukombozi” au “malipo”; neno la Kiebrania כֹּפֶר humaanisha kiasi kinacholipwa kama fidia au badala ya matokeo ya kisheria.
    reason: lexical_alternative
  - marker: b
    text: Muundo wa Kiebrania umebanwa na unaweza pia kueleweka kuwa unakataza malipo yanayohusiana na mtu huyo kubaki katika mji wa makimbilio au kurudi kutoka humo kabla kuhani hajafa.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּפֶר
  choice: fidia
  rationale: “Fidia” hueleza malipo yanayotolewa ili kumkomboa mtu au kuchukua nafasi ya matokeo ya kisheria; ni sahihi zaidi hapa kuliko “hongo,” ambalo lingeongeza hukumu hasi isiyotajwa wazi katika neno la Kiebrania.
- source_word: לָנוּס
  choice: mtu aliyekimbilia
  rationale: Ingawa Kiebrania kina kitenzi-jina “kukimbia,” muktadha wa mji wa makimbilio unaelekeza kwa mtu aliyekwisha kukimbilia huko. Muundo huu ni wa kawaida katika Kiswahili na haubadili hali yake ya kisheria.
- source_word: עִיר מִקְלָטוֹ
  choice: mji wake wa makimbilio
  rationale: Huhifadhi kiambishi cha umilikaji na istilahi ya kisheria ya mahali palipotengwa kwa ajili ya usalama wa mkimbizi.
- source_word: לָשׁוּב לָשֶׁבֶת בָּאָרֶץ
  choice: ili arudi kuishi nchini
  rationale: Huwakilisha vitendo viwili vinavyohusiana—kurudi na kukaa tena—kwa Kiswahili cha kawaida. “Nchini” hapa hurejelea eneo ambako angeishi nje ya mji wa makimbilio.
- source_word: עַד מוֹת הַכֹּהֵן
  choice: kabla ya kifo cha kuhani
  rationale: Katika katazo hili, “kabla ya” huonyesha wazi kwamba fidia hairuhusiwi kuwezesha kurudi mapema. Kiebrania kinasema “kuhani,” si “kuhani mkuu,” hivyo cheo hakijaongezwa.
theological_decisions:
- issue: Nguvu ya kisheria ya katazo kuhusu kurudi kwa mtu kutoka mji wa makimbilio
  choice: Mstari unakataza kupokea fidia itakayomwezesha mtu aliyekimbilia mji wa makimbilio kurudi kuishi nchini kabla kuhani hajafa.
  alternative: Sintaksia inaweza kueleweka kuwa inakataza malipo yanayohusiana kwa upana zaidi na kukimbilia kwake, kubaki kwake, au kurudi kwake kutoka mji wa makimbilio kabla ya kifo cha kuhani.
  rationale: Kiebrania kimebanwa kisintaksia. Tafsiri kuu hutoa maana ya kisheria inayowezekana zaidi, huku tanbihi ikihifadhi uwezekano mwingine bila kuamua mvutano huo kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. “Mji wa makimbilio” limetumiwa kama istilahi thabiti ya kisheria; “kuhani mkuu” halijaingizwa kwa kuwa halipo wazi katika mstari huu.
