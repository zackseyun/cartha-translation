id: NUM.19.10
reference: Numbers 19:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ֠/כִבֶּס הָ/אֹסֵ֨ף אֶת אֵ֤פֶר הַ/פָּרָה֙ אֶת בְּגָדָ֔י/ו וְ/טָמֵ֖א עַד הָ/עָ֑רֶב וְֽ/הָיְתָ֞ה לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכָ֖/ם לְ/חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/010.yaml
  text: And the one who gathers the ashes of the heifer shall wash his clothes[a], and he shall be unclean until the evening[b]. And this shall be for the sons of Israel and for the sojourner who sojourns among them as a permanent statute.
translation:
  language: sw
  text: Naye anayekusanya majivu ya ng’ombe jike yule atazifua nguo zake, naye atakuwa najisi mpaka jioni. Kwa wana wa Israeli[a] na kwa mgeni anayeishi kati yao, hili litakuwa agizo la kudumu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Waisraeli au watu wa Israeli. Kiebrania kinasema kihalisi “wana wa Israeli,” usemi wa kijumuiya unaolihusu taifa.
    reason: lexical_alternative
  - marker: b
    text: Au “agizo la daima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹסֵף
  choice: anayekusanya
  rationale: Kitenzi kishirikishi chenye kibainishi kinamtaja mtu anayefanya tendo hilo; muundo huu ni wa kawaida katika Kiswahili na unadumisha maana ya tendo linalomtambulisha mhusika.
- source_word: אֵפֶר הַפָּרָה
  choice: majivu ya huyo ng’ombe jike
  rationale: אֵפֶר hapa ni majivu ya ibada, na פָּרָה humaanisha mnyama wa kike wa jamii ya ng’ombe. ‘Huyo’ humrejelea ng’ombe jike aliyetajwa katika muktadha wa karibu.
- source_word: כִבֶּס ... אֶת בְּגָדָיו
  choice: atazifua nguo zake
  rationale: Katika sheria za utakaso, כִבֶּס ni kufua nguo, si kuosha mwili; ‘atazifua nguo zake’ ni wazi na ya kawaida.
- source_word: וְטָמֵא
  choice: naye atakuwa najisi
  rationale: ‘Najisi’ huonyesha hali ya kutokuwa safi kiibada, bila kudokeza moja kwa moja hatia ya kimaadili.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kikomo hicho cha wakati.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kwa wana wa Israeli
  rationale: Muundo huu unadumisha nahau ya Kiebrania ya agano, huku tanbihi ikifafanua kuwa linatajwa taifa zima la Israeli.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: na kwa mgeni anayeishi kati yao
  rationale: גֵּר ni mgeni asiye mzawa ambaye anaishi ndani ya jamii; ‘mgeni anayeishi’ pia linaakisi urudiaji wa mzizi katika Kiebrania.
- source_word: לְחֻקַּת עוֹלָם
  choice: agizo la kudumu
  rationale: חֻקָּה ni agizo au sheria iliyowekwa, na עוֹלָם katika kanuni hii huonyesha kudumu kwake. ‘Agizo la kudumu’ ni la sasa, lenye hadhi, na linaeleweka kwa urahisi.
theological_decisions:
- issue: Maana ya ‘wana wa Israeli’
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Tafsiri inadumisha muundo wa Kiebrania בְּנֵי יִשְׂרָאֵל, lakini tanbihi inaonyesha kwamba ni usemi wa kijumuiya unaolihusu taifa la Israeli, si wanaume pekee.
- issue: Lugha ya unajisi wa kiibada
  choice: atakuwa najisi
  alternative: atakuwa asiye safi kiibada
  rationale: Muktadha unahusu hali ya kiibada, si hukumu ya kwamba mtu huyo ametenda uovu. Neno ‘najisi’ hudumisha istilahi ya sheria za utakaso bila kuondoa mvutano wa ibada hiyo.
- issue: Muda wa agizo
  choice: agizo la kudumu
  alternative: agizo la daima
  rationale: עוֹלָם linaweza kutafsiriwa ‘la kudumu’ au ‘la daima.’ ‘La kudumu’ linaonyesha uendelevu wa agizo katika mfumo wa agano bila kulazimisha ufafanuzi wa kiteolojia kuhusu mipaka yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wenye hadhi lakini unaoeleweka. Mpangilio wa kishazi cha mwisho umewekwa kwa namna ya asili katika Kiswahili na pia kuruhusu ‘agizo la kudumu’ kubaki hitimisho lenye uzito. Istilahi ‘najisi’ imetumiwa katika maana yake ya kiibada.
