lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Kitenzi דבר katika fomula hii kinaonyesha kwamba Yahwe alisema na watu waliotajwa; “akasema na” ni Kiswahili cha sasa na cha kawaida kwa usemi wa moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA,” ili kuhifadhi jina la pekee lililo katika matini ya Kiebrania.
- source_word: אֶל
  choice: na
  rationale: Baada ya kitenzi “kusema,” Kiswahili hutumia kwa kawaida “na” kumtaja anayeambiwa.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Hili ndilo umbo sanifu la Kiswahili la jina מֹשֶׁה.
- source_word: וְאֶל
  choice: na
  rationale: Kiunganishi kinaongeza Aroni kuwa mpokeaji wa pili wa ujumbe; Kiswahili cha kawaida hakihitaji kurudia kihusishi tofauti hapa.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Hili ndilo umbo sanifu la Kiswahili la jina אַהֲרֹן.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Neno hili ni fomula inayotanguliza maneno yanayofuata; “akisema” huhifadhi kiungo rasmi na nukuu ya mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina la pekee יהוה, si cheo. “Yahwe” hulihifadhi kwa namna inayokaribia matamshi yanayokubaliwa kwa kawaida bila kuingiza badala ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa fomula ya Kiebrania umehifadhiwa kwa “akisema,” ingawa katika mazungumzo ya kawaida neno hilo lingeweza kuachwa.
