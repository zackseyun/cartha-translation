base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/016.yaml
  text: And everyone who touches[a], in the open field, one slain by the sword, or a dead body, or a human bone, or a grave[c][b], shall be unclean seven days.
translation:
  language: sw
  text: Na mtu yeyote atakayegusa, akiwa uwandani[a], mtu aliyeuawa kwa upanga, au maiti[b], au mfupa wa binadamu[c], au kaburi, atakuwa najisi kwa siku saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa neno kwa neno, “juu ya uso wa shamba”; huu ni usemi unaomaanisha mahali pa wazi nje.
    reason: lexical_alternative
  - marker: b
    text: Au “mwili wa mtu aliyekufa.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “mfupa wa mtu”; hapa maana yake ni mabaki ya binadamu kwa ujumla, si ya mwanamume pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִגַּע
  choice: Na mtu yeyote atakayegusa
  rationale: 'כֹל pamoja na kishazi husika ina maana ya kugawa kwa ujumla: mtu yeyote anayefanya jambo hilo. Wakati ujao wa Kiswahili unafaa kwa sharti la sheria hii.'
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: huko nje uwandani
  rationale: Ingawa maana ya neno kwa neno ni ‘juu ya uso wa shamba,’ huu ni usemi unaomaanisha mahali pa wazi nje; tafsiri hii ni ya kawaida na inaeleweka.
- source_word: בַּחֲלַל חֶרֶב
  choice: mtu aliyeuawa kwa upanga
  rationale: חָלָל humaanisha mtu aliyeuawa au kuchomwa hadi kufa, huku חֶרֶב ikitaja chombo kilichotumiwa. ‘Aliyeuawa kwa upanga’ huhifadhi maana bila kuongeza maelezo yasiyokuwamo.
- source_word: אוֹ בְמֵת
  choice: au maiti
  rationale: מֵת hapa humaanisha mwili wa mtu aliyekufa; ‘maiti’ ni neno la kawaida na linalofaa katika muktadha wa unajisi.
- source_word: אוֹ בְעֶצֶם אָדָם
  choice: au mfupa wa binadamu
  rationale: אָדָם hapa ni binadamu kwa ujumla, si mwanamume mahsusi. ‘Mfupa wa binadamu’ ni sahihi na wazi.
- source_word: אוֹ בְקָבֶר
  choice: au kaburi
  rationale: קֶבֶר humaanisha kaburi au mahali pa kuzikia; ‘kaburi’ ndiyo tafsiri ya moja kwa moja na ya kawaida.
- source_word: יִטְמָא
  choice: atakuwa najisi
  rationale: Kitenzi kinataja hali ya unajisi wa kiibada katika sheria ya kikuhani. ‘Atakuwa najisi’ huhifadhi lugha ya kisheria bila ufafanuzi wa ziada.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Hiki ni kipindi cha siku saba; kihusishi ‘kwa’ huonyesha muda wa hali hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya jumla ya אָדָם
  choice: binadamu
  alternative: mwanamume
  rationale: Katika sheria hii ya usafi, neno hilo linataja mabaki ya mtu yeyote, wala halilengi jinsia ya kiume pekee.
- issue: Aina ya unajisi unaotajwa na יִטְמָא
  choice: atakuwa najisi
  alternative: atakuwa mchafu
  rationale: ‘Najisi’ hutofautisha hali ya kiibada inayotajwa katika kifungu hiki na uchafu wa kawaida wa mwili, bila kufafanua zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Najisi’ limetumiwa kama istilahi iliyozoeleka kwa unajisi wa kiibada; mpangilio wa orodha ya Kiebrania umehifadhiwa.
