  text: וְ/כֹ֛ל אֲשֶׁר יִגַּע בּ֥/וֹ הַ/טָּמֵ֖א יִטְמָ֑א וְ/הַ/נֶּ֥פֶשׁ הַ/נֹּגַ֖עַת תִּטְמָ֥א עַד הָ/עָֽרֶב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/022.yaml
  text: And everything that the unclean person touches shall become unclean[a], and the person who touches it shall be unclean until the evening.
translation:
  language: sw
  text: Na kila kitu ambacho mtu najisi atagusa kitakuwa najisi; na mtu atakayekigusa atakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: Na kila kitu ambacho
  rationale: Muundo huu unaendeleza sheria iliyotangulia na kuhifadhi maana jumuishi ya כֹל pamoja na kishazi rejeshi cha אֲשֶׁר kwa Kiswahili cha kawaida.
- source_word: יִגַּע בּוֹ
  choice: atagusa
  rationale: Kitenzi נגע pamoja na בּוֹ kinaonyesha kugusa au kuingia katika mgusano; katika Kiswahili, yambwa linaeleweka kupitia 'kila kitu ambacho,' hivyo 'atagusa' ni sahihi na ya asili.
- source_word: הַטָּמֵא
  choice: mtu asiye safi
  rationale: Kivumishi hiki kimetumiwa kama nomino kumaanisha mtu aliye katika hali ya kutokuwa safi kiibada. Kutaja 'mtu' huweka rejeo wazi.
- source_word: יִטְמָא
  choice: kitakuwa najisi
  rationale: Kitenzi kinaonyesha kitu kuingia katika hali ya unajisi kutokana na kuguswa. 'Kitakuwa najisi' huonyesha matokeo hayo bila kuyafanya kuwa hatia ya kimaadili.
- source_word: וְהַנֶּפֶשׁ
  choice: na mtu
  rationale: נֶפֶשׁ hapa humaanisha mtu mzima katika muktadha wa sheria ya ibada, si 'roho' kama sehemu tofauti ya mwanadamu.
- source_word: הַנֹּגַעַת
  choice: atakayekigusa
  rationale: Kishiriki kinaeleza mtu kwa tendo la kugusa. Kiambishi '-ki-' kinarejelea kwa kawaida kitu kilichotajwa katika kishazi cha kwanza.
- source_word: תִּטְמָא
  choice: atakuwa najisi
  rationale: Tafsiri hii inalenga hali ya unajisi itakayompata mtu aliyegusa kitu hicho.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Huu ni usemi wa kawaida na wazi wa Kiswahili kwa kikomo cha muda kilichoelezwa katika sheria za utakaso.
theological_decisions:
- issue: Asili ya lugha ya unajisi katika sheria ya ibada
  choice: Kutumia 'asiye safi' kwa mtu na 'najisi' kwa hali inayopitishwa kwa mguso
  alternative: Kunajisika; kuwa mchafu; kuwa na dhambi
  rationale: טמא hapa inaeleza hali ya kutokuwa safi kiibada inayopitishwa kwa mguso, si lazima uchafu wa kimwili au hatia ya kimaadili. Maneno haya yanahifadhi tofauti hiyo kwa Kiswahili kinachoeleweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi inahifadhi mfuatano wa vifungu vya Kiebrania na urudiaji wa matokeo ya unajisi bila kuongeza maelezo ya kimadhehebu.
