  text: וְ/לָקַ֣ח הַ/כֹּהֵ֗ן עֵ֥ץ אֶ֛רֶז וְ/אֵז֖וֹב וּ/שְׁנִ֣י תוֹלָ֑עַת וְ/הִשְׁלִ֕יךְ אֶל תּ֖וֹךְ שְׂרֵפַ֥ת הַ/פָּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/006.yaml
  text: Then the priest shall take cedar wood[a], hyssop, and scarlet yarn, and throw them into the midst of the burning of the cow.
translation:
  language: sw
  text: Kisha kuhani atachukua mbao ya mwerezi, hisopo,[a] na uzi mwekundu, na kuvitupa katikati ya moto wa kumteketeza ng’ombe huyo jike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho kamili wa mmea unaoitwa kwa Kiebrania אֵזוֹב haujulikani kwa hakika.
    reason: Ufafanuzi wa kutokuwa na uhakika wa kibotania.
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha ... atachukua
  rationale: Waw pamoja na qatal inaendeleza mlolongo wa maagizo ya ibada; ‘Kisha’ na wakati ujao huwasilisha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika muktadha wa ibada.
- source_word: עֵץ אֶרֶז
  choice: kipande cha mti wa mwerezi
  rationale: Kirai hiki humaanisha mbao au sehemu ya mwerezi. ‘Kipande’ kinaepusha wazo la kwamba mti mzima unatupwa motoni.
- source_word: וְאֵזוֹב
  choice: hisopo
  rationale: ‘Hisopo’ ni jina la kimapokeo linalotambulika katika tafsiri za Biblia, ingawa utambulisho kamili wa mmea wa kale haujulikani kwa hakika.
- source_word: וּשְׁנִי תוֹלָעַת
  choice: uzi mwekundu
  rationale: Kirai kinataja kitu kilichotiwa rangi nyekundu iliyotokana na mdudu wa rangi; katika muktadha huu ‘uzi mwekundu’ ni wazi na wa kawaida bila kutafsiri kihalisi neno la mdudu.
- source_word: וְהִשְׁלִיךְ
  choice: na kuvitupa
  rationale: Hiphil ya שלך ina maana ya kutupa. Kiambishi ‘vi-’ kinarejelea vitu vitatu vilivyotajwa na kufanya Kiswahili kiwe wazi.
- source_word: אֶל תּוֹךְ
  choice: katikati ya
  rationale: Kirai hiki kinaonyesha kuingizwa ndani au katikati, si kuelekezwa tu upande wa kitu.
- source_word: שְׂרֵפַת הַפָּרָה
  choice: moto unaomteketeza ng’ombe huyo jike
  rationale: Kiebrania kinataja tendo au mchakato wa kumteketeza ng’ombe jike. Kiswahili hiki ni cha asili na kinahifadhi wazo la vitu kutupwa katikati ya mchakato huo.
theological_decisions:
- issue: Maana ya פָּרָה katika ibada ya utakaso
  choice: ng’ombe huyo jike
  alternative: mtamba
  rationale: פָּרָה humaanisha ng’ombe jike, lakini yenyewe hailazimishi umri au hali ya kutowahi kuzaa inayoweza kudokezwa na ‘mtamba.’ ‘Ng’ombe jike’ ni sahihi na inaeleweka kwa wasomaji wengi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa urahisi. Muundo wa sentensi unadumisha mlolongo rasmi wa hatua za ibada bila kutumia istilahi za kidhehebu.
