id: NUM.19.18
reference: Numbers 19:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לָקַ֨ח אֵז֜וֹב וְ/טָבַ֣ל בַּ/מַּיִם֮ אִ֣ישׁ טָהוֹר֒ וְ/הִזָּ֤ה עַל הָ/אֹ֨הֶל֙ וְ/עַל כָּל הַ/כֵּלִ֔ים וְ/עַל הַ/נְּפָשׁ֖וֹת אֲשֶׁ֣ר הָֽיוּ שָׁ֑ם וְ/עַל הַ/נֹּגֵ֗עַ בַּ/עֶ֨צֶם֙ א֣וֹ בֶֽ/חָלָ֔ל א֥וֹ בַ/מֵּ֖ת א֥וֹ בַ/קָּֽבֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/018.yaml
  text: Then a clean man shall take hyssop and dip it in the water[a], and sprinkle it on the tent, on all the vessels, on the persons who were there, and on the one who touched the bone, or the slain body, or the dead person[b], or the grave.
translation:
  language: sw
  text: Kisha mwanamume aliye safi[a] atachukua hisopo na kuichovya katika yale maji. Atanyunyiza maji hayo juu ya hema, juu ya vyombo vyote, juu ya watu waliokuwa humo, na juu ya mtu aliyegusa mfupa, maiti ya mtu aliyeuawa[b], maiti ya mtu aliyekufa, au kaburi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni ‘mwanamume aliye safi,’ katika umoja wa kiume. Usafi unaozungumziwa hapa ni wa kiibada.
    reason: lexical_alternative
  - marker: b
    text: Au ‘aliyeuawa.’ Neno la Kiebrania humaanisha hasa mtu aliyeuawa kwa nguvu, tofauti na neno la jumla zaidi ‘mtu aliyekufa’ katika kirai kinachofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵזוֹב
  choice: hisopo
  rationale: Neno la kawaida la kibiblia kwa mmea uliotumiwa katika taratibu za utakaso; linahifadhi umahususi wa mmea kuliko kusema tu ‘tawi’ au ‘mmea.’
- source_word: בַּמַּיִם
  choice: katika yale maji
  rationale: Kiarifu cha Kiebrania kinarejelea maji yaliyotayarishwa kwa ajili ya kuondoa unajisi katika muktadha uliotangulia.
- source_word: אִישׁ טָהוֹר
  choice: mwanamume aliye safi
  rationale: Inahifadhi umoja wa kiume wa Kiebrania na kutumia ‘safi’ kwa hali ya kiibada, si hukumu ya maadili.
- source_word: וְהִזָּה
  choice: atanyunyiza maji hayo
  rationale: ‘Kunyunyiza’ ni kitenzi cha kawaida na cha asili kwa kuweka maji ya utakaso kwa matone; kirai ‘maji hayo’ kinaweka wazi kitu kinachonyunyizwa kutokana na muktadha.
- source_word: הָאֹהֶל
  choice: hema
  rationale: Katika muktadha huu ni hema ambamo mauti ilitokea, wala si Maskani.
- source_word: הַכֵּלִים
  choice: vyombo
  rationale: Neno hili linafaa kwa vifaa na vyombo mbalimbali vilivyokuwa ndani ya hema bila kulibana kwa aina moja tu.
- source_word: הַנְּפָשׁוֹת
  choice: watu
  rationale: Hapa neno la Kiebrania linamaanisha watu waliokuwamo, si ‘nafsi’ kwa maana ya sehemu isiyo ya mwili.
- source_word: הַנֹּגֵעַ
  choice: mtu aliyegusa
  rationale: Linawakilisha kishirikishi cha Kiebrania kinachotumiwa kama nomino na ni Kiswahili cha kawaida.
- source_word: בָּעֶצֶם
  choice: mfupa
  rationale: Umoja wa Kiebrania umehifadhiwa; muktadha unaonyesha kuwa ni mfupa wa binadamu.
- source_word: בֶחָלָל
  choice: maiti ya mtu aliyeuawa
  rationale: חָלָל humaanisha hasa mtu aliyeuawa kwa nguvu; ‘maiti’ inaonyesha wazi kuwa katika sheria hii mwili wa aliyekufa ndio unaoguswa.
- source_word: בַמֵּת
  choice: maiti ya mtu aliyekufa
  rationale: Hili ni neno la jumla zaidi kwa mtu aliyekufa na linadumisha tofauti yake na mtu aliyeuawa katika kirai kilichotangulia.
- source_word: בַקָּבֶר
  choice: kaburi
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya mahali pa kuzikia.
theological_decisions:
- issue: Istilahi ya usafi wa kiibada
  choice: safi
  alternative: takatifu; asiye na unajisi
  rationale: Aya inahusu hali ya kiibada baada ya kugusana na mauti, si ukamilifu wa maadili. ‘Safi’ huhifadhi mfumo huo bila kumfanya mtu huyo aonekane kuwa hana dhambi.
- issue: Lugha ya kiume katika אִישׁ
  choice: mwanamume
  alternative: mtu
  rationale: Nomino ya Kiebrania ni ya umoja wa kiume. Tafsiri inaihifadhi badala ya kuifanya isiwe na jinsia, huku sharti kuu katika muktadha likiwa usafi wa kiibada.
- issue: Tofauti kati ya חָלָל na מֵת
  choice: maiti ya mtu aliyeuawa; maiti ya mtu aliyekufa
  alternative: maiti; mtu aliyekufa
  rationale: 'Maneno hayo mawili hayajasawazishwa: la kwanza linamhusu aliyeuawa kwa nguvu, na la pili ni neno la jumla kwa aliyekufa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili orodha ndefu isomeke kwa urahisi. Kurudiwa kwa ‘juu ya’ kunahifadhi msisitizo na muundo wa Kiebrania, huku ‘maiti ya mtu aliyeuawa’ na ‘maiti ya mtu aliyekufa’ zikihifadhi tofauti muhimu ya msamiati wa chanzo.
