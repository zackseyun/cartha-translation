base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/014.yaml
  text: 'This is the law: when a man dies in a tent[a], everyone who enters the tent and everyone who is in the tent shall be unclean seven days.'
translation:
  language: sw
  text: 'Hii ndiyo sheria: Mtu anapokufa ndani ya hema, kila mtu anayeingia katika hema hilo na kila aliye ndani ya hema hilo[a] atakuwa najisi kwa siku saba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kila kilichomo ndani ya hema hilo.” Usemi wa Kiebrania unaweza kuwa mpana zaidi. Tafsiri kuu hufuata mlingano na “kila mtu anayeingia” na pia ukweli kwamba vyombo vinatajwa wazi katika mstari unaofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Hii ndiyo sheria
  rationale: Kauli hii inaanzisha kanuni yenye mamlaka kuhusu unajisi unaotokana na maiti. “Sheria” ni ya kawaida, wazi, na inafaa muktadha wa taratibu za ibada.
- source_word: אָדָם כִּי יָמוּת
  choice: Mtu anapokufa
  rationale: אָדָם hapa ni jina la jumla linalomhusu mwanadamu yeyote, hivyo “mtu” linaakisi maana hiyo kwa Kiswahili bila kuifanya jinsia ya kiume kuwa sehemu ya maana. Muundo wa “anapokufa” unawasilisha kisa kinachotazamiwa katika sheria.
- source_word: בְּאֹהֶל
  choice: ndani ya hema
  rationale: Kutokuwapo kwa kibainishi katika kutajwa kwa kwanza kunaanzisha hema lisilotajwa awali; Kiswahili hakihitaji kibainishi kisicho dhahiri, na “ndani ya hema” ni ya asili.
- source_word: כָּל הַבָּא אֶל הָאֹהֶל
  choice: kila mtu anayeingia katika hema hilo
  rationale: Kishirikishi pamoja na כָּל kinaonyesha mtu yeyote anayeingia. “Hema hilo” linarejelea wazi hema lililotajwa kwanza.
- source_word: וְכָל אֲשֶׁר בָּאֹהֶל
  choice: na kila aliye ndani ya hema hilo
  rationale: Sambamba na “kila mtu anayeingia,” usemi huu unaeleweka vizuri kuwa unawahusu watu waliomo. Hata hivyo, אֲשֶׁר inaweza kuwa pana zaidi, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
- source_word: יִטְמָא
  choice: atakuwa najisi
  rationale: Katika sheria za utakaso, “kuwa najisi” ni usemi wa kawaida na unaoeleweka. Wakati ujao unafaa nguvu ya matokeo ya kisheria ya kisa hiki.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Huu ni usemi wa moja kwa moja wa muda ambao hali ya unajisi inadumu.
