base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/004.yaml
  text: Then Eleazar the priest shall take some of its blood with his finger and sprinkle some of its blood seven times toward the front of the tent of meeting[a].
translation:
  language: sw
  text: Kisha Eleazari, kuhani, atachukua kwa kidole chake kiasi cha damu ya ng’ombe jike huyo, na kunyunyiza kiasi cha damu yake mara saba kuelekea mbele ya hema la kukutania.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele ya hema la kukutania.” Kirai cha Kiebrania kinaonyesha mwelekeo kuelekea upande wa mbele wa hema.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha ... atachukua
  rationale: Katika maagizo haya ya ibada, muundo huu unaonyesha hatua inayofuata; “Kisha” huwasilisha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: kuhani Eleazari
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili, na cheo chake kimetangulizwa kwa mpangilio wa asili wa Kiswahili.
- source_word: מִדָּמָהּ
  choice: kiasi cha damu yake
  rationale: Kiambishi מִן kina maana ya sehemu ya kitu hapa; si lazima damu yote ichukuliwe. Kiwakilishi kinamrejelea yule ng’ombe jike wa muktadha uliotangulia.
- source_word: בְּאֶצְבָּעוֹ
  choice: kwa kidole chake
  rationale: בְּ inaonyesha chombo kinachotumiwa katika tendo; “kwa kidole chake” ni sahihi na ya kawaida katika Kiswahili.
- source_word: וְהִזָּה
  choice: na kunyunyiza
  rationale: Kitenzi נזה katika taratibu za kikuhani humaanisha kunyunyiza damu au maji katika tendo la ibada.
- source_word: אֶל נֹכַח פְּנֵי
  choice: kuelekea mbele ya
  rationale: Kirai hiki kinaonyesha mwelekeo kuelekea upande wa mbele wa hema, bila kudokeza kuingia ndani yake.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni jina la mahali patakatifu lililo sahihi kimaana na linaloeleweka katika Kiswahili cha Biblia.
- source_word: מִדָּמָהּ
  choice: kiasi cha damu hiyo
  rationale: Kurudiwa kwa damu katika Kiebrania kumehifadhiwa ili kuonyesha wazi kwamba damu ndiyo inayotumiwa katika tendo hili la ibada; “hiyo” huzuia mkanganyiko wa kiwakilishi.
- source_word: שֶׁבַע פְּעָמִים
  choice: mara saba
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya idadi ya marudio.
