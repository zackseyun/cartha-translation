base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/003.yaml
  text: You shall give it to Eleazar the priest[a], and he shall bring it outside the camp[b], and it shall be slaughtered before him.
translation:
  language: sw
  text: Mtampa Eleazari, kuhani; naye atamtoa nje ya kambi, na atachinjwa mbele yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye atamchinja mbele yake,” ikiwa Eleazari anaeleweka kuwa mhusika wa kitenzi “atachinja.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּנְתַתֶּם
  choice: Nanyi mtampa
  rationale: Kitenzi cha Kiebrania katika muktadha huu wa maagizo kina nguvu ya amri ya wakati ujao. “Mtampa” ni Kiswahili cha kawaida na hudumisha wingi wa mhusika anayesema naye.
- source_word: אֹתָהּ
  choice: -m- / ata-
  rationale: Kiwakilishi cha Kiebrania ni cha kike umoja na kinamrejelea ng’ombe jike mwekundu. Kiswahili humrejelea mnyama huyu kwa upatanisho wa kiumbe hai, bila kulazimika kurudia nomino.
- source_word: אֶל אֶלְעָזָר הַכֹּהֵן
  choice: Eleazari kuhani
  rationale: Jina limetoholewa kwa namna ya kawaida ya Kiswahili, na cheo הַכֹּהֵן kimetafsiriwa kwa neno la kawaida “kuhani.”
- source_word: וְהוֹצִיא אֹתָהּ
  choice: naye atamtoa
  rationale: Hifili ya יצא ina maana ya kusababisha atoke, yaani kumtoa au kumpeleka nje. “Atamtoa” ni fupi, ya asili, na huhifadhi maana hiyo ya kisababishi.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kueleza mahali palipo upande wa nje wa kambi, bila kuiga muundo wa kihalisi usio wa kawaida.
- source_word: וְשָׁחַט אֹתָהּ
  choice: na atachinjwa
  rationale: Kiebrania kina kitenzi tendaji cha nafsi ya tatu umoja lakini hakimtaji wazi mtendaji. Muundo wa kutendwa katika Kiswahili unaacha utambulisho wa mchinjaji wazi na huepuka kuongeza “mtu fulani” ambaye hayumo katika maandishi.
- source_word: לְפָנָיו
  choice: mbele yake
  rationale: Hutafsiri kwa kawaida wazo la tendo kufanyika mbele ya Eleazari, yaani akiwa hapo akilishuhudia.
theological_decisions:
- issue: Utambulisho wa anayemchinja ng’ombe jike
  choice: Muundo wa kutendwa, “atachinjwa mbele yake,” haukutaji mchinjaji.
  alternative: “Naye atamchinja mbele yake,” ikimchukua Eleazari kuwa mhusika anayeendelea wa kitenzi.
  rationale: Kitenzi cha Kiebrania kina mhusika wa kiume umoja ambaye hajatajwa kwa nomino. Anaweza kueleweka kuwa Eleazari, lakini “mbele yake” pia inaweza kuonyesha kwamba mwingine anachinja huku Eleazari akishuhudia. Tafsiri kuu haipaswi kuamua utata huo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Kiunganishi “naye” kinaendeleza simulizi la maagizo, huku muundo wa kutendwa katika kishazi cha mwisho ukihifadhi utata wa Kiebrania kuhusu mchinjaji.
