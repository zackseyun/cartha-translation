  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כֹל֙ כְּלִ֣י פָת֔וּחַ אֲשֶׁ֛ר אֵין צָמִ֥יד פָּתִ֖יל עָלָ֑י/ו טָמֵ֖א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/015.yaml
  text: And every open vessel that does not have a tied cover on it is unclean.
translation:
  language: sw
  text: Na kila chombo kilicho wazi, ambacho hakina kifuniko kilichofungwa juu yake, ni najisi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kifuniko kilichokazwa” au “kifuniko kilichotiwa muhuri”; usemi wa Kiebrania unarejelea kifuniko kilichoshikiliwa kwa uthabiti juu ya chombo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Na kila
  rationale: וְ huunganisha sheria hii na muktadha uliotangulia, na כֹל pamoja na nomino ya umoja hutafsiriwa kwa kawaida kwa maana ya kila kimoja.
- source_word: כְּלִי
  choice: chombo
  rationale: Neno hili lina maana pana ya kifaa au chombo; katika sheria hii ya unajisi linarejelea chombo kinachoweza kuwa wazi.
- source_word: פָתוּחַ
  choice: kilicho wazi
  rationale: Hutoa moja kwa moja maana ya kitu kilicho wazi; kishazi kinachofuata kinaeleza kwamba hakina kifuniko kilichofungwa.
- source_word: אֲשֶׁר אֵין
  choice: ambacho hakina
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kutokuwapo kwa kitu kinachotajwa katika kishazi husishi.
- source_word: צָמִיד פָּתִיל
  choice: kifuniko kilichofungwa
  rationale: Jozi hii ya maneno inaonyesha kifuniko kilichokazwa au kushikiliwa juu ya chombo. Tafsiri hii ni ya asili bila kubainisha kupita kiasi namna ya kale ya kukifunga.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kihusishi kinaonyesha mahali kifuniko kilipo kuhusiana na chombo.
- source_word: טָמֵא הוּא
  choice: ni najisi
  rationale: Inahifadhi kauli ya moja kwa moja kuhusu hali ya unajisi bila kuongeza neno la ufafanuzi kama 'kiibada' katika matini kuu.
theological_decisions:
- issue: Asili ya unajisi
  choice: ni najisi
  alternative: ni najisi kiibada
  rationale: Muktadha unahusu sheria za utakaso, lakini Kiebrania chenyewe kinasema tu 'najisi.' Matini kuu haiongezi ufafanuzi wa kiteolojia ambao haujatamkwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Chombo' ni neno pana na linaloeleweka; 'najisi' huhifadhi msamiati wa kibiblia wa hali ya kutokuwa safi bila kuongeza maelezo katika matini kuu.
