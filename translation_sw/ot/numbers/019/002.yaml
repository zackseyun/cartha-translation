  text: זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹ֑ר דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֣וּ אֵלֶי/ךָ֩ פָרָ֨ה אֲדֻמָּ֜ה תְּמִימָ֗ה אֲשֶׁ֤ר אֵֽין בָּ/הּ֙ מ֔וּם אֲשֶׁ֛ר לֹא עָלָ֥ה עָלֶ֖י/הָ עֹֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/002.yaml
  text: 'This is the statute of the law that the LORD has commanded, saying: Speak to the sons of Israel, that they bring to you a red heifer, whole, in which there is no defect, and on which no yoke has come.'
translation:
  language: sw
  text: 'Hii ndiyo amri ya sheria ambayo BWANA aliamuru, akisema: Waambie Waisraeli wakuletee ng''ombe jike mwekundu, aliye mzima, asiye na kasoro yoyote, na ambaye hajawahi kutiwa nira.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקַּת הַתּוֹרָה
  choice: amri ya sheria
  rationale: חֻקָּה hapa ni agizo au amri iliyowekwa, huku הַתּוֹרָה ikimaanisha sheria/mafundisho; kifungu hiki ni cha kawaida na kinaeleweka kwa Kiswahili bila kupunguza uzito wa kisheria.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa muundo halisi ni ‘wana wa Israeli,’ katika muktadha huu jina la watu wote linaelezwa kwa Kiswahili cha sasa kwa ‘Waisraeli.’
- source_word: פָרָה אֲדֻמָּה
  choice: ng'ombe jike mwekundu
  rationale: פָרָה humaanisha ng'ombe jike, na אֲדֻמָּה hueleza rangi nyekundu; ‘mwekundu’ ni ulinganifu wa moja kwa moja unaofaa kwa muktadha wa ibada.
- source_word: תְּמִימָה
  choice: aliye mzima
  rationale: Neno linaweza kumaanisha kamili, mzima, au asiye na dosari. ‘Aliye mzima’ huhifadhi wazo hilo na pia hulitofautisha na kifungu kinachofuata kinachotaja kasoro waziwazi.
- source_word: מוּם
  choice: kasoro yoyote
  rationale: מוּם ni kasoro ya mwili inayoweza kumfanya mnyama asifae kwa ibada; ‘kasoro yoyote’ hutoa maana hiyo kwa uwazi.
- source_word: לֹא עָלָה עָלֶיהָ עֹל
  choice: ambaye hajawahi kutiwa nira
  rationale: Nahau ya Kiebrania inasema nira haijapanda juu yake, yaani mnyama hajawahi kufungwa nira kwa kazi; tafsiri hii ni ya asili katika Kiswahili.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ linafuata desturi pana ya tafsiri za Kiswahili ya kuwakilisha Tetragramatoni kwa herufi kubwa, bila kuingiza matamshi yasiyo na uhakika katika maandishi makuu.
- issue: Uhusiano kati ya תְּמִימָה na kutokuwa na מוּם
  choice: 'Kutafsiri yote mawili tofauti: ‘aliye mzima, asiye na kasoro yoyote’'
  alternative: ‘asiye na dosari wala kasoro’
  rationale: Chanzo kinatumia maelezo mawili yanayokaribiana lakini si lazima yafanane kabisa. Kuyahifadhi yote huepuka kufuta msisitizo au kuamua kimya kimya kwamba ni marudio kamili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili, huku maelezo yote muhimu ya Kiebrania yakihifadhiwa.
