source:
  edition: WLC
  text: וְ/אִ֤ישׁ אֲשֶׁר יִטְמָא֙ וְ/לֹ֣א יִתְחַטָּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/תּ֣וֹךְ הַ/קָּהָ֑ל כִּי֩ אֶת מִקְדַּ֨שׁ יְהוָ֜ה טִמֵּ֗א מֵ֥י נִדָּ֛ה לֹא זֹרַ֥ק עָלָ֖י/ו טָמֵ֥א הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/020.yaml
  text: But the man who becomes unclean and does not purify himself—that person shall be cut off from the midst of the assembly[a], because he has defiled the sanctuary of Yahweh. The water for impurity has not been sprinkled on him[b]; he is unclean.
translation:
  language: sw
  text: Lakini mtu ambaye anakuwa najisi, naye hajitakasi, mtu huyo atakatiliwa mbali kutoka katikati ya kusanyiko[a], kwa sababu amelitia unajisi Patakatifu pa Yahweh. Maji ya kuondoa unajisi hayakunyunyizwa juu yake[b]; yeye ni najisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi hiyo itakatiliwa mbali.” Katika kanuni hii ya kisheria ya Kiebrania, “nafsi” inaweza kumaanisha mtu mzima, si sehemu yake isiyo ya kimwili tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “maji ya unajisi”; kwa mapokeo, “maji ya kutengwa.” Kirai hiki kinamaanisha maji ya utakaso yaliyotayarishwa katika sura hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: mtu
  rationale: Ingawa nomino ya Kiebrania ni ya kiume katika umoja, hapa inamtaja mtu yeyote binafsi; “mtu” ni ya kawaida, sahihi, na ya kijumla katika Kiswahili.
- source_word: יִטְמָא
  choice: anakuwa najisi
  rationale: Kitenzi kinaonyesha kuingia katika hali ya unajisi wa kiibada, si lazima kufanya kosa la kimaadili.
- source_word: יִתְחַטָּא
  choice: hajitakasi
  rationale: Katika muktadha huu umbo la hitpael linahusu kupitia utakaso kutoka katika unajisi, si kutenda dhambi kwa maana ya kawaida.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: mtu huyo atakatiliwa mbali
  rationale: נפש katika kanuni hii ya kisheria humaanisha mtu mzima. “Atakatiliwa mbali” huhifadhi nahau ya hukumu bila kuamua kama ni kifo, kufukuzwa, au hukumu ya Mungu.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: na kusanyiko
  rationale: קהל ni jumuiya iliyokusanyika; “kusanyiko” huhifadhi maana ya kijamii na kisheria, huku “na” ikitoa kwa Kiswahili maana ya kuondolewa kutoka miongoni mwao.
- source_word: מִקְדַּשׁ יְהוָה
  choice: patakatifu pa Yahwe
  rationale: מקדש ni mahali au eneo takatifu la ibada. Jina la Mungu יהוה limeandikwa “Yahwe” kwa uwazi na uaminifu kwa jina la asili.
- source_word: טִמֵּא
  choice: amepanajisi
  rationale: Umbo la piel lina maana ya kusababisha mahali patakatifu kuwa najisi; “amepanajisi” huwasilisha uzito wa kiibada kwa lugha ya kawaida.
- source_word: מֵי נִדָּה
  choice: maji ya kuondoa unajisi
  rationale: Kirai kinataja maji yaliyotayarishwa katika sura hii kwa utakaso kutoka unajisi wa kugusa maiti. Tafsiri hii inaeleza kazi yake bila kutumia “maji ya kutengwa,” ambayo inaweza kupotosha.
- source_word: זֹרַק עָלָיו
  choice: hayakunyunyizwa juu yake
  rationale: זרק katika ibada humaanisha kunyunyiza au kurusha kimiminika; “kunyunyizwa juu yake” ni Kiswahili cha kawaida katika muktadha huu.
- source_word: טָמֵא הוּא
  choice: yeye ni najisi
  rationale: Kishazi kisicho na kitenzi kinatangaza hali yake moja kwa moja; tafsiri haiongezi kwa ufafanuzi kwamba ‘anaendelea’ kuwa najisi.
theological_decisions:
- issue: Maana ya adhabu katika ‘atakatiliwa mbali’
  choice: Kuhifadhi nahau “atakatiliwa mbali” bila kutaja namna hasa ya adhabu.
  alternative: Kufukuzwa katika jumuiya; kuuawa; au kuangamizwa moja kwa moja na Mungu.
  rationale: Kanuni ya agano ya Kiebrania haifafanui hapa namna adhabu inavyotekelezwa. Nahau inadumisha uzito na mvutano wa kisheria na kitheolojia bila kuingiza uamuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi urudiaji na uzito wa tamko la kisheria, huku istilahi za unajisi na utakaso zikitofautishwa na dhambi ya kimaadili.
