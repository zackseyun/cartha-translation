  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִזָּ֤ה הַ/טָּהֹר֙ עַל הַ/טָּמֵ֔א בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/חִטְּא/וֹ֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָהֵ֥ר בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/019.yaml
  text: And the clean person shall sprinkle it on the unclean person on the third day and on the seventh day; thus he shall purify him on the seventh day. Then he shall wash his clothes and bathe in water[a], and he shall be clean at evening.
translation:
  language: sw
  text: Mtu aliye safi atamnyunyizia mtu aliye najisi maji hayo siku ya tatu na siku ya saba; hivyo atamtakasa[a] siku ya saba. Kisha huyo aliye najisi atafua nguo zake na kuoga kwa maji, naye atakuwa safi jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atamsafisha.” Kitenzi cha Kiebrania kinatokana na mzizi unaotumiwa pia kuhusu dhambi, lakini hapa kinamaanisha kumwondolea mtu unajisi wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: atamnyunyizia ... maji hayo
  rationale: Hifili ya נזה katika ibada hii ina maana ya kutumia maji ya utakaso kwa kuyanyunyizia juu ya mtu. Kitu kinachonyunyiziwa hakitajwi wazi katika mstari huu, lakini muktadha unakitambulisha kuwa maji hayo.
- source_word: הַטָּהֹר / הַטָּמֵא
  choice: mtu aliye safi / mtu aliye najisi
  rationale: Vivumishi hivi vinatumika kama nomino na vinahusu hali ya kiibada. Neno “mtu” linaonyesha matumizi ya jumla bila kufanya sheria hii ihusu wanaume pekee.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: siku ya tatu na siku ya saba
  rationale: Huu ni usemi wa kawaida na ulio wazi wa Kiswahili unaohifadhi nyakati zote mbili za ibada.
- source_word: וְחִטְּאוֹ
  choice: hivyo atamtakasa
  rationale: Katika muktadha wa unajisi unaotokana na maiti, Pieli ya חטא inamaanisha kuondoa unajisi au kutakasa, wala si lazima kusamehe dhambi ya kimaadili. “Hivyo” linaonyesha kuwa utakaso unatokana na hatua iliyoelezwa.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: atafua nguo zake
  rationale: “Kufua nguo” ni usemi wa asili wa Kiswahili kwa kuosha mavazi.
- source_word: וְרָחַץ בַּמַּיִם
  choice: kuoga kwa maji
  rationale: Kitenzi רחץ hapa kinadokeza kuosha mwili; “kuoga kwa maji” ni tafsiri fupi na ya kawaida.
- source_word: וְטָהֵר בָּעָרֶב
  choice: atakuwa safi jioni
  rationale: Kauli hii inaonyesha hali ya usafi wa kiibada inayopatikana jioni baada ya kuosha na kuoga.
theological_decisions:
- issue: Maana ya חטא na טהר katika sheria ya utakaso
  choice: Kutumia lugha ya utakaso wa kiibada
  alternative: Kutafsiri kuwa kuondolewa dhambi au kufanywa upatanisho
  rationale: Muktadha unahusu unajisi wa kugusa maiti na maji ya utakaso. Lugha ya msamaha wa maadili au upatanisho ingeongeza dai ambalo mstari wenyewe hautoi.
- issue: Jinsia ya הַטָּהֹר na הַטָּמֵא
  choice: Kutumia “mtu” kwa maana jumuishi
  alternative: Kutumia “mwanamume”
  rationale: Ingawa maumbo ya Kiebrania ni ya kiume umoja, katika sheria hii yanawakilisha mtu yeyote anayehusika na ibada, si mwanaume pekee.
- issue: Mhusika wa kufua na kuoga
  choice: Kumtaja wazi kuwa ni huyo aliye najisi
  alternative: Kuacha kiwakilishi “yeye” kikiwa na uwezekano wa kumrejelea mtu aliye safi
  rationale: Mlolongo wa utakaso na hali ya kuwa safi jioni unaonyesha kwamba anayefua nguo na kuoga ni mtu aliyekuwa najisi. Kumtaja wazi kunazuia utata usio wa lazima katika Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo wa sheria ya ibada ni wenye heshima lakini unaeleweka kwa urahisi. “Najisi” na “kutakasa” zimetumiwa kwa maana maalumu ya kiibada, huku sentensi ikimtaja wazi mhusika wa kila hatua.
