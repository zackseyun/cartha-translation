base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/017.yaml
  text: And for the unclean person they shall take some of the dust from the burning of the purification offering[b][a], and he shall put living water on it in a vessel.
translation:
  language: sw
  text: Kwa mtu aliye najisi, watachukua baadhi ya mavumbi ya uchomaji wa sadaka ya utakaso[a], naye atatia juu yake maji yaliyo hai[b] ndani ya chombo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya jadi zaidi, “majivu ya sadaka ya dhambi iliyochomwa.” Kiebrania kimetumia neno “mavumbi”; neno חטאת katika mazingira ya kikuhani linaweza kumaanisha “sadaka ya dhambi” au, kwa kazi yake, “sadaka ya utakaso.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, maji kutoka katika chemchemi au chanzo kinachotiririka; kwa Kiebrania, “maji yaliyo hai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקְחוּ
  choice: watachukua
  rationale: Kitenzi cha wingi katika muktadha wa sheria kina nguvu ya agizo la wakati ujao; ‘watachukua’ huhifadhi nafsi ya wingi kwa Kiswahili cha kawaida.
- source_word: לַטָּמֵא
  choice: kwa ajili ya mtu aliye najisi
  rationale: Kivumishi chenye kiambishi bainishi kinamtaja mtu aliye katika hali ya unajisi wa kiibada; ‘najisi’ ni istilahi inayotambulika katika muktadha huu.
- source_word: מֵעֲפַר
  choice: sehemu ya mavumbi
  rationale: עפר kimsingi ni mavumbi au chembechembe, si neno la kawaida la ‘majivu’; מן inaonyesha kuchukua kiasi kutoka katika hayo.
- source_word: שְׂרֵפַת
  choice: kuteketezwa kwa
  rationale: Nomino hii hutaja tendo au mchakato wa kuchoma; muundo huu ni wa asili na wenye hadhi katika Kiswahili.
- source_word: הַחַטָּאת
  choice: sadaka ya utakaso
  rationale: Katika sheria za kikuhani חטאת hapa hutenda kazi ya kuondoa unajisi; ‘sadaka ya utakaso’ huonyesha kazi hiyo bila kufuta tafsiri ya jadi iliyowekwa katika tanbihi.
- source_word: וְנָתַן
  choice: kisha mtu mmoja atayamiminia
  rationale: Kitenzi hubadilika kutoka wingi kwenda umoja na huenda kinamtaja mtendaji asiyeainishwa. ‘Mtu mmoja’ huhifadhi umoja bila kudai utambulisho wake; ‘kuyamiminia’ hueleza kuwekwa kwa maji juu ya mavumbi.
- source_word: עָלָיו
  choice: atayamiminia
  rationale: Kiambishi -ia huonyesha kwamba maji yanawekwa juu ya mavumbi yaliyotajwa; ngeli ya ‘mavumbi’ inaakisiwa kwa -ya-.
- source_word: מַיִם חַיִּים
  choice: maji yaliyo hai
  rationale: Tafsiri ya karibu huhifadhi taswira halisi ya Kiebrania na mwangwi wake wa kibiblia; maana ya maji safi kutoka chanzo kinachotiririka inaelezwa katika tanbihi.
- source_word: אֶל כֶּלִי
  choice: ndani ya chombo
  rationale: Kihusishi kinaelekeza maji na mavumbi kwenye chombo; ‘ndani ya chombo’ ni Kiswahili cha kawaida na huhifadhi mazingira ya kiibada.
theological_decisions:
- issue: Tafsiri ya חטאת katika muktadha wa unajisi wa kiibada
  choice: sadaka ya utakaso
  alternative: sadaka ya dhambi
  rationale: Muktadha unahusu kuondoa unajisi kwa mabaki ya ng’ombe mwekundu. ‘Sadaka ya utakaso’ huonyesha kazi ya ibada, huku tafsiri ya jadi ‘sadaka ya dhambi’ ikihifadhiwa katika tanbihi.
- issue: Tafsiri ya nahau מַיִם חַיִּים
  choice: maji yaliyo hai
  alternative: maji safi au maji yanayotiririka
  rationale: Tafsiri ya karibu huhifadhi utata na taswira ya chanzo, bila kuifupisha kimyakimya kuwa ubora wa maji pekee; ufafanuzi wa maana ya kiibada umetolewa katika tanbihi.
- issue: Mabadiliko ya mtendaji kutoka wingi kwenda umoja
  choice: watachukua … mtu mmoja atayamiminia
  alternative: watachukua … watayamiminia
  rationale: Kiebrania hubadilika wazi kutoka kitenzi cha wingi kwenda cha umoja. Tafsiri inahifadhi mvutano huo badala ya kuufanya mtendaji awe wingi katika sentensi yote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sheria ya kiibada lakini kinachoeleweka kwa msomaji wa kawaida. ‘Najisi,’ ‘sadaka,’ na ‘chombo’ huhifadhi sajili ya kibiblia; muundo umeepuka ugumu usio wa lazima huku ukihifadhi mabadiliko ya idadi ya mtendaji katika Kiebrania.
