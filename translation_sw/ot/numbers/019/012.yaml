base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/012.yaml
  text: He shall purify himself with it on the third day and on the seventh day[a], and he will be clean; but if he does not purify himself on the third day and on the seventh day[b], he will not be clean.
translation:
  language: sw
  text: Atajitakasa kwa maji hayo siku ya tatu na siku ya saba[a], naye atakuwa safi; lakini asipojitakasa siku ya tatu na siku ya saba[b], hatakuwa safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, maji ya kuondolea unajisi yaliyotayarishwa awali katika sura hii.
    reason: cross_reference
  - marker: b
    text: Au, “asipojiondolea unajisi.” Kitenzi cha Kiebrania hapa kinamaanisha kujitakasa kiibada ili kuondolewa unajisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְחַטָּא
  choice: atajisitiri?
  rationale: Katika muktadha huu wa ibada, hitpaeli ya חטא humaanisha mtu kupitia utakaso kutoka katika unajisi, si kutakaswa kutoka dhambini. Hata hivyo, katika matini ya tafsiri limetumiwa neno ‘atajitakasa,’ ambalo ni la kawaida na linaonyesha hali ya kujirejelea.
- source_word: בּוֹ
  choice: kwa hayo
  rationale: Kiwakilishi hiki kinarejelea maji ya kuondolea unajisi yaliyotayarishwa mapema katika sura. ‘Kwa hayo’ huhifadhi rejeleo la kiwakilishi bila kuongeza maelezo katika matini kuu.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: siku ya tatu
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kirai cha wakati.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: na siku ya saba
  rationale: Inahifadhi uratibu na mpangilio wa siku zilizowekwa kwa ibada ya utakaso.
- source_word: יִטְהָר
  choice: atakuwa safi
  rationale: Kitenzi טהר kinaeleza hali safi inayotokana na ibada. Tafsiri hii inakitofautisha na יתחטא, ‘ajitakase.’
- source_word: וְאִם לֹא
  choice: lakini asipo-
  rationale: Muundo huu wa Kiswahili huwasilisha kwa kawaida sharti hasi lenye nguvu ya utofautishaji.
- source_word: הוּא
  choice: a-
  rationale: Kiwakilishi cha nafsi ya tatu umoja wa kiume kinawakilishwa kwa kiambishi cha kitenzi cha Kiswahili; katika muktadha kinamrejelea mtu aliyekuwa najisi.
theological_decisions:
- issue: Maana ya lugha ya utakaso katika Hesabu 19
  choice: Aya imetafsiriwa kwa lugha ya usafi na utakaso wa kiibada.
  alternative: Kutumia lugha ya msamaha wa dhambi au utakaso wa ndani wa kiroho.
  rationale: Muktadha unahusu unajisi unaotokana na maiti na maji yaliyoagizwa kwa kuondoa unajisi. Vitenzi vya Kiebrania hapa vinaeleza hali ya usafi wa kiibada, si moja kwa moja msamaha wa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kujitakasa’ ni neno linaloeleweka kwa urahisi, huku tanbihi ikifafanua maana yake mahsusi ya kiibada. Viambishi vya nafsi katika vitenzi vinatumika kwa kawaida badala ya kulazimisha kiwakilishi huru.
