  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אָסַ֣ף אִ֣ישׁ טָה֗וֹר אֵ֚ת אֵ֣פֶר הַ/פָּרָ֔ה וְ/הִנִּ֛יחַ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה בְּ/מָק֣וֹם טָה֑וֹר וְ֠/הָיְתָה לַ/עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל לְ/מִשְׁמֶ֛רֶת לְ/מֵ֥י נִדָּ֖ה חַטָּ֥את הִֽוא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/009.yaml
  text: Then a clean man shall gather the ashes of the heifer and place them outside the camp in a clean place[a], and they shall be kept for the congregation of the sons of Israel for water for impurity[b]; it is a sin offering.
translation:
  language: sw
  text: Kisha mtu aliye safi atakusanya majivu ya yule ng’ombe jike na kuyaweka nje ya kambi, katika mahali safi. Majivu hayo yatawekwa akiba kwa ajili ya kusanyiko la Waisraeli, kwa ajili ya maji ya kuondolea unajisi[a]. Ni sadaka ya dhambi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maji ya utakaso” au “maji ya unajisi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Ni sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha sadaka ya dhambi na, katika mazingira ya ibada, sadaka ya utakaso.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ טָהוֹר
  choice: mtu aliye safi
  rationale: Katika muktadha huu טָהוֹר humaanisha usafi wa kiibada. Kiswahili cha kawaida hutumia “mtu aliye safi”; muktadha wa sheria ya ibada unaonyesha aina ya usafi unaokusudiwa.
- source_word: וְאָסַף
  choice: atakusanya
  rationale: Muundo huu unaendeleza maagizo ya utaratibu wa ibada; wakati ujao wa Kiswahili una nguvu ya agizo bila kutumia lugha nzito isiyo ya kawaida.
- source_word: אֵפֶר הַפָּרָה
  choice: majivu ya yule ndama jike
  rationale: אֵפֶר ni jina la mkusanyiko linalotafsiriwa kwa kawaida “majivu.” פָּרָה humtaja ng’ombe wa kike; “ndama jike” hudumisha umahususi wa mnyama katika muktadha huu.
- source_word: וְהִנִּיחַ
  choice: na kuyaweka
  rationale: Kitenzi kinamaanisha kuweka au kutua kitu mahali; kiwakilishi “ya-” kinarejelea majivu kwa Kiswahili cha kawaida.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Kirai hiki kina kazi ya kuonyesha mahali hapa, na “nje ya kambi” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: בְּמָקוֹם טָהוֹר
  choice: mahali safi
  rationale: Neno “safi” hudumisha uhusiano wa kileksia na טָהוֹר ya awali, huku muktadha ukionyesha usafi wa kiibada.
- source_word: וְהָיְתָה ... לְמִשְׁמֶרֶת
  choice: Majivu hayo yatahifadhiwa
  rationale: Kitenzi cha umoja wa kike kinarejelea majivu kama kitu cha mkusanyiko. Kiswahili hutumia upatanisho wa ngeli ya “majivu,” na “yatahifadhiwa” huwasilisha wazi wazo la kuwekwa kwa uangalifu.
- source_word: לַעֲדַת בְּנֵי יִשְׂרָאֵל
  choice: kwa ajili ya kusanyiko la Waisraeli
  rationale: עֲדָה ni kusanyiko au jumuiya. “Waisraeli” ni Kiswahili cha asili na chenye maana ya pamoja kwa בְּנֵי יִשְׂרָאֵל.
- source_word: לְמֵי נִדָּה
  choice: ili yatumiwe kutengeneza maji ya kuondolea unajisi
  rationale: Kirai hiki kinataja maji yanayotumiwa kuondoa unajisi wa kiibada. Tafsiri hii inaeleweka kwa wasomaji wa sasa, huku tanbihi ikihifadhi uwezekano wa muundo wa karibu zaidi na Kiebrania.
- source_word: חַטָּאת הִוא
  choice: Ni sadaka ya dhambi
  rationale: חַטָּאת inaweza kumaanisha dhambi au sadaka inayohusiana na dhambi. “Sadaka ya dhambi” hudumisha istilahi ya jadi na ya kileksia; maana ya sadaka ya utakaso imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya חַטָּאת katika ibada ya kuondoa unajisi
  choice: Ni sadaka ya dhambi
  alternative: Ni sadaka ya utakaso
  rationale: Neno la Kiebrania linaweza kutaja sadaka ya dhambi na, katika maandiko ya kikuhani, sadaka yenye kazi ya kutakasa. Matini kuu hudumisha maana ya kawaida bila kuficha maana nyingine inayowezekana, ambayo imetolewa katika tanbihi.
- issue: Maana ya נִדָּה katika kirai cha maji
  choice: maji ya kuondolea unajisi
  alternative: maji ya unajisi
  rationale: Katika muktadha huu neno linahusu hali ya unajisi wa kiibada na matumizi ya maji kuiondoa. Tafsiri ya matini kuu inaeleza kazi hiyo kwa kawaida, huku tanbihi ikihifadhi muundo wenye utata zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi zimegawanywa kwa mtiririko wa kawaida. Istilahi “unajisi” na “sadaka ya dhambi” zimetumiwa kwa usahihi wa muktadha wa ibada; tanbihi zinahifadhi utata halisi wa Kiebrania.
