  text: And he shall burn the cow before his eyes; its hide[a], its flesh, its blood, along with its dung, he shall burn.
translation:
  language: sw
  text: Kisha atamchoma kwa moto ng’ombe huyo jike mbele ya macho yake; ngozi yake, nyama yake, damu yake, pamoja na kinyesi chake, atavichoma kwa moto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׂרַף
  choice: Kisha atamchoma
  rationale: Waw pamoja na qatal katika mfuatano wa maagizo ya ibada ina nguvu ya hatua inayofuata inayopaswa kufanywa; “kisha” na wakati ujao huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: הַפָּרָה
  choice: ng’ombe huyo jike
  rationale: פָּרָה humaanisha ng’ombe wa kike. Kiswahili “ng’ombe” peke yake hakibainishi jinsia, hivyo “jike” kinahifadhi taarifa ya Kiebrania bila kudokeza isivyolazima kwamba ni mnyama mchanga.
- source_word: לְעֵינָיו
  choice: mbele ya macho yake
  rationale: Tafsiri hii inahifadhi taswira halisi ya nahau ya Kiebrania na pia maana ya kitendo kufanywa akiwa anaona.
- source_word: עֹרָהּ
  choice: ngozi yake
  rationale: עוֹר ni ngozi ya mnyama; “ngozi” ni neno la kawaida na sahihi katika muktadha huu.
- source_word: בְּשָׂרָהּ
  choice: nyama yake
  rationale: בָּשָׂר hapa ni nyama ya mwili wa mnyama; “nyama” ni ya asili zaidi katika Kiswahili kuliko tafsiri pana kama “mwili.”
- source_word: דָּמָהּ
  choice: damu yake
  rationale: Hii ni tafsiri ya moja kwa moja ya דָּם yenye kiambishi cha umilikaji.
- source_word: עַל פִּרְשָׁהּ
  choice: pamoja na kinyesi chake
  rationale: פֶּרֶשׁ hurejelea kinyesi, na עַל katika orodha hii huonyesha kuongezwa au kuambatanishwa kwa kitu kitakachochomwa.
- source_word: יִשְׂרֹף
  choice: atavichoma
  rationale: Kitenzi cha wakati usiotimilika katika agizo la sheria kinaonyesha tendo linalotakiwa. Kurudia kitenzi kunadumisha msisitizo na muundo wa Kiebrania; kiambishi “vi-” kinarejelea vitu vyote vilivyoorodheshwa kwa pamoja.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Muundo wa kurudia “atamchoma … atavichoma” umehifadhiwa ili kuakisi msisitizo wa Kiebrania. Kiwakilishi katika “macho yake” hakijafafanuliwa zaidi, ili kutotatua kimyakimya rejeo ambalo maandishi ya Kiebrania yanaacha litegemewe na muktadha.
