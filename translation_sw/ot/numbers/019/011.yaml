  yaml_path: translation/ot/numbers/019/011.yaml
  text: Whoever touches a dead body of any person shall be unclean seven days[a][b].
translation:
  language: sw
  text: Yeyote anayegusa maiti ya mtu yeyote atakuwa najisi kwa siku saba.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwili wa mtu aliyekufa”; kwa maana halisi zaidi, “aliyekufa.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “ya kila nafsi ya mwanadamu,” yaani, binadamu yeyote.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: Yeyote anayegusa
  rationale: Kivumishi-tendo chenye kibainishi kimetumiwa kama nomino kwa maana ya jumla; kauli hii ni ya kawaida katika Kiswahili na inadumisha nguvu ya sheria inayomhusu mtu yeyote.
- source_word: בְּמֵת
  choice: maiti
  rationale: מֵת humaanisha mtu aliyekufa au mwili wake. Katika muktadha wa kugusa na unajisi wa kiibada, “maiti” ni neno la Kiswahili lililo wazi, la kawaida na lenye heshima.
- source_word: לְכָל נֶפֶשׁ אָדָם
  choice: ya mtu yeyote
  rationale: Kirai hiki kinafafanua kuwa maiti inayokusudiwa ni ya mwanadamu yeyote. “Mtu” huwasilisha maana ya jumla ya אָדָם bila kuifanya ihusu wanaume pekee.
- source_word: וְטָמֵא
  choice: atakuwa najisi
  rationale: 'Katika sheria hii, kitenzi kinaonyesha matokeo ya kitendo: mtu huyo atakuwa katika hali ya unajisi wa kiibada. Wakati ujao wa Kiswahili unafaa kwa tamko hili la kisheria.'
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: “Kwa siku saba” huonyesha kwa kawaida na kwa usahihi muda ambao hali hiyo inadumu.
theological_decisions:
- issue: Maana ya אָדָם katika sheria ya jumla
  choice: mtu
  alternative: mwanadamu; mwanaume
  rationale: Katika muktadha huu אָדָם humaanisha binadamu kwa ujumla, si mtu wa jinsia ya kiume pekee. “Mtu” hudumisha upeo wa sheria bila kuingiza ubainisho wa kijinsia usiomo katika chanzo.
- issue: Maana ya טָמֵא
  choice: najisi
  alternative: asiye safi
  rationale: “Najisi” ni istilahi inayotambulika katika Kiswahili kwa hali ya kutokuwa safi kiibada. Hapa haisemi moja kwa moja kwamba mtu huyo ana hatia ya kimaadili, hivyo tafsiri haiongezi wazo la dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; “najisi” imedumishwa kama istilahi ya kiibada, na tanbihi zinaonyesha usemi halisi zaidi wa Kiebrania.
