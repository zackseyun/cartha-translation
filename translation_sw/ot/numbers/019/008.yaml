base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/008.yaml
  text: The one who burns it shall wash his clothes in water and bathe his body in water[b][a], and he shall be unclean until the evening.
translation:
  language: sw
  text: Yule anayemteketeza atafua nguo zake kwa maji na ataosha mwili wake kwa maji[a], naye atakuwa najisi[b] mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya maji” katika sehemu zote mbili. Kiebrania kwa muundo wake kinasema “ndani ya maji.”
    reason: lexical_alternative
  - marker: b
    text: “Najisi” hapa humaanisha hali ya kutokuwa safi kiibada, si lazima kuwa na hatia ya kimaadili.
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׂרֵף אֹתָהּ
  choice: anayemteketeza
  rationale: Kirai cha Kiebrania humtaja mtu anayemteketeza huyo ndama jike. Kiambishi cha ngeli ya viumbe hai '-m-' kinarejelea mnyama huyo kwa kawaida katika Kiswahili.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: atafulia nguo zake
  rationale: Kitenzi כבס kinahusu kufua nguo; 'atafulia' ni cha kawaida na huhifadhi maana ya agizo la sheria katika muktadha huu.
- source_word: בַּמַּיִם
  choice: kwa maji
  rationale: Ingawa Kiebrania kwa muundo wake kinaweza kutafsiriwa 'ndani ya maji,' katika Kiswahili 'kwa maji' ndiyo kauli ya kawaida ya chombo au njia inayotumiwa kufua na kuoga.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: na kuoga mwili wake
  rationale: רחץ hapa ni kuosha au kuoga mwili, tofauti na כבס ya kufua nguo. 'Mwili wake' hutoa maana ya kimuktadha ya בשרו kwa Kiswahili cha sasa.
- source_word: וְטָמֵא
  choice: naye atakuwa najisi
  rationale: טמא katika sheria hizi huonyesha hali ya unajisi wa kiibada. 'Atakuwa najisi' huhifadhi taarifa ya hali bila kuongeza wazo la hatia ya kimaadili.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kipindi kinachoishia jioni, bila kuifasiri mahsusi kuwa wakati wa kuzama kwa jua.
theological_decisions:
- issue: Maana ya טמא katika sheria ya utakaso
  choice: najisi
  alternative: asiye safi kiibada
  rationale: '''Najisi'' ni istilahi fupi na iliyozoeleka katika tafsiri za Biblia. Tanbihi inaeleza kuwa hapa ni hali ya kiibada, si lazima hatia ya kimaadili.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja kama sheria ya kiibada; tofauti kati ya kufua nguo na kuoga mwili imehifadhiwa. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika.
