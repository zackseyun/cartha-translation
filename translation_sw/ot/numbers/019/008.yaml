  source_fidelity: 'Maana kuu imehifadhiwa: mhusika anayemteketeza ndama jike anapaswa kufua nguo zake, kuosha mwili wake kwa maji, na atakuwa najisi hadi jioni. Hata hivyo, “atafulia nguo zake” kwa kawaida humaanisha kufua kwa ajili ya mtu mwingine au kwa kusudi fulani; haisemi moja kwa moja kwamba anafua nguo zake mwenyewe. “Atafua nguo zake” ndiyo ulinganifu sahihi wa יְכַבֵּס בְּגָדָיו. “Ataosha mwili wake” pia huonyesha kwa uwazi zaidi רחץ בשרו kuliko “kuoga mwili wake.”'
