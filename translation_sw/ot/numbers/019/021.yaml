base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/021.yaml
  text: 'And this shall be a permanent statute for them: the one who sprinkles the water for impurity shall wash his clothes[a], and the one who touches the water for impurity shall be unclean until evening.'
translation:
  language: sw
  text: 'Hili litakuwa agizo la kudumu kwao: anayenyunyiza maji ya kuondolea unajisi[a] atafua nguo zake, na anayegusa maji hayo atakuwa najisi mpaka jioni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya neno kwa neno, “maji ya unajisi”; pia yanaweza kutafsiriwa “maji ya utakaso kutokana na unajisi.” Kwa mapokeo, “maji ya kutenga.”
    reason: Muundo wa Kiebrania מֵי הַנִּדָּה unaweza kutafsiriwa kwa namna hizi; tanbihi huhifadhi usemi halisi na mbadala bila kufanya maji yenyewe yaonekane kuwa najisi.
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְחֻקַּת עוֹלָם
  choice: Hili litakuwa agizo la kudumu kwao
  rationale: Kitenzi cha umoja wa kike kinarejelea kwa maana agizo linalotajwa; “agizo la kudumu” linaonyesha kanuni iliyoamriwa yenye nguvu inayoendelea.
- source_word: וּמַזֵּה
  choice: anayenyunyiza
  rationale: Kitenzi shiriki kimetumiwa kama nomino kumaanisha mtu anayefanya tendo la kunyunyiza.
- source_word: מֵי הַנִּדָּה
  choice: maji ya kuondolea unajisi
  rationale: Katika muktadha wa Hesabu 19, haya ni maji yaliyotayarishwa kwa ibada ya kuondoa unajisi unaotokana na maiti. Tafsiri hii ni ya kawaida na wazi kwa Kiswahili, huku muundo halisi wenye utata ukihifadhiwa katika tanbihi.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: atafua nguo zake
  rationale: “Kufua nguo” ni usemi wa kawaida wa Kiswahili unaowakilisha kwa usahihi tendo lililoamriwa.
- source_word: וְהַנֹּגֵעַ
  choice: na anayegusa
  rationale: Kitenzi shiriki kimetafsiriwa sambamba na “anayenyunyiza,” kikimtaja mtu yeyote anayegusa maji hayo.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: atakuwa najisi mpaka jioni
  rationale: “Najisi” huhifadhi istilahi ya hali ya kutokuwa safi kiibada, si hatia ya kimaadili; “mpaka jioni” ni Kiswahili cha kawaida na sahihi.
theological_decisions:
- issue: Istilahi ya usafi wa kiibada katika Hesabu 19
  choice: Kutumia “najisi” na “maji ya kuondolea unajisi” kwa maana ya kiibada
  alternative: “Maji ya unajisi” au “maji ya kutenga”
  rationale: Mstari huu unahusu hali na taratibu za usafi wa kiibada, si uchafu wa kawaida wala hatia ya kimaadili. Tafsiri kuu inaeleza kazi ya maji katika muktadha, na tanbihi inadumisha muundo halisi na mbadala wa mapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kufua nguo,” “mpaka jioni,” na virai vya mtu “anayenyunyiza/anayegusa” ni vya kawaida na vya moja kwa moja; istilahi “najisi” inadumisha tofauti ya usafi wa kiibada.
