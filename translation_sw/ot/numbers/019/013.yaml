  text: כָּֽל הַ/נֹּגֵ֡עַ בְּ/מֵ֣ת בְּ/נֶפֶשׁ֩ הָ/אָדָ֨ם אֲשֶׁר יָמ֜וּת וְ/לֹ֣א יִתְחַטָּ֗א אֶת מִשְׁכַּ֤ן יְהוָה֙ טִמֵּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/יִּשְׂרָאֵ֑ל כִּי֩ מֵ֨י נִדָּ֜ה לֹא זֹרַ֤ק עָלָי/ו֙ טָמֵ֣א יִהְיֶ֔ה ע֖וֹד טֻמְאָת֥/וֹ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/013.yaml
  text: Everyone who touches a dead person[a], the body of a man who has died, and does not purify himself, has defiled the tabernacle of Yahweh, and that person shall be cut off from Israel. Because the water for impurity was not sprinkled on him, he shall be unclean; his uncleanness is still on him.
translation:
  language: sw
  text: Kila mtu anayegusa maiti, yaani mwili wa mtu aliyekufa, wala hajitakasi, ameinajisi Maskani ya Yahwe. Mtu huyo atakatiliwa mbali na Israeli. Kwa kuwa hakunyunyiziwa maji ya kuondolea unajisi[a], ataendelea kuwa najisi; unajisi wake bado uko juu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “maji ya unajisi”; yaani maji yaliyotumiwa kuondoa unajisi unaotokana na maiti. Pia inaweza kutafsiriwa “maji ya utakaso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ בְּמֵת
  choice: anayegusa maiti
  rationale: Kitenzi נגע kinaonyesha mguso wa kimwili, na מֵת katika muktadha huu ni maiti ya binadamu.
- source_word: בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת
  choice: yaani mwili wa mtu aliyekufa
  rationale: Katika sheria za unajisi unaotokana na maiti, נֶפֶשׁ hapa humaanisha mwili wa mtu aliyekufa; 'yaani' linaonyesha kuwa fungu hili linafafanua 'maiti'.
- source_word: יִתְחַטָּא
  choice: hajitakasi
  rationale: Hitpaeli ya חטא hapa inahusu utakaso wa kiibada, si toba ya dhambi ya kimaadili.
- source_word: מִשְׁכַּן יְהוָה
  choice: Maskani ya Yahwe
  rationale: מִשְׁכָּן ni makao matakatifu au Maskani; jina יהוה limetolewa kwa umbo la jina binafsi 'Yahwe'.
- source_word: טִמֵּא
  choice: ameinajisi
  rationale: Pieli inaonyesha kuitia Maskani unajisi; 'ameinajisi' ni kauli ya moja kwa moja na yenye uzito wa kiibada.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: Mtu huyo atakatiliwa mbali
  rationale: נֶפֶשׁ humaanisha mtu mwenyewe, na usemi 'atakatiliwa mbali' huhifadhi fomula ya hukumu ya agano bila kubainisha namna yake.
- source_word: מֵי נִדָּה
  choice: maji ya kuondolea unajisi
  rationale: Kwa maana halisi ni 'maji ya unajisi,' lakini kimuktadha ni maji yaliyotayarishwa kwa ajili ya kuondoa unajisi wa maiti. Tafsiri ya maana imetumika katika matini, huku umbo halisi likihifadhiwa katika tanbihi.
- source_word: זֹרַק עָלָיו
  choice: hakunyunyiziwa
  rationale: Katika ibada hii זרה humaanisha kunyunyiza; umbo tendwa linaonyesha kuwa maji hayakunyunyizwa juu yake.
- source_word: טָמֵא יִהְיֶה
  choice: ataendelea kuwa najisi
  rationale: Kauli hii inaeleza hali ya unajisi inayoendelea, jambo linalothibitishwa na kishazi kinachofuata.
- source_word: עוֹד טֻמְאָתוֹ בוֹ
  choice: unajisi wake bado uko juu yake
  rationale: עוֹד huonyesha kuendelea, na tafsiri hii huhifadhi sitiari ya unajisi kubaki juu ya mtu.
theological_decisions:
- issue: Maana ya adhabu ya וְנִכְרְתָה, 'atakatiliwa mbali'
  choice: Kuhifadhi fomula 'atakatiliwa mbali na Israeli' bila kufafanua namna ya adhabu.
  alternative: Atauawa; au atafukuzwa kutoka katika jumuiya.
  rationale: Aya yenyewe haisemi wazi kama hukumu hiyo ni kifo, kufukuzwa, au tendo la moja kwa moja la Mungu. Tafsiri haipaswi kuondoa mvutano huo.
- issue: Hali ya unajisi katika aya
  choice: Kutafsiri kwa lugha ya utakaso wa kiibada.
  alternative: Kuitafsiri kana kwamba ni hatia ya kimaadili au kutubu dhambi.
  rationale: Muktadha wa Hesabu 19 unahusu unajisi unaotokana na kugusa maiti na taratibu za kuondoa unajisi huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Maskani' limetumiwa kama istilahi inayoeleweka ya hema takatifu. Usemi wa agano 'atakatiliwa mbali' umehifadhiwa makusudi, nao haujafafanuliwa kupita ushahidi wa Kiebrania.
