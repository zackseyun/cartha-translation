base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/007.yaml
  text: Then the priest shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp[b]; but the priest shall be unclean until evening.
translation:
  language: sw
  text: Kisha kuhani atafua mavazi yake na kuosha mwili wake kwa maji, na baada ya hayo ataweza kuingia kambini[a]. Naye kuhani atakuwa najisi hadi jioni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya hayo ataingia kambini.” Kiebrania kinaweza pia kueleweka kama taarifa ya hatua inayofuata, ingawa katika muktadha huu kinaweza kuonyesha kwamba anaruhusiwa kuingia tena baada ya kuosha kama ilivyoagizwa.
    reason: lexical_alternative
  - marker: b
    text: “Najisi” hapa humaanisha hali ya kutokuwa safi kiibada, si lazima dhambi binafsi au kosa la kimaadili.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִבֶּס בְּגָדָיו
  choice: atafua mavazi yake
  rationale: Kitenzi כבס katika muktadha huu humaanisha kufua mavazi. Wakati ujao unafaa kwa maelekezo ya utaratibu wa kisheria, na “mavazi” ni lugha ya kawaida yenye hadhi.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כהן katika muktadha wa ibada.
- source_word: וְרָחַץ בְּשָׂרוֹ בַּמַּיִם
  choice: na kuosha mwili wake kwa maji
  rationale: בשר hapa humaanisha mwili wa mtu, si “nyama” kwa maana finyu. “Kuosha mwili wake kwa maji” ni Kiswahili cha asili na hudumisha tofauti na kufua mavazi.
- source_word: וְאַחַר
  choice: na baada ya hayo
  rationale: Huonyesha mfuatano wa matendo katika utaratibu huu.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: ataweza kuingia kambini
  rationale: Kauli hii inaweza kueleweka kuwa kuruhusiwa kuingia tena baada ya kuosha, badala ya kuwa amri ya lazima ya kuingia. “Kuingia kambini” ni ya kawaida na wazi.
- source_word: וְטָמֵא הַכֹּהֵן
  choice: Lakini kuhani atakuwa najisi
  rationale: Najisi ni istilahi ya kawaida ya hali ya kutokuwa safi kiibada. Kiunganishi “Lakini” huonyesha mvutano kwamba kuingia kambini kunaruhusiwa huku hali hiyo ikiendelea hadi jioni.
- source_word: עַד הָעָרֶב
  choice: hadi jioni
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya mpaka wa wakati uliotajwa.
theological_decisions:
- issue: Asili ya unajisi
  choice: hali ya kutokuwa safi kiibada, si lazima dhambi au kosa la kimaadili
  alternative: uchafu au hatia ya kimaadili
  rationale: Katika Hesabu 19, טמא hueleza hali ya kiibada inayodumu kwa muda. Neno “najisi” linahifadhi maana hiyo bila kumhukumu mtu kimaadili.
- issue: Nguvu ya יָבֹא baada ya kuosha
  choice: ruhusa ya kuingia kambini
  alternative: amri au taarifa ya moja kwa moja kwamba ataingia kambini
  rationale: Katika mfuatano huu, kitenzi kinaweza kubeba maana ya hatua inayoruhusiwa baada ya masharti ya kuosha kutimizwa. Tanbihi inadumisha uwezekano wa tafsiri ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha mfuatano wa sheria ya ibada na mvutano wa kwamba kuhani anaweza kuingia kambini lakini bado ni najisi hadi jioni.
