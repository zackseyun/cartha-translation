  text: עַל פִּ֣י יְהוָ֗ה יִסְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/עַל פִּ֥י יְהוָ֖ה יַחֲנ֑וּ כָּל יְמֵ֗י אֲשֶׁ֨ר יִשְׁכֹּ֧ן הֶ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/018.yaml
  text: At the command of Yahweh the sons of Israel set out[a], and at the command of Yahweh they camped. All the days that the cloud remained over the tabernacle, they remained camped.
translation:
  language: sw
  text: Kwa amri ya Yahwe Waisraeli waliondoka[a], na kwa amri ya Yahwe walipiga kambi. Siku zote ambazo wingu lilikaa juu ya Maskani, walikaa kambini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, Kiebrania husema, “juu ya kinywa cha Yahwe,” nahau yenye maana ya “kwa amri ya Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: kwa amri ya Yahwe
  rationale: Nahau hii, ambayo kwa neno halisi ni ‘kwa kinywa cha Yahwe,’ inaonyesha mwongozo au agizo lenye mamlaka. ‘Kwa amri ya Yahwe’ ni Kiswahili cha asili na hudumisha maana hiyo.
- source_word: יִסְעוּ
  choice: waliondoka
  rationale: Katika muktadha wa safari, kitenzi נסע humaanisha kuondoa kambi na kuanza safari. ‘Waliondoka’ ni wazi na hakiongezi maelezo yasiyosemwa moja kwa moja.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa muundo wa Kiebrania ni ‘wana wa Israeli,’ ‘Waisraeli’ ni Kiswahili cha kawaida, chenye heshima na kinachowataja watu wote wa Israeli bila kupotosha maana.
- source_word: יַחֲנוּ
  choice: walipiga kambi / waliendelea kupiga kambi
  rationale: חנה humaanisha kupiga kambi. Mwisho wa aya, kishazi cha muda ‘siku zote ambazo’ kinatoa maana ya kuendelea kukaa kambini, hivyo ‘waliendelea kupiga kambi’ huwasilisha hali hiyo ya kudumu.
- source_word: כָּל יְמֵי אֲשֶׁר
  choice: siku zote ambazo
  rationale: Tafsiri hii inadumisha kwa ukaribu usemi wa muda wa Kiebrania huku ikiwa ya kawaida katika Kiswahili.
- source_word: יִשְׁכֹּן
  choice: lilikaa
  rationale: שכן humaanisha kukaa au kuishi mahali. Wingu likiwa kiima, ‘lilikaa’ huonyesha kuendelea kuwapo bila kutumia lugha ngumu isiyo ya kawaida.
- source_word: הֶעָנָן
  choice: wingu
  rationale: Ni tafsiri ya moja kwa moja ya wingu lililoonekana na kuwaongoza Waisraeli.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: מִשְׁכָּן ni makao matakatifu ya Yahwe katikati ya Israeli. ‘Maskani’ ni istilahi ya kibiblia inayotambulika na hutofautisha mahali hapa na Hema la Kukutania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa kwa cheo, hivyo kuhifadhi jina la agano lililo katika matini.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia moja kwa moja Tetragramatoni יהוה. ‘Yahwe’ huhifadhi jina binafsi la Mungu badala ya kulibadilisha kwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kurudiwa ‘kwa amri ya Yahwe’ umehifadhiwa ili kuonyesha kwamba kuondoka na kupiga kambi kote kulitawaliwa na agizo lake.
