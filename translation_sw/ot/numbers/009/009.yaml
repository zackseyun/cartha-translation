base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/009.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: sw
  text: 'Ndipo Yahwe akasema na Musa[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa mapokeo hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Ndipo ... akasema
  rationale: Waw-consecutive inaendeleza simulizi kwa mfuatano. “Ndipo” huonyesha hatua inayofuata kwa Kiswahili cha kawaida, na “akasema” ni utangulizi wa asili wa maneno yatakayofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa na cheo “BWANA.”
- source_word: אֶל
  choice: na
  rationale: Katika Kiswahili, muundo wa kawaida ni “akasema na Musa”; “kwa Musa” pia ingewezekana, lakini “na” ni wa asili na wazi hapa.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ingawa neno hilo kwa umbo ni “akisema/kusema,” katika Kiswahili koloni hutambulisha kwa ufasaha maneno yanayofuata bila kurudia “akasema ... akisema.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Koloni limetumiwa badala ya tafsiri ngumu ya לֵאמֹר ili kuandaa moja kwa moja hotuba inayoanza katika mstari unaofuata.
