  text: וּ/בְ/יוֹם֙ הָקִ֣ים אֶת הַ/מִּשְׁכָּ֔ן כִּסָּ֤ה הֶֽ/עָנָן֙ אֶת הַ/מִּשְׁכָּ֔ן לְ/אֹ֖הֶל הָ/עֵדֻ֑ת וּ/בָ/עֶ֜רֶב יִהְיֶ֧ה עַֽל הַ/מִּשְׁכָּ֛ן כְּ/מַרְאֵה אֵ֖שׁ עַד בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/015.yaml
  text: On the day the tabernacle was set up[a], the cloud covered the tabernacle, the tent of the testimony; and in the evening it was over the tabernacle like the appearance of fire until morning.
translation:
  language: sw
  text: Siku ile maskani iliposimamishwa, wingu liliifunika maskani, yaani, hema la Ushuhuda[a]. Na jioni wingu hilo lilikuwa juu ya maskani, likionekana kama moto mpaka asubuhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hema la ushahidi.” Kirai cha Kiebrania kinaweza kutafsiriwa kwa njia zote mbili; “Ushuhuda” limetumiwa hapa kama istilahi iliyozoeleka katika muktadha wa ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם
  choice: Siku ile
  rationale: Huanzisha wakati unaorejelewa katika simulizi; kiunganishi וּ kinaeleweka kutokana na mtiririko bila kulazimisha neno la ziada mwanzoni.
- source_word: הָקִים אֶת הַמִּשְׁכָּן
  choice: maskani iliposimamishwa
  rationale: Muundo wa wakati unaonyesha siku ya kusimamishwa kwa maskani; kauli tendwa ni ya asili na sahihi katika Kiswahili.
- source_word: הַמִּשְׁכָּן
  choice: maskani
  rationale: Ni istilahi iliyozoeleka kwa makao matakatifu yanayohamishika ya Israeli jangwani.
- source_word: כִּסָּה הֶעָנָן
  choice: wingu liliifunika
  rationale: Kitenzi kina maana ya kufunika, na nomino yenye uainishaji inarejelea wingu maalumu linalojulikana katika muktadha.
- source_word: לְאֹהֶל הָעֵדֻת
  choice: yaani, hema la Ushuhuda
  rationale: Kirai hiki kinafafanua maskani kwa uhusiano wa apposition. ‘Ushuhuda’ huhifadhi istilahi ya ibada inayohusiana na ushuhuda wa agano.
- source_word: וּבָעֶרֶב יִהְיֶה
  choice: Jioni wingu hilo lilikuwa
  rationale: Wakati usiotimilika hapa unaeleza hali iliyoendelea au ya kawaida wakati wa usiku; kutaja tena wingu huondoa utata wa kiwakilishi katika Kiswahili.
- source_word: עַל הַמִּשְׁכָּן
  choice: juu ya maskani
  rationale: Huonyesha mahali pa wingu kuhusiana na maskani bila kudokeza kwamba lilikuwa ndani yake.
- source_word: כְּמַרְאֵה אֵשׁ
  choice: likionekana kama moto
  rationale: Huhifadhi ulinganisho wa mwonekano bila kusema kwamba wingu lilikuwa moto hasa.
- source_word: עַד בֹּקֶר
  choice: mpaka asubuhi
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mwisho wa kipindi hicho.
theological_decisions:
- issue: Uhusiano kati ya ‘maskani’ na ‘hema la Ushuhuda’
  choice: Kirai cha pili kinaitambulisha na kuifafanua maskani
  alternative: 'Kulichukulia kuwa mahali au mwelekeo tofauti: ‘kuelekea/kwenye hema la Ushuhuda’'
  rationale: Sintaksia inaeleweka kwa urahisi zaidi kama apposition, hivyo hema la Ushuhuda si kitu tofauti na maskani.
- issue: Asili ya mwonekano wa moto
  choice: Wingu lilionekana kama moto
  alternative: Wingu lilikuwa moto
  rationale: כְּמַרְאֵה huonyesha ufanano wa kuonekana, si lazima utambulisho wa kitu chenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Yaani’ linaweka wazi apposition ya Kiebrania; sentensi mbili zinaboresha usomaji bila kubadili uhusiano wa mawazo.
