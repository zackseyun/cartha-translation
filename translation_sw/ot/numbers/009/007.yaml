base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/007.yaml
  text: And those men said to him[a], “We are unclean by a human corpse[c][b]. Why should we be kept from presenting the offering of Yahweh at its appointed time among the sons of Israel?”
translation:
  language: sw
  text: Nao wale watu wakamwambia, “Sisi ni najisi kwa sababu ya maiti ya mtu.[a] Kwa nini tuzuiwe kuleta sadaka ya Yahweh kwa wakati wake uliowekwa miongoni mwa Waisraeli?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa neno, “kwa nafsi ya mtu”; katika sheria za unajisi, hii ni nahau inayomaanisha maiti ya mwanadamu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa neno, “katikati ya wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָאֲנָשִׁים הָהֵמָּה אֵלָיו
  choice: Nao wale watu wakamwambia
  rationale: Muundo huu unaendeleza simulizi na kuelekeza tena kwa watu waliotajwa; ‘wakamwambia’ ni Kiswahili cha kawaida na cha asili kwa kauli inayoelekezwa kwa Musa.
- source_word: אֲנַחְנוּ טְמֵאִים
  choice: Sisi ni najisi
  rationale: ‘Najisi’ huonyesha hali ya kutokuwa safi kidini inayohusika hapa, si uchafu wa kawaida tu.
- source_word: לְנֶפֶשׁ אָדָם
  choice: kwa sababu ya maiti ya mtu
  rationale: Hii ni nahau ya kisheria na kikuhani inayomaanisha unajisi unaotokana na maiti ya mwanadamu; tafsiri inaweka wazi maana bila kuongeza dai lisilotajwa wazi kuhusu namna ya kugusana nayo.
- source_word: לָמָּה נִגָּרַע
  choice: Kwa nini tuzuiwe
  rationale: Nifali ya גרע hapa ina wazo la kunyimwa au kuondolewa katika ushiriki; ‘tuzuiwe’ huhifadhi maana ya kutendwa na ni ya kawaida katika Kiswahili.
- source_word: לְבִלְתִּי הַקְרִב
  choice: kuleta
  rationale: Katika muktadha wa dhabihu, הקריב ni kuleta au kuwasilisha sadaka mbele za Mungu. ‘Kuleta’ inasomeka kwa kawaida pamoja na ‘sadaka’.
- source_word: קָרְבַּן יְהוָה
  choice: sadaka ya Yahweh
  rationale: קָרְבָּן ni kitu kinacholetwa kama sadaka, na jina la agano יהוה limetoholewa kuwa ‘Yahweh’ badala ya kubadilishwa na cheo.
- source_word: בְּמֹעֲדוֹ
  choice: kwa wakati wake uliowekwa
  rationale: מוֹעֵד hapa ni wakati maalumu uliopangwa kwa sadaka hiyo; kiwakilishi ‘wake’ huhifadhi rejeo la Kiebrania kwa sadaka.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: pamoja na Waisraeli
  rationale: Nahau ‘wana wa Israeli’ ni jina la pamoja la taifa hapa. ‘Waisraeli’ ni Kiswahili cha sasa na cha kawaida, huku ‘pamoja na’ kikionyesha ushiriki wao ndani ya jumuiya.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, יהוה; ‘Yahweh’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לְנֶפֶשׁ אָדָם katika sheria ya unajisi
  choice: kwa sababu ya maiti ya mtu
  alternative: kwa kugusa maiti ya mtu
  rationale: Muktadha unaonyesha unajisi wa maiti, lakini mstari huu wenyewe hautaji wazi kitendo cha kugusa; uchaguzi huu haubani zaidi ya ushahidi wa maandishi.
- issue: Nguvu ya נִגָּרַע
  choice: tuzuiwe
  alternative: tunyimwe
  rationale: Neno linaweza kueleweka kama kuzuiwa, kuondolewa, au kunyimwa ushiriki. ‘Tuzuiwe’ huhifadhi malalamiko yao bila kuamua ikiwa hatua hiyo ni kutengwa rasmi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Najisi’ limetumiwa kama istilahi fupi ya kidini; sentensi ya swali imewekwa katika Kiswahili cha sasa bila kupoteza hali ya malalamiko.
