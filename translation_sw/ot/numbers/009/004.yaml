translation:
  language: sw
  text: Basi Musa akawaambia Waisraeli waiadhimishe Pasaka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר ... אֶל
  choice: akawaambia
  rationale: Katika muktadha huu, kitenzi 'alisema/alinena kwa' kinaonyesha Musa aliwapa Waisraeli agizo; 'akawaambia' ni Kiswahili cha kawaida na chenye heshima, bila kuongeza maelezo yasiyokuwapo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa kihalisi ni 'wana wa Israeli,' hapa msemo huo unalitaja taifa la Israeli kwa ujumla; 'Waisraeli' ni usemi wa asili na unaoeleweka wazi.
- source_word: לַעֲשֹׂת הַפָּסַח
  choice: waiadhimishe Pasaka
  rationale: Kihalisi ni 'kuifanya Pasaka,' lakini katika muktadha wa ibada maana yake ni kuitunza au kuiadhimisha kwa kutekeleza taratibu zake. 'Kuadhimisha Pasaka' ni wazi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya kufanya Pasaka
  choice: waiadhimishe Pasaka
  alternative: waifanye Pasaka
  rationale: Tafsiri iliyochaguliwa inaonyesha utekelezaji wa sikukuu na ibada ya Pasaka bila kuifanya ionekane kana kwamba Pasaka ni kitu kinachotengenezwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na lugha ya heshima. 'Basi' linaunganisha mstari huu na maagizo yaliyotangulia.
