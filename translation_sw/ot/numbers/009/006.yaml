  text: וַ/יְהִ֣י אֲנָשִׁ֗ים אֲשֶׁ֨ר הָי֤וּ טְמֵאִים֙ לְ/נֶ֣פֶשׁ אָדָ֔ם וְ/לֹא יָכְל֥וּ לַ/עֲשֹׂת הַ/פֶּ֖סַח בַּ/יּ֣וֹם הַ/ה֑וּא וַֽ/יִּקְרְב֞וּ לִ/פְנֵ֥י מֹשֶׁ֛ה וְ/לִ/פְנֵ֥י אַהֲרֹ֖ן בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/006.yaml
  text: There were men who were unclean because of a human corpse[a], so they could not keep the Passover on that day; and they came near before Moses and before Aaron on that day.
translation:
  language: sw
  text: Kulikuwa na wanaume waliokuwa najisi kwa sababu ya maiti ya binadamu[a], hivyo hawakuweza kuadhimisha Pasaka siku hiyo. Siku hiyo wakaja mbele ya Musa na Haruni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “najisi kwa nefesh ya mtu”; hapa ni nahau inayomaanisha unajisi unaosababishwa na maiti ya binadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אֲנָשִׁים
  choice: Kulikuwa na wanaume
  rationale: Muundo huu unaanzisha hali mpya katika simulizi. “Kulikuwa na” ni Kiswahili cha kawaida, na “wanaume” huhifadhi jinsia ya nomino ya Kiebrania.
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: najisi kwa sababu ya maiti ya mtu
  rationale: Hii ni nahau ya sheria za utakaso inayomaanisha unajisi unaohusiana na maiti ya binadamu; haisemi hapa kwamba watu hao walikuwa na hatia ya kimaadili.
- source_word: וְלֹא יָכְלוּ
  choice: hivyo hawakuweza
  rationale: “Hivyo” huonyesha kwa kawaida kwamba kutoweza kwao kulitokana na hali ya unajisi iliyotajwa.
- source_word: לַעֲשֹׂת הַפֶּסַח
  choice: kuadhimisha Pasaka
  rationale: Kiebrania husema kihalisi “kuifanya Pasaka,” yaani kuitunza au kuiadhimisha kwa kufuata agizo. “Kuadhimisha” ni wazi na ya kawaida katika Kiswahili.
- source_word: וַיִּקְרְבוּ לִפְנֵי מֹשֶׁה וְלִפְנֵי אַהֲרֹן
  choice: wakaja mbele ya Musa na Haruni
  rationale: Kirai hiki kinaeleza kuwakaribia na kufika mbele yao. Tafsiri hii ni ya kawaida katika Kiswahili bila kuongeza kwamba tayari walikuwa wamewasilisha ombi rasmi.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Huhifadhi rejeo la wakati na marudio yake katika mstari.
theological_decisions:
- issue: Maana ya unajisi
  choice: Unajisi unaosababishwa na uhusiano na maiti ya binadamu
  alternative: Unajisi wa kimaadili au tafsiri ya moja kwa moja “najisi kwa nafsi ya mtu”
  rationale: Katika sheria za utakaso za Pentateuki, kirai hiki hueleza unajisi wa kiibada unaohusiana na kifo. Tafsiri haiongezi dhana ya dhambi ya mtu binafsi wala namna hususa ambayo unajisi huo ulipatikana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Najisi” huhifadhi istilahi ya kiibada, huku “maiti ya mtu” ikifanya nahau ya Kiebrania ieleweke. Sentensi imegawanywa mara mbili kwa usomaji wa kawaida, na “siku hiyo” imerudiwa kwa kufuata msisitizo wa chanzo.
