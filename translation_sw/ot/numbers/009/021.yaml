  text: וְ/יֵ֞שׁ אֲשֶׁר יִהְיֶ֤ה הֶֽ/עָנָן֙ מֵ/עֶ֣רֶב עַד בֹּ֔קֶר וְ/נַעֲלָ֧ה הֶֽ/עָנָ֛ן בַּ/בֹּ֖קֶר וְ/נָסָ֑עוּ א֚וֹ יוֹמָ֣ם וָ/לַ֔יְלָה וְ/נַעֲלָ֥ה הֶ/עָנָ֖ן וְ/נָסָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/021.yaml
  text: And sometimes the cloud would remain from evening until morning; when the cloud was taken up in the morning[a], they would set out. Or if it remained for a day and a night, when the cloud was taken up, they would set out.
translation:
  language: sw
  text: Mara nyingine wingu lilibaki tangu jioni hadi asubuhi; wingu lilipoinuliwa asubuhi[a], waliondoka. Au kama lilibaki mchana na usiku, wingu lilipoinuliwa, waliondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wingu lilipopanda.” Kitenzi cha Kiebrania kinaweza kutafsiriwa hivyo kwa uhalisi zaidi, lakini “lilipoinuliwa” kinaonyesha vyema kuinuka kwa wingu kulikokuwa ishara ya Waisraeli kuondoka katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: Wakati mwingine
  rationale: Nahau hii inaanzisha hali mojawapo iliyotokea nyakati fulani; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: יִהְיֶה הֶעָנָן
  choice: wingu lilikaa
  rationale: Ingawa היה kimsingi humaanisha ‘kuwa,’ pamoja na kipindi kinachotajwa hapa inaonyesha kuendelea kuwepo kwa wingu mahali hapo.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: tangu jioni mpaka asubuhi
  rationale: Huwasilisha kwa kawaida mwanzo na mwisho wa kipindi kinachotajwa.
- source_word: וְנַעֲלָה הֶעָנָן
  choice: wingu lilipoinuliwa
  rationale: עלה hapa huonyesha wingu kuondoka juu ya maskani ikiwa ishara ya kuanza safari; umbo hili linahifadhi hali ya kutendwa inayowezekana katika Kiebrania.
- source_word: בַּבֹּקֶר
  choice: asubuhi
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha wakati.
- source_word: וְנָסָעוּ
  choice: waliondoka
  rationale: Katika muktadha wa safari ya jangwani, נסע humaanisha kuondoka kambini na kuanza safari; ‘waliondoka’ ni wazi bila kuongeza maelezo yasiyotajwa.
- source_word: אוֹ
  choice: Au kama
  rationale: Hutanguliza hali nyingine iliyo sambamba na ile ya kwanza na kuonyesha nguvu ya masharti kwa Kiswahili cha kawaida.
- source_word: יוֹמָם וָלַיְלָה
  choice: mchana na usiku
  rationale: Hufuata kwa karibu usemi wa Kiebrania na, katika muktadha huu wa kukaa kwa wingu, huonyesha kipindi kinachoendelea mchana na usiku bila kulazimisha maana ya saa ishirini na nne kamili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Marudio ya ‘wingu lilipoinuliwa’ na ‘waliondoka’ yamehifadhiwa kwa sababu ni sehemu ya muundo wa mstari wa Kiebrania.
