  text: וּ/לְ/פִ֞י הֵעָלֹ֤ת הֶֽ/עָנָן֙ מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/אַ֣חֲרֵי כֵ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בִ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁכָּן שָׁם֙ הֶֽ/עָנָ֔ן שָׁ֥ם יַחֲנ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/017.yaml
  text: Whenever the cloud was lifted from over the tent[a], after that the sons of Israel would set out; and in the place where the cloud settled[b], there the sons of Israel would camp.
translation:
  language: sw
  text: Kila mara wingu lilipoinuliwa kutoka juu ya hema[a], baada ya hapo wana wa Israeli[b] waliondoka; na mahali ambapo wingu lilitulia, hapo wana wa Israeli walipiga kambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hema la maskani,” kwa kuwa “hema” hapa linarejelea hema la maskani.
    reason: lexical_alternative
  - marker: b
    text: Au “Waisraeli.” Kiebrania ni, kwa tafsiri ya moja kwa moja, “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְפִי הֵעָלֹת
  choice: Kila mara ... lilipoinuliwa
  rationale: 'Muundo huu unaonyesha hali iliyojirudia: kila wakati wingu lilipoinuliwa, taifa liliondoka. Kauli tendwa inadumisha kutotajwa kwa mtendaji katika Kiebrania.'
- source_word: הֶעָנָן
  choice: wingu
  rationale: Hili ndilo neno la kawaida na la wazi kwa עָנָן katika muktadha wa kuongozwa jangwani.
- source_word: מֵעַל הָאֹהֶל
  choice: kutoka juu ya hema
  rationale: Inadumisha maana ya mahali ya מֵעַל na tafsiri ya moja kwa moja ya אֹהֶל kama hema, huku tanbihi ikifafanua kuwa ni hema la maskani.
- source_word: וְאַחֲרֵי כֵן
  choice: baada ya hapo
  rationale: Inahifadhi wazi mfuatano wa wakati uliomo katika Kiebrania.
- source_word: יִסְעוּ
  choice: waliondoka
  rationale: Katika muktadha wa safari ya jangwani, נסע humaanisha kuondoka mahali ili kuendelea na safari. Wakati uliopita pamoja na 'kila mara' unaonyesha tendo lililorudiwa kwa Kiswahili cha kawaida.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi muundo wa kifamilia wa Kiebrania na kwa Kiswahili inaweza kurejelea wazao au watu wa Israeli kwa ujumla, si wanaume pekee.
- source_word: וּבִמְקוֹם אֲשֶׁר
  choice: na mahali ambapo
  rationale: Inafuata kwa uwazi muundo wa mahali wa Kiebrania badala ya kuufupisha kuwa 'popote.'
- source_word: יִשְׁכָּן
  choice: lilitulia
  rationale: Kwa wingu, 'kutulia' ni lugha ya asili inayoonyesha kwamba lilibaki mahali, huku ikihifadhi kwa kiasi maana ya kukaa ya שׁכן.
- source_word: שָׁם ... שָׁם
  choice: mahali ambapo ... hapo
  rationale: Ulinganifu huu unawakilisha msisitizo wa Kiebrania unaohusianisha mahali wingu lilipotulia na mahali taifa lilipopiga kambi.
- source_word: יַחֲנוּ
  choice: walipiga kambi
  rationale: Ni usemi wa sasa na wa kawaida wa Kiswahili kwa tendo la kuweka kambi; muktadha wa 'kila mara' unaonyesha tendo lililojirudia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa tendo lililojirudia umeonyeshwa kwa “Kila mara” pamoja na vitenzi vya wakati uliopita. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
