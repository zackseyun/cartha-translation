base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/016.yaml
  text: 'So it was continually: the cloud would cover it[a], and the appearance of fire by night.'
translation:
  language: sw
  text: 'Ndivyo ilivyokuwa daima: wingu liliifunika, na usiku kulikuwa na mwonekano wa moto.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na usiku kulikuwa na kitu kilichoonekana kama moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Ndivyo
  rationale: Neno hili linatanguliza muhtasari wa hali iliyoelezwa na kudumisha maana ya ‘kwa namna hiyo’ kwa Kiswahili cha kawaida.
- source_word: יִהְיֶה
  choice: ilivyokuwa
  rationale: Ingawa umbo la Kiebrania ni hali isiyotimilika, katika muktadha linaeleza hali ya kawaida iliyoendelea wakati uliopita; ‘ilivyokuwa’ linaendana na ‘daima’ kwa lugha ya asili.
- source_word: תָמִיד
  choice: daima
  rationale: Linaonyesha kwamba hali hiyo iliendelea bila kukoma; ‘daima’ ni fupi, wazi, na yenye heshima.
- source_word: הֶעָנָן
  choice: wingu
  rationale: Ni wingu maalumu lililotajwa katika muktadha wa karibu; umbo la Kiswahili halihitaji kibainishi tofauti.
- source_word: יְכַסֶּנּוּ
  choice: liliifunika
  rationale: Kitenzi kina maana ya kufunika au kusitiri. Kiambishi ‘-i-’ kinarejelea maskani, ambayo ni nomino ya ngeli ya I-ZI katika Kiswahili.
- source_word: וּמַרְאֵה אֵשׁ
  choice: na ... kulikuwa na mwonekano wa moto
  rationale: ‘Mwonekano wa moto’ huhifadhi tofauti kati ya moto wenyewe na kitu kilichoonekana kama moto, bila kuamua zaidi ya maandishi ya Kiebrania.
- source_word: לָיְלָה
  choice: usiku
  rationale: Ni usemi wa kawaida wa wakati katika Kiswahili na unawakilisha matumizi ya Kiebrania kwa uwazi.
theological_decisions:
- issue: Kirejelewa cha kiambishi katika יְכַסֶּנּוּ
  choice: Kiambishi katika ‘liliifunika’ kinarejelea maskani.
  alternative: 'Kukitafsiri kama kinachomrejelea mtu: ‘lilimfunika.’'
  rationale: Muktadha wa karibu unazungumzia maskani iliyofunikwa na wingu. Tafsiri hii huepuka kukifanya kirejelewa kuwa mtu bila msingi wa kimuktadha.
- issue: Kama אֵשׁ ni moto halisi au mwonekano unaofanana na moto
  choice: mwonekano wa moto
  alternative: kitu kilichoonekana kama moto
  rationale: 'Uundaji huu huhifadhi mvutano wa maandishi: מַרְאֵה hutaja mwonekano unaoonekana, bila kuthibitisha moja kwa moja kama ulikuwa moto halisi au kitu kama moto.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya asili kwa msomaji wa kawaida huku ikihifadhi muundo wa muhtasari, hali ya kudumu, na utata wa ‘mwonekano wa moto.’
