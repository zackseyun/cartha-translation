base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/011.yaml
  text: In the second month[a], on the fourteenth day at twilight, they shall keep it; they shall eat it with unleavened bread and bitter herbs.
translation:
  language: sw
  text: Katika mwezi wa pili, siku ya kumi na nne, wakati wa machweo[a], wataiadhimisha; wataila pamoja na mikate isiyotiwa chachu na mboga chungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kati ya machweo mawili,” nahau inayomaanisha kipindi cha karibu na kuzama kwa jua au wakati wa machweo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: Katika mwezi wa pili
  rationale: Katika muktadha wa kalenda, חֹדֶשׁ humaanisha ‘mwezi’; muundo huu unaonyesha wakati wa tukio.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: siku ya kumi na nne
  rationale: Muundo wa Kiebrania unaotumia namba ya kawaida pamoja na יוֹם unaonyesha tarehe; Kiswahili cha kawaida hutumia ‘siku ya kumi na nne.’
- source_word: בֵּין הָעַרְבַּיִם
  choice: wakati wa machweo
  rationale: Nahau hii inahusu kipindi cha karibu na kuzama kwa jua. ‘Wakati wa machweo’ ni ya asili na wazi katika Kiswahili, huku tafsiri halisi zaidi ikihifadhiwa katika tanbihi.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: wataiadhimisha
  rationale: Katika muktadha wa Pasaka, עשה humaanisha kutekeleza au kuadhimisha ibada hiyo, si kufanya tu. Kiambishi cha yambwa ‘-i-’ kinahifadhi rejeo la kitu kilichotajwa katika muktadha.
- source_word: עַל מַצּוֹת
  choice: pamoja na mikate isiyotiwa chachu
  rationale: Katika muktadha wa kula, עַל huonyesha kuambatana; מַצּוֹת ni mikate isiyotiwa chachu.
- source_word: וּמְרֹרִים
  choice: na mboga chungu
  rationale: Neno hili la wingi linamaanisha vitu au mimea michungu iliyoliwa pamoja na Pasaka; ‘mboga chungu’ ni usemi wazi na wa kawaida.
- source_word: יֹאכְלֻהוּ
  choice: wataila
  rationale: Ni kitenzi cha kula chenye kiambishi cha yambwa cha umoja wa kiume, kinachorejelea Pasaka au kilichoandaliwa kwa ajili yake; ‘wataila’ huhifadhi rejeo hilo bila kulifafanua kupita kiasi.
