review_pass:
  verdict: revise
  source_fidelity: The draft communicates the conditional provision, the Passover observance directed to Yahweh, conformity to its prescribed requirements, and the single rule. However, “mwenyeji wa nchi” does not adequately render אֶזְרַח הָאָרֶץ, since mwenyeji may mean a host or simply an inhabitant and does not clearly preserve the native-born contrast with גֵּר.
  naturalness: The Swahili is generally clear and appropriately formal. “Mzaliwa wa nchi” is more precise and natural here than “mwenyeji wa nchi.”
  terminology: “Mgeni” is acceptable when qualified by a note as a resident foreigner. “Amri” and “utaratibu” suitably convey the legal-ritual terms in accessible Standard East African Swahili. Yahweh correctly represents the divine name.
  issues:
  - severity: medium
    issue: “mwenyeji wa nchi” for וּלְאֶזְרַח הָאָרֶץ
    rationale: The Hebrew denotes the native-born person of the land in contrast with the resident foreigner (גֵּר). In contemporary Swahili, mwenyeji can mean host or local resident and weakens this contrast. “Mzaliwa wa nchi” preserves it.
  revised_text: Na mgeni anapoishi kati yenu na akitaka kuadhimisha Pasaka kwa Yahweh[a], ataifanya kulingana na amri ya Pasaka na utaratibu wake; ndivyo atakavyoifanya. Kutakuwa na amri moja kwenu, kwa mgeni[b], na kwa mzaliwa wa nchi[c].
