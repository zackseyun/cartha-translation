id: NUM.9.14
reference: Numbers 9:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/כֶ֜ם גֵּ֗ר וְ/עָ֤שָֽׂה פֶ֨סַח֙ לַֽ/יהוָ֔ה כְּ/חֻקַּ֥ת הַ/פֶּ֛סַח וּ/כְ/מִשְׁפָּט֖/וֹ כֵּ֣ן יַעֲשֶׂ֑ה חֻקָּ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/לַ/גֵּ֖ר וּ/לְ/אֶזְרַ֥ח הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/014.yaml
  text: And if a sojourner is staying with you and would keep the Passover to Yahweh[a], he shall do it according to the statute of the Passover and according to its ordinance; so he shall do it. One statute shall be for you, for the sojourner[c][b], and for the native of the land.
translation:
  language: sw
  text: Na mgeni anapoishi kati yenu na akitaka kuadhimisha Pasaka kwa Yahweh[a], ataifanya kulingana na amri ya Pasaka na utaratibu wake; ndivyo atakavyoifanya. Kutakuwa na amri moja kwenu, kwa mgeni[b], na kwa mzaliwa wa nchi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh ni jina la Mungu linalowakilishwa na herufi za Kiebrania יהוה (YHWH).
    reason: divine_name
  - marker: b
    text: Yaani, mgeni mkazi anayeishi miongoni mwa Israeli, si msafiri anayepita tu.
    reason: lexical_alternative
  - marker: c
    text: Au, “mwenyeji wa nchi”; Kiebrania humaanisha mtu mzaliwa wa nchi, kinyume na mgeni mkazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Na ... anapo-
  rationale: Kiunganishi וְ kinahifadhi uhusiano na sheria iliyotangulia, huku כִּי katika suala hili ikitambulisha hali inayowezekana; muundo wa Kiswahili wenye “anapo-” ni wa kawaida na unabaki na maana hiyo.
- source_word: יָגוּר ... גֵּר
  choice: mgeni anapoishi kati yenu
  rationale: גֵּר humaanisha mgeni mkazi aliyeishi miongoni mwa Israeli, wala si msafiri anayepita tu. “Mgeni ... kati yenu” ni lugha ya kawaida, huku tanbihi ikibainisha hadhi yake ya ukaaji.
- source_word: וְעָשָׂה פֶסַח
  choice: akitaka kuadhimisha Pasaka
  rationale: Kirai cha Kiebrania, kwa maana halisi “kufanya Pasaka,” ni nahau ya kuitunza au kuiadhimisha Pasaka. Muktadha wa sharti unaonyesha nia ya mgeni kufanya hivyo.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: לְ hapa huonyesha kwamba maadhimisho hayo yanaelekezwa au yanafanywa kwa ajili ya Yahweh; “kwa” ni ya kawaida katika Kiswahili.
- source_word: כְּחֻקַּת הַפֶּסַח
  choice: kulingana na amri ya Pasaka
  rationale: חֻקָּה ni agizo au amri iliyowekwa. “Amri” inaonyesha nguvu yake ya kisheria na kiibada kwa lugha inayoeleweka.
- source_word: וּכְמִשְׁפָּטוֹ
  choice: na utaratibu wake
  rationale: מִשְׁפָּט hapa ni kanuni au njia sahihi ya kutekeleza ibada. “Utaratibu” huitofautisha kwa kiasi na חֻקָּה bila kufuta mwingiliano wa maana.
- source_word: כֵּן יַעֲשֶׂה
  choice: ndivyo atakavyoifanya
  rationale: Kauli hii inasisitiza kufuata namna iliyoagizwa na kudumisha nguvu ya maelekezo ya Kiebrania.
- source_word: חֻקָּה אַחַת יִהְיֶה
  choice: Kutakuwa na amri moja
  rationale: Hii ni kauli ya kisheria kwamba kanuni moja tu inatumika kwa makundi yaliyotajwa.
- source_word: לָכֶם וְלַגֵּר
  choice: kwenu, kwa mgeni
  rationale: Kurudia kihusishi “kwa” kunahifadhi msisitizo wa לְ inayorudiwa katika Kiebrania na matumizi sawa ya amri.
- source_word: וּלְאֶזְרַח הָאָרֶץ
  choice: na kwa mwenyeji wa nchi
  rationale: אֶזְרַח ni mzaliwa au mwenyeji wa nchi, kinyume na גֵּר. “Mwenyeji wa nchi” huepuka kuingiza dhana ya kisasa ya uraia.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa amri moja kwa Mwisraeli na mgeni
  choice: Amri moja inawahusu wote katika kuadhimisha Pasaka
  alternative: Mgeni anaruhusiwa tu bila kusisitizwa matumizi sawa ya sheria; au kauli hiyo ipanuliwe kuwa usawa wa kisheria katika kila jambo
  rationale: Aya inasema wazi kwamba kuna חֻקָּה אַחַת kwa wasikilizaji, mgeni, na mwenyeji wa nchi. Tafsiri inadumisha usawa huo katika muktadha huu wa Pasaka bila kuupanua zaidi ya mada ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Lugha ya kisheria imehifadhiwa kwa “amri” na “utaratibu,” lakini muundo umewekwa wa kawaida. Alama zote za tanbihi [a]–[c] zimo katika matini kuu.
