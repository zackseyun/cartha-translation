  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בָּ/רִאשׁ֡וֹן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בֵּ֥ין הָ/עַרְבַּ֖יִם בְּ/מִדְבַּ֣ר סִינָ֑י כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/005.yaml
  text: So they kept the Passover in the first month[a], on the fourteenth day of the month at twilight, in the wilderness of Sinai; according to all that Yahweh had commanded Moses, so the sons of Israel did.
translation:
  language: sw
  text: Basi wakaadhimisha Pasaka katika mwezi wa kwanza, siku ya kumi na nne ya mwezi, wakati wa machweo[a], katika nyika ya Sinai. Kama Yahweh alivyomwamuru Mose katika yote, ndivyo wana wa Israeli walivyofanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kati ya jioni mbili,” nahau inayorejelea kipindi cha machweo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ / עָשׂוּ
  choice: wakaadhimisha / walivyofanya
  rationale: Kitenzi עשה maana yake ya msingi ni ‘kufanya,’ lakini kinapotumiwa pamoja na פֶּסַח humaanisha kuiadhimisha au kuitimiza Pasaka. ‘Wakaadhimisha’ ni Kiswahili cha kawaida kwa tendo la kwanza, huku ‘walivyofanya’ kikihifadhi muhtasari wa mwisho wa Kiebrania.
- source_word: הַפֶּסַח
  choice: Pasaka
  rationale: Katika muktadha huu פֶּסַח inahusu maadhimisho ya Pasaka kwa ujumla, si dhabihu au mnyama wa Pasaka peke yake.
- source_word: בָּרִאשׁוֹן
  choice: katika mwezi wa kwanza
  rationale: Neno ‘mwezi’ linaeleweka kutokana na fomula ya tarehe inayofuata na limewekwa wazi ili sentensi iwe ya kawaida na dhahiri kwa Kiswahili.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: siku ya kumi na nne ya mwezi huo
  rationale: Hii ni fomula ya kawaida ya tarehe ya Kiebrania; ‘mwezi huo’ huonyesha kwa kawaida kuwa ni mwezi wa kwanza uliotajwa.
- source_word: בֵּין הָעַרְבַּיִם
  choice: wakati wa machweo
  rationale: Nahau hii ya Kiebrania, kihalisi ‘kati ya jioni mbili,’ inaonyesha kipindi cha mpito wa jioni. ‘Wakati wa machweo’ huwasilisha maana hiyo kwa Kiswahili cha kawaida, na umbo la kihalisi limeelezwa katika tanbihi.
- source_word: בְּמִדְבַּר סִינָי
  choice: katika nyika ya Sinai
  rationale: מִדְבָּר ni eneo kame lisilokaliwa sana; ‘nyika’ ni neno la kawaida la kibiblia na la Kiswahili Sanifu bila kulazimisha maana ya jangwa la mchanga.
- source_word: כְּכֹל אֲשֶׁר
  choice: katika kila jambo
  rationale: Usemi huu unasisitiza kwamba walifuata amri yote kikamilifu. Muundo ‘kama ... katika kila jambo, ndivyo ...’ ni wa kawaida katika Kiswahili na huhifadhi msisitizo huo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne יהוה limetafsiriwa kwa unukuzi ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: צִוָּה
  choice: alivyomwamuru
  rationale: Muundo wa Kiswahili unaonyesha kwamba amri kwa Mose ilitangulia utekelezaji wa Israeli bila kuhitaji umbo zito la wakati uliopita timilifu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: ‘Wana wa Israeli’ huhifadhi taswira ya kifamilia ya Kiebrania na wakati huohuo hutumika kwa jumuiya yote ya agano.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja. ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Usemi wa kijumuiya wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Uchaguzi huu huhifadhi usemi wa kifamilia na umbo la kiume la chanzo, huku muktadha ukionyesha kwamba linarejelea taifa la agano kwa pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wazi na wa sasa. ‘Nyika,’ ‘machweo,’ na muundo ‘kama ... ndivyo ...’ ni maneno yanayoeleweka na kuhifadhi ladha ya simulizi la kibiblia bila kuwa ya kizamani kupita kiasi.
