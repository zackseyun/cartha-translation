  text: וְ/יֵ֞שׁ אֲשֶׁ֨ר יִהְיֶ֧ה הֶֽ/עָנָ֛ן יָמִ֥ים מִסְפָּ֖ר עַל הַ/מִּשְׁכָּ֑ן עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/020.yaml
  text: Sometimes the cloud would remain over the tabernacle for a number of days; at the command of Yahweh they would camp[a], and at the command of Yahweh they would set out.
translation:
  language: sw
  text: Wakati mwingine wingu lingekaa juu ya Maskani kwa siku kadhaa. Kwa amri ya Yahwe[a] wangepiga kambi, na kwa amri ya Yahwe wangesafiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kwa kinywa cha Yahwe,” yaani, kwa amri ya Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: Wakati mwingine
  rationale: Nahau hii hutambulisha hali mojawapo kati ya hali mbalimbali. “Wakati mwingine” ni Kiswahili cha kawaida na huonyesha matukio yaliyojirudia bila ugumu usio wa lazima.
- source_word: יִהְיֶה הֶעָנָן
  choice: wingu lilikaa
  rationale: Katika muktadha wa safari, היה inaonyesha kuendelea kuwepo mahali fulani, si kuwapo tu. “Lilikaa” huonyesha kwamba wingu lilibaki juu ya Maskani.
- source_word: יָמִים מִסְפָּר
  choice: kwa siku kadhaa
  rationale: Kirai hiki humaanisha siku zenye idadi fulani au zilizohesabika. “Siku kadhaa” ni usemi wa asili usioweka idadi mahsusi.
- source_word: עַל הַמִּשְׁכָּן
  choice: juu ya Maskani
  rationale: מִשְׁכָּן ni makao matakatifu ya Israeli jangwani. “Maskani” ni istilahi ya kibiblia inayoeleweka, na “juu ya” huonyesha mahali wingu lilipokuwa.
- source_word: עַל פִּי יְהוָה
  choice: kwa amri ya Yahwe
  rationale: Ingawa maana halisi ni “kwa kinywa cha Yahwe,” nahau hii humaanisha kutenda kwa kufuata agizo lake. “Kwa amri ya Yahwe” ni wazi na ya asili.
- source_word: יַחֲנוּ
  choice: walikaa kambini
  rationale: Kauli ya Kiebrania inaeleza desturi iliyojirudia. Katika muktadha huu, “walikaa kambini” huonyesha kuwa hawakuondoka maadamu wingu lilibaki.
- source_word: יִסָּעוּ
  choice: waliondoka
  rationale: נסע katika masimulizi ya safari humaanisha kuvunja kambi na kuanza kusafiri. “Waliondoka” ni ya kawaida na inaeleweka katika muktadha huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kama “Yahwe,” umbo linalolingana na tahajia na matamshi ya Kiswahili, badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kuliweka kwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Maskani” imetumiwa kama istilahi ya mahali patakatifu pa jangwani, na sentensi mbili fupi zinadumisha mtiririko wa kawaida wa Kiswahili.
