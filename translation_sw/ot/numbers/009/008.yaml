  text: And Moses said to them[a], “Wait, and I will hear what Yahweh commands concerning you.”
translation:
  language: sw
  text: Musa akawaambia[a], “Ngojeni, nami nitasikia Yahwe atakachowaagiza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Simameni,” kwa maana ya karibu zaidi ya agizo la Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: akawaambia
  rationale: Huwasilisha kwa Kiswahili cha kawaida mfululizo wa simulizi wa waw pamoja na tendo la kusema kwao, bila kulazimika kutafsiri kihusishi kando.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: עִמְדוּ
  choice: Ngojeni hapa
  rationale: Kitenzi kihalisi ni ‘simameni,’ lakini katika muktadha huu kina maana ya kubaki mahali na kusubiri. ‘Ngojeni hapa’ huwasilisha maana hiyo kwa lugha ya kawaida; maana ya kihalisi imehifadhiwa katika tanbihi.
- source_word: וְאֶשְׁמְעָה
  choice: nami nitasikia
  rationale: Huhifadhi picha ya Kiebrania ya Musa ‘kusikia’ jibu kutoka kwa Yahwe na kuonyesha nia yake bila kuongeza maelezo yasiyomo katika maandishi.
- source_word: מַה יְצַוֶּה
  choice: kile ambacho ... atawaamuru
  rationale: Muundo huu wa Kiswahili huwasilisha jambo ambalo Yahwe ataliamuru, huku wakati ujao ukifaa baada ya agizo la kusubiri.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: לָכֶם
  choice: kuhusu ninyi
  rationale: Katika muktadha huu kihusishi chenye kiambishi cha wingi kinaonyesha kuwa amri itahusu hali yao; ‘kuhusu ninyi’ ni wazi na la kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu, si cheo; kulitohowa kama ‘Yahwe’ huhifadhi tofauti hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ngojeni hapa’ ni ya kawaida na wazi, huku ‘nami nitasikia’ ikihifadhi kwa makusudi usemi wa chanzo.
