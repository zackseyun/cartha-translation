  yaml_path: translation/ot/numbers/009/002.yaml
  text: And let the sons of Israel keep the Passover at its appointed time[a].
translation:
  language: sw
  text: Nao wana wa Israeli[a] waiadhimishe Pasaka kwa wakati wake uliowekwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli,” au kwa mapokeo, “watoto wa Israeli.” Kiebrania kihalisi ni “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲשׂוּ
  choice: Nao ... waiadhimishe
  rationale: Kitenzi עשה kwa kawaida humaanisha ‘kufanya,’ lakini kinapotumiwa pamoja na Pasaka humaanisha kutekeleza au kuadhimisha ibada hiyo. Muundo wa ‘waiadhimishe’ unaonyesha nguvu ya amri ya imperfecti katika muktadha, na ‘Nao’ inawakilisha kiunganishi וְ.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huu unafuata kwa karibu usemi wa Kiebrania, ambao kihalisi ni ‘wana wa Israeli,’ huku ukibaki wa asili na wenye hadhi katika Kiswahili. Tanbihi inataja tafsiri mbadala ya kijumla.
- source_word: הַפָּסַח
  choice: Pasaka
  rationale: Neno פֶּסַח hapa linaweza kurejelea adhimisho la Pasaka kwa upana. ‘Pasaka’ huhifadhi upana huo bila kulibana kuwa dhabihu au sikukuu pekee.
- source_word: בְּמוֹעֲדוֹ
  choice: kwa wakati wake uliowekwa
  rationale: מוֹעֵד hapa ni wakati maalumu uliopangwa, na kiambishi tamati chake kinarejelea Pasaka. Tafsiri hii huhifadhi umilikaji huo na usahihi wa wakati.
