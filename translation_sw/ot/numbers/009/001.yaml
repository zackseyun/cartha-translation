base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the second year after they came out of the land of Egypt, in the first month, saying,
translation:
  language: sw
  text: 'Yahwe akasema na Musa katika nyika ya Sinai[a], katika mwaka wa pili baada ya kutoka kwao katika nchi ya Misri, katika mwezi wa kwanza, akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jangwa la Sinai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Kitenzi hiki kinaendeleza masimulizi na hapa kinaonyesha Mungu akizungumza na Musa; ‘akasema na’ ni Kiswahili cha kawaida na chenye heshima.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֶל מֹשֶׁה
  choice: na Musa
  rationale: Pamoja na kitenzi ‘akasema,’ muundo ‘akasema na Musa’ humtambulisha kwa kawaida anayeelekezewa maneno.
- source_word: בְּמִדְבַּר סִינַי
  choice: katika nyika ya Sinai
  rationale: ‘Nyika’ huonyesha eneo lisilolimwa na lenye watu wachache bila kulazimisha maana ya jangwa la mchanga; uhusiano na Sinai umehifadhiwa.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: mwaka wa pili
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha wakati.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: baada ya wao kutoka katika nchi ya Misri
  rationale: Kirai cha kitenzi-jina kimewasilishwa kama rejeo la wakati baada ya kutoka kwao Misri, huku ‘nchi’ ikihifadhi אֶרֶץ.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: mwezi wa kwanza
  rationale: Tafsiri ya moja kwa moja, wazi, na ya kawaida ya maelezo ya wakati.
- source_word: לֵאמֹר
  choice: akisema,
  rationale: Hutambulisha yaliyomo katika hotuba inayofuata na kudumisha kiunganishi rasmi cha Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu moja kwa moja; ‘Yahwe’ ni unukuzi uliozoeleka katika Kiswahili na haulibadilishi jina hilo kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa wakati na utangulizi wa hotuba umehifadhiwa kwa ukaribu bila kufanya sentensi kuwa ngumu.
