reference: Numbers 9:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹֽא יַשְׁאִ֤ירוּ מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וְ/עֶ֖צֶם לֹ֣א יִשְׁבְּרוּ ב֑/וֹ כְּ/כָל חֻקַּ֥ת הַ/פֶּ֖סַח יַעֲשׂ֥וּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
translation:
  language: sw
  text: Wasibakize chochote mpaka asubuhi, wala wasivunje mfupa wake hata mmoja[a][b]. Wataiadhimisha Pasaka kwa kufuata utaratibu wote uliowekwa wa Pasaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala wasivunje mfupa wake wowote.”
    reason: lexical_alternative
  - marker: b
    text: Sharti la kutovunja mfupa linarudia maagizo ya Pasaka yaliyo katika Kutoka 12:46.
    reason: cross_reference
lexical_decisions:
- source_word: יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  choice: Wasibakize sehemu yake yoyote mpaka asubuhi
  rationale: Kitenzi cha Hifili יַשְׁאִירוּ kina maana ya kuacha au kubakiza. Muundo wa kipartitivi מִמֶּנּוּ umeelezwa kwa Kiswahili cha kawaida kama “sehemu yake yoyote,” huku “mpaka asubuhi” ikihifadhi kikomo cha wakati.
- source_word: וְעֶצֶם לֹא יִשְׁבְּרוּ בוֹ
  choice: wala wasivunje mfupa wake hata mmoja
  rationale: 'Nomino עֶצֶם iko katika umoja lakini ina maana ya kugawa: hakuna mfupa hata mmoja unaoruhusiwa kuvunjwa. “Mfupa wake hata mmoja” ni Kiswahili cha asili kinachohifadhi msisitizo huo bila kuongeza ufafanuzi wa kiteolojia.'
- source_word: כְּכָל חֻקַּת הַפֶּסַח
  choice: kwa kufuata masharti yake yote
  rationale: חֻקָּה hapa ni kanuni au utaratibu uliowekwa kwa ajili ya Pasaka. Wingi wa “masharti” ni wa kawaida zaidi katika Kiswahili na unawasilisha maana ya jumla ya kanuni nzima inayotawaliwa na כָּל.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: Wataiadhimisha Pasaka
  rationale: עשה ikitumika kuhusu sikukuu au ibada humaanisha kuitimiza au kuiadhimisha. Kutaja “Pasaka” badala ya kiwakilishi pekee kunaondoa utata wa kisarufi katika Kiswahili bila kubadili rejeo la Kiebrania.
theological_decisions:
- issue: Umuhimu wa baadaye wa agizo la kutovunja mfupa
  choice: Agizo limetafsiriwa moja kwa moja kama sharti la Pasaka.
  alternative: Kutumia maneno yanayosisitiza mapema uhusiano wake na utimilifu wa Kikristo katika Agano Jipya.
  rationale: Katika muktadha wake wa moja kwa moja, mstari huu unaeleza namna ya kuiadhimisha Pasaka. Tafsiri haipaswi kuingiza katika matini kuu maana ya Kikristo ya baadaye ambayo Kiebrania chenyewe hakuitaji hapa; rejeo la Kutoka linaweza kutolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa marufuku “Wasibakize… wala wasivunje…” unafaa lugha ya masharti ya sheria; “wataiadhimisha” ni wa kawaida zaidi kuliko “wataifanya” kwa ibada ya Pasaka.
