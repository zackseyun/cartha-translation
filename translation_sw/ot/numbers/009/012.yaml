    issue: The phrase 'kwa kufuata masharti yake yote' renders the final Hebrew clause somewhat loosely and leaves the antecedent of 'yake' less explicit.
    rationale: כְּכָל חֻקַּת הַפֶּסַח is literally according to all/the whole prescribed ordinance of the Passover. A collective-singular formulation tied explicitly to Pasaka better reflects the source.
  - severity: low
    issue: '''Wasibakize sehemu yake yoyote'' is slightly cumbersome.'
    rationale: The Hebrew prohibits leaving any of the Passover item until morning. 'Wasibakize chochote ... mpaka asubuhi' is more natural Swahili while preserving the contextually supplied referent.
