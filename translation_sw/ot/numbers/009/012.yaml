  verdict: revise
  source_fidelity: The prohibitions concerning leaving any of it until morning and breaking no bone of it are conveyed accurately. The final clause should more explicitly retain the Hebrew's collective singular sense, 'according to the whole prescribed ordinance of the Passover,' rather than the potentially vague 'masharti yake yote.'
  naturalness: The draft is generally clear Standard East African Swahili. 'Wasibakize sehemu yake yoyote' is understandable but less idiomatic than 'Wasibakize chochote ...'; placing the governing Passover regulation before the final observance clause makes the sentence flow naturally.
  terminology: Pasaka is the appropriate established term. 'Utaratibu wote uliowekwa wa Pasaka' communicates חֻקַּת הַפֶּסַח as the full prescribed Passover regulation without importing later theological interpretation.
  issues:
