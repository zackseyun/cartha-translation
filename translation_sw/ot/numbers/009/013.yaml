  text: וְ/הָ/אִישׁ֩ אֲשֶׁר ה֨וּא טָה֜וֹר וּ/בְ/דֶ֣רֶךְ לֹא הָיָ֗ה וְ/חָדַל֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּ֑י/הָ כִּ֣י קָרְבַּ֣ן יְהוָ֗ה לֹ֤א הִקְרִיב֙ בְּ/מֹ֣עֲד֔/וֹ חֶטְא֥/וֹ יִשָּׂ֖א הָ/אִ֥ישׁ הַ/הֽוּא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/013.yaml
  text: But the man who is clean and is not on a journey[a], yet fails to keep the Passover—that person shall be cut off from his people, because he did not present Yahweh’s offering at its appointed time[b]; that man shall bear his sin.
translation:
  language: sw
  text: Lakini mtu ambaye alikuwa safi na hakuwa safarini, akakosa kuadhimisha Pasaka, mtu huyo atakatiliwa mbali na watu wake[a], kwa sababu hakutoa sadaka ya Yahwe kwa wakati wake uliowekwa; mtu huyo ataibeba dhambi yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi hiyo itakatiliwa mbali.” Nahau ya Kiebrania inaweza kumaanisha hukumu kali ya agano bila kubainisha hapa jinsi inavyotekelezwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “ataibeba hatia yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טָהוֹר
  choice: aliye safi
  rationale: Katika muktadha huu neno hili linamaanisha usafi wa kiibada, si ukamilifu wa maadili; “safi” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: וּבְדֶרֶךְ לֹא הָיָה
  choice: ambaye hayuko safarini
  rationale: Kirai hiki kinamtaja mtu ambaye hakuzuiwa na safari, tofauti na ruhusa iliyotolewa katika muktadha unaotangulia.
- source_word: וְחָדַל לַעֲשׂוֹת הַפֶּסַח
  choice: lakini akaacha kuadhimisha Pasaka
  rationale: חָדַל huonyesha kuacha au kutotimiza jambo, na kufanya Pasaka hapa ni kuiadhimisha; tafsiri hii ni ya kawaida bila kuficha uzito wa kutotii.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: mtu huyo atakatiliwa mbali
  rationale: נפש humaanisha mtu mwenyewe hapa. “Atakatiliwa mbali” huhifadhi nahau nzito ya hukumu ya agano bila kuamua namna hasa adhabu hiyo inavyotekelezwa.
- source_word: מֵעַמֶּיהָ
  choice: na watu wake
  rationale: Ingawa kiambishi cha Kiebrania kinakubaliana kisarufi na נפש, kinamrejelea mwanamume anayetajwa; “watu wake” ni Kiswahili cha asili.
- source_word: קָרְבַּן יְהוָה
  choice: sadaka ya Yahwe
  rationale: קָרְבָּן ni kitu kinacholetwa mbele za Mungu kama sadaka, na יְהוָה limewakilishwa kwa jina binafsi “Yahwe.”
- source_word: בְּמֹעֲדוֹ
  choice: kwa wakati wake uliowekwa
  rationale: מוֹעֵד hapa ni wakati maalumu uliopangwa kwa ajili ya kuadhimisha Pasaka.
- source_word: חֶטְאוֹ יִשָּׂא
  choice: ataibeba dhambi yake
  rationale: Tafsiri hii huhifadhi nahau ya Kiebrania inayoweza kuhusisha kuwajibika kwa dhambi na matokeo yake, bila kuibadili moja kwa moja kuwa “hatia.”
- source_word: הָאִישׁ הַהוּא
  choice: mtu huyo
  rationale: Kirai hiki kinamrejelea wazi mtu yuleyule anayezungumziwa; “mtu huyo” ni cha asili na hakibadili rejeo lake.
theological_decisions:
- issue: Maana ya adhabu ya ‘kukatiliwa mbali’
  choice: Kuhifadhi nahau “atakatiliwa mbali” bila kubainisha utekelezaji wake
  alternative: “ataondolewa katika jumuiya” au “atauawa”
  rationale: Kiebrania kinaeleza hukumu nzito ya agano lakini mstari huu haubainishi ikiwa ni kifo, kutengwa na jumuiya, au hukumu ya Mungu; tafsiri haipaswi kuondoa utata huo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Jina יהוה limetafsiriwa “Yahwe.” Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini kuu.
