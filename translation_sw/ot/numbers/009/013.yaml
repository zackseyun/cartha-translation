  source_fidelity: 'Msingi wa tafsiri unafuata Kiebrania kwa uaminifu: unadumisha sharti la usafi wa kiibada, kutokuwapo safarini, kushindwa kuadhimisha Pasaka, nahau ya ‘kukatiliwa mbali,’ sadaka ya Yahwe kwa wakati uliowekwa, na kubeba dhambi. Hata hivyo, wakati wa ‘hayuko safarini’ hauakisi vizuri hali iliyokuwapo wakati wa Pasaka inayorejelewa; ‘hakuwa safarini’ ni sahihi zaidi katika muktadha.'
  naturalness: Matini inaeleweka na ina hadhi inayofaa, lakini uradidi wa ‘Lakini ... lakini’ unasikika mzito. ‘Akakosa kuadhimisha’ ni ya asili na inaeleza kushindwa/kupuuza kutenda wajibu bila kuongeza nia ambayo Kiebrania hakiibainishi.
  terminology: ‘Pasaka,’ ‘sadaka ya Yahwe,’ ‘atakatiliwa mbali,’ na ‘ataibeba dhambi yake’ ni uchaguzi unaofaa. Nahau ya hukumu imehifadhiwa bila kufafanua adhabu kwa namna ya kimafundisho. Tanbihi a inapaswa kuanza na ‘Au,’ si ‘Kwa neno halisi zaidi,’ kwa kuwa inatoa tafsiri mbadala badala ya dai la uliteral zaidi.
  issues:
  - severity: medium
    issue: Wakati wa ‘hayuko safarini’
    rationale: Kiebrania הָיָה katika muktadha wa sherehe iliyowekwa hurejelea hali ya mtu wakati huo. ‘Hakuwa safarini’ huwasilisha hali hiyo kwa usahihi zaidi kuliko kauli ya sasa ‘hayuko.’
  - severity: low
    issue: Uradidi wa kiunganishi ‘lakini’
    rationale: ‘Lakini’ mwanzoni na tena kabla ya ‘akaacha’ ni mzigo wa kimtindo usiohitajika. Muundo wa Kiswahili unaweza kubeba mkazo wa kinyume bila kurudia kiunganishi.
  - severity: low
    issue: Utangulizi wa tanbihi a
    rationale: ‘Kwa neno halisi zaidi’ hudokeza kwamba ‘nafsi’ ni tafsiri iliyo literal zaidi, ilhali tanbihi ya ukaguzi wa Kiingereza imekusudiwa kuwa chaguo mbadala. ‘Au’ ni sahihi na haina upendeleo wa kiufafanuzi.
