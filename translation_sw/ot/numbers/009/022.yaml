base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/022.yaml
  text: Whether it was two days[a], or a month, or longer, when the cloud remained over the tabernacle, dwelling over it, the sons of Israel would camp and would not set out; but when it was lifted up, they would set out.
translation:
  language: sw
  text: Iwe ni siku mbili, au mwezi mmoja, au kwa muda mrefu[a], wingu lilipodumu juu ya Maskani, likikaa juu yake, Waisraeli walipiga kambi wala hawakuondoka; lakini lilipoinuliwa, waliondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “siku nyingi”; Kiebrania kinasema kihalisi “siku,” ambalo katika muktadha huu huenda likamaanisha kipindi kirefu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ ... אוֹ ... אוֹ
  choice: Iwe ni ... au ... au ...
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida mfululizo wa vipindi mbalimbali unaowasilishwa na kiunganishi cha Kiebrania kinachorudiwa.
- source_word: יֹמַיִם
  choice: siku mbili
  rationale: Nomino ya Kiebrania iko katika umbo la jozi na humaanisha wazi siku mbili.
- source_word: חֹדֶשׁ
  choice: mwezi mmoja
  rationale: Huwakilisha muda wa mwezi mmoja katika orodha ya vipindi vinavyowezekana.
- source_word: יָמִים
  choice: muda mrefu zaidi
  rationale: Baada ya ‘siku mbili’ na ‘mwezi mmoja,’ wingi huu wa ‘siku’ unaeleweka katika muktadha kuwa kipindi kirefu; tafsiri ya moja kwa moja zaidi imehifadhiwa katika tanbihi.
- source_word: בְּהַאֲרִיךְ
  choice: lilipoendelea kukaa
  rationale: Kitenzi hiki katika muundo wa Hifili kinaonyesha kuendelea au kudumu kwa wingu mahali hapo.
- source_word: הֶעָנָן
  choice: wingu
  rationale: Ni neno la kawaida na wazi kwa wingu lililowaongoza Waisraeli jangwani.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: ‘Maskani’ ni istilahi ya kibiblia iliyozoeleka kwa mahali patakatifu pa kuhamishwa, na pia inadumisha uhusiano wa kimawazo na mzizi wa ‘kukaa.’
- source_word: לִשְׁכֹּן עָלָיו
  choice: likitulia juu yake
  rationale: Kauli hii inaeleza wingu kukaa kwa uthabiti juu ya Maskani; ‘likitulia’ ni ya asili katika Kiswahili bila kupoteza hali hiyo ya kudumu.
- source_word: יַחֲנוּ בְנֵי יִשְׂרָאֵל
  choice: Waisraeli waliendelea kupiga kambi
  rationale: 'Kauli ya Kiebrania inaonyesha tendo la kawaida lililorudiwa: kila wingu lilipodumu, Waisraeli waliendelea kukaa kambini.'
- source_word: וְלֹא יִסָּעוּ
  choice: wala hawakuondoka
  rationale: Katika muktadha wa safari, kitenzi hiki humaanisha kung’oa kambi na kuanza safari; ‘hawakuondoka’ ni wazi na cha kawaida.
- source_word: וּבְהֵעָלֹתוֹ יִסָּעוּ
  choice: lakini lilipoinuliwa, waliondoka
  rationale: Huhifadhi utofauti kati ya kubaki kambini na kuondoka wakati wingu lilipoinuliwa.
