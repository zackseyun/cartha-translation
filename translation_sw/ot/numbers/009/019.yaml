  text: וּ/בְ/הַאֲרִ֧יךְ הֶֽ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יָמִ֣ים רַבִּ֑ים וְ/שָׁמְר֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֥א יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/019.yaml
  text: When the cloud remained over the tabernacle for many days[b][a], the sons of Israel kept the charge of Yahweh and did not set out.
translation:
  language: sw
  text: Wingu lilipokaa juu ya maskani kwa siku nyingi, wana wa Israeli walishika agizo la Yahwe[a], nao hawakuondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walizingatia agizo la Yahwe” au “walishika masharti ya Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַאֲרִיךְ הֶעָנָן
  choice: Wingu lilipokaa
  rationale: Muundo wa ב pamoja na kitenzi-jina cha אָרַךְ huanzisha kishazi cha wakati na kueleza kuendelea kwa muda mrefu. Kiswahili cha kawaida hutumia “lilipokaa,” huku “kwa siku nyingi” ikibainisha urefu wa muda.
- source_word: עַל הַמִּשְׁכָּן
  choice: juu ya maskani
  rationale: Katika muktadha huu מִשְׁכָּן ni hema takatifu la makao ya Yahwe; “maskani” ni istilahi ya kibiblia inayotambulika na “juu ya” huonyesha mahali pa wingu.
- source_word: יָמִים רַבִּים
  choice: kwa siku nyingi
  rationale: Tafsiri hii inahifadhi kwa uwazi wingi wa siku na maana ya muda mrefu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu muundo wa Kiebrania “wana wa Israeli” na maana yake ya kifamilia na kiagano, bila kuubadili kuwa jina la jumla tu.
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת יְהוָה
  choice: walitimiza wajibu waliowekewa na Yahwe
  rationale: Mchanganyiko wa שׁמר na מִשְׁמֶרֶת hapa una maana ya kuzingatia au kutekeleza wajibu uliowekwa, si kulinda kitu kimwili. Usemi huu ni wa asili katika Kiswahili na huhifadhi dhana ya wajibu wa kutii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kwa tahajia ya Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: וְלֹא יִסָּעוּ
  choice: nao hawakuondoka
  rationale: Katika simulizi la safari נסע humaanisha kuondoa kambi na kuanza safari. “Hawakuondoka” ni wazi na ya asili katika muktadha, ingawa “hawakufunga safari” pia inawezekana.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi kwa tahajia inayofaa Kiswahili, bila kulibadilisha kuwa cheo.
- issue: Maana ya מִשְׁמֶרֶת יְהוָה
  choice: wajibu waliowekewa na Yahwe
  alternative: agizo la Yahwe; masharti ya Yahwe
  rationale: Neno linaweza kuashiria wajibu, agizo, au jambo la kuzingatiwa. Tafsiri iliyochaguliwa huhifadhi wazo la kutekeleza wajibu bila kulifanya kuwa amri moja maalumu isiyotajwa.
- issue: Uwasilishaji wa בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: “Wana wa Israeli” hufuata kwa karibu usemi wa kifamilia wa Kiebrania. Katika muktadha huu usemi huo hutaja jumuiya ya Israeli, si wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. “Maskani” limetumiwa kama neno la kibiblia kwa hema takatifu; “Yahwe” ni utohozi wa kawaida wa Kiswahili wa jina יהוה.
