base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/003.yaml
  text: On the fourteenth day of this month[a], between the evenings, you shall keep it at its appointed time; according to all its statutes and according to all its ordinances you shall keep it.
translation:
  language: sw
  text: Siku ya kumi na nne ya mwezi huu, kati ya jioni mbili[a], mtaiadhimisha kwa wakati wake uliowekwa; mtaiadhimisha kwa kufuata kanuni zake zote na maagizo yake yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kati ya jioni mbili,” usemi wa jadi unaorejelea kipindi kinachozunguka machweo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם בַּחֹדֶשׁ הַזֶּה
  choice: Siku ya kumi na nne ya mwezi huu
  rationale: Hutoa tarehe kwa Kiswahili cha kawaida huku ikihifadhi usahihi wa kalenda wa Kiebrania.
- source_word: בֵּין הָעַרְבַּיִם
  choice: kati ya machweo mawili
  rationale: Huhifadhi kwa karibu usemi maalumu wa Kiebrania na kutoufasiri kimya kimya kuwa wakati mmoja tu maalumu; tanbihi inaeleza maana yake ya jumla.
- source_word: תַּעֲשׂוּ אֹתוֹ
  choice: mtaiadhimisha / Mtafanya hivyo
  rationale: Katika muktadha huu עשה humaanisha kuadhimisha Pasaka. Tendo la kwanza limetafsiriwa kiidiomatiki, na marudio ya pili yamehifadhiwa kwa Kiswahili cha asili bila kurudia kiwakilishi kwa namna nzito.
- source_word: בְּמוֹעֲדוֹ
  choice: kwa wakati wake uliowekwa
  rationale: מוֹעֵד hapa ni wakati maalumu uliowekwa kwa maadhimisho, si majira kwa maana ya hali ya hewa.
- source_word: כְּכָל חֻקֹּתָיו
  choice: kwa kufuata kanuni zake zote
  rationale: Kanuni huwasilisha masharti yaliyowekwa kwa maadhimisho haya kwa lugha rasmi lakini inayoeleweka.
- source_word: וּכְכָל מִשְׁפָּטָיו
  choice: na maagizo yake yote
  rationale: Maagizo hutofautisha מִשְׁפָּטִים na חֻקּוֹת huku yakidumisha maana ya taratibu zinazopasa kufuatwa.
