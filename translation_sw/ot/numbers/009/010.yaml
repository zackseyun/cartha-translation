language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אִ֣ישׁ אִ֣ישׁ כִּי יִהְיֶֽה טָמֵ֣א לָ/נֶ֡פֶשׁ אוֹ֩ בְ/דֶ֨רֶךְ רְחֹקָ֜הׄ לָ/כֶ֗ם א֚וֹ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָ֥שָׂה פֶ֖סַח לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/010.yaml
  text: Speak to the sons of Israel[a], saying, ‘If any man becomes unclean by a dead body, or is on a distant journey, whether among you or among your generations[c][b], he shall still keep the Passover to Yahweh.
translation:
  language: sw
  text: Waambie wana wa Israeli[a], ‘Mwanamume yeyote miongoni mwenu au katika vizazi vyenu vijavyo[c], akiwa najisi kwa sababu ya maiti[b], au akiwa katika safari ya mbali, ataadhimisha Pasaka kwa Yahweh.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “wana wa Israeli”; hapa msemo huo unaitaja jumuiya ya Israeli kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, nahau hiyo kwa neno moja moja ni “najisi kwa nafsi”; katika muktadha huu wa sheria humaanisha unajisi unaohusiana na maiti.
    reason: lexical_alternative
  - marker: c
    text: Au “katika vizazi vyenu vyote.” Maneno haya yanaonyesha kwamba sheria hiyo inawahusu pia wazao wao wa baadaye.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: Waambie wana wa Israeli
  rationale: Kauli ya amri דַּבֵּר imewasilishwa kwa Kiswahili cha kawaida kama “Waambie.” “Wana wa Israeli” inadumisha umbo la Kiebrania, huku tanbihi ikifafanua kuwa ni jina la jumuiya nzima.
- source_word: אִישׁ אִישׁ
  choice: Mwanamume yeyote
  rationale: 'Urudiaji huu una maana ya mgawanyo: kila mwanamume binafsi anayehusika na sharti hili. “Mwanamume yeyote” ni ya asili na inadumisha umbo la kiume la chanzo.'
- source_word: טָמֵא לָנֶפֶשׁ
  choice: akiwa najisi kwa sababu ya maiti
  rationale: Katika sheria za ukuhani, נֶפֶשׁ katika nahau hii humaanisha mtu aliyekufa au maiti kama chanzo cha unajisi wa kiibada. Tafsiri haiongezi namna hususa ya kugusana ambayo haikutajwa hapa.
- source_word: בְדֶרֶךְ רְחֹקָה
  choice: akiwa katika safari ya mbali
  rationale: Nahau hii humaanisha kuwa safarini mbali, si tu kuwa kwenye barabara iliyo mbali. Usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: לָכֶם אוֹ לְדֹרֹתֵיכֶם
  choice: miongoni mwenu au katika vizazi vyenu vijavyo
  rationale: Maneno haya yanaeneza matumizi ya sheria kwa hadhira ya sasa na vizazi vyao vya baadaye. Yamewekwa karibu na “mwanamume yeyote” ili uhusiano huo uwe wazi katika Kiswahili.
- source_word: וְעָשָׂה פֶסַח
  choice: ataadhimisha Pasaka
  rationale: Kitenzi עשה pamoja na פֶסַח ni nahau ya kuitunza au kuiadhimisha Pasaka. “Ataadhimisha” huwasilisha wajibu wa kisheria bila kuongeza neno kama “bado,” ambalo haliko wazi katika chanzo.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahweh
  rationale: Kihusishi ל kinaonyesha kwamba maadhimisho yanaelekezwa kwa Yahweh au yanafanywa kwa ajili yake. Jina la agano יהוה limetafsiriwa “Yahweh.”
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni; “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Lugha ya kiume katika sheria
  choice: Mwanamume yeyote
  alternative: Mtu yeyote
  rationale: אִישׁ אִישׁ ni umbo la kiume la umoja lenye nguvu ya kumtaja kila anayehusika. Tafsiri inadumisha jinsia ya kisarufi bila kuongeza au kupunguza upeo wa sheria.
- issue: Nguvu ya וְעָשָׂה katika kifungu cha sheria
  choice: ataadhimisha
  alternative: anaweza kuadhimisha
  rationale: Muundo huu unaeleza matokeo au wajibu wa sharti lililotangulia. Hauwasilishi ruhusa tu; kwa hiyo “ataadhimisha” inadumisha nguvu yake bila kuingiza “bado” isiyosemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifungu cha sheria lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa “miongoni mwenu au katika vizazi vyenu vijavyo” umesogezwa karibu na mhusika wake ili kuondoa utata wa kisintaksia usio wa lazima; nahau ya unajisi imefafanuliwa bila kuongeza tendo la kugusa maiti.
