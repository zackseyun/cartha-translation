  text: עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּ֑עוּ אֶת מִשְׁמֶ֤רֶת יְהוָה֙ שָׁמָ֔רוּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/023.yaml
  text: At the command of Yahweh they camped[a], and at the command of Yahweh they set out. They kept the charge of Yahweh at the command of Yahweh by the hand of Moses.
translation:
  language: sw
  text: Kwa amri ya Yahwe walipiga kambi, na kwa amri ya Yahwe waliondoka. Waliyashika maagizo ya Yahwe kwa amri ya Yahwe kupitia Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa mkono wa Musa,” nahau yenye maana ya “kupitia Musa” au “kwa njia ya Musa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: kwa amri ya
  rationale: Nahau hii, ambayo kihalisi ni ‘kwa kinywa cha,’ inaonyesha agizo lenye mamlaka. ‘Kwa amri ya’ ni Kiswahili cha kawaida na hudumisha maana hiyo katika sehemu zote tatu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kwa umbo la Kiswahili ‘Yahwe,’ badala ya kulibadilisha kuwa cheo.
- source_word: יַחֲנוּ
  choice: walipiga kambi
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza kuweka au kukaa kambini.
- source_word: יִסָּעוּ
  choice: waliondoka
  rationale: Katika muktadha wa safari ya jangwani, kitenzi hiki huonyesha kung’oa kambi na kuanza safari; ‘waliondoka’ ni cha asili bila kuongeza wazo lisilo lazima.
- source_word: מִשְׁמֶרֶת
  choice: wajibu waliopewa
  rationale: Nomino hii humaanisha jambo lililokabidhiwa mtu alitunze au alitekeleze. Usemi huu unawasilisha kwa uwazi dhana ya dhamana na utii.
- source_word: שָׁמָרוּ
  choice: waliitimiza
  rationale: Kitenzi kinaweza kumaanisha kutunza, kushika, au kuzingatia. Pamoja na מִשְׁמֶרֶת, ‘waliitimiza wajibu’ ni Kiswahili cha asili kinachoonyesha utii.
- source_word: בְּיַד מֹשֶׁה
  choice: kupitia kwa Musa
  rationale: Nahau hii, kihalisi ‘kwa mkono wa Musa,’ inaonyesha uwakala au upatanishi; ‘kupitia kwa Musa’ hutoa maana hiyo wazi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Andiko linatumia jina יהוה lenyewe. ‘Yahwe’ hulihifadhi kama jina la agano bila kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya amri ya Yahwe na Musa
  choice: kwa amri ya Yahwe kupitia kwa Musa
  alternative: kwa amri ya Yahwe kwa mkono wa Musa
  rationale: Muundo huu unadumisha kwamba amri ni ya Yahwe na kwamba Musa ndiye njia au wakala wa kuiwasilisha, bila kumfanya Musa kuwa chanzo cha amri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘kwa amri ya Yahwe’ yamehifadhiwa kwa sababu ni msisitizo muhimu wa maandishi ya Kiebrania. Alama ya tanbihi [a] imewekwa baada ya nahau inayofafanuliwa.
