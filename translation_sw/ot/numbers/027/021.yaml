  text: וְ/לִ/פְנֵ֨י אֶלְעָזָ֤ר הַ/כֹּהֵן֙ יַעֲמֹ֔ד וְ/שָׁ֥אַל ל֛/וֹ בְּ/מִשְׁפַּ֥ט הָ/אוּרִ֖ים לִ/פְנֵ֣י יְהוָ֑ה עַל פִּ֨י/ו יֵצְא֜וּ וְ/עַל פִּ֣י/ו יָבֹ֗אוּ ה֛וּא וְ/כָל בְּנֵי יִשְׂרָאֵ֥ל אִתּ֖/וֹ וְ/כָל הָ/עֵדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/021.yaml
  text: And he shall stand before Eleazar the priest[a], who shall inquire for him by the judgment of the Urim before Yahweh. At his command they shall go out, and at his command they shall come in—he and all the sons of Israel with him[b], even all the congregation.
translation:
  language: sw
  text: Naye atasimama mbele ya kuhani Eleazari, ambaye atamwulizia mbele za Yahwe kwa uamuzi wa Urimu.[a] Kwa amri yake watatoka, na kwa amri yake wataingia—yeye pamoja na wana wote wa Israeli walio naye, na kusanyiko lote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa hukumu ya Urimu.” Usemi huu unahusu kuuliza mbele za Yahwe kwa kutumia Urimu ili kupata uamuzi wa kikuhani.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wana wa Israeli”; yaani, Waisraeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: mbele ya / mbele za
  rationale: Katika sehemu ya kwanza inaonyesha Yoshua kusimama mbele ya Eleazari; katika sehemu ya pili, usemi wa kawaida wa Kiswahili ‘mbele za Yahwe’ unaonyesha uwepo wake.
- source_word: יַעֲמֹד
  choice: atasimama
  rationale: Kauli hii ina nguvu ya agizo au wakati ujao katika muktadha wa kumweka Yoshua rasmi.
- source_word: וְשָׁאַל לוֹ
  choice: ambaye atamwulizia
  rationale: Muktadha unaonyesha kuwa Eleazari ndiye atakayeuliza kwa niaba ya Yoshua; muundo wa kishazi tegemezi unaweka wazi badiliko la kiima bila kuongeza maana.
- source_word: בְּמִשְׁפַּט הָאוּרִים
  choice: kwa uamuzi wa Urimu
  rationale: מִשְׁפָּט hapa ni uamuzi au utaratibu wa kutoa uamuzi wa kikuhani. ‘Urimu’ imeandikwa kwa matamshi kwa kuwa ni istilahi maalumu isiyo na tafsiri ya moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetolewa kwa namna ya kawaida ya kulitamka katika Kiswahili badala ya kulibadilisha kuwa cheo.
- source_word: עַל פִּיו
  choice: kwa amri yake
  rationale: Nahau ya Kiebrania, kihalisi ‘kwa kinywa chake,’ inaonyesha maelekezo yenye mamlaka. Kiwakilishi cha umoja kimehifadhiwa bila kulazimisha mtajo wake.
- source_word: יֵצְאוּ ... יָבֹאוּ
  choice: watatoka ... wataingia
  rationale: Jozi ya vitenzi imehifadhiwa kwa ukaribu; inaweza kueleza mienendo ya umma au ya kijeshi bila kuifungia maana katika vita pekee.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wote wa Israeli
  rationale: ‘Wana wa Israeli’ huhifadhi umbo la chanzo, huku ‘wote’ ikilingana na כָל na kusaidia kuonyesha taifa kwa ujumla.
- source_word: הָעֵדָה
  choice: kusanyiko lote
  rationale: Neno hili linamaanisha jumuiya ya agano ikitazamwa kama mwili uliokusanyika; ‘kusanyiko’ ni la kawaida, lenye heshima, na linafaa katika muktadha wa Pentateuko.
theological_decisions:
- issue: Mtajo wa kiwakilishi katika ‘kwa amri yake’
  choice: Kiwakilishi cha umoja ‘yake’ kimehifadhiwa bila kumtaja mhusika moja kwa moja.
  alternative: Kusema wazi ‘kwa amri ya Eleazari,’ ‘kwa amri ya Yoshua,’ au ‘kwa amri ya Yahwe.’
  rationale: Kiebrania kina mtajo uliobanwa na unaweza kueleweka kuwa maelekezo yenye mamlaka yanayotokana na uamuzi wa Urimu, yakifikishwa kupitia Eleazari. Tafsiri haipaswi kuondoa utata huo halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa wa kawaida kwa wasomaji wa leo, huku istilahi ya kikuhani ‘Urimu,’ jozi ‘watatoka ... wataingia,’ na utata wa kiwakilishi zikihifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
