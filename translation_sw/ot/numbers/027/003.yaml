  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אָבִי/נוּ֮ מֵ֣ת בַּ/מִּדְבָּר֒ וְ/ה֨וּא לֹא הָיָ֜ה בְּ/ת֣וֹךְ הָ/עֵדָ֗ה הַ/נּוֹעָדִ֛ים עַל יְהוָ֖ה בַּ/עֲדַת קֹ֑רַח כִּֽי בְ/חֶטְא֣/וֹ מֵ֔ת וּ/בָנִ֖ים לֹא הָ֥יוּ לֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/003.yaml
  text: Our father died in the wilderness[a], and he was not among the congregation of those who gathered themselves against Yahweh in the company of Korah; rather, he died for his own sin[c][b], and he had no sons.
translation:
  language: sw
  text: Baba yetu alikufa nyikani, lakini hakuwa miongoni mwa kusanyiko la wale waliokusanyika kumpinga Yahwe katika kundi la Kora. Bali alikufa kwa sababu ya dhambi yake mwenyewe,[a] naye hakuwa na wana wa kiume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikufa katika dhambi yake.” Kiebrania hakitaji dhambi hiyo ilikuwa nini; kinasisitiza tu kwamba hakufa akiwa mmoja wa waasi wa Kora.
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִינוּ
  choice: Baba yetu
  rationale: Ni rejeo la moja kwa moja la mabinti kwa baba yao; maana pana ya ‘babu’ au ‘mzee wa ukoo’ haifai katika muktadha huu.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: ‘Nyikani’ ni usemi wa kawaida na wenye heshima kwa mazingira ya jangwani yasiyokaliwa, na unafaa simulizi la Israeli jangwani.
- source_word: בְּתוֹךְ הָעֵדָה
  choice: miongoni mwa kusanyiko
  rationale: ‘Miongoni mwa’ huwasilisha בְּתוֹךְ kwa Kiswahili cha kawaida, na ‘kusanyiko’ huhifadhi maana ya kundi lililokusanyika.
- source_word: הַנּוֹעָדִים עַל יְהוָה
  choice: wale waliokusanyika kumpinga Yahwe
  rationale: Kitenzi cha Kiebrania kinaonyesha kukusanyika pamoja, huku עַל katika muktadha huu ikionyesha upinzani dhidi ya Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: בַּעֲדַת קֹרַח
  choice: katika kundi la Kora
  rationale: Kauli hii hutambulisha kundi maalumu la waasi lililohusishwa na Kora; ‘kundi’ pia huepuka urudiaji usio wa lazima wa ‘kusanyiko’.
- source_word: בְחֶטְאוֹ
  choice: kwa sababu ya dhambi yake mwenyewe
  rationale: בְ inaeleweka kwa maana ya kisababishi katika muktadha. ‘Yake mwenyewe’ huonyesha tofauti kati ya dhambi yake na uasi wa pamoja wa kundi la Kora bila kutaja dhambi hiyo ilikuwa nini.
- source_word: וּבָנִים לֹא הָיוּ לוֹ
  choice: naye hakuwa na wana wa kiume
  rationale: Ni Kiswahili cha kawaida kwa muundo wa Kiebrania wa kuwepo pamoja na לְ. ‘Wana wa kiume’ huweka wazi kwamba בָּנִים hapa ni watoto wa kiume, jambo muhimu katika muktadha wa urithi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Dhambi binafsi ikilinganishwa na hatia ya kundi la Kora
  choice: alikufa kwa sababu ya dhambi yake mwenyewe
  alternative: alikufa katika dhambi yake
  rationale: 'Tafsiri inadumisha tofauti iliyotolewa na mabinti: baba yao hakuwa katika uasi wa Kora, lakini alikufa kwa sababu ya dhambi yake. Haitaji dhambi hiyo wala kuingiza maelezo ya kiteolojia yasiyomo katika mstari.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimeunganishwa kwa mtiririko wa kawaida huku tofauti kati ya uasi wa Kora na dhambi ya baba ikihifadhiwa.
