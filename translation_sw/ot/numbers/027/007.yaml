base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/007.yaml
  text: The daughters of Zelophehad are right[a]. You must surely give them a hereditary possession among their father's brothers[b], and you shall transfer their father's inheritance to them.
translation:
  language: sw
  text: Binti za Selofehadi wanasema yaliyo sawa.[a] Ni lazima uwape[b] milki ya urithi miongoni mwa ndugu za baba yao, nawe utawahamishia urithi wa baba yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Binti za Selofehadi wanasema yaliyo sawa.” Kauli hiyo inamaanisha kwamba madai yao ni sahihi.'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina kiambishi cha wingi wa kiume katika “kwao/wao” hapa, ingawa muktadha unawahusu binti za Selofehadi. Tafsiri ya Kiswahili huonyesha warejeleo hao kwa kiambishi -wa- katika “uwape.”
    reason: textual_variant
lexical_decisions:
- source_word: כֵּן ... דֹּבְרֹת
  choice: wanasema yaliyo sawa
  rationale: Kauli hii inathibitisha kwamba madai ya binti hao ni sahihi katika muktadha wa hukumu. Kiswahili hiki ni cha asili na kinabaki karibu na taswira ya Kiebrania ya ‘kusema yaliyo sawa.’
- source_word: נָתֹן תִּתֵּן
  choice: Hakika lazima uwape
  rationale: Muundo wa kitenzi-jina halisi pamoja na kitenzi kilichopinda unasisitiza amri; ‘hakika lazima’ huhifadhi mkazo na wajibu wake.
- source_word: אֲחֻזַּת נַחֲלָה
  choice: milki ya urithi
  rationale: Neno ‘milki’ linaonyesha mali inayomilikiwa, hasa ardhi, huku ‘ya urithi’ likihifadhi wazo la fungu linalorithiwa.
- source_word: בְּתוֹךְ אֲחֵי אֲבִיהֶם
  choice: miongoni mwa ndugu za baba yao
  rationale: Katika muktadha huu אֲחֵי humaanisha ndugu wa kiume wa baba yao, yaani wajomba wao wa upande wa baba; tafsiri ya moja kwa moja huepuka kuingiza ufafanuzi ndani ya matini.
- source_word: וְהַעֲבַרְתָּ
  choice: utawahamishia
  rationale: Hifili ya עבר hapa ina maana ya kisheria ya kufanya urithi upite kwa warithi wengine; ‘kuwahamishia’ huwasilisha tendo hilo kwa Kiswahili cha sasa.
- source_word: נַחֲלַת אֲבִיהֶן
  choice: urithi wa baba yao
  rationale: Huhifadhi kwa uwazi uhusiano wa kisheria na kifamilia wa urithi uliokuwa wa baba yao.
