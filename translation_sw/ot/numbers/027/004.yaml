base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/004.yaml
  text: Why should our father's name be taken away from among his clan because he had no son? Give us a possession among our father's brothers[a][b].
translation:
  language: sw
  text: Kwa nini jina la baba yetu liondolewe kutoka katika ukoo wake kwa sababu hakuwa na mwana? Tupeni milki miongoni mwa ndugu wa kiume wa baba yetu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lipunguzwe” au “liondoshwe.” Kiebrania kinauliza kwa nini “jina” la baba yetu lipotee kutoka katika ukoo wake kwa sababu hakuwa na mwana.
    reason: lexical_alternative
  - marker: b
    text: “Milki” hapa ni sehemu ya ardhi inayomilikiwa au mgao wa urithi ndani ya ukoo.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Hutanguliza swali la kupinga uamuzi unaoweza kufanywa; Kiswahili cha kawaida kinaonyesha hoja hiyo kwa muktadha.
- source_word: יִגָּרַע
  choice: liondolewe
  rationale: Nifali ya גרע hapa inaeleza kupotea au kuondolewa kwa jina la baba katika muktadha wa ukoo na urithi; ‘liondolewe’ ni ya asili na hudumisha maana ya hasara.
- source_word: שֵׁם
  choice: jina
  rationale: Imetafsiriwa moja kwa moja ili kuhifadhi nahau ya Kiebrania kuhusu kuendelea kwa kumbukumbu na nafasi ya baba katika ukoo.
- source_word: מִתּוֹךְ מִשְׁפַּחְתּוֹ
  choice: kutoka katika ukoo wake
  rationale: Katika muktadha wa mgao wa ardhi, מִשְׁפָּחָה ni kundi la kijamaa ndani ya kabila; ‘ukoo’ linafaa kuliko ‘familia’ ya nyuklia.
- source_word: כִּי אֵין לוֹ בֵּן
  choice: kwa sababu hakuwa na mwana
  rationale: Wakati uliopita unafaa katika simulizi kwa kuwa baba alikuwa amekufa; ‘mwana’ huhifadhi lugha mahsusi ya kiume ya suala hili la urithi.
- source_word: תְּנָה לָּנוּ
  choice: Tupeni
  rationale: Ni ombi la moja kwa moja kwa walio wengi; umbo hili la Kiswahili ni la kawaida, lenye heshima, na linaonyesha amri ya Kiebrania.
- source_word: אֲחֻזָּה
  choice: milki
  rationale: Neno linaeleza sehemu ya ardhi inayomilikiwa au kugawiwa; ‘milki’ huhifadhi maana ya kisheria ya umiliki wa ardhi bila kuifanya moja kwa moja kuwa ‘urithi’.
- source_word: בְּתוֹךְ אֲחֵי אָבִינוּ
  choice: kati ya ndugu za baba yetu
  rationale: Huhifadhi kwa usahihi rejeo la ndugu wa kiume wa baba, yaani wajomba wa upande wa baba, bila kulipanua kuwa jamaa wote.
theological_decisions:
- issue: Lugha mahsusi ya kijinsia katika sheria ya urithi
  choice: mwana / ndugu za baba yetu
  alternative: mtoto / jamaa za baba yetu
  rationale: Kiebrania kinatumia maneno ya kiume kwa sababu shauri linahusu urithi kupitia mwana wa kiume na ndugu wa baba. Tafsiri haipunguzi umahususi huo.
- issue: Maana ya ‘jina’ la baba kuondolewa
  choice: Kuhifadhi ‘jina’ kama nahau ya Kiebrania
  alternative: Kutafsiri wazi kuwa ukoo au kumbukumbu yake ipotee
  rationale: Neno ‘jina’ linaweza kuhusisha kumbukumbu, nafasi ya kifamilia, na mwendelezo wa nasaba; kulihifadhi hakufungi maana katika ufafanuzi mmoja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ukoo’ limetumiwa kwa kundi la kijamaa badala ya familia ya nyuklia; ‘milki’ limetumiwa kwa sehemu ya ardhi ya kudumu. Alama zote za tanbihi zimewekwa katika matini.
