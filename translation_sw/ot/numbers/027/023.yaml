base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/023.yaml
  text: And he laid his hands on him and commanded him[b][a], just as Yahweh had spoken by the hand of Moses.
translation:
  language: sw
  text: Musa akaweka mikono yake juu ya Yoshua, akamwagiza[a], kama vile Yahwe alivyosema kwa mkono wa Musa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamwamuru” au “akampa wajibu rasmi.” Kitenzi cha Kiebrania humaanisha kutoa amri au agizo; hapa agizo hilo ni sehemu ya kumkabidhi Yoshua uongozi.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kwa mkono wa Musa,” yaani, kupitia Musa akiwa wakala wa Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְמֹךְ אֶת־יָדָיו עָלָיו
  choice: akaweka mikono yake juu ya Yoshua
  rationale: Kitenzi סמך pamoja na kuweka mikono juu ya mtu kinaeleza tendo rasmi la kuwekea mikono. Majina Musa na Yoshua yametajwa wazi kutokana na muktadha wa karibu ili viwakilishi vya Kiswahili visitatanishe wahusika.
- source_word: וַיְצַוֵּהוּ
  choice: akamwagiza
  rationale: צוה kwa kawaida humaanisha kuamuru au kumpa mtu agizo. Katika muktadha huu agizo hilo ni sehemu ya kumkabidhi Yoshua wajibu wa uongozi; “akamwagiza” huhifadhi maana ya agizo bila kuifanya iwe tu “akamteua.”
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Kauli hii inaonyesha kwamba Musa alitenda sawasawa na neno la Yahwe lililotangulia.
- source_word: דִּבֶּר
  choice: alivyosema
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba kusema kwa Yahwe kulitangulia tendo la Musa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika Kiebrania limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: בְּיַד מֹשֶׁה
  choice: kwa mkono wa Musa
  rationale: Tafsiri hii huhifadhi nahau halisi ya Kiebrania ya uwakala; tanbihi inaeleza kwamba maana yake ni Yahwe kusema kupitia Musa.
theological_decisions:
- issue: Maana ya צוה katika kukabidhiwa kwa Yoshua uongozi
  choice: akamwagiza
  alternative: akamteua / akamweka rasmi
  rationale: “Akamwagiza” huhifadhi maana ya msingi ya kumpa amri au wajibu, huku muktadha wa kuwekewa mikono ukionyesha hali rasmi ya tukio. “Akamteua” pekee ingeweza kuficha wazo la agizo lililo katika kitenzi.
- issue: Nahau ya Yahwe kusema “kwa mkono wa Musa”
  choice: kwa mkono wa Musa
  alternative: kupitia Musa
  rationale: Nahau ya chanzo imehifadhiwa katika maandishi, bila kuondoa wazo la Musa kuwa wakala wa Yahwe; maana yake imefafanuliwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inafuata kwa karibu muundo wa Kiebrania, lakini majina ya wahusika yamewekwa wazi ili kuepuka utata usio wa lazima wa viwakilishi. Nahau “kwa mkono wa Musa” imehifadhiwa na kufafanuliwa kwa tanbihi.
