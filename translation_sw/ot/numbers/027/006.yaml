  yaml_path: translation/ot/numbers/027/006.yaml
  text: Then Yahweh said to Moses[a], saying,
translation:
  language: sw
  text: Kisha Yahwe akamwambia Mose hivi:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “Yahwe akamwambia Mose, akisema.”'
    reason: Huonyesha muundo halisi wa Kiebrania wa לֵאמֹר, ambao katika Kiswahili umetafsiriwa kiasili kwa “hivi:”.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Kitenzi chenye waw-consecutive kinaendeleza simulizi. “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akamwambia” huunganisha kitendo cha kusema na anayelengwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe” badala ya kubadilishwa na cheo.
- source_word: אֶל
  choice: -mwambia
  rationale: Maana ya kihusishi “kwa/kuelekea” imejumuishwa kiasili katika kitenzi cha Kiswahili “akamwambia.”
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: 'hivi:'
  rationale: Katika fomula hii, neno hilo linatanguliza yaliyosemwa. “Hivi:” hufanya kazi hiyo kwa Kiswahili cha sasa bila uradidi usio wa kawaida wa “akisema.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kisha” huendeleza simulizi kwa urahisi; “hivi:” hutanguliza maneno yatakayofuata katika mstari unaofuata.
