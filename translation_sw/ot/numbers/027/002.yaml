base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/002.yaml
  text: And they stood before Moses[a], before Eleazar the priest, before the leaders, and all the congregation, at the entrance of the tent of meeting, saying[b],
translation:
  language: sw
  text: 'Nao wakasimama mbele ya Musa, mbele ya kuhani Eleazari, mbele ya viongozi[a], na mbele ya kusanyiko lote[b], kwenye mlango wa Hema ya Kukutania, wakisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakuu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mkutano wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: Nao wakasimama
  rationale: Kitenzi kinaonyesha kwamba hao wanawake walisimama rasmi mbele ya wenye mamlaka. Kiswahili hakionyeshi jinsia katika umbo hili la kitenzi, lakini muktadha huitambulisha.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Huhifadhi maana ya kujitokeza hadharani mbele ya Musa, kuhani, viongozi, na kusanyiko katika mazingira rasmi ya kusikilizwa kwa shauri.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: kuhani Eleazari
  rationale: Mpangilio huu ni wa kawaida na wa asili katika Kiswahili; maandishi yanasema tu 'kuhani,' si 'kuhani mkuu.'
- source_word: הַנְּשִׂיאִם
  choice: viongozi
  rationale: Neno hili linawahusu viongozi rasmi wa makabila au jumuiya. 'Viongozi' ni wazi kwa msomaji wa sasa bila kuleta dhana ya kifalme inayoweza kuambatana na 'wakuu' au 'wana wa mfalme.'
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: Huwasilisha jumuiya iliyokusanyika kama mwili wa watu, na huhifadhi uzito wa tukio la hadharani.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye mlango wa Hema la Kukutania
  rationale: '''Mlango'' ni usemi wa kawaida wa Kiswahili kwa sehemu ya kuingilia; ''Hema la Kukutania'' huhifadhi maana ya mahali pa kukutana iliyomo katika jina hilo la ibada.'
- source_word: לֵאמֹר
  choice: 'wakisema:'
  rationale: Hutambulisha moja kwa moja maneno yanayofuata katika mstari unaofuata na kuhifadhi uhusiano wa kisintaksia wa Kiebrania.
theological_decisions:
- issue: Mazingira ya hadharani na ya kisheria ya ombi la wanawake
  choice: Kurudia 'mbele ya' na kutaja Musa, Eleazari, viongozi, na kusanyiko lote
  alternative: Kufupisha orodha kuwa maelezo ya jumla kuhusu wenye mamlaka
  rationale: Muundo wa chanzo unasisitiza kwamba shauri liliwasilishwa wazi mbele ya mamlaka za kidini na za jumuiya; kulifupisha kungepunguza uzito huo.
- issue: Maana ya עֵדָה
  choice: kusanyiko
  alternative: mkutano au jumuiya
  rationale: '''Kusanyiko'' huonyesha watu waliokusanyika kama kundi la agano bila kulifanya neno hilo kuwa la dhehebu fulani.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kurudia 'mbele ya' umehifadhiwa kwa kusisitiza mazingira rasmi. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
