base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/017.yaml
  text: who will go out before them and come in before them[a], and who will lead them out and bring them in[c][b], so that the congregation of Yahweh may not be like sheep that have no shepherd.
translation:
  language: sw
  text: Atakayetoka mbele yao na kuingia mbele yao,[a] atakayewaongoza watoke na kuwaingiza,[b] ili kusanyiko la Yahweh[c] lisiwe kama kondoo wasio na mchungaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakayetangulia mbele yao,” katika matukio yote mawili.
    reason: lexical_alternative
  - marker: b
    text: Mfululizo wa maneno “atakayetoka ... kuingia ... atakayewaongoza watoke ... kuwaingiza” ni njia ya Kiebrania ya kueleza uongozi wa umma katika mambo yote.
    reason: cultural_note
  - marker: c
    text: Au, “jumuiya ya Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: atakaye-
  rationale: Kiambishi cha uhusiano cha nafsi ya tatu kinaeleza kiongozi anayeombwa katika mstari uliotangulia na ni cha asili katika Kiswahili.
- source_word: יֵצֵא ... יָבֹא
  choice: atatoka ... kuingia
  rationale: Vitenzi hivi vimehifadhiwa kama jozi ya mwendo inayotazamiwa kwa kiongozi huyo; muundo wa pili umeunganishwa kwa 'na' ili sentensi iwe ya asili.
- source_word: לִפְנֵיהֶם
  choice: mbele yao
  rationale: Huhifadhi maana ya kuwa mbele ya watu, ikiwa pia na wazo la kuwaongoza bila kulifafanua kupita kiasi.
- source_word: יוֹצִיאֵם
  choice: atakayewaongoza watoke
  rationale: Hiphil ya יצא ni ya kisababishi; usemi huu unaonyesha kuwa kiongozi anawaongoza watu watoke, badala ya mwendo wa vitu usio wa kibinafsi.
- source_word: יְבִיאֵם
  choice: kuwaingiza
  rationale: Hiphil ya בוא imetafsiriwa kwa kitenzi cha kisababishi kinacholingana kwa kawaida na 'kuwaongoza watoke.'
- source_word: עֲדַת יְהוָה
  choice: kusanyiko la Yahweh
  rationale: עֵדָה ni jumuiya ya watu waliokusanyika; 'kusanyiko' ni neno la kawaida na lenye heshima. Jina יהוה limeandikwa 'Yahweh' badala ya kubadilishwa kuwa cheo.
- source_word: כַּצֹּאן
  choice: kama kondoo
  rationale: Nomino ya Kiebrania ni ya mkusanyiko; 'kondoo' katika Kiswahili inaweza kutaja kundi bila kubadili tashbihi.
- source_word: רֹעֶה
  choice: mchungaji
  rationale: Ni neno la kawaida kwa mtu anayechunga kondoo na huhifadhi sitiari ya uongozi bila kuingiza cheo cha baadaye cha kidini.
theological_decisions:
- issue: Uwakilishi wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; 'Yahweh' hulihifadhi kwa unukuzi bila kulibadilisha kuwa cheo.
- issue: Maana ya mfululizo wa kutoka, kuingia, kuwaongoza watoke, na kuwaingiza
  choice: Taswira halisi ya mwendo imehifadhiwa
  alternative: Kufupisha kuwa 'atakayewaongoza katika mambo yote'
  rationale: Kiebrania hutumia mwendo halisi kama maelezo mapana ya uongozi wa hadharani, kisha huunganisha jambo hilo na mfano wa mchungaji. Kuhifadhi maneno hayo kunatunza taswira na upeo wake bila kuamua maana kwa ufafanuzi wa ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa Kiebrania umehifadhiwa pale unapobeba taswira ya uongozi, huku unganisho la sentensi likifanywa kuwa la kawaida katika Kiswahili.
