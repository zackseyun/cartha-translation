  yaml_path: translation/ot/numbers/027/016.yaml
  text: May Yahweh[a], the God of the spirits of all flesh, appoint a man over the congregation[c][b],
translation:
  language: sw
  text: Yahwe[a], Mungu wa roho za wote wenye mwili[b], amteue mwanamume kuwa juu ya kusanyiko[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “BWANA, Mungu wa roho za wote wenye mwili, amteue mwanamume kuwa juu ya kusanyiko.”
    reason: lexical_alternative
  - marker: b
    text: “Wote wenye mwili” ni nahau ya Kiebrania inayoweza kumaanisha wanadamu wote kwa kuwa wao ni viumbe wenye kufa.
    reason: cultural_note
  - marker: c
    text: Au, “mkutano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְקֹד
  choice: amteue
  rationale: Katika muktadha huu, kitenzi פקד kinamaanisha kumweka au kumchagua mtu kwa jukumu la uongozi. ‘Amteue’ ni Kiswahili cha kawaida na huonyesha wazi uteuzi rasmi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa na cheo kama ‘BWANA’.
- source_word: אֱלֹהֵי הָרוּחֹת
  choice: Mungu wa roho
  rationale: ‘Roho’ huhifadhi namna ya pekee ya kumtaja Mungu hapa na katika Hesabu 16:22, ikirejelea uhai wa ndani wa viumbe ulio chini ya mamlaka na ujuzi wake.
- source_word: לְכָל בָּשָׂר
  choice: za wote wenye mwili
  rationale: Usemi huu unahifadhi picha ya Kiebrania ya ‘mwili wote’ huku ukieleweka kwa Kiswahili. Katika muktadha huu unawahusu wanadamu wote katika hali yao ya kuwa viumbe wenye kufa.
- source_word: אִישׁ
  choice: mwanamume
  rationale: Nomino ya Kiebrania ni ya kiume, umoja, na muktadha unahusu mwanamume atakayechukua nafasi ya Musa; kwa hiyo jinsia yake haijaondolewa katika tafsiri.
- source_word: עַל הָעֵדָה
  choice: awe juu ya kusanyiko
  rationale: עֵדָה ni jumuiya ya agano ya Israeli iliyokusanyika. ‘Kusanyiko’ huhifadhi maana hiyo ya kijumuiya na rasmi, nayo ‘awe juu ya’ hudumisha wazo la mamlaka ya uongozi.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu katika ombi
  choice: Yahwe ... na amteue
  alternative: BWANA ... na amteue
  rationale: Matini ina jina יהוה moja kwa moja. Kutumia ‘Yahwe’ huhifadhi jina hilo la agano, na muundo ‘na amteue’ huonyesha ombi au tamanio bila kuligeuza kuwa amri inayotolewa kwa Mungu.
- issue: Jinsia ya אִישׁ
  choice: mwanamume
  alternative: mtu
  rationale: Ingawa אִישׁ wakati mwingine inaweza kumaanisha ‘mtu,’ hapa ni ya kiume na muktadha wa karibu unamhusu mrithi wa kiume wa Musa. ‘Mwanamume’ huhifadhi taarifa hiyo bila kuongeza fundisho jingine.
- issue: Maana ya ‘roho za wote wenye mwili’
  choice: Kudumisha usemi wa kimafumbo
  alternative: Mungu wa roho za wanadamu wote
  rationale: Muundo rasmi unahifadhi mvutano wa matini kati ya ‘roho’ na ‘mwili’ na hauamui kimya kimya ikiwa ‘mwili wote’ hapa unapaswa kufafanuliwa tu kuwa wanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa ombi ‘na amteue’ umehifadhiwa, pamoja na usemi wa Kiebrania unaotofautisha ‘roho’ na ‘mwili.’
