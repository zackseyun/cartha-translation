  variant: Standard East African Swahili
source:
  edition: WLC
  text: כַּ/אֲשֶׁר֩ מְרִיתֶ֨ם פִּ֜/י בְּ/מִדְבַּר צִ֗ן בִּ/מְרִיבַת֙ הָֽ/עֵדָ֔ה לְ/הַקְדִּישֵׁ֥/נִי בַ/מַּ֖יִם לְ/עֵינֵי/הֶ֑ם הֵ֛ם מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/014.yaml
  text: because you rebelled against my command in the wilderness of Zin[a], in the strife of the congregation, by not treating me as holy at the waters before their eyes[b]. These are the waters of Meribath-kadesh in the wilderness of Zin.
translation:
  language: sw
  text: kwa sababu mliasi agizo langu katika nyika ya Sini, katika mabishano ya kusanyiko, kwa kutonionyesha kuwa mtakatifu kwenye maji mbele ya macho yao.[a] Haya ndiyo maji ya Meriba ya Kadeshi[b], katika nyika ya Sini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “kunifanya nionekane mtakatifu mbele ya macho yao.” Kitenzi-jina cha Kiebrania kina umbo chanya, lakini muktadha unaonyesha kwamba Musa na Haruni hawakufanya hivyo.
    reason: lexical_alternative
  - marker: b
    text: Au “Meriba-Kadeshi”; kwa maana halisi zaidi, “mabishano ya Kadeshi.”
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: kwa sababu
  rationale: Katika muktadha huu neno hilo linaeleza sababu ya Musa na Haruni kutoruhusiwa kuingia katika nchi; tafsiri ya kisababishi ni wazi na ya kawaida katika Kiswahili.
- source_word: מְרִיתֶם פִּי
  choice: mliasi agizo langu
  rationale: Kitenzi מָרָה humaanisha kuasi au kukaidi mamlaka, na פִּי, kwa maana halisi ‘kinywa changu,’ hapa ni nahau inayorejelea agizo la Mungu.
- source_word: בְּמִדְבַּר צִן
  choice: katika nyika ya Sini
  rationale: ‘Nyika’ huwasilisha vizuri eneo kame lisilolimwa, na ‘Sini’ ni umbo la Kiswahili la jina la mahali צִן.
- source_word: בִּמְרִיבַת הָעֵדָה
  choice: wakati wa mabishano ya kusanyiko
  rationale: Kifungu hiki kinaitambulisha hali ya mabishano iliyohusisha jumuiya iliyokusanyika; ‘kusanyiko’ ni neno la kawaida lenye uzito unaofaa kwa עֵדָה.
- source_word: לְהַקְדִּישֵׁנִי
  choice: kwa kutonionyesha kuwa mtakatifu
  rationale: Ingawa umbo la Kiebrania ni chanya, ‘kunifanya nionekane mtakatifu,’ muktadha unaonyesha kwamba Musa na Haruni walishindwa kufanya hivyo. Kiswahili kinahitaji kushindwa huko kusemwe wazi ili maana isieleweke kinyume.
- source_word: בַמַּיִם לְעֵינֵיהֶם
  choice: pale penye maji mbele ya macho yao
  rationale: ‘Pale penye maji’ huonyesha mahali na mazingira ya tukio, huku ‘mbele ya macho yao’ ikihifadhi msisitizo wa Kiebrania kwamba jambo hilo lilifanyika hadharani.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: maji ya Meriba ya Kadeshi
  rationale: Tafsiri hii inahifadhi jina linalotambulika ‘Meriba’ na uhusiano wake na Kadeshi, huku ikibaki ya asili katika Kiswahili.
theological_decisions:
- issue: Maana ya לְהַקְדִּישֵׁנִי katika maelezo ya uasi
  choice: kwa kutonionyesha kuwa mtakatifu
  alternative: kunifanya nionekane mtakatifu mbele yao
  rationale: Kitenzi-jina cha Kiebrania ni chanya kiumbo, lakini kimeunganishwa na uasi wa Musa na Haruni na hivyo kinaeleza jambo waliloshindwa kufanya. Kuweka ukanushi wazi kunawasilisha muktadha bila kuongeza fundisho la kimadhehebu.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina ya maeneo yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili: Sini, Meriba, na Kadeshi. Muundo wa sentensi umehifadhi sababu ya hukumu, tukio la mabishano, na kushindwa kuonyesha utakatifu wa Mungu hadharani.'
