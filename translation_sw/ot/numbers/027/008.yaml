  yaml_path: translation/ot/numbers/027/008.yaml
  text: And you shall speak to the sons of Israel[a], saying, ‘If a man dies and has no son, then you shall transfer his inheritance to his daughter.’
translation:
  language: sw
  text: Nawe waambie wana wa Israeli[a], ukisema, ‘Mwanamume akifa, naye hana mwana wa kiume, mtamrithisha binti yake urithi wake.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania kihalisi ni “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: Nawe utawaambia wana wa Israeli
  rationale: Kirai בְּנֵי יִשְׂרָאֵל kihalisi ni ‘wana wa Israeli.’ Kiswahili hiki kinahifadhi taswira ya kifamilia na umbo la kiume la Kiebrania; tanbihi inataja tafsiri ya kawaida zaidi, ‘Waisraeli.’
- source_word: תְּדַבֵּר לֵאמֹר
  choice: utawaambia ... ukisema
  rationale: Muundo huu unawakilisha fomula ya Kiebrania ya kuanzisha hotuba, huku ukiendelea kuwa wa kawaida na wenye kueleweka kwa Kiswahili.
- source_word: אִישׁ
  choice: Mtu
  rationale: Ingawa אִישׁ inaweza kumaanisha ‘mwanamume,’ hapa inaanzisha kisa cha kisheria. ‘Mtu’ ni ya kawaida katika sheria ya Kiswahili, huku ‘mwana wa kiume’ baadaye ikihifadhi wazi jinsia ya mrithi anayekosekana.
- source_word: כִּי יָמוּת
  choice: akifa
  rationale: Katika sheria ya visa, כִּי pamoja na kitenzi hiki huanzisha hali ya sharti; ‘akifa’ ni uwasilishaji wa asili wa Kiswahili wenye maana ya ‘ikiwa atakufa.’
- source_word: וּבֵן אֵין לוֹ
  choice: naye hana mwana wa kiume
  rationale: ‘Mwana wa kiume’ huonyesha wazi kwamba בֵּן ni son, si mtoto kwa ujumla, na hivyo huhifadhi msingi wa sheria hii ya urithi.
- source_word: וְהַעֲבַרְתֶּם
  choice: mtauhamishia
  rationale: Hifili ya עבר hapa ina maana ya kisheria ya kufanya urithi upite kwa mpokeaji mwingine. ‘Hamishia’ huwasilisha uhamisho huo na kiambishi cha mtendewa humtaja mpokeaji kwa njia ya kawaida ya Kiswahili.
- source_word: נַחֲלָתוֹ
  choice: urithi wake
  rationale: נַחֲלָה hapa ni mali au haki ya kurithi; ‘urithi’ ndiyo istilahi iliyo wazi na ya kawaida zaidi katika muktadha huu.
- source_word: לְבִתּוֹ
  choice: kwa binti yake
  rationale: לְ humtaja mpokeaji wa urithi. Baada ya kitenzi ‘mtauhamishia,’ ‘kwa binti yake’ hutoa maana ya uhamisho kwenda kwake kwa Kiswahili cha kawaida.
