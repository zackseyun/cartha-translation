  yaml_path: translation/ot/numbers/027/012.yaml
  text: Then Yahweh said to Moses[b][a], “Go up to this mountain of the Abarim and see the land that I have given to the sons of Israel.”
translation:
  language: sw
  text: Kisha Yahwe akamwambia Musa, “Panda mlima huu wa Abarimu[a], na uione nchi ambayo nimewapa wana wa Israeli[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mlima wa Abarimu” au “Mlima Abarimu.” Kiebrania, kwa neno kwa neno, ni “mlima wa Abarimu.”
    reason: lexical_alternative
  - marker: b
    text: Au “Waisraeli” au “watu wa Israeli.” Kiebrania ni “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limeandikwa kwa umbo linalotamkika kiasili katika Kiswahili, badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa simulizi unaendeleza tukio linalofuata; ‘Kisha’ pamoja na ‘akamwambia’ ni mtiririko wa kawaida wa Kiswahili.
- source_word: עֲלֵה
  choice: Panda juu
  rationale: Amri hii inaonyesha mwendo wa kwenda mahali palipo juu; ‘panda juu’ ni wazi na ya kawaida.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: mlima huu wa Abarimu
  rationale: Inahifadhi kiashiria ‘huu’ na muundo wa Kiebrania wa ‘mlima wa Abarimu,’ huku jina la mahali likinakiliwa kwa namna inayofaa Kiswahili.
- source_word: וּרְאֵה
  choice: ukaione
  rationale: Inaunganisha amri ya pili na ya kwanza kwa mtiririko wa kawaida wa Kiswahili, huku ikihifadhi maana ya kuona nchi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha wa ahadi kwa Israeli, ‘nchi’ ndiyo tafsiri ya kawaida na inayoeleweka ya אֶרֶץ.
- source_word: נָתַתִּי
  choice: nimewapa
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye matokeo yanayoendelea, na hivyo kudumisha uhakika wa zawadi ya Mungu.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inafuata kwa karibu muundo wa Kiebrania ‘wana wa Israeli’ na pia ni usemi unaotambulika katika Kiswahili cha Biblia.
theological_decisions:
- issue: Uwasilishaji wa jina la agano יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: ‘Yahwe’ huhifadhi jina binafsi la Mungu lililo katika matini, bila kulibadilisha kuwa cheo au kuingiza mapokeo ya dhehebu fulani.
- issue: Uwasilishaji wa לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: ‘Wana wa Israeli’ huhifadhi kwa uwazi umbo la Kiebrania, ingawa katika muktadha huu usemi huo unalitaja taifa la Israeli kwa ujumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo ‘ukaione’ unaendeleza mfuatano wa amri kwa ulaini, na ‘wana wa Israeli’ huhifadhi uwazi wa matini chanzo.
