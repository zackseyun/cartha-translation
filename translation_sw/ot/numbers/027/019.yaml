base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/019.yaml
  text: You shall set him before Eleazar the priest and before all the congregation[a], and you shall commission him in their sight.
translation:
  language: sw
  text: Utamweka mbele ya Eleazari, kuhani, na mbele ya kusanyiko lote; kisha utamwagiza mbele yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utamkabidhi wajibu” au “utamwamuru.” Kitenzi cha Kiebrania kwa kawaida humaanisha kuamuru au kuagiza; katika muktadha huu kinaweza kumaanisha kumpa Yoshua wajibu wake hadharani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: utamweka mbele ya
  rationale: Hifili ya עמד ina maana ya kumsababisha mtu asimame au kumweka mbele ya wengine; usemi huu wa Kiswahili unaonyesha tendo rasmi bila kulifafanua kupita kiasi.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Hutoa maana ya mahali au kuwapo rasmi mbele ya mtu, na inafaa katika muktadha wa tukio la hadhara.
- source_word: אֶלְעָזָר
  choice: Eleazari
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Ni cheo bayana kinachoonyesha wadhifa wa Eleazari; Kiswahili hakihitaji kibainishi tofauti ili kuonyesha uyakinifu huu.
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה hapa ni jumuiya ya Israeli iliyokusanyika; “kusanyiko lote” ni lugha ya sasa, wazi, na huhifadhi wazo la kundi lililokusanyika.
- source_word: וְצִוִּיתָה
  choice: nawe utamkabidhi wajibu
  rationale: Ingawa צוה mara nyingi humaanisha kuamuru, katika tukio hili la kumweka Yoshua rasmi mbele ya watu inaelekea kumaanisha kumpa jukumu lenye mamlaka. Tanbihi inadumisha maana mbadala ya moja kwa moja.
- source_word: לְעֵינֵיהֶם
  choice: mbele yao
  rationale: Nahau ya Kiebrania, kihalisi “machoni pao,” inaonyesha tendo lililofanywa hadharani na kushuhudiwa nao; “mbele yao” ni Kiswahili cha kawaida.
theological_decisions:
- issue: Kuwekwa kwa Yoshua hadharani katika mamlaka yake
  choice: Kutafsiri צוה kama “kumkabidhi wajibu” katika muktadha huu.
  alternative: “kumwamuru” au “kumpa maagizo”
  rationale: Muktadha unaeleza tendo rasmi la kumpa Yoshua jukumu mbele ya Eleazari na kusanyiko. Tafsiri hii inaonyesha kukabidhiwa jukumu bila kuongeza dai la kimadhehebu, huku tanbihi ikihifadhi maana nyingine halali za kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kurudiwa kwa “mbele ya” umehifadhiwa kwa sababu unaakisi uzito wa hadhara katika maandishi ya Kiebrania.
