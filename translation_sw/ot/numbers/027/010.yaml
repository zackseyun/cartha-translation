  text: But if he has no brothers[a], then you shall give his inheritance to his father's brothers.
translation:
  language: sw
  text: Lakini ikiwa hana ndugu wa kiume, mtampa urithi wake ndugu wa baba yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, ami zake (ndugu wa baba yake).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Kiunganishi pamoja na kisharti kinaendeleza mfululizo wa masharti ya kisheria; “Lakini ikiwa” huonyesha hatua inayofuata yenye hali tofauti.
- source_word: אֵין לוֹ
  choice: hana
  rationale: 'Muundo wa Kiebrania wa kukanusha kuwapo pamoja na kihusishi na kiambishi cha nafsi unaelezwa kwa Kiswahili cha kawaida kama umilikaji: “hana.”'
- source_word: אַחִים
  choice: ndugu wa kiume
  rationale: Nomino ya Kiebrania ni wingi wa kiume na katika sheria hii ya urithi inawahusu ndugu wa kiume, hivyo tafsiri hii huepuka utata wa neno la Kiswahili “ndugu.”
- source_word: וּנְתַתֶּם
  choice: mtampa
  rationale: Kitenzi kinaelekeza jamii au wenye mamlaka katika nafsi ya pili wingi; wakati ujao wa Kiswahili una nguvu ya agizo la kisheria katika muktadha huu.
- source_word: נַחֲלָתוֹ
  choice: urithi wake
  rationale: Katika muktadha huu נַחֲלָה ni mali au sehemu inayorithiwa; “urithi wake” ni tafsiri wazi na ya kawaida.
- source_word: לַאֲחֵי אָבִיו
  choice: ndugu wa baba yake
  rationale: Huhifadhi kwa karibu muundo wa Kiebrania, “ndugu wa baba yake,” bila kuubadili moja kwa moja kuwa istilahi ya ujamaa ambayo inaweza kuwa pana katika matumizi ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Ndugu wa kiume” imechaguliwa katika kisharti cha kwanza ili kuonyesha jinsia iliyokusudiwa na sheria; katika kifungu cha mwisho muundo halisi “ndugu wa baba yake” umehifadhiwa, huku ufafanuzi wa kiujamaa ukiwekwa katika tanbihi.
