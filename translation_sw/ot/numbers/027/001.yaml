base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/001.yaml
  text: 'Then the daughters of Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, from the clans of Manasseh son of Joseph, came near. And these were the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: sw
  text: 'Ndipo binti za Selofehadi, mwana wa Heferi, mwana wa Gileadi, mwana wa Makiri, mwana wa Manase, wa koo za Manase mwana wa Yosefu, wakakaribia.[a] Na haya ndiyo majina ya binti zake: Mahla, Noa,[b] Hogla, Milka na Tirsa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “wakaja karibu” au “wakajitokeza mbele.” Maneno hayo huenda yakadokeza kujitokeza ili kuwasilisha ombi rasmi, kama mistari inayofuata inavyoeleza.'
    reason: lexical_alternative
  - marker: b
    text: Noa hapa ni jina la mmoja wa binti za Selofehadi, si yule mwanamume Noa anayetajwa katika Mwanzo.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: wakakaribia
  rationale: Kitenzi cha Kiebrania קרב katika Qal, nafsi ya tatu wingi wa kike, kinaeleza kuja karibu au kujitokeza mbele. “Wakakaribia” huhifadhi maana hiyo bila kutaja mamlaka ambayo haijaelezwa wazi katika mstari huu.
- source_word: בְּנוֹת
  choice: binti za
  rationale: Katika muundo huu wa nasaba, neno hilo linamaanisha binti halisi wa Selofehadi; orodha ya majina inayofuata inathibitisha hilo.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: mwana wa ... mwana wa ... mwana wa ... mwana wa
  rationale: Mlolongo kamili wa nasaba umehifadhiwa kwa sababu unaweka msingi wa uhusiano wao wa kikoo na dai la urithi linalofuata.
- source_word: לְמִשְׁפְּחֹת
  choice: wa koo za
  rationale: מִשְׁפָּחָה katika muktadha wa kikabila humaanisha ukoo. Kihusishi ל kinaonyesha ushirika; “wa koo za” ni Kiswahili cha kawaida na chenye maana hiyo.
- source_word: מְנַשֶּׁה בֶן יוֹסֵף
  choice: Manase mwana wa Yosefu
  rationale: Nasaba imewekwa wazi ili kuhifadhi uhusiano wa kabila la Manase na ukoo wa Yosefu.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: Majina ya binti zake yalikuwa
  rationale: Huu ni usemi wa kawaida wa kutanguliza orodha ya majina katika simulizi. “Zake” humrejelea Selofehadi bila utata.
- source_word: מַחְלָה נֹעָה וְחָגְלָה וּמִלְכָּה וְתִרְצָה
  choice: Mahla, Noa, Hogla, Milka na Tirsa
  rationale: Majina yameandikwa kwa maumbo yanayosomeka kwa kawaida katika Kiswahili, yakifuata sauti za Kiebrania kadiri inavyowezekana.
