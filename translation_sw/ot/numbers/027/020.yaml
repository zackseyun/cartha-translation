  yaml_path: translation/ot/numbers/027/020.yaml
  text: And you shall put some of your splendor on him[c][b][a], so that all the congregation of the sons of Israel may obey.
translation:
  language: sw
  text: Nawe utaweka juu yake sehemu ya utukufu wako[a], ili kusanyiko lote la wana wa Israeli[c] limtii[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu ya fahari yako,” “sehemu ya adhama yako,” au “sehemu ya heshima yako.” Neno la Kiebrania linaweza kumaanisha utukufu, fahari, adhama, au heshima, pamoja na mamlaka yanayohusiana na cheo.
    reason: lexical_alternative
  - marker: b
    text: Au “limsikilize” au “limsikie.” Kitenzi cha Kiebrania mara nyingi humaanisha kusikia kwa namna inayoleta utii.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה ... עָלָיו
  choice: utaweka juu yake
  rationale: Ingawa נָתַן kwa msingi humaanisha “kutoa,” muundo wake pamoja na עַל katika muktadha wa kumweka Yoshua madarakani unaonyesha kukabidhi au kuweka kitu juu yake.
- source_word: מֵהוֹדְךָ
  choice: sehemu ya heshima yako
  rationale: הוֹד inaweza kumaanisha fahari, utukufu, adhama, au heshima yenye mamlaka. Kiambishi מִן kinaonyesha kwamba ni sehemu, si sifa yote ya Musa, inayowekwa juu ya Yoshua.
- source_word: לְמַעַן
  choice: ili
  rationale: Neno hili linaanzisha kusudi la tendo, na “ili” ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: יִשְׁמְעוּ
  choice: limtii
  rationale: שׁמע inaweza kumaanisha kusikia, kusikiliza, au kutii. Katika muktadha wa kumkabidhi Yoshua uongozi, maana ya kuitikia kwa utii ndiyo inayofaa zaidi.
- source_word: כָּל עֲדַת
  choice: kusanyiko lote
  rationale: עֵדָה humaanisha jumuiya iliyokusanyika; “kusanyiko lote” huhifadhi dhana hiyo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii huhifadhi usemi wa kifamilia wa Kiebrania badala ya kuufanya tu “Waisraeli.”
theological_decisions:
- issue: Sifa anayokabidhiwa Yoshua kutoka kwa Musa
  choice: “Heshima” imetumika, huku muktadha ukidokeza pia hadhi na mamlaka ya cheo.
  alternative: “Mamlaka,” “fahari,” “utukufu,” au “adhama.”
  rationale: הוֹד haitaji mamlaka pekee kwa uwazi; ina wigo wa heshima, fahari, na adhama. “Heshima” huhifadhi upana huo bila kuficha kwamba katika muktadha huu inahusiana na mamlaka ya uongozi.
- issue: Maana ya שׁמע katika kusudi la kumweka Yoshua
  choice: “Limtii”
  alternative: “Limsikilize” au “limsikie.”
  rationale: Muktadha wa kukabidhi uongozi unaelekeza kwenye kusikia kunakoambatana na kuitikia na kutii, ingawa maana pana ya kitenzi imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo “utaweka juu yake” umehifadhi taswira ya kukabidhi hadhi, na upatanisho wa kisarufi “kusanyiko ... limtii” ni wa kawaida katika Kiswahili.
