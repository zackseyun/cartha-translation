  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח אֶת יְהוֹשֻׁ֗עַ וַ/יַּֽעֲמִדֵ֨/הוּ֙ לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/022.yaml
  text: 'And Moses did as Yahweh had commanded him: he took Joshua and set him before Eleazar the priest and before all the congregation[a].'
translation:
  language: sw
  text: Musa akafanya kama Yahwe alivyomwamuru. Akamchukua Yoshua na kumweka mbele ya Eleazari kuhani na mbele ya kusanyiko lote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumsimamisha mbele ya”; kitenzi cha Kiebrania kinaweza pia kutafsiriwa “kumwasilisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi עשה kinaonyesha kwamba Musa alitekeleza agizo lililotangulia; “akafanya” ni tafsiri ya kawaida na ya moja kwa moja katika muktadha huu.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: Kiunganishi hiki kinalinganisha tendo la Musa moja kwa moja na agizo la Yahwe; “kama” ni cha asili na kifupi katika Kiswahili.
- source_word: צִוָּה ... אֹתוֹ
  choice: alivyomwamuru
  rationale: Muundo huu unaonyesha alichomwamuru Musa; umbo la Kiswahili linaweka wazi mtendwa bila kuongeza maana.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika Tetragramatoni limeandikwa kwa namna inayotumika kwa kawaida katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וַיִּקַּח אֶת יְהוֹשֻׁעַ
  choice: akamchukua Yoshua
  rationale: לקח kimsingi humaanisha “chukua”; hapa Musa anamchukua Yoshua ili amweke hadharani mbele ya kuhani na kusanyiko.
- source_word: וַיַּעֲמִדֵהוּ
  choice: na kumweka
  rationale: Hifili ya עמד inaweza kumaanisha kumsimamisha, kumweka, au kumwasilisha mtu. “Kumweka” huhifadhi maana ya tendo la kimwili na la hadharani bila kufasiri kupita kiasi.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Kirai hiki kinaonyesha kuwekwa katika uwepo wa Eleazari na kusanyiko; “mbele ya” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Ni tafsiri ya moja kwa moja ya cheo cha Eleazari; Kiswahili cha asili hakihitaji kibainishi tofauti cha “the” hapa.
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה hapa ni jumuiya ya Israeli iliyokusanyika. “Kusanyiko lote” huwasilisha kwa uwazi wazo la kundi zima lililokusanyika.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya tendo וַיַּעֲמִדֵהוּ katika kumweka Yoshua rasmi
  choice: kumweka mbele ya
  alternative: kumsimamisha mbele ya; kumwasilisha mbele ya
  rationale: “Kumweka” huhifadhi upana wa maana ya kitenzi cha Kiebrania, ambacho kinaweza kueleza kusimamishwa kimwili na pia kuwasilishwa hadharani, bila kulazimisha maana moja tu ya kiibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa asili na hadhi inayofaa maandiko. Majina yametolewa kama Musa, Yoshua, Eleazari, na Yahwe. Sentensi mbili zimetumiwa kwa uwazi, huku mfululizo wa masimulizi ya Kiebrania ukihifadhiwa kwa maumbo ya “aka-”.
