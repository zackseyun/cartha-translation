  text: וְ/אִם אֵ֣ין אַחִים֮ לְ/אָבִי/ו֒ וּ/נְתַתֶּ֣ם אֶת נַחֲלָת֗/וֹ לִ/שְׁאֵר֞/וֹ הַ/קָּרֹ֥ב אֵלָ֛י/ו מִ/מִּשְׁפַּחְתּ֖/וֹ וְ/יָרַ֣שׁ אֹתָ֑/הּ וְֽ/הָ֨יְתָ֜ה לִ/בְנֵ֤י יִשְׂרָאֵל֙ לְ/חֻקַּ֣ת מִשְׁפָּ֔ט כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/011.yaml
  text: And if his father has no brothers[a], then you shall give his inheritance to his nearest relative from his clan, and he shall possess it. This shall be for the sons of Israel a statute of judgment[d][c][b], just as Yahweh commanded Moses.
translation:
  language: sw
  text: Na ikiwa baba yake hana ndugu wa kiume, mtampa urithi wake jamaa yake wa damu aliye karibu zaidi naye, kutoka katika ukoo wake, naye ataurithi[a]. Hii itakuwa sheria ya hukumu[b] kwa wana wa Israeli[c], kama Yahwe alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye ataimiliki.”
    reason: lexical_alternative
  - marker: b
    text: Au, “agizo la kisheria” au “agizo la hukumu.”
    reason: lexical_alternative
  - marker: c
    text: Kwa Kiebrania, “wana wa Israeli,” usemi wa kawaida unaowataja watu wa Israeli kwa ujumla.
    reason: cultural_note
lexical_decisions:
- source_word: אַחִים
  choice: ndugu wa kiume
  rationale: Katika mfuatano huu wa sheria ya urithi, neno hili linamaanisha ndugu wa baba wa marehemu. Kiongezi “wa kiume” kinaweka wazi jinsia ya nomino ya Kiebrania bila kuibadili kuwa neno maalumu lisilokuwamo katika mstari, kama “wajomba.”
- source_word: נַחֲלָתוֹ
  choice: urithi wake
  rationale: “Urithi” linafaa kwa mali na haki ya kurithi inayohamishwa katika muktadha huu wa kisheria.
- source_word: שְׁאֵרוֹ הַקָּרֹב אֵלָיו
  choice: jamaa yake wa damu aliye karibu zaidi naye
  rationale: 'Tafsiri hii inaonyesha vipengele vyote viwili vya Kiebrania: uhusiano wa damu na kuwa jamaa wa karibu zaidi kwa daraja la ukoo.'
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: katika ukoo wake
  rationale: “Ukoo” unaonyesha kundi pana la kindugu linalohusika katika mpangilio wa kijamii na kisheria wa Israeli, si familia ya nyumbani tu.
- source_word: וְיָרַשׁ אֹתָהּ
  choice: naye ataurithi
  rationale: Kitenzi ירשׁ hapa kinaweza kumaanisha kurithi au kumiliki. “Ataurithi” ni cha kawaida katika Kiswahili na kinaendeleza wazi muktadha wa sheria ya urithi; maana nyingine imewekwa katika tanbihi.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: sheria ya hukumu
  rationale: Usemi huu unahifadhi dhana zote mbili za Kiebrania—agizo la kudumu na uamuzi wa kisheria—kwa lugha fupi yenye hadhi ya kisheria.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kwa wana wa Israeli
  rationale: Huu ni usemi wa kawaida wa agano unaolitaja taifa la Israeli; tafsiri inadumisha umbo la chanzo huku tanbihi ikifafanua matumizi yake ya kijamii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetafsiriwa kwa umbo la kawaida la kifonolojia na kiothografia katika Kiswahili, badala ya kubadilishwa na cheo kama “BWANA.”
theological_decisions:
- issue: Uwasilishaji wa jina la agano יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la Mungu la herufi nne. “Yahwe” hulihifadhi kama jina binafsi kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- issue: Maana ya לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi wa Kiebrania umehifadhiwa kwa sababu ni jina la kawaida la watu wa agano. Hata hivyo, haujafasiriwa kuwa unawahusu wanaume peke yao; tanbihi inaeleza kuwa unalitaja taifa.
- issue: Nguvu ya kisheria ya לְחֻקַּת מִשְׁפָּט
  choice: sheria ya hukumu
  alternative: agizo la kisheria
  rationale: Tafsiri iliyochaguliwa inaacha vipengele vyote viwili vya usemi wa Kiebrania vionekane, bila kuamua kimya kimya kama mkazo mkuu ni agizo, hukumu, au sheria kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka. Msamiati wa kisheria umehifadhiwa bila kufanya sentensi iwe nzito kupita kiasi. “Jamaa yake wa damu aliye karibu zaidi naye” huonyesha kwa uwazi utata na mkazo wa vipengele viwili vya Kiebrania, na “Yahwe” hufuata maumbo ya kawaida ya Kiswahili.
