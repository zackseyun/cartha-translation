base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/018.yaml
  text: And Yahweh said to Moses[a], “Take Joshua son of Nun, a man in whom is spirit, and lay your hand on him.”
translation:
  language: sw
  text: Yahwe akamwambia Musa, “Mchukue Yoshua mwana wa Nuni, mtu ambaye roho imo ndani yake[a], kisha uweke mkono wako juu yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu ambaye Roho yumo ndani yake,” au “mtu mwenye roho.” Kiebrania hakina kibainishi.
    reason: Kuhifadhi utata wa רוּחַ; kifungu kinaweza kurejelea Roho au roho/sifa ya ndani, bila kuamua mojawapo katika matini kuu.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Limetoholewa kwa namna iliyo wazi na ya kawaida katika Kiswahili, huku likihifadhi jina la agano la Mungu badala ya kulibadili kuwa cheo.
- source_word: קַח לְךָ
  choice: Mchukue
  rationale: Hii ni amri ya moja kwa moja na ya kawaida katika Kiswahili; kiwakilishi לְךָ ni sehemu ya nahau ya Kiebrania na hakihitaji kutafsiriwa kwa maneno ‘kwa ajili yako’ hapa.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yoshua mwana wa Nuni
  rationale: Majina yametoholewa kwa maumbo yanayoeleweka katika Kiswahili, na בִּן imetafsiriwa kwa usahihi kuwa ‘mwana wa.’
- source_word: אִישׁ
  choice: mtu
  rationale: Ingawa אִישׁ ni nomino ya kiume na Yoshua ni mwanamume, ‘mtu’ ndilo neno la asili zaidi katika kirai hiki cha Kiswahili bila kuficha utambulisho wake unaoonyeshwa wazi na jina lake.
- source_word: אֲשֶׁר רוּחַ בּוֹ
  choice: ambaye ndani yake mna roho
  rationale: Muundo huu unabaki karibu na maana halisi ‘ambaye roho imo ndani yake’ na hauamui kimyakimya kama רוּחַ ni Roho wa Mungu au roho/sifa ya ndani; utata wa Kiebrania umehifadhiwa.
- source_word: וְסָמַכְתָּ אֶת יָדְךָ עָלָיו
  choice: kisha uweke mkono wako juu yake
  rationale: ‘Kuweka mkono juu yake’ ni usemi wa kawaida unaowasilisha tendo la kumweka rasmi; umoja wa ‘mkono’ umehifadhiwa kama katika Kiebrania.
theological_decisions:
- issue: Ikiwa רוּחַ humaanisha Roho wa Mungu au roho/sifa ya ndani ya Yoshua
  choice: roho
  alternative: Roho
  rationale: Kiebrania hakina kibainishi katika kirai hiki. Herufi ndogo katika matini kuu huhifadhi utata huo badala ya kutambulisha wazi Roho wa Mungu, huku tanbihi ikionyesha uwezekano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kwa msomaji wa kawaida, lakini muundo ‘ndani yake mna roho’ umechaguliwa kimakusudi ili kuhifadhi utata wa chanzo. Alama ya tanbihi imewekwa mara tu baada ya kirai kinachohusika.
