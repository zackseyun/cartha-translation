  text: Then Moses spoke to Yahweh[a], saying,
translation:
  language: sw
  text: 'Kisha Musa akasema kwa Yahwe, akisema:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akasema
  rationale: Wayyiqtol inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akasema” ni njia ya asili ya kutafsiri tendo la kuzungumza kabla ya kauli ya moja kwa moja.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: אֶל
  choice: na
  rationale: Katika usemi wa Kiswahili “akasema na” huonyesha kwa kawaida mtu anayeambiwa; “kwa” lingeweza pia kueleweka, lakini hapa lingekuwa na ladha isiyo ya kawaida zaidi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la Kiebrania YHWH limetolewa kama jina binafsi, badala ya kubadilishwa kuwa cheo “BWANA.” Umbo “Yahwe” linafuata tahajia ya kawaida ya Kiswahili.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Katika Kiswahili cha asili, fomula ya Kiebrania ya kuanzisha maneno ya moja kwa moja inaonyeshwa kwa uwazi na nukta mbili; kuongeza “akisema” baada ya “akasema” kungeleta urudiaji usio wa lazima.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la herufi nne YHWH. “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo, huku tanbihi ikitaja desturi nyingine ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na wa kawaida kama mstari wa utangulizi wa maneno yanayofuata; nukta mbili zimetumiwa kwa sababu aya inayofuata inatoa yaliyosemwa.
