  text: Na ikiwa hana binti, mtawapa ndugu zake wa kiume urithi wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִם
  choice: Na ikiwa
  rationale: Huhifadhi kiunganishi וְ na kuendeleza mfuatano wa masharti ya kisheria kwa Kiswahili cha kawaida.
- source_word: אֵין ל/וֹ
  choice: hana
  rationale: Muundo wa Kiebrania wa kuwapo pamoja na לּוֹ humaanisha kwa ufasaha kwamba mtu huyo hana kitu kinachotajwa.
- source_word: בַּת
  choice: binti
  rationale: Nomino iko katika umoja na humaanisha binti.
- source_word: וּ/נְתַתֶּם
  choice: mtawapa
  rationale: Kitenzi ni nafsi ya pili wingi; katika sentensi ya sharti, wakati ujao huwasilisha agizo la kisheria kwa ufasaha. Kiambishi cha yambwa -wa- kinawarejelea ndugu wanaopokea urithi.
- source_word: נַחֲלָת/וֹ
  choice: urithi wake
  rationale: Katika sheria hii, נַחֲלָה ni mali au haki ya kurithi; “urithi wake” ni sahihi na ya kawaida.
- source_word: לְ/אֶחָי/ו
  choice: ndugu zake wa kiume
  rationale: אֶחָיו ni wingi wa kiume. Ufafanuzi “wa kiume” unaondoa utata wa neno la Kiswahili “ndugu,” ambalo linaweza pia kumaanisha jamaa au ndugu wa jinsia yoyote.
