base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/013.yaml
  text: And when you have seen it[a], you also will be gathered to your people, just as Aaron your brother was gathered.
translation:
  language: sw
  text: Na utakapokuwa umeiona[a], wewe pia utakusanywa pamoja na watu wako, kama vile Haruni, ndugu yako, alivyokusanywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kuiona.” Kiebrania kinaonyesha kwamba tendo la kuiona linatangulia kukusanywa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָה
  choice: Na baada ya kuiona
  rationale: Ni Qal nafsi ya pili umoja wa kiume ya ראה pamoja na kiunganishi. Katika muktadha, kuona nchi kunatangulia kukusanywa kwa watu wake; “baada ya kuiona” huonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: אֹתָהּ
  choice: -iona
  rationale: Kiwakilishi cha kitu cha kike umoja kinarejelea nchi inayotazamwa katika muktadha. Kiswahili hukirejelea kwa kiambishi cha ngeli husika ndani ya kitenzi.
- source_word: וְנֶאֱסַפְתָּ
  choice: utakusanywa
  rationale: Nifali ya אסף inadumisha taswira ya kukusanywa badala ya kuifupisha kuwa “utakufa.” Kauli tendwa pia inalingana na umbo la Kiebrania.
- source_word: אֶל עַמֶּיךָ
  choice: kwa watu wako
  rationale: Hii ni tafsiri ya karibu ya nahau ya Kiebrania, inayohifadhi mwangwi wa kifamilia na wa jamii bila kuibadili moja kwa moja kuwa “kwa mababu zako.”
- source_word: גַּם אָתָּה
  choice: wewe pia
  rationale: Hudumisha msisitizo kwamba Musa atapatwa na yaliyompata Haruni.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Huanzisha ulinganisho wa wazi na wa kawaida katika Kiswahili.
- source_word: נֶאֱסַף
  choice: alivyokusanywa
  rationale: Hudumisha nahau ileile ya kifo na uthabiti wa msamiati katika sehemu zote mbili za mstari.
- source_word: אַהֲרֹן אָחִיךָ
  choice: ndugu yako Haruni
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unahifadhi wazi uhusiano wa kindugu; “Haruni” ni umbo la jina lililozoeleka katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya nahau אסף אל־עמיו kuhusu kifo
  choice: utakusanywa kwa watu wako
  alternative: utakufa; utakusanywa kwa mababu zako; utaungana na jamaa zako katika kifo
  rationale: Tafsiri hii inadumisha nahau na mvutano wake wa kifamilia na kiteolojia badala ya kuipunguza kuwa taarifa tupu ya kifo au kuamua kwamba “watu” lazima wamaanishe “mababu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Nahau ya Kiebrania imehifadhiwa kwa uwazi; maelezo ya chini yanaonyesha uwezekano wa uhusiano wa wakati bila kulegeza maana ya msingi.
