  yaml_path: translation/ot/numbers/027/005.yaml
  text: So Moses brought their case before Yahweh[a].
translation:
  language: sw
  text: Basi Musa akaleta shauri lao mbele ya Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawasilisha dai lao la kisheria mbele ya Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: akaleta
  rationale: Hifili ya קרב humaanisha kuleta karibu au kuwasilisha. Katika muktadha huu wa kisheria, “akaleta” ni usemi wa kawaida unaoonyesha kwamba Musa alifikisha shauri hilo ili Yahweh aliamue.
- source_word: מִשְׁפָּטָן
  choice: shauri lao
  rationale: מִשְׁפָּט inaweza kumaanisha hukumu, haki, dai la kisheria, au shauri. Kiambishi cha nafsi ya tatu wingi wa kike kinawarejelea binti waliotajwa katika muktadha; “shauri lao” linaeleza jambo lao la kisheria bila kuamua mapema hukumu yake.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Neno hili humaanisha “mbele ya” au “katika uwepo wa.” “Mbele za” ni usemi wa Kiswahili unaofaa kwa kupeleka shauri kwa mwenye mamlaka ya kuliamua.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahweh” badala ya kubadilishwa na cheo, hivyo kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: וַ
  choice: Basi
  rationale: Waw hii inaendeleza simulizi kwa kuonyesha matokeo ya ombi lililotangulia. “Basi” huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina Tetragramatoni יהוה moja kwa moja. “Yahweh” huhifadhi jina binafsi badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Shauri lao” ni lugha ya kawaida ya kisheria; muundo mfupi unahifadhi mwendo wa simulizi la Kiebrania.
