base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/024.yaml
  text: For I have given to the Levites as an inheritance the tithe of the children of Israel, which they lift up to the LORD as a contribution; therefore I have said to them, ‘Among the children of Israel they shall have no inheritance.’
translation:
  language: sw
  text: Kwa maana nimewapa Walawi zaka ya wana wa Israeli, wanayomwinulia BWANA kama sadaka ya kuinuliwa, iwe urithi wao. Kwa hiyo nimewaambia, ‘Hawatakuwa na urithi miongoni mwa wana wa Israeli.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעְשַׂר
  choice: zaka
  rationale: Ni neno la kawaida la Kiswahili kwa sehemu ya kumi inayotolewa, na linaakisi maana mahususi ya neno la Kiebrania.
- source_word: יָרִימוּ
  choice: wanamwinulia
  rationale: Huhifadhi taswira halisi ya kuinua sadaka, badala ya kuifanya tu kuwa ‘kutoa’; kiambishi cha yambwa kinamrejelea BWANA kwa Kiswahili cha asili.
- source_word: תְּרוּמָה
  choice: mchango
  rationale: Hutoa maana pana ya kitu kilichotengwa na kutolewa kwa BWANA, bila kulazimisha istilahi finyu zaidi.
- source_word: נַחֲלָה
  choice: urithi
  rationale: Huhifadhi wazo la fungu la kudumu walilopewa Walawi na pia ulinganifu na urithi wa eneo ambao hawatapokea.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Ni tafsiri ya moja kwa moja, yenye hadhi na inayoeleweka kwa kawaida katika muktadha wa kibiblia.
theological_decisions:
- issue: Zaka kama urithi wa Walawi dhidi ya urithi wa eneo nchini Israeli
  choice: Kutumia ‘urithi’ katika sehemu zote mbili
  alternative: Kutumia ‘fungu’ kwa zaka na ‘urithi’ kwa ardhi
  rationale: Kurudia neno hilo huhifadhi mchezo wa kimakusudi wa נַחֲלָה katika chanzo na mvutano wa kwamba zaka ndiyo urithi wao kwa sababu hawana urithi miongoni mwa Israeli.
- issue: Kitendo cha kuinua mchango kwa BWANA
  choice: ‘wanamwinulia BWANA kuwa mchango’
  alternative: ‘wanamtolea BWANA kama sadaka’
  rationale: Uchaguzi huu huhifadhi kitendo cha kuinua kilicho wazi katika kitenzi cha Kiebrania, bila kukifafanua kupita kiasi kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imepangwa kwa mtiririko wa asili wa Kiswahili huku ikidumisha sababu inayotolewa na ‘kwa maana’ na hitimisho la ‘ndiyo maana’. ‘BWANA’ imetumiwa kwa jina la agano יהוה kulingana na desturi pana ya tafsiri za Kiswahili.
