base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/016.yaml
  text: 'And those to be redeemed from a month old[a], you shall redeem according to your valuation: five shekels of silver, by the sanctuary shekel; it is twenty gerahs.'
translation:
  language: sw
  text: 'Nao wale wanaopaswa kukombolewa, kuanzia umri wa mwezi mmoja, utawakomboa kwa kadirio lako: shekeli tano za fedha, kwa shekeli ya mahali patakatifu; hiyo ni gera ishirini.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, shekeli moja ya mahali patakatifu ni gera ishirini.
    reason: Ufafanuzi huu unabainisha kwamba kiwakilishi cha Kiebrania ‘hiyo’ kinarejelea shekeli ya mahali patakatifu kama kiwango cha uzani, si jumla ya fedha iliyotajwa.
lexical_decisions:
- source_word: וּפְדוּיָו
  choice: wale wanaopaswa kukombolewa
  rationale: Umbo hili la kitenzi-tendaji katika hali ya kutendwa pamoja na kiambishi chake ni gumu kisarufi. Katika muktadha linawaelekeza kwa ujumla wazaliwa wa kwanza ambao lazima wakombolewe; usemi huu wa Kiswahili ni wa kawaida na unahifadhi maana ya kutendwa.
- source_word: מִבֶּן חֹדֶשׁ
  choice: kuanzia umri wa mwezi mmoja
  rationale: Nahau hii inaonyesha kwamba wajibu wa ukombozi unaanza mtoto anapofikisha umri wa mwezi mmoja.
- source_word: תִּפְדֶּה
  choice: utawakomboa
  rationale: Kitenzi cha nafsi ya pili ya umoja katika agizo la kisheria kinaeleza wajibu. Kiambishi cha yambwa cha wingi kinaendana kwa kawaida na ‘wale wanaopaswa kukombolewa.’
- source_word: בְּעֶרְכְּךָ
  choice: kwa kadirio lako
  rationale: Neno ערך katika muktadha wa kikuhani na kisheria humaanisha thamani iliyokadiriwa; kiambishi cha nafsi ya pili ya umoja kimehifadhiwa katika ‘lako.’
- source_word: כֶּסֶף חֲמֵשֶׁת שְׁקָלִים
  choice: shekeli tano za fedha
  rationale: Huu ni mpangilio wa kawaida wa Kiswahili unaobainisha kiasi na nyenzo bila kubadili maana.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai hiki kinataja kiwango rasmi cha uzani kilichotumiwa. Kuongeza ‘kipimo cha’ hufanya kazi ya shekeli hiyo iwe wazi kwa msomaji wa sasa bila kuifanya kuwa sarafu tu.
- source_word: עֶשְׂרִים גֵּרָה הוּא
  choice: hiyo ni gera ishirini
  rationale: Tafsiri hii inadumisha kiwakilishi cha Kiebrania na thamani ya kipimo; tanbihi inaeleza kinachorejelewa na kiwakilishi hicho.
