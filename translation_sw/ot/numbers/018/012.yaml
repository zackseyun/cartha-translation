base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/012.yaml
  text: All the best of the oil[a], and all the best of the new wine and grain—their firstfruits, which they give to Yahweh—I have given to you.
translation:
  language: sw
  text: Mafuta yote yaliyo bora zaidi[a], divai mpya yote iliyo bora zaidi, na nafaka yote iliyo bora zaidi—malimbuko yao wanayompa Yahweh—nimekupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, neno lililotafsiriwa “bora zaidi” maana yake halisi ni “mafuta ya mnyama”; linapotumiwa kuhusu mafuta, divai mpya, na nafaka, ni nahau inayomaanisha sehemu nono au bora zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: bora
  rationale: Neno hili kwa maana halisi ni “mafuta,” lakini linapotumiwa kuhusu mazao humaanisha sehemu nzuri au bora zaidi. “Bora” ni ya asili katika Kiswahili na inafaa kwa mafuta, divai, na nafaka.
- source_word: יִצְהָר
  choice: mafuta
  rationale: Hurejelea mafuta mapya, kwa kawaida mafuta ya zeituni; hata hivyo, aina ya zeituni haijatajwa wazi katika neno lenyewe, hivyo “mafuta” hudumisha upana wa asili.
- source_word: תִּירוֹשׁ
  choice: divai mpya
  rationale: Hutaja divai iliyotoka karibuni na hudumisha tofauti yake na maneno ya Kiebrania yanayotaja divai kwa ujumla.
- source_word: דָגָן
  choice: nafaka
  rationale: Ni neno pana la mazao ya nafaka; “nafaka” ni Kiswahili sanifu, cha kawaida, na kisichoelekeza kwa zao moja tu.
- source_word: רֵאשִׁיתָם
  choice: malimbuko yake
  rationale: Katika muktadha wa mazao na sadaka, רֵאשִׁית hutaja sehemu ya kwanza ya mavuno. “Malimbuko yake” huwasilisha maana hiyo kwa ufupi na kwa usahihi.
- source_word: אֲשֶׁר יִתְּנוּ לַיהוָה
  choice: wanayompa Yahweh
  rationale: Kitenzi נתן ni “kutoa/kumpa”; “wanayompa” hufuata maana yake moja kwa moja huku kikisomeka kwa kawaida.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetafsiriwa kwa umbo “Yahweh,” likitambulisha jina binafsi lililo katika matini badala ya kulibadilisha kuwa cheo.
- source_word: לְךָ נְתַתִּים
  choice: nimekupa wewe
  rationale: Kauli timilifu inaonyesha mgao uliokwisha kuwekwa. Kiswahili huhitaji kuonyesha kiambishi cha mtendewa katika “nimekupa”; “wewe” huendeleza mkazo wa mpokeaji bila kuongeza kiwakilishi cha vitu kisichohitajika.
