source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֞ תְּרוּמַ֣ת מַתָּנָ֗/ם לְ/כָל תְּנוּפֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/ךָ֣ נְתַתִּ֗י/ם וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכַ֥ל אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/011.yaml
  text: 'And this is yours: the contribution of their gifts[a], with all the wave offerings of the sons of Israel. I have given them to you, and to your sons and your daughters with you, as a permanent statute[b]. Everyone in your house who is clean may eat it.'
translation:
  language: sw
  text: 'Na hiki ndicho chako: sehemu iliyotengwa ya zawadi zao,[a] pamoja na matoleo yote ya kutikiswa ya wana wa Israeli. Nimewapa ninyi—wewe, wanao, na binti zako walio pamoja nawe—vitu hivyo, kama sheria ya kudumu. Kila mtu wa nyumbani mwako aliye safi[b] anaweza kuila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “toleo la kuinuliwa.” Neno la Kiebrania linamaanisha sehemu iliyotengwa kwa matumizi matakatifu.
    reason: lexical_alternative
  - marker: b
    text: Hapa “safi” maana yake ni safi kiibada, si tu kuwa safi kimwili au mwadilifu kimaadili.
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמַת
  choice: sehemu iliyotengwa
  rationale: Neno hili linamaanisha sehemu ya mchango au toleo iliyotengwa kwa matumizi matakatifu. Tafsiri hii ni ya kawaida na inaeleweka bila kutegemea istilahi ya kale.
- source_word: מַתָּנָם
  choice: zawadi zao
  rationale: Huhifadhi maana ya msingi ya מַתָּנָה, ‘zawadi,’ pamoja na kiambishi cha wingi kinachomaanisha ‘zao,’ bila kulifanya neno hilo kuwa istilahi maalumu zaidi ya dhabihu.
- source_word: תְּנוּפֹת
  choice: matoleo ... ya kutikiswa
  rationale: Hii ni istilahi ya ibada kwa matoleo yaliyowasilishwa kwa kutikiswa mbele za Mungu; tafsiri inahifadhi tendo hilo la kiibada.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi muundo wa Kiebrania wa jina la pamoja badala ya kuubadilisha kuwa ‘Waisraeli.’
- source_word: נְתַתִּים
  choice: Nimekupa vitu hivyo
  rationale: Kauli timilifu inaonyesha kwamba sehemu zilizotajwa zimekabidhiwa tayari na zinaendelea kuwa haki ya mpokeaji. ‘Vitu hivyo’ huonyesha wazi kiwakilishi cha wingi cha Kiebrania.
- source_word: וּלְבָנֶיךָ וְלִבְנֹתֶיךָ אִתָּךְ
  choice: wanao na binti zako walio pamoja nawe
  rationale: Kiebrania kinawataja wana wa kiume na mabinti waziwazi; tafsiri inahifadhi makundi yote mawili na uhusiano wao na nyumba ya Aroni.
- source_word: לְחָק עוֹלָם
  choice: kuwa sheria ya kudumu
  rationale: חֹק ni agizo au sheria iliyowekwa, na עוֹלָם hapa huonyesha kuendelea kwake katika utaratibu wa agano.
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: Kila mtu wa nyumbani mwako aliye safi
  rationale: ‘Wa nyumbani mwako’ huonyesha watu wa kaya, huku ‘aliye safi’ ikihifadhi istilahi ya utakaso wa kiibada na kufafanuliwa katika tanbihi.
- source_word: יֹאכַל אֹתוֹ
  choice: anaweza kuila
  rationale: Kauli hii inaonyesha ruhusa au haki ya kula, si utabiri wa wakati ujao; kiwakilishi cha umoja kinarejelea sehemu iliyotengwa.
theological_decisions:
- issue: Maana ya usafi katika sheria ya kikuhani
  choice: ‘Aliye safi’ imetumiwa kwa maana ya usafi wa kiibada.
  alternative: Aliye safi kimaadili au kimwili tu.
  rationale: Muktadha unaweka masharti ya nani katika nyumba ya Aroni anayeruhusiwa kula sehemu takatifu; kwa hiyo kinachokusudiwa ni hali ya usafi wa kiibada, si hukumu ya tabia ya mtu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Sehemu iliyotengwa’ huepuka istilahi nzito isiyoeleweka, huku ‘matoleo ya kutikiswa’ ikihifadhi tendo maalumu la ibada. Muundo ‘wa nyumbani mwako’ unaonyesha kaya kuliko jengo pekee.
