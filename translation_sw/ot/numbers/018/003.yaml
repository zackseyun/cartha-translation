  text: וְ/שָֽׁמְרוּ֙ מִֽשְׁמַרְתְּ/ךָ֔ וּ/מִשְׁמֶ֖רֶת כָּל הָ/אֹ֑הֶל אַךְ֩ אֶל כְּלֵ֨י הַ/קֹּ֤דֶשׁ וְ/אֶל הַ/מִּזְבֵּ֨חַ֙ לֹ֣א יִקְרָ֔בוּ וְ/לֹֽא יָמֻ֥תוּ גַם הֵ֖ם גַּם אַתֶּֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/003.yaml
  text: They shall keep your charge and the charge of the whole tent[a], but they shall not come near the vessels of the sanctuary or the altar[b], so that neither they nor you may die.
translation:
  language: sw
  text: Watatimiza wajibu wako na wajibu wa hema lote. Lakini wasivikaribie vyombo vya mahali patakatifu[a] wala madhabahu, wasije wakafa, wao wala ninyi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vyombo vitakatifu” au “vitu vitakatifu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kwa karibu zaidi: “wala wasife, wao pia na ninyi pia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ מִשְׁמַרְתְּךָ
  choice: Watatimiza wajibu wako
  rationale: Kitenzi שׁמר pamoja na מִשְׁמֶרֶת huonyesha kutekeleza au kulinda wajibu uliokabidhiwa. ‘Watatimiza wajibu wako’ ni Kiswahili cha kawaida kinachodumisha wazo la wajibu wa Haruni ambao Walawi wanapaswa kuushughulikia.
- source_word: וּמִשְׁמֶרֶת כָּל הָאֹהֶל
  choice: na wajibu wa hema lote
  rationale: Kurudia ‘wajibu’ kunawakilisha kurudiwa kwa מִשְׁמֶרֶת, ‘lote’ kunawakilisha כָּל, na ‘hema’ ni maana ya moja kwa moja ya אֹהֶל katika muktadha huu.
- source_word: אַךְ
  choice: Lakini
  rationale: Neno hili linaweka mpaka au kizuizi dhidi ya wajibu uliotajwa kabla yake; ‘Lakini’ linaonyesha tofauti hiyo kwa lugha ya kawaida.
- source_word: אֶל כְּלֵי הַקֹּדֶשׁ
  choice: kuvikaribia vyombo vya mahali patakatifu
  rationale: כְּלֵי ni vyombo au vifaa, na הַקֹּדֶשׁ hapa inaonyesha eneo takatifu. Tafsiri hii inadumisha muundo wa maneno bila kuamua kimya kimya kwamba ni samani pekee.
- source_word: וְאֶל הַמִּזְבֵּחַ לֹא יִקְרָבוּ
  choice: wala madhabahu
  rationale: Baada ya katazo, ‘wala’ huunganisha kwa kawaida vitu viwili ambavyo havipaswi kukaribiwa. ‘Madhabahu’ ni neno la kawaida la Kiswahili kwa מִזְבֵּחַ.
- source_word: וְלֹא יָמֻתוּ גַם הֵם גַּם אַתֶּם
  choice: ili wao wala ninyi msife
  rationale: Katika muktadha hasi, גַם...גַם inawahusisha makundi yote mawili. ‘Wao wala ninyi’ ni Kiswahili cha kawaida kinachoonyesha kwamba kifo kinachotahadharishwa kingewapata wote.
theological_decisions:
- issue: Anayeambiwa na wale wanaozuiwa
  choice: Kiambishi cha nafsi ya pili umoja katika ‘wajibu wako’ kinamwelekea Haruni, huku ‘wao’ ikiwataja Walawi wanaopewa wajibu lakini wanazuiwa kuvifikia vitu vitakatifu zaidi.
  alternative: Kuelewa kwamba makuhani wote kwa ujumla ndio wanaoambiwa bila kumlenga Haruni binafsi.
  rationale: Muktadha na kiambishi cha umoja cha Kiebrania vinamwelekea Haruni, huku mstari ukidumisha tofauti ya majukumu kati ya makuhani na Walawi.
- issue: Wanaohusishwa katika onyo la kifo
  choice: Onyo linawahusu Walawi na pia Haruni pamoja na makuhani walio chini yake.
  alternative: Onyo linawahusu Walawi peke yao.
  rationale: Maneno גַם הֵם גַּם אַתֶּם, kwa maana ya ‘wao na ninyi pia,’ yanajumuisha wazi makundi yote mawili.
- issue: Uhusiano wa katazo na kifo
  choice: 'Kifungu kimetafsiriwa kama matokeo yanayoepukwa kwa kutii katazo: ‘ili ... msife.’'
  alternative: 'Kutafsiri kwa karibu zaidi kama onyo: ‘wasije wakafa, wao na ninyi pia.’'
  rationale: Muundo wa Kiebrania unaweza kusikika kama mwendelezo wa katazo au matokeo yanayoepukwa. Tafsiri kuu ni ya kawaida kwa Kiswahili, huku tanbihi ikihifadhi namna ya moja kwa moja zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Hema’ limedumishwa badala ya kuingiza ‘Maskani,’ kwa kuwa neno la Kiebrania hapa ni אֹהֶל. Muundo umegawanywa katika sentensi mbili ili usomeke kwa kawaida bila kupoteza uhusiano wa katazo na onyo.
