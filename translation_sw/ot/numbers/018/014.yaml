  text: Every devoted thing in Israel shall be yours[a].
translation:
  language: sw
  text: Kila kitu kilichowekwa wakfu katika Israeli kitakuwa chako[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila kitu kilichowekwa chini ya marufuku katika Israeli.” Neno la Kiebrania חֵרֶם humaanisha kitu kilichowekwa wakfu kwa Mungu bila kubatilishwa; katika baadhi ya miktadha, ni kitu kilichotengwa kwa kuangamizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Kila
  rationale: Kihesabu hiki kinaonyesha kila kitu katika kundi lote linalotajwa, na kwa kawaida huambatana vizuri na nomino ya umoja katika Kiswahili.
- source_word: חֵרֶם
  choice: kitu kilichowekwa wakfu kabisa
  rationale: Neno hili la kiibada na kisheria humaanisha kitu kilichotengwa kwa Mungu bila kubatilishwa na kuondolewa katika matumizi ya kawaida; katika baadhi ya miktadha linaweza pia kumaanisha kitu kilichotengwa kwa kuangamizwa. Tafsiri hii huhifadhi maana pana bila kuingiza wazo la kuangamizwa ambalo mstari huu haulitaji wazi.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Kihusishi kinaonyesha mahali au eneo ambamo sheria hii inatumika; “katika Israeli” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: לְךָ
  choice: chako
  rationale: Kiambishi hiki kinaonyesha umilikaji au mgao kwa Aroni; “chako” ni cha asili na kinaonyesha haki yake ya kisheria.
- source_word: יִהְיֶה
  choice: kitakuwa
  rationale: 'Kitenzi hiki kinaonyesha hali ya baadaye yenye nguvu ya agizo la kisheria: kitu hicho kitakuwa mali ya Aroni.'
theological_decisions:
- issue: Tafsiri ya neno la kiibada חֵרֶם
  choice: kitu kilichowekwa wakfu kabisa
  alternative: kitu kilichowekwa chini ya marufuku; kitu kilichotengwa kwa kuangamizwa
  rationale: Muktadha unahusu haki za kuhani juu ya vitu vilivyotengwa kwa Mungu bila kubatilishwa. Kwa kuwa neno hilo linaweza pia kuhusisha kuangamizwa katika miktadha mingine, matini kuu inadumisha maana pana, huku tanbihi ikihifadhi maana nyingine bila kusuluhisha kimya kimya mvutano wa kileksika na kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wakfu kabisa” huonyesha hali isiyoweza kubatilishwa bila kufanya sentensi kuwa ya kitaalamu kupita kiasi; tanbihi inaeleza upana wa neno la Kiebrania.
