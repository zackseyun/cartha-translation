base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/002.yaml
  text: And also bring near with you your brothers[a], the tribe of Levi, your father's tribe, so that they may be joined to you and serve you[b], while you and your sons with you are before the tent of the testimony.
translation:
  language: sw
  text: Na pia uwalete karibu nawe ndugu zako, wa kabila la Lawi, kabila la baba yako, ili wajiunge nawe[a] na kukutumikia, wakati wewe na wanao pamoja nawe mko mbele ya hema la ushuhuda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waambatane nawe.” Kitenzi cha Kiebrania pia kina mwangwi wa jina Lawi.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “hema la ushuhuda.” Tafsiri nyingi hutumia “hema la kukutania” hapa kwa kufuata usemi mwingine wa kawaida kuhusu hema.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Tena
  rationale: Neno hili linaonyesha kuwa agizo hili linaongezwa kwa yaliyotangulia, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: אַחֶיךָ
  choice: ndugu zako
  rationale: Linahifadhi lugha ya kifamilia ya Kiebrania; katika muktadha hawa ni Walawi wenzake Haruni.
- source_word: מַטֵּה לֵוִי
  choice: kabila la Lawi
  rationale: Hapa מַטֶּה ni istilahi ya kabila, si fimbo halisi.
- source_word: שֵׁבֶט אָבִיךָ
  choice: kabila la baba yako
  rationale: Kirai hiki kinamtambulisha Lawi kuwa babu wa kabila la Haruni na kinahifadhi muundo wa Kiebrania.
- source_word: הַקְרֵב אִתָּךְ
  choice: uwalete karibu nawe
  rationale: Kinahifadhi maana ya Hiphil ya קרב, yaani kuwaleta karibu kwa ajili ya huduma, pamoja na wazo la kuwa pamoja na Haruni.
- source_word: וְיִלָּווּ עָלֶיךָ
  choice: ili wajiunge nawe
  rationale: Kitenzi kina maana ya kujiunga au kuambatana na mtu; tafsiri hii ni ya kawaida na pia hairuhusu maana hiyo ya uhusiano ipotee.
- source_word: וִישָׁרְתוּךָ
  choice: na kukutumikia
  rationale: שרת hapa ni kutoa huduma kwa Haruni; ‘kukutumikia’ ni wazi na ya asili katika Kiswahili cha sasa.
- source_word: וְאַתָּה וּבָנֶיךָ אִתָּךְ
  choice: wakati wewe na wanao pamoja nawe mko
  rationale: ‘Wakati’ linaonyesha uhusiano wa wakati na hali kati ya huduma ya Walawi na kuwepo kwa Haruni na wanawe mbele ya hema, bila kufuta tofauti ya majukumu yao.
- source_word: לִפְנֵי אֹהֶל הָעֵדֻת
  choice: mbele ya hema la ushuhuda
  rationale: Kiebrania kinasema kihalisi ‘hema la ushuhuda,’ si usemi uliozoeleka zaidi ‘hema la kukutania’; ‘ushuhuda’ linahifadhi maana ya עֵדוּת.
theological_decisions:
- issue: Tafsiri ya אֹהֶל הָעֵדֻת
  choice: hema la ushuhuda
  alternative: hema la kukutania
  rationale: Maandishi ya Kiebrania katika mstari huu yana עֵדוּת, ‘ushuhuda.’ Tafsiri inafuata ushahidi huo badala ya kuulinganisha kimyakimya na usemi mwingine unaopatikana mara nyingi kuhusu hema.
- issue: Uhusiano wa Walawi na Haruni katika וְיִלָּווּ עָלֶיךָ
  choice: wajiunge nawe
  alternative: waambatane nawe
  rationale: ‘Wajiunge nawe’ huhifadhi wazo la kuunganishwa na Haruni kwa huduma bila kulifanya kuwa dai la kiitikadi kuhusu hadhi yao; neno mbadala linaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa urahisi. Muundo wa sentensi umebaki karibu na Kiebrania bila kuwa mgumu; ‘wanao’ limetumiwa kwa maana ya ‘wana wako,’ na istilahi ‘hema la ushuhuda’ imehifadhiwa kwa usahihi wa chanzo.
