  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כֵּ֣ן תָּרִ֤ימוּ גַם אַתֶּם֙ תְּרוּמַ֣ת יְהוָ֔ה מִ/כֹּל֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם אֲשֶׁ֣ר תִּקְח֔וּ מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/נְתַתֶּ֤ם מִמֶּ֨/נּוּ֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/028.yaml
  text: So you also shall present Yahweh’s contribution from all your tithes[a], which you receive from the sons of Israel, and from it you shall give Yahweh’s contribution to Aaron the priest.
translation:
  language: sw
  text: Vivyo hivyo, ninyi pia mtatenga mchango wa Yahweh kutoka katika zaka zenu zote mnazopokea kutoka kwa wana wa Israeli[a]; na kutoka humo mtampa Haruni, kuhani, mchango wa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania kinasema kihalisi “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Vivyo hivyo
  rationale: Inaonyesha kwamba agizo hili linalingana na agizo lililotangulia, kwa Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: תָּרִימוּ
  choice: mtatenga
  rationale: Katika muktadha wa תְּרוּמָה, kitenzi hiki kinamaanisha kuweka sehemu kando na kuitoa; “mtatenga” huhifadhi wazo hilo bila kulazimisha taswira halisi ya kuinua.
- source_word: גַם אַתֶּם
  choice: ninyi pia
  rationale: Inasisitiza kwamba Walawi nao, kama wana wa Israeli, wanapaswa kutenga sehemu ya walichopokea.
- source_word: תְּרוּמַת יְהוָה
  choice: mchango wa Yahweh
  rationale: “Mchango” huonyesha sehemu iliyotengwa na kutolewa bila kuifanya lazima kuwa dhabihu ya madhabahuni; “wa Yahweh” huhifadhi muundo wa Kiebrania na maana ya kuwa mali yake au kutengwa kwa ajili yake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetafsiriwa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: מִכֹּל מַעְשְׂרֹתֵיכֶם
  choice: kutoka katika zaka zenu zote
  rationale: “Zaka” ndilo neno la kawaida la Kiswahili kwa sehemu ya kumi, huku wingi na maana ya kutoa sehemu kutoka humo vikihifadhiwa.
- source_word: אֲשֶׁר תִּקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: mnazopokea kutoka kwa wana wa Israeli
  rationale: Ingawa לקח mara nyingi ni “chukua,” hapa Walawi wanapokea zaka walizopewa kihalali. “Wana wa Israeli” huhifadhi usemi rasmi wa Kiebrania.
- source_word: וּנְתַתֶּם מִמֶּנּוּ
  choice: na kutoka humo mtampa
  rationale: Huhifadhi maana ya kutoa sehemu kutoka katika zaka zilizopokewa, pamoja na Haruni kuwa mpokeaji.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: Haruni kuhani
  rationale: Muundo huu wa Kiswahili unamtaja Haruni kama mpokeaji na huhifadhi cheo chake kwa lugha ya kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko lina Tetragramatoni moja kwa moja; “Yahweh” hulihifadhi kama jina maalumu la agano badala ya kulibadilisha kuwa cheo.
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” huhifadhi kwa karibu usemi wa agano na umbo la Kiebrania, huku tanbihi ikitoa namna ya kawaida zaidi ya Kiswahili.
- issue: Uhusiano katika תְּרוּמַת יְהוָה
  choice: mchango wa Yahweh
  alternative: mchango kwa ajili ya Yahweh
  rationale: Muundo “wa Yahweh” huhifadhi uwezekano wa kuelewa sehemu hiyo kuwa mali ya Yahweh au iliyowekwa wakfu kwake, bila kufunga maana katika uhusiano mmoja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka wazi mfuatano wa kutenga sehemu kutoka katika zaka zilizopokewa na kumpa Haruni, bila kutumia istilahi nyembamba zaidi ya “sadaka ya kuinuliwa.”
