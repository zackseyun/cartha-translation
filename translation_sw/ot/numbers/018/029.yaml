  text: מִ/כֹּל֙ מַתְּנֹ֣תֵי/כֶ֔ם תָּרִ֕ימוּ אֵ֖ת כָּל תְּרוּמַ֣ת יְהוָ֑ה מִ/כָּל חֶלְבּ֔/וֹ אֶֽת מִקְדְּשׁ֖/וֹ מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/029.yaml
  text: From all your gifts you shall lift up every offering of Yahweh[a]; from all its best part[b], the holy portion from it.
translation:
  language: sw
  text: Kutoka katika zawadi zenu zote, mtatenga kila toleo kwa ajili ya Yahweh; kutoka katika sehemu bora zaidi ya kila zawadi[a], mtatenga sehemu yake takatifu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kutoka katika mafuta yake yote,” yaani, kutoka katika sehemu yake iliyo bora kabisa.
    reason: lexical_alternative
  - marker: b
    text: Au “sehemu yake iliyowekwa wakfu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל מַתְּנֹתֵיכֶם
  choice: Kutokana na zawadi zenu zote
  rationale: Kirai hiki kinaonyesha chanzo ambacho toleo linatengwa. “Zawadi” ni neno la kawaida na pana linalofaa kwa matoleo waliyopewa Walawi.
- source_word: תָּרִימוּ
  choice: mtatenga
  rationale: Hifili ya רוּם ni istilahi ya utoaji wa sehemu maalumu kwa Mungu. “Mtatenga” ni Kiswahili cha kawaida kinachoeleza tendo hilo bila kudokeza tu kuinua kitu kimwili.
- source_word: תְּרוּמַת יְהוָה
  choice: toleo kwa ajili ya Yahwe
  rationale: תְּרוּמָה ni mchango au toleo linalotengwa. Kirai “kwa ajili ya Yahwe” kinaonyesha wazi anayestahili kupewa toleo hilo.
- source_word: מִכָּל חֶלְבּוֹ
  choice: kutoka katika sehemu bora zaidi ya kila zawadi
  rationale: חֵלֶב maana yake ya msingi ni “mafuta,” lakini hapa ni tamathali ya sehemu bora au yenye thamani zaidi. Muundo huu pia unaeleza kwa Kiswahili sanifu maana ya mgawanyo inayotokana na מִכָּל.
- source_word: מִקְדְּשׁוֹ מִמֶּנּוּ
  choice: sehemu yake takatifu
  rationale: Katika muktadha huu מִקְדָּשׁוֹ ni sehemu iliyotengwa kuwa takatifu kutoka katika zawadi, si jengo la patakatifu. Kiwakilishi “yake” kinahifadhi kiambishi cha umilikaji cha Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חֵלֶב katika matoleo
  choice: sehemu bora zaidi
  alternative: mafuta
  rationale: Ingawa maana halisi ni “mafuta,” hapa neno linahusu kilicho bora au cha thamani zaidi katika zawadi. Tanbihi inahifadhi taswira halisi ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Mtatenga” huepuka tafsiri ngumu ya kihalisi “mtainua” huku ikihifadhi maana ya kiibada; urudiaji wa “mtatenga” unafafanua sintaksia fupi ya Kiebrania bila kuondoa uhusiano kati ya sehemu bora na sehemu takatifu.
