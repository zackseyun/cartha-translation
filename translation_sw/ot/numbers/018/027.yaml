  yaml_path: translation/ot/numbers/018/027.yaml
  text: And your contribution will be reckoned to you like grain from the threshing floor and like the fullness from the winepress[a][b][c].
translation:
  language: sw
  text: Nalo toleo lenu litahesabiwa kwenu kama nafaka kutoka katika kiwanja cha kupuria, na kama mavuno kamili kutoka katika shinikizo la divai.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “litahesabiwa” au “litakubaliwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mchango wenu”; yaani, sehemu iliyotengwa au kuwekwa wakfu.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “ujazo kutoka katika shinikizo la divai,” yaani, mavuno kamili yanayotokana na shinikizo hilo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶחְשַׁב
  choice: litahesabiwa kwenu
  rationale: Nifali ya חשׁב inaonyesha kwamba toleo hilo linahesabiwa au linatambuliwa kuwa sawa na mazao yaliyotolewa moja kwa moja; usemi huu unafaa muktadha wa kisheria na wa ibada.
- source_word: תְּרוּמַתְכֶם
  choice: toleo lenu
  rationale: תְּרוּמָה ni sehemu iliyotengwa kwa matumizi matakatifu. 'Toleo' ni Kiswahili cha sasa na cha kawaida; tanbihi inadokeza maana maalumu ya mchango uliotengwa.
- source_word: כַּדָּגָן
  choice: kama nafaka
  rationale: דָּגָן humaanisha nafaka au mazao ya nafaka, na kiambishi כְּ kinaonyesha ulinganisho.
- source_word: מִן הַגֹּרֶן
  choice: kutoka katika kiwanja cha kupuria
  rationale: גֹּרֶן ni mahali ambapo nafaka hupuriwa; hapa pia inadokeza mavuno ya nafaka yanayotoka huko.
- source_word: וְכַמְלֵאָה
  choice: na kama mazao tele
  rationale: מְלֵאָה kimsingi ni 'ujazo' au 'wingi uliojaa,' lakini katika muktadha huu ni mazao kamili ya shinikizo. 'Mazao tele' huhifadhi wazo la utele huku ikiwa ya asili kwa Kiswahili.
- source_word: מִן הַיָּקֶב
  choice: kutoka katika shinikizo la divai
  rationale: יֶקֶב ni shinikizo au pipa la kukamulia divai; 'shinikizo la divai' linaendeleza taswira ya kilimo na ulinganifu wa mstari.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. 'Kiwanja cha kupuria' na 'shinikizo la divai' huhifadhi taswira za kilimo za maandishi ya Kiebrania; 'mazao tele' huwasilisha maana ya מְלֵאָה kwa kawaida bila kupoteza wazo la ujazo kamili.
