  text: וְ/לִ/בְנֵ֣י לֵוִ֔י הִנֵּ֥ה נָתַ֛תִּי כָּל מַֽעֲשֵׂ֥ר בְּ/יִשְׂרָאֵ֖ל לְ/נַחֲלָ֑ה חֵ֤לֶף עֲבֹֽדָתָ/ם֙ אֲשֶׁר הֵ֣ם עֹֽבְדִ֔ים אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/021.yaml
  text: And to the sons of Levi[a], behold, I have given every tithe in Israel as an inheritance, in return for the service that they perform[c][b], the service of the tent of meeting.
translation:
  language: sw
  text: Na wana wa Lawi[a], tazama, nimewapa kila zaka[b] katika Israeli kuwa urithi wao, kwa malipo ya huduma wanayoifanya[c]—huduma ya Hema la Kukutania[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Walawi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “zaka yote.”'
    reason: lexical_alternative
  - marker: c
    text: 'Au: “badala ya huduma yao” au “kwa ajili ya huduma yao.”'
    reason: lexical_alternative
  - marker: d
    text: Yaani, hema takatifu ambako Walawi walitekeleza majukumu waliyopewa.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי
  choice: Nami ... nimewapa wana wa Lawi
  rationale: Muundo huu ni wa kawaida katika Kiswahili, huku ukihifadhi usemi wa nasaba ‘wana wa Lawi’ na kiunganishi cha Kiebrania.
- source_word: הִנֵּה
  choice: tazama
  rationale: Neno hili huvuta fikira kwenye tangazo linalofuata na kuhifadhi msisitizo wa maandishi ya Kiebrania.
- source_word: נָתַתִּי
  choice: nimewapa
  rationale: Kauli timilifu inaonyesha utoaji ambao umefanywa na unaendelea kuwa halali katika muktadha huu.
- source_word: כָּל מַעֲשֵׂר בְּיִשְׂרָאֵל
  choice: kila zaka katika Israeli
  rationale: ‘Zaka’ ni istilahi ya kawaida ya sehemu ya kumi; ‘kila’ huakisi uwezekano wa maana ya mgawanyo katika כָּל.
- source_word: לְנַחֲלָה
  choice: iwe urithi wao
  rationale: ‘Urithi’ huonyesha fungu walilopewa; kiwakilishi ‘wao’ kinaweka wazi walengwa ambao tayari wametajwa bila kubadili maana.
- source_word: חֵלֶף עֲבֹדָתָם
  choice: kwa malipo ya huduma
  rationale: חֵלֶף huonyesha kitu kinachotolewa kwa badali au fidia ya kazi. ‘Kwa malipo ya’ huwasilisha uhusiano huo bila kupunguza huduma kuwa biashara.
- source_word: אֲשֶׁר הֵם עֹבְדִים
  choice: wanayoifanya
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi kishazi rejeshi kinachoeleza huduma ya Walawi.
- source_word: אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: huduma ya Hema la Kukutania
  rationale: Tafsiri hii huhifadhi uhusiano wa maneno ya Kiebrania na kutumia jina linaloeleweka kwa hema takatifu ambako Israeli walikutana na Mungu.
theological_decisions:
- issue: Uhusiano kati ya zaka, urithi, na huduma ya Walawi
  choice: Zaka inaelezwa kuwa urithi wa Walawi na pia malipo ya huduma yao.
  alternative: Zaka ni fungu walilopewa tu, bila kusisitiza kuwa ni malipo ya huduma.
  rationale: Aya inaunganisha wazi לְנַחֲלָה (‘kuwa urithi’) na חֵלֶף עֲבֹדָתָם (‘kwa malipo/badili ya huduma yao’); mawazo yote mawili yamehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Marudio ya ‘huduma’ yamehifadhiwa kwa sababu yapo katika chanzo na yanafafanua aina ya kazi iliyokusudiwa.
