review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the grant of all/every tithe in Israel to Levi's descendants as an inheritance in compensation for their cultic service. However, “Nami” recasts the Hebrew fronted indirect object (“and to the sons of Levi”) as an emphatic first-person topic (“and I”), and “iwe” introduces a purposive/subjunctive nuance not present in לְנַחֲלָה.
  naturalness: The Swahili is generally clear, dignified, and appropriate for Standard East African usage. “Na wana wa Lawi, tazama, nimewapa” naturally retains the topical recipient, and “kuwa urithi wao” is more direct and idiomatic for the legal-allotment sense.
  terminology: “wana wa Lawi,” “zaka,” “urithi,” “huduma,” and “Hema la Kukutania” are suitable, established terms. The repeated “huduma” appropriately reflects the Hebrew repetition and specifies the sacred duties without importing later ecclesial terminology.
  issues:
  - severity: medium
    issue: “Nami” changes the discourse focus.
    rationale: The Hebrew begins with a conjunction plus the dative phrase “to the sons of Levi,” whereas “Nami” means “and I/for my part” and foregrounds the speaker rather than the recipients.
  - severity: low
    issue: “iwe urithi wao” adds a subjunctive/purposive shade.
    rationale: לְנַחֲלָה states the status or designation of the tithe as an inheritance. “kuwa urithi wao” represents this more directly.
  revised_text: Na wana wa Lawi[a], tazama, nimewapa kila zaka[b] katika Israeli kuwa urithi wao, kwa malipo ya huduma wanayoifanya[c]—huduma ya Hema la Kukutania[d].
