source:
  edition: WLC
  text: וְ/עָבַ֨ד הַ/לֵּוִ֜י ה֗וּא אֶת עֲבֹדַת֙ אֹ֣הֶל מוֹעֵ֔ד וְ/הֵ֖ם יִשְׂא֣וּ עֲוֺנָ֑/ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וּ/בְ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/023.yaml
  text: But the Levite himself shall serve the service of the tent of meeting, and they shall bear their iniquity. It is a permanent statute throughout your generations, and among the sons of Israel they shall not inherit an inheritance.
translation:
  language: sw
  text: Lakini Mlawi mwenyewe ndiye atakayefanya huduma ya Hema la Kukutania, nao wataubeba uovu wao.[a] Hii ni sheria ya kudumu katika vizazi vyenu vyote. Miongoni mwa wana wa Israeli[b] hawatarithi urithi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wataibeba hatia yao.” Nahau ya Kiebrania inaweza kumaanisha kubeba uovu, hatia, au wajibu na matokeo yanayoambatana nao.
    reason: lexical_alternative
  - marker: b
    text: Au, “miongoni mwa Waisraeli.” Kiebrania kinasema, “miongoni mwa wana wa Israeli.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “hawatarithi urithi.” Marudio haya ya Kiebrania yanakazia kwamba hawatapokea mgao wa ardhi wa kikabila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַד
  choice: atakayefanya huduma
  rationale: Katika muktadha huu wa sheria, kitenzi kina nguvu ya wajibu unaoendelea. Kiswahili hiki ni cha kawaida kuliko kurudia ‘kutumikia utumishi,’ huku kikihifadhi maana ya kutekeleza huduma iliyowekwa.
- source_word: הַלֵּוִי הוּא
  choice: Mlawi mwenyewe ndiye
  rationale: Kiwakilishi huru הוּא kinakazia mhusika. Muundo ‘mwenyewe ndiye’ unaonyesha mkazo huo bila kudokeza kwamba hakuna mtu mwingine kabisa anayehusika.
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: huduma ya Hema la Kukutania
  rationale: עֲבֹדָה hapa ni huduma au wajibu wa kidini. ‘Hema la Kukutania’ ni tafsiri wazi na iliyozoeleka ya אֹהֶל מוֹעֵד.
- source_word: וְהֵם יִשְׂאוּ עֲוֺנָם
  choice: nao wataubeba uovu wao
  rationale: Tafsiri hii inahifadhi nahau ya kisheria na kidini נשא עון pamoja na utata wake kuhusu uovu, hatia, na wajibu au matokeo yanayoambatana nao.
- source_word: חֻקַּת עוֹלָם
  choice: sheria ya kudumu
  rationale: Neno ‘sheria’ linaeleweka kwa urahisi katika Kiswahili cha sasa, na ‘ya kudumu’ linahifadhi wazo la agizo linaloendelea.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Muundo huu unaonyesha kwamba agizo linawahusu watu katika vizazi vinavyofuatana.
- source_word: וּבְתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: Miongoni mwa wana wa Israeli
  rationale: ‘Miongoni mwa’ linaonyesha maana ya בתוך katika muktadha huu, na ‘wana wa Israeli’ linafuata kwa karibu usemi wa Kiebrania.
- source_word: לֹא יִנְחֲלוּ נַחֲלָה
  choice: hawatarithi urithi
  rationale: Kurudia mzizi katika ‘kurithi urithi’ kunahifadhi mkazo wa Kiebrania juu ya kunyimwa mgao wa ardhi wa kikabila.
theological_decisions:
- issue: Maana ya nahau ya kubeba uovu
  choice: wataubeba uovu wao
  alternative: wataibeba hatia yao; watabeba matokeo ya dhambi yao
  rationale: Tafsiri kuu inadumisha mvutano wa matini bila kuamua kimya kimya ikiwa msisitizo ni uovu wenyewe, hatia, wajibu, au adhabu inayotokana nao.
- issue: Urithi wa Walawi miongoni mwa Israeli
  choice: hawatarithi urithi
  alternative: hawatakuwa na urithi; hawatapokea urithi
  rationale: Kurudia kwa makusudi kunahifadhi mkazo wa chanzo kuhusu kutopata mgao wa urithi, bila kuongeza maelezo ya kitheolojia yasiyotajwa moja kwa moja katika aya.
- issue: Usemi בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Tafsiri hii inafuata umbo la chanzo kwa karibu na bado ni usemi wa Kiswahili unaoeleweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Hema la Kukutania’ limetumiwa kama istilahi ya wazi ya kidini; marudio ‘hawatarithi urithi’ yamehifadhiwa kwa sababu yana mkazo wa kimakusudi katika chanzo.
