  variant: Standard East African Swahili
source:
  edition: WLC
  text: כָּל פֶּ֣טֶר רֶ֠חֶם לְֽ/כָל בָּשָׂ֞ר אֲשֶׁר יַקְרִ֧יבוּ לַֽ/יהוָ֛ה בָּ/אָדָ֥ם וּ/בַ/בְּהֵמָ֖ה יִֽהְיֶה לָּ֑/ךְ אַ֣ךְ פָּדֹ֣ה תִפְדֶּ֗ה אֵ֚ת בְּכ֣וֹר הָֽ/אָדָ֔ם וְ/אֵ֛ת בְּכֽוֹר הַ/בְּהֵמָ֥ה הַ/טְּמֵאָ֖ה תִּפְדֶּֽה־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/015.yaml
  text: Every firstborn that opens the womb[a], of all flesh that they present to Yahweh, whether man or beast, shall be yours. Nevertheless, you must surely redeem the firstborn of man[b], and you must redeem the firstborn of the unclean beast.
translation:
  language: sw
  text: Kila mzaliwa wa kwanza afunguaye tumbo la uzazi[a] katika viumbe vyote, watakayemleta kwa Yahweh, awe mwanadamu au mnyama, atakuwa wako. Hata hivyo, ni lazima umkomboe mzaliwa wa kwanza wa mwanadamu, na umkomboe mzaliwa wa kwanza wa mnyama najisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chochote kifunguacho tumbo la uzazi.” Nahau ya Kiebrania humaanisha kiumbe wa kwanza kutoka tumboni.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר רֶחֶם
  choice: mzaliwa wa kwanza anayefungua tumbo la uzazi
  rationale: Nahau hii ya Kiebrania humaanisha mtoto wa kwanza kutoka tumboni; tafsiri hii inadumisha taswira ya chanzo huku ikieleweka kwa Kiswahili cha sasa.
- source_word: כָּל ... לְכָל בָּשָׂר
  choice: kila ... wa kila kiumbe
  rationale: Hutoa wigo mpana unaojumuisha wanadamu na wanyama, kama vifungu vinavyofuata vinavyofafanua.
- source_word: אֲשֶׁר יַקְרִיבוּ לַיהוָה
  choice: ambaye watamleta kwa Yahweh
  rationale: Kitenzi kina maana ya kuleta karibu au kuwasilisha katika muktadha wa matoleo; ‘kumleta’ hakudokezi kimakosa kwamba wanadamu na wanyama najisi wanatolewa dhabihu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa na cheo.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: awe mwanadamu au mnyama
  rationale: Hueleza kwa kawaida nyanja mbili zinazohusika, yaani wanadamu na wanyama.
- source_word: יִהְיֶה לָּךְ
  choice: atakuwa wako
  rationale: Hueleza moja kwa moja haki ya kuhani juu ya mzaliwa huyo wa kwanza.
- source_word: אַךְ
  choice: Hata hivyo
  rationale: Huanzisha sharti muhimu linalowekewa kauli iliyotangulia.
- source_word: פָּדֹה תִפְדֶּה
  choice: ni lazima umkomboe
  rationale: Muundo wa Kiebrania unasisitiza wajibu; Kiswahili hiki huonyesha amri yenye nguvu bila kuwa kisicho cha kawaida.
- source_word: בְּכוֹר הָאָדָם
  choice: mzaliwa wa kwanza wa mwanadamu
  rationale: ‘Mwanadamu’ hapa hutofautishwa na mnyama na inasikika kwa kawaida katika Kiswahili sanifu.
- source_word: בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  choice: mzaliwa wa kwanza wa mnyama najisi
  rationale: Hurejelea mnyama asiye safi kidesturi na kwa hiyo asiyefaa kutolewa dhabihu.
theological_decisions:
- issue: Maana ya אָדָם ikilinganishwa na mnyama
  choice: mwanadamu
  alternative: mtu; binadamu
  rationale: Neno hili humaanisha mwanadamu kwa ujumla katika utofautishaji na mnyama; ‘mwanadamu’ ni wazi na halibadili wigo wa chanzo.
- issue: Aina ya haki ya kuhani juu ya wazaliwa wa kwanza
  choice: Wazaliwa wa kwanza ni haki ya kuhani, lakini wazaliwa wa kwanza wa wanadamu na wa wanyama najisi lazima wakombolewe.
  alternative: Kuelewa ‘kuleta kwa Yahweh’ kuwa ni kuwatoa wote dhabihu
  rationale: Sharti lililo wazi katika sehemu ya pili ya aya linazuia kuelewa kwamba kila mzaliwa wa kwanza anatolewa dhabihu.
- issue: Nguvu ya muundo פָּדֹה תִפְדֶּה
  choice: ni lazima umkomboe
  alternative: utamkomboa kwa hakika
  rationale: Muundo wa kusisitiza unaweza kuonyesha wajibu thabiti; tafsiri iliyochaguliwa inawasilisha amri hiyo kwa Kiswahili cha kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Tumbo la uzazi’ huepuka utata wa ‘tumbo’ peke yake; ‘najisi’ huhifadhi istilahi ya kidini kuhusu kutokuwa safi kidesturi.
