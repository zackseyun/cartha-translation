base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/006.yaml
  text: And I—behold[a], I have taken your brothers the Levites from among the sons of Israel, given to you as a gift, given to Yahweh, to perform the service of the tent of meeting.
translation:
  language: sw
  text: “Nami, tazama, nimewachukua ndugu zenu Walawi kutoka miongoni mwa wana wa Israeli[a], nimewaweka kuwa zawadi kwenu, waliotolewa kwa Yahwe ili kufanya huduma ya Hema la Kukutania.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka miongoni mwa Waisraeli.” Kiebrania kinasema, “kutoka miongoni mwa wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Nami
  rationale: Inaendeleza usemi uliotangulia na wakati huohuo inasisitiza nafsi ya kwanza ya msemaji.
- source_word: הִנֵּה
  choice: tazama
  rationale: Inahifadhi nguvu ya kuelekeza fikira na kusisitiza tangazo hili kwa lugha yenye hadhi.
- source_word: לָקַחְתִּי
  choice: nimewachukua
  rationale: Kauli ya wakati timilifu inaonyesha tendo lililokamilika lenye matokeo yanayoendelea; maana ya msingi ya kitenzi ‘kuchukua’ imehifadhiwa bila kuongeza wazo la ‘kuchagua.’
- source_word: אֲחֵיכֶם הַלְוִיִּם
  choice: ndugu zenu Walawi
  rationale: Inahifadhi lugha ya kifamilia ya Kiebrania na kutaja wazi kundi la Walawi.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: kutoka miongoni mwa wana wa Israeli
  rationale: Inafuata kwa karibu muundo wa Kiebrania huku ikieleza kwamba Walawi walitengwa kutoka ndani ya jumuiya ya Israeli.
- source_word: לָכֶם מַתָּנָה
  choice: wawe zawadi kwenu
  rationale: Inaonyesha kwamba Walawi walipewa Haruni na wanawe wakiwa zawadi, kwa Kiswahili cha kawaida na wazi.
- source_word: נְתֻנִים לַיהוָה
  choice: waliotolewa kwa Yahwe
  rationale: Inahifadhi hali ya kutolewa au kuwekwa wakfu kwa Yahwe na mwangwi wa lugha ya kutoa iliyo karibu na neno ‘zawadi.’
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: ili kufanya huduma
  rationale: Inatoa maana ya utumishi wa kidini kwa Kiswahili cha asili bila kurudia kwa namna isiyo ya kawaida ‘kutumikia huduma.’
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Ni istilahi ya kawaida, iliyo wazi na yenye hadhi kwa hema maalumu la kukutana na Mungu.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Uwakilishi wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Uamuzi huu unahifadhi umbo la kifamilia la Kiebrania; tafsiri ya kawaida zaidi imeonyeshwa katika tanbihi bila kufuta umbo la chanzo.
- issue: Uhusiano wa Walawi kwa Haruni na kwa Yahwe
  choice: zawadi kwenu, waliotolewa kwa Yahwe
  alternative: zawadi iliyotolewa kwenu na Yahwe
  rationale: 'Muundo huu unahifadhi pande zote mbili za Kiebrania: Walawi ni zawadi kwa Haruni na wanawe, na pia ni watu waliotolewa kwa Yahwe kwa ajili ya huduma.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye mtindo wa sasa, wenye hadhi na unaoeleweka. ‘Tazama’ limehifadhiwa kwa msisitizo wa tangazo; ‘Hema la Kukutania’ limetumiwa kama istilahi thabiti ya ibada. Alama ya tanbihi imewekwa moja kwa moja baada ya kirai kinachoelezwa.
