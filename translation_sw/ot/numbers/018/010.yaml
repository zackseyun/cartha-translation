  text: בְּ/קֹ֥דֶשׁ הַ/קֳּדָשִׁ֖ים תֹּאכֲלֶ֑/נּוּ כָּל זָכָר֙ יֹאכַ֣ל אֹת֔/וֹ קֹ֖דֶשׁ יִֽהְיֶה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/010.yaml
  text: You shall eat it in a most holy place; every male may eat it. It shall be holy to you.
translation:
  language: sw
  text: Utakila katika mahali patakatifu sana[a]; kila mwanamume anaweza kukila. Kitakuwa kitakatifu kwako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa maneno halisi, “katika Patakatifu pa Patakatifu.” Hapa usemi huo unamaanisha eneo lililowekwa kwa matumizi ya vitu vitakatifu sana, ambako kitu hiki kilipaswa kuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: mahali patakatifu sana
  rationale: Kirai hiki ni muundo wa Kiebrania wa kusisitiza kiwango cha juu cha utakatifu. Tafsiri hii inadumisha maana ya mahali inayoletwa na בְּ bila kudokeza kimakosa kwamba chakula kingeliwa ndani ya chumba cha ndani kabisa cha patakatifu.
- source_word: תֹּאכֲלֶנּוּ
  choice: Utakila
  rationale: Kitenzi hiki ni nafsi ya pili umoja wa kiume, kikimwelekea Haruni kama mwakilishi wa ukuhani, pamoja na kiambishi cha kitu cha umoja. Wakati ujao katika Kiswahili unafaa mtindo wa agizo la kisheria.
- source_word: כָּל זָכָר
  choice: kila mwanamume
  rationale: Kiebrania kinabainisha mtu wa jinsia ya kiume, si neno la jumla kwa watu wote. “Kila mwanamume” ni la kawaida na sahihi katika Kiswahili sanifu.
- source_word: יֹאכַל אֹתוֹ
  choice: anaweza kukila
  rationale: Katika muktadha huu kauli inaonyesha ruhusa na ustahili wa kula, si lazima kila mwanamume aamriwe kula. “Anaweza” huhifadhi maana hiyo ya ruhusa.
- source_word: קֹדֶשׁ יִהְיֶה לָּךְ
  choice: Kitakuwa kitakatifu kwako
  rationale: Neno “kitakatifu” linadumisha istilahi kuu ya ibada קֹדֶשׁ na hali ya kitu hicho mbele ya Haruni na makuhani.
theological_decisions:
- issue: Mhusika anayeambiwa na upeo wa agizo la kikuhani
  choice: Kauli ya kwanza na ya mwisho zinamwelekea Haruni katika umoja kama mwakilishi wa ukuhani, huku ruhusa ikiwahusu wanaume wanaostahili miongoni mwa makuhani.
  alternative: Umoja unaweza kueleweka kuwa unamhusu Haruni peke yake binafsi.
  rationale: Muktadha wa karibu unahusu mafungu ya kikuhani aliyopewa Haruni pamoja na wanawe. Umoja wa Kiebrania umehifadhiwa katika “Utakila” na “kwako,” na kauli inayofuata inaonyesha matumizi mapana zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Viambishi vya ngeli ya KI-VI katika “kukila/kitakuwa” vinawakilisha kitu kinachorejelewa bila kuongeza nomino isiyopo katika mstari huu.
