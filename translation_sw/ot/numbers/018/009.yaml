  variant: Standard East African Swahili
source:
  edition: WLC
  text: זֶֽה יִהְיֶ֥ה לְ/ךָ֛ מִ/קֹּ֥דֶשׁ הַ/קֳּדָשִׁ֖ים מִן הָ/אֵ֑שׁ כָּל קָ֠רְבָּנָ/ם לְֽ/כָל מִנְחָתָ֞/ם וּ/לְ/כָל חַטָּאתָ֗/ם וּ/לְ/כָל אֲשָׁמָ/ם֙ אֲשֶׁ֣ר יָשִׁ֣יבוּ לִ֔/י קֹ֣דֶשׁ קָֽדָשִׁ֥ים לְ/ךָ֛ ה֖וּא וּ/לְ/בָנֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/009.yaml
  text: 'This shall be yours from the most holy things[a], from the fire: every offering of theirs, every grain offering of theirs, every sin offering of theirs, and every guilt offering of theirs, which they return to me[c][b]. It is most holy for you and for your sons.'
translation:
  language: sw
  text: 'Hiki ndicho kitakachokuwa chako kutoka katika vitu vilivyo vitakatifu sana, kutoka katika moto[a]: kila sadaka yao, kila sadaka yao ya nafaka, kila sadaka yao ya dhambi[b], na kila sadaka yao ya hatia[c], ambazo wananirudishia. Ni kitakatifu sana kwa ajili yako na wanao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tafsiri halisi ni “kutoka katika moto.” Katika muktadha huu inaweza kumaanisha sehemu iliyowekwa kando kutoka katika sadaka iliyotolewa kwa moto.
    reason: lexical_alternative
  - marker: b
    text: “Sadaka ya dhambi” inaweza pia kutafsiriwa “sadaka ya utakaso.”
    reason: lexical_alternative
  - marker: c
    text: “Sadaka ya hatia” inaweza pia kutafsiriwa “sadaka ya fidia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: kutoka katika vitu vilivyo vitakatifu sana
  rationale: Kirai hiki ni namna ya Kiebrania ya kuonyesha kiwango cha juu kabisa cha utakatifu. Katika muktadha huu kinataja sadaka zilizo katika daraja la utakatifu mkuu, si chumba cha Patakatifu pa Patakatifu.
- source_word: מִן הָאֵשׁ
  choice: kutoka motoni
  rationale: Hii inafuata kwa karibu usemi halisi wa Kiebrania na kuhifadhi uwezekano wa kuelewa kuwa ni sehemu ya sadaka iliyotengwa na moto; ufafanuzi huo umetolewa katika tanbihi.
- source_word: קָרְבָּנָם
  choice: kila sadaka yao
  rationale: Neno hili ni jina la jumla la kitu kinacholetwa karibu na Mungu kama sadaka; “sadaka” ni neno la kawaida na linaloeleweka vizuri katika Kiswahili.
- source_word: מִנְחָתָם
  choice: kila sadaka yao ya nafaka
  rationale: Katika sheria za kikuhani, neno hili kwa kawaida humaanisha sadaka inayotolewa kwa mazao ya nafaka.
- source_word: חַטָּאתָם
  choice: kila sadaka yao ya dhambi
  rationale: Katika orodha hii neno linataja aina ya sadaka, si dhambi yenyewe. Tafsiri mbadala inayosisitiza utakaso wa kiibada imehifadhiwa katika tanbihi.
- source_word: אֲשָׁמָם
  choice: kila sadaka yao ya hatia
  rationale: Hili ni jina la kawaida la sadaka inayohusiana na hatia; maana ya fidia au marekebisho inayoweza kuandamana nayo imehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר יָשִׁיבוּ לִי
  choice: watakazonirudishia
  rationale: Kitenzi cha Kiebrania kina picha ya kurudisha au kurejesha. “Watakazonirudishia” huihifadhi bila kuifanya ihusu fidia peke yake.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: Ni kitakatifu sana
  rationale: Usemi huu unaeleza hadhi ya juu kabisa ya utakatifu wa sehemu hiyo ya sadaka, wala si mahali ndani ya hema takatifu.
- source_word: לְךָ ... וּלְבָנֶיךָ
  choice: kwa ajili yako na wanao
  rationale: Msemaji anamwelekea Haruni pamoja na wanawe wa kiume walio katika huduma ya ukuhani; kwa hiyo rejeo la jinsia ya kiume limehifadhiwa.
theological_decisions:
- issue: Kutofautisha daraja la utakatifu wa sadaka na Patakatifu pa Patakatifu
  choice: vitu vilivyo vitakatifu sana / kitakatifu sana
  alternative: vitu vya Patakatifu pa Patakatifu
  rationale: Muktadha unahusu hadhi ya sehemu za sadaka, si eneo la ndani la mahali patakatifu. Tafsiri iliyochaguliwa huepuka kuingiza maana ya mahali ambayo mstari hauhitaji.
- issue: Rejeo la wana wa Haruni
  choice: wanao
  alternative: watoto wako / wazao wako
  rationale: Kiebrania kinasema wazi “wana wako,” na muktadha wa ukuhani unafanya rejeo la kiume kuwa mahususi badala ya kuwa neno la jumla kwa watoto wote.
- issue: Nguvu ya kitenzi cha kurudisha sadaka kwa Mungu
  choice: watakazonirudishia
  alternative: watakazonitolea
  rationale: Tafsiri iliyochaguliwa huhifadhi picha ya kurejesha katika kitenzi cha Kiebrania bila kudai kuwa kila sadaka katika orodha hiyo ni malipo ya fidia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka. Muundo wa “kutoka motoni” umeachwa karibu na Kiebrania ili kuhifadhi mvutano wa kisarufi, huku tanbihi ikifafanua maana inayowezekana ya sehemu iliyotengwa. “Wanao” limechaguliwa badala ya neno lisiloonyesha jinsia kwa sababu muktadha unawahusu wana wa Haruni katika ukuhani.
