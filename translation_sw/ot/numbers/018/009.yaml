revisions:
- from: 'Hiki ndicho kitakachokuwa chako kutoka katika vitu vilivyo vitakatifu sana, kutoka motoni[a]: kila sadaka yao, kila sadaka yao ya nafaka, kila sadaka yao ya dhambi[b], na kila sadaka yao ya hatia[c], watakazonirudishia. Ni kitakatifu sana kwa ajili yako na wanao.'
