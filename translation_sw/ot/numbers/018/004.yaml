base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/004.yaml
  text: They shall join you and keep the charge of the tent of meeting for all the service of the tent[a], but no outsider shall come near you.
translation:
  language: sw
  text: Nao watajiunga nawe na kutekeleza wajibu wa Hema la Kukutania kwa ajili ya huduma yote ya hema; lakini mtu asiyeidhinishwa[a] asiwakaribie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu wa nje.” Neno la Kiebrania זָר hapa humaanisha mtu asiye na mamlaka ya jukumu au ya kukaribia patakatifu, wala si lazima mgeni wa taifa lingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְווּ עָלֶיךָ
  choice: watajiunga nawe
  rationale: Nifali ya לוה pamoja na עַל inaonyesha kuambatana na Haruni ili kumsaidia katika huduma; usemi huu ni wa kawaida na huhifadhi maana ya uhusiano huo.
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמֶרֶת
  choice: na kutimiza wajibu
  rationale: Katika muktadha wa patakatifu, שׁמר pamoja na מִשְׁמֶרֶת hurejelea kutekeleza jukumu lililokabidhiwa, si kulinda mahali tu.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Ni jina la patakatifu linaloeleweka na lililozoeleka katika Kiswahili cha Biblia.
- source_word: לְכֹל עֲבֹדַת הָאֹהֶל
  choice: katika huduma yote ya hema
  rationale: עֲבֹדָה hapa ni kazi au huduma rasmi inayohusiana na hema; “huduma” huhifadhi maana yake ya kiibada.
- source_word: וְזָר
  choice: lakini mtu asiyeidhinishwa
  rationale: זָר katika sheria hii humaanisha mtu asiyepewa nafasi ya huduma ya patakatifu, wala si lazima mgeni wa kabila au taifa lingine.
- source_word: לֹא יִקְרַב אֲלֵיכֶם
  choice: asiwakaribie
  rationale: קרב huonyesha kukaribia katika eneo au shughuli takatifu, na kiambishi “-wa-” huhifadhi wingi wa אֲלֵיכֶם.
theological_decisions:
- issue: Maana ya זָר katika sheria za patakatifu
  choice: mtu asiyeidhinishwa, yaani aliye nje ya jukumu lililoruhusiwa la kikuhani au la Kilawi
  alternative: mgeni; mtu wa nje
  rationale: Muktadha unahusu ruhusa ya kukaribia na kuhudumu katika patakatifu, si asili ya kikabila. Tafsiri hii huepuka kudokeza kwamba katazo linawahusu wageni wa mataifa tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi hudumisha mtindo wa sheria ya patakatifu bila kutumia lugha nzito isiyo ya kawaida; wingi wa walengwa umeonyeshwa katika “asiwakaribie.”
