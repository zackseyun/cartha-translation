  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן אַתָּ֗ה וּ/בָנֶ֤י/ךָ וּ/בֵית אָבִ֨י/ךָ֙ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֣ן הַ/מִּקְדָּ֑שׁ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֥ן כְּהֻנַּתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/001.yaml
  text: Then Yahweh said to Aaron[a], “You and your sons and your father’s house with you shall bear the iniquity of the sanctuary[b], and you and your sons with you shall bear the iniquity of your priesthood.”
translation:
  language: sw
  text: Kisha Yahwe akamwambia Aroni, “Wewe, wanao na jamaa ya baba yako walio pamoja nawe mtabeba hatia ya mahali patakatifu[a]; nawe na wanao walio pamoja nawe mtabeba hatia ya ukuhani wenu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtawajibika kwa makosa yanayohusiana na mahali patakatifu.” Usemi wa Kiebrania unaweza kumaanisha kubeba hatia au kuwajibika kwa ukiukaji unaohusiana na mahali patakatifu.
    reason: lexical_alternative
  - marker: b
    text: Au, “mtawajibika kwa makosa yanayohusiana na ukuhani wenu.” Usemi wa Kiebrania unaweza kumaanisha kubeba hatia au kuwajibika kwa ukiukaji unaohusiana na huduma yenu ya kikuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida, na kiambishi ‘-mw-’ kinaonyesha kwamba Aaron ndiye anayeambiwa.
- source_word: בֵית אָבִיךָ
  choice: jamaa ya baba yako
  rationale: Usemi huu unarejelea ukoo au familia pana ya upande wa baba, si jengo; ‘jamaa’ ni ya asili na haubani maana kuwa watu wa nyumba moja tu.
- source_word: אִתָּךְ
  choice: walio pamoja nawe
  rationale: Huhifadhi wazo la kuandamana na Aaron katika vifungu vyote viwili huku sentensi ikisomeka kwa kawaida katika Kiswahili.
- source_word: תִּשְׂאוּ אֶת־עֲוֹן
  choice: mtabeba hatia
  rationale: ‘Kubeba hatia’ huhifadhi sitiari ya Kiebrania na maana zake zinazoweza kujumuisha hatia, uwajibikaji na wajibu wa kustahimili matokeo, bila kuigeuza moja kwa moja kuwa ufafanuzi.
- source_word: הַמִּקְדָּשׁ
  choice: mahali patakatifu
  rationale: Ni tafsiri wazi na ya kawaida ya eneo takatifu la ibada linalokusudiwa hapa.
- source_word: כְּהֻנַּתְכֶם
  choice: ukuhani wenu
  rationale: Huhifadhi maana ya cheo na huduma ya kikuhani inayowahusu Aaron na wanawe.
theological_decisions:
- issue: Maana ya ‘kubeba hatia’ katika muktadha wa kikuhani
  choice: Kudumisha usemi ‘mtabeba hatia’ katika matini kuu.
  alternative: ‘mtawajibika kwa makosa yanayohusiana na mahali patakatifu/ukuhani wenu’
  rationale: Kiebrania kinaweza kusisitiza hatia, dhima, au wajibu kwa makosa ya huduma takatifu. Usemi wa matini kuu pamoja na tanbihi hudumisha upana na mvutano huo badala ya kuamua maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Jamaa ya baba yako’ inaonyesha familia au ukoo mpana; ‘kubeba hatia’ hudumisha sitiari na utata halisi wa matini ya Kiebrania. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
