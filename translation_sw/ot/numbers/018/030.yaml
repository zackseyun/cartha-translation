base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/030.yaml
  text: And you shall say to them[a], ‘When you lift up its best part from it, it shall be counted to the Levites as the produce of the threshing floor and as the produce of the winepress.’
translation:
  language: sw
  text: Waambie, ‘Mtakapoinua sehemu yake bora zaidi kutoka humo, itahesabiwa kwa Walawi kama mazao ya uwanja wa kupuria na kama mazao ya mahali pa kukamulia zabibu.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: Nawe utawaambia
  rationale: Ni agizo la moja kwa moja kwa Musa katika nafsi ya pili umoja; wakati ujao katika Kiswahili unatoa nguvu ya maagizo kwa lugha ya kawaida na yenye heshima.
- source_word: בַּהֲרִימְכֶם
  choice: Mtakapoinua
  rationale: Hifili ya רום ina maana ya kuinua au kutenga na kuwasilisha mchango. ‘Kuinua’ huhifadhi taswira na istilahi ya mchango bila kuifanya kwa lazima kuwa dhabihu.
- source_word: חֶלְבּוֹ
  choice: sehemu yake bora
  rationale: Kihalisi ni ‘mafuta yake,’ lakini kwa mazao neno hili hutumiwa kimethali kuhusu sehemu nono, teule, au bora zaidi. Tafsiri hii inaeleweka kwa kawaida huku tanbihi ikihifadhi usemi wa Kiebrania.
- source_word: מִמֶּנּוּ
  choice: kutoka humo
  rationale: Kiwakilishi kinarejelea kile kilichotolewa kama zaka ambacho sehemu bora inatengwa kutoka ndani yake.
- source_word: וְנֶחְשַׁב
  choice: itahesabiwa
  rationale: Kauli tendwa ya חשב ina wazo la kuhesabu, kukadiria, au kutambua rasmi; ‘itahesabiwa’ huhifadhi maana ya kisheria na kihasibu.
- source_word: לַלְוִיִּם
  choice: kwa Walawi
  rationale: Kihusishi kinaonyesha jinsi mchango huo unavyotambuliwa kwa upande wa Walawi; ‘kwa Walawi’ ni muundo wa kawaida wa Kiswahili.
- source_word: כִּתְבוּאַת גֹּרֶן
  choice: kama mazao ya uwanja wa kupuria
  rationale: תבואה ni mazao au mavuno, na גרן ni mahali pa kupuria nafaka. Muundo huu huhifadhi picha ya kilimo na ulinganifu wa kishairi.
- source_word: וְכִתְבוּאַת יָקֶב
  choice: na kama mazao ya shinikizo la divai
  rationale: יקב ni shinikizo au mahali pa kukamulia zabibu. ‘Shinikizo la divai’ ni kifupi, kinaeleweka, na huhifadhi ulinganifu na uwanja wa kupuria.
