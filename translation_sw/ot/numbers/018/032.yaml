  text: וְ/לֹֽא תִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא בַּ/הֲרִֽימְ/כֶ֥ם אֶת חֶלְבּ֖/וֹ מִמֶּ֑/נּוּ וְ/אֶת קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל לֹ֥א תְחַלְּל֖וּ וְ/לֹ֥א תָמֽוּתוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/032.yaml
  text: And you will bear no sin because of it when you lift up its best part from it[a]. You shall not profane the holy things of the sons of Israel[b], and you shall not die.
translation:
  language: sw
  text: Nanyi hamtakuwa na hatia kwa ajili yake mtakapoitenga sehemu yake bora kutoka humo.[a] Msinajisi vitu vitakatifu vya wana wa Israeli,[b] wala hamtakufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mafuta yake” au “sehemu yake iliyo bora kabisa.” Neno la Kiebrania חֶלֶב kwa maana halisi ni “mafuta,” lakini katika habari za matoleo mara nyingi humaanisha sehemu nono, teule, au bora zaidi.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana wa Israeli,” usemi wa kawaida unaowataja watu wa Israeli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂאוּ ... חֵטְא
  choice: hamtakuwa na hatia
  rationale: Kirai hiki cha Kiebrania humaanisha kubeba dhambi au kuwa na hatia. Tafsiri hii inaeleza wajibu wa kimaadili kwa Kiswahili cha kawaida bila kupoteza maana.
- source_word: עָלָיו
  choice: kwa ajili yake
  rationale: Kiwakilishi kinarejelea zaka au sehemu inayozungumziwa na kinaonyesha jambo ambalo lingeweza kuwaletea hatia.
- source_word: בַּהֲרִימְכֶם
  choice: mtakapoitenga
  rationale: Katika muktadha wa matoleo, kitenzi hiki humaanisha kuinua au kutenga sehemu iwe mchango. ‘Kuitenga’ ni ya kawaida kwa Kiswahili na inafaa kwa tendo linaloelezwa hapa.
- source_word: חֶלְבּוֹ
  choice: sehemu yake bora
  rationale: Ingawa חֶלֶב kimsingi ni ‘mafuta,’ katika muktadha wa matoleo hutaja sehemu nono, teule, au bora. Hapa kinachozungumziwa ni mazao ya zaka, hivyo tafsiri ya kiidioma huepuka kudokeza mafuta ya mnyama.
- source_word: מִמֶּנּוּ
  choice: kutoka humo
  rationale: Inaonyesha kuwa sehemu bora inatengwa kutoka katika zaka yenyewe.
- source_word: קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: vitu vitakatifu vya wana wa Israeli
  rationale: ‘Vitu vitakatifu’ huhifadhi upana wa קָדְשֵׁי, na ‘wana wa Israeli’ hufuata muundo wa jina la taifa katika Kiebrania.
- source_word: תְחַלְּלוּ
  choice: msivinajisi
  rationale: Kitenzi hiki katika Piel humaanisha kukufuru, kunajisi, au kufanya kilicho kitakatifu kitumiwe kama kitu cha kawaida. ‘Msivinajisi’ ni amri ya kawaida na yenye heshima katika Kiswahili.
- source_word: וְלֹא תָמֻתוּ
  choice: wala hamtakufa
  rationale: Tafsiri hii huhifadhi uratibu wa moja kwa moja wa Kiebrania bila kuongeza wazi maana ya kusudi kama ‘ili msife.’
theological_decisions:
- issue: Maana ya kiibada ya חֶלֶב
  choice: sehemu yake bora
  alternative: mafuta yake; sehemu yake iliyo bora kabisa
  rationale: Muktadha unahusu sehemu ya zaka inayotengwa na Walawi, si lazima mafuta ya mnyama. ‘Sehemu yake bora’ huhifadhi dai kwamba sehemu teule inapaswa kutolewa bila kupotosha aina ya kitu kinachotolewa.
- issue: Tafsiri ya בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Hili ni jina la kawaida la pamoja la watu wa Israeli. Tafsiri iliyochaguliwa huhifadhi umbo la Kiebrania huku tanbihi ikifafanua maana yake ya kijumla.
- issue: Uhusiano wa kishazi cha mwisho וְלֹא תָמֻתוּ
  choice: wala hamtakufa
  alternative: ili msife; msije mkafa
  rationale: Kiebrania kinaunganisha kishazi hiki kwa וְ bila kutaja wazi kusudi. Tafsiri huhifadhi mvutano kati ya ahadi ya matokeo na onyo, badala ya kuamua kuwa ni kishazi cha kusudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ya kwanza imetumia ‘kuwa na hatia’ kwa uwazi wa kawaida; istilahi za utakatifu zimehifadhiwa katika ‘vitu vitakatifu’ na ‘msivinajisi.’
