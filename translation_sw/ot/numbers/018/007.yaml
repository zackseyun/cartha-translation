  text: וְ/אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִ֠תְּ/ךָ תִּשְׁמְר֨וּ אֶת כְּהֻנַּתְ/כֶ֜ם לְ/כָל דְּבַ֧ר הַ/מִּזְבֵּ֛חַ וּ/לְ/מִ/בֵּ֥ית לַ/פָּרֹ֖כֶת וַ/עֲבַדְתֶּ֑ם עֲבֹדַ֣ת מַתָּנָ֗ה אֶתֵּן֙ אֶת כְּהֻנַּתְ/כֶ֔ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/007.yaml
  text: But you and your sons with you shall keep your priesthood for everything concerning the altar and for what is within the veil[a], and you shall serve. I give your priesthood as a gift of service[b], but the outsider who comes near shall be put to death.
translation:
  language: sw
  text: Lakini wewe na wanao pamoja nawe mtashika wajibu wenu wa ukuhani kwa kila jambo linalohusu madhabahu na kwa yaliyo ndani ya pazia, nanyi mtahudumu. Ninawapa ukuhani wenu kama zawadi ya huduma[a]; lakini mtu asiyeidhinishwa atakayekaribia atauawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huduma iliyotolewa kama zawadi.” Kirai cha Kiebrania kinaweza kusisitiza kwamba huduma yenyewe ni zawadi au kwamba ukuhani umetolewa kama zawadi kwa ajili ya huduma.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kutafsiriwa “mtu wa nje”; hapa linamaanisha mtu yeyote asiyeidhinishwa kufanya wajibu wa kikuhani, wala si hasa mtu wa taifa jingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְרוּ
  choice: mtaulinda
  rationale: Kitenzi שׁמר hapa kinamaanisha kulinda na kutekeleza kwa uangalifu wajibu waliokabidhiwa; “mtaulinda” kinadumisha nguvu hiyo ya uangalizi.
- source_word: כְּהֻנַּתְכֶם
  choice: ukuhani wenu
  rationale: Neno hilo linataja cheo na utendaji wa ukuhani, si matendo machache ya kikuhani pekee.
- source_word: לְכָל דְּבַר הַמִּזְבֵּחַ
  choice: katika mambo yote yanayohusu madhabahu
  rationale: דָּבָר hapa ina maana pana ya mambo au shughuli zinazohusiana na madhabahu bila kuzibana kuwa ibada maalumu tu.
- source_word: וּלְמִבֵּית לַפָּרֹכֶת
  choice: na yaliyo ndani ya pazia
  rationale: Kirai kinaelekeza kwenye eneo lililo upande wa ndani wa pazia la patakatifu; tafsiri hii ni wazi na haiongezi maelezo yasiyokuwamo.
- source_word: וַעֲבַדְתֶּם
  choice: nanyi mtahudumu
  rationale: עבד katika muktadha wa ibada ni kufanya huduma ya kikuhani; “mtahudumu” ni ya kawaida, yenye hadhi, na haisukumii istilahi ya dhehebu fulani.
- source_word: עֲבֹדַת מַתָּנָה
  choice: huduma ya zawadi
  rationale: Kirai kifupi cha Kiebrania kinaunganisha huduma na zawadi. Tafsiri hii inadumisha nomino zote mbili huku tanbihi ikieleza uwezekano wa uhusiano wao.
- source_word: אֶתֵּן אֶת כְּהֻנַּתְכֶם
  choice: Ninawapa ukuhani wenu
  rationale: Kauli hii inaonyesha kuwa Mungu ndiye anayewakabidhi ukuhani; wakati wa sasa unafaa katika tamko hili la moja kwa moja.
- source_word: הַזָּר
  choice: mtu asiyeidhinishwa
  rationale: Katika sheria za kikuhani זָר ni mtu asiyepewa ruhusa ya kufanya huduma hiyo takatifu, wala si lazima awe mgeni wa taifa lingine.
- source_word: הַקָּרֵב
  choice: atakayekaribia
  rationale: קרב huonyesha kukaribia eneo au huduma takatifu; “atakayekaribia” inadumisha maana ya kimwili na ya kiibada.
- source_word: יוּמָת
  choice: atauawa
  rationale: Umbo la Hophal ni la kutendesha katika hali ya kutendwa na linaonyesha adhabu ya kifo, si utabiri tu kwamba mtu atakufa.
theological_decisions:
- issue: Maana ya זָר katika sheria ya kikuhani
  choice: mtu asiyeidhinishwa
  alternative: mtu wa nje; mtu asiye kuhani
  rationale: Muktadha unamhusu yeyote aliye nje ya kundi lililopewa mamlaka ya huduma ya kikuhani. Chaguo hili linaepusha kudokeza kwamba kosa ni kuwa wa taifa jingine.
- issue: Nguvu ya עֲבֹדַת מַתָּנָה
  choice: ukuhani umetolewa kama huduma ya zawadi
  alternative: huduma yenyewe imetolewa kama zawadi
  rationale: Muundo wa Kiebrania ni mfupi na unaweza kusisitiza ama huduma kuwa zawadi ama ukuhani kutolewa kwa ajili ya huduma. Matini na tanbihi zinahifadhi mvutano huo bila kuutatua kimabavu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Pazia” limetumiwa kwa pazia la patakatifu; “mtu asiyeidhinishwa” linaweka wazi kizuizi cha kikuhani bila kutoa maana ya kikabila.
