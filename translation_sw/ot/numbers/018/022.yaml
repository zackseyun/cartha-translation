base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/022.yaml
  text: And the sons of Israel shall no longer come near the tent of meeting[a], lest they bear sin and die.
translation:
  language: sw
  text: Waisraeli wasikaribie tena Hema la Kukutania, wasije wakabeba dhambi[a] na kufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wapate hatia.” Kiebrania kinasema kihalisi, “wabebe dhambi”; huu ni usemi wa kikuhani na kisheria unaoweza kumaanisha kubeba dhima ya kosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרְבוּ
  choice: wasikaribie
  rationale: Kitenzi hiki humaanisha kukaribia; hapa kinahifadhi maana ya kidini ya kuingia karibu na mahali patakatifu.
- source_word: עוֹד
  choice: tena
  rationale: Pamoja na ukanushi, neno hili lina maana ya ‘wasi... tena’ au ‘wasi... zaidi’; ‘wasikaribie tena’ ni Kiswahili cha kawaida na wazi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa muundo wa Kiebrania ni ‘wana wa Israeli,’ hapa ni jina la pamoja la watu wa Israeli. ‘Waisraeli’ ni la asili, wazi, na halibadili maana kuwa wanaume pekee.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili linawakilisha kwa uwazi jina la patakatifu kama hema ambalo Mungu hukutana na watu wake; pia ni istilahi inayofahamika katika Kiswahili cha Biblia.
- source_word: לָשֵׂאת חֵטְא
  choice: wasije wakabeba dhambi
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania ya ‘kubeba dhambi’ na mvutano wake wa kisheria na kikuhani, badala ya kuifafanua moja kwa moja kuwa hatia au adhabu.
- source_word: לָמוּת
  choice: na kufa
  rationale: Inaonyesha kwa ufupi matokeo ya mwisho ya kukaribia isivyofaa na kudumisha mfuatano wa Kiebrania.
theological_decisions:
- issue: Iwapo kufafanua wazi kwamba ni kukaribia mahali patakatifu bila ruhusa na kujiletea hatia
  choice: 'Kudumisha usemi mfupi wa Kiebrania: ‘wasikaribie tena Hema la Kukutania, wasije wakabeba dhambi na kufa.’'
  alternative: ‘wasilikaribie tena Hema la Kukutania, la sivyo watakuwa na hatia na kufa.’
  rationale: Muktadha unahusu Waisraeli wengine kukaribia eneo takatifu ambalo huduma yake imekabidhiwa Walawi na makuhani. Tafsiri haiongezi maneno ‘bila ruhusa,’ wala haibadili ‘kubeba dhambi’ kuwa kosa la kiibada tu; hivyo inadumisha uzito na upana wa lugha ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. ‘Waisraeli’ limetumiwa badala ya ‘wana wa Israeli’ kwa sababu ni jina la kawaida la kundi zima; ‘Hema la Kukutania’ linadumisha istilahi ya eneo takatifu. Muundo ‘wasije...’ unatoa onyo la matokeo bila kuongeza ufafanuzi usiokuwapo katika chanzo.
