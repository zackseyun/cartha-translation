  text: וּ/שְׁמַרְתֶּ֗ם אֵ֚ת מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד קֶ֖צֶף עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/005.yaml
  text: And you shall keep charge of the sanctuary and the charge of the altar[a], so that there may no longer be wrath against the sons of Israel.
translation:
  language: sw
  text: Nanyi mtatimiza wajibu wa kulinda mahali patakatifu na wajibu wa kulinda madhabahu, ili kusiwe tena na ghadhabu dhidi ya wana wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: Njia mbadala za kutafsiri usemi wa Kiebrania בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Nanyi mtatimiza wajibu wa kulinda
  rationale: Kitenzi שׁמר kina maana ya kutunza, kulinda, au kushika. Kikiwa pamoja na מִשְׁמֶרֶת katika muktadha huu wa kikuhani, kinahusu kutekeleza wajibu rasmi wa ulinzi; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: מִשְׁמֶרֶת
  choice: wajibu wa kulinda
  rationale: Neno hili linaunganisha dhana za jukumu rasmi na ulinzi wa vitu vitakatifu. Kurudia usemi huo kwa mahali patakatifu na kwa madhabahu kunafuata msisitizo wa Kiebrania.
- source_word: הַקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Katika muktadha wa huduma ya kikuhani na kwa kuambatanishwa na madhabahu, neno hili linaelekea kutaja eneo takatifu, si utakatifu kama dhana ya jumla.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa madhabahu ya kutolea dhabihu.
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: ili kusiwe tena na
  rationale: Ingawa muundo wa Kiebrania unaweza kutafsiriwa kwa urahisi kuwa ‘na hakutakuwa tena na,’ muktadha unaonyesha matokeo au kusudi la kutimiza wajibu huo. ‘Ili’ huonyesha uhusiano huo bila kuongeza maelezo yasiyokuwamo.
- source_word: קֶצֶף
  choice: ghadhabu
  rationale: Katika muktadha wa hukumu ya Mungu, ‘ghadhabu’ huwasilisha uzito wa neno hili vizuri kuliko ‘hasira’ ya kawaida.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inafuata kwa karibu usemi wa Kiebrania huku ikibaki wazi katika Kiswahili. Maana ya kijumla ‘Waisraeli’ imeonyeshwa katika tanbihi.
theological_decisions:
- issue: Iwapo kishazi cha mwisho ni utabiri tu au kinaonyesha kusudi/matokeo ya ulinzi wa kikuhani
  choice: Kimetafsiriwa kwa ‘ili,’ kikionyesha kwamba kutimiza wajibu huo kunazuia ghadhabu zaidi dhidi ya Israeli.
  alternative: ‘na hakutakuwa tena na ghadhabu,’ bila kuonyesha wazi uhusiano wa kusudi au matokeo.
  rationale: Muktadha wa karibu unaweka majukumu ya makuhani na Walawi ili kuzuia watu wasikaribie isivyofaa na kupata hukumu. Hata hivyo, tafsiri haiongezi maelezo ya namna hukumu hiyo inavyotokea.
- issue: Mwenye ghadhabu
  choice: Neno ‘ghadhabu’ limeachwa bila kuongeza wazi ‘ya Mungu.’
  alternative: ‘ghadhabu ya Mungu.’
  rationale: Muktadha unaonyesha kuwa ni ghadhabu ya Mungu, lakini kishazi cha Kiebrania hakitaji Mungu waziwazi; hivyo tafsiri inadumisha ukimya huo wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Wajibu wa kulinda’ huepuka usemi mgumu wa kale na kuhifadhi maana rasmi na ya kiulinzi ya lugha ya kikuhani.
