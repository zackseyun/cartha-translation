base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/018.yaml
  text: But their flesh shall be yours[b][a], just as the breast of the wave offering and the right thigh shall be yours.
translation:
  language: sw
  text: Lakini nyama yao itakuwa yako, kama kidari cha sadaka ya kutikiswa[a] kilivyo chako, na kama paja la kulia litakavyokuwa lako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sadaka ya kutikiswa” ni sehemu iliyowasilishwa mbele za BWANA kwa mwendo wa kiibada; pia inaweza kutafsiriwa “sadaka ya kuwasilishwa.”
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשָׂרָם
  choice: Lakini nyama yao
  rationale: בָּשָׂר ni ‘nyama’ au ‘mwili’; katika muktadha wa dhabihu, ‘nyama’ hueleweka kwa kawaida kuwa sehemu inayoliwa. Kiunganishi kimetafsiriwa ‘Lakini’ ili kuonyesha tofauti na damu na mafuta yaliyotajwa katika mstari uliotangulia.
- source_word: יִהְיֶה לָּךְ
  choice: itakuwa yako
  rationale: Muundo היה + ל unaonyesha umiliki au haki ya kupewa; ‘itakuwa yako’ huhifadhi maana ya mgao wa kisheria.
- source_word: כַּחֲזֵה הַתְּנוּפָה
  choice: kama vile kidari cha sadaka ya kutikiswa
  rationale: חָזֶה ni kidari, na תְּנוּפָה ni tendo au sadaka ya kuwasilishwa kwa mwendo wa kiibada. ‘Sadaka ya kutikiswa’ ni istilahi inayoeleweka katika lugha ya dhabihu.
- source_word: וּכְשׁוֹק הַיָּמִין
  choice: na paja la kulia
  rationale: שׁוֹק hapa ni sehemu ya juu ya mguu wa mnyama, yaani paja; הַיָּמִין ni ‘la kulia.’
- source_word: לְךָ יִהְיֶה
  choice: vitakavyokuwa vyako
  rationale: Kauli ya umiliki imedumishwa mwishoni ili kuhifadhi msisitizo wa Kiebrania kwamba sehemu hizi zimegawiwa kuhani.
theological_decisions:
- issue: Mabadiliko ya kisarufi katika viambishi vya nafsi ya pili
  choice: Kutafsiri viambishi vyote kwa umiliki wa nafsi ya pili umoja, ‘yako/vyako,’ bila kuongeza jina la Haruni.
  alternative: Kusema wazi ‘vitakuwa vya Haruni’ au kutumia wingi unaowahusu makuhani.
  rationale: Muktadha unamwelekezea Haruni akiwa mwakilishi wa ukuhani, lakini maandishi yenyewe hayataji jina lake katika mstari huu. Tafsiri huhifadhi umoja na kuepuka kufafanua kupita kiasi hali isiyo ya kawaida ya viambishi vya Kiebrania.
- issue: Maana ya תְּנוּפָה katika ibada
  choice: sadaka ya kutikiswa
  alternative: sadaka ya kuwasilishwa
  rationale: Neno linaweza kusisitiza mwendo wa kiibada au tendo la kuwasilisha mbele za BWANA. Istilahi ya jadi ‘sadaka ya kutikiswa’ imewekwa katika matini, huku tanbihi ikieleza wigo wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Nyama’ limetumiwa badala ya ‘mwili’ kwa sababu ya muktadha wa sehemu ya dhabihu inayoliwa. Alama ya tanbihi [a] imewekwa mara tu baada ya istilahi inayofafanuliwa.
