  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶל הַ/לְוִיִּ֣ם תְּדַבֵּר֮ וְ/אָמַרְתָּ֣ אֲלֵ/הֶם֒ כִּֽי תִ֠קְחוּ מֵ/אֵ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל אֶת הַֽ/מַּעֲשֵׂ֗ר אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם מֵ/אִתָּ֖/ם בְּ/נַחֲלַתְ/כֶ֑ם וַ/הֲרֵמֹתֶ֤ם מִמֶּ֨/נּוּ֙ תְּרוּמַ֣ת יְהוָ֔ה מַעֲשֵׂ֖ר מִן הַֽ/מַּעֲשֵֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/026.yaml
  text: 'And to the Levites you shall speak and say to them: When you take from the sons of Israel the tithe that I have given you from them as your inheritance[a], then you shall present from it Yahweh’s contribution[c][b], a tithe from the tithe.'
translation:
  language: sw
  text: 'Nawe utazungumza na Walawi na kuwaambia: “Mtakapopokea kutoka kwa wana wa Israeli[a] zaka ambayo nimewapa kutoka kwao kama urithi wenu, mtatoa kutoka humo mchango wa Yahweh[b], zaka kutoka katika zaka hiyo[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watu wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “mchango kwa ajili ya Yahweh”; kwa mapokeo, “sadaka ya kuinuliwa ya Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “zaka kutoka katika zaka,” yaani, sehemu ya kumi ya zaka ambayo Walawi waliipokea.
    reason: clarification
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa watu wa kabila la Lawi wanaotajwa hapa.
- source_word: תְּדַבֵּר ... וְאָמַרְתָּ
  choice: utazungumza ... na kuwaambia
  rationale: Inahifadhi vitenzi vyote viwili vya agizo la Kiebrania huku ikitoa sentensi ya Kiswahili inayoeleweka.
- source_word: כִּי תִקְחוּ
  choice: Mtakapopokea
  rationale: כִּי inaingiza hali inayotarajiwa kutokea, na תִקְחוּ hapa inahusu Walawi kuipokea zaka kutoka kwa Waisraeli.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inafuata kwa karibu usemi wa Kiebrania na kuhifadhi umbo lake la kifamilia; maana pana imeelezwa katika tanbihi.
- source_word: הַמַּעֲשֵׂר
  choice: zaka
  rationale: “Zaka” ni neno la kawaida na sahihi la Kiswahili kwa sehemu ya kumi iliyowekwa katika sheria hii.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם מֵאִתָּם
  choice: ambayo nimewapa kutoka kwao
  rationale: Inahifadhi wazo kwamba Mungu ndiye aliyewapa Walawi zaka, nayo inatoka kwa wana wa Israeli.
- source_word: בְּנַחֲלַתְכֶם
  choice: kuwa urithi wenu
  rationale: Inaonyesha kwamba zaka hiyo ndiyo fungu walilopewa Walawi kama urithi wao.
- source_word: וַהֲרֵמֹתֶם
  choice: mtatenga
  rationale: Katika muktadha wa sadaka au mchango, kitenzi hiki kinamaanisha kuchukua sehemu na kuiweka wakfu au kuiwasilisha; “mtatenga” ni wazi katika Kiswahili cha sasa.
- source_word: תְּרוּמַת יְהוָה
  choice: mchango wa Yahweh
  rationale: “Mchango” huwasilisha maana ya sehemu iliyotengwa, huku “wa Yahweh” ikihifadhi kwa ufupi uhusiano wa kiambishi ambao unaweza kumaanisha mali yake au mchango kwa ajili yake.
- source_word: מַעֲשֵׂר מִן הַמַּעֲשֵׂר
  choice: zaka kutoka katika zaka hiyo
  rationale: 'Inahifadhi muundo wa sehemu unaoonyeshwa na מִן: sehemu ya kumi itolewe kutoka katika zaka ambayo Walawi wamepokea.'
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Uhusiano unaoonyeshwa na תְּרוּמַת יְהוָה
  choice: mchango wa Yahweh
  alternative: mchango kwa ajili ya Yahweh
  rationale: Muundo wa Kiebrania unaweza kueleweka kama mchango ulio wake Yahweh au uliotolewa kwa ajili yake. Matini inatumia muundo mfupi, na tanbihi inahifadhi uwezekano mwingine bila kuondoa mvutano huo.
- issue: Usemi wa kijinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli au watu wa Israeli
  rationale: Tafsiri kuu inahifadhi umbo halisi la Kiebrania, ilhali tanbihi inaonyesha kwamba huu ni usemi wa kawaida unaoweza kumaanisha Waisraeli kama taifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria wa agizo umehifadhiwa bila kutumia istilahi za kale zisizo wazi; “zaka” na “urithi” ni maneno ya kawaida ya kibiblia, na jina “Yahweh” limetumiwa moja kwa moja.
