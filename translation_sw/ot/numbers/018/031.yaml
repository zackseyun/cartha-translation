base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/031.yaml
  text: You and your household may eat it in any place[c][b][a], because it is your wages in return for your service in the tent of meeting.
translation:
  language: sw
  text: Ninyi na watu wa nyumbani mwenu mnaweza kuila mahali popote,[a][b] kwa sababu ni ujira wenu[c] kwa huduma yenu katika Hema la Kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtakula” au “mnapaswa kuila.” Katika muktadha huu wa sheria, umbo la Kiebrania linaweza kueleza agizo au ruhusa, wala si wakati uliopita tu.
    reason: lexical_alternative
  - marker: b
    text: “Watu wa nyumbani” ni wote walio katika kaya, si jengo la nyumba tu.
    reason: cultural_note
  - marker: c
    text: Au “malipo,” “thawabu,” au “malipo ya kazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אֹתוֹ
  choice: mnaweza kuila
  rationale: Katika muktadha huu wa sheria, umbo la Kiebrania linaeleza ruhusa au agizo, si tendo la wakati uliopita. Tafsiri hii inaonyesha wazi kwamba Walawi waliruhusiwa kula sehemu hiyo.
- source_word: בְּכָל מָקוֹם
  choice: mahali popote
  rationale: Hueleza kutokuwapo kwa sharti la kuila katika eneo la patakatifu; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: אַתֶּם וּבֵיתְכֶם
  choice: nanyi pamoja na watu wa nyumbani mwenu
  rationale: בַּיִת hapa ni kaya au jumuiya ya nyumbani, si jengo lenyewe tu. Usemi huu huepuka kuifanya iwe familia ya damu pekee.
- source_word: כִּי
  choice: kwa sababu
  rationale: Huanzisha sababu ya ruhusa iliyotolewa katika sehemu ya kwanza ya mstari.
- source_word: שָׂכָר
  choice: ujira
  rationale: Neno hili humaanisha malipo yanayotolewa kwa kazi au huduma; “ujira” linafaa kwa huduma rasmi ya Walawi.
- source_word: חֵלֶף
  choice: kwa
  rationale: Katika muundo “ujira wenu kwa huduma yenu,” kihusishi hiki kinaonyesha malipo yanayolingana na huduma iliyotolewa bila kufanya sentensi kuwa nzito.
- source_word: עֲבֹדַתְכֶם
  choice: huduma yenu
  rationale: Neno hili linahusu kazi rasmi waliyopewa Walawi katika patakatifu; “huduma” huhifadhi maana hiyo vizuri kuliko “kazi” ya jumla.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika Hema la Kukutania
  rationale: Hili ni jina la mahali pa kukutania na Mungu katika ibada ya Israeli; “katika” hufuata kihusishi cha Kiebrania na kinafaa kwa huduma inayohusiana na hema hilo.
theological_decisions:
- issue: Asili ya sehemu waliyopewa Walawi
  choice: Mstari unaonyesha sehemu hii kuwa chakula halali walichopewa Walawi kama ujira wa huduma yao, na ambacho hakikulazimika kuliwa mahali patakatifu.
  alternative: Kuiona kuwa mlo mtakatifu uliopaswa kuliwa katika eneo la ibada pekee.
  rationale: Kauli בְּכָל מָקוֹם, “mahali popote,” inaondoa kizuizi cha mahali na kuitofautisha sehemu hii na matoleo matakatifu zaidi yaliyopaswa kuliwa katika eneo maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nanyi pamoja na watu wa nyumbani mwenu” huonyesha wazi wingi wa wanaoambiwa na maana pana ya kaya. Mpangilio wa viashiria [a][b][c] umewekwa karibu na maneno yanayofafanuliwa.
