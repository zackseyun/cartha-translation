base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/008.yaml
  text: 'Then Yahweh spoke to Aaron: “And I[a], behold, I have given you the charge of my contributions, all the holy gifts of the sons of Israel. I have given them to you as your anointing portion[c][b], and to your sons as a permanent statute.”'
translation:
  language: sw
  text: Kisha Yahweh akasema na Haruni, “Nami, tazama, nimekukabidhi wajibu wa kutunza matoleo yangu[a], yaani, vitu vyote vitakatifu vya wana wa Israeli[c]. Nimekupa vitu hivyo kuwa fungu lako la upako[b], nami nimewapa wanao vitu hivyo kuwa sheria ya kudumu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka zangu” au, kwa usemi wa kiufundi zaidi, “sadaka zangu za kuinuliwa.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa ajili ya upako.” Yaelekea Kiebrania kinamaanisha fungu alilopewa Haruni kwa sababu ya cheo chake cha kikuhani alichotiwa mafuta.
    reason: lexical_alternative
  - marker: c
    text: Kwa Kiebrania, “wana wa Israeli,” usemi wa kawaida wa agano unaowataja watu wa Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika Kiebrania.
- source_word: וַאֲנִי הִנֵּה
  choice: Nami, tazama
  rationale: Huhifadhi msisitizo wa kiwakilishi cha nafsi ya kwanza pamoja na neno la kuvuta fikira הִנֵּה kwa Kiswahili cha heshima na kinachoeleweka.
- source_word: מִשְׁמֶרֶת
  choice: wajibu wa kutunza
  rationale: Neno hili huonyesha jukumu au amana ya kulinda na kusimamia; usemi huu unaeleza wajibu wa kikuhani bila kuufanya kuwa umiliki tu.
- source_word: תְּרוּמֹתַי
  choice: matoleo yangu
  rationale: תְּרוּמָה ni kitu kilichotengwa na kutolewa kwa Yahweh. ‘Matoleo’ ni lugha ya kawaida na pana kiasi, huku tanbihi ikihifadhi maana za kiufundi zinazowezekana.
- source_word: לְכָל קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: yaani, vitu vyote vitakatifu vya wana wa Israeli
  rationale: קָדְשֵׁי inaweza kutaja vitu au zawadi zilizowekwa wakfu. ‘Wana wa Israeli’ huhifadhi namna ya kawaida ya agano ya kuwataja watu wa Israeli.
- source_word: לְמָשְׁחָה
  choice: kuwa fungu lako la upako
  rationale: Usemi huu unadumisha uhusiano wa fungu hilo na upako wa Haruni bila kuufanya mstari useme wazi zaidi ya Kiebrania kama ni sababu, haki ya cheo, au kusudi la upako.
- source_word: לְחָק עוֹלָם
  choice: kuwa agizo la kudumu
  rationale: חָק ina nguvu ya kisheria ya jambo lililowekwa, na עוֹלָם hapa huonyesha mwendelezo wa kudumu katika mpangilio wa agano.
theological_decisions:
- issue: Maana ya haki ya kikuhani katika לְמָשְׁחָה
  choice: kuwa fungu lako la upako
  alternative: kwa ajili ya upako; kuwa fungu lako kwa sababu ya kutiwa mafuta
  rationale: Tafsiri iliyochaguliwa inadumisha uhusiano wa matoleo na upako wa Haruni na cheo chake cha kikuhani, lakini haiamui kimyakimya iwapo kihusishi kinaonyesha kusudi, sababu, au haki inayotokana na upako.
- issue: Tafsiri ya בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Huhifadhi usemi wa Kiebrania unaotumika kama jina la taifa la agano, bila kuingiza fundisho jingine katika kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. ‘Nami, tazama’ inadumisha msisitizo wa chanzo, ilhali ‘wajibu wa kutunza’ hufanya dhana ya amana ya kikuhani ieleweke bila maelezo marefu. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
