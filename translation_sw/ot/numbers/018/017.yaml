  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: katazo la kuwakomboa wazaliwa wa kwanza wa ng’ombe, kondoo, na mbuzi; hadhi yao takatifu; kunyunyizwa kwa damu madhabahuni; na kuteketezwa kwa mafuta kama sadaka ya moto yenye harufu ya kupendeza kwa Yahwe. Umoja wa amri kwa msikilizaji mmoja unalingana na Kiebrania.'
