id: NUM.18.17
reference: Numbers 18:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַ֣ךְ בְּֽכוֹר שׁ֡וֹר אֽוֹ בְכ֨וֹר כֶּ֜שֶׂב אֽוֹ בְכ֥וֹר עֵ֛ז לֹ֥א תִפְדֶּ֖ה קֹ֣דֶשׁ הֵ֑ם אֶת דָּמָ֞/ם תִּזְרֹ֤ק עַל הַ/מִּזְבֵּ֨חַ֙ וְ/אֶת חֶלְבָּ֣/ם תַּקְטִ֔יר אִשֶּׁ֛ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/017.yaml
  text: But you shall not redeem the firstborn of an ox[a], or the firstborn of a sheep, or the firstborn of a goat; they are holy. You shall sprinkle their blood on the altar, and you shall burn their fat as a food offering, a pleasing aroma to Yahweh.
translation:
  language: sw
  text: Lakini mzaliwa wa kwanza wa ng’ombe, au mzaliwa wa kwanza wa kondoo, au mzaliwa wa kwanza wa mbuzi, usimkomboe; hao ni watakatifu. Damu yao utainyunyiza juu ya madhabahu, na mafuta yao utayateketeza kuwa sadaka itolewayo kwa moto[a], harufu inayompendeza Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa ufupi zaidi, “sadaka ya moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Inaonyesha kizuizi kinachotofautisha wanyama hawa na wale waliotajwa katika sheria iliyotangulia.
- source_word: בְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Ni usemi wa kawaida na sahihi kwa mnyama wa kwanza kuzaliwa mwenye umuhimu wa kiibada katika muktadha huu.
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: Neno hili linawakilisha jamii ya ng’ombe kwa ujumla hapa, bila kulazimisha jinsia ambayo maandishi hayasisitizi.
- source_word: כֶּשֶׂב
  choice: kondoo
  rationale: Katika orodha hii neno linataja jamii ya kondoo kwa ujumla, si lazima mwana-kondoo pekee.
- source_word: עֵז
  choice: mbuzi
  rationale: Ni jina la moja kwa moja la jamii ya mnyama katika orodha ya dhabihu.
- source_word: לֹא תִפְדֶּה
  choice: usimkomboe
  rationale: Katika sheria ya kikuhani, פדה humaanisha kumtoa kwa malipo au kwa kitu mbadala; ‘komboa’ huhifadhi maana hiyo ya kisheria na kiibada.
- source_word: קֹדֶשׁ הֵם
  choice: hao ni watakatifu
  rationale: Kauli hii inaeleza sababu ya kutokombolewa kwao na kuhifadhi hadhi yao ya kuwekwa wakfu kwa Mungu.
- source_word: תִּזְרֹק
  choice: utainyunyiza
  rationale: Katika taratibu za dhabihu, kitenzi hiki hueleza damu kuelekezwa au kurushwa juu ya madhabahu; ‘nyunyiza’ ni usemi wa kawaida wa Kiswahili kwa tendo hilo la kiibada.
- source_word: חֶלְבָּם
  choice: mafuta yao
  rationale: Yanamaanisha sehemu za mafuta zilizotengwa ili ziteketezwe katika dhabihu.
- source_word: תַּקְטִיר
  choice: utayateketeza
  rationale: Hueleza kuyachoma mafuta madhabahuni ili moshi wake upande kama sadaka.
- source_word: רֵיחַ נִיחֹחַ
  choice: harufu inayompendeza
  rationale: Huhifadhi tamathali ya kiibada ya harufu ya sadaka inayokubaliwa na Mungu bila kuifanya iwe kauli kuhusu hitaji la kimwili.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Usemi wa kiibada אִשֶּׁה
  choice: sadaka itolewayo kwa moto
  alternative: sadaka ya moto
  rationale: Usemi huu unaonyesha sadaka inayowasilishwa kwa njia ya moto. Tafsiri iliyochaguliwa ni wazi kwa msomaji wa sasa na haichanganyi sadaka hii na aina maalumu ya sadaka ya kuteketezwa kabisa.
- issue: Hali takatifu ya wazaliwa wa kwanza
  choice: hao ni watakatifu
  alternative: hao wamewekwa wakfu
  rationale: ‘Watakatifu’ huhifadhi kauli halisi ya hadhi yao ya kiibada na uhusiano wake na katazo la kuwakomboa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisheria na kiibada ulio wazi lakini wenye hadhi. Umoja katika ‘usimkomboe’ unafuata kila ‘mzaliwa wa kwanza,’ huku ‘hao’ na ‘yao’ zikirejelea makundi yote matatu. Alama ya tanbihi imewekwa baada ya usemi unaohusika, yaani אִשֶּׁה.
