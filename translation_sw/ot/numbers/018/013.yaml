base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/013.yaml
  text: The firstfruits of everything in their land that they bring to Yahweh shall be yours[a]. Everyone in your house who is clean may eat it.
translation:
  language: sw
  text: Mazao ya kwanza ya kila kitu kilichomo katika nchi yao, watakayomletea Yahwe, yatakuwa yako. Kila mtu wa nyumbani mwako ambaye ni safi[a] anaweza kula hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, aliye safi kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּכּוּרֵי
  choice: mazao ya kwanza
  rationale: Hueleza mazao ya mwanzo ya mavuno yanayotolewa; usemi huu ni wa kawaida na unaeleweka kwa urahisi kuliko istilahi ya pekee.
- source_word: כָּל אֲשֶׁר בְּאַרְצָם
  choice: ya kila kitu kilicho katika nchi yao
  rationale: Inadumisha upana wa כָּל na maana ya kitu kuwa katika nchi yao bila kuongeza kwamba ni aina fulani tu ya mazao.
- source_word: אֲשֶׁר יָבִיאוּ לַיהוָה
  choice: watakayomletea Yahwe
  rationale: Kitenzi 'kumletea' kinafuata maana ya msingi ya יָבִיאוּ, huku kiambishi cha nafsi kikionyesha wazi kwamba kinacholetwa kinaelekezwa kwa Yahwe.
- source_word: לְךָ יִהְיֶה
  choice: yatakuwa yako
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba mazao hayo yatakuwa sehemu ya kuhani anayesemeshwa.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Linawakilisha jina la Mungu יהוה moja kwa moja kwa umbo linalotumiwa katika Kiswahili.
- source_word: כָּל טָהוֹר
  choice: kila mtu ... aliye safi
  rationale: Inahifadhi usemi mfupi wa Kiebrania; maana maalumu ya usafi wa kiibada imefafanuliwa katika tanbihi.
- source_word: בְּבֵיתְךָ
  choice: wa nyumbani mwako
  rationale: Hutoa maana ya kuwa mwanakaya wa nyumba ya Haruni, si kuwa tu ndani ya jengo.
- source_word: יֹאכֲלֶנּוּ
  choice: anaweza kuyala
  rationale: Katika muktadha huu hali ya kitenzi inaonyesha ruhusa au haki ya kula, si taarifa tu ya tendo la baadaye.
theological_decisions:
- issue: Maana ya טָהוֹר katika sheria za kikuhani
  choice: mwanakaya aliye safi kiibada ana ruhusa ya kula sehemu ya kikuhani
  alternative: mtu aliye safi kimaadili kwa maana ya jumla
  rationale: Muktadha wa Hesabu 18 unahusu sehemu za makuhani na masharti ya usafi; kwa hiyo usafi wa kiibada ndio maana inayofaa zaidi, bila kuugeuza kuwa dai la jumla kuhusu maadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. 'Mazao ya kwanza' limetumiwa badala ya istilahi nzito zaidi, na 'wa nyumbani mwako' linaonyesha uanachama wa kaya.
