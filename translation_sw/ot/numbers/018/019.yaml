  terminology: “BWANA,” “matoleo,” “agizo la kudumu,” “agano la chumvi,” na “wazao wako” ni chaguo zinazofaa kwa Kiswahili Sanifu na zinadumisha istilahi na taswira ya chanzo. Tanbihi inaeleza nahau kwa tahadhari inayofaa, bila kuifunga kwenye fasiri moja ya kidhehebu.
