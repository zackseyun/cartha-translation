  text: כֹּ֣ל תְּרוּמֹ֣ת הַ/קֳּדָשִׁ֗ים אֲשֶׁ֨ר יָרִ֥ימוּ בְנֵֽי יִשְׂרָאֵל֮ לַֽ/יהוָה֒ נָתַ֣תִּֽי לְ/ךָ֗ וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם בְּרִית֩ מֶ֨לַח עוֹלָ֥ם הִוא֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֥ אִתָּֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/019.yaml
  text: All the contributions of the holy things that the sons of Israel lift up to the LORD I have given to you, and to your sons and your daughters with you, as a permanent statute. It is a covenant of salt forever before the LORD for you and for your offspring with you.
translation:
  language: sw
  text: Matoleo yote ya vitu vitakatifu ambayo Waisraeli watakayomwinulia BWANA nimekupa wewe, wana wako wa kiume, na binti zako pamoja nawe, kuwa agizo la kudumu. Hili ni agano la chumvi la kudumu mbele za BWANA, kwako na kwa wazao wako pamoja nawe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Agano la chumvi” ni nahau inayoonyesha agano thabiti na la kudumu; huenda chumvi ilihusishwa na uhifadhi na uaminifu wa agano.
    reason: Nahau hiyo inaweza kuwa isiyoeleweka kwa msomaji wa sasa, na maana yake ya kitamaduni haipaswi kufichwa wala kuamuliwa kupita ushahidi.
lexical_decisions:
- source_word: תְּרוּמֹת הַקֳּדָשִׁים
  choice: matoleo ... ya vitu vitakatifu
  rationale: תְּרוּמָה ni kitu kinachotengwa na kutolewa, mara nyingi kwa kitendo cha kuinua; tafsiri hii ni ya kawaida na inaweka uhusiano wake na vitu vilivyowekwa wakfu.
- source_word: יָרִימוּ
  choice: watamwinulia
  rationale: Huhifadhi taswira halisi ya mzizi רום, ‘kuinua,’ huku kiwakilishi cha mtendewa kikionyesha kwamba matoleo hayo yanamwelekea BWANA.
- source_word: חָק עוֹלָם
  choice: agizo la kudumu
  rationale: חֹק hapa ni mpango au amri iliyowekwa, na עוֹלָם huonyesha hali ya kudumu katika upeo wa agano.
- source_word: בְּרִית מֶלַח עוֹלָם
  choice: agano la chumvi la kudumu
  rationale: Huhifadhi nahau ya Kiebrania na ishara yake ya uthabiti bila kuibadilisha kuwa ufafanuzi mmoja tu.
- source_word: זַרְעֲךָ
  choice: wazao wako
  rationale: Katika muktadha huu nomino ya pamoja ‘uzao’ inamaanisha vizazi vya Haruni; ‘wazao wako’ ni Kiswahili cha kawaida na wazi.
theological_decisions:
- issue: Maana ya ‘agano la chumvi’
  choice: Nahau imehifadhiwa katika maandiko na kufafanuliwa kwa tahadhari katika tanbihi kama ishara ya agano thabiti na la kudumu.
  alternative: Kutafsiri moja kwa moja kuwa ‘agano lisilovunjika’ au ‘agano la kudumu.’
  rationale: Maana kamili ya desturi ya chumvi haijaelezwa hapa; kuhifadhi nahau kunazuia kuamua kimya kimya ishara yake yote.
- issue: Wapokeaji wa matoleo
  choice: ‘wewe, wanao wa kiume na wa kike pamoja nawe’
  alternative: ‘wewe na familia yako’
  rationale: Tafsiri ya wazi huhifadhi kutajwa mahsusi kwa wana wa kiume na wa kike na haipanui wala kupunguza kundi lililotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘BWANA’ limetumiwa kuwakilisha jina la agano יהוה kwa kufuata desturi pana ya Biblia za Kiswahili. Mpangilio wa sentensi umefanywa wa kawaida bila kupoteza marudio na uzito wa maandishi ya Kiebrania.
