  to: Matoleo yote ya vitu vitakatifu ambayo Waisraeli watakayomwinulia BWANA nimekupa wewe, wana wako wa kiume, na binti zako pamoja nawe, kuwa agizo la kudumu. Hili ni agano la chumvi la kudumu mbele za BWANA, kwako na kwa wazao wako pamoja nawe.[a]
  rationale: Marekebisho yanaondoa utata wa kisarufi kwa kutaja kila mpokeaji kwa kiunganishi (“wewe, wana wako wa kiume, na binti zako”) na kurekebisha kishazi rejeshi ili matoleo yawe ndiyo kitu kinachoinuliwa kwa BWANA. Nahau ya Kiebrania na tanbihi yake vimehifadhiwa.
