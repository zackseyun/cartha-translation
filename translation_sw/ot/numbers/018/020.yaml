  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶֽל אַהֲרֹ֗ן בְּ/אַרְצָ/ם֙ לֹ֣א תִנְחָ֔ל וְ/חֵ֕לֶק לֹא יִהְיֶ֥ה לְ/ךָ֖ בְּ/תוֹכָ֑/ם אֲנִ֤י חֶלְקְ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/020.yaml
  text: And Yahweh said to Aaron[a], “In their land you shall not inherit, and no portion shall be yours among them. I am your portion and your inheritance among the sons of Israel.”
translation:
  language: sw
  text: Yahwe akamwambia Aroni, “Hutapata urithi katika nchi yao, wala hutakuwa na sehemu kati yao. Mimi ni sehemu yako na urithi wako miongoni mwa wana wa Israeli[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miongoni mwa watu wa Israeli” au “miongoni mwa Waisraeli.” Kiebrania kinasema kihalisi “miongoni mwa wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: בְּאַרְצָם
  choice: katika nchi yao
  rationale: Neno אֶרֶץ hapa linamaanisha eneo la nchi ambalo Waisraeli walipewa kuwa urithi.
- source_word: תִנְחָל
  choice: hutarithi chochote
  rationale: Kitenzi נחל kinamaanisha kupokea au kumiliki urithi. ‘Hutarithi chochote’ ni Kiswahili cha kawaida kinachoweka wazi maana ya kauli hasi bila kuongeza aina nyingine ya mali.
- source_word: חֵלֶק
  choice: sehemu
  rationale: ‘Sehemu’ linaweza kumaanisha fungu alilopewa mtu, na linadumisha uhusiano wa kimatini kati ya kutokuwa na sehemu na Yahwe kuwa sehemu ya Aroni.
- source_word: בְּתוֹכָם
  choice: kati yao
  rationale: Kirai hiki kinaonyesha kwamba Aroni hatakuwa na fungu miongoni mwa Waisraeli; ‘kati yao’ ni cha kawaida na sahihi katika Kiswahili.
- source_word: אֲנִי חֶלְקְךָ
  choice: Mimi ni sehemu yako
  rationale: Tafsiri hii inadumisha tamko kuu kwamba Yahwe mwenyewe ndiye fungu la Aroni, bila kulifafanua zaidi kiteolojia.
- source_word: נַחֲלָתְךָ
  choice: urithi wako
  rationale: ‘Urithi’ linahifadhi maana ya kisheria na ya agano ya נַחֲלָה, pamoja na mwangwi wa kitenzi ‘hutarithi’ mwanzoni mwa aya.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: miongoni mwa wana wa Israeli
  rationale: Tafsiri hii inafuata kwa karibu muundo wa Kiebrania ‘wana wa Israeli’ na kudumisha taswira yake ya kifamilia na ya agano.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja. ‘Yahwe’ linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: watu wa Israeli; Waisraeli
  rationale: ‘Wana wa Israeli’ linadumisha umbo halisi na taswira ya kifamilia ya Kiebrania, huku tanbihi ikitoa maumbo ya kawaida zaidi yenye maana ya kijumuiya.
- issue: Yahwe kuwa sehemu na urithi wa Aroni
  choice: Mimi ni sehemu yako na urithi wako
  alternative: Mimi ndiye nitakayekupa mahitaji yako badala ya urithi
  rationale: Tamko la moja kwa moja limehifadhiwa ili kutoondoa sitiari ya urithi wala kuifunga kwa ufafanuzi mmoja wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Mpangilio na marudio ya msamiati wa urithi yamehifadhiwa kadiri inavyowezekana bila kufanya sentensi iwe ngumu.
