  text: 'Yahwe[a] akamwambia Mose hivi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akamwambia
  rationale: Muundo wa masimulizi wa waw pamoja na kitenzi דבר unaendeleza simulizi kwa hatua mpya. Katika Kiswahili cha sasa, “akamwambia” ni njia ya asili ya kueleza kwamba Yahwe alisema maneno kwa Mose, bila kulazimika kutumia “akanena ... akisema,” ambao hapa ungekuwa mzito.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo kama “BWANA,” ili kuhifadhi jina binafsi lililo katika Kiebrania.
- source_word: אֶל
  choice: -mwambia
  rationale: Kihusishi kinachoelekeza usemi kwa Mose kimewasilishwa kwa kiambishi cha yambwa “-mw-” ndani ya kitenzi, kwa mujibu wa sarufi ya kawaida ya Kiswahili.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: “Mose” ni umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akamwambia (ikidokeza utangulizi wa maneno yanayofuata)
  rationale: Katika fomula hii ya Kiebrania, לֵאמֹר hutanguliza usemi wa moja kwa moja. Kiswahili cha asili huweza kuunganisha maana hiyo katika “akamwambia” na kuweka koma kabla ya maneno yanayofuata, badala ya tafsiri nzito “akisema.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia Tetragramatoni יהוה, kwa hiyo tafsiri inahifadhi jina hilo kama “Yahwe.” Tanbihi inataja desturi ya kulitafsiri kwa cheo “BWANA” bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akamwambia” ni ya asili zaidi kuliko “akanena ... akisema,” huku koma ikionyesha kuwa usemi wa moja kwa moja unafuata katika mstari unaofuata.
