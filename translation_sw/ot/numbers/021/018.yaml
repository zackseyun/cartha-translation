base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/018.yaml
  text: the well that the princes dug[a], that the nobles of the people hollowed out with the ruler’s staff, with their staffs[b]. And from the wilderness they went to Mattanah.
translation:
  language: sw
  text: 'kisima walichokichimba wakuu,

    ambacho waheshimiwa wa watu walikichimba

    kwa fimbo ya mtawala[a],

    kwa fimbo zao.

    Nao walitoka nyikani wakaenda Matana.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mtoa sheria,” ikiwa מְחֹקֵק linaeleweka kuwa mtu badala ya fimbo ya mtawala.
    reason: alternative_reading
  - marker: b
    text: Kiebrania kinasema kwa ufupi, “na kutoka nyikani Matana”; yaelekea maana yake ni hatua ya safari, “na kutoka nyikani hadi Matana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵר
  choice: kisima
  rationale: Nomino hii humaanisha kisima. Ingawa Kiebrania hakina kibainishi wazi hapa, mstari unarejelea kisima maalumu kilichosifiwa katika mstari uliotangulia.
- source_word: חֲפָרוּהָ
  choice: walichokichimba
  rationale: Kitenzi חפר humaanisha kuchimba, na kiambishi cha nafsi ya tatu kike umoja kinarejelea בְּאֵר, ‘kisima.’ Muundo wa Kiswahili unaonyesha uhusiano huo wazi.
- source_word: שָׂרִים
  choice: wakuu
  rationale: Neno hili humaanisha viongozi wenye cheo cha juu. ‘Wakuu’ ni la kawaida, lenye hadhi, na halidai kwamba watu hao walikuwa wana wa wafalme.
- source_word: כָּרוּהָ
  choice: walikitoboa
  rationale: Kitenzi כרה pia kinahusu kuchimba. ‘Walikitoboa’ kinadumisha tofauti ya kishairi na חפר bila kuondoka katika picha ya kufukua au kufanya shimo.
- source_word: נְדִיבֵי הָעָם
  choice: waheshimiwa wa watu
  rationale: Katika ulinganifu na שָׂרִים, neno נְדִיבֵי linaelekea kumaanisha watu wenye hadhi au wakuu, si tu watu wakarimu au waliojitolea.
- source_word: בִּמְחֹקֵק
  choice: kwa fimbo ya mtawala
  rationale: מְחֹקֵק inaweza kumaanisha mtawala, mtoa sheria, au fimbo ya utawala. Ulinganifu wake na ‘kwa fimbo zao’ unaunga mkono maana ya chombo cha utawala.
- source_word: בְּמִשְׁעֲנֹתָם
  choice: kwa fimbo zao
  rationale: מִשְׁעֵנָה ni fimbo ya kutegemezea au kushikia. ‘Fimbo zao’ ni tafsiri fupi na ya kawaida inayofaa ulinganifu wa kishairi.
- source_word: וּמִמִּדְבָּר מַתָּנָה
  choice: Nao walitoka nyikani wakaenda Matana
  rationale: Ingawa Kiebrania kinasema kwa ufupi ‘na kutoka nyikani Matana,’ muktadha unaorodhesha hatua za safari. Kiswahili huhitaji kitenzi ili kuonyesha mwendo huo kwa kawaida; ‘Matana’ limehifadhiwa kama jina la mahali.
theological_decisions:
- issue: Maana ya בִּמְחֹקֵק katika usemi wa kishairi wenye uwezekano wa maana zaidi ya moja
  choice: kwa fimbo ya mtawala
  alternative: kwa mtoa sheria; kwa amri
  rationale: Ulinganifu wa karibu na ‘kwa fimbo zao’ unaelekeza zaidi kwenye chombo, lakini tanbihi inahifadhi uwezekano wa kulielewa neno hilo kama mtu. Uamuzi huu ni wa kileksia na kimuktadha, si wa kimadhehebu.
- issue: Nguvu ya וּמִמִּדְבָּר מַתָּנָה
  choice: Nao walitoka nyikani wakaenda Matana
  alternative: na kutoka nyikani, Matana
  rationale: Muktadha wa Hesabu 21:18–20 ni orodha ya vituo vya safari. Kutaja mwendo kutoka nyikani hadi Matana kunawasilisha mfuatano huo kwa Kiswahili cha kawaida huku tanbihi ikionyesha ufupi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi ulio wazi na wenye hadhi. Mistari imepangwa kudumisha ulinganifu wa wimbo. ‘Wakuu’ na ‘waheshimiwa’ huepuka lugha ya kifalme iliyo mahususi kupita kiasi, na ‘nyikani’ huwasilisha eneo la pori lisilokaliwa kwa ufupi.
