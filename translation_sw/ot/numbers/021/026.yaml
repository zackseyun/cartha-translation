  text: כִּ֣י חֶשְׁבּ֔וֹן עִ֗יר סִיחֹ֛ן מֶ֥לֶךְ הָ/אֱמֹרִ֖י הִ֑וא וְ/ה֣וּא נִלְחַ֗ם בְּ/מֶ֤לֶךְ מוֹאָב֙ הָֽ/רִאשׁ֔וֹן וַ/יִּקַּ֧ח אֶת כָּל אַרְצ֛/וֹ מִ/יָּד֖/וֹ עַד אַרְנֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/026.yaml
  text: For Heshbon was the city of Sihon king of the Amorites[a], and he had fought against the former king of Moab and had taken all his land from his hand as far as the Arnon.
translation:
  language: sw
  text: Kwani Heshboni ulikuwa mji wa Sihoni, mfalme wa Waamori; naye alikuwa amepigana dhidi ya mfalme wa awali wa Moabu[a] na alikuwa ameichukua nchi yote ya mfalme huyo wa Moabu kutoka mkononi mwake[b], mpaka Arnoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfalme wa kwanza wa Moabu.”
    reason: Kivumishi הָרִאשׁוֹן kinaweza kumaanisha ‘wa awali’ au, kwa maana ya moja kwa moja zaidi, ‘wa kwanza.’
  - marker: b
    text: Yaani, kutoka chini ya mamlaka yake; nahau ya Kiebrania inasema kwa maana halisi, “kutoka mkononi mwake.”
    reason: Inafafanua nahau ya Kiebrania huku tafsiri kuu ikihifadhi taswira yake.
lexical_decisions:
- source_word: כִּי
  choice: Kwani
  rationale: Inaonyesha kuwa sentensi hii inatoa sababu au maelezo ya yaliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: עִיר סִיחֹן
  choice: mji wa Sihoni
  rationale: Neno עִיר ni ‘mji,’ na muundo wa Kiswahili ‘mji wa Sihoni’ unaonyesha kuwa ulikuwa mji wake au kituo chake cha kifalme.
- source_word: הִוא
  choice: ulikuwa
  rationale: Ingawa kishazi cha Kiebrania hakina kitenzi cha wakati uliopita kilichoandikwa wazi, muktadha wa simulizi la kihistoria unahitaji wakati uliopita; upatanisho wa ‘mji’ ni ‘ulikuwa.’
- source_word: נִלְחַם בְּ
  choice: alikuwa amepigana dhidi ya
  rationale: Kitenzi kinaonyesha kupigana na mtu; wakati timilifu uliopita unaonyesha tukio lililotangulia hali inayofafanuliwa katika simulizi.
- source_word: הָרִאשׁוֹן
  choice: wa awali
  rationale: Hutoa maana ya mfalme aliyekuwapo hapo kabla, huku tanbihi ikihifadhi uwezekano wa tafsiri ya moja kwa moja ‘wa kwanza.’
- source_word: וַיִּקַּח
  choice: na kuitwaa
  rationale: ‘Kutwaa’ linaonyesha kuichukua nchi kwa ushindi wa kijeshi. Muundo huu unaunganisha kitendo hicho na vita vilivyokuwa vimetokea kabla.
- source_word: כָּל אַרְצוֹ
  choice: nchi yake yote
  rationale: Inarejelea eneo lote lililokuwa chini ya mfalme wa Moabu; ‘nchi’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: מִיָּדוֹ
  choice: kutoka mkononi mwake
  rationale: Inahifadhi taswira ya nahau ya Kiebrania, ambayo hapa ina maana ya kuondoa nchi chini ya mamlaka yake; maana hiyo imefafanuliwa katika tanbihi.
- source_word: עַד אַרְנֹן
  choice: mpaka Arnoni
  rationale: Inaonyesha mpaka au ukomo wa eneo lililotwaliwa kwa lugha ya kawaida ya Kiswahili.
