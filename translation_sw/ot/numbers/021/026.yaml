translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa katika maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili: Heshboni, Sihoni, Waamori, Moabu, na Arnoni. Nukta mkato imetumika kuhifadhi uhusiano wa karibu wa kishazi cha maelezo bila kuifanya sentensi iwe nzito.'
