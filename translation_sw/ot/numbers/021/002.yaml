base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/002.yaml
  text: Then Israel made a vow to Yahweh and said[a], “If you indeed give this people into my hand[b], then I will devote their cities to destruction.”
translation:
  language: sw
  text: Ndipo Israeli akaweka nadhiri kwa BWANA, akisema, “Ikiwa kwa hakika utawatia[a] watu hawa mkononi mwangu, basi nitaitenga miji yao kwa maangamizi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa utawatia hakika watu hawa mikononi mwangu.” Kiebrania kinakazia kitenzi kwa muundo ambao kihalisi ni “kutoa, utatoa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nitaiweka miji yao chini ya ḥerem.” Kiebrania kinamaanisha kuitenga miji hiyo kabisa kwa maangamizi kama tendo la ḥerem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: akaweka nadhiri
  rationale: Muundo wa Kiebrania unatumia nomino na kitenzi vyenye mzizi mmoja, kihalisi ‘akaapa nadhiri.’ Kiswahili cha kawaida na chenye hadhi husema ‘kuweka nadhiri,’ kikihifadhi maana ya ahadi nzito.
- source_word: לַיהוָה
  choice: kwa BWANA
  rationale: Jina la agano יהוה limetafsiriwa kwa desturi iliyozoeleka ya Kiswahili ‘BWANA,’ huku herufi kubwa zikilitofautisha na cheo cha kawaida.
- source_word: אִם נָתֹן תִּתֵּן
  choice: Ikiwa kwa hakika utawatia
  rationale: Kitenzi-jina kisicho na kikomo kinachofuatwa na kitenzi chenye ukomo huongeza mkazo; ‘kwa hakika’ huwasilisha mkazo huo kwa Kiswahili cha asili.
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: Ingawa עָם ni nomino ya umoja yenye maana ya kundi, ‘watu hawa’ ndiyo kauli ya kawaida ya Kiswahili na haibadili rejeleo lake la pamoja.
- source_word: בְּיָדִי
  choice: mkononi mwangu
  rationale: Taswira ya Kiebrania ya kutiwa ‘mkononi’ mwa mtu imehifadhiwa; ni nahau inayoeleweka kuwa chini ya uwezo au mamlaka yake.
- source_word: וְהַחֲרַמְתִּי
  choice: nitaiweka ... wakfu ili iangamizwe
  rationale: Kitenzi חרם hapa kinaonyesha kuweka kitu chini ya ḥerem—kukitoa kabisa kwa uharibifu—si kuharibu tu katika mapigano. ‘Kuweka wakfu ili iangamizwe’ hudumisha pande za kidini na za uharibifu za neno hilo.
- source_word: עָרֵיהֶם
  choice: miji yao
  rationale: עִיר kwa kawaida ni ‘mji’; wingi wake umetafsiriwa moja kwa moja kama ‘miji.’
theological_decisions:
- issue: Lugha ya חרם katika nadhiri ya kivita
  choice: nitaiweka miji yao wakfu ili iangamizwe
  alternative: nitaiangamiza kabisa miji yao; nitaiweka miji yao chini ya marufuku
  rationale: Tafsiri hii inaonyesha kwamba מדובר si uharibifu wa kawaida tu, bali tendo rasmi la kuitenga miji hiyo bila kubatilishwa kwa kusudi la kuangamizwa. Haiongezi maelezo ya baadaye ya kimadhehebu au ya kimaadili.
- issue: Umoja wa Israeli kama mhusika wa pamoja
  choice: Israeli akaweka ... mkononi mwangu
  alternative: Waisraeli wakaweka ... mikononi mwetu
  rationale: Kiebrania humtaja Israeli kama mhusika mmoja wa pamoja na huhifadhi nafsi ya kwanza umoja katika maneno ya nadhiri. Tafsiri imehifadhi mvutano huo badala ya kuubadili kuwa wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Israeli’ imetumiwa kama jina la pamoja ili kuhifadhi umoja wa kisarufi wa chanzo; ‘mkononi mwangu’ inadumisha taswira ya Kiebrania. Alama za tanbihi zimewekwa kwenye vifungu vinavyohusika moja kwa moja.
