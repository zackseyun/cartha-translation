  text: Therefore the poets say, “Come to Heshbon; let the city of Sihon be built and established.”
translation:
  language: sw
  text: 'Kwa hiyo watunga mashairi[a] husema,


    “Njooni Hesboni;


    mji wa Sihoni ujengwe na uimarishwe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasemaji wa methali” au “waimbaji wa tungo”; tafsiri ya jadi ni “watawala.” Neno la Kiebrania hapa huenda linamaanisha watunzi au wasemaji wa wimbo wa kimethali, si watawala wa kisiasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho au maelezo yanayotokana na simulizi lililotangulia, kwa Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: יֹאמְרוּ
  choice: husema
  rationale: Kauli ya kutendeka mara kwa mara au ya kawaida katika utangulizi wa nukuu; “husema” inaonyesha desturi hiyo vizuri kuliko wakati ujao.
- source_word: הַמֹּשְׁלִים
  choice: watunga mashairi
  rationale: Katika muktadha huu neno linawahusu watunzi au wasemaji wa tungo ya kimethali au ya kishairi, si watawala wa kisiasa. “Watunga mashairi” ni ya kawaida na inaeleweka, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: בֹּאוּ
  choice: Njooni
  rationale: Ni amri ya wingi; “Njooni” ni mwito wa moja kwa moja na wa asili katika Kiswahili.
- source_word: חֶשְׁבּוֹן
  choice: Hesboni
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: תִּבָּנֶה
  choice: na ujengwe
  rationale: Umbo hili lina nguvu ya matakwa au mwito katika shairi; kiambishi “na” pamoja na hali ya kutendwa huhifadhi maana ya ‘acha ujengwe.’
- source_word: וְתִכּוֹנֵן
  choice: na uimarishwe
  rationale: Hutoa maana ya kuwekwa imara au kuthibitishwa, na hudumisha ulinganifu wa kishairi na “ujengwe.”
- source_word: עִיר סִיחוֹן
  choice: mji wa Sihoni
  rationale: Huhifadhi wazi uhusiano wa umilikaji katika muundo wa Kiebrania.
