base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/019.yaml
  text: And from Mattanah to Nahaliel[a], and from Nahaliel to Bamoth.
translation:
  language: sw
  text: Na kutoka Matana hadi Nahalieli, na kutoka Nahalieli hadi Bamothi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania Bamoth linaweza pia kumaanisha “miinuko” au “mahali pa juu,” lakini hapa linaeleweka vyema kuwa jina la mahali katika ratiba ya safari ya Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּתָּנָה
  choice: Na kutoka Matana
  rationale: Kiunganishi וּ kimetafsiriwa “na,” na kihusishi מִן kuwa “kutoka.” מַתָּנָה ni jina la mahali katika ratiba hii, hivyo limetoholewa kuwa “Matana” badala ya kutafsiriwa maana yake.
- source_word: נַחֲלִיאֵל
  choice: hadi Nahalieli
  rationale: Ingawa hakuna kihusishi kilichoandikwa kabla ya jina hili, mtindo wa mkato wa ratiba unaonyesha mwendo kutoka kituo kimoja hadi kingine. “Hadi” limeongezwa ili Kiswahili kiwe wazi na cha kawaida, huku jina likitoholewa kama “Nahalieli.”
- source_word: וּ/מִ/נַּחֲלִיאֵל
  choice: na kutoka Nahalieli
  rationale: וּ ni “na,” מִן ni “kutoka,” na jina la mahali limerudiwa kwa namna ileile ili kudumisha ulinganifu.
- source_word: בָּמֽוֹת
  choice: Bamothi
  rationale: Katika muktadha huu wa ratiba, neno hili linafanya kazi kama jina la mahali, hivyo limetoholewa kuwa “Bamothi.” Hata hivyo, maana yake ya kawaida, “miinuko” au “mahali pa juu,” imehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, yenye hadhi, na ya kawaida kwa ratiba ya safari. Muundo wa mkato wa Kiebrania umehifadhiwa bila kuongeza kitenzi kisichotajwa, huku “hadi” likisaidia kuonyesha mwendo unaodokezwa.
