translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa urahisi. Umoja katika “Niruhusu nipite” na wingi katika ahadi zinazofuata umehifadhiwa kama ulivyo katika Kiebrania. Alama ya tanbihi imewekwa baada ya “njia ya mfalme,” ambako mbadala wake wa kileksika unahusika.
