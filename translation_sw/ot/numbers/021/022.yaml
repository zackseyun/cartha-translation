base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/022.yaml
  text: Let me pass through your land. We will not turn aside into field or vineyard[a], and we will not drink water from a well. We will go by the king’s road until we have passed through your territory.
translation:
  language: sw
  text: “Niruhusu nipite katika nchi yako. Hatutageuka na kuingia mashambani wala katika mashamba ya mizabibu, wala hatutakunywa maji ya kisima. Tutafuata njia ya mfalme[a] mpaka tutakapovuka mpaka wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “barabara kuu ya mfalme.”
    reason: Mbadala huu huonyesha kwamba דֶּרֶךְ הַמֶּלֶךְ unaweza kurejelea njia kuu ya kifalme; “njia ya mfalme” huhifadhi muundo wa Kiebrania.
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Niruhusu nipite
  rationale: Kauli ya cohortative ya nafsi ya kwanza umoja inaonyesha ombi la kidiplomasia; Kiswahili hiki ni cha asili na huhifadhi ombi hilo.
- source_word: בְאַרְצְךָ
  choice: katika nchi yako
  rationale: אֶרֶץ hapa humaanisha nchi au ardhi iliyo chini ya mamlaka ya mfalme; “nchi yako” ni wazi katika muktadha huu.
- source_word: לֹא נִטֶּה
  choice: Hatutageukia
  rationale: נטה katika muktadha wa safari ni kuacha njia na kuelekea kando; “hatutageukia” huhifadhi picha hiyo ya mwendo.
- source_word: בְּשָׂדֶה וּבְכֶרֶם
  choice: shambani wala katika shamba la mizabibu
  rationale: Nomino hizi zina maana ya jumla ya maeneo yaliyolimwa; “wala” huonyesha kwa kawaida kuwa hawataingia katika eneo la aina yoyote kati ya hizo.
- source_word: לֹא נִשְׁתֶּה מֵי בְאֵר
  choice: wala hatutakunywa maji ya kisima
  rationale: Hii ni tafsiri ya asili ya kishazi halisi “maji ya kisima” na inaonyesha kuwa hawatatumia maji ya wenyeji.
- source_word: בְּדֶרֶךְ הַמֶּלֶךְ
  choice: Tutafuata njia ya mfalme
  rationale: Kishazi kinamaanisha kusafiri katika njia kuu ya umma inayohusishwa na mfalme; “kufuata njia” ni usemi wa kawaida wa Kiswahili kwa kusafiri kwenye njia hiyo.
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבֻלֶךָ
  choice: mpaka tutakapokuwa tumepita katika eneo lako
  rationale: גְּבוּל inaweza kumaanisha mpaka au eneo lenye mipaka. Katika muktadha huu, lengo ni kukamilisha safari kupitia eneo la mfalme; tafsiri hii ni ya asili bila kuifanya kuwa kuvuka mpaka mmoja tu.
