base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/016.yaml
  text: And from there they went to Beer[a]. That is the well about which Yahweh said to Moses, “Gather the people[b], and I will give them water.”
translation:
  language: sw
  text: Kutoka huko wakaenda Beeri.[a] Hiki ndicho kisima[b] ambacho Yahweh alimwambia Musa kukihusu, “Kusanya watu, nami nitawapa maji.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beeri ni jina la mahali; katika Kiebrania jina hilo linasikika kama neno linalomaanisha “kisima.”
    reason: cultural_note
  - marker: b
    text: Au, “Hiki ndicho kisima ambacho Yahweh alisema na Musa kukihusu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: Nao kutoka huko
  rationale: Kiunganishi pamoja na kirai cha mahali kinaendeleza mfululizo wa safari; “Nao kutoka huko” ni Kiswahili cha kawaida katika simulizi.
- source_word: בְּאֵרָה
  choice: wakaenda Beeri
  rationale: Beeri limetumiwa kama jina la mahali. Kiishio cha Kiebrania kinachoonyesha mwendo kuelekea mahali hapo kimewasilishwa kwa kitenzi “wakaenda.”
- source_word: הִוא הַבְּאֵר
  choice: Hicho ndicho kisima
  rationale: Hiki ni kishazi cha utambulisho kinachoeleza umuhimu wa mahali paitwapo Beeri; “hicho” kinarejelea kisima kilichotajwa kwa jina la mahali.
- source_word: אֲשֶׁר אָמַר יְהוָה לְמֹשֶׁה
  choice: ambacho Yahweh alimwambia Musa
  rationale: Kishazi hiki kinaunganisha kisima na maneno ya Yahweh yanayofuata. Muundo huu ni mfupi na wa kawaida kwa Kiswahili, huku tanbihi ikionyesha namna ya wazi zaidi ya kueleza uhusiano huo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina la pekee lililo katika matini ya Kiebrania.
- source_word: אֱסֹף אֶת־הָעָם
  choice: Wakusanye watu
  rationale: Amri hiyo inamtaka Musa kuwakusanya watu pamoja; “wakusanye” ni ya moja kwa moja, ya sasa, na inafaa katika muktadha.
- source_word: וְאֶתְּנָה לָהֶם מָיִם
  choice: nami nitawapa maji
  rationale: Kitenzi cha nafsi ya kwanza chenye dhana ya azimio au kusudi baada ya amri kimetafsiriwa kama ahadi ya moja kwa moja, bila kufuta uwezekano wa uhusiano wa kusudi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina la pekee la Mungu, si cheo. “Yahweh” hulihifadhi jina hilo bila kuingiza desturi ya kulibadilisha kuwa “BWANA.”
- issue: Nguvu ya וְאֶתְּנָה baada ya amri
  choice: nami nitawapa maji
  alternative: ili niwape maji
  rationale: Muundo unaweza kuonyesha azimio au kusudi. Tafsiri kuu inasikika kama ahadi ya Mungu, lakini mbadala wa kusudi unawezekana kisarufi na haupingwi na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa Maandiko. “Beeri” limetoholewa ili kuonyesha matamshi ya jina la Kiebrania, na tanbihi inaeleza mchezo wa sauti kati ya jina hilo na neno la Kiebrania la “kisima.”
