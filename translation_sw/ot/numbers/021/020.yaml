  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Majina yametoholewa kuwa Bamothi, Moabu, na Pisga. Muundo wa safari kutoka sehemu moja hadi nyingine umehifadhiwa, huku nahau ya Kiebrania ikitolewa kwa Kiswahili cha kawaida na maana yake halisi kuwekwa katika tanbihi.
