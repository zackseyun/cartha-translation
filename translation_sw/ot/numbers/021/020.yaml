base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/020.yaml
  text: and from Bamoth to the valley that is in the field of Moab[a], to the top of Pisgah[b], which overlooks the face of the wasteland.
translation:
  language: sw
  text: na kutoka Bamothi hadi bonde lililo katika nchi ya Moabu, kwenye kilele cha Pisga, kinachotazama kuelekea nyika.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “uso wa nyika,” yaani eneo linalokabiliwa au kutazamwa kutoka hapo.
    reason: cultural_note
  - marker: b
    text: Au “Yeshimoni,” ikiwa neno la Kiebrania linaeleweka kuwa jina la eneo badala ya neno la kawaida linalomaanisha nyika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּמוֹת
  choice: na kutoka Bamothi
  rationale: Viambishi vya Kiebrania וּ־ na מִ־ vimetafsiriwa kuwa “na kutoka.” בָּמוֹת hapa ni jina la mahali katika orodha ya safari, kwa hiyo limetoholewa badala ya kutafsiriwa “mahali pa juu.”
- source_word: הַגַּיְא
  choice: bonde
  rationale: Neno גַּיְא linaweza kumaanisha bonde au korongo; “bonde” ni neno la kawaida na linafaa katika maelezo haya ya kijiografia.
- source_word: אֲשֶׁר בִּשְׂדֵה מוֹאָב
  choice: lililo katika nchi ya Moabu
  rationale: שָׂדֶה maana yake ya msingi ni “shamba,” lakini katika matumizi ya kijiografia inaweza kumaanisha eneo au nchi. “Nchi ya Moabu” ni ya asili katika Kiswahili na inaonyesha kuwa bonde hilo liko katika eneo la Moabu.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: kilele cha Pisga
  rationale: רֹאשׁ ni “kichwa” kwa maana halisi, lakini katika muktadha wa jiografia humaanisha sehemu ya juu au kilele. Pisga limehifadhiwa kama jina la mahali.
- source_word: וְנִשְׁקָפָה
  choice: kinachotazama
  rationale: Kitenzi kinaeleza kilele kuwa kinakabili au kinaonekana juu ya eneo hilo. Kishazi tegemezi kinaunganisha maelezo hayo na “kilele cha Pisga” kwa Kiswahili cha kawaida.
- source_word: עַל־פְּנֵי
  choice: upande wa
  rationale: Usemi huu una maana halisi ya “juu ya uso wa,” lakini katika jiografia humaanisha kukabili au kutazama kuelekea eneo fulani. “Upande wa” huwasilisha maana hiyo bila kufanya sentensi kuwa ngumu.
- source_word: הַיְשִׁימֹן
  choice: nyika
  rationale: יְשִׁימוֹן ni eneo kame na ukiwa. “Nyika” ni neno la kawaida la Kiswahili kwa ardhi kavu isiyokaliwa sana; uwezekano wa neno hilo kuwa jina la eneo umehifadhiwa katika tanbihi.
