  text: So Israel lived in the land of the Amorites[a].
translation:
  language: sw
  text: Basi Israeli akakaa katika nchi ya Waamori.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Basi Israeli aliishi katika nchi ya Waamori.”
