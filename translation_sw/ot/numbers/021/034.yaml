base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/034.yaml
  text: And Yahweh said to Moses[a], “Do not fear him, for I have given him into your hand, along with all his people and his land. You shall do to him as you did to Sihon king of the Amorites[b], who lived in Heshbon.”
translation:
  language: sw
  text: Yahwe akamwambia Mose, “Usimwogope, kwa maana nimemtia mkononi mwako[a], yeye pamoja na watu wake wote na nchi yake. Utamtendea kama ulivyomtendea Sihoni, mfalme wa Waamori, aliyekuwa akiishi Heshboni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli ya Kiebrania ni “nimempa mkononi mwako,” yaani, “nimemtia chini ya mamlaka yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano la Mungu lililoandikwa moja kwa moja katika Kiebrania, kwa tahajia ya kawaida ya Kiswahili.
- source_word: אַל תִּירָא אֹתוֹ
  choice: Usimwogope
  rationale: Ni katazo la moja kwa moja na la asili katika Kiswahili, likidumisha kiwakilishi kinachomrejelea Ogu katika muktadha.
- source_word: בְיָדְךָ נָתַתִּי אֹתוֹ
  choice: nimemtia mkononi mwako
  rationale: Linahifadhi picha ya Kiebrania ya kumtia mtu katika mkono wa mwingine, huku likieleweka kama kumweka chini ya mamlaka yake.
- source_word: אֹתוֹ וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: yeye pamoja na watu wake wote na nchi yake
  rationale: 'Linabainisha vitu vyote vitatu vilivyokabidhiwa: mfalme mwenyewe, watu wake wote, na nchi yake.'
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: Utamtendea kama ulivyomtendea
  rationale: Linatoa kwa uwazi tendo la wakati ujao na ulinganisho na jambo ambalo tayari lilifanywa kwa Sihoni.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Sihoni, mfalme wa Waamori
  rationale: Linatumia majina ya kawaida ya Kiswahili na kuhifadhi muundo wa cheo cha mfalme.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: aliyekuwa akiishi Heshboni
  rationale: Kirai hiki cha Kiswahili kinaonyesha makazi ya Sihoni kwa namna ya kawaida na kinaakisi hali endelevu ya kitenzi-shirikishi cha Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu; kulitaja kama “Yahwe” huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Ukamilifu wa ahadi katika נָתַתִּי
  choice: nimemtia
  alternative: nitamtia
  rationale: Kauli timilifu ya Kiebrania inawasilisha kukabidhiwa kwa Ogu kama jambo lililokwisha hakikishwa kutoka kwa mtazamo wa Mungu; wakati timilifu wa Kiswahili unahifadhi nguvu hiyo bila kuigeuza kuwa ahadi ya wakati ujao tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa Kiebrania umehifadhiwa pale unapobaki wa kawaida katika Kiswahili, huku nahau ya “mkononi mwako” ikifafanuliwa katika tanbihi.
