  text: וַ/יִּשְׁמַ֞ע הַ/כְּנַעֲנִ֤י מֶֽלֶךְ עֲרָד֙ יֹשֵׁ֣ב הַ/נֶּ֔גֶב כִּ֚י בָּ֣א יִשְׂרָאֵ֔ל דֶּ֖רֶךְ הָ/אֲתָרִ֑ים וַ/יִּלָּ֨חֶם֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּ֥שְׁבְּ מִמֶּ֖/נּוּ שֶֽׁבִי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/001.yaml
  text: When the Canaanite king of Arad[a], who lived in the Negev, heard that Israel was coming by the way of Atharim, he fought against Israel and took some of them captive.
translation:
  language: sw
  text: Mfalme Mkanaani wa Aradi[a], aliyekaa katika Negebu, aliposikia kwamba Israeli walikuwa wakija kwa njia ya Atharimu, alipigana na Israeli, akawateka baadhi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa njia ya Atharimu.” Maana ya “Atharimu” haijulikani kwa hakika; wengine hulielewa kuwa jina la mahali, na wengine, kwa kufuata tafsiri za kale, hulielewa kuwa “wapelelezi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: aliposikia
  rationale: Kitenzi שׁמע katika simulizi humaanisha kupokea habari; muundo wa Kiswahili “aliposikia” unaonyesha kwa kawaida mfuatano uliopelekea shambulio.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: Mfalme Mkanaani wa Aradi
  rationale: Hutambulisha mfalme kwa kabila au taifa lake na kwa eneo alilotawala; mpangilio huu ni wa kawaida na wazi katika Kiswahili.
- source_word: יֹשֵׁב הַנֶּגֶב
  choice: aliyekuwa akiishi Negebu
  rationale: Kishiriki יֹשֵׁב huonyesha makao ya kudumu. Jina la eneo Negebu limehifadhiwa badala ya kutafsiriwa kwa ujumla kuwa “kusini.”
- source_word: כִּי בָּא יִשְׂרָאֵל
  choice: kwamba Israeli walikuwa wakija
  rationale: כִּי huanzisha habari iliyosikiwa, na hali endelevu ya Kiswahili inaonyesha kwamba Israeli walikuwa njiani wakikaribia.
- source_word: דֶּרֶךְ הָאֲתָרִים
  choice: kwa njia ya Atharimu
  rationale: דֶּרֶךְ ni njia au barabara. Kwa kuwa אֲתָרִים halina maana ya hakika, limetoholewa kama jina linalowezekana la mahali na tofauti ya tafsiri imeelezwa katika tanbihi.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: alipigana na Israeli
  rationale: Muundo huu unaonyesha mapambano dhidi ya Israeli bila kudokeza kwa lazima ukubwa au muda wa vita.
- source_word: וַיִּשְׁבְּ מִמֶּנּוּ שֶׁבִי
  choice: na kuwateka baadhi yao
  rationale: שׁבה pamoja na שֶׁבִי huhusu kuchukua mateka vitani. “Kuwateka baadhi yao” ni Kiswahili cha kawaida kinachowasilisha maana ya sehemu ya kundi la Israeli.
theological_decisions:
- issue: Utambulisho wa הָאֲתָרִים
  choice: Atharimu kama jina linalowezekana la mahali
  alternative: wapelelezi au wapelelezi wa mbele
  rationale: Maana ya neno la Kiebrania si hakika. Kulihifadhi kama jina katika matini na kueleza uwezekano mwingine katika tanbihi huepuka kutatua kimyakimya utata wa chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina Aradi, Negebu, na Atharimu yametoholewa kufuatana na mfumo wa sauti wa Kiswahili. Umoja wa jina la pamoja “Israeli” umefuatwa na kitenzi cha wingi kwa sababu linarejelea watu.
