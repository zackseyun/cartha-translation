  yaml_path: translation/ot/numbers/021/008.yaml
  text: Then Yahweh said to Moses[a], “Make for yourself a fiery serpent and set it on a pole, and it shall be that everyone who is bitten, when he looks at it[b], shall live.”
translation:
  language: sw
  text: Kisha Yahwe akamwambia Musa, “Jitengenezee nyoka wa moto[a], na umweke juu ya mlingoti[b]. Kila aliyeumwa akimtazama ataishi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “serafi” au “kiumbe kinachowaka.” Neno la Kiebrania linaweza kumaanisha “anayewaka”; katika muktadha huu linarejelea nyoka.
    reason: lexical_alternative
  - marker: b
    text: Au, “nguzo ya ishara” au “bendera ya ishara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu lililo katika maandishi ya Kiebrania kwa umbo la Kiswahili linalosomeka kwa urahisi.
- source_word: עֲשֵׂה לְךָ
  choice: Jitengenezee
  rationale: Linawasilisha kwa njia ya kawaida ya Kiswahili amri ya ‘tengeneza kwa ajili yako,’ bila kuongeza kusudi lisilotajwa.
- source_word: שָׂרָף
  choice: nyoka wa moto
  rationale: Katika muktadha huu neno linarejelea nyoka na linabaki na taswira ya kuwaka au kuchoma inayopatikana katika neno la Kiebrania; ‘nyoka mwenye sumu’ lingeeleza athari kwa tafsiri zaidi.
- source_word: נֵס
  choice: mlingoti
  rationale: Ingawa neno linaweza kumaanisha ishara au bendera iliyoinuliwa, hapa linarejelea kitu kilichoinuliwa ambacho juu yake nyoka anawekwa; ‘mlingoti’ ni wazi na wa kawaida.
- source_word: הַנָּשׁוּךְ
  choice: kila mtu aliyeumwa
  rationale: Kivumishi-tendo cha Kiebrania kinatumika kwa maana ya jumla, nayo tafsiri hii ni ya kawaida katika Kiswahili.
- source_word: וְרָאָה אֹתוֹ
  choice: atakapomtazama
  rationale: ‘Kutazama’ linafaa zaidi kuliko kuona kwa bahati, na kiambishi cha wakati kinaonyesha kwa kawaida uhusiano wa sharti na matokeo uliomo katika mfululizo wa Kiebrania.
- source_word: וָחָי
  choice: ataishi
  rationale: Linatoa moja kwa moja matokeo yaliyoahidiwa bila kufafanua zaidi ikiwa ni kupona au kubaki hai.
theological_decisions:
- issue: Maana na taswira ya שָׂרָף
  choice: nyoka wa moto
  alternative: serafi; nyoka mwenye sumu; kiumbe kinachowaka
  rationale: Muktadha wa simulizi unaonyesha kuwa ni mfano wa nyoka unaohusiana na pigo la nyoka. ‘Nyoka wa moto’ linahifadhi taswira ya neno la Kiebrania bila kuingiza moja kwa moja maana ya kiumbe wa mbinguni au kufupisha taswira hiyo kuwa sumu pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa kwa mtiririko wa kawaida wa Kiswahili huku uhusiano wa amri, sharti, na matokeo ukihifadhiwa. Viambishi vya ngeli katika ‘umweke’ na ‘mtazama’ vinamrejelea nyoka.
