base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/029.yaml
  text: Woe to you[a], Moab! You are ruined, people of Chemosh! He has made his sons fugitives and his daughters captives to Sihon, king of the Amorites.
translation:
  language: sw
  text: Ole wako, Moabu! Umeangamia, enyi watu wa Kemoshi! Amewafanya wanawe[a] kuwa wakimbizi, na binti zake kuwa mateka wa Sihoni, mfalme wa Waamori.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wana wa Moabu kuwa wakimbizi, na binti wa Moabu kuwa mateka,” ikiwa viambishi vinachukuliwa kuwa vinarejelea Moabu badala ya Kemoshi.
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי לְךָ
  choice: Ole wako
  rationale: Tamko hili la maombolezo na tangazo la maafa linahifadhi nguvu ya kishairi ya wimbo wa dhihaka kwa Kiswahili cha kawaida.
- source_word: אָבַדְתָּ
  choice: Umeangamia
  rationale: Kitenzi kinaeleza kuanguka vibaya kabisa kwa Moabu; “umeangamia” ni cha moja kwa moja, chenye hadhi, na kinafaa katika muktadha huu wa kishairi.
- source_word: עַם כְּמוֹשׁ
  choice: enyi watu wa Kemoshi
  rationale: Muundo wa umilikaji unawatambulisha Wamoabu kuwa watu wanaohusishwa na Kemoshi; “enyi” huendeleza usemi wa moja kwa moja.
- source_word: נָתַן
  choice: Amewafanya
  rationale: Ingawa maana ya msingi ni “ametoa/amekabidhi,” hapa kitenzi kinaambatana na hali zinazotokea—wana kuwa wakimbizi na binti kuwa mateka. “Amewafanya” huwasilisha matokeo hayo kwa Kiswahili cha asili.
- source_word: בָּנָיו פְּלֵיטִם
  choice: wanawe kuwa wakimbizi
  rationale: Kiambishi cha umoja wa kiume kimehifadhiwa kwa kurejelea Kemoshi, huku פְּלֵיטִם ikionyesha waliokimbia baada ya kushindwa.
- source_word: וּבְנֹתָיו בַּשְּׁבִית
  choice: na binti zake kuwa mateka
  rationale: Tafsiri hii inadumisha ulinganifu wa kishairi na “wanawe kuwa wakimbizi” na kueleza wazi hali ya kuchukuliwa utumwani.
- source_word: לְמֶלֶךְ אֱמֹרִי סִיחוֹן
  choice: wa Sihoni, mfalme wa Waamori
  rationale: “Mateka wa Sihoni” huonyesha kwamba walikabidhiwa au wakaangukia mikononi mwake, na kirai cha pili kinamtambulisha kuwa mfalme wa Waamori.
theological_decisions:
- issue: Kirejelewa cha viambishi vya umoja wa kiume katika בָּנָיו na וּבְנֹתָיו
  choice: 'Viambishi vinarejelea Kemoshi: “wanawe” na “binti zake.”'
  alternative: 'Viambishi vinaweza kurejelea Moabu kwa maana ya pamoja: “wana wa Moabu” na “binti za Moabu.”'
  rationale: Kemoshi ndiye nomino ya umoja wa kiume iliyo karibu zaidi, na ushairi unaweza kumdhihaki kwa kuonyesha watu wake wakishindwa. Hata hivyo, uwezekano wa kurejelea Moabu umehifadhiwa katika tanbihi badala ya kutatuliwa kimya kimya.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Moabu, Kemoshi, Sihoni, na Waamori.'
