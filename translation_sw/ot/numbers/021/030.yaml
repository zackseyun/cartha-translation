base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/030.yaml
  text: And we shot at them[a]; Heshbon has perished as far as Dibon, and we laid waste as far as Nophah[b], which reaches to Medeba.
translation:
  language: sw
  text: Nasi tukawarushia mishale[a]; Heshboni ikaangamia mpaka Diboni, nasi tukaharibu mpaka Nofa[b], ambayo inaenea mpaka Medeba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno ya Kiebrania mwanzoni mwa mstari huu ni magumu na yameeleweka kwa njia mbalimbali, kama vile, “tukawaangusha” au “utawala wao ukaangamia.”
    reason: textual_variant
  - marker: b
    text: Kishazi kilichotafsiriwa “tukaharibu” pia hakina uhakika. Wengine hulielewa kwa namna tofauti, lakini muktadha wa wimbo huu wa ushindi unaunga mkono maana ya kuharibu.
    reason: textual_variant
lexical_decisions:
- source_word: וַנִּירָם
  choice: Nasi tukawapiga kwa mishale
  rationale: Neno hili la Kiebrania ni gumu na maana yake si hakika. Tafsiri hii hulihusisha na mzizi wa kupiga au kurusha kwa silaha, na huhifadhi taswira hai ya kijeshi katika wimbo wa ushindi.
- source_word: אָבַד
  choice: ikaangamia
  rationale: Kitenzi kina maana ya kuangamia au kuharibiwa; ‘ikaangamia’ ni Kiswahili cha kawaida kinachofaa kwa kauli ya kishairi kuhusu mji.
- source_word: חֶשְׁבּוֹן
  choice: Heshboni
  rationale: Jina la mahali limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: עַד דִּיבוֹן
  choice: mpaka Diboni
  rationale: עַד huonyesha kikomo au umbali uliofikiwa; ‘mpaka’ huwasilisha maana hiyo kwa njia ya kawaida.
- source_word: וַנַּשִּׁים
  choice: Tukaharibu
  rationale: Umbo la Kiebrania halina uhakika, lakini muktadha wa ushindi wa kijeshi unaunga mkono kitenzi cha kuharibu kuliko kulisoma kama nomino ‘wanawake’.
- source_word: עַד נֹפַח
  choice: mpaka Nofa
  rationale: ‘Mpaka’ huonyesha kiwango cha eneo, na Nofa ni jina la mahali lililotoholewa.
- source_word: אֲשֶׁר עַד מֵידְבָא
  choice: inayofika mpaka Medeba
  rationale: Kauli hii inadumisha kishazi tegemezi cha Kiebrania na kukieleza kiasili kama maelezo ya eneo linaloendelea hadi Medeba.
- source_word: מֵידְבָא
  choice: Medeba
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kiasili katika Kiswahili.
