lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma
  rationale: Ni tafsiri ya kawaida na ya asili ya kitenzi שׁלח katika mfululizo wa simulizi.
- source_word: לְרַגֵּל
  choice: kuipeleleza
  rationale: Huwasilisha uchunguzi wa kijeshi wa eneo bila kupunguza maana kuwa kutazama tu.
- source_word: יַעְזֵר
  choice: Yazeri
  rationale: Uhawilishaji unaofaa kwa matamshi na tahajia ya Kiswahili ya jina la mahali.
- source_word: וַיִּלְכְּדוּ
  choice: wakaiteka
  rationale: לכד katika muktadha wa kijeshi humaanisha kuteka au kushika kwa nguvu.
- source_word: בְּנֹתֶיהָ
  choice: miji yake midogo
  rationale: Ingawa neno kwa neno ni ‘binti zake,’ hapa ni nahau ya Kiebrania inayorejelea makazi au miji iliyo chini ya mji mkuu.
- source_word: וַיִּירַשׁ
  choice: kuwafukuza
  rationale: Katika muktadha wa ushindi, ירש inaweza kueleza kuwaondoa wakazi waliokuwapo ili kutwaa eneo; ‘kuwafukuza’ huonyesha wazi upande wa kuwaondoa.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Umoja wa kijumla wa Kiebrania hutafsiriwa kwa kawaida kama jina la watu katika wingi wa Kiswahili.
- source_word: אֲשֶׁר שָׁם
  choice: waliokuwa huko
  rationale: Ni Kiswahili cha kawaida kinachoonyesha Waamori waliokuwapo mahali hapo.
