base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/003.yaml
  text: And Yahweh heard the voice of Israel and gave the Canaanite over to them, and they devoted them and their cities to destruction. So the name of the place was called Hormah.
translation:
  language: sw
  text: Yahwe akasikia sauti ya Israeli, akawatia Wakanaani mikononi mwao; nao wakawaweka wao na miji yao wakfu kwa maangamizi. Kwa hiyo mahali hapo pakaitwa Horma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Horma linasikika kama neno la Kiebrania linalomaanisha “kuweka wakfu kwa maangamizi” au “kuweka chini ya marufuku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.” Tahajia “Yahwe” ni ya kawaida na yenye kueleweka katika Kiswahili.
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: akaisikiliza sauti ya
  rationale: Huhifadhi taswira ya Kiebrania ya ‘kusikia/kusikiliza sauti’ na pia huonyesha kwamba Yahwe aliitikia ombi la Israeli.
- source_word: וַיִּתֵּן אֶת־הַכְּנַעֲנִי
  choice: akawatia Wakanaani mikononi mwao
  rationale: Hii ni nahau ya asili ya Kiswahili inayoonyesha kuwakabidhi chini ya mamlaka yao. Wingi ‘Wakanaani’ unawakilisha nomino ya umoja yenye maana ya jamii nzima katika Kiebrania.
- source_word: וַיַּחֲרֵם
  choice: wakawaweka ... wakfu kwa maangamizi
  rationale: 'Huhifadhi maana mahsusi ya ḥerem: kutenga bila kubatilishwa kwa ajili ya kuangamizwa, badala ya kuifanya kuwa kauli ya jumla tu ya kushinda au kuharibu.'
- source_word: אֶתְהֶם וְאֶת־עָרֵיהֶם
  choice: wao pamoja na miji yao
  rationale: 'Huwasilisha wazi vitu viwili vilivyotendewa tendo hilo: watu na miji yao.'
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: mahali hapo pakaitwa
  rationale: Muundo usiotaja mtendaji hauamui kimya kimya ikiwa aliyetaja jina alikuwa Mungu, Israeli, au matumizi ya kawaida ya watu.
- source_word: חָרְמָה
  choice: Horma
  rationale: Jina la mahali limetoholewa, huku uhusiano wake wa kimatamshi na neno la Kiebrania la kuweka wakfu kwa maangamizi ukifafanuliwa katika tanbihi.
theological_decisions:
- issue: Istilahi ya חרם katika vita
  choice: wakawaweka wao pamoja na miji yao wakfu kwa maangamizi
  alternative: wakawaangamiza kabisa wao pamoja na miji yao
  rationale: Chaguo hili halifichi maangamizi, lakini pia huhifadhi wazo mahsusi la Kiebrania la kutenga au kuweka chini ya ḥerem, jambo ambalo ‘kuangamiza kabisa’ peke yake halionyeshi kikamilifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ya kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘pakaitwa’ umechaguliwa ili kutotaja mtendaji ambaye Kiebrania hakumfafanui.
