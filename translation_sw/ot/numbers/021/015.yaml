  text: na mteremko wa mabonde[a] unaoenea mpaka mahali ilipo Ari[b], na unaoegemea mpaka wa Moabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makorongo” au “njia za vijito vya msimu.” Neno la Kiebrania mara nyingi humaanisha mabonde ambamo maji hutiririka kwa msimu.
