lexical_decisions:
- source_word: אֶשֶׁד
  choice: mteremko
  rationale: Nomino hii huonyesha sehemu ya ardhi inayoteremka, hasa kando ya bonde au korongo; “mteremko” ni ya kawaida na inafaa maelezo haya ya kijiografia.
- source_word: הַנְּחָלִים
  choice: mabonde
  rationale: נְחָלִים inaweza kumaanisha mabonde, makorongo, au njia za maji zinazotiririka kwa msimu. “Mabonde” inaeleweka kwa urahisi katika Kiswahili, huku maana mahususi zaidi ikihifadhiwa katika tanbihi.
- source_word: אֲשֶׁר נָטָה
  choice: unaoenea
  rationale: Kitenzi נָטָה kinaweza kumaanisha kunyoosha, kuelekea, au kuenea. Katika maelezo ya eneo, “unaoenea” huwasilisha mwendelezo wa kijiografia kwa lugha ya kawaida.
- source_word: לְשֶׁבֶת עָר
  choice: mpaka mahali ilipo Ari
  rationale: Kirai hiki kigumu kinaweza kueleza mahali Ari ilipo au makao yake. Tafsiri hii ni ya kawaida katika Kiswahili na haifuti uwezekano mwingine, ambao umeonyeshwa katika tanbihi.
- source_word: עָר
  choice: Ari
  rationale: Ni jina la mahali; umbo “Ari” linafuata matamshi yanayofaa Kiswahili.
- source_word: וְנִשְׁעַן
  choice: na unaoegemea
  rationale: Kitenzi שׁען humaanisha kuegemea au kutulia juu ya kitu. “Unaoegemea” huhifadhi sitiari ya Kiebrania katika maelezo ya mpaka.
- source_word: לִגְבוּל מוֹאָב
  choice: mpaka wa Moabu
  rationale: גְּבוּל hapa hurejelea mpaka wa eneo; “mpaka wa Moabu” ni tafsiri ya moja kwa moja na ya kawaida.
