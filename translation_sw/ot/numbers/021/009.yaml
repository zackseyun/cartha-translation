base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/009.yaml
  text: So Moses made a bronze serpent and set it on the pole[a]. And it happened that if the serpent bit a man, and he looked at the bronze serpent[d][c][b], he lived.
translation:
  language: sw
  text: Musa akatengeneza nyoka wa shaba[a], akamweka juu ya nguzo[b]. Ikawa kwamba nyoka alipomwuma mtu[c], mtu huyo alimtazama nyoka wa shaba[d], akaishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyoka wa bronzi.” Neno la Kiebrania linalotaja metali linaweza kumaanisha shaba au bronzi.
    reason: lexical_alternative
  - marker: b
    text: Au “ishara” au “bendera.” Hapa neno hilo linamaanisha kitu kilichosimamishwa ambacho nyoka aliwekwa juu yake.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “mwanamume,” likitumika hapa kwa maana wakilishi kumaanisha mtu yeyote aliyeumwa.'
    reason: lexical_alternative
  - marker: d
    text: Tukio hili linarejelewa baadaye katika Yohana 3:14–15.
    reason: cross_reference
lexical_decisions:
- source_word: נְחַשׁ
  choice: nyoka
  rationale: Kiswahili cha kawaida hutumia “nyoka” kwa kiumbe na pia kwa mfano wake; ni cha asili na chenye heshima katika simulizi la Biblia.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Neno la Kiebrania linaweza kumaanisha shaba au bronzi. “Shaba” ni neno la kawaida la Kiswahili, huku uwezekano wa bronzi ukihifadhiwa katika tanbihi.
- source_word: הַנֵּס
  choice: mlingoti
  rationale: Katika muktadha huu ni kitu kilichosimamishwa ambacho nyoka aliwekwa juu yake; “mlingoti” ni ya asili kuliko “bendera,” ingawa neno la Kiebrania linaweza pia kumaanisha ishara au bendera.
- source_word: וְהָיָה
  choice: Ikawa kwamba
  rationale: Huhifadhi mpito wa kisimulizi na kuanzisha hali iliyofuata bila kutumia lugha ya kizamani kupita kiasi.
- source_word: אִם נָשַׁךְ הַנָּחָשׁ אֶת אִישׁ
  choice: nyoka alipomwuma mtu
  rationale: Muundo huu unaeleza hali inayojirudia kwa Kiswahili cha kawaida. “Mtu” huwasilisha matumizi wakilishi ya אִישׁ bila kudai kwamba waathiriwa walikuwa wanaume pekee.
- source_word: וְהִבִּיט אֶל
  choice: aliutazama
  rationale: “Kutazama” huonyesha kuelekeza macho kwenye kitu bila kuongeza maana ya kitheolojia ya kutumainia ambayo haijasemwa wazi katika Kiebrania.
- source_word: וָחָי
  choice: akaishi
  rationale: Hutoa matokeo ya moja kwa moja katika mfululizo wa kisimulizi; haibadili maana kuwa “akanusurika,” ambalo ni fasiri pana zaidi.
theological_decisions:
- issue: Lugha ya kiume yenye matumizi wakilishi katika אִישׁ
  choice: mtu
  alternative: mwanamume
  rationale: Ingawa אִישׁ ni umbo la kiume, katika sentensi hii linamwakilisha yeyote aliyeumwa. “Mtu” ni sahihi kwa maana hiyo katika Kiswahili na huepuka kudokeza kwamba ahadi iliwahusu wanaume pekee.
- issue: Uwezekano wa kusoma maana ya kiishara katika וְהִבִּיט אֶל
  choice: aliutazama
  alternative: alimtazamia / alimtegemea
  rationale: Andiko la Yohana 3:14–15 linarejelea tukio hili, lakini maana hiyo ya baadaye haijaingizwa katika kitenzi cha hapa. Tafsiri ya moja kwa moja huhifadhi utangulizi wa chanzo cha Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wazi, wa sasa na wenye heshima. Muundo “alipomwuma … aliutazama … akaishi” unaonyesha hali na matokeo yake kwa urahisi huku ukihifadhi maana ya Kiebrania.
