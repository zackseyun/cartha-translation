base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/007.yaml
  text: Then the people came to Moses and said[a], “We have sinned, for we have spoken against Yahweh and against you. Pray to Yahweh, that he may take away the serpent from us.” So Moses prayed for the people.
translation:
  language: sw
  text: Ndipo watu wakamjia Musa, wakasema, “Tumetenda dhambi, kwa sababu tumesema dhidi ya Yahwe na dhidi yako. Mwombe Yahwe atuondolee nyoka[a].” Basi Musa akawaombea watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kimetumia nomino ya umoja, ambayo inaweza kumaanisha nyoka mmoja au kuwakilisha kwa ujumla janga la nyoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: Ndipo watu wakamjia
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Ndipo” na “wakamjia” zinaonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: חָטָאנוּ
  choice: Tumetenda dhambi
  rationale: Kauli timilifu inaeleza tendo lililokamilika ambalo matokeo yake bado yanahusika katika ungamo lao.
- source_word: דִבַּרְנוּ בַיהוָה וָבָךְ
  choice: tumesema dhidi ya Yahwe na dhidi yako
  rationale: Kitenzi דִבֵּר pamoja na ב hapa kina maana ya kusema kwa uhasama dhidi ya mtu. Kurudia “dhidi ya” kunahifadhi ulinganifu wa vipashio viwili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu lililoandikwa kwa herufi YHWH limetafsiriwa moja kwa moja kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: הִתְפַּלֵּל אֶל יְהוָה
  choice: Mwombe Yahwe
  rationale: Kauli hii ina maana ya kusali au kuomba kwa Mungu; muktadha unaonyesha wazi kwamba Musa anaombwa awaombee watu.
- source_word: וְיָסֵר מֵעָלֵינוּ
  choice: atuondolee
  rationale: Hali ya utegemezi baada ya agizo la kuomba inaeleza yaliyomo katika ombi; “atuondolee” ni ya asili na pia huonyesha manufaa kwa waombaji.
- source_word: אֶת הַנָּחָשׁ
  choice: nyoka[a]
  rationale: נָחָשׁ ni “nyoka.” Kiebrania kimetumia umoja, ambao huenda unawakilisha kwa ujumla janga lote la nyoka; tanbihi inahifadhi uwezekano huo bila kuufanya kuwa hakika.
- source_word: וַיִּתְפַּלֵּל מֹשֶׁה בְּעַד הָעָם
  choice: Basi Musa akawaombea watu
  rationale: בְּעַד huonyesha kwamba Musa alisali kwa niaba ya watu; “akawaombea” ni usemi wa kawaida na sahihi kwa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania inatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Ikiwa Musa anaomba tu au anaombea kwa niaba ya watu
  choice: akawaombea watu
  alternative: akasali kwa ajili ya watu
  rationale: Kihusishi בְּעַד kinaonyesha wazi tendo la kusali kwa niaba ya wengine, bila kuingiza mafundisho zaidi ya yaliyo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaofaa simulizi la Maandiko. Kauli “tumesema dhidi ya” imechaguliwa ili kuhifadhi maana ya uhasama na ulinganifu wa Kiebrania, huku “akawaombea” ikitoa kwa kawaida maana ya maombezi.
