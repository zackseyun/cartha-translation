  text: כִּי אֵשׁ֙ יָֽצְאָ֣ה מֵֽ/חֶשְׁבּ֔וֹן לֶהָבָ֖ה מִ/קִּרְיַ֣ת סִיחֹ֑ן אָֽכְלָה֙ עָ֣ר מוֹאָ֔ב בַּעֲלֵ֖י בָּמ֥וֹת אַרְנֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/028.yaml
  text: For fire has gone out from Heshbon[a], a flame from the city of Sihon; it has consumed Ar of Moab[b], the lords of the high places of the Arnon.
translation:
  language: sw
  text: 'Kwa maana moto ulitoka Heshboni,

    mwali kutoka mji wa Sihoni;

    ukateketeza Ari ya Moabu,

    mabwana[b] wa mahali pa juu ya Arnoni.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miinuko ya Arnoni.” Maneno ya Kiebrania yanaweza kumaanisha mahali pa juu panapohusishwa na eneo la Arnoni au, kwa maana ya jumla zaidi, miinuko yake.
    reason: lexical_alternative
  - marker: b
    text: Au “wamiliki” au “wenye” mahali pa juu ya Arnoni. Neno la Kiebrania בַּעֲלֵי lina maana ya mabwana, wamiliki, au wenye kitu.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha kuwa mstari huu unatoa sababu au maelezo ya mstari uliotangulia.
- source_word: אֵשׁ יָצְאָה
  choice: moto ulitoka
  rationale: Inadumisha taswira halisi ya moto unaotoka mahali fulani na inafaa katika ushairi wa simulizi.
- source_word: מֵחֶשְׁבּוֹן
  choice: Heshboni
  rationale: Jina la mahali limetoholewa kwa mwandiko wa kawaida wa Kiswahili.
- source_word: לֶהָבָה
  choice: mwali
  rationale: Neno hili linadumisha ulinganifu wa kishairi na “moto” kwa lugha ya asili na ni la kawaida katika Kiswahili.
- source_word: מִקִּרְיַת סִיחֹן
  choice: kutoka mji wa Sihoni
  rationale: קִרְיָה ni nomino ya kawaida yenye maana ya mji; muundo wa umilikaji unaelezwa kwa kawaida kama “mji wa Sihoni.”
- source_word: אָכְלָה
  choice: ukateketeza
  rationale: Kitenzi cha Kiebrania kwa maana ya kula kinatumika hapa kama sitiari ya moto unaoharibu kabisa; “teketeza” ni ya asili katika Kiswahili.
- source_word: עָר מוֹאָב
  choice: Ari ya Moabu
  rationale: עָר inaeleweka hapa kama jina maalumu la mahali, Ari, wala si nomino ya kawaida “mji.”
- source_word: בַּעֲלֵי
  choice: mabwana
  rationale: Huhifadhi kwa ukaribu maana ya msingi ya wenye mamlaka, wamiliki, au mabwana bila kuibadili moja kwa moja kuwa “wakaaji.”
- source_word: בָּמוֹת
  choice: mahali pa juu
  rationale: Huhifadhi maana inayoweza kuwa maeneo ya juu yenye matumizi maalumu; uwezekano wa maana ya kijiografia “miinuko” umewekwa katika tanbihi.
- source_word: אַרְנֹן
  choice: Arnoni
  rationale: Jina la mto au bonde limetoholewa kwa muundo unaofaa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi ulio wazi na wenye heshima. Mpangilio wa mistari unadumisha ulinganifu wa “moto/mwali” na mwendo wa wimbo. Muundo usio wa kawaida kidogo wa “Ari ya Moabu, mabwana...” umeachwa bila kuongeza kiunganishi ili kutosuluhisha kimyakimya uhusiano wenye utata kati ya vishazi hivyo katika Kiebrania.
