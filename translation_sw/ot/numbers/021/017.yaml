  yaml_path: translation/ot/numbers/021/017.yaml
  text: 'Then Israel sang this song: “Spring up[a], O well! Answer it!”'
translation:
  language: sw
  text: 'Ndipo Israeli wakaimba wimbo huu:

    “Bubujika,[a] ewe kisima!

    Kiitikieni!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “Panda, ewe kisima! Kiitikieni!” Huenda maneno ya Kiebrania yanaonyesha namna ya kuimba kwa kuitikiana.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Kiunganishi cha wakati kinachoendeleza simulizi kwa njia ya kawaida na yenye hadhi.
- source_word: יָשִׁיר
  choice: wakaimba
  rationale: Ingawa umbo la Kiebrania ni imperfect, likifuatana na אָז hapa lina maana ya tendo lililotokea katika simulizi.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa linatumiwa kwa maana ya watu kwa pamoja; upatanisho wa wingi katika ‘wakaimba’ ni wa kawaida katika Kiswahili.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: wimbo huu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya nomino yenye kibainishi na kiashiria.
- source_word: עֲלִי
  choice: Bubujika
  rationale: Amri inaelekezwa kwa kisima; katika muktadha wa maji, ‘bubujika’ huonyesha maji yakipanda au kutoka kwa uhai zaidi kuliko ‘panda’.
- source_word: בְאֵר
  choice: ewe kisima
  rationale: ‘Ewe’ huonyesha wazi kuwa kisima kinazungumziwa moja kwa moja katika lugha ya kishairi.
- source_word: עֱנוּ לָהּ
  choice: Kiitikieni
  rationale: Kitenzi ענה kimsingi ni kuitika au kujibu; katika wimbo kinaweza kuashiria mwitikio wa waimbaji. ‘Kiitikieni’ huhifadhi wazo la kuitikia bila kulibana kuwa kuimba pekee.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari unahifadhi umbo la kishairi. ‘Bubujika’ ni usemi wa asili kwa kisima, huku tanbihi ikihifadhi maana rasmi zaidi ya ‘panda’ na uwezekano wa uimbaji wa kuitikiana.
