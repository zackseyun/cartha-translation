source:
  edition: WLC
  text: וְ/לֹא נָתַ֨ן סִיחֹ֣ן אֶת יִשְׂרָאֵל֮ עֲבֹ֣ר בִּ/גְבֻל/וֹ֒ וַ/יֶּאֱסֹ֨ף סִיחֹ֜ן אֶת כָּל עַמּ֗/וֹ וַ/יֵּצֵ֞א לִ/קְרַ֤את יִשְׂרָאֵל֙ הַ/מִּדְבָּ֔רָ/ה וַ/יָּבֹ֖א יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/023.yaml
  text: But Sihon did not allow Israel to pass through his territory[a]. So Sihon gathered all his people and went out to meet Israel in the wilderness[c][b]. He came to Jahaz and fought against Israel.
translation:
  language: sw
  text: Lakini Sihoni hakuwaruhusu Waisraeli wapite katika eneo lake[a]. Basi Sihoni akawakusanya watu wake wote[b], akatoka kwenda kukutana na Waisraeli nyikani. Akafika Yahasa[c] na kupigana na Waisraeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wapite ndani ya mipaka yake.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “watu wake wote.” Andiko halisemi wazi “jeshi lake,” ingawa muktadha unaonyesha kuwa walikusanywa kwa ajili ya vita.'
    reason: lexical_alternative
  - marker: c
    text: Jina Yahasa pia huandikwa “Yahazi” katika baadhi ya tafsiri.
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַן
  choice: hakuwaruhusu
  rationale: Katika muundo huu, kitenzi ambacho kwa kawaida humaanisha ‘kutoa’ kinatumika kwa maana ya kutoa ruhusa; ‘hakuwaruhusu’ ni Kiswahili cha kawaida na sahihi.
- source_word: עֲבֹר
  choice: wapite
  rationale: Hapa kitenzi hiki kinaeleza kusafiri kupitia nchi ya mwingine, si kuvuka mpaka mmoja tu.
- source_word: בִּגְבֻלוֹ
  choice: katika eneo lake
  rationale: Neno גְּבוּל linaweza kumaanisha mpaka au eneo lililo ndani ya mipaka. Muktadha unahusu kupita katika nchi ya Sihoni, hivyo ‘eneo lake’ huepuka dhana ya kusafiri kandokando ya mpaka tu.
- source_word: וַיֶּאֱסֹף ... אֶת כָּל עַמּוֹ
  choice: akawakusanya watu wake wote
  rationale: Kiebrania kinasema ‘watu wake wote,’ wala hakitaji jeshi moja kwa moja, ingawa muktadha ni wa kivita.
- source_word: לִקְרַאת יִשְׂרָאֵל
  choice: kukutana na Waisraeli
  rationale: Usemi huu kimsingi ni kwenda kukutana nao. Uadui unaelezwa wazi baadaye kwa kusema alipigana nao, kwa hiyo haujaingizwa mapema kwa neno kama ‘kuwashambulia.’
- source_word: הַמִּדְבָּרָה
  choice: nyikani
  rationale: Kiambishi elekezi cha Kiebrania kinaonyesha mwendo kuelekea nyikani; katika Kiswahili, mwendo huo unaeleweka kwa kitenzi ‘akaenda’ pamoja na ‘nyikani.’
- source_word: יָהְצָה
  choice: Yahasa
  rationale: Hili ni jina la mahali Yahazi/Yahasa, lenye kiambishi cha Kiebrania kinachoonyesha mwendo kuelekea huko. ‘Yahasa’ linafuata umbo linalojulikana katika mapokeo ya Kiswahili.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: na kupigana na Waisraeli
  rationale: Muundo wa Kiebrania unaeleza wazi mapigano dhidi ya Israeli; Kiswahili ‘kupigana na’ ni cha kawaida na huonyesha pande pinzani.
- source_word: וְלֹא
  choice: Lakini ... haku-
  rationale: Kiunganishi kinaonyesha tofauti na ombi lililotangulia la kuruhusiwa kupita, hivyo ‘Lakini’ linafaa katika mtiririko wa habari.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa lakini wenye heshima. ‘Waisraeli’ ni ya kawaida zaidi kwa wasomaji wa leo kuliko kulitumia jina ‘Israeli’ peke yake kwa kundi la watu. ‘Nyikani’ limechaguliwa badala ya ‘jangwani’ kwa kuwa eneo linalotajwa si lazima liwe jangwa la mchanga.
