base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/006.yaml
  text: So Yahweh sent among the people the fiery serpents[a], and they bit the people, and many from Israel died.
translation:
  language: sw
  text: Ndipo Yahwe akatuma nyoka wa moto[a] miongoni mwa watu. Nyoka hao wakawauma watu, na watu wengi wa Israeli wakafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyoka wenye sumu” au “nyoka wanaounguza.” Kiebrania kinasema kihalisi, “nyoka, wale wa moto.”
    reason: Neno la Kiebrania הַשְּׂרָפִים linaweza kueleza nyoka kwa taswira ya moto au athari inayounguza ya kuumwa kwao.
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: akatuma
  rationale: Kitenzi שׁלח katika mfululizo wa simulizi humaanisha moja kwa moja ‘kutuma’; ‘akatuma’ kinaendeleza mtiririko wa matukio kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: בָּעָם
  choice: miongoni mwa watu
  rationale: Kiambishi ב hapa kinaeleza mahali nyoka walipotumwa; ‘miongoni mwa watu’ ni sahihi na ya kawaida kuliko tafsiri ya kiufafanuzi ‘dhidi ya watu’.
- source_word: הַנְּחָשִׁים הַשְּׂרָפִים
  choice: nyoka wa moto
  rationale: ‘Nyoka’ hutafsiri נְחָשִׁים, na ‘wa moto’ huhifadhi taswira yenye utata ya שְּׂרָפִים bila kuifupisha moja kwa moja kuwa ‘wenye sumu.’ Maelezo ya chini yanatoa uwezekano mwingine.
- source_word: וַיְנַשְּׁכוּ
  choice: wakawauma
  rationale: נשׁך humaanisha kuuma, hasa kuumwa na nyoka; umbo hili linafaa katika simulizi.
- source_word: וַיָּמָת
  choice: wakafa
  rationale: מות ni kitenzi cha kawaida cha kufa; ‘wakafa’ ni wazi na hakiongezi ufafanuzi.
- source_word: עַם רָב מִיִּשְׂרָאֵל
  choice: watu wengi wa Israeli
  rationale: Kauli hii huwasilisha kwamba idadi kubwa ya watu kutoka au miongoni mwa Israeli walikufa, kwa Kiswahili fasaha na bila kurudia muundo wa Kiebrania kwa namna isiyo ya kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya הַשְּׂרָפִים katika muktadha huu
  choice: nyoka wa moto
  alternative: nyoka wenye sumu; nyoka wanaounguza
  rationale: ‘Wa moto’ huhifadhi taswira na utata wa neno la Kiebrania, ambalo huenda likaeleza athari inayowaka ya kuumwa. Tanbihi inaonyesha tafsiri za kiufafanuzi bila kulazimisha mojawapo katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ndipo’ na maumbo ya mfululizo yenye ‘aka-’ yanadumisha mwendo wa simulizi. Kurudiwa kwa ‘watu’ kumehifadhiwa kwa kiasi kinachofuata matini, huku ‘nyoka hao’ kikiongeza uwazi wa kawaida wa Kiswahili bila kubadili mhusika.
