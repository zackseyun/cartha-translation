  yaml_path: translation/ot/numbers/021/025.yaml
  text: Israel took all these cities[a], and Israel settled in all the cities of the Amorites, in Heshbon and in all its daughter towns.
translation:
  language: sw
  text: Israeli akatwaa miji hii yote, akakaa katika miji yote ya Waamori, katika Heshiboni na katika miji midogo yake yote iliyoitegemea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “na katika binti zake zote,” msemo unaomaanisha makazi au miji midogo inayohusiana na mji mkubwa na kuutegemea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ikaitwaa
  rationale: Kitenzi לקח kimsingi humaanisha ‘kutwaa’ au ‘kuchukua.’ Katika muktadha huu wa kijeshi, ‘ikaitwaa’ kinaonyesha ushindi bila kuongeza ufafanuzi usiotajwa wazi katika Kiebrania.
- source_word: כָּל הֶעָרִים הָאֵלֶּה
  choice: miji hii yote
  rationale: Neno עִיר linaweza kumaanisha mji mkubwa au mdogo; ‘miji’ ni tafsiri ya kawaida na inaendeleza wazi kiashiria ‘hii.’
- source_word: וַיֵּשֶׁב
  choice: ikakaa
  rationale: Kitenzi ישב kinaweza kumaanisha kukaa, kuishi, au kufanya makao. ‘Ikakaa’ ni cha kawaida na kinaacha upana huo wa maana bila kulazimisha wazo mahususi zaidi.
- source_word: בְּכָל עָרֵי הָאֱמֹרִי
  choice: katika miji yote ya Waamori
  rationale: Muundo huu unaonyesha miji iliyokuwa ya Waamori. ‘Waamori’ ni namna ya kawaida ya Kiswahili ya kutaja watu hao.
- source_word: בְּחֶשְׁבּוֹן
  choice: huko Heshboni
  rationale: Jina limetoholewa kwa tahajia inayofaa Kiswahili; ‘huko’ linafanya usemi wa mahali uwe wa kawaida bila kubadili maana.
- source_word: וּבְכָל בְּנֹתֶיהָ
  choice: na katika miji yake yote iliyoitegemea
  rationale: Kwa maana halisi ni ‘na katika binti zake zote,’ lakini huu ni msemo unaotaja makazi madogo yaliyokuwa chini ya mji mkuu. Tafsiri hii inaeleza uhusiano huo kwa Kiswahili cha kawaida huku tanbihi ikihifadhi taswira ya asili.
