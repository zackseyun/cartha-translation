  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּכֵּ֥/הוּ יִשְׂרָאֵ֖ל לְ/פִי חָ֑רֶב וַ/יִּירַ֨שׁ אֶת אַרְצ֜/וֹ מֵֽ/אַרְנֹ֗ן עַד יַבֹּק֙ עַד בְּנֵ֣י עַמּ֔וֹן כִּ֣י עַ֔ז גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/024.yaml
  text: Israel struck him with the edge of the sword and took possession of his land from the Arnon as far as the Jabbok[a], as far as the sons of Ammon, for the border of the sons of Ammon was strong.
translation:
  language: sw
  text: Israeli akampiga kwa makali ya upanga, akaitwaa nchi yake kutoka Arnoni mpaka Yaboki, hadi kwa Waamoni[a], kwa maana mpaka wa Waamoni ulikuwa imara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “wana wa Amoni”; hapa maana yake ni Waamoni, yaani watu wa Amoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּהוּ
  choice: akampiga
  rationale: Neno נכה kimsingi humaanisha kupiga. Tafsiri hii haiongezi kwa lazima wazo la kumuua, ingawa muktadha unaeleza ushindi wa kijeshi.
- source_word: לְפִי חָרֶב
  choice: kwa makali ya upanga
  rationale: Nahau ya Kiebrania ina taswira ya 'kinywa/makali ya upanga.' Kiswahili 'kwa makali ya upanga' huhifadhi taswira hiyo kwa lugha ya kawaida.
- source_word: וַיִּירַשׁ
  choice: akaitwaa
  rationale: Katika muktadha huu ירש hueleza kuchukua na kumiliki eneo baada ya ushindi. 'Akaitwaa' ni ya asili na haileti dhana isiyofaa ya kurithi.
- source_word: אַרְצוֹ
  choice: nchi yake
  rationale: Neno אֶרֶץ hapa ni eneo lililotawaliwa na mfalme huyo; 'nchi yake' ni tafsiri ya moja kwa moja na inayoeleweka.
- source_word: מֵאַרְנֹן עַד יַבֹּק
  choice: kutoka Arnoni mpaka Yaboki
  rationale: Muundo huu unaonyesha mipaka ya eneo. Majina yameandikwa kwa namna inayofaa mfumo wa sauti wa Kiswahili.
- source_word: עַד בְּנֵי עַמּוֹן
  choice: hadi kwa Waamoni
  rationale: Ingawa muundo halisi ni 'wana wa Amoni,' hapa una maana ya kikabila. 'Waamoni' ni Kiswahili cha kawaida, sahihi na kisicholeta hisia kwamba wanaume pekee ndio waliokusudiwa.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי inaleta sababu ya ushindi wa Israeli kuishia hapo; 'kwa maana' huonyesha uhusiano huo wa maelezo.
- source_word: עַז
  choice: imara
  rationale: עַז humaanisha yenye nguvu. Kwa mpaka unaozuia kusonga mbele, 'imara' ni ya asili bila kudai wazi kuwa ulikuwa umejengwa ngome.
- source_word: גְּבוּל
  choice: mpaka
  rationale: '''Mpaka'' ni tafsiri ya kawaida ya גְּבוּל katika muktadha wa mipaka ya nchi.'
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Kirai cha ukoo cha Kiebrania kinatumika kama jina la jamii nzima; umbo la kikabila 'Waamoni' ndilo la kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya kikabila ya בְּנֵי עַמּוֹן
  choice: Waamoni
  alternative: wana wa Amoni
  rationale: Kirai hicho kwa umbo ni 'wana wa Amoni,' lakini katika mstari huu kinaitaja jamii ya Amoni kwa ujumla. 'Waamoni' huhifadhi maana hiyo kwa Kiswahili cha kawaida; tanbihi inaonyesha umbo halisi la Kiebrania bila kudokeza kuwa wanaume pekee ndio wanaotajwa.
- issue: Nguvu ya mpaka wa Waamoni
  choice: mpaka wa Waamoni ulikuwa imara
  alternative: mpaka wa Waamoni ulikuwa wenye nguvu / umejengwa ngome
  rationale: Kiebrania kinasema mpaka ulikuwa עַז, 'imara/wenye nguvu,' lakini hakielezi wazi ikiwa sababu ilikuwa ngome, hali ya nchi, au ulinzi wa kijeshi. Tafsiri haibainishi jambo ambalo chanzo kimeacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. 'Akaitwaa nchi yake' ni fasaha na fupi katika simulizi la kijeshi. Majina Arnoni na Yaboki yamewekewa irabu za mwisho kwa matamshi ya kawaida ya Kiswahili. Tanbihi pekee imewekewa alama [a] katika matini.
