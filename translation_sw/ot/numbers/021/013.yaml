base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/013.yaml
  text: From there they set out and camped on the other side of the Arnon[a], which is in the wilderness that extends from the border of the Amorites, for the Arnon is the border of Moab[b], between Moab and the Amorites.
translation:
  language: sw
  text: Kutoka huko wakaondoka, wakapiga kambi ng’ambo ya Arnoni[a], katika jangwa linaloenea kutoka mpaka wa Waamori[b], kwa maana Arnoni ni mpaka wa Moabu, kati ya Moabu na Waamori.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upande mwingine wa Arnoni.” Usemi wa Kiebrania unaweza kumaanisha upande wa mbali au eneo lililo ng’ambo ya mpaka, kutegemea mtazamo.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “linalotoka katika mpaka wa Mwamori.” Maana yake ni kwamba jangwa hilo linaenea kutoka mpaka wa Waamori.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Kutoka huko
  rationale: Ni usemi wa kawaida unaoendeleza simulizi kutoka mahali palilotajwa kabla.
- source_word: נָסָעוּ
  choice: wakaondoka
  rationale: Katika simulizi za safari, kitenzi hiki huonyesha kuvunja kambi na kuanza safari; ‘wakaondoka’ ni cha kawaida na hueleweka wazi.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Huwasilisha kwa Kiswahili cha sasa tendo la kusimama na kufanya kambi.
- source_word: מֵעֵבֶר אַרְנוֹן
  choice: ng’ambo ya Arnoni
  rationale: ‘Ng’ambo ya’ huhifadhi maana ya upande mwingine au eneo lililo upande wa pili bila kulazimisha mtazamo mahususi.
- source_word: אֲשֶׁר בַּמִּדְבָּר הַיֹּצֵא מִגְּבוּל הָאֱמֹרִי
  choice: katika jangwa linaloenea kutoka mpaka wa Waamori
  rationale: Muundo huu unaeleza mahali pa kambi katika jangwa na kuwasilisha הַיֹּצֵא kwa maana ya kijiografia ya kuenea kutoka mpakani.
- source_word: גְּבוּל
  choice: mpaka
  rationale: Neno hili hapa ni mpaka wa eneo, na ‘mpaka’ ni tafsiri ya kawaida na sahihi katika Kiswahili.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Ingawa umbo la Kiebrania ni la umoja, linatumika kwa maana ya jamii nzima; wingi wa Kiswahili unafaa.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha maelezo yanayofafanua sababu ya maelezo ya kijiografia yaliyotangulia.
- source_word: אַרְנוֹן גְּבוּל מוֹאָב
  choice: Arnoni ni mpaka wa Moabu
  rationale: Sentensi isiyo na kitenzi katika Kiebrania inaeleza hali ya kijiografia; ‘ni’ huiwasilisha kwa kawaida.
- source_word: בֵּין מוֹאָב וּבֵין הָאֱמֹרִי
  choice: kati ya Moabu na Waamori
  rationale: Huhifadhi pande mbili zinazotenganishwa na mpaka huo.
