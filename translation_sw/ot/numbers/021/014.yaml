base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/014.yaml
  text: Therefore it is said in the Book of the Wars of Yahweh[a], “Waheb in Suphah[b], and the wadis of the Arnon.”
translation:
  language: sw
  text: 'Kwa hiyo, inasemwa katika Kitabu cha Vita vya Yahwe:


    “Wahebu[a] katika Sufa[b],

    na mabonde ya Arnoni.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania katika mstari huu ulionukuliwa hakieleweki waziwazi; baadhi hulielewa “Wahebu” kwa namna tofauti, hata kama sehemu ya kishazi cha kitenzi badala ya jina la mahali.
    reason: lexical_alternative
  - marker: b
    text: Au labda, “katika dhoruba,” ikiwa Sufa linaeleweka kama nomino ya kawaida badala ya jina la mahali.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Ni kiunganishi cha hitimisho au maelezo kinachoanzisha nukuu; “Kwa hiyo” ni cha kawaida na huhifadhi uhusiano wa kimantiki.
- source_word: יֵאָמַר
  choice: yasemwa
  rationale: Nifali ya אמר imetumiwa bila mtendaji maalumu kuanzisha nukuu. “Yasemwa” ni fupi, ya heshima, na inaonyesha kauli isiyo na mtendaji aliyetajwa.
- source_word: בְּסֵפֶר מִלְחֲמֹת יְהוָה
  choice: katika Kitabu cha Vita vya Yahwe
  rationale: Huhifadhi muundo wa jina la chanzo kinachojulikana, wingi wa “vita,” na jina binafsi la Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la Mungu YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: אֶת וָהֵב
  choice: Wahebu
  rationale: Neno hilo linaeleweka kwa uwezekano mkubwa kama jina la mahali, lakini mstari ni mgumu; kutafsiri jina kwa herufi za Kiswahili huepuka kulazimisha maana ya kitenzi isiyo na uhakika.
- source_word: בְּסוּפָה
  choice: katika Sufa
  rationale: Sufa limedumishwa kama jina la mahali kwa sababu muktadha wa kijiografia unaunga mkono uwezekano huo, huku maana mbadala ya “dhoruba” ikiwekwa katika tanbihi.
- source_word: וְאֶת הַנְּחָלִים
  choice: na mabonde
  rationale: נְחָלִים inaweza kumaanisha mabonde au mikondo ya maji ya msimu. “Mabonde” ni ya kawaida na yanafaa katika muktadha huu wa kijiografia bila kudai kuwapo kwa maji wakati wote.
- source_word: אַרְנוֹן
  choice: Arnoni
  rationale: Ni uhawilishaji wa jina la kijiografia Arnon katika umbo linalopatana na matumizi ya Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Kutumia “Yahwe” huhifadhi jina binafsi lililo katika Kiebrania badala ya kulibadilisha kuwa cheo, na ni umbo linalotambulika katika Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. Mpangilio wa kishairi umetumiwa kuonyesha nukuu kutoka chanzo cha kale. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
