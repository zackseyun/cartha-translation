  yaml_path: translation/ot/numbers/021/012.yaml
  text: From there they set out and camped by the Wadi Zered[a].
translation:
  language: sw
  text: Kutoka huko wakaondoka, wakapiga kambi katika bonde la Zeredi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika korongo la Zeredi” au “karibu na mkondo wa maji wa Zeredi.” Neno la Kiebrania naḥal linaweza kumaanisha wadi, bonde, korongo, au mkondo wa maji ambao mara nyingi huwa wa msimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Kutoka huko
  rationale: Huonyesha kuondoka katika eneo lililotajwa kabla na hudumisha mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: נָסָעוּ
  choice: wakaondoka
  rationale: Katika simulizi za safari, נסע humaanisha kuvunja kambi na kuendelea na safari; ‘wakaondoka’ ni ya asili na wazi katika muktadha huu.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Ni tafsiri ya kawaida na ya sasa ya חנה, ikihifadhi maana ya kusimama na kukaa kwa muda katika safari.
- source_word: בְּנַחַל
  choice: katika bonde la mto
  rationale: נחל inaweza kumaanisha bonde, korongo, au njia ya maji ya msimu. ‘Bonde la mto’ ni neno linaloeleweka kwa urahisi na linafaa kwa mandhari hii, huku tanbihi ikihifadhi upana wa maana.
- source_word: זָרֶד
  choice: Zeredi
  rationale: Ni jina la mahali; umbo ‘Zeredi’ linaendana na uhawilishaji wa majina ya kibiblia uliozoeleka katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa vitenzi mfululizo ‘wakaondoka, wakapiga’ unaakisi mwendo wa simulizi la Kiebrania kwa lugha ya asili ya Kiswahili.
