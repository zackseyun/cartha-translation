base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/005.yaml
  text: 'And the people spoke against God and against Moses: “Why have you brought us up out of Egypt to die in the wilderness? For there is no bread and no water[a], and we loathe this miserable bread.”'
translation:
  language: sw
  text: Watu wakasema dhidi ya Mungu na Musa, “Kwa nini umetupandisha kutoka Misri ili tufe jangwani? Kwa maana hakuna mkate wala maji, nasi tumechukizwa na mkate huu duni[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkate huu wa kudharauliwa” au “mkate huu usiofaa.” Kivumishi cha Kiebrania ni adimu na kinaonyesha dharau ya watu kwa chakula ambacho Mungu aliwapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר הָעָם בֵּאלֹהִים וּבְמֹשֶׁה
  choice: Watu wakasema dhidi ya Mungu na dhidi ya Musa
  rationale: Katika muktadha huu, דבר pamoja na ב ina nguvu ya kupinga, kwa kuwa maneno yanayofuata ni ya lawama. “Wakasema dhidi ya” huhifadhi maana hiyo bila kuongeza wazo kali zaidi lisilosemwa wazi.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: mmetupandisha kutoka Misri
  rationale: Kitenzi עלה katika kausativi humaanisha “kupandisha” au “kuleta juu.” Umbo la wingi “mmetupandisha” linadumisha namna watu wanavyowaelekezea Mungu na Musa lawama hiyo.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: ili tufe jangwani
  rationale: “Ili tufe” huonyesha kusudi au matokeo yanayodaiwa na watu, na “jangwani” ni tafsiri ya kawaida na ya asili ya מִדְבָּר katika muktadha huu.
- source_word: כִּי אֵין לֶחֶם וְאֵין מַיִם
  choice: Kwa maana hakuna mkate wala maji
  rationale: “Mkate” huhifadhi maana ya msingi ya לֶחֶם na urudiaji wake katika kishazi kinachofuata; “wala” huwasilisha kwa ufasaha urudiaji wa ukanushi wa Kiebrania.
- source_word: וְנַפְשֵׁנוּ קָצָה
  choice: nasi tumechukizwa na
  rationale: Ingawa muundo wa Kiebrania unasema kwa karibu “nafsi yetu imechukizwa,” Kiswahili cha kawaida hutumia kitenzi hiki kumaanisha kuchukia au kukirihishwa sana na kitu.
- source_word: בַּלֶּחֶם הַקְּלֹקֵל
  choice: mkate huu duni
  rationale: קְלֹקֵל ni kivumishi adimu chenye dharau, kinachoweza kueleza kitu duni, hafifu, au kisichofaa. “Huu” huleta kwa Kiswahili maana ya chakula kilichopo ambacho watu wanakidharau, ingawa kiashiria hicho hakijaandikwa kando katika Kiebrania.
theological_decisions:
- issue: Tabia ya maneno ya watu kwa Mungu na Musa
  choice: “wakasema dhidi ya Mungu na dhidi ya Musa” kama usemi wa upinzani na lawama
  alternative: “wakasema na Mungu na Musa” au “wakasema kuhusu Mungu na Musa”
  rationale: Maneno yanayonukuliwa ni ya mashtaka na chuki; tafsiri isiyoegemea upande wowote ingepunguza nguvu ya uasi unaoonekana katika muktadha. Huu ni uamuzi wa kileksia unaotegemea muktadha, si nyongeza ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Urudiaji wa “mkate” umehifadhiwa ili kuakisi urudiaji wa לֶחֶם katika Kiebrania, na alama ya tanbihi imewekwa baada ya kirai ambacho tanbihi yake inafafanua.
