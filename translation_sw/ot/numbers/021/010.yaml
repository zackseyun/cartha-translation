translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa orodha ya hatua za safari. Alama ya tanbihi imewekwa baada ya jina la mahali kulingana na mpangilio wa safu ya mashauriano, ingawa tanbihi yenyewe inafafanua kirai “wana wa Israeli.”
