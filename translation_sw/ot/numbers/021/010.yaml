  text: Then the sons of Israel set out and camped at Oboth[a].
translation:
  language: sw
  text: Kisha wana wa Israeli[a] wakaondoka, wakapiga kambi huko Obothi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli.” Pia inaweza kusemwa “Waisraeli” au “watoto wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: wakaondoka
  rationale: Katika simulizi la hatua za safari jangwani, נסע humaanisha kuondoka kambini na kuendelea na safari. “Wakaondoka” ni Kiswahili cha kawaida na huonyesha mwanzo wa hatua inayofuata.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Kirai hiki kwa halisi ni “wana wa Israeli” na hapa ni jina la pamoja la taifa. Tafsiri hii huhifadhi namna ya usemi wa Kiebrania bila kubadili kuwa istilahi nyingine.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה ni neno la kawaida la kuweka kambi katika simulizi za safari jangwani. “Kupiga kambi” ni usemi wa sasa, wa kawaida na unaoeleweka wazi.
- source_word: בְּאֹבֹת
  choice: huko Obothi
  rationale: אֹבֹת ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa. “Huko” linafaa kwa mahali pa kufikia na kupiga kambi; “Obothi” hufuata tahajia inayosomeka kwa Kiswahili huku ikihifadhi jina la Kiebrania.
- source_word: וַ
  choice: Kisha / waka-
  rationale: Waw ya usimulizi inaendeleza mfuatano wa matukio. “Kisha” pamoja na viambishi vya mfululizo “waka-” huwasilisha mwendelezo huo kwa Kiswahili cha asili.
