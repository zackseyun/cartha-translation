  text: They set out from Oboth and camped at Iye-abarim in the wilderness that is opposite Moab[a], toward the sunrise.
translation:
  language: sw
  text: Wakaondoka Obothi, wakapiga kambi Iye-Abarimu[a], katika nyika iliyo mkabala na Moabu, upande wa mashariki wa Moabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Iye-Abarimu linaweza pia kueleweka kwa maana ya “magofu ya Abarimu” au “vilundo vya Abarimu,” ingawa hapa linatumika kama jina la mahali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika orodha za hatua za safari, kitenzi hiki humaanisha kuvunja kambi na kuanza safari; “wakaondoka” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: מֵאֹבֹת
  choice: Obothi
  rationale: Ni jina la mahali; limetoholewa kwa tahajia inayosomeka kwa Waswahili badala ya kutafsiriwa.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Hutoa kwa lugha ya kawaida maana halisi ya kukaa mahali kwa kambi.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: huko Iye-abarimu
  rationale: Kirai hiki kinafanya kazi kama jina la mahali katika ratiba ya safari. Kiambishi “huko” kinaonyesha wazi mahali bila kubadili jina.
- source_word: בַּמִּדְבָּר
  choice: katika nyika
  rationale: “Nyika” hufaa kwa eneo kame lisilokaliwa sana na huepuka kudokeza lazima jangwa la mchanga.
- source_word: אֲשֶׁר עַל־פְּנֵי מוֹאָב
  choice: iliyo mkabala na Moabu
  rationale: Katika maelezo ya kijiografia, kirai hiki humaanisha eneo linaloelekeana na Moabu.
- source_word: מִמִּזְרַח הַשָּׁמֶשׁ
  choice: upande wa mashariki
  rationale: Kirai cha Kiebrania kinahusisha mawio ya jua na katika muktadha huu kinaonyesha upande wa mashariki; tafsiri hii ni wazi na ya kawaida kwa Kiswahili.
