  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּכּ֨וּ אֹת֤/וֹ וְ/אֶת בָּנָי/ו֙ וְ/אֶת כָּל עַמּ֔/וֹ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִ֑יד וַ/יִּֽירְשׁ֖וּ אֶת אַרְצֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/035.yaml
  text: So they struck him down[a], and his sons, and all his people, until he had no survivor left[b]; and they took possession of his land.
translation:
  language: sw
  text: Basi wakampiga, pamoja na wanawe na watu wake wote, mpaka asibaki kwake mwokokaji yeyote; kisha wakaitwaa nchi yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: wakampiga
  rationale: Katika muktadha wa vita, נכה humaanisha kupiga au kushinda, mara nyingi kwa nguvu inayoua. “Wakampiga” huhifadhi picha halisi ya kitenzi bila kuongeza moja kwa moja kwamba walimuua, ingawa kifungu kinachofuata kinaonyesha maangamizi kamili.
- source_word: אֹתוֹ
  choice: yeye
  rationale: Kiwakilishi hiki ni yambwa kinachomrejelea Ogu, mfalme aliyetajwa katika mstari uliotangulia. “Yeye” baada ya “wakampiga” kinakazia kwamba Ogu mwenyewe alipatwa na pigo hilo.
- source_word: בָּנָיו
  choice: wanawe
  rationale: בנים ni wingi wa kiume na hapa humaanisha wana wa kiume; “wanawe” huhifadhi umahususi huo bila kuugeuza kuwa “watoto wake.”
- source_word: כָּל עַמּוֹ
  choice: watu wake wote
  rationale: עם kwa kawaida ni “watu.” Katika simulizi hili la ushindi, neno hilo ni pana kuliko jeshi peke yake na linawahusu watu waliokuwa chini ya utawala wake.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: mpaka hawakumwachia mtu yeyote aliyeokoka
  rationale: Muundo wa Kiebrania ni karibu na “mpaka hakumwachia aliyenusurika.” Kiswahili kimetumia kiima cha wingi kinachoeleweka kuwa washindi, huku kikihifadhi maana ya kutobaki kwa mwokokaji hata mmoja.
- source_word: שָׂרִיד
  choice: mtu yeyote aliyeokoka
  rationale: Katika mazingira ya vita, “aliyeokoka” ni ya kawaida na wazi zaidi kuliko “mabaki,” ambalo lingeweza kusikika kama kundi la kitheolojia au kitu kisicho mtu.
- source_word: וַיִּירְשׁוּ
  choice: wakaitwaa
  rationale: ירשׁ hapa inaeleza kuchukua na kumiliki eneo baada ya ushindi. “Wakaitwaa” ni Kiswahili cha kawaida kinachoonyesha kupata mamlaka juu ya nchi hiyo bila kudokeza urithi wa amani.
- source_word: אַרְצוֹ
  choice: nchi yake
  rationale: אֶרֶץ hapa ni eneo lililotawaliwa na Ogu. “Nchi yake” ni tafsiri pana, ya kawaida, na inayofaa muktadha.
theological_decisions:
- issue: Kiima cha הִשְׁאִיר katika kauli kuhusu aliyenusurika
  choice: hawakumwachia mtu yeyote aliyeokoka
  alternative: hakubaki kwake mtu yeyote aliyeokoka
  rationale: Kiebrania kinaweza kueleweka kwa kiima kisichotajwa wazi, huku muktadha ukiwaelekeza washindi. Chaguo la maandishi linafuata mtiririko wa kiima cha wingi bila kubadili maana ya maangamizi kamili; mbadala ungehifadhi zaidi hali isiyo ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi inafuata mwendo wa simulizi la Kiebrania na inaepuka istilahi nzito au za kimadhehebu.
