lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma
  rationale: Kitenzi hiki chenye waw ya usimulizi kinaendeleza mfululizo wa matukio; “akatuma” ni njia ya kawaida ya Kiswahili ya kuonyesha hatua inayofuata.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina hili hapa linarejelea taifa/watu wa Israeli; umbo la kawaida la Kiswahili limetumiwa.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu wa mawasiliano kati ya taifa na mfalme, neno hili linamaanisha wajumbe wa kibinadamu, si malaika.
- source_word: אֶל
  choice: kwa
  rationale: Kihusishi hiki kinaonyesha mtu aliyelengwa na ujumbe; “kwa” ni cha kawaida katika Kiswahili pamoja na kitenzi “kutuma.”
- source_word: סִיחֹן
  choice: Sihoni
  rationale: Jina la mtu limetolewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: mfalme wa Waamori
  rationale: Muundo huu unaonyesha kwamba Sihoni alikuwa mfalme wa watu wa Waamori; tafsiri hii ni wazi na ya asili kwa Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Neno hili linatanguliza maneno ya moja kwa moja yanayofuata; “akisema” hudumisha mwendelezo wa usimulizi.
