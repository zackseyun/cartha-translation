  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Majina “Hori,” “Shamu,” na “Edomu” yametumiwa kwa namna inayotambulika katika mapokeo ya Biblia ya Kiswahili. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi bila kupoteza uhusiano wa matukio.
