base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/004.yaml
  text: Then they set out from Mount Hor by the way of the Red Sea[a], to go around the land of Edom[b], and the people became impatient on the way.
translation:
  language: sw
  text: Kisha wakaondoka kutoka Mlima Hori kwa njia ya Bahari ya Shamu[a], ili kuizunguka nchi ya Edomu. Nao watu wakakata tamaa njiani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “kwa njia ya Bahari ya Matete.” Kiebrania: yam suph.'
    reason: lexical_alternative
  - marker: b
    text: Au “watu wakakosa subira njiani.” Nahau ya Kiebrania inaweza kumaanisha kukata tamaa, kuvunjika moyo, au kukosa subira.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: wakaondoka
  rationale: Katika simulizi za safari jangwani, kitenzi נסע humaanisha kung'oa kambi na kuanza hatua nyingine ya safari; “wakaondoka” ni Kiswahili cha kawaida kinachowasilisha maana hiyo.
- source_word: מֵהֹר הָהָר
  choice: kutoka Mlima Hori
  rationale: Hili ni jina la mahali; “Mlima Hori” linafuata muundo wa kawaida wa majina ya milima katika Kiswahili.
- source_word: דֶּרֶךְ יַם סוּף
  choice: kwa njia ya kuelekea Bahari ya Shamu
  rationale: דֶּרֶךְ hapa ni njia au barabara inayoelekea upande wa יַם־סוּף. “Bahari ya Shamu” ni jina la jadi linalotambulika katika Kiswahili, huku maana mbadala ya “Bahari ya Matete” ikihifadhiwa katika tanbihi.
- source_word: לִסְבֹב
  choice: ili kuizunguka
  rationale: Infinitivu hii inaonyesha kusudi la kuchukua njia hiyo, yaani kuizunguka au kuipita Edomu badala ya kuvuka eneo lake.
- source_word: אֶת אֶרֶץ אֱדוֹם
  choice: nchi ya Edomu
  rationale: אֶרֶץ pamoja na jina la eneo au taifa kwa kawaida hurejelea nchi au eneo lake; “nchi ya Edomu” ni wazi na ya asili.
- source_word: וַתִּקְצַר נֶפֶשׁ הָעָם
  choice: watu wakakata tamaa
  rationale: Nahau קצר נפש huonyesha moyo au uvumilivu kufifia chini ya taabu. Katika muktadha huu “wakakata tamaa” ni ya asili na huhifadhi hali ya kuvunjika moyo, huku maana ya kukosa subira ikitajwa katika tanbihi.
- source_word: בַּדָּרֶךְ
  choice: njiani
  rationale: בְּ pamoja na דֶּרֶךְ inaweza kumaanisha mahali au mazingira ya tukio, “njiani”; uwezekano wa maana ya kisababishi, “kwa sababu ya njia,” haujalazimishwa katika matini.
