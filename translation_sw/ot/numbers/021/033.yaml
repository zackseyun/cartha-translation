base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/033.yaml
  text: Then they turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet them, he and all his people, for battle at Edrei.
translation:
  language: sw
  text: Kisha wakageuka, wakapanda kwa njia ya Bashani. Ogu, mfalme wa Bashani, akatoka kukutana nao[a], yeye pamoja na watu wake wote, kwa vita huko Edrei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwakabili.” Usemi wa Kiebrania unaweza kumaanisha tu kukutana na mtu, lakini hapa maneno “kwa vita” yanaonyesha kuwa walikutana kama maadui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: wakageuka
  rationale: Kitenzi פנה katika mfululizo huu wa masimulizi kinaonyesha kubadili mwelekeo; “wakageuka” ni kifupi na cha kawaida.
- source_word: וַיַּעֲלוּ
  choice: wakapanda
  rationale: עלה huhifadhi maana ya kwenda juu au kupanda, inayoweza kuwa ya mwelekeo au jiografia.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: kwa njia ya Bashani
  rationale: Tafsiri hii inahifadhi usemi wa Kiebrania unaotaja njia inayohusishwa na eneo la Bashani bila kulazimisha zaidi ikiwa ni njia ya kwenda huko au inayopita huko.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Ogu, mfalme wa Bashani
  rationale: Jina limetoholewa kwa umbo linalosomeka katika Kiswahili, na cheo chake kimetolewa kwa uwazi kama kirai kiambatani.
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: יצא maana yake ya msingi ni kutoka; muktadha wa vita unaonyesha kusudi bila kuhitaji kuongeza wazo la kuandamana kijeshi.
- source_word: לִקְרָאתָם
  choice: kukutana nao
  rationale: Kirai hiki kimsingi humaanisha kwenda kukutana na mtu na chenyewe kinaweza kuwa cha kawaida; uhasama unawekwa wazi na kirai kinachofuata kuhusu kupigana.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: yeye pamoja na watu wake wote
  rationale: עם ni “watu”; “jeshi” lingeongeza umahususi wa kijeshi ambao hauko wazi katika neno lenyewe.
- source_word: לַמִּלְחָמָה
  choice: ili kupigana nao
  rationale: Kirai kinaonyesha kusudi la mapambano; Kiswahili hiki ni cha kawaida na kinaweka wazi uhusiano na Waisraeli bila kubadili maana.
- source_word: אֶדְרֶעִי
  choice: huko Edrei
  rationale: Jina la mahali limetoholewa, na “huko” linaonyesha mahali pa mapambano bila kulazimisha maana ya kuelekea huko.
