base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/020.yaml
  text: But if you have gone astray while under your husband[a], and if you have become defiled[c][b], and a man has lain with you besides your husband—
translation:
  language: sw
  text: Lakini ikiwa umepotoka ukiwa chini ya mume wako[a], na ikiwa umenajisika, na mwanamume asiye mume wako amelala nawe[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umekosa kuwa mwaminifu kwa mume wako.” Kiebrania kinasema kihalisi “umepotoka chini ya mume wako,” nahau inayohusu kifungo cha ndoa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “mwanamume ameweka ndani yako ulalaji wake,” usemi wa staha unaomaanisha kujamiiana.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂטִית
  choice: umepotoka
  rationale: Kitenzi hiki kinaendeleza sitiari ya kuacha njia inayofaa; katika muktadha huu kinadokeza kuvunja uaminifu wa ndoa bila kufanya dokezo hilo kuwa tafsiri pekee.
- source_word: תַּחַת אִישֵׁךְ
  choice: ukiwa chini ya mume wako
  rationale: Huhifadhi kwa kiasi kikubwa nahau ya Kiebrania inayohusu kifungo au hali ya ndoa, ingawa Kiswahili cha kawaida huhitaji ufafanuzi katika tanbihi.
- source_word: נִטְמֵאת
  choice: umejitia unajisi
  rationale: Huwasilisha unajisi wa kingono katika muktadha wa sheria na ibada. Muundo wa hali timilifu unaonyesha hali iliyotokea kwa tendo linalotajwa baadaye.
- source_word: וַיִּתֵּן אִישׁ בָּךְ אֶת שְׁכָבְתּוֹ
  choice: mwanamume mwingine ... amelala nawe
  rationale: Ni usemi wa staha unaoeleweka katika Kiswahili kwa kujamiiana na unaakisi taswira ya mzizi wa Kiebrania bila kutumia tafsiri halisi isiyo ya kawaida.
- source_word: מִבַּלְעֲדֵי אִישֵׁךְ
  choice: ambaye si mume wako
  rationale: 'Huonyesha wazi maana ya kutengwa: mwanamume anayehusika ni mwingine, si mume wake.'
theological_decisions:
- issue: Kutoa maana ya kukosa uaminifu wa ndoa bila kusema zaidi ya Kiebrania
  choice: umepotoka ukiwa chini ya mume wako
  alternative: umekosa kuwa mwaminifu kwa mume wako
  rationale: Chaguo hili huhifadhi sitiari ya kupotoka na pia nahau ya kifungo cha ndoa; kishazi kinachofuata kinaweka wazi kwamba muktadha ni wa mahusiano ya kingono.
- issue: Kuhifadhi lugha ya staha ya tendo la kingono
  choice: amelala nawe
  alternative: amefanya ngono nawe
  rationale: Kiebrania chenyewe kinatumia usemi wa staha. Kiswahili hiki ni cha asili na kinaeleweka bila kuongeza ukali ambao haupo katika muundo wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kiapo unaendelea na mstari unaofuata, kwa hiyo em dash imehifadhiwa mwishoni.
