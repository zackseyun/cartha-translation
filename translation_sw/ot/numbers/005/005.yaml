lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Kitenzi דבר katika fomula ya usemi wa Mungu kinaweza kutafsiriwa kwa Kiswahili cha kawaida kuwa “akasema”; umbo la simulizi la וַ־ linaendeleza tukio na kuanzisha sehemu mpya ya usemi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA,” ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: אֶל
  choice: na
  rationale: Baada ya kitenzi “sema,” Kiswahili sanifu hutumia kwa kawaida “sema na [mtu]” kumtaja anayeambiwa; hili ni badiliko la kimuundo lenye maana sawa na אֶל.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ni umbo la jina hili lililozoeleka katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: “Akisema” huhifadhi fomula ya Kiebrania inayotanguliza maneno yanayofuata, ingawa katika Kiswahili pia ingewezekana kutumia alama ya nukta mbili.
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini inatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo; “Yehova” ni umbo la kimapokeo lisiloakisi kwa usahihi uleule ushahidi wa matamshi ya kale.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “akasema na Musa, akisema” unahifadhi marudio ya fomula ya Kiebrania na kuonyesha kwamba ujumbe unaanza katika mstari unaofuata.
