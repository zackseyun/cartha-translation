  yaml_path: translation/ot/numbers/005/016.yaml
  text: Then the priest shall bring her near and make her stand before Yahweh[a].
translation:
  language: sw
  text: Kisha kuhani atamleta karibu na atamsimamisha mbele ya Yahwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH.” Kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיב אֹתָהּ
  choice: atamleta karibu
  rationale: Hifili ya קרב ina maana ya kumleta mtu karibu. Tafsiri hii inadumisha maana ya mahali katika muktadha huu bila kuifanya kuwa istilahi ya kiibada isiyohitajika.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hii ndiyo tafsiri ya kawaida na ya wazi ya כֹּהֵן katika muktadha wa sheria na ibada.
- source_word: וְהֶעֱמִדָהּ
  choice: kumsimamisha
  rationale: 'Hifili ya עמד ni ya kusababisha: kumfanya asimame. ''Kumsimamisha'' ni Kiswahili cha asili kinachohifadhi maana hiyo.'
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Usemi 'mbele za' unaonyesha kuwa mwanamke anasimamishwa katika uwepo wa Yahwe, na ni wa asili katika Kiswahili sanifu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kama 'Yahwe' kwa tahajia ya Kiswahili, badala ya kubadilishwa na cheo kama 'BWANA'.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja tetragramatoni YHWH. 'Yahwe' huhifadhi jina hilo la pekee kwa tahajia ya Kiswahili, huku tanbihi ikieleza mapokeo mengine ya kulitafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye hadhi. Muundo wa sentensi unadumisha vitenzi viwili vya kusababisha vilivyomo katika Kiebrania.
