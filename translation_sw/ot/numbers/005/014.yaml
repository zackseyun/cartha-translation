base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/014.yaml
  text: and a spirit of jealousy comes over him[a], and he is jealous of his wife, and she has defiled herself; or if a spirit of jealousy comes over him, and he is jealous of his wife, though she has not defiled herself[b],
translation:
  language: sw
  text: na roho ya wivu ikimjia, naye akawa na wivu juu ya mke wake, na mke wake ametiwa unajisi; au roho ya wivu ikimjia, naye akawa na wivu juu ya mke wake, ingawa mke wake hakutiwa unajisi[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na mke wake hakutiwa unajisi.” Kiunganishi cha Kiebrania ni “na”; “ingawa” katika matini kuu kinaonyesha tofauti kati ya hali hizi mbili za kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר עָלָיו
  choice: ikimjia
  rationale: Nahau hii inaeleza msukumo au hali ya ndani inayomjia na kumtawala mtu. “Ikimjia” ni Kiswahili cha kawaida kinachodumisha mwendo wa usemi wa Kiebrania bila tafsiri ngumu ya neno kwa neno.
- source_word: רוּחַ קִנְאָה
  choice: roho ya wivu
  rationale: רוּחַ hapa ina maana ya msukumo au hali inayomtawala mtu, na קִנְאָה katika muktadha huu ni wivu wa kindoa. “Roho ya wivu” inadumisha taswira na uwezekano wa maana wa asili.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: naye akawa na wivu juu ya mke wake
  rationale: Piel ya קנא inaonyesha mwitikio wa mume wa kuwa na wivu. “Akawa na wivu juu ya mke wake” ni ya asili na inaonyesha tukio linalofuata kuingiwa na roho ya wivu.
- source_word: נִטְמָאָה
  choice: amejitia unajisi
  rationale: Kitenzi hiki ni lugha ya unajisi. Katika sheria hii kinahusu hasa kosa la kingono linaloshukiwa; “amejitia unajisi” huhifadhi mwingiliano wa maana za kimaadili na kiibada pamoja na hali ya kujitendea.
- source_word: אוֹ
  choice: au
  rationale: Neno hili linaanzisha hali nyingine mbadala katika sheria. Muundo wa Kiswahili unaofuata unaifanya hali hiyo ionekane wazi bila kuongeza “ikiwa” isiyomo moja kwa moja katika Kiebrania.
- source_word: וְהִיא לֹא נִטְמָאָה
  choice: ingawa mke huyo hakujitia unajisi
  rationale: Kiunganishi cha Kiebrania ni “na,” lakini hapa kinaweka hali inayokinzana ambapo wivu wa mume hauna msingi. “Ingawa” hufanya ulinganifu huo uwe wazi katika Kiswahili; tanbihi huhifadhi muundo wa moja kwa moja.
theological_decisions:
- issue: Asili ya lugha ya unajisi katika sheria ya tuhuma za uzinzi
  choice: Kutafsiri נִטְמָאָה kuwa “amejitia unajisi”
  alternative: amekuwa najisi; amenajisiwa
  rationale: Muktadha unahusu ukosefu wa uaminifu katika ndoa unaoshukiwa, si uchafu wa kiibada tu. Usemi huu huhifadhi mwingiliano wa maana za kimaadili na kiibada bila kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Mstari unaendelea kisarufi kutoka mstari uliotangulia, kwa hiyo umeanza kwa “na” na kuishia kwa koma. “Roho ya wivu” imehifadhiwa badala ya kuifafanua tu kuwa hisia ili kutohitimisha mapema utata wa רוּחַ.
