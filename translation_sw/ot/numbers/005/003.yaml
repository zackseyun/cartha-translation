base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/003.yaml
  text: From male to female you shall send them outside the camp[a]; you shall send them out so that they may not defile their camp[b], in the midst of which I dwell.
translation:
  language: sw
  text: Kuanzia wa kiume hadi wa kike, mtawapeleka nje ya kambi; mtawapeleka nje ili wasitie unajisi kambi zao[a], ambamo ninakaa katikati yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina umoja katika “nje ya kambi,” lakini wingi katika “kambi zao”; huenda wingi huo unarejelea sehemu au makundi mbalimbali ya kambi.
    reason: lexical_alternative
  - marker: b
    text: Kauli ya Kiebrania inaweza kumaanisha kwamba Mungu anakaa katikati ya kambi hizo au katikati ya watu wanaohusishwa nazo.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזָּכָר עַד נְקֵבָה
  choice: Wote, wa kiume na wa kike
  rationale: Kirai cha Kiebrania kinataja kwa namna jumuishi watu wote kuanzia wa kiume hadi wa kike. Kiswahili hiki ni cha asili na kinaendeleza utofautishaji wa kibayolojia wa maneno ya chanzo.
- source_word: תְּשַׁלֵּחוּ / תְּשַׁלְּחוּם
  choice: mtawapeleka ... mtawapeleka nje
  rationale: Kurudiwa kwa kitenzi cha Kiebrania kumehifadhiwa ili kudumisha msisitizo, bila kuongeza wazo la adhabu linaloweza kudokezwa na ‘kuwafukuza.’
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha kupelekwa kuvuka mpaka wa kambi.
- source_word: יְטַמְּאוּ
  choice: wasizitie unajisi
  rationale: ‘Kutia unajisi’ huhifadhi maana ya hali ya kutokuwa safi kwa mujibu wa taratibu za ibada, badala ya kuifanya iwe uchafu wa kawaida tu.
- source_word: מַחֲנֵיהֶם
  choice: kambi zao
  rationale: Nomino ya Kiebrania ni ya wingi pamoja na kiambishi cha umilikaji cha nafsi ya tatu wingi; tafsiri hii inalinda wingi huo, ambao huenda unahusu sehemu mbalimbali za kambi ya Israeli.
- source_word: אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: ambazo ninakaa katikati yao
  rationale: Usemi huu huhifadhi lugha ya uwepo wa Mungu na pia kiambishi cha wingi cha Kiebrania, bila kulazimisha iwapo kinarejelea kambi au watu wake.
theological_decisions:
- issue: Kirejelewa cha בְּתוֹכָם katika kauli kuhusu kukaa kwa Mungu
  choice: ambazo ninakaa katikati yao
  alternative: ambao ninakaa kati yao
  rationale: Kiebrania kinaweza kueleweka kuwa Mungu anakaa katikati ya kambi hizo au katikati ya watu wanaohusishwa nazo. Matini kuu inadumisha muundo wa kambi, na tanbihi inalinda uwezekano wa kirejelewa cha watu bila kuamua mvutano huo kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Marudio ya amri yamehifadhiwa kwa msisitizo; istilahi ‘kutia unajisi’ imetumiwa kwa muktadha wa utakaso wa kiibada.
