    reason: alternative_reading
  revision_rationale: The revision removes an unsupported explicit intensifier, improves the Swahili locative relative clause, and clarifies the plural/singular footnote while preserving the Hebrew’s repeated command, ritual-purity terminology, plural ‘camps,’ and ambiguity concerning the final plural reference.
