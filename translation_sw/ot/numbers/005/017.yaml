  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן מַ֥יִם קְדֹשִׁ֖ים בִּ/כְלִי חָ֑רֶשׂ וּ/מִן הֶֽ/עָפָ֗ר אֲשֶׁ֤ר יִהְיֶה֙ בְּ/קַרְקַ֣ע הַ/מִּשְׁכָּ֔ן יִקַּ֥ח הַ/כֹּהֵ֖ן וְ/נָתַ֥ן אֶל הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/017.yaml
  text: Then the priest shall take holy water in an earthen vessel[c][b][a], and the priest shall take some of the dust that is on the floor of the tabernacle and put it into the water.
translation:
  language: sw
  text: Kisha kuhani atachukua maji matakatifu[a] katika chombo cha udongo[b]. Atachukua sehemu ya mavumbi yaliyo kwenye sakafu ya Maskani[c] na kuyatia ndani ya maji hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maji yaliyowekwa wakfu.” Kiebrania kinamaanisha maji yaliyotengwa kuwa matakatifu kwa matumizi ya ibada.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika chombo cha mfinyanzi.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwenye ardhi ya Maskani.” Neno la Kiebrania linaweza kumaanisha “ardhi” au “sakafu”; “sakafu” linafaa katika mazingira ya Maskani.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קְדֹשִׁים
  choice: maji matakatifu
  rationale: Kirai hiki kinataja maji yaliyotengwa kuwa matakatifu kwa matumizi ya ibada. Tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: בִּכְלִי חָרֶשׂ
  choice: katika chombo cha udongo
  rationale: כְּלִי ni chombo, na חָרֶשׂ hurejelea udongo wa mfinyanzi au chombo kilichotengenezwa kwa udongo. ‘Chombo cha udongo’ ni usemi wa asili na wenye hadhi katika muktadha huu.
- source_word: הֶעָפָר
  choice: mavumbi
  rationale: עָפָר inaweza kumaanisha mavumbi, udongo mkavu, au udongo tifutifu. ‘Mavumbi’ yanafaa kwa picha ya tendo hili la kiibada bila kutumia lugha ya mazungumzo mno.
- source_word: בְּקַרְקַע הַמִּשְׁכָּן
  choice: kwenye sakafu ya Maskani
  rationale: קַרְקַע inaweza kumaanisha ardhi au sakafu. ‘Sakafu’ inaeleweka kwa kawaida kama sehemu ya chini ndani ya Maskani, huku tanbihi ikihifadhi uwezekano wa ‘ardhi.’
- source_word: מִן הֶעָפָר
  choice: sehemu ya mavumbi
  rationale: מִן ina maana ya kuchukua kiasi kutoka katika mavumbi hayo, wala si lazima kuyachukua yote. ‘Sehemu ya mavumbi’ hudhihirisha maana hiyo ya kigawanyo.
- source_word: וְלָקַח ... יִקַּח ... וְנָתַן
  choice: atachukua ... atachukua ... na kuyatia
  rationale: Mfululizo huu ni maagizo ya utaratibu wa ibada. Wakati ujao katika Kiswahili huwasilisha tendo lililoagizwa kwa njia ya kawaida na wazi; נָתַן hapa ni ‘kutia’ ndani ya maji.
- source_word: הַמָּיִם
  choice: maji hayo
  rationale: Kibainishi cha Kiebrania kinarejelea maji matakatifu yaliyotajwa tayari. ‘Maji hayo’ huonyesha marejeo hayo wazi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi, na yenye hadhi ya maandiko ya ibada. ‘Maskani’ imeandikwa kwa herufi kubwa kwa kuwa hapa ni jina la mahali patakatifu maalumu. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi bila kuondoa kurudiwa kwa tendo la kuhani katika chanzo.
