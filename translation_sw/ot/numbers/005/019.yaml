review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the priest's administering of an oath, the conditional denial of sexual relations and straying into impurity, the marital idiom, and the curse-bringing bitter waters. However, “usipate madhara kutokana na” narrows הִנָּקִי to avoidance of harm, whereas the Hebrew directly declares exemption/clearing from the waters.
  naturalness: The Swahili is generally clear and appropriately formal. “Uwe huru kutokana na” is both natural and closer to the direct legal-ritual force of the Hebrew than “usipate madhara kutokana na.”
  terminology: “Kuhani,” “kumwapisha,” “unajisi,” and “laana” suit Standard East African Swahili and the passage’s legal-ritual register. The marital idiom is retained and helpfully explained in a footnote.
  issues:
  - severity: medium
    issue: “usipate madhara kutokana na” for הִנָּקִי
    rationale: This interprets the result as merely avoiding harmful effects. The imperative from נקה more directly conveys being free, exempt, or cleared from the bitter waters. A direct rendering preserves the wording and its legal-ritual ambiguity.
  revised_text: Kisha kuhani atamwapisha na kumwambia huyo mwanamke, “Ikiwa hakuna mwanamume aliyelala nawe, na ikiwa hujapotoka ukajitia unajisi huku ukiwa chini ya mume wako,[a] basi uwe huru kutokana na maji haya machungu yanayoleta laana.[b]”
