  text: וְ/הִשְׁבִּ֨יעַ אֹתָ֜/הּ הַ/כֹּהֵ֗ן וְ/אָמַ֤ר אֶל הָֽ/אִשָּׁה֙ אִם לֹ֨א שָׁכַ֥ב אִישׁ֙ אֹתָ֔/ךְ וְ/אִם לֹ֥א שָׂטִ֛ית טֻמְאָ֖ה תַּ֣חַת אִישֵׁ֑/ךְ הִנָּקִ֕י מִ/מֵּ֛י הַ/מָּרִ֥ים הַֽ/מְאָרֲרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/019.yaml
  text: Then the priest shall make her swear and shall say to the woman[a], ‘If no man has lain with you, and if you have not gone astray in uncleanness under your husband[c][b], be free from these bitter waters that bring a curse.’
translation:
  language: sw
  text: Kisha kuhani atamwapisha na kumwambia huyo mwanamke, “Ikiwa hakuna mwanamume aliyelala nawe, na ikiwa hujapotoka ukajitia unajisi huku ukiwa chini ya mume wako,[a] basi uwe huru kutokana na maji haya machungu yanayoleta laana.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “chini ya mume wako”; ni nahau inayorejelea kuwa katika kifungo na wajibu wa ndoa.
    reason: cultural_note
  - marker: b
    text: Kiebrania kihalisi, “maji machungu, yale yanayoleta laana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: atamwapisha
  rationale: Hifili ya שבע humaanisha kumsababisha mtu aape au kumweka chini ya kiapo; ‘atamwapisha’ ni ya kawaida na huhifadhi maana ya kisababishi.
- source_word: אִם לֹא שָׁכַב אִישׁ אֹתָךְ
  choice: Ikiwa hakuna mwanamume aliyelala nawe
  rationale: שׁכב ni lugha ya staha inayomaanisha kufanya ngono. ‘Aliyelala nawe’ huhifadhi sitiari hiyo bila kuwa chafu wala kufafanua kupita kiasi.
- source_word: שָׂטִית טֻמְאָה
  choice: hujapotoka ukajitia unajisi
  rationale: שׂטה hutoa wazo la kupotoka, na טֻמְאָה la unajisi. Muundo huu ni wa asili katika Kiswahili na huhifadhi hatua ya kupotoka pamoja na hali ya unajisi bila kutaja uzinzi moja kwa moja.
- source_word: תַּחַת אִישֵׁךְ
  choice: huku ukiwa chini ya mume wako
  rationale: Tafsiri hii inabaki karibu na nahau ya Kiebrania, ambayo hapa hurejelea hali na wajibu wa mwanamke ndani ya kifungo cha ndoa; tanbihi inaifafanua.
- source_word: הִנָּקִי
  choice: usipate madhara kutokana na
  rationale: Katika muktadha wa jaribio hili, נקה huonyesha kuachiliwa au kutopatikana na athari za maji. Kiswahili hiki kinaeleza matokeo kwa kawaida bila kutangaza mapema hukumu pana ya kutokuwa na hatia.
- source_word: מִמֵּי הַמָּרִים
  choice: maji haya machungu
  rationale: ‘Maji’ ni nomino ya wingi katika Kiswahili na inalingana vizuri na wingi wa Kiebrania; ‘machungu’ ndiyo maana ya kawaida ya מרים.
- source_word: הַמְאָרֲרִים
  choice: yanayoleta laana
  rationale: Kirai hiki huhifadhi nguvu ya kisababishi ya participio kutoka ארר na uzito wa kiibada wa maji kama yenye kuleta laana.
theological_decisions:
- issue: Lugha inayofafanua kosa la mwanamke
  choice: Kuhifadhi maneno ya kupotoka na kujitia unajisi bila kuyabadilisha moja kwa moja kuwa ‘kuzini’.
  alternative: ikiwa hukumkosea mume wako kwa uzinzi
  rationale: Muktadha ni wa tuhuma za kukosa uaminifu wa kingono, lakini Kiebrania kinatumia lugha ya kulala, kupotoka na unajisi. Tafsiri haipaswi kufafanua zaidi ya maneno hayo.
- issue: Athari ya maji
  choice: yanayoleta laana
  alternative: maji ya laana / maji yenye kulaanisha
  rationale: Participio ya Kiebrania inaonyesha kwamba maji yanahusishwa na kutekeleza laana, lakini mstari huu hauelezi utaratibu wake kamili.
- issue: Maana ya הִנָּקִי katika kauli ya sharti
  choice: usipate madhara kutokana na
  alternative: uwe huru kutokana na / usiwe na hatia kwa sababu ya
  rationale: Kauli hiyo inamhusu mwanamke asiye na kosa kutopatwa na athari ya jaribio. Uteuzi huu huhifadhi maana ya kuachiliwa bila kuchanganya maji yenyewe na msingi wa hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kumwapisha,’ ‘kupotoka,’ na ‘unajisi’ huhifadhi mtindo wa kisheria na kiibada; tanbihi inaeleza nahau isiyo ya kawaida ya ‘chini ya mume wako.’
