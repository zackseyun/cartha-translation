base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/012.yaml
  text: 'Speak to the sons of Israel and say to them: If any man''s wife goes astray and commits a breach of faith against him[b][a],'
translation:
  language: sw
  text: '“Sema na wana wa Israeli[a] na uwaambie: Ikiwa mke wa mwanamume yeyote atapotoka na kutenda tendo la kukosa uaminifu dhidi ya mumewe[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa Kiswahili cha kawaida zaidi, “Waisraeli.” Kiebrania kinasema kihalisi “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia kitenzi na nomino zenye mzizi mmoja ili kusisitiza kutokuwa mwaminifu au kuvunja uaminifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sema
  rationale: Ni amri inayoanzisha maagizo ya Mungu kwa Musa; “sema” ni ya kawaida, wazi, na ya heshima katika Kiswahili cha sasa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi taswira ya kifamilia na umbo la kiume la Kiebrania; “Waisraeli” limetolewa kama mbadala wa kimtindo katika tanbihi.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: na uwaambie
  rationale: Inaendeleza kwa kawaida fomula ya hotuba ya Kiebrania bila kuondoa kurudiwa kwa vitenzi vya kusema.
- source_word: אִישׁ אִישׁ
  choice: mwanamume yeyote
  rationale: Kurudiwa kwa אִישׁ kuna maana ya kugawa kwa kila mmoja, yaani “mwanamume yeyote.”
- source_word: כִּי
  choice: ikiwa
  rationale: Katika sheria inayowasilisha kisa, neno hili linaanzisha sharti, si wakati tu.
- source_word: תִשְׂטֶה
  choice: atapotoka
  rationale: Inadumisha sitiari ya kugeuka kutoka njia inayofaa bila kutaja mapema kitendo hususa kinachofafanuliwa na muktadha unaofuata.
- source_word: אִשְׁתּוֹ
  choice: mke wake
  rationale: Inawakilisha wazi nomino na kiambishi cha umilikaji cha Kiebrania.
- source_word: וּמָעֲלָה ... מָעַל
  choice: na kumkosea uaminifu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha tendo la usaliti au uvunjaji wa uaminifu; tanbihi inaeleza mkazo wa muundo wa Kiebrania wenye kitenzi na nomino za mzizi mmoja.
- source_word: בּוֹ
  choice: kumkosea
  rationale: Kiambishi “-m-” kinamtaja mume kama yule aliyetendewa kosa la uaminifu, kwa namna ya kawaida katika Kiswahili.
theological_decisions:
- issue: Jina la kifamilia lenye jinsia katika mwito wa agano
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Matini kuu inadumisha umbo la kifamilia la Kiebrania, huku tanbihi ikitoa namna ya kawaida zaidi inayotaja taifa lote bila kutatua kimya kimya upeo wa usemi.
- issue: Uzito wa usemi wa kutokuwa mwaminifu
  choice: kumkosea uaminifu
  alternative: kumtendea tendo la kuvunja uaminifu
  rationale: Chaguo kuu ni la asili katika Kiswahili na linadumisha kosa la kimahusiano dhidi ya mume; muundo wa kusisitiza wa Kiebrania umeelezwa katika tanbihi badala ya kutolewa kwa Kiswahili kigumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sheria unaoanza kwa sharti umehifadhiwa, na mstari umeachwa wazi kisintaksia kwa sababu sentensi inaendelea katika mistari inayofuata.
