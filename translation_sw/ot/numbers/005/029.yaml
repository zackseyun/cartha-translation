lexical_decisions:
- source_word: זֹאת תּוֹרַת הַקְּנָאֹת
  choice: Hii ndiyo sheria kuhusu wivu
  rationale: Muundo huu unatambulisha muhtasari wa sheria. Ingawa הַקְּנָאֹת ni wingi kwa umbo, hapa unatumiwa kama jina la kiufundi la utaratibu unaohusu wivu; Kiswahili cha kawaida hutumia umoja ‘wivu’.
- source_word: אֲשֶׁר תִּשְׂטֶה אִשָּׁה
  choice: wakati mke anapopotoka
  rationale: אִשָּׁה hapa ni ‘mke’ kwa sababu muktadha unamtaja mume wake. תִּשְׂטֶה hubakiza taswira ya kuacha njia bila kutaja uzinzi moja kwa moja kuliko Kiebrania.
- source_word: תַּחַת אִישָׁהּ
  choice: akiwa chini ya kifungo cha ndoa na mume wake
  rationale: Usemi halisi ni ‘chini ya mume wake’; tafsiri hii inaeleza nahau ya uhusiano au kifungo cha ndoa bila kuifanya iwe kauli ya jumla kuhusu mamlaka ya mume.
- source_word: וְנִטְמָאָה
  choice: na kujitia unajisi
  rationale: Nifali ya טמא inaonyesha kuingia katika hali ya unajisi. ‘Kujitia unajisi’ huhifadhi lugha ya unajisi wa kimaadili/kingono bila kuibana kuwa uchafu wa kiibada pekee au kutafsiri wazi kuwa uzinzi.
theological_decisions:
- issue: Asili ya unajisi katika sheria ya mashaka ya kukosa uaminifu katika ndoa
  choice: kujitia unajisi
  alternative: kufanya uzinzi; kuwa najisi
  rationale: Muktadha unahusu ukosefu wa uaminifu wa kingono, lakini Kiebrania kinatumia lugha ya unajisi. Tafsiri haibadili istilahi hiyo kuwa shtaka la moja kwa moja la uzinzi wala kuiwekea mipaka ya unajisi wa kiibada tu.
- issue: Maana ya תַּחַת אִישָׁהּ
  choice: akiwa chini ya kifungo cha ndoa na mume wake
  alternative: akiwa chini ya mamlaka ya mume wake; badala ya mume wake
  rationale: Chaguo hili linaonyesha uhusiano wa ndoa unaodokezwa na nahau huku likiepuka kuingiza fundisho pana la kimadhehebu kuhusu mamlaka ya ndoa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Anapopotoka’ huhifadhi sitiari ya Kiebrania; ‘kifungo cha ndoa’ hufanya nahau ieleweke kwa msomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
