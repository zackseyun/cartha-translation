  text: 'Hii ndiyo sheria kuhusu wivu[a]: wakati mke anapopotoka katika ndoa yake[b] na anakuwa najisi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina neno la wingi, ‘wivu mbalimbali,’ ambalo huenda linatumika kama jina la kiufundi la utaratibu huu wa kisheria.
