reference: Numbers 5:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ֠/בָאוּ הַ/מַּ֨יִם הַ/מְאָרְרִ֤ים הָ/אֵ֨לֶּה֙ בְּֽ/מֵעַ֔יִ/ךְ לַ/צְבּ֥וֹת בֶּ֖טֶן וְ/לַ/נְפִּ֣ל יָרֵ֑ךְ וְ/אָמְרָ֥ה הָ/אִשָּׁ֖ה אָמֵ֥ן אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/022.yaml
  text: and may these curse-bringing waters enter your inward parts[a], to make the belly swell and the thigh waste away. And the woman shall say, ‘Amen, amen.’
translation:
  language: sw
  text: Na maji haya yaletayo laana yaingie ndani yako, ili tumbo lako livimbe na paja lako linyauke.[a] Naye mwanamke atasema, “Amina, amina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya karibu zaidi na maneno ya Kiebrania, “ili kulivimbisha tumbo na kuangusha paja.” Usemi huu wa Kiebrania ni mgumu na huenda ni lugha ya staha inayorejelea madhara katika viungo vya uzazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: na yaingie
  rationale: Katika muktadha wa kiapo na laana, umbo hili lina nguvu ya tamko la kutakia jambo litokee, si taarifa tu kuhusu wakati ujao.
- source_word: הַמַּיִם הַמְאָרְרִים הָאֵלֶּה
  choice: maji haya yaletayo laana
  rationale: Neno linalotokana na ארר linaonyesha kwamba maji hayo hubeba au kutekeleza laana; si kwamba ni machungu tu.
- source_word: בְּמֵעַיִךְ
  choice: ndani yako
  rationale: מֵעֶה hurejelea sehemu za ndani za mwili. Usemi huu ni wa kawaida na wenye heshima katika Kiswahili, bila kuwa wa kitabibu kupita kiasi.
- source_word: לַצְבּוֹת בֶּטֶן
  choice: ili kulivimbisha tumbo lako
  rationale: Inahifadhi matokeo ya kimwili yanayoelezwa na kitenzi pamoja na maana ya kawaida ya בֶּטֶן, ‘tumbo,’ bila kulazimisha maana mahususi ya ‘mfuko wa uzazi.’
- source_word: וְלַנְפִּל יָרֵךְ
  choice: na kulifanya paja lako linyauke
  rationale: Ingawa נפל kwa kawaida ni ‘kuanguka,’ kirai hiki ni kigumu na huenda ni nahau. ‘Linyauke’ huwasilisha udhaifu au kuharibika kwa kiungo bila kudai kwa uhakika athari mahususi ya kitabibu.
- source_word: יָרֵךְ
  choice: paja
  rationale: Maana ya msingi ni ‘paja/nyonga.’ ‘Paja’ huhifadhi lugha ya staha ya Kiebrania na uwezekano kwamba neno hilo lina maana pana inayohusiana na uzazi.
- source_word: וְאָמְרָה הָאִשָּׁה
  choice: Naye mwanamke atasema
  rationale: Hili ni agizo la mwitikio wa kiliturujia katika simulizi la sheria; wakati ujao wa Kiswahili unafaa kwa maelekezo hayo.
- source_word: אָמֵן אָמֵן
  choice: Amina, amina
  rationale: Urudiaji unahifadhi uthibitisho mzito wa kiapo na neno la kiliturujia lililozoeleka katika Kiswahili.
theological_decisions:
- issue: Maana ya athari za laana mwilini
  choice: Kutafsiri kwa lugha ya mwili iliyo karibu na maandishi—tumbo kuvimba na paja kunyauka—bila kutaja moja kwa moja kuharibika kwa mimba, utasa, au tatizo jingine maalumu la uzazi.
  alternative: “ili kusababisha mimba yako iharibike na tumbo lako livimbe” au “ili viungo vyako vya uzazi vinyauke”
  rationale: Kirai cha Kiebrania ni kigumu na huenda kinatumia lugha ya staha kuhusu madhara ya uzazi. Hakibainishi kwa uhakika hali moja ya kitabibu, kwa hiyo tafsiri inadumisha utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya ibada lakini kinachoeleweka kwa wasomaji wa kawaida. “Amina, amina” limehifadhiwa kama jibu rasmi la kiapo. Lugha ya staha ya chanzo kuhusu sehemu za mwili haijaelezwa kwa uwazi zaidi kuliko Kiebrania.
