base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/030.yaml
  text: or when a spirit of jealousy comes over a man[a], and he is jealous of his wife, and he brings the woman before Yahweh[b], and the priest shall do to her all this law.
translation:
  language: sw
  text: au roho ya wivu inapomjia mwanamume[a], naye akamwonea mke wake wivu, akamweka huyo mwanamke mbele za Yahwe, kuhani atamtendea sawasawa na sheria hii yote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “inapompitia”; kihalisi, “roho ya wivu inapopita juu yake.”
    reason: lexical_alternative
  - marker: b
    text: “Sheria” hapa pia inaweza kutafsiriwa “maagizo” au “utaratibu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: au
  rationale: Inaendeleza hali nyingine mbadala katika sentensi na masharti ya kifungu kilichotangulia.
- source_word: אִישׁ
  choice: mwanamume
  rationale: Neno la Kiebrania kwa kawaida humaanisha mwanamume; uhusiano wake kama mume unaelezwa wazi na maneno yanayofuata, “mke wake.”
- source_word: תַּעֲבֹר עָלָיו רוּחַ קִנְאָה
  choice: roho ya wivu inapomjia
  rationale: Ni Kiswahili cha kawaida kinachoonyesha msukumo unaomkumba mtu, huku kikidumisha neno “roho” na kutobainisha kama jambo hilo ni hali ya ndani au nguvu ya kiroho.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: naye akamwonea mke wake wivu
  rationale: Kitenzi kina mzizi mmoja na nomino “wivu”; tafsiri hii inadumisha urudiaji huo kwa Kiswahili cha kawaida.
- source_word: וְהֶעֱמִיד אֶת הָאִשָּׁה לִפְנֵי יְהוָה
  choice: akamweka huyo mwanamke mbele za Yahwe
  rationale: Hifili ya עמד ina maana ya kumsimamisha au kumweka mbele; “akamweka ... mbele za” inaonyesha kuwasilishwa rasmi katika mazingira haya ya ibada.
- source_word: וְעָשָׂה לָהּ הַכֹּהֵן
  choice: kuhani atamtendea
  rationale: Inadumisha tendo linaloelekezwa kwa mwanamke na nguvu ya kitaratibu ya kitenzi katika sheria hii.
- source_word: כָּל הַתּוֹרָה הַזֹּאת
  choice: sawasawa na sheria hii yote
  rationale: תּוֹרָה hapa ni agizo au sheria inayojumuisha utaratibu uliotangulia. “Sawasawa na” hufanya Kiswahili kiwe cha kawaida bila kupoteza maana kwamba kuhani anatekeleza masharti yote.
theological_decisions:
- issue: Asili ya “roho ya wivu”
  choice: roho ya wivu
  alternative: msukumo wa wivu; wivu mkali
  rationale: Kiebrania hakilazimishi uamuzi kama “roho” ni hali ya kisaikolojia au nguvu ya kiroho. Tafsiri ya moja kwa moja inadumisha utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria na kiibada lakini kinachoeleweka kwa wasomaji wa kawaida. Jina la agano limetafsiriwa “Yahwe.” Alama za tanbihi [a] na [b] zimewekwa moja kwa moja mahali panapohusika.
