base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/028.yaml
  text: But if the woman has not defiled herself and is clean[a], then she will be cleared and will conceive offspring.
translation:
  language: sw
  text: Lakini ikiwa mwanamke huyo hakujitia unajisi na ni safi, basi atathibitishwa kuwa hana hatia, naye atapata mimba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “atapandwa mbegu,” nahau yenye maana ya kupata mimba au kuwa na uzao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Inaonyesha sharti linalotofautiana na hali ya hukumu katika mstari uliotangulia.
- source_word: לֹא נִטְמְאָה
  choice: hakujitia unajisi
  rationale: Nifali ya טמא hapa inaeleza kutotiwa au kutoingia katika unajisi; katika muktadha wa tuhuma ya uzinzi, usemi huu wa Kiswahili unaonyesha unajisi wa kingono na kimaadili bila kuufanya kuwa wa kiibada pekee.
- source_word: הָאִשָּׁה
  choice: mwanamke huyo
  rationale: Nomino yenye kibainishi inamrejelea mwanamke anayezungumziwa katika ibada hii.
- source_word: וּטְהֹרָה הִוא
  choice: bali ni safi
  rationale: טְהֹרָה humaanisha kuwa safi; 'bali' huleta tofauti ya kimuktadha baada ya kauli hasi, kwa Kiswahili cha kawaida.
- source_word: וְנִקְּתָה
  choice: basi hataadhibiwa
  rationale: Nifali ya נקה inaweza kumaanisha kuachiliwa, kutokuwa na hatia, au kutopata adhabu. Katika matokeo ya jaribio hili, 'hataadhibiwa' ni ya asili na inaacha wazi kama msisitizo ni kuondolewa hatia au kuepushwa na madhara.
- source_word: וְנִזְרְעָה זָרַע
  choice: naye atapata uzao
  rationale: Usemi halisi ni 'atapandwa mbegu,' nahau ya uzazi. 'Atapata uzao' huwasilisha maana yake kwa Kiswahili cha kawaida bila kutumia picha isiyo ya asili ya kupandwa mbegu.
theological_decisions:
- issue: Maana ya matokeo yaliyoahidiwa baada ya mwanamke kuonekana safi
  choice: Mwanamke hatapata adhabu ya laana, naye atapata uzao.
  alternative: Ataweza kupata mimba; au ataendelea kuwa na uwezo wa kuzaa.
  rationale: Kiebrania וְנִזְרְעָה זָרַע ni usemi chanya wa kupata uzao, lakini namna yake halisi na upeo wake vinaweza kueleweka kama kupata mimba au kuthibitishwa kwa uwezo wa kuzaa. Tafsiri haiongezi neno la uwezekano lisilokuwamo wazi katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Kujitia unajisi' huhifadhi lugha ya usafi wa kimaadili katika muktadha huu; 'atapata uzao' ni ya kueleweka kwa wasomaji wa kawaida. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachoifafanua.
