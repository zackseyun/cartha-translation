lexical_decisions:
- source_word: תְּרוּמָה
  choice: toleo
  rationale: Neno “toleo” linaeleza kitu kilichotengwa na kutolewa, hasa kama haki ya kuhani, bila kutumia istilahi ya kale au ya kiufundi kupita kiasi.
- source_word: קָדְשֵׁי
  choice: vitu vitakatifu
  rationale: Wingi huu unahusu vitu vilivyowekwa wakfu. “Vitu vitakatifu” ni wazi, wa kawaida, na unabaki karibu na upana wa maana ya Kiebrania.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi taswira ya kifamilia na umbo la kiume la Kiebrania, huku ikiwa kauli ya kawaida na inayoeleweka katika Kiswahili cha Biblia.
- source_word: יַקְרִיבוּ
  choice: watamletea
  rationale: Katika muktadha wa sadaka, kitenzi kina maana ya kuleta au kuwasilisha. “Watamletea” ni cha asili katika Kiswahili na kinaonyesha kuwa kuhani ndiye mpokeaji.
- source_word: לַכֹּהֵן
  choice: kuhani
  rationale: Kiambishi cha yambwa katika “watamletea” tayari kinaonyesha mwelekeo wa ‘kwa/kwa ajili ya’, hivyo “kuhani” linamtaja mpokeaji bila kurudia kihusishi.
- source_word: לוֹ יִהְיֶה
  choice: litakuwa mali yake
  rationale: Hii ni kauli ya umiliki wa kisheria. “Litakuwa mali yake” ni wazi zaidi katika Kiswahili cha sasa kuliko tafsiri ya neno kwa neno “litakuwa lake” pekee.
theological_decisions:
- issue: Jina la kifamilia la jumuiya ya agano בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Tafsiri hii huhifadhi umbo la kifamilia la maandishi ya Kiebrania bila kuligeuza kuwa jina la kabila pekee; hakuna msimamo wa kimadhehebu unaoongezwa.
- issue: Aina ya vitu vilivyowekwa wakfu קָדְשֵׁי
  choice: vitu vitakatifu
  alternative: matoleo matakatifu
  rationale: Kiebrania kinaweza kumaanisha kwa upana vitu vilivyowekwa wakfu, si lazima aina moja tu ya sadaka. Tafsiri pana inahifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria wa umiliki umewekwa wazi kwa “litakuwa mali yake,” na istilahi za kiibada zimeachwa pana pale Kiebrania kilipo pana.
