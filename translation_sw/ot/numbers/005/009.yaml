  text: And every contribution from all the holy gifts of the sons of Israel, which they bring near to the priest, shall be his.
translation:
  language: sw
  text: Na kila toleo la vitu vyote vitakatifu[b] vya wana wa Israeli[a], ambalo watamletea kuhani[c], litakuwa mali yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania kinasema, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “vitu vilivyowekwa wakfu” au “matoleo matakatifu.”
    reason: lexical_alternative
