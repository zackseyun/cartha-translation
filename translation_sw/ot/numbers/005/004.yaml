  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְשַׁלְּח֣וּ אוֹתָ֔/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/004.yaml
  text: And the sons of Israel did so[a], and sent them outside the camp; just as Yahweh had spoken to Moses, so the sons of Israel did.
translation:
  language: sw
  text: Waisraeli[a] wakafanya hivyo na kuwapeleka watu hao nje ya kambi. Kama vile Yahwe alivyomwambia Musa, ndivyo Waisraeli walivyofanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “wana wa Israeli”; hapa usemi huo unamaanisha Waisraeli kwa ujumla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: wakafanya hivyo
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kutii agizo lililotangulia, huku ikidumisha usemi wa Kiebrania wa ‘kufanya hivyo.’
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli[a]
  rationale: Katika muktadha huu usemi halisi ‘wana wa Israeli’ unalitaja taifa kwa ujumla; ‘Waisraeli’ ni Kiswahili cha sasa, wazi na cha asili. Tanbihi inahifadhi picha ya kifamilia ya Kiebrania.
- source_word: וַיְשַׁלְּחוּ אֹתָם
  choice: na kuwapeleka watu hao
  rationale: Kitenzi שׁלח hapa kinaeleza kuwaondoa watu waliotajwa kutoka kambini. ‘Kuwapeleka’ pamoja na ‘nje ya kambi’ huwasilisha tendo na mwelekeo wake; ‘watu hao’ hufanya rejeo la kiwakilishi kuwa wazi kwa Kiswahili.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha wazi eneo la nje na kutengwa na kambi.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: Kama vile ... alivyomwambia
  rationale: ‘Kama vile’ huhifadhi ulinganisho wa kufuata sawasawa; ‘alivyomwambia’ ni Kiswahili cha kawaida kwa kusema kwa mtu katika muktadha huu bila kuongeza maelezo ya kimadhehebu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: כֵּן עָשׂוּ
  choice: ndivyo ... walivyofanya
  rationale: Huhifadhi marudio ya mwisho yanayosisitiza kwamba Waisraeli walitii sawasawa na walivyoambiwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umegawanywa katika sentensi mbili kwa usomaji wa kawaida, huku marudio ya Kiebrania kuhusu utiifu wa Waisraeli yakihifadhiwa.
