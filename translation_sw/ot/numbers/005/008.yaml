  text: וְ/אִם אֵ֨ין לָ/אִ֜ישׁ גֹּאֵ֗ל לְ/הָשִׁ֤יב הָ/אָשָׁם֙ אֵלָ֔י/ו הָ/אָשָׁ֛ם הַ/מּוּשָׁ֥ב לַ/יהוָ֖ה לַ/כֹּהֵ֑ן מִ/לְּ/בַ֗ד אֵ֚יל הַ/כִּפֻּרִ֔ים אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/008.yaml
  text: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
translation:
  language: sw
  text: Lakini ikiwa mtu huyo hana mkombozi wa ukoo ambaye anaweza kurudishiwa malipo ya kufidia hatia[a], malipo hayo yanayorejeshwa kwa BWANA yatakuwa ya kuhani[b], zaidi ya kondoo dume wa upatanisho ambaye kwa njia yake kuhani atamfanyia mtu huyo upatanisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkombozi” au “jamaa wa karibu.” Neno la Kiebrania גֹּאֵל linamaanisha mwanafamilia mwenye wajibu wa kisheria katika mambo ya ukombozi au ya kupokea malipo ya kurejeshwa.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania אָשָׁם hapa linamaanisha malipo ya kufidia hatia, si kondoo dume mwenyewe; kondoo dume anatajwa tofauti baadaye katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל
  choice: mkombozi wa ukoo
  rationale: Neno hili linadumisha wazo la jamaa mwenye wajibu wa kisheria wa kukomboa mali au kupokea marejesho kwa niaba ya ndugu yake; tanbihi inaeleza maana hiyo maalumu.
- source_word: הָאָשָׁם
  choice: malipo ya hatia
  rationale: Katika muktadha huu neno linamaanisha malipo ya kufidia kosa, si dhabihu yenyewe, kwa kuwa kondoo dume anatajwa kando baadaye.
- source_word: הָאָשָׁם הַמּוּשָׁב
  choice: malipo hayo ya hatia yanayorudishwa
  rationale: Kauli hii inadumisha hali ya kutendwa ya kitenzi שוב na kusisitiza tendo la kurejesha malipo.
- source_word: לַיהוָה
  choice: kwa BWANA
  rationale: Jina la agano YHWH limetafsiriwa kwa matumizi ya kawaida na yenye heshima ya Kiswahili, “BWANA.”
- source_word: לַכֹּהֵן
  choice: yatakuwa ya kuhani
  rationale: Kiswahili kinahitaji kiarifu kilicho wazi ili kuonyesha kwamba malipo hayo yanapewa kuhani.
- source_word: מִלְּבַד
  choice: kando na
  rationale: Usemi huu unatofautisha malipo ya kurejesha na kondoo dume, bila kuyafanya kuwa kitu kilekile.
- source_word: אֵיל הַכִּפֻּרִים
  choice: kondoo dume wa upatanisho
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi kazi ya kidhabihu ya kondoo huyo.
- source_word: יְכַפֶּר בּוֹ עָלָיו
  choice: ambaye kwa njia yake kuhani atamfanyia mtu huyo upatanisho
  rationale: Tafsiri inaonyesha kondoo dume kuwa njia ya upatanisho na inaweka wazi mtendaji anayodokezwa na utaratibu wa kikuhani.
- source_word: לָאִישׁ
  choice: mtu huyo
  rationale: Katika Kiswahili, “mtu huyo” ni rejeo la asili kwa mhusika aliyetajwa katika muktadha na halilazimishi kurudia jinsia pale ambapo sarufi ya Kiswahili haihitaji.
theological_decisions:
- issue: Uhusiano kati ya malipo ya kurejesha na dhabihu
  choice: Malipo ya hatia yanatofautishwa na kondoo dume wa upatanisho; si kitu kilekile.
  alternative: Kuyachukulia malipo ya hatia yenyewe kuwa sadaka ya kidini.
  rationale: 'Neno מִלְּבַד na kutajwa tofauti kwa kondoo dume vinaonyesha vitu viwili tofauti: malipo ya kurejesha na dhabihu ya upatanisho.'
- issue: Uwakilishi wa jina YHWH
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” ni uwakilishi wa kawaida wa Kiswahili wa tetragramu katika maandiko, huku herufi kubwa zikionyesha kuwa ni jina la Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria wa mstari umehifadhiwa bila kuchanganya malipo ya kurejesha na dhabihu ya upatanisho.
