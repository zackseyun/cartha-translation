  text: then they shall confess the sin that they have committed[a], and he shall make full restitution for his guilt, adding a fifth to it[b], and give it to the one against whom he was guilty.
translation:
  language: sw
  text: Nao wataungama dhambi yao waliyoitenda; naye atarejesha kwa ukamilifu kiasi anachowajibika kulipa kwa kosa lake[a], akiongeza juu yake sehemu ya tano, na kumpa yule aliyemkosea.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atalipa deni lake la kosa kwa ukamilifu.” Neno la Kiebrania linaweza kumaanisha hatia, wajibu wa malipo, au fidia inayotokana na hatia; hapa linahusu kiasi cha msingi kinachopaswa kurejeshwa, wala si sadaka ya hatia.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi na muundo wa Kiebrania, “yule ambaye alifanya kosa kwake,” yaani, mtu aliyemkosea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: Nao wataungama
  rationale: Kitenzi cha Kiebrania katika Hitpael kinamaanisha kukiri au kuungama kosa waziwazi. Wakati ujao unaendeleza nguvu ya agizo la kisheria, na kiunganishi kinaonyesha mwendelezo wa muktadha.
- source_word: חַטָּאתָם אֲשֶׁר עָשׂוּ
  choice: dhambi yao waliyoitenda
  rationale: חַטָּאת hapa ni dhambi au kosa linaloungamwa; ‘kutenda dhambi’ ni Kiswahili cha kawaida na chenye heshima kinacholingana na עָשׂוּ.
- source_word: וְהֵשִׁיב אֶת אֲשָׁמוֹ בְּרֹאשׁוֹ
  choice: atarudisha kiasi chote anachodaiwa kwa kosa lake
  rationale: Katika muktadha huu הֵשִׁיב ni kurudisha au kulipa, אָשָׁם ni deni au wajibu unaotokana na kosa, na בְּרֹאשׁוֹ inaonyesha kiasi cha msingi kwa ukamilifu kabla ya nyongeza.
- source_word: וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
  choice: akiongeza sehemu ya tano juu yake
  rationale: Tafsiri hii inaonyesha nyongeza ya moja kwa tano ya kiasi cha msingi bila kuibadili kimya kimya kuwa asilimia ishirini.
- source_word: וְנָתַן לַאֲשֶׁר אָשַׁם לוֹ
  choice: na kumpa yule aliyemkosea
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kumtaja mtu aliyedhulumiwa, huku tanbihi ikihifadhi muundo halisi unaohusisha hatia au uwajibikaji.
theological_decisions:
- issue: Maana ya אָשָׁם katika muktadha wa marejesho
  choice: deni au uwajibikaji usio wa dhabihu unaotokana na kosa
  alternative: sadaka ya hatia
  rationale: Muktadha wa karibu unahusu kuungama, kurudisha kiasi cha msingi, kuongeza sehemu ya tano, na kumpa mtu aliyekosewa. Kwa hiyo hapa neno linaonyesha wajibu wa kulipa, si sadaka yenyewe.
- issue: Kubadilika kutoka wingi kwenda umoja
  choice: kuhifadhi ‘wataungama’ kisha ‘naye atarudisha’
  alternative: kusawazisha sentensi yote iwe katika wingi au umoja
  rationale: Maandishi ya Kiebrania yanabadilika kutoka kitenzi cha wingi kwenda vitenzi vya umoja. Tafsiri inalinda mabadiliko hayo badala ya kuyaondoa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wataungama’ linafaa kwa muktadha wa kisheria na kidini; ‘aliyemkosea’ ni la kawaida zaidi kuliko kuiga moja kwa moja muundo mgumu wa Kiebrania. Alama zote za tanbihi zimewekwa mahali zinapofafanua.
