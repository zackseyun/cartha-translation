source:
  edition: WLC
  text: וְ/הֵבִ֨יא הָ/אִ֣ישׁ אֶת אִשְׁתּ/וֹ֮ אֶל הַ/כֹּהֵן֒ וְ/הֵבִ֤יא אֶת קָרְבָּנָ/הּ֙ עָלֶ֔י/הָ עֲשִׂירִ֥ת הָ/אֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא יִצֹ֨ק עָלָ֜י/ו שֶׁ֗מֶן וְ/לֹֽא יִתֵּ֤ן עָלָי/ו֙ לְבֹנָ֔ה כִּֽי מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/015.yaml
  text: 'Then the man shall bring his wife to the priest[a], and he shall bring her offering for her: a tenth of an ephah of barley flour. He shall pour no oil on it and put no frankincense on it, because it is a grain offering of jealousy[b], a memorial offering that brings iniquity to remembrance.'
translation:
  language: sw
  text: 'Kisha mwanamume huyo atamleta mke wake kwa kuhani, na ataleta sadaka yake kwa ajili yake: sehemu ya kumi ya efa ya unga wa shayiri. Asimimine mafuta juu yake wala asiweke ubani juu yake, kwa maana hiyo ni sadaka ya nafaka ya wivu, sadaka ya ukumbusho[a] inayokumbusha uovu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya kumbukumbu”; kirai cha Kiebrania kinaweza pia kutafsiriwa kwa namna ya karibu zaidi kuwa “sadaka ya ukumbusho.”
    reason: lexical_alternative
  - marker: b
    text: Au, “inayokumbusha hatia.” Neno la Kiebrania עָוֹן linaweza kumaanisha uovu, hatia, au dhima inayotokana na kosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא הָאִישׁ
  choice: Kisha mwanamume huyo atamleta
  rationale: Muundo huu wa kisheria una nguvu ya agizo. Wakati ujao wa Kiswahili unafaa kwa mtiririko wa maagizo, huku ‘mwanamume huyo’ ikihifadhi maana ya moja kwa moja ya הָאִישׁ bila kuingiza neno ‘mume’ mapema kuliko chanzo.
- source_word: אִשְׁתּוֹ אֶל־הַכֹּהֵן
  choice: mke wake kwa kuhani
  rationale: Katika muktadha wa ndoa אִשְׁתּוֹ ni ‘mke wake,’ na הַכֹּהֵן ni cheo cha ibada ‘kuhani.’
- source_word: קָרְבָּנָהּ עָלֶיהָ
  choice: sadaka ya mwanamke huyo kwa ajili yake
  rationale: Kiambishi cha kike katika קָרְבָּנָהּ kinaonyesha sadaka inayomhusu mwanamke, ingawa mwanamume ndiye anayeileta. Kurudia ‘mwanamke huyo’ kunaondoa utata usio wa chanzo kuhusu mwenye sadaka.
- source_word: עֲשִׂירִת הָאֵיפָה
  choice: sehemu ya kumi ya efa
  rationale: Huhifadhi kipimo cha kale kwa kutafsiri sehemu na kuandikwa kwa Kiswahili ‘efa’ badala ya kuweka makadirio yasiyo katika chanzo.
- source_word: קֶמַח שְׂעֹרִים
  choice: unga wa shayiri
  rationale: Huu ni usemi wa kawaida na unaoeleweka kwa unga uliotengenezwa kwa shayiri.
- source_word: לֹא־יִצֹק עָלָיו שֶׁמֶן
  choice: Asimimine mafuta juu yake
  rationale: יצק ni ‘kumimina’; umbo la kukataza linafaa kwa agizo la ibada.
- source_word: וְלֹא־יִתֵּן עָלָיו לְבֹנָה
  choice: wala asiweke ubani juu yake
  rationale: נתן hapa ni ‘kuweka,’ na לְבֹנָה ni utomvu wenye harufu unaotumiwa kama ubani; ‘ubani’ ni istilahi ya kawaida ya kibiblia ya Kiswahili.
- source_word: מִנְחַת קְנָאֹת
  choice: sadaka ya nafaka ya wivu
  rationale: Katika sheria za kikuhani מִנְחָה ni sadaka ya nafaka. ‘Wivu’ huhifadhi upana wa קְנָאֹת bila kuamua kimbele ikiwa mashaka hayo ni ya haki au la.
- source_word: מִנְחַת זִכָּרוֹן
  choice: sadaka ya ukumbusho
  rationale: זִכָּרוֹן hudokeza ukumbusho au tendo la kukumbusha. ‘Sadaka ya ukumbusho’ ni ya asili katika Kiswahili na mbadala wa karibu umewekwa katika tanbihi.
- source_word: מַזְכֶּרֶת עָוֹן
  choice: inayokumbusha uovu
  rationale: Kirai cha kisifa מַזְכֶּרֶת kinaonyeshwa kwa ‘inayokumbusha.’ ‘Uovu’ huhifadhi maana kuu ya עָוֹן, huku uwezekano wa ‘hatia’ au dhima kutokana na kosa ukielezwa katika tanbihi.
theological_decisions:
- issue: Ikiwa sadaka hii inathibitisha hatia ya mwanamke kabla ya ibada
  choice: Aya imetafsiriwa kama maelezo ya kazi ya sadaka bila kutangaza mapema kwamba mwanamke ana hatia.
  alternative: Kutafsiri sadaka kana kwamba tayari inathibitisha kosa lake, au kuifanya kuwa ishara tu isiyo na kazi ya hukumu.
  rationale: Chanzo kinaita sadaka hii sadaka ya ukumbusho inayokumbusha עָוֹן, lakini katika aya hii hakitoi uamuzi kuhusu hatia au kutokuwa na hatia kwa mwanamke. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka katika sheria ya ibada. Sentensi ni ya sasa na ya kawaida bila kuwa ya mazungumzo mno. Alama za tanbihi zimewekwa mara tu baada ya virai vinavyohusika, si baada ya ‘kuhani’ au ‘wivu,’ kwa sababu maelezo yenyewe yanahusu מִנְחַת זִכָּרוֹן na עָוֹן.
