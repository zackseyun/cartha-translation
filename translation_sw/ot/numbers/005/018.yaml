  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הֶעֱמִ֨יד הַ/כֹּהֵ֥ן אֶֽת הָ/אִשָּׁה֮ לִ/פְנֵ֣י יְהוָה֒ וּ/פָרַע֙ אֶת רֹ֣אשׁ הָֽ/אִשָּׁ֔ה וְ/נָתַ֣ן עַל כַּפֶּ֗י/הָ אֵ֚ת מִנְחַ֣ת הַ/זִּכָּר֔וֹן מִנְחַ֥ת קְנָאֹ֖ת הִ֑וא וּ/בְ/יַ֤ד הַ/כֹּהֵן֙ יִהְי֔וּ מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/018.yaml
  text: Then the priest shall set the woman before Yahweh, loosen the woman's hair, and place in her hands the grain offering of remembrance—it is a grain offering of jealousy—while in the priest's hand are the bitter waters that bring a curse.
translation:
  language: sw
  text: Kisha kuhani atamsimamisha huyo mwanamke mbele za Yahwe, atafungua nywele za mwanamke huyo[a], na ataweka mikononi mwake sadaka ya nafaka ya ukumbusho—hiyo ni sadaka ya nafaka ya wivu—na mkononi mwa kuhani kutakuwa na maji machungu yanayoleta laana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atafunua kichwa cha mwanamke huyo,” au, “ataziacha nywele za mwanamke huyo zining’inie.” Nahau ya Kiebrania inataja “kichwa” cha mwanamke na huenda ikarejelea kufunguliwa kwa nywele zake kama sehemu ya ibada.
    reason: lexical_alternative
  - marker: b
    text: Au, “maji machungu yanayoleta ile laana.” Kitenzi-shiriki cha Kiebrania kinaweza kueleweka kuwa kinaeleza maji yanayosababisha au kubeba laana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: atamsimamisha
  rationale: Hifili ya עמד humaanisha kumfanya mtu asimame au kumweka rasmi mbele ya mwingine; “atamsimamisha” huhifadhi tendo halisi la ibada kwa Kiswahili cha kawaida.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Ni usemi wa ibada unaomaanisha kuwa katika uwepo wa Yahwe; jina la agano יְהוָה limetafsiriwa moja kwa moja kuwa “Yahwe.”
- source_word: וּפָרַע אֶת רֹאשׁ הָאִשָּׁה
  choice: atafungua nywele za mwanamke huyo
  rationale: Kitenzi פרע pamoja na “kichwa” kinaweza kumaanisha kufunua kichwa au kuziacha nywele bila kufungwa. Katika muktadha huu, “atafungua nywele” ni tafsiri ya asili inayowasilisha kitendo kinachowezekana zaidi bila kuficha utata.
- source_word: וְנָתַן עַל כַּפֶּיהָ
  choice: kuweka mikononi mwake
  rationale: Ingawa maana halisi ni kuweka juu ya viganja vyake, “mikononi mwake” ni Kiswahili cha kawaida kinachohifadhi ishara halisi ya ibada.
- source_word: מִנְחַת הַזִּכָּרוֹן
  choice: sadaka ya nafaka ya ukumbusho
  rationale: מִנְחָה katika muktadha wa kikuhani ni sadaka ya nafaka, na זִכָּרוֹן ni ukumbusho; muundo huu ni wazi na huhifadhi uhusiano wa maneno hayo.
- source_word: מִנְחַת קְנָאֹת הִוא
  choice: hiyo ni sadaka ya nafaka ya wivu
  rationale: Ingawa קְנָאֹת ni wingi kimaumbo, hapa lina dhana ya hali ya wivu; kurudia “sadaka ya nafaka” huhifadhi uradidi na ufafanuzi wa Kiebrania.
- source_word: וּבְיַד הַכֹּהֵן יִהְיוּ
  choice: nayo mikononi mwa kuhani yatakuwa
  rationale: Kishazi kinaeleza kwa kuandamana kile ambacho kuhani anashika wakati wa ibada. Kiswahili hutumia “mikononi” kwa kawaida hata pale Kiebrania kinapotumia umoja “mkono.”
- source_word: מֵי הַמָּרִים
  choice: maji machungu
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kishazi cha Kiebrania, huku ikihifadhi wingi wa neno “maji.”
- source_word: הַמְאָרֲרִים
  choice: yanayoleta laana
  rationale: Kivumishi-tendo kutoka ארר kinaonyesha maji yanayosababisha au kubeba laana; “yanayoleta laana” ni cha asili na huhifadhi maana ya kisababishi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מִנְחַת קְנָאֹת
  choice: sadaka ya nafaka ya wivu
  alternative: sadaka ya nafaka inayohusiana na mashaka ya wivu; sadaka ya wivu
  rationale: Tafsiri ya “wivu” huhifadhi mvutano wa neno קנאה, ambalo katika muktadha huu linaweza kuhusisha wivu au shaka ya mume, bila kuamua mapema kuwa mwanamke ana hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Kuhani,” “sadaka ya nafaka,” “ukumbusho,” na “laana” ni istilahi wazi za ibada; utata wa kitendo kinachohusu kichwa au nywele umehifadhiwa katika tanbihi.
