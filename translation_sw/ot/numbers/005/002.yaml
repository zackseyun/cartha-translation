  variant: Standard East African Swahili
source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וִֽ/ישַׁלְּחוּ֙ מִן הַֽ/מַּחֲנֶ֔ה כָּל צָר֖וּעַ וְ/כָל זָ֑ב וְ/כֹ֖ל טָמֵ֥א לָ/נָֽפֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/002.yaml
  text: Command the sons of Israel that they send out of the camp everyone with a skin disease[a], and everyone with a discharge[b], and everyone unclean by a dead body.
translation:
  language: sw
  text: Waamuru wana wa Israeli wawatoe kambini kila mtu mwenye ugonjwa wa ngozi[a], kila mtu anayetokwa na majimaji mwilini, na kila mtu aliye najisi kwa sababu ya maiti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye ukoma.” Neno la Kiebrania linarejelea kwa upana hali ya ngozi katika sheria za unajisi wa kiibada; si lazima limaanishe ugonjwa unaoitwa ukoma leo.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Waamuru
  rationale: Kitenzi cha amri katika umoja kinachoelekezwa kwa Musa; “waamuru” kinahifadhi uzito wa agizo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania “wana wa Israeli,” unaowarejelea kwa pamoja watu wa agano.
- source_word: וִישַׁלְּחוּ מִן הַמַּחֲנֶה
  choice: wawatoe kambini
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kuwaondoa watu kutoka ndani ya kambi bila kuongeza wazo la adhabu.
- source_word: כָּל צָרוּעַ
  choice: watu wote wenye ugonjwa wa ngozi
  rationale: Neno hilo katika sheria za unajisi linahusu maradhi mazito ya ngozi kwa upana, wala si lazima ukoma wa kisasa.
- source_word: וְכָל זָב
  choice: wote wenye utoko
  rationale: “Utoko” huonyesha majimaji yasiyo ya kawaida yanayotoka mwilini katika muktadha wa sheria za utakaso.
- source_word: וְכֹל טָמֵא לָנָפֶשׁ
  choice: wote walio najisi kwa sababu ya maiti
  rationale: Hutoa maana ya nahau ya Kiebrania inayohusu unajisi unaotokana na maiti, kwa lugha ya kawaida na iliyo wazi.
theological_decisions:
- issue: Istilahi ya unajisi wa kiibada
  choice: najisi
  alternative: asiye safi
  rationale: “Najisi” huonyesha hadhi ya kiibada katika sheria ya kambi bila kudokeza moja kwa moja kosa la kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa orodha na nguvu ya amri vimehifadhiwa.
