base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/026.yaml
  text: Then the priest shall take a handful from the grain offering[a], its memorial portion, and burn it on the altar; afterward he shall make the woman drink the water.
translation:
  language: sw
  text: Kisha kuhani atatwaa konzi moja kutoka katika sadaka ya nafaka, yaani sehemu yake ya ukumbusho, na kuiteketeza juu ya madhabahu. Baada ya hayo atamnywesha mwanamke yale maji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika muktadha mpana, haya yanatambulishwa kuwa “maji machungu”; lakini mstari huu wenyewe unasema tu “maji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמַץ
  choice: atatwaa konzi moja
  rationale: Katika muktadha wa dhabihu, kitenzi קמץ humaanisha kutwaa kiasi kinachojaza konzi. Kauli hii ni ya kawaida na inaonyesha tendo maalumu la ibada.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika muktadha wa ibada na sheria.
- source_word: מִן הַמִּנְחָה
  choice: kutoka katika sadaka ya nafaka
  rationale: Katika sheria za kikuhani, מִנְחָה ni sadaka inayotokana na nafaka, si zawadi ya jumla tu.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: sehemu yake ya ukumbusho
  rationale: אַזְכָּרָה ni sehemu ya sadaka ya nafaka inayoteketezwa madhabahuni kama sehemu ya ukumbusho; kiambishi cha umilikaji kinarejelea sadaka hiyo.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: na kuiteketeza juu ya madhabahu
  rationale: Katika matumizi ya dhabihu, הקטיר hueleza kuchoma sadaka madhabahuni. Kiwakilishi 'i' kinarejelea sehemu ya ukumbusho, na הַמִּזְבֵּחָה inaelezwa kwa kawaida kuwa 'juu ya madhabahu.'
- source_word: וְאַחַר
  choice: Baada ya hayo
  rationale: Kirai hiki kinaonyesha hatua inayofuata baada ya sehemu ya sadaka kuteketezwa.
- source_word: יַשְׁקֶה
  choice: atamnywesha
  rationale: Hifili ya שׁקה ina maana ya kusababisha mtu anywe; 'atamnywesha' huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: אֶת הָאִשָּׁה
  choice: mwanamke
  rationale: Huyu ndiye mtendwa wa kitenzi cha kusababisha kunywa.
- source_word: אֶת הַמָּיִם
  choice: yale maji
  rationale: Kiebrania cha mstari huu kinasema tu 'maji.' Kionyeshi 'yale' kinaonyesha maji yaliyokwisha tajwa katika muktadha bila kuongeza sifa ya 'machungu' ambayo haipo katika mstari wenyewe.
theological_decisions:
- issue: Iwapo maji yataitwa 'maji machungu' katika matini kuu kwa kutegemea muktadha wa ibada
  choice: Kuhifadhi usemi rahisi 'yale maji'
  alternative: maji machungu
  rationale: Mstari wenyewe una הַמָּיִם, yaani 'maji,' bila kivumishi 'machungu.' Kutokitaja katika matini kuu kunahifadhi mipaka ya ushahidi wa mstari, huku tanbihi ikifafanua utambulisho wake katika muktadha mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya matini ya ibada lakini kinachoeleweka kwa msomaji wa kawaida. 'Konzi moja,' 'sadaka ya nafaka,' na 'sehemu yake ya ukumbusho' huhifadhi istilahi na hatua za ibada bila kufanya sentensi kuwa ngumu kupita kiasi. Alama ya tanbihi imewekwa baada ya 'maji,' ambako maelezo yake yanahusika moja kwa moja.
