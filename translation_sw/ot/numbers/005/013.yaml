base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/013.yaml
  text: and a man lies with her[a], with an emission of seed, and it is hidden from the eyes of her husband, and she is concealed, and she has become unclean, and there is no witness against her[c][b], and she was not caught—
translation:
  language: sw
  text: na mwanamume akilala naye kwa kumwaga shahawa[a], na jambo hilo likafichika machoni pa mumewe, naye akafichika, na akawa najisi; wala hakuna shahidi dhidi yake[b], naye hakukamatwa[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa halisi, “kulala kwa mbegu,” yaani, kujamiiana kunakohusisha utoaji wa shahawa.
    reason: lexical_alternative
  - marker: b
    text: Au, “wala hakuna shahidi kuhusu yeye.”
    reason: alternative_reading
  - marker: c
    text: Au, “hakushikwa.” Wengine huelewa “kushikwa” hapa kuwa kushikwa kwa nguvu, na hivyo kifungu hiki kuwa “hakulazimishwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַב אִישׁ אֹתָהּ
  choice: na mwanamume mwingine akalala naye
  rationale: Katika muktadha wa kingono, שׁכב ... את פירושו kulala na mtu. Neno “mwingine” linaweka wazi kwa Kiswahili kwamba huyu si mume aliyetajwa baadaye, bila kubadili hali ya kisheria.
- source_word: שִׁכְבַת זֶרַע
  choice: na kutoa shahawa
  rationale: Kirai hiki kwa halisi kinahusisha kulala kwa mbegu na hapa kinaonyesha tendo la kujamiiana lenye utoaji wa shahawa; tafsiri hii inahifadhi umuhimu wake katika sheria ya unajisi.
- source_word: וְנֶעְלַם מֵעֵינֵי אִישָׁהּ
  choice: lakini jambo hilo likafichika machoni pa mumewe
  rationale: Inahifadhi hali ya kutendwa na nahau ya Kiebrania “machoni pa,” huku “jambo hilo” likifanya rejeo lieleweke kwa Kiswahili.
- source_word: וְנִסְתְּרָה
  choice: naye mwanamke huyo akawa amejificha
  rationale: Nifali inaweza kuwa na maana ya kujificha au kufichwa. “Akawa amejificha” ni ya asili katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa hali ya kutendwa.
- source_word: וְהִיא נִטְמָאָה
  choice: na kujitia unajisi
  rationale: טמא katika muktadha huu ni kuwa najisi. Muundo huu unaonyesha hali iliyotokana na tendo bila kuingiza istilahi ya dhehebu.
- source_word: וְעֵד אֵין בָּהּ
  choice: wala hakuna shahidi dhidi yake
  rationale: “Dhidi yake” inaonyesha nguvu ya kisheria ya ushahidi; tanbihi inahifadhi maana pana zaidi ya “kuhusu yeye.”
- source_word: וְהִוא לֹא נִתְפָּשָׂה
  choice: naye hakukamatwa
  rationale: Katika muktadha huu נתפשׂ yaelekea kumaanisha kukamatwa au kufumaniwa. Tafsiri mbadala ya kushikwa kwa nguvu imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Lugha ya unajisi katika נִטְמָאָה
  choice: kujitia unajisi
  alternative: kuwa najisi; kunajisiwa
  rationale: “Unajisi” huhifadhi kundi la kisheria na kiibada la kifungu bila kulifanya kuwa kauli ya kiitikadi iliyo na uzito wa ziada.
- issue: Maana ya לֹא נִתְפָּשָׂה
  choice: hakukamatwa
  alternative: hakushikwa; hakulazimishwa
  rationale: Muktadha wa kutokuwapo shahidi unaunga mkono maana ya kutokufumaniwa au kutokukamatwa. Hata hivyo, uwezekano wa “kushikwa” na hivyo kueleweka kuwa hakulazimishwa haupaswi kufutwa, kwa hiyo umetajwa katika tanbihi.
- issue: Sauti ya וְנִסְתְּרָה
  choice: akawa amejificha
  alternative: akawa amefichwa; jambo hilo likawa la siri
  rationale: Kitenzi cha Nifali kinaweza kusikika kama cha kujirejelea au cha kutendwa. Matini kuu inatumia Kiswahili cha kawaida, na tanbihi inahifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kisheria lakini kinachoeleweka kwa msomaji wa kawaida. Alama zote za tanbihi [a], [b], na [c] zimewekwa katika matini kuu.
