  yaml_path: translation/ot/numbers/005/023.yaml
  text: Then the priest shall write these curses in the scroll and wash them off into the bitter water[a][b].
translation:
  language: sw
  text: Kisha kuhani ataandika laana hizi[a] katika gombo, kisha atazipangusa katika maji machungu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “laana hizi za kiapo.” Neno la Kiebrania linaweza kumaanisha laana inayohusishwa na kiapo.
    reason: lexical_alternative
  - marker: b
    text: Au, “atazifuta” au “atazibatilisha kwa kupangusa.” Kitenzi cha Kiebrania hurejelea kufuta au kupangusa maandishi yaliyoandikwa; katika muktadha huu yanaondolewa katika maji machungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַב
  choice: Kisha ... ataandika
  rationale: Kauli timilifu ya Kiebrania yenye kiunganishi katika mfululizo wa maagizo ya ibada ina nguvu ya hatua inayofuata; Kiswahili cha wakati ujao kinafaa katika muktadha huu.
- source_word: הָאָלֹת הָאֵלֶּה
  choice: laana hizi
  rationale: Neno אָלָה linaweza kumaanisha laana inayohusishwa na kiapo. Hapa maneno yaliyoandikwa ni adhabu zilizotamkwa, hivyo ‘laana hizi’ ni wazi, huku maana ya kiapo ikihifadhiwa katika tanbihi.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mhudumu wa ibada anayetekeleza utaratibu huu.
- source_word: בַּסֵּפֶר
  choice: katika hati
  rationale: סֵפֶר hapa ni nyenzo au hati ya kuandikia, si lazima kitabu cha kisasa kilichofungwa. ‘Hati’ ni ya asili na haibainishi isivyo lazima kwamba ilikuwa gombo.
- source_word: וּמָחָה
  choice: na atazifuta
  rationale: Kitenzi מחה humaanisha kufuta, kupangusa, au kuondoa maandishi. ‘Atazifuta’ huhifadhi tendo la kuondoa maneno yaliyoandikwa bila kuongeza namna ya tendo kuliko chanzo.
- source_word: אֶל מֵי הַמָּרִים
  choice: kwa maji machungu
  rationale: Katika Kiswahili, kufuta maandishi ‘kwa maji’ huonyesha maji yaliyotumika kuyaondoa na ambayo yanayapokea. Hii ni ya asili kuliko ‘ndani ya maji’ baada ya kitenzi ‘kufuta,’ huku uhamisho kwenda majini ukielezwa katika tanbihi.
