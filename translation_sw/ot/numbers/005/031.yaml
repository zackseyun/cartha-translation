  yaml_path: translation/ot/numbers/005/031.yaml
  text: Then the man will be free from guilt[b][a], but that woman will bear her guilt.
translation:
  language: sw
  text: Mwanamume huyo[a] atakuwa huru kutokana na hatia, lakini mwanamke huyo atabeba hatia yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mume huyo atakuwa huru kutokana na hatia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “atabeba uovu wake”; nahau ya Kiebrania inaweza pia kumaanisha kubeba matokeo ya hatia yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקָּה
  choice: atakuwa huru
  rationale: Nifali ya נקה inaonyesha kuwa huru au kuondolewa katika uwajibikaji. ‘Atakuwa huru’ ni Kiswahili cha kawaida na huhifadhi maana bila kuifanya sentensi iwe ya kimahakama kupita kiasi.
- source_word: הָאִישׁ
  choice: mwanamume huyo
  rationale: אִישׁ maana yake ya msingi ni ‘mwanamume’; katika muktadha huyu ndiye mume. Neno ‘huyo’ linasaidia kurejelea mhusika anayezungumziwa kwa kawaida katika Kiswahili.
- source_word: מֵעָוֺן
  choice: kutokana na hatia
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au uwajibikaji na matokeo yake. Pamoja na נקה, ‘kutokana na hatia’ huonyesha kuondolewa kwa hatia au uwajibikaji bila kubana maana kuwa adhabu pekee.
- source_word: וְהָאִשָּׁה הַהִוא
  choice: lakini mwanamke huyo
  rationale: 'Ingawa וְ inaweza kuwa ‘na’, hapa vifungu vinakinzana: mwanamume yuko huru na mwanamke anabeba hatia yake. ‘Lakini’ huonyesha ulinganisho huo kwa Kiswahili cha kawaida, na ‘huyo’ huwakilisha msisitizo wa הַהִוא.'
- source_word: תִּשָּׂא אֶת עֲוֺנָהּ
  choice: atabeba hatia yake
  rationale: Nahau נשׂא עָוֹן humaanisha kubeba hatia, mara nyingi pamoja na matokeo yake. Tafsiri hii huhifadhi nahau na upana wake badala ya kuifafanua kuwa adhabu tu.
theological_decisions:
- issue: Maana ya עָוֹן katika vifungu vyote viwili
  choice: Kutumia ‘hatia’ katika sehemu zote mbili ili kudumisha ulinganifu wa kimaadili na kisheria.
  alternative: ‘uovu’ au ‘adhabu ya uovu’
  rationale: Mstari unatofautisha kuwa huru kwa mwanamume kutokana na uwajibikaji na kubeba uwajibikaji kwa mwanamke. ‘Hatia’ huhifadhi ulinganifu huo na haiondoi uwezekano kwamba kubeba hatia kunahusisha pia matokeo yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo ‘atabeba hatia yake’ umehifadhiwa ili kuonyesha nahau na mvutano wa kimaadili na kisheria wa Kiebrania.
