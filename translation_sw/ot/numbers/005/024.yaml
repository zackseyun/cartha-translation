  yaml_path: translation/ot/numbers/005/024.yaml
  text: Then he shall make the woman drink the bitter water that brings a curse[b][a], and the curse-bringing water shall enter into her bitterly.
translation:
  language: sw
  text: Kisha atamnywesha huyo mwanamke maji machungu yanayoleta laana,[a] nayo maji yanayoleta laana yataingia ndani yake na kusababisha uchungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa muundo wa karibu zaidi na Kiebrania, “maji ya uchungu yanayoleta laana.”
    reason: lexical_alternative
  - marker: b
    text: Au “yataingia ndani yake na kuleta uchungu.” Kirai cha Kiebrania kinaeleza matokeo au athari ya maji hayo.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁקָה
  choice: Kisha atamnywesha
  rationale: Hifili ya שׁקה ina maana ya kumsababisha au kumpa mtu anywe. “Atamnywesha” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kisababishi.
- source_word: הָאִשָּׁה
  choice: huyo mwanamke
  rationale: Nomino hii ni bayana. “Huyo” inafaa katika muktadha kwa sababu mwanamke ametajwa tayari katika ibada hii.
- source_word: מֵי הַמָּרִים
  choice: maji machungu
  rationale: Kirai hiki ni, kwa muundo, “maji ya uchungu.” Kiswahili hutumia “maji” kama nomino ya wingi, na “maji machungu” ni usemi wa asili unaohifadhi sifa ya uchungu.
- source_word: הַמְאָֽרֲרִים / הַמְאָרֲרִים
  choice: yanayoleta laana
  rationale: Kivumishi-tendo kutoka ארר kinaeleza maji kwa kazi au athari yake ya kuleta laana, si lazima kwamba maji yenyewe yamelaaniwa. Uamuzi huu umehifadhiwa katika sehemu zote mbili ambako neno hilo limerudiwa.
- source_word: וּבָאוּ בָהּ
  choice: yataingia ndani yake
  rationale: בוא pamoja na ב hapa huonyesha kuingia ndani ya mwanamke. Tafsiri hii ni wazi na ya karibu na muundo wa Kiebrania bila kufafanua sehemu mahususi ya mwili.
- source_word: לְמָרִים
  choice: na kusababisha uchungu
  rationale: לְ inaweza kuonyesha matokeo au athari. “Na kusababisha uchungu” ni ya asili katika Kiswahili na haifafanui kimwili zaidi ya maandishi yenyewe; uwezekano wa tafsiri rasmi zaidi umewekwa katika tanbihi.
theological_decisions:
- issue: Asili ya lugha ya laana katika jaribio hili
  choice: Maji yameelezwa kuwa “yanayoleta laana.”
  alternative: “maji yaliyolaaniwa”
  rationale: Kitenzi-shirikishi cha Kiebrania kutoka ארר kinaweza kueleza kazi ya maji katika kuleta au kutekeleza laana. Tafsiri hii huepuka kuingiza dhana ya kwamba maji yana nguvu za kichawi yenyewe, huku ikihifadhi uzito wa laana katika ibada ya hukumu.
- issue: Maana ya לְמָרִים mwishoni mwa mstari
  choice: “na kusababisha uchungu” kama matokeo
  alternative: “kwa uchungu” au “kuwa uchungu”
  rationale: Kihusishi לְ kinaweza kuonyesha matokeo, lakini kirai cha Kiebrania ni kifupi na kinaweza kutafsiriwa kwa namna rasmi zaidi. Maandishi makuu yanatoa Kiswahili kinachoeleweka, na tanbihi inahifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Marudio ya “maji yanayoleta laana” yamehifadhiwa kwa sababu yapo katika Kiebrania na yana uzito wa kimakusudi. Sentensi imeepuka istilahi za kimadhehebu na maelezo ya kisaikolojia au kifiziolojia yasiyosemwa wazi na chanzo.
