  yaml_path: translation/ot/numbers/005/010.yaml
  text: And each man's holy gifts shall be his[b][a]; whatever a man gives to the priest shall be his.
translation:
  language: sw
  text: Na vitu vitakatifu vya kila mtu vitakuwa vyake[a]; chochote ambacho mtu atampa kuhani kitakuwa cha kuhani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri halisi zaidi, “vitu vyake vitakatifu.” Maneno haya yanarejelea vitu vilivyowekwa wakfu kuwa matoleo matakatifu.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa tafsiri halisi, “kitakuwa chake.” “Chake” hapa kinamrejelea kuhani: kile ambacho mtu anampa kuhani kinakuwa cha kuhani.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: kila mtu / mtu
  rationale: Nomino ya kiume katika muktadha huu wa sheria ina maana ya mgawanyo, yaani kila mmoja. Kiswahili sanifu hutumia “mtu” kwa kawaida bila kupoteza maana hiyo; matumizi ya kwanza ni “kila mtu,” na ya pili ni “mtu.”
- source_word: קֳדָשָׁיו
  choice: vitu vitakatifu vya kila mtu
  rationale: Wingi huu unarejelea vitu vilivyowekwa wakfu kuwa matoleo matakatifu. “Vitu vitakatifu” ni tafsiri ya karibu inayohifadhi upana wa neno la Kiebrania bila kulifungia kwa aina moja ya zawadi.
- source_word: לוֹ יִהְיוּ
  choice: vitakuwa vyake
  rationale: Muundo huu unaonyesha umiliki. “Vitakuwa vyake” huhifadhi ufupi wa Kiebrania na kutafsiri wingi wa kitenzi kulingana na “vitu vitakatifu.”
- source_word: אֲשֶׁר יִתֵּן לַכֹּהֵן
  choice: chochote ambacho mtu atampa kuhani
  rationale: Kishazi husika kina nguvu ya jumla katika sheria. “Chochote ambacho” huonyesha maana hiyo iliyo wazi, na “atampa kuhani” ni Kiswahili cha asili kinachohifadhi mpokeaji.
- source_word: לוֹ יִהְיֶה
  choice: kitakuwa cha kuhani
  rationale: Kirai kinaonyesha umiliki. Badala ya kiwakilishi cha Kiebrania chenye rejeleo linaloweza kuhitaji ufafanuzi, “cha kuhani” hutaja wazi mhusika anayerejelewa katika muktadha wa karibu.
theological_decisions:
- issue: Mhusika anayerejelewa na לוֹ ya mwisho
  choice: cha kuhani
  alternative: kitakuwa chake
  rationale: Kisarufi, kiwakilishi ni “chake,” lakini mtangulizi wa karibu ni kuhani, na muktadha unaeleza kuwa kilichotolewa kwake huwa mali yake. Tafsiri kuu inaweka rejeleo hilo wazi, huku tanbihi ikihifadhi umbo halisi zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Muundo wa sheria na urudiaji wa wazo la umiliki umehifadhiwa; “vitu vitakatifu” limetumiwa ili kudumisha upana wa istilahi ya ibada.
