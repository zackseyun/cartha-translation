  text: וְ/הִשְׁבִּ֨יעַ הַ/כֹּהֵ֥ן אֶֽת הָֽ/אִשָּׁה֮ בִּ/שְׁבֻעַ֣ת הָ/אָלָה֒ וְ/אָמַ֤ר הַ/כֹּהֵן֙ לָֽ/אִשָּׁ֔ה יִתֵּ֨ן יְהוָ֥ה אוֹתָ֛/ךְ לְ/אָלָ֥ה וְ/לִ/שְׁבֻעָ֖ה בְּ/ת֣וֹךְ עַמֵּ֑/ךְ בְּ/תֵ֨ת יְהוָ֤ה אֶת יְרֵכֵ/ךְ֙ נֹפֶ֔לֶת וְ/אֶת בִּטְנֵ֖/ךְ צָבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/021.yaml
  text: Then the priest shall make the woman swear with the oath of the curse[a], and the priest shall say to the woman, “May Yahweh make you a curse and an oath among your people[c][b], when Yahweh makes your thigh waste away and your abdomen swell.”
translation:
  language: sw
  text: Kisha kuhani atamwapisha mwanamke kwa kiapo cha laana[a], naye kuhani atamwambia mwanamke, “Yahweh akufanye kuwa laana na kiapo miongoni mwa watu wako, wakati Yahweh atakapofanya paja lako linyauke[b] na tumbo lako livimbe[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli hii inaweza pia kueleweka kwa maana ya kumfanya awe mfano unaotajwa watu wanapolaani na kuapa.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno moja moja, Kiebrania kinasema “paja lako lianguke.” Ni usemi mgumu ambao huenda unahusu kunyauka au kusinyaa kwa sehemu hiyo ya mwili, au ni usemi wa staha unaohusu viungo vya uzazi.
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania linaweza kumaanisha “tumbo,” na katika baadhi ya miktadha “tumbo la uzazi.” Athari kamili ya kitabibu au ya uzazi inayoelezwa katika laana hii haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: atamwapisha
  rationale: Hifili ya שׁבע ina maana ya kumsababisha mtu aape; ‘atamwapisha’ ni Kiswahili cha kawaida chenye uzito wa kisheria na kiibada.
- source_word: בִּשְׁבֻעַת הָאָלָה
  choice: kwa kiapo cha laana
  rationale: Kauli hii inahifadhi vipengele vyote viwili vya Kiebrania, yaani kiapo na laana, katika muundo wa Kiswahili unaoeleweka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: לְאָלָה וְלִשְׁבֻעָה
  choice: kuwa laana na kiapo
  rationale: Tafsiri hii inafuata kwa karibu kauli rasmi ya Kiebrania na kuacha maana yake ya kuwa mfano unaotajwa katika kulaani na kuapa ielezwe katika tanbihi.
- source_word: בְּתוֹךְ עַמֵּךְ
  choice: miongoni mwa watu wako
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi hali ya jambo hili kujulikana katika jumuiya.
- source_word: בְּתֵת
  choice: wakati ... atakapofanya
  rationale: Muundo huu unaonyesha mazingira au wakati wa kutimizwa kwa laana kwa Kiswahili cha kawaida.
- source_word: יְרֵךְ
  choice: paja
  rationale: ‘Paja’ ndiyo maana ya moja kwa moja, ingawa neno la Kiebrania linaweza kutumiwa kwa staha kuhusu viungo vya uzazi; uwezekano huo umewekwa katika tanbihi.
- source_word: נֹפֶלֶת
  choice: linyauke
  rationale: Kitenzi kwa asili kina wazo la kuanguka, lakini katika laana hii huenda kinaonyesha kudhoofika, kusinyaa, au kuharibika kwa sehemu hiyo ya mwili. ‘Linyauke’ ni cha asili kwa Kiswahili bila kudai hali mahususi ya kitabibu.
- source_word: בִּטְנֵךְ
  choice: tumbo lako
  rationale: בטן inaweza kumaanisha tumbo au tumbo la uzazi. ‘Tumbo’ ni neno la kawaida na pana lisilolazimisha tafsiri moja ya kitabibu au ya uzazi.
- source_word: צָבָה
  choice: livimbe
  rationale: Neno hili linaeleza kuvimba au kutuna; ‘livimbe’ ni wazi na la kawaida katika muktadha huu.
theological_decisions:
- issue: Jinsi ya kutafsiri kwa umahususi laana ya mwili katika kifungu chenye utata wa kimatibabu na kiuzazi
  choice: Kuhifadhi taswira ya paja kunyauka na tumbo kuvimba bila kuitaja moja kwa moja kuwa kuharibika kwa mimba au utasa.
  alternative: Kutafsiri kuwa tumbo la uzazi linaharibika, mimba inaharibika, au mwanamke anakuwa tasa.
  rationale: Maneno ya Kiebrania ni magumu na yamejadiliwa kwa namna mbalimbali. Tafsiri kuu haipaswi kuingiza uchunguzi mahususi wa kitabibu au fundisho la uzazi lisilosemwa wazi; uwezekano huo unaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na uzito wa kiibada. Muundo wa baraka/laana ‘Yahweh na akufanye’ umetumiwa kudumisha sauti rasmi ya tamko, huku tanbihi zikihifadhi utata wa maneno ya mwili.
