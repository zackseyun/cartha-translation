  text: וְ/הִשְׁקָ֣/הּ אֶת הַ/מַּ֗יִם וְ/הָיְתָ֣ה אִֽם נִטְמְאָה֮ וַ/תִּמְעֹ֣ל מַ֣עַל בְּ/אִישָׁ/הּ֒ וּ/בָ֨אוּ בָ֜/הּ הַ/מַּ֤יִם הַ/מְאָֽרֲרִים֙ לְ/מָרִ֔ים וְ/צָבְתָ֣ה בִטְנָ֔/הּ וְ/נָפְלָ֖ה יְרֵכָ֑/הּ וְ/הָיְתָ֧ה הָ/אִשָּׁ֛ה לְ/אָלָ֖ה בְּ/קֶ֥רֶב עַמָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/027.yaml
  text: When he makes her drink the water[a], then if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse will enter her for bitterness, and her belly will swell and her thigh will waste away[b], and the woman will become a curse among her people.
translation:
  language: sw
  text: Naye atakapomnywesha hayo maji, ikiwa mwanamke huyo amejitia unajisi na kumkosea uaminifu mume wake, maji hayo yaletayo laana yataingia ndani yake kwa machungu[a]; tumbo lake litavimba, na paja lake litanyauka[b]. Mwanamke huyo atakuwa laana miongoni mwa watu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maji yaletayo laana yataingia ndani yake yakiwa machungu.” Kirai cha Kiebrania kinachotafsiriwa “kwa machungu” ni kigumu; huenda kinaeleza athari ya maji au hali yake.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “paja lake litaanguka.” Huenda usemi huu ni tasfida ya ugonjwa mkali unaoathiri viungo vya uzazi, lakini maana yake kamili haijulikani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָהּ אֶת־הַמַּיִם
  choice: Naye atakapomnywesha hayo maji
  rationale: Hifili ya שׁקה ina maana ya kumnywesha au kumsababisha anywe. Muundo wa wakati unaingiza matokeo yanayofuata kwa Kiswahili cha kawaida.
- source_word: נִטְמְאָה
  choice: amejitia unajisi
  rationale: Nifali ya טמא hapa hudokeza kuwa amekuwa najisi; katika muktadha wa tendo la ndoa lisilo halali, usemi huu unahifadhi vipengele vya kimaadili na vya kiibada.
- source_word: וַתִּמְעֹל מַעַל בְּאִישָׁהּ
  choice: kumkosea uaminifu mume wake
  rationale: Muundo wa mzizi unaorudiwa מעל hukazia kuvunja uaminifu; tafsiri hii ni ya kawaida na inaonyesha kosa lililoelekezwa dhidi ya mume.
- source_word: הַמַּיִם הַמְאָרֲרִים
  choice: maji hayo yaletayo laana
  rationale: Kirai hiki kinaeleza maji kuwa chombo kinacholeta au kutekeleza laana.
- source_word: לְמָרִים
  choice: na kumletea uchungu
  rationale: Kirai hiki ni kigumu na kinaweza kueleza athari chungu ya maji. 'Kumletea uchungu' ni wazi bila kuamua kama kinataja ladha au mateso.
- source_word: וְצָבְתָה בִטְנָהּ
  choice: tumbo lake litavimba
  rationale: בטן ni tumbo au sehemu ya ndani ya tumbo; 'tumbo' halibainishi kimakosa kuwa ni tumbo la uzazi.
- source_word: וְנָפְלָה יְרֵכָהּ
  choice: paja lake litanyauka
  rationale: Kiebrania halisi husema paja lake litaanguka, lakini kirai hicho huenda ni tasfida ya ugonjwa mkali wa viungo vya uzazi. 'Litanyauka' huwasilisha kudhoofika bila kubainisha hali ya kitabibu.
- source_word: וְהָיְתָה הָאִשָּׁה לְאָלָה בְּקֶרֶב עַמָּהּ
  choice: Mwanamke huyo atakuwa laana miongoni mwa watu wake
  rationale: Huhifadhi wazo kwamba mwanamke atakuwa mfano au kauli ya kulaania mbele ya jumuiya yake.
theological_decisions:
- issue: Maana halisi ya madhara ya mwili katika kanuni ya jaribio
  choice: tumbo lake litavimba, na paja lake litanyauka
  alternative: tumbo lake la uzazi litaharibika; au viungo vyake vya uzazi vitanyauka
  rationale: Maneno ya Kiebrania ni halisi kwa sehemu lakini yanaweza pia kuwa tasfida, na athari kamili ya kifiziolojia haijulikani. Tafsiri kuu inabaki karibu na picha ya Kiebrania bila kuingiza kwa uhakika kuharibika kwa mimba, utasa, au utambuzi mwingine wa kitabibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Unajisi,' 'laana,' na 'paja' huhifadhi msamiati na picha za matini huku maelezo ya chini yakionyesha kutokuwa na uhakika kwa vifungu vigumu.
