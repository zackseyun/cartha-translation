base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/025.yaml
  text: Then the priest shall take from the woman’s hand the grain offering of jealousy, and he shall wave the grain offering before Yahweh and bring it near to the altar.
translation:
  language: sw
  text: Kisha kuhani atachukua kutoka mkononi mwa huyo mwanamke sadaka ya nafaka ya wivu, naye ataitikisa sadaka hiyo ya nafaka mbele za Yahweh na kuileta karibu na madhabahu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha ... atachukua
  rationale: Waw pamoja na qatal inaendeleza mfuatano wa hatua za ibada; “Kisha” na wakati ujao vinaonyesha hatua inayofuata iliyoagizwa kwa Kiswahili cha kawaida.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mhudumu wa kikuhani; muktadha na mpangilio wa sentensi huifanya nomino kuwa maalumu bila kuhitaji kibainishi tofauti.
- source_word: מִיַּד הָאִשָּׁה
  choice: kutoka mkononi mwa huyo mwanamke
  rationale: Inahifadhi taswira ya Kiebrania ya kupokea sadaka moja kwa moja kutoka mkononi mwa mwanamke, huku “huyo” ikimrejelea mwanamke aliyetajwa katika muktadha.
- source_word: מִנְחַת הַקְּנָאֹת
  choice: sadaka ya nafaka ya wivu
  rationale: “Sadaka ya nafaka” huonyesha aina maalumu ya dhabihu, na “ya wivu” huhifadhi muundo wa uhusiano wa maneno na jina la ibada katika kifungu hiki.
- source_word: וְהֵנִיף
  choice: ataitikisa
  rationale: Hiphil ya נוף katika muktadha wa dhabihu inaeleza mwendo wa kiibada wa kuitikisa sadaka; kitenzi hiki ni cha kawaida na kinaeleweka katika Kiswahili.
- source_word: הַמִּנְחָה
  choice: sadaka hiyo ya nafaka
  rationale: Kurudia aina ya sadaka kunahifadhi umaalumu wa מִנְחָה, huku “hiyo” ikiunganisha wazi na sadaka iliyotajwa tayari.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: “Mbele za” ni usemi wa asili wa Kiswahili unaofaa kwa maana ya ibada ya kuwa mbele au katika uwepo wa Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Inawakilisha moja kwa moja jina la agano יהוה badala ya kulibadilisha kuwa cheo.
- source_word: וְהִקְרִיב אֹתָהּ אֶל הַמִּזְבֵּחַ
  choice: na kuileta karibu na madhabahu
  rationale: Inahifadhi maana ya kisababishi ya קרב, yaani kuleta sadaka karibu katika hatua ya kuiwasilisha madhabahuni, bila kuifanya tayari kuwa tendo la kuiteketeza.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu, si cheo; “Yahweh” hulihifadhi wazi na kuendana na uamuzi wa mradi.
- issue: Maana ya מִנְחַת הַקְּנָאֹת
  choice: sadaka ya nafaka ya wivu
  alternative: sadaka ya wivu
  rationale: Tafsiri iliyochaguliwa huhifadhi kwamba hii ni מִנְחָה, aina ya sadaka ya nafaka, na pia haiondoi uhusiano wake na wivu katika ibada hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa hatua za ibada umewekwa wazi bila kuongeza ufafanuzi wa kimadhehebu.
