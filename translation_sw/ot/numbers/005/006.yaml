id: NUM.5.6
reference: Numbers 5:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַעֲשׂוּ֙ מִ/כָּל חַטֹּ֣את הָֽ/אָדָ֔ם לִ/מְעֹ֥ל מַ֖עַל בַּ/יהוָ֑ה וְ/אָֽשְׁמָ֖ה הַ/נֶּ֥פֶשׁ הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/006.yaml
  text: 'Speak to the sons of Israel: When a man or a woman commits any of the sins of mankind[a], by acting unfaithfully against Yahweh, then that person is guilty,'
translation:
  language: sw
  text: '“Waambie wana wa Israeli: Mwanamume au mwanamke akitenda dhambi yoyote ya wanadamu[a] kwa kukosa uaminifu kwa BWANA, mtu huyo atakuwa na hatia,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhambi yoyote ambayo watu hutenda.” Neno la Kiebrania hapa linamaanisha wanadamu kwa ujumla.
    reason: Huhifadhi maana inayowezekana ya kimsemo ya kifungu cha Kiebrania na kufafanua kwamba אָדָם ni neno la kijumla.
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: Waambie wana wa Israeli
  rationale: Imperative formula is rendered naturally in Swahili. “Wana wa Israeli” preserves the familial and covenantal wording of the Hebrew.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: Mwanamume au mwanamke
  rationale: Preserves the explicit male-female pair and the distributive application of the law.
- source_word: כִּי יַעֲשׂוּ
  choice: akitenda
  rationale: Although the Hebrew verb is plural, it follows the distributive expression “a man or a woman”; the Swahili singular conditional construction conveys this naturally.
- source_word: מִכָּל חַטֹּאת הָאָדָם
  choice: dhambi yoyote ya wanadamu
  rationale: “Wanadamu” conveys the generic reference of אָדָם to humanity, while “dhambi yoyote” preserves the unrestricted legal scope.
- source_word: לִמְעֹל מַעַל
  choice: kwa kukosa uaminifu
  rationale: The cognate construction describes breach of faith or disloyalty; this wording is clear, dignified, and retains the relational force.
- source_word: בַּיהוָה
  choice: kwa BWANA
  rationale: With the expression for unfaithfulness, the preposition identifies the one against whom faith is broken. “BWANA” follows established reverential Swahili biblical usage for the divine name.
- source_word: וְאָשְׁמָה הַנֶּפֶשׁ הַהִוא
  choice: mtu huyo atakuwa na hatia
  rationale: נֶפֶשׁ denotes the individual person here, not specifically an immaterial soul; the phrase states resulting guilt or liability.
theological_decisions:
- issue: Uwakilishi wa יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” follows established Swahili biblical convention while distinctly representing the divine name.
- issue: Maana ya הָאָדָם katika sheria hii
  choice: wanadamu
  alternative: mtu
  rationale: The noun is generic and refers to humanity rather than to a male individual. “Wanadamu” makes that inclusive scope clear without changing the legal sense.
- issue: Hali ya hatia katika וְאָשְׁמָה
  choice: atakuwa na hatia
  alternative: anakuwa na hatia
  rationale: The future form fits the conditional legal construction and expresses the resulting state, without adding details about punishment or atonement.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sheria na lugha ya agano zimehifadhiwa bila kutumia istilahi za dhehebu fulani.
