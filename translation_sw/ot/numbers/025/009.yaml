  text: Waliokufa katika tauni hiyo walikuwa watu elfu ishirini na nne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walikuwa
  rationale: Kitenzi היה hapa kinaunganisha waliokufa na jumla yao; “walikuwa” ni Kiswahili cha kawaida na chenye ulinganifu wa karibu na muundo wa Kiebrania.
- source_word: הַמֵּתִים
  choice: waliokufa
  rationale: Kirai hiki kinatafsiri umbo la kishiriki la מות kwa Kiswahili cha asili zaidi kuliko nomino kama “wafu,” huku kikibaki na maana ya watu waliopoteza maisha.
- source_word: בַּמַּגֵּפָה
  choice: katika tauni hiyo
  rationale: מַגֵּפָה ni pigo lenye kusababisha vifo au tauni. “Katika” huhifadhi kwa karibu kihusishi ב, na “hiyo” hubainisha tukio lililotajwa katika muktadha.
- source_word: אַרְבָּעָה וְעֶשְׂרִים אָלֶף
  choice: watu elfu ishirini na nne
  rationale: Hii ni idadi ya 24,000. Mpangilio “elfu ishirini na nne” ni wa kawaida katika Kiswahili, na “watu” huweka wazi kuwa idadi hiyo ni ya waliokufa.
