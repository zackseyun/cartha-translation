base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/013.yaml
  text: It shall be for him and for his offspring after him a covenant of a perpetual priesthood[c][b][a], because he was jealous for his God and made atonement for the sons of Israel.
translation:
  language: sw
  text: Nalo litakuwa kwake na kwa uzao wake baada yake agano la ukuhani wa kudumu[a], kwa sababu alikuwa na wivu kwa ajili ya Mungu wake[b] na akafanya upatanisho kwa ajili ya wana wa Israeli[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukuhani wa milele.”
    reason: alternative_reading
  - marker: b
    text: Au “alikuwa na bidii kwa ajili ya Mungu wake.” Kitenzi cha Kiebrania kinaweza kumaanisha wivu wa agano au bidii.
    reason: lexical_alternative
  - marker: c
    text: “Wana wa Israeli” ni jina la jadi la taifa katika Kiebrania na linarejelea watu wa Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Nayo itakuwa
  rationale: Muundo huu unahifadhi kiunganishi na hali ya ahadi ya kitenzi, huku kiwakilishi kikirejelea agano linalotajwa baadaye.
- source_word: לּוֹ וּלְזַרְעוֹ אַחֲרָיו
  choice: kwake na kwa uzao wake baada yake
  rationale: “Uzao” huhifadhi maana ya pamoja ya זֶרַע na wazo la urithi unaofuatana; “baada yake” limedumishwa waziwazi.
- source_word: בְּרִית
  choice: agano
  rationale: “Agano” ndilo neno la kawaida na linalofaa kwa makubaliano ya kimungu katika muktadha huu.
- source_word: כְּהֻנַּת עוֹלָם
  choice: ukuhani wa kudumu
  rationale: “Wa kudumu” huonyesha uendelevu wa taasisi ya ukuhani bila kulazimisha dai la kifalsafa kuhusu umilele usio na mwisho.
- source_word: תַּחַת אֲשֶׁר
  choice: kwa sababu
  rationale: Katika muktadha huu kifungu kinaonyesha msingi wa kutolewa kwa agano; “kwa sababu” ni sahihi na ya kawaida.
- source_word: קִנֵּא לֵאלֹהָיו
  choice: alikuwa na wivu kwa ajili ya Mungu wake
  rationale: Huhifadhi kwa karibu maana ya wivu wa agano au ari ya kutetea heshima ya Mungu; maana mbadala ya “alikuwa na bidii” imewekwa katika tanbihi.
- source_word: וַיְכַפֵּר
  choice: akafanya upatanisho
  rationale: “Kufanya upatanisho” ni usemi unaoeleweka katika muktadha wa kikuhani na hudumisha maana ya כפר.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: kwa ajili ya wana wa Israeli
  rationale: Huhifadhi umbo la kiume la Kiebrania na jina la jadi la taifa; tanbihi inafafanua kuwa linarejelea watu wa Israeli kwa ujumla.
theological_decisions:
- issue: Maana ya קנא kuhusiana na tendo la Finehasi
  choice: alikuwa na wivu kwa ajili ya Mungu wake
  alternative: alikuwa na bidii kwa ajili ya Mungu wake
  rationale: Kiebrania kinaweza kueleza wivu wa agano au bidii kwa ajili ya heshima ya Mungu. Tafsiri kuu huhifadhi wazo la wivu wa agano, na tanbihi hulinda maana mbadala.
- issue: Nguvu ya עוֹלָם katika ahadi ya ukuhani
  choice: ukuhani wa kudumu
  alternative: ukuhani wa milele
  rationale: Neno linaweza kueleza mwendelezo wenye kudumu katika historia ya agano bila lazima ya kudai kutokuwa na mwisho kwa maana ya kifalsafa.
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: watu wa Israeli
  rationale: Tafsiri kuu huhifadhi umbo la chanzo, huku tanbihi ikieleza matumizi yake kama jina la taifa linalowahusu watu wa Israeli.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefuata Kiebrania kwa ukaribu bila kufanya sentensi iwe ngumu; utata wa “wivu/bidii” na “kudumu/milele” umehifadhiwa kwa tanbihi.
