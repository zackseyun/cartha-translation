  yaml_path: translation/ot/numbers/025/005.yaml
  text: And Moses said to the judges of Israel[b][a], “Each of you must kill his men who have joined themselves to Baal Peor.”
translation:
  language: sw
  text: Musa akawaambia waamuzi wa Israeli, “Kila mmoja wenu awaue wanaume wake ambao wamejiunga na Baali wa Peori.[a]”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Baali-Peori.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi, “Ueni, kila mtu watu wake,” yaani kila mwamuzi alipaswa kuwaua wanaume waliokuwa chini ya mamlaka yake ambao walikuwa wamejiunga na Baali wa Peori.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטֵי
  choice: waamuzi
  rationale: Neno hili linataja watu waliokuwa na mamlaka ya kuamua mashauri na kuongoza katika Israeli; “waamuzi” ndilo chaguo la moja kwa moja na linalofaa katika muktadha.
- source_word: הִרְגוּ
  choice: na awaue
  rationale: Amri ya wingi inaelekezwa kwa waamuzi. Muundo “kila mmoja wenu na awaue” unawasilisha nguvu ya amri kwa Kiswahili cha kawaida bila kuongeza maana mahsusi ya utekelezaji wa hukumu ambayo kitenzi chenyewe hakitaji wazi.
- source_word: אִישׁ אֲנָשָׁיו
  choice: Kila mmoja wenu ... watu walio chini ya mamlaka yake
  rationale: Muundo wa Kiebrania ni wa mgawanyo, yaani kila mwamuzi awashughulikie watu wake. Tafsiri hii inaweka wazi uhusiano wa mamlaka unaokusudiwa, bila kudokeza kuwa watu hao walikuwa mali yake.
- source_word: הַנִּצְמָדִים
  choice: ambao wamejiunga
  rationale: Kauli ya Niphal ya צמד ina maana ya kushikamana au kujiunga kwa karibu. “Wamejiunga” ni ya kawaida na inadumisha wazo la kujihusisha kwa hiari bila kufafanua sitiari kupita kiasi.
- source_word: לְבַעַל פְּעוֹר
  choice: na Baali wa Peori
  rationale: Kirai hiki kinamtaja Baali anayehusishwa na Peori. “Baali wa Peori” kinaeleza uhusiano huo kwa Kiswahili sanifu; umbo “Baali-Peori” limewekwa katika tanbihi kama chaguo jingine.
theological_decisions:
- issue: Asili ya amri ya kuua
  choice: Amri imetafsiriwa moja kwa moja kuwa Musa aliwaagiza waamuzi wawauwe wakosaji waliokuwa chini ya mamlaka yao.
  alternative: Kutumia “watekeleze hukumu ya kifo” au kuongeza maelezo ya hukumu ya agano.
  rationale: Aya yenyewe inatoa amri kali kutokana na kujiunga na ibada ya Baali, lakini hapa haielezi taratibu za kisheria au maana ya kiibada. Tafsiri haipaswi kuongeza ufafanuzi huo.
- issue: Rejeo la kijinsia katika אִישׁ אֲנָשָׁיו
  choice: “watu walio chini ya mamlaka yake” limetumiwa kwa wanaume wanaorejelewa katika muktadha.
  alternative: Kutumia neno linalosisitiza jinsia, kama “wanaume wake.”
  rationale: אֲנָשָׁיו inaweza kumaanisha watu au wanaume wake, lakini hapa jambo kuu katika muundo ni kila mwamuzi na walio chini ya mamlaka yake. Kiswahili “watu” ni cha kawaida na hakibadili kwamba wakosaji katika muktadha ni wanaume.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri umewekwa wa moja kwa moja, huku kirai cha Kiebrania “kila mtu watu wake” kikifafanuliwa kwa lugha asilia. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
