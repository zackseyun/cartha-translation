id: NUM.25.4
reference: Numbers 25:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַ֚ח אֶת כָּל רָאשֵׁ֣י הָ/עָ֔ם וְ/הוֹקַ֥ע אוֹתָ֛/ם לַ/יהוָ֖ה נֶ֣גֶד הַ/שָּׁ֑מֶשׁ וְ/יָשֹׁ֛ב חֲר֥וֹן אַף יְהוָ֖ה מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/004.yaml
  text: And Yahweh said to Moses[a], “Take all the leaders of the people and impale them for Yahweh in broad daylight[b], so that the burning anger of Yahweh may turn away from Israel.”
translation:
  language: sw
  text: Yahweh akamwambia Musa[a], “Wachukue viongozi wote wa watu, kisha uwatundike kwa ajili ya Yahweh hadharani wakati wa mchana[b], ili hasira kali ya Yahweh iwaondokee Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wachukue viongozi wote wa watu, uwaamuru wawauwe wakosaji mbele za Yahweh hadharani wakati wa mchana.” Kisarufi, kiwakilishi cha Kiebrania kinachotafsiriwa “wa-” katika “uwatundike” kinawaelekea zaidi viongozi; lakini wengine huona viongozi kuwa watekelezaji wa adhabu hiyo, si waadhibiwa.
    reason: alternative_reading
  - marker: b
    text: Kwa maneno halisi, “mbele ya jua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kama “Yahweh” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: קַח
  choice: Wachukue
  rationale: Amri hii inaelekeza Musa awachukue viongozi; “wachukue” ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: כָּל רָאשֵׁי הָעָם
  choice: viongozi wote wa watu
  rationale: Ingawa רָאשֵׁי maana yake ya msingi ni “vichwa vya,” hapa ni sitiari ya viongozi. “Viongozi” huepuka dhana potovu ya vichwa vya miili na hueleweka kwa urahisi.
- source_word: וְהוֹקַע אֹתָם
  choice: kisha uwatundike
  rationale: Kitenzi יקע katika Hiphil kinaonyesha adhabu kali ya hadharani, inayoweza kueleweka kuwa kuwatundika, kuwaweka wazi baada ya kuuawa, au kuwachoma kwa vigingi. “Uwatundike” huhifadhi wazo la adhabu na maonyesho ya hadharani bila kufunga kabisa njia ya utekelezaji ambayo neno la Kiebrania halielezi kwa uhakika.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahweh
  rationale: Kihusishi ל hapa kinaonyesha kwamba tendo linafanywa kwa ajili ya Yahweh au kwa kumhusu; hakijaandikwa kwa kihusishi cha kawaida cha “mbele ya.”
- source_word: נֶגֶד הַשָּׁמֶשׁ
  choice: hadharani wakati wa mchana
  rationale: Maneno halisi ni “mbele ya jua.” Katika muktadha yanaonyesha tendo lililofanywa waziwazi mchana, si kwa siri.
- source_word: חֲרוֹן אַף יְהוָה
  choice: hasira kali ya Yahweh
  rationale: Nahau ya Kiebrania inaonyesha hasira inayowaka sana. “Hasira kali” ni Kiswahili cha kawaida kinachobeba uzito huo.
- source_word: וְיָשֹׁב ... מִיִּשְׂרָאֵל
  choice: ili ... iwaondokee Israeli
  rationale: 'Muundo huu unaonyesha kusudi au matokeo yaliyokusudiwa: hasira ya Yahweh iondoke kutoka kwa Israeli.'
theological_decisions:
- issue: Kirejeleo cha kiwakilishi “wa-” katika “uwatundike”
  choice: Kiwakilishi kinawarejelea viongozi wote wa watu.
  alternative: Viongozi wanaweza kueleweka kuwa walioamriwa kuwakamata na kuwaadhibu wakosaji, badala ya wao wenyewe kuadhibiwa.
  rationale: Kisarufi, אֹתָם kinaelekea zaidi kwa nomino ya wingi iliyo karibu, yaani “viongozi wote wa watu.” Hata hivyo, mstari unaofuata unawaagiza waamuzi wawaue waliojiunga na Baali-peori. Kwa hiyo, tafsiri kuu inafuata sintaksia ya moja kwa moja, huku tanbihi ikihifadhi uwezekano mwingine.
- issue: Uhusiano wa adhabu hiyo na Yahweh katika לַיהוָה
  choice: kwa ajili ya Yahweh
  alternative: mbele ya Yahweh
  rationale: Kihusishi ל kwa kawaida kina maana ya “kwa” au “kwa ajili ya.” Tafsiri “mbele ya Yahweh” ingeweza kudokeza לִפְנֵי, ambayo haitumiki hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Viongozi” ni wazi kuliko tafsiri halisi “vichwa,” na “hadharani wakati wa mchana” huwasilisha maana ya nahau bila kupoteza tanbihi ya maneno halisi. Sintaksia kuu imehifadhi utata wa simulizi kwa tanbihi badala ya kuamua kimya kimya kwamba viongozi ni watekelezaji wa adhabu.
