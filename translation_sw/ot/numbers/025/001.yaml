source:
  edition: WLC
  text: וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בַּ/שִּׁטִּ֑ים וַ/יָּ֣חֶל הָ/עָ֔ם לִ/זְנ֖וֹת אֶל בְּנ֥וֹת מוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/001.yaml
  text: While Israel was staying at Shittim[a], the people began to prostitute themselves with the daughters of Moab.
translation:
  language: sw
  text: Waisraeli walipokuwa wamekaa Shitimu, watu wakaanza kuzini na binti za Moabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kufanya uasherati na wanawake wa Moabu”; Kiebrania, “wakaanza kufanya ukahaba na binti za Moabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: alipokuwa akikaa
  rationale: Kitenzi ישׁב kinaweza kumaanisha kukaa, kuishi, au kubaki. Hapa muundo huu unaonyesha kukaa kwa muda katika eneo hilo bila kudokeza makazi ya kudumu.
- source_word: בַּשִּׁטִּים
  choice: Shitimu
  rationale: Jina la mahali שׁטים limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: וַיָּחֶל
  choice: wakaanza
  rationale: Katika muktadha huu, kitenzi hiki kina maana ya kuanza; umbo la wingi linafuata nomino ya mkusanyiko 'watu' katika Kiswahili.
- source_word: הָעָם
  choice: watu
  rationale: Neno העם linawataja Waisraeli kwa pamoja; 'watu' ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: לִזְנוֹת
  choice: kufanya ukahaba
  rationale: Kitenzi זנה kinaonyesha tendo haramu la ngono kwa taswira kali ya ukahaba. Tafsiri hii inadumisha ukali huo kuliko usemi mpana zaidi wa 'kufanya uasherati'.
- source_word: אֶל
  choice: na
  rationale: Ingawa אֶל kwa kawaida humaanisha 'kwa' au 'kuelekea,' pamoja na זנה na watu kama kiambajengo inaonyesha mahusiano ya kingono nao; 'na' ni ya asili katika Kiswahili.
- source_word: בְּנוֹת מוֹאָב
  choice: binti za Moabu
  rationale: Hii inadumisha kwa ukaribu msemo wa Kiebrania 'binti za Moabu' huku ikiendelea kueleweka kama wanawake wa Moabu.
theological_decisions:
- issue: Asili ya dhambi ya Israeli mwanzoni mwa simulizi
  choice: Kutumia lugha dhahiri ya ukahaba
  alternative: walianza kufanya uasherati na wanawake wa Moabu
  rationale: Kiebrania זנה ni neno kali na lenye taswira kuliko maelezo ya jumla ya upotovu wa kingono. 'Kufanya ukahaba' huhifadhi uzito wa kimaadili wa maandishi bila kuongeza tafsiri ya kidhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa na wenye heshima. Umoja wa 'Israeli alipokuwa' unalihifadhi taifa kama kundi moja, huku 'watu wakaanza' ukitumia upatanisho wa kawaida wa Kiswahili. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika nayo.
