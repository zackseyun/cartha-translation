  rationale: “Musa” ni umbo la jina hili lililozoeleka katika Kiswahili sanifu.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi fomula ya Kiebrania inayotanguliza maneno yatakayofuata, bila kuifuta kama marudio yasiyo ya lazima.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina la Mungu lenye herufi nne YHWH; kulitaja kama “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kawaida na wa heshima. Muundo “akasema na Musa, akisema” umehifadhi fomula ya Kiebrania na unaunganisha mstari huu na maneno yanayofuata.
