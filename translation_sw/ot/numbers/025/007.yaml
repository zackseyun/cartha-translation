  text: וַ/יַּ֗רְא פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵ֑ן וַ/יָּ֨קָם֙ מִ/תּ֣וֹךְ הָֽ/עֵדָ֔ה וַ/יִּקַּ֥ח רֹ֖מַח בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/007.yaml
  text: When Phinehas son of Eleazar[a], son of Aaron the priest, saw it[b], he rose up from the midst of the congregation and took a spear in his hand.
translation:
  language: sw
  text: Finehasi mwana wa Eleazari, mwana wa Haruni, kuhani, alipoona jambo hilo,[a] aliinuka kutoka katikati ya kusanyiko[b] akachukua mkuki mkononi mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipoona.” Kiebrania kinasema tu “aliona”; kitu kilichoonekana kinaeleweka kutokana na muktadha uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka miongoni mwa kusanyiko” au “kutoka katika mkutano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipoona jambo hilo
  rationale: Kitenzi cha Kiebrania chenyewe ni ‘aliona’ bila kutaja kitu kilichoonekana; Kiswahili cha kawaida hunufaika kwa kuweka ‘jambo hilo,’ ambalo linaelekezwa na muktadha uliotangulia bila kufafanua zaidi.
- source_word: פִּינְחָס
  choice: Finehasi
  rationale: Umbo la jina linalotambulika katika mapokeo ya Biblia ya Kiswahili, likihifadhi jina kama jina maalumu.
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: mwana wa Eleazari, mwana wa kuhani Haruni
  rationale: Huhifadhi mfuatano wa ukoo na kumhusisha Haruni moja kwa moja na cheo cha kuhani. Hakuna neno ‘mkuu’ katika Kiebrania, kwa hiyo halijaongezwa.
- source_word: וַיָּקָם
  choice: aliinuka
  rationale: Ni tafsiri ya kawaida na yenye nguvu ya kisimulizi kwa tendo la kuinuka au kusimama ili kuchukua hatua.
- source_word: מִתּוֹךְ הָעֵדָה
  choice: kutoka katikati ya kusanyiko
  rationale: ‘Katikati ya’ huakisi תּוֹךְ, na ‘kusanyiko’ huonyesha jamii ya Israeli iliyokusanyika kwa lugha ya sasa na iliyo wazi.
- source_word: וַיִּקַּח
  choice: na kuchukua
  rationale: Kitenzi cha kawaida ‘chukua’ kinatosha; maneno kama ‘kunyakua’ yangeongeza ukali usiolazimishwa na Kiebrania.
- source_word: רֹמַח
  choice: mkuki
  rationale: ‘Mkuki’ ni neno la kawaida na linaloeleweka kwa silaha ya aina ya spear/lance.
- source_word: בְּיָדוֹ
  choice: mkononi mwake
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha kwamba aliushika mkuki na kujizatiti nao.
theological_decisions:
- issue: Tafsiri ya הָעֵדָה
  choice: kusanyiko
  alternative: mkutano; jumuiya
  rationale: ‘Kusanyiko’ huhifadhi maana ya watu wa Israeli waliokusanyika bila kuingiza maana maalumu ya baadaye ya kikanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa ukoo umewekwa wazi, na sintaksia ya kisimulizi imetolewa kwa mtiririko wa kawaida wa Kiswahili.
