base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/006.yaml
  text: And behold, a man from the sons of Israel came and brought near to his brothers a Midianite woman, before the eyes of Moses and before the eyes of all the congregation of the sons of Israel, while they were weeping at the entrance of the tent of meeting.
translation:
  language: sw
  text: Na tazama, mwanamume mmoja wa wana wa Israeli akaja, akamleta mwanamke Mmidiani[b] karibu na ndugu zake[a], machoni pa Musa na machoni pa kusanyiko lote la wana wa Israeli, huku wao wakilia mlangoni mwa Hema la Kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa kwao” au “Waisraeli wenzake.” Kiebrania kinasema “ndugu zake.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hutumia kivumishi dhahiri cha kike, yaani “Mmidiani yule,” kwa matumizi ya nomino; maana yake ni “mwanamke Mmidiani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Inadumisha kishiria cha ghafla kinachovuta fikira na kusisitiza hali ya kushangaza, bila kukiondoa kama simulizi la kawaida.
- source_word: אִישׁ מִבְּנֵי יִשְׂרָאֵל
  choice: mwanamume mmoja wa wana wa Israeli
  rationale: Neno אִישׁ linamtaja mwanamume mmoja, na 'wana wa Israeli' linahifadhi lugha ya kifamilia yenye jinsia ya Kiebrania.
- source_word: וַיַּקְרֵב
  choice: akamleta ... karibu
  rationale: Hifili ya קרב ina maana ya kusababisha mtu asogee karibu; mpangilio huu ni wa asili katika Kiswahili huku ukihifadhi wazo la kumleta karibu.
- source_word: אֶל אֶחָיו
  choice: karibu na ndugu zake
  rationale: Tafsiri hii inadumisha lugha halisi ya kifamilia ya 'ndugu zake'; maana ya kimuktadha imeelezwa katika tanbihi.
- source_word: הַמִּדְיָנִית
  choice: mwanamke Mmidiani
  rationale: Kivumishi cha kike kimetumiwa kama nomino katika Kiebrania, hivyo 'mwanamke' imeongezwa kwa uwazi. Kiswahili hakihitaji kuonyesha tofauti ya kibainishi dhahiri na kisichodhahiri kama Kiingereza.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: machoni pa ... na machoni pa
  rationale: Inahifadhi marudio na taswira ya Kiebrania, ikikazia kwamba kitendo kilifanywa hadharani kabisa.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: kusanyiko lote la wana wa Israeli
  rationale: '''Kusanyiko'' ni neno la sasa na linaloeleweka kwa עֵדָה, huku ''wana wa Israeli'' ikihifadhi nahau ya Kiebrania.'
- source_word: וְהֵמָּה בֹכִים
  choice: walipokuwa wakilia
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati mwanamume huyo alipokuja.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: mlangoni pa Hema la Kukutania
  rationale: Ni tafsiri wazi na ya kawaida ya mahali pa patakatifu, na inadumisha jina maalumu la אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Lugha ya kifamilia yenye jinsia katika בְּנֵי יִשְׂרָאֵל na אֶחָיו
  choice: Kudumisha 'wana wa Israeli' na 'ndugu zake' katika matini kuu
  alternative: '''Waisraeli'' na ''watu wa kwao'' au ''Waisraeli wenzake'''
  rationale: Kiebrania kinatumia maneno ya kifamilia ya kiume. Kuyadumisha kunalinda taswira ya agano na umbo la chanzo bila kudai kwamba 'ndugu' hapa lazima wawe ndugu wa tumbo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya usomaji wa Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya 'machoni pa' na lugha ya kifamilia yamehifadhiwa kwa sababu ni vipengele muhimu vya msisitizo wa chanzo.
