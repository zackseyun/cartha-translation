lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hapa kitenzi hiki ni fomula ya mpito katika simulizi. “Ikawa” huhifadhi kazi hiyo kwa Kiswahili fasaha na chenye hadhi, bila kuwa kirefu.
- source_word: אַחֲרֵי
  choice: baada ya
  rationale: Kirai hiki kinaonyesha mfuatano wa wakati moja kwa moja; “baada ya” ndiyo tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: הַמַּגֵּפָה
  choice: tauni
  rationale: Neno hili humaanisha pigo lenye kuua au mlipuko wa ugonjwa katika muktadha wa hukumu. “Tauni” ni neno fupi na linaloeleweka katika muktadha huu wa Hesabu 25.
theological_decisions:
- issue: Fomula ya simulizi kama mstari kamili
  choice: Kutafsiri kishazi hiki kama sentensi huru ya mpito.
  alternative: Kukichukulia kama mwanzo wa sentensi inayoendelea katika mstari unaofuata.
  rationale: Maandishi ya Kiebrania ya mstari huu yana kishazi kifupi cha mpito pekee. Kukitoa kama sentensi kamili kunaheshimu mgawanyo wa mistari wa mapokeo ya chanzo huku kukidumishia kazi yake ya kuunganisha simulizi; hakuna suala la kimafundisho linalobadilishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi, na rahisi kusomeka. “Ikawa” lina ladha ya kisimulizi inayofaa maandiko bila kutumia muundo usio wa kawaida.
