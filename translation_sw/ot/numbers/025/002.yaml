  yaml_path: translation/ot/numbers/025/002.yaml
  text: And they invited the people to the sacrifices of their gods[a], and the people ate and bowed down to their gods.
translation:
  language: sw
  text: Nao wakawaalika watu kwenye dhabihu za miungu yao; watu wakala, wakainama mbele ya miungu yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakaabudu miungu yao.” Kitenzi cha Kiebrania kinamaanisha kihalisi kuinama au kujinyenyekeza, mara nyingi kama tendo la ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרֶאןָ
  choice: Wanawake hao wakawaalika
  rationale: Kitenzi kiko katika nafsi ya tatu, wingi wa kike, na mhusika wake ni wanawake waliotajwa katika mstari uliotangulia. Kutaja “wanawake hao” huonyesha taarifa hii ya kisarufi kwa Kiswahili cha kawaida; “wakawaalika” linafaa kwa קרא ikifuatwa na לְ katika muktadha huu.
- source_word: לָעָם
  choice: watu
  rationale: Neno עָם lenye kibainishi linamaanisha “watu.” Ingawa muktadha unaonyesha kuwa ni watu wa Israeli, mstari huu haurudii jina “Israeli,” hivyo tafsiri haijiongezi.
- source_word: לְזִבְחֵי אֱלֹהֵיהֶן
  choice: kwenye dhabihu za miungu yao
  rationale: זִבְחֵי ni wingi wa hali ya kuambatana, “dhabihu za,” na kifungu kinaeleza dhabihu au karamu za kidini zinazohusiana na miungu ya wanawake hao. “Kwenye” linaonyesha mwaliko wa kwenda kushiriki tukio hilo kwa Kiswahili cha kawaida.
- source_word: וַיֹּאכַל
  choice: wakala
  rationale: Kitenzi cha Kiebrania kiko katika umoja kwa sababu עָם ni nomino ya mkusanyiko. Kiswahili hutumia wingi kwa kurejelea watu hao, hivyo “watu wakala” ni sahihi na ya moja kwa moja.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: wakainama mbele ya
  rationale: Kitenzi hiki humaanisha kuinama au kujitupa chini mbele ya mwingine, mara nyingi kama tendo la ibada. “Wakainama mbele ya” huhifadhi tendo halisi la mwili bila kulifasiri moja kwa moja kuwa “waliabudu.”
- source_word: לֵאלֹהֵיהֶן
  choice: miungu yao
  rationale: Kihusishi לְ baada ya השתחוה hutambulisha wale ambao tendo la kuinama linaelekezwa kwao. Katika Kiswahili, “mbele ya miungu yao” huwasilisha uhusiano huo kwa kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri tendo la ibada ya sanamu linaloelezwa na וַיִּשְׁתַּחֲווּ
  choice: wakainama mbele ya miungu yao
  alternative: wakaiabudu miungu yao
  rationale: Tafsiri kuu huhifadhi tendo halisi la kuinama na pia uzito wake wa kidini katika muktadha wa dhabihu. Tanbihi inatoa maana ya kiibada bila kufuta upeo wa maana wa kitenzi cha Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya moja kwa moja na inaeleweka kwa wasomaji wa kawaida. Alama [a] imewekwa baada ya kifungu kinachohusika moja kwa moja na tanbihi.
