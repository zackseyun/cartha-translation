  yaml_path: translation/ot/numbers/025/003.yaml
  text: So Israel joined itself to Baal of Peor[a], and the anger of Yahweh burned against Israel.
translation:
  language: sw
  text: Israeli akajifungamanisha na Baali wa Peori[a], na hasira ya Yahweh ikawaka dhidi ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akajifungamanisha na Baali-Peori,” au “alijifunga nira pamoja na Baali wa Peori.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּמֶד
  choice: akajiunga na
  rationale: Kitenzi cha Kiebrania katika Niphal kinaonyesha kushikamana au kuunganishwa kwa karibu. “Akajiunga na” ni Kiswahili cha kawaida kinachohifadhi wazo la taifa kujifungamanisha na mungu huyo bila kulifafanua kupita kiasi.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ndilo jina la kawaida la taifa katika Kiswahili; umoja wa kisarufi unalitazama taifa kama kundi moja.
- source_word: לְבַעַל פְּעוֹר
  choice: na Baali wa Peori
  rationale: “Baali” ni jina au cheo cha mungu, na “wa Peori” huhifadhi uhusiano wa mahali unaoonyeshwa na muundo wa Kiebrania.
- source_word: וַיִּחַר אַף
  choice: hasira ... ikawaka
  rationale: Usemi huu huhusisha hasira kuwa moto au kuwaka. Tafsiri hii huhifadhi sitiari ya Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: בְּיִשְׂרָאֵל
  choice: dhidi ya Israeli
  rationale: Katika usemi huu, kihusishi ב huonyesha mlengwa wa hasira; “dhidi ya” hutoa maana hiyo wazi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu, si cheo. “Yahweh” huhifadhi jina hilo kwa utohozi unaolingana kwa karibu na ushahidi wa lugha ya asili.
- issue: Aina ya uhusiano wa Israeli na Baali wa Peori
  choice: akajiunga na
  alternative: akajifunga nira kwa
  rationale: Kitenzi kinaweza kudokeza kufungamanishwa kwa karibu, hata kama kwa nira, lakini hakilazimishi taswira hiyo pekee. “Akajiunga na” huhifadhi upana wa maana na uzito wa uhusiano wa ibada bila kuamua sitiari kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi mfuatano na sitiari ya Kiebrania huku ikisomeka kwa urahisi; jina Yahweh limetumiwa moja kwa moja.
