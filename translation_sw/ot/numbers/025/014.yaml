base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/014.yaml
  text: The name of the Israelite man who was struck down[a], who was struck down with the Midianite woman, was Zimri son of Salu[b], a leader of a father's house among the Simeonites.
translation:
  language: sw
  text: Jina la mwanamume Mwisraeli aliyeuawa[a], ambaye aliuawa pamoja na mwanamke Mmidiani, lilikuwa Zimri mwana wa Salu, kiongozi wa jamaa ya baba[b] miongoni mwa Wasimeoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri iliyo karibu zaidi na muundo wa Kiebrania: “mwanamume Mwisraeli aliyeuawa, ambaye aliuawa pamoja na mwanamke Mmidiani.” Kiebrania hurudia kitenzi hicho kwa msisitizo.'
    reason: lexical_alternative
  - marker: b
    text: “Jamaa ya baba” ni kitengo cha familia au ukoo kilichohesabiwa kwa nasaba ya upande wa baba ndani ya kabila.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: Jina
  rationale: Kiunganishi וְ kinaendeleza simulizi, lakini Kiswahili hakihitaji neno la ziada la mwanzo; “Jina” huanzisha taarifa ya utambulisho kwa kawaida.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: mwanamume Mwisraeli
  rationale: Huhifadhi wazi jinsia ya kiume na utambulisho wake kuwa wa Israeli.
- source_word: הַמֻּכֶּה ... אֲשֶׁר הֻכָּה
  choice: aliyeuawa
  rationale: Katika Kiswahili, kurudia kitenzi hapa kungekuwa kizito na kungedokeza kuuawa mara mbili; tanbihi inahifadhi taarifa kwamba Kiebrania hurudia mzizi huo kwa msisitizo.
- source_word: אֶת הַמִּדְיָנִית
  choice: pamoja na mwanamke Mmidiani
  rationale: Katika muktadha huu אֶת huonyesha kwamba aliuawa pamoja naye; umbo la kike la kivumishi linafanya “mwanamke” kuwa wazi.
- source_word: זִמְרִי בֶּן סָלוּא
  choice: Zimri mwana wa Salu
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika Kiswahili, na בֶּן imetafsiriwa “mwana wa.”
- source_word: נְשִׂיא
  choice: kiongozi
  rationale: Huwasilisha hadhi ya uongozi bila kuingiza maana ya kifalme ya “mwana wa mfalme.”
- source_word: בֵית אָב
  choice: jamaa ya ukoo wa baba
  rationale: Huwasilisha kitengo cha kijamii kinachofuata nasaba ya upande wa baba kwa lugha inayoeleweka, bila kukipunguza kuwa familia ya nyumbani tu.
- source_word: לַשִּׁמְעֹנִי
  choice: miongoni mwa Wasimeoni
  rationale: Huonyesha uhusiano wa jamaa hiyo na kabila la Simeoni kwa Kiswahili cha kawaida.
