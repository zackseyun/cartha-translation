  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: פִּֽינְחָ֨ס בֶּן אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן הֵשִׁ֤יב אֶת חֲמָתִ/י֙ מֵ/עַ֣ל בְּנֵֽי יִשְׂרָאֵ֔ל בְּ/קַנְא֥/וֹ אֶת קִנְאָתִ֖/י בְּ/תוֹכָ֑/ם וְ/לֹא כִלִּ֥יתִי אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/קִנְאָתִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/011.yaml
  text: Phinehas son of Eleazar[a], son of Aaron the priest, has turned back my wrath from upon the sons of Israel by being jealous with my jealousy among them, so that I did not consume the sons of Israel in my jealousy.
translation:
  language: sw
  text: Finehasi, mwana wa Eleazari, mwana wa Haruni, kuhani, ameiondoa ghadhabu yangu iliyokuwa juu ya wana wa Israeli kwa kuwa na wivu wangu miongoni mwao[a], hata nisiwaangamize wana wa Israeli katika wivu wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuwa na ari yangu miongoni mwao.” Kiebrania kinatumia maumbo yenye mzizi mmoja kueleza tendo la Finehasi na wivu au ari ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: ameiondoa
  rationale: Hifili ya שוב hapa ina maana ya kugeuza au kuondoa ghadhabu. ‘Ameiondoa’ ni Kiswahili cha kawaida kinachohifadhi maana ya kusababisha ghadhabu iondoke.
- source_word: חֲמָתִי
  choice: ghadhabu yangu
  rationale: חֵמָה ni hasira kali yenye nguvu ya hukumu; ‘ghadhabu’ hudumisha uzito huo kwa lugha ya heshima.
- source_word: מֵעַל
  choice: iliyokuwa juu ya
  rationale: Muundo huu unahifadhi taswira ya ghadhabu iliyokuwa juu ya Israeli, lakini ni wa kawaida zaidi katika Kiswahili kuliko tafsiri neno kwa neno ‘kutoka juu ya’.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa agano wa Kiebrania na umbo lake la kiume, huku ukiwa usemi unaoeleweka katika Kiswahili cha Biblia.
- source_word: בְּקַנְאוֹ אֶת־קִנְאָתִי
  choice: kwa kuonyesha wivu wangu
  rationale: Mzizi קנא unaweza kumaanisha wivu au ari. ‘Kuonyesha wivu wangu’ huonyesha kwamba Finehasi alitenda kwa kupatana na wivu wa Mungu na huepuka muundo usio wa kawaida ‘kuwa na wivu kwa wivu wangu’.
- source_word: בְּתוֹכָם
  choice: miongoni mwao
  rationale: Ni tafsiri ya kawaida na sahihi ya tendo lililofanyika katikati ya jumuiya.
- source_word: כִלִּיתִי
  choice: sikuwaangamiza
  rationale: Katika pieli, כלה hapa humaanisha kumaliza au kuharibu kabisa. ‘Kuwaangamiza’ ni Kiswahili cha kawaida kinachofaa kwa tishio la hukumu ya Mungu.
- source_word: בְּקִנְאָתִי
  choice: kwa wivu wangu
  rationale: Huhifadhi kurudiwa kwa nomino קִנְאָה na kuunganisha kitendo cha Finehasi na mwitikio wa Mungu.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Cheo hiki kinamtambulisha Haruni; ‘mwana wa kuhani Haruni’ ni muundo wa asili na usio na utata katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri קנא / קִנְאָה kuhusu Finehasi na Mungu
  choice: wivu / kuonyesha wivu
  alternative: ari / kuonyesha ari
  rationale: Kiebrania kinatumia maumbo ya mzizi mmoja kwa tendo la Finehasi na mwitikio wa Mungu, likidokeza wivu wa agano unaodai uaminifu wa pekee. ‘Wivu’ huhifadhi maana hiyo; ‘ari’ pia inawezekana na imewekwa katika tanbihi ili kutunza uwezekano wa kileksika.
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi wa Kiebrania ni wa kiume kisarufi na ni jina la watu wa agano. ‘Wana wa Israeli’ huhifadhi umbo hilo bila kubadili rejeo lake la kijumuiya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili zimetumiwa kwa uwazi bila kuvunja uhusiano wa sababu na matokeo wa mstari wa Kiebrania. ‘Ghadhabu,’ ‘kuhani,’ na ‘wana wa Israeli’ huhifadhi sajili ya kibiblia inayofahamika, huku miundo ya sentensi ikibaki ya kawaida kwa wasomaji wa leo.
