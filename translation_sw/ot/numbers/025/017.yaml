  text: Harass the Midianites and strike them down,[a]
translation:
  language: sw
  text: Waonyesheni Wamidiani uhasama, na wapigeni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wawatendee Wamidiani kama maadui, na wapigeni.” Kitenzi cha Kiebrania צָרוֹר kinaweza kumaanisha kuonyesha uhasama au kuwatendea watu kama maadui.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹר
  choice: Wafanyieni uadui
  rationale: Kitenzi צרר hapa kinaamuru kuwatendea watu kama maadui au kuwaonyesha uhasama. “Wafanyieni uadui” ni kauli ya kawaida, yenye uzito, na haifungi maana katika mbinu fulani tu ya kijeshi.
- source_word: הַמִּדְיָנִים
  choice: Wamidiani
  rationale: Jina la kawaida la Kiswahili kwa watu wa Midiani.
- source_word: וְהִכִּיתֶם
  choice: na wapigeni
  rationale: Hifili ya נכה inaweza kumaanisha kupiga, kushambulia, au kuwashinda. “Wapigeni” inadumisha nguvu na uwazi wa tendo la vurugu bila kuifanya lazima imaanishe kuwaua au kuwaangamiza.
- source_word: אוֹתָם
  choice: wa- katika “wapigeni”
  rationale: Kiwakilishi cha yambwa kinachowarejelea Wamidiani kimewakilishwa kwa kiambishi cha yambwa “wa-”.
- source_word: אֶת
  choice: '[hakijatafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa katika Kiebrania na hakina neno huru linalolingana nacho katika Kiswahili.
theological_decisions:
- issue: Kutafsiri amri ya Mungu ya uhasama na tendo la vurugu bila kuipunguza au kuipanua
  choice: Wafanyieni uadui Wamidiani na wapigeni
  alternative: Wasumbue Wamidiani na kuwashambulia
  rationale: 'Kiebrania kina amri mbili za moja kwa moja: kuwatendea Wamidiani kwa uhasama na kuwapiga. Tafsiri inadumisha ukali huo bila kuongeza sababu ya kitheolojia isiyotajwa katika mstari huu, wala kuamua kwamba נכה lazima imaanishe kuua au kuangamiza.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa amri za wingi unadumishwa, na ukali wa mstari haujalainishwa.
