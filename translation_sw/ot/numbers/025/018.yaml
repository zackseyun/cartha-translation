id: NUM.25.18
reference: Numbers 25:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֣י צֹרְרִ֥ים הֵם֙ לָ/כֶ֔ם בְּ/נִכְלֵי/הֶ֛ם אֲשֶׁר נִכְּל֥וּ לָ/כֶ֖ם עַל דְּבַר פְּע֑וֹר וְ/עַל דְּבַ֞ר כָּזְבִּ֨י בַת נְשִׂ֤יא מִדְיָן֙ אֲחֹתָ֔/ם הַ/מֻּכָּ֥ה בְ/יוֹם הַ/מַּגֵּפָ֖ה עַל דְּבַר פְּעֽוֹר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/018.yaml
  text: For they are hostile to you through their schemes[a], by which they deceived you in the matter of Peor and in the matter of Cozbi, the daughter of a leader of Midian, their sister[c][b], who was struck down on the day of the plague because of the matter of Peor.
translation:
  language: sw
  text: Kwa maana wao wana uadui nanyi kwa hila zao[b], ambazo walitumia kuwadanganya katika jambo la Peori[a] na katika jambo la Kozbi, binti ya kiongozi wa Midiani, dada yao[c], aliyeuawa siku ya tauni kwa sababu ya jambo la Peori.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Peori linarejelea tukio lililohusisha Baal-Peori, lililosimuliwa mwanzoni mwa sura hii.
    reason: cross_reference
  - marker: b
    text: Au, ‘kwa njama zao’ au ‘kwa udanganyifu wao.’
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: ‘dada yao’; huenda maana yake ni mwanamke wa watu au ukoo wao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרְרִים
  choice: wana uadui nanyi
  rationale: Kauli hii inaonyesha uadui unaoendelea dhidi ya Israeli. ‘Wana uadui nanyi’ ni Kiswahili cha kawaida na huhifadhi nguvu ya hali ya kitenzi bila kuifanya iwe vita vya moja kwa moja.
- source_word: בְּנִכְלֵיהֶם
  choice: kwa hila zao
  rationale: Nomino hii inamaanisha mbinu za ujanja na udanganyifu; ‘kwa hila zao’ pia hudhihirisha beth ya chombo au njia.
- source_word: נִכְלוּ לָכֶם
  choice: walitumia kuwadanganya
  rationale: Kitenzi hiki kina mzizi mmoja na nomino iliyotangulia na huonyesha kutenda kwa hila dhidi ya mtu. Muundo huu wa Kiswahili unaunganisha kwa kawaida hila zao na hatua ya kuwadanganya.
- source_word: עַל דְּבַר פְּעוֹר
  choice: katika jambo la Peori
  rationale: Katika tukio la kwanza, usemi huu una maana ya ‘kuhusu/katika jambo la.’ Jina limehifadhiwa bila kupanuliwa kuwa Baal-Peori.
- source_word: כָּזְבִּי
  choice: Kozbi
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: בַת נְשִׂיא מִדְיָן
  choice: binti ya kiongozi wa Midiani
  rationale: נשיא humaanisha mkuu au kiongozi. ‘Kiongozi’ ni wazi kwa wasomaji wa sasa na haileti dhana isiyolazimu ya mwana wa mfalme.
- source_word: אֲחֹתָם
  choice: dada yao
  rationale: Hii ndiyo maana halisi ya Kiebrania. Inaweza pia kumaanisha mwanamke wa watu au ukoo wao, lakini tafsiri halisi huhifadhi lugha ya kindugu.
- source_word: הַמֻּכָּה
  choice: aliyeuawa
  rationale: Muktadha unaonyesha kuwa Kozbi alipigwa na kufa. ‘Aliyeuawa’ ni Kiswahili cha asili kinachoeleza matokeo ya tendo hilo, ingawa picha halisi ya ‘kupigwa’ imefupishwa.
- source_word: בְיוֹם הַמַּגֵּפָה
  choice: siku ya tauni
  rationale: Huhifadhi rejeo la wakati kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: עַל דְּבַר פְּעוֹר
  choice: kwa sababu ya jambo la Peori
  rationale: Katika tukio la mwisho usemi huu una nguvu ya kisababishi, kwa kuwa unahusishwa na tauni.
theological_decisions:
- issue: Jina ‘Peori’ linarejelea nini
  choice: Jina ‘Peori’ limetoholewa kama lilivyo katika maandishi ya Kiebrania, huku tanbihi ikieleza tukio linalokusudiwa.
  alternative: Kulipanua katika aya kuwa ‘Baal-Peori.’
  rationale: Maandishi yana Peori pekee. Kulipanua kungetoa ufafanuzi wenye manufaa lakini kungezidi maneno ya chanzo.
- issue: Nguvu ya marudio ya עַל דְּבַר פְּעוֹר
  choice: Tukio la kwanza limetafsiriwa ‘katika jambo la Peori,’ na la mwisho ‘kwa sababu ya jambo la Peori.’
  alternative: Kutumia maneno yaleyale katika sehemu zote mbili.
  rationale: Usemi uleule wa Kiebrania unaweza kuwa wa kimazingira katika sehemu ya kwanza na wa kisababishi katika sehemu ya mwisho; utofauti huu huhifadhi kazi yake katika kila muktadha bila kuficha marudio ya ‘jambo la Peori.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. ‘Tauni’ ni neno la kibiblia linalotambulika kwa מַגֵּפָה; majina Peori, Kozbi, na Midiani yametoholewa kwa maumbo ya kawaida ya Kiswahili. Alama zote za tanbihi zimewekwa mara baada ya maneno yanayohusika.
