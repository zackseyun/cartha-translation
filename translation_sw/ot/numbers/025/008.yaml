base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/008.yaml
  text: He went after the Israelite man into the chamber and pierced both of them—the Israelite man and the woman—through her belly[c][b][a]. Then the plague was stopped from upon the sons of Israel.
translation:
  language: sw
  text: Akamfuata huyo mwanamume Mwisraeli mpaka ndani ya chumba[a], akawachoma wote wawili—huyo mwanamume Mwisraeli na yule mwanamke—katika tumbo la mwanamke huyo.[b] Ndipo tauni ikaondolewa kutoka kwa wana wa Israeli[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chumba cha ndani,” “sehemu ya ndani ya hema,” au “kibanda.” Neno la Kiebrania ni adimu na hurejelea sehemu ya ndani iliyotengwa.
    reason: lexical_alternative
  - marker: b
    text: Au “katika fumbatio la tumbo lake” au “katika sehemu ya ndani ya tumbo lake.” Neno la Kiebrania hurejelea hasa tumbo au uwazi wa tumbo.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania “wana wa Israeli,” usemi wa kawaida wa kiagano unaowarejelea watu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֻּבָּה
  choice: chumba
  rationale: Neno hili la Kiebrania ni adimu na linaonyesha sehemu ya ndani iliyofungwa. “Chumba” ni tafsiri ya kawaida isiyolazimisha jengo au hema fulani.
- source_word: וַיִּדְקֹר
  choice: akawachoma
  rationale: Kitenzi hiki kinaonyesha tendo la kuchoma kwa silaha yenye ncha. “Akawachoma” ni cha asili katika Kiswahili na kinadumisha ukali wa tendo bila kuongeza aina ya silaha.
- source_word: שְׁנֵיהֶם
  choice: wote wawili
  rationale: Inadumisha wazi kwamba mwanamume na mwanamke walichomwa pamoja.
- source_word: אֶל קֳבָתָהּ
  choice: hadi tumboni mwa mwanamke huyo
  rationale: קֳבָה hurejelea tumbo au sehemu ya ndani ya tumbo. “Hadi tumboni” linawasilisha undani halisi wa mwili huku likidumisha uhusiano wa kirai hicho na mwanamke.
- source_word: וַתֵּעָצַר
  choice: ikakomeshwa
  rationale: Hali ya kutendwa inadumisha maana kwamba tauni ilizuiliwa au ilisimamishwa, badala ya kusema tu ilikoma yenyewe.
- source_word: הַמַּגֵּפָה
  choice: tauni
  rationale: “Tauni” ni neno la kawaida na lenye uzito unaofaa kwa pigo la hukumu katika muktadha huu.
- source_word: מֵעַל בְּנֵי יִשְׂרָאֵל
  choice: miongoni mwa wana wa Israeli
  rationale: Kirai hiki ni cha asili katika Kiswahili kwa tauni iliyokuwa imewapata watu, huku “wana wa Israeli” likidumisha usemi wa agano wa Kiebrania.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: mwanamume Mwisraeli
  rationale: Inadumisha jinsia ya mtu huyo pamoja na utambulisho wake kama Mwisraeli.
theological_decisions:
- issue: Usemi wa kijumuiya בְּנֵי יִשְׂרָאֵל wenye jinsia ya kiume
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Tafsiri inadumisha umbo la kawaida la kiagano la Kiebrania bila kudai kwamba tauni iliwahusu wanaume pekee.
- issue: Undani mkali wa mwili katika tukio la hukumu
  choice: hadi tumboni mwa mwanamke huyo
  alternative: hadi kwenye fumbatio lake
  rationale: Chanzo kinataja sehemu ya mwili moja kwa moja; tafsiri haipunguzi ukali huo wala kuuongezea maelezo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha marudio ya “mwanamume Mwisraeli” na undani wa tukio kama yalivyo katika Kiebrania, huku ikiepuka lugha ya kitabibu kupita kiasi.
