lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akasema
  rationale: Kitenzi דבר hapa kinaendeleza simulizi; “Kisha” huonyesha mfuatano wa matukio kwa Kiswahili cha kawaida, na “akasema” ni usemi wa asili katika fomula hii ya kutanguliza maneno ya Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo, ili kuhifadhi jina la kibinafsi lililo katika maandishi ya Kiebrania.
- source_word: אֶל
  choice: na
  rationale: Katika Kiswahili, “akasema na Musa” hutoa kwa kawaida maana ya kumwelekezea Musa maneno, ingawa Kiebrania hutumia kihusishi אֶל.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Neno hili ni fomula inayotanguliza usemi wa moja kwa moja; “akisema” huhifadhi ishara hiyo ya Kiebrania na kuunganisha mstari huu na yaliyomo katika mstari unaofuata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina יהוה. Kutumia “Yahwe” huhifadhi jina hilo badala ya kulibadilisha na cheo; tanbihi inaeleza desturi nyingine ya kulitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Muundo “akisema” umehifadhiwa kwa sababu ni fomula ya Kiebrania inayotanguliza maneno yanayofuata.
