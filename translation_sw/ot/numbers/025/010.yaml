  text: 'Kisha Yahwe[a] akamwambia Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina la Kiebrania YHWH; kwa desturi hutafsiriwa “BWANA”; pia hutoholewa “Yahwe.”
