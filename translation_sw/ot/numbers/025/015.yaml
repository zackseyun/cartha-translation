translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Sentensi ya Kiebrania imegawanywa mara mbili ili kuweka wazi kwamba Suri—si Kozbi—ndiye aliyekuwa mkuu, bila kuondoa utata halisi wa אֻמּוֹת; huo umehifadhiwa katika tanbihi.
