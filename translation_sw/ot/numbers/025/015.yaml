base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/015.yaml
  text: And the name of the Midianite woman who was struck down was Cozbi daughter of Zur[b][a], who was head of the clans of a father's house in Midian.
translation:
  language: sw
  text: Jina la mwanamke Mmidiani aliyeuawa lilikuwa Kozbi, binti wa Suri. Suri alikuwa mkuu wa koo[a] za nyumba ya baba[b] huko Midiani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makundi ya watu.” Neno la Kiebrania linaweza kumaanisha watu au mataifa, lakini katika muktadha huu wa undugu linaweza kumaanisha makundi ya koo.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “nyumba ya baba,” yaani jamaa pana au nyumba ya ukoo iliyohesabiwa kwa upande wa baba.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשֵׁם
  choice: Jina la
  rationale: Muundo huu unaendeleza simulizi kwa Kiswahili cha kawaida; kiunganishi וְ hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: הַמֻּכָּה
  choice: aliyeuawa
  rationale: Kitenzi נכה kina maana ya kupiga au kuangusha; katika muktadha wa mstari uliotangulia, mwanamke huyo alikufa, hivyo ‘aliyeuawa’ ni wazi na ya kawaida bila kuongeza namna ya kifo.
- source_word: הַמִּדְיָנִית
  choice: mwanamke Mmidiani
  rationale: Hifadhi utambulisho wa kikabila kwa namna ya kawaida katika Kiswahili.
- source_word: כָּזְבִּי בַת־צוּר
  choice: Kozbi binti Suri
  rationale: Majina yametoholewa kwa mazoea ya Kiswahili, na uhusiano wa kifamilia wa בַת umeonyeshwa moja kwa moja kwa ‘binti’.
- source_word: רֹאשׁ
  choice: mkuu
  rationale: Katika muktadha wa uongozi, רֹאשׁ humaanisha mkuu au kiongozi; ‘mkuu’ ni ya asili zaidi kuliko sitiari ya moja kwa moja ‘kichwa’.
- source_word: אֻמּוֹת
  choice: koo
  rationale: Ingawa neno hili linaweza kumaanisha mataifa au makundi ya watu, muktadha wa בית אב unaonyesha makundi ya kindugu; ‘koo’ huhifadhi maana hiyo.
- source_word: בֵּית אָב
  choice: nyumba ya baba
  rationale: Tafsiri hii inahifadhi istilahi ya kijamii na kindugu ya Kiebrania; tanbihi inaeleza kuwa si lazima iwe nyumba halisi.
- source_word: בְּמִדְיָן
  choice: huko Midiani
  rationale: Hutoa maana ya mahali kwa Kiswahili cha kawaida.
- source_word: הוּא
  choice: Suri alikuwa
  rationale: Kiwakilishi cha kiume kinamrejelea Suri. Kurudia jina huondoa utata unaoweza kutokea katika Kiswahili na kuhifadhi rejeleo hilo.
