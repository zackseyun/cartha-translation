  yaml_path: translation/ot/numbers/030/016.yaml
  text: But if he does indeed nullify them after he has heard of them[b][a], then he shall bear her guilt.
translation:
  language: sw
  text: Lakini ikiwa kwa hakika atazibatilisha baada ya kuzisikia, basi atabeba hatia yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Atabeba hatia yake” yaweza pia kueleweka kuwa “atawajibika kwa uovu wake” au “atabeba adhabu ya hatia yake.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Huanzisha sharti lenye utofautishaji na mstari uliotangulia; “lakini ikiwa” huonyesha vizuri nguvu ya waw katika muktadha.
- source_word: הָפֵר יָפֵר
  choice: kwa hakika atayabatilisha
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi kamili unasisitiza tendo. “Kwa hakika” huhifadhi msisitizo huo, na “batilisha” inafaa katika muktadha wa kisheria wa kuondoa nguvu ya nadhiri.
- source_word: אֹתָם
  choice: yaya-
  rationale: Kiambishi cha wingi kinarejelea nadhiri au masharti ya kujifunga yaliyotajwa katika muktadha wa karibu.
- source_word: אַחֲרֵי שָׁמְעוֹ
  choice: baada ya kuyasikia
  rationale: 'Huhifadhi mpangilio wa wakati wa Kiebrania: anabatilisha baada ya kuwa amezisikia nadhiri hizo, bila kuongeza wazo la “kusikia habari zake.”'
- source_word: וְנָשָׂא
  choice: basi ataubeba
  rationale: “Basi” huweka wazi matokeo ya sharti, huku “beba” ikihifadhi nahau ya kisheria na kimaadili ya Kiebrania.
- source_word: עֲוֺנָהּ
  choice: uovu wake
  rationale: Huhifadhi upana wa עָוֹן, ambalo linaweza kumaanisha uovu, hatia, au matokeo ya hatia, bila kulifafanua kupita kiasi.
theological_decisions:
- issue: Maana ya kubeba uovu au hatia katika muktadha wa kisheria
  choice: Mume ataubeba “uovu wake,” kwa kuhifadhi nahau na kutofafanua kikamilifu aina ya uwajibikaji.
  alternative: Mume atabeba hatia yake, wajibu wa uovu wake, au adhabu inayotokana na hatia yake.
  rationale: Nahau נָשָׂא עָוֹן inaweza kumaanisha kubeba hatia, kuwajibika kwa uovu, au kubeba matokeo yake. Tafsiri kuu inadumisha mvutano huo; tanbihi inaonyesha uwezekano bila kuamua utaratibu wa adhabu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Batilisha” limetumiwa kwa usahihi wa kisheria; msisitizo wa Kiebrania umeonyeshwa kwa “kwa hakika.” Kiambishi cha kike cha wingi katika “atayabatilisha/kuyasikia” kinarejelea mambo kama nadhiri na masharti ya kujifunga katika muktadha.
