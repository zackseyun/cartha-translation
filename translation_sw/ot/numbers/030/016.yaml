review_pass:
  verdict: revise
  source_fidelity: The conditional contrast, emphatic infinitive-absolute construction, delayed annulment, and consequent bearing of the woman's עָוֹן are all substantially represented. “Baada ya kuzisikia” appropriately renders the hearing as prior to annulment without adding “habari za.” However, the Hebrew plural object refers to the vows/binding obligations, and the Swahili feminine plural concord in “atayabatilisha/kuyasikia” is not supported by the immediate referents, which are naturally rendered as nadhiri (class 9/10).
  naturalness: The sentence is clear and suitably formal. “Atabeba hatia yake” is more idiomatic in a legal-moral context than “ataubeba uovu wake”; the latter can suggest that he carries out or possesses her moral evil, rather than that he bears culpability/liability.
  terminology: “Batilisha” is appropriate legal terminology for annulling vows. “Hatia” is the best primary Swahili rendering here for עָוֹן while the footnote preserves the broader possibilities of responsibility and punishment. The emphatic “kwa hakika” is retained.
  issues:
  - severity: medium
    issue: Gender/class concord of the plural object
    rationale: “Atayabatilisha ... kuyasikia” uses class 5/6 concord, but the contextual objects are vows and binding obligations, naturally nadhiri, for which class 9/10 concord (“atazibatilisha ... kuzisikia”) is appropriate. The Hebrew object is masculine plural.
  - severity: medium
    issue: “Uovu wake” inadequately conveys legal culpability
    rationale: Although עָוֹן can denote iniquity, “uovu wake” in current Standard East African Swahili readily denotes her wickedness/evil. “Hatia yake” better conveys the legal-moral liability in this context, while the note can retain broader interpretive possibilities.
  revised_text: Lakini ikiwa kwa hakika atazibatilisha baada ya kuzisikia, basi atabeba hatia yake.[a]
  revised_footnotes:
  - marker: a
    text: “Atabeba hatia yake” yaweza pia kueleweka kuwa “atawajibika kwa uovu wake” au “atabeba adhabu ya hatia yake.”
    reason: alternative_reading
  revision_rationale: The revision corrects the plural noun-class concord to correspond naturally to nadhiri/binding obligations, and it replaces the potentially misleading “uovu wake” with “hatia yake” for the primary legal sense of עָוֹן. It preserves the Hebrew emphasis (“kwa hakika”), the sequence of hearing then annulment, and the ambiguity of the idiom through the footnote.
