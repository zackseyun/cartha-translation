- from: Lakini ikiwa kwa hakika atayabatilisha baada ya kuyasikia, basi ataubeba uovu wake.[a]
  to: Lakini ikiwa kwa hakika atazibatilisha baada ya kuzisikia, basi atabeba hatia yake.[a]
  rationale: The revision corrects the plural noun-class concord to correspond naturally to nadhiri/binding obligations, and it replaces the potentially misleading “uovu wake” with “hatia yake” for the primary legal sense of עָוֹן. It preserves the Hebrew emphasis (“kwa hakika”), the sequence of hearing then annulment, and the ambiguity of the idiom through the footnote.
