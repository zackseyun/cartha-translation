  text: וְ/אִם הַחֲרֵשׁ֩ יַחֲרִ֨ישׁ לָ֥/הּ אִישָׁ/הּ֮ מִ/יּ֣וֹם אֶל יוֹם֒ וְ/הֵקִים֙ אֶת כָּל נְדָרֶ֔י/הָ א֥וֹ אֶת כָּל אֱסָרֶ֖י/הָ אֲשֶׁ֣ר עָלֶ֑י/הָ הֵקִ֣ים אֹתָ֔/ם כִּי הֶחֱרִ֥שׁ לָ֖/הּ בְּ/י֥וֹם שָׁמְעֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/015.yaml
  text: But if her husband indeed keeps silent from day to day[a], then he confirms all her vows or all her obligations that are upon her; he has confirmed them, because he kept silent on the day he heard.
translation:
  language: sw
  text: Lakini ikiwa mume wake ataendelea kukaa kimya siku baada ya siku, basi anathibitisha nadhiri zake zote au viapo vyake vyote vya kujifunga vinavyomfunga[a]. Amezithibitisha kwa sababu alikaa kimya siku ile aliposikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ahadi zake zote zinazomfunga.” Neno la Kiebrania linamaanisha ahadi au viapo ambavyo humfunga mtu aliyeviweka.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ יַחֲרִישׁ
  choice: ataendelea kukaa kimya
  rationale: Muundo wa kitenzi cha kusisitiza unaonyesha ukimya wa hakika na unaoendelea; katika muktadha huu ni kutopinga kisheria, si kutoweza kusema.
- source_word: אִישָׁהּ
  choice: mume wake
  rationale: Katika muktadha huu wa ndoa, maana yake ya kawaida na sahihi ni mume wake.
- source_word: מִיּוֹם אֶל יוֹם
  choice: siku baada ya siku
  rationale: Nahau hii huonyesha kuendelea kwa ukimya katika siku zinazofuatana na inasikika kwa kawaida katika Kiswahili.
- source_word: וְהֵקִים
  choice: basi anathibitisha
  rationale: Hifili ya קום hapa ina maana ya kisheria ya kuifanya nadhiri isimame au iendelee kuwa halali; “anathibitisha” huwasilisha maana hiyo kwa uwazi.
- source_word: נְדָרֶיהָ
  choice: nadhiri zake
  rationale: “Nadhiri” ni istilahi ya kawaida ya Kiswahili kwa ahadi rasmi ya kidini au kisheria.
- source_word: אֱסָרֶיהָ
  choice: ahadi zake zote zinazomfunga
  rationale: Nomino hii yatokana na wazo la kufunga na humaanisha mambo ambayo mtu amejifunga kuyatimiza; usemi huu unaeleweka kwa urahisi huku ukihifadhi nguvu yake ya lazima.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: zinazomfunga
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya majukumu yaliyo juu yake bila kupoteza sitiari ya kufungwa nayo.
- source_word: הֵקִים אֹתָם
  choice: Amezithibitisha
  rationale: Kauli timilifu ya Kiswahili inaonyesha tendo lililofanyika na matokeo yake ya kisheria yanayoendelea.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaeleza sababu ya kuthibitishwa kwa nadhiri na ahadi hizo.
- source_word: הֶחֱרִשׁ לָהּ
  choice: alikaa kimya
  rationale: Usemi wa asili unarudia wazo la ukimya wake mbele yake kama uthibitisho wa kimya; Kiswahili hakihitaji kuongeza “kwake” ili maana hiyo ieleweke.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: siku ile aliposikia
  rationale: Huhifadhi muda maalumu wa kisheria unaosisitizwa katika sura hii na ni usemi wa kawaida wa Kiswahili.
