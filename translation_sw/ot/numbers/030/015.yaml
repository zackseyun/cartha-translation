  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inahifadhi urudiaji wa kisheria wa “anathibitisha/Amezithibitisha,” huku ikitumia “siku baada ya siku” na “alikaa kimya” kwa mtiririko wa kawaida.
