  text: אִישׁ֩ כִּֽי יִדֹּ֨ר נֶ֜דֶר לַֽ/יהוָ֗ה אֽוֹ הִשָּׁ֤בַע שְׁבֻעָה֙ לֶ/אְסֹ֤ר אִסָּר֙ עַל נַפְשׁ֔/וֹ לֹ֥א יַחֵ֖ל דְּבָר֑/וֹ כְּ/כָל הַ/יֹּצֵ֥א מִ/פִּ֖י/ו יַעֲשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/003.yaml
  text: If a man makes a vow to Yahweh, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that has gone out from his mouth.
translation:
  language: sw
  text: Mwanamume akiweka nadhiri kwa Yahwe, au akiapa kiapo ili kujifunga kwa wajibu[a], hatavunja neno lake[b]; atafanya yote yatokayo kinywani mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “ili kujiwekea wajibu.” Kiebrania, kwa tafsiri ya moja kwa moja: “ili kujifunga kifungo juu yake mwenyewe.”'
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya moja kwa moja, “hatalitia unajisi neno lake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: mwanamume
  rationale: Nomino ya kiume katika umoja imetafsiriwa kwa usahihi wa kijinsia kulingana na muundo wa sheria katika Kiebrania.
- source_word: כִּי
  choice: akimwekea
  rationale: Kiunganishi hiki kinaanzisha sharti katika sheria; muundo wa Kiswahili wenye kiambishi -ki- unaonyesha maana ya ‘ikiwa/atakapo’ kwa njia ya kawaida.
- source_word: יִדֹּר נֶדֶר
  choice: akimwekea ... nadhiri
  rationale: Kiebrania kina kitenzi na nomino zenye mzizi mmoja. Kiswahili cha kawaida hutumia ‘kuweka nadhiri,’ huku ‘-mwekea Yahwe’ kikihifadhi anayeelekezewa nadhiri.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kuwa ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: הִשָּׁבַע שְׁבֻעָה
  choice: akiapa kiapo
  rationale: Muundo huu unahifadhi kwa njia ya kawaida ya Kiswahili uradidi wa kitenzi na nomino wenye mzizi mmoja.
- source_word: לֶאְסֹר אִסָּר עַל נַפְשׁוֹ
  choice: ili kujifunga kwa wajibu
  rationale: Kirai hiki kinaeleza mtu anayejiwekea kifungo au wajibu. ‘Kujifunga kwa wajibu’ ni cha asili na kinahifadhi maana ya kujilazimisha bila kuingiza wazo lisilokuwamo wazi la aina maalumu ya ahadi.
- source_word: לֹא יַחֵל דְּבָרוֹ
  choice: hatakiuka neno lake
  rationale: Kitenzi חלל katika Hiphil kina wazo la kulifanya jambo kuwa najisi au kulivunjia utakatifu; katika muktadha huu wa kisheria, ‘kukiuka neno’ huwasilisha kwa uwazi kutolitimiza.
- source_word: כְּכָל הַיֹּצֵא מִפִּיו יַעֲשֶׂה
  choice: atafanya yote yaliyotoka kinywani mwake
  rationale: Tafsiri hii inadumisha taswira halisi ya maneno yanayotoka kinywani na pia wajibu wa kutenda yote aliyosema.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu יהוה moja kwa moja. ‘Yahwe’ huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לֹא יַחֵל דְּבָרוֹ
  choice: hatakiuka neno lake
  alternative: hatalitia unajisi neno lake
  rationale: Chaguo kuu linaeleza matokeo ya kisheria kwa Kiswahili kinachoeleweka, huku tanbihi ikihifadhi taswira ya kidini ya ‘kulitia unajisi’ iliyomo katika mzizi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifungu cha sheria lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masharti umetolewa kwa kiambishi -ki-, na taswira ya ‘yaliyotoka kinywani mwake’ imehifadhiwa.
