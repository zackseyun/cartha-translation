base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/002.yaml
  text: Then Moses spoke to the heads of the tribes of the sons of Israel[a], saying[b], “This is the word that Yahweh has commanded:”
translation:
  language: sw
  text: Kisha Musa akawaambia wakuu wa makabila ya wana wa Israeli[a], “Hili ndilo neno[b] ambalo Yahweh ameamuru:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa lugha ya kawaida zaidi, “Waisraeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Hivi ndivyo Yahweh alivyoamuru.” Kiebrania kinasema, “Hili ndilo neno ambalo Yahweh ameamuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... לֵאמֹר
  choice: Kisha Musa akawaambia ...
  rationale: Muundo huu wa Kiswahili unaendeleza simulizi kwa kawaida na kuingiza maana ya ‘alisema ... akisema’ bila urudiaji usio wa kawaida.
- source_word: רָאשֵׁי הַמַּטּוֹת
  choice: wakuu wa makabila
  rationale: ‘Wakuu’ huhifadhi wazo la viongozi wenye mamlaka, na ‘makabila’ ndiyo maana ya מַטּוֹת katika mgawanyo wa Israeli hapa.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wa wana wa Israeli
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania kwa uwazi; mbadala wa kawaida zaidi umewekwa katika tanbihi.
- source_word: זֶה הַדָּבָר
  choice: Hili ndilo neno
  rationale: Huhifadhi maana ya msingi ya דָּבָר kama ‘neno’ na uzito wake kama tamko lenye mamlaka, badala ya kuifanya tu ‘hivi ndivyo.’
- source_word: צִוָּה
  choice: ameamuru
  rationale: Kauli timilifu ya Kiswahili huonyesha kwamba amri imeshatolewa na sasa inawasilishwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limetoholewa badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; ‘Yahweh’ huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Usemi wa kifamilia wenye jinsia בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: ‘Wana wa Israeli’ huhifadhi muundo na taswira ya kifamilia ya Kiebrania, huku tanbihi ikitoa Kiswahili cha kawaida zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akawaambia’ limetumiwa badala ya ‘alisema ... akisema’ ili kupata mtiririko wa kawaida bila kupoteza kazi ya לֵאמֹר. Alama za tanbihi [a] na [b] zimewekwa katika maandishi.
