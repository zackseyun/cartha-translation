translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. Tafsiri “kujinyima” hufanya nahau iwe ya asili katika sentensi kuu, huku tanbihi ikihifadhi picha halisi ya Kiebrania. Kurudiwa kwa “mume wake” kunadumisha msisitizo na ulinganifu wa chanzo.
