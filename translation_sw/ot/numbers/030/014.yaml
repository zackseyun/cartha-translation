  text: Every vow and every binding oath to afflict the soul—her husband may confirm it[a], or her husband may annul it.
translation:
  language: sw
  text: Kila nadhiri na kila kiapo cha kujifunga ili kujinyima[a]—mume wake anaweza kuthibitisha, au mume wake anaweza kubatilisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kujitesa” au “kujinyenyekeza.” Nahau ya Kiebrania, kwa tafsiri halisi, ni “kutesa nafsi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: nadhiri
  rationale: Katika sheria ya ibada, neno hili humaanisha ahadi takatifu inayotolewa kwa Mungu; “nadhiri” ndilo neno sanifu na sahihi katika Kiswahili.
- source_word: שְׁבֻעַת אִסָּר
  choice: kiapo cha kujifunga
  rationale: Usemi huu unaunganisha kiapo na wajibu unaomfunga au kumwekea mtu kizuizi. “Kiapo cha kujifunga” huhifadhi maana zote mbili kwa Kiswahili cha kawaida.
- source_word: לְעַנֹּת נָפֶשׁ
  choice: ili kujinyima
  rationale: Huu ni usemi wa Kiebrania unaoeleza kujinyima au kujitesa, mara nyingi katika mazingira ya kufunga. “Kujinyima” ni Kiswahili cha asili kinachoeleweka, huku tafsiri halisi ikihifadhiwa katika tanbihi.
- source_word: נָפֶשׁ
  choice: nafsi (katika tanbihi)
  rationale: Ndani ya nahau hii נֶפֶשׁ inaweza kumaanisha nafsi au mtu mwenyewe. Kutaja “nafsi” katika tanbihi hudumisha umbo la nahau ya Kiebrania bila kuifanya sentensi kuu kuwa ngumu.
- source_word: אִישָׁהּ
  choice: mume wake
  rationale: Muktadha ni sheria inayohusu ndoa, kwa hiyo maana yake hapa ni “mume wake,” si “mwanamume wake.”
- source_word: יְקִימֶנּוּ
  choice: anaweza kuithibitisha
  rationale: Hiphil ya קום hapa ina maana ya kuifanya nadhiri au kiapo isimame, yaani kuithibitisha kuwa halali na yenye nguvu.
- source_word: יְפֵרֶנּוּ
  choice: anaweza kuibatilisha
  rationale: Hiphil ya פרר katika sheria ya nadhiri humaanisha kuiondolea nadhiri uhalali au nguvu; “kuibatilisha” huwasilisha maana hiyo ya kisheria kwa uwazi.
- source_word: כָּל ... וְכָל
  choice: Kila ... na kila ...
  rationale: Kurudia “kila” kunadumisha msisitizo wa Kiebrania kwamba kauli hii inahusu aina zote mbili bila ubaguzi.
