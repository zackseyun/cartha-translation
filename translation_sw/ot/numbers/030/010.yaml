  text: And the vow of a widow or of a divorced woman—everything by which she has bound herself—shall stand against her[a].
translation:
  language: sw
  text: Na nadhiri ya mjane au ya mwanamke aliyeachwa—kila jambo alilojiwekea kuwa wajibu—litabaki kuwa lenye kumfunga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “litakuwa la kumfunga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: nadhiri
  rationale: Katika muktadha wa kisheria na ibada, neno hili humaanisha ahadi nzito inayowekwa mbele za Mungu; “nadhiri” ndiyo istilahi ya kawaida na sahihi katika Kiswahili cha Biblia.
- source_word: אַלְמָנָה
  choice: mjane
  rationale: Ni kisawe cha moja kwa moja na cha kawaida kwa mwanamke ambaye mume wake amekufa.
- source_word: גְרוּשָׁה
  choice: mwanamke aliyeachwa
  rationale: Umbo la Kiebrania humaanisha mwanamke aliyeondolewa katika ndoa; usemi huu ni wazi na wa kawaida, bila kutumia istilahi yenye uzito usiohitajika.
- source_word: כֹּל אֲשֶׁר
  choice: kila jambo
  rationale: Huhifadhi upana wa kirai, ambacho kinajumuisha si nadhiri pekee bali kila wajibu aliojiwekea.
- source_word: אָסְרָה עַל נַפְשָׁהּ
  choice: alilojifungamanisha nalo
  rationale: Huhifadhi sitiari ya kujifunga huku ikieleza kwa Kiswahili cha kawaida wajibu ambao mtu amejitwika mwenyewe.
- source_word: יָקוּם עָלֶיהָ
  choice: litabaki kuwa wajibu kwake
  rationale: Katika muktadha huu wa kisheria, kirai kinamaanisha kwamba jambo hilo linaendelea kuwa halali na lenye kumfunga; tafsiri hii ni ya asili zaidi kwa Kiswahili kuliko kunakili sitiari ya ‘kusimama juu yake’.
