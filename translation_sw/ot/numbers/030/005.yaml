  text: וְ/שָׁמַ֨ע אָבִ֜י/הָ אֶת נִדְרָ֗/הּ וֶֽ/אֱסָרָ/הּ֙ אֲשֶׁ֣ר אָֽסְרָ֣ה עַל נַפְשָׁ֔/הּ וְ/הֶחֱרִ֥ישׁ לָ֖/הּ אָבִ֑י/הָ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/005.yaml
  text: And if her father hears her vow[a], or her binding obligation by which she has bound herself, and her father says nothing to her, then all her vows shall stand[b], and every binding obligation by which she has bound herself shall stand.
translation:
  language: sw
  text: Na kama baba yake akisikia nadhiri yake na kifungo alichojiwekea, na baba yake akinyamaza kwake[a], basi nadhiri zake zote zitabaki halali[b], na kila kifungo alichojiwekea kitabaki halali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, baba yake hakutoa pingamizi; ukimya wake unaacha nadhiri zake zote na kila kifungo alichojiwekea viendelee kuwa halali.
    reason: clarification
  - marker: b
    text: Au “zitasimama,” yaani zitaendelea kuwa na nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְרָהּ / נְדָרֶיהָ
  choice: nadhiri yake / nadhiri zake
  rationale: “Nadhiri” ni neno la kawaida katika Kiswahili cha Biblia kwa ahadi nzito inayotolewa kwa Mungu, na linatofautishwa hapa na אִסָּר.
- source_word: אֱסָרָהּ / אִסָּר
  choice: kifungo chake / kila kifungo
  rationale: “Kifungo” huhifadhi taswira ya jambo linalomfunga mtu na tofauti ya kimsamiati kati ya אִסָּר na נֵדֶר; muktadha na kirai “alichojiwekea” hufafanua kuwa ni wajibu wa kujizuia au kujifunga mwenyewe.
- source_word: אָסְרָה עַל־נַפְשָׁהּ
  choice: alichojiwekea
  rationale: Hii ni kauli ya asili ya Kiswahili inayoonyesha kuwa yeye mwenyewe amejifunga kwa wajibu huo bila kurudia kwa uzito usio wa lazima taswira ya “kufunga juu ya nafsi yake.”
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: baba yake akamnyamazia
  rationale: Huhifadhi maana ya moja kwa moja ya baba kukaa kimya kwake, badala ya kutafsiri kimya hicho moja kwa moja kuwa idhini.
- source_word: וְקָמוּ ... יָקוּם
  choice: zitabaki halali / kitabaki halali
  rationale: Katika muktadha huu wa kisheria, קום humaanisha kubaki na nguvu au uhalali. “Kubaki halali” ni wazi kwa msomaji wa sasa na huhifadhi maana ya kwamba masharti hayo yanaendelea kutumika.
- source_word: כָּל
  choice: zote / kila
  rationale: “Zote” hutumika kwa wingi “nadhiri zake,” na “kila” kwa umoja wa kisarufi “kifungo,” kwa Kiswahili cha kawaida na sahihi.
theological_decisions:
- issue: Maana ya ukimya wa baba
  choice: Kutafsiri kitendo chenyewe kama “akamnyamazia,” huku tanbihi ikieleza athari yake ya kisheria
  alternative: “hakupinga” au “akakubali”
  rationale: Kiebrania kinasema kwamba baba alikaa kimya; kutafsiri moja kwa moja kuwa alikubali kungefuta tofauti kati ya kitendo na matokeo yake ya kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sheria wenye sharti umehifadhiwa kwa “Na kama ... basi.” “Kifungo” kimetumiwa kwa אִסָּר ili kukitofautisha na “nadhiri,” na maana yake imewekwa wazi kwa “alichojiwekea.”
