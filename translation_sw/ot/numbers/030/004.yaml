  text: וְ/אִשָּׁ֕ה כִּֽי תִדֹּ֥ר נֶ֖דֶר לַ/יהוָ֑ה וְ/אָסְרָ֥ה אִסָּ֛ר בְּ/בֵ֥ית אָבִ֖י/הָ בִּ/נְעֻרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/004.yaml
  text: And if a woman vows a vow to Yahweh[a], and binds herself by an obligation in her father's house in her youth[b],
translation:
  language: sw
  text: Na mwanamke akiweka nadhiri kwa Yahweh na akijifunga kwa wajibu wa kujifunga, akiwa nyumbani mwa baba yake wakati wa ujana wake,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִשָּׁה כִּי
  choice: Na mwanamke aki-
  rationale: Katika sheria hii, muundo huu huanzisha hali mpya yenye sharti. Kiswahili cha 'aki-' huwasilisha maana ya 'ikiwa/wakati' kwa njia ya kawaida na wazi.
- source_word: תִדֹּר נֶדֶר
  choice: akiweka nadhiri
  rationale: Kiswahili cha kawaida hakihifadhi kwa ufasaha urudiaji wa kitenzi na nomino wa Kiebrania. 'Kuweka nadhiri' hudumisha tendo rasmi la kujifunga kwa nadhiri.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Jina la agano יְהוָה limetafsiriwa moja kwa moja kuwa 'Yahweh' kulingana na uamuzi wa mradi.
- source_word: וְאָסְרָה אִסָּר
  choice: au akijifunga kwa ahadi ya lazima
  rationale: Kirai hiki kinaeleza mtu kujiwekea wajibu unaomfunga. 'Au' kinaonyesha kwa kawaida tendo la pili linalowezekana katika muktadha, huku 'ahadi ya lazima' ikihifadhi uzito wake wa kisheria.
- source_word: בְּבֵית אָבִיהָ
  choice: akiwa nyumbani mwa baba yake
  rationale: Huhifadhi mazingira ya kaya ya baba bila kuongeza kwa wazi dhana ya mamlaka ambayo haijasemwa katika kirai chenyewe.
- source_word: בִּנְעֻרֶיהָ
  choice: wakati wa ujana wake
  rationale: Hii ni tafsiri ya moja kwa moja ya kipindi cha ujana na haiongezi kwa lazima hali ya kutokuolewa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la Mungu moja kwa moja; 'Yahweh' huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya נֶדֶר na אִסָּר
  choice: nadhiri ... au ... ahadi ya lazima
  alternative: nadhiri ... na ... wajibu
  rationale: Maneno haya yanakaribiana lakini si lazima yafanane kabisa. Tafsiri inadumisha utofauti huo bila kuyafanya kuwa aina moja ya ahadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko ya sheria. Mstari unaishia kwa koma kwa kuwa sentensi ya kisheria inaendelea katika mstari unaofuata.
