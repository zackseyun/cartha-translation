lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Ingawa kitenzi kimsingi ni ‘akasema,’ muundo wa Kiswahili ‘akawaambia’ unaeleza kwa kawaida tendo la kusema lililoelekezwa kwa watu, bila kudokeza kuwa maneno yanayonukuliwa moja kwa moja yanafuata.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania wenye nomino ya kiume katika wingi, ambao hapa ni jina la kawaida la agano kwa taifa la Israeli.
- source_word: כְּכֹל אֲשֶׁר
  choice: yote kama
  rationale: Huwasilisha maana ya kufuata au kulingana na kila jambo lililoamriwa, kwa mpangilio wa Kiswahili unaoeleweka.
- source_word: צִוָּה
  choice: alivyomwamuru
  rationale: Muundo huu unaonyesha kwamba Musa alisema kulingana na maagizo aliyokuwa tayari amepewa na Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu linalowakilishwa na herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: אֶת מֹשֶׁה
  choice: Musa
  rationale: Musa ndiye mtendwa wa kitenzi ‘aliamuru’; kiambishi cha Kiswahili katika ‘alivyomwamuru’ tayari kinaonyesha uhusiano huo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Jina la kitaifa la agano בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: ‘Wana wa Israeli’ huhifadhi umbo la Kiebrania na dhima yake kama jina la kawaida la taifa, huku tanbihi ikitoa namna ya kawaida zaidi ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Muundo ‘akawaambia ... yote kama’ umetumiwa kuhifadhi wazo la kusema kwa kufuata kikamilifu agizo la Yahweh.
