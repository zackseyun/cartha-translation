revisions:
- from: Lakini ikiwa baba yake anamkataza siku anaposikia, basi hakuna nadhiri yake wala sharti lake la kujifunga[a] ambalo litakuwa na nguvu[b]. Naye Yahwe atamsamehe, kwa sababu baba yake alimkataza.
  to: Lakini baba yake akimkataza siku anaposikia habari hizo, nadhiri zake zote wala vifungo vyake vyote ambavyo alijifunga navyo[a] havitasimama[b]. Naye Yahwe atamsamehe, kwa sababu baba yake alimkataza.
  rationale: 'The revision replaces “sharti” with “vifungo” to represent binding obligations rather than conditions, makes the plural scope of the vows and obligations explicit, and attaches the relative clause naturally to the binding obligations. It preserves the legal metaphor “havitasimama” in the text and explains its legal sense in the footnote. The conditional construction and the final perfect verb preserve the source’s sequence: the father opposes on the day he hears, and Yahweh forgives because the father has opposed her.'
