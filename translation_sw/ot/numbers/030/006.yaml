source:
  edition: WLC
  text: וְ/אִם הֵנִ֨יא אָבִ֣י/הָ אֹתָ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛י/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם וַֽ/יהוָה֙ יִֽסְלַח לָ֔/הּ כִּי הֵנִ֥יא אָבִ֖י/הָ אֹתָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/006.yaml
  text: But if her father forbids her on the day he hears of it[a], none of her vows or her binding obligations by which she has bound herself shall stand; and Yahweh will forgive her[b], because her father forbade her.
translation:
  language: sw
  text: Lakini baba yake akimkataza siku anaposikia habari hizo, nadhiri zake zote wala vifungo vyake vyote ambavyo alijifunga navyo[a] havitasimama[b]. Naye Yahwe atamsamehe, kwa sababu baba yake alimkataza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ahadi zake za kujifunga” au “wajibu wake wa kujifunga.” Neno la Kiebrania humaanisha wajibu ambao mtu anajiwekea na unaomfunga, hasa katika muktadha wa nadhiri.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kihalisi: “havitasimama,” yaani havitabaki kuwa vya lazima au halali kumfunga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Huanzisha sharti lenye utofautishaji na hali iliyotangulia; ‘Lakini ikiwa’ huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: הֵנִיא
  choice: anamkataza / alimkataza
  rationale: Katika sheria hii ya nadhiri, kitenzi humaanisha baba kumpinga binti yake na hivyo kuzuia nadhiri yake isitekelezwe. Muundo huu pia huhifadhi kwamba binti ndiye shamirisho la moja kwa moja katika Kiebrania.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: siku anaposikia
  rationale: Huhifadhi kikomo mahususi cha wakati kilicho katika Kiebrania, yaani hatua ichukuliwe siku ile baba anaposikia.
- source_word: כָּל נְדָרֶיהָ
  choice: hakuna nadhiri yake
  rationale: Negesho la sentensi linatawala nadhiri zote; muundo wa ‘hakuna ... ambayo’ ni wa asili katika Kiswahili na unaonyesha kwamba hakuna hata moja itakayobaki na nguvu.
- source_word: וֶאֱסָרֶיהָ
  choice: sharti lake la kujifunga
  rationale: Nomino hii hurejelea wajibu wa hiari unaomfunga mtu, hasa katika muktadha wa nadhiri. ‘Sharti la kujifunga’ linaeleza nguvu yake ya kumwajibisha bila kulifanya kuwa sawa kabisa na nadhiri.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: la kujifunga
  rationale: Huwasilisha kwa ufupi na kwa kawaida wazo la mtu kujiwekea mwenyewe wajibu unaomfunga.
- source_word: לֹא יָקוּם
  choice: halitakuwa na nguvu
  rationale: Katika muktadha wa kisheria, maana ni kwamba nadhiri au sharti halitathibitishwa kuwa la lazima. Tafsiri hii ni wazi kwa msomaji wa sasa, huku tanbihi ikihifadhi sitiari halisi ya ‘kusimama.’
- source_word: וַיהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu, יהוה, badala ya kulibadilisha kuwa cheo.
- source_word: יִסְלַח לָהּ
  choice: atamsamehe
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kusamehe lenye mhusika wa kike kama mtendewa.
- source_word: כִּי
  choice: kwa sababu
  rationale: Huonyesha wazi sababu inayotolewa na kifungu chenyewe.
theological_decisions:
- issue: Maana ya msamaha wa Mungu baada ya baba kuzuia nadhiri
  choice: Kifungu kinasema tu kwamba Yahwe atamsamehe baada ya baba yake kumkataza kwa wakati unaotakiwa.
  alternative: Kuufafanua msamaha huu kuwa ondoleo la dhambi fulani iliyotokana na kutotimiza nadhiri.
  rationale: Muktadha wa karibu ni uhalali na nguvu ya kumfunga mtu kwa nadhiri. Tafsiri inadumisha kauli ya msamaha lakini haiongezi maelezo ya kidogma kuhusu aina au kiwango cha hatia ambayo maandishi hayaielezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka wazi muundo wa sheria bila kupoteza marudio ya kitendo cha baba kumkataza binti yake. Jina ‘Yahwe’ limetumiwa kwa יהוה, na tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
