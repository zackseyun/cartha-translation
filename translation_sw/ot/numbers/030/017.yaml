base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/017.yaml
  text: These are the statutes that Yahweh commanded Moses concerning a man and his wife[b][a], and concerning a father and his daughter in her youth in her father's house.
translation:
  language: sw
  text: Hizi ndizo kanuni ambazo Yahweh alimwamuru Musa kuhusu mume na mke wake[a], na kuhusu baba na binti yake, akiwa katika ujana wake nyumbani mwa baba yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya moja kwa moja zaidi: “kati ya mume na mke wake, na kati ya baba na binti yake.”'
    reason: lexical_alternative
  - marker: b
    text: Maneno “akiwa katika ujana wake nyumbani mwa baba yake” yanaelekeza kwenye kipindi ambacho binti huyo bado anaishi katika nyumba ya baba yake.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים
  choice: Hizi ndizo kanuni
  rationale: Muundo huu unatambulisha muhtasari wa masharti yaliyotangulia. “Kanuni” huhifadhi maana ya masharti yaliyowekwa kwa mamlaka katika muktadha wa kisheria.
- source_word: אֲשֶׁר צִוָּה
  choice: ambazo ... alimwamuru
  rationale: Kitenzi צוה kina maana ya kutoa amri. Muundo huu unamhifadhi Musa kuwa yule aliyeamriwa, kama inavyoonyeshwa na אֶת.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: בֵּין אִישׁ לְאִשְׁתּוֹ
  choice: kuhusu mume na mke wake
  rationale: Ingawa בֵּין kwa msingi humaanisha “kati ya,” hapa inaonyesha uhusiano unaohusika katika kanuni hizi. “Kuhusu” ni Kiswahili cha kawaida katika muhtasari wa kisheria, na אִישׁ katika uhusiano huu imefasiriwa “mume.”
- source_word: בֵּין אָב לְבִתּוֹ
  choice: na kuhusu baba na binti yake
  rationale: Hufuata muundo sambamba wa kishazi kilichotangulia na kuhifadhi wazi uhusiano wa baba na binti.
- source_word: בִּנְעֻרֶיהָ
  choice: akiwa katika ujana wake
  rationale: Huhifadhi wazo la kipindi cha ujana bila kukiweka kwa umri maalumu usiotajwa katika Kiebrania.
- source_word: בֵּית אָבִיהָ
  choice: nyumbani mwa baba yake
  rationale: Ni Kiswahili cha asili kinachoonyesha makazi katika nyumba ya baba, huku muktadha wa kifamilia na kisheria ukibaki wazi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia Tetragramatoni kama jina binafsi; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maneno ya kijinsia na mahusiano katika muktadha wa kisheria
  choice: mume ... mke wake ... baba ... binti yake
  alternative: mwanamume ... mke wake ... baba ... binti yake
  rationale: Maneno ya Kiebrania yanataja mahusiano yenye jinsia bayana. Katika jozi אִישׁ na אִשְׁתּוֹ, “mume na mke wake” ni ya kawaida zaidi katika Kiswahili, bila kubadilisha wahusika wa kisheria.
- issue: Maana ya בֵּין katika muhtasari wa kisheria
  choice: kuhusu
  alternative: kati ya
  rationale: “Kuhusu” huonyesha eneo la mahusiano linalosimamiwa na kanuni hizi. Tanbihi inahifadhi tafsiri ya moja kwa moja “kati ya” ili kutoficha muundo wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayosomeka kwa urahisi. Mtindo wa kisheria umehifadhiwa kwa “kanuni,” lakini sentensi imeundwa kwa mpangilio wa kawaida wa Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu karibu na vifungu vinavyohusika.
