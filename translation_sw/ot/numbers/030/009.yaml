  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ֠/אִם בְּ/י֨וֹם שְׁמֹ֣עַ אִישָׁ/הּ֮ יָנִ֣יא אוֹתָ/הּ֒ וְ/הֵפֵ֗ר אֶת נִדְרָ/הּ֙ אֲשֶׁ֣ר עָלֶ֔י/הָ וְ/אֵת֙ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָׁ֑/הּ וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/009.yaml
  text: But if[a], on the day her husband hears of it, he forbids her and annuls her vow that is upon her, or the rash utterance of her lips by which she bound herself, then Yahweh will forgive her.
translation:
  language: sw
  text: Lakini ikiwa, siku ambayo mume wake atasikia habari hiyo, atamzuia na kuibatilisha nadhiri yake iliyo juu yake, na kauli ya papara ya midomo yake[a] ambayo aliitumia kujifunga, basi Yahwe atamsamehe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kauli ya midomo yake” au “kauli ya kujifunga ya midomo yake.”
    reason: מִבְטָא inaweza kumaanisha tamko kwa ujumla, tamko la papara, au katika muktadha huu tamko linalomfunga msemaji kwa wajibu.
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Huanzisha sharti lenye utofautishaji na hali iliyotangulia, huku ikihifadhi maana ya kiunganishi cha Kiebrania.
- source_word: בְּיוֹם שְׁמֹעַ
  choice: siku ... atakaposikia habari hiyo
  rationale: Muundo huu unaonyesha wakati ambapo mume anapata habari ya nadhiri; ‘habari hiyo’ huweka wazi kitu kilichodokezwa bila kuongeza wazo jipya.
- source_word: אִישָׁהּ
  choice: mume wake
  rationale: Katika sheria hii, neno hilo pamoja na kiambishi cha umilikaji humaanisha mume wa mwanamke.
- source_word: יָנִיא אֹתָהּ
  choice: atamzuia
  rationale: Hiphil ya נוא katika muktadha wa nadhiri humaanisha kumzuia mtu asiendelee kutimiza wajibu huo au kuikataa nguvu yake.
- source_word: וְהֵפֵר
  choice: na kuibatilisha
  rationale: Katika lugha ya kisheria kuhusu nadhiri, kitenzi hiki humaanisha kuifanya isiwe na nguvu, si kuivunja kimwili.
- source_word: נִדְרָהּ אֲשֶׁר עָלֶיהָ
  choice: nadhiri yake iliyo juu yake
  rationale: Huhifadhi sitiari ya Kiebrania ya wajibu ulio ‘juu’ ya mtu, ambayo bado inaeleweka katika Kiswahili.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: kauli ya papara ya midomo yake
  rationale: ‘Kauli’ huhifadhi maana ya tamko lililotamkwa, na ‘ya papara’ huonyesha uwezekano wa tamko la haraka bila kuufanya muktadha wa kujifunga upotee; utata wa kileksika umeonyeshwa katika tanbihi.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: ambayo kwa hiyo alijifunga
  rationale: Ni usemi wa kujitia chini ya wajibu; ‘alijifunga’ huhifadhi picha na maana yake ya kisheria.
- source_word: וַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: יִסְלַח לָהּ
  choice: atamsamehe
  rationale: Kitenzi סלח hapa kinaeleza msamaha wa Yahwe kama matokeo ya kisheria ya kubatilishwa kwa nadhiri.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu la herufi nne; ‘Yahwe’ hulihifadhi kama jina binafsi.
- issue: Maana mahsusi ya מִבְטָא שְׂפָתֶיהָ
  choice: kauli ya papara ya midomo yake
  alternative: kauli ya midomo yake; kauli ya kujifunga ya midomo yake
  rationale: Neno מִבְטָא kwa msingi ni tamko, na huenda hapa likawa na maana ya tamko la haraka au lisilofikiriwa vizuri. Kwa kuwa maana hiyo si hakika kabisa, mbadala umehifadhiwa katika tanbihi badala ya kuondoa utata.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Muundo wa kisheria na sitiari ya wajibu ‘ulio juu yake’ zimehifadhiwa, huku sentensi ikibaki ya kawaida kwa msomaji wa sasa.
