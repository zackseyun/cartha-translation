  text: Na ikiwa aliweka nadhiri akiwa katika nyumba ya mume wake, au alijiwekea wajibu kwa kiapo,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Naye ikiwa
  rationale: Inaendeleza mtiririko wa masharti ya kisheria huku ikianzisha hali inayofuata.
- source_word: בֵּית אִישָׁהּ
  choice: akiwa katika nyumba ya mume wake
  rationale: Inahifadhi maana ya mahali na hali ya kindoa kwa Kiswahili cha kawaida bila kuifanya kuwa ‘nyumbani’ tu.
- source_word: נָדָרָה
  choice: aliweka nadhiri
  rationale: ‘Kuweka nadhiri’ ni usemi wa kawaida na wenye uzito wa kisheria na kidini kwa tendo la kuahidi kwa nadhiri.
- source_word: אוֹ
  choice: au
  rationale: Inaonyesha uwezekano mwingine unaohusiana katika sharti hili.
- source_word: אָסְרָה אִסָּר
  choice: alijifunga kwa wajibu
  rationale: Inawasilisha muundo wa kitenzi na nomino wenye mzizi mmoja kama tendo la mtu kujiwekea kifungo cha wajibu, bila tafsiri ngumu kupita kiasi.
- source_word: עַל נַפְשָׁהּ
  choice: alijifunga
  rationale: Katika nahau hii נֶפֶשׁ humaanisha nafsi ya mtu, yaani yeye mwenyewe; umbo la kujirejelea linaeleza hilo kwa kawaida.
- source_word: בִּשְׁבֻעָה
  choice: kwa kiapo
  rationale: Inaonyesha njia au hali iliyoambatana na tendo hilo, yaani wajibu ulithibitishwa kwa kiapo.
