base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/007.yaml
  text: But if she belongs to a husband[a], and her vows are upon her, or a rash utterance of her lips by which she has bound herself[b],
translation:
  language: sw
  text: Lakini ikiwa ataolewa,[a] huku nadhiri zake zikiwa juu yake, au tamko la papara la midomo yake ambalo amejifunga nalo,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa ameolewa.” Nahau ya Kiebrania kwa halisi ni, “atakuwa wa mwanamume”; humaanisha kuolewa au kuwa katika ndoa.
    reason: lexical_alternative
  - marker: b
    text: Au, “tamko la midomo yake.” Huenda maneno hayo yanamaanisha wajibu wa kujifunga uliotamkwa kwa papara, tofauti na nadhiri rasmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Inaendeleza masharti ya sheria iliyotangulia huku ikianzisha hali nyingine yenye utofauti mdogo.
- source_word: הָיוֹ תִהְיֶה לְאִישׁ
  choice: ikiwa ataolewa
  rationale: Muundo wa Kiebrania היה + לְאִישׁ ni nahau ya kuingia katika hali ya ndoa au kuwa ndani yake. Kiswahili ‘ataolewa’ ni cha kawaida na huwasilisha maana hiyo bila kutumia lugha isiyo ya kawaida ya umiliki; tanbihi inahifadhi uwezekano wa maana ya hali iliyopo.
- source_word: וּנְדָרֶיהָ עָלֶיהָ
  choice: huku nadhiri zake zikiwa juu yake
  rationale: Inahifadhi taswira ya Kiebrania ya wajibu unaokaa juu ya mtu, bila kuamua mapema kama nadhiri hizo tayari zimethibitishwa kisheria.
- source_word: אוֹ
  choice: au
  rationale: Ni kiunganishi cha kutenganisha kinacholeta aina nyingine ya kujifunga kwa maneno.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: tamko la papara la midomo yake
  rationale: מִבְטָא ni tamko au usemi; katika muktadha huu wa nadhiri linaweza kudokeza kujifunga kwa maneno yaliyotamkwa kwa papara, huku likibaki tofauti na nadhiri rasmi.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: ambalo amejifunga nalo
  rationale: אָסַר katika sheria za nadhiri humaanisha kujifunga au kujiwekea wajibu. נֶפֶשׁ hapa humrejelea mtu mwenyewe; ‘amejifunga nalo’ ni Kiswahili cha kawaida kinachohifadhi taswira ya kisheria.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika muktadha wa nadhiri
  choice: amejifunga nalo
  alternative: ameifunga nafsi yake kwa hilo
  rationale: Hapa נֶפֶשׁ humaanisha mtu mwenyewe katika wajibu aliojiwekea, si fundisho kuhusu nafsi isiyo ya kimwili.
- issue: Hali au kuingia katika ndoa katika הָיוֹ תִהְיֶה לְאִישׁ
  choice: ikiwa ataolewa
  alternative: ikiwa ameolewa
  rationale: Muundo unaweza kuelekea kuingia katika ndoa au kuwa katika hali hiyo. Matini kuu inatumia hali ya baadaye inayofaa mfululizo wa kesi ya kisheria, na tanbihi inahifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhiwa kama kifungu kisichokamilika kwa sababu aya yenyewe inaendelea kisintaksia katika aya inayofuata. Taswira ya ‘nadhiri kuwa juu yake’ imehifadhiwa kwa uaminifu kwa Kiebrania.
