  edition: WLC
  text: וְ/אִם הָפֵר֩ יָפֵ֨ר אֹתָ֥/ם אִישָׁ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל מוֹצָ֨א שְׂפָתֶ֧י/הָ לִ/נְדָרֶ֛י/הָ וּ/לְ/אִסַּ֥ר נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם אִישָׁ֣/הּ הֲפֵרָ֔/ם וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/013.yaml
  text: But if her husband indeed annuls them on the day he hears[a], then nothing that came from her lips—whether her vows or her binding obligation upon herself—shall stand. Her husband has annulled them[c][b], and Yahweh will forgive her.
translation:
  language: sw
  text: Lakini ikiwa mume wake atayabatilisha kabisa siku ile atakapoyasikia, basi lolote lililotoka midomoni mwake[a]—iwe ni nadhiri zake au kifungo alichojiwekea[b]—halitakuwa na nguvu. Mume wake ameyabatilisha, naye Yahwe[c] atamsamehe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kila kitokacho katika midomo yake”; huu ni usemi wa kisheria unaojumuisha matamko yake yote yenye kumfunga.
    reason: lexical_alternative
  - marker: b
    text: Au, “kifungo alichojifunga nacho mwenyewe.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: YHWH; limetolewa hapa kama “Yahwe.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Inaonyesha sharti lenye tofauti na hali iliyotangulia, huku ikihifadhi nguvu ya kiunganishi cha Kiebrania.
- source_word: הָפֵר יָפֵר
  choice: atayabatilisha kabisa
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi katika Kiebrania unatilia tendo mkazo; ‘kabisa’ huwasilisha mkazo huo kwa Kiswahili cha kawaida bila kurudia kitenzi.
- source_word: אֹתָם
  choice: atayabatilisha
  rationale: Kiambishi ‘-ya-’ kinarejelea kwa pamoja nadhiri na vifungo vilivyotajwa katika muktadha.
- source_word: אִישָׁהּ
  choice: mume wake
  rationale: Katika muktadha huu wa sheria ya ndoa, maana inayofaa ni ‘mume wake.’
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: siku ile atakapoyasikia
  rationale: Huhifadhi wakati maalumu wa kisheria wa kuchukua hatua baada ya mume kusikia ahadi hizo.
- source_word: כָּל מוֹצָא שְׂפָתֶיהָ
  choice: lolote lililotoka midomoni mwake
  rationale: Huhifadhi taswira halisi ya ‘kila kitokacho katika midomo yake’ na, pamoja na ukanushi unaofuata, huonyesha kwamba hakuna tamko lake litakalobaki na nguvu.
- source_word: לִנְדָרֶיהָ
  choice: nadhiri zake
  rationale: ‘Nadhiri’ ni neno la kawaida na sahihi katika muktadha wa ahadi za kidini na kisheria.
- source_word: וּלְאִסַּר נַפְשָׁהּ
  choice: kifungo alichojiwekea
  rationale: Huwasilisha wajibu ambao mwanamke amejifunga mwenyewe kuutimiza bila kulazimisha maana finyu zaidi kama kujinyima.
- source_word: לֹא יָקוּם
  choice: halitakuwa na nguvu
  rationale: Ni usemi wa kisheria unaomaanisha kwamba tamko halitabaki halali au lenye kumfunga.
- source_word: הֲפֵרָם
  choice: ameyabatilisha
  rationale: Wakati timilifu unaonyesha tendo lililokamilika na matokeo yake ya kisheria.
- source_word: וַיהוָה
  choice: naye Yahwe
  rationale: Jina la agano YHWH limetolewa kama ‘Yahwe’ badala ya kulibadilisha kuwa cheo.
- source_word: יִסְלַח לָהּ
  choice: atamsamehe
  rationale: Huwasilisha moja kwa moja tendo la Mungu la kusamehe bila kuongeza maelezo ya kimafundisho yasiyotajwa wazi.
theological_decisions:
- issue: Maana ya msamaha wa Mungu baada ya nadhiri kubatilishwa
  choice: 'Kifungu kinadumisha mfuatano wake: mume anabatilisha matamko, hayana tena nguvu, na Yahwe atamsamehe mwanamke.'
  alternative: Msamaha unaweza kueleweka kuwa unahusu hasa kutotimiza nadhiri, au pengine kosa la kufanya nadhiri bila tahadhari.
  rationale: Tafsiri haisemi kwa uwazi zaidi ya maandishi yanavyosema; inahifadhi uhusiano wa kisheria na kitheolojia kati ya kubatilishwa kwa nadhiri na msamaha bila kuamua chanzo mahususi cha hatia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Maneno ‘kubatilisha’ na ‘kuwa na nguvu’ yanafaa kwa muktadha wa kisheria; ‘kifungo alichojiwekea’ huhifadhi maana ya kujifunga kwa ahadi bila kusikika kwa kiufundi kupita kiasi.
