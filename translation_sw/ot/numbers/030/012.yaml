review_pass:
  verdict: revise
  source_fidelity: Tafsiri inafuata kwa ujumla muundo wa sharti na maana ya kisheria ya aya. Hata hivyo, “zitasimama” ikilinganishwa na “kitakuwa halali” hupunguza uradidi wa kitenzi kimoja cha Kiebrania (קום) katika vipashio vyote viwili. Pia maelezo ya chini yaseme kwa usahihi kwamba ukimya unahusu kutosema naye, bila kuongeza maana ya “kumkataza.”
  naturalness: Kiswahili kinaeleweka, lakini “kifungo alichojiwekea” kinaweza kusikika kwa upana na “kifungo” peke yake huweza kumaanisha kifungo cha gerezani. “Wajibu wa kujifunga” hufafanua maana ya אִסָּר kwa kawaida zaidi katika muktadha wa nadhiri.
  terminology: “Nadhiri” ni sahihi kwa נֶדֶר. Kwa אִסָּר, “wajibu wa kujifunga” huhifadhi dhana ya wajibu/sharti linalomfunga mtu bila kuingiza tafsiri ya kimadhehebu. “Kubatilisha” na “kubaki halali” zinafaa katika rejesta ya sheria.
  issues:
  - severity: medium
    issue: Ulinganifu wa kitenzi cha kisheria haurudiwi kwa uthabiti.
    rationale: Kitenzi קום hutumiwa kwa nadhiri zote na kwa kila אִסָּר. Kutumia “zitabaki halali” na “utabaki halali” kunahifadhi maana na ulinganifu huo vizuri zaidi kuliko kuchanganya “zitasimama” na “kitakuwa halali.”
  - severity: medium
    issue: Maelezo ya chini yana tafsiri halisi isiyo ya kawaida na yanaongeza “hamkatazi.”
    rationale: וְהֶחֱרִשׁ לָהּ ni ‘akaa kimya kwake/asi(m)wambie chochote’; “kumkataza” si maana ya moja kwa moja ya nahau hii. Kubatilisha kunatokana na kishazi kinachofuata, לֹא הֵנִיא אֹתָהּ.
  - severity: low
    issue: “Kifungo” peke yake ni pana katika Kiswahili cha sasa.
    rationale: Neno hilo linaweza kueleweka kama kifungo cha gerezani. Kuongeza “wajibu wa kujifunga” huonyesha wazi wajibu au sharti alilojifunga mwenyewe.
  revised_text: Ikiwa mume wake atasikia, naye asimwambie chochote[a] wala asibatilisha nadhiri zake, basi nadhiri zake zote zitabaki halali, na kila wajibu wa kujifunga aliojiwekea utabaki halali.
