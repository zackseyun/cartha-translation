  to: Ikiwa mume wake atasikia, naye asimwambie chochote[a] wala asibatilisha nadhiri zake, basi nadhiri zake zote zitabaki halali, na kila wajibu wa kujifunga aliojiwekea utabaki halali.
  rationale: Nimeondoa “Lakini,” ambayo si lazima kwa sharti lililo katika Kiebrania, na nimeweka msamiati wa kisheria ulio wazi. Marekebisho yanarudia “kubaki halali” kwa vipashio vyote viwili ili kuwakilisha kurudiwa kwa קום, na yanasahihisha maelezo ya chini ili lisichanganye ukimya na tendo la kubatilisha.
