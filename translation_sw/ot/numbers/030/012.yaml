base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/012.yaml
  text: And if her husband hears and says nothing to her[a], and does not nullify her vow, then all her vows shall stand, and every binding obligation that she has bound on herself shall stand.
translation:
  language: sw
  text: Ikiwa mume wake atasikia, naye asimwambie chochote[a] wala asibatilisha nadhiri zake, basi nadhiri zake zote zitabaki halali, na kila wajibu wa kujifunga aliojiwekea utabaki halali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “akaa kimya kwake.” Katika muktadha huu, maana yake ni kwamba hasemi naye kuhusu jambo hilo; ukimya wake una maana ya kutozibatilisha nadhiri au wajibu wake wa kujifunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע אִישָׁהּ
  choice: Lakini ikiwa mume wake atasikia
  rationale: Katika mtindo huu wa sheria, kitenzi kinaendeleza sharti la muktadha. אִישָׁהּ hapa humaanisha mume wake. Kiunganishi kimetafsiriwa “Lakini” kwa kuwa aya hii inaweka hali tofauti na ile iliyotangulia.
- source_word: וְהֶחֱרִשׁ לָהּ
  choice: naye asimwambie chochote
  rationale: Nahau hiyo ina maana ya kukaa kimya bila kumpinga; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: לֹא הֵנִיא אֹתָהּ
  choice: wala asizibatilisha nadhiri zake
  rationale: Kitenzi hiki katika sura hii huhusu kuondoa nguvu au uhalali wa nadhiri. Yambwa halisi ni mwanamke, lakini Kiswahili kinataja nadhiri zake wazi ili kuepuka dhana kwamba anayebatilishwa ni yeye mwenyewe.
- source_word: וְקָמוּ כָּל נְדָרֶיהָ
  choice: basi nadhiri zake zote zitasimama
  rationale: קום katika muktadha wa kisheria huonyesha kwamba jambo linaendelea kuwa na nguvu. “Zitasimama” huhifadhi sitiari na ulinganifu wa Kiebrania.
- source_word: וְכָל אִסָּר
  choice: na kila kifungo
  rationale: אִסָּר ni sharti au zuio linalomfunga mtu, hasa alilojiwekea. “Kifungo” huhifadhi sitiari ya mzizi אסר na maana ya wajibu unaomfunga.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: alichojiwekea
  rationale: Kiswahili hiki huwasilisha kwa kawaida maana ya kujifunga mwenyewe kwa sharti au zuio.
- source_word: יָקוּם
  choice: kitakuwa halali
  rationale: Katika hitimisho la kisheria, kitenzi humaanisha kwamba kifungo hicho kinabaki na nguvu au uhalali. Tafsiri hii huepuka usemi usio wa kawaida wa kusema kifungo “kitasimama,” huku ikihifadhi maana.
theological_decisions: []
