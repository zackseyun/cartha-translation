  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria wenye sharti umehifadhiwa, pamoja na ulinganifu wa nadhiri na kifungo.
