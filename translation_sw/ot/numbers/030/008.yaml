base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/008.yaml
  text: And if her husband hears of it on the day he hears[a], and is silent toward her, then her vows shall stand[b], and her binding obligations that she bound on herself shall stand.
translation:
  language: sw
  text: Na ikiwa mume wake atasikia siku atakaposikia, naye akanyamaza bila kumpinga[a], basi nadhiri zake zitabaki halali, na vifungo vyake vya kujifunga alivyoviweka juu yake mwenyewe vitabaki halali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye asimwambie lolote.” Nahau ya Kiebrania ya kunyamaza kwake inaonyesha kwamba mume hapingi; kwa hiyo nadhiri na vifungo hivyo hubaki halali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: Na ikiwa ... atasikia
  rationale: Katika mfululizo huu wa sheria, umbo hili linaendeleza sharti la kisheria; Kiswahili cha wakati ujao pamoja na “ikiwa” huonyesha hali hiyo kwa kawaida.
- source_word: אִישָׁהּ
  choice: mume wake
  rationale: Katika muktadha wa sheria ya ndoa, neno hili humaanisha mume, si mwanamume kwa ujumla.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: siku ile atakaposikia
  rationale: Huhifadhi msisitizo wa Kiebrania juu ya siku ambayo kusikia kunatokea, ambayo ndiyo muda wenye umuhimu wa kisheria.
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: naye akanyamaza bila kumpinga
  rationale: 'Huhifadhi picha ya kunyamaza huku ikieleza maana ya nahau katika muktadha huu: kutotoa pingamizi dhidi ya nadhiri.'
- source_word: וְקָמוּ / יָקֻמוּ
  choice: zitaendelea kuwa halali / yataendelea kuwa halali
  rationale: Katika sheria hii, kitenzi קום humaanisha kwamba ahadi hizo zinabaki na nguvu au uhalali. Kiswahili hiki ni cha kawaida na kinaonyesha athari ya kisheria kuliko tafsiri halisi “zitasimama.”
- source_word: נְדָרֶיהָ
  choice: nadhiri zake
  rationale: “Nadhiri” ni neno la kawaida la Kiswahili kwa ahadi nzito inayowekwa mbele za Mungu.
- source_word: וֶאֱסָרֶהָ
  choice: masharti yake ya kujifunga
  rationale: Nomino hii inatokana na wazo la kufunga na hurejelea wajibu au masharti ambayo mtu amejiwekea; uchaguzi huu unatofautisha kauli hiyo na “nadhiri” bila kupoteza sitiari ya kujifunga.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: aliyojitwika
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kuweka wajibu juu yako mwenyewe, huku uhusiano na “kujifunga” ukiwa tayari umehifadhiwa katika kirai kilichotangulia.
- source_word: נַפְשָׁהּ
  choice: mwenyewe (imewakilishwa katika “aliyojitwika”)
  rationale: Katika nahau hii נֶפֶשׁ humrejelea mtu mwenyewe, si nafsi kama sehemu isiyo ya mwili.
