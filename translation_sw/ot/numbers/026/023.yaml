base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/023.yaml
  text: 'The sons of Issachar by their clans: of Tola[a], the clan of the Tolaites; of Puvah, the clan of the Punites.'
translation:
  language: sw
  text: 'Wana wa Isakari kwa koo zao: wa Tola, ukoo wa Watolai; wa Puva[a], ukoo wa Wapuni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika vifungu vingine vinavyohusiana na katika tafsiri fulani, jina Puva huandikwa “Pua.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשָּׂשכָר
  choice: Wana wa Isakari
  rationale: Katika muktadha huu wa nasaba na sensa, בְּנֵי huonyesha wazao wa ukoo, lakini muundo wa moja kwa moja “wana wa” unahifadhi namna ya orodha ya Kiebrania na unaeleweka kwa maana ya kijumuiya.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה hapa ni mgawanyiko wa kikoo ndani ya kabila; “koo” ni sahihi na ya asili kuliko “familia” katika muktadha wa sensa.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Ni jina la mtu, hivyo limetoholewa badala ya kutafsiriwa kwa maana yake ya kawaida.
- source_word: מִשְׁפַּחַת הַתּוֹלָעִי
  choice: ukoo wa Watolai
  rationale: Umbo la kinasaba הַתּוֹלָעִי linataja watu waliotokana na Tola; “Watolai” ni umbo la kawaida la Kiswahili la jina la kundi.
- source_word: לְפֻוָה
  choice: wa Puva
  rationale: Kiambishi לְ katika orodha hii kinamtambulisha babu wa kila ukoo. Tahajia ya Kiebrania katika aya hii ni פֻוָה, inayowakilishwa kwa “Puva”; tahajia nyingine inayohusiana imetajwa katika tanbihi.
- source_word: מִשְׁפַּחַת הַפּוּנִי
  choice: ukoo wa Wapuni
  rationale: Umbo la kinasaba הַפּוּנִי linataja ukoo uliotokana na Puva; “Wapuni” linatoa jina la kundi kwa Kiswahili cha kawaida.
