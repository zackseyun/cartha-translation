lexical_decisions:
- source_word: אֵלֶּה
  choice: Hizi ndizo
  rationale: Kiashirio cha wingi kinaanzisha muhtasari wa koo zilizotangulia; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: מִשְׁפְּחֹת
  choice: koo
  rationale: Katika muktadha wa sensa ya kikabila, neno hili linamaanisha migawanyiko ya ukoo ndani ya kabila, si familia za nyumbani tu.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: לִפְקֻדֵיהֶם
  choice: kulingana na waliohesabiwa miongoni mwao
  rationale: Linahifadhi maana ya sensa ya mzizi פקד na kiambishi cha nafsi ya tatu wingi, huku likisomeka kwa Kiswahili cha kawaida.
- source_word: שִׁשָּׁה וְשִׁבְעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: sabini na sita elfu na mia tano
  rationale: Hutoa jumla kamili ya Kiebrania kwa mpangilio wa kawaida wa nambari katika Kiswahili.
