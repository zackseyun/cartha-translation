translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Koo” limetumiwa kwa maana ya vikundi vya nasaba katika sensa, na muundo wa sentensi umehifadhi msingi wa hesabu ulio katika Kiebrania.
