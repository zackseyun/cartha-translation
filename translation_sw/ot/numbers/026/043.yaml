lexical_decisions:
- source_word: כָּל
  choice: zote
  rationale: Inaonyesha ujumla wa koo zinazotajwa, kwa Kiswahili cha kawaida na kifupi.
- source_word: מִשְׁפְּחֹת
  choice: koo
  rationale: Katika muktadha wa sensa na nasaba za kikabila, neno hili linamaanisha vikundi vya ukoo; “koo” ni sahihi na la kawaida kuliko “familia” hapa.
- source_word: הַשּׁוּחָמִי
  choice: Washuhamu
  rationale: Ni jina la kundi la wazao wanaohusishwa na Shuhamu; kiambishi Wa- kinaonyesha watu wa kundi hilo kwa njia ya asili katika Kiswahili.
- source_word: לִפְקֻדֵיהֶם
  choice: kulingana na waliohesabiwa miongoni mwao
  rationale: Huhifadhi maana ya watu waliohesabiwa katika sensa, wala si tendo la kuhesabu tu.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 64,400
  rationale: Inatoa jumla kamili kwa mtindo wa kisasa na unaosomeka kwa urahisi.
