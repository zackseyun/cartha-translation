  text: All the families of the Shuhamites[a], according to those numbered among them, were sixty-four thousand four hundred.
translation:
  language: sw
  text: Koo zote za Washuhamu[a], kulingana na waliohesabiwa miongoni mwao, zilikuwa na watu 64,400.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “familia zote za Washuhamu.”
