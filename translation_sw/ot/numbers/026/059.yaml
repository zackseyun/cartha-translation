base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/059.yaml
  text: The name of Amram’s wife was Jochebed[a], the daughter of Levi, who was born to Levi in Egypt. She bore to Amram Aaron and Moses[b], and Miriam their sister.
translation:
  language: sw
  text: Jina la mke wa Amramu lilikuwa Yokebedi, binti wa Lawi[a], aliyezaliwa kwa Lawi huko Misri.[b] Naye akamzalia Amramu Aroni, Musa, na Miriamu, dada yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “binti wa Lawi.” Katika nasaba, neno “binti” wakati mwingine linaweza kutumiwa kwa maana pana ya mzao wa kike.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, Kiebrania husema, “ambaye [mama asiyeitwa] alimzaa kwa Lawi huko Misri”; mama anayefanya tendo hilo hatajwi wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אֵשֶׁת עַמְרָם
  choice: Jina la mke wa Amramu
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unawakilisha kwa usahihi mnyororo wa umilikaji wa Kiebrania; kiunganishi cha mwanzo hakihitajiki katika sentensi hii.
- source_word: יוֹכֶבֶד
  choice: Yokebedi
  rationale: Jina limetoholewa kwa namna inayotambulika katika matumizi ya kawaida ya Biblia ya Kiswahili.
- source_word: בַּת לֵוִי
  choice: binti wa Lawi
  rationale: Huhifadhi maana ya moja kwa moja ya Kiebrania bila kuibadili kimya kimya kuwa ‘mzao wa Lawi’; uwezekano mpana wa matumizi ya ukoo umeelezwa katika tanbihi.
- source_word: אֲשֶׁר יָלְדָה אֹתָהּ לְלֵוִי בְּמִצְרָיִם
  choice: aliyezaliwa kwa Lawi huko Misri
  rationale: Kauli tendwa ya asili ya Kiswahili huepuka kumtaja mama ambaye Kiebrania hakumtaji wazi, huku ikihifadhi uhusiano na Lawi na mahali pa kuzaliwa.
- source_word: וַתֵּלֶד לְעַמְרָם
  choice: Naye akamzalia Amramu
  rationale: Kitenzi ‘akamzalia’ kinaonyesha kwa ufupi kuwa watoto hao walizaliwa kwake Amramu, sawasawa na matumizi ya לְ katika Kiebrania.
- source_word: אֶת אַהֲרֹן וְאֶת מֹשֶׁה וְאֵת מִרְיָם אֲחֹתָם
  choice: Aroni, Musa, na Miriamu, dada yao
  rationale: Majina yametoholewa kwa kawaida ya Kiswahili, na kirai ‘dada yao’ kimehifadhiwa baada ya Miriamu kama katika mpangilio wa Kiebrania.
theological_decisions:
- issue: Maana ya kiukoo ya ‘binti wa Lawi’
  choice: Kuhifadhi ‘binti wa Lawi’ katika matini kuu
  alternative: mzao wa kike wa Lawi
  rationale: Matini ya Kiebrania inasema moja kwa moja ‘binti wa Lawi.’ Tafsiri haiamui kimya kimya swali la mpangilio wa vizazi; tanbihi inaonyesha uwezekano wa maana pana katika nasaba.
- issue: Mama wa Yokebedi katika kishazi cha kuzaliwa
  choice: Kutumia kauli ‘aliyezaliwa kwa Lawi’ bila kumtaja mama
  alternative: ambaye mama yake alimzaa kwa Lawi
  rationale: Kiebrania kina kitenzi cha kike na kiambishi cha mtendwa lakini hakimtaji mama wazi. Kauli iliyochaguliwa huhifadhi kutotajwa huko badala ya kuongeza mhusika katika matini kuu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Majina yametumia maumbo yanayotambulika sana katika Biblia za Kiswahili: Amramu, Yokebedi, Lawi, Aroni, Musa, na Miriamu.'
