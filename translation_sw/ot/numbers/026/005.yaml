  yaml_path: translation/ot/numbers/026/005.yaml
  text: 'Reuben[a], the firstborn of Israel: the sons of Reuben: of Hanoch, the clan of the Hanochites; of Pallu, the clan of the Palluites.'
translation:
  language: sw
  text: 'Reubeni[a], mzaliwa wa kwanza wa Israeli: wana wa Reubeni: kutoka kwa Hanoki, ukoo wa Wahanoki; kutoka kwa Palu, ukoo wa Wapalu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa muundo unaofuata Kiebrania kwa karibu zaidi: “wana wa Reubeni: Hanoki, ukoo wa Wahanoki; kwa Palu, ukoo wa Wapalu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹר
  choice: mzaliwa wa kwanza
  rationale: Kirai hiki kinaonyesha hadhi ya Reubeni kama mzaliwa wa kwanza wa Israeli, bila kuongeza neno “mwana,” ambalo linaeleweka kutokana na muktadha.
- source_word: בְּנֵי רְאוּבֵן
  choice: wana wa Reubeni
  rationale: Huhifadhi maana ya msingi ya “wana wa Reubeni”; katika orodha hii ya sensa, pia inawahusu wazao wake wa kiume walioanzisha koo.
- source_word: חֲנוֹךְ
  choice: Hanoki
  rationale: Hili ni umbo la jina linalosomeka kwa kawaida na kwa uwazi katika Kiswahili cha Biblia.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika muktadha wa sensa ya makabila, neno hili linamaanisha kitengo cha undugu ndani ya kabila; “ukoo” ni sahihi kuliko “familia.”
- source_word: הַחֲנֹכִי
  choice: Wahanoki
  rationale: Umbo hili la Kiebrania linataja kundi la wazao wa Hanoki; kiambishi Wa- huunda jina la kundi kwa Kiswahili.
- source_word: לְפַלּוּא
  choice: kutoka kwa Palu
  rationale: Kiambishi לְ kinaanzisha mwanzilishi wa ukoo katika orodha; “kutoka kwa” huonyesha uhusiano wa kizazi kwa Kiswahili cha kawaida.
- source_word: הַפַּלֻּאִי
  choice: Wapalu
  rationale: Linataja ukoo uliotokana na Palu; “Wapalu” ni umbo la kawaida la jina la kundi katika Kiswahili.
