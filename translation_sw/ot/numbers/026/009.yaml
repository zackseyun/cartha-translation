base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/009.yaml
  text: 'And the sons of Eliab: Nemuel[a], and Dathan, and Abiram. These are that Dathan and Abiram, the called ones of the congregation, who contended against Moses and against Aaron in the company of Korah, when they contended against Yahweh.'
translation:
  language: sw
  text: 'Na wana wa Eliabu: Nemueli, Dathani na Abiramu. Hawa ndio Dathani na Abiramu, walioitwa wa kusanyiko[a], walioshindana dhidi ya Musa na Haruni katika kusanyiko la Kora, waliposhindana dhidi ya Yahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wateule wa kusanyiko.”
    reason: Kishazi קרואי העדה chaweza kumaanisha kwa karibu “walioitwa wa kusanyiko,” au, kwa maana ya kiutendaji zaidi, watu walioteuliwa au waliotambuliwa na kusanyiko.
lexical_decisions:
- source_word: וּבְנֵי אֱלִיאָב
  choice: Na wana wa Eliabu walikuwa
  rationale: Katika orodha ya ukoo, בְּנֵי humaanisha wana wa kiume; kuongeza “walikuwa” kunafanya kishazi cha majina kisomeke kwa Kiswahili cha kawaida bila kubadili maana.
- source_word: הוּא דָתָן וַאֲבִירָם
  choice: Hawa ndio wale Dathani na Abiramu
  rationale: Ingawa הוּא ni umbo la umoja, hapa hutumiwa kutambulisha tena watu wawili waliotajwa; “hawa ndio wale” huhifadhi mkazo huo kwa Kiswahili cha asili.
- source_word: קרואי הָעֵדָה
  choice: walioitwa na kusanyiko
  rationale: Tafsiri hii huhifadhi maana ya msingi ya mzizi קרא, ‘ita,’ huku ikionyesha uhusiano wao na kusanyiko. Uwezekano wa kuwa ni watu walioteuliwa au mashuhuri umewekwa katika tanbihi.
- source_word: הִצּוּ / בְּהַצֹּתָם
  choice: walishindana / waliposhindana
  rationale: Mzizi נצה unaonyesha ugomvi au ushindani wa uadui. Kurudia “shindana” katika sehemu zote mbili huhifadhi urudiaji wa mzizi uleule katika Kiebrania.
- source_word: בַּעֲדַת־קֹרַח
  choice: katika kundi la Kora
  rationale: “Kundi” linaonyesha ushirika wao na Kora katika tukio hilo bila kulichanganya na kusanyiko lote la Israeli.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Maana ya קרואי העדה
  choice: walioitwa na kusanyiko
  alternative: wateule wa kusanyiko
  rationale: Kiebrania kinaweza kusisitiza kuitwa au hadhi ya watu waliotambuliwa na kusanyiko. Maandishi makuu yanabaki karibu na maana ya kimsamiati, na tafsiri yenye nguvu zaidi imehifadhiwa katika tanbihi.
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja; kwa hiyo tafsiri inalihifadhi kama “Yahwe” badala ya kuweka cheo mahali pake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Majina yametumiwa katika maumbo yaliyozoeleka katika Biblia za Kiswahili.
