  text: 'The sons of Joseph by their clans: Manasseh and Ephraim[a].'
translation:
  language: sw
  text: 'Wana wa Yosefu kwa koo zao: Manase na Efraimu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa muundo tegemezi wa בֵּן. Katika muktadha huu wa nasaba na sensa, “wana wa” huhifadhi wazi lugha ya ukoo kuliko neno pana zaidi “wazao wa”.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Jina la mtu limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Katika mpangilio wa kikabila wa sensa, מִשְׁפָּחָה humaanisha kikundi cha ukoo, si familia ndogo tu. Kiambishi לְ kinaonyesha uainishaji; “kwa koo zao” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Jina la mtu na kabila limetolewa kwa umbo lililozoeleka katika Biblia za Kiswahili.
- source_word: וְאֶפְרָיִם
  choice: na Efraimu
  rationale: Kiunganishi pamoja na jina la mtu na kabila kimetafsiriwa moja kwa moja, kwa umbo la kawaida la jina hilo katika Kiswahili.
