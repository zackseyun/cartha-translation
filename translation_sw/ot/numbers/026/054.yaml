  yaml_path: translation/ot/numbers/026/054.yaml
  text: To the larger group you shall increase its inheritance[a], and to the smaller group you shall diminish its inheritance[b]; each man's inheritance shall be given according to those numbered from him.
translation:
  language: sw
  text: Kwa kundi lenye watu wengi[a] utaongeza urithi wake, na kwa kundi lenye watu wachache utapunguza urithi wake; kila kundi litapewa urithi wake kulingana na hesabu ya watu wake waliohesabiwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania hutumia umoja: kihalisi, “kwa aliye wengi ... urithi wake.” Katika muktadha huu inarejelea kundi la kabila au ukoo lenye idadi kubwa.'
    reason: lexical_alternative
  - marker: b
    text: Au, “kulingana na waliohesabiwa wake,” yaani, kulingana na hesabu ya watu wake walioandikishwa katika sensa. Usemi wa Kiebrania ni mfupi na unaunganisha ugawaji wa urithi moja kwa moja na idadi iliyohesabiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרַב
  choice: kwa kundi lenye watu wengi
  rationale: Katika muktadha wa sensa na ugawaji wa nchi, רַב imetumiwa kama nomino kumaanisha kundi lenye idadi kubwa; tafsiri hii inaeleza maana hiyo kwa Kiswahili cha kawaida.
- source_word: תַּרְבֶּה
  choice: utaongeza
  rationale: Hifili ya רבה ina maana ya kufanya kitu kiwe kikubwa au kingi; hapa inahusu kuongeza sehemu ya urithi inayogawiwa.
- source_word: נַחֲלָתוֹ
  choice: urithi wake
  rationale: נַחֲלָה hapa ni mali, hasa ardhi, inayogawiwa kama urithi. Kiwakilishi cha umoja kinadumishwa kwa kulirejelea kundi kama kitu kimoja.
- source_word: וְלַמְעַט
  choice: na kwa kundi lenye watu wachache
  rationale: מְעַט inalinganishwa na רַב na katika muktadha huu humaanisha kundi lenye idadi ndogo.
- source_word: תַּמְעִיט
  choice: utapunguza
  rationale: Hifili ya מעט humaanisha kufanya kiwe kidogo; katika mstari huu ni kutoa sehemu ndogo zaidi ya urithi.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: אִישׁ ya umoja imetumiwa kwa maana ya kugawa kwa kila kundi linalohusika. 'Kila mmoja' ni usemi wa asili wa Kiswahili unaodumisha matumizi hayo ya kigawanyo bila kulazimisha maana ya mtu mmoja mmoja.
- source_word: לְפִי
  choice: kulingana na idadi ya
  rationale: לְפִי humaanisha 'kulingana na' na hapa hubeba wazo la uwiano; kuongeza 'idadi ya' kunafanya uhusiano na sensa uwe wazi kwa Kiswahili.
- source_word: פְקֻדָיו
  choice: watu wake waliohesabiwa
  rationale: Neno hili linarejelea watu wa kundi walioandikishwa katika sensa. Tafsiri inadumisha uhusiano unaoonyeshwa na kiambishi cha umoja huku ikitaja kitendo cha kuhesabu.
- source_word: יֻתַּן
  choice: atapewa
  rationale: Hii ni kauli tendwa ya נתן, 'kupewa'; muundo wa kauli tendwa umedumishwa kwa Kiswahili cha asili.
