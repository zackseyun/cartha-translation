base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/017.yaml
  text: From Arod[a], the clan of the Arodites; from Areli, the clan of the Arelites.
translation:
  language: sw
  text: Kutoka kwa Arodi[a], ukoo wa Wa-Arodi; kutoka kwa Areli, ukoo wa Wa-Areli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Kwa Arodi ulikuwa ukoo wa Wa-Arodi; kwa Areli ulikuwa ukoo wa Wa-Areli.” Kihusishi cha Kiebrania לְ kinatangulia kila jina la babu katika mtindo maalumu wa sensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאֲרוֹד
  choice: Kutoka kwa Arodi
  rationale: Katika mtindo huu wa sensa, kiambishi לְ kinamtaja babu ambaye ukoo unatokana naye. ‘Kutoka kwa’ ni Kiswahili cha kawaida kinachoonyesha nasaba huku kikidumisha muundo unaorudiwa.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika muktadha wa sensa na makabila, מִשְׁפָּחָה ni kundi la jamaa ndani ya kabila; ‘ukoo’ ni tafsiri ya asili na inayoeleweka katika Kiswahili.
- source_word: הָאֲרוֹדִי
  choice: Wa-Arodi
  rationale: Umbo hili la Kiebrania linataja kwa pamoja wazao wa Arodi. ‘Wa-Arodi’ linaonyesha kundi la watu linalohusishwa na jina hilo.
- source_word: לְאַרְאֵלִי
  choice: kutoka kwa Areli
  rationale: Kama katika לַאֲרוֹד, kiambishi לְ kinamtambulisha babu wa ukoo. ‘Kutoka kwa Areli’ kinahifadhi ulinganifu wa kifungu.
- source_word: הָאַרְאֵלִי
  choice: Wa-Areli
  rationale: Umbo la Kiebrania linataja kundi la wazao wa Areli; ‘Wa-Areli’ ni umbo la kawaida la Kiswahili kwa jina la watu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa orodha ya sensa. Majina yameandikwa Arodi na Areli ili yatamkike kwa urahisi katika Kiswahili; alama ya kiungio katika Wa-Arodi na Wa-Areli husaidia kutenganisha kiambishi cha kundi na jina la pekee.
