lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Kitenzi hiki kimsingi ni ‘akasema,’ lakini kwa kuwa Musa na Eleazari ndio wanaoambiwa, ‘akawaambia’ ni Kiswahili cha kawaida kinachohifadhi tendo la kusema na wingi wa walengwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: אֶל־מֹשֶׁה וְאֶל אֶלְעָזָר
  choice: Musa na Eleazari
  rationale: Majina yametoholewa kwa maumbo yaliyozoeleka katika Kiswahili, huku uratibu wa walengwa wawili ukihifadhiwa kwa ‘na.’
- source_word: בֶּן־אַהֲרֹן הַכֹּהֵן
  choice: mwana wa Haruni kuhani
  rationale: Muundo huu unahifadhi uhusiano wa ukoo na cheo kinachomfuata Haruni katika Kiebrania bila kuongeza maelezo yasiyokuwapo katika chanzo.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Neno hili linaanzisha maneno ya moja kwa moja yanayofuata; ‘akisema’ huhifadhi fomula ya usemi ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu, kwa hiyo ‘Yahwe’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Cheo הַכֹּהֵן kinamhusu nani
  choice: Haruni kuhani
  alternative: Eleazari kuhani
  rationale: Mahali pa cheo mara tu baada ya ‘Haruni’ katika kirai ‘mwana wa Haruni kuhani’ kinaunga mkono kukihusisha na Haruni, ingawa Eleazari pia anajulikana kuwa kuhani katika muktadha mpana.
translation_notes:
