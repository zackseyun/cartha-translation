translation:
  language: sw
  text: 'Wana wa Yuda: Eri na Onani. Lakini[a] Eri na Onani walikufa katika nchi ya Kanaani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na Eri na Onani walikufa katika nchi ya Kanaani.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa tu kuwa “na”; “lakini” limetumiwa katika maandishi kuonyesha utofautishaji unaodokezwa na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Ni wingi wa hali ya kuambatanisha wa בֵּן katika orodha ya ukoo; “wana wa” huhifadhi maana ya wana wa kiume kwa Kiswahili cha kawaida.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina la mtu limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: עֵר
  choice: Eri
  rationale: Jina la mtu limetoholewa kwa matamshi na tahajia ya kawaida ya Kiswahili.
- source_word: וְ/אוֹנָן
  choice: na Onani
  rationale: Kiunganishi וְ kimetafsiriwa “na,” huku jina likitoholewa kwa umbo la Kiswahili.
- source_word: וַ/יָּמָת
  choice: Lakini ... walikufa
  rationale: Kitenzi cha מוּת kinaeleza tukio la wakati uliopita. “Lakini” huonyesha ugeukaji wa kimuktadha kutoka kuwataja wana hao hadi kueleza kwamba walikufa, bila kuficha kwamba kiunganishi cha Kiebrania kinaweza kutafsiriwa “na.”
- source_word: בְּ/אֶרֶץ
  choice: katika nchi ya
  rationale: Kirai hiki ni tafsiri ya asili ya usemi wa kijiografia בְּאֶרֶץ katika Kiswahili sanifu.
- source_word: כְּנָעַן
  choice: Kanaani
  rationale: Jina la mahali limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
