base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/030.yaml
  text: 'These were the sons of Gilead: of Iezer[a], the clan of the Iezerites; of Helek, the clan of the Helekites.'
translation:
  language: sw
  text: 'Hawa ndio wana wa Gileadi[a]: wa Iezeri, ukoo wa Waiezeri; wa Heleki, ukoo wa Waheleki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno ya Kiebrania “wana wa Gileadi” yanaweza kumaanisha wazao wa ukoo wa kiume au koo zilizotokana naye, si wana wake wa moja kwa moja tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa ndio
  rationale: Huanzisha orodha kwa Kiswahili cha kawaida na chenye hadhi; kiashiria cha Kiebrania hakina wakati wa kisarufi, hivyo hakuna haja ya kuongeza kitenzi cha wakati uliopita.
- source_word: בְּנֵי גִלְעָד
  choice: wana wa Gileadi
  rationale: Inahifadhi lugha rasmi ya nasaba ya Kiebrania. Katika muktadha huu wa sensa, inaweza kumaanisha wazao wa ukoo wa kiume au matawi ya ukoo, si lazima wana wa moja kwa moja.
- source_word: אִיעֶזֶר
  choice: Iezeri
  rationale: Jina la mtu limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili bila kutafsiri maana yake.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Hapa neno hilo linamaanisha kitengo cha ukoo ndani ya kabila; “ukoo” ni sahihi zaidi kuliko “familia,” ambalo linaweza kueleweka kuwa nyumba ndogo tu.
- source_word: הָאִיעֶזְרִי
  choice: Waiezeri
  rationale: Umbo la Kiebrania linataja watu wa ukoo uliotokana na Iezeri; kiambishi cha Kiswahili “Wa-” kinaonyesha kundi hilo kwa kawaida.
- source_word: לְחֵלֶק
  choice: wa Heleki
  rationale: Katika mtindo huu wa sensa, kiambishi לְ kinamtambulisha mwanzilishi mwingine wa ukoo; “wa Heleki” hudumisha muundo mfupi na unaorudiwa wa aya.
- source_word: הַחֶלְקִי
  choice: Waheleki
  rationale: Ni jina la watu wa ukoo wa Heleki, lililotolewa kwa muundo wa kawaida wa Kiswahili wa majina ya makundi.
