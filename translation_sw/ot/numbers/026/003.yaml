lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: wakasema
  rationale: Kitenzi hiki kinaanzisha maneno yatakayofuata; “wakasema” ni Kiswahili cha kawaida na chenye hadhi katika simulizi.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: וְאֶלְעָזָר
  choice: na ... Eleazari
  rationale: Huhifadhi Eleazari kama mhusika wa pili katika kiima ambatani pamoja na Musa.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hutaja cheo cha Eleazari bila kuongeza cheo cha “kuhani mkuu,” ambacho hakipo katika mstari huu.
- source_word: אֹתָם
  choice: nao
  rationale: Baada ya “kusema,” “wakasema nao” ni njia ya asili ya kuonyesha wale walioelekezewa maneno.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: katika nchi tambarare za Moabu
  rationale: “Nchi tambarare” huwasilisha eneo tambarare la nyika linalomaanishwa na עַרְבוֹת kwa lugha inayoeleweka kwa urahisi.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: kando ya Yordani mkabala na Yeriko
  rationale: Hueleza mahali karibu na Yordani kwa uhusiano na Yeriko; “mkabala na Yeriko” huakisi kwa uwazi eneo la upande mwingine wa mto katika fomula hii ya kijiografia.
- source_word: לֵאמֹר
  choice: wakisema,
  rationale: Huhifadhi muundo wa Kiebrania unaotanguliza maudhui ya hotuba yatakayofuata katika mstari unaofuata.
