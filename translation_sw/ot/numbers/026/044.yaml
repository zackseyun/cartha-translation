base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/044.yaml
  text: 'The sons of Asher by their clans: of Imnah[a], the clan of the Imnites; of Ishvi, the clan of the Ishvites; of Beriah[b], the clan of the Beriites.'
translation:
  language: sw
  text: 'Wana wa Asheri, kwa koo zao[a]: wa Imna, ukoo wa Waimna; wa Ishvi, ukoo wa Waishvi; wa Beria, ukoo wa Waberia.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kutafsiriwa “familia”; katika sensa hii linamaanisha koo zilizokuwa sehemu za kabila.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hapa lina umbo la jina la wanaukoo lililotokana na Beria; kwa karibu zaidi linaweza kutolewa “Waberii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  choice: Wana wa Asheri
  rationale: בְּנֵי kwa kawaida ni ‘wana wa’; katika orodha hii ya nasaba inawahusu wazao wa kiume walioanzisha koo. ‘Asheri’ ni umbo la jina lililozoeleka katika Kiswahili cha Biblia.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה katika sensa ya Hesabu ni mgawanyo wa ukoo ndani ya kabila, si familia ndogo ya nyumbani.
- source_word: לְיִמְנָה
  choice: wa Imna
  rationale: Kihusishi לְ katika mtindo huu wa nasaba kinatambulisha babu ambaye ukoo unatokana naye; ‘wa’ ni fasiri fupi na ya kawaida katika Kiswahili.
- source_word: מִשְׁפַּחַת הַיִּמְנָה
  choice: ukoo wa Waimna
  rationale: Umbo la Kiebrania ni jina la watu wa ukoo lililotokana na Imna; ‘Waimna’ linaonyesha wanaukoo hao kwa namna ya kawaida ya Kiswahili.
- source_word: לְיִשְׁוִי
  choice: wa Ishvi
  rationale: יִשְׁוִי ni jina la mtu, hivyo limetoholewa badala ya kutafsiriwa.
- source_word: מִשְׁפַּחַת הַיִּשְׁוִי
  choice: ukoo wa Waishvi
  rationale: Hili ni jina la ukoo linalotokana na Ishvi; kiambishi ‘Wa-’ kinaonyesha watu wa ukoo huo.
- source_word: לִבְרִיעָה
  choice: wa Beria
  rationale: Kihusishi לִ kinaanzisha jina la babu wa ukoo; ‘Beria’ ni utohozi wa jina בְּרִיעָה.
- source_word: מִשְׁפַּחַת הַבְּרִיעִי
  choice: ukoo wa Waberia
  rationale: בְּרִיעִי ni jina la wanaukoo lililotokana na Beria. ‘Waberia’ ni umbo la asili na linaloeleweka katika Kiswahili.
