  text: of Ozni[a], the clan of the Oznites; of Eri[b], the clan of the Erites.
translation:
  language: sw
  text: wa Ozni[a], ukoo wa Waozni; wa Eri[b], ukoo wa Waeri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “familia ya Waozni.” Kiebrania hutumia neno la ukoo pamoja na umbo la kijina linalorejelea wazao wa Ozni.
    reason: lexical_alternative
  - marker: b
    text: Au, “familia ya Waeri.” Kiebrania hutumia neno la ukoo pamoja na umbo la kijina linalorejelea wazao wa Eri.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אָזְנִי
  choice: wa Ozni
  rationale: Katika orodha hii ya sensa, kiambishi לְ kinamtambulisha babu ambaye ukoo unatokana naye. Kiswahili cha orodha kinawakilisha uhusiano huo kwa ufupi na kwa kawaida kwa ‘wa’; jina Ozni limetoholewa kwa herufi za Kiswahili.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika muktadha wa kikabila na wa sensa, מִשְׁפָּחָה ni kundi pana la watu wenye asili moja ndani ya kabila, hivyo ‘ukoo’ linafaa kuliko ‘familia,’ ambalo mara nyingi humaanisha kaya au ndugu wa karibu.
- source_word: הָ/אָזְנִי
  choice: Waozni
  rationale: Umbo la Kiebrania ni jina la kundi la wazao wa Ozni. Kiambishi cha Kiswahili ‘Wa-’ kinaonyesha watu wa ukoo huo kwa njia ya kawaida.
- source_word: לְ/עֵרִי
  choice: wa Eri
  rationale: Kama ilivyo katika לְאָזְנִי, לְ linaonyesha mstari wa ukoo unaotokana na Eri; ‘wa Eri’ ni usemi mfupi na wa asili katika orodha hii.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Neno lilelile limetafsiriwa kwa uthabiti katika vipashio vyote viwili vya mstari.
- source_word: הָ/עֵרִי
  choice: Waeri
  rationale: Umbo hili la Kiebrania linataja kundi la wazao wa Eri; ‘Waeri’ linawasilisha jina hilo la kundi kwa muundo wa kawaida wa Kiswahili.
