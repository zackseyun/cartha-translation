base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/024.yaml
  text: of Jashub, the clan of the Jashubites; of Shimron, the clan of the Shimronites.
translation:
  language: sw
  text: wa Yashubu, ukoo wa Wayashubu; wa Shimron, ukoo wa Washimroni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָשׁוּב
  choice: wa Yashubu
  rationale: Katika orodha hii ya sensa, לְ kabla ya jina la mtu humtaja babu ambaye ukoo umetokana naye; “wa Yashubu” ni usemi wa kawaida wa Kiswahili na unadumisha muundo wa orodha.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika muktadha wa sensa ya makabila, מִשְׁפָּחָה ni kitengo cha kindugu ndani ya kabila; “ukoo” ni sahihi zaidi kuliko “familia” hapa.
- source_word: הַ/יָּשׁוּבִי
  choice: Wayashubu
  rationale: Umbo hili la Kiebrania hutaja kundi la wazao wa Yashubu; “Wayashubu” linatoa jina la ukoo kwa namna fupi na ya asili katika Kiswahili.
- source_word: לְ/שִׁמְרֹן
  choice: wa Shimroni
  rationale: Kama ilivyo kwa Yashubu, לְ humtambulisha babu ambaye jina la ukoo limetokana naye; “wa Shimroni” huhifadhi urudiaji wa muundo.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Neno hilo limetafsiriwa vivyo hivyo katika kifungu cha pili ili kuhifadhi ulinganifu wa orodha.
- source_word: הַ/שִּׁמְרֹנִי
  choice: Washimroni
  rationale: Umbo la jina la kundi linawataja wazao wa Shimroni; “Washimroni” ni jina la ukoo linaloeleweka kiasili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha fupi na yenye staha inayofaa orodha ya sensa. Tahajia Yashubu na Shimroni zimechaguliwa ili majina yaweze kutamkwa kwa urahisi katika Kiswahili, huku miundo ya Wayashubu na Washimroni ikitambulisha koo zao.
