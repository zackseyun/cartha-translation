  yaml_path: translation/ot/numbers/026/039.yaml
  text: Of Shupham[a], the clan of the Shuphamites; of Hupham, the clan of the Huphamites.
translation:
  language: sw
  text: Wa Shupamu[a], ukoo wa Washupamu; wa Hupamu, ukoo wa Wahupamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina jina Shupamu katika mstari huu; mapokeo mengine ya maandishi au orodha sambamba yana tahajia zinazohusiana.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁפוּפָם
  choice: Wa Shufamu
  rationale: Katika orodha hii ya sensa, kiambishi לְ kinaonyesha uhusiano wa ukoo au asili; “wa” ni namna ya kawaida na fupi ya kuonyesha hilo kwa Kiswahili. Jina la Kiebrania limetoholewa kuwa “Shufamu” kwa matamshi ya kawaida ya Kiswahili.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika muktadha wa sensa na makabila, מִשְׁפָּחָה ni kundi la jamaa ndani ya kabila; “ukoo” linaonyesha vizuri mgawanyiko huo wa kindugu.
- source_word: הַשּׁוּפָמִי
  choice: Washufamu
  rationale: Umbo hili la Kiebrania ni jina la watu wa ukoo unaotokana na Shufamu. Kiambishi “Wa-” kinatoa kwa kawaida maana ya kundi la watu katika Kiswahili.
- source_word: לְחוּפָם
  choice: wa Hufamu
  rationale: Kama katika kishazi cha kwanza, לְ linaonyesha uhusiano wa ukoo. Jina limetoholewa kuwa “Hufamu” kwa mfumo wa sauti wa Kiswahili.
- source_word: הַחוּפָמִי
  choice: Wahufamu
  rationale: Jina hili la kundi linamaanisha watu wa ukoo wa Hufamu; “Wahufamu” ni umbo la kawaida na linaloeleweka katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Lugha ni fupi, yenye staha, na inafuata muundo unaojirudia wa orodha ya sensa. “Ukoo” limetumiwa badala ya “jamaa” ili kubainisha kundi la kindugu ndani ya kabila, huku majina yakitoholewa kwa matamshi ya Kiswahili.
