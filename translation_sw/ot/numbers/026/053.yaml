  yaml_path: translation/ot/numbers/026/053.yaml
  text: To these the land shall be divided as an inheritance according to the number of names[a].
translation:
  language: sw
  text: Kwa hawa nchi itagawanywa kuwa urithi, kulingana na idadi ya majina[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na idadi ya watu”; kihalisi, “kulingana na idadi ya majina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵלֶּה
  choice: kwa hawa
  rationale: Kiambishi ל pamoja na kiwakilishi cha wingi kinaonyesha wale watakaopokea mgao; “kwa hawa” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: תֵּחָלֵק
  choice: itagawanywa
  rationale: Kitenzi cha Nifali kina maana ya kutendwa, yaani nchi kugawanywa au kutengewa sehemu.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha wa kugawa eneo kwa makabila ya Israeli, “nchi” ni tafsiri ya kawaida na ya asili.
- source_word: בְּנַחֲלָה
  choice: kuwa urithi
  rationale: נחלה ni mali au sehemu inayopokelewa kama urithi; “kuwa urithi” huhifadhi wazo la urithi na la milki iliyogawiwa.
- source_word: בְּמִסְפַּר
  choice: kulingana na idadi ya
  rationale: Kiambishi ב hapa kinaonyesha kipimo au msingi wa mgao; “kulingana na idadi ya” hutoa maana hiyo kwa uwazi.
- source_word: שֵׁמוֹת
  choice: majina
  rationale: Neno la Kiebrania linasema kihalisi “majina.” Kulihifadhi huepuka kufafanua kupita kiasi, huku tanbihi ikieleza maana ya watu waliohesabiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio ni wa asili katika Kiswahili huku ukihifadhi lugha ya urithi na usemi halisi “majina.”
