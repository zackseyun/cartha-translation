base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/061.yaml
  text: But Nadab and Abihu died when they offered strange fire before Yahweh[a].
translation:
  language: sw
  text: Lakini Nadabu na Abihu walikufa walipotoa moto usioruhusiwa mbele za Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “moto wa ajabu” au “moto wa kigeni.” Kiebrania kinamaanisha moto ambao haukuruhusiwa kutolewa mbele za Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: walikufa
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umoja kwa sababu kinatangulia kiima ambatani, Nadabu na Abihu ndio kiima; Kiswahili cha kawaida kinahitaji wingi.
- source_word: נָדָב וַאֲבִיהוּא
  choice: Nadabu na Abihu
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בְּהַקְרִיבָם
  choice: walipotoa
  rationale: Muundo wa ב pamoja na kitenzi-jina na kiambishi cha nafsi una maana ya wakati hapa; “walipotoa” ni wa kawaida na unafaa katika muktadha wa sadaka.
- source_word: אֵשׁ זָרָה
  choice: moto usioruhusiwa
  rationale: Katika muktadha wa ibada, זָרָה huonyesha kitu kisichofaa au kisichoidhinishwa. Tafsiri hii inaeleza maana kwa Kiswahili cha sasa, huku tanbihi ikihifadhi maana halisi inayoweza kuwa “moto wa kigeni” au “moto wa ajabu.”
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי ina maana ya kuwa mbele au katika uwepo wa mtu katika muktadha huu wa ibada; jina la Mungu יהוה limetolewa kama Yahwe.
- source_word: וַ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya orodha ya ukoo inayozunguka mstari huu na taarifa ya pekee kuhusu kifo cha wana hawa wawili.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa wasomaji wa kawaida, huku tanbihi ikihifadhi upana wa maana ya אֵשׁ זָרָה.
