  text: 'These are the clans of the sons of Asher according to those numbered of them: fifty-three thousand four hundred[a].'
translation:
  language: sw
  text: Hizi ndizo koo za wana wa Asheri; idadi ya waliohesabiwa kati yao ilikuwa 53,400.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa waliohesabiwa wao.” Kiebrania hutumia istilahi ya sensa inayotokana na kitenzi פקד, ikimaanisha wale walioandikishwa au kuhesabiwa rasmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hizi ndizo
  rationale: Kiwakilishi cha wingi kinaanzisha muhtasari; Kiswahili cha kawaida hutumia muundo wa utambulisho “Hizi ndizo” kwa kurejelea koo.
- source_word: מִשְׁפְּחֹת
  choice: koo
  rationale: Katika muktadha wa sensa ya kabila, neno hili linamaanisha makundi mapana ya watu wenye nasaba moja, si familia ndogo za nyumbani.
- source_word: בְּנֵי אָשֵׁר
  choice: wana wa Asheri
  rationale: Huhifadhi namna ya usemi wa Kiebrania kuhusu ukoo na wazao; hapa inawahusu wazao wa kikabila wa Asheri.
- source_word: לִפְקֻדֵיהֶם
  choice: kulingana na waliohesabiwa miongoni mwao
  rationale: Neno linalotokana na פקד lina maana ya sensa rasmi au uandikishaji; “miongoni mwao” huonyesha kuwa waliohesabiwa walitoka katika koo hizo.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: watu 53,400
  rationale: Hutoa jumla kamili kwa mtindo wa kisasa wa kuandika namba; “watu” inaeleza kwa kawaida kinachohesabiwa katika sensa bila kubadili idadi.
