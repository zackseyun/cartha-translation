base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/034.yaml
  text: These are the clans of Manasseh, and those numbered from them were fifty-two thousand seven hundred.
translation:
  language: sw
  text: Hizi ndizo koo za Manase, na waliohesabiwa miongoni mwao walikuwa 52,700.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walioandikishwa.” Kiebrania kinatumia umbo la neno פקד, linalowarejelea waliohesabiwa au kuandikishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hizi ndizo
  rationale: Kauli ya kuonyesha na kujumlisha orodha iliyotangulia; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: מִשְׁפְּחֹת
  choice: koo
  rationale: Katika muktadha wa sensa ya Hesabu, neno hili linamaanisha makundi mapana ya ukoo ndani ya kabila, si familia za nyumbani tu.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Hili ndilo umbo la kawaida la jina hili katika mapokeo ya Biblia ya Kiswahili.
- source_word: וּפְקֻדֵיהֶם
  choice: waliohesabiwa miongoni mwao
  rationale: Linadumisha maana ya watu waliohesabiwa au kuandikishwa katika sensa na uhusiano wao na koo zilizotajwa, bila kuongeza wazi neno 'wanaume' ambalo halipo katika kishazi hiki.
- source_word: שְׁנַיִם וַחֲמִשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 52,700
  rationale: Huonyesha kwa usahihi jumla ya watu elfu hamsini na mbili na mia saba kwa namna iliyo wazi kwa msomaji wa kisasa.
