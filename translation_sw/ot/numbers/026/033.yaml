  text: וּ/צְלָפְחָ֣ד בֶּן חֵ֗פֶר לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/שֵׁם֙ בְּנ֣וֹת צְלָפְחָ֔ד מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/033.yaml
  text: Zelophehad son of Hepher had no sons[a], but only daughters; and the names of Zelophehad’s daughters were Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.
translation:
  language: sw
  text: Selofehadi mwana wa Heferi hakuwa na wana wa kiume[a], bali alikuwa na mabinti tu. Majina ya mabinti za Selofehadi yalikuwa Mahla, Noa[b], Hogla, Milka na Tirsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “hawakuwapo kwake wana, isipokuwa mabinti.”
    reason: lexical_alternative
  - marker: b
    text: “Noa” hapa ni jina la mmoja wa mabinti za Selofehadi, si Noa wa simulizi la gharika.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/צְלָפְחָד בֶּן חֵפֶר
  choice: Selofehadi mwana wa Heferi
  rationale: Kiunganishi ו־ kinaendeleza muktadha bila kuhitaji neno la wakati kama “sasa.” Majina yametoholewa kwa namna inayotambulika katika Kiswahili, na uhusiano wa ukoo umehifadhiwa moja kwa moja.
- source_word: לֹא הָיוּ לֹו בָּנִים
  choice: hakuwa na wana wa kiume
  rationale: Hii ni Kiswahili cha kawaida kinachowasilisha maana ya muundo wa Kiebrania, “hawakuwapo kwake wana.” Ufafanuzi “wa kiume” unaonyesha wazi tofauti iliyokusudiwa kati ya wana na binti.
- source_word: כִּי אִם בָּנוֹת
  choice: bali alikuwa na binti tu
  rationale: 'Muundo כִּי אִם unaonyesha tofauti pamoja na upekee: hakuwa na wana wa kiume, lakini alikuwa na binti pekee.'
- source_word: וְשֵׁם בְּנוֹת צְלָפְחָד
  choice: Majina ya binti za Selofehadi yalikuwa
  rationale: Ingawa שֵׁם ni umoja katika Kiebrania, hapa hutumiwa kwa maana ya kijumla kabla ya orodha ya majina; wingi ni wa kawaida na wazi katika Kiswahili.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: Mahla, Noa, Hogla, Milka na Tirsa
  rationale: Majina haya ya watu yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili. Alama ya tanbihi imewekwa baada ya “Noa,” jina ambalo linaweza kuchanganywa na Noa wa simulizi la gharika.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Mpangilio wa Kiebrania umehifadhiwa kwa kadiri inayowezekana bila kufanya sentensi isikike ngumu. Alama ya tanbihi [b] imesahihishwa iwe baada ya jina “Noa,” ambalo ndilo linalofafanuliwa na tanbihi.
