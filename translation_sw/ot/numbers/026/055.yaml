base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/055.yaml
  text: Only by lot shall the land be divided[a]; they shall inherit according to the names of the tribes of their fathers.
translation:
  language: sw
  text: Nchi itagawanywa kwa kura tu; watairithi kulingana na majina ya makabila ya baba zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mababu zao.” Kiebrania kinasema kihalisi “baba zao,” kikirejelea mistari ya ukoo wa upande wa baba ndani ya makabila.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini ... tu
  rationale: Katika muktadha huu neno hilo lina nguvu ya kuzuia au kusisitiza upekee wa njia ya ugawaji. Muundo wa Kiswahili “Lakini ... tu” unaendeleza tofauti na mstari uliotangulia huku ukionyesha kwamba kura ndiyo njia pekee.
- source_word: בְּגוֹרָל
  choice: kwa kupigiwa kura
  rationale: Neno גוֹרָל linamaanisha kura iliyotumiwa kufanya uamuzi wa ugawaji. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: יֵחָלֵק
  choice: itagawanywa
  rationale: Hii ni kauli tendwa ya kitenzi חלק; tafsiri inadumisha hali hiyo ya kutendwa na wazo la kugawa nchi kuwa mafungu.
- source_word: אֶת הָאָרֶץ
  choice: nchi
  rationale: Hili ni neno la moja kwa moja kwa הָאָרֶץ katika muktadha wa nchi itakayorithiwa.
- source_word: לִשְׁמוֹת
  choice: kulingana na majina ya
  rationale: Kihusishi ל hapa kinaonyesha kipimo au rejeleo la utoaji wa urithi; “kulingana na” ni Kiswahili cha asili kinachowasilisha maana hiyo.
- source_word: מַטּוֹת
  choice: makabila
  rationale: Ingawa neno hili pia linaweza kumaanisha fimbo, hapa linataja makundi ya kikabila ya Israeli.
- source_word: אֲבֹתָם
  choice: baba zao
  rationale: Kiebrania kinasema kihalisi “baba zao” na katika muktadha huu kinarejelea mistari ya ukoo wa upande wa baba; tafsiri haibadilishi kuwa neno lisiloonyesha jinsia.
- source_word: יִנְחָלוּ
  choice: watairithi
  rationale: Kitenzi נחל hapa kina maana ya kupokea au kumiliki kama urithi. Kiambishi “-i-” kinarejelea nchi na kufanya sentensi iwe ya kawaida kwa Kiswahili.
theological_decisions:
- issue: Istilahi ya ukoo yenye jinsia katika אֲבֹתָם
  choice: baba zao
  alternative: mababu zao / wazee wao wa ukoo
  rationale: “Baba zao” huhifadhi neno la kiume lililo katika Kiebrania na mkazo wa mistari ya ukoo wa upande wa baba katika urithi wa kikabila, bila kulipanua kimyakimya kuwa “wahenga” kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo “Lakini ... tu” umetumiwa kuhifadhi nguvu ya אַךְ na uhusiano wake wa kimuktadha; “kwa kupigiwa kura” ni usemi wa kawaida kuliko tafsiri ngumu ya neno kwa neno.
