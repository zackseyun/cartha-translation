base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/010.yaml
  text: and the earth opened its mouth and swallowed them and Korah[a], when the congregation died, when the fire consumed two hundred fifty men[c][b]; and they became a warning sign.
translation:
  language: sw
  text: Ardhi ikafungua kinywa chake, ikawameza wao pamoja na Kora, wakati kusanyiko hilo lilipokufa, wakati moto ulipowateketeza wanaume mia mbili na hamsini; nao wakawa ishara ya onyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawa ishara.” Neno la Kiebrania נֵס linaweza kumaanisha ishara, alama, au bendera; “ishara ya onyo” inaonyesha kazi yake katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: ardhi ikafungua kinywa chake
  rationale: Neno אֶרֶץ linaweza kumaanisha ‘ardhi’ au ‘nchi’; hapa ‘ardhi’ linafaa kwa taswira ya ardhi kufunguka. ‘Kinywa chake’ kinahifadhi uhuishaji dhahiri wa Kiebrania.
- source_word: וַתִּבְלַע
  choice: ikawameza
  rationale: Kitenzi בלע humaanisha ‘kumeza’; tafsiri hii ni ya kawaida na inahifadhi taswira halisi ya chanzo.
- source_word: אֹתָם וְאֶת־קֹרַח
  choice: wao pamoja na Kora
  rationale: Kiebrania kinawataja moja kwa moja ‘wao na Kora.’ Tafsiri haijaribu kuoanisha usemi huu na maelezo mengine ya simulizi.
- source_word: בְּמוֹת הָעֵדָה
  choice: wakati kusanyiko hilo lilipokufa
  rationale: 'ב pamoja na kitenzi-jina cha מות ina maana ya wakati: ‘wakati ... lilipokufa.’ עֵדָה hapa ni kusanyiko au kundi lililokusanyika.'
- source_word: בַּאֲכֹל הָאֵשׁ
  choice: moto ulipowateketeza
  rationale: Ingawa אכל kwa kawaida ni ‘kula,’ moto ukiwa mtendaji, ‘kuteketeza’ ni Kiswahili cha kawaida kinachowasilisha maana hiyo.
- source_word: חֲמִשִּׁים וּמָאתַיִם אִישׁ
  choice: watu mia mbili na hamsini
  rationale: Hii inawasilisha idadi ya Kiebrania kwa mpangilio wa kawaida wa Kiswahili. ‘Watu’ hapa hurejelea wanaume waliotajwa katika simulizi bila kufanya sentensi kuwa ngumu.
- source_word: וַיִּהְיוּ לְנֵס
  choice: wakawa ishara ya onyo
  rationale: נֵס inaweza kuwa ishara, alama, au bendera ya kuonekana. Katika muktadha huu wa hukumu, ‘ishara ya onyo’ inaeleza kazi yake, huku tanbihi ikihifadhi tafsiri ya moja kwa moja ‘ishara.’
theological_decisions:
- issue: Kirejewa cha wingi katika וַיִּהְיוּ (‘wakawa’)
  choice: Kudumisha wingi bila kubainisha iwapo unawahusu wale watu 250 pekee au wahukumiwa wote/tukio zima.
  alternative: Kutaja wazi kwamba wale watu 250 pekee ndio waliokuwa ishara.
  rationale: Kiebrania kinaacha kirejewa cha wingi kikiwa na kiwango fulani cha utata; tafsiri haikifungii kwa kundi moja.
- issue: Uhusiano wa Kora na kumezwa katika mstari huu
  choice: Kuhifadhi usemi ‘wao pamoja na Kora.’
  alternative: Kutafsiri kwa namna inayomtenga Kora na wale waliomezwa.
  rationale: Muundo wa Kiebrania unamwunganisha Kora moja kwa moja na ‘wao’; tafsiri inafuata mstari huu bila kuingiza upatanisho kutoka sehemu nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia viunganishi vya mfululizo ‘ikafungua ... ikawameza ... wakawa.’ ‘Kusanyiko hilo’ limetumiwa badala ya ‘jumuiya’ ili kuonyesha kundi lililokusanyika bila kuingiza maana ya kitaasisi.
