  text: בְּנֵ֣י מְנַשֶּׁ֗ה לְ/מָכִיר֙ מִשְׁפַּ֣חַת הַ/מָּכִירִ֔י וּ/מָכִ֖יר הוֹלִ֣יד אֶת גִּלְעָ֑ד לְ/גִלְעָ֕ד מִשְׁפַּ֖חַת הַ/גִּלְעָדִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/029.yaml
  text: 'The sons of Manasseh: of Machir, the clan of the Machirites; and Machir fathered Gilead; of Gilead, the clan of the Gileadites.'
translation:
  language: sw
  text: 'Wana wa Manase: kutoka kwa Makiri, ukoo wa Wamakiri; Makiri akamzaa Gileadi; na kutoka kwa Gileadi, ukoo wa Wagileadi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: Wana wa Manase
  rationale: Neno בְּנֵי kwa kawaida humaanisha ‘wana wa’; katika muktadha huu wa sensa ya kikabila linaweza pia kuwahusisha wazao. ‘Wana wa Manase’ linadumisha mtindo wa nasaba wa Kiebrania na linaeleweka katika Kiswahili.
- source_word: לְמָכִיר
  choice: kutoka kwa Makiri
  rationale: Kiambishi לְ katika kaida hii ya sensa kinaonyesha tawi la nasaba linalotokana na mtu aliyetajwa. ‘Kutoka kwa Makiri’ linaeleza uhusiano huo kwa Kiswahili cha kawaida.
- source_word: מִשְׁפַּחַת הַמָּכִירִי
  choice: ukoo wa Wamakiri
  rationale: מִשְׁפָּחָה hapa ni kitengo cha ukoo ndani ya kabila, si familia ya nyumbani tu; nomino ya watu ‘Wamakiri’ inawakilisha gentiliki הַמָּכִירִי kwa mtindo wa kawaida wa Kiswahili.
- source_word: וּמָכִיר הוֹלִיד אֶת גִּלְעָד
  choice: Makiri akamzaa Gileadi
  rationale: Hifili ya ילד ni kaida ya nasaba yenye maana ya kumzaa au kuwa baba wa mtu. ‘Akamzaa’ ni fasaha, ya moja kwa moja, na inadumisha mfuatano wa simulizi.
- source_word: לְגִלְעָד
  choice: kutoka kwa Gileadi
  rationale: Kama ilivyo kwa לְמָכִיר, לְ linaanzisha tawi la nasaba. Kurudia ‘kutoka kwa’ kunahifadhi ulinganifu wa aya.
- source_word: מִשְׁפַּחַת הַגִּלְעָדִי
  choice: ukoo wa Wagileadi
  rationale: ‘Ukoo’ linafaa kwa kitengo cha kikabila, na ‘Wagileadi’ linatoa kwa kawaida maana ya gentiliki הַגִּלְעָדִי.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Manase, Makiri, na Gileadi. Muundo wa nasaba na ulinganifu wa vifungu viwili umehifadhiwa bila kufanya ‘wana’ kuwa ‘wazao’ kwa lazima.'
