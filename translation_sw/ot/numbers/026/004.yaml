base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/004.yaml
  text: From twenty years old and upward[c][b][a], as Yahweh commanded Moses and the Israelites who came out of the land of Egypt.
translation:
  language: sw
  text: 'Kuanzia wenye umri wa miaka ishirini na zaidi, kama Yahweh alivyomwamuru Musa. Waisraeli waliotoka katika nchi ya Misri walikuwa hawa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: Kuanzia wenye umri wa miaka ishirini na zaidi
  rationale: Hii ni nahau ya Kiebrania inayoonyesha kiwango cha chini cha umri. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi maana ya kuanzia miaka ishirini kwenda juu.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: Neno hili linaunganisha tendo linalozungumziwa na amri iliyotolewa hapo awali kwa njia fupi na ya kawaida.
- source_word: צִוָּה
  choice: alivyowaamuru
  rationale: Kitenzi kina maana ya kutoa amri, si ushauri tu. Kiambishi cha wingi kinaonyesha kuwa Musa na Waisraeli ndio waliopokea amri katika muundo wa sentensi hii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetolewa kama jina binafsi, badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: na Waisraeli
  rationale: Ingawa tafsiri ya neno kwa neno ni “wana wa Israeli,” hapa ni jina la pamoja la watu wa Israeli; “Waisraeli” ni Kiswahili cha sasa na cha kawaida.
- source_word: הַיֹּצְאִים מֵאֶרֶץ מִצְרָיִם
  choice: waliotoka katika nchi ya Misri
  rationale: Kirai hiki kinawatambulisha Waisraeli kuwa kizazi kilichotoka Misri, huku “katika nchi ya Misri” kikihifadhi maelezo kamili ya mahali.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano YHWH. “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Wapokeaji wa amri katika muundo wa mstari
  choice: Musa na Waisraeli waliotoka katika nchi ya Misri
  alternative: Musa peke yake, kisha kuanza sentensi mpya kuhusu Waisraeli
  rationale: Kisintaksia, “Musa na Waisraeli” inaweza kueleweka kama kitu cha kitenzi “aliamuru.” Tafsiri inadumisha muundo huo na pia uhusiano wa moja kwa moja na rasimu ya Kiingereza, bila kuingiza sentensi mpya isiyo wazi katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Mstari huu ni mwendelezo wa agizo la kuhesabu watu katika muktadha uliotangulia, kwa hiyo mwanzo wake unabaki kuwa kirai kinachotegemea muktadha huo.
