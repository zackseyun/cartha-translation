base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/035.yaml
  text: 'These are the sons of Ephraim by their clans: of Shuthelah, the clan of the Shuthelahites; of Becher, the clan of the Becherites; of Tahan, the clan of the Tahanites.'
translation:
  language: sw
  text: 'Hawa ndio wana wa Efraimu kwa koo zao: wa Shuthela, ukoo wa Washuthela; wa Bekeri, ukoo wa Wabekeri; wa Tahan, ukoo wa Watahani.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa ndio
  rationale: Kifungu hiki kinatanguliza orodha kwa kuwatambulisha watu wanaofuata; “Hawa ndio” ni Kiswahili cha kawaida na huhifadhi mkazo wa kiashiria cha Kiebrania.
- source_word: בְנֵי אֶפְרַיִם
  choice: wana wa Efraimu
  rationale: Neno “wana” linahifadhi mtindo rasmi wa nasaba wa בְנֵי na linafaa katika orodha ya kikabila.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Katika sensa ya kitabu cha Hesabu, מִשְׁפָּחָה ni kundi la ukoo ndani ya kabila; “kwa koo zao” linaonyesha mpangilio huo kwa ufupi na kwa kawaida.
- source_word: לְשׁוּתֶלַח
  choice: wa Shuthela
  rationale: Kiambishi ל katika mtindo huu wa nasaba kinaonyesha kundi linalotokana na babu aliyetajwa; “wa Shuthela” ni muundo wa asili wa Kiswahili.
- source_word: מִשְׁפַּחַת הַשֻּׁתַלְחִי
  choice: ukoo wa Washuthela
  rationale: Umbo la kikundi הַשֻּׁתַלְחִי linamaanisha watu wa ukoo uliotokana na Shuthela; “Washuthela” ni jina la pamoja linaloeleweka kwa Kiswahili.
- source_word: לְבֶכֶר
  choice: wa Bekeri
  rationale: Muundo huo huo wa nasaba umeonyeshwa kwa “wa,” huku jina likitoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: מִשְׁפַּחַת הַבַּכְרִי
  choice: ukoo wa Wabekeri
  rationale: Umbo la kikundi limetafsiriwa kwa jina la pamoja la ukoo, “Wabekeri,” likihifadhi uhusiano wake na Bekeri.
- source_word: לְתַחַן
  choice: wa Tahani
  rationale: “Wa” linaonyesha kuwa ukoo unaotajwa unatokana na Tahani, kulingana na mtindo unaorudiwa katika mstari.
- source_word: מִשְׁפַּחַת הַתַּחֲנִי
  choice: ukoo wa Watahani
  rationale: Umbo la kikundi limetolewa kama jina la pamoja la ukoo kwa Kiswahili, sambamba na Washuthela na Wabekeri.
theological_decisions: []
