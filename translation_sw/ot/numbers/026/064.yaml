base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/064.yaml
  text: But among these there was not a man from those counted by Moses and Aaron the priest[b][a], who counted the sons of Israel in the wilderness of Sinai.
translation:
  language: sw
  text: Lakini miongoni mwa hawa hakuwamo hata mwanamume mmoja wa wale ambao Musa na Aroni, kuhani, waliwahesabu wana wa Israeli[b] katika nyika ya Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Yaani, Waisraeli; kwa Kiebrania, “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֵלֶּה
  choice: Lakini miongoni mwa hawa
  rationale: Kiunganishi ו kinaweza kuwa ‘na,’ lakini hapa muktadha unaonyesha utofautishaji na mstari uliotangulia; בְאֵלֶּה ina maana ya ‘miongoni mwa hawa.’
- source_word: לֹא הָיָה אִישׁ
  choice: hapakuwa na mwanamume hata mmoja
  rationale: Usemi huu unakanusha kuwapo kwa mtu yeyote wa kiume katika kundi hilo; ‘hata mmoja’ huwasilisha mkazo wa umoja אִישׁ kwa Kiswahili cha kawaida.
- source_word: מִפְּקוּדֵי
  choice: kutoka kwa wale waliohesabiwa
  rationale: Neno linatokana na פקד katika maana ya kuhesabu au kuandikisha; tafsiri hii inaonyesha kuwa ni watu waliokuwa katika sensa ya awali.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Kiebrania kinasema ‘kuhani,’ si ‘kuhani mkuu’; hivyo cheo kisichotajwa hakiongezwi.
- source_word: אֲשֶׁר פָּקְדוּ
  choice: ambao waliwahesabu
  rationale: Kiwakilishi cha uhusiano kinawarejelea Musa na Aroni, waliotekeleza kuhesabu huko.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania badala ya kuubadilisha moja kwa moja kuwa ‘Waisraeli.’
- source_word: בְּמִדְבַּר סִינָי
  choice: katika nyika ya Sinai
  rationale: ‘Nyika’ ni tafsiri ya kawaida na yenye heshima ya מִדְבָּר, ikihifadhi uhusiano wa mahali na Sinai.
theological_decisions:
- issue: Lugha ya kijinsia katika אִישׁ na בְּנֵי יִשְׂרָאֵל
  choice: Kutumia ‘mwanamume’ na ‘wana wa Israeli’
  alternative: ‘mtu’ na ‘Waisraeli’ au ‘watu wa Israeli’
  rationale: Muktadha unawahusu wanaume waliohesabiwa katika sensa ya awali, na Kiebrania kinatumia maumbo ya kiume; tafsiri huhifadhi usahihi huo bila kuugeuza kuwa lugha isiyoonyesha jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Hapakuwa na mwanamume hata mmoja’ ni cha asili kuliko muundo wa neno kwa neno, huku ‘wana wa Israeli’ ikihifadhi taswira ya kifamilia ya chanzo.
