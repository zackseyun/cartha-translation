  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה פְקוּדֵ֣י הַ/לֵּוִי֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/גֵרְשׁ֗וֹן מִשְׁפַּ֨חַת֙ הַ/גֵּ֣רְשֻׁנִּ֔י לִ/קְהָ֕ת מִשְׁפַּ֖חַת הַ/קְּהָתִ֑י לִ/מְרָרִ֕י מִשְׁפַּ֖חַת הַ/מְּרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/057.yaml
  text: 'And these were the numbered ones of Levi by their clans: of Gershon, the clan of the Gershonites; of Kohath, the clan of the Kohathites; of Merari, the clan of the Merarites.'
translation:
  language: sw
  text: 'Na hawa ndio Walawi waliohesabiwa[a] kwa koo zao: wa Gershoni, ukoo wa Wagershoni; wa Kohathi, ukoo wa Wakohathi; wa Merari, ukoo wa Wamerari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walioandikishwa.” Kiebrania kinamaanisha watu walioingizwa katika hesabu ya sensa, si tendo la kuhesabu tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: waliohesabiwa
  rationale: Neno hili linawataja watu walioingizwa katika hesabu ya sensa, si tendo la kuhesabu tu. Kauli hii ni ya kawaida na inaendeleza maana halisi ya watu waliohesabiwa.
- source_word: הַלֵּוִי
  choice: Walawi
  rationale: Ingawa Kiebrania kina umbo la umoja, hapa jina linatumiwa kwa maana ya kabila la Lawi. Kiswahili cha wingi ‘Walawi’ kinaeleweka kwa kawaida katika kichwa hiki cha sensa.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Katika muktadha wa sensa ya makabila, מִשְׁפָּחָה ni kikundi cha ukoo, si familia ndogo ya nyumbani.
- source_word: לְגֵרְשׁוֹן
  choice: wa Gershoni
  rationale: Kiambishi ל hapa kinaonyesha uhusiano wa nasaba au kundi. Muundo ‘wa Gershoni’ unafaa orodha ya koo kwa Kiswahili.
- source_word: מִשְׁפַּחַת הַגֵּרְשֻׁנִּי
  choice: ukoo wa Wagershoni
  rationale: Jina la kundi linawataja wazao wa Gershoni kama ukoo mmoja.
- source_word: לִקְהָת
  choice: wa Kohathi
  rationale: Muundo huu unaonyesha uhusiano wa nasaba sawa na ule wa Gershoni.
- source_word: מִשְׁפַּחַת הַקְּהָתִי
  choice: ukoo wa Wakohathi
  rationale: Jina la kundi linawataja wazao wa Kohathi kama ukoo mmoja.
- source_word: לִמְרָרִי
  choice: wa Merari
  rationale: Muundo huu unaonyesha uhusiano wa nasaba sawa na majina yaliyotangulia.
- source_word: מִשְׁפַּחַת הַמְּרָרִי
  choice: ukoo wa Wamerari
  rationale: Jina la kundi linawataja wazao wa Merari kama ukoo mmoja.
- source_word: וְאֵלֶּה
  choice: Na hawa ndio
  rationale: ‘Na’ linaendeleza uhusiano na habari ya sensa iliyotangulia, huku muundo mzima ukisomeka kwa kawaida katika Kiswahili.
