base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/007.yaml
  text: These are the clans of the Reubenites[a], and those numbered from them were forty-three thousand seven hundred thirty.
translation:
  language: sw
  text: Hizi ndizo koo za Wareubeni, na waliohesabiwa miongoni mwao[a] walikuwa elfu arobaini na tatu, mia saba na thelathini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walioandikishwa miongoni mwao.” Neno la Kiebrania linawahusu watu waliohesabiwa katika sensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: koo
  rationale: Katika muktadha wa sensa na makabila katika Hesabu, neno hili linamaanisha migawanyiko ya ukoo ndani ya kabila, si familia ndogo tu; “koo” ni tafsiri ya kawaida na iliyo wazi kwa Kiswahili.
- source_word: הָרֻאוּבֵנִי
  choice: Wareubeni
  rationale: Jina hili la kijamii linawaonyesha watu au wazao wa Reubeni; “Wareubeni” ni umbo la kawaida la Kiswahili la jina la kabila hilo.
- source_word: פְקֻדֵיהֶם
  choice: waliohesabiwa miongoni mwao
  rationale: Katika muktadha huu wa sensa, neno linawahusu waliosajiliwa kwa kuhesabiwa. Tafsiri hii inadumisha maana ya kuhesabiwa bila kuongeza neno “wanaume,” ambalo halijarudiwa wazi katika mstari huu.
- source_word: וַיִּהְיוּ
  choice: walikuwa
  rationale: Kitenzi rahisi cha kuwa kinaunganisha kwa kawaida kundi lililohesabiwa na jumla yake katika Kiswahili.
- source_word: שְׁלֹשָׁה וְאַרְבָּעִים אֶלֶף וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: elfu arobaini na tatu, mia saba na thelathini
  rationale: Huhifadhi idadi kamili ya Kiebrania, 43,730, kwa maneno yanayosomwa kwa urahisi na kufaa mtindo wa orodha ya sensa.
