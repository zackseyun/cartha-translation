  text: 'These are the clans of the Simeonites: twenty-two thousand two hundred.'
translation:
  language: sw
  text: 'Hizi ndizo koo za Wasimeoni: ishirini na mbili elfu na mia mbili.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hizi ndizo
  rationale: Kiashirio cha wingi kinatanguliza muhtasari wa sensa; muundo huu ni wa kawaida na wenye msisitizo wa utambulisho katika Kiswahili.
- source_word: מִשְׁפְּחֹת
  choice: koo
  rationale: Katika muktadha wa kabila na sensa, neno hili linamaanisha migawanyiko ya ukoo ndani ya kabila, si familia za nyumbani tu.
- source_word: הַשִּׁמְעֹנִי
  choice: Wasimeoni
  rationale: Jina la kikundi lililo katika umoja kwa Kiebrania limetumiwa kwa maana ya pamoja; wingi wa Kiswahili huwasilisha watu wa kabila la Simeoni kwa kawaida.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: watu 22,200
  rationale: Idadi imetolewa kwa tarakimu kwa uwazi wa kisasa; neno 'watu' limeongezwa kwa kufafanua kwamba hii ni jumla ya waliohesabiwa, kama muktadha wa sensa unavyoonyesha.
