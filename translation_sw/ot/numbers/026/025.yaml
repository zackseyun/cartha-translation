  yaml_path: translation/ot/numbers/026/025.yaml
  text: 'These are the clans of Issachar according to those numbered from them: sixty-four thousand and three hundred.'
translation:
  language: sw
  text: 'Hizi ndizo koo za Isakari, kulingana na waliohesabiwa miongoni mwao[a]: watu 64,300.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na idadi yao” au “kulingana na usajili wao.” Kirai cha Kiebrania kinarejelea hesabu ya sensa ya watu waliosajiliwa kutoka katika koo hizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hizi ndizo
  rationale: Kiashirio cha wingi kinaanzisha muhtasari; ‘ndizo’ hukamilisha kwa Kiswahili sentensi ya Kiebrania isiyo na kitenzi.
- source_word: מִשְׁפְּחֹת
  choice: koo
  rationale: Katika muktadha wa kabila na sensa, neno hili linamaanisha makundi mapana ya jamaa ndani ya kabila, hivyo ‘koo’ ni sahihi kuliko ‘familia.’
- source_word: יִשָּׂשכָר
  choice: Isakari
  rationale: Umbo la kawaida la jina hili katika tafsiri za Biblia za Kiswahili.
- source_word: לִפְקֻדֵיהֶם
  choice: kulingana na waliohesabiwa miongoni mwao
  rationale: Kirai kinarejelea watu wa koo hizo waliosajiliwa na kuhesabiwa katika sensa; ‘miongoni mwao’ kinaonyesha uhusiano wao na koo bila kudokeza kwamba koo zenyewe ndizo zilizohesabiwa.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: watu 64,300
  rationale: Thamani ya namba imewekwa kwa mpangilio wa kawaida wa Kiswahili, na ‘watu’ imeongezwa kwa uwazi wa asili wa jumla ya sensa.
