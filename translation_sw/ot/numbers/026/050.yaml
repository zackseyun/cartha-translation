  yaml_path: translation/ot/numbers/026/050.yaml
  text: These are the clans of Naphtali by their clans[b][a], and those numbered of them were forty-five thousand four hundred.
translation:
  language: sw
  text: Hizi ndizo koo za Naftali kulingana na koo zao, na waliohesabiwa miongoni mwao walikuwa 45,400.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hizi ndizo
  rationale: Muundo wa kuonyesha kwa wingi unaoanzisha kauli ya muhtasari; wakati wa sasa unafaa katika fomula ya sensa.
- source_word: מִשְׁפְּחֹת
  choice: koo
  rationale: Katika muktadha wa sensa ya makabila, neno hili linaonyesha makundi mapana ya ukoo ndani ya kabila, si familia za nyumbani tu.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: Kiambishi לְ hapa kinaonyesha upangaji au uainishaji wa watu kwa koo zao.
- source_word: וּפְקֻדֵיהֶם
  choice: nao waliohesabiwa
  rationale: Neno linatokana na פקד katika maana ya sensa na linarejelea watu walioandikishwa na kuhesabiwa; tafsiri haiongezi neno 'wanaume' ambalo halitajwi moja kwa moja katika kishazi hiki.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 45,400
  rationale: Idadi imetolewa kwa tarakimu kwa uwazi na kwa utaratibu wa kawaida wa Kiswahili.
