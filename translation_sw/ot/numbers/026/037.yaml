  text: 'These are the clans of the sons of Ephraim according to those numbered of them: thirty-two thousand and five hundred[a]. These are the sons of Joseph according to their clans.'
translation:
  language: sw
  text: 'Hizi ndizo koo za wana wa Efraimu, kwa hesabu ya wale waliohesabiwa miongoni mwao[a]: thelathini na mbili elfu na mia tano. Hawa ndio wana wa Yosefu kulingana na koo zao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kulingana na usajili wao,” “kwa hesabu yao,” au, kwa lugha ya kawaida zaidi, “walipohesabiwa.” Kiebrania kinatumia lugha ya usajili wa sensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: koo
  rationale: Katika muktadha wa sensa ya makabila, neno hili linamaanisha vikundi vya ukoo vilivyo ndani ya kabila; “koo” ni la kawaida na sahihi zaidi kuliko “familia.”
- source_word: בְּנֵי אֶפְרַיִם
  choice: wana wa Efraimu
  rationale: Hudumisha usemi wa nasaba wa Kiebrania na bado unaeleweka katika Kiswahili cha Biblia.
- source_word: לִפְקֻדֵיהֶם
  choice: kulingana na waliohesabiwa kati yao
  rationale: Huonyesha watu waliosajiliwa na kuhesabiwa katika sensa, huku ikihifadhi uhusiano wao na kundi husika.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: thelathini na mbili elfu na mia tano
  rationale: Hutoa jumla kamili kwa mpangilio wa kawaida wa namba katika Kiswahili cha sasa.
- source_word: בְנֵי יוֹסֵף
  choice: wana wa Yosefu
  rationale: Hudumisha muundo wa nasaba unaorudiwa katika Kiebrania na uhusiano wa Efraimu na Yosefu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: Huhifadhi fomula ya kufunga na istilahi ileile ya vikundi vya ukoo iliyotumiwa mwanzoni.
