base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/026.yaml
  text: 'The sons of Zebulun by their clans: of Sered[a], the clan of the Sardites; of Elon, the clan of the Elonites; of Jahleel[b], the clan of the Jahleelites.'
translation:
  language: sw
  text: 'Wana wa Zabuloni[a], kwa koo zao[b]: wa Seredi, ukoo wa Waseredi; wa Eloni, ukoo wa Waeloni; wa Yahleeli, ukoo wa Wayahleeli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika muktadha huu wa sensa, “wana wa Zabuloni” ni wazao wa Zabuloni katika kabila lake.
    reason: lexical_alternative
  - marker: b
    text: Au “kulingana na koo zao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי זְבוּלֻן
  choice: Wana wa Zabuloni
  rationale: Inahifadhi nahau ya Kiebrania “wana wa,” ambayo katika muktadha huu wa sensa inawahusu wazao wa kikabila wa Zabuloni. “Zabuloni” ni umbo la kawaida la jina hilo katika Kiswahili cha Biblia.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Katika sensa hii מִשְׁפָּחָה ni kundi la ukoo ndani ya kabila, si familia ndogo ya nyumbani. “Kwa koo zao” ni usemi mfupi na wa kawaida unaoonyesha upangaji kwa makundi hayo.
- source_word: לְסֶרֶד
  choice: wa Seredi
  rationale: Kiambishi לְ katika orodha hii kinamtambulisha babu au chanzo cha ukoo. Kiswahili “wa Seredi” kinaonyesha uhusiano huo wa uzao kwa njia ya kawaida.
- source_word: מִשְׁפַּחַת הַסַּרְדִּי
  choice: ukoo wa Waseredi
  rationale: Neno la kinasaba הַסַּרְדִּי linataja kundi lililotokana na Seredi. “Waseredi” ni jina la kundi linaloeleweka kwa urahisi katika Kiswahili.
- source_word: לְאֵלֹן מִשְׁפַּחַת הָאֵלֹנִי
  choice: wa Eloni, ukoo wa Waeloni
  rationale: 'Muundo unaorudiwa wa orodha umehifadhiwa: jina la babu linafuatiwa na jina la ukoo wake.'
- source_word: לְיַחְלְאֵל מִשְׁפַּחַת הַיַּחְלְאֵלִי
  choice: wa Yaleeli, ukoo wa Wayaleeli
  rationale: “Yaleeli” linaakisi matamshi ya jina la Kiebrania יַחְלְאֵל kwa tahajia inayosomeka kwa Waswahili; “Wayaleeli” ni jina la ukoo linalotokana nalo.
theological_decisions:
- issue: Maana ya “wana wa Zabuloni” katika orodha ya sensa
  choice: Kudumisha “Wana wa Zabuloni” katika maandishi na kufafanua kuwa inahusu wazao wa kikabila katika tanbihi
  alternative: Kutafsiri moja kwa moja “Wazao wa Zabuloni”
  rationale: Uamuzi huu huhifadhi nahau halisi ya Kiebrania bila kupoteza maana inayokusudiwa na muktadha wa sensa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Ukoo/koo” limetumiwa badala ya “jamaa” ili kuonyesha kwa usahihi zaidi makundi ya ukoo ndani ya kabila. Muundo wa orodha na urudiaji wa Kiebrania umehifadhiwa kwa uwazi.
