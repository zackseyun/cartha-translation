base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/006.yaml
  text: from Hezron[a], the clan of the Hezronites; from Carmi, the clan of the Carmites.
translation:
  language: sw
  text: kutoka kwa Hesroni[a], ukoo wa Wahesroni; kutoka kwa Karmi, ukoo wa Wakarmi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Hesroni ... kwa Karmi”; kihusishi cha Kiebrania kinaweza kutafsiriwa hivyo kwa uhalisi zaidi, lakini hapa kinaonyesha chimbuko au uhusiano wa ukoo katika orodha ya sensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/חֶצְרֹן
  choice: kutoka kwa Hesroni
  rationale: Katika muundo huu wa sensa na nasaba, kiambishi לְ kinaonyesha asili au uhusiano wa ukoo. “Kutoka kwa Hesroni” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika muktadha wa sensa, מִשְׁפָּחָה ni kundi la jamaa ndani ya kabila; “ukoo” ni sahihi na ya asili kuliko “familia” hapa.
- source_word: הַֽ/חֶצְרוֹנִי
  choice: Wahesroni
  rationale: Umbo hili la jina linaonyesha kundi la wazao au watu wanaohusishwa na Hesroni; “Wahesroni” linafaa kwa maana hiyo ya kijumla.
- source_word: לְ/כַרְמִי
  choice: kutoka kwa Karmi
  rationale: Kama ilivyo kwa לְחֶצְרֹן, kiambishi לְ kinaonyesha chimbuko au uainishaji wa kinasaba.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Neno la sensa limetafsiriwa kwa namna ileile ili kuhifadhi urudiaji na ulinganifu wa vifungu.
- source_word: הַ/כַּרְמִי
  choice: Wakarmi
  rationale: Jina hili la kijumla linataja wazao au kundi linalotokana na Karmi, sambamba na “Wahesroni.”
