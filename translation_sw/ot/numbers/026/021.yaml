base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/021.yaml
  text: 'The sons of Perez were: of Hezron, the clan of the Hezronites; of Hamul, the clan of the Hamulites.'
translation:
  language: sw
  text: 'Wana wa Peresi walikuwa hawa: wa Hesroni, ukoo wa Wahesroni; wa Hamuli, ukoo wa Wahamuli.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walikuwa hawa
  rationale: Katika fomula hii ya sensa na nasaba, kitenzi היה kinatambulisha majina yanayofuata. Kiswahili cha kawaida hutumia “walikuwa hawa” kwa ufasaha zaidi kuliko “walikuwa” peke yake.
- source_word: בְנֵי
  choice: wana wa
  rationale: “Wana” huhifadhi maana ya wana wa kiume katika nasaba, huku ikiwa lugha ya sasa yenye heshima.
- source_word: פֶרֶץ
  choice: Peresi
  rationale: Hili ni umbo la kawaida la Kiswahili la jina Perez, lenye irabu zinazorahisisha matamshi ya Kiswahili.
- source_word: לְחֶצְרֹן
  choice: kutoka kwa Hesroni
  rationale: Katika fomula hii, לְ huonyesha chanzo cha ukoo au uzao; “kutoka kwa” hueleza wazi kwamba ukoo ulitokana na Hesroni.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika sensa ya Hesabu, מִשְׁפָּחָה ni kitengo cha kijamaa ndani ya kabila. “Ukoo” ndilo neno la Kiswahili linalofaa zaidi kuliko “jamaa” au “familia.”
- source_word: הַחֶצְרֹנִי
  choice: Wahesroni
  rationale: Umbo la Kiebrania humaanisha kundi lililotokana na Hesroni; kiambishi Wa- huunda jina la kundi kwa Kiswahili.
- source_word: לְחָמוּל
  choice: kutoka kwa Hamuli
  rationale: Kama ilivyo kwa Hesroni, לְ huonyesha ukoo unaotokana na Hamuli.
- source_word: הֶחָמוּלִי
  choice: Wahamuli
  rationale: Jina hili la kundi linarejelea wazao wa Hamuli; umbo la Kiswahili lenye Wa- linawasilisha maana hiyo kwa kawaida.
