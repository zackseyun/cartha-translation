base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/058.yaml
  text: 'These were the clans of Levi: the clan of the Libnite[a], the clan of the Hebronite, the clan of the Mahlite, the clan of the Mushite, the clan of the Korahite. And Kohath fathered Amram.'
translation:
  language: sw
  text: 'Hizi ndizo koo za Lawi: ukoo wa Libni, ukoo wa Hebroni, ukoo wa Mahli, ukoo wa Mushi, ukoo wa Kora. Kohathi akamzaa Amramu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת / מִשְׁפַּחַת
  choice: koo / ukoo wa
  rationale: Katika muktadha wa sensa na nasaba, neno hili humaanisha kitengo cha ukoo ndani ya kabila, si familia ndogo ya wazazi na watoto pekee. “Koo” ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: לֵוִי
  choice: Lawi
  rationale: Jina hili limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: הַלִּבְנִי / הַחֶבְרֹנִי / הַמַּחְלִי / הַמּוּשִׁי / הַקָּרְחִי
  choice: Walibni / Wahebroni / Wamahli / Wamushi / Wakora
  rationale: Maumbo haya ya Kiebrania yanataja vikundi vya wazao vinavyohusishwa na mababu waliotajwa. Kiambishi “Wa-” kinawasilisha kwa kawaida kundi la watu katika Kiswahili.
- source_word: וּקְהָת
  choice: Naye Kohathi
  rationale: “Naye” huhifadhi kiunganishi cha Kiebrania huku kikianzisha kwa ufasaha taarifa mpya kuhusu Kohathi.
- source_word: הוֹלִיד
  choice: alimzaa
  rationale: Hifili ya ילד katika nasaba humaanisha kumzaa au kuwa baba wa mtu. “Alimzaa” ni ya sasa, fupi, na huhifadhi uhusiano wa moja kwa moja wa nasaba bila kutumia lugha ya kizamani.
- source_word: עַמְרָם
  choice: Amramu
  rationale: Jina limetoholewa kwa umbo la Kiswahili linalosomeka kwa urahisi na linaloendana na matumizi yaliyozoeleka ya majina ya Biblia.
- source_word: אֵלֶּה
  choice: Hizi ndizo
  rationale: Kishazi cha Kiebrania hakina kitenzi kilichoandikwa. “Hizi ndizo” ni muundo wa kawaida wa Kiswahili wa kutambulisha orodha hii.
