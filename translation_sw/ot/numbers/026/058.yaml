translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya “ukoo wa” yamehifadhiwa ili kuakisi muundo wa orodha ya Kiebrania; majina ya vikundi yametolewa kwa kiambishi cha watu “Wa-”.
