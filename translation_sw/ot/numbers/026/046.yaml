  rationale: Jina hili la mtu/kabila limetoholewa kuwa “Asheri,” na “wa” huonyesha kwa njia ya kawaida uhusiano wa muundo wa Kiebrania “binti wa Asheri.”
- source_word: שָׂרַח
  choice: Sera
  rationale: Hili ni jina maalumu; limetoholewa badala ya kutafsiriwa, kwa tahajia inayofaa Kiswahili.
