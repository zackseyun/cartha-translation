lexical_decisions:
- source_word: אֵלֶּה
  choice: Hizi ndizo
  rationale: Kiashiria cha wingi kinaanzisha muhtasari wa koo zilizotajwa; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: מִשְׁפְּחֹת
  choice: koo
  rationale: Katika muktadha wa kabila na sensa, neno hili linamaanisha vikundi vya undugu mpana ndani ya kabila, si familia ndogo za nyumbani.
- source_word: הַזְּבוּלֹנִי
  choice: Wazebuluni
  rationale: Nomino ya nasaba katika umoja imetumiwa kwa maana ya kundi lote la wazao wa Zabuloni; wingi wa Kiswahili unawasilisha maana hiyo kwa kawaida.
- source_word: לִפְקֻדֵיהֶם
  choice: kulingana na waliohesabiwa miongoni mwao
  rationale: Kauli hii inadumisha maana ya sensa ya פקד na uhusiano kati ya koo na watu wa koo hizo walioingizwa katika hesabu.
- source_word: שִׁשִּׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: sitini elfu na mia tano
  rationale: Namba imeandikwa kwa maneno ili kudumisha mtindo rasmi wa taarifa ya sensa.
