  edition: WLC
  text: וַ/יִּהְי֣וּ פְקֻדֵי/הֶ֗ם שְׁלֹשָׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף כָּל זָכָ֖ר מִ/בֶּן חֹ֣דֶשׁ וָ/מָ֑עְלָ/ה כִּ֣י לֹ֣א הָתְפָּקְד֗וּ בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֠י לֹא נִתַּ֤ן לָ/הֶם֙ נַחֲלָ֔ה בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/062.yaml
  text: And those counted from among them were twenty-three thousand[a], every male from a month old and upward, because they were not counted among the sons of Israel, because no inheritance was given to them among the sons of Israel.
translation:
  language: sw
  text: Nao waliohesabiwa miongoni mwao walikuwa elfu ishirini na tatu, wote wa kiume wenye umri wa mwezi mmoja na zaidi. Hawakuhesabiwa miongoni mwa wana wa Israeli[a], kwa sababu hawakupewa urithi miongoni mwa wana wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli”; vivyo hivyo katika sehemu ya pili ya aya hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדֵיהֶם
  choice: waliohesabiwa miongoni mwao
  rationale: Katika muktadha wa sensa, neno hili linataja wale walioingizwa katika hesabu. Kauli hii ni ya kawaida kwa Kiswahili na inadumisha uhusiano na kitenzi הָתְפָּקְדוּ baadaye katika aya.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים אֶלֶף
  choice: elfu ishirini na tatu
  rationale: Hii ndiyo namna ya kawaida na wazi ya kutaja idadi 23,000 kwa Kiswahili.
- source_word: כָּל זָכָר
  choice: wote wa kiume
  rationale: Inawahusisha watu wa jinsia ya kiume wa kila umri, hata watoto wachanga, bila kutumia ‘wanaume,’ ambalo linaweza kueleweka kuwa watu wazima pekee.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: wenye umri wa mwezi mmoja na zaidi
  rationale: Ni usemi wa asili wa Kiswahili unaoweka wazi kiwango cha chini cha umri kilichotajwa katika Kiebrania.
- source_word: הָתְפָּקְדוּ
  choice: hawakuhesabiwa
  rationale: Inadumisha maana ya kuingizwa katika sensa na pia ulinganifu wa mzizi na ‘waliohesabiwa’ mwanzoni mwa aya.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: miongoni mwa wana wa Israeli
  rationale: ‘Miongoni mwa’ huwasilisha בְּתוֹךְ kwa Kiswahili cha kawaida, huku ‘wana wa Israeli’ ikihifadhi taswira ya kifamilia ya Kiebrania badala ya kuibadili moja kwa moja kuwa jina la kitaifa.
- source_word: נִתַּן לָהֶם נַחֲלָה
  choice: hawakupewa urithi
  rationale: Inahifadhi muundo wa kutendwa na maana ya נַחֲלָה kama sehemu ya nchi inayotolewa kuwa urithi.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: ‘Wana wa Israeli’ inadumisha usemi wa kifamilia na wa agano uliopo katika Kiebrania. ‘Waisraeli’ ni tafsiri halali na ya kawaida zaidi, kwa hiyo imeonyeshwa katika tanbihi bila kuondoa mvutano wa kimatamshi wa maandishi asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi imegawanywa baada ya idadi ya waliohesabiwa ili kuboresha usomaji bila kubadili uhusiano wa kimantiki wa aya. ‘Wote wa kiume’ limetumiwa badala ya ‘kila mwanamume’ kwa sababu kundi linajumuisha watoto wenye umri wa mwezi mmoja.
