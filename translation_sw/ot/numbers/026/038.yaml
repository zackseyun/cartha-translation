base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/038.yaml
  text: 'The sons of Benjamin by their clans: of Bela[a], the clan of the Belaites; of Ashbel, the clan of the Ashbelites; of Ahiram, the clan of the Ahiramites.'
translation:
  language: sw
  text: 'Wana wa Benyamini kwa koo zao walikuwa hawa: kutoka kwa Bela, ukoo wa Bela; kutoka kwa Ashbeli, ukoo wa Ashbeli; na kutoka kwa Ahiramu[a], ukoo wa Ahiramu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kimasoreti yanasoma “Ahiramu”; baadhi ya mapokeo mengine ya maandishi na tafsiri fulani yana “Ahiamu.”
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  choice: Wana wa Benyamini
  rationale: Neno בְּנֵי kihalisi ni “wana wa.” Katika muktadha huu wa sensa linaweza kujumuisha wazao, lakini “Wana wa Benyamini” huhifadhi muundo wa orodha ya ukoo na ni Kiswahili cha kawaida cha kibiblia.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה hapa ni kitengo cha ukoo ndani ya kabila, si familia ndogo ya nyumbani; kwa hiyo “koo” ni sahihi kuliko “familia.”
- source_word: לְבֶלַע
  choice: kutoka kwa Bela
  rationale: Kiambishi לְ kinaanzisha tawi linalotokana na babu aliyetajwa. “Kutoka kwa” huonyesha uhusiano huo wa nasaba kwa uwazi katika Kiswahili.
- source_word: מִשְׁפַּחַת הַבַּלְעִי
  choice: ukoo wa Wabela
  rationale: Umbo la nasaba הַבַּלְעִי linataja watu wa ukoo uliotokana na Bela; “Wabela” ni jina la kundi linaloeleweka na lenye muundo wa kawaida wa Kiswahili.
- source_word: לְאַשְׁבֵּל
  choice: kutoka kwa Ashbeli
  rationale: “Kutoka kwa” huwasilisha kazi ya לְ katika orodha ya nasaba, na “Ashbeli” ni uhawilishaji unaofaa wa אַשְׁבֵּל kwa tahajia ya Kiswahili.
- source_word: מִשְׁפַּחַת הָאַשְׁבֵּלִי
  choice: ukoo wa Waashbeli
  rationale: Umbo hili la nasaba linamaanisha ukoo wa watu waliotokana na Ashbeli; “Waashbeli” hudumisha ulinganifu na majina mengine ya koo.
- source_word: לַאֲחִירָם
  choice: kutoka kwa Ahiramu
  rationale: Maandishi ya Kimasoreti yanasoma אֲחִירָם (Ahiramu). “Kutoka kwa” huonyesha chanzo cha ukoo, huku “Ahiramu” ikifuata matamshi yanayofaa kwa Kiswahili.
- source_word: מִשְׁפַּחַת הָאֲחִירָמִי
  choice: ukoo wa Waahiramu
  rationale: Umbo la nasaba linataja watu wa ukoo wa Ahiramu; “Waahiramu” ni jina la kundi lililoundwa kwa kawaida katika Kiswahili.
