  text: from Ashriel[a], the clan of the Ashrielites; and from Shechem, the clan of the Shechemites.
translation:
  language: sw
  text: kutoka kwa Asrieli[a], ukoo wa Waasrieli; na kutoka kwa Shekemu, ukoo wa Washekemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya tafsiri huandika jina hili “Ashrieli,” lakini maandishi ya Kiebrania yana herufi שׂ (sin), inayounga mkono “Asrieli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׂרִיאֵל
  choice: Asrieli
  rationale: Jina limeandikwa katika Kiebrania kwa שׂ (sin), yenye sauti ya /s/, hivyo “Asrieli” linafuata kwa karibu umbo la Kiebrania kuliko “Ashrieli.” Kiambishi cha mwisho -i kinalifanya jina lisomeke kwa kawaida katika Kiswahili bila kulipotosha.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika orodha hii ya sensa, neno hili linamaanisha kundi la kindugu lililo ndani ya kabila; “ukoo” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: הָאַשְׂרִיאֵלִי
  choice: Waasrieli
  rationale: Jina hili la kundi linawataja wazao wa Asrieli kwa pamoja. Muundo wa Kiswahili Wa- unawakilisha kundi la watu kwa njia ya kawaida.
- source_word: שֶׁכֶם
  choice: Shekemu
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka Kiebrania kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: הַשִּׁכְמִי
  choice: Washekemu
  rationale: Neno hili la nasaba linamaanisha kundi la wazao wa Shekemu; Wa- linaonyesha watu wa ukoo huo.
- source_word: וְ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha vipengele vya orodha.
