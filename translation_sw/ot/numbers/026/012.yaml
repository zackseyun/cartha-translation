  text: בְּנֵ֣י שִׁמְעוֹן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/נְמוּאֵ֗ל מִשְׁפַּ֨חַת֙ הַ/נְּמ֣וּאֵלִ֔י לְ/יָמִ֕ין מִשְׁפַּ֖חַת הַ/יָּמִינִ֑י לְ/יָכִ֕ין מִשְׁפַּ֖חַת הַ/יָּכִינִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/012.yaml
  text: 'The sons of Simeon by their clans: of Nemuel[a], the clan of the Nemuelites; of Jamin, the clan of the Jaminites; of Jachin[c][b], the clan of the Jachinites.'
translation:
  language: sw
  text: 'Wana wa Simeoni, kwa koo zao: wa Nemueli, ukoo wa Wanemueli; wa Yamini, ukoo wa Wayamini; wa Yakini, ukoo wa Wayakini.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Huhifadhi tamko la nasaba la Kiebrania, “wana wa,” linalolenga uzao unaohesabiwa kupitia mstari wa kiume.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Katika muktadha wa sensa, מִשְׁפָּחָה ni kundi la ukoo ndani ya kabila; “koo” ni neno la kawaida na sahihi katika Kiswahili cha sasa.
- source_word: לִנְמוּאֵל
  choice: wa Nemueli
  rationale: Kiambishi לְ kinamtambulisha babu ambaye ukoo umetokana naye; “wa Nemueli” huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: מִשְׁפַּחַת הַנְּמוּאֵלִי
  choice: ukoo wa Wanemueli
  rationale: Jina la kundi la wazao limetolewa kwa wingi wa Kiswahili ili kuonyesha ukoo unaoitwa kwa jina la Nemueli.
- source_word: לְיָמִין / מִשְׁפַּחַת הַיָּמִינִי
  choice: wa Yamini, ukoo wa Wayamini
  rationale: “Yamini” huakisi matamshi ya jina la Kiebrania, na “Wayamini” hutaja kwa uwazi kundi la wazao wake.
- source_word: לְיָכִין / מִשְׁפַּחַת הַיָּכִינִי
  choice: wa Yakini, ukoo wa Wayakini
  rationale: Herufi ya kwanza ya jina ni yod ya Kiebrania; “Yakini” ni unukuzi wa moja kwa moja unaofaa muundo wa sauti wa Kiswahili, na “Wayakini” ni jina la ukoo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na ulio wazi. Muundo wa orodha na urudiaji wa fomula ya sensa umehifadhiwa; “ukoo” na “koo” zimetumiwa badala ya “familia” ili kuonyesha makundi mapana ya nasaba.
