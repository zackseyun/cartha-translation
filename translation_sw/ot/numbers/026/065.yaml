base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/065.yaml
  text: For Yahweh had said of them[b][a], ‘They shall surely die in the wilderness,’ and not a man was left of them except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: sw
  text: Kwa maana Yahwe alikuwa amewaambia, “Hakika watakufa[a] nyikani,” wala hakuna hata mtu mmoja wao aliyebaki[b], isipokuwa Kalebu mwana wa Yefune na Yoshua mwana wa Nuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa neno kwa neno: “wakifa watakufa”; huu ni muundo wa kusisitiza, wenye maana ya “hakika watakufa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “wala hakuna yeyote aliyebaki miongoni mwao.” Kiebrania kwa neno kwa neno: “wala hakusalia mtu miongoni mwao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja katika umbo linalotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya matokeo ya sensa yaliyotajwa kabla.
- source_word: אָמַר ... לָהֶם
  choice: alikuwa amesema kuwahusu
  rationale: Wakati timilifu uliopita unaonyesha kuwa tamko lilitangulia matokeo yanayoelezwa; ‘kuwahusu’ linafaa kwa muktadha wa tamko lililotolewa juu yao.
- source_word: מוֹת יָמֻתוּ
  choice: Hakika watakufa
  rationale: Kielezi ‘hakika’ kinawasilisha msisitizo wa muundo wa Kiebrania wa kitenzi-jina halisi pamoja na kitenzi kikomo.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: ‘Nyika’ ni neno la kawaida na linalofaa kwa eneo lisilokaliwa ambamo Israeli walizunguka, bila kulifanya lazima kuwa jangwa la mchanga.
- source_word: וְלֹא נוֹתַר מֵהֶם אִישׁ
  choice: Wala hakuna hata mtu mmoja wao aliyebaki
  rationale: 'Tafsiri hii ni ya asili katika Kiswahili na inahifadhi nguvu ya distributivu ya אִישׁ: hakuna hata mmoja aliyesalia miongoni mwao.'
- source_word: כִּי אִם
  choice: isipokuwa
  rationale: Nahau hii inatanguliza watu wawili pekee waliokuwa tofauti na kundi lililotajwa.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Kalebu mwana wa Yefune
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika Kiswahili, na patronimu imetafsiriwa kwa kawaida kama ‘mwana wa’.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: na Yoshua mwana wa Nuni
  rationale: Jina na patronimu zimetolewa kwa mtindo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina na ni umbo la Kiswahili linaloeleweka, bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya nukuu ili isomeke kwa urahisi, huku uhusiano wa kimantiki ukihifadhiwa. ‘Hakuna hata mtu mmoja’ hudumisha msisitizo wa kwamba si mtu mmoja aliyesalia.
