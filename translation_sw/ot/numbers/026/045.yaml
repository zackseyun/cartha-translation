translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Muundo sambamba wa orodha ya sensa umehifadhiwa, huku “ukoo” likitumika kwa kitengo cha kindugu. Neno “na” limeongezwa kabla ya tawi la pili kwa mtiririko wa kawaida wa Kiswahili bila kubadili maana.
