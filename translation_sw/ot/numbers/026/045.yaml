base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/045.yaml
  text: 'For the sons of Beriah: from Heber, the clan of the Heberites; from Malkiel, the clan of the Malkielites.'
translation:
  language: sw
  text: 'Wana wa Beria: kutoka kwa Heberi, ukoo wa Waheberi; na kutoka kwa Malkieli, ukoo wa Wamalkieli.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: Wana wa
  rationale: Katika muundo huu wa sensa, kifungu hiki kinaanzisha matawi ya ukoo yanayotokana na Beria. “Wana wa” huhifadhi muundo wa nasaba kwa Kiswahili cha kawaida.
- source_word: בְרִיעָה
  choice: Beria
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa Kiswahili bila kutafsiri maana yake.
- source_word: לְ/חֶבֶר
  choice: kutoka kwa Heberi
  rationale: Kiambishi לְ katika orodha hii ya sensa kinaonyesha chanzo cha ukoo; “kutoka kwa” hueleza asili ya ukoo kwa uwazi.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika muktadha wa sensa, neno hili linamaanisha kundi la kindugu ndani ya kabila. “Ukoo” ni la kawaida na sahihi zaidi kuliko “familia” katika muktadha huu.
- source_word: הַֽ/חֶבְרִי
  choice: Waheberi
  rationale: Umbo hili la jina linaonyesha watu wa ukoo uliotokana na Heberi; kiambishi Wa- ni njia ya asili ya Kiswahili ya kutaja kundi la watu.
- source_word: לְ/מַ֨לְכִּיאֵל
  choice: kutoka kwa Malkieli
  rationale: Kama ilivyo kwa Heberi, לְ inaonyesha kuwa ukoo huu ulitokana na babu aliyetajwa.
- source_word: הַ/מַּלְכִּיאֵלִי
  choice: Wamalkieli
  rationale: Umbo la Kiebrania linataja kundi la wazao wa Malkieli; “Wamalkieli” huhifadhi uhusiano huo wa jina kwa Kiswahili.
