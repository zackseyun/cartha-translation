base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/048.yaml
  text: 'The sons of Naphtali by their clans: of Jahzeel, the clan of the Jahzeelites; of Guni, the clan of the Gunites.'
translation:
  language: sw
  text: 'Wana wa Naftali kwa koo zao: wa Yahseeli, ukoo wa Wayahseeli; wa Guni, ukoo wa Waguni.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Muundo huu unafuata maana ya msingi ya neno la Kiebrania katika orodha ya nasaba, huku ukiwa wa kawaida katika Kiswahili.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Kirai hiki kinaonyesha mgawanyo wa kabila kwa makundi ya ukoo; “koo” linafaa zaidi kuliko “familia” katika muktadha huu wa sensa na nasaba.
- source_word: לְיַחְצְאֵל
  choice: wa Yahseeli
  rationale: Herufi לְ hapa inamtambulisha babu ambaye ukoo umetokana naye; “wa” ni kifupi na cha kawaida katika orodha ya nasaba ya Kiswahili.
- source_word: מִשְׁפַּחַת הַיַּחְצְאֵלִי
  choice: ukoo wa Wayahseeli
  rationale: Neno מִשְׁפָּחָה limetafsiriwa “ukoo,” na jina la kundi limeundwa kwa kiambishi cha Kiswahili Wa- ili kuonyesha wazao wa Yahseeli kwa pamoja.
- source_word: לְגוּנִי
  choice: wa Guni
  rationale: Matumizi yale yale ya kinasaba ya לְ yanamtambulisha Guni kama babu wa kundi.
- source_word: מִשְׁפַּחַת הַגּוּנִי
  choice: ukoo wa Waguni
  rationale: Kirai kinaonyesha kundi la wazao wa Guni; “Waguni” ni umbo la pamoja linaloeleweka katika Kiswahili.
