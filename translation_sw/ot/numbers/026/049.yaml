base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/049.yaml
  text: of Iezer, the clan of the Iezerites; of Shillem, the clan of the Shillemites.
translation:
  language: sw
  text: wa Yezeri, ukoo wa Wayezeri; wa Shilemu, ukoo wa Washilemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יֵצֶר
  choice: wa Yezeri
  rationale: Katika mtindo huu wa sensa, kiambishi לְ kinamtambulisha mkuu wa ukoo; Kiswahili hutumia kwa kawaida “wa.” Jina limetoholewa kwa kuzingatia matamshi ya Kiebrania.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika muktadha wa sensa na makabila, neno hili linamaanisha kundi la jamaa ndani ya kabila, si familia ndogo tu; “ukoo” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: הַ/יִּצְרִי
  choice: Wayezeri
  rationale: Umbo hili la Kiebrania hutaja watu wa ukoo unaotokana na Yezeri. “Wayezeri” linadhihirisha uhusiano huo kwa muundo wa kawaida wa majina ya watu katika Kiswahili.
- source_word: לְ/שִׁלֵּם
  choice: wa Shilemu
  rationale: Kama katika sehemu ya kwanza ya mstari, לְ limetafsiriwa kwa “wa” katika orodha hii ya koo. Jina limetoholewa kutoka Kiebrania.
- source_word: הַ/שִּׁלֵּמִי
  choice: Washilemu
  rationale: Umbo hili hutaja watu wa ukoo wa Shilemu; “Washilemu” ni namna ya asili ya Kiswahili ya kuonyesha kundi la watu linalohusishwa na jina hilo.
theological_decisions: []
