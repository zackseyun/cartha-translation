base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/032.yaml
  text: from Shemida, the clan of the Shemidaites; and from Hepher, the clan of the Hepherites.
translation:
  language: sw
  text: kutoka kwa Shemida, ukoo wa Washemida; na kutoka kwa Heferi, ukoo wa Waheferi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁמִידָע
  choice: kutoka kwa Shemida
  rationale: Katika orodha hii ya sensa, muundo uliodokezwa ni ‘kutoka kwa X, ukoo wa...’; kwa hiyo ‘kutoka kwa’ huwasilisha maana kwa Kiswahili cha kawaida kuliko kuacha kiunganishi ‘na’ pekee.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika orodha za kikabila na sensa, מִשְׁפָּחָה ni kundi la undugu lililo chini ya kabila; ‘ukoo’ ni neno la Kiswahili lililo wazi na sahihi zaidi hapa kuliko ‘familia’.
- source_word: הַ/שְּׁמִידָעִי
  choice: Washemida
  rationale: Umbo hili la Kiebrania humaanisha kundi la wazao au watu wanaohusishwa na Shemida. ‘Washemida’ ni uundaji wa kawaida wa jina la watu katika Kiswahili.
- source_word: וְ/חֵפֶר
  choice: na kutoka kwa Heferi
  rationale: Kiunganishi kinaanzisha kipengele kinachofuata katika muundo uleule wa sensa; ‘kutoka kwa’ huongezwa ili sentensi ya Kiswahili iwe wazi na kamili.
- source_word: הַֽ/חֶפְרִי
  choice: Waheferi
  rationale: Neno hili la nasaba linataja ukoo unaotokana na Heferi; ‘Waheferi’ ni umbo la kawaida la Kiswahili kwa kundi la watu.
