base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/013.yaml
  text: of Zerah, the clan of the Zerahites; of Shaul, the clan of the Shaulites.
translation:
  language: sw
  text: wa Zera, ukoo wa Wazera; wa Shauli, ukoo wa Washauli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/זֶרַח
  choice: wa Zera
  rationale: Katika mtindo huu wa sensa, kiambishi לְ kinaonyesha uhusiano wa ukoo na babu aliyetajwa; “wa Zera” ni usemi wa kawaida wa Kiswahili unaoonyesha asili hiyo.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika muktadha wa sensa na makabila, מִשְׁפָּחָה ni kundi la jamaa ndani ya kabila; “ukoo” linafaa zaidi kuliko “familia” na linaendeleza muundo unaorudiwa.
- source_word: הַזַּרְחִי
  choice: Wazera
  rationale: Jina hili la nasaba linamaanisha watu waliotokana na Zera; “Wazera” ni umbo la Kiswahili lililo wazi na la kawaida kwa kundi la watu.
- source_word: לְ/שָׁאוּל
  choice: wa Shauli
  rationale: Kama katika kishazi cha kwanza, לְ kinaonyesha uhusiano wa nasaba; “wa Shauli” linafikisha maana hiyo kwa ufupi.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Limetafsiriwa kwa uthabiti kama katika kishazi cha kwanza ili kuhifadhi urudiaji wa kimakusudi wa mtindo wa sensa.
- source_word: הַשָּׁאוּלִי
  choice: Washauli
  rationale: Umbo la nasaba linataja kundi lililotokana na Shauli; “Washauli” linaakisi uundaji huo kwa Kiswahili cha kawaida.
