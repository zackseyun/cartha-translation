- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika sensa ya Hesabu, neno hili linamaanisha kitengo cha kindugu ndani ya kabila; ‘ukoo’ ni sahihi na asilia katika muktadha huu.
- source_word: הָ/עֵרָנִי
  choice: Waerani
  rationale: Umbo hili la jina humaanisha watu wa ukoo uliotokana na Erani; kiambishi Wa- huunda jina la kundi kwa Kiswahili.
