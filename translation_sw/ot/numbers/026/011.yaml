- source_word: קֹרַח
  choice: Kora
  rationale: Jina hili la mtu limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: לֹא
  choice: hawaku-
  rationale: Kikanushi לֹא pamoja na kitenzi cha wingi kimetolewa kwa muundo wa kawaida wa Kiswahili wa wakati uliopita, “hawaku-”.
- source_word: מֵתוּ
  choice: fa
  rationale: Kitenzi מות humaanisha “kufa.” Katika muundo “hawakufa,” kinaonyesha wazi kwamba wana wa Kora hawakupata kifo hicho.
