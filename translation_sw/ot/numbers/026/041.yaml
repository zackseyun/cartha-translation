  text: These were the sons of Benjamin by their clans, and those numbered from them were forty-five thousand six hundred.
translation:
  language: sw
  text: Hawa ndio wana wa Benyamini kwa koo zao; idadi ya waliohesabiwa ilikuwa arobaini na tano elfu na mia sita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי בִנְיָמִן
  choice: wana wa Benyamini
  rationale: Kauli hii inafuata muundo wa Kiebrania na inaendana na lugha ya nasaba katika muktadha huu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Neno מִשְׁפָּחָה hapa linamaanisha vikundi vya ukoo ndani ya kabila; “koo” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: וּפְקֻדֵיהֶם
  choice: waliohesabiwa kutoka kwao
  rationale: Huhifadhi maana ya watu walioorodheshwa katika sensa kutoka miongoni mwa koo hizo, bila kudokeza kwamba idadi yenyewe ndiyo inayotajwa.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 45,600
  rationale: Tarakimu huwasilisha hesabu hiyo kwa uwazi na kwa namna ya kawaida kwa msomaji wa kisasa.
