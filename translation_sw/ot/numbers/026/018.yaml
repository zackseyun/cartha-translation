  rationale: Ingawa maana ya moja kwa moja ni ‘wana wa Gadi,’ hapa inawahusu vizazi au uzao wake kwa ujumla, si wana wa moja kwa moja pekee.
- source_word: לִפְקֻדֵיהֶם
  choice: kulingana na waliohesabiwa miongoni mwao
  rationale: Huwasilisha hesabu ya walioandikishwa katika sensa kutoka miongoni mwa koo hizo, huku ikidumisha uhusiano wa kirai na jumla inayofuata.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: watu 40,500
  rationale: Namba imewasilishwa kwa tarakimu kwa uwazi wa kisasa; ‘watu’ huweka wazi kuwa hii ni jumla ya waliohesabiwa.
