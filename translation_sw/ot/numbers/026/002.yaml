base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], from twenty years old and upward, by their fathers’ houses[c][b], everyone in Israel who goes out to war.
translation:
  language: sw
  text: “Fanyeni sensa ya kusanyiko lote la wana wa Israeli[a], kuanzia wenye umri wa miaka ishirini na kuendelea, kwa nyumba za baba zao[b]—kila anayekwenda vitani katika Israeli.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli” au “watoto wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: “Nyumba za baba” ni jamaa au koo zilizopangwa kwa ukoo wa upande wa baba.
    reason: cultural_clarification
  - marker: c
    text: Au, “kila anayefaa kwa huduma ya kijeshi katika Israeli.” Kiebrania kihalisi kina usemi “kila atokaye kwenda vitani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת־רֹאשׁ
  choice: Fanyeni sensa
  rationale: Maneno haya kihalisi yanahusu ‘kuinua kichwa,’ lakini kwa pamoja ni nahau ya kuhesabu watu. ‘Fanyeni sensa’ hutoa maana yake wazi katika Kiswahili cha sasa.
- source_word: כָּל עֲדַת
  choice: kusanyiko lote
  rationale: עֵדָה humaanisha jumuiya ya agano ikitazamwa kama kusanyiko; ‘kusanyiko lote’ linadumisha maana hiyo ya kijamii na rasmi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inadumisha usemi wa kifamilia wa Kiebrania. Katika muktadha huu wa sensa ya kijeshi, umbo la kiume pia lina umuhimu wa kimuktadha.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: kuanzia wenye umri wa miaka ishirini na kuendelea
  rationale: Ni usemi wa kawaida unaoweka kiwango cha chini cha umri; tafsiri hii ni ya asili na wazi kwa msomaji wa Kiswahili.
- source_word: לְבֵית אֲבֹתָם
  choice: kwa kufuata nyumba za baba zao
  rationale: ‘Nyumba za baba’ ni vitengo vya ukoo vinavyotokana na upande wa baba. Neno ‘kwa kufuata’ linaonyesha kwamba sensa ilipangwa kwa vitengo hivyo.
- source_word: כָּל יֹצֵא צָבָא
  choice: kila anayekwenda vitani
  rationale: Tafsiri hii inafuata kwa karibu kirai cha Kiebrania cha ‘kutoka’ kwa ajili ya jeshi au vita, bila kuongeza moja kwa moja wazo la uwezo au ustahili, ingawa matumizi yake yanawahusu wanaohudumu kijeshi.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Hii inadumisha uhusiano wa mahali na jumuiya unaoonyeshwa na kihusishi cha Kiebrania.
theological_decisions:
- issue: Usemi wa kifamilia wenye jinsia katika בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: ‘Wana wa Israeli’ huhifadhi muundo wa kifamilia na umbo la kiume la chanzo, jambo linalofaa hasa katika sensa hii ya kijeshi, bila kulibadili kuwa usemi usioonyesha jinsia.
- issue: Maana ya kustahili huduma ya kijeshi katika כָּל יֹצֵא צָבָא
  choice: kila anayekwenda vitani
  alternative: kila anayefaa kwa huduma ya kijeshi; kila anayeweza kwenda vitani
  rationale: Kirai cha Kiebrania kinasema kwa namna ya moja kwa moja kuhusu mtu ‘anayetoka’ kwenda jeshini. Tafsiri iliyochaguliwa inadumisha namna hiyo ya kusema na kutoweka wazi zaidi ya chanzo kama ni uwezo, ustahili, au ushiriki wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Sensa’ ni neno la kawaida la kisasa; ‘kusanyiko’ na ‘nyumba za baba’ yanahifadhi muundo wa kijamii wa maandishi ya Pentateuko. Alama zote za tanbihi zimewekwa katika matini kuu.
