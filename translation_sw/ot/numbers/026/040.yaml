base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/040.yaml
  text: 'And the sons of Bela were Ard and Naaman: from Ard[a], the clan of the Ardite; from Naaman, the clan of the Naamite.'
translation:
  language: sw
  text: 'Wana wa Bela walikuwa Ardi na Naamani: kutoka kwa Ardi, ukoo wa Waardi; kutoka kwa Naamani, ukoo wa Wanaami.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania lina umbo la jina la ukoo linalotokana na Naamani; linaweza pia kutafsiriwa kwa uwazi zaidi kuwa “Wanaamani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walikuwa
  rationale: Kitenzi hiki kinaendeleza orodha ya nasaba na kutaja wana wa Bela bila kuongeza msisitizo usiokuwapo katika Kiebrania.
- source_word: בְנֵי
  choice: wana wa
  rationale: Katika nasaba hii, neno hili linawataja wana wa kiume au wazao waliotajwa kwa majina; “wana wa” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: בֶלַע
  choice: Bela
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אַרְדְּ
  choice: Ardi
  rationale: Jina la mtu limetoholewa kwa muundo unaosomeka kwa kawaida katika Kiswahili.
- source_word: וְנַעֲמָן
  choice: na Naamani
  rationale: Jina la mtu limetoholewa, huku kiunganishi cha Kiebrania kikihifadhiwa.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika sensa ya Hesabu, neno hili linamaanisha kitengo cha kindugu ndani ya kabila; “ukoo” ni sahihi na ya kawaida kuliko “familia” katika muktadha huu.
- source_word: הָאַרְדִּי
  choice: Waardi
  rationale: Umbo hili la jina linawatambulisha watu wa ukoo uliotokana na Ardi; wingi wa Kiswahili unafaa baada ya “ukoo wa”.
- source_word: לְנַעֲמָן
  choice: kutoka kwa Naamani
  rationale: Kiambishi ל katika fomula hii ya nasaba kinaonyesha chimbuko au uhusiano; “kutoka kwa” huwasilisha wazi wazo la ukoo unaotokana naye.
- source_word: הַנַּעֲמִי
  choice: Wanaami
  rationale: Hili ni umbo la kikoo linalotokana na jina Naamani, limetoholewa kwa namna inayotofautisha jina la ukoo na jina la babu huyo.
