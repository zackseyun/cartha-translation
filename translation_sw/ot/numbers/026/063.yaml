base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/063.yaml
  text: These are those counted by Moses and Eleazar the priest[b][a], who counted the sons of Israel in the plains of Moab by the Jordan at Jericho.
translation:
  language: sw
  text: Hawa ndio waliohesabiwa na Musa na Eleazari kuhani, ambao waliwahesabu wana wa Israeli[a] katika nchi tambarare za Moabu, kando ya Yordani, mkabala na Yeriko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli,” “watu wa Israeli,” au “watoto wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kando ya Yordani karibu na Yeriko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: waliohesabiwa
  rationale: Katika muktadha wa sensa, neno hili linawahusu watu walioingizwa katika hesabu. ‘Waliohesabiwa’ ni Kiswahili cha kawaida na hudumisha uhusiano wake na kitenzi kinachorudiwa baadaye.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Kiebrania kinasema ‘kuhani,’ si ‘kuhani mkuu’; tafsiri haiongezi cheo kisichotajwa.
- source_word: פָּקְדוּ
  choice: waliwahesabu
  rationale: Hili linadumisha mzizi na wazo lilelile la sensa lililo katika פְּקוּדֵי, huku kiambishi ‘-wa-’ kikionyesha wazi watu waliohesabiwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa Kiebrania wenye muundo wa ukoo na wingi wa kiume, bila kuufanya kimya kimya kuwa usemi usioonyesha jinsia.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: katika nchi tambarare za Moabu
  rationale: Huu ni usemi wa kijiografia unaoeleweka kwa urahisi katika Kiswahili cha sasa; ‘nchi tambarare’ huwasilisha maana ya nyanda tambarare za eneo hilo.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: kando ya Yordani karibu na Yeriko
  rationale: Hutoa kwa ufupi mahali palipo kando ya Yordani kwa kuhusianishwa na Yeriko, huku uwezekano wa kuelewa ‘mkabala na Yeriko’ ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Usemi wa kiukoo wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli; watoto wa Israeli
  rationale: Muundo wa chanzo ni wa kiume na wa kiukoo. ‘Wana wa Israeli’ huuhifadhi, na tanbihi inaonyesha tafsiri za kawaida zinazoweza kumaanisha jamii yote.
- issue: Cheo cha Eleazari
  choice: kuhani
  alternative: kuhani mkuu
  rationale: Ingawa Eleazari alikuwa na wadhifa wa ukuhani mkuu katika muktadha, mstari huu unatumia tu neno ‘kuhani’; tafsiri haiongezi cheo hicho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio ‘Eleazari kuhani’ unafuata kwa karibu uhusiano wa jina na cheo katika chanzo bila kuongeza ‘mkuu.’
