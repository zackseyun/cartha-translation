lexical_decisions:
- source_word: אֵלֶּה בְנֵי דָן
  choice: Hawa ndio wana wa Dani
  rationale: “Wana wa Dani” huhifadhi usemi halisi wa nasaba, huku “hawa ndio” ikitoa kwa Kiswahili utangulizi wa kawaida wa orodha ya sensa.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Katika sensa ya Hesabu, מִשְׁפָּחָה kwa kawaida ni kitengo cha ukoo ndani ya kabila; “kwa koo zao” ni wazi na ya asili.
- source_word: לְשׁוּחָם
  choice: wa Shuhamu
  rationale: Kiambishi לְ katika muundo huu wa nasaba kinaonyesha uhusiano wa kundi na mwanzilishi wake; “wa Shuhamu” huwasilisha uhusiano huo bila kuongeza maelezo yasiyokuwamo.
- source_word: מִשְׁפַּחַת הַשּׁוּחָמִי
  choice: ukoo wa Washuhamu
  rationale: Nomino ya umoja pamoja na jina la kundi inaeleza ukoo uliotokana na Shuhamu; “Washuhamu” limetumiwa kama jina la pamoja la wanaukoo.
- source_word: מִשְׁפְּחֹת דָּן
  choice: koo za Dani
  rationale: Hili ni neno la muhtasari kwa migawanyiko ya kikabila ya Dani, hivyo “koo” linafaa kuliko “familia” katika muktadha huu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa jamaa zao
  rationale: Katika kifungu cha mwisho, “jamaa zao” hudumisha maana pana ya vikundi vya kindugu na kuepuka marudio mazito ya “koo ... kwa koo zao,” bila kuondoa marudio ya muundo wa Kiebrania.
