  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sensa na marudio ya Kiebrania yamehifadhiwa kwa kiasi kinachobaki cha kawaida katika Kiswahili; “ukoo/koo” limetumiwa kwa kitengo cha kikabila, na “jamaa” katika hitimisho ili kuzuia uradidi usio wa kawaida.
