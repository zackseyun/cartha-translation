  text: 'These were the sons of Dan by their clans: of Shuham[a], the clan of the Shuhamites. These were the clans of Dan by their families.'
translation:
  language: sw
  text: 'Hawa ndio wana wa Dani[a] kwa koo zao: wa Shuhamu, ukoo wa Washuhamu. Hizi ndizo koo za Dani kwa koo zao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Dani”; katika muundo huu wa sensa ya nasaba, “wana” linaweza kumaanisha wazao wa kabila.'
