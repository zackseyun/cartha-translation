base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/020.yaml
  text: 'The sons of Judah by their clans were: of Shelah[a], the clan of the Shelanites; of Perez, the clan of the Perezites; of Zerah[b], the clan of the Zerahites.'
translation:
  language: sw
  text: 'Wana wa Yuda, kwa koo zao, walikuwa: wa Shela, ukoo wa Washela; wa Peresi, ukoo wa Waperesi; na wa Zera, ukoo wa Wazera.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walikuwa
  rationale: Katika orodha hii ya sensa, kitenzi hiki kinaanzisha kwa urahisi orodha ya koo; “walikuwa” ni Kiswahili cha kawaida na kinacholingana na muundo wa Kiebrania.
- source_word: בְנֵי יְהוּדָה
  choice: Wana wa Yuda
  rationale: בְנֵי kwa msingi humaanisha “wana,” ingawa katika muktadha huu wa nasaba na sensa inawahusu wazao wa kiume wa Yuda. Tafsiri hii inadumisha namna ya ukoo ya Kiebrania, huku tanbihi ikifafanua maana yake hapa.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה hapa ni kundi la ukoo lililo chini ya kabila; “koo” ni sahihi na ya kawaida kuliko “familia” katika muktadha wa sensa ya kikabila.
- source_word: לְשֵׁלָה
  choice: wa Shela
  rationale: Kiambishi לְ kinamtambulisha babu ambaye ukoo umetokana naye; “wa Shela” ni muundo mfupi na wa kawaida katika orodha ya Kiswahili.
- source_word: מִשְׁפַּחַת הַשֵּׁלָנִי
  choice: ukoo wa Washela
  rationale: Muundo huu unahifadhi jina la ukoo linalotokana na Shela na unasomeka kwa kawaida katika Kiswahili.
- source_word: לְפֶרֶץ
  choice: wa Peresi
  rationale: “Peresi” linaakisi jina la Kiebrania פֶרֶץ kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: מִשְׁפַּחַת הַפַּרְצִי
  choice: ukoo wa Waperesi
  rationale: Jina la watu “Waperesi” linaonyesha wazi uhusiano wa ukoo na Peresi na kuhifadhi urudiaji wa orodha.
- source_word: לְזֶרַח
  choice: wa Zera
  rationale: “Zera” linaakisi kwa karibu jina la Kiebrania זֶרַח katika umbo la kawaida la Kiswahili.
- source_word: מִשְׁפַּחַת הַזַּרְחִי
  choice: ukoo wa Wazera
  rationale: Jina la ukoo “Wazera” linaonyesha kuwa kundi hilo limetokana na Zera na linalingana na muundo wa majina mengine katika mstari.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Urudiaji wa “ukoo wa...” umehifadhiwa ili kuonyesha muundo rasmi wa orodha ya sensa. Kiunganishi “na” kabla ya kundi la mwisho kimeongezwa kwa ufasaha wa kawaida wa Kiswahili bila kubadili yaliyomo.
