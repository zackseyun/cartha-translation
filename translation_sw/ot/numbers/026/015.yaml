base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/015.yaml
  text: 'The sons of Gad by their clans: of Zephon[a], the clan of the Zephonites; of Haggi, the clan of the Haggites; of Shuni, the clan of the Shunites.'
translation:
  language: sw
  text: 'Wana wa Gadi, kwa koo zao, ni hawa: wa Sefoni[a], ukoo wa Wasefoni; wa Hagi, ukoo wa Wahagi; wa Shuni, ukoo wa Washuni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya tafsiri za Kiingereza husoma “Zifoni” na “Wazifoni” hapa (linganisha Mwanzo 46:16), lakini Maandishi ya Kimasora katika mstari huu yanasoma “Sefoni” (צפון); kwa hiyo jina “Sefoni” limehifadhiwa katika andiko kuu.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי גָד
  choice: Wana wa Gadi
  rationale: Muundo huu unahifadhi nahau rasmi ya nasaba ya Kiebrania, huku jina la mtu na kabila גָד likinakiliwa kama “Gadi” kwa matamshi ya kawaida ya Kiswahili.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Katika muktadha wa sensa na nasaba, מִשְׁפָּחָה ni kundi la ukoo ndani ya kabila; “koo” ni neno la asili na linaloeleweka katika Kiswahili cha sasa.
- source_word: לִצְפוֹן
  choice: kutoka kwa Sefoni
  rationale: Kiambishi לְ katika orodha hii kinaonyesha mstari wa uzao au chimbuko. “Kutoka kwa” huwasilisha uhusiano huo wazi, na צְפוֹן imenakiliwa “Sefoni” kwa kuzingatia konsonanti na vokali za Kiebrania pamoja na mfumo wa sauti wa Kiswahili.
- source_word: מִשְׁפַּחַת הַצְּפוֹנִי
  choice: ukoo wa Wasefoni
  rationale: Hili ni jina la ukoo uliotokana na Sefoni. Kiambishi cha Kiswahili Wa- kinaunda jina la watu wa ukoo huo kwa njia ya kawaida.
- source_word: לְחַגִּי / מִשְׁפַּחַת הַחַגִּי
  choice: kutoka kwa Hagi, ukoo wa Wahagi
  rationale: Jina חַגִּי limenakiliwa “Hagi”; uradidi wa konsonanti ya Kiebrania hauhitaji kuandikwa mara mbili katika tahajia ya kawaida ya Kiswahili. Muundo wa ukoo umewekwa sambamba na sehemu ya kwanza.
- source_word: לְשׁוּנִי / מִשְׁפַּחַת הַשּׁוּנִי
  choice: kutoka kwa Shuni, ukoo wa Washuni
  rationale: שׁוּנִי imenakiliwa “Shuni,” na jina la watu wa ukoo limeundwa kwa Wa-. Muundo sambamba wa orodha ya Kiebrania umehifadhiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Koo” na “ukoo” zimetumiwa kwa ufasaha ili kutofautisha wingi wa makundi na jina la kila kundi. Muundo wa orodha na ulinganifu wa vifungu vya Kiebrania umehifadhiwa bila kuufanya mstari kuwa mgumu.
