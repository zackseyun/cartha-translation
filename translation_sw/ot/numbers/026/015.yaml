  - marker: a
    text: Baadhi ya tafsiri za Kiingereza husoma “Zifoni” na “Wazifoni” hapa (linganisha Mwanzo 46:16), lakini Maandishi ya Kimasora katika mstari huu yanasoma “Sefoni” (צפון); kwa hiyo jina “Sefoni” limehifadhiwa katika andiko kuu.
    reason: textual_variant
  revision_rationale: The revision preserves all names, clan designations, and the textual-variant note, while making the genealogical heading more faithful to the Hebrew and more idiomatic in Standard East African Swahili. No doctrinal or interpretive change is involved.
