  text: Kulingana na kura[a], urithi wake utagawanywa kati ya walio wengi na walio wachache.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa kura urithi wake utagawiwa kati ya walio wengi na walio wachache.” Kiebrania kinatofautisha walio wengi na walio wachache katika ugawaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: Kwa uamuzi wa
  rationale: Nahau hii humaanisha kufuata au kutegemea uamuzi wa kitu fulani. Katika muktadha huu, “kwa uamuzi wa” inaonyesha kwa kawaida kwamba kura ndiyo inayoamua mgawanyo.
- source_word: הַגּוֹרָל
  choice: kura
  rationale: Neno hili linamaanisha kura iliyotumiwa kuamua mgao. “Kura” ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: תֵּחָלֵק
  choice: utagawanywa
  rationale: Umbo la Kiebrania ni la kutendwa na linaonyesha kwamba urithi utawekwa katika sehemu au mgao mbalimbali; “utagawanywa” huhifadhi maana hiyo.
- source_word: נַחֲלָתוֹ
  choice: urithi wake
  rationale: Nomino ina kiambishi cha nafsi ya tatu, umoja wa kiume. “Urithi wake” huhifadhi umbo la Kiebrania bila kulazimisha bayana rejeleo lake la kimuktadha.
- source_word: בֵּין
  choice: kati ya
  rationale: Neno hili linaunganisha makundi mawili yanayotofautishwa, hivyo “kati ya” ni la moja kwa moja na la kawaida.
- source_word: רַב
  choice: kundi kubwa
  rationale: Katika muktadha wa sensa na ugawaji wa ardhi, neno hili linaonyesha kundi lenye watu wengi zaidi. Kuongeza “kundi” hufanya ulinganisho huo uwe wazi kwa Kiswahili cha kawaida bila kuufanya kuwa mgao mkubwa.
- source_word: לִמְעָט
  choice: kundi dogo
  rationale: Hili ni kundi linalolinganishwa na lenye watu wengi zaidi. “Kundi dogo” hudokeza idadi ndogo ya watu kwa lugha ya kawaida.
