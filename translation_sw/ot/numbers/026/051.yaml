lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa ndio
  rationale: Kiashirio cha wingi kinatanguliza jumla ya sensa; Kiswahili cha kawaida hutumia ‘Hawa ndio’ kwa watu wanaotajwa.
- source_word: פְּקוּדֵי
  choice: wanaume ... waliohesabiwa
  rationale: Katika muktadha huu neno linawahusu watu walioandikishwa na kuhesabiwa katika sensa ya wanaume wanaoweza kwenda vitani, si idadi dhahania tu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa ukaribu usemi wa kifamilia wa Kiebrania na jinsia yake, huku ukirejelea wanaume waliohesabiwa miongoni mwa taifa.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וָאָלֶף שְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: mia sita na moja elfu, mia saba na thelathini
  rationale: Hutoa kwa usahihi jumla ya 601,730 kwa mpangilio wa kawaida na unaoeleweka wa Kiswahili.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Usemi halisi ni ‘wana wa Israeli.’ Tafsiri hii huhifadhi lugha ya kifamilia na jinsia ya chanzo bila kuibadili kuwa jina la kabila pekee.
- issue: Maana ya פְּקוּדֵי katika muktadha wa sensa
  choice: wanaume ... waliohesabiwa
  alternative: waliohesabiwa; jumla ya sensa
  rationale: Sura hii inahesabu wanaume walioandikishwa kwa sensa ya kijeshi. Kutaja watu waliohesabiwa huakisi matumizi ya Kiebrania vizuri kuliko kutoa jumla dhahania pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘mia sita na moja elfu’ umetumiwa kuonyesha 601,000 kwa uwazi, kisha kuongezwa ‘mia saba na thelathini.’ Alama zote za tanbihi zimewekwa baada ya jumla inayohusika.
