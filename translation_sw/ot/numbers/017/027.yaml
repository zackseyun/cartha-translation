lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi kwa uwazi nahau ya Kiebrania na utambulisho wa pamoja; ‘Waisraeli’ ni mbadala wa Kiswahili ulio laini zaidi.
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: wakamwambia Musa
  rationale: Muundo wa kawaida wa Kiswahili wa kuanzisha usemi wa moja kwa moja unawasilisha kazi ya לֵאמֹר bila kurudia ‘wakisema’ kwa namna nzito.
- source_word: הֵן
  choice: Tazama
  rationale: Ni mshangao wa kuvuta fikira unaoonyesha hofu ya ghafla; ‘Tazama’ ni wa heshima na unaeleweka katika Kiswahili sanifu.
- source_word: גָּוַעְנוּ
  choice: tunakufa
  rationale: Kitenzi kinaashiria kufa au kutoa pumzi ya mwisho; hali ya sasa inaendana na kilio chao cha hofu.
- source_word: אָבַדְנוּ
  choice: tunaangamia
  rationale: ‘Tunaangamia’ huonyesha kuharibiwa au kupotea kabisa na pia hukitofautisha kitenzi hiki na גוע, bila kupunguza mkazo wa kilio.
- source_word: כֻּלָּנוּ
  choice: Sisi sote
  rationale: Umbo hili linatia mkazo jumla ya watu wote, kama ilivyo katika Kiebrania.
- source_word: אָבָדְנוּ
  choice: tunaangamia
  rationale: Kurudia tafsiri ileile kunahifadhi marudio ya makusudi na hofu kubwa ya wasemaji.
