base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/022.yaml
  text: So Moses placed the staffs before Yahweh in the tent of the testimony[a][b].
translation:
  language: sw
  text: Basi Musa akaziweka fimbo hizo mbele za Yahweh katika hema la Ushuhuda[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fito hizo.” Neno la Kiebrania hapa linarejelea fimbo halisi zilizowakilisha makabila.
    reason: lexical_alternative
  - marker: b
    text: Au “katika maskani ya Ushuhuda.” Kihalisi, “katika hema la Ushuhuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: akaziweka
  rationale: Kitenzi hiki katika mfululizo wa simulizi kina maana ya kuweka au kutua kitu mahali. “Akaziweka” ni Kiswahili cha kawaida na kinaendeleza simulizi.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo jina la kawaida la mhusika huyo katika Kiswahili cha Biblia.
- source_word: הַמַּטֹּת
  choice: fimbo hizo
  rationale: Katika muktadha huu neno מַטּוֹת linamaanisha fimbo halisi zilizowakilisha makabila. “Fimbo” ni neno la asili na linaloeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Usemi huu unaonyesha kuwekwa mbele ya Yahweh, yaani katika uwepo wake, bila kuongeza ufafanuzi usiotajwa wazi katika Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: בְּאֹהֶל
  choice: katika hema
  rationale: אֹהֶל humaanisha kihalisi “hema.” Tafsiri hii inadumisha taswira ya Kiebrania; “maskani” ni tafsiri ya kimapokeo inayowezekana.
- source_word: הָעֵדֻת
  choice: la Ushuhuda
  rationale: עֵדוּת hapa ni jina linalohusishwa na ushuhuda wa agano uliokuwa katika mahali patakatifu. “Ushuhuda” inadumisha istilahi hiyo bila kuibana kuwa maelezo mahususi zaidi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahweh” linadumisha jina hilo badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Basi” na muundo wa “akaziweka” hudumisha mtiririko wa simulizi; “hema la Ushuhuda” huhifadhi usemi halisi wa chanzo huku tanbihi ikitoa istilahi ya kimapokeo “maskani.”
