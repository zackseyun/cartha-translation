  text: וַ/יְהִ֗י בְּ/הִקָּהֵ֤ל הָֽ/עֵדָה֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן וַ/יִּפְנוּ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִנֵּ֥ה כִסָּ֖ה/וּ הֶ/עָנָ֑ן וַ/יֵּרָ֖א כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/007.yaml
  text: And it happened[a], when the congregation assembled against Moses and against Aaron, that they turned toward the tent of meeting, and behold, the cloud covered it, and the glory of Yahweh appeared.
translation:
  language: sw
  text: Ikawa, kusanyiko lilipokusanyika dhidi ya Musa na Aroni, waligeuka kuelekea Hema la Kukutania; na tazama, wingu likalifunika[a], na utukufu wa Yahwe ukaonekana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “likalifunika”; kwa uwezekano mkubwa kiambishi hiki kinarejelea Hema la Kukutania.'
    reason: Ufafanuzi wa kirejelewa cha kiambishi katika כִסָּהוּ.
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi mpito wa kawaida wa simulizi ya Kiebrania kwa lugha fupi, yenye hadhi, na isiyo ya kizamani kupita kiasi.
- source_word: בְּהִקָּהֵל הָעֵדָה
  choice: kusanyiko lilipokusanyika
  rationale: Muundo wenye בְּ na kitenzi-jina unaonyesha wakati, yaani ‘lilipokusanyika’; עֵדָה ni jumuiya iliyokusanyika, hapa imetafsiriwa ‘kusanyiko.’
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: dhidi ya Musa na Aroni
  rationale: Katika muktadha huu עַל inaonyesha upinzani wa kusanyiko, si kuelekea mahali tu.
- source_word: וַיִּפְנוּ אֶל
  choice: waligeuka kuelekea
  rationale: פנה inaeleza kugeuka kimwili au kuelekeza uso upande fulani bila kuongeza tafsiri ya nia yao.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Tafsiri hii inaonyesha kwa uwazi hema lililohusishwa na kukutana, na ni istilahi ya kawaida ya Kiswahili katika simulizi za Pentateuko.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: ‘Tazama’ huhifadhi nguvu ya neno linalovuta fikira kwenye jambo la ghafula na lenye uzito.
- source_word: כִסָּהוּ הֶעָנָן
  choice: wingu likalifunika
  rationale: Kitenzi ni ‘kufunika,’ na kiambishi cha nafsi ya tatu umoja wa kiume kinarejelea kwa uwezekano mkubwa אֹהֶל, ‘hema’; katika Kiswahili rejeo hilo linaonyeshwa kwa kiambishi -li- cha ngeli ya ‘hema.’
- source_word: וַיֵּרָא
  choice: ukaonekana
  rationale: Nifali ya ראה hapa inaeleza kujidhihirisha kwa kuonekana; ‘ukaonekana’ ni ya asili katika Kiswahili na haiendi mbali zaidi ya maandishi.
- source_word: כְּבוֹד יְהוָה
  choice: utukufu wa Yahwe
  rationale: ‘Utukufu’ huhifadhi maana ya fahari au uwepo wa Mungu unaodhihirika, huku ‘Yahwe’ ikiwakilisha jina la Mungu lililoandikwa katika Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kina jina binafsi la Mungu, si cheo; ‘Yahwe’ hulihifadhi kwa unukuzi wa kawaida wa Kiswahili bila kulibadilisha kuwa cheo.
- issue: Kirejelewa cha kiambishi katika כִסָּהוּ
  choice: wingu lilifunika Hema la Kukutania
  alternative: wingu lilifunika kusanyiko au eneo lote
  rationale: Kiambishi cha umoja wa kiume kwa kawaida humrejelea nomino ya karibu אֹהֶל, ‘hema.’ Hata hivyo, kwa kuwa kiambishi pekee ndicho kilichopo katika Kiebrania, tanbihi inaeleza rejeo hilo badala ya kuficha suala hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. ‘Ikawa’ na ‘tazama’ zimetumiwa kuhifadhi mwendo na msisitizo wa simulizi ya Kiebrania; miundo mingine imewekwa katika lugha ya kawaida inayoeleweka kwa wasomaji wa leo.
