  yaml_path: translation/ot/numbers/017/015.yaml
  text: Then Aaron returned to Moses at the entrance of the tent of meeting[a], and the plague was stopped.
translation:
  language: sw
  text: Kisha Haruni akarudi kwa Musa kwenye mlango wa Hema la Kukutania, na tauni ikakomeshwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ikazuiliwa” au “ikadhibitiwa.”
    reason: Neno la Kiebrania linaweza kumaanisha kwamba tauni ilisitishwa, ilizuiwa, au ilidhibitiwa; kauli tendwa haimtaji mtendaji.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Kisha Haruni akarudi
  rationale: Waw ya mfululizo inaendeleza simulizi, na kitenzi שׁוּב hapa kina maana ya kurudi. “Kisha” na “akarudi” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: אֶל מֹשֶׁה
  choice: kwa Musa
  rationale: אֶל huonyesha kuelekea kwa mtu; “kwa Musa” ni usemi wa kawaida na wazi baada ya “akarudi.”
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye ingilio la hema la kukutania
  rationale: פֶּתַח ni ingilio au nafasi ya kuingilia. Katika muundo huu, “kwenye” huonyesha mahali Musa alipokuwa bila kurudia kwa namna isiyo ya kawaida wazo la kuelekea. “Hema la kukutania” hutoa maana ya אֹהֶל מוֹעֵד kwa uwazi.
- source_word: הַמַּגֵּפָה
  choice: tauni
  rationale: מַגֵּפָה hapa ni pigo lenye kuua lililoenea kati ya watu. “Tauni” ni neno fupi, linaloeleweka, na linalofaa katika muktadha huu.
- source_word: נֶעֱצָרָה
  choice: ikakomeshwa
  rationale: Nifali ya עצר inaonyesha kwamba tauni ilifikishwa mwisho au ilizuiwa kuendelea. Kauli tendwa inadumisha umbo la Kiebrania bila kumtaja wazi mtendaji, naye “ika-” huendeleza mfuatano wa simulizi.
theological_decisions:
- issue: Mtendaji anayeeleweka kuwa ndiye aliyeikomesha tauni
  choice: Kutumia kauli tendwa “tauni ikakomeshwa” bila kumtaja Mungu waziwazi kama mtendaji
  alternative: BWANA akaikomesha tauni
  rationale: Kiebrania kinatumia umbo la kauli tendwa na hakimtaji mtendaji katika kishazi hiki. Muktadha unaweza kuonyesha utendaji wa Mungu, lakini tafsiri haipaswi kuongeza kiima ambacho hakikutajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku kauli tendwa na utata halisi wa mtendaji vikihifadhiwa.
