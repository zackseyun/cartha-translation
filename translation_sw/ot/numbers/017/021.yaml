base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/021.yaml
  text: So Moses spoke to the sons of Israel[a], and all their leaders gave him a staff, one staff for each leader according to their fathers’ houses, twelve staffs; and Aaron’s staff was among their staffs.
translation:
  language: sw
  text: Basi Musa akawaambia wana wa Israeli[a], na viongozi wao wote wakampa fimbo, fimbo moja kwa kila kiongozi kulingana na nyumba za baba zao, fimbo kumi na mbili; na fimbo ya Haruni ilikuwa miongoni mwa fimbo zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania kinasema kihalisi “wana wa Israeli,” jina la agano linalotumiwa kwa kawaida kwa watu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Kitenzi דּבר hapa kinaonyesha Musa aliwahutubia watu; “akasema na” ni Kiswahili cha kawaida kinachofaa utangulizi wa simulizi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hifadhi ya karibu ya usemi halisi wa Kiebrania na jina la agano la taifa; tanbihi inaeleza maana ya kijumla.
- source_word: נְשִׂיאֵיהֶם
  choice: viongozi wao
  rationale: Katika muktadha huu נָשִׂיא ni viongozi wanaotambulika wa makabila; “viongozi” ni wazi na ya sasa kuliko “wakuu” au “wana wa kifalme.”
- source_word: מַטֶּה
  choice: fimbo
  rationale: Neno linaashiria fimbo halisi iliyotolewa kama ishara ya uwakilishi; “fimbo” ni neno la kawaida na linalofaa katika Kiswahili.
- source_word: מַטֶּה לְנָשִׂיא אֶחָד ... מַטֶּה לְנָשִׂיא אֶחָד
  choice: fimbo, fimbo moja kwa kila kiongozi
  rationale: 'Muundo huu unahifadhi msisitizo wa ugawaji: kila kiongozi alitoa fimbo moja.'
- source_word: לְבֵית אֲבֹתָם
  choice: kulingana na jamaa za baba zao
  rationale: Huwakilisha mpangilio wa ukoo wa upande wa baba bila kutumia usemi mgumu au usio wa kawaida wa “nyumba za baba.”
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: jumla ya fimbo kumi na mbili
  rationale: “Jumla ya” hufanya kazi ya kishazi cha muhtasari kuwa wazi kwa Kiswahili na kuhifadhi idadi iliyotajwa.
- source_word: וּמַטֵּה אַהֲרֹן בְּתוֹךְ מַטּוֹתָם
  choice: na fimbo ya Haruni ilikuwa miongoni mwa fimbo zao
  rationale: Kitenzi “ilikuwa” hukamilisha kishazi kisicho na kitenzi katika Kiebrania, na “miongoni mwa” huhifadhi maana ya בְּתוֹךְ.
