base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/020.yaml
  text: And it shall be that the staff of the man whom I choose will bud[a], and I will put an end to the complaints of the sons of Israel, which they are grumbling against you.
translation:
  language: sw
  text: Na itakuwa kwamba fimbo ya mtu nitakayemchagua itachipuka, nami nitayakomesha malalamiko ya wana wa Israeli[a] yanayonilenga, ambayo wananung’unika dhidi yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Waisraeli” au “watu wa Israeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Na itakuwa kwamba
  rationale: Huhifadhi utangulizi unaoelekeza kwenye wakati ujao, huku ukiwa wa kawaida na wenye hadhi katika Kiswahili.
- source_word: הָאִישׁ אֲשֶׁר אֶבְחַר בּוֹ
  choice: mtu nitakayemchagua
  rationale: Huwasilisha wazi uteuzi wa Mungu wa kiongozi anayewakilishwa na fimbo yake.
- source_word: מַטֵּהוּ יִפְרָח
  choice: fimbo ... itachipuka
  rationale: “Fimbo” ni neno la kawaida kwa מַטֶּה katika muktadha huu; “itachipuka” linaonyesha dalili ya kwanza ya uhai bila kutangulia habari ya kuchanua katika mstari unaofuata.
- source_word: וַהֲשִׁכֹּתִי
  choice: nami nitayakomesha
  rationale: Hiphil ya שׁכך ina maana ya kusababisha kitu kitulie au kikome; “nitayakomesha” huonyesha kusitishwa kwa malalamiko kwa uamuzi.
- source_word: מֵעָלַי
  choice: yaliyo juu yangu
  rationale: Tafsiri hii inadumisha taswira na sintaksia ya Kiebrania bila kuamua kimyakimya kama malalamiko hayo yanaelekezwa “dhidi ya” Mungu au ni mzigo ulio “juu” yake.
- source_word: תְּלֻנּוֹת בְּנֵי יִשְׂרָאֵל
  choice: malalamiko ya wana wa Israeli
  rationale: “Malalamiko” ni Kiswahili cha sasa kinachoeleweka; “wana wa Israeli” huhifadhi usemi rasmi wa kifamilia wa Kiebrania.
- source_word: אֲשֶׁר הֵם מַלִּינִם עֲלֵיכֶם
  choice: ambayo wao wananung’unika dhidi yenu
  rationale: “Wananung’unika” huonyesha tendo linaloendelea na toni hasi; “dhidi yenu” huonyesha mwelekeo wa uhasama wa עַל kwa Musa na Haruni.
theological_decisions:
- issue: Maana ya מֵעָלַי katika uhusiano na malalamiko
  choice: yaliyo juu yangu
  alternative: dhidi yangu / kuyaondoa juu yangu
  rationale: Kiebrania kinaweza kuonyesha malalamiko kama yaliyo juu ya Mungu au yanayoondolewa kutoka juu yake. Tafsiri kuu inadumisha mvutano huo badala ya kuyafanya moja kwa moja kuwa “dhidi yangu.”
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: Usemi rasmi wa ukoo umehifadhiwa, ingawa katika muktadha unawahusu Waisraeli kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa karibu na Kiebrania pale ambapo kufanya hivyo kunahifadhi utata halisi, hasa katika “yaliyo juu yangu.”
