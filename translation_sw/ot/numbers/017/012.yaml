  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר מֹשֶׁ֗ה וַ/יָּ֨רָץ֙ אֶל תּ֣וֹך הַ/קָּהָ֔ל וְ/הִנֵּ֛ה הֵחֵ֥ל הַ/נֶּ֖גֶף בָּ/עָ֑ם וַ/יִּתֵּן֙ אֶֽת הַ/קְּטֹ֔רֶת וַ/יְכַפֵּ֖ר עַל הָ/עָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/012.yaml
  text: So Aaron took it[a], just as Moses had spoken, and ran into the midst of the assembly. And behold, the plague had begun among the people[b], so he put the incense on and made atonement for the people.
translation:
  language: sw
  text: Basi Aaroni akakichukua[a] kama Musa alivyosema, akakimbia hadi katikati ya kusanyiko. Tazama, tauni ilikuwa tayari imeanza miongoni mwa watu; basi akaweka uvumba[b] na akafanya upatanisho kwa ajili ya watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, akachukua kile kilichotajwa katika mstari uliotangulia; Kiebrania kinasema tu “akachukua.”
    reason: clarification_of_implied_object
  - marker: b
    text: Au, “akautia uvumba” (katika chombo kilichotajwa katika muktadha); Kiebrania kwa neno halisi ni “akatoa/akaweka uvumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akakichukua
  rationale: Kitenzi kinamaanisha ‘akachukua.’ Kiambishi cha yambwa ‘-ki-’ kinarejelea chombo kilichotajwa katika muktadha uliotangulia, bila kuongeza jina lisilokuwamo wazi katika mstari huu.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: kama Musa alivyosema
  rationale: דבר ni ‘kusema/kunena,’ si lazima ‘kuamuru’; tafsiri hii inadumisha maana ya msingi ingawa kauli ya Musa ilikuwa agizo katika muktadha.
- source_word: וַיָּרָץ אֶל תּוֹךְ הַקָּהָל
  choice: akakimbia hadi katikati ya kusanyiko
  rationale: רוץ ni ‘kukimbia,’ תּוֹךְ ni ‘katikati,’ na קָהָל hapa ni jamii ya Israeli iliyokusanyika. ‘Kusanyiko’ ni neno la kawaida, lenye heshima, lisilofungamanishwa hasa na jengo au dhehebu.
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa namna ya ghafla na yenye uzito; ‘Tazama’ linahifadhi kazi hiyo ya kisimulizi.
- source_word: הֵחֵל הַנֶּגֶף בָּעָם
  choice: tauni ilikuwa imeanza miongoni mwa watu
  rationale: נֶגֶף katika muktadha huu ni pigo la tauni. ‘Ilikuwa imeanza’ huonyesha kuwa tayari ilikuwa imeanza Aaroni alipofika, na ‘miongoni mwa watu’ huwasilisha בָעָם kwa Kiswahili cha kawaida.
- source_word: וַיִּתֵּן אֶת הַקְּטֹרֶת
  choice: akaweka uvumba
  rationale: נתן kimsingi ni ‘kutoa/kuweka.’ ‘Akaweka uvumba’ huonyesha tendo halisi bila kulifasiri moja kwa moja kuwa ‘akatoa sadaka ya uvumba.’
- source_word: וַיְכַפֵּר עַל הָעָם
  choice: na kufanya upatanisho kwa ajili ya watu
  rationale: Katika ibada ya kikuhani כפר humaanisha kufanya upatanisho. Usemi huu unahifadhi uzito wa kiibada na wa kitheolojia bila kubainisha zaidi utaratibu wake kuliko maandishi yanavyofanya.
theological_decisions:
- issue: Tafsiri ya kitenzi cha kiibada כפר
  choice: kufanya upatanisho kwa ajili ya watu
  alternative: kufanya utakaso wa dhambi kwa ajili ya watu
  rationale: ‘Kufanya upatanisho’ ni tafsiri inayoeleweka na inayodumisha maana pana ya tendo la kikuhani la kuondoa au kuzuia hukumu, bila kulazimisha nadharia maalumu kuhusu utendaji wake.
- issue: Tafsiri ya קָהָל
  choice: kusanyiko
  alternative: mkutano
  rationale: ‘Kusanyiko’ huonyesha watu wa Israeli waliokusanyika, si tukio pekee wala jengo la ibada, na hivyo huepuka kuingiza maana ya kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa vitenzi vya ‘aka-’ unafaa simulizi; ‘Tazama’ inadumisha msisitizo wa Kiebrania. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya maneno yanayohusika.
