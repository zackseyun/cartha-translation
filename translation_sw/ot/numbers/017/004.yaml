base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/004.yaml
  text: So Eleazar the priest took the bronze censers that the burned men had offered[c][b][a], and they were hammered out as a covering for the altar.
translation:
  language: sw
  text: Basi kuhani Eleazari akavichukua vile vyetezo vya shaba[a] ambavyo watu walioteketezwa[b] walikuwa wametoa, navyo vikafuliwa kuwa bamba la kuifunika madhabahu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vyombo vya kubebea makaa ya moto.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “walioteketezwa” au “wale walioteketezwa.” Neno hili linawarejelea watu walioangamizwa kwa moto katika simulizi lililotangulia.'
    reason: lexical_alternative
  - marker: c
    text: Au, “tabaka la kuifunika” au “kifuniko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: vyetezo
  rationale: Neno hili humaanisha vyombo vya kubebea makaa yanayowaka na uvumba. “Vyetezo” ni istilahi ya kawaida na inayofaa katika muktadha wa ibada.
- source_word: הַנְּחֹשֶׁת
  choice: vya shaba
  rationale: נְחֹשֶׁת inaweza kumaanisha shaba au aloi ya shaba; “shaba” ni tafsiri ya kawaida ya Kiswahili katika muktadha wa vifaa vya Maskani na haibani isivyofaa aina kamili ya metali.
- source_word: הִקְרִיבוּ
  choice: walikuwa wametoa
  rationale: Katika muktadha wa ibada, kitenzi hiki humaanisha kutoa au kuwasilisha kama toleo. Muundo “walikuwa wametoa” unaonyesha kwamba tendo hilo lilitangulia kitendo cha Eleazari.
- source_word: הַשְּׂרֻפִים
  choice: watu walioteketezwa
  rationale: Hii ni participio ya kutendwa kutoka שׂרף, “kuchoma,” na inawarejelea watu walioteketezwa kwa moto katika simulizi lililotangulia.
- source_word: וַיְרַקְּעוּם
  choice: navyo vikafuliwa
  rationale: רקע humaanisha kufua au kugonga metali na kuitandaza. Kauli ya kutendwa ya Kiswahili inaeleza kitendo kilichofanyiwa vyetezo bila kumtaja mtendaji ambaye hatambulishwi wazi katika muktadha.
- source_word: צִפּוּי
  choice: kifuniko
  rationale: Neno hili humaanisha kitu kinachowekwa juu ya kingine kama kifuniko, tabaka, au bamba la kufunika.
- source_word: לַמִּזְבֵּחַ
  choice: cha madhabahu
  rationale: 'Herufi ל inaonyesha kusudi au matumizi: metali iliyofuliwa ilikusudiwa kuwa kifuniko cha madhabahu.'
