  yaml_path: translation/ot/numbers/017/014.yaml
  text: Those who died in the plague were fourteen thousand seven hundred[a], besides those who died on account of Korah.
translation:
  language: sw
  text: Waliokufa katika tauni hiyo walikuwa elfu kumi na nne na mia saba, mbali na wale waliokufa kwa sababu ya Kora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuhusiana na Kora” au “katika jambo la Kora.” Kirai hiki kinawarejelea wale waliokuwa wamekufa hapo awali katika matukio yaliyohusiana na uasi wa Kora.
    reason: Tofauti halali ya kimsamiati katika עַל דְּבַר קֹרַח na ufafanuzi wa rejeleo lake la kimuktadha.
lexical_decisions:
- source_word: וַיִּהְיוּ הַמֵּתִים
  choice: Waliokufa ... walikuwa
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida jumla ya waliokufa na kudumisha mwendelezo wa simulizi bila kuongeza kiashirio cha wakati kisichotajwa wazi katika Kiebrania.
- source_word: בַּמַּגֵּפָה
  choice: katika tauni hiyo
  rationale: Neno מַגֵּפָה humaanisha tauni au pigo lenye kuua; kiashirio “hiyo” kinaonyesha tauni iliyotajwa katika muktadha.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף וּשְׁבַע מֵאוֹת
  choice: elfu kumi na nne mia saba
  rationale: Hii ni njia ya kawaida na iliyo wazi ya kutaja jumla ya 14,700 kwa Kiswahili.
- source_word: מִלְּבַד
  choice: mbali na
  rationale: Kirai hiki kinaonyesha kwamba waliokufa hapo awali hawakuhesabiwa katika jumla ya 14,700.
- source_word: עַל דְּבַר קֹרַח
  choice: kwa sababu ya Kora
  rationale: Kirai hiki kinaweza kuonyesha sababu au uhusiano na jambo la Kora. Chaguo hili ni la kawaida kwa Kiswahili, huku tanbihi ikihifadhi uwezekano mpana zaidi wa maana.
theological_decisions:
- issue: Upeo wa vifo vilivyohusishwa na Kora
  choice: Mstari unatofautisha waliokufa katika tauni na wale waliokuwa wamekufa kwa sababu ya Kora.
  alternative: wale waliokufa kuhusiana na Kora; wale waliokufa katika jambo la Kora
  rationale: Kiebrania kinarejelea hukumu ya awali iliyohusiana na Kora bila kufafanua hapa makundi yote ya waliokufa. Tafsiri haiongezi maelezo yasiyomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Tauni” limetumiwa kwa tukio la mauti, na “mbali na” linaweka wazi kwamba vifo vya awali havikujumuishwa katika hesabu.
