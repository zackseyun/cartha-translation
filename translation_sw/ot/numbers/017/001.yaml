  rationale: Maana ya kuelekeza maneno kwa Musa imejumuishwa kiasili katika muundo wa kitenzi “akamwambia.”
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵּאמֹר
  choice: akisema
  rationale: Kitenzi-jina hiki hutanguliza maneno yanayofuata. “Akisema” kinahifadhi muundo wa Kiebrania na kuunganisha mstari huu na hotuba inayofuata.
theological_decisions:
