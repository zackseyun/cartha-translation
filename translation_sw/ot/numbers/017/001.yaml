- source_word: וַיְדַבֵּר
  choice: Kisha ... akamwambia
  rationale: Kiunganishi וַ kinaendeleza simulizi, hivyo “Kisha” kinaonyesha mfuatano kwa Kiswahili cha kawaida. Kitenzi דבר pamoja na אֶל kina maana ya kusema au kunena kwa mtu; “akamwambia” ni usemi wa asili wa Kiswahili katika muktadha huu.
- source_word: יְהוָה
