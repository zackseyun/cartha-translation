  source_fidelity: 'Tafsiri inafuata kwa uaminifu vipashio vya Kiebrania: amri ya kurejesha fimbo, mahali “mbele ya Ushuhuda,” kusudi la kuihifadhi kuwa ishara, usemi wenye alama “wana wa uasi,” kukomesha manung''uniko dhidi ya Yahwe, na matokeo ya kuepusha kifo. Mpangilio wa “Kwa njia hiyo ... ili wasife” unaeleza kwa Kiswahili uhusiano wa kusudi/matokeo uliomo katika kishazi cha mwisho bila kubadili maana.'
