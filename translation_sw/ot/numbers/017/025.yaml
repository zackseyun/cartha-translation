id: NUM.17.25
reference: Numbers 17:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הָשֵׁ֞ב אֶת מַטֵּ֤ה אַהֲרֹן֙ לִ/פְנֵ֣י הָ/עֵד֔וּת לְ/מִשְׁמֶ֥רֶת לְ/א֖וֹת לִ/בְנֵי מֶ֑רִי וּ/תְכַ֧ל תְּלוּנֹּתָ֛/ם מֵ/עָלַ֖/י וְ/לֹ֥א יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/025.yaml
  text: And Yahweh said to Moses, “Put Aaron’s staff back before the testimony, to be kept as a sign for the sons of rebellion, so that you may put an end to their grumblings against me, and they may not die.”
translation:
  language: sw
  text: Yahwe akamwambia Mose, “Rudisha fimbo ya Aroni mbele ya Ushuhuda[b], ili ihifadhiwe kuwa ishara kwa wana wa uasi[a]. Kwa njia hiyo utayakomesha manung’uniko yao dhidi yangu, ili wasife.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa waasi” au “kwa wana waasi.”
    reason: lexical_alternative
  - marker: b
    text: Huenda “Ushuhuda” ukamaanisha ushuhuda wa agano uliohusishwa na sanduku la agano; usemi wa Kiebrania umetafsiriwa kwa ufupi hapa.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: הָשֵׁב
  choice: Rudisha
  rationale: Hifili ya שוב inaamuru fimbo irejeshwe mahali ilipokuwa; “rudisha” ni ya kawaida na wazi katika Kiswahili.
- source_word: מַטֵּה
  choice: fimbo
  rationale: “Fimbo” ni neno la kawaida la Kiswahili kwa kifaa hiki na linafaa katika muktadha wa ishara ya kikabila na kikuhani.
- source_word: לִפְנֵי הָעֵדוּת
  choice: mbele ya Ushuhuda
  rationale: Tafsiri hii inadumisha ufupi na kutotaja moja kwa moja sanduku ambalo halimo wazi katika maneno ya Kiebrania.
- source_word: לְמִשְׁמֶרֶת
  choice: ili ihifadhiwe
  rationale: Kishazi hiki kinaonyesha kusudi la kutunzwa salama; usemi huu ni wa asili katika Kiswahili.
- source_word: לְאוֹת
  choice: kuwa ishara
  rationale: אוֹת hapa ni alama yenye kazi ya kukumbusha na kuonya; “ishara” ni neno wazi na la kawaida.
- source_word: לִבְנֵי מֶרִי
  choice: kwa wana wa uasi
  rationale: Usemi wa kifamilia wa Kiebrania, kwa maana halisi “wana wa uasi,” umehifadhiwa ili kutopoteza namna yake iliyotiwa alama; maana laini zaidi imeelezwa katika tanbihi.
- source_word: וּתְכַל
  choice: Kwa njia hiyo utayakomesha
  rationale: Hifili ya כלה hapa ina maana ya kusababisha jambo lifikie mwisho. Usemi huu unaonyesha matokeo au kusudi bila kudokeza kwamba Mose atawaangamiza watu.
- source_word: תְּלוּנֹּתָם
  choice: manung’uniko yao
  rationale: “Manung’uniko” huhifadhi wazo la kulalamika kwa kurudia-rudia katika simulizi la jangwani.
- source_word: מֵעָלַי
  choice: dhidi yangu
  rationale: Pamoja na “manung’uniko,” kirai hiki humaanisha malalamiko yanayoelekezwa dhidi ya Yahwe.
- source_word: וְלֹא יָמֻתוּ
  choice: ili wasife
  rationale: 'Hutoa kwa Kiswahili cha kawaida matokeo yaliyokusudiwa: kukoma kwa uasi na manung’uniko kunazuia kifo.'
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la Mungu lenye herufi nne, si cheo; kulitohowa kama “Yahwe” huhifadhi tofauti hiyo.
- issue: Usemi wa kifamilia לִבְנֵי מֶרִי
  choice: wana wa uasi
  alternative: waasi
  rationale: Tafsiri kuu inahifadhi sitiari yenye mvutano ya Kiebrania, huku tanbihi ikitoa maana ya kawaida bila kuifanya kuwa tafsiri pekee.
- issue: Rejeo la הָעֵדוּת katika mazingira ya hema
  choice: Ushuhuda
  alternative: sanduku la Ushuhuda
  rationale: Kiebrania kinasema “Ushuhuda” kwa ufupi. Kutaja sanduku katika maandishi kuu kungeongeza ufafanuzi unaowezekana lakini usiosemwa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku “wana wa uasi” na “Ushuhuda” vikihifadhi kwa makusudi usemi na utata wa maandishi ya Kiebrania. Alama zote za tanbihi zimewekwa katika maandishi kuu.
