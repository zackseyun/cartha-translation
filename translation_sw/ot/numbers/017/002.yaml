base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/002.yaml
  text: Tell Eleazar son of Aaron the priest to lift the censers out from among the burning[a], and scatter the fire farther away[b], for they have become holy.
translation:
  language: sw
  text: Mwambie Eleazari, mwana wa Haruni kuhani, aviinue vile vyetezo kutoka katikati ya moto, kisha autawanye moto huo mbali zaidi, kwa maana vyetezo hivyo vimekuwa vitakatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “ni vitakatifu.” Umbo la kitenzi cha Kiebrania linaweza kusisitiza hali iliyotokea: “vimekuwa vitakatifu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Mwambie
  rationale: Amri ya kitenzi אמר inaanzisha agizo ambalo Musa anapaswa kumpa Eleazari; “Mwambie” ni ya asili na huonyesha wazi mlengwa.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Eleazari mwana wa kuhani Haruni
  rationale: Muundo huu unahifadhi uhusiano wa nasaba na unaonyesha kuwa “kuhani” anamfafanua Haruni katika mnyororo wa Kiebrania, bila kukana kwamba Eleazari pia alikuwa kuhani.
- source_word: וְיָרֵם
  choice: ayainue
  rationale: Umbo la kusihi/amri linalofuata agizo la awali linaeleza jambo ambalo Eleazari aagizwe kufanya. Kiambishi cha ngeli kinakubaliana na “chetezo.”
- source_word: הַמַּחְתֹּת
  choice: chetezo
  rationale: מחתה ni vyombo vya kubebea makaa na kufukizia uvumba. “Chetezo” ni istilahi ya kawaida ya ibada katika Kiswahili na inafaa zaidi hapa kuliko maelezo marefu kama “vyombo vya makaa.”
- source_word: מִבֵּין הַשְּׂרֵפָה
  choice: kutoka katikati ya sehemu inayowaka
  rationale: שׂרפה linaweza kumaanisha mwako, eneo lililoungua, au mabaki ya moto. Tafsiri hii huhifadhi picha halisi bila kuamua kimyakimya kuwa ni mabaki yaliyoteketea tu.
- source_word: וְאֶת הָאֵשׁ זְרֵה הָלְאָה
  choice: kisha autawanye moto huo mbali zaidi
  rationale: זרה ni kutawanya, na הָלְאָה huonyesha kupeleka mbali zaidi. “Moto” huhifadhi neno la chanzo, ingawa katika mazingira haya huenda unajumuisha makaa yanayowaka.
- source_word: כִּי קָדֵשׁוּ
  choice: kwa maana chetezo hivyo vimekuwa vitakatifu
  rationale: Ukamilifu wa kitenzi unaonyesha hali iliyotokana na tendo la awali. Kutaja “chetezo” tena huondoa utata wa kisarufi wa Kiswahili huku kukifuata kirejeleo cha wingi kinachofaa zaidi.
theological_decisions:
- issue: Kirejeleo cha kitenzi cha wingi katika כִּי קָדֵשׁוּ
  choice: Kitenzi kinarejelea chetezo
  alternative: Kinaweza kueleweka kwa upana kuwa kinarejelea vitu vilivyohusishwa na sadaka, au chetezo pamoja na moto
  rationale: “Chetezo” ndicho kirejeleo cha wingi kinachofaa zaidi, na mantiki ya simulizi ni kwamba chetezo vinahifadhiwa kwa sababu vimepata hali ya utakatifu, ilhali moto unatawanywa.
- issue: Maana ya ukamilifu katika קָדֵשׁוּ
  choice: vimekuwa vitakatifu
  alternative: ni vitakatifu
  rationale: Tafsiri iliyochaguliwa huonyesha hali ya sasa iliyotokana na kuwekwa mbele za BWANA, bila kudokeza fundisho maalumu kuhusu namna ya utakaso.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. “Chetezo” limetumiwa kama neno la kawaida la chombo cha makaa/uvumba. Kielezi “kutoka katikati ya sehemu inayowaka” kimechaguliwa ili kuhifadhi uwezekano wa mwako au eneo lililoungua. Alama ya tanbihi [a] imo katika matini kuu.
