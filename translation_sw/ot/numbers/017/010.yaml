    reason: lexical_alternative
  revision_rationale: Maandishi ya aya yamehifadhiwa, kwa kuwa ni sahihi na ya asili kwa chanzo kilichotolewa. Tanbihi b imerekebishwa kwa mbadala unaowasilisha kwa usahihi zaidi wazo la tendo la hukumu kutokea kwa ghafla. Metadata ya marejeo inapaswa kubadilishwa kutoka Hesabu 17:10 hadi Hesabu 16:21, au chanzo kinacholingana na Hesabu 17:10 kitolewe kwa tafsiri tofauti.
