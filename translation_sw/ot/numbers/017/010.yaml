  source_fidelity: 'Tafsiri inafuata kwa uaminifu Kiebrania kilichotolewa: amri ya wingi ya kujiondoa miongoni mwa kusanyiko, tishio la kuwaangamiza upesi, na tendo la Musa na Haruni kuanguka kifudifudi. Hata hivyo, kuna hitilafu ya marejeo: maandishi ya Kiebrania yaliyotolewa ni Hesabu 16:21 katika WLC, si Hesabu 17:10. Hesabu 17:10 ina habari ya fimbo ya Haruni. Hili linahitaji kusahihishwa katika metadata kabla ya kuchapishwa.'
  naturalness: “Jiondoeni kutoka katikati ya kusanyiko hili” na “Nao wakaanguka kifudifudi” ni Kiswahili Sanifu, cha asili, na chenye sauti inayofaa simulizi la Biblia. “Mara moja” ni ya kawaida na inawasilisha ukaribu wa wakati unaokusudiwa na כְּרָגַע.
  terminology: “Kusanyiko,” “waangamize,” na “kifudifudi” zinafaa kwa register ya kibiblia ya Kiswahili cha Afrika Mashariki. Tanbihi ya b iboreshwe ili itoe mbadala halisi wa usemi wa wakati, badala ya ufafanuzi mpana unaoweza kudokeza muda unaoendelea.
  issues:
  - severity: high
    issue: Marejeo ya kifungu hayalingani na maandishi ya chanzo.
    rationale: Kiebrania kilichotolewa (“Hērommu mittokh ha‘edah hazzot...”) ni Hesabu 16:21 katika WLC. Hesabu 17:10 ni aya tofauti. Maandishi ya tafsiri hayawezi kuwekwa chini ya Hesabu 17:10 bila kupotosha eneo la chanzo.
  - severity: low
    issue: Tanbihi b si mbadala makini wa ‘mara moja.’
    rationale: “Kwa muda mfupi sana” inaweza kueleweka kuwa tendo huchukua muda mfupi, ilhali כְּרָגַע inaonyesha kutokea kwa hukumu katika wakati wa ghafla/sana mfupi. “Kwa ghafla” hutoa mbadala wa asili na ulio wazi zaidi katika Kiswahili.
  revised_text: “Jiondoeni kutoka katikati ya kusanyiko hili[a], ili niwaangamize mara moja[b].” Nao wakaanguka kifudifudi.
  revised_footnotes:
  - marker: a
    text: 'Tafsiri nyingine: “Inukeni kutoka katikati ya kusanyiko hili,” au “Jitengeni na kusanyiko hili.”'
    reason: lexical_alternative
