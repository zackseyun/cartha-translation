base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/010.yaml
  text: Rise up from the midst of this congregation[a], so that I may consume them in a moment[b]. And they fell on their faces.
translation:
  language: sw
  text: “Jiondoeni kutoka katikati ya kusanyiko hili[a], ili niwaangamize mara moja[b].” Nao wakaanguka kifudifudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri nyingine: “Inukeni kutoka katikati ya kusanyiko hili,” au “Jitengeni na kusanyiko hili.”'
    reason: lexical_alternative
  - marker: b
    text: Au “kwa muda mfupi sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵרֹמּוּ
  choice: Jiondoeni
  rationale: Niphal ya רום hapa ni amri ya kujitenga au kuondoka miongoni mwa kusanyiko. ‘Jiondoeni’ ni Kiswahili cha kawaida na chenye uzito kinachoonyesha maana hiyo ya kimuktadha bila kuifanya kuwa amri dhaifu.
- source_word: מִתּוֹךְ
  choice: kutoka katikati ya
  rationale: Inaonyesha kuondoka kutoka ndani ya kundi; muundo huu unafuata picha ya Kiebrania na ni wa asili katika Kiswahili.
- source_word: הָעֵדָה הַזֹּאת
  choice: kusanyiko hili
  rationale: עֵדָה humaanisha jamii ya Israeli iliyokusanyika. ‘Kusanyiko’ linadumisha maana ya kundi lililokusanyika bila kulifunga kwa matumizi ya kidini pekee.
- source_word: וַאֲכַלֶּה
  choice: ili niwaangamize
  rationale: Piel ya כלה inaweza kumaanisha kumaliza kabisa, kuangamiza, au kuteketeza. ‘Niwaangamize’ linaeleza wazi hukumu kamili inayokusudiwa na linafaa kwa Kiswahili cha sasa.
- source_word: אֹתָם
  choice: wa-
  rationale: Kiambishi cha yambwa katika ‘niwaangamize’ kinawarejelea watu wa kusanyiko.
- source_word: כְּרָגַע
  choice: mara moja
  rationale: Kirai hiki huonyesha muda mfupi mno. ‘Mara moja’ ni cha kawaida na huwasilisha uharaka huo; ‘kwa muda mfupi sana’ pia yawezekana.
- source_word: וַיִּפְּלוּ
  choice: Nao wakaanguka
  rationale: Huhifadhi mfuatano wa simulizi wa wayyiqtol na kuunganisha tendo hili na amri iliyotangulia.
- source_word: עַל פְּנֵיהֶם
  choice: kifudifudi
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha kuanguka uso ukiwa kuelekea chini, kama ishara ya kujinyenyekeza, hofu, au maombezi.
theological_decisions:
- issue: Asili ya amri ya Mungu kwa Musa na Haruni
  choice: Amri imetafsiriwa kama wito wa kujiondoa katikati ya kusanyiko kabla ya hukumu ya Mungu iliyo karibu, bila kupunguza ukali wa tishio hilo.
  alternative: “Inukeni kutoka katikati ya kusanyiko hili” au “Jitengeni na kusanyiko hili.”
  rationale: Kiebrania kina amri ya haraka inayofuatwa na kusudi la Mungu la kuwaangamiza watu upesi. ‘Jiondoeni’ huwasilisha kazi ya amri katika muktadha, huku tanbihi ikihifadhi taswira halisi zaidi ya kuinuliwa au kuinuka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Jiondoeni’ na ‘kifudifudi’ ni maneno yanayoeleweka kwa urahisi huku yakidumisha uzito wa simulizi. Muundo wa moja kwa moja umehifadhi ukali na uharaka wa kauli ya hukumu.
