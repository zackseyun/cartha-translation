source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֣ח אֶת הַ֠/מַּחְתָּה וְ/תֶן עָלֶ֨י/הָ אֵ֜שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ וְ/שִׂ֣ים קְטֹ֔רֶת וְ/הוֹלֵ֧ךְ מְהֵרָ֛ה אֶל הָ/עֵדָ֖ה וְ/כַפֵּ֣ר עֲלֵי/הֶ֑ם כִּֽי יָצָ֥א הַ/קֶּ֛צֶף מִ/לִּ/פְנֵ֥י יְהוָ֖ה הֵחֵ֥ל הַ/נָּֽגֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/011.yaml
  text: Then Moses said to Aaron[a], “Take the censer, and put fire from the altar in it, and put incense on it, and go quickly to the congregation and make atonement for them, because wrath has gone out from before Yahweh[b]; the plague has begun.”
translation:
  language: sw
  text: Kisha Musa akamwambia Haruni, “Chukua chetezo[a], utie ndani yake moto kutoka madhabahuni, uweke uvumba juu yake, halafu uende upesi kwa kusanyiko na uwafanyie upatanisho, kwa maana ghadhabu imetoka mbele za Yahwe[b]; pigo limeanza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, chombo cha kubebea makaa ya moto.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kutoka mbele za Yahwe,” yaani, kutoka katika uwepo wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתָּה
  choice: chetezo
  rationale: Ni chombo cha kikuhani cha kubebea makaa na kufukizia uvumba. ‘Chetezo’ ni istilahi ya kawaida na yenye hadhi katika Kiswahili cha Biblia.
- source_word: וְתֶן עָלֶיהָ אֵשׁ מֵעַל הַמִּזְבֵּחַ
  choice: utie ndani yake moto kutoka madhabahuni
  rationale: Kauli hii huhifadhi chanzo cha moto—madhabahuni—na kutumia ‘ndani yake’ kwa ufasaha kwa kuwa chetezo ni chombo.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa uvumba unaotumiwa katika ibada.
- source_word: וְהוֹלֵךְ מְהֵרָה
  choice: uende upesi
  rationale: Huhifadhi amri ya kwenda pamoja na hali ya haraka.
- source_word: הָעֵדָה
  choice: kusanyiko
  rationale: Hurejelea jumuiya ya Israeli kama kundi lililokusanyika, si jamii kwa maana pana tu.
- source_word: וְכַפֵּר עֲלֵיהֶם
  choice: uwafanyie upatanisho
  rationale: Huhifadhi maana ya kiibada ya כפר katika mazingira ya kikuhani bila kuingiza nadharia finyu ya kitheolojia.
- source_word: הַקֶּצֶף
  choice: ghadhabu
  rationale: Huwasilisha uzito wa hasira ya Mungu inayodhihirika kama hukumu.
- source_word: מִלִּפְנֵי יְהוָה
  choice: imetoka mbele za Yahwe
  rationale: Huhifadhi taswira ya Kiebrania ya kitu kutoka mbele au katika uwepo wa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: הֵחֵל הַנָּגֶף
  choice: pigo limeanza
  rationale: ‘Pigo’ linafaa kwa tukio hili la hukumu yenye kuua na halifungi maana kwenye aina moja maalumu ya ugonjwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya cheo.
- issue: Maana ya kiibada ya כפר
  choice: uwafanyie upatanisho
  alternative: uwaondolee hatia; uwafanyie kafara
  rationale: ‘Kufanya upatanisho’ huhifadhi wigo wa tendo la kikuhani linalokusudiwa kuzuia hukumu, bila kulazimisha maelezo mahususi ya jinsi upatanisho huo unavyofanya kazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya maandiko. ‘Halafu’ huunganisha hatua za amri kwa uwazi; istilahi za kiibada ‘chetezo,’ ‘uvumba,’ ‘madhabahu,’ na ‘upatanisho’ zimehifadhiwa kwa sababu zinaeleweka na zinafaa kwa muktadha wa kikuhani.
