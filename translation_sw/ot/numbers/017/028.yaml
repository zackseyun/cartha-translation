  text: כֹּ֣ל הַ/קָּרֵ֧ב הַ/קָּרֵ֛ב אֶל מִשְׁכַּ֥ן יְהוָ֖ה יָמ֑וּת הַ/אִ֥ם תַּ֖מְנוּ לִ/גְוֺֽעַ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/028.yaml
  text: Everyone who comes near[a], who comes near to the tabernacle of Yahweh, will die. Are we all to perish?
translation:
  language: sw
  text: Kila anayekaribia, anayekaribia maskani ya Yahwe, atakufa. Je, sisi sote tutaangamia?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, sisi sote tutakufa?” Kiebrania hapa hutumia kitenzi tofauti na kile kilichotafsiriwa “atakufa”; kirai hicho kinaweza kudokeza kufikia mwisho kwa kufa au kuangamia, badala ya kurudia tu kitenzi kilekile.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Kila
  rationale: Katika muundo huu neno hili linaonyesha mtu yeyote bila ubaguzi; “kila anayekaribia” ni Kiswahili cha kawaida na huhifadhi maana yake pana.
- source_word: הַקָּרֵב הַקָּרֵב
  choice: anayekaribia, anayekaribia
  rationale: Marudio ya kitenzi yamehifadhiwa ili kuonyesha msisitizo na hofu iliyo katika kauli ya watu.
- source_word: מִשְׁכַּן
  choice: maskani
  rationale: “Maskani” hueleza mahali pa kukaa kwa Mungu na linafaa kwa hema takatifu la jangwani bila kulifanya kuwa hema la kawaida tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetolewa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: יָמוּת
  choice: atakufa
  rationale: Hutoa kwa uwazi tokeo la kumkaribia isivyofaa maskani ya Yahwe.
- source_word: תַּמְנוּ לִגְוֹעַ
  choice: sisi sote tutaangamia
  rationale: Kirai hiki kina wazo la kufikia mwisho au kuisha kwa kufa. “Tutaangamia” huwasilisha hofu ya kuangamizwa kabisa, huku “sote” ikionyesha ukamilifu unaodokezwa na תַּמְנוּ.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; kwa hiyo “Yahwe” hulihifadhi wazi.
- issue: Nguvu ya swali la mwisho
  choice: Je, sisi sote tutaangamia?
  alternative: Je, sisi sote tutakufa?
  rationale: Kitenzi cha mwisho si kilekile na יָמוּת; tafsiri iliyochaguliwa huhifadhi wazo la kufikia mwisho kabisa bila kupunguza kauli kuwa marudio rahisi ya “kufa.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Marudio yasiyo ya kawaida ya “anayekaribia” yamehifadhiwa kwa sababu ni ya kimakusudi katika Kiebrania; alama ya tanbihi imewekwa kwenye kirai kinachohusika.
