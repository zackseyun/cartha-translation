  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: זִכָּר֞וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ֠מַעַן אֲשֶׁ֨ר לֹֽא יִקְרַ֜ב אִ֣ישׁ זָ֗ר אֲ֠שֶׁר לֹ֣א מִ/זֶּ֤רַע אַהֲרֹן֙ ה֔וּא לְ/הַקְטִ֥יר קְטֹ֖רֶת לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא יִהְיֶ֤ה כְ/קֹ֨רַח֙ וְ/כַ֣/עֲדָת֔/וֹ כַּ/אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/005.yaml
  text: as a reminder for the children of Israel[a], so that no outsider, who is not from the offspring of Aaron, may come near to burn incense before Yahweh, and so that he may not become like Korah and like his company[d][c][b], just as Yahweh spoke by the hand of Moses to him.
translation:
  language: sw
  text: Hilo liwe ukumbusho kwa Waisraeli[a], ili mtu yeyote asiye na mamlaka ya ukuhani[b], ambaye si mzao wa Haruni, asikaribie kufukiza uvumba mbele ya Yahwe, wala asiwe kama Kora na kundi lake, kama vile Yahwe alivyomwambia[d] kupitia Musa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumbukumbu.”
    reason: lexical_alternative
  - marker: b
    text: Hapa mtu asiye na mamlaka ni mtu ambaye hakuidhinishwa kufanya huduma ya kikuhani; si lazima awe mtu wa taifa jingine.
    reason: cultural_note
  - marker: c
    text: Kiebrania ni “kwa mkono wa Musa,” nahau yenye maana ya “kupitia Musa.”
    reason: lexical_alternative
  - marker: d
    text: Kiwakilishi “-mw-” katika “alivyomwambia” huenda kinamrejelea Haruni.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכָּרוֹן
  choice: ukumbusho
  rationale: Neno hili linamaanisha kitu kinachosaidia watu kukumbuka; “ukumbusho” ni la kawaida na linafaa katika muktadha huu wa onyo la kudumu.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kwa Waisraeli
  rationale: Hii ni tafsiri ya kawaida na ya asili katika Kiswahili kwa kundi zima la wana wa Israeli.
- source_word: אִישׁ זָר
  choice: mtu yeyote asiye na mamlaka ya ukuhani
  rationale: Katika muktadha wa kikuhani, זָר humaanisha mtu asiyeidhinishwa kufanya huduma hiyo, wala si lazima mtu wa taifa jingine.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: si mzao wa Haruni
  rationale: “Mzao” huwasilisha wazi uhusiano wa ukoo unaodaiwa na זֶרַע.
- source_word: יִקְרַב
  choice: asikaribie
  rationale: Huhifadhi maana ya kumkaribia Mungu au mahali pa ibada kwa kusudi la huduma ya kikuhani.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: kufukiza uvumba
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa tendo la kufanya uvumba utoe moshi katika ibada.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi maana ya mahali na uwepo wa kiibada pamoja na kulitaja jina la agano יְהוָה kama Yahwe.
- source_word: כְקֹרַח וְכַעֲדָתוֹ
  choice: kama Kora na kundi lake
  rationale: “Kundi” ni la asili katika Kiswahili na linaonyesha watu waliojiunga na Kora bila kulifanya neno kuwa dhehebu au kusanyiko rasmi.
- source_word: בְּיַד מֹשֶׁה
  choice: kupitia Musa
  rationale: Hutoa kwa Kiswahili maana ya nahau ya Kiebrania, kihalisi “kwa mkono wa Musa,” yaani Mungu alisema kwa njia ya Musa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina la agano la Mungu; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya זָר katika muktadha wa ukuhani
  choice: mtu asiye na mamlaka ya ukuhani
  alternative: mgeni
  rationale: Onyo linahusu kutokuwa na idhini ya kufanya huduma ya kikuhani, si asili ya kikabila.
- issue: Mhusika anayerejelewa na לוֹ (“yeye”)
  choice: kuacha kiwakilishi bila kumtaja mhusika waziwazi
  alternative: kumtaja Haruni moja kwa moja
  rationale: Haruni ndiye anayeelekea kurejelewa katika muktadha, lakini Kiebrania hakimtaji waziwazi hapa; tafsiri inahifadhi hali hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Hilo liwe” huweka sentensi kuwa ya asili katika Kiswahili huku ikiunganisha ukumbusho huu na jambo lililotajwa katika muktadha uliotangulia.
