base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/006.yaml
  text: But on the next day all the congregation of the sons of Israel grumbled against Moses and against Aaron[a], saying[b], “You have killed the people of Yahweh.”
translation:
  language: sw
  text: Lakini siku iliyofuata, kusanyiko lote la wana wa Israeli[a] likanung’unika dhidi ya Musa na dhidi ya Aroni, likisema, “Ninyi mmewaua watu wa Yahwe[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli”; yaani, Waisraeli au watu wa Israeli.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: YHWH; jina hili pia huandikwa “Yehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: likanung’unika
  rationale: Kitenzi לון katika simulizi za jangwani huonyesha manung’uniko ya pamoja dhidi ya viongozi. “Likanung’unika” ni Kiswahili cha sasa na hudumisha maana ya malalamiko yenye uhasama.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: kusanyiko lote la wana wa Israeli
  rationale: “Kusanyiko” linaonyesha jumuiya nzima iliyokusanyika, huku “wana wa Israeli” kikidumisha muundo wa Kiebrania בְּנֵי יִשְׂרָאֵל bila kuufanya useme wanaume pekee katika maana.
- source_word: מִמָּחֳרָת
  choice: siku iliyofuata
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi ya wakati unaofuata siku ya tukio lililotangulia.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: dhidi ya Musa na dhidi ya Aroni
  rationale: Kurudia “dhidi ya” kunadumisha urudiaji wa kihusishi עַל na mkazo wa shtaka lililoelekezwa kwa kila kiongozi.
- source_word: לֵאמֹר
  choice: likisema
  rationale: Hutambulisha maneno ya moja kwa moja kwa njia ya kawaida katika Kiswahili na kupatana na nomino ya umoja “kusanyiko.”
- source_word: אַתֶּם הֲמִתֶּם
  choice: Ninyi mmewaua
  rationale: “Ninyi” huweka wazi wingi na mkazo wa kiwakilishi, na “mmewaua” huwasilisha hali ya kusababisha kifo pamoja na uzito wa shtaka la moja kwa moja.
- source_word: עַם יְהוָה
  choice: watu wa Yahwe
  rationale: Huhifadhi uhusiano wa agano unaoonyeshwa na kirai cha Kiebrania na kulitumia jina la Mungu kama lilivyo katika chanzo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni umbo la Kiswahili linalotumiwa kwa jina la agano YHWH na hulitofautisha na cheo “Bwana.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni YHWH. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo, huku “Yehova” likibaki umbo mbadala la kimapokeo.
- issue: Usemi wa kijinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” hufuata muundo wa chanzo kwa karibu. Katika muktadha huu usemi huo unaitaja jumuiya yote ya agano, si wanaume pekee; tafsiri ya kawaida zaidi ni “Waisraeli.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia “likanung’unika” na “likisema,” huku urudiaji wa “dhidi ya” na kiwakilishi chenye mkazo “Ninyi” vikidumisha nguvu ya shtaka la Kiebrania.
