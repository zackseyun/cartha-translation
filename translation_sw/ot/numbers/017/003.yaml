  text: אֵ֡ת מַחְתּוֹת֩ הַֽ/חַטָּאִ֨ים הָ/אֵ֜לֶּה בְּ/נַפְשֹׁתָ֗/ם וְ/עָשׂ֨וּ אֹתָ֜/ם רִקֻּעֵ֤י פַחִים֙ צִפּ֣וּי לַ/מִּזְבֵּ֔חַ כִּֽי הִקְרִיבֻ֥/ם לִ/פְנֵֽי יְהוָ֖ה וַ/יִּקְדָּ֑שׁוּ וְ/יִֽהְי֥וּ לְ/א֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/003.yaml
  text: As for the censers of these men who sinned at the cost of their lives[a], let them make them into hammered plates as a covering for the altar, because they presented them before Yahweh and they became holy[e][d][c][b]; and they shall be a sign to the sons of Israel.
translation:
  language: sw
  text: Vyetezo vya watu hawa waliotenda dhambi kwa gharama ya maisha yao[a] vifuliwe kwa nyundo kuwa mabamba[b] ya kuufunika madhabahu, kwa sababu walivileta mbele za Yahwe, navyo vikawa vitakatifu[c]. Viwe ishara kwa Waisraeli[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “wenye dhambi hawa kwa maisha yao.” Yaani, dhambi yao iliwagharimu maisha yao.
    reason: lexical_alternative
  - marker: b
    text: Au “mabamba ya chuma yaliyopigwa.”
    reason: lexical_alternative
  - marker: c
    text: Au “navyo vikawekwa wakfu.” Kisarufi, vyetezo ndivyo vinavyorejelewa kwa kawaida.
    reason: lexical_alternative
  - marker: d
    text: Kwa neno kwa neno, “kwa wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: vyetezo
  rationale: Ni vyombo vilivyotumiwa kuteketezea uvumba katika simulizi hili; “vyetezo” ni neno la kawaida na lenye hadhi katika Kiswahili cha Biblia.
- source_word: הַחַטָּאִים הָאֵלֶּה בְּנַפְשֹׁתָם
  choice: watu hawa waliotenda dhambi kwa gharama ya maisha yao
  rationale: Muundo wa kitenzi unaonyesha tendo lao la dhambi, na kirai kinachofuata kinaonyesha kwamba uasi wao uliwagharimu maisha yao. Tafsiri hii ni ya asili kwa Kiswahili bila kuingiza fundisho maalumu kuhusu nafsi.
- source_word: וְעָשׂוּ אֹתָם רִקֻּעֵי פַחִים
  choice: vifuliwe kwa nyundo kuwa mabamba
  rationale: Kirai kinaeleza kufua vyuma hivyo viwe mabamba. Muundo wa kuamuru unaendelezwa kwa kauli ya kutendwa ya Kiswahili, bila kumtaja fundi ambaye Kiebrania hakumtaji wazi hapa.
- source_word: צִפּוּי לַמִּזְבֵּחַ
  choice: ya kuufunika madhabahu
  rationale: Mabamba hayo yalipaswa kuwa kifuniko au tabaka la nje la madhabahu; usemi huu unaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: כִּי הִקְרִיבֻם לִפְנֵי יְהוָה
  choice: kwa sababu walivileta mbele za Yahwe
  rationale: Kitenzi kina maana ya kuleta karibu au kutoa katika mazingira ya ibada. “Walivileta mbele za” huhifadhi maana hiyo bila kudokeza kwamba vyetezo vyenyewe vilikuwa dhabihu.
- source_word: וַיִּקְדָּשׁוּ
  choice: navyo vikawa vitakatifu
  rationale: Kitenzi cha wingi kinarejelea kwa kawaida vyetezo vilivyotajwa karibu zaidi na kinaonyesha hali takatifu iliyotokana na kuletwa mbele za Yahwe.
- source_word: וְיִהְיוּ לְאוֹת לִבְנֵי יִשְׂרָאֵל
  choice: Viwe ishara kwa Waisraeli
  rationale: Huhifadhi kazi ya vyetezo hivyo kama ishara ya kudumu; “Waisraeli” ni Kiswahili cha asili kwa usemi wa Kiebrania “wana wa Israeli.”
theological_decisions:
- issue: Kirejelea cha kauli “vikawa vitakatifu”
  choice: Vyetezo ndivyo vilivyokuwa vitakatifu baada ya kuletwa mbele za Yahwe.
  alternative: Watu walioasi ndio waliokuwa watakatifu kwa maana fulani ya kiibada.
  rationale: Nomino ya wingi iliyo karibu zaidi ni vyetezo, na mtiririko wa hoja unaeleza kwa nini vyombo hivyo vilipaswa kutumiwa tena kwa kazi takatifu badala ya matumizi ya kawaida. Tafsiri inadumisha mvutano wa kwamba vitu vilivyohusishwa na uasi vilipata hali takatifu.
- issue: Maana ya בְּנַפְשֹׁתָם
  choice: Dhambi yao iliwagharimu maisha yao.
  alternative: Walitenda dhambi dhidi ya nafsi zao, au kwa nafsi zao.
  rationale: Katika muktadha wa kifo chao, kirai kinaonyesha matokeo ya kujiangamiza ya uasi wao; hakilazimishi mgawanyo wa kiteolojia kati ya nafsi na mwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili iwe wazi kwa msomaji wa kawaida. Jina la Mungu limetolewa kama “Yahwe,” na istilahi ya ibada “vyetezo” imedumishwa kwa usahihi wa muktadha.
