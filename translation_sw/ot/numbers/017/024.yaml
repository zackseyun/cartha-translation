base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/024.yaml
  text: So Moses brought out all the staffs from before Yahweh to all the sons of Israel[a], and they saw[b], and each man took his staff.
translation:
  language: sw
  text: Basi Musa akazitoa fimbo zote kutoka mbele ya Yahweh na kuzileta kwa Waisraeli wote[a]. Nao wakaziona[b], kisha kila mtu akachukua fimbo yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa wana wote wa Israeli.” Kiebrania ni, “kwa wana wote wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakaona.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: akazitoa ... na kuzileta
  rationale: Hifili ya יצא ina maana ya kusababisha kitu kitoke, yaani ‘kutoa’ au ‘kuleta nje.’ Muundo huu wa Kiswahili unaonyesha kwamba Musa alizitoa fimbo kutoka mbele za Yahweh na kuzileta kwa watu.
- source_word: הַמַּטֹּת
  choice: fimbo zote
  rationale: Katika muktadha huu מַטֶּה ni kitu halisi kilichowekwa mbele za Yahweh; ‘fimbo’ ni neno la kawaida na wazi la Kiswahili.
- source_word: מִלִּפְנֵי יְהוָה
  choice: kutoka mbele za Yahweh
  rationale: Huhifadhi kwa karibu nahau ya mahali מִלִּפְנֵי pamoja na jina la agano יְהוָה.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: kwa wana wote wa Israeli
  rationale: Hufuata kwa karibu usemi wa Kiebrania ‘wana wa Israeli,’ huku tanbihi ikitoa tafsiri ya kawaida zaidi ya kitaifa.
- source_word: וַיִּרְאוּ
  choice: wakaziona
  rationale: ראה humaanisha kimsingi ‘kuona.’ Kiambishi cha yambwa ‘-zi-’ kinarejelea fimbo na kufanya sentensi iwe ya asili katika Kiswahili bila kuingiza wazo la kuzichunguza.
- source_word: וַיִּקְחוּ אִישׁ מַטֵּהוּ
  choice: kila mtu akachukua fimbo yake
  rationale: אִישׁ imetumiwa kwa maana ya kugawa, ‘kila mmoja/kila mtu.’ Tafsiri hii ni ya asili na huhifadhi kwamba kila mhusika alichukua fimbo yake mwenyewe.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יְהוָה; ‘Yahweh’ huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mfuatano wa vitenzi vya simulizi umeonyeshwa kwa ‘aka-/waka-’; sentensi imegawanywa kidogo ili isomeke kwa urahisi huku uhusiano wa matendo ukihifadhiwa.
