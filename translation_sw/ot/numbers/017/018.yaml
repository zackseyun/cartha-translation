  text: And you shall write Aaron’s name on the staff of Levi[a], for there shall be one staff for the head of their fathers’ house.
translation:
  language: sw
  text: Nawe utaandika jina la Aroni juu ya fimbo ya Lawi, kwa maana kutakuwa na fimbo moja kwa kila mkuu wa jamaa ya baba zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana kutakuwa na fimbo moja kwa mkuu wa jamaa ya baba zao.” Kishazi cha Kiebrania kinaweza kueleweka kwa maana ya mgawanyo, yaani, kila mkuu wa jamaa ya baba zao anawakilishwa na fimbo moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: Nawe
  rationale: Kiunganishi kinaendeleza maagizo yaliyotangulia, huku kiambishi cha yambwa אֵת hakitafsiriwi moja kwa moja.
- source_word: שֵׁם אַהֲרֹן
  choice: jina la Aroni
  rationale: Tafsiri ya kawaida na ya wazi ya jina linalopaswa kuandikwa kwenye fimbo.
- source_word: תִּכְתֹּב
  choice: utaandika
  rationale: Kauli ya Qal imperfect nafsi ya pili umoja wa kiume katika muktadha wa maagizo ina nguvu ya amri ya wakati ujao.
- source_word: עַל מַטֵּה לֵוִי
  choice: juu ya fimbo ya Lawi
  rationale: ‘Fimbo’ huhifadhi maana ya kitu halisi kinachowakilisha kabila; ‘Lawi’ ni tahajia ya kawaida ya Kiswahili ya jina hili.
- source_word: כִּי
  choice: kwa maana
  rationale: Kinaanzisha sababu ya kuandikwa kwa jina la Aroni kwenye fimbo ya Lawi.
- source_word: מַטֶּה אֶחָד
  choice: fimbo moja
  rationale: Hueleza idadi ya fimbo inayomwakilisha mkuu husika.
- source_word: לְ/רֹאשׁ
  choice: kwa kila mkuu
  rationale: רֹאשׁ hapa humaanisha kiongozi au mkuu; matumizi ya ‘kila’ yanaonyesha uwezekano wa maana ya mgawanyo katika kishazi hiki.
- source_word: בֵּית אֲבוֹתָם
  choice: jamaa ya ukoo wao
  rationale: Ni usemi wa ukoo wa upande wa baba; tafsiri hii ni ya asili katika Kiswahili na inaepuka usemi mgumu ‘nyumba ya baba zao’ huku ikihifadhi dhana ya kundi la ukoo.
