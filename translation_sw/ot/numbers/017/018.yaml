translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa agizo na maana halisi ya fimbo kama ishara ya uwakilishi zimehifadhiwa; tanbihi inaonyesha utata halisi wa kishazi cha mwisho.
