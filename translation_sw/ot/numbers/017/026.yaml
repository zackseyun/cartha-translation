  text: And Moses did just as Yahweh commanded him; so he did.
translation:
  language: sw
  text: Musa akafanya kama vile Yahwe alivyomwamuru; ndivyo alivyofanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi עשה kina maana pana ya ‘kufanya/kutenda’; katika muktadha wa kutii amri, ‘akafanya’ ni ya kawaida na huhifadhi urudiaji wa kitenzi hicho mwishoni.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Huonyesha kwamba tendo la Musa lililingana na alichoamriwa; ‘kama vile’ ni usemi wa asili wa Kiswahili unaohifadhi ulinganifu huo.
- source_word: צִוָּה
  choice: alivyomwamuru
  rationale: Kitenzi צוה huonyesha amri yenye mamlaka; ‘kuamuru’ huhifadhi uzito huo kuliko ‘kuelekeza’.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa namna ya kulitamka katika Kiswahili, badala ya kulibadili kuwa cheo kama ‘BWANA’.
- source_word: אֹתוֹ
  choice: -m- katika ‘alivyomwamuru’
  rationale: Kiambishi cha yambwa cha nafsi ya tatu umoja kinamrejelea Musa na kuwasilisha maana ya אֹתוֹ kwa Kiswahili cha asili.
- source_word: כֵּן
  choice: ndivyo
  rationale: כֵּן inarejelea na kusisitiza kauli iliyotangulia; ‘ndivyo’ hufanya hivyo kwa ufupi na kwa kawaida katika Kiswahili.
- source_word: עָשָׂה
  choice: alivyofanya
  rationale: Kurudia ‘kufanya’ huhifadhi msisitizo wa Kiebrania kwamba Musa aliitekeleza amri sawasawa.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo, na ni umbo linalofaa mfumo wa sauti wa Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Urudiaji wa ‘kufanya’ umehifadhiwa ili kuonyesha msisitizo wa andiko la Kiebrania.
