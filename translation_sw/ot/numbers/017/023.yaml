base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/023.yaml
  text: 'And it happened on the next day that Moses went into the tent of the testimony, and behold, Aaron’s staff for the house of Levi had budded: it brought forth blossoms, produced flowers, and ripened almonds.'
translation:
  language: sw
  text: Siku iliyofuata, Musa aliingia katika hema la ushuhuda[a], na tazama, fimbo ya Haruni kwa ajili ya nyumba ya Lawi[b] ilikuwa imechipua, ikatoa maua, ikachanua, na kuzaa lozi zilizoiva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hema la ushahidi.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kwa ajili ya nyumba ya Lawi,” yaani, fimbo hiyo iliwakilisha ukoo au kabila la Lawi.
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Kesho yake
  rationale: Ni usemi wa kawaida na wa sasa wa Kiswahili unaoonyesha siku iliyofuata katika simulizi.
- source_word: אֹהֶל הָעֵדוּת
  choice: hema la ushuhuda
  rationale: Huhifadhi maana ya msingi ya עֵדוּת kama ushuhuda wenye muktadha wa agano na sheria, bila kuibadili kuwa 'agano'.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi msisitizo wa ghafla unaomwelekeza msomaji kwenye muujiza ulioonekana na Musa.
- source_word: מַטֵּה
  choice: fimbo
  rationale: Ni neno la kawaida la Kiswahili kwa fimbo ya kiongozi iliyotumiwa hapa kama ishara ya ukoo wake.
- source_word: פָּרַח
  choice: ilikuwa imechipua
  rationale: Huonyesha hatua ya kwanza ya uhai na ukuaji wa fimbo kabla ya machipukizi, maua, na matunda yaliyokomaa.
- source_word: לְבֵית לֵוִי
  choice: kwa ajili ya nyumba ya Lawi
  rationale: Huhifadhi muundo wa Kiebrania huku tanbihi ikifafanua kwamba fimbo hiyo iliwakilisha ukoo au kabila la Lawi.
- source_word: וַיֹּצֵא פֶרַח
  choice: ikatoa machipukizi
  rationale: Huendeleza mlolongo wa ukuaji kwa Kiswahili cha asili na kutofautisha hatua hii na kuchanua maua kunakofuata.
- source_word: וַיָּצֵץ צִיץ
  choice: ikachanua maua
  rationale: Huwasilisha wazi hatua ya maua kufunguka baada ya kuchipua.
- source_word: וַיִּגְמֹל שְׁקֵדִים
  choice: na kuzaa lozi zilizoiva
  rationale: Kitenzi cha Kiebrania kinaonyesha kufikia ukomavu; tafsiri hii huhifadhi kilele cha muujiza, yaani kutokea kwa matunda yaliyokomaa.
