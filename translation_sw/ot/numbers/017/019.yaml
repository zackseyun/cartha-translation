  text: And you shall place them in the tent of meeting before the testimony[b][a], where I meet with you.
translation:
  language: sw
  text: Nawe utaziweka katika hema la kukutania, mbele ya Ushuhuda[a], mahali nitakapokutana nanyi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbele ya ushuhuda wa agano.” “Ushuhuda” huenda hapa unarejelea ushuhuda wa agano unaohusishwa na vibao vya mawe vilivyokuwa mahali patakatifu.
    reason: lexical_alternative
  - marker: b
    text: Au “mahali nitakapojitambulisha kwenu,” au “mahali nitakapoweka miadi ya kukutana nanyi.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנַּחְתָּם
  choice: Nawe utaziweka
  rationale: Hifili ya נוח/ניח pamoja na kiambishi cha nafsi ya tatu wingi ina maana ya kusababisha vitu hivyo viwekwe. “Utaziweka” ni ya kawaida na hudumisha nguvu ya agizo.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika hema la kukutania
  rationale: Hili ni jina la kawaida la mahali patakatifu; “hema la kukutania” linaeleza kwa uwazi kusudi la hema hilo kwa Kiswahili cha kawaida.
- source_word: לִפְנֵי הָעֵדוּת
  choice: mbele ya Ushuhuda
  rationale: לִפְנֵי ni “mbele ya,” na הָעֵדוּת ni “Ushuhuda.” Tafsiri ya moja kwa moja inadumisha uwezekano kwamba neno hilo linahusu mbao za agano, ushahidi wa agano, au kitu kinachohusishwa nazo bila kulazimisha rejeleo moja.
- source_word: אֲשֶׁר אִוָּעֵד
  choice: mahali nitakapokutana
  rationale: Nifali ya יעד katika muktadha huu inaeleza mkutano uliowekwa. “Mahali nitakapokutana” huwasilisha vizuri muundo wa mahali unaoundwa na אֲשֶׁר ... שָׁמָּה.
- source_word: לָכֶם
  choice: nanyi
  rationale: Ingawa לְ kimsingi ni “kwa/kwenu,” pamoja na יעד hapa maana ya kawaida ni kukutana na watu; “nanyi” ni Kiswahili cha asili.
- source_word: שָׁמָּה
  choice: imejumuishwa katika “mahali”
  rationale: Kielezi “huko” kimebebwa na “mahali nitakapokutana” ili kuepuka urudiaji usio wa lazima bila kupoteza maana.
theological_decisions:
- issue: Rejeleo la הָעֵדוּת (“Ushuhuda”)
  choice: Kudumisha “Ushuhuda” bila kusema wazi kuwa ni mbao au sanduku.
  alternative: “mbao za Ushuhuda”; “sanduku la Ushuhuda”; “ushahidi wa agano”
  rationale: Kiebrania hakibainishi rejeleo kikamilifu katika mstari huu. Neno la jumla linahifadhi utata halisi na uzito wa kiagano wa usemi huo.
- issue: Maana ya אִוָּעֵד
  choice: “nitakapokutana nanyi”
  alternative: “nitakapojitambulisha kwenu”; “nitakapoweka miadi ya kukutana nanyi”
  rationale: Katika muktadha wa patakatifu, maana ya msingi ni Mungu kukutana na watu wake katika mahali palipowekwa. Maana nyingine zinazowezekana zimeonyeshwa katika tanbihi bila kubadili matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hema la kukutania” ni usemi unaoeleweka na uliozoeleka katika muktadha wa Biblia. Herufi kubwa katika “Ushuhuda” inaashiria matumizi yake kama istilahi maalumu bila kufafanua rejeleo lake kupita kiasi.
