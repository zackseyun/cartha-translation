base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/013.yaml
  text: And he stood between the dead and the living, and the plague was stopped.
translation:
  language: sw
  text: Akasimama katikati ya waliokufa na walio hai, na tauni ikakomeshwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Akasimama
  rationale: Kitenzi עמד hapa kina maana ya msingi ya kusimama au kuchukua nafasi ya kusimama. “Akasimama” ni simulizi la kawaida na haliongezi wazo la ukaidi au mapambano.
- source_word: בֵּין ... וּבֵין
  choice: katikati ya ... na ...
  rationale: Muundo huu unaonyesha kuwa Haruni alikuwa mahali panapotenganisha makundi mawili. Katika Kiswahili, “katikati ya A na B” ni usemi wa kawaida wa nafasi hiyo.
- source_word: הַמֵּתִים
  choice: waliokufa
  rationale: Umbo hili linawataja watu waliokuwa wamekufa; “waliokufa” ni la moja kwa moja na linaweka wazi tofauti yao na walio hai.
- source_word: הַחַיִּים
  choice: walio hai
  rationale: Kivumishi kilichotumiwa kama nomino kinawataja wale ambao bado wanaishi. “Walio hai” ni Kiswahili cha kawaida na huhifadhi ulinganifu na “waliokufa.”
- source_word: וַתֵּעָצַר
  choice: ikakomeshwa
  rationale: Kitenzi עצר katika umbo hili kinaonyesha kuwa mwendo wa tauni ulizuiwa na kufikia kikomo. “Ikakomeshwa” huhifadhi maana ya kutendwa bila kumtaja mtendaji ambaye hatamkwi wazi katika mstari huu.
- source_word: הַמַּגֵּפָה
  choice: tauni
  rationale: מגפה hapa ni mlipuko wa mauti katika muktadha wa hukumu. “Tauni” ni neno fupi, lenye hadhi, na linaloeleweka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Asili ya מַגֵּפָה katika muktadha huu wa hukumu
  choice: tauni
  alternative: pigo; mlipuko wa ugonjwa
  rationale: Muktadha unaonyesha tukio la mauti lililotumwa kama hukumu. “Tauni” huhifadhi uzito wa tukio bila kuongeza maelezo ya kiteolojia yasiyotajwa katika mstari.
- issue: Mtendaji aliyekomeshwa tauni
  choice: 'umbo tendwa lisilomtaja mtendaji: “ikakomeshwa”'
  alternative: Mungu akaikomesha tauni; tauni ikakoma
  rationale: Kiebrania kinatumia umbo tendwa na hakimtaji mtendaji moja kwa moja. Tafsiri hiyo huhifadhi nafasi ya maana kwamba Mungu ndiye mtendaji bila kuiingiza wazi katika sentensi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi muundo wa simulizi na tofauti kali kati ya waliokufa na walio hai. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika.
