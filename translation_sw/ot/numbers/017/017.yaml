  variant: Standard East African Swahili
source:
  edition: WLC
  text: דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/קַ֣ח מֵֽ/אִתָּ֡/ם מַטֶּ֣ה מַטֶּה֩ לְ/בֵ֨ית אָ֜ב מֵ/אֵ֤ת כָּל נְשִֽׂיאֵ/הֶם֙ לְ/בֵ֣ית אֲבֹתָ֔/ם שְׁנֵ֥ים עָשָׂ֖ר מַטּ֑וֹת אִ֣ישׁ אֶת שְׁמ֔/וֹ תִּכְתֹּ֖ב עַל מַטֵּֽ/הוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/017.yaml
  text: Speak to the sons of Israel[a], and take from them one staff for each father's house, from all their leaders according to their fathers' houses, twelve staffs[b]. Each man's name you shall write on his staff.
translation:
  language: sw
  text: Waambie wana wa Israeli[a], nawe uchukue kutoka kwao fimbo moja kwa kila ukoo wa baba, kutoka kwa viongozi wao wote kwa kufuata koo za baba zao—fimbo kumi na mbili[b]. Utaandika jina la kila mmoja juu ya fimbo yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kinasema kihalisi “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania מַטֶּה linaweza kumaanisha “fimbo” na pia “kabila”; hapa linamaanisha fimbo halisi.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi nahau ya Kiebrania ‘wana wa Israeli’; ‘Waisraeli’ ni tafsiri mbadala ya kawaida zaidi.
- source_word: מַטֶּה
  choice: fimbo
  rationale: Katika muktadha huu neno linataja kitu halisi kinachoandikwa jina na ambacho baadaye kinachipua. ‘Fimbo’ ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: מַטֶּה מַטֶּה לְבֵית אָב
  choice: fimbo moja kwa kila ukoo wa baba
  rationale: ‘Moja kwa kila’ huonyesha urudiaji wa Kiebrania wenye maana ya ugawaji, huku ‘ukoo wa baba’ ukihifadhi mpangilio wa kijamii wa בית אב bila kutumia ‘nyumba ya baba’ isiyo ya kawaida katika Kiswahili cha sasa.
- source_word: נְשִׂיאֵיהֶם
  choice: viongozi wao
  rationale: Neno linawahusu wakuu wa makabila au koo; ‘viongozi’ linaeleweka kwa urahisi na halidokezi lazima cheo cha kifalme.
- source_word: לְבֵית אֲבֹתָם
  choice: kwa kufuata koo za baba zao
  rationale: Hueleza msingi wa kupanga viongozi na fimbo zao kulingana na koo zao za upande wa baba.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: fimbo kumi na mbili
  rationale: Tafsiri ya moja kwa moja inayodumisha matumizi yale yale ya ‘fimbo’ katika aya nzima.
- source_word: אִישׁ אֶת שְׁמוֹ תִּכְתֹּב
  choice: Utaandika jina la kila mmoja
  rationale: Huhifadhi maana ya ugawaji—jina moja la kila kiongozi kwenye fimbo yake—kwa mpangilio wa kawaida wa Kiswahili.
- source_word: עַל מַטֵּהוּ
  choice: juu ya fimbo yake
  rationale: Hueleza wazi kwamba jina linaandikwa kwenye fimbo inayomhusu kila mmoja.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ukoo wa baba’ umetumiwa badala ya tafsiri halisi ‘nyumba ya baba’ ili kueleza kundi la ukoo kwa njia inayoeleweka, huku muundo wa upande wa baba wa matini chanzo ukihifadhiwa.
