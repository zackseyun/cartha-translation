lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kisha ... wakaja
  rationale: Kitenzi cha wayyiqtol kutoka בוא kinaendeleza simulizi kwa tendo la wakati uliopita. Kiswahili hutumia upatanisho wa wingi kwa kiima ambatano “Musa na Haruni.” Tafsiri “wakaingia” ingekuwa mahususi kupita kiasi, kwa kuwa fungu linasema walikuja mbele ya hema, si lazima waliingia ndani.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: וְאַהֲרֹן
  choice: na Haruni
  rationale: Kiunganishi וְ kimetafsiriwa “na,” pamoja na umbo la kawaida la jina hili katika Kiswahili.
- source_word: אֶל־פְּנֵי
  choice: mbele ya
  rationale: Nahau hii, kihalisi “kwenye uso wa,” huonyesha kumkaribia mtu au kukaribia kitu na kuwa mbele yake. “Mbele ya” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Tafsiri hii huhifadhi uhusiano wa maneno ya Kiebrania na maana ya hema maalumu la patakatifu ambako mkutano ulifanyika. Herufi kubwa zinaonyesha kuwa ni jengo hilo maalumu, si hema lolote.
