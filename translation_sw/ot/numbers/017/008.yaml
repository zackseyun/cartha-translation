  text: Then Moses and Aaron came before the Tent of Meeting[a].
translation:
  language: sw
  text: Kisha Musa na Haruni wakaja mbele ya Hema la Kukutania.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “kwenye uso wa Hema la Kukutania.”
