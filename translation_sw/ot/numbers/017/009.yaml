lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Katika fomula hii ya simulizi, kitenzi דבר pamoja na אֶל humaanisha kusema au kuzungumza na mtu. “Akasema na” ni Kiswahili cha kawaida na huendeleza simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: אֶל
  choice: na
  rationale: Baada ya “akasema,” kihusishi “na” ni matumizi ya kawaida ya Kiswahili kwa anayeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi fomula ya Kiebrania inayotanguliza maneno ya moja kwa moja yatakayofuata, ingawa katika Kiswahili kuna urudiaji wa kimakusudi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana Tetragramatoni yenyewe, kwa hiyo yametumia jina “Yahwe” badala ya cheo. “Yehova” ni namna nyingine ya jadi ya kulitamka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. Muundo “akasema na Musa, akisema” umehifadhi kwa kiasi fulani fomula na urudiaji wa Kiebrania kwa kuwa mstari huu unatambulisha usemi wa moja kwa moja unaofuata.
