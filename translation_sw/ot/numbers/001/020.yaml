  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּהְי֤וּ בְנֵֽי רְאוּבֵן֙ בְּכֹ֣ר יִשְׂרָאֵ֔ל תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/020.yaml
  text: 'The sons of Reuben[a], the firstborn of Israel, by their generations, by their clans, by their fathers’ houses, according to the number of names, head by head, every male from twenty years old and upward, everyone going out to war:'
translation:
  language: sw
  text: 'Wana wa Reubeni, mzaliwa wa kwanza wa Israeli, waliorodheshwa kwa vizazi vyao, kwa koo zao na kwa nyumba za baba zao, kulingana na hesabu ya majina yao, mmoja mmoja[a]—kila mwanamume mwenye umri wa miaka ishirini au zaidi, kila aendaye vitani:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “kwa vichwa vyao” au “kwa mafuvu yao”; ni nahau inayomaanisha kwamba kila mtu alihesabiwa peke yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: waliorodheshwa
  rationale: Kitenzi hiki kinaanzisha fomula ya sensa. Katika Kiswahili, ‘walikuwa’ pekee kingeacha tungo isiyo ya kawaida; ‘waliorodheshwa’ huwasilisha kazi yake katika muktadha bila kutangulia kutoa jumla ya hesabu ya mstari unaofuata.
- source_word: בְנֵי רְאוּבֵן
  choice: Wana wa Reubeni
  rationale: Huhifadhi lugha ya nasaba ya Kiebrania na bado ni ya kawaida katika mtindo wa Biblia wa Kiswahili.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: mzaliwa wa kwanza wa Israeli
  rationale: Ni kishazi elezi kinachomtambulisha Reubeni kwa uhusiano wake na Israeli.
- source_word: תּוֹלְדֹתָם
  choice: kwa vizazi vyao
  rationale: Hueleza migawanyo ya ukoo kwa vizazi bila kudai wazi kwamba kulikuwa na kumbukumbu zilizoandikwa.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: ‘Koo’ inafaa kwa vitengo vya kijamii ndani ya kabila na inatofautishwa na nyumba za baba zinazofuata.
- source_word: לְבֵית אֲבֹתָם
  choice: kwa nyumba za baba zao
  rationale: Huhifadhi kwa uwazi istilahi ya kiukoo ya Kiebrania badala ya kuipanua kuwa familia kwa ujumla.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: kulingana na hesabu ya majina yao
  rationale: Huonyesha kwamba watu walihesabiwa kwa majina; kiwakilishi ‘yao’ huweka rejeo wazi katika Kiswahili.
- source_word: לְגֻלְגְּלֹתָם
  choice: mmoja mmoja
  rationale: Ni nahau ya asili ya Kiswahili inayoeleza kuhesabiwa kwa kila mtu binafsi; taswira halisi ya ‘vichwa/fuvu’ imehifadhiwa katika tanbihi.
- source_word: כָּל זָכָר
  choice: kila mwanamume
  rationale: Katika muktadha wa watu wenye umri wa kwenda vitani, ‘mwanamume’ ni ya asili na huonyesha jinsia inayokusudiwa.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mwenye umri wa miaka ishirini au zaidi
  rationale: Ni Kiswahili cha sasa na cha wazi kwa kiwango cha umri kinachotajwa.
- source_word: כֹּל יֹצֵא צָבָא
  choice: kila aliyeenda vitani
  rationale: Hufuata kwa karibu kishazi cha Kiebrania ‘kila atokaye kwenda jeshini/vitani’ bila kuongeza dhana ya uwezo au ustahili ambayo haijasemwa wazi.
theological_decisions:
- issue: Iwapo יֹצֵא צָבָא inamaanisha kwenda vitani kihalisi au kustahili huduma ya kijeshi
  choice: kila aliyeenda vitani
  alternative: kila aliyefaa kwa huduma ya kijeshi
  rationale: Tafsiri imehifadhi usemi tendaji wa Kiebrania na haijaamua kimyakimya kwamba maana yake ni uwezo au ustahili tu, ingawa muktadha wa sensa unaelekea kwenye uandikishaji wa kijeshi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa sasa. Muundo wa sensa umefanywa kuwa wa kawaida kwa kutumia ‘waliorodheshwa,’ huku mpangilio wa vikundi vya ukoo na alama ya mkato kabla ya sifa za waliohesabiwa vikihifadhiwa. Alama ya koloni mwishoni inaunganisha mstari huu na jumla ya hesabu inayofuata.
