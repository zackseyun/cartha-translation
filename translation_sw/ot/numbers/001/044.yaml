  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Sentensi imegawanywa mara mbili ili kuonyesha kwa uwazi kwamba viongozi walishiriki katika kuhesabu na kwamba walikuwa wanaume kumi na wawili, mmoja kwa kila jamaa ya ukoo.
