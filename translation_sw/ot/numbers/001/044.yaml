base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/044.yaml
  text: These are the ones counted[a], whom Moses and Aaron counted, and the leaders of Israel—twelve men[b], each one for his fathers’ house—were with them.
translation:
  language: sw
  text: Hawa ndio waliohesabiwa[a] na Musa, Aroni, na viongozi wa Israeli. Viongozi hao walikuwa wanaume kumi na wawili, kila mmoja kwa ajili ya nyumba ya baba zake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walioandikishwa katika sensa.” Kiebrania kinaweza kukazia ama watu waliohesabiwa ama uandikishaji wao katika sensa.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya baba zake” inamaanisha nyumba au kitengo cha ukoo wa upande wa baba katika muundo wa makabila ya Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: הַפְּקֻדִים
  choice: waliohesabiwa
  rationale: Kivumishi-tendaji cha kupokea kutoka פקד katika muktadha wa sensa kinarejelea watu walioingizwa katika hesabu, si jumla ya hesabu pekee.
- source_word: פָּקַד
  choice: hesabiwa
  rationale: Katika Hesabu 1 kitenzi hiki kinamaanisha kufanya sensa au kuandikisha kwa kuhesabu; ‘hesabiwa’ ni Kiswahili cha kawaida na wazi katika muktadha huu.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: viongozi wa Israeli
  rationale: Neno נָשִׂיא hapa linamaanisha viongozi wa makabila; ‘viongozi’ huepuka dhana isiyofaa ya wafalme au wana wa kifalme.
- source_word: שְׁנֵים עָשָׂר אִישׁ
  choice: wanaume kumi na wawili
  rationale: Kiebrania kinatumia waziwazi אִישׁ katika umbo la kiume, kwa hiyo jinsia ya watu hao imehifadhiwa.
- source_word: אִישׁ אֶחָד
  choice: kila mmoja
  rationale: Usemi huu una nguvu ya mgawanyo—mmoja mmoja—na ‘kila mmoja’ ni wa asili katika Kiswahili.
- source_word: לְבֵית אֲבֹתָיו
  choice: kwa ajili ya jamaa ya ukoo wa baba zake
  rationale: Usemi huu unarejelea kitengo cha kijamaa kinachofuata ukoo wa upande wa baba; ‘jamaa ya ukoo’ huwasilisha maana hiyo bila kuifanya kuwa nyumba halisi.
- source_word: הָיוּ
  choice: walikuwa
  rationale: Kitenzi cha kuwapo kimeonyeshwa wazi katika sentensi ya pili na kinawaunganisha viongozi hao na idadi na nafasi yao ya kijamaa.
