base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/049.yaml
  text: Only the tribe of Levi you shall not count[a], and you shall not take their number among the sons of Israel.
translation:
  language: sw
  text: Isipokuwa kabila la Lawi usilihesabu, wala usihesabu idadi yao miongoni mwa wana wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Katika muktadha huu neno hili linaweka kabila la Lawi kuwa tofauti na maagizo yaliyotangulia; ‘Lakini’ huleta tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: מַטֵּה לֵוִי
  choice: kabila la Lawi
  rationale: Katika muktadha wa sensa, מַטֶּה humaanisha kabila, si fimbo.
- source_word: תִפְקֹד
  choice: usilihesabu
  rationale: Kitenzi פקד hapa kinahusu kuwahesabu watu katika sensa; kiambishi ‘li’ kinarejelea kabila la Lawi.
- source_word: וְאֶת רֹאשָׁם לֹא תִשָּׂא
  choice: wala usifanye sensa yao
  rationale: Kirai cha Kiebrania, ambacho kwa karibu kinahusu ‘kuinua jumla ya vichwa vyao,’ ni nahau ya kuwahesabu katika sensa. Tafsiri hii inaeleza maana yake kwa Kiswahili cha asili huku ikitofautisha kwa kiasi na ‘usilihesabu’.
- source_word: בְּתוֹךְ
  choice: pamoja na
  rationale: Hapa neno linaonyesha kutowajumuisha Walawi ndani ya kundi kubwa linalohesabiwa; ‘pamoja na’ ni ya kawaida katika muktadha huu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania ‘wana wa Israeli,’ ambao ni jina la kawaida la taifa katika muktadha huu.
theological_decisions:
- issue: Jina la agano lenye umbo la kiume בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watoto wa Israeli
  rationale: Kiebrania kinasema kihalisi ‘wana wa Israeli’ na hutumia kirai hicho kulitaja taifa. Tafsiri hii huhifadhi umbo la chanzo bila kulifanya kuwa lisilo na jinsia, huku tanbihi ikionyesha namna nyingine za kawaida za kusema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Sensa’ ni neno linaloeleweka kwa urahisi na linafaa kwa muktadha wa kuhesabu taifa; muundo wa amri katika umoja unamwelekea Musa.
