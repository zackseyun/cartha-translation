base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/018.yaml
  text: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
translation:
  language: sw
  text: Wakakusanya jumuiya yote siku ya kwanza ya mwezi wa pili. Watu wakajiorodhesha[a] kwa koo zao na kwa nyumba za baba zao, kwa hesabu ya majina, kuanzia umri wa miaka ishirini na zaidi, mmoja mmoja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakathibitisha nasaba zao” au “wakajiorodhesha kwa nasaba.” Kitenzi cha Kiebrania ni usemi adimu wa kinasaba unaoonyesha kujisajili kwa msingi wa ukoo.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa vichwa vyao” au “kwa mafuvu yao”; ni nahau inayomaanisha kwamba kila mtu alihesabiwa peke yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְהִילוּ
  choice: wakaikusanya
  rationale: Hifili ya קהל ina maana ya kusababisha watu wakusanyike; “wakaikusanya” ni ya kawaida na inaonyesha kwamba jumuiya yote iliitishwa pamoja.
- source_word: כָּל הָעֵדָה
  choice: jumuiya yote
  rationale: עֵדָה hapa ni jamii nzima ya Israeli ikiwa kundi lililokusanyika; “jumuiya yote” ni lugha ya sasa na huhifadhi maana ya pamoja.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: siku ya kwanza ya mwezi wa pili
  rationale: Huu ni usemi wa kalenda wa Kiebrania unaomaanisha siku ya kwanza ya mwezi wa pili.
- source_word: וַיִּתְיַלְדוּ
  choice: wakajiandikisha
  rationale: Hitpaeli hii adimu ya ילד inahusu kuorodheshwa au kuthibitisha nasaba. “Wakajiandikisha” huwasilisha tendo la sensa, huku maneno yanayofuata yakionyesha kwamba usajili ulitegemea ukoo.
- source_word: עַל מִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Katika mpangilio wa kikabila na sensa, מִשְׁפָּחָה ni kikundi cha kindugu cha kiwango cha ukoo; “koo” ni sahihi na wazi.
- source_word: לְבֵית אֲבֹתָם
  choice: kwa nyumba za baba zao
  rationale: Huu ni usemi maalumu wa mpangilio wa kindugu wa Israeli. Tafsiri hii huhifadhi picha na muundo wa Kiebrania bila kuufanya kuwa “familia” kwa jumla.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: kwa hesabu ya majina yao
  rationale: Usemi huu unaonyesha kwamba watu walihesabiwa kama watu binafsi waliotajwa kwa majina.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: kuanzia wenye umri wa miaka ishirini na zaidi
  rationale: Hii ni namna ya asili ya Kiswahili ya kueleza kiwango cha umri kinachoanzia miaka ishirini.
- source_word: לְגֻלְגְּלֹתָם
  choice: mmoja mmoja
  rationale: Neno hilo kihalisi linahusu vichwa au mafuvu, lakini hapa ni nahau ya kuhesabu kila mtu binafsi. “Mmoja mmoja” huwasilisha maana hiyo wazi; picha halisi imehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zimetumiwa ili kuepuka msururu mzito bila kubadili uhusiano wa matendo. “Nyumba za baba zao” imehifadhiwa kama istilahi ya kindugu ya maandishi, nayo maana yake inabaki tofauti na “koo zao.” Alama za tanbihi zimewekwa kwenye maneno yanayohusika, badala ya kufuata uwekaji uliopotoka katika safu ya mashauriano ya Kiingereza.
