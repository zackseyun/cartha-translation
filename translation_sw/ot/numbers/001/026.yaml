  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לִ/בְנֵ֣י יְהוּדָ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/026.yaml
  text: 'For the sons of Judah[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male going out to war:'
translation:
  language: sw
  text: 'Kwa wana wa Yuda, kwa vizazi vyao, kwa koo zao, kwa nyumba za baba zao, kwa hesabu ya majina, kuanzia wenye umri wa miaka ishirini na kuendelea, kila mwanamume anayeenda vitani[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila aliyestahili kwenda vitani.” Nahau ya Kiebrania inawahusu waliokuwa na sifa za kutumikia jeshini.
    reason: Nahau ya Kiebrania inaweza kutafsiriwa kwa kufuata maneno yake au kwa kueleza maana yake ya kustahili huduma ya kijeshi.
lexical_decisions:
- source_word: לִבְנֵי יְהוּדָה
  choice: Kwa wana wa Yuda
  rationale: Neno בני kimsingi ni ‘wana wa’; katika sensa hii linamaanisha wanaume wa kabila waliotokana na Yuda. ‘Kwa’ linaendeleza muundo wa orodha ya kifungu kilichotangulia.
- source_word: תּוֹלְדֹתָם
  choice: kwa vizazi vyao
  rationale: תולדות linaweza kumaanisha vizazi, ukoo, au taarifa za nasaba. Tafsiri hii inadumisha muundo wa Kiebrania bila kudai kwamba kumbukumbu zilikuwa hati zilizoandikwa.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: משפחה katika mpangilio wa kikabila ni kundi la ukoo lililo chini ya kabila; ‘koo’ ni sahihi kuliko ‘familia’ kwa kitengo hiki cha kijamii.
- source_word: לְבֵית אֲבֹתָם
  choice: kwa nyumba za baba zao
  rationale: Usemi huu kwa maana halisi ni ‘nyumba ya baba zao’ na unataja makundi ya kifamilia yaliyopangwa kwa nasaba ya upande wa baba. Muundo wa chanzo umehifadhiwa.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: kwa hesabu ya majina
  rationale: Usemi huu unaonyesha kwamba watu walihesabiwa mmoja mmoja kwa majina; tafsiri inadumisha ukaribu na muundo wa chanzo.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: kuanzia wenye umri wa miaka ishirini na kuendelea
  rationale: Huu ni usemi wa kuweka kiwango cha chini cha umri katika sensa. Tafsiri ni ya kawaida katika Kiswahili na inahifadhi maana kamili.
- source_word: כֹּל יֹצֵא צָבָא
  choice: kila mwanamume anayeenda vitani
  rationale: Kwa maana ya karibu, usemi huu ni ‘kila aendaye vitani/jeshini.’ Muktadha wa sensa unaonyesha wanaume wa umri wa huduma ya kijeshi; ‘anayeenda’ huepuka kuongeza moja kwa moja neno ‘anayefaa,’ huku tanbihi ikieleza maana ya nahau.
theological_decisions:
- issue: Lugha ya kijinsia katika sensa
  choice: kila mwanamume anayeenda vitani
  alternative: kila anayeenda vitani
  rationale: Muundo wa Kiebrania ni wa kiume, na muktadha unahusu wanaume wenye umri wa kuingia katika huduma ya kijeshi. Kutaja ‘mwanamume’ kunazuia kufifisha upeo wa sensa.
- issue: Maana ya nahau ya huduma ya kijeshi
  choice: anayeenda vitani
  alternative: anayestahili kwenda vitani
  rationale: Tafsiri kuu inadumisha picha halisi ya mtu ‘aendaye’ vitani bila kuongeza wazi dhana ya uwezo au ustahili. Tanbihi inaeleza maana inayokusudiwa katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na wa kifomula unaofaa orodha ya sensa. Marudio ya ‘kwa’ yamehifadhiwa ili kuakisi mpangilio wa makundi katika Kiebrania; ‘nyumba za baba zao’ ni usemi wa kimakusudi unaohifadhi kitengo cha nasaba ya upande wa baba.
