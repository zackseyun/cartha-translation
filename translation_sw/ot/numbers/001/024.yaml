  text: לִ/בְנֵ֣י גָ֔ד תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/024.yaml
  text: 'For the sons of Gad[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[c][b], every man able to go out to war:'
translation:
  language: sw
  text: 'Kwa wana wa Gadi[a], kwa vizazi vyao, kwa koo zao[b], kwa nyumba za baba zao, kulingana na idadi ya majina, kuanzia wenye umri wa miaka ishirini na zaidi, kila mwanamume anayeweza kwenda vitani[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “wana wa Gadi.” Msemo huu unawahusu wanaume wa kabila la Gadi waliohesabiwa katika sensa.
    reason: cultural_note
  - marker: b
    text: Au “kwa jamaa zao.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kila mmoja anayetoka kwenda vitani”; yaweza pia kumaanisha kila mmoja anayeenda kufanya huduma ya kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גָד
  choice: Kwa wazao wa Gadi
  rationale: Kiambishi לְ kinaanzisha sehemu ya kabila katika orodha ya sensa. Ingawa Kiebrania kinasema kihalisi ‘wana wa Gadi,’ hapa msemo huo unawahusu wanaume wa kabila lake wanaohesabiwa; ‘wazao wa Gadi’ ni wazi na wa kawaida katika Kiswahili.
- source_word: תּוֹלְדֹתָם
  choice: kwa vizazi vyao
  rationale: Neno hili linaonyesha mgawanyo kwa nasaba au ukoo katika muktadha wa sensa. ‘Kwa vizazi vyao’ huhifadhi mtindo wa orodha bila kudai kwamba yalikuwa maandishi ya nasaba.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: ‘Koo’ linaonyesha makundi ya undugu ndani ya kabila kwa usahihi zaidi kuliko ‘familia,’ ambalo katika matumizi ya sasa mara nyingi humaanisha kaya ndogo.
- source_word: לְבֵית אֲבֹתָם
  choice: kwa nyumba za baba zao
  rationale: Huu ni msemo maalumu wa kijamii unaotaja vikundi vya ukoo vilivyopangwa kwa nasaba ya baba. Tafsiri hii huhifadhi muundo wa Kiebrania na mfumo wake wa kijamii.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: kulingana na idadi ya majina
  rationale: Msemo unahusu kuhesabiwa kwa majina ya watu mmoja mmoja; tafsiri hii ni ya karibu na chanzo na inaeleweka katika muktadha wa sensa.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: kuanzia wenye umri wa miaka ishirini na zaidi
  rationale: Hii ni fomula ya kiwango cha chini cha umri katika sensa. Kiswahili hiki ni cha kawaida na huepuka kunakili kihalisi nahau ya Kiebrania ‘mwana wa miaka ishirini.’
- source_word: כֹּל יֹצֵא צָבָא
  choice: kila mmoja aliyeenda vitani
  rationale: Kihalisi ni ‘kila mmoja anayetoka kwenda jeshi/vitani.’ Tafsiri hii huhifadhi usemi wa Kiebrania bila kuongeza moja kwa moja dhana ya uwezo au ustahiki, huku tanbihi ikionyesha maana nyingine inayowezekana katika muktadha wa huduma ya kijeshi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kifungu umehifadhi mtindo wa orodha ya sensa na koloni mwishoni, kwa kuwa sentensi inaendelea katika mstari unaofuata. ‘Nyumba za baba zao’ limehifadhiwa kama istilahi ya nasaba, na ‘aliyeenda vitani’ limechaguliwa ili kutofuta utata wa יֹצֵא צָבָא.
