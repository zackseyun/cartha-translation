base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/054.yaml
  text: So the sons of Israel did according to all that Yahweh had commanded Moses[a]; so they did.
translation:
  language: sw
  text: Basi wana wa Israeli[a] wakafanya sawasawa na yote ambayo Yahwe alikuwa amemwamuru Musa; ndivyo walivyofanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania kihalisi ni “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: wakafanya
  rationale: Kitenzi עשה kina maana pana ya ‘kufanya.’ ‘Wakafanya’ ni cha asili katika Kiswahili na kinaendeleza mtiririko wa simulizi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa ukaribu muundo wa Kiebrania ‘wana wa Israeli.’ Katika Kiswahili, ‘wana’ pia linaweza kutaja wazao au watu wa kundi hilo, bila kulazimisha kwamba wanaume pekee ndio wanaokusudiwa.
- source_word: כְּכֹל אֲשֶׁר
  choice: kulingana na mambo yote ambayo
  rationale: Kauli hii inaonyesha kwamba matendo yao yalipatana kikamilifu na maagizo yote. Neno ‘mambo’ limeongezwa ili sentensi iwe wazi na ya asili katika Kiswahili.
- source_word: צִוָּה
  choice: alikuwa amemwamuru
  rationale: Muundo huu unaonyesha kuwa amri ya Yahwe ilitangulia utekelezaji wa Waisraeli.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina la kibinafsi lililo katika matini.
- source_word: אֶת מֹשֶׁה
  choice: Musa
  rationale: Musa ndiye mtendewa wa kitenzi ‘amemwamuru’; kiambishi ‘-m-’ katika kitenzi kinaonyesha uhusiano huo kwa Kiswahili cha asili.
- source_word: כֵּן
  choice: ndivyo
  rationale: ‘Ndivyo’ linasisitiza kwamba walifanya kwa namna ileile waliyoamriwa na linaunganisha vizuri na kitenzi cha mwisho.
- source_word: עָשׂוּ
  choice: walivyofanya
  rationale: Huhifadhi urudiaji wa kitenzi עשה na mkazo wa mwisho wa sentensi ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Matini ina jina la agano יהוה moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: ‘Wana wa Israeli’ hufuata kwa karibu muundo wa chanzo huku katika matumizi ya Kiswahili ikiweza kumaanisha wazao au taifa la Israeli kwa ujumla. Tanbihi inatoa tafsiri ya kawaida zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa mwisho umehifadhiwa kwa sababu unasisitiza utiifu kamili kama katika Kiebrania.
