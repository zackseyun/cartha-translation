  text: And with you there shall be a man from each tribe[a], each man the head of his fathers’ house.
translation:
  language: sw
  text: Na pamoja nanyi watakuwa watu, mmoja kutoka kila kabila; kila mmoja atakuwa mkuu wa nyumba ya baba zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkuu wa jamaa ya mababu zake.” Kiebrania husema kihalisi “mkuu wa nyumba ya baba zake,” ikimaanisha mwakilishi mkuu wa jamaa au ukoo unaofuatwa kwa nasaba ya baba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִתְּ/כֶם
  choice: Na pamoja nanyi
  rationale: Kirai hiki kinaonyesha kwamba wawakilishi hao wataandamana na Musa na Haruni; ‘pamoja nanyi’ ni Kiswahili cha kawaida na chenye heshima.
- source_word: יִהְיוּ
  choice: atakuwa
  rationale: Kauli ya wakati ujao inaonyesha kuwapo kwa mwakilishi anayetakiwa katika kila kabila; umoja unapatana na muundo wa kugawa ‘mtu mmoja kutoka kila kabila.’
- source_word: אִישׁ אִישׁ
  choice: mtu mmoja kutoka kila
  rationale: 'Urudiaji wa אִישׁ una maana ya mgawanyo: mwakilishi mmoja kwa kila kabila. Kiswahili huieleza kwa kawaida kwa ‘mtu mmoja kutoka kila.’'
- source_word: לַמַּטֶּה
  choice: kabila
  rationale: Katika muktadha wa sensa na mpangilio wa Israeli, מַטֶּה humaanisha kitengo cha kikabila, wala si fimbo halisi.
- source_word: אִישׁ רֹאשׁ
  choice: kila mmoja akiwa mkuu
  rationale: Hufafanua kila mwakilishi kuwa kiongozi wa kundi lake; ‘mkuu’ huhifadhi wazo la cheo lililomo katika רֹאשׁ bila kuwa tafsiri ngumu.
- source_word: לְבֵית אֲבֹתָיו
  choice: wa jamaa ya mababu zake
  rationale: Kirai hiki kinahusu ukoo au jamaa inayohesabiwa kwa nasaba ya baba. ‘Jamaa ya mababu zake’ ni wazi kwa wasomaji wa sasa na huhifadhi muundo huo wa kijamii.
- source_word: הוּא
  choice: akiwa
  rationale: Kiwakilishi cha Kiebrania kina nguvu ya kusisitiza au kurejelea; katika Kiswahili maana yake inaunganishwa kwa kawaida katika ‘akiwa mkuu.’
