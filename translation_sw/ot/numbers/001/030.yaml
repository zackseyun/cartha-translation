base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: sw
  text: 'Kwa wana wa Zabuloni, kwa vizazi vyao, kwa koo zao, kwa nyumba za baba zao, kwa hesabu ya majina, kila mwanamume mwenye umri wa miaka ishirini na kuendelea, awezaye kwenda vitani[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila mwanamume anayefaa kwa huduma ya kijeshi.” Nahau ya Kiebrania, kwa tafsiri ya karibu, ni “kila anayekwenda vitani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי זְבוּלֻן
  choice: Kwa wana wa Zabuloni
  rationale: Kiambishi ל kinaanzisha kichwa cha kabila katika mtindo wa sensa. “Wana wa Zabuloni” huhifadhi lugha ya ukoo, na “Zabuloni” ni umbo la kawaida la jina hilo katika Kiswahili.
- source_word: תּוֹלְדֹתָם
  choice: kwa kufuata vizazi vyao
  rationale: Neno hili linahusu mpangilio wa nasaba au vizazi katika sensa; “kwa kufuata” linaonyesha kwamba watu waliorodheshwa kulingana na makundi hayo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: koo zao
  rationale: “Koo” linafaa kwa makundi mapana ya jamaa ndani ya kabila kuliko “familia,” ambalo mara nyingi humaanisha kaya ndogo katika Kiswahili cha sasa.
- source_word: לְבֵית אֲבֹתָם
  choice: nyumba za baba zao
  rationale: Huu ni usemi maalumu wa ukoo. Tafsiri ya karibu “nyumba za baba zao” huhifadhi muundo na mtazamo wa nasaba ya upande wa baba bila kuufafanua kupita kiasi.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: kulingana na hesabu ya majina
  rationale: Huhifadhi picha ya kuhesabu watu mmoja mmoja kwa majina, badala ya kuibadili kuwa neno la jumla kama “idadi ya watu.”
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: kuanzia wenye umri wa miaka ishirini na zaidi
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili unaowasilisha kikomo cha umri kilicho katika Kiebrania.
- source_word: כֹּל יֹצֵא צָבָא
  choice: kila aliyeweza kwenda vitani
  rationale: Katika muktadha wa sensa, nahau hii inawahusu waliostahili kushiriki katika jeshi. “Kwenda vitani” huhifadhi taswira ya nahau ya Kiebrania, huku “aliyeweza” ikiwasilisha maana yake ya kustahili huduma hiyo.
theological_decisions:
- issue: Lugha ya kijinsia katika sensa ya kijeshi
  choice: kila aliyeweza kwenda vitani
  alternative: kila mwanamume aliyefaa kwa huduma ya kijeshi
  rationale: Muktadha wa “wana” wenye umri wa miaka ishirini na zaidi unaonyesha kuwa sensa hii ni ya wanaume wa kijeshi. Kiswahili hakihitaji kuongeza nomino “mwanamume” katika kifungu hiki; hivyo tafsiri haibadili wigo wa muktadha wala kuingiza neno lisilotajwa moja kwa moja katika kifungu cha Kiebrania.
translation_notes:
  register: Lugha ni rasmi lakini ya kawaida katika Kiswahili Sanifu cha Afrika Mashariki. Muundo wa kurudia wa sensa umehifadhiwa, huku viunganishi vichache vikitumiwa ili sentensi isomeke kwa urahisi. Alama ya tanbihi imewekwa baada ya kifungu cha kijeshi kinachoelezwa.
