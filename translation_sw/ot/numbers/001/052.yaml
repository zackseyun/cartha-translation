  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/חָנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל אִ֧ישׁ עַֽל מַחֲנֵ֛/הוּ וְ/אִ֥ישׁ עַל דִּגְל֖/וֹ לְ/צִבְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/052.yaml
  text: The sons of Israel shall camp[a], each man by his camp and each man by his banner, according to their divisions.
translation:
  language: sw
  text: Wanaisraeli watapiga kambi[a], kila mwanamume katika kambi yake na kila mwanamume chini ya bendera yake, kwa kufuata vikosi vyao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wana wa Israeli watapiga kambi, kila mmoja katika kambi yake na kila mmoja chini ya alama yake, kwa kufuata makundi yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנוּ
  choice: watapiga kambi
  rationale: Katika muktadha huu wa maagizo, umbo hili lina maana ya wakati ujao yenye nguvu ya agizo. ‘Watapiga kambi’ ni Kiswahili cha kawaida na chenye heshima.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Wanaisraeli
  rationale: Ingawa maana halisi ni ‘wana wa Israeli,’ ‘Wanaisraeli’ ni usemi wa kawaida wa Kiswahili unaotaja taifa bila kuzua maana ya watoto wa umri mdogo.
- source_word: אִישׁ ... וְאִישׁ
  choice: kila mwanamume ... na kila mwanamume
  rationale: Huhifadhi urudiaji wa distributivu na umbo la kiume la nomino ya Kiebrania.
- source_word: עַל מַחֲנֵהוּ
  choice: katika kambi yake
  rationale: Kiunganishi עַל hapa kinaonyesha mahali au uhusiano wa mtu na kundi lake la kambi; ‘katika’ ni ya asili katika Kiswahili na haibainishi kupita kiasi umbali wa mahali.
- source_word: דִּגְלוֹ
  choice: chini ya bendera yake
  rationale: דֶּגֶל ni bendera au alama ya kikundi cha kikabila/kijeshi. Katika Kiswahili, ‘chini ya bendera’ hueleza kwa kawaida kujipanga kwa kufuata alama hiyo.
- source_word: לְצִבְאֹתָם
  choice: kwa kufuata vikosi vyao
  rationale: צָבָא hapa hudokeza makundi yaliyopangwa kwa utaratibu wa kijeshi. ‘Vikosi’ huhifadhi maana hiyo bila kudai kwamba mapigano yanaendelea.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inatumia ‘Wanaisraeli’ kwa uasilia, lakini tanbihi huhifadhi usemi halisi zaidi ‘Wana wa Israeli.’ Urudiaji wa ‘kila mwanamume’ umehifadhiwa ili kuonyesha msisitizo wa Kiebrania.
