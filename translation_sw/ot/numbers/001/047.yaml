  text: But the Levites, by their ancestral tribe, were not counted among them.
translation:
  language: sw
  text: Lakini Walawi, kwa kabila la baba zao[a], hawakuhesabiwa[b] miongoni mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na kabila la mababu zao.”
