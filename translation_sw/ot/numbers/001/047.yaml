lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Lakini Walawi
  rationale: 'Kiunganishi וְ kinaonyesha utofautishaji katika muktadha huu: makabila mengine yalikuwa yamehesabiwa, lakini Walawi hawakuhesabiwa pamoja nayo. “Walawi” ndilo jina la kawaida la wazao wa Lawi.'
- source_word: לְמַטֵּה אֲבֹתָם
  choice: kwa kabila la baba zao
  rationale: מַטֶּה katika muktadha wa sensa humaanisha “kabila,” na אֲבֹתָם hudokeza nasaba ya baba au ya mababu. Tafsiri hii inafuata kwa karibu muundo wa Kiebrania bila kuondoa maana ya ukoo wa vizazi.
- source_word: לֹא הָתְפָּקְדוּ
  choice: hawakuhesabiwa
  rationale: Katika sensa hii, kitenzi cha Kiebrania kinamaanisha kuandikishwa au kuingizwa katika hesabu rasmi. “Hawakuhesabiwa” ni Kiswahili cha kawaida na sahihi katika muktadha.
- source_word: בְּתוֹכָם
  choice: miongoni mwao
  rationale: Kirai hiki kinaonyesha kwamba Walawi hawakujumuishwa katika kundi la makabila mengine lililohesabiwa.
