  text: אֵ֚לֶּה קריאי הָ/עֵדָ֔ה נְשִׂיאֵ֖י מַטּ֣וֹת אֲבוֹתָ֑/ם רָאשֵׁ֛י אַלְפֵ֥י יִשְׂרָאֵ֖ל הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/016.yaml
  text: These were the ones called from the congregation[a], the leaders of their fathers’ tribes[b], the heads of the thousands of Israel.
translation:
  language: sw
  text: Hawa ndio walioitwa wa kusanyiko[a], viongozi wa makabila ya baba zao, wakuu wa maelfu ya Israeli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walioagizwa kufika.” Neno la Kiebrania linaweza kumaanisha walioitwa, walioagizwa kufika, au walioteuliwa.
    reason: lexical_alternative
  - marker: b
    text: “Maelfu ya Israeli” yanaweza kumaanisha vikundi halisi vya watu elfu moja, au, kwa maana pana zaidi, vitengo vya koo au vya kijeshi katika Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה ... הֵם
  choice: Hawa ndio
  rationale: Muundo huu wa Kiswahili unaonyesha utambulisho na msisitizo unaotokana na kiwakilishi cha mwanzo na הֵם mwishoni.
- source_word: קריאי
  choice: walioitwa
  rationale: Neno hili linahifadhi maana ya kauli tendwa ya kuitwa bila kuamua kimya kimya kama walichaguliwa rasmi au waliagizwa kufika.
- source_word: הָעֵדָה
  choice: kusanyiko
  rationale: Hapa עֵדָה ni jumuiya ya Israeli inayoweza kukusanyika; “kusanyiko” ni neno la sasa na lenye heshima linalofaa muktadha huu.
- source_word: נְשִׂיאֵי
  choice: viongozi
  rationale: Katika muktadha wa kikabila na kiutawala, neno hili linamaanisha watu wenye cheo cha uongozi; “viongozi” linaeleweka kwa urahisi bila kudokeza ufalme.
- source_word: מַטּוֹת אֲבוֹתָם
  choice: makabila ya baba zao
  rationale: Tafsiri hii inadumisha marejeo ya wazi kwa baba zao na maana ya מַטֶּה kama kabila katika muktadha huu.
- source_word: רָאשֵׁי
  choice: wakuu
  rationale: “Wakuu” huwasilisha sitiari ya watu walio vichwa au viongozi wa vitengo, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: אַלְפֵי יִשְׂרָאֵל
  choice: maelfu ya Israeli
  rationale: Tafsiri ya karibu inadumisha uwezekano kwamba אֶלֶף ni hesabu halisi ya elfu moja au jina la kikundi cha ukoo au kijeshi.
