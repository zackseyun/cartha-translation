- source_word: דָן
  choice: Dani
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף
  choice: 62,000
  rationale: Mpangilio wa nambari wa Kiebrania umetolewa kwa namna ya kawaida ya kisasa ya kuandika nambari katika Kiswahili.
- source_word: וּשְׁבַע מֵאוֹת
  choice: '700'
  rationale: Hii ni tafsiri ya moja kwa moja ya sehemu iliyobaki ya jumla ya hesabu.
