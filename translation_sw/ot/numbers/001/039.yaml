- source_word: פְּקֻדֵיהֶם
  choice: wale waliohesabiwa
  rationale: Nomino hii inayotokana na פקד inawahusu watu walioingizwa katika hesabu ya sensa; tafsiri hii ni ya kawaida kwa Kiswahili na haiongezi neno ‘wanaume,’ ambalo tayari linaelezwa katika muktadha wa karibu.
- source_word: לְמַטֵּה
