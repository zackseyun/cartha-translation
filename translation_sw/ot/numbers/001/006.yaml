lexical_decisions:
- source_word: לְ/שִׁמְעוֹן
  choice: kwa Simeoni
  rationale: Kiambishi לְ katika orodha hii kinamtambulisha mwakilishi aliyechaguliwa kwa ajili ya kabila la Simeoni. “Kwa Simeoni” ni kifupi, cha asili katika muundo wa orodha, na hakiongezi maneno yasiyokuwamo wazi katika mstari.
- source_word: שְׁלֻמִיאֵל
  choice: Shelumieli
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa; umbo “Shelumieli” linafuata matumizi yanayotambulika katika Biblia za Kiswahili na mfumo wa sauti wa Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika fomula hii ya kumtambulisha mtu kwa jina la baba yake, בֶּן humaanisha moja kwa moja “mwana wa.”
- source_word: צוּרִישַׁדָּי
  choice: Surishadai
  rationale: Jina la mtu limetoholewa kwa sauti zinazosomeka kwa urahisi katika Kiswahili; “Suri-” huwakilisha sehemu ya kwanza צוּרִי na “-shadai” sehemu ya pili שַׁדָּי.
