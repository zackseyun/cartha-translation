lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Kama vile ... ndivyo
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kwamba tendo lilifanywa sawasawa na amri iliyotangulia.
- source_word: צִוָּה
  choice: alivyomwamuru
  rationale: Kitenzi kina maana ya kutoa amri; muundo wa Kiswahili unaonyesha kuwa amri ilitangulia kuhesabiwa kwao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika herufi nne za Kiebrania limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: אֶת מֹשֶׁה
  choice: Musa
  rationale: אֶת ni kiashiria cha yambwa tendwa na hakihitaji kutafsiriwa kando; jina מֹשֶׁה ni Musa katika matumizi sanifu ya Kiswahili.
- source_word: וַיִּפְקְדֵם
  choice: alivyowahesabu
  rationale: Katika muktadha wa sensa, פקד humaanisha kuwahesabu au kuwaandikisha watu; 'kuwahesabu' ni wazi na ya kawaida, huku tanbihi ikihifadhi maana mbadala.
- source_word: בְּמִדְבַּר סִינָי
  choice: katika nyika ya Sinai
  rationale: מִדְבָּר hurejelea eneo la nyika au jangwa; 'nyika ya Sinai' ni usemi wa asili na wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi יְהוָה; 'Yahweh' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nani anayefanya tendo la kuhesabu
  choice: alivyowahesabu
  alternative: Musa akawahesabu
  rationale: Kiebrania kina kiwakilishi cha nafsi ya tatu umoja bila kurudia jina Musa. Tafsiri inadumisha muundo huo huku muktadha ukionyesha kwamba mhusika ni Musa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo 'Kama vile ... ndivyo' unatoa ulinganifu wa asili; 'nyika' huhifadhi taswira ya eneo lisilolimwa bila kulazimisha maana ya jangwa la mchanga.
