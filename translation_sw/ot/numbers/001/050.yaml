  text: וְ/אַתָּ֡ה הַפְקֵ֣ד אֶת הַ/לְוִיִּם֩ עַל מִשְׁכַּ֨ן הָ/עֵדֻ֜ת וְ/עַ֣ל כָּל כֵּלָי/ו֮ וְ/עַ֣ל כָּל אֲשֶׁר ל/וֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת הַ/מִּשְׁכָּן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/הֵ֖ם יְשָׁרְתֻ֑/הוּ וְ/סָבִ֥יב לַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/050.yaml
  text: But you[a], appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it. They are to carry the tabernacle and all its furnishings, and they are to minister to it[b], and they are to camp around the tabernacle.
translation:
  language: sw
  text: Lakini wewe, waagize Walawi wasimamie Maskani ya Ushuhuda[a], vyombo vyake vyote, na kila kitu kilicho chake. Wao wataibeba Maskani pamoja na vyombo vyake vyote, wataitumikia[b], na watapiga kambi kuizunguka Maskani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Makao ya Ushuhuda.” Neno la Kiebrania מִשְׁכָּן linaweza kumaanisha makao au maskani; katika muktadha huu linarejelea patakatifu panapohamishika.
    reason: lexical_alternative
  - marker: b
    text: Au “wataihudumia” au “watashughulikia huduma yake.” Kitenzi hiki huonyesha huduma, hasa katika muktadha wa ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Lakini wewe
  rationale: Kiunganishi hiki kinaonyesha tofauti na agizo lililotangulia kuhusu makabila mengine; “Lakini wewe” huleta tofauti hiyo wazi katika Kiswahili cha kawaida.
- source_word: הַפְקֵד ... עַל
  choice: waweke ... wawe na jukumu la
  rationale: Hifili ya פקד pamoja na עַל hapa inamaanisha kuwapa Walawi wajibu rasmi juu ya maskani na vitu vyake, si kuwahesabu tu. Muundo huu ni wa kawaida na unaeleweka kwa urahisi.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: Maskani ya Ushuhuda
  rationale: “Maskani” huhifadhi wazo la mahali pa kukaa linalobebwa na neno משכן, huku “Ushuhuda” ikidumisha muundo wa Kiebrania bila kufafanua zaidi kile kinachokusudiwa.
- source_word: כֵּלָיו
  choice: vyombo vyake
  rationale: Katika muktadha wa maskani, כֵּלִים ni vitu na vifaa vya huduma takatifu. “Vyombo” ni istilahi pana, ya kawaida, na inayofaa katika muktadha huu.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: kila kitu kilicho chake
  rationale: Tafsiri hii huhifadhi maana pana ya vitu vyote vinavyohusishwa na maskani bila kuvibainisha kupita maandishi.
- source_word: יִשְׂאוּ
  choice: wataibeba
  rationale: נשא hapa inaeleza kubeba maskani wakati wa safari. Kiwakilishi “-i-” kinahifadhi yambwa ya Kiebrania.
- source_word: יְשָׁרְתֻהוּ
  choice: wataihudumia
  rationale: Pieli ya שרת ina maana ya kutoa huduma, hasa katika mazingira matakatifu. “Wataihudumia” huhifadhi pia kiambishi-yambwa kinachorejelea maskani.
- source_word: סָבִיב לַמִּשְׁכָּן יַחֲנוּ
  choice: watapiga kambi kuizunguka maskani
  rationale: Usemi huu unaonyesha kwamba kambi yao itakuwa pembezoni mwa maskani. Kiswahili hiki ni cha kawaida na kina nguvu ya agizo katika muktadha.
theological_decisions:
- issue: Istilahi ya ibada kwa משכן
  choice: Maskani
  alternative: hema; makao
  rationale: “Maskani” huhifadhi maana ya mahali pa kukaa na matumizi yake maalumu kwa patakatifu panapohamishika, bila kulinganisha neno hili kimakosa na אהל, “hema”.
- issue: Maana ya שרת katika huduma ya patakatifu
  choice: wataihudumia
  alternative: wataitumikia; watahudumu hapo
  rationale: Chaguo hili linaonyesha huduma inayohusiana na patakatifu na kuhifadhi yambwa ya Kiebrania, bila kuongeza dhana za kikuhani ambazo mstari hauzitaji wazi.
- issue: Maana ya הָעֵדֻת
  choice: Ushuhuda
  alternative: ushuhuda wa agano; mbao za ushuhuda
  rationale: Tafsiri rasmi “Ushuhuda” inadumisha ufupi na uwezekano wa maana wa maandishi ya Kiebrania badala ya kubainisha kimafundisho kile kinachorejelewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unaepuka lugha ya kale kupita kiasi, huku ukihifadhi istilahi za ibada, marudio ya “maskani” na mpangilio wa majukumu katika Kiebrania.
