  yaml_path: translation/ot/numbers/001/017.yaml
  text: So Moses and Aaron took these men[a], who had been designated by name.
translation:
  language: sw
  text: Basi Musa na Haruni wakawachukua watu hawa[a], waliokuwa wametajwa kwa majina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa wameainishwa kwa majina,” yaani, “waliokuwa wametambulishwa mahsusi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: wakawachukua
  rationale: Kitenzi לקח katika masimulizi kimsingi ni ‘chukua.’ Umbo la wingi linafuata kiima cha pamoja, Musa na Haruni; katika muktadha linaweza kumaanisha kuwakusanya au kuwaweka chini ya uongozi wao bila kulazimisha maana hiyo katika tafsiri.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Musa na Haruni
  rationale: Haya ndiyo maumbo ya majina yaliyozoeleka katika Kiswahili cha Biblia na katika matumizi ya kawaida.
- source_word: אֵת הָאֲנָשִׁים הָאֵלֶּה
  choice: watu hawa
  rationale: אֲנָשִׁים hapa ni wanaume maalumu waliotajwa katika muktadha uliotangulia. Kiswahili cha kawaida hutumia ‘watu hawa’ kwa kundi hilo; ‘viongozi hawa’ kingeongeza ufafanuzi wa kimuktadha usio katika nomino yenyewe.
- source_word: אֲשֶׁר
  choice: waliokuwa
  rationale: Muundo huu unaunganisha kwa kawaida kishazi rejeshi na ‘watu hawa’ na pia unaonyesha kwamba kutajwa kwao kulikuwa kumetangulia tendo la kuwachukua.
- source_word: נִקְּבוּ
  choice: wametajwa
  rationale: Nifali ya נקב ina maana ya kutajwa, kuainishwa, au kuonyeshwa wazi. ‘Wametajwa’ ni ya asili na inaacha muktadha uonyeshe kwamba waliteuliwa au kutambulishwa mahsusi.
- source_word: בְּשֵׁמוֹת
  choice: kwa majina
  rationale: Kirai hiki hudokeza utambulisho wa wazi kwa majina. ‘Kwa majina’ ni usemi wa kawaida wa Kiswahili unaohifadhi wingi wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘Basi’ huendeleza mtiririko wa masimulizi, na mfululizo ‘wakawachukua’ huakisi wayyiqtol ya Kiebrania. Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
