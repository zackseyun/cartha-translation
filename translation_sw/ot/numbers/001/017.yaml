  terminology: Majina “Musa” na “Haruni” ni maumbo yaliyotulia katika Kiswahili cha Biblia. Tanbihi inatoa mbadala halali wa kimsamiati (“wameainishwa”) bila kuingiza tafsiri ya kiteolojia au ya kiitikadi.
