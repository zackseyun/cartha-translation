  source_fidelity: Tafsiri inawakilisha kwa uaminifu וַיִּקַּח kwa “wakawachukua,” wahusika Musa na Haruni, na אֵת הָאֲנָשִׁים הָאֵלֶּה kwa “watu hawa.” Kishazi “waliokuwa wametajwa kwa majina” huhifadhi sauti ya kutendwa ya נִקְּבוּ pamoja na utambulisho wa majina katika בְּשֵׁמוֹת. “Watu” hapa linaweza kurejelea kundi la wanaume waliotangulia kutajwa bila kuongeza cheo cha “viongozi.”
