  text: בְּנֵ֣י נַפְתָּלִ֔י תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/042.yaml
  text: 'The sons of Naphtali[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: sw
  text: 'Wana wa Naftali, kulingana na nasaba zao, koo zao na nyumba za baba zao, kwa idadi ya majina yao, kuanzia wenye umri wa miaka ishirini na zaidi, kila mwanamume aliyefaa kwenda vitani[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “kila anayetoka kwenda jeshini” au “wote wanaotoka kwenda vitani.” Nahau hiyo inawahusu waliostahili kufanya utumishi wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: Wana wa Naftali
  rationale: Huhifadhi maana ya moja kwa moja ya ‘wana’ na pia nguvu ya kiume na ya unasaba katika orodha hii ya wanaume wa kabila.
- source_word: תּוֹלְדֹתָם
  choice: kulingana na nasaba zao
  rationale: ‘Nasaba’ hueleza mgawanyo kwa ukoo wa kizazi kwa usahihi zaidi kuliko ‘vizazi’ pekee, ambako kungeweza kueleweka kama makundi ya umri.
- source_word: לְמִשְׁפְּחֹתָם
  choice: koo zao
  rationale: Katika sensa ya kikabila, מִשְׁפָּחָה ni kundi pana la kindugu kuliko familia ndogo ya nyumbani; ‘koo’ ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: לְבֵית אֲבֹתָם
  choice: nyumba za baba zao
  rationale: Tafsiri hii inahifadhi muundo wa ukoo wa upande wa baba unaotajwa wazi katika Kiebrania bila kuupanua kuwa ‘familia’ kwa jumla.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: kwa idadi ya majina yao
  rationale: Huhifadhi lugha rasmi ya sensa inayowasilisha watu mmoja mmoja waliohesabiwa kwa majina.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: kuanzia wenye umri wa miaka ishirini na zaidi
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachoonyesha kwa wazi kikomo cha chini cha umri.
- source_word: כֹּל יֹצֵא צָבָא
  choice: kila mwanamume aliyefaa kwenda vitani
  rationale: Nahau hii humaanisha wale waliostahili huduma ya kijeshi. ‘Mwanamume’ inaendana na ‘wana wa Naftali’ katika sensa hii, huku ‘aliyefaa’ ikieleza ustahili unaodokezwa na muktadha.
