base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/010.yaml
  text: 'For the sons of Joseph: for Ephraim, Elishama son of Ammihud; for Manasseh, Gamaliel son of Pedahzur.'
translation:
  language: sw
  text: 'Kwa wana wa Yosefu: kwa Efraimu, Elishama mwana wa Amihudi; kwa Manase, Gamalieli mwana wa Pedasuri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Kwa wana wa Yosefu
  rationale: Kiambishi לְ kinaanzisha kundi la kikabila katika orodha hii, hivyo “kwa” kinafaa; בְנֵי ni “wana wa,” na Efraimu pamoja na Manase wanafuata kama matawi ya Yosefu.
- source_word: לְאֶפְרַיִם
  choice: kwa Efraimu
  rationale: Neno “kwa” linarudia muundo wa orodha ya Kiebrania bila kuongeza neno la ufafanuzi “kabila,” ambalo muktadha tayari unaonyesha.
- source_word: אֱלִישָׁמָע
  choice: Elishama
  rationale: Jina la mtu limetoholewa kwa mwandiko unaotumika kwa kawaida katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ndio usemi wa kawaida na wenye heshima katika Kiswahili wa kuonyesha uhusiano wa baba na mwana katika orodha ya nasaba.
- source_word: עַמִּיהוּד
  choice: Amihudi
  rationale: Jina la mtu limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: לִמְנַשֶּׁה
  choice: kwa Manase
  rationale: Huhifadhi ulinganifu na “kwa Efraimu” na muundo wa orodha ya chanzo.
- source_word: גַּמְלִיאֵל
  choice: Gamalieli
  rationale: Jina la mtu limetoholewa kwa umbo la Kiswahili linalotambulika.
- source_word: פְּדָהצוּר
  choice: Pedasuri
  rationale: Jina la mtu limetoholewa kwa kuzingatia mfumo wa sauti na mwandiko wa Kiswahili.
