  text: מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵ֑ל תִּפְקְד֥וּ אֹתָ֛/ם לְ/צִבְאֹתָ֖/ם אַתָּ֥ה וְ/אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/003.yaml
  text: From twenty years old and upward[b][a], every man going out to war in Israel—you and Aaron shall count them by their companies.
translation:
  language: sw
  text: Kuanzia umri wa miaka ishirini na kuendelea, kila mwanamume anayekwenda vitani[a] katika Israeli—wewe na Haruni mtawahesabu kwa vikosi vyao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mwanamume anayestahili utumishi wa kijeshi.” Usemi wa Kiebrania ni nahau ya kijeshi kuhusu wale wanaofaa kwa utumishi; muktadha wa sura hii unabainisha kuwa ni wanaume.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa makundi yao ya kijeshi” au “kwa vitengo vyao vya kijeshi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: Kuanzia umri wa miaka ishirini na kuendelea
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha umri wa chini unaotakiwa, huku ikihifadhi maana ya ‘miaka ishirini na zaidi.’
- source_word: כָּל
  choice: kila
  rationale: Neno hili linaonyesha kila mtu mmoja mmoja kwa kuwa linafuatwa na umbo la umoja.
- source_word: יֹצֵא צָבָא
  choice: mwanamume anayeenda vitani
  rationale: Usemi wa Kiebrania ni nahau ya kijeshi kuhusu wanaostahili utumishi. ‘Anayeenda vitani’ huhifadhi taswira halisi ya kwenda vitani, na ‘mwanamume’ inafaa kwa muktadha wa sensa hii ya wanaume.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayorejelea taifa la Israeli.
- source_word: תִּפְקְדוּ אֹתָם
  choice: mtawahesabu
  rationale: Katika muktadha wa sensa, kitenzi kinamaanisha kuwahesabu au kuwasajili kwa ajili ya utumishi; ‘mtawahesabu’ ni wazi na cha kawaida.
- source_word: לְצִבְאֹתָם
  choice: kwa vikosi vyao
  rationale: Kirai hiki kinaonyesha kwamba waliohesabiwa walipangwa kulingana na vitengo vyao vya kijeshi. ‘Vikosi’ ni neno la sasa na linaloeleweka.
- source_word: אַתָּה וְאַהֲרֹן
  choice: wewe na Haruni
  rationale: Huhifadhi msisitizo wa Kiebrania kuhusu watu waliopewa jukumu la kuhesabu.
theological_decisions:
- issue: Lugha inayobainisha jinsia katika ustahili wa utumishi wa kijeshi
  choice: kila mwanamume anayeenda vitani
  alternative: kila mtu anayeenda vitani
  rationale: Muktadha wa sura hii unabainisha wanaume waliohesabiwa kwa ajili ya utumishi wa kijeshi; kwa hiyo, ‘mwanamume’ huakisi upeo wa kifungu bila kuifanya lugha kuwa ya kijumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi huhifadhi msisitizo wa ‘wewe na Haruni’ bila kuwa mgumu; alama za tanbihi zimewekwa karibu na maneno yanayofafanuliwa.
