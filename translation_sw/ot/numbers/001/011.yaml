lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: Kwa Benyamini
  rationale: Kiambishi לְ katika orodha hii kinamtambulisha mwakilishi wa kabila; “Kwa Benyamini” ni kifupi na cha asili bila kuongeza neno “kabila,” ambalo halipo wazi katika Kiebrania.
- source_word: אֲבִידָן
  choice: Abidani
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili na linalofaa mfumo wa sauti wa Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Neno בֶּן katika muundo huu wa majina linaonyesha uhusiano wa mwana na baba; “mwana wa” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: גִּדְעֹנִי
  choice: Gideoni
  rationale: Jina hili la mtu limetoholewa kwa Kiswahili badala ya kutafsiriwa.
