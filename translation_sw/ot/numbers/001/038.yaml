base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: sw
  text: 'Kwa wana wa Dani, kulingana na nasaba zao, kwa koo zao na kwa nyumba za baba zao, kwa hesabu ya majina yao, kuanzia wenye umri wa miaka ishirini na zaidi, kila mwanamume anayeweza kwenda vitani[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mmoja aliyefaa kwa utumishi wa kijeshi.” Nahau ya Kiebrania husema kihalisi kuhusu kwenda vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי דָן
  choice: Kwa wana wa Dani
  rationale: Kiambishi ל kinaanzisha sehemu ya kabila katika muundo wa sensa. “Wana wa Dani” kinahifadhi lugha ya ukoo na rejea ya kabila hilo.
- source_word: תּוֹלְדֹתָם
  choice: kulingana na nasaba zao
  rationale: Katika muktadha huu neno linaonyesha mgawanyo au kumbukumbu za ukoo, si watoto waliozaliwa tu. “Nasaba” ni ya asili na huitofautisha na koo zinazotajwa baadaye.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה hapa ni kitengo cha ukoo ndani ya kabila; “koo” ni sahihi kuliko kurudia neno pana “familia.”
- source_word: לְבֵית אֲבֹתָם
  choice: kwa nyumba za baba zao
  rationale: Tafsiri hii inadumisha istilahi ya kijamii na kiukoo ya Kiebrania bila kuichanganya na “koo.”
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: kwa hesabu ya majina yao
  rationale: Maneno hayo yanaeleza kuhesabiwa kwa watu mmoja mmoja kwa majina. Kiwakilishi “yao” kinaweka wazi uhusiano unaodokezwa na muktadha.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: kuanzia wenye umri wa miaka ishirini na zaidi
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili unaoweka kikomo cha chini cha umri bila kubadili maana.
- source_word: כֹּל יֹצֵא צָבָא
  choice: kila mwanamume aliyeweza kwenda vitani
  rationale: Nahau hiyo humaanisha wale waliostahili kushiriki katika jeshi. “Mwanamume” inaonyesha kwa usahihi kwamba sensa hii ilihusu wanaume wa kabila, huku “kwenda vitani” ikihifadhi picha ya nahau ya Kiebrania.
theological_decisions:
- issue: Lugha yenye jinsia katika sensa ya kijeshi
  choice: kila mwanamume aliyeweza kwenda vitani
  alternative: kila mtu aliyefaa kwa utumishi wa kijeshi
  rationale: Ingawa כֹּל יֹצֵא haina nomino inayosema “mwanamume” moja kwa moja, maumbo ya kiume na muktadha wa sensa ya wale walioweza kwenda vitani yanaonyesha kuwa wanaume ndio wanaorejelewa. Tafsiri haifanyi rejea hiyo kuwa isiyo na jinsia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo rasmi lakini unaoeleweka. Muundo wa orodha wa sensa umehifadhiwa, huku “nasaba,” “koo,” na “nyumba za baba” zikitofautishwa kama ngazi za ukoo.
