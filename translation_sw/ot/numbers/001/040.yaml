base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/040.yaml
  text: 'For the sons of Asher[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: sw
  text: 'Kwa wana wa Asheri, kwa nasaba zao, kwa koo zao, kwa nyumba za baba zao, kwa hesabu ya majina, kuanzia umri wa miaka ishirini na zaidi, kila mwanamume aendaye vitani[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “kila aendaye kwenda vitani”; ni nahau inayomaanisha wale waliostahili kufanya utumishi wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָשֵׁר
  choice: Kwa wana wa Asheri
  rationale: Kihusishi לְ kinaanzisha kichwa cha kabila katika orodha ya sensa. “Wana wa Asheri” kinahifadhi lugha ya uhusiano wa mwana na baba na pia maana ya kikabila.
- source_word: תּוֹלְדֹתָם
  choice: kwa nasaba zao
  rationale: Katika muktadha huu neno linaonyesha mistari ya ukoo au vizazi vyao. “Nasaba zao” ni Kiswahili cha sasa kinachoeleweka na hakidai kwamba kulikuwa na kumbukumbu zilizoandikwa.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה hapa ni kitengo cha undugu ndani ya kabila; “koo” ni sahihi kuliko “familia,” ambalo linaweza kueleweka kuwa kaya ndogo tu.
- source_word: לְבֵית אֲבֹתָם
  choice: kwa nyumba za baba zao
  rationale: Hii inahifadhi taswira ya kawaida ya Kiebrania kuhusu makundi ya kijamii na kiukoo ya Israeli bila kuibadili kuwa dhana pana isiyo dhahiri.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: kwa hesabu ya majina
  rationale: Kirai kinaonyesha kuwa watu walihesabiwa mmoja mmoja kwa majina; tafsiri hii inabaki karibu na muundo wa Kiebrania na ni ya kawaida katika Kiswahili.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: kuanzia wenye umri wa miaka ishirini na zaidi
  rationale: Hii inaeleza wazi kiwango cha chini cha umri huku ikihifadhi upeo wa miaka ishirini kwenda juu.
- source_word: כֹּל יֹצֵא צָבָא
  choice: kila mwanamume aliyestahili kwenda vitani
  rationale: Kirai ni nahau ya kijeshi kuhusu waliofikia sifa za kutumikia jeshi. “Mwanamume” linaweka wazi muktadha wa sensa ya wanaume, na “aliyestahili” huwasilisha kazi ya nahau badala ya kudokeza kuwa wote tayari walikuwa vitani.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kurudiwa wa sensa umehifadhiwa kwa virai vinavyoanza na “kwa,” huku “nasaba” na “koo” zikitofautisha mistari ya ukoo na vitengo vya undugu. Alama ya nukta mbili imehifadhiwa kwa sababu mstari huu ni kichwa cha taarifa ya idadi inayofuata.
