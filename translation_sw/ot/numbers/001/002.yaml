  text: שְׂא֗וּ אֶת רֹאשׁ֙ כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֔וֹת כָּל זָכָ֖ר לְ/גֻלְגְּלֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], by their clans, by their fathers’ houses, according to the number of names, every male[c][b], head by head.
translation:
  language: sw
  text: “Fanyeni sensa[a] ya jumuiya yote ya wana wa Israeli[b], kwa koo zao, kwa nyumba za baba zao, kwa hesabu ya majina ya kila mwanamume, mmoja mmoja[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “inueni kichwa cha”; yaani, muhesabu au muwaandikishe rasmi katika sensa.
    reason: lexical_alternative
  - marker: b
    text: Au “Waisraeli.” Kwa maana halisi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “kwa mafuvu yao” (yaani, vichwa vyao), nahau ya Kiebrania inayomaanisha kuwahesabu watu mmoja mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת רֹאשׁ
  choice: Fanyeni sensa
  rationale: Nahau hii ina maana halisi ya ‘inueni kichwa cha,’ lakini katika muktadha huu wa kiutawala inamaanisha kuwahesabu au kuwaandikisha watu rasmi. ‘Fanyeni sensa’ ni Kiswahili cha sasa, wazi na sahihi.
- source_word: כָּל עֲדַת
  choice: jumuiya yote
  rationale: עֵדָה humaanisha jamii ya Israeli kama kundi la pamoja. ‘Jumuiya yote’ huhifadhi maana hiyo ya kijamii kwa lugha ya kawaida na yenye hadhi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii huhifadhi picha ya kifamilia na umbo la kiume lililo katika Kiebrania, badala ya kulibadilisha moja kwa moja kuwa jina la kitaifa ‘Waisraeli.’
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה hapa ni kitengo cha ukoo ndani ya kabila, si familia ndogo tu; kwa hiyo ‘koo’ ni sahihi zaidi.
- source_word: לְבֵית אֲבֹתָם
  choice: kwa nyumba za baba zao
  rationale: Usemi huu unataja vikundi vya nasaba vilivyopangwa kwa ukoo wa upande wa baba. Tafsiri ya karibu huhifadhi muundo huo wa kijamii.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: kwa hesabu ya majina
  rationale: Kifungu hiki kinaonyesha kuwa watu walihesabiwa kwa majina yao yaliyotajwa au kuandikishwa; tafsiri hii huhifadhi lugha rasmi ya Kiebrania.
- source_word: כָּל זָכָר
  choice: kila mwanamume
  rationale: זָכָר humaanisha mtu wa jinsia ya kiume. ‘Kila mwanamume’ ni sahihi na hudumisha nguvu ya mgawanyo ya כָּל.
- source_word: לְגֻלְגְּלֹתָם
  choice: mmoja mmoja
  rationale: Maana halisi ni ‘kwa mafuvu/vichwa vyao,’ lakini hapa ni nahau ya kumhesabu kila mtu binafsi. ‘Mmoja mmoja’ hutoa maana hiyo kwa Kiswahili cha kawaida, huku taswira halisi ikihifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
