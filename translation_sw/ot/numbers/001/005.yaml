  yaml_path: translation/ot/numbers/001/005.yaml
  text: 'And these are the names of the men who shall stand with you: for Reuben[a], Elizur son of Shedeur.'
translation:
  language: sw
  text: 'Na haya ndiyo majina ya wanaume watakaosimama pamoja nanyi: kwa ajili ya Reubeni[a], Elizuri mwana wa Shedeuri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa Reubeni, Elizuri mwana wa Shedeuri.” Kihusishi cha Kiebrania kinaweza kueleweka kuwa kinaonyesha uhusiano na kabila au uwakilishi wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Na haya ndiyo
  rationale: Inahifadhi kiunganishi cha mwendelezo וְ na namna ya Kiebrania ya kutambulisha orodha, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: majina ya wanaume
  rationale: Muundo wa kutegemezana umetafsiriwa moja kwa moja; 'wanaume' linaonyesha kwa usahihi kwamba hawa ni wawakilishi wa kiume waliotajwa.
- source_word: יַעַמְדוּ אִתְּכֶם
  choice: watakaosimama pamoja nanyi
  rationale: Inadumisha picha ya msingi ya עמד, 'kusimama,' na pia wazo la kuwa pamoja na Musa na Aroni katika jukumu lao.
- source_word: לִרְאוּבֵן
  choice: kwa ajili ya Reubeni
  rationale: ל inaweza kuonyesha uwakilishi au uhusiano wa kikabila. 'Kwa ajili ya Reubeni' linaonyesha uwakilishi bila kufuta uwezekano wa maana ya 'kutoka kwa Reubeni.'
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Elizuri mwana wa Shedeuri
  rationale: Majina yamenukuliwa kwa maumbo yaliyozoeleka katika Kiswahili, na בֶּן limetafsiriwa kwa fomula ya kawaida 'mwana wa.'
