  text: וְ/הַ/לְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְ/מִשְׁכַּ֣ן הָ/עֵדֻ֔ת וְ/לֹֽא יִהְיֶ֣ה קֶ֔צֶף עַל עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/שָׁמְרוּ֙ הַ/לְוִיִּ֔ם אֶת מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָ/עֵדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/053.yaml
  text: But the Levites shall camp around the tabernacle of the testimony[a], so that there may be no wrath on the congregation of the sons of Israel; and the Levites shall keep charge of the tabernacle of the testimony.
translation:
  language: sw
  text: Lakini Walawi watapiga kambi kuzunguka Maskani ya Ushuhuda, ili ghadhabu isije juu ya kusanyiko la wana wa Israeli; nao Walawi watakuwa na jukumu la kuilinda Maskani ya Ushuhuda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Lakini Walawi
  rationale: Kiunganishi kinaonyesha utofauti na mpangilio wa makabila mengine katika muktadha uliotangulia; “Lakini” kinaendeleza mtiririko huo kwa Kiswahili cha kawaida.
- source_word: יַחֲנוּ סָבִיב
  choice: watapiga kambi kuizunguka
  rationale: Kitenzi kisichotimilika hapa kina nguvu ya agizo la wakati ujao, na סָבִיב inaonyesha eneo linalozunguka Maskani.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: Maskani ya Ushuhuda
  rationale: “Maskani” huhifadhi wazo la mahali pa kukaa lililo katika מִשְׁכָּן, huku “Ushuhuda” ikihifadhi neno la Kiebrania bila kulifafanua kwa namna finyu kuwa hati au sanduku.
- source_word: וְלֹא יִהְיֶה קֶצֶף
  choice: ili ghadhabu isiwe
  rationale: Muundo huu unaonyesha kusudi au matokeo ya tahadhari hiyo; “ghadhabu” huhifadhi uzito wa hukumu katika muktadha wa utakatifu wa patakatifu.
- source_word: עַל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: juu ya kusanyiko la wana wa Israeli
  rationale: “Kusanyiko” linafaa kwa jamii iliyokusanywa, na “wana wa Israeli” huhifadhi umbo la kifamilia la Kiebrania.
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת
  choice: watailinda ... kama walivyokabidhiwa
  rationale: Mchanganyiko wa mzizi שׁמר na מִשְׁמֶרֶת unaunganisha kulinda na kutekeleza jukumu lililokabidhiwa; Kiswahili hiki kinaeleza maana zote mbili bila kurudia maneno kwa namna isiyo ya kawaida.
theological_decisions:
- issue: Asili ya קֶצֶף katika muktadha wa Maskani
  choice: “ghadhabu” yenye maana ya hukumu inayoweza kulipata kusanyiko
  alternative: hasira ya kawaida au kutoridhika kwa wanadamu
  rationale: Muktadha wa mipaka ya patakatifu katika Hesabu unaonyesha hatari ya hukumu inayohusiana na utakatifu; tafsiri haimtaji Mungu moja kwa moja kwa sababu mhusika huyo hajaelezwa wazi katika sentensi ya Kiebrania.
- issue: Maana ya הָעֵדֻת
  choice: Ushuhuda
  alternative: hati ya agano
  rationale: “Ushuhuda” huhifadhi upana na mvutano wa istilahi ya Kiebrania badala ya kuifunga kwenye ufafanuzi mmoja.
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: Uchaguzi huu huhifadhi taswira ya ukoo iliyo wazi katika chanzo, ingawa kwa Kiswahili inaweza kurejelea jamii ya Israeli kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Maskani” na “Ushuhuda” zimeandikwa kwa herufi kubwa kama majina ya istilahi maalumu ya ibada. Hakuna tanbihi iliyoongezwa kwa sababu rasimu ya Kiingereza ina alama [a] inayodaiwa kueleza badala ya maneno yaliyowekewa alama; maelezo yake hayalingani na mahali pa alama hiyo, hivyo hayajahamishwa kwa upotoshaji.
