lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Basi ... walikuwa
  rationale: Muundo wa wayyiqtol wa היה unaendeleza na kujumlisha matokeo ya sensa iliyotangulia; “Basi” huonyesha nguvu hiyo ya muhtasari, huku hali ya kuwa ikieleweka ndani ya sentensi.
- source_word: כָּל פְּקוּדֵי
  choice: wote waliohesabiwa
  rationale: Huhifadhi upeo wa כָּל na maana ya matokeo ya kuhesabiwa katika sensa ya kijeshi bila kuongeza maana isiyomo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Ni tafsiri ya karibu ya usemi wa Kiebrania, na jinsia yake ya kiume ina umuhimu katika sensa hii iliyopangwa kwa huduma ya kijeshi.
- source_word: לְבֵית אֲבֹתָם
  choice: kwa kufuata jamaa za baba zao
  rationale: Hueleza mpangilio wa sensa kwa makundi ya ukoo wa upande wa baba kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: wenye umri wa miaka ishirini na zaidi
  rationale: Ni usemi wa kawaida na sahihi wa Kiswahili kwa kiwango hiki cha umri.
- source_word: כָּל יֹצֵא צָבָא
  choice: kila mmoja aliyestahili kwenda vitani
  rationale: Nahau hiyo humaanisha mtu anayefaa au anayestahili kushiriki huduma ya kijeshi; tafsiri hii ni ya kawaida huku ikihifadhi wazo la kwenda vitani.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Huhifadhi usemi wa mahali au jumuiya wa Kiebrania kwa namna ya moja kwa moja.
