  text: Basi, wote waliohesabiwa miongoni mwa wana wa Israeli[a], kwa nyumba za baba zao, wenye umri wa miaka ishirini na kuendelea, kila mmoja aliyeweza kwenda vitani miongoni mwa Israeli[b],
