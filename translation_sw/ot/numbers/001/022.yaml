base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/022.yaml
  text: 'For the sons of Simeon[a], by their generations, by their clans, by their fathers’ houses, those numbered of them, by the number of names, head by head, every male from twenty years old and upward[c][b], everyone going out to war:'
translation:
  language: sw
  text: 'Kwa wana wa Simeoni, kulingana na nasaba zao, koo zao, na nyumba za baba zao, wale waliohesabiwa[a] kwa idadi ya majina, mmoja mmoja[b], kila mwanamume mwenye umri wa miaka ishirini na zaidi, kila mtu anayeenda vitani[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wale walioandikishwa kwa sensa.” Kitenzi cha Kiebrania kinaweza kumaanisha kuhesabu katika sensa au kuwakusanya watu kwa huduma ya kijeshi katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa mafuvu/vichwa vyao,” yaani, kila mtu alihesabiwa binafsi.
    reason: cultural_note
  - marker: c
    text: Au “kila mtu anayefaa kwa huduma ya kijeshi.” Kiebrania kinasema kihalisi zaidi, “kila mtu anayeenda vitani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: Kwa wana wa Simeoni
  rationale: Neno בְּנֵי katika orodha hii ya sensa linawahusu wazao wa kiume au wanakabila wa Simeoni; “wana” linadumisha uhusiano rasmi na babu wa kabila.
- source_word: תּוֹלְדֹתָם
  choice: kulingana na nasaba zao
  rationale: Katika muktadha wa sensa na ukoo, תולדות humaanisha mistari ya vizazi au kumbukumbu za asili; “nasaba” ni Kiswahili cha sasa na chenye staha kinachobeba maana hiyo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: koo zao
  rationale: מִשְׁפָּחָה hapa ni kitengo cha ukoo ndani ya kabila, hivyo “koo” ni sahihi kuliko “familia” kwa mpangilio huu wa kikabila.
- source_word: לְבֵית אֲבֹתָם
  choice: jamaa za upande wa baba zao
  rationale: Kirai בית אבות kinataja makundi ya kijamii yaliyopangwa kwa ukoo wa baba. Tafsiri hii inaeleweka kwa msomaji wa kawaida bila kuficha muundo huo.
- source_word: פְּקֻדָיו
  choice: wale waliohesabiwa
  rationale: Umbo hili la פקד linawahusu walioandikishwa au kuhesabiwa katika sensa; “waliohesabiwa” linabaki karibu na maana ya msingi bila kulazimisha mapema maana ya kijeshi.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: kwa idadi ya majina
  rationale: Hiki ni kirai rasmi cha sensa kinachoonyesha kuhesabiwa kwa majina ya watu binafsi.
- source_word: לְגֻלְגְּלֹתָם
  choice: mmoja mmoja
  rationale: Ingawa kihalisi ni “kwa mafuvu/vichwa vyao,” hiki ni nahau ya kuhesabu kila mtu binafsi; “mmoja mmoja” ni Kiswahili cha asili na wazi.
- source_word: כָּל זָכָר
  choice: kila mwanamume
  rationale: זכר hubainisha jinsia ya kiume. Katika muktadha wa wenye umri wa miaka ishirini na zaidi, “mwanamume” ni ya kawaida na sahihi.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mwenye umri wa miaka ishirini na zaidi
  rationale: Hii ni namna ya kawaida na wazi ya Kiswahili ya kueleza kiwango cha umri kinachoanzia miaka ishirini.
- source_word: כֹּל יֹצֵא צָבָא
  choice: kila mtu anayeenda vitani
  rationale: Tafsiri hii huhifadhi usemi halisi wa Kiebrania, “kila anayetoka kwenda jeshini/vitani,” bila kuufafanua moja kwa moja kuwa uwezo au ustahiki wa huduma ya kijeshi.
