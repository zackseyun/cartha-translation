base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/032.yaml
  text: 'For the sons of Joseph[a], for the sons of Ephraim, by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: sw
  text: 'Kwa wazao wa Yosefu, kwa wazao wa Efraimu, kulingana na nasaba zao, koo zao, na familia za baba zao, kwa hesabu ya majina, kuanzia wenye umri wa miaka ishirini na zaidi, kila mwanamume anayeenda vitani[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila mwanamume anayehudumu jeshini.” Nahau ya Kiebrania yasema kihalisi “anayekwenda vitani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף לִבְנֵי אֶפְרַיִם
  choice: Kwa wazao wa Yosefu, yaani wazao wa Efraimu
  rationale: Katika muktadha wa sensa, בנים humaanisha wazao wa kikabila, si wana wa moja kwa moja tu. Neno “yaani” linaonyesha kwamba hapa kundi la Yosefu linalotajwa ni tawi la Efraimu, bila kufuta muundo wa Kiebrania.
- source_word: תּוֹלְדֹתָם
  choice: kulingana na nasaba zao
  rationale: Katika orodha hii ya sensa, neno hili linahusu mpangilio wa ukoo au asili ya kizazi. “Nasaba” ni ya kawaida na sahihi kuliko tafsiri inayoweza kueleweka kuwa vizazi vya nyakati tofauti.
- source_word: לְמִשְׁפְּחֹתָם
  choice: koo zao
  rationale: מִשְׁפָּחָה hapa ni kitengo cha kijamii ndani ya kabila, kikubwa kuliko familia ya nyumbani; “koo” linaonyesha jambo hilo kwa Kiswahili cha kawaida.
- source_word: לְבֵית אֲבֹתָם
  choice: jamaa za baba zao
  rationale: Huu ni usemi wa kiufundi wa ukoo unaotokana na upande wa baba. “Jamaa za baba zao” huhifadhi rejeo la kibaba huku likieleweka kwa urahisi.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: walihesabiwa jina kwa jina
  rationale: Badala ya muundo mgumu “kwa hesabu ya majina,” usemi huu wa asili wa Kiswahili unaonyesha kwamba watu waliorodheshwa mmoja mmoja kwa majina.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: kuanzia wenye umri wa miaka ishirini na zaidi
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoweka wazi kiwango cha chini cha umri bila kuongeza dhana nyingine.
- source_word: כֹּל יֹצֵא צָבָא
  choice: kila mwanamume aliyeenda vitani
  rationale: Usemi wa Kiebrania unamtaja kila mwanaume aliyekuwa katika kundi la kutoka vitani. “Mwanamume” huhifadhi jinsia inayokusudiwa na sensa, na “aliyeenda vitani” huhifadhi picha halisi ya nahau ya Kiebrania.
theological_decisions:
- issue: Lugha ya kijinsia katika sensa
  choice: kila mwanamume aliyeenda vitani
  alternative: kila mtu aliyeenda vitani
  rationale: Muktadha na muundo wa Kiebrania vinahusu wanaume wenye umri wa kuingia katika jeshi. Kutumia “mwanamume” kunahifadhi maana hiyo badala ya kuifanya lugha iwe isiyoonyesha jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mtindo wa taarifa ya sensa lakini huepuka miundo ya kale au tafsiri neno kwa neno isiyo ya kawaida. Alama ya nukta mbili imehifadhiwa kwa sababu mstari unaongoza kwenye jumla ya sensa katika mstari unaofuata.
