base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/028.yaml
  text: 'For the sons of Issachar[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: sw
  text: 'Kwa wana wa Isakari, kulingana na vizazi vyao, kwa koo zao, kwa nyumba za baba zao, kwa hesabu ya majina, kuanzia wenye umri wa miaka ishirini na zaidi, kila mwanamume aliyeweza kwenda vitani[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila mmoja aendaye vitani.” Tamko la Kiebrania ni, kihalisi, “kila atokaye kwa jeshi,” na hapa linawahusu wanaume waliostahili huduma ya kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: Kwa wana wa Isakari
  rationale: Kiambishi לְ kinatanguliza kichwa cha kabila katika mfumo wa sensa. “Wana wa Isakari” kinahifadhi lugha ya ukoo na maana ya wanaume wa kabila hilo.
- source_word: תּוֹלְדֹתָם
  choice: kulingana na vizazi vyao
  rationale: Neno hili linaonyesha mistari au migawanyiko ya uzao; “vizazi vyao” linadumisha muundo wa Kiebrania bila kulifanya mahsusi kuwa kumbukumbu zilizoandikwa.
- source_word: לְמִשְׁפְּחֹתָם
  choice: koo zao
  rationale: מִשְׁפָּחָה hapa ni kitengo cha kiukoo ndani ya kabila, hivyo “koo” ni sahihi kuliko “familia” katika maana yake ya kisasa.
- source_word: לְבֵית אֲבֹתָם
  choice: jamaa za baba zao
  rationale: Hili ni tamko la kawaida la mpangilio wa ukoo wa Israeli. “Jamaa za baba zao” linaeleweka kwa urahisi huku likihifadhi msingi wa ukoo wa upande wa baba.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: kwa hesabu ya majina
  rationale: Tafsiri hii ya karibu inahifadhi nahau ya sensa inayowahesabu watu mmoja mmoja kwa majina.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: kuanzia wenye umri wa miaka ishirini na zaidi
  rationale: Hii ni lugha ya kawaida na iliyo wazi kwa kiwango cha chini cha umri, ikiwajumuisha wote waliokuwa na miaka ishirini au zaidi.
- source_word: כֹּל יֹצֵא צָבָא
  choice: kila mwanamume aliyeweza kwenda vitani
  rationale: Kihalisi ni “kila atokaye kwenda jeshini/vitani.” Katika sensa hii tamko linawahusu wanaume waliostahili huduma ya kijeshi; tanbihi inadumisha uwezekano wa tafsiri ya karibu zaidi.
theological_decisions:
- issue: Lugha ya kijinsia katika sensa
  choice: kila mwanamume aliyeweza kwenda vitani
  alternative: kila mtu aliyekwenda vitani
  rationale: Sarufi ya Kiebrania ni ya kiume, na muktadha unawahusu wanaume wa umri wa kwenda vitani. Tafsiri inabainisha jinsia inayokusudiwa bila kuipanua kwa watu wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa orodha na alama ya nukta mbili umehifadhiwa kwa kuwa mstari huu unaongoza kwenye jumla inayofuata.
