lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: waliohesabiwa
  rationale: Ni umbo linalotokana na פקד katika muktadha wa sensa, likirejelea watu waliosajiliwa na kuhesabiwa. “Waliohesabiwa” ni Kiswahili cha kawaida na huhifadhi muktadha huo bila kuongeza maelezo.
- source_word: לְמַטֵּה
  choice: kutoka kabila la
  rationale: Katika fomula hii ya sensa, לְ pamoja na מַטֶּה hutambulisha uhusiano wa kikabila. “Kutoka kabila la” ni usemi wa asili katika Kiswahili na unaendana na muundo wa aya zinazozunguka.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Jina hili limetoholewa kwa tahajia iliyozoeleka katika Kiswahili badala ya kutafsiriwa.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף
  choice: 53,000
  rationale: Mpangilio wa namba wa Kiebrania umetolewa kwa mpangilio wa kawaida wa Kiswahili; tarakimu huifanya jumla ndefu isomeke kwa urahisi.
- source_word: וְאַרְבַּע מֵאוֹת
  choice: '400'
  rationale: Hiki ni kipengele cha mwisho cha jumla ya sensa, kilichounganishwa na 53,000 kuwa 53,400.
