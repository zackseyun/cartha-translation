  language: sw
  text: Waliohesabiwa kutoka kabila la Isakari walikuwa hamsini na nne elfu na mia nne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “idadi yao” au “walioandikishwa.” Neno la Kiebrania la sensa linawahusu wale walioandikishwa na kuhesabiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: Waliohesabiwa
  rationale: Neno hili linatokana na פקד na katika muktadha huu linataja watu walioandikishwa na kuhesabiwa katika sensa. “Waliohesabiwa” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuongeza neno “wanaume,” ambalo halipo wazi katika fomula ya mstari huu.
- source_word: לְמַטֵּה
  choice: kutoka kabila la
  rationale: Katika fomula ya sensa, לְ pamoja na מַטֶּה huonyesha uhusiano wa kikabila. “Kutoka kabila la” ni usemi wa kawaida wa Kiswahili unaofaa muktadha huu.
- source_word: יִשָּׂשכָר
  choice: Isakari
  rationale: Jina limetoholewa kwa umbo linalotambulika na kutumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: hamsini na nne elfu na mia nne
  rationale: Mpangilio wa nambari umetolewa kwa Kiswahili cha sasa huku idadi kamili ya 54,400 ikihifadhiwa.
