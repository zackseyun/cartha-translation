id: NUM.1.1
reference: Numbers 1:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֧ה אֶל מֹשֶׁ֛ה בְּ/מִדְבַּ֥ר סִינַ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/אֶחָד֩ לַ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/צֵאתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the tent of meeting, on the first day of the second month, in the second year after they had come out of the land of Egypt, saying,
translation:
  language: sw
  text: 'Yahwe akamwambia Musa katika nyika ya Sinai, katika hema la kukutania[a], siku ya kwanza ya mwezi wa pili, katika mwaka wa pili baada ya kutoka kwao katika nchi ya Misri, hivi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hema la kukutania”; kimapokeo huitwa “maskani.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akamwambia
  rationale: Kitenzi דבר kinatanguliza usemi wa Mungu kwa Musa. “Akamwambia” ni Kiswahili cha kawaida na cha asili kinachounganisha wazo la kusema na yule anayeambiwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo.
- source_word: בְּמִדְבַּר סִינַי
  choice: katika nyika ya Sinai
  rationale: מִדְבָּר ni eneo la nyika au jangwa; “nyika” huhifadhi maana pana bila kulazimisha picha ya eneo la mchanga pekee.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ndani ya hema la kukutania
  rationale: Tafsiri hii inaonyesha moja kwa moja kwamba אֹהֶל מוֹעֵד ni hema linalohusishwa na kukutana, badala ya kutumia istilahi ya kimapokeo isiyo wazi kwa wasomaji wote.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: siku ya kwanza ya mwezi wa pili
  rationale: Hii ni namna ya asili ya Kiswahili ya kutaja tarehe inayotolewa na nahau ya Kiebrania.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: katika mwaka wa pili
  rationale: Inawakilisha moja kwa moja kipindi kilichotajwa katika Kiebrania.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: baada ya wao kutoka katika nchi ya Misri
  rationale: Muundo huu huhifadhi uhusiano wa wakati, kiambishi cha wingi, na neno המארץ, “nchi,” lililo katika chanzo.
- source_word: לֵאמֹר
  choice: 'hivi:'
  rationale: Katika Kiswahili, “hivi:” hutanguliza kwa ufasaha maneno yatakayofuata katika aya inayofuata na kuwasilisha kazi ya fomula ya Kiebrania לֵאמֹר bila marudio yasiyo ya asili ya “akamwambia ... akisema.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni, jina binafsi la Mungu. “Yahwe” huhifadhi jina hilo badala ya kuliweka kama cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetengenezwa kwa mtiririko wa kawaida wa Kiswahili huku ikihifadhi mahali, tarehe, na mpangilio wa wakati wa chanzo. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, “hema la kukutania.”
