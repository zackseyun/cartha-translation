base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/051.yaml
  text: When the tabernacle is to set out[a], the Levites shall take it down; and when the tabernacle is to camp, the Levites shall set it up. And the outsider who comes near shall be put to death.
translation:
  language: sw
  text: Maskani itakapoondoka, Walawi wataishusha; na Maskani itakapopiga kambi, Walawi wataisimamisha. Na mtu asiye na ruhusa[a] anayekaribia atauawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu wa nje” au “mtu asiyeidhinishwa”; Kiebrania humaanisha mtu asiye na ruhusa ya kukaribia patakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְסֹעַ
  choice: Wakati Maskani inapohamishwa
  rationale: Muundo wa ב pamoja na kitenzi-jina unaanzisha kishazi cha wakati. Mzizi נסע unaonyesha kuondoka kwa safari; kauli ya kutendwa ni ya kawaida kwa Kiswahili kuhusu Maskani inayohamishwa pamoja na kambi.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: ‘Maskani’ ni neno lililozoeleka katika Kiswahili cha Biblia kwa patakatifu pa kubebeka, na linadumisha wazo la mahali ambapo Mungu anakaa.
- source_word: יוֹרִידוּ אֹתוֹ
  choice: wataishusha
  rationale: Hifili ya ירד hapa inahusu kuishusha au kuibomoa Maskani ili isafirishwe. ‘Wataishusha’ inadumisha taswira ya kitenzi cha Kiebrania bila kupoteza maana ya kiutendaji.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la kikabila na kiutumishi lililopewa jukumu la Maskani.
- source_word: וּבַחֲנֹת
  choice: wakati Maskani inapopiga kambi
  rationale: Mzizi חנה humaanisha kupiga kambi. Usemi huu unahifadhi sitiari ya Kiebrania inayofanya Maskani kuwa kiwakilishi cha mwendo wa kambi nzima.
- source_word: יָקִימוּ אֹתוֹ
  choice: wataisimamisha
  rationale: Hifili ya קום hapa ni kuisimamisha au kuijenga Maskani mahali pa kambi. ‘Wataisimamisha’ ni wazi na inalingana na ‘wataishusha.’
- source_word: וְהַזָּר
  choice: Mtu asiyeidhinishwa
  rationale: Katika muktadha wa patakatifu, זָר humaanisha mtu asiye na mamlaka ya kushiriki au kukaribia huduma takatifu, si lazima mgeni wa kikabila.
- source_word: הַקָּרֵב
  choice: atakayekaribia
  rationale: Kitenzi קרב kinaonyesha kusogea karibu na eneo au huduma takatifu; tafsiri hii inadumisha onyo bila kuongeza kitu kisichotajwa wazi.
- source_word: יוּמָת
  choice: atauawa
  rationale: Kauli ya Hofali ya מות inaonyesha kwamba adhabu ya kifo itatekelezwa juu ya mhusika, si kwamba atakufa tu kwa kawaida.
theological_decisions:
- issue: Asili ya adhabu katika יוּמָת
  choice: atauawa
  alternative: atakufa
  rationale: Hofali ya Kiebrania kwa kawaida inaonyesha kifo kinachosababishwa au kutekelezwa. ‘Atauawa’ inadumisha nguvu ya kisheria ya onyo bila kumtaja mtekelezaji.
- issue: Maana ya זָר
  choice: mtu asiyeidhinishwa katika huduma ya patakatifu
  alternative: mgeni wa kikabila au kila mtu asiye Mlawi
  rationale: Katika muktadha wa kikuhani na wa Maskani, neno hili hasa linaonyesha mtu aliye nje ya jukumu takatifu lililoidhinishwa. Tafsiri haifanyi kizuizi hicho kuwa suala la ukabila.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Maskani’ limetumiwa kama istilahi ya kibiblia iliyozoeleka; sentensi imehifadhi urari wa kushusha na kusimamisha pamoja na ukali wa onyo la mwisho.
