- source_word: וַיְדַבֵּר
  choice: Ndipo ... akasema
  rationale: Waw ya mfululizo inaendeleza simulizi; “Ndipo” huonyesha hatua inayofuata kwa Kiswahili cha kawaida, huku “akasema” ikitoa maana ya kitenzi דבר katika muktadha wa usemi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne YHWH limetoholewa moja kwa moja badala ya kubadilishwa na cheo “BWANA.” Umbo “Yahwe” linafuata tahajia ya kawaida ya Kiswahili.
- source_word: אֶל
  choice: na
  rationale: Katika Kiswahili, “kusema na mtu” ni njia ya kawaida ya kuonyesha mtu anayeambiwa, na hapa inawakilisha אֶל kwa lugha ya asili.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kitenzi-jina hiki kinaanzisha maneno ya moja kwa moja; “akisema” huhifadhi fomula ya Kiebrania na kutarajia usemi unaofuata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi YHWH. Kulitohowa kama “Yahwe” huhifadhi jina hilo badala ya kulibadilisha na cheo, huku tanbihi ikieleza desturi nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi na hadhi inayofaa maandiko. Muundo “akisema” umehifadhiwa kwa sababu mstari huu ni utangulizi wa maneno ya moja kwa moja katika mstari unaofuata.
