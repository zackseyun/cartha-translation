base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/036.yaml
  text: 'For the sons of Benjamin[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: sw
  text: 'Kwa wana wa Benyamini, kulingana na nasaba zao, kwa koo zao, kwa nyumba za baba zao, kwa hesabu ya majina, kuanzia umri wa miaka ishirini na kuendelea, kila mwanamume awezaye kwenda vitani[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania, kwa tafsiri ya karibu: “kila atokaye kwenda vitani”; usemi unaomaanisha wale waliostahili huduma ya kijeshi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי בִנְיָמִן
  choice: Kwa wana wa Benyamini
  rationale: Kiambishi לְ kinaanzisha kichwa cha kabila katika mfumo huu wa sensa. “Wana wa Benyamini” kinahifadhi lugha ya ukoo ya Kiebrania na pia kueleweka kama watu wa kabila hilo.
- source_word: תּוֹלְדֹתָם
  choice: kulingana na nasaba zao
  rationale: Katika muktadha wa sensa, neno hili linahusu mpangilio kwa ukoo au asili ya kizazi. “Nasaba zao” ni ya asili zaidi katika Kiswahili kuliko “vizazi vyao,” ambalo lingeweza kueleweka kuwa vipindi tofauti vya wakati.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה hapa ni kikundi cha ukoo ndani ya kabila; “koo” hukitofautisha na kabila zima na nyumba ya baba inayofuata.
- source_word: לְבֵית אֲבֹתָם
  choice: kwa nyumba za baba zao
  rationale: Tafsiri hii inahifadhi istilahi halisi ya kijamii na kiukoo ya Israeli bila kuibadili kuwa dhana pana zaidi ya familia.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: kwa hesabu ya majina
  rationale: Usemi huu unaonyesha kwamba watu walihesabiwa kwa majina. Muundo huu unadumisha mtindo rasmi wa taarifa ya sensa.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: kuanzia wenye umri wa miaka ishirini na zaidi
  rationale: Hii inaeleza kwa Kiswahili cha kawaida kiwango cha chini cha umri kilichowekwa na Kiebrania.
- source_word: כֹּל יֹצֵא צָבָא
  choice: kila mwanamume aliyeweza kwenda vitani
  rationale: Katika sensa hii, usemi wa Kiebrania unawahusu wanaume waliostahili huduma ya kijeshi. “Aliyeweza kwenda vitani” huwasilisha maana ya kiutendaji, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya maneno yenyewe.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo rasmi unaofaa taarifa ya sensa lakini kinachoeleweka kwa msomaji wa kawaida. Alama ya tanbihi imewekwa baada ya usemi unaofafanuliwa, si baada ya jina Benyamini.
