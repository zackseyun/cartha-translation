base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/034.yaml
  text: 'From the sons of Manasseh[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out for military service:'
translation:
  language: sw
  text: 'Kwa wana wa Manase, kulingana na vizazi vyao, koo zao, na nyumba za baba zao, kwa hesabu ya majina, kuanzia wenye umri wa miaka ishirini na zaidi, wanaume wote wanaoweza kwenda vitani[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanaume wote wanaotoka kwa ajili ya utumishi wa kijeshi.” Usemi wa Kiebrania unawahusu wale wanaostahili wajibu wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: Kwa wana wa Manase
  rationale: Kiambishi ל kinaanzisha kichwa cha kabila katika mfumo huu wa sensa. “Kwa wana wa Manase” kinahifadhi maana ya ukoo na muundo unaoendelea kutoka mistari inayozunguka.
- source_word: תּוֹלְדֹתָם
  choice: kulingana na vizazi vyao
  rationale: Neno hili hapa linaonyesha mistari ya nasaba au migawanyiko ya kizazi; tafsiri hii inadumisha lugha rasmi ya sensa bila kuibana kuwa historia ya ukoo tu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: koo zao
  rationale: Katika sensa ya kikabila, מִשְׁפָּחָה ni kundi la undugu ndani ya kabila; “koo” ni sahihi zaidi kuliko “familia,” ambalo linaweza kueleweka kama kaya ndogo.
- source_word: לְבֵית אֲבֹתָם
  choice: jamaa za baba zao
  rationale: Usemi huu unataja vitengo vya ukoo wa upande wa baba. “Jamaa za baba zao” ni Kiswahili cha kawaida na chenye kueleweka kuliko tafsiri ya neno kwa neno “nyumba za baba zao.”
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: kwa kuhesabu majina yao
  rationale: Usemi unahusu kuwahesabu watu mmoja mmoja kwa majina. Kauli hii ni ya kawaida katika Kiswahili na inabaki karibu na kazi ya kifungu cha Kiebrania.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: kuanzia wenye umri wa miaka ishirini na zaidi
  rationale: Huu ni usemi wa kiwango cha chini cha umri. Tafsiri hii ni ya sasa na wazi kwa wasomaji wa Kiswahili.
- source_word: כֹּל יֹצֵא צָבָא
  choice: kila mwanamume anayetoka kwenda vitani
  rationale: Katika muktadha huu, usemi wa umoja wa kiume unawahusu wanaume wa umri wa kuhesabiwa kwa jeshi. “Kwenda vitani” hudumisha picha ya Kiebrania ya kutoka kwa shughuli ya kijeshi, huku tanbihi ikieleza maana ya kustahili huduma hiyo.
theological_decisions:
- issue: Lugha ya kijinsia katika sensa
  choice: kila mwanamume anayetoka kwenda vitani
  alternative: kila mtu anayetoka kwenda vitani
  rationale: Muktadha ni sensa ya kijeshi ya wanaume wa Israeli wenye umri wa miaka ishirini na zaidi. Kutaja “mwanamume” kunahifadhi rejeo mahususi la kijinsia badala ya kulifanya kuwa la jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa orodha na alama ya nukta mbili umehifadhiwa kwa sababu mstari huu ni sehemu ya fomula ya sensa inayoendelea. Kiunganishi “na” kabla ya “jamaa za baba zao” kimetumiwa kwa mtiririko wa kawaida wa Kiswahili bila kufuta vipengele tofauti vya mpangilio wa ukoo.
