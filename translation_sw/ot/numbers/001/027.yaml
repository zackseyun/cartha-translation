  language: sw
  text: Wale waliohesabiwa kutoka kabila la Yuda walikuwa elfu sabini na nne na mia sita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walioandikishwa.” Kauli ya Kiebrania katika usemi huu wa sensa inaweza kutafsiriwa kwa namna zote mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: wale waliohesabiwa
  rationale: Kauli ya kutendwa kutoka mzizi פקד katika muktadha huu wa sensa inarejelea watu waliohesabiwa au kuandikishwa. Tafsiri hii ni ya kawaida katika Kiswahili na haiongezi neno ‘wanaume,’ ambalo halimo wazi katika mstari huu.
- source_word: לְמַטֵּה
  choice: kutoka kabila la
  rationale: Hapa kihusishi ל pamoja na מַטֶּה kinaonyesha uhusiano na kabila. ‘Kutoka kabila la’ ni usemi wa kawaida wa Kiswahili katika orodha hii ya sensa.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la jina la kabila hili katika Biblia za Kiswahili.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: elfu sabini na nne na mia sita
  rationale: Mpangilio wa Kiebrania una maana ya 74,600; umetolewa kwa mtindo wa kawaida na unaoeleweka wa kutaja idadi katika Kiswahili.
