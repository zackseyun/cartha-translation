base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/001.yaml
  text: Then Miriam and Aaron spoke against Moses because of the Cushite woman whom he had taken[b][a], for he had taken a Cushite woman.
translation:
  language: sw
  text: Miriamu na Haruni wakasema dhidi ya Musa kwa sababu ya mwanamke Mkushi[a] ambaye alikuwa amemwoa[b], kwa maana alikuwa amemwoa mwanamke Mkushi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanamke Mwethiopia.” Kiebrania kinasema “mwanamke Mkushi,” yaani mwanamke kutoka Kushi.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “alikuwa amemwoa” maana yake ya msingi ni “alikuwa amemchukua.” Katika muktadha huu ni nahau inayoweza kumaanisha “alikuwa amemwoa” au “alikuwa amemchukua kuwa mke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר ... בְּמֹשֶׁה
  choice: wakasema dhidi ya Musa
  rationale: Kitenzi דבר pamoja na kihusishi ב hapa kina maana ya kusema kwa uhasama dhidi ya mtu. Usemi huu unaonyesha upinzani bila kuongeza wazo mahususi la kulalamika au kukosoa ambalo halimo katika kitenzi chenyewe.
- source_word: מִרְיָם וְאַהֲרֹן
  choice: Miriamu na Haruni
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili, na mpangilio wa Kiebrania unaomtaja Miriamu kwanza umehifadhiwa.
- source_word: עַל אֹדוֹת
  choice: kwa sababu ya
  rationale: Kirai hiki kinaonyesha sababu au tukio lililochochea maneno yao; ‘kwa sababu ya’ ni Kiswahili cha kawaida chenye nguvu hiyo ya kisababishi.
- source_word: הָאִשָּׁה הַכֻּשִׁית
  choice: mwanamke Mkushi
  rationale: אִשָּׁה inaweza kumaanisha mwanamke au mke. ‘Mwanamke’ huhifadhi umbo la chanzo, huku muktadha wa kumwoa ukionyesha uhusiano wa ndoa. ‘Mkushi’ humtambulisha kama mtu wa Kushi bila kutumia jina la kijiografia la baadaye.
- source_word: אֲשֶׁר לָקָח
  choice: ambaye alikuwa amemwoa
  rationale: Ingawa לקח maana yake ya msingi ni ‘chukua,’ katika muktadha huu ni nahau ya kumchukua mwanamke kuwa mke, yaani kumwoa. Kiswahili ‘amemchukua’ kingeweza kueleweka vibaya kama kumwondoa au kumteka, kwa hiyo maana ya nahau imetolewa katika matini na maana halisi imeelezwa katika tanbihi.
- source_word: כִּי
  choice: kwa maana
  rationale: Neno hili linaanzisha maelezo yanayorudia na kusisitiza sababu iliyotajwa tayari.
- source_word: אִשָּׁה כֻשִׁית לָקָח
  choice: alikuwa amemwoa mwanamke Mkushi
  rationale: Marudio ya Kiebrania yamehifadhiwa badala ya kulainishwa, kwa kuwa yanatia mkazo jambo lililosababisha maneno dhidi ya Musa.
theological_decisions:
- issue: Utambulisho wa kikabila au kijiografia wa mke wa Musa
  choice: Kutafsiri כֻשִׁית kuwa ‘Mkushi’ bila kumtambulisha moja kwa moja na Sipora au Wamidiani.
  alternative: Kutumia ‘Mwethiopia’ au kufasiri kwamba mwanamke huyu lazima awe Sipora.
  rationale: Aya yenyewe inamwita mwanamke huyo Mkushi. Tafsiri inahifadhi jina hilo bila kuamua mijadala ya kihistoria au kuoanisha kimafundisho taarifa ambazo aya hii haifafanui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Marudio ya chanzo yamehifadhiwa. ‘Mkushi’ ni sahihi zaidi kihistoria kuliko ‘Mwethiopia,’ na ‘kumwoa’ huepuka utata usiofaa wa ‘kumchukua’ katika Kiswahili.
