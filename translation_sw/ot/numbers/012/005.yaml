id: NUM.12.5
reference: Numbers 12:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בְּ/עַמּ֣וּד עָנָ֔ן וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וַ/יִּקְרָא֙ אַהֲרֹ֣ן וּ/מִרְיָ֔ם וַ/יֵּצְא֖וּ שְׁנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/005.yaml
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance of the tent[a], and he called Aaron and Miriam[b], and both of them came forward.
translation:
  language: sw
  text: Ndipo Yahweh akashuka katika nguzo ya wingu, akasimama mlangoni mwa hema[a], akawaita Haruni na Miriamu, nao wote wawili wakasogea mbele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hema.” Katika muktadha huu ni hema la kukutania.'
    reason: cross_reference
  - marker: b
    text: Au “nao wote wawili wakatoka nje.” Kitenzi cha Kiebrania kwa maana halisi ni “walitoka,” lakini hapa huenda kinamaanisha kwamba walisogea mbele walipoitwa na Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: Kitenzi ירד kina maana ya kushuka. “Akashuka” ni cha kawaida na kinahifadhi taswira halisi ya mwendo katika simulizi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: בְּעַמּוּד עָנָן
  choice: katika nguzo ya wingu
  rationale: Hiki kinaonyesha namna au udhihirisho ambao Yahweh alitumia aliposhuka; “katika” kinawasilisha kwa kawaida maana hiyo.
- source_word: וַיַּעֲמֹד
  choice: akasimama
  rationale: Tafsiri ya moja kwa moja inayofuata mfululizo wa vitendo vya simulizi.
- source_word: פֶּתַח הָאֹהֶל
  choice: mlangoni pa hema
  rationale: פתח ni sehemu ya kuingilia au mlango. Usemi huu ni wa asili katika Kiswahili, huku “hema” ikifuata neno fupi lililo katika Kiebrania.
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: קרא hapa ni kuita watu kwa majina ili waje mbele; “akawaita” ni wazi na ya kawaida.
- source_word: אַהֲרֹן וּמִרְיָם
  choice: Haruni na Miriamu
  rationale: Haya ndiyo maumbo ya majina yaliyozoeleka katika Kiswahili sanifu cha Biblia.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: nao wote wawili wakasogea mbele
  rationale: יצא kwa msingi ni kutoka, lakini katika muktadha wa kuitwa mbele za Yahweh inaelekea kumaanisha kwamba walijitokeza au walisogea mbele. “Wote wawili” kinahifadhi msisitizo wa שְׁנֵיהֶם; tanbihi inahifadhi maana halisi mbadala.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: “Yahweh” linahifadhi jina binafsi lililo katika matini bila kulibadilisha kuwa cheo au kuingiza mapokeo maalumu ya dhehebu.
- issue: Lugha inayomweleza Yahweh akishuka
  choice: Kuhifadhi lugha halisi “akashuka”
  alternative: Kutafsiri kwa ufafanuzi kama “akatokea”
  rationale: Kiebrania kinatumia wazi kitenzi cha kushuka. Kukihifadhi kunaendeleza taswira ya udhihirisho wa Mungu bila kujaribu kutatua maana yake kiteolojia.
- issue: Mwelekeo wa tendo katika וַיֵּצְאוּ
  choice: wakasogea mbele
  alternative: wakatoka nje
  rationale: Muktadha unaonyesha mwitikio wao walipoitwa, lakini maana ya msingi ya kitenzi ni “kutoka.” Tafsiri kuu inatoa maana inayowezekana katika tukio, na tanbihi inalinda uwezekano wa usomaji halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa heshima, wa sasa, na rahisi kueleweka. Viunganishi vya “aka-” vinadumisha mfuatano wa haraka wa matendo ya Kiebrania bila kufanya sentensi kuwa nzito.
