base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/013.yaml
  text: So Moses cried out to Yahweh[a], saying, “O God, please heal her.”
translation:
  language: sw
  text: Ndipo Musa akamlilia Yahweh, akisema, “Ee Mungu, tafadhali mponye!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Ee Mungu, tafadhali mponye, tafadhali”—kurudiwa kwa “tafadhali” kunasisitiza jinsi ombi la Musa lilivyokuwa la dharura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: akamlilia
  rationale: Kitenzi צעק kinaonyesha kilio chenye nguvu au ombi la dharura. “Akamlilia” ni Kiswahili cha kawaida kinachoonyesha uzito wa maombezi ya Musa bila kudokeza tu kupaza sauti.
- source_word: אֶל
  choice: -m- katika “akamlilia”
  rationale: Kihusishi אֶל kinaonyesha anayeelekezewa kilio; maana hiyo imejumuishwa kwa kawaida katika kitenzi “akamlilia.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahweh” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hiki ni kifungu kinachoanzisha maneno ya ombi la Musa; “akisema” ni cha asili na kifupi.
- source_word: אֵל
  choice: Ee Mungu
  rationale: אֵל hapa ni mwito wa moja kwa moja katika sala. “Ee Mungu” huhifadhi matumizi hayo kwa lugha ya heshima na ya kawaida.
- source_word: נָא ... נָא
  choice: tafadhali
  rationale: Chembe נָא imerudiwa ili kusisitiza ombi la dharura. Katika matini kuu, “tafadhali” moja inatoa ombi hilo kwa Kiswahili cha asili; urudiaji wa Kiebrania umehifadhiwa katika tanbihi.
- source_word: רְפָא
  choice: mponye
  rationale: Amri רְפָא inaomba uponyaji wa Miriamu. “Mponye” ni tafsiri ya moja kwa moja na pia inaonyesha wazi mtendewa wa kike.
- source_word: לָהּ
  choice: m- katika “mponye”
  rationale: Kiambishi cha nafsi ya tatu ya kike kinachomrejelea Miriamu kimewakilishwa kwa kiambishi cha yambwa “m-” katika “mponye.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Aya yenyewe inatumia Tetragramatoni יהוה. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuongeza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akamlilia” huhifadhi uzito wa צעק kwa mtindo wa kawaida; sentensi ya sala imesawazishwa ili isikike kiasili, huku urudiaji halisi wa נָא ukielezwa katika tanbihi.
