  yaml_path: translation/ot/numbers/012/004.yaml
  text: And Yahweh said suddenly to Moses and to Aaron and to Miriam[a], “Come out, you three[b], to the tent of meeting.” And the three of them went out.
translation:
  language: sw
  text: Mara Yahweh akawaambia Mose, Haruni, na Miriamu, “Tokeni[a], ninyi watatu, mje kwenye Hema la Kukutania.” Nao wote watatu wakatoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Njooni nje.” Kitenzi cha Kiebrania kinaonyesha kutoka mahali fulani; kulingana na mtazamo wa msemaji, kinaweza kutafsiriwa “tokeni” au “njooni nje.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja katika Kiebrania; linatunzwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: פִּתְאֹם
  choice: ghafla
  rationale: Neno hili linaonyesha kwamba Yahweh alisema bila kutazamiwa na kwa haraka; “ghafla” ni Kiswahili cha kawaida chenye nguvu hiyo ya kisimulizi.
- source_word: צְאוּ
  choice: Tokeni
  rationale: Amri ya יצא inaashiria kusonga kutoka mahali walipokuwa. “Tokeni” ni amri ya wingi ya kawaida; mwelekeo wenyewe unaweza kueleweka kama “tokeni” au “njooni nje.”
- source_word: שְׁלָשְׁתְּכֶם
  choice: ninyi watatu
  rationale: Huhifadhi msisitizo wa Kiebrania kwamba watu wote watatu walioitwa walipaswa kwenda pamoja.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Ni tafsiri ya kawaida na inayoeleweka ya mahali maalumu pa kukutana na Mungu.
- source_word: וַיֵּצְאוּ
  choice: wakatoka
  rationale: Muundo wa kisimulizi unaendeleza mfululizo wa matukio kwa kawaida katika Kiswahili.
- source_word: שְׁלָשְׁתָּם
  choice: wote watatu
  rationale: Huhifadhi urudiaji na msisitizo kwamba hao watatu waliitii amri.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia Tetragramatoni yenyewe; “Yahweh” hulihifadhi kama jina la agano badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa majina umerahisishwa kwa ufasaha bila kupoteza kwamba Yahweh aliwaambia kila mmoja wao. “Nao wote watatu” huhifadhi msisitizo wa Kiebrania.
