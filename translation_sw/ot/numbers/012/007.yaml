  yaml_path: translation/ot/numbers/012/007.yaml
  text: Not so with my servant Moses[a]; he is faithful in all my house.
translation:
  language: sw
  text: Lakini sivyo ilivyo kwa mtumishi wangu Musa; yeye ni mwaminifu katika nyumba yangu yote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kaya yangu yote.” Neno la Kiebrania linalotafsiriwa “nyumba” linaweza kumaanisha kaya au milki, si jengo tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Lakini si hivyo
  rationale: Nahau hii ni kanusho lenye mkazo linalomtofautisha Musa na manabii waliotajwa kabla yake. “Lakini si hivyo” ni ya kawaida katika Kiswahili na inaonyesha wazi ulinganisho huo.
- source_word: עַבְדִּי
  choice: mtumishi wangu
  rationale: Ingawa עֶבֶד inaweza kumaanisha mtumwa, hapa ni cheo cha heshima kinachoonyesha huduma na uhusiano rasmi wa Musa na Mungu, si hasa hali ya utumwa.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Jina hili limetolewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בְּכָל בֵּיתִי
  choice: katika nyumba yangu yote
  rationale: Tafsiri hii inadumisha kihusishi na sitiari ya Kiebrania ya “nyumba,” bila kuifafanua moja kwa moja kuwa kaya, watu, au eneo la mamlaka.
- source_word: נֶאֱמָן
  choice: mwaminifu
  rationale: Neno hili huonyesha mtu anayetegemeka na kustahili kuaminiwa. “Mwaminifu” ni tafsiri ya kawaida, yenye heshima, na inayofaa katika kauli ya Mungu kuhusu Musa.
- source_word: הוּא
  choice: yeye ni
  rationale: Kiwakilishi huru cha Kiebrania kimewakilishwa kwa “yeye,” nacho pamoja na “ni” kinatoa sentensi iliyo wazi na ya asili katika Kiswahili.
theological_decisions:
- issue: Maana ya “nyumba yangu” kuhusiana na nafasi ya Musa
  choice: Kudumisha sitiari “nyumba yangu” katika maandishi makuu
  alternative: katika kaya yangu yote; miongoni mwa watu wangu wote
  rationale: Kiebrania kinaweza kurejelea kaya au eneo lote lililo chini ya Mungu, kutia ndani jumuiya yake ya agano. Hata hivyo, kudumisha “nyumba” kunahifadhi utata halisi na mwangwi wake katika vifungu vingine vya Biblia bila kuamua maana finyu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Mpangilio wa sentensi umefanywa wa asili katika Kiswahili huku mkazo wa kanusho, hadhi ya Musa, na sitiari ya “nyumba” vikihifadhiwa.
