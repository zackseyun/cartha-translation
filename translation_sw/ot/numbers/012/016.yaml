base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/016.yaml
  text: Afterward the people set out from Hazeroth and camped in the wilderness of Paran.
translation:
  language: sw
  text: Baada ya hayo, watu waliondoka Haserothi, wakapiga kambi katika nyika ya Parani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: Baada ya hayo
  rationale: Huonyesha mfuatano wa wakati baada ya matukio yaliyotangulia; ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: נָסְעוּ
  choice: waliondoka
  rationale: Katika simulizi za safari ya jangwani, kitenzi hiki humaanisha kuondoa kambi na kuanza safari; “waliondoka” ni cha asili na kinaeleweka vizuri katika muktadha huu.
- source_word: הָעָם
  choice: watu
  rationale: Hurejelea jumuiya ya Waisraeli kwa pamoja; “watu” ndilo neno la kawaida na linalofaa hapa.
- source_word: מֵחֲצֵרוֹת
  choice: Haserothi
  rationale: Ni jina la mahali, limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Hueleza kusimama na kuweka kambi; usemi huu ni wa sasa, wazi, na wa kawaida kuliko “wakapiga hema” au “wakafanya kambi.”
- source_word: בְּמִדְבַּר
  choice: katika nyika ya
  rationale: מִדְבָּר ni eneo kame lisilokaliwa sana; “nyika” huhifadhi maana ya kijiografia ya safari bila kulazimisha dhana ya jangwa la mchanga pekee.
- source_word: פָּארָן
  choice: Parani
  rationale: Ni jina la mahali, limetoholewa kwa namna ya kawaida katika Kiswahili.
