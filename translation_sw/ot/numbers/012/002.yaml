  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ הֲ/רַ֤ק אַךְ בְּ/מֹשֶׁה֙ דִּבֶּ֣ר יְהוָ֔ה הֲ/לֹ֖א גַּם בָּ֣/נוּ דִבֵּ֑ר וַ/יִּשְׁמַ֖ע יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/002.yaml
  text: And they said[a], “Has Yahweh indeed spoken only through Moses? Has he not also spoken through us?” And Yahweh heard it.
translation:
  language: sw
  text: Wakasema[a], “Je, kweli Yahweh amesema kupitia Musa peke yake? Je, hajasema pia kupitia sisi?” Yahweh akayasikia hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, kweli Yahweh amesema na Musa peke yake? Je, hajasema nasi pia?” Kihusishi cha Kiebrania kinaweza kuonyesha ama mpokeaji wa maneno ya Mungu ama mtu ambaye Mungu anasema kupitia kwake. Matini kuu imetumia “kupitia” kwa sababu muktadha unahusu mamlaka ya kinabii.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Wakasema
  rationale: Kitenzi cha simulizi kinaendeleza mfuatano wa matukio na kuanzisha maneno ya moja kwa moja kwa njia ya kawaida katika Kiswahili.
- source_word: הֲרַק אַךְ
  choice: Je, kweli ... peke yake?
  rationale: Muundo huu unahifadhi swali la kupinga pamoja na msisitizo wa maana ya ‘kweli’ na ‘peke yake’.
- source_word: בְּמֹשֶׁה
  choice: kupitia Musa
  rationale: Katika muktadha wa usemi wa kinabii, kihusishi ב kinaweza kumtaja mpokeaji au njia ya kufikisha ujumbe. ‘Kupitia Musa’ linafaa zaidi hapa kwa kuwa hoja inahusu mamlaka ya kinabii.
- source_word: דִּבֶּר יְהוָה
  choice: Yahweh amesema
  rationale: ‘Amesema’ ni Kiswahili cha kawaida na chenye hadhi kwa usemi wa Mungu, huku wakati timilifu ukilingana na tendo lililokwisha kutokea.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Kiebrania linatunzwa kwa namna ya ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: הֲלֹא גַּם בָּנוּ דִבֵּר
  choice: Je, hajasema pia kupitia sisi?
  rationale: Kihusishi kimetafsiriwa sawasawa na kifungu cha kwanza ili kuonyesha madai kwamba wao pia ni njia ya usemi wa Mungu.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: Yahweh akayasikia hayo
  rationale: Kiebrania hakitaji wazi kitu kilichosikiwa; ‘hayo’ kinaweka wazi kwa Kiswahili kwamba Yahweh alisikia maneno yao bila kuongeza wazo jipya.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini inatumia jina la agano יהוה moja kwa moja; ‘Yahweh’ linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Ikiwa ב pamoja na דבר humaanisha mpokeaji au njia ya usemi
  choice: kupitia Musa / kupitia sisi
  alternative: na Musa / nasi
  rationale: Muktadha unahusu hadhi na mamlaka ya kinabii ya Musa, Miriamu na Haruni. Hata hivyo, Kiebrania kinaweza pia kueleweka kuwa Yahweh alisema nao; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Maswali yameundwa kwa mtindo wa kawaida wa Kiswahili huku yakihifadhi ukali wa changamoto iliyomo katika Kiebrania.
