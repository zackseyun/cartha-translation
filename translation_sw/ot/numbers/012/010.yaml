base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/010.yaml
  text: And the cloud departed from over the tent[a], and behold, Miriam was leprous, like snow. Then Aaron turned toward Miriam, and behold, she was leprous.
translation:
  language: sw
  text: Wingu likaondoka kutoka juu ya hema, na tazama, Miriamu alikuwa na ugonjwa wa ngozi[a], akiwa mweupe kama theluji. Aroni akageuka kumwelekea Miriamu, na tazama, alikuwa na ugonjwa wa ngozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “ugonjwa wa ngozi” linaweza kurejelea kwa upana ugonjwa mbaya wa ngozi au hali ya ngozi inayomfanya mtu kuwa najisi kiibada; si lazima liwe ukoma unaotambuliwa na tiba ya kisasa kuwa ugonjwa wa Hansen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָנָן
  choice: wingu
  rationale: Nomino hii ina kibainishi na katika muktadha ni wingu linalohusishwa na uwepo wa BWANA; “wingu” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: סָר
  choice: likaondoka
  rationale: Kitenzi kinaonyesha kuondoka au kujiondoa mahali; “likaondoka” ni cha asili katika Kiswahili na kinafaa kwa wingu lililokuwa juu ya hema.
- source_word: מֵעַל הָאֹהֶל
  choice: kutoka juu ya hema
  rationale: מֵעַל huonyesha mwendo wa kuondoka katika nafasi ya juu ya kitu. Tafsiri hii inadumisha maana hiyo bila kufafanua zaidi ya maandishi.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Chembe hii huwasilisha jambo kwa msisitizo na mshangao. “Tazama” inadumisha nguvu ya kisimulizi na inafaa kwa lugha yenye hadhi.
- source_word: מְצֹרַעַת
  choice: alikuwa na ugonjwa wa ngozi
  rationale: Neno la Kiebrania linaweza kumaanisha hali mbalimbali za ngozi na si lazima ugonjwa unaoitwa ukoma katika tiba ya kisasa. Tafsiri pana huepuka kulifungamanisha kimakosa na ugonjwa wa Hansen huku tanbihi ikihifadhi maelezo ya kileksika.
- source_word: כַּשָּׁלֶג
  choice: kama theluji
  rationale: Hii inadumisha tashbihi fupi ya Kiebrania bila kuongeza waziwazi kwamba kinacholinganishwa ni weupe, jambo ambalo maandishi yenyewe hayalisemi moja kwa moja.
- source_word: וַיִּפֶן ... אֶל מִרְיָם
  choice: akageuka kumwelekea Miriamu
  rationale: Muundo huu unaonyesha Aroni akibadili mwelekeo na kumkabili Miriamu, na unasomeka kwa kawaida katika Kiswahili.
- source_word: וְהִנֵּה מְצֹרָעַת
  choice: na tazama, alikuwa na ugonjwa huo wa ngozi
  rationale: Kiwakilishi kinarejelea Miriamu aliyetajwa mara moja kabla, huku “huo” kikidumisha marudio yenye msisitizo bila kurudia jina lake.
