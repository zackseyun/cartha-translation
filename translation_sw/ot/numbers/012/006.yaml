base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
translation:
  language: sw
  text: 'Akasema, “Sikilizeni sasa maneno yangu: ikiwa kuna nabii miongoni mwenu[a], mimi, Yahwe, nitajifunua kwake[b] katika maono; nitasema naye katika ndoto[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa mmoja wenu ni nabii.” Kiebrania kinasema kihalisi karibu na “ikiwa yupo nabii wenu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nitajitambulisha kwake,” yaani, nitajifanya nijulikane kwake.
    reason: lexical_alternative
  - marker: c
    text: Au, “nitasema kwake.” Kiebrania kinaweza kueleweka kuwa kusema naye au kusema kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Kauli ya kawaida ya masimulizi inayotanguliza maneno ya moja kwa moja; Kiswahili hakihitaji kuongeza kiunganishi ili kudumisha mtiririko.
- source_word: שִׁמְעוּ נָא
  choice: Sikilizeni sasa
  rationale: Amri ya wingi pamoja na נָא ni mwito wa kusikiliza kwa makini na kwa uzito; “sasa” inadumisha msisitizo wake kwa lugha ya kawaida.
- source_word: דְבָרָי
  choice: maneno yangu
  rationale: Huu ni wingi wenye kiambishi cha nafsi ya kwanza, na tafsiri hii ni ya moja kwa moja na yenye hadhi.
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  choice: Ikiwa kuna nabii miongoni mwenu
  rationale: Muundo wa Kiebrania ni halisi karibu na “ikiwa yupo nabii wenu”; Kiswahili hiki kinaeleza kwa kawaida kwamba nabii huyo ni mmoja wa jumuiya yao bila kuondoa hali ya sharti.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja katika chanzo; “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- source_word: בַּמַּרְאָה
  choice: katika maono
  rationale: מַרְאָה hapa humaanisha ufunuo au mwonekano wa kinabii; “katika maono” ni Kiswahili cha kawaida kinachoonyesha njia ya ufunuo.
- source_word: אֵלָיו אֶתְוַדָּע
  choice: nitajifunua kwake
  rationale: Kitenzi cha Kiebrania kina maana ya kujifanya ajulikane au kujidhihirisha; “nitajifunua kwake” ni cha kawaida na huhifadhi wazo la Mungu kujidhihirisha mwenyewe.
- source_word: בַּחֲלוֹם
  choice: katika ndoto
  rationale: Kirai hiki kinataja njia au mazingira ya mawasiliano ya Mungu na kinatafsirika kwa kawaida kuwa “katika ndoto.”
- source_word: אֲדַבֶּר בּוֹ
  choice: nitasema naye
  rationale: Kihusishi בּוֹ kinaweza kueleweka kuwa kusema naye au kwake; “nitasema naye” ni Kiswahili cha kawaida na kinadumisha kwa karibu wazo la kuzungumza na mtu.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu, hivyo linahifadhiwa kwa umbo la Kiswahili “Yahwe” badala ya kubadilishwa kuwa cheo.
- issue: Njia ya ufunuo wa kinabii
  choice: Mungu hujifunua katika maono na kusema katika ndoto
  alternative: Mungu huonekana katika maono na kusema kupitia ndoto
  rationale: Tafsiri inadumisha ulinganifu wa chanzo kati ya maono na ndoto bila kuongeza madai kuhusu namna halisi ya ufunuo au mafundisho ya baadaye kuhusu unabii.
- issue: Maana ya אֲדַבֶּר בּוֹ
  choice: nitasema naye
  alternative: nitasema kwake
  rationale: Kihusishi cha Kiebrania kinaweza kuwakilisha kusema “na” au “kwa” mtu. Chaguo kuu ni la asili katika Kiswahili, na tanbihi inadumisha uwezekano mwingine bila kuamua zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Sikilizeni sasa” huleta uzito wa mwito wa Mungu bila kuwa cha kizamani; “maono” na “ndoto” ni istilahi za kawaida na zinazoeleweka kwa wasomaji wengi.
