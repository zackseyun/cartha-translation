  yaml_path: translation/ot/numbers/012/009.yaml
  text: And Yahweh’s anger burned against them[a], and he departed.
translation:
  language: sw
  text: Hasira ya Yahweh ikawaka dhidi yao[a], naye akaondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “pua ya Yahweh ikawaka dhidi yao,” nahau yenye maana ya “hasira ya Yahweh ikawaka dhidi yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר
  choice: ikawaka
  rationale: Kitenzi חרה katika nahau hii huonyesha hasira kuwa moto au kuwaka. “Ikawaka” ni Kiswahili cha kawaida kinachohifadhi taswira ya joto ya Kiebrania.
- source_word: אַף
  choice: hasira
  rationale: Neno hili kwa maana halisi ni “pua,” lakini likitumiwa pamoja na חרה ni nahau inayomaanisha hasira. “Hasira” hutoa maana ya nahau bila kutumia neno zito zaidi lisilohitajika.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetafsiriwa kwa kulinakili kama “Yahweh,” badala ya kulibadilisha kuwa cheo, ili kuhifadhi jina la kibinafsi lililo katika maandishi.
- source_word: בָּם
  choice: dhidi yao
  rationale: Katika nahau ya hasira, kihusishi hiki huonyesha wale ambao hasira inawalenga; “dhidi yao” ni wazi na ya kawaida katika Kiswahili.
- source_word: וַיֵּלַךְ
  choice: akaondoka
  rationale: Katika muktadha huu הלך inaonyesha Yahweh kuondoka baada ya kusema. “Akaondoka” ni fupi, ya asili, na haiongezi maelezo yasiyomo katika maandishi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יהוה. “Yahweh” huhifadhi jina hilo badala ya kuweka cheo mahali pake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “Hasira ... ikawaka” ni wa kawaida na unahifadhi sitiari ya Kiebrania; “naye akaondoka” hudumisha mfuatano mfupi wa simulizi.
