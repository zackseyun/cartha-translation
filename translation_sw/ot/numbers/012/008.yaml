  text: פֶּ֣ה אֶל פֶּ֞ה אֲדַבֶּר בּ֗/וֹ וּ/מַרְאֶה֙ וְ/לֹ֣א בְ/חִידֹ֔ת וּ/תְמֻנַ֥ת יְהוָ֖ה יַבִּ֑יט וּ/מַדּ֨וּעַ֙ לֹ֣א יְרֵאתֶ֔ם לְ/דַבֵּ֖ר בְּ/עַבְדִּ֥/י בְ/מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/008.yaml
  text: Mouth to mouth I speak with him[a], plainly and not in riddles; and he beholds the form of Yahweh. So why were you not afraid to speak against my servant[b], against Moses?
translation:
  language: sw
  text: Ninasema naye mdomo kwa mdomo[a], waziwazi wala si kwa mafumbo; naye analitazama umbo la Yahweh[b]. Basi kwa nini hamkuogopa kusema dhidi ya mtumishi wangu, dhidi ya Musa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uso kwa uso.” Kiebrania kinasema kihalisi “mdomo kwa mdomo,” kikisisitiza mawasiliano ya moja kwa moja.
    reason: lexical_alternative
  - marker: b
    text: Au “mfano wa Yahweh” au “sura ya Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה אֶל פֶּה
  choice: mdomo kwa mdomo
  rationale: Nahau ya Kiebrania imetafsiriwa kwa ukaribu ili kuhifadhi picha yake ya mawasiliano ya moja kwa moja; tanbihi inaeleza maana mbadala ya ‘uso kwa uso.’
- source_word: אֲדַבֶּר בּוֹ
  choice: ninasema naye
  rationale: Kitenzi pamoja na kihusishi ב hapa kinaonyesha kusema pamoja na mtu au kuzungumza naye, si kumwelekezea maneno tu.
- source_word: וּמַרְאֶה
  choice: waziwazi
  rationale: Katika mlingano na ‘si kwa mafumbo,’ neno hili linaonyesha uwazi wa ufunuo au mawasiliano; tafsiri ya kielezi ni ya asili katika Kiswahili.
- source_word: וְלֹא בְחִידֹת
  choice: wala si kwa mafumbo
  rationale: חִידוֹת ni semi za kifumbo au mafumbo; ‘mafumbo’ ni neno la kawaida na linahifadhi utofauti na mawasiliano ya wazi.
- source_word: וּתְמֻנַת יְהוָה
  choice: umbo la Yahweh
  rationale: תְּמוּנָה linaweza kumaanisha umbo, mfano, au sura inayoonekana. ‘Umbo’ huhifadhi udhahiri wa usemi bila kufafanua kupita kiasi namna Mungu alivyojidhihirisha.
- source_word: יַבִּיט
  choice: anautazama
  rationale: Kitenzi kinaonyesha kutazama kwa makusudi; ‘anautazama’ ni cha kawaida lakini bado kina uzito unaofaa.
- source_word: וּמַדּוּעַ
  choice: Basi kwa nini
  rationale: Muunganiko huu unaingiza hitimisho la kimantiki na swali la kukemea kutokana na kauli iliyotangulia.
- source_word: לֹא יְרֵאתֶם
  choice: hamkuogopa
  rationale: Huhifadhi maana ya hofu inayotarajiwa mbele ya uzito wa kosa, kwa Kiswahili cha kawaida.
- source_word: לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  choice: kusema dhidi ya mtumishi wangu, dhidi ya Musa
  rationale: Kurudiwa kwa kihusishi ב kumedumishwa kwa kurudia ‘dhidi ya,’ na hivyo kuhifadhi msisitizo na uhusiano wa kiambatisho wa ‘mtumishi wangu’ na ‘Musa.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano YHWH moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maelezo ya ufunuo wa pekee kwa Musa
  choice: umbo la Yahweh
  alternative: mfano wa Yahweh au sura ya Yahweh
  rationale: ‘Umbo’ linadumisha dai lenye nguvu la maandishi huku likiacha wazi hali halisi ya kujidhihirisha kwa Mungu, bila kutatua kimya kimya mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mdomo kwa mdomo’ limehifadhiwa kwa sababu ni taswira mahsusi ya Kiebrania, huku tanbihi ikisaidia msomaji. Muundo wa ‘dhidi ya mtumishi wangu, dhidi ya Musa’ ni wa makusudi ili kuonyesha kurudiwa kwa kihusishi katika chanzo.
