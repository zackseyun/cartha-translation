  yaml_path: translation/ot/numbers/012/015.yaml
  text: So Miriam was confined outside the camp for seven days, and the people did not set out until Miriam was brought back in.
translation:
  language: sw
  text: Basi Miriamu akatengwa nje ya kambi kwa siku saba, na watu hawakuondoka mpaka Miriamu alipoingizwa tena.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “mpaka Miriamu alipokusanywa.” Hapa kitenzi “kukusanya” kinamaanisha kurudishwa kwake kambini baada ya kipindi cha kutengwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּסָּגֵר
  choice: akatengwa
  rationale: Nifali ya סגר inaonyesha hali ya kufungiwa au kutengwa. Katika muktadha huu, “akatengwa” linaeleza kwa Kiswahili cha kawaida kwamba Miriamu aliondolewa katika jamii kwa muda.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya mahali alikowekwa katika mazingira ya safari ya jangwani.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Kirai hiki kinaonyesha muda, na “kwa siku saba” ni Kiswahili cha kawaida na sahihi.
- source_word: הָעָם
  choice: watu
  rationale: Katika simulizi hili neno hilo linamaanisha jumuiya ya Israeli iliyokuwa safarini.
- source_word: לֹא נָסַע
  choice: hawakuondoka
  rationale: נסע katika simulizi za jangwani humaanisha kung’oa kambi na kuanza safari. “Hawakuondoka” ni wazi na ya asili katika Kiswahili, huku muktadha ukibainisha maana ya kuendelea na safari.
- source_word: עַד הֵאָסֵף מִרְיָם
  choice: mpaka Miriamu alipoingizwa tena
  rationale: Nifali ya אסף hapa inaelekeza kwenye kukusanywa au kuingizwa kwa Miriamu katika kambi baada ya kipindi cha kutengwa. “Alipoingizwa tena” huwasilisha kurejeshwa kwake kwa lugha ya kawaida; tanbihi huhifadhi usemi halisi zaidi wa Kiebrania.
