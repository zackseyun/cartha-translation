  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akatengwa” huepuka taswira isiyofaa ya kufungiwa ndani ilhali alikuwa nje ya kambi; “alipoingizwa tena” huonyesha kurejeshwa kwake bila kuongeza maelezo ya kimadhehebu.
