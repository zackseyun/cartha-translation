base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/014.yaml
  text: And Yahweh said to Moses[a], “If her father had spit in her face, would she not be disgraced for seven days? Let her be shut up outside the camp for seven days[b], and afterward she may be brought back in.”
translation:
  language: sw
  text: Yahwe akamwambia Musa, “Kama baba yake angemtemea usoni, je, hangefedheheka kwa siku saba?[a] Atengwe nje ya kambi kwa siku saba, kisha arudishwe kambini.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hangeaibika kwa siku saba?”
    reason: lexical_alternative
  - marker: b
    text: Au, “baadaye akusanywe tena.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo la Kiswahili linalotambulika, badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: יָרֹק יָרַק
  choice: angemtemea
  rationale: Muundo wa Kiebrania unasisitiza tendo katika hali ya kudhaniwa; hali ya masharti ya Kiswahili inaleta maana hiyo kwa kawaida bila kurudia kitenzi kwa namna isiyo ya kawaida.
- source_word: בְּפָנֶיהָ
  choice: usoni
  rationale: Hii ndiyo kauli ya kawaida ya Kiswahili kwa tendo la kumtemea mtu moja kwa moja usoni, lenye maana ya kumdhalilisha.
- source_word: תִכָּלֵם
  choice: hangefedheheka
  rationale: Kitenzi kinaonyesha kutiwa aibu au kudhalilishwa mbele ya wengine; ‘kufedheheka’ huhifadhi upande huo wa kijamii katika swali la balagha.
- source_word: תִּסָּגֵר
  choice: atengwe
  rationale: Hali ya kutendwa na muktadha vinaonyesha kufungiwa mbali na jumuiya. ‘Atengwe nje ya kambi’ ni Kiswahili cha kawaida na huepuka wazo lisilokusudiwa la kufungwa gerezani.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Ni tafsiri ya moja kwa moja, wazi, na ya kawaida ya mahali pa kutengwa.
- source_word: תֵּאָסֵף
  choice: arudishwe kambini
  rationale: Hali ya kutendwa imehifadhiwa, na katika muktadha huu kitenzi kinamaanisha kurudishwa ndani ya kambi na jumuiya baada ya muda wa kutengwa.
theological_decisions:
- issue: Asili ya kauli kuhusu baba kumtemea usoni
  choice: Mfano wa kudhaniwa unaoeleza fedheha na kutengwa
  alternative: Kumbukumbu halisi ya tukio lililokuwa limetokea
  rationale: Muundo wa Kiebrania ni swali la balagha lenye hali ya kudhaniwa, linalotumiwa kuhalalisha siku saba za kutengwa; tafsiri haiongezi maana ya kiishara au ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Swali la balagha na hali ya kutendwa zimehifadhiwa; alama za tanbihi zimewekwa baada ya vifungu vinavyohusika.
