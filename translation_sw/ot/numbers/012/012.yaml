  text: אַל נָ֥א תְהִ֖י כַּ/מֵּ֑ת אֲשֶׁ֤ר בְּ/צֵאת/וֹ֙ מֵ/רֶ֣חֶם אִמּ֔/וֹ וַ/יֵּאָכֵ֖ל חֲצִ֥י בְשָׂרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/012.yaml
  text: Please[a], do not let her be like one dead, whose flesh is half consumed when he comes out of his mother’s womb.
translation:
  language: sw
  text: Tafadhali, usimwache awe kama mfu, ambaye nusu ya nyama yake imeliwa anapotoka katika tumbo la mama yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama mtoto aliyezaliwa mfu, ambaye nusu ya nyama yake imeliwa anapotoka katika tumbo la mama yake.” Kiebrania kinamlinganisha na mfu; kishazi kinachofuata hutoa taswira ya kutoka tumboni. Tafsiri nyingine hufanya taswira ya mtoto aliyezaliwa mfu iwe wazi katika maandishi makuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: Tafadhali, usimwache
  rationale: אַל ni katazo, na נָא huongeza ombi la kusihi; kwa pamoja yanaonyesha ombi la haraka, si amri kavu.
- source_word: תְהִי
  choice: awe
  rationale: Ni umbo la nafsi ya tatu, umoja wa kike, la היה katika ombi hasi; linamrejelea Miriamu.
- source_word: כַּמֵּת
  choice: kama mfu
  rationale: Huhifadhi ulinganisho wa moja kwa moja wa Kiebrania bila kufanya taswira ya mtoto aliyezaliwa mfu iwe wazi kupita chanzo.
- source_word: בְּצֵאתוֹ מֵרֶחֶם אִמּוֹ
  choice: anapotoka katika tumbo la mama yake
  rationale: בְּ pamoja na kitenzi-jina huonyesha wakati; tafsiri hii huhifadhi taswira halisi ya kutoka tumboni.
- source_word: וַיֵּאָכֵל חֲצִי בְשָׂרוֹ
  choice: nusu ya mwili wake imeliwa
  rationale: Kitenzi ni cha hali ya kutendwa, kihalisi ‘imeliwa’; בשר katika muktadha huu ni mwili/nyama halisi. ‘Mwili’ ni ya kawaida na yenye hadhi katika Kiswahili huku ikihifadhi taswira ya kimwili.
theological_decisions:
- issue: Mrejelewa wa umoja wa kike katika תְהִי
  choice: Kiambishi -m- katika ‘usimwache’ kinamrejelea Miriamu
  alternative: Kuacha mrejelewa bila kubainishwa
  rationale: Muktadha wa karibu ni ombi la Haruni kwa ajili ya Miriamu; sarufi ya Kiswahili inahitaji kiwakilishi cha yambwa kinachofaa.
- issue: Iwapo כַּמֵּת inamaanisha wazi mtoto aliyezaliwa mfu
  choice: Maandishi makuu yaseme ‘kama mfu’
  alternative: ‘kama mtoto aliyezaliwa mfu’
  rationale: Kiebrania chenyewe kinasema ‘kama mfu,’ huku kishazi kinachofuata kikitoa taswira ya kifo wakati wa kuzaliwa. Tanbihi huhifadhi ufafanuzi unaowezekana bila kuufanya kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tafadhali’ huwasilisha kusihi kwa נָא; ‘kama mfu’ huhifadhi ufupi na utata halisi wa Kiebrania. Alama ya tanbihi imewekwa baada ya sentensi inayohusika.
