    text: Au, “kama mtoto aliyezaliwa mfu, ambaye nusu ya nyama yake imeliwa anapotoka katika tumbo la mama yake.” Kiebrania kinamlinganisha na mfu; kishazi kinachofuata hutoa taswira ya kutoka tumboni. Tafsiri nyingine hufanya taswira ya mtoto aliyezaliwa mfu iwe wazi katika maandishi makuu.
    reason: lexical_alternative
  revision_rationale: Revised “mwili” to “nyama” to represent בָּשָׂר (“flesh”) more precisely. The footnote has been adjusted so that it presents stillbirth as an interpretive alternative without claiming that the Hebrew explicitly states when the person died. The main text continues to preserve the source’s ambiguity.
