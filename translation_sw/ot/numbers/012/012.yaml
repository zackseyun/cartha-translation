review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Aaron’s urgent negative plea, the feminine referent (Miriam), and the deliberately non-explicit comparison to one dead. However, בָּשָׂר is specifically “flesh” in this graphic physical image; “mwili” is broader (“body”) and slightly weakens that lexical detail. “Imeliwa” appropriately reflects the passive image of being consumed/eaten away.
  naturalness: “Tafadhali, usimwache awe kama mfu” is clear, idiomatic Standard East African Swahili in a dignified biblical register. The following relative clause is also natural. Using “nyama” here is natural when referring to literal human flesh in a grave physical image.
  terminology: “Mfu” preserves the Hebrew’s ambiguity better than explicitly making the comparison a stillborn child in the main text. The footnote may offer that interpretive alternative, but should not state that the Hebrew explicitly says the person died at birth.
  issues:
  - severity: medium
    issue: “mwili” translates בָּשָׂר too broadly.
    rationale: The Hebrew term denotes flesh here, as the clause describes half of it being consumed. “Nyama” retains the concrete lexical image more closely than “mwili.”
  - severity: low
    issue: The footnote says the Hebrew compares Miriam to a person “aliyekufa wakati wa kuzaliwa.”
    rationale: The Hebrew says “like one dead” and then describes coming out from the mother’s womb; it does not directly specify the time of death. The note should retain this distinction.
  revised_text: Tafadhali, usimwache awe kama mfu, ambaye nusu ya nyama yake imeliwa anapotoka katika tumbo la mama yake.[a]
