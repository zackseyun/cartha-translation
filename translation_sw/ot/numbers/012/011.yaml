  yaml_path: translation/ot/numbers/012/011.yaml
  text: And Aaron said to Moses[a], “Please, my lord, do not lay sin on us, because we have acted foolishly and because we have sinned.”
translation:
  language: sw
  text: Kisha Haruni akamwambia Musa, “Tafadhali, bwana wangu, usituwekee dhambi[a], kwa maana tumetenda kipumbavu na tumefanya dhambi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usituhesabie hatia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Tafadhali, bwana wangu
  rationale: בִּי ni ombi la heshima na אֲדֹנִי ni namna ya kumheshimu Musa kama mkuu wa kibinadamu, si jina la Mungu.
- source_word: אַל נָא
  choice: usituwekee
  rationale: Katazo la kusihi linaonyeshwa kwa umbo la ‘usi-’; נָא tayari imewakilishwa na ‘Tafadhali’ mwanzoni ili kuepuka urudiaji usio wa lazima.
- source_word: תָשֵׁת עָלֵינוּ חַטָּאת
  choice: usituwekee dhambi hii
  rationale: ‘Kuweka ... juu yetu’ ni sitiari ya Kiebrania; ‘usituwekee’ huihifadhi kwa Kiswahili cha kawaida. Kionyeshi ‘hii’ hufanya rejeo la kosa walilolikiri lieleweke bila kuligeuza moja kwa moja kuwa ‘hatia’.
- source_word: אֲשֶׁר נוֹאַלְנוּ
  choice: kwa maana tumetenda kwa upumbavu
  rationale: Nifali ya יאל inaeleza kutenda kipumbavu au bila busara; ‘tumetenda kwa upumbavu’ ni ya asili na inahifadhi uzito wa kimaadili.
- source_word: וַאֲשֶׁר חָטָאנוּ
  choice: na tumefanya dhambi
  rationale: Kishazi cha pili kinakamilisha na kuimarisha ungamo la Haruni; ‘tumefanya dhambi’ ni usemi wazi wa Kiswahili wa חטא.
theological_decisions:
- issue: Maana ya אֲדֹנִי anapoambiwa Musa
  choice: bwana wangu
  alternative: mheshimiwa
  rationale: Hapa ni cheo cha heshima kwa mwanadamu, si jina au cheo cha Mungu. ‘Bwana wangu’ huhifadhi unyenyekevu na tofauti ya hadhi katika ombi la Haruni.
- issue: Maana ya חַטָּאת katika ombi
  choice: dhambi
  alternative: hatia
  rationale: Neno linaweza kuonyesha kosa lenyewe au hatia inayotokana nalo. Matini kuu inadumisha maana ya moja kwa moja ‘dhambi,’ huku tanbihi ikihifadhi uwezekano wa ‘hatia’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Kisha’ huendeleza masimulizi, na kauli ya Haruni imeundwa kama ombi la dharura lenye unyenyekevu.
