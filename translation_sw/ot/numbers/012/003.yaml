base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/003.yaml
  text: The man Moses was very humble[a], more than any man who was on the face of the earth.
translation:
  language: sw
  text: Musa alikuwa mtu mnyenyekevu sana, kuliko mtu mwingine yeyote duniani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, “kuliko mtu mwingine yeyote juu ya uso wa ardhi.”
    reason: Huhifadhi taswira ya Kiebrania “juu ya uso wa ardhi,” ambayo imetolewa kwa nahau ya kawaida “duniani” katika maandishi.
lexical_decisions:
- source_word: וְ/הָ/אִישׁ מֹשֶׁה
  choice: Musa alikuwa mtu
  rationale: Muundo huu ni wa asili na wazi katika Kiswahili, huku ukihifadhi nomino ‘mtu’ ya Kiebrania na kuendeleza simulizi bila kuongeza neno la wakati lisilokuwamo katika chanzo.
- source_word: ענו
  choice: mnyenyekevu
  rationale: Katika muktadha huu kivumishi kinaeleza tabia ya Musa kuwa mpole na asiyejikweza; ‘mnyenyekevu’ ni neno la sasa, lenye heshima, lisilodokeza udhaifu.
- source_word: מְאֹד
  choice: sana
  rationale: Ni kielezi cha kawaida cha Kiswahili kinachowasilisha nguvu ya kisisitizo cha Kiebrania.
- source_word: מִ/כֹּל הָאָדָם
  choice: kuliko mtu mwingine yeyote
  rationale: Huu ni ulinganisho wa asili katika Kiswahili unaowasilisha maana jumuishi ya usemi wa Kiebrania bila kudokeza wanaume pekee.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: duniani
  rationale: ‘Duniani’ hutoa kwa Kiswahili cha kawaida maana ya nahau ya Kiebrania ‘juu ya uso wa ardhi’; taswira halisi imewekwa katika tanbihi.
theological_decisions:
- issue: Maana ya ענו katika maelezo ya Musa
  choice: mnyenyekevu
  alternative: mpole; aliyeteswa; mnyonge
  rationale: ‘Mnyenyekevu’ inafaa zaidi kwa maelezo ya tabia hapa, lakini neno la Kiebrania linaweza kugusa pia upole au hali ya kuwa chini. Tafsiri haipaswi kulifanya dai hili kuwa fundisho maalumu kuhusu kutokuwa na dhambi au kutokosea.
- issue: Maana jumuishi ya הָאָדָם katika ulinganisho
  choice: mtu mwingine yeyote
  alternative: mwanadamu mwingine yeyote; kila mtu
  rationale: Katika sentensi hii אָדָם ni jina la jumla linalohusu wanadamu wote, si wanaume pekee. ‘Mtu mwingine yeyote’ ni ya asili na sahihi katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa mtiririko wa kawaida wa Kiswahili; maana jumuishi ya ‘mtu’ imehifadhiwa, na nahau halisi ya Kiebrania imeelezwa katika tanbihi.
