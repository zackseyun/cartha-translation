  text: 'For the sons of Joseph[a], for the tribe of the sons of Manasseh: a leader, Hanniel son of Ephod.'
translation:
  language: sw
  text: 'Kwa wana wa Yosefu[a], yaani kwa kabila la wana wa Manase: kiongozi alikuwa Hanieli mwana wa Efodi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazao wa Yosefu ... wazao wa Manase.” Kiebrania hutumia mara kwa mara maneno “wana wa” katika lugha ya makabila na nasaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי יוֹסֵף
  choice: Kwa wana wa Yosefu
  rationale: Neno בְּנֵי kwa maana halisi ni “wana wa”; katika lugha ya kikabila na nasaba linahusu wazao. Muundo huu unahifadhi namna ya Kiebrania huku maelezo ya chini yakifafanua maana pana.
- source_word: לְ/מַטֵּה
  choice: kwa kabila la
  rationale: Ingawa מַטֶּה pia linaweza kumaanisha fimbo, katika muktadha wa kugawa nchi linamaanisha kabila; kiambishi לְ kimetafsiriwa “kwa.”
- source_word: בְנֵי מְנַשֶּׁה
  choice: wana wa Manase
  rationale: Muundo wa nasaba umehifadhiwa kama “wana wa”; hapa unamaanisha wanakabila au wazao wa Manase.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Katika orodha hii neno linamtaja mkuu aliyeteuliwa wa kabila. “Kiongozi” ni wazi na halileti dhana ya kifalme inayoweza kuambatana na “mwana wa mfalme.”
- source_word: חַנִּיאֵל
  choice: Hanieli
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili inayofuatana na umbo la Kiebrania.
- source_word: בֶּן אֵפֹד
  choice: mwana wa Efodi
  rationale: Huu ni muundo wa kawaida wa Kiebrania unaotaja baba. Efodi hapa ni jina la mtu, si vazi la kikuhani.
