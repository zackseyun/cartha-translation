  yaml_path: translation/ot/numbers/034/029.yaml
  text: These are the ones whom Yahweh commanded to apportion the inheritance to the sons of Israel in the land of Canaan[a].
translation:
  language: sw
  text: Hawa ndio wale ambao Yahwe aliwaamuru wawagawie wana wa Israeli urithi katika nchi ya Kanaani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hawa ndio wale ambao Yahwe aliwaamuru wawape wana wa Israeli urithi katika nchi ya Kanaani.”
    reason: Mbadala huu unaonyesha maana pana ya לְנַחֵל, yaani kuwafanya wana wa Israeli wapokee urithi, bila kusisitiza tendo la kugawa kwa mafungu.
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: Hawa ndio wale ambao
  rationale: Muundo huu wa Kiswahili unawatambulisha kwa kawaida na kwa wazi viongozi waliotajwa, huku ukihifadhi nguvu ya kiwakilishi cha kuonyesha na kishazi cha uhusiano.
- source_word: צִוָּה
  choice: aliwaamuru
  rationale: Kitenzi hiki kwa kawaida humaanisha kutoa amri. Kiambishi cha yambwa wa wingi kinarejelea viongozi waliotajwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: לְנַחֵל
  choice: wawagawie ... urithi
  rationale: Hifili ya נחל hapa inaeleza kusababisha Waisraeli wapokee sehemu zao za urithi; “wawagawie ... urithi” linaonyesha tendo la kugawa na dhana ya urithi.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inahifadhi umbo halisi la usemi wa Kiebrania badala ya kulifanya kwa ujumla kuwa “Waisraeli.”
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi nomino “nchi” na jina la eneo la Kanaani.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu; kulitohowa kama “Yahwe” huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Maana ya causative ya לְנַחֵל
  choice: wawagawie wana wa Israeli urithi
  alternative: wawape wana wa Israeli urithi
  rationale: Chaguo kuu linaonyesha ugawaji wa nchi kwa mafungu, ambao ndio muktadha wa sura hii, huku mbadala ukihifadhi maana pana ya kuwapa urithi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na Kiebrania lakini una mtiririko wa kawaida wa Kiswahili.
