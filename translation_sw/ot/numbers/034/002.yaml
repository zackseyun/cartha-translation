base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/002.yaml
  text: 'Command the sons of Israel and say to them[a], ‘When you enter the land of Canaan[b], this is the land that will fall to you as an inheritance: the land of Canaan according to its borders.’'
translation:
  language: sw
  text: 'Waagize Waisraeli[a], uwaambie, “Mtakapoingia katika nchi ya Kanaani, hii ndiyo nchi itakayowaangukia kuwa urithi[b]: nchi ya Kanaani kulingana na mipaka yake.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno halisi, “wana wa Israeli.” Hapa usemi huo unamaanisha Waisraeli kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Yaani, nchi itakayogawiwa kwao kuwa urithi. Kiebrania kinasema kihalisi kwamba nchi hiyo “itawaangukia,” nahau ya mgao wa eneo unaotengwa kwao.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Waamuru
  rationale: Kitenzi hiki ni amri yenye mamlaka; “waamuru” kinahifadhi uzito wa agizo la Kiebrania.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa kwa muundo wa maneno ni “wana wa Israeli,” hapa usemi huo unalitaja taifa lote. “Waisraeli” ni Kiswahili cha kawaida, wazi na chenye maana ileile katika muktadha huu.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: na uwaambie
  rationale: 'Huwasilisha kwa njia ya kawaida mlolongo wa amri mbili: kuwaamuru kisha kuwaambia.'
- source_word: כִּי אַתֶּם בָּאִים אֶל
  choice: Mtakapoingia katika
  rationale: Hali ya kuingia inayotarajiwa inaonyeshwa kwa ufasaha kwa wakati ujao wa masharti katika Kiswahili.
- source_word: הָאָרֶץ כְּנָעַן
  choice: nchi ya Kanaani
  rationale: Ni muundo wa kawaida na unaoeleweka kwa uhusiano wa nchi na jina Kanaani.
- source_word: זֹאת הָאָרֶץ
  choice: hii ndiyo nchi
  rationale: “Ndiyo” inahifadhi mkazo wa utambulisho unaotanguliza maelezo rasmi ya eneo.
- source_word: אֲשֶׁר תִּפֹּל לָכֶם
  choice: itakayowaangukia
  rationale: Huhifadhi taswira halisi ya kitenzi נפל, “kuanguka,” ambacho katika ugawaji wa ardhi ni nahau ya sehemu inayomwangukia mtu kwa kura au mgao.
- source_word: בְּנַחֲלָה
  choice: kuwa urithi
  rationale: “Urithi” huonyesha mali au sehemu ya kudumu inayopokelewa, sawasawa na maana ya נחלה katika muktadha wa nchi.
- source_word: אֶרֶץ כְּנַעַן לִגְבֻלֹתֶיהָ
  choice: nchi ya Kanaani kulingana na mipaka yake
  rationale: Huhifadhi namna rasmi ya kutaja eneo kwa mipaka yake, ambayo inaelezwa katika mistari inayofuata.
