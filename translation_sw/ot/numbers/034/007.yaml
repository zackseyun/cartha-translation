  text: 'Na huu utakuwa mpaka wenu wa kaskazini: kutoka Bahari Kuu mtajichorea mstari wa mpaka hadi Mlima wa Hori[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “mtaweka alama ya mpaka hadi Mlima wa Hori.” Kitenzi hiki katika muktadha wa kijiografia kinaweza kumaanisha kuchora au kuweka alama ya mstari wa mpaka.
    reason: lexical_alternative
  - marker: b
