    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה יִהְיֶה לָ/כֶם
  choice: Na huu ndio utakaokuwa ... wenu
  rationale: Huhifadhi mtiririko wa maelekezo ya mipaka na maana ya mpaka kuwa wa Israeli, kwa Kiswahili cha kawaida chenye hadhi.
- source_word: גְּבוּל צָפוֹן
  choice: mpaka ... wa kaskazini
  rationale: Ni muundo wa asili wa Kiswahili unaoonyesha mpaka wa upande wa kaskazini.
- source_word: מִן הַ/יָּם הַ/גָּדֹל
  choice: kutoka Bahari Kuu
  rationale: Huhifadhi jina la kijiografia la Kiebrania badala ya kuweka moja kwa moja jina la kisasa; tanbihi inafafanua kuwa ni Mediterania.
- source_word: תְּתָאוּ לָ/כֶם
  choice: mtajichorea mstari wa mpaka
  rationale: Kitenzi katika muktadha huu kinaweza kumaanisha kuchora au kuainisha mstari wa mpaka. Umbo la kujirejelea linaonyesha kuwa wanaufanya kuwa mpaka wao.
- source_word: הֹר הָ/הָר
  choice: Mlima Hori
  rationale: Hili ni jina la mahali; “Mlima Hori” linafuata utaratibu wa kawaida wa Kiswahili wa kutaja milima huku likitafsiri jina kwa matamshi yanayofaa Kiswahili.
