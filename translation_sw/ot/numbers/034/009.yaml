base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/009.yaml
  text: Then the border shall extend to Ziphron[a], and its endpoint shall be Hazar-enan. This shall be your northern border.
translation:
  language: sw
  text: Kisha mpaka utaendelea hadi Zifroni, na mwisho wake utakuwa Hasar-Enani.[a] Huu utakuwa mpaka wenu wa kaskazini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri iliyo karibu zaidi na muundo wa Kiebrania, “na miisho yake zitakuwa Hasar-Enani.” Kiebrania kinatumia usemi wa wingi kueleza kikomo cha mpaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: utaendelea
  rationale: Katika maelezo ya mipaka, kitenzi hiki kinaeleza jinsi mstari wa mpaka unavyoelekea au kuendelea, si kitendo halisi cha kutoka.
- source_word: הַגְּבֻל
  choice: mpaka
  rationale: Neno hili linamaanisha mpaka wa eneo; “mpaka” ni neno la kawaida na wazi katika Kiswahili.
- source_word: זִפְרֹנָה
  choice: hadi Zifroni
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kuelekea mahali paitwapo Zifroni; “hadi” huwasilisha kufika kwa mstari wa mpaka huko.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: na mwisho wake utakuwa
  rationale: Katika maelezo ya mipaka, usemi huu hurejelea mwisho au kikomo cha mstari. Kiswahili cha kawaida hutumia umoja “mwisho wake,” huku wingi wa usemi wa Kiebrania ukihifadhiwa katika tanbihi.
- source_word: חֲצַר עֵינָן
  choice: Hasar-enani
  rationale: Hili ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa.
- source_word: זֶה יִהְיֶה לָכֶם
  choice: Huo ndio utakaokuwa ... wenu
  rationale: Muundo huu unatambulisha mstari uliotajwa kuwa mpaka wa Israeli; tafsiri hii ni ya asili na wazi katika Kiswahili.
- source_word: גְּבֻל צָפוֹן
  choice: mpaka wenu wa kaskazini
  rationale: Kirai hiki kinamaanisha mpaka ulioko upande wa kaskazini; “wa kaskazini” ni usemi wa kawaida wa Kiswahili.
