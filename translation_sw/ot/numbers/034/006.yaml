  text: Mpaka wenu wa magharibi utakuwa Bahari Kuu pamoja na pwani yake; huo utakuwa mpaka wenu wa magharibi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּבוּל
  choice: mpaka
  rationale: Neno hili linaonyesha ukingo au mstari unaotenga eneo; “mpaka” ni neno la kawaida na wazi katika muktadha wa kugawa nchi.
- source_word: יָם
  choice: magharibi
  rationale: Katika kishazi גְּבוּל יָם, neno linalomaanisha “bahari” linatumika pia kuelekeza upande wa bahari, yaani magharibi, katika orodha hii ya mipaka.
- source_word: הַיָּם הַגָּדוֹל
  choice: Bahari Kuu
  rationale: Hili ni jina la kijiografia la Bahari ya Mediterania, na tafsiri hii inadumisha namna ya Kiebrania ya kulitaja.
- source_word: וְהָיָה לָכֶם
  choice: utakuwa ... wenu
  rationale: Muundo huu unaeleza kile kitakachokuwa mpaka wa Israeli; Kiswahili hiki ni cha asili na kinadumisha maana ya kutengewa.
- source_word: וּגְבוּל
  choice: kama mpaka
  rationale: Baada ya “Bahari Kuu,” neno hili linaeleza kazi ya bahari hiyo kuwa mpaka wa eneo.
- source_word: זֶה יִהְיֶה לָכֶם
  choice: huo utakuwa ... wenu
  rationale: Kiwakilishi “huo” kinarejelea mpaka uliotajwa na kutoa hitimisho la kawaida kwa Kiswahili.
- source_word: גְּבוּל יָם
  choice: mpaka wa magharibi
  rationale: Katika muktadha huu, upande unaoelekea baharini ni upande wa magharibi; tafsiri hii inaweka wazi maana ya kielekeo.
