base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/008.yaml
  text: From Mount Hor you shall mark out the border to Lebo-hamath[a], and the end points of the border shall be at Zedad.
translation:
  language: sw
  text: Kutoka Mlima Hori mtachora mpaka hadi Lebo-hamathi[a], na mwisho wa mpaka utakuwa Sedadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “mahali pa kuingilia Hamathi”; huenda hili ni jina maalumu la mahali, Lebo-hamathi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֹר הָהָר
  choice: Kutoka Mlima Hori
  rationale: Muundo huu ni jina la mahali lenye kihusishi מִן, hivyo ‘Mlima Hori’ ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: תְּתָאוּ
  choice: mtapima
  rationale: Katika muktadha wa kuweka mipaka, kitenzi kinaeleza kupima na kuainisha njia ya mpaka; ‘mtapima’ ni wazi na ya kawaida katika Kiswahili.
- source_word: לְבֹא חֲמָת
  choice: kuelekea Lebo-hamathi
  rationale: Ingawa maneno hayo yanaweza kutafsiriwa kihalisi ‘mahali pa kuingilia Hamathi,’ yanaonekana kutumiwa kama jina maalumu la kijiografia. ‘Kuelekea’ huhifadhi mwelekeo wa לְ.
- source_word: תּוֹצְאֹת הַגְּבֻל
  choice: ncha za mpaka huo
  rationale: Katika maelezo ya mipaka, תּוֹצְאֹת ni sehemu za mwisho au ncha ambazo mpaka unafikia; usemi huu ni wa asili na unaeleweka kwa urahisi.
- source_word: צְדָדָה
  choice: Sedadi
  rationale: Jina hili la mahali lina ה ya mwelekeo, lakini pamoja na kitenzi ‘zitakuwa’ Kiswahili huonyesha kwa kawaida mahali pa mwisho bila kulazimisha ‘kuelekea.’
