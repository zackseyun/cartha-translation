  yaml_path: translation/ot/numbers/034/014.yaml
  text: For the tribe of the sons of Reuben[a], by their fathers’ houses, and the tribe of the sons of Gad, by their fathers’ houses[c][b], and the half-tribe of Manasseh have taken their inheritance.
translation:
  language: sw
  text: Kwa maana kabila la wana wa Reubeni, kulingana na familia za baba zao,[a] na kabila la wana wa Gadi, kulingana na familia za baba zao, pamoja na nusu ya kabila la Manase, wamechukua urithi wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Familia za baba zao” hurejelea migawanyiko ya koo au familia za mababu ndani ya kila kabila.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au maelezo yanayohusiana na kauli iliyotangulia.
- source_word: לָקְחוּ
  choice: wamekwisha kuchukua
  rationale: Inahifadhi maana ya kitendo kilichokamilika ya Qal perfect, bila kukilegeza kuwa ‘wamepokea.’
- source_word: מַטֶּה
  choice: kabila
  rationale: Katika muktadha wa kugawa nchi, neno hili linamaanisha kundi la kikabila, si fimbo.
- source_word: בְנֵי הָרְאוּבֵנִי / בְנֵי הַגָּדִי
  choice: wana wa Reubeni / wana wa Gadi
  rationale: Inahifadhi usemi wa nasaba wa Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: לְבֵית אֲבֹתָם
  choice: kwa kufuata jamaa za baba zao
  rationale: Inaonyesha kuwa mgawanyo ulihusiana na vitengo vya ukoo au familia za mababu ndani ya kabila.
- source_word: וַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: pamoja na nusu ya kabila la Manase
  rationale: Inatoa kwa uwazi maana kwamba sehemu moja tu ya kabila la Manase ndiyo inayozungumziwa.
- source_word: נַחֲלָתָם
  choice: urithi wao
  rationale: Inahifadhi maana ya sehemu ya nchi iliyogawiwa kama milki ya kurithi.
