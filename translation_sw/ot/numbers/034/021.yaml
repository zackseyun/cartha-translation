- source_word: בִנְיָמִן
  choice: Benyamini
  rationale: Jina la kabila limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אֱלִידָד
  choice: Elidadi
  rationale: Jina la mtu limetoholewa kwa muundo wa kawaida na unaotamkika kwa urahisi katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Hutoa kwa kawaida uhusiano wa kifamilia unaoonyeshwa na neno la Kiebrania katika mfuatano wa majina.
- source_word: כִּסְלֹון
  choice: Kisloni
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka konsonanti za Kiebrania na kurekebishwa kwa matamshi ya Kiswahili.
