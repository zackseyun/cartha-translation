  text: 'And for the tribe of the sons of Simeon: Shemuel son of Ammihud[a].'
translation:
  language: sw
  text: 'Na kwa kabila la wana wa Simeoni: Shemueli[a] mwana wa Amihudi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Shemuel”; kwa kawaida huandikwa “Samweli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Na kwa kabila la
  rationale: Katika muktadha huu wa kugawa nchi, מַטֶּה humaanisha kikundi cha kikabila, si fimbo halisi. Viambishi וּ na לְ vimetafsiriwa kwa kawaida kuwa “Na kwa.”
- source_word: בְּנֵי
  choice: wana wa
  rationale: Ni wingi wa hali ya kuambatana wa בֵּן, “wana wa.” Katika jina la kabila, usemi huu pia huwahusu wazao, lakini “wana wa” huhifadhi muundo wa Kiebrania na ni wa kawaida katika Kiswahili cha Biblia.
- source_word: שִׁמְעוֹן
  choice: Simeoni
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mtu na kabila שִׁמְעוֹן.
- source_word: שְׁמוּאֵל
  choice: Shemueli
  rationale: Jina limetoholewa kwa kufuata kwa karibu matamshi ya Kiebrania katika aya hii; tanbihi inataja umbo la kawaida zaidi la Kiswahili, “Samueli.”
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika orodha hii ya viongozi wa kikabila, בֶּן ni kiashirio cha moja kwa moja cha ukoo na humaanisha “mwana wa.”
- source_word: עַמִּיהוּד
  choice: Amihudi
  rationale: Jina la Kiebrania limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
