  text: וְ/הָיָ֨ה לָ/כֶ֧ם פְּאַת נֶ֛גֶב מִ/מִּדְבַּר צִ֖ן עַל יְדֵ֣י אֱד֑וֹם וְ/הָיָ֤ה לָ/כֶם֙ גְּב֣וּל נֶ֔גֶב מִ/קְצֵ֥ה יָם הַ/מֶּ֖לַח קֵֽדְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/003.yaml
  text: Your southern side shall be from the wilderness of Zin along the side of Edom[b][a], and your southern border shall be from the end of the Salt Sea eastward.
translation:
  language: sw
  text: Upande wenu wa kusini utakuwa kuanzia nyika ya Sini, kando ya Edomu; nao mpaka wenu wa kusini utakuwa kuanzia mwisho[a] wa Bahari ya Chumvi[b], kuelekea mashariki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ncha” au “ukingo wa Bahari ya Chumvi.”
    reason: lexical_alternative
  - marker: b
    text: Pia huitwa “Bahari ya Mauti”; Kiebrania ni “Bahari ya Chumvi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת
  choice: upande
  rationale: Katika maelezo ya mipaka, neno hili linaonyesha upande au ukingo wa eneo; “upande” ni la kawaida na linafaa katika Kiswahili.
- source_word: נֶגֶב
  choice: kusini / wa kusini
  rationale: Hapa neno hili linatumika kuonyesha mwelekeo katika maelezo ya mpaka, wala si jina maalumu la eneo la Negebu.
- source_word: מִמִּדְבַּר צִן
  choice: kuanzia nyika ya Sini
  rationale: “Nyika” linaonyesha eneo kame lisilokaliwa sana bila kulazimisha maana ya jangwa la mchanga; “kuanzia” huwasilisha asili ya mpaka kwa Kiswahili cha kawaida.
- source_word: עַל יְדֵי אֱדוֹם
  choice: kando ya Edomu
  rationale: Nahau hii ya kijiografia humaanisha kuwa karibu au sambamba na upande wa Edomu, bila kudai wazi kwamba ulikuwa mpaka rasmi wa Edomu.
- source_word: גְּבוּל
  choice: mpaka
  rationale: Katika muktadha wa kugawa nchi, neno hili humaanisha mpaka wa eneo.
- source_word: מִקְצֵה יָם הַמֶּלַח
  choice: kuanzia mwisho wa Bahari ya Chumvi
  rationale: קָצֶה huonyesha ncha au sehemu ya mwisho; “mwisho” ni tafsiri wazi, huku uwezekano wa “ukingo” au “ncha” ukihifadhiwa katika tanbihi.
- source_word: יָם הַמֶּלַח
  choice: Bahari ya Chumvi
  rationale: Hii inatafsiri moja kwa moja jina la Kiebrania badala ya kutumia jina la kimapokeo “Bahari ya Dead Sea/Bahari ya Mauti.”
- source_word: קֵדְמָה
  choice: kuelekea mashariki
  rationale: Kielezi hiki kinaonyesha mwelekeo wa mashariki kutoka sehemu iliyotajwa.
- source_word: וְהָיָה לָכֶם ... וְהָיָה לָכֶם
  choice: utakuwa ... utakuwa
  rationale: Urudiaji huu unahifadhi muundo na nguvu ya maelezo ya kisheria ya Kiebrania; “kuanzia” hufanya sentensi iwe ya kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa mpaka na urudiaji wa Kiebrania umehifadhiwa kadiri inavyowezekana bila kufanya sentensi kuwa ngumu.
