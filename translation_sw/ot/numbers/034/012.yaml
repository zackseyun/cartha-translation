  yaml_path: translation/ot/numbers/034/012.yaml
  text: Then the border shall go down to the Jordan[a], and its end shall be at the Salt Sea[b]. This shall be your land according to its borders all around.
translation:
  language: sw
  text: Kisha mpaka utashuka hadi Yordani, na ncha zake zitakuwa katika Bahari ya Chumvi.[a] Hii itakuwa nchi yenu kulingana na mipaka yake pande zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “Bahari ya Chumvi”; bahari hii hujulikana kwa kawaida kama Dead Sea.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: Kisha ... utashuka
  rationale: Kitenzi ירד humaanisha kushuka; wakati ujao unafaa katika maelezo haya ya mpaka uliowekwa, na “kisha” linaonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: הַגְּבוּל
  choice: mpaka
  rationale: גְּבוּל humaanisha mpaka wa eneo; “mpaka” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: הַיַּרְדֵּנָה
  choice: hadi Yordani
  rationale: Kiishio cha mwelekeo kinaonyesha kwenda kuelekea Yordani. “Hadi” linaonyesha mpaka kufikia mahali hapo bila kuongeza neno “Mto,” ambalo halipo katika Kiebrania.
- source_word: תוֹצְאֹתָיו
  choice: mwisho wake
  rationale: Katika maelezo ya mipaka, תּוֹצָאוֹת hurejelea mwisho au mahali mpaka unapokomea. “Mwisho wake” ni ya asili na inaendana na kiwakilishi cha umoja kinachorejelea mpaka.
- source_word: יָם הַמֶּלַח
  choice: Bahari ya Chumvi
  rationale: Hili ndilo tafsiri ya moja kwa moja ya jina la Kiebrania na huhifadhi namna chanzo kinavyoiita bahari hiyo.
- source_word: זֹאת תִּהְיֶה לָכֶם הָאָרֶץ
  choice: Hii itakuwa nchi yenu
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida na kwa uwazi kuwa eneo lililozungushiwa mipaka ndilo nchi yao.
- source_word: לִגְבֻלֹתֶיהָ סָבִיב
  choice: kulingana na mipaka yake pande zote
  rationale: Tafsiri hii huhifadhi wazo la nchi inayofafanuliwa na mipaka inayoizunguka bila kupanua maana.
