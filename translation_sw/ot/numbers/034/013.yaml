  text: Then Moses commanded the sons of Israel, saying, “This is the land that you shall inherit by lot, which the LORD commanded to give to the nine tribes and the half-tribe.”
translation:
  language: sw
  text: Kisha Mose akawaamuru wana wa Israeli, akisema, “Hii ndiyo nchi mtakayoirithi kwa kura, ambayo BWANA aliamuru ipewe makabila tisa na nusu ya kabila.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Ni tafsiri ya moja kwa moja na yenye hadhi ya usemi wa Kiebrania unaolitaja taifa la Israeli.
- source_word: תִּתְנַחֲלוּ אֹתָהּ
  choice: mtakayojipatia
  rationale: Kitenzi hiki kinaeleza kuipokea nchi iwe milki ya urithi; ‘mtakayojipatia’ hudumisha wazo hilo kwa Kiswahili cha kawaida.
- source_word: בְּגוֹרָל
  choice: kwa kura
  rationale: Inaonyesha njia ya kugawa nchi kwa kupiga kura, si bahati kwa maana ya tukio la nasibu tu.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika tafsiri za Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa herufi kubwa.
- source_word: לָתֵת
  choice: wapewe
  rationale: Muundo wa Kiswahili wa kutendwa unaweka wazi kwamba makabila tisa na nusu ndiyo wapokeaji wa nchi, bila kubadili kiini cha amri ya YHWH.
- source_word: תִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: makabila tisa na nusu ya kabila
  rationale: Huhifadhi hesabu na usemi wa Kiebrania unaorejelea makabila tisa kamili pamoja na nusu ya kabila moja.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni uwakilishi wa kawaida na wenye kutambulika katika Biblia za Kiswahili; haiongezi msimamo wa kimadhehebu.
- issue: Wakala katika utoaji wa nchi
  choice: ambayo BWANA aliamuru wapewe
  alternative: ambayo BWANA aliamuru kutoa
  rationale: Kiebrania kina kisichoelezwa wazi kuhusu mhusika anayetekeleza utoaji. Muundo wa kutendwa huepuka kumtaja wakala ambaye maandishi hayamtaji, huku ukibakiza BWANA kama mwenye kutoa amri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘akisema’ umehifadhiwa kwa sababu unaendana na mtindo wa masimulizi ya Biblia; hakuna alama za tanbihi zinazohitajika.
