  text: And you shall mark out for yourselves the eastern border from Hazar-enan to Shepham[a].
translation:
  language: sw
  text: Nanyi mtajiwekea mpaka wa mashariki kutoka Hasar-enani hadi Shefamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtajichorea” au “mtaweka mstari wa mpaka.” Kitenzi cha Kiebrania hapa si cha kawaida, na katika muktadha huu kinamaanisha kuainisha au kuweka mstari wa mpaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְאַוִּיתֶם
  choice: mtajichorea
  rationale: Katika muktadha huu wa kuweka mipaka, kitenzi hiki kisicho cha kawaida kina maana ya kuchora au kuweka mstari wa mpaka, si kutamani kama mzizi huu unavyoweza kumaanisha katika miktadha mingine.
- source_word: לָכֶם
  choice: -ji- katika “mtajichorea”
  rationale: Kiambishi cha kujirejelea pamoja na umbo la kutendea kinawasilisha maana ya kufanya jambo hilo kwa ajili yenu wenyewe.
- source_word: לִגְבוּל קֵדְמָה
  choice: mpaka wa mashariki
  rationale: Muundo huu ni wa kawaida na wazi katika Kiswahili, nao unaonyesha upande wa mashariki wa eneo linalowekewa mipaka.
- source_word: מֵחֲצַר עֵינָן
  choice: kutoka Hasar-enani
  rationale: Jina la mahali limetoholewa kwa kuzingatia matamshi ya Kiebrania, nalo linaonyesha mwanzo wa sehemu hii ya mpaka.
- source_word: שְׁפָמָה
  choice: hadi Shefamu
  rationale: Jina la mahali limetoholewa kwa kuzingatia matamshi ya Kiebrania; “hadi” linaonyesha mwisho wa sehemu hii ya mstari wa mpaka.
