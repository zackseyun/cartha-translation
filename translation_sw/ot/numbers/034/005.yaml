  text: וְ/נָסַ֧ב הַ/גְּב֛וּל מֵ/עַצְמ֖וֹן נַ֣חְלָ/ה מִצְרָ֑יִם וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/005.yaml
  text: Then the border shall turn from Azmon to the Brook of Egypt[b][a], and its end shall be at the sea.
translation:
  language: sw
  text: Kisha mpaka utageuka kutoka Asmoni hadi Kijito cha Misri[a], na mwisho wake[b] utakuwa baharini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi Wadi ya Misri.” Neno la Kiebrania נחל mara nyingi humaanisha mkondo au bonde la maji ya msimu.
    reason: lexical_alternative
  - marker: b
    text: Au, “miisho yake.” Kiebrania kinatumia umbo la wingi kumaanisha sehemu ya mwisho ya mpaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: Kisha ... utageuka
  rationale: Katika maelezo ya mipaka, kitenzi hiki kinaonyesha mpaka kubadili mwelekeo. “Kisha” linaendeleza hatua inayofuata katika uainishaji wa mpaka, na wakati ujao unafaa muktadha wa maagizo haya.
- source_word: הַגְּבוּל
  choice: mpaka
  rationale: Neno hili linamaanisha mstari unaotenganisha maeneo; “mpaka” ni neno la kawaida na wazi katika Kiswahili cha sasa.
- source_word: מֵעַצְמוֹן
  choice: kutoka Asmoni
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: נַחְלָה מִצְרָיִם
  choice: hadi Kijito cha Misri
  rationale: נחל mara nyingi humaanisha mkondo au bonde la maji linaloweza kuwa la msimu, si lazima mto mkubwa wa kudumu. “Kijito cha Misri” ni wazi, kinatambulika, na hakidokezi kimakosa Mto Nile; maana ya “wadi” imehifadhiwa katika tanbihi.
- source_word: וְהָיוּ
  choice: utakuwa
  rationale: Kitenzi hiki kinaunganisha mpaka na sehemu yake ya mwisho. Umoja wa kisarufi unalingana kwa kawaida na “mwisho wake” katika Kiswahili.
- source_word: תּוֹצְאֹתָיו
  choice: mwisho wake
  rationale: Katika maandishi ya mipaka, neno hili hurejelea sehemu ambapo mstari wa mpaka unaishia. Ingawa umbo la Kiebrania ni la wingi, “mwisho wake” ni usemi wa kawaida wa Kiswahili; wingi wa asili umeelezwa katika tanbihi.
- source_word: הַיָּמָּה
  choice: baharini
  rationale: Umbo hili lina maana ya kuelekea au kufikia bahari. Katika muktadha huu linaonyesha mahali mpaka unapoishia. Kiebrania hakitaji jina mahususi la bahari katika aya hii, kwa hiyo tafsiri hailiongezi.
