lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akasema
  rationale: Kitenzi hiki pamoja na waw ya mfululizo kinaendeleza simulizi. “Kisha ... akasema” ni Kiswahili cha kawaida kinachohifadhi mfuatano wa matukio na kitendo cha kunena.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: אֶל
  choice: na
  rationale: Katika muundo wa Kiswahili “akasema na Musa,” kihusishi hiki humtambulisha mtu aliyeelekezewa maneno kwa njia ya kawaida na yenye kueleweka.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kitenzi-jina hiki ni sehemu ya fomula ya kutanguliza maneno ya moja kwa moja. “Akisema” huhifadhi muundo huo na kuonyesha kwamba maneno yanayosemwa yanafuata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandiko ya Kiebrania yanatumia jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
