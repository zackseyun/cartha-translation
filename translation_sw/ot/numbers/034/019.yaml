- source_word: וְאֵלֶּה
  choice: Na haya ndiyo
  rationale: Kiunganishi וְ kinaendeleza orodha iliyotangulia, na אֵלֶּה kinawatambulisha wanaofuata; “Na haya ndiyo” ni Kiswahili cha kawaida kinachohifadhi mtiririko na msisitizo wa utambulisho.
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: majina ya watu hao
  rationale: שְׁמוֹת ni hali ya uambatanisho, “majina ya,” na הָאֲנָשִׁים inarejelea wanaume waliotajwa katika muktadha; “watu hao” ni ya asili katika Kiswahili na humrejesha msomaji kwa kundi lililotangulia.
- source_word: לְמַטֵּה
  choice: kwa kabila la
  rationale: Katika muktadha wa ugawaji wa nchi, מַטֶּה humaanisha “kabila,” si fimbo; לְ huonyesha mtu anayeliwakilisha kabila hilo.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: כָּלֵב
  choice: Kalebu
  rationale: Umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huwasilisha kwa kawaida uhusiano wa nasaba katika muundo wa jina la Kiebrania.
- source_word: יְפֻנֶּה
  choice: Yefune
  rationale: Unukuzi wa kawaida na unaotambulika wa jina hili katika Kiswahili cha Biblia.
