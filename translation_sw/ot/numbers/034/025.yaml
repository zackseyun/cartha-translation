lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Na kwa ajili ya kabila la
  rationale: Katika muktadha wa kugawa nchi, מַטֶּה humaanisha kabila, si fimbo; viambishi וּ na לְ vimetafsiriwa kwa mtiririko wa kawaida wa orodha.
- source_word: בְנֵי זְבוּלֻן
  choice: wazao wa Zabuloni
  rationale: Ingawa בְנֵי maana yake ya moja kwa moja ni ‘wana wa’, hapa ni jina la pamoja la kikabila; ‘wazao’ huwasilisha uhusiano wa nasaba kwa Kiswahili cha kawaida bila kudokeza wana wa kiume pekee.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Neno hili humaanisha mkuu au kiongozi anayetambuliwa wa kabila; ‘kiongozi’ ni wazi na halidokezi cheo cha kifalme.
- source_word: אֱלִיצָפָן
  choice: Elizafani
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: בֶּן פַּרְנָךְ
  choice: mwana wa Parnaki
  rationale: בֶּן ni kiashirio cha kawaida cha nasaba, ‘mwana wa’; jina Parnaki limetoholewa kwa Kiswahili.
