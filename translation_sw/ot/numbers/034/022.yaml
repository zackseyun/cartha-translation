  text: וּ/לְ/מַטֵּ֥ה בְנֵי דָ֖ן נָשִׂ֑יא בֻּקִּ֖י בֶּן יָגְלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/022.yaml
  text: 'And for the tribe of the sons of Dan[a], a leader: Bukki son of Jogli.'
translation:
  language: sw
  text: Na kwa kabila la wazao wa Dani[a], kiongozi alikuwa Buki mwana wa Yogli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “wana wa Dani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Na kwa kabila la
  rationale: Katika muktadha wa ugawaji wa nchi katika Hesabu, מַטֶּה humaanisha kabila, si fimbo; viambishi וּ na לְ vimetafsiriwa kwa kawaida kama “Na kwa.”
- source_word: בְנֵי דָן
  choice: wazao wa Dani
  rationale: Kirai hiki ni “wana wa Dani” kihalisi, lakini katika fomula ya kikabila kinamaanisha watu waliotokana na Dani. “Wazao wa Dani” ni Kiswahili cha kawaida na kinaweka wazi maana hiyo bila kupoteza wazo la ukoo.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Neno hili hapa linamtaja mwakilishi mkuu wa kabila aliyeteuliwa kwa kazi ya kugawa nchi. “Kiongozi” ni neno la sasa, linaloeleweka, na halidokezi cheo cha kifalme.
- source_word: בֻּקִּי
  choice: Buki
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ni usemi wa kawaida wa Kiebrania unaotambulisha uhusiano wa moja kwa moja wa baba na mwana; “mwana wa” ndio tafsiri ya moja kwa moja na ya kawaida.
- source_word: יָגְלִי
  choice: Yogli
  rationale: Jina limetoholewa kwa kufuata kwa karibu matamshi ya Kiebrania, huku yod ya mwanzo ikiwakilishwa na Y katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Kitenzi “alikuwa” kimeongezwa kwa ulaini wa Kiswahili katika sentensi ya Kiebrania isiyo na kitenzi; hakibadili utambulisho wa kiongozi.
