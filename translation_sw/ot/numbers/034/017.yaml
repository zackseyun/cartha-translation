  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר יִנְחֲל֥וּ לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/017.yaml
  text: 'These are the names of the men who shall assign the land to you as an inheritance: Eleazar the priest and Joshua son of Nun[a].'
translation:
  language: sw
  text: 'Haya ndiyo majina ya wanaume watakaowagawia nchi iwe urithi wenu: Eleazari kuhani na Yoshua mwana wa Nuni.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watakaowapa nchi kuwa urithi wenu,” au, “watakaowafanya muirithi nchi.” Kitenzi cha Kiebrania kina maana ya kusababisha mtu arithi au ya kumgawia urithi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Haya ndiyo majina
  rationale: Muundo huu wa Kiswahili unatoa utambulisho wa orodha kwa njia ya kawaida na wazi, huku ukihifadhi wingi wa neno ‘majina’.
- source_word: הָאֲנָשִׁים
  choice: wanaume
  rationale: Neno la Kiebrania ni la kiume na hapa linarejelea viongozi wa kiume wanaotajwa, hivyo ‘wanaume’ ni sahihi kuliko neno lisiloonyesha jinsia.
- source_word: אֲשֶׁר
  choice: watakao-
  rationale: Kiambishi cha uhusiano katika ‘watakaowagawia’ kinaunganisha kwa asili majina ya wanaume na kazi watakayofanya.
- source_word: יִנְחֲלוּ לָכֶם אֶת הָאָרֶץ
  choice: watakaowagawia nchi iwe urithi wenu
  rationale: 'Hiphil ya נחל ina maana ya kisababishi: viongozi hawa wataisimamia nchi igawiwe kwa watu ili waipokee kama urithi. ‘Kuwagawia’ huonyesha tendo la ugawaji, na ‘iwe urithi wenu’ huhifadhi wazo la urithi.'
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Eleazari kuhani
  rationale: ‘Eleazari’ ni umbo la jina lililozoeleka katika Biblia za Kiswahili, na ‘kuhani’ hutafsiri cheo הַכֹּהֵן kwa uwazi.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: na Yoshua mwana wa Nuni
  rationale: Majina ‘Yoshua’ na ‘Nuni’ yanafuata maumbo yaliyozoeleka katika Kiswahili; ‘mwana wa’ huhifadhi usemi wa nasaba wa Kiebrania.
