base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/015.yaml
  text: The two tribes and the half-tribe have taken their inheritance beyond the Jordan at Jericho[a], eastward[b], toward the sunrise.
translation:
  language: sw
  text: Makabila hayo mawili na nusu ya kabila yamechukua urithi wao ng’ambo ya Yordani, mkabala na Yeriko[a], kuelekea mashariki, upande wa macheo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upande ule mwingine wa Yordani.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema, “kuelekea mashariki, upande wa macheo,” usemi maradufu unaosisitiza upande wa mashariki.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: makabila hayo mawili
  rationale: Katika muktadha wa ugawaji wa nchi, מַטֶּה humaanisha ‘kabila,’ si fimbo; kiashiria ‘hayo’ kinaonyesha makabila yaliyotajwa katika muktadha wa karibu.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: na lile nusu kabila
  rationale: Usemi huu unataja kitengo kinachotambulika cha nusu ya kabila, hapa nusu ya kabila la Manase; muundo huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: לָקְחוּ
  choice: yamechukua
  rationale: Kitenzi timilifu cha Kiebrania kinaonyesha tendo lililokamilika. Wakati timilifu wa Kiswahili unafaa katika maelezo haya na huepuka kuongeza wazo la ‘kupewa’ lisilotajwa moja kwa moja na kitenzi.
- source_word: נַחֲלָתָם
  choice: urithi wao
  rationale: ‘Urithi’ huhifadhi maana ya sehemu ya nchi inayorithiwa katika muktadha wa agano na ugawaji wa nchi.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: Huu ni usemi wa mahali unaomaanisha upande wa pili wa Yordani kulingana na mahali anapotazamia msemaji.
- source_word: יְרֵחוֹ
  choice: karibu na Yeriko
  rationale: Jina la mahali linafafanua sehemu ya Yordani inayokusudiwa, yaani eneo la Yeriko; ‘karibu na Yeriko’ ni Kiswahili cha asili na hakidai kuwa eneo hilo liko ndani ya mji.
- source_word: קֵדְמָה
  choice: kuelekea mashariki
  rationale: Umbo lenye ה ya mwelekeo huonyesha mwelekeo wa mashariki.
- source_word: מִזְרָחָה
  choice: upande wa macheo
  rationale: Neno linahusiana na kuchomoza kwa jua. Tafsiri tofauti na ‘mashariki’ huhifadhi usemi maradufu wa Kiebrania na msisitizo wake bila kuwa ngumu kwa msomaji.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Nusu kabila’ limetumiwa kama istilahi ya kawaida ya kitengo cha kikabila, na usemi maradufu wa mwelekeo umehifadhiwa ili kuonyesha msisitizo wa Kiebrania.
