  text: 'And for the tribe of the sons of Issachar, a leader: Paltiel son of Azzan.'
translation:
  language: sw
  text: 'Na kwa kabila la wana wa Isakari, kiongozi: Paltieli mwana wa Azani.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Na kwa kabila la
  rationale: Katika muktadha wa ugawaji wa nchi kwa makabila, מַטֶּה humaanisha ‘kabila’; viambishi וּ na לְ vimetafsiriwa pamoja kuwa ‘Na kwa’ ili kuhifadhi muundo wa orodha.
- source_word: בְנֵי
  choice: wana wa
  rationale: Huu ni muundo wa kawaida wa Kiswahili wa kutaja watu wa ukoo au kabila fulani; unaakisi wingi wa בֵּן kwa njia ya asili bila kuongeza maana isiyokuwamo katika chanzo.
- source_word: יִשָׂשכָר
  choice: Isakari
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Neno hili hapa humtaja mwakilishi aliyeteuliwa wa kabila; ‘kiongozi’ ni la sasa, wazi, na halidokezi bila sababu cheo cha kifalme.
- source_word: פַּלְטִיאֵל
  choice: Paltieli
  rationale: Jina limetoholewa kwa mfumo wa majina ya Kiebrania unaoeleweka katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ndio usemi wa kawaida wa Kiswahili wa kuonyesha uhusiano wa baba na mwana katika jina la ukoo.
- source_word: עַזָּן
  choice: Azani
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili inayolingana na konsonanti za Kiebrania.
