  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaosomeka kwa urahisi. Majina ya maeneo yametoholewa badala ya kutafsiriwa, isipokuwa maana inayowezekana ya Akrabimu imewekwa katika tanbihi. Alama ya tanbihi [a] imewekwa baada ya jina linalohusika.
