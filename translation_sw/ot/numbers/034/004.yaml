  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נָסַ֣ב לָ/כֶם֩ הַ/גְּב֨וּל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה ו/היה תּֽוֹצְאֹתָ֔י/ו מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/יָצָ֥א חֲצַר אַדָּ֖ר וְ/עָבַ֥ר עַצְמֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/004.yaml
  text: Then the border shall turn for you from the south of the Ascent of Akrabbim[a], and cross to Zin; and its end shall be south of Kadesh-barnea; then it shall go out to Hazar-addar and cross to Azmon.
translation:
  language: sw
  text: Kisha mpaka wenu utageuka kutoka kusini mwa Mwinuko wa Akrabimu[a], na kupita hadi Sini; miisho yake itakuwa kusini mwa Kadeshi-Barnea; kisha utaendelea hadi Hasar-Adari na kupita hadi Asmoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda jina Akrabimu linamaanisha “nge”; jina la mahali hapa lingeweza pia kutafsiriwa “Mwinuko wa Nge” au “Njia ya Nge.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב לָכֶם הַגְּבוּל
  choice: Kisha mpaka wenu utageuka
  rationale: Kitenzi נָסַב katika maelezo ya mipaka huonyesha mpaka ukibadili mwelekeo au ukipinda. Maneno “mpaka wenu” pia yanawakilisha לָכֶם kwa Kiswahili cha kawaida.
- source_word: מִנֶּגֶב לְמַעֲלֵה עַקְרַבִּים
  choice: upande wa kusini wa Mwinuko wa Akrabimu
  rationale: מִנֶּגֶב inaonyesha upande wa kusini wa alama hiyo ya kijiografia. מַעֲלֵה imetafsiriwa “Mwinuko,” huku Akrabimu likihifadhiwa kama jina la mahali.
- source_word: וְעָבַר צִנָה
  choice: na kupita kuelekea Sini
  rationale: עָבַר huonyesha mwendo wa mstari wa mpaka, na kiambishi cha mwelekeo katika צִנָה kinaelezwa kwa “kuelekea.”
- source_word: וְהָיָה תּוֹצְאֹתָיו
  choice: Mwisho wake utakuwa
  rationale: Katika maelezo ya mipaka, תּוֹצְאוֹת hutaja mwisho au kikomo cha mstari wa mpaka. Kiswahili cha umoja kinarejelea mpaka mmoja kwa ufasaha bila kubadili maana ya kijiografia.
- source_word: מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: kusini mwa Kadeshi-barnea
  rationale: Kirai hiki kinaweka mwisho wa mpaka upande wa kusini wa Kadeshi-barnea, badala ya kusema mpaka unaishia ndani ya eneo hilo.
- source_word: וְיָצָא חֲצַר אַדָּר
  choice: kisha utaendelea hadi Hasar-adari
  rationale: יָצָא katika orodha za mipaka hueleza mstari unaoendelea hadi mahali pengine. “Utaendelea hadi” ni wazi na asilia kwa msomaji wa Kiswahili.
- source_word: וְעָבַר עַצְמֹנָה
  choice: na kupita kuelekea Asmoni
  rationale: Kiambishi cha mwelekeo katika עַצְמֹנָה kimehifadhiwa kwa “kuelekea,” huku jina la mahali likitoholewa kuwa Asmoni.
theological_decisions: []
