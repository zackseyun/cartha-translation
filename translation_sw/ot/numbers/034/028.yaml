- source_word: וּ/לְ/מַטֵּה
  choice: Na kwa kabila la
  rationale: Katika muktadha wa kugawa nchi, מַטֶּה humaanisha ‘kabila,’ si fimbo; viambishi וּ na לְ vimetafsiriwa kwa kawaida kuwa ‘Na kwa.’
- source_word: בְנֵי
  choice: wana wa
  rationale: Huhifadhi kwa ukaribu muundo wa Kiebrania ‘wana wa,’ ambao hapa ni jina la kawaida la ukoo wa kikabila na huwahusu wazao wa Naftali.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Katika orodha hii ya kiutawala, neno hili humaanisha mkuu au kiongozi aliyeteuliwa wa kabila; ‘kiongozi’ ni wazi na halileti maana ya kifalme isiyokusudiwa.
- source_word: פְּדַהְאֵל
  choice: Pedaheli
  rationale: Jina limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ni muundo wa kawaida wa kutaja mtu kwa jina la baba yake.
- source_word: עַמִּיהוּד
  choice: Amihudi
  rationale: Jina limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
