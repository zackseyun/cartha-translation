translation:
  language: sw
  text: Nao mtachukua kiongozi mmoja kutoka kila kabila ili kuirithi nchi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Neno hili humaanisha mkuu au kiongozi anayetambuliwa; katika muktadha wa usimamizi wa ugawaji wa nchi, “kiongozi” ni la kawaida na halidokezi cheo cha kifalme.
- source_word: אֶחָד ... אֶחָד
  choice: mmoja kutoka kila
  rationale: Urudiaji huo unasisitiza mwakilishi mmoja kwa kila kabila; Kiswahili cha kawaida huwasilisha maana hiyo kwa “mmoja kutoka kila kabila.”
- source_word: מִמַּטֶּה
  choice: kutoka kila kabila
  rationale: Ingawa מַטֶּה pia linaweza kumaanisha fimbo, katika muktadha huu wa utawala wa Israeli linamaanisha kabila.
- source_word: תִּקְחוּ
  choice: mtamchukua
  rationale: Kitenzi hiki ni agizo kwa watu wengi. Muundo wa wakati ujao katika Kiswahili unaweza kubeba nguvu ya maagizo kwa njia ya heshima na iliyo ya kawaida.
- source_word: לִנְחֹל
  choice: ili kuigawa nchi iwe urithi
  rationale: Katika muktadha wa mstari wa 17 na sura nzima, viongozi hawa wanashiriki katika kuwagawia Waisraeli nchi kuwa urithi. Hata hivyo, kitenzi kinaweza pia kueleweka kuwa kurithi au kuimiliki kama urithi; maana hiyo imehifadhiwa katika tanbihi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Hapa neno hili linarejelea nchi maalumu inayogawiwa Israeli; “nchi” ni tafsiri ya kawaida na ya asili katika Kiswahili.
theological_decisions:
- issue: Je, לִנְחֹל humaanisha viongozi kurithi nchi au kuigawa kuwa urithi?
  choice: ili kuigawa nchi iwe urithi
  alternative: ili kuirithi nchi
  rationale: Muundo wa kisababishi unaowezekana na muktadha wa viongozi walioteuliwa kusimamia ugawaji unaunga mkono maana ya kuigawa nchi kuwa urithi. Kwa kuwa umbo la Kiebrania linaweza kubeba maana ya kurithi, uwezekano huo haujafichwa bali umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Kiongozi” ni rahisi kueleweka kuliko “mkuu” katika muktadha huu, na “iwe urithi” huhifadhi dhana ya nchi kama milki ya kurithi.
