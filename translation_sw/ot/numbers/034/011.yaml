base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/011.yaml
  text: Then the border shall go down from Shepham to Riblah[a], on the east side of Ain[b]; and the border shall go down and reach the slope of the Sea of Kinnereth on the east.
translation:
  language: sw
  text: Kisha mpaka utashuka kutoka Shefamu hadi Ribla, upande wa mashariki wa Aini[a]; na mpaka utashuka na kufika kwenye ubavu[b] wa Bahari ya Kinerethi upande wa mashariki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mashariki ya Aini.” Kirai cha Kiebrania kinaweza kutafsiriwa moja kwa moja kuwa eneo lililo mashariki ya Aini.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “kugusa bega la Bahari ya Kinerethi kuelekea mashariki.” Hapa “bega” ni taswira ya kijiografia inayoweza kumaanisha ubavu, upande, au mteremko wa ardhi kandokando ya bahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: utashuka
  rationale: Kitenzi יָרַד humaanisha ‘kushuka’; katika maelezo ya mipaka kinaonyesha mwendo wa mpaka kwa kufuata mwelekeo au mwinuko wa ardhi.
- source_word: הַגְּבֻל / הַגְּבוּל
  choice: mpaka
  rationale: Neno גְּבוּל ni mpaka wa eneo; ‘mpaka’ ni la kawaida, wazi, na linalofaa katika Kiswahili cha kijiografia.
- source_word: מִשְּׁפָם
  choice: kutoka Shefamu
  rationale: Jina la mahali limetoholewa kwa mwandiko wa Kiswahili, huku kihusishi מִן kikionyesha mahali pa kuanzia.
- source_word: הָרִבְלָה
  choice: hadi Ribla
  rationale: Jina la mahali limetoholewa, na -ה ya mwelekeo imewasilishwa kwa ‘hadi’.
- source_word: מִקֶּדֶם לָעָיִן
  choice: upande wa mashariki wa Aini
  rationale: Kirai kinaweka Ribla kuhusiana na Aini upande wa mashariki; tafsiri hii ni ya asili katika Kiswahili na haiongezi uhakika usiokuwamo katika Kiebrania.
- source_word: וּמָחָה
  choice: na kufika kwenye
  rationale: Katika maelezo ya mpaka, kitenzi hiki huonyesha mpaka kugusa au kufikia sehemu fulani. ‘Kufika kwenye’ hutoa maana hiyo kwa Kiswahili kinachoeleweka.
- source_word: עַל כֶּתֶף
  choice: kwenye ubavu wa
  rationale: כֶּתֶף maana yake ya msingi ni ‘bega,’ lakini katika jiografia huelekeza upande, ubavu, au mteremko wa eneo. ‘Ubavu’ hudumisha taswira ya asili bila kudai kuwa ni ufukwe pekee.
- source_word: יָם כִּנֶּרֶת
  choice: Bahari ya Kinerethi
  rationale: Jina la Kiebrania la sehemu hii ya maji limehifadhiwa badala ya kubadilishwa kuwa jina la baadaye; יָם limetafsiriwa ‘Bahari.’
- source_word: קֵדְמָה
  choice: upande wa mashariki
  rationale: Kielezi hiki kinaonyesha uelekeo wa mashariki; kirai cha Kiswahili kinafaa katika maelezo ya mpaka na eneo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina ya mahali yametoholewa kwa kawaida ya Kiswahili. Marudio ya ‘mpaka utashuka’ yamehifadhiwa kwa sababu yanaakisi muundo wa maelezo ya Kiebrania. ‘Ubavu’ umetumiwa katika matini, huku tanbihi ikifafanua taswira halisi ya ‘bega’ na uwezekano wa maana za kijiografia.
