  text: 'Na kwa ajili ya kabila la wana wa Efraimu[a], kiongozi: Kemueli mwana wa Shiftani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Efraimu”; yaani, wazao au watu wa kabila la Efraimu.'
