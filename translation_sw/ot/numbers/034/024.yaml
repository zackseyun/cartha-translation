lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Na kwa ajili ya kabila la
  rationale: Katika orodha hii מַטֶּה humaanisha kabila, si fimbo; viambishi וּ na לְ vimewasilishwa kwa pamoja kama “Na kwa ajili ya.”
- source_word: בְנֵי אֶפְרַיִם
  choice: wana wa Efraimu
  rationale: Huhifadhi kwa karibu muundo wa Kiebrania “wana wa Efraimu,” huku tanbihi ikifafanua kuwa ni wazao au wanakabila wa Efraimu.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Neno hili hapa humtaja mkuu au mwakilishi aliyewekwa kwa ajili ya kabila; “kiongozi” ni Kiswahili cha sasa kisicholeta maana ya kifalme isiyokusudiwa.
- source_word: קְמוּאֵל
  choice: Kemueli
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ni muundo wa kawaida wa kutaja nasaba ya baba katika Kiswahili cha Biblia.
- source_word: שִׁפְטָן
  choice: Shiftani
  rationale: Jina la mtu limetoholewa kwa tahajia inayohifadhi konsonanti za jina la Kiebrania na kufuata matamshi ya Kiswahili.
