lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akasema na
  rationale: Wayyiqtol inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akasema na” ni namna ya asili ya kueleza mtu anayemwelekea mwingine kwa maneno.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֶל
