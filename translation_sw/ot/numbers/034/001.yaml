  rationale: Katika muundo wa Kiswahili “akasema na Musa,” “na” huonyesha mtu aliyeelekezewa maneno kwa njia ya kawaida.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi fomula ya Kiebrania inayotanguliza maneno yanayofuata, bila kuyaunganisha mapema na mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la Mungu YHWH, si cheo. “Yahwe” hulihifadhi kama jina la pekee huku tanbihi ikieleza desturi nyingine za kulitafsiri.
translation_notes:
