  text: 'And for the tribe of the sons of Asher, a leader: Ahihud son of Shelomi.'
translation:
  language: sw
  text: 'Na kwa kabila la wana wa Asheri: kiongozi Ahihudi, mwana wa Shelomi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Na kwa kabila la
  rationale: Katika muktadha wa ugawaji wa nchi, מַטֶּה humaanisha kabila, si fimbo; viambishi וּ na לְ vimetafsiriwa kwa kawaida kuwa “Na kwa”.
- source_word: בְנֵי אָשֵׁר
  choice: wana wa Asheri
  rationale: Huhifadhi muundo wa Kiebrania “wana wa Asheri,” ambao hapa ni jina la kawaida la kikabila linalowahusu wazao wake.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Neno hili humtaja mwakilishi rasmi wa kabila aliyeteuliwa kushiriki katika ugawaji wa nchi; “kiongozi” ni wazi na halidokezi lazima cheo cha kifalme.
- source_word: אֲחִיהוּד
  choice: Ahihudi
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: בֶּן שְׁלֹמִי
  choice: mwana wa Shelomi
  rationale: Ni muundo wa kawaida wa Kiebrania unaotaja ukoo kwa baba, na umetafsiriwa moja kwa moja kwa Kiswahili.
