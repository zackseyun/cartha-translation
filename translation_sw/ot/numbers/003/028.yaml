  text: בְּ/מִסְפַּר֙ כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה שְׁמֹנַ֤ת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/028.yaml
  text: By the number of every male from a month old and upward[a], there were eight thousand six hundred, keeping charge of the holy place.
translation:
  language: sw
  text: Idadi ya wanaume wote wenye umri wa mwezi mmoja na kuendelea ilikuwa elfu nane na mia sita. Hao ndio waliokuwa na wajibu wa kutunza mahali patakatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vitu vitakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: Idadi ya wanaume wote
  rationale: Huwasilisha kwa Kiswahili cha kawaida fomula ya sensa, huku ikihifadhi wazi kwamba waliohesabiwa walikuwa wanaume.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: wenye umri wa mwezi mmoja na kuendelea
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili unaoonyesha kiwango cha chini cha umri kilichotajwa katika Kiebrania.
- source_word: שְׁמֹנַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: elfu nane na mia sita
  rationale: Nambari imeandikwa kwa maneno kwa mtindo wa kifasihi unaofaa maandishi ya Biblia.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: waliokuwa na wajibu wa kutunza
  rationale: Muundo huu wa Kiebrania unaunganisha kitenzi na nomino zenye mzizi mmoja ili kueleza jukumu walilokabidhiwa; tafsiri hii inaleta maana hiyo kwa Kiswahili cha asili bila uradidi usio wa kawaida.
- source_word: הַקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Katika muktadha huu neno linaelekea kurejelea eneo takatifu lililokuwa chini ya uangalizi wa Walawi. Tafsiri inalinda maana hiyo huku tanbihi ikitaja uwezekano wa kurejelea vitu vitakatifu.
theological_decisions:
- issue: Ikiwa הַקֹּדֶשׁ inarejelea mahali patakatifu au vitu vitakatifu
  choice: mahali patakatifu
  alternative: vitu vitakatifu
  rationale: Muktadha wa wajibu wa ukoo wa Kohathi unaunga mkono eneo takatifu, lakini umbo la Kiebrania linaweza pia kutumiwa kuhusu vitu vitakatifu; kwa hiyo uwezekano huo umehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Sentensi mbili zimetumiwa ili kuonyesha wazi kwamba watu hao 8,600 ndio waliokuwa na wajibu huo, bila kubadili uhusiano wa kisarufi wa maandishi ya Kiebrania.
