base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/008.yaml
  text: They shall keep charge of all the furnishings of the tent of meeting[a], and the duty of the sons of Israel, to perform the service of the tabernacle.
translation:
  language: sw
  text: Nao watatunza vifaa vyote vya Hema la Kukutania na kutekeleza wajibu wa wana wa Israeli[a], kwa kufanya huduma ya Maskani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulinzi kwa ajili ya wana wa Israeli.”
    reason: מִשְׁמֶרֶת linaweza kumaanisha wajibu uliokabidhiwa au ulinzi unaoshikwa; uhusiano wa kirai “wa wana wa Israeli” unaweza pia kuonyesha huduma inayofanywa kwa niaba yao.
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: watatunza
  rationale: Katika muktadha wa Maskani, kitenzi hiki kinahusu kutunza kwa uangalifu na kusimamia kile walichokabidhiwa; “watatunza” ni cha kawaida na hubeba wazo la uangalizi bila kukifupisha kuwa kutazama tu.
- source_word: כָּל כְּלֵי אֹהֶל מוֹעֵד
  choice: vifaa vyote vya Hema la Kukutania
  rationale: כְּלִים linaweza kumaanisha vyombo, vifaa, au vitu vinavyotumika. “Vifaa” ni pana vya kutosha kujumuisha vitu mbalimbali vya patakatifu bila kudokeza vyombo vya kuwekea vitu pekee.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Jina hili linahifadhi picha ya hema na kusudi lake kama mahali pa kukutana; pia ni istilahi inayoeleweka katika Kiswahili cha Biblia.
- source_word: מִשְׁמֶרֶת
  choice: wajibu
  rationale: Nomino hii hapa inaashiria jukumu au huduma iliyokabidhiwa. “Wajibu” ni ya asili katika Kiswahili na huepuka kurudia wazo la “kutunza” kwa namna isiyo laini.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili linafuata kwa karibu usemi wa Kiebrania wenye umbo la kiume na kuudumisha kama jina la kijumuiya, badala ya kuufanya tu “Waisraeli.”
- source_word: לַעֲבֹד אֶת עֲבֹדַת הַמִּשְׁכָּן
  choice: kwa kufanya huduma ya Maskani
  rationale: Mzizi עבד umetumiwa kama kitenzi na nomino ili kueleza kutekeleza kazi ya ibada iliyokabidhiwa. “Kufanya huduma” ni Kiswahili cha asili na kinadumisha maana ya huduma rasmi ya Maskani.
theological_decisions:
- issue: Usemi wa kijumuiya wenye jinsia katika בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Matini chanzo ina usemi wa kijumuiya wenye umbo la kiume. “Wana wa Israeli” linahifadhi umbo hilo na wakati huohuo linafanya kazi kama jina la taifa katika muktadha huu.
- issue: Uhusiano wa מִשְׁמֶרֶת na wana wa Israeli
  choice: kutekeleza wajibu wa wana wa Israeli
  alternative: kushika ulinzi kwa ajili ya wana wa Israeli
  rationale: Kirai cha Kiebrania kinaweza kueleweka kuwa Walawi wanatekeleza jukumu lililowahusu wana wa Israeli, au wanashika ulinzi kwa ajili yao. Matini kuu inadumisha muundo wa “wajibu wa,” na tanbihi inaonyesha uwezekano mwingine bila kuamua kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Hema la Kukutania” na “Maskani” zimetumiwa kutofautisha majina mawili ya patakatifu yaliyopo katika Kiebrania. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika moja kwa moja.
