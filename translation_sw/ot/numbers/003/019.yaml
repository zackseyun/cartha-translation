  text: 'And the sons of Kohath, by their clans: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: sw
  text: 'Na wana wa Kohathi, kwa koo zao: Amramu, Ishari, Hebroni na Uzieli.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: בְּנֵי ni wingi wa hali ya kutegemea wenye maana ya “wana wa.” Katika orodha hii inawataja wana walio waanzilishi wa koo; kiunganishi וּ kimetafsiriwa “Na” ili kuendeleza muundo wa orodha.
- source_word: קְהָת
  choice: Kohathi
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika na kutamkika kwa kawaida katika Kiswahili.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה hapa ni kundi la ukoo ndani ya mpangilio wa kabila, si familia ndogo ya nyumbani tu; “kwa koo zao” ni fupi, wazi na inafaa muundo wa orodha.
- source_word: עַמְרָם
  choice: Amramu
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: וְיִצְהָר
  choice: Ishari
  rationale: Jina la mtu limetoholewa kwa Kiswahili; kiunganishi chake kimewakilishwa na mpangilio wa kawaida wa orodha.
- source_word: חֶבְרוֹן
  choice: Hebroni
  rationale: Hapa ni jina la mtu, ingawa umbo lilelile hutumiwa pia kwa jina la mahali; muktadha wa nasaba unaweka maana hiyo wazi.
- source_word: וְעֻזִּיאֵל
  choice: na Uzieli
  rationale: Jina limetoholewa kwa Kiswahili, na kiunganishi וְ kimetafsiriwa wazi kuwa “na” kabla ya jina la mwisho katika orodha.
