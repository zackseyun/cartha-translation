base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/051.yaml
  text: And Moses gave the redemption money to Aaron and to his sons[a], at the command of Yahweh, just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Musa akawapa Aroni na wanawe fedha za ukombozi[a], kwa amri ya Yahwe, kama vile Yahwe alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “fedha ya waliokombolewa”; yaani, malipo yaliyokusanywa kwa ajili ya ukombozi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akawapa
  rationale: Kitenzi cha masimulizi kinaendeleza mfululizo wa matukio; “akawapa” ni cha kawaida na kinaonyesha kwamba Aroni pamoja na wanawe ndio waliopokea.
- source_word: כֶּסֶף הַפְּדֻיִם
  choice: fedha za ukombozi
  rationale: Ingawa muundo huo kihalisi ni “fedha ya waliokombolewa,” katika muktadha unamaanisha malipo yaliyokusanywa kwa ajili ya ukombozi. “Fedha za ukombozi” ni wazi na huhifadhi maana ya kisheria na kiibada.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Aroni na wanawe
  rationale: Kiambishi cha nafsi katika “wanawe” kinarejelea Aroni; umbo hili ni la asili katika Kiswahili.
- source_word: עַל פִּי יְהוָה
  choice: kwa amri ya Yahwe
  rationale: Nahau hiyo, ambayo kihalisi ni “kwa kinywa cha Yahwe,” hapa ina maana ya kutenda kulingana na amri yake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: kama vile Yahwe alivyomwamuru Musa
  rationale: “Kama vile” huonyesha ulinganifu kamili kati ya tendo la Musa na agizo la awali la Yahwe.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya כֶּסֶף הַפְּדֻיִם
  choice: fedha za ukombozi
  alternative: fedha ya waliokombolewa
  rationale: Chaguo kuu linaeleza kwa Kiswahili cha kawaida kuwa fedha hizo ndizo malipo ya ukombozi, huku tanbihi ikihifadhi muundo halisi unaoweza kueleweka kuwa unawahusu waliokombolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mtindo wa masimulizi kwa “akawapa,” na istilahi “ukombozi” huhifadhi uzito wa kisheria na kiibada wa kifungu.
