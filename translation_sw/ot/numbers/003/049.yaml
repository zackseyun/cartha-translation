base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/049.yaml
  text: And Moses took the redemption money from those who were in excess over those redeemed by the Levites[a][b].
translation:
  language: sw
  text: Musa akachukua fedha ya ukombozi[a] kutoka kwa wale ambao idadi yao ilizidi idadi ya wale waliokombolewa kwa njia ya Walawi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fedha ya fidia.” Neno la Kiebrania linaweza kumaanisha malipo yanayotolewa kwa ajili ya ukombozi.
    reason: lexical_alternative
  - marker: b
    text: Yaani, kutoka kwa Waisraeli ambao idadi yao ilizidi idadi iliyowakilishwa na Walawi katika hesabu ya ukombozi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Kitenzi לקח hapa ni kitenzi cha kawaida cha simulizi chenye maana ya ‘kuchukua’; umbo la ‘aka-’ linaendeleza mfuatano wa matukio.
- source_word: כֶּסֶף הַפִּדְיוֹם
  choice: fedha ya ukombozi
  rationale: Kirai hiki kinamaanisha fedha iliyolipwa kwa ajili ya ukombozi. ‘Fedha ya ukombozi’ ni Kiswahili cha kawaida na kinahifadhi maana ya kisheria na kiibada; ‘fedha ya fidia’ imewekwa kama mbadala katika tanbihi.
- source_word: מֵאֵת
  choice: kutoka kwa
  rationale: Kihusishi kinaonyesha chanzo cha fedha; ‘kutoka kwa’ kinatoa maana hiyo kwa kawaida bila kuongeza wazo la ‘kutoka mkononi mwa.’
- source_word: הָעֹדְפִים
  choice: wale waliozidi idadi
  rationale: Kivumishi-tendaji hiki kinawataja waliokuwa ziada kwa kulinganisha idadi. Kuongeza ‘idadi’ kunafanya ulinganisho huo uwe wazi katika Kiswahili bila kuwataja moja kwa moja kuwa wazaliwa wa kwanza, jambo linalotokana na muktadha.
- source_word: עַל
  choice: waliozidi idadi ya
  rationale: Hapa עַל inaonyesha ulinganisho wa idadi, yaani kuwa zaidi ya kundi lingine.
- source_word: פְּדוּיֵי הַלְוִיִּם
  choice: wale waliokombolewa kwa njia ya Walawi
  rationale: Muundo wa Kiebrania ni kirai cha hali-tendwa kinachohusishwa na Walawi. Tafsiri hii inaonyesha nafasi ya Walawi katika mpango wa ukombozi bila kudai kwamba wao wenyewe walilipa fedha au walifanya tendo hilo moja kwa moja.
theological_decisions:
- issue: Uhusiano kati ya waliokombolewa na Walawi katika פְּדוּיֵי הַלְוִיִּם
  choice: wale waliokombolewa kwa njia ya Walawi
  alternative: waliokombolewa na Walawi; waliokombolewa wa Walawi
  rationale: Kirai-unganishi cha Kiebrania hakibainishi kikamilifu aina ya uhusiano. ‘Kwa njia ya Walawi’ kinaeleza nafasi yao ya uwakilishi katika hesabu huku kikiepuka kudokeza umiliki au tendo la moja kwa moja lisilosemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. ‘Ukombozi’ huhifadhi msamiati wa kisheria na kiibada wa kifungu, huku tanbihi zikifafanua mbadala wa kileksika na msingi wa hesabu.
