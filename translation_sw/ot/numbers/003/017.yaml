lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ndio waliokuwa
  rationale: Kitenzi היה katika muktadha huu ni kiunganishi cha wakati uliopita kinachoanzisha orodha, si kuonyesha mabadiliko ya hali.
- source_word: אֵלֶּה
  choice: Hawa
  rationale: Kiwakilishi hiki cha kuonyesha kinarejelea watu wanaotajwa mara moja baada yake.
- source_word: בְנֵי לֵוִי
  choice: wana wa Lawi
  rationale: Hapa בנים inawahusu wana watatu wa moja kwa moja wa Lawi, kwa hiyo ‘wana’ ni sahihi kuliko neno pana la ‘wazao’.
- source_word: בִּשְׁמֹתָם
  choice: kwa majina yao
  rationale: Hifadhi maana ya msingi ya ‘kwa/kulingana na majina yao’ na utangulize orodha ya majina kwa Kiswahili kinachoeleweka.
- source_word: גֵּרְשׁוֹן
  choice: Gershoni
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili na linalolingana na mfumo wa sauti wa Kiswahili.
- source_word: קְהָת
  choice: Kohathi
  rationale: Unukuzi wa kawaida wa Kiswahili unaohifadhi utambulisho wa jina la Kiebrania.
- source_word: מְרָרִי
  choice: Merari
  rationale: Jina limenukuliwa kwa umbo lake la kawaida katika Kiswahili.
