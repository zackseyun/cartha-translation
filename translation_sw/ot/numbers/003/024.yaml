  text: And the chief of the ancestral house of the Gershonites was Eliasaph son of Lael[a].
translation:
  language: sw
  text: Na mkuu wa jamaa ya ukoo wa Wagershoni alikuwa Eliasafu mwana wa Laeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nyumba ya baba,” istilahi ya Kiisraeli ya undugu inayomaanisha jamaa ya ukoo au sehemu ya ukoo mkubwa.'
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: Na mkuu
  rationale: Neno נָשִׂיא humaanisha kiongozi au mkuu. Katika orodha hii ya mpangilio wa Walawi, “mkuu” linaonyesha cheo cha uongozi bila kudokeza ufalme; וּ limetafsiriwa “Na” ili kudumisha mwendelezo wa orodha.
- source_word: בֵּית אָב
  choice: jamaa ya ukoo
  rationale: Kirai hiki, kihalisi “nyumba ya baba,” ni istilahi ya undugu wa Kiisraeli inayotaja kundi la kifamilia linalotokana na babu mmoja. “Jamaa ya ukoo” ni Kiswahili cha kawaida na hudumisha maana ya kijamii ya kirai hicho.
- source_word: לַ/גֵּרְשֻׁנִּי
  choice: wa Wagershoni
  rationale: Umbo hili linahusisha mkuu na kundi la wazao wa Gershoni. “Wagershoni” linaonyesha kundi hilo kwa kawaida katika Kiswahili.
- source_word: אֶלְיָסָף
  choice: Eliasafu
  rationale: Jina la mtu limenakiliwa kwa umbo linalofaa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Hii ndiyo tafsiri ya kawaida ya uhusiano wa kizazi katika nasaba.
- source_word: לָאֵל
  choice: Laeli
  rationale: Jina la mtu limenakiliwa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
