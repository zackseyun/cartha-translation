  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּפְקֹ֥ד אֹתָ֛/ם מֹשֶׁ֖ה עַל פִּ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צֻוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/016.yaml
  text: So Moses counted them at the command of Yahweh[a], just as he had been commanded.
translation:
  language: sw
  text: Basi Musa akawahesabu kwa amri ya Yahwe[a], kama alivyoamriwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kwa kinywa cha Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: akawahesabu
  rationale: Katika muktadha huu wa sensa, kitenzi פקד kinamaanisha kuwahesabu watu; “akawahesabu” ni Kiswahili cha kawaida na wazi.
- source_word: אֹתָם
  choice: -wa-
  rationale: Kiambishi cha yambwa “-wa-” kinawarejelea Walawi waliotajwa katika muktadha.
- source_word: עַל פִּי יְהוָה
  choice: kwa amri ya Yahwe
  rationale: Nahau עַל־פִּי, ambayo kihalisi ni “kwa kinywa cha,” hapa inaonyesha kutenda kwa mamlaka ya agizo la Mungu; “kwa amri ya” ni ya asili katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa namna ya kulitamka inayotumika kwa kawaida katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: “Kama” linaonyesha kwamba kitendo cha Musa kililingana na agizo alilopewa, bila kuongeza msisitizo usio wa lazima.
- source_word: צֻוָּה
  choice: alivyoamriwa
  rationale: Muundo huu wa kutendwa unadumisha sauti ya uamilifu ya Kiebrania na unaeleweka kwa kawaida kuwa unamrejelea Musa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahwe” hulihifadhi jina hilo kwa umbo la kawaida la Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Basi” linaendeleza simulizi kwa kawaida; sentensi ni fupi na wazi huku ikihifadhi nahau ya Kiebrania katika tanbihi.
