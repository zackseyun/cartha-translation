  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/מִדְבַּ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/014.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], saying,
translation:
  language: sw
  text: Yahwe[a] akasema na Musa katika nyika ya Sinai, akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi limetafsiriwa “BWANA.”'
    reason: Inaeleza umbo la Kiebrania na tafsiri ya jadi ya jina la Mungu.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Kitenzi דִּבֵּר pamoja na אֶל ni fomula ya simulizi inayomaanisha kusema au kunena na mtu. “Akasema na” ni Kiswahili cha sasa na kinahifadhi tendo la Mungu kumwelekezea Musa maneno.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti YHWH limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: בְּמִדְבַּר
  choice: katika nyika ya
  rationale: מִדְבָּר ni eneo la nyika au jangwa lisilolimwa; “nyika” linafaa kwa mazingira ya Sinai bila kudokeza kwamba eneo lote lilikuwa jangwa la mchanga.
- source_word: סִינַי
  choice: Sinai
  rationale: Hili ndilo umbo la kawaida la jina la mahali katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Neno hili linaanzisha maneno yanayofuata. “Akisema” linahifadhi kwa uwazi fomula na muundo wa Kiebrania, ingawa katika Kiswahili cha kawaida nukta mbili pia ingewezekana.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA (au Yehova)
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikitaja desturi nyingine ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “akisema” umeachwa ili kuonyesha kwamba ujumbe wenyewe unaanza katika mstari unaofuata.
