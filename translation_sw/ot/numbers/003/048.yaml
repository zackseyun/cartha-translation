  text: And you shall give the silver to Aaron and to his sons as the redemption price for those among them who are in excess[a].
translation:
  language: sw
  text: Nawe utawapa Haruni na wanawe fedha hiyo kuwa bei ya ukombozi kwa ajili ya wale waliozidi miongoni mwao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “kwa ajili ya waliokombolewa kati ya wale waliozidi miongoni mwao.” Kiebrania kinaunganisha maneno haya kwa ufupi; maandishi makuu yanaifafanua maana ili iwe wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Nawe utampa
  rationale: Kitenzi cha Qal timilifu nafsi ya pili umoja pamoja na kiunganishi, katika muktadha wa maagizo yanayofuatana, kinaeleza agizo la wakati ujao. “Nawe utampa” huhifadhi mfuatano huo kwa Kiswahili cha kawaida.
- source_word: הַכֶּסֶף
  choice: fedha hiyo
  rationale: כֶּסֶף kimsingi ni “fedha” (silver), na pia hutumiwa kwa maana ya malipo. “Fedha hiyo” ni ya asili katika Kiswahili na inarejelea kiasi kilichotajwa katika muktadha uliotangulia.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Haruni na wanawe
  rationale: Kiambishi cha yambwa katika “utampa” kinaonyesha mpokeaji, huku “Haruni na wanawe” kikihifadhi warejelewa mahususi wa Kiebrania bila kurudia kihusishi kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: פְּדוּיֵי
  choice: iwe bei ya ukombozi kwa ajili ya
  rationale: Umbo la wingi katika hali ya uambatani linaweza kueleweka kuwa waliokombolewa au kiasi kinachohusiana na ukombozi wao. Kwa kuwa fedha ndiyo yambwa, “bei ya ukombozi kwa ajili ya” hutoa maana ya malipo kwa uwazi huku tanbihi ikihifadhi muundo rasmi zaidi.
- source_word: הָעֹדְפִים
  choice: wale waliozidi
  rationale: Kivumishi-tendo hiki kinamaanisha watu waliobaki juu ya hesabu inayolingana—wazaliwa wa kwanza waliozidi idadi ya Walawi. “Wale waliozidi” ni kifupi, wazi, na hakiongezi maelezo yasiyokuwamo katika mstari.
- source_word: בָּהֶם
  choice: miongoni mwao
  rationale: Kihusishi ב pamoja na kiwakilishi hapa kinaonyesha ziada iliyopatikana ndani ya kundi lililohesabiwa; “miongoni mwao” huhifadhi uhusiano huo.
