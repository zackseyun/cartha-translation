base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/021.yaml
  text: To Gershon belonged the clan of the Libnites and the clan of the Shimeites; these are the clans of the Gershonites.
translation:
  language: sw
  text: Kwa Gershoni kulikuwa na ukoo wa Walibni na ukoo wa Washimei; hizi ndizo koo za Wagershoni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹן
  choice: Kwa Gershoni kulikuwa na
  rationale: Kiambishi לְ kinaonyesha uhusiano wa koo hizi na Gershoni. Kauli hii ya Kiswahili ni ya kawaida katika orodha ya nasaba na haiifanyi לְ kuwa umilikaji mkali kuliko inavyodai matini.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: ukoo / koo
  rationale: Katika muktadha wa sensa na nasaba, מִשְׁפָּחָה ni kundi pana la undugu lililo chini ya kabila; “ukoo” linaonyesha kiwango hicho vizuri kuliko “familia” au “kabila.”
- source_word: הַלִּבְנִי
  choice: Walibni
  rationale: Umbo hili la jina la kundi linawataja wazao au wanaukoo wa Libni; “Walibni” ni tafsiri fupi na ya kawaida kwa kundi la watu.
- source_word: הַשִּׁמְעִי
  choice: Washimei
  rationale: Jina hili la kundi linamaanisha wazao au wanaukoo wa Shimei; “Washimei” linadumisha ulinganifu na “Walibni.”
- source_word: אֵלֶּה הֵם
  choice: hizi ndizo
  rationale: Hii ni kauli ya utambulisho katika orodha. “Hizi ndizo” inapatana kisarufi na nomino ya wingi “koo” na kuhifadhi msisitizo wa Kiebrania.
- source_word: הַגֵּרְשֻׁנִּי
  choice: Wagershoni
  rationale: Jina la kundi linataja tawi la Walawi lililotokana na Gershoni; “Wagershoni” ni wazi na fasaha katika Kiswahili.
