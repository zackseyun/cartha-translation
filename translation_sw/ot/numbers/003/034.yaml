lexical_decisions:
- source_word: וּפְקֻדֵיהֶם
  choice: waliohesabiwa miongoni mwao
  rationale: Nomino inayotokana na פקד pamoja na kiambishi cha nafsi ya tatu wingi inarejelea watu wa kundi hili walioingizwa katika sensa; usemi huu ni wa kawaida katika Kiswahili na unadumisha maana ya watu waliohesabiwa.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: yaani wanaume wote
  rationale: Katika muktadha huu kifungu kinafafanua ni akina nani waliojumlishwa katika hesabu. “Wanaume wote” huwasilisha kwa lugha ya kawaida maana ya kila mtu wa kiume bila kurudia neno “hesabu” kwa namna nzito.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: wenye umri wa mwezi mmoja na kuendelea
  rationale: Huhifadhi kikomo cha chini cha umri na wazo la kuanzia hapo kwenda juu kwa Kiswahili cha sasa na kinachoeleweka.
- source_word: שֵׁשֶׁת אֲלָפִים וּמָאתָיִם
  choice: elfu sita na mia mbili
  rationale: Huwakilisha kwa usahihi jumla ya 6,200 na kuandika idadi kwa maneno kunafaa mtindo wa maandishi ya Biblia.
