  text: And those counted among them[a], by the number of every male from a month old and upward, were six thousand two hundred.
translation:
  language: sw
  text: Nao waliohesabiwa miongoni mwao[a], kwa hesabu ya kila mwanamume mwenye umri wa kuanzia mwezi mmoja na zaidi, walikuwa elfu sita na mia mbili.
  philosophy: optimal-equivalence
  footnotes:
