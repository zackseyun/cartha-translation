  yaml_path: translation/ot/numbers/003/033.yaml
  text: 'For Merari: the clan of the Mahlites and the clan of the Mushites; these are the clans of Merari.'
translation:
  language: sw
  text: 'Kwa Merari: ukoo wa Wamahli na ukoo wa Wamushi; hizi ndizo koo za Merari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִמְרָרִי
  choice: Kwa Merari
  rationale: Kiambishi לְ kinaanzisha sehemu ya orodha inayomhusu Merari; “Kwa Merari” ni kichwa cha uainishaji kinachoeleweka kwa Kiswahili.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika muktadha huu wa nasaba na sensa, מִשְׁפָּחָה ni kundi la jamaa ndani ya kabila; “ukoo” ni sahihi kuliko “familia” au “kabila.”
- source_word: הַמַּחְלִי
  choice: Wamahli
  rationale: Ni jina la ukoo wa wazao au kundi linalohusishwa na Mahli; umbo “Wamahli” linaonyesha kundi la watu kwa Kiswahili.
- source_word: וּמִשְׁפַּחַת
  choice: na ukoo wa
  rationale: Kiunganishi וּ kinaunganisha ukoo wa pili na wa kwanza, huku kurudia “ukoo wa” kukihifadhi muundo rasmi na uwazi wa Kiebrania.
- source_word: הַמּוּשִׁי
  choice: Wamushi
  rationale: Ni jina la ukoo wa wazao au kundi linalohusishwa na Mushi; “Wamushi” ni umbo la kawaida la Kiswahili kwa kundi la watu.
- source_word: אֵלֶּה הֵם
  choice: hizi ndizo
  rationale: Muungano wa kiwakilishi kionyeshi na kiwakilishi huru unasisitiza utambulisho; “hizi ndizo” huhifadhi msisitizo huo na kupatana na ngeli ya “koo.”
- source_word: מִשְׁפְּחֹת מְרָרִי
  choice: koo za Merari
  rationale: Wingi huu unajumlisha koo mbili zilizotajwa; “koo za Merari” huhifadhi uhusiano wa kinasaba na uthabiti wa istilahi.
