language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/חֹנִ֣ים לִ/פְנֵ֣י הַ/מִּשְׁכָּ֡ן קֵ֣דְמָ/ה לִ/פְנֵי֩ אֹֽהֶל מוֹעֵ֨ד מִזְרָ֜חָ/ה מֹשֶׁ֣ה וְ/אַהֲרֹ֣ן וּ/בָנָ֗י/ו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַ/מִּקְדָּ֔שׁ לְ/מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/038.yaml
  text: Those who camped in front of the tabernacle on the east[a], in front of the tent of meeting toward the sunrise, were Moses and Aaron and his sons, keeping charge of the sanctuary on behalf of the sons of Israel[b]. But the outsider who comes near shall be put to death.
translation:
  language: sw
  text: Waliopiga kambi mbele ya Maskani upande wa mashariki[a], mbele ya Hema la Kukutania kuelekea mashariki, walikuwa Musa, Haruni na wanawe, wakilinda mahali patakatifu kwa niaba ya wana wa Israeli. Lakini mtu asiyepewa ruhusa[b] anayekaribia atauawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuelekea mashariki ... upande wa mashariki”; Kiebrania kinatumia semi mbili zinazohusiana za mwelekeo ili kusisitiza upande huo.
    reason: lexical_alternative
  - marker: b
    text: “Mtu asiyepewa ruhusa” ni mtu ambaye haruhusiwi kukaribia huduma ya mahali patakatifu; si lazima awe mgeni wa taifa lingine.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחֹנִים
  choice: Waliopiga kambi
  rationale: Kirai hiki cha kisifa kinawataja watu waliokuwa wamepangwa kupiga kambi hapo; wakati uliopita unafaa katika maelezo haya ya mpangilio wa kambi.
- source_word: לִפְנֵי הַמִּשְׁכָּן
  choice: mbele ya Maskani
  rationale: “Mbele ya” hutoa maana ya mahali ya לִפְנֵי, na “Maskani” huitofautisha מִשְׁכָּן na Hema la Kukutania linalotajwa baadaye.
- source_word: קֵדְמָה ... מִזְרָחָה
  choice: upande wa mashariki ... kuelekea macheo ya jua
  rationale: Maneno mawili yanayohusiana kuhusu mwelekeo yamehifadhiwa bila kurudiwa kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni jina la kawaida, wazi na lenye heshima kwa hema la kukutana na Mungu katika muktadha huu.
- source_word: מֹשֶׁה וְאַהֲרֹן וּבָנָיו
  choice: Musa, Haruni na wanawe
  rationale: Kiambishi cha umoja katika “wanawe” kinamrejelea Haruni kwa namna ya kawaida zaidi, si Musa na Haruni kwa pamoja.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת הַמִּקְדָּשׁ
  choice: Walitekeleza wajibu wa kulinda mahali patakatifu
  rationale: Muundo wa maneno yenye mzizi mmoja unaonyesha kutimiza jukumu walilokabidhiwa; tafsiri hii ni ya asili katika Kiswahili na inadumisha wazo la ulinzi.
- source_word: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: kwa niaba ya wana wa Israeli
  rationale: Kirai kinaonyesha kwamba viongozi hawa walitimiza jukumu la patakatifu kwa niaba ya jumuiya yote ya Israeli.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Usemi wa kifamilia wa Kiebrania umehifadhiwa kwa kuwa hapa unawataja watu wa agano kwa ujumla.
- source_word: וְהַזָּר
  choice: mtu asiyepewa ruhusa
  rationale: Katika sheria hii זָר humaanisha mtu asiye na idhini ya kushiriki au kukaribia huduma ya patakatifu, si lazima mtu wa taifa jingine.
- source_word: הַקָּרֵב
  choice: anayekaribia
  rationale: Huhifadhi moja kwa moja wazo la kumkaribia mahali au huduma takatifu bila ruhusa.
- source_word: יוּמָת
  choice: atauawa
  rationale: Umbo la Kiebrania ni la kutendwa na linaonyesha hukumu ya kifo inayotekelezwa, si kufa kwa kawaida.
theological_decisions:
- issue: Mrejelewa wa “wanawe”
  choice: “Wanawe” ni wana wa Haruni
  alternative: Wana wa familia zinazohusishwa kwa pamoja na Musa na Haruni
  rationale: Kiambishi cha nafsi ya tatu umoja baada ya jina Haruni kwa kawaida humrejelea Haruni, na mahali pengine katika sura hii jukumu la kikuhani linahusishwa na Haruni na wanawe.
- issue: Maana ya זָר katika sheria ya patakatifu
  choice: Mtu yeyote asiyeidhinishwa kukaribia huduma takatifu
  alternative: Mgeni wa kabila au taifa lingine
  rationale: Muktadha unahusu mamlaka ya huduma ya Maskani na mipaka ya kuikaribia, hivyo tofauti inayokusudiwa ni ya ruhusa ya kidini, si asili ya kikabila.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Maskani” na “Hema la Kukutania” zimetumiwa kwa uthabiti kama istilahi tofauti, huku urudiaji wa kimwelekeo wa Kiebrania ukihifadhiwa kwa Kiswahili cha asili.
