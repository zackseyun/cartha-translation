  language: sw
  text: Lilete karibu kabila la Lawi, na ulisimamishe mbele ya kuhani Aroni, nao watamtumikia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watamhudumia.” Kitenzi cha Kiebrania kinaweza kumaanisha kumhudumia mtu au kufanya huduma ya kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְרֵב
  choice: Lilete karibu
  rationale: Kauli ya kusababisha ya קרב ina maana ya kulifanya lije karibu. “Lilete karibu” huhifadhi picha halisi na muktadha wa huduma takatifu.
- source_word: מַטֵּה לֵוִי
  choice: kabila la Lawi
  rationale: Ingawa מַטֶּה inaweza kumaanisha fimbo, katika muktadha huu inarejelea kundi la kikabila la Lawi.
- source_word: וְהַעֲמַדְתָּ אֹתוֹ
  choice: ulisimamishe
  rationale: Kauli ya kusababisha ya עמד humaanisha kusimamisha au kuweka mahali pa kusimama. Umbo la umoja linaendana na nomino ya pamoja “kabila.”
- source_word: לִפְנֵי אַהֲרֹן הַכֹּהֵן
  choice: mbele ya kuhani Aroni
  rationale: לִפְנֵי humaanisha moja kwa moja “mbele ya” au “katika uwepo wa”; mpangilio huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וְשֵׁרְתוּ אֹתוֹ
  choice: nao watamtumikia
  rationale: שרת huonyesha huduma ya mhudumu, mara nyingi katika mazingira ya ibada. Kiwakilishi cha yambwa kinamrejelea Aroni, na wingi unaonyesha watu wa kabila hilo.
theological_decisions:
- issue: Aina ya huduma ya Walawi kwa Aroni
  choice: Walawi watamtumikia Aroni katika nafasi yake ya ukuhani.
  alternative: Walawi watahudumu pamoja na Aroni.
  rationale: Kiwakilishi cha yambwa katika וְשֵׁרְתוּ אֹתוֹ kwa kawaida humrejelea Aroni; kwa hiyo tafsiri haibadilishi huduma kwa Aroni kuwa huduma pamoja naye.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Alama ya tanbihi imewekwa baada ya kitenzi kinachohusika, badala ya baada ya “Lawi,” kwa kuwa tanbihi inaeleza maana ya שרת.
