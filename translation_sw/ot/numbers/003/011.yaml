lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akasema
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” ni mtiririko wa kawaida wa Kiswahili, na “akasema na” hapa huwasilisha kitendo cha kuzungumza kilichoelekezwa kwa Musa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limeandikwa kwa namna ya kawaida ya Kiswahili kama jina binafsi, badala ya kubadilishwa kuwa cheo “BWANA.”
- source_word: אֶל
  choice: na
  rationale: Pamoja na kitenzi “kusema,” Kiswahili cha kawaida hutumia “akasema na Musa” kuonyesha mtu aliyeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Infinitivu hii hutanguliza maneno ya Mungu yanayofuata; “akisema” huhifadhi ka formula ya chanzo bila kuondoa uhusiano wake na mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina na kulitaja kwa tahajia ya Kiswahili, bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa utangulizi wa usemi umehifadhiwa, ingawa “akisema” ni wa kifomula zaidi kuliko usemi wa kawaida wa mazungumzo.
