source:
  edition: WLC
  text: כִּ֣י לִ/י֮ כָּל בְּכוֹר֒ בְּ/יוֹם֩ הַכֹּתִ֨/י כָל בְּכ֜וֹר בְּ/אֶ֣רֶץ מִצְרַ֗יִם הִקְדַּ֨שְׁתִּי לִ֤/י כָל בְּכוֹר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/אָדָ֖ם עַד בְּהֵמָ֑ה לִ֥/י יִהְי֖וּ אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/013.yaml
  text: For every firstborn is mine[a]. On the day when I struck down every firstborn in the land of Egypt, I consecrated to myself every firstborn in Israel, from man to beast. They shall be mine[b]. I am Yahweh.
translation:
  language: sw
  text: Kwa maana kila mzaliwa wa kwanza ni wangu[a]. Siku ile nilipowaua wazaliwa wote wa kwanza katika nchi ya Misri, nilijiwekea wakfu kila mzaliwa wa kwanza katika Israeli, kuanzia mwanadamu hadi mnyama[b]. Watakuwa wangu. Mimi ni Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni mali yangu.” Kirai cha Kiebrania “kwa ajili yangu/wangu” kinarudiwa mara tatu katika mstari huu, kikisisitiza umiliki wa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kutoka mwanadamu hadi mnyama,” usemi wa kawaida unaomaanisha kuanzia wanadamu hadi wanyama.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya kauli iliyotangulia kuhusu Walawi, huku ikidumisha uhusiano wa maelezo kwa Kiswahili cha kawaida.
- source_word: לִי
  choice: ni wangu / nilijiwekea / watakuwa wangu
  rationale: Marudio haya yanasisitiza kuwa wazaliwa wa kwanza ni mali ya Mungu; miundo tofauti kidogo inadumisha mkazo huo kwa Kiswahili cha asili.
- source_word: כָּל בְּכוֹר
  choice: kila mzaliwa wa kwanza / wazaliwa wote wa kwanza
  rationale: בְּכוֹר ni mzaliwa wa kwanza; jinsia ya kiume haijaelezwa wazi, kwa hiyo haijaongezwa.
- source_word: בְּיוֹם הַכֹּתִי
  choice: Siku ile nilipowaua
  rationale: Kirai hiki kinaonyesha tukio maalumu la kihistoria. Katika muktadha wa pigo la Misri, נכה ina maana ya kuwapiga kwa kuwaua.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Inahifadhi kirai kamili cha Kiebrania na uzito wake wa kisimulizi.
- source_word: הִקְדַּשְׁתִּי לִי
  choice: nilijiwekea wakfu
  rationale: Hiphil ya קדשׁ hapa ni kuweka kando kama kitu kitakatifu kwa ajili ya Mungu; 'kujiwekea wakfu' huhifadhi pia wazo la umiliki.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Inadumisha kwa ufupi eneo la kijamii ambamo wazaliwa wa kwanza waliwekwa wakfu.
- source_word: מֵאָדָם עַד בְּהֵמָה
  choice: kuanzia mwanadamu hadi mnyama
  rationale: Ni usemi unaojumuisha wazaliwa wa kwanza wa wanadamu na wa wanyama; 'mwanadamu' hapa ni nomino ya jumla, si rejeo la jinsia ya kiume pekee.
- source_word: יִהְיוּ
  choice: Watakuwa
  rationale: Inaonyesha dai la Mungu linaloendelea, kwa sauti ya tamko.
- source_word: אֲנִי יְהוָה
  choice: Mimi ni Yahwe
  rationale: Inahifadhi jina la agano יהוה na tamko la mamlaka ya Mungu.
theological_decisions:
- issue: Uwakilishi wa jina יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; 'Yahwe' hulitofautisha na cheo 'Bwana' na kuliwasilisha kama jina la agano.
- issue: Maana ya אָדָם katika usemi unaotofautisha binadamu na wanyama
  choice: mwanadamu
  alternative: mtu / wanadamu
  rationale: Hapa אָדָם ni umoja wa kijumla unaowakilisha jamii ya binadamu, si mwanamume pekee; 'mwanadamu' hudumisha umoja huo na utofauti dhidi ya 'mnyama'.
- issue: Nguvu ya הִקְדַּשְׁתִּי לִי
  choice: nilijiwekea wakfu
  alternative: niliwatakasa kwa ajili yangu / niliweka kando kuwa wangu
  rationale: Tafsiri hii hudumisha kwa pamoja wazo la kuwekwa katika hali takatifu na dai la Mungu la umiliki, bila kulipunguza kuwa umiliki wa kawaida tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zinahifadhi mkazo wa marudio ya umiliki katika Kiebrania. 'Nilijiwekea wakfu' ni lugha ya kidini inayoeleweka na inaleta pamoja kutengwa kuwa takatifu na kuwa mali ya Mungu.
