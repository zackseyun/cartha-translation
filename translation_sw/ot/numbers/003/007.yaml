  text: They shall keep his charge and the charge of the whole congregation before the tent of meeting, to perform the service of the tabernacle.
translation:
  language: sw
  text: Nao watatekeleza wajibu wake[a] na wajibu wa kusanyiko lote mbele ya Hema la Kukutania, ili kufanya huduma ya Maskani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watautunza wajibu wake” au “wataushika wajibu wake.” Kitenzi na nomino za Kiebrania zinazotokana na mzizi unaohusiana zinaweza kusisitiza uangalizi na ulinzi, pamoja na kutimiza kwa uaminifu jukumu lililokabidhiwa.
    reason: lexical_alternative
  - marker: b
    text: Yaani, Walawi wanatekeleza majukumu yanayohusiana na Haruni na kusanyiko lote katika huduma ya patakatifu.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: wataitekeleza
  rationale: Kitenzi שׁמר pamoja na מִשְׁמֶרֶת hapa kina maana ya kutunza, kuzingatia, na kutekeleza jukumu walilokabidhiwa. “Wataitekeleza” ni Kiswahili cha kawaida kinachoonyesha utimizaji wa wajibu bila kuifanya maana iwe ulinzi wa kimwili pekee.
- source_word: מִשְׁמַרְתּוֹ
  choice: wajibu wake
  rationale: מִשְׁמֶרֶת katika muktadha wa huduma ya patakatifu ni jukumu au wajibu uliokabidhiwa. Kiambishi cha nafsi ya tatu umoja wa kiume kwa kawaida kinamrejelea Haruni katika muktadha wa karibu.
- source_word: מִשְׁמֶרֶת כָּל־הָעֵדָה
  choice: wajibu wa kusanyiko lote
  rationale: Tafsiri hii inadumisha urudiaji wa neno מִשְׁמֶרֶת na kueleza jukumu linalohusu kusanyiko zima au linalotekelezwa kwa niaba yake.
- source_word: הָעֵדָה
  choice: kusanyiko
  rationale: Katika Hesabu, עֵדָה mara nyingi ni jumuiya ya Israeli kama kundi lililokusanyika. “Kusanyiko” ni neno la sasa, lenye heshima, na linalofaa muktadha huu.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: mbele ya Hema la Kukutania
  rationale: לִפְנֵי inaeleza mahali, “mbele ya.” “Hema la Kukutania” linawasilisha אֹהֶל מוֹעֵד kama mahali pa kukutana lililowekwa rasmi.
- source_word: לַעֲבֹד
  choice: ili kufanya
  rationale: Infinitivu ya עבד inaonyesha kusudi. “Ili kufanya” huunganika kwa kawaida na “huduma” na kuepuka Kiswahili kisicho cha kawaida kama “kuhudumu huduma.”
- source_word: עֲבֹדַת הַמִּשְׁכָּן
  choice: huduma ya Maskani
  rationale: עֲבֹדָה hapa ni kazi au huduma ya Walawi inayohusiana na patakatifu. “Maskani” ni istilahi fupi na iliyozoeleka kwa מִשְׁכָּן katika mazingira ya jangwani.
theological_decisions:
- issue: Kirejelewa cha kiambishi cha nafsi ya tatu umoja wa kiume katika מִשְׁמַרְתּוֹ
  choice: “Wake” anamrejelea Haruni.
  alternative: Kiambishi hicho kinaweza kueleweka kwa upana kuwa kinarejelea wajibu wa patakatifu au wajibu wa kikuhani kwa ujumla.
  rationale: Muktadha wa karibu wa Hesabu 3 unawahusu Walawi waliowekwa chini ya Haruni na wanawe. Kwa hiyo Haruni ndiye kirejelewa cha kawaida zaidi, huku pambano la “wajibu wake” na “wajibu wa kusanyiko lote” likiunga mkono usomaji huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Urudiaji wa “wajibu” umehifadhiwa ili kuakisi urudiaji wa מִשְׁמֶרֶת. Majina ya kiibada “Hema la Kukutania” na “Maskani” yametumiwa kwa uthabiti.
