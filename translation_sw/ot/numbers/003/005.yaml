lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Kitenzi hiki katika kauli ya Piel pamoja na waw ya masimulizi kinaendeleza simulizi na kuanzisha usemi wa Mungu. Katika Kiswahili cha kawaida, “akasema na” ni utangulizi wa asili na wenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: אֶל
  choice: na
  rationale: Baada ya kitenzi “kusema,” Kiswahili sanifu hutumia “sema na” kumtaja anayeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ni umbo la kawaida na lililozoeleka la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kitenzi-jina hiki kinaanzisha yaliyomo katika usemi unaofuata; “akisema” huhifadhi muundo wa fomula ya Kiebrania bila kuondoa uhusiano wake na mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Aya inatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo; “Yehova” limewekwa katika tanbihi kama umbo jingine la kimapokeo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “akasema na Musa, akisema” umehifadhi kwa makusudi fomula ya Kiebrania inayounganisha aya hii na maneno yanayofuata.
