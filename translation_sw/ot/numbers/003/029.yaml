  yaml_path: translation/ot/numbers/003/029.yaml
  text: The clans of the sons of Kohath shall camp on the south side of the tabernacle[a].
translation:
  language: sw
  text: Jamaa za wana wa Kohathi watapiga kambi upande wa kusini wa Maskani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazao wa Kohathi” au “Wakohathi.” Kiebrania kinasema kihalisi “wana wa Kohathi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: Jamaa
  rationale: Katika muktadha wa sensa na mpangilio wa kambi, neno hili linamaanisha vikundi vya ukoo, si familia ndogo za nyumbani tu. “Jamaa” ni neno la kawaida na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: בְּנֵי קְהָת
  choice: wana wa Kohathi
  rationale: Huhifadhi usemi wa Kiebrania unaomaanisha kihalisi “wana wa Kohathi” na uhusiano wake wa ukoo, huku tanbihi ikitoa tafsiri mbadala ya maana.
- source_word: יַחֲנוּ
  choice: watapiga kambi
  rationale: Kauli ya Kiebrania hapa inaeleza mpangilio uliowekwa wa wakati ujao; “watapiga kambi” ni ya asili na wazi katika Kiswahili.
- source_word: עַל יֶרֶךְ
  choice: upande wa
  rationale: Muungano huu unaonyesha mahali kuhusiana na Maskani. “Upande wa” hutoa maana hiyo kwa Kiswahili cha kawaida bila kulazimisha taswira ya kiungo cha mwili iliyomo katika maana ya msingi ya יֶרֶךְ.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: Katika Hesabu, neno hili linarejelea hema takatifu ambamo Mungu anakaa kati ya watu wake. “Maskani” ni istilahi fupi, yenye hadhi, na iliyozoeleka katika Kiswahili cha Biblia.
- source_word: תֵּימָנָה
  choice: kusini
  rationale: Umbo hili linaonyesha upande au mwelekeo wa kusini. Pamoja na “upande wa,” tafsiri “kusini” ni wazi na ya asili.
