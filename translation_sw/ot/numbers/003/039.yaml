base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/039.yaml
  text: All those counted of the Levites[a], whom Moses and Aaron counted at the command of Yahweh, by their clans, every male from a month old and upward, were twenty-two thousand.
translation:
  language: sw
  text: Walawi wote waliohesabiwa na Musa na Haruni[a] kwa amri ya Yahwe[b], kulingana na koo zao—wale wote wa kiume, kuanzia umri wa mwezi mmoja na kuendelea—walikuwa elfu ishirini na mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika maandishi ya Kiebrania, waandishi wa kale waliweka nukta zisizo za kawaida juu ya maneno “na Haruni,” huenda kuonyesha tahadhari au swali kuhusu maneno hayo.
    reason: textual_variant
  - marker: b
    text: 'Kiebrania: “kwa kinywa cha Yahwe,” nahau yenye maana ya “kwa amri ya Yahwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי / פָּקַד
  choice: waliohesabiwa / waliwahesabu
  rationale: Mzizi פקד hapa unahusu sensa. ‘Hesabu’ ni lugha ya kawaida na iliyo wazi bila kuingiza wazo la kijeshi.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili la kundi hili la kikabila.
- source_word: עַל־פִּי יְהוָה
  choice: kwa amri ya Yahwe
  rationale: Kirai hiki kinamaanisha kihalisi ‘kwa kinywa cha Yahwe,’ lakini ni nahau inayomaanisha kwamba jambo lilifanywa kwa amri yake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa kama jina maalumu badala ya kubadilishwa kuwa cheo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: ‘Koo’ huonyesha vizuri vikundi vya undugu vinavyohusika katika sensa kuliko ‘familia,’ ambalo linaweza kueleweka kwa maana finyu ya kaya.
- source_word: כָּל זָכָר
  choice: kila mwanamume
  rationale: Huhifadhi kwa wazi rejeo la Kiebrania kwa watu wa jinsia ya kiume katika sensa hii.
- source_word: מִבֶּן־חֹדֶשׁ וָמַעְלָה
  choice: mwenye umri wa mwezi mmoja na zaidi
  rationale: Ni usemi wa asili wa Kiswahili unaoweka wazi kiwango cha chini cha umri.
- source_word: שְׁנַיִם וְעֶשְׂרִים אָלֶף
  choice: elfu ishirini na mbili
  rationale: Utoaji wa moja kwa moja wa idadi hiyo.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina maalumu la Mungu; ‘Yahwe’ hulihifadhi kama jina bila kulibadilisha kuwa cheo.
- issue: Alama zisizo za kawaida juu ya וְאַהֲרֹן (‘na Haruni’)
  choice: Kuhifadhi ‘na Haruni’ katika maandishi na kueleza alama hizo katika tanbihi
  alternative: Kuondoa ‘na Haruni’ au kutoeleza alama hizo
  rationale: Maneno hayo yapo katika maandishi ya Kimasora, lakini nukta za waandishi wa kale zinaonyesha tahadhari au swali la kimapokeo kuhusu maneno hayo. Kuyahifadhi pamoja na tanbihi hakutatui kimya kimya jambo hilo la kimaandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa kuwa wa kawaida kwa Kiswahili huku ukihifadhi mpangilio wa sensa, vikundi vya ukoo, kiwango cha umri, na jumla ya watu.
