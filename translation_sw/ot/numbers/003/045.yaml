  text: קַ֣ח אֶת הַ/לְוִיִּ֗ם תַּ֤חַת כָּל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת בֶּהֱמַ֥ת הַ/לְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑/ם וְ/הָיוּ לִ֥/י הַ/לְוִיִּ֖ם אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/045.yaml
  text: Take the Levites in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of their livestock; and the Levites shall be mine[c][b]. I am Yahweh.
translation:
  language: sw
  text: Chukua Walawi badala ya kila mzaliwa wa kwanza miongoni mwa wana wa Israeli[a], na mifugo ya Walawi badala ya mifugo yao[b]. Walawi watakuwa wangu. Mimi ni Yahwe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa Waisraeli.” Kiebrania kinasema “miongoni mwa wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “badala ya.” Neno la Kiebrania linaonyesha ubadilishanaji au uwakilishi.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: YHWH; kwa desturi limetafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Chukua
  rationale: Ni amri ya moja kwa moja kwa Musa. “Chukua” ni tafsiri ya kawaida na ya wazi ya kitenzi לקח katika muktadha huu wa kuwaweka Walawi mahali pa wazaliwa wa kwanza.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili la kundi la kikabila na kiutumishi linalotajwa hapa.
- source_word: תַּחַת
  choice: badala ya
  rationale: Katika muktadha huu neno linaonyesha uwakilishi au ubadilishanaji, si nafasi ya chini kimahali.
- source_word: כָּל בְּכוֹר
  choice: kila mzaliwa wa kwanza
  rationale: 'Muundo wa umoja pamoja na כָּל una maana ya mgawanyo: kila mmoja wa wazaliwa wa kwanza.'
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: miongoni mwa wana wa Israeli
  rationale: Inahifadhi kwa karibu nahau ya Kiebrania na maana ya kihusishi ya kuchagua watu kutoka miongoni mwa kundi.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: mifugo ya Walawi
  rationale: בְּהֵמָה hapa ni jina la jumla la wanyama wanaofugwa; “mifugo” ni neno la kawaida na linalofaa katika Kiswahili.
- source_word: בְּהֶמְתָּם
  choice: mifugo yao
  rationale: Kiwakilishi kinawarejelea wana wa Israeli, na usemi huu unadumisha usambamba wa ubadilishanaji katika sentensi.
- source_word: וְהָיוּ לִי
  choice: Walawi watakuwa wangu
  rationale: Inawasilisha kwa ufupi dai la Yahwe la umiliki, huku ikitaja Walawi waziwazi kwa ajili ya ufasaha wa Kiswahili.
- source_word: אֲנִי יְהוָה
  choice: Mimi ni Yahwe
  rationale: Inahifadhi kauli ya Mungu ya kujitambulisha na jina la agano lililoandikwa kwa herufi YHWH.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu YHWH moja kwa moja. “Yahwe” hulitambulisha kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikitaja desturi nyingine ya tafsiri.
- issue: Walawi kuchukua nafasi ya wazaliwa wa kwanza
  choice: badala ya
  alternative: mahali pa
  rationale: Neno תַּחַת linaonyesha ubadilishanaji au uwakilishi. Tafsiri haiongezi maelezo ya kimadhehebu kuhusu namna au athari za uwakilishi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wazi na wenye heshima. Muundo wa amri na usambamba wa ubadilishanaji umehifadhiwa bila kuongeza ufafanuzi wa kimadhehebu.
