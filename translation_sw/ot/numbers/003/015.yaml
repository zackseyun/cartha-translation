  text: פְּקֹד֙ אֶת בְּנֵ֣י לֵוִ֔י לְ/בֵ֥ית אֲבֹתָ֖/ם לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָ֛ר מִ/בֶּן חֹ֥דֶשׁ וָ/מַ֖עְלָ/ה תִּפְקְדֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/015.yaml
  text: 'Count the sons of Levi by their fathers'' houses[a], by their clans: every male from a month old and upward you shall count.'
translation:
  language: sw
  text: Hesabu wana wa Lawi[a] kwa nyumba za baba zao, kwa koo zao. Wote wa kiume, kuanzia wenye umri wa mwezi mmoja na kuendelea, uwahesabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Walawi.” Kiebrania kinasema kihalisi “wana wa Lawi,” kikisisitiza nasaba na mpangilio wa koo.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  choice: Hesabu / uwahesabu
  rationale: Katika muktadha huu wa sensa, kitenzi hiki humaanisha kuhesabu au kuandikisha watu. Kurudia kitenzi kama ilivyo katika Kiebrania kunahifadhi agizo hilo bila kuleta maana ya kijeshi.
- source_word: בְּנֵי לֵוִי
  choice: wana wa Lawi
  rationale: Hili linafuata kwa karibu maana halisi ya ‘wana wa Lawi’ na kudumisha msisitizo wa nasaba unaoendana na nyumba za baba na koo.
- source_word: לְבֵית אֲבֹתָם
  choice: kwa nyumba za baba zao
  rationale: Usemi huu unahifadhi muundo wa kijamii na kinasaba wa ‘nyumba ya baba’ bila kuufanya kuwa neno lilelile na ‘koo’ linalofuata.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: ‘Koo’ huonyesha makundi ya kindugu na kulitofautisha neno hili na ‘nyumba za baba zao’ lililotangulia.
- source_word: כָּל זָכָר
  choice: wote wa kiume
  rationale: Kiebrania kinataja jinsia, si utu uzima. ‘Wote wa kiume’ huwahusisha watoto wachanga na watu wazima bila kutumia ‘wanaume,’ ambalo lingeweza kudokeza watu wazima pekee.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: kuanzia wenye umri wa mwezi mmoja na kuendelea
  rationale: Usemi huu unaonyesha mpaka wa chini wa umri wa wale wanaohesabiwa kwa Kiswahili cha kawaida na kilicho wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye heshima. ‘Wote wa kiume’ limetumiwa badala ya ‘wanaume wote’ ili watoto wa mwezi mmoja wajumuishwe wazi; ‘nyumba za baba zao’ limehifadhiwa kama istilahi ya kinasaba na kutofautishwa na ‘koo zao.’
