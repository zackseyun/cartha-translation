lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: nawe utachukua
  rationale: Kitenzi cha Kiebrania katika muktadha huu wa maagizo kina nguvu ya amri ya wakati ujao; “utachukua” inadumisha mtindo huo wa kisheria, huku “nawe” ikiwakilisha kiunganishi.
- source_word: חֲמֵשֶׁת חֲמֵשֶׁת שְׁקָלִים לַגֻּלְגֹּלֶת
  choice: shekeli tano kwa kila mtu
  rationale: Kurudiwa kwa “tano” kunaonyesha mgao kwa mtu mmoja mmoja, na לַגֻּלְגֹּלֶת, kihalisi “kwa kichwa,” ni nahau yenye maana ya kila mtu.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai hiki kinaonyesha kiwango rasmi cha uzani kilichohusishwa na mahali patakatifu. Neno “kipimo” linafafanua kazi yake bila kuifanya ionekane kuwa sarafu takatifu ya aina tofauti.
- source_word: תִּקָּח עֶשְׂרִים גֵּרָה הַשָּׁקֶל
  choice: shekeli moja ni gera ishirini
  rationale: Ingawa תִּקָּח ni kitenzi cha nafsi ya pili, muundo mzima hapa unatoa ufafanuzi wa thamani ya shekeli; Kiswahili cha kawaida huwasilisha ulinganifu huo kwa “ni.”
- source_word: עֶשְׂרִים גֵּרָה
  choice: gera ishirini
  rationale: Jina la kipimo cha Kiebrania limehifadhiwa kama “gera,” kwa mpangilio wa kawaida wa Kiswahili wa nomino kisha idadi.
