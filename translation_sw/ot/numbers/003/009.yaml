  yaml_path: translation/ot/numbers/003/009.yaml
  text: You shall give the Levites to Aaron and to his sons[b][a]; they are wholly given to him from among the sons of Israel.
translation:
  language: sw
  text: Nawe utawakabidhi Walawi kwa Aroni na wanawe; hao wamekabidhiwa kabisa kwake kutoka miongoni mwa wana wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania hurudia neno “wamekabidhiwa” kwa msisitizo: “wamekabidhiwa, wamekabidhiwa,” yaani wamekabidhiwa kabisa au kwa hakika.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Nawe utawatoa
  rationale: Katika muktadha huu wa maagizo, kitenzi hiki kina nguvu ya amri. Kiambishi cha kitu katika “utawatoa” kinawarejelea Walawi na kuleta Kiswahili cha kawaida.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa watu wa kabila la Lawi waliotengwa kwa huduma ya patakatifu.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: kwa Aroni na wanawe
  rationale: Kihusishi לְ kinaonyesha wanaopokea au kunufaika na kukabidhiwa huko; “kwa” ni ya kawaida na haidokezi umiliki kamili.
- source_word: נְתוּנִם נְתוּנִם
  choice: wamekabidhiwa kabisa
  rationale: Kurudiwa kwa neno la Kiebrania kunasisitiza ukamilifu au uhakika wa kukabidhiwa. “Kabisa” huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: הֵמָּה
  choice: wamekabidhiwa
  rationale: Kiwakilishi huru cha Kiebrania kina msisitizo, ambao katika Kiswahili unabebwa vya kutosha na muundo wa kishazi pamoja na “kabisa.”
- source_word: לוֹ
  choice: kwake
  rationale: Kiwakilishi kinamrejelea Aroni katika muktadha wa karibu.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: kutoka miongoni mwa wana wa Israeli
  rationale: “Kutoka miongoni mwa” huonyesha kwamba Walawi wametengwa kutoka ndani ya jumuiya pana, na “wana wa Israeli” huhifadhi tamathali ya kifamilia ya Kiebrania.
theological_decisions:
- issue: Maana ya kukabidhi Walawi kwa Aroni
  choice: wamekabidhiwa kabisa kwake
  alternative: wametolewa kabisa wawe wake
  rationale: “Kukabidhiwa” huhifadhi wazo la kuwekwa chini ya huduma ya Aroni bila kuingiza kwa lazima dhana ya umiliki wa watu.
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi wa kifamilia umehifadhiwa kwa kuwa ni wa maana katika utambulisho wa agano, huku maana ya jumuiya nzima ikibaki wazi kutokana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Walawi,” “Aroni,” na “wana wa Israeli” zinafuata istilahi za kawaida za Biblia. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusu msisitizo wa kukabidhiwa.
