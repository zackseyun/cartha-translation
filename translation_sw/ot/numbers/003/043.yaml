base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/043.yaml
  text: And all the firstborn males[a], by the number of names, from a month old and upward, according to their count, were twenty-two thousand[b], three hundred seventy-three.
translation:
  language: sw
  text: Wazaliwa wote wa kwanza wa kiume, kwa idadi ya majina[a], wenye umri wa mwezi mmoja na zaidi, kulingana na hesabu yao[b], walikuwa elfu ishirini na mbili, mia tatu sabini na tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kwa idadi ya majina” ni usemi wa sensa unaomaanisha kwamba kila mtu aliandikishwa au kuhesabiwa kwa jina.
    reason: cultural_note
  - marker: b
    text: Au “kulingana na kuandikishwa kwao.” Kirai cha Kiebrania kinarejelea kuhesabiwa rasmi kwa kundi hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: walikuwa
  rationale: Muundo huu unatoa jumla ya sensa; kitenzi cha wingi kinaafikiana kwa kawaida na “wazaliwa wa kwanza wa kiume” bila kuongeza maana.
- source_word: כָל בְּכוֹר זָכָר
  choice: jumla ya wazaliwa wa kwanza wa kiume
  rationale: “Jumla ya” inadumisha maana jumuishi ya כָל, huku “wazaliwa wa kwanza wa kiume” ikihifadhi jinsia na nafasi ya kuzaliwa.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: waliohesabiwa kwa majina
  rationale: Hii ni nahau ya sensa inayoonyesha kuwa kila mmoja alihesabiwa kibinafsi kwa jina; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: wenye umri wa mwezi mmoja na zaidi
  rationale: Inawasilisha kwa kawaida kiwango cha chini cha umri kilicho katika fomula ya Kiebrania.
- source_word: לִפְקֻדֵיהֶם
  choice: kulingana na hesabu yao
  rationale: Inarejelea matokeo ya kuhesabiwa rasmi kwa kundi hilo na inaacha wazi wazo la sensa bila kulifanya kuwa makadirio ya kawaida.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף שְׁלֹשָׁה וְשִׁבְעִים וּמָאתָיִם
  choice: elfu ishirini na mbili, mia tatu sabini na tatu
  rationale: Mpangilio wa namba umewekwa katika Kiswahili cha kawaida, ukitoa jumla ya 22,373.
