lexical_decisions:
- source_word: פְּדוּיֵי
  choice: malipo ya kuwakomboa
  rationale: Umbo hili linatokana na פדה na linaweza kueleweka kwa njia halisi zaidi kuwa watu waliokombolewa. Hata hivyo, muktadha wa karibu unahusu malipo yaliyotakiwa kwa wazaliwa wa kwanza waliozidi idadi ya Walawi (aya 47–48). Chaguo hili linaeleza maana hiyo kwa Kiswahili cha kawaida huku tanbihi ikihifadhi uwezekano wa kisarufi.
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  choice: '273'
  rationale: Kiebrania hutaja idadi hii kwa kujumlisha sehemu zake. Nambari ya kawaida ya Kiswahili inawasilisha kiasi kilekile kwa uwazi.
- source_word: הָעֹדְפִים
  choice: waliozidi idadi
  rationale: Kivumishi hiki cha kitenzi kinawataja wale waliokuwa ziada baada ya Walawi kuhesabiwa kuwa badala ya wazaliwa wa kwanza. Kuongeza “idadi” kunafanya ulinganisho huo uwe wa kawaida na wazi katika Kiswahili.
- source_word: עַל הַלְוִיִּם
  choice: ya Walawi
  rationale: Pamoja na הָעֹדְפִים, kihusishi עַל kinaonyesha kuzidi kwa kulinganisha na Walawi. Kiswahili huwasilisha uhusiano huo kwa kawaida katika kirai “waliozidi idadi ya Walawi.”
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: miongoni mwa wazaliwa wa kwanza wa wana wa Israeli
  rationale: “Miongoni mwa” linaonyesha nguvu ya kigawanyo ya מִן, na “wana wa Israeli” linahifadhi usemi rasmi wa agano בְּנֵי יִשְׂרָאֵל pamoja na rejeo lake la kijinsia katika muktadha huu.
