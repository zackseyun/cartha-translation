base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/010.yaml
  text: And you shall appoint Aaron and his sons[a], and they shall keep their priesthood; but the outsider who comes near shall be put to death.
translation:
  language: sw
  text: Nawe utawaweka rasmi Haruni na wanawe, nao wataulinda ukuhani wao; lakini mtu asiyeidhinishwa[a] anayekaribia atauawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu wa nje.” Hapa neno la Kiebrania halimaanishi hasa mgeni wa taifa jingine, bali mtu yeyote asiyeidhinishwa kuifikia au kuifanya huduma ya kikuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְקֹד
  choice: utawaweka rasmi
  rationale: Katika muktadha huu פקד haimaanishi kuwahesabu, bali kuwateua na kuwapa jukumu rasmi la ukuhani.
- source_word: וְשָׁמְרוּ
  choice: wataulinda
  rationale: שׁמר hapa ina maana ya kutunza na kulinda wajibu pamoja na mipaka ya ukuhani; “wataulinda” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: כְּהֻנָּתָם
  choice: ukuhani wao
  rationale: Neno hili linamaanisha cheo na huduma yao ya kikuhani, si hadhi ya kinadharia pekee.
- source_word: הַזָּר
  choice: mtu asiyeidhinishwa
  rationale: זָר katika muktadha huu ni mtu asiye na ruhusa ya kufanya au kukaribia huduma ya kikuhani, wala si lazima mgeni wa kabila au taifa jingine.
- source_word: הַקָּרֵב
  choice: anayekaribia
  rationale: Kirai hiki kinadumisha picha halisi ya mtu anayekaribia eneo au huduma takatifu iliyowekewa mipaka.
- source_word: יוּמָת
  choice: atauawa
  rationale: Muundo wa Hophal wa מות una nguvu ya kutendesha katika hali tendwa na unaonyesha adhabu ya kifo, si utabiri tu kwamba mtu atakufa.
theological_decisions:
- issue: Mipaka ya kuifikia huduma ya kikuhani
  choice: Haruni na wanawe ndio wanaowekwa rasmi kuulinda ukuhani, na mtu yeyote asiyeidhinishwa anayekaribia anakabiliwa na adhabu ya kifo.
  alternative: Mstari unaweza kueleweka kwa upana kuwa unamzuia kila asiye kuhani kukaribia mambo matakatifu, bila mstari huu peke yake kufafanua mipaka yote ya kiibada.
  rationale: Tafsiri inadumisha msisitizo wa Kiebrania kuhusu mamlaka ya kikuhani na onyo la kifo bila kuingiza maelezo ya baadaye kuhusu taratibu au mipaka ambayo mstari wenyewe haujaibainisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wazi na wa kisasa. “Kuwaweka rasmi” ni wa kawaida kuliko “kuwateua” peke yake kwa kuwa unaonyesha kukabidhi jukumu, na “wataulinda ukuhani wao” inadumisha dhana ya kulinda wajibu na mipaka ya cheo hicho.
