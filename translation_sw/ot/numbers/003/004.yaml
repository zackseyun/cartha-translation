base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/004.yaml
  text: But Nadab and Abihu died before Yahweh when they offered strange fire before Yahweh in the wilderness of Sinai[a], and they had no sons[b]; and Eleazar and Ithamar served as priests in the presence of Aaron their father.
translation:
  language: sw
  text: Nadabu na Abihu walikufa mbele ya Yahwe walipotoa moto usioruhusiwa[a] mbele ya Yahwe katika nyika ya Sinai. Hawakuwa na wana; na Eleazari na Ithamari wakatumikia kama makuhani mbele ya Haruni, baba yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moto wa kigeni” au “moto wa ajabu.” Huenda Kiebrania kinamaanisha moto ambao haukuruhusiwa kutumiwa katika sadaka.
    reason: lexical_alternative
  - marker: b
    text: Au, “mbele ya Haruni, baba yao.” Nahau ya Kiebrania inaweza pia kumaanisha kwamba walihudumu wakati Haruni, baba yao, alipokuwa hai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: walikufa
  rationale: Kitenzi hiki kinasimulia moja kwa moja kwamba Nadabu na Abihu walikufa; Kiswahili kinatumia wingi kulingana na kiima ambatano.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Nahau hii humaanisha kuwa mbele au katika uwepo wa Yahwe. “Mbele za” ni usemi wa kawaida na wenye hadhi katika Kiswahili cha Biblia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: בְּהַקְרִבָם
  choice: walipoleta
  rationale: Muundo huu unaonyesha wakati au hali ya tendo. “Walipoleta” hudumisha maana ya msingi ya kuleta karibu katika muktadha wa sadaka bila kuongeza kitenzi kisichotajwa.
- source_word: אֵשׁ זָרָה
  choice: moto usioruhusiwa
  rationale: Katika muktadha wa ibada, זָרָה huelekea kumaanisha kitu kisicho halali au kisichoidhinishwa. Tafsiri hii inaeleweka kwa msomaji wa sasa; maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: בְּמִדְבַּר סִינַי
  choice: katika nyika ya Sinai
  rationale: “Nyika” ni neno la kawaida la Kibiblia linalofaa kwa eneo kame lisilokaliwa, bila kulazimisha picha ya jangwa la mchanga.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: Hawakuwa na wana
  rationale: בָנִים ni “wana,” si neno la jumla “watoto”; jambo hili lina umuhimu katika muktadha wa urithi wa ukuhani.
- source_word: וַיְכַהֵן
  choice: wakatumikia kama makuhani
  rationale: Kitenzi כהן humaanisha kufanya huduma ya ukuhani. Kiswahili kinahitaji kauli ya wingi kwa Eleazari na Ithamari.
- source_word: עַל פְּנֵי אַהֲרֹן אֲבִיהֶם
  choice: mbele ya baba yao Haruni
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania na kutatua kwa kawaida mpangilio wa umilikaji katika Kiswahili, huku tanbihi ikionyesha uwezekano wa maana ya wakati wa uhai wake.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu; “Yahwe” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אֵשׁ זָרָה katika ibada
  choice: moto usioruhusiwa
  alternative: moto wa kigeni / moto wa ajabu
  rationale: Muktadha wa kifo chao mbele za Yahwe unaonyesha moto usiokubalika katika ibada, lakini tanbihi huhifadhi tofauti ya kileksika.
- issue: Maana ya עַל־פְּנֵי kuhusu Haruni
  choice: mbele ya baba yao Haruni
  alternative: wakati baba yao Haruni alipokuwa hai
  rationale: Maandishi yanaweza kuonyesha uwepo wa Haruni au huduma iliyofanyika wakati wa uhai wake; tafsiri kuu hudumisha nahau badala ya kuamua maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa lakini wenye hadhi. Sentensi imegawanywa ili isomeke kwa urahisi. Kiunganishi “hivyo” kinaonyesha mfuatano wa habari ya ukuhani baada ya kutokuwapo kwa wana, bila kudai zaidi ya muktadha.
