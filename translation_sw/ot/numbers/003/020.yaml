base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/020.yaml
  text: 'The sons of Merari[a], by their clans: Mahli and Mushi. These are the clans of the Levites, by their fathers’ houses.'
translation:
  language: sw
  text: 'Wana wa Merari, kwa koo zao: Mahli na Mushi. Hizi ndizo koo za Walawi[a], kwa nyumba za baba zao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “koo za Lawi.” Kiebrania kina neno la umoja, “Mlawi,” ambalo linaweza kutumiwa kwa maana ya jumla au kumrejelea Lawi, babu wa kabila hilo.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: Wana wa
  rationale: בני kwa msingi wake humaanisha “wana wa.” Kiunganishi ו hakijatafsiriwa kando kwa sababu mstari huu ni kipengele katika orodha na sentensi ya Kiswahili inasomeka kwa kawaida bila kuanza na “Na.”
- source_word: מְרָרִי
  choice: Merari
  rationale: Ni jina la mtu; limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Kirai hiki kinaainisha uzao kwa mafungu ya kindugu; “koo” linafaa kuliko “familia” katika muktadha wa mpangilio wa kikabila.
- source_word: מַחְלִי וּמוּשִׁי
  choice: Mahli na Mushi
  rationale: Majina haya yametoholewa, na kiunganishi cha Kiebrania kimetafsiriwa “na.”
- source_word: אֵלֶּה הֵם
  choice: Hizi ndizo
  rationale: Muundo huu wa utambulisho unaweka mkazo unaofaa katika uwasilishaji wa orodha.
- source_word: מִשְׁפְּחֹת הַלֵּוִי
  choice: koo za Walawi
  rationale: Ingawa הַלֵּוִי ni umoja kisarufi, hapa inaweza kuwa jina la kundi kwa maana ya jumla. Wingi “Walawi” ni wa kawaida na unaafikiana kwa uwazi na “koo,” huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: לְבֵית אֲבֹתָם
  choice: kulingana na nyumba za baba zao
  rationale: “Nyumba za baba” huhifadhi istilahi ya ukoo na kitengo cha kijamii katika Kiebrania; “kulingana na” huonyesha uainishaji unaokusudiwa na ל.
theological_decisions:
- issue: Je, הַלֵּוִי inarejelea Walawi kwa ujumla au Lawi kama babu wa kabila?
  choice: Walawi
  alternative: Lawi / Mlawi
  rationale: Muktadha wa “koo” unaunga mkono matumizi ya jina hili kwa maana ya kundi, lakini umoja wa Kiebrania unaacha uwezekano wa kumrejelea Lawi kama babu wa kabila; tanbihi inahifadhi mvutano huo bila kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Koo” limetumiwa kwa vitengo vya kindugu vya kikabila, na “nyumba za baba zao” limehifadhiwa kama tamko rasmi la ukoo.
