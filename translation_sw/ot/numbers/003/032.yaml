  yaml_path: translation/ot/numbers/003/032.yaml
  text: And the chief over the chiefs of the Levites was Eleazar son of Aaron the priest, having oversight of those who kept charge of the sanctuary.
translation:
  language: sw
  text: Naye kiongozi mkuu wa viongozi wa Walawi alikuwa Eleazari mwana wa kuhani Haruni. Eleazari aliwasimamia wale waliokuwa na wajibu wa kutunza mahali patakatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitu vitakatifu.” Neno la Kiebrania linaweza kumaanisha mahali patakatifu penyewe au vitu vitakatifu vinavyohusiana nalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/נְשִׂיא נְשִׂיאֵי הַ/לֵּוִי
  choice: Naye kiongozi mkuu wa viongozi wa Walawi
  rationale: Kirai hiki kinahifadhi muundo wa cheo cha juu kati ya viongozi wa Walawi bila kutumia neno linalodokeza ufalme. Kiunganishi וּ kimetafsiriwa kwa “Naye” ili kuendeleza simulizi.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַ/כֹּהֵן
  choice: Eleazari mwana wa kuhani Haruni
  rationale: Majina yametolewa kwa maumbo ya Kiswahili yanayotambulika. Mpangilio huu unaonyesha wazi kwamba Haruni ndiye kuhani huku ukihifadhi uhusiano wa mwana na baba.
- source_word: פְּקֻדַּת
  choice: aliwasimamia
  rationale: Nomino hii inaweza kumaanisha usimamizi, mamlaka, au wajibu. Kitenzi “aliwasimamia” ni cha kawaida katika Kiswahili na kinaeleza jukumu la Eleazari kwa usahihi.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: wale waliokuwa na wajibu wa kutunza
  rationale: Tafsiri hii inawakilisha muunganiko wa kitenzi na nomino zenye mzizi mmoja, ambao unasisitiza jukumu walilokabidhiwa, badala ya kuwataja tu kuwa walinzi.
- source_word: הַ/קֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Katika muktadha wa maskani, neno hili linaweza kutaja eneo takatifu au vitu vitakatifu. “Mahali patakatifu” linafaa kwa muktadha na ni la kawaida kwa msomaji, huku maana nyingine ikihifadhiwa katika tanbihi.
