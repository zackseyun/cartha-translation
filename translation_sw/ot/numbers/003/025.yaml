  text: וּ/מִשְׁמֶ֤רֶת בְּנֵֽי גֵרְשׁוֹן֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד הַ/מִּשְׁכָּ֖ן וְ/הָ/אֹ֑הֶל מִכְסֵ֕/הוּ וּ/מָסַ֕ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/025.yaml
  text: And the duty of the sons of Gershon in the tent of meeting was the tabernacle[a], the tent, its covering, and the screen for the entrance of the tent of meeting[b],
translation:
  language: sw
  text: 'Wana wa Gershoni walikuwa na jukumu[a] la kutunza vitu hivi katika Hema la Kukutania: Maskani, hema, kifuniko chake, na pazia[b] la mwingilio wa Hema la Kukutania.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wajibu” au “dhamana.”
    reason: lexical_alternative
  - marker: b
    text: Au “kitambaa cha kufunika mwingilio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  choice: jukumu la kutunza
  rationale: Katika muktadha wa mgawo wa Walawi, neno hili linaonyesha vitu walivyokabidhiwa kuvitunza. Kauli hii ni ya asili katika Kiswahili na inaweka wazi uhusiano na orodha inayofuata.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: wana wa Gershoni
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania badala ya kuubadili kuwa jina la kundi pekee.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika Hema la Kukutania
  rationale: Kiambishi ב kinaonyesha eneo au nyanja ya huduma; 'Hema la Kukutania' ni tafsiri wazi na iliyozoeleka ya kirai hiki.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: Ni istilahi fupi inayotofautisha makao matakatifu yenyewe na 'hema' linalotajwa mara moja baada yake.
- source_word: וְהָאֹהֶל
  choice: hema
  rationale: Huhifadhi kipengele tofauti katika orodha ya vifaa bila kukiunganisha kimya kimya na Maskani.
- source_word: מִכְסֵהוּ
  choice: kifuniko chake
  rationale: Huhifadhi kiambishi cha umilikaji na maana ya kifuniko cha kinga cha hema.
- source_word: מָסַךְ
  choice: pazia
  rationale: Katika muktadha wa mwingilio, neno hili linamaanisha kitambaa kinachoning'inia na kufunika nafasi ya kuingilia; 'pazia' ni neno la kawaida na wazi katika Kiswahili.
- source_word: פֶּתַח
  choice: mwingilio
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya nafasi au njia ya kuingia.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Kirai kilekile kimetafsiriwa kwa uthabiti katika kutajwa kwake mara ya pili.
theological_decisions: []
