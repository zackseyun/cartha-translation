  source_fidelity: 'Tafsiri inawakilisha vipengele vyote vya Kiebrania: wana wa Gershoni, jukumu/ulinzi wao wa kiutumishi katika Hema la Kukutania, na orodha ya Maskani, hema, kifuniko chake, na pazia la mwingilio. Uundaji wa sentensi kwa “walikuwa na jukumu ... la kutunza” unaeleza kwa Kiswahili kwa usahihi dhana ya מִשְׁמֶרֶת katika muktadha huu.'
