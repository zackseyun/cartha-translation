  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi imeundwa upya kidogo ili kuepuka usemi usio wa asili wa kusema jukumu ‘lilikuwa’ vitu vyenyewe; maana ya kukabidhiwa kuvitunza imehifadhiwa.
