base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/012.yaml
  text: And I—behold[a], I have taken the Levites from among the sons of Israel in place of every firstborn that opens the womb among the sons of Israel, and the Levites shall be mine.
translation:
  language: sw
  text: Nami, tazama, nimewachukua Walawi kutoka miongoni mwa wana wa Israeli[a], badala ya kila mzaliwa wa kwanza afunguaye tumbo miongoni mwa wana wa Israeli; nao Walawi watakuwa wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” badala ya “wana wa Israeli.” Msemo wa Kiebrania, kwa maana halisi, ni wa kiume na ni usemi wa kawaida unaorudiwa-rudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Nami
  rationale: Inaunganisha kauli hii na iliyotangulia huku ikikazia nafsi ya kwanza, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: הִנֵּה
  choice: tazama
  rationale: Inahifadhi nguvu ya kuvuta fikira na kusisitiza ya chembe ya Kiebrania katika tamko hili zito.
- source_word: לָקַחְתִּי
  choice: nimewachukua
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililofanywa ambalo matokeo yake yanaendelea; kiambishi cha ngeli ya watu kinawarejelea Walawi.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la kundi hili katika Kiswahili, na limerudiwa mwishoni kama katika chanzo.
- source_word: מִתּוֹךְ
  choice: kutoka miongoni mwa
  rationale: Huonyesha wazi kuchaguliwa kwa baadhi kutoka ndani ya kundi kubwa zaidi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi kwa uwazi zaidi msemo wa Kiebrania ulio wa kifomula; tafsiri ya kawaida zaidi, “Waisraeli,” imetolewa katika tanbihi.
- source_word: תַּחַת
  choice: badala ya
  rationale: Inaeleza kwa kawaida na kwa usahihi wazo la kuchukua nafasi katika muktadha huu wa ibada na sheria.
- source_word: כָּל בְּכוֹר
  choice: kila mzaliwa wa kwanza
  rationale: Inawasilisha maana ya kugawa kwa kila mmoja bila kuongeza jinsia ambayo haikutajwa wazi katika kifungu hiki.
- source_word: פֶּטֶר רֶחֶם
  choice: anayefungua tumbo la uzazi
  rationale: Inahifadhi taswira na maana ya kisheria ya yule anayekuwa wa kwanza kutoka tumboni, kwa usemi unaoeleweka katika Kiswahili.
- source_word: וְהָיוּ לִי
  choice: Nao Walawi watakuwa wangu
  rationale: Inaonyesha umiliki na kuwekwa wakfu kwa Mungu kwa ufupi, huku ikihifadhi matokeo ya wakati ujao na kurudiwa kwa jina “Walawi.”
theological_decisions:
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Msemo wa chanzo ni wa kifomula na kwa umbo lake ni wa kiume. Tafsiri kuu inahifadhi muundo huo bila kudai kwamba marejeo yake yanawahusu wanaume pekee; mbadala wa kawaida zaidi umewekwa katika tanbihi.
- issue: Uhusiano wa Walawi na Mungu katika וְהָיוּ לִי
  choice: Walawi watakuwa wangu
  alternative: Walawi watakuwa mali yangu; Walawi watakuwa wa kwangu
  rationale: Kauli inaonyesha dai la Mungu juu yao katika muktadha wa kuwekwa wakfu, bila kuingiza maelezo ya kiteolojia yasiyosemwa moja kwa moja na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tazama” hudumisha uzito wa tamko la Mungu; sentensi imegawanywa sehemu mbili ili isomeke kwa urahisi bila kupoteza uhusiano wa kimantiki wa chanzo.
