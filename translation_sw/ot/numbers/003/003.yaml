base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/003.yaml
  text: These are the names of Aaron’s sons[a], the anointed priests, whose hands were filled to serve as priests.
translation:
  language: sw
  text: Haya ndiyo majina ya wana wa Aroni, makuhani waliotiwa mafuta, ambao alijaza mikono yao[a] ili watumikie kama makuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “alijaza mikono yao.” Hii ni nahau yenye maana ya kuwaweka rasmi au kuwaingiza katika huduma ya ukuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Haya ndiyo majina
  rationale: Muundo huu wa kawaida wa Kiswahili unatambulisha orodha au utambulisho kwa uwazi, huku ukihifadhi kiashiria cha Kiebrania.
- source_word: בְּנֵי אַהֲרֹן
  choice: wana wa Aroni
  rationale: “Wana” linaonyesha kwa usahihi kwamba Kiebrania kinawataja wana wa kiume wa Aroni, si watoto kwa jumla.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Neno hili linaeleza cheo cha wana wa Aroni kwa namna ya kawaida na yenye heshima katika Kiswahili.
- source_word: הַמְּשֻׁחִים
  choice: waliotiwa mafuta
  rationale: Tafsiri hii inahifadhi tendo halisi la ibada la kutiwa mafuta badala ya kulipanua tu kuwa kuwekwa wakfu.
- source_word: מִלֵּא יָדָם
  choice: alijaza mikono yao
  rationale: Inahifadhi nahau halisi ya Kiebrania na pia umbo la kitenzi cha nafsi ya tatu, umoja, bila kumtaja mhusika ambaye maandishi hayamtaji wazi.
- source_word: לְכַהֵן
  choice: ili watumikie kama makuhani
  rationale: Inaonyesha kusudi la kuwekwa kwao katika huduma na maana ya kutenda kazi ya ukuhani.
theological_decisions:
- issue: Namna ya kutafsiri nahau ya kuwekwa katika ukuhani מִלֵּא יָדָם
  choice: Kuhifadhi picha ya maneno “alijaza mikono yao” katika maandishi makuu na kueleza maana yake katika tanbihi.
  alternative: “Aliwaweka rasmi ili watumikie kama makuhani” au “aliwaweka wakfu kuwa makuhani.”
  rationale: Nahau hii ni istilahi ya kuwekwa katika huduma ya ukuhani. Kuihifadhi kunafanya sura ya Kiebrania ionekane bila kuzuia msomaji kupata maana yake kupitia tanbihi.
- issue: Mhusika wa kitenzi מִלֵּא
  choice: Kutumia kiambishi cha nafsi ya tatu umoja katika “alijaza” bila kuongeza jina la mhusika.
  alternative: Kutumia kauli tendwa “mikono yao ilijazwa” au kumtaja Musa waziwazi.
  rationale: Kiebrania kina kitenzi tendaji cha nafsi ya tatu umoja lakini hakitaji jina la mhusika katika mstari huu. Tafsiri haiongezi jina wala kubadili kauli kuwa tendwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. “Waliotiwa mafuta” na “alijaza mikono yao” huhifadhi picha za ibada za maandishi ya Kiebrania; tanbihi inafafanua nahau isiyo ya kawaida katika Kiswahili.
