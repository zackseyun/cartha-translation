  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֨ אֶת הַ/לְוִיִּ֥ם לִ/י֙ אֲנִ֣י יְהוָ֔ה תַּ֥חַת כָּל בְּכֹ֖ר בִּ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/אֵת֙ בֶּהֱמַ֣ת הַ/לְוִיִּ֔ם תַּ֣חַת כָּל בְּכ֔וֹר בְּ/בֶהֱמַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
translation:
  language: sw
  text: Na utawachukua Walawi kwa ajili yangu—mimi ni Yahwe—badala ya kila mzaliwa wa kwanza miongoni mwa wana wa Israeli[a], na mifugo ya Walawi badala ya kila mzaliwa wa kwanza miongoni mwa mifugo ya wana wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa Waisraeli.” Kiebrania kinasema, “miongoni mwa wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Nawe utawatwaa
  rationale: Kitenzi cha Kiebrania katika muktadha huu kina nguvu ya agizo linaloelekezwa kwa Musa. ‘Utawatwaa’ huhifadhi mtindo wa kisheria na pia huonyesha kwamba Walawi wanatengwa kwa kusudi maalumu.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa watu wa kabila la Lawi; kiambishi wa- kinaonyesha wingi wa watu.
- source_word: לִי
  choice: kwa ajili yangu
  rationale: Kihusishi kinaonyesha kuwa Walawi wanachukuliwa wawe mali ya Yahwe au watengwe kwa huduma yake. Usemi huu ni wa kawaida na unaeleza kusudi hilo bila kulifafanua kupita kiasi.
- source_word: אֲנִי יְהוָה
  choice: mimi ni Yahwe
  rationale: Huhifadhi msisitizo wa kujitambulisha kwa Mungu pamoja na jina lake binafsi katika kauli hii ya agano.
- source_word: תַּחַת
  choice: badala ya
  rationale: Katika muktadha wa kuhesabu na kubadilishana, neno hili linaonyesha uwakilishi au kuchukua nafasi ya mwingine, si kuwa chini yake.
- source_word: כָּל בְּכֹר
  choice: kila mzaliwa wa kwanza
  rationale: Umoja unaofuata כָּל una maana ya kugawa mmoja mmoja; ‘kila’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: miongoni mwa wana wa Israeli
  rationale: Huhifadhi picha ya asili ya Kiebrania, ‘wana wa Israeli,’ huku ‘miongoni mwa’ ikionyesha wazi kwamba wazaliwa wa kwanza wanatoka katika kundi hilo.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: mifugo ya Walawi
  rationale: בְּהֵמָה hapa ni jina la jumla la wanyama wanaofugwa. ‘Mifugo’ ni neno la sasa, la asili, na pana kuliko ‘ng’ombe.’
- source_word: כָּל בְּכוֹר בְּבֶהֱמַת בְּנֵי יִשְׂרָאֵל
  choice: kila mzaliwa wa kwanza miongoni mwa mifugo ya wana wa Israeli
  rationale: Muundo huu unadumisha ulinganifu na sehemu ya kwanza ya aya na kuweka wazi kwamba kinachozungumziwa ni kila mnyama mzaliwa wa kwanza katika mifugo yao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni. ‘Yahwe’ huhifadhi jina binafsi la Mungu badala ya kulibadilisha kuwa cheo, huku likifuata tahajia iliyozoeleka katika Kiswahili.
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: ‘Wana wa Israeli’ huhifadhi kwa karibu usemi wa Kiebrania na uhusiano wake na babu Israeli. ‘Waisraeli’ ni maana halali ya kimuktadha na imetajwa katika tanbihi bila kuondoa umbo la chanzo katika matini kuu.
- issue: Maana ya uingizwaji katika תַּחַת
  choice: badala ya
  alternative: chini ya
  rationale: Muktadha unaagiza Walawi na mifugo yao wachukue nafasi ya wazaliwa wa kwanza wa Israeli na wa mifugo yao. Tafsiri ya mahali, ‘chini ya,’ haifai katika sentensi hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri na urudiaji wa vifungu viwili umehifadhiwa kwa sababu ni sehemu ya msisitizo wa aya. Mistari mirefu imeunganishwa kwa viakifishi bila kufuta kauli ya kati, ‘mimi ni Yahwe.’
