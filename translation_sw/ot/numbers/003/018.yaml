  text: 'And these are the names of the sons of Gershon by their clans: Libni and Shimei.'
translation:
  language: sw
  text: 'Na haya ndiyo majina ya wana wa Gershoni kwa koo zao: Libni na Shimei.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Na haya ndiyo
  rationale: Kiunganishi וְ kimehifadhiwa kwa “Na,” huku “haya ndiyo” kikitambulisha orodha kwa Kiswahili cha kawaida.
- source_word: שְׁמוֹת
  choice: majina ya
  rationale: Nomino hii iko katika hali ya kutegemea nomino inayofuata, hivyo “majina ya” linaonyesha uhusiano huo wazi.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: wana wa Gershoni
  rationale: בְּנֵי humaanisha hasa wana; kwa kuwa wanaume wawili wanatajwa mara moja, maana mahususi ya “wana” inafaa kuliko “wazao.”
- source_word: לְ/מִשְׁפְּחֹתָ/ם
  choice: kwa koo zao
  rationale: Katika muktadha wa sensa na nasaba, מִשְׁפָּחָה ni koo, na “kwa koo zao” huhifadhi wazo la kuainishwa kulingana na koo.
- source_word: לִבְנִי
  choice: Libni
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: וְ/שִׁמְעִי
  choice: na Shimei
  rationale: Jina la mtu limetoholewa, na kiunganishi וְ kimetafsiriwa “na” katika orodha.
