  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מִשְׁמַרְתָּ֗/ם הָ/אָרֹ֤ן וְ/הַ/שֻּׁלְחָן֙ וְ/הַ/מְּנֹרָ֣ה וְ/הַֽ/מִּזְבְּחֹ֔ת וּ/כְלֵ֣י הַ/קֹּ֔דֶשׁ אֲשֶׁ֥ר יְשָׁרְת֖וּ בָּ/הֶ֑ם וְ/הַ֨/מָּסָ֔ךְ וְ/כֹ֖ל עֲבֹדָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/031.yaml
  text: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
translation:
  language: sw
  text: Nao jukumu lao lilikuwa la kutunza sanduku[a], meza, kinara cha taa, madhabahu, vyombo vya mahali patakatifu[b] ambavyo vilitumiwa katika huduma, pazia la mwingilio[c], na huduma yake yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nao walikuwa na jukumu la kusimamia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “vyombo vitakatifu” au “vifaa vya mahali patakatifu.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, pazia lililokuwa kwenye mwingilio, si pazia la ndani.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשְׁמַרְתָּם
  choice: Nao waliwajibika kutunza
  rationale: Katika muktadha wa hema la kukutania, neno hili linaonyesha jukumu walilokabidhiwa la kusimamia na kutunza vitu vilivyotajwa. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: הָאָרֹן
  choice: sanduku
  rationale: Katika muktadha huu אָרוֹן ni sanduku takatifu la hema la kukutania. Kiebrania hakiongezi hapa maneno kama ‘la ushuhuda,’ kwa hiyo hayajaingizwa.
- source_word: הַשֻּׁלְחָן
  choice: meza
  rationale: Kiebrania kinasema tu ‘meza’; muktadha unaonyesha kuwa ni samani ya hema la kukutania.
- source_word: הַמְּנֹרָה
  choice: kinara cha taa
  rationale: Hili ni jina la chombo kilichoshikilia taa katika hema. ‘Kinara cha taa’ hutafsiri maana badala ya kuhamisha tu neno menorah.
- source_word: הַמִּזְבְּחֹת
  choice: madhabahu
  rationale: Umbo la Kiebrania ni wingi. Katika Kiswahili ‘madhabahu’ linaweza kuwa umbo la umoja au wingi, na hapa muktadha wa orodha unaonyesha wingi.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: vyombo vya mahali patakatifu
  rationale: כְּלִים ni vyombo au vifaa vinavyotumiwa, na הַקֹּדֶשׁ hapa inaelekea kutaja mahali patakatifu katika muktadha wa hema.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: ambavyo vilitumiwa katika huduma
  rationale: Kishazi kinaeleza vyombo kuwa vifaa vya kufanyia huduma takatifu. Kauli tendwa ya Kiswahili ni ya asili na huepuka utata wa kumtaja mtendaji asiyeelezwa wazi katika sentensi.
- source_word: הַמָּסָךְ
  choice: pazia la mwingilio
  rationale: מָסָךְ hapa ni pazia au kitambaa kilichofunika mwingilio, tofauti na pazia la ndani linaloitwa פָּרֹכֶת.
- source_word: וְכָל עֲבֹדָתוֹ
  choice: na huduma yote inayohusiana navyo
  rationale: עֲבֹדָה katika muktadha huu ni huduma ya ibada. Ingawa kiambishi cha Kiebrania ni cha umoja wa kiume, rejeo lake haliko wazi kabisa; Kiswahili cha asili kinaweza kuonyesha kwa ujumla huduma inayohusiana na vitu vilivyoorodheshwa.
theological_decisions:
- issue: Istilahi ya huduma takatifu katika hema la kukutania
  choice: huduma
  alternative: kazi
  rationale: ‘Huduma’ huhifadhi maana ya shughuli ya ibada bila kuingiza istilahi za baadaye za madhehebu; ‘kazi’ ingekuwa ya jumla zaidi.
- issue: Rejeo la kiambishi katika וְכָל עֲבֹדָתוֹ
  choice: huduma yote inayohusiana navyo
  alternative: huduma yake yote
  rationale: Kiebrania kina kiambishi cha umoja ambacho rejeo lake linaweza kueleweka kwa namna tofauti. Tafsiri iliyochaguliwa inatoa Kiswahili cha kawaida huku ikiacha huduma ihusiane kwa ujumla na vitu vilivyotangulia, bila kubainisha zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha ya Kiebrania umehifadhiwa, huku ‘waliwajibika kutunza’ na ‘vilitumiwa katika huduma’ zikitoa mtiririko wa kawaida wa Kiswahili.
