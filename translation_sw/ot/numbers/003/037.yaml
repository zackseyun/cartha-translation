  yaml_path: translation/ot/numbers/003/037.yaml
  text: and the pillars of the surrounding courtyard[a], and their bases, and their pegs[b], and their cords.
translation:
  language: sw
  text: na nguzo za ua pande zote, na vitako vyake[a], na vigingi vyake, na kamba zake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vikalio vyake.” Neno la Kiebrania hutaja sehemu za chini za kushikilia nguzo, hasa katika maelezo ya Maskani.
    reason: lexical_alternative
  - marker: b
    text: Au, “amba zake.” Yaani, kamba za kufungia na kuimarishia muundo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵי
  choice: nguzo
  rationale: Neno hili linamaanisha nguzo zilizosimamishwa ili kushikilia uzio wa ua; “nguzo” ni neno la kawaida na linalofaa katika maelezo ya Maskani.
- source_word: הֶחָצֵר
  choice: ua
  rationale: Katika muktadha huu ni eneo lililozungushiwa Maskani. “Ua” ni tafsiri ya kawaida na inayoeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: סָבִיב
  choice: pande zote
  rationale: Kirai hiki kinaonyesha kwamba nguzo zilikuwa kuzunguka eneo lote la ua, huku kikihifadhi maana ya kielezi ya neno la Kiebrania.
- source_word: אַדְנֵיהֶם
  choice: vitako vyake
  rationale: Katika maelezo ya Maskani, neno hili hutaja sehemu za chini au vikalio ambamo nguzo ziliwekwa. “Vitako” ni fupi, ya kimuundo, na inaeleweka kuliko istilahi ya kitaalamu.
- source_word: יְתֵדֹתָם
  choice: vigingi vyake
  rationale: Hivi ni vigingi vya kuimarishia muundo kwa kamba. “Vigingi” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: מֵיתְרֵיהֶם
  choice: kamba zake
  rationale: Neno hili hutaja kamba zilizotumiwa kuufunga na kuuimarisha muundo; “kamba” ni neno la asili na linaloeleweka katika Kiswahili.
- source_word: וְ
  choice: na
  rationale: Viunganishi vinavyorudiwa vinaonyesha kwamba mstari huu unaendeleza orodha; kurudia “na” kunadumisha mtindo huo wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi wa orodha unaolingana na muktadha. Kurudiwa kwa “na” kunahifadhi mwendelezo wa orodha ya Kiebrania. Viwakilishi vya umilikaji vinafuata “ua” kwa mtiririko wa kawaida wa Kiswahili, ingawa viambishi vya Kiebrania ni vya wingi wa kiume na vinaweza kuelekezwa kwa vifaa au nguzo zilizotajwa.
