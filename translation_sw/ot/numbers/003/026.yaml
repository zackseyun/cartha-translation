base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/026.yaml
  text: and the hangings of the court[a], and the screen for the entrance of the court that is around the tabernacle and the altar, and its ropes[b], for all its service.
translation:
  language: sw
  text: na mapazia ya ua[a], na pazia la mwingilio wa ua unaozunguka maskani na madhabahu, na kamba zake[b], kwa ajili ya huduma yake yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vitambaa vya ua.”
    reason: lexical_alternative
  - marker: b
    text: Au “kordoni zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: mapazia
  rationale: Neno hili linamaanisha vitambaa vilivyotengeneza uzio wa ua. “Mapazia” ni neno la kawaida na linaloeleweka katika muktadha wa maskani.
- source_word: חָצֵר
  choice: ua
  rationale: Linamaanisha eneo lililozungushiwa lililokuwa karibu na maskani; “ua” ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: מָסַךְ
  choice: pazia
  rationale: Katika muktadha huu ni pazia la kitambaa lililofunika mwingilio, si lango gumu. Kiswahili cha kawaida hakihitaji kulitofautisha kwa neno lisilozoeleka na mapazia ya ua.
- source_word: פֶּתַח
  choice: mwingilio
  rationale: “Mwingilio” hueleza sehemu ya kuingilia bila kudokeza kuwapo kwa lango gumu.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: ua unaozunguka maskani na madhabahu
  rationale: Muundo huu unaeleza kwa Kiswahili cha kawaida kwamba ua ulikuwa umezunguka maskani na madhabahu, huku ukiepuka kurudia “kuzunguka” pasipo lazima.
- source_word: מִשְׁכָּן
  choice: maskani
  rationale: “Maskani” ni istilahi iliyozoeleka ya mahali patakatifu pa hema katika vitabu vya Musa, na pia huhifadhi wazo la mahali pa kukaa.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Hii ndiyo tafsiri ya kawaida ya sehemu ya kutolea dhabihu.
- source_word: מֵיתָרָיו
  choice: kamba zake
  rationale: Hurejelea kamba zilizosaidia kushikilia muundo; “kamba” ni neno la wazi na la kawaida katika Kiswahili cha sasa.
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: kwa ajili ya huduma yake yote
  rationale: “Huduma” huhifadhi maana ya kazi au majukumu yanayohusiana na vifaa hivi katika mazingira ya patakatifu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inaendeleza orodha kutoka mstari uliotangulia, ndiyo sababu inaanza kwa “na.” Viambishi vya umoja katika “kamba zake” na “huduma yake” vinaendeleza kutobainika kikamilifu kwa marejeo ya viambishi vya Kiebrania bila kuongeza ufafanuzi wa kimadhehebu.
