  text: And the chief of the ancestral house of the families of the Kohathites was Elizaphan the son of Uzziel[a][b].
translation:
  language: sw
  text: Na mkuu[a] wa nyumba ya baba[b] wa jamaa za Wakohathi alikuwa Elisafani, mwana wa Uzieli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “kiongozi” au “mkuu wa ukoo” (Kiebrania: נָשִׂיא).'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “nyumba ya baba,” nahau inayomaanisha jamaa ya ukoo wa upande wa baba.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: Na mkuu
  rationale: Kiunganishi ו kinaendeleza orodha, na נָשִׂיא hapa humaanisha kiongozi mwenye mamlaka katika mpangilio wa kikabila; “mkuu” ni la kawaida bila kudokeza ufalme.
- source_word: בֵית אָב
  choice: jamaa ya ukoo
  rationale: Nahau hii inaashiria kitengo cha kijamii cha ukoo wa upande wa baba; “jamaa ya ukoo” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: לְמִשְׁפְּחֹת
  choice: wa koo
  rationale: מִשְׁפָּחוֹת humaanisha vikundi vya kifamilia au koo; “koo” hutofautisha vikundi hivyo na jamaa ya ukoo iliyotajwa kabla.
- source_word: הַקְּהָתִי
  choice: Wakohathi
  rationale: Nomino ya kundi katika umoja wa Kiebrania inarejelea kwa pamoja wazao wa Kohathi; Kiswahili hutumia umbo la kundi “Wakohathi.”
- source_word: אֶלִיצָפָן
  choice: Elisafani
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: בֶּן עֻזִּיאֵל
  choice: mwana wa Uzieli
  rationale: Hii ni fomula ya kawaida ya nasaba, iliyotolewa kwa Kiswahili cha asili.
