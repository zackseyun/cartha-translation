  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Muundo wa sentensi umehifadhi mwendelezo wa orodha kwa “Na,” huku istilahi za kijamii zikitofautishwa kwa “jamaa ya ukoo” na “koo.”
