  yaml_path: translation/ot/numbers/003/023.yaml
  text: The clans of the Gershonites shall camp behind the tabernacle[a], toward the west.
translation:
  language: sw
  text: Jamaa za Wagershoni watapiga kambi nyuma ya Maskani, kuelekea magharibi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, Kiebrania husema “kuelekea baharini,” nahau ya kawaida katika Kiebrania cha Biblia inayomaanisha “kuelekea magharibi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: Jamaa
  rationale: Katika muktadha wa kikabila na wa kuhesabu watu katika Hesabu, neno hili linamaanisha makundi ya ukoo ndani ya kundi kubwa zaidi; “jamaa” huwasilisha maana hiyo bila kulifanya liwe familia moja ya nyumbani.
- source_word: הַגֵּרְשֻׁנִּי
  choice: Wagershoni
  rationale: Nomino hii ya kundi, ingawa iko katika umbo la umoja katika Kiebrania, inawataja kwa pamoja wazao au kundi la Gershoni; “Wagershoni” ni umbo la kawaida na linaloeleweka katika Kiswahili.
- source_word: אַחֲרֵי
  choice: nyuma ya
  rationale: Hapa kihusishi kina maana ya mahali, si wakati, na kinaonyesha eneo lao kwa kulinganisha na Maskani.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: Katika Hesabu neno hili linataja hema takatifu ambamo Mungu alikaa kati ya watu wake; “Maskani” ni istilahi fupi, yenye heshima, na iliyozoeleka katika Kiswahili cha Biblia.
- source_word: יַחֲנוּ
  choice: zitapiga kambi
  rationale: Kauli ya wakati usiotimilika hapa inaeleza mpangilio uliowekwa wa kambi; “zitapiga kambi” ni ya asili katika Kiswahili na inafaa kwa kiima “jamaa.”
- source_word: יָמָּה
  choice: kuelekea magharibi
  rationale: Kihalisi ni umbo la mwelekeo linalotokana na “bahari,” lakini katika Kiebrania cha Biblia ni nahau ya kuelekea magharibi; tafsiri hii hudumisha mwelekeo na kueleweka mara moja.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inatumia “jamaa” kwa makundi ya ukoo na “Maskani” kama istilahi ya mahali patakatifu. Alama ya tanbihi imewekwa baada ya kirai kinachoeleza upande ili iungane moja kwa moja na nahau ya Kiebrania.
