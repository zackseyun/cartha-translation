  source_fidelity: Rasimu inanasa orodha ya vifaa vya Maskani kwa usahihi kwa ujumla. Hata hivyo, “kutunza” huongeza dhana ya utunzaji ambayo haijaelezwa wazi na Kiebrania; kifungu kinafafanua wajibu/charge kwa kutaja vitu na kazi husika. Pia, kiwakilishi katika kifungu cha mwisho kinapaswa kurejelea Maskani (umoja), kama katika עֲבֹדָתוֹ.
  naturalness: Kiswahili ni wazi na cha sajili inayofaa. Marekebisho yanaboresha mtiririko kwa kutumia “lilihusu” badala ya muundo wa “lilikuwa kutunza,” na kuondoa urejeleaji wa wingi usio wazi katika “navyo.”
  terminology: “Maskani,” “viunzi,” “makomeo,” “nguzo,” “vitako,” na “vifaa” zinafaa katika muktadha huu. Tanbihi ya “kalio zake” haisahihi kisarufi kwa wingi na si mbadala bora wa kiistilahi; “misingi yake” ni mbadala salama na unaoeleweka kwa אֲדָנָיו.
