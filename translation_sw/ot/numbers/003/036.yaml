base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/036.yaml
  text: And the appointed duty of the sons of Merari was the frames of the tabernacle[a], its bars, its pillars, its bases, all its furnishings[c][b], and all its service.
translation:
  language: sw
  text: Na jukumu walilopewa wana wa Merari lilihusu viunzi vya Maskani[a], makomeo yake, nguzo zake, vitako vyake[b], vifaa vyake vyote, na kazi yote inayohusiana na Maskani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbao za Maskani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “misingi yake.”
    reason: lexical_alternative
  - marker: c
    text: Au, “na huduma yake yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  choice: jukumu walilokabidhiwa ... lilikuwa kutunza
  rationale: Muunganiko huu unaonyesha wajibu rasmi uliokabidhiwa. Kiswahili hiki ni cha kawaida na kinahifadhi wazo la jukumu pamoja na utunzaji wa vitu vya Maskani.
- source_word: בְּנֵי מְרָרִי
  choice: wana wa Merari
  rationale: Hufuata kwa uwazi usemi halisi wa Kiebrania na ni wa kawaida katika sajili ya Biblia ya Kiswahili.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: viunzi vya Maskani
  rationale: קֶרֶשׁ hurejelea vipande vya wima vya muundo wa Maskani. 'Viunzi' huonyesha kazi yake ya kimuundo bila kulazimisha maana finyu ya mbao tambarare.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: Hili ni neno la Kiswahili lililozoeleka kwa mahali patakatifu pa kukutania panapotajwa katika muktadha huu, na linahifadhi dhana ya makao.
- source_word: בְרִיחָיו
  choice: makomeo yake
  rationale: Neno hili linafaa kwa fito ndefu zilizoshikilia viunzi pamoja na limezoeleka katika maelezo ya ujenzi wa Maskani.
- source_word: עַמֻּדָיו
  choice: nguzo zake
  rationale: Ni tafsiri ya kawaida na wazi kwa mihimili ya wima inayotegemeza muundo.
- source_word: אֲדָנָיו
  choice: vitako vyake
  rationale: Hurejelea sehemu za msingi ambazo nguzo au viunzi viliingizwa; 'vitako' ni sahihi katika muktadha wa ujenzi, huku mbadala ukielezwa katika tanbihi.
- source_word: כָל כֵּלָיו
  choice: vifaa vyake vyote
  rationale: כֵּלִים ni istilahi pana kwa vyombo, zana, au vifaa; 'vifaa' hudumisha upana huo.
- source_word: כֹל עֲבֹדָתוֹ
  choice: kufanya kazi yote inayohusiana navyo
  rationale: Usemi huu unaonyesha kazi au huduma yote iliyohitajika kuhusiana na vitu vilivyoorodheshwa, kwa Kiswahili cha kawaida bila kupoteza wazo la wajibu wa kiutendaji.
