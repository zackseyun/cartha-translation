  text: These are the generations of Aaron and Moses at the time when Yahweh spoke with Moses on Mount Sinai[a][b][c].
translation:
  language: sw
  text: Hivi ndivyo vizazi vya Haruni na Musa[a], wakati Yahwe alipozungumza na Musa katika Mlima Sinai[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazao wa Haruni na Musa.” Kichwa cha Kiebrania kinatumia neno “vizazi,” ambalo kwa kawaida linaweza kutanguliza ukoo au yale yanayotokana na mtu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, neno kwa neno, “katika siku ambayo”; hii ni nahau yenye maana ya “wakati” au “alipozungumza.”
    reason: lexical_alternative
  - marker: c
    text: Au, “alipomwambia Musa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hivi ndivyo
  rationale: Ni utangulizi wa sehemu mpya unaoelekeza kwenye habari inayofuata; muundo huu ni wa asili katika Kiswahili na unapatana na nomino ya ngeli ya vi- ‘vizazi’.
- source_word: תּוֹלְדֹת
  choice: vizazi
  rationale: Neno hilo linaweza kuwa kichwa cha ukoo, wazao, au mambo yanayotokana na mtu. ‘Vizazi’ linadumisha upana na mtindo rasmi wa kichwa cha Kiebrania bila kuufanya mstari useme wazao pekee.
- source_word: אַהֲרֹן וּמֹשֶׁה
  choice: Haruni na Musa
  rationale: Majina yote mawili yaliyomo katika chanzo yamedumishwa, ingawa mistari inayofuata inawakazia zaidi wana wa Haruni.
- source_word: בְּיוֹם
  choice: wakati ... alipo-
  rationale: Kwa neno neno ni ‘katika siku,’ lakini hapa ni nahau ya wakati yenye maana ya ‘wakati’ au ‘alipo-’; tafsiri hii ni ya kawaida katika Kiswahili cha sasa.
- source_word: דִּבֶּר ... אֶת מֹשֶׁה
  choice: alipozungumza na Musa
  rationale: Muundo wa Kiebrania unaweza kueleweka kuwa alisema na au alimwelekea Musa kwa maneno. ‘Alizungumza na Musa’ ni Kiswahili cha asili na hudumisha uwezekano wa maana ya ‘spoke with,’ huku njia nyingine ikitajwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: בְּהַר סִינָי
  choice: juu ya Mlima Sinai
  rationale: Huu ni usemi wa kawaida na mahususi wa Kiswahili kwa tukio lililotokea mlimani Sinai.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu. ‘Yahwe’ hulidumisha kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya תּוֹלְדֹת katika kichwa kinachowataja Haruni na Musa
  choice: vizazi vya Haruni na Musa
  alternative: wazao wa Haruni na Musa; ukoo wa Haruni na Musa
  rationale: Mistari inayofuata inawahusu hasa wana wa Haruni, lakini kichwa cha Kiebrania kinawataja Haruni na Musa. Tafsiri haiondoi mvutano huo kwa kuibana maana kuwa wazao tu.
- issue: Uhusiano unaoonyeshwa na דִּבֶּר ... אֶת מֹשֶׁה
  choice: alipozungumza na Musa
  alternative: alipomwambia Musa
  rationale: Kiebrania kinaweza kuwasilishwa kwa maana ya kusema na au kusema kwa mtu. Chaguo kuu linafuata uwezekano wa ‘na,’ huku tanbihi ikidumisha uwezekano wa Musa kuwa mtu aliyeelekezewa maneno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Vizazi’ kimedumishwa kama kichwa rasmi chenye upana wa maana; nahau ya Kiebrania imetafsiriwa kwa Kiswahili cha kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
