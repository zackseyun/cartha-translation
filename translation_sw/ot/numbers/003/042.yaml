  text: וַ/יִּפְקֹ֣ד מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ אֶֽת כָּל בְּכֹ֖ר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/042.yaml
  text: So Moses counted every firstborn among the sons of Israel[a], just as Yahweh had commanded him.
translation:
  language: sw
  text: Basi Musa akawahesabu wazaliwa wa kwanza wote miongoni mwa wana wa Israeli[a], kama vile Yahwe alivyomwamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli”; pia inaweza kutafsiriwa “Waisraeli” au “watoto wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: akawahesabu
  rationale: Katika muktadha huu wa sensa, kitenzi פקד kinamaanisha kuhesabu watu. ‘Akawahesabu’ ni cha kawaida na wazi katika Kiswahili.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Kiunganishi hiki kinaonyesha kwamba Musa alitenda kwa kufuata sawasawa agizo alilopewa.
- source_word: צִוָּה
  choice: alivyomwamuru
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba amri ya Yahwe ilitangulia tendo la Musa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo linalotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: אֹתוֹ
  choice: -m- katika ‘alivyomwamuru’
  rationale: Kiwakilishi hiki kinamrejelea Musa, aliyepokea amri.
- source_word: אֶת כָּל בְּכֹר
  choice: wazaliwa wa kwanza wote
  rationale: Tafsiri hii inaonyesha jumla ya wazaliwa wa kwanza waliohesabiwa bila kuongeza neno ‘wa kiume,’ ambalo halipo wazi katika mstari huu.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: miongoni mwa wana wa Israeli
  rationale: ‘Miongoni mwa’ linaonyesha maana ya ב katika muktadha wa kuhesabu, na ‘wana wa Israeli’ linahifadhi usemi wa undugu wa Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia moja kwa moja jina la Mungu. ‘Yahwe’ hulihifadhi kama jina binafsi kwa umbo la kawaida la Kiswahili badala ya kulibadilisha kuwa cheo.
- issue: Usemi wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli au watoto wa Israeli
  rationale: Chanzo kinatumia neno la undugu la kiume; ‘wana wa Israeli’ linahifadhi usemi huo bila kuufanya usio na jinsia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye staha. Muundo ‘kama vile ... alivyomwamuru’ ni wa kawaida na unaonyesha utiifu kamili kwa amri iliyotangulia.
