  text: Their numbered ones[a], according to the number of every male from a month old and upward, were seven thousand five hundred.
translation:
  language: sw
  text: Watu wao waliohesabiwa,[a] kwa hesabu ya kila mwanamume mwenye umri wa mwezi mmoja na zaidi—watu wao waliohesabiwa walikuwa elfu saba na mia tano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walioandikishwa katika hesabu yao.” Kiebrania hurudia neno la sensa “watu wao waliohesabiwa” baadaye katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: waliohesabiwa miongoni mwao
  rationale: Neno hili limetokana na פקד na katika muktadha huu linamaanisha watu walioingizwa katika hesabu ya sensa. Tafsiri hii ni ya asili kwa Kiswahili na inadumisha maana ya waliohesabiwa.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: yaani kila mwanamume
  rationale: Kihusishi kinaanzisha maelezo ya waliojumlishwa katika hesabu. ‘Yaani’ kinaweka wazi uhusiano huo kwa Kiswahili cha kawaida, huku ‘kila mwanamume’ kikihifadhi umahususi wa kiume wa Kiebrania.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: mwenye umri wa mwezi mmoja na zaidi
  rationale: Hii ni fomula ya kizingiti cha umri. Usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa.
- source_word: שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: elfu saba na mia tano
  rationale: Idadi imeandikwa kwa maneno ili isomeke kwa urahisi katika nathari ya Biblia.
