base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/027.yaml
  text: 'And for Kohath: the clan of the Amramites, and the clan of the Izharites, and the clan of the Hebronites, and the clan of the Uzzielites—these are the clans of the Kohathites.'
translation:
  language: sw
  text: 'Na kwa Kohathi: ukoo wa Waamramu, ukoo wa Waishari, ukoo wa Wahebroni, na ukoo wa Wauzieli. Hizi ndizo koo za Wakohathi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/קְהָת
  choice: Na kwa Kohathi
  rationale: Kiunganishi pamoja na kihusishi kinaanzisha kundi linalofuata katika orodha; “Na kwa Kohathi” huhifadhi muundo huo wa uainishaji kwa Kiswahili cha kawaida.
- source_word: מִשְׁפַּחַת
  choice: ukoo wa
  rationale: Katika muktadha wa nasaba na sensa, neno hili linamaanisha kundi la jamaa ndani ya kundi kubwa zaidi; “ukoo” ni la asili na wazi kwa Kiswahili.
- source_word: הַֽ/עַמְרָמִי
  choice: Waamramu
  rationale: Ni jina la ukoo linalowataja wazao wa Amramu; umbo la Kiswahili lenye kiambishi Wa- linaonyesha kundi la watu.
- source_word: הַ/יִּצְהָרִי
  choice: Waishari
  rationale: Ni jina la ukoo wa wazao wa Ishari, likitumia umbo la kawaida la Kiswahili kwa kundi la watu.
- source_word: הַֽ/חֶבְרֹנִי
  choice: Wahebroni
  rationale: Ni jina la ukoo wa wazao wa Hebroni; umbo hili linadumisha uhusiano na jina la babu yao.
- source_word: הָֽ/עָזִּיאֵלִי
  choice: Wauzieli
  rationale: Ni jina la ukoo wa wazao wa Uzieli, likitafsiri umbo la jina la ukoo kwa njia ya asili katika Kiswahili.
- source_word: אֵלֶּה הֵם
  choice: Hizi ndizo
  rationale: Kauli hii inatambulisha na kujumlisha koo zilizotajwa; “Hizi ndizo” inalingana kisarufi na “koo” na ina nguvu ya utambulisho ya Kiebrania.
- source_word: מִשְׁפְּחֹת הַ/קְּהָתִי
  choice: koo za Wakohathi
  rationale: Wingi wa neno la ukoo unajumlisha makundi hayo kuwa ya wazao wa Kohathi; “koo za Wakohathi” ni wazi na thabiti.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Majina ya ukoo yameundwa kwa kiambishi Wa- ili yaeleweke wazi kuwa ni makundi ya wazao. Neno “kulikuwa na” limeongezwa kwa ulaini wa sentensi ya Kiswahili bila kubadili uainishaji wa maandishi ya Kiebrania.
