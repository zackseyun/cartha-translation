lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Katika fomula hii ya masimulizi, kitenzi דבר pamoja na kiunganishi cha mfululizo kinaendeleza simulizi na kuonyesha kwamba Yahwe alimwelekezea Musa maneno; “akasema na” ni Kiswahili cha kawaida na chenye heshima.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti YHWH limetoholewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA,” ili kuhifadhi jina la kibinafsi lililo katika maandishi ya Kiebrania.
- source_word: אֶל
  choice: na
  rationale: Baada ya “akasema,” Kiswahili sanifu hutumia “na” kumtaja mtu anayeambiwa; hapa linaonyesha kwamba Musa ndiye aliyeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina משה katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kiswahili “akisema” huhifadhi fomula ya Kiebrania inayotanguliza yaliyomo katika hotuba inayofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikieleza desturi nyingine ya tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “akisema” umehifadhiwa kwa sababu aya hii ni fomula ya utangulizi wa maneno yanayofuata, ingawa katika Kiswahili cha mazungumzo ingeweza kuachwa.
