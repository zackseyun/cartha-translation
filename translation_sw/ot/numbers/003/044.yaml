  text: 'Yahweh[a] akasema na Musa, akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH.” Kwa desturi hutafsiriwa “BWANA” katika tafsiri za Kiswahili; hapa limetoholewa kuwa “Yahweh.”'
