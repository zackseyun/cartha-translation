translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. “Maskani” limetumiwa kwa מִשְׁכָּן kama istilahi ya kibiblia inayojulikana. Alama za tanbihi zimewekwa mara moja katika matini kwa mpangilio wa kawaida [a], [b].
