base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/035.yaml
  text: And the chief of the ancestral house of the clans of Merari was Zuriel son of Abihail[b][a]. They were to camp on the north side of the tabernacle.
translation:
  language: sw
  text: Kiongozi[a] wa nyumba ya baba[b] ya koo za Merari alikuwa Surieli mwana wa Abihaili. Walipaswa kupiga kambi upande wa kaskazini wa maskani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkuu”; neno la Kiebrania linaweza kumaanisha kiongozi anayetambuliwa au mkuu.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “nyumba ya baba,” yaani kitengo cha undugu kinachotokana na ukoo wa upande wa baba.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: Kiongozi
  rationale: Katika muktadha huu wa mpangilio wa Walawi, neno נָשִׂיא humaanisha mtu mwenye uongozi unaotambuliwa. “Kiongozi” ni Kiswahili cha kawaida na hakiongezi dhana ya kifalme iliyomo katika “mkuu wa kifalme.” Kiunganishi ו hakihitaji kutafsiriwa kwa “na” mwanzoni mwa sentensi katika Kiswahili hiki.
- source_word: בֵית אָב
  choice: jamaa ya ukoo
  rationale: Kirai hiki, ambacho kwa neno halisi ni “nyumba ya baba,” kinataja kitengo cha undugu kinachofuata nasaba ya upande wa baba. “Jamaa ya ukoo” kinaeleweka kwa urahisi na pia kinakitofautisha na koo pana zinazofuata.
- source_word: לְ/מִשְׁפְּחֹת מְרָרִי
  choice: wa koo za Merari
  rationale: מִשְׁפָּחוֹת hapa ni migawanyiko ya kikoo ndani ya kundi la Merari; “koo” linafaa kuliko “familia” katika muktadha wa sensa na mpangilio wa kabila.
- source_word: מְרָרִי
  choice: Merari
  rationale: Jina la mtu limeandikwa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: צוּרִיאֵל בֶּן אֲבִיחָיִל
  choice: Surieli mwana wa Abihaili
  rationale: Majina yameandikwa kwa tahajia inayolingana na matamshi na desturi za Kiswahili; בֶּן limetafsiriwa kwa usemi wa kawaida wa nasaba, “mwana wa.”
- source_word: עַל יֶרֶךְ הַ/מִּשְׁכָּן ... צָפֹנָ/ה
  choice: upande wa kaskazini wa maskani
  rationale: יֶרֶךְ humaanisha ubavu au upande; pamoja na צָפֹנָה, kirai cha asili kinaonyesha mahali walipopangiwa kaskazini mwa maskani. “Upande wa kaskazini wa maskani” ni tafsiri ya asili na wazi.
- source_word: יַחֲנוּ
  choice: Walipaswa kupiga kambi
  rationale: Kauli isiyotimilika hapa inaeleza mpangilio waliowekewa, si taarifa tu ya kitendo kilichopita. “Walipaswa kupiga kambi” huhifadhi maana hiyo ya agizo au mgawo.
