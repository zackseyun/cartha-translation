  text: From the firstborn of the sons of Israel he took the silver[a], one thousand three hundred sixty-five shekels[b], according to the sanctuary shekel.
translation:
  language: sw
  text: Kutoka kwa wazaliwa wa kwanza wa wana wa Israeli[a], alichukua fedha, shekeli 1,365, kwa kipimo cha shekeli ya mahali patakatifu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazaliwa wa kwanza wa Waisraeli.” Kiebrania, kwa tafsiri ya neno kwa neno, ni “wazaliwa wa kwanza wa wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, kwa kiwango cha uzani cha shekeli kilichotumiwa katika mahali patakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵת
  choice: Kutoka kwa
  rationale: Kihusishi hiki kinaonyesha watu ambao fedha ilitoka kwao bila kuongeza wazo lisilosemwa wazi kuhusu namna ya kuikusanya.
- source_word: בְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: wazaliwa wa kwanza wa wana wa Israeli
  rationale: Nomino ya Kiebrania iko katika umoja lakini inatumiwa kwa maana ya kundi. Tafsiri hii inahifadhi muundo na rejeleo la wanaume katika muktadha wa sensa na ukombozi.
- source_word: לָקַח
  choice: alichukua
  rationale: Hii ndiyo maana ya kawaida ya kitenzi. Ingawa ‘alipokea’ lingewezekana katika muktadha wa malipo, ‘alichukua’ linafuata kwa karibu usemi wa chanzo.
- source_word: הַכָּסֶף
  choice: fedha
  rationale: Neno linaweza kumaanisha metali ya fedha au pesa. ‘Fedha’ huhifadhi maana zote mbili kwa kawaida katika Kiswahili.
- source_word: חֲמִשָּׁה וְשִׁשִּׁים וּשְׁלֹשׁ מֵאוֹת וָאֶלֶף
  choice: 1,365
  rationale: Vipashio vya idadi katika Kiebrania vimewasilishwa kwa mfumo wa kawaida na unaosomeka kwa urahisi katika Kiswahili.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai kinaonyesha kiwango rasmi cha uzani kilichotumiwa katika mahali patakatifu; ‘kwa kipimo cha’ huweka maana hiyo wazi bila kudokeza kuwa shekeli yenyewe ilikuwa kitu cha kuabudiwa.
