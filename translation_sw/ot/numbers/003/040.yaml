base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/040.yaml
  text: Then Yahweh said to Moses[a], “Count every firstborn male among the sons of Israel from a month old and upward, and take the number of their names.”
translation:
  language: sw
  text: Kisha Yahwe akamwambia Musa, “Hesabu wazaliwa wa kwanza wote wa kiume miongoni mwa Waisraeli, wenye umri wa mwezi mmoja na zaidi, na uhesabu idadi yao kwa majina[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kiebrania: “na uchukue hesabu ya majina yao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha moja kwa moja jina la Mungu YHWH kwa umbo linalosomeka kwa kawaida katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw ya masimulizi inaendeleza mfuatano wa matukio; “Kisha” pamoja na kitenzi cha masimulizi ni Kiswahili cha kawaida na huonyesha mwendelezo huo.
- source_word: פְּקֹד
  choice: Wahesabu
  rationale: Katika muktadha wa sensa, kitenzi hiki kinaamuru kuhesabu watu; “wahesabu” ni wazi na cha kawaida.
- source_word: כָּל בְּכֹר זָכָר
  choice: wazaliwa wa kwanza wote wa kiume
  rationale: Huhifadhi maana ya בכור, “mzaliwa wa kwanza,” na ubainisho wa זכר, “wa kiume,” bila kuufanya usemi kuwa wana wa kwanza pekee.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: miongoni mwa Waisraeli
  rationale: Katika muktadha huu usemi unataja watu wa Israeli ambao sensa inafanywa miongoni mwao; “Waisraeli” ni Kiswahili cha kawaida na hakibadili sharti kwamba wanaohesabiwa ni wa kiume.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: wenye umri wa mwezi mmoja na zaidi
  rationale: Hueleza kwa Kiswahili cha kawaida mpaka wa chini wa umri uliowekwa na nahau ya Kiebrania.
- source_word: וְשָׂא אֵת מִסְפַּר שְׁמֹתָם
  choice: na uhesabu idadi yao kwa majina
  rationale: Nahau hiyo inaunganisha jumla ya waliohesabiwa na utambuzi wao kwa majina. Tafsiri hii ni ya asili kwa Kiswahili huku ikihifadhi vipengele vyote viwili.
