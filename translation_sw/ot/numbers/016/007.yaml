id: NUM.16.7
reference: Numbers 16:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/תְנ֣וּ בָ/הֵ֣ן אֵ֡שׁ וְ/שִׂימוּ֩ עֲלֵי/הֶ֨ן קְטֹ֜רֶת לִ/פְנֵ֤י יְהוָה֙ מָחָ֔ר וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁר יִבְחַ֥ר יְהוָ֖ה ה֣וּא הַ/קָּד֑וֹשׁ רַב לָ/כֶ֖ם בְּנֵ֥י לֵוִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/007.yaml
  text: and put fire in them[a], and place incense on them before Yahweh tomorrow. Then the man whom Yahweh chooses—he is the holy one. You have gone too far, sons of Levi!
translation:
  language: sw
  text: Wekeni moto ndani ya vyetezo hivyo, na mtie uvumba juu yake mbele za Yahwe kesho. Basi mtu ambaye Yahwe atamchagua, huyo ndiye mtakatifu. Mmevuka mipaka[a], enyi wana wa Lawi!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yamezidi kwenu, enyi wana wa Lawi!”
    reason: Kifungu רַב לָכֶם kinaweza kutolewa kwa ukaribu zaidi kama tamko la kwamba jambo limezidi kwao, badala ya karipio la moja kwa moja la kuvuka mipaka.
lexical_decisions:
- source_word: וּתְנוּ בָהֵן אֵשׁ
  choice: na mweke moto ndani yavyo
  rationale: Kitenzi נתן pamoja na ב kinaeleza kuweka moto ndani ya vyetezo vilivyotajwa katika muktadha uliotangulia. “Ndani yavyo” huhifadhi wingi wa viwakilishi vya Kiebrania.
- source_word: וְשִׂימוּ עֲלֵיהֶן קְטֹרֶת
  choice: kisha mweke uvumba juu yavyo
  rationale: שים ni ‘kuweka,’ na עַל inaonyesha kwamba uvumba unawekwa juu ya moto uliomo katika vyetezo. “Kisha” huonyesha kwa kawaida hatua inayofuata bila kubadili maana.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Hii ni nahau ya ibada inayomaanisha kutenda katika uwepo wa Yahwe; “mbele za” ni usemi wa Kiswahili unaofaa katika sajili hii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama jina binafsi, Yahwe, badala ya kubadilishwa kuwa cheo.
- source_word: מָחָר
  choice: kesho
  rationale: Ni kielezi cha wakati chenye maana ya moja kwa moja.
- source_word: וְהָיָה
  choice: Basi
  rationale: Hapa וְהָיָה inaanzisha matokeo ya jaribio; “Basi” huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: הָאִישׁ אֲשֶׁר יִבְחַר יְהוָה
  choice: mtu ambaye Yahwe atamchagua
  rationale: אִישׁ humaanisha mtu au mwanamume; katika sentensi hii “mtu” ni ya kawaida na haifuti ukweli kwamba anayelengwa katika muktadha ni mwanamume. Wakati ujao wa “atamchagua” unafaa kwa jaribio litakalofanyika kesho.
- source_word: הוּא הַקָּדוֹשׁ
  choice: huyo ndiye mtakatifu
  rationale: 'Muundo huu huhifadhi msisitizo wa הוּא na kibainishi cha הַקָּדוֹשׁ: mtu aliyechaguliwa ndiye anayetambuliwa kuwa mtakatifu, si kwamba anaelezwa tu kuwa na sifa ya utakatifu.'
- source_word: רַב לָכֶם
  choice: Mmevuka mipaka
  rationale: Kifungu hiki, ambacho kihalisi kinahusu kitu kuwa ‘kingi kwenu,’ ni karipio la kwamba wamezidi mpaka unaofaa. Usemi huu wa Kiswahili huhifadhi nguvu ya karipio, huku tanbihi ikitoa uwezekano mwingine wa kileksika.
- source_word: בְּנֵי לֵוִי
  choice: enyi wana wa Lawi
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania na nguvu ya mwito wa moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina la agano bila kulibadilisha kuwa cheo.
- issue: Nguvu ya karipio רַב לָכֶם
  choice: Mmevuka mipaka
  alternative: Imewatosha
  rationale: Katika muktadha Musa anawakemea kwa kuvuka mipaka katika dai lao kuhusu ukuhani. Tafsiri kuu huhifadhi nguvu hiyo, na tanbihi huhifadhi uwezekano wa kuielewa kama tamko la ‘imetosha.’
- issue: Maana ya הוּא הַקָּדוֹשׁ
  choice: huyo ndiye mtakatifu
  alternative: huyo ndiye aliye mtakatifu
  rationale: Kibainishi na kiwakilishi cha msisitizo vinaonyesha mtu mmoja atakayetambuliwa kwa uchaguzi wa Yahwe. Tafsiri haifafanui zaidi iwapo utakatifu huo ni hadhi, sifa, au kuwekwa wakfu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri na mwito wa moja kwa moja umehifadhiwa; “ndani yavyo/juu yavyo” huhifadhi wingi wa vyetezo vilivyotajwa katika aya iliyotangulia.
