base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/018.yaml
  text: So each man took his firepan[a], and they put fire in them and put incense on them, and they stood at the entrance of the tent of meeting, with Moses and Aaron.
translation:
  language: sw
  text: Kisha kila mmoja akachukua chetezo chake[a]. Wakaweka moto ndani ya vyetezo vyao, kisha wakaweka uvumba juu ya moto huo; halafu wakasimama kwenye mlango wa Hema la Kukutania pamoja na Musa na Haruni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chombo chake cha makaa.” Neno la Kiebrania linamaanisha chombo cha kubebea makaa yanayowaka wakati wa kufukiza uvumba.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מַחְתָּתוֹ
  choice: kila mmoja akachukua chetezo chake
  rationale: 'אִישׁ ina maana ya mgawanyo hapa: kila mtu katika kundi alichukua chombo chake mwenyewe. Neno “chetezo” ni istilahi ya kawaida ya Kiswahili kwa chombo kilichotumiwa kubebea makaa yanayowaka na kufukizia uvumba.'
- source_word: וַיִּתְּנוּ עֲלֵיהֶם אֵשׁ
  choice: wakaweka moto ndani ya vyetezo vyao
  rationale: Ingawa עַל kimsingi ni “juu ya,” katika muktadha wa vyombo hivi maana ya kawaida ni kuweka makaa ya moto ndani yake. Kiswahili cha asili hutumia “ndani ya” kwa tendo hilo.
- source_word: וַיָּשִׂימוּ עֲלֵיהֶם קְטֹרֶת
  choice: na kuweka uvumba juu yake
  rationale: Uvumba uliwekwa juu ya moto uliokuwa vyetezoni. Kauli hii ni ya kawaida na inahifadhi mpangilio wa tendo la ibada bila kuongeza maelezo yasiyo katika matini.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa dutu yenye harufu nzuri inayoteketezwa katika ibada.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye mlango wa Hema la Kukutania
  rationale: “Mlango” huwasilisha פֶּתַח kwa lugha ya kawaida, na “Hema la Kukutania” ni tafsiri iliyo wazi na iliyozoeleka ya אֹהֶל מוֹעֵד.
- source_word: וּמֹשֶׁה וְאַהֲרֹן
  choice: pamoja na Musa na Haruni
  rationale: Kirai kisicho na kitenzi kinaonyesha kuwa Musa na Haruni pia walikuwa wamesimama hapo; “pamoja na” huonyesha ushirika huo kwa uwazi.
