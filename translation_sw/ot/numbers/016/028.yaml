  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּֽי יְהוָ֣ה שְׁלָחַ֔/נִי לַ/עֲשׂ֕וֹת אֵ֥ת כָּל הַֽ/מַּעֲשִׂ֖ים הָ/אֵ֑לֶּה כִּי לֹ֖א מִ/לִּבִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/028.yaml
  text: And Moses said[a], “By this you will know that Yahweh has sent me to do all these deeds[b], for it was not from my own heart.”
translation:
  language: sw
  text: Musa akasema, “Kwa hili mtajua kwamba Yahweh amenituma kufanya matendo haya yote[a], kwa maana hayakutokana na moyo wangu mwenyewe[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitendo hivi vyote” au “mambo haya yote.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “si kutoka moyoni mwangu,” yaani hayakuwa kwa msukumo, uamuzi, au mamlaka ya Musa mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: Musa akasema
  rationale: Muundo wa kawaida wa masimulizi ya Kiebrania umetafsiriwa kwa Kiswahili cha kawaida bila kuongeza uhusiano wa wakati usioelezwa wazi.
- source_word: בְּזֹאת
  choice: Kwa hili
  rationale: Huwasilisha beth ya njia au ushahidi na kuelekeza kwenye tukio litakalothibitisha madai ya Musa.
- source_word: תֵּדְעוּן
  choice: mtajua
  rationale: Kitenzi cha nafsi ya pili wingi kina maana ya wakati ujao katika muktadha huu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano limetolewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: שְׁלָחַנִי
  choice: amenituma
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika ambalo umuhimu wake unaendelea wakati Musa anaposema.
- source_word: לַעֲשׂוֹת אֵת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: kufanya matendo haya yote
  rationale: ‘Matendo’ huhifadhi maana halisi ya מַעֲשִׂים kama vitendo au kazi, huku ‘kufanya’ ikibaki pana kama עשה.
- source_word: כִּי לֹא מִלִּבִּי
  choice: kwa maana hayakutokana na moyo wangu mwenyewe
  rationale: Huhifadhi picha ya Kiebrania ya jambo kutoka moyoni mwa Musa, huku ikifanya uhusiano wa kisarufi na ‘matendo’ uwe wazi kwa Kiswahili.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina maalumu la Mungu, si cheo; ‘Yahweh’ hulihifadhi bila kulibadilisha kuwa ‘Bwana.’
- issue: Maana ya ‘hayakutokana na moyo wangu’
  choice: Kudumisha nahau katika maandishi na kuifafanua katika tanbihi
  alternative: sikuyafanya kwa uamuzi au mamlaka yangu mwenyewe
  rationale: Nahau inaweza kuhusisha msukumo, uamuzi, au mamlaka ya Musa mwenyewe. Kuiweka karibu na Kiebrania huepuka kuifungia katika maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa karibu na chanzo umehifadhiwa pale ambapo unabaki wa kawaida kwa Kiswahili.
