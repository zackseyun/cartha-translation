  text: וַ/יִּֽקָּהֲל֞וּ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֣וּ אֲלֵ/הֶם֮ רַב לָ/כֶם֒ כִּ֤י כָל הָֽ/עֵדָה֙ כֻּלָּ֣/ם קְדֹשִׁ֔ים וּ/בְ/תוֹכָ֖/ם יְהוָ֑ה וּ/מַדּ֥וּעַ תִּֽתְנַשְּׂא֖וּ עַל קְהַ֥ל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/003.yaml
  text: They assembled against Moses and against Aaron and said to them[a], “You have gone too far! For all the congregation—all of them—are holy, and Yahweh is among them[b]. So why do you exalt yourselves above the assembly of Yahweh?”
translation:
  language: sw
  text: Wakakusanyika kuwapinga Musa na Haruni, wakawaambia, “Mmevuka mipaka![a] Kwa maana jumuiya yote—wote—ni watakatifu, na Yahwe yuko kati yao.[b] Basi kwa nini mnajiinua juu ya kusanyiko la Yahwe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Mmezidisha” au “Haya yamewatosha.” Nahau hiyo hapa imetafsiriwa “Mmevuka mipaka!” ili kutoa maana yake wazi katika Kiswahili cha sasa.'
    reason: lexical_alternative
  - marker: b
    text: “Yahwe” linawakilisha jina la Mungu YHWH katika Kiebrania; katika mapokeo mengi ya tafsiri jina hilo huwakilishwa kwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: Wakakusanyika kumpinga Musa na Haruni
  rationale: Kitenzi קהל kinaonyesha kukusanyika kwa pamoja, na עַל katika muktadha huu wa makabiliano kinaonyesha upinzani. ‘Kumpinga’ ni Kiswahili cha kawaida kinachowasilisha maana hiyo bila kuongeza ukali usiotajwa.
- source_word: רַב לָכֶם
  choice: Mmevuka mipaka!
  rationale: Hii ni nahau ya kukemea kwa ukali. Tafsiri hii ya Kiswahili cha sasa huwasilisha shtaka kwamba Musa na Haruni wamezidi, huku tanbihi ikihifadhi maana yake ya karibu zaidi na Kiebrania.
- source_word: כָל הָעֵדָה כֻּלָּם
  choice: jumuiya yote—wote—
  rationale: Muundo huu unahifadhi msisitizo wa Kiebrania wa ujumla maradufu, כָל pamoja na כֻּלָּם. Vistari virefu vinaonyesha mkazo wa maneno ‘wote’.
- source_word: קְדֹשִׁים
  choice: ni watakatifu
  rationale: ‘Watakatifu’ ni tafsiri ya kawaida na yenye uzito wa kidini ya קדושׁ, na hapa inawasilishwa moja kwa moja kama dai la wasemaji.
- source_word: וּבְתוֹכָם יְהוָה
  choice: na Yahwe yuko kati yao
  rationale: ‘Yuko kati yao’ huonyesha uwepo wa Mungu ndani ya jumuiya kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: וּמַדּוּעַ תִּתְנַשְּׂאוּ
  choice: Basi kwa nini mnajiinua
  rationale: ‘Basi’ huonyesha hitimisho linalotokana na dai lililotangulia, na ‘mnajiinua’ huhifadhi hali ya kujitendea ya kitenzi cha Kiebrania—kujiweka juu ya wengine.
- source_word: עַל קְהַל יְהוָה
  choice: juu ya kusanyiko la Yahwe
  rationale: ‘Juu ya’ huwasilisha shtaka la kujitukuza kuliko wengine. ‘Kusanyiko’ linatofautisha קהל na עֵדָה iliyotafsiriwa ‘jumuiya’ bila kuleta tofauti ya maana kupita kiasi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu YHWH. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Iwapo dai kwamba jumuiya yote ni takatifu lithibitishwe au lidhoofishwe katika tafsiri
  choice: Dai limetafsiriwa moja kwa moja kama lilivyosemwa
  alternative: Kuongeza maneno kama ‘wanadai kuwa watakatifu’ au maelezo yanayolitilia shaka
  rationale: Aya inaripoti madai ya wasemaji; tathmini yake inaachwa kwa muktadha mpana. Hivyo tafsiri haiingizi hukumu ya kisimulizi ndani ya kauli yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ni wazi kwa msomaji wa kawaida huku ikihifadhi msisitizo wa Kiebrania, ukali wa makabiliano, na tofauti ndogo kati ya עֵדָה (‘jumuiya’) na קהל (‘kusanyiko’).
