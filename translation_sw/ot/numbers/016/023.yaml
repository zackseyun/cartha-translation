  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Infinitivu hii hutanguliza maneno yanayofuata. “Akisema” huhifadhi muundo wa Kiebrania na kuacha sentensi wazi kwa ajili ya nukuu katika mstari unaofuata.
