  text: וַ/יִּ֤חַר לְ/מֹשֶׁה֙ מְאֹ֔ד וַ/יֹּ֨אמֶר֙ אֶל יְהוָ֔ה אַל תֵּ֖פֶן אֶל מִנְחָתָ֑/ם לֹ֠א חֲמ֨וֹר אֶחָ֤ד מֵ/הֶם֙ נָשָׂ֔אתִי וְ/לֹ֥א הֲרֵעֹ֖תִי אֶת אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/015.yaml
  text: Then Moses became very angry and said to Yahweh, “Do not turn toward their offering. I have not taken a single donkey from them, nor have I harmed any one of them.”
translation:
  language: sw
  text: Ndipo Musa akakasirika sana, akamwambia Yahwe, “Usiigeukie sadaka yao[a]. Sijachukua kwao hata punda mmoja, wala sijamdhuru hata mmoja wao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usiitazame kwa kibali sadaka yao,” au “Usiikubali sadaka yao.” Kiebrania kinasema kihalisi, “Usiigeukie sadaka yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְמֹשֶׁה מְאֹד
  choice: Ndipo Musa akakasirika sana
  rationale: Nahau ya Kiebrania inaeleza hasira iliyowaka ndani ya Musa; ‘akakasirika sana’ ni Kiswahili cha asili kinachohifadhi nguvu ya מְאֹד.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kuwa ‘Yahwe’ badala ya kubadilishwa na cheo.
- source_word: אַל תֵּפֶן אֶל מִנְחָתָם
  choice: Usiigeukie sadaka yao
  rationale: ‘Usiigeukie’ huhifadhi taswira ya פנה אל, ‘kugeukia,’ ambayo katika ombi hili inaweza pia kumaanisha kuitazama kwa kibali au kuikubali.
- source_word: מִנְחָתָם
  choice: sadaka yao
  rationale: מִנְחָה inaweza kuwa zawadi, kodi, au sadaka. ‘Sadaka’ inafaa katika muktadha huu wa ibada bila kuibainisha kupita kiasi kuwa sadaka ya nafaka.
- source_word: לֹא חֲמוֹר אֶחָד מֵהֶם נָשָׂאתִי
  choice: Sijachukua kwao hata punda mmoja
  rationale: Kauli hii huhifadhi mfano halisi wa punda mmoja na msisitizo kwamba Musa hakujipatia mali yao.
- source_word: וְלֹא הֲרֵעֹתִי אֶת אַחַד מֵהֶם
  choice: wala sijamdhuru hata mmoja wao
  rationale: Kitenzi katika Hiphil kina maana ya kumtendea mtu mabaya au kumdhuru; ‘sijamdhuru’ ni fupi, wazi, na cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia jina la agano יהוה moja kwa moja; ‘Yahwe’ huhifadhi jina hilo badala ya kuweka cheo mahali pake.
- issue: Maana ya ombi kuhusu sadaka
  choice: Usiigeukie sadaka yao
  alternative: Usiikubali sadaka yao
  rationale: Neno la Kiebrania linahifadhi taswira ya kugeukia, huku katika muktadha likiruhusu maana ya kuikubali au kuitazama kwa kibali. Tafsiri kuu haifungi maana katika ‘kukubali’ pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio wa sentensi ni wa asili, huku taswira na utata halisi wa ombi la Musa vikihifadhiwa.
