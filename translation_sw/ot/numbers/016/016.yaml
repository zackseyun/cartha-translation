base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/016.yaml
  text: And Moses said to Korah[a], “You and all your congregation[b], be before Yahweh tomorrow—you and they and Aaron.”
translation:
  language: sw
  text: Musa akamwambia Kora, “Wewe na kusanyiko lako lote, kesho muwe mbele za Yahweh[a]—wewe, wao, na Haruni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika uwepo wa Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל קֹרַח
  choice: Musa akamwambia Kora
  rationale: Muundo wa ‘aka-’ unaendeleza mtiririko wa simulizi kwa Kiswahili cha kawaida, huku ‘akamwambia’ ikitaja kwa kawaida anayeelekezewa maneno.
- source_word: אַתָּה וְכָל עֲדָתְךָ
  choice: Wewe na kusanyiko lako lote
  rationale: עֵדָה hapa ni kundi lililokusanyika pamoja na Kora. ‘Kusanyiko’ huhifadhi maana ya pamoja bila kulifanya kuwa dhehebu au taasisi rasmi.
- source_word: הֱיוּ
  choice: muwe
  rationale: Hii ni amri ya wingi ya kitenzi ‘kuwa.’ ‘Muwe’ huhifadhi usemi wa moja kwa moja wa Kiebrania badala ya kuufafanua zaidi kuwa ‘jitokezeni.’
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: לִפְנֵי inaweza kumaanisha ‘mbele ya’ au ‘katika uwepo wa.’ ‘Mbele za Yahweh’ ni usemi wa kawaida na wenye heshima unaohifadhi picha ya chanzo.
- source_word: אַתָּה וָהֵם וְאַהֲרֹן
  choice: wewe, wao, na Haruni
  rationale: Orodha hii ya wazi inahifadhi msisitizo wa Kiebrania kwamba Kora, kundi lake, na Haruni wote watahudhuria.
- source_word: מָחָר
  choice: kesho
  rationale: ‘Kesho’ ni tafsiri ya moja kwa moja na ya kawaida ya kielezi hiki cha wakati.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa urahisi. Mstari mrefu umetumika kuhifadhi msisitizo wa orodha ya mwisho bila kuifanya kuwa sentensi tofauti.
