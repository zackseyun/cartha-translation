  text: וַ/יֵּעָל֗וּ מֵ/עַ֧ל מִשְׁכַּן קֹ֛רֶח דָּתָ֥ן וַ/אֲבִירָ֖ם מִ/סָּבִ֑יב וְ/דָתָ֨ן וַ/אֲבִירָ֜ם יָצְא֣וּ נִצָּבִ֗ים פֶּ֚תַח אָֽהֳלֵי/הֶ֔ם וּ/נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶ֖ם וְ/טַפָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/027.yaml
  text: So they moved away from around the dwelling of Korah[a], Dathan, and Abiram. And Dathan and Abiram came out, standing at the entrance of their tents, with their wives, their sons[b], and their little children.
translation:
  language: sw
  text: Basi wakaondoka katika eneo lililozunguka makao ya Kora,[a] Dathani na Abiramu. Dathani na Abiramu wakatoka nje, wakasimama kwenye maingilio ya mahema yao pamoja na wake zao, wana wao, na watoto wao wadogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakapanda kutoka pande zote za makao ya Kora, Dathani na Abiramu.” Kitenzi cha Kiebrania kina maana halisi ya “kupanda,” lakini hapa huenda kimetumiwa kwa maana ya kuondoka katika eneo hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָלוּ מֵעַל ... מִסָּבִיב
  choice: wakaondoka katika eneo lililozunguka
  rationale: Kitenzi kina maana halisi ya ‘wakapanda,’ lakini pamoja na מֵעַל na מִסָּבִיב katika muktadha huu kinaonyesha kujitenga na kuondoka katika eneo la karibu. Tafsiri hii ni ya kawaida katika Kiswahili bila kulazimisha wazo la kwenda juu.
- source_word: מִשְׁכַּן
  choice: makao
  rationale: Hapa neno linaonyesha mahali pa kukaa au eneo la kambi linalohusishwa na Kora, Dathani na Abiramu, si Maskani ya BWANA.
- source_word: יָצְאוּ נִצָּבִים
  choice: wakatoka nje, wakasimama
  rationale: Inahifadhi kwa uwazi tendo la kutoka na hali yao ya kusimama, bila kuongeza maana ya ukaidi ambayo huenda muktadha ukaidokeza lakini neno lenyewe haliilazimishi.
- source_word: פֶּתַח אָֽהֳלֵיהֶם
  choice: kwenye milango ya mahema yao
  rationale: ‘Milango’ ni usemi wa kawaida wa Kiswahili kwa sehemu za kuingilia mahema, huku wingi wa mahema katika Kiebrania ukihifadhiwa.
- source_word: וּנְשֵׁיהֶם וּבְנֵיהֶם וְטַפָּם
  choice: pamoja na wake zao, wana wao, na watoto wao wadogo
  rationale: ‘Wana’ huhifadhi utofauti kati ya בנים na טף, huku ‘watoto wao wadogo’ ikitoa maana dhahiri ya watoto wadogo au wategemezi wachanga.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili. ‘Makao’ huepuka kuchanganya eneo hili na Maskani takatifu ya BWANA.
