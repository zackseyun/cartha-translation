  text: 'Fanyeni hivi: Jichukulieni vyetezo[a], Kora na kusanyiko lake lote[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vyombo vya makaa.” Neno la Kiebrania humaanisha vyombo vya kubebea makaa yanayowaka, hasa wakati wa kufukiza uvumba.
