lexical_decisions:
- source_word: זֹאת עֲשׂוּ
  choice: Fanyeni hivi
  rationale: Muundo huu unatafsiri kwa Kiswahili cha kawaida amri ya wingi inayotanguliza maagizo yanayofuata.
- source_word: קְחוּ לָכֶם
  choice: Jichukulieni
  rationale: Kitenzi cha wingi chenye kiambishi cha kujirejelea kinahifadhi maana ya kuchukua kwa matumizi yao wenyewe bila kuwa kizito.
- source_word: מַחְתּוֹת
  choice: vyetezo
  rationale: Neno hili hutaja vyombo vya kubebea makaa yanayowaka na kufukizia uvumba katika ibada; “vyetezo” ni istilahi ya kawaida katika muktadha huu.
- source_word: קֹרַח
  choice: Kora
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: וְכָל עֲדָתוֹ
  choice: na kusanyiko lake lote
  rationale: עֵדָה humaanisha kundi lililokusanyika; “kusanyiko” ni la kawaida na halilazimishi maana ya jumuiya rasmi ya kidini.
