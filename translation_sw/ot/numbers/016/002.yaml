  yaml_path: translation/ot/numbers/016/002.yaml
  text: and rose up before Moses[a], with two hundred fifty men from the sons of Israel, leaders of the congregation, called to the assembly[b], men of renown.
translation:
  language: sw
  text: wakainuka mbele ya Musa, pamoja na wanaume 250 kutoka miongoni mwa wana wa Israeli[a], viongozi wa kusanyiko, walioitwa kwenye mkutano[b], watu mashuhuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania husema “wana wa Israeli,” jina la agano lililohifadhiwa hapa ili kuonyesha wazi usemi wa lugha chanzi.
    reason: lexical_alternative
  - marker: b
    text: Au, “walioitishwa kwenye mkutano.” Maneno ya Kiebrania yanaweza kumaanisha watu walioitwa rasmi kuhudhuria mkutano wa jumuiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: wakainuka
  rationale: Kitenzi cha masimulizi kutoka קום kinaonyesha kusimama na kuchukua hatua; tafsiri hii haiongezi moja kwa moja wazo la uasi.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Huhifadhi maana ya mahali na uhusiano ya ‘mbele ya/katika uwepo wa’; muktadha ndio unaoonyesha hali ya makabiliano.
- source_word: וַאֲנָשִׁים מִבְּנֵי יִשְׂרָאֵל חֲמִשִּׁים וּמָאתָיִם
  choice: pamoja na wanaume 250 kutoka miongoni mwa wana wa Israeli
  rationale: Muundo wa Kiebrania ni wa mkato; ‘pamoja na’ unaunganisha kwa kawaida wanaume hao na waliotajwa katika muktadha, huku ‘wana wa Israeli’ ikihifadhi jina la agano na jinsia ya אַנְשִׁים.
- source_word: נְשִׂיאֵי עֵדָה
  choice: viongozi wa kusanyiko
  rationale: ‘Viongozi’ ni Kiswahili cha sasa na wazi kwa wakuu wa jumuiya, na ‘kusanyiko’ linafaa kwa עֵדָה katika muktadha huu.
- source_word: קְרִאֵי מוֹעֵד
  choice: walioitwa kwenye mkutano
  rationale: Huhifadhi wazo la watu walioitwa au kuitishwa kwa mkutano wa jumuiya bila kulifanya kuwa cheo maalumu kisicho wazi katika chanzo.
- source_word: אַנְשֵׁי שֵׁם
  choice: watu mashuhuri
  rationale: Ni usemi wa kawaida wa Kiswahili kwa watu wenye jina, sifa, au heshima inayotambulika.
