base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/022.yaml
  text: Then they fell on their faces and said[a], “God, the God of the spirits of all flesh, shall one man sin[b], and will you be angry with the whole congregation?”
translation:
  language: sw
  text: Ndipo wakaanguka kifudifudi, wakasema, “Ee Mungu, Mungu wa roho za wote wenye mwili,[a] je, mtu mmoja akitenda dhambi,[b] utalikasirikia kusanyiko lote?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu wa pumzi ya wote wenye mwili,” ikisisitiza kwamba Mungu ndiye mtoaji wa uhai kwa kila kiumbe hai.
    reason: lexical_alternative
  - marker: b
    text: '“Mtu mmoja” anaweza kuwakilisha mtu binafsi: ombi ni kwamba dhambi ya mtu mmoja isilete hasira juu ya kusanyiko lote.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: wakaanguka kifudifudi
  rationale: Huhifadhi picha ya Kiebrania ya kuanguka uso chini kwa unyenyekevu, hofu, au maombezi, huku ikiwa Kiswahili cha kawaida.
- source_word: אֵל
  choice: Ee Mungu
  rationale: Neno hili ni wito wa moja kwa moja kwa Mungu; “Ee” huonyesha wazi matumizi ya wito katika Kiswahili.
- source_word: אֱלֹהֵי הָרוּחֹת לְכָל־בָּשָׂר
  choice: Mungu wa roho za wote wenye mwili
  rationale: Huhifadhi “roho” katika wingi na upeo wa “mwili wote,” lakini huifanya nahau hiyo ieleweke kwa msomaji wa Kiswahili.
- source_word: בָּשָׂר
  choice: wote wenye mwili
  rationale: Huhifadhi taswira ya “mwili” bila kutumia kauli isiyo ya kawaida ya “mwili wote”; katika muktadha huu inawahusu wanadamu wote.
- source_word: הָאִישׁ אֶחָד
  choice: mtu mmoja
  rationale: אִישׁ hapa humtaja mtu binafsi wa kiume katika simulizi, lakini swali linasisitiza hasa tofauti kati ya mtu mmoja na kusanyiko lote; “mtu mmoja” ni ya asili na haiingizi utambulisho maalumu usiotajwa.
- source_word: יֶחֱטָא
  choice: akitenda dhambi
  rationale: Muundo wa masharti katika swali la Kiswahili huwasilisha vizuri hoja ya Kiebrania bila kuamua kupita kiasi wakati au namna ya tendo.
- source_word: וְעַל כָּל־הָעֵדָה
  choice: utalikasirikia kusanyiko lote
  rationale: עַל pamoja na קצף huonyesha walengwa wa hasira; “kulikasirikia” ni nahau ya asili ya Kiswahili, na “kusanyiko” linafaa kwa jamii ya Israeli iliyokusanyika.
- source_word: תִּקְצֹף
  choice: utalikasirikia
  rationale: Huwasilisha hasira ya Mungu kwa lugha ya sasa na yenye hadhi bila kuiongeza kuwa ghadhabu kali kuliko ilivyo lazima.
theological_decisions:
- issue: Maana ya “roho za wote wenye mwili”
  choice: Cheo cha Mungu kinachosisitiza ujuzi na mamlaka yake juu ya uhai wa ndani wa kila mwanadamu.
  alternative: Cheo kinachosisitiza kwamba Mungu ndiye mtoaji wa pumzi na uhai kwa kila kiumbe hai.
  rationale: Katika muktadha huu, Musa na Haruni wanamsihi Mungu atofautishe hatia ya mtu binafsi na kusanyiko lote. “Roho” linaendana na hoja hiyo, huku tanbihi ikihifadhi maana halali ya “pumzi.”
- issue: Nguvu wakilishi ya הָאִישׁ אֶחָד
  choice: “Mtu mmoja” huonyesha mtu binafsi anayelinganishwa na kusanyiko lote.
  alternative: “Mwanaume mmoja,” tafsiri inayosisitiza jinsia ya kisarufi na ya mhusika.
  rationale: Hoja ya swali ni uwajibikaji wa mtu mmoja dhidi ya adhabu ya jumuiya. Kiswahili “mtu mmoja” huhifadhi ubinafsi huo bila kufuta uwezekano kwamba mhusika wa simulizi ni mwanamume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inadumisha swali la maombezi na mvutano kati ya hatia ya mtu binafsi na hasira dhidi ya jumuiya nzima. Alama zote za tanbihi zimewekwa katika matini kuu.
