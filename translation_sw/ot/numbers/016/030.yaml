  text: וְ/אִם בְּרִיאָ֞ה יִבְרָ֣א יְהוָ֗ה וּ/פָצְתָ֨ה הָ/אֲדָמָ֤ה אֶת פִּ֨י/הָ֙ וּ/בָלְעָ֤ה אֹתָ/ם֙ וְ/אֶת כָּל אֲשֶׁ֣ר לָ/הֶ֔ם וְ/יָרְד֥וּ חַיִּ֖ים שְׁאֹ֑לָ/ה וִֽ/ידַעְתֶּ֕ם כִּ֧י נִֽאֲצ֛וּ הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/030.yaml
  text: But if Yahweh creates something new[a], and the ground opens its mouth and swallows them and all that belongs to them, and they go down alive to Sheol[b], then you will know that these men have despised Yahweh.
translation:
  language: sw
  text: Lakini ikiwa Yahwe ataumba jambo jipya[a], na ardhi ikafungua kinywa chake na kuwameza watu hao pamoja na vyote walivyo navyo, nao wakashuka wakiwa hai hadi Sheoli[b], ndipo mtakapojua kwamba wanaume hawa wamemdharau Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ataumba uumbaji” au “ataumba kitu kipya.” Kiebrania kinatumia nomino na kitenzi vya mzizi mmoja ili kusisitiza tendo la Mungu lililo la ajabu.
    reason: lexical_alternative
  - marker: b
    text: Sheoli ni neno la Kiebrania linalomaanisha makao ya wafu; kwa maana mahususi zaidi linaweza pia kutafsiriwa “kaburi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיאָה יִבְרָא
  choice: ataumba jambo jipya
  rationale: Kirai hiki cha Kiswahili kinadumisha kitenzi ‘umba’ na kueleza kwa lugha ya kawaida tendo jipya na lisilo la kawaida la Mungu. Tanbihi inahifadhi msisitizo wa Kiebrania unaotokana na nomino na kitenzi vya mzizi mmoja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa na cheo.
- source_word: וּפָצְתָה הָאֲדָמָה אֶת־פִּיהָ
  choice: ardhi ifungue kinywa chake
  rationale: ‘Ardhi’ inafaa kwa udongo ulio chini yao, na taswira ya kufungua kinywa imehifadhiwa.
- source_word: וּבָלְעָה
  choice: kuwameza
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya tendo la ardhi kuwafunika kabisa.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: vyote walivyo navyo
  rationale: Inahifadhi upeo mpana wa mali na chochote kilicho chao bila kuainisha zaidi ya maandishi.
- source_word: וְיָרְדוּ חַיִּים שְׁאֹלָה
  choice: washuke wakiwa hai mpaka Sheoli
  rationale: ‘Wakiwa hai’ inadumisha msisitizo kwamba wanashuka kabla ya kufa, huku ‘Sheoli’ ikihifadhi upana wa neno la Kiebrania.
- source_word: וִידַעְתֶּם
  choice: ndipo mtakapojua
  rationale: Muundo huu unaonyesha matokeo ya sharti kwa Kiswahili cha asili.
- source_word: נִאֲצוּ
  choice: wamemdharau
  rationale: Kitenzi hiki kinaonyesha dharau kali inayomwelekea Yahwe.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: watu hawa
  rationale: Katika muktadha huu, ‘watu hawa’ ni Kiswahili cha kawaida kinachowarejelea wanaume waliotajwa bila kuleta maana isiyokusudiwa ya jinsia tofauti.
theological_decisions:
- issue: Tafsiri ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; makao ya wafu
  rationale: Utohozi ‘Sheoli’ haupunguzi neno hili kuwa kaburi la mwili pekee wala kuamua kabisa hali ya makao ya wafu; tanbihi inaeleza wigo wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha muundo wa sharti na taswira hai ya ardhi kufungua kinywa chake, huku ikiepuka lugha ya kimadhehebu.
