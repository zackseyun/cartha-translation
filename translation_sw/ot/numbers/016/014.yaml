  text: אַ֡ף לֹ֣א אֶל אֶרֶץ֩ זָבַ֨ת חָלָ֤ב וּ/דְבַשׁ֙ הֲבִ֣יאֹתָ֔/נוּ וַ/תִּ֨תֶּן לָ֔/נוּ נַחֲלַ֖ת שָׂדֶ֣ה וָ/כָ֑רֶם הַ/עֵינֵ֞י הָ/אֲנָשִׁ֥ים הָ/הֵ֛ם תְּנַקֵּ֖ר לֹ֥א נַעֲלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/014.yaml
  text: Indeed[a], you have not brought us into a land flowing with milk and honey, nor have you given us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come up.
translation:
  language: sw
  text: Kwa kweli, hukutuleta katika nchi itiririkayo maziwa na asali, wala hukutupa urithi wa mashamba na mizabibu. Je, utayang’oa macho ya watu hawa?[a] Hatutapanda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, utawapofusha watu hawa?” Nahau ya Kiebrania ni, neno kwa neno, “utayang’oa macho [ya watu hawa],” na huenda pia ikamaanisha kuwatendea kana kwamba hawawezi kuuona ukweli.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לֹא
  choice: Kwa kweli, huku-
  rationale: Kirai hiki kinakazia shtaka pamoja na ukanushaji; “Kwa kweli” kinaonyesha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: katika nchi inayotiririka maziwa na asali
  rationale: Inahifadhi nahau ya Kiebrania kuhusu wingi na ustawi wa nchi, huku “katika” kikionyesha kuingizwa ndani yake.
- source_word: הֲבִיאֹתָנוּ
  choice: hukutuleta
  rationale: Ingawa umbo la Kiebrania linaweza kuonekana kama swali la balagha, katika muktadha ni shtaka la wazi kwamba Musa hakuwapeleka huko.
- source_word: וַתִּתֶּן לָנוּ נַחֲלַת שָׂדֶה וָכָרֶם
  choice: wala hukutupa mashamba na mizabibu kuwa urithi wetu
  rationale: “Urithi wetu” linaonyesha mali iliyotolewa kuwa milki ya kudumu; wingi wa “mashamba na mizabibu” unawasilisha kwa Kiswahili cha kawaida maana ya majina ya umoja yenye matumizi ya kijumla.
- source_word: הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר
  choice: Je, utayang’oa macho ya watu hawa?
  rationale: Inahifadhi picha kali ya kitenzi נקר badala ya kuamua kimya kimya kwamba maana yake ni ya kitamathali tu.
- source_word: לֹא נַעֲלֶה
  choice: Hatutakuja
  rationale: Katika muktadha wa kukataa wito wa Musa, “Hatutakuja” ni Kiswahili cha asili kinachoonyesha mwendo kuelekea kwa aliyewaita; dhana ya kupanda haitiliwi mkazo na mazingira.
theological_decisions:
- issue: Iwapo kung’oa macho ni tishio halisi au shtaka la udanganyifu
  choice: Picha halisi ya maneno imehifadhiwa katika maandishi makuu.
  alternative: “Je, utawapofusha watu hawa?” au tafsiri inayosema wazi kwamba Musa anawadanganya.
  rationale: Kiebrania kina picha ya kung’oa macho, lakini katika usemi huu huenda pia kinadokeza kuwapofusha watu wasione ukweli. Tafsiri kuu haifungi uwezekano wowote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimewekwa katika mtindo wa shtaka kali wa wazungumzaji, huku taswira ya Kiebrania na uwezekano wake wa kitamathali vikihifadhiwa.
