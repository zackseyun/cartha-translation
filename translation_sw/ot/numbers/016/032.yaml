  yaml_path: translation/ot/numbers/016/032.yaml
  text: and the earth opened its mouth and swallowed them[a], their households, all the people who belonged to Korah[b], and all their possessions.
translation:
  language: sw
  text: Nayo ardhi ikafungua kinywa chake, ikawameza wao, kaya zao[a], watu wote waliokuwa wa Kora[b], na mali yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyumba zao.” Neno la Kiebrania linaweza kumaanisha majengo yenyewe au, kwa upanuzi, watu wa kaya hizo.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinaweza kutafsiriwa kihalisi zaidi, “kila mtu aliyekuwa wa Kora.” Kirai hicho kinamtaja kwa pamoja kila aliyehusishwa na Kora; kinaweza pia kueleweka kuwa wale waliokuwa pamoja naye au upande wake.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: ikafungua
  rationale: Kitenzi פתח kwa kawaida humaanisha ‘kufungua.’ Tafsiri hii haiingizi wazo la ‘kupasuka’ ambalo, ingawa linafaa katika muktadha, halijaelezwa moja kwa moja na kitenzi.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: אֶרֶץ inaweza kumaanisha dunia, nchi, au ardhi. Hapa ‘dunia’ inadumisha taswira ya kishairi ya dunia kufungua kinywa chake na kumeza.
- source_word: אֶת־פִּיהָ
  choice: kinywa chake
  rationale: Hii ndiyo maana halisi ya kirai hicho na inadumisha tashihisi yenye nguvu ya Kiebrania badala ya kuibadili kuwa ‘ufa’ au ‘uwazi.’
- source_word: וַתִּבְלַע
  choice: ikawameza
  rationale: בלע humaanisha ‘kumeza’; neno hili ni la moja kwa moja, la kawaida, na linaendeleza taswira ya kinywa.
- source_word: בָּתֵּיהֶם
  choice: familia zao
  rationale: Ingawa maana ya msingi ni ‘nyumba zao,’ בַּיִת inaweza pia kutaja watu wa nyumba au kaya. Katika simulizi hili watu ndio wanaomezwa; ‘familia zao’ huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: כָּל־הָאָדָם אֲשֶׁר לְקֹרַח
  choice: watu wote waliokuwa wa Kora
  rationale: אָדָם imetumiwa hapa kwa maana ya kijumla. ‘Watu wote’ ni Kiswahili cha kawaida kinachoonyesha mkusanyiko huo, na ‘waliokuwa wa Kora’ inadumisha kwa kadiri iwezekanavyo uhusiano mpana unaoonyeshwa na לְ bila kuufafanua kupita kiasi.
- source_word: כָּל־הָרֲכוּשׁ
  choice: mali yote
  rationale: רְכוּשׁ humaanisha mali au vitu vinavyomilikiwa. ‘Mali yote’ ni pana na ya kawaida, na haiongezi kiwakilishi cha umilikaji ambacho hakipo wazi katika Kiebrania.
theological_decisions:
- issue: Maana ya אָדָם katika kirai cha kijumla
  choice: watu wote waliokuwa wa Kora
  alternative: kila mtu aliyekuwa wa Kora
  rationale: Umoja wa kisarufi wa אָדָם pamoja na כָּל unaweza kufanya kazi kijumla. Kiswahili ‘watu wote’ kinaonyesha maana hiyo bila kudai kwamba marejeo hayo ni wanaume pekee; tanbihi inahifadhi muundo wa umoja unaowezekana.
- issue: Uhusiano unaoonyeshwa na אֲשֶׁר לְקֹרַח
  choice: waliokuwa wa Kora
  alternative: waliokuwa pamoja na Kora / waliokuwa upande wa Kora
  rationale: Kihusishi לְ kinaweza kuonyesha kuwa mali ya, kuhusishwa na, au kuwa upande wa mtu. Tafsiri kuu inadumisha upana huo badala ya kuamua ikiwa ni ufuasi, ushirika, au umilikaji wa kijamii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa leo. Taswira ya ‘dunia’ yenye ‘kinywa’ imehifadhiwa. Muundo wa ‘Nayo ... ika-’ unaunganisha mstari huu na simulizi lililotangulia bila kuongeza maelezo yasiyokuwapo katika chanzo.
