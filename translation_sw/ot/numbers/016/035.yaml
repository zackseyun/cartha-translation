base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/035.yaml
  text: And fire came out from Yahweh and consumed the two hundred and fifty men who were offering the incense[a].
translation:
  language: sw
  text: Ndipo moto ukatoka kutoka kwa Yahweh, ukawateketeza wale wanaume mia mbili na hamsini waliokuwa wakifukiza uvumba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri rasmi zaidi, “kutoka mbele ya Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵשׁ
  choice: Ndipo moto
  rationale: אֵשׁ ni ‘moto’; kiunganishi וְ kinaendeleza simulizi, na ‘Ndipo’ linaonyesha mfuatano wa tukio kwa Kiswahili cha kawaida.
- source_word: יָצְאָה
  choice: ukatoka
  rationale: Kitenzi יצא humaanisha ‘kutoka’; ‘ukatoka’ ni cha asili kwa moto unaotokea katika uwepo wa Mungu.
- source_word: מֵ/אֵת יְהוָה
  choice: kwa Yahweh
  rationale: Kirai kinaonyesha chanzo au mahali moto ulipotoka. ‘Kwa Yahweh’ ni fasaha na kinahifadhi jina la agano יְהוָה.
- source_word: וַ/תֹּאכַל
  choice: na kuwateketeza
  rationale: אכל ni ‘kula,’ lakini moto ukiwa kiima humaanisha kuteketeza kabisa; ‘kuwateketeza’ ni wazi na cha kawaida.
- source_word: הַ/חֲמִשִּׁים וּ/מָאתַיִם אִישׁ
  choice: wale wanaume mia mbili na hamsini
  rationale: Hiki ni kikundi mahususi kilichohesabiwa; mpangilio ‘mia mbili na hamsini’ ni Kiswahili sanifu.
- source_word: מַקְרִיבֵי הַ/קְּטֹרֶת
  choice: waliokuwa wakifukiza uvumba
  rationale: קרב hapa ni kuleta au kutoa uvumba katika tendo la ibada. Katika Kiswahili, ‘kufukiza uvumba’ hueleza kwa kawaida tendo la kuutoa kwa kuuchoma, huku hali endelevu ya kishiriki ikihifadhiwa na ‘waliokuwa waki-’.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya מֵאֵת יְהוָה
  choice: kwa Yahweh
  alternative: kutoka mbele za Yahweh
  rationale: Kirai cha Kiebrania kinaweza kuwakilishwa kwa namna rasmi zaidi kama ‘kutoka mbele za Yahweh,’ lakini katika muktadha huu kinaonyesha kwa kawaida chanzo cha moto; tafsiri kuu ya Kiswahili inatumia ‘kwa Yahweh’ bila kuficha uwezekano huo, ambao umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kufukiza uvumba’ ni usemi wa kawaida wa ibada; ‘kuwateketeza’ huhifadhi ukali wa hukumu bila lugha ya kizamani.
