base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/001.yaml
  text: Korah son of Izhar[a], son of Kohath, son of Levi, along with Dathan and Abiram, sons of Eliab, and On son of Peleth, sons of Reuben, took men,
translation:
  language: sw
  text: Kora mwana wa Ishari, mwana wa Kohathi, mwana wa Lawi, pamoja na Dathani na Abiramu, wana wa Eliabu, na Oni mwana wa Peleti, wana wa Reubeni, akachukua watu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akachukua.” Yambwa haijatajwa katika Kiebrania; “watu” limeongezwa kutokana na muktadha wa mstari unaofuata ili maana iwe wazi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: waliwachukua watu
  rationale: Kitenzi kwa msingi wake ni ‘alichukua,’ lakini katika Kiebrania halisi kitu kilichochukuliwa hakijatajwa. ‘Watu’ limetolewa katika muktadha wa mstari unaofuata ili sentensi ieleweke kwa Kiswahili. Wingi ‘wali-’ unawasilisha Kora na washirika waliotajwa kama wahusika wa tendo kwa mujibu wa muktadha, huku tanbihi ikihifadhi umbo halisi la Kiebrania.
- source_word: קֹרַח
  choice: Kora
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי
  choice: mwana wa Ishari, mwana wa Kohathi, mwana wa Lawi
  rationale: Mnyororo wa ukoo wenye kurudia ‘mwana wa’ umehifadhiwa ili kudumisha msisitizo na muundo wa Kiebrania.
- source_word: וְדָתָן וַאֲבִירָם בְּנֵי אֱלִיאָב
  choice: pamoja na Dathani na Abiramu, wana wa Eliabu
  rationale: ‘Pamoja na’ linaonyesha ushiriki wao katika tendo kwa Kiswahili cha kawaida; ‘wana wa Eliabu’ linahifadhi taarifa ya ukoo.
- source_word: וְאוֹן בֶּן פֶּלֶת
  choice: na Oni mwana wa Peleti
  rationale: Majina yametoholewa, na uhusiano wa mwana na baba umehifadhiwa moja kwa moja.
- source_word: בְּנֵי רְאוּבֵן
  choice: hao watatu wakiwa wazao wa Reubeni
  rationale: Kirai hiki kinawahusu Dathani, Abiramu na Oni, si Kora. ‘Hao watatu’ huzuia kukihusisha kimakosa na Kora, na ‘wazao’ linafaa kwa uhusiano mpana wa kikabila na Reubeni.
theological_decisions:
- issue: Kitenzi cha mwanzo hakina yambwa na kiko katika umoja katika Kiebrania
  choice: Kutaja yambwa inayodokezwa, ‘watu,’ na kutumia wingi kwa kundi la washiriki
  alternative: Kutafsiri kwa umbo la karibu zaidi, ‘Kora ... akachukua,’ bila kutaja alichokichukua; au kutafsiri kiufafanuzi zaidi, ‘wakaungana’
  rationale: Mstari wa 2 unataja wanaume 250, hivyo ‘watu’ linaeleza yambwa inayodokezwa bila kugeuza kitenzi kuwa tafsiri ya kiufafanuzi kama ‘wakaungana.’ Tanbihi inaweka wazi kwamba umbo la Kiebrania ni la umoja na halitaji yambwa, hivyo utata wa chanzo haujafichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Majina yametoholewa kwa maumbo yanayotambulika katika mapokeo ya Kiswahili. Alama ya mkato mrefu inasaidia kufafanua kwamba ‘wazao wa Reubeni’ ni Dathani, Abiramu na Oni pekee.
