base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/019.yaml
  text: And Korah assembled the whole congregation against them at the entrance to the tent of meeting[a], and the glory of Yahweh appeared to the whole congregation.
translation:
  language: sw
  text: Kora akalikusanya kusanyiko lote dhidi yao mlangoni mwa hema la kukutania, na utukufu wa Yahwe[a] ukaonekana kwa kusanyiko lote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa kawaida hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: akalikusanya
  rationale: Hifili ya קהל inaonyesha kwamba Kora ndiye aliyesababisha kusanyiko likusanyike; kitenzi hiki kinahifadhi jukumu lake la kuwakusanya watu.
- source_word: עֲלֵיהֶם
  choice: dhidi yao
  rationale: Katika muktadha wa uasi dhidi ya Musa na Haruni, עַל ina maana ya uhasama, si tu kukusanyika karibu nao.
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה hapa ni jamii ya Israeli iliyokusanyika kama kundi; “kusanyiko lote” ni wazi na linahifadhi כָּל.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye mlango wa hema la kukutania
  rationale: פֶּתַח ni mlango au mahali pa kuingilia, na usemi huu unaeleza mahali walipokusanyika kwa Kiswahili cha kawaida.
- source_word: וַיֵּרָא
  choice: ukalitokea
  rationale: Nifali ya ראה hapa hueleza kujidhihirisha kwa kuonekana; “ukalitokea” ni ya asili na haibainishi namna ya udhihirisho huo.
- source_word: כְבוֹד יְהוָה
  choice: utukufu wa Yahwe
  rationale: “Utukufu” huhifadhi maana ya כָּבוֹד kama udhihirisho wa uwepo wa Mungu, huku jina la agano יְהוָה likitolewa kama “Yahwe.”
- source_word: אֶל כָּל הָעֵדָה
  choice: ukalitokea kusanyiko lote
  rationale: אֶל huonyesha wale ambao udhihirisho uliwaelekea; muundo huu unahifadhi maana hiyo bila kuongeza maelezo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo; tafsiri ya kimapokeo imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Hema la kukutania” limetumiwa kama istilahi iliyozoeleka ya אֹהֶל מוֹעֵד. Alama ya tanbihi imewekwa baada ya “Yahwe,” ambako maelezo yake yanahusika moja kwa moja.
