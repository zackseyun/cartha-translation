  text: וַ/יְדַבֵּ֨ר אֶל הָ/עֵדָ֜ה לֵ/אמֹ֗ר ס֣וּרוּ נָ֡א מֵ/עַל֩ אָהֳלֵ֨י הָ/אֲנָשִׁ֤ים הָֽ/רְשָׁעִים֙ הָ/אֵ֔לֶּה וְ/אַֽל תִּגְּע֖וּ בְּ/כָל אֲשֶׁ֣ר לָ/הֶ֑ם פֶּן תִּסָּפ֖וּ בְּ/כָל חַטֹּאתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/026.yaml
  text: And he spoke to the congregation[a], saying, “Please move away from the tents of these wicked men, and do not touch anything that belongs to them, lest you be swept away in all their sins.”
translation:
  language: sw
  text: Akazungumza na kusanyiko, akisema, “Tafadhali, jiondoeni kutoka karibu na mahema ya wanaume hawa waovu, wala msiguse kitu chochote kilicho chao, msije mkafagiliwa mbali katika dhambi zao zote[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msije mkaangamizwa kwa sababu ya dhambi zao zote.” Kiebrania kinaweza kueleweka kwa maana ya kisababishi iliyo wazi zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדָה
  choice: kusanyiko
  rationale: Neno hili humaanisha jumuiya ya Israeli iliyokusanyika; “kusanyiko” linahifadhi maana ya kundi lililokusanyika bila kuleta maana mahsusi ya dhehebu.
- source_word: סוּרוּ נָא
  choice: Tafadhali, jiondoeni
  rationale: Kitenzi cha amri kinataka waondoke au wajitenge, huku נָא kikiongeza msisitizo wa ombi la haraka; “tafadhali” hakichukuliwi hapa kuwa kielezi cha wakati.
- source_word: מֵעַל אָהֳלֵי
  choice: kutoka karibu na mahema ya
  rationale: מֵעַל hapa inaelekeza watu waondoke katika eneo lililo karibu na mahema, si kutoka juu ya mahema; usemi huu unaweka wazi maana hiyo ya kimuktadha.
- source_word: הָאֲנָשִׁים הָרְשָׁעִים הָאֵלֶּה
  choice: watu hawa waovu
  rationale: Kirai kinawatambulisha wanaume maalumu waliohukumiwa kimaadili. Katika Kiswahili, “watu hawa waovu” ni usemi wa kawaida na wenye hadhi; muktadha tayari unawatambulisha wahusika hao wa kiume.
- source_word: וְאַל תִּגְּעוּ
  choice: wala msiguse
  rationale: Hii ni marufuku ya moja kwa moja ya kugusa au kuingia katika mgusano; “wala msiguse” ni fupi na ya asili.
- source_word: בְּכָל אֲשֶׁר לָהֶם
  choice: kitu chochote kilicho chao
  rationale: Usemi huu unajumuisha mali yao yote. Baada ya amri hasi, “kitu chochote kilicho chao” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: פֶּן תִּסָּפוּ
  choice: msije mkafagiliwa mbali
  rationale: Nifali ya ספה inaweza kumaanisha kuondolewa, kufagiliwa mbali, au kuangamizwa katika hukumu. Chaguo hili linahifadhi hali ya kutendwa na picha ya kunaswa katika hukumu inayokuja.
- source_word: בְּכָל חַטֹּאתָם
  choice: kwa dhambi zao zote
  rationale: Kihusishi ב kinaweza kuonyesha sababu au uhusiano/mazingira. “Kwa dhambi zao zote” ni usemi mfupi unaoruhusu maana ya hukumu inayohusiana na dhambi hizo bila kufafanua kupita kiasi aina ya uhusiano huo.
theological_decisions:
- issue: Kushirikishwa katika hukumu kwa sababu ya kuwa karibu na waovu
  choice: Onyo linawataka watu wajitenge na waovu na mali zao ili wasifagiliwe mbali katika hukumu inayohusiana na dhambi za waovu hao.
  alternative: 'Kifungu cha mwisho kinaweza kusemwa kwa maana ya sababu iliyo wazi zaidi: “msije mkaangamizwa kwa sababu ya dhambi zao zote.”'
  rationale: Kiebrania kinaunganisha hatari ya watu na ukaribu wao kwa waasi pamoja na hukumu inayokuja. Tafsiri haidai kwamba hatia yao imehesabiwa moja kwa moja kwa wengine, wala haipunguzi onyo hilo kuwa kauli ya sababu tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Jiondoeni kutoka karibu na” linaeleza mwendo wa kuondoka katika eneo la mahema; “mkafagiliwa mbali” linahifadhi picha ya hukumu ya ghafla. Alama ya tanbihi imewekwa kwenye kifungu inachokifafanua.
