revisions:
- from: Je, ni jambo dogo kwamba umetupandisha kutoka katika nchi inayotiririka maziwa na asali[a] ili kutuua nyikani, hata pia ujifanye mtawala juu yetu?[b]
  to: Je, ni jambo dogo kwamba umetupandisha kutoka katika nchi yenye maziwa na asali tele[a] ili kutuua nyikani, na kwamba zaidi ya hayo unataka kabisa kujifanya mtawala juu yetu?[b]
  rationale: The revision keeps the Hebrew rhetorical force and irony while using natural modern Swahili. It replaces the redundant additive wording, reflects the emphatic Hebrew form in the accusation of rule, and removes the unwarranted “kwa mabavu” from the alternative footnote.
