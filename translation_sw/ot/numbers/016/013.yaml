  text: הַ/מְעַ֗ט כִּ֤י הֶֽעֱלִיתָ֨/נוּ֙ מֵ/אֶ֨רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ לַ/הֲמִיתֵ֖/נוּ בַּ/מִּדְבָּ֑ר כִּֽי תִשְׂתָּרֵ֥ר עָלֵ֖י/נוּ גַּם הִשְׂתָּרֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/013.yaml
  text: Is it a small thing that you have brought us up out of a land flowing with milk and honey to kill us in the wilderness[b][a], that you should also make yourself a ruler over us?
translation:
  language: sw
  text: Je, ni jambo dogo kwamba umetupandisha kutoka katika nchi yenye maziwa na asali tele[a] ili kutuua nyikani, na kwamba zaidi ya hayo unataka kabisa kujifanya mtawala juu yetu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wasemaji wanaitaja Misri kwa kejeli kuwa “nchi yenye maziwa na asali tele,” usemi unaotumiwa mahali pengine kuhusu nchi ya ahadi.
    reason: cultural_note
  - marker: b
    text: Au, “kujifanya bwana juu yetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: Je, ni jambo dogo
  rationale: Huhifadhi muundo wa swali la balagha linaloonyesha hasira na lawama, huku likieleweka kwa Kiswahili cha kawaida.
- source_word: הֶעֱלִיתָנוּ
  choice: umetupandisha
  rationale: Hifili ya עלה ina maana ya kusababisha kupanda au kuleta juu. Tafsiri hii huhifadhi lugha ya mwendo inayohusishwa na kutoka Misri pamoja na kejeli ya wasemaji.
- source_word: מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: kutoka katika nchi inayotiririka maziwa na asali
  rationale: Huhifadhi nahau ya Kiebrania ya utele na matumizi yake ya kejeli hapa, ambapo waasi wanaielezea Misri kwa maneno yanayotumiwa kwa kawaida kuhusu nchi ya ahadi.
- source_word: לַהֲמִיתֵנוּ
  choice: ili kutuua
  rationale: Huwakilisha moja kwa moja kauli ya kusudi na nguvu ya shtaka lao.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: Ni tafsiri ya kawaida na ya asili ya מִדְבָּר katika muktadha wa safari ya Israeli, bila kudokeza lazima jangwa la mchanga pekee.
- source_word: תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  choice: ujifanye mtawala juu yetu
  rationale: Kitenzi kinaeleza kujitwalia au kutumia mamlaka ya kutawala. Muundo huu huhifadhi shtaka la kujikweza, huku wazo la msisitizo katika urudiaji wa Kiebrania likisaidiwa na muktadha wa swali la hasira.
- source_word: גַּם
  choice: hata pia
  rationale: Huonyesha kwamba shtaka la kujifanya mtawala linaongezwa juu ya shtaka la kuwaongoza wafe nyikani.
theological_decisions:
- issue: Kuitaja Misri kwa kejeli kuwa nchi inayotiririka maziwa na asali
  choice: Kuhifadhi maneno hayo moja kwa moja katika maandishi makuu
  alternative: Kuongeza wazi kwamba wanasema kwa kejeli
  rationale: Kejeli inatokana na muktadha wa Kiebrania wenyewe. Kuieleza wazi ndani ya mstari kungeondoa mvutano wa usemi na kuongeza ufafanuzi usiokuwamo katika maneno ya asili.
- issue: Shtaka la Musa kujitwalia utawala
  choice: ujifanye mtawala juu yetu
  alternative: ututawale kwa mabavu
  rationale: Chaguo kuu huhifadhi wazo la kujifanya au kujiweka kuwa mtawala bila kuamua kwamba namna ya utawala ilikuwa ya mabavu, ingawa maana hiyo inaweza kudokezwa na shtaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha na kejeli ya wasemaji zimehifadhiwa bila kuzifafanua kupita kiasi katika maandishi makuu.
