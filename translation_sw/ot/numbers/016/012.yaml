  yaml_path: translation/ot/numbers/016/012.yaml
  text: Then Moses sent to summon Dathan and Abiram[a], the sons of Eliab, but they said, “We will not come up.”
translation:
  language: sw
  text: Kisha Musa akatuma kuwaita Dathani na Abiramu, wana wa Eliabu, lakini wakasema, “Hatutapanda[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Hatutakwenda juu.” Kitenzi cha Kiebrania kinamaanisha kihalisi “kupanda/kwenda juu,” na huenda kinarejelea kwenda mahali Musa alipokuwa au kufika mbele yake walipoitwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma watu
  rationale: Kitenzi kinamaanisha kuwa Musa alianzisha mwito kwa kutuma wajumbe; Kiswahili cha kawaida huhitaji kueleza watu waliotumwa bila kubainisha zaidi walikuwa nani.
- source_word: לִקְרֹא
  choice: kuwaita
  rationale: Katika muundo huu, קרא ina maana ya kuwaita watu waje mbele yake. ‘Kuwaita’ ni ya asili na inaeleweka katika Kiswahili, huku muktadha ukionyesha uzito wa mwito huo.
- source_word: דָתָן וַאֲבִירָם
  choice: Dathani na Abiramu
  rationale: Majina yametoholewa kwa maumbo yaliyozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: בְּנֵי אֱלִיאָב
  choice: wana wa Eliabu
  rationale: Hili linahifadhi moja kwa moja utambulisho wa kifamilia wa Dathani na Abiramu.
- source_word: וַיֹּאמְרוּ
  choice: lakini wakasema
  rationale: Ingawa kiunganishi cha Kiebrania kimsingi ni ‘na’, hapa jibu lao linapingana na mwito wa Musa; ‘lakini’ huonyesha uhusiano huo wa kimuktadha kwa njia ya asili.
- source_word: לֹא נַעֲלֶה
  choice: Hatutapanda
  rationale: עלה humaanisha kihalisi kupanda au kwenda juu. Kauli ya wakati ujao hapa ina nguvu ya kukataa kutii mwito, na ‘Hatutapanda’ huhifadhi picha na utata wa mwelekeo uliomo katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akatuma watu kuwaita’ ni usemi wa kawaida unaowasilisha njia ya mwito bila kumtaja mjumbe ambaye maandishi hayamtaji. ‘Hatutapanda’ limehifadhiwa ili kutofuta kwa kimya utata halisi wa kitenzi cha Kiebrania; tanbihi inaeleza maana nyingine inayowezekana.
