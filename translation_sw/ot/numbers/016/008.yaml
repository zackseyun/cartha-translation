  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל קֹ֑רַח שִׁמְעוּ נָ֖א בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/008.yaml
  text: Then Moses said to Korah[a], “Hear now, you sons of Levi.”
translation:
  language: sw
  text: Kisha Musa akamwambia Kora, “Sikilizeni sasa, enyi wana wa Lawi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Mfululizo wa simulizi unaendelezwa kwa Kiswahili cha kawaida kwa “Kisha”; kiambishi cha yambwa katika “akamwambia” kinamtaja Kora kama anayeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Jina hili limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: אֶל־קֹרַח
  choice: akamwambia Kora
  rationale: אֶל humtambulisha anayeelekezewa usemi; Kiswahili cha asili hutumia kitenzi “kumwambia” badala ya muundo mzito wa “alisema kwa Kora.”
- source_word: שִׁמְעוּ
  choice: Sikilizeni
  rationale: Amri ya wingi ya שׁמע hapa ni mwito wa kutega sikio na kuzingatia maneno; “Sikilizeni” ni ya sasa, yenye nguvu, na ya kawaida kuliko “Sikieni” katika muktadha huu.
- source_word: נָא
  choice: sasa
  rationale: Chembe hii huongeza msisitizo au himizo katika amri; “sasa” huhifadhi uzito wa mwito bila kuufanya usikike kama ombi la adabu tu.
- source_word: בְּנֵי לֵוִי
  choice: enyi wana wa Lawi
  rationale: Muundo halisi ni “wana wa Lawi,” ukiwahusu wanaume wa ukoo wa Lawi katika muktadha. “Enyi” huonyesha wazi mwito wa moja kwa moja kwa kundi hilo.
theological_decisions:
- issue: Neno la ukoo lenye jinsia katika mwito wa moja kwa moja
  choice: enyi wana wa Lawi
  alternative: enyi Walawi
  rationale: Kiebrania kinasema kihalisi “wana wa Lawi” kwa umbo la kiume la wingi. Tafsiri imelihifadhi badala ya kulifanya jina la jumla “Walawi,” huku ikibaki ya kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Sikilizeni sasa” huhifadhi himizo la usemi mkali wa Musa; “wana wa Lawi” huhifadhi taswira ya ukoo katika chanzo.
