base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/004.yaml
  text: When Moses heard it[a], he fell on his face.
translation:
  language: sw
  text: Musa aliposikia hayo, akaanguka kifudifudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “akaanguka juu ya uso wake”; yaani, akalala kifudifudi au akajisujudu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: aliposikia hayo
  rationale: Kitenzi שׁמע hapa kinamaanisha ‘kusikia.’ Neno ‘hayo’ linaonyesha kwa njia ya kawaida maneno yaliyotangulia katika muktadha bila kuongeza tafsiri mpya.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: וַיִּפֹּל
  choice: akaanguka
  rationale: Kitenzi נפל kimsingi ni ‘kuanguka.’ Tafsiri hii inadumisha tendo halisi la Kiebrania, huku ‘kifudifudi’ ikieleza mkao.
- source_word: עַל פָּנָיו
  choice: kifudifudi
  rationale: Hii ni nahau ya kawaida ya Kiswahili inayoeleza kuanguka uso ukielekea chini. Inabeba picha ya mkao wa Kiebrania bila kuamua ikiwa tendo hilo lilionyesha sala, huzuni, unyenyekevu, au maombezi.
theological_decisions:
- issue: Maana mahsusi ya mkao wa Musa
  choice: 'Kueleza tendo lenyewe tu: ‘akaanguka kifudifudi.’'
  alternative: ‘akajitupa chini ili kuomba’ au ‘akaanguka kifudifudi kwa huzuni’
  rationale: Kiebrania kinataja tendo lakini hakielezi wazi kusudi au hisia zake. Tafsiri haipaswi kuamua kwamba ilikuwa sala, mshtuko, huzuni, unyenyekevu, au maombezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kifudifudi’ ni neno la kawaida na wazi kwa mkao huu; tanbihi inadumisha pia umbo halisi la nahau ya Kiebrania.
