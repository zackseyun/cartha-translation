  text: וּ/קְח֣וּ אִ֣ישׁ מַחְתָּת֗/וֹ וּ/נְתַתֶּ֤ם עֲלֵי/הֶם֙ קְטֹ֔רֶת וְ/הִקְרַבְתֶּ֞ם לִ/פְנֵ֤י יְהוָה֙ אִ֣ישׁ מַחְתָּת֔/וֹ חֲמִשִּׁ֥ים וּ/מָאתַ֖יִם מַחְתֹּ֑ת וְ/אַתָּ֥ה וְ/אַהֲרֹ֖ן אִ֥ישׁ מַחְתָּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/017.yaml
  text: And let each man take his firepan[a], and put incense on them, and bring before Yahweh each man his firepan—two hundred and fifty firepans—and you and Aaron[b], each his firepan.
translation:
  language: sw
  text: Kila mtu na achukue chetezo chake[a], aweke uvumba juu yake, na alete mbele za Yahwe chetezo chake—vyetezo mia mbili hamsini—na wewe na Aroni pia, kila mmoja chetezo chake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Chetezo ni chombo kinachotumiwa kubeba makaa na kufukizia uvumba; pia kinaweza kuitwa kifukizio cha uvumba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ אִישׁ
  choice: Kila mtu na achukue
  rationale: Amri ya wingi inaelekezwa kwa kundi, huku אִישׁ ikigawa tendo kwa kila mwanamume mmoja mmoja. Muundo huu wa Kiswahili unaonyesha amri hiyo ya mgawanyo kwa njia ya kawaida na yenye heshima.
- source_word: מַחְתָּתוֹ / מַחְתֹּת
  choice: chetezo chake / vyetezo
  rationale: מַחְתָּה ni chombo cha kubebea makaa na kufukizia uvumba. “Chetezo” ni neno la Kiswahili linalofaa katika mazingira ya ibada; tanbihi inaeleza matumizi yake.
- source_word: וּנְתַתֶּם עֲלֵיהֶם קְטֹרֶת
  choice: aweke uvumba juu yake
  rationale: Huhifadhi kihusishi עַל, “juu ya,” ambacho kinaelekea kumaanisha kuweka uvumba juu ya makaa yaliyomo katika chetezo.
- source_word: וְהִקְרַבְתֶּם לִפְנֵי יְהוָה
  choice: kisha ... akilete ... mbele za Yahwe
  rationale: Hifili ya קרב ina wazo la kuleta karibu au kuwasilisha katika mazingira ya ibada. “Akilete mbele za” ni Kiswahili cha kawaida kinachohifadhi maana ya kuingia katika uwepo wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika maandishi ya Kiebrania limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: חֲמִשִּׁים וּמָאתַיִם מַחְתֹּת
  choice: jumla ya vyetezo mia mbili na hamsini
  rationale: Neno “jumla” linaweka wazi kuwa idadi hii inarejelea vyetezo vya watu mia mbili na hamsini waliotajwa, bila kubadili idadi ya Kiebrania.
- source_word: וְאַתָּה וְאַהֲרֹן אִישׁ מַחְתָּתוֹ
  choice: Wewe na Aroni pia, kila mmoja na chetezo chake
  rationale: 'Huhifadhi muundo mfupi usio na kitenzi na maana ya mgawanyo: Musa na Aroni nao kila mmoja awe na chetezo chake.'
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina maalumu la Mungu, si cheo. “Yahwe” hulihifadhi kama jina na linafuata tahajia inayosomeka kwa kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umegawanywa katika sentensi mbili ili agizo refu lisomeke kwa urahisi, huku marudio na mgawanyo wa Kiebrania vikihifadhiwa. Alama ya tanbihi [a] imewekwa baada ya kutajwa kwa kwanza kwa chetezo.
