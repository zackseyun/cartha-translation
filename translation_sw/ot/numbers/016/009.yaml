base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/009.yaml
  text: Is it too small a thing for you that the God of Israel has separated you from the congregation of Israel[a], to bring you near to himself, to serve in the service of the tabernacle of Yahweh, and to stand before the congregation to minister to them?
translation:
  language: sw
  text: Je, ni jambo dogo kwenu kwamba Mungu wa Israeli amewatenga kutoka katika kusanyiko la Israeli[a], ili awalete karibu naye, ili mhudumu katika huduma ya Maskani ya Yahweh, na msimame mbele ya kusanyiko ili kuwahudumia?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, haitoshi kwenu kwamba Mungu wa Israeli amewatenga kutoka katika kusanyiko la Israeli...?” Nahau ya Kiebrania inaweza kueleweka kama kuuliza ikiwa jambo hilo ni dogo au ikiwa halitoshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: Je, mnaona kuwa ni jambo dogo
  rationale: 'Huhifadhi nguvu ya swali la kukemea: Walawi hawakupaswa kuiona fursa waliyopewa kuwa ndogo au isiyotosha.'
- source_word: כִּי
  choice: kwamba
  rationale: Hutambulisha yaliyomo katika swali la balagha badala ya kutoa sababu ya moja kwa moja.
- source_word: הִבְדִּיל
  choice: amewatenga
  rationale: Hutoa maana ya kusababisha mtengano kutoka kwa kusanyiko lote, bila kuongeza maana nyingine isiyo lazima.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: kusanyiko la Israeli
  rationale: Kusanyiko hueleza jamii ya Israeli iliyokusanyika na linafaa katika muktadha huu wa ibada.
- source_word: לְהַקְרִיב אֶתְכֶם אֵלָיו
  choice: ili awalete karibu naye
  rationale: Huhifadhi maana ya kukaribishwa katika nafasi ya huduma ya ibada bila kuwafanya Walawi waonekane moja kwa moja kama dhabihu.
- source_word: לַעֲבֹד אֶת עֲבֹדַת מִשְׁכַּן יְהוָה
  choice: mfanye kazi ya Maskani ya Yahweh
  rationale: Kiswahili cha asili hakihitaji kurudia mzizi kama Kiebrania; usemi huu unaeleza wazi huduma au kazi rasmi ya Maskani.
- source_word: מִשְׁכַּן יְהוָה
  choice: Maskani ya Yahweh
  rationale: Maskani ni neno linaloeleweka kwa mahali patakatifu pa jangwani na pia huhifadhi wazo la mahali pa kukaa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika maandishi limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: וְלַעֲמֹד לִפְנֵי הָעֵדָה
  choice: na kusimama mbele ya kusanyiko
  rationale: Huhifadhi picha ya nafasi rasmi ya huduma mbele ya watu waliokusanyika.
- source_word: לְשָׁרְתָם
  choice: ili kuwahudumia
  rationale: Hueleza huduma kwa kusanyiko katika wajibu rasmi na wa kidini.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; Yahweh hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Walawi kuletwa karibu na Mungu
  choice: awalete karibu naye
  alternative: awasongeze kwake
  rationale: Usemi huu huhifadhi maana ya ukaribu wa kiibada na wa kihuduma bila kuamua kwamba Walawi wenyewe wanawasilishwa kama dhabihu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha limehifadhiwa, na kiwakilishi cha wingi kinaonyesha kwamba Musa anawahutubia kundi.
