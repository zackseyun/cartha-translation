  text: Speak to the congregation, saying, ‘Go up from around the dwelling of Korah, Dathan, and Abiram.’
translation:
  language: sw
  text: '“Liambie kusanyiko hivi: ‘Ondokeni[a] kutoka eneo linalozunguka makao ya Kora, Dathani, na Abiramu.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya msingi, “pandeni” au “kwendeni juu.” Katika muktadha huu, agizo linawahimiza waondoke eneo hilo.
    reason: Kuhifadhi maana ya msingi ya הֵעָלוּ bila kulazimisha tafsiri ya kijiografia isiyo wazi katika muktadha.
lexical_decisions:
- source_word: הָעֵדָה
  choice: kusanyiko
  rationale: Neno hili linamaanisha jumuiya ya Israeli iliyokusanyika; “kusanyiko” ni la kawaida na lenye heshima katika Kiswahili sanifu.
- source_word: הֵעָלוּ
  choice: jiondoeni
  rationale: Kitenzi hiki kwa msingi wake kina wazo la kupanda au kwenda juu, lakini hapa kinatumika kama agizo la kuondoka mahali walipo karibu na makao hayo. “Jiondoeni” huwasilisha nguvu ya agizo hilo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi maana yake ya karibu zaidi na neno kwa neno.
- source_word: מִסָּבִיב לְמִשְׁכַּן
  choice: kutoka kandokando ya makao
  rationale: Kirai hiki kinaelekeza watu waondoke eneo linalozunguka makao. “Makao” huhifadhi maana pana ya מִשְׁכָּן bila kulazimisha kuwa ni hema pekee.
- source_word: קֹרַח דָּתָן וַאֲבִירָם
  choice: Kora, Dathani na Abiramu
  rationale: Majina yametolewa kwa tahajia zilizozoeleka katika mapokeo ya Biblia ya Kiswahili.
theological_decisions:
- issue: Maana ya agizo הֵעָלוּ
  choice: Jiondoeni
  alternative: Pandeni/ondokeni juu
  rationale: Muktadha unaonyesha agizo la kujitenga na eneo la waasi kabla ya hukumu, lakini tanbihi inaacha wazi taswira halisi ya kupanda au kwenda juu badala ya kuifuta.
- issue: Umoja wa מִשְׁכַּן pamoja na majina matatu
  choice: makao ya Kora, Dathani na Abiramu
  alternative: mahema ya Kora, Dathani na Abiramu
  rationale: Chanzo kina nomino ya umoja, hivyo tafsiri haiibadili kuwa wingi wala kuamua kama inarejelea hema moja, eneo la makao, au makao yanayohusishwa nao kwa pamoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa moja kwa moja na wa heshima. “Sema na kusanyiko, uwaambie” huhifadhi muundo wa Kiebrania wa kutoa ujumbe, na “kandokando” huonyesha eneo linalozunguka makao.
