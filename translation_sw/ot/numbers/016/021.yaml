base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/021.yaml
  text: Separate yourselves from the midst of this congregation[b][a], that I may consume them in an instant.
translation:
  language: sw
  text: Jitengeni kutoka katikati ya kusanyiko hili[a], ili niwaangamize mara moja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jumuiya hii.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa ghafula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבָּדְלוּ
  choice: Jitengeni
  rationale: Kitenzi hiki ni amri ya wingi yenye maana ya wahusika wenyewe kujiondoa na kuwa mbali na kundi. “Jitengeni” ni Kiswahili cha kawaida kinachohifadhi nguvu ya amri hiyo.
- source_word: מִתּוֹךְ
  choice: kutoka katikati ya
  rationale: Kirai hiki kinaonyesha kujitenga na mahali ndani ya kundi. “Kutoka katikati ya” kinahifadhi wazi maana hiyo ya kimahali.
- source_word: הָעֵדָה הַזֹּאת
  choice: kusanyiko hili
  rationale: עֵדָה hapa ni jamii iliyokusanyika. “Kusanyiko” linafaa katika muktadha huu wa Pentateuki na ni neno linaloeleweka kwa wasomaji wa sasa.
- source_word: וַאֲכַלֶּה
  choice: ili niwaangamize
  rationale: Katika muktadha huu כלה lina maana kali ya kuwakomesha kabisa au kuwaangamiza. Muundo “ili niwaangamize” unahifadhi kusudi/nia inayofuata amri bila kupunguza uzito wa hukumu.
- source_word: אֹתָם
  choice: niwa-
  rationale: Kiambishi cha yambwa “-wa-” kinawarejelea watu wa kusanyiko wanaotajwa kuwa walengwa wa hukumu.
- source_word: כְּרָגַע
  choice: mara moja
  rationale: רֶגַע huonyesha muda mfupi sana; “mara moja” linaeleza kwa Kiswahili cha kawaida kasi na ghafula ya tendo lililotangazwa.
theological_decisions:
- issue: Hali na ukali wa tangazo la hukumu ya Mungu
  choice: Kutafsiri kama nia halisi ya kuwaangamiza watu wa kusanyiko kwa haraka.
  alternative: Kulainisha kwa kusema “nishughulike nao” au “niwaondoe.”
  rationale: Katika muktadha huu כלה lina nguvu ya hukumu kali. Tafsiri inapaswa kuhifadhi ukali wa tangazo bila kulipunguza wala kutatua mvutano wa kiteolojia unaobaki katika simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi inahifadhi amri ya wingi, wazo la kutoka ndani ya kundi, na ukali wa hukumu iliyotangazwa.
