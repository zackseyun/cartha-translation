  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vitenzi vya mfululizo umehifadhiwa kwa kutumia “aka-/waka-,” na maana halisi ya “nyuma yake” imeachwa wazi huku mbadala wa kimaanisho ukiwekwa katika tanbihi.
