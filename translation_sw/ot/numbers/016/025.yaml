  yaml_path: translation/ot/numbers/016/025.yaml
  text: Then Moses rose and went to Dathan and Abiram[a], and the elders of Israel went after him.
translation:
  language: sw
  text: Kisha Musa akainuka, akaenda kwa Dathani na Abiramu, na wazee wa Israeli wakaenda nyuma yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazee wa Israeli wakamfuata.” Kwa ukaribu zaidi, Kiebrania husema “wakaenda nyuma yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום katika mfululizo wa simulizi kinaonyesha Musa aliinuka ili achukue hatua; “akainuka” ni cha kawaida na hakiongezi namna ya kuinuka.
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: הלך hapa huonyesha kwenda kwa watu waliotajwa; “akaenda” ni tafsiri ya kawaida isiyobainisha isivyohitajika kwamba alitembea kwa miguu.
- source_word: אֶל
  choice: kwa
  rationale: Katika muktadha wa kwenda kuwaendea watu, “kwa” ni Kiswahili cha kawaida kinachoonyesha mahali walipo au kuelekea kwao.
- source_word: דָּתָן וַאֲבִירָם
  choice: Dathani na Abiramu
  rationale: Majina yametoholewa kwa maumbo yanayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וַיֵּלְכוּ
  choice: wakaenda
  rationale: Kitenzi ni tena הלך, sasa katika wingi. “Wakaenda” huhifadhi muundo wa Kiebrania bila kuunganisha kitenzi na אַחֲרָיו kuwa “wakamfuata.”
- source_word: אַחֲרָיו
  choice: nyuma yake
  rationale: Kirai hiki kinaonyesha kwamba wazee walikwenda wakimfuata Musa; “nyuma yake” huhifadhi taswira ya mahali na pia maana ya kufuata.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: wazee wa Israeli
  rationale: Hili ni tamko la kawaida kwa viongozi au wazee wanaotambuliwa miongoni mwa Israeli, bila kulazimisha maana ya umri pekee.
- source_word: וַ
  choice: Kisha
  rationale: Waw ya mwanzo inaendeleza mfululizo wa simulizi; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha sasa na chenye mtiririko mzuri.
