  text: וַ/יַּקְרֵב֙ אֹֽתְ/ךָ֔ וְ/אֶת כָּל אַחֶ֥י/ךָ בְנֵי לֵוִ֖י אִתָּ֑/ךְ וּ/בִקַּשְׁתֶּ֖ם גַּם כְּהֻנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/010.yaml
  text: He has brought you near[a], and all your brothers, the sons of Levi, with you; yet you are seeking the priesthood as well.
translation:
  language: sw
  text: Amekusogeza karibu[a], wewe pamoja na ndugu zako wote, wana wa Lawi; lakini bado mnatafuta ukuhani pia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amekusogeza karibu, pamoja na ndugu zako wote, Walawi.”
    reason: Mpangilio huu mbadala huweka “Walawi” kama utambulisho wa moja kwa moja wa “ndugu zako wote,” huku ukihifadhi maana kwamba wameletwa karibu pamoja na Kora.
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: amekuleta karibu
  rationale: Kitenzi קרב katika Hifili kina maana ya kumleta mtu karibu au kumpa nafasi ya kukaribia. Hapa kinahifadhi wazo la kukaribia pamoja na hadhi ya huduma mbele za Mungu.
- source_word: אֹתְךָ
  choice: wewe
  rationale: Kiwakilishi hiki ni cha nafsi ya pili, umoja wa kiume, kikimrejelea Kora binafsi.
- source_word: וְאֶת כָּל אַחֶיךָ בְנֵי לֵוִי
  choice: pamoja na ndugu zako wote, wana wa Lawi
  rationale: Neno אַחֶיךָ ni ‘ndugu zako,’ na בְנֵי לֵוִי linawatambulisha kwa ufafanuzi kuwa wazao wa Lawi. ‘Wana wa Lawi’ hudumisha uwazi wa muundo wa Kiebrania.
- source_word: אִתָּךְ
  choice: pamoja na wewe
  rationale: Maana ya kimuktadha ni kwamba ndugu zake Walawi waliletwa karibu pamoja naye; katika sentensi ya Kiswahili wazo hili limewasilishwa kwa muundo ‘wewe pamoja na ndugu zako wote.’
- source_word: וּבִקַּשְׁתֶּם
  choice: lakini bado mnatafuta
  rationale: בקש humaanisha kutafuta au kutamani. Umbo la wingi linawahusu Kora na wenzake, na ‘lakini bado’ linaonyesha nguvu ya ukinzani katika karipio hili bila kubadili maana ya msingi.
- source_word: גַּם
  choice: pia
  rationale: 'Neno hili huonyesha nyongeza: zaidi ya nafasi waliyopewa tayari, wanatafuta kitu kingine.'
- source_word: כְּהֻנָּה
  choice: ukuhani
  rationale: ‘Ukuhani’ humaanisha hadhi au cheo cha kuwa kuhani, si huduma ya kawaida tu, na hivyo huhifadhi tofauti kati ya huduma ya Walawi na ukuhani.
theological_decisions:
- issue: Tofauti ya hadhi ya kiibada kati ya Walawi na makuhani
  choice: ukuhani
  alternative: huduma ya kikuhani
  rationale: Aya inawakemea Kora na wenzake kwa kutafuta nafasi iliyo zaidi ya huduma ya Kilawi waliyopewa. ‘Ukuhani’ huhifadhi tofauti hiyo ya kitaasisi bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Swali la mwisho limetumika kuwasilisha karipio la kimuktadha, huku wingi wa ‘mnatafuta’ ukihifadhi mabadiliko kutoka kwa Kora mmoja kwenda kwa kundi lake.
