lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: Mara tu alipomaliza kusema
  rationale: Muundo wa כְּ pamoja na kitenzi cha kumaliza unaonyesha kwamba tukio lililofuata lilitokea mara baada ya Musa kumaliza kusema; tafsiri hii ni ya asili katika Kiswahili na inahifadhi ufuatano wa haraka.
- source_word: הָאֲדָמָה אֲשֶׁר תַּחְתֵּיהֶם
  choice: ardhi iliyokuwa chini yao
  rationale: אֲדָמָה hapa ni ardhi/udongo wa mahali waliposimama, na kishazi cha uhusiano kimehifadhiwa bila kufafanua zaidi watu wanaorejelewa na kiwakilishi.
- source_word: וַתִּבָּקַע
  choice: ikapasuka
  rationale: Kitenzi cha Kiebrania ni katika hali ya kutendwa/kutokea na humaanisha kupasuka au kugawanyika; 'ikapasuka' ni wazi na ya kawaida katika simulizi.
