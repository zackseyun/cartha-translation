  text: אִם כְּ/מ֤וֹת כָּל הָֽ/אָדָם֙ יְמֻת֣וּ/ן אֵ֔לֶּה וּ/פְקֻדַּת֙ כָּל הָ֣/אָדָ֔ם יִפָּקֵ֖ד עֲלֵי/הֶ֑ם לֹ֥א יְהוָ֖ה שְׁלָחָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/029.yaml
  text: If these men die the death of all mankind[a], and the fate of all mankind is visited on them, then Yahweh has not sent me.
translation:
  language: sw
  text: Kama watu hawa watakufa kifo cha wanadamu wote, na mambo yanayowapata wanadamu wote yatawapata[a], basi Yahweh hakunituma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na hali inayowapata wanadamu wote itawapata.” Kiebrania hurudia mzizi פקד, ambao unaweza kumaanisha kutembelewa, kuagizwa, au jambo linalompata mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Huanzisha sharti ambalo Musa anatumia kuthibitisha kama ametumwa; ‘Kama’ ni ya kawaida na wazi katika Kiswahili.
- source_word: כְּמוֹת כָּל הָאָדָם יְמֻתוּן אֵלֶּה
  choice: watu hawa watakufa kama wanadamu wote
  rationale: Muundo wa Kiebrania unalinganisha kifo chao na kifo cha kawaida cha wanadamu. Kiswahili cha asili hutumia ‘watakufa kama’ badala ya kuiga moja kwa moja tamathali ya Kiebrania ‘kufa kifo cha’.
- source_word: כָּל הָאָדָם
  choice: wanadamu wote
  rationale: אָדָם limetumiwa kwa maana ya jumla ya jamii ya binadamu, si wanaume pekee.
- source_word: וּפְקֻדַּת כָּל הָאָדָם יִפָּקֵד עֲלֵיהֶם
  choice: na yale yanayowapata wanadamu wote yawapate
  rationale: Nomino na kitenzi vinavyotokana na mzizi פקד vimewakilishwa kwa kurudia ‘-pata’, huku maana pana ya jambo linalomfikia au kumpata mtu ikihifadhiwa bila kuibana kuwa adhabu tu.
- source_word: לֹא יְהוָה שְׁלָחָנִי
  choice: basi Yahweh hakunituma
  rationale: Hitimisho la sharti linaelezwa kwa ‘basi’; wakati uliopita wa Kiswahili unafaa kwa tendo la kumtuma Musa na unaendelea kuwa na umuhimu katika hoja yake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa herufi יהוה linatolewa kama jina binafsi ‘Yahweh’, si kubadilishwa kuwa cheo.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; ‘Yahweh’ huhifadhi jina binafsi lililofunuliwa kwa Israeli.
- issue: Maana ya jumla ya אָדָם
  choice: wanadamu wote
  alternative: wanaume wote
  rationale: Katika muktadha huu neno linaeleza hali ya kawaida ya binadamu kwa ujumla, si jinsia ya kiume pekee.
- issue: Maana ya פקד katika kishazi cha pili
  choice: yale yanayowapata wanadamu wote yawapate
  alternative: adhabu ya wanadamu wote iwafikie
  rationale: Mzizi unaweza kuhusisha kukaguliwa, kupangiwa, kutembelewa, au jambo kumpata mtu. Tafsiri iliyochaguliwa haiongezi kwa lazima maana mahsusi ya adhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa katika mtiririko wa kawaida wa sharti (‘Kama … basi …’). Alama ya tanbihi [a] imewekwa baada ya kishazi ambacho tanbihi inafafanua.
