lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akazungumza
  rationale: Kitenzi hiki pamoja na waw ya mfululizo kinaendeleza simulizi. “Akazungumza” hutofautisha דבר na אמר na ni Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kwa namna iliyozoeleka katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: אֶל
  choice: na
  rationale: Katika muundo wa Kiswahili “kuzungumza na” humtambulisha kwa kawaida anayeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Hili ndilo umbo la jina hili linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: וְאֶל
  choice: na
  rationale: Kiunganishi kinaunganisha Aroni na Mose kama waelekezewa wawili wa maneno; kurudia kihusishi kwa namna ya Kiebrania hakuhitajiki katika Kiswahili.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Hili ndilo umbo la jina hili linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi fomula ya Kiebrania inayotanguliza maneno yatakayofuata na kuunganisha sentensi hii na hotuba inayofuata.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa simulizi umehifadhiwa bila kuiga sintaksia ya Kiebrania isivyo kawaida katika Kiswahili.
