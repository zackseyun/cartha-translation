  text: וְ/כָל יִשְׂרָאֵ֗ל אֲשֶׁ֛ר סְבִיבֹתֵי/הֶ֖ם נָ֣סוּ לְ/קֹלָ֑/ם כִּ֣י אָֽמְר֔וּ פֶּן תִּבְלָעֵ֖/נוּ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/034.yaml
  text: And all Israel who were around them fled at their cry[a], for they said, “Lest the earth swallow us up!”
translation:
  language: sw
  text: Nao Waisraeli wote waliokuwa karibu nao wakakimbia waliposikia kilio chao[a], kwa maana walisema, “Tusije tukamezwa na ardhi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliposikia sauti yao.” Neno la Kiebrania qōl linaweza kumaanisha “sauti,” “sauti ya mtu,” au “kilio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יִשְׂרָאֵל
  choice: Nao Waisraeli wote
  rationale: Hutoa maana ya pamoja ya ‘Israeli wote’ kwa Kiswahili cha kawaida bila kupoteza rejeo la taifa.
- source_word: אֲשֶׁר סְבִיבֹתֵי/הֶם
  choice: waliokuwa karibu nao
  rationale: Ni usemi wa asili unaowatambulisha Waisraeli waliokuwa katika eneo lililowazunguka wale waliohukumiwa.
- source_word: נָסוּ
  choice: wakakimbia
  rationale: Kitenzi hiki kinaonyesha kukimbia kwa hofu na kinaendeleza simulizi kwa ufasaha.
- source_word: לְ/קֹלָם
  choice: waliposikia kilio chao
  rationale: קוֹל inaweza kumaanisha sauti, sauti ya mtu, au kilio. Katika muktadha, ‘kilio chao’ kinaeleweka kiasili, huku utata wa kile kilichosikiwa ukihifadhiwa katika tanbihi.
- source_word: כִּי אָמְרוּ
  choice: kwa maana walisema
  rationale: כִּי inatanguliza sababu ya kukimbia kwao; ‘kwa maana’ inafaa katika usimulizi wenye hadhi.
- source_word: פֶּן
  choice: Tusije
  rationale: Muundo wa ‘tusije’ huonyesha matokeo yanayohofiwa kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: תִּבְלָעֵנוּ
  choice: tukamezwa
  rationale: Hudumisha taswira halisi ya ardhi kuwameza watu, kwa muundo wa kauli ya kutendwa unaofaa katika sentensi hii.
- source_word: הָאָרֶץ
  choice: ardhi
  rationale: Katika muktadha wa ardhi kufunguka, ‘ardhi’ inaunganisha wazi tukio hili na hukumu iliyoelezwa katika mstari uliotangulia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Nao ... wakakimbia’ unadumisha mwendelezo wa simulizi; ‘Tusije’ huwasilisha hofu kwa njia ya kawaida bila kutumia usemi wa kizamani.
