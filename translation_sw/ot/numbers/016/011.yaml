  variant: Standard East African Swahili
source:
  edition: WLC
  text: לָ/כֵ֗ן אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הַ/נֹּעָדִ֖ים עַל יְהוָ֑ה וְ/אַהֲרֹ֣ן מַה ה֔וּא כִּ֥י תלונו עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/011.yaml
  text: Therefore[a], you and all your company who have assembled against Yahweh—and Aaron, what is he[c][b], that you grumble against him?
translation:
  language: sw
  text: Kwa hiyo, wewe na kusanyiko lako lote mmekusanyika dhidi ya Yahwe[a]. Naye Aroni ni nani hata mnung'unike dhidi yake?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahwe” linawakilisha jina la Mungu YHWH.
    reason: lexical_alternative
  - marker: b
    text: Au, “Na kuhusu Aroni, yeye ni nani hata mnung'unike dhidi yake?”
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Inaendeleza hitimisho la Musa kutokana na maneno yaliyotangulia na kuhifadhi maana ya sababu na matokeo.
- source_word: עֲדָתְךָ
  choice: kusanyiko lako
  rationale: Neno hili hapa linamaanisha kundi la Kora lililojikusanya; ‘kusanyiko’ ni Kiswahili cha kawaida na chenye hadhi bila kuipa sentensi maana maalumu ya kidhehebu.
- source_word: הַנֹּעָדִים
  choice: mmekusanyika
  rationale: Kauli hii inaonyesha watu waliokusanyika kwa makusudi au makubaliano; umbo la wingi linaendana na ‘wewe na kusanyiko lako lote.’
- source_word: עַל
  choice: dhidi ya
  rationale: Katika muktadha wa uasi na manung'uniko, kihusishi hiki kina maana ya upinzani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetoholewa kwa namna ya kawaida na inayosomeka kwa Kiswahili.
- source_word: וְאַהֲרֹן מַה הוּא
  choice: Naye Aroni ni nani
  rationale: Swali hili la balagha linapunguza umuhimu wa Aroni kama shabaha halisi ya uasi; ‘ni nani’ ni usemi wa asili wa Kiswahili kuhusu mtu.
- source_word: תלונו
  choice: mnung'unike
  rationale: Kitenzi hiki hutumiwa mara kwa mara katika simulizi za jangwani kwa malalamiko yenye hali ya kutoridhika na uasi; ‘nung'unika’ huhifadhi uzito huo.
- source_word: עָלָיו
  choice: dhidi yake
  rationale: Inaonyesha kuwa manung'uniko yalielekezwa kwa Aroni, ingawa kwa undani uasi wao ulikuwa dhidi ya Yahwe.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; kulitohowa kama ‘Yahwe’ huhifadhi tofauti kati ya jina hilo na cheo ‘Bwana.’
- issue: Shabaha halisi ya uasi
  choice: Kusanyiko limekusanyika dhidi ya Yahwe, kisha Aroni anatajwa katika swali la balagha.
  alternative: Kusanyiko limekusanyika dhidi ya Yahwe na Aroni kwa kiwango sawa.
  rationale: Muundo wa Kiebrania unasisitiza kwanza uasi dhidi ya Yahwe, halafu unamtaja Aroni kwa swali ‘ni nani,’ likionyesha kuwa hakuwa shabaha kuu ya uasi huo.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa urahisi. Sentensi mbili zinatoa mtiririko wa kawaida wa Kiswahili huku zikihifadhi mkazo wa Kiebrania: upinzani wao ni dhidi ya Yahwe, na umuhimu wa Aroni unapunguzwa kwa swali la balagha.'
