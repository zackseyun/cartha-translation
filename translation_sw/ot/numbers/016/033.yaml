  text: וַ/יֵּ֨רְד֜וּ הֵ֣ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֛ם חַיִּ֖ים שְׁאֹ֑לָ/ה וַ/תְּכַ֤ס עֲלֵי/הֶם֙ הָ/אָ֔רֶץ וַ/יֹּאבְד֖וּ מִ/תּ֥וֹךְ הַ/קָּהָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/033.yaml
  text: So they went down alive into Sheol—they and all that belonged to them—and the earth covered them[a], and they perished from the midst of the assembly.
translation:
  language: sw
  text: Basi wakashuka wakiwa hai ndani ya Sheoli[a]—wao pamoja na vyote vilivyokuwa vyao. Ardhi ikawafunika, nao wakaangamia kutoka katikati ya kusanyiko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “kaburini” au “katika makao ya wafu.” Kiebrania: “Sheoli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: wakashuka
  rationale: Kitenzi ירד humaanisha kushuka; “wakashuka” ni simulizi la kawaida na lenye mwendo ulio wazi katika Kiswahili.
- source_word: הֵם וְכָל אֲשֶׁר לָהֶם
  choice: wao pamoja na vyote vilivyokuwa vyao
  rationale: Kauli hii pana haijawekewa mipaka ya kumaanisha watu pekee au mali pekee, hivyo inadumisha upana wa Kiebrania.
- source_word: חַיִּים
  choice: wakiwa hai
  rationale: Husisitiza kwamba walishuka wangali wanaishi, si baada ya kufa.
- source_word: שְׁאֹלָה
  choice: ndani ya Sheoli
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyeshwa kwa “ndani ya,” huku jina Sheoli likihifadhi dhana pana kuliko kaburi moja.
- source_word: וַתְּכַס עֲלֵיהֶם הָאָרֶץ
  choice: Ardhi ikawafunika
  rationale: Tafsiri hii inahifadhi ardhi kuwa mtendaji wa kitendo na inatoa picha ya tukio kwa Kiswahili cha kawaida.
- source_word: וַיֹּאבְדוּ
  choice: wakaangamia
  rationale: אבד hapa huonyesha kuangamia au kupotea katika hukumu bila kufafanua zaidi namna ya mauti.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: kutoka katikati ya kusanyiko
  rationale: Inahifadhi wazo la kuondoka au kutoweka kutoka katikati ya kundi lililokusanyika.
theological_decisions:
- issue: Tafsiri ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; makao ya wafu
  rationale: “Sheoli” huhifadhi upana na utata wa dhana ya Kiebrania bila kuifanya kuwa kaburi moja tu wala kuingiza moja kwa moja fundisho la baadaye kuhusu jehanamu. Maana mbadala zinaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya kishazi cha kwanza ili isomeke kwa urahisi, huku alama ya mkato mrefu ikihifadhi msisitizo wa “wao pamoja na vyote vilivyokuwa vyao.”
