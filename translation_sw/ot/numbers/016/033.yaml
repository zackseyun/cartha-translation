  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu vipengele vya msingi vya Kiebrania: kushuka, hali ya kuwa hai, Sheoli yenye mwelekeo, wale pamoja na vyote vyao, ardhi kuwafunika, kuangamia, na kuondolewa kutoka katikati ya kusanyiko. Hakuna upanuzi wa kiimani usio katika chanzo.'
