base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/005.yaml
  text: And he spoke to Korah and to all his congregation[a], saying, “In the morning Yahweh will make known who is his, and who is holy, and will bring him near to himself. The one whom he chooses[b], he will bring near to himself.”
translation:
  language: sw
  text: 'Akasema na Kora na kusanyiko lake lote: “Asubuhi, Yahwe atadhihirisha[a] aliye wake na yule aliye mtakatifu, naye atamleta karibu naye. Yule ambaye Yahwe atamchagua, atamleta karibu naye.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe atajua aliye wake.” Kitenzi cha Kiebrania kwa msingi humaanisha “kujua,” lakini hapa huenda kina maana ya kuweka wazi au kuonyesha hadharani.
    reason: lexical_alternative
  - marker: b
    text: “Kumleta karibu” ni lugha ya kikuhani na kiibada, ikimaanisha kuruhusiwa kumkaribia Yahwe kwa huduma takatifu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Akasema na
  rationale: Kitenzi דבר kinaonyesha kusema au kuzungumza na mtu. “Akasema na” ni Kiswahili cha kawaida cha masimulizi na pia kinatofautisha tendo la kusema na utangulizi wa maneno yanayonukuliwa.
- source_word: עֲדָתוֹ
  choice: kusanyiko lake
  rationale: עֵדָה ni kundi au jumuiya iliyokusanyika. “Kusanyiko” linafaa hapa kwa kundi la Kora bila kulifanya liwe taasisi maalumu ya kidini.
- source_word: בֹּקֶר
  choice: Asubuhi
  rationale: Nomino hii inatumika kielezi kuonyesha wakati; “Asubuhi” ni ya asili na fupi katika Kiswahili.
- source_word: וְיֹדַע יְהוָה
  choice: Yahwe atadhihirisha
  rationale: Ingawa ידע kwa msingi ni “kujua,” katika muktadha huu tendo la Yahwe litaweka wazi hadharani ni nani aliye wake. Tanbihi inahifadhi tafsiri ya karibu zaidi na umbo la Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: אֶת אֲשֶׁר לוֹ
  choice: aliye wake
  rationale: Hii inahifadhi kwa ufupi maana ya mtu ambaye ni wa Yahwe, bila kuongeza ufafanuzi usiokuwapo katika matini.
- source_word: הַקָּדוֹשׁ
  choice: aliye mtakatifu
  rationale: Kivumishi hiki kimetumiwa kama nomino kumtaja mtu aliyetengwa kwa huduma takatifu. Tafsiri hii inahifadhi ulinganifu na “aliye wake.”
- source_word: וְהִקְרִיב אֵלָיו
  choice: naye atamleta huyo karibu yake
  rationale: Hiphil ya קרב ina maana ya kumleta au kumruhusu mtu akaribie, hasa katika mazingira ya ibada. “Huyo” huweka wazi yule anayeletwa bila kuondoa lugha ya kukaribia.
- source_word: אֲשֶׁר יִבְחַר בּוֹ
  choice: Yule atakayemchagua
  rationale: בחר ni kuchagua. Muundo huu ni wa kawaida katika Kiswahili na unaendeleza mkazo juu ya mtu anayechaguliwa na Yahwe.
- source_word: יַקְרִיב אֵלָיו
  choice: atamleta karibu yake
  rationale: Kurudia kauli hiyo kunafuata urudiaji wa Kiebrania na kusisitiza kwamba Yahwe ndiye anayeruhusu mtu kumkaribia kwa huduma takatifu.
theological_decisions:
- issue: Tafsiri ya jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini inatumia moja kwa moja jina la Mungu יהוה; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וְיֹדַע katika tangazo la asubuhi
  choice: atadhihirisha
  alternative: atajua
  rationale: “Atadhihirisha” huonyesha kuwa utambulisho wa aliye wa Yahwe utawekwa wazi, huku tanbihi ikihifadhi uwezekano wa tafsiri ya moja kwa moja “atajua.”
- issue: Lugha ya kumleta mtu karibu na Yahwe
  choice: atamleta karibu yake
  alternative: atamruhusu kumkaribia
  rationale: Tafsiri iliyochaguliwa inadumisha taswira na urudiaji wa lugha ya kikuhani bila kufafanua kupita kiasi aina ya huduma inayokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Urudiaji wa “atamleta karibu yake” umehifadhiwa kwa sababu ni wa maana katika Kiebrania. Alama za tanbihi zimewekwa kwenye vifungu vinavyoelezwa, si kwenye nafasi zisizolingana zilizoonekana katika safu ya mashauriano ya Kiingereza.
