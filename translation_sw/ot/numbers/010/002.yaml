  text: עֲשֵׂ֣ה לְ/ךָ֗ שְׁתֵּי֙ חֲצֽוֹצְרֹ֣ת כֶּ֔סֶף מִקְשָׁ֖ה תַּעֲשֶׂ֣ה אֹתָ֑/ם וְ/הָי֤וּ לְ/ךָ֙ לְ/מִקְרָ֣א הָֽ/עֵדָ֔ה וּ/לְ/מַסַּ֖ע אֶת הַֽ/מַּחֲנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/002.yaml
  text: Make for yourself two silver trumpets[a]; you shall make them of hammered work[b], and they shall be for you for summoning the congregation and for setting out the camps.
translation:
  language: sw
  text: “Jitengenezee tarumbeta mbili za fedha; uzitengeneze kwa kufuliwa kwa nyundo, nazo zitakuwa kwa ajili ya kuitisha kusanyiko na kwa kuondoka kwa kambi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: Jitengenezee
  rationale: Kitenzi hiki chenye לְךָ kinaonyesha Musa aagize au ahakikishe zimetengenezwa kwa matumizi yake; “jitengenezee” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kudai lazima azitengeneze kwa mikono yake mwenyewe.
- source_word: שְׁתֵּי חֲצֽוֹצְרֹת כֶּסֶף
  choice: tarumbeta mbili za fedha
  rationale: חֲצֹצְרָה ni tarumbeta iliyonyooka, si pembe iliyopinda; “za fedha” inaonyesha wazi nyenzo zilizotumiwa.
- source_word: מִקְשָׁה
  choice: kwa kufua fedha kwa nyundo
  rationale: Neno hili linaeleza kazi ya chuma iliyotengenezwa kwa kupigwa au kufuliwa kwa nyundo. Tafsiri hii ni wazi kwa msomaji wa kawaida na haiongezi wazo lisilo hakika la kutengenezwa kwa kipande kimoja.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: uzitengeneze
  rationale: Kauli hii inaendeleza agizo la mwanzo na kirejeleo chake ni tarumbeta; umbo la Kiswahili linaonyesha hilo kwa kawaida.
- source_word: וְהָיוּ לְךָ
  choice: nazo zitakuwa kwa ajili ya
  rationale: Kirai hiki kinaanzisha matumizi au kusudi la tarumbeta, si umiliki tu.
- source_word: לְמִקְרָא הָעֵדָה
  choice: kuwaita kusanyiko
  rationale: מִקְרָא hapa ni mwito au kuitwa pamoja, na הָעֵדָה ni jumuiya iliyokusanyika ya Israeli. “Kuwaita kusanyiko” ni fupi na ya kawaida.
- source_word: וּלְמַסַּע אֶת הַמַּחֲנוֹת
  choice: kuzipa kambi ishara ya kuondoka
  rationale: מַסַּע katika muktadha huu ni kuanza safari au kuondoka kwa kambi. Kwa kuwa tarumbeta ndizo chombo cha ishara, usemi huu unaonyesha vizuri kazi yake bila kudokeza kwamba tarumbeta zenyewe zinahamisha kambi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa urahisi. “Tarumbeta” hutofautisha chombo hiki na pembe. Muundo umewekwa wa moja kwa moja kama agizo la kiibada na kiutawala.
