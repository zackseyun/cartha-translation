  text: When you blow an alarm blast, the camps that are encamped on the east side shall set out.
translation:
  language: sw
  text: Mtakapopiga mlio wa tahadhari[a], kambi zilizopiga kambi upande wa mashariki zitaanza safari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlio wa ishara.” Neno la Kiebrania hapa linamaanisha mlio maalumu wa tarumbeta uliokuwa ishara ya kambi kuanza safari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: Mtakapopiga
  rationale: Kitenzi תקע katika muktadha wa tarumbeta humaanisha kupiga au kutoa mlio. Muundo wa wakati, “Mtakapopiga,” unaonyesha kwa Kiswahili kwa kawaida kwamba tendo hili ndilo ishara inayotangulia kuondoka kwa kambi.
- source_word: תְּרוּעָה
  choice: mlio wa tahadhari
  rationale: Neno תְּרוּעָה hapa linamaanisha mlio maalumu wa tarumbeta uliotumika kama ishara ya kambi kuondoka, si sauti ya kawaida tu. “Mlio wa tahadhari” huhifadhi dhana ya mlio bainifu wa kuashiria.
- source_word: וְנָסְעוּ
  choice: zitaanza safari
  rationale: Katika habari za kusonga kwa kambi, נסע humaanisha kuondoka mahali kilipopiga kambi na kuanza safari. Tafsiri hii ni ya asili na wazi katika Kiswahili.
- source_word: הַמַּחֲנוֹת
  choice: kambi
  rationale: Wingi wa Kiebrania unarejelea makundi ya kambi za makabila. Katika Kiswahili, “kambi” ina umbo lilelile katika umoja na wingi, na upatanisho wa “zilizopiga” na “zitaanza” unaonyesha wingi.
- source_word: הַחֹנִים
  choice: zilizopiga kambi
  rationale: Kishiriki hiki kinaeleza mahali kambi hizo zilipokuwa zimekaa. “Zilizopiga kambi” ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo.
- source_word: קֵדְמָה
  choice: upande wa mashariki
  rationale: Hapa neno linaonyesha eneo la kambi katika mpangilio wake, yaani upande wa mashariki, wala si mwendo kuelekea mashariki.
