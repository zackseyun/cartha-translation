base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/036.yaml
  text: And when it came to rest[a], he would say, “Return, O Yahweh[b], to the myriads of the thousands of Israel.”
translation:
  language: sw
  text: Kila Sanduku lilipotulia, Musa alikuwa akisema, “Ee Yahweh[a], rudi kwa makumi elfu ya maelfu ya Israeli[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina jina la Mungu יהוה (YHWH).
    reason: alternative_reading
  - marker: b
    text: Kiebrania kinasema kihalisi “makumi elfu ya maelfu ya Israeli,” usemi wa kusisitiza wingi mkubwa wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֻחֹה
  choice: Kila lilipotua
  rationale: Muundo wa kihusishi pamoja na kitenzi-jina unaanzisha kishazi cha wakati na kurejelea Sanduku lilipotulia. Neno “kila” linaonyesha tendo lililojirudia katika simulizi.
- source_word: יֹאמַר
  choice: alikuwa akisema
  rationale: 'Kauli isiyotimilika hapa inaeleweka kuwa ya mazoea: Musa alisema maneno haya kila Sanduku lilipotua.'
- source_word: שׁוּבָה
  choice: rudi
  rationale: Ni amri ya moja kwa moja kutoka mzizi שוב. “Rudi” huhifadhi ombi hilo bila kulifafanua zaidi kuwa ‘kaa’ au ‘endelea kuwa pamoja nao.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: רִבְבֹות
  choice: makumi elfu
  rationale: Neno hili kimsingi huonyesha makundi ya elfu kumi, na kwa wingi linaweza kusisitiza idadi kubwa sana.
- source_word: אַלְפֵי
  choice: ya maelfu ya
  rationale: Katika muunganiko huu maana ya idadi, ‘maelfu,’ inafaa zaidi kuliko maana inayowezekana ya koo au vikosi.
- source_word: רִבְבֹות אַלְפֵי יִשְׂרָאֵל
  choice: makumi elfu ya maelfu ya Israeli
  rationale: Tafsiri hii inadumisha mrundikano wa maneno mawili ya idadi kubwa na uzito wa kishairi wa Kiebrania, badala ya kuyafupisha kuwa ‘watu wengi sana.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Maana ya ombi שׁוּבָה
  choice: rudi kwa
  alternative: kaa pamoja na au rejea miongoni mwa
  rationale: Kiebrania kinasema kihalisi “rudi” bila kubainisha kikamilifu uhusiano wa mahali. “Rudi kwa” ni Kiswahili cha asili kinachohifadhi ombi na kutolazimisha ufafanuzi wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na mdundo wa kishairi. Kiashiria cha ngeli katika “lilipotua” kinamrejelea Sanduku kutokana na muktadha, bila kuongeza jina la Musa au Sanduku ambalo halipo wazi katika mstari huu.
