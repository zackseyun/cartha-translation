base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/018.yaml
  text: Then the banner of the camp of Reuben set out by their divisions[b][a], and over its company was Elizur son of Shedeur.
translation:
  language: sw
  text: Kisha bendera[a] ya kambi ya Reubeni ikaondoka kwa vikosi vyao[b], na Elizuri mwana wa Shedeuri alikuwa mkuu wa kikosi chake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alama.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa makundi yao yaliyopangwa”; neno la Kiebrania linaweza kuwa na maana ya vikosi au majeshi yaliyopangwa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Kisha ... ikaondoka
  rationale: Waw pamoja na נסע huendeleza simulizi na kuonyesha hatua inayofuata ya safari; “Kisha” na “ikaondoka” ni Kiswahili cha kawaida katika muktadha wa msafara.
- source_word: דֶּגֶל
  choice: bendera
  rationale: Neno hili linamaanisha bendera au alama ya kikundi cha kikabila kilichopiga kambi na kusafiri pamoja; “bendera” ni wazi na ya sasa.
- source_word: מַחֲנֵה רְאוּבֵן
  choice: kambi ya Reubeni
  rationale: Muundo wa Kiebrania unaonyesha uhusiano wa umilikaji; tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: לְצִבְאֹתָם
  choice: kwa vikosi vyao
  rationale: צְבָאוֹת hapa huelekea kumaanisha makundi yaliyopangwa kwa utaratibu wa safari, yenye ladha ya kijeshi, bila kulazimisha maana ya majeshi yanayopigana.
- source_word: וְעַל צְבָאוֹ
  choice: na ... alikuwa mkuu wa kikosi chake
  rationale: עַל huonyesha mamlaka au usimamizi juu ya kikosi. Kiswahili huhitaji kueleza uhusiano huo kwa kawaida; “alikuwa mkuu wa” huepuka kauli ngumu ya neno kwa neno huku kikidumisha maana.
- source_word: אֱלִיצוּר
  choice: Elizuri
  rationale: Jina limetoholewa kwa tahajia inayolingana na matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: בֶּן שְׁדֵיאוּר
  choice: mwana wa Shedeuri
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa jina la baba; jina limetoholewa badala ya kutafsiriwa maana yake.
