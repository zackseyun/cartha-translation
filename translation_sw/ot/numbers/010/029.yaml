  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לְ֠/חֹבָב בֶּן רְעוּאֵ֣ל הַ/מִּדְיָנִי֮ חֹתֵ֣ן מֹשֶׁה֒ נֹסְעִ֣ים אֲנַ֗חְנוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אָמַ֣ר יְהוָ֔ה אֹת֖/וֹ אֶתֵּ֣ן לָ/כֶ֑ם לְכָ֤/ה אִתָּ֨/נוּ֙ וְ/הֵטַ֣בְנוּ לָ֔/ךְ כִּֽי יְהוָ֥ה דִּבֶּר ט֖וֹב עַל יִשְׂרָאֵֽל־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/029.yaml
  text: And Moses said to Hobab son of Reuel the Midianite[a], Moses’ father-in-law, “We are setting out for the place of which Yahweh said, ‘I will give it to you.’ Come with us, and we will do you good, for Yahweh has spoken good concerning Israel.”
translation:
  language: sw
  text: Musa akamwambia Hobabu mwana wa Reueli, Mmidiani, mkwe wa Musa[a], “Tunaondoka kwenda mahali ambapo Yahweh alisema, ‘Nitawapa mahali hapo.’ Njoo pamoja nasi, nasi tutakutendea mema, kwa maana Yahweh amesema mema kuhusu Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania חֹתֵן linaweza kumaanisha ndugu wa upande wa ndoa kwa ujumla; wengine hulielewa hapa kuwa “baba mkwe wa Musa” au ndugu mwingine wa Musa kwa njia ya ndoa.
    reason: alternative_reading
lexical_decisions:
- source_word: חֹבָב
  choice: Hobabu
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: רְעוּאֵל
  choice: Reueli
  rationale: Jina limetoholewa kwa namna ya kawaida katika Kiswahili.
- source_word: הַמִּדְיָנִי
  choice: Mmidiani
  rationale: Neno la kabila lenye kibainishi linamtambulisha Reueli au Hobabu kwa asili yake ya Midiani.
- source_word: חֹתֵן מֹשֶׁה
  choice: mkwe wa Musa
  rationale: Neno חֹתֵן linaweza kumaanisha ndugu wa upande wa ndoa, mara nyingi baba mkwe. ‘Mkwe’ huhifadhi upana wa maana bila kutatua kimabavu uhusiano hususa unaojadiliwa.
- source_word: נֹסְעִים אֲנַחְנוּ
  choice: Tunaondoka kwenda
  rationale: Muundo wa kitenzi tegemezi pamoja na kiwakilishi unaonyesha safari inayoanza au iliyo karibu kuanza; usemi huu ni wa asili katika Kiswahili.
- source_word: אֲשֶׁר אָמַר יְהוָה אֹתוֹ אֶתֵּן לָכֶם
  choice: ambapo Yahweh alisema, ‘Nitawapa’
  rationale: Kauli ya moja kwa moja imehifadhiwa. Kiambishi cha kitu katika ‘Nitawapa’ kinarejelea mahali, huku ‘-wa-’ ikionyesha kwamba walioahidiwa ni wengi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: לְכָה אִתָּנוּ
  choice: Njoo pamoja nasi
  rationale: Ni mwaliko wa kawaida na wenye hadhi unaolingana na mtazamo wa msemaji.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: nasi tutakutendea mema
  rationale: Huhifadhi maana ya kutenda kwa manufaa ya mtu bila kupanua sana usemi.
- source_word: דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: amesema mema kuhusu Israeli
  rationale: Huhifadhi kitenzi ‘amesema’ na neno ‘mema,’ badala ya kufasiri moja kwa moja kuwa ahadi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חֹתֵן מֹשֶׁה katika kutaja uhusiano wa Hobabu/Reueli na Musa
  choice: mkwe wa Musa
  alternative: baba mkwe wa Musa; ndugu wa Musa kwa njia ya ndoa
  rationale: חֹתֵן linaweza kutaja uhusiano wa upande wa ndoa na mara nyingi baba mkwe. ‘Mkwe’ katika matini kuu huhifadhi utata halisi; tanbihi inaeleza uwezekano wa maana mahususi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa mtiririko wa kawaida, huku marudio ya ‘mema’ yakihifadhi uhusiano wa kimatamshi uliomo katika Kiebrania. Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
