  text: And over the company of the tribe of the sons of Naphtali was Ahira son of Enan[a].
translation:
  language: sw
  text: Na mkuu wa kikosi[a] cha kabila la wana wa Naftali alikuwa Ahira, mwana wa Enani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jeshi,” “kikundi cha kijeshi,” au “tarafa.” Neno la Kiebrania צְבָא hapa linamaanisha kikundi cha kabila kilichopangwa katika utaratibu wa kupiga kambi na kusafiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Na mkuu wa ... alikuwa
  rationale: Kirai hiki kinaunganisha sentensi na orodha iliyotangulia na kumtaja mtu aliyewekwa juu ya kikosi. Kiswahili cha kawaida hutumia ‘mkuu wa’ badala ya tafsiri ya neno kwa neno ‘juu ya’.
- source_word: צְבָא
  choice: kikosi
  rationale: Katika mpangilio wa kambi na safari, neno hili linamaanisha kundi la kikabila lililopangwa kwa utaratibu wa kijeshi. ‘Kikosi’ ni cha asili na hakidokezi jeshi la taifa lote.
- source_word: מַטֵּה
  choice: kabila
  rationale: Hapa neno hilo linataja kitengo cha kikabila, si fimbo.
- source_word: בְּנֵי נַפְתָּלִי
  choice: wana wa Naftali
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania ‘wana wa’ ambao katika muktadha huu unawahusu wazao wa Naftali kama kabila.
- source_word: אֲחִירַע
  choice: Ahira
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: בֶּן עֵינָן
  choice: mwana wa Enani
  rationale: Huu ni usemi wa kawaida wa Kiebrania wa kutaja baba; ‘mwana wa’ ni wa asili na wazi katika Kiswahili.
