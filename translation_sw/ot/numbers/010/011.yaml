base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/011.yaml
  text: And it happened in the second year[a], in the second month, on the twentieth day of the month[b], that the cloud lifted from over the tabernacle of the testimony.
translation:
  language: sw
  text: Ikawa, katika mwaka wa pili, mwezi wa pili, siku ya ishirini ya mwezi huo, wingu likainuka[a] kutoka juu ya maskani ya ushuhuda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “likapanda.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “maskani ya ushuhuda”; pia inaweza kutafsiriwa “hema la ushuhuda.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi kiunganishi cha kisimulizi kinachoanzisha tukio linalofuata, kwa lugha fupi na yenye hadhi.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: katika mwaka wa pili
  rationale: Ni tafsiri ya moja kwa moja ya taarifa ya wakati inayohesabu mwaka.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: mwezi wa pili
  rationale: Hutoa taarifa ya mwezi kwa Kiswahili cha kawaida bila kurudia kihusishi kisichohitajika.
- source_word: בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: siku ya ishirini ya mwezi huo
  rationale: Nahau ya Kiebrania, kihalisi ‘ishirini katika mwezi,’ inamaanisha siku ya ishirini; ‘huo’ huirejelea wazi mwezi uliotajwa.
- source_word: נַעֲלָה
  choice: likainuka
  rationale: Kitenzi עלה kinaonyesha mwendo wa wingu kwenda juu na kuondoka mahali lilipokuwa; ‘likainuka’ ni cha asili na hakiongezi kisababishi kisichotajwa.
- source_word: הֶעָנָן
  choice: wingu
  rationale: Nomino yenye uainisho inarejelea wingu linalojulikana katika simulizi; Kiswahili hakihitaji kibainishi tofauti hapa.
- source_word: מֵעַל
  choice: kutoka juu ya
  rationale: Huhifadhi maana ya mwendo kutoka mahali palipo juu ya maskani.
- source_word: מִשְׁכַּן
  choice: maskani
  rationale: Ni neno lililo karibu na maana ya mahali pa kukaa na ni istilahi inayofaa kwa patakatifu pa kuhamishwa jangwani.
- source_word: הָעֵדֻת
  choice: ya ushuhuda
  rationale: Huhifadhi istilahi ya ibada na mwangwi wake katika Pentateuko bila kuifasiri moja kwa moja kuwa ‘agano.’
theological_decisions:
- issue: Jina la patakatifu מִשְׁכַּן הָעֵדֻת
  choice: maskani ya ushuhuda
  alternative: hema la ushuhuda; maskani ya agano
  rationale: ‘Maskani ya ushuhuda’ hufuata maneno ya Kiebrania kwa karibu na kuhifadhi uhusiano wake na matumizi mengine ya Pentateuko. ‘Hema’ linaweza kueleweka kutokana na muundo unaohamishika, lakini מִשְׁכָּן hasa ni maskani; ‘agano’ ni ufafanuzi mpana kuliko maana ya moja kwa moja ya עֵדוּת.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa tarehe umewekwa wazi kwa msomaji wa kawaida, huku ‘Ikawa’ na ‘maskani ya ushuhuda’ zikihifadhi ladha na istilahi muhimu za simulizi la Kiebrania. Alama za tanbihi zimewekwa kwenye maneno yanayohusika, badala ya nafasi zisizolingana zilizo katika safu ya mashauriano ya Kiingereza.
