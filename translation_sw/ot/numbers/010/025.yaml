base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/025.yaml
  text: Then the banner of the camp of the sons of Dan set out[a], serving as the rear guard for all the camps by their divisions[c][b]; and over its company was Ahiezer the son of Ammishaddai.
translation:
  language: sw
  text: Kisha bendera[a] ya kambi ya wana wa Dani ikaondoka, ikiwa nyuma ya kambi zote kulingana na makundi yao[c]; na mkuu wa kikosi chake alikuwa Ahiezeri mwana wa Amishadai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alama.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania linaweza pia kutafsiriwa “majeshi” au “vikosi”; hapa linamaanisha vikundi vya makabila vilivyopangwa katika utaratibu wa safari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Kisha ... ikaondoka
  rationale: Muundo huu unasogeza simulizi mbele kwa mfuatano. “Ikaondoka” ni lugha ya kawaida kwa kikosi kuanza safari kutoka mahali kilipopiga kambi.
- source_word: דֶּגֶל
  choice: bendera
  rationale: Neno hili humaanisha bendera au alama ambayo kambi ya kabila iliifuata katika mpangilio wa safari. “Bendera” ni neno la sasa na linaloeleweka kwa urahisi.
- source_word: מַחֲנֵה
  choice: kambi
  rationale: Hili ndilo neno la kawaida na fupi kwa kundi la Israeli lililopiga kambi na kusafiri pamoja.
- source_word: בְנֵי דָן
  choice: wana wa Dani
  rationale: Inahifadhi usemi wa kifamilia wa Kiebrania, ambao hapa unawataja kwa pamoja wazao wa Dani.
- source_word: מְאַסֵּף
  choice: ikiwa kikosi cha nyuma
  rationale: Katika muktadha wa msafara, neno hili linataja kundi lililosafiri mwisho na kulinda au kukusanya waliobaki nyuma. Tafsiri hii inaeleza kazi yake bila kufanya maana ya kijeshi iwe kali kupita kiasi.
- source_word: לְכָל הַמַּחֲנֹת
  choice: cha kambi zote
  rationale: Inaonyesha kwamba kambi ya Dani ilikuwa nyuma ya mpangilio mzima wa kambi, si nyuma ya kambi moja tu.
- source_word: לְצִבְאֹתָם
  choice: kulingana na vikosi vyao
  rationale: צְבָאוֹת hapa hurejelea makundi ya kikabila yaliyopangwa kwa ajili ya kusafiri; “vikosi” huhifadhi wazo la mpangilio bila kulazimisha maana finyu ya majeshi ya vita.
- source_word: וְעַל צְבָאוֹ
  choice: na mkuu wa kikosi chake alikuwa
  rationale: Kihusishi עַל kinaonyesha mtu aliyewekwa juu ya kikosi hicho. Muundo wa Kiswahili unaitaja wazi kazi ya Ahiezeri na unasikika kwa kawaida.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: Ahiezeri mwana wa Amishadai
  rationale: Majina yametoholewa kwa matamshi ya Kiswahili, na “mwana wa” inahifadhi muundo wa kawaida wa Kiebrania wa kutaja baba.
