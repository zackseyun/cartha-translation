base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/017.yaml
  text: Then the tabernacle was taken down[a], and the sons of Gershon and the sons of Merari set out[b], carrying the tabernacle.
translation:
  language: sw
  text: Ndipo Maskani ikashushwa[a], nao wana wa Gershoni na wana wa Merari[b] wakaondoka, wakiibeba Maskani.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikaondolewa katika hali yake ya kusimamishwa.” Kitenzi cha Kiebrania kimsingi humaanisha kusababisha kitu kishuke; hapa kinahusu kuishusha Maskani ili isafirishwe.
    reason: lexical_alternative
  - marker: b
    text: Au, “Wagershoni na Wamerari.” Kiebrania kinasema “wana wa Gershoni na wana wa Merari.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, walibeba Maskani baada ya kushushwa. Kiebrania kinarudia neno “Maskani” bila kusema wazi “sehemu zake.”
    reason: cultural_note
lexical_decisions:
- source_word: וְהוּרַד
  choice: ikashushwa
  rationale: Hofali ya ירד ina maana ya kutendwa au kusababishwa kushuka. Katika muktadha huu inaonyesha kuwa Maskani iliondolewa katika hali yake ya kusimamishwa. “Ikashushwa” huhifadhi taswira ya Kiebrania bila kuongeza kwa wazi kwamba kila sehemu ilivunjwa.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: מִשְׁכָּן ni jina la kawaida la mahali patakatifu pa Israeli lililokuwa hema. “Maskani” ni neno linalotambulika katika Kiswahili cha Biblia na linadumisha uhusiano wake na wazo la mahali pa kukaa.
- source_word: וְנָסְעוּ
  choice: wakaondoka
  rationale: Katika simulizi za safari, נסע humaanisha kuvunja kambi na kuanza kusafiri. “Wakaondoka” ni Kiswahili cha sasa na cha kawaida kinachoonyesha kuanza kwa mwendo.
- source_word: בְנֵי גֵרְשׁוֹן
  choice: wana wa Gershoni
  rationale: Kiebrania kinasema kihalisi “wana wa Gershoni.” Muundo huu umehifadhiwa ili kuonyesha lugha ya ukoo ya chanzo.
- source_word: וּבְנֵי מְרָרִי
  choice: wana wa Merari
  rationale: Kama ilivyo katika kishazi kinachotangulia, tafsiri inadumisha muundo wa Kiebrania “wana wa Merari” na usambamba wake.
- source_word: נֹשְׂאֵי
  choice: wakiibeba
  rationale: Kauli ya kushiriki inaeleza walichokuwa wakifanya walipoondoka. “Wakiibeba” ni ya kawaida na inaunganisha tendo hilo wazi na Maskani.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: Chanzo kinarudia nomino ileile. Ingawa muktadha unaonyesha kuwa walibeba sehemu za Maskani baada ya kushushwa, tafsiri kuu hairuhusu maelezo hayo kuchukua nafasi ya maneno ya chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Maskani” limeandikwa kwa herufi kubwa kama jina maalumu la hema takatifu. Muundo wa ukoo “wana wa” na kurudiwa kwa “Maskani” vimehifadhiwa kwa uaminifu kwa chanzo, huku maelezo ya kimuktadha yakiwekwa katika tanbihi.
