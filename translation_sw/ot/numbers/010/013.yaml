base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/013.yaml
  text: So they set out for the first time at the command of Yahweh through Moses[a].
translation:
  language: sw
  text: Basi wakaondoka kwa mara ya kwanza kwa amri ya Yahweh kupitia Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa mkono wa Musa,” nahau inayomaanisha kupitia Musa akiwa mpatanishi au wakala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: wakaondoka
  rationale: Katika simulizi la safari, kitenzi נסע humaanisha kuvunja kambi na kuanza kusafiri. “Wakaondoka” ni Kiswahili cha kawaida kinachoonyesha kuanza safari.
- source_word: בָּרִאשֹׁנָה
  choice: kwa mara ya kwanza
  rationale: Umbo hili la kielezi linaweza kumaanisha “mwanzoni” au “kwa mara ya kwanza”; hapa linaonyesha kuondoka kwao kwa kwanza kutoka Sinai katika mpangilio wa safari.
- source_word: עַל פִּי
  choice: kwa amri ya
  rationale: Nahau hii, ambayo kihalisi ni “juu ya kinywa cha,” hapa ina maana ya kutenda kulingana na amri au maelekezo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limehamishwa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: בְּיַד מֹשֶׁה
  choice: kupitia Musa
  rationale: Nahau “kwa mkono wa Musa” huonyesha uwakala au upatanishi; “kupitia Musa” huwasilisha maana hiyo kwa Kiswahili cha sasa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu, si cheo; “Yahweh” hulihifadhi kwa uhamishaji wa sauti.
- issue: Jukumu la Musa katika kutolewa kwa amri
  choice: kupitia Musa
  alternative: kwa mkono wa Musa
  rationale: Tafsiri hii inahifadhi wazo la Musa kuwa wakala au mpatanishi wa amri bila kudokeza kwamba amri ilitoka kwake mwenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Basi” huendeleza mtiririko wa simulizi; “wakaondoka” ni ya kawaida na wazi katika muktadha wa kuvunja kambi na kuanza safari.
