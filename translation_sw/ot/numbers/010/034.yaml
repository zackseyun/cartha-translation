  yaml_path: translation/ot/numbers/010/034.yaml
  text: And the cloud of Yahweh was over them by day when they set out from the camp[a].
translation:
  language: sw
  text: Na walipoondoka kutoka kambini, wingu la Yahweh lilikuwa juu yao mchana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/עֲנַן
  choice: Na wingu
  rationale: עָנָן ni ‘wingu.’ Kiunganishi וַ־ kimetafsiriwa ‘Na’ ili kudumisha uhusiano wa simulizi na mstari uliotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: עֲלֵי/הֶם
  choice: lilikuwa juu yao
  rationale: 'עַל pamoja na kiambishi cha nafsi nyingi huonyesha mahali: ‘juu yao’ au ‘likawafunika.’ ‘Juu yao’ huhifadhi maana pana ya kijiografia bila kuongeza ufafanuzi.'
- source_word: יוֹמָם
  choice: wakati wa mchana
  rationale: יוֹמָם ni kielezi chenye maana ya ‘mchana’ au ‘wakati wa mchana.’ Usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: בְּ/נָסְעָ/ם
  choice: walipoondoka
  rationale: Muundo wa kitenzi-jina cha נסע pamoja na בְּ־ una maana ya wakati, kihalisi ‘katika kuondoka kwao.’ ‘Walipoondoka’ huonyesha kuvunja kambi na kuanza safari.
- source_word: מִן הַ/מַּחֲנֶה
  choice: kambini
  rationale: מַחֲנֶה humaanisha ‘kambi.’ Kiswahili cha asili hutumia ‘kuondoka kambini’ kuwasilisha מִן, yaani kuondoka kutoka katika kambi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Mpangilio wa Kiebrania umehifadhiwa kwa kiasi kinachowezesha sentensi kusomeka kwa kawaida.
