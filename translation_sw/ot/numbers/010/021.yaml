base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/021.yaml
  text: Then the Kohathites set out[a], carrying the holy things, and the tabernacle was set up before they arrived.
translation:
  language: sw
  text: Kisha Wakohathi wakaondoka, wakiwa wamebeba vitu vitakatifu[a], nayo Maskani ilisimamishwa kabla hawajafika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “wakiwa wabebaji wa mahali patakatifu.” Hapa maneno hayo yanarejelea vyombo na vifaa vitakatifu walivyobeba Wakohathi, tofauti na muundo wa Maskani unaotajwa baadaye katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסְעוּ
  choice: Kisha ... wakaondoka
  rationale: Kiunganishi waw kinaendeleza mfuatano wa safari; “kisha” huonyesha ufuatano huo, na “wakaondoka” ni Kiswahili cha kawaida kwa kuanza hatua inayofuata ya safari.
- source_word: הַקְּהָתִים
  choice: Wakohathi
  rationale: Ni jina la ukoo uliotokana na Kohathi; “Wakohathi” ni umbo la kawaida na linaloeleweka katika Kiswahili.
- source_word: נֹשְׂאֵי הַמִּקְדָּשׁ
  choice: wakiwa wamebeba vitu vitakatifu
  rationale: Kisemantiki, maneno hayo ni “wabebaji wa mahali patakatifu,” lakini katika muktadha yanamaanisha vyombo na vifaa vitakatifu walivyobeba Wakohathi, si muundo wa Maskani wenyewe.
- source_word: הַמִּקְדָּשׁ
  choice: vitu vitakatifu
  rationale: Neno linatumika hapa kimetonimia kwa vitu vya mahali patakatifu; tafsiri hii huepuka kudokeza kwamba Wakohathi walibeba Maskani yote.
- source_word: וְהֵקִימוּ אֶת־הַמִּשְׁכָּן
  choice: nayo Maskani ilikuwa imesimamishwa
  rationale: Kitenzi cha Kiebrania kina nafsi ya tatu wingi bila kutaja wazi mtendaji. Kauli tendwa ya Kiswahili huhifadhi kutotajwa huko na huepuka kuwafanya Wakohathi kuwa ndio walioisimamisha.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi ya kibiblia iliyozoeleka kwa makao matakatifu ya Mungu ya jangwani na hutofautisha muundo huo na vitu vitakatifu vilivyobebwa.
- source_word: עַד בֹּאָם
  choice: kabla hawajafika
  rationale: Katika muktadha, Maskani ilikuwa tayari imesimamishwa kufikia wakati Wakohathi walipowasili; usemi huu unaeleza uhusiano huo wa wakati kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Mtendaji wa kuisimamisha Maskani
  choice: 'Kauli tendwa: “Maskani ilikuwa imesimamishwa”'
  alternative: “Wakaisimamisha Maskani”
  rationale: Ingawa Kiebrania kina kitenzi cha wingi katika kauli tendi, mtendaji hajatajwa wazi. Muktadha unaelekeza kwa Walawi waliotangulia, si Wakohathi. Kauli tendwa huhifadhi maana bila kuingiza utambulisho usiotajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. “Wakohathi,” “vitu vitakatifu,” na “Maskani” huweka wazi tofauti ya kimuktadha kati ya vifaa vya ibada na muundo wa hema.
