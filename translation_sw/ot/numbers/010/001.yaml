  rationale: Katika Kiswahili, “kusema na mtu” ni njia ya kawaida ya kuonyesha anayeelekezewa usemi; “kwa Musa” pia lingewezekana.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Infinitivu לאמר huanzisha maneno yanayofuata. Katika Kiswahili cha asili, kazi yake inaonyeshwa kwa alama ya nukta mbili badala ya kurudia “akisema.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kwa unukuzi wa Kiswahili bila kuamua kwamba linapaswa kubadilishwa na “BWANA” au umbo “Yehova.”
translation_notes:
