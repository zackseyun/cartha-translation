source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵ/הַ֣ר יְהוָ֔ה דֶּ֖רֶךְ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/אֲר֨וֹן בְּרִית יְהוָ֜ה נֹסֵ֣עַ לִ/פְנֵי/הֶ֗ם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים לָ/ת֥וּר לָ/הֶ֖ם מְנוּחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/033.yaml
  text: So they set out from the mountain of Yahweh for a journey of three days[a], and the ark of the covenant of Yahweh set out before them for a journey of three days[b], to seek out a resting place for them.
translation:
  language: sw
  text: Basi wakasafiri kutoka kwenye mlima wa Yahweh, mwendo wa siku tatu[a]. Nalo sanduku la agano la Yahweh lilisafiri mbele yao mwendo wa siku tatu, ili kuwatafutia[b] mahali pa kupumzikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “safari ya siku tatu”; ndivyo pia katika mara ya pili ya kirai hiki.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili kupeleleza” au “ili kutafuta kwa uchunguzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: wakasafiri
  rationale: Kitenzi נסע katika habari za kuhama kambi humaanisha kuanza safari au kuondoka. “Wakasafiri” ni Kiswahili cha kawaida kinachoendeleza mwendo wa simulizi bila kuongeza maelezo yasiyokuwamo.
- source_word: מֵהַר יְהוָה
  choice: kutoka kwenye mlima wa Yahweh
  rationale: הַר ni “mlima,” na kihusishi מִן kinaonyesha mahali walikotoka. “Kwenye” ni cha asili katika Kiswahili cha sasa kwa mahali hapa.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: mwendo wa siku tatu
  rationale: Kirai hiki huonyesha umbali au kiasi cha safari kinachohusishwa na siku tatu, si muda tu. “Mwendo wa siku tatu” kinahifadhi maana hiyo na pia urudiaji wa kirai katika Kiebrania.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: Nalo sanduku la agano la Yahweh
  rationale: 'Tafsiri hii inadumisha mnyororo wa uhusiano wa nomino: sanduku, agano, na Yahweh, bila kuubadili kuwa ufafanuzi.'
- source_word: נֹסֵעַ לִפְנֵיהֶם
  choice: lilisafiri mbele yao
  rationale: נֹסֵעַ ni umbo endelevu la kitenzi cha kusafiri, na לִפְנֵיהֶם ni “mbele yao.” Kiswahili hiki ni cha asili na hakiongezi dhana ya kijeshi au ya kupigana.
- source_word: לָתוּר לָהֶם
  choice: ili kuwatafutia
  rationale: תור inaweza kumaanisha kutafuta, kupeleleza, au kuchunguza ili kupata kitu. Katika muktadha huu lengo ni mahali pa kupumzikia, hivyo “kuwatafutia” linafaa bila kuipa kauli maana ya kijeshi.
- source_word: מְנוּחָה
  choice: mahali pa kupumzikia
  rationale: Katika muktadha wa safari, מְנוּחָה linaelekea kumaanisha mahali halisi pa kutua na kupumzika kuliko hali ya kupumzika kwa ujumla.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano, יְהוָה. “Yahweh” linahifadhi jina hilo badala ya kulibadili kuwa cheo, huku “Yehova” likibaki namna nyingine iliyozoeleka ya kulitamka.
- issue: Sanduku kusafiri mbele ya watu
  choice: lilisafiri mbele yao mwendo wa siku tatu
  alternative: liliwatangulia kwa mwendo wa siku tatu
  rationale: Tafsiri iliyochaguliwa inadumisha kauli ya Kiebrania na kutokuwazi kwake kuhusu uhusiano kamili wa nafasi na muda, bila kuamua kimya-kimya jinsi sanduku lilivyokuwa mbele yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa masimulizi ya Biblia lakini umeepuka misamiati ya kale isiyo ya lazima. Urudiaji wa “mwendo wa siku tatu” umehifadhiwa kwa kuwa umo mara mbili katika chanzo.
