  text: Na mkuu wa kikosi cha kabila la wana wa Manase alikuwa Gamalieli mwana wa Pedasuri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania צְבָא linaweza pia kutafsiriwa “jeshi,” “kundi,” au “tarafa”; hapa linamaanisha kundi la kabila lililopangwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Na mkuu wa
  rationale: Katika mtindo huu unaorudiwa wa mpangilio wa kusafiri, וְעַל humtambulisha mtu aliyewekwa juu ya kikosi. Kiswahili cha asili kinahitaji kirai cha kiuongozi badala ya tafsiri sisisi ‘na juu ya’.
- source_word: צְבָא
  choice: kikosi
  rationale: Hapa neno hili linamaanisha kundi la kikabila lililopangwa kwa ajili ya safari; ‘kikosi’ linaeleweka kwa urahisi na halilazimishi maana finyu ya mapigano.
- source_word: מַטֵּה
  choice: kabila
  rationale: Katika muktadha huu wa Hesabu, מַטֵּה ni kitengo cha kikabila, si fimbo.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: wana wa Manase
  rationale: Huhifadhi muundo wa ukoo wa Kiebrania na jina la kawaida la kabila kwa Kiswahili.
- source_word: גַּמְלִיאֵל
  choice: Gamalieli
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili iliyozoeleka katika mapokeo ya Biblia.
- source_word: בֶּן
  choice: mwana wa
  rationale: Ni kiungo cha kawaida na chenye hadhi cha kuonyesha uhusiano wa mwana na baba.
- source_word: פְּדָה צוּר
  choice: Pedasuri
  rationale: Vipashio viwili vya maandishi vinawakilisha jina moja la mtu; limetoholewa kwa tahajia ya Kiswahili.
