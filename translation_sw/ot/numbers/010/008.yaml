  yaml_path: translation/ot/numbers/010/008.yaml
  text: And the sons of Aaron[a], the priests, shall blow the trumpets; and they shall be for you a permanent statute throughout your generations.
translation:
  language: sw
  text: Wana wa Haruni, makuhani, watapiga tarumbeta; na hayo yatakuwa kwenu kuwa agizo la kudumu[a] katika vizazi vyenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “agizo la milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אַהֲרֹן
  choice: Wana wa Haruni
  rationale: Muundo huu unafuata kwa karibu maana ya kifamilia ya Kiebrania, ‘wana wa Haruni,’ kwa Kiswahili cha kawaida.
- source_word: הַכֹּהֲנִים
  choice: yaani makuhani
  rationale: Nomino hii inawatambulisha wana wa Haruni kuwa makuhani; ‘yaani’ huonyesha uhusiano huo kwa uwazi bila kubadili maana.
- source_word: יִתְקְעוּ בַּחֲצֹצְרֹת
  choice: ndio watakaopiga tarumbeta
  rationale: Kitenzi תקע kinapotumiwa pamoja na tarumbeta humaanisha kuzipiga au kuzivumisha. ‘Ndio watakaopiga’ huwasilisha wajibu wao katika muktadha wa maagizo.
- source_word: וְהָיוּ לָכֶם
  choice: nazo zitakuwa kwenu
  rationale: Kitenzi cha wingi kinaendelezwa kwa ‘nazo,’ ambacho kwa kawaida kinarejelea tarumbeta zilizotajwa mara moja kabla. Hii huhifadhi wingi wa Kiebrania badala ya kuufanya umoja.
- source_word: לְחֻקַּת עוֹלָם
  choice: agizo la kudumu
  rationale: Hili ni tamko la kisheria linaloonyesha agizo lenye kuendelea. ‘La kudumu’ ni la sasa na la kawaida, huku uwezekano wa ‘la milele’ ukihifadhiwa katika tanbihi.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu
  rationale: Huwasilisha kutumika kwa agizo hilo katika mfululizo wa vizazi vyao.
theological_decisions:
- issue: Maana ya חֻקַּת עוֹלָם
  choice: agizo la kudumu
  alternative: agizo la milele
  rationale: ‘La kudumu’ huhifadhi nguvu ya agizo linaloendelea katika maisha ya agano ya Israeli bila kuamua kimya-kimya kwamba עוֹלָם lazima imaanishe muda usio na mwisho kabisa katika kila muktadha.
- issue: Kirejeleo cha וְהָיוּ cha wingi
  choice: nazo zitakuwa, kikirejelea tarumbeta
  alternative: jambo hili litakuwa, likifupisha agizo lote
  rationale: Kiebrania kina kitenzi cha wingi, na nomino ya karibu ni ‘tarumbeta.’ Tafsiri hii huhifadhi umbo hilo ingawa kiini cha agizo kinaweza kueleweka kuwa matumizi ya tarumbeta yanayofanywa na makuhani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Tarumbeta’ limetumiwa bila kuongeza ‘za fedha,’ kwa kuwa sifa hiyo haijatajwa katika mstari huu.
