  text: And over the company of the tribe of the sons of Asher was Pagiel son of Ocran[a].
translation:
  language: sw
  text: Na mkuu wa kikosi cha kabila la wana wa Asheri alikuwa Pagieli mwana wa Okrani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jeshi,” “kitengo,” au “kundi lililopangwa” badala ya “kikosi”; neno la Kiebrania linamaanisha kundi lililopangwa katika utaratibu wa kambi ya Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Na mkuu wa
  rationale: Muundo huu unaendeleza orodha ya viongozi katika muktadha na kuwasilisha kwa Kiswahili cha kawaida maana ya mtu aliyewekwa juu ya kikosi, ingawa nomino 'mkuu' inakamilishwa kutokana na mistari inayotangulia.
- source_word: צְבָא
  choice: kikosi
  rationale: Katika mpangilio wa kambi na safari ya Israeli, neno hili linamaanisha kundi lililopangwa. 'Kikosi' huhifadhi maana hiyo bila kulazimisha maana ya jeshi linalopigana.
- source_word: מַטֵּה
  choice: kabila
  rationale: Hapa neno linataja kitengo cha kikabila, si fimbo halisi.
- source_word: בְּנֵי אָשֵׁר
  choice: wana wa Asheri
  rationale: Huhifadhi kwa karibu muundo wa Kiebrania 'wana wa Asheri' na pia hutumika kama jina la kikabila.
- source_word: פַּגְעִיאֵל
  choice: Pagieli
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: בֶּן עָכְרָן
  choice: mwana wa Okrani
  rationale: Muundo wa nasaba wa Kiebrania umetafsiriwa kwa kawaida kama 'mwana wa'; jina la baba limetoholewa badala ya kutafsiriwa.
