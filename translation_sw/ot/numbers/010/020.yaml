  text: And over the company of the tribe of the sons of Gad was Eliasaph son of Deuel[a].
translation:
  language: sw
  text: Na mkuu wa kikosi cha kabila la wana wa Gadi alikuwa Eliasafu mwana wa Deueli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jeshi” au “kundi lililopangwa” badala ya “kikosi.” Neno la Kiebrania צְבָא mara nyingi lina maana ya kijeshi, lakini hapa linarejelea kundi la kabila lililopangwa kwa utaratibu kwa ajili ya mwendo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Na mkuu wa
  rationale: Katika muundo huu unaorudiwa wa orodha ya viongozi, עַל humtambulisha aliye juu ya kikosi. Kiswahili cha asili kinahitaji kutaja wazi cheo cha uongozi badala ya tafsiri ngumu ya neno kwa neno, ‘na juu ya’.
- source_word: צְבָא
  choice: kikosi
  rationale: Neno hili linaweza kumaanisha jeshi au kundi lililopangwa. Hapa linarejelea kundi la kabila lililopangwa kwa ajili ya mwendo; ‘kikosi’ huhifadhi dhana ya mpangilio na ladha ya kijeshi bila kulifanya liwe jeshi kamili.
- source_word: מַטֵּה
  choice: kabila
  rationale: Katika muktadha huu neno linamaanisha kitengo cha kikabila, si fimbo.
- source_word: בְנֵי גָד
  choice: wana wa Gadi
  rationale: Huhifadhi muundo wa Kiebrania wa nasaba na utambulisho wa kikabila kwa Kiswahili kinachoeleweka.
- source_word: אֶלְיָסָף
  choice: Eliasafu
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: בֶּן דְּעוּאֵל
  choice: mwana wa Deueli
  rationale: Hutoa moja kwa moja muundo wa Kiebrania wa jina la baba kwa Kiswahili cha kawaida.
