lexical_decisions:
- source_word: אֵלֶּה
  choice: Hizi ndizo
  rationale: Kiashiria cha wingi kinatanguliza muhtasari wa hatua zilizotangulia; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: מַסְעֵי
  choice: hatua za safari
  rationale: Nomino hii katika muktadha wa kusafiri jangwani inaweza kumaanisha hatua za mwendo, safari, au kuondoka; 'hatua za safari' huonyesha vipindi vinavyofuatana bila kudokeza safari moja tu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi kwa ukaribu usemi wa kifamilia wa Kiebrania; 'Waisraeli' ni tafsiri mbadala ya kawaida.
- source_word: לְצִבְאֹתָם
  choice: kwa vikosi vyao
  rationale: Neno צבא hapa linaonyesha makundi yaliyopangwa kwa mwendo, yenye sura ya kijeshi, bila kulazimisha maana ya kupigana vitani.
- source_word: וַיִּסָּעוּ
  choice: nao wakaondoka
  rationale: Kitenzi נסע katika simulizi la safari huonyesha kung'oa kambi na kuanza mwendo; 'wakaondoka' ni Kiswahili cha kawaida kinachofaa muktadha.
