  text: Hizi ndizo safari za wana wa Israeli[a], kwa vikosi vyao[b]; nao wakaondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli”; kwa neno halisi, “wana wa Israeli.”
