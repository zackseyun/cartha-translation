translation:
  language: sw
  text: Watakapopiga tarumbeta hizo[a], kusanyiko lote litakusanyika kwako mlangoni pa hema la kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Nao watapiga tarumbeta hizo, na kusanyiko lote litakusanyika kwako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָקְעוּ בָּהֵן
  choice: Watakapopiga tarumbeta hizo
  rationale: Katika mfululizo huu wa maagizo, kitenzi kina maana ya wakati au sharti, hivyo “watakapopiga” ni Kiswahili cha kawaida. Kiwakilishi cha kike kwa wingi kinarejelea tarumbeta mbili za fedha zilizotajwa katika mstari uliotangulia; kutaja “tarumbeta hizo” huondoa utata usio wa asili katika Kiswahili.
- source_word: וְנוֹעֲדוּ
  choice: litakusanyika
  rationale: Nifali ya יעד hapa inaeleza jumuiya kukusanyika baada ya kuitwa kwa ishara ya tarumbeta. “Kukusanyika” ni ya kawaida na inahifadhi maana ya mkusanyiko uliopangwa.
- source_word: אֵלֶיךָ
  choice: kwako
  rationale: Hii inafuata maana ya moja kwa moja ya kihusishi “kwako” bila kuongeza dhana ya “mbele yako,” ingawa kusanyiko hilo litakuwa mbele ya Musa katika eneo lililotajwa.
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה humaanisha jumuiya ya Israeli kwa pamoja. “Kusanyiko” linafaa katika muktadha wa kuitwa na kukusanyika, na “lote” linawakilisha כָּל.
- source_word: פֶּתַח
  choice: ingilio
  rationale: Neno hilo linamaanisha mahali pa kuingilia. “Ingilio” ni la kawaida na linafaa kwa hema.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Tafsiri hii iliyozoeleka inaonyesha hema ambalo Mungu na watu wake hukutana kwa wakati na mahali palipopangwa, bila kulifanya kuwa hema la mikutano ya kawaida tu.
