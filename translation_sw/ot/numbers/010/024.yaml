  text: And over the company of the tribe of the sons of Benjamin was Abidan son of Gideoni[a].
translation:
  language: sw
  text: Na mkuu wa kikosi cha kabila la wana wa Benyamini alikuwa Abidani mwana wa Gideoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jeshi” au “kundi lililopangwa” badala ya “kikosi”; neno la Kiebrania linaweza kumaanisha kundi lililopangwa kwa utaratibu wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Na mkuu wa
  rationale: Muundo huu unaendeleza orodha ya mpangilio wa mwendo na kueleza kwa Kiswahili cha kawaida kwamba mtu aliyetajwa ndiye aliyekuwa juu ya kikosi; neno “mkuu” linaweka wazi maana ya usimamizi iliyomo katika עַל katika muktadha huu.
- source_word: צְבָא
  choice: kikosi
  rationale: Katika Hesabu 10 neno hili linamaanisha kundi la kikabila lililopangwa kwa utaratibu wa kijeshi kwa ajili ya mwendo, si lazima jeshi linalopigana. “Kikosi” ni la asili na huhifadhi wazo la kundi lililopangwa.
- source_word: מַטֵּה
  choice: kabila
  rationale: Hapa neno hilo linamaanisha kitengo cha kikabila, si fimbo halisi.
- source_word: בְּנֵי בִנְיָמִן
  choice: wana wa Benyamini
  rationale: Huhifadhi muundo na ladha ya ukoo ya Kiebrania huku ikiwa ya kawaida katika Kiswahili cha Biblia.
- source_word: אֲבִידָן
  choice: Abidani
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: בֶּן גִּדְעוֹנִי
  choice: mwana wa Gideoni
  rationale: Ni tafsiri ya kawaida ya utambulisho wa mtu kwa jina la baba yake.
