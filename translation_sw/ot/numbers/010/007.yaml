  yaml_path: translation/ot/numbers/010/007.yaml
  text: But when assembling the congregation[a], you shall blow, and you shall not sound an alarm.
translation:
  language: sw
  text: Lakini mnapowakusanya watu, mtapiga tarumbeta, wala hamtapiga mlio wa tahadhari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala hamtatoa mlio wa tahadhari.” Kiebrania kinatofautisha kupiga tarumbeta kwa kawaida na kutoa mlio maalumu wa tahadhari, ambao katika mistari ya karibu ni ishara ya kuondoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/הַקְהִיל
  choice: Lakini mnapokusanya
  rationale: Muundo wa kihusishi בְ pamoja na kitenzi cha kusababisha katika hali ya jina una maana ya wakati, ‘mnapokusanya.’ ‘Lakini’ linaonyesha utofauti na ishara ya kuondoka katika mstari uliotangulia.
- source_word: הַקָּהָל
  choice: kusanyiko
  rationale: Neno קָהָל humaanisha jumuiya ya Israeli iliyokusanyika. ‘Kusanyiko’ ni la kawaida na lenye heshima katika muktadha huu.
- source_word: תִּתְקְעוּ
  choice: mtapiga tarumbeta
  rationale: תקע hapa ni kupiga tarumbeta. Ingawa ‘tarumbeta’ halirudiwi katika Kiebrania cha mstari huu, limetajwa wazi katika muktadha wa karibu na linahitajika ili sentensi iwe ya kawaida na wazi kwa Kiswahili.
- source_word: וְ/לֹא
  choice: wala hamtapiga
  rationale: ‘Wala’ huunganisha kwa kawaida agizo chanya na katazo linalofuata, huku ‘hamtapiga’ kikidumisha muundo wa maagizo.
- source_word: תָרִיעוּ
  choice: mlio wa tahadhari
  rationale: Katika muktadha wa tarumbeta, הֵרִיעַ hurejelea mlio maalumu wa tahadhari uliotofautishwa na upigaji wa kawaida, hasa ishara iliyotumiwa kwa kuondoka.
