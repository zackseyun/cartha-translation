base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/006.yaml
  text: When you blow a second alarm, the camps that are encamped on the south side shall set out; they shall blow an alarm for their departures.
translation:
  language: sw
  text: Mtakapopiga mlio wa tahadhari mara ya pili[a], kambi zilizokuwa zimepiga kambi upande wa kusini zitaondoka; watapiga mlio wa tahadhari kwa ajili ya safari zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mlio mkali” au “mlio wa ishara.” Neno la Kiebrania linamaanisha mlio maalumu wa tarumbeta uliotumiwa kuelekeza kambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: Mtakapopiga
  rationale: Kitenzi תקע katika muktadha huu humaanisha kupiga tarumbeta. Muundo wa wakati wenye “-kapo-” unaonyesha kwa kawaida kwamba tukio hili ndilo ishara inayofuatwa na kuondoka kwa kambi, huku ukihifadhi nafsi ya pili wingi.
- source_word: תְּרוּעָה
  choice: mlio wa tahadhari
  rationale: Katika maagizo haya, תְּרוּעָה ni mlio maalumu wa tarumbeta unaotoa ishara ya kambi kuanza kusafiri, si kelele ya kawaida. “Mlio wa tahadhari” ni lugha inayoeleweka na kudumisha nguvu ya ishara hiyo.
- source_word: שֵׁנִית
  choice: mara ya pili
  rationale: Huwasilisha kwa Kiswahili cha kawaida mpangilio wa mlio huu kuwa wa pili.
- source_word: וְנָסְעוּ
  choice: zitaondoka
  rationale: נסע katika muktadha wa kambi humaanisha kung’oa kambi na kuanza safari. “Zitaondoka” ni ya asili na inaendana na kiima “kambi.”
- source_word: הַמַּחֲנוֹת הַחֹנִים
  choice: kambi zilizopiga kambi
  rationale: Huhifadhi nomino ya wingi na kishirikishi kinachoeleza kambi hizo kuwa zimesimama mahali pake, ingawa marudio ya mzizi “kambi” ni ya kawaida na wazi katika Kiswahili.
- source_word: תֵּימָנָה
  choice: upande wa kusini
  rationale: Katika muktadha huu neno linaonyesha mahali kambi hizo zilipowekwa, si mwelekeo wa safari yao.
- source_word: תְּרוּעָה יִתְקְעוּ
  choice: watapiga mlio wa tahadhari
  rationale: Huhifadhi muundo amilifu wa Kiebrania na mabadiliko yake kwenda nafsi ya tatu wingi, bila kuugeuza kimya kimya kuwa kauli tendwa.
- source_word: לְמַסְעֵיהֶם
  choice: kwa ajili ya kuondoka kwao
  rationale: מסע hapa hurejelea kung’oa kambi na kuanza hatua ya safari. Tafsiri hii inaweka wazi kusudi la mlio bila kupanua maana.
