  text: וְ/אִם בְּ/אַחַ֖ת יִתְקָ֑עוּ וְ/נוֹעֲד֤וּ אֵלֶ֨י/ךָ֙ הַ/נְּשִׂיאִ֔ים רָאשֵׁ֖י אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/004.yaml
  text: But if they blow only one[a], then the leaders, the heads of the thousands of Israel, shall gather to you.
translation:
  language: sw
  text: Lakini wakipiga tarumbeta moja tu, viongozi, yaani wakuu wa maelfu ya Israeli[a], watakusanyika kwako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli ya Kiebrania “wakuu wa maelfu ya Israeli” huenda inamaanisha viongozi wa vitengo vya Israeli vya watu elfu moja; baadhi ya tafsiri hufasiri zaidi kuwa “wakuu wa koo za Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Lakini waki-
  rationale: Muundo huu unaonyesha sharti lenye utofautishaji na agizo la mstari uliotangulia; “lakini” linaendeleza tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: בְּ/אַחַת
  choice: tarumbeta moja tu
  rationale: Kiebrania kinasema kihalisi “kwa moja,” huku tarumbeta ikieleweka kutokana na muktadha. Kutaja “tarumbeta” kunafanya maana iwe wazi kwa Kiswahili, na “tu” kuhifadhi tofauti kati ya moja na tarumbeta zote mbili.
- source_word: יִתְקָעוּ
  choice: wakipiga
  rationale: Kitenzi תקע katika muktadha huu kinamaanisha kupiga au kuvumisha tarumbeta; “kupiga tarumbeta” ni usemi wa kawaida na wa moja kwa moja kwa Kiswahili.
- source_word: וְ/נוֹעֲדוּ
  choice: watakusanyika
  rationale: Nifali ya יעד hapa inaeleza kukusanyika kwa kuitikia ishara iliyowekwa. “Watakusanyika” ni ya kawaida na inahifadhi maana ya mkusanyiko.
- source_word: אֵלֶי/ךָ
  choice: kwako
  rationale: Kihusishi kinaonyesha kuelekea kwa Musa; “kwako” kinatoa maana hiyo kwa ufupi na kwa kawaida.
- source_word: הַ/נְּשִׂיאִים
  choice: viongozi
  rationale: נְשִׂיאִים ni viongozi au wakuu wa makabila; “viongozi” huepuka dhana ya kifalme inayoweza kuletwa na “wakuu wa kifalme.”
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: wakuu wa maelfu ya Israeli
  rationale: Tafsiri hii inahifadhi mlolongo wa Kiebrania na istilahi yake ya kiutawala au kijeshi ya “maelfu,” bila kuibadili kimyakimya kuwa “koo.”
