translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa. Sitiari ya “macho” imehifadhiwa badala ya kubadilishwa moja kwa moja kuwa “mwongozo.”
