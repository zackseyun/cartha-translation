  source_fidelity: “Naye akasema” accurately carries the narrative introduction, and “Tafadhali, usituache” retains both the prohibition and the entreating force. “Kwa maana unajua mahali tunapopiga kambi nyikani” gives the contextually appropriate sense of the Hebrew expression for Israel’s encamping in the wilderness. “Nawe utakuwa macho yetu” preserves the Hebrew metaphor rather than replacing it with an interpretive term such as “mwongozo.”
  naturalness: The wording is clear, idiomatic Standard East African Swahili, with an appropriately dignified biblical narrative register. “Nyikani” is natural and suitably broad for במדבר.
