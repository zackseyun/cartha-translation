  yaml_path: translation/ot/numbers/010/031.yaml
  text: And he said[a], “Please do not leave us, for you know where we should camp in the wilderness, and you will be eyes for us.”
translation:
  language: sw
  text: Naye akasema, “Tafadhali, usituache, kwa maana unajua mahali tunapopiga kambi nyikani, nawe utakuwa macho yetu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno zaidi, “utakuwa macho kwetu,” yaani, utatuongoza kwa sababu unaijua nyika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Naye akasema
  rationale: Huhifadhi mtiririko wa kawaida wa simulizi ya Kiebrania na kumrejelea msemaji kwa njia ya asili katika Kiswahili.
- source_word: אַל נָא
  choice: Tafadhali, usituache
  rationale: אַל ni katazo, huku נָא ikiongeza sauti ya kusihi; “Tafadhali” hudumisha ombi hilo kwa Kiswahili cha kawaida.
- source_word: תַּעֲזֹב אֹתָנוּ
  choice: usituache
  rationale: Katika muktadha wa safari, “usituache” ni wazi na ya asili kuliko maneno yenye uzito zaidi kama “usitutelekeze.”
- source_word: כִּי עַל כֵּן
  choice: kwa maana
  rationale: Huonyesha sababu ya ombi kwa mtindo wenye hadhi na unaoeleweka.
- source_word: יָדַעְתָּ חֲנֹתֵנוּ
  choice: unajua mahali tunapopiga kambi
  rationale: Kitenzi timilifu kina umuhimu wa sasa, na חֲנֹתֵנוּ huonyesha kupiga kambi kwetu au maeneo ya kambi; tafsiri hii huwasilisha maana inayowezekana kwa Kiswahili cha asili.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: “Nyika” hueleza eneo la pori au jangwa lisilokaliwa bila kulifanya lazima kuwa jangwa la mchanga.
- source_word: וְהָיִיתָ לָּנוּ לְעֵינַיִם
  choice: nawe utakuwa macho yetu
  rationale: Huhifadhi sitiari ya Kiebrania ya kuwa “macho” kwa watu, huku ikidokeza mwongozo unaotokana na ujuzi wa eneo.
