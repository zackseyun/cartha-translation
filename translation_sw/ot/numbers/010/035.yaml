base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/035.yaml
  text: And whenever the ark set out[a], Moses said, “Rise up, O Yahweh, and let your enemies be scattered[b], and let those who hate you flee before you.”
translation:
  language: sw
  text: Kila mara sanduku lilipoondoka[a], Musa alisema, “Inuka[b], Ee Yahweh! Adui zako watawanyike, nao wale wanaokuchukia wakimbie kutoka mbele yako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikawa sanduku lilipoondoka.” Nahau ya Kiebrania inaweza kutafsiriwa kwa kufuata umbo lake kwa karibu zaidi, lakini hapa yaelekea ina maana ya “kila mara sanduku lilipoondoka.”
    reason: lexical_alternative
  - marker: b
    text: “Inuka” ni ombi kwamba Yahweh atende kwa nguvu; halimaanishi kwamba Mungu hakuwa akitenda kihalisi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: Kila ... lilipoanza safari
  rationale: Muundo huu unatambulisha hali iliyojirudia kila sanduku lilipoondoka. “Kila” huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku “lilipoanza safari” likihifadhi wazo la kuondoka kwa safari.
- source_word: הָאָרֹן
  choice: sanduku
  rationale: Kiebrania kinasema tu “sanduku”; haijaongezwa “la agano,” kwa kuwa maneno hayo hayapo wazi katika mstari huu.
- source_word: קוּמָה
  choice: Inuka
  rationale: Ni amri iliyoelekezwa kwa Yahweh na ombi la achukue hatua kwa nguvu. “Inuka” huhifadhi taswira ya Kiebrania kwa lugha ya sasa na yenye hadhi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetolewa kama “Yahweh,” badala ya kubadilishwa na cheo.
- source_word: וְיָפֻצוּ
  choice: na watawanyike
  rationale: Kitenzi hiki kina nguvu ya ombi baada ya amri “Inuka.” Muundo “na watawanyike” unaonyesha ombi hilo bila kulifanya kuwa taarifa ya uhakika kuhusu wakati ujao.
- source_word: אֹיְבֶיךָ
  choice: adui zako
  rationale: Huu ni ufasiri wa moja kwa moja wa nomino ya wingi yenye kiambishi cha nafsi ya pili umoja, ikimrejelea Yahweh.
- source_word: וְיָנֻסוּ
  choice: na ... wakimbie
  rationale: Kama kitenzi kilichotangulia, hiki pia kina nguvu ya ombi. “Wakimbie” huhifadhi usambamba wa maombi hayo mawili.
- source_word: מְשַׂנְאֶיךָ
  choice: wale wanaokuchukia
  rationale: Umbo la Kiebrania linaonyesha watu wanaotambulika kwa kuendelea kumchukia Yahweh. Kiswahili hiki ni cha kawaida na huhifadhi upinzani wao wa binafsi.
- source_word: מִפָּנֶיךָ
  choice: kutoka mbele yako
  rationale: Huhifadhi wazo la kujiondoa au kukimbia kutoka mbele ya Yahweh. Neno “kutoka” linaepusha maana isiyokusudiwa ya kukimbia wakiwa mbele yake kuelekea upande uleule.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Mstari unatumia jina la Mungu YHWH moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya amri “Inuka” inapoelekezwa kwa Mungu
  choice: Kuhifadhi taswira ya “Inuka” na kuifafanua kwa tanbihi kuwa ni ombi la Mungu atende
  alternative: Tenda kwa nguvu
  rationale: Ufasiri wa moja kwa moja huhifadhi taswira ya Kiebrania, lakini tanbihi huzuia dhana kwamba Mungu alikuwa amelala au hakuwa akitenda kihalisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa maombi wenye “na ... -ike” umehifadhiwa ili kuonyesha nguvu ya vitenzi vya ombi katika Kiebrania.
