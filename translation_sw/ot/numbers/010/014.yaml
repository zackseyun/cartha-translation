base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/014.yaml
  text: The standard of the camp of the sons of Judah set out first[a], by their divisions[b]; and over its division was Nahshon son of Amminadab.
translation:
  language: sw
  text: Bendera[a] ya kambi ya wana wa Yuda ikaondoka kwanza, kwa vikosi vyao[b]. Mkuu wa kikosi chake alikuwa Nahshoni mwana wa Aminadabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alama ya kambi.” Neno la Kiebrania humaanisha bendera au alama ya kikabila ambayo pia huwakilisha kitengo cha kambi kilichokusanyika na kusafiri chini yake.
    reason: lexical_alternative
  - marker: b
    text: Au “kulingana na majeshi yao.” Neno la Kiebrania linamaanisha makundi ya kikabila yaliyopangwa kwa utaratibu wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: ikaondoka
  rationale: Katika simulizi la safari jangwani, kitenzi hiki humaanisha kuvunja kambi na kuanza kusonga mbele. “Ikaondoka” ni Kiswahili cha kawaida na kinaendeleza mfuatano wa simulizi.
- source_word: דֶּגֶל מַחֲנֵה
  choice: kambi ... chini ya bendera yao
  rationale: Neno דֶּגֶל linaweza kutaja bendera yenyewe au kundi la kambi lililopangwa chini yake. Muundo huu wa Kiswahili unaonyesha kwamba kambi ndiyo iliyosonga, huku ukidumisha nafasi ya bendera katika mpangilio huo.
- source_word: בְנֵי יְהוּדָה
  choice: wana wa Yuda
  rationale: Hifadhi usemi wa kikabila na wa nasaba wa Kiebrania kwa lugha ya kawaida ya kibiblia ya Kiswahili.
- source_word: בָּרִאשֹׁנָה
  choice: kwanza
  rationale: Ni kielezi kinachoonyesha nafasi ya kwanza katika utaratibu wa kuondoka.
- source_word: לְצִבְאֹתָם
  choice: kwa vikosi vyao
  rationale: Neno צבא hapa linataja makundi yaliyopangwa kwa utaratibu wa kijeshi. “Vikosi” hudumisha wazo la mpangilio bila kudai kwamba mapigano yanafanyika katika mstari huu.
- source_word: וְעַל צְבָאוֹ
  choice: alikuwa mkuu wa kikosi chake
  rationale: Kirai hiki kinamtambulisha mtu aliyekuwa na mamlaka juu ya kikosi cha Yuda. Tafsiri hii ni ya asili katika Kiswahili na huhifadhi maana ya uongozi.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Nahshoni mwana wa Aminadabu
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya kawaida ya Biblia za Kiswahili.
