base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/009.yaml
  text: And when you go to war in your land against the enemy who oppresses you[a], then you shall sound an alarm with the trumpets, and you shall be remembered before Yahweh your God[c][b], and you shall be saved from your enemies.
translation:
  language: sw
  text: Na mtakapoingia vitani katika nchi yenu dhidi ya adui anayewatesa[a], mtapiga mlio wa tahadhari kwa tarumbeta; nanyi mtakumbukwa mbele ya Yahweh Mungu wenu[b][c], na mtaokolewa kutoka kwa adui zenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na ikiwa mtaingia vitani katika nchi yenu.” Kiunganishi cha Kiebrania kinaweza kuanzisha sharti au hali inayotokea.
    reason: alternative_reading
  - marker: b
    text: Au, “mtaletwa katika kumbukumbu mbele ya Yahweh Mungu wenu”; kwa tafsiri yenye ufafanuzi zaidi, “Yahweh Mungu wenu atawakumbuka.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: YHWH, jina la Mungu, linalotafsiriwa hapa kuwa “Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Na mtakapo-
  rationale: Katika maagizo haya, וְכִי huanzisha hali inayotarajiwa au sharti la wakati ujao. Muundo wa “mtakapo-” ni wa kawaida katika Kiswahili na unaendeleza mtiririko wa kifungu; uwezekano wa maana ya “ikiwa” umeonyeshwa katika tanbihi.
- source_word: תָבֹאוּ מִלְחָמָה
  choice: mtakapoingia vitani
  rationale: Hii ni nahau ya Kiebrania yenye maana ya kuingia au kushiriki katika vita. “Kuingia vitani” ni ya asili katika Kiswahili na huhifadhi wazo la kuanza mapambano.
- source_word: בְּאַרְצְכֶם
  choice: katika nchi yenu
  rationale: אֶרֶץ hapa ni nchi au eneo la Israeli. “Nchi yenu” huhifadhi maana ya eneo lao bila kuleta dhana ya kisiasa ya kisasa isiyohitajika.
- source_word: עַל הַצַּר הַצֹּרֵר אֶתְכֶם
  choice: dhidi ya adui anayewatesa
  rationale: צַר humtaja adui au mpinzani, na צֹרֵר humfafanua kama anayefanya uhasama au anayesababisha dhiki. Tafsiri hii huhifadhi nomino na tendo endelevu la utesaji.
- source_word: וַהֲרֵעֹתֶם בַּחֲצֹצְרֹת
  choice: mtapiga mlio wa tahadhari kwa tarumbeta
  rationale: Hifili ya רוע katika muktadha wa tarumbeta hurejelea kupiga ishara ya tahadhari, si kutoa sauti tu. “Mlio wa tahadhari” huonyesha kazi yake ya kijeshi.
- source_word: וֲנִזְכַּרְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: mtakapokumbukwa mbele za Yahweh Mungu wenu
  rationale: 'Kitenzi cha Nifali ni cha kutendwa: “kukumbukwa.” Muundo huu umehifadhiwa badala ya kumfanya Mungu kuwa mtendaji waziwazi, hivyo kutodhoofisha mvutano uliomo katika Kiebrania.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika matini.
- source_word: וְנוֹשַׁעְתֶּם מֵאֹיְבֵיכֶם
  choice: mtaokolewa kutoka kwa adui zenu
  rationale: Nifali ya ישׁע ina maana ya kuokolewa au kukombolewa. “Mtaokolewa” huhifadhi umbo la kutendwa na inafaa katika muktadha wa kijeshi.
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina la Mungu יהוה. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha na cheo.
- issue: Nguvu ya וֲנִזְכַּרְתֶּם
  choice: mtakapokumbukwa mbele za Yahweh Mungu wenu
  alternative: Yahweh Mungu wenu atawakumbuka
  rationale: Tafsiri ya kutendwa hufuata umbo la Nifali na huhifadhi mvutano wa kitheolojia wa matini bila kuongeza mtendaji aliye wazi kuliko Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Kuingia vitani,” “mlio wa tahadhari,” na “mtaokolewa” ni miundo ya kawaida huku umbo la kutendwa katika “mtakapokumbukwa” likihifadhi ukaribu na sintaksia ya Kiebrania.
