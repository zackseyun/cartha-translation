base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/012.yaml
  text: And the sons of Israel set out by stages from the wilderness of Sinai[a], and the cloud settled in the wilderness of Paran.
translation:
  language: sw
  text: Wana wa Israeli[a] wakaondoka kutoka katika nyika ya Sinai kwa hatua za safari zao, nalo wingu likatulia katika nyika ya Parani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Waisraeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: wakaondoka
  rationale: Katika simulizi la safari, kitenzi נסע humaanisha kuvunja kambi na kuanza kuendelea na safari. “Wakaondoka” ni lugha ya kawaida na ya moja kwa moja.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi kwa uwazi muundo wa kifamilia wa Kiebrania, yaani “wana wa Israeli,” huku “Waisraeli” likitolewa kama chaguo la kawaida zaidi katika tanbihi.
- source_word: לְמַסְעֵיהֶם
  choice: wakisafiri hatua kwa hatua
  rationale: Nomino ya wingi מַסָּע inaonyesha hatua au vipindi vinavyofuatana vya safari. Usemi huu unaeleza maana hiyo kwa Kiswahili cha kawaida bila kudokeza kwamba walifanya safari moja tu isiyogawanyika.
- source_word: מִמִּדְבַּר סִינָי
  choice: katika nyika ya Sinai
  rationale: “Nyika” huonyesha eneo lisilolimwa na lenye wakazi wachache bila kulifanya lazima kuwa jangwa la mchanga; “katika” pamoja na kitenzi cha kuondoka huonyesha mahali walikotoka kwa Kiswahili cha kawaida.
- source_word: וַיִּשְׁכֹּן
  choice: likatua
  rationale: Kwa kuwa kiima ni wingu la kuwaongoza, “likatua” linaonyesha kwamba wingu lilisimama na kukaa mahali fulani, badala ya kutumia “liliishi,” ambalo si la kawaida kwa wingu.
- source_word: הֶעָנָן
  choice: wingu
  rationale: Kibainishi cha Kiebrania kinaelekeza kwa wingu lililojulikana tayari katika simulizi; Kiswahili hakihitaji neno jingine la kulibainisha katika muktadha huu.
- source_word: בְּמִדְבַּר פָּארָן
  choice: katika nyika ya Parani
  rationale: “Nyika” inatumika kwa uthabiti kwa מִדְבָּר, na jina פָּארָן limetoholewa kwa umbo la kawaida la Kiswahili, “Parani.”
theological_decisions:
- issue: Tafsiri ya בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  alternative: Waisraeli
  rationale: Hakuna mzozo wa kimafundisho unaohusika, lakini tafsiri kuu inahifadhi usemi wa kifamilia na wa kiume uliopo wazi katika Kiebrania. Chaguo la kijumla na la kawaida zaidi limehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia “wakisafiri hatua kwa hatua” kufafanua hatua zinazofuatana za safari kwa lugha inayoeleweka, huku ikihifadhi “Wana wa Israeli” kama tafsiri iliyo karibu na muundo wa Kiebrania.
