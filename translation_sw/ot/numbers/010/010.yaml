  text: וּ/בְ/י֨וֹם שִׂמְחַתְ/כֶ֥ם וּֽ/בְ/מוֹעֲדֵי/כֶם֮ וּ/בְ/רָאשֵׁ֣י חָדְשֵׁי/כֶם֒ וּ/תְקַעְתֶּ֣ם בַּ/חֲצֹֽצְרֹ֗ת עַ֚ל עֹלֹ֣תֵי/כֶ֔ם וְ/עַ֖ל זִבְחֵ֣י שַׁלְמֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֤ם לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י אֱלֹֽהֵי/כֶ֔ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/010.yaml
  text: And on the day of your gladness[a], and at your appointed times, and at the beginnings of your months, you shall blow the trumpets over your burnt offerings and over the sacrifices of your peace offerings, and they shall be for you as a memorial before your God[b]. I am Yahweh your God.
translation:
  language: sw
  text: Katika siku ya furaha yenu, na katika nyakati zenu zilizowekwa, na mwanzoni mwa miezi yenu[a], mtapiga tarumbeta wakati wa kutoa sadaka zenu za kuteketezwa na dhabihu zenu za amani[b]. Nazo zitakuwa ukumbusho kwa ajili yenu mbele za Mungu wenu. Mimi ni Yahweh, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miezi yenu mipya.” Kiebrania ni, kihalisi, “mianzo ya miezi yenu.”
    reason: lexical_alternative
  - marker: b
    text: Au “dhabihu zenu za ushirika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחַתְכֶם
  choice: furaha yenu
  rationale: Nomino hii humaanisha furaha au shangwe; “furaha” ni ya kawaida, yenye heshima, na inafaa katika orodha ya matukio ya ibada.
- source_word: מוֹעֲדֵיכֶם
  choice: nyakati zenu zilizowekwa
  rationale: Huhifadhi maana pana ya nyakati zilizoteuliwa bila kuifanya istilahi hii imaanishe sikukuu pekee.
- source_word: רָאשֵׁי חָדְשֵׁיכֶם
  choice: mwanzoni mwa miezi yenu
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana halisi ya ‘vichwa/mianzo ya miezi yenu,’ huku maana ya mwezi mpya ikitajwa katika tanbihi.
- source_word: וּתְקַעְתֶּם
  choice: mtapiga
  rationale: Kitenzi hiki, kinapotumiwa pamoja na tarumbeta, kwa kawaida humaanisha kuzipiga au kuzivumisha.
- source_word: חֲצֹצְרֹת
  choice: tarumbeta
  rationale: Ni jina la kawaida la vyombo hivi vya ibada; neno ‘za fedha’ halijaongezwa kwa kuwa halimo katika mstari huu.
- source_word: עַל עֹלֹתֵיכֶם
  choice: juu ya sadaka zenu za kuteketezwa
  rationale: “Juu ya” huhifadhi uhusiano wa kimahali au kiibada wa עַל, yaani tarumbeta kupigwa wakati sadaka hizo zinatolewa.
- source_word: זִבְחֵי שַׁלְמֵיכֶם
  choice: dhabihu zenu za amani
  rationale: “Dhabihu za amani” huhifadhi istilahi ya dhabihu na uhusiano wa שְׁלָמִים na amani, ustawi, au ukamilifu.
- source_word: וְהָיוּ לָכֶם לְזִכָּרוֹן
  choice: Nazo zitakuwa ukumbusho kwa ajili yenu
  rationale: “Ukumbusho” huhifadhi maana ya kiibada ya jambo linalowasilishwa ili likumbukwe mbele za Mungu. Kiwakilishi “nazo” hakilazimishi kwa uwazi kitu kimoja kuwa rejeo lake, hivyo ukungu wa kisarufi wa Kiebrania unabaki.
- source_word: לִפְנֵי אֱלֹהֵיכֶם
  choice: mbele za Mungu wenu
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha maana ya kuwa mbele au katika uwepo wa Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi “Yahweh” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Uwasilishaji wa שְׁלָמִים
  choice: dhabihu za amani
  alternative: dhabihu za ushirika
  rationale: “Amani” huhifadhi uhusiano wa istilahi hiyo na shalom—amani, ustawi, na ukamilifu—bila kuifungia katika wazo la ushirika pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha ya Kiebrania umehifadhiwa bila kufanya sentensi kuwa nzito kupita kiasi. Alama za tanbihi zimewekwa karibu na maneno yanayohusika.
