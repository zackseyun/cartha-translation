  text: And over the company of the tribe of the sons of Issachar was Nethanel the son of Zuar[a].
translation:
  language: sw
  text: Na mkuu wa kikosi cha kabila la wana wa Isakari alikuwa Nethaneli mwana wa Suari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jeshi” au “mgawanyo” kwa “kikosi” (Kiebrania צְבָא), likimaanisha kundi la kikabila lililopangwa kwa utaratibu wa kusafiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Na mkuu wa
  rationale: Muundo wa Kiebrania unaunganisha mstari huu na orodha iliyotangulia na unaonyesha mtu aliyewekwa juu ya kikosi. Kiswahili cha asili kinahitaji nomino 'mkuu' ili kutoa maana hiyo kwa uwazi.
- source_word: צְבָא
  choice: kikosi
  rationale: Katika muktadha wa maandamano ya Hesabu 10, neno hili linamaanisha kundi la kikabila lililopangwa. 'Kikosi' huhifadhi wazo la mpangilio na pia mwelekeo wa kijeshi bila kulifanya kuwa jeshi zima.
- source_word: מַטֵּה
  choice: kabila
  rationale: Hapa neno hili linataja kitengo cha kikabila, si fimbo halisi.
- source_word: בְּנֵי יִשָׂשכָר
  choice: wana wa Isakari
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania 'wana wa Isakari' na unafaa katika fomula ya ukoo wa kikabila.
- source_word: נְתַנְאֵל
  choice: Nethaneli
  rationale: Jina limetoholewa kwa tahajia inayoweza kutamkwa kwa kawaida katika Kiswahili huku likifuata umbo la Kiebrania.
- source_word: בֶּן צוּעָר
  choice: mwana wa Suari
  rationale: Huhifadhi moja kwa moja uhusiano wa baba na mwana unaoonyeshwa na Kiebrania.
