base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/019.yaml
  text: And over the company of the tribe of the sons of Simeon was Shelumiel son of Zurishaddai[a].
translation:
  language: sw
  text: Na kiongozi wa jeshi la kabila la wana wa Simeoni alikuwa Shelumieli mwana wa Surishadai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kikosi” kwa neno “jeshi” (Kiebrania צְבָא), likimaanisha kundi la kabila lililopangwa kwa utaratibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Na kiongozi wa
  rationale: Katika muktadha wa mpangilio wa kusafiri, עַל humtambulisha mtu aliyewekwa juu ya kikosi. Kiswahili cha asili zaidi hutumia muundo wa 'kiongozi wa' badala ya tafsiri ya kimofimu 'juu ya'.
- source_word: צְבָא
  choice: jeshi
  rationale: Neno hili hapa linamaanisha kikosi cha kikabila kilichopangwa. 'Jeshi' ni neno wazi na la kawaida katika Kiswahili, ingawa 'kikosi' pia kinawezekana; tanbihi inalinda upana wa maana.
- source_word: מַטֵּה
  choice: kabila
  rationale: Katika muktadha wa sensa na mpangilio wa kambi, maana ya kawaida ni kitengo cha kikabila.
- source_word: בְּנֵי שִׁמְעוֹן
  choice: wana wa Simeoni
  rationale: Huhifadhi kwa uwazi usemi wa Kiebrania 'wana wa Simeoni,' ambao hapa ni jina la kawaida la kikabila.
- source_word: שְׁלֻמִיאֵל
  choice: Shelumieli
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa wasemaji wa Kiswahili bila kulitafsiri.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika nasaba ya moja kwa moja, 'mwana wa' ndiyo tafsiri ya wazi na ya kawaida.
- source_word: צוּרִי שַׁדָּי
  choice: Surishadai
  rationale: Jina la mtu limetoholewa kama jina moja, kwa tahajia ya Kiswahili.
