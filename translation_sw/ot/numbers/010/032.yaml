  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֖ה כִּי תֵלֵ֣ךְ עִמָּ֑/נוּ וְ/הָיָ֣ה הַ/טּ֣וֹב הַ/ה֗וּא אֲשֶׁ֨ר יֵיטִ֧יב יְהוָ֛ה עִמָּ֖/נוּ וְ/הֵטַ֥בְנוּ לָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/032.yaml
  text: And if you go with us[a], then whatever good Yahweh does for us, we will do good to you.
translation:
  language: sw
  text: Na ukienda pamoja nasi, basi mema yoyote[a] ambayo Yahweh atatutendea, nasi tutakutendea mema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “mema hayo.”
    reason: Kirai הַטּוֹב הַהוּא kinaweza kutafsiriwa kwa muundo wa karibu zaidi ‘mema hayo’; ‘mema yoyote’ huonyesha kwa Kiswahili cha kawaida upeo wa manufaa yanayokusudiwa.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Na ukienda
  rationale: Muundo huu unaanzisha sharti. Kiswahili cha kawaida hutumia ‘uki-’ kuonyesha ‘ikiwa utaenda’ bila kubeba kwa ugumu nahau ya Kiebrania ‘na itakuwa kwamba.’
- source_word: תֵלֵךְ עִמָּנוּ
  choice: ukienda pamoja nasi
  rationale: Kitenzi הלך pamoja na עִם hapa kinamaanisha kuandamana na Waisraeli katika safari. ‘Kwenda pamoja nasi’ ni wazi na cha kawaida katika Kiswahili.
- source_word: וְהָיָה
  choice: basi
  rationale: Katika sehemu ya pili ya sentensi, neno hili linaonyesha matokeo ya sharti; ‘basi’ huwasilisha uhusiano huo kwa kawaida.
- source_word: הַטּוֹב הַהוּא
  choice: mema yoyote
  rationale: Kirai hiki kinarejelea wema au manufaa yatakayotolewa, kisha kinafafanuliwa na kishazi kinachofuata. ‘Mema yoyote’ huonyesha upana wa maana; tafsiri ya karibu zaidi ‘mema hayo’ imewekwa katika tanbihi.
- source_word: אֲשֶׁר יֵיטִיב יְהוָה עִמָּנוּ
  choice: ambayo Yahweh atatutendea
  rationale: Hifili ya יטב inaweza kumaanisha kumtendea mtu mema au kumnufaisha. ‘Atatutendea’ ni ya kawaida hapa na hudumisha uhusiano wa kitenzi hiki na kile kinachofuata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa unukuzi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: nasi tutakutendea mema
  rationale: Tafsiri hii inahifadhi kurudiwa kwa mzizi יטב na ahadi ya Israeli ya kumnufaisha anayekwenda pamoja nao, bila kuongeza neno ‘yale yale,’ ambalo halipo wazi katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. ‘Yahweh’ hulihifadhi kama jina na huepuka kulibadilisha kimya kuwa ‘BWANA.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa sharti umewekwa wazi kwa ‘uki- ... basi,’ huku urudiaji wa wazo la kutenda mema ukihifadhiwa.
