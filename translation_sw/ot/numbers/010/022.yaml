  yaml_path: translation/ot/numbers/010/022.yaml
  text: Then the banner of the camp of the sons of Ephraim set out by their divisions[b][a], and over its division was Elishama son of Ammihud.
translation:
  language: sw
  text: Kisha bendera[a] ya kambi ya wana wa Efraimu ikaondoka kwa vikosi vyao[b], na mkuu wa kikosi chake alikuwa Elishama mwana wa Amihudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “standadi.” Neno la Kiebrania linarejelea bendera ya kabila ambayo kambi iliifuata ilipokuwa safarini.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa makundi yao yaliyopangwa.” Kiebrania kinaonyesha vikundi vya kambi vilivyopangwa kwa utaratibu kama wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Kisha ... ikaondoka
  rationale: Waw pamoja na kitenzi cha wakati timilifu huendeleza mfululizo wa simulizi; “kisha” huonyesha hatua inayofuata, na “ikaondoka” ni ya kawaida katika muktadha wa kuanza safari.
- source_word: דֶּגֶל
  choice: bendera
  rationale: Neno hili linamaanisha alama ya kabila au kambi ambayo kundi liliifuata safarini; “bendera” ni Kiswahili cha sasa na kinachoeleweka kwa urahisi.
- source_word: מַחֲנֵה
  choice: kambi
  rationale: Katika muundo huu neno linaitaja kambi iliyohusishwa na bendera hiyo.
- source_word: בְנֵי אֶפְרַיִם
  choice: wana wa Efraimu
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania wa jina la kabila bila kuubadili kuwa usemi mpana zaidi.
- source_word: לְצִבְאֹתָם
  choice: kwa vikosi vyao
  rationale: צָבָא hapa hurejelea makundi yaliyopangwa kwa utaratibu wa kijeshi kwa ajili ya safari; “vikosi” huwasilisha mpangilio huo bila kudai kwamba vilikuwa vitani.
- source_word: וְעַל צְבָאוֹ
  choice: na kiongozi wa kikosi chake alikuwa
  rationale: Usemi huu humtambulisha mtu aliyekuwa juu ya kikosi cha Efraimu. Kiswahili hiki cha asili huonyesha wazi uhusiano wa uongozi unaobebwa na עַל.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Elishama mwana wa Amihudi
  rationale: Majina yameandikwa kwa namna inayofaa matamshi ya Kiswahili, na “mwana wa” huhifadhi uhusiano wa ukoo.
theological_decisions: []
