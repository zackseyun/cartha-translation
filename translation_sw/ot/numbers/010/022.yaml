  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. “Bendera” na “vikosi” zinadumisha taswira ya mpangilio wa kambi, huku tanbihi zikihifadhi njia nyingine halali za kuelewa istilahi za Kiebrania.
