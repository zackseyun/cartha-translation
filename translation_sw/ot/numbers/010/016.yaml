lexical_decisions:
- source_word: וְעַל
  choice: Na mkuu wa
  rationale: 'Kiunganishi וְ kinaendeleza orodha, na עַל pamoja na kitenzi kilichodokezwa huonyesha mamlaka au uongozi. Kiswahili cha kawaida kinahitaji kutaja wazi nafasi ya uongozi: “Na mkuu wa.”'
- source_word: צְבָא
  choice: jeshi
  rationale: Katika muktadha wa safari ya jangwani, neno hili linamaanisha kikosi cha kikabila kilichopangwa kwa utaratibu wa kusafiri. “Jeshi” ni neno la kawaida na lenye hadhi, ingawa hapa halimaanishi lazima jeshi la kudumu.
- source_word: מַטֵּה
  choice: kabila
  rationale: Hapa neno hilo linataja kitengo cha kijamii na kisiasa, si fimbo halisi.
- source_word: בְּנֵי זְבוּלֻן
  choice: wana wa Zabuloni
  rationale: Tafsiri hii inadumisha usemi wa kifamilia wa Kiebrania na kuonyesha watu au wazao wa babu wa kabila hilo.
- source_word: אֱלִיאָב
  choice: Eliabu
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בֶּן חֵלֹן
  choice: mwana wa Heloni
  rationale: Huu ni usemi wa moja kwa moja wa Kiebrania unaomtambulisha mtu kwa jina la baba yake.
