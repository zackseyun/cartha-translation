  naturalness: The register is clear, modern Standard East African Swahili and suitably formal. ‘Hivi ndivyo asemavyo’ works well as a formal messenger formula. ‘Taabu yote iliyotupata’ is also natural and more closely reflects the source’s collective singular.
  terminology: ‘Wajumbe,’ ‘Kadeshi,’ ‘Edomu,’ and ‘ndugu yako Israeli’ are appropriate. The latter properly retains the source’s familial metaphor rather than reducing it in the main text to a general kinship term.
