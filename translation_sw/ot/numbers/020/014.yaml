base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/014.yaml
  text: 'Then Moses sent messengers from Kadesh to the king of Edom: “Thus says your brother Israel: You know all the hardship that has come upon us.”[a][b][c]'
translation:
  language: sw
  text: 'Kisha Musa akatuma wajumbe kutoka Kadeshi kwenda kwa mfalme wa Edomu, akisema, “Hivi ndivyo asemavyo ndugu yako Israeli: Wewe unajua taabu yote iliyotupata.[a][b][c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa yako Israeli.” Kiebrania kinasema kihalisi “ndugu yako Israeli,” kikirejelea uhusiano wa mababu kati ya Edomu na Israeli.
    reason: lexical_alternative
  - marker: b
    text: Au “shida yote” au “dhiki yote.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “iliyotukuta”; yaani, “iliyotupata” au “iliyotujia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Kisha ... akatuma
  rationale: Waw-consecutive inaendeleza simulizi kwa mfuatano; “Kisha” ni Kiswahili cha kawaida kinachoonyesha hatua iliyofuata.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu wa kidiplomasia neno linamaanisha wawakilishi wa kibinadamu, si malaika.
- source_word: מִקָּדֵשׁ
  choice: kutoka Kadeshi
  rationale: Maandishi ya Kiebrania yana jina Kadeshi pekee; hayana jina refu Kadeshi-barnea.
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: kwenda kwa mfalme wa Edomu
  rationale: Hii ni tafsiri ya wazi na ya kawaida ya kueleza walikoelekezwa wajumbe.
- source_word: כֹּה אָמַר
  choice: Hivi ndivyo asemavyo
  rationale: Hifadhi mtindo rasmi wa ujumbe wa kale huku ukibaki wa asili katika Kiswahili chenye hadhi.
- source_word: אָחִיךָ יִשְׂרָאֵל
  choice: ndugu yako Israeli
  rationale: Hifadhi lugha halisi ya kifamilia inayodokeza uhusiano wa mababu wa Edomu na Israeli.
- source_word: אַתָּה יָדַעְתָּ
  choice: Wewe unajua
  rationale: Kiwakilishi cha wazi “Wewe” kinadumisha mkazo wa אַתָּה, na kitenzi kamilifu hapa kinaonyesha hali ya sasa ya kujua.
- source_word: כָּל הַתְּלָאָה
  choice: taabu zote
  rationale: “Taabu” ni neno la kawaida na lenye hadhi linalojumuisha shida, dhiki, na mateso yaliyovumiliwa.
- source_word: אֲשֶׁר מְצָאָתְנוּ
  choice: zilizotupata
  rationale: Hii ni nahau ya asili ya Kiswahili inayokaribia taswira ya Kiebrania ya jambo ‘kumkuta’ mtu.
theological_decisions:
- issue: Lugha ya undugu kati ya Israeli na Edomu
  choice: ndugu yako Israeli
  alternative: jamaa yako Israeli
  rationale: Maandishi yanatoa wito kwa msingi wa undugu wa mataifa hayo kupitia uhusiano wa mababu; “ndugu” huhifadhi sitiari hiyo moja kwa moja bila kuipunguza kuwa uhusiano wa jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo rasmi wa ujumbe umehifadhiwa katika “Hivi ndivyo asemavyo,” huku sentensi nzima ikibaki wazi kwa wasomaji wa kawaida. Tahajia za majina zimetolewa kama Kadeshi na Edomu.
