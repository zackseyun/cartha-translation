base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/019.yaml
  text: And the sons of Israel said to him[a], “We will go up on the highway, and if I and my livestock drink your water, then I will pay its price. Let me only pass through on foot[c][b], nothing more.”
translation:
  language: sw
  text: Waisraeli wakamwambia[a], “Tutapanda kwa njia kuu[b]. Ikiwa mimi na mifugo yangu tutakunywa maji yako, nitalipa gharama yake. Niruhusu tu nipite kwa miguu[c]—si zaidi ya hayo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linamaanisha barabara au njia kuu iliyotengenezwa, ambayo nyakati nyingine ilikuwa imeinuliwa.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kwa miguu yangu nitapita”; usemi wa kupita kwa njia ya kawaida bila kudai jambo jingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Hili ndilo neno la kawaida na la asili katika Kiswahili kwa maana ya ‘wana wa Israeli,’ huku tanbihi ikihifadhi muundo halisi wa Kiebrania.
- source_word: בַּמְסִלָּה נַעֲלֶה
  choice: Tutapita kwa njia kuu
  rationale: מְסִלָּה ni barabara au njia kuu iliyotengenezwa. Ingawa נַעֲלֶה kihalisi ni ‘tutapanda,’ katika muktadha huu inaeleza kusafiri kwa kufuata njia hiyo; ‘tutapita’ ni Kiswahili cha kawaida bila kubadili kusudi la kauli.
- source_word: מֵימֶיךָ
  choice: maji yako
  rationale: Nomino ya Kiebrania iko katika umbo la wingi linalotumika kawaida kwa maji; ‘maji yako’ ni sawa na la asili katika Kiswahili.
- source_word: נִשְׁתֶּה אֲנִי וּמִקְנַי
  choice: mimi na mifugo yangu tutakunywa
  rationale: ‘Mifugo’ huwakilisha vizuri מִקְנֶה kwa upana zaidi kuliko ‘ng’ombe.’ Umoja wa msemaji anayewakilisha watu wake umehifadhiwa kwa ‘mimi’ na ‘yangu.’
- source_word: וְנָתַתִּי מִכְרָם
  choice: nitalipa gharama yake
  rationale: מֶכֶר hapa ni bei au malipo ya maji yatakayotumiwa. ‘Nitalipa gharama yake’ huwasilisha wazi wajibu wa malipo.
- source_word: רַק אֵין דָּבָר
  choice: tu … si zaidi ya hayo
  rationale: 'Kauli hii inaweka mpaka wa ombi na kulifanya lionekane dogo: wanaomba ruhusa ya kupita pekee, bila jambo jingine.'
- source_word: בְּרַגְלַי אֶעֱבֹרָה
  choice: Niruhusu tu nipite kwa miguu
  rationale: Kihalisi ni ‘kwa miguu yangu nitapita.’ Kiswahili hiki huhifadhi kutajwa kwa miguu na nguvu ya kauli ya ombi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Waisraeli’ ni cha kawaida kwa wasomaji, huku tanbihi ikionyesha muundo wa Kiebrania. Mabadiliko ya nafsi kutoka wingi (‘tutapita’) kwenda umoja (‘mimi,’ ‘yangu,’ ‘nitalipa,’ ‘nipite’) yamehifadhiwa kwa sababu yapo katika maandishi ya Kiebrania na yanaonyesha msemaji akiwakilisha taifa.
