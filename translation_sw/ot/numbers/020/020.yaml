  text: But he said[c][b][a], “You shall not pass through.” And Edom came out to meet him with a large force and with a strong hand.
translation:
  language: sw
  text: Lakini akasema, “Hutapita.” Ndipo Edomu akatoka kumlaki[a] akiwa na watu wengi[b] na kwa mkono wenye nguvu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumkabili.” Usemi wa Kiebrania wenyewe hauegemei upande wowote, lakini katika muktadha huu unaashiria uhasama.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “akiwa na watu wazito,” yaani kundi kubwa au lenye kutisha la watu.
    reason: lexical_alternative
  - marker: c
    text: Au “kwa nguvu nyingi”; huu ni usemi unaomaanisha uwezo mkubwa au nguvu ya kulazimisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini akasema
  rationale: Kiunganishi kinaendeleza simulizi, lakini muktadha wa kukataa ombi la Israeli unaonyesha utofautishaji; ‘lakini’ huleta maana hiyo kwa Kiswahili cha kawaida huku mtendaji akibaki kama anavyoeleweka kutokana na muktadha.
- source_word: לֹא תַעֲבֹר
  choice: Hutapita
  rationale: Kauli hii inaonyesha katazo na ukataa thabiti wa kuruhusu Israeli ipite katika nchi hiyo.
- source_word: וַיֵּצֵא אֱדוֹם
  choice: Ndipo Edomu akatoka
  rationale: Kitenzi kina maana ya kutoka; ‘ndipo’ kinaendeleza mfuatano wa simulizi bila kuongeza wazo la kuandamana kijeshi ndani ya kitenzi chenyewe.
- source_word: לִקְרָאתוֹ
  choice: kumkabili
  rationale: Kirai cha Kiebrania kimsingi ni kwenda kukutana na mtu na kinaweza kuwa kisichoegemea upande wowote, lakini hapa mazingira ni ya uhasama. ‘Kumkabili’ ni ya asili na huwasilisha tukio hilo bila kulifanya kuwa shambulio moja kwa moja.
- source_word: בְּעַם כָּבֵד
  choice: akiwa na jeshi kubwa
  rationale: Kihalisi ni ‘akiwa na watu wazito,’ nahau inayomaanisha kundi kubwa au lenye kutisha. Katika muktadha wa upinzani wa kijeshi, ‘jeshi kubwa’ huwasilisha maana kwa uwazi.
- source_word: וּבְיָד חֲזָקָה
  choice: na kwa mkono wenye nguvu
  rationale: Huhifadhi taswira ya nahau ya Kiebrania inayomaanisha nguvu au uwezo mkubwa wa kulazimisha.
