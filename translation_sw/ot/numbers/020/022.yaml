  yaml_path: translation/ot/numbers/020/022.yaml
  text: And they set out from Kadesh[a], and the sons of Israel, the whole congregation[b], came to Mount Hor.
translation:
  language: sw
  text: Kisha wakaondoka Kadeshi, nao Waisraeli[a], kusanyiko lote, wakafika Mlima Hori[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “wana wa Israeli,” nahau inayomaanisha Waisraeli.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “Hori, ule mlima,” kirai kinachotumika kama jina la mahali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: wakaondoka
  rationale: Kitenzi נסע katika masimulizi mara nyingi humaanisha kuvunja kambi na kuanza safari. “Wakaondoka” ni Kiswahili cha kawaida kinachoonyesha kuondoka mahali walipokuwa wamepiga kambi.
- source_word: מִקָּדֵשׁ
  choice: Kadeshi
  rationale: Maandishi ya Kiebrania yanataja Kadeshi pekee; hayatoi jina refu “Kadesh-barnea,” kwa hiyo halijaongezwa.
- source_word: וַיָּבֹאוּ
  choice: wakafika
  rationale: בוא inaweza kumaanisha kuja, kuingia, au kufika. Kwa kuwa kinachofuata ni mahali walikokwenda, “wakafika” ni usemi wa asili na sahihi katika Kiswahili.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa nahau ya Kiebrania ni “wana wa Israeli,” hapa inalitaja taifa lote. “Waisraeli” huwasilisha maana hiyo kwa Kiswahili cha sasa bila kudokeza wanaume peke yao; tafsiri halisi imehifadhiwa katika tanbihi.
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה humaanisha jumuiya iliyokusanyika, hasa jamii ya agano katika Pentateuko. “Kusanyiko lote” huhifadhi wazo la kundi zima na kuakisi כָּל.
- source_word: הֹר הָהָר
  choice: Mlima Hori
  rationale: Kirai hiki kinafanya kazi kama jina la mahali. “Mlima Hori” ni mpangilio wa kawaida wa jina la mlima katika Kiswahili kuliko tafsiri ya neno kwa neno.
