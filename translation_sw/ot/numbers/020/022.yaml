translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa masimulizi ni wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo wa “nao Waisraeli, kusanyiko lote” umehifadhi uhusiano wa ufafanuzi uliopo katika Kiebrania, ambapo “kusanyiko lote” linafafanua kundi lote la Waisraeli.
