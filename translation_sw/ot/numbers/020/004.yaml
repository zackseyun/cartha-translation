  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֲבֵאתֶם֙ אֶת קְהַ֣ל יְהוָ֔ה אֶל הַ/מִּדְבָּ֖ר הַ/זֶּ֑ה לָ/מ֣וּת שָׁ֔ם אֲנַ֖חְנוּ וּ/בְעִירֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/004.yaml
  text: And why have you brought the assembly of Yahweh into this wilderness[a], that we and our livestock should die there?
translation:
  language: sw
  text: Na kwa nini mmelileta kusanyiko[a] la Yahwe katika nyika hii, ili sisi na mifugo yetu tufe humo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jumuiya ya Yahwe.”
    reason: Njia nyingine ya kutafsiri קְהַל, neno linalomaanisha jamii au mkutano wa watu waliokusanyika.
lexical_decisions:
- source_word: וְלָמָה
  choice: Na kwa nini
  rationale: Huhifadhi kiunganishi וְ pamoja na swali לָמָה, na kuendeleza malalamiko kutoka muktadha uliotangulia kwa Kiswahili cha kawaida.
- source_word: הֲבֵאתֶם
  choice: mmelileta
  rationale: Hifili ya בוא ina maana ya ‘kuleta’; wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye matokeo yanayoonekana sasa. Kiambishi -li- kinarejelea ‘kusanyiko.’
- source_word: קְהַל יְהוָה
  choice: kusanyiko la Yahwe
  rationale: קָהָל ni jamii iliyokusanyika; ‘kusanyiko’ ni neno wazi na lenye hadhi bila kulifanya kuwa istilahi mahsusi ya kidhehebu. Uhusiano wa umilikaji umeonyeshwa kwa ‘la.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne za Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: אֶל הַמִּדְבָּר הַזֶּה
  choice: katika nyika hii
  rationale: מִדְבָּר humaanisha eneo la pori, nyika, au eneo kame lisilokaliwa sana. ‘Nyika’ huepuka kuifanya lazima iwe jangwa la mchanga, na ‘katika’ ni ya kawaida pamoja na kitenzi ‘kuleta.’
- source_word: לָמוּת
  choice: ili ... tufe
  rationale: Kitenzi-jina hiki kinaweza kueleza kusudi au matokeo yanayodhaniwa. Muundo wa ‘ili’ unatoa shtaka la wasemaji kwa Kiswahili cha kawaida bila kuongeza maelezo yasiyokuwapo.
- source_word: שָׁם
  choice: humo
  rationale: Kielezi hiki cha mahali kinarejelea ndani ya nyika iliyotajwa; ‘humo’ ni sahihi na ya asili katika Kiswahili.
- source_word: אֲנַחְנוּ וּבְעִירֵנוּ
  choice: sisi na mifugo yetu
  rationale: Kiwakilishi cha wazi אֲנַחְנוּ kimehifadhiwa kwa msisitizo kama ‘sisi,’ na בְּעִירֵנוּ limetafsiriwa kwa neno la jumla na la kisasa ‘mifugo yetu.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano, si cheo. ‘Yahwe’ hulihifadhi kama jina lililotoholewa bila kuingiza desturi ya kulibadilisha kuwa cheo.
- issue: Kusudi au matokeo katika לָמוּת
  choice: ili sisi na mifugo yetu tufe
  alternative: hata sisi na mifugo yetu tufe
  rationale: Kitenzi-jina cha Kiebrania kinaweza kusikika kama kusudi au matokeo. ‘Ili’ huhifadhi namna ya shtaka la watu kwamba kuletwa kwao huko kulikuwa kwa kifo, bila kuthibitisha kwamba kweli hilo lilikuwa kusudi la Mungu au la viongozi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio na viwakilishi vinahifadhi msisitizo wa malalamiko ya Kiebrania; neno ‘nyika’ linaacha upana wa mazingira ya מִדְבָּר.
