  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבֹא֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן מִ/פְּנֵ֣י הַ/קָּהָ֗ל אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֲלֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/006.yaml
  text: Then Moses and Aaron came from before the assembly to the entrance of the tent of meeting and fell on their faces[c][b][a], and the glory of Yahweh appeared to them.
translation:
  language: sw
  text: Kisha Musa na Haruni wakatoka mbele ya kusanyiko[a][b], wakaenda kwenye mlango wa Hema la Kukutania, wakaanguka kifudifudi, nao utukufu wa Yahwe[c] ukawatokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka mbele ya kusanyiko,” yaani, kutoka mahali watu waliokusanyika walipokuwa.'
    reason: cultural_note
  - marker: b
    text: 'Au: “mkutano wa watu.”'
    reason: lexical_alternative
  - marker: c
    text: 'Au: “utukufu wa Yahwe ukajidhihirisha kwao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: wakaenda
  rationale: Kitenzi בוא kinaweza kumaanisha kuja, kwenda, au kuingia kulingana na mtazamo. Kwa kuwa Musa na Haruni wanaelekea mahali palipotajwa, “wakaenda” ni ya kawaida na wazi katika Kiswahili.
- source_word: מִפְּנֵי הַקָּהָל
  choice: wakatoka mbele ya kusanyiko
  rationale: Tafsiri hii inahifadhi nahau ya Kiebrania “kutoka mbele/uweponi mwa kusanyiko” na kuonyesha kuwa waliondoka mahali watu waliokusanyika walipokuwa.
- source_word: הַקָּהָל
  choice: kusanyiko
  rationale: קהל humaanisha jamii iliyokusanyika. “Kusanyiko” ni neno la kawaida na lenye hadhi linalohifadhi maana ya mkutano wa watu.
- source_word: פֶּתַח
  choice: mlango
  rationale: פתח ni sehemu ya kuingilia katika jengo au hema. “Mlango” ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni jina la mahali ambapo Yahwe alikutana na watu wake. Tafsiri hii ya kawaida huhifadhi vipengele vya “hema” na “kukutana.”
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: wakaanguka kifudifudi
  rationale: Nahau hiyo inaeleza kuanguka uso ukiwa chini. “Kifudifudi” ni Kiswahili cha asili kinachoonyesha wazi mkao wa kujinyenyekeza au kuomba.
- source_word: וַיֵּרָא
  choice: ukawatokea
  rationale: Nifali ya ראה hapa inaonyesha kujidhihirisha kwa kuonekana. “Ukawatokea” ni ya kawaida katika Kiswahili na inadumisha utukufu kuwa kiima cha kitenzi.
- source_word: כְבוֹד יְהוָה
  choice: utukufu wa Yahwe
  rationale: כבוד hapa ni utukufu wa Mungu unaojidhihirisha. Muundo wa “utukufu wa Yahwe” unafuata kwa karibu uhusiano wa maneno ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa uandishi wa matamshi “Yahwe,” badala ya kulibadilisha kuwa cheo.
- source_word: אֲלֵיהֶם
  choice: ukawatokea
  rationale: Kiambishi “-wa-” katika “ukawatokea” kinawataja Musa na Haruni kama wale waliouona udhihirisho huo, sawa na אֲלֵיהֶם, “kwao.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la agano יהוה. “Yahwe” huhifadhi jina hilo binafsi badala ya kuweka cheo mahali pake.
- issue: Kiima cha kujidhihirisha
  choice: utukufu wa Yahwe ukawatokea
  alternative: Yahwe akawadhihirishia utukufu wake
  rationale: Kiebrania kinaweka “utukufu wa Yahwe” kuwa kiima cha kitenzi. Tafsiri iliyochaguliwa huhifadhi muundo huo bila kueleza zaidi namna udhihirisho ulivyotokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. “Kifudifudi” limetumiwa badala ya tafsiri ngumu ya neno kwa neno, huku mkao wa Kiebrania ukihifadhiwa. Herufi kubwa katika “Hema la Kukutania” zinaonyesha jina maalumu la mahali.
