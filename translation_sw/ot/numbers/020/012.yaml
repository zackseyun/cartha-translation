id: NUM.20.12
reference: Numbers 20:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ יַ֚עַן לֹא הֶאֱמַנְתֶּ֣ם בִּ֔/י לְ/הַ֨קְדִּישֵׁ֔/נִי לְ/עֵינֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֵ֗ן לֹ֤א תָבִ֨יאוּ֙ אֶת הַ/קָּהָ֣ל הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נָתַ֥תִּי לָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/012.yaml
  text: And Yahweh said to Moses and to Aaron[a], “Because you did not believe me, to treat me as holy before the eyes of the sons of Israel[c][b], therefore you shall not bring this assembly into the land that I have given them.”
translation:
  language: sw
  text: Yahwe akawaambia Musa na Haruni, “Kwa sababu hamkuniamini[a] na hamkuniheshimu kuwa mtakatifu[b] mbele ya wana wa Israeli[c], basi hamtaliingiza kusanyiko hili katika nchi niliyowapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hamkunitumaini.” Kitenzi cha Kiebrania kinaweza kuwa na maana ya kuamini au kutumaini.
    reason: lexical_alternative
  - marker: b
    text: Au, “hamkunionyesha kuwa mtakatifu” au “hamkunitakasa.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, Waisraeli; kwa neno halisi, “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina binafsi la Mungu badala ya kulibadilisha kwa cheo kama ‘BWANA’; ‘Yahwe’ ni umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: הֶאֱמַנְתֶּם בִּי
  choice: hamkuniamini
  rationale: Kitenzi אמן katika Hiphil pamoja na ב kinaweza kumaanisha kuamini au kumtumaini mtu. ‘Hamkuniamini’ ni tafsiri ya moja kwa moja na ya asili katika Kiswahili, huku maana ya ‘hamkunitegemea kwa imani’ ikibaki katika tanbihi.
- source_word: לְהַקְדִּישֵׁנִי
  choice: hamkunionyesha kuwa mtakatifu
  rationale: Hapa Hiphil ya קדש inaeleza kumdhihirisha au kumtambulisha Mungu kuwa mtakatifu hadharani. Usemi huu ni wazi kuliko ‘hamkunitakasa,’ ambao unaweza kudokeza kimakosa kwamba Mungu alihitaji kufanywa mtakatifu.
- source_word: לְעֵינֵי
  choice: mbele ya
  rationale: Ni Kiswahili cha kawaida kinachowasilisha maana ya kitendo kufanywa hadharani, machoni pa watu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inafuata kwa karibu muundo wa Kiebrania na kuhifadhi neno ‘wana’ badala ya kulifanya moja kwa moja kuwa jina la taifa.
- source_word: לָכֵן
  choice: kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha kwa uwazi matokeo ya hukumu iliyotokana na kosa lililotajwa.
- source_word: תָבִיאוּ
  choice: hamtaliingiza
  rationale: Hiphil ya בוא ina maana ya kusababisha kuingia. Kwa kuwa kiima ni Musa na Haruni na yambwa ni kusanyiko, ‘hamtaliingiza’ ni sahihi na ya asili.
- source_word: הַקָּהָל
  choice: kusanyiko hili
  rationale: ‘Kusanyiko’ linaonyesha jamii iliyokusanyika bila kuleta kwa lazima maana maalumu ya kikanisa inayoweza kuambatana na ‘kanisa’.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: ‘Nchi’ ni tafsiri ya kawaida ya הָאָרֶץ katika muktadha wa nchi waliyoahidiwa.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: niliyowapa
  rationale: Kauli ya wakati uliopita inatunza hali ya zawadi hiyo kuwa tayari imetolewa kwa hakika kwa mtazamo wa ahadi ya Mungu.
theological_decisions:
- issue: Asili ya kosa la Musa na Haruni
  choice: 'Kuhifadhi mashtaka mawili ya andiko: hawakumwamini Mungu na hawakumwonyesha kuwa mtakatifu mbele ya Israeli.'
  alternative: Kufafanua kosa hilo kuwa kutomtii, kutomtumaini, au kujitwalia utukufu wa Mungu.
  rationale: Mstari wenyewe hautoi maelezo kamili ya jinsi tendo lao lilivyokuwa kutokuamini. Tafsiri haiongezi ufafanuzi wa kimadhehebu wala kuunganisha mashtaka hayo kuwa kosa moja tu.
- issue: Maana ya לְהַקְדִּישֵׁנִי
  choice: hamkunionyesha kuwa mtakatifu
  alternative: hamkunitakasa; hamkuutetea utakatifu wangu
  rationale: Chaguo hili linaonyesha kwamba utakatifu wa Mungu ulipaswa kudhihirishwa hadharani, bila kudokeza kwamba wanadamu humfanya Mungu awe mtakatifu kwa asili yake.
- issue: Utambulisho wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Chaguo hili linadumisha umbo la kifamilia na la kimaagano la Kiebrania. Tanbihi inaonyesha tafsiri ya kawaida zaidi ya jina hilo la taifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi inadumisha sauti ya hukumu ya Mungu. ‘Yahwe’ limetumiwa kama jina binafsi; ‘kusanyiko’ huepuka maana finyu ya kikanisa; na alama zote za tanbihi zimewekwa mara moja mahali zinapohusika.
