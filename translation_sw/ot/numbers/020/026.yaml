base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/026.yaml
  text: Strip Aaron of his garments and put them on Eleazar his son[b][a]. Then Aaron will be gathered to his people and die there.
translation:
  language: sw
  text: Mvue Haruni mavazi yake, kisha umvike Eleazari mwanawe mavazi hayo.[a] Haruni atakusanywa[b] na kufa huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kuzingatia muktadha, haya ni mavazi yake ya ukuhani; Kiebrania kinasema tu “mavazi yake.”
    reason: lexical_alternative
  - marker: b
    text: “Atakusanywa” ni nahau ya Kiebrania inayotumiwa kuhusu kifo. Mahali pengine hujitokeza katika usemi kamili zaidi, “atakusanywa kwa watu wake.”
    reason: cross_reference
lexical_decisions:
- source_word: וְהַפְשֵׁט אֶת־אַהֲרֹן
  choice: Mvue Haruni
  rationale: Kitenzi cha Kiebrania katika kausativi ya amri humaanisha kumwondolea mtu nguo. “Mvue” ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: אֶת־בְּגָדָיו
  choice: mavazi yake
  rationale: בגד humaanisha vazi au nguo. “Mavazi” linafaa kwa mazingira haya yenye hadhi, bila kuongeza wazi neno “ya ukuhani,” ambalo halimo katika mstari huu.
- source_word: וְהִלְבַּשְׁתָּם אֶת־אֶלְעָזָר בְּנוֹ
  choice: kisha umvike Eleazari mwanawe mavazi hayo
  rationale: Muundo huu unaendeleza amri na unaonyesha kuhamishiwa kwa mavazi hayo kwa Eleazari. Kurudia “mavazi hayo” badala ya kiwakilishi pekee huleta uwazi wa asili katika Kiswahili.
- source_word: יֵאָסֵף
  choice: atakusanywa
  rationale: Hii ni nahau ya Kiebrania inayotumiwa kuhusu kifo. Tafsiri “atakusanywa” huhifadhi taswira ya asili bila kuongeza maneno “kwa watu wake,” ambayo hayapo katika mstari huu.
- source_word: וּמֵת שָׁם
  choice: na kufa huko
  rationale: 'Maneno haya yanaendeleza matokeo yajayo: Haruni atakufa mahali hapo. “Huko” ni kielezi cha kawaida kinacholingana na שָׁם.'
theological_decisions:
- issue: Nahau ya kifo katika יֵאָסֵף
  choice: Kuhifadhi nahau kama “atakusanywa”
  alternative: “atakusanywa kwa watu wake” au “ataondolewa/atakufa”
  rationale: Kiebrania cha mstari huu hakina maneno “kwa watu wake.” Kuyongeza kungeleta katika mstari huu umbo kamili la nahau linalopatikana kwingine; kuitafsiri kuwa “atakufa” pekee kungefuta taswira, hasa kwa kuwa kifo kinatajwa wazi mara moja baada yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Mvue” na “umvike” huhifadhi ulinganifu wa vitendo vya kuondoa na kuvalisha, huku “mavazi hayo” likifafanua rejeo la kiwakilishi kwa ufasaha wa Kiswahili.
