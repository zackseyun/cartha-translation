source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ בְנֵֽי יִ֠שְׂרָאֵל כָּל הָ֨/עֵדָ֤ה מִדְבַּר צִן֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן וַ/יֵּ֥שֶׁב הָ/עָ֖ם בְּ/קָדֵ֑שׁ וַ/תָּ֤מָת שָׁם֙ מִרְיָ֔ם וַ/תִּקָּבֵ֖ר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/001.yaml
  text: Then the sons of Israel[a], the whole congregation, came into the wilderness of Zin in the first month, and the people stayed at Kadesh[b]. Miriam died there and was buried there.
translation:
  language: sw
  text: Kisha Waisraeli[a], yaani kusanyiko lote[b], walifika katika jangwa la Sini mwezi wa kwanza. Watu wakakaa Kadeshi. Miriamu alikufa huko, akazikwa huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wana wa Israeli.” Kwa maana halisi, Kiebrania husema “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “jumuiya yote” au “mkutano wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Hili ndilo neno la kawaida na la asili katika Kiswahili kwa taifa la Israeli; tanbihi inahifadhi muundo halisi wa Kiebrania, ‘wana wa Israeli.’
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה hapa ni jumuiya iliyokusanyika ya Israeli, na כָּל imetafsiriwa wazi kwa ‘lote.’
- source_word: מִדְבַּר צִן
  choice: jangwa la Sini
  rationale: ‘Jangwa’ linafaa kwa eneo hili lisilolimwa, na ‘Sini’ ni umbo la jina linalosomeka kwa kawaida katika Kiswahili.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: mwezi wa kwanza
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha wakati.
- source_word: וַיֵּשֶׁב
  choice: wakakaa
  rationale: Kitenzi kinarejelea watu kwa pamoja na kinaonyesha kukaa mahali bila kudokeza lazima makazi ya kudumu.
- source_word: הָעָם
  choice: watu
  rationale: Ni tafsiri ya kawaida ya עָם katika muktadha wa Israeli kama jamii ya taifa.
- source_word: בְּקָדֵשׁ
  choice: Kadeshi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka katika Kiswahili; muundo wa kitenzi ‘wakakaa Kadeshi’ hauhitaji kihusishi kingine.
- source_word: מִרְיָם
  choice: Miriamu
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: וַתָּמָת
  choice: alikufa
  rationale: Inahifadhi kauli ya wazi ya Kiebrania bila kuipunguza ukali kwa msemo wa staha.
- source_word: וַתִּקָּבֵר
  choice: na kuzikwa
  rationale: Kauli tendwa imehifadhiwa bila kuongeza mtendaji ambaye hakutajwa katika Kiebrania.
- source_word: שָׁם ... שָׁם
  choice: huko ... huko
  rationale: Marudio ya Kiebrania yamehifadhiwa ili kuunganisha kifo na maziko na mahali pale pale.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. ‘Yaani’ linaonyesha kwamba ‘kusanyiko lote’ linafafanua Waisraeli waliokuja, kama inavyofanya apposition ya Kiebrania. Alama ya tanbihi [b] imewekwa baada ya kirai kinachohusika, si baada ya Kadeshi.
