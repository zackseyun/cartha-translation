base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/023.yaml
  text: And Yahweh spoke to Moses and to Aaron at Mount Hor[a], on the border of the land of Edom, saying,
translation:
  language: sw
  text: Yahweh[a] akawaambia Musa na Haruni kwenye Mlima Hori, kwenye mpaka wa nchi ya Edomu, akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH,” jina la Mungu linalotafsiriwa hapa “Yahweh.”'
    reason: Hufafanua umbo la Kiebrania la jina la Mungu na utoaji wake katika tafsiri.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Ingawa kitenzi אמר kimsingi ni ‘alisema,’ hapa kina watendewa wawili; ‘akawaambia’ ni Kiswahili cha kawaida kinachowasilisha kwa usahihi tendo la kusema kwa Musa na Haruni.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni umbo la Kiswahili la jina la Mungu lenye herufi nne YHWH, badala ya kulibadili kuwa cheo kama ‘BWANA.’
- source_word: מֹשֶׁה וְאֶל אַהֲרֹן
  choice: Musa na Haruni
  rationale: Majina haya yametolewa kwa maumbo yao yaliyozoeleka katika Kiswahili.
- source_word: בְּהֹר הָהָר
  choice: huko Mlima Hori
  rationale: Kirai hiki kinataja mahali pa tukio; ‘Mlima Hori’ ni umbo la kawaida la jina hilo katika Kiswahili, na ‘huko’ linaonyesha mahali kwa lugha ya asili.
- source_word: עַל גְּבוּל אֶרֶץ אֱדוֹם
  choice: kwenye mpaka wa nchi ya Edomu
  rationale: Tafsiri hii inaonyesha wazi mpaka wa eneo la Edomu bila kuufanya kuwa sehemu ya ndani ya nchi hiyo.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Neno hili hutanguliza maneno ya moja kwa moja yanayofuata katika mstari unaofuata; ‘akisema’ linadumisha muundo huo.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova; Yahweh
  rationale: Maandishi ya Kiebrania yana jina binafsi YHWH. ‘Yahwe’ hulihifadhi kama jina na ni umbo linalolingana na tahajia ya Kiswahili, bila kuamua zaidi ya ushahidi wa matini kuhusu matamshi yake ya kale.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akawaambia’ ni cha kawaida zaidi kuliko ‘akasema kwa,’ huku ‘akisema’ mwishoni kikihifadhi utangulizi wa maneno yanayofuata. Alama ya tanbihi imewekwa baada ya jina la Mungu, ambalo ndilo tanbihi inalolifafanua.
