base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/029.yaml
  text: When all the congregation saw that Aaron had died[b][a], all the house of Israel wept for Aaron thirty days.
translation:
  language: sw
  text: Kusanyiko lote liliona kwamba Aroni alikuwa amekufa[a], na nyumba yote ya Israeli[b] ikamlilia Aroni kwa siku thelathini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lilitambua kwamba Aroni alikuwa amekufa.” Kiebrania husema kihalisi, “liliona kwamba Aroni alikuwa amekufa”; hapa “kuona” kunaweza kujumuisha kutambua ukweli huo.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba yote ya Israeli” ni usemi wa kijumuiya unaomaanisha watu wote wa Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: lilipoona
  rationale: Kitenzi ראה kwa kawaida humaanisha ‘kuona’; hapa kinaweza pia kumaanisha kutambua ukweli wa kifo cha Aroni. ‘Lilipoona’ huhifadhi picha ya Kiebrania na tanbihi huonyesha maana nyingine inayowezekana.
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה humaanisha jumuiya ya Waisraeli iliyokusanyika. ‘Kusanyiko lote’ ni lugha ya kawaida, yenye heshima, na inafaa simulizi la Pentateuki.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי inaanzisha jambo waliloliona au kulitambua, yaani kwamba Aroni alikuwa amekufa.
- source_word: גָוַע
  choice: alikuwa amekufa
  rationale: גוע ni neno la heshima linaloeleza kufa au kukata roho. ‘Alikuwa amekufa’ ni wazi na huonyesha kwamba kifo kilikuwa kimetokea kabla ya kusanyiko kuona au kutambua.
- source_word: וַיִּבְכּוּ
  choice: ikamlilia
  rationale: בכה humaanisha kulia. ‘Ikamlilia’ huhifadhi hisia ya kulia kwa sababu ya Aroni, badala ya kutumia neno pana zaidi ‘kuomboleza’.
- source_word: אֶת אַהֲרֹן
  choice: Aroni
  rationale: Baada ya בכה, kiashiria cha yambwa humtaja mtu anayeliliwa. Katika Kiswahili, kiambishi ‘-m-’ katika ‘ikamlilia’ humwakilisha Aroni kwa kawaida.
- source_word: שְׁלֹשִׁים יוֹם
  choice: kwa siku thelathini
  rationale: Kirai hiki ni muda wa kitendo. Kiswahili cha kawaida hutumia ‘kwa siku thelathini’ kueleza muda huo wazi.
- source_word: כֹּל בֵּית יִשְׂרָאֵל
  choice: nyumba yote ya Israeli
  rationale: בֵּית יִשְׂרָאֵל ni usemi wa kijumuiya unaowataja watu wote wa Israeli. ‘Nyumba yote ya Israeli’ huhifadhi usemi huo wa Kiebrania na maana yake ya pamoja.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. Muundo ‘lilipoona kwamba’ ni wa kawaida, huku ‘nyumba yote ya Israeli’ ukihifadhi taswira ya kijumuiya ya maandishi ya Kiebrania.
