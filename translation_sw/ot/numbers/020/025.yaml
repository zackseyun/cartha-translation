lexical_decisions:
- source_word: קַח
  choice: Wachukue
  rationale: Ni amri ya Qal kwa Musa yenye maana ya ‘chukua.’ Kiambishi cha yambwa wa- kinawahusu Aroni na Eleazari kwa pamoja na ni cha kawaida katika Kiswahili.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Umbo la jina hili lililozoeleka katika Biblia za Kiswahili.
- source_word: אֶלְעָזָר
  choice: Eleazari
  rationale: Umbo la jina hili lililozoeleka katika Biblia za Kiswahili.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: 'Kiambishi cha nafsi ya tatu umoja kinamrejelea Aroni kwa kawaida katika muktadha huu: Eleazari ni mwana wa Aroni.'
- source_word: וְהַעַל
  choice: uwapandishe
  rationale: Hii ni amri ya Hiphil ya עלה, yenye maana ya kisababishi, ‘wafanye wapande’ au ‘wapandishe.’ ‘Uwapandishe’ huhifadhi maana hiyo na kusikika kwa kawaida.
- source_word: אֹתָם
  choice: wa-
  rationale: Kiwakilishi cha yambwa wingi kinachowarejelea Aroni na Eleazari kimewakilishwa na kiambishi wa- katika ‘uwapandishe.’
- source_word: הֹר הָהָר
  choice: Mlima Hori
  rationale: Ingawa muundo wa Kiebrania ni kihalisi ‘Hori, mlima,’ ‘Mlima Hori’ ni mpangilio wa kawaida na wa asili wa jina la mahali katika Kiswahili.
