  text: Lakini Edomu akamwambia, “Hutapita katika nchi yangu[a], la sivyo nitatoka kukukabili[b] kwa upanga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kupitia kwangu” au “ndani yangu.” Edomu anazungumza kama taifa na eneo, hivyo maana yake ni kupita katika nchi ya Edomu.
