lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Kitenzi אמר pamoja na אֵלָיו kinaonyesha kusema kwa mtu fulani; “akamwambia” ni simulizi la kawaida na la asili katika Kiswahili.
- source_word: אֱדוֹם
  choice: Edomu
  rationale: Jina la taifa na eneo limeandikwa kwa namna iliyozoeleka katika Kiswahili, huku taifa likionyeshwa kana kwamba ni msemaji mmoja.
- source_word: לֹא תַעֲבֹר
  choice: Hutapita
  rationale: Kauli hii ni katazo lenye nguvu au tamko la kukataa kuruhusu kupita; “Hutapita” huhifadhi uzito huo bila kuifanya kuwa amri ya moja kwa moja.
- source_word: בִּי
  choice: katika nchi yangu
  rationale: Kihalisi ni “ndani yangu” au “kupitia kwangu,” lakini Edomu anazungumza kama taifa/eneo; Kiswahili cha asili kinaeleza maana ya kupita katika nchi yake.
- source_word: פֶּן
  choice: la sivyo
  rationale: Katika tishio hili, פֶּן linatanguliza matokeo yatakayotokea ikiwa katazo halitatii; “la sivyo” ni la kawaida na wazi katika Kiswahili.
- source_word: אֵצֵא
  choice: nitatoka
  rationale: Qal imperfect nafsi ya kwanza umoja ya יצא ina maana ya kutoka; wakati ujao unafaa katika tishio hili.
- source_word: לִקְרָאתֶךָ
  choice: kukukabili
  rationale: Kihalisi ni kwenda kukutana na mtu, lakini hapa muktadha wa silaha unaonyesha wazi kukutana naye kwa uhasama.
- source_word: בַּחֶרֶב
  choice: kwa upanga
  rationale: Ni usemi wa Kiebrania unaoonyesha hatua ya kivita kwa kutumia upanga; tafsiri hii ni fupi na ya asili.
