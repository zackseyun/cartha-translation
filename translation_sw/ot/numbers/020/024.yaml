base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/024.yaml
  text: Aaron will be gathered to his people[a], because he will not enter the land that I have given to the sons of Israel[b], because you rebelled against my command at the waters of Meribah.
translation:
  language: sw
  text: Haruni atakusanywa pamoja na watu wake[a], kwa maana hataingia katika nchi niliyowapa wana wa Israeli, kwa sababu mliiasi amri yangu[b] katika maji ya Meriba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huu ni usemi wa Kiebrania unaotumiwa kuhusu kifo; kwa kawaida humaanisha kukusanywa pamoja na watu wa ukoo wake.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni, ‘mliasi kinywa changu,’ yaani amri yangu niliyotamka.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף אֶל־עַמָּיו
  choice: atakusanywa kwa watu wake
  rationale: Inahifadhi tamathali ya Kiebrania kuhusu kufa na kujiunga na watu wa ukoo, badala ya kuifupisha kuwa ‘atakufa.’ Tanbihi inaeleza maana yake bila kuondoa uzito wa usemi wa asili.
- source_word: כִּי לֹא יָבֹא אֶל־הָאָרֶץ
  choice: kwa maana hataingia katika nchi
  rationale: ‘Hataingia katika nchi’ ni Kiswahili cha kawaida kinachowakilisha kwa usahihi kitenzi cha mwendo pamoja na kihusishi; כִּי hapa inaeleza sababu.
- source_word: אֲשֶׁר נָתַתִּי
  choice: niliyowapa
  rationale: Wakati uliopita unaonyesha kwamba Mungu ameitoa nchi hiyo kwa hakika, huku kiambishi ‘-pa’ kikielekeza zawadi kwa wana wa Israeli.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi muundo wa kawaida wa Kiebrania, ‘wana wa Israeli,’ badala ya kuubadili kuwa jina la kitaifa lisiloonyesha muundo huo.
- source_word: מְרִיתֶם
  choice: mliiasi
  rationale: Kitenzi cha wingi kinawahusu walioambiwa, na ‘kuasi’ hudumisha uzito wa kosa la kukaidi mamlaka ya Mungu.
- source_word: אֶת־פִּי
  choice: amri yangu
  rationale: Kiswahili cha kawaida hutumia ‘amri yangu’ kueleza nahau ya Kiebrania ‘kinywa changu,’ yaani amri iliyotamkwa na Mungu.
- source_word: לְמֵי מְרִיבָה
  choice: kwenye maji ya Meriba
  rationale: Huhifadhi jina maalumu Meriba na kutaja maji yanayohusishwa na mahali na tukio hilo.
theological_decisions:
- issue: Nahau ya kufa, ‘kukusanywa kwa watu wake’
  choice: Kuhifadhi nahau katika matini kuu
  alternative: ‘Haruni atakufa’ au ‘Haruni ataungana na mababu zake’
  rationale: Nahau inaashiria kufa na kuwa pamoja na watu wa ukoo, lakini haipaswi kufafanuliwa kiasi cha kuingiza fundisho mahususi kuhusu hali ya baada ya kifo.
- issue: Maana ya ‘kinywa changu’
  choice: ‘amri yangu’ katika matini, huku maana halisi ikiwekwa katika tanbihi
  alternative: ‘kinywa changu’ au ‘neno langu’
  rationale: Hii huwasilisha maana ya nahau kwa uwazi bila kuficha kwamba Kiebrania kinatumia taswira ya kinywa cha Mungu.
- issue: Wingi katika מְרִיתֶם
  choice: ‘mliiasi’
  alternative: ‘uliasi’
  rationale: Umbo la Kiebrania ni la nafsi ya pili wingi, hivyo hukumu haielekezwi kwa Haruni peke yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa msomaji wa kawaida. Muundo wa Kiebrania umehifadhiwa pale unapobeba uzito wa kifasihi au kiteolojia, huku nahau isiyo ya kawaida ikifafanuliwa kwa tanbihi.
