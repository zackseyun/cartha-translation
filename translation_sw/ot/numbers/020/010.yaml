base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/010.yaml
  text: 'Then Moses and Aaron assembled the assembly before the rock, and he said to them, “Listen now, you rebels: shall we bring out water for you from this rock?”'
translation:
  language: sw
  text: Ndipo Musa na Aroni wakakusanya kusanyiko mbele ya mwamba, naye akawaambia, “Sikilizeni sasa, enyi waasi! Je, tuwatolee maji kutoka katika mwamba huu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְהִלוּ
  choice: wakalileta kusanyiko
  rationale: Hifili ya קהל ina maana ya kusababisha watu wakusanyike. Kiswahili hiki kinaonyesha tendo la Musa na Aroni la kulikusanya na kulileta kundi mahali pa mwamba kwa njia ya kawaida.
- source_word: הַקָּהָל
  choice: kusanyiko
  rationale: Neno קָהָל humaanisha jamii iliyokusanyika. “Kusanyiko” ni la kawaida na lenye heshima, huku likihifadhi uhusiano wa kimaana na kitenzi cha kukusanya bila kuingiza maana maalumu ya kidhehebu.
- source_word: אֶל־פְּנֵי הַסָּלַע
  choice: mbele ya mwamba
  rationale: Hii ndiyo maana ya kawaida ya nahau hiyo ya Kiebrania na ni Kiswahili cha asili.
- source_word: וַיֹּאמֶר
  choice: naye akawaambia
  rationale: Kitenzi cha Kiebrania ni cha umoja na kinamrejelea Musa baada ya kiima ambatano Musa na Aroni. “Naye” huhifadhi umoja huo bila kumtaja Musa tena; “akawaambia” huweka wazi walengwa wanaotajwa na לָהֶם.
- source_word: שִׁמְעוּ נָא
  choice: Sikilizeni sasa
  rationale: Amri ya wingi שִׁמְעוּ ni “sikilizeni,” na נָא hapa huongeza msisitizo au uharaka unaowasilishwa vizuri na “sasa.”
- source_word: הַמֹּרִים
  choice: enyi waasi
  rationale: Ni matumizi ya kishirikishi kama nomino kutoka מרה, yaani watu wenye kuasi. “Enyi waasi” ni karipio la moja kwa moja na lenye hadhi.
- source_word: הֲמִן הַסֶּלַע הַזֶּה
  choice: kutoka katika mwamba huu
  rationale: Kiambishi cha swali pamoja na מן huonyesha chanzo. “Kutoka katika” hudumisha wazo la maji kutoka ndani ya mwamba.
- source_word: נוֹצִיא
  choice: Je, tuwatolee
  rationale: Hifili ya יצא humaanisha kusababisha kitu kitoke au kukitoa. “Tuwatolee” huonyesha nafsi ya kwanza wingi, swali, kitendo cha kutoa, na walengwa “kwa ajili yenu” kwa Kiswahili cha asili.
- source_word: מָיִם
  choice: maji
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa מַיִם.
theological_decisions:
- issue: Nafsi ya kwanza wingi katika swali la Musa
  choice: Je, tuwatolee maji kutoka katika mwamba huu?
  alternative: Je, tutoe maji kwa ajili yenu kutoka katika mwamba huu?
  rationale: Kiebrania kinatumia wazi nafsi ya kwanza wingi נוֹצִיא. Tafsiri inadumisha mvutano kuhusu nafasi ya Musa na Aroni ikilinganishwa na utendaji wa Mungu, bila kuusuluhisha kimafundisho ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi “Ndipo ... waka-” unafaa mtiririko wa habari; karipio na swali la balagha vimehifadhiwa kwa ukali wake.
