base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/005.yaml
  text: And why have you brought us up out of Egypt to bring us into this evil place? It is not a place of grain[a], or figs, or vines, or pomegranates[c][b], and there is no water to drink.
translation:
  language: sw
  text: Na kwa nini mlitupandisha kutoka Misri ili kutuleta mahali hapa pabaya?[a] Hapa si mahali pa kupanda mbegu,[b] wala hakuna tini, mizabibu, au makomamanga; tena hakuna maji ya kunywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali hapa pasipofaa” au “mahali hapa pa taabu.” Neno la Kiebrania hapa halimaanishi lazima uovu wa kimaadili, bali mahali pabaya au penye madhara.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mahali pa mbegu”; huenda ikamaanisha mahali panapofaa kwa kupanda au panapozalisha nafaka na mazao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Nanyi, kwa nini
  rationale: Kiunganishi וְ kinaendeleza malalamiko yaliyotangulia, na swali linaelekezwa kwa Musa na Haruni; muundo huu ni wa kawaida katika Kiswahili.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: mlitupandisha kutoka Misri
  rationale: Hifili ya עלה huhifadhi taswira ya kupandishwa kutoka Misri na ina kiambishi cha nafsi ya pili wingi.
- source_word: לְהָבִיא אֹתָנוּ
  choice: ili kutuleta
  rationale: Infinitivu inaonyesha kusudi au matokeo; 'ili kutuleta' ni wazi bila kuongeza wazo lisilokuwamo.
- source_word: אֶל־הַמָּקוֹם הָרָע הַזֶּה
  choice: mahali hapa pabaya
  rationale: רַע hapa inaeleza mahali penye madhara au pasipofaa, si lazima uovu wa kimaadili.
- source_word: לֹא מְקוֹם זֶרַע
  choice: Hapa si mahali pa kupanda mbegu
  rationale: Neno זֶרַע ni 'mbegu,' lakini usemi mzima huenda unamaanisha mahali panapofaa kwa kupanda; tafsiri hii ni ya asili na inahifadhi taswira ya kilimo.
- source_word: וּתְאֵנָה וְגֶפֶן וְרִמּוֹן
  choice: wala hakuna tini, mizabibu, au makomamanga
  rationale: Orodha inataja mazao au mimea inayokosekana. 'Mizabibu' huwakilisha גֶפֶן, yaani mimea ya zabibu, huku 'tini' na 'makomamanga' zikisomeka kwa kawaida.
- source_word: וּמַיִם אַיִן לִשְׁתּוֹת
  choice: tena hakuna maji ya kunywa
  rationale: Muundo wa אַיִן unaonyesha kutokuwapo kwa maji ya kunywa; tafsiri ni ya kawaida na mwaminifu.
