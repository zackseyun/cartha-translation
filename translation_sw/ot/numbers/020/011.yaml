base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/011.yaml
  text: Then Moses raised his hand and struck the rock with his staff twice, and abundant water came out, and the congregation drank, along with their livestock.
translation:
  language: sw
  text: Ndipo Musa akainua mkono wake, akaupiga mwamba kwa fimbo yake mara mbili. Maji mengi yakatoka, na kusanyiko likanywa, pamoja na mifugo yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם
  choice: akainua
  rationale: Kitenzi רום katika Hifili hapa kina maana ya kuinua; “akainua” ni Kiswahili cha kawaida na kinahifadhi tendo la kimwili.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Hii ni tafsiri ya moja kwa moja ya nomino ya umoja yenye kiambishi cha nafsi ya tatu ya kiume.
- source_word: וַיַּךְ
  choice: akaupiga
  rationale: נכה humaanisha kupiga; “akaupiga” ni wazi, asilia, na inaonyesha yambwa “mwamba” kwa upatanisho wa Kiswahili.
- source_word: הַסֶּלַע
  choice: mwamba
  rationale: סֶלַע humaanisha mwamba au jabali; “mwamba” ndiyo neno la kawaida na linalofaa katika muktadha huu.
- source_word: בְּמַטֵּהוּ
  choice: kwa fimbo yake
  rationale: מַטֶּה inaweza kumaanisha fimbo; “kwa fimbo yake” ni ya kawaida katika simulizi la Musa na inaonyesha chombo alichotumia.
- source_word: פַּעֲמָיִם
  choice: mara mbili
  rationale: Umbo la uwili linaelezwa kwa Kiswahili cha kawaida kama “mara mbili.”
- source_word: וַיֵּצְאוּ מַיִם רַבִּים
  choice: Maji mengi yakatoka
  rationale: רַבִּים inaonyesha wingi wa maji; “maji mengi” ni tafsiri sahihi na ya asili kuliko usemi mzito wa “maji tele yakatoka.”
- source_word: הָעֵדָה
  choice: kusanyiko
  rationale: עֵדָה humaanisha jumuiya ya Israeli iliyokusanyika; “kusanyiko” huhifadhi dhana ya kundi lililokusanyika bila kulifanya kuwa istilahi ya dhehebu.
- source_word: וּבְעִירָם
  choice: pamoja na mifugo yao
  rationale: בְּעִיר ni neno pana kwa wanyama wanaofugwa; “mifugo” ni sahihi na ya kisasa, bila kulibana kuwa ng’ombe pekee.
- source_word: וַתֵּשְׁתְּ
  choice: wakanywa
  rationale: Ingawa kitenzi cha Kiebrania ni cha kike umoja kwa kupatana na nomino ya mkusanyiko עֵדָה, Kiswahili kwa kawaida hutumia upatanisho wa watu kwa “kusanyiko” katika sentensi hii; mifugo pia imejumuishwa kama wahusika waliokunywa.
theological_decisions:
- issue: Namna ya kusimulia tendo la Musa dhidi ya mwamba
  choice: Kusema tu kwamba aliupiga mwamba mara mbili kwa fimbo yake
  alternative: Kuongeza katika mstari wenyewe maneno yanayoeleza wazi kuwa tendo hilo lilikuwa kutotii
  rationale: Muktadha mpana unaonyesha uzito na kosa la tendo la Musa, lakini mstari huu wenyewe unasimulia tendo na matokeo yake. Tafsiri haiongezi hukumu ya kitheolojia ambayo haijaelezwa moja kwa moja hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Muundo umegawanywa katika sentensi mbili ili usomeke kwa urahisi bila kupoteza mfuatano wa viunganishi vya Kiebrania. Hakuna tanbihi zinazohitajika.
