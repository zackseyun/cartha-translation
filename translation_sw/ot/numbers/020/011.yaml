  source_fidelity: 'Rasimu inafuata kwa usahihi matendo ya msingi katika Kiebrania: Musa anainua mkono wake, anaupiga mwamba kwa fimbo yake mara mbili, maji mengi yanatoka, na kusanyiko pamoja na mifugo yao wanapata maji ya kunywa. Hata hivyo, muundo wa mwisho wenye kitenzi kimoja cha wingi kwa ''kusanyiko pamoja na mifugo yao'' hufifisha upatanisho na utekelezaji tofauti unaoeleweka wa wahusika hawa wawili.'
