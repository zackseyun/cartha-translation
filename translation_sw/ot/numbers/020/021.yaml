lexical_decisions:
- source_word: וַיְמָאֵן
  choice: alikataa
  rationale: Kitenzi מאן kinaonyesha kukataa au kutokuwa tayari; “alikataa” ni cha kawaida na chenye nguvu inayofaa katika simulizi.
- source_word: אֱדוֹם
  choice: Edomu
  rationale: Jina la taifa limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: נְתֹן
  choice: kuwaruhusu
  rationale: Pamoja na מאן, נתן hapa ina maana ya kuruhusu; Kiswahili cha asili hutumia “alikataa kuwaruhusu.”
- source_word: עֲבֹר
  choice: wapite
  rationale: עבר katika muktadha wa eneo humaanisha kusafiri kwa kupita ndani yake.
- source_word: בִּגְבֻלוֹ
  choice: katika eneo lake
  rationale: גְּבוּל inaweza kuwa mpaka au eneo; hapa ombi ni la kupita katika nchi ya Edomu, hivyo “eneo lake” huwasilisha maana kwa kawaida.
- source_word: וַיֵּט
  choice: wakageuka wakaenda mbali
  rationale: נטה humaanisha kugeuka au kwenda kando; msemo huu unaonyesha kwa uwazi kwamba Israeli walibadili njia na kuondoka.
- source_word: מֵעָלָיו
  choice: naye
  rationale: Kirai hiki kinaonyesha kuondoka kutoka kwa Edomu; “mbali naye” ni usemi wa kawaida katika Kiswahili.
