  text: קַ֣ח אֶת הַ/מַּטֶּ֗ה וְ/הַקְהֵ֤ל אֶת הָ/עֵדָה֙ אַתָּה֙ וְ/אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/דִבַּרְתֶּ֧ם אֶל הַ/סֶּ֛לַע לְ/עֵינֵי/הֶ֖ם וְ/נָתַ֣ן מֵימָ֑י/ו וְ/הוֹצֵאתָ֨ לָ/הֶ֥ם מַ֨יִם֙ מִן הַ/סֶּ֔לַע וְ/הִשְׁקִיתָ֥ אֶת הָ/עֵדָ֖ה וְ/אֶת בְּעִירָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/008.yaml
  text: Take the staff[a], and assemble the congregation, you and Aaron your brother, and speak to the rock before their eyes, and it will give its water[d][c][b]. Then you shall bring out water for them from the rock and give drink to the congregation and to their livestock.
translation:
  language: sw
  text: “Chukua fimbo[a], kisha ukutanishe kusanyiko, wewe pamoja na ndugu yako Aroni. Ninyi wawili mseme na mwamba mbele ya macho yao, nao mwamba utatoa maji yake. Kisha utawatolea maji kutoka mwambani na uwanyweshe kusanyiko na mifugo yao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “gongo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּטֶּה
  choice: fimbo
  rationale: מַטֶּה humaanisha fimbo au gongo. “Fimbo” ni neno la kawaida na lenye hadhi linalofaa kwa kitu ambacho Musa anaagizwa kuchukua.
- source_word: הָעֵדָה
  choice: kusanyiko
  rationale: עֵדָה hapa ni jumuiya ya Israeli iliyokusanyika. “Kusanyiko” huhifadhi wazo la watu waliokusanywa bila kuingiza maana ya dhehebu.
- source_word: וְדִבַּרְתֶּם אֶל הַסֶּלַע
  choice: nanyi mtauambie mwamba
  rationale: Kitenzi cha Kiebrania ni cha wingi na kinawahusu Musa na Aroni. “Mtauambie mwamba” ni Kiswahili cha kawaida kinachohifadhi amri ya kusema moja kwa moja na mwamba.
- source_word: לְעֵינֵיהֶם
  choice: mbele ya macho yao
  rationale: Tafsiri hii huhifadhi taswira ya nahau ya Kiebrania na kusisitiza kwamba tendo hilo lingefanyika hadharani, watu wakiliona.
- source_word: וְנָתַן מֵימָיו
  choice: nao utatoa maji yake
  rationale: Mwamba ndiye kiima cha kitenzi cha umoja. “Maji yake” huhifadhi kiambishi cha umilikaji cha Kiebrania.
- source_word: וְהוֹצֵאתָ לָהֶם מַיִם מִן הַסֶּלַע
  choice: kisha utawatolea maji kutoka mwambani
  rationale: Kauli ya kusababisha ya יצא ni kutoa au kufanya yatoke. “Utawatolea” pia huhifadhi maana kwamba maji hayo ni kwa ajili yao.
- source_word: וְהִשְׁקִיתָ
  choice: kuwanywesha
  rationale: Kauli ya kusababisha ya שקה ina maana ya kuwapa kinywaji au kuwafanya wanywe. “Kuwanywesha” ni ya asili na sahihi katika Kiswahili.
- source_word: בְּעִירָם
  choice: mifugo yao
  rationale: בְּעִיר hurejelea wanyama wa kufugwa au wanyama wa nyumbani. “Mifugo” ni neno pana, wazi, na la kawaida.
- source_word: אַתָּה וְאַהֲרֹן אָחִיךָ
  choice: wewe pamoja na ndugu yako Aroni
  rationale: Kauli hii inawataja wazi viongozi hao wawili. Mpangilio huu ni wa asili katika Kiswahili na huhifadhi uhusiano wao.
theological_decisions:
- issue: Tendo hilo kufanywa hadharani
  choice: “mbele ya macho yao”
  alternative: “mbele yao” au “wakiona”
  rationale: Nahau לְעֵינֵיהֶם inasisitiza ushuhuda wa wazi wa watu. Taswira hiyo imehifadhiwa kwa sababu ni muhimu katika mwendelezo wa simulizi.
- issue: Wanaopewa amri ya kuzungumza na mwamba
  choice: Kitenzi cha wingi “mtauambie” kinawahusisha Musa na Aroni
  alternative: Kumwelekeza Musa peke yake kwa kitenzi cha umoja
  rationale: Maandishi ya Kiebrania yana kitenzi cha nafsi ya pili wingi, hivyo tafsiri haipaswi kuondoa ushiriki wa Aroni katika amri hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa amri na mfuatano wa matendo umehifadhiwa, pamoja na wingi wa kitenzi kinachowaagiza Musa na Aroni.
