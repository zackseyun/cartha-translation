review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Moses’ removal of Aaron’s garments, their placement on Eleazar, Aaron’s death, and the descent of Moses and Eleazar. However, the main text’s “juu ya mlima” can mean merely “on the mountain” and does not adequately represent בְּרֹאשׁ הָהָר, “at the top/summit of the mountain.”
  naturalness: The Swahili is clear, idiomatic, and appropriately dignified for biblical narrative. “Kileleni mwa mlima” is both natural Standard East African Swahili and more precise than “juu ya mlima.”
  terminology: “Mavazi,” “akamvua,” and “akamvika” are suitable, without importing “priestly” into the main text. The contextual explanatory footnote appropriately identifies the garments’ official priestly function. The established biblical name forms Musa, Aroni, and Eleazari are appropriate.
  issues:
  - severity: medium
    issue: The phrase “huko juu ya mlima” weakens the locational specificity of the Hebrew.
    rationale: בְּרֹאשׁ הָהָר specifically denotes the mountain’s top or summit. “Juu ya mlima” may simply mean “on the mountain”; “kileleni mwa mlima” preserves the source meaning.
  revised_text: Musa akamvua Aroni mavazi yake, akamvika mwanawe Eleazari mavazi hayo[a]. Aroni akafa huko, kileleni mwa mlima[b]. Kisha Musa na Eleazari wakashuka kutoka mlimani.
