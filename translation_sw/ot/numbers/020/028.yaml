id: NUM.20.28
reference: Numbers 20:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּפְשֵׁט֩ מֹשֶׁ֨ה אֶֽת אַהֲרֹ֜ן אֶת בְּגָדָ֗י/ו וַ/יַּלְבֵּ֤שׁ אֹתָ/ם֙ אֶת אֶלְעָזָ֣ר בְּנ֔/וֹ וַ/יָּ֧מָת אַהֲרֹ֛ן שָׁ֖ם בְּ/רֹ֣אשׁ הָ/הָ֑ר וַ/יֵּ֧רֶד מֹשֶׁ֛ה וְ/אֶלְעָזָ֖ר מִן הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/028.yaml
  text: So Moses stripped Aaron of his garments and put them on Eleazar his son[a], and Aaron died there on the top of the mountain[b]. Then Moses and Eleazar came down from the mountain.
translation:
  language: sw
  text: Musa akamvua Aroni mavazi yake, akamvika mwanawe Eleazari mavazi hayo[a]. Aroni akafa huko, kileleni mwa mlima[b]. Kisha Musa na Eleazari wakashuka kutoka mlimani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mavazi rasmi ya ukuhani ya Aroni yalihamishiwa kwa Eleazari kama sehemu ya kumrithisha wadhifa unaoelezwa katika muktadha.
    reason: cultural_note
  - marker: b
    text: Au, “juu ya mlima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשֵׁט
  choice: akamvua
  rationale: Hifili ya פשט hapa humaanisha kumvua mtu mavazi. ‘Akamvua’ ni Kiswahili cha kawaida na huonyesha wazi kwamba Musa ndiye aliyeyaondoa mavazi ya Aroni.
- source_word: בְּגָדָיו
  choice: mavazi yake
  rationale: בגד ni neno la jumla kwa mavazi. Tafsiri hii inadumisha uzito wa lugha bila kuongeza ‘ya ukuhani’ katika matini kuu, ingawa muktadha unaonyesha kazi yake rasmi.
- source_word: וַיַּלְבֵּשׁ אֹתָם אֶת אֶלְעָזָר בְּנוֹ
  choice: akamvika mwanawe Eleazari mavazi hayo
  rationale: Hifili ya לבש humaanisha kumvika mtu. Kurudia ‘mavazi hayo’ badala ya kutumia kiwakilishi pekee huleta uwazi na mtiririko wa asili katika Kiswahili.
- source_word: וַיָּמָת
  choice: akafa
  rationale: מות ni kitenzi cha kawaida chenye maana ya kufa; ‘akafa’ ni tafsiri ya moja kwa moja isiyotumia tasfida.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki kinaonyesha mahali Aroni alipofia. ‘Huko’ kinarejelea kwa kawaida mahali palipotajwa katika simulizi.
- source_word: בְּרֹאשׁ הָהָר
  choice: juu ya mlima
  rationale: ראשׁ, kihalisi ‘kichwa,’ hapa ni kilele au sehemu ya juu ya mlima. ‘Juu ya mlima’ ni usemi wa kawaida wa Kiswahili unaohifadhi taswira ya mahali.
- source_word: וַיֵּרֶד
  choice: wakashuka
  rationale: ירד humaanisha kushuka. Umbo la wingi linawajumuisha Musa na Eleazari, ambao ndio kiima kilichounganishwa katika sentensi ya Kiswahili.
- source_word: מִן הָהָר
  choice: kutoka mlimani
  rationale: Kirai hiki kinaonyesha mahali walikotoka. ‘Kutoka mlimani’ ni tafsiri ya asili na sahihi katika Kiswahili.
theological_decisions:
- issue: Asili na kazi ya mavazi ya Aroni yaliyohamishiwa kwa Eleazari
  choice: Matini kuu inasema ‘mavazi yake’ bila kuongeza ‘ya ukuhani.’
  alternative: ‘mavazi yake ya ukuhani’ au ‘joho zake za ukuhani’
  rationale: Muktadha unaonyesha kuwa haya ni mavazi rasmi ya ukuhani mkuu na kwamba kuvikwa kwa Eleazari kunahusiana na urithi wa wadhifa huo. Hata hivyo, aya yenyewe hutumia nomino ya jumla בגד, hivyo ufafanuzi huo umewekwa katika tanbihi badala ya kuongezwa kwenye matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye hadhi. ‘Basi’ na ‘kisha’ huonyesha mfuatano wa matukio; majina yametolewa kwa maumbo yaliyozoeleka katika Biblia ya Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
