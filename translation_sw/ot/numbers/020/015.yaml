base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/015.yaml
  text: And our fathers went down to Egypt[a], and we lived in Egypt many days[c][b], and the Egyptians treated us and our fathers badly.
translation:
  language: sw
  text: Baba zetu walishuka kwenda Misri[a], nasi tukakaa Misri kwa muda mrefu[b], nao Wamisri waliwatendea mabaya sisi na baba zetu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mababu zetu walishuka kwenda Misri”; Kiebrania ni “baba zetu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “siku nyingi,” yaani, kwa kipindi kirefu.
    reason: lexical_alternative
  - marker: c
    text: Au, “Wamisri walitutendea vibaya sisi na baba zetu,” au “Wamisri walitenda mabaya dhidi yetu na baba zetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: walishuka kwenda
  rationale: Huhifadhi maana ya kawaida ya ירד ya kushuka, pamoja na mwendo kuelekea Misri, kwa Kiswahili cha kawaida.
- source_word: אֲבֹתֵינוּ
  choice: baba zetu
  rationale: Hufuata maana halisi ya אָבוֹת na kudumisha mtindo wa kifamilia na kihistoria; katika muktadha huu inawahusu pia mababu au wahenga.
- source_word: מִצְרַיְמָה
  choice: Misri
  rationale: He ya uelekeo inaonyesha mwendo kuelekea Misri; katika kishazi 'walishuka kwenda Misri,' uelekeo huo umeonyeshwa wazi.
- source_word: וַנֵּשֶׁב
  choice: tukakaa
  rationale: ישב hapa humaanisha kukaa au kuishi mahali kwa kipindi fulani. 'Tukakaa' ni ya asili na haiashirii kwa lazima makazi ya kudumu.
- source_word: יָמִים רַבִּים
  choice: kwa muda mrefu
  rationale: Ingawa maana ya neno kwa neno ni 'siku nyingi,' hapa ni nahau inayomaanisha kipindi kirefu; tafsiri hii ni ya kawaida kwa Kiswahili bila kuongeza 'miaka.'
- source_word: וַיָּרֵעוּ
  choice: wakatutendea vibaya
  rationale: Hiphil ya רעע pamoja na ל inaeleza kutenda mabaya au kusababisha madhara kwa walioathiriwa. Kauli hii huhifadhi upana wa maana bila kuibana kuwa aina moja tu ya unyanyasaji.
- source_word: מִצְרַיִם
  choice: Wamisri
  rationale: Ingawa umbo hilo ni jina 'Misri,' kitenzi cha wingi kinaonyesha kuwa watu wa Misri ndio watendaji; 'Wamisri' ni wazi na ya asili.
- source_word: לָנוּ
  choice: sisi
  rationale: ל humtambulisha aliyeathiriwa. 'Sisi' baada ya 'wakatutendea vibaya' ni ya asili na inasaidia kuhifadhi utofautishaji na 'baba zetu.'
- source_word: וְלַאֲבֹתֵינוּ
  choice: na baba zetu
  rationale: Marudio ya chanzo yamehifadhiwa ili kuonyesha kwamba madhara yaliwapata wao na vizazi vilivyowatangulia.
