  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetumia viunganishi vya mfululizo ('nasi', 'nao') kwa mtiririko wa asili. 'Baba zetu' imehifadhiwa katika matini kuu kwa ukaribu na Kiebrania, huku maana pana ya 'mababu/wahenga' ikielezwa katika tanbihi.
