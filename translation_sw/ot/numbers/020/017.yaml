  text: נַעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ לֹ֤א נַעֲבֹר֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם וְ/לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר דֶּ֧רֶךְ הַ/מֶּ֣לֶךְ נֵלֵ֗ךְ לֹ֤א נִטֶּה֙ יָמִ֣ין וּ/שְׂמֹ֔אול עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבוּלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/017.yaml
  text: Please let us pass through your land[a]. We will not pass through field or vineyard, and we will not drink water from a well. We will go by the king’s road[b]; we will not turn to the right or to the left until we have passed through your border.
translation:
  language: sw
  text: “Tafadhali, turuhusu tupite katika nchi yako. Hatutapita katika mashamba wala mashamba ya mizabibu, wala hatutakunywa maji ya kisima. Tutafuata njia ya mfalme[a]; hatutageuka kulia wala kushoto mpaka tutakapovuka mpaka wa nchi yako[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “barabara ya mfalme.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linalotafsiriwa “mpaka” linaweza pia kumaanisha “eneo” au “nchi”; hapa maana ni kuendelea hadi kuvuka mpaka wa nchi yako.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעְבְּרָה נָּא
  choice: Tafadhali, turuhusu tupite
  rationale: Kauli ya nia pamoja na נָא ni ombi la heshima; tafsiri hii inawasilisha ombi hilo kwa Kiswahili cha kawaida.
- source_word: בְאַרְצֶךָ
  choice: katika nchi yako
  rationale: Pamoja na kitenzi עבר, kirai hiki kinaeleza kupita ndani ya eneo la nchi ya mhusika.
- source_word: לֹא נַעֲבֹר בְּשָׂדֶה וּבְכֶרֶם
  choice: Hatutapitia shamba wala shamba la mizabibu
  rationale: Majina ya umoja yametumika kwa maana ya jumla, na “wala” linaonyesha wazi ahadi ya kuepuka aina zote mbili za mashamba.
- source_word: וְלֹא נִשְׁתֶּה מֵי בְאֵר
  choice: wala hatutakunywa maji ya kisima
  rationale: Hii inatunza maana ya moja kwa moja ya maji yanayotoka katika kisima na mwendelezo wa ahadi hasi.
- source_word: דֶּרֶךְ הַמֶּלֶךְ
  choice: njia ya mfalme
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya ‘njia ya mfalme,’ ikirejelea njia maalumu iliyotambulika.
- source_word: נֵלֵךְ
  choice: Tutafuata
  rationale: Katika muktadha wa kusafiri kwa njia maalumu, “kufuata” ni Kiswahili cha asili kinachoonyesha kutotoka kwenye njia hiyo.
- source_word: לֹא נִטֶּה יָמִין וּשְׂמֹאול
  choice: hatutageuka kulia wala kushoto
  rationale: Tafsiri hii inadumisha jozi ya mielekeo ya Kiebrania na maana ya kutokengeuka kutoka njiani.
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבוּלֶךָ
  choice: mpaka tutakapokuwa tumepita mpaka wako
  rationale: Inahifadhi urudiaji wa mzizi עבר, huku “mpaka wako” ikidumisha uwezekano wa kuelewa גְּבוּל kama mpaka wa eneo au eneo lenyewe.
