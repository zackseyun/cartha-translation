  text: הֵ֚מָּה מֵ֣י מְרִיבָ֔ה אֲשֶׁר רָב֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת יְהוָ֑ה וַ/יִּקָּדֵ֖שׁ בָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/013.yaml
  text: These are the waters of Meribah, where the sons of Israel quarreled with Yahweh, and he showed himself holy among them.
translation:
  language: sw
  text: Haya ndiyo maji ya Meriba[a], ambako wana wa Israeli waligombana na Yahwe, naye akajidhihirisha kuwa mtakatifu kati yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meriba maana yake ni “ugomvi” au “mabishano.”
    reason: lexical_alternative
  - marker: b
    text: Au “naye akaonyeshwa kuwa mtakatifu ndani yao,” au “naye akathibitisha utakatifu wake kupitia kwao.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֵמָּה
  choice: Haya ndiyo
  rationale: Kiwakilishi cha kuonyesha kinayatambulisha maji; muundo huu ni wa kawaida na wenye mkazo wa utambulisho katika Kiswahili.
- source_word: מֵי מְרִיבָה
  choice: maji ya Meriba
  rationale: Meriba limetumiwa kama jina la mahali lililowekwa na simulizi, huku maana yake ya ugomvi ikielezwa katika tanbihi.
- source_word: רָבוּ
  choice: waligombana
  rationale: Kitenzi hiki hueleza kubishana au kuwa katika mgogoro; ‘waligombana’ ni wazi na cha kawaida bila kuwa cha kale.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi umbo la Kiebrania la kiume katika jina hili la jadi la watu wa agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: וַיִּקָּדֵשׁ
  choice: akajidhihirisha kuwa mtakatifu
  rationale: Nifali hapa inaweza kuwa na maana ya kuonekana au kudhihirishwa kuwa mtakatifu; usemi huu wa Kiswahili ni wa asili na hauashirii kwamba wanadamu walimfanya Mungu awe mtakatifu.
- source_word: בָּם
  choice: kati yao
  rationale: Kihusishi kinaweza kumaanisha kati yao, ndani yao, au kupitia kwao; ‘kati yao’ kinafaa katika muktadha huku utata ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri kutakaswa kwa Yahwe katika kishazi cha mwisho
  choice: naye akajidhihirisha kuwa mtakatifu kati yao
  alternative: naye akaonyeshwa kuwa mtakatifu ndani yao / naye akathibitisha utakatifu wake kupitia kwao
  rationale: Huhifadhi wazo la utakatifu wa Yahwe kudhihirika katika tukio hili bila kudai kwamba watu walimfanya kuwa mtakatifu; tanbihi inaonyesha uwezekano wa muundo wa kutendwa na wa kisababishi.
- issue: Jinsi ya kutafsiri בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watoto wa Israeli
  rationale: ‘Wana wa Israeli’ hufuata kwa karibu umbo la Kiebrania na bado ni usemi unaoeleweka katika Kiswahili cha kibiblia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Yahwe’ linahifadhi jina la Mungu, na ‘Meriba’ linahifadhi jina la mahali.
