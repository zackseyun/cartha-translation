  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֶּ֖ה מִ/לִּ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/009.yaml
  text: So Moses took the staff from before Yahweh[a], just as he had commanded him.
translation:
  language: sw
  text: Basi Musa akaichukua ile fimbo kutoka mbele ya Yahweh, kama vile alivyomwamuru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akaichukua
  rationale: 'Qal wayyiqtol ya לקח inaeleza tendo la simulizi lililofuatana: ‘akaichukua.’ Kiambishi -i- kinarejelea fimbo.'
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina מֹשֶׁה katika Kiswahili cha Biblia na matumizi ya Afrika Mashariki.
- source_word: הַמַּטֶּה
  choice: ile fimbo
  rationale: מַטֶּה hapa ni kitu halisi, yaani fimbo. ‘Ile’ huonyesha kuwa ni fimbo iliyotajwa na kutambulishwa katika muktadha uliotangulia.
- source_word: מִלִּפְנֵי
  choice: kutoka mbele za
  rationale: Huhifadhi maana ya mahali ya מִלִּפְנֵי, ‘kutoka mbele ya,’ kwa usemi wa kawaida wa Kiswahili unaofaa pia mazingira ya ibada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama Yahweh badala ya kubadilishwa kuwa cheo.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Huonyesha ulinganifu na kufuata sawasawa amri iliyotangulia kwa Kiswahili cha kawaida.
- source_word: צִוָּהוּ
  choice: alivyomwamuru
  rationale: Pi’el ya צוה pamoja na kiambishi cha nafsi ya tatu ya kiume humaanisha ‘alivyomwamuru.’ Muktadha unatambulisha Yahweh kuwa mtendaji na Musa kuwa mpokeaji wa amri.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni יהוה. ‘Yahweh’ huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo; ‘Yehova’ ni umbo jingine la kimapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mtiririko wa simulizi la Kiebrania pamoja na maana halisi ya mahali katika ‘kutoka mbele za Yahweh.’ Hakuna tanbihi iliyoongezwa kwa sababu ‘fimbo’ ndiyo tafsiri ya kawaida na wazi hapa; tofauti ya Kiingereza ‘rod’ haitokezi tofauti ya maana inayohitaji tanbihi tofauti katika Kiswahili.
