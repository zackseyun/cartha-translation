  yaml_path: translation/ot/numbers/020/002.yaml
  text: There was no water for the congregation[a], and they assembled against Moses and against Aaron.
translation:
  language: sw
  text: Hakukuwa na maji kwa ajili ya kusanyiko[a], nao wakakusanyika dhidi ya Musa na dhidi ya Aroni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jumuiya” au “mkutano.” Neno la Kiebrania עֵדָה linamaanisha watu wa Israeli waliokusanyika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא הָיָה
  choice: Hakukuwa na
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha kutokuwapo kwa kitu, huku kiunganishi cha simulizi kikibebwa kwa kawaida na mtiririko wa sentensi bila kuongeza neno la wakati lisilokuwapo wazi katika Kiebrania.
- source_word: מַיִם
  choice: maji
  rationale: Ingawa umbo la Kiebrania ni la wingi, linarejelea maji kama kitu; ‘maji’ ndilo neno la kawaida la Kiswahili.
- source_word: לָ/עֵדָה
  choice: kwa ajili ya kusanyiko
  rationale: עֵדָה humaanisha watu wa Israeli kama jumuiya iliyokusanyika. ‘Kusanyiko’ linadumisha wazo la kundi lililokusanyika, na tanbihi inaonyesha mbadala halali.
- source_word: וַ/יִּקָּהֲלוּ
  choice: nao wakakusanyika
  rationale: Kitenzi קהל kinaonyesha kukusanyika kama kundi. ‘Nao wakakusanyika’ ni cha asili katika simulizi la Kiswahili na huhifadhi mwendelezo wa tukio.
- source_word: עַל
  choice: dhidi ya
  rationale: Katika muktadha wa malalamiko na ugomvi, kihusishi hiki kinaonyesha upinzani, si mahali tu.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hilo katika Biblia ya Kiswahili.
- source_word: וְ/עַל אַהֲרֹן
  choice: na dhidi ya Aroni
  rationale: Kurudiwa kwa kihusishi kunahifadhi msisitizo wa Kiebrania kwamba upinzani uliwaelekea viongozi wote wawili.
