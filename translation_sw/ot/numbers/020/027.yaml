  yaml_path: translation/ot/numbers/020/027.yaml
  text: Moses did as Yahweh commanded[a], and they went up Mount Hor before the eyes of all the congregation.
translation:
  language: sw
  text: Musa akafanya kama Yahweh alivyomwamuru, nao wakapanda Mlima Hori mbele ya macho ya kusanyiko lote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mbele ya macho ya kusanyiko lote”; yaani, walipanda hadharani, watu wote waliokusanyika wakiwaona.
    reason: Ufafanuzi wa nahau na taswira ya Kiebrania.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi hiki kinaeleza kwamba Musa alitekeleza alichoamriwa; “akafanya” hudumisha mtindo wa moja kwa moja wa simulizi la Kiebrania.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: kama alivyomwamuru
  rationale: Kauli hii inaunganisha tendo la Musa moja kwa moja na amri yenye mamlaka ya Yahweh kwa Kiswahili cha kawaida na fasaha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּעֲלוּ
  choice: nao wakapanda
  rationale: עלה hapa hueleza kwenda juu mlimani; “wakapanda” ni ya kawaida na inafaa katika muktadha huu.
- source_word: אֶל הֹר הָהָר
  choice: Mlima Hori
  rationale: Hili ni jina la mahali; mpangilio wa “Mlima Hori” ni wa kawaida katika Kiswahili.
- source_word: לְעֵינֵי
  choice: machoni pa
  rationale: Uchaguzi huu unahifadhi taswira halisi ya Kiebrania na pia unaeleweka kuwa jambo lililofanyika wazi mbele ya watu.
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה humaanisha jumuiya ya Israeli iliyokusanyika; “kusanyiko lote” ni wazi, lenye staha, na linaakisi umoja wa kundi hilo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. “Yahweh” hulihifadhi badala ya kulibadilisha kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa simulizi ni mwepesi na wa moja kwa moja; taswira ya “machoni pa” imehifadhiwa huku tanbihi ikifafanua maana yake ya hadharani.
