base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/003.yaml
  text: And the people quarreled with Moses and said[a], “If only we had perished when our brothers perished before Yahweh!”
translation:
  language: sw
  text: Nao watu wakagombana na Musa, wakisema[a], “Laiti tungalikufa wakati ndugu zetu walipokufa mbele za Yahwe!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Laiti tungalikufa kama ndugu zetu walivyokufa mbele za Yahwe!”
    reason: Muundo בִּגְוַע unaweza kueleweka kwa maana ya wakati, ‘wakati ... walipokufa,’ au kwa kulinganisha namna ya tukio, ‘kama ... walivyokufa.’
lexical_decisions:
- source_word: וַיָּרֶב
  choice: wakagombana
  rationale: Kitenzi ריב kinaonyesha mabishano au ugomvi wa wazi; ‘wakagombana’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya uhasama kuliko ‘walilalamika.’
- source_word: הָעָם
  choice: watu
  rationale: עם inarejelea jamii ya Waisraeli kwa upana; ‘watu’ ni tafsiri ya kawaida na ya moja kwa moja katika muktadha huu.
- source_word: עִם מֹשֶׁה
  choice: na Musa
  rationale: עִם kwa msingi humaanisha ‘na’; katika muundo ‘wakagombana na Musa,’ uhusiano wa uhasama unaeleweka bila kutia maana ya ziada.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: wakisema
  rationale: Huu ni utangulizi wa kawaida wa maneno katika Kiebrania. ‘Wakisema’ unatoa Kiswahili cha asili bila kurudia ‘wakasema, wakisema.’
- source_word: וְלוּ
  choice: Laiti
  rationale: Chembe hii huonyesha tamanio la huzuni au majuto; ‘Laiti’ huhifadhi nguvu hiyo kwa Kiswahili fasaha.
- source_word: גָוַעְנוּ ... בִּגְוַע
  choice: tungalikufa ... walipokufa
  rationale: Mzizi גוע umerudiwa katika Kiebrania, hivyo ‘kufa’ imerudiwa pia. Muundo wa ‘wakati ... walipokufa’ unaonyesha mazingira ya wakati ya בִּגְוַע kwa lugha ya kawaida.
- source_word: אַחֵינוּ
  choice: ndugu zetu
  rationale: Ingawa neno la Kiebrania ni la kiume kwa umbo, ‘ndugu’ katika Kiswahili linaweza kumaanisha ndugu wa kiume au watu wa jamaa/jamii; hapa linafaa kwa Waisraeli wenzao bila kuamua zaidi ya muktadha.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: ‘Mbele za’ huhifadhi maana ya kuwa mbele au katika uwepo wa, na ‘Yahwe’ huwakilisha jina la agano יהוה moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana Tetragramatoni moja kwa moja. ‘Yahwe’ hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo, bila kuingiza namna ya ‘Yehova’ iliyotokana na mchanganyiko wa kimapokeo.
- issue: Utambulisho wa אַחֵינוּ
  choice: ndugu zetu
  alternative: ndugu zetu wa kiume; watu wa jamaa yetu
  rationale: ‘Ndugu zetu’ ni ya asili na inaweza kutaja Waisraeli wenzao. Hailazimishi kwamba waliokusudiwa walikuwa wanaume peke yao, jambo ambalo umbo la kisarufi halithibitishi kwa lazima katika matumizi ya pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tungalikufa’ kimetumiwa kuonyesha tamanio lisilotimia la wakati uliopita; ‘wakagombana’ huhifadhi uhasama wa ריב bila kuwa lugha nzito isiyo ya kawaida.
