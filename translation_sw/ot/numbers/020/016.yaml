  text: וַ/נִּצְעַ֤ק אֶל יְהוָה֙ וַ/יִּשְׁמַ֣ע קֹלֵ֔/נוּ וַ/יִּשְׁלַ֣ח מַלְאָ֔ךְ וַ/יֹּצִאֵ֖/נוּ מִ/מִּצְרָ֑יִם וְ/הִנֵּה֙ אֲנַ֣חְנוּ בְ/קָדֵ֔שׁ עִ֖יר קְצֵ֥ה גְבוּלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/016.yaml
  text: And we cried out to Yahweh[a], and he heard our voice and sent an angel and brought us out of Egypt. And look, we are in Kadesh, a city at the edge of your border.
translation:
  language: sw
  text: Tulimlilia Yahwe, naye akaisikia sauti yetu, akamtuma malaika[a], akatutoa Misri. Na tazama, tuko Kadeshi, mji ulio ukingoni mwa mpaka wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe.” Neno la Kiebrania linaweza kumaanisha mjumbe wa kibinadamu au wa mbinguni, ingawa katika muktadha huu wengi hulielewa kuwa malaika aliyetumwa na Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: Tulimlilia
  rationale: Kitenzi צעק kinaonyesha kilio cha dharura cha kuomba msaada. “Tulimlilia” ni Kiswahili cha kawaida kinachohifadhi uzito huo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa na cheo, ili kuhifadhi jina la kibinafsi katika maandishi ya Kiebrania.
- source_word: וַיִּשְׁמַע קֹלֵנוּ
  choice: naye akaisikia sauti yetu
  rationale: Tafsiri hii inahifadhi tamathali ya moja kwa moja ya Kiebrania, “aliisikia sauti yetu,” huku ikibaki ya kawaida katika Kiswahili.
- source_word: מַלְאָךְ
  choice: malaika
  rationale: Katika muktadha wa kutoka Misri, “malaika” ni tafsiri ya kawaida na ya asili; hata hivyo, neno la Kiebrania linaweza pia kumaanisha “mjumbe,” jambo lililohifadhiwa katika tanbihi.
- source_word: וַיֹּצִאֵנוּ מִמִּצְרָיִם
  choice: na kututoa Misri
  rationale: Hifili ya יצא humaanisha kusababisha mtu atoke, yaani “kutoa”; muundo huu ni wazi na wa kawaida katika simulizi la kutoka Misri.
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: “Na tazama” huhifadhi kazi ya הנה ya kuvuta fikira kwa hali iliyopo, kwa lugha yenye heshima na inayoeleweka.
- source_word: עִיר קְצֵה גְבוּלֶךָ
  choice: mji ulio ukingoni mwa mpaka wako
  rationale: Kauli hii inaonyesha kwamba Kadeshi iko kwenye ukingo wa mpaka wa Edomu; “ukingoni mwa mpaka wako” huhifadhi maana hiyo ya mahali.
theological_decisions:
- issue: Utambulisho wa מַלְאָךְ katika simulizi la kutoka Misri
  choice: malaika
  alternative: mjumbe
  rationale: Mstari haumtambui kiumbe huyo kwa undani zaidi. “Malaika” inafaa kwa muktadha huu, lakini tanbihi inahifadhi upana wa neno la Kiebrania bila kulazimisha utambulisho mahususi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unafuata kwa karibu mfuatano wa Kiebrania bila kuwa mzito; “Yahwe” huhifadhi jina la Mungu, na “Na tazama” hudumisha msisitizo wa הנה.
