translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa swali la balagha na utofauti kati ya kwenda vitani na kukaa hapa umehifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
