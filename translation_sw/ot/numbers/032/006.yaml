  text: But Moses said to the sons of Gad and to the sons of Reuben[b][a], “Shall your brothers go to war while you sit here?”
translation:
  language: sw
  text: Lakini Musa akawaambia wana wa Gadi na wana wa Reubeni, “Je, ndugu zenu[b] waende vitani[a], nanyi mkae hapa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waingie vitani.” Kiebrania kinatumia nahau ya kawaida yenye maana ya kuingia katika mapambano ya kijeshi.
    reason: lexical_alternative
  - marker: b
    text: “Ndugu zenu” hapa ni Waisraeli wenzao wa makabila mengine.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini Musa akawaambia
  rationale: Kiunganishi cha simulizi kinaendeleza habari, lakini katika muktadha swali la Musa linaonyesha utofauti na ombi lao; “lakini” ni ya asili katika Kiswahili, na “akawaambia” huwasilisha utangulizi wa maneno kwa walengwa wengi.
- source_word: לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן
  choice: wana wa Gadi na wana wa Reubeni
  rationale: Huhifadhi taswira ya Kiebrania ya “wana wa” huku ikitaja makabila hayo kwa namna inayoeleweka katika Kiswahili cha Biblia.
- source_word: הַאַחֵיכֶם
  choice: ndugu zenu
  rationale: Hili ndilo neno la moja kwa moja, na katika muktadha linawahusu Waisraeli wenzao wa makabila mengine bila kuondoa lugha ya kifamilia ya Kiebrania.
- source_word: יָבֹאוּ לַמִּלְחָמָה
  choice: waende vitani
  rationale: Muungano huu ni nahau ya kuingia au kwenda katika mapigano. Kiswahili “kwenda vitani” ni cha kawaida na huhifadhi maana ya kushiriki katika vita; umbo la swali linaendeleza nguvu ya karipio.
- source_word: וְאַתֶּם תֵּשְׁבוּ פֹה
  choice: huku ninyi mkikaa hapa
  rationale: “Kukaa” huhifadhi maana halisi ya ישב, na “huku” huonyesha wazi utofauti wa matendo hayo mawili bila kupunguza ukali wa swali.
