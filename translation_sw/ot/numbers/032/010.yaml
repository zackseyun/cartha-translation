  yaml_path: translation/ot/numbers/032/010.yaml
  text: So Yahweh’s anger burned on that day[a], and he swore, saying,
translation:
  language: sw
  text: Hasira ya Yahwe[a] ikawaka siku hiyo, naye akaapa, akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; pia huandikwa “Yahweh” au “Yehova.”'
