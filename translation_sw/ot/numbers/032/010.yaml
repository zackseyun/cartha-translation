lexical_decisions:
- source_word: וַיִּחַר ... אַף
  choice: hasira ... ikawaka
  rationale: Hii ni nahau ya Kiebrania inayowasilisha hasira kama kitu kinachowaka. Tafsiri hii huhifadhi taswira hiyo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: בַּיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Hii ndiyo namna ya kawaida na ya asili ya kuonyesha wakati huo katika simulizi la Kiswahili.
- source_word: וַיִּשָּׁבַע
  choice: akaapa
  rationale: Kitenzi hiki katika kauli ya Nifali humaanisha kuapa au kufanya kiapo; “akaapa” ni kifupi, wazi, na hudumisha mtiririko wa simulizi.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Neno hili linatanguliza yaliyomo katika kiapo kinachoendelea katika mstari unaofuata; “akisema” huhifadhi kiungo hicho bila kukifanya kuwa sentensi mpya.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikitaja umbo jingine linalotumika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio “Siku hiyo” ni wa asili katika simulizi. Taswira ya hasira kuwaka imehifadhiwa, na koma ya mwisho inaonyesha kuwa kiapo chenyewe kinafuata katika mstari unaofuata.
