  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בִּלְתִּ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ הַ/קְּנִזִּ֔י וִ/יהוֹשֻׁ֖עַ בִּן נ֑וּן כִּ֥י מִלְא֖וּ אַחֲרֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/012.yaml
  text: except Caleb son of Jephunneh the Kenizzite[a], and Joshua son of Nun, because they fully followed Yahweh.
translation:
  language: sw
  text: isipokuwa Kalebu mwana wa Yefune, Mkenizi, na Yoshua mwana wa Nuni, kwa sababu walimfuata Yahweh kikamilifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walimfuata Yahweh kwa moyo wote.” Nahau ya Kiebrania ni, kihalisi, “walijaza baada ya Yahweh,” ikionyesha uaminifu na kujitoa kikamilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְתִּי
  choice: isipokuwa
  rationale: Katika muktadha huu neno hilo linawatambulisha Kalebu na Yoshua kuwa ndio pekee walioondolewa katika hukumu iliyotangulia.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Kalebu mwana wa Yefune
  rationale: Majina yametoholewa kwa mazoea ya Kiswahili ya Biblia, na בֶּן limetafsiriwa kwa usemi wa nasaba ‘mwana wa’.
- source_word: הַקְּנִזִּי
  choice: Mkenizi
  rationale: Ni jina la ukoo au asili linalomtambulisha Kalebu; umbo la Kiswahili ‘Mkenizi’ ni la asili na la kawaida.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: na Yoshua mwana wa Nuni
  rationale: Kiunganishi kinaunganisha mtu wa pili aliyeondolewa katika hukumu; majina na nasaba yametolewa kwa umbo la kawaida la Kiswahili.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי linaeleza sababu ya Kalebu na Yoshua kutengwa na hukumu hiyo.
- source_word: מִלְאוּ אַחֲרֵי
  choice: walimfuata ... kikamilifu
  rationale: Nahau hiyo, ambayo kihalisi ni ‘walijaza baada ya,’ inaonyesha kumfuata Mungu kwa uaminifu kamili. Tafsiri hii huhifadhi wazo la kufuata pamoja na ukamilifu wa kujitoa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kuwa ‘Yahweh’ badala ya kubadilishwa na cheo kama ‘BWANA’.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu, hivyo ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya nahau מִלְאוּ אַחֲרֵי
  choice: walimfuata Yahweh kikamilifu
  alternative: walimfuata Yahweh kwa moyo wote
  rationale: Chaguo kuu linadumisha picha ya kumfuata na maana ya uaminifu kamili bila kuongeza dhana ya utiifu pekee; chaguo la tanbihi linaonyesha maana ya kujitoa kwa moyo wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Sentensi imeachwa kama kishazi kinachoendeleza mstari uliotangulia, sawa na muundo wa chanzo.
