  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְנִעֵ/ם֙ בַּ/מִּדְבָּ֔ר אַרְבָּעִ֖ים שָׁנָ֑ה עַד תֹּם֙ כָּל הַ/דּ֔וֹר הָ/עֹשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/013.yaml
  text: So Yahweh’s anger burned against Israel[a], and he made them wander in the wilderness forty years[b], until all the generation that had done evil in the sight of Yahweh had come to an end.
translation:
  language: sw
  text: Basi hasira ya Yahwe ikawaka dhidi ya Israeli[a], naye akawafanya watangatange jangwani kwa miaka arobaini[b], mpaka kizazi chote kilichofanya maovu machoni pa Yahwe kilipokwisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe akawakasirikia Waisraeli.” Nahau ya Kiebrania yasema kihalisi, “pua ya Yahwe ikawaka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akawasababisha watangatange jangwani kwa miaka arobaini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: hasira ya Yahwe ikawaka
  rationale: Inahifadhi taswira ya nahau ya Kiebrania ya hasira ‘kuwaka,’ huku ikibaki wazi na ya asili katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uhawilishaji wa jina binafsi la Mungu יהוה badala ya kulibadilisha kuwa cheo.
- source_word: בְּיִשְׂרָאֵל
  choice: dhidi ya Israeli
  rationale: Kihusishi kinaonyesha kwamba Israeli ndiye aliyelengwa na hasira; ‘dhidi ya’ huwasilisha uhusiano huo wazi.
- source_word: וַיְנִעֵם
  choice: akawafanya watangatange
  rationale: Muundo wa kisababishi unaonyesha kwamba Yahwe ndiye aliyewafanya watangatange, si kwamba walitangatanga tu kwa hiari au bila sababu iliyotajwa.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: ‘Jangwani’ ni neno la kawaida na linalofaa katika muktadha wa safari ya Israeli baada ya kutoka Misri.
- source_word: אַרְבָּעִים שָׁנָה
  choice: kwa miaka arobaini
  rationale: Tafsiri ya moja kwa moja ya muda uliotajwa.
- source_word: עַד תֹּם
  choice: mpaka ... kilipokwisha
  rationale: Kitenzi תָּמַם kinaonyesha kufikia mwisho au kukoma kabisa; ‘kilipokwisha’ hakiongezi wazi namna kizazi hicho kilivyofikia mwisho.
- source_word: כָּל הַדּוֹר
  choice: kizazi chote
  rationale: Huonyesha kikundi kizima na kuhifadhi nguvu ya כָּל kwa Kiswahili cha kawaida.
- source_word: הָעֹשֶׂה הָרַע
  choice: kilichofanya maovu
  rationale: Kishirikishi cha umoja kinaeleza ‘kizazi’ kama kundi; kishazi hiki ni cha asili katika Kiswahili na kinahifadhi hukumu ya kimaadili ya maandishi.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Inahifadhi nahau na taswira ya Kiebrania kuhusu tathmini ya Yahwe bila kuifanya kuwa maelezo ya ziada.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Taswira ya hasira ya Mungu
  choice: hasira ya Yahwe ikawaka dhidi ya Israeli
  alternative: Yahwe akawakasirikia Waisraeli
  rationale: Chaguo hili linahifadhi taswira halisi ya hasira inayowaka na uzito wa hukumu ya Mungu bila kuongeza ufafanuzi wa kidhehebu.
- issue: Jukumu la Yahwe katika kutangatanga kwa Israeli
  choice: akawafanya watangatange
  alternative: walitangatanga
  rationale: Muundo wa Kiebrania ni wa kisababishi na unamtaja Yahwe kuwa mtendaji; tafsiri haipaswi kupunguza jambo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi umetumia ‘ikawaka’ na ‘akawafanya’ kwa mtiririko wa asili. Taswira za Kiebrania zimehifadhiwa pale zinapoeleweka, huku tanbihi zikitoa mbadala ulio wazi zaidi.
