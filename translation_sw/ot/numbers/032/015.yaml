base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/015.yaml
  text: For if you turn back from following him[a], he will again leave him in the wilderness[b], and you will bring ruin on all this people.
translation:
  language: sw
  text: Kwa maana mkigeuka na kuacha kumfuata[a], atamwacha tena jangwani[b], nanyi mtawaletea maangamizi watu hawa wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa maana halisi, “kutoka nyuma yake,” nahau inayomaanisha kuacha kumfuata.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema “atamwacha jangwani,” kikitumia kiwakilishi cha umoja ambacho huenda kinamrejelea Israeli au watu wote kama kundi moja. Tafsiri nyingine hulainisha kuwa “atawaacha” au hutaja wazi “ataiacha Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu neno hili linaunganisha onyo na sababu yake; sharti linalofuata linaonyeshwa na muundo wa ‘mkirudi’.
- source_word: תְשׁוּבֻן מֵאַחֲרָיו
  choice: mkirudi nyuma na kuacha kumfuata yeye
  rationale: Muundo huu unaeleza kugeuka na kuacha kumfuata Mungu, huku ukihifadhi dhana ya kurudi nyuma iliyo katika kitenzi שוב na maana ya nahau ‘kutoka nyuma yake’.
- source_word: וְיָסַף עוֹד
  choice: tena
  rationale: Mchanganyiko wa יסף na עוד unaonyesha kurudiwa kwa tendo; ‘tena’ ni usemi wa kawaida na sahihi wa Kiswahili.
- source_word: לְהַנִּיחוֹ
  choice: atamwacha
  rationale: Kitenzi נוח katika Hifili hapa kina maana ya kumwacha au kumruhusu abaki. Kiambishi cha umoja -וֹ kimehifadhiwa kwa ‘-mw-’ badala ya kulainishwa kuwa wingi.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: ‘Jangwa’ ni tafsiri ya kawaida ya מִדְבָּר katika simulizi la safari ya Israeli na inafaa kwa mazingira haya.
- source_word: וְשִׁחַתֶּם
  choice: mtawaangamiza
  rationale: Kitenzi שׁחת hapa kina maana ya kusababisha uharibifu au maangamizi. ‘Mtawaangamiza’ ni tafsiri ya moja kwa moja na ya asili katika Kiswahili.
- source_word: לְכָל הָעָם הַזֶּה
  choice: watu hawa wote
  rationale: Ingawa Kiebrania hutumia nomino ya umoja yenye maana ya kundi, Kiswahili cha kawaida hutaja kundi hili kwa ‘watu hawa wote’.
theological_decisions:
- issue: Kiashiria cha kiwakilishi cha umoja katika ‘atamwacha’ baada ya wanaoambiwa kwa wingi
  choice: 'Kuhifadhi umoja: ‘atamwacha’'
  alternative: 'Kulainisha kuwa wingi: ‘atawaacha,’ au kutaja wazi: ‘ataiacha Israeli’'
  rationale: Maandiko ya Kiebrania yana kiambishi cha umoja katika לְהַנִּיחוֹ. Huenda umoja huo unaitaja Israeli au jamii yote kwa pamoja. Kuuhifadhi huepuka kufuta hali ya asili ya maandishi, na tanbihi inafafanua uwezekano huo.
- issue: Nguvu ya וְשִׁחַתֶּם
  choice: mtawaangamiza
  alternative: mtawaletea maangamizi
  rationale: Kitenzi kinaweza kueleza kuharibu moja kwa moja au kusababisha maangamizi. ‘Mtawaangamiza’ huhifadhi ukali wa onyo bila kufafanua zaidi aina ya hukumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa sharti ‘mkirudi’ ni wa asili; ‘yeye’ baada ya ‘kumfuata’ limetumiwa kusisitiza na kuweka wazi anayefuatwa. Umoja usio wa kawaida katika ‘atamwacha’ umehifadhiwa kwa uaminifu kwa maandishi ya Kiebrania na kufafanuliwa katika tanbihi.
