  text: וְ/לָ֣/מָּה תנואו/ן אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל מֵֽ/עֲבֹר֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/007.yaml
  text: And why do you discourage the hearts of the sons of Israel from crossing over into the land that Yahweh has given them?[a][b]
translation:
  language: sw
  text: Basi, kwa nini mnawavunja moyo[b] wana wa Israeli[a] wasivuke kuingia katika nchi ambayo Yahweh amewapa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania kinasema kihalisi “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi kuhusu “moyo”; usemi huo unaweza pia kumaanisha kudhoofisha ujasiri au azimio lao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: Basi kwa nini
  rationale: “Basi” huendeleza hoja ya Musa kutoka kauli iliyotangulia, huku “kwa nini” ikibeba nguvu ya swali la Kiebrania.
- source_word: תנואון אֶת לֵב
  choice: mnawavunja moyo
  rationale: Kitenzi katika kausativi pamoja na “moyo” humaanisha kudhoofisha ujasiri au azimio. “Kuvunja moyo” ni nahau ya kawaida ya Kiswahili inayohifadhi taswira ya moyo na maana ya kukatisha tamaa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania kwa lugha ya Kiswahili iliyoeleweka; “Waisraeli” ni tafsiri mbadala iliyo laini zaidi.
- source_word: מֵעֲבֹר אֶל הָאָרֶץ
  choice: wasivuke kuingia katika nchi
  rationale: Muundo huu unaonyesha kwamba wanazuiwa kufanya uvukaji wenye lengo la kuingia katika nchi, na unahifadhi wazo la kuvuka lililo katika kitenzi עָבַר.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: ambayo ... amewapa
  rationale: Wakati timilifu wa Kiswahili unaonyesha kwamba Yahweh tayari ameitoa nchi hiyo, huku tendo hilo likiwa na umuhimu wa sasa kwao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo, kwa kuwa matini ya Kiebrania ina Tetragramatoni moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: “Yahweh” huhifadhi jina la agano lililo katika matini badala ya kulibadilisha kuwa cheo; “Yehova” ni namna nyingine ya jadi ya kulitamka.
- issue: Usemi wa kitaifa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” huhifadhi taswira ya ukoo na taifa iliyo katika Kiebrania bila kuifanya iwe dai kwamba kila mmoja anayelengwa ni mwanaume; “Waisraeli” huwasilisha maana ya kitaifa kwa ufupi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa sasa. “Mnawavunja moyo” ni nahau ya kawaida na inayoeleweka, huku “wasivuke kuingia” ikidumisha wazo la uvukaji kuelekea ndani ya nchi.
