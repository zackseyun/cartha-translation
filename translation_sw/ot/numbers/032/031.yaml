  text: Then the sons of Gad and the sons of Reuben answered[a], saying, “As Yahweh has spoken to your servants, so we will do.”
translation:
  language: sw
  text: Ndipo wana wa Gadi na wana wa Reubeni wakajibu[a], wakisema, “Kama Yahwe alivyosema na watumishi wako, ndivyo tutakavyofanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Wana wa Gadi na wana wa Reubeni wakajibu, ‘Yale ambayo Yahwe amesema na watumishi wako, tutayafanya.’”'
    reason: Muundo אֵת אֲשֶׁר ... כֵּן unaweza kutafsiriwa kwa uhusiano wa “kama ... ndivyo” au kwa muundo wa moja kwa moja zaidi, “yale ambayo ... tutayafanya.”
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: wakajibu
  rationale: Kitenzi ענה katika mfululizo huu wa masimulizi kinaanzisha jibu la maneno; “wakajibu” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: wana wa Gadi na wana wa Reubeni
  rationale: Muundo huu unahifadhi usemi wa Kiebrania בְּנֵי, “wana wa,” uliotumiwa kwa makundi yote mawili, bila kuufanya kuwa majina ya kikabila yasiyoandikwa wazi katika chanzo.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Kitenzi-jina hiki kinatanguliza maneno yanayonukuliwa baada ya “wakajibu”; “wakisema” kinahifadhi muundo huo kwa Kiswahili cha kawaida.
- source_word: אֵת אֲשֶׁר ... כֵּן
  choice: Kama ... ndivyo
  rationale: Jozi “kama ... ndivyo” inaonyesha uhusiano wa Kiebrania kati ya jambo ambalo Yahwe alisema na tendo ambalo wasemaji watafanya, huku mbadala wa muundo wa “yale ... tutayafanya” ukitolewa katika tanbihi.
- source_word: דִּבֶּר
  choice: alivyowaambia
  rationale: Katika muktadha, kusema huko kulielekezwa kwa watumishi wa Musa; “alivyowaambia” ni Kiswahili cha asili kinachoonyesha usemi uliotangulia na uhusiano wake na utekelezaji ulioahidiwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: אֶל עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Hapa עֲבָדֶיךָ ni namna ya heshima na unyenyekevu ambayo wasemaji wanajitumia wanapozungumza na Musa; “watumishi wako” linafaa kuliko “watumwa wako.”
- source_word: נַעֲשֶׂה
  choice: tutakavyofanya
  rationale: Kitenzi עשה kinaeleza kutekeleza jambo lililosemwa. Muundo huu unalingana kwa kawaida na “ndivyo” bila kuongeza kitu kisichotajwa katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la agano יְהוָה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa “wana wa” umehifadhiwa kwa uwazi wa karibu na chanzo; “wakajibu, wakisema” inadumisha mtindo wa Kiebrania bila kuwa mgumu kupita kiasi.
