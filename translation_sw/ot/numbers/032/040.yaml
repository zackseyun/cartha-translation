  text: So Moses gave Gilead to Machir son of Manasseh[a], and he settled in it.
translation:
  language: sw
  text: Basi Musa akampa Makiri, mwana wa Manase, Gileadi; naye akakaa humo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliishi humo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akampa
  rationale: Kitenzi נתן hapa kina maana ya moja kwa moja ya ‘kutoa/kumpa’; ‘akampa’ kinaonyesha pia mpokeaji aliyeletwa kwa לְ.
- source_word: הַגִּלְעָד
  choice: Gileadi
  rationale: Ni jina la mahali lililozoeleka katika Kiswahili cha Biblia; kiambishi cha ujuzi cha Kiebrania hakihitaji kutafsiriwa kando.
- source_word: לְמָכִיר
  choice: Makiri
  rationale: Katika muundo ‘akampa Makiri,’ kiambishi cha yambwa -m- katika kitenzi kinawasilisha לְ ya mpokeaji kwa Kiswahili cha kawaida.
- source_word: בֶּן מְנַשֶּׁה
  choice: mwana wa Manase
  rationale: בן kwa msingi ni ‘mwana’; hakuna jambo katika mstari huu linalolazimisha maana pana ya ‘mzao.’
- source_word: וַיֵּשֶׁב
  choice: akakaa
  rationale: ישב inaweza kumaanisha kukaa, kuishi, au kufanya makao. ‘Akakaa’ ni ya asili na huhifadhi upana huo bila kulazimisha wazo la hatua rasmi ya kuanzisha makazi.
- source_word: בָּהּ
  choice: humo
  rationale: Kiwakilishi hiki kinarejelea eneo la Gileadi; ‘humo’ ni namna ya kawaida ya kusema ‘ndani yake/katika eneo hilo.’
