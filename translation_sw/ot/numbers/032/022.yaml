  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נִכְבְּשָׁ֨ה הָ/אָ֜רֶץ לִ/פְנֵ֤י יְהוָה֙ וְ/אַחַ֣ר תָּשֻׁ֔בוּ וִ/הְיִיתֶ֧ם נְקִיִּ֛ים מֵ/יְהוָ֖ה וּ/מִ/יִּשְׂרָאֵ֑ל וְ֠/הָיְתָה הָ/אָ֨רֶץ הַ/זֹּ֥את לָ/כֶ֛ם לַ/אֲחֻזָּ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/022.yaml
  text: and the land is subdued before Yahweh[a], then afterward you may return and be free of obligation to Yahweh and to Israel[b], and this land shall be yours as a possession before Yahweh.
translation:
  language: sw
  text: Nayo nchi itakapotiishwa mbele ya Yahweh[b], ndipo mtakaporudi, nanyi mtakuwa bila hatia[a] mbele ya Yahweh na mbele ya Israeli, na nchi hii itakuwa milki yenu mbele ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtakuwa huru kutokana na wajibu wenu kwa Yahweh na Israeli.”
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” ni jina la Mungu linalowakilishwa kwa herufi YHWH katika Kiebrania.
    reason: divine_name
lexical_decisions:
- source_word: וְנִכְבְּשָׁה
  choice: itakapotiishwa
  rationale: Kauli ya kutendwa ya kitenzi כבש inaonyesha nchi kuwekwa chini ya mamlaka. “Itakapotiishwa” huhifadhi maana hiyo na pia uhusiano wa sharti na hatua inayofuata.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: לִפְנֵי humaanisha “mbele ya/katika uwepo wa.” Kiswahili “mbele za Yahweh” ni cha asili na huhifadhi hisia ya uwajibikaji na uwepo wa Mungu.
- source_word: וְאַחַר תָּשֻׁבוּ
  choice: ndipo mtakaporudi
  rationale: 'Kirai hiki huonyesha mfuatano wa wakati: kurudi kunafuata baada ya nchi kutiishwa. “Ndipo mtakaporudi” huonyesha wazi mpangilio huo bila kuongeza wazo lisilokuwamo.'
- source_word: וִהְיִיתֶם נְקִיִּים
  choice: mtakuwa bila hatia
  rationale: נָקִי inaweza kumaanisha asiye na hatia au aliye huru kutokana na dai au wajibu. “Bila hatia” huhifadhi maana ya msingi na uzito wa uwajibikaji katika muktadha huu.
- source_word: מֵיְהוָה וּמִיִּשְׂרָאֵל
  choice: mbele za Yahweh na mbele ya Israeli
  rationale: Pamoja na נָקִי, kihusishi מן huonyesha kutokuwa na hatia au dai kuhusiana na Yahweh na Israeli. Muundo wa “mbele za... na mbele ya...” huwasilisha hali ya kuwajibika kwa pande zote mbili.
- source_word: לַאֲחֻזָּה
  choice: milki
  rationale: אֲחֻזָּה ni ardhi inayomilikiwa kama sehemu ya kudumu. “Milki” ni neno fupi, lenye heshima, na linafaa kwa umiliki wa ardhi bila kulazimisha wazi maana ya urithi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama “Yahweh” badala ya kubadilishwa na cheo, hivyo jina binafsi la agano linahifadhiwa.
theological_decisions:
- issue: Maana ya נְקִיִּים katika wajibu wa agano
  choice: bila hatia
  alternative: mmeondolewa wajibu / huru kutokana na wajibu
  rationale: Neno linaweza kueleza kutokuwa na hatia au kutokuwa tena chini ya dai. Matini kuu huhifadhi maana pana ya kutokuwa na hatia, huku tanbihi ikieleza maana ya kuondolewa wajibu inayofaa muktadha.
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: “Yahweh” huhifadhi jina binafsi la Mungu katika matini ya Kiebrania bila kulibadilisha kuwa cheo.
- issue: Nguvu ya wakati katika תָּשֻׁבוּ
  choice: ndipo mtakaporudi
  alternative: ndipo mnapoweza kurudi
  rationale: Kitenzi kinaeleza hatua ya baadaye baada ya sharti kutimizwa. Tafsiri haiongezi kwa lazima dhana ya ruhusa, ingawa muktadha unaweza kuihusisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sharti na mfuatano wa matendo umewekwa wazi, huku maana mbili za נָקִי zikihifadhiwa kupitia tanbihi.
