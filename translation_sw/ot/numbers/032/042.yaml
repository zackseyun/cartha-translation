base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/042.yaml
  text: And Nobah went and captured Kenath and its villages[a], and called it Nobah, after his own name.
translation:
  language: sw
  text: Noba akaenda, akauteka Kenathi pamoja na vijiji vyake[a], akauita Noba, kwa jina lake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “binti zake,” nahau inayomaanisha makazi madogo yaliyoutegemea Kenathi.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹבַח
  choice: Nobahi
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili; umbo lilelile limedumishwa baadaye kama jina jipya la mji.
- source_word: הָלַךְ
  choice: akaenda
  rationale: Katika mfuatano wa simulizi, kitenzi hiki kinaonyesha mwendo wa kawaida; ‘akaenda’ ni cha asili na hakiongezi maana isiyokuwapo.
- source_word: וַיִּלְכֹּד
  choice: akauteka
  rationale: Katika muktadha wa kijeshi, לכד humaanisha kuteka au kuchukua kwa nguvu; kiambishi ‘-u-’ kinamrejelea mji wa Kenathi.
- source_word: קְנָת
  choice: Kenathi
  rationale: Jina la mahali limetoholewa ili liweze kutamkwa kwa urahisi katika Kiswahili.
- source_word: בְּנֹתֶיהָ
  choice: vijiji vyake
  rationale: Kihalisi ni ‘binti zake,’ lakini hapa ni nahau ya makazi madogo yaliyoutegemea mji mkuu; ‘vijiji vyake’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וַיִּקְרָא לָהּ
  choice: akauita
  rationale: Muundo קרא + ל unaonyesha kumpa mahali jina; ‘akauita’ hudumisha mtindo mfupi wa simulizi.
- source_word: נֹבַח
  choice: Nobahi
  rationale: Jina la mji lilikuwa sawa na jina la mtekaji, hivyo urudiaji wa jina umehifadhiwa.
- source_word: בִּשְׁמוֹ
  choice: kwa jina lake mwenyewe
  rationale: Kirai hiki kinaonyesha kwamba mji ulipewa jina la Nobahi; ‘mwenyewe’ huweka wazi kuwa kiwakilishi kinamrejelea Nobahi.
