base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/004.yaml
  text: The land that Yahweh struck before the congregation of Israel is a land for livestock[b][a], and your servants have livestock.
translation:
  language: sw
  text: Nchi ambayo Yahweh aliipiga mbele ya kusanyiko la Israeli ni nchi inayofaa kwa mifugo[a], na watumishi wako wana mifugo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchi ya kufugia mifugo.” Neno la Kiebrania linaweza kumaanisha mifugo kwa ujumla, si ng’ombe pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: Nchi
  rationale: Katika muktadha huu אֶרֶץ ni eneo au nchi inayozungumziwa; “nchi” ni tafsiri ya kawaida na yenye kueleweka.
- source_word: הִכָּה
  choice: aliipiga
  rationale: Hifili ya נכה huonyesha kupiga, na katika muktadha wa kijeshi inaweza kumaanisha kushinda. “Aliipiga” inahifadhi taswira ya Kiebrania bila kuifafanua kupita kiasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limewasilishwa kama jina binafsi, si kubadilishwa kuwa cheo.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Kirai hiki kina maana ya mbele ya au machoni pa kusanyiko la Israeli.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: kusanyiko la Israeli
  rationale: עֵדָה humaanisha jumuiya iliyokusanyika; “kusanyiko” ni neno la kawaida, lenye hadhi, na linalofaa katika muktadha huu.
- source_word: אֶרֶץ מִקְנֶה
  choice: nchi inayofaa kwa mifugo
  rationale: Muundo huu unaonyesha nchi inayofaa kufugia mifugo. Tafsiri hii ni ya asili katika Kiswahili na haibani מִקְנֶה kuwa ng’ombe pekee.
- source_word: וְלַעֲבָדֶיךָ מִקְנֶה
  choice: na watumishi wako wana mifugo
  rationale: Kihusishi לְ kinaonyesha umilikaji hapa; Kiswahili cha kawaida huieleza kwa kitenzi “wana”.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu; “Yahweh” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya הִכָּה katika muktadha wa vita
  choice: aliipiga
  alternative: aliishinda
  rationale: “Aliipiga” hudumisha upana wa kitenzi cha Kiebrania, huku “aliishinda” ikifafanua moja kwa moja matokeo yake ya kijeshi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa wasomaji wa kawaida huku ukihifadhi ukaribu na Kiebrania na jina Yahweh.
