  text: This is what your fathers did when I sent them from Kadesh-barnea to see the land:[a]
translation:
  language: sw
  text: Hivyo ndivyo baba zenu walivyofanya nilipowatuma kutoka Kadeshi-barnea kwenda kuiona nchi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenda kuichunguza” au “kwenda kuipeleleza.” Kitenzi cha Kiebrania humaanisha “kuona” kwa maana yake halisi, lakini katika muktadha huu kinahusu kwenda kuitazama na kuichunguza nchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: Hivyo ndivyo
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha namna ya tendo lililotangulia na kulinganisha tendo hilo na hali ya sasa.
- source_word: עָשׂוּ
  choice: walivyofanya
  rationale: Kitenzi hiki kinatafsiri moja kwa moja maana ya kufanya, na kwa kuunganishwa na “Hivyo ndivyo” kinaunda sentensi ya asili katika Kiswahili.
- source_word: אֲבֹתֵיכֶם
  choice: baba zenu
  rationale: Huhifadhi taswira ya Kiebrania ya “baba zenu” na mkazo wake juu ya kizazi kilichotangulia, bila kuipanua kimya kimya kuwa “mababu zenu.”
- source_word: בְּשָׁלְחִי
  choice: nilipowatuma
  rationale: Kiambishi ב pamoja na kitenzi-jina na kiambishi cha nafsi ya kwanza kina maana ya wakati hapa; “nilipowatuma” ni Kiswahili cha kawaida na sahihi.
- source_word: אֹתָם
  choice: -wa-
  rationale: Kiambishi cha yambwa katika “nilipowatuma” kinawakilisha “wao,” yaani baba au kizazi cha awali.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: kutoka Kadeshi-barnea
  rationale: Jina la mahali limetoholewa kwa tahajia inayoeleweka katika Kiswahili, huku uhusiano wa sehemu mbili za jina ukihifadhiwa kwa kistari.
- source_word: לִרְאוֹת
  choice: kwenda kuiona
  rationale: “Kuiona” huhifadhi maana ya msingi ya kitenzi ראה, yaani kuona; “kwenda” huonyesha kwa kawaida katika Kiswahili kusudi la kutumwa bila kuifanya maana iwe mahususi zaidi kuliko chanzo.
- source_word: אֶת הָאָרֶץ
  choice: nchi
  rationale: “Nchi” ni tafsiri ya kawaida ya הָאָרֶץ katika muktadha huu na haiingizi waziwazi maelezo ya “nchi ya ahadi” ambayo hayapo katika kirai chenyewe.
