  text: וְ/הִנֵּ֣ה קַמְתֶּ֗ם תַּ֚חַת אֲבֹ֣תֵי/כֶ֔ם תַּרְבּ֖וּת אֲנָשִׁ֣ים חַטָּאִ֑ים לִ/סְפּ֣וֹת ע֗וֹד עַ֛ל חֲר֥וֹן אַף יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/014.yaml
  text: And behold[a], you have risen up in your fathers’ place, a brood of sinful men[b], to add still more to the burning anger of Yahweh against Israel.
translation:
  language: sw
  text: Na tazama, mmeinuka katika nafasi ya baba zenu, zao la wanaume wenye dhambi[a], ili kuongeza zaidi hasira kali[b] ya Yahweh dhidi ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ongezeko la wanaume wenye dhambi” au “uzao wa wanaume wenye dhambi.” Neno la Kiebrania תַּרְבּוּת linaweza kumaanisha ongezeko au uzao.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “kuwaka kwa pua ya Yahweh,” nahau ya Kiebrania inayomaanisha hasira kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Inadumisha nguvu ya usemi wa kuelekeza fikira na onyo lenye msisitizo la Musa.
- source_word: קַמְתֶּם
  choice: mmeinuka
  rationale: Inahifadhi taswira ya kuinuka huku ikimaanisha kutokea kwa kizazi kinachofuata.
- source_word: תַּחַת אֲבֹתֵיכֶם
  choice: mahali pa baba zenu
  rationale: Katika muktadha wa urithi wa kizazi, תַּחַת humaanisha kuchukua nafasi ya waliotangulia.
- source_word: תַּרְבּוּת אֲנָשִׁים חַטָּאִים
  choice: zao la watu wenye dhambi
  rationale: תַּרְבּוּת inaweza kumaanisha uzao au ongezeko. “Zao” huonyesha uhusiano wa kizazi na kudumisha sauti ya kukemea bila kutumia lugha isiyo ya kawaida.
- source_word: לִסְפּוֹת עוֹד
  choice: ili kuizidisha zaidi
  rationale: Huonyesha kwamba matendo yao yangeongeza hasira iliyokuwapo tayari.
- source_word: עַל חֲרוֹן אַף
  choice: hasira kali
  rationale: Ni Kiswahili cha kawaida kinachowasilisha nguvu ya nahau ya Kiebrania ya hasira inayowaka, ingawa taswira halisi inaelezwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linahifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: אֶל יִשְׂרָאֵל
  choice: dhidi ya Israeli
  rationale: Pamoja na neno la hasira, אֶל humtaja mlengwa wa hasira; “dhidi ya” ni usemi wa kawaida wa Kiswahili hapa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya תַּרְבּוּת katika karipio hili
  choice: zao
  alternative: ongezeko; kizazi; kundi
  rationale: “Zao” huhifadhi wazo la wale waliotokana na kizazi kilichotangulia na sauti ya karipio, huku tanbihi ikihifadhi uwezekano wa maana ya “ongezeko.”
- issue: Uwasilishaji wa אֲנָשִׁים חַטָּאִים
  choice: watu wenye dhambi
  alternative: wanaume wenye dhambi; wenye dhambi
  rationale: Ingawa אֲנָשִׁים ni wingi wa kiume, katika Kiswahili “watu” ni njia ya kawaida na sahihi ya kurejelea wanaume wanaohutubiwa bila kuingiza maana ya kijinsia isiyosisitizwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unadumisha ukali wa karipio la Musa bila kuwa wa kizamani. Viashiria vya tanbihi vimewekwa karibu na maneno vinayoyaeleza.
