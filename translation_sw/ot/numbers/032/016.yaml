  yaml_path: translation/ot/numbers/032/016.yaml
  text: Then they came near to him and said[a], “We will build sheepfolds here for our livestock, and cities for our little ones.”
translation:
  language: sw
  text: Ndipo wakamkaribia, wakasema, “Tutajenga hapa mazizi ya kondoo kwa ajili ya mifugo yetu, na miji kwa ajili ya watoto wetu wadogo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanaotutegemea.” Neno la Kiebrania טַף kwa kawaida humaanisha watoto wadogo, lakini linaweza pia kusisitiza watu wa nyumbani walio dhaifu na wanaotegemea ulinzi wa wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ אֵלָיו
  choice: wakamkaribia
  rationale: Kitenzi נגשׁ pamoja na אֵלָיו kinaonyesha kumwendea mtu na kufika karibu naye. ‘Wakamkaribia’ ni Kiswahili cha kawaida kinachohifadhi mwendo huo.
- source_word: וַיֹּאמְרוּ
  choice: na kusema
  rationale: Huu ni utangulizi wa kawaida wa maneno ya moja kwa moja katika masimulizi. Baada ya ‘wakamkaribia,’ ‘na kusema’ hutoa mfuatano wa asili kwa Kiswahili bila kurudia kiambishi cha wakati.
- source_word: גִּדְרֹת צֹאן
  choice: mazizi
  rationale: Kirai hiki kinamaanisha maeneo yenye uzio kwa ajili ya kondoo au makundi ya mifugo. ‘Mazizi’ ni neno la kawaida na fasaha katika Kiswahili; muktadha wa ‘mifugo yetu’ unaweka wazi matumizi yake.
- source_word: נִבְנֶה
  choice: Tutajenga
  rationale: Nafsi ya kwanza wingi ya hali isiyotimilika hapa inaeleza azimio au mpango wao. ‘Tutajenga’ huwasilisha kusudi hilo kwa uwazi.
- source_word: לְמִקְנֵנוּ
  choice: kwa ajili ya mifugo yetu
  rationale: מִקְנֶה ni mali ya wanyama kwa maana pana, si ng’ombe peke yao. ‘Mifugo yetu’ inadumisha upana huo.
- source_word: פֹּה
  choice: hapa
  rationale: Ni kielezi rahisi cha mahali, na ‘hapa’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: וְעָרִים
  choice: na miji
  rationale: עָרִים ni wingi wa עִיר. ‘Miji’ huhifadhi maana ya msingi, ingawa katika mazingira ya kale neno hilo pia lingeweza kutaja makazi yenye ukubwa mdogo.
- source_word: לְטַפֵּנוּ
  choice: kwa ajili ya watoto wetu wadogo
  rationale: טַף humaanisha watoto wadogo na wakati mwingine walio chini ya uangalizi kwa upana zaidi. ‘Watoto wetu wadogo’ huhifadhi msisitizo wa udogo na udhaifu bila kufanya maana kuwa pana kupita kiasi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisimulizi ulio wazi, wa sasa na wenye heshima. ‘Mazizi’ limetumiwa badala ya kirai kizito zaidi, huku tanbihi ikihifadhi upana unaowezekana wa טַף.
