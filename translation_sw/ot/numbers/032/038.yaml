base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/038.yaml
  text: and Nebo[a], and Baal-meon, their names having been changed, and Sibmah. And they gave names to the cities that they had built.
translation:
  language: sw
  text: na Nebo, na Baal-Meoni—majina yao yakiwa yamebadilishwa[a]—na Sibma. Wakayapa miji majina waliyoijenga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakiwa na majina yaliyobadilishwa” / “ambayo majina yao yalibadilishwa.” Inaelekea kirai cha Kiebrania kinaonyesha kwamba majina ya Nebo na Baal-Meoni yalibadilishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוֹ
  choice: Nebo
  rationale: Ni jina la mahali; limenukuliwa kwa herufi za Kiswahili badala ya kutafsiriwa.
- source_word: בַּעַל מְעוֹן
  choice: Baal-Meoni
  rationale: Ni jina ambatani la mahali. Umbo “Baal-Meoni” linasomeka kwa kawaida katika Kiswahili huku likihifadhi vipashio vya jina la Kiebrania.
- source_word: מוּסַבֹּת שֵׁם
  choice: majina yao yakiwa yamebadilishwa
  rationale: Kirai hiki kinaonyesha hali ya majina kubadilishwa. Wingi umeelekezwa kwa pamoja kwa Nebo na Baal-Meoni, lakini tanbihi inahifadhi uwezekano wa uhusiano wa kisarufi usio wazi kabisa.
- source_word: שִׂבְמָה
  choice: Sibma
  rationale: Ni jina la mahali, limenukuliwa kwa tahajia inayofaa Kiswahili.
- source_word: וַיִּקְרְאוּ בְשֵׁמוֹת
  choice: Wakayapa majina
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kueleza kitendo cha kuipa miji majina.
- source_word: אֶת שְׁמוֹת הֶעָרִים
  choice: miji
  rationale: Ingawa Kiebrania hutaja kihalisi “majina ya miji,” muundo wa Kiswahili “kuipa miji majina” huhifadhi maana nzima bila urudiaji usio wa asili.
- source_word: אֲשֶׁר בָּנוּ
  choice: waliyoijenga
  rationale: Kitenzi בנה kwa kawaida humaanisha kujenga. Hakijapanuliwa kuwa “kujenga upya,” ingawa muktadha mpana unaweza kuhusisha miji iliyokuwapo.
