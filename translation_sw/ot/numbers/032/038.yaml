translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Mistari mirefu imetumiwa kutenga kirai kinachoeleza kubadilishwa kwa majina bila kukifanya kuwa maelezo ya pembeni yasiyo sehemu ya sentensi.
