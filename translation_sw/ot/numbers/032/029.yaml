  terminology: “Yahweh” ni uwasilishaji thabiti wa יהוה kulingana na mwelekeo uliotolewa. “wana wa Gadi na wana wa Reubeni,” “Yordani,” “Gileadi,” na “milki” zinafaa; “milki” huwasilisha היטב אֲחֻזָּה katika muktadha huu.
