source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֲלֵ/הֶ֗ם אִם יַעַבְר֣וּ בְנֵי גָ֣ד וּ/בְנֵי רְאוּבֵ֣ן אִ֠תְּ/כֶם אֶֽת הַ/יַּרְדֵּ֞ן כָּל חָל֤וּץ לַ/מִּלְחָמָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/נִכְבְּשָׁ֥ה הָ/אָ֖רֶץ לִ/פְנֵי/כֶ֑ם וּ/נְתַתֶּ֥ם לָ/הֶ֛ם אֶת אֶ֥רֶץ הַ/גִּלְעָ֖ד לַ/אֲחֻזָּֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/029.yaml
  text: And Moses said to them, “If the sons of Gad and the sons of Reuben cross the Jordan with you, every armed man for battle before Yahweh, and the land is subdued before you, then you shall give them the land of Gilead as a possession.”
translation:
  language: sw
  text: Mose akawaambia, “Ikiwa wana wa Gadi na wana wa Reubeni watavuka Yordani pamoja nanyi, wote waliojihami kwa vita mbele ya Yahweh, na nchi ikitiishwa mbele yenu, basi mtawapa nchi ya Gileadi iwe milki yao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Wayyiqtol ya kisimulizi imetafsiriwa kwa mtiririko wa kawaida wa Kiswahili; kiwakilishi cha walengwa katika אֲלֵהֶם kimejumuishwa katika kitenzi.
- source_word: אִם
  choice: Ikiwa
  rationale: Inahifadhi sharti halisi linalotawala kupewa kwa nchi.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: wana wa Gadi na wana wa Reubeni
  rationale: Inadumisha usemi rasmi wa ukoo na utambulisho wa makabila ulio katika Kiebrania.
- source_word: יַעַבְרוּ ... אֶת הַיַּרְדֵּן
  choice: watavuka Yordani
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili kwa kuvuka mto, bila kuongeza neno lisilohitajika.
- source_word: אִתְּכֶם
  choice: pamoja nanyi
  rationale: Inaonyesha ushirika katika tendo kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: כָּל חָלוּץ לַמִּלְחָמָה
  choice: kila mtu mwenye silaha kwa ajili ya vita
  rationale: חָלוּץ katika muktadha huu ni mtu aliyejihami au aliyeandaliwa kwa mapigano; tafsiri hii inaeleweka huku ikihifadhi maana ya kijeshi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Inahifadhi maana ya kutenda mbele au katika uwepo wa Mungu na kulitumia jina la agano lililo katika matini.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: na nchi ikitiishwa
  rationale: Umbo la Niphal linabaki na maana tendwa ya nchi kuletwa chini ya mamlaka, bila kudokeza kuangamizwa kabisa.
- source_word: לִפְנֵיכֶם
  choice: mbele yenu
  rationale: Inahifadhi nahau ya Kiebrania inayohusisha kutiishwa kwa nchi na kusonga mbele kwa Israeli.
- source_word: וּנְתַתֶּם לָהֶם
  choice: basi mtawapa
  rationale: ‘Basi’ huonyesha kwa kawaida katika Kiswahili jibu la sharti lililoanzishwa na ‘ikiwa’.
- source_word: לַאֲחֻזָּה
  choice: iwe milki yao
  rationale: אֲחֻזָּה ni ardhi inayoshikiliwa kama milki ya kudumu; muundo huu ni wa asili katika Kiswahili na unaonyesha kwamba nchi hiyo itakuwa milki yao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina la kibinafsi la Mungu, si cheo. ‘Yahweh’ huhifadhi jina hilo kwa uwazi bila kulibadilisha kuwa cheo.
- issue: Maana ya kutenda לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  alternative: katika uwepo wa Yahweh
  rationale: Usemi mfupi wa chanzo umehifadhiwa, pamoja na mvutano wake wa kitheolojia kwamba vita vinafanywa chini ya uangalizi na mamlaka ya Yahweh; haujapanuliwa kuwa dai maalumu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sharti umewekwa wazi kwa ‘Ikiwa ... basi’; lugha rasmi ya kikabila ‘wana wa’ imehifadhiwa, na sentensi imebaki karibu na mpangilio wa Kiebrania bila kuwa ngumu kusoma.
