  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa masharti mawili wa Kiebrania: Musa anasema kwao, ‘Ikiwa mtafanya jambo hili, ikiwa mtajizatiti ...’ ‘Mbele za Yahweh’ huwakilisha לִפְנֵי יְהוָה, na ‘kwa ajili ya vita’ hutoa kwa usahihi kusudi la לַמִּלְחָמָה. Neno ‘mtajizatiti’ linaweza kubeba maana ya kujiandaa/kuchukua silaha katika muktadha huu wa kijeshi; tanbihi hulinda maana hiyo mahsusi.'
