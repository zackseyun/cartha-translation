  yaml_path: translation/ot/numbers/032/020.yaml
  text: And Moses said to them, “If you will do this thing, if you will arm yourselves before Yahweh for the war,”
translation:
  language: sw
  text: Musa akawaambia, “Ikiwa mtafanya jambo hili, ikiwa mtajizatiti[a] mbele za Yahweh[b] kwa ajili ya vita,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtakuwa mmejiandaa kwa silaha,” “mtaenda kama watu wenye silaha,” au “mtajipanga tayari.” Kitenzi cha Kiebrania hapa kina maana ya kijeshi ya kuwa na silaha au kuwa tayari kwa mapigano.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “mbele za Yahweh,” kikionyesha kuwa hatua yao ya kijeshi ingefanywa katika uwepo wa Yahweh na chini ya mamlaka yake.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם מֹשֶׁה
  choice: Musa akawaambia
  rationale: Muundo huu wa kawaida wa masimulizi ya Kiswahili unaonyesha mfuatano wa tukio na kuunganisha kwa ufasaha kitenzi, mhusika, na walengwa.
- source_word: אִם תַּעֲשׂוּן אֶת הַדָּבָר הַזֶּה
  choice: Ikiwa mtafanya jambo hili
  rationale: Kitenzi cha wakati ujao kinafaa kwa sharti linalotazamia utekelezaji; ‘jambo hili’ hurejelea pendekezo lililotangulia bila kulibana kuwa neno tu.
- source_word: אִם תֵּחָלְצוּ
  choice: ikiwa mtajizatiti
  rationale: Katika muktadha wa kijeshi, Nifali ya חלץ humaanisha kuwa na silaha au kujiandaa kwa mapigano. ‘Kujizatiti’ ni Kiswahili cha sasa na cha asili kinachobeba maana ya kujiandaa kikamilifu, huku tanbihi ikifafanua dhana ya silaha.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: ‘Mbele za’ huhifadhi maana ya kuwa katika uwepo wa Yahweh na chini ya mamlaka yake, bila kuifanya kuwa maelezo marefu ndani ya mstari.
- source_word: לַמִּלְחָמָה
  choice: kwa ajili ya vita
  rationale: Huwakilisha kusudi la maandalizi ya kijeshi kwa lugha ya kawaida na yenye heshima.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina maalumu badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לִפְנֵי יְהוָה katika shughuli ya kijeshi
  choice: mbele za Yahweh
  alternative: katika uwepo wa Yahweh
  rationale: Uwasilishaji mfupi huhifadhi uwepo na mamlaka ya Mungu bila kuamua zaidi ya maandishi jinsi ushiriki huo wa kimungu unavyopaswa kufafanuliwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Akawaambia’ hudumisha mtiririko wa masimulizi; ‘mtajizatiti’ ni ya asili lakini imewekewa tanbihi ili kuhifadhi maana mahsusi ya kijeshi.
