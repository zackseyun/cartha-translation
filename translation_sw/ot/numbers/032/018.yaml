base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/018.yaml
  text: We will not return to our houses until the sons of Israel have each taken possession of his inheritance[a].
translation:
  language: sw
  text: Hatutarudi nyumbani kwetu mpaka kila mmoja wa wana wa Israeli awe amepokea urithi wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Waisraeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נָשׁוּב
  choice: Hatutarudi
  rationale: Kauli ya ukanushi pamoja na kitenzi cha Qal imperfect nafsi ya kwanza wingi inaonyesha ahadi kuhusu tendo la wakati ujao; ‘Hatutarudi’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: אֶל בָּתֵּינוּ
  choice: nyumbani kwetu
  rationale: Ingawa kwa umbo ni ‘kwenye nyumba zetu,’ Kiswahili kwa kawaida husema ‘kurudi nyumbani.’ Umilikaji ‘kwetu’ huhifadhi maana ya kiambishi cha nafsi ya kwanza wingi.
- source_word: עַד
  choice: mpaka
  rationale: Huonyesha kikomo cha muda ambacho kabla yake hawatarudi.
- source_word: הִתְנַחֵל
  choice: wawe wamepokea
  rationale: Hitpael ya נחל hapa inaeleza kuupata urithi wa ardhi uliogawiwa. Muundo ‘wawe wamepokea’ baada ya ‘mpaka’ unaonyesha kwamba tendo hilo lazima likamilike kwanza.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi nahau ya kifamilia na umbo la kiume la Kiebrania kwa Kiswahili cha kibiblia kinachoeleweka; ‘Waisraeli’ limetolewa kama tafsiri mbadala katika tanbihi.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: Katika muundo huu neno lina kazi ya kugawa kwa mtu mmoja mmoja; ‘kila mmoja’ ni ya asili kuliko tafsiri kavu ya ‘mwanamume.’
- source_word: נַחֲלָתוֹ
  choice: urithi wake
  rationale: Hurejelea sehemu ya ardhi iliyogawiwa kila mmoja kuwa milki yake; ‘urithi wake’ huhifadhi istilahi kuu ya Kiebrania bila kuongeza maelezo yasiyomo katika mstari.
theological_decisions:
- issue: Nahau ya kifamilia yenye jinsia katika בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: ‘Wana wa Israeli’ huhifadhi kwa karibu umbo la Kiebrania na lugha ya kifamilia ya agano. Kwa kuwa ‘Waisraeli’ ni Kiswahili cha kawaida zaidi na kinaweza kuwakilisha kundi lilelile, kimehifadhiwa katika tanbihi badala ya kuchukua nafasi ya nahau ya chanzo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nyumbani kwetu’ limetumiwa badala ya ‘kwenye nyumba zetu’ kwa uasilia wa Kiswahili, huku istilahi ‘urithi’ na nahau ‘wana wa Israeli’ zikihifadhi uhusiano wa karibu na chanzo.
