base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/034.yaml
  text: The sons of Gad built Dibon[a], Ataroth[b], and Aroer.
translation:
  language: sw
  text: Wana wa Gadi[a] walijenga[b] Diboni, Atarothi, na Aroeri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni ‘wana wa Gadi’; yaani, watu wa kabila la Gadi.
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha huu inaweza pia kueleweka ‘walijenga upya’ au ‘waliimarisha’; lakini kitenzi cha Kiebrania chenyewe ni ‘walijenga.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: walijenga
  rationale: Kitenzi בנה kwa msingi wake ni ‘kujenga.’ Katika muktadha wa kuyafanya miji hii kuwa makao, maana ya ‘kujenga upya’ au ‘kuimarisha kwa ngome’ inaweza kudokezwa, lakini haijaainishwa na kitenzi chenyewe.
- source_word: בְנֵי גָד
  choice: Wana wa Gadi
  rationale: Tafsiri hii inadumisha usemi wa Kiebrania wa undugu, ‘wana wa Gadi,’ huku ikieleweka kuwa ni watu wa kabila la Gadi.
- source_word: אֶת
  choice: '[halijatafsiriwa kwa neno tofauti]'
  rationale: Ni kiashiria cha yambwa tendwa katika Kiebrania; kazi yake inaonyeshwa na mpangilio wa sentensi ya Kiswahili.
- source_word: דִּיבֹן
  choice: Diboni
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yaliyozoeleka katika Kiswahili.
- source_word: עֲטָרֹת
  choice: Atarothi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: עֲרֹעֵר
  choice: Aroeri
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
