base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/009.yaml
  text: They went up as far as the Valley of Eshcol and saw the land[c][b][a], and they discouraged the heart of the sons of Israel from going into the land that Yahweh had given them.
translation:
  language: sw
  text: Walipanda mpaka Bonde la Eshkoli, wakaiona nchi, na wakavunja moyo wa wana wa Israeli[a][b] ili wasiingie katika nchi ambayo Yahwe[c] alikuwa amewapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kinasema “wana wa Israeli,” jina la kawaida la taifa la Israeli.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania hapa kinaweza kumaanisha kuwakata tamaa, kudhoofisha azimio lao, au kuwafanya waache kuingia.
    reason: source_idiom
  - marker: c
    text: “Yahwe” linawakilisha jina la Mungu יהוה (YHWH).
    reason: divine_name
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Walipanda
  rationale: Kitenzi עלה kina maana ya kwenda au kupanda juu; “walipanda” ni cha kawaida katika Kiswahili na kinahifadhi mwelekeo uliomo katika Kiebrania.
- source_word: עַד נַחַל אֶשְׁכּוֹל
  choice: mpaka Bonde la Eshkoli
  rationale: עַד ni “mpaka,” na נַחַל inaweza kumaanisha bonde lenye kijito au mkondo wa msimu. “Bonde” linaeleweka kwa urahisi, huku Eshkoli likihifadhiwa kama jina la mahali.
- source_word: וַיִּרְאוּ אֶת הָאָרֶץ
  choice: wakaiona nchi
  rationale: ראה humaanisha kuona. Muundo huu ni wa kawaida katika Kiswahili na unafuata mfululizo wa masimulizi ya Kiebrania.
- source_word: וַיָּנִיאוּ אֶת לֵב
  choice: wakawavunja moyo
  rationale: Hifili ya נוא hapa inaonyesha kugeuza azimio, kukatisha tamaa, au kuwafanya watu warudi nyuma. Nahau “kuvunja moyo” huwasilisha kwa Kiswahili dhana ya kudhoofisha ujasiri na azimio, huku dokezo likieleza umbo la Kiebrania.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inahifadhi kwa karibu jina la kitaifa na la agano la Kiebrania; “Waisraeli” ni mbadala wa kawaida zaidi.
- source_word: לְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: ili wasiingie katika nchi
  rationale: לְבִלְתִּי pamoja na kitenzi-jina huonyesha matokeo au kuzuiwa. “Ili wasiingie” ni wazi na ya kawaida, na בוא אֶל katika muktadha huu ni kuingia nchini.
- source_word: אֲשֶׁר נָתַן לָהֶם יְהוָה
  choice: ambayo Yahwe alikuwa amewapa
  rationale: Wakati uliotangulia katika Kiswahili unaonyesha kwamba utoaji wa nchi unatazamwa kama uliotangulia tendo linalosimuliwa. Jina יהוה limetafsiriwa “Yahwe.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano YHWH. “Yahwe” hulihifadhi kama jina binafsi bila kulibadili kuwa cheo, huku dokezo likifafanua jambo hilo.
- issue: Hali ya nchi kuwa tayari imetolewa
  choice: alikuwa amewapa
  alternative: aliwapa; alikuwa akiwapa
  rationale: Kitenzi נָתַן ni timilifu na simulizi linatazama utoaji huo kwa kurejea nyuma. Tafsiri haiondoi mvutano kati ya zawadi ya Mungu na hitaji la Israeli kuingia nchini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. Viunganishi vya masimulizi vimehifadhiwa kwa “na” badala ya kuingiza tofauti ya maana kama “lakini.” Nahau “wakawavunja moyo” inaeleweka kwa wasomaji wa sasa, huku dokezo likihifadhi taswira na umoja wa “moyo” katika Kiebrania.
