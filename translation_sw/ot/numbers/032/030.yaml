  text: But if they do not cross over armed with you[a], then they shall receive property among you in the land of Canaan.
translation:
  language: sw
  text: Lakini ikiwa hawatavuka wakiwa wamejiandaa kwa vita pamoja nanyi, basi watapewa milki[a] miongoni mwenu katika nchi ya Kanaani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “basi watakuwa na milki miongoni mwenu katika nchi ya Kanaani.” Kitenzi cha Kiebrania kinaweza kueleza hali ya kuwa na umiliki ulioanzishwa, si tendo la kuupokea tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Lakini ikiwa
  rationale: Kiunganishi hiki kinaanzisha sharti linalotofautiana na lile la mstari uliotangulia; “Lakini ikiwa” huonyesha utofauti huo kwa Kiswahili cha kawaida.
- source_word: לֹא יַעַבְרוּ
  choice: hawatavuka
  rationale: Huonyesha kutovuka kwenda upande mwingine, kulingana na muktadha wa kuvuka Yordani kuelekea Kanaani.
- source_word: חֲלוּצִים
  choice: wakiwa wamejiandaa kwa vita
  rationale: Neno hili humaanisha kuwa tayari au kupangwa kwa ajili ya mapigano; kauli hii ni wazi na ya kawaida kuliko tafsiri finyu ya “wakiwa na silaha.”
- source_word: אִתְּכֶם
  choice: pamoja nanyi
  rationale: Huonyesha kuandamana na Waisraeli wengine katika kuvuka.
- source_word: וְנֹאחֲזוּ
  choice: basi watapewa milki
  rationale: Katika muktadha wa kugawa nchi, hali ya kutendwa ya kitenzi hiki huonyesha kupewa au kuwekwa katika umiliki wa sehemu ya nchi. “Watapewa milki” ni ya kawaida na inadumisha wazo la kupokea milki badala ya kujinyakulia.
- source_word: בְּתֹכְכֶם
  choice: miongoni mwenu
  rationale: Huonyesha kwamba sehemu yao ingekuwa ndani ya eneo la jumuiya ya Israeli upande wa Kanaani.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Huhifadhi jina kamili la eneo lililo katika maandishi ya Kiebrania.
