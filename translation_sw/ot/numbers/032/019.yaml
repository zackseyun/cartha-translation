  yaml_path: translation/ot/numbers/032/019.yaml
  text: For we will not inherit with them beyond the Jordan and farther on[a], because our inheritance has come to us on this side of the Jordan, to the east.
translation:
  language: sw
  text: Kwa maana hatutarithi pamoja nao ng’ambo ya Yordani na kuendelea, kwa sababu urithi wetu umetujia[a] upande huu wa Yordani, mashariki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu urithi wetu umetupasa upande wa mashariki wa Yordani.”
    reason: Hutoa mbadala wa kimuktadha wa בָּאָה נַחֲלָתֵנוּ אֵלֵינוּ, unaoeleza urithi kuwa mgawo uliowajia.
lexical_decisions:
- source_word: נִנְחַל
  choice: hatutarithi
  rationale: Kitenzi hiki humaanisha kupokea au kumiliki urithi. ‘Kurithi’ ni kifupi, cha kawaida, na kinadumisha maana ya kupewa sehemu ya nchi.
- source_word: אִתָּם
  choice: pamoja nao
  rationale: Kauli hii inaonyesha kushiriki pamoja na makabila mengine katika kupokea urithi.
- source_word: מֵעֵבֶר לַיַּרְדֵּן וָהָלְאָה
  choice: ng’ambo ya Yordani na kuendelea
  rationale: Tafsiri hii inadumisha wazo la kuvuka Yordani kuelekea eneo la upande mwingine na kusonga mbele zaidi.
- source_word: בָאָה נַחֲלָתֵנוּ אֵלֵינוּ
  choice: urithi wetu umetujia
  rationale: Muundo huu unafuata picha halisi ya Kiebrania ya urithi ‘kuja’ kwao, huku ukibaki wa asili katika Kiswahili.
- source_word: נַחֲלָתֵנוּ
  choice: urithi wetu
  rationale: ‘Urithi’ hudumisha maana ya sehemu ya nchi waliyopewa katika mgawanyo wa nchi.
- source_word: מֵעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: upande huu wa Yordani, upande wa mashariki
  rationale: Kwa kuwa wasemaji wako mashariki mwa Yordani, ‘upande huu’ huweka wazi mtazamo wao; ‘upande wa mashariki’ hutafsiri מִזְרָחָה moja kwa moja.
