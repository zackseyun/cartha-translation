translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. ‘Ng’ambo ya Yordani’ na ‘upande huu wa Yordani’ zinatofautisha pande mbili kulingana na mtazamo wa wasemaji bila kuondoa msisitizo wa mahali katika Kiebrania.
