  text: אִם יִרְא֨וּ הָ/אֲנָשִׁ֜ים הָ/עֹלִ֣ים מִ/מִּצְרַ֗יִם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה אֵ֚ת הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֛עְתִּי לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב כִּ֥י לֹא מִלְא֖וּ אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/011.yaml
  text: Surely none of the men who came up from Egypt[a], from twenty years old and upward, shall see the land that I swore to Abraham, to Isaac, and to Jacob[b], because they have not fully followed me.
translation:
  language: sw
  text: Hakika, hakuna hata mmoja wa wanaume waliopanda kutoka Misri[a], wenye umri wa miaka ishirini na kuendelea, atakayeiona nchi niliyoapa kwa Abrahamu, kwa Isaka, na kwa Yakobo, kwa sababu hawakunifuata kikamilifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia usemi “waliopanda kutoka Misri,” usemi wa kawaida katika masimulizi ya Kutoka.
    reason: lexical_alternative
  - marker: b
    text: Au, “hawakunifuata kabisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Hakika, hakuna hata mmoja ... atakayeiona
  rationale: Katika kiapo hiki אִם huanzisha kauli yenye ukanushaji ulioachwa kudokezwa. Kiswahili cha moja kwa moja chenye ‘ikiwa’ kingeficha maana; ‘Hakika, hakuna hata mmoja’ kinawasilisha nguvu ya kiapo na uamuzi hasi.
- source_word: יִרְאוּ
  choice: atakayeiona
  rationale: ראה hapa ni ‘kuona’ kwa maana pana ya kufikia au kupata uzoefu wa nchi. ‘Atakayeiona’ huhifadhi lugha halisi bila kuongeza moja kwa moja wazo la kuimiliki.
- source_word: הָאֲנָשִׁים
  choice: wanaume
  rationale: Nomino ya Kiebrania ni ya kiume kwa wingi na inafaa muktadha wa wanaume wa umri wa kuhesabiwa kwa huduma ya kijeshi.
- source_word: הָעֹלִים מִמִּצְרַיִם
  choice: waliopanda kutoka Misri
  rationale: Tafsiri hii huhifadhi tamathali ya kawaida ya Kutoka Misri inayotumia kitenzi ‘kupanda,’ badala ya kuisawazisha kuwa ‘waliotoka’ tu.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: wenye umri wa miaka ishirini na kuendelea
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili kwa kiwango cha umri kinachoanzia miaka ishirini.
- source_word: הָאֲדָמָה
  choice: nchi
  rationale: Ingawa neno linaweza kumaanisha ardhi au udongo, hapa linarejelea eneo la nchi lililoahidiwa kwa mababu.
- source_word: נִשְׁבַּעְתִּי
  choice: niliyowaapia
  rationale: Muundo huu unaonyesha kwa kifupi kwamba Mungu aliwaapia Abrahamu, Isaka na Yakobo kuhusu nchi, huku ukihifadhi uzito wa kiapo.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abrahamu, Isaka na Yakobo
  rationale: Majina yanafuata maumbo yaliyozoeleka katika Kiswahili cha Biblia; uhusiano wa kiapo na kila mmoja wao unaonyeshwa na kitenzi ‘niliyowaapia.’
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי hapa inatoa sababu ya hukumu iliyotamkwa katika kiapo.
- source_word: לֹא מִלְאוּ אַחֲרַי
  choice: hawakunifuata kikamilifu
  rationale: Nahau מלא אחרי humaanisha kumfuata mtu kikamilifu. Tafsiri hii huhifadhi lugha ya kufuata bila kuipanua kuwa dhana ya jumla ya uaminifu.
theological_decisions:
- issue: Kauli ya kiapo inayoanzishwa na אִם
  choice: Hakika, hakuna hata mmoja ... atakayeiona nchi
  alternative: Ikiwa wanaume ... wataiona nchi
  rationale: Katika muktadha huu, אִם ni sehemu ya kiapo chenye ukanushaji unaodokezwa. Kutumia ‘ikiwa’ peke yake kungefanya sentensi ionekane ya masharti na isiyokamilika, ilhali tafsiri iliyochaguliwa huhifadhi hukumu kali bila kuongeza fundisho la ziada.
- issue: Upeo wa nahau לֹא מִלְאוּ אַחֲרַי
  choice: hawakunifuata kikamilifu
  alternative: hawakuwa waaminifu kwangu kabisa
  rationale: Neno la asili linasisitiza kumfuata Mungu kikamilifu, si kutoa kauli pana ya kinadharia kuhusu kila kipengele cha uaminifu wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. ‘Hakika’ huhifadhi uzito wa kiapo; ‘wenye umri wa miaka ishirini na kuendelea’ ni usemi wa sasa na wa kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
