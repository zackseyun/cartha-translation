lexical_decisions:
- source_word: עֲטָרוֹת
  choice: Atarothi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, bila kutafsiri maana yake.
- source_word: דִיבֹן
  choice: Diboni
  rationale: Jina la mahali limetoholewa katika umbo la kawaida la Kiswahili.
- source_word: יַעְזֵר
  choice: Yazeri
  rationale: Herufi ya kwanza ya Kiebrania ni yod; kwa hiyo “Yazeri” linaakisi matamshi ya chanzo na ni la asili zaidi katika Kiswahili kuliko umbo lenye J la Kiingereza.
- source_word: נִמְרָה
  choice: Nimra
  rationale: Jina fupi lililo katika mstari huu limehifadhiwa; halijapatanishwa na jina refu la Beth-nimra linalopatikana kwingine.
- source_word: חֶשְׁבּוֹן
  choice: Heshboni
  rationale: Jina la mahali limetoholewa kwa umbo linalotambulika na kusomeka kwa Kiswahili.
- source_word: אֶלְעָלֵה
  choice: Eleale
  rationale: Utohozi unafuata kwa karibu silabi za jina la Kiebrania huku ukiwa rahisi kutamka kwa Kiswahili.
- source_word: שְׂבָם
  choice: Sebamu
  rationale: Umbo la konsonanti lililo katika mstari huu linaunga mkono “Sebamu”; halijabadilishwa kuwa Sibma au Shibma, maumbo yanayotokea katika vifungu vingine.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Jina la mahali limetoholewa moja kwa moja na tayari lina umbo linalotamkika kwa Kiswahili.
- source_word: בְּעֹן
  choice: Beoni
  rationale: Umbo fupi lililoandikwa hapa limehifadhiwa badala ya kupanuliwa kuwa Baal-meoni kama linavyopatikana kwingine.
- source_word: וְ / וּ
  choice: na kabla ya jina la mwisho
  rationale: Ingawa Kiebrania hurudia kiunganishi katika orodha, Kiswahili cha kawaida hutumia koma na kuweka “na” kabla ya kipengele cha mwisho; hivyo mpangilio wote unahifadhiwa bila lugha kuwa nzito.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Majina yametoholewa kwa mifumo ya sauti ya Kiswahili. Orodha imetumia koma na kiunganishi cha mwisho kwa mtiririko wa asili; alama ya kistari kirefu imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata. Viashirio vya tanbihi vimewekwa baada ya majina yanayohusika, yaani Sebamu na Beoni.
