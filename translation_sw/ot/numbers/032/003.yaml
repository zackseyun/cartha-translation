  text: Atarothi, Diboni, Yaazeri, Nimra, Heshboni, Eleale, Sebamu[a], Nebo, na Beoni[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina “Sebamu”; kwingine jina la mahali linalohusiana nalo huandikwa “Sibma” au “Shibma.”
