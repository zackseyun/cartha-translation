lexical_decisions:
- source_word: וְאֶת
  choice: na
  rationale: Kiunganishi וְ kimetafsiriwa kuwa “na”; אֶת ni alama ya yambwa maalumu katika Kiebrania na haihitaji kutafsiriwa moja kwa moja katika orodha hii ya majina.
- source_word: עַטְרֹת שׁוֹפָן
  choice: Atroth-Shofani
  rationale: Ni jina ambatani la mahali, hivyo limenukuliwa kifonetiki badala ya kutafsiriwa. “Shofani” linafuata mazoea ya Kiswahili ya kuwakilisha sauti ya Kiebrania שׁ kwa “sh” na kurekebisha mwisho wa jina ili litamkike kwa urahisi.
- source_word: יַעְזֵר
  choice: Yazeri
  rationale: Ni jina la mahali. “Yazeri” linakaribia matamshi ya Kiebrania na lina umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: יָגְבֳּהָה
  choice: Yogbeha
  rationale: Ni jina la mahali; umbo hili linanukuu Kiebrania kwa herufi na mpangilio wa sauti unaoeleweka kwa msomaji wa Kiswahili.
