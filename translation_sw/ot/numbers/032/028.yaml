base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/028.yaml
  text: So Moses commanded Eleazar the priest[a], Joshua son of Nun[b], and the heads of the fathers’ houses of the tribes of the sons of Israel concerning them.
translation:
  language: sw
  text: Basi Musa akawaagiza Eleazari, kuhani, Yoshua mwana wa Nuni, na viongozi wa koo za makabila ya Waisraeli[b] kuhusu watu hao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwaagiza hao,” ikiwa “hao” inaeleweka kuwa viongozi waliotajwa katika mstari huu badala ya makabila yaliyotajwa kabla.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “wakuu wa nyumba za mababa za makabila ya wana wa Israeli”; huu ni usemi wa kiutawala unaowataja viongozi wa koo na makabila ya Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: akawaagiza
  rationale: Kitenzi צוה kinaonyesha agizo lenye mamlaka. “Akawaagiza” ni cha kawaida na chenye hadhi katika Kiswahili, bila kupunguza nguvu ya agizo.
- source_word: לָהֶם
  choice: kuhusu watu hao
  rationale: Katika muktadha, kiwakilishi kinaelekea kuwarejelea Warubeni na Wagadi waliotajwa kabla; Kiswahili hiki kinaonyesha kwamba maagizo yaliyotolewa kwa viongozi yaliwahusu watu hao, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: אֵת אֶלְעָזָר הַכֹּהֵן
  choice: Eleazari kuhani
  rationale: Alama ya yambwa אֵת inawatambulisha waliopokea agizo. Muundo wa Kiswahili “akawaagiza Eleazari kuhani” unaonyesha uhusiano huo kwa kawaida.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yoshua mwana wa Nuni
  rationale: Majina yametolewa kwa maumbo yanayotambulika katika Kiswahili, na patronimiki בִּן נוּן imetafsiriwa moja kwa moja kuwa “mwana wa Nuni.”
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: viongozi wa koo za makabila
  rationale: Huu ni usemi wa kiutawala unaowataja wakuu wa makundi ya ukoo ndani ya makabila. “Viongozi wa koo za makabila” ni wazi na wa asili katika Kiswahili kuliko tafsiri neno kwa neno ya “vichwa vya nyumba za baba.”
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wa Waisraeli
  rationale: Ingawa kwa umbo la nje ni “wana wa Israeli,” hapa usemi huo unalitambulisha taifa katika mfumo wake wa kikabila. “Waisraeli” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
theological_decisions:
- issue: Rejeleo na kazi ya kisarufi ya לָהֶם
  choice: Maagizo yaliwahusu Warubeni na Wagadi waliotajwa katika muktadha uliotangulia.
  alternative: 'Kiwakilishi kinaweza kueleweka kuwa kinawarejelea viongozi waliotajwa katika mstari huu: “aliwaagiza wao.”'
  rationale: Mpangilio wa Kiebrania unaruhusu mjadala kuhusu uhusiano wa לָהֶם na yambwa zinazofuata. Muktadha unapendelea maana ya “kuhusu watu hao,” lakini tanbihi inahifadhi uwezekano mwingine bila kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa urahisi. Muundo wa kiutawala wa Kiebrania umeelezwa kwa “viongozi wa koo za makabila,” huku umbo lake la karibu zaidi likihifadhiwa katika tanbihi.
