base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/041.yaml
  text: And Jair son of Manasseh went and captured their villages[a], and he called them Havvoth-jair.
translation:
  language: sw
  text: Yairi mwana wa Manase akaenda, akateka vijiji vyao, akaviita Havoth-yairi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Havoth-yairi maana yake ni “vijiji vya Yairi” au “makazi ya Yairi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָאִיר
  choice: Yairi
  rationale: Namna ya kawaida ya kuandika jina hili la Kiebrania kwa Kiswahili, bila kulitafsiri.
- source_word: בֶּן מְנַשֶּׁה
  choice: mwana wa Manase
  rationale: Huhifadhi maana ya moja kwa moja ya muundo wa Kiebrania; ingawa katika nasaba neno hilo wakati mwingine linaweza kumaanisha mzao, hapa halijafafanuliwa zaidi ya chanzo.
- source_word: הָלַךְ
  choice: akaenda
  rationale: Ni tafsiri ya kawaida na ya asili katika mfululizo wa masimulizi, bila kuongeza mwelekeo wala kusudi lisilotajwa.
- source_word: וַיִּלְכֹּד
  choice: na kuteka
  rationale: Kitenzi hiki huonyesha kutwaa au kukamata, hasa katika mazingira ya kijeshi au ya eneo; “kuteka” linafaa katika muktadha huu.
- source_word: חַוֺּתֵיהֶם
  choice: vijiji vyao
  rationale: Neno hilo linarejelea makazi madogo au vijiji visivyo na kuta; “vijiji” ni la kawaida na wazi kwa wasomaji wa Kiswahili.
- source_word: וַיִּקְרָא אֶתְהֶן
  choice: akaviita
  rationale: Katika muktadha huu קרא pamoja na yambwa humaanisha kuita au kuyapa jina; “akaviita” ni ya asili na hudumisha maana hiyo.
- source_word: חַוֺּת יָאִיר
  choice: Havoth-yairi
  rationale: Ni jina maalumu la mahali lililoundwa kwa neno la makazi pamoja na jina Yairi; limenukuliwa kwa herufi za Kiswahili, huku maana yake ikielezwa katika tanbihi.
