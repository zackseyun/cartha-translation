  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfuatano na wahusika wa Kiebrania: wana wa Gadi na Reubeni wanakuja na kuelekeza maneno yao kwa Musa, Eleazari kuhani, na viongozi wa kusanyiko. “Wakazungumza na” ni uwasilishaji unaokubalika wa וַיֹּאמְרוּ אֶל katika muktadha huu, sambamba na audit ya Kiingereza “spoke to.”'
