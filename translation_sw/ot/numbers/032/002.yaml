base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/002.yaml
  text: Then the sons of Gad and the sons of Reuben came and spoke to Moses, to Eleazar the priest, and to the leaders of the congregation, saying,
translation:
  language: sw
  text: Ndipo wana wa Gadi na wana wa Reubeni wakaja, wakazungumza na Musa, na kuhani Eleazari, na viongozi wa kusanyiko, wakisema,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: wana wa Gadi na wana wa Reubeni
  rationale: Muundo wa Kiebrania umehifadhiwa kwa kuwa hapa unataja watu wa makabila hayo kwa lugha ya nasaba.
- source_word: וַיָּבֹאוּ
  choice: wakaja
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi cha mwendo katika simulizi.
- source_word: וַיֹּאמְרוּ אֶל
  choice: wakazungumza na
  rationale: Katika muktadha huu, 'zungumza na' ni Kiswahili cha asili kinachoonyesha kuwa waliwaelekezea maneno viongozi waliotajwa, bila kuongeza maudhui ya kauli.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: viongozi wa kusanyiko
  rationale: Nְשִׂיאִים ni wakuu au viongozi, na עֵדָה ni jumuiya iliyokusanyika; 'kusanyiko' hudumisha maana hiyo bila kuingiza istilahi ya dhehebu.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Huhifadhi fomula ya Kiebrania inayotanguliza maneno yatakayofuata katika mstari unaofuata.
