  text: And the sons of Reuben built Heshbon[a], Elealeh, and Kiriathaim.
translation:
  language: sw
  text: Nao wana wa Reubeni walijenga Heshiboni[a], Eleale, na Kiriathaimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nao Wareubeni walijenga Heshiboni, Eleale, na Kiriathaimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי רְאוּבֵן
  choice: Nao wana wa Reubeni
  rationale: בְנֵי maana yake ya moja kwa moja ni ‘wana wa’; pamoja na jina la kabila, inawataja wazao wa Reubeni. Muundo huu unadumisha msisitizo wa Kiebrania kuhusu ukoo, huku ‘Nao’ ikiunganisha sentensi kwa kawaida katika Kiswahili.
- source_word: בָּנוּ
  choice: waliijenga
  rationale: Kitenzi בנה katika qal kwa kawaida humaanisha ‘kujenga’. Katika muktadha huu huenda kikahusisha kujenga upya au kuimarisha mji, lakini maana hiyo ya ziada haijaelezwa wazi katika neno lenyewe.
- source_word: אֶת
  choice: '[halijatafsiriwa kando]'
  rationale: Ni alama ya yambwa maalumu katika Kiebrania na haina neno la pekee linalolingana nayo katika Kiswahili; imewakilishwa na muundo wa kawaida wa sentensi.
- source_word: חֶשְׁבּוֹן
  choice: Heshboni
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: אֶלְעָלֵא
  choice: Eleale
  rationale: Jina la mahali limenukuliwa kwa namna inayokaribia umbo la Kimasoreti na inayofaa matamshi ya Kiswahili.
- source_word: קִרְיָתָיִם
  choice: Kiriathaimu
  rationale: Jina la mahali limetoholewa kwa mfumo wa sauti na tahajia unaoeleweka kwa wasomaji wa Kiswahili huku likihifadhi utambulisho wa jina la Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa urahisi. Tafsiri imedumisha usemi wa ukoo ‘wana wa Reubeni’ na kuweka katika tanbihi usemi wa kawaida zaidi ‘Wareubeni’. Kiambishi cha yambwa katika ‘waliijenga’ kinaafikiana na Heshboni kama mji wa kwanza katika orodha, huku kitenzi kimoja kikihusu miji yote mitatu.
