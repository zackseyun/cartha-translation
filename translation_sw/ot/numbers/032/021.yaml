base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/021.yaml
  text: and every armed man among you crosses the Jordan before Yahweh[a], until he has driven out his enemies from before him[b],
translation:
  language: sw
  text: na kila mtu mwenye silaha miongoni mwenu atavuka Yordani mbele za Yahwe, mpaka awe amewafukuza adui zake kutoka mbele zake[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kiebrania kinaweza pia kutafsiriwa “kuwanyang’anya milki.” Viwakilishi katika “awe amewafukuza adui zake kutoka mbele zake” kwa kawaida vinaelekea kumrejelea Yahwe, ingawa wengine huvielewa kuwa vinarejelea Israeli kwa ujumla au jeshi lake.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: וְעָבַר
  choice: akivuka
  rationale: Katika sharti linaloendelea kutoka mstari wa 20, kitenzi hiki kina nguvu ya wakati ujao wa kisharti; 'akivuka' huunganisha sharti hilo kwa Kiswahili cha kawaida.
- source_word: לָכֶם כָּל חָלוּץ
  choice: kila mtu mwenye silaha miongoni mwenu
  rationale: Huwasilisha maana ya kila mmoja aliyejiandaa kwa vita na uhusiano wake na makabila yanayosemeshwa.
- source_word: אֶת הַיַּרְדֵּן
  choice: Yordani
  rationale: Hili ndilo jina la kawaida la mto huo katika Kiswahili; neno 'Mto' si lazima katika muktadha huu.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi maana ya kuwapo mbele ya Mungu na kulitaja jina la agano יְהוָה moja kwa moja.
- source_word: הוֹרִישׁוֹ
  choice: atakapowafukuza
  rationale: Hifil ya ירשׁ hapa inaweza kumaanisha kufukuza au kuwanyang'anya watu milki; 'kuwafukuza' ni ya kawaida na inafaa kwa muktadha wa maadui.
- source_word: אֹיְבָיו
  choice: adui zake
  rationale: Kiambishi cha nafsi ya tatu umoja kimehifadhiwa ili kutoondoa uhusiano wa viwakilishi katika Kiebrania.
- source_word: מִפָּנָיו
  choice: kutoka mbele zake
  rationale: Huhifadhi kwa karibu nahau ya Kiebrania na mwangwi wa לִפְנֵי, bila kuamua kimya kimya rejeo la kiwakilishi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja; 'Yahwe' huhifadhi jina la agano badala ya kulibadili kuwa cheo.
- issue: Rejeo la viwakilishi vya nafsi ya tatu umoja katika הוֹרִישׁוֹ / אֹיְבָיו / מִפָּנָיו
  choice: Vimeachwa katika umoja na kwa kawaida vinaelekea kumrejelea Yahwe
  alternative: Vinaweza kueleweka kuwa vinarejelea Israeli kwa ujumla au jeshi lake
  rationale: Kirai cha karibu 'mbele za Yahwe' na lugha ya ushindi katika Pentateuki vinaunga mkono Yahwe kuwa rejeo, lakini sarufi inaruhusu uwezekano mwingine; tanbihi inahifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisharti umeendelezwa kwa 'akivuka ... mpaka atakapowafukuza'; lugha ya kijeshi imewekwa wazi bila kuongeza tafsiri ya kimadhehebu.
