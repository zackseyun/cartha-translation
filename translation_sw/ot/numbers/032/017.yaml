    issue: Awkward and incomplete coordination in the opening clause
    rationale: “Tutajifunga silaha upesi na kwenda mbele” mixes a finite future verb with an infinitive and makes the intended advance ahead of the other Israelites less clear. A participial clause naturally expresses the pledged accompanying action.
  - severity: low
