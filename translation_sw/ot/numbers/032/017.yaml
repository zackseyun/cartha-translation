  text: וַ/אֲנַ֜חְנוּ נֵחָלֵ֣ץ חֻשִׁ֗ים לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֛ד אֲשֶׁ֥ר אִם הֲבִֽיאֹנֻ֖/ם אֶל מְקוֹמָ֑/ם וְ/יָשַׁ֤ב טַפֵּ֨/נוּ֙ בְּ/עָרֵ֣י הַ/מִּבְצָ֔ר מִ/פְּנֵ֖י יֹשְׁבֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/017.yaml
  text: But we ourselves will arm ourselves quickly before the sons of Israel[a], until we have brought them to their place[b]; and our little ones will remain in the fortified cities because of the inhabitants of the land.
translation:
  language: sw
  text: Lakini sisi wenyewe tutavaa silaha upesi, tukitangulia wana wa Israeli[a], mpaka tutakapowafikisha mahali pao; watoto wetu[b] watakaa katika miji yenye ngome kwa sababu ya wakaaji wa nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tukiwa mbele ya Waisraeli.” Kirai hiki kwa maana ya moja kwa moja ni “mbele ya wana wa Israeli,” na katika muktadha huu huenda kinamaanisha kwenda mbele yao vitani.
    reason: lexical_alternative
  - marker: b
    text: Neno lililotafsiriwa “watoto” linaweza kumaanisha kwa upana watoto wadogo pamoja na wategemezi wengine.
    reason: cultural_note
lexical_decisions:
- source_word: נֵחָלֵץ
  choice: tutajifunga silaha
  rationale: Kauli ya Nifali hapa ina maana ya kujitayarisha au kujipatia silaha kwa ajili ya vita. Tafsiri hii inaonyesha wazi kuwa wao wenyewe ndio wanaochukua hatua hiyo.
- source_word: חֻשִׁים
  choice: upesi
  rationale: Neno hili linaonyesha haraka na utayari. Kulitafsiri kama kielezi huepuka kurudia wazo la silaha ambalo tayari limo katika נֵחָלֵץ.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: mbele ya wana wa Israeli
  rationale: Hii inafuata maana ya moja kwa moja ya kirai cha Kiebrania na, katika muktadha wa kijeshi, inadokeza kwenda mbele ya jeshi la Israeli.
- source_word: עַד אֲשֶׁר אִם
  choice: mpaka
  rationale: Muungano huu hutaja kikomo cha tendo; “mpaka” ni Kiswahili cha kawaida na sahihi katika sentensi hii.
- source_word: הֲבִיאֹנֻם
  choice: tutakapowafikisha
  rationale: Hifili ya בוא ina maana ya kusababisha wafike. “Kuwafikisha” ni ya asili katika Kiswahili na inaonyesha kuwapeleka hadi mahali walipokusudiwa.
- source_word: אֶל מְקוֹמָם
  choice: mahali pao
  rationale: Tafsiri hii huhifadhi upana wa neno la asili bila kulifafanua moja kwa moja kuwa eneo la makao au urithi.
- source_word: וְיָשַׁב טַפֵּנוּ
  choice: nao watoto wetu watakaa
  rationale: טַף ni nomino ya mkusanyiko inayohusu hasa watoto wadogo na inaweza kujumuisha wategemezi wengine. “Watoto wetu” ni ya kawaida, huku tanbihi ikihifadhi upana wa maana.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: katika miji yenye ngome
  rationale: Kirai hiki kinamaanisha miji iliyoimarishwa kwa ulinzi; “miji yenye ngome” ni wazi na ya kawaida katika Kiswahili.
- source_word: מִפְּנֵי יֹשְׁבֵי הָאָרֶץ
  choice: kwa sababu ya wakaaji wa nchi
  rationale: מִפְּנֵי hapa huonyesha sababu au tishio linalotokana na wakaaji wa nchi. Tafsiri hii haiingizi kwa lazima maelezo ya ulinzi, ingawa muktadha unayadokeza.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi lugha ya kijeshi, maana pana ya “mahali pao,” na tishio linalodokezwa na wakaaji wa nchi bila kuongeza ufafanuzi wa kimadhehebu.
