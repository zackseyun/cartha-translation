  text: וְ/אֶת בֵּ֥ית נִמְרָ֖ה וְ/אֶת בֵּ֣ית הָרָ֑ן עָרֵ֥י מִבְצָ֖ר וְ/גִדְרֹ֥ת צֹֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/036.yaml
  text: and Beth-nimrah and Beth-haran[a], fortified cities[b], and sheepfolds.
translation:
  language: sw
  text: na Beth-nimra na Beth-harani, miji yenye ngome[a], na mazizi ya kondoo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miji ya ngome.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mazizi ya mifugo midogo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית נִמְרָה
  choice: Beth-nimra
  rationale: Ni jina la mahali; limetoholewa badala ya kutafsiriwa kihalisi kuwa “nyumba ya Nimra.”
- source_word: בֵּית הָרָן
  choice: Beth-harani
  rationale: Ni jina la mji. Umbo “Beth-harani” linafuata namna ya kawaida ya kutohowa jina hili katika Kiswahili huku likihifadhi utambulisho wake kama jina la mahali.
- source_word: עָרֵי מִבְצָר
  choice: miji yenye ngome
  rationale: Kirai hiki kinamaanisha miji iliyoimarishwa kwa ajili ya ulinzi; “miji yenye ngome” ni Kiswahili cha kawaida na chenye maana hiyo ya kijeshi.
- source_word: גִדְרֹת צֹאן
  choice: mazizi ya kondoo
  rationale: Kinamaanisha maeneo yaliyozungushiwa kwa ajili ya kondoo au mifugo midogo; “mazizi ya kondoo” ni tafsiri fupi, wazi, na inayofaa muktadha wa ufugaji.
- source_word: וְאֶת ... וְאֶת ... וְ
  choice: na ... na ... na
  rationale: Viunganishi vinavyojirudia vinaendeleza orodha ya mstari uliotangulia; “na” huhifadhi muundo huo bila kujaribu kutafsiri kiashiria cha yambwa אֵת.
