translation:
  language: sw
  text: Ndipo wana wa Gadi na wana wa Reubeni wakamwambia Musa, “Watumishi wako watafanya kama bwana wangu anavyoamuru.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי גָד וּבְנֵי רְאוּבֵן
  choice: wana wa Gadi na wana wa Reubeni
  rationale: Muundo huu unafuata majina ya makundi ya ukoo katika Kiebrania na ni wa kawaida katika Kiswahili cha Biblia.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Huhifadhi nafsi ya tatu ya wingi pamoja na kiambishi cha nafsi ya pili kinachomrejelea Musa, kwa lugha yenye heshima.
- source_word: כַּאֲשֶׁר אֲדֹנִי מְצַוֶּה
  choice: kama bwana wangu anavyoamuru
  rationale: Huhifadhi namna ya heshima ya umoja אֲדֹנִי inayomrejelea Musa, bila kuichanganya na jina la Mungu, na huwasilisha amri inayoendelea kutolewa.
theological_decisions:
- issue: Utambulisho wa אֲדֹנִי
  choice: bwana wangu
  alternative: Bwana wangu
  rationale: Katika muktadha msemaji anamwita Musa kwa cheo cha heshima; herufi ndogo huepuka kudokeza kwamba neno hilo ni jina la Mungu.
- issue: Uwakilishi wa לֵאמֹר baada ya kitenzi cha kusema
  choice: imeachwa bila neno tofauti katika matini
  alternative: wakisema
  rationale: Katika Kiswahili, kishazi cha nukuu baada ya “wakamwambia” tayari huwasilisha kazi ya לֵאמֹר; kuongeza “wakisema” kungekuwa marudio yasiyo ya kawaida bila kuongeza maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi “Ndipo ... wakamwambia” ni wa asili na huhifadhi mfuatano wa simulizi.
