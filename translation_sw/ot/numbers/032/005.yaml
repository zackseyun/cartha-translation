  text: וַ/יֹּאמְר֗וּ אִם מָצָ֤אנוּ חֵן֙ בְּ/עֵינֶ֔י/ךָ יֻתַּ֞ן אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לַ/עֲבָדֶ֖י/ךָ לַ/אֲחֻזָּ֑ה אַל תַּעֲבִרֵ֖/נוּ אֶת הַ/יַּרְדֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/005.yaml
  text: And they said[a], “If we have found favor in your sight, let this land be given to your servants as a possession. Do not make us cross the Jordan.”
translation:
  language: sw
  text: Wakasema, “Ikiwa tumepata kibali machoni pako, nchi hii na ipewe watumishi wako kuwa milki yao. Usituvushe Yordani.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usitupeleke ng’ambo ya Yordani.” Kitenzi cha Kiebrania kina hali ya kusababisha na kinaweza kutafsiriwa kwa maneno kadhaa yenye maana zinazokaribiana.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאנוּ חֵן בְּעֵינֶיךָ
  choice: tumepata kibali machoni pako
  rationale: Hifadhi nahau ya Kiebrania ya kukubaliwa au kuangaliwa kwa wema, huku ‘kibali’ ikiwa ya kawaida na yenye heshima katika ombi rasmi.
- source_word: יֻתַּן
  choice: na ipewe
  rationale: Muundo huu wa kutendwa unaonyesha ombi la heshima na kudumisha maana ya kuomba nchi itolewe, badala ya kuibadili kuwa amri ya moja kwa moja.
- source_word: הָאָרֶץ הַזֹּאת
  choice: nchi hii
  rationale: ‘Nchi’ ni tafsiri ya moja kwa moja na ya kawaida katika muktadha wa eneo litakalokaliwa.
- source_word: לַעֲבָדֶיךָ
  choice: watumishi wako
  rationale: Hapa neno hilo ni namna ya kujitaja kwa unyenyekevu mbele ya Musa, si msisitizo wa hali ya utumwa.
- source_word: לַאֲחֻזָּה
  choice: kuwa milki yao
  rationale: Inaonyesha eneo la kudumu linalomilikiwa; ‘milki’ huhifadhi wazo la umiliki bila kulifanya moja kwa moja kuwa ‘urithi.’ Kiwakilishi ‘yao’ kinaweka wazi mhusika anayemiliki, ambaye tayari ametajwa katika Kiebrania kama watumishi wako.
- source_word: אַל תַּעֲבִרֵנוּ אֶת הַיַּרְדֵּן
  choice: Usituvushe Yordani
  rationale: 'Kauli ‘tuvushe’ huwasilisha kwa ufupi na kwa kawaida hali ya kusababisha ya kitenzi cha Kiebrania: wasifanywe kuvuka mto Yordani.'
