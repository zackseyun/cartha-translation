  text: וַ/עֲבָדֶ֨י/ךָ יַֽעַבְר֜וּ כָּל חֲל֥וּץ צָבָ֛א לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָ֑ה כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י דֹּבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/027.yaml
  text: But your servants will cross over[a], every man armed for battle, before Yahweh for the war[c][b], just as my lord says.
translation:
  language: sw
  text: Lakini watumishi wako watavuka, kila mtu aliyejihami kwa ajili ya vita, mbele za Yahweh[a] kwa vita, kama bwana wangu asemavyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika uwepo wa Yahweh”; usemi huu pia unaonyesha kwamba wanashiriki katika vita chini ya mamlaka yake.
    reason: cultural_note
lexical_decisions:
- source_word: וַעֲבָדֶיךָ
  choice: Lakini watumishi wako
  rationale: עֶבֶד hapa ni lugha ya kujishusha kwa heshima mbele ya Musa; “watumishi” inafaa kuliko “watumwa.” Waw imetafsiriwa “Lakini” kwa kuwa kauli hii inajibu na kutofautisha wasiwasi uliotangulia.
- source_word: יַעַבְרוּ
  choice: watavuka
  rationale: Kitenzi עבר hapa kinaonyesha kuvuka mpaka kuelekea eneo la mapigano; “watavuka” ni Kiswahili cha kawaida na chenye maana hiyo.
- source_word: כָּל חֲלוּץ צָבָא
  choice: kila mtu aliyejihami kwa ajili ya vita
  rationale: כָּל pamoja na umbo la umoja ina maana ya kugawa kwa kila mmoja, naye חֲלוּץ צָבָא humaanisha mtu aliyeandaliwa au kujihami kwa huduma ya kijeshi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Huhifadhi maana ya kuwa mbele au katika uwepo wa Yahweh, na pia mamlaka yake juu ya kampeni hiyo.
- source_word: לַמִּלְחָמָה
  choice: kwa ajili ya vita
  rationale: Lamed inaonyesha kusudi au mwelekeo; usemi huu ni wa asili katika Kiswahili na haubadili maana kuwa kitendo cha kupigana tu.
- source_word: כַּאֲשֶׁר אֲדֹנִי דֹּבֵר
  choice: kama bwana wangu asemavyo
  rationale: אֲדֹנִי ni heshima inayomwelekea Musa, si jina la Mungu; participle דֹּבֵר hapa inafaa kutafsiriwa kwa wakati wa sasa katika usemi wa heshima.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana Tetragramatoni yenyewe; “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לִפְנֵי יְהוָה katika kampeni ya kijeshi
  choice: mbele za Yahweh
  alternative: chini ya mamlaka ya Yahweh
  rationale: Tafsiri ya moja kwa moja huhifadhi kwa pamoja uwepo na mamlaka ya Yahweh bila kuifanya maana moja pekee kuwa wazi kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Bwana wangu” limetumiwa kwa Musa kwa herufi ndogo ili kulitofautisha na jina la Mungu.
