base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/001.yaml
  text: The sons of Reuben and the sons of Gad had a very great amount of livestock[a], and they saw the land of Jazer and the land of Gilead, and behold[b], the place was a place for livestock.
translation:
  language: sw
  text: Wana wa Reubeni na wana wa Gadi[a] walikuwa na mifugo mingi sana. Wakaiona nchi ya Yaazeri na nchi ya Gileadi, na tazama, mahali hapo palikuwa mahali pa mifugo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wareubeni na Wagadi.” Kiebrania kinasema kihalisi, “wana wa Reubeni na wana wa Gadi.”
    reason: lexical_alternative
  - marker: b
    text: 'Au, “mahali hapo palifaa kwa mifugo.” Kiebrania kinarudia neno “mahali” kwa msisitizo: “mahali hapo palikuwa mahali pa mifugo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֶה רַב ... עָצוּם מְאֹד
  choice: mifugo mingi sana
  rationale: מִקְנֶה ni neno pana linalohusu wanyama wanaofugwa kama mali, hivyo “mifugo” linafaa kuliko “ng’ombe.” Muunganiko wa רַב na עָצוּם מְאֹד unasisitiza wingi mkubwa, unaowasilishwa kwa Kiswahili cha kawaida kama “mingi sana.”
- source_word: לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד
  choice: wana wa Reubeni na wana wa Gadi
  rationale: Tafsiri hii inahifadhi maana ya moja kwa moja ya בְּנֵי na urudiaji wake katika Kiebrania; hapa “wana” pia hufanya kazi kama jina la makabila.
- source_word: וַיִּרְאוּ
  choice: Wakaiona
  rationale: Muundo wa simulizi wenye waw-consecutive unaendeleza tukio. “Wakaiona” ni wa asili katika masimulizi ya Kiswahili na hauongezi maana ya wazi ya ‘walipoiona.’
- source_word: אֶרֶץ יַעְזֵר וְאֶרֶץ גִּלְעָד
  choice: nchi ya Yazeri na nchi ya Gileadi
  rationale: “Nchi” ni kisawe cha moja kwa moja na chenye unyumbufu kwa אֶרֶץ, na urudiaji wake unahifadhi muundo wa chanzo.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: “Tazama” huhifadhi kazi ya הִנֵּה ya kuvuta usikivu kwenye jambo lililogunduliwa, badala ya kuifuta kuwa kiunganishi kisicho na mkazo.
- source_word: הַמָּקוֹם מְקוֹם מִקְנֶה
  choice: mahali hapo palikuwa mahali pa mifugo
  rationale: Tafsiri hii huhifadhi urudiaji wa מָקוֹם kwa msisitizo na haiongezi ufafanuzi mahususi kama ‘malisho,’ ingawa maana yake ni kwamba mahali hapo palifaa kwa mifugo.
