base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/039.yaml
  text: The sons of Machir son of Manasseh went to Gilead and captured it[b][a], and dispossessed the Amorites who were in it.
translation:
  language: sw
  text: Wana wa Makiri, mwana wa Manase, walienda Gileadi wakauteka, naye akawafukuza[a] Waamori[b] waliokuwa humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina kitenzi cha umoja, “akawafukuza,” baada ya vitenzi vya wingi vilivyotangulia. Huenda ukoo wa Makiri unachukuliwa kama kundi moja, au umoja huo unaakisi badiliko la kimtindo au la maandishi. Tafsiri nyingine hulainisha usemi huu kwa kutumia “wakawafukuza.”
    reason: textual_variant
  - marker: b
    text: Kiebrania kinasema kwa umoja “Mwamori,” lakini jina hilo limetumiwa kwa maana ya jamii nzima ya Waamori waliokuwa humo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: walienda
  rationale: Kitenzi הלך hapa ni kitenzi cha kawaida cha masimulizi kinachomaanisha ‘kwenda’; maandishi hayalazimishi wazo la kupanda.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: Wana wa Makiri mwana wa Manase
  rationale: ‘Wana wa’ huhifadhi usemi wa Kiebrania wa uhusiano wa ukoo, ambao katika muktadha unaweza kuwahusu pia wazao au watu wa ukoo wa Makiri.
- source_word: גִּלְעָדָה
  choice: Gileadi
  rationale: Herufi ya mwelekeo katika Kiebrania inaonyesha mwendo kuelekea Gileadi; katika Kiswahili ‘walienda Gileadi’ hutoa maana hiyo kwa kawaida.
- source_word: וַיִּלְכְּדֻהָ
  choice: na kuiteka
  rationale: לכד hutumiwa kwa kuteka au kuchukua mahali kwa nguvu; ‘kuiteka’ ni ya kawaida na hudumisha muktadha wa kijeshi.
- source_word: וַיּוֹרֶשׁ
  choice: akawafukuza
  rationale: Muundo wa Hifili wa ירש humaanisha kuwanyang’anya watu makao au kuwafukuza. Umbo la umoja ‘akawafukuza’ limehifadhiwa kwa sababu maandishi ya Kimasora yana nafsi ya tatu umoja baada ya vitenzi vya wingi.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Ingawa jina hilo liko katika umoja wa kisarufi katika Kiebrania, limetumiwa kwa maana ya jamii nzima; wingi wa Kiswahili unaeleza wazi kwamba ni wakazi Waamori.
- source_word: אֲשֶׁר בָּהּ
  choice: waliokuwa humo
  rationale: Kishazi hiki kinawahusu Waamori waliokuwa ndani ya eneo la Gileadi; ‘humo’ ni usemi wa asili wa Kiswahili.
