  text: וְ/אִם לֹ֤א תַעֲשׂוּ/ן֙ כֵּ֔ן הִנֵּ֥ה חֲטָאתֶ֖ם לַ/יהוָ֑ה וּ/דְעוּ֙ חַטַּאתְ/כֶ֔ם אֲשֶׁ֥ר תִּמְצָ֖א אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/023.yaml
  text: But if you do not do so[a], behold, you have sinned against Yahweh, and know that your sin will find you out.
translation:
  language: sw
  text: Lakini msipofanya hivyo, tazama, mtakuwa mmemkosea Yahweh; na jueni kwamba dhambi yenu itawapata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatia yenu itawafikia.” Nahau ya Kiebrania inaonyesha kwamba dhambi au hatia yao itawapata bila kuepukika, pamoja na matokeo yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini msipo-
  rationale: Kiunganishi kinaanzisha sharti lenye utofautishaji na maagizo yaliyotangulia; “lakini” huonyesha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: לֹא תַעֲשׂוּן כֵּן
  choice: msipofanya hivyo
  rationale: Muundo huu wa sharti hurejelea kwa ufupi tendo waliloagizwa katika muktadha uliotangulia.
- source_word: הִנֵּה
  choice: mtakuwa
  rationale: Katika onyo hili, הִנֵּה hukazia matokeo ya uhakika. Badala ya “tazama,” ambayo si ya kawaida hapa kwa Kiswahili, uhakika huo umebebwa na muundo wa sentensi.
- source_word: חֲטָאתֶם לַיהוָה
  choice: mtakuwa mmemkosea Yahweh
  rationale: Kauli timilifu ya Kiebrania inaeleza kosa litakalokuwa limetendeka sharti likitimia. “Kumkosea” huwasilisha dhambi iliyofanywa dhidi ya mtu, huku jina la agano likihifadhiwa.
- source_word: וּדְעוּ
  choice: Jueni
  rationale: Amri ya wingi imetafsiriwa moja kwa moja na kwa uzito unaofaa onyo.
- source_word: חַטַּאתְכֶם
  choice: dhambi yenu
  rationale: “Dhambi” ndilo neno la moja kwa moja hapa, ingawa nomino hiyo pia inaweza kuhusisha hatia.
- source_word: אֲשֶׁר תִּמְצָא אֶתְכֶם
  choice: itawapata
  rationale: Tafsiri hii inahifadhi taswira ya dhambi kama inayowafikia wenye hatia na inaeleza kutokwepeka kwa kufichuliwa au matokeo bila kuongeza maelezo ndani ya mstari.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina la agano badala ya kulibadili kuwa cheo.
- issue: Maana ya dhambi “kuwapata” wahusika
  choice: dhambi yenu itawapata
  alternative: dhambi yenu itafichuliwa; hatia yenu itawafikia
  rationale: Kauli ya Kiebrania inaacha wazi kwa kiwango fulani kama msisitizo ni kufichuliwa kwa dhambi, hatia kuwafikia, au matokeo yake yasiyoepukika. Tafsiri kuu inadumisha taswira na tanbihi inaeleza upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na wenye uzito wa onyo; “Jueni” huhifadhi amri ya wingi, na tanbihi huhifadhi utata halisi wa nahau ya Kiebrania.
