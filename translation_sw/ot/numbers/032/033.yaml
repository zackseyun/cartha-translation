  to: Basi Musa akawapa wana wa Gadi, wana wa Reubeni, na nusu ya kabila la Manase, mwana wa Yosefu, ufalme wa Sihoni, mfalme wa Waamori, na ufalme wa Ogu, mfalme wa Bashani—nchi pamoja na miji yake katika mipaka yake, miji ya nchi ya pande zote.[a]
