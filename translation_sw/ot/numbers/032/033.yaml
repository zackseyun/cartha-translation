  text: וַ/יִּתֵּ֣ן לָ/הֶ֣ם מֹשֶׁ֡ה לִ/בְנֵי גָד֩ וְ/לִ/בְנֵ֨י רְאוּבֵ֜ן וְ/לַ/חֲצִ֣י שֵׁ֣בֶט מְנַשֶּׁ֣ה בֶן יוֹסֵ֗ף אֶת מַמְלֶ֨כֶת֙ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י וְ/אֶת מַמְלֶ֔כֶת ע֖וֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן הָ/אָ֗רֶץ לְ/עָרֶ֨י/הָ֙ בִּ/גְבֻלֹ֔ת עָרֵ֥י הָ/אָ֖רֶץ סָבִֽיב׀־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/033.yaml
  text: So Moses gave to the sons of Gad[a], to the sons of Reuben, and to the half-tribe of Manasseh son of Joseph, the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan—the land with its cities in their territories, the cities of the surrounding land.
translation:
  language: sw
  text: Basi Musa akawapa wana wa Gadi, wana wa Reubeni, na nusu ya kabila la Manase, mwana wa Yosefu, ufalme wa Sihoni, mfalme wa Waamori, na ufalme wa Ogu, mfalme wa Bashani—nchi pamoja na miji yake katika mipaka yake, miji ya nchi ya pande zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na nchi, miji yake pamoja na mipaka yake, miji ya nchi ya pande zote.” Kirai cha mwisho cha Kiebrania kimebanwa kisintaksia, na kinaweza kutafsiriwa kwa njia kadhaa zinazokaribiana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akawapa
  rationale: Kitenzi hiki kinaonyesha kwamba Mose aliwapa au aliwagawia makabila hayo eneo; “akawapa” ni wazi na huhifadhi mtiririko wa simulizi.
- source_word: לִבְנֵי גָד ... וְלִבְנֵי רְאוּבֵן
  choice: wazao wa Gadi ... wazao wa Reubeni
  rationale: “Wazao wa” huhifadhi namna ya kifamilia ya Kiebrania bila kudokeza kuwa walikuwa wana wa moja kwa moja.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: na nusu ya kabila la Manase
  rationale: Hii ni tafsiri ya kawaida na ya asili ya Kiswahili inayosema kwamba sehemu moja ya kabila la Manase ndiyo iliyohusika.
- source_word: מַמְלֶכֶת
  choice: ufalme
  rationale: Neno hili linaonyesha eneo lililotawaliwa na mfalme; “ufalme” ni sawa, wazi, na lenye hadhi.
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Sihoni mfalme wa Waamori
  rationale: Muundo huu unafuata kwa karibu mpangilio wa Kiebrania na kumtambulisha Sihoni kwa watu aliowatawala.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Ogu mfalme wa Bashani
  rationale: Huhifadhi moja kwa moja jina, cheo, na eneo la utawala.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha huu neno linamaanisha nchi au eneo lote lililotolewa; “nchi” ni la kawaida na pana.
- source_word: לְעָרֶיהָ
  choice: pamoja na miji yake
  rationale: Kirai cha Kiebrania kimebanwa; “pamoja na miji yake” huonyesha kwa kawaida kwamba nchi na miji yake vilitolewa.
- source_word: בִּגְבֻלֹת
  choice: katika maeneo yake
  rationale: Wingi wa Kiebrania unaweza kumaanisha mipaka au maeneo. “Katika maeneo yake” ni ya asili huku ikihifadhi dhana ya maeneo yaliyowekewa mipaka.
- source_word: עָרֵי הָאָרֶץ סָבִיב
  choice: miji ya nchi iliyozunguka
  rationale: Huhifadhi maana ya miji ya nchi ya pande zote bila kuondoa hali ya kubanwa kwa sintaksia ya mwisho.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya simulizi. Majina yametolewa kwa maumbo ya kawaida ya Kibiblia ya Kiswahili. Alama ya tanbihi imewekwa mwishoni mwa sentensi kwa sababu inahusu kirai chote cha mwisho, si jina la Gadi.
