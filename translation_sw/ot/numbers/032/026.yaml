id: NUM.32.26
reference: Numbers 32:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: טַפֵּ֣/נוּ נָשֵׁ֔י/נוּ מִקְנֵ֖/נוּ וְ/כָל בְּהֶמְתֵּ֑/נוּ יִֽהְיוּ שָׁ֖ם בְּ/עָרֵ֥י הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/026.yaml
  text: Our little children[a], our wives, our livestock[b], and all our animals will remain there in the cities of Gilead.
translation:
  language: sw
  text: Watoto wetu wadogo[a], wake zetu, mifugo yetu, na wanyama wetu wote watabaki[b] huko katika miji ya Gileadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wetu.” Neno la Kiebrania טַף mara nyingi huwalenga hasa watoto wadogo au watoto wanaowategemea watu wazima.
    reason: lexical_alternative
  - marker: b
    text: Au, “watakuwa.” Kitenzi cha Kiebrania humaanisha tu “watakuwa,” lakini katika muktadha huu kinadokeza kwamba watabaki huko huku wengine wakienda vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפֵּנוּ
  choice: watoto wetu wadogo
  rationale: טַף huwalenga hasa watoto wadogo au watoto wanaowategemea watu wazima; tafsiri hii inaonyesha umri wao bila kutumia neno pana zaidi la ‘watoto’ pekee.
- source_word: נָשֵׁינוּ
  choice: wake zetu
  rationale: Katika muktadha wa familia na koo, wingi huu wa אִשָּׁה wenye kiambishi cha nafsi ya kwanza wingi kwa kawaida humaanisha wake za wasemaji.
- source_word: מִקְנֵנוּ
  choice: mifugo yetu
  rationale: מִקְנֶה humaanisha kwa kawaida mifugo inayomilikiwa, yaani makundi ya wanyama wa kufugwa.
- source_word: וְכָל בְּהֶמְתֵּנוּ
  choice: na wanyama wetu wote
  rationale: בְּהֵמָה ni neno pana kwa wanyama, hasa wanyama wa kufugwa; ‘wanyama wetu wote’ huhifadhi upana na msisitizo wa כָל bila kulifanya sawa kabisa na ‘mifugo’.
- source_word: יִהְיוּ
  choice: watabaki
  rationale: Kimsingi kitenzi hiki humaanisha ‘watakuwa,’ lakini hapa kinamaanisha kukaa mahali hapo wakati wanaume wanapoenda vitani; ‘watabaki’ huwasilisha maana hiyo ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki cha mahali kinarejelea eneo lililotajwa; ‘huko’ ni cha moja kwa moja na cha kawaida.
- source_word: בְּעָרֵי הַגִּלְעָד
  choice: katika miji ya Gileadi
  rationale: עָרִים inaweza kumaanisha miji au makazi yenye ngome; ‘miji ya Gileadi’ ni tafsiri ya kawaida na yenye hadhi kwa jina la eneo hilo.
theological_decisions: []
