  source_fidelity: 'Tafsiri inafuata kwa uaminifu orodha ya Kiebrania: טַפֵּינוּ ni “watoto wetu wadogo,” נָשֵׁינוּ ni “wake zetu,” מִקְנֵנוּ ni “mifugo yetu,” na וְכָל־בְּהֶמְתֵּנוּ ni “na wanyama wetu wote.” “Watabaki huko” hutoa kwa usahihi nguvu ya kimuktadha ya יִהְיוּ שָׁם bila kudai kwamba kitenzi chenyewe kimsingi humaanisha ‘kubaki.’'
