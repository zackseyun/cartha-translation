  yaml_path: translation/ot/numbers/032/024.yaml
  text: Build for yourselves cities for your little ones[a], and enclosures for your flocks[b], and do what has gone out from your mouth.
translation:
  language: sw
  text: Jijengeeni miji kwa ajili ya watoto wenu wadogo, na mazizi kwa ajili ya makundi yenu, na fanyeni yale yaliyotoka kinywani mwenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, tekelezeni yale mliyoahidi. Kiebrania kinasema kihalisi, “fanyeni yale yaliyotoka kinywani mwenu,” nahau inayomaanisha kutimiza neno lililotamkwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוּ
  choice: Jijengeeni
  rationale: Kauli ya amri ya wingi ya בנה inaamuru kujenga. Muundo huu wa Kiswahili unaonyesha pia nguvu ya לָכֶם, yaani kujenga kwa manufaa yao wenyewe.
- source_word: עָרִים
  choice: miji
  rationale: עִיר inaweza kumaanisha mji mkubwa au mdogo; “miji” ni neno la kawaida na linafaa katika muktadha wa makazi.
- source_word: לְטַפְּכֶם
  choice: kwa ajili ya watoto wenu wadogo
  rationale: טַף hurejelea hasa watoto wadogo, walio sehemu dhaifu ya kaya; tafsiri hii inahifadhi maana yake halisi na ya kifamilia.
- source_word: וּגְדֵרֹת
  choice: na mazizi
  rationale: גְּדֵרוֹת hapa ni maeneo yaliyozungushiwa kwa ajili ya mifugo. “Mazizi” ni neno la asili na linaloeleweka kwa urahisi katika Kiswahili cha Afrika Mashariki.
- source_word: לְצֹנַאֲכֶם
  choice: kwa ajili ya makundi yenu
  rationale: צֹאן ni mifugo midogo, hasa kondoo na mbuzi, inayotajwa kwa ujumla kama makundi. “Makundi yenu” huhifadhi wazo hilo bila kuibana kwa kondoo peke yao.
- source_word: וְהַיֹּצֵא מִפִּיכֶם
  choice: kisha ... yale yaliyotoka kinywani mwenu
  rationale: Maneno hayo ni nahau inayorejelea yale waliyoyasema au kuahidi. Tafsiri inahifadhi taswira ya Kiebrania badala ya kuifafanua kimya kimya.
- source_word: תַּעֲשׂוּ
  choice: fanyeni
  rationale: עָשָׂה ni kitenzi cha kawaida chenye maana ya kufanya; pamoja na nahau inayofuata, kinamaanisha kutekeleza neno lililotamkwa.
