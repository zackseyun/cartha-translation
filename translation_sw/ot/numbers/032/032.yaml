  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: נַ֣חְנוּ נַעֲבֹ֧ר חֲלוּצִ֛ים לִ/פְנֵ֥י יְהוָ֖ה אֶ֣רֶץ כְּנָ֑עַן וְ/אִתָּ֨/נוּ֙ אֲחֻזַּ֣ת נַחֲלָתֵ֔/נוּ מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/032.yaml
  text: We ourselves will cross over, armed, before Yahweh into the land of Canaan, and with us will be the possession of our inheritance on this side of the Jordan.
translation:
  language: sw
  text: Sisi wenyewe tutavuka tukiwa na silaha mbele za Yahwe, kuingia katika nchi ya Kanaani; na pamoja nasi kutakuwa na milki ya urithi wetu upande huu wa Yordani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ng’ambo ya Yordani” au “upande mwingine wa Yordani.” Usemi wa Kiebrania hutegemea mahali pa msemaji; hapa “upande huu wa Yordani” unaonyesha kwamba wasemaji wako mashariki mwa mto huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחְנוּ
  choice: Sisi wenyewe
  rationale: Kiwakilishi huru kinasisitiza mhusika zaidi ya kiambishi cha nafsi katika kitenzi; “Sisi wenyewe” kinahifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: נַעֲבֹר
  choice: tutavuka
  rationale: Qal imperfect nafsi ya kwanza wingi ya עבר hapa ni ahadi ya wakati ujao ya kuvuka Yordani.
- source_word: חֲלוּצִים
  choice: tukiwa na silaha
  rationale: Katika muktadha huu wa kijeshi neno hilo linaeleza watu walio tayari kwa mapigano; uchaguzi huu ni wazi na wa kawaida bila kulifanya kuwa tu suala la mpangilio wa jeshi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי ina maana ya kuwa mbele au katika uwepo wa mtu; usemi huu unahifadhi pia uzito wa kiagano wa hatua inayofanywa mbele za Mungu.
- source_word: אֶרֶץ כְּנָעַן
  choice: kuingia katika nchi ya Kanaani
  rationale: Ingawa Kiebrania hakina kihusishi wazi kabla ya “nchi ya Kanaani,” mwendo wa kuvuka unaelekezwa ndani ya nchi hiyo; “kuingia katika” hutoa Kiswahili cha asili na wazi.
- source_word: וְאִתָּנוּ
  choice: na pamoja nasi kutakuwa na
  rationale: Kirai hiki hakina kitenzi katika Kiebrania. “Kutakuwa” kinaongezwa ili kupata sentensi kamili ya Kiswahili na kupatana na ahadi ya wakati ujao.
- source_word: אֲחֻזַּת נַחֲלָתֵנוּ
  choice: milki ya urithi wetu
  rationale: Muundo huu unaunganisha wazo la eneo linalomilikiwa na lile la mgao wa kurithi; tafsiri hii inahifadhi vipengele vyote viwili.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: upande huu wa Yordani
  rationale: Usemi huu hutegemea mahali pa msemaji. Katika muktadha, wasemaji wako mashariki mwa Yordani na wanadai eneo hilo kuwa urithi wao; “upande huu” huonyesha mtazamo wao huku tanbihi ikihifadhi uwezekano wa tafsiri nyingine.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa Kiebrania umefuatwa kwa karibu, lakini virai vimepangwa ili sentensi isomeke kwa ufasaha.
