source:
  edition: WLC
  text: וְ/כִֽי תַעֲשֶׂ֥ה בֶן בָּקָ֖ר עֹלָ֣ה אוֹ זָ֑בַח לְ/פַלֵּא נֶ֥דֶר אֽוֹ שְׁלָמִ֖ים לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/008.yaml
  text: And when you prepare a bull as a burnt offering or a sacrifice[a], to fulfill a vow or as peace offerings to Yahweh[b],
translation:
  language: sw
  text: Na utakapoandaa fahali kuwa sadaka ya kuteketezwa au dhabihu, ili kutimiza nadhiri au kama sadaka za amani kwa Yahweh,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כִֽי
  choice: Na utakapo-
  rationale: Katika muktadha huu wa masharti ya dhabihu, וְכִי huanzisha hali ya wakati au sharti. Muundo wa Kiswahili “utakapo-” ni wa kawaida na unaendeleza maagizo kwa ufasaha.
- source_word: תַעֲשֶׂה
  choice: andaa
  rationale: Kitenzi עשה kina maana pana ya kufanya au kuandaa. Katika maagizo ya dhabihu, “andaa” ni cha asili bila kukifanya kiwe mahususi zaidi kama “toa.”
- source_word: בֶן בָּקָר
  choice: fahali
  rationale: Kirai hiki kwa kawaida humaanisha mnyama wa jamii ya ng’ombe; katika muktadha huu “fahali” ni tafsiri wazi na ya kawaida, bila kulazimisha umri ambao haujawekwa bayana.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno la kawaida na sahihi kwa dhabihu iliyoteketezwa yote.
- source_word: אוֹ זָבַח
  choice: au dhabihu
  rationale: זבח ni neno pana la dhabihu; “dhabihu” huhifadhi upana huo na kutofautiana kwake na sadaka mahususi ya kuteketezwa.
- source_word: לְ/פַלֵּא נֶדֶר
  choice: ili kutimiza nadhiri
  rationale: Hiki ni kirai cha kutekeleza jambo lililoahidiwa kwa nadhiri. “Kutimiza nadhiri” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: אוֹ שְׁלָמִים
  choice: au kuwa sadaka ya amani
  rationale: “Sadaka ya amani” huhifadhi jina la kitamaduni la aina hii ya dhabihu bila kuamua kwamba wazo lake kuu ni ushirika pekee au hali njema pekee.
- source_word: לַ/יהוָה
  choice: kwa Yahweh
  rationale: Kihusishi ל katika muktadha wa sadaka kinaweza kutafsiriwa kwa kawaida kuwa “kwa,” nayo יהוה imetolewa kama jina la agano “Yahweh.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina la agano badala ya kulibadili kuwa cheo.
- issue: Uwasilishaji wa שְׁלָמִים
  choice: sadaka ya amani
  alternative: sadaka ya ushirika au sadaka ya hali njema
  rationale: “Sadaka ya amani” huhifadhi istilahi inayotambulika ya mfumo wa dhabihu huku kutozuia vivuli vingine vya maana vinavyohusiana na ushirika na hali njema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umeachwa wazi kuendelea katika mstari unaofuata, kama ilivyo katika chanzo.
