base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/036.yaml
  text: So the whole congregation brought him outside the camp and stoned him with stones, and he died, just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Basi kusanyiko lote wakamtoa nje ya kambi, wakampiga kwa mawe, naye akafa, kama vile Yahweh alivyomwamuru Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה humaanisha jumuiya ya Israeli iliyokusanyika; “kusanyiko lote” ni Kiswahili cha kawaida na hudumisha wazo la kundi zima.
- source_word: וַיֹּצִיאוּ אֹתוֹ
  choice: likampeleka
  rationale: Hifili ya יצא hapa ni ‘kumtoa/kumpeleka nje’; “likampeleka” huungana kwa kawaida na kirai kinachofuata, ‘nje ya kambi’.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Kirai hiki kinaonyesha mwendo kuelekea mahali palipo nje ya kambi; Kiswahili hakihitaji kihusishi kingine kabla ya ‘nje’.
- source_word: וַיִּרְגְּמוּ אֹתוֹ בָּאֲבָנִים
  choice: likampiga kwa mawe
  rationale: רגם pamoja na בָּאֲבָנִים inaeleza kumuua kwa kumpiga mawe. “Likampiga kwa mawe” ni usemi wazi na wa kawaida unaohifadhi chombo kilichotajwa wazi katika Kiebrania.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: מות ni kitenzi cha kawaida ‘kufa’; tafsiri hii haiongezi maana ya kufishwa ambayo haijaelezwa moja kwa moja na kitenzi.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: kama vile Yahwe alivyomwamuru Musa
  rationale: כַּאֲשֶׁר huonyesha ulinganifu, ‘kama vile’; wakati wa kitenzi cha Kiswahili huonyesha kwamba amri hiyo ilitangulia utekelezaji.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, na ni umbo linalofaa katika tahajia ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi umehifadhiwa kwa viunganishi vya mfululizo; hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika.
