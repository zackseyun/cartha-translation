base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/010.yaml
  text: And you shall present wine for the drink offering[a], half a hin, an offering made by fire, a pleasing aroma to Yahweh.
translation:
  language: sw
  text: Pia utatoa divai kwa ajili ya sadaka ya kinywaji, nusu hini, sadaka ya moto[a], harufu ya kupendeza kwa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka inayotolewa kwa moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: Nawe ... divai
  rationale: יַיִן ni ‘divai’; kiunganishi וְ kinawakilishwa kwa ‘Nawe,’ ambacho kinaendeleza maagizo yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: תַּקְרִיב
  choice: utatoa
  rationale: Hifili ya קרב hapa ni kuleta au kuwasilisha kitu kama sadaka. ‘Utatoa’ ni ya asili katika Kiswahili na inadumisha maana ya tendo la kutoa sadaka.
- source_word: לַ/נֶּסֶךְ
  choice: kwa ajili ya sadaka ya kinywaji
  rationale: נֶסֶךְ ni sadaka ya kimiminiko inayomiminwa. ‘Sadaka ya kinywaji’ ni istilahi inayoeleweka na inaonyesha kazi yake ya kiibada.
- source_word: חֲצִי הַ/הִין
  choice: nusu hini
  rationale: Kipimo cha kale ‘hini’ kinahifadhiwa badala ya kukadiriwa kwa kipimo cha kisasa.
- source_word: אִשֵּׁה
  choice: sadaka inayoteketezwa kwa moto
  rationale: Neno la kikuhani אִשֵּׁה lina uhusiano wa wazi na sadaka inayotolewa kwa moto. Tafsiri hii huhifadhi picha hiyo bila kulifanya neno kuwa ‘chakula’ pekee.
- source_word: רֵיחַ נִיחֹחַ
  choice: yenye harufu ya kumpendeza
  rationale: Kirai hiki cha sadaka huonyesha kuwa sadaka inakubalika kwa Mungu. ‘Harufu ya kumpendeza’ ni ya kawaida na yenye heshima katika Kiswahili.
- source_word: לַ/יהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה linawakilishwa moja kwa moja kama ‘Yahweh’; uelekeo wa לַ unaonyeshwa tayari na kitenzi ‘kumpendeza.’
theological_decisions:
- issue: Uwakilishi wa יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: ‘Yahweh’ huhifadhi jina binafsi la Mungu kulingana na ushahidi wa maandishi na mwelekeo wa mradi, bila kulibadilisha kuwa cheo.
- issue: Maana ya אִשֵּׁה
  choice: sadaka inayoteketezwa kwa moto
  alternative: sadaka ya chakula; sadaka ya moto
  rationale: Neno linaweza kueleweka kama sadaka ya kikuhani inayotolewa kwa moto, na wakati mwingine hufafanuliwa kwa kazi yake kama chakula cha sadaka. Tafsiri kuu huhifadhi uhusiano wake na moto, huku tanbihi ikitaja njia fupi mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kwa wasomaji wa kawaida, huku istilahi za dhabihu na kipimo cha kale zikihifadhiwa.
