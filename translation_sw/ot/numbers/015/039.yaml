base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/039.yaml
  text: And it shall be a tassel for you[a], and when you see it, you shall remember all the commandments of Yahweh and do them, and you shall not go about after your own heart and after your own eyes[c][b], after which you are whoring.
translation:
  language: sw
  text: Kitakuwa kishada kwenu[a]. Mtakapokiona, mtazikumbuka amri zote za Yahwe na kuzitenda. Msiende huku na huko mkifuata mioyo yenu na macho yenu[b], ambayo mnajifanya makahaba kwa kuvifuata[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pindo la nyuzi.” Neno la Kiebrania linamaanisha kishada kama cha nyuzi kilichofungwa kwenye pembe ya vazi.
    reason: lexical_alternative
  - marker: b
    text: Au “msifuate mioyo yenu na macho yenu.” Kitenzi cha Kiebrania kinaweza kutoa wazo la kwenda huku na huko ukiviandama au ukivitafuta.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinatumia picha ya ukahaba kueleza kutokuwa waaminifu kwa agano; sitiari hiyo inaweza kulegezwa kuwa “ambavyo mnapotoka kwa kuvifuata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיצִת
  choice: kishada
  rationale: Neno hili linamaanisha kishada kama cha nyuzi kilichofungwa kwenye pembe ya vazi. “Kishada” ni neno la kawaida na mahususi zaidi katika Kiswahili cha sasa.
- source_word: וּרְאִיתֶם אֹתוֹ
  choice: Mtakapokiona
  rationale: Muundo huu unaonyesha kwamba kukiona kishada kunatangulia na kuchochea kukumbuka; kiambishi cha ngeli kinaelekezwa kwa “kishada.”
- source_word: מִצְוֺת
  choice: amri
  rationale: “Amri” huhifadhi uzito wa maagizo ya agano na ni Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina la agano lililo katika maandishi ya Kiebrania, kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: na kuzitenda
  rationale: “Kuzitenda” huonyesha kutekeleza amri bila kuongeza ufafanuzi usio katika matini.
- source_word: תָתֻרוּ
  choice: Msiende huku na huku mkifuata
  rationale: Huhifadhi picha ya kitenzi תור ya kwenda huku na huku, kutafuta au kuandama, badala ya kukipunguza kuwa “msifuate” pekee.
- source_word: לְבַבְכֶם
  choice: mioyo yenu
  rationale: “Mioyo” ni sawia ya kawaida ya kibiblia na hapa inajumuisha tamaa, nia na mawazo ya ndani bila kuifasiri kwa neno moja tu.
- source_word: עֵינֵיכֶם
  choice: macho yenu
  rationale: Tafsiri halisi inaeleweka katika Kiswahili na huhifadhi uhusiano kati ya kuona na kutamani.
- source_word: זֹנִים
  choice: mnafanya ukahaba
  rationale: Huhifadhi sitiari kali ya kutokuwa waaminifu kingono ambayo Kiebrania huitumia kueleza kutokuwa waaminifu kwa agano.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia jina la agano moja kwa moja; kulihifadhi kama jina hakulibadilishi kuwa cheo.
- issue: Nguvu ya sitiari זנה
  choice: mnafanya ukahaba
  alternative: mnapotoka / si waaminifu
  rationale: Tafsiri iliyochaguliwa huhifadhi picha ya ukosefu wa uaminifu wa kingono na mvutano wake wa kiagano, badala ya kuilegeza kimya kimya.
- issue: Maana ya תור katika onyo hili
  choice: msiende huku na huku mkifuata
  alternative: msifuate / msipotee kwa kufuata
  rationale: Huhifadhi wazo la kuandama au kutafuta linalopatikana katika kitenzi, bila kuamua kwamba kitenzi chenyewe kinamaanisha tu “kupotoka.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi zimegawanywa kwa urahisi wa kusoma; sitiari kali ya Kiebrania imehifadhiwa na kufafanuliwa katika tanbihi.
