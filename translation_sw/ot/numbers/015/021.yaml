lexical_decisions:
- source_word: מֵרֵאשִׁית
  choice: Kutoka sehemu ya kwanza ya
  rationale: Neno רֵאשִׁית hapa lina maana ya sehemu ya kwanza inayotolewa kutoka katika unga, si mwanzo wa wakati kwa ujumla.
- source_word: עֲרִסֹתֵיכֶם
  choice: unga wenu
  rationale: עֲרִסָה linaweza kumaanisha unga au, kwa uhusiano, chombo cha kukandia; katika agizo hili kitu kinachotengwa ni sehemu ya unga.
- source_word: תִּתְּנוּ
  choice: mtampa
  rationale: נתן ni kitenzi cha kawaida chenye maana ya kutoa au kumpa; tafsiri hii inadumisha usemi wa moja kwa moja wa Kiebrania.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetafsiriwa kwa kulinakili kama Yahweh, badala ya kulibadilisha kuwa cheo.
- source_word: תְּרוּמָה
  choice: sehemu iliyotengwa
  rationale: תְּרוּמָה ni mchango au sehemu inayotolewa na kutengwa kwa Yahweh; usemi huu ni wazi katika Kiswahili na huepuka istilahi finyu ya kiibada.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Kirai hiki kinaonyesha kwamba wajibu huo unaendelea katika vizazi vinavyofuatana.
