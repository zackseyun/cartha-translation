  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה; “Yahweh” hulihifadhi kama jina badala ya cheo.
- issue: Maana ya תְּרוּמָה katika muktadha wa ibada
  choice: sehemu iliyotengwa
  alternative: sadaka au sadaka ya kuinuliwa
  rationale: Neno linaashiria sehemu inayotolewa na kuwekwa wakfu, lakini halipaswi kufinywa bila lazima kuwa aina moja ya sadaka.
