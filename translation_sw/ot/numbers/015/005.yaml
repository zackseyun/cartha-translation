  yaml_path: translation/ot/numbers/015/005.yaml
  text: And you shall prepare a quarter of a hin of wine for the drink offering, with the burnt offering or for the sacrifice, for each lamb.
translation:
  language: sw
  text: Tena utaandaa robo ya hini ya divai kwa ajili ya sadaka ya kinywaji, pamoja na sadaka ya kuteketezwa[a] au dhabihu, kwa kila mwanakondoo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata maneno ya Kiebrania kwa karibu zaidi, “juu ya sadaka ya kuteketezwa.” Kihusishi cha Kiebrania hapa yaelekea kuonyesha kwamba sadaka ya kinywaji inaambatana na sadaka hiyo katika ibada.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno, “kwa mwanakondoo mmoja”; hapa maana yake ni kiasi hicho kwa kila mwanakondoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: Tena ... divai
  rationale: וְ inaunganisha agizo hili na lililotangulia, na יַיִן ni divai. “Tena” ni kiunganishi cha kawaida katika mfululizo huu wa maagizo.
- source_word: לַ/נֶּסֶךְ
  choice: kwa ajili ya sadaka ya kinywaji
  rationale: Katika muktadha wa dhabihu, נֶסֶךְ ni toleo la divai linalomiminwa; “sadaka ya kinywaji” ni istilahi inayoeleweka na inayotofautisha toleo hili na dhabihu nyingine.
- source_word: רְבִיעִית הַ/הִין
  choice: robo ya hini
  rationale: Kauli hii inataja kipimo cha moja kwa nne ya hini. Kipimo cha kale “hini” kimehifadhiwa badala ya kukadiriwa kwa kipimo cha kisasa.
- source_word: תַּעֲשֶׂה
  choice: utaandaa
  rationale: Ingawa kitenzi עשה kwa msingi ni “fanya/tengeneza,” katika agizo hili la ibada “utaandaa” kinaeleza tendo kwa Kiswahili cha kawaida bila kuongeza wazo la kutoa lisilomo wazi katika kitenzi.
- source_word: עַל הָ/עֹלָה
  choice: pamoja na sadaka ya kuteketezwa
  rationale: עַל kwa kawaida inaweza kuwa “juu ya,” lakini hapa inaelekea kuonyesha uhusiano wa sadaka ya kinywaji na sadaka ya kuteketezwa katika ibada.
- source_word: אוֹ לַ/זָּבַח
  choice: au dhabihu
  rationale: זֶבַח ni dhabihu ya kuchinjwa kwa maana pana, tofauti na עֹלָה. “Dhabihu” huhifadhi tofauti hiyo bila kubainisha aina isiyotajwa.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: kwa kila mwanakondoo
  rationale: 'Kwa neno ni “kwa mwanakondoo mmoja,” lakini katika maagizo haya lina nguvu ya ugawaji: kiasi hicho kinahitajika kwa kila mwanakondoo.'
