base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/019.yaml
  text: And when you eat from the bread of the land[a], you shall present a contribution to Yahweh.
translation:
  language: sw
  text: Nanyi mtakapokula mkate wa nchi hiyo, mtamtolea Yahweh sadaka ya kutengwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “mtainua sadaka ya kutengwa kwa ajili ya Yahweh.” Hii ni lugha ya kiibada ya kuwasilisha sadaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּאֲכָלְכֶם
  choice: Nanyi mtakapokula
  rationale: 'Muundo wenye היה na kitenzi-jina kilichotanguliwa na ב unaeleza hali ya wakati ujao: ‘mtakapokula.’ ‘Nanyi’ huunganisha agizo hili na muktadha uliotangulia kwa Kiswahili cha kawaida.'
- source_word: מִלֶּחֶם הָאָרֶץ
  choice: mkate wa nchi hiyo
  rationale: מן hapa ina maana ya sehemu au chanzo, lakini Kiswahili cha kawaida huweza kueleza wazo hilo kwa ‘mkate wa nchi hiyo’; nchi inayokusudiwa ni ile watakayoingia. ‘Mkate’ pia inaweza kuwakilisha chakula kinachotokana na mazao ya nchi.
- source_word: תָּרִימוּ תְרוּמָה
  choice: mtamtolea … sehemu ya sadaka
  rationale: Hiphil ya רום pamoja na תְרוּמָה ni lugha ya ibada inayomaanisha kutenga na kuwasilisha sehemu kwa Mungu. ‘Mtamtolea … sehemu ya sadaka’ ni ya asili kwa Kiswahili na huhifadhi wazo la mchango uliotengwa, huku tanbihi ikionyesha taswira halisi ya ‘kuinua.’
- source_word: לַיהוָה
  choice: Yahweh
  rationale: ל huonyesha anayepokea au anayewekewa sadaka; kiambishi cha mtendewa katika ‘mtamtolea’ huwasilisha maana hiyo. Jina la agano יהוה limetafsiriwa ‘Yahweh.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano יהוה moja kwa moja. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya kiibada ya תָּרִימוּ תְרוּמָה
  choice: mtamtolea Yahweh sehemu ya sadaka
  alternative: mtainua sadaka kwa Yahweh
  rationale: Tafsiri kuu inatoa maana ya kitendo cha kiibada kwa Kiswahili cha asili bila kuifanya ‘kuinua’ kuwa maelezo ya namna ya ibada yasiyothibitishwa; taswira halisi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Nchi hiyo’ hufanya rejeo la nchi ya ahadi liwe wazi katika muktadha. ‘Sehemu ya sadaka’ ni rahisi kueleweka kuliko istilahi ya kale au ya kitaalamu, na tanbihi huhifadhi usemi halisi wa Kiebrania.
