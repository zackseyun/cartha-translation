review_pass:
  verdict: revise
  source_fidelity: The temporal clause and dedication to Yahweh are conveyed well. However, “sehemu ya sadaka” means a portion of an already defined sacrifice, whereas תְּרוּמָה is itself the contribution/offering set apart and presented. “Sadaka ya kutengwa” more directly conveys its cultic function without importing a different part–whole relation.
  naturalness: “Nanyi mtakapokula” and “mtamtolea Yahweh” are natural Standard East African Swahili. “Sadaka ya kutengwa” is clear, dignified, and suitable for the legal-cultic register.
  terminology: Yahweh appropriately renders יהוה. “Sadaka ya kutengwa” preserves the technical offering sense of תְּרוּמָה more accurately than “sehemu ya sadaka.” The note retains the literal imagery of lifting up.
  issues:
  - severity: medium
    issue: “sehemu ya sadaka” inaccurately construes תְּרוּמָה.
    rationale: The Hebrew names the consecrated contribution as the object to be lifted/presented; it does not say merely to offer a portion of a sacrifice. The current wording can suggest a portion taken from another sacrifice.
  revised_text: Nanyi mtakapokula mkate wa nchi hiyo, mtamtolea Yahweh sadaka ya kutengwa.[a]
