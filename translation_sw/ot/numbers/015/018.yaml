  text: '“Sema na wana wa Israeli, uwaambie: ‘Mtakapoingia katika nchi ninayowaleta.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sema na
  rationale: Kauli ya amri ya Piel hapa inaanzisha maagizo ya Mungu ambayo Musa anapaswa kuwafikishia watu; ‘sema na’ ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi taswira ya kifamilia ya Kiebrania, ‘wana wa Israeli,’ badala ya kuibadili kuwa jina la kitaifa pekee.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: uwaambie
  rationale: Huwasilisha kwa njia ya asili muundo unaofuatana wa amri, ‘na uwaambie,’ bila kurudia kiunganishi kisichohitajika katika Kiswahili.
- source_word: בְּבֹאֲכֶם
  choice: Mtakapoingia
  rationale: Muundo huu una maana ya wakati, ‘mtakapo-’; ‘kuingia’ huonyesha wazi kuwasili ndani ya nchi.
- source_word: אֶל הָאָרֶץ
  choice: katika nchi
  rationale: Pamoja na kitenzi cha kuingia, ‘katika nchi’ ni Kiswahili cha kawaida kinachoonyesha kuingia ndani yake.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: ninayowapeleka
  rationale: Kitenzi kishirikishi cha Kiebrania huonyesha tendo la Mungu linaloelekea wakati ujao. ‘Ninayowapeleka’ huunganisha kwa kawaida kishazi husishi na kufikisha maana ya kuwaleta huko, ingawa mtazamo wa Kiswahili unaelezwa kwa ‘kupeleka.’
