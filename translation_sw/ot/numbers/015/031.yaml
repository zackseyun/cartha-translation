base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/031.yaml
  text: Because he has despised the word of Yahweh and has broken his commandment, that person shall surely be cut off; his guilt is on him.
translation:
  language: sw
  text: Kwa sababu amelidharau neno la Yahweh na kuivunja amri yake, mtu huyo hakika atakatiliwa mbali; hatia yake iko juu yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uovu wake uko juu yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa sababu
  rationale: Kishazi hiki kinatoa sababu ya hukumu iliyotajwa; tafsiri hii inaweka wazi uhusiano wa kisababishi.
- source_word: דְבַר יְהוָה
  choice: neno la Yahwe
  rationale: דָּבָר hapa ni neno au agizo lililotolewa na Mungu katika muktadha wa agano; jina la agano יְהוָה limetafsiriwa Yahwe.
- source_word: בָּזָה
  choice: amelidharau
  rationale: Kitenzi kinaonyesha kuliona kwa dharau, si kulipuuza tu.
- source_word: מִצְוָתוֹ
  choice: amri yake
  rationale: Umoja wa Kiebrania umehifadhiwa, huku 'amri' ikiwa ya kawaida na yenye uzito wa kisheria katika Kiswahili.
- source_word: הֵפַר
  choice: kuivunja
  rationale: Katika muktadha wa amri ya Mungu, 'kuvunja amri' ni usemi wa asili unaowasilisha maana ya kukiuka.
- source_word: הִכָּרֵת תִּכָּרֵת
  choice: lazima akatiliwe mbali kabisa
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi chenyewe unasisitiza uhakika wa hukumu; 'akatiliwe mbali' huhifadhi tamathali ya Kiebrania bila kutaja namna mahsusi ya adhabu.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: mtu huyo
  rationale: נֶפֶשׁ katika sheria humaanisha mtu binafsi, si sehemu isiyo ya mwili iitwayo roho.
- source_word: עֲוֺנָהּ בָּהּ
  choice: hatia yake iko juu yake
  rationale: Usemi huu unahifadhi picha ya uwajibikaji wa mtu kwa uovu wake; kishazi kisicho na kitenzi kimewasilishwa kama hali inayomkalia mkosaji.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la agano יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya hukumu ya הִכָּרֵת תִּכָּרֵת
  choice: akatiliwe mbali kabisa
  alternative: auawe; afukuzwe katika jumuiya
  rationale: Mstari hautaji wazi ikiwa hukumu ni kifo, kuondolewa katika jumuiya, au tendo la Mungu; hivyo tafsiri inahifadhi kutobainika huko.
- issue: Nguvu ya עֲוֺן katika kishazi cha mwisho
  choice: hatia yake iko juu yake
  alternative: uovu wake uko juu yake
  rationale: Neno linaweza kumaanisha uovu au hatia na athari zake. 'Hatia' inafaa muktadha wa hukumu huku tanbihi ikihifadhi maana mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa lakini yenye heshima. Usemi wa kisheria wa Kiebrania umehifadhiwa kadiri unavyoweza kueleweka, na aina mahsusi ya hukumu haijaamuliwa na mtafsiri.
