  text: וְ/הָיָ֗ה אִ֣ם מֵ/עֵינֵ֣י הָ/עֵדָה֮ נֶעֶשְׂתָ֣ה לִ/שְׁגָגָה֒ וְ/עָשׂ֣וּ כָל הָ/עֵדָ֡ה פַּ֣ר בֶּן בָּקָר֩ אֶחָ֨ד לְ/עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה וּ/מִנְחָת֥/וֹ וְ/נִסְכּ֖/וֹ כַּ/מִּשְׁפָּ֑ט וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/024.yaml
  text: then[a], if it was done unintentionally and escaped the notice of the congregation, all the congregation shall offer one bull from the herd for a burnt offering, for a pleasing aroma to Yahweh, with its grain offering and its drink offering, according to the ordinance, and one male goat for a sin offering.
translation:
  language: sw
  text: Ikiwa jambo hilo lilifanywa bila kukusudia na kusanyiko halikulitambua, kusanyiko lote litatoa fahali mmoja wa kundi la ng’ombe kuwa sadaka ya kuteketezwa, kwa harufu ya kupendeza kwa Yahweh, pamoja na sadaka yake ya nafaka na sadaka yake ya kinywaji, kama ilivyoagizwa, na mbuzi dume mmoja kuwa sadaka ya dhambi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha sadaka inayohusiana na dhambi na matokeo yake ya utakaso wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵינֵי הָעֵדָה
  choice: kusanyiko halikulitambua
  rationale: Nahau ya Kiebrania, kihalisi ‘kutoka machoni pa kusanyiko,’ ina maana kwamba jambo halikuonekana au halikutambuliwa na kusanyiko. Tafsiri hii ni ya kawaida katika Kiswahili na haiongezi wazo lisilokuwamo.
- source_word: נֶעֶשְׂתָה לִשְׁגָגָה
  choice: jambo hilo lilifanywa bila kukusudia
  rationale: שְׁגָגָה hapa ni kosa la kutokukusudia, tofauti na dhambi ya makusudi inayotajwa katika muktadha unaofuata.
- source_word: כָל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה humaanisha jumuiya ya agano, hasa inapokusanyika; ‘kusanyiko lote’ huhifadhi כָל na ni Kiswahili sanifu kinachoeleweka.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: fahali mmoja kutoka kundini
  rationale: Kirai kinamtaja fahali wa ng’ombe kutoka kundini. ‘Fahali’ huhifadhi jinsia na aina ya mnyama bila kufuata muundo wa Kiebrania neno kwa neno.
- source_word: לְעֹלָה
  choice: kuwa sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi maalumu ya sadaka iliyoteketezwa; tafsiri hii ni wazi na ya kawaida katika Kiswahili cha Biblia.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: iwe harufu inayompendeza
  rationale: Kirai hiki cha ibada huonyesha sadaka inayokubalika mbele za Mungu huku kikihifadhi taswira halisi ya harufu.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama jina binafsi ‘Yahwe’ badala ya cheo.
- source_word: וּמִנְחָתוֹ
  choice: pamoja na sadaka yake ya nafaka
  rationale: Katika muktadha wa dhabihu, מִנְחָה ni sadaka ya nafaka inayoandamana na sadaka kuu; kiambishi cha umilikaji kimehifadhiwa.
- source_word: וְנִסְכּוֹ
  choice: na sadaka yake ya kinywaji
  rationale: נֶסֶךְ ni kinywaji kinachomiminwa kama sadaka inayoandamana na dhabihu; ‘sadaka ya kinywaji’ ni wazi kuliko neno la kitaalamu lisilo la kawaida.
- source_word: כַּמִּשְׁפָּט
  choice: kama ilivyoagizwa
  rationale: מִשְׁפָּט hapa ni utaratibu uliowekwa kwa sheria. Tafsiri hii huwasilisha maana ya kanuni ya ibada kwa Kiswahili cha kawaida.
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: na mbuzi dume mmoja
  rationale: שְׂעִיר עִזִּים humaanisha mbuzi wa kiume; ‘mbuzi dume’ huhifadhi ubainifu huo.
- source_word: לְחַטָּאת
  choice: kuwa sadaka ya dhambi
  rationale: חַטָּאת katika sheria za dhabihu kwa kawaida huitwa ‘sadaka ya dhambi.’ Maana mbadala inayosisitiza utakaso wa kiibada imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya חַטָּאת katika muktadha wa dhabihu za kikuhani
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Istilahi inaweza kusisitiza uhusiano wa sadaka na dhambi au matokeo yake ya utakaso wa kiibada. Matini kuu inatumia istilahi inayotambulika zaidi, huku tanbihi ikihifadhi maana nyingine muhimu.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina la agano badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imepangwa kwa mtiririko wa asili wa Kiswahili huku ikihifadhi masharti, maelezo ya sadaka, na istilahi za ibada za matini ya Kiebrania.
