  to: Ikiwa jambo hilo lilifanywa bila kukusudia na kusanyiko halikulitambua, kusanyiko lote litatoa fahali mmoja wa kundi la ng’ombe kuwa sadaka ya kuteketezwa, kwa harufu ya kupendeza kwa Yahweh, pamoja na sadaka yake ya nafaka na sadaka yake ya kinywaji, kama ilivyoagizwa, na mbuzi dume mmoja kuwa sadaka ya dhambi.[a]
