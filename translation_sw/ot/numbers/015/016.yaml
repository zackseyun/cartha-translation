  text: One law and one ordinance shall be for you and for the sojourner who sojourns with you[a].
translation:
  language: sw
  text: Sheria moja na kanuni moja zitatumika kwenu na kwa mgeni mkazi anayeishi pamoja nanyi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mgeni anayeishi miongoni mwenu.” Neno la Kiebrania גֵּר humaanisha mtu asiye mzawa anayeishi miongoni mwa Waisraeli chini ya utaratibu wa jumuiya yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: sheria
  rationale: Katika muktadha huu wa kisheria, neno hili linamaanisha agizo linalowajibisha; “sheria” ni la kawaida na linaeleweka wazi kwa wasomaji wa Kiswahili.
- source_word: מִשְׁפָּט
  choice: kanuni
  rationale: Hapa neno hili linaonyesha utaratibu au kiwango cha kisheria kilichowekwa. “Kanuni” linatofautisha neno hili na תּוֹרָה bila kudokeza hasa hukumu ya mahakama.
- source_word: אַחַת / אֶחָד
  choice: moja
  rationale: Kurudia “moja” kunahifadhi msisitizo wa Kiebrania kwamba kiwango ni kimoja kwa pande zote.
- source_word: יִהְיֶה
  choice: zitatumika
  rationale: Kauli ya wakati ujao hapa ina nguvu ya agizo la kisheria. “Zitatumika” huwasilisha kwa Kiswahili cha kawaida kwamba sheria na kanuni hiyo itawahusu wote, badala ya kuwa utabiri tu.
- source_word: גֵּר
  choice: mgeni mkazi
  rationale: Neno hili humaanisha mtu asiye mzawa anayeishi ndani ya jumuiya ya Israeli. “Mgeni mkazi” ni wazi kuliko “mgeni” peke yake, ambalo pia linaweza kumaanisha mtu aliyekuja kwa ziara fupi.
- source_word: הַגָּר
  choice: anayeishi
  rationale: Kitenzi hiki kinaendeleza wazo lililomo katika גֵּר. “Anayeishi” huhifadhi msisitizo kwamba huyo ni mgeni mwenye makao katika jumuiya, ingawa Kiswahili hakiwezi kuiga kikamilifu mchezo wa maneno wa Kiebrania.
- source_word: אִתְּכֶם
  choice: pamoja nanyi
  rationale: Hili linawakilisha maana ya moja kwa moja ya “nanyi” na pia linaonyesha kwamba mgeni huyo anaishi ndani ya jumuiya yao.
theological_decisions:
- issue: Usawa wa kisheria kati ya Waisraeli na mgeni mkazi katika sheria za ibada
  choice: Aya inasema kwamba sheria na kanuni ileile zitatumika kwa Israeli na kwa mgeni mkazi anayeishi pamoja nao.
  alternative: Maneno hayo yanaweza kueleweka kwa upeo mwembamba zaidi kuwa yanahusu tu masharti ya dhabihu katika muktadha wa karibu.
  rationale: Kauli ya aya ni pana—“sheria moja na kanuni moja”—lakini iko katika sehemu maalumu ya sheria. Tafsiri inahifadhi kauli hiyo pana bila kuamua kimya kimya upeo wake nje ya muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “zitatumika kwenu” umechaguliwa badala ya tafsiri ngumu ya neno kwa neno ya “itakuwa kwenu,” ili kuwasilisha kwa kawaida nguvu ya kisheria ya sentensi. Kurudiwa kwa “moja” kumehifadhiwa.
