  text: וְ/כִֽי יָגוּר֩ אִתְּ/כֶ֨ם גֵּ֜ר א֤וֹ אֲשֶֽׁר בְּ/תֽוֹכְ/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָשָׂ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה כַּ/אֲשֶׁ֥ר תַּעֲשׂ֖וּ כֵּ֥ן יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/014.yaml
  text: And if a sojourner is staying with you[a], or anyone who is among you throughout your generations, and he offers a food offering, a pleasing aroma to Yahweh, just as you do, so he shall do.
translation:
  language: sw
  text: Na ikiwa mgeni anaishi pamoja nanyi, au mtu yeyote aliye miongoni mwenu katika vizazi vyenu, naye akitoa sadaka inayotolewa kwa moto, harufu ya kupendeza kwa Yahwe, kama mnavyofanya ninyi, ndivyo atakavyofanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Na ikiwa
  rationale: Huhifadhi kiunganishi וְ na huanzisha sharti la kisheria kwa Kiswahili cha kawaida.
- source_word: יָגוּר ... גֵּר
  choice: mgeni anaishi
  rationale: Kitenzi גור kinaonyesha kukaa kama asiye mwenyeji, na גֵּר humtaja mgeni anayeishi katika jumuiya; muundo huu ni wa asili na unaeleweka kwa urahisi.
- source_word: אִתְּכֶם
  choice: pamoja nanyi
  rationale: Hutofautisha kihusishi hiki na בְּתוֹכְכֶם, ambacho kimetafsiriwa 'miongoni mwenu.'
- source_word: אוֹ אֲשֶׁר בְּתוֹכְכֶם
  choice: au mtu yeyote aliye miongoni mwenu
  rationale: Hufuata upana wa kishazi cha Kiebrania bila kukibana kwa kundi maalumu lisilotajwa wazi.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu
  rationale: Hudumisha wazo la kuendelea kwa agizo katika vizazi vinavyofuatana.
- source_word: וְעָשָׂה
  choice: naye akamtolea
  rationale: Katika muktadha wa dhabihu, עשה hueleza kutenda tendo la kutoa sadaka; 'akamtolea' ni Kiswahili cha kawaida na hudumisha mwelekeo kwa Yahwe.
- source_word: אִשֵּׁה
  choice: sadaka ya kuteketezwa kwa moto
  rationale: Neno hili linahusu sadaka inayotolewa kwa moto. Tafsiri hii inaonyesha kipengele hicho wazi bila kudokeza kuwa Mungu anakula sadaka.
- source_word: רֵיחַ נִיחֹחַ
  choice: yenye harufu ya kumpendeza
  rationale: Hudumisha sitiari ya dhabihu inayokubalika mbele za Mungu kwa lugha ya sasa na ya asili.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Hutaja jina la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: כַּאֲשֶׁר תַּעֲשׂוּ כֵּן יַעֲשֶׂה
  choice: kama mnavyofanya ninyi, ndivyo atakavyofanya
  rationale: Huhifadhi muundo wa ulinganisho wa sheria unaoweka utaratibu mmoja kwa Waisraeli na kwa mtu huyo.
theological_decisions:
- issue: Hadhi ya asiye Mwisraeli anayeshiriki katika ibada ya dhabihu
  choice: Aya inaweka utaratibu uleule wa sadaka kwa mgeni au mtu mwingine aliye miongoni mwa Israeli katika jambo hili.
  alternative: Maneno hayo yanaweza kueleweka kwa maana finyu zaidi, yakimhusu mgeni mkazi ambaye tayari ameunganishwa katika maisha ya agano ya Israeli.
  rationale: Kauli 'kama mnavyofanya ninyi, ndivyo atakavyofanya' inasisitiza usawa wa utaratibu katika tendo hili, bila kutoa hitimisho pana zaidi kuhusu hadhi ya agano ambalo aya yenyewe haitamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisheria na ulinganifu wa Kiebrania umehifadhiwa, huku sentensi ikibaki wazi kwa msomaji wa kawaida.
