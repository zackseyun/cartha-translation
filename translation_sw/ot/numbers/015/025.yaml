base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/025.yaml
  text: And the priest shall make atonement for all the congregation of the sons of Israel[a], and they shall be forgiven, because it was an unintentional error, and they have brought their offering, an offering made by fire to Yahweh, and their sin offering before Yahweh[c][b], for their unintentional error.
translation:
  language: sw
  text: Kuhani atafanya upatanisho kwa ajili ya kusanyiko lote la Waisraeli, nao watasamehewa, kwa sababu lilikuwa kosa lisilokusudiwa, nao wameleta sadaka yao, sadaka inayotolewa kwa moto kwa Yahwe[b], na sadaka yao ya dhambi[a] mbele za Yahwe, kwa ajili ya kosa lao lisilokusudiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka yao ya utakaso.” Neno la Kiebrania linaweza kumaanisha sadaka inayohusiana na dhambi au utakaso katika muktadha wa dhabihu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaonyesha sadaka inayotolewa kwa moto; wengine hulitafsiri “sadaka ya chakula kwa Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: atafanya upatanisho
  rationale: Kitenzi כפר katika muktadha wa dhabihu humaanisha kutekeleza upatanisho; usemi huu wa kawaida unahifadhi uzito wake wa kidini.
- source_word: עַל כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: kwa ajili ya kusanyiko lote la Waisraeli
  rationale: עַל baada ya כפר humaanisha ‘kwa ajili ya/kwa niaba ya’; ‘kusanyiko lote la Waisraeli’ ni Kiswahili cha asili na kinawakilisha jamii nzima.
- source_word: וְנִסְלַח לָהֶם
  choice: nao watasamehewa
  rationale: Huhifadhi kauli tendwa ya Kiebrania bila kuongeza wazi mtendaji ambaye hajatajwa katika mstari.
- source_word: כִּי שְׁגָגָה הִוא
  choice: kwa sababu lilikuwa kosa lisilokusudiwa
  rationale: שְׁגָגָה huonyesha kosa au dhambi iliyofanywa bila kukusudia; tafsiri hii inadumisha wazo la kutokusudia bila kuondoa uzito wa kosa.
- source_word: אֶת קָרְבָּנָם
  choice: sadaka yao
  rationale: קָרְבָּן ni neno la jumla kwa kitu kinacholetwa karibu na Mungu kama sadaka.
- source_word: אִשֶּׁה לַיהוָה
  choice: sadaka inayotolewa kwa moto kwa Yahwe
  rationale: Inahifadhi uhusiano wa אִשֶּׁה na moto bila kuifanya kimakosa kuwa ‘sadaka ya kuteketezwa’ kama aina maalumu ya dhabihu.
- source_word: וְחַטָּאתָם
  choice: pamoja na sadaka yao ya dhambi
  rationale: Katika sentensi hii חַטָּאת ni kitu kinacholetwa mbele za Yahwe, hivyo humaanisha sadaka inayoshughulikia dhambi; ‘sadaka ya utakaso’ imehifadhiwa kama uwezekano katika tanbihi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuwasilisha sadaka katika uwepo wa Mungu.
- source_word: עַל שִׁגְגָתָם
  choice: kwa ajili ya kosa lao lisilokusudiwa
  rationale: Inarudia kwa uthabiti mzizi שׁגג na kueleza sababu ya kuleta sadaka.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la agano, יהוה; ‘Yahwe’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חַטָּאת katika sheria ya dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Muktadha unadai sadaka, si dhambi yenyewe, lakini istilahi ya Kiebrania inaweza kusisitiza pia kazi yake ya utakaso; uwezekano huo umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo mrefu wa sheria umehifadhiwa, huku vistari virefu vikitenga maelezo ya aina ya sadaka ili sentensi isomeke kwa urahisi.
