  text: Lakini mkikosea bila kukusudia na msipotimiza amri hizi zote ambazo Yahwe alimwambia Musa,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkipotoka,” au, “mkitenda dhambi bila kukusudia.” Kitenzi cha Kiebrania kinaweza kumaanisha kupotoka au kukosea; hapa kinahusu kutotimiza amri bila kukusudia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Lakini ikiwa
  rationale: Kifungu hiki kinaanzisha hali ya masharti inayoendeleza sheria iliyotangulia, huku ‘lakini’ ikionyesha badiliko dogo la hali.
- source_word: תִשְׁגּוּ
  choice: mtakosea bila kukusudia
  rationale: Kitenzi שׁגה humaanisha kukosea au kupotoka; katika muktadha huu wa kisheria, kosa hilo ni la kutokusudia.
- source_word: וְלֹא תַעֲשׂוּ
  choice: na msitimize
  rationale: Ingawa עשה kwa msingi ni ‘kufanya,’ ‘kutimiza amri’ ni Kiswahili cha kawaida kinachoeleza kutekeleza yale yaliyoamriwa.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: amri hizi zote
  rationale: ‘Amri’ linafaa kwa מִצְוֺת katika muktadha wa sheria ya agano, na mpangilio huu ni wa kawaida katika Kiswahili.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: ambazo Yahwe alimwambia Musa
  rationale: Kishazi hiki kinazitambulisha amri kuwa zile ambazo Yahwe alimfikishia Musa kwa kusema.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa kwa umbo linalotumika kwa kawaida katika tahajia ya Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu; kulitaja kama jina huhifadhi tofauti kati ya jina hilo na cheo.
- issue: Maana ya שׁגה katika muktadha wa sheria na dhabihu
  choice: kukosea bila kukusudia
  alternative: kupotoka
  rationale: Muktadha unaofuata unatofautisha makosa yasiyokusudiwa na dhambi ya ukaidi. Tafsiri hii inadumisha tofauti hiyo bila kufafanua kosa zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa wingi umehifadhiwa, na sentensi inaishia kwa koma kwa sababu wazo linaendelea katika mstari unaofuata.
