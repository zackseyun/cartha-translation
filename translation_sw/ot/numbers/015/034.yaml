  yaml_path: translation/ot/numbers/015/034.yaml
  text: So they put him in custody[a], because it had not been made clear what should be done to him.
translation:
  language: sw
  text: Wakamweka chini ya ulinzi, kwa sababu haikuwa imebainishwa[a] afanyiwe nini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haikuwa imeelezwa wazi afanyiwe nini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחוּ
  choice: wakamweka
  rationale: Katika kauli ya Hifili, נוח hapa ina maana ya kumweka au kumwacha mtu mahali fulani. “Wakamweka” ni ya kawaida na inaonyesha kwamba walimweka chini ya ulinzi.
- source_word: אֹתוֹ
  choice: -m- (katika “wakamweka”)
  rationale: Kiwakilishi cha yambwa cha kiume umoja kinamrejelea mtu aliyekutwa akiokota kuni katika muktadha uliotangulia.
- source_word: בַּמִּשְׁמָר
  choice: chini ya ulinzi
  rationale: מִשְׁמָר inaweza kumaanisha ulinzi, kuwekwa mahabusu, au mahali pa kuzuiliwa. “Chini ya ulinzi” inaeleza kuzuiliwa kwake bila kudokeza kwamba tayari alikuwa amepewa hukumu rasmi ya kifungo.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya wao kumweka chini ya ulinzi; “kwa sababu” ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: לֹא פֹרַשׁ
  choice: haikuwa imewekwa wazi
  rationale: Kauli tendwa ya פרש inaonyesha kwamba jambo hilo halikuwa bado limeelezwa au kuainishwa wazi. Tafsiri hii inadumisha kauli tendwa na kutokuwa na uhakika kuhusu hatua ya kisheria.
- source_word: מַה יֵּעָשֶׂה לוֹ
  choice: afanyiwe nini
  rationale: Usemi huu wa Kiswahili ni wa kawaida, unadumisha kauli tendwa, na unaonyesha swali kuhusu hatua iliyopaswa kuchukuliwa dhidi yake bila kuongeza maelezo yasiyomo katika chanzo.
theological_decisions:
- issue: Hali ya kutokuwa na uhakika katika mchakato wa kisheria
  choice: Mstari unasema kwamba hatua ambayo angefanyiwa haikuwa bado imewekwa wazi.
  alternative: Maneno hayo yanaweza kueleweka kwa maana nyembamba zaidi kwamba adhabu mahususi haikuwa bado imetajwa.
  rationale: Kauli tendwa לֹא פֹרַשׁ inalenga kutokuwepo kwa maelezo mahususi yaliyo wazi. Tafsiri haidokezi kwamba sheria yote haikujulikana, wala haiamui kwamba ni aina fulani tu ya adhabu iliyokuwa haijulikani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Chini ya ulinzi” ni wazi kwa wasomaji wa kawaida na huepuka neno “gerezani,” ambalo lingeweza kuzidisha maana ya kifungo cha muda kabla ya uamuzi.
