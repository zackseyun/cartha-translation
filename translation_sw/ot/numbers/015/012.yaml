translation:
  language: sw
  text: Kwa kadiri ya idadi mtakayotayarisha,[a] ndivyo mtakavyotayarisha kwa kila mmoja kulingana na idadi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa kadiri ya idadi mtakayofanya, ndivyo mtakavyofanya kwa kila mmoja kulingana na idadi yao.” Kitenzi cha Kiebrania עשה kwa kawaida humaanisha “kufanya” au “kutengeneza”; hapa “kutayarisha” limetumiwa kufafanua muktadha wa sadaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמִּסְפָּר
  choice: Kulingana na idadi
  rationale: Kiambishi כ pamoja na מִסְפָּר kinaonyesha kufuata au kuwiana na idadi; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: אֲשֶׁר תַּעֲשׂוּ
  choice: ya sadaka mtakazotayarisha
  rationale: Kitenzi עשה kwa kawaida humaanisha ‘kufanya’ au ‘kutengeneza,’ lakini hapa muktadha ni wa kutayarisha sadaka. Neno ‘sadaka’ limewekwa wazi ili kishazi cha Kiswahili kiwe cha asili bila kubadili jambo linalozungumziwa katika muktadha.
- source_word: כָּכָה תַּעֲשׂוּ
  choice: fanyeni hivyo
  rationale: כָּכָה ni ‘hivyo’ au ‘kwa namna hii,’ na kitenzi cha pili kina nguvu ya agizo katika muktadha huu.
- source_word: לָאֶחָד
  choice: kwa kila moja
  rationale: Ingawa kwa umbo ni ‘kwa mmoja,’ hapa אֶחָד limetumiwa kwa maana ya kugawa agizo kwa kila sadaka au mnyama mmoja mmoja.
- source_word: כְמִסְפָּרָם
  choice: kulingana na idadi yao
  rationale: Huhifadhi maana ya kufuata idadi na kiambishi cha wingi ‘yao’ kilichopo katika Kiebrania, bila kuamua kimyakimya rejeo lake.
