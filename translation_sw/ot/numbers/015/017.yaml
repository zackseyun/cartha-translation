base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: sw
  text: Yahwe akasema na Mose[a], akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa mapokeo hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Katika fomula hii ya simulizi, kitenzi דבר kinaanzisha tukio jipya la Mungu kusema; “akasema” ni Kiswahili cha kawaida na chenye heshima.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina la pekee lililo katika maandishi ya Kiebrania.
- source_word: אֶל
  choice: na
  rationale: Baada ya kitenzi “sema,” Kiswahili sanifu hutumia “sema na” kumtaja anayeambiwa.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi fomula ya Kiebrania inayotanguliza maneno yatakayofuata, huku ikisomeka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la pekee YHWH, si cheo. “Yahwe” hulihifadhi jina hilo kwa utohozi wa kawaida wa Kiswahili bila kuingiza badala ya kimapokeo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Fomula ya kurudia “akasema ... akisema” imehifadhiwa kwa sababu inaakisi muundo wa Kiebrania na hutanguliza yaliyosemwa katika mstari unaofuata.
