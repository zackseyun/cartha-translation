  yaml_path: translation/ot/numbers/015/027.yaml
  text: But if one person sins unintentionally[a], then she shall present a one-year-old female goat as a sin offering.
translation:
  language: sw
  text: Lakini ikiwa mtu mmoja atatenda dhambi bila kukusudia, atamleta mbuzi jike wa mwaka mmoja kuwa sadaka ya dhambi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha sadaka inayoshughulikia dhambi au unajisi, wala si dhambi yenyewe tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Kiunganishi hiki kinaanzisha hali tofauti na sheria iliyotangulia; “Lakini ikiwa” kinahifadhi uendelezaji wenye utofautishaji mdogo.
- source_word: נֶפֶשׁ אַחַת
  choice: mtu mmoja
  rationale: Katika muktadha wa kisheria נֶפֶשׁ humaanisha mtu binafsi, si “nafsi” kama sehemu isiyo ya kimwili; “mtu mmoja” pia huhifadhi umoja uliosisitizwa na אַחַת.
- source_word: תֶּחֱטָא
  choice: atatenda dhambi
  rationale: Kauli ya masharti ya kisheria imewasilishwa kwa wakati ujao wa Kiswahili, unaofaa katika muundo “ikiwa … ata-”.
- source_word: בִשְׁגָגָה
  choice: bila kukusudia
  rationale: Usemi huu unaonyesha kosa lisilofanywa kwa makusudi na unatofautisha tendo hilo na dhambi ya ukaidi.
- source_word: וְהִקְרִיבָה
  choice: atamleta
  rationale: Katika lugha ya dhabihu, Hiphil ya קרב humaanisha kuleta au kuwasilisha mnyama kwa ajili ya sadaka; “atamleta” ni ya asili kwa mnyama anayepelekwa madhabahuni.
- source_word: עֵז
  choice: mbuzi jike
  rationale: Nomino ya Kiebrania humtaja mbuzi wa kike; jinsia ya mnyama imeonyeshwa wazi.
- source_word: בַּת שְׁנָתָהּ
  choice: wa mwaka mmoja
  rationale: Nahau hii humaanisha mnyama mwenye mwaka mmoja au aliye katika mwaka wake wa kwanza; usemi huu ni mfupi na wa kawaida kwa Kiswahili.
- source_word: לְחַטָּאת
  choice: kuwa sadaka ya dhambi
  rationale: Katika sheria za dhabihu חַטָּאת kwa kawaida ni jina la sadaka inayoshughulikia dhambi au unajisi, si dhambi yenyewe tu.
theological_decisions:
- issue: Jinsia ya mtu aliyetenda dhambi
  choice: “mtu mmoja … atatenda … atamleta,” bila kumwekea jinsia katika Kiswahili
  alternative: Kumtaja wazi kuwa mwanamke kwa kufuata maumbo ya kike ya Kiebrania
  rationale: Maumbo ya kike katika Kiebrania yanaafikiana kisarufi na נֶפֶשׁ, nomino ya jinsia ya kike, na si lazima yaweke sheria kwa wanawake pekee. Kiswahili hakitofautishi jinsia katika viwakilishi na viambishi hivi, hivyo tafsiri inahifadhi matumizi ya jumla bila kuongeza jinsia isiyodaiwa na maana.
- issue: Maana ya חַטָּאת katika sheria ya dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: “Sadaka ya dhambi” ni istilahi inayoeleweka na hutaja sadaka inayohusiana na dhambi katika mstari huu, huku maana mbadala ya kiibada ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wa sasa, na unaoeleweka kwa wasomaji wa kawaida. Muundo wa sharti la kisheria umehifadhiwa kwa “ikiwa … ata-,” na istilahi ya dhabihu imewekwa wazi bila kuingiza msimamo wa dhehebu.
