id: NUM.15.38
reference: Numbers 15:38
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם וְ/עָשׂ֨וּ לָ/הֶ֥ם צִיצִ֛ת עַל כַּנְפֵ֥י בִגְדֵי/הֶ֖ם לְ/דֹרֹתָ֑/ם וְ/נָֽתְנ֛וּ עַל צִיצִ֥ת הַ/כָּנָ֖ף פְּתִ֥יל תְּכֵֽלֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/038.yaml
  text: Speak to the sons of Israel and tell them to make tassels for themselves on the corners of their garments throughout their generations[b][a], and to put a cord of blue on the tassel of each corner.
translation:
  language: sw
  text: Waambie wana wa Israeli wajifanyie vishada[a] kwenye pembe za mavazi yao, katika vizazi vyao vyote, na waweke uzi wa rangi ya samawati[b] kwenye kishada cha kila pembe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matamvua” kwa neno la Kiebrania צִיצִת.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania תְּכֵלֶת linamaanisha rangi au dawa ya kutia rangi ya samawati, au samawati yenye kuelekea zambarau, iliyotumiwa katika vifaa vitakatifu vya Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi lugha ya ukoo ya Kiebrania, ‘wana wa Israeli,’ kwa Kiswahili cha kawaida na chenye heshima.
- source_word: וְעָשׂוּ לָהֶם
  choice: wajifanyie
  rationale: Kitenzi hiki huwasilisha kwa ufupi maana ya kujitengenezea, na hivyo kuhifadhi nguvu ya לָהֶם (‘kwa ajili yao wenyewe’).
- source_word: צִיצִת
  choice: vishada
  rationale: ‘Vishada’ hueleza vitu vya nyuzi vinavyoning’inia vilivyowekwa kwenye pembe za vazi; ‘pindo’ linaweza pia kutumiwa lakini linaweza kumaanisha ukingo mzima wa vazi.
- source_word: עַל כַּנְפֵי בִגְדֵיהֶם
  choice: kwenye pembe za mavazi yao
  rationale: Ingawa כָּנָף kimsingi ni ‘bawa,’ hapa kimuktadha ni ncha au pembe ya vazi.
- source_word: לְדֹרֹתָם
  choice: katika vizazi vyao vyote
  rationale: Huwasilisha kuendelea kwa agizo hilo katika vizazi vinavyofuatana bila kuongeza kikomo kisichotajwa.
- source_word: עַל צִיצִת הַכָּנָף
  choice: kwenye kishada cha kila pembe
  rationale: Umoja wa Kiebrania una maana ya ugaw distributive katika muktadha; ‘kila pembe’ hufanya maana hiyo iwe wazi kwa Kiswahili.
- source_word: פְּתִיל
  choice: uzi
  rationale: Katika muktadha wa vazi na kishada, ‘uzi’ ni neno la asili na linaloeleweka kwa kitu kilichosokotwa au kuunganishwa; ‘kamba’ ingeweza kudokeza kitu kinene mno.
- source_word: תְּכֵלֶת
  choice: rangi ya samawati
  rationale: ‘Samawati’ ni tafsiri iliyo wazi na inayofikika ya rangi hii, huku uwezekano wa samawati yenye kuelekea zambarau ukihifadhiwa katika tanbihi.
