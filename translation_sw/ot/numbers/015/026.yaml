revisions:
- from: Nalo litasamehewa kusanyiko lote la wana wa Israeli[a], pamoja na mgeni anayeishi kati yao[b], kwa sababu lilikuwa kosa la watu wote lisilokusudiwa[c].
  to: Na kusanyiko lote la wana wa Israeli, pamoja na mgeni anayeishi miongoni mwao, watasamehewa[a][b], kwa maana watu wote walikosea bila kukusudia[c].
  rationale: The revision removes the antecedentless “Nalo,” expresses the coordinated recipients of the impersonal forgiveness naturally in Swahili, and renders the final legal phrase as unintentional communal error. It preserves the source’s ambiguity through the footnote without importing doctrinal interpretation.
