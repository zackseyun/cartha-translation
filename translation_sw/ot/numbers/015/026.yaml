base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/026.yaml
  text: And all the congregation of the sons of Israel shall be forgiven[a], along with the sojourner who sojourns among them[c][b], because for all the people it was done unintentionally.
translation:
  language: sw
  text: Na kusanyiko lote la wana wa Israeli, pamoja na mgeni anayeishi miongoni mwao, watasamehewa[a][b], kwa maana watu wote walikosea bila kukusudia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jumuiya yote ya Waisraeli.” Kiebrania kinasema kihalisi, “kusanyiko lote la wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: “Mgeni” hapa ni mtu asiye Mwisraeli anayeishi miongoni mwa Israeli chini ya sheria na ulinzi wa jumuiya.
    reason: cultural_note
  - marker: c
    text: Kifungu cha mwisho cha Kiebrania ni kifupi; pia kinaweza kutafsiriwa, “kwa maana watu wote walikuwa katika kosa,” au, “kwa kuwa jambo hilo lilitendwa bila kukusudia na watu wote.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִסְלַח
  choice: Nalo litasamehewa
  rationale: Nifali ya סלח ina maana ya kutendwa/passive; umbo hili linaeleza kuwa kusanyiko lote litapokea msamaha, huku kiambishi “-lo” kikirejelea “kusanyiko.”
- source_word: לְכָל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: kusanyiko lote la wana wa Israeli
  rationale: “Kusanyiko” huhifadhi maana ya jumuiya iliyokusanyika katika muktadha huu wa sheria na ibada; “wana wa Israeli” hufuata kwa karibu muundo wa Kiebrania.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: pamoja na mgeni anayeishi kati yao
  rationale: גֵּר ni mgeni mkazi ndani ya jamii ya Israeli, si msafiri wa muda tu. Kiswahili cha kawaida hakiwezi kuhifadhi kwa ufasaha uradidi wa mzizi ג־ו־ר, hivyo “anayeishi” hufafanua hali yake ya ukaaji.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaanzisha sababu ya msamaha uliotajwa.
- source_word: לְכָל הָעָם בִּשְׁגָגָה
  choice: lilikuwa kosa la watu wote lisilokusudiwa
  rationale: Kauli ya Kiebrania ni fupi na ya kimviringo. Tafsiri hii inaonyesha kwamba kosa liliwahusu watu wote na kwamba lilikuwa la kutokukusudia, bila kudai kwamba kila mtu binafsi alilitenda.
theological_decisions:
- issue: Upeo wa msamaha wa kijumuiya
  choice: Msamaha unalihusu kusanyiko lote la Israeli pamoja na mgeni mkazi aliye kati yao.
  alternative: Kueleza tu kwamba kosa lilitendwa na watu wote bila kusisitiza hali ya kijumuiya.
  rationale: Kiebrania kinataja wazi kusanyiko lote na mgeni mkazi, likijumuisha wote katika utaratibu huu wa msamaha.
- issue: Maana ya kifungu cha mwisho
  choice: “lilikuwa kosa la watu wote lisilokusudiwa”
  alternative: “kwa maana watu wote walikosea” au “kwa kuwa lilitendwa bila kukusudia na watu wote”
  rationale: Muundo לְכָל הָעָם בִּשְׁגָגָה ni mkato na unaweza kueleweka kwa zaidi ya namna moja. Chaguo kuu huhifadhi hali ya kijumuiya na kutokusudiwa; tanbihi inadumisha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kusanyiko” linafaa muktadha wa kijumuiya na wa ibada; “mgeni anayeishi kati yao” ni wazi zaidi kuliko istilahi nzito kama “mgeni mkazi.”
