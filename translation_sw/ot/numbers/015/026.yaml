    reason: alternative_reading
  revision_rationale: The revision removes the antecedentless “Nalo,” expresses the coordinated recipients of the impersonal forgiveness naturally in Swahili, and renders the final legal phrase as unintentional communal error. It preserves the source’s ambiguity through the footnote without importing doctrinal interpretation.
