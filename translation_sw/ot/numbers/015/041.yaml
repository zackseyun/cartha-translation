base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/041.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to be your God. I am Yahweh your God.
translation:
  language: sw
  text: Mimi ni Yahweh, Mungu wenu, niliyewatoa katika nchi ya Misri ili niwe Mungu wenu.[a] Mimi ni Yahweh, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ili niwe Mungu kwenu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi ili kuhifadhi jina binafsi la agano badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ingawa umbo la אֱלֹהִים ni la wingi kimofolojia, hapa linamtaja Mungu mmoja wa Israeli; kiambishi kinawahusu watu wengi.
- source_word: אֲשֶׁר הוֹצֵאתִי אֶתְכֶם
  choice: niliyewatoa
  rationale: Kitenzi cha Hifili kutoka יצא kina maana ya kusababisha watoke, yaani ‘kuwatoa’; ‘niliye-’ humrejelea Yahweh kwa kawaida katika Kiswahili.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: ‘Katika ...’ baada ya ‘kuwatoa’ huonyesha mahali walikotolewa, huku ‘nchi ya Misri’ ikihifadhi maelezo ya אֶרֶץ.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: ili niwe Mungu wenu
  rationale: Muundo wa kusudi umeonyeshwa kwa ‘ili’; ‘Mungu wenu’ ni Kiswahili cha kawaida kinachohifadhi uhusiano wa agano.
- source_word: אֲנִי
  choice: Mimi ni
  rationale: Kiwakilishi huru kina mkazo; ‘Mimi ni’ huonyesha kishazi cha Kiebrania kisicho na kitenzi katika Kiswahili cha asili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Andiko lina jina la agano lenyewe. ‘Yahweh’ huhifadhi jina hilo bila kulibadilisha kuwa cheo, huku ‘Yehova’ likiwa unukuzi mwingine wa mapokeo.
- issue: Kauli ya agano לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: ili niwe Mungu wenu
  alternative: ili niwe Mungu kwenu
  rationale: Chaguo kuu ni la kawaida na linaonyesha uhusiano wa agano; tanbihi huhifadhi muundo wa karibu zaidi na Kiebrania bila kulazimisha tofauti ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio na mkazo wa kauli ya Kiebrania vimehifadhiwa.
