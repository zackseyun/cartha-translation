base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/028.yaml
  text: And the priest shall make atonement before Yahweh for the person who sins unintentionally, when he sins unintentionally, to make atonement for him, and he shall be forgiven.
translation:
  language: sw
  text: Kuhani atafanya upatanisho mbele za Yahwe kwa ajili ya mtu anayekosea kwa kutenda dhambi bila kukusudia. Kuhani atafanya upatanisho kwa ajili yake, na mtu huyo atasamehewa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר
  choice: atafanya upatanisho
  rationale: 'Kauli hii inadumisha maana ya kikuhani ya כפר katika Piel: kutekeleza ibada ya upatanisho, bila kuingiza nadharia mahususi kuhusu namna upatanisho huo unavyofanya kazi.'
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mhudumu wa ibada anayetajwa.
- source_word: עַל הַנֶּפֶשׁ
  choice: kwa ajili ya mtu
  rationale: נֶפֶשׁ hapa humaanisha mtu binafsi, si nafsi isiyo ya kimwili.
- source_word: הַשֹּׁגֶגֶת ... בְּחֶטְאָה בִשְׁגָגָה
  choice: mtu anayekosea kwa kutenda dhambi bila kukusudia
  rationale: Maneno haya yanahifadhi wazo la kukosea pamoja na ufafanuzi kwamba dhambi imetendwa bila kukusudia, huku yakitoa Kiswahili cha kawaida badala ya kurudia kirai kilekile kwa namna ngumu.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: “Mbele za” huonyesha kuwa jambo linafanyika mbele au katika uwepo wake; jina la agano יְהוָה limetolewa kama Yahwe.
- source_word: לְכַפֵּר עָלָיו
  choice: atafanya upatanisho kwa ajili yake
  rationale: Kirai cha kusudi kimetolewa kwa sentensi mpya ili kuhifadhi marudio ya כפר na kufanya Kiswahili kisomeke kwa urahisi.
- source_word: וְנִסְלַח לוֹ
  choice: naye atasamehewa
  rationale: 'Huhifadhi kauli tendwa ya Kiebrania na matokeo ya ibada hiyo: mtu huyo anasamehewa.'
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya upatanisho
  choice: kufanya upatanisho
  alternative: kufunika dhambi
  rationale: “Kufanya upatanisho” huhifadhi maana pana ya kikuhani ya כפר bila kuamua katika tafsiri nadharia maalumu kuhusu utaratibu wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi mbili zimetumiwa ili kudumisha marudio ya כפר bila kuunda muundo mzito. Uhusiano kati ya kosa lisilokusudiwa, upatanisho, na msamaha umeachwa kama ulivyo katika maandishi.
