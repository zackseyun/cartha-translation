translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Vipimo vya kale “efa” na “hini” vimehifadhiwa; sentensi imefuata mfuatano wa maagizo ya ibada bila kuongeza ufafanuzi wa kimadhehebu.
