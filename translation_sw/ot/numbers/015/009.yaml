translation:
  language: sw
  text: 'Kisha atatoa, pamoja na fahali huyo, sadaka ya nafaka: sehemu tatu za kumi za efa ya unga laini uliochanganywa na nusu hini ya mafuta.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “sehemu tatu za kumi”; katika muktadha huu wa dhabihu, kipimo kinachoeleweka ni sehemu tatu za kumi za efa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: kisha ... atatoa
  rationale: Hifili ya קרב katika muktadha wa dhabihu humaanisha kuleta au kutoa sadaka; “kisha” huonyesha mfuatano wa maagizo unaobebwa na waw.
- source_word: עַל
  choice: pamoja na
  rationale: Hapa kihusishi kinaonyesha sadaka inayoambatana na fahali, si mahali juu yake.
- source_word: בֶּן הַבָּקָר
  choice: huyo fahali
  rationale: Kirai halisi “mwana wa ng’ombe” ni nahau ya mnyama wa ng’ombe wa kutolewa dhabihu; “fahali” ni tafsiri fupi na wazi, huku “huyo” ikirejelea fahali aliyetajwa katika mstari uliotangulia.
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika sheria za kikuhani neno hili humaanisha sadaka ya mazao ya nafaka, si zawadi ya kawaida.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Hutaja unga uliosagwa vizuri uliotumiwa katika sadaka; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: sehemu tatu za kumi za efa
  rationale: Kiebrania kinasema kihalisi “sehemu tatu za kumi”; katika vipimo vya sadaka, kipimo kinachoeleweka ni efa, ambacho kimetajwa wazi kwa ajili ya ufafanuzi.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: uliochanganywa na ... mafuta
  rationale: Kirai kinaeleza unga uliounganishwa na mafuta; “uliochanganywa na” ni Kiswahili cha sasa na cha asili.
- source_word: חֲצִי הַהִין
  choice: nusu hini
  rationale: Jina la kipimo cha kale limehifadhiwa kwa unukuzi badala ya kupewa ulinganifu wa kisasa usio hakika.
