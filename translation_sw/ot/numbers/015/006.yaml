  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Majina ya vipimo vya kale ‘efa’ na ‘hini’ yamehifadhiwa; kiashiria cha tanbihi kimewekwa mara moja baada ya kipimo kinachofafanuliwa.
