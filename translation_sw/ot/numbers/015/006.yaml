  yaml_path: translation/ot/numbers/015/006.yaml
  text: Or for a ram you shall prepare a grain offering of fine flour[a], two-tenths, mixed with a third of a hin of oil.
translation:
  language: sw
  text: 'Au kwa ajili ya kondoo dume, utaandaa sadaka ya nafaka: unga laini kiasi cha sehemu mbili za kumi[a], uliochanganywa na theluthi moja ya hini ya mafuta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi “sehemu mbili za kumi,” bila kutaja efa; kipimo hicho kinaeleweka kutokana na mfumo wa vipimo vya sadaka. Linganisha sehemu nyingine zinazosema wazi “sehemu mbili za kumi za efa.”
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: Au
  rationale: Kiunganishi hiki kinaendeleza orodha ya sadaka mbadala bila kuongeza sharti lisilo wazi katika Kiebrania.
- source_word: לָ/אַ֨יִל֙
  choice: kwa ajili ya kondoo dume
  rationale: אַיִל ni kondoo dume, na ל hapa huonyesha uhusiano au kusudi la sadaka.
- source_word: תַּעֲשֶׂ֣ה
  choice: utaandaa
  rationale: Katika muktadha wa maagizo ya dhabihu, ‘utaandaa’ huwasilisha kwa kawaida tendo linalotakiwa kuliko tafsiri pana ya ‘utafanya.’
- source_word: מִנְחָ֔ה
  choice: sadaka ya nafaka
  rationale: Katika muktadha wa kikuhani, מִנְחָה ni sadaka inayotokana na nafaka, si zawadi ya jumla.
- source_word: סֹ֖לֶת
  choice: unga laini
  rationale: סֹלֶת humaanisha unga uliosagwa vizuri unaotumiwa katika sadaka hii.
- source_word: שְׁנֵ֣י עֶשְׂרֹנִ֑ים
  choice: sehemu mbili za kumi za efa
  rationale: Kiebrania kinasema kihalisi ‘sehemu mbili za kumi,’ huku kipimo cha efa kikieleweka kutokana na mfumo wa vipimo vya sadaka; kukitaja katika maandishi hufanya Kiswahili kiwe wazi, na tanbihi inaeleza ellipsisi ya asili.
- source_word: בְּלוּלָ֥ה
  choice: uliochanganywa
  rationale: Kauli hii ya kutendwa inaeleza unga uliotiwa na kuchanganywa pamoja na mafuta.
- source_word: בַ/שֶּׁ֖מֶן
  choice: na ... mafuta
  rationale: Kihusishi katika muundo huu kinaonyesha kitu kilichochanganywa na unga.
- source_word: שְׁלִשִׁ֥ית הַ/הִֽין
  choice: theluthi moja ya hini
  rationale: Huhifadhi sehemu ya kipimo na jina la kipimo cha kale bila kukibadili kuwa kipimo cha kisasa.
