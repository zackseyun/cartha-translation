  text: and wine for the drink offering[a], a third of a hin, you shall present[c][b], a pleasing aroma to Yahweh.
translation:
  language: sw
  text: Na utatoa divai kwa ajili ya sadaka ya kinywaji[a], kiasi cha theluthi moja ya hini[b], kuwa harufu ya kumpendeza Yahwe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya kumiminwa”; neno la Kiebrania linamaanisha sadaka ya kimiminika iliyomiminwa pamoja na dhabihu.
    reason: lexical_alternative
  - marker: b
    text: Hini ilikuwa kipimo cha kale cha vitu vya majimaji.
    reason: cultural_note
  - marker: c
    text: Au “harufu ya kutuliza” au “harufu ya kupendeza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: Na ... divai
  rationale: יַיִן ni neno la kawaida la Kiebrania kwa divai; kiunganishi וְ kinaendeleza maagizo ya sadaka yaliyotangulia.
- source_word: לַ/נֶּסֶךְ
  choice: kwa ajili ya sadaka ya kinywaji
  rationale: נֶסֶךְ ni sadaka ya kimiminika iliyomiminwa pamoja na dhabihu. Kauli hii inaeleweka kwa wasomaji wa kawaida na huhifadhi dhana ya sadaka.
- source_word: שְׁלִשִׁית הַ/הִין
  choice: kiasi cha theluthi moja ya hini
  rationale: Huhifadhi kipimo cha kale cha hini na kutaja kiasi chake bila kukibadili kuwa kipimo cha kisasa kisicho hakika.
- source_word: תַּקְרִיב
  choice: utatoa
  rationale: Hifili ya קרב katika muktadha wa ibada humaanisha kutoa au kuwasilisha sadaka; “utatoa” ni ya kawaida na wazi katika Kiswahili.
- source_word: רֵיחַ נִיחֹחַ
  choice: iwe harufu ya kumpendeza
  rationale: Kauli hii ya kawaida katika lugha ya sadaka inaonyesha kukubalika kwa sadaka mbele za Mungu huku ikihifadhi taswira ya harufu.
- source_word: לַ/יהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kwa umbo la Kiswahili “Yahwe” badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina la agano bila kulibadili kuwa cheo.
- issue: Maana ya רֵיחַ נִיחֹחַ katika lugha ya sadaka
  choice: harufu ya kumpendeza
  alternative: harufu ya kutuliza; harufu nzuri
  rationale: Tafsiri hii huhifadhi taswira na wazo la kukubalika kwa sadaka bila kuamua kwamba nִיחֹחַ lazima imaanishe hasira ya Mungu kutulizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka. Mpangilio umefanywa wa kawaida katika Kiswahili huku kiasi, aina ya sadaka, taswira ya harufu, na jina Yahwe vikihifadhiwa.
