base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/023.yaml
  text: everything that Yahweh has commanded you through Moses[a], from the day that Yahweh commanded and onward throughout your generations—
translation:
  language: sw
  text: yote ambayo Yahweh amewaamuru kupitia Musa[a], tangu siku ambayo Yahweh alitoa amri, na kuendelea katika vizazi vyenu vyote—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, Kiebrania husema, “kwa mkono wa Musa,” nahau yenye maana ya “kupitia Musa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת כָּל אֲשֶׁר
  choice: yote ambayo
  rationale: Kauli hii inaonyesha ujumla wa mambo yote yanayofuata; “yote ambayo” ni ya kawaida na wazi katika Kiswahili.
- source_word: צִוָּה
  choice: amewaamuru
  rationale: Wakati timilifu wa Kiebrania unaonyesha mkusanyiko wa maagizo yaliyotolewa ambao bado una umuhimu katika muktadha; hali timilifu ya Kiswahili inafaa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: אֲלֵיכֶם
  choice: -wa- katika “amewaamuru”
  rationale: Kiambishi cha yambwa “-wa-” kinawataja walengwa wa maagizo kwa Kiswahili cha kawaida.
- source_word: בְּיַד מֹשֶׁה
  choice: kupitia Musa
  rationale: Nahau hii, ambayo kwa maneno halisi ni “kwa mkono wa Musa,” huonyesha uwakala au upatanishi; “kupitia Musa” inawasilisha maana hiyo kwa uwazi.
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: tangu siku ambayo
  rationale: Kauli hii inaweka mwanzo wa kipindi kinachotajwa na inaakisiwa kwa karibu katika Kiswahili.
- source_word: צִוָּה
  choice: alitoa amri
  rationale: Hii inawasilisha kitenzi kilekile cha Kiebrania kwa Kiswahili cha kawaida bila kuacha kitenzi “aliamuru” kining’inie bila yambwa.
- source_word: וָהָלְאָה
  choice: na kuendelea
  rationale: Kauli hii inaonyesha mwendelezo kuanzia wakati uliotajwa.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Tafsiri hii inaonyesha kuendelea kwa maagizo katika vizazi vinavyofuatana vya wasikilizaji.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahweh” huhifadhi jina hilo kwa matamshi yanayotumiwa sana katika taaluma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mstari umeachwa kama kipande cha sentensi na kuishia kwa kistari kirefu kwa sababu unaendelea kutoka na kwenda katika muktadha unaozunguka.
