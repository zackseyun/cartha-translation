  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְמַ֣עַן תִּזְכְּר֔וּ וַ/עֲשִׂיתֶ֖ם אֶת כָּל מִצְוֺתָ֑/י וִ/הְיִיתֶ֥ם קְדֹשִׁ֖ים לֵֽ/אלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/040.yaml
  text: so that you may remember and do all my commandments[a], and be holy to your God.
translation:
  language: sw
  text: ili mkumbuke na kutenda amri zangu zote, na kuwa watakatifu kwa Mungu wenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: ili
  rationale: Huanzisha kusudi au matokeo; “ili” ni ya kawaida na huhifadhi nguvu ya kishazi cha kusudi.
- source_word: תִּזְכְּרוּ
  choice: mkumbuke
  rationale: Ni Qal imperfect nafsi ya pili wingi katika kishazi cha kusudi; “mkumbuke” hutoa maana hiyo kwa Kiswahili cha asili.
- source_word: וַעֲשִׂיתֶם
  choice: na kutenda
  rationale: Kitenzi עשה hapa humaanisha kufanya au kutekeleza amri. “Kutenda” ni cha heshima na huendana vizuri na “amri” bila kuingiza dhana ya kitenzi שמר.
- source_word: אֶת כָּל מִצְוֺתָי
  choice: amri zangu zote
  rationale: “Amri” linafaa katika muktadha wa agano na sheria; mpangilio huu ni wa kawaida katika Kiswahili na huhifadhi כָּל pamoja na kiambishi cha nafsi ya kwanza umoja.
- source_word: וִהְיִיתֶם
  choice: na kuwa
  rationale: היה pamoja na kivumishi cha kiarifu huonyesha hali inayokusudiwa. Muundo sambamba “mkumbuke na kutenda … na kuwa” ni wa kawaida na hauzidishi maana kuwa mchakato wa kubadilika.
- source_word: קְדֹשִׁים
  choice: watakatifu
  rationale: “Watakatifu” huhifadhi upana wa קדוש—utakatifu wa kimaadili, kiagano na wa ibada—bila kuufupisha kuwa kutengwa pekee.
- source_word: לֵאלֹהֵיכֶם
  choice: kwa Mungu wenu
  rationale: ל hapa huonyesha uhusiano au rejea. “Kwa Mungu wenu” ni Kiswahili cha asili kinachohifadhi uhusiano huo bila kuamua kupita kiasi kuwa ni umiliki au kusudi pekee.
theological_decisions:
- issue: Maana ya lugha ya utakatifu katika muktadha wa agano
  choice: Kuhifadhi “watakatifu” badala ya kufafanua kama utii wa kimaadili tu au kutengwa kwa ibada tu.
  alternative: waliotengwa kwa ajili ya Mungu wenu
  rationale: Aya inaunganisha kukumbuka na kutenda amri na kuwa kwa Israeli watakatifu katika uhusiano na Mungu. “Watakatifu” huhifadhi mvutano na upana wa kimaadili, kiagano na wa ibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kusudi umehifadhiwa kwa “ili,” na lugha ya kiagano imewasilishwa bila istilahi za dhehebu.
