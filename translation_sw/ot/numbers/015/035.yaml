  - marker: b
    text: Kiebrania kinatumia usemi unaoweza kutafsiriwa, “kumpiga kwa mawe,” wenye msisitizo wa kutekeleza hukumu ya kifo kwa kumpiga mtu kwa mawe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa simulizi wenye waw-consecutive unaendeleza tukio; “Kisha” na “akamwambia” huwasilisha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu lililoandikwa moja kwa moja katika maandishi ya Kiebrania, kwa tahajia ya Kiswahili.
- source_word: מֹות יוּמַת
  choice: Ni lazima ... auawe
  rationale: Infinitive absolute pamoja na kitenzi huonyesha msisitizo na uhakika wa hukumu; tafsiri hii inadumisha hali ya kutendwa na nguvu ya lazima kwa Kiswahili cha asili.
- source_word: הָאִישׁ
  choice: mtu huyo
  rationale: Nomino yenye uainisho inamrejelea mkosaji aliyetajwa katika muktadha uliotangulia; “mtu huyo” huonyesha rejeo hilo wazi.
- source_word: רָגוֹם אֹתוֹ בָאֲבָנִים
  choice: litampiga kwa mawe
  rationale: Ni usemi wa hukumu unaomaanisha kutekeleza adhabu ya kifo kwa kumpiga mtu kwa mawe; Kiswahili hiki ni cha kawaida na hakihitaji kurudia neno “mawe.”
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה hapa ni jumuiya ya agano kwa ujumla katika muktadha rasmi wa kisheria; “kusanyiko lote” huhifadhi maana ya pamoja.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Ni usemi wa mahali unaobainisha kwamba utekelezaji wa hukumu ufanyike nje ya eneo la kambi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya hukumu katika מֹות יוּמַת
  choice: Ni lazima mtu huyo auawe
  alternative: Hakika mtu huyo atauawa
  rationale: Chaguo hili linahifadhi msisitizo wa Kiebrania pamoja na wajibu wa kutekeleza hukumu, bila kuifanya sentensi ionekane kama utabiri tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya moja kwa moja na ya kisheria; “kusanyiko” limetumiwa badala ya istilahi ya kidhehebu, na msisitizo wa Kiebrania umeelezwa katika tanbihi bila kuleta urudiaji usio wa kawaida katika maandishi makuu.
