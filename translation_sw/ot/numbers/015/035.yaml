  yaml_path: translation/ot/numbers/015/035.yaml
  text: Then Yahweh said to Moses[a], “The man must surely be put to death[b]; the whole congregation shall stone him with stones outside the camp.”
translation:
  language: sw
  text: Kisha Yahwe akamwambia Musa, “Ni lazima mtu huyo auawe[a]; kusanyiko lote litampiga kwa mawe[b] nje ya kambi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “Hakika mtu huyo atauawa.”'
