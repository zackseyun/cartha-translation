  text: Thus it shall be done for the one bull[a], or for the one ram, or for the lamb among the sheep or among the goats.
translation:
  language: sw
  text: Hivi ndivyo itakavyofanywa kwa kila fahali, au kwa kila kondoo dume, au kwa kila mnyama wa mifugo midogo, awe wa kondoo au wa mbuzi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania שֶׂה kinaweza kumaanisha kwa upana mnyama mmoja wa mifugo midogo, si mwanakondoo tu; maneno yanayofuata yanabainisha kuwa ni wa kondoo au wa mbuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּכָה
  choice: Hivi ndivyo
  rationale: Utangulizi wa kawaida na wenye hadhi unaoonyesha namna iliyoagizwa.
- source_word: יֵעָשֶׂה
  choice: itakavyofanywa
  rationale: Huhifadhi hali ya kutendwa na nguvu ya agizo la kisheria bila kutaja mtendaji.
- source_word: לַשּׁוֹר הָאֶחָד
  choice: kwa kila fahali mmoja
  rationale: Neno 'kila' linaonyesha kwamba kanuni inatumika kwa kila mnyama mmoja mmoja, huku 'mmoja' ikihifadhi msisitizo wa umoja.
- source_word: אַיִל הָאֶחָד
  choice: kila kondoo dume mmoja
  rationale: אַיִל ni kondoo dume; usemi huu huhifadhi matumizi ya kanuni kwa mnyama mmoja mmoja.
- source_word: שֶׂה
  choice: mnyama mmoja wa kundi
  rationale: שׂה hapa inaweza kumaanisha mnyama mmoja wa mifugo midogo, awe kondoo au mbuzi; tafsiri hii haifungi maana kwa mwanakondoo pekee.
- source_word: בַכְּבָשִׂים
  choice: wa kondoo
  rationale: Kiambishi ב kinaonyesha kundi au jamii ambayo mnyama huyo anatoka.
- source_word: בָעִזִּים
  choice: wa mbuzi
  rationale: Ni sambamba na 'wa kondoo' na hutaja jamii ya mbuzi.
- source_word: אוֹ ... אוֹ ... אוֹ ... אוֹ
  choice: au ... au ... au ... au
  rationale: Muundo wa chaguo mbadala umehifadhiwa; 'awe ... au ...' huwasilisha kwa Kiswahili cha asili jozi ya mwisho inayobainisha aina ya mnyama wa kundi.
