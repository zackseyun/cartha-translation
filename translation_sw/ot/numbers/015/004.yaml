language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִקְרִ֛יב הַ/מַּקְרִ֥יב קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה מִנְחָה֙ סֹ֣לֶת עִשָּׂר֔וֹן בָּל֕וּל בִּ/רְבִעִ֥ית הַ/הִ֖ין שָֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/004.yaml
  text: then the one who presents his offering to Yahweh shall present a grain offering of fine flour[a], a tenth of an ephah, mixed with a fourth of a hin of oil.
translation:
  language: sw
  text: ndipo yule anayemtolea Yahweh sadaka yake atatoa sadaka ya nafaka ya unga laini, sehemu moja ya kumi ya efa,[a] iliyochanganywa na sehemu moja ya nne ya hini ya mafuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “sehemu moja ya kumi”; katika muktadha huu wa sadaka, maana yake ni sehemu moja ya kumi ya efa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: ndipo ... atatoa
  rationale: Waw pamoja na kitenzi cha timilifu huendeleza utaratibu wa sheria kutoka mstari uliotangulia; “ndipo” huonyesha mfuatano huo kwa Kiswahili cha kawaida, na “atatoa” hufikisha maana ya kisadaka ya הקריב.
- source_word: הַמַּקְרִיב
  choice: yule anayemtolea
  rationale: Kivumishi-tendaji cha Hiphil humtambulisha mtu anayewasilisha sadaka; muundo huu ni wa asili na wazi katika Kiswahili.
- source_word: קָרְבָּנוֹ
  choice: sadaka yake
  rationale: קָרְבָּן ni kitu kinacholetwa kwa Mungu kama sadaka; “sadaka” ndiyo istilahi ya kawaida na inayoeleweka katika muktadha huu.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יְהוָה limetoholewa kama “Yahweh”; uhusiano wa לַ umeonyeshwa ndani ya kitenzi “anayemtolea.”
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika sheria za dhabihu, מִנְחָה humaanisha sadaka ya mazao ya nafaka, ingawa mahali pengine inaweza kumaanisha zawadi au ushuru.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Neno hili humaanisha unga bora uliosagwa vizuri uliotumiwa kwa sadaka; “unga laini” ni Kiswahili cha kawaida na sahihi.
- source_word: עִשָּׂרוֹן
  choice: sehemu moja ya kumi ya efa
  rationale: Kihalisi ni “sehemu moja ya kumi,” lakini katika vipimo hivi vya ibada humaanisha sehemu moja ya kumi ya efa. Efa imetajwa wazi kwa ufafanuzi, huku tanbihi ikihifadhi umbo halisi la Kiebrania.
- source_word: בָּלוּל
  choice: iliyochanganywa
  rationale: Kivumishi-tendaji cha hali ya kutendwa kinaeleza unga uliochanganywa na mafuta.
- source_word: בִּרְבִעִית הַהִין
  choice: na sehemu moja ya nne ya hini
  rationale: Kirai hiki hutaja kiasi cha mafuta; “hini” imehifadhiwa kama kipimo cha kale cha utamaduni wa chanzo.
- source_word: שָׁמֶן
  choice: mafuta
  rationale: Ingawa huenda mafuta ya zeituni yalikusudiwa, Kiebrania kinasema tu “mafuta,” hivyo tafsiri haiongezi maelezo yasiyotajwa.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יְהוָה. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisheria umewekwa wazi bila kuwa mgumu; vipimo vya kale “efa” na “hini” vimehifadhiwa. Neno “pia” linaonyesha kuwa sadaka ya nafaka inaambatana na sadaka iliyotajwa, kama mfuatano wa Kiebrania unavyodokeza.
