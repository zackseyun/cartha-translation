  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֹלָ֣ה אוֹ זֶ֔בַח לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ בִ/נְדָבָ֔ה א֖וֹ בְּ/מֹעֲדֵי/כֶ֑ם לַ/עֲשׂ֞וֹת רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה מִן הַ/בָּקָ֖ר א֥וֹ מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/003.yaml
  text: and you present an offering by fire to Yahweh—either a burnt offering or a sacrifice—to fulfill a vow[a], or as a freewill offering, or at your appointed times, to make a pleasing aroma to Yahweh, from the herd or from the flock[b],
translation:
  language: sw
  text: nanyi mtamtolea Yahweh sadaka inayotolewa kwa moto[a]—iwe sadaka ya kuteketezwa kabisa au dhabihu—ili kutimiza nadhiri, au kama sadaka ya hiari, au katika nyakati zenu zilizowekwa[b], ili iwe harufu ya kupendeza kwa Yahweh, kutoka katika mifugo ya ng’ombe au mifugo ya kondoo na mbuzi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya moto.”
    reason: Neno la Kiebrania ni istilahi ya sadaka inayotolewa kwa moto na linaweza kutafsiriwa kwa ufupi kwa njia hii.
  - marker: b
    text: Au, “katika sikukuu zenu zilizowekwa.” Neno la Kiebrania linaweza kumaanisha nyakati zilizoteuliwa kwa jumla au hasa nyakati za sikukuu.
    reason: Huhifadhi upeo wa maana wa מוֹעֵד bila kuifanya ihusu sikukuu pekee.
lexical_decisions:
- source_word: וַעֲשִׂיתֶם אִשֶּׁה
  choice: mtamtolea ... sadaka inayotolewa kwa moto
  rationale: Katika muktadha wa ibada, kitenzi ‘kufanya’ kina maana ya kutoa sadaka; אִשֶּׁה ni neno la kiibada kwa sadaka inayotolewa kwa moto.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kuwa ‘Yahweh’; ‘kwa’ linaonyesha anayepokea sadaka.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa kabisa
  rationale: Neno hili humaanisha sadaka iliyoteketezwa yote; ‘kabisa’ huitofautisha na sadaka nyingine inayotolewa kwa moto.
- source_word: זֶבַח
  choice: dhabihu
  rationale: Ni neno la jumla kwa mnyama anayechinjwa kuwa sadaka, na hapa linatofautishwa na sadaka ya kuteketezwa kabisa.
- source_word: לְפַלֵּא נֶדֶר
  choice: ili kutimiza nadhiri
  rationale: Kirai hiki kinaonyesha kutekeleza ahadi ya kutoa sadaka iliyowekwa kwa nadhiri.
- source_word: בִנְדָבָה
  choice: kama sadaka ya hiari
  rationale: Hili ni neno la kiibada kwa sadaka inayotolewa kwa hiari, si kwa wajibu wa nadhiri.
- source_word: בְּמֹעֲדֵיכֶם
  choice: katika nyakati zenu zilizowekwa
  rationale: Tafsiri hii inadumisha upana wa מוֹעֵד, ambalo linaweza kumaanisha nyakati zilizoteuliwa kwa jumla au hasa sikukuu za ibada.
- source_word: לַעֲשׂוֹת רֵיחַ נִיחֹחַ
  choice: ili kumtolea Yahweh harufu inayompendeza
  rationale: Hii inahifadhi taswira ya kiibada ya harufu inayokubalika kwa Mungu kwa Kiswahili cha kawaida na chenye heshima.
- source_word: מִן הַבָּקָר א֥וֹ מִן הַצֹּאן
  choice: kutoka katika ng’ombe au kondoo na mbuzi
  rationale: הַבָּקָר ni mifugo ya jamii ya ng’ombe, na הַצֹּאן ni kundi la mifugo midogo linalojumuisha kondoo na mbuzi; kutaja wanyama hao wazi kunasa maana kwa wasomaji wa kawaida.
theological_decisions:
- issue: Tafsiri ya jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu יהוה moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Taswira ya kiibada רֵיחַ נִיחֹחַ
  choice: harufu inayompendeza
  alternative: harufu ya kupendeza; harufu ya kumtuliza
  rationale: Tafsiri hii huhifadhi lugha ya kimfano kuhusu kukubalika kwa sadaka bila kuongeza wazo kwamba harufu hiyo inatuliza hasira ya Mungu kwa njia ya kimitambo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Istilahi za sadaka zimefafanuliwa kwa lugha inayoeleweka, huku tofauti kati ya sadaka inayotolewa kwa moto, sadaka ya kuteketezwa kabisa, na dhabihu ikihifadhiwa.
