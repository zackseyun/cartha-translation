translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘unga uliokandwa’ umetumiwa badala ya ‘dough’ ya mkopo au ‘unga’ pekee ili kutofautisha donge lililokandwa na unga mkavu. Kitenzi ‘kuinua’ kimehifadhiwa ili kudumisha mwangwi wa kitenzi cha Kiebrania, huku tanbihi ikifafanua maana ya kiibada ya mchango.
