base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/020.yaml
  text: From the first of your dough you shall lift up a loaf as a contribution[a]; like the contribution of the threshing floor[b], so you shall lift it up.
translation:
  language: sw
  text: Kutoka katika sehemu ya kwanza ya unga wenu uliokandwa[a], mtainua mkate mmoja kama mchango[b]; kama mchango wa sakafu ya kupuria, ndivyo mtakavyouinua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ya kwanza ya donge lenu la unga.” Neno la Kiebrania linaweza kumaanisha unga uliokandwa au, kwa upanuzi wa maana, bakuli au chombo cha kukandia.
    reason: lexical_alternative
  - marker: b
    text: Kimapokeo, “sadaka ya kuinuliwa.” Neno la Kiebrania humaanisha mchango unaotengwa na kutolewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: sehemu ya kwanza
  rationale: Neno hili huonyesha mwanzo au fungu la kwanza; hapa linamaanisha sehemu inayotolewa kutoka katika unga wote.
- source_word: עֲרִסֹתֵיכֶם
  choice: unga wenu uliokandwa
  rationale: Katika muktadha huu nomino inaelekea kumaanisha unga uliokandwa, ingawa inaweza pia kutaja chombo cha kukandia kwa uhamisho wa maana. Tafsiri hii inaeleweka kwa urahisi na inaonyesha kitu ambacho mkate unatolewa kutoka kwake.
- source_word: חַלָּה
  choice: mkate mmoja
  rationale: Neno linataja mkate au donge la mkate lililotengwa. ‘Mkate’ ni neno la kawaida na halidokezi kitindamlo kitamu.
- source_word: תָּרִימוּ
  choice: mtainua
  rationale: Hifadhi maana ya msingi ya kitenzi ‘kuinua’ na uhusiano wake wa kimatamshi na mchango unaotengwa na kuwasilishwa.
- source_word: תְרוּמָה
  choice: mchango
  rationale: Linamaanisha fungu linalotengwa na kuwasilishwa kwa matumizi matakatifu; ‘mchango’ ni wazi na huepuka istilahi ya kale isiyoeleweka kwa urahisi.
- source_word: כִּתְרוּמַת גֹּרֶן
  choice: kama mchango wa uwanja wa kupuria
  rationale: Inadumisha ulinganisho na fungu lililotengwa katika eneo la kupuria nafaka bila kuongeza maelezo yasiyotajwa wazi.
- source_word: גֹּרֶן
  choice: uwanja wa kupuria
  rationale: Hili ni eneo la kilimo ambako nafaka hupuriwa na kutayarishwa; usemi huu ni wa kawaida katika Kiswahili.
- source_word: כֵּן
  choice: ndivyo
  rationale: Huleta hitimisho la ulinganisho kwa njia ya kawaida na fasaha katika Kiswahili.
- source_word: אֹתָהּ
  choice: -u- katika ‘mtakavyouinua’
  rationale: Kiwakilishi cha yambwa kinarejelea mkate, ambao katika Kiswahili uko katika ngeli ya m-/mi-.
