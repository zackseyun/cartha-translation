  yaml_path: translation/ot/numbers/015/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: sw
  text: 'Yahwe akanena na Musa[a], akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa kawaida hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Muundo huu wa simulizi unaendeleza tukio na kuanzisha hotuba ya Mungu. Katika Kiswahili sanifu, “akasema na” ni wa kawaida na wa asili kuliko tafsiri ngumu ya neno kwa neno, huku ukihifadhi tofauti na לֵאמֹר inayofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja kama “Yahwe” badala ya kubadilishwa kuwa cheo “BWANA,” ili kuhifadhi jina binafsi lililo katika Kiebrania.
- source_word: אֶל
  choice: na
  rationale: Pamoja na kitenzi cha Kiswahili “kusema,” kihusishi “na” humtambulisha kwa njia ya kawaida yule anayeambiwa; tafsiri ya kimuundo “kwa” ingesikika isiyo ya asili hapa.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ni umbo la kawaida la jina hili katika Kiswahili cha Afrika Mashariki.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi fomula ya Kiebrania inayotambulisha maneno yanayofuata na kuonyesha kwamba maudhui ya hotuba yanaanza katika mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi. “Yahwe” hulihifadhi kwa kulitohowa badala ya kulibadilisha kuwa cheo; “Yehova” ni umbo la kimapokeo lililotokana na mchanganyiko wa konsonanti na irabu za usomaji mbadala.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Fomula “akasema na Musa, akisema” imehifadhiwa kwa kuwa mstari huu ni utangulizi wa hotuba, ingawa marudio hayo si ya kawaida sana katika mazungumzo ya kila siku.
