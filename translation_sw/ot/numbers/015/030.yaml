language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶֽׁר תַּעֲשֶׂ֣ה בְּ/יָ֣ד רָמָ֗ה מִן הָֽ/אֶזְרָח֙ וּ/מִן הַ/גֵּ֔ר אֶת יְהוָ֖ה ה֣וּא מְגַדֵּ֑ף וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/030.yaml
  text: But the person who acts with a high hand[a], whether native-born or a sojourner, is reviling Yahweh, and that person shall be cut off from among his people.
translation:
  language: sw
  text: Lakini mtu atendaye kwa ukaidi wa wazi[a], awe mzawa au mgeni mkazi, anamkufuru Yahwe; naye mtu huyo atakatiliwa mbali kutoka miongoni mwa watu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa makusudi” au “kwa uasi”; kihalisi, “kwa mkono ulioinuliwa.”
    reason: Nahau ya Kiebrania huonyesha tendo la makusudi na la dharau ya wazi; tanbihi huhifadhi picha yake halisi na mbadala za tafsiri.
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: mtu
  rationale: Katika sheria hii, נֶפֶשׁ humaanisha mtu mzima, si ‘nafsi’ kama sehemu tofauti ya mwanadamu.
- source_word: תַּעֲשֶׂה
  choice: anayefanya jambo
  rationale: Kitenzi עשה ni kipana, yaani ‘kufanya’; neno ‘jambo’ linaweka usemi wa Kiswahili kuwa kamili bila kubainisha kosa ambalo Kiebrania hakilibainishi hapa.
- source_word: בְּיָד רָמָה
  choice: kwa ukaidi[a]
  rationale: Nahau hii, kihalisi ‘kwa mkono ulioinuliwa,’ huonyesha tendo la makusudi lenye uasi wa wazi. ‘Kwa ukaidi’ huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi picha halisi na uwezekano wa ‘kwa makusudi.’
- source_word: הָאֶזְרָח
  choice: mzawa
  rationale: Neno hili humaanisha mwenyeji aliyezaliwa katika jumuiya au nchi, likitofautishwa na גֵּר.
- source_word: הַגֵּר
  choice: mgeni anayeishi miongoni mwao
  rationale: גֵּר ni mtu asiye mzawa lakini anayeishi katika jumuiya; tafsiri hii huepuka maana pana mno ya ‘mgeni’ peke yake.
- source_word: אֶת־יְהוָה הוּא מְגַדֵּף
  choice: anamkufuru Yahwe
  rationale: גדף huonyesha kumtukana au kumdharau Mungu kwa uzito mkubwa; ‘kumkufuru’ linafaa katika muktadha huu wa kidini na kisheria.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limewasilishwa kwa umbo la kawaida la Kiswahili ‘Yahwe,’ badala ya kulibadilisha kuwa cheo.
- source_word: וְנִכְרְתָה
  choice: atakatiliwa mbali
  rationale: Huu ni usemi wa hukumu kali wa kisheria na kiagano. ‘Atakatiliwa mbali’ huhifadhi picha ya kukatwa bila kuamua kama ni kuuawa, kufukuzwa, au hukumu ya Mungu moja kwa moja.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: na watu wake
  rationale: Kirai hiki huonyesha kuondolewa kutoka ndani ya jumuiya ya mtu huyo; ‘na watu wake’ ni Kiswahili cha asili katika usemi ‘kukatiliwa mbali na.’
theological_decisions:
- issue: Aina ya kosa na adhabu
  choice: Tendo limeelezwa kuwa la ukaidi dhidi ya Yahwe, na mkosaji ‘atakatiliwa mbali’ bila kufafanua namna adhabu hiyo itakavyotekelezwa.
  alternative: Kulifanya kosa kuwa dhambi ya makusudi pekee, au kufasiri ‘kukatiliwa mbali’ moja kwa moja kuwa kuuawa au kufukuzwa katika jumuiya.
  rationale: Nahau בְּיָד רָמָה ina wazo la makusudi na uasi wa wazi, lakini mstari hauainishi kosa fulani. Vilevile, וְנִכְרְתָה ni tamko zito lisilofafanua hapa kama adhabu ni kifo, kufukuzwa, au hukumu ya Mungu; tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa mara mbili kwa uwazi; ‘awe ... au ...’ huwasilisha wigo sawa wa sheria kwa mzawa na mgeni mkazi.
