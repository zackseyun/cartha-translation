translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Kiunganishi “Nao” kinaendeleza simulizi, na “kusanyiko lote” huhifadhi upeo wa כָּל הָעֵדָה.
