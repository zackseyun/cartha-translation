  text: And those who found him gathering wood brought him to Moses and Aaron and to all the congregation[a].
translation:
  language: sw
  text: Nao wale waliomkuta akikusanya kuni wakamleta kwa Musa, kwa Haruni, na kwa kusanyiko lote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akikusanya vijiti.” Neno la Kiebrania עֵצִים linaweza kumaanisha kuni kwa ujumla au vipande vya kuni, kama vile vijiti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ אֹתוֹ
  choice: wakamleta
  rationale: Hifili ya קרב hapa ina maana ya kumleta mtu mbele ya wenye mamlaka. “Wakamleta” ni Kiswahili cha kawaida na huwasilisha tendo hilo bila usemi usio wa asili wa “kumleta karibu.”
- source_word: הַמֹּצְאִים אֹתוֹ
  choice: wale waliomkuta
  rationale: Kitenzi kishirikishi chenye kibainishi kinataja watu waliomgundua; “wale waliomkuta” ni sahihi na ya kawaida katika simulizi.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: akikusanya kuni
  rationale: מְקֹשֵׁשׁ huonyesha tendo lililokuwa likiendelea alipokutwa, na עֵצִים hapa inaweza kutaja kuni au vipande vya miti. “Kuni” ni neno la kawaida la Kiswahili kwa miti inayokusanywa kwa matumizi ya moto.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן וְאֶל כָּל הָעֵדָה
  choice: kwa Musa, kwa Haruni, na kwa kusanyiko lote
  rationale: Kurudia “kwa” kunawakilisha urudiaji wa אֶל na uzito wake wa kimuundo, huku sentensi ikibaki ya asili katika Kiswahili.
- source_word: עֵדָה
  choice: kusanyiko
  rationale: Katika muktadha huu wa Pentateuko, neno hili linamaanisha jumuiya ya Israeli iliyokusanyika; “kusanyiko” huhifadhi wazo la mkutano mzima kwa lugha inayoeleweka.
