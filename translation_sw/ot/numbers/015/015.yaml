base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/015.yaml
  text: For the assembly[a], there shall be one statute for you and for the sojourner who sojourns with you, a permanent statute throughout your generations. As you are[b], so shall the sojourner be before Yahweh.
translation:
  language: sw
  text: Kwa kusanyiko, kutakuwa na sheria moja kwa ajili yenu na kwa ajili ya mgeni anayeishi kati yenu—sheria ya kudumu katika vizazi vyenu vyote. Kama mlivyo ninyi, ndivyo atakavyokuwa mgeni mbele za Yahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקָּהָל
  choice: kusanyiko
  rationale: Neno hili linamaanisha jumuiya iliyokusanyika; “kusanyiko” ni la kawaida na halina maana finyu ya kidhehebu.
- source_word: חֻקָּה אַחַת
  choice: sheria moja
  rationale: “Sheria” huwasilisha agizo lenye nguvu ya kisheria, huku “moja” ikihifadhi msisitizo wa usawa.
- source_word: לָכֶם וְלַגֵּר הַגָּר
  choice: kwa ajili yenu na kwa ajili ya mgeni anayeishi kati yenu
  rationale: גֵּר hapa ni mtu asiye mzawa lakini anayeishi miongoni mwa Israeli; kishazi cha kitenzi huhifadhi hali yake ya ukaaji bila kumfanya kuwa mpita-njia tu.
- source_word: חֻקַּת עוֹלָם
  choice: sheria ya kudumu
  rationale: Katika kauli za kisheria, עוֹלָם huonyesha mwendelezo usiokoma katika vizazi; “ya kudumu” ni wazi bila kulazimisha mjadala wa kifalsafa kuhusu umilele.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Huhifadhi wazo la kutumika kwa sheria hiyo katika mfululizo wa vizazi.
- source_word: כָּכֶם כַּגֵּר יִהְיֶה
  choice: Kama mlivyo ninyi, ndivyo atakavyokuwa mgeni
  rationale: Muundo wenye ulinganisho maradufu unasisitiza usawa kati ya Waisraeli na mgeni katika jambo hili.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Kauli hii ya kawaida ya Kiswahili huhifadhi maana ya kuwa mbele au katika uwepo wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Hali ya kisheria ya mgeni mkazi katika masharti ya ibada ya Israeli
  choice: Mgeni anayeishi kati yao na kusanyiko wana sheria ileile mbele za Yahwe katika jambo linalozungumziwa.
  alternative: Kauli hii inaweza kueleweka kwa upeo mwembamba kuwa inahusu tu masharti maalumu ya dhabihu katika muktadha wa karibu.
  rationale: Tafsiri inahifadhi msisitizo wa usawa lakini haipanui madai hayo zaidi ya jambo la kisheria katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mgeni anayeishi kati yenu” ni wazi zaidi kuliko “mgeni” peke yake, ambalo linaweza kumaanisha pia mtu wa ziara. Hakuna tanbihi iliyoongezwa kwa sababu tofauti muhimu za kileksika zimewasilishwa moja kwa moja katika matini bila kuhitaji alama.
