base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/013.yaml
  text: Every native-born person shall do these things in this way[a], to present a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: sw
  text: Kila mzawa[a] atafanya mambo haya kwa njia hii, ili kumtolea Yahweh sadaka itolewayo kwa moto[b], yenye harufu ya kupendeza kwa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kimetumia umbo la umoja wa kiume lenye maana ya uwakilishi katika agizo hili la kisheria.
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka ya moto” au “sadaka kwa moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָאֶזְרָח
  choice: Kila mzawa
  rationale: כָּל ina maana ya mgawanyo mbele ya nomino ya umoja, yaani kila mtu mmoja mmoja; הָאֶזְרָח humaanisha mtu wa jamii hiyo kwa kuzaliwa, tofauti na mgeni anayeishi kati yao katika muktadha unaofuata.
- source_word: יַעֲשֶׂה
  choice: atafanya
  rationale: Kauli ya wakati usiotimilika hapa ina nguvu ya agizo katika sheria; wakati ujao wa Kiswahili unaweza kutumika kwa kawaida kueleza wajibu wa kisheria.
- source_word: כָּכָה אֶת אֵלֶּה
  choice: mambo haya kwa njia hii
  rationale: Tafsiri hii inaonyesha kwamba matendo au masharti yaliyotajwa kabla yanapaswa kufuatwa kwa namna iliyoagizwa.
- source_word: לְהַקְרִיב
  choice: ili kutoa
  rationale: Katika muktadha wa dhabihu, kitenzi hiki humaanisha kuleta au kutoa sadaka; ‘ili kutoa’ huonyesha kusudi la matendo yaliyotangulia.
- source_word: אִשֵּׁה
  choice: sadaka itolewayo kwa moto
  rationale: Ni istilahi ya dhabihu inayohusu sadaka inayotolewa kwa njia ya moto. Tafsiri hii haidai kwamba sadaka yote iliteketezwa.
- source_word: רֵיחַ נִיחֹחַ
  choice: yenye harufu ya kumpendeza
  rationale: Ni msemo wa kawaida wa dhabihu unaoonyesha sadaka inayokubalika na inayompendeza Mungu.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa kama jina binafsi ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni; ‘Yahweh’ hulihifadhi kama jina la agano.
- issue: Umoja wa kiume wenye maana ya uwakilishi katika הָאֶזְרָח
  choice: Kila mzawa
  alternative: Kila mwanamume mzawa
  rationale: Umbo la Kiebrania ni la umoja wa kisarufi na lina nguvu ya uwakilishi katika agizo la kisheria, si lazima limaanishe wanaume pekee. ‘Mzawa’ ni la kawaida na lisilobainisha jinsia katika Kiswahili.
- issue: Maana ya אִשֵּׁה
  choice: sadaka itolewayo kwa moto
  alternative: sadaka ya chakula; sadaka ya kuteketezwa
  rationale: Istilahi hii ina uhusiano wa wazi na moto, lakini si lazima iwe sadaka ya kuteketezwa yote. Tafsiri iliyochaguliwa huhifadhi upeo huo bila kuibana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko ya kisheria lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ‘atafanya’ umehifadhi sauti ya agizo, na ‘sadaka itolewayo kwa moto’ huepuka kuichanganya istilahi hii na sadaka ya kuteketezwa yote.
