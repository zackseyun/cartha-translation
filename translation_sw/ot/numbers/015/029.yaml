  text: The same law shall apply to the native-born Israelite and to the resident foreigner[a] living among you when either acts unintentionally.
translation:
  language: sw
  text: Mtakuwa na sheria moja kwa Mwisraeli mzawa na kwa mgeni mkazi[a] aishiye miongoni mwao, mmoja wao anapotenda bila kukusudia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mgeni mkazi” ni mtu asiye mzawa anayeishi ndani ya jamii ya Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֶזְרָח בִּבְנֵי יִשְׂרָאֵל
  choice: Mwisraeli mzawa
  rationale: Kirai hiki kinamtaja mtu aliyezaliwa akiwa mwanajamii wa Israeli; tafsiri hii ni fupi na ya kawaida katika Kiswahili.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: na mgeni mkazi anayeishi miongoni mwenu
  rationale: גֵּר hapa ni mtu asiye mzawa lakini aliyeweka makao ndani ya jamii, si msafiri anayepita. Nafsi ya pili katika 'miongoni mwenu' inadumisha usemi wa moja kwa moja kwa jamii.
- source_word: תּוֹרָה אַחַת
  choice: Sheria ileile
  rationale: Katika muktadha huu wa kisheria, kirai kinasisitiza kuwa kanuni moja inatumika kwa makundi yote mawili. 'Ileile' huonyesha wazi usawa huo.
- source_word: יִהְיֶה לָכֶם
  choice: itawahusu
  rationale: Hii ni njia ya asili ya Kiswahili kueleza kwamba sheria inatumika kwa watu wanaotajwa, bila kupoteza maana ya kisheria.
- source_word: לָעֹשֶׂה בִּשְׁגָגָה
  choice: wakati yeyote kati yao anapotenda bila kukusudia
  rationale: Kishiriki cha umoja kina maana ya jumla na kinamhusu mtu wa kundi lolote kati ya hayo mawili. 'Bila kukusudia' huwasilisha tendo la kimakosa au lisilofanywa kwa makusudi.
theological_decisions:
- issue: Upeo wa usawa wa kisheria kati ya Mwisraeli mzawa na mgeni mkazi kuhusu tendo lisilokusudiwa
  choice: Sheria ileile inatumika kwa makundi yote mawili wakati mtu anapotenda bila kukusudia.
  alternative: Kutafsiri תּוֹרָה אַחַת kwa ujumla zaidi kama 'fundisho moja' au 'utaratibu mmoja.'
  rationale: Muktadha wa karibu ni wa masharti ya kisheria kuhusu matendo yasiyokusudiwa. Tafsiri inadumisha usawa uliotamkwa bila kuupanua kuwa dai la jumla lisiloelezwa katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umepangwa kwa mtiririko wa kawaida wa Kiswahili huku ukihifadhi msisitizo wa sheria moja kwa makundi yote mawili.
