    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sema na
  rationale: Kauli ya amri ya Piel hutambulisha maagizo ya Mungu ambayo Musa anapaswa kuyafikisha; “sema na” ni ya kawaida na inahifadhi mtindo wa amri.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi usemi wa kifamilia wa Kiebrania, ambao kihalisi ni “wana wa Israeli,” bila kuufanya moja kwa moja kuwa “Waisraeli.”
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: na uwaambie
  rationale: Huu ni mfuatano wa kawaida wa amri; “uwaambie” ni Kiswahili cha asili na huweka wazi wale wanaoambiwa.
- source_word: כִּי
  choice: Mtakapo-
  rationale: Hapa neno hili linaanzisha hali inayotarajiwa ya kuingia nchini; muundo wa “mtakapo-” unaonyesha wakati wa baadaye unaotarajiwa, si sababu.
- source_word: תָבֹאוּ
  choice: ingia
  rationale: Kitenzi kinaweza kumaanisha kuja au kuingia; “kuingia katika nchi” ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: אֶרֶץ
  choice: nchi
  rationale: “Nchi” ni neno la kawaida na lenye uzito unaofaa kwa eneo ambalo Mungu anawapa watu wake.
- source_word: מוֹשְׁבֹתֵיכֶם
  choice: makao yenu
  rationale: Huhifadhi wazo la mahali pa kukaa au makazi na pia ukaribu wa muundo usio wa kawaida wa Kiebrania, “nchi ya makao yenu.”
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: ambayo ninawapa
  rationale: “Ninawapa” huhifadhi hali ya tendo linaloendelea au lililo karibu ya participle ya Kiebrania bila kulibadili kuwa wakati ujao tu.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Kiebrania kina usemi wa kifamilia na wa kiume kwa umbo. Tafsiri kuu inahifadhi umbo hilo huku tanbihi ikionyesha njia nyingine za kueleza jumuiya nzima ya Israeli.
- issue: Hali ya zawadi ya Mungu katika נֹתֵן
  choice: ambayo ninawapa
  alternative: ambayo nawapa; ambayo nitawapa
  rationale: Wakati wa sasa unaoendelea huhifadhi ukaribu na uhakika wa tendo la Mungu bila kuongeza maana mahsusi ya wakati ujao ambayo participle yenyewe hailazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa amri umehifadhiwa bila kutumia lugha ya kizamani; usemi “nchi ya makao yenu” umeachwa kwa ukaribu na Kiebrania, huku tanbihi zikitoa miundo ya kawaida zaidi.
