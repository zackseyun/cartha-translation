base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/032.yaml
  text: While the sons of Israel were in the wilderness[a], they found a man gathering wood on the Sabbath day.
translation:
  language: sw
  text: Wana wa Israeli walipokuwa jangwani, walimkuta mtu akikusanya kuni[a] siku ya Sabato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: vijiti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walipokuwa
  rationale: Hapa kitenzi kinaweka mazingira ya simulizi; “walipokuwa” kinaunganisha hali hiyo kwa kawaida na tendo linalofuata.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi kwa karibu muundo wa Kiebrania huku likiwa tamko linaloeleweka na lenye hadhi katika Kiswahili cha kibiblia.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: “Jangwani” ni tafsiri ya kawaida ya eneo lisilokaliwa ambamo Israeli walikuwa wakisafiri, bila kulazimisha picha ya jangwa la mchanga pekee.
- source_word: וַיִּמְצְאוּ
  choice: walimkuta
  rationale: Katika muktadha huu wa simulizi, “walimkuta” huonyesha kwamba walimwona mtu akiwa katika tendo hilo.
- source_word: אִישׁ
  choice: mtu
  rationale: Kiswahili “mtu” ni njia ya kawaida ya kumrejelea mwanamume asiyeainishwa katika simulizi; muktadha unaendelea kumtaja kama mtu mmoja.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: akikusanya kuni
  rationale: Hueleza tendo la kukusanya vipande vya miti kwa Kiswahili cha kawaida; “vijiti” pia ni uwezekano halali wa kileksika na umehifadhiwa katika tanbihi.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: siku ya Sabato
  rationale: Huhifadhi wazi neno יוֹם, “siku,” pamoja na istilahi ya Sabato.
theological_decisions:
- issue: Jina la watu wa agano בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  alternative: Waisraeli
  rationale: Chaguo hili huhifadhi umbo la usemi wa Kiebrania bila kuongeza maelezo ya kimafundisho; “Waisraeli” ni la kawaida zaidi lakini halionyeshi muundo wa chanzo kwa ukaribu sawa.
- issue: Istilahi ya Sabato
  choice: siku ya Sabato
  alternative: Sabato
  rationale: Tafsiri inahifadhi rejeo kamili la wakati lililo katika chanzo bila kuongeza ufafanuzi kuhusu sheria ya Sabato.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa mtiririko wa kawaida wa simulizi, huku “Wana wa Israeli” na “siku ya Sabato” zikihifadhi kwa karibu maumbo muhimu ya chanzo.
