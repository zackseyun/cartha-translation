base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/025.yaml
  text: The banner of the camp of Dan shall be on the north by their divisions[a]; and the leader of the sons of Dan shall be Ahiezer son of Ammishaddai.
translation:
  language: sw
  text: Bendera ya kambi ya Dani itakuwa upande wa kaskazini, kwa vikosi vyao[a]; na kiongozi wa wana wa Dani atakuwa Ahiezeri mwana wa Amishadai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kulingana na makundi yao” au “kwa majeshi yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: bendera
  rationale: Katika mpangilio wa kambi, neno hili linamaanisha alama au bendera ya kikabila ambayo makundi yalipangwa chini yake; “bendera” ni neno la kawaida na wazi.
- source_word: מַחֲנֵה
  choice: kambi
  rationale: Ni tafsiri ya kawaida na ya asili kwa makao yaliyopangwa ya kabila katika Hesabu 2.
- source_word: צָפֹנָה
  choice: upande wa kaskazini
  rationale: Umbo la mwelekeo hapa linaonyesha mahali kambi ilipowekwa katika mpangilio unaozunguka Maskani.
- source_word: לְצִבְאֹתָם
  choice: kwa vikosi vyao
  rationale: צָבָא hapa hurejelea makundi yaliyopangwa kwa utaratibu wa kijeshi; “vikosi” huhifadhi maana hiyo kwa Kiswahili cha sasa.
- source_word: וְנָשִׂיא
  choice: na kiongozi
  rationale: נָשִׂיא humaanisha mkuu anayetambuliwa wa kabila; “kiongozi” huepuka dhana ya kifalme ambayo “mwana-mfalme” ingeweza kuleta.
- source_word: לִבְנֵי דָן
  choice: wa wana wa Dani
  rationale: Huhifadhi kwa karibu jina rasmi la kikabila lenye umbo la kiume katika Kiebrania.
- source_word: אֲחִיעֶזֶר
  choice: Ahiezeri
  rationale: Jina limenukuliwa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בֶּן עַמִּישַׁדָּי
  choice: mwana wa Amishadai
  rationale: Muundo wa nasaba umetafsiriwa moja kwa moja, huku jina likinukuliwa kwa umbo la Kiswahili.
theological_decisions:
- issue: Jina la kikabila lenye jinsia בְנֵי
  choice: wana wa Dani
  alternative: watu wa Dani / wazao wa Dani
  rationale: “Wana wa Dani” huhifadhi umbo rasmi la Kiebrania bila kulipanua kimafafanuzi, ingawa katika muktadha linaweza kulihusu kabila lote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Sentensi imehifadhi muundo wa tangazo la mpangilio wa kambi huku ikitumia msamiati wa kawaida wa kisasa.
