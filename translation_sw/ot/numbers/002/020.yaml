base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/020.yaml
  text: And next to him was the tribe of Manasseh[a], and the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: sw
  text: Kando yake kulikuwa na kabila la Manase,[a] na kiongozi wa wana wa Manase alikuwa Gamalieli mwana wa Pedahsuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Pembeni yake kulikuwa na kabila la Manase.” Kirai cha Kiebrania kinaonyesha nafasi ya karibu katika mpangilio wa kambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָיו
  choice: Kando yake kulikuwa na
  rationale: Katika muktadha wa mpangilio wa kambi, עַל pamoja na kiambishi cha nafsi inaonyesha mahali pa karibu, si mamlaka juu ya mtu. Kauli hii ni ya asili katika Kiswahili na inaeleza ujirani wa makabila kambini.
- source_word: מַטֵּה
  choice: kabila
  rationale: Katika muktadha wa sensa na mpangilio wa kambi, מַטֶּה ni kundi la kikabila, si fimbo halisi.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Jina la mtu na kabila limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: וְנָשִׂיא
  choice: na kiongozi
  rationale: נָשִׂיא hapa ni mkuu aliyewekwa kuongoza kabila. “Kiongozi” ni neno la sasa, wazi, na halileti dhana isiyokusudiwa ya mwana wa mfalme.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: wa wana wa Manase
  rationale: Tafsiri hii inadumisha neno בני, “wana,” pamoja na uhusiano wake na kiongozi wa kundi hilo la ukoo.
- source_word: גַּמְלִיאֵל
  choice: Gamalieli
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa kutaja nasaba ya baba.
- source_word: פְּדָהצוּר
  choice: Pedasuri
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
