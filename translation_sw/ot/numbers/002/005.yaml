  yaml_path: translation/ot/numbers/002/005.yaml
  text: Those camping next to it are the tribe of Issachar[a], and the leader of the sons of Issachar is Nethanel son of Zuar.
translation:
  language: sw
  text: Nao waliopiga kambi kando yake ni kabila la Isakari, na kiongozi wa wana wa Isakari[a] ni Nethaneli mwana wa Suari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Isakari.” Usemi huu ni jina la kawaida la kabila na unamaanisha wazao au watu wa kabila la Isakari, si wanaume peke yao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: waliopiga kambi
  rationale: Kivumishi-tendo hiki kinatumika kama nomino kuonyesha kundi lililowekwa kambini; usemi huu ni wa kawaida na unaonyesha hali yao ya kupiga kambi.
- source_word: עָלָיו
  choice: kando yake
  rationale: Katika muktadha wa mpangilio wa kambi, neno hili linaonyesha ukaribu wa mahali na kundi lililotajwa kabla, si kuwa juu yake.
- source_word: מַטֵּה
  choice: kabila la
  rationale: Hapa neno hili linamaanisha kabila katika mpangilio wa kambi, wala si fimbo.
- source_word: יִשָּׂשכָר
  choice: Isakari
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Neno hili humaanisha mkuu anayetambuliwa wa kabila; 'kiongozi' ni wazi na halileti dhana ya lazima ya ufalme.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: wa wana wa Isakari
  rationale: Uamuzi huu unahifadhi usemi wa Kiebrania wa ukoo na kutaja kundi ambalo kiongozi huyo analiwakilisha.
- source_word: נְתַנְאֵל
  choice: Nethaneli
  rationale: Jina limetoholewa kwa mfumo unaofaa matamshi ya Kiswahili huku likibaki karibu na umbo la Kiebrania.
- source_word: בֶּן צוּעָר
  choice: mwana wa Suari
  rationale: Huu ni muundo wa kawaida wa Kiebrania wa kutaja ukoo wa baba, unaotafsiriwa kwa kawaida katika Kiswahili.
