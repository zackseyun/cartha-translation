base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/010.yaml
  text: The banner of the camp of Reuben shall be on the south[a], by their divisions[b]; and the leader of the sons of Reuben shall be Elizur son of Shedeur.
translation:
  language: sw
  text: Bendera[a] ya kambi ya Reubeni itakuwa upande wa kusini, kulingana na vikosi vyao[b]. Kiongozi wa wana wa Reubeni atakuwa Elisuri mwana wa Shedeuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bendera ya kijeshi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kulingana na majeshi yao”; neno la Kiebrania lina maana ya vikundi vya kijeshi vilivyopangwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: bendera
  rationale: Neno hili linamaanisha bendera au alama inayotambulisha mpangilio wa kabila katika kambi; “bendera” ni Kiswahili cha kawaida na wazi.
- source_word: מַחֲנֵה
  choice: kambi
  rationale: Linataja eneo na mpangilio wa watu waliopiga kambi; “kambi” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: רְאוּבֵן
  choice: Reubeni
  rationale: Tahajia hii inafuata matumizi yaliyozoeleka ya jina hili katika Biblia za Kiswahili.
- source_word: תֵּימָנָה
  choice: upande wa kusini
  rationale: Umbo la Kiebrania linaonyesha mahali au mwelekeo wa kusini; kifungu hiki kinaeleza wazi upande wa kambi.
- source_word: לְצִבְאֹתָם
  choice: kwa vikosi vyao
  rationale: צָבָא lina maana ya jeshi au kundi lililopangwa. “Vikosi” huhifadhi dhana ya mpangilio wa kijeshi bila kufanya sentensi kuwa nzito.
- source_word: וְנָשִׂיא
  choice: Kiongozi
  rationale: Katika muktadha huu נָשִׂיא ni mkuu aliyewekwa kuongoza kabila; “kiongozi” ni wazi, ya sasa, na haidokezi ufalme.
- source_word: לִבְנֵי רְאוּבֵן
  choice: wa wana wa Reubeni
  rationale: Tafsiri hii inadumisha usemi wa Kiebrania unaolitaja kabila kwa uhusiano wa ukoo.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Elisuri mwana wa Shedeuri
  rationale: Majina yametoholewa kwa tahajia inayofaa Kiswahili, na “mwana wa” linaakisi moja kwa moja uhusiano wa ukoo katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. Kitenzi “itakuwa” kimeongezwa kwa ulaini wa Kiswahili kwa kuwa kishazi cha Kiebrania hakina kitenzi kilichoandikwa. Mgawanyo kuwa sentensi mbili unafanya orodha ya mpangilio wa kambi isomeke kwa kawaida bila kubadili uhusiano wa mawazo.
