  text: All those counted for the camp of Ephraim were 108,100 by their divisions[b][a]. They shall set out third.
translation:
  language: sw
  text: Jumla ya waliohesabiwa wa kambi ya Efraimu ilikuwa 108,100 kwa vikosi vyao[a]. Wataondoka katika nafasi ya tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa majeshi yao” au “kulingana na makundi yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Jumla ya wote waliohesabiwa
  rationale: Katika muhtasari huu wa sensa, kifungu hiki kinataja jumla ya walioandikishwa; tafsiri hii ni ya kawaida na haiongezi neno ‘wanaume,’ ambalo halipo wazi katika mstari wenyewe.
- source_word: לְמַחֲנֵה אֶפְרַיִם
  choice: katika kambi ya Efraimu
  rationale: Kihusishi kinaonyesha uhusiano wa waliohesabiwa na kundi la kambi ya Efraimu; Kiswahili hiki ni wazi na cha kawaida katika muktadha.
- source_word: מְאַת אֶלֶף וּשְׁמֹנַת אֲלָפִים וּמֵאָה
  choice: 108,100
  rationale: Tarakimu zinawasilisha kwa usahihi jumla ya mia moja na nane elfu na mia moja kwa namna rahisi kusoma.
- source_word: לְצִבְאֹתָם
  choice: kwa vikosi vyao
  rationale: צָבָא hapa inaashiria makundi yaliyopangwa kwa kusudi la kijeshi; ‘vikosi’ huhifadhi wazo hilo kwa Kiswahili cha sasa bila kutumia istilahi nzito.
- source_word: וּשְׁלִשִׁים יִסָּעוּ
  choice: Wataondoka wakiwa wa tatu
  rationale: Kifungu kinaonyesha nafasi ya tatu katika mpangilio wa kuondoka kwa kambi; ‘wataondoka’ hufaa kwa נסע katika muktadha wa kuvunja kambi na kuanza safari.
