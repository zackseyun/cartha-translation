translation:
  language: sw
  text: 'na jeshi lake[a], yaani wale waliohesabiwa miongoni mwao: elfu hamsini na tatu na mia nne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kikosi chake”; neno la Kiebrania linaweza kumaanisha jeshi au kundi la kabila lililopangwa kwa utaratibu wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: na jeshi lake
  rationale: צָבָא humaanisha jeshi au kundi lililopangwa kwa utaratibu wa kijeshi. Katika muktadha wa mpangilio wa kambi na sensa katika Hesabu 2, “jeshi lake” ni usemi wa kawaida na wenye heshima unaodumisha maana ya kikosi cha kabila kilichopangwa.
- source_word: וּפְקֻדֵיהֶם
  choice: yaani wale waliohesabiwa miongoni mwao
  rationale: Neno hili limetokana na פקד katika maana ya sensa, likirejelea walioandikishwa au kuhesabiwa. “Miongoni mwao” hudumisha kiambishi cha wingi bila kuongeza neno “wanaume,” ambalo halipo wazi katika kishazi hiki.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: elfu hamsini na tatu na mia nne
  rationale: Hii ni jumla ya 53,400, iliyowasilishwa kwa mpangilio wa kawaida wa namba katika Kiswahili cha kisasa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “yaani” unaonyesha kuwa kishazi kinachofuata kinafafanua idadi ya jeshi bila kutatua kupita kiasi uhusiano wa kisarufi wa Kiebrania.
