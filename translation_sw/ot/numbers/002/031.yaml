  text: All those counted for the camp of Dan were 157,600[a]. They shall set out last by their standards.
translation:
  language: sw
  text: Jumla ya waliohesabiwa katika kambi ya Dani ilikuwa 157,600. Wataondoka mwisho kwa bendera zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa makundi yao ya bendera.” Neno la Kiebrania linaweza kurejelea bendera za makabila au makundi ya kambi yaliyopangwa kwa bendera hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Jumla ya waliohesabiwa
  rationale: Muundo huu unaonyesha idadi yote ya watu waliosajiliwa na kuhesabiwa katika sensa, kwa Kiswahili cha kawaida na bila kuongeza neno ‘wanaume’ ambalo halijarudiwa wazi katika mstari huu.
- source_word: לְמַחֲנֵה דָן
  choice: katika kambi ya Dani
  rationale: Kihusishi kinaonyesha uhusiano wa waliohesabiwa na kundi la kambi ya Dani; ‘katika kambi ya Dani’ ni wazi na ya asili katika muktadha huu.
- source_word: מְאַת אֶלֶף וְשִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 157,600
  rationale: Tarakimu huhifadhi idadi kamili na kurahisisha usomaji wa jumla hii ya sensa.
- source_word: לָאַחֲרֹנָה
  choice: mwisho
  rationale: Neno hili linaonyesha nafasi ya mwisho katika mpangilio wa kuondoka.
- source_word: יִסְעוּ
  choice: Wataondoka
  rationale: Katika simulizi la safari jangwani, kitenzi hiki humaanisha kuanza safari au kuondoka kambini; ‘wataondoka’ ni cha asili na kinafaa hapa.
- source_word: לְדִגְלֵיהֶם
  choice: chini ya bendera zao
  rationale: דגל inarejelea bendera za utambulisho na pia makundi ya kambi yaliyopangwa chini yake. Tafsiri hii huhifadhi taswira ya bendera bila kuifanya kuwa kanuni au kiwango.
