- source_word: וּצְבָאוֹ
  choice: Na kikosi chake
  rationale: Katika muktadha wa sensa na mpangilio wa kambi, צָבָא humaanisha kikosi kilichopangwa cha kabila; “kikosi” ni Kiswahili cha sasa kinachohifadhi maana ya kijeshi bila kudokeza jeshi zima.
- source_word: וּפְקֻדֵיהֶם
  choice: wale waliohesabiwa miongoni mwao
  rationale: Neno hili limetokana na פקד katika maana ya sensa, yaani watu walioandikishwa au kuhesabiwa kwa ajili ya huduma. “Miongoni mwao” hudumisha kiambishi cha wingi kinachorejelea watu wa kabila au kikosi bila kuongeza wazi neno “wanaume,” ambalo halipo katika kishazi hiki.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: elfu arobaini na mia tano
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya idadi 40,500 katika Kiswahili sanifu.
