base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
translation:
  language: sw
  text: Bendera ya kambi ya Efraimu, kwa vikosi vyake, itakuwa upande wa magharibi; na kiongozi wa wana wa Efraimu atakuwa Elishama mwana wa Amihudi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל
  choice: bendera
  rationale: Katika mpangilio wa kambi, neno hili linamaanisha alama ya utambulisho ya kikabila au kijeshi; “bendera” ni Kiswahili cha sasa na kinachoeleweka kwa urahisi.
- source_word: מַחֲנֵה
  choice: kambi
  rationale: Neno hili linataja kambi au kundi lililopangwa la kabila; “kambi” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: לְצִבְאֹתָם
  choice: kwa vikosi vyao
  rationale: צָבָא hapa hubeba maana ya makundi yaliyopangwa kwa utaratibu wa kijeshi. “Kwa vikosi vyao” inadumisha maana hiyo bila kudokeza kwamba mapigano yanaendelea.
- source_word: יָמָּה
  choice: upande wa magharibi
  rationale: Kielezi hiki kwa msingi humaanisha kuelekea baharini, yaani magharibi katika mwelekeo wa Kiisraeli; katika mpangilio wa kambi, “upande wa magharibi” ni ya asili.
- source_word: וְנָשִׂיא
  choice: na kiongozi
  rationale: נָשִׂיא humaanisha mkuu au kiongozi wa kabila. “Kiongozi” huwasilisha wajibu wake bila kuleta maana ya kifalme.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: wa wana wa Efraimu
  rationale: Tafsiri hii inadumisha lugha ya ukoo ya Kiebrania na hapa inalitaja kabila la wazao wa Efraimu.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Elishama mwana wa Amihudi
  rationale: Majina yamenukuliwa kwa tahajia inayofaa Kiswahili, na בֶּן limetafsiriwa moja kwa moja kuwa “mwana wa”.
