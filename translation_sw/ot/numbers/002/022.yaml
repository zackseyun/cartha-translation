  language: sw
  text: 'Na kabila la Benyamini: kiongozi wa wana wa Benyamini[a] alikuwa Abidani mwana wa Gideoni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiongozi kwa ajili ya wana wa Benyamini.” Kihusishi cha Kiebrania hapa kinaweza kutafsiriwa kwa njia zaidi ya moja zinazokaribiana.
