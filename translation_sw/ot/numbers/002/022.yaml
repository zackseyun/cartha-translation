lexical_decisions:
- source_word: מַטֵּה
  choice: kabila
  rationale: Katika muktadha wa upangaji wa kambi katika Hesabu, neno hili linamaanisha kundi la kikabila, si fimbo halisi.
- source_word: בִּנְיָמִן
  choice: Benyamini
  rationale: Jina la mtu na la kabila limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Neno hili humaanisha mkuu anayetambuliwa wa kabila; ‘kiongozi’ ni la sasa na wazi bila kudokeza lazima cheo cha kifalme.
- source_word: לִבְנֵי בִנְיָמִן
  choice: wa wana wa Benyamini
  rationale: Huhifadhi lugha ya ukoo ya Kiebrania na kuonyesha uhusiano wa kiongozi na wazao au watu wa Benyamini.
- source_word: אֲבִידָן
  choice: Abidani
  rationale: Jina limetoholewa kwa kufuata matumizi yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: בֶּן גִּדְעֹנִי
  choice: mwana wa Gideoni
  rationale: Hii ni kauli ya kawaida ya Kiebrania inayotaja baba wa mtu, na imetafsiriwa moja kwa moja.
