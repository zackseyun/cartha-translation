  yaml_path: translation/ot/numbers/002/003.yaml
  text: Those who camp on the east side, toward the sunrise, shall be the banner of the camp of Judah by their divisions; and the leader of the sons of Judah shall be Nahshon son of Amminadab.
translation:
  language: sw
  text: Watakaopiga kambi upande wa mashariki, kuelekea maawio ya jua, ni wa bendera ya kambi ya Yuda, kwa vikosi vyao. Kiongozi wa wana wa Yuda ni Nahshoni mwana wa Aminadabu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל (degel)
  choice: bendera
  rationale: Neno hili humaanisha alama au bendera inayotambulisha kundi la kambi; “bendera” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: לְצִבְאֹתָם (letsiv'otam)
  choice: kwa vikosi vyao
  rationale: Katika muktadha wa mpangilio wa kambi, צבא inarejelea makundi yaliyopangwa kwa utaratibu; “vikosi” huhifadhi maana hiyo bila kudai kwamba hapa ni jeshi linalopigana.
- source_word: נָשִׂיא (nasi)
  choice: kiongozi
  rationale: Neno hilo humtaja mkuu au mwakilishi wa kabila; “kiongozi” ni la asili, lenye heshima, na haliongezi cheo kisichotajwa wazi.
- source_word: קֵדְמָה מִזְרָחָה (qedmah mizrachah)
  choice: upande wa mashariki, kuelekea maawio ya jua
  rationale: Tafsiri hii inahifadhi maneno mawili yanayosisitiza upande wa mashariki na mahali jua linapochomoza.
