  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֜ה אֶת מֹשֶׁ֗ה כֵּֽן חָנ֤וּ לְ/דִגְלֵי/הֶם֙ וְ/כֵ֣ן נָסָ֔עוּ אִ֥ישׁ לְ/מִשְׁפְּחֹתָ֖י/ו עַל בֵּ֥ית אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/034.yaml
  text: 'So the sons of Israel did according to all that Yahweh had commanded Moses: so they camped by their standards[a], and so they set out, each by his clans[c][b], according to his fathers’ house.'
translation:
  language: sw
  text: Basi Waisraeli[a] wakafanya kama yote ambayo Yahwe alikuwa amemwamuru Musa. Hivyo walipiga kambi kwa bendera zao[b], na hivyo wakaondoka, kila mmoja kwa koo zake, kulingana na nyumba za baba zake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa kufuata bendera zao” au “kwa vikundi vyao vya bendera.” Neno la Kiebrania linaweza kurejelea bendera au mpangilio wa kundi chini ya bendera.
    reason: lexical_ambiguity
  - marker: c
    text: Kihalisi, “nyumba za baba zake.” Hii ni istilahi ya ukoo wa upande wa baba, si lazima nyumba ya makazi.
    reason: cultural_clarification
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: wakafanya
  rationale: Kitenzi hiki kinajumlisha utekelezaji wa maagizo yaliyotangulia; “wakafanya” ni cha kawaida na kinabaki karibu na Kiebrania.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Hili ndilo jina la kawaida la taifa katika Kiswahili cha sasa; tanbihi inahifadhi umbo halisi la Kiebrania, “wana wa Israeli.”
- source_word: כְּכֹל אֲשֶׁר
  choice: sawasawa na yote ambayo
  rationale: Usemi huu unahifadhi maana ya utiifu kamili kwa kila jambo lililoamriwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetolewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: צִוָּה ... אֶת מֹשֶׁה
  choice: alikuwa amemwamuru Musa
  rationale: Wakati huu wa kitenzi unaonyesha kwa kawaida kwamba amri ilitangulia utekelezaji wa Waisraeli.
- source_word: כֵּן ... וְכֵן
  choice: Hivyo ... na hivyo
  rationale: Kurudia “hivyo” kunahifadhi msisitizo wa Kiebrania kwamba kupiga kambi na kuondoka kulilingana na amri.
- source_word: חָנוּ
  choice: walipiga kambi
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili kwa kukaa kambini.
- source_word: לְדִגְלֵיהֶם
  choice: chini ya bendera zao
  rationale: דגל hapa ni bendera au alama iliyotambulisha na kupanga kundi la kambi; “chini ya” hueleza kwa kawaida mpangilio huo.
- source_word: נָסָעוּ
  choice: wakaondoka
  rationale: Katika muktadha wa kusogeza kambi, neno hili linaonyesha kuanza safari bila kuongeza wazo lisilomo wazi katika maandishi.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: Neno limetumika kwa maana ya mgawanyo—kila mtu au kila sehemu ya kambi kwa nafasi yake—na “kila mmoja” ni Kiswahili cha kawaida.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: kwa kufuata koo zake
  rationale: מִשְׁפָּחָה katika mpangilio wa kikabila humaanisha koo au makundi ya jamaa, si familia ndogo tu.
- source_word: עַל בֵּית אֲבֹתָיו
  choice: na jamaa ya mababu zake
  rationale: Usemi huu unaonyesha kitengo cha ukoo wa upande wa baba; “jamaa ya mababu zake” ni wazi zaidi katika Kiswahili kuliko tafsiri sisisi “nyumba ya baba zake.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu lenye herufi nne, si cheo. “Yahwe” hulihifadhi kama jina binafsi bila kuingiza mapokeo ya dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inarudia “hivyo” ili kuhifadhi muundo na msisitizo wa Kiebrania. Maneno “koo” na “jamaa ya mababu” yanatofautisha viwango vya mpangilio wa ukoo bila kutumia lugha ya kale isiyoeleweka.
