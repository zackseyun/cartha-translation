  text: אִ֣ישׁ עַל דִּגְל֤/וֹ בְ/אֹתֹת֙ לְ/בֵ֣ית אֲבֹתָ֔/ם יַחֲנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל מִ/נֶּ֕גֶד סָבִ֥יב לְ/אֹֽהֶל מוֹעֵ֖ד יַחֲנֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/002.yaml
  text: The sons of Israel shall camp[a], each man by his banner, according to the signs of their fathers’ houses; they shall camp facing the tent of meeting[c][b], all around it.
translation:
  language: sw
  text: Wanaisraeli[d] watapiga kambi, kila mwanamume chini ya bendera yake[a], kwa alama za koo za baba zao. Watapiga kambi wakilikabili[c], pande zote kulizunguka hema la mkutano[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ishara yake ya kikosi.” Neno la Kiebrania linamaanisha bendera au alama ya utambulisho wa kabila au kikosi.
    reason: lexical_alternative
  - marker: b
    text: Kwa kawaida pia huitwa “maskani,” lakini Kiebrania kinasema kihalisi “hema la mkutano.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania linaweza pia kumaanisha kuwa walipiga kambi kwa umbali fulani kutoka kwenye hema.
    reason: ambiguity_preservation
  - marker: d
    text: Kiebrania kinasema kihalisi “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: kila mwanamume
  rationale: Umoja umetumiwa kwa maana ya kugawa agizo kwa kila mwanamume mmoja mmoja ndani ya jumuiya.
- source_word: דִּגְלוֹ
  choice: bendera yake
  rationale: דֶּגֶל ni bendera au ishara ya utambulisho wa kikabila au wa kikosi; “bendera” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: בְאֹתֹת לְבֵית אֲבֹתָם
  choice: kwa alama za koo zao za upande wa baba
  rationale: Tafsiri hii inaonyesha alama za utambulisho zinazohusishwa na makundi ya ukoo yaliyohesabiwa kwa upande wa baba, bila kudokeza nyumba halisi za kuishi.
- source_word: יַחֲנוּ
  choice: watapiga kambi
  rationale: Katika muktadha huu kauli isiyotimilika ya Kiebrania ina nguvu ya agizo kuhusu mpangilio wa kambi; Kiswahili cha wakati ujao hutumika kwa kawaida katika maagizo ya aina hii.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Wanaisraeli
  rationale: Hili ni jina la kawaida na la asili katika Kiswahili kwa jamii yote inayotajwa na msemo wa Kiebrania “wana wa Israeli.”
- source_word: מִנֶּגֶד סָבִיב
  choice: kulizunguka … wakilikabili
  rationale: Maneno haya yanaonyesha kuwa kambi zilipangwa pande zote za hema zikiwa zimeelekezwa kulikabili; uwezekano wa maana ya umbali umehifadhiwa katika tanbihi.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la mkutano
  rationale: Ni tafsiri ya moja kwa moja na inayoeleweka ya jina la Kiebrania, bila kuingiza neno la kimapokeo lisiloonyesha wazi maana ya “hema.”
theological_decisions:
- issue: Lugha ya kijinsia na utambulisho wa jamii
  choice: kila mwanamume / Wanaisraeli
  alternative: kila mmoja / wana wa Israeli
  rationale: “Kila mwanamume” huhifadhi umbo la kiume la אִישׁ katika agizo la kijeshi na kikabila, huku “Wanaisraeli” likitaja kwa Kiswahili cha kawaida jamii nzima inayomaanishwa na בְּנֵי יִשְׂרָאֵל.
- issue: Jina la mahali patakatifu
  choice: hema la mkutano
  alternative: maskani
  rationale: “Hema la mkutano” hufuata moja kwa moja אֹהֶל מוֹעֵד na kuhifadhi wazo la hema pamoja na kusudi lake la mkutano.
- issue: Mahali pa kambi kuhusiana na hema
  choice: wakilikabili
  alternative: kwa mbali nalo
  rationale: מִנֶּגֶד inaweza kueleza kuwa upande unaelekeana na kitu au kuwa umbali fulani kutoka nacho. Muktadha wa mpangilio unaunga mkono “wakilikabili,” huku maana nyingine ikitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa. “Koo zao za upande wa baba” huepuka tafsiri isiyo ya asili ya “nyumba za baba zao,” na “watapiga kambi” ni usemi wa kawaida unaofaa maagizo ya mpangilio.
