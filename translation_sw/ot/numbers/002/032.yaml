base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/032.yaml
  text: These are the numbered men of the sons of Israel by their fathers’ houses[c][b][a]. All the numbered men of the camps by their divisions were six hundred three thousand five hundred fifty.
translation:
  language: sw
  text: Hawa ndio wanaume wa Israeli waliohesabiwa kulingana na jamaa za baba zao.[a] Jumla ya wanaume waliohesabiwa wa kambi, kulingana na vikosi vyao,[b] walikuwa laki sita na elfu tatu, mia tano na hamsini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kwa nyumba za baba zao”; yaani, kulingana na jamaa zao za ukoo wa upande wa baba.
    reason: lexical_alternative
  - marker: b
    text: Au “kulingana na majeshi yao” au “makundi yao yaliyopangwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: wanaume ... waliohesabiwa
  rationale: Katika muktadha wa sensa ya Hesabu 1–2, neno hili linawahusu walioandikishwa na kuhesabiwa kwa ajili ya mpangilio wa kijeshi; 'wanaume' linawekwa wazi kwa sababu muktadha unataja wanaume wanaofaa kwenda vitani.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ni Kiswahili cha kawaida na cha asili kwa maana ya 'wana wa Israeli,' bila kupoteza utambulisho wa taifa.
- source_word: לְבֵית אֲבֹתָם
  choice: kulingana na jamaa za baba zao
  rationale: Huhifadhi wazo la vikundi vya ukoo vinavyofuata nasaba ya upande wa baba, huku likieleweka kwa msomaji wa leo.
- source_word: הַמַּחֲנֹת
  choice: kambi
  rationale: Hurejelea makundi ya makabila yaliyopiga kambi kuzunguka hema la kukutania; 'kambi' ni neno la kawaida na sahihi.
- source_word: לְצִבְאֹתָם
  choice: kulingana na vikosi vyao
  rationale: Huwasilisha mpangilio wa makundi yenye muundo wa kijeshi bila kudai kwamba yalikuwa yakipigana wakati huo.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: mia sita na tatu elfu, mia tano na hamsini
  rationale: Hutoa jumla ya 603,550 kwa maneno katika mtindo wa heshima unaofaa muhtasari wa sensa.
theological_decisions:
- issue: Lugha ya kijinsia katika sensa
  choice: wanaume ... waliohesabiwa
  alternative: watu waliohesabiwa; walioandikishwa
  rationale: Ingawa mstari huu hauna nomino tofauti inayosema 'wanaume,' muktadha wa karibu wa Hesabu 1–2 unafafanua waliohesabiwa kuwa wanaume watu wazima waliofaa kwa huduma ya kijeshi; tafsiri inaweka rejeo hilo wazi bila kulifanya neno lenyewe liseme zaidi ya muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Muundo umegawanywa katika sentensi mbili kwa uwazi. 'Jamaa za baba zao' huepuka usemi mgumu wa moja kwa moja 'nyumba za baba zao' huku tanbihi ikihifadhi tamathali ya Kiebrania.
