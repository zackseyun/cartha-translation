lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Katika fomula ya hotuba ya Mungu, kitenzi דבר pamoja na אֶל humaanisha kumwambia au kusema na mtu. “Akasema na” ni Kiswahili cha sasa na huhifadhi tukio jipya la simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: na Musa na Haruni
  rationale: Kiunganishi na kihusishi vinavyorudiwa vinaonyesha wazi kwamba Musa na Haruni wote wawili ndio walioambiwa.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Fomula hii hutanguliza maneno yatakayofuata katika mstari unaofuata; “akisema” huhifadhi kiungo hicho rasmi.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” ni utohozi wa kawaida wa Kiswahili unaolihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa kifungu umehifadhi fomula rasmi ya utangulizi wa hotuba, ingawa “akisema” ni wa kifasihi zaidi kuliko mazungumzo ya kawaida.
