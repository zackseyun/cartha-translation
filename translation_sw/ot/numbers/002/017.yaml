  yaml_path: translation/ot/numbers/002/017.yaml
  text: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
translation:
  language: sw
  text: Kisha Hema la Kukutania litaondoka pamoja na kambi ya Walawi, katikati ya kambi. Kama wanavyopiga kambi, ndivyo watakavyoondoka, kila mmoja katika nafasi yake[a], kulingana na bendera zao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pake.” Nahau ya Kiebrania kwa kawaida inahusisha “mkono/upande” na hapa humaanisha nafasi aliyopewa katika mpangilio wa safari.
    reason: lexical_alternative
  - marker: b
    text: Au “kulingana na alama zao za makundi.” Bendera hizo zilitambulisha migawanyo ya makabila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Kisha ... litaondoka
  rationale: Katika muktadha wa safari ya kambi, נָסַע humaanisha kuvunja kambi na kuanza safari. “Litaondoka” ni Kiswahili cha kawaida kinachoonyesha mwendo unaofuata katika utaratibu huo; וְ imetafsiriwa “Kisha” kuonyesha mfuatano.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Tafsiri hii huhifadhi maana halisi ya אֹהֶל, “hema,” na kusudi la מוֹעֵד, mahali pa kukutana, bila kuingiza istilahi ya baadaye.
- source_word: מַחֲנֵה הַלְוִיִּם
  choice: kambi ya Walawi
  rationale: Muundo huu wa kawaida huhifadhi uhusiano wa moja kwa moja wa maneno ya Kiebrania na jina la kundi la Walawi.
- source_word: בְּתוֹךְ הַמַּחֲנֹת
  choice: katikati ya kambi nyingine
  rationale: בְּתוֹךְ hapa huonyesha nafasi ya kati. Neno “nyingine” linafafanua kwa Kiswahili kwamba kambi ya Walawi iko katikati ya kambi za makabila mengine, bila kubadili maana ya mpangilio.
- source_word: כַּאֲשֶׁר יַחֲנוּ כֵּן יִסָּעוּ
  choice: Kama wanavyopiga kambi, ndivyo watakavyoondoka
  rationale: Muundo wa “kama ... ndivyo ...” huhifadhi usambamba wa Kiebrania na ulinganifu kati ya mpangilio wa kupiga kambi na ule wa kusafiri.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: אִישׁ imetumiwa kwa maana ya kugawa, yaani kila mtu au kila kikundi katika mpangilio. “Kila mmoja” ni ya asili na haiongezi msisitizo usio wa lazima juu ya jinsia.
- source_word: עַל יָדוֹ
  choice: katika nafasi yake
  rationale: Nahau hii, ambayo kihalisi inahusisha “mkono/upande,” hapa hurejelea nafasi aliyopewa kila mmoja katika mpangilio wa safari.
- source_word: לְדִגְלֵיהֶם
  choice: kulingana na bendera zao
  rationale: דֶּגֶל ni bendera au alama iliyotambulisha na kupanga makundi ya makabila. “Kulingana na” huonyesha kwamba safari ilifuata migawanyo hiyo.
