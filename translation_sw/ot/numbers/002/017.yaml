translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Usambamba wa sentensi ya Kiebrania umehifadhiwa, huku mpangilio wa maneno ukifanywa wa kawaida katika Kiswahili. Alama za tanbihi zimewekwa kwenye maneno wanayoyafafanua.
