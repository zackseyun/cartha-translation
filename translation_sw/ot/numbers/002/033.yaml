  text: וְ/הַ֨/לְוִיִּ֔ם לֹ֣א הָתְפָּקְד֔וּ בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/033.yaml
  text: But the Levites were not counted among the sons of Israel[a], as Yahweh had commanded Moses.
translation:
  language: sw
  text: Lakini Walawi hawakuhesabiwa miongoni mwa wana wa Israeli[a], kama Yahweh alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli,” au kwa mapokeo “watoto wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/לְוִיִּם
  choice: Lakini Walawi
  rationale: Kiunganishi וְ kinaonyesha tofauti na jumla ya waliohesabiwa katika muktadha uliotangulia; “Lakini” huwasilisha tofauti hiyo kwa Kiswahili cha kawaida, na “Walawi” ndilo jina lililozoeleka.
- source_word: לֹא הָתְפָּקְדוּ
  choice: hawakuhesabiwa
  rationale: Katika muktadha wa sensa, hitpaeli ya פקד inamaanisha kuingizwa katika hesabu au sensa. Umbo la kutendwa “hawakuhesabiwa” ni wazi na huhifadhi mtazamo wa Kiebrania.
- source_word: בְּ/תוֹךְ
  choice: miongoni mwa
  rationale: Kirai hiki kinaonyesha kujumuishwa ndani ya kundi kubwa; “miongoni mwa” ni cha asili na sahihi katika Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi usemi wa Kiebrania “wana wa Israeli,” huku tanbihi ikitoa tafsiri ya kawaida zaidi “Waisraeli.”
- source_word: כַּ/אֲשֶׁר
  choice: kama
  rationale: Huanzisha ulinganisho na amri iliyotolewa hapo awali kwa njia fupi na ya kawaida.
- source_word: צִוָּה ... אֶת מֹשֶׁה
  choice: alivyomwamuru Musa
  rationale: Muundo huu wa Kiswahili huonyesha kwamba kutohesabiwa kwa Walawi kulikuwa sawasawa na amri ambayo Musa alikuwa amepewa tayari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limeandikwa kwa unukuzi “Yahweh” badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina la agano יְהוָה moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka, huku usemi halisi “wana wa Israeli” na jina “Yahweh” vikihifadhi uwazi wa matini chanzo.
