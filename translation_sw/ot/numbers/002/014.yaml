lexical_decisions:
- source_word: וְ/מַטֵּה
  choice: na kabila la
  rationale: Katika mpangilio wa kambi wa Hesabu 2, מַטֶּה humaanisha kabila, si fimbo halisi. Kiunganishi וְ kimetafsiriwa “na” ili kuhifadhi muundo wa orodha.
- source_word: גָּד
  choice: Gadi
  rationale: Jina la kabila limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וְ/נָשִׂיא
  choice: Kiongozi
  rationale: נָשִׂיא hapa ni mkuu anayetambuliwa wa kabila; “kiongozi” ni neno la sasa, wazi, na lisiloashiria lazima mwana wa mfalme.
- source_word: לִ/בְנֵי גָד
  choice: wa wana wa Gadi
  rationale: Muundo huu unamtambulisha kiongozi wa kundi la kikabila. “Wana wa Gadi” huhifadhi kwa uwazi zaidi usemi wa Kiebrania kuliko kufasiri kwa upana kuwa “wazao” au “watu.”
- source_word: אֶלְיָסָף
  choice: Eliasafu
  rationale: Jina la mtu limetoholewa kwa kufuata matumizi ya kawaida ya Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya fomula ya nasaba.
- source_word: רְעוּאֵל
  choice: Reueli
  rationale: Maandishi ya Kimasora hapa yana רְעוּאֵל (Reueli); tofauti ya “Deueli” imehifadhiwa katika tanbihi badala ya kulinganisha kimya na Hesabu 1:14.
