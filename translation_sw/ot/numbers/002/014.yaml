translation:
  language: sw
  text: Na kabila la Gadi; kiongozi wa wana wa Gadi alikuwa Eliasafu mwana wa Reueli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale au vifungu sambamba hutaja jina la baba yake kuwa Deueli (tazama Hesabu 1:14).
