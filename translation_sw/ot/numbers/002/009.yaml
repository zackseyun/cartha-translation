  yaml_path: translation/ot/numbers/002/009.yaml
  text: All those counted for the camp of Judah were 186,400 by their divisions[c][b][a]. They shall set out first.
translation:
  language: sw
  text: Wote waliohesabiwa wa kambi ya Yuda walikuwa 186,400, kufuatana na vikosi vyao.[a] Wataondoka kwanza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa majeshi yao” au “kwa makundi yao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Watavunja kambi kwanza” au “Wataanza safari kwanza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: jumla ya wote waliohesabiwa
  rationale: Kirai hiki kinatoa jumla ya walioandikishwa katika sensa; tafsiri hii ni ya kawaida na inahifadhi maana ya kuhesabiwa bila kuongeza neno ‘wanaume’.
- source_word: לְמַחֲנֵה יְהוּדָה
  choice: katika kambi ya Yuda
  rationale: Hueleza kundi la kambi ambalo waliohesabiwa walihusishwa nalo; ‘katika kambi ya Yuda’ ni Kiswahili cha asili katika muktadha huu.
- source_word: מְאַת אֶלֶף וּשְׁמֹנִים אֶלֶף וְשֵׁשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  choice: 186,400
  rationale: Namba imeandikwa kwa tarakimu ili iwe rahisi kusomeka katika muhtasari wa sensa huku thamani kamili ikihifadhiwa.
- source_word: לְצִבְאֹתָם
  choice: kufuatana na vikosi vyao
  rationale: צָבָא hapa hurejelea makundi yaliyopangwa kwa kusudi la kijeshi; ‘vikosi’ huonyesha mpangilio huo bila kulazimisha dhana ya majeshi ya kisasa.
- source_word: רִאשֹׁנָה יִסָּעוּ
  choice: Hao ndio watakaoondoka kwanza
  rationale: נסע katika muktadha wa kambi humaanisha kuondoka au kuanza safari, na רִאשֹׁנָה huonyesha nafasi ya kwanza katika utaratibu wa mwendo.
