translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. ‘Jumla ya wote waliohesabiwa’ inafaa kwa muhtasari wa sensa; ‘vikosi’ huhifadhi mwelekeo wa kijeshi wa kifungu, na ‘watakaoondoka’ ni ya asili katika muktadha wa utaratibu wa safari.
