lexical_decisions:
- source_word: מַטֵּה
  choice: kabila
  rationale: Katika muktadha wa mpangilio wa kambi katika Hesabu, neno hili linamaanisha kundi la kikabila, si fimbo halisi.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Hapa neno hili linamtaja mkuu anayetambulika wa kabila; “kiongozi” ni Kiswahili cha kawaida kisicho na dhana ya lazima ya ufalme.
- source_word: לִבְנֵי
  choice: wa wana wa
  rationale: Muundo huu unahusianisha kiongozi na kundi la kikabila na pia unahifadhi kwa karibu usemi wa Kiebrania “wana wa.”
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Jina la mtu na la kabila limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: אֲחִירַע
  choice: Ahira
  rationale: Jina maalumu limetoholewa badala ya kutafsiriwa maana yake.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ni usemi wa kawaida wa Kiebrania unaotaja baba wa mtu; “mwana wa” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: עֵינָן
  choice: Enani
  rationale: Jina maalumu limetoholewa kwa umbo linalofaa mfumo wa sauti wa Kiswahili.
