  text: And his company, even those numbered from it, was forty-six thousand five hundred.
translation:
  language: sw
  text: Na kikosi chake, yaani wale waliohesabiwa katika kikosi hicho, walikuwa elfu arobaini na sita na mia tano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְבָאוֹ
  choice: kikosi chake
  rationale: Katika muktadha wa sensa na mpangilio wa kambi katika Hesabu, צָבָא humaanisha kundi la kabila lililopangwa kwa mtindo wa kijeshi. “Kikosi” ni Kiswahili cha sasa na cha kawaida kinachohifadhi wazo la kundi lililopangwa bila kudokeza lazima kuwa liko vitani.
- source_word: פְקֻדָיו
  choice: wale waliohesabiwa katika kikosi hicho
  rationale: Neno hili latokana na פקד katika maana ya sensa na linawataja watu walioingizwa katika hesabu ya kikosi. Kirai hiki kinaweka wazi uhusiano wao na kikosi huku kikiepuka kurudia kiwakilishi kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: elfu arobaini na sita na mia tano
  rationale: Jumla ya 46,500 imetolewa kwa mpangilio wa kawaida wa namba katika Kiswahili cha sasa, bila kuiga kikasuku mpangilio wa maneno wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kiambatisho katika Kiebrania umehifadhiwa kwa “yaani,” na kitenzi cha wingi “walikuwa” kinaafikiana na watu waliohesabiwa.
