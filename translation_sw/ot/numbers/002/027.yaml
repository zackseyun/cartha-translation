base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/027.yaml
  text: 'Those camping next to it: the tribe of Asher[a], and the leader of the sons of Asher, Pagiel son of Ocran.'
translation:
  language: sw
  text: Nao wanaopiga kambi kando yake[a] ni kabila la Asheri; na kiongozi wa wana wa Asheri ni Pagieli mwana wa Okrani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “karibu yake.” Kihusishi cha Kiebrania kinaweza kuonyesha mahali palipo sambamba au jirani katika mpangilio wa kambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: wanaopiga kambi
  rationale: Kauli ya kushiriki kutoka חנה inaonyesha watu waliopiga au wanaopiga kambi. “Wanaopiga kambi” ni Kiswahili cha sasa na huhifadhi nguvu ya kauli hiyo bila kuongeza wakati usiotajwa wazi.
- source_word: עָלָיו
  choice: kando yake
  rationale: Katika muktadha wa mpangilio wa kambi, עַל pamoja na kiambishi cha nafsi huonyesha mahali pa jirani au pembeni, si kuwa juu ya kitu.
- source_word: מַטֵּה
  choice: kabila
  rationale: Katika hesabu na mpangilio wa kambi katika Hesabu, מַטֶּה humaanisha kundi la kikabila; “kabila” ndiyo maana sahihi na inayoeleweka kwa urahisi.
- source_word: אָשֵׁר
  choice: Asheri
  rationale: Jina la mtu na la kabila limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Katika kitabu cha Hesabu neno hili humtaja mkuu anayetambuliwa wa kabila. “Kiongozi” ni sahihi na halileti dhana isiyokusudiwa ya mwana wa mfalme.
- source_word: לִבְנֵי אָשֵׁר
  choice: wa wana wa Asheri
  rationale: Tafsiri hii huhifadhi nahau ya Kiebrania “wana wa Asheri” na inaonyesha uhusiano wa kiongozi na kundi hilo.
- source_word: פַּגְעִיאֵל
  choice: Pagieli
  rationale: Jina limetoholewa kwa matamshi ya kawaida ya Kiswahili.
- source_word: בֶּן עָכְרָן
  choice: mwana wa Okrani
  rationale: Huu ni muundo wa kawaida wa kutaja ukoo wa upande wa baba, na umetafsiriwa moja kwa moja na kwa kawaida.
