  yaml_path: translation/ot/numbers/002/016.yaml
  text: All those counted for the camp of Reuben were 151,450 by their companies[b][a]. They shall set out second.
translation:
  language: sw
  text: Jumla ya waliohesabiwa katika kambi ya Reubeni ilikuwa 151,450, kwa vikosi vyao. Wataondoka katika nafasi ya pili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Wote waliohesabiwa
  rationale: Huwakilisha jumla nzima ya watu walioandikishwa katika sensa bila kuongeza neno lisilotajwa wazi hapa.
- source_word: לְמַחֲנֵה רְאוּבֵן
  choice: katika kambi ya Reubeni
  rationale: Hueleza uhusiano wao na kundi la kambi lililopewa jina la Reubeni kwa Kiswahili cha kawaida.
- source_word: מְאַת אֶלֶף וְאֶחָד וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: 151,450
  rationale: Namba hii ndiyo jumla ya moja kwa moja ya tarakimu za Kiebrania; tarakimu ni wazi katika muktadha wa sensa.
- source_word: לְצִבְאֹתָם
  choice: kwa vikosi vyao
  rationale: צבאותם hapa huelekea kumaanisha makundi ya kijeshi yaliyopangwa; 'vikosi vyao' ni wazi na asilia bila kuamua kwa namna finyu ukubwa wa kila kundi.
- source_word: וּשְׁנִיִּם יִסָּעוּ
  choice: Wao wataondoka katika nafasi ya pili
  rationale: Huhifadhi maana ya mpangilio wa kuanza safari; 'katika nafasi ya pili' huonyesha wazi kuwa kambi hii ndiyo ya pili kuondoka.
