lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Na kikosi chake
  rationale: Katika muktadha wa sensa na mpangilio wa kambi, צָבָא humaanisha kundi lililopangwa, hasa kikosi cha kijeshi. “Kikosi” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kudokeza kwamba mapigano yanaendelea; kiambishi cha nafsi ya tatu umoja kimetafsiriwa “chake.”
- source_word: וּפְקֻדֵיהֶם
  choice: yaani wale waliohesabiwa kati yao
  rationale: Neno hili linawataja watu waliohesabiwa au kuandikishwa katika sensa. “Wale waliohesabiwa kati yao” huhifadhi rejeleo la kundi la wingi, huku “yaani” ikiweka wazi uhusiano wa ufafanuzi unaoeleweka katika muundo wa Kiebrania.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: elfu arobaini na moja na mia tano
  rationale: 'Idadi imetolewa kwa mpangilio wa kawaida wa Kiswahili cha sasa bila kubadili thamani yake: 41,500.'
