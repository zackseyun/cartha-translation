lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Na kikosi chake
  rationale: Katika muktadha wa sensa na mpangilio wa kambi, צָבָא humaanisha kundi la kikabila lililopangwa kwa kusudi la kijeshi. “Kikosi” ni Kiswahili cha kawaida na cha sasa, bila kudokeza kwamba tayari walikuwa vitani.
- source_word: וּפְקֻדָיו
  choice: yaani wale waliohesabiwa katika kikosi hicho
  rationale: Umbo linalotokana na פקד hapa linawahusu watu waliosajiliwa na kuhesabiwa rasmi katika sensa. “Yaani” linaonyesha kuwa fungu hili linafafanua idadi ya kikosi, badala ya kuongeza kundi jingine.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: elfu hamsini na saba na mia nne
  rationale: Idadi kamili ya 57,400 imetolewa kwa mpangilio wa kawaida wa namba katika Kiswahili cha sasa.
