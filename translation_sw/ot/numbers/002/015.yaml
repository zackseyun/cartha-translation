lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: na kikosi chake
  rationale: Katika muktadha wa sensa na mpangilio wa kambi, צָבָא ni kundi la kabila lililopangwa kwa utumishi wa kijeshi. “Kikosi” ni Kiswahili cha kawaida kinachoonyesha kundi lililopangwa bila kulazimisha maana ya jeshi lote.
- source_word: וּפְקֻדֵיהֶם
  choice: yaani wale waliohesabiwa kutoka kwao
  rationale: Neno linatokana na פקד na hapa linawahusu walioandikishwa au kuhesabiwa katika sensa. Tafsiri hii inadumisha wazo la sensa na kiambishi cha wingi “wao” bila kuongeza neno “wanaume,” ambalo halipo wazi katika kishazi hiki.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 45,650
  rationale: 'Hii ni namna ya kawaida na iliyo wazi ya kuandika jumla ya namba ya Kiebrania: elfu arobaini na tano, mia sita na hamsini.'
