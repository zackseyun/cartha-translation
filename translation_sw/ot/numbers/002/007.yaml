lexical_decisions:
- source_word: מַטֵּה
  choice: kabila
  rationale: Katika muktadha wa kupanga kambi na kuhesabu watu katika Hesabu, neno hili linamaanisha kundi la kikabila, si fimbo halisi.
- source_word: זְבוּלֻן
  choice: Zabuloni
  rationale: Jina la kabila na la babu wake limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: וְנָשִׂיא
  choice: na kiongozi
  rationale: Katika utaratibu huu wa kikabila, נָשִׂיא ni mkuu anayetambuliwa wa kabila; “kiongozi” ni wazi na haleti wazo lisilokusudiwa la ufalme.
- source_word: לִבְנֵי זְבוּלֻן
  choice: wa wana wa Zabuloni
  rationale: Tafsiri hii inabaki karibu na muundo wa Kiebrania na kudumisha lugha yake ya ukoo, huku kihusishi ל kikieleweka kama kinachoonyesha uhusiano.
- source_word: אֱלִיאָב
  choice: Eliabu
  rationale: Jina limetoholewa kulingana na matumizi yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: בֶּן חֵלֹן
  choice: mwana wa Heloni
  rationale: Ni muundo wa kawaida wa Kiebrania unaomtaja mtu kwa jina la baba yake.
