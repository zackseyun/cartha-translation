  text: Kabila la Zabuloni; na mkuu wa wana wa Zabuloni[a], Eliabu mwana wa Heloni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa wana wa Zabuloni.” Kihusishi cha Kiebrania kinaweza kutafsiriwa kwa njia zaidi ya moja zinazokaribiana katika mtindo huu wa kiutawala wa kikabila.
