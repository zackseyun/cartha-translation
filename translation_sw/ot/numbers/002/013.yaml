translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Neno “kikosi” limetumiwa kwa maana ya kundi la kikabila lililopangwa katika muktadha wa kambi na sensa. Tarakimu zimetumiwa kwa jumla ya sensa ili kutoa usomaji wa haraka na usio na utata.
