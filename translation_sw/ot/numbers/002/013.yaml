  text: 'na kikosi chake, na waliohesabiwa wao: 59,300.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: na kikosi chake
  rationale: Katika muktadha wa sensa na mpangilio wa kambi, צָבָא hapa ni kundi la kikabila lililopangwa kwa huduma ya kijeshi. “Kikosi” ni Kiswahili cha sasa na cha kawaida kinachoonyesha kundi lililopangwa bila kutumia neno pana zaidi “jeshi.” Kiunganishi וּ kimetafsiriwa “na,” na kiambishi cha nafsi ya tatu umoja wa kiume kimetafsiriwa “chake.”
- source_word: וּפְקֻדֵיהֶם
  choice: yaani wale waliohesabiwa kutoka kwao
  rationale: Neno hili, kutoka פקד katika matumizi ya sensa, linawaonyesha watu waliohesabiwa. “Wale waliohesabiwa kutoka kwao” huhifadhi wazo la watu waliotokana na kundi hilo bila kuongeza “wanaume,” ambalo halitajwi wazi katika kishazi hiki. “Yaani” linaonyesha kwa Kiswahili uhusiano wa maelezo kati ya kikosi na jumla yake, badala ya kurudia “na” kwa namna isiyo ya kawaida.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף
  choice: 59,000
  rationale: Mpangilio wa Kiebrania ni kihalisi “elfu tisa na hamsini.” Muundo wa tarakimu unaonyesha thamani ileile kwa uwazi na kwa mtindo wa kawaida wa takwimu za sensa.
- source_word: וּשְׁלֹשׁ מֵאוֹת
  choice: '300'
  rationale: Hii inakamilisha jumla kuwa 59,300. Uandishi wa tarakimu unaunganisha sehemu zote za idadi kwa uwazi bila kuhitaji kiunganishi kingine cha maneno.
