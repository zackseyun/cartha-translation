    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: na kikosi chake
  rationale: צָבָא inaweza kumaanisha jeshi, lakini katika muktadha wa mpangilio wa kambi hapa inaelekea kumaanisha kikosi cha kabila kilichopangwa chini ya kiongozi wake. “Kikosi” ni neno la kawaida linalohifadhi maana ya mpangilio wa kijeshi bila kudokeza kwamba mapigano yanaendelea.
- source_word: וּפְקֻדֵיהֶם
  choice: wale waliohesabiwa miongoni mwao
  rationale: Neno hili limetokana na פקד katika matumizi ya sensa na linawahusu waliohesabiwa au kuandikishwa. Kiambishi cha Kiebrania ni cha wingi (“wao”); “miongoni mwao” kinahifadhi maana hiyo bila kuongeza “wanaume,” ambalo halitajwi wazi katika kishazi hiki.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 74,600
  rationale: Idadi imetolewa kwa tarakimu zinazotumika katika Kiswahili cha sasa, huku jumla kamili ya watu sabini na nne elfu na mia sita ikihifadhiwa.
