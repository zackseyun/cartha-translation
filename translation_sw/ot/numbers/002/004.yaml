  text: 'na kikosi chake[a], na watu wake waliohesabiwa[b]: 74,600.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jeshi lake” au “kundi lake.” Neno la Kiebrania linaweza kuwa na maana ya kijeshi, lakini hapa huenda linamaanisha kikosi cha kabila kama kilivyopangwa kambini.
    reason: lexical_alternative
  - marker: b
