lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: na kikosi chake
  rationale: Katika mpangilio wa kambi na mwendo katika Hesabu 2, צָבָא humaanisha kundi la kikabila lililopangwa kwa utumishi; “kikosi” ni neno la kawaida linalowasilisha maana hiyo bila kusisitiza mapigano yanayoendelea.
- source_word: וּפְקֻדֵיהֶם
  choice: yaani wale waliohesabiwa miongoni mwao
  rationale: Nomino hii inayotokana na פקד inawahusu watu waliohesabiwa au kuandikishwa. Kiambishi cha wingi kinarejelea watu wa kikosi, na “yaani” huonyesha kwa kawaida kwamba idadi inayofuata ni jumla yao.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: 32,200
  rationale: Hii ni namba kamili ya elfu thelathini na mbili na mia mbili; tarakimu ni wazi na za kawaida katika matini ya kisasa ya Kiswahili.
