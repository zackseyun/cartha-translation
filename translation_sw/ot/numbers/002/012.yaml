base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/012.yaml
  text: Those camping next to him are the tribe of Simeon[a], and the leader of the sons of Simeon is Shelumiel son of Zurishaddai.
translation:
  language: sw
  text: Wanaopiga kambi kando yake[a] ni kabila la Simeoni; na mkuu wa wana wa Simeoni ni Shelumieli mwana wa Surishadai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “karibu yake.” Katika mpangilio huu wa kambi, neno la Kiebrania huonyesha nafasi ya ukaribu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֹנִם
  choice: Wanaopiga kambi
  rationale: Kirai cha Kiebrania ni kitenzi-jina chenye kutaja watu wanaokaa kambini; “wanaopiga kambi” ni Kiswahili cha kawaida kinachohifadhi hali hiyo.
- source_word: עָלָיו
  choice: kando yake
  rationale: Katika mpangilio wa kambi, עַל hapa huonyesha ukaribu, si kuwa juu ya kitu. “Yake” pia haifungi wazi rejeleo kuwa mtu au kambi/bendera iliyotangulia.
- source_word: מַטֵּה שִׁמְעוֹן
  choice: kabila la Simeoni
  rationale: מַטֶּה katika orodha za sensa na mpangilio wa kambi humaanisha kitengo cha kikabila, wala si fimbo.
- source_word: וְנָשִׂיא
  choice: na mkuu
  rationale: נָשִׂיא hapa ni kiongozi rasmi wa kabila; “mkuu” ni neno la kawaida na lenye heshima bila kudokeza lazima cheo cha kifalme.
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: wa wana wa Simeoni
  rationale: Huhifadhi usemi wa ukoo wa Kiebrania, “wana wa Simeoni,” bila kuugeuza kuwa usemi usioonyesha jinsia.
- source_word: שְׁלֻמִיאֵל
  choice: Shelumieli
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: בֶּן צוּרִי שַׁדָּי
  choice: mwana wa Surishadai
  rationale: Muundo wa nasaba umetafsiriwa moja kwa moja, na jina la baba limetoholewa kama jina moja.
theological_decisions:
- issue: Lugha ya ukoo yenye jinsia katika לִבְנֵי שִׁמְעוֹן
  choice: wana wa Simeoni
  alternative: watu wa Simeoni / wazao wa Simeoni
  rationale: Kiebrania kinasema kihalisi “wana”; tafsiri hiyo inaeleweka kama jina la kikabila na huhifadhi umbo la matini bila kulainisha jinsia kimya kimya.
- issue: Rejeleo la kiambishi katika עָלָיו
  choice: kando yake
  alternative: kando yake likirejelea ama mtu ama kambi/bendera iliyotangulia
  rationale: Muktadha na umbo la Kiebrania huruhusu mjadala kuhusu rejeleo. Kiswahili “yake” huhifadhi uwezekano huo badala ya kuamua bila lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa msomaji wa kawaida; “kupiga kambi,” “kabila,” na “mkuu” ni istilahi za kawaida. Alama [a] imewekwa mara moja katika matini kuu na inaeleza bila kuondoa utata halisi wa rejeleo.
