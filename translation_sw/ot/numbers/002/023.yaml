  language: sw
  text: Na watu wa kikosi chake waliohesabiwa walikuwa 35,400.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jeshi lake”; neno la Kiebrania linaweza kumaanisha kikosi, jeshi, au kundi lililopangwa. Katika muktadha wa mpangilio wa makabila na sensa ya jangwani, linaonyesha mpangilio wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: na kikosi chake
  rationale: צָבָא hapa humaanisha kundi la kabila lililopangwa kwa mtindo wa kijeshi katika mpangilio wa kambi; “kikosi” ni Kiswahili cha kawaida kinachohifadhi wazo la kundi lililopangwa bila kudai kwamba lilikuwa vitani wakati huo.
- source_word: וּפְקֻדֵיהֶם
  choice: yaani wale waliohesabiwa kutoka miongoni mwao
  rationale: Neno hili latokana na פקד katika muktadha wa sensa na humaanisha walioandikishwa au kuhesabiwa; kiambishi cha wingi kinarejelea watu wa kundi hilo.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: watu 35,400
  rationale: Hii huhifadhi jumla kamili ya elfu thelathini na tano mia nne kwa mpangilio wa kawaida wa Kiswahili; “watu” huwekwa wazi kwa sababu jumla ni ya waliohesabiwa.
