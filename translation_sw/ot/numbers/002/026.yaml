  text: 'and his division[b][a], those numbered from them: sixty-two thousand seven hundred.'
translation:
  language: sw
  text: na kikosi chake[a], na watu wake waliohesabiwa:[b] 62,700.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jeshi lake.” Neno la Kiebrania linaweza kumaanisha jeshi au kundi lililopangwa; hapa linamaanisha kikosi cha kabila katika mpangilio wa kambi.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno moja moja, “na watu wao waliohesabiwa.” Maneno haya yanarejelea jumla ya watu wa kundi hilo waliohesabiwa katika sensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: na kikosi chake
  rationale: Katika muktadha wa mpangilio wa kambi na sensa katika Hesabu 1–2, צָבָא inaashiria kikosi cha kikabila kilichopangwa kwa utumishi wa kijeshi. “Kikosi” ni Kiswahili cha kawaida kinachoonyesha kundi lililopangwa bila kulifanya jeshi la kudumu.
- source_word: וּפְקֻדֵיהֶם
  choice: yaani wale waliohesabiwa kati yao
  rationale: Nomino hii inayotokana na פקד inarejelea watu wa kundi hilo waliohesabiwa katika sensa. “Waliohesabiwa kati yao” huhifadhi maana ya watu waliohesabiwa na uhusiano wao na kabila au kundi husika; “yaani” huweka wazi uhusiano wa ufafanuzi unaoeleweka katika kishazi hiki.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 62,700
  rationale: 'Idadi kamili imetolewa kwa tarakimu kwa mtindo wa kawaida wa kisasa, bila kubadili thamani ya Kiebrania: elfu sitini na mbili na mia saba.'
