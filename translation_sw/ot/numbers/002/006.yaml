  text: 'na kikosi chake, na waliohesabiwa wake: watu elfu hamsini na nne na mia nne.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: na kikosi chake
  rationale: Neno צָבָא hapa linamaanisha kundi la kabila lililopangwa kwa kusudi la kijeshi katika mpangilio wa kambi. “Kikosi” ni neno la kawaida na linalosomeka vizuri, huku likihifadhi maana ya kundi lililopangwa bila kulifanya kuwa jeshi la kudumu.
- source_word: וּפְקֻדָיו
  choice: na waliohesabiwa humo
  rationale: Umbo hili la פקד linarejelea watu waliohesabiwa katika sensa na kuhusishwa na kikosi hicho. “Humo” huelekeza kwa kikosi bila kuongeza dai kwamba walikuwa wanajeshi pekee, ingawa muktadha una sura ya kijeshi.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: watu elfu hamsini na nne na mia nne
  rationale: Idadi ya Kiebrania imetolewa kwa mpangilio wa kawaida wa Kiswahili, ikihifadhi jumla kamili ya 54,400. “Watu” imeongezwa kwa uwazi wa kawaida wa Kiswahili kutokana na wale waliohesabiwa.
