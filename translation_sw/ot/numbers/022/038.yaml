  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל בָּלָ֗ק הִֽנֵּה בָ֨אתִי֙ אֵלֶ֔י/ךָ עַתָּ֕ה הֲ/יָכ֥וֹל אוּכַ֖ל דַּבֵּ֣ר מְא֑וּמָה הַ/דָּבָ֗ר אֲשֶׁ֨ר יָשִׂ֧ים אֱלֹהִ֛ים בְּ/פִ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/038.yaml
  text: And Balaam said to Balak[a], “Look, I have come to you now. Am I really able to speak anything at all? I will speak only the word that God puts in my mouth.”
translation:
  language: sw
  text: Balaamu akamwambia Balaki, “Tazama, sasa nimekuja kwako. Je, kweli ninaweza kusema chochote? Neno ambalo Mungu ataweka kinywani mwangu, ndilo nitakalosema.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linatanguliza jibu la Balaamu kwa msisitizo na kuhifadhi nguvu ya kuelekeza uangalifu kwa lugha ya Kiswahili yenye hadhi.
- source_word: בָאתִי אֵלֶיךָ עַתָּה
  choice: sasa nimekuja kwako
  rationale: Mpangilio huu unasikika kwa kawaida katika Kiswahili na kuhifadhi maana ya kuwasili kwake wakati huo.
- source_word: הֲיָכוֹל אוּכַל
  choice: Je, kweli ninaweza
  rationale: Muundo wa Kiebrania wenye kitenzi-jina na kitenzi kilichonyambuliwa unasisitiza uwezo; “kweli” huwasilisha msisitizo huo katika swali la balagha.
- source_word: דַּבֵּר מְאוּמָה
  choice: kusema chochote
  rationale: “Chochote” huwasilisha maana ya jambo lolote hata kidogo bila kufanya Kiswahili kuwa kizito.
- source_word: הַדָּבָר
  choice: Neno
  rationale: Katika muktadha wa usemi wa kinabii, “Neno” huhifadhi umoja wa usemi maalumu anaopokea kutoka kwa Mungu.
- source_word: יָשִׂים אֱלֹהִים בְּפִי
  choice: ambalo Mungu ataweka kinywani mwangu
  rationale: Huhifadhi sitiari ya Kiebrania ya Mungu kuweka usemi katika kinywa cha msemaji.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: ndilo nitakalosema
  rationale: Kiwakilishi cha msisitizo “ndilo” huonyesha kwamba Balaamu atasema neno hilo, wala si jingine, bila kulazimika kuongeza neno lisilokuwapo wazi katika Kiebrania.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi chake ni cha umoja, na muktadha unamtaja Mungu anayempa Balaamu usemi; kwa hiyo umoja “Mungu” unafaa.
theological_decisions:
- issue: Udhibiti wa Mungu juu ya usemi wa Balaamu
  choice: Balaamu anakiri kwamba hawezi kusema atakavyo, bali atasema neno ambalo Mungu ataweka kinywani mwake.
  alternative: Balaamu ana uwezo wa kusema chochote anachotaka lakini anajizuia kwa hiari.
  rationale: Swali lenye msisitizo pamoja na “ndilo nitakalosema” linaonyesha usemi uliowekewa mipaka na Mungu. Tafsiri inadumisha mvutano huo bila kueleza kupita kiasi utendaji wa uvuvio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. “Tazama” limetumiwa kwa sauti ya kibiblia isiyo ya kizamani kupita kiasi, na “ndilo” huhifadhi msisitizo wa kishairi na wa kinabii.
