  yaml_path: translation/ot/numbers/022/021.yaml
  text: So Balaam rose in the morning[a], saddled his donkey, and went with the princes of Moab.
translation:
  language: sw
  text: Basi Balaamu akaamka asubuhi, akamwekea punda wake[a] tandiko, akaenda pamoja na wakuu wa Moabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “punda-jike wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaamka
  rationale: Kitenzi קום katika mfuatano wa simulizi kinaonyesha kuamka au kuinuka; “akaamka” ni cha kawaida na kinafaa katika muktadha wa asubuhi.
- source_word: בִּלְעָם
  choice: Balaamu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: בַּבֹּקֶר
  choice: asubuhi
  rationale: Kirai hiki kinamaanisha “asubuhi”; hakisemi wazi “alfajiri” au “mapema sana.”
- source_word: וַיַּחֲבֹשׁ
  choice: akamwekea ... tandiko
  rationale: חבש ikitumiwa kuhusu punda humaanisha kumwandaa kwa ajili ya kupandwa kwa kumwekea tandiko; usemi huu ni wazi na wa asili katika Kiswahili.
- source_word: אֶת אֲתֹנוֹ
  choice: punda wake
  rationale: אָתוֹן humaanisha hasa punda-jike. “Punda wake” ni usemi wa kawaida katika matini kuu, huku jinsia ya mnyama ikihifadhiwa katika tanbihi.
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: הלך katika simulizi rahisi humaanisha kwenda; “akaenda” haiongezi wazo lisilotajwa wazi la kuanza safari.
- source_word: עִם
  choice: pamoja na
  rationale: Hutoa kwa kawaida maana ya kuandamana na wengine.
- source_word: שָׂרֵי מוֹאָב
  choice: wakuu wa Moabu
  rationale: שָׂרִים inaweza kumaanisha wakuu, watawala, au maafisa wenye cheo. “Wakuu” ni ya asili, yenye hadhi, na haidai kwamba wote walikuwa wana wa kifalme.
