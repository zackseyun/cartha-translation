translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. Kiunganishi “Basi” kinaendeleza mfuatano wa matukio, na vitenzi vya “aka-” vinahifadhi mwendo wa simulizi la Kiebrania.
