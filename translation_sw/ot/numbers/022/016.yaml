base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/016.yaml
  text: 'They came to Balaam and said to him[a], “Thus says Balak son of Zippor: Please do not refrain from coming to me.”'
translation:
  language: sw
  text: 'Wakafika kwa Balaamu, wakamwambia, “Balaki mwana wa Sipori asema hivi: Tafadhali, usikatae kuja kwangu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל בִּלְעָם
  choice: Wakafika kwa Balaamu
  rationale: בוא בהקשר זה מתאר את הגעת השליחים אל בלעם. Kiswahili cha kawaida hutumia ‘kufika kwa mtu’ kwa maana ya kufika mahali alipo; ‘wakaja kwa’ pia ingewezekana lakini si laini sawa katika simulizi hili.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: wakamwambia
  rationale: Muundo huu wa Kiswahili unaunganisha kwa kawaida kitenzi ‘sema’ na yule anayeelekezewa maneno, huku ukihifadhi mfuatano wa simulizi.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Hii ni fomula ya ujumbe. Wakati wa sasa unawakilisha ujumbe wa Balaki kama unaowasilishwa sasa, na ‘hivi’ hutanguliza maneno yake kwa Kiswahili cha kawaida.
- source_word: בָּלָק בֶּן צִפּוֹר
  choice: Balaki mwana wa Sipori
  rationale: Majina yamenukuliwa kwa tahajia iliyozoeleka katika Kiswahili; uhusiano wa construct umetafsiriwa moja kwa moja kuwa ‘mwana wa’.
- source_word: אַל נָא
  choice: Tafadhali, usi-
  rationale: אַל huleta katazo na נָא huongeza ombi la heshima au kusihi; ‘Tafadhali, usi-’ huwasilisha nguvu zote mbili kwa lugha ya sasa.
- source_word: תִמָּנַע מֵהֲלֹךְ
  choice: usikatae kuja
  rationale: מנע pamoja na infinitive hapa ina maana ya kujizuia, kukataa, au kutoruhusu jambo litendeke. ‘Usikatae kuja’ ni ombi la kawaida na wazi kwa Kiswahili, bila kulazimisha sitiari isiyo ya kawaida ya ‘kujizuia kutoka kuja’.
- source_word: אֵלָי
  choice: kwangu
  rationale: Kiwakilishi cha mwelekeo ‘kwangu’ kinaonyesha kwenda au kuja mahali alipo msemaji, na kinaendana kwa kawaida na ‘kuja’.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa ujumbe ‘asema hivi’ umehifadhiwa, lakini sentensi imewekwa kwa mpangilio wa kawaida wa Kiswahili. Hakuna tanbihi iliyohitajika kwa sababu ‘kuja kwangu’ huwasilisha kwa kawaida mtazamo wa msemaji, ingawa הלך kimsingi ni kitenzi cha kwenda/kutembea.
