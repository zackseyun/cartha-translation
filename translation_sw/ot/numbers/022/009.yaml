  yaml_path: translation/ot/numbers/022/009.yaml
  text: Then God came to Balaam and said, “Who are these men with you?”
translation:
  language: sw
  text: Kisha Mungu akamjia Balaamu, akasema, “Wanaume hawa walio pamoja nawe ni nani?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akamjia
  rationale: Kitenzi בוא katika mfuatano huu wa simulizi kina maana ya ‘alikuja’; Kiswahili ‘akamjia’ kinaonyesha kwa kawaida kwamba Mungu alikuja kwa Balaamu bila kuongeza wazo la kuingia mahali fulani.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu, pamoja na kitenzi cha umoja, neno hili linamtaja Mungu kama mhusika mmoja.
- source_word: אֶל בִּלְעָם
  choice: kwa Balaamu
  rationale: Kihusishi אֶל kinaonyesha mwelekeo kwa Balaamu; maana hiyo imejumuishwa kwa kawaida katika ‘akamjia Balaamu.’
- source_word: בִּלְעָם
  choice: Balaamu
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: וַיֹּאמֶר
  choice: na kusema
  rationale: אמר hutambulisha usemi wa moja kwa moja. Muundo huu unaungana kwa ufasaha na ‘akamjia’ na kuhifadhi mfuatano wa simulizi.
- source_word: מִי
  choice: ni nani
  rationale: Kiulizi hiki kinataka utambulisho wa watu, hivyo ‘ni nani’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: הָאֲנָשִׁים
  choice: watu
  rationale: Neno אֲנָשִׁים hapa linawataja wajumbe wanaume, lakini katika swali la Kiswahili ‘hawa watu ... ni nani?’ ni la kawaida na halibadili utambulisho wao katika muktadha.
- source_word: הָאֵלֶּה
  choice: hawa
  rationale: Kionyeshi hiki kinawarejelea watu mahususi waliopo pamoja na Balaamu.
- source_word: עִמָּךְ
  choice: walio pamoja nawe
  rationale: עם pamoja na kiambishi cha nafsi inaonyesha ushirika au uwepo pamoja; ‘pamoja nawe’ ni Kiswahili cha kawaida na chenye heshima.
- source_word: וַ
  choice: Kisha
  rationale: Waw inayotangulia kitenzi inasukuma simulizi mbele; ‘Kisha’ huonyesha mfuatano kwa Kiswahili cha sasa.
theological_decisions:
- issue: Mhusika anayetajwa na אֱלֹהִים katika simulizi la Balaamu
  choice: Mungu
  alternative: mungu fulani; kiumbe cha kimungu
  rationale: Upatanisho wa kitenzi cha umoja na muktadha wa simulizi unaonyesha kwamba ni Mungu anayesema na Balaamu. Tafsiri ‘Mungu’ haitoi madai ya ziada zaidi ya utambulisho unaokusudiwa katika kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa, cha heshima na kinachoeleweka kwa urahisi. Muundo ‘akamjia Balaamu’ ni wa asili zaidi kuliko ‘alikuja kwa Balaamu,’ na swali limepangwa kwa mtiririko wa kawaida wa Kiswahili.
