base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/026.yaml
  text: Then the angel of Yahweh went farther and stood in a narrow place[a], where there was no way to turn to the right or to the left.
translation:
  language: sw
  text: Kisha malaika wa Yahwe akaendelea mbele[a], akasimama mahali penye nafasi finyu ambapo hapakuwa na nafasi ya kugeukia kulia wala kushoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akasonga mbele zaidi” au “akapita mbele.” Nahau ya Kiebrania ina maana ya kuendelea kwenda mbele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף ... עֲבוֹר
  choice: akaendelea mbele
  rationale: Muundo wa יסף pamoja na kitenzi-jina עֲבוֹר una maana ya kuendelea kwenda. “Akaendelea mbele” ni Kiswahili cha kawaida kinachohifadhi mwendelezo wa mwendo katika simulizi.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahwe
  rationale: Katika simulizi hili מַלְאַךְ anamrejelea mjumbe wa kimbingu, hivyo “malaika” inafaa. Jina la Mungu יְהוָה limetolewa kama “Yahwe,” umbo linalotamkika kwa kawaida katika Kiswahili.
- source_word: וַיַּעֲמֹד
  choice: akasimama
  rationale: עמד hapa humaanisha kusimama au kuchukua mahali pa kusimama; “akasimama” ni sahihi na ya moja kwa moja.
- source_word: בְּמָקוֹם צָר
  choice: mahali pembamba
  rationale: Kirai hiki kinaeleza eneo lililobanwa au lenye upana mdogo; “mahali pembamba” kinahifadhi taswira hiyo ya mahali halisi.
- source_word: אֲשֶׁר אֵין דֶּרֶךְ לִנְטוֹת
  choice: ambapo hapakuwa na nafasi ya kugeukia
  rationale: Maana ya muktadha si kwamba hakukuwa na njia kabisa, bali kwamba hakukuwa na nafasi ya kukwepa upande wowote. Tafsiri hii inaweka wazi jambo hilo bila kuongeza wazo jipya.
- source_word: יָמִין וּשְׂמֹאול
  choice: kulia wala kushoto
  rationale: “Kulia wala kushoto” ni muundo wa asili wa Kiswahili baada ya kishazi hasi na unaonyesha pande zote mbili.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina maalumu la agano יְהוָה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, na umbo hili linaendana na matamshi ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa urahisi. Mfuatano wa “aka-” umetumika kuonyesha hatua zinazofuatana katika simulizi.
