base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/019.yaml
  text: Now please stay here tonight[a], you also, so that I may know what more Yahweh will say to me.
translation:
  language: sw
  text: Sasa, tafadhali ninyi pia kaeni hapa usiku huu, ili nipate kujua ni jambo gani lingine Yahwe atakaloniambia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe atasema nini zaidi nami?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sasa
  rationale: Ni kiashiria cha mazungumzo kinachoanzisha agizo linalofuata; “Sasa” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: שְׁבוּ נָא
  choice: tafadhali ... kaeni
  rationale: Katika muktadha huu ישׁב humaanisha kukaa au kubaki mahali, si kitendo cha kuketi tu; נָא imewasilishwa kwa “tafadhali.”
- source_word: בָזֶה
  choice: hapa
  rationale: Ina maana ya mahali katika muktadha huu, na “hapa” ni tafsiri fupi na ya asili.
- source_word: גַּם אַתֶּם
  choice: ninyi pia
  rationale: Inadumisha msisitizo wa nyongeza kwamba wajumbe hawa pia wabaki, kama kundi la awali.
- source_word: הַלָּיְלָה
  choice: usiku huu
  rationale: Ni kish accusative cha wakati kinachorejelea usiku unaokuja; “usiku huu” ni wazi na cha kawaida.
- source_word: וְאֵדְעָה
  choice: nami nitajua
  rationale: Cohortative ya Kiebrania inaweza kuonyesha kusudi au matokeo. Kiswahili hiki huunganisha kukaa kwao na kujua kwa Balaamu bila kufanya sentensi kuwa nzito.
- source_word: מַה יֹּסֵף
  choice: ni jambo gani lingine
  rationale: Muundo wenye יסף unaonyesha jambo la ziada; “jambo gani lingine” hudumisha maana hiyo kwa Kiswahili cha asili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: דַּבֵּר עִמִּי
  choice: atakaloniambia
  rationale: Ingawa kwa karibu zaidi ni “atakachosema nami/kwangu,” muktadha unalenga ujumbe ambao Balaamu atapokea; “atakaloniambia” ni wa asili na hudumisha maana hiyo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kwa namna inayolingana na tahajia ya kawaida ya Kiswahili.
- issue: Kiwango cha mazungumzo kinachodokezwa na דַּבֵּר עִמִּי
  choice: atakaloniambia
  alternative: atakachosema nami; atakachoniambia zaidi
  rationale: Tafsiri haipaswi kudokeza kwa lazima mazungumzo ya pande mbili; katika muktadha Balaamu anasubiri ujumbe mwingine kutoka kwa Yahwe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio “ninyi pia” unahifadhi msisitizo wa Kiebrania; tanbihi inaonyesha tafsiri ya karibu zaidi ya מַה יֹּסֵף ... דַּבֵּר עִמִּי.
