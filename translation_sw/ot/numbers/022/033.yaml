base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/033.yaml
  text: The donkey saw me and turned aside before me these three times. If she had not turned aside from before me[a], surely by now I would have killed you and let her live.
translation:
  language: sw
  text: Punda jike aliniona, naye akakengeuka mbele yangu mara hizi tatu. Kama asingekengeuka kutoka mbele yangu[a], hakika kufikia sasa ningekuwa nimekuua wewe, naye ningemwacha hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa tafsiri ya neno kwa neno ni, “labda alikengeuka kutoka mbele yangu.” Kwa kawaida kishazi hiki hueleweka kuwa hali isiyotimia: “kama asingekengeuka kutoka mbele yangu,” maana inayolingana na muktadha na kauli inayofuata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאַנִי
  choice: aliniona
  rationale: Kitenzi ראה hapa kinaeleza kuona kwa macho moja kwa moja; “aliniona” ni tafsiri ya kawaida na wazi.
- source_word: הָאָתוֹן
  choice: punda
  rationale: Nomino אָתוֹן humaanisha punda jike. Kiswahili cha kawaida kinaweza kutumia “punda,” huku marejeo ya baadaye kwa “yeye” yakitosha katika muktadha; “punda jike” si lazima hapa.
- source_word: וַתֵּט לְפָנַי
  choice: akakengeuka mbele yangu
  rationale: נטה hapa ni kugeuka au kukengeuka kutoka njia iliyokusudiwa. “Mbele yangu” hudumisha uhusiano wa mahali unaoonyeshwa na לְפָנַי.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: mara hizi tatu
  rationale: Ni usemi wa Kiebrania unaomaanisha matukio matatu; “mara hizi tatu” ni Kiswahili cha asili na hudumisha msisitizo wa matukio yaliyotokea.
- source_word: אוּלַי נָטְתָה מִפָּנַי
  choice: Kama asingekengeuka kutoka mbele yangu
  rationale: 'Ingawa אוּלַי kwa kawaida ni “labda,” mantiki ya simulizi na kishazi kinachofuata vinahitaji hali isiyotimia: kukengeuka kwa punda kulizuia kuuawa kwa Balaamu. Ukanushi unawekwa wazi katika Kiswahili, na jambo hilo linaandikwa katika tanbihi.'
- source_word: כִּי עַתָּה
  choice: hakika kufikia sasa
  rationale: Kirai hiki kinaonyesha msisitizo pamoja na wakati wa matokeo; “hakika kufikia sasa” huleta nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: גַּם אֹתְךָה הָרַגְתִּי
  choice: ningekuwa nimekuua wewe
  rationale: Kauli timilifu ina thamani ya tokeo la hali isiyotimia. “Wewe” hudumisha msisitizo wa גַּם na utofautishaji kati ya Balaamu na punda.
- source_word: וְאֹתָהּ הֶחֱיֵיתִי
  choice: lakini yeye ningemwacha hai
  rationale: Hifili ya חיה humaanisha kumwacha au kumweka hai. “Lakini” huonyesha wazi utofautishaji uliomo kati ya kuuawa kwa Balaamu na kuachwa hai kwa punda.
theological_decisions:
- issue: Kishazi cha hali isiyotimia ingawa hakuna ukanushi wa wazi baada ya אוּלַי katika maandishi yaliyopokelewa
  choice: Kama asingekengeuka kutoka mbele yangu
  alternative: Labda alikengeuka kutoka mbele yangu
  rationale: Mtiririko wa simulizi unaonyesha kwamba kukengeuka kwa punda ndiko kulikozuia Balaamu kuuawa. Tafsiri ya neno kwa neno bila ukanushi ingetoa maana inayokinzana na tokeo linalofuata. Ukanushi unaohitajika na maana unawekwa katika matini, huku hali halisi ya Kiebrania ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kwa urahisi wa kusomeka kwa sauti, huku ikihifadhi tofauti ya mahali kati ya “mbele yangu” na “kutoka mbele yangu,” pamoja na utata wa kishazi cha Kiebrania katika tanbihi.
