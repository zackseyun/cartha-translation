base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/007.yaml
  text: So the elders of Moab and the elders of Midian went[a], with divination fees in their hands, and they came to Balaam and spoke to him the words of Balak.
translation:
  language: sw
  text: Basi wazee wa Moabu na wazee wa Midiani wakaenda, wakiwa na malipo ya uaguzi mikononi mwao.[a] Walifika kwa Balaamu na kumwambia maneno ya Balaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiwa na matendo au vitu vya uaguzi mikononi mwao.” Usemi wa Kiebrania unaweza kurejelea uaguzi au vitu vinavyohusishwa nao, au—kama inavyoelekea zaidi katika muktadha huu—malipo yaliyoletwa kwa ajili ya uaguzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: wazee wa
  rationale: Katika muundo huu neno hilo linamaanisha wazee wanaotambuliwa kuwa na mamlaka katika jamii; “wazee wa” huhifadhi cheo hicho cha kijamii na kisiasa.
- source_word: וּקְסָמִים בְּיָדָם
  choice: wakiwa wamebeba malipo ya uaguzi mikononi mwao
  rationale: קְסָמִים linaweza kumaanisha uaguzi au vitu vinavyotumiwa katika uaguzi, lakini katika muktadha huu yaelekea linarejelea malipo yaliyoletwa ili kupata huduma ya Balaamu. Tanbihi huhifadhi uwezekano mwingine wa Kiebrania.
- source_word: וַיָּבֹאוּ אֶל
  choice: Walifika kwa
  rationale: בוא pamoja na אֶל huonyesha kufika kwa mtu. “Walifika kwa” ni Kiswahili cha kawaida na huepuka kurudia “wakaenda.”
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: na kumwambia
  rationale: דבר pamoja na אֶל humaanisha kusema au kuzungumza na mtu. “Kumwambia” ni ya asili hapa kwa kuwa ujumbe wenyewe unatambulishwa mara moja.
- source_word: דִּבְרֵי בָלָק
  choice: maneno ya Balaki
  rationale: Tafsiri hii huhifadhi maana halisi ya muundo wa Kiebrania bila kuamua kimyakimya kwamba yalikuwa tu “ujumbe” uliofupishwa.
- source_word: וַיֵּלְכוּ
  choice: Basi ... wakaenda
  rationale: Waw-consecutive huendeleza simulizi kutoka mstari uliotangulia; “Basi” huonyesha mwendelezo huo kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. “Malipo ya uaguzi” hueleweka kwa wasomaji wa kawaida, huku tanbihi ikihifadhi utata halisi wa קְסָמִים.
