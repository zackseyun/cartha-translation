base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/041.yaml
  text: And in the morning Balak took Balaam and brought him up to Bamoth-baal[b][a], and from there he saw the edge of the people.
translation:
  language: sw
  text: Asubuhi, Balaki akamchukua Balaamu, akampandisha hadi Bamoth-Baali[a], na kutoka huko Balaamu akaona sehemu ya pembezoni mwa watu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pa juu pa Baali,” ikiwa maneno hayo yanaeleweka kama maelezo badala ya jina la mahali, Bamoth-Baali.
    reason: lexical_alternative
  - marker: b
    text: Yaani, kutoka huko aliona tu sehemu ya nje kabisa ya Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Asubuhi
  rationale: Huweka mazingira ya wakati kwa Kiswahili cha kawaida bila kulazimisha fomula ya masimulizi ya Kiebrania kuwa ‘ikawa asubuhi.’
- source_word: וַיִּקַּח
  choice: akamchukua
  rationale: Kitenzi לקח kwa kawaida humaanisha ‘kuchukua’; hapa Balaki anamchukua Balaamu kwenda naye mahali pengine.
- source_word: וַיַּעֲלֵהוּ
  choice: akampandisha hadi
  rationale: Hifili ya עלה ina maana ya kumsababisha mtu apande au kumpeleka juu; ‘akampandisha’ huhifadhi maana hiyo ya kisababishi na mwinuko wa mahali.
- source_word: בָּמוֹת בָּעַל
  choice: Bamoth-baali
  rationale: Katika muktadha huu maneno hayo yanafanya kazi kama jina la mahali. Umbo la ‘Baali’ linafuata uandikaji wa kawaida wa jina hilo katika Kiswahili, huku kistari kikihifadhi muundo wa jina ambatani.
- source_word: וַיַּרְא
  choice: Balaamu akaona
  rationale: ראה ni kitenzi cha kawaida cha ‘kuona.’ Kiebrania kina kiwakilishi kisichotaja jina, lakini kumtaja Balaamu katika Kiswahili huondoa utata wa kisarufi usiokusudiwa; muktadha unaonyesha ndiye aliyeletwa ili awaone watu.
- source_word: מִשָּׁם
  choice: kutoka huko
  rationale: Hueleza moja kwa moja mahali aliposimama alipotazama.
- source_word: קְצֵה הָעָם
  choice: sehemu ya mwisho ya watu
  rationale: קצה humaanisha mwisho, ukingo, au sehemu ya nje kabisa. Tafsiri hii inadumisha neno ‘watu’ badala ya kuongeza ‘kambi,’ na inaonyesha kwamba ni sehemu yao ya nje tu iliyoonekana.
