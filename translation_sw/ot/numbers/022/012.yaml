base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/012.yaml
  text: And God said to Balaam[a], “You must not go with them. You must not curse the people, because it is blessed.”
translation:
  language: sw
  text: Mungu akamwambia Balaamu, “Usiende pamoja nao. Usiwalaani watu hao, kwa sababu wamebarikiwa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kina umoja: “kwa sababu amebarikiwa,” kikirejelea watu hao kama jamii moja.'
    reason: Kuhifadhi taarifa kuhusu umoja wa kisarufi wa Kiebrania ambao Kiswahili cha kawaida huutoa kwa upatanisho wa wingi.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa masimulizi wenye waw-consecutive unaendeleza tukio; “akamwambia” ni wa kawaida na wenye hadhi katika masimulizi ya Kiswahili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno linamtaja Mungu wa kweli anayesema moja kwa moja na Balaamu.
- source_word: לֹא תֵלֵךְ
  choice: Usiende
  rationale: Imperfecti yenye לֹא hapa ni katazo la moja kwa moja; “usiende” huwasilisha nguvu hiyo kwa Kiswahili cha sasa bila uzito usio wa lazima.
- source_word: עִמָּהֶם
  choice: pamoja nao
  rationale: Huwataja wajumbe wa Balaki na kutafsiri wazi maana ya kwenda pamoja nao.
- source_word: לֹא תָאֹר
  choice: Usiwalaani
  rationale: אָרַר humaanisha kulaani, na umbo hili ni katazo; kiambishi “-wa-” kinawarejelea watu hao kwa kawaida katika Kiswahili.
- source_word: אֶת הָעָם
  choice: watu hao
  rationale: הָעָם inarejelea Israeli kama jamii moja. “Watu hao” ni rejeo la asili katika Kiswahili kwa kundi lililotajwa katika muktadha, bila kulifanya kuwa mtu mmoja.
- source_word: כִּי
  choice: kwa sababu
  rationale: Huanzisha sababu ya makatazo hayo; “kwa sababu” ni kiunganishi wazi na cha kawaida.
- source_word: בָרוּךְ הוּא
  choice: wamebarikiwa
  rationale: Kiebrania kina umoja wa kisarufi kwa sababu הָעָם ni nomino ya jamii; Kiswahili huwakilisha “watu” kwa upatanisho wa wingi, hivyo “wamebarikiwa” ndilo tamko la kawaida bila kubadili rejeo la jamii.
theological_decisions:
- issue: Rejeo na idadi katika kishazi “amebarikiwa/wamebarikiwa”
  choice: “wamebarikiwa,” likiwataja watu wa Israeli kwa ujumla
  alternative: “amebarikiwa,” kwa kufuata umoja wa kisarufi wa Kiebrania kwa ukaribu zaidi
  rationale: בָרוּךְ הוּא ni umoja na hurejelea הָעָם, nomino ya jamii. Kwa kuwa “watu” katika Kiswahili hutumia upatanisho wa wingi, “wamebarikiwa” huhifadhi rejeo hilo kwa Kiswahili cha asili bila kuashiria mtu mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Makatazo yametolewa kwa “usi-,” ambayo ni wazi na ya kawaida; sentensi inaendelea kwa mtindo wa masimulizi ya Biblia bila kutumia lugha ya kizamani.
