base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/020.yaml
  text: God came to Balaam at night and said to him[a], “If the men have come to call you, rise, go with them; but only the word that I speak to you[b], that you shall do.”
translation:
  language: sw
  text: Mungu akamjia Balaamu usiku, akamwambia, “Ikiwa watu hao wamekuja kukuita[a], inuka, uende pamoja nao; lakini ni neno lile tu nitakalokuambia[b] ndilo utakachofanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa watu hao walikuja kukuita.”
    reason: Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa hali timilifu au kwa wakati uliopita katika muktadha huu.
  - marker: b
    text: Au, “jambo lile tu nitakalokuambia.”
    reason: Neno la Kiebrania דָּבָר linaweza kumaanisha “neno” au “jambo.”
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akamjia
  rationale: Kitenzi בוא kinaonyesha kwamba Mungu alimjia Balaamu; tafsiri hii haiongezi wazo la kutokea katika maono, ambalo halijaelezwa katika maandishi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Maandishi ya Kiebrania hapa yanatumia אֱלֹהִים, si jina la Mungu יהוה, kwa hiyo tofauti hiyo imehifadhiwa.
- source_word: לַיְלָה
  choice: usiku
  rationale: Huu ni usemi wa kawaida na wa asili wa Kiswahili unaoonyesha wakati wa tukio.
- source_word: אִם לִקְרֹא לְךָ בָּאוּ הָאֲנָשִׁים
  choice: Ikiwa watu hao wamekuja kukuita
  rationale: לקרוא לך katika muktadha huu ni kuja kumwita au kumchukua Balaamu; 'kukuita' ni ya asili na inabaki karibu na Kiebrania.
- source_word: קוּם לֵךְ
  choice: inuka, uende
  rationale: Amri mbili za Kiebrania zimehifadhiwa badala ya kuunganishwa kuwa amri moja.
- source_word: אִתָּם
  choice: pamoja nao
  rationale: Hii inatoa moja kwa moja maana ya kwenda katika ushirika wao.
- source_word: וְאַךְ
  choice: lakini ... tu
  rationale: 'Muundo huu unaonyesha kizuizi chenye mkazo: Balaamu anaweza kwenda, lakini lazima afanye kile Mungu atakachosema pekee.'
- source_word: הַדָּבָר
  choice: neno lile
  rationale: דָּבָר inaweza kuwa 'neno' au 'jambo'; hapa kitenzi kinachofuata, 'nitakalokuambia,' kinaunga mkono maana ya ujumbe unaosemwa.
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: nitakalokuambia
  rationale: Wakati ujao unafaa kwa sababu Mungu anamwelekeza Balaamu kuhusu kile atakachomwambia baadaye; 'kuambia' ni ya asili kwa Kiswahili.
- source_word: אֹתוֹ תַעֲשֶׂה
  choice: ndilo utakallofanya
  rationale: Muundo wa 'ndilo' unahifadhi msisitizo wa Kiebrania juu ya jambo hilo pekee na sauti ya amri.
theological_decisions:
- issue: Jina la Mungu katika aya hii
  choice: Mungu
  alternative: BWANA
  rationale: Aya hii ina אֱלֹהִים, si יהוה; kwa hiyo tafsiri haipatanishi jina hili kimakusudi na matumizi ya 'BWANA' katika muktadha wa karibu.
- issue: Kiwango cha ruhusa aliyopewa Balaamu
  choice: lakini ni neno lile tu ... ndilo utakallofanya
  alternative: lakini utafanya lolote nitakalokuambia
  rationale: Tafsiri iliyochaguliwa inadumisha kizuizi na msisitizo wa maandishi bila kupanua au kupunguza ruhusa ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo wa amri na msisitizo wa kitu kinachopaswa kufanywa umehifadhiwa.
