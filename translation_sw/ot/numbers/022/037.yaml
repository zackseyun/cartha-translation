base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/037.yaml
  text: And Balak said to Balaam[c][b][a], “Did I not indeed send to you to call you? Why did you not come to me? Am I really not able to honor you?”
translation:
  language: sw
  text: Balaki akamwambia Balaamu, “Je, sikutuma wajumbe kwako kwa hakika ili wakuite?[a] Kwa nini hukuja kwangu?[b] Kwani kweli siwezi kukupa heshima?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinakazia tendo la kutuma kwa kutumia kitenzi kisicho na kikomo pamoja na kitenzi kamili. Katika muktadha, mkazo huo unaweza pia kueleweka kuwa Balaki alituma mara kwa mara au kwa msisitizo mkubwa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “Kwa nini hukwenda kwangu?”
    reason: lexical_alternative
  - marker: c
    text: “Kukupa heshima” kunaweza kujumuisha kumpa mtu thawabu au hadhi ya juu, wala si kumwonyesha heshima tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo huu unaendeleza simulizi kwa Kiswahili cha kawaida na pia unaonyesha kwamba maneno yanayofuata yalimwelekea Balaamu.
- source_word: הֲלֹא
  choice: Je, siku-
  rationale: Swali kanushi linatarajia jibu la kukubali; muundo wa Kiswahili “Je, siku-?” una nguvu hiyo ya balagha.
- source_word: שָׁלֹחַ שָׁלַחְתִּי
  choice: sikutuma watu kwako kwa hakika
  rationale: Kitenzi kisicho na kikomo kinachofuatwa na kitenzi kilichopinda kinakazia tendo la kutuma. “Kwa hakika” huhifadhi mkazo bila kuamua kwamba kutuma kulikuwa kwa haraka au kulirudiwa. “Watu” imewekwa wazi kwa ufasaha wa Kiswahili kutokana na muktadha wa wajumbe wa Balaki.
- source_word: לִקְרֹא לָךְ
  choice: ili wakuitie
  rationale: Katika muktadha huu קרא ni kumwita au kumleta mtu kwa wito; “wakuitie” ni lugha ya kawaida na inaonyesha kusudi la wajumbe.
- source_word: לָמָּה לֹא הָלַכְתָּ אֵלָי
  choice: Kwa nini hukuja kwangu?
  rationale: Ingawa הלך kimsingi ni “kwenda,” kutoka kwa mtazamo wa Balaki usemi wa asili wa Kiswahili ni “kuja kwangu.”
- source_word: הַאֻמְנָם
  choice: Kwani kweli
  rationale: Maneno haya yanaonyesha swali la kusisitiza lenye mshangao au kutokuamini kwa Balaki.
- source_word: לֹא אוּכַל כַּבְּדֶךָ
  choice: siwezi kukupa heshima
  rationale: יכל inaonyesha uwezo, na כבד katika muundo huu ni kumpa mtu heshima. “Kukupa heshima” hubaki pana vya kutosha kujumuisha cheo, hadhi, au thawabu bila kuibana maana kuwa malipo pekee.
