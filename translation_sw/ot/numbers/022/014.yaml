  text: So the officials of Moab got up and went to Balak, and said, “Balaam refused to go with us.”
translation:
  language: sw
  text: Basi wakuu wa Moabu wakaondoka, wakaenda kwa Balaki na kusema, “Balaamu amekataa kwenda pamoja nasi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי מוֹאָב
  choice: maofisa wa Moabu
  rationale: Neno שָׂרִים hapa linamaanisha watu wenye cheo waliotumwa na Balaki; “maofisa” ni la kawaida na haliongezi dhana maalumu ya kifalme.
- source_word: וַיָּק֨וּמוּ
  choice: wakaondoka
  rationale: Ingawa kimsingi ni “wakainuka,” katika muktadha huu kitenzi kinaanzisha kuondoka kwao; “wakaondoka” ni Kiswahili cha asili na huhifadhi mwendo wa simulizi.
- source_word: מֵאֵן
  choice: amekataa
  rationale: Huonyesha kukataa kwa dhati; kauli ya wakati timilifu inafaa katika taarifa yao kwa Balaki.
- source_word: הֲלֹךְ עִמָּנוּ
  choice: kwenda pamoja nasi
  rationale: Huhifadhi wazi maana ya kwenda akiandamana nao.
