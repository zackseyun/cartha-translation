source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל מַלְאַ֤ךְ יְהוָה֙ חָטָ֔אתִי כִּ֚י לֹ֣א יָדַ֔עְתִּי כִּ֥י אַתָּ֛ה נִצָּ֥ב לִ/קְרָאתִ֖/י בַּ/דָּ֑רֶךְ וְ/עַתָּ֛ה אִם רַ֥ע בְּ/עֵינֶ֖י/ךָ אָשׁ֥וּבָה לִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/034.yaml
  text: Then Balaam said to the angel of Yahweh[a], “I have sinned, for I did not know that you were standing to confront me on the road. And now, if it is evil in your eyes[b], I will turn back.”
translation:
  language: sw
  text: Ndipo Balaamu akamwambia malaika wa Yahwe[a], “Nimetenda dhambi, kwa sababu sikujua kwamba ulikuwa umesimama barabarani ili kunikabili. Sasa basi, ikiwa ni baya machoni pako[b], nitarudi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wa Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ikiwa ni baya machoni pako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahwe
  rationale: מַלְאַךְ inaweza kumaanisha ‘mjumbe’ au ‘malaika’; katika muktadha huu kiumbe wa mbinguni anaonekana akiwa na upanga na anamzuia Balaamu, hivyo ‘malaika’ linafaa katika Kiswahili. Jina יהוה limetoholewa kuwa ‘Yahwe’.
- source_word: חָטָאתִי
  choice: Nimetenda dhambi
  rationale: Kauli timilifu inaonyesha kukiri kosa lenye umuhimu wa sasa; ‘nimetenda dhambi’ ni ungamo la kawaida na lenye hadhi katika Kiswahili.
- source_word: כִּי לֹא יָדַעְתִּי
  choice: kwa sababu sikujua
  rationale: כִּי hapa inatoa sababu ya ungamo la Balaamu; tafsiri hii ni wazi na ya kawaida.
- source_word: נִצָּב לִקְרָאתִי
  choice: ulikuwa umesimama barabarani ili kunikabili
  rationale: נִצָּב huonyesha kusimama au kujiweka mahali, na לִקְרָאתִי hapa ina nguvu ya upinzani kutokana na muktadha wa upanga uliofutwa; ‘kunikabili’ huhifadhi nguvu hiyo bila kuongeza maana kupita kiasi.
- source_word: בַּדָּרֶךְ
  choice: barabarani
  rationale: Ni usemi wa mahali unaoeleza eneo la safari kwa Kiswahili cha kawaida.
- source_word: וְעַתָּה
  choice: Sasa basi
  rationale: Huonyesha mpito kutoka ungamo hadi pendekezo la Balaamu, kwa lugha ya moja kwa moja na ya sasa.
- source_word: אִם רַע בְּעֵינֶיךָ
  choice: ikiwa jambo hili ni baya machoni pako
  rationale: Huhifadhi nahau ya Kiebrania ‘baya machoni pako’ pamoja na uzito wake wa kimaadili; ‘jambo hili’ huweka wazi kiwakilishi kilichodokezwa bila kuamua kwa lazima ikiwa kinarejelea safari au mwenendo mzima.
- source_word: אָשׁוּבָה לִּי
  choice: nitarudi
  rationale: Kitenzi cha kohotativi kinaonyesha nia au utayari wa Balaamu kurudi. ‘Nitarudi’ ni cha asili na huhifadhi mwelekeo wa tendo; dative לִי haihitaji kutafsiriwa kando.
theological_decisions:
- issue: Utafsiri wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia Tetragramatoni, jina la Mungu. ‘Yahwe’ huhifadhi jina hilo kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya upinzani katika לִקְרָאתִי
  choice: ili kunikabili
  alternative: ili kukutana nami
  rationale: Kwa kuwa malaika amesimama njiani akiwa na upanga uliofutwa ili kumpinga Balaamu, ‘kunikabili’ huakisi muktadha huku maana ya msingi ya kwenda kumwelekea mtu ikibaki kutambulika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa usemi wa moja kwa moja umehifadhiwa; nahau ‘baya machoni pako’ imeachwa katika maandishi kwa uaminifu kwa chanzo, huku tanbihi ikionyesha umbo lake halisi.
