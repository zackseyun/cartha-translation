  text: וַ/יַּ֣עַן בִּלְעָ֗ם וַ/יֹּ֨אמֶר֙ אֶל עַבְדֵ֣י בָלָ֔ק אִם יִתֶּן לִ֥/י בָלָ֛ק מְלֹ֥א בֵית֖/וֹ כֶּ֣סֶף וְ/זָהָ֑ב לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּי֙ יְהוָ֣ה אֱלֹהָ֔/י לַ/עֲשׂ֥וֹת קְטַנָּ֖ה א֥וֹ גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/018.yaml
  text: Balaam answered and said to Balak’s servants, “Even if Balak were to give me his house full of silver and gold, I could not go beyond the word of Yahweh my God, to do anything small or great.”
translation:
  language: sw
  text: Balaamu akawajibu watumishi wa Balaki, akasema, “Hata kama Balaki angenipa nyumba yake iliyojaa fedha na dhahabu, singeweza kwenda kinyume na neno la Yahwe Mungu wangu[a][b] kwa kufanya jambo lolote, dogo au kubwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kupita kinywa cha Yahwe Mungu wangu,” yaani kuvuka au kukiuka yale aliyosema.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuvunja amri ya Yahwe Mungu wangu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: akajibu na kuwaambia
  rationale: Inahifadhi muundo wa simulizi wa Kiebrania wenye vitenzi ‘akajibu’ na ‘akasema,’ huku ‘kuwaambia’ ikifanya Kiswahili kiwe cha kawaida na kubainisha walengwa wa maneno.
- source_word: עַבְדֵי
  choice: watumishi
  rationale: Katika muktadha hawa ni wajumbe au watu wa utumishi wa Balaki; ‘watumishi’ ni pana na haidai kwamba walikuwa watumwa wa kumilikiwa.
- source_word: אִם יִתֶּן לִי בָלָק
  choice: Hata kama Balaki angenipa
  rationale: Muundo wa masharti unatumiwa kwa hali ya kudhaniwa na una nguvu ya kukubali jambo kwa hoja; Kiswahili hiki huonyesha kwamba hata zawadi kubwa isingebadili msimamo uliotajwa.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: nyumba yake ikiwa imejaa fedha na dhahabu
  rationale: Inahifadhi picha halisi ya nyumba iliyojaa utajiri na inasomeka kwa kawaida katika Kiswahili.
- source_word: לֹא אוּכַל
  choice: singeweza
  rationale: Kitenzi kinaonyesha kutoweza, si kukataa tu; hali ya masharti katika Kiswahili inalingana na sentensi ya kudhaniwa.
- source_word: לַעֲבֹר אֶת־פִּי
  choice: kupita mipaka ya neno la
  rationale: Kiebrania halisi ni ‘kupita kinywa cha.’ Tafsiri hii inadumisha wazo la kuvuka mpaka wa alichosema Mungu bila kutumia sitiari isiyoeleweka ya ‘kinywa’ katika matini kuu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa jina la Mungu יהוה, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהָי
  choice: Mungu wangu
  rationale: Inawakilisha moja kwa moja kiambishi cha nafsi ya kwanza bila kuongeza dai la kiteolojia lisilotajwa.
- source_word: לַעֲשׂוֹת קְטַנָּה אוֹ גְדוֹלָה
  choice: kwa kufanya jambo dogo au kubwa
  rationale: Inahifadhi jozi ya Kiebrania ‘dogo au kubwa,’ ambayo kwa pamoja humaanisha jambo lolote.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja jina la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kauli ya Balaamu
  choice: kutoweza kupita mipaka ya neno la Mungu
  alternative: kukataa kuasi amri ya Mungu
  rationale: Kiebrania kinatumia kitenzi cha uwezo יכל pamoja na nahau ‘kupita kinywa cha.’ Matini inadumisha kutoweza kulikotamkwa na hailibadili kimya kimya kuwa kukataa kwa hiari tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa usemi wa moja kwa moja na picha ya nyumba iliyojaa utajiri zimehifadhiwa; nahau ya Kiebrania imewasilishwa kwa lugha inayoeleweka huku maana yake halisi ikielezwa katika tanbihi.
