- from: Balaamu akajibu na kuwaambia watumishi wa Balaki, “Hata kama Balaki angenipa nyumba yake ikiwa imejaa fedha na dhahabu, singeweza kupita mipaka ya neno la Yahwe Mungu wangu[a][b] kwa kufanya jambo dogo au kubwa.”
  to: Balaamu akawajibu watumishi wa Balaki, akasema, “Hata kama Balaki angenipa nyumba yake iliyojaa fedha na dhahabu, singeweza kwenda kinyume na neno la Yahwe Mungu wangu[a][b] kwa kufanya jambo lolote, dogo au kubwa.”
  rationale: Revision makes the speech introduction idiomatic while representing both Hebrew narrative verbs, removes the added ‘mipaka’ image, and clarifies that ‘dogo au kubwa’ is a merism by using “jambo lolote.” The conditional force, divine name, and stated inability are retained. Footnote anchors and their content remain valid.
