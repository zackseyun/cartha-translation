  text: וַ/יַּ֥רְא בָּלָ֖ק בֶּן צִפּ֑וֹר אֵ֛ת כָּל אֲשֶׁר עָשָׂ֥ה יִשְׂרָאֵ֖ל לָֽ/אֱמֹרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/002.yaml
  text: Balak son of Zippor saw all that Israel had done to the Amorites[a].
translation:
  language: sw
  text: Balaki mwana wa Sipori akaona yote ambayo Israeli ilikuwa imewatendea Waamori[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Mwamori,” likitumia jina la jamii katika umoja kwa maana ya watu wote; yaani, “Waamori.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: akaona
  rationale: Kiunganishi cha usimulizi וַ pamoja na kitenzi ‘kuona’ kinaendeleza simulizi; ‘akaona’ huwasilisha mwendelezo huo kwa Kiswahili cha kawaida bila kuongeza neno la wakati lisilokuwamo katika Kiebrania.
- source_word: בָּלָק
  choice: Balaki
  rationale: Jina la mtu limetoholewa kwa tahajia inayotumika kwa kawaida katika Kiswahili.
- source_word: בֶּן צִפּוֹר
  choice: mwana wa Sipori
  rationale: Muundo huu unaonyesha ukoo au nasaba; ‘mwana wa Sipori’ ni wa asili na wazi katika Kiswahili.
- source_word: אֵת כָּל אֲשֶׁר
  choice: yote ambayo
  rationale: Muundo huu unaonyesha ujumla wa mambo yanayofuata kama yambwa; ‘yote ambayo’ ni wazi na wa kawaida.
- source_word: עָשָׂה
  choice: ilikuwa imewatendea
  rationale: Wakati timilifu uliopita unaonyesha kwamba matendo ya Israeli yalitangulia kuona kwa Balaki. Kitenzi ‘kutendea’ kinahifadhi uhusiano mpana wa kile kilichofanywa kwa Waamori bila kuufasiri zaidi kuwa ‘dhidi ya’.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa na watu limehifadhiwa kwa umbo la kawaida la Kiswahili; upatanisho wa ngeli katika ‘ilikuwa’ unalitazama kama taifa.
- source_word: לָאֱמֹרִי
  choice: Waamori
  rationale: Nomino ya Kiebrania iko katika umoja wa kijumla, lakini inarejelea jamii nzima; Kiswahili hutumia kwa kawaida wingi wa jina la watu, ‘Waamori’. Uhusiano wa kihusishi umebebwa na kitenzi ‘imewatendea’.
