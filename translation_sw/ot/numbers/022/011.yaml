base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/011.yaml
  text: Look[a], the people who came out of Egypt have covered the face of the land. Now come, curse them for me. Perhaps I will be able to fight against them and drive them out.
translation:
  language: sw
  text: “Tazama, watu waliotoka Misri wamefunika uso wa nchi[a]. Sasa njoo, unilaanie watu hawa. Huenda nitaweza kupigana nao na kuwafukuza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “jicho la nchi,” nahau inayomaanisha sehemu ya nchi inayoonekana, yaani uso wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni neno la kuvuta fikira kwa msisitizo na linafaa katika lugha ya heshima ya simulizi bila kuwa la kizamani kupita kiasi.
- source_word: הָעָם הַיֹּצֵא מִמִּצְרַיִם
  choice: watu waliotoka Misri
  rationale: Kirai husika kinawatambulisha watu hao kwa tukio la kutoka Misri; Kiswahili hutumia kwa kawaida kishazi cha uhusiano cha wakati uliopita.
- source_word: וַיְכַס
  choice: wamefunika
  rationale: Wakati timilifu unaonyesha tendo lililotokea na hali yake inayoendelea wakati wa taarifa hii.
- source_word: עֵין הָאָרֶץ
  choice: uso wa nchi
  rationale: Kiebrania kinasema kihalisi ‘jicho la nchi’; ‘uso wa nchi’ huhifadhi sitiari huku kikitoa maana inayoeleweka ya sehemu ya nchi inayoonekana.
- source_word: עַתָּה לְכָה
  choice: Basi sasa njoo
  rationale: ‘Sasa’ huonyesha mpito wa haraka kwenda kwenye ombi, na ‘njoo’ huhifadhi nguvu ya mwito wa kutenda.
- source_word: קָבָה לִּי אֹתוֹ
  choice: unilaanie watu hawa
  rationale: ‘Unilaanie’ huonyesha kwamba laana inatakiwa itolewe kwa niaba na faida ya msemaji. ‘Watu hawa’ hufanya rejeo la umoja-kikusanyiko lieleweke kwa kawaida katika Kiswahili.
- source_word: אוּלַי אוּכַל
  choice: Huenda nitaweza
  rationale: Huhifadhi hali ya uwezekano au tumaini bila kuifanya kauli kuwa hakika.
- source_word: לְהִלָּחֶם בּוֹ
  choice: kupigana nao
  rationale: Kihusishi kina maana ya kupigana dhidi yao; ‘nao’ ni usemi wa kawaida wa Kiswahili katika muktadha wa vita.
- source_word: וְגֵרַשְׁתִּיו
  choice: na kuwafukuza
  rationale: Kitenzi kina maana ya kuwaondoa kwa nguvu; wingi wa Kiswahili unalingana na maana ya nomino ya kikusanyiko ‘watu’.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi ‘uso wa nchi’ umehifadhiwa, huku maana halisi ya nahau ya Kiebrania ikielezwa katika tanbihi. Alama ya tanbihi [a] imewekwa mara baada ya ‘Tazama’ kwa kufuata safu ya mashauriano ya Kiingereza, ingawa maelezo yake yanahusu kirai ‘uso wa nchi’.
