base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/024.yaml
  text: Then the angel of Yahweh stood in a narrow path between the vineyards[a], with a wall on this side and a wall on that side.
translation:
  language: sw
  text: Ndipo malaika[a] wa Yahweh akasimama katika kijia chembamba kati ya mashamba ya mizabibu, kukiwa na ukuta[b] upande huu na ukuta upande ule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wa Yahweh.” Neno la Kiebrania linaweza kumaanisha “mjumbe” au “malaika,” lakini hapa muktadha wa simulizi unaonyesha kiumbe wa ulimwengu wa roho.
    reason: lexical_alternative
  - marker: b
    text: Au, “ua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Ndipo ... akasimama
  rationale: Muundo wa wayyiqtol unaendeleza simulizi; “Ndipo” huonyesha hatua inayofuata kwa Kiswahili cha kawaida, huku “akasimama” ikihifadhi maana ya msingi ya עמד.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: מַלְאָךְ inaweza kumaanisha mjumbe au malaika; katika muktadha huu kiumbe wa ulimwengu wa roho ndiye anayelengwa, hivyo “malaika” inafaa zaidi, huku tanbihi ikihifadhi maana nyingine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama “Yahweh” badala ya kubadilishwa na cheo.
- source_word: בְּמִשְׁעוֹל הַכְּרָמִים
  choice: katika kijia chembamba kati ya mashamba ya mizabibu
  rationale: מִשְׁעוֹל hurejelea njia au kijia kilichobana; kuta za pande zote mbili zinaonyesha kuwa kijia hiki kilikuwa kati ya mashamba ya mizabibu.
- source_word: גָּדֵר
  choice: ukuta
  rationale: Neno hili hurejelea ukuta au ua unaozunguka eneo. “Ukuta” linafaa katika picha ya njia iliyobanwa, bila kudai kwamba ulijengwa kwa mawe.
- source_word: מִזֶּה וְגָדֵר מִזֶּה
  choice: upande huu na ... upande ule
  rationale: Usemi unaorudiwa unaonyesha wazi kuwa kulikuwa na ukuta kila upande wa kijia na umehifadhiwa kwa mtindo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la Mungu יהוה; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  alternative: mjumbe wa Yahweh
  rationale: Neno la Kiebrania lina maana zote mbili, lakini simulizi linamwonyesha kama kiumbe wa ulimwengu wa roho. Tanbihi inahifadhi uwezekano wa maana ya jumla ya “mjumbe” bila kuingiza utambulisho wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. “Kijia chembamba” kinaeleza mazingira yaliyobana kwa lugha ya kawaida; “ukuta” haitaji nyenzo ambayo maandishi ya Kiebrania hayakutaja.
