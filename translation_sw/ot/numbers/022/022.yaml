base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/022.yaml
  text: But God’s anger burned because he was going[a], and the angel of Yahweh took his stand in the road as an adversary to him. He was riding on his donkey[b], and his two young men were with him.
translation:
  language: sw
  text: Lakini hasira ya Mungu ikawaka kwa sababu alikuwa akienda, naye malaika wa Yahwe akajisimamisha njiani kama mpinzani wake[a]. Balaamu alikuwa ameketi juu ya punda wake[b], na vijana wake wawili walikuwa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania שָׂטָן (satan) hapa linamaanisha “mpinzani” au “adui”; si lazima liwe jina maalumu Shetani.
    reason: lexical_alternative
  - marker: b
    text: Au “punda jike wake”; neno la Kiebrania linamtaja hasa punda wa kike.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: hasira ya Mungu ikawaka
  rationale: Nahau hii inadumisha taswira ya Kiebrania ya hasira kuwaka, huku ikiwa ya kawaida na yenye kueleweka katika Kiswahili.
- source_word: כִּי הוֹלֵךְ הוּא
  choice: kwa sababu alikuwa akienda
  rationale: Muundo wa kitenzi cha hali endelevu unaonyesha tendo lililokuwa likiendelea na unahifadhi sababu iliyotolewa katika matini bila kujaribu kueleza mvutano wake na mistari iliyotangulia.
- source_word: וַיִּתְיַצֵּב
  choice: akajiweka
  rationale: Kauli ya kujirejelea inaonyesha kwamba malaika alijiweka mahali kwa makusudi, si kwamba alisimama tu bila kusudi.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahwe
  rationale: Katika muktadha huu מַלְאָךְ ni kiumbe wa mbinguni, na jina la agano יְהוָה limetolewa kama Yahwe.
- source_word: בַּדֶּרֶךְ
  choice: barabarani
  rationale: Neno hili linaonyesha mahali halisi katika njia ya Balaamu na ni la asili katika Kiswahili cha sasa.
- source_word: לְשָׂטָן לוֹ
  choice: kuwa mpinzani wake
  rationale: שָׂטָן hapa ni nomino ya kawaida inayofafanua jukumu la kumpinga Balaamu; “mpinzani” inadumisha nguvu hiyo bila kuifanya kuwa jina maalumu.
- source_word: אֲתֹנוֹ
  choice: punda wake
  rationale: Neno la Kiebrania humaanisha punda wa kike, lakini “punda” ni usemi wa kawaida wa kisimulizi; jinsia imeelezwa katika tanbihi.
- source_word: שְׁנֵי נְעָרָיו
  choice: vijana wake wawili
  rationale: Hili ndilo chaguo la moja kwa moja la נְעָרִים, ingawa katika muktadha linaweza pia kuwadokeza watumishi au wasaidizi vijana.
theological_decisions:
- issue: Maana ya שָׂטָן katika muktadha huu
  choice: nomino ya kawaida “mpinzani”
  alternative: jina maalumu “Shetani”
  rationale: Sarufi na muktadha zinaonyesha jukumu la malaika wa Yahwe la kumpinga Balaamu. Kutumia jina “Shetani” kungeingiza utambulisho ambao mstari wenyewe haulazimishi.
- issue: Sababu ya hasira ya Mungu
  choice: “kwa sababu alikuwa akienda”
  alternative: kuongeza maelezo kwamba alienda kwa nia mbaya au kinyume cha mapenzi ya Mungu
  rationale: Matini yenyewe inasema kwamba hasira iliwaka kwa sababu alikuwa akienda. Tafsiri inadumisha mvutano huo bila kuongeza ufafanuzi wa kitheolojia usiotajwa hapa.
- issue: Urejeo wa kiwakilishi katika וְהוּא רֹכֵב
  choice: “Balaamu alikuwa amepanda”
  alternative: “naye alikuwa amepanda”
  rationale: Jina Balaamu limetumiwa kwa uwazi wa kawaida katika Kiswahili ili kiwakilishi kisieleweke kimakosa kuwa kinamrejelea malaika; mhusika anayerejelewa ni yuleyule wa muktadha.
- issue: Utoaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: “Yahwe” linahifadhi jina binafsi la Mungu lililo katika matini ya Kiebrania badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Taswira ya hasira “kuwaka” na mvutano wa sababu ya hasira vimehifadhiwa; sentensi ya pili imemtaja Balaamu kwa jina ili kuepuka utata usio wa asili kuhusu kiwakilishi.
