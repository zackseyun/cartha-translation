  text: וַ/יֹּ֨אמֶר מוֹאָ֜ב אֶל זִקְנֵ֣י מִדְיָ֗ן עַתָּ֞ה יְלַחֲכ֤וּ הַ/קָּהָל֙ אֶת כָּל סְבִ֣יבֹתֵ֔י/נוּ כִּ/לְחֹ֣ךְ הַ/שּׁ֔וֹר אֵ֖ת יֶ֣רֶק הַ/שָּׂדֶ֑ה וּ/בָלָ֧ק בֶּן צִפּ֛וֹר מֶ֥לֶךְ לְ/מוֹאָ֖ב בָּ/עֵ֥ת הַ/הִֽוא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/004.yaml
  text: And Moab said to the elders of Midian[a], “Now this assembly will lick up all that is around us[b], as the ox licks up the green growth of the field.” Now Balak son of Zippor was king of Moab at that time.
translation:
  language: sw
  text: Moabu akawaambia wazee wa Midiani, “Sasa kusanyiko hili litamaliza kwa kulamba[a] kila kitu kinachotuzunguka, kama vile ng’ombe anavyolamba mimea ya kijani ya shambani[b].” Balaki mwana wa Sipori alikuwa mfalme wa Moabu wakati huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “litaangamiza kila kitu kinachotuzunguka.” Kitenzi cha Kiebrania kwa maana halisi ni “kulamba,” na matini kuu imehifadhi taswira hiyo ya mfano.
    reason: lexical_alternative
  - marker: b
    text: Au, “majani ya shambani.” Neno la Kiebrania linaweza kumaanisha kwa upana zaidi mimea ya kijani.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹאָב
  choice: Moabu
  rationale: Jina la taifa limetumiwa kama mhusika anayesema, kama lilivyo katika Kiebrania.
- source_word: זִקְנֵי מִדְיָן
  choice: wazee wa Midiani
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania unaomaanisha viongozi wazee wa Midiani.
- source_word: עַתָּה
  choice: Sasa
  rationale: Linaonyesha hofu ya jambo lililo karibu kutokea na linaendeleza kauli kwa njia ya kawaida katika Kiswahili.
- source_word: יְלַחֲכוּ
  choice: litalamba kabisa
  rationale: Kitenzi לחך kinamaanisha ‘kulamba’; neno ‘kabisa’ linawasilisha wazo la kumaliza vilivyo karibu bila kufifisha taswira inayorudiwa katika mfano wa ng’ombe.
- source_word: הַקָּהָל
  choice: kusanyiko hili
  rationale: Linaonyesha kundi la watu waliokusanyika na kuhifadhi maana ya pamoja ya קהל bila kulifanya tu kuwa umati usio na mpangilio.
- source_word: אֶת כָּל סְבִיבֹתֵינוּ
  choice: kila kitu kinachotuzunguka
  rationale: Ni Kiswahili cha kawaida kinachowasilisha maana halisi ya ‘vyote vilivyo pande zetu.’
- source_word: כִּלְחֹךְ הַשּׁוֹר
  choice: kama vile ng’ombe anavyolamba
  rationale: Muundo huu unahifadhi ulinganisho wa kilimo na kurudia mzizi wa kitenzi ‘kulamba’ kama katika Kiebrania.
- source_word: יֶרֶק הַשָּׂדֶה
  choice: mimea ya kijani ya shambani
  rationale: יֶרֶק ina maana pana ya mimea ya kijani, si lazima nyasi pekee; ‘shambani’ linawakilisha הַשָּׂדֶה kwa Kiswahili cha kawaida.
- source_word: וּבָלָק בֶּן צִפּוֹר
  choice: Wakati huo Balaki mwana wa Sipori
  rationale: Kishazi hiki kinaingiza taarifa ya usuli kuhusu Balaki; kuanza na ‘Wakati huo’ ni mpangilio wa kawaida wa Kiswahili na kunasa kazi ya waw pamoja na kirai cha wakati.
- source_word: מֶלֶךְ לְמוֹאָב
  choice: alikuwa mfalme wa Moabu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya taarifa kuhusu cheo cha Balaki.
- source_word: בָּעֵת הַהִוא
  choice: Wakati huo
  rationale: Kirai hiki kinatoa mazingira ya wakati wa simulizi kwa ufupi na kwa kawaida.
