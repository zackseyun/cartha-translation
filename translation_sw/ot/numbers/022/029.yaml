base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/029.yaml
  text: And Balaam said to the donkey[a], “Because you have made a mockery of me! If only there were a sword in my hand[c][b], I would kill you right now.”
translation:
  language: sw
  text: Balaamu akamwambia punda-jike, “Kwa sababu umenidhihaki[a]! Laiti ningekuwa na upanga mkononi mwangu, ningekuua sasa hivi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umenitendea vibaya” au “umenifanya mjinga.” Kitenzi cha Kiebrania kinaweza kumaanisha kumtendea mtu kwa dhihaka, kwa ukatili, au kwa namna ya kumfedhehesha.
    reason: lexical_alternative
  - marker: b
    text: Au “ningalikuwa nimekuua sasa hivi.” Kiebrania kinaonyesha tamanio lisilolingana na hali halisi pamoja na kusudi la Balaamu la kutenda mara moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo huu wa Kiswahili huendeleza simulizi kwa kawaida na pia unaonyesha kwamba maneno yanaelekezwa kwa punda-jike.
- source_word: בִּלְעָם
  choice: Balaamu
  rationale: Hili ni umbo la jina lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: לָאָתוֹן
  choice: punda-jike
  rationale: Neno אָתוֹן humaanisha punda wa kike; Kiswahili kinaweza kuonyesha jinsia hiyo kwa njia ya wazi na ya kawaida.
- source_word: כִּי
  choice: Kwa sababu
  rationale: Hapa neno hilo linatanguliza sababu ya hasira na tishio la Balaamu.
- source_word: הִתְעַלַּלְתְּ בִּי
  choice: umenidhihaki
  rationale: Hutoa kwa ufupi wazo la kumtendea mtu kwa namna ya kumfedhehesha au kumfanya mjinga, huku tanbihi ikihifadhi upana wa maana ya kitenzi.
- source_word: לוּ
  choice: Laiti
  rationale: Neno hili la Kiswahili huonyesha tamaa iliyo kinyume na hali halisi.
- source_word: יֶשׁ חֶרֶב בְּיָדִי
  choice: ningekuwa na upanga mkononi mwangu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba Balaamu hakuwa na upanga mkononi, huku kikihifadhi taswira ya mkono iliyomo katika Kiebrania.
- source_word: כִּי עַתָּה
  choice: sasa hivi
  rationale: Katika tishio hili maneno hayo yanasisitiza tendo la mara moja.
- source_word: הֲרַגְתִּיךְ
  choice: ningekuua
  rationale: Hali ya masharti inaendana na tamaa ya לוּ na kuwasilisha tishio ambalo lingetekelezwa mara moja kama Balaamu angekuwa na upanga.
