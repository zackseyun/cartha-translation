reference: Numbers 22:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח מַלְאָכִ֜ים אֶל בִּלְעָ֣ם בֶּן בְּע֗וֹר פְּ֠תוֹרָ/ה אֲשֶׁ֧ר עַל הַ/נָּהָ֛ר אֶ֥רֶץ בְּנֵי עַמּ֖/וֹ לִ/קְרֹא ל֑/וֹ לֵ/אמֹ֗ר הִ֠נֵּה עַ֣ם יָצָ֤א מִ/מִּצְרַ֨יִם֙ הִנֵּ֤ה כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/ה֥וּא יֹשֵׁ֖ב מִ/מֻּלִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/005.yaml
  text: So he sent messengers to Balaam son of Beor at Pethor[a], which is by the River, in the land of the sons of his people, to call him, saying, “Look, a people has come out of Egypt. Look, it has covered the face of the land[c][b], and it is dwelling opposite me.”
translation:
  language: sw
  text: Basi akatuma wajumbe kwa Balaamu mwana wa Beori, huko Pethori, uliokuwa kando ya ule Mto[a], katika nchi ya wana wa watu wake[b], ili wamwite, akisema, “Tazama, taifa limetoka Misri. Tazama, limefunika uso wa nchi[c], nalo linakaa mkabala nami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ule Mto”; huenda ni Mto Eufrate.'
    reason: cross_reference
  - marker: b
    text: Au “katika nchi ya watu wake.” Usemi wa Kiebrania “nchi ya wana wa watu wake” ni mgumu, na kiwakilishi “wake” kinaweza kueleweka kwa njia tofauti.
    reason: alternative_reading
  - marker: c
    text: Kihalisi, “limefunika jicho la nchi”; hapa “jicho” lina maana ya uso au sehemu inayoonekana ya nchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Basi akatuma
  rationale: Umbo la masimulizi linaendeleza tukio; “Basi” linaonyesha mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu ni wajumbe wa kibinadamu waliotumwa kwa shughuli rasmi, si malaika.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaamu mwana wa Beori
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika Kiswahili cha Biblia.
- source_word: פְּתוֹרָה
  choice: huko Pethori
  rationale: Kiambishi cha mwelekeo kinaweza kumaanisha kwenda mahali; katika sentensi hii Pethori pia panatajwa kuwa mahali Balaamu alikopatikana. “Huko” ni cha asili na hakilazimishi tofauti hiyo.
- source_word: אֲשֶׁר עַל־הַנָּהָר
  choice: uliokuwa kando ya ule Mto
  rationale: Neno la Kiebrania linasema kihalisi “Mto”; linaelekea kumaanisha Mto Eufrate, jambo linaloelezwa katika tanbihi badala ya kuingizwa moja kwa moja katika matini.
- source_word: אֶרֶץ בְּנֵי עַמּוֹ
  choice: katika nchi ya wana wa watu wake
  rationale: Usemi wa Kiebrania ni mgumu na kiwakilishi “wake” kinaweza kueleweka kwa njia tofauti. Tafsiri hii inadumisha muundo na utata wake badala ya kuusawazisha kimafasiri.
- source_word: לִקְרֹא לוֹ
  choice: ili wamwite
  rationale: Kitenzi-jina kinaonyesha kusudi la kuwatuma wajumbe; “wamwite” ni wazi na hakiongezi kwa lazima wazo la amri kali.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni fomula ya kawaida ya kuanzisha maneno yaliyonukuliwa.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili limetokea mara mbili kwa msisitizo wa kuvuta fikira; “Tazama” linahifadhi nguvu hiyo kwa lugha yenye hadhi.
- source_word: עַם
  choice: taifa
  rationale: Hapa nomino ya umoja inarejelea jamii kubwa yenye utambulisho wa pamoja. “Taifa” linawezesha upatanisho wa umoja na ni la kawaida katika muktadha huu.
- source_word: יָצָא מִמִּצְרַיִם
  choice: limetoka Misri
  rationale: Wakati timilifu wa Kiswahili unaonyesha tukio lililotokea ambalo matokeo yake bado ni muhimu katika taarifa hii.
- source_word: כִסָּה אֶת עֵין הָאָרֶץ
  choice: limefunika uso wa nchi
  rationale: Kihalisi עֵין ni “jicho,” lakini katika nahau hii linaonyesha sehemu inayoonekana ya nchi. “Uso wa nchi” huhifadhi taswira bila kuwa fumbo lisiloeleweka.
- source_word: וְהוּא יֹשֵׁב מִמֻּלִי
  choice: nalo linakaa mkabala nami
  rationale: “Mkabala nami” huhifadhi wazo la kuwa upande unaokabiliana na msemaji bila kulifanya kuwa lazima uadui wa kijeshi.
