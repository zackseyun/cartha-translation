base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/001.yaml
  text: Then the sons of Israel set out and camped in the plains of Moab[c][b][a], beyond the Jordan at Jericho.
translation:
  language: sw
  text: Kisha wana wa Israeli[a] wakaondoka, wakapiga kambi katika nchi tambarare za Moabu, ng’ambo ya Yordani[b], mkabala na Yeriko[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania ni, kwa maana ya moja kwa moja, “wana wa Israeli,” jina la kawaida la taifa zima.
    reason: lexical_alternative
  - marker: b
    text: Au, “upande wa pili wa Yordani.” Usemi huu hutegemea upande ambao msimuliaji anautazama.
    reason: lexical_alternative
  - marker: c
    text: Yeriko ni alama ya mahali inayoonyesha sehemu ya tambarare za Moabu iliyokuwa upande wa mashariki wa Yordani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: wakaondoka
  rationale: Kitenzi נסע katika masimulizi ya safari jangwani humaanisha kuvunja kambi na kuanza safari. “Wakaondoka” ni Kiswahili cha kawaida kinachoendeleza mfuatano wa matukio bila kuongeza maelezo yasiyosemwa wazi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inafuata maana ya moja kwa moja, “wana wa Israeli,” ambayo hapa ni jina la kawaida la taifa zima. Haibadilishwi kimya kuwa “Waisraeli,” ingawa maana hiyo ya kijumla imeelezwa katika tanbihi.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה humaanisha kukaa au kusimama kwa kupiga kambi. “Wakapiga kambi” ni usemi wa sasa, wa kawaida na ulio wazi katika Kiswahili.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: katika nchi tambarare za Moabu
  rationale: עַרְבוֹת hurejelea maeneo tambarare au nyika. “Nchi tambarare za Moabu” inaeleweka kwa urahisi na inafaa kwa jiografia ya mahali hapa.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: עֵבֶר pamoja na מן huonyesha upande wa pili wa Yordani kwa kutegemea mahali anapotazama msimuliaji. “Ng’ambo ya Yordani” ni fupi na inahifadhi uhusiano huo bila kuamua kimya mtazamo wa kijiografia.
- source_word: יְרֵחוֹ
  choice: mkabala na Yeriko
  rationale: Yeriko ni alama ya mahali inayoonyesha sehemu ya tambarare za Moabu walikopiga kambi. “Mkabala na Yeriko” huonyesha kwa usahihi zaidi kwamba walikuwa upande wa pili wa Yordani, si ndani ya mji wa Yeriko.
