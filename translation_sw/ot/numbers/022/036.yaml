translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kumlaki’ ni neno linaloeleweka na linalofaa simulizi rasmi; ‘mpakani mwa Arnoni’ ni mtungo wa kiasili unaohifadhi maelezo ya kijiografia. Alama zote za tanbihi zimewekwa katika matini kuu.
