base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/036.yaml
  text: When Balak heard that Balaam had come[a], he went out to meet him at the city of Moab, which is on the border of the Arnon[b], at the edge of the border.
translation:
  language: sw
  text: Balaki aliposikia kwamba Balaamu alikuwa amefika, akatoka kwenda kumlaki katika mji wa Moabu[a], ulio kwenye mpaka wa Arnoni, kwenye mwisho wa mpaka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika mji mmoja wa Moabu.” Maneno ya Kiebrania yanaweza kumaanisha ama mji maalumu uliojulikana katika Moabu, ama kwa ujumla mji uliokuwa wa Moabu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwenye mwisho wa eneo.” Neno la Kiebrania lililotafsiriwa “mpaka” linaweza pia kumaanisha “eneo” katika baadhi ya miktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: aliposikia
  rationale: Kitenzi שׁמע kwa kawaida humaanisha ‘kusikia’; hapa ‘aliposikia’ huunganisha kwa kawaida habari aliyopata Balaki na hatua iliyofuata.
- source_word: כִּי בָא בִלְעָם
  choice: kwamba Balaamu amewasili
  rationale: Kishazi hiki kinaeleza habari aliyosikia Balaki. ‘Amewasili’ huonyesha kwamba kufika kwa Balaamu kulitangulia kwenda kwa Balaki kumlaki.
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: יצא ni kitenzi cha kawaida cha kutoka; ‘akatoka’ huhifadhi mfuatano wa kisimulizi.
- source_word: לִקְרָאתוֹ
  choice: kwenda kumlaki
  rationale: לקראת huonyesha kusogea kuelekea mtu ili kukutana naye. ‘Kumlaki’ ni Kiswahili cha kawaida chenye heshima, bila kuongeza wazo la urafiki au uhasama.
- source_word: אֶל עִיר מוֹאָב
  choice: katika mji wa Moabu
  rationale: Baada ya ‘akatoka kwenda kumlaki,’ mahali pa kukutana huelezwa kwa kawaida kwa ‘katika.’ Muundo עִיר מוֹאָב unaweza kueleweka kuwa mji maalumu unaohusishwa na Moabu, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: אֲשֶׁר עַל גְּבוּל אַרְנֹן
  choice: ulio mpakani mwa Arnoni
  rationale: עַל גְּבוּל huonyesha mahali palipo kwenye au karibu na mpaka. Arnoni ni jina la mto/bonde lililotumika kama alama ya mpaka.
- source_word: אֲשֶׁר בִּקְצֵה הַגְּבוּל
  choice: kwenye ukingo wa mpaka
  rationale: קצה humaanisha mwisho, ncha, au ukingo. Kurudia ‘mpaka’ kunahifadhi urudiaji wa גְּבוּל katika Kiebrania, huku ‘ukingo’ ikiwa ya kawaida zaidi kuliko ‘ncha ya mpaka.’
