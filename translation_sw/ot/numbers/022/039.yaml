base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/039.yaml
  text: So Balaam went with Balak[a], and they came to Kiriath-huzoth.
translation:
  language: sw
  text: Basi Balaamu akaenda pamoja na Balaki, nao wakafika Kiriath-Husothi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda Kiriath-Husothi ikamaanisha “mji wa barabara” au “mji wa maeneo ya wazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Qal wayyiqtol ya הלך inaendeleza simulizi kwa maana ya kawaida ya kwenda; “akaenda” ni ya asili katika Kiswahili cha simulizi.
- source_word: בִּלְעָם
  choice: Balaamu
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: עִם
  choice: pamoja na
  rationale: Kihusishi hiki kinaonyesha kuandamana; “pamoja na” ni wazi na cha kawaida hapa.
- source_word: בָּלָק
  choice: Balaki
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: וַיָּבֹאוּ
  choice: nao wakafika
  rationale: Umbo la wingi la wayyiqtol kutoka בוא linaonyesha tendo linalofuata katika simulizi. “Wakafika” linaeleza mwendo hadi mahali hapo bila kudai kwamba waliingia ndani.
- source_word: קִרְיַת חֻצוֹת
  choice: Kiriath-Husothi
  rationale: Hili ni jina la mahali, hivyo limetoholewa katika maandishi makuu badala ya kutafsiriwa; maana yake ya kileksika imehifadhiwa katika tanbihi.
