  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּפְתַּ֥ח יְהוָ֖ה אֶת פִּ֣י הָ/אָת֑וֹן וַ/תֹּ֤אמֶר לְ/בִלְעָם֙ מֶה עָשִׂ֣יתִֽי לְ/ךָ֔ כִּ֣י הִכִּיתַ֔/נִי זֶ֖ה שָׁלֹ֥שׁ רְגָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/028.yaml
  text: Then Yahweh opened the mouth of the donkey[a], and she said to Balaam, “What have I done to you[b], that you have struck me these three times?”
translation:
  language: sw
  text: Ndipo Yahweh akafungua kinywa cha punda-jike[a], na punda-jike akamwambia Balaamu, “Nimekutendea nini hata umenipiga mara hizi tatu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “kinywa cha punda”; nomino iliyotumiwa humaanisha punda wa kike.
    reason: lexical_alternative
  - marker: b
    text: Kirai cha Kiebrania kina neno ambalo maana yake ya msingi ni “miguu,” lakini hapa ni nahau inayomaanisha “mara hizi tatu” au “katika matukio haya matatu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: akafungua
  rationale: Kitenzi פתח katika qal kina maana ya moja kwa moja ya ‘kufungua’; ‘akafungua’ linaonyesha wazi tendo la Yahweh bila kuongeza wazo la ‘kusababisha kufunguka.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi matumizi ya jina binafsi katika matini ya Kiebrania.
- source_word: פִּי הָאָתוֹן
  choice: kinywa cha punda-jike
  rationale: Kirai hiki ni ‘kinywa cha punda’; nomino אָתוֹן humaanisha punda wa kike. ‘Punda-jike’ ni wazi na pia huonyesha jinsia ambayo Kiswahili hakiionyeshi katika kitenzi kinachofuata.
- source_word: וַתֹּאמֶר לְבִלְעָם
  choice: naye akamwambia Balaamu
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba punda-jike ndiye aliyesema na kwamba maneno yake yalimwelekea Balaamu.
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: Nimekutendea nini
  rationale: Hiki ni Kiswahili cha kawaida na cha moja kwa moja kwa swali la malalamiko, ‘Nimefanya nini kwako?’ bila kulazimisha maana ya uadui isiyosemwa wazi.
- source_word: כִּי הִכִּיתַנִי
  choice: hata ukanipiga
  rationale: Katika swali hili כִּי linaunganisha kitendo cha Balaamu na sababu inayodaiwa ya kumpiga punda. ‘Hata’ hutoa uhusiano huu kwa Kiswahili cha kawaida, huku נכה ikitafsiriwa kwa usahihi kuwa ‘kupiga.’
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: mara hizi tatu
  rationale: רְגָלִים hapa ni nahau ya matukio au nyakati. ‘Mara hizi tatu’ huwasilisha maana hiyo na kuhifadhi nguvu ya kiashiria זֶה.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini inatumia jina la herufi nne יהוה. Kulitaja ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza fasiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida; ‘punda-jike’ huhifadhi taarifa ya kijinsia ya Kiebrania, na ‘mara hizi tatu’ hutafsiri nahau kwa kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
