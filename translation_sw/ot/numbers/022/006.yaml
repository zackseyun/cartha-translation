base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/006.yaml
  text: So now[a], please come and curse this people for me, because they are too mighty for me. Perhaps I will be able to strike them and drive them out of the land, for I know that whoever you bless is blessed[b], and whoever you curse is cursed.
translation:
  language: sw
  text: Basi sasa, tafadhali njoo unilaanie watu hawa, kwa maana wana nguvu kuliko mimi. Huenda nikaweza; nasi tuwapige[a], nami niwafukuze kutoka katika nchi, kwa maana ninajua kwamba yeyote unayembariki amebarikiwa, na yeyote unayemlaani amelaaniwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hubadili hapa kutoka “nitaweza” (umoja) hadi “tuwapige” (wingi), kisha kurudi “niwafukuze” (umoja).
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Inaendeleza hoja ya Balaki huku ikionyesha mpito wa haraka kuelekea ombi lake.
- source_word: לְכָה נָּא
  choice: tafadhali njoo
  rationale: Kauli ya amri pamoja na chembe ya kusihi imewasilishwa kwa Kiswahili cha kawaida chenye dharura na adabu.
- source_word: אָרָה לִּי אֶת הָעָם הַזֶּה
  choice: unilaanie watu hawa
  rationale: Kiambishi cha kutendea katika ‘unilaanie’ kinahifadhi maana ya לִּי, yaani Balaki anaomba laana hiyo itolewe kwa ajili yake; ‘watu hawa’ ni usemi wa kawaida wa Kiswahili kwa nomino ya Kiebrania iliyo umoja wa kijumla.
- source_word: כִּי עָצוּם הוּא מִמֶּנִּי
  choice: kwa maana wana nguvu kuliko mimi
  rationale: Inahifadhi ulinganisho wa nguvu na kuitendea ‘watu’ kama kundi la wingi kwa sarufi ya Kiswahili.
- source_word: אוּלַי אוּכַל
  choice: Huenda nikaweza
  rationale: Inadumisha kutokuwa na hakika pamoja na wazo la uwezo.
- source_word: נַכֶּה בּוֹ
  choice: kuwapiga
  rationale: ‘Kupiga’ huhifadhi maana ya msingi ya נכה bila kuifanya moja kwa moja kuwa ‘kuwashinda,’ ambalo lingekuwa fasiri mahususi zaidi.
- source_word: וַאֲגָרְשֶׁנּוּ מִן הָאָרֶץ
  choice: na kuwafukuza kutoka katika nchi
  rationale: ‘Kufukuza’ huwasilisha tendo la kuwaondoa kwa nguvu, na ‘nchi’ inafaa kwa eneo linalokusudiwa na הָאָרֶץ katika muktadha huu.
- source_word: אֵת אֲשֶׁר תְּבָרֵךְ מְבֹרָךְ
  choice: yeyote unayembariki amebarikiwa
  rationale: ‘Yeyote’ huwasilisha kauli ya jumla, na ‘amebarikiwa’ huhifadhi hali ya matokeo ya kitenzi cha Kiebrania.
- source_word: וַאֲשֶׁר תָּאֹר יוּאָר
  choice: na yeyote unayemlaani amelaaniwa
  rationale: Inahifadhi usambamba wa kishairi na kishazi kilichotangulia pamoja na hali ya matokeo ya laana.
