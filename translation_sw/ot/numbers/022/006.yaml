translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida lakini wa hadhi. ‘Unilaanie’ ni fupi na asilia kuliko ‘uwekee laana kwa ajili yangu,’ huku kikihifadhi dhana kwamba Balaki ndiye anayenufaika na ombi hilo. Umoja wa kijumla wa Kiebrania umewekwa kwa wingi wa kawaida wa Kiswahili, ‘watu hawa.’
