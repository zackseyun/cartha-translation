  yaml_path: translation/ot/numbers/022/003.yaml
  text: And Moab was very afraid because of the people[a], because they were numerous[b]; and Moab was filled with dread because of the sons of Israel.
translation:
  language: sw
  text: Moabu iliogopa sana kwa sababu ya watu, kwa kuwa walikuwa wengi; nayo Moabu ikataabika kwa sababu ya Waisraeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Moabu ilichukizwa na Waisraeli,” au “Moabu ilifadhaishwa kwa sababu ya Waisraeli.” Kitenzi cha Kiebrania kinaweza kueleza kuchukizwa, kufadhaishwa, au kutaabika; katika muktadha huu kinaonyesha msongo mkubwa wa Moabu mbele ya Waisraeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: wakaogopa sana
  rationale: Kitenzi גור katika muktadha huu huonyesha kuogopa au kuwa na hofu; מְאֹד huongeza uzito wa hisia hiyo. Upatanisho wa wingi unaitazama Moabu kama watu wake.
- source_word: מִפְּנֵי
  choice: kwa sababu ya
  rationale: Ingawa kimsingi inaweza kuwa ‘mbele ya/kutoka mbele ya,’ hapa inaonyesha kisababishi cha hofu ya Moabu.
- source_word: הָעָם
  choice: watu hao
  rationale: Nomino hii ya pamoja inawarejelea Waisraeli waliotajwa katika muktadha. ‘Hao’ hufanya rejeo hilo lieleweke kwa Kiswahili bila kuongeza maana mpya.
- source_word: כִּי רַב הוּא
  choice: kwa kuwa walikuwa wengi
  rationale: רַב hapa inaeleza wingi wa watu. Kiswahili kwa kawaida hutumia upatanisho wa wingi kwa kundi la watu, licha ya kiwakilishi cha umoja katika Kiebrania.
- source_word: וַיָּקָץ
  choice: ikajawa na hofu kuu
  rationale: קוץ inaweza kueleza kuchukizwa, kusumbuka sana, au hofu yenye kinyaa. Muktadha wa tishio unapendelea hofu kali, lakini tanbihi huhifadhi upana wa kimaana.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Hili ni jina la kawaida na la asili katika Kiswahili kwa ‘wana wa Israeli,’ likirejelea taifa zima bila kudokeza wanaume pekee.
- source_word: מוֹאָב
  choice: Moabu
  rationale: Umbo la jina lililozoeleka katika matumizi ya Biblia ya Kiswahili; katika kishazi cha kwanza limetumiwa kwa maana ya watu wa Moabu, na katika cha pili kama umoja wa pamoja.
