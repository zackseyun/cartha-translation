  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מַלְאַ֣ךְ יְהוָ֔ה עַל מָ֗ה הִכִּ֨יתָ֙ אֶת אֲתֹ֣נְ/ךָ֔ זֶ֖ה שָׁל֣וֹשׁ רְגָלִ֑ים הִנֵּ֤ה אָנֹכִי֙ יָצָ֣אתִי לְ/שָׂטָ֔ן כִּֽי יָרַ֥ט הַ/דֶּ֖רֶךְ לְ/נֶגְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/032.yaml
  text: And the angel of Yahweh said to him[a], “Why have you struck your donkey these three times? Look, I have come out as an adversary[b], because your way is perverse before me.”
translation:
  language: sw
  text: Malaika wa Yahweh akamwambia, “Kwa nini umempiga punda wako mara hizi tatu? Tazama, nimetoka kuwa mpinzani wako[a], kwa sababu njia yako ni potovu mbele yangu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania שָׂטָן hapa humaanisha “mpinzani” au “mkinzani”; si lazima liwe jina maalumu “Shetani.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kilichotafsiriwa “ni potovu” ni nadra; huenda pia kikamaanisha kwamba njia hiyo ni ya haraka bila tahadhari au inapingana naye.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: Malaika wa Yahweh
  rationale: Katika simulizi hili מַלְאַךְ humaanisha kiumbe wa mbinguni anayemkabili Balaamu, hivyo ‘malaika’ inafaa kuliko ‘mjumbe.’ Jina la Mungu יְהוָה limetoholewa kuwa ‘Yahweh.’
- source_word: הִכִּיתָ אֶת אֲתֹנְךָ
  choice: umempiga punda wako
  rationale: נכה ni ‘kupiga.’ Ingawa אֲתֹן humaanisha punda-jike, ‘punda wako’ ni usemi wa kawaida na jinsia yake si kiini cha karipio hili.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: mara hizi tatu
  rationale: Huu ni usemi wa Kiebrania unaomaanisha matukio matatu; tafsiri ya Kiswahili inaleta maana yake ya kawaida bila kunakili neno ‘miguu.’
- source_word: הִנֵּה אָנֹכִי יָצָאתִי
  choice: Tazama, nimetoka
  rationale: ‘Tazama’ huhifadhi mwito wa kuzingatia, na ‘nimetoka’ huonyesha kwamba malaika ametokea ili kukabiliana naye.
- source_word: לְשָׂטָן
  choice: kuwa mpinzani wako
  rationale: שָׂטָן ni nomino ya kawaida yenye maana ya mpinzani katika muktadha huu. ‘Wako’ huweka wazi kwa Kiswahili yule anayepingwa bila kulifanya neno hilo kuwa jina maalumu.
- source_word: יָרַט הַדֶּרֶךְ לְנֶגְדִּי
  choice: njia yako ni potovu mbele yangu
  rationale: Kitenzi יָרַט ni nadra na maana yake si hakika kabisa. ‘Potovu’ huwasilisha tathmini hasi ya mwendo wa Balaamu, huku ‘mbele yangu’ ikihifadhi לְנֶגְדִּי.
theological_decisions:
- issue: Maana ya לְשָׂטָן
  choice: 'nomino ya kawaida: ‘kuwa mpinzani wako’'
  alternative: 'jina maalumu: ‘kuwa Shetani’'
  rationale: Muktadha unaonyesha malaika wa Yahweh akimpinga Balaamu. Kutumia jina ‘Shetani’ kungeingiza dai la kiteolojia ambalo kifungu hiki hakilazimishi.
- issue: Maana ya kitenzi nadra יָרַט
  choice: ‘ni potovu’
  alternative: ‘ni ya haraka bila tahadhari’ au ‘inanipinga’
  rationale: Maana kamili ya kitenzi hiki nadra inajadiliwa; maandishi makuu yanatoa tafsiri inayofaa muktadha, na tanbihi inadumisha uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi ‘akamwambia’ ni wa kawaida katika maandishi ya kibiblia lakini unaeleweka kwa urahisi; ‘Tazama’ huhifadhi msisitizo wa המקור bila kutumia lugha ya kizamani kupita kiasi.
