base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/030.yaml
  text: Then the donkey said to Balaam[a], “Am I not your donkey, on which you have ridden all your life to this day? Have I ever been accustomed to do thus to you?” And he said, “No.”
translation:
  language: sw
  text: Ndipo punda jike akamwambia Balaamu, “Je, mimi si punda jike wako, ambaye umekuwa ukimpanda tangu siku zako za kwanza mpaka leo? Je, nimewahi kuwa na desturi ya kukutendea hivi?” Naye akasema, “La.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָתוֹן / אֲתֹנְךָ
  choice: punda-jike / punda-jike wako
  rationale: Nomino אָתוֹן humaanisha hasa punda wa kike. Kiswahili kinaweza kuonyesha habari hiyo kwa uwazi na kwa namna ya kawaida kwa kutumia “punda-jike.”
- source_word: הֲלוֹא
  choice: Je, mimi si
  rationale: Hutanguliza swali la balagha linalotarajia jibu la kukubali; “Je, mimi si” huhifadhi nguvu hiyo kwa Kiswahili sanifu.
- source_word: אֲשֶׁר רָכַבְתָּ עָלַי
  choice: ambaye umekuwa ukimpanda
  rationale: Kifungu hiki kinaeleza kupanda juu ya mnyama kwa muda uliopita hadi sasa; muundo huu ni wa asili katika Kiswahili.
- source_word: מֵעוֹדְךָ עַד הַיּוֹם הַזֶּה
  choice: tangu zamani zako mpaka leo hii
  rationale: Kiebrania kina maana ya kuanzia mwanzo au zamani za Balaamu hadi siku hiyo. Tafsiri hii huhifadhi upana wa usemi bila kuamua kwa lazima kuwa unamaanisha maisha yake yote.
- source_word: הַהַסְכֵּן הִסְכַּנְתִּי
  choice: nimewahi kuwa na desturi
  rationale: Infinitivu kamili pamoja na kitenzi cha mzizi סכן husisitiza tabia iliyozoeleka. “Nimewahi kuwa na desturi” huonyesha swali kuhusu mwenendo wa kawaida.
- source_word: לַעֲשׂוֹת לְךָ כֹּה
  choice: ya kukutendea hivi
  rationale: כֹּה hurejelea mwenendo wa sasa wa punda; “kukutendea hivi” ni Kiswahili cha kawaida na huhifadhi uhusiano wa kitendo kuelekezwa kwa Balaamu.
- source_word: וַיֹּאמֶר לֹא
  choice: Naye akasema, “La.”
  rationale: Huu ni mwendelezo rahisi wa simulizi na jibu hasi la moja kwa moja. “La” linafaa katika mazungumzo yenye hadhi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Punda-jike” huhifadhi jinsia iliyo wazi katika Kiebrania; “tangu zamani zako” huhifadhi upeo wa msemo wa chanzo bila kuufanya kwa lazima kuwa “maisha yako yote.”
