id: NUM.22.27
reference: Numbers 22:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אָתוֹן֙ אֶת מַלְאַ֣ךְ יְהוָ֔ה וַ/תִּרְבַּ֖ץ תַּ֣חַת בִּלְעָ֑ם וַ/יִּֽחַר אַ֣ף בִּלְעָ֔ם וַ/יַּ֥ךְ אֶת הָ/אָת֖וֹן בַּ/מַּקֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/027.yaml
  text: When the donkey saw the angel of Yahweh[a], she lay down under Balaam[b]. Then Balaam became angry and struck the donkey with his staff.
translation:
  language: sw
  text: Punda-jike alipomwona malaika wa Yahweh[a], akajilaza chini ya Balaamu. Ndipo Balaamu akakasirika, akampiga punda-jike kwa fimbo yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wa Yahweh.” Neno la Kiebrania linaweza kumaanisha mjumbe au malaika; hapa muktadha unaonyesha mjumbe wa kimbinguni.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: punda-jike
  rationale: Nomino אָתוֹן humaanisha punda wa kike. Kiswahili kinaweza kueleza jinsia hiyo kwa njia ya kawaida na wazi kwa neno “punda-jike” bila kutegemea kiwakilishi cha kijinsia.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: מַלְאָךְ inaweza kumaanisha mjumbe au malaika; katika simulizi hili anayekusudiwa ni mjumbe wa kimbinguni, hivyo “malaika” inafaa zaidi, huku tanbihi ikihifadhi maana nyingine ya neno hilo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kuwa “Yahweh” badala ya kubadilishwa na cheo.
- source_word: וַתִּרְבַּץ
  choice: akajilaza
  rationale: Kitenzi רבץ humaanisha kulala chini au kujilaza. “Akajilaza” ni cha kawaida kwa mnyama na hakidokezi kwamba alipitiwa na usingizi.
- source_word: תַּחַת בִּלְעָם
  choice: chini ya Balaamu
  rationale: תַּחַת humaanisha chini ya au kwenye sehemu iliyo chini; hapa punda alijilaza akiwa chini ya mpandaji wake.
- source_word: וַיִּחַר אַף בִּלְעָם
  choice: Ndipo Balaamu akakasirika
  rationale: Nahau ya Kiebrania husema kihalisi kwamba hasira yake iliwaka. “Akakasirika” huwasilisha maana yake kwa Kiswahili cha kawaida bila kuzidisha kiwango cha hasira.
- source_word: וַיַּךְ
  choice: akampiga
  rationale: נכה ni kitenzi cha kumpiga au kumshambulia kwa pigo. “Akampiga” ni cha moja kwa moja na hakiongezi wazo la mapigo mengi lisilotajwa wazi hapa.
- source_word: בַּמַּקֵּל
  choice: kwa fimbo yake
  rationale: מַקֵּל ni fimbo au kijiti. “Fimbo” inafaa katika muktadha wa msafiri, na kiwakilishi “yake” kinaweka wazi kwa Kiswahili cha kawaida kwamba chombo hicho kilikuwa cha Balaamu, ingawa Kiebrania kinasema kihalisi “kwa ile fimbo.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina binafsi la Mungu, יהוה. Kulitaja “Yahweh” kunalihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מַלְאַךְ katika kirai מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  alternative: mjumbe wa Yahweh
  rationale: Neno lenyewe linaweza kumaanisha “mjumbe,” lakini muktadha unaonyesha kiumbe wa kimbinguni. “Malaika” linafikisha jambo hilo bila kuamua zaidi kuhusu utambulisho au asili yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. “Punda-jike” limetumiwa ili kuhifadhi jinsia iliyo wazi katika neno la Kiebrania; “akajilaza” huepuka maana ya kulala usingizi.
