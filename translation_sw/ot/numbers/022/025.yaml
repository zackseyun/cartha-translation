base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/025.yaml
  text: When the donkey saw the angel of Yahweh[a], she pressed herself against the wall and pressed Balaam’s foot against the wall, so he struck her again.
translation:
  language: sw
  text: Punda-jike alipomwona malaika wa Yahweh[a], akajisukuma dhidi ya ukuta, akambana mguu wa Balaamu dhidi ya ukuta. Basi Balaamu akampiga tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wa Yahweh.” Katika muktadha huu neno hilo humaanisha kiumbe wa mbinguni, kwa hiyo “malaika” limetumiwa katika maandishi makuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: punda-jike
  rationale: Nomino ya Kiebrania אָתוֹן humaanisha punda wa kike; Kiswahili kinaweza kuonyesha jinsia hiyo wazi na kwa ufupi kwa neno “punda-jike”.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: מַלְאַךְ inaweza kumaanisha mjumbe au malaika; katika simulizi hili kiumbe huyo ni wa ulimwengu wa kiroho, hivyo “malaika” ndilo neno la kawaida na linalofaa, huku tanbihi ikihifadhi maana mbadala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne linatolewa kama “Yahweh,” kwa kulihifadhi kama jina la pekee badala ya kulibadili kuwa cheo.
- source_word: וַתִּלָּחֵץ אֶל הַקִּיר
  choice: akajisonga ukutani
  rationale: Muundo huu unaonyesha punda akijibana au kujisogeza kwa nguvu dhidi ya ukuta; “akajisonga ukutani” ni lugha ya asili ya Kiswahili na inaendeleza tendo la simulizi.
- source_word: הַקִּיר
  choice: ukuta / ukutani
  rationale: קִיר ni “ukuta”; umbo la mahali “ukutani” linafaa kwa miundo yote miwili katika sentensi ya Kiswahili.
- source_word: וַתִּלְחַץ אֶת רֶגֶל בִּלְעָם אֶל הַקִּיר
  choice: na kuubana mguu wa Balaamu ukutani
  rationale: Kitenzi hapa kina mguu kama yambwa na kinaonyesha kwamba ulisongwa na kubanwa dhidi ya ukuta. “Kuubana” ni wazi zaidi kuliko kurudia “kuusonga” na hakiongezi wazo la kupondwa kabisa.
- source_word: רֶגֶל
  choice: mguu
  rationale: רֶגֶל hapa ni kiungo cha Balaamu kilichobanwa ukutani; “mguu” ndilo neno la kawaida la Kiswahili na halilazimishi utofautishaji usiotajwa kati ya wayo na sehemu nyingine ya mguu.
- source_word: וַיֹּסֶף לְהַכֹּתָהּ
  choice: Basi Balaamu akampiga tena
  rationale: יָסַף pamoja na kitenzi-jina huonyesha kurudia tendo. “Akampiga tena” ni tafsiri ya kawaida na fupi; jina “Balaamu” limewekwa wazi kwa kuwa Kiswahili hakina kiwakilishi cha jinsia kinachotofautisha mtendaji na punda-jike katika muktadha huu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko lina jina la agano יְהוָה moja kwa moja. “Yahweh” hulihifadhi kama jina la pekee bila kulibadili kuwa cheo, huku likiepuka kuingiza msimamo wa kimadhehebu.
- issue: Maana ya מַלְאַךְ katika kirai מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  alternative: mjumbe wa Yahweh
  rationale: Neno lenyewe linaweza kumaanisha mjumbe, lakini muktadha wa simulizi unaonyesha wazi mhusika wa kiroho. Tafsiri kuu inatumia “malaika,” na tanbihi inahifadhi uwezekano wa kileksika wa “mjumbe.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Biblia. Sentensi zimeunganishwa kwa mtiririko wa masimulizi; “Balaamu” limerudiwa badala ya kiwakilishi kisicho wazi, na “punda-jike” huhifadhi jinsia iliyo katika nomino ya Kiebrania.
