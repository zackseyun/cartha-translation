  yaml_path: translation/ot/numbers/022/031.yaml
  text: Then Yahweh uncovered Balaam’s eyes[a], and he saw the angel of Yahweh standing in the road with his sword drawn in his hand[c][b]; and he bowed down and prostrated himself with his face to the ground.
translation:
  language: sw
  text: Ndipo Yahweh akayafunua macho ya Balaamu,[a] naye akamwona malaika wa Yahweh[b] amesimama barabarani, akiwa na upanga wake uliochomolewa mkononi mwake. Balaamu akainama, kisha akajilaza kifudifudi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akayafungua macho ya Balaamu.” Kitenzi cha Kiebrania humaanisha kihalisi “kufunua.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mjumbe wa Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: Au, “akaanguka kifudifudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגַל
  choice: akayafunua
  rationale: Kitenzi גלה kimsingi humaanisha kufunua au kuondoa kilichofunika. ‘Akayafunua macho’ huhifadhi taswira ya Kiebrania kwamba Yahweh aliondoa kizuizi kilichomzuia Balaamu kuona, huku ‘akayafungua’ likibaki kama tafsiri mbadala ya kawaida zaidi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina la kibinafsi lililo katika matini.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: Ingawa מַלְאָךְ pia inaweza kumaanisha ‘mjumbe,’ muktadha huu unamhusu kiumbe wa mbinguni; ‘malaika’ ni neno la kawaida na linalofaa katika Kiswahili.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: amesimama barabarani
  rationale: Kirai kinaonyesha malaika akiwa katika hali ya kusimama kwenye njia ya Balaamu. ‘Barabarani’ ni ya kawaida na huonyesha wazi kwamba alikuwa akimzuia kupita.
- source_word: וְחַרְבּוֹ שְׁלֻפָה בְיָדוֹ
  choice: huku akiwa ameshika mkononi upanga wake uliochomolewa
  rationale: שְׁלֻפָה huonyesha upanga uliotolewa alani. Muundo huu wa Kiswahili huhifadhi hali inayoandamana na kusimama kwa malaika na pia hutaja kwamba upanga ulikuwa mkononi mwake.
- source_word: וַיִּקֹּד
  choice: akainama
  rationale: Kitenzi hiki huonyesha kuinama au kujipinda chini kwa heshima, bila kulazimisha namna maalumu zaidi ya mkao.
- source_word: וַיִּשְׁתַּחוּ לְאַפָּיו
  choice: akajilaza kifudifudi
  rationale: Muungano huu unaeleza tendo la kujishusha chini uso ukielekea ardhini. Tafsiri ya tendo la mwili inaepuka kuamua kimbele ikiwa tendo hilo linapaswa kuitwa ibada.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ina jina la Mungu moja kwa moja; kulitohowa kama ‘Yahweh’ huhifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Ikiwa וַיִּשְׁתַּחוּ itafsiriwe wazi kuwa ibada au kama tendo la mwili
  choice: akajilaza kifudifudi
  alternative: akasujudu
  rationale: Kitenzi kinaweza kutumiwa kwa kusujudu katika ibada, lakini hapa maelezo yanakazia mwitikio wa mwili wa Balaamu. Lugha ya kujilaza kifudifudi huhifadhi tendo lenyewe bila kutatua kimbele maana yake ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akayafunua macho’ huhifadhi taswira ya chanzo bila kufanya sentensi isieleweke; ‘akajilaza kifudifudi’ ni lugha ya kawaida inayoonyesha wazi mkao huku ikiepuka kuingiza kwa lazima tafsiri ya ibada.
