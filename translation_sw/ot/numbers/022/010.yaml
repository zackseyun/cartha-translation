base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/010.yaml
  text: And Balaam said to God[a], “Balak son of Zippor, king of Moab, has sent to me:”
translation:
  language: sw
  text: Basi Balaamu akamwambia Mungu, “Balaki mwana wa Sipori, mfalme wa Moabu, ametuma kwangu:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Basi ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; ‘Basi ... akamwambia’ ni Kiswahili cha kawaida cha masimulizi na kinaonyesha kwamba Mungu ndiye anayeambiwa.
- source_word: בִּלְעָם
  choice: Balaamu
  rationale: Jina limetoholewa kwa umbo linalotambulika katika mapokeo ya Biblia ya Kiswahili.
- source_word: אֶל הָאֱלֹהִים
  choice: Mungu
  rationale: Kihusishi אֶל pamoja na muktadha humtambulisha Mungu kama anayesemeshwa; kiambishi cha yambwa katika ‘akamwambia’ kinawasilisha uhusiano huo kwa Kiswahili cha asili.
- source_word: בָּלָק בֶּן צִפֹּר
  choice: Balaki mwana wa Sipori
  rationale: Muundo wa uhusiano wa Kiebrania umetafsiriwa moja kwa moja na kwa kawaida kama ‘mwana wa’; majina yametoholewa kwa matumizi yanayotambulika ya Kiswahili.
- source_word: מֶלֶךְ מוֹאָב
  choice: mfalme wa Moabu
  rationale: Mnyororo wa hali ya umilikaji unaeleza cheo cha Balaki; ‘mfalme wa Moabu’ ni sahihi na ya kawaida.
- source_word: שָׁלַח אֵלַי
  choice: ametuma ujumbe kwangu
  rationale: Kitenzi timilifu kinaonyesha tendo lililokamilika lenye umuhimu wa sasa. Kwa kuwa Kiebrania hakitaji kitu kilichotumwa lakini muktadha unaonyesha wajumbe/ujumbe, ‘ametuma ujumbe kwangu’ huhifadhi maana ya kuelekeza kitu kwa Balaamu bila kutafsiri kupita kiasi kuwa ‘ametuma watu waniite.’
theological_decisions:
- issue: Mrejelewa wa הָאֱלֹהִים
  choice: Mungu mmoja anayezungumza na Balaamu katika muktadha
  alternative: mungu fulani au miungu kwa maana ya jumla
  rationale: Neno lina kibainishi na muktadha wa aya iliyotangulia unamwonyesha Balaamu akijibu tukio la Mungu; ‘Mungu’ linaakisi utambulisho huo bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Basi’ na mfululizo wa vitenzi vya -ka- vinatunza mwendo wa simulizi. Nukuu inaishia kwa alama ya koloni kwa sababu usemi wa Balaamu unaendelea katika aya inayofuata.
