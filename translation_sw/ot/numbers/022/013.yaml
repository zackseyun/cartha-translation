base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/013.yaml
  text: So Balaam rose in the morning and said to Balak’s officials[a], “Go to your land, because Yahweh has refused to let me go with you.”
translation:
  language: sw
  text: Basi Balaamu akaamka asubuhi, akawaambia maofisa wa Balaki[a], “Nendeni nchini kwenu, kwa sababu Yahwe amekataa kuniruhusu niende pamoja nanyi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakuu wa Balaki” au “viongozi wa Balaki.”
    reason: שָׂרֵי linaweza kutaja maofisa, wakuu, au viongozi; tanbihi huhifadhi upana huo wa kimaana.
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaamka
  rationale: Kitenzi קום katika mfuatano wa simulizi kinaonyesha Balaamu kuamka na kuanza tendo linalofuata; “akaamka” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: בַּבֹּקֶר
  choice: asubuhi
  rationale: Ni usemi wa kawaida wa wakati unaolingana moja kwa moja na maana ya Kiebrania bila kuongeza wazo la mapema sana.
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Ingawa umbo la Kiebrania ni “akasema kwa,” Kiswahili cha asili hutumia “akawaambia” wakati ujumbe unaelekezwa kwa watu kadhaa.
- source_word: שָׂרֵי בָלָק
  choice: maofisa wa Balaki
  rationale: שָׂרִים inaweza kumaanisha maofisa, wakuu, au viongozi. Katika muktadha huu ni wajumbe wenye cheo wa mfalme; “maofisa” linaonyesha nafasi yao ya uwakilishi bila kudokeza lazima kuwa wana wa kifalme.
- source_word: לְכוּ
  choice: Nendeni
  rationale: Amri ya wingi ya הלך; “Nendeni” ni agizo la moja kwa moja kwa wajumbe wengi.
- source_word: אֶל אַרְצְכֶם
  choice: katika nchi yenu
  rationale: אֶרֶץ hapa ni nchi au eneo lao. “Katika nchi yenu” ni usemi wa asili wa kurudi nchini kwao.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatanguliza sababu ya agizo la Balaamu.
- source_word: מֵאֵן
  choice: amekataa
  rationale: Piel timilifu ya מאן inaonyesha kukataa kwa dhahiri; wakati timilifu wa Kiswahili unaonyesha uamuzi uliokwisha kufanywa wenye athari ya sasa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo; “Yahwe” ni tahajia inayotumika kwa kawaida katika Kiswahili.
- source_word: לְתִתִּי
  choice: kuniruhusu
  rationale: נתן pamoja na kitenzi-jina hapa ina maana ya kuruhusu au kutoa idhini, si kutoa kitu kwa maana halisi.
- source_word: לַהֲלֹךְ עִמָּכֶם
  choice: niende pamoja nanyi
  rationale: הלך pamoja na עִם hapa humaanisha kuandamana na ujumbe; “niende pamoja nanyi” ni wazi, asili, na hudumisha wingi wa wanaosemeshwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi la Mungu, si cheo. Kulitaja “Yahwe” huhifadhi tofauti hiyo ya kimaandiko bila kubadilisha jina kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa simulizi ni mwepesi kusomeka, huku “pamoja nanyi” ikihifadhi namna ya heshima na wingi. Jina Balak limeandikwa “Balaki” kwa umbo la kawaida la majina ya kibiblia katika Kiswahili.
