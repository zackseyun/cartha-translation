source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל בִּלְעָ֗ם לֵ֚ךְ עִם הָ֣/אֲנָשִׁ֔ים וְ/אֶ֗פֶס אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֣/וֹ תְדַבֵּ֑ר וַ/יֵּ֥לֶךְ בִּלְעָ֖ם עִם שָׂרֵ֥י בָלָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/035.yaml
  text: Then the angel of Yahweh said to Balaam[a], “Go with the men, but only the word that I speak to you[c][b], that you shall speak.” So Balaam went with the officials of Balak.
translation:
  language: sw
  text: Kisha malaika wa Yahweh[a] akamwambia Balaamu, “Nenda pamoja na wanaume hao; lakini neno nitakalokuambia, hilo ndilo utakalosema.” Basi Balaamu akaenda pamoja na maafisa wa Balaki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wa Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakuu wa Balaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: מַלְאַךְ inaweza kumaanisha ‘mjumbe’ au ‘malaika’; katika simulizi hili ni kiumbe wa mbinguni anayemkabili Balaamu, hivyo ‘malaika’ inafaa zaidi. Jina יהוה limetoholewa kuwa ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: לֵךְ עִם הָאֲנָשִׁים
  choice: Nenda pamoja na wanaume hao
  rationale: ‘Wanaume hao’ huhifadhi rejeo mahususi la wingi wa kiume na hutaja wale waliokuwa pamoja na Balaamu.
- source_word: וְאֶפֶס
  choice: lakini
  rationale: Hapa neno hili linaweka sharti kali juu ya ruhusa iliyotolewa; ‘lakini’ huleta utofauti huo kwa Kiswahili cha kawaida.
- source_word: הַדָּבָר
  choice: neno
  rationale: Katika muktadha wa kusema, דָּבָר ina maana ya neno au ujumbe. ‘Neno’ huhifadhi umoja na uhusiano wake na kitenzi ‘kusema’.
- source_word: אֲדַבֵּר אֵלֶיךָ
  choice: nitakalokuambia
  rationale: Kauli ya wakati ujao inafaa katika muktadha huu. ‘Kukuambia’ ni Kiswahili cha asili kwa usemi unaoelekezwa kwa mtu.
- source_word: אֹתוֹ תְדַבֵּר
  choice: hilo ndilo utakalosema
  rationale: Kiwakilishi kilichotangulizwa katika Kiebrania kinasisitiza kwamba Balaamu atasema neno hilo, wala si jingine. Muundo ‘hilo ndilo’ huhifadhi msisitizo huo bila kuongeza amri isiyosemwa wazi.
- source_word: שָׂרֵי בָלָק
  choice: maafisa wa Balaki
  rationale: שָׂרִים inaweza kumaanisha watawala, wakuu, au maafisa. ‘Maafisa’ inafaa kwa wajumbe rasmi wa Balaki bila kudokeza lazima kwamba walikuwa wana wa kifalme.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania lina jina binafsi יהוה. ‘Yahweh’ huhifadhi jina hilo kwa kulitohOA badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  alternative: mjumbe wa Yahweh
  rationale: Neno מַלְאַךְ lina utata wa kileksika, lakini muktadha unamwonyesha kama kiumbe wa ulimwengu wa roho. Tafsiri kuu inatumia ‘malaika,’ huku maana nyingine ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa sasa. Muundo ‘hilo ndilo utakalosema’ umetumiwa kuhifadhi msisitizo wa Kiebrania kwa njia ya asili na yenye hadhi.
