  yaml_path: translation/ot/numbers/022/017.yaml
  text: For I will greatly honor you[a], and I will do whatever you say to me. So please come, curse this people for me.
translation:
  language: sw
  text: Kwa maana nitakuheshimu sana[a], nami nitafanya chochote utakachoniambia. Basi, tafadhali njoo unilaanie watu hawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakika nitakuheshimu sana,” au, “nitakupa thawabu nyingi.” Kiebrania hutumia jina-tendo pamoja na kitenzi chenye mzizi uleule ili kusisitiza ahadi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu na ahadi ya Balaki inayosisitiza ombi lake jipya; ‘Kwa maana’ ni kiunganishi cha kawaida na chenye heshima katika Kiswahili.
- source_word: כַבֵּד אֲכַבֶּדְךָ מְאֹד
  choice: nitakuheshimu sana
  rationale: Mzizi כבד una maana ya kumpa mtu heshima, na muundo wa jina-tendo pamoja na kitenzi husisitiza ahadi hiyo; ‘sana’ pia huakisi מְאֹד kwa lugha ya asili.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלַי אֶעֱשֶׂה
  choice: nami nitafanya chochote utakachoniambia
  rationale: ‘Chochote’ huhifadhi upana wa כֹל אֲשֶׁר, na ‘utakachoniambia’ ni Kiswahili cha kawaida kinachowasilisha kusema jambo kwa mhusika.
- source_word: וּלְכָה נָּא
  choice: Basi, tafadhali njoo
  rationale: ‘Njoo’ huwasilisha amri ya mwendo, huku ‘tafadhali’ ikibeba ombi la נָא; ‘Basi’ huunganisha ombi na ahadi iliyotangulia.
- source_word: קָבָה לִּי
  choice: unilaanie
  rationale: Kitenzi hiki katika muktadha wa Balaamu humaanisha kutamka au kuleta laana. Kiambishi ‘-ni-’ pamoja na kauli ya kutendea huonyesha kuwa Balaki anataka jambo hilo lifanywe kwa ajili yake.
- source_word: אֵת הָעָם הַזֶּה
  choice: watu hawa
  rationale: Ingawa עָם ni nomino ya umoja yenye maana ya jamii ya watu, Kiswahili cha kawaida hutumia ‘watu hawa’ kwa rejeo hili bila kupoteza maana ya kundi.
