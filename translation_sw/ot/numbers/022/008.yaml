base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/008.yaml
  text: And he said to them[a], “Lodge here tonight[c][b], and I will bring back word to you according to what Yahweh speaks to me.” So the princes of Moab stayed with Balaam.
translation:
  language: sw
  text: Akawaambia, “Kaeni hapa usiku huu, nami nitawarudishia jibu[a] kulingana na yale atakayosema Yahwe[b] kwangu.” Basi wakuu wa Moabu[c] wakakaa pamoja na Balaamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitawaletea ujumbe” au “nitawajibu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: YHWH, jina la Mungu; kwa mapokeo mengine hutafsiriwa “BWANA,” na pia hutoholewa “Yehova.”'
    reason: alternative_reading
  - marker: c
    text: Au, “maafisa wa Moabu” au “viongozi wa Moabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִינוּ פֹה הַלַּיְלָה
  choice: Kaeni hapa usiku huu
  rationale: Amri ya wingi לִינוּ inawaalika wabaki hapo usiku. Kiswahili hiki ni cha kawaida na kinahifadhi mahali na wakati bila kutumia lugha nzito.
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם דָּבָר
  choice: nitawarudishia jibu
  rationale: Muundo huu wa Kiebrania una maana ya kurudi na neno au jibu kwa waliotuma ombi. ‘Nitawarudishia jibu’ ni wa asili katika Kiswahili na bado unaonyesha kujibu baada ya kupokea ujumbe.
- source_word: כַּאֲשֶׁר יְדַבֵּר יְהוָה אֵלָי
  choice: kulingana na yale ambayo Yahwe atasema nami
  rationale: כַּאֲשֶׁר inaonyesha ulinganifu au kufuata kile kitakachosemwa; wakati ujao unafaa katika muktadha huu. ‘Atasema nami’ huhifadhi wazo la Mungu kuzungumza na Balaamu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: וַיֵּשְׁבוּ
  choice: wakakaa
  rationale: Katika muktadha wa mwaliko wa kubaki usiku, kitenzi kina maana ya kukaa au kubaki pamoja naye.
- source_word: שָׂרֵי מוֹאָב
  choice: wakuu wa Moabu
  rationale: שָׂרִים inaweza kumaanisha wakuu, maafisa, au viongozi. ‘Wakuu’ ni pana vya kutosha kuhifadhi kutobainika kwa cheo chao huku ikionyesha hadhi yao.
- source_word: בִּלְעָם
  choice: Balaamu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuongeza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa simulizi umehifadhiwa kwa ‘Aka-’ na ‘Basi’, huku istilahi za vyeo na namna ya kurudisha jibu zikibaki wazi kupitia tanbihi.
