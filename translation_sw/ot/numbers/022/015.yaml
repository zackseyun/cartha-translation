base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/015.yaml
  text: Then Balak again sent officials[a], more numerous and more honored than these.
translation:
  language: sw
  text: Kisha Balaki akatuma tena maofisa wengi zaidi na wenye heshima kubwa zaidi kuliko wale wa kwanza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... שְׁלֹחַ
  choice: Kisha ... akatuma tena
  rationale: Muundo wa Kiebrania una maana ya kurudia tendo la kutuma; “akatuma tena” ni Kiswahili cha kawaida, huku “Kisha” kikidumisha mfuatano wa simulizi.
- source_word: בָּלָק
  choice: Balaki
  rationale: Jina limetolewa kwa umbo lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: שָׂרִים
  choice: maofisa
  rationale: Neno hili hapa linataja wawakilishi wenye cheo waliotumwa na Balaki; “maofisa” ni la kisasa na linafaa muktadha wa ujumbe rasmi.
- source_word: רַבִּים
  choice: wengi zaidi
  rationale: 'Kirai מֵאֵלֶּה kinafanya maana ya ulinganisho iwe wazi: kundi hili lilikuwa kubwa kwa idadi kuliko la kwanza.'
- source_word: וְנִכְבָּדִים
  choice: wenye heshima kubwa zaidi
  rationale: Neno linahusu hadhi, uzito wa kijamii, au heshima; tafsiri hii ni ya kawaida na inadumisha ulinganisho.
- source_word: מֵאֵלֶּה
  choice: kuliko wale wa kwanza
  rationale: Ingawa maana ya moja kwa moja ni “kuliko hawa,” wanaorejelewa ni maofisa waliotumwa awali; usemi huu unaweka rejeo hilo wazi kwa Kiswahili cha kawaida.
