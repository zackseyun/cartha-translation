id: NUM.22.23
reference: Numbers 22:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָ/אָתוֹן֩ אֶת מַלְאַ֨ךְ יְהוָ֜ה נִצָּ֣ב בַּ/דֶּ֗רֶךְ וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ וַ/תֵּ֤ט הָֽ/אָתוֹן֙ מִן הַ/דֶּ֔רֶךְ וַ/תֵּ֖לֶךְ בַּ/שָּׂדֶ֑ה וַ/יַּ֤ךְ בִּלְעָם֙ אֶת הָ֣/אָת֔וֹן לְ/הַטֹּתָ֖/הּ הַ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/023.yaml
  text: When the donkey saw the angel of Yahweh standing in the road with his sword drawn in his hand[a], the donkey turned aside from the road and went into the field. So Balaam struck the donkey to turn her back to the road.
translation:
  language: sw
  text: Punda-jike alipomwona malaika wa Yahwe[a] amesimama barabarani, upanga wake ukiwa umechomolewa mkononi mwake, akapotoka barabarani na kwenda shambani. Basi Balaamu akampiga punda-jike ili amrudishe barabarani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wa Yahwe.”
    reason: Neno la Kiebrania מַלְאָךְ linaweza kumaanisha ‘malaika’ au ‘mjumbe.’
lexical_decisions:
- source_word: הָאָתוֹן
  choice: punda-jike
  rationale: Nomino ya Kiebrania אָתוֹן humaanisha punda wa kike. ‘Punda-jike’ ni wazi na ya kawaida katika Kiswahili, na pia inawezesha kiwakilishi cha kike katika ‘amrudishe.’
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahwe
  rationale: מַלְאָךְ inaweza kumaanisha ‘mjumbe’ au ‘malaika.’ Katika simulizi hili, kiumbe huyo asiyeonekana na Balaamu amesimama na upanga uliochomolewa, hivyo ‘malaika’ ndiyo maana ya moja kwa moja zaidi; maana nyingine imehifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: amesimama barabarani
  rationale: Kirai hiki kinaonyesha malaika akiwa amesimama ndani ya njia na kuizuia. ‘Amesimama barabarani’ ni sahihi na ya kawaida katika Kiswahili.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְיָדוֹ
  choice: upanga wake ukiwa umechomolewa mkononi mwake
  rationale: שְׁלוּפָה huonyesha upanga uliotolewa alani. Muundo huu wa Kiswahili unahifadhi picha ya upanga uliochomolewa na uliokuwa mkononi mwa malaika.
- source_word: וַתֵּט הָאָתוֹן מִן הַדֶּרֶךְ
  choice: akapotoka barabarani
  rationale: נָטָה hapa ni kuacha mwelekeo wa njia. ‘Akapotoka barabarani’ huwasilisha kwa ufupi na kwa kawaida kwamba punda-jike aliacha barabara.
- source_word: וַתֵּלֶךְ בַּשָּׂדֶה
  choice: na kwenda shambani
  rationale: שָׂדֶה hapa ni shamba au eneo la wazi. ‘Kwenda shambani’ inafaa mazingira ya simulizi na ni Kiswahili cha kawaida.
- source_word: וַיַּךְ
  choice: akampiga
  rationale: נכה ni kumpiga au kumshambulia. ‘Akampiga’ haitii katika kitenzi chenyewe wazo lisilo la lazima la mapigo mengi.
- source_word: לְהַטֹּתָהּ הַדָּרֶךְ
  choice: ili amrudishe barabarani
  rationale: Kitenzi kisababishi chenye kiambishi cha kike kinaonyesha kusudi la kumgeuza punda-jike kuelekea barabarani. Kwa kuwa tayari alikuwa ametoka barabarani, ‘amrudishe’ huonyesha mwelekeo huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi יהוה, si cheo אֲדֹנָי. ‘Yahwe’ huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Maana ya מַלְאַךְ katika kirai מַלְאַךְ יְהוָה
  choice: malaika wa Yahwe
  alternative: mjumbe wa Yahwe
  rationale: Neno linaweza kutaja mjumbe kwa ujumla au malaika. Muktadha wa kiumbe wa mbinguni mwenye upanga unaunga mkono ‘malaika,’ huku uwezekano wa ‘mjumbe’ ukihifadhiwa katika tanbihi bila kuamua zaidi utambulisho wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa ‘akapotoka … na kwenda’ unadumisha mwendo wa haraka wa simulizi la Kiebrania.
