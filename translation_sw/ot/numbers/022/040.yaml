  text: And Balak sacrificed cattle and sheep[b][a], and sent some to Balaam and to the officials who were with him.
translation:
  language: sw
  text: Balaki akatoa dhabihu za ng’ombe na wanyama wa kundi[a], kisha akawapelekea Balaamu na maofisa waliokuwa pamoja naye sehemu za dhabihu hizo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kondoo na mbuzi.” Neno la Kiebrania linamaanisha kwa upana wanyama wadogo wa kufugwa, hasa kondoo na mbuzi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema tu “akatuma” au “akapeleka.” Muktadha unaonyesha kwamba Balaki aliwapelekea Balaamu na maofisa sehemu za wanyama waliotolewa dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: akatoa dhabihu
  rationale: Kitenzi זבח kwa kawaida humaanisha kuchinja kama dhabihu; usemi huu wa Kiswahili unahifadhi maana ya kiibada badala ya kuchinja kwa kawaida tu.
- source_word: בָּקָר
  choice: ng’ombe
  rationale: בקר ni jina la jumla la mifugo ya jamii ya ng’ombe bila kudokeza kuwa wote walikuwa madume.
- source_word: צֹאן
  choice: wanyama wa kundi
  rationale: צאן linaweza kujumuisha kondoo na mbuzi; tafsiri pana inahifadhi upeo huo wa Kiebrania.
- source_word: וַיְשַׁלַּח
  choice: akampelekea ... sehemu zake
  rationale: Kitenzi chenyewe ni 'akatuma/akapeleka,' lakini muktadha wa dhabihu unaonyesha kwamba vilivyopelekwa vilikuwa sehemu za wanyama waliotolewa dhabihu. Nyongeza hii ya ufafanuzi imewekewa tanbihi kwa kuwa haijasemwa wazi katika Kiebrania.
- source_word: לְבִלְעָם
  choice: Balaamu
  rationale: Jina limeandikwa kwa umbo la Kiswahili linalotumika kwa kawaida.
- source_word: לַשָּׂרִים
  choice: maofisa
  rationale: שׂרים hapa ni watu wenye cheo au mamlaka; 'maofisa' ni ya sasa na haidokezi lazima wana wa mfalme.
- source_word: אֲשֶׁר אִתּוֹ
  choice: waliokuwa pamoja naye
  rationale: Kiwakilishi cha Kiebrania kinaelekea kwa Balaamu, nomino ya karibu zaidi ya umoja, huku muundo wa kiwakilishi wa chanzo ukihifadhiwa.
