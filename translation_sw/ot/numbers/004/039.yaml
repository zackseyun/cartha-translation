translation:
  language: sw
  text: Kuanzia umri wa miaka thelathini na kuendelea hadi miaka hamsini, wote wanaoingia katika huduma kwa ajili ya kazi katika Hema la Kukutania—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: kuanzia wenye umri wa miaka thelathini na kuendelea
  rationale: Nahau ya Kiebrania huweka umri wa chini; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha wazo la kuanzia miaka thelathini kwenda juu.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: hadi miaka hamsini
  rationale: Inaonyesha wazi kikomo cha juu cha umri bila kuongeza maelezo yasiyokuwapo katika matini.
- source_word: כָּל הַבָּא
  choice: kila mmoja aliyeingia
  rationale: Kitenzi בוא kina maana ya kuja au kuingia; katika muktadha wa kuhesabiwa kwa ajili ya wajibu, 'aliyeingia' huonyesha kujiunga na huduma hiyo.
- source_word: לַצָּבָא
  choice: katika kikosi
  rationale: צבא hapa si lazima jeshi la kivita, bali kundi lililopangwa kwa wajibu wa Walawi. 'Kikosi' kinahifadhi dhana ya kundi lililopangwa bila kulifanya kuwa jeshi la mapigano.
- source_word: לַעֲבֹדָה
  choice: cha kufanya kazi
  rationale: עֲבֹדָה humaanisha kazi au huduma. Kauli hii inaitofautisha na צבא na kueleza kusudi la kikosi hicho kwa Kiswahili cha kawaida.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika Hema la Kukutania
  rationale: Hili ni jina linaloeleweka la mahali patakatifu panapoitwa אֹהֶל מוֹעֵד; 'katika' hufuata kihusishi cha Kiebrania.
