base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/020.yaml
  text: But they must not go in to look at the holy things for even a moment[a], or they will die.
translation:
  language: sw
  text: Lakini wasiingie kutazama vitu vitakatifu hata kwa muda mfupi[a], la sivyo watakufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa muda mfupi sana.” Usemi wa Kiebrania ni wa kinahau na unaweza kumaanisha kuviona vitu vitakatifu kwa muda mfupi tu, au wakati vinapofunikwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָבֹאוּ
  choice: Lakini wasiingie
  rationale: Muungano wa kiunganishi, ukanushi, na kitenzi unaendeleza maagizo kwa katazo. ‘Wasiingie’ ni Kiswahili cha kawaida kinachoonyesha wazi mwendo wa kuingia.
- source_word: לִרְאוֹת
  choice: kutazama
  rationale: Katika onyo hili, ‘kutazama’ huwasilisha tendo la kuelekeza macho kwa vitu hivyo vizuri kuliko ‘kuona,’ bila kuongeza wazo la kukazia macho kwa muda mrefu.
- source_word: כְבַלַּע
  choice: hata kwa muda mfupi
  rationale: Usemi huu wa Kiebrania ni mgumu na wa kinahau. Tafsiri hii huwasilisha maana inayowezekana ya kitambo kifupi, huku tanbihi ikihifadhi uwezekano kwamba unahusu wakati vitu vitakatifu vinafunikwa.
- source_word: אֶת הַקֹּדֶשׁ
  choice: vitu vitakatifu
  rationale: Ingawa neno la Kiebrania ni la umoja, muktadha unalihusisha kwa maana ya mkusanyo na vyombo vitakatifu vya Maskani vilivyotajwa kabla.
- source_word: וָמֵתוּ
  choice: la sivyo watakufa
  rationale: Kirai hiki kinaonyesha matokeo ya kuvunja katazo. ‘La sivyo watakufa’ ni onyo la moja kwa moja na la kawaida katika Kiswahili.
theological_decisions:
- issue: Kirejelea cha הַקֹּדֶשׁ
  choice: vitu vitakatifu, yaani vyombo vitakatifu vilivyo katika muktadha
  alternative: mahali patakatifu, au kitu kitakatifu kwa maana ya jumla
  rationale: Muktadha wa Hesabu 4 unahusu kufunikwa na kubebwa kwa vyombo vya Maskani. Maana ya mkusanyo inafaa hapa bila kugeuza neno hilo kuwa mahali.
- issue: Maana ya כְבַלַּע
  choice: hata kwa muda mfupi
  alternative: wakati vitu vitakatifu vinafunikwa
  rationale: Usemi huo unaweza kueleweka kuwa kitambo kifupi au tendo la kufunika/kufichwa. Maandishi makuu yanafuata maana ya kitambo, na tanbihi inadumisha utata halisi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Vitu vitakatifu’ ni wazi kwa msomaji wa kawaida; ‘la sivyo’ huhifadhi nguvu ya onyo bila kuwa nzito kupita kiasi.
