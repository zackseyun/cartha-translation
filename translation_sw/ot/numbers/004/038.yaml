- source_word: וּלְבֵית אֲבֹתָם
  choice: na kwa jamaa za baba zao
  rationale: Tafsiri hii huhifadhi muundo wa kijamii wa בית אבות, yaani jamaa pana zinazohusishwa na mababa wa ukoo.
