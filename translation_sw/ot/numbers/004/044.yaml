  text: Nao waliohesabiwa miongoni mwao kwa koo zao walikuwa elfu tatu na mia mbili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Nao ... walikuwa
  rationale: Muundo wa waw pamoja na היה unaendeleza simulizi na kutaja jumla iliyopatikana; “Nao ... walikuwa” ni mwendelezo wa kawaida na wenye heshima katika Kiswahili.
- source_word: פְקֻדֵיהֶם
  choice: waliohesabiwa miongoni mwao
  rationale: Katika muktadha huu wa sensa, neno linawahusu watu waliohesabiwa au kusajiliwa. Tafsiri hii inadumisha uhusiano wao na kundi lililotangulia bila kuongeza neno “wanaume,” ambalo halikutajwa wazi katika mstari huu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה hapa ni kitengo cha ukoo ndani ya kabila; “kwa koo zao” ni lugha ya kawaida na inafaa fomula ya sensa katika Hesabu.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּמָאתָיִם
  choice: elfu tatu na mia mbili
  rationale: Hii ni jumla ya moja kwa moja ya 3,200, iliyoelezwa kwa mpangilio wa kawaida wa nambari katika Kiswahili.
