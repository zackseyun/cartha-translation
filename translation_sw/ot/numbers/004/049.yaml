  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
translation:
  language: sw
  text: Kwa amri ya Yahwe walihesabiwa kwa mkono wa Mose[a], kila mtu kulingana na huduma yake na kulingana na mzigo wake; nao walihesabiwa[b], kama Yahwe alivyomwamuru Mose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kwa mkono wa Mose”; yaani, kupitia Mose au kwa uwakala wake.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania hapa lina utata. Linaweza kumaanisha hesabu au usajili wao; linaweza pia kueleweka kuwa uteuzi, mgawo, au wajibu wa kila mmoja.
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: Kwa amri ya Yahwe
  rationale: Nahau hii ina maana ya kutenda kwa amri ya mtu; jina la Mungu יְהוָה limeandikwa “Yahwe.”
- source_word: פָּקַד אֹתָם
  choice: walihesabiwa
  rationale: Katika muktadha wa sensa ya Walawi, פקד inaelekea kumaanisha kuhesabu au kusajili, ingawa pia inaweza kumaanisha kuteua.
- source_word: בְּיַד מֹשֶׁה
  choice: kupitia Mose
  rationale: Nahau “kwa mkono wa Mose” inaonyesha kwamba Mose ndiye aliyekuwa chombo au wakala wa utekelezaji.
- source_word: אִישׁ אִישׁ
  choice: kila mtu
  rationale: Urudiaji huu una nguvu ya ugawaji na unasisitiza kwamba kila mwanamume alihusika binafsi.
- source_word: עַל עֲבֹדָתוֹ
  choice: kulingana na huduma yake
  rationale: עֲבֹדָה hapa ni kazi au wajibu wa huduma ya kila Mlawi.
- source_word: וְעַל מַשָּׂאוֹ
  choice: na mzigo wake
  rationale: מַשָּׂא ni mzigo aliopaswa kubeba wakati wa kusafirisha vifaa vya Maskani.
- source_word: וּפְקֻדָיו
  choice: Hivyo ndivyo walivyohesabiwa
  rationale: Umbo hili gumu la Kiebrania linatokana na פקד na katika muktadha linaelekea kurudia wazo la wale waliohesabiwa au kusajiliwa; tafsiri hii huepuka kulifanya kwa uhakika kuwa “kazi aliyopangiwa.”
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: kama Yahwe alivyomwamuru Mose
  rationale: Kishazi hiki kinaonyesha kwamba zoezi hilo lilifanywa kwa kufuata amri ya Yahwe kwa Mose.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahwe” hulihifadhi kama jina.
- issue: Maana ya וּפְקֻדָיו
  choice: Hivyo ndivyo walivyohesabiwa
  alternative: na mgawo wake / na walioteuliwa naye
  rationale: Neno lina utata wa kimofolojia na kimaana. Muktadha wa sensa unaunga mkono wazo la kuhesabiwa, lakini tanbihi inahifadhi uwezekano wa kuteuliwa au kupewa wajibu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. “Huduma” na “mzigo” hudumisha msamiati wa kazi za Walawi, huku “kupitia Mose” ikiwasilisha nahau ya Kiebrania kwa njia ya asili.
