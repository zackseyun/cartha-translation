  text: Take a census of the sons of Kohath from among the sons of Levi[a], by their clans, by their fathers’ houses.
translation:
  language: sw
  text: Hesabu idadi ya wazao wa Kohathi miongoni mwa wazao wa Lawi[a], kwa koo zao, na kwa nyumba za baba zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kwa maana halisi, “inua kichwa cha wazao wa Kohathi”; hii ni nahau yenye maana ya kuhesabu watu au kufanya sensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Wahesabu
  rationale: Kirai hiki kwa maana halisi ni ‘inua kichwa,’ lakini katika muktadha wa kiutawala na sensa ni nahau yenye maana ya kuhesabu watu. ‘Wahesabu’ ni Kiswahili cha kawaida na wazi.
- source_word: בְּנֵי קְהָת
  choice: wazao wa Kohathi
  rationale: בְּנֵי hapa inaonyesha ukoo. ‘Wazao wa Kohathi’ huhifadhi maana ya kizazi kwa lugha ya kawaida kuliko ‘wana wa Kohathi,’ ambayo inaweza kueleweka kuwa wana wa moja kwa moja tu.
- source_word: מִתּוֹךְ בְּנֵי לֵוִי
  choice: miongoni mwa wazao wa Lawi
  rationale: מִתּוֹךְ huonyesha kundi linalotolewa ndani ya kundi kubwa zaidi; ‘miongoni mwa’ huwasilisha uhusiano huo kwa usahihi.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Katika sensa za Israeli, מִשְׁפָּחָה hutaja mgawanyo wa ukoo; ‘koo’ ni sahihi na fupi.
- source_word: לְבֵית אֲבֹתָם
  choice: kwa jamaa za baba zao
  rationale: Kirai hiki hutaja vitengo vya kijamaa vinavyotokana na nyumba za mababu. ‘Jamaa za baba zao’ huhifadhi muundo wa ukoo wa upande wa baba bila kutumia tafsiri ya neno kwa neno isiyo ya kawaida.
