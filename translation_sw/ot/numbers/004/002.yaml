translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wazao’ limetumiwa kwa בְּנֵי katika muktadha huu wa nasaba, na ‘jamaa za baba zao’ kwa kitengo cha ukoo kinachoitwa בֵּית אָבוֹת.
