base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/032.yaml
  text: and the pillars of the surrounding court[a], with their bases, their pegs, and their cords, with all their equipment and with all their service; and you shall assign by name the items of the duty of their burden.
translation:
  language: sw
  text: na nguzo za ua pande zote, pamoja na vitako vyake, vigingi vyake na kamba zake, pamoja na vifaa vyake vyote na kazi zake zote; nanyi mtagawa kwa majina vifaa vya wajibu wa mizigo yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa lugha laini zaidi: “mtampatia kila mmoja kwa jina vifaa atakavyowajibika kubeba.”'
    reason: Kirai cha Kiebrania כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם ni kifupi na chenye msongamano; tanbihi inaeleza maana yake kwa Kiswahili cha kawaida bila kuibadilisha kimya kimya katika matini kuu.
lexical_decisions:
- source_word: עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: nguzo za ua unaozunguka
  rationale: עַמּוּדִים ni nguzo za muundo, חָצֵר ni ua, na סָבִיב huonyesha ua unaozunguka Maskani. Muundo huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: אַדְנֵיהֶם
  choice: vitako vyake
  rationale: Katika muktadha wa Maskani, אֶדֶן ni kitako au tundu la msingi linaloshikilia nguzo. “Vitako” ni istilahi fupi inayofaa vifaa vya muundo kuliko “misingi,” ambayo ingeweza kueleweka kuwa msingi mzima wa jengo.
- source_word: יְתֵדֹתָם
  choice: vigingi vyake
  rationale: יָתֵד ni kigingi kinachopigiliwa ardhini ili kukaza muundo wa hema.
- source_word: מֵיתְרֵיהֶם
  choice: kamba zake
  rationale: מֵיתָר ni kamba ya kukazia hema au ua; “kamba” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: לְכָל כְּלֵיהֶם
  choice: pamoja na vifaa vyake vyote
  rationale: כְּלִים hapa ni vifaa vinavyohusiana na muundo wa ua, si vyombo vya ibada pekee.
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: na kazi zake zote
  rationale: עֲבֹדָה inaweza kumaanisha kazi, huduma au wajibu. “Kazi” ni ya asili hapa na haiongezi maana ya kidhehebu.
- source_word: וּבְשֵׁמֹת תִּפְקְדוּ
  choice: mtagawa kwa majina
  rationale: פקד pamoja na בְשֵׁמוֹת inaonyesha ugawaji au ukabidhi wa wajibu kwa watu mmoja mmoja kwa majina, si kuhesabu tu.
- source_word: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם
  choice: vifaa vya wajibu wa mizigo yao
  rationale: Tafsiri hii inadumisha msongamano wa kirai cha Kiebrania kinachounganisha vifaa, wajibu uliokabidhiwa, na mzigo wa kubebwa. Maana laini zaidi imewekwa katika tanbihi.
