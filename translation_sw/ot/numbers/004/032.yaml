translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Vitako,” “vigingi,” na “kamba” vinadumisha taswira halisi ya vifaa vya ua wa Maskani. Alama ya tanbihi imewekwa baada ya kirai kinachofafanuliwa.
