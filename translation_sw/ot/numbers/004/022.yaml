lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Wahesabu
  rationale: Kirai hiki kwa maana halisi ni ‘inua kichwa,’ lakini katika muktadha wa kiutawala ni nahau ya kuhesabu watu au kufanya sensa. ‘Wahesabu’ ni amri ya asili na iliyo wazi kwa Kiswahili.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: wana wa Gershoni
  rationale: Huhifadhi muundo rasmi wa ukoo wa Kiebrania badala ya kuubadili moja kwa moja kuwa jina la kundi la kikabila.
- source_word: גַּם הֵם
  choice: pia
  rationale: Huonyesha kwamba wana wa Gershoni wanajumuishwa pamoja na kundi lililotangulia; kiwakilishi cha mkazo kimewasilishwa kwa kawaida kupitia ‘pia.’
- source_word: לְבֵית אֲבֹתָם
  choice: kwa kufuata koo za baba zao
  rationale: Hurejelea nyumba au mistari ya ukoo inayotokana na upande wa baba. ‘Koo za baba zao’ ni wazi katika Kiswahili cha sasa na huhifadhi mpangilio huo wa nasaba.
- source_word: לְמִשְׁפְּחֹתָם
  choice: jamaa zao
  rationale: Katika sensa ya kikabila, neno hili hurejelea vikundi vya jamaa ndani ya koo, si familia ndogo ya kisasa pekee. ‘Jamaa zao’ hulitofautisha kwa kiasi kinachofaa na ‘koo za baba zao.’
