base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/035.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who comes for service, to do the work in the tent of meeting.
translation:
  language: sw
  text: Kuanzia umri wa miaka thelathini na kuendelea hadi umri wa miaka hamsini, kila anayekuja kwa ajili ya utumishi[a] kufanya kazi katika Hema la Kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa "utumishi" linaweza pia kumaanisha wajibu uliopangwa au kikosi cha utumishi; katika muktadha huu halimaanishi vita moja kwa moja.
    reason: cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: kuanzia umri wa miaka thelathini na kuendelea
  rationale: Muundo huu unaonyesha kwa Kiswahili cha kawaida mwanzo wa kiwango cha umri na kuhifadhi maana ya וָמַעְלָה, yaani kuendelea juu ya miaka thelathini.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: hadi miaka hamsini
  rationale: Neno 'hadi' linaonyesha kikomo cha juu cha umri kwa uwazi bila kuongeza ufafanuzi usiomo katika Kiebrania.
- source_word: כָּל הַבָּא
  choice: kila mmoja anayekuja
  rationale: Huhifadhi hali ya kitenzi-shirikishi cha בוא na maana yake ya wale wanaokuja au kuingia katika wajibu huu.
- source_word: לַצָּבָא
  choice: katika utumishi
  rationale: Katika muktadha wa sensa ya Walawi, צָבָא inaonyesha utumishi au wajibu uliopangwa, si vita moja kwa moja. 'Utumishi' ni neno la kawaida na lisilo na mzigo wa kimadhehebu.
- source_word: לַעֲבֹדָה
  choice: kufanya kazi
  rationale: Hutofautisha עֲבֹדָה na צָבָא iliyotangulia na kueleza kwa kawaida kusudi la kuja katika utumishi.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika Hema la Kukutania
  rationale: Ni tafsiri iliyo wazi na ya kawaida ya jina hili la mahali patakatifu; 'katika' linaonyesha eneo au nyanja ya kazi.
