base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/028.yaml
  text: This is the service of the families of the sons of the Gershonites in the tent of meeting[b][a], and their duty shall be under the hand of Ithamar son of Aaron the priest.
translation:
  language: sw
  text: Hii ndiyo huduma ya familia za wazao wa Gershoni katika Hema la Kukutania, na wajibu wao[a] utakuwa chini ya usimamizi wa Ithamari[b], mwana wa kuhani Aroni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jukumu lao”; neno la Kiebrania linaweza kumaanisha wajibu au jukumu walilokabidhiwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “mkononi mwa Ithamari,” nahau inayomaanisha kuwa chini ya usimamizi au mamlaka yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Hii ndiyo huduma
  rationale: Muundo huu unatambulisha kazi waliyopewa. “Huduma” linafaa kwa kazi ya Hema la Kukutania bila kuingiza maana maalumu ya kimadhehebu.
- source_word: מִשְׁפְּחֹת בְּנֵי הַגֵּרְשֻׁנִּי
  choice: familia za wazao wa Gershoni
  rationale: “Familia” linawakilisha מִשְׁפְּחֹת, na “wazao wa Gershoni” linaonyesha uhusiano wa ukoo uliomo katika בְּנֵי huku likitoa Kiswahili cha kawaida na wazi.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika Hema la Kukutania
  rationale: Hili ni jina la kawaida na linaloeleweka la mahali pa kukutania, huku “katika” likidumisha wazo la eneo au nyanja ya huduma.
- source_word: וּמִשְׁמַרְתָּם
  choice: na wajibu wao
  rationale: Neno מִשְׁמֶרֶת hapa linaonyesha jukumu au wajibu rasmi waliokabidhiwa katika huduma ya hema.
- source_word: בְּיַד
  choice: chini ya usimamizi wa
  rationale: Hii ni nahau inayomaanisha kuwa chini ya mamlaka au uangalizi wa mtu. Tafsiri hii ni ya asili katika Kiswahili, huku tanbihi ikihifadhi taswira halisi ya Kiebrania.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Ithamari, mwana wa kuhani Aroni
  rationale: Majina yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili; mpangilio huu unaonyesha wazi kwamba Aroni ndiye kuhani, bila kubadili uhusiano wa kifamilia.
