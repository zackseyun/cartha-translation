base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/027.yaml
  text: All the service of the sons of the Gershonites shall be at the command of Aaron and his sons[a], for all their loads and for all their service; and you shall assign to them, as a duty[b], all their loads.
translation:
  language: sw
  text: Utumishi wote wa wazao wa Gershoni utakuwa kwa amri ya Haruni na wanawe[a], kuhusu mizigo yao yote na utumishi wao wote; nanyi mtawakabidhi mizigo yao yote iwe wajibu wao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na neno la Haruni na wanawe.” Nahau ya Kiebrania kihalisi ni “juu ya kinywa cha.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kama jukumu walilokabidhiwa.” Neno la Kiebrania linaweza kumaanisha jukumu au wajibu uliokabidhiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: kwa amri ya
  rationale: Nahau hii, ambayo kihalisi ni ‘juu ya kinywa cha,’ hapa inaonyesha kwamba utumishi ulifanywa kwa amri au maelekezo ya Haruni na wanawe.
- source_word: תִּהְיֶה
  choice: utakuwa
  rationale: Kitenzi hiki kinaendeleza sauti ya agizo la kiutawala kwa Kiswahili cha kawaida bila kuongeza maana isiyokuwamo.
- source_word: עֲבֹדַת
  choice: utumishi
  rationale: Katika muktadha wa Walawi na hema la kukutania, neno hili linahusu kazi waliyopewa pamoja na wajibu wao wa huduma; ‘utumishi’ linahifadhi pande hizo zote.
- source_word: בְּנֵי הַגֵּרְשֻׁנִּי
  choice: wazao wa Gershoni
  rationale: Kirai cha Kiebrania kinawataja watu wa ukoo uliotokana na Gershoni. ‘Wazao wa Gershoni’ ni wazi na cha asili katika Kiswahili.
- source_word: לְכָל מַשָּׂאָם
  choice: kuhusu mizigo yao yote
  rationale: Neno מַשָּׂא hapa linamaanisha vitu walivyopaswa kubeba wakati wa kulihamisha hema. ‘Kuhusu’ huonyesha wigo wa mamlaka ya Haruni na wanawe, na ‘mizigo’ hudumisha maana halisi ya usafirishaji.
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: na utumishi wao wote
  rationale: Kurudia ‘utumishi’ kunadumisha ulinganifu wa msamiati wa Kiebrania na kuonyesha kwamba usimamizi ulihusu kazi yao yote.
- source_word: וּפְקַדְתֶּם עֲלֵיהֶם
  choice: nanyi mtawapangia
  rationale: Katika muundo huu פקד lina maana ya kuwapa au kuwapangia jukumu. Wingi wa nafsi ya pili umehifadhiwa kwa ‘nanyi mtawa-’.
- source_word: בְּמִשְׁמֶרֶת
  choice: kuwa wajibu wao
  rationale: Neno hili linaweza kuonyesha jukumu lililokabidhiwa, dhamana, au wajibu wa kutekelezwa. ‘Kuwa wajibu wao’ ni la wazi katika Kiswahili cha sasa.
- source_word: אֵת כָּל מַשָּׂאָם
  choice: mizigo yao yote
  rationale: Kirai hiki ndicho kitu walichopangiwa kuwajibikia. Kurudia ‘mizigo yao yote’ kunafuata msisitizo wa maandishi ya Kiebrania.
