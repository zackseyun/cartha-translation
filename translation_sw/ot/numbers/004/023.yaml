base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/023.yaml
  text: From thirty years old and upward to fifty years old[a], you shall count them, everyone who comes to do the service, to do the work in the tent of meeting.
translation:
  language: sw
  text: Utawahesabu kuanzia wenye umri wa miaka thelathini na zaidi hadi wenye umri wa miaka hamsini, kila anayekuja kutekeleza wajibu[a] na kufanya kazi katika Hema la Kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kufanya utumishi.” Neno la Kiebrania linaweza kutumiwa kuhusu wajibu wa kijeshi; hapa linarejelea utumishi uliopangwa katika Hema la Kukutania.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה עַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: kuanzia wenye umri wa miaka thelathini na zaidi hadi wenye umri wa miaka hamsini
  rationale: Nahau ya Kiebrania ya בֶּן pamoja na umri inaonyesha kiwango cha umri, si uana halisi. Kiswahili hiki kinawasilisha kikomo cha chini na cha juu kwa uwazi.
- source_word: תִּפְקֹד אֹתָם
  choice: utawahesabu
  rationale: Katika muktadha wa sensa na upangaji wa Walawi, פקד humaanisha kuhesabu au kuandikisha. ‘Utawahesabu’ ni ya kawaida na inafaa muktadha wa karibu.
- source_word: כָּל הַבָּא
  choice: kila anayekuja
  rationale: Kirai hiki kinamhusu kila mtu anayestahili kuingia katika huduma, na tafsiri hii inadumisha maana yake ya kugawa kwa kila mmoja.
- source_word: לִצְבֹא צָבָא
  choice: kutekeleza wajibu
  rationale: Muundo huu wa maneno yenye mzizi mmoja unaashiria kuingia katika huduma iliyopangwa. ‘Kutekeleza wajibu’ ni Kiswahili cha kawaida kisichodokeza mapigano halisi, huku tanbihi ikihifadhi taswira ya kijeshi.
- source_word: לַעֲבֹד עֲבֹדָה
  choice: kufanya kazi
  rationale: Kitenzi na nomino zenye mzizi mmoja zinasisitiza utekelezaji wa kazi waliyopewa. ‘Kufanya kazi’ ni tafsiri ya kawaida na iliyo wazi.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika Hema la Kukutania
  rationale: Hili ni jina linalotambulika katika Kiswahili kwa mahali patakatifu pa kukutana, na ‘katika’ inadumisha kihusishi cha Kiebrania.
theological_decisions:
- issue: Iwapo lugha ya צבא itafsiriwe kwa istilahi za kijeshi zilizo wazi
  choice: kutekeleza wajibu
  alternative: kutumikia katika jeshi / kufanya kazi ya kijeshi
  rationale: Ingawa צבא inaweza kutaja huduma ya kijeshi, hapa Walawi wanapangiwa kazi za Hema la Kukutania, si vita. Tafsiri kuu inaeleza huduma iliyopangwa, na tanbihi inadumisha taswira ya kijeshi iliyomo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Urudiaji wa dhana mbili za huduma na kazi umehifadhiwa bila kuufanya uwe mzito kupita kiasi.
