lexical_decisions:
- source_word: זֹאת
  choice: Hii ndiyo
  rationale: Kiwakilishi cha kuonyesha cha kike katika Kiebrania kinaanzisha kishazi nomino; Kiswahili hutumia kwa kawaida “Hii ndiyo” kwa kurejelea huduma.
- source_word: עֲבֹדַת
  choice: huduma
  rationale: Neno עֲבֹדָה linaweza kumaanisha huduma, kazi, au wajibu; “huduma” linafaa katika muktadha wa kazi za Walawi bila kuifanya iwe kazi ya mikono pekee.
- source_word: מִשְׁפְּחֹת
  choice: ya jamaa
  rationale: Wingi wa hali ya muunganiko unaonyesha vikundi vya kifamilia; “jamaa” ni neno la kawaida na la asili kwa migawanyo hii ya ukoo.
- source_word: הַגֵּרְשֻׁנִּי
  choice: Wagershoni
  rationale: Nomino ya kijamii inarejelea kwa pamoja wazao wa Gershoni; umbo la wingi “Wagershoni” linaendana na “jamaa za.”
- source_word: לַעֲבֹד
  choice: kutumikia
  rationale: Kitenzi-jina chenye ל kinaonyesha kusudi au jukumu; “kutumikia” huhifadhi maana ya kutoa huduma na ulinganifu na “kubeba.”
- source_word: וּלְמַשָּׂא
  choice: na kubeba mizigo
  rationale: מַשָּׂא humaanisha mzigo au kitu kinachobebwa; “kubeba mizigo” hueleza kwa uwazi jukumu la usafirishaji katika muktadha wa hema.
