  text: This is the service of the families of the Gershonites[a], for serving and for carrying.
translation:
  language: sw
  text: Hii ndiyo huduma ya jamaa za Wagershoni, kwa ajili ya kutumika na kubeba mizigo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya kutumika na kuzibeba.”
