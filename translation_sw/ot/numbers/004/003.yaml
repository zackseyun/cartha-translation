  text: from thirty years old and upward[a], up to fifty years old[b], everyone who enters the service to do the work in the tent of meeting.
translation:
  language: sw
  text: kuanzia miaka thelathini na kuendelea hadi miaka hamsini, kila anayeingia katika utumishi[a], ili afanye kazi katika Hema la Kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila anayekuja kwa ajili ya utumishi.” “Utumishi” hutafsiri neno la Kiebrania צָבָא, ambalo pia linaweza kumaanisha wajibu, kikosi, au jeshi; hapa linamaanisha utumishi uliopangwa wa Walawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: kuanzia wenye umri wa miaka thelathini na kuendelea
  rationale: Muundo wa Kiebrania בֶּן pamoja na idadi na שָׁנָה ni nahau ya kutaja umri; “na kuendelea” huhifadhi wazi kikomo cha chini cha umri.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: hadi wenye umri wa miaka hamsini
  rationale: Tafsiri hii inaonyesha kwa lugha ya kawaida kikomo cha juu cha umri bila kuongeza maelezo yasiyokuwamo katika chanzo.
- source_word: כָּל בָּא לַצָּבָא
  choice: kila anayekuja kutumikia
  rationale: בָּא ni hali ya kuendelea ya kitenzi “kuja/kuingia,” na צָבָא hapa hurejelea utumishi uliopangwa wa Walawi, si vita. Kiswahili hiki ni cha kawaida na huhifadhi wazo la kuja kwa ajili ya jukumu hilo.
- source_word: לַעֲשׂוֹת מְלָאכָה
  choice: na kufanya kazi
  rationale: Kirai hiki kinaeleza kusudi la kufanya kazi iliyogawiwa; “kufanya kazi” ni wazi na ya asili katika Kiswahili.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika Hema la Kukutania
  rationale: “Hema la Kukutania” ni tafsiri iliyozoeleka ya אֹהֶל מוֹעֵד, na “katika” hufuata kihusishi cha Kiebrania בְּ.
theological_decisions:
- issue: Maana ya צָבָא katika mazingira ya Walawi
  choice: kutumikia
  alternative: kuingia katika jeshi/kikosi
  rationale: Katika Hesabu 4 neno hili linaonyesha utumishi au wajibu uliopangwa katika Hema la Kukutania, wala si huduma ya kijeshi; tafsiri haipaswi kuingiza wazo la vita.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa umri umewekwa kwa lugha ya kawaida, na utata wa kimsamiati wa צָבָא umehifadhiwa katika tanbihi.
