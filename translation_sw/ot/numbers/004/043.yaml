translation:
  language: sw
  text: Kuanzia umri wa miaka thelathini na kuendelea hadi umri wa miaka hamsini, kila anayeingia katika utumishi[a], kwa ajili ya kazi katika Hema la Kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila anayekuja kwa ajili ya utumishi.” Neno la Kiebrania linalotafsiriwa “utumishi” linaweza kumaanisha wajibu uliopangwa, na nyakati nyingine huwa na maana zinazohusiana na jeshi; hapa linahusu utumishi wa Walawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן ... שְׁלֹשִׁים שָׁנָה
  choice: kuanzia wenye umri wa miaka thelathini
  rationale: Nahau ya Kiebrania בֶּן pamoja na idadi na שָׁנָה huonyesha umri; Kiswahili cha kawaida hutumia ‘wenye umri wa miaka ...’.
- source_word: וָמַעְלָה
  choice: na kuendelea
  rationale: Inaonyesha kuwa miaka thelathini ndiyo mpaka wa chini unaohesabiwa ndani ya kundi.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: hadi wenye umri wa miaka hamsini
  rationale: Inaweka mpaka wa juu wa umri bila kulazimisha ufafanuzi zaidi kuhusu namna ya kuhesabu mwisho huo.
- source_word: כָּל הַבָּא
  choice: kila anayekuja
  rationale: Kivumishi-tendo cha בוא kimetafsiriwa bila kufuta taswira ya kuja au kujitokeza kwa ajili ya wajibu.
- source_word: לַצָּבָא
  choice: kutumikia
  rationale: Katika muktadha huu צָבָא humaanisha huduma au wajibu uliopangwa wa Walawi, si jeshi kwa maana finyu.
- source_word: לַעֲבֹדָה
  choice: katika kazi
  rationale: עֲבֹדָה ni kazi au utumishi; ‘kazi’ huitofautisha na צָבָא huku ikitoa Kiswahili cha asili.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ya Hema la Kukutania
  rationale: Hili ni jina la kawaida la mahali patakatifu; muundo ‘kazi ya’ ni wa asili katika Kiswahili na unaonyesha kazi inayohusiana na kufanywa katika hema hilo.
