  yaml_path: translation/ot/numbers/004/036.yaml
  text: And those counted from them by their clans were two thousand seven hundred and fifty.
translation:
  language: sw
  text: Nao waliohesabiwa miongoni mwao kwa koo zao walikuwa elfu mbili mia saba na hamsini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Nao ... walikuwa
  rationale: Kiunganishi cha simulizi kinaendeleza taarifa ya sensa, huku kitenzi kikibaki na maana rahisi ya kuwapo au kuwa na jumla fulani.
- source_word: פְקֻדֵיהֶם
  choice: waliohesabiwa miongoni mwao
  rationale: Katika muktadha wa sensa, neno hili linawahusu wale waliosajiliwa au kuhesabiwa. Tafsiri hii huhifadhi maana ya kutendwa bila kuongeza waziwazi neno ‘wanaume,’ ambalo halipo katika mstari huu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Neno la Kiebrania linaonyesha vikundi vya ukoo ndani ya muundo wa kikabila wa Israeli; ‘koo’ ni la kawaida na sahihi katika Kiswahili cha sensa hii.
- source_word: אַלְפַּיִם שְׁבַע מֵאוֹת וַחֲמִשִּׁים
  choice: elfu mbili mia saba na hamsini
  rationale: Jumla kamili ya 2,750 imetolewa kwa maneno kwa mtiririko wa kawaida wa Kiswahili.
