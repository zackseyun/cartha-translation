lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Kitenzi דבר katika mfululizo wa masimulizi kinaanzisha hotuba ya Mungu. “Akasema” ni Kiswahili cha sasa, cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo kama “Bwana.”
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: na Musa na Haruni
  rationale: Katika Kiswahili, “kusema na” huonyesha watu walioelekezewa maneno. Kurudiwa kwa אֶל katika Kiebrania kunawakazia Musa na Haruni kama waelekezewa wote wawili, ingawa si lazima kurudia kihusishi katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Infinitivu hii ni fomula ya kutanguliza maneno yanayofuata. “Akisema” huhifadhi muundo huo bila kutangulia maudhui ya hotuba.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yana jina la herufi nne יהוה. “Yahwe” hulihifadhi kama jina binafsi la Mungu; “Yehova” ni namna nyingine ya jadi ya kulitaja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Fomula “akasema … akisema” imehifadhiwa kwa sababu inaakisi moja kwa moja utangulizi wa hotuba katika Kiebrania, ingawa ina urudiaji mdogo wa kimtindo.
