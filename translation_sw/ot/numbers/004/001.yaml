  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: sw
  text: 'Yahwe[a] akasema kwa Musa na Haruni, akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: יהוה (YHWH); pia hutamkwa kwa jadi “Yehova.”'
