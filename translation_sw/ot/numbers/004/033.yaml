  text: זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹת֙ בְּנֵ֣י מְרָרִ֔י לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/033.yaml
  text: This is the service of the clans of the sons of Merari for all their service in the tent of meeting[a], under the direction of Ithamar son of Aaron the priest.
translation:
  language: sw
  text: Hii ndiyo huduma ya koo za wana wa Merari kwa huduma yao yote katika Hema la Kukutania, chini ya usimamizi[a] wa Ithamari mwana wa Haruni kuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa tafsiri ya neno kwa neno, “kwa mkono wa Ithamari”; hii ni nahau inayomaanisha usimamizi au uongozi wa kiutawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Hii ndiyo huduma
  rationale: Kiashirio זֹאת kinaanzisha muhtasari wa wajibu uliotajwa, na עֲבֹדָה katika muktadha huu ni huduma maalumu ya Walawi, si kazi ya kawaida tu.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: koo za wana wa Merari
  rationale: מִשְׁפְּחֹת hapa ni vikundi vya ukoo ndani ya kabila; “koo” ni sahihi zaidi kuliko “familia.” “Wana wa Merari” huhifadhi namna ya usemi wa nasaba wa Kiebrania.
- source_word: לְכָל עֲבֹדָתָם
  choice: kwa huduma yao yote
  rationale: לְ inaonyesha uhusiano na jumla ya majukumu yao, huku kurudiwa kwa neno “huduma” kukihifadhiwa kama katika Kiebrania.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika Hema la Kukutania
  rationale: Hili ni jina la kawaida la mahali patakatifu pa kukutana; “katika” linaakisi kihusishi בְּ na eneo la huduma.
- source_word: בְּיַד
  choice: chini ya usimamizi
  rationale: Ingawa maana ya neno kwa neno ni “kwa mkono wa,” hapa ni nahau ya mamlaka ya kusimamia au kuelekeza kazi.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Ithamari mwana wa Haruni kuhani
  rationale: Majina yameandikwa kwa maumbo yanayotambulika katika Kiswahili cha Biblia, na kirai kinamtambulisha Ithamari kwa ukoo wake huku הַכֹּהֵן likimwelezea Haruni.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Kurudiwa kwa “huduma” kunahifadhi muundo wa Kiebrania, na “koo” linaonyesha vikundi vya ukoo badala ya familia za nyumbani.
