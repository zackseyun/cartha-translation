base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/041.yaml
  text: These were the counted men of the families of the sons of Gershon[a], all who served in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh.
translation:
  language: sw
  text: Hawa ndio waliohesabiwa katika jamaa za wana wa Gershoni[a]—wote waliotumikia katika Hema ya Kukutania—ambao Musa na Haruni waliwahesabu kwa amri ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hawa ndio walioorodheshwa katika jamaa za wana wa Gershoni.”
    reason: Kitenzi פקד katika muktadha wa sensa kinaweza kutolewa kama ‘kuhesabiwa’ au ‘kuorodheshwa’; muundo wa Kiebrania pia unaweza kueleweka kama kutaja wale walio katika jamaa hizo.
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Hawa ndio waliohesabiwa
  rationale: Muundo huu unatoa muhtasari wa sensa kwa Kiswahili cha kawaida, huku ukihifadhi maana ya watu walioandikishwa au kuhesabiwa. ‘Hawa ndio’ halazimishi tofauti ya wakati ambayo Kiebrania hapa haiibainishi wazi.
- source_word: מִשְׁפְּחֹת
  choice: jamaa
  rationale: Katika muktadha wa mpangilio wa kikabila wa Israeli, ‘jamaa’ linaonyesha vikundi vya kifamilia ndani ya kabila bila kudokeza familia moja ndogo tu.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: wana wa Gershoni
  rationale: Usemi rasmi wa undugu umehifadhiwa badala ya kutumia jina la kundi pekee; ‘Gershoni’ ni umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: כָּל הָעֹבֵד
  choice: wote waliotumikia
  rationale: Kitenzi ‘kutumikia’ kinafaa kwa huduma yao ya kikuhani na ya Hema, na wingi unapatana na kundi linalorejelewa.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika Hema la Kukutania
  rationale: Ni jina linaloeleweka la mahali patakatifu; ‘katika’ linafuata kihusishi cha Kiebrania huku likiruhusu huduma iliyohusiana na Hema kwa upana.
- source_word: אֲשֶׁר פָּקַד
  choice: ambao ... waliwahesabu
  rationale: Kishazi rejeshi kinawarejelea watu waliohesabiwa, na kurudia ‘hesabu’ kunadumisha uhusiano wa kileksika na פקד katika mstari huu.
- source_word: עַל פִּי יְהוָה
  choice: kwa amri ya Yahwe
  rationale: Hii ni tafsiri ya kawaida na wazi ya nahau ya Kiebrania ‘kwa kinywa cha,’ ikionyesha kwamba tendo hilo lilifanywa kwa mamlaka ya agizo la Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa kama jina binafsi badala ya kubadilishwa na cheo kama ‘BWANA.’
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja; ‘Yahwe’ huhifadhi jina hilo na ndio umbo linalokaribia zaidi matamshi yanayokubalika kitaaluma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mtindo wa taarifa rasmi ya sensa lakini inaepuka ugumu usio wa lazima; vistari virefu vinatenga maelezo ya kundi linalohusika.
