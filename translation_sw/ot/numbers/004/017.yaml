  rationale: Jina la Mungu YHWH limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: אֶל ... וְאֶל
  choice: na ... na
  rationale: Katika Kiswahili, kusema “alisema na” ni njia ya asili ya kutaja wanaoambiwa; kurudiwa kwa “na” kunaonyesha wazi kwamba Mose na Aroni wote walikuwa waambiwa.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Kwa kuwa maneno yenyewe yanafuata katika mstari unaofuata, nukta mbili huingiza usemi huo kwa Kiswahili cha asili bila kurudia “akisema” baada ya “akasema”.
