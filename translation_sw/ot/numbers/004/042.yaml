lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: Nao waliohesabiwa
  rationale: Nomino hii inarejelea wale waliotiwa katika hesabu; Kiswahili hiki huhifadhi wazo la kuhesabiwa bila kuongeza kwa wazi neno ‘wanaume,’ ambalo halipo katika mstari huu.
- source_word: מִשְׁפְּחֹת
  choice: koo
  rationale: Katika muktadha wa mpangilio wa Walawi, ‘koo’ ni tafsiri ya kawaida na ya asili ya vikundi vya kifamilia.
- source_word: בְּנֵי מְרָרִי
  choice: wana wa Merari
  rationale: Huhifadhi uhusiano wa ukoo ulioelezwa moja kwa moja katika Kiebrania.
- source_word: לְבֵית אֲבֹתָם
  choice: kwa jamaa za baba zao
  rationale: Hutoa maana ya makundi ya ukoo wa upande wa baba kwa lugha ya sasa, huku ikitofautisha kiwango hiki na ‘koo.’
