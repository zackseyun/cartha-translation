translation:
  language: sw
  text: Wanaume waliohesabiwa miongoni mwao walikuwa elfu nane mia tano na themanini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wale waliohesabiwa miongoni mwao” au “walioorodheshwa miongoni mwao.” Neno la Kiebrania linawarejelea wale waliosajiliwa katika sensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walikuwa
  rationale: Katika taarifa hii ya jumla ya sensa, kitenzi hiki kinafanya kazi kama kiunganishi cha wakati uliopita; “walikuwa” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: פְּקֻדֵיהֶם
  choice: wanaume wao waliohesabiwa
  rationale: Nomino inayotokana na פקד hapa inawahusu walioandikishwa na kuhesabiwa katika sensa. Muktadha wa Hesabu 4 unahusu wanaume Walawi waliostahili huduma, hivyo “wanaume” linaonyesha kwa usahihi watu wanaorejelewa.
- source_word: שְׁמֹנַת אֲלָפִים
  choice: elfu nane
  rationale: Huu ni muundo wa kawaida wa namba, umetafsiriwa moja kwa moja kwa Kiswahili sanifu.
- source_word: וַחֲמֵשׁ מֵאוֹת
  choice: mia tano
  rationale: Ni sehemu inayofuata ya jumla ya namba; Kiswahili hutumia muundo wa kawaida “mia tano” bila kuhitaji kiunganishi hapa.
- source_word: וּשְׁמֹנִים
  choice: na themanini
  rationale: Ni sehemu ya mwisho ya mfuatano wa kujumlisha; “na themanini” huhifadhi kiunganishi cha Kiebrania na kutoa jumla kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Istilahi ya kijinsia katika sensa
  choice: wanaume wao waliohesabiwa
  alternative: watu wao waliohesabiwa; waliohesabiwa miongoni mwao
  rationale: Muktadha mpana wa Hesabu 4 unawahesabu wanaume wa umri maalumu waliostahili kufanya huduma ya hema la kukutania. Kutaja “wanaume” huonyesha jinsia ya watu wanaorejelewa bila kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa namba ni wa kawaida na unaeleweka kwa urahisi; alama ya tanbihi imewekwa baada ya sentensi.
