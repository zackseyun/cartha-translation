base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/009.yaml
  text: Then they shall take a blue cloth and cover the lampstand for the light[a], along with its lamps, its tongs, its firepans, and all its oil vessels with which they minister to it.
translation:
  language: sw
  text: Kisha watachukua kitambaa cha buluu[a] na kukifunika kinara cha mwanga, pamoja na taa zake, makoleo yake, vyetezo vyake, na vyombo vyake vyote vya mafuta wanavyotumia kukihudumia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitambaa cha buluu-zambarau.” Neno la Kiebrania תְּכֵלֶת linamaanisha kitambaa chenye rangi maalumu kilichotumiwa katika maskani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד תְּכֵלֶת
  choice: kitambaa cha buluu
  rationale: בֶּגֶד hapa ni kitambaa, si vazi; תְּכֵלֶת ni kitambaa chenye rangi maalumu ya buluu au buluu-zambarau kilichotumiwa katika maskani. ‘Kitambaa cha buluu’ ni tafsiri ya kawaida na iliyo wazi, huku upeo wa rangi ukielezwa katika tanbihi.
- source_word: מְנֹרַת הַמָּאוֹר
  choice: kinara cha taa cha kuangaza
  rationale: מְנוֹרָה ni kinara cha taa, na הַמָּאוֹר inaonyesha kazi yake ya kutoa mwanga. ‘Cha kuangaza’ ni Kiswahili cha asili kinachohifadhi maana hiyo ya kiutendaji bila kukifanya kuwa taa moja tu.
- source_word: נֵרֹתֶיהָ
  choice: taa zake
  rationale: נֵרֹת ni taa moja moja zilizowekwa juu ya kinara; ‘taa zake’ ni wazi na ya kawaida katika Kiswahili.
- source_word: מַלְקָחֶיהָ
  choice: makoleo yake
  rationale: Neno hili linataja vifaa vya kushika au kutengeneza tambi za taa. ‘Makoleo’ huhifadhi maana pana bila kudai kazi maalumu isiyo na uhakika.
- source_word: מַחְתֹּתֶיהָ
  choice: vyetezo vyake
  rationale: מַחְתָּה ni chombo cha kubebea makaa au moto. Katika muktadha wa kutunza taa, ‘vyetezo’ linafaa kuliko ‘vyombo vya kufukizia uvumba,’ ambalo lingeingiza matumizi ya uvumba yasiyotajwa hapa.
- source_word: כָּל כְּלֵי שַׁמְנָהּ
  choice: vyombo vyake vyote vya mafuta
  rationale: כְּלִים ni vyombo au vifaa, na שַׁמְנָהּ ni mafuta yanayohusiana na kinara. Tafsiri hii ni fupi na inahifadhi kiambishi cha umilikaji.
- source_word: אֲשֶׁר יְשָׁרְתוּ לָהּ בָּהֶם
  choice: wanavyotumia kukihudumia
  rationale: Kiebrania kinaeleza kwamba vyombo hivyo ndivyo vinavyotumiwa katika kukihudumia kinara. Kiswahili hiki cha asili kinahifadhi mhusika wa jumla wa wingi na kazi ya vyombo kama vifaa vya huduma.
