base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/005.yaml
  text: When the camp sets out[a], Aaron and his sons shall come and take down the veil of the screen, and cover the ark of the testimony with it.
translation:
  language: sw
  text: Kambi itakapoondoka, Aroni na wanawe watakuja na kulishusha pazia la kizuizi, kisha watalifunika Sanduku la Ushuhuda kwa pazia hilo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri iliyozoeleka zaidi, “Sanduku la Agano.” Hata hivyo, hapa Kiebrania kinasema “ushuhuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: wataingia
  rationale: Kitenzi kiko katika umoja kimaumbo, lakini kiima chake cha pamoja ni Aroni na wanawe, na vitenzi vinavyofuata viko katika wingi. “Wataingia” huwasilisha agizo la wakati ujao kwa Kiswahili cha kawaida.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: Kambi itakapoanza safari
  rationale: Muundo wa ב pamoja na kitenzi-jina unaonyesha wakati. “Itakapoanza safari” ni usemi wa sasa na wa kawaida unaoeleza kambi kuondoka ili kusafiri.
- source_word: וְהוֹרִדוּ
  choice: walishushe
  rationale: Katika muktadha wa kuvunja na kufungasha maskani, kitenzi kinaonyesha kuliondoa pazia kutoka mahali pake kwa kulishusha.
- source_word: פָּרֹכֶת
  choice: pazia
  rationale: Neno hili ni pazia maalumu la ndani la mahali patakatifu. “Pazia” ni la kawaida na linaeleweka, huku muktadha ukihifadhi matumizi yake maalumu.
- source_word: הַמָּסָךְ
  choice: la kizuizi
  rationale: Kirai “pazia la kizuizi” kinahifadhi wazo la pazia linalotenganisha au kuficha bila kulifanya kuwa pazia la kawaida tu.
- source_word: וְכִסּוּ בָהּ
  choice: kisha kwa pazia hilo walifunike
  rationale: Kitenzi כסה ni “funika,” na kiwakilishi cha kike kinarejelea pazia. “Kwa pazia hilo” huonyesha wazi kwamba pazia ndilo linalotumiwa kufunika.
- source_word: אֲרֹן הָעֵדֻת
  choice: Sanduku la Ushuhuda
  rationale: Maandishi ya Kiebrania yana עֵדוּת, “ushuhuda,” si בְּרִית, “agano.” Tafsiri inafuata kwa makusudi neno lililo katika chanzo.
theological_decisions:
- issue: Tafsiri ya jadi ya אֲרֹן הָעֵדֻת
  choice: Sanduku la Ushuhuda
  alternative: Sanduku la Agano
  rationale: Chanzo kinatumia עֵדוּת, yaani “ushuhuda,” kwa hiyo tafsiri haibadilishi neno hilo kuwa “agano,” ingawa usemi “Sanduku la Agano” umezoeleka zaidi katika mapokeo ya tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inatumia msamiati unaoeleweka kwa wasomaji wa kawaida, huku “Sanduku la Ushuhuda” likihifadhi istilahi halisi ya chanzo. Alama ya tanbihi imewekwa baada ya kirai kinachofafanuliwa.
