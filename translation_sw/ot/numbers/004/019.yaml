base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/019.yaml
  text: 'But do this for them[b][a], so that they may live and not die when they come near the most holy things: Aaron and his sons shall come and assign each man to his service and to his load.'
translation:
  language: sw
  text: 'Lakini wafanyieni hivi ili waishi wala wasife watakapovikaribia vitu vitakatifu kabisa[a]: Aroni na wanawe watakuja na watampangia kila mwanamume[b] huduma yake na mzigo wake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Patakatifu pa Patakatifu” au “mahali patakatifu kabisa.” Katika muktadha huu, huenda kirai hiki kinarejelea vitu vitakatifu zaidi kuliko sehemu ya ndani ya patakatifu, kwa sababu aya inazungumzia wajibu wa kuvibeba.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “mwanamume, mwanamume,” usemi wa ugawaji unaomaanisha kwamba kila mmoja alipangiwa huduma na mzigo wake mwenyewe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת עֲשׂוּ לָהֶם
  choice: Lakini wafanyieni hivi
  rationale: Kiunganishi na kiwakilishi vinaanzisha agizo linalotofautiana na onyo lililotangulia; kiambishi -wa- pamoja na -eni kinaonyesha tendo linalofanywa kwa ajili yao.
- source_word: וְחָיוּ וְלֹא יָמֻתוּ
  choice: ili waishi wala wasife
  rationale: Mfuatano huu unaonyesha kusudi au matokeo yaliyokusudiwa; ‘wala’ linaunganisha kwa kawaida uhai na kuepuka kifo.
- source_word: בְּגִשְׁתָּם
  choice: watakapovikaribia
  rationale: בְּ pamoja na kitenzi-jina ina maana ya wakati hapa, na ‘karibia’ inadumisha wazo la kukaribia kilicho kitakatifu.
- source_word: אֶת קֹדֶשׁ הַקֳּדָשִׁים
  choice: vitu vitakatifu kabisa
  rationale: Katika muktadha wa wajibu wa kubeba, kirai hiki kinaelekea kumaanisha vifaa vitakatifu kuliko mahali pa ndani pa hema; ‘kabisa’ huwasilisha nguvu ya hali ya juu ya muundo wa Kiebrania.
- source_word: אַהֲרֹן וּבָנָיו יָבֹאוּ
  choice: Aroni na wanawe wataingia
  rationale: Kitenzi kinaeleza kuja au kuingia kwao ili kutekeleza agizo; ‘wataingia’ ni cha kawaida katika muktadha wa kuingia mahali walipo Wakohathi na mizigo yao.
- source_word: וְשָׂמוּ אוֹתָם
  choice: na kumpangia
  rationale: Katika muundo huu, ‘kuwaweka’ watu mmoja mmoja kwenye huduma na mizigo yao humaanisha kuwapa au kuwapangia wajibu maalumu.
- source_word: אִישׁ אִישׁ
  choice: kila mwanamume
  rationale: Urudiaji ni wa ugawaji na unasisitiza kila mtu mmoja mmoja; jinsia ya kiume imehifadhiwa kwa kuwa wanaorejelewa ni Walawi wanaume.
- source_word: עַל עֲבֹדָתוֹ
  choice: huduma yake
  rationale: עֲבֹדָה hapa ni kazi rasmi ya Kilawi, hivyo ‘huduma’ inafaa kuliko neno la jumla la kazi.
- source_word: וְאֶל מַשָּׂאוֹ
  choice: na mzigo wake
  rationale: מַשָּׂא katika muktadha huu ni kitu au mzigo anaopaswa kubeba, si huzuni au taabu ya mfano.
theological_decisions:
- issue: Kirejelewa cha קֹדֶשׁ הַקֳּדָשִׁים
  choice: vitu vitakatifu kabisa
  alternative: Patakatifu pa Patakatifu; mahali patakatifu kabisa
  rationale: Muktadha wa karibu unahusu vifaa vitakatifu vilivyofunikwa na makuhani na kubebwa na Wakohathi. Tafsiri ya vitu ndiyo inayofaa zaidi hapa, huku tanbihi ikihifadhi uwezekano wa maana ya mahali.
- issue: Jinsia katika אִישׁ אִישׁ
  choice: kila mwanamume
  alternative: kila mmoja; kila mtu
  rationale: Wanaorejelewa katika mgawo huu ni Walawi wanaume, kwa hiyo tafsiri haifichi jinsia iliyo wazi katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Vitu vitakatifu kabisa’ huepuka kuchanganya vitu vya kubebwa na mahali patakatifu, na ‘kumpangia’ huwasilisha kwa kawaida tendo la kumpa kila mwanamume huduma na mzigo maalumu.
