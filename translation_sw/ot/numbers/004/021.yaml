lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akasema na
  rationale: Kitenzi hiki pamoja na waw ya usimulizi kinaendeleza mfululizo wa matukio. ‘Kisha ... akasema na’ ni Kiswahili cha kawaida kinachohifadhi wazo la kufuatana na la kumwelekezea mtu maneno.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo ‘BWANA’, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: אֶל
  choice: na
  rationale: Baada ya ‘akasema’, Kiswahili cha kawaida hutumia ‘na’ kumtaja mtu aliyeambiwa; hapa maana yake ni kwamba Musa ndiye aliyeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la jina hili lililozoeleka katika Kiswahili Sanifu.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi kwa njia ya moja kwa moja fomula ya Kiebrania inayoanzisha maneno yanayofuata, ingawa katika Kiswahili inaweza kuonekana yenye urudiaji.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni, yaani jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza mapokeo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘akasema na Musa, akisema’ umehifadhi kwa kiasi kikubwa fomula ya Kiebrania; tanbihi imewekwa baada ya ‘Musa’ kwa kufuata nafasi ya alama katika safu ya Kiingereza iliyotolewa.
