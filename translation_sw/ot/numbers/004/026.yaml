  naturalness: Kiswahili ni cha kiwango kizuri kwa ujumla. “Pazia la kwenye ingilio la lango la ua” na “vifaa vyote vya utumishi huo” husomeka kwa kawaida zaidi na huweka uhusiano wa maneno wazi.
  terminology: “Maskani,” “madhabahu,” “ua,” “mapazia,” na “kuhudumu” zinafaa kwa rejesta ya kifungu. “Kamba” ni chaguo sahihi; “kamba nyembamba” ni mbadala unaokubalika zaidi kuliko “nyuzi” katika tanbihi.
