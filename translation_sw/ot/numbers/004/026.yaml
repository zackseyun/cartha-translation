  text: וְ/אֵת֩ קַלְעֵ֨י הֶֽ/חָצֵ֜ר וְ/אֶת מָסַ֣ךְ פֶּ֣תַח שַׁ֣עַר הֶ/חָצֵ֗ר אֲשֶׁ֨ר עַל הַ/מִּשְׁכָּ֤ן וְ/עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב וְ/אֵת֙ מֵֽיתְרֵי/הֶ֔ם וְ/אֶֽת כָּל כְּלֵ֖י עֲבֹדָתָ֑/ם וְ/אֵ֨ת כָּל אֲשֶׁ֧ר יֵעָשֶׂ֛ה לָ/הֶ֖ם וְ/עָבָֽדוּ־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/026.yaml
  text: and the hangings of the court, and the screen for the entrance of the gate of the court that is around the tabernacle and around the altar, and their ropes, and all the equipment for their service, and all that is to be done with them. And they shall serve.
translation:
  language: sw
  text: na mapazia ya ua, na pazia la kwenye ingilio la lango la ua unaozunguka Maskani na madhabahu, na kamba zake[a], na vifaa vyote vya utumishi huo, na kila jambo litakalofanywa kwa kutumia vitu hivyo[b]. Nao watahudumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kamba nyembamba zake.”
    reason: lexical_alternative
  - marker: b
    text: Au “kila jambo litakalofanywa kwa ajili ya vitu hivyo.” Kiebrania kinaweza kumaanisha kazi zinazofanywa kwa kutumia vitu hivyo au zinazofanywa kwa ajili ya vitu hivyo wakati wa huduma.
    reason: alternative_reading
lexical_decisions:
- source_word: קַלְעֵי
  choice: mapazia
  rationale: Neno hili linamaanisha vitambaa vilivyotundikwa kuuzunguka ua; “mapazia” ni neno la kawaida na linalofaa katika muktadha wa Maskani.
- source_word: חָצֵר
  choice: ua
  rationale: Hapa ni eneo la nje lililozungushiwa mapazia kuizunguka Maskani; “ua” ni istilahi fupi na ya kawaida katika Kiswahili.
- source_word: מָסַךְ
  choice: pazia
  rationale: Katika muktadha wa mahali patakatifu, neno hili ni pazia la kitambaa lililofunika ingilio.
- source_word: פֶּתַח שַׁעַר
  choice: ingilio la lango
  rationale: Utoaji huu unahifadhi msisitizo wa mnyororo wa maneno ya Kiebrania huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: ua unaoizunguka Maskani na madhabahu
  rationale: Kifungu kinaeleza mpangilio wa ua kuzunguka Maskani na madhabahu; Kiswahili hiki kinaweka uhusiano huo wa mahali wazi bila kuongeza wazo lisilokuwamo.
- source_word: מֵיתְרֵיהֶם
  choice: kamba zake
  rationale: Hizi ni kamba zilizotumiwa pamoja na mapazia na pazia la ingilio; tanbihi inahifadhi uwezekano wa “nyuzi zake.”
- source_word: כְּלֵי עֲבֹדָתָם
  choice: vifaa vyote vya kazi yake
  rationale: כְּלִים ni vifaa au vyombo kwa maana pana, na עֲבֹדָה hapa ni kazi ya utumishi inayohusiana na vitu vilivyotajwa.
- source_word: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: kila jambo litakalofanywa kwa kutumia vitu hivyo
  rationale: Hii inaeleza kazi zinazofanywa kwa vitu vilivyoorodheshwa, huku tanbihi ikihifadhi uwezekano wa kuelewa לָהֶם kuwa “kwa ajili ya vitu hivyo.”
- source_word: וְעָבָדוּ
  choice: Nao watahudumu
  rationale: “Kuhudumu” huhifadhi maana ya kazi rasmi ya huduma ya Maskani kuliko “kufanya kazi” pekee.
theological_decisions:
- issue: Mhusika anayerejelewa na kiambishi katika כְּלֵי עֲבֹדָתָם na מֵיתְרֵיהֶם
  choice: Viambishi vya Kiswahili vimeelekezwa kwa mkusanyiko wa ua na vifaa vyake (“zake/yake”)
  alternative: Kutumia wingi unaoweza kudokeza kwamba kila kitu kilichoorodheshwa kina kamba na huduma yake tofauti
  rationale: Muktadha unaeleza mkusanyiko mmoja wa vifaa vya ua; uchaguzi huu ni wa kisarufi na kimuktadha, wala haulazimishi hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Maskani” imetumiwa kama istilahi ya ibada kwa המשכן, “madhabahu” kwa מזבח, na “kuhudumu” kuhifadhi uzito wa huduma rasmi ya Maskani. Muundo unaendelea kutoka mstari uliotangulia, kwa hiyo unaanza na “na” kama ilivyo katika Kiebrania.
