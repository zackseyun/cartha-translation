base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/047.yaml
  text: from thirty years old and upward[a], up to fifty years old, everyone who comes to perform the work of service and the service of carrying loads in the tent of meeting.
translation:
  language: sw
  text: kuanzia umri wa miaka thelathini na kuendelea, hadi umri wa miaka hamsini, kila anayekuja kufanya kazi ya huduma na huduma ya kubeba mizigo[a] katika hema la mkutano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kazi ya utumishi na huduma ya kubeba mizigo.” Kiebrania kinarudia maumbo ya nomino ileile ili kusisitiza au kuainisha aina za kazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: kuanzia umri wa miaka thelathini na kuendelea
  rationale: Huweka wazi kikomo cha chini cha umri na kuwasilisha nahau ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: hadi umri wa miaka hamsini
  rationale: Huwasilisha kwa ufupi kikomo cha juu cha umri.
- source_word: כָּל הַבָּא
  choice: kila anayekuja
  rationale: Huhifadhi maana ya kitenzi kishirikishi cha Kiebrania badala ya kuongeza wazo la kustahili au kuteuliwa.
- source_word: לַעֲבֹד
  choice: kufanya
  rationale: Hutaja kusudi la kuja na kubaki tofauti na nomino za kazi na huduma zinazofuata.
- source_word: עֲבֹדַת עֲבֹדָה
  choice: kazi ya huduma
  rationale: Huhifadhi vipengele vya kazi na huduma katika muundo unaoeleweka kwa Kiswahili bila kurudia maneno kwa namna isiyo ya kawaida.
- source_word: וַעֲבֹדַת מַשָּׂא
  choice: na huduma ya kubeba mizigo
  rationale: מַשָּׂא ni mzigo au kitu kinachobebwa; usemi huu unaonyesha kazi halisi ya usafirishaji bila kuifanya kuwa dhana ya jumla tu.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika hema la mkutano
  rationale: Ni tafsiri sanifu ya jina hili la hema takatifu na inafuata kihusishi cha Kiebrania.
