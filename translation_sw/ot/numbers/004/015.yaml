  to: Baada ya Haruni na wanawe kumaliza kufunika vitu vitakatifu na vyombo vyote vitakatifu, wakati kambi inapoondoka, ndipo wana wa Kohathi[a] watakapokuja kuvibeba. Lakini wasiviguse vitu vitakatifu[b], wasije wakafa[c]. Hivi ndivyo vitu vya kubebwa na wana wa Kohathi katika Hema la Kukutania.
