id: NUM.4.15
reference: Numbers 4:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כִלָּ֣ה אַֽהֲרֹן וּ֠/בָנָי/ו לְ/כַסֹּ֨ת אֶת הַ/קֹּ֜דֶשׁ וְ/אֶת כָּל כְּלֵ֣י הַ/קֹּדֶשׁ֮ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶה֒ וְ/אַחֲרֵי כֵ֗ן יָבֹ֤אוּ בְנֵי קְהָת֙ לָ/שֵׂ֔את וְ/לֹֽא יִגְּע֥וּ אֶל הַ/קֹּ֖דֶשׁ וָ/מֵ֑תוּ אֵ֛לֶּה מַשָּׂ֥א בְנֵֽי קְהָ֖ת בְּ/אֹ֥הֶל מוֹעֵֽד־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/015.yaml
  text: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary[a], when the camp sets out, after that the sons of Kohath shall come to carry them; but they shall not touch the holy things, lest they die[c][b]. These are the burden of the sons of Kohath in the tent of meeting.
translation:
  language: sw
  text: Baada ya Haruni na wanawe kumaliza kufunika vitu vitakatifu na vyombo vyote vitakatifu, wakati kambi inapoondoka, ndipo wana wa Kohathi[a] watakapokuja kuvibeba. Lakini wasiviguse vitu vitakatifu[b], wasije wakafa[c]. Hivi ndivyo vitu vya kubebwa na wana wa Kohathi katika Hema la Kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakohathi.” Kwa neno halisi, “wana wa Kohathi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mahali patakatifu.” Neno la Kiebrania linaweza kueleweka kuwa vitu vitakatifu kwa pamoja au, kwa upana zaidi, mahali patakatifu.
    reason: alternative_reading
  - marker: c
    text: Au, “na watakufa.” Kiebrania kinataja matokeo moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה ... לְכַסֹּת
  choice: kumaliza kufunika
  rationale: Muundo huu unaonyesha kukamilika kwa tendo la kufunika; Kiswahili hiki ni cha kawaida na huhifadhi maana hiyo.
- source_word: הַקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Katika tukio la kwanza, neno hili linaelekea kutaja patakatifu kama eneo la ibada, huku muktadha ukihusu pia vitu vyake vitakatifu.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: vyombo vyote vya mahali patakatifu
  rationale: כְּלֵי ni vyombo, vifaa, au vitu vinavyotumika; “vyombo” ni neno la kawaida katika muktadha huu na uhusiano wa umilikaji umewekwa wazi.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: wakati kambi inapoondoka
  rationale: Infinitivu hii ni ya wakati na inaonyesha kuanza kwa safari ya kambi.
- source_word: וְאַחֲרֵי כֵן
  choice: ndipo ... watakapokuja
  rationale: Muundo wa “ndipo” unaonyesha wazi mpangilio wa hatua baada ya kufunikwa kwa vitu.
- source_word: בְנֵי קְהָת
  choice: wana wa Kohathi
  rationale: Huhifadhi usemi halisi wa ukoo katika Kiebrania; tanbihi inatoa jina la kikabila linalowezekana.
- source_word: לָשֵׂאת
  choice: kuvibeba
  rationale: Kiambishi “vi-” kinarejelea vyombo na vitu vilivyofunikwa ambavyo walipaswa kusafirisha.
- source_word: וְלֹא יִגְּעוּ אֶל הַקֹּדֶשׁ
  choice: Lakini wasiviguse vitu vitakatifu
  rationale: Katika onyo hili, הַקֹּדֶשׁ inaeleweka kwa kawaida kuwa vitu vitakatifu vilivyotajwa katika muktadha wa usafirishaji; wingi unaifanya maana hiyo iwe ya kawaida katika Kiswahili.
- source_word: וָמֵתוּ
  choice: wasije wakafa
  rationale: Huwasilisha kwa kawaida nguvu ya onyo na matokeo ya kugusa vitu hivyo; tanbihi huhifadhi namna ya moja kwa moja zaidi ya Kiebrania.
- source_word: אֵלֶּה מַשָּׂא בְנֵי קְהָת
  choice: Huo ndio mzigo wa wana wa Kohathi
  rationale: מַשָּׂא ni mzigo au jukumu la kubeba. “Mzigo” huhifadhi maana halisi ya kitu cha kusafirishwa pamoja na wajibu wao.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika Hema la Kukutania
  rationale: Huhifadhi maana ya kawaida ya kihusishi בְּ na jina linaloeleweka la hema hilo katika Kiswahili.
theological_decisions:
- issue: Kitu kinachorejelewa na הַקֹּדֶשׁ katika katazo
  choice: vitu vitakatifu
  alternative: mahali patakatifu
  rationale: Muktadha wa karibu unahusu vyombo vilivyofunikwa ambavyo wana wa Kohathi watabeba. Hata hivyo, neno la Kiebrania linaweza kueleweka kwa upana zaidi, hivyo uwezekano wa “mahali patakatifu” umehifadhiwa katika tanbihi.
- issue: Namna ya kueleza matokeo katika וָמֵתוּ
  choice: wasije wakafa
  alternative: na watakufa
  rationale: Chaguo kuu linaonyesha nguvu ya onyo kwa Kiswahili cha kawaida bila kuficha kwamba Kiebrania hutaja matokeo moja kwa moja; tafsiri hiyo ya moja kwa moja imetolewa katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imepangwa kwa mtiririko wa hatua: kufunika, kuondoka kwa kambi, kuja kubeba, na onyo. Majina “Haruni,” “Kohathi,” na “Hema la Kukutania” yametumiwa kwa mtindo unaofahamika kwa wasomaji wa Biblia ya Kiswahili.'
