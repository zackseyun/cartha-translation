  text: וְ/נָ֨שְׂא֜וּ אֶת יְרִיעֹ֤ת הַ/מִּשְׁכָּן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד מִכְסֵ֕/הוּ וּ/מִכְסֵ֛ה הַ/תַּ֥חַשׁ אֲשֶׁר עָלָ֖י/ו מִ/לְ/מָ֑עְלָ/ה וְ/אֶ֨ת מָסַ֔ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/025.yaml
  text: They shall carry the curtains of the tabernacle[a], and the tent of meeting with its covering, and the covering of fine leather that is over it above, and the screen for the entrance of the tent of meeting,
translation:
  language: sw
  text: Watabeba mapazia ya Maskani, na Hema la Kukutania pamoja na kifuniko chake, na kifuniko cha tahashi[a] kilicho juu yake, na pazia la ingilio la Hema la Kukutania,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania תַּחַשׁ (tahashi) linaweza kumaanisha mnyama, ngozi, au nyenzo isiyojulikana kwa uhakika; kwa hiyo tafsiri mbalimbali huliacha kama “tahashi” au hulitafsiri kwa namna tofauti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: Watabeba
  rationale: Katika muktadha wa kusafirisha vifaa vya mahali patakatifu, kitenzi נשׂא humaanisha kubeba; ‘watabeba’ ni Kiswahili cha kawaida na sahihi.
- source_word: יְרִיעֹת הַמִּשְׁכָּן
  choice: mapazia ya Maskani
  rationale: יְרִיעֹת ni vipande vikubwa vya kitambaa vinavyoning’inizwa, na מִשְׁכָּן ni makao matakatifu yanayohamishika; ‘Maskani’ huhifadhi istilahi ya ibada kwa lugha inayoeleweka.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Tafsiri hii huhifadhi maana ya muundo halisi, ‘hema,’ pamoja na kazi yake kama mahali pa kukutana.
- source_word: מִכְסֵהוּ
  choice: kifuniko chake
  rationale: Kiambishi cha umilikaji kinarejelea Hema la Kukutania; tafsiri haiongezi maelezo yasiyokuwapo katika Kiebrania.
- source_word: מִכְסֵה הַתַּחַשׁ
  choice: kifuniko cha ngozi ya tahashi
  rationale: Utambulisho wa תַּחַשׁ hauna uhakika. Kutumia ‘tahashi’ na tanbihi huhifadhi kutokuwa na uhakika badala ya kudai mnyama au aina mahsusi ya ngozi.
- source_word: אֲשֶׁר עָלָיו מִלְמָעְלָה
  choice: kilicho juu yake kabisa
  rationale: Usemi huu unaonyesha kwamba kifuniko hicho kilikuwa juu ya hema, katika tabaka la juu kabisa; Kiswahili hiki ni cha asili na huhifadhi msisitizo wa nafasi.
- source_word: מָסַךְ פֶּתַח
  choice: pazia la mlango
  rationale: מָסָךְ ni kitambaa cha kuning’inizwa kinachofunika sehemu ya kuingilia; ‘pazia la mlango’ ni wazi na la kawaida katika Kiswahili.
