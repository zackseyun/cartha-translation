  language: sw
  text: Msiukate mbali ukoo wa familia za Wakohathi kutoka miongoni mwa Walawi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Msiuangamize ukoo wa familia za Wakohathi kutoka miongoni mwa Walawi.” Kitenzi cha Kiebrania kinaweza kumaanisha “kukata mbali” au “kuangamiza,” na “familia” pia inaweza kutafsiriwa “koo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Msi-
  rationale: Kiambishi cha kukataza katika nafsi ya pili wingi kinaonyesha agizo la moja kwa moja kwa Musa na Aroni.
- source_word: תַּכְרִיתוּ
  choice: msiukatishe mbali
  rationale: Kauli hii inadumisha taswira ya Kiebrania ya kusababisha kundi likatiliwe mbali, bila kuamua kimya kimya kwamba maana pekee ni kuliangamiza; mbadala huo umewekwa katika tanbihi.
- source_word: שֵׁבֶט
  choice: ukoo
  rationale: Katika muktadha huu neno hilo linataja kitengo cha nasaba ndani ya Walawi. “Ukoo” ni la kawaida na linaepuka kudokeza kimakosa kwamba Wakohathi ni kabila tofauti na Walawi.
- source_word: מִשְׁפְּחֹת
  choice: jamaa
  rationale: Wingi huu unataja makundi ya kifamilia yanayounda ukoo wa Wakohathi; “koo” pia inawezekana.
- source_word: הַקְּהָתִי
  choice: Wakohathi
  rationale: Ingawa umbo la Kiebrania ni kivumishi cha umoja chenye maana ya kijumla, Kiswahili hutumia jina la wingi kwa watu wa ukoo huo.
- source_word: מִתּוֹךְ
  choice: kutoka miongoni mwa
  rationale: Inaonyesha kuondolewa kutoka ndani ya kundi kubwa zaidi.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la Walawi, ambalo Wakohathi walikuwa sehemu yake.
theological_decisions:
- issue: Nguvu na matokeo ya katazo kuhusu Wakohathi
  choice: Katazo la kutosababisha ukoo wa Wakohathi ukatishwe mbali kutoka miongoni mwa Walawi
  alternative: Katazo la kuangamiza ukoo wa Wakohathi
  rationale: Mstari huu hautaji moja kwa moja jinsi jambo hilo lingetokea, ingawa muktadha unaonyesha hatari ya kifo kutokana na kushughulikia vitu vitakatifu isivyofaa. Tafsiri kuu inadumisha upana na mvutano wa usemi wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa na wenye heshima. Usemi “kukata mbali” umehifadhiwa kwa sababu ya taswira na upana wa kitenzi cha Kiebrania; tanbihi inaeleza maana mbadala iliyo wazi zaidi.
