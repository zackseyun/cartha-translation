  source_fidelity: 'Tafsiri inafuata kwa ujumla mfuatano na maana ya Kiebrania: vyombo vya huduma, matumizi yake mahali patakatifu, kitambaa cha buluu, kifuniko cha ngozi ya taḥash, na kifaa cha kubebea. Hata hivyo, kiambishi cha urejeshi katika "wanavyotumia" kinahitaji kufafanua wazi kwamba vyombo ndivyo vinavyotumiwa, na "mti wa kubebea" si usemi wa kawaida au sahihi zaidi kwa מוט katika muktadha huu.'
