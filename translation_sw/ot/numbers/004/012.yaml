base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/012.yaml
  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
translation:
  language: sw
  text: Kisha watachukua vyombo vyote vya huduma wanavyovitumia kuhudumu katika mahali patakatifu, na kuviweka katika kitambaa cha buluu, na kuvifunika kwa kifuniko cha ngozi bora[a], kisha kuviweka juu ya fito ya kubebea[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania תָּחַשׁ (taḥash) maana yake haijulikani kwa hakika; huenda likarejelea ngozi ya mnyama fulani au aina ya ngozi bora au imara.
    reason: lexical_alternative
  - marker: b
    text: Au, “juu ya fremu ya kubebea.” Kiebrania kinatumia neno la umoja linalomaanisha fito au nguzo, lakini huenda likawakilisha kifaa kizima cha kubebea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Kisha watachukua
  rationale: Kitenzi hiki kinaendeleza mfululizo wa maagizo ya utaratibu; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: כָּל כְּלֵי הַשָּׁרֵת
  choice: vyombo vyote vya huduma
  rationale: כְּלִי humaanisha vyombo au vifaa, na hapa ni vitu vinavyotumiwa katika huduma ya hema takatifu.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: wanavyotumia kuhudumu
  rationale: שרת katika muktadha huu ni kutekeleza huduma takatifu; tafsiri hii pia huonyesha kuwa vyombo hivyo ndivyo vinavyotumiwa katika huduma hiyo.
- source_word: בַּקֹּדֶשׁ
  choice: katika mahali patakatifu
  rationale: Neno hili kihalisi hurejelea mahali au eneo takatifu; hapa si lazima limaanishe chumba cha ndani pekee.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: kitambaa cha buluu
  rationale: Katika muktadha wa kufungasha, בֶּגֶד ni kitambaa, na תְּכֵלֶת ni rangi ya buluu au buluu yenye mwelekeo wa zambarau.
- source_word: מִכְסֵה עוֹר תָּחַשׁ
  choice: kifuniko cha ngozi bora
  rationale: Utambulisho kamili wa תָּחַשׁ haujulikani. “Ngozi bora” hutoa maana ya kifuniko cha ngozi kinachofaa kulinda vifaa bila kudai kwa hakika mnyama fulani; kutokuwa na uhakika kunaelezwa katika tanbihi.
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: na kuviweka juu ya mti wa kubebea
  rationale: מוֹט ni mti au nguzo ya kubebea. Tafsiri inahifadhi umoja wa neno la Kiebrania na kueleza kazi yake kwa Kiswahili cha kawaida.
