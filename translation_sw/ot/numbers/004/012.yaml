- from: Kisha watachukua vyombo vyote vya huduma wanavyotumia kuhudumu katika mahali patakatifu, watavitia katika kitambaa cha buluu, watavifunika kwa kifuniko cha ngozi bora[a], na kuviweka juu ya mti wa kubebea[b].
  to: Kisha watachukua vyombo vyote vya huduma wanavyovitumia kuhudumu katika mahali patakatifu, na kuviweka katika kitambaa cha buluu, na kuvifunika kwa kifuniko cha ngozi bora[a], kisha kuviweka juu ya fito ya kubebea[b].
  rationale: Marekebisho yanaweka wazi kuwa vyombo ndivyo vinavyotumiwa katika huduma na kubadilisha "mti" kuwa "fito," ambayo ni ya kawaida zaidi kwa pole/bar ya kubebea. Tanbihi za utata wa תָּחַשׁ na wa umoja wa מוט zimehifadhiwa.
