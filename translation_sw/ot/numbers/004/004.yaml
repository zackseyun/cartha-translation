  text: This is the service of the sons of Kohath in the tent of meeting concerning the most holy things[a].
translation:
  language: sw
  text: Hii ndiyo huduma ya wana wa Kohathi katika hema la kukutania kuhusu vitu vitakatifu sana[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Patakatifu pa Patakatifu” au “mahali patakatifu zaidi.” Hapa inaelekea usemi huu unarejelea vitu vitakatifu zaidi, si chumba cha ndani pekee.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת
  choice: Hii ndiyo
  rationale: Kiwakilishi cha kuonyesha cha kike katika Kiebrania kinaanzisha kishazi; Kiswahili hutumia muundo wa kawaida “Hii ndiyo” kwa kurejelea “huduma” na kuweka kiunganishi kilichodokezwa.
- source_word: עֲבֹדַת
  choice: huduma
  rationale: Neno hili hapa linamaanisha kazi rasmi waliyopewa katika utumishi wa mahali patakatifu; “huduma” linaonyesha wajibu huo wa kidini bila kuufanya usikike kama kazi ya kawaida tu.
- source_word: בְּנֵי קְהָת
  choice: wana wa Kohathi
  rationale: Tafsiri hii inadumisha usemi wa ukoo wa Kiebrania na inaeleweka kwa urahisi katika Kiswahili.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika hema la kukutania
  rationale: Hili ni jina la mahali pa kukutana lililowekwa wakfu; kihusishi ב kinaonyesha eneo au mazingira ambamo huduma yao ilifanywa.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: vitu vitakatifu sana
  rationale: Katika muktadha wa Hesabu 4, usemi huu unaelekea kurejelea vyombo na vitu vitakatifu zaidi vilivyokuwa chini ya uangalizi wa wana wa Kohathi, huku uwezekano wa maana ya mahali patakatifu zaidi ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Kirejelewa cha קֹדֶשׁ הַקֳּדָשִׁים
  choice: Vitu vitakatifu zaidi walivyokabidhiwa wana wa Kohathi
  alternative: Patakatifu pa Patakatifu, yaani mahali patakatifu zaidi
  rationale: Muktadha mpana wa Hesabu 4 unahusu kubeba na kushughulikia samani na vyombo vya hema. Kwa hiyo maana ya vitu vitakatifu zaidi inafaa zaidi hapa, lakini utata halisi wa usemi wa Kiebrania hauondolewi na umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hema la kukutania” ni usemi wazi na wa kawaida wa kibiblia; “kuhusu” huunganisha kwa asili huduma hiyo na vitu vitakatifu sana bila kuvifanya kuwa kielezi appositive cha hema.
