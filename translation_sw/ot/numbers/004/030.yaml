base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/030.yaml
  text: From thirty years old and upward[a], up to fifty years old[b], you shall count them—everyone who enters the service to do the work of the tent of meeting.
translation:
  language: sw
  text: Utawahesabu wote wenye umri wa miaka thelathini na kuendelea hadi miaka hamsini, kila anayeingia[a] katika huduma[b] kufanya kazi ya Hema la Kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila anayekuja kwa ajili ya wajibu.”
    reason: lexical_alternative
  - marker: b
    text: Neno lililotafsiriwa “huduma” linaweza pia kumaanisha jeshi au kundi lililopangwa; hapa linahusu wajibu rasmi wa Walawi.
    reason: cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: wenye umri wa miaka thelathini na kuendelea hadi miaka hamsini
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida na kwa uwazi kipindi cha umri kinachoanzia miaka thelathini na kuishia miaka hamsini, bila kubakiza nahau ya Kiebrania ‘mwana wa miaka…’ kwa namna isiyo ya kawaida.
- source_word: תִּפְקְדֵם
  choice: utawahesabu
  rationale: Katika muktadha huu wa sensa, kitenzi kinamaanisha kuwahesabu au kuwaandikisha watu wanaostahili huduma. ‘Utawahesabu’ ni wazi na hakiongezi taswira ya kijeshi isiyohitajika.
- source_word: כָּל הַבָּא
  choice: kila anayeingia
  rationale: Kirai hiki kinaeleza kila mtu mmoja mmoja anayekuja au kuingia katika jukumu lililopangwa. ‘Kila anayeingia’ ni Kiswahili cha kawaida na huhifadhi maana ya mgawanyo wa mtu mmoja mmoja.
- source_word: לַצָּבָא
  choice: katika huduma
  rationale: Ingawa neno hili linaweza kutaja jeshi au kundi lililopangwa, hapa linahusu wajibu rasmi wa Walawi katika hema la kukutania. ‘Huduma’ linaonyesha kazi iliyopangwa bila kudokeza mapigano.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: kufanya kazi
  rationale: Tafsiri hii inaepuka marudio yasiyo ya kawaida kama ‘kutumikia huduma’ huku ikihifadhi wazo la kutekeleza kazi waliyopewa.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni jina linaloeleweka katika Kiswahili kwa hema la mahali pa kukutana lililotengwa kwa ibada na uwepo wa Mungu.
theological_decisions:
- issue: Dokezo linalowezekana la kijeshi katika לַצָּבָא
  choice: huduma
  alternative: jeshi, kundi lililopangwa, au wajibu
  rationale: Muktadha unazungumzia kazi iliyopangwa ya Walawi katika hema la kukutania, si mapigano. ‘Huduma’ huhifadhi hali rasmi na iliyopangwa ya wajibu huo bila kuingiza maana ya kijeshi kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imepangwa kwa mtiririko wa asili wa Kiswahili huku mipaka ya umri, tendo la kuhesabu, na huduma rasmi ya Walawi vikihifadhiwa.
