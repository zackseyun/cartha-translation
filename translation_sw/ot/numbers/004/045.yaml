base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/045.yaml
  text: These are the counted men of the families of the sons of Merari[a], whom Moses and Aaron counted according to the mouth of Yahweh[b], by the hand of Moses.
translation:
  language: sw
  text: Hawa ndio waliohesabiwa miongoni mwa jamaa za wana wa Merari, ambao Musa na Aroni waliwahesabu kwa amri ya Yahwe[a], kupitia Musa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maneno halisi ya Kiebrania: “kwa kinywa cha Yahwe,” yaani, “kwa amri ya Yahwe.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kwa maneno halisi ya Kiebrania: “kwa mkono wa Musa,” yaani, “kupitia Musa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Hawa ndio waliohesabiwa
  rationale: Muundo huu unawasilisha kundi lililohesabiwa katika sensa kwa Kiswahili cha kawaida, huku ukihifadhi nguvu ya utambulisho ya אֵלֶּה.
- source_word: מִשְׁפְּחֹת
  choice: jamaa
  rationale: Katika muktadha wa mpangilio wa kikabila, neno hili linamaanisha vikundi vya ukoo au familia; “jamaa” ni la asili na pana vya kutosha hapa.
- source_word: בְּנֵי מְרָרִי
  choice: wana wa Merari
  rationale: Tafsiri hii inahifadhi wazi usemi wa Kiebrania wa undugu badala ya kuubadili kuwa jina la kundi pekee.
- source_word: פָּקַד
  choice: waliwahesabu
  rationale: Kitenzi kinarejelea kuhesabu na kuandikisha watu katika sensa; “waliwahesabu” ni wazi na kinaoanisha na “waliohesabiwa.”
- source_word: עַל פִּי יְהוָה
  choice: kwa amri ya Yahwe
  rationale: Nahau hiyo, ambayo kwa neno moja moja ni “kwa kinywa cha Yahwe,” ina maana ya kutenda kwa amri yake. Tafsiri ya maana ni ya kawaida zaidi kwa Kiswahili, na taswira halisi imehifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadili kuwa cheo.
- source_word: בְּיַד מֹשֶׁה
  choice: kupitia Musa
  rationale: Nahau ya Kiebrania “kwa mkono wa Musa” huonyesha njia au wakala; “kupitia Musa” hutoa maana hiyo kwa Kiswahili cha asili, huku usemi halisi ukiwekwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina na ni umbo linaloeleweka katika Kiswahili, bila kulibadili kuwa cheo.
- issue: Uhusiano kati ya amri ya Yahwe na Musa kama njia ya kuitoa
  choice: kwa amri ya Yahwe, kupitia Musa
  alternative: kwa kinywa cha Yahwe, kwa mkono wa Musa
  rationale: 'Tafsiri hii haiondoi tofauti iliyomo katika vifungu viwili: mamlaka ya amri ni ya Yahwe, na Musa ndiye njia ambayo amri hiyo ilitolewa. Tanbihi zinahifadhi taswira ya Kiebrania.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imetumia nahau za kawaida katika maandishi makuu na kuhifadhi taswira halisi za Kiebrania katika tanbihi. Kurudiwa kwa Musa hakufutwi, kwa kuwa Musa anatajwa kwanza pamoja na Aroni kama aliyehesabu, kisha kama njia ya amri ya Yahwe.
