base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/046.yaml
  text: All those counted[a], whom Moses and Aaron and the leaders of Israel counted among the Levites[b], by their clans and by their fathers' houses—
translation:
  language: sw
  text: Wote waliohesabiwa[a], ambao Musa, Aroni, na viongozi wa Israeli waliwahesabu Walawi, kulingana na koo zao na nyumba za baba zao[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walioorodheshwa” au “waliosajiliwa.” Kiebrania kinatumia lugha ya sensa kutoka katika kitenzi פקד.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba za baba” ni kaya za ukoo au migawanyo ya kifamilia ndani ya koo.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Wote waliohesabiwa
  rationale: Huwasilisha ujumla wa kundi na lugha ya sensa kwa Kiswahili cha kawaida bila kuongeza neno ‘wanaume,’ ambalo halipo wazi katika mstari huu.
- source_word: אֲשֶׁר פָּקַד
  choice: ambao ... waliwahesabu
  rationale: Kishazi rejeshi na kitenzi cha sensa vinatafsiriwa kwa muundo wa asili wa Kiswahili; upatanisho wa ‘waliwahesabu’ unaonyesha kuwa Walawi ndio waliohesabiwa.
- source_word: וּנְשִׂיאֵי יִשְׂרָאֵל
  choice: na viongozi wa Israeli
  rationale: נְשִׂיאִים ni wakuu au viongozi wa makabila; ‘viongozi’ ni neno wazi la kisasa lisiloleta dhana isiyofaa ya wana wa kifalme.
- source_word: אֶת הַלְוִיִּם
  choice: miongoni mwa Walawi
  rationale: Walawi ndio kundi lililohesabiwa. ‘Miongoni mwa’ huleta kwa Kiswahili uhusiano unaoonekana katika muundo wa sentensi bila kubadili rejeo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: מִשְׁפָּחָה hapa ni kitengo cha ukoo katika mpangilio wa sensa; ‘koo’ ni sahihi na ya kawaida kuliko ‘familia’ kwa kiwango hiki cha kijamii.
- source_word: וּלְבֵית אֲבֹתָם
  choice: na nyumba za baba zao
  rationale: Tafsiri hii huhifadhi taswira na muundo wa istilahi ya ukoo בית אבות; tanbihi inaeleza maana yake ya kitamaduni.
