translation:
  language: sw
  text: Kisha wataondoa majivu kwenye madhabahu, na watatandaza juu yake kitambaa cha rangi ya zambarau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wataisafisha madhabahu” / “wataondoa majivu ya dhabihu madhabahuni.” Kitenzi cha Kiebrania kinarejelea hasa kuondoa majivu ya madhabahu katika muktadha wa dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשְּׁנוּ
  choice: wataondoa majivu
  rationale: Katika muktadha huu wa dhabihu, kitenzi דשׁן katika Piel kinamaanisha kuondoa mabaki ya majivu yenye mafuta madhabahuni, si kusafisha kwa maana ya jumla. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa מִזְבֵּחַ katika mazingira ya dhabihu ya hema la kukutania.
- source_word: וּפָרְשׂוּ
  choice: na kutandaza
  rationale: פרשׂ humaanisha kunyoosha au kutandaza kitu; “kutandaza” linafaa kwa kuweka kitambaa juu ya madhabahu.
- source_word: עָלָיו
  choice: juu yake
  rationale: עַל pamoja na kiambishi cha nafsi huonyesha kwamba kitambaa kinawekwa juu ya madhabahu ili kuifunika.
- source_word: בֶּגֶד
  choice: kitambaa
  rationale: Ingawa בגד mara nyingi humaanisha vazi, hapa ni nguo inayotumiwa kufunika kifaa kitakatifu; “kitambaa” kinaeleza kazi hiyo kwa kawaida.
- source_word: אַרְגָּמָן
  choice: cha rangi ya zambarau
  rationale: אַרְגָּמָן hurejelea kitu kilichotiwa rangi ya zambarau. Tafsiri hii inaonyesha rangi bila kudai kwa uhakika aina maalumu ya nyuzi au kitambaa.
