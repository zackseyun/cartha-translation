  text: They shall spread over them a cloth of scarlet yarn, and cover it with a covering of tahash skin, and put its poles in place.
translation:
  language: sw
  text: Watatandaza juu ya vitu hivyo kitambaa chekundu, na wataifunika kwa kifuniko cha ngozi ya tahashi[a], na wataweka mipiko yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: tahashi; utambulisho wa mnyama au malighafi unaokusudiwa haujulikani kwa hakika. Tafsiri za jadi zinatia ndani ngozi ya badgeri, ngozi ya pomboo, au ngozi bora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרְשׂוּ
  choice: Watatandaza
  rationale: Kitenzi hiki kinaeleza tendo la kutandaza kifuniko juu ya vitu vitakatifu; “kutandaza” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: עֲלֵיהֶם
  choice: juu ya vitu hivyo
  rationale: Kiwakilishi cha wingi kinarejelea vyombo vilivyotajwa katika mstari uliotangulia. Kutaja “vitu hivyo” kunahifadhi wingi na kufanya rejeleo lieleweke kwa Kiswahili.
- source_word: בֶּגֶד תּוֹלַעַת שָׁנִי
  choice: kitambaa chekundu
  rationale: בגד hapa ni kitambaa cha kufunikia, si vazi la kuvaliwa. תולעת שני huonyesha rangi nyekundu angavu inayojulikana kama scarlet; tafsiri hii haiongezi “uzi,” ambao haujatajwa wazi katika mstari huu.
- source_word: וְכִסּוּ אֹתוֹ
  choice: kisha wataifunika
  rationale: Kiambishi cha umoja katika Kiebrania kinahifadhiwa kwa “-i-,” kikirejelea meza kama kitu kimoja baada ya kutajwa kwa vitu vya wingi vilivyokuwa juu yake.
- source_word: בְּמִכְסֵה
  choice: kwa kifuniko
  rationale: Nomino hii inaonyesha tabaka la nje la kufunikia; “kifuniko” ni neno la kawaida, wazi, na lenye ulinganifu mzuri na chanzo.
- source_word: עוֹר תָּחַשׁ
  choice: ngozi ya tahashi
  rationale: Utambulisho kamili wa תחשׁ haujulikani. Uhawilishaji “tahashi” huepuka kutaja kwa uhakika mnyama au ngozi ambayo chanzo hakiiainishi wazi.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: na kuweka mipiko yake mahali pake
  rationale: בדים ni mipiko ya kubebea samani takatifu. “Kuweka ... mahali pake” huonyesha kwa Kiswahili tendo la kuitayarisha kwa usafirishaji bila kubadili maana ya msingi.
