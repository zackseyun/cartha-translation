  yaml_path: translation/ot/numbers/004/011.yaml
  text: And over the golden altar they shall spread a blue cloth[a], and cover it with a covering of fine leather, and put its poles in place.
translation:
  language: sw
  text: Juu ya madhabahu ya dhahabu watatandika kitambaa cha buluu, wataifunika kwa kifuniko cha ngozi ya takashi[a], na wataweka miti yake ya kubebea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania takashi linamaanisha mnyama gani haijulikani kwa uhakika. Tafsiri zilizopendekezwa zinatia ndani ngozi bora, ngozi ya dugong (nguva), na majina mengine ya ngozi ngumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: madhabahu ya dhahabu
  rationale: Muundo huu unamaanisha madhabahu iliyofunikwa au kutengenezwa kwa dhahabu. ‘Madhabahu ya dhahabu’ ni wa kawaida na uko karibu na muundo wa Kiebrania.
- source_word: יִפְרְשׂוּ
  choice: watatandika
  rationale: Kitenzi hiki humaanisha kutandaza kitu. ‘Watatandika’ linaeleza kwa kawaida kitendo cha kuweka kitambaa juu ya madhabahu.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: kitambaa cha buluu
  rationale: בֶּגֶד hapa ni kitambaa, na תְּכֵלֶת ni rangi ya buluu au buluu yenye kuelekea zambarau. ‘Buluu’ ni wazi bila kudai kujua kwa usahihi kivuli cha rangi ya kale.
- source_word: וְכִסּוּ אֹתוֹ
  choice: wataifunika
  rationale: Kiwakilishi kinarejelea madhabahu, na umbo la kitenzi linaendeleza mfululizo wa maagizo.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: kwa kifuniko cha ngozi bora[a]
  rationale: מִכְסֵה ni kifuniko na עוֹר ni ngozi. Mnyama anayeitwa תָּחַשׁ hajulikani kwa uhakika; ‘ngozi bora’ hutoa maana inayosomeka bila kumtaja mnyama fulani kwa uhakika wa uongo, huku tanbihi ikihifadhi utata huo.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: kisha wataweka mahali pake miti yake ya kubebea
  rationale: בַּדִּים ni miti ya kupitishwa kwenye pete za samani za hema ili kuzibeba. Tafsiri hii inaweka wazi kazi yake na inadokeza kwamba miti hiyo itawekwa katika nafasi yake.
