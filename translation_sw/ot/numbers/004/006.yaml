base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/006.yaml
  text: They shall put over it a covering of fine leather[a], and spread over that a cloth wholly of blue, and they shall put its poles in place.
translation:
  language: sw
  text: Nao wataweka juu yake kifuniko cha ngozi ya tahashi[a], kisha watatandaza juu ya kifuniko hicho kitambaa chote cha buluu, nao watatia mipiko yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania תַּחַשׁ (tahash) maana yake haijulikani kwa hakika; huenda linataja ngozi ya mnyama fulani. Kijadi limetafsiriwa kwa namna mbalimbali, kama vile ngozi ya mbuzi, pomboo, au nguva.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: Nao wataweka juu yake
  rationale: Muundo huu wa maagizo una nguvu ya wakati ujao; ‘wataweka juu yake’ ni wa kawaida na unaonyesha kuwa kifuniko kinawekwa juu ya sanduku.
- source_word: כְּסוּי
  choice: kifuniko
  rationale: Nomino hii humaanisha kitu kinachotumika kufunika; ‘kifuniko’ ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: עוֹר תַּחַשׁ
  choice: ngozi bora
  rationale: Utambulisho wa mnyama anayeitwa תַּחַשׁ hauna uhakika. ‘Ngozi bora’ huepuka dai la kizoolojia lisilo na uhakika huku ikitoa maana ya ngozi iliyotayarishwa kwa matumizi kama kifuniko; kutokuwa na uhakika kunaelezwa katika tanbihi.
- source_word: וּפָרְשׂוּ
  choice: kisha watatandaza
  rationale: Kitenzi kinamaanisha kutandaza kitu kama kitambaa. ‘Kisha’ huonyesha kwa kawaida hatua inayofuata bila kubadili mlolongo wa maagizo.
- source_word: בֶגֶד
  choice: kitambaa
  rationale: Ingawa neno hili pia laweza kumaanisha vazi, hapa ni kitu kinachotandazwa kama tabaka la kufunika, hivyo ‘kitambaa’ linafaa zaidi.
- source_word: כְּלִיל תְּכֵלֶת
  choice: chote cha buluu
  rationale: כְּלִיל husisitiza ukamilifu, na תְּכֵלֶת hutaja rangi ya buluu au buluu-zambarau iliyotumiwa katika vifaa vya maskani. ‘Chote cha buluu’ ni wazi na huhifadhi msisitizo.
- source_word: מִלְמָעְלָה
  choice: juu yake
  rationale: Katika mlolongo huu wa matabaka, neno linaonyesha kwamba kitambaa kinawekwa upande wa juu wa kifuniko cha ngozi.
- source_word: וְשָׂמוּ בַּדָּיו
  choice: nao wataweka mahali pake mipiko yake
  rationale: בַּדָּיו ni mipiko ya kubebea sanduku. ‘Wataweka mahali pake’ huwasilisha kwa Kiswahili cha kawaida tendo la kuiweka mipiko katika nafasi yake.
