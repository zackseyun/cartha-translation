  source_fidelity: 'Tafsiri inafuata vizuri muundo na maudhui ya Kiebrania: kitambaa cha buluu hutandazwa juu ya meza, vyombo vinawekwa juu yake, na mkate hubaki juu yake. Hata hivyo, “mkate wa kudumu” unaweza katika Kiswahili kumaanisha mkate unaodumu/usiokauka, badala ya mkate unaowekwa daima. “Mkate wa daima” huhifadhi vyema תָּמִיד. Kwa קְשׂוֹת הַנָּסֶךְ, “vyombo vya kumiminia sadaka ya kinywaji” huepuka kudai umbo maalumu la chombo na hutoa kazi inayodokezwa na neno la Kiebrania.'
