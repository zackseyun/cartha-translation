  - severity: low
    issue: “mitungi ya sadaka ya kinywaji”
    rationale: “Mitungi” hubainisha aina ya chombo zaidi kuliko Kiebrania kinavyoruhusu kwa uhakika; tafsiri ya kiuamilifu huhifadhi utata wa aina ya chombo.
