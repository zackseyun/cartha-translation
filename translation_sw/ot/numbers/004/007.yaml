  text: וְ/עַ֣ל שֻׁלְחַ֣ן הַ/פָּנִ֗ים יִפְרְשׂוּ֮ בֶּ֣גֶד תְּכֵלֶת֒ וְ/נָתְנ֣וּ עָ֠לָי/ו אֶת הַ/קְּעָרֹ֤ת וְ/אֶת הַ/כַּפֹּת֙ וְ/אֶת הַ/מְּנַקִּיֹּ֔ת וְ/אֵ֖ת קְשׂ֣וֹת הַ/נָּ֑סֶךְ וְ/לֶ֥חֶם הַ/תָּמִ֖יד עָלָ֥י/ו יִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/007.yaml
  text: And over the table of the Presence they shall spread a blue cloth[a], and they shall place on it the plates, the cups, the bowls, and the pitchers for the drink offering[b]; and the regular bread shall be on it.
translation:
  language: sw
  text: Juu ya meza ya Uwepo[a] watatandika kitambaa cha buluu, kisha wataweka juu yake sahani, vikombe, mabakuli, na vyombo vya kumiminia sadaka ya kinywaji; nao mkate wa daima[b] utakuwa juu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa jina la kimapokeo, “meza ya mikate ya wonyesho.” Kiebrania kwa uhalisi zaidi ni “meza ya Uwepo.”
    reason: alternative_reading
  - marker: b
    text: Au, “mkate wa kudumu.” Huu ni mkate uliowekwa daima mbele za BWANA juu ya meza.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחַן הַפָּנִים
  choice: meza ya Uwepo
  rationale: Kirai hiki kwa uhalisi ni ‘meza ya uso/uwepo.’ ‘Meza ya Uwepo’ huhifadhi nahau ya Kiebrania na maana yake ya kiibada bila kuibadili moja kwa moja kuwa jina la mikate.
- source_word: יִפְרְשׂוּ
  choice: watatandika
  rationale: Kitenzi kina maana ya kutandaza kitu juu ya kingine. ‘Watatandika’ ni Kiswahili cha kawaida na kinafaa kwa kitambaa kinachowekwa juu ya meza.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: kitambaa cha buluu
  rationale: תְּכֵלֶת ni rangi maalumu ya buluu au buluu yenye kuelekea zambarau iliyotumiwa katika hema la ibada. ‘Buluu’ ni wazi bila kudai kivuli cha rangi ambacho hakina uhakika kamili.
- source_word: הַקְּעָרֹת
  choice: sahani
  rationale: Katika orodha ya vyombo vya hema la ibada, neno hili linaelekea kutaja vyombo bapa vya kuandalia au kubebea vitu.
- source_word: הַכַּפֹּת
  choice: vikombe
  rationale: Neno hili linaweza kutaja vyombo vidogo vya namna mbalimbali. ‘Vikombe’ linaeleweka kwa urahisi katika muktadha wa vyombo vya mezani bila kubainisha umbo kupita kiasi.
- source_word: הַמְּנַקִּיֹּת
  choice: mabakuli
  rationale: Jina halisi la chombo hiki halina uhakika na limetafsiriwa kwa namna tofauti. ‘Mabakuli’ linafaa katika orodha ya vyombo vya mezani na ni lugha ya sasa.
- source_word: קְשׂוֹת הַנָּסֶךְ
  choice: mitungi ya sadaka ya kinywaji
  rationale: Kirai hiki hutaja vyombo vilivyohusishwa na kumimina sadaka ya kinywaji. ‘Mitungi’ linaonyesha chombo cha kumiminia, na ‘sadaka ya kinywaji’ huhifadhi matumizi yake ya kiibada.
- source_word: לֶחֶם הַתָּמִיד
  choice: mkate wa kudumu
  rationale: Kirai hiki humaanisha mkate uliopaswa kuwapo daima au kwa utaratibu mbele za BWANA. ‘Wa kudumu’ huhifadhi wazo la mwendelezo kuliko ‘wa kawaida,’ ambalo lingeweza kueleweka kuwa mkate usio maalumu.
- source_word: עָלָיו יִהְיֶה
  choice: utakuwa juu yake
  rationale: Tafsiri hii hufuata moja kwa moja kauli ya Kiebrania kwamba mkate utakuwa juu ya meza, bila kuongeza wazo la ‘kubaki’ ambalo halijaelezwa wazi na kitenzi peke yake.
theological_decisions:
- issue: Je, שֻׁלְחַן הַפָּנִים itafsiriwe kwa uhalisi kama meza ya Uwepo au kwa jina la kimapokeo linaloitaja mikate?
  choice: meza ya Uwepo
  alternative: meza ya mikate ya Wonyesho
  rationale: Tafsiri iliyochaguliwa huhifadhi taswira yenye mvutano ya ‘uso/uwepo’ katika Kiebrania. Jina la kimapokeo limewekwa katika tanbihi ili lisipotee, lakini halijatumika kufafanua nahau kimya kimya ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa orodha umehifadhiwa, huku ‘kisha’ na ‘nao’ yakisaidia mtiririko wa kawaida wa Kiswahili. Herufi kubwa katika ‘Uwepo’ inaashiria matumizi yake kama jina la kiibada bila kuondoa utata wa nahau ya Kiebrania.
