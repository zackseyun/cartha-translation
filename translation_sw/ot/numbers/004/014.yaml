  text: וְ/נָתְנ֣וּ עָ֠לָי/ו אֶֽת כָּל כֵּלָ֞י/ו אֲשֶׁ֣ר יְֽשָׁרְת֧וּ עָלָ֣י/ו בָּ/הֶ֗ם אֶת הַ/מַּחְתֹּ֤ת אֶת הַ/מִּזְלָגֹת֙ וְ/אֶת הַ/יָּעִ֣ים וְ/אֶת הַ/מִּזְרָקֹ֔ת כֹּ֖ל כְּלֵ֣י הַ/מִּזְבֵּ֑חַ וּ/פָרְשׂ֣וּ עָלָ֗י/ו כְּס֛וּי ע֥וֹר תַּ֖חַשׁ וְ/שָׂמ֥וּ בַדָּֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/014.yaml
  text: 'Then they shall place on it all its utensils with which they minister at it: the fire pans[a], the forks, the shovels, and the basins—all the utensils of the altar. Then they shall spread over it a covering of fine leather and put its poles in place.'
translation:
  language: sw
  text: 'Kisha wataweka juu yake vyombo vyake vyote wanavyotumia kuhudumu kwenye madhabahu: vyetezo, uma, makoleo na mabakuli—vyombo vyote vya madhabahu. Kisha watatandaza juu yake kifuniko cha ngozi ya tahashi[a] na kuweka mipiko yake mahali pake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho wa mnyama anayeitwa tahashi katika Kiebrania hauna uhakika. Huenda ikawa ngozi ya mbuzi, ngozi ya mnyama wa baharini, au kwa ujumla ngozi imara na bora.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: Kisha wataweka juu yake
  rationale: Huhifadhi mfuatano wa maagizo na maana ya kuweka vitu juu ya madhabahu.
- source_word: כָּל כֵּלָיו
  choice: vyombo vyake vyote
  rationale: “Vyombo” ni neno pana na la kawaida kwa vifaa mbalimbali vya huduma ya madhabahu.
- source_word: אֲשֶׁר יְשָׁרְתוּ עָלָיו בָּהֶם
  choice: wanavyotumia kuhudumu kwenye madhabahu
  rationale: Huwasilisha huduma ya kidini inayodokezwa na שרת na kuweka wazi kwamba kiwakilishi kinarejelea madhabahu.
- source_word: הַמַּחְתֹּת
  choice: vyetezo
  rationale: Neno hili hurejelea vyombo vya kubebea makaa au moto; “vyetezo” ni istilahi ya Kibiblia ya Kiswahili inayofaa katika muktadha huu.
- source_word: הַמִּזְלָגֹת
  choice: uma
  rationale: Hutoa kwa lugha ya sasa umbo na matumizi ya vifaa hivi bila kuongeza umahususi usiotajwa.
- source_word: הַיָּעִים
  choice: sepetu
  rationale: Ni vifaa vya kuondolea majivu; “sepetu” ni neno wazi kwa koleo pana la kazi hiyo.
- source_word: הַמִּזְרָקֹת
  choice: mabakuli
  rationale: Hurejelea vyombo vya kupokea au kunyunyizia vimiminika katika ibada; “mabakuli” ni ya kawaida na haibani matumizi yake kupita kiasi.
- source_word: כֹּל כְּלֵי הַמִּזְבֵּחַ
  choice: vyombo vyote vya madhabahu
  rationale: Huhifadhi muhtasari wa orodha na urudiaji wa כְּלִי kwa uthabiti.
- source_word: וּפָרְשׂוּ עָלָיו כְּסוּי
  choice: Kisha watatandaza juu yake kifuniko
  rationale: Huhifadhi kitenzi cha kutandaza na nomino “kifuniko” bila kuvichanganya.
- source_word: עוֹר תַּחַשׁ
  choice: ngozi ya tahashi
  rationale: Utambulisho wa תַּחַשׁ hauna uhakika. Uhamishaji wa jina unaepuka kuchagua mnyama fulani bila ushahidi wa kutosha, huku tanbihi ikieleza utata.
- source_word: וְשָׂמוּ בַדָּיו
  choice: na kuweka mipiko yake mahali pake
  rationale: “Mipiko” hufaa kwa fito za kubebea madhabahu, na “mahali pake” huonyesha kwamba zinawekwa katika mpangilio wa kubeba.
