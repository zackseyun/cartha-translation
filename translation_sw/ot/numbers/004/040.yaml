base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/040.yaml
  text: And those counted from them[a], by their clans, by their fathers’ houses, were two thousand six hundred and thirty.
translation:
  language: sw
  text: Nao waliohesabiwa miongoni mwao[a], kwa koo zao, kwa nyumba za baba zao, walikuwa elfu mbili mia sita na thelathini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waliosajiliwa miongoni mwao” au “walioandikishwa katika sensa.” Kiebrania kinawahusu wale waliosajiliwa katika sensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walikuwa
  rationale: Katika kauli hii ya sensa, kitenzi היה kinafanya kazi kama kiunganishi kinachoonyesha jumla iliyopatikana; “walikuwa” ni Kiswahili cha kawaida na cha wazi.
- source_word: פְּקֻדֵיהֶם
  choice: waliohesabiwa miongoni mwao
  rationale: Neno linalotokana na פקד hapa linawahusu waliosajiliwa na kuhesabiwa katika sensa. “Miongoni mwao” linaonyesha kwamba jumla hii ilitokana na kundi lililotajwa, bila kuongeza neno “wanaume” ambalo halipo wazi katika mstari huu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Katika muktadha wa sensa, מִשְׁפָּחָה ni kitengo cha ukoo; “koo” ni neno la kawaida la Kiswahili linaloonyesha mgawanyo huo wa kindugu.
- source_word: לְבֵית אֲבֹתָם
  choice: kwa jamaa za baba zao
  rationale: Kirai hiki ni namna ya kawaida ya Kiebrania ya kueleza vitengo vya nasaba vinavyoongozwa au kutambulishwa kupitia upande wa baba. “Jamaa za baba zao” ni cha asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno “nyumba za baba zao,” huku kikihifadhi muundo wa ukoo wa maandishi.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  choice: elfu mbili mia sita na thelathini
  rationale: Hii ni tafsiri ya moja kwa moja ya jumla ya hesabu kwa mtindo wa kawaida wa Kiswahili.
