  yaml_path: translation/ot/numbers/004/034.yaml
  text: So Moses and Aaron and the leaders of the congregation counted the sons of the Kohathites by their clans and by their fathers’ houses[a][b][c].
translation:
  language: sw
  text: Basi Musa, Aroni na viongozi wa kusanyiko wakawahesabu wazao wa Kohathi kwa koo zao na kwa nyumba za baba zao[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakawaandikisha” au “wakafanya sensa yao.” Kitenzi cha Kiebrania kinaweza pia kumaanisha “kuteua” katika miktadha mingine, lakini hapa kinarejelea kuwahesabu kwa ajili ya huduma.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, kihalisi, “wana wa Mkohathi,” yaani kundi la ukoo lililotokana na Kohathi.
    reason: lexical_alternative
  - marker: c
    text: “Nyumba za baba” ni istilahi ya kijamii ya Israeli inayomaanisha kaya za ukoo au migawanyo ya kifamilia iliyotokana na mababu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: wakawahesabu
  rationale: Katika muktadha huu wa sensa ya Walawi kwa ajili ya huduma, kitenzi פקד kinamaanisha kuwahesabu au kuwaandikisha, si kuwateua kwenye cheo.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: viongozi wa kusanyiko
  rationale: נְשִׂיאִים ni viongozi wanaotambuliwa wa jumuiya, na עֵדָה hapa ni kusanyiko la Israeli; usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa.
- source_word: בְּנֵי הַקְּהָתִי
  choice: wazao wa Kohathi
  rationale: Ingawa Kiebrania kina usemi wa kifamilia, kihalisi ‘wana wa Mkohathi,’ hapa unamaanisha kundi la ukoo lililotokana na Kohathi; ‘wazao wa Kohathi’ huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה katika muktadha wa sensa na nasaba ni kitengo cha ukoo; ‘kwa’ huonyesha kwamba walipangwa na kuhesabiwa kulingana na migawanyo hiyo.
- source_word: וּלְבֵית אֲבֹתָם
  choice: na kwa jamaa za baba zao
  rationale: בֵית אָבוֹת ni istilahi ya kijamii na kinasaba inayorejelea kaya au migawanyo ya kifamilia ya ukoo wa upande wa baba; tafsiri hii huhifadhi dhana bila kutumia Kiswahili kisicho cha kawaida cha ‘nyumba za baba.’
