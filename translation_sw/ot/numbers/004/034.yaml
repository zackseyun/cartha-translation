translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Wazao wa Kohathi’ na ‘jamaa za baba zao’ huepuka ukakasi wa tafsiri ya neno kwa neno huku vikihifadhi muundo wa ukoo wa matini ya Kiebrania.
