base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/016.yaml
  text: And the oversight of Eleazar son of Aaron the priest shall be the oil for the light[a], the fragrant incense, the regular grain offering, and the anointing oil—the oversight of the whole tabernacle and all that is in it[d][c][b], the sanctuary and its furnishings.
translation:
  language: sw
  text: Eleazari mwana wa Haruni kuhani atakuwa na jukumu[a] la kusimamia mafuta ya kuwashia taa, uvumba wa manukato, sadaka ya nafaka inayotolewa daima[b], na mafuta ya upako. Atakuwa na jukumu la kusimamia Maskani yote na kila kitu kilichomo ndani yake, mahali patakatifu[c] na vyombo vyake[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘wajibu’ au ‘angalizi’; neno la Kiebrania linamaanisha usimamizi au jukumu alilokabidhiwa mtu.
    reason: lexical_alternative
  - marker: b
    text: Au ‘sadaka ya nafaka inayotolewa kwa ukawaida.’ Neno la Kiebrania linaweza kumaanisha ‘daima’ au ‘kwa ukawaida.’
    reason: lexical_alternative
  - marker: c
    text: Au ‘katika patakatifu.’ Hapa huenda neno hili linarejelea kwa upana eneo takatifu, si lazima chumba kinachoitwa Patakatifu pekee.
    reason: lexical_alternative
  - marker: d
    text: 'Au ‘vifaa vyake’ au ‘zana zake.’ Kiebrania kinaweza pia kufuatwa kwa ukaribu zaidi: ‘katika mahali patakatifu na katika vyombo vyake.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת
  choice: jukumu la kusimamia
  rationale: Nomino hii inaonyesha jukumu au usimamizi aliokabidhiwa mtu. Kiswahili hiki ni cha kawaida na kinaonyesha kwamba Eleazari alipewa wajibu wa vitu vilivyoorodheshwa.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: mafuta ya kuwashia taa
  rationale: Kirai hiki, kihalisi ‘mafuta ya mwanga,’ kinamaanisha mafuta yaliyotumiwa kutoa mwanga; tafsiri hii ni ya asili katika Kiswahili bila kuyafungamanisha kupita kiasi na aina maalumu ya taa.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: uvumba wa manukato
  rationale: Huwakilisha uvumba uliotengenezwa kwa vitu vyenye harufu nzuri na ni usemi wa kawaida, wenye heshima katika Kiswahili.
- source_word: מִנְחַת הַתָּמִיד
  choice: sadaka ya nafaka inayotolewa daima
  rationale: מִנְחָה ni sadaka ya nafaka, na תָּמִיד huonyesha mwendelezo au utoaji wa kawaida. ‘Inayotolewa daima’ huhifadhi maana hiyo bila kuifanya iwe ‘ya kila siku’ kwa lazima.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: mafuta ya upako
  rationale: Hili ni neno la kawaida la Kiswahili kwa mafuta yaliyotumiwa katika tendo la kupaka kwa kusudi takatifu.
- source_word: כָּל הַמִּשְׁכָּן
  choice: Maskani yote
  rationale: Katika Hesabu, מִשְׁכָּן ni Maskani; ‘yote’ huhifadhi nguvu ya כָּל.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: na kila kitu kilichomo ndani yake
  rationale: Tafsiri hii huwasilisha wazi kishazi cha Kiebrania na kurejelea yaliyomo katika Maskani.
- source_word: בְּקֹדֶשׁ
  choice: mahali patakatifu
  rationale: Katika muktadha huu neno lina maana ya eneo takatifu la ibada. Tafsiri hii haitendi kana kwamba lazima lirejelee chumba cha ndani pekee.
- source_word: וּבְכֵלָיו
  choice: na vyombo vyake
  rationale: כֵּלִים inaweza kumaanisha vyombo, vifaa, au zana. ‘Vyombo’ ni neno pana linalofaa vifaa vitakatifu vya Maskani.
theological_decisions:
- issue: Maana na uhusiano wa פְקֻדַּת inayorudiwa
  choice: Eleazari amepewa jukumu la kusimamia vitu vitakatifu vilivyoorodheshwa na, kwa upana zaidi, Maskani yote na yaliyomo ndani yake.
  alternative: 'Kirai cha pili kinaweza kueleweka kama ufupisho wa kiambatisho: ‘jukumu la Maskani yote…,’ huku muundo wa sentensi ukiachwa bila kitenzi kama ulivyo katika Kiebrania.'
  rationale: Kiebrania kina muundo wa majina usio na kitenzi na wenye hali ya kiambatisho. Kiswahili kinahitaji sentensi iliyo wazi zaidi, kwa hiyo ‘atakuwa na jukumu la kusimamia’ limetumiwa bila kuongeza dai la kimafundisho.
- issue: Nguvu ya viambishi בְּ katika בְּקֹדֶשׁ וּבְכֵלָיו
  choice: 'Vimeeleweka kuwa vinaonyesha eneo au upeo wa jukumu, na kirai cha mwisho kimetolewa kama ufafanuzi wa yaliyomo katika Maskani: ‘mahali patakatifu na vyombo vyake.’'
  alternative: 'Inawezekana kutafsiri kwa kulandamisha zaidi umbo la Kiebrania: ‘katika mahali patakatifu na katika vyombo vyake,’ ingawa Kiswahili hicho kinaweza kueleweka kana kwamba vitu vyote viko ndani ya vyombo.'
  rationale: Muundo wa mwisho ni mfupi na wenye utata kiasi katika Kiebrania. Tafsiri kuu inafuata uhusiano wa kiambatisho unaofaa muktadha, huku tanbihi ikihifadhi uwezekano wa tafsiri ya kieneo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. ‘Maskani,’ ‘uvumba,’ ‘sadaka ya nafaka,’ na ‘mafuta ya upako’ huhifadhi msamiati wa ibada unaotambulika bila kuingiza istilahi za dhehebu fulani. Kurudiwa kwa ‘jukumu la kusimamia’ kunaakisi kurudiwa kwa פְקֻדַּת na kuweka wazi muundo wa Kiebrania.
