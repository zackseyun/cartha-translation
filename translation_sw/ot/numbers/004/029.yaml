lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: wana wa Merari
  rationale: Kirai hiki kwa maana ya msingi ni ‘wana wa Merari,’ lakini katika muktadha wa sensa kinawahusu wazao wa ukoo wake. Tafsiri hii inahifadhi lugha ya kifamilia ya Kiebrania, huku tanbihi ikibainisha maana pana.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Katika mpangilio wa kikabila na sensa, מִשְׁפָּחָה ni mgawanyiko wa watu kwa nasaba. ‘Koo’ ni neno la kawaida na wazi zaidi hapa kuliko ‘familia.’
- source_word: לְבֵית אֲבֹתָם
  choice: kwa nyumba za baba zao
  rationale: Tafsiri hii inahifadhi msemo wa nasaba wa Kiebrania unaorejelea makundi ya jamaa yaliyopangwa kwa upande wa baba; tanbihi inaeleza maana yake ya kijamii.
- source_word: תִּפְקֹד
  choice: uwahesabu
  rationale: Katika muktadha huu wa sensa, kitenzi פקד kinamaanisha kuhesabu au kuandikisha watu. ‘Uwahesabu’ ni amri ya moja kwa moja na ya asili katika Kiswahili.
- source_word: אֹתָם
  choice: -wa- katika ‘uwahesabu’
  rationale: Kiwakilishi cha yambwa ‘wa’ ndani ya kitenzi kinawarejelea wana wa Merari na kuwasilisha אֹתָם kwa sarufi ya kawaida ya Kiswahili.
