  text: As for the sons of Merari[a], you shall count them by their clans[b], by their fathers' houses.
translation:
  language: sw
  text: Wana wa Merari[a], uwahesabu kwa koo zao, kwa nyumba za baba zao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazao wa Merari” au “Wamerari.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, huu ni msemo wa nasaba unaomaanisha makundi ya jamaa yaliyotokana na upande wa baba.
