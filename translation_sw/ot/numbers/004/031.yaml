translation:
  language: sw
  text: 'Na huu ndio wajibu[a] wao wa kubeba katika huduma yao yote katika Hema la Kukutania: mbao[b] za Maskani, pingo zake, nguzo zake, na vitako vyake.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jukumu walilokabidhiwa”; neno la Kiebrania מִשְׁמֶרֶת linasisitiza dhamana waliyopewa.
    reason: lexical_alternative
  - marker: b
    text: Au “fremu za Maskani.” Neno la Kiebrania linaweza kumaanisha mbao au maplanga ya kimuundo; “mbao” ni tafsiri ya kawaida inayohifadhi maana hiyo.
    reason: lexical_alternative
  - marker: c
    text: Au “soketi zake” au “misingi yake”; hivi vilikuwa vipande vya chini ambamo mbao au nguzo zilikalishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Na huu ndio
  rationale: Huhifadhi kiunganishi na mtindo wa Kiebrania wa kutambulisha orodha inayofuata kwa njia ya asili katika Kiswahili.
- source_word: מִשְׁמֶרֶת
  choice: wajibu
  rationale: Neno hili linamaanisha jukumu au dhamana waliyopewa; “wajibu” ni wazi, wa kawaida na wenye hadhi katika muktadha huu.
- source_word: מַשָּׂאָם
  choice: wao wa kubeba mzigo
  rationale: Muundo huu unaonyesha kwamba kinachozungumziwa ni vitu walivyopaswa kubeba, si kazi ya jumla tu; umoja “mzigo” unahifadhi matumizi ya jina la pamoja katika Kiebrania.
- source_word: לְכָל עֲבֹדָתָם
  choice: katika huduma yao yote
  rationale: “Huduma” inafaa kwa kazi rasmi iliyofanywa kuhusu Maskani na huhifadhi upeo unaoonyeshwa na “yote.”
- source_word: בְּאֹהֶל מוֹעֵד
  choice: kwenye Hema la Kukutania
  rationale: Hili ni jina linaloeleweka la mahali patakatifu; “kwenye” linafaa kwa eneo au nyanja ya huduma, ambayo ilihusu pia vipande vya muundo wa hema.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: fremu za Maskani
  rationale: קֶרֶשׁ hapa ni vipande vya kimuundo vya Maskani. “Fremu” inaonyesha kazi yake ya kujenga muundo kuliko “mbao” pekee.
- source_word: בְרִיחָיו
  choice: mataruma yake
  rationale: Haya ni mataruma ya mlalo yaliyoshikilia fremu za Maskani pamoja; neno hili ni la asili na sahihi zaidi kuliko “fito” kwa matumizi hayo.
- source_word: עַמּוּדָיו
  choice: nguzo zake
  rationale: “Nguzo” ni neno la kawaida na sahihi kwa viunzi vilivyosimama wima.
- source_word: אֲדָנָיו
  choice: misingi yake
  rationale: Neno hili linataja vipande vya chini ambamo fremu au nguzo zilikalishwa. “Misingi” ni wazi kwa msomaji wa kawaida, huku tanbihi ikihifadhi maana ya kiufundi.
