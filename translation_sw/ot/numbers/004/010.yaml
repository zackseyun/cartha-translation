translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa hatua mbili wa maagizo umehifadhiwa kwa “kisha,” na utata wa neno תַּחַשׁ umeachwa wazi badala ya kutatuliwa kwa kubahatisha.
