  yaml_path: translation/ot/numbers/004/010.yaml
  text: They shall put it and all its utensils into a covering of fine leather[a], and they shall place it on the carrying frame.
translation:
  language: sw
  text: Watakiweka, pamoja na vifaa vyake vyote, ndani ya kifuniko cha ngozi ya tahashi[a], kisha watakiweka juu ya fito ya kubebea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maana kamili ya neno la Kiebrania תַּחַשׁ (tahashi) haijulikani. Huenda likawa jina la mnyama fulani ambaye ngozi yake ilitumiwa, au aina ya ngozi imara. Tafsiri za jadi zimelitambulisha kwa namna mbalimbali, kutia ndani ngozi ya pomboo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ אֹתָהּ
  choice: Watakiweka
  rationale: Kitenzi katika maagizo kinaonyesha hatua inayofuata inayopaswa kufanywa. Kiambishi -ki- kinarejelea kinara kilichotajwa katika mstari uliotangulia, huku kiwakilishi cha Kiebrania kikihifadhiwa badala ya kurudia nomino.
- source_word: וְאֶת כָּל כֵּלֶיהָ
  choice: pamoja na vifaa vyake vyote
  rationale: כֵּלִים ni neno pana kwa vyombo, zana, au vifaa. “Vifaa” ni Kiswahili cha kawaida na kinafaa kwa vitu vilivyotumiwa pamoja na kinara.
- source_word: אֶל מִכְסֵה
  choice: ndani ya kifuniko
  rationale: אֶל baada ya נתן hapa inaeleza kuwekwa ndani ya kitu kinachofunika; tafsiri hii inaonyesha kwamba kinara na vifaa vyake vinafungwa kwa ulinzi.
- source_word: עוֹר תַּחַשׁ
  choice: ngozi ya tahashi
  rationale: Utambulisho wa תַּחַשׁ hauna uhakika. Kutumia jina lililotoholewa “tahashi” huepuka kudai bila ushahidi kwamba ni ngozi ya mnyama fulani au aina maalumu ya ngozi; tanbihi inaeleza utata huo.
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: kisha watakiweka juu ya mti wa kubebea
  rationale: Kitenzi kinachorudiwa kinaanzisha hatua inayofuata. מוֹט ni mti au pau inayotumiwa kubebea; “mti wa kubebea” ni wazi, wa asili katika Kiswahili, na huhifadhi umoja wa Kiebrania.
