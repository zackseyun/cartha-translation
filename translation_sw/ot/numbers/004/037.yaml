base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/037.yaml
  text: These were the counted men of the families of the Kohathites, everyone serving in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh by the hand of Moses.
translation:
  language: sw
  text: Hawa ndio waliohesabiwa wa koo za Wakohathi, wote waliokuwa wakihudumu katika Hema la Kukutania, ambao Musa na Aroni waliwahesabu kwa amri ya Yahwe kupitia kwa Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mkono wa Musa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: waliohesabiwa
  rationale: Katika muktadha huu wa sensa ya huduma, neno hili linamaanisha watu waliohesabiwa; umbo hili ni la asili kwa Kiswahili na huepuka nomino dhahania.
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  choice: koo za Wakohathi
  rationale: מִשְׁפְּחֹת humaanisha vikundi vya ukoo au familia pana; “koo” linafaa katika mpangilio wa kikabila, na “Wakohathi” linaonyesha kundi la wazao wa Kohathi.
- source_word: כָּל הָעֹבֵד
  choice: wote waliokuwa wakihudumu
  rationale: Kirai hiki kinaonyesha jamii yote iliyokuwa ikifanya huduma; “wakihudumu” ni cha kawaida na chenye heshima katika muktadha wa Hema.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika Hema la Kukutania
  rationale: “Katika” linaakisi בְּ kama eneo au nyanja ya huduma; “Hema la Kukutania” ni tafsiri ya kawaida na inayoeleweka ya jina hili.
- source_word: אֲשֶׁר פָּקַד
  choice: ambao ... waliwahesabu
  rationale: Hapa פקד linahusu kuhesabu katika sensa, si kuteua; kiwakilishi kinawarudia watu waliohesabiwa.
- source_word: עַל פִּי יְהוָה
  choice: kwa amri ya Yahwe
  rationale: Nahau ya Kiebrania, kihalisi “kwa kinywa cha,” ina maana ya kufuata amri; tafsiri hii ni wazi na ya asili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limehifadhiwa kwa unukuzi unaotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo.
- source_word: בְּיַד מֹשֶׁה
  choice: kupitia kwa Musa
  rationale: Nahau hii huonyesha uwakala au upatanishi. “Kupitia kwa Musa” huwasilisha maana hiyo kwa Kiswahili cha asili; tafsiri ya karibu zaidi ya umbo, “kwa mkono wa Musa,” imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana Tetragramatoni yenyewe; “Yahwe” huhifadhi jina la agano bila kulibadilisha kuwa cheo.
- issue: Uwakala katika בְּיַד מֹשֶׁה
  choice: kupitia kwa Musa
  alternative: kwa mkono wa Musa
  rationale: Kirai kinaweza kutaja Musa kuwa mpatanishi wa amri, huku umbo halisi la nahau likiwa “kwa mkono wa Musa.” Maana ya uwakala imewekwa katika matini na umbo halisi katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio unafuata Kiebrania kwa ukaribu bila kuwa mgumu; istilahi “koo,” “Hema la Kukutania,” na “Yahwe” zimetumiwa kwa uthabiti wa kibiblia.
