  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כָל בַּ֞ת יֹרֶ֣שֶׁת נַחֲלָ֗ה מִ/מַּטּוֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/אֶחָ֗ד מִ/מִּשְׁפַּ֛חַת מַטֵּ֥ה אָבִ֖י/הָ תִּהְיֶ֣ה לְ/אִשָּׁ֑ה לְמַ֗עַן יִֽירְשׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלַ֥ת אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/008.yaml
  text: And every daughter who possesses an inheritance from the tribes of the sons of Israel shall become the wife of one from the clan of her father's tribe[d][c][b][a], so that the sons of Israel may each possess the inheritance of his fathers.
translation:
  language: sw
  text: Na kila binti aliye na urithi kutoka katika makabila ya wana wa Israeli[a] atakuwa mke wa mmoja wa ukoo wa kabila la baba yake[b], ili kila mmoja wa wana wa Israeli amiliki urithi wa baba zake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
  - marker: b
    text: Au “jamaa ya kabila la baba yake”; neno la Kiebrania linamaanisha kundi la ukoo ndani ya kabila.
    reason: lexical_alternative
  - marker: c
    text: Au “ili kila mmoja wa wana wa Israeli arithi urithi wa baba zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרֶשֶׁת נַחֲלָה
  choice: aliye na urithi
  rationale: Kirai hiki kinaeleza hali ya binti kama mrithi mwenye sehemu ya ardhi; Kiswahili hiki ni cha kawaida na huepuka uradidi usio wa asili wa ‘anayerithi urithi.’
- source_word: נַחֲלָה
  choice: urithi
  rationale: Katika muktadha huu wa umiliki wa ardhi ya kikabila, neno hili linamaanisha mali au sehemu ya ardhi inayorithiwa.
- source_word: מִמַּטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: kutoka katika makabila ya wana wa Israeli
  rationale: ‘Makabila’ huhifadhi mgawanyo wa kikabila, na ‘wana wa Israeli’ hudumisha umbo la kiume la msemo wa Kiebrania katika sheria hii ya urithi wa ukoo wa baba.
- source_word: מִמִּשְׁפַּחַת מַטֵּה אָבִיהָ
  choice: mtu wa ukoo wa kabila la baba yake
  rationale: ‘Ukoo’ hutofautisha mishpachah, kundi dogo la jamaa, na matteh, kabila kubwa zaidi.
- source_word: תִּהְיֶה לְאִשָּׁה
  choice: ataolewa na
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya nahau halisi ‘atakuwa kuwa mke,’ huku ikihifadhi maana ya sharti la ndoa.
- source_word: יִירְשׁוּ ... אִישׁ
  choice: kila mmoja ... aendelee kumiliki
  rationale: Kitenzi ירשׁ hapa kinaweza kusisitiza kudumu kwa umiliki wa ardhi; ‘kila mmoja’ huonyesha matumizi ya kigawanyo ya אִישׁ.
- source_word: נַחֲלַת אֲבֹתָיו
  choice: urithi wa baba zake
  rationale: Huhifadhi lugha ya ukoo wa baba iliyo muhimu kwa mfumo wa kisheria wa kifungu hiki.
theological_decisions:
- issue: Lugha ya kijinsia katika agano na sheria ya urithi
  choice: Kudumisha ‘wana wa Israeli’ na ‘baba zake’ katika matini kuu.
  alternative: ‘Waisraeli’ na ‘mababu zake’
  rationale: Maumbo ya kiume yanahusiana moja kwa moja na mfumo wa urithi kupitia ukoo wa baba unaoelezwa hapa; kuyafanya yasiyo na jinsia kungepunguza kipengele hicho cha kisheria.
- issue: Maana ya ירשׁ katika kishazi cha kusudi
  choice: ‘aendelee kumiliki’
  alternative: ‘arithi’
  rationale: Muktadha unalenga kuhifadhi ardhi ndani ya kabila, hivyo kuendelea kumiliki kunaonyesha matokeo ya kudumu; hata hivyo, maana ya ‘kurithi’ inabaki uwezekano halali na imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Aliye na urithi’ na ‘aendelee kumiliki’ ni vya asili zaidi kuliko uradidi wa ‘kurithi urithi,’ huku tanbihi ikihifadhi tafsiri hiyo ya karibu zaidi na umbo la Kiebrania.
