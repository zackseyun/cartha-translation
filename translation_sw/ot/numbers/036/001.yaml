  text: וַֽ/יִּקְרְב֞וּ רָאשֵׁ֣י הָֽ/אָב֗וֹת לְ/מִשְׁפַּ֤חַת בְּנֵֽי גִלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה מִֽ/מִּשְׁפְּחֹ֖ת בְּנֵ֣י יוֹסֵ֑ף וַֽ/יְדַבְּר֞וּ לִ/פְנֵ֤י מֹשֶׁה֙ וְ/לִ/פְנֵ֣י הַ/נְּשִׂאִ֔ים רָאשֵׁ֥י אָב֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/001.yaml
  text: Then the heads of the fathers’ houses of the clan of the sons of Gilead son of Machir[a], son of Manasseh, from the clans of the sons of Joseph, came near and spoke before Moses and before the leaders[b], the heads of the fathers’ houses of the sons of Israel.
translation:
  language: sw
  text: Ndipo wakuu wa nyumba za ukoo[a] wa jamaa ya wana wa Gileadi, mwana wa Makiri, mwana wa Manase, kutoka katika koo za wana wa Yosefu, wakakaribia na kusema mbele ya Musa na mbele ya viongozi, wakuu wa nyumba za ukoo wa wana wa Israeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakuu wa familia” au “viongozi wa nyumba za ukoo.” Usemi wa Kiebrania unawahusu viongozi wanaotambulika wa vikundi vya ukoo katika mpangilio wa makabila ya Israeli.
    reason: lexical_alternative
  - marker: b
    text: “Wana wa Israeli” ndiyo usemi rasmi wa Kiebrania; pia inaweza kutafsiriwa “Waisraeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: wakakaribia
  rationale: Kitenzi hiki kinaonyesha kukaribia kwa kusudi la kuwasilisha jambo rasmi; “wakakaribia” kinahifadhi mwendo halisi na muktadha wa kisheria.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: wakuu wa nyumba za mababu
  rationale: Usemi huu wa Kiebrania unawahusu viongozi wanaotambulika wa vitengo vya ukoo. Tafsiri hii inahifadhi taswira ya nyumba za ukoo bila kuifupisha kuwa “familia” tu.
- source_word: לְמִשְׁפַּחַת
  choice: wa jamaa ya
  rationale: Kiambishi ל kinaonyesha uhusiano au kuwa sehemu ya kundi; “wa jamaa ya” ni Kiswahili cha kawaida kinachoonyesha uhusiano huo.
- source_word: בְּנֵי גִלְעָד
  choice: wazao wa Gileadi
  rationale: Katika nasaba hii “wana wa” humaanisha kundi la vizazi vya Gileadi. “Wazao” huepuka kuwafanya wote waonekane kuwa wana wake wa moja kwa moja.
- source_word: בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: mwana wa Makiri, mwana wa Manase
  rationale: Mfuatano wa nasaba umehifadhiwa bila kufupishwa, sambamba na marudio ya בֶּן katika chanzo.
- source_word: מִמִּשְׁפְּחֹת בְּנֵי יוֹסֵף
  choice: miongoni mwa koo za wazao wa Yosefu
  rationale: מִן inaonyesha kutoka au kuwa sehemu ya muundo mpana wa kikabila; “miongoni mwa koo” huwasilisha uhusiano huo kwa uwazi.
- source_word: וַיְדַבְּרוּ
  choice: wakasema
  rationale: דבר ni kitenzi cha kawaida cha kusema. “Wakasema” ni cha asili katika simulizi na hakiongezi msisitizo usiokuwapo.
- source_word: לִפְנֵי מֹשֶׁה וְלִפְנֵי הַנְּשִׂאִים
  choice: mbele ya Musa na mbele ya viongozi
  rationale: לִפְנֵי inaonyesha kufika katika uwepo wa wenye mamlaka, na marudio ya “mbele ya” yanahifadhi muundo wa chanzo. הַנְּשִׂיאִים imetafsiriwa kwa neno la sasa na linaloeleweka “viongozi”.
- source_word: רָאשֵׁי אָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: wakuu wa nyumba za mababu wa wana wa Israeli
  rationale: Kirai hiki kinafafanua viongozi hao. “Wana wa Israeli” kinahifadhi usemi rasmi wa Kiebrania badala ya kuufanya tu “Waisraeli” katika matini kuu.
