  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֥ן עָשׂ֖וּ בְּנ֥וֹת צְלָפְחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/010.yaml
  text: Just as Yahweh had commanded Moses[a], so the daughters of Zelophehad did.
translation:
  language: sw
  text: Kama vile Yahweh alivyomwamuru Musa, ndivyo walivyofanya binti za Selofehadi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Kama vile
  rationale: Huonyesha ulinganifu kati ya amri na tendo lililoifuata; ni usemi wa kawaida wa Kiswahili unaosisitiza kufuata sawasawa.
- source_word: צִוָּה
  choice: alivyomwamuru
  rationale: Kitenzi hiki humaanisha kutoa amri. Muundo wa '-livyo-' unaunganisha kwa kawaida amri iliyotangulia na tendo la baadaye bila kulazimisha njeo isiyopo wazi katika Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֶת מֹשֶׁה
  choice: Musa
  rationale: אֶת humtambulisha Musa kama mtendewa wa kitendo cha kuamuru; Kiswahili cha kawaida hutumia kiambishi cha yambwa katika 'alimwamuru Musa'.
- source_word: כֵּן
  choice: ndivyo
  rationale: Huonyesha kwamba tendo lao lililingana na amri; 'ndivyo' huunda uwiano wa asili na 'kama vile'.
- source_word: עָשׂוּ
  choice: walivyofanya
  rationale: Huhifadhi maana pana ya 'walifanya' bila kuongeza maelezo ya tendo ambalo muktadha tayari unalitambulisha.
- source_word: בְּנוֹת צְלָפְחָד
  choice: binti za Selofehadi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa umilikaji, ikiwatambulisha wanawake hao wazi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja. 'Yahweh' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo linganishi 'Kama vile ... ndivyo ...' huhifadhi ulinganifu wa Kiebrania kwa lugha ya kawaida. Hakuna tanbihi inayohitajika kwa kuwa tofauti ya 'kama/kama vile' haibadili maana kwa kiasi kinachohitaji kuonyeshwa.
