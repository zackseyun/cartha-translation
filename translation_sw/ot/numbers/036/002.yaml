  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אֶת אֲדֹנִ/י֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֨ת אֶת הָ/אָ֧רֶץ בְּ/נַחֲלָ֛ה בְּ/גוֹרָ֖ל לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וַֽ/אדֹנִ/י֙ צֻוָּ֣ה בַֽ/יהוָ֔ה לָ/תֵ֗ת אֶֽת נַחֲלַ֛ת צְלָפְחָ֥ד אָחִ֖י/נוּ לִ/בְנֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/002.yaml
  text: And they said[a], “Yahweh commanded my lord to give the land as an inheritance by lot to the sons of Israel, and my lord was commanded by Yahweh to give the inheritance of Zelophehad our brother to his daughters.”
translation:
  language: sw
  text: Nao wakasema, “Yahwe alimwamuru bwana wangu kuwapa wana wa Israeli[a] nchi kuwa urithi kwa kura, naye bwana wangu aliamuriwa na Yahwe kuwapa binti za Selofehadi urithi wa Selofehadi, ndugu yetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wa Israeli” au “Waisraeli.” Kiebrania kinasema, “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Ni cheo cha heshima kinachotumiwa na viongozi wa ukoo wanapomwambia Musa, si jina la Mungu. ‘Bwana wangu’ huhifadhi heshima ya usemi bila kudokeza utumwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kwa cheo kama ‘BWANA’.
- source_word: לָתֵת אֶת הָאָרֶץ
  choice: kuwapa ... nchi
  rationale: Kitenzi נתן kinaeleza kuwapa Israeli nchi; muundo huu ni wa kawaida katika Kiswahili na unamtaja mpokeaji kwa uwazi.
- source_word: בְּנַחֲלָה
  choice: kuwa urithi
  rationale: Huhifadhi maana ya nchi kama sehemu ya kudumu inayorithiwa katika muktadha wa kisheria.
- source_word: בְּגוֹרָל
  choice: kwa kura
  rationale: Huonyesha njia iliyotumiwa kugawa nchi bila kuongeza maelezo yasiyokuwapo katika chanzo.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hufuata kwa karibu usemi wa Kiebrania ‘wana wa Israeli’ huku tanbihi ikitoa namna nyingine za kawaida za kueleza kundi hilo la taifa.
- source_word: צֻוָּה בַיהוָה
  choice: aliamuriwa na Yahwe
  rationale: Kauli tendwa ya Kiebrania na ב ya mtendaji/chanzo zinawakilishwa kwa kauli tendwa ya kawaida ya Kiswahili.
- source_word: נַחֲלַת צְלָפְחָד
  choice: urithi wake
  rationale: Kiwakilishi ‘wake’ kinamrejelea Selofehadi aliyetajwa mara moja katika kishazi hicho na kuzuia marudio mazito, huku maana ya umiliki ikibaki wazi.
- source_word: אָחִינוּ
  choice: ndugu yetu
  rationale: Huhifadhi lugha halisi ya undugu, ambayo hapa pia inaweza kuonyesha uhusiano wa ukoo.
- source_word: לִבְנֹתָיו
  choice: kuwapa binti za Selofehadi
  rationale: Huwataja wazi wapokeaji wa urithi; jina limerudiwa ili kuepuka utata wa kiwakilishi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova au BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Lugha ya kijinsia ya kundi katika לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: watoto wa Israeli au Waisraeli
  rationale: Kiebrania kinatumia nomino ya kiume ya wingi ‘wana’; tafsiri kuu huhifadhi umbo hilo, huku tanbihi ikifafanua kuwa ni jina la pamoja la watu wa Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kisheria lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio umewekwa wa asili kadiri inavyowezekana bila kuifanya sentensi kuwa ngumu; ‘kwa kura’ na ‘urithi’ huhifadhi istilahi kuu za ugawaji wa nchi.
