  text: וַ/תִּהְיֶ֜ינָה מַחְלָ֣ה תִרְצָ֗ה וְ/חָגְלָ֧ה וּ/מִלְכָּ֛ה וְ/נֹעָ֖ה בְּנ֣וֹת צְלָפְחָ֑ד לִ/בְנֵ֥י דֹדֵי/הֶ֖ן לְ/נָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/011.yaml
  text: Mahlah[a], Tirzah, Hoglah, Milcah, and Noah, the daughters of Zelophehad, became wives of the sons of their uncles.
translation:
  language: sw
  text: Mahla, Tirsa, Hogla, Milka na Noa, binti za Selofehadi, wakaolewa na wana wa ndugu wa kiume wa baba zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa kifupi, “wana wa ami zao.” Ami ni ndugu wa kiume wa baba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּהְיֶינָה
  choice: wakaolewa
  rationale: Katika muktadha huu wa ndoa, kitenzi היה pamoja na לְנָשִׁים kinaonyesha kuwa wanawake hao waliingia katika hali ya kuwa wake. “Wakaolewa” ni Kiswahili cha kawaida na huwasilisha hatua hiyo kwa uwazi.
- source_word: בְּנוֹת
  choice: binti
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa watoto wa kike katika taarifa ya ukoo.
- source_word: צְלָפְחָד
  choice: Selofehadi
  rationale: Jina limetoholewa kwa tahajia inayofaa matamshi ya Kiswahili.
- source_word: לִבְנֵי
  choice: na wana wa
  rationale: Katika usemi wa ndoa, kiambishi לְ kinaonyesha wanaume waliooa wanawake hao. Kiswahili cha kawaida husema mtu “aliolewa na” mtu mwingine.
- source_word: דֹדֵיהֶן
  choice: ndugu wa kiume wa baba zao
  rationale: דּוֹד hapa inaelekea kutaja ami, yaani ndugu wa kiume wa baba, si mjomba. Ufafanuzi huu ni wazi kwa wasomaji wa Kiswahili na unafaa muktadha wa kuhifadhi urithi katika ukoo wa baba.
- source_word: לְנָשִׁים
  choice: wakaolewa
  rationale: Kirai hiki ni sehemu ya kauli ya ndoa yenye maana ya kuwa wake. Maana yake imewasilishwa kwa kitenzi asilia cha Kiswahili badala ya usemi mzito wa neno kwa neno.
- source_word: מַחְלָה תִרְצָה וְחָגְלָה וּמִלְכָּה וְנֹעָה
  choice: Mahla, Tirsa, Hogla, Milka na Noa
  rationale: Majina yametoholewa kwa muundo unaosomeka kwa urahisi katika Kiswahili, na mpangilio wa Kiebrania umehifadhiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Usemi “wakaolewa na” umetumiwa kwa uasilia, huku uhusiano mahususi wa ukoo katika דֹדֵיהֶן ukielezwa wazi ili usichanganywe na “mjomba,” ambaye kwa kawaida ni ndugu wa mama.
