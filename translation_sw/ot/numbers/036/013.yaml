  text: אֵ֣לֶּה הַ/מִּצְוֺ֞ת וְ/הַ/מִּשְׁפָּטִ֗ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/013.yaml
  text: These are the commandments and the judgments that Yahweh commanded through Moses to the sons of Israel in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: sw
  text: Hizi ndizo amri na hukumu ambazo Yahwe aliamuru kupitia Musa kwa wana wa Israeli katika nyanda za Moabu, kando ya Yordani karibu na Yeriko.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania “wana wa Israeli”; usemi huu wa agano unawahusu watu wa Israeli kwa pamoja.
    reason: lexical_alternative
  - marker: b
    text: Au, “kando ya Yordani, mkabala na Yeriko.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַמִּצְוֺת
  choice: Hizi ndizo amri
  rationale: Muundo huu wa Kiswahili unatambulisha kwa kawaida muhtasari wa hitimisho, huku ukidumisha maana ya kisheria ya מִצְוֺת.
- source_word: וְהַמִּשְׁפָּטִים
  choice: na hukumu
  rationale: Katika muktadha wa sheria, מִשְׁפָּטִים inaweza kumaanisha hukumu, masharti, au kanuni; “hukumu” inadumisha utofauti wake na “amri” na ukaribu wa kileksia na Kiebrania.
- source_word: צִוָּה יְהוָה
  choice: Yahwe aliamuru
  rationale: Kitenzi “aliamuru” kinahifadhi mamlaka ya צִוָּה na uhusiano wake na “amri”; jina la agano יְהוָה limetoholewa kama “Yahwe.”
- source_word: בְּיַד מֹשֶׁה
  choice: kupitia Musa
  rationale: Nahau ya Kiebrania, kihalisi “kwa mkono wa Musa,” hapa huonyesha uwakala; “kupitia Musa” ni ya asili na inaonyesha Musa kama mpatanishi wa ujumbe.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: kwa wana wa Israeli
  rationale: “Wana wa Israeli” inadumisha usemi wa agano wa Kiebrania בְּנֵי יִשְׂרָאֵל, unaowarejelea watu wa Israeli kwa pamoja.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: katika nchi tambarare za Moabu
  rationale: עַרְבֹת hurejelea uwanda au nyika tambarare; “nchi tambarare za Moabu” ni wazi na ya kijiografia.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: kando ya Yordani, mkabala na Yeriko
  rationale: עַל inaonyesha eneo kando ya Yordani, na יְרֵחוֹ hutambulisha mahali kwa kulihusianisha na Yeriko; “mkabala na Yeriko” huweka wazi kuwa kambi ilikuwa upande wa Moabu, ng’ambo ya mto kutoka Yeriko.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko lina jina binafsi la Mungu, tetragramatoni יְהוָה. “Yahwe” hulitohowa badala ya kulibadilisha kuwa cheo, bila kuingiza fasiri ya kimadhehebu.
- issue: Maana ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Uchaguzi huu unahifadhi usemi wa agano wa chanzo. Katika muktadha huu unawahusu watu wa Israeli kwa pamoja, si wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa msomaji wa kawaida. Sentensi inahifadhi sauti ya kisheria ya fomula ya hitimisho, lakini inaepuka tafsiri ya neno kwa neno isiyo ya kawaida kama “kwa mkono wa Musa.”
