    rationale: Kifungu cha Kiebrania kinaelekeza kwenye kabila ambalo wanawake watahusishwa nalo kwa ndoa. "Kabila la waume zao" hueleza uhusiano huo kwa kawaida bila kubadili hoja ya kifungu.
  - severity: low
