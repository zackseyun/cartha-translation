revisions:
- from: Na kama wataolewa na wanaume wa mojawapo ya makabila ya wana wa Israeli, urithi wao utaondolewa katika urithi wa baba zetu na kuongezwa katika urithi wa kabila watakalokuwa sehemu yake; hivyo utapunguzwa kutoka katika sehemu tuliyopewa kwa kura.[a]
  to: Na kama wataolewa na mmoja wa wana wa makabila ya wana wa Israeli, urithi wao utaondolewa kutoka katika urithi wa baba zetu na kuongezwa kwenye urithi wa kabila la waume zao; na fungu la urithi wetu lililogawiwa kwa kura litapunguzwa.[a]
