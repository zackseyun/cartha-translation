  source_fidelity: Rasimu inafuata kwa jumla hoja ya Kiebrania kuhusu urithi kuhamishwa kwa sababu ya ndoa. Hata hivyo, "wanaume wa mojawapo ya makabila" hubadilisha muundo wa "mmoja wa wana wa makabila," na "watakalokuwa sehemu yake" haisemi kwa usahihi kwamba wanawake hao watahusishwa na kabila hilo kwa ndoa. Mwisho wa sentensi pia unahitaji kurejelea kwa wazi fungu la urithi lililogawiwa kwa kura.
  naturalness: Kiswahili kinaeleweka, lakini "wanaume wa mojawapo ya makabila" si usemi laini katika muktadha huu, na "kupiga kura" katika tanbihi huelekea kueleweka kama upigaji kura wa kisasa badala ya upangaji kwa kura/lot. Toleo lililorekebishwa linabaki la kisasa na la heshima.
