  text: וְ֠/הָיוּ לְ/אֶחָ֞ד מִ/בְּנֵ֨י שִׁבְטֵ֥י בְנֵֽי יִשְׂרָאֵל֮ לְ/נָשִׁים֒ וְ/נִגְרְעָ֤ה נַחֲלָתָ/ן֙ מִ/נַּחֲלַ֣ת אֲבֹתֵ֔י/נוּ וְ/נוֹסַ֕ף עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִ/גֹּרַ֥ל נַחֲלָתֵ֖/נוּ יִגָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/003.yaml
  text: And if they become wives to one of the sons of the tribes of the sons of Israel[a], then their inheritance will be taken away from the inheritance of our fathers and added to the inheritance of the tribe to which they belong, and it will be taken away from the allotted portion of our inheritance.
translation:
  language: sw
  text: Na kama wataolewa na mmoja wa wana wa makabila ya wana wa Israeli, urithi wao utaondolewa kutoka katika urithi wa baba zetu na kuongezwa kwenye urithi wa kabila la waume zao; na fungu la urithi wetu lililogawiwa kwa kura litapunguzwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “kutoka katika kura ya urithi wetu.” “Kura” hapa inamaanisha fungu la ardhi lililogawiwa kwa njia ya kura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ ... לְנָשִׁים
  choice: kama wataolewa
  rationale: Ingawa muundo wa Kiebrania ni ‘na watakuwa wake,’ muktadha unaendeleza hali ya uwezekano; Kiswahili cha kawaida huieleza kwa ‘kama wataolewa.’
- source_word: לְאֶחָד מִבְּנֵי שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: na wanaume wa mojawapo ya makabila ya wana wa Israeli
  rationale: ‘Wanaume’ huweka wazi kwamba מדובר kuhusu wale watakaowa bila kufanya Kiswahili kuwa kigumu, huku ‘wana wa Israeli’ ikihifadhi usemi wa ukoo wa chanzo.
- source_word: וְנִגְרְעָה
  choice: utaondolewa
  rationale: Neno hili hapa linaonyesha kupotea kwa urithi kutoka fungu la kabila moja, si kupungua tu kwa kiwango kisichojulikana.
- source_word: נַחֲלָתָן
  choice: urithi wao
  rationale: ‘Urithi’ ni neno la kawaida na sahihi kwa mali ya ardhi inayorithiwa katika muktadha huu.
- source_word: מִנַּחֲלַת אֲבֹתֵינוּ
  choice: katika urithi wa baba zetu
  rationale: Huhifadhi msisitizo wa chanzo juu ya mwendelezo wa urithi wa kifamilia na kikabila.
- source_word: וְנוֹסַף עַל נַחֲלַת הַמַּטֶּה
  choice: na kuongezwa katika urithi wa kabila
  rationale: Hueleza wazi uhamisho wa fungu la ardhi kwenda kwenye milki ya kabila jingine.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: watakalokuwa sehemu yake
  rationale: Kifungu kinarejelea uhusiano wao mpya wa kikabila baada ya ndoa; tafsiri hii ni ya kawaida bila kuongeza maelezo yasiyokuwapo.
- source_word: וּמִגֹּרַל נַחֲלָתֵנוּ יִגָּרֵעַ
  choice: hivyo utapunguzwa kutoka katika sehemu tuliyopewa kwa kura
  rationale: ‘Sehemu tuliyopewa kwa kura’ hutoa maana ya גּוֹרָל katika ugawaji wa ardhi, huku ‘utapunguzwa’ ikihifadhi mwangwi wa mzizi גרע uliotumiwa tena.
