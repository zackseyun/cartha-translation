  text: מִֽ/מִּשְׁפְּחֹ֛ת בְּנֵֽי מְנַשֶּׁ֥ה בֶן יוֹסֵ֖ף הָי֣וּ לְ/נָשִׁ֑ים וַ/תְּהִי֙ נַחֲלָתָ֔/ן עַל מַטֵּ֖ה מִשְׁפַּ֥חַת אֲבִי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/012.yaml
  text: They became wives to the clans of the sons of Manasseh son of Joseph[a], and their inheritance remained with the tribe of the clan of their father.
translation:
  language: sw
  text: Waliolewa na wanaume kutoka koo za wazao wa Manase mwana wa Yosefu,[a] na urithi wao ukabaki katika kabila la ukoo wa baba yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawa wake katika koo za wazao wa Manase mwana wa Yosefu.” Kiebrania kinaweza kuelezwa kwa kuzingatia ama kwamba waume walitoka katika koo hizo ama kwamba wanawake waliingia katika koo hizo kwa ndoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמִּשְׁפְּחֹת
  choice: kutoka koo za
  rationale: Kihusishi מִן kwa kawaida huonyesha chanzo au miongoni mwa kundi fulani; hapa kinaonyesha kwamba waume walitoka ndani ya koo za Manase. Neno “koo” linafaa kwa muundo wa kijamii wa Israeli kuliko “familia.”
- source_word: בְּנֵי מְנַשֶּׁה בֶן יוֹסֵף
  choice: wazao wa Manase mwana wa Yosefu
  rationale: Katika muktadha wa kikabila, בְּנֵי humaanisha wazao, si wana wa moja kwa moja pekee. “Manase mwana wa Yosefu” huhifadhi uhusiano wa nasaba.
- source_word: הָיוּ לְנָשִׁים
  choice: waliolewa na wanaume
  rationale: Kirai hiki kihalisi ni “wakawa wake.” Kiswahili cha kawaida na wazi hutumia “waliolewa”; kuongezwa kwa “wanaume” hufanya uhusiano na “kutoka koo za” uwe wa asili bila kubadili kwamba wanawake ndio kiima.
- source_word: נַחֲלָתָן
  choice: urithi wao
  rationale: Katika Hesabu, נַחֲלָה humaanisha hasa mgao wa ardhi uliorithiwa ndani ya kabila; “urithi” ni neno la kawaida na linalofaa katika muktadha huu wa kisheria.
- source_word: וַתְּהִי
  choice: ukabaki
  rationale: Ingawa kitenzi kimsingi ni “ukawa/ulikuwa,” hoja ya kifungu ni kwamba urithi haukuhamia kabila jingine baada ya ndoa; “ukabaki” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: עַל מַטֵּה
  choice: katika kabila la
  rationale: מַטֶּה hapa ni kabila, si fimbo. Katika muktadha wa mgao wa ardhi, עַל huonyesha kwamba urithi uliendelea kuhusishwa na kabila hilo; “katika kabila la” ni usemi wa asili wa Kiswahili.
- source_word: מִשְׁפַּחַת אֲבִיהֶן
  choice: ukoo wa baba yao
  rationale: Mnyororo huu wa umilikaji unaonyesha ukoo wa upande wa baba. Umoja wa “baba” umehifadhiwa, huku usemi ukieleweka kwa pamoja kuhusu mabinti hao.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Koo” na “kabila” zimetofautishwa ili kuonyesha ngazi za muundo wa kijamii wa Israeli. Alama ya tanbihi [a] imewekwa baada ya “Yosefu” ili kuhifadhi uwezekano wa namna nyingine ya kueleza uhusiano wa ndoa na koo.
