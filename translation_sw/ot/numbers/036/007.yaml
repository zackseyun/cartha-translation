base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/007.yaml
  text: So no inheritance of the sons of Israel shall pass from tribe to tribe[a], for the sons of Israel shall each hold fast to the inheritance of the tribe of his fathers.
translation:
  language: sw
  text: Kwa hiyo, urithi wa wana wa Israeli usihame kutoka kabila moja kwenda kabila jingine, kwa maana kila mmoja wa wana wa Israeli atashikamana na urithi wa kabila la mababu zake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִסֹּב
  choice: usihame
  rationale: Katika muktadha huu kitenzi kinaeleza urithi kubadili uhusiano wake wa kikabila, si kugeuka kimwili. ‘Usihame’ ni Kiswahili cha kawaida kinachowasilisha wazo la kuhamishwa kutoka kabila moja kwenda jingine.
- source_word: נַחֲלָה
  choice: urithi
  rationale: Hili ni neno la kawaida la kisheria kwa mali au ardhi iliyorithiwa na kugawiwa katika muundo wa makabila ya Israeli.
- source_word: מַטֶּה ... אֶל מַטֶּה
  choice: kutoka kabila moja kwenda kabila jingine
  rationale: מַטֶּה hapa humaanisha ‘kabila,’ si ‘fimbo’; muundo huu ni wa asili na wazi katika Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi rasmi wa Kiebrania na lugha yake ya ukoo wa kiume katika agizo hili la kisheria.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya katazo kwa mtindo wa kisheria unaosomeka kwa urahisi.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: Huwasilisha matumizi ya kugawa wajibu kwa kila mtu mmoja mmoja bila kulazimisha Kiswahili kisicho cha kawaida.
- source_word: יִדְבְּקוּ
  choice: atashikamana na
  rationale: Kitenzi דבק huonyesha kushikilia au kuambatana kwa uthabiti; ‘atashikamana na’ huhifadhi nguvu hiyo katika Kiswahili cha sasa.
- source_word: בְּנַחֲלַת מַטֵּה אֲבֹתָיו
  choice: na urithi wa kabila la mababu zake
  rationale: Hueleza kwa karibu na kwa uwazi sehemu ya urithi inayohusishwa na kabila la ukoo wa baba.
theological_decisions:
- issue: Lugha ya kijinsia na ya ukoo katika kauli ya kisheria kwa jumuiya
  choice: wana wa Israeli ... kila mmoja ... mababu zake
  alternative: Waisraeli ... kila mtu ... mababu zake
  rationale: Kiebrania kinatumia maneno ya kiume na ya ukoo (בני, איש, אבתיו). Tafsiri inadumisha sura hiyo ya nasaba huku ikitafsiri אִישׁ kwa maana yake ya ugawaji, ‘kila mmoja,’ ili kupata Kiswahili cha kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa sheria ya Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa katazo ‘usihame’ umefuatwa na sababu yake, na lugha ya ukoo imehifadhiwa bila kuongeza ufafanuzi wa kimadhehebu.
