base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/004.yaml
  text: And when the Jubilee comes for the sons of Israel[a], their inheritance will be added to the inheritance of the tribe to which they belong, and their inheritance will be taken away from the inheritance of the tribe of our fathers.
translation:
  language: sw
  text: Na ikiwa Mwaka wa Yubile utakapowadia kwa wana wa Israeli[a], urithi wao utaongezwa kwenye urithi wa kabila watakalokuwa wa kwake, na urithi wao utaondolewa katika urithi wa kabila la baba zetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli”; kwa tafsiri ya karibu, Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Na ikiwa ... utakapowadia
  rationale: Muundo wa Kiebrania ni wa sharti, ingawa katika hoja hii ya kisheria tukio hilo linatazamiwa kutokea. Kiswahili hiki kinahifadhi maana ya msingi ya ‘ikiwa’ huku ‘utakapowadia’ kikionyesha tukio la wakati ujao.
- source_word: יִהְיֶה הַיֹּבֵל
  choice: Mwaka wa Yubile utakapowadia
  rationale: יוֹבֵל ni kipindi maalumu cha kisheria kinachojulikana kama Yubile; kutaja ‘Mwaka’ kunafanya rejeo la kalenda lieleweke kwa kawaida katika Kiswahili.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kwa wana wa Israeli
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania, ‘wana wa Israeli,’ badala ya kuubadili moja kwa moja kuwa jina la jumla ‘Waisraeli.’
- source_word: וְנוֹסְפָה נַחֲלָתָן
  choice: urithi wa wanawake hao utaongezwa
  rationale: Kitenzi cha Kiebrania ni cha kutendwa na kinamaanisha urithi kuunganishwa na mgao mwingine. ‘Wanawake hao’ inaweka wazi kuwa kiambishi cha wingi wa kike kinawarejelea binti wanaozungumziwa.
- source_word: עַל נַחֲלַת הַמַּטֶּה
  choice: kwenye urithi wa kabila
  rationale: עַל pamoja na יסף hapa inaonyesha kuongeza kwenye mgao mwingine; ‘kwenye’ ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: la wale watakaowaowa
  rationale: Kifungu hicho kwa muundo wa karibu ni ‘ambao watakuwa wao,’ na katika muktadha kinawahusu wanaume watakaowaoa binti hao. Tafsiri hii inaeleza uhusiano huo bila kuongeza dai la kiteolojia.
- source_word: וּמִנַּחֲלַת מַטֵּה אֲבֹתֵינוּ
  choice: katika urithi wa kabila la baba zetu
  rationale: Huhifadhi tofauti kati ya kabila litakalopokea ardhi na kabila la ukoo wa baba za wasemaji.
- source_word: יִגָּרַע
  choice: utaondolewa
  rationale: Niphal ya גרע hapa inaeleza kupunguzwa kwa mgao kwa kuondoa urithi huo kutoka kabila moja kwenda jingine.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. ‘Yubile’ limetumiwa kama istilahi ya kibiblia iliyozoeleka, huku ‘Mwaka’ ikifafanua kuwa hapa ni tukio la kalenda. Muundo wa sharti wa וְאִם umehifadhiwa badala ya kugeuzwa kabisa kuwa ‘wakati.’
