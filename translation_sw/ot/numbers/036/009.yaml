  text: וְ/לֹֽא תִסֹּ֧ב נַחֲלָ֛ה מִ/מַּטֶּ֖ה לְ/מַטֶּ֣ה אַחֵ֑ר כִּי אִישׁ֙ בְּ/נַ֣חֲלָת֔/וֹ יִדְבְּק֕וּ מַטּ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/009.yaml
  text: No inheritance shall pass from one tribe to another tribe[a], for each of the tribes of the sons of Israel shall hold fast to its own inheritance.
translation:
  language: sw
  text: Wala urithi hautapita kutoka kabila moja kwenda kabila lingine, kwa maana kila kabila la wana wa Israeli litashikamana na urithi wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִסֹּב
  choice: hautapita
  rationale: Katika muktadha huu wa sheria ya ardhi, kitenzi hiki kinaonyesha urithi kubadili umiliki wa kikabila; “hautapita” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: נַחֲלָה
  choice: urithi
  rationale: Neno hili linamaanisha ardhi ya urithi iliyogawiwa ndani ya mfumo wa makabila ya Israeli; “urithi” ni sahihi na linaeleweka kwa urahisi.
- source_word: מִמַּטֶּה לְמַטֶּה אַחֵר
  choice: kutoka kabila moja kwenda kabila lingine
  rationale: Ingawa מַטֶּה pia linaweza kumaanisha fimbo, hapa linarejelea kabila. Kauli hii inaweka wazi uhamisho kutoka kabila moja hadi jingine.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa neno hili linatanguliza sababu ya katazo lililotangulia.
- source_word: אִישׁ
  choice: kila
  rationale: Neno la umoja limetumiwa kwa maana ya kugawa mmoja mmoja; katika sentensi hii linahusishwa na kila kabila.
- source_word: בְּנַחֲלָתוֹ
  choice: na urithi wake
  rationale: Likifuatana na דבק, kirai hiki huonyesha kushikamana na urithi ulio wake.
- source_word: יִדְבְּקוּ
  choice: litashikamana
  rationale: Kitenzi דבק kina maana ya kung’ang’ania au kushikamana. Umoja wa Kiswahili unafuata kirai “kila kabila,” huku maana ya makabila yote ikibaki wazi.
- source_word: מַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: kila kabila la wana wa Israeli
  rationale: Tafsiri hii huhifadhi “wana wa Israeli” ya Kiebrania na kutoa muundo wa Kiswahili ulio wa kawaida na unaoeleweka.
theological_decisions:
- issue: Usemi wa agano wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: Kiebrania kinasema kihalisi “wana wa Israeli.” Tafsiri imehifadhi usemi huo wa jadi bila kuzuia maana yake ya pamoja inayowahusu watu wa Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini cha kawaida kwa msomaji wa leo. “Wala” huunganisha mstari huu na katazo la muktadha uliotangulia; muundo wa umoja “kila kabila ... litashikamana ... wake” ni wa asili katika Kiswahili.
