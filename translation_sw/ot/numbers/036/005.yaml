source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל עַל פִּ֥י יְהוָ֖ה לֵ/אמֹ֑ר כֵּ֛ן מַטֵּ֥ה בְנֵֽי יוֹסֵ֖ף דֹּבְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/005.yaml
  text: So Moses commanded the sons of Israel according to the word of Yahweh, saying, “The tribe of the sons of Joseph is speaking rightly.”
translation:
  language: sw
  text: Basi Musa akawaamuru wana wa Israeli kulingana na neno la Yahwe[a], akisema, “Kabila la wana wa Yosefu linasema yaliyo sawa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kwa kinywa cha Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Kabila la wana wa Yosefu liko sahihi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: akawaamuru
  rationale: Kitenzi צוה kinaonyesha kutoa amri yenye mamlaka; “akawaamuru” kinahifadhi nguvu hiyo na mfuatano wa simulizi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili linahifadhi wazi usemi wa Kiebrania wa undugu na ukoo, huku likieleweka katika Kiswahili cha kibiblia chenye hadhi.
- source_word: עַל פִּי יְהוָה
  choice: kulingana na neno la Yahwe
  rationale: Usemi huu una maana halisi ya “kwa kinywa cha Yahwe,” lakini hapa unaonyesha kwamba amri ya Musa ilitolewa kwa mamlaka ya neno la Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina la agano lililo katika matini ya Kiebrania.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha maneno ya moja kwa moja na kudumisha muundo wa chanzo bila kufanya Kiswahili kuwa kigumu.
- source_word: מַטֵּה
  choice: kabila
  rationale: Katika muktadha wa urithi na makabila, מַטֶּה humaanisha “kabila,” si fimbo.
- source_word: בְנֵי יוֹסֵף
  choice: wana wa Yosefu
  rationale: Huhifadhi usemi wa ukoo wa Kiebrania na kuulinganisha na “wana wa Israeli” mapema katika mstari.
- source_word: כֵּן ... דֹּבְרִים
  choice: linasema yaliyo sawa
  rationale: Tafsiri hii inahifadhi wazo la kusema lililo katika דֹּבְרִים na tathmini ya כֵּן kwamba madai yao ni sahihi, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ina jina maalumu la Mungu, si cheo; “Yahwe” hulihifadhi moja kwa moja bila kulibadilisha kuwa “BWANA.”
- issue: Iwapo kauli ya Musa inasifu maneno yao au hali yao kwa ujumla
  choice: linasema yaliyo sawa
  alternative: liko sahihi
  rationale: Kishirikishi דֹּבְרִים hutaja tendo la kusema, ingawa katika muktadha kauli pana “liko sahihi” inaweza kutoa maana ileile. Tafsiri iliyochaguliwa inahifadhi uhusiano huo wa kileksia bila kuondoa maana ya tathmini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Wana wa Israeli” na “wana wa Yosefu” zimehifadhiwa kwa uwazi wa ukoo; “linasema yaliyo sawa” ni ya asili vya kutosha huku ikihifadhi tendo la kusema katika chanzo.
