  text: זֶ֣ה הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יְהוָ֗ה לִ/בְנ֤וֹת צְלָפְחָד֙ לֵ/אמֹ֔ר לַ/טּ֥וֹב בְּ/עֵינֵי/הֶ֖ם תִּהְיֶ֣ינָה לְ/נָשִׁ֑ים אַ֗ךְ לְ/מִשְׁפַּ֛חַת מַטֵּ֥ה אֲבִי/הֶ֖ם תִּהְיֶ֥ינָה לְ/נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/006.yaml
  text: This is the word that Yahweh has commanded concerning the daughters of Zelophehad[a], saying, ‘Let them become wives to whomever seems good in their eyes[b]; only they must become wives within the family of the tribe of their father.’
translation:
  language: sw
  text: Hili ndilo neno ambalo Yahweh ameamuru kuhusu binti za Selofehadi, akisema, “Waolewe na yeyote wanayemwona kuwa anafaa[a]; ila ni lazima waolewe ndani ya ukoo wa kabila la baba yao[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kwa aliye mwema machoni pao”; yaani, na yeyote wanayemwona kuwa anafaa.
    reason: lexical_alternative
  - marker: b
    text: Au, “ndani ya jamaa ya kabila la baba yao.” Kiebrania kinaunganisha maneno ya ukoo au jamaa na kabila ili kusisitiza kwamba urithi ubaki katika mstari wa kabila la upande wa baba.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: Hili ndilo neno
  rationale: דָּבָר inaweza kumaanisha neno, jambo, au suala. Hapa inaanzisha agizo rasmi la Mungu, hivyo “neno” linadumisha uzito wake wa kimamlaka.
- source_word: צִוָּה יְהוָה
  choice: Yahweh ameamuru
  rationale: צוה humaanisha kuamuru. Wakati timilifu umetafsiriwa kwa “ameamuru” kwa kuwa agizo hilo bado lina nguvu katika muktadha huu; jina la agano יְהוָה limeandikwa Yahweh.
- source_word: לִבְנוֹת צְלָפְחָד
  choice: kuhusu binti za Selofehadi
  rationale: Kiambishi ל hapa kinaonyesha wale ambao agizo linawahusu, si lazima walengwa wa moja kwa moja wa hotuba.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hiki ni kitangulizi cha kawaida cha maneno yanayonukuliwa, na “akisema” ni wazi na cha asili katika Kiswahili.
- source_word: לַטּוֹב בְּעֵינֵיהֶם
  choice: na yeyote anayewapendeza
  rationale: Nahau ya Kiebrania ina maana ya mtu anayeonekana kuwa mzuri au anayekubalika kwao. Tafsiri hii ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi taswira halisi ya “macho yao.”
- source_word: תִּהְיֶינָה לְנָשִׁים
  choice: Waolewe
  rationale: Kihalisi ni “wawe wake.” Katika Kiswahili, “waolewe” hueleza kwa kawaida na kwa usahihi kuingia kwao katika ndoa bila kuongeza wazo lisilokuwapo katika chanzo.
- source_word: אַךְ
  choice: lakini
  rationale: אַךְ inaweka sharti linalozuia uhuru uliotangulia. “Lakini” linaonyesha wazi ugeuko huo, huku “ni lazima” likibainisha nguvu ya sharti.
- source_word: לְמִשְׁפַּחַת מַטֵּה אֲבִיהֶם
  choice: ndani ya ukoo wa kabila la baba yao
  rationale: Kirai kinaunganisha istilahi ya ukoo na ya kabila ili kusisitiza kwamba ndoa iwe ndani ya mstari wa kabila la upande wa baba.
- source_word: תִּהְיֶינָה לְנָשִׁים
  choice: ni lazima waolewe
  rationale: Katika urudio wa pili, kirai hicho kina nguvu ya wajibu chini ya sharti lililowekwa; “ni lazima” huonyesha nguvu hiyo kwa uwazi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יְהוָה. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Waolewe” ni ya kawaida zaidi kuliko tafsiri halisi “wawe wake,” na alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
