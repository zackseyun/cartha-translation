  yaml_path: translation/ot/numbers/029/034.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offering.
translation:
  language: sw
  text: na beberu mmoja kwa ajili ya sadaka ya dhambi, zaidi ya sadaka ya kawaida ya kuteketezwa[a], pamoja na sadaka yake ya nafaka na sadaka yake ya kinywaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ya kawaida” hapa hutafsiri neno la Kiebrania linalomaanisha sadaka inayotolewa daima au kwa utaratibu unaorudiwa; pia linaweza kutafsiriwa “ya kudumu” au, katika muktadha huu, “ya kila siku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: na beberu mmoja
  rationale: שׂעיר humaanisha mbuzi dume, na אֶחָד huonyesha idadi moja; “beberu mmoja” ni Kiswahili cha kawaida na sahihi katika muktadha wa dhabihu.
- source_word: חַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Katika muktadha wa ibada, neno hili linataja sadaka maalumu ya dhambi, si dhambi kwa ujumla.
- source_word: מִ/לְּ/בַד
  choice: zaidi ya
  rationale: Kirai hiki kinaonyesha kwamba sadaka hiyo ilitolewa pamoja na, wala si badala ya, sadaka ya kawaida.
- source_word: עֹלַת
  choice: sadaka ... ya kuteketezwa
  rationale: Hili ni neno la kawaida la dhabihu inayoteketezwa; tafsiri hii inaeleweka na kudumisha maana ya kiibada.
- source_word: הַ/תָּמִיד
  choice: ya kawaida
  rationale: תמיד hapa hueleza sadaka inayotolewa kwa utaratibu unaoendelea. “Ya kawaida” hudokeza kurudiwa kwake bila kuibana kimakusudi kuwa “ya kila siku.”
- source_word: מִנְחָתָ/הּ
  choice: pamoja na sadaka yake ya nafaka
  rationale: Katika orodha za dhabihu, מנחה ni sadaka ya nafaka inayoandamana na sadaka ya kuteketezwa; kiambishi cha umilikaji kinarejelea sadaka hiyo.
- source_word: וְ/נִסְכָּ/הּ
  choice: na sadaka yake ya kinywaji
  rationale: נסך ni kinywaji kinachomiminwa kama sadaka; “sadaka ya kinywaji” ni wazi kuliko istilahi ya kitaalamu kama “libationi.”
