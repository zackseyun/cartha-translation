  text: and one goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: sw
  text: na mbuzi mmoja kwa sadaka ya dhambi[a], mbali na sadaka ya kuteketezwa ya kawaida[b], sadaka yake ya nafaka na sadaka yake ya kinywaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbuzi dume mmoja kwa sadaka ya dhambi.” Neno la Kiebrania שׂעיר linaweza kumaanisha hasa mbuzi dume katika muktadha wa dhabihu.
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka ya kuteketezwa ya kudumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: na mbuzi mmoja
  rationale: שׂעיר humaanisha mbuzi na katika muktadha wa dhabihu mara nyingi humaanisha hasa mbuzi dume. ‘Mbuzi’ ni lugha ya kawaida na inayoeleweka, huku אֶחָד ikitafsiriwa pamoja nayo kuwa ‘mmoja.’
- source_word: חַטָּאת
  choice: kuwa sadaka ya dhambi
  rationale: Katika muktadha wa dhabihu, חַטָּאת humaanisha sadaka inayotolewa kwa ajili ya dhambi, si dhambi yenyewe tu.
- source_word: אֶחָד
  choice: mmoja
  rationale: Ni nambari inayoonyesha idadi ya mnyama wa dhabihu.
- source_word: מִ/לְּ/בַד
  choice: pamoja na
  rationale: Hapa neno hili linaonyesha kwamba sadaka hiyo inaongezwa kwa sadaka ya kawaida iliyokwisha kuamriwa. ‘Pamoja na’ ni ya asili katika Kiswahili na huwasilisha uhusiano huo wazi.
- source_word: עֹלַת הַ/תָּמִיד
  choice: sadaka ya kuteketezwa ya kawaida
  rationale: עֹלָה ni sadaka ya kuteketezwa, na הַתָּמִיד huonyesha sadaka inayotolewa kwa utaratibu unaoendelea. ‘Ya kawaida’ huonyesha kwamba ni sadaka iliyowekwa kutolewa mara kwa mara.
- source_word: וּ/מִנְחָתָ/הּ
  choice: sadaka yake ya nafaka
  rationale: Katika muktadha wa kikuhani, מִנְחָה ni sadaka ya nafaka. Kiambishi cha nafsi ya tatu ya kike kinarejelea sadaka ya kuteketezwa.
- source_word: וְ/נִסְכָּ/הּ
  choice: sadaka yake ya kinywaji
  rationale: נֶסֶךְ ni sadaka ya kinywaji inayoambatana na dhabihu. Kiambishi chake kinarejelea sadaka ya kuteketezwa.
