  text: וַ/עֲשִׂיתֶ֨ם עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/002.yaml
  text: 'And you shall offer a burnt offering as a pleasing aroma to Yahweh: one bull from the herd[a], one ram, and seven male lambs a year old, without blemish.'
translation:
  language: sw
  text: 'Nanyi mtamtolea Yahwe sadaka ya kuteketezwa yenye harufu ya kumpendeza[a]: fahali mmoja kutoka kundini, kondoo dume mmoja, na wanakondoo dume saba wa mwaka mmoja, wote wasio na dosari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “harufu ya kutuliza” au “harufu tamu.” Kauli hii ya kawaida katika ibada za dhabihu inaonyesha kuwa sadaka hiyo inakubaliwa na Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: mtamtolea
  rationale: Ingawa kitenzi hiki kimsingi humaanisha ‘kufanya,’ kinapotumiwa pamoja na sadaka humaanisha kuitoa au kuiwasilisha. ‘Mtamtolea’ ni Kiswahili cha kawaida na kinaonyesha pia kwamba sadaka inaelekezwa kwa Yahwe.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni istilahi ya sadaka iliyoteketezwa yote madhabahuni na kupanda kwa moshi; tafsiri hii ni wazi na imezoeleka katika Kiswahili cha Biblia.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: iwe harufu ya kumpendeza
  rationale: Hii ni kauli maalumu ya ibada inayoonyesha kuwa sadaka inakubaliwa na Mungu. Tafsiri hii inadumisha taswira ya harufu bila kuifanya ionekane kuwa inahusu tu starehe ya kunusa.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: fahali mmoja kutoka kundini
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya nahau ya Kiebrania ‘fahali mmoja, mwana wa ng’ombe,’ huku ikihifadhi aina na idadi ya mnyama.
- source_word: אַיִל אֶחָד
  choice: kondoo dume mmoja
  rationale: אַיִל katika orodha za dhabihu humaanisha kondoo dume.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: wanakondoo dume saba wa mwaka mmoja
  rationale: Muundo huu unaonyesha wanakondoo saba wa kiume wenye umri wa mwaka mmoja; tafsiri inaweka wazi jinsia, idadi, na umri.
- source_word: תְּמִימִם
  choice: wote wasio na dosari
  rationale: Katika sheria za dhabihu neno hili humaanisha kutokuwa na kasoro ya kimwili. ‘Wote’ linaonyesha wazi kuwa sifa hiyo inawahusu wanakondoo wote saba.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la agano יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kauli ya dhabihu לְרֵיחַ נִיחֹחַ
  choice: harufu ya kumpendeza
  alternative: harufu ya kutuliza
  rationale: Kauli hiyo inaonyesha sadaka inayokubalika kwa Mungu. Tafsiri inahifadhi taswira halisi ya harufu bila kudai kwamba sadaka humtuliza Mungu kutoka katika hasira, jambo ambalo mstari huu haulielezi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa orodha na maelezo ya wanyama umehifadhiwa kwa uwazi.
