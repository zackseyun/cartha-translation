base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/028.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: sw
  text: na mbuzi dume mmoja kwa sadaka ya dhambi, mbali na sadaka ya kuteketezwa ya kawaida[a], na sadaka yake ya nafaka na sadaka yake ya kinywaji[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya kuteketezwa ya daima.”
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka yake ya kumiminwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: na mbuzi dume mmoja
  rationale: שָׂעִיר humaanisha mbuzi dume; kiunganishi וּ kinaendeleza orodha ya sadaka, na אֶחָד hutaja idadi moja waziwazi.
- source_word: חַטָּאת
  choice: kwa sadaka ya dhambi
  rationale: Katika muktadha wa dhabihu, neno hili hutaja aina ya sadaka, si dhambi kwa maana ya jumla.
- source_word: מִ/לְּ/בַד
  choice: zaidi ya
  rationale: Kirai hiki kinaonyesha kuwa sadaka iliyotajwa inaongezwa kwa sadaka ya kawaida, wala haichukui nafasi yake.
- source_word: עֹלַת הַ/תָּמִיד
  choice: sadaka ya kuteketezwa ya kawaida
  rationale: עֹלָה ni sadaka inayoteketezwa, na תָּמִיד hapa hueleza sadaka inayotolewa kwa utaratibu unaoendelea; ‘ya kawaida’ ni lugha ya sasa isiyobainisha ‘kila siku’ zaidi ya Kiebrania.
- source_word: וּ/מִנְחָתָ/הּ
  choice: pamoja na sadaka yake ya nafaka
  rationale: Katika orodha za kikuhani, מִנְחָה ni sadaka ya nafaka inayoandamana na sadaka ya kuteketezwa; kiambishi cha nafsi ya tatu umoja wa kike kinarejelea sadaka hiyo.
- source_word: וְ/נִסְכָּ/הּ
  choice: na sadaka yake ya kinywaji
  rationale: נֶסֶךְ ni sadaka ya kioevu inayomiminwa; ‘sadaka ya kinywaji’ ni istilahi ya wazi na inayofahamika, huku kiambishi chake kikirejelea sadaka ya kuteketezwa.
theological_decisions:
- issue: Maana ya חַטָּאת katika mfumo wa dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno linaweza kusisitiza kushughulikiwa kwa dhambi au matokeo yake ya unajisi. ‘Sadaka ya dhambi’ huhifadhi uhusiano wake wa wazi na dhambi na ni istilahi iliyozoeleka, bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha ya dhabihu umehifadhiwa, huku ‘mbuzi dume’ ikitumika kwa uwazi zaidi kuliko istilahi yenye uwezekano wa kutofahamika kwa wasomaji wote.
