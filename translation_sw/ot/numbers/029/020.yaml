lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁלִישִׁי
  choice: Na siku ya tatu
  rationale: Muundo huu unadumisha kiunganishi cha Kiebrania kinachoendeleza mfululizo wa sadaka, huku ukitumia Kiswahili cha kawaida.
- source_word: פָּרִים עַשְׁתֵּי עָשָׂר
  choice: mafahali kumi na mmoja
  rationale: Katika muktadha wa sadaka, פָּרִים humaanisha ng’ombe dume; “mafahali” ni neno wazi na la kawaida bila kuongeza wazo la kwamba walikuwa wachanga.
- source_word: אֵילִם שְׁנָיִם
  choice: kondoo dume wawili
  rationale: אֵילִם ni kondoo wa kiume waliokomaa; “kondoo dume” ni tafsiri ya moja kwa moja na inayoeleweka kwa urahisi.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: wana-kondoo wa mwaka mmoja kumi na wanne
  rationale: בְּנֵי שָׁנָה ni nahau ya Kiebrania inayotaja wanyama wenye umri wa mwaka mmoja; mpangilio huu ni wa asili katika Kiswahili.
- source_word: תְּמִימִם
  choice: wasio na dosari
  rationale: Katika sheria za sadaka, neno hili humaanisha wanyama wasio na kasoro inayowafanya wasifae kutolewa dhabihu; “wasio na dosari” linaeleza maana hiyo bila kudokeza ukamilifu wa kimaadili.
theological_decisions:
- issue: Uhusiano wa תְּמִימִם na orodha ya wanyama
  choice: Kuweka “wasio na dosari” mwishoni kama ilivyo katika Kiebrania, bila kuongeza “wote”
  alternative: “wote wakiwa hawana dosari”
  rationale: Kivumishi kiko mwishoni mwa orodha na kwa karibu zaidi kinafuata wana-kondoo, ingawa katika muktadha wa sadaka sharti hilo linaweza kueleweka kuhusu wanyama wote. Kutotumia “wote” kunahifadhi kiwango cha ubainifu wa muundo wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha na uratibu wa Kiebrania umehifadhiwa bila kufanya sentensi kuwa ngumu.
