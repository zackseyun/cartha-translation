base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/020.yaml
  text: 'And on the third day: eleven bulls[a], two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: sw
  text: 'Na siku ya tatu: mafahali kumi na mmoja, kondoo dume wawili, na wana-kondoo wa mwaka mmoja kumi na wanne, wasio na dosari[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamilifu.” Katika muktadha wa sadaka, neno la Kiebrania humaanisha wanyama wasio na kasoro.
