base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/039.yaml
  text: These you shall offer to Yahweh at your appointed times[a], besides your vow offerings and your freewill offerings, for your burnt offerings and for your grain offerings and for your drink offerings and for your peace offerings.
translation:
  language: sw
  text: 'Hizi ndizo sadaka mtakazomtolea Yahweh katika nyakati zenu zilizowekwa, mbali na sadaka zenu za nadhiri na sadaka zenu za hiari: sadaka zenu za kuteketezwa, sadaka zenu za nafaka, sadaka zenu za kinywaji, na sadaka zenu za amani.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za ushirika.” Neno la Kiebrania linataja aina ya sadaka inayohusiana na amani, ustawi, au ukamilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תַּעֲשׂוּ
  choice: Hizi ndizo sadaka mtakazomtolea
  rationale: Kitenzi תַּעֲשׂוּ kwa kawaida ni ‘mtafanya,’ lakini katika muktadha huu wa dhabihu kina maana ya kutoa sadaka. Neno ‘sadaka’ limewekwa wazi ili sentensi iwe ya kawaida na dhahiri katika Kiswahili.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יְהוָה limetafsiriwa moja kwa moja kuwa ‘Yahweh,’ na muundo ‘mtakazomtolea’ unaonyesha kwamba sadaka hizo zinaelekezwa kwake.
- source_word: בְּמוֹעֲדֵיכֶם
  choice: katika nyakati zenu zilizowekwa
  rationale: מוֹעֵד inaweza kumaanisha wakati uliowekwa au sikukuu iliyopangwa. Tafsiri hii inahifadhi upana huo bila kuibana maana kuwa sikukuu pekee.
- source_word: לְבַד
  choice: mbali na
  rationale: Inaonyesha kwamba sadaka zilizotajwa awali zilitolewa pamoja na, wala si badala ya, sadaka za nadhiri na za hiari.
- source_word: מִנִּדְרֵיכֶם
  choice: sadaka zenu za nadhiri
  rationale: Katika muktadha wa ibada, neno hili linarejelea sadaka zinazotolewa kwa kutimiza nadhiri, si maneno ya nadhiri peke yake.
- source_word: וְנִדְבֹתֵיכֶם
  choice: na sadaka zenu za hiari
  rationale: Hili ni neno la kawaida kwa sadaka inayotolewa kwa hiari, si kwa wajibu uliowekwa.
- source_word: לְעֹלֹתֵיכֶם
  choice: sadaka zenu za kuteketezwa
  rationale: עֹלָה ni sadaka inayoteketezwa; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha Biblia.
- source_word: וּלְמִנְחֹתֵיכֶם
  choice: sadaka zenu za nafaka
  rationale: Katika sheria za kikuhani, מִנְחָה hapa ni sadaka ya nafaka, si zawadi au kodi kwa maana pana.
- source_word: וּלְנִסְכֵּיכֶם
  choice: sadaka zenu za kinywaji
  rationale: נֶסֶךְ ni sadaka ya kimiminiko inayomiminwa; ‘sadaka ya kinywaji’ ni tafsiri wazi na inayofahamika.
- source_word: וּלְשַׁלְמֵיכֶם
  choice: na sadaka zenu za amani
  rationale: ‘Sadaka za amani’ huhifadhi uhusiano wa שְׁלָמִים na wazo la amani, ustawi, au ukamilifu, huku tafsiri mbadala ikiwekwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Tafsiri ya שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika
  rationale: Tafsiri iliyochaguliwa huhifadhi uhusiano wa neno hilo na amani na ustawi bila kufuta maana ya ushirika, ambayo imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Orodha ya aina za sadaka imewasilishwa kwa mtiririko wa kawaida, na alama ya tanbihi imewekwa baada ya ‘sadaka zenu za amani,’ ambako mbadala wake wa kileksika unahusika.
