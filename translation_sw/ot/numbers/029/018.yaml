  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: sw
  text: na sadaka yao ya nafaka na sadaka zao za kinywaji kwa ajili ya mafahali, kondoo dume, na wanakondoo, kwa kadiri ya idadi yao, kama ilivyoagizwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na utaratibu uliowekwa.” Neno la Kiebrania linarejelea kanuni au utaratibu uliowekwa kwa ajili ya sadaka hizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: sadaka yao ya nafaka
  rationale: Katika muktadha wa dhabihu, מִנְחָה ni sadaka ya nafaka inayoandamana na sadaka za kuteketezwa; umoja umehifadhiwa kama katika Kiebrania.
- source_word: נִסְכֵּיהֶם
  choice: sadaka zao za kinywaji
  rationale: נֶסֶךְ ni sadaka ya kimiminika inayomiminwa; usemi huu ni wazi na wa kawaida katika Kiswahili cha Biblia.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: kwa ajili ya hao mafahali, hao kondoo dume na hao wanakondoo
  rationale: Kiambishi ל kinaonyesha uhusiano wa sadaka zinazoandamana na kila kundi la wanyama; 'kwa ajili ya' huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: בְּמִסְפָּרָם
  choice: kulingana na idadi yao
  rationale: Kirai kinaonyesha kwamba kiasi cha sadaka zinazoandamana kilipangwa kulingana na idadi ya wanyama.
- source_word: כַּמִּשְׁפָּט
  choice: kama ilivyoagizwa
  rationale: מִשְׁפָּט hapa inarejelea utaratibu au kanuni iliyowekwa kwa sadaka hizi; tafsiri hii ni ya asili na huhifadhi maana ya jambo lililoamriwa.
