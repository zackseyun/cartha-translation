  terminology: '"sadaka ya nafaka," "sadaka za kinywaji," "mafaranga"—corrected below as "mafahali"—and "kondoo dume" are appropriate cultic and animal terminology. "kama ilivyoagizwa" suitably conveys the established prescribed procedure; the footnote preserves the procedural alternative.'
