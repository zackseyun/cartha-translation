lexical_decisions:
- source_word: וּ/בַ/יּוֹם הָ/רְבִיעִי
  choice: Na siku ya nne
  rationale: Muundo huu unahifadhi kiunganishi kinachoendeleza orodha ya ibada na usemi wa wakati kwa Kiswahili cha kawaida.
- source_word: פָּרִים עֲשָׂרָה
  choice: mafahali kumi
  rationale: Katika muktadha wa dhabihu, פָּרִים humaanisha mafahali; idadi ni kumi.
- source_word: אֵילִם שְׁנָיִם
  choice: kondoo dume wawili
  rationale: אֵילִם ni kondoo dume waliokomaa, na wawili ndiyo idadi inayotajwa.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: wanakondoo wa mwaka mmoja kumi na wanne
  rationale: Usemi בְּנֵי שָׁנָה unaonyesha umri wa mwaka mmoja, huku idadi ikiwa kumi na wanne.
- source_word: תְּמִימִם
  choice: wasio na dosari
  rationale: Katika sheria za dhabihu, neno hili humaanisha wanyama wasiokuwa na kasoro inayowafanya wasifae kutolewa.
