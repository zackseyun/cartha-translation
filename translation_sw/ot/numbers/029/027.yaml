base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/027.yaml
  text: along with their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: sw
  text: pamoja na sadaka yao ya nafaka na sadaka zao za kinywaji kwa ajili ya mafahali, kondoo dume na wanakondoo, kulingana na idadi yao, kwa kufuata utaratibu uliowekwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama ilivyoagizwa.” Neno la Kiebrania כַּמִּשְׁפָּט linamaanisha kanuni au utaratibu uliowekwa kwa sadaka hizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: sadaka yao ya nafaka
  rationale: Katika muktadha wa dhabihu, מִנְחָה ni sadaka ya nafaka inayoandamana na sadaka za kuteketezwa; tafsiri hii ni mahususi na inaeleweka.
- source_word: נִסְכֵּיהֶם
  choice: sadaka zao za kinywaji
  rationale: נֶסֶךְ ni sadaka ya kioevu inayomiminwa; ‘sadaka za kinywaji’ ni istilahi wazi na ya kawaida katika Kiswahili cha Biblia.
- source_word: לַפָּרִים
  choice: kwa ajili ya mafahali
  rationale: Kiambishi ל kinaonyesha kuwa sadaka zinazoandamana zimetengwa kwa kundi hili la wanyama.
- source_word: לָאֵילִם
  choice: kondoo dume
  rationale: אֵילִים ni kondoo dume; muundo huu ni wa kawaida na wa sasa katika Kiswahili sanifu.
- source_word: וְלַכְּבָשִׂים
  choice: na wanakondoo
  rationale: כְּבָשִׂים humaanisha wanakondoo katika orodha hii ya wanyama wa dhabihu.
- source_word: בְּמִסְפָּרָם
  choice: kulingana na idadi yao
  rationale: Kirai hiki kinaonyesha kuwa kiasi cha sadaka zinazoandamana kilipangwa kwa uwiano na idadi ya wanyama.
- source_word: כַּמִּשְׁפָּט
  choice: kwa kufuata utaratibu uliowekwa
  rationale: מִשְׁפָּט hapa ina maana ya kanuni au utaratibu rasmi uliowekwa kwa sadaka hizi; tafsiri hii huhifadhi maana ya kiibada na bado ni ya kawaida kwa msomaji wa sasa.
- source_word: וּ
  choice: pamoja na
  rationale: Aya hii inategemea kisarufi orodha ya dhabihu katika aya iliyotangulia; ‘pamoja na’ huonyesha wazi kuwa sadaka hizi zinaandamana na wanyama waliotajwa.
