  source_fidelity: 'Tafsiri inawakilisha kwa usahihi mfuatano wa Kiebrania: sadaka ya nafaka, sadaka za kinywaji, makundi matatu ya wanyama, uwiano kwa idadi yao, na utaratibu uliowekwa. Tofauti ya umoja katika “sadaka yao ya nafaka” na wingi katika “sadaka zao za kinywaji” pia inaendana na maandishi ya chanzo.'
