  text: שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַ֞ד חַטַּ֤את הַ/כִּפֻּרִים֙ וְ/עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/011.yaml
  text: and one male goat for a sin offering[a], besides the sin offering of atonement[b], and the regular burnt offering with its grain offering and their drink offerings.
translation:
  language: sw
  text: na mbuzi dume mmoja kuwa sadaka ya dhambi[a], mbali na sadaka ya dhambi ya upatanisho, na sadaka ya kuteketezwa inayotolewa daima[b], pamoja na sadaka yake ya nafaka na matoleo yao ya kinywaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso,” hapa na katika sehemu inayofuata yenye maneno “sadaka ya dhambi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka ya kuteketezwa ya kawaida.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: beberu wa mbuzi
  rationale: Kirai hiki humaanisha mbuzi dume; ‘beberu wa mbuzi’ ni wazi, cha asili katika Kiswahili, na huhifadhi jinsia ya mnyama wa dhabihu.
- source_word: אֶחָד
  choice: mmoja
  rationale: Namba imedumishwa ili kuonyesha idadi kamili ya mnyama anayetolewa.
- source_word: חַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika muktadha huu wa ibada, nomino hii inamaanisha sadaka, si dhambi kama dhana tu. ‘Sadaka ya dhambi’ ni istilahi inayoeleweka na iliyozoeleka; uwezekano wa ‘sadaka ya utakaso’ umeonyeshwa katika tanbihi.
- source_word: מִלְּבַד
  choice: zaidi ya
  rationale: Huonyesha kwamba sadaka hii inaongezwa kwa sadaka nyingine zilizotajwa, kwa lugha ya kawaida na wazi.
- source_word: חַטַּאת הַכִּפֻּרִים
  choice: sadaka ya dhambi ya upatanisho
  rationale: Muundo huu unaunganisha sadaka ya dhambi na tendo la upatanisho bila kuongeza kwa uwazi jina la siku ambalo halipo moja kwa moja katika kirai hiki.
- source_word: עֹלַת הַתָּמִיד
  choice: sadaka ya kuteketezwa ya kawaida
  rationale: תָּמִיד huonyesha sadaka inayotolewa kwa utaratibu unaoendelea; ‘ya kawaida’ ni ya asili na haisisitizi bila lazima kuwa ni ya kila siku.
- source_word: מִנְחָתָהּ
  choice: sadaka yake ya nafaka
  rationale: Katika orodha za dhabihu, מִנְחָה ni sadaka ya nafaka. Kiambishi cha umoja wa kike kinarejelea sadaka ya kuteketezwa.
- source_word: נִסְכֵּיהֶם
  choice: sadaka zake za kinywaji
  rationale: Wingi wa Kiebrania umehifadhiwa kwa ‘sadaka zake,’ ukirejelea sadaka husika zilizotajwa; ‘sadaka za kinywaji’ ni wazi kuliko istilahi ya kitaalamu kama ‘tambiko za kumiminwa.’
theological_decisions:
- issue: Istilahi ya kiibada חַטָּאת
  choice: sadaka ya dhambi katika sehemu zote mbili
  alternative: sadaka ya utakaso
  rationale: Neno linaweza kusisitiza kazi ya utakaso, lakini katika orodha hii ya taratibu za dhabihu ‘sadaka ya dhambi’ ni istilahi iliyozoeleka na haifichi kwamba kitu kinachotolewa ni sadaka. Uwezekano mwingine umehifadhiwa katika tanbihi.
- issue: Maana ya עֹלַת הַתָּמִיד
  choice: sadaka ya kuteketezwa ya kawaida
  alternative: sadaka ya kuteketezwa ya daima
  rationale: ‘Ya kawaida’ huwasilisha urudiaji wa kudumu wa ibada bila kudokeza kwamba sadaka yenyewe iliendelea kuwaka milele; mbadala umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha na mahusiano ya viwakilishi vya Kiebrania yamedumishwa kadiri lugha ya asili inavyoruhusu.
