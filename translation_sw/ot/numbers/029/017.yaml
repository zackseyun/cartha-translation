base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/017.yaml
  text: 'And on the second day: twelve bulls from the herd[a], two rams, and fourteen one-year-old lambs without blemish,'
translation:
  language: sw
  text: 'Na siku ya pili: mafahali kumi na wawili kutoka kundi la ng’ombe[a], kondoo dume wawili, na wanakondoo kumi na wanne wenye umri wa mwaka mmoja, wasio na dosari,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “mafahali kumi na wawili, wana wa ng’ombe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שֵּׁנִי
  choice: Na siku ya pili
  rationale: Muunganiko wa kiunganishi, kihusishi, nomino, na kivumishi cha mp ترتيب unaendeleza orodha ya sadaka kwa njia ya kawaida katika Kiswahili.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: mafahali ... kutoka kundini
  rationale: פָּרִים ni mafahali katika muktadha wa sadaka, na usemi wa Kiebrania בְּנֵי בָקָר, kihalisi ‘wana wa kundi la ng’ombe,’ unaonyesha kwamba ni wanyama wa kundini.
- source_word: שְׁנֵים עָשָׂר
  choice: kumi na wawili
  rationale: Idadi hii inarejelea mafahali, hivyo upatanisho wa ngeli ya viumbe wenye uhai umetumiwa.
- source_word: אֵילִם שְׁנָיִם
  choice: kondoo dume wawili
  rationale: אֵילִם ni kondoo wa kiume waliokomaa; ‘kondoo dume’ ni tafsiri ya kawaida na iliyo wazi.
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: wanakondoo kumi na wanne
  rationale: כְּבָשִׂים katika orodha hii ni wanakondoo; idadi imetolewa kwa upatanisho wa kawaida wa Kiswahili.
- source_word: בְּנֵי שָׁנָה
  choice: wenye umri wa mwaka mmoja
  rationale: Usemi huu wa Kiebrania, kihalisi ‘wana wa mwaka,’ ni nahau ya wanyama walio na umri wa mwaka mmoja.
- source_word: תְּמִימִם
  choice: wasio na dosari
  rationale: Katika sheria za sadaka neno hili humaanisha wanyama wasiokuwa na kasoro inayowafanya wasifae kutolewa.
