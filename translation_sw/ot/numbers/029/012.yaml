  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/חַגֹּתֶ֥ם חַ֛ג לַ/יהוָ֖ה שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/012.yaml
  text: And on the fifteenth day of the seventh month, you shall have a holy convocation. You shall do no ordinary work, and you shall keep a feast to Yahweh seven days.
translation:
  language: sw
  text: Na siku ya kumi na tano ya mwezi wa saba, mtakuwa na kusanyiko takatifu. Msifanye kazi yoyote ya kawaida, nanyi mtaifanya sikukuu kwa Yahweh kwa siku saba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: Na siku ya kumi na tano
  rationale: Muundo wa Kiebrania unaonyesha tarehe; kutaja “siku” ni wazi na ni kawaida katika Kiswahili.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ya mwezi wa saba
  rationale: Huhusisha siku hiyo na mwezi wa saba kwa mtindo wa kawaida wa kutaja tarehe.
- source_word: מִקְרָא קֹדֶשׁ
  choice: kusanyiko takatifu
  rationale: Huhifadhi maana ya mkutano mtakatifu ulioitishwa rasmi bila kutumia neno lisilo la kawaida kwa wasomaji wengi.
- source_word: יִהְיֶה לָכֶם
  choice: mtakuwa na
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha kwa usahihi maana halisi ya “litakuwa kwenu.”
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: kazi yoyote ya kawaida
  rationale: Hurejelea shughuli za kawaida za kazi zilizokatazwa siku takatifu, si kila tendo bila ubaguzi.
- source_word: לֹא תַעֲשׂוּ
  choice: Msifanye
  rationale: Amri hasi ya moja kwa moja ni ya asili katika Kiswahili na huhifadhi nguvu ya kisheria ya kauli.
- source_word: וְחַגֹּתֶם חַג
  choice: nanyi mtamfanyia ... sikukuu
  rationale: Huwakilisha muundo wa kitenzi na nomino zenye mzizi mmoja, unaomaanisha kuadhimisha sikukuu kwa heshima ya Mungu.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetafsiriwa kwa umbo “Yahweh,” huku kiambishi cha yambwa katika “mtamfanyia” kikibeba dhana ya kumwelekea au kumheshimu.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: “Kwa” huonyesha kwa kawaida na kwa uwazi muda wa kuendelea kwa sikukuu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la agano יהוה moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa katazo la kazi
  choice: kazi yoyote ya kawaida
  alternative: kazi yoyote; kazi ya utumishi
  rationale: Neno עֲבֹדָה katika kirai hiki linaelekeza kwenye kazi ya kawaida ya shughuli au wajibu. Tafsiri hii huepuka kudokeza kuwa kila tendo limekatazwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Muundo wa amri umewekwa kwa ufupi, na “kusanyiko takatifu” limetumiwa kama istilahi wazi ya ibada.
