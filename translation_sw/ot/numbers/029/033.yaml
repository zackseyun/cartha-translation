id: NUM.29.33
reference: Numbers 29:33
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּ/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כְּ/מִשְׁפָּטָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/033.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: sw
  text: na sadaka yao ya nafaka na sadaka zao za kinywaji kwa ajili ya mafahali, kondoo dume, na wanakondoo, kulingana na idadi yao na kama ilivyoagizwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָתָם
  choice: sadaka yao ya nafaka
  rationale: Katika muktadha wa dhabihu, מִנְחָה ni sadaka ya nafaka inayoandamana na sadaka za kuteketezwa. Umoja wenye kiambishi cha nafsi ya tatu wingi umehifadhiwa kama umoja wa kijumla.
- source_word: נִסְכֵּיהֶם
  choice: sadaka zao za kinywaji
  rationale: Neno נֶסֶךְ linamaanisha sadaka ya kinywaji iliyomiminwa; wingi wenye kiambishi umehifadhiwa.
- source_word: לַפָּרִים
  choice: kwa ajili ya mafahali
  rationale: פָּרִים katika orodha za dhabihu humaanisha mafahali; maandishi haya hayasemi wazi 'mafahali wachanga'.
- source_word: לָאֵילִם
  choice: kondoo dume
  rationale: אַיִל katika muktadha wa dhabihu humaanisha kondoo dume.
- source_word: וְלַכְּבָשִׂים
  choice: na wanakondoo
  rationale: כֶּבֶשׂ humaanisha mwanakondoo; jinsia haijaainishwa kwa kuwa Kiswahili cha kawaida hakihitaji kuiongeza hapa.
- source_word: בְּמִסְפָּרָם
  choice: kulingana na idadi yao
  rationale: Kirai hiki kinaonyesha kwamba sadaka zinazotolewa zilingane na hesabu ya wanyama iliyowekwa.
- source_word: כְּמִשְׁפָּטָם
  choice: kama ilivyoagizwa
  rationale: מִשְׁפָּט hapa ni utaratibu au kanuni iliyowekwa kwa sadaka hizi. Tafsiri hii ni ya kawaida na yenye hadhi katika Kiswahili bila kulazimisha rejeo la kiambishi lenye utata.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa ibada ulio wazi na wa heshima. Muundo wa orodha umefanywa kuwa wa kawaida kwa Kiswahili huku tofauti kati ya umoja wa kijumla wa sadaka ya nafaka na wingi wa sadaka za kinywaji ikihifadhiwa.
