base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/014.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for each bull[a], for the thirteen bulls, and two-tenths for each ram, for the two rams.'
translation:
  language: sw
  text: 'Na sadaka yao ya nafaka itakuwa unga laini uliochanganywa na mafuta: vipimo vitatu vya sehemu ya kumi[a] kwa kila fahali, kwa fahali kumi na watatu; na vipimo viwili vya sehemu ya kumi kwa kila kondoo dume, kwa kondoo dume wawili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “vipimo vitatu vya sehemu ya kumi” na “vipimo viwili vya sehemu ya kumi,” humaanisha vipimo vya sehemu ya kumi, ambavyo kwa kawaida hueleweka kuwa sehemu za kumi za efa.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Na sadaka yao ya nafaka
  rationale: Katika muktadha wa dhabihu, מִנְחָה humaanisha sadaka ya nafaka; kiambishi cha wingi kinarejelea wanyama waliotajwa katika mfululizo huu.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Hili ni neno la kawaida la ibada kwa unga uliosagwa vizuri na kutumiwa katika sadaka ya nafaka.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Kirai hiki kinaeleza jinsi unga unavyoandaliwa, yaani kwa kuchanganywa na mafuta.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: sehemu tatu za kumi
  rationale: עִשָּׂרוֹן ni kipimo cha sehemu moja ya kumi; tafsiri inaacha kipimo cha efa katika tanbihi kwa kuwa hakitajwi wazi katika mstari huu.
- source_word: לַפָּר הָאֶחָד
  choice: kwa kila fahali
  rationale: Ingawa muundo wa Kiebrania ni halisi zaidi 'kwa fahali mmoja,' hapa umetumiwa kwa maana ya mgawanyo kwa kila mnyama.
- source_word: לִשְׁלֹשָׁה עָשָׂר פָּרִים
  choice: kwa wale fahali kumi na watatu
  rationale: Kirai kinataja kundi lote la fahali ambao kipimo hicho cha kila mmoja kinawahusu.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: sehemu mbili za kumi
  rationale: Hiki ni kipimo kilekile cha sehemu ya kumi, kikitafsiriwa kwa ulinganifu na 'sehemu tatu za kumi.'
- source_word: לָאַיִל הָאֶחָד
  choice: kwa kila kondoo dume
  rationale: Umoja wenye kibainishi umetumiwa kwa maana ya mgawanyo, hivyo 'kila kondoo dume' ni wazi na wa kawaida katika Kiswahili.
- source_word: לִשְׁנֵי הָאֵילִם
  choice: kwa wale kondoo dume wawili
  rationale: Kirai kinabainisha jumla ya kondoo dume wawili katika sadaka hiyo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa orodha ya ibada umehifadhiwa huku maana ya mgawanyo ikielezwa kwa neno “kila.”
