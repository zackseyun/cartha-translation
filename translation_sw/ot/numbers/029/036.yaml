  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֥ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/036.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: one bull, one ram, and seven one-year-old lambs without blemish.'
translation:
  language: sw
  text: 'Nanyi mtatoa sadaka ya kuteketezwa, sadaka inayotolewa kwa moto, yenye harufu ya kumpendeza Yahweh: fahali mmoja, kondoo dume mmoja, na wanakondoo saba wa mwaka mmoja, wasio na dosari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Nanyi mtatoa
  rationale: Hifili ya קרב katika muktadha wa dhabihu humaanisha kuleta au kutoa sadaka. “Mtatoa” ni Kiswahili cha kawaida kinachohifadhi maana ya tendo la ibada.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Neno hili hutaja sadaka inayoteketezwa yote; hii ndiyo istilahi iliyo wazi na ya kawaida katika Kiswahili cha Biblia.
- source_word: אִשֵּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Tafsiri hii inaonyesha wazi kwamba sadaka hiyo hutolewa kwa njia ya moto bila kuiongezea maana ya ‘chakula’ ambayo si lazima hapa.
- source_word: רֵיחַ נִיחֹחַ
  choice: yenye harufu ya kumpendeza
  rationale: Huu ni usemi maalumu wa dhabihu unaoonyesha kwamba sadaka inakubaliwa na Mungu. Kauli hii ni ya asili katika Kiswahili na inahifadhi picha ya harufu.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa kama “Yahweh,” kwa kuzingatia jina lililo katika matini badala ya kulibadilisha kuwa cheo.
- source_word: פַּר אֶחָד
  choice: fahali mmoja
  rationale: פַּר humaanisha fahali wa kundi la ng’ombe; matini haitaji kwa lazima kuongeza kwamba ni mchanga.
- source_word: אַיִל אֶחָד
  choice: kondoo dume mmoja
  rationale: אַיִל ni kondoo dume, hasa katika orodha za dhabihu.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: wanakondoo saba wa mwaka mmoja
  rationale: Usemi huo kihalisi ni wanakondoo ‘wana wa mwaka’; tafsiri hii ya kawaida inahifadhi idadi na sharti la umri bila kuongeza jinsia ambayo haijaelezwa kwa lazima.
- source_word: תְּמִימִם
  choice: wasio na dosari
  rationale: Katika muktadha wa dhabihu, neno hili humaanisha wanyama wasio na kasoro inayowafanya wasifae kutolewa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina la Mungu la herufi nne, יהוה. “Yahweh” hulihifadhi kama jina binafsi la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya רֵיחַ נִיחֹחַ
  choice: harufu ya kumpendeza Yahweh
  alternative: harufu ya kutuliza
  rationale: Usemi wa dhabihu unaonyesha kukubalika kwa sadaka mbele za Mungu. Tafsiri haisemi kwamba Mungu alitulizwa kutoka hali fulani, jambo ambalo matini yenyewe halifafanui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa orodha ya dhabihu umehifadhiwa, huku maneno ya kiibada yakitolewa kwa lugha inayoeleweka kwa wasomaji wa kawaida.
