  source_fidelity: 'Tafsiri inafuata kwa usahihi muundo na maudhui ya Kiebrania: amri ya kutoa dhabihu, aina mbili za maelezo ya dhabihu (sadaka ya kuteketezwa na sadaka ya moto), harufu inayokubalika kwa Yahweh, pamoja na idadi, aina, umri, na kutokuwa na dosari kwa wanyama. Hakuna jinsia au sifa nyingine isiyosemwa na matini iliyoongezwa.'
