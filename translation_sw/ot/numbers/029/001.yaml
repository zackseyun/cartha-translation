base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/001.yaml
  text: And in the seventh month, on the first day of the month, you shall have a holy convocation. You shall do no laborious work. It shall be a day of trumpet-blast for you.
translation:
  language: sw
  text: Katika mwezi wa saba, siku ya kwanza ya mwezi huo, mtakuwa na kusanyiko takatifu. Msifanye kazi yoyote ya kawaida. Siku hiyo itakuwa kwenu siku ya mlio wa shangwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku ya mlio wa tarumbeta,” au “siku ya kelele.” Neno la Kiebrania teruah humaanisha sauti kubwa ya ishara na, kutegemea muktadha, linaweza kumaanisha mlio wa tarumbeta, kelele, au shangwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: Katika mwezi wa saba
  rationale: Kiunganishi ו kinaendeleza mfululizo wa sheria, lakini katika Kiswahili mwanzo wa sentensi hauhitaji lazima ‘Na’; ב ni ya wakati, hivyo ‘katika mwezi’ ni ya asili na sahihi.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: siku ya kwanza ya mwezi huo
  rationale: Hii ni nahau ya kalenda ya Kiebrania, kihalisi ‘siku moja ya mwezi,’ yenye maana ya siku ya kwanza; ‘mwezi huo’ huunganisha wazi na mwezi wa saba.
- source_word: מִקְרָא קֹדֶשׁ
  choice: kusanyiko takatifu
  rationale: Kirai hiki humaanisha mkutano mtakatifu ulioitishwa rasmi; ‘kusanyiko takatifu’ ni cha sasa, chenye heshima, na kinaeleweka kwa urahisi.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: kazi yoyote ya kawaida
  rationale: Kirai hakikatazi kila tendo bila ubaguzi, bali kazi ya kawaida ya shughuli au huduma katika siku ya sikukuu. ‘Kazi yoyote ya kawaida’ huepuka dhana finyu ya kazi nzito pekee.
- source_word: יוֹם תְּרוּעָה
  choice: siku ya mlio mkuu
  rationale: תְּרוּעָה ni sauti kubwa iliyoinuliwa, iwe mlio wa tarumbeta, kelele, au shangwe. ‘Mlio mkuu’ huhifadhi kutotajwa kwa chombo katika Kiebrania na huacha upana wa neno uelezwe katika tanbihi.
- source_word: יִהְיֶה לָכֶם
  choice: itakuwa kwenu
  rationale: Muundo huu unaonyesha kwamba siku hiyo imewekwa kwa ajili ya watu; ‘itakuwa kwenu’ ni wa moja kwa moja na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la siku יוֹם תְּרוּעָה
  choice: siku ya mlio mkuu
  alternative: siku ya kupiga tarumbeta; siku ya kelele au shangwe
  rationale: Kiebrania kinaitaja siku kwa sauti yake bainifu bila kutaja wazi chombo wala kutumia jina la baadaye la sikukuu. Tafsiri kuu kwa hiyo haifungi maana kwa tarumbeta pekee; tanbihi huhifadhi uwezekano wa tarumbeta, kelele, au shangwe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ulio wazi na wenye heshima. ‘Kusanyiko takatifu’ linadumisha uzito wa ibada; ‘msifanye’ linaonyesha amri kwa wingi kwa lugha ya sasa. Tanbihi imewekwa baada ya ‘mlio mkuu’ kama inavyotakiwa na alama [a] katika matini.
