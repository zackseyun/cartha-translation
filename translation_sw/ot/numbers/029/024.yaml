base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/024.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: sw
  text: na sadaka yao ya nafaka na sadaka zao za vinywaji kwa ajili ya mafahali, kwa ajili ya kondoo dume, na kwa ajili ya wanakondoo, kwa hesabu yao, kama ilivyoagizwa;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָתָם
  choice: sadaka zao za nafaka
  rationale: Katika muktadha wa dhabihu, מִנְחָה ni sadaka ya nafaka inayoambatana na wanyama wanaotolewa, si sadaka kwa ujumla. Wingi wa Kiswahili unafaa kwa kuwa sadaka hizo zinahusishwa na wanyama kadhaa.
- source_word: וְנִסְכֵּיהֶם
  choice: na sadaka zao za kinywaji
  rationale: נֶסֶךְ ni kinywaji kinachomiminwa kama sadaka. ‘Sadaka za kinywaji’ ni wazi na ya kawaida katika lugha ya Biblia ya Kiswahili.
- source_word: לַפָּרִים
  choice: kwa ajili ya mafahali
  rationale: Kiambishi ל hapa kinaonyesha uhusiano wa sadaka zinazoambatana na mafahali; ‘kwa ajili ya’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: לָאֵילִם
  choice: kondoo dume
  rationale: אֵילִם ni kondoo wa kiume waliokomaa; ‘kondoo dume’ ni tafsiri ya kawaida na iliyo wazi.
- source_word: וְלַכְּבָשִׂים
  choice: na wanakondoo
  rationale: כְּבָשִׂים katika muktadha huu ni wanakondoo wa kutolewa dhabihu.
- source_word: בְּמִסְפָּרָם
  choice: kulingana na idadi yao
  rationale: Kirai hiki kinaonyesha kuwa sadaka zinazoambatana na wanyama zinatolewa kwa uwiano na idadi ya wanyama hao.
- source_word: כַּמִּשְׁפָּט
  choice: kama ilivyoagizwa
  rationale: מִשְׁפָּט katika sheria za dhabihu humaanisha utaratibu uliowekwa kisheria. ‘Kama ilivyoagizwa’ ni Kiswahili cha asili kinachohifadhi wazo la sharti rasmi bila kudokeza desturi ya hiari.
