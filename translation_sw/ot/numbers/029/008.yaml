  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֤ה לַֽ/יהוָה֙ רֵ֣יחַ נִיחֹ֔חַ פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֤ים בְּנֵֽי שָׁנָה֙ שִׁבְעָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/008.yaml
  text: 'You shall present a burnt offering to Yahweh[a], a pleasing aroma: one bull from the herd, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: sw
  text: 'Mtamtolea Yahweh sadaka ya kuteketezwa, yenye harufu ya kumpendeza[a]: fahali mmoja kutoka kundini, kondoo dume mmoja, na wanakondoo dume saba wenye umri wa mwaka mmoja. Hawa watakuwa bila dosari kwenu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “harufu ya kutuliza.” Huu ni usemi maalumu wa Kiebrania kuhusu sadaka inayokubalika kwa Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Mtamtolea
  rationale: Hifili ya קרב katika muktadha wa dhabihu humaanisha kuleta au kutoa sadaka. ‘Mtamtolea’ ni ya kawaida katika Kiswahili na inaonyesha wazi kuwa sadaka inaelekezwa kwa Yahweh.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni sadaka iliyoteketezwa yote; tamko hili la kawaida linaeleweka vizuri kuliko tafsiri ya kietimolojia kama ‘sadaka ya kupaa.’
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Kihusishi ל kinaunganishwa na kitenzi katika ‘Mtamtolea,’ huku jina la agano יהוה likihamishwa kama ‘Yahweh.’
- source_word: רֵיחַ נִיחֹחַ
  choice: harufu ya kumpendeza
  rationale: Ni usemi maalumu wa kidhabihu unaoonyesha sadaka inayokubalika kwa Mungu. Tafsiri hii huhifadhi picha ya harufu bila kudokeza kwamba Mungu hutegemea hisi za kimwili.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: fahali mmoja kutoka kundini
  rationale: Usemi huu unamtaja fahali wa ng’ombe kutoka katika kundi; tafsiri hii ni ya asili na huhifadhi maelezo ya mnyama.
- source_word: אַיִל אֶחָד
  choice: kondoo dume mmoja
  rationale: Hii ndiyo tafsiri sahihi na ya kawaida ya אַיִל katika orodha za dhabihu.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: wanakondoo dume saba wenye umri wa mwaka mmoja
  rationale: כְּבָשִׂים hapa ni wanakondoo wa kiume, na בְּנֵי שָׁנָה huonyesha kwamba wana umri wa mwaka mmoja.
- source_word: תְּמִימִם
  choice: bila dosari
  rationale: Katika muktadha wa dhabihu neno hili linamaanisha wanyama wasio na kasoro inayowafanya wasifae kutolewa.
- source_word: יִהְיוּ לָכֶם
  choice: Hao mtakaowatoa watakuwa
  rationale: Muundo huu unawakilisha sharti linalowahusu waabudu na kuhusianisha wanyama hao nao kwa Kiswahili cha kawaida, bila kutumia ‘kwa ajili yenu,’ ambako kungeweza kupotosha maana.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya רֵיחַ נִיחֹחַ
  choice: harufu ya kumpendeza
  alternative: harufu ya kutuliza
  rationale: Usemi huu wa kidhabihu unaeleza kukubalika kwa sadaka mbele za Mungu. ‘Ya kumpendeza’ huhifadhi sitiari na huepuka kuamua kwamba dhabihu inatuliza hasira ya Mungu, jambo ambalo mstari wenyewe halisemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imegawanywa baada ya orodha ili sharti la kutokuwa na dosari lisomeke kwa uwazi. Alama ya tanbihi imewekwa baada ya usemi unaohusika, yaani ‘harufu ya kumpendeza.’
