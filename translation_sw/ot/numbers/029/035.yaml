  variant: Standard East African Swahili
source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י עֲצֶ֖רֶת תִּהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/035.yaml
  text: On the eighth day you shall have a solemn assembly[a]; you shall do no laborious work.
translation:
  language: sw
  text: Siku ya nane mtakuwa na kusanyiko maalumu[a]; msifanye kazi yoyote ya kawaida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusanyiko la kufunga sikukuu.” Neno la Kiebrania עֲצֶרֶת linaweza kumaanisha kusanyiko linalohitimisha sikukuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Siku ya nane
  rationale: Huhifadhi maana ya wakati na tarakimu ya mpangilio kwa Kiswahili cha kawaida na wazi.
- source_word: עֲצֶרֶת
  choice: kusanyiko maalumu
  rationale: Neno hili humaanisha kusanyiko rasmi la sikukuu, hasa linalohitimisha kipindi cha sherehe. ‘Maalumu’ huonyesha hadhi yake bila kulazimisha katika matini kuu maana ya ‘kufunga,’ ambayo imewekwa katika tanbihi kama uwezekano halisi.
- source_word: תִּהְיֶה לָכֶם
  choice: mtakuwa na
  rationale: Ni Kiswahili cha kawaida kinachowasilisha kwa ufasaha maana halisi ya ‘litakuwa kwenu.’
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: kazi yoyote ya kawaida
  rationale: Kirai hiki katika sheria za sikukuu kinakataza kazi ya kawaida ya shughuli au ajira, si kila tendo bila ubaguzi. Tafsiri hii ni ya asili na haiongezi dhana kwamba ni kazi ngumu tu inayokatazwa.
- source_word: לֹא תַעֲשׂוּ
  choice: msifanye
  rationale: Huwakilisha moja kwa moja amri hasi iliyoelekezwa kwa watu wengi.
theological_decisions:
- issue: Maana ya עֲצֶרֶת katika sikukuu
  choice: kusanyiko maalumu
  alternative: kusanyiko la kufunga sikukuu
  rationale: Matini inaonyesha kusanyiko la sikukuu siku ya nane, lakini inaweza kusisitiza ama hadhi maalumu ya kusanyiko ama kazi yake ya kuhitimisha sikukuu. Matini kuu haifungwi kwa tafsiri moja pekee; maana ya kuhitimisha imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi inayofaa matini ya kisheria na kidini. Muundo ni mfupi na wa moja kwa moja; ‘kazi yoyote ya kawaida’ huepuka usemi wa kizamani ‘kazi ya utumishi’ na tofauti na ‘kazi ngumu’ haupunguzi katazo kuwa la kazi inayochosha pekee.
