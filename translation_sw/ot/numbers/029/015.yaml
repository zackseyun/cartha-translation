lexical_decisions:
- source_word: עִשָּׂרוֹן ... עִשָּׂרוֹן
  choice: sehemu ya kumi
  rationale: Nomino iliyorudiwa inaonyesha kipimo cha sehemu ya kumi; katika muktadha huu wa dhabihu, ni sehemu ya kumi ya efa ya unga laini. Kiswahili cha kawaida ‘sehemu ya kumi kwa kila’ kinawasilisha maana ya ugawaji kwa kila mnyama bila kurudia neno kwa namna isiyo ya kawaida.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: kwa kila mwana-kondoo
  rationale: Ingawa kwa muundo wa moja kwa moja ni ‘kwa mwana-kondoo mmoja,’ hapa kirai kina maana ya ugawaji, yaani kiasi kinachotolewa kwa kila mnyama.
- source_word: לְאַרְבָּעָה עָשָׂר כְּבָשִׂים
  choice: kwa wale wana-kondoo kumi na wanne
  rationale: Kirai kinataja kundi lote la wana-kondoo kumi na wanne ambalo kiasi hicho cha kila mmoja kinawahusu. ‘Wale’ linaonyesha kundi maalumu lililotajwa katika maagizo haya.
