  yaml_path: translation/ot/numbers/029/022.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: sw
  text: Na mbuzi dume mmoja wa sadaka ya dhambi, mbali na sadaka ya kuteketezwa ya kawaida[a], na sadaka yake ya nafaka na sadaka yake ya kinywaji.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya daima ya kuteketezwa.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “sadaka yake ya nafaka na sadaka yake ya kinywaji”; neno “yake” linarejelea sadaka ya kuteketezwa ya kawaida.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: na beberu
  rationale: שָׂעִיר hapa ni mbuzi dume wa sadaka; “beberu” ni neno la kawaida la Kiswahili linalobainisha jinsia, na kiambishi וּ־ kimetafsiriwa “na.”
- source_word: אֶחָד
  choice: mmoja
  rationale: Namba hiyo imetajwa wazi ili kuhifadhi idadi ya mnyama wa sadaka.
- source_word: חַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Katika muktadha wa ibada za dhabihu, חַטָּאת humaanisha sadaka ya dhambi, si dhambi kwa maana ya jumla.
- source_word: מִ/לְּ/בַד
  choice: mbali na
  rationale: Kirai hiki kinaonyesha kwamba sadaka iliyotajwa inaongezwa juu ya sadaka ya kawaida na viambatisho vyake.
- source_word: עֹלַת
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno lililo wazi na la kawaida kwa sadaka inayoteketezwa kabisa katika sheria za dhabihu.
- source_word: הַ/תָּמִיד
  choice: ya kawaida
  rationale: תָּמִיד hapa hueleza sadaka iliyotolewa kwa utaratibu unaoendelea; “ya kawaida” ni ya asili katika Kiswahili, huku “ya daima” ikihifadhiwa katika tanbihi kama uwezekano.
- source_word: וּ/מִנְחָתָהּ
  choice: pamoja na sadaka yake ya nafaka
  rationale: מִנְחָה katika muktadha huu ni sadaka ya nafaka. Kiambishi cha nafsi ya tatu, jinsia ya kike, kinarejelea sadaka ya kuteketezwa.
- source_word: וְ/נִסְכָּהּ
  choice: na sadaka yake ya kinywaji
  rationale: נֶסֶךְ ni sadaka ya kimiminika inayomiminwa; “sadaka ya kinywaji” ni tafsiri wazi na inayoeleweka.
theological_decisions:
- issue: Kirejeleo cha viambishi katika מִנְחָתָהּ na נִסְכָּהּ
  choice: “yake” inarejelea sadaka ya kawaida ya kuteketezwa
  alternative: Kuviacha viambishi bila kubainisha kirejeleo chake
  rationale: Jinsia ya kisarufi na muundo wa sentensi unaunga mkono kurejelea עֹלַת הַתָּמִיד; tanbihi inaeleza hilo bila kupanua maandiko yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefuata Kiebrania kwa karibu huku ukitumia miundo ya asili ya Kiswahili. Alama zote za tanbihi zimewekwa katika maandiko.
