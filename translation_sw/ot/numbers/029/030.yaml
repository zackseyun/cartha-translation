  yaml_path: translation/ot/numbers/029/030.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: sw
  text: na sadaka yao ya nafaka na sadaka zao za kinywaji kwa ajili ya mafahali, kondoo dume, na wanakondoo, kulingana na idadi yao na kulingana na utaratibu uliowekwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama ilivyoagizwa.” Kiebrania כַּמִּשְׁפָּט kinamaanisha kanuni iliyowekwa kuhusu jinsi sadaka hizi zilivyopaswa kutolewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: sadaka yao ya nafaka
  rationale: Katika muktadha wa dhabihu, מִנְחָה ni sadaka ya nafaka. Umoja wa neno umehifadhiwa kwa maana ya mkusanyo, pamoja na kiambishi cha umilikaji cha wingi.
- source_word: נִסְכֵּיהֶם
  choice: sadaka zao za kinywaji
  rationale: נֶסֶךְ ni sadaka ya kinywaji iliyomiminwa pamoja na dhabihu; usemi huu ni wazi na wa kawaida katika Kiswahili cha Biblia.
- source_word: לַפָּרִים
  choice: kwa ajili ya mafahali
  rationale: פַּר humaanisha fahali katika orodha za dhabihu; umri haujatajwa wazi hapa.
- source_word: לָאֵילִם
  choice: kondoo dume
  rationale: אַיִל humaanisha kondoo dume katika muktadha wa dhabihu.
- source_word: וְלַכְּבָשִׂים
  choice: na wanakondoo
  rationale: כֶּבֶשׂ humaanisha mwanakondoo; jinsia haijaongezwa kwa kuwa haitajwi wazi katika kifungu hiki.
- source_word: בְּמִסְפָּרָם
  choice: kulingana na idadi yao
  rationale: Kirai hiki kinaonyesha kwamba sadaka zinapaswa kuambatana na idadi ya wanyama iliyotajwa.
- source_word: כַּמִּשְׁפָּט
  choice: na utaratibu uliowekwa
  rationale: מִשְׁפָּט hapa ni kanuni au utaratibu wa kisheria uliowekwa kwa namna ya kutoa sadaka; tafsiri hii inaeleweka kwa urahisi bila kupoteza maana ya kiibada na kisheria.
