  text: וּ/בַ/יּ֧וֹם הַ/שִּׁשִּׁ֛י פָּרִ֥ים שְׁמֹנָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/029.yaml
  text: 'And on the sixth day: eight bulls, two rams, and fourteen male lambs a year old, without blemish.'
translation:
  language: sw
  text: 'Na siku ya sita: mafahali wanane, kondoo dume wawili, na wanakondoo dume kumi na wanne wa mwaka mmoja, wasio na dosari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שִּׁשִּׁי
  choice: Na siku ya sita
  rationale: Muundo huu unaendeleza mfululizo wa matoleo ya kila siku kwa Kiswahili cha kawaida na kuhifadhi kiunganishi cha Kiebrania.
- source_word: פָּרִים שְׁמֹנָה
  choice: mafahali wanane
  rationale: Katika muktadha wa dhabihu, פָּרִים humaanisha mafahali; maandishi hayataji wazi umri wao.
- source_word: אֵילִם שְׁנָיִם
  choice: kondoo dume wawili
  rationale: אֵילִם ni kondoo wa kiume waliokomaa, yaani kondoo dume.
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: wanakondoo dume kumi na wanne
  rationale: כְּבָשִׂים ni wanakondoo, na umbo la kiume pamoja na muktadha wa dhabihu linafaa kubainishwa kwa 'dume'.
- source_word: בְּנֵי שָׁנָה
  choice: wenye umri wa mwaka mmoja
  rationale: Hii ni njia ya asili na iliyo wazi ya kueleza nahau ya Kiebrania inayomaanisha wanyama wa mwaka mmoja.
- source_word: תְּמִימִם
  choice: wote wasio na dosari
  rationale: Katika sheria za dhabihu, neno hili humaanisha wanyama wasiokuwa na kasoro; 'wote' linaonyesha kwamba sifa hii inawahusu wanakondoo wote kumi na wanne.
