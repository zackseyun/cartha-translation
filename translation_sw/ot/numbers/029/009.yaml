base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/009.yaml
  text: 'and their grain offering: fine flour mixed with oil[a], three-tenths for the bull, two-tenths for the one ram,'
translation:
  language: sw
  text: 'na sadaka yao ya nafaka: unga laini uliochanganywa na mafuta, vipimo vitatu vya sehemu ya kumi[a] kwa fahali, na vipimo viwili vya sehemu ya kumi kwa kondoo dume mmoja,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, “vipimo vitatu vya sehemu ya kumi” na “vipimo viwili vya sehemu ya kumi” hurejelea vipimo vya sehemu ya kumi, ambavyo kwa kawaida hueleweka kuwa kila kimoja ni sehemu ya kumi ya efa.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: na sadaka yao ya nafaka
  rationale: Katika muktadha wa dhabihu, מִנְחָה ni sadaka ya nafaka inayoandamana na sadaka za kuteketezwa. Kiambishi cha kuunganisha na kiambishi cha nafsi ya tatu wingi vimehifadhiwa katika “na” na “yao”.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Neno hili humaanisha unga wa hali nzuri uliosagwa vizuri na kutumiwa katika sadaka; “unga laini” ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Kirai kinaeleza unga uliotiwa na kuchanganywa na mafuta. Tafsiri hii ni ya asili katika Kiswahili cha sasa na inadumisha maelezo ya maandalizi ya sadaka.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: vipimo vitatu vya sehemu ya kumi
  rationale: עִשָּׂרוֹן ni kipimo cha sehemu moja ya kumi. Kutaja “vipimo” huepusha dhana ya sehemu zisizo na kipimo, bila kuongeza “efa” moja kwa moja katika matini.
- source_word: לַפָּר
  choice: kwa huyo fahali
  rationale: Nomino ya umoja yenye kibainishi inamrejelea fahali aliyetajwa katika orodha ya sadaka; “huyo” huonyesha rejeo hilo maalumu.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: vipimo viwili vya sehemu ya kumi
  rationale: Tafsiri hii inadumisha idadi na kitengo cha kipimo cha Kiebrania kwa namna iliyo wazi katika Kiswahili.
- source_word: לָאַיִל הָאֶחָד
  choice: kwa huyo kondoo dume mmoja
  rationale: Tafsiri inadumisha umaalumu wa kibainishi na neno אֶחָד, linalosisitiza kwamba ni kondoo dume mmoja katika orodha hiyo.
