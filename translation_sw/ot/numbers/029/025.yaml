  yaml_path: translation/ot/numbers/029/025.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: sw
  text: na mbuzi dume mmoja kuwa sadaka ya dhambi, mbali na sadaka ya kawaida ya kuteketezwa, sadaka yake ya nafaka, na sadaka yake ya kinywaji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: na beberu mmoja
  rationale: Kirai hiki ni usemi wa kawaida wa dhabihu unaomaanisha mbuzi dume; “beberu” ni neno la kawaida na wazi katika Kiswahili sanifu, huku אֶחָד ikitaja idadi.
- source_word: חַטָּאת
  choice: kuwa sadaka ya dhambi
  rationale: Katika muktadha wa dhabihu, neno hili linamaanisha sadaka inayohusiana na dhambi, si dhambi yenyewe.
- source_word: מִ/לְּ/בַד
  choice: pamoja na
  rationale: Hapa usemi huu unaonyesha kwamba dhabihu iliyotajwa ilitolewa kwa kuongezea sadaka ya kawaida, si badala yake.
- source_word: עֹלַת הַ/תָּמִיד
  choice: sadaka ya kawaida ya kuteketezwa
  rationale: תמיד inaonyesha sadaka iliyotolewa kwa utaratibu unaoendelea; “ya kawaida” ni ya asili na haibani maana kuwa “ya kila siku” pekee.
- source_word: מִנְחָתָהּ
  choice: sadaka yake ya nafaka
  rationale: Katika orodha za kikuhani, מִנְחָה ni sadaka ya nafaka iliyoandamana na dhabihu.
- source_word: וְ/נִסְכָּהּ
  choice: na sadaka yake ya kinywaji
  rationale: נֶסֶךְ ni kinywaji kilichomiminwa kama sadaka; usemi huu unaeleweka kwa wasomaji wa kawaida.
