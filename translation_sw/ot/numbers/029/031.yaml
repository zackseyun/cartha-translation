  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offerings.
translation:
  language: sw
  text: na mbuzi dume mmoja kuwa sadaka ya dhambi, mbali na sadaka ya kuteketezwa ya kawaida[a], sadaka yake ya nafaka, na sadaka zake za kinywaji[b].
  philosophy: optimal-equivalence
