    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר
  choice: mbuzi dume
  rationale: Katika muktadha wa dhabihu, neno hili humaanisha mbuzi, hasa dume; ‘mbuzi dume’ huonyesha maana hiyo wazi na kwa Kiswahili cha kawaida.
- source_word: חַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika orodha za dhabihu, nomino hii humaanisha sadaka inayotolewa kwa ajili ya dhambi, si dhambi kama dhana tu.
- source_word: אֶחָד
  choice: mmoja
  rationale: Ni nambari inayoonyesha idadi ya mbuzi dume.
- source_word: מִלְּבַד
  choice: pamoja na
  rationale: Kirai hiki kinaonyesha kuwa sadaka iliyotajwa inaongezwa kwenye sadaka ya kawaida; ‘pamoja na’ ni ya asili katika Kiswahili na hudumisha uhusiano huo.
- source_word: עֹלַת הַתָּמִיד
  choice: sadaka ya kuteketezwa ya kawaida
  rationale: Kirai hiki kinarejelea sadaka ya kuteketezwa iliyotolewa mara kwa mara kwa utaratibu uliowekwa; ‘ya kawaida’ huwasilisha kurudiwa kwake bila kudokeza kuwa iliendelea kuwaka bila kukoma.
- source_word: מִנְחָתָהּ
  choice: sadaka yake ya nafaka
  rationale: Katika muktadha huu מִנְחָה ni sadaka ya nafaka inayoandamana na sadaka ya kuteketezwa; kiambishi cha nafsi kinarejelea sadaka hiyo.
- source_word: וּנְסָכֶיהָ
  choice: na sadaka zake za kinywaji
  rationale: נֶסֶךְ ni sadaka ya kinywaji inayomiminwa; umbo la wingi lenye kiambishi linawakilishwa na ‘sadaka zake za kinywaji.’
