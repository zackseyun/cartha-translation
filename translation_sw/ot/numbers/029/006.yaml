  text: מִ/לְּ/בַד֩ עֹלַ֨ת הַ/חֹ֜דֶשׁ וּ/מִנְחָתָ֗/הּ וְ/עֹלַ֤ת הַ/תָּמִיד֙ וּ/מִנְחָתָ֔/הּ וְ/נִסְכֵּי/הֶ֖ם כְּ/מִשְׁפָּטָ֑/ם לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/006.yaml
  text: besides the burnt offering of the month and its grain offering[a], and the regular burnt offering and its grain offering, and their drink offerings, according to their ordinance, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: sw
  text: zaidi ya sadaka ya kuteketezwa ya mwezi[a] pamoja na sadaka yake ya nafaka, na sadaka ya kuteketezwa ya daima pamoja na sadaka yake ya nafaka, na sadaka zao za kinywaji, kulingana na utaratibu uliowekwa kwa ajili ya sadaka hizo, kwa harufu ya kupendeza, sadaka ya chakula[b] kwa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda ikamaanisha sadaka ya kuteketezwa ya mwandamo wa mwezi; kwa Kiebrania ni “ya mwezi.”
    reason: lexical_alternative
  - marker: b
    text: Au, kwa tafsiri ya jadi zaidi, “sadaka inayotolewa kwa moto” au “sadaka ya moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: zaidi ya
  rationale: Inaonyesha kwamba sadaka hizi zinaongezwa kwa zile zilizokwisha kutajwa, bila kudokeza kwamba zinatengwa au kuachwa.
- source_word: עֹלַת הַחֹדֶשׁ
  choice: sadaka ya kuteketezwa ya mwezi
  rationale: Inafuata kwa karibu usemi halisi wa Kiebrania, ‘ya mwezi,’ huku tanbihi ikieleza kuwa huenda ikimaanisha sadaka ya mwandamo wa mwezi.
- source_word: מִנְחָתָהּ
  choice: sadaka yake ya nafaka
  rationale: Katika muktadha wa ibada za dhabihu, מִנְחָה ni sadaka ya nafaka inayoandamana na sadaka ya mnyama.
- source_word: עֹלַת הַתָּמִיד
  choice: sadaka ya kuteketezwa ya kawaida
  rationale: Neno תָּמִיד linaonyesha utoaji wa kudumu na uliopangwa; ‘ya kawaida’ ni ya asili katika Kiswahili bila kuongeza waziwazi neno ‘kila siku’ lisilopo hapa.
- source_word: וְנִסְכֵּיהֶם
  choice: na sadaka zake za kinywaji
  rationale: Neno נֶסֶךְ linamaanisha kinywaji kinachomiminwa kama sadaka; kiambishi cha wingi kinarejelea sadaka kadhaa zilizotajwa.
- source_word: כְּמִשְׁפָּטָם
  choice: kulingana na utaratibu uliowekwa kwa ajili ya sadaka hizo
  rationale: Katika muktadha huu מִשְׁפָּט ni kanuni au utaratibu uliowekwa wa kutoa sadaka. Usemi huu unaweka wazi kiwakilishi cha wingi cha Kiebrania kwa Kiswahili cha kawaida.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: ziwe harufu ya kumpendeza
  rationale: Inahifadhi taswira ya harufu inayokubalika na kumpendeza Mungu kwa lugha ya sasa na inayoeleweka.
- source_word: אִשֶּׁה
  choice: sadaka ya chakula
  rationale: Ni istilahi ya kiibada inayoweza kueleweka kama sadaka inayotolewa kwa Mungu kama chakula; tafsiri ya jadi inayosisitiza moto imehifadhiwa katika tanbihi kwa sababu maana ya neno hili inajadiliwa.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Inahifadhi jina la agano יהוה kwa namna ya ‘Yahwe’ na inaonyesha anayepokea sadaka.
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya istilahi ya dhabihu אִשֶּׁה
  choice: sadaka ya chakula
  alternative: sadaka inayotolewa kwa moto; sadaka ya moto
  rationale: ‘Sadaka ya chakula’ inawakilisha uelewa wa istilahi hii kama sadaka inayowasilishwa kwa Mungu, lakini maana inayohusiana na moto ni ya jadi na ina msingi wa kileksika; kwa hiyo imeonyeshwa katika tanbihi badala ya kufichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha ya sadaka umehifadhiwa, huku ‘utaratibu uliowekwa kwa ajili ya sadaka hizo’ ukitumiwa ili kufanya kiwakilishi cha Kiebrania kiwe wazi kwa kawaida katika Kiswahili. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
