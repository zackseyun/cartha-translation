  text: וּ/בַ/יּ֧וֹם הַ/שְּׁבִיעִ֛י פָּרִ֥ים שִׁבְעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/032.yaml
  text: 'And on the seventh day: seven bulls[a], two rams, and fourteen one-year-old lambs without blemish.'
translation:
  language: sw
  text: 'Na siku ya saba: mafahali saba, kondoo dume wawili, na wanakondoo kumi na wanne wenye umri wa mwaka mmoja wasio na dosari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁבִיעִי
  choice: Na siku ya saba
  rationale: Kiunganishi וּ kinaendeleza mfululizo wa siku za sikukuu; muundo huu ni wa kawaida katika Kiswahili na unahifadhi uhusiano na mistari iliyotangulia.
- source_word: פָּרִים שִׁבְעָה
  choice: mafahali saba
  rationale: Katika orodha za dhabihu, פָּרִים humaanisha mafahali; umri wao haujaelezwa wazi katika mstari huu.
- source_word: אֵילִם שְׁנָיִם
  choice: kondoo dume wawili
  rationale: אַיִל ni kondoo dume, hasa katika muktadha wa dhabihu.
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: wanakondoo kumi na wanne
  rationale: כְּבָשִׂים humaanisha wanakondoo; idadi imetolewa kwa namna ya kawaida ya Kiswahili.
- source_word: בְּנֵי שָׁנָה
  choice: wenye umri wa mwaka mmoja
  rationale: Nahau ya Kiebrania, kihalisi ‘wana wa mwaka,’ hueleza wanyama wenye umri wa mwaka mmoja.
- source_word: תְּמִימִם
  choice: wote wasio na dosari
  rationale: Katika muktadha wa dhabihu, neno hili hueleza wanyama kamili, wasiokuwa na kasoro ya kuwafanya wasifae kutolewa; ‘wasio na dosari’ ni wazi na ya kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Neno ‘wote’ linaonyesha wazi kuwa kivumishi cha mwisho kinawahusu wanyama wote waliotajwa, kama matumizi ya wingi wa kiume katika Kiebrania yanavyodokeza.
