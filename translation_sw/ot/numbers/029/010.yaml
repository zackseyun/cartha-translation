lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: sehemu ya kumi
  rationale: Kirai kilichorudiwa kinaonyesha kipimo cha sehemu ya kumi kwa kila mnyama. Kiswahili cha kawaida hakihitaji kurudia nomino; kipimo chenyewe kimeachwa bila kuongeza ‘ya efa’ katika maandishi, kwa kuwa maneno hayo hayapo wazi katika mstari huu.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: kwa kila mwanakondoo
  rationale: 'Ingawa kwa muundo wa karibu ni ‘kwa mwanakondoo mmoja,’ katika orodha hii lina nguvu ya ugawaji: kipimo hicho ni kwa kila mnyama.'
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: kwa wale wanakondoo saba
  rationale: ‘Wale’ huakisi uainishaji wa Kiebrania na kuunganisha kirai hiki na wanakondoo saba waliotajwa tayari katika muktadha.
