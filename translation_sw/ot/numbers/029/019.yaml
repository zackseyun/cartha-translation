translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sheria ya sadaka umehifadhiwa kwa uwazi; wingi usiotarajiwa mwishoni umeachwa katika matini na kufafanuliwa kwa tanbihi.
