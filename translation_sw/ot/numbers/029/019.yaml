  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and their drink offerings.
translation:
  language: sw
  text: na mbuzi dume mmoja, kwa ajili ya sadaka ya dhambi, mbali na sadaka ya kawaida ya kuteketezwa na sadaka yake ya nafaka na sadaka zao za kinywaji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “sadaka zao za kinywaji.” Wingi huo huenda unarejelea sadaka za kinywaji zinazohusiana na mkusanyiko wa sadaka zilizoagizwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: na beberu mmoja wa mbuzi
  rationale: Kirai hiki ni usemi wa kawaida wa sadaka unaomaanisha mbuzi dume; “beberu mmoja wa mbuzi” ni wazi na huhifadhi idadi iliyotajwa.
- source_word: חַטָּאת
  choice: kuwa sadaka ya dhambi
  rationale: Katika sheria za sadaka, neno hili hutaja sadaka ya dhambi, si dhambi kwa maana ya jumla.
- source_word: מִ/לְּ/בַד
  choice: pamoja na
  rationale: Hapa linaonyesha kwamba sadaka hii ilitolewa kwa kuongezea sadaka ya kawaida; “pamoja na” ni Kiswahili cha kawaida na wazi.
- source_word: עֹלַת הַ/תָּמִיד
  choice: sadaka ya kawaida ya kuteketezwa
  rationale: תמיד hueleza sadaka iliyowekwa kutolewa kwa ukawaida; “ya kawaida” ni ya asili kwa msomaji wa sasa kuliko tafsiri sisisi “ya daima,” ambayo inaweza kudokeza kwamba ilikuwa ikiungua bila kukoma.
- source_word: וּ/מִנְחָתָ/הּ
  choice: na sadaka yake ya nafaka
  rationale: Katika muktadha huu מנחה ni sadaka ya nafaka, na kiambishi cha umoja wa kike kinarejelea sadaka ya kuteketezwa.
- source_word: וְ/נִסְכֵּי/הֶם
  choice: na sadaka zao za kinywaji
  rationale: Nomino na kiambishi chake ni vya wingi katika Kiebrania; wingi umehifadhiwa badala ya kusawazishwa kuwa umoja.
