  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁלֹשָׁ֥ה עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִ֥ם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/013.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: thirteen bulls from the herd, two rams, and fourteen male lambs a year old; they shall be without blemish.'
translation:
  language: sw
  text: 'Nanyi mtatoa sadaka ya kuteketezwa, sadaka ya moto, harufu ya kupendeza[a] kwa Yahweh: ng’ombe dume kumi na watatu, kondoo dume wawili, na wanakondoo dume kumi na wanne wenye umri wa mwaka mmoja; wote watakuwa bila dosari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “harufu ya kutuliza” au “harufu tamu.” Nahau ya Kiebrania רֵיחַ נִיחֹחַ huonyesha kwamba sadaka inakubalika kwa Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Nanyi mtatoa
  rationale: Hifili ya קרב katika muktadha wa dhabihu humaanisha kutoa au kuwasilisha sadaka; “mtatoa” ni ya kawaida na wazi katika Kiswahili.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni istilahi inayoeleweka kwa sadaka iliyoteketezwa yote; inaeleza aina ya dhabihu bila kutegemea etimolojia ya “kupanda.”
- source_word: אִשֵּׁה
  choice: sadaka iliyotolewa kwa moto
  rationale: Huhifadhi maana ya kitu kinachotolewa kwa njia ya moto na hutofautisha maelezo hayo na jina la sadaka ya kuteketezwa.
- source_word: רֵיחַ נִיחֹחַ
  choice: yenye harufu inayompendeza
  rationale: Ni nahau inayoonyesha kwamba sadaka inakubalika kwa Mungu; tafsiri hii ni ya asili huku ikihifadhi taswira ya harufu.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Huwakilisha jina la agano יהוה moja kwa moja badala ya kulibadilisha kuwa cheo.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: mafahali ... kutoka kundini
  rationale: Huhifadhi maana ya mafahali wa ng’ombe bila kuongeza dai lisilo hakika kwamba lazima wawe wachanga.
- source_word: אֵילִם
  choice: kondoo dume
  rationale: Ni neno la kawaida la Kiswahili kwa kondoo wa kiume waliokomaa katika orodha ya dhabihu.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: wanakondoo dume ... wenye umri wa mwaka mmoja
  rationale: Huhifadhi jinsia ya kiume iliyo katika כְּבָשִׂים na maelezo ya umri kwa Kiswahili cha kawaida.
- source_word: תְּמִימִם
  choice: bila dosari
  rationale: Katika muktadha wa dhabihu, neno hilo humaanisha kutokuwa na kasoro inayofanya mnyama asistahili kutolewa.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la pekee יהוה; “Yahweh” hulihifadhi kama jina badala ya cheo.
- issue: Maana ya nahau רֵיחַ נִיחֹחַ
  choice: harufu inayompendeza Yahweh
  alternative: harufu ya kutuliza au harufu tamu
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania na maana ya kukubalika kwa sadaka bila kudai kwamba kusudi lake ni kumtuliza Mungu kutoka katika ghadhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa baada ya orodha ili kuepuka uzito, huku wingi wa תְּמִימִם ukionyeshwa kwa “Wote.” Hakuna tanbihi iliyoongezwa kwa kuwa maelezo ya nahau yanaweza kutolewa wazi katika maandishi yenyewe bila kuvuruga maana.
