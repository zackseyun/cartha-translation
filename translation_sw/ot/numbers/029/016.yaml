base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/016.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: sw
  text: na mbuzi dume mmoja kuwa sadaka ya dhambi[a], mbali na sadaka ya kuteketezwa ya daima, sadaka yake ya nafaka, na sadaka yake ya kinywaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso” badala ya “sadaka ya dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: beberu wa mbuzi
  rationale: Kirai hiki humaanisha mbuzi dume wa kutolewa dhabihu. ‘Beberu wa mbuzi’ ni usemi wazi wa Kiswahili unaohifadhi jinsia ya mnyama.
- source_word: אֶחָד
  choice: mmoja
  rationale: Ni namba inayotaja idadi ya mnyama mmoja; upatanisho wa ngeli unahitaji ‘mmoja’.
- source_word: חַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika muktadha wa ibada, neno hili linamaanisha sadaka, si dhambi kwa maana ya dhana tu. ‘Sadaka ya dhambi’ ni tafsiri inayotambulika sana, huku ‘sadaka ya utakaso’ ikiwa mbadala unaowezekana.
- source_word: מִלְּבַד
  choice: zaidi ya
  rationale: Huonyesha kwamba sadaka hii inaongezwa juu ya sadaka iliyowekwa ya kawaida.
- source_word: עֹלַת הַתָּמִיד
  choice: sadaka ya kawaida ya kuteketezwa
  rationale: Kirai hiki hurejelea sadaka ya kuteketezwa iliyotolewa kwa utaratibu unaoendelea. ‘Ya kawaida’ huwasilisha kurudiwa kwake kwa lugha ya sasa na iliyo wazi.
- source_word: מִנְחָתָהּ
  choice: sadaka yake ya nafaka
  rationale: Katika muktadha wa dhabihu, מִנְחָה ni sadaka ya nafaka. Kiambishi cha nafsi ya tatu kike hurejelea sadaka ya kuteketezwa.
- source_word: וְנִסְכָּהּ
  choice: na sadaka yake ya kinywaji
  rationale: Neno hili ni sadaka iliyomiminwa inayoambatana na dhabihu; ‘sadaka ya kinywaji’ ni istilahi wazi na inayofahamika.
theological_decisions:
- issue: Maana ya חַטָּאת katika ibada ya dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Maana zote mbili zinaungwa mkono katika mjadala wa kiibada. Matini kuu hutumia istilahi iliyozoeleka zaidi bila kuficha uwezekano wa maana ya utakaso, ambao umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha ya dhabihu umehifadhiwa, na ‘pamoja na’ imewekwa ili kuonyesha wazi kwamba sadaka za nafaka na kinywaji zinaandamana na sadaka ya kawaida ya kuteketezwa.
