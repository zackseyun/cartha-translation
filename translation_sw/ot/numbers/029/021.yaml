  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: sw
  text: na sadaka yao ya nafaka na sadaka zao za vinywaji kwa mafahali, kwa kondoo dume, na kwa wanakondoo, kulingana na idadi yao, kwa kanuni iliyowekwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na kanuni.” Neno la Kiebrania linamaanisha kanuni au utaratibu rasmi uliowekwa kwa ajili ya sadaka hizi.
