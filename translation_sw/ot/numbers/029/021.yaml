lexical_decisions:
- source_word: מִנְחָתָם
  choice: sadaka zao za nafaka
  rationale: Katika muktadha wa dhabihu, מִנְחָה ni sadaka ya nafaka inayoandamana na dhabihu za wanyama. Wingi wa Kiswahili unafaa kwa sadaka zinazohusiana na wanyama waliotajwa.
- source_word: נִסְכֵּיהֶם
  choice: sadaka zao za kinywaji
  rationale: נֶסֶךְ ni sadaka ya kimiminiko inayomiminwa; “sadaka za kinywaji” ni istilahi wazi na inayoeleweka katika Kiswahili cha Biblia.
- source_word: לַפָּרִים
  choice: kwa ajili ya mafahali
  rationale: פָּרִים humaanisha mafahali katika orodha za dhabihu; chanzo hakiongezi wazi kwamba ni wachanga.
- source_word: לָאֵילִם
  choice: kondoo dume
  rationale: אַיִל katika muktadha wa dhabihu ni kondoo dume.
- source_word: וְלַכְּבָשִׂים
  choice: na wanakondoo
  rationale: כֶּבֶשׂ humaanisha mwanakondoo; kutaja jinsia si lazima hapa kwa kuwa haijaainishwa wazi katika kifungu hiki.
- source_word: בְּמִסְפָּרָם
  choice: kulingana na idadi yao
  rationale: Kirai hiki kinaonyesha kwamba sadaka zinapaswa kuambatana na hesabu ya wanyama wa kila aina iliyowekwa.
- source_word: כַּמִּשְׁפָּט
  choice: na utaratibu uliowekwa
  rationale: מִשְׁפָּט hapa ni kanuni au utaratibu rasmi wa ibada, si desturi ya hiari.
