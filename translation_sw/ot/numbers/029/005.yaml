  yaml_path: translation/ot/numbers/029/005.yaml
  text: and one male goat for a sin offering[a], to make atonement for you—
translation:
  language: sw
  text: na mbuzi dume mmoja kwa sadaka ya dhambi, ili kufanya upatanisho[a] kwa ajili yenu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili kufanya kafara kwa ajili yenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: na mbuzi dume mmoja
  rationale: Kirai שְׂעִיר עִזִּים humaanisha mbuzi wa kiume, na אֶחָד hutaja idadi yake. Mpangilio huu ni wa kawaida na wazi katika Kiswahili.
- source_word: חַטָּאת
  choice: kuwa sadaka ya dhambi
  rationale: Katika muktadha wa ibada za dhabihu, neno hili linataja sadaka ya dhambi, si dhambi kwa maana ya jumla. ‘Kuwa’ huunganisha kirai hiki kwa kawaida katika orodha ya sadaka.
- source_word: לְ/כַפֵּר
  choice: ili kufanya upatanisho
  rationale: Kitenzi כפר katika muktadha wa kikuhani kina maana pana ya ibada ya kufanya upatanisho au kufidia. ‘Kufanya upatanisho’ huhifadhi uzito wa kidini bila kufafanua kwa lazima jinsi upatanisho huo unavyotendeka.
- source_word: עֲלֵי/כֶם
  choice: kwa ajili yenu
  rationale: Hapa עַל huonyesha watu ambao upatanisho unafanywa kwa niaba yao. ‘Kwa ajili yenu’ ni Kiswahili cha kawaida na sahihi.
theological_decisions:
- issue: Jinsi ya kutafsiri lugha ya כפר katika dhabihu
  choice: ili kufanya upatanisho kwa ajili yenu
  alternative: ili kufanya kafara kwa ajili yenu
  rationale: ‘Kufanya upatanisho’ huhifadhi upana wa dhana ya kikuhani katika Kiebrania bila kuingiza nadharia maalumu ya baadaye kuhusu namna ya upatanisho. ‘Kufanya kafara’ ni mbadala unaosisitiza zaidi kufidiwa au kuondolewa kwa hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Mbuzi dume’ ni wazi kuliko istilahi adimu, na ‘sadaka ya dhambi’ hudumisha msamiati wa ibada. Alama ya tanbihi imewekwa baada ya ‘upatanisho,’ kwa kuwa tanbihi inahusu כפר.
