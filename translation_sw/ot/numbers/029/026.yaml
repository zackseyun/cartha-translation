base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/026.yaml
  text: 'On the fifth day: nine bulls[a], two rams, and fourteen male lambs a year old, without blemish,'
translation:
  language: sw
  text: 'Siku ya tano: fahali tisa[a], kondoo dume wawili, na wanakondoo dume kumi na wanne wenye umri wa mwaka mmoja, wasio na kasoro,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na siku ya tano.” Kiebrania kina kiunganishi mwanzoni mwa mstari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם
  choice: Siku ya
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha wakati katika mfululizo wa maagizo ya dhabihu. Kiunganishi cha Kiebrania kinaeleweka kutokana na mfululizo, huku uwezekano wa kukitaja wazi ukihifadhiwa katika tanbihi.
- source_word: הַ/חֲמִישִׁי
  choice: tano
  rationale: Ni namba ya mpangilio inayofafanua siku; katika Kiswahili, 'siku ya tano' ni muundo wa kawaida.
- source_word: פָּרִים
  choice: fahali
  rationale: Katika muktadha wa dhabihu, neno hili humaanisha fahali; hakuna ulazima wa kuongeza 'wachanga' kutokana na mstari huu pekee.
- source_word: תִּשְׁעָה
  choice: tisa
  rationale: Namba ya idadi inayohusu fahali.
- source_word: אֵילִם
  choice: kondoo dume
  rationale: Hili ndilo neno la kawaida na wazi la Kiswahili kwa kondoo wa kiume katika orodha za dhabihu.
- source_word: שְׁנָיִם
  choice: wawili
  rationale: Namba ya idadi inayopatana kisarufi na viumbe hai, yaani kondoo dume.
- source_word: כְּבָשִׂים
  choice: wanakondoo dume
  rationale: Neno la Kiebrania humaanisha wanakondoo na katika matumizi ya dhabihu mara nyingi huonyesha wa kiume; kutaja 'dume' kunahifadhi umahususi huo.
- source_word: בְּנֵי שָׁנָה
  choice: wenye umri wa mwaka mmoja
  rationale: Ni tafsiri ya asili na iliyo wazi ya nahau ya Kiebrania inayotaja umri wa wanyama.
- source_word: אַרְבָּעָה עָשָׂר
  choice: kumi na wanne
  rationale: Namba ya idadi inayohusu wanakondoo, kwa upatanisho wa kawaida wa Kiswahili.
- source_word: תְּמִימִם
  choice: wote wasio na kasoro
  rationale: Katika muktadha wa dhabihu, neno hili humaanisha wanyama wasio na dosari ya kuwafanya wasifae; 'wasio na kasoro' ni wazi na ya kawaida.
