  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵ֥י עֶשְׂרֹנִ֖ים לָ/אָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/003.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], two-tenths for the ram.'
translation:
  language: sw
  text: 'Na sadaka yao ya nafaka itakuwa unga laini uliochanganywa na mafuta: sehemu tatu za kumi kwa ajili ya fahali[a], na sehemu mbili za kumi kwa ajili ya kondoo dume.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno ya Kiebrania “sehemu tatu za kumi” na “sehemu mbili za kumi” yanamaanisha sehemu za kumi za efa, kipimo cha vitu vikavu kilichotumiwa katika mfumo wa dhabihu wa Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Na sadaka yao ya nafaka itakuwa
  rationale: Katika muktadha wa dhabihu, מִנְחָה ni sadaka ya nafaka, si sadaka kwa ujumla. Kiunganishi וּ kimetafsiriwa “Na,” na sentensi ya Kiebrania isiyo na kitenzi wazi imewasilishwa kwa “itakuwa” ili Kiswahili kiwe cha kawaida.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Neno hili humaanisha unga bora uliosagwa vizuri uliotumiwa katika sadaka; “unga laini” ni wazi na la kawaida katika Kiswahili.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Kirai hiki kinaeleza unga uliotayarishwa kwa kuchanganywa na mafuta; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: sehemu tatu za kumi
  rationale: עִשָּׂרוֹן ni kipimo cha sehemu moja ya kumi ya efa. Maandishi yanahifadhi idadi, huku tanbihi ikifafanua kipimo kilichokusudiwa.
- source_word: לַפָּר
  choice: kwa ajili ya fahali
  rationale: פַּר humaanisha fahali katika muktadha wa dhabihu; umoja wa Kiebrania umehifadhiwa.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: sehemu mbili za kumi
  rationale: Idadi na kipimo cha Kiebrania zimehifadhiwa kwa lugha inayoeleweka, huku kipimo cha efa kikielezwa katika tanbihi.
- source_word: לָאָיִל
  choice: kwa ajili ya kondoo dume
  rationale: אַיִל ni kondoo dume, hasa katika muktadha wa dhabihu; umoja umehifadhiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unafuata kwa karibu mpangilio wa Kiebrania lakini unasomeka kwa kawaida. Alama ya tanbihi imewekwa baada ya “fahali” ili kufafanua vipimo vyote viwili.
