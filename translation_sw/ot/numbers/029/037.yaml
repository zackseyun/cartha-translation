    issue: Possessive mismatch in “sadaka yake ya nafaka.”
    rationale: 'מִנְחָתָם has a third-person masculine plural suffix. The singular noun is collective, but the possessive should refer to the plural sacrificial animals: “sadaka yao ya nafaka.”'
  - severity: low
    issue: “Kama ilivyoagizwa” is less explicit than the Hebrew procedural term.
    rationale: כַּמִּשְׁפָּט denotes conformity to an established rule or prescribed procedure. “Kulingana na utaratibu uliowekwa” directly preserves this sense.
