base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/037.yaml
  text: and their grain offering and their drink offerings for the bull[a], for the ram, and for the lambs, according to their number, according to the ordinance.
translation:
  language: sw
  text: na sadaka yao ya nafaka na sadaka zao za kinywaji kwa ajili ya fahali, kondoo dume, na wana-kondoo, kulingana na idadi yao, kulingana na utaratibu uliowekwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָתָם
  choice: sadaka yake ya nafaka
  rationale: Katika muktadha wa dhabihu, מִנְחָה ni sadaka ya nafaka. Kiambishi cha Kiebrania ni umoja wa pamoja unaorejelea kundi la wanyama, kwa hiyo umoja umehifadhiwa.
- source_word: וְנִסְכֵּיהֶם
  choice: na sadaka zao za kinywaji
  rationale: נֶסֶךְ ni sadaka ya kimiminika inayomiminwa pamoja na dhabihu; usemi huu ni wazi na wa kawaida katika Kiswahili cha Biblia.
- source_word: לַפָּר
  choice: kwa ajili ya fahali
  rationale: פַּר humaanisha fahali wa ng'ombe; neno la Kiebrania hapa halilazimishi kuongeza sifa ya umri.
- source_word: לָאַיִל
  choice: kondoo dume
  rationale: אַיִל humaanisha kondoo dume katika orodha za dhabihu.
- source_word: וְלַכְּבָשִׂים
  choice: na wana-kondoo
  rationale: כֶּבֶשׂ humaanisha mwana-kondoo, mara nyingi dume katika matumizi ya dhabihu; jinsia tayari inaeleweka kutokana na muktadha mpana.
- source_word: בְּמִסְפָּרָם
  choice: kulingana na idadi yao
  rationale: Kirai kinaonyesha kwamba sadaka zinapaswa kuambatana na hesabu ya wanyama waliotajwa.
- source_word: כַּמִּשְׁפָּט
  choice: kama ilivyoagizwa
  rationale: מִשְׁפָּט hapa ni kanuni au utaratibu uliowekwa kisheria kwa sadaka hizi; tafsiri hii ni ya kawaida, wazi na bado inaonyesha ulazima wa agizo.
