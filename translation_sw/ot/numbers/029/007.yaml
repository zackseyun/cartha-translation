base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/007.yaml
  text: On the tenth day of this seventh month[a], there shall be a holy convocation for you, and you shall afflict yourselves; you shall do no work at all.
translation:
  language: sw
  text: Siku ya kumi ya mwezi huu wa saba[a] mtakuwa na kusanyiko takatifu, nanyi mtajinyima; msifanye kazi yoyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtajitesa” au “mtajinyenyekeza.” Kihalisi, nahau ya Kiebrania inasema “mtazitesa nafsi zenu”; ni usemi wa kiibada unaohusishwa na kujinyima, hasa kwa kufunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶעָשׂוֹר
  choice: Siku ya kumi
  rationale: Muundo wa Kiebrania unaonyesha tarehe ya kalenda; Kiswahili huongeza kwa kawaida neno “siku” ili maana hiyo iwe wazi.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: ya mwezi huu wa saba
  rationale: Huhifadhi mpangilio wa mwezi pamoja na kiashiria הַזֶּה (“huu”) kwa Kiswahili cha kawaida.
- source_word: מִקְרָא קֹדֶשׁ
  choice: kusanyiko takatifu
  rationale: Ni usemi rasmi wa ibada unaomaanisha mkutano mtakatifu ulioitishwa; “kusanyiko takatifu” ni wazi na wenye hadhi katika Kiswahili.
- source_word: יִהְיֶה לָכֶם
  choice: mtakuwa na
  rationale: Huwasilisha kwa njia ya kawaida ya Kiswahili kwamba watu watakuwa na kusanyiko hilo, huku ikidumisha maana ya לָכֶם.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: nanyi mtajinyima
  rationale: Katika muktadha huu wa kiibada, usemi huo unahusu kujitesa au kujinyima, hasa kwa kufunga. “Mtajinyima” ni wa asili kwa Kiswahili na hauufanyi usemi kuwa hali ya ndani tu.
- source_word: נַפְשֹׁתֵיכֶם
  choice: nafsi zenu (katika tanbihi); kiwakilishi cha kujirejelea katika “mtajinyima”
  rationale: Neno hilo kihalisi ni “nafsi zenu,” lakini ndani ya nahau hii linawarejelea watu wenyewe; kitenzi cha kujirejelea huepuka kuingiza mgawanyo usiokusudiwa kati ya mwili na nafsi.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: msifanye kazi yoyote
  rationale: Amri hasi pamoja na כָּל inaweka katazo kamili; “kazi yoyote” huonyesha upeo huo kwa Kiswahili fasaha.
theological_decisions:
- issue: Tafsiri ya nahau ya kiibada וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: mtajinyima
  alternative: mtajitesa; mtajinyenyekeza
  rationale: “Mtajinyima” huhifadhi wazo la kujinyima katika Siku ya Upatanisho bila kulifunga kwa kufunga pekee. “Mtajitesa” ni ya karibu zaidi na maana ya moja kwa moja lakini inaweza kusikika kama kujidhuru, nayo “mtajinyenyekeza” inaweza kulainisha mno tendo la kiibada linaloamriwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri ni mfupi na wa moja kwa moja; tanbihi huhifadhi maana ya moja kwa moja na njia mbadala za nahau tata.
