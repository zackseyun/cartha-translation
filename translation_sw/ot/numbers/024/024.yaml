  text: וְ/צִים֙ מִ/יַּ֣ד כִּתִּ֔ים וְ/עִנּ֥וּ אַשּׁ֖וּר וְ/עִנּוּ עֵ֑בֶר וְ/גַם ה֖וּא עֲדֵ֥י אֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/024.yaml
  text: But ships shall come from the coast of Kittim[a], and they shall afflict Asshur, and they shall afflict Eber[d][c][b]; and he too shall come to destruction.
translation:
  language: sw
  text: Lakini meli zitakuja kutoka upande wa Kitimu[a]; zitaitesa Ashuru[b], na zitaitesa Eberi[c]. Yeye[d] pia ataishia katika maangamizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitimu huenda ikamaanisha hasa Kipro, au kwa upana zaidi mataifa ya magharibi yaliyosafiri baharini.
    reason: alternative_reading
  - marker: b
    text: Ashuru pia inaweza kutafsiriwa kuwa “dola ya Ashuru.”
    reason: lexical_alternative
  - marker: c
    text: Eberi huenda likawa jina la watu, likawarejelea Waebrania, au likamaanisha watu walio “ng’ambo” ya mpaka fulani, kama vile Mto Frati.
    reason: alternative_reading
  - marker: d
    text: Kiebrania kinasema “yeye pia.” Haijulikani wazi “yeye” ni nani; wengine hulielewa neno hilo kwa maana ya pamoja kama “hiyo pia,” au kuwa linamrejelea mtawala anayewakilisha mamlaka kutoka Kitimu.
    reason: alternative_reading
lexical_decisions:
- source_word: צִים
  choice: meli
  rationale: Nomino hii humaanisha vyombo vya baharini. “Meli” ni tafsiri ya kawaida na haiongezi dhana ya kundi la meli au meli za vita.
- source_word: מִיַּד
  choice: kutoka upande wa
  rationale: Ingawa maana ya neno kwa neno ni “kutoka mkononi mwa,” katika usemi wa kijiografia linaweza kumaanisha upande au eneo la mahali fulani. “Kutoka upande wa” ni Kiswahili cha kawaida na huhifadhi upana wa usemi huo bila kulazimisha maana ya pwani.
- source_word: כִּתִּים
  choice: Kitimu
  rationale: Jina hili limeendelezwa kwa namna inayofaa Kiswahili ili kutohitimisha kama linamaanisha hasa Kipro au kwa upana zaidi mataifa ya magharibi yanayosafiri baharini.
- source_word: וְעִנּוּ
  choice: zitaitesa
  rationale: Kitenzi ענה katika piel kinaweza kumaanisha kutesa, kunyenyekeza, au kuonea. “Kutesa” huhifadhi maana pana ya kuwapatisha taabu bila kubainisha aina ya ushindi au ukandamizaji.
- source_word: אַשּׁוּר
  choice: Ashuru
  rationale: Hili ndilo jina lililo katika Kiebrania; linahifadhi uwezekano wa kumaanisha nchi, watu, au mamlaka badala ya kulifafanua moja kwa moja kuwa Ashuru ya kisiasa.
- source_word: עֵבֶר
  choice: Eberi
  rationale: Kutumia jina “Eberi” huhifadhi utata wa rejeo, ambalo linaweza kueleweka kama jina la watu, Waebrania, au watu walio ng’ambo ya mpaka fulani.
- source_word: וְגַם הוּא
  choice: Yeye pia
  rationale: Kiwakilishi cha Kiebrania ni cha kiume na umoja. “Yeye pia” huakisi sarufi hiyo bila kubainisha rejeo lake lisilo wazi.
- source_word: עֲדֵי אֹבֵד
  choice: ataishia katika maangamizi
  rationale: Usemi huu unaelekeza kwenye mwisho wa kuangamia. Tafsiri hii ni ya asili katika Kiswahili na haiongezi wazo la adhabu ya milele ambalo halijasemwa wazi.
theological_decisions:
- issue: Utambulisho wa Kitimu, Ashuru, Eberi, na rejeo la kiwakilishi cha mwisho
  choice: Kuhifadhi majina Kitimu, Ashuru, na Eberi, na kutafsiri kiwakilishi cha mwisho kwa umoja kama “yeye” bila kumtambulisha anayerejelewa.
  alternative: Kitimu inaweza kufasiriwa kuwa Kipro au mataifa ya magharibi ya baharini; Ashuru kuwa dola ya Ashuru; Eberi kuwa Waebrania au watu wa ng’ambo ya Frati; na “yeye” kuwa Kitimu kwa pamoja, mtawala wake, au mamlaka nyingine.
  rationale: Unabii huu una marejeo ya kihistoria yanayobishaniwa. Kuhifadhi majina na kiwakilishi cha umoja huzuia tafsiri isiamue jambo ambalo Kiebrania hakiliweki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “kutoka upande wa” umechaguliwa ili kuhifadhi upana wa nahau ya kijiografia ya Kiebrania; majina ya kale yameendelezwa kama Kitimu, Ashuru, na Eberi. Kiwakilishi cha mwisho kimeachwa katika umoja ili kuhifadhi utata wa matini.
