base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/020.yaml
  text: 'Then he saw Amalek and took up his discourse and said: “Amalek was the first of the nations[c][b][a], but his end is utter destruction.”'
translation:
  language: sw
  text: "Kisha akamwona Amaleki, akatoa usemi wake[b], akasema:\n\n“Amaleki alikuwa wa kwanza kati ya mataifa[a],\n lakini mwisho wake ni kuangamia kabisa[c].”"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkuu miongoni mwa mataifa”; kirai cha Kiebrania kinaweza kumaanisha kutangulia kwa wakati au kuwa wa kwanza kwa hadhi.
    reason: lexical_alternative
  - marker: b
    text: Au “akatoa unabii wake” au “akatamka mithali yake”; neno la Kiebrania linaweza kumaanisha usemi wa kishairi, mithali, kejeli, au unabii.
    reason: lexical_alternative
  - marker: c
    text: Au “mwisho wake ni maangamizi” au “hatimaye ataangamia”; kirai cha Kiebrania ni kifupi na kinakazia uharibifu kamili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֶת־עֲמָלֵק
  choice: Kisha akamwona Amaleki
  rationale: Kitenzi ראה kina maana ya kawaida ya ‘kuona,’ na ‘kisha’ kinaonyesha mwendelezo wa simulizi unaowakilishwa na waw-consecutive. Jina Amaleki hapa linawakilisha taifa hilo kwa ujumla.
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: akatamka usemi wake
  rationale: מָשָׁל linaweza kumaanisha mithali, usemi wa kishairi, kejeli, au unabii. ‘Usemi’ ni neno pana na la kawaida linaloepuka kulazimisha aina moja maalumu ya matamko ya Balaamu.
- source_word: רֵאשִׁית גּוֹיִם
  choice: wa kwanza kati ya mataifa
  rationale: רֵאשִׁית linaweza kuonyesha kutangulia kwa wakati au kuwa mkuu kwa hadhi. Tafsiri hii ni fupi na inaacha uwezekano huo wazi, huku tanbihi ikieleza maana nyingine.
- source_word: עֲמָלֵק
  choice: Amaleki
  rationale: Jina hili limetoholewa kwa namna iliyozoeleka katika Kiswahili; katika muktadha huu linataja taifa au watu wa Amaleki kwa jina la pamoja.
- source_word: וְאַחֲרִיתוֹ
  choice: lakini mwisho wake
  rationale: אַחֲרִיתוֹ linaonyesha mwisho, matokeo ya baadaye, au hatima yake. ‘Lakini’ linaweka wazi utofautishaji uliopo kati ya hadhi ya kwanza na mwisho wa uharibifu.
- source_word: עֲדֵי אֹבֵד
  choice: ni kuangamia kabisa
  rationale: Kirai cha Kiebrania ni kifupi na kinaelekeza kwenye kuangamia au uharibifu kamili. ‘Kabisa’ huwasilisha ukamilifu wa maangamizi bila kuongeza wazo la ‘milele,’ ambalo halijaelezwa moja kwa moja.
theological_decisions:
- issue: Maana ya hadhi ya Amaleki katika רֵאשִׁית גּוֹיִם
  choice: Kudumisha uwezekano wa kutangulia kwa wakati au kuwa mkuu miongoni mwa mataifa
  alternative: Amaleki alikuwa taifa la kwanza; au Amaleki alikuwa mkuu kuliko mataifa mengine
  rationale: Kiebrania hakiamui wazi ikiwa רֵאשִׁית hapa linahusu mwanzo wa kihistoria au ukuu wa hadhi. Tafsiri kuu haiongezi hitimisho la kihistoria au kiteolojia lisilothibitishwa na mstari wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mistari ya kishairi imehifadhiwa, na msamiati umechaguliwa ili kutolazimisha aina maalumu ya מָשָׁל wala kuondoa utata wa רֵאשִׁית.
