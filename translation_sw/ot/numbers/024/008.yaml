base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/008.yaml
  text: God brings him out of Egypt[a]; he has for him the horns of a wild ox. He will consume the nations that are his adversaries[b], and will gnaw their bones and crush them with his arrows.
translation:
  language: sw
  text: Mungu anamtoa kutoka Misri; ana pembe kama za fahali wa mwituni.[a] Atayameza mataifa yaliyo maadui zake, atafuna mifupa yao,[b] na kuwaponda kwa mishale yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ana nguvu kama za fahali wa mwituni.” Kirai cha Kiebrania כְּתוֹעֲפֹת רְאֵם ni kigumu; tafsiri za jadi mara nyingi hutoa maana ya jumla ya nguvu badala ya kutaja pembe waziwazi.
    reason: lexical_alternative
  - marker: b
    text: Au “atavunja mifupa yao” au “ataikwangua mifupa yao na kuiacha wazi.” Kitenzi cha Kiebrania יְגָרֵם ni nadra, na kivuli chake kamili cha maana hakina uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Mungu
  rationale: Hapa nomino hii humtaja Mungu kama mtendaji wa ukombozi; “Mungu” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: מוֹצִיאוֹ
  choice: anamtoa
  rationale: Kauli ya wakati wa sasa inadumisha nguvu hai ya kirai cha Kiebrania chenye umbo la kushiriki, yaani ‘yule anayemtoa.’ Kiambishi cha yambwa -m- kinahifadhi rejeo la umoja bila kulifafanua zaidi.
- source_word: מִמִּצְרַיִם
  choice: Misri
  rationale: Katika Kiswahili, “kumtoa Misri” hueleza kwa kawaida kutoka ndani ya nchi hiyo bila kuhitaji neno “kutoka.”
- source_word: כְּתוֹעֲפֹת רְאֵם
  choice: pembe kama za fahali wa mwituni
  rationale: Kirai hiki ni kigumu, lakini kinaweza kuonyesha pembe au nguvu iliyoinuka ya mnyama huyo. “Fahali wa mwituni” huepuka tafsiri isiyo sahihi ya ‘nyati mwenye pembe moja,’ huku tanbihi ikihifadhi uwezekano wa maana ya nguvu.
- source_word: לוֹ
  choice: ana
  rationale: Muundo wa Kiswahili wa umilikaji, “ana pembe,” unawasilisha maana ya Kiebrania kwamba pembe hizo ni zake au ziko kwa ajili yake.
- source_word: יֹאכַל
  choice: atayameza
  rationale: Kitenzi hiki kihalisi huhusu kula; “atayameza” kinadumisha taswira ya kuyaharibu mataifa kama chakula katika ushairi wa kivita.
- source_word: גּוֹיִם צָרָיו
  choice: mataifa yaliyo maadui zake
  rationale: Tafsiri hii inadumisha mataifa kuwa maadui wa mhusika wa umoja, bila kubadili rejeo hilo kuwa wingi.
- source_word: יְגָרֵם
  choice: ataitafuna
  rationale: Kitenzi hiki ni nadra na maana yake kamili haina uhakika. “Kuitafuna” inafaa taswira ya kumeza na kitu chake, yaani mifupa; maana nyingine zinazowezekana zimewekwa katika tanbihi.
- source_word: וְחִצָּיו יִמְחָץ
  choice: na kuwaponda kwa mishale yake
  rationale: “Kuwaponda” huhifadhi ukali wa kitenzi, na “kwa mishale yake” huonyesha mishale kuwa chombo cha tendo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Rejeo la viwakilishi vya umoja katika unabii wa Balaamu
  choice: Rejeo la umoja limehifadhiwa kwa viambishi “-m-,” “ana,” na “zake” bila kutaja wazi anayelengwa.
  alternative: Kulieleza wazi kuwa ni Israeli kwa ujumla, mfalme wa Israeli, au mtu wa Kimasihi.
  rationale: Kiebrania kinatumia maumbo ya umoja, lakini muktadha unaweza kumaanisha Israeli kama umoja wa kijumla au mwakilishi wake wa kifalme. Kutofafanua zaidi kunahifadhi utata na mvutano wa kiteolojia uliomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Taswira kali za kivita na ulaji zimehifadhiwa. “Fahali wa mwituni” ni wazi zaidi kwa msomaji wa sasa kuliko jina la mnyama lisilojulikana au tafsiri ya jadi isiyo sahihi. Alama za tanbihi [a] na [b] zimewekwa mara tu baada ya maneno yanayohusika.
