  yaml_path: translation/ot/numbers/024/003.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened.”'
translation:
  language: sw
  text: 'Kisha akatoa usemi wake, akasema:


    “Tamko la Balaamu mwana wa Beori,


    tamko la mtu ambaye jicho lake limefungwa.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye jicho lake limefunguliwa.” Wengine huelewa maneno haya hivyo kutokana na muktadha wa maono ya kinabii na mapokeo ya kale ya ufasiri, lakini umbo la Kiebrania kwa kawaida humaanisha “limefungwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Kisha akaanza kutoa usemi wake
  rationale: Nahau hii hutanguliza usemi rasmi wa kishairi. Tafsiri hii ni ya asili katika Kiswahili huku ikihifadhi wazo la kuanza kutoa usemi; ‘usemi’ hapa haubani maana kuwa methali tu.
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: Ni kitenzi cha kawaida cha masimulizi kinachomaanisha kusema, na kinadumisha mtiririko wa utangulizi wa Kiebrania.
- source_word: נְאֻם
  choice: tamko la
  rationale: Neno hili huonyesha usemi rasmi au wa kinabii. ‘Tamko’ linaweka uzito huo wazi bila kuchanganya na מָשָׁל iliyotangulia.
- source_word: בִּלְעָם
  choice: Balaamu
  rationale: Hili ni umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: בְּנוֹ בְעֹר
  choice: mwana wa Beori
  rationale: Muundo huu unaonyesha uhusiano wa mwana na baba; ‘Beori’ ni umbo linaloeleweka na lililozoeleka katika Kiswahili.
- source_word: הַגֶּבֶר
  choice: mtu
  rationale: Katika maelezo haya rasmi ya nafsi, ‘mtu’ ni ya kawaida na sahihi; hakuna haja ya kuongeza dhana ya nguvu ambayo si lazima katika muktadha.
- source_word: שְׁתֻם הָעָיִן
  choice: ambaye jicho lake limefungwa
  rationale: Umbo la Kiebrania linaelekea moja kwa moja kwenye maana ya jicho lililofungwa. Kwa kuwa kishazi hiki ni kigumu na kinaweza kueleweka vinginevyo kutokana na muktadha wa maono, tafsiri mbadala imewekwa katika tanbihi.
theological_decisions:
- issue: Maana ya maelezo ya Balaamu שְׁתֻם הָעָיִן
  choice: ambaye jicho lake limefungwa
  alternative: ambaye jicho lake limefunguliwa
  rationale: Maana ya moja kwa moja ya umbo la Kiebrania imehifadhiwa badala ya kulisawazisha kimya kimya na muktadha wa maono. Tafsiri mbadala inayoungwa mkono na muktadha na mapokeo ya kale imeonyeshwa katika tanbihi ili kuhifadhi utata halisi wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishairi na urudiaji wa ‘tamko’ umehifadhiwa.
