translation:
  language: sw
  text: Kwa maana, ikiwa Kaini[a] atateketezwa, itachukua muda gani kabla ya Ashuru[b] kukuchukua mateka?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa jina Kaini huenda linamaanisha Wakeni, na si mtu binafsi Kaini.
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha huu, Ashuru linaweza kumaanisha nchi ya Ashuru au mamlaka ya Kiashuru.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Kwa maana, ikiwa
  rationale: Muunganiko huu unaendeleza uhusiano na unabii uliotangulia huku ukihifadhi maana ya sharti.
- source_word: יִהְיֶה לְבָעֵר
  choice: amekusudiwa kuteketezwa
  rationale: Muundo wa kitenzi ‘kuwa’ pamoja na לְבָעֵר unaonyesha yatakayompata Kaini. ‘Amekusudiwa kuteketezwa’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya utabiri na picha ya kuangamizwa kwa moto bila kuamua kama moto huo ni halisi au wa mfano.
- source_word: קָיִן
  choice: Kaini
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili. Katika muktadha huenda linawakilisha jamii ya Wakeni, jambo linaloelezwa katika tanbihi.
- source_word: עַד מָה
  choice: itachukua muda gani kabla
  rationale: Usemi huu unauliza muda utakaopita kabla ya tukio linalofuata; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: אַשּׁוּר
  choice: Ashuru
  rationale: Jina la asili limehifadhiwa kwa umbo la Kiswahili, bila kuamua katika matini kuu kama linamaanisha nchi ya Ashuru au mamlaka ya Kiashuru.
- source_word: תִּשְׁבֶּךָּ
  choice: haijakuchukua mateka
  rationale: Kitenzi שבה kina maana ya kuteka au kuchukua mateka. Muundo huu unaonyesha wazi kupelekwa katika hali ya utumwa au uhamisho.
