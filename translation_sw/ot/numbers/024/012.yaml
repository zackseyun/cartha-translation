base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/012.yaml
  text: Balaam said to Balak[a], “Did I not also speak to your messengers whom you sent to me[b], saying,”
translation:
  language: sw
  text: Balaamu akamwambia Balaki, “Je, sikuwaambia pia wajumbe wako uliowatuma kwangu[a], nikisema,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawakala wako.” Neno la Kiebrania linaweza kumaanisha wajumbe wa kibinadamu au, katika miktadha mingine, malaika; hapa muktadha unamaanisha wajumbe wa kibinadamu.
    reason: lexical_alternative
  - marker: b
    text: Maneno yanayoanzishwa na “nikisema” yanaendelea katika mstari unaofuata.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Ni namna ya kawaida ya Kiswahili ya kusimulia tendo linalofuatana na kumtaja anayesemeshwa.
- source_word: בִּלְעָם
  choice: Balaamu
  rationale: Jina la mtu limetolewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: אֶל בָּלָק
  choice: Balaki
  rationale: Kiambishi cha yambwa katika ‘akamwambia Balaki’ kinaonyesha wazi kuwa Balaki ndiye anayesemeshwa.
- source_word: הֲלֹא
  choice: Je, sikuwaambia
  rationale: Swali hasi linatarajia jibu la kukubali; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: גַּם
  choice: pia
  rationale: Hudumisha wazo la nyongeza au msisitizo lililomo katika neno la Kiebrania.
- source_word: מַלְאָכֶיךָ
  choice: wajumbe wako
  rationale: Katika muktadha huu ni wajumbe wa kibinadamu waliotumwa na Balaki, si malaika.
- source_word: אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: uliowatuma kwangu
  rationale: Hutoa kwa njia ya asili katika Kiswahili kishazi kinachowabainisha wajumbe.
- source_word: דִּבַּרְתִּי
  choice: sikuwaambia
  rationale: Kitenzi timilifu ni cha kurejelea jambo lililokwisha kusemwa; ‘-ambia’ ni cha kawaida katika Kiswahili kwa kusema jambo kwa watu fulani.
- source_word: לֵאמֹר
  choice: nikisema
  rationale: Kinadumisha fomula ya kuanzisha maneno yaliyonukuliwa, ambayo yanaendelea katika mstari unaofuata.
