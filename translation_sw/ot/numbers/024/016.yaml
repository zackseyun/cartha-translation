  text: נְאֻ֗ם שֹׁמֵ֨עַ֙ אִמְרֵי אֵ֔ל וְ/יֹדֵ֖עַ דַּ֣עַת עֶלְי֑וֹן מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/016.yaml
  text: 'the declaration of one who hears the words of God[a], and knows the knowledge of the Most High, who sees the vision of the Almighty, falling down[b], yet with uncovered eyes:'
translation:
  language: sw
  text: 'tamko la yule anayesikia maneno ya Mungu[a],


    anayejua maarifa ya Aliye Juu Sana,


    anayeona maono ya Mwenyezi,


    akianguka, na macho yake yakiwa wazi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “semi za Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: tamko la
  rationale: Neno hili linaanzisha kauli nzito ya kinabii. “Tamko” ni la kawaida katika Kiswahili cha sasa na linadumisha uzito wa usemi huo.
- source_word: שֹׁמֵעַ
  choice: yule anayesikia
  rationale: Kitenzi-shirikishi cha Kiebrania kinamtambulisha mtu kwa sifa inayoendelea; tafsiri hii ni wazi na ya asili.
- source_word: אִמְרֵי אֵל
  choice: maneno ya Mungu
  rationale: Kirai hiki kinamaanisha maneno au semi zitokazo kwa Mungu; “maneno ya Mungu” ni cha asili na chenye uzito unaofaa.
- source_word: וְיֹדֵעַ דַּעַת עֶלְיוֹן
  choice: anayejua maarifa ya Aliye Juu Zaidi
  rationale: Tafsiri hii inadumisha muundo wa kishairi na utata wa kirai cha Kiebrania, ambacho kinaweza kuelekeza kwenye maarifa yanayomhusu au yanayotoka kwa Aliye Juu Zaidi.
- source_word: מַחֲזֵה שַׁדַּי יֶחֱזֶה
  choice: anayeona maono ya Mwenyezi
  rationale: “Maono” huonyesha ufunuo unaoonekana, na kishazi cha uhusiano kinaunganika kwa kawaida na mistari iliyotangulia.
- source_word: נֹפֵל
  choice: akianguka chini
  rationale: Kitenzi-shirikishi hiki kwa msingi humaanisha kuanguka. Maana ya hali ya njozi haijaingizwa moja kwa moja katika matini bali imeelezwa katika tanbihi.
- source_word: וּגְלוּי עֵינָיִם
  choice: lakini macho yake yakiwa wazi
  rationale: Kiswahili hiki ni cha asili na kinawasilisha picha ya macho yasiyofunikwa au yaliyofunguka; “lakini” huonyesha ulinganisho wa hali ya kuanguka huku bado akiona.
theological_decisions:
- issue: Tafsiri ya majina ya heshima ya Mungu אֵל, עֶלְיוֹן, na שַׁדַּי
  choice: Mungu / Aliye Juu Zaidi / Mwenyezi
  alternative: El / Elyoni / Shaddai
  rationale: Katika muktadha huu maneno hayo yanatumika kama majina ya heshima ya Mungu. Kuyatafsiri kunawasilisha maana yake kwa msomaji wa Kiswahili bila kuyafanya yaonekane kuwa majina binafsi yasiyotafsiriwa.
- issue: Maana ya דַּעַת עֶלְיוֹן
  choice: maarifa ya Aliye Juu Zaidi
  alternative: maarifa kutoka kwa Aliye Juu Zaidi
  rationale: Muundo wa Kiebrania hauamui wazi kama ni maarifa kumhusu Mungu au maarifa yanayotolewa naye. Tafsiri iliyochaguliwa inadumisha utata huo badala ya kuufafanua kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari unadumisha usambamba wa kishairi wa Kiebrania.
