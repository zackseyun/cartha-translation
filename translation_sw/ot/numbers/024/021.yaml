  yaml_path: translation/ot/numbers/024/021.yaml
  text: 'Then he saw the Kenite[a], and he took up his discourse and said: “Your dwelling place is enduring, and your nest is set in the rock.”'
translation:
  language: sw
  text: 'Kisha akawaona Wakeni, akatoa usemi wake[a], akasema:


    “Makao yako ni thabiti,

    na kiota chako kimewekwa mwambani.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tamko lake la kinabii.” Neno la Kiebrania מָשָׁל linaweza kumaanisha methali, usemi wa dhihaka, au tamko la kinabii; hapa linarejelea tamko la kishairi la Balaamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי
  choice: Wakeni
  rationale: Ingawa Kiebrania kina umbo la umoja lenye maana ya mwakilishi wa kundi, Kiswahili cha kawaida hutumia wingi “Wakeni” kwa watu hao kama jamii.
- source_word: מְשָׁלוֹ
  choice: usemi wake
  rationale: Neno מָשָׁל hapa linamaanisha tamko la kishairi lenye uzito katika unabii wa Balaamu. “Usemi wake” ni pana na ya kawaida, huku “ujumbe wake wa kinabii” ikibaki kuwa uwezekano unaofafanuliwa katika tanbihi.
- source_word: אֵיתָן
  choice: thabiti
  rationale: Neno hili linaonyesha uimara, nguvu na usalama wa kudumu. “Thabiti” linafaa kwa makao na linahifadhi wazo la uthabiti bila kulifanya kuwa la kimwili tu.
- source_word: מוֹשָׁבֶךָ
  choice: makao yako
  rationale: Hurejelea mahali pa kuishi au makazi; “makao yako” ni ya kawaida, wazi na yanafaa katika ushairi.
- source_word: וְשִׂים
  choice: kimewekwa
  rationale: Katika mstari huu wa kishairi, umbo hilo linaeleza hali ya kiota. “Kimewekwa” ni Kiswahili cha asili zaidi kuliko kulichukua kama amri ya moja kwa moja.
- source_word: בַּסֶּלַע
  choice: mwambani
  rationale: סֶלַע ni mwamba, jabali au genge la mwamba. “Mwambani” linaendeleza picha ya kiota salama katika sehemu ya mwamba.
- source_word: קִנֶּךָ
  choice: kiota chako
  rationale: Tafsiri halisi “kiota” inahifadhi sitiari ya ndege na usalama wa makao yake.
