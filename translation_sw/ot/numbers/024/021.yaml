translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari umehifadhi mtindo wa kishairi, na picha ya kiota mwambani haijafifishwa.
