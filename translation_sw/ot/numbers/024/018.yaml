  yaml_path: translation/ot/numbers/024/018.yaml
  text: Edom will become a possession[a]; Seir also will become a possession for his enemies[b], while Israel acts valiantly.
translation:
  language: sw
  text: Edomu itakuwa milki; Seiri pia itakuwa milki ya adui zake[a], huku Israeli ikitenda kwa ushujaa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi “adui zake,” kwa kiambishi cha nafsi ya tatu, umoja wa kiume. Wafafanuzi hutofautiana kuhusu ikiwa kiambishi hicho kinamrejelea Seiri au Edomu, au mtawala anayetajwa katika unabii unaozunguka mstari huu.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “hutenda kwa nguvu”; ni msemo unaomaanisha kuonyesha nguvu au kutenda kwa ushujaa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: itakuwa
  rationale: Katika usemi huu wa kinabii, kitenzi hiki kinaeleza hali ya wakati ujao. Kiswahili “itakuwa” ni cha kawaida na kinaweza pia kudokeza kuingia katika hali hiyo.
- source_word: אֱדוֹם
  choice: Edomu
  rationale: Jina la taifa na eneo linalohusishwa na uzao wa Esau; limeandikwa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: יְרֵשָׁה
  choice: milki
  rationale: Neno hilo humaanisha kitu kinachomilikiwa au kutwaliwa. “Milki” linafaa katika muktadha wa ushindi bila kulifanya kuwa urithi wa kifamilia.
- source_word: שֵׂעִיר
  choice: Seiri
  rationale: Ni jina la mahali linalowiana na Edomu. Maandishi hayana neno la wazi la “mlima,” hivyo jina pekee limehifadhiwa.
- source_word: אֹיְבָיו
  choice: adui zake
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya tatu, umoja wa kiume, yaani kihalisi “adui zake.” Tafsiri hii inahifadhi umoja huo bila kutaja wazi mhusika wake.
- source_word: וְיִשְׂרָאֵל
  choice: huku Israeli
  rationale: “Huku” linaonyesha kwa Kiswahili uhusiano wa wakati au hali kati ya kutwaliwa kwa mataifa hayo na kutenda kwa Israeli, huku likihifadhi mtiririko wa kishairi.
- source_word: עֹשֶׂה חָיִל
  choice: ikitenda kwa ushujaa
  rationale: Huu ni msemo unaoeleza kuonyesha nguvu au uhodari. “Kutenda kwa ushujaa” ni Kiswahili cha sasa chenye hadhi na kinahifadhi maana yake ya kivita.
theological_decisions:
- issue: Mhusika anayerejelewa na kiambishi cha umoja katika “adui zake”
  choice: Kiambishi cha umoja wa kiume kimehifadhiwa kama “zake,” bila kutaja mhusika wake moja kwa moja.
  alternative: Kukihusisha na Seiri/Edomu na kutafsiri kwa maana ya “adui zake yenyewe,” au kukihusisha na mtawala wa umoja anayetajwa katika unabii unaozunguka mstari huu.
  rationale: Kiebrania kina umoja wa kiume, lakini mhusika wake anaweza kueleweka kwa njia tofauti. Tafsiri kuu inahifadhi umbo hilo na tanbihi inaweka wazi utata bila kulazimisha uamuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Majina “Edomu,” “Seiri,” na “Israeli” yamehifadhiwa; muundo wa kishairi umeonyeshwa kwa nusu-koloni na kishazi cha “huku.”
