  yaml_path: translation/ot/numbers/024/002.yaml
  text: Then Balaam lifted up his eyes and saw Israel dwelling according to its tribes[b][a], and the Spirit of God came upon him.
translation:
  language: sw
  text: Ndipo Balaamu akainua macho yake, akaiona Israeli ikiwa imepiga kambi kwa makabila yake[a], na Roho wa Mungu akamjia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa imekaa kwa makabila yake,” au “kabila kwa kabila.”
    reason: lexical_alternative
