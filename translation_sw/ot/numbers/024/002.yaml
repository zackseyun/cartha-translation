    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: akainua macho yake
  rationale: Huhifadhi nahau ya Kiebrania ya kuinua macho, ambayo katika muktadha huu humaanisha kutazama juu au kuelekeza macho mahali fulani.
- source_word: וַיַּרְא
  choice: akaiona
  rationale: Kitenzi hiki kinaeleza moja kwa moja kwamba Balaamu aliiona Israeli baada ya kuinua macho yake.
- source_word: שֹׁכֵן
  choice: ikiwa imepiga kambi
  rationale: Katika muktadha wa Israeli iliyopangwa kwa makabila, usemi huu unaeleza hali ya kukaa kambini kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: לִשְׁבָטָיו
  choice: kwa kufuata makabila yake
  rationale: Kihusishi hapa kinaonyesha mpangilio au mgawanyo wa Israeli kulingana na makabila yake.
- source_word: רוּחַ אֱלֹהִים
  choice: Roho wa Mungu
  rationale: Katika muktadha wa unabii, usemi huu kwa kawaida humaanisha Roho wa Mungu anayemwezesha mtu kusema ujumbe wa Mungu, bila kuingiza maelezo ya kiteolojia yasiyosemwa katika mstari.
- source_word: וַתְּהִי עָלָיו
  choice: akaja juu yake
  rationale: Huwasilisha kwa Kiswahili kinachoeleweka wazo la uwepo wa Roho ulioanza kuwa juu ya Balaamu katika wakati huo.
theological_decisions:
- issue: Maana ya רוּחַ אֱלֹהִים katika muktadha wa kuwezeshwa kutoa unabii
  choice: Roho wa Mungu
  alternative: roho ya Mungu
  rationale: Muktadha unaunga mkono rejeo kwa Roho wa Mungu, lakini tanbihi huhifadhi uwezekano wa kutafsiri muundo huo bila kuufanya kuwa jina maalumu.
- issue: Nguvu ya kitenzi וַתְּהִי katika usemi וַתְּהִי עָלָיו
  choice: akaja juu yake
  alternative: alikuwa juu yake
  rationale: Tafsiri kuu inaonyesha kuanza kwa hali hiyo katika mfululizo wa simulizi, huku tanbihi ikihifadhi tafsiri ya moja kwa moja zaidi na tulivu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “akaiona Israeli ikiwa...” huchukulia Israeli kama taifa moja, sambamba na umoja wa kisarufi katika Kiebrania.
