  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ/נְחָלִ֣ים נִטָּ֔יוּ כְּ/גַנֹּ֖ת עֲלֵ֣י נָהָ֑ר כַּ/אֲהָלִים֙ נָטַ֣ע יְהוָ֔ה כַּ/אֲרָזִ֖ים עֲלֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/006.yaml
  text: Like valleys they spread out[a], like gardens beside a river, like aloes that Yahweh has planted, like cedars beside the waters.
translation:
  language: sw
  text: 'Yametandaa kama mabonde,

    kama bustani kando ya mto,

    kama miti ya udi[a] ambayo Yahweh ameipanda,

    kama mierezi kando ya maji.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miti ya manukato.” Neno la Kiebrania hapa hurejelea miti au mbao zenye harufu nzuri, si mahema.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: mabonde
  rationale: Neno נחל linaweza kumaanisha bonde au njia ya maji ya msimu. “Mabonde” ni la kawaida na linafaa katika taswira hii ya kishairi, huku mto na maji katika mistari inayofuata vikidumisha uhusiano wake na maji.
- source_word: נִטָּיוּ
  choice: yanavyotandaa
  rationale: Kitenzi נטה humaanisha kunyoosha au kuenea. “Yanavyotandaa” kinatoa picha ya vitu vilivyoenea kwa upana bila kulazimisha hali tendwa isiyo ya kawaida katika Kiswahili.
- source_word: גַנֹּת
  choice: bustani
  rationale: Hili ni neno la kawaida la Kiswahili kwa maeneo yaliyopandwa na kustawi; umbo lake linaweza kuwakilisha wingi katika muktadha huu.
- source_word: עֲלֵי נָהָר
  choice: kando ya mto
  rationale: על katika kirai hiki huonyesha ukaribu au kuwa sambamba na kitu. “Kando ya mto” ni Kiswahili cha kawaida na hudumisha taswira ya rutuba.
- source_word: אֲהָלִים
  choice: miti ya udi
  rationale: Katika muktadha huu wa kishairi neno hilo hurejelea miti au mbao zenye harufu nzuri, si mahema. “Miti ya udi” huonyesha kwamba ni miti yenye harufu, huku tanbihi ikihifadhi utata wa utambulisho wake wa kibotania.
- source_word: נָטַע
  choice: ameipanda
  rationale: Kauli timilifu ya Kiebrania inaonyesha tendo la Yahweh lenye matokeo yanayoonekana sasa; wakati timilifu wa Kiswahili unafaa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: אֲרָזִים
  choice: mierezi
  rationale: Hili ndilo neno la kawaida kwa cedars na linadumisha taswira ya miti mikubwa, imara na yenye fahari.
- source_word: עֲלֵי מָיִם
  choice: kando ya maji
  rationale: Tafsiri hii huhifadhi wingi wa מָיִם na wazo la miti iliyo karibu na chanzo kingi cha maji.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni yenyewe. “Yahweh” huhifadhi jina la agano badala ya kulibadilisha na cheo, bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mistari sambamba imedumishwa ili kuhifadhi muundo wa shairi la Kiebrania; “yanavyotandaa” hudumisha mwendo wa taswira bila kufanya sentensi kuwa nzito.
