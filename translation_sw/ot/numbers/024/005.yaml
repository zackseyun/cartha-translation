  variant: Standard East African Swahili
source:
  edition: WLC
  text: מַה טֹּ֥בוּ אֹהָלֶ֖י/ךָ יַעֲקֹ֑ב מִשְׁכְּנֹתֶ֖י/ךָ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/005.yaml
  text: How good are your tents[a], O Jacob, your dwellings, O Israel!
translation:
  language: sw
  text: 'Jinsi mahema yako yalivyo mazuri[a], ee Yakobo,

    makao yako, ee Israeli!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jinsi mahema yako yanavyopendeza … makao yako.” Kauli ya Kiebrania inaonyesha mshangao na kuvutiwa sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Jinsi ... yalivyo
  rationale: Hapa מַה linaanzisha mshangao wa kusifu, si swali. Muundo huu wa Kiswahili unaonyesha mshangao huo kwa njia ya kawaida na ya kishairi.
- source_word: טֹּבוּ
  choice: mazuri
  rationale: Neno טוֹב linaweza kumaanisha yaliyo mema, mazuri, au yenye kupendeza. Kwa mahema, “mazuri” ni Kiswahili cha kawaida na bado kinahifadhi upana wa sifa hiyo.
- source_word: אֹהָלֶיךָ
  choice: mahema yako
  rationale: אֹהֶל humaanisha hema kwa kawaida. Muktadha ni kambi ya Israeli, kwa hiyo hakuna sababu ya kutumia neno lenye maana maalumu ya mahali patakatifu.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili; hapa linawatambulisha watu wa Israeli kwa lugha ya kishairi.
- source_word: מִשְׁכְּנֹתֶיךָ
  choice: makao yako
  rationale: מִשְׁכָּן ni mahali pa kukaa au makao. “Makao” yanadumisha usambamba na “mahema” bila kudokeza kwa lazima hema takatifu.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina limetoholewa kwa namna ya kawaida ya Kiswahili na hapa linasimama sambamba na “Yakobo” kama jina la watu.
theological_decisions:
- issue: Iwapo lugha ya kimapokeo yenye maana ya “maskani/mahema matakatifu” itumike
  choice: Kutumia “mahema” na “makao”
  alternative: Kutumia “maskani” au neno linaloweza kueleweka kuwa hema takatifu
  rationale: Muktadha unaonyesha kambi na maeneo ya kuishi ya Israeli, si hasa patakatifu. Tafsiri hii haileti maana ya kiibada ambayo Kiebrania hakilazimishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini kinachoeleweka kwa urahisi. “Ee” linahifadhi mwito wa kishairi kwa Yakobo na Israeli; alama ya mshangao inaonyesha nguvu ya kauli ya Kiebrania.
