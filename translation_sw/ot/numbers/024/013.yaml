  text: אִם יִתֶּן לִ֨/י בָלָ֜ק מְלֹ֣א בֵית/וֹ֮ כֶּ֣סֶף וְ/זָהָב֒ לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּ֣י יְהוָ֔ה לַ/עֲשׂ֥וֹת טוֹבָ֛ה א֥וֹ רָעָ֖ה מִ/לִּבִּ֑/י אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֲדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/013.yaml
  text: If Balak were to give me his house full of silver and gold[a], I could not go beyond the word of Yahweh, to do good or evil from my own heart. Whatever Yahweh speaks, that I will speak.
translation:
  language: sw
  text: Kama Balaki angenipa nyumba yake ikiwa imejaa fedha na dhahabu, singeweza kulipita neno la Yahwe[a] na kutenda mema au mabaya kutoka moyoni mwangu mwenyewe. Lolote atakalosema Yahwe, hilo ndilo nitakalosema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kupita kinywa cha Yahwe.”
    reason: Taswira ya Kiebrania hutumia “kinywa” kumaanisha neno au kauli iliyotamkwa.
lexical_decisions:
- source_word: אִם יִתֶּן
  choice: Kama ... angenipa
  rationale: Muundo huu unaonyesha sharti la kudhaniwa na unasikika kwa kawaida katika Kiswahili bila kulifanya kuwa tukio halisi.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: nyumba yake ikiwa imejaa fedha na dhahabu
  rationale: Inahifadhi picha ya nyumba nzima kujaa malipo ya thamani huku ikitumia Kiswahili cha kawaida.
- source_word: לֹא אוּכַל
  choice: singeweza
  rationale: Hupatana na sharti la kudhaniwa lililoanzishwa na ‘angenipa.’
- source_word: לַעֲבֹר אֶת־פִּי יְהוָה
  choice: kulipita neno la Yahwe
  rationale: ‘Kulipita’ huhifadhi taswira ya kuvuka mpaka uliowekwa na kauli ya Mungu; ‘neno’ ni la kawaida zaidi kuliko tafsiri sisisi ‘kinywa.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: לַעֲשׂוֹת טוֹבָה אוֹ רָעָה
  choice: kufanya jambo jema au baya
  rationale: Huhifadhi ulinganifu wa mema na mabaya na ni wazi katika Kiswahili cha sasa.
- source_word: מִלִּבִּי
  choice: kwa uamuzi wa moyo wangu mwenyewe
  rationale: Huhifadhi taswira ya moyo na wakati huohuo huonyesha kwamba chanzo au msukumo ungekuwa wa Balaamu mwenyewe.
- source_word: אֲשֶׁר יְדַבֵּר יְהוָה אֹתוֹ
  choice: Lolote ambalo Yahwe atasema, hilo
  rationale: Huhifadhi muundo wa kurejelea jambo lolote ambalo Yahwe atasema na kiwakilishi cha kusisitiza ‘hilo.’
- source_word: אֲדַבֵּר
  choice: ndilo nitakalosema
  rationale: Wakati ujao unafaa katika hotuba hii, na muundo wa ‘ndilo’ unasisitiza kwamba atasema hilo tu.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ina jina binafsi la Mungu; kulitaja kama Yahwe huhifadhi jina hilo bila kulibadilisha kuwa cheo. Tahajia imepatana na matumizi ya sauti za Kiswahili.
- issue: Maana ya mpaka aliowekewa Balaamu
  choice: Hawezi kwenda nje ya neno la Yahwe na kutenda kwa uamuzi wake mwenyewe
  alternative: Hawezi kubadili tu amri maalumu kuhusu kubariki au kulaani
  rationale: Tafsiri inahifadhi dai pana lililo wazi katika mstari huu bila kuongeza hitimisho la kimafundisho linalopita muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kisharti ‘angenipa ... singeweza’ umetumiwa kwa ufasaha; taswira ya moyo imehifadhiwa bila kufanya sentensi kuwa ngumu.
