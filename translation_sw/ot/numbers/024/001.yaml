id: NUM.24.1
reference: Numbers 24:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֣רְא בִּלְעָ֗ם כִּ֣י ט֞וֹב בְּ/עֵינֵ֤י יְהוָה֙ לְ/בָרֵ֣ךְ אֶת יִשְׂרָאֵ֔ל וְ/לֹא הָלַ֥ךְ כְּ/פַֽעַם בְּ/פַ֖עַם לִ/קְרַ֣את נְחָשִׁ֑ים וַ/יָּ֥שֶׁת אֶל הַ/מִּדְבָּ֖ר פָּנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/001.yaml
  text: When Balaam saw that it was good in the eyes of Yahweh to bless Israel[a], he did not go, as at other times, to seek omens, but set his face toward the wilderness.
translation:
  language: sw
  text: Balaamu alipoona kwamba kuibariki Israeli kulikuwa jambo jema machoni pa Yahwe, hakuenda kama nyakati nyingine kutafuta ishara za uaguzi[a], bali akaelekeza uso wake kuelekea nyikani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenda kukutana na ishara za uaguzi” au “kwenda kukutana na uaguzi.” Usemi wa Kiebrania unarejelea desturi ya awali ya Balaamu ya kutafuta ishara kwa njia ya uaguzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipoona
  rationale: Kitenzi ראה kimsingi humaanisha kuona, na hapa pia kinadokeza kutambua kwa Balaamu; “alipoona” huhifadhi taswira ya Kiebrania na ni ya kawaida katika Kiswahili.
- source_word: כִּי טוֹב בְּעֵינֵי יְהוָה
  choice: kwamba ... kulikuwa jambo jema machoni pa Yahwe
  rationale: Huhifadhi nahau ya Kiebrania “jema machoni pa” bila kuifupisha kuwa “kulimpendeza,” huku mpangilio wa Kiswahili ukifanya maana ieleweke vizuri.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: לְבָרֵךְ
  choice: kuibariki
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi ברך katika hali ya kutenda; kiambishi “-i-” kinaonyesha Israeli ndiye anayepokea baraka.
- source_word: כְּפַעַם בְּפַעַם
  choice: kama nyakati nyingine
  rationale: Nahau hiyo inaonyesha desturi iliyokuwa imerudiwa hapo awali; usemi huu ni wa asili katika Kiswahili.
- source_word: לִקְרַאת נְחָשִׁים
  choice: kutafuta ishara za uaguzi
  rationale: נְחָשִׁים hapa ni ishara au mbinu za uaguzi, si nyoka. “Kutafuta” huwasilisha kusudi la Balaamu, huku tanbihi ikihifadhi uwezekano wa maana halisi zaidi ya לִקְרַאת.
- source_word: וַיָּשֶׁת ... פָּנָיו
  choice: akauelekeza uso wake
  rationale: Huhifadhi nahau ya kuelekeza uso kwa makusudi na ni yenye kueleweka katika Kiswahili cha sasa.
- source_word: אֶל הַמִּדְבָּר
  choice: kuelekea nyikani
  rationale: מִדְבָּר ni eneo la pori au nyika, na אֶל inaonyesha mwelekeo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Tathmini ya Yahwe kuhusu kuibariki Israeli
  choice: kuibariki Israeli kulikuwa jambo jema machoni pa Yahwe
  alternative: Yahwe alipendezwa kuibariki Israeli
  rationale: Chaguo hili huhifadhi taswira na msisitizo wa nahau ya Kiebrania bila kuongeza maelezo kuhusu namna ya mapenzi au uamuzi wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayosomeka kwa urahisi. Nahau muhimu ya Kiebrania “jema machoni pa” imehifadhiwa, huku sintaksia ikirekebishwa ili iwe ya asili katika Kiswahili.
