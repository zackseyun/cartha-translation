  text: Then Balaam rose and went and returned to his place, and Balak also went on his way.
translation:
  language: sw
  text: Ndipo Balaamu akainuka, akaenda, akarudi mahali pake; Balaki naye akaenda zake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום katika mfululizo wa simulizi kinaonyesha kuinuka ili kuondoka; “akainuka” ni cha kawaida na kinahifadhi mwendo wa Kiebrania.
- source_word: בִּלְעָם
  choice: Balaamu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: הלך hapa ni tendo rahisi la kwenda katika mfululizo wa simulizi; “akaenda” ni ya moja kwa moja bila kuongeza maana ya kufukuzwa au kuondoka kabisa.
- source_word: וַיָּשָׁב
  choice: na kurudi
  rationale: 'שׁוב pamoja na mahali pa kufikiwa humaanisha kurudi. Kiunganishi “na” kinadumisha matendo mawili yanayofuatana katika maandishi: alienda na akarudi.'
- source_word: לִמְקֹמוֹ
  choice: mahali pake
  rationale: מקום ni “mahali”; tafsiri hii haiongezi dhana ya “nyumbani,” ambayo haikutajwa wazi.
- source_word: וְגַם
  choice: pia
  rationale: “Pia” huonyesha kwamba Balaki naye alifanya tendo linalofanana la kuondoka; uhusiano wa kuunganisha tayari unaonekana katika kishazi kinachofuata baada ya nukta mkato.
- source_word: בָּלָק
  choice: Balaki
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: הָלַךְ
  choice: akaenda
  rationale: הלך imetafsiriwa kwa uthabiti kama “akaenda,” kwa mtindo wa kawaida wa simulizi la Kiswahili.
- source_word: לְדַרְכּוֹ
  choice: zake
  rationale: Nahau ya Kiswahili “akaenda zake” huwasilisha kwa kawaida maana ya mtu kwenda katika njia yake mwenyewe, bila tafsiri ngumu ya neno kwa neno.
