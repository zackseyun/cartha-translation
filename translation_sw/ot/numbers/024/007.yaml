base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/007.yaml
  text: Water will flow from his buckets[a], and his seed will be in abundant waters; his king will be higher than Agag[b], and his kingdom will be exalted.
translation:
  language: sw
  text: Maji yatatiririka kutoka katika ndoo zake[a], na mbegu yake[b] itakuwa katika maji tele; mfalme wake atakuwa juu kuliko Agagi, na ufalme wake utainuliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda “kutoka katika matawi yake,” ikiwa neno hili linaeleweka kwa njia ya kitamathali badala ya maana yake ya kawaida, “ndoo.”
    reason: lexical_alternative
  - marker: b
    text: “Mbegu yake” pia inaweza kueleweka kuwa “uzao wake” au “wazao wake”; Kiebrania kinaweza kuibua kwa pamoja picha za vizazi na rutuba.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזַּל
  choice: yatatiririka
  rationale: Kitenzi hiki huonyesha maji yanayotiririka. ‘Yatatiririka’ ni Kiswahili cha kawaida na kinahifadhi picha ya wingi bila kudokeza matone machache tu.
- source_word: מַיִם
  choice: Maji
  rationale: Ingawa neno la Kiebrania lina umbo la wingi, ‘maji’ ndilo neno la kawaida la Kiswahili na linaendana na taswira ya mstari huu.
- source_word: מִדָּלְיוֹ
  choice: kutoka katika ndoo zake
  rationale: דלי kwa kawaida ni chombo cha kutekea au kubebea maji. ‘Ndoo’ ndiyo maana ya moja kwa moja na inafaa katika taswira ya maji; uwezekano wa maana ya kitamathali umewekwa katika tanbihi.
- source_word: וְזַרְעוֹ
  choice: na mbegu yake
  rationale: זֶרַע inaweza kumaanisha mbegu halisi au uzao. ‘Mbegu’ inadumisha upana huo wa maana na muunganiko wa picha za rutuba na vizazi.
- source_word: בְּמַיִם רַבִּים
  choice: katika maji tele
  rationale: ‘Katika’ huwakilisha moja kwa moja kihusishi ב, huku ‘maji tele’ likieleza wingi wa maji kwa Kiswahili cha asili na cha kishairi.
- source_word: וְיָרֹם
  choice: atakuwa juu
  rationale: רוּם humaanisha kuwa juu au kuinuliwa. Kauli hii inadumisha ulinganisho unaofuatwa na מִן, bila kuifanya ifanane kabisa na kitenzi tofauti kinachotumiwa kuhusu ufalme.
- source_word: מֵאֲגַג
  choice: kuliko Agagi
  rationale: מִן baada ya neno linaloonyesha kuwa juu huleta ulinganisho, kwa hiyo ‘kuliko’ ni ya asili. Agagi linahifadhi jina maalumu la Kiebrania.
- source_word: מַלְכּוֹ
  choice: mfalme wake
  rationale: מֶלֶךְ humaanisha ‘mfalme.’ Tafsiri hii haimtambulishi mfalme huyo kwa mhusika fulani ambaye kifungu chenyewe hakimtaji.
- source_word: וְתִנַּשֵּׂא
  choice: utainuliwa
  rationale: Umbo hili la נשא lina maana ya kuinuliwa au kutukuzwa. ‘Utainuliwa’ linahifadhi picha ya kwenda juu na ulinganifu wa kishairi.
- source_word: מַלְכֻתוֹ
  choice: ufalme wake
  rationale: מַלְכוּת linaweza kumaanisha ufalme, utawala, au umalkia; ‘ufalme’ ni neno la kawaida linalofaa hapa na kuhifadhi upeo wa kisiasa wa baraka.
theological_decisions:
- issue: Kirejewa cha ‘mbegu yake’
  choice: Maana pana ya ‘mbegu’ imehifadhiwa bila kuamua kama ni mbegu halisi, uzao, au vyote viwili.
  alternative: uzao wake; wazao wake
  rationale: Neno זרע linaweza kubeba maana ya kilimo na ya vizazi, na ushairi huenda ukakusudia picha zote mbili. Tafsiri haipaswi kuondoa utata huo halisi.
- issue: Utambulisho wa ‘mfalme wake’ na uhusiano wake na Agagi
  choice: Imetafsiriwa kwa ujumla kuwa ‘mfalme wake atakuwa juu kuliko Agagi,’ bila kumtambulisha mfalme huyo.
  alternative: Kumtaja Sauli, Daudi, Masihi, au mfalme mwingine mahususi
  rationale: Unabii unaeleza kuinuliwa kwa mfalme wa Israeli, lakini mstari wenyewe hautaji utambulisho wake. Hivyo tafsiri haiingizi hitimisho la baadaye la kitheolojia katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Maji tele’ na ‘atakuwa juu kuliko’ hudumisha taswira na ulinganisho wa Kiebrania bila kuingiza ufafanuzi wa kimadhehebu.
