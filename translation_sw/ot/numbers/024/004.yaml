base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/004.yaml
  text: 'the declaration of one who hears the words of God[a], who sees the vision of the Almighty, falling down[b], yet with eyes uncovered:'
translation:
  language: sw
  text: 'tamko[a] la yule anayesikia maneno ya Mungu,


    anayeona maono ya Mwenyezi,


    anayeanguka chini, na macho yake yakiwa yamefunuliwa[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usemi rasmi wa kinabii wa yule anayesikia maneno ya Mungu.” Neno la Kiebrania נְאֻם ni istilahi rasmi ya kinabii kwa tamko zito.
    reason: lexical_alternative
  - marker: b
    text: Au, “macho yake yakiwa wazi.” Kihalisi, “macho yakiwa yamefunuliwa,” ikihifadhi taswira ya macho yasiyofunikwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: tamko
  rationale: Neno hili ni istilahi rasmi ya kinabii inayotambulisha kauli nzito. “Tamko” huhifadhi uzito huo bila kuleta maana zisizokusudiwa za fumbo au upagani.
- source_word: שֹׁמֵעַ
  choice: yule anayesikia
  rationale: Kitenzi-partisipio kinamtambulisha mtu kwa tendo la kusikia; muundo huu ni wa kawaida katika Kiswahili na huhifadhi maana ya sifa inayoendelea.
- source_word: אִמְרֵי אֵל
  choice: maneno ya Mungu
  rationale: Hii ni tafsiri ya wazi na ya kawaida ya wingi wa “neno/kauli” pamoja na cheo cha jumla cha Mungu.
- source_word: מַחֲזֵה שַׁדַּי
  choice: maono ya Mwenyezi
  rationale: מַחֲזֵה humaanisha jambo linaloonekana katika ufunuo, na שַׁדַּי hapa ni cheo cha Mungu kinachotafsiriwa kwa kawaida kuwa “Mwenyezi.”
- source_word: יֶחֱזֶה
  choice: anayeona
  rationale: Ingawa umbo la Kiebrania ni imperfect, katika maelezo haya ya kishairi linaeleza sifa ya sasa au ya kawaida, sambamba na “anayesikia.”
- source_word: נֹפֵל
  choice: anayeanguka chini
  rationale: Tafsiri hii huhifadhi nguvu ya kitenzi-partisipio na haifafanui kupita kiasi namna kamili ya mkao wake.
- source_word: וּגְלוּי עֵינָיִם
  choice: lakini macho yake yakiwa yamefunuliwa
  rationale: Neno גְלוּי kwa msingi humaanisha “yamefunuliwa/yameondolewa kifuniko.” “Lakini” huonyesha mvutano wa kishairi kati ya kuanguka chini na kuwa na uwezo wa kuona ufunuo.
theological_decisions:
- issue: Tafsiri ya שַׁדַּי
  choice: Mwenyezi
  alternative: Shaddai
  rationale: Hiki ni cheo cha Mungu, si lazima jina la pekee katika muktadha huu. “Mwenyezi” ni tafsiri ya kawaida ya Kiswahili inayohifadhi maana ya cheo bila kulazimisha ufafanuzi mwembamba zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wenye heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mistari mitatu huhifadhi usambamba wa kishairi wa Kiebrania; urudiaji wa “anaye-” huunganisha sifa za msemaji.
