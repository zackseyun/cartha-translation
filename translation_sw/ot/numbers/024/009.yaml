base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/009.yaml
  text: He crouched[a], he lay down like a lion, and like a lioness—who will rouse him? Those who bless you are blessed[b], and those who curse you are cursed.
translation:
  language: sw
  text: 'Alijikunyata, akajilaza kama simba,

    na kama simba jike[a]—ni nani atakayemwamsha?

    Wanaokubariki wamebarikiwa,

    na wanaokulaani wamelaaniwa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na kama simba mwenye nguvu” au “simba aliyekomaa.” Neno la Kiebrania linaweza kumaanisha simba mwenye nguvu au aliyekomaa; “simba jike” huhifadhi tofauti yake na neno la kwanza lililotafsiriwa “simba.”
    reason: lexical_alternative
  - marker: b
    text: Kanuni hii ya baraka na laana ina mwangwi wa Mwanzo 12:3 na Mwanzo 27:29.
    reason: cross_reference
lexical_decisions:
- source_word: כָּרַע
  choice: alijikunyata
  rationale: Kitenzi hiki kinaeleza kuinama au kujishusha. Pamoja na שָׁכַב na mfano wa simba, “alijikunyata” huonyesha mkao wa mnyama bila kuleta wazo lisilokusudiwa la kusujudu.
- source_word: שָׁכַב
  choice: akalala
  rationale: Ni kitenzi cha kawaida cha kulala au kujilaza. “Akalala” ni Kiswahili cha kawaida na kinaendeleza picha ya simba anayetulia.
- source_word: כַּאֲרִי
  choice: kama simba
  rationale: Huhifadhi wazi tashbihi ya Kiebrania na maana ya kawaida ya אֲרִי.
- source_word: וּכְלָבִיא
  choice: na kama simba jike
  rationale: לָבִיא inaweza kumaanisha simba, simba mwenye nguvu au aliyekomaa, na wakati mwingine simba jike. “Simba jike” huhifadhi tofauti ya msamiati na אֲרִי; utata wa neno umeonyeshwa katika tanbihi.
- source_word: מִי יְקִימֶנּוּ
  choice: ni nani atakayemwamsha?
  rationale: Katika picha ya simba aliyelala, kausativi ya קום ina maana ya kumfanya ainuke au kumchochea kutoka usingizini. “Atakayemwamsha” ni ya kawaida na inafaa muktadha.
- source_word: מְבָרֲכֶיךָ בָרוּךְ
  choice: wanaokubariki wamebarikiwa
  rationale: Kirai kishirikishi chenye kiambishi cha nafsi ya pili kimetafsiriwa kwa wingi kwa Kiswahili cha asili; kivumishi cha habari kinaeleza hali ya kubarikiwa.
- source_word: וְאֹרְרֶיךָ אָרוּר
  choice: na wanaokulaani wamelaaniwa
  rationale: Huhifadhi ulinganifu wa moja kwa moja kati ya baraka na laana na hutumia wingi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Mrejelewa wa viambishi vya nafsi ya pili katika “wanaokubariki... wanaokulaani”
  choice: Kauli imeachwa ikimwelekea “wewe” mmoja, yaani Israeli/Yakobo anayewakilishwa katika unabii wa Balaamu
  alternative: Kumfafanua mrejelewa kuwa mfalme wa Israeli pekee au taifa pekee bila nguvu ya uwakilishi
  rationale: Muktadha humtaja Israeli/Yakobo kwa umoja wa kishairi. Kiswahili “-ku-” huhifadhi umoja huo bila kufafanua zaidi ya maandishi.
- issue: Mwangwi wa kanuni ya baraka na laana ya mababu
  choice: Kauli ya baraka na laana imetafsiriwa moja kwa moja, na rejeo limewekwa katika tanbihi
  alternative: Kupanua tafsiri ili kutaja wazi ahadi kwa Abrahamu au baraka ya Isaka
  rationale: Maneno yana mwangwi mkubwa wa Mwanzo 12:3 na 27:29, lakini tafsiri haipaswi kuingiza ufafanuzi huo ndani ya mstari wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa mistari umehifadhi ushairi na ulinganifu wa sentensi. “Alijikunyata” na “akamwamsha” ni maneno ya kawaida yanayodumisha picha hai ya simba, huku tanbihi ikihifadhi utata halisi wa לָבִיא.
