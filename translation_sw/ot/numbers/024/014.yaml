  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנְנִ֥/י הוֹלֵ֖ךְ לְ/עַמִּ֑/י לְכָ/ה֙ אִיעָ֣צְ/ךָ֔ אֲשֶׁ֨ר יַעֲשֶׂ֜ה הָ/עָ֥ם הַ/זֶּ֛ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֥ית הַ/יָּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/014.yaml
  text: And now[a], behold, I am going to my people. Come[b], I will advise you what this people will do to your people in the latter days.
translation:
  language: sw
  text: Na sasa, tazama, ninaenda kwa watu wangu. Njoo, nitakushauri kuhusu yale ambayo watu hawa watawatendea watu wako[b] katika siku za mwisho[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika siku zijazo.” Usemi wa Kiebrania unaweza kurejelea wakati ujao kwa upana, ingawa “katika siku za mwisho” huhifadhi uzito wake wa kinabii.
    reason: alternative_reading
  - marker: b
    text: Au, “dhidi ya watu wako.” Kihusishi cha Kiebrania kwa maana halisi ni “kwa watu wako,” lakini katika muktadha kinaweza kudokeza tendo la uadui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi וְ pamoja na alama ya wakati עַתָּה, na kwa kawaida huanzisha hatua mpya katika mazungumzo.
- source_word: הִנְנִי
  choice: tazama
  rationale: Neno hili la kuonyesha na kusisitiza linaelekeza fikira kwenye hatua iliyo karibu kutokea; “tazama” huhifadhi msisitizo huo katika lugha yenye hadhi.
- source_word: הוֹלֵךְ
  choice: ninaenda
  rationale: Umbo la participle linaonyesha tendo linaloendelea au lililo karibu; “ninaenda” ni la kawaida na haliongezi wazo la kurudi lisilotajwa wazi.
- source_word: לְעַמִּי
  choice: kwa watu wangu
  rationale: Huhifadhi uhusiano wa moja kwa moja wa Balaamu na watu wake bila kuongeza utambulisho mwingine.
- source_word: לְכָה
  choice: Njoo
  rationale: Ni amri ya kuvuta usikivu au kumwita msikilizaji; “Njoo” ndiyo tafsiri ya karibu na ya wazi.
- source_word: אִיעָצְךָ
  choice: nitakushauri
  rationale: Huhifadhi maana ya msingi ya יעץ, ‘kushauri/kutoa shauri,’ ingawa muktadha unaonyesha kuwa shauri hilo linahusu tangazo la mambo yajayo.
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: kuhusu yale ambayo ... watawatendea
  rationale: Kifungu hiki kinaeleza maudhui ya shauri. Muundo wa Kiswahili “kuhusu yale ambayo” unaunganisha kitenzi ‘kushauri’ na taarifa inayofuata kwa njia ya kawaida.
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: עָם ni kundi la watu kwa umoja katika Kiebrania, lakini Kiswahili cha kawaida hutumia “watu hawa” kwa kundi linaloonyeshwa bila kulazimisha neno “taifa.”
- source_word: לְעַמְּךָ
  choice: watu wako
  rationale: Kiambishi לְ kimeachwa katika uhusiano mpana unaokamilishwa kiasili na kitenzi “watawatendea”; muktadha unaweza kuelekeza kwenye tendo la uadui, lakini hilo halijaingizwa moja kwa moja katika maandishi.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: katika siku za mwisho
  rationale: Huhifadhi uzito wa usemi wa kinabii na uwezekano wake wa kurejelea wakati wa mwisho, huku tanbihi ikionyesha kuwa unaweza pia kumaanisha wakati ujao kwa upana.
theological_decisions:
- issue: Maana ya wakati katika בְּאַחֲרִית הַיָּמִים
  choice: katika siku za mwisho
  alternative: katika siku zijazo
  rationale: Usemi unaweza kuelekeza kwa jumla kwenye wakati ujao bila kulazimisha mpangilio kamili wa matukio ya mwisho. Tafsiri iliyochaguliwa huhifadhi uzito wake wa kinabii na mvutano wake wa kitheolojia.
- issue: Uhusiano unaoonyeshwa na לְ katika לְעַמְּךָ
  choice: watawatendea watu wako
  alternative: watafanya dhidi ya watu wako
  rationale: Kihusishi kinaweza kumtaja mhusika anayeathiriwa, na muktadha unaweza kuwa wa uadui. Maandishi makuu hayafanyi uadui huo kuwa wazi kuliko Kiebrania, huku tanbihi ikihifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Tazama” na “siku za mwisho” huhifadhi mtindo na uzito wa kinabii; sentensi nyingine imeundwa kwa mtiririko wa kawaida wa Kiswahili. Alama zote za tanbihi zimewekwa mahali zinapohusiana moja kwa moja na maneno yanayofafanuliwa.
