base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/010.yaml
  text: Then Balak’s anger burned against Balaam[a], and he struck his hands together. And Balak said to Balaam, “I called you to curse my enemies, but look—you have indeed blessed them these three times!”
translation:
  language: sw
  text: Ndipo hasira ya Balaki ikawaka dhidi ya Balaamu, naye akapiga viganja vyake pamoja. Balaki akamwambia Balaamu, “Nilikuita uwalaani adui zangu, lakini tazama, umewabariki kabisa mara hizi tatu![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “umebariki, kubariki”; huu ni muundo wa kusisitiza unaoonyesha tendo la kubariki lililorudiwa au kusisitizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף בָּלָק אֶל בִּלְעָם
  choice: hasira ya Balaki ikawaka dhidi ya Balaamu
  rationale: Nahau ya Kiebrania ina picha ya hasira kuwaka. Kiswahili hiki kinahifadhi picha hiyo kwa lugha ya kawaida na kuonyesha kuwa hasira ilielekezwa kwa Balaamu.
- source_word: וַיִּסְפֹּק אֶת כַּפָּיו
  choice: akapiga viganja vyake pamoja
  rationale: Hueleza ishara ya kupigiza mikono kwa hasira, bila kutumia ‘akapiga makofi,’ ambayo leo huweza kueleweka kama ishara ya pongezi.
- source_word: לָקֹב
  choice: uwalaani
  rationale: Kitenzi-jina kinaonyesha kusudi la kumwita Balaamu; ‘uwalaani’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֹיְבַי
  choice: adui zangu
  rationale: Ni wingi wenye umilikaji, unaotafsiriwa kwa kawaida kuwa ‘adui zangu.’
- source_word: קְרָאתִיךָ
  choice: Nilikuita
  rationale: Kitenzi kinaweza kumaanisha kuita au kuagiza aje; ‘nilikuita’ ni cha asili, na kusudi linafafanuliwa na kitenzi kinachofuata.
- source_word: וְהִנֵּה
  choice: lakini tazama
  rationale: Chembe hii huvuta fikira kwenye matokeo yasiyotazamiwa na katika muktadha huu pia huonyesha utofauti.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: umewabariki kabisa
  rationale: Muundo wa kitenzi pamoja na infinitive absolute unasisitiza tendo la kubariki. ‘Kabisa’ huwasilisha msisitizo huo bila kuongeza wazo lisilosemwa wazi.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: mara hizi tatu
  rationale: Huhifadhi nguvu ya kiashiria זֶה na kueleza matukio matatu yaliyotokea hadi wakati huo.
