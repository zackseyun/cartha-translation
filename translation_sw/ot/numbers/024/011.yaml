  text: וְ/עַתָּ֖ה בְּרַח לְ/ךָ֣ אֶל מְקוֹמֶ֑/ךָ אָמַ֨רְתִּי֙ כַּבֵּ֣ד אֲכַבֶּדְ/ךָ֔ וְ/הִנֵּ֛ה מְנָעֲ/ךָ֥ יְהוָ֖ה מִ/כָּבֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/011.yaml
  text: So now[a], flee to your place. I said, ‘I would surely honor you,’ but behold[b], Yahweh has kept you back from honor.
translation:
  language: sw
  text: Sasa basi, ikimbie uende mahali pako. Nilisema, “Hakika nitakuheshimu,”[a] lakini tazama, Yahwe amekuzuia usipate heshima.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nilikuwa nimesema, ‘Nitakuheshimu sana.’” Muundo wa Kiebrania unasisitiza tendo la kuheshimu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Yahwe amekunyima heshima,” au, “Yahwe amemzuia kupata heshima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Inaendeleza hoja ya Balaki na wakati huohuo inaonyesha kwamba sasa anafikia uamuzi wake wa mwisho.
- source_word: בְּרַח לְךָ אֶל־מְקוֹמֶךָ
  choice: kimbilia kwako
  rationale: Kitenzi kinaonyesha kuondoka kwa haraka au kukimbia, huku ‘kwako’ kikitoa kwa Kiswahili cha kawaida maana ya kurudi mahali pake bila kulazimisha kwamba ni nyumba yake hasa.
- source_word: אָמַרְתִּי
  choice: Nilikuwa nimesema
  rationale: Wakati timilifu unafanya wazi kwamba Balaki anarejelea ahadi aliyotoa kabla ya tukio hili.
- source_word: כַּבֵּד אֲכַבֶּדְךָ
  choice: Hakika nitakuheshimu
  rationale: ‘Hakika’ linawakilisha msisitizo wa muundo wa kitenzi-jina pamoja na kitenzi chenyewe katika Kiebrania.
- source_word: וְהִנֵּה
  choice: lakini tazama
  rationale: ‘Lakini’ linaonyesha tofauti kati ya ahadi ya Balaki na matokeo, na ‘tazama’ linahifadhi nguvu ya kishazi cha kuelekeza uangalifu.
- source_word: מְנָעֲךָ ... מִכָּבוֹד
  choice: amekuzuia usipate heshima
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya kuzuiliwa au kuwekewa kizuizi ili mtu asipokee heshima iliyoahidiwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo linalolingana na matamshi na tahajia ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: כָּבוֹד
  choice: heshima
  rationale: Katika muktadha huu neno linahusu hadhi na tuzo ambayo Balaki aliahidi kumpa Balaamu, si utukufu wa Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi kwa umbo la kawaida la Kiswahili badala ya kulibadilisha kuwa cheo.
- issue: Jukumu la Yahwe katika Balaamu kukosa heshima
  choice: Yahwe amekuzuia usipate heshima
  alternative: Yahwe amekunyima heshima
  rationale: Tafsiri iliyochaguliwa inadumisha dai la Balaki kwamba Yahwe ndiye aliyemzuia Balaamu kuipata heshima, bila kugeuza kitenzi kuwa dai la moja kwa moja kwamba Mungu alimnyang’anya kitu alichokuwa nacho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Kimbilia kwako’ huhifadhi ukali wa amri ya Balaki, na ‘lakini tazama’ huhifadhi mgeuko wa ghafla wa kauli.
