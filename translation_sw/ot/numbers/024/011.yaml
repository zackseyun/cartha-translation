review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Balak’s forceful dismissal, the prior promise of emphatic honor, the contrast introduced by הנה, and the claim that Yahwe prevented Balaamu from receiving honor. However, “kimbilia kwako” does not clearly represent “flee/go to your place”; it can suggest running toward one’s own side or refuge rather than departing to one’s designated place.
  naturalness: Most wording is idiomatic Standard East African Swahili. “Sasa basi” and “ikimbie uende mahali pako” more naturally and explicitly express the Hebrew imperative plus destination than “Basi sasa, kimbilia kwako.”
  terminology: “Yahwe” appropriately preserves the divine name, and “heshima” fits כָּבוֹד in this context of promised status or reward. “Tazama” suitably maintains the formal, emphatic discourse marker.
  issues:
  - severity: medium
    issue: Destination of the imperative is underrepresented
    rationale: Kimbilia kwako is less precise than the Hebrew ברח לך אל־מקומך (“flee/go to your place”). Adding “uende mahali pako” preserves both flight and the specified destination.
  - severity: low
    issue: Footnote a is not aligned with the selected verbal form
    rationale: The draft selects “Nilikuwa nimesema,” while its alternative begins “Nilisema.” Selecting the simple past, which directly reflects אָמַרְתִּי, and offering the pluperfect as the alternative makes the note coherent.
  revised_text: Sasa basi, ikimbie uende mahali pako. Nilisema, “Hakika nitakuheshimu,”[a] lakini tazama, Yahwe amekuzuia usipate heshima.[b]
  revised_footnotes:
  - marker: a
    text: Au, “Nilikuwa nimesema, ‘Nitakuheshimu sana.’” Muundo wa Kiebrania unasisitiza tendo la kuheshimu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Yahwe amekunyima heshima,” au, “Yahwe amemzuia kupata heshima.”
    reason: lexical_alternative
  revision_rationale: The revision clarifies that Balaamu is commanded to flee to his own place, while retaining the imperative’s urgency. It uses the Hebrew simple past as the main rendering and makes the pluperfect a genuine alternative. The footnotes retain the available lexical alternatives without adding interpretation.
