  yaml_path: translation/ot/numbers/024/019.yaml
  text: And one shall rule from Jacob[b][a], and he shall destroy the survivor from the city.
translation:
  language: sw
  text: Na mmoja atatawala[a] kutoka kwa Yakobo, naye atamwangamiza mtu aliyesalia[b] kutoka mjini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na mmoja atakuwa na mamlaka kutoka kwa Yakobo.” Kitenzi cha Kiebrania kinaweza kutafsiriwa “kutawala” au “kuwa na mamlaka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mabaki” badala ya “mtu aliyesalia.” Nomino ya Kiebrania iko katika umoja lakini inaweza kutumiwa kwa maana ya pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: Na mtawala atatoka
  rationale: Kitenzi kinatokana na רדה, ‘kutawala/kuwa na mamlaka.’ Kwa kuwa Kiebrania hakitaji wazi kiima lakini muktadha unaonyesha mtawala wa kifalme, Kiswahili cha asili kinatumia ‘mtawala’ na kukiunganisha na asili yake kwa ‘atatoka kwa Yakobo.’ Tanbihi inalihifadhi chaguo la karibu zaidi na muundo wa Kiebrania.
- source_word: מִיַּעֲקֹב
  choice: kwa Yakobo
  rationale: Kihusishi מן kinaonyesha asili au chanzo; ‘kwa Yakobo’ hapa humaanisha mtawala anayetokea katika ukoo au taifa la Yakobo.
- source_word: וְהֶאֱבִיד
  choice: naye atamwangamiza
  rationale: Hifili ya אבד ina maana ya kusababisha kuangamia. ‘Atamwangamiza’ ni wazi na hudumisha nguvu ya kauli ya Kiebrania.
- source_word: שָׂרִיד
  choice: mtu aliyesalia
  rationale: Nomino ya umoja שָׂרִיד humaanisha mtu aliyebaki au aliyeokoka. ‘Mtu aliyesalia’ huhifadhi umoja na maana halisi bila kuifanya kuwa dhana ya jumla ya mabaki.
- source_word: מֵעִיר
  choice: kutoka mjini
  rationale: עִיר kwa kawaida ni ‘mji’; hakuna msingi wa kuongeza ‘mji wenye ngome.’ Katika Kiswahili, ‘kutoka mjini’ huonyesha kwamba mtu huyo ndiye aliyesalia katika mji huo.
theological_decisions:
- issue: Rejeo la kifalme au la Kimasihi katika unabii wa Balaamu
  choice: Kutumia lugha ya jumla kuhusu mtawala bila kumtaja wazi kuwa Masihi.
  alternative: Kumfafanua kuwa mfalme wa kihistoria pekee au kuwa Masihi moja kwa moja.
  rationale: Muktadha unaonyesha mtu wa kifalme, lakini mstari wenyewe hautambulishi wazi kuwa ni Masihi. Tafsiri inaacha uwezekano wa usomaji wa kihistoria, wa mfano, au wa kinabii bila kuamua mvutano huo kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘mtawala atatoka kwa Yakobo’ ni wa asili zaidi kwa Kiswahili kuliko kuacha kitenzi bila kiima, huku tanbihi ikihifadhi muundo mbadala ulio karibu na Kiebrania.
