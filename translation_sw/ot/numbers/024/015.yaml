  yaml_path: translation/ot/numbers/024/015.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened:”'
translation:
  language: sw
  text: 'Kisha akatoa usemi wake, akasema: “Tamko la Balaamu mwana wa Beori, tamko la mtu ambaye jicho lake limefunguliwa:[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye jicho lake limefungwa” au “limefumbwa.” Msemo huu wa Kiebrania ni mgumu na umeeleweka kwa njia zaidi ya moja.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Kisha akatoa tamko lake
  rationale: Muundo huu ni nahau ya kuanzisha usemi rasmi wa kishairi. ‘Akatoa tamko lake’ ni Kiswahili cha kawaida na chenye hadhi, huku kikihifadhi uzito wa usemi huo.
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: Ni simulizi la kawaida linaloanzisha maneno yaliyonukuliwa.
- source_word: נְאֻם
  choice: tamko la
  rationale: Neno hili huonyesha usemi rasmi na wenye mamlaka. ‘Tamko’ linafaa katika Kiswahili cha sasa na limetumiwa kwa uthabiti katika sehemu zote mbili.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: Balaamu mwana wa Beori
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili, na uhusiano wa mwana na baba umeelezwa moja kwa moja.
- source_word: הַגֶּבֶר
  choice: mtu
  rationale: Katika muktadha huu neno humtaja mtu wa kiume bila kulazimisha wazo la nguvu; ‘mtu’ ni la kawaida na la kutosha.
- source_word: שְׁתֻם הָעָיִן
  choice: ambaye jicho lake limefunguliwa
  rationale: Muktadha wa maono ya Balaamu unaunga mkono maana ya kuona kwa ufunuo. Hata hivyo, kwa kuwa msemo wa Kiebrania una utata wa kweli, maana nyingine imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya maelezo ya Balaamu שְׁתֻם הָעָיִן
  choice: ambaye jicho lake limefunguliwa
  alternative: ambaye jicho lake limefungwa/limefumbwa
  rationale: Muktadha wa karibu unamwonyesha Balaamu akipokea maono na macho yake yakifunuliwa. Tafsiri kuu inafuata maana hiyo bila kuficha kwamba muundo wa Kiebrania umeeleweka kwa njia zaidi ya moja; utata huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘tamko’ yamehifadhiwa ili kuonyesha urudiaji wa kimakusudi katika Kiebrania.
