base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/023.yaml
  text: Then he took up his discourse and said[a], “Alas[b], who can live when God does this?”
translation:
  language: sw
  text: Kisha akatamka ujumbe wake[a], akasema, “Ole! Ni nani atakayeweza kuishi Mungu atakapofanya hivi?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno linalotafsiriwa “ujumbe” linaweza pia kutafsiriwa “usemi wa kinabii” au “mithali.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania cha maneno ya mwisho ni kigumu. Yanaweza pia kueleweka, “Mungu atakapoliweka hili,” au “Mungu atakapoweka jambo hili mahali pake.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: akatamka ujumbe wake
  rationale: Kitenzi נָשָׂא pamoja na מָשָׁל ni nahau ya kutamka usemi au ujumbe wa kishairi. ‘Akatamka ujumbe wake’ ni Kiswahili cha kawaida na chenye hadhi, huku tanbihi ikihifadhi maana nyingine zinazowezekana za מָשָׁל.
- source_word: אֹוי
  choice: Ole!
  rationale: Ni mshangao wa huzuni au hofu mbele ya janga linalokuja. ‘Ole!’ huhifadhi uzito wa mshangao huo.
- source_word: מִי יִחְיֶה
  choice: Ni nani atakayeweza kuishi
  rationale: Kwa msingi ni ‘ni nani atakayeishi?’; katika muktadha wa hukumu inayokuja, swali linahusu uwezekano wa kunusurika. ‘Atakayeweza’ huifanya maana hiyo iwe ya kawaida katika Kiswahili bila kubadili kiini cha swali.
- source_word: מִשֻּׂמוֹ אֵל
  choice: Mungu atakapofanya hivi
  rationale: Kirai hiki cha Kiebrania ni kifupi na kigumu. Tafsiri hii inamchukua אֵל kuwa mtendaji, ‘Mungu,’ na inatoa maana ya jumla ya tendo analoliweka au kulitekeleza bila kulifafanua kupita kiasi.
theological_decisions:
- issue: Maana ya kirai kigumu מִשֻּׂמוֹ אֵל
  choice: Mungu atakapofanya hivi
  alternative: Mungu atakapoliweka hili / Mungu atakapoweka jambo hili mahali pake
  rationale: Kiebrania kinaweza kueleweka kwa namna zaidi ya moja. Tafsiri kuu inahifadhi utendaji wa Mungu na ni ya kawaida katika Kiswahili; tanbihi inaonyesha kwa uwazi maana ya karibu zaidi na mzizi שׂוּם, ‘kuweka,’ bila kulazimisha utatuzi wa uhakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. ‘Ole!’ huhifadhi sauti ya hofu, na tanbihi zinatunza upana wa מָשָׁל pamoja na utata halisi wa kifungu cha mwisho.
