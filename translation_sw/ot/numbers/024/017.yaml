base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/017.yaml
  text: I see him[a], but not now; I behold him, but not near. A star has come forth from Jacob, and a scepter has risen from Israel[c][b]; it will crush the corners of Moab and tear down all the sons of Sheth.
translation:
  language: sw
  text: 'Ninamwona[a], lakini si sasa;

    ninamtazama, lakini si karibu.

    Nyota imetokea kutoka kwa Yakobo,

    na fimbo ya enzi imeinuka kutoka Israeli;

    itaziponda pembe za Moabu[b]

    na kuwaharibu wana wote wa Shethi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Vitenzi vinaweza pia kutafsiriwa kwa wakati ujao: “Nitamwona … nitamtazama.” Maono yanamhusu mtu ambaye hayupo katika wakati wa karibu wa Balaamu.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “pembe za Moabu”; huenda ni usemi wa mfano unaomaanisha mipaka, pande, au nguvu za Moabu.'
    reason: cultural_note
  - marker: c
    text: Au “wana wote wa Sethi.” Neno la Kiebrania שֵׁת linaweza kusomwa kama jina Sethi/Shethi; wengine hulielewa kwa upana zaidi kuwa jina la kishairi la wanadamu au la watu wenye uadui.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרְאֶנּוּ
  choice: Ninamwona
  rationale: Kitenzi cha nafsi ya kwanza kina kiambishi cha yambwa cha kiume umoja. Wakati uliopo wa maono unaonyesha uhai wa unabii, huku uwezekano wa wakati ujao ukielezwa katika tanbihi.
- source_word: אֲשׁוּרֶנּוּ
  choice: ninamtazama
  rationale: Neno hili humaanisha kumtazama au kumwona kwa makini. ‘Ninamtazama’ linadumisha ulinganifu wa kishairi na ‘ninamwona’ bila kufanya vitenzi viwe sawa kabisa.
- source_word: וְלֹא קָרוֹב
  choice: lakini si karibu
  rationale: ‘Karibu’ huhifadhi uwezekano wa maana ya wakati au umbali badala ya kuamua moja kwa kusema ‘si hivi karibuni.’
- source_word: דָּרַךְ כּוֹכָב
  choice: Nyota imetokea
  rationale: דָּרַךְ kimsingi huhusu kukanyaga au kusonga mbele, lakini ikiwa na ‘nyota’ hapa inaeleza kujitokeza kwake. ‘Imetokea’ ni Kiswahili cha kawaida kinachohifadhi picha ya nyota.
- source_word: וְקָם שֵׁבֶט
  choice: na fimbo ya enzi imeinuka
  rationale: שֵׁבֶט inaweza kuwa fimbo, fimbo ya utawala, au kabila. Katika ulinganifu wake na nyota na katika muktadha wa ushindi, ‘fimbo ya enzi’ huonyesha ishara ya kifalme bila kumtaja moja kwa moja mtawala.
- source_word: פַּאֲתֵי מוֹאָב
  choice: pembe za Moabu
  rationale: פֵּאָה humaanisha pembe, upande, au ukingo. Tafsiri hii inahifadhi sitiari ya Kiebrania badala ya kuifafanua kuwa viongozi au nguvu za Moabu.
- source_word: וְקַרְקַר
  choice: na kuwaangamiza
  rationale: Kitenzi hiki ni nadra na maana yake kamili haijulikani; mapendekezo yanatia ndani kubomoa, kuvunja, na kuharibu. ‘Kuwaangamiza’ kinafaa kwa watu kama yambwa na kwa muktadha wa ushindi, bila kujaribu kudumisha sitiari isiyo ya kawaida kwa Kiswahili.
- source_word: כָּל בְּנֵי שֵׁת
  choice: wana wote wa Shethi
  rationale: Konsonanti za Kiebrania zinaweza kusomwa kama jina Shethi/Sethi. ‘Wana’ linahifadhi muundo wa kishairi wa Kiebrania, na ‘Shethi’ linaepuka kuamua kimya kimya kwamba lazima awe Sethi wa Mwanzo.
theological_decisions:
- issue: Nguvu ya Kimasihi ya unabii wa Balaamu
  choice: Kuhifadhi picha za kifalme za ‘nyota’ na ‘fimbo ya enzi’ bila kumtambulisha mhusika moja kwa moja kuwa Masihi.
  alternative: Kutafsiri moja kwa moja kuwa unabii wa Masihi, au kuufungia kwa mfalme wa kihistoria kama Daudi pekee.
  rationale: Kifungu cha Kiebrania kina picha ya mtawala ajaye na ushindi wake, lakini hakimwiti Masihi wala hakimtaji mfalme fulani. Tafsiri inadumisha uwezekano wa maana pana ya kimasihi bila kuuingiza moja kwa moja katika matini.
- issue: Uhusiano kati ya mhusika wa kiume na ishara za nyota na fimbo ya enzi
  choice: Kutumia ‘-m-’ ya mtu katika mistari ya kwanza, kisha kuacha nyota na fimbo ya enzi zisimame kama ishara katika mistari inayofuata.
  alternative: Kufanya kifungu chote kiwe cha mtu kwa kutumia ‘yeye/ata-’, au kukifanya chote kuwa maelezo yasiyo ya mtu.
  rationale: Viambishi vya yambwa katika vitenzi vya mwanzo ni vya kiume umoja, lakini baadaye matini yenyewe hutumia nomino za kiishara. Muundo huu huhifadhi viwango vyote viwili vya picha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Mistari imepangwa ili kudumisha ulinganifu wa ushairi wa Kiebrania. ‘Fimbo ya enzi’ ni ya kawaida na wazi kuliko ‘fimbo ya kifalme,’ huku ‘pembe za Moabu’ ikihifadhi sitiari ya chanzo.
