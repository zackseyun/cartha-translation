id: NUM.6.14
reference: Numbers 6:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִקְרִ֣יב אֶת קָרְבָּנ֣/וֹ לַ/יהוָ֡ה כֶּבֶשׂ֩ בֶּן שְׁנָת֨/וֹ תָמִ֤ים אֶחָד֙ לְ/עֹלָ֔ה וְ/כַבְשָׂ֨ה אַחַ֧ת בַּת שְׁנָתָ֛/הּ תְּמִימָ֖ה לְ/חַטָּ֑את וְ/אַֽיִל אֶחָ֥ד תָּמִ֖ים לִ/שְׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/014.yaml
  text: 'and he shall present his offering to Yahweh: one year-old male lamb without blemish for a burnt offering[a], and one year-old ewe lamb without blemish for a sin offering, and one ram without blemish for peace offerings[b],'
translation:
  language: sw
  text: 'naye atamtolea Yahweh sadaka yake: mwanakondoo dume mmoja wa mwaka mmoja, asiye na dosari, kwa ajili ya sadaka ya kuteketezwa; mwanakondoo jike mmoja wa mwaka mmoja, asiye na dosari, kwa ajili ya sadaka ya dhambi[a]; na kondoo dume mmoja asiye na dosari kwa ajili ya sadaka za amani[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha dhambi na pia dhabihu inayohusiana na kutakaswa kutokana na unajisi au kosa.
    reason: alternative_reading
  - marker: b
    text: Au, “sadaka za hali njema” au “sadaka za ushirika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב אֶת־קָרְבָּנוֹ
  choice: naye atamtolea ... sadaka yake
  rationale: Hifili ya קרב katika muktadha wa dhabihu humaanisha kuleta au kuwasilisha sadaka. Muundo huu ni wa kawaida katika Kiswahili na unaendeleza agizo kwa wakati ujao.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: כֶּבֶשׂ בֶּן־שְׁנָתוֹ
  choice: mwanakondoo dume mmoja wa mwaka mmoja
  rationale: כֶּבֶשׂ humtaja mwanakondoo dume, na בֶּן־שְׁנָתוֹ huonyesha mnyama mwenye umri wa mwaka mmoja.
- source_word: תָמִים / תְּמִימָה
  choice: asiye na dosari
  rationale: Katika sheria za dhabihu, neno hili humaanisha mnyama asiye na kasoro inayomzuia kukubaliwa kuwa sadaka.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni aina ya sadaka iliyoteketezwa madhabahuni; istilahi hii ni wazi na inayotambulika katika Kiswahili cha Biblia.
- source_word: כַבְשָׂה ... בַּת־שְׁנָתָהּ
  choice: mwanakondoo jike mmoja wa mwaka mmoja
  rationale: כַבְשָׂה hutaja mwanakondoo jike, na kirai kinachofuata kinaonyesha umri wa mwaka mmoja.
- source_word: לְחַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: חַטָּאת ni jina la aina ya dhabihu, na tafsiri “sadaka ya dhambi” ni ya moja kwa moja na inayojulikana; maana inayosisitiza utakaso imehifadhiwa katika tanbihi.
- source_word: וְאַיִל אֶחָד
  choice: na kondoo dume mmoja
  rationale: אַיִל hutaja kondoo dume aliyekomaa, na אֶחָד huhifadhi idadi ya mnyama mmoja.
- source_word: לִשְׁלָמִים
  choice: kwa ajili ya sadaka za amani
  rationale: שְׁלָמִים ni aina ya dhabihu inayohusishwa na amani, hali njema, na ushirika; “sadaka za amani” huhifadhi istilahi pana bila kuifungia katika maana moja tu.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahweh” hulihifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Maana ya חַטָּאת katika sheria za dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno linaweza kuhusishwa na dhambi au na utakaso kutokana na unajisi au kosa. Tafsiri kuu inatumia istilahi inayotambulika, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- issue: Maana ya שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za hali njema; sadaka za ushirika
  rationale: Mzizi wa neno unaweza kuhusisha amani au hali njema, na ibada hiyo pia ilikuwa na kipengele cha ushirika. Tafsiri kuu haichagui kwa siri ufafanuzi mmoja finyu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Naye” huhifadhi kiunganishi cha mwendelezo; alama za nusu koloni hutenganisha sadaka tatu kwa uwazi. Viashiria [a] na [b] vimewekwa moja kwa moja baada ya istilahi vinazozifafanua.
