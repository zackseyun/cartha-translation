  text: יִשָּׂ֨א יְהוָ֤ה פָּנָי/ו֙ אֵלֶ֔י/ךָ וְ/יָשֵׂ֥ם לְ/ךָ֖ שָׁלֽוֹם׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/026.yaml
  text: May Yahweh lift up his face toward you and give you peace[a].
translation:
  language: sw
  text: Yahwe auinue uso wake kuelekea kwako, na akupe amani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “amani” (shalom) linaweza pia kumaanisha ukamilifu au hali njema.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: auinue
  rationale: Kitenzi נָשָׂא humaanisha kuinua au kuchukua. Tafsiri hii inahifadhi picha halisi ya Kiebrania ya kuinua uso, huku muktadha ukidokeza kumwelekea mtu kwa kibali.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: פָּנָיו
  choice: uso wake
  rationale: Neno פָּנִים hapa linamaanisha “uso.” Uchaguzi huu unahifadhi taswira halisi ya matini badala ya kuibadili moja kwa moja kuwa dhana ya “kibali” au “uwepo.”
- source_word: אֵלֶיךָ
  choice: kuelekea kwako
  rationale: Kihusishi אֶל kinaonyesha mwelekeo, “kwa” au “kuelekea.” “Kuelekea kwako” huonyesha wazi mwelekeo wa uso bila kuongeza maana isiyomo.
- source_word: וְיָשֵׂם
  choice: na akupe
  rationale: Ingawa שׂים kimsingi ni “kuweka,” kishazi cha kuweka amani kwa ajili ya mtu huwasilishwa kwa Kiswahili cha kawaida na wazi kama “kumpa amani.”
- source_word: לְךָ
  choice: -ku-
  rationale: Kiambishi cha yambwa katika “akupe” kinawasilisha maana ya לְךָ, yaani mpokeaji au mnufaika wa amani.
- source_word: שָׁלוֹם
  choice: amani
  rationale: שָׁלוֹם hujumuisha amani, ukamilifu, usalama, na hali njema. “Amani” ndiyo tafsiri ya msingi inayofaa katika baraka hii, na upana wa maana umeelezwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Matini ina jina la agano יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Kuhifadhi nahau ya kibinadamu ya kuinua uso
  choice: “auinue uso wake kuelekea kwako”
  alternative: “akuonyeshe kibali”
  rationale: Tafsiri iliyochaguliwa inahifadhi taswira ya Kiebrania na uzito wake wa kifasihi na kitheolojia. Maana ya kibali inadokezwa na muktadha bila kuondoa picha ya uso.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya baraka lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “na auinue” unawasilisha ombi au matakwa ya baraka; taswira ya “kuinua uso” imehifadhiwa kwa makusudi.
