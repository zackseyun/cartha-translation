base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/017.yaml
  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
translation:
  language: sw
  text: Naye atamtoa kondoo dume kuwa dhabihu ya sadaka za amani[a] kwa Yahwe, pamoja na kikapu cha mikate isiyotiwa chachu; naye kuhani atatoa sadaka ya nafaka na sadaka ya kinywaji zinazoandamana na kondoo dume huyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za ushirika.” Neno la Kiebrania שְׁלָמִים linaweza kutafsiriwa “sadaka za amani” au “sadaka za ushirika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: kondoo dume
  rationale: Katika muktadha wa dhabihu, אַיִל humaanisha kondoo dume; tafsiri hii ni mahususi na ya kawaida katika Kiswahili.
- source_word: יַעֲשֶׂה / וְעָשָׂה
  choice: atamtoa / atatoa
  rationale: Ingawa עשה kimsingi ni ‘kufanya,’ katika sheria za dhabihu huonyesha tendo la kutoa dhabihu. ‘Kutoa’ ni lugha ya kawaida ya ibada katika Kiswahili.
- source_word: זֶבַח שְׁלָמִים
  choice: dhabihu ya sadaka za amani
  rationale: Tafsiri hii inahifadhi זֶבַח kama ‘dhabihu’ na שְׁלָמִים kama aina ya sadaka, bila kufupisha vipengele hivyo viwili kuwa jina moja.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi kinaonyesha kwamba dhabihu inaelekezwa na kuwekwa wakfu kwa Yahwe; ‘kwa Yahwe’ ni ya asili katika Kiswahili.
- source_word: עַל סַל הַמַּצּוֹת
  choice: pamoja na kikapu cha mikate isiyotiwa chachu
  rationale: עַל hapa huonyesha kuambatana kwa vitu katika ibada, si mahali tu. ‘Pamoja na’ huwasilisha uhusiano huo wazi.
- source_word: מִנְחָתוֹ
  choice: sadaka yake ya nafaka
  rationale: Katika maandiko ya kikuhani מִנְחָה ni sadaka ya nafaka. Kiwakilishi cha umilikaji kinahifadhi kiambishi cha Kiebrania kinachohusisha sadaka hiyo na dhabihu iliyotajwa.
- source_word: נִסְכּוֹ
  choice: sadaka yake ya kinywaji
  rationale: Neno hili humaanisha sadaka ya kinywaji inayoandamana na dhabihu; usemi huu ni wazi na unaeleweka kwa wasomaji wa kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia jina la agano יהוה moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo kama ‘BWANA.’
- issue: Jinsi ya kutafsiri שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika
  rationale: ‘Sadaka za amani’ huhifadhi maana pana na ya jadi ya aina hii ya dhabihu, huku tafsiri mbadala ikitajwa kwa sababu neno hilo linaweza pia kusisitiza ushirika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Muundo wa sheria ya ibada umehifadhiwa bila kutumia lugha nzito isiyo ya lazima.
