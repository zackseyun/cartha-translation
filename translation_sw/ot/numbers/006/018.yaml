  to: Kisha Mnadhiri atanyoa kichwa chake cha nadhiri penye ingilio la hema la kukutania. Atachukua nywele za kichwa chake cha nadhiri na kuziweka juu ya moto ulio chini ya dhabihu ya amani[a].
  rationale: Marekebisho yanaondoa urudufu wa istilahi katika jina la dhabihu, yanafanya usemi wa kichwa kinachohusishwa na nadhiri uwe wa kawaida zaidi, na yanaweka eneo la tendo kwa ufasaha. Maana ya Kiebrania, marudio yake ya “kichwa chake cha nadhiri,” na utata wa istilahi שְׁלָמִים vimehifadhiwa.
