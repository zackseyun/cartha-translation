  text: וְ/גִלַּ֣ח הַ/נָּזִ֗יר פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶת רֹ֣אשׁ נִזְר֑/וֹ וְ/לָקַ֗ח אֶת שְׂעַר֙ רֹ֣אשׁ נִזְר֔/וֹ וְ/נָתַן֙ עַל הָ/אֵ֔שׁ אֲשֶׁר תַּ֖חַת זֶ֥בַח הַ/שְּׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/018.yaml
  text: Then the Nazirite shall shave the head of his consecration at the entrance of the tent of meeting[a], and shall take the hair of the head of his consecration and put it on the fire that is under the sacrifice of peace offerings.
translation:
  language: sw
  text: Kisha Mnadhiri atanyoa kichwa chake cha nadhiri penye ingilio la hema la kukutania. Atachukua nywele za kichwa chake cha nadhiri na kuziweka juu ya moto ulio chini ya dhabihu ya amani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhabihu ya ushirika” au “dhabihu ya ustawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּזִיר
  choice: Mnadhiri
  rationale: Ni istilahi inayotambulika katika Kiswahili kwa mtu aliye chini ya nadhiri maalumu inayoelezwa katika sura hii; inadumisha maana ya kiibada kuliko tafsiri ya jumla kama ‘mtu aliyeweka nadhiri.’
- source_word: וְגִלַּח
  choice: atanyoa
  rationale: Kitenzi kinamaanisha kunyoa nywele, na wakati ujao hapa unafaa kwa mfuatano wa maagizo ya utaratibu.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye mlango wa hema la kukutania
  rationale: ‘Mlango’ hutoa maana ya mahali pa kuingilia, na ‘hema la kukutania’ ni tafsiri ya kawaida na wazi ya mahali hapa patakatifu.
- source_word: רֹאשׁ נִזְרוֹ
  choice: kichwa chake kilichowekwa wakfu
  rationale: Tafsiri hii ya asili inahifadhi uhusiano kati ya kichwa, nywele, na hali ya kuwekwa wakfu, bila kutumia muundo mzito wa neno kwa neno ‘kichwa cha kuwekwa wakfu kwake.’
- source_word: שְׂעַר רֹאשׁ נִזְרוֹ
  choice: nywele za kichwa chake kilichowekwa wakfu
  rationale: Inadumisha marudio ya lugha ya Kiebrania na umuhimu wa kiibada wa nywele kama ishara ya kuwekwa wakfu kwa Mnadhiri.
- source_word: הָאֵשׁ
  choice: moto
  rationale: Hii ndiyo maana ya kawaida na ya moja kwa moja ya neno hilo katika muktadha huu.
- source_word: תַּחַת
  choice: chini ya
  rationale: Kihusishi kina maana ya mahali; tafsiri hii huhifadhi usemi wa Kiebrania bila kubainisha mpangilio wa madhabahu ambao matini yenyewe hauelezi.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: dhabihu ya sadaka ya amani
  rationale: ‘Dhabihu’ hutafsiri זֶבַח, huku ‘sadaka ya amani’ ikihifadhi aina maalumu ya sadaka na wigo wa maana wa שְׁלָמִים.
theological_decisions:
- issue: Tafsiri ya istilahi ya kiibada שְׁלָמִים
  choice: sadaka ya amani
  alternative: sadaka ya ushirika; sadaka ya ustawi
  rationale: ‘Sadaka ya amani’ huhifadhi jina la jadi la aina hii ya dhabihu na uhusiano wake na amani au ukamilifu, bila kuifupisha maana yake kuwa ushirika pekee. Njia nyingine zinazowezekana zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya istilahi inayohusika, ‘sadaka ya amani,’ badala ya baada ya ‘hema la kukutania.’
