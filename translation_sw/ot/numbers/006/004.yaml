translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya sheria lakini kinachoeleweka kwa msomaji wa kawaida. Neno la kiufundi “Mnadhiri” limefafanuliwa ndani ya kirai kwa kulihusisha na nadhiri yake.
