- from: Siku zote za nadhiri yake ya kuwa Mnadhiri, asile kitu chochote kilichotengenezwa kutokana na mzabibu, tangu mbegu hata ganda.[a]
  to: Katika siku zote za nadhiri yake ya Mnadhiri, asile kitu chochote kinachotokana na mzabibu, kuanzia mbegu hadi maganda.[a]
  rationale: The revision broadens “kilichotengenezwa” to “kinachotokana” so that the Swahili reflects the full class of grapevine products covered by the Hebrew. It also improves the temporal phrase and renders the seed-to-skin merism in idiomatic Standard East African Swahili, without reducing its comprehensive force.
