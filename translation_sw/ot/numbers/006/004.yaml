  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ מִ/כֹּל֩ אֲשֶׁ֨ר יֵעָשֶׂ֜ה מִ/גֶּ֣פֶן הַ/יַּ֗יִן מֵ/חַרְצַנִּ֛ים וְ/עַד זָ֖ג לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/004.yaml
  text: All the days of his Nazirite vow[a], he shall not eat anything that is made from the grapevine, from the seeds to the skin.
translation:
  language: sw
  text: Katika siku zote za nadhiri yake ya Mnadhiri, asile kitu chochote kinachotokana na mzabibu, kuanzia mbegu hadi maganda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kuanzia mbegu hadi maganda,” usemi unaomaanisha kila sehemu ya zabibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִזְרוֹ
  choice: nadhiri yake ya kuwa Mnadhiri
  rationale: Katika muktadha wa sheria ya Hesabu 6, neno hili linahusu hali au kipindi maalumu cha Mnadhiri. Tafsiri hii inabainisha taasisi hiyo kwa Kiswahili cha kawaida bila kupoteza wazo la kujiweka wakfu au kujitenga.
- source_word: מִכֹּל אֲשֶׁר יֵעָשֶׂה
  choice: kitu chochote kilichotengenezwa
  rationale: Muundo wa Kiebrania pamoja na kikanushi cha mwisho unakataza kila kitu kinachotengenezwa kutokana na mzabibu; Kiswahili hiki ni cha asili na kinahifadhi upana wa katazo.
- source_word: מִגֶּפֶן הַיַּיִן
  choice: kutokana na mzabibu
  rationale: Kirai hiki, kihalisi ‘kutokana na mzabibu wa divai,’ humaanisha mzabibu unaozaa zabibu. ‘Mzabibu’ ni sawa ya kawaida na wazi katika Kiswahili.
- source_word: מֵחַרְצַנִּים וְעַד זָג
  choice: tangu mbegu hata ganda
  rationale: Hifadhi usemi wa pande mbili unaotaja sehemu za zabibu kuonyesha kuwa katazo linahusu kila sehemu yake. ‘Mbegu’ na ‘ganda’ ndizo maana zinazokubalika zaidi za maneno haya katika muktadha.
- source_word: לֹא יֹאכֵל
  choice: asile
  rationale: Kitenzi tegemezi cha kukataza kinaonyesha amri ya sheria kwa ufupi na kwa Kiswahili sanifu.
- source_word: כֹּל יְמֵי
  choice: Siku zote za
  rationale: Hutaja muda wote wa nadhiri na kufuata kwa karibu muundo na maana ya Kiebrania.
