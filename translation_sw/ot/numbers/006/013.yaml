  yaml_path: translation/ot/numbers/006/013.yaml
  text: 'And this is the law of the Nazirite: on the day the days of his separation are completed[b][a], he shall be brought to the entrance of the tent of meeting.'
translation:
  language: sw
  text: 'Na hii ndiyo sheria ya Mnadhiri: siku za kujitenga kwake zitakapotimia[a], ataletwa kwenye mlango wa hema ya kukutania.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Siku za kujitenga kwake” zinaweza pia kutafsiriwa “siku za nadhiri yake ya Mnadhiri” au “kipindi cha kuwekwa kwake wakfu.”
    reason: lexical_alternative
  - marker: b
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “atamleta kwenye mlango wa hema ya kukutania.” Kitenzi cha Kiebrania ni cha kutenda (“atamleta”), lakini mtendaji hatajwi wazi katika aya hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת תּוֹרַת
  choice: Na hii ndiyo sheria ya
  rationale: Muundo huu unahifadhi kiunganishi וְ na mtindo rasmi wa kifungu cha kisheria. Katika muktadha huu תּוֹרָה ni sheria au agizo linaloongoza ibada.
- source_word: הַנָּזִיר
  choice: Mnadhiri
  rationale: “Mnadhiri” ni istilahi ya Kiswahili inayomtaja mtu aliyejiweka wakfu kwa nadhiri maalumu inayoelezwa katika Hesabu 6; inahifadhi maana ya taasisi hii kuliko maelezo ya jumla kama “mtu aliyewekwa wakfu.”
- source_word: בְּיוֹם מְלֹאת יְמֵי נִזְרוֹ
  choice: siku za kujitenga kwake zitakapotimia
  rationale: Kiswahili hiki cha kawaida kinawasilisha muda unaotajwa na בְּיוֹם pamoja na kukamilika kwa יְמֵי נִזְרוֹ, bila kurudia kwa namna isiyo ya kawaida “siku ambayo siku...”. “Kujitenga” huhifadhi wazo la msingi la נֵזֶר la kutengwa kwa ajili ya nadhiri.
- source_word: יָבִיא אֹתוֹ
  choice: ataletwa
  rationale: Kitenzi cha Kiebrania ni cha kutenda, “atamleta,” lakini mtendaji hatajwi wazi na kiambishi cha yambwa kinamaanisha “yeye.” Kauli ya kutendwa ni ya kawaida katika Kiswahili na inadumisha mkazo juu ya kuwasilishwa kwa Mnadhiri bila kubuni mtendaji.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye mlango wa hema ya kukutania
  rationale: “Mlango” huwasilisha פֶּתַח kwa kawaida katika mazingira ya mahali patakatifu, na “hema ya kukutania” ni tafsiri inayotambulika ya jina maalumu אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Maana ya istilahi נָזִיר na נֵזֶר katika Hesabu 6
  choice: Kutumia “Mnadhiri” na lugha ya “kujitenga”
  alternative: Kutumia “mtu aliyewekwa wakfu” na “kuwekwa wakfu,” au kueleza kila mahali kuwa ni “nadhiri ya Mnadhiri”
  rationale: “Mnadhiri” huhifadhi jina la utaratibu maalumu wa Israeli, huku “kujitenga” kikihifadhi wazo la kileksika la kutengwa kwa kusudi takatifu bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Kauli ya יָבִיא אֹתוֹ
  choice: Kutumia kauli ya kutendwa, “ataletwa”
  alternative: Kutumia kauli ya kutenda, “atamleta,” au “mtu atamleta”
  rationale: Kiebrania kina kauli ya kutenda lakini hakimtaji wazi mtendaji. Kauli ya kutendwa inalinda hali hiyo ya kutotajwa na inatoa Kiswahili cha kawaida; tanbihi inaonyesha muundo halisi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifungu cha sheria lakini kinachoeleweka kwa msomaji wa kawaida. “Mnadhiri” na “hema ya kukutania” zimetumiwa kama istilahi za kibiblia zinazotambulika. Sentensi imeepuka urudiaji mzito wa “siku ambayo siku...” huku ikihifadhi wazo la kukamilika kwa siku za kujitenga.
