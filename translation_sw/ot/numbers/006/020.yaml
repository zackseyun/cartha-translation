  text: וְ/הֵנִיף֩ אוֹתָ֨/ם הַ/כֹּהֵ֥ן תְּנוּפָה֮ לִ/פְנֵ֣י יְהוָה֒ קֹ֤דֶשׁ הוּא֙ לַ/כֹּהֵ֔ן עַ֚ל חֲזֵ֣ה הַ/תְּנוּפָ֔ה וְ/עַ֖ל שׁ֣וֹק הַ/תְּרוּמָ֑ה וְ/אַחַ֛ר יִשְׁתֶּ֥ה הַ/נָּזִ֖יר יָֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/020.yaml
  text: The priest shall wave them as a wave offering before Yahweh[a]. It is holy for the priest, besides the breast of the wave offering and the thigh of the contribution offering[b]. Afterward the Nazirite may drink wine.
translation:
  language: sw
  text: Kuhani atavitikisa vitu hivyo kama sadaka ya kutikiswa mbele za Yahwe. Hivyo vitakuwa vitakatifu kwa kuhani, zaidi ya kidari cha sadaka ya kutikiswa na paja la sadaka ya mchango[a]. Baada ya hayo, Mnadhiri anaweza kunywa divai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “paja la sadaka ya kuinuliwa.” Neno la Kiebrania תְּרוּמָה humaanisha fungu lililotengwa na kutolewa, na kwa desturi pia limetafsiriwa kwa kuzingatia tendo la kuliinua.
    reason: lexical_alternative
  - marker: b
    text: Au, “Mnadhiri atakunywa divai.” Umbo la Kiebrania linaweza kutafsiriwa hivyo moja kwa moja, lakini hapa muktadha unaonyesha kwamba baada ya kukamilisha ibada hiyo ameruhusiwa tena kunywa divai.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף אֹתָם תְּנוּפָה
  choice: atavitikisa vitu hivyo kama sadaka ya kutikiswa
  rationale: Hifili ya נוּף katika ibada ya dhabihu inaonyesha tendo la kuvitikisa au kuviwasilisha kiibada. Tafsiri hii pia inadumisha uhusiano wa kimsamiati kati ya kitenzi na תְּנוּפָה.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Hii ni kauli ya kawaida ya kiibada yenye maana ya mbele au katika uwepo wa Mungu; jina la agano יְהוָה limetolewa kama Yahwe.
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  choice: Sadaka hiyo ni sehemu takatifu ya kuhani
  rationale: Kiwakilishi cha Kiebrania ni umoja, kwa hiyo 'sadaka hiyo' hurejelea kwa pamoja kile kilichotikiswa na kueleza kuwa ni fungu lililowekwa wakfu kwa kuhani.
- source_word: עַל חֲזֵה הַתְּנוּפָה
  choice: pamoja na kidari cha sadaka ya kutikiswa
  rationale: Katika kanuni hii ya kugawa mafungu ya dhabihu, עַל inaonyesha nyongeza kwa mafungu mengine ya kuhani. 'Pamoja na' ni ya asili katika Kiswahili na haidokezi nafasi ya kimwili.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: paja la sadaka ya mchango
  rationale: שׁוֹק ni sehemu ya juu ya mguu, yaani paja; תְּרוּמָה ni fungu lililotengwa na kutolewa. 'Sadaka ya mchango' inaonyesha kazi hiyo bila kuichanganya na sadaka ya kutikiswa.
- source_word: יִשְׁתֶּה הַנָּזִיר יָיִן
  choice: Mnadhiri anaweza kunywa divai
  rationale: Katika muktadha, masharti ya nadhiri yamekamilika na katazo la divai limeondolewa. 'Anaweza kunywa' huonyesha ruhusa iliyorejeshwa, si amri ya lazima kunywa.
theological_decisions:
- issue: Utoaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la agano moja kwa moja; 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kitenzi יִשְׁתֶּה katika kishazi cha mwisho
  choice: anaweza kunywa divai
  alternative: atakunywa divai
  rationale: Muktadha wa kukamilika kwa nadhiri unaonyesha kuruhusiwa tena kunywa divai. Hata hivyo, umbo la Kiebrania linaweza kutafsiriwa moja kwa moja kama kauli ya wakati ujao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Istilahi 'Mnadhiri' na 'sadaka ya kutikiswa' zimetumiwa kwa uthabiti wa muktadha wa Hesabu 6; sentensi zimewekwa wazi bila kufuta upekee wa lugha ya kiibada.
