base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/016.yaml
  text: And the priest shall present them before Yahweh and offer his sin offering and his burnt offering[a][b].
translation:
  language: sw
  text: Kuhani atavileta mbele za Yahwe[a], na atatoa sadaka yake ya dhambi[b] na sadaka yake ya kuteketezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atavileta karibu mbele za Yahwe.” Kitenzi cha Kiebrania kinaweza kusisitiza kuwasilishwa kwa Mungu kabla ya tendo lenyewe la kutoa dhabihu.
    reason: lexical_alternative
  - marker: b
    text: “Sadaka ya dhambi” inaweza pia kueleweka kuwa “sadaka ya utakaso” katika lugha ya kikuhani kuhusu dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: atavileta
  rationale: Hifili ya קרב katika muktadha wa dhabihu humaanisha kuleta karibu au kuwasilisha. Hapa imetofautishwa na tendo linalofuata la kuitoa dhabihu. Kiambishi -vi- kinarejelea vitu vya kutolewa vilivyotajwa katika mstari uliotangulia bila kuvitaja upya.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika muktadha wa ibada na dhabihu.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי huonyesha kuletwa katika uwepo wa Mungu katika ibada; ‘mbele za’ ni usemi wa kawaida na wenye heshima katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וְעָשָׂה
  choice: na atatoa
  rationale: Ingawa עשה kwa kawaida ni ‘kufanya,’ pamoja na majina ya dhabihu ina maana ya kutekeleza tendo la kuitoa dhabihu. ‘Atatoa’ ni ya asili katika Kiswahili cha muktadha huu.
- source_word: אֶת חַטָּאתוֹ
  choice: sadaka yake ya dhambi
  rationale: חַטָּאת katika sheria za dhabihu humaanisha sadaka inayohusiana na dhambi. Tafsiri hii ni ya kawaida, huku uwezekano wa ‘sadaka ya utakaso’ ukihifadhiwa katika tanbihi.
- source_word: וְאֶת עֹלָתוֹ
  choice: na sadaka yake ya kuteketezwa
  rationale: עֹלָה ni dhabihu inayoteketezwa yote; ‘sadaka ya kuteketezwa’ ni istilahi ya Kiswahili iliyo wazi na iliyozoeleka.
- source_word: kiwakilishi kisichotajwa cha וְהִקְרִיב
  choice: -vi- katika ‘atavileta’
  rationale: Kiebrania hakitaji yambwa wazi katika mstari huu, bali muktadha wa mstari uliotangulia unaonyesha vitu vya dhabihu. Kiambishi hiki kinadumisha utegemezi huo wa muktadha bila kuvitaja kwa maelezo ya ziada.
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la agano יהוה. ‘Yahwe’ huhifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Maana ya חַטָּאת katika lugha ya dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno linaweza kueleweka kwa kuzingatia dhambi au kazi ya utakaso ya dhabihu. Tafsiri iliyozoeleka imewekwa katika matini, na maana nyingine halali imeonyeshwa katika tanbihi bila kuondoa mvutano wa istilahi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo unatofautisha kuleta vitu vya dhabihu mbele za Yahwe na tendo linalofuata la kuvitoa, huku viwakilishi vya umilikaji vikihifadhi utata wa Kiebrania kuhusu mhusika anayehusishwa na sadaka.
