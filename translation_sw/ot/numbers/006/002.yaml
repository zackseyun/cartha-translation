base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
translation:
  language: sw
  text: '“Sema na wana wa Israeli, uwaambie: Mwanamume au mwanamke atakapoweka nadhiri ya pekee[a], nadhiri ya Mnadhiri, ili ajitenge kwa ajili ya Yahweh[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akijitenga kwa kuweka nadhiri ya Mnadhiri.”
    reason: lexical_alternative
  - marker: b
    text: “Mnadhiri” ni mtu aliyejitenga kwa namna ya pekee na kuwekwa wakfu kwa Yahweh chini ya nadhiri.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi taswira ya kifamilia ya Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: mwanamume au mwanamke
  rationale: Inataja wazi jinsia zote mbili kama chanzo, badala ya kufupisha kuwa ‘mtu yeyote’.
- source_word: כִּי
  choice: anapoweka
  rationale: Katika sheria ya tukio, ‘anapo-’ huwasilisha hali ya masharti kwa Kiswahili cha asili; ‘ikiwa’ pia ingewezekana.
- source_word: יַפְלִא לִנְדֹּר נֶדֶר
  choice: anapoweka nadhiri ya pekee
  rationale: Hiphil ya פלא pamoja na usemi wa kuweka nadhiri inaonyesha tendo la kipekee au maalumu; tafsiri hii huepuka urudiaji usio wa asili.
- source_word: נֶדֶר נָזִיר
  choice: nadhiri ya Mnadhiri
  rationale: Inahifadhi uhusiano wa maneno na istilahi maalumu ya taasisi inayoelezwa katika sura hii.
- source_word: נָזִיר
  choice: Mnadhiri
  rationale: Istilahi ya Kiswahili inayotambulika kwa mtu aliyejitenga na kuwekwa wakfu chini ya nadhiri hii.
- source_word: לְהַזִּיר
  choice: ajiweke wakfu
  rationale: Inaonyesha kujitenga kwa kusudi la kujiweka kwa Mungu, bila kupunguza maana kuwa kujitenga tu.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Inawakilisha moja kwa moja jina la agano יהוה badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; ‘Yahweh’ huhifadhi jina la agano.
- issue: Ujumuishaji wa kijinsia katika sheria
  choice: mwanamume au mwanamke … ajiweke
  alternative: mtu yeyote … ajiweke
  rationale: Kutaja mwanamume na mwanamke kunahifadhi uwazi wa Kiebrania kwamba sheria inawahusu wote; kiambishi cha nafsi cha umoja katika Kiswahili hakibagui jinsia.
- issue: Uhusiano kati ya nadhiri na kujiweka wakfu
  choice: nadhiri ya pekee … ili ajiweke wakfu
  alternative: ajitenge kwa kuweka nadhiri
  rationale: Uandishi mkuu unaonyesha kusudi la nadhiri, huku tanbihi ikihifadhi uwezekano wa kusisitiza kujitenga.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wana wa Israeli’ huhifadhi nahau ya kifamilia ya chanzo; ‘Mnadhiri’ hutumiwa kama istilahi maalumu. Alama zote za tanbihi zimewekwa katika matini kuu.
