translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wenye hadhi. “Kileo” ni neno linaloeleweka kwa kinywaji chenye kulevya bila kubainisha aina ambayo maandishi ya Kiebrania hayajaitaja.
