  text: he shall abstain from wine and strong drink[a]; he shall not drink vinegar made from wine or vinegar made from strong drink, and he shall not drink any juice of grapes or eat grapes[b], fresh or dried.
translation:
  language: sw
  text: Atajizuia na divai na kileo; hatakunywa siki ya divai wala siki ya kileo. Hatakunywa kimiminika chochote kilichotokana na zabibu zilizolowekwa[a], wala hatakula zabibu mbichi wala zilizokaushwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kimiminika chochote cha zabibu,” “maji yoyote ya zabibu,” au “juisi yoyote ya zabibu.” Neno la Kiebrania linaweza kumaanisha kwa upana kimiminika kilichotokana na zabibu zilizolowekwa au kusindikwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa neno halisi kinasema “zabibu zenye unyevunyevu na zilizokauka”; yaani, zabibu mbichi na zabibu kavu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיַּיִן וְשֵׁכָר יַזִּיר
  choice: atajizuia na divai na kileo
  rationale: Kitenzi נזר katika Hiphil hapa kina maana ya kujiepusha au kujizuia na vitu vilivyotajwa. “Atajizuia na” ni Kiswahili cha kawaida kinachofikisha amri hiyo, huku “divai” na “kileo” zikidumisha tofauti kati ya יַיִן na שֵׁכָר.
- source_word: חֹמֶץ יַיִן וְחֹמֶץ שֵׁכָר
  choice: siki ya divai wala siki ya kileo
  rationale: חֹמֶץ ni kinywaji kilichochacha na kuwa kichachu, yaani siki. Miundo sambamba ya Kiebrania imehifadhiwa kwa “siki ya divai” na “siki ya kileo.”
- source_word: מִשְׁרַת עֲנָבִים
  choice: kinywaji chochote ambacho zabibu zimelowekwa ndani yake
  rationale: מִשְׁרָה huelekea kumaanisha kimiminika kilichopatikana kwa kuloweka, si lazima juisi iliyokamuliwa. Tafsiri hii inalinda maana hiyo mahususi bila kuibana kuwa juisi pekee.
- source_word: עֲנָבִים לַחִים וִיבֵשִׁים
  choice: zabibu mbichi au zilizokaushwa
  rationale: לַחִים na יְבֵשִׁים hutofautisha zabibu freshi/zenye unyevunyevu na zilizokauka. “Mbichi” ni usemi wa kawaida kwa zabibu zisizokaushwa, na “zilizokaushwa” huepuka kuingiza nomino tofauti isiyotajwa moja kwa moja.
