base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/005.yaml
  text: All the days of his Nazirite vow[a], no razor shall pass over his head. Until the days are completed for which he separates himself to Yahweh, he shall be holy[b]; he shall let the locks of the hair of his head grow long.
translation:
  language: sw
  text: Siku zote za nadhiri yake ya kuwa Mnadhiri[a], wembe hautapita juu ya kichwa chake[b]. Mpaka zitimie siku ambazo amejitenga kwa ajili ya Yahwe, atakuwa mtakatifu; ataziacha nywele za kichwa chake zikue ndefu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nadhiri yake ya kujitenga.” Neno la Kiebrania linalohusiana na “Mnadhiri” lina wazo la kujitenga au kuwekwa wakfu.
    reason: lexical_alternative
  - marker: b
    text: Kauli ya Kiebrania “wembe hautapita juu ya kichwa chake” inamaanisha kwamba hatanyoa kichwa chake.
    reason: idiom_explanation
lexical_decisions:
- source_word: נֶדֶר נִזְרוֹ
  choice: nadhiri yake ya kuwa Mnadhiri
  rationale: Hutumia istilahi ya kiufundi ‘Mnadhiri’ huku ikihifadhi wazi wazo la nadhiri; tanbihi inaeleza maana ya msingi ya kujitenga au kuwekwa wakfu.
- source_word: תַּעַר לֹא יַעֲבֹר עַל רֹאשׁוֹ
  choice: wembe hautapita juu ya kichwa chake
  rationale: Huhifadhi taswira ya nahau ya Kiebrania badala ya kuibadili moja kwa moja kuwa ‘hatanyoa kichwa chake’; tanbihi hufafanua maana yake.
- source_word: עַד מְלֹאת הַיָּמִים
  choice: Mpaka zitimie siku
  rationale: ‘Zitimie’ huwasilisha kwa Kiswahili cha kawaida wazo la siku kufikia ukamilifu wake.
- source_word: אֲשֶׁר יַזִּיר לַיהוָה
  choice: ambazo amejitenga kwa ajili ya Yahwe
  rationale: Huhifadhi wazo la kujitenga linalounganisha tendo hilo na hadhi ya Mnadhiri, na ‘kwa ajili ya’ huonyesha mwelekeo wa kujitoa kwake kwa Yahwe.
- source_word: קָדֹשׁ יִהְיֶה
  choice: atakuwa mtakatifu
  rationale: Huhifadhi istilahi ya kitheolojia ‘mtakatifu’ iliyo wazi katika Kiebrania bila kuibadilisha kuwa maelezo tu ya kuwekwa wakfu.
- source_word: גַּדֵּל פֶּרַע שְׂעַר רֹאשׁוֹ
  choice: ataziacha nywele za kichwa chake zikue ndefu
  rationale: Huwasilisha kwa lugha ya kawaida tendo la kuziacha nywele zikue bila kukatwa, ambalo ndilo wazo la ukuaji huru wa nywele katika kifungu hiki.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la agano יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Kiebrania kinatumia moja kwa moja jina la Mungu יהוה; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Kuhifadhi neno קָדֹשׁ
  choice: atakuwa mtakatifu
  alternative: atakuwa amewekwa wakfu; atakuwa ametengwa
  rationale: Neno la chanzo ni ‘mtakatifu’; tafsiri hii huhifadhi uzito wake wa kitheolojia, huku muktadha ukieleza namna ya kujitenga kwake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa nahau ya wembe umehifadhiwa katika matini na kufafanuliwa katika tanbihi; istilahi ‘Mnadhiri’ imetumiwa kwa hadhi maalumu inayozungumziwa katika sura hii.
