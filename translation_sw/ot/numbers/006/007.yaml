base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/007.yaml
  text: He shall not make himself unclean for them at their death[a], not even for his father or his mother, for his brother or his sister[b], because the consecration of his God is on his head.
translation:
  language: sw
  text: Hatajitia unajisi kwa ajili yao wanapokufa[a]—hata kwa baba yake au mama yake, ndugu yake wa kiume au wa kike—kwa sababu wakfu wa Mungu wake uko juu ya kichwa chake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hataingia katika hali ya unajisi kwa ajili yao wakati wanapokufa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָבִיו ... וּלְאִמּוֹ ... לְאָחִיו ... וּלְאַחֹתוֹ
  choice: hata iwe ni baba yake au mama yake, ndugu yake wa kiume au ndugu yake wa kike
  rationale: Virai vilivyotangulizwa katika Kiebrania vina mkazo. Muundo huu wa Kiswahili unaweka jamaa mmoja mmoja katika umoja, unahifadhi jinsia ya maneno ya asili, na kuonyesha kwamba katazo linawahusu hata jamaa wa karibu zaidi.
- source_word: לֹא יִטַּמָּא
  choice: Hatajitia unajisi
  rationale: Kitenzi cha Kiebrania katika Hitpael kina maana ya kujisababishia au kuingia katika hali ya unajisi. ‘Kujitia unajisi’ huhifadhi maana hiyo ya kujirejelea; katika muktadha huu unajisi ni wa kiibada, si lazima kuwa uovu wa kimaadili.
- source_word: לָהֶם
  choice: kwa ajili yao
  rationale: Kiwakilishi kinawarejelea jamaa waliotajwa, na usemi huu unaeleza kwa ufupi kujitia unajisi kuhusiana na mazishi au maiti yao.
- source_word: בְּמֹתָם
  choice: wanapokufa
  rationale: Kirai hiki kinaonyesha wakati au tukio la kifo ambamo unajisi ungepatikana. Kiswahili hiki ni cha kawaida na hakibadili maana ya nomino ya Kiebrania kwa kiasi kikubwa.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya katazo kwa lugha ya sasa iliyo wazi.
- source_word: נֵזֶר
  choice: wakfu
  rationale: Katika sheria ya Mnadhiri, neno hili linaonyesha hali au ishara ya kutengwa na kuwekwa wakfu kwa Mungu, inayowakilishwa na nywele za kichwani. ‘Wakfu’ huwasilisha maana ya kiibada bila kulifanya neno kuwa taji halisi pekee.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Kiambishi cha umilikaji kiko wazi katika Kiebrania, hivyo kinahifadhiwa.
- source_word: עַל רֹאשׁוֹ
  choice: uko juu ya kichwa chake
  rationale: Tafsiri hii huhifadhi picha halisi ya kitu kilicho juu ya kichwa, huku ikiacha dokezo la nywele za Mnadhiri lielezwe katika tanbihi.
theological_decisions:
- issue: Aina ya unajisi katika sheria ya Mnadhiri
  choice: Kutumia lugha ya unajisi wa kiibada bila kudokeza moja kwa moja kosa la kimaadili.
  alternative: Kutumia lugha yenye uzito wa kimaadili kama ‘kujichafua’ bila ufafanuzi.
  rationale: Muktadha unahusu unajisi unaotokana na maiti katika sheria ya Mnadhiri. Tafsiri haipaswi kuongeza dai kwamba kitendo hicho ni uchafu wa kimaadili zaidi ya kile kifungu kinachosema.
- issue: Maana ya נֵזֶר katika muktadha wa Mnadhiri
  choice: ‘Wakfu,’ huku tanbihi ikieleza hali ya kutengwa kwa Mungu na ishara ya nywele.
  alternative: ‘Taji,’ ‘utengano,’ au ‘nadhiri ya Unadhiri.’
  rationale: Neno linaweza kuhusishwa na taji au ishara ya kichwani, lakini hapa linaeleza wakfu wa Mnadhiri kwa Mungu. Tafsiri kuu inahifadhi maana ya kiibada, na tanbihi inahifadhi picha pamoja na upeo wa neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ndugu yake wa kiume’ na ‘ndugu yake wa kike’ hutofautisha kwa uwazi אָח na אָחוֹת. ‘Unajisi’ huhifadhi istilahi ya kiibada, na tanbihi hufafanua nezer bila kuingiza msimamo wa kimadhehebu.
