lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akazungumza
  rationale: Wayyiqtol ya דבר inaendeleza simulizi. Kiambishi “aka-” kinaonyesha mfuatano wa kisimulizi, na “zungumza” linafaa kwa utangulizi rasmi wa usemi unaofuatwa na לֵאמֹר.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti YHWH limetoholewa kama “Yahwe,” umbo la kawaida na linalosomeka kwa Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: אֶל
  choice: na
  rationale: Katika muundo wa Kiswahili, “kuzungumza na Musa” ndiyo njia ya kawaida ya kuonyesha mtu anayeambiwa maneno, ingawa Kiebrania hutumia kihusishi אֶל, kwa maana ya “kwa/kuelekea.”
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ni umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi fomula rasmi ya Kiebrania inayotanguliza yaliyomo katika usemi, huku ikibaki ya asili katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la Mungu YHWH. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo; tanbihi inataja desturi na utohozi mwingine bila kuamua zaidi ya ushahidi wa maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unabaki rasmi kwa kuwa mstari huu ni utangulizi wa usemi wa Mungu; koma ya mwisho inaonyesha kwamba maneno yenyewe yanafuata katika mstari unaofuata.
