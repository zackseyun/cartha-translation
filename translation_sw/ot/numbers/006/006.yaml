  yaml_path: translation/ot/numbers/006/006.yaml
  text: All the days of his separation to Yahweh[b][a], he shall not go near a dead body.
translation:
  language: sw
  text: Siku zote za unadhiri wake[a] kwa Yahweh, hatakaribia maiti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kujitenga kwake” au “kuwekwa wakfu kwake.” Neno la Kiebrania linahusu hali au kipindi cha kutengwa kama Mnadhiri.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “nafsi iliyokufa”; yaani, maiti au mwili wa binadamu aliyekufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: Siku zote za
  rationale: Muundo huu unaonyesha kipindi chote bila kuacha siku yoyote, na ni wa kawaida katika Kiswahili.
- source_word: הַזִּירוֹ
  choice: kuwekwa kwake wakfu
  rationale: Neno linatokana na mzizi נזר na hapa linaonyesha hali au kipindi cha mtu kutengwa kwa namna ya Mnadhiri; tafsiri hii haiongezi waziwazi neno ‘nadhiri,’ ambalo halipo katika nomino yenyewe.
- source_word: לַיהוָה
  choice: kwa YAHWEH
  rationale: Kihusishi kinaonyesha kuwa kujitenga huko kunaelekezwa kwa YHWH au ni kwa ajili yake. ‘Kwa YAHWEH’ ni ya asili na huhifadhi maana hiyo ya kuwekwa wakfu.
- source_word: עַל ... לֹא יָבֹא
  choice: hatakaribia
  rationale: Katika nahau hii ya sheria, kitenzi בוא pamoja na עַל na ukanushaji kinakataa kumkaribia mtu aliyekufa; ‘hatakaribia’ ni wazi na ya kawaida.
- source_word: נֶפֶשׁ מֵת
  choice: maiti
  rationale: Kwa maana halisi ni ‘nafsi/mtu aliyekufa,’ lakini katika muktadha wa sheria za unajisi humaanisha mwili wa binadamu aliyekufa. ‘Maiti’ ni neno sahihi na la kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri istilahi ya Mnadhiri bila kuipa nomino maana mahsusi kupita kiasi
  choice: kuwekwa kwake wakfu
  alternative: kipindi cha unadhiri wake; nadhiri yake ya Unadhiri
  rationale: Kiebrania kinahusu hali au kipindi cha kutengwa kama Mnadhiri. Chaguo hili huhifadhi wazo la kutengwa kwa Mungu bila kuingiza moja kwa moja ‘nadhiri’ katika nomino hii.
- issue: Jina la agano יהוה
  choice: YAHWEH
  alternative: BWANA
  rationale: Nakala ya mashauriano ya POB inatumia ‘Yahweh.’ Kutumia jina YAHWEH hapa hulitofautisha na cheo ‘Bwana’ na kuonyesha jina binafsi lililo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Kuwekwa wakfu’ kinaeleweka kwa wasomaji wa kawaida huku kikihifadhi dhana ya kujitenga kwa Mungu. Alama zote za tanbihi zimewekwa kwenye matini kuu.
