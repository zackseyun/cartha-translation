  yaml_path: translation/ot/numbers/006/027.yaml
  text: So they shall put my name on the sons of Israel[b][a], and I myself will bless them.
translation:
  language: sw
  text: Hivyo wataweka jina langu[b] juu ya wana wa Israeli[a], nami mwenyewe nitawabariki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Waisraeli” au “watu wa Israeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
  - marker: b
    text: Usemi “kuweka jina langu juu ya” huenda unamaanisha kulitaja jina la agano la BWANA juu yao na kuwatambulisha kuwa watu wake.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמוּ
  choice: Hivyo wataweka
  rationale: Kitenzi שׂוּם humaanisha ‘kuweka’ au ‘kuweka mahali.’ ‘Hivyo’ linaunganisha kauli hii na baraka ya kikuhani iliyotangulia, huku ‘wataweka’ likidumisha nguvu ya tendo linalotarajiwa.
- source_word: אֶת שְׁמִי
  choice: jina langu
  rationale: Tafsiri ya moja kwa moja inadumisha taswira ya Kiebrania na uzito wake wa kiagano bila kuibadili kuwa ufafanuzi kama ‘mamlaka yangu’ au ‘baraka yangu.’
- source_word: עַל
  choice: juu ya
  rationale: Kirai hiki kinadumisha taswira halisi ya kuweka jina la Mungu juu ya watu, na ni cha kawaida katika Kiswahili sanifu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inadumisha kwa karibu usemi wa Kiebrania, ‘wana wa Israeli,’ ambao hapa unalitaja taifa lote la agano.
- source_word: וַאֲנִי
  choice: nami mwenyewe
  rationale: Kiwakilishi huru אֲנִי kina mkazo; ‘mwenyewe’ kinaonyesha mkazo huo kwa njia ya kawaida ya Kiswahili.
- source_word: אֲבָרֲכֵם
  choice: nitawabariki
  rationale: Kitenzi ברך ni ‘kubariki’; umbo la wakati ujao linaonyesha ahadi ya Mungu, na kiambishi ‘-wa-’ kinawarejelea wana wa Israeli.
theological_decisions:
- issue: Maana ya kuweka jina la Mungu juu ya Israeli
  choice: Kudumisha usemi halisi ‘wataweka jina langu juu ya’ bila kuupanua ndani ya mstari.
  alternative: ‘wataita jina langu juu yao’ au ‘watawatia alama kuwa mali yangu’
  rationale: Usemi huo huenda unahusisha kulitaja jina la agano la BWANA juu yao na kuwatambulisha kuwa watu wake, lakini tafsiri inadumisha taswira pana ya maandishi badala ya kuifungia katika maana moja.
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Usemi wa Kiebrania ni ‘wana wa Israeli.’ Tafsiri hii inadumisha umbo hilo la kiagano, huku tanbihi ikifafanua kwamba linamaanisha jamii yote ya Israeli.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Usemi wa kiagano ‘jina langu juu ya’ na ‘wana wa Israeli’ umedumishwa, huku tanbihi zikitoa maelezo bila kuyafanya kuwa sehemu ya tafsiri yenyewe.
