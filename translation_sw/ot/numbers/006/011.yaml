base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/011.yaml
  text: And the priest shall offer one as a sin offering and one as a burnt offering[a], and he shall make atonement for him because he sinned in regard to the dead person[b], and he shall consecrate his head that same day.
translation:
  language: sw
  text: Kuhani atatoa mmoja kuwa sadaka ya dhambi[a], na mwingine kuwa sadaka ya kuteketezwa. Atamfanyia Mnadhiri upatanisho kwa sababu alitenda dhambi kuhusiana na mtu aliyekufa[b]. Mnadhiri atakiweka wakfu kichwa chake siku hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kutaja sadaka ya dhambi au sadaka ya utakaso, hasa katika muktadha wa unajisi wa kiibada.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno moja, “juu ya nafsi.” Katika muktadha huu, usemi huo humaanisha mtu aliyekufa, yaani maiti iliyosababisha unajisi wa kiibada.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשָׂה הַכֹּהֵן
  choice: Kuhani atamtoa
  rationale: Ingawa עשה kwa msingi humaanisha ‘kufanya,’ katika muktadha wa dhabihu humaanisha kuitoa au kuiandaa dhabihu. ‘Atamtoa’ ni Kiswahili cha kawaida katika lugha ya dhabihu.
- source_word: אֶחָד לְחַטָּאת
  choice: mmoja kuwa sadaka ya dhambi
  rationale: חטאת hapa ni jina la aina ya dhabihu. ‘Sadaka ya dhambi’ ni istilahi inayotambulika, huku maana mbadala ya sadaka ya utakaso ikihifadhiwa katika tanbihi kwa sababu muktadha unahusu unajisi wa kiibada.
- source_word: וְאֶחָד לְעֹלָה
  choice: na mwingine kuwa sadaka ya kuteketezwa
  rationale: עלה hutaja dhabihu inayoteketezwa yote. ‘Sadaka ya kuteketezwa’ ni tafsiri ya kawaida na iliyo wazi.
- source_word: וְכִפֶּר עָלָיו
  choice: Atamfanyia huyo Mnadhiri upatanisho
  rationale: כפר katika taratibu za kikuhani humaanisha kufanya upatanisho. ‘Huyo Mnadhiri’ huweka wazi mhusika anayerejelewa na kiambishi bila kubadili maana ya kifungu.
- source_word: מֵאֲשֶׁר חָטָא עַל הַנָּפֶשׁ
  choice: kwa sababu alitenda dhambi kuhusiana na mtu aliyekufa
  rationale: Kifungu kinaeleza sababu ya upatanisho. נפש katika muktadha huu humaanisha mtu aliyekufa au maiti, na ‘kuhusiana na’ huhifadhi uhusiano mpana wa על bila kuubana kuwa tendo fulani lisilotajwa.
- source_word: וְקִדַּשׁ אֶת רֹאשׁוֹ
  choice: kisha atakiweka wakfu kichwa chake
  rationale: קדש ni kuweka wakfu au kutakasa kwa matumizi matakatifu. ‘Kuweka wakfu kichwa chake’ hudumisha ishara ya kichwa na nywele za Mnadhiri bila kuongeza wazo la ‘kuweka wakfu tena,’ ambalo halimo wazi katika kitenzi chenyewe.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya asili ya kishazi cha wakati.
theological_decisions:
- issue: Maana ya חַטָּאת katika muktadha wa dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno linaweza kutaja dhabihu inayoshughulikia dhambi au utakaso kutokana na unajisi. Tafsiri kuu inatumia istilahi iliyozoeleka, huku tanbihi ikihifadhi maana mbadala inayofaa sana katika muktadha huu.
- issue: Kirejelewa cha הַנָּפֶשׁ
  choice: mtu aliyekufa
  alternative: maiti
  rationale: Katika sheria hii ya Unadhiri, נפש humrejelea mtu aliyekufa ambaye kifo chake kilileta unajisi. ‘Mtu aliyekufa’ hudumisha hadhi ya kibinadamu, na ‘maiti’ inaelezwa katika tanbihi kama maana ya kimuktadha.
- issue: Mhusika wa וְקִדַּשׁ
  choice: muundo wa kitenzi umeachwa ufuate mtiririko wa Kiebrania
  alternative: kutaja wazi kwamba kuhani au Mnadhiri ndiye anayekiweka kichwa wakfu
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu umoja bila kurudia nomino. Tafsiri haiongezi utambulisho wa mhusika zaidi ya ushahidi wa kisarufi na kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Istilahi za kiibada ‘sadaka ya dhambi,’ ‘sadaka ya kuteketezwa,’ ‘upatanisho,’ na ‘kuweka wakfu’ zimetumiwa kwa uthabiti. Sentensi imegawanywa kwa mtiririko wa asili wa Kiswahili huku uhusiano wa vipengele vya Kiebrania ukihifadhiwa.
