revisions:
- from: Kuhani atamtoa mmoja kuwa sadaka ya dhambi[a], na mwingine kuwa sadaka ya kuteketezwa. Atamfanyia huyo Mnadhiri upatanisho kwa sababu alitenda dhambi kuhusiana na mtu aliyekufa[b], kisha atakiweka wakfu kichwa chake siku hiyo.
  to: Kuhani atatoa mmoja kuwa sadaka ya dhambi[a], na mwingine kuwa sadaka ya kuteketezwa. Atamfanyia Mnadhiri upatanisho kwa sababu alitenda dhambi kuhusiana na mtu aliyekufa[b]. Mnadhiri atakiweka wakfu kichwa chake siku hiyo.
