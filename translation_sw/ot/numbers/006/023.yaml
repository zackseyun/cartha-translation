  yaml_path: translation/ot/numbers/006/023.yaml
  text: Speak to Aaron and to his sons[a], saying, ‘Thus you shall bless the sons of Israel. Say to them,’
translation:
  language: sw
  text: 'Mwambie Aroni na wanawe: ‘Hivi ndivyo mtakavyowabariki wana wa Israeli. Waambieni hivi:’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Mwambie
  rationale: Amri ya moja kwa moja kwa Musa ya kusema na Aroni; Kiswahili hutumia kwa kawaida muundo wa ‘mwambie’ kwa kumwelekeza mtu maneno.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Umbo la kawaida la jina hili katika mapokeo ya Biblia ya Kiswahili.
- source_word: וְאֶל בָּנָיו
  choice: na wanawe
  rationale: בָּנָיו hapa ni wana wa kiume wa Aroni wanaohudumu katika ukuhani; ‘wanawe’ ni sahihi na ya kawaida.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Infinitivu ya kunukuu imetolewa kwa alama ya koloni, ambayo huanzisha maneno yanayofuata kwa Kiswahili cha kawaida bila kurudia ‘ukisema’ kwa namna nzito.
- source_word: כֹּה
  choice: Hivi ndivyo
  rationale: Hutambulisha namna au maneno yaliyowekwa rasmi kwa ajili ya baraka.
- source_word: תְבָרֲכוּ
  choice: mtakavyowabariki
  rationale: Muundo huu unaendeleza nguvu ya maagizo ya wingi kwa Aroni na wanawe na unasikika kwa kawaida baada ya ‘Hivi ndivyo’.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi taswira halisi ya kifamilia ya Kiebrania na utambulisho wa agano, huku ikibaki wazi katika Kiswahili.
- source_word: אָמֹר לָהֶם
  choice: Waambieni hivi
  rationale: Huhifadhi nguvu ya amri na kuonyesha kwamba maneno halisi ya baraka yanafuata.
theological_decisions:
- issue: Usemi wa kijinsia na wa kiagano בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: ‘Wana wa Israeli’ huhifadhi umbo la chanzo na maana yake ya kifamilia na kiagano. Hata hivyo, katika muktadha huu usemi huo ni jina la taifa lote, si wanaume pekee.
- issue: Mfumo rasmi wa maagizo ya kikuhani כֹּה תְבָרֲכוּ
  choice: Hivi ndivyo mtakavyowabariki
  alternative: Hivi ndivyo mnavyopaswa kuwabariki
  rationale: Uteuzi huu huhifadhi maagizo yenye mamlaka bila kuongeza wazi dhana ya wajibu ambayo haijaandikwa kwa neno tofauti katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kusomeka kwa sauti, huku ukihifadhi marudio ya amri na taswira ya ‘wana wa Israeli’ katika Kiebrania.
