  text: וְ/הִזִּ֤יר לַֽ/יהוָה֙ אֶת יְמֵ֣י נִזְר֔/וֹ וְ/הֵבִ֛יא כֶּ֥בֶשׂ בֶּן שְׁנָת֖/וֹ לְ/אָשָׁ֑ם וְ/הַ/יָּמִ֤ים הָ/רִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/012.yaml
  text: He shall rededicate to Yahweh the days of his Nazirite vow[a], and he shall bring a male lamb a year old as a guilt offering. But the former days shall be void[b], because his Nazirite vow was defiled.
translation:
  language: sw
  text: Ataweka wakfu upya kwa BWANA siku za unadhiri wake[a], naye ataleta mwana-kondoo dume wa mwaka mmoja kuwa sadaka ya hatia. Lakini siku za awali hazitahesabiwa[b], kwa sababu unadhiri wake ulitiwa unajisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku za kujitenga kwake” au “siku za kuwekwa kwake wakfu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “siku za kwanza zitaanguka”; yaani, siku za unadhiri zilizotangulia hazitahesabiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזִּיר
  choice: ataziweka wakfu upya
  rationale: Hifili ya נזר hapa inaonyesha kuanza upya kipindi cha kujiweka wakfu baada ya kukatizwa na unajisi; ‘kuweka wakfu upya’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: לַיהוָה
  choice: kwa BWANA
  rationale: Kiambishi ל־ kinaonyesha kwamba kuwekwa wakfu kunaelekezwa kwa YHWH; jina la agano limetafsiriwa kwa desturi ya Kiswahili kama ‘BWANA.’
- source_word: יְמֵי נִזְרוֹ
  choice: siku za unadhiri wake
  rationale: Katika Hesabu 6, neno hili linahusu kipindi maalumu cha hali au nadhiri ya Mnadhiri, si kujitenga kwa maana ya jumla tu.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: mwana-kondoo dume wa mwaka mmoja
  rationale: Usemi huu unamtaja mwana-kondoo dume aliye katika mwaka wake wa kwanza na kuhifadhi sharti la dhabihu.
- source_word: לְאָשָׁם
  choice: kuwa sadaka ya hatia
  rationale: אָשָׁם ni aina maalumu ya sadaka inayohusishwa na hatia na fidia; ‘sadaka ya hatia’ ni istilahi inayoeleweka na inayotumika katika Kiswahili cha Biblia.
- source_word: וְהַיָּמִים הָרִאשֹׁנִים יִפְּלוּ
  choice: lakini siku za awali hazitahesabiwa
  rationale: Kitenzi יִפְּלוּ kwa maana halisi ni ‘zitaanguka,’ lakini athari yake ya kisheria hapa ni kwamba siku zilizotangulia hazihesabiwi katika kipindi cha unadhiri.
- source_word: כִּי טָמֵא נִזְרוֹ
  choice: kwa sababu unadhiri wake ulitiwa unajisi
  rationale: Kauli inaeleza uchafu wa kiibada uliouathiri unadhiri wake; umbo la kutendwa ‘ulitiwa unajisi’ linahifadhi hali hiyo bila kuifanya kuwa uchafu wa kawaida.
theological_decisions:
- issue: Maana ya נזר/נזרו katika sheria ya Mnadhiri
  choice: unadhiri wake
  alternative: kujitenga kwake; kuwekwa kwake wakfu
  rationale: Mzizi huu una maana ya kujitenga kwa ajili ya kuwekwa wakfu, lakini katika Hesabu 6 ni istilahi ya hali au nadhiri maalumu ya Mnadhiri. ‘Unadhiri’ huhifadhi umaalumu huo huku tanbihi ikionyesha upana wa maana.
- issue: Uwasilishaji wa יהוה
  choice: BWANA
  alternative: Yahwe; Yehova
  rationale: ‘BWANA’ ni uwasilishaji wa heshima uliozoeleka katika Kiswahili kwa jina la agano YHWH.
- issue: Athari ya siku zilizotangulia baada ya unajisi
  choice: hazitahesabiwa
  alternative: zitaanguka; zitakuwa batili
  rationale: Tafsiri hii inaeleza matokeo ya kisheria ya יִפְּלוּ bila kudai kwamba siku hizo hazikuwahi kuwapo; tanbihi inadumisha taswira halisi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Unadhiri’ limetumiwa kama neno la kiufundi linalohusiana na Mnadhiri; maelezo mbadala yametolewa katika tanbihi. Muundo wa sheria wa wakati ujao umehifadhiwa kwa ‘ata-’.
