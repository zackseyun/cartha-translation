  yaml_path: translation/ot/numbers/006/015.yaml
  text: 'and a basket of unleavened bread: fine flour cakes mixed with oil[a], and unleavened wafers anointed with oil[b], along with their grain offering and their drink offerings.'
translation:
  language: sw
  text: 'na kikapu cha mikate isiyotiwa chachu: mikate ya unga laini iliyochanganywa na mafuta[a], na mikate myembamba isiyotiwa chachu iliyopakwa mafuta[b], pamoja na sadaka yao ya nafaka na sadaka zao za kinywaji.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikate isiyotiwa chachu ya unga laini iliyochanganywa na mafuta”; neno la Kiebrania linalotangulia ni pana, kisha mstari unataja mikate na mikate myembamba kama aina zake.
    reason: lexical_alternative
  - marker: b
    text: Au, “iliyotiwa mafuta.” Kitenzi cha Kiebrania ndicho neno la kawaida la kupaka mafuta, lakini hapa kinaeleza jinsi mikate hiyo myembamba ilivyotayarishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַל
  choice: kikapu
  rationale: Neno hili linamaanisha chombo kilichobeba vyakula visivyotiwa chachu; “kikapu” ni tafsiri ya kawaida na wazi.
- source_word: מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: Neno hili ni pana na linataja vyakula vya mkate visivyotiwa chachu; muktadha unaendelea kutaja aina zake, yaani mikate na mikate myembamba.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Hili ni neno la kawaida katika sheria za sadaka kwa unga uliosagwa vizuri.
- source_word: חַלֹּת
  choice: mikate
  rationale: Katika muktadha wa sadaka, neno hili linataja vipande vya mkate vilivyotengenezwa kwa umbo maalumu; “mikate” ni ya kawaida na haileti taswira ya keki tamu za kisasa.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: iliy(changanywa) na mafuta
  rationale: Kishirikishi kinaonyesha kwamba mafuta yamechanganywa ndani ya mikate; katika matini imetolewa kwa kawaida kama “iliyochanganywa na mafuta.”
- source_word: רְקִיקֵי מַצּוֹת
  choice: mikate myembamba isiyotiwa chachu
  rationale: רְקִיקִים ni vipande vyembamba vya mkate wa sadaka; usemi huu wa Kiswahili unaonyesha unene wake bila kutumia neno lisiloeleweka kwa urahisi.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: iliyopakwa mafuta
  rationale: Ingawa kitenzi ni kile kinachotumiwa kwa kupaka mafuta, hapa kinaeleza utayarishaji wa chakula; “iliyopakwa mafuta” ni ya asili katika Kiswahili na huhifadhi tendo lenyewe.
- source_word: מִנְחָתָם
  choice: sadaka yake ya nafaka
  rationale: מִנְחָה katika sheria za dhabihu humaanisha sadaka ya nafaka. Kiambishi cha Kiebrania ni cha wingi, lakini kwa Kiswahili marejeo ya pamoja kwa sadaka iliyotangulia yanaweza kutolewa kwa umoja bila kupotosha maana.
- source_word: נִסְכֵּיהֶם
  choice: sadaka zake za kinywaji
  rationale: Neno hili linamaanisha sadaka za majimaji zilizomiminwa zinazoandamana na dhabihu; “sadaka za kinywaji” ni wazi na limezoeleka katika lugha ya Biblia.
