translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Tafsiri imetumia “mikate myembamba” badala ya istilahi ya kigeni kama “waferi,” na imeepuka “keki” kwa sababu katika matumizi ya sasa neno hilo huashiria zaidi kitindamlo kitamu.
