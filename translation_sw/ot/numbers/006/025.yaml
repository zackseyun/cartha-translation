  yaml_path: translation/ot/numbers/006/025.yaml
  text: May Yahweh make his face shine upon you and be gracious to you[a].
translation:
  language: sw
  text: Yahwe aufanye uso wake uangaze juu yako, na akufadhili[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe aufanye uso wake uangaze kuelekea kwako, na akuonyeshe kibali.”
    reason: alternative_reading
lexical_decisions:
- source_word: יָאֵר
  choice: aufanye ... ukuangazie
  rationale: Hii ni kauli ya kutakia mema yenye maana ya kusababisha mwanga uangaze. Muundo huu unahifadhi nguvu ya ombi la baraka na maana ya kisababishi, huku ukisomeka kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: פָּנָיו
  choice: uso wake
  rationale: Hii ndiyo maana halisi ya taswira ya Kiebrania. Inahifadhi picha ya kishairi ya uso wa Mungu kama ishara ya uwepo na kibali chake bila kuifafanua kupita kiasi.
- source_word: אֵלֶיךָ
  choice: ukuangazie
  rationale: Kiambishi cha utendea “-ie” pamoja na kiambishi cha yambwa “-ku-” kinaonyesha kwamba mwanga wa uso unaelekezwa kwako. Huu ni usemi wa asili zaidi katika Kiswahili kuliko “juu yako” katika sentensi hii.
- source_word: וִיחֻנֶּךָּ
  choice: na akufanyie neema
  rationale: Kitenzi חנן humaanisha kumwonyesha mtu fadhili au neema. “Akufanyie neema” kinafaa katika muktadha wa baraka na hakikazii huruma kwa mwenye taabu pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Taswira ya kibinadamu ya uso wa Mungu kuangaza
  choice: Kuhifadhi taswira ya “uso wake” katika andiko kuu
  alternative: uwepo wake ukuangazie / akutazame kwa kibali
  rationale: Kiebrania kinatumia picha halisi ya uso unaoangaza kuwasilisha uwepo wenye kibali. Kuihifadhi kunatunza uzito wa kishairi na wa kiteolojia bila kuibana kuwa maelezo ya dhana tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa baraka ya liturujia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi taswira ya Kiebrania na wakati huohuo huepuka lugha ya kizamani.
