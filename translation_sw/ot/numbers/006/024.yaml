base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/024.yaml
  text: May Yahweh bless you and keep you[a].
translation:
  language: sw
  text: Yahwe akubariki na akulinde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: akubariki
  rationale: Kitenzi cha Kiebrania ni Piel jussive, nafsi ya tatu umoja wa kiume, chenye kiambishi cha nafsi ya pili umoja. Katika muktadha wa baraka, umbo la Kiswahili lenye ‘a-’ huwasilisha ombi au tamko la baraka kwa njia ya kawaida na yenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni jina la Mungu la herufi nne YHWH. ‘Yahwe’ ni uwasilishaji wa jina hilo unaofaa katika tahajia ya Kiswahili, badala ya kulibadilisha kuwa cheo kama ‘BWANA’.
- source_word: וְיִשְׁמְרֶךָ
  choice: na akulinde
  rationale: Kitenzi cha Kiebrania ni Qal jussive, nafsi ya tatu umoja wa kiume, chenye kiambishi cha nafsi ya pili umoja. ‘Akulinde’ huonyesha kwa ufupi wazo la kuhifadhi na kukinga, huku kikidumisha ulinganifu wa kishairi wa baraka.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Andiko linatumia moja kwa moja jina la agano YHWH. ‘Yahwe’ hulihifadhi kama jina binafsi na kulipa umbo la kawaida katika tahajia ya Kiswahili, bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kifupi na chenye hadhi. Muundo wa baraka umehifadhiwa kwa vitenzi sambamba ‘akubariki’ na ‘akulinde’; ‘wewe’ haijaongezwa kwa kuwa kiambishi ‘-ku-’ tayari humtaja anayebarikiwa.
