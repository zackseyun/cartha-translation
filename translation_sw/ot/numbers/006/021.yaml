id: NUM.6.21
reference: Numbers 6:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֣ת הַ/נָּזִיר֮ אֲשֶׁ֣ר יִדֹּר֒ קָרְבָּנ֤/וֹ לַֽ/יהוָה֙ עַל נִזְר֔/וֹ מִ/לְּ/בַ֖ד אֲשֶׁר תַּשִּׂ֣יג יָד֑/וֹ כְּ/פִ֤י נִדְר/וֹ֙ אֲשֶׁ֣ר יִדֹּ֔ר כֵּ֣ן יַעֲשֶׂ֔ה עַ֖ל תּוֹרַ֥ת נִזְרֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/021.yaml
  text: This is the law of the Nazirite who vows his offering to Yahweh for his Nazirite vow[a], besides what his hand can afford. According to the vow that he vows, so he shall do, according to the law of his Nazirite vow.
translation:
  language: sw
  text: 'Hii ndiyo sheria ya Mnadhiri anayoweka nadhiri: sadaka yake kwa Yahwe kwa ajili ya unadhiri wake, pamoja na yale anayoweza kumudu.[a] Kulingana na nadhiri yake aliyoweka, ndivyo atakavyotenda, sawasawa na sheria ya unadhiri wake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mbali na kile ambacho mkono wake unaweza kufikia.” Nahau hii inamaanisha kile ambacho uwezo au mali yake inamruhusu kutoa.
    reason: Nahau ya Kiebrania inaelekea kumaanisha kile ambacho uwezo au mali yake inamruhusu kutoa; tanbihi huhifadhi taswira halisi.
lexical_decisions:
- source_word: תּוֹרַת
  choice: sheria ya
  rationale: Katika muktadha huu wa kisheria, neno hili linamaanisha kanuni au utaratibu unaomwongoza Mnadhiri; “sheria” ni wazi, fupi, na yenye hadhi.
- source_word: הַנָּזִיר
  choice: Mnadhiri
  rationale: Hili ni jina la kiufundi linalotambulika katika Kiswahili cha Biblia kwa mtu aliyejiweka wakfu kwa nadhiri maalumu iliyoelezwa katika sura hii.
- source_word: אֲשֶׁר יִדֹּר
  choice: anayetoa nadhiri
  rationale: Tafsiri hii huhifadhi tendo la kuweka nadhiri na ni ya kawaida katika Kiswahili sanifu.
- source_word: קָרְבָּנוֹ
  choice: sadaka yake
  rationale: קָרְבָּן ni sadaka inayoletwa mbele za Mungu; “sadaka” ndiyo istilahi ya kawaida na inayoeleweka.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kiambishi ל kinaonyesha kwamba sadaka inaelekezwa au kuwekwa wakfu kwa Yahwe.
- source_word: עַל נִזְרוֹ
  choice: kwa ajili ya unadhiri wake
  rationale: Neno נֵזֶר hapa linahusu hali ya kujitenga na kujiweka wakfu kwa Mnadhiri; “unadhiri” hudumisha uhusiano wake na nadhiri maalumu ya sura hii.
- source_word: מִלְּבַד אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: zaidi ya kile anachoweza kukimudu
  rationale: Nahau ya Kiebrania, kihalisi kile ambacho mkono wake unaweza kufikia, inaelekea kumaanisha uwezo wake wa mali; maana hiyo imetolewa kwa Kiswahili cha kawaida huku taswira ya asili ikiwekwa katika tanbihi.
- source_word: כְּפִי נִדְרוֹ
  choice: kulingana na nadhiri
  rationale: Kifungu hiki kinataka matendo yapatane na yaliyomo katika nadhiri.
- source_word: אֲשֶׁר יִדֹּר
  choice: aliyoweka
  rationale: Katika kutajwa kwa pili, “nadhiri aliyoweka” ni Kiswahili asilia na bado huhifadhi urudiaji wa wazo la nadhiri katika Kiebrania.
- source_word: כֵּן יַעֲשֶׂה
  choice: atatenda
  rationale: Kauli ya wakati ujao katika muktadha huu wa kisheria ina nguvu ya wajibu; “atatenda” hudumisha mtindo rasmi bila kuifanya kuwa amri kali kuliko chanzo.
- source_word: עַל תּוֹרַת נִזְרוֹ
  choice: sawasawa na sheria ya unadhiri wake
  rationale: Kifungu cha mwisho kinarudisha wajibu kwenye kanuni inayotawala unadhiri wake; “sawasawa na” hutoa maana ya kufuata au kupatana na sheria hiyo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya נִזְרוֹ katika muktadha wa Mnadhiri
  choice: unadhiri wake
  alternative: kujiweka wakfu kwake au kujitenga kwake
  rationale: Neno linaweza kuonyesha kujitenga/kuwekwa wakfu na pia hali inayotokana na nadhiri. “Unadhiri” hudumisha istilahi ya sura hii bila kufuta kabisa mvutano huo wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa kisheria umehifadhiwa, lakini sentensi imepangwa kwa urahisi wa kusomeka. Istilahi “Mnadhiri” na “unadhiri” zimetumiwa kwa uthabiti; jina la Mungu limetolewa kama “Yahwe.”
