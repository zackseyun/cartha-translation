  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, YHWH. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
