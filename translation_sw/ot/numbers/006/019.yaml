reference: Numbers 6:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/זְּרֹ֣עַ בְּשֵׁלָה֮ מִן הָ/אַיִל֒ וְֽ/חַלַּ֨ת מַצָּ֤ה אַחַת֙ מִן הַ/סַּ֔ל וּ/רְקִ֥יק מַצָּ֖ה אֶחָ֑ד וְ/נָתַן֙ עַל כַּפֵּ֣י הַ/נָּזִ֔יר אַחַ֖ר הִֽתְגַּלְּח֥/וֹ אֶת נִזְרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/019.yaml
  text: Then the priest shall take the boiled shoulder from the ram[a], one unleavened loaf from the basket, and one unleavened wafer, and put them on the palms of the Nazirite after he has shaved his consecrated head.
translation:
  language: sw
  text: Kisha kuhani atatwaa bega lililochemshwa la huyo kondoo dume, mkate mmoja usiotiwa chachu kutoka kwenye kikapu, na mkate mwembamba mmoja usiotiwa chachu, naye ataviweka juu ya viganja vya Mnadhiri baada ya huyo Mnadhiri kunyoa nywele za kuwekwa wakfu kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “baada ya kunyoa kuwekwa wakfu kwake.” Katika muktadha, hii inarejelea nywele zilizokuwa ishara ya kuwekwa wakfu kwa Mnadhiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha ... atatwaa
  rationale: Katika mfululizo wa maagizo ya ibada, waw pamoja na kitenzi timilifu huonyesha hatua inayofuata; ‘Kisha ... atatwaa’ ni ya asili katika Kiswahili cha kisheria na hudumisha mpangilio.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Neno la kawaida la Kiswahili kwa mhudumu rasmi wa kikuhani; umaalumu wake unaeleweka katika muktadha.
- source_word: הַזְּרֹעַ בְּשֵׁלָה
  choice: bega lililochemshwa
  rationale: זְרוֹעַ katika sadaka ni sehemu ya mguu wa mbele/bega, na בְּשֵׁלָה huonyesha kuwa limechemshwa. ‘Bega’ ni neno linaloeleweka kwa urahisi bila kupoteza maana ya sehemu ya sadaka.
- source_word: מִן הָאַיִל
  choice: la huyo kondoo dume
  rationale: Muundo huu unaonyesha mnyama ambaye bega hilo limetolewa kwake; ‘huyo’ hurejelea kondoo dume aliyetajwa katika muktadha wa karibu.
- source_word: חַלַּת מַצָּה אַחַת
  choice: mkate mmoja usiotiwa chachu
  rationale: חַלָּה ni mkate au keki ya mkate; ‘mkate’ ni ya asili zaidi kwa wasomaji wa sasa, huku מַצָּה ikihifadhiwa kwa ‘usiotiwa chachu.’
- source_word: מִן הַסַּל
  choice: kutoka kwenye kikapu
  rationale: Hutoa wazi chanzo cha mkate na kutafsiri סַל kwa neno la kawaida ‘kikapu.’
- source_word: וּרְקִיק מַצָּה אֶחָד
  choice: na mkate mwembamba mmoja usiotiwa chachu
  rationale: רְקִיק ni bidhaa nyembamba ya mkate; ‘mkate mwembamba’ ni wazi na ya kawaida kuliko istilahi isiyozoeleka ya ‘waferi.’
- source_word: וְנָתַן עַל כַּפֵּי
  choice: naye ataviweka juu ya viganja vya
  rationale: Kitenzi kinaendeleza agizo, na כַּפֵּי hutaja hasa viganja, si mikono kwa ujumla. Kiambishi ‘vi-’ hurejelea vitu vitatu vilivyotajwa.
- source_word: הַנָּזִיר
  choice: Mnadhiri
  rationale: Istilahi ya kibiblia ya Kiswahili kwa mtu aliye chini ya nadhiri hii maalumu; ni fupi na hutofautisha nafasi hii na mtu yeyote aliyeweka nadhiri ya kawaida.
- source_word: אַחַר הִתְגַּלְּחוֹ
  choice: baada ya huyo Mnadhiri kunyoa
  rationale: Muundo wa wakati unaonyesha kunyoa kumekamilika kabla ya kuhani kuweka vitu viganjani. Kurudia ‘Mnadhiri’ huondoa utata wa kiwakilishi kuhusu anayenyoa.
- source_word: אֶת נִזְרוֹ
  choice: nywele za kuwekwa wakfu kwake
  rationale: Kihalisi נִזְרוֹ ni ‘kuwekwa wakfu kwake/nadhiri yake,’ lakini katika ibada hii kinarejelea kwa metonimia nywele zilizokuwa ishara ya kuwekwa wakfu. Tafsiri inaweka picha ya kimwili bila kuifanya kuwa ‘kichwa’ moja kwa moja.
theological_decisions:
- issue: Maana ya נִזְרוֹ katika ibada ya Mnadhiri
  choice: nywele za kuwekwa wakfu kwake
  alternative: kuwekwa wakfu kwake; nywele za nadhiri yake; kichwa chake kilichowekwa wakfu
  rationale: Kiebrania chenyewe kinasema kwa namna inayoweza kutafsiriwa kihalisi ‘kuwekwa wakfu kwake,’ lakini muktadha wa kunyoa unaelekeza kwa nywele zilizowakilisha hali hiyo. ‘Nywele za kuwekwa wakfu kwake’ hudumisha uhusiano huo wa kiibada bila kuingiza fundisho la kimadhehebu wala kubadili neno kuwa ‘kichwa’ bila ishara kwa usemi halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. ‘Mnadhiri’ imetumiwa kama istilahi ya kibiblia; ‘mkate mwembamba’ huepuka istilahi ya kigeni. Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
