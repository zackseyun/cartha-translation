source:
  edition: WLC
  text: וְ/כִֽי יָמ֨וּת מֵ֤ת עָלָי/ו֙ בְּ/פֶ֣תַע פִּתְאֹ֔ם וְ/טִמֵּ֖א רֹ֣אשׁ נִזְר֑/וֹ וְ/גִלַּ֤ח רֹאשׁ/וֹ֙ בְּ/י֣וֹם טָהֳרָת֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יְגַלְּחֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/009.yaml
  text: And if someone dies suddenly beside him[a], and he defiles his consecrated head, then he shall shave his head on the day of his cleansing[b]; on the seventh day he shall shave it.
translation:
  language: sw
  text: Na mtu akifa ghafula[a] karibu naye, na kichwa chake cha wakfu[b] kikanajisika, atanyoa kichwa chake siku ya kutakaswa kwake; siku ya saba atakinyoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno moja, “ghafula.” Kiebrania hutumia maneno mawili yanayofuatana ili kukazia kifo cha ghafla na kisichotarajiwa kilichotokea karibu naye.
    reason: lexical_alternative
  - marker: b
    text: Au “kichwa chake kilichowekwa wakfu.” Usemi wa Kiebrania unaunganisha kichwa na hali yake ya kuwekwa wakfu akiwa Mnadhiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Na ikiwa
  rationale: Huanzisha hali ya masharti ndani ya sheria za Mnadhiri, huku ikihifadhi kiunganishi cha Kiebrania.
- source_word: יָמוּת מֵת
  choice: mtu atakufa
  rationale: Kitenzi na nomino ya mzizi mmoja vinaunda nahau inayomaanisha kwamba mtu anakufa; Kiswahili cha kawaida hakihitaji kurudia wazo la ‘mfu kufa.’
- source_word: עָלָיו
  choice: kando yake
  rationale: Katika muktadha wa unajisi unaotokana na maiti, neno hili linaonyesha kuwa kifo kimetokea karibu sana na Mnadhiri, si lazima juu yake au kwa kugusana naye.
- source_word: בְּפֶתַע פִּתְאֹם
  choice: ghafula
  rationale: Maneno haya mawili yanayofuatana yanakazia kuwa kifo kimetokea kwa kushtukiza na bila kutarajiwa; ‘ghafula’ ni tafsiri fupi na ya kawaida.
- source_word: וְטִמֵּא
  choice: na hivyo kukinajisi
  rationale: Umbo la kitenzi ni tendaji, lakini mtendaji anaweza kueleweka kuwa mtu aliyekufa au tukio la kifo. ‘Na hivyo’ huonyesha matokeo bila kulazimisha utambulisho wa mtendaji kuliko Kiebrania.
- source_word: רֹאשׁ נִזְרוֹ
  choice: kichwa chake kilichowekwa wakfu
  rationale: נזר hapa ni hali ya kuwekwa wakfu ya Mnadhiri, inayowakilishwa hasa na nywele zake zisizokatwa. Tafsiri hii ni ya kawaida na inadumisha maana ya kiibada.
- source_word: וְגִלַּח רֹאשׁוֹ
  choice: basi atanyoa kichwa chake
  rationale: ‘Basi’ huonyesha hatua inayotakiwa baada ya unajisi, kwa mtiririko wa kawaida wa sheria katika Kiswahili.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: siku ya kutakaswa kwake
  rationale: Kirai kinahusu kutakaswa kiibada baada ya unajisi. Muundo huu unaeleweka kwa urahisi bila kuifanya sentensi kuwa ya kitaalamu kupita kiasi.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: siku ya saba
  rationale: Ni maelezo ya moja kwa moja na ya kawaida ya wakati uliowekwa.
- source_word: יְגַלְּחֶנּוּ
  choice: atakinyoa
  rationale: Kiambishi cha yambwa kinarejelea kichwa kilichotajwa awali; Kiswahili kinaweza kuhifadhi rejeo hilo bila kurudia nomino.
theological_decisions:
- issue: Maana ya unajisi wa Mnadhiri
  choice: 'Kutafsiri נזר kwa lugha ya kuwekwa wakfu: ‘kichwa chake kilichowekwa wakfu.’'
  alternative: ‘kichwa cha kujitenga kwake’ au ‘kichwa cha nadhiri yake.’
  rationale: Mstari unahusu unajisi wa kiibada unaokatiza hali ya Mnadhiri ya kuwekwa wakfu. Tafsiri iliyochaguliwa inadumisha umuhimu wa kiibada wa kichwa na nywele bila kuingiza maana ya ‘nadhiri’ mahali ambapo neno hilo halipo wazi katika kifungu hiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Mnadhiri’ limewekwa katika tanbihi tu ili mstari wenyewe ubaki wazi na usibebe maelezo yasiyosemwa moja kwa moja. Alama za tanbihi zimewekwa baada ya vifungu vinavyofafanuliwa, na mpangilio wake umerekebishwa ili kila tanbihi ilingane na kifungu chake.
