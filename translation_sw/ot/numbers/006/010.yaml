lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁמִינִי
  choice: Siku ya nane
  rationale: Kirai hiki cha wakati kinaonyesha hatua inayofuata katika maagizo. Kiswahili cha kawaida hakihitaji kuanza na kiunganishi “na” ili kuhifadhi mfuatano huo.
- source_word: יָבִא
  choice: atamletea
  rationale: Hifili isiyotimilifu ina nguvu ya agizo katika muktadha wa kisheria. “Atamletea” huonyesha kuwa ndege hao wanaletwa kwa kuhani, huku mahali pa tendo likitajwa baadaye.
- source_word: שְׁתֵּי תֹרִים
  choice: hua wawili
  rationale: תֹרִים ni hua, aina ya ndege wa jamii ya njiwa; “hua wawili” ni usemi wa kawaida na unaoeleweka katika Kiswahili sanifu.
- source_word: אוֹ
  choice: au
  rationale: Huwasilisha chaguo jingine linalokubalika la sadaka.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: makinda mawili ya njiwa
  rationale: Kirai cha Kiebrania, kihalisi “wana wawili wa njiwa,” ni nahau inayomaanisha njiwa wachanga. “Makinda mawili ya njiwa” ni tafsiri ya asili na sahihi kwa ndege wachanga.
- source_word: אֶל הַ/כֹּהֵן
  choice: kwa kuhani
  rationale: Kihusishi אֶל hapa humtaja kuhani kama anayepokea ndege hao.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye ingilio la hema la kukutania
  rationale: פֶּתַח ni ingilio au mlango, na אֹהֶל מוֹעֵד ni jina la mahali pa kukutana palipowekwa. “Hema la kukutania” ni istilahi ya kibiblia iliyo wazi na yenye heshima.
