translation:
  language: sw
  text: Na siku ya nane ataleta hua wawili au makinda mawili ya njiwa[a] kwa kuhani, kwenye mlango wa Hema la Kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi ni “wana wawili wa njiwa,” nahau inayomaanisha njiwa wachanga.
