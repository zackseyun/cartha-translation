id: NUM.6.8
reference: Numbers 6:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ קָדֹ֥שׁ ה֖וּא לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/008.yaml
  text: All the days of his separation he is holy to Yahweh[a].
translation:
  language: sw
  text: Siku zote za kujitenga kwake, yeye ni mtakatifu kwa Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nadhiri yake ya Unadhiri” au “kuwekwa kwake wakfu.” Neno la Kiebrania linahusu hali ya kutengwa akiwa Mnadhiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי
  choice: Siku zote za
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha kipindi chote kinachohusika na kuhifadhi nguvu kamili ya כֹּל.
- source_word: נִזְרוֹ
  choice: kujitenga kwake
  rationale: Katika sheria kuhusu Mnadhiri, neno hili linahusu hali au kipindi chake cha kutengwa kwa ajili ya Mungu, si lazima tamko la nadhiri lenyewe. Tanbihi inaonyesha tafsiri nyingine zinazowezekana.
- source_word: קָדֹשׁ הוּא
  choice: yeye ni mtakatifu
  rationale: Kiwakilishi cha kujitegemea הוּא kimewakilishwa kwa “yeye,” nacho קָדֹשׁ kimetafsiriwa “mtakatifu” ili kuhifadhi uzito wa kidini wa neno hilo.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kiambishi ל־ hapa kinaonyesha uhusiano wa kuwekwa wakfu kwa Mungu; “kwa Yahwe” ni Kiswahili cha kawaida na huhifadhi jina la agano יהוה.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Maana ya נִזְרוֹ katika sheria ya Mnadhiri
  choice: kujitenga kwake
  alternative: nadhiri yake ya Unadhiri; kuwekwa kwake wakfu
  rationale: Muktadha unasisitiza muda wote wa hali ya Mnadhiri ya kutengwa. Tafsiri hii haitambulishi neno hilo moja kwa moja na tendo la kuweka nadhiri, wala hailichanganyi na kauli inayofuata kwamba yeye ni mtakatifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Mnadhiri” limetumiwa katika tanbihi kama istilahi ya kibiblia inayotambulika, huku maandishi makuu yakihifadhi usemi wa moja kwa moja “kujitenga kwake.”
