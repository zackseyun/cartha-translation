base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/027.yaml
  text: 'And you shall present a burnt offering as a pleasing aroma to Yahweh: two bulls from the herd[a], one ram, and seven male lambs a year old.'
translation:
  language: sw
  text: 'Nanyi mtatoa sadaka ya kuteketezwa kwa harufu ya kupendeza kwa Yahwe: mafahali wawili wa kundi la ng’ombe, kondoo dume mmoja, na wanakondoo dume saba wenye umri wa mwaka mmoja.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Nanyi mtatoa
  rationale: Hifili ya קרב katika muktadha wa dhabihu ina maana ya kuleta au kutoa sadaka; “mtatoa” ni ya kawaida na huhifadhi maana ya ibada.
- source_word: עוֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa sadaka iliyoteketezwa yote, bila kutegemea tu maana ya kimzizi ya kitu kinachopanda.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: kuwa harufu ya kumpendeza
  rationale: Huhifadhi taswira halisi ya harufu na wakati huohuo maana ya sadaka kukubaliwa na Yahwe.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili, “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: mafahali wawili kutoka kundini
  rationale: Huhifadhi utambulisho wa wanyama kuwa mafahali wa kundi la ng’ombe bila kuongeza dai lisilo wazi kwamba ni mafahali wachanga.
- source_word: אַיִל אֶחָד
  choice: kondoo dume mmoja
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya mnyama huyu wa dhabihu.
- source_word: שִׁבְעָה כְבָשִׂים
  choice: wanakondoo dume saba
  rationale: כְבָשִׂים hapa ni wanakondoo wa kiume; “dume” huhifadhi taarifa hiyo.
- source_word: בְּנֵי שָׁנָה
  choice: wenye umri wa mwaka mmoja
  rationale: Hueleza kwa uwazi sifa ya umri inayowahusu wanakondoo wote saba.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina la Mungu la herufi nne moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לְרֵיחַ נִיחֹחַ katika lugha ya dhabihu
  choice: harufu ya kumpendeza Yahwe
  alternative: harufu ya kumtuliza Yahwe
  rationale: “Kumpendeza” huhifadhi wazo la kukubalika kwa sadaka bila kuamua kwamba Mungu alikuwa na hasira iliyohitaji kutulizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa orodha umehifadhiwa, na msamiati wa sadaka umetolewa kwa lugha ya kawaida ya Biblia bila ufafanuzi wa kimadhehebu.
