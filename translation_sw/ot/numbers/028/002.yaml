review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperative, the corporate designation, the obligation of careful observance, and the appointed time. However, "katika sadaka zangu" changes the Hebrew relation expressed by לְ ('for'), and the added "na" makes the final sacrificial phrase more coordinative than the Hebrew’s appositional chain.
  naturalness: The Swahili is generally clear and appropriately formal. "Chakula changu kwa ajili ya sadaka zangu za moto" is natural enough while more accurately preserving the relationship in the source. Removing "na" better retains the marked, list-like cultic formulation without making the sentence difficult to understand.
  terminology: '"Wana wa Israeli," "sadaka," "chakula changu," and "harufu inayonipendeza" are suitable Standard East African Swahili renderings. "Sadaka zangu za moto" is preferable to "sadaka zangu zinazoteketezwa kwa moto," since אִשֶּׁה denotes offerings by fire and does not itself specify that every offering is wholly consumed.'
  issues:
  - severity: medium
    issue: The phrase "katika sadaka zangu zinazoteketezwa kwa moto" renders לְאִשַּׁי as though the food is located within the offerings.
    rationale: 'The preposition לְ marks purpose/relation: ''my food for my offerings by fire.'' Rendering it with "kwa ajili ya" preserves this relation more closely.'
  - severity: low
    issue: The conjunction "na" before "harufu inayonipendeza" smooths an appositional sequence into a coordinated list.
    rationale: The Hebrew presents 'my offering, my food for my offerings by fire, my pleasing aroma' as a dense sequence of appositional descriptions. Omitting "na" more closely reflects this structure.
  - severity: low
    issue: '"Zinazoteketezwa kwa moto" can imply wholly burnt offerings.'
    rationale: The sacrificial term אִשֶּׁה broadly refers to an offering by fire; "sadaka za moto" avoids adding the notion of total consumption.
  revised_text: Waagize wana wa Israeli[a], uwaambie, ‘Sadaka yangu, chakula changu kwa ajili ya sadaka zangu za moto, harufu inayonipendeza[b], muwe waangalifu kunitolea kwa wakati wake uliowekwa.’
