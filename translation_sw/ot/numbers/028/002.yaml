- from: Waagize wana wa Israeli[a], uwaambie, ‘Sadaka yangu, chakula changu katika sadaka zangu zinazoteketezwa kwa moto, na harufu inayonipendeza[b], muwe waangalifu kunitolea kwa wakati wake uliowekwa.’
  to: Waagize wana wa Israeli[a], uwaambie, ‘Sadaka yangu, chakula changu kwa ajili ya sadaka zangu za moto, harufu inayonipendeza[b], muwe waangalifu kunitolea kwa wakati wake uliowekwa.’
