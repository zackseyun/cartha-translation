id: NUM.28.2
reference: Numbers 28:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֶת קָרְבָּנִ֨/י לַחְמִ֜/י לְ/אִשַּׁ֗/י רֵ֚יחַ נִֽיחֹחִ֔/י תִּשְׁמְר֕וּ לְ/הַקְרִ֥יב לִ֖/י בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/002.yaml
  text: Command the sons of Israel[a], and say to them, ‘My offering, my food for my food offerings, my pleasing aroma[c][b], you shall be careful to present to me at its appointed time.’
translation:
  language: sw
  text: Waagize wana wa Israeli[a], uwaambie, ‘Sadaka yangu, chakula changu kwa ajili ya sadaka zangu za moto, harufu inayonipendeza[b], muwe waangalifu kunitolea kwa wakati wake uliowekwa.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kihalisi ni “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: “Harufu inayonipendeza” ni usemi wa kawaida wa dhabihu unaoonyesha sadaka inayokubaliwa na Mungu.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: Waagize
  rationale: Kauli ya amri ya צוה ina nguvu ya kutoa agizo rasmi; “waagize” ni ya kawaida na yenye uzito unaofaa katika Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi kwa uwazi muundo wa Kiebrania wa kutaja jumuiya ya agano; “Waisraeli” limetolewa kama tafsiri mbadala katika tanbihi.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: uwaambie
  rationale: Ni namna ya asili ya Kiswahili ya kuendeleza agizo kwa Musa bila kulegeza uhusiano wa moja kwa moja wa maneno hayo.
- source_word: קָרְבָּנִי
  choice: Sadaka yangu
  rationale: קרבן ni kitu kinacholetwa au kutolewa kwa Mungu; “sadaka” ni neno pana, linaloeleweka, na linalofaa katika muktadha huu.
- source_word: לַחְמִי
  choice: chakula changu
  rationale: Ingawa לחם inaweza kumaanisha “mkate,” hapa ni nahau ya ibada inayohusu chakula cha madhabahu kwa upana, si mkate pekee.
- source_word: לְאִשַּׁי
  choice: katika sadaka zangu zinazoteketezwa kwa moto
  rationale: אִשֶּׁה ni istilahi ya sadaka inayoteketezwa madhabahuni. Tafsiri hii inaweka wazi moto na kuunganisha kirai hicho na “chakula changu” bila kudokeza kwamba ni chakula cha kawaida.
- source_word: רֵיחַ נִיחֹחִי
  choice: harufu inayonipendeza
  rationale: Ni usemi maalumu wa dhabihu unaoonyesha sadaka inayokubaliwa na Mungu. Kiswahili hiki ni cha kawaida huku kikihifadhi taswira halisi ya harufu.
- source_word: תִּשְׁמְרוּ
  choice: muwe waangalifu
  rationale: Kwa kuwa שמר inatawala kitenzi cha kuitoa sadaka, maana yake hapa ni kuzingatia kwa makini wajibu huo, si kuhifadhi kitu.
- source_word: לְהַקְרִיב לִי
  choice: kunitolea
  rationale: Katika muktadha wa dhabihu, הקריב humaanisha kuleta au kutoa sadaka; “kunitolea” ni fupi na ya kawaida katika Kiswahili.
- source_word: בְּמוֹעֲדוֹ
  choice: kwa wakati wake uliowekwa
  rationale: מועד ni wakati ulioteuliwa. Kiambishi cha umoja kimehifadhiwa kwa “wake,” kikirejelea sadaka au utaratibu wake.
theological_decisions:
- issue: 'Lugha ya dhabihu inayomwelezea Mungu kwa namna ya kibinadamu: “chakula changu” na “harufu inayonipendeza”'
  choice: Kuhifadhi taswira halisi ya ibada na dhabihu
  alternative: Kufafanua tu kuwa “sadaka zinazokubalika kwangu”
  rationale: Kiebrania kinatumia lugha halisi ya chakula na harufu. Kuiacha katika tafsiri kunahifadhi mkazo na mvutano wa maandiko bila kudai kwamba Mungu anahitaji chakula kama mwanadamu.
- issue: Jina la jumuiya lenye jinsia katika בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Tafsiri kuu inafuata kwa karibu muundo wa Kiebrania, huku tanbihi ikitoa jina la kawaida la jumuiya nzima.
- issue: Maana ya רֵיחַ נִיחֹחַ katika ibada
  choice: harufu inayonipendeza
  alternative: harufu ya kutuliza
  rationale: Usemi huo unaashiria kupokelewa kwa sadaka mbele za Mungu; “inayonipendeza” huepuka kudokeza kwamba dhabihu hiyo inatuliza hasira kwa lazima katika kila matumizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa orodha ya maneno ya dhabihu umehifadhiwa kwa kiasi kikubwa, huku viunganishi vya Kiswahili vikitumiwa kuifanya sentensi isomeke kwa urahisi.
