base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/016.yaml
  text: In the first month[a], on the fourteenth day of the month, is the Passover of Yahweh.
translation:
  language: sw
  text: Katika mwezi wa kwanza, siku ya kumi na nne ya mwezi, ni Pasaka ya Yahwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya Yahwe.” Kihusishi cha Kiebrania kinaweza kuonyesha kuwekwa wakfu au umilikaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: Katika mwezi wa kwanza
  rationale: Kiunganishi וּ hakihitaji kutafsiriwa kwa “na” mwanzoni mwa sentensi; kifungu hiki kinaweka wakati kwa Kiswahili cha kawaida huku kikihifadhi maana ya Kiebrania.
- source_word: בְּ/אַרְבָּעָה עָשָׂר יוֹם לַ/חֹדֶשׁ
  choice: siku ya kumi na nne ya mwezi huo
  rationale: Hii inawasilisha kwa uwazi muundo wa tarehe wa Kiebrania. Neno “siku” limehifadhiwa, na “huo” linaonyesha mwezi uliotajwa tayari bila kubadili maana.
- source_word: פֶּסַח
  choice: Pasaka
  rationale: “Pasaka” ndilo neno lililozoeleka katika Kiswahili kwa sikukuu au maadhimisho haya. “Sadaka ya Pasaka” ingefafanua zaidi ya yale ambayo mstari unasema wazi.
- source_word: לַ/יהוָה
  choice: ya Yahwe
  rationale: “Ya Yahwe” ni fupi na ya asili katika Kiswahili, huku ikionyesha uhusiano wa Pasaka na Yahwe. Kwa kuwa ל־ pia inaweza kuonyesha kuwekwa wakfu au kuelekezwa kwa mtu, uwezekano wa “kwa ajili ya Yahwe” umetajwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Kifungu kinatumia moja kwa moja jina la agano יהוה. “Yahwe” linahifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Maana ya ל־ katika לַיהוָה
  choice: ya Yahwe
  alternative: kwa ajili ya Yahwe
  rationale: Kihusishi hiki kinaweza kuonyesha uhusiano au umilikaji, lakini pia kusudi au kuwekwa wakfu. Matini kuu inatumia Kiswahili kifupi na cha kawaida, huku tanbihi ikihifadhi maana nyingine inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa tarehe umewekwa wazi bila kuongeza wazo la dhabihu ambalo halikutajwa moja kwa moja; sentensi pia inadumisha ufupi wa kishazi cha Kiebrania kisicho na kitenzi.
