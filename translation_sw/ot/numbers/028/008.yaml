  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָֽ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכּ/וֹ֙ תַּעֲשֶׂ֔ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/008.yaml
  text: And you shall offer the second lamb between the evenings[a]; like the morning grain offering and its drink offering, you shall offer it as a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: sw
  text: Na mwana-kondoo wa pili utamtoa kati ya majioni[a]. Utamtoa kwa namna ileile ya sadaka ya nafaka ya asubuhi na sadaka yake ya kinywaji. Iwe sadaka inayotolewa kwa moto[b], yenye harufu ya kumpendeza Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kati ya majioni,” nahau ya kale ambayo mara nyingi hueleweka kuwa “wakati wa machweo.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka ya chakula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: mwana-kondoo wa pili
  rationale: Katika muktadha wa dhabihu, כֶּבֶשׂ kwa kawaida humaanisha mwana-kondoo; neno “wa pili” linadumisha mpangilio unaohusiana na sadaka ya asubuhi.
- source_word: תַּעֲשֶׂה
  choice: utamtoa
  rationale: Ingawa kitenzi hiki kimsingi humaanisha “kufanya” au “kuandaa,” katika maagizo ya dhabihu Kiswahili cha kawaida hutumia “kutoa” sadaka.
- source_word: בֵּין הָעַרְבָּיִם
  choice: kati ya majioni
  rationale: Tafsiri hii inahifadhi kwa ukaribu nahau ya Kiebrania na kutofafanua kimabavu muda wake kamili; maana ya kawaida zaidi imewekwa katika tanbihi.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: pamoja na sadaka ya nafaka ... kama za asubuhi
  rationale: Katika sheria za kikuhani, מִנְחָה ni sadaka ya nafaka, si sadaka ya jumla. Muundo wa Kiswahili unaonyesha kwamba sadaka zinazoambatana na mwana-kondoo wa pili zinalingana na za asubuhi.
- source_word: וּכְנִסְכּוֹ
  choice: na sadaka yake ya kinywaji
  rationale: נֶסֶךְ ni sadaka ya kioevu inayomiminwa; “sadaka ya kinywaji” ni lugha iliyo wazi na inayofahamika.
- source_word: אִשֵּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Chaguo hili linahifadhi kipengele cha moto kilichomo katika neno la Kiebrania na ni la kawaida zaidi kwa Kiswahili kuliko tafsiri ya neno kwa neno “sadaka ya moto.”
- source_word: רֵיחַ נִיחֹחַ
  choice: yenye harufu ya kumpendeza
  rationale: Hii inahifadhi taswira ya harufu na wazo la sadaka inayokubalika, kwa Kiswahili cha sasa na cha heshima.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Maana kamili ya nahau בֵּין הָעַרְבָּיִם
  choice: kati ya majioni
  alternative: wakati wa machweo
  rationale: Rejeo sahihi la muda la nahau hii linajadiliwa. Tafsiri iliyo karibu na muundo wa Kiebrania inadumisha uwazi huo, huku tanbihi ikitoa maana ya kawaida.
- issue: Utoaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini inatumia jina maalumu la Mungu, kwa hiyo “Yahweh” linahifadhiwa badala ya kuweka cheo mahali pake.
- issue: Maana ya neno la dhabihu אִשֵּׁה
  choice: sadaka inayotolewa kwa moto
  alternative: sadaka ya chakula
  rationale: Neno hili linahusiana na sadaka inayotolewa kwa moto, ingawa katika muktadha linaweza kueleweka kama chakula kinachotolewa kwa Mungu. Tafsiri kuu inahifadhi kipengele cha moto, na maana nyingine inatajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa ili kuepuka msongamano bila kuondoa uhusiano wa sadaka ya jioni na sadaka ya asubuhi. Alama zote za tanbihi [a] na [b] zimo katika matini kuu.
