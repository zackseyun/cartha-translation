  yaml_path: translation/ot/numbers/028/015.yaml
  text: And one male goat for a sin offering to Yahweh shall be offered besides the regular burnt offering and its drink offering[a].
translation:
  language: sw
  text: Na mbuzi dume mmoja atatolewa kuwa sadaka ya dhambi[a] kwa Yahwe, zaidi ya sadaka ya kawaida ya kuteketezwa na sadaka yake ya kinywaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha sadaka inayoshughulikia unajisi na pia dhambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: mbuzi dume
  rationale: Kirai hiki kinataja mbuzi wa jinsia ya kiume; ‘mbuzi dume’ ni Kiswahili cha sasa kilicho wazi na cha kawaida.
- source_word: אֶחָד
  choice: mmoja
  rationale: Namba imetajwa wazi katika Kiebrania kama sehemu ya masharti ya sadaka.
- source_word: לְחַטָּאת
  choice: kuwa sadaka ya dhambi
  rationale: Katika sheria za dhabihu, חַטָּאת hutaja sadaka inayohusiana na dhambi au utakaso. ‘Sadaka ya dhambi’ ndiyo istilahi inayotambulika kwa urahisi, huku maana nyingine halali ikihifadhiwa katika tanbihi.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kuwa ‘Yahwe’; kihusishi ‘kwa’ kinaonyesha kuwa sadaka hiyo imetengwa na kutolewa kwake.
- source_word: עַל
  choice: pamoja na
  rationale: Katika muktadha huu neno linaonyesha sadaka ya ziada inayoambatana na sadaka ya kawaida, si mahali halisi ‘juu ya’ kitu.
- source_word: עֹלַת הַתָּמִיד
  choice: sadaka ya kawaida ya kuteketezwa
  rationale: Kirai hiki kinamaanisha sadaka ya kuteketezwa iliyowekwa itolewe kwa ukawaida; tafsiri hii haiongezi kwa lazima neno ‘kila siku’ lisilo katika kirai chenyewe.
- source_word: יֵעָשֶׂה
  choice: atatolewa
  rationale: Ingawa kitenzi kwa msingi ni ‘atafanywa,’ katika muktadha wa dhabihu Kiswahili asilia hutumia ‘atatolewa.’
- source_word: וְנִסְכּוֹ
  choice: na sadaka yake ya kinywaji
  rationale: נֶסֶךְ ni sadaka ya kimiminiko inayomiminwa na kuandamana na sadaka nyingine; ‘sadaka ya kinywaji’ ni istilahi iliyo wazi na inayofahamika.
theological_decisions:
- issue: Utafsiri wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Kifungu kinatumia jina la Mungu יהוה moja kwa moja; ‘Yahwe’ huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חַטָּאת katika muktadha wa dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno la Kiebrania linaweza kueleweka kuwa sadaka inayoshughulikia dhambi au utakaso. Tafsiri inayojulikana zaidi imewekwa katika matini, na maana nyingine halali imehifadhiwa katika tanbihi bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi urudiaji wa ‘sadaka’ kwa uwazi wa sheria ya ibada, na umeepuka istilahi za kimadhehebu.
