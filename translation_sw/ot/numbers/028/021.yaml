  text: Kwa kila mmoja wa wanakondoo saba, utatayarisha sehemu ya kumi ya efa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi kinasema, “sehemu ya kumi, sehemu ya kumi utatayarisha kwa mwanakondoo mmoja, kwa wanakondoo saba.” Kurudiwa huku kunaonyesha mgao: sehemu moja ya kumi kwa kila mwanakondoo.'
    reason: lexical_alternative
  - marker: b
    text: Yaani, sehemu ya kumi ya efa, kipimo kinachotumiwa kwa kawaida kwa sadaka ya nafaka katika muktadha huu.
