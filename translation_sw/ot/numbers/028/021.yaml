lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: sehemu ya kumi ya efa
  rationale: Nomino iliyorudiwa ina maana ya mgao kwa kila mmoja. Katika maagizo haya ya dhabihu, עִשָּׂרוֹן ni kipimo cha kawaida cha sadaka ya nafaka, yaani sehemu ya kumi ya efa; neno “efa” limewekwa wazi ili msomaji wa Kiswahili aelewe kipimo kinachokusudiwa.
- source_word: תַּעֲשֶׂה
  choice: utatayarisha
  rationale: Ingawa kitenzi hiki kwa msingi humaanisha “kufanya,” katika agizo la dhabihu “kutayarisha” ni Kiswahili cha kawaida na sahihi; “utatoa” kingeongeza maana ambayo kitenzi chenyewe hailazimishi.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: kwa kila mmoja
  rationale: Umoja wenye kibainishi na namba, pamoja na kurudiwa kwa עִשָּׂרוֹן, unaonyesha mgao kwa kila mnyama. “Kwa kila mmoja” huwasilisha maana hiyo kwa kawaida katika Kiswahili.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: wa wale wanakondoo saba
  rationale: Kauli hii inahusisha agizo la mgao na kundi lote la wanakondoo saba, huku ikihifadhi idadi na nomino ya Kiebrania.
