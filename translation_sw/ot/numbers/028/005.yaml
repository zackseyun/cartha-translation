base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/005.yaml
  text: and a tenth of an ephah of fine flour for a grain offering[b][a], mixed with a quarter of a hin of beaten oil.
translation:
  language: sw
  text: na sehemu ya kumi ya efa[a] ya unga laini kwa ajili ya sadaka ya nafaka, uliochanganywa na robo ya hini[a] ya mafuta yaliyopatikana kwa kuponda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efa na hini ni vipimo vya kale vya Waisraeli.
    reason: cultural_note
  - marker: b
    text: Au, “mafuta yaliyokamuliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂירִית
  choice: na sehemu ya kumi
  rationale: Kiunganishi וַ huendeleza maagizo ya dhabihu kutoka mstari uliotangulia, na עֲשִׂירִית ni sehemu ya kumi.
- source_word: הָאֵיפָה
  choice: ya efa
  rationale: Efa ni kipimo cha kale cha vitu vikavu; jina la kipimo limehifadhiwa badala ya kukadiriwa kwa kipimo cha kisasa.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Neno hili humaanisha unga uliosagwa vizuri uliotumiwa katika matoleo.
- source_word: לְמִנְחָה
  choice: kwa ajili ya sadaka ya nafaka
  rationale: Katika sheria za kikuhani, מִנְחָה hapa ni aina maalumu ya sadaka inayotokana na nafaka, si zawadi ya jumla.
- source_word: בְּלוּלָה
  choice: uliochanganywa
  rationale: Kauli ya kutendwa inaeleza unga uliochanganywa na mafuta; umoja wa ngeli ya unga umefuatwa kwa Kiswahili cha kawaida.
- source_word: בְּשֶׁמֶן
  choice: na ... mafuta
  rationale: Kihusishi kinaonyesha kitu kilichochanganywa na unga; muundo wa Kiswahili 'uliochanganywa na' ni wa kawaida.
- source_word: כָּתִית
  choice: mafuta yaliyotokana na zeituni zilizopondwa
  rationale: כָּתִית hueleza mafuta yaliyopatikana kwa kuponda matunda; tafsiri hii inaweka wazi mchakato bila kutumia msemo usio wa kawaida wa 'mafuta yaliyopondwa'.
- source_word: רְבִיעִת הַהִין
  choice: robo ya hini
  rationale: Hiki ni kipimo cha robo ya hini; jina la kipimo cha kale limehifadhiwa.
