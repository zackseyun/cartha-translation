translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Vipimo vya kale vimeandikwa kwa majina yaliyotoholewa, na tanbihi inaeleza matumizi yake.
