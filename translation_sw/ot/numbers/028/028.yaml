  yaml_path: translation/ot/numbers/028/028.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the one bull[a], and two-tenths for the one ram.'
translation:
  language: sw
  text: 'Na sadaka yao ya nafaka iwe unga laini uliochanganywa na mafuta: vipimo vitatu vya sehemu moja ya kumi kwa fahali mmoja, na vipimo viwili vya sehemu moja ya kumi kwa kondoo dume mmoja[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “vipimo vitatu vya sehemu moja ya kumi” na “vipimo viwili vya sehemu moja ya kumi.” Katika muktadha huu wa dhabihu, kwa kawaida vipimo hivyo hueleweka kuwa sehemu za kumi za efa.'
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Na sadaka yao ya nafaka iwe
  rationale: Katika muktadha wa dhabihu, מִנְחָה ni sadaka ya nafaka. Kitenzi “iwe” kinaongezwa kwa Kiswahili cha kawaida ili kukamilisha sentensi isiyo na kitenzi katika Kiebrania.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Hili ndilo jina la unga bora uliotumiwa kwa kawaida katika sadaka; “unga laini” ni wazi na ya asili katika Kiswahili.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Kirai kinaeleza unga uliotayarishwa kwa kuchanganywa na mafuta, bila kufafanua mafuta hayo zaidi ya chanzo.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: sehemu tatu za kumi
  rationale: עִשָּׂרוֹן ni kipimo cha sehemu moja ya kumi; wingi wake hapa unaonyesha vipimo vitatu vya namna hiyo.
- source_word: לַפָּר הָאֶחָד
  choice: kwa kila fahali
  rationale: Katika orodha ya sadaka, הָאֶחָד ina kazi ya kugawa kiasi kwa mnyama mmoja mmoja. “Kwa kila fahali” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: sehemu mbili za kumi
  rationale: Kirai kinataja vipimo viwili vya sehemu moja ya kumi, kwa ulinganifu na kiasi kilichotajwa kwa fahali.
- source_word: לָאַיִל הָאֶחָד
  choice: kwa kondoo dume mmoja
  rationale: אַיִל ni kondoo dume. Neno “mmoja” linahifadhi hesabu ya Kiebrania; kwa kuwa mstari uliotangulia unataja kondoo dume wawili, kiasi hiki kinaeleweka kuwa cha kila mmoja.
