  text: מִ/לְּ/בַ֞ד עֹלַ֧ת הַ/תָּמִ֛יד וּ/מִנְחָת֖/וֹ תַּעֲשׂ֑וּ תְּמִימִ֥ם יִהְיוּ לָ/כֶ֖ם וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/031.yaml
  text: Besides the regular burnt offering and its grain offering[a], you shall prepare them; they shall be without blemish[c][b], along with their drink offerings.
translation:
  language: sw
  text: Zaidi ya sadaka ya kawaida ya kuteketezwa[a] na sadaka yake ya nafaka, mtaziandaa sadaka hizo; wanyama watakuwa bila dosari[b], pamoja na sadaka zao za kinywaji[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya kuteketezwa ya daima” au “sadaka ya kuteketezwa ya kila siku.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “watakuwa kwenu bila dosari”; yaani, wanyama wanaotolewa wawe bila kasoro.'
    reason: lexical_alternative
  - marker: c
    text: Au “sadaka zao za kumiminwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: Zaidi ya
  rationale: Inaonyesha kwamba sadaka hizi zinaongezwa juu ya sadaka ya kawaida, kwa lugha ya Kiswahili iliyo wazi na ya kawaida.
- source_word: עֹלַת הַתָּמִיד
  choice: sadaka ya kawaida ya kuteketezwa
  rationale: תָּמִיד hapa inarejelea sadaka ya kuteketezwa iliyotolewa kwa utaratibu wa kudumu kila siku; “ya kawaida” inasisitiza wajibu wake wa mara kwa mara.
- source_word: וּמִנְחָתוֹ
  choice: na sadaka yake ya nafaka
  rationale: Katika sheria za dhabihu, מִנְחָה ni sadaka ya nafaka inayoandamana na sadaka ya kuteketezwa.
- source_word: תַּעֲשׂוּ
  choice: mtaziandaa
  rationale: עשה katika muktadha wa dhabihu inaweza kumaanisha kuandaa au kutekeleza utoaji wa sadaka; “mtaziandaa” huhifadhi maana hiyo bila kuwa nzito.
- source_word: תְּמִימִם
  choice: bila dosari
  rationale: Katika sheria za dhabihu neno hili hueleza wanyama wasiokuwa na kasoro inayowafanya wasifae kutolewa.
- source_word: יִהְיוּ לָכֶם
  choice: wanyama watakuwa
  rationale: Kiswahili cha kawaida hakihitaji kutafsiri לָכֶם moja kwa moja hapa; nomino “wanyama” imewekwa wazi ili kuonyesha kwamba sharti la kutokuwa na dosari linawahusu wanyama wanaotolewa.
- source_word: וְנִסְכֵּיהֶם
  choice: pamoja na sadaka zao za kinywaji
  rationale: נֶסֶךְ ni sadaka ya kioevu iliyomiminwa; “sadaka za kinywaji” ni istilahi ya Kibiblia inayoeleweka na inayotofautisha sadaka hizi na sadaka za nafaka.
theological_decisions:
- issue: Kirejeleo cha wingi katika תְּמִימִם יִהְיוּ
  choice: Kukieleza kama wanyama wanaotolewa
  alternative: Kuacha tu “zitakuwa bila dosari,” jambo ambalo lingeweza kuonekana kurejelea sadaka zote pamoja na sadaka za nafaka au za kinywaji
  rationale: Katika sheria za dhabihu, תָּמִים hutaja hasa wanyama wasio na kasoro. Ufafanuzi huu hauingizi fundisho la dhehebu, bali unaweka wazi kirejeleo kinachodokezwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi unafuata kwa karibu mwendo wa Kiebrania huku ukifafanua kirejeleo cha wanyama pale ambapo upatanisho wa ngeli za Kiswahili ungeleta utata.
