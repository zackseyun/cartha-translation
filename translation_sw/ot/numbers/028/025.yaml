  text: וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/025.yaml
  text: On the seventh day you shall have a holy convocation[b][a]; you shall do no ordinary work.
translation:
  language: sw
  text: Siku ya saba mtakuwa na kusanyiko takatifu[a]; msifanye kazi yoyote ya kawaida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkusanyiko mtakatifu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “kazi yoyote ya utumishi”; yaani, kazi ya kawaida ya shughuli au ajira.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁבִיעִי
  choice: Siku ya saba
  rationale: Kirai hiki kinaonyesha wakati. Kiswahili cha kawaida hakihitaji kuwakilisha kiunganishi וּ kwa neno tofauti hapa.
- source_word: מִקְרָא קֹדֶשׁ
  choice: kusanyiko takatifu
  rationale: Kirai hiki humaanisha mkusanyiko mtakatifu ulioitishwa rasmi; tafsiri hii ni ya asili katika Kiswahili na inadumisha maana ya ibada na kukusanyika.
- source_word: יִהְיֶה לָ/כֶם
  choice: mtakuwa na
  rationale: Kiebrania ni kihalisi ‘litakuwa kwenu’; ‘mtakuwa na’ huwasilisha kwa Kiswahili sanifu na wazi agizo la kuwa na kusanyiko hilo.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: kazi yoyote ya kawaida
  rationale: Katika muundo huu wenye ukanushaji, כָּל ni ‘yoyote.’ Kirai מְלֶאכֶת עֲבֹדָה kinahusu kazi ya kawaida ya shughuli au ajira, si marufuku ya kila tendo kabisa.
- source_word: לֹא תַעֲשׂוּ
  choice: msifanye
  rationale: Kauli ya Kiebrania yenye ukanushaji katika muktadha wa sheria ni katazo; ‘msifanye’ ni amri hasi ya kawaida, yenye hadhi, na iliyo wazi.
