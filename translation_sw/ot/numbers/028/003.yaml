source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לָ/הֶ֔ם זֶ֚ה הָֽ/אִשֶּׁ֔ה אֲשֶׁ֥ר תַּקְרִ֖יבוּ לַ/יהוָ֑ה כְּבָשִׂ֨ים בְּנֵֽי שָׁנָ֧ה תְמִימִ֛ם שְׁנַ֥יִם לַ/יּ֖וֹם עֹלָ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/003.yaml
  text: 'And you shall say to them[a], ‘This is the food offering that you shall present to Yahweh: two male lambs a year old, without blemish, each day, as a regular burnt offering.’'
translation:
  language: sw
  text: 'Utawaambia, ‘Hii ndiyo sadaka inayotolewa kwa moto[a] mtakayomtolea Yahwe: kila siku, wanakondoo dume wawili wenye umri wa mwaka mmoja, wasio na dosari, kama sadaka ya kuteketezwa ya daima.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya moto” au “sadaka ya kutolewa kwa moto.”
    reason: Mbadala wa istilahi ya הָאִשֶּׁה; neno hilo hurejelea sadaka inayohusishwa na moto wa madhabahu.
lexical_decisions:
- source_word: הָאִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Neno hili la kikuhani hurejelea sadaka inayotolewa kwa moto. Tafsiri hii ni wazi kwa msomaji wa Kiswahili na inatofautishwa na עֹלָה, ambayo ni sadaka inayoteketezwa kabisa. Maana mbadala ya ‘sadaka ya chakula’ imehifadhiwa katika tanbihi.
- source_word: תַּקְרִיבוּ
  choice: mtakayomtolea
  rationale: Katika muktadha wa dhabihu, Hifili ya קרב humaanisha kuleta mbele au kutoa sadaka. ‘Mtakayomtolea’ ni Kiswahili cha kawaida na hudumisha wazo la sadaka kuelekezwa kwa Yahwe.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kama ‘Yahwe’ badala ya cheo.
- source_word: כְּבָשִׂים
  choice: wanakondoo dume
  rationale: Nomino hii hurejelea wanakondoo, na umbo la kiume pamoja na masharti ya dhabihu linaelezwa wazi kwa ‘dume.’
- source_word: בְּנֵי שָׁנָה
  choice: wenye umri wa mwaka mmoja
  rationale: Nahau hii ya Kiebrania humaanisha wanyama wa mwaka mmoja; tafsiri hii ni wazi na ya kawaida kwa Kiswahili.
- source_word: תְמִימִם
  choice: wasio na dosari
  rationale: Katika sheria za dhabihu, neno hili hueleza wanyama wasio na kasoro inayowafanya wasifae kutolewa.
- source_word: לַיּוֹם
  choice: kila siku
  rationale: 'Pamoja na idadi ya wawili na תָמִיד, kirai hiki kina maana ya mgawanyo: wanakondoo wawili watolewe siku baada ya siku.'
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa kabisa
  rationale: Hii ndiyo sadaka inayoteketezwa yote madhabahuni. ‘Kabisa’ husaidia kuitofautisha na neno pana zaidi הָאִשֶּׁה katika sentensi hiyo hiyo.
- source_word: תָמִיד
  choice: ya kawaida
  rationale: Katika ratiba ya kikuhani, neno hili huonyesha ibada inayorudiwa kwa utaratibu. ‘Ya kawaida’ huepuka kudokeza kwamba tendo lenyewe haliishi kamwe.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la agano. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya הָאִשֶּׁה na עֹלָה
  choice: Kutofautisha ‘sadaka inayotolewa kwa moto’ na ‘sadaka ya kuteketezwa kabisa’
  alternative: Kutumia ‘sadaka ya kuteketezwa’ kwa maneno yote mawili
  rationale: 'Maneno hayo hayafanani kabisa: הָאִשֶּׁה ni istilahi pana ya sadaka ya moto, ilhali עֹלָה hapa ni aina maalumu ya sadaka inayoteketezwa yote. Kutofautisha kunahifadhi msamiati na mvutano wa andiko.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘Nanyi mtawaambia’ huhifadhi amri ya moja kwa moja; ‘kila siku’ ni wa kawaida zaidi kuliko tafsiri neno kwa neno. Alama ya tanbihi imewekwa mara tu baada ya kirai inachofafanua.
