translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Mwana-kondoo’ limetumiwa kwa usahihi wa istilahi ya sadaka, na mpangilio umefanywa wa kawaida katika Kiswahili huku urudiaji wa Kiebrania ukihifadhiwa katika tanbihi.
