  text: sehemu ya kumi kwa kila mwana-kondoo[a], kwa wale wana-kondoo saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “sehemu ya kumi, sehemu ya kumi kwa mwana-kondoo yule mmoja, kwa wale wana-kondoo saba.” Kiebrania kinatumia muundo wa ugawaji unaomaanisha kipimo cha sehemu moja ya kumi kwa kila mmoja wa wale wana-kondoo saba.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: sehemu ya kumi
  rationale: Nomino ya umoja iliyorudiwa, kihalisi ‘sehemu ya kumi, sehemu ya kumi,’ ni muundo wa ugawaji unaoonyesha kiasi cha sehemu moja ya kumi kwa kila mnyama. Kirai ‘ya efa’ hakipo wazi katika mstari huu, hivyo hakijaongezwa katika matini kuu.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: kwa kila mwana-kondoo
  rationale: Ingawa kihalisi ni ‘kwa mwana-kondoo mmoja,’ katika muundo huu wa ugawaji maana yake ni kwamba kiasi hicho kinatolewa kwa kila mwana-kondoo mmoja mmoja.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: kati ya wale wana-kondoo saba
  rationale: Kirai hiki kinabainisha kundi lote la wana-kondoo saba ambalo kiasi hicho cha kila mmoja kinahusu; ‘wale’ huakisi urejeleaji maalumu wa Kiebrania na muktadha uliotangulia.
