lexical_decisions:
- source_word: וּ/בַ/חֲמִשָּׁה עָשָׂר יוֹם
  choice: Na siku ya kumi na tano
  rationale: Kiunganishi na kihusishi vinaanzisha kirai cha wakati; Kiswahili cha kawaida hutumia mpangilio huu kwa tarehe.
- source_word: לַ/חֹדֶשׁ הַ/זֶּה
  choice: ya mwezi huu
  rationale: Katika muktadha huu wa kalenda, חֹדֶשׁ humaanisha mwezi.
- source_word: חָג
  choice: kutakuwa na sikukuu
  rationale: חָג hurejelea maadhimisho matakatifu ya sikukuu; ‘sikukuu’ ni neno la kawaida na wazi katika Kiswahili.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Kirai hiki kinaonyesha muda ambao agizo la kula mikate isiyotiwa chachu linaendelea.
- source_word: מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: Hili linaeleza kwa uwazi mikate iliyotayarishwa bila chachu na linafaa katika muktadha wa sikukuu.
- source_word: יֵאָכֵל
  choice: italiwa
  rationale: Umbo la Niphal ni la kutendwa; tafsiri hii inadumisha agizo rasmi bila kuongeza ulazima usioelezwa moja kwa moja.
