  language: sw
  text: Na siku ya kumi na tano ya mwezi huu kutakuwa na sikukuu[a]; kwa siku saba mikate isiyotiwa chachu italiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sikukuu ya kidini.” Neno la Kiebrania חָג linaweza kumaanisha sikukuu au tamasha la kidini.
