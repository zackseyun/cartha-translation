base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/010.yaml
  text: The burnt offering of each Sabbath is on its Sabbath[a], in addition to the regular burnt offering and its drink offering.
translation:
  language: sw
  text: Sadaka ya kuteketezwa ya Sabato, katika Sabato yake, zaidi ya sadaka ya kuteketezwa ya kawaida na sadaka yake ya kinywaji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹלַת
  choice: sadaka ya kuteketezwa
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa sadaka iliyoteketezwa yote, na linaeleweka vizuri katika muktadha wa ibada.
- source_word: שַׁבַּת
  choice: Sabato
  rationale: Katika ratiba hii ya sadaka, neno hili linamaanisha siku ya Sabato, si juma kwa ujumla.
- source_word: בְּשַׁבַּתּוֹ
  choice: katika Sabato yake
  rationale: Tafsiri hii inahifadhi kiambishi cha nafsi cha Kiebrania na wazo la kila sadaka kutolewa katika Sabato inayohusika.
- source_word: עַל
  choice: pamoja na
  rationale: Katika maagizo ya sadaka, neno hili huonyesha kuwa sadaka hiyo inaongezwa kwa sadaka nyingine iliyoamriwa; ‘pamoja na’ ni ya asili na wazi kwa Kiswahili.
- source_word: הַתָּמִיד
  choice: ya kawaida
  rationale: תָּמִיד hapa hueleza sadaka inayotolewa daima kwa utaratibu uliowekwa; ‘ya kawaida’ ni Kiswahili cha sasa na cha kueleweka.
- source_word: וְנִסְכָּהּ
  choice: na sadaka yake ya kinywaji
  rationale: Nֶסֶךְ ni sadaka ya kioevu iliyomiminwa, na kiambishi chake kinarejelea sadaka ya kuteketezwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Kitenzi ‘itolewe’ kimewekwa ili sentensi isomeke kwa kawaida, ingawa kimeeleweka tu katika kifungu kifupi cha Kiebrania.
