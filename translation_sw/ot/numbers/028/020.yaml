base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/020.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], and two-tenths for the ram you shall prepare.'
translation:
  language: sw
  text: 'Na sadaka yao ya nafaka itakuwa unga laini uliochanganywa na mafuta: sehemu tatu za kumi kwa kila fahali,[a] na sehemu mbili za kumi kwa kondoo dume mtazitayarisha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, “sehemu tatu za kumi” na “sehemu mbili za kumi” ni ufupisho wa sehemu za kumi za efa, kipimo cha vitu vikavu kilichotumiwa katika kanuni za dhabihu.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Na sadaka yao ya nafaka
  rationale: Katika muktadha wa ibada ya dhabihu, מִנְחָה humaanisha sadaka ya nafaka; kiambishi cha wingi ‘yao’ kinarejelea kwa pamoja wanyama waliotajwa katika mfululizo huu.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Neno hili humaanisha unga uliosagwa vizuri uliotumiwa kwa sadaka; ‘unga laini’ ni Kiswahili cha kawaida na sahihi.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Kirai hiki kinaeleza unga uliotayarishwa kwa kuchanganywa na mafuta; tafsiri hii ni ya asili katika Kiswahili na inafuata muundo wa Kiebrania.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: sehemu tatu za kumi
  rationale: עִשָּׂרוֹן ni kipimo cha sehemu moja ya kumi, kinachoeleweka katika sheria hizi kuwa sehemu ya kumi ya efa.
- source_word: לַפָּר
  choice: kwa huyo fahali
  rationale: Umoja wenye kibainishi unamrejelea fahali maalumu aliyetajwa katika agizo la sadaka.
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: na sehemu mbili za kumi
  rationale: Imetafsiriwa sawasawa na kipimo kinachotangulia ili kudumisha ulinganifu wa kirai.
- source_word: לָאַיִל
  choice: kwa huyo kondoo dume
  rationale: Umoja wenye kibainishi unamrejelea kondoo dume katika mfululizo wa sadaka.
- source_word: תַּעֲשׂוּ
  choice: mtazitayarisha
  rationale: Katika maagizo ya dhabihu, עשה inaweza kumaanisha kutengeneza au kutayarisha; ‘mtazitayarisha’ inaeleza tendo linalotakiwa bila kuongeza maana mahsusi ya ‘kutoa.’
