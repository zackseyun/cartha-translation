translation:
  language: sw
  text: na mbuzi dume mmoja ili kufanya upatanisho kwa ajili yenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kimefupisha usemi: “na mbuzi dume mmoja, ili kufanya upatanisho kwa ajili yenu.” Muktadha wa karibu wa dhabihu unaonyesha kwamba mbuzi huyu ni sadaka ya dhambi, ingawa maneno hayo hayarudiwi katika mstari huu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: beberu
  rationale: Katika muktadha wa dhabihu, kirai hiki humaanisha mbuzi dume. “Beberu” ni neno la kawaida na fasaha la Kiswahili kwa mbuzi dume.
- source_word: אֶחָד
  choice: mmoja
  rationale: Namba hii inaonyesha mnyama mmoja; upatanisho wa ngeli na “beberu” unahitaji “mmoja.”
- source_word: לְכַפֵּר
  choice: ili kufanya upatanisho
  rationale: Kitenzi כפר katika matumizi ya kikuhani huhusu kufanya upatanisho. Muundo wa kusudi “ili kufanya” unaakisi לְ bila kufafanua zaidi nadharia ya upatanisho.
- source_word: עֲלֵיכֶם
  choice: kwa ajili yenu
  rationale: Pamoja na כפר, עַל huonyesha watu wanaofanyiwa upatanisho; “kwa ajili yenu” ni Kiswahili cha kawaida kinachoonyesha manufaa au uwakilishi.
theological_decisions:
- issue: Kundi la dhabihu linalodokezwa lakini lisilotajwa wazi katika mstari huu
  choice: Kutoliongeza “kuwa sadaka ya dhambi” katika matini kuu
  alternative: na beberu mmoja kuwa sadaka ya dhambi, ili kufanya upatanisho kwa ajili yenu
  rationale: Kiebrania cha mstari huu kinataja tu beberu mmoja na kusudi la kufanya upatanisho. Muktadha unaonyesha kwamba ni sadaka ya dhambi, lakini tanbihi huhifadhi taarifa hiyo bila kuifanya ionekane kuwa imetamkwa wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Beberu” ni sahihi na rahisi kueleweka; usemi umehifadhi ufupi wa Kiebrania huku tanbihi ikifafanua jambo linalodokezwa na muktadha.
