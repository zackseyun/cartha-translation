  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עִשָּׂרֹ֣ן עִשָּׂר֗וֹן סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד עֹלָה֙ רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/013.yaml
  text: and a tenth of an ephah of fine flour as a grain offering mixed with oil for each lamb[a], as a burnt offering, a pleasing aroma, a food offering to Yahweh.
translation:
  language: sw
  text: Na sehemu ya kumi ya efa ya unga laini, kama sadaka ya nafaka iliyochanganywa na mafuta kwa kila mwana-kondoo, kuwa sadaka ya kuteketezwa, harufu ya kupendeza, sadaka inayotolewa kwa moto[a] kwa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya chakula.”
    reason: Neno la Kiebrania אִשֶּׁה linaweza kutafsiriwa kwa kuonyesha kutolewa kwake kwa moto au hadhi yake kama chakula cha sadaka.
lexical_decisions:
- source_word: וְעִשָּׂרֹן עִשָּׂרוֹן
  choice: na sehemu ya kumi ya efa
  rationale: Urudiaji huo una maana ya kugawa kiasi kilekile kwa kila mwana-kondoo. Kipimo cha efa kimetajwa wazi ili maana ya kipimo cha Kiebrania ieleweke kwa msomaji wa Kiswahili.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Hili ni neno la kawaida la ibada kwa unga uliosagwa vizuri; tafsiri hii ni sahihi na ya asili katika Kiswahili.
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika muktadha huu ni sadaka maalumu inayotokana na nafaka, wala si zawadi au sadaka ya jumla.
- source_word: בְּלוּלָה בַּשֶּׁמֶן
  choice: iliyochanganywa na mafuta
  rationale: Kirai kinaeleza unga wa sadaka uliotiwa na kuchanganywa na mafuta.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: kwa kila mwana-kondoo
  rationale: 'Ingawa kwa umbo ni ‘kwa mwana-kondoo mmoja,’ katika orodha hii usemi una nguvu ya ugawaji: kiasi hiki kinatolewa kwa kila mwana-kondoo.'
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni istilahi ya sadaka iliyoteketezwa kabisa; tafsiri hii inahifadhi maana yake ya kiibada.
- source_word: רֵיחַ נִיחֹחַ
  choice: harufu ya kupendeza
  rationale: Usemi huu wa kudumu unaonyesha sadaka inayokubalika na kumpendeza Mungu.
- source_word: אִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Neno hili la kiibada linahusiana na sadaka inayotolewa kwa moto. Tafsiri hii ni wazi katika Kiswahili huku tafsiri mbadala ya ‘sadaka ya chakula’ ikiwekwa katika tanbihi.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa kulitamka kama ‘Yahwe,’ badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu la herufi nne; ‘Yahwe’ hulihifadhi kama jina badala ya cheo.
- issue: Maana ya neno la kiibada אִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  alternative: sadaka ya chakula
  rationale: Uhusiano wa neno hili na moto ndio maana iliyo wazi zaidi kisarufi na kimuktadha, lakini tafsiri ya ‘sadaka ya chakula’ hutumiwa pia kwa sababu ya lugha ya vyakula vya sadaka. Tanbihi inahifadhi uwezekano huo bila kuamua zaidi ya ushahidi.
- issue: Uhusiano wa עֹלָה na maagizo yaliyotangulia
  choice: Hii ni sadaka ya kuteketezwa
  alternative: kama sadaka ya kuteketezwa
  rationale: Kiebrania kina mfuatano wa nomino bila kiunganishi kinachoeleza uhusiano wao kikamilifu. Sentensi tofauti ya Kiswahili inaifanya ‘sadaka ya kuteketezwa’ irejelee agizo zima badala ya kuashiria kwamba unga peke yake ndio sadaka hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. ‘Mwana-kondoo,’ ‘sadaka ya nafaka,’ na ‘sadaka ya kuteketezwa’ ni istilahi zilizo wazi na zinazofaa muktadha wa ibada. Mgawanyo kuwa sentensi mbili unaondoa utata usio wa lazima wa sintaksia bila kufuta utata halisi wa istilahi אִשֶּׁה.
