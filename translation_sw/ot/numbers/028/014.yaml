  text: וְ/נִסְכֵּי/הֶ֗ם חֲצִ֣י הַ/הִין֩ יִהְיֶ֨ה לַ/פָּ֜ר וּ/שְׁלִישִׁ֧ת הַ/הִ֣ין לָ/אַ֗יִל וּ/רְבִיעִ֥ת הַ/הִ֛ין לַ/כֶּ֖בֶשׂ יָ֑יִן זֹ֣את עֹלַ֥ת חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/014.yaml
  text: 'And their drink offerings shall be: half a hin for the bull[a], a third of a hin for the ram, and a fourth of a hin for the lamb, of wine. This is the monthly burnt offering for each month throughout the months of the year.'
translation:
  language: sw
  text: 'Na sadaka zao za kinywaji zitakuwa za divai: nusu hini kwa ajili ya fahali, theluthi moja ya hini kwa ajili ya kondoo dume, na robo ya hini kwa ajili ya mwanakondoo. Hii ndiyo sadaka ya kuteketezwa ya kila mwezi[a], katika mwezi wake, kwa miezi ya mwaka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hii ndiyo sadaka ya kuteketezwa ya mwezi mpya katika mwezi wake, kwa miezi ya mwaka.” Neno la Kiebrania חֹדֶשׁ linaweza kumaanisha “mwezi” au “mwezi mpya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכֵּיהֶם
  choice: sadaka zao za kinywaji
  rationale: Neno נֶסֶךְ humaanisha sadaka inayomiminwa; “sadaka za kinywaji” ni usemi wazi na unaofaa katika muktadha wa ibada.
- source_word: חֲצִי הַהִין
  choice: nusu hini
  rationale: Kipimo cha kale “hini” kimehifadhiwa badala ya kubadilishwa kuwa kipimo cha kisasa.
- source_word: לַפָּר
  choice: kwa ajili ya fahali
  rationale: Umoja wenye kibainishi unamtaja mnyama maalumu wa dhabihu katika orodha hii.
- source_word: וּשְׁלִישִׁת הַהִין
  choice: theluthi moja ya hini
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowakilisha sehemu hiyo kwa usahihi.
- source_word: לָאַיִל
  choice: kwa ajili ya kondoo dume
  rationale: אַיִל katika muktadha wa dhabihu ni kondoo dume.
- source_word: וּרְבִיעִת הַהִין
  choice: robo ya hini
  rationale: “Robo” ni tafsiri ya asili na iliyo wazi ya sehemu ya nne.
- source_word: לַכֶּבֶשׂ
  choice: kwa ajili ya mwanakondoo
  rationale: כֶּבֶשׂ humaanisha mwanakondoo katika orodha hii ya wanyama wa dhabihu.
- source_word: יָיִן
  choice: zitakuwa za divai
  rationale: Neno יָיִן linafafanua kioevu cha sadaka zote; limewekwa mapema kidogo ili sentensi iwe ya kawaida na wazi kwa Kiswahili.
- source_word: זֹאת עֹלַת חֹדֶשׁ
  choice: Hii ndiyo sadaka ya kuteketezwa ya kila mwezi
  rationale: חֹדֶשׁ inaweza kumaanisha “mwezi” au “mwezi mpya.” Maandishi makuu yanaonyesha tendo linalorudiwa kila mwezi, huku tanbihi ikihifadhi maana nyingine inayowezekana.
- source_word: בְּחָדְשׁוֹ לְחָדְשֵׁי הַשָּׁנָה
  choice: inayotolewa mwezi baada ya mwezi katika miezi yote ya mwaka
  rationale: Tafsiri hii inaonyesha urudiaji katika kila mwezi wa mwaka kwa Kiswahili cha kawaida, bila kuondoa wigo wa wakati wa Kiebrania.
theological_decisions:
- issue: Maana ya חֹדֶשׁ katika ratiba ya sadaka
  choice: kila mwezi
  alternative: mwezi mpya
  rationale: Neno la Kiebrania lina maana zote mbili. Muktadha unaeleza sadaka inayorudiwa katika miezi ya mwaka, lakini uhusiano wake na mwandamo wa mwezi mpya unabaki uwezekano halisi na umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Vipimo vya kale vimehifadhiwa, na urudiaji wa sadaka umeelezwa kwa usemi wa kawaida “mwezi baada ya mwezi.”
