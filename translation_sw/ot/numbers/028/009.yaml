base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/009.yaml
  text: 'And on the Sabbath day: two male lambs a year old[a], without blemish, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], and its drink offering.'
translation:
  language: sw
  text: 'Na siku ya Sabato: wana-kondoo dume wawili wenye umri wa mwaka mmoja, wasio na dosari, pamoja na sehemu mbili za kumi za efa[a] za unga laini uliochanganywa na mafuta, kuwa sadaka ya nafaka, na sadaka yake ya kinywaji.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “sehemu mbili za kumi”; katika sheria za sadaka maana yake ni sehemu mbili za kumi za efa.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: Na siku ya Sabato
  rationale: Huhifadhi kiunganishi cha Kiebrania kinachounganisha agizo hili na maagizo yaliyotangulia, na hutumia namna ya kawaida ya Kiswahili ya kutaja wakati.
- source_word: שְׁנֵי כְבָשִׂים
  choice: wana-kondoo dume wawili
  rationale: כְבָשִׂים ni wana-kondoo; neno “dume” linaweka wazi jinsia ya kiume inayodokezwa na umbo la Kiebrania na muktadha wa sheria za dhabihu.
- source_word: בְּנֵי שָׁנָה
  choice: wenye umri wa mwaka mmoja
  rationale: Nahau ya Kiebrania, kihalisi “wana wa mwaka,” inaeleza wanyama wenye umri wa mwaka mmoja.
- source_word: תְּמִימִם
  choice: wasio na dosari
  rationale: Katika muktadha wa dhabihu, neno hili humaanisha wanyama wasiokuwa na kasoro inayowafanya wasifae kutolewa.
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: pamoja na sehemu mbili za kumi za efa
  rationale: Kiebrania kinasema “sehemu mbili za kumi”; katika sheria za sadaka kipimo kinachokusudiwa ni efa. “Pamoja na” huonyesha kwamba unga ni sehemu nyingine ya sadaka ya Sabato.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Ni unga uliosagwa vizuri uliotumiwa kwa sadaka; “unga laini” ni usemi wa kawaida na unaoeleweka katika Kiswahili.
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika sheria za kikuhani, neno hili humaanisha sadaka inayotokana na nafaka, si zawadi ya jumla.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Hueleza unga uliotiwa na kuchanganywa na mafuta kwa lugha ya kawaida ya sasa.
- source_word: וְנִסְכּוֹ
  choice: na sadaka yake ya kinywaji
  rationale: נֶסֶךְ ni sadaka ya kimiminika iliyomiminwa. Kiwakilishi cha umoja “yake” kinahifadhi kiambishi cha umoja cha Kiebrania bila kulazimisha rejeo lake.
theological_decisions:
- issue: Rejeo la kiambishi cha umoja katika וְנִסְכּוֹ
  choice: sadaka yake ya kinywaji
  alternative: sadaka yao ya kinywaji
  rationale: Ingawa wana-kondoo ni wawili, Kiebrania kina kiambishi cha umoja. Tafsiri inadumisha umoja huo na haiamui kimyakimya kama unarejelea sadaka nzima au sehemu nyingine ya ibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kitenzi “mtatoa” kimedokezwa kutokana na muktadha ili sentensi iwe ya kawaida kwa msomaji wa Kiswahili, huku orodha na masharti ya dhabihu yakihifadhiwa.
