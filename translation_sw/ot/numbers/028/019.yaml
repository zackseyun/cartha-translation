  text: וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה עֹלָה֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם וְ/אַ֣יִל אֶחָ֑ד וְ/שִׁבְעָ֤ה כְבָשִׂים֙ בְּנֵ֣י שָׁנָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/019.yaml
  text: 'And you shall present a food offering[a], a burnt offering to Yahweh: two bulls, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: sw
  text: 'Na mtamtolea Yahwe sadaka ya moto[a], yaani, sadaka ya kuteketezwa: mafahali wawili, kondoo dume mmoja, na wanakondoo dume saba wenye umri wa mwaka mmoja. Wote wawe bila dosari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya kutolewa kwa moto.” Neno la Kiebrania ni istilahi ya kiufundi ya sadaka inayotolewa kwa moto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: mtamtolea
  rationale: Hifili ya קרב katika muktadha wa dhabihu humaanisha kuwasilisha au kutoa sadaka; “mtamtolea” ni ya kawaida katika Kiswahili na inaonyesha anayepokea sadaka.
- source_word: אִשֶּׁה
  choice: sadaka ya moto
  rationale: Hili ni neno la kiufundi la dhabihu inayoteketezwa kwa moto. Tafsiri hii ni fupi na hailichanganyi na sadaka ya nafaka; tanbihi inaeleza maana yake.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa dhabihu iliyoteketezwa yote madhabahuni.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kiambishi ל kinaonyesha anayeelekezewa au anayepewa sadaka, na jina la agano יְהוָה limetoholewa kuwa “Yahwe.”
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: mafahali wawili
  rationale: “Mafahali” linawasilisha kwa kawaida wanyama wa kiume wa ng’ombe; usemi wa Kiebrania “wana wa ng’ombe” hauhitaji kuigwa neno kwa neno.
- source_word: וְאַיִל אֶחָד
  choice: kondoo dume mmoja
  rationale: Tafsiri ya kawaida ya אַיִל katika orodha za dhabihu.
- source_word: וְשִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: na wanakondoo dume saba wenye umri wa mwaka mmoja
  rationale: כְבָשִׂים ni wanakondoo wa kiume, na בְּנֵי שָׁנָה inaonyesha kwamba wana umri wa mwaka mmoja.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: Wote wawe bila dosari
  rationale: Katika muktadha wa dhabihu תָּמִים humaanisha kutokuwa na kasoro ya mwili. Muundo huu wa Kiswahili unawasilisha sharti linalowahusu watoaji bila usemi usio wa kawaida wa “kwa ajili yenu.”
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Uhusiano kati ya אִשֶּׁה na עֹלָה
  choice: sadaka ya moto, yaani sadaka ya kuteketezwa
  alternative: sadaka ya chakula, sadaka ya kuteketezwa
  rationale: “Yaani” linaonyesha kwamba hapa sadaka ya kuteketezwa ndiyo aina mahususi ya sadaka ya moto, bila kufanya “sadaka ya chakula” ionekane kana kwamba ni sadaka ya nafaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Istilahi za dhabihu zimetolewa kwa usahihi bila kuiga miundo isiyo ya kawaida ya Kiebrania; alama ya tanbihi [a] imewekwa katika maandishi.
