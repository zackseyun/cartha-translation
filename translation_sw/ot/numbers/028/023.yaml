  text: Zaidi ya sadaka ya kawaida ya kuteketezwa ya asubuhi, mtatoa sadaka hizi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: Zaidi ya
  rationale: Kirai hiki kinaonyesha kwamba sadaka hizi za sikukuu zinaongezwa kwa sadaka ya kawaida, wala hazichukui nafasi yake.
- source_word: עֹלַת הַבֹּקֶר אֲשֶׁר לְעֹלַת הַתָּמִיד
  choice: sadaka ya kawaida ya kuteketezwa ya asubuhi
  rationale: Kirai husika kinaitambulisha sadaka ya kuteketezwa ya asubuhi kuwa sehemu ya sadaka ya kudumu/kawaida. Mpangilio huu wa Kiswahili ni wazi na huepuka dhana kwamba sadaka moja ilitolewa kwa ajili ya nyingine.
- source_word: תַּעֲשׂוּ
  choice: mtatoa sadaka
  rationale: Ingawa kitenzi kwa msingi humaanisha ‘kufanya,’ katika maagizo ya dhabihu Kiswahili cha kawaida hutumia ‘kutoa sadaka.’
- source_word: אֶת אֵלֶּה
  choice: sadaka hizi
  rationale: Kiwakilishi elekezi kinarejelea sadaka zilizotajwa kabla; kutaja ‘sadaka’ huleta uwazi wa kawaida katika Kiswahili.
