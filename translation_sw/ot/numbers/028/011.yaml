base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/011.yaml
  text: 'At the beginnings of your months[a], you shall present a burnt offering to Yahweh: two bulls from the herd, one ram, and seven male lambs a year old, without blemish.'
translation:
  language: sw
  text: 'Mwanzoni mwa miezi yenu[a], mtamtolea Yahweh sadaka ya kuteketezwa: mafahali wawili wa kundi la ng’ombe, kondoo dume mmoja, na wanakondoo dume saba wenye umri wa mwaka mmoja, wasio na dosari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Mwanzoni mwa miezi yenu”; yaani, wakati wa maadhimisho ya mwezi mwandamo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְרָאשֵׁי חָדְשֵׁיכֶם
  choice: Mwanzoni mwa miezi yenu
  rationale: Nahau ya Kiebrania, kihalisi ‘katika vichwa vya miezi yenu,’ inaashiria mwanzo wa kila mwezi, yaani maadhimisho ya mwezi mwandamo. Tafsiri hii inahifadhi muundo wa chanzo kwa Kiswahili cha kawaida.
- source_word: תַּקְרִיבוּ
  choice: mtamtolea
  rationale: Katika muktadha wa dhabihu, hifili ya קרב humaanisha kuleta au kutoa sadaka mbele za Mungu. ‘Mtamtolea’ ni ya asili katika Kiswahili na inaonyesha anayepokea sadaka.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni istilahi ya kawaida ya sadaka iliyoteketezwa yote; uchaguzi huu unatambulisha wazi aina ya ibada inayotajwa.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kama ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: mafahali wawili kutoka kundini
  rationale: Kirai hiki kinataja mafahali wa kundi la ng’ombe. ‘Kutoka kundini’ huhifadhi tofauti yao na wanyama wengine wa sadaka bila kulazimisha maana ya umri ambayo si lazima hapa.
- source_word: וְאַיִל אֶחָד
  choice: kondoo dume mmoja
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya mnyama wa sadaka אַיִל pamoja na hesabu yake.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: wanakondoo dume saba wenye umri wa mwaka mmoja
  rationale: כְּבָשִׂים ni wanakondoo wa kiume, na nahau ‘wana wa mwaka’ huonyesha waliokuwa katika mwaka wao wa kwanza au wenye takriban mwaka mmoja.
- source_word: תְּמִימִם
  choice: wasio na dosari
  rationale: Katika sheria za dhabihu, neno hili humaanisha wanyama wasio na kasoro ya mwili; ‘wasio na dosari’ ni sahihi na inaeleweka kwa urahisi.
theological_decisions:
- issue: Tafsiri ya kirai cha wakati cha ibada ya kila mwezi
  choice: Mwanzoni mwa miezi yenu
  alternative: Wakati wa miezi yenu miandamo
  rationale: Maana ya nahau ni mwanzo wa mwezi unaotambuliwa kwa mwezi mwandamo. Matini kuu inahifadhi taswira ya Kiebrania, huku tanbihi ikieleza matumizi yake ya kiibada bila kufuta utofauti huo.
- issue: Tafsiri ya jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini ina jina maalumu la Mungu, si cheo tu. ‘Yahweh’ huhifadhi jina la agano lililo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili bila kupoteza istilahi za sadaka, jinsia ya wanakondoo, au nahau ya mwanzo wa mwezi.
