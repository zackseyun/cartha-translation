  yaml_path: translation/ot/numbers/028/006.yaml
  text: It is the regular burnt offering[a], made at Mount Sinai as a pleasing aroma[d][c][b], a food offering to Yahweh.
translation:
  language: sw
  text: Hii ndiyo sadaka ya kawaida ya kuteketezwa[a], iliyofanywa kwenye Mlima Sinai[b], kwa harufu ya kupendeza[c], sadaka inayotolewa kwa moto kwa Yahwe[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya daima ya kuteketezwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “iliyoanzishwa kwenye Mlima Sinai.” Kiebrania kwa kawaida humaanisha “iliyofanywa”; katika muktadha huu huenda kinarejelea sadaka iliyotolewa huko au utaratibu wa sadaka uliowekwa huko.
    reason: alternative_reading
  - marker: c
    text: Au, “harufu ya kutuliza” au “harufu tamu.”
    reason: lexical_alternative
  - marker: d
    text: Au, “sadaka ya chakula kwa Yahwe.” Kijadi neno la Kiebrania limetafsiriwa kuwa “sadaka inayotolewa kwa moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno la kawaida la ibada kwa sadaka iliyoteketezwa yote; tafsiri hii ni wazi na imezoeleka katika Kiswahili cha Biblia.
- source_word: תָּמִיד
  choice: ya kawaida
  rationale: Katika muktadha huu linaonyesha sadaka inayotolewa kwa utaratibu unaoendelea. ‘Ya kawaida’ inaeleza urudiaji huo bila kudokeza kwamba kitendo cha kuteketeza hakiishi kamwe.
- source_word: הָעֲשֻׂיָה
  choice: iliyotolewa
  rationale: Kitenzi hiki kwa msingi humaanisha ‘iliyofanywa.’ Kwa habari ya sadaka, ‘iliyotolewa’ ni Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa kuelewa kuwa sadaka hiyo iliwekwa au kuanzishwa Sinai.
- source_word: בְּהַר סִינַי
  choice: kwenye Mlima Sinai
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kutaja mahali, na haiamui peke yake kama sadaka ilitolewa huko au iliwekwa rasmi huko.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: ili iwe harufu ya kupendeza
  rationale: Huhifadhi taswira ya ibada na maana ya sadaka kukubaliwa, kwa lugha ya sasa inayoeleweka.
- source_word: אִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Hii huhifadhi uhusiano wa jadi wa neno hilo na moto na inafaa katika muktadha wa sadaka ya kuteketezwa; tanbihi inataja tafsiri nyingine ya ‘sadaka ya chakula.’
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi kinaonyesha anayepokea sadaka, na jina la agano יהוה limetolewa moja kwa moja kama ‘Yahwe.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya msemo רֵיחַ נִיחֹחַ
  choice: harufu ya kupendeza
  alternative: harufu ya kutuliza
  rationale: Tafsiri hii huhifadhi lugha ya sadaka kukubaliwa na Mungu bila kulazimisha wazo maalumu kuhusu namna sadaka hiyo inavyofanya kazi.
- issue: Maana ya הָעֲשֻׂיָה katika Sinai
  choice: iliyotolewa kwenye Mlima Sinai
  alternative: iliyoanzishwa kwenye Mlima Sinai
  rationale: Tafsiri kuu inafuata kwa karibu kitenzi cha kufanya/kutoa, lakini tanbihi huhifadhi uwezekano wa kwamba kifungu kinarejelea kuanzishwa kwa utaratibu wa sadaka huko Sinai.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa msomaji wa kawaida. Muundo wa ibada umehifadhiwa bila kutumia istilahi nzito zisizo za lazima.
