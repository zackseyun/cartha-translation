  text: You shall offer one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: sw
  text: Mwanakondoo mmoja utamtoa asubuhi, na mwanakondoo wa pili utamtoa kati ya jioni mbili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kati ya jioni mbili”; huu ni msemo wa jadi unaorejelea wakati wa machweo au alasiri ya kuchelewa.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֶּבֶשׂ
  choice: mwanakondoo
  rationale: Neno כֶּבֶשׂ humaanisha mwanakondoo, kwa kawaida kondoo dume mchanga katika muktadha wa dhabihu. “Mwanakondoo” ni tafsiri ya kawaida na ya asili bila kuongeza jinsia ambayo haikutajwa tena wazi katika aya hii.
- source_word: אֶחָד
  choice: mmoja
  rationale: Hii ndiyo maana ya moja kwa moja ya namba אֶחָד na inadumisha tofauti na neno la cheo “wa pili” linalofuata.
- source_word: תַּעֲשֶׂה
  choice: utamtoa
  rationale: Ingawa עשה kwa msingi humaanisha “kufanya,” katika maagizo ya dhabihu humaanisha kuandaa au kutoa dhabihu. “Utamtoa” ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: בַבֹּקֶר
  choice: asubuhi
  rationale: בֹּקֶר humaanisha asubuhi; umbo hili ni fupi, la asili, na linaloeleweka wazi katika Kiswahili.
- source_word: הַשֵּׁנִי
  choice: wa pili
  rationale: שֵׁנִי ni namba ya cheo “wa pili,” nayo inaonyesha wazi mpangilio wa wanakondoo hao wawili.
- source_word: בֵּין הָעַרְבָּיִם
  choice: kati ya jioni mbili
  rationale: Tafsiri hii inahifadhi kwa karibu msemo wa Kiebrania wenye umbo la uwili na kutoeleweka kwake kikamilifu; tanbihi inaeleza maana yake ya wakati bila kuamua kimyakimya mjadala kuhusu muda kamili.
