id: NUM.28.24
reference: Numbers 28:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כָּ/אֵ֜לֶּה תַּעֲשׂ֤וּ לַ/יּוֹם֙ שִׁבְעַ֣ת יָמִ֔ים לֶ֛חֶם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה עַל עוֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/024.yaml
  text: 'Thus you shall offer these each day for seven days: food[a], an offering made by fire, a pleasing aroma to Yahweh[c][b]; it shall be offered in addition to the regular burnt offering and its drink offering.'
translation:
  language: sw
  text: Kwa namna hii mtatoa sadaka hizi kila siku kwa siku saba:[a] chakula,[b] sadaka inayotolewa kwa moto, harufu ya kupendeza kwa Yahwe. Sadaka hiyo itatolewa pamoja na sadaka ya kuteketezwa ya daima na sadaka yake ya kinywaji.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa kufuata maagizo haya mtatoa kila siku kwa siku saba.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “chakula cha sadaka ya moto.” Hapa “chakula” ni kile kinachotolewa katika dhabihu, wala si lazima kiwe mkate halisi pekee.
    reason: cultural_note
  - marker: c
    text: Au, “kando ya sadaka ya kuteketezwa ya daima na sadaka yake ya kinywaji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּאֵלֶּה
  choice: Kwa namna hii ... sadaka hizi
  rationale: Kiambishi כְּ kinaonyesha ulinganisho na sadaka zilizotajwa kabla. Tafsiri hii inadumisha maana ya kufuata namna na kiasi kilichoelezwa, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: תַּעֲשׂוּ
  choice: mtatoa sadaka
  rationale: Ingawa kitenzi עשה kwa kawaida humaanisha ‘kufanya,’ katika muktadha wa dhabihu maana yake ya kimatumizi ni kutoa sadaka.
- source_word: לַיּוֹם שִׁבְעַת יָמִים
  choice: kila siku kwa siku saba
  rationale: Hueleza kurudiwa kwa tendo hilo katika kila mojawapo ya zile siku saba.
- source_word: לֶחֶם אִשֵּׁה
  choice: chakula, sadaka inayotolewa kwa moto
  rationale: לֶחֶם hapa ni chakula au sehemu ya dhabihu inayotolewa kwa Mungu, si lazima mkate halisi; אִשֵּׁה ni sadaka inayohusisha moto.
- source_word: רֵיחַ נִיחֹחַ
  choice: harufu inayompendeza
  rationale: Hifadhi sitiari ya Kiebrania ya harufu inayoonyesha kwamba sadaka inakubaliwa, bila kutumia lugha ya kizamani.
- source_word: לַיהוָה
  choice: kwa ... Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kuwa ‘Yahwe.’ Katika sentensi ya Kiswahili, mhusika wa kupendezwa ameonyeshwa kwa muundo ‘inayompendeza Yahwe.’
- source_word: עַל עֹלַת הַתָּמִיד
  choice: zaidi ya sadaka ya kawaida ya kuteketezwa
  rationale: עַל hapa huonyesha nyongeza, na תָּמִיד hurejelea sadaka inayotolewa kwa ukawaida na kuendelea.
- source_word: יֵעָשֶׂה
  choice: Sadaka hiyo itatolewa
  rationale: Kauli tendwa ya עשה katika muktadha huu wa dhabihu hutafsiriwa kwa kawaida kuwa ‘itatolewa’; nomino imerudiwa ili kuondoa utata wa kiwakilishi katika Kiswahili.
- source_word: וְנִסְכּוֹ
  choice: na sadaka yake ya kinywaji
  rationale: נֶסֶךְ ni sadaka ya kimiminiko inayomiminwa; kiambishi cha umilikaji kinarejelea sadaka ya kawaida ya kuteketezwa.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni יהוה. ‘Yahwe’ huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya רֵיחַ נִיחֹחַ
  choice: harufu inayompendeza Yahwe
  alternative: harufu tulivu; harufu nzuri
  rationale: Tafsiri hii huhifadhi sitiari ya dhabihu na wazo la kukubaliwa na Mungu, bila kueleza kimafundisho namna ya kupendezwa kwake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Sadaka ya kawaida ya kuteketezwa’ imetumiwa kwa sadaka endelevu ya kila siku, na ‘sadaka ya kinywaji’ ni istilahi wazi kwa sadaka ya kimiminiko.
