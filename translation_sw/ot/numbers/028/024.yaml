    text: Au, “Kwa kufuata maagizo haya mtatoa kila siku kwa siku saba.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “chakula cha sadaka ya moto.” Hapa “chakula” ni kile kinachotolewa katika dhabihu, wala si lazima kiwe mkate halisi pekee.
    reason: cultural_note
  - marker: c
    text: Au, “kando ya sadaka ya kuteketezwa ya daima na sadaka yake ya kinywaji.”
    reason: lexical_alternative
  revision_rationale: The revision retains the comparative force at the opening and all sacrificial elements, while using unambiguous Swahili for the additive relationship and a closer equivalent for the continual burnt offering. Footnote markers and their content remain structurally valid and correctly anchored.
