revisions:
- from: Kwa namna hii mtatoa sadaka hizi kila siku kwa siku saba:[a] chakula,[b] sadaka inayotolewa kwa moto, yenye harufu inayompendeza Yahwe. Sadaka hiyo itatolewa zaidi ya sadaka ya kawaida ya kuteketezwa na sadaka yake ya kinywaji.[c]
  to: Kwa namna hii mtatoa sadaka hizi kila siku kwa siku saba:[a] chakula,[b] sadaka inayotolewa kwa moto, harufu ya kupendeza kwa Yahwe. Sadaka hiyo itatolewa pamoja na sadaka ya kuteketezwa ya daima na sadaka yake ya kinywaji.[c]
  rationale: The revision retains the comparative force at the opening and all sacrificial elements, while using unambiguous Swahili for the additive relationship and a closer equivalent for the continual burnt offering. Footnote markers and their content remain structurally valid and correctly anchored.
