base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/007.yaml
  text: And its drink offering shall be a quarter of a hin for each lamb[c][b][a]. In the holy place you shall pour out a drink offering of strong drink to Yahweh.
translation:
  language: sw
  text: Sadaka yake ya kinywaji itakuwa robo ya hini kwa kila mwana-kondoo.[a] Katika mahali patakatifu[b] utamimina sadaka ya kinywaji kileweshacho kwa Yahwe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mwana-kondoo mmoja”; kwa neno halisi, “kwa yule mwana-kondoo mmoja.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika patakatifu.”
    reason: lexical_alternative
  - marker: c
    text: “Kinywaji kileweshacho” ni kinywaji chenye kileo ambacho si divai; aina kamili haijatajwa.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִסְכּוֹ
  choice: Sadaka yake ya kinywaji itakuwa
  rationale: Neno hili humaanisha sadaka ya kimiminiko inayoandamana na sadaka nyingine; kiambishi cha umilikaji kimetafsiriwa “yake,” kikirejelea mwana-kondoo katika muktadha.
- source_word: רְבִיעִת הַהִין
  choice: robo ya hini
  rationale: Huhifadhi kipimo sahihi cha kale bila kukibadili kuwa kipimo cha kisasa.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: kwa kila mwana-kondoo
  rationale: Ingawa maana halisi ni “kwa yule mwana-kondoo mmoja,” katika muktadha inaonyesha kiasi kinachotolewa kwa kila mwana-kondoo.
- source_word: בַּקֹּדֶשׁ
  choice: Mahali patakatifu
  rationale: Katika muktadha wa ibada, kifungu hiki kwa kawaida hurejelea eneo takatifu; tafsiri hii haibani maana kuwa jengo lote la patakatifu.
- source_word: הַסֵּךְ
  choice: utamiminia
  rationale: Kitenzi kinaagiza kitendo cha kumimina sadaka ya kimiminiko; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: נֶסֶךְ
  choice: sadaka ya kinywaji
  rationale: Neno la sadaka limedumishwa wazi kwa kuwa linarudiwa katika Kiebrania na lina umuhimu wa kiibada.
- source_word: שֵׁכָר
  choice: kinywaji chenye kulewesha
  rationale: Neno hilo hutaja kinywaji chenye kilevi ambacho si divai, bila kubainisha aina yake; uchaguzi huu ni wazi zaidi kuliko “kinywaji kikali,” ambalo linaweza kueleweka kuwa na kiwango kikubwa cha alkoholi.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Huhifadhi jina la agano lililoandikwa moja kwa moja katika matini ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia Tetragramatoni moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Mahali pa kumimina sadaka
  choice: Mahali patakatifu
  alternative: katika patakatifu
  rationale: בַּקֹּדֶשׁ inaweza kumaanisha mahali patakatifu au patakatifu; tafsiri kuu ni pana, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hini” imehifadhiwa kama kipimo cha kale. Muundo umeweka wazi kiasi, mahali, tendo la kumimina, na mpokeaji wa sadaka bila kuongeza maelezo yasiyomo katika matini.
