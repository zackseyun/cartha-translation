  text: וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/פָּ֖ר הָ/אֶחָ֑ד וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לָ/אַ֖יִל הָֽ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/012.yaml
  text: and three-tenths of an ephah of fine flour as a grain offering[a], mixed with oil, for the one bull, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], for the one ram.
translation:
  language: sw
  text: na sehemu tatu za kumi za efa[a] za unga laini, sadaka ya nafaka iliyochanganywa na mafuta, kwa ajili ya kila fahali; na sehemu mbili za kumi za efa za unga laini, sadaka ya nafaka iliyochanganywa na mafuta[b], kwa ajili ya kila kondoo dume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “sehemu tatu za kumi” na “sehemu mbili za kumi”; kipimo kinaeleweka kuwa sehemu za kumi za efa.'
    reason: cultural_note
  - marker: b
    text: Au “iliyokorogwa kwa mafuta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: na sehemu tatu za kumi za efa
  rationale: עֶשְׂרוֹן ni kipimo cha sehemu moja ya kumi, kinachoeleweka katika sheria za dhabihu kuwa sehemu ya kumi ya efa. Kutaja efa huifanya sentensi ieleweke bila kuficha kipimo cha kale.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Hili ni neno la kawaida la ibada kwa unga uliosafishwa uliotumiwa katika sadaka; “unga laini” ni Kiswahili cha kawaida na sahihi.
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika muktadha huu wa dhabihu, neno hili linamaanisha sadaka ya mazao ya nafaka, si zawadi au sadaka kwa ujumla.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliokorogwa kwa mafuta
  rationale: Kirai kinaeleza jinsi unga ulivyoandaliwa. “Kukorogwa kwa mafuta” huonyesha kuchanganywa kwake kwa namna ya kawaida na inayoeleweka.
- source_word: לַפָּר הָאֶחָד
  choice: kwa ajili ya kila fahali
  rationale: Katika orodha hii הָאֶחָד ina nguvu ya kugawa kiasi kwa mnyama mmoja mmoja, wala haimaanishi “fahali wa kwanza.” “Kila fahali” ni Kiswahili asilia kinachowasilisha maana hiyo.
- source_word: וּ/שְׁנֵי עֶשְׂרֹנִים
  choice: na sehemu mbili za kumi za efa
  rationale: Kama katika kirai cha kwanza, kipimo kilichodokezwa cha efa kimetajwa ili msomaji aelewe kiasi.
- source_word: לָאַיִל הָאֶחָד
  choice: kwa ajili ya kila kondoo dume
  rationale: Kirai hiki ni sambamba na kile cha fahali na hugawa kiasi kwa kila kondoo dume, bila kuingiza maana isiyokusudiwa ya “wa kwanza.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Efa” imehifadhiwa kama kipimo cha kale, huku ufafanuzi wake ukiwekwa katika tanbihi. “Kila fahali” na “kila kondoo dume” zimetumiwa kwa ufasaha wa Kiswahili na kuonyesha mgawanyo wa kiasi kwa mnyama mmoja mmoja.
