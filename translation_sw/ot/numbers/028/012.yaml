  naturalness: Muundo «sehemu ... za unga laini kuwa sadaka» unasomeka kwa uzito kidogo katika Kiswahili cha sasa. Kutumia koma na uambatanisho «unga laini, sadaka ya nafaka» ni wa kawaida zaidi. «Ul(i)ochanganywa na mafuta» ni chaguo la wazi na la asili kuliko «uliokorogwa».
  terminology: «Efa», «unga laini», «sadaka ya nafaka», «fahali», na «kondoo dume» ni istilahi zinazofaa katika rejista ya kibiblia ya Kiswahili Sanifu. «Kila» hutoa vizuri nguvu ya mgawanyo katika muktadha wa maagizo ya dhabihu.
