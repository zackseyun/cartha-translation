  verdict: revise
  source_fidelity: The draft accurately renders the temporal phrase, the sacred-assembly expression, and the plural prohibition. “Kazi yoyote ya kawaida” conveys the festival restriction on ordinary work without implying that every action is forbidden. However, “mtakuwa na” makes the assembly sound primarily like something the audience possesses or conducts; the Hebrew nominal declaration is more naturally rendered in Swahili as “kutakuwa na.”
  naturalness: “Siku ya kwanza kutakuwa na kusanyiko takatifu” is more idiomatic and suitably formal for a cultic/legal instruction than “Siku ya kwanza mtakuwa na kusanyiko takatifu.” The prohibition remains clear and natural.
  terminology: “Kusanyiko takatifu” appropriately represents מִקְרָא קֹדֶשׁ. “Kazi yoyote ya kawaida” is a sound contemporary equivalent for מְלֶאכֶת עֲבֹדָה; the footnote preserves the more literal underlying wording.
  issues:
