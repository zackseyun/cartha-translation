  yaml_path: translation/ot/numbers/028/018.yaml
  text: On the first day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: sw
  text: Siku ya kwanza kutakuwa na kusanyiko takatifu[a]; msifanye kazi yoyote ya kawaida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkutano mtakatifu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kazi yoyote ya utumishi”; yaani, kazi ya kawaida ya shughuli au ajira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Siku ya kwanza
  rationale: Hutoa kwa njia ya kawaida na ya moja kwa moja kishazi cha wakati chenye namba ya mpangilio, bila kuongeza maneno “ya sikukuu” ambayo hayapo wazi katika aya hii.
- source_word: מִקְרָא קֹדֶשׁ
  choice: kusanyiko takatifu
  rationale: Kirai hiki cha ibada humaanisha mkusanyiko mtakatifu ulioitishwa rasmi. “Kusanyiko takatifu” ni cha asili katika Kiswahili na kinahifadhi wazo la watu kukusanywa kwa kusudi takatifu.
- source_word: כָּל ... לֹא
  choice: msifanye ... yoyote
  rationale: Muundo wa Kiebrania una nguvu ya kukataza kwa ujumla; Kiswahili cha kawaida huieleza kwa kitenzi hasi pamoja na “yoyote.”
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: kazi yoyote ya kawaida
  rationale: Katika muktadha wa siku ya sikukuu, kirai hiki kinahusu kazi ya kawaida ya shughuli au ajira, si kila tendo bila ubaguzi. Tafsiri hii ni wazi na ya asili kwa wasomaji wa sasa.
- source_word: לֹא תַעֲשׂוּ
  choice: msifanye
  rationale: Hii ni amri hasi kwa wingi inayoelekezwa kwa jumuiya; “msifanye” huwasilisha kwa ufupi na kwa usahihi nguvu ya agizo hilo.
