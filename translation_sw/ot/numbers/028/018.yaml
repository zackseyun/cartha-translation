    issue: The phrase “mtakuwa na kusanyiko takatifu” is slightly less direct than the source construction.
    rationale: The Hebrew states that a holy convocation is to occur, rather than explicitly saying that the addressees will have one. “Kutakuwa na” provides a more natural and source-shaped Swahili formulation.
