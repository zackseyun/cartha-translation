lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Katika fomula hii ya masimulizi, kitenzi cha Kiebrania דִּבֵּר pamoja na אֶל kina maana ya kusema au kunena na mtu; “akasema na” ni Kiswahili cha sasa na cha kawaida kinachohifadhi mwelekeo wa usemi kwa Musa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti YHWH limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֶל
  choice: na
  rationale: Katika muundo “akasema na Musa,” “na” hutoa kwa kawaida uhusiano wa kuelekeza maneno kwa Musa katika Kiswahili.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina מֹשֶׁה.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Infinitivu hii hutanguliza maneno ya moja kwa moja; “akisema” huhifadhi fomula ya chanzo na kuonyesha kuwa yaliyosemwa yanafuata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi yana jina binafsi la Mungu, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo; “Yehova” ni umbo jingine la jadi linalotumiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo “akasema na Musa, akisema” umehifadhi marudio ya fomula ya Kiebrania kwa sababu aya inayofuata inatoa maudhui ya usemi.
