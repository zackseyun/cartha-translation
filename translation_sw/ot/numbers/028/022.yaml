base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/022.yaml
  text: and one male goat for a sin offering[a], to make atonement for you.
translation:
  language: sw
  text: na mbuzi dume mmoja kwa sadaka ya dhambi[a], ili kufanya upatanisho kwa ajili yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya utakaso kutokana na dhambi.” Neno la Kiebrania lililotafsiriwa “sadaka ya dhambi” linaweza pia kueleweka, katika muktadha wa dhabihu, kuwa “sadaka ya utakaso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: na beberu
  rationale: Kiunganishi וּ kimetafsiriwa “na,” na שְׂעִיר humaanisha mbuzi dume; “beberu” ni neno la kawaida na sahihi katika Kiswahili sanifu.
- source_word: חַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika muktadha wa dhabihu, חַטָּאת hurejelea sadaka inayotolewa kwa ajili ya dhambi, si dhambi kama dhana pekee. Tafsiri hii ni wazi na imezoeleka, huku maana mbadala ya utakaso ikihifadhiwa katika tanbihi.
- source_word: אֶחָד
  choice: mmoja
  rationale: Namba hii inaonyesha wazi idadi ya mnyama wa dhabihu na imepatana kisarufi na “beberu.”
- source_word: לְ/כַפֵּר
  choice: ili kuwafanyia upatanisho
  rationale: Katika muktadha wa kikuhani, kitenzi כפר kinaeleza tendo la dhabihu la kuleta au kufanya upatanisho. Kauli hii huhifadhi uzito wa kidini bila kufafanua zaidi ya maandishi namna tendo hilo linavyofanya kazi.
- source_word: עֲלֵי/כֶם
  choice: kuwafanyia
  rationale: Kiambishi cha nafsi ya pili wingi kimejumuishwa katika kitenzi, na muundo huu unaonyesha kwamba upatanisho unafanywa kwa ajili ya watu.
theological_decisions:
- issue: Tafsiri ya lugha ya dhabihu ya כפר
  choice: ili kuwafanyia upatanisho
  alternative: ili kuondoa hatia yenu
  rationale: “Kuwafanyia upatanisho” huhifadhi upana na uzito wa lugha ya kikuhani bila kuifungamanisha na nadharia moja maalumu ya jinsi upatanisho unavyotendeka.
- issue: Maana ya חַטָּאת katika mfumo wa dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: “Sadaka ya dhambi” ni tafsiri iliyo wazi na inayotambulika kwa urahisi, lakini uwezekano halisi wa maana ya utakaso umeonyeshwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Beberu” limetumiwa kwa usahihi kueleza mbuzi dume; muundo wa sentensi unaendeleza orodha ya sadaka kutoka katika muktadha uliotangulia.
