  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בְ/י֣וֹם הַ/בִּכּוּרִ֗ים בְּ/הַקְרִ֨יבְ/כֶ֜ם מִנְחָ֤ה חֲדָשָׁה֙ לַֽ/יהוָ֔ה בְּ/שָׁבֻעֹ֖תֵי/כֶ֑ם מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/026.yaml
  text: And on the day of the firstfruits[a], when you present a new grain offering to Yahweh at your Feast of Weeks, you shall have a holy convocation[b]. You shall do no ordinary work.
translation:
  language: sw
  text: Na katika siku ya malimbuko, mtakapomtolea Yahweh sadaka mpya ya nafaka katika Sikukuu yenu ya Majuma, mtakuwa na kusanyiko takatifu[a]. Msifanye kazi yoyote ya kawaida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkutano mtakatifu.” Kirai cha Kiebrania ni istilahi ya mkusanyiko mtakatifu ulioitishwa kwa ajili ya ibada.
    reason: lexical_alternative
  - marker: b
    text: Au “kazi yoyote ngumu” au “kazi yoyote ya shughuli zenu.” Kirai hiki kinamaanisha kazi ya kawaida inayohusiana na shughuli za kila siku.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַבִּכּוּרִים
  choice: Tena siku ya malimbuko
  rationale: Kirai hiki hutaja siku ya sikukuu inayohusishwa na mazao ya kwanza. “Malimbuko” ni neno la kawaida la kibiblia linalohifadhi maana ya kiibada.
- source_word: בְּהַקְרִיבְכֶם
  choice: mtakapomtolea
  rationale: Muundo wa Kiebrania unaonyesha jambo linalotokea wakati huo huo. Katika muktadha wa dhabihu, kitenzi קרב humaanisha kuleta au kutoa sadaka; “mtakapomtolea” ni Kiswahili cha asili na pia humtaja anayepokea sadaka.
- source_word: מִנְחָה חֲדָשָׁה
  choice: sadaka mpya ya nafaka
  rationale: Katika sheria za kikuhani, מִנְחָה kwa kawaida ni sadaka ya nafaka, na “mpya” huihusisha na mavuno mapya.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: בְּשָׁבֻעֹתֵיכֶם
  choice: katika Sikukuu yenu ya Majuma
  rationale: Wingi “majuma yenu” hapa ni jina la sikukuu ya kalenda; kulitaja kama Sikukuu ya Majuma kunafanya rejeo hilo lieleweke bila kupoteza umbo lake.
- source_word: מִקְרָא קֹדֶשׁ
  choice: kusanyiko takatifu
  rationale: Hiki ni kirai maalumu cha kiibada kinachomaanisha mkusanyiko ulioitishwa kwa kusudi takatifu. “Kusanyiko takatifu” ni wazi na chenye hadhi katika Kiswahili cha sasa.
- source_word: יִהְיֶה לָכֶם
  choice: mtakuwa na
  rationale: Hii ni tafsiri ya asili ya Kiswahili ya muundo wa uwepo היה pamoja na ל, huku nguvu ya agizo ikihifadhiwa.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: kazi yoyote ya kawaida
  rationale: Kirai hiki kinakataza kazi ya kawaida ya shughuli za kila siku katika siku ya sikukuu, si kila tendo bila ubaguzi.
- source_word: לֹא תַעֲשׂוּ
  choice: Msifanye
  rationale: Hili ni katazo la moja kwa moja kwa wingi, lililotolewa kwa Kiswahili cha kawaida na chenye nguvu ya kisheria.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina la agano יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa kimadhehebu.
- issue: Upeo wa katazo la kazi
  choice: kazi yoyote ya kawaida
  alternative: kazi yoyote ngumu au kazi yoyote ya shughuli zenu
  rationale: Kirai cha kikuhani hakielekei kukataza kila tendo kabisa, bali kazi ya kawaida inayohusiana na shughuli za kila siku. Tafsiri hii huhifadhi tofauti kati ya ibada takatifu na kazi ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Istilahi za kiibada “malimbuko,” “sadaka ya nafaka,” na “kusanyiko takatifu” zimetumiwa kwa uthabiti; muundo umewekwa wazi bila kuondoa uzito wa kisheria wa mstari.
