  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ רַגְלִ֔י הָ/עָ֕ם אֲשֶׁ֥ר אָנֹכִ֖י בְּ/קִרְבּ֑/וֹ וְ/אַתָּ֣ה אָמַ֗רְתָּ בָּשָׂר֙ אֶתֵּ֣ן לָ/הֶ֔ם וְ/אָכְל֖וּ חֹ֥דֶשׁ יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/021.yaml
  text: But Moses said[a], “The people among whom I am are six hundred thousand on foot, and yet you have said, ‘I will give them meat[b], and they will eat for a month of days.’”
translation:
  language: sw
  text: Lakini Musa akasema, “Watu ambao niko miongoni mwao ni laki sita wanaokwenda kwa miguu[a], nawe umesema, ‘Nitawapa nyama, nao watakula kwa mwezi mzima[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu laki sita waendao kwa miguu,” au “askari wa miguu laki sita.” Usemi wa Kiebrania unaweza kumaanisha watu wanaosafiri kwa miguu au askari wa miguu.
    reason: alternative_reading
  - marker: b
    text: Kiebrania, “mwezi wa siku,” yaani mwezi mzima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini Musa akasema
  rationale: Kiunganishi cha simulizi kinaendeleza tukio, lakini katika muktadha Musa anajibu ahadi ya Mungu kwa pingamizi; “Lakini” huonyesha ulinganifu huo kwa Kiswahili cha kawaida.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: laki sita
  rationale: Hii ndiyo namna ya kawaida na iliyo wazi ya kutaja 600,000 kwa Kiswahili.
- source_word: רַגְלִי הָעָם
  choice: Watu ... ni laki sita wanaokwenda kwa miguu
  rationale: Neno רַגְלִי linahusiana na ‘mguu’ na linaweza kumaanisha watu wanaosafiri kwa miguu au askari wa miguu. Tafsiri kuu inadumisha maana pana bila kuongeza ‘wanaume’ au kulazimisha maana ya kijeshi.
- source_word: אֲשֶׁר אָנֹכִי בְּקִרְבּוֹ
  choice: ambao niko miongoni mwao
  rationale: Huwakilisha kwa kawaida maana ya kuwa katikati au miongoni mwa watu hao.
- source_word: וְאַתָּה אָמַרְתָּ
  choice: nawe umesema
  rationale: Kiwakilishi cha wazi אַתָּה kina uzito wa kulinganisha; “nawe” huhifadhi msisitizo huo, na wakati timilifu unaonyesha kauli iliyotolewa karibuni na ambayo bado inahusika.
- source_word: בָּשָׂר
  choice: nyama
  rationale: Katika muktadha huu ni nyama inayoliwa, hivyo “nyama” ndiyo tafsiri ya asili na ya moja kwa moja.
- source_word: אֶתֵּן לָהֶם
  choice: Nitawapa
  rationale: Huwasilisha kwa ufupi ahadi ya nafsi ya kwanza kuhusu wakati ujao.
- source_word: וְאָכְלוּ
  choice: nao watakula
  rationale: Kitenzi hiki kimeratibiwa na ahadi iliyotangulia na kinaeleza matokeo yatakayotokea.
- source_word: חֹדֶשׁ יָמִים
  choice: kwa mwezi mzima
  rationale: Usemi wa Kiebrania una maana ya mwezi kamili; “kwa mwezi mzima” ni Kiswahili cha kawaida kinachohifadhi msisitizo huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “niko miongoni mwao” ni wa kawaida na unaeleweka; “laki sita” ni usemi wa asili zaidi kuliko kutaja tarakimu kwa maneno marefu. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
