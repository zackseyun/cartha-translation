id: NUM.11.1
reference: Numbers 11:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֤י הָ/עָם֙ כְּ/מִתְאֹ֣נְנִ֔ים רַ֖ע בְּ/אָזְנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע יְהוָה֙ וַ/יִּ֣חַר אַפּ֔/וֹ וַ/תִּבְעַר בָּ/ם֙ אֵ֣שׁ יְהוָ֔ה וַ/תֹּ֖אכַל בִּ/קְצֵ֥ה הַֽ/מַּחֲנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/001.yaml
  text: The people were like those who complain of hardship in the hearing of Yahweh[a], and Yahweh heard it, and his anger burned[d][c][b], and the fire of Yahweh burned among them and consumed some at the edge of the camp.
translation:
  language: sw
  text: Watu walikuwa kama watu wanaolalamika juu ya taabu[a] mbele ya Yahweh[b], naye Yahweh akasikia; hasira yake ikawaka, na moto wa Yahweh[c] ukawaka kati yao na kuteketeza baadhi yao kwenye ukingo wa kambi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama walalamikaji,” “kama watu waliokuwa wakilalamika,” au huenda “kana kwamba walikuwa wakilalamika.” Umbo la Kiebrania ni adimu na lina ugumu fulani.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “masikioni mwa Yahweh,” nahau inayomaanisha kwamba malalamiko yao yalifikia usikivu wa Yahweh.
    reason: lexical_alternative
  - marker: c
    text: Au “moto kutoka kwa Yahweh ukawaka kati yao.”
    reason: alternative_reading
  - marker: d
    text: Au “kwenye sehemu za nje kabisa za kambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הָעָם
  choice: Watu walikuwa
  rationale: Muundo huu unaanzisha tukio jipya la simulizi. Kiswahili hiki ni cha kawaida na hakiongezi kihusishi cha wakati kama “basi” au “wakati huo,” ambacho hakipo wazi katika chanzo.
- source_word: כְּמִתְאֹנְנִים
  choice: kama wenye kulalamika
  rationale: Kiambishi כְּ־ kina maana ya kulinganisha, “kama,” na umbo la kitenzi linaonyesha tendo linaloendelea. Tafsiri inadumisha usemi huu adimu na wenye ugumu fulani badala ya kuufanya kuwa dai la moja kwa moja.
- source_word: רַע
  choice: kuhusu taabu
  rationale: Katika muktadha huu neno linaelekea kutaja hali mbaya, shida, au taabu waliyolalamikia, si lazima uovu wa kimaadili.
- source_word: בְּאָזְנֵי יְהוָה
  choice: Yahweh akisikia
  rationale: Nahau ya Kiebrania ni “masikioni mwa Yahweh,” yaani malalamiko yao yalifika katika usikivu wake. Kiswahili hiki ni cha asili huku tanbihi ikihifadhi picha halisi ya masikio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahweh” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika maandishi.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: Yahweh aliposikia
  rationale: Tafsiri hii inaendeleza simulizi kwa Kiswahili cha kawaida na kudumisha uhusiano wa moja kwa moja na kauli iliyotangulia kuhusu kusikia kwa Yahweh.
- source_word: וַיִּחַר אַפּוֹ
  choice: hasira yake ikawaka
  rationale: Hii inadumisha picha ya Kiebrania ya hasira inayowaka bila kutafsiri kihalisi mno rejeo la pua.
- source_word: וַתִּבְעַר בָּם אֵשׁ יְהוָה
  choice: moto wa Yahweh ukawaka kati yao
  rationale: “Moto wa Yahweh” huhifadhi uhusiano wa nomino ulio katika chanzo, na “kati yao” huakisi בָּם bila kufafanua zaidi namna moto ulivyowafikia.
- source_word: וַתֹּאכַל
  choice: na kuteketeza
  rationale: “Kuteketeza” ni kitenzi cha kawaida kwa uharibifu unaofanywa na moto na kinahifadhi nguvu ya picha ya Kiebrania.
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: kwenye ukingo wa kambi
  rationale: Neno קָצֶה linaweza kumaanisha ukingo au sehemu za nje. “Ukingo wa kambi” ni wazi na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu. “Yahweh” huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya moto na Yahweh
  choice: moto wa Yahweh
  alternative: moto kutoka kwa Yahweh
  rationale: Muundo wa Kiebrania ni “moto wa Yahweh.” Tafsiri kuu inaacha uhusiano huo wazi bila kuamua kimya kimya kwamba ni genitivi ya asili; maana ya “moto kutoka kwa Yahweh” imeonyeshwa katika tanbihi.
- issue: Kitu kilichoteketezwa kwenye ukingo wa kambi
  choice: baadhi yao
  alternative: sehemu ya ukingo wa kambi
  rationale: Kiebrania hakitaji wazi yambwa la kitenzi “kuteketeza.” “Baadhi yao” hufanya sentensi iwe ya kawaida katika Kiswahili na inaafikiana na moto kuwaka kati ya watu, bila kudai kwamba kambi nzima au eneo fulani pekee ndilo lililoteketezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na hadhi inayofaa maandiko. Usemi “kama wenye kulalamika” umehifadhiwa kwa makusudi ili kutobatilisha hali ya kulinganisha na ugumu wa Kiebrania. Viunganishi na miundo ya vitenzi vimechaguliwa kwa urahisi wa usomaji bila kuongeza alama ya wakati isiyopo wazi katika chanzo.
