source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֶסְפָ/ה לִּ֞/י שִׁבְעִ֣ים אִישׁ֮ מִ/זִּקְנֵ֣י יִשְׂרָאֵל֒ אֲשֶׁ֣ר יָדַ֔עְתָּ כִּי הֵ֛ם זִקְנֵ֥י הָ/עָ֖ם וְ/שֹׁטְרָ֑י/ו וְ/לָקַחְתָּ֤ אֹתָ/ם֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִֽתְיַצְּב֥וּ שָׁ֖ם עִמָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
translation:
  language: sw
  text: Kisha Yahwe akamwambia Musa, “Nikusanyie[a] wanaume sabini kutoka miongoni mwa wazee wa Israeli, ambao unajua kuwa ni wazee wa watu na maofisa wa watu hao[b]. Uwalete kwenye hema la kukutania, na wasimame huko pamoja nawe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nikusanyie pamoja.”
    reason: lexical_alternative
  - marker: b
    text: Au, “viongozi wa utawala wa watu hao”; neno la Kiebrania linamaanisha maofisa wenye wajibu wa kiutawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Tahajia ya Kiswahili ‘Yahwe’ huhifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo kama ‘BWANA’.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Hii ni kauli ya kawaida ya kusimulia inayotanguliza maneno ya moja kwa moja; kiambishi ‘-mw-’ humtaja Musa kama anayesemeshwa.
- source_word: אֶסְפָה לִּי
  choice: Nikusanyie
  rationale: Kitenzi kinaagiza Musa awalete watu pamoja, na ‘-nie’ huhifadhi wazo la kufanya hivyo kwa ajili ya msemaji.
- source_word: שִׁבְעִים אִישׁ
  choice: wanaume sabini
  rationale: אִישׁ baada ya idadi imetumiwa kwa maana ya wanaume mmoja mmoja; muktadha ni wa viongozi wanaume wa Israeli.
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  choice: kutoka miongoni mwa wazee wa Israeli
  rationale: מִן huonyesha kwamba watu sabini wanachaguliwa kutoka katika kundi kubwa zaidi la wazee wa Israeli.
- source_word: אֲשֶׁר יָדַעְתָּ כִּי
  choice: ambao unajua kuwa ni
  rationale: Usemi huu ni wa kawaida katika Kiswahili na unahifadhi kwamba Musa tayari anawatambua watu hao kuwa viongozi.
- source_word: זִקְנֵי הָעָם
  choice: wazee wa watu
  rationale: Huhifadhi ufafanuzi wa matini kwamba hao ni wazee wanaotambuliwa kuwa viongozi wa jumuiya.
- source_word: וְשֹׁטְרָיו
  choice: na maofisa wao
  rationale: שֹׁטֵר humaanisha mwenye wajibu wa kiutawala au utekelezaji. Kiwakilishi ‘wao’ kinawarejelea watu kwa kawaida katika Kiswahili.
- source_word: וְלָקַחְתָּ אֹתָם
  choice: Uwalete
  rationale: Ingawa לקח kwa msingi ni ‘chukua,’ hapa mwendo unaelekezwa mahali ambapo Mungu ataonana nao; ‘walete’ ni Kiswahili cha kawaida katika muktadha huo.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni jina la mahali patakatifu pa kukutana; ‘hema la kukutania’ ni wazi na huhifadhi maana ya vipengele vya Kiebrania bila kutumia jina pana zaidi ‘maskani.’
- source_word: וְהִתְיַצְּבוּ שָׁם עִמָּךְ
  choice: nao wasimame huko pamoja nawe
  rationale: Muundo wa kitenzi huonyesha kusimama au kujihudhurisha rasmi; tafsiri hii ni ya asili na huhifadhi nguvu ya agizo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ina jina binafsi la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku ikitumia tahajia inayosomeka kwa kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. ‘Yahwe’ limetumiwa kama umbo la Kiswahili la jina la Mungu. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayofafanuliwa.
