  yaml_path: translation/ot/numbers/011/029.yaml
  text: But Moses said to him[a], “Are you jealous for my sake? If only all Yahweh’s people were prophets[b], that Yahweh would put his Spirit on them!”
translation:
  language: sw
  text: Lakini Musa akamwambia, “Je, una wivu kwa ajili yangu?[a] Laiti watu wote wa Yahwe wangekuwa manabii, na Yahwe aweke Roho wake juu yao![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, una bidii kwa ajili yangu?” Neno la Kiebrania linaweza kumaanisha wivu au bidii ya kulinda masilahi ya mtu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Yahwe aweke Roho wake juu yao.” Kifungu hiki kinaendeleza tamanio lililoonyeshwa na “Laiti”; כִּי inaweza pia kutafsiriwa “kwa kuwa” katika miktadha mingine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְקַנֵּא אַתָּה לִי
  choice: Je, una wivu kwa ajili yangu?
  rationale: קנא inaweza kueleza wivu au bidii yenye kutaka kumlinda mtu. Katika swali la Musa kwa Yoshua, “una wivu kwa ajili yangu” huhifadhi maana ya kujali masilahi ya Musa bila kuifanya bidii hiyo ionekane kuwa nzuri moja kwa moja.
- source_word: וּמִי יִתֵּן
  choice: Laiti
  rationale: Hii ni nahau ya Kiebrania inayoonyesha tamanio, si swali halisi la kutaka kujua ni nani atakayetoa kitu. “Laiti” ni ya kawaida, fupi, na yenye nguvu ya tamanio katika Kiswahili.
- source_word: כָּל עַם יְהוָה
  choice: watu wote wa Yahwe
  rationale: Muundo huu unaonyesha watu wote walio wa Yahwe. Tafsiri hii ni ya asili katika Kiswahili na inadumisha jina binafsi la Mungu.
- source_word: נְבִיאִים
  choice: manabii
  rationale: Nomino ya Kiebrania humaanisha manabii moja kwa moja; hakuna haja ya kuibadili kuwa kifungu kama “watu wanaotabiri.”
- source_word: כִּי יִתֵּן יְהוָה אֶת רוּחוֹ עֲלֵיהֶם
  choice: na Yahwe angeweka Roho wake juu yao
  rationale: Katika muktadha huu, kifungu kinaendeleza tamanio la Musa. “Kuweka ... juu yao” huhifadhi taswira ya Kiebrania ya Roho kuwa juu ya watu kwa ajili ya unabii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa na cheo kama “Bwana.”
- source_word: רוּחוֹ
  choice: Roho wake
  rationale: Muktadha wa kutabiri unaonyesha kuwa רוח ni Roho wa Mungu anayewawezesha watu, wala si upepo au pumzi.
theological_decisions:
- issue: Maana ya רוּחוֹ katika muktadha wa kuwezeshwa kutabiri
  choice: Roho wake
  alternative: roho yake
  rationale: Muktadha unamtaja Yahwe akiwapa watu uwezo wa kinabii. Herufi kubwa katika “Roho” humtambulisha anayerejelewa bila kufafanua zaidi ya yale yanayosemwa na mstari.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania hutumia jina binafsi la Mungu; kulitoholea huhifadhi jambo hilo badala ya kuliwakilisha kwa cheo.
- issue: Uhusiano wa כִּי na tamanio lililotangulia
  choice: na Yahwe angeweka Roho wake juu yao
  alternative: kwa kuwa Yahwe angeweka Roho wake juu yao
  rationale: כִּי inaweza kuwa na vivuli kadhaa vya maana, lakini hapa inaeleweka vizuri zaidi kuwa inaendeleza au kueleza yaliyomo katika tamanio la Musa. Tafsiri kuu ina Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa uhusiano wa sababu au maelezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima, na unaosomeka kwa urahisi. “Laiti” hutumiwa kwa tamanio la dhati; “manabii” na “Roho wake juu yao” huhifadhi msamiati na taswira ya matini ya Kiebrania.
