id: NUM.11.5
reference: Numbers 11:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: זָכַ֨רְנוּ֙ אֶת הַ/דָּגָ֔ה אֲשֶׁר נֹאכַ֥ל בְּ/מִצְרַ֖יִם חִנָּ֑ם אֵ֣ת הַ/קִּשֻּׁאִ֗ים וְ/אֵת֙ הָֽ/אֲבַטִּחִ֔ים וְ/אֶת הֶ/חָצִ֥יר וְ/אֶת הַ/בְּצָלִ֖ים וְ/אֶת הַ/שּׁוּמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/005.yaml
  text: We remember the fish that we ate in Egypt for nothing[a], the cucumbers, the melons, the leeks, the onions, and the garlic.
translation:
  language: sw
  text: Tunakumbuka samaki tuliokuwa tukila huko Misri bila malipo[a], matango, matikiti, liki, vitunguu na vitunguu saumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bure” au “bila gharama.” Wazungumzaji wanaikumbuka Misri kwa mtazamo wa malalamiko yao, ingawa kwa kweli walikuwa watumwa huko.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְנוּ
  choice: Tunakumbuka
  rationale: Kitenzi cha Kiebrania katika usemi huu wa moja kwa moja kinaeleza kumbukumbu ya sasa; ‘Tunakumbuka’ ni Kiswahili cha kawaida na hudumisha sauti ya malalamiko.
- source_word: הַדָּגָה
  choice: samaki
  rationale: Nomino hii inarejelea samaki kwa ujumla kama chakula; ‘samaki’ hudumisha maana hiyo ya jumla bila kuongeza aina fulani.
- source_word: אֲשֶׁר נֹאכַל
  choice: tuliokuwa tukila
  rationale: Umbo la kitenzi linaeleweka katika muktadha huu kama tendo la kawaida la wakati uliopita; tafsiri hii inaonyesha desturi hiyo wazi na kwa Kiswahili cha asili.
- source_word: בְּמִצְרַיִם
  choice: Misri
  rationale: Katika Kiswahili, jina la mahali baada ya kitenzi ‘kula’ linaweza kutumika kwa maana ya ‘huko Misri’ bila kuhitaji kihusishi.
- source_word: חִנָּם
  choice: bure
  rationale: Neno hili humaanisha bila malipo au gharama. ‘Bure’ ni fupi, ya kawaida, na huhifadhi mtazamo wa walalamikaji pamoja na kinaya cha utumwa wao.
- source_word: הַקִּשֻּׁאִים
  choice: matango
  rationale: Hili ndilo jina la kawaida la zao linalokusudiwa.
- source_word: הָאֲבַטִּחִים
  choice: matikiti
  rationale: Neno la Kiebrania hutaja aina ya tikiti; ‘matikiti’ huepuka kulazimisha utambulisho mahususi zaidi kuliko ushahidi wa neno.
- source_word: הֶחָצִיר
  choice: liki
  rationale: Katika orodha hii ya vyakula, neno linaeleweka kwa kawaida kuwa mboga aina ya leek, si nyasi. ‘Liki’ hulitofautisha na vitunguu vinavyofuata.
- source_word: הַבְּצָלִים
  choice: vitunguu
  rationale: Hili ndilo jina la kawaida la zao hili katika Kiswahili.
- source_word: הַשּׁוּמִים
  choice: vitunguu saumu
  rationale: Hili ndilo jina sanifu na linaloeleweka la garlic katika Kiswahili.
theological_decisions:
- issue: Maana ya חִנָּם ikizingatiwa kwamba Waisraeli walikuwa watumwa Misri
  choice: bure
  alternative: bila malipo; bila gharama
  rationale: Aya inaripoti malalamiko ya watu kwa mtazamo wao wenyewe, wala haitoi tathmini kamili ya maisha yao Misri. Tafsiri ya moja kwa moja huhifadhi kauli yao na kinaya chake bila kuingiza masahihisho ya kitafsiri ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Orodha imeachwa kuwa nyepesi na ya moja kwa moja. Neno ‘liki’ limetumiwa kutofautisha zao hilo na ‘vitunguu’ na ‘vitunguu saumu,’ ingawa huenda lisijulikane kwa usawa katika maeneo yote.
