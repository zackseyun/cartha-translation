id: NUM.11.2
reference: Numbers 11:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּצְעַ֥ק הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יִּתְפַּלֵּ֤ל מֹשֶׁה֙ אֶל יְהוָ֔ה וַ/תִּשְׁקַ֖ע הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/002.yaml
  text: Then the people cried out to Moses[a], and Moses prayed to Yahweh, and the fire died down.
translation:
  language: sw
  text: Ndipo watu wakamlilia Musa, naye Musa akasali kwa Yahweh, na moto ukapungua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “moto ukatulia” au “moto ukazama.” Kitenzi cha Kiebrania kinaonyesha kwamba moto ulilegea au ulipungua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: wakamlilia
  rationale: Kitenzi צעק hapa kinaonyesha kilio cha dhiki au kuomba msaada. “Wakamlilia” linaeleza kwa kawaida kwamba watu walimwelekea Musa kwa kilio cha dharura.
- source_word: הָעָם
  choice: watu
  rationale: עם katika simulizi hili linamaanisha jumuiya ya Waisraeli kwa pamoja; “watu” ni tafsiri ya kawaida na iliyo wazi.
- source_word: אֶל מֹשֶׁה
  choice: Musa
  rationale: Kiambishi cha yambwa katika “wakamlilia Musa” kinaonyesha kwa njia ya kawaida ya Kiswahili kwamba kilio chao kilielekezwa kwake.
- source_word: וַיִּתְפַּלֵּל
  choice: akasali
  rationale: Umbo la kitenzi פלל linamaanisha kusali. “Akasali” linadumisha maana ya moja kwa moja bila kuongeza waziwazi dhana ya kuombea, ingawa muktadha unaidokeza.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kuwa “Yahweh” badala ya kubadilishwa na cheo.
- source_word: וַתִּשְׁקַע
  choice: ukapungua
  rationale: שקע lina wazo la kushuka, kutulia, au kupungua. Kuhusu moto, “ukapungua” ni Kiswahili cha kawaida kinachoonyesha kwamba moto ulitulia bila kulazimisha maana ya kwamba ulizimwa kabisa mara moja.
- source_word: הָאֵשׁ
  choice: moto
  rationale: אשׁ humaanisha “moto,” hapa ukiurejelea moto uliotajwa katika muktadha wa karibu.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu, si cheo. “Yahweh” linahifadhi jina hilo kwa utohozi unaokubalika kutoka Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wakamlilia” linaonyesha kilio cha kuomba msaada, huku “ukapungua” likihifadhi upana wa maana ya kitenzi cha Kiebrania.
