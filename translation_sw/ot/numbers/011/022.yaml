base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/022.yaml
  text: Would sheep and cattle be slaughtered for them and be enough for them? Or if all the fish of the sea were gathered for them[a], would it be enough for them?
translation:
  language: sw
  text: Je, kondoo na ng’ombe wachinjwe kwa ajili yao, na je, watawatosha? Au samaki wote wa baharini wakusanywe kwa ajili yao, na je, watawatosha?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, neno kwa neno ni “na ipatikane kwao”; hii ni nahau yenye maana ya “na iwatoshe” au “na iwe ya kutosha kwao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ
  choice: Je
  rationale: Kiulizi hiki kinaanzisha swali la balagha; “Je” ni cha kawaida na chenye hadhi katika Kiswahili sanifu.
- source_word: צֹאן וּבָקָר
  choice: kondoo na ng’ombe
  rationale: Maneno haya yanatofautisha mifugo midogo na ng’ombe; katika muktadha huu “kondoo na ng’ombe” ni wazi na halisi bila kutumia istilahi nzito.
- source_word: יִשָּׁחֵט
  choice: wachinjwe
  rationale: Nifali ya שׁחט humaanisha kuchinja wanyama, hasa kwa chakula au dhabihu; “wachinjwe” huhifadhi maana hiyo mahsusi.
- source_word: לָהֶם
  choice: kwa ajili yao
  rationale: Kihusishi hapa kinaonyesha maandalizi yanayofanywa kwa manufaa ya watu.
- source_word: וּמָצָא לָהֶם
  choice: ili wawatoshe
  rationale: Hii ni nahau yenye maana ya kuwa vya kutosha kwao, si kupatikana tu; muundo wa kusudi unasikika kwa kawaida katika swali la Kiswahili huku ukihifadhi wazo la utoshelevu.
- source_word: אִם
  choice: Au
  rationale: Hapa אִם inaanzisha upande wa pili wa swali mbadala; “Au” huonyesha uhusiano huo kwa ufupi na kwa kawaida.
- source_word: אֵת כָּל דְּגֵי הַיָּם
  choice: samaki wote wa baharini
  rationale: Tafsiri hii huhifadhi wazo la ujumla katika כָּל na uhusiano wa samaki na bahari.
- source_word: יֵאָסֵף
  choice: wakusanywe
  rationale: Nifali ya אסף ni kukusanywa; “wakusanywe” haiongezi dhana mahsusi ya kuvuliwa ambayo haijaelezwa moja kwa moja.
- source_word: וּמָצָא לָהֶם
  choice: ili wawatoshe
  rationale: Nahau iliyorudiwa imetafsiriwa kwa uthabiti ili kudumisha ulinganifu wa maswali mawili.
