base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/009.yaml
  text: When the dew came down on the camp at night[a], the manna came down on it.
translation:
  language: sw
  text: Umande uliposhuka juu ya kambi usiku,[a] mana ilishuka juu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na umande uliposhuka juu ya kambi usiku, mana ilishuka juu yake.” Kiebrania kinatumia kitenzi kilekile (“shuka”) kwa umande na kwa mana, na hivyo kusisitiza ulinganifu huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֶדֶת
  choice: uliposhuka
  rationale: Kiunganishi וּ pamoja na kihusishi בְ na kitenzi-jina cha ירד huanzisha kishazi cha wakati; “uliposhuka” ni Kiswahili cha kawaida na huhifadhi maana ya kushuka.
- source_word: הַטַּל
  choice: umande
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa טַל; udhahiri wa nomino unaeleweka katika muktadha.
- source_word: עַל הַמַּחֲנֶה
  choice: juu ya kambi
  rationale: עַל hapa huonyesha mahali ambapo umande hushuka na kutua; “juu ya kambi” ni ya asili na haibainishi kupita kiasi.
- source_word: לָיְלָה
  choice: usiku
  rationale: Nomino hii imetumiwa kama kielezi cha wakati; “usiku” ni tafsiri ya kawaida na fasaha.
- source_word: יֵרֵד
  choice: ilishuka
  rationale: Kauli isiyotimilika katika muktadha huu inaeleza tukio la kawaida lililorudiwa zamani. Wakati uliopita wa Kiswahili unafaa katika simulizi.
- source_word: הַמָּן
  choice: mana
  rationale: Jina linalotambulika la chakula hicho cha kimiujiza; limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kiwakilishi cha umoja wa kiume kinaelekea kurejelea kambi. Tafsiri hii huhifadhi kiwakilishi bila kuamua wazi uhusiano wa mana na umande.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Neno “pia” linaonyesha ulinganifu wa vitendo viwili bila kuondoa uwezekano wa kusoma וּ kama “na”; chaguo hilo limeonyeshwa katika tanbihi.
