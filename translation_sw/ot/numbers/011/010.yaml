id: NUM.11.10
reference: Numbers 11:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע מֹשֶׁ֜ה אֶת הָ/עָ֗ם בֹּכֶה֙ לְ/מִשְׁפְּחֹתָ֔י/ו אִ֖ישׁ לְ/פֶ֣תַח אָהֳל֑/וֹ וַ/יִּֽחַר אַ֤ף יְהוָה֙ מְאֹ֔ד וּ/בְ/עֵינֵ֥י מֹשֶׁ֖ה רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/010.yaml
  text: Moses heard the people weeping by their clans[a], each man at the entrance of his tent. And the anger of Yahweh burned greatly[b], and it was evil in the eyes of Moses.
translation:
  language: sw
  text: Musa akawasikia watu wakilia kwa koo zao[a], kila mwanamume akiwa mlangoni mwa hema lake. Hasira ya Yahwe ikawaka sana, na jambo hilo likawa baya machoni pa Musa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa familia zao.” Neno la Kiebrania linaweza kumaanisha familia au vikundi vya koo.
    reason: lexical_alternative
  - marker: b
    text: Au “jambo hilo likamchukiza Musa.” Kihalisi, “likawa baya machoni pa Musa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: akawasikia
  rationale: Kitenzi hiki hapa kinaeleza Musa kutambua kwa kusikia kilio cha watu, si kusikiliza kwa makusudi.
- source_word: הָעָם בֹּכֶה
  choice: watu wakilia
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea; “wakilia” ni Kiswahili cha kawaida na huhifadhi hali ya maombolezo.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: kwa koo zao
  rationale: Neno מִשְׁפָּחָה linaweza kumaanisha kundi la ukoo au familia pana; “koo zao” linaonyesha vikundi vya kindugu bila kulifanya kuwa familia ndogo tu.
- source_word: אִישׁ
  choice: kila mwanamume
  rationale: Umoja wa kiume umetumiwa kwa maana ya kugawa tendo kwa kila mmoja; “kila mwanamume” huhifadhi jinsia iliyo wazi katika Kiebrania.
- source_word: לְפֶתַח אָהֳלוֹ
  choice: akiwa mlangoni mwa hema lake
  rationale: פֶּתַח ni mlango au nafasi ya kuingilia; usemi huu ni wa asili katika Kiswahili na huhifadhi picha ya mahali.
- source_word: וַיִּחַר אַף יְהוָה מְאֹד
  choice: Hasira ya Yahwe ikawaka sana
  rationale: Tafsiri hii huhifadhi sitiari ya Kiebrania ya hasira kuwaka pamoja na kiwango chenye nguvu kinachoonyeshwa na מְאֹד.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni umbo la Kiswahili la jina la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: וּבְעֵינֵי מֹשֶׁה רָע
  choice: na jambo hilo likawa baya machoni pa Musa
  rationale: Usemi huu huhifadhi taswira na nguvu ya tathmini ya Kiebrania, huku “jambo hilo” likiacha upeo wa kinachohukumiwa ukiwa mpana kama katika muktadha.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וּבְעֵינֵי מֹשֶׁה רָע
  choice: jambo hilo likawa baya machoni pa Musa
  alternative: jambo hilo likamchukiza Musa
  rationale: Tafsiri iliyochaguliwa huhifadhi usemi wa Kiebrania na mvutano wake wa kitathmini; mbadala unaeleza maana ya nahau lakini hupunguza ukali wa neno “baya” na kufafanua zaidi hisia ya Musa.
- issue: Umoja wa kiume wa kugawa אִישׁ
  choice: kila mwanamume
  alternative: kila mmoja
  rationale: Chaguo hili huhifadhi rejeo la kiume lililo wazi katika umbo la Kiebrania bila kuligeuza kuwa usemi usioonyesha jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa sentensi umefanywa wa kawaida kwa Kiswahili huku sitiari ya hasira “kuwaka” na nahau “baya machoni pa Musa” zikihifadhiwa.
