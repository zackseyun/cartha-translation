reference: Numbers 11:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִם כָּ֣כָה אַתְּ עֹ֣שֶׂה לִּ֗/י הָרְגֵ֤/נִי נָא֙ הָרֹ֔ג אִם מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/אַל אֶרְאֶ֖ה בְּ/רָעָתִֽ/י־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/015.yaml
  text: If this is how you are going to deal with me[a], please kill me at once, if I have found favor in your eyes, and do not let me see my misery.
translation:
  language: sw
  text: Ikiwa hivi ndivyo unavyonitendea, tafadhali niue kabisa, ikiwa nimepata kibali machoni pako, wala usiniache nione taabu yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maafa yangu,” “dhiki yangu,” au “mabaya yatakayonipata.” Neno la Kiebrania linaweza kumaanisha hali mbaya, shida, au maafa, wala si uovu wa kimaadili tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ikiwa
  rationale: Kishazi hiki kinaanzisha sharti; kiunganishi וְ kinaweza kuingizwa kwa kawaida katika mtiririko wa Kiswahili bila kuanza na “Na”.
- source_word: כָּכָה
  choice: hivi ndivyo
  rationale: Hii ni namna ya asili ya Kiswahili ya kueleza “hivi/namna hii” katika malalamiko yenye sharti.
- source_word: אַתְּ ... עֹשֶׂה לִּי
  choice: unavyonitendea
  rationale: Kitenzi עשה pamoja na לִי hapa kinaeleza jinsi Mungu anavyomtendea Musa; “unavyonitendea” ni cha kawaida na kinahifadhi maana ya kimahusiano.
- source_word: הָרְגֵנִי נָא הָרֹג
  choice: tafadhali niue kabisa
  rationale: נָא huonyesha ombi, na jina-kitenzi kamilifu linaloambatana na amri linasisitiza tendo; “kabisa” huhifadhi mkazo bila kulazimisha wazo la muda lisilotajwa moja kwa moja.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: ikiwa nimepata kibali machoni pako
  rationale: Huhifadhi nahau na taswira ya Kiebrania ya kupata mtazamo mwema wa Mungu kwa lugha ya Kiswahili inayoeleweka.
- source_word: וְאַל אֶרְאֶה
  choice: wala usiniache nione
  rationale: Huwasilisha ombi hasi linaloelekezwa kwa Mungu kwa Kiswahili cha kawaida na chenye heshima.
- source_word: בְּרָעָתִי
  choice: taabu yangu
  rationale: רָעָה hapa inaweza kumaanisha dhiki, shida, au maafa badala ya uovu wa kimaadili; “taabu yangu” inafaa muktadha wa kukata tamaa kwa Musa huku ikibaki pana.
theological_decisions:
- issue: Maana ya בְּרָעָתִי katika ombi la Musa
  choice: taabu au dhiki yake binafsi
  alternative: uovu wangu; maafa yangu; mabaya yatakayonipata
  rationale: Muktadha unahusu kulemewa na kukata tamaa kwa Musa, si ungamo la uovu wake wa kimaadili. “Taabu yangu” huhifadhi maana ya mateso au hali mbaya bila kuingiza dai la kitheolojia lisilo dhahiri katika kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na ombi kali la Musa huku ukitumia nahau asili za Kiswahili.
