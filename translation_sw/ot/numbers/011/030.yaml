  text: Then Moses returned to the camp[a], he and the elders of Israel.
translation:
  language: sw
  text: Kisha Mose akarudi kambini[a], yeye na wazee wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kisha Mose akakusanywa tena kambini, yeye na wazee wa Israeli.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa maana yake ya msingi kwa namna hii, lakini katika muktadha kinamaanisha kwamba Mose alirudi kambini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: akarudi
  rationale: Kitenzi אסף katika Niphal hapa kinaeleza kwa njia ya kimuktadha kurudi kambini baada ya tukio lililotangulia. “Akarudi” ni Kiswahili cha kawaida na huhifadhi maana ya mwendo wa kurudi bila kulazimisha umbo la kutendwa la Kiebrania.
- source_word: אֶל הַמַּחֲנֶה
  choice: kambini
  rationale: Kirai hiki kinamaanisha kwenda kwenye kambi ya Israeli. “Kambini” ni usemi wa asili katika Kiswahili kwa mwelekeo wa kwenda kambini, huku “kwenda kwenye kambi” likiwa toleo la wazi zaidi lakini zito kidogo.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: yeye pamoja na wazee wa Israeli
  rationale: Kiwakilishi הוּא kina msisitizo wa kiambatisho na kinaonyesha wazi kwamba Mose alirudi pamoja na wazee. Kukitafsiri kwa “yeye pamoja na” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: wazee wa Israeli
  rationale: Hili ni tafsiri ya moja kwa moja ya muundo wa utegemezi wa Kiebrania na ni istilahi ya kawaida, yenye heshima, katika masimulizi ya Biblia.
