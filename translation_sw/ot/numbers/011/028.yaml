source:
  edition: WLC
  text: וַ/יַּ֜עַן יְהוֹשֻׁ֣עַ בִּן נ֗וּן מְשָׁרֵ֥ת מֹשֶׁ֛ה מִ/בְּחֻרָ֖י/ו וַ/יֹּאמַ֑ר אֲדֹנִ֥/י מֹשֶׁ֖ה כְּלָאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/028.yaml
  text: Then Joshua son of Nun[a], Moses’ attendant from his youth, answered and said, “My lord Moses[b], restrain them!”
translation:
  language: sw
  text: Ndipo Yoshua mwana wa Nuni, msaidizi wa Musa tangu ujana wake[a], akajibu, akasema, “Bwana wangu Musa, wazuie[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mmoja wa vijana wake,” au labda “mmoja wa wateule wake.” Kifungu cha Kiebrania ni kifupi na kina utata fulani.
    reason: lexical_alternative
  - marker: b
    text: Au “wakataze.” Kitenzi cha Kiebrania kinaweza kumaanisha kuzuia, kushikilia au kukataza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: Ndipo ... akajibu, akasema
  rationale: Miundo hii miwili inaendeleza simulizi na kutambulisha jibu la Yoshua. Tafsiri imehifadhi vitenzi vyote bila kuvifanya kuwa maelezo marefu.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yoshua mwana wa Nuni
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: msaidizi wa Musa
  rationale: Neno מְשָׁרֵת humaanisha mtu anayehudumu kwa kumsaidia mwingine. “Msaidizi” ni Kiswahili cha sasa na hakidokezi utumwa.
- source_word: מִבְּחֻרָיו
  choice: tangu ujana wake
  rationale: Katika muktadha huu, kifungu kinaweza kueleza kwamba Yoshua alikuwa amemsaidia Musa tangu ujana wake. Kwa kuwa umbo la Kiebrania ni fupi na linaweza pia kueleweka kuwa linamhusisha Yoshua na vijana au wateule wa Musa, uwezekano huo umehifadhiwa katika tanbihi.
- source_word: אֲדֹנִי מֹשֶׁה
  choice: Bwana wangu Musa
  rationale: Hii ni kauli ya heshima kwa mkuu wa kibinadamu. Kutajwa kwa Musa waziwazi kunazuia isieleweke kuwa jina la Mungu.
- source_word: כְּלָאֵם
  choice: wazuie
  rationale: Kitenzi כלא kinaweza kumaanisha kuzuia, kushikilia au kukataza. “Wazuie” kinaonyesha ombi la Yoshua la kuwafanya wasiendelee bila kubainisha njia ambayo Musa angeitumia.
theological_decisions:
- issue: Uhusiano wa Yoshua na Musa katika kifungu מִבְּחֻרָיו
  choice: tangu ujana wake
  alternative: mmoja wa vijana wake; mmoja wa wateule wake
  rationale: Maandishi ya Kiebrania yana ufupi na utata wa kileksia. Tafsiri kuu inafuata maana inayowezekana ya kipindi cha ujana, huku tanbihi ikihifadhi maana nyingine badala ya kuamua kimyakimya hadhi maalumu ya Yoshua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Msaidizi” ni wazi kwa wasomaji wa kawaida; “Bwana wangu” huhifadhi heshima ya Yoshua kwa Musa. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika moja kwa moja.
