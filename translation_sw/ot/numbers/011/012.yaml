base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/012.yaml
  text: Did I conceive all this people? Did I give birth to him[a], that you should say to me, ‘Carry him in your bosom[b], as a guardian carries a nursing child,’ to the land that you swore to his fathers?
translation:
  language: sw
  text: Je, mimi nimewachukua mimba watu hawa wote? Je, mimi nimewazaa, hata uniambie, ‘Wabebe kifuani mwako, kama mlezi anavyombeba mtoto anayenyonya,’ hadi nchi uliyowaapia mababu zao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinatumia viwakilishi vya umoja: “nimemzaa,” “mbebe,” na “mababu zake,” kikiwachukulia watu wote kama mtoto mmoja. Kiswahili kimetumia wingi kwa upatanisho wa kawaida wa kisarufi.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶאָנֹכִי הָרִיתִי
  choice: Je, ni mimi niliyewachukua mimba
  rationale: Muundo huu unaendeleza swali la balagha lenye msisitizo juu ya Musa na kuhifadhi sitiari ya uzazi ya kitenzi הרה.
- source_word: כָּל הָעָם הַזֶּה
  choice: watu hawa wote
  rationale: Katika Kiswahili cha kawaida, nomino ya mkusanyiko עָם hutolewa kwa wingi kama ‘watu hawa wote’; ‘watu huyu wote’ isingekuwa sahihi wala ya asili.
- source_word: אִם אָנֹכִי יְלִדְתִּיהוּ
  choice: Je, ni mimi niliyewazaa
  rationale: Kitenzi ילד kinaendeleza picha ya kujifungua. Kiambishi cha wingi kinaafikiana kiasili na ‘watu hawa wote,’ ingawa Kiebrania kinawachukulia kwa umoja wa mkusanyiko.
- source_word: שָׂאֵהוּ בְחֵיקֶךָ
  choice: Wabebe kifuani mwako
  rationale: ‘Beba’ ni maana ya kawaida ya נשא katika picha hii, na ‘kifuani mwako’ huhifadhi taswira halisi ya חֵיק bila kuwa ya kizamani.
- source_word: הָאֹמֵן
  choice: mlezi
  rationale: Neno hili humaanisha mtu anayemtunza mtoto. ‘Mlezi’ ni pana, la asili, na halibainishi isivyofaa kwamba huyo ni mama anayemnyonyesha.
- source_word: הַיֹּנֵק
  choice: mtoto anayenyonya
  rationale: Tafsiri hii inaonyesha wazi kwamba מדובר mtoto ambaye bado yuko katika umri wa kunyonya.
- source_word: עַל הָאֲדָמָה
  choice: mpaka nchi
  rationale: Katika muktadha wa kubebwa kuelekea mahali palipoahidiwa, עַל inaeleza kikomo cha safari; ‘mpaka nchi’ ni Kiswahili cha asili.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתָיו
  choice: uliyowaapia mababu zao
  rationale: ‘Waapia’ huhifadhi wazo la kiapo katika שׁבע, na ‘mababu’ hueleza אבות kwa uwazi katika muktadha wa agano.
theological_decisions:
- issue: Marejeo ya umoja kwa Israeli kama jamii moja
  choice: Kutumia viambishi vya wingi vinavyodaiwa na sarufi ya Kiswahili, huku tanbihi ikihifadhi umoja wa Kiebrania
  alternative: Kutumia marejeo ya umoja kama ‘huyo’ na ‘wake’
  rationale: Kiebrania kinatumia עָם kama nomino ya mkusanyiko na viambishi vya umoja, hivyo Israeli inaonyeshwa kama mtoto mmoja. Kiswahili cha kawaida huhitaji upatanisho wa wingi baada ya ‘watu hawa wote’; tanbihi inalinda picha ya asili bila kuharibu sarufi.
- issue: Utambulisho wa הָאֹמֵן
  choice: mlezi
  alternative: mtunzaji wa mtoto; yaya
  rationale: Neno la Kiebrania linaweza kumaanisha mlezi wa mtoto na halihitaji kutafsiriwa kama mwanamke anayemnyonyesha. ‘Mlezi’ huhifadhi upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Maswali ya balagha na sitiari ya Musa kama mama aliyebeba mimba na kuzaa zimehifadhiwa. Upatanisho wa wingi umetumiwa kwa ufasaha wa Kiswahili, huku umoja wa mkusanyiko wa Kiebrania ukielezwa katika tanbihi.
