base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/024.yaml
  text: So Moses went out and spoke to the people the words of Yahweh[b][a]. He gathered seventy men from the elders of the people and stationed them around the tent.
translation:
  language: sw
  text: Basi Musa akatoka na kuwaambia watu maneno ya Yahwe. Akakusanya wanaume sabini kutoka miongoni mwa wazee wa watu, akawasimamisha[a] kuizunguka hema[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akawaweka” au “akawafanya wasimame.” Kwa maana halisi, kitenzi cha Kiebrania ni “aliwafanya wasimame.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “hema.” Inaelekea kwamba muktadha unarejelea hema la kukutania.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi יצא kinaonyesha kutoka mahali alipokuwa; “akatoka” ni cha kawaida na kinaendeleza simulizi kwa ufasaha.
- source_word: וַיְדַבֵּר אֶל־הָעָם אֵת דִּבְרֵי יְהוָה
  choice: na kuwaambia watu maneno ya Yahwe
  rationale: “Kuwaambia” huwasilisha kwa Kiswahili cha kawaida tendo la kusema kwa watu, huku “maneno ya Yahwe” kikidumisha usemi halisi wa Kiebrania badala ya kuupanua kuwa “ujumbe.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni umbo la kawaida la Kiswahili la jina la Mungu יהוה, badala ya kulibadili kuwa cheo.
- source_word: וַיֶּאֱסֹף
  choice: akakusanya
  rationale: אסף hapa humaanisha kuwakusanya watu pamoja; “akakusanya” ni sahihi na ya kawaida katika muktadha huu.
- source_word: שִׁבְעִים אִישׁ
  choice: wanaume sabini
  rationale: אִישׁ hapa inawahusu wanaume, na muktadha unawatambulisha kuwa wazee wa watu; tafsiri inadumisha jinsia iliyo wazi katika matini.
- source_word: מִזִּקְנֵי הָעָם
  choice: kutoka miongoni mwa wazee wa watu
  rationale: Kirai hiki kina maana ya kuchagua baadhi kutoka katika kundi la wazee wanaotambulika katika jamii; “kutoka miongoni mwa” huonyesha wazi maana hiyo ya kigawanyiko.
- source_word: וַיַּעֲמֵד אֹתָם
  choice: akawasimamisha
  rationale: Umbo la Hifili la עמד lina maana ya kusababisha wasimame au kuwaweka mahali; “akawasimamisha” huhifadhi maana hiyo ya kisababishi bila kuficha tendo lenyewe.
- source_word: סְבִיבֹת הָאֹהֶל
  choice: kuizunguka hema
  rationale: סְבִיבֹת humaanisha kuzunguka, na הָאֹהֶל ni “hema.” Tafsiri haiongezi “ya kukutania,” kwa kuwa maneno hayo hayapo katika mstari huu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ina jina binafsi יהוה, si cheo אֲדֹנָי. Kutumia “Yahwe” huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Jinsia katika שִׁבְעִים אִישׁ
  choice: wanaume sabini
  alternative: watu sabini
  rationale: Neno אִישׁ ni la kiume, na katika muktadha hawa ni wanaume waliochaguliwa kutoka miongoni mwa wazee; kwa hiyo jinsia haijaondolewa.
- issue: Utambulisho wa הָאֹהֶל
  choice: hema
  alternative: hema la kukutania
  rationale: Ingawa muktadha unaelekea kuonyesha hema la kukutania, matini ya mstari huu inasema tu “hema.” Tafsiri inadumisha ufupi huo, na maelezo ya muktadha yanawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa masimulizi umetumia viambishi vya mfululizo “aka-”. “Yahwe” limetumika kama umbo la Kiswahili la jina la Mungu, na sentensi imehifadhi “maneno ya Yahwe” pamoja na “hema” bila upanuzi wa kifafanuzi katika matini kuu.
