  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֵּ֨רֶד יְהוָ֥ה בֶּ/עָנָן֮ וַ/יְדַבֵּ֣ר אֵלָי/ו֒ וַ/יָּ֗אצֶל מִן הָ/ר֨וּחַ֙ אֲשֶׁ֣ר עָלָ֔י/ו וַ/יִּתֵּ֕ן עַל שִׁבְעִ֥ים אִ֖ישׁ הַ/זְּקֵנִ֑ים וַ/יְהִ֗י כְּ/נ֤וֹחַ עֲלֵי/הֶם֙ הָ/ר֔וּחַ וַ/יִּֽתְנַבְּא֖וּ וְ/לֹ֥א יָסָֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/025.yaml
  text: Then Yahweh came down in the cloud and spoke to him[a], and he took some of the Spirit that was on him and put it on the seventy elders. And when the Spirit rested on them, they prophesied, but they did not continue.
translation:
  language: sw
  text: Ndipo Yahwe akashuka katika lile wingu, akazungumza na Musa. Akatwaa sehemu ya Roho aliyekuwa juu yake, akaiweka juu ya wale wanaume sabini, yaani wazee. Roho alipokaa juu yao, wakanena kwa unabii, lakini hawakuendelea kufanya hivyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuacha.” Usemi wa Kiebrania ni mfupi na umeeleweka kwa zaidi ya njia moja.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: Huhifadhi wazi mwendo wa kushuka na lugha ya kujidhihirisha kwa Mungu iliyo katika Kiebrania.
- source_word: בֶּעָנָן
  choice: katika lile wingu
  rationale: Kiambishi cha uainisho katika Kiebrania kinaelekeza kwenye wingu maalumu la uwepo wa Mungu linalojulikana katika muktadha.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: na kusema na Musa
  rationale: Jina “Musa” linawekwa wazi kwa Kiswahili cha kawaida ili kuepuka utata wa kiwakilishi bila kubadili mhusika wa muktadha.
- source_word: וַיָּאצֶל מִן הָרוּחַ אֲשֶׁר עָלָיו
  choice: Akatwaa sehemu ya Roho aliyekuwa juu yake
  rationale: “Akatwaa sehemu ya” huwasilisha kugawa kutoka kwa Roho bila kudokeza kwamba Roho alipungukiwa; “juu yake” huhifadhi taswira ya chanzo.
- source_word: רוּחַ
  choice: Roho
  rationale: Muktadha wa kuwawezesha wazee kunena kwa unabii unaonyesha kuwa anayerejelewa ni Roho wa Mungu, si upepo wala hali ya ndani ya mwanadamu.
- source_word: וַיִּתֵּן עַל
  choice: akaiweka juu ya
  rationale: Huhifadhi taswira ya Kiebrania ya Roho kuwekwa na kukaa juu ya watu.
- source_word: שִׁבְעִים אִישׁ הַזְּקֵנִים
  choice: wale wazee sabini
  rationale: Ni Kiswahili cha kawaida na sahihi kwa kundi lililotajwa; neno “wazee” katika muktadha huu linamaanisha wanaume wenye nafasi hiyo.
- source_word: כְּנוֹחַ עֲלֵיהֶם הָרוּחַ
  choice: Roho alipokaa juu yao
  rationale: Huhifadhi picha ya Roho kukaa juu yao na hutumia muundo wa Kiswahili unaomchukulia Roho kama mtendaji binafsi.
- source_word: וַיִּתְנַבְּאוּ
  choice: wakanena kwa unabii
  rationale: Hueleza shughuli ya kinabii bila kuifanya ionekane kuwa kutabiri matukio yajayo tu.
- source_word: וְלֹא יָסָפוּ
  choice: lakini hawakuendelea kufanya hivyo
  rationale: Hutoa maana ya kimuktadha kwamba tendo hilo halikuendelea, huku usomaji mwingine wa usemi huu mfupi ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Iwapo רוּחַ inarejelea Roho wa Mungu au roho kwa maana nyingine
  choice: Roho wa Mungu, kwa kuandika “Roho”
  alternative: roho
  rationale: Roho aliyekuwa juu ya Musa anawekwa juu ya wazee na kuwapa uwezo wa kunena kwa unabii; muktadha huo unaunga mkono rejeo kwa Roho wa Mungu.
- issue: Maana ya וְלֹא יָסָפוּ
  choice: hawakuendelea kufanya hivyo
  alternative: hawakuacha
  rationale: Usemi wa Kiebrania ni mfupi na unaweza kueleweka kwa zaidi ya njia moja. Maana ya kwamba hawakuendelea ndiyo inayolingana vizuri na muktadha, lakini maana nyingine halisi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo “wakanena kwa unabii” umechaguliwa badala ya “wakatabiri” ili kuepuka kuzuia maana kwenye kutangaza mambo yajayo pekee. Alama ya tanbihi imewekwa kwenye kishazi kinachohusika na utata.
