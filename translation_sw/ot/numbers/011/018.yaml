  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְ/מָחָר֮ וַ/אֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּ/אָזְנֵ֨י יְהוָ֜ה לֵ/אמֹ֗ר מִ֤י יַאֲכִלֵ֨/נוּ֙ בָּשָׂ֔ר כִּי ט֥וֹב לָ֖/נוּ בְּ/מִצְרָ֑יִם וְ/נָתַ֨ן יְהוָ֥ה לָ/כֶ֛ם בָּשָׂ֖ר וַ/אֲכַלְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/018.yaml
  text: And to the people you shall say[a], ‘Consecrate yourselves for tomorrow, and you shall eat meat, because you have wept in the hearing of Yahweh, saying, “Who will feed us meat? For it was good for us in Egypt.” And Yahweh will give you meat, and you shall eat.”
translation:
  language: sw
  text: Nawe utawaambia watu, “Jitakaseni[a] kwa ajili ya kesho, nanyi mtakula nyama, kwa kuwa mlilia masikioni mwa Yahwe, mkisema, ‘Nani atatulisha nyama? Maana ilikuwa vema kwetu huko Misri.’ Naye Yahwe atawapa nyama, nanyi mtakula.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jiwekeni wakfu kwa ajili ya kesho.” Kitenzi cha Kiebrania kina maana ya kujitenga na kujiandaa kwa tendo la Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּאמַר
  choice: utawaambia
  rationale: Kauli ya wakati usiotimilika, nafsi ya pili umoja, ina nguvu ya agizo kwa Musa; ‘utawaambia’ huhifadhi muundo huo kwa Kiswahili cha kawaida.
- source_word: הִתְקַדְּשׁוּ
  choice: Jitakaseni
  rationale: Amri ya Hitpael kutoka קדשׁ inaeleza kujiweka katika hali ya utakatifu au kujitenga kwa maandalizi ya tendo la Mungu; ‘Jitakaseni’ huhifadhi uzito wake wa kidini.
- source_word: לְמָחָר
  choice: kwa ajili ya kesho
  rationale: Kihusishi kinaonyesha maandalizi yanayolenga siku inayofuata; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: וַאֲכַלְתֶּם בָּשָׂר
  choice: nanyi mtakula nyama
  rationale: בָּשָׂר hapa ni nyama ya kuliwa, na kitenzi kinachoifuata amri kina maana ya matokeo ya wakati ujao.
- source_word: בְּכִיתֶם
  choice: mmelia
  rationale: Qatal inaelekeza kwenye tendo lililotangulia ambalo ndilo sababu ya jibu linalofuata; hali timilifu ya Kiswahili huonyesha uhusiano huo.
- source_word: בְּאָזְנֵי יְהוָה
  choice: Yahwe amewasikia mkilia
  rationale: Hii ni nahau inayomaanisha kwamba kilio chao kilifika masikioni mwa Yahwe. Tafsiri hii ni ya asili katika Kiswahili huku ikihifadhi wazo la kusikiwa.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Nani atatulisha nyama?
  rationale: Hiphil ya אכל ina maana ya kusababisha kula au kulisha; ‘atatulisha’ huhifadhi maana hiyo ya kisababishi kwa ufupi.
- source_word: כִּי טוֹב לָנוּ בְּמִצְרָיִם
  choice: Maana ilikuwa vema kwetu huko Misri
  rationale: Tafsiri hii inabaki karibu na tamko la Kiebrania bila kuingiza ulinganisho wa ‘tulikuwa na hali bora,’ ambao haujaelezwa moja kwa moja.
- source_word: וְנָתַן יְהוָה לָכֶם בָּשָׂר
  choice: Naye Yahwe atawapa nyama
  rationale: ‘Naye’ huendeleza kiunganishi rahisi cha Kiebrania bila kuongeza neno la wazi la kisababishi kama ‘kwa hiyo,’ ingawa uhusiano wa kimuktadha unabaki dhahiri.
- source_word: וַאֲכַלְתֶּם
  choice: nanyi mtakula
  rationale: Marudio ya chanzo yamehifadhiwa kwa ajili ya msisitizo na nguvu ya usemi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia Tetragramatoni, jina binafsi la Mungu. ‘Yahwe’ ni umbo linalofaa katika tahajia ya Kiswahili na hulihifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya agizo הִתְקַדְּשׁוּ
  choice: Jitakaseni
  alternative: Jiandaeni
  rationale: Agizo lina uzito wa kidini wa kujiweka wakfu au kujitenga kwa ajili ya tendo la Yahwe, si maandalizi ya kawaida tu; tanbihi inahifadhi njia nyingine ya kulieleza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. ‘Yahwe’ limetumiwa kwa tahajia ya Kiswahili. Nahau ya Kiebrania ‘masikioni mwa Yahwe’ imetolewa kwa usemi wa asili ‘Yahwe amewasikia,’ huku taswira ya kusikia ikihifadhiwa.
