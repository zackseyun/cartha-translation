  yaml_path: translation/ot/numbers/011/003.yaml
  text: So he called the name of that place Taberah[a], because the fire of Yahweh burned among them.
translation:
  language: sw
  text: Kwa hiyo akapa mahali hapo jina Tabera[a], kwa sababu moto wa Yahwe uliwaka miongoni mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Tabera linasikika kama neno la Kiebrania linalomaanisha “kuwaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: akapaita mahali pale
  rationale: Katika Kiswahili cha kawaida, kitenzi “kuita” pamoja na mahali huwasilisha kwa uwazi tendo la kupapa jina, bila kuiga kwa ugumu muundo wa Kiebrania “akaliita jina la mahali pale.”
- source_word: תַּבְעֵרָה
  choice: Tabera
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Waswahili; uhusiano wake na mzizi wa Kiebrania unaomaanisha kuwaka umeelezwa katika tanbihi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hutoa maana ya sababu kwa njia ya moja kwa moja na ya kawaida katika Kiswahili cha sasa.
- source_word: בָעֲרָה
  choice: uliwaka
  rationale: “Kuwaka” ndiyo tafsiri ya moja kwa moja ya kitenzi בער katika muktadha wa moto na pia hudumisha mwangwi wa maana ya jina Tabera.
- source_word: בָם
  choice: miongoni mwao
  rationale: Huonyesha kwamba moto ulikuwa katikati ya jamii au kambi, badala ya kudokeza kwamba uliwaka ndani ya miili yao.
- source_word: אֵשׁ יְהוָה
  choice: moto wa Yahwe
  rationale: Hudumisha muundo wa umilikaji wa Kiebrania na jina la agano la Mungu, bila kulipanua kimafasiri kuwa “moto kutoka kwa Yahwe.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja tetragramatoni יְהוָה. “Yahwe” huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo, huku “Yehova” ikiwa tahajia ya baadaye isiyoakisi kwa karibu ushahidi wa matamshi ya jina hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Biblia. “Kwa hiyo” huunganisha mstari na tukio lililotangulia, na “akapaita mahali pale” ni usemi wa asili kuliko kuiga neno kwa neno muundo wa Kiebrania.
