  text: וְ/ר֜וּחַ נָסַ֣ע מֵ/אֵ֣ת יְהוָ֗ה וַ/יָּ֣גָז שַׂלְוִים֮ מִן הַ/יָּם֒ וַ/יִּטֹּ֨שׁ עַל הַֽ/מַּחֲנֶ֜ה כְּ/דֶ֧רֶךְ י֣וֹם כֹּ֗ה וּ/כְ/דֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽ/מַּחֲנֶ֑ה וּ/כְ/אַמָּתַ֖יִם עַל פְּנֵ֥י הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/031.yaml
  text: Then a wind went out from Yahweh and drove quail in from the sea[a], and let them fall beside the camp, about a day’s journey on this side and a day’s journey on that side, all around the camp[b], and about two cubits above the surface of the ground.
translation:
  language: sw
  text: Kisha upepo ukatoka kwa Yahwe, ukaleta kware kutoka baharini[a] na kuwaangusha kandokando ya kambi, wakienea umbali wa mwendo wa siku moja upande huu na mwendo wa siku moja upande ule, pande zote kuizunguka kambi, nao walikuwa karibu dhiraa mbili juu ya uso wa ardhi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho ikatoka kwa Yahwe”; neno la Kiebrania linaweza kumaanisha “upepo” au “roho,” lakini hapa muktadha unapendelea “upepo” kwa kuwa unawaleta kware kutoka baharini.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “karibu dhiraa mbili juu ya uso wa ardhi.” Huenda kauli hii inaeleza kiwango ambacho kware walitandazwa au waliruka, wala si kina cha tabaka lao ardhini.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְר֜וּחַ
  choice: upepo
  rationale: רוּחַ linaweza kumaanisha upepo, pumzi, au roho; hapa kitendo cha kuwaleta kware kutoka baharini kinaunga mkono maana ya upepo.
- source_word: נָסַע מֵאֵת יְהוָה
  choice: ukatoka kwa Yahwe
  rationale: Kauli hii inaonyesha kwamba upepo ulianzia kwa Yahwe, huku Kiswahili hiki kikibaki cha kawaida na kisichofafanua kupita maandishi utaratibu wa tendo hilo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וַיָּגָז שַׂלְוִים
  choice: ukaleta kware
  rationale: Kitenzi גוז ni nadra na hapa kinaeleza upepo ukiwaleta kware kutoka baharini; 'ukaleta' ni wazi na cha asili bila kulazimisha kiwango cha nguvu ambacho kitenzi hakihakikishi kabisa.
- source_word: וַיִּטֹּשׁ עַל הַמַּחֲנֶה
  choice: na kuwaangusha kandokando ya kambi
  rationale: נטשׁ hapa inaweza kueleza kutawanya, kutupa, au kuacha. 'Kuwaangusha kandokando' linaonyesha kuwekwa kwa ndege katika eneo linalozunguka kambi bila kudai kwamba walianguka juu ya mahema.
- source_word: כְּדֶרֶךְ יוֹם כֹּה וּכְדֶרֶךְ יוֹם כֹּה סְבִיבוֹת הַמַּחֲנֶה
  choice: wakienea umbali wa mwendo wa siku moja upande huu na mwendo wa siku moja upande ule, kuizunguka kambi yote
  rationale: Tafsiri inadumisha urudiaji wa Kiebrania na wakati huohuo inaeleza kwamba kipimo kinahusu eneo lililozunguka kambi.
- source_word: וּכְאַמָּתַיִם עַל פְּנֵי הָאָרֶץ
  choice: karibu dhiraa mbili juu ya uso wa ardhi
  rationale: כְּ inaonyesha makadirio; 'dhiraa' huhifadhi kipimo cha kale, na 'juu ya uso wa ardhi' hudumisha uwezekano kwamba kauli hiyo inaeleza kimo cha ndege.
theological_decisions:
- issue: Uhusiano wa upepo na Yahwe
  choice: Upepo unatoka kwa Yahwe na ndio unaowaleta kware.
  alternative: Kauli inaweza kutafsiriwa kwa nguvu zaidi kuwa Yahwe aliwaleta kware kwa kutumia upepo.
  rationale: Kiebrania kinataja wazi chanzo cha upepo bila kufafanua zaidi namna ambavyo usababishaji wa Mungu na njia ya kiasili vinahusiana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo unahifadhi vipimo vya kale na utata halisi wa רוּחַ pamoja na kauli ya mwisho kuhusu dhiraa mbili.
