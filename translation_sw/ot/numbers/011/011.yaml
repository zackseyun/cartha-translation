base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/011.yaml
  text: And Moses said to Yahweh[a], “Why have you treated your servant badly? And why have I not found favor in your eyes[c][b], that you have laid the burden of all this people on me?”
translation:
  language: sw
  text: Musa akamwambia Yahwe, “Kwa nini umenitendea vibaya mimi, mtumishi wako?[a] Na kwa nini sijapata kibali machoni pako,[b] hata ukanitwika mzigo wa watu hawa wote?[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umenitendea jambo baya mimi, mtumishi wako?” Kitenzi cha Kiebrania, kwa maana ya moja kwa moja zaidi, ni “kutenda baya/uovu,” kikionyesha uzito wa malalamiko ya Musa.
    reason: lexical_alternative
  - marker: b
    text: “Kupata kibali machoni pako” ni nahau ya Kiebrania yenye maana ya kukubaliwa au kupata kibali kwa mtu.
    reason: cultural_note
  - marker: c
    text: Kiebrania kinasema kwa maana ya moja kwa moja, “watu hawa wote,” huku neno “watu” likiwa nomino ya umoja yenye maana ya mkusanyiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: הֲרֵעֹתָ
  choice: umemtendea vibaya
  rationale: Kauli hii inaonyesha malalamiko makali ya Musa kwamba ametendewa jambo baya; ni ya kawaida kwa Kiswahili na haifichi uzito wa kitenzi cha Kiebrania.
- source_word: לְעַבְדֶּךָ
  choice: mtumishi wako
  rationale: Katika mazungumzo na Mungu, neno hili ni namna ya Musa kujitaja kwa unyenyekevu; ‘mtumishi’ linafaa zaidi hapa kuliko ‘mtumwa’.
- source_word: מָצָתִי חֵן בְּעֵינֶיךָ
  choice: sijapata kibali machoni pako
  rationale: Hifadhi ya nahau ya Kiebrania inaonyesha kupokelewa kwa wema na kibali cha mtu, huku ikieleweka katika Kiswahili.
- source_word: לָשׂוּם אֶת מַשָּׂא ... עָלָי
  choice: ukanitwika mzigo
  rationale: ‘Kunitwika’ huwasilisha kwa kawaida kitendo cha kuweka mzigo juu ya Musa na kudumisha sitiari ya maandishi ya asili.
- source_word: כָּל הָעָם הַזֶּה
  choice: watu hawa wote
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza kundi lote linalokusudiwa, ingawa Kiebrania hutumia nomino ya umoja yenye maana ya mkusanyiko.
theological_decisions:
- issue: Kitenzi הֲרֵעֹתָ kinapotumiwa Mungu akiwa mtendaji
  choice: umemtendea vibaya
  alternative: umemtendea maovu
  rationale: Tafsiri iliyochaguliwa inadumisha malalamiko ya Musa kuhusu kutendewa vibaya bila kuamua kwamba simulizi lenyewe linamtuhumu Mungu kuwa na uovu wa kimaadili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa msomaji wa kawaida. ‘Akamwambia’ huhifadhi mwendelezo wa simulizi; maswali na ‘hata ukanitwika’ yanaendeleza sauti ya malalamiko makali ya Musa.
