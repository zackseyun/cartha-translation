  text: הַ/בָּשָׂ֗ר עוֹדֶ֨/נּוּ֙ בֵּ֣ין שִׁנֵּי/הֶ֔ם טֶ֖רֶם יִכָּרֵ֑ת וְ/אַ֤ף יְהוָה֙ חָרָ֣ה בָ/עָ֔ם וַ/יַּ֤ךְ יְהוָה֙ בָּ/עָ֔ם מַכָּ֖ה רַבָּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/033.yaml
  text: While the meat was still between their teeth[a], before it was consumed, Yahweh’s anger burned against the people, and Yahweh struck the people with a very severe plague.
translation:
  language: sw
  text: Nyama ikiwa bado kati ya meno yao, kabla haijaisha[a], hasira ya Yahweh ikawaka dhidi ya watu, naye Yahweh akawapiga watu kwa tauni kali sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “kabla haijakatiliwa mbali”—yaani, kabla nyama haijamalizika au kuliwa yote.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּשָׂר
  choice: nyama
  rationale: Katika muktadha wa kware wanaoliwa, neno hili linamaanisha nyama inayotumiwa kama chakula.
- source_word: עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם
  choice: ilipokuwa bado katikati ya meno yao
  rationale: Huhifadhi picha halisi ya nyama ambayo haikuwa imemezwa bado na ni Kiswahili cha kawaida.
- source_word: טֶרֶם יִכָּרֵת
  choice: kabla haijaisha
  rationale: כרת katika Nifali humaanisha kihalisi ‘kukatiliwa mbali’; katika muktadha huu usemi unaelekea kumaanisha kwamba nyama haikuwa imekwisha kuliwa. Tanbihi huhifadhi maana halisi yenye utata.
- source_word: וְאַף יְהוָה חָרָה
  choice: hasira ya Yahweh ikawaka
  rationale: Huhifadhi sitiari ya Kiebrania ya hasira inayowaka badala ya kuifanya kuwa kauli tambarare tu.
- source_word: וַיַּךְ
  choice: akawapiga
  rationale: Kitenzi hiki katika muktadha wa hukumu humaanisha kupiga au kuleta pigo; ‘akawapiga’ huhifadhi nguvu ya tendo hilo.
- source_word: מַכָּה רַבָּה מְאֹד
  choice: kwa tauni kali sana
  rationale: מַכָּה hapa ni pigo la maangamizi lililowapata watu wengi; ‘tauni kali sana’ ni ya asili na huwasilisha ukubwa uliosisitizwa na רַבָּה מְאֹד.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la agano, si cheo; unukuzi ‘Yahweh’ hulitofautisha na neno la kawaida la ‘Bwana’.
- issue: Usemi wa hasira ya Mungu kwa lugha ya kibinadamu
  choice: hasira ya Yahweh ikawaka
  alternative: Yahweh akawakasirikia watu
  rationale: Uchaguzi huu huhifadhi sitiari ya chanzo חרה אף na uzito wa hukumu bila kuupunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umewekwa wazi kwa wasomaji wa kawaida huku picha na mkazo wa Kiebrania vikihifadhiwa.
