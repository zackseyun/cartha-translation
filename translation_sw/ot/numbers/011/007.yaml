  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha ulinganisho maradufu wa Kiebrania, huku “mwonekano” ukitumiwa badala ya tafsiri halisi “jicho.” Tanbihi imewekwa baada ya “bedola,” neno linalohitaji ufafanuzi.
