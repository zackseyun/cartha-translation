base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/007.yaml
  text: The manna was like coriander seed[a], and its appearance was like the appearance of bdellium.
translation:
  language: sw
  text: Mana ilikuwa kama mbegu ya giligilani, na mwonekano wake ulikuwa kama mwonekano wa bedola.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bedola huenda ni utomvu au gundi yenye harufu nzuri; hata hivyo, utambulisho kamili wa neno la Kiebrania hauna uhakika, na wengine hulielewa kuwa kitu kinachofanana na jiwe la thamani, kama lulu au fuwele.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּן
  choice: Mana
  rationale: Nomino yenye kibainishi inarejelea chakula kile kilichojulikana cha jangwani. Katika Kiswahili, jina maalumu “mana” halihitaji kibainishi tofauti.
- source_word: כִּזְרַע גַּד
  choice: kama mbegu ya giligilani
  rationale: Kiambishi כִּ kinaonyesha ulinganisho, na גַּד kwa kawaida hutambuliwa kuwa giligilani. Tafsiri hii ni wazi na ya kawaida kwa msomaji wa Kiswahili.
- source_word: וְעֵינוֹ
  choice: na mwonekano wake
  rationale: Ingawa עַיִן kimsingi humaanisha “jicho,” katika usemi huu inamaanisha sura inayoonekana. “Mwonekano wake” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: כְּעֵין
  choice: ulikuwa kama mwonekano wa
  rationale: Kurudiwa kwa neno עַיִן kunadumisha ulinganisho wa kile kinachoonekana. Kurudia “mwonekano” kunahifadhi sambamba ya Kiebrania bila kuifanya sentensi kuwa isiyo ya kawaida.
- source_word: הַבְּדֹלַח
  choice: bedola
  rationale: “Bedola” ni uhamishaji wa istilahi ya Kiebrania ambayo utambulisho wake kamili hauna uhakika. Kuihifadhi katika maandishi na kuifafanua katika tanbihi huepuka kuchagua kimya kimya kati ya utomvu wenye harufu nzuri na kitu kinachofanana na jiwe la thamani.
