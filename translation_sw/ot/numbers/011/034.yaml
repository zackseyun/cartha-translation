  yaml_path: translation/ot/numbers/011/034.yaml
  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
translation:
  language: sw
  text: Basi akapaita mahali pale Kibroth-hataava[a], kwa sababu huko waliwazika watu waliotamani kwa uchu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda Kibroth-hataava linamaanisha “Makaburi ya Tamaa” au “Makaburi ya Uchu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: Basi akapaita mahali pale
  rationale: Muundo wa Kiswahili “akapaita mahali pale” unawasilisha kwa kawaida fomula ya Kiebrania ya kuita jina la mahali, huku “Basi” na kiambishi -ka- vikihifadhi mfuatano wa simulizi.
- source_word: קִבְרוֹת הַתַּאֲוָה
  choice: Kibroth-hataava
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa katika matini kuu; maana yake inayowezekana imeelezwa katika tanbihi.
- source_word: כִּי שָׁם
  choice: kwa sababu huko
  rationale: כִּי inatoa sababu ya jina hilo, na שָׁם ni kielezi cha mahali kinachowakilishwa kwa kawaida na “huko.”
- source_word: קָבְרוּ אֶת הָעָם
  choice: waliwazika watu
  rationale: Kitenzi cha wingi hakitaji mtendaji kwa jina; “watu” linaonyesha kundi husika katika muktadha.
- source_word: הַמִּתְאַוִּים
  choice: waliotamani kwa pupa
  rationale: Kitenzi hiki kinaonyesha tamaa yenye nguvu au ya uchu. “Kwa pupa” huzuia “kutamani” kueleweka kama hamu ya kawaida bila kuibana kwa maana ya kingono.
