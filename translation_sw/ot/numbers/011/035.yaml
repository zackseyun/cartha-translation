base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/035.yaml
  text: From Kibroth-hattaavah the people set out for Hazeroth[a], and they stayed at Hazeroth.
translation:
  language: sw
  text: Kutoka Kibroth-Hataava[a] watu waliondoka kuelekea Haserothi, wakakaa huko Haserothi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kibroth-Hataava maana yake ni “makaburi ya tamaa” au “makaburi ya uchu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/קִּבְר֧וֹת הַֽתַּאֲוָ֛ה
  choice: Kutoka Kibroth-Hataava
  rationale: Ni jina la mahali linalotokana na maneno ya kawaida yenye maana ya ‘makaburi ya tamaa.’ Katika simulizi linafanya kazi kama jina maalumu, hivyo limetoholewa, huku maana yake ikihifadhiwa katika tanbihi.
- source_word: נָסְע֥וּ
  choice: waliondoka kuelekea
  rationale: Katika masimulizi ya safari, kitenzi hiki humaanisha kuvunja kambi na kuanza safari. ‘Waliondoka kuelekea’ ni Kiswahili cha kawaida kinachoonyesha kuondoka na mahali walikokwenda.
- source_word: הָ/עָ֖ם
  choice: watu
  rationale: Hapa neno hili linamaanisha jumuiya ya Waisraeli kwa ujumla; ‘watu’ ni tafsiri ya kawaida na ya asili katika muktadha huu.
- source_word: חֲצֵר֑וֹת
  choice: Haserothi
  rationale: Ni jina maalumu la mahali, hivyo limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: וַ/יִּהְי֖וּ בַּ/חֲצֵרֽוֹת
  choice: wakakaa huko Haserothi
  rationale: Kifungu hiki kwa neno kwa neno ni ‘wakawa Haserothi,’ lakini katika muktadha wa ratiba ya safari kinaonyesha kusimama na kukaa mahali. ‘Wakakaa huko’ ni cha asili na hakiongezi muda usiotajwa.
