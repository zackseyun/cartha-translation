base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/014.yaml
  text: I am not able, I alone, to carry all this people, because it is too heavy for me.
translation:
  language: sw
  text: Mimi peke yangu siwezi kuwabeba watu hawa wote, kwa maana mzigo huu ni mzito mno kwangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אוּכַל אָנֹכִי לְבַדִּי
  choice: Mimi peke yangu siwezi
  rationale: Huhifadhi msisitizo wa kiwakilishi אָנֹכִי pamoja na לְבַדִּי kwa Kiswahili cha kawaida na chenye nguvu.
- source_word: לָשֵׂאת אֶת כָּל הָעָם הַזֶּה
  choice: kuwabeba watu hawa wote
  rationale: Kitenzi נָשָׂא kimetafsiriwa kwa maana yake ya sitiari ya kubeba jukumu la kuwaongoza na kuwajibikia watu, huku taswira ya kubeba ikihifadhiwa.
- source_word: כִּי כָבֵד מִמֶּנִּי
  choice: kwa maana mzigo huu ni mzito mno kwangu
  rationale: Kauli ya Kiebrania inaeleza kuwa jambo hilo ni zito kupita uwezo wa Musa; neno 'mzigo' linaweka wazi rejeo la kisarufi linaloeleweka kutokana na kitenzi 'kuwabeba'.
theological_decisions:
- issue: Je, maneno ya Musa yaelezwe kama udhaifu wa kiroho au kama kutoweza kubeba jukumu peke yake?
  choice: Kauli imeachwa kuwa ungamo la kutoweza kubeba watu peke yake.
  alternative: Kuiongeza lugha ya kushindwa kiroho au kukosa imani.
  rationale: Andiko lenyewe linasisitiza uzito wa jukumu na upweke wa Musa, bila kutoa hapa hukumu ya wazi kuhusu hali yake ya kiroho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio 'Mimi peke yangu' unahifadhi msisitizo wa Kiebrania bila kuwa mgumu; 'mzigo huu' hutengeneza Kiswahili asilia na kuendeleza sitiari ya kubeba.
