id: NUM.11.23
reference: Numbers 11:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הֲ/יַ֥ד יְהוָ֖ה תִּקְצָ֑ר עַתָּ֥ה תִרְאֶ֛ה הֲ/יִקְרְ/ךָ֥ דְבָרִ֖/י אִם לֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/023.yaml
  text: And Yahweh said to Moses[b][a], “Has Yahweh’s hand become short? Now you will see whether my word will happen for you or not.”
translation:
  language: sw
  text: Yahwe akamwambia Musa, “Je, mkono wa Yahwe umekuwa mfupi?[a] Sasa utaona kama neno langu litatimia kwako au la.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “Je, mkono wa Yahwe umekuwa mfupi?” Huu ni msemo unaomaanisha, “Je, uwezo wa Yahwe umekuwa na kikomo?”
    reason: cultural_note
  - marker: b
    text: Au “kama yale niliyosema yatakupata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kulibadilisha kuwa cheo.
- source_word: הֲיַד יְהוָה תִּקְצָר
  choice: Je, mkono wa Yahwe umekuwa mfupi?
  rationale: Inahifadhi taswira ya Kiebrania ya ‘mkono’ na kitenzi ‘kuwa mfupi,’ huku tanbihi ikifafanua maana ya uwezo kuwa na kikomo.
- source_word: עַתָּה תִרְאֶה
  choice: Sasa utaona
  rationale: Ni usemi wa moja kwa moja na wa kawaida unaoonyesha uthibitisho unaokaribia.
- source_word: הֲיִקְרְךָ דְבָרִי
  choice: kama neno langu litatimia kwako
  rationale: ‘Litatimia’ huonyesha kutokea kwa yale aliyosema Mungu bila kuondoa kiambishi cha nafsi ya pili kinachowakilishwa na ‘kwako’; tanbihi inaleta uwezekano wa tafsiri ya moja kwa moja zaidi.
- source_word: אִם לֹא
  choice: au la
  rationale: Hukamilisha kwa Kiswahili cha kawaida muundo wa swali usio wa moja kwa moja, ‘kama ... au la.’
theological_decisions:
- issue: Lugha ya kibinadamu inayotumiwa kueleza uwezo wa Mungu
  choice: Kuhifadhi ‘mkono wa Yahwe ... mfupi’
  alternative: Je, uwezo wa Yahwe umekuwa na kikomo?
  rationale: Taswira halisi ya chanzo inadumisha nguvu ya swali la balagha, bila kudai kwamba Mungu ana mwili wa kibinadamu.
- issue: Nguvu ya changamoto ya Mungu kwa Musa
  choice: Swali la balagha kuhusu mkono wa Yahwe kuwa mfupi
  alternative: Je, jambo lolote ni gumu mno kwa Yahwe?
  rationale: Uundaji huu unabaki karibu na maneno ya aya yenyewe na hauingizii kifungu cha andiko jingine.
- issue: Maana ya kutimia kwa neno kwa Musa
  choice: neno langu litatimia kwako
  alternative: yale niliyosema yatakupata
  rationale: ‘Litatimia’ linafaa kwa ahadi iliyotamkwa, huku ‘kwako’ ikihifadhi uhusiano usio wazi kabisa wa kiambishi cha Kiebrania; tanbihi inaonyesha njia nyingine inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha na taswira ya ‘mkono mfupi’ umehifadhiwa; tanbihi zinafafanua msemo na utata wa kitenzi קרה pamoja na kiambishi chake.
