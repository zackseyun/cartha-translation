base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/020.yaml
  text: for a whole month, until it comes out of your nostrils and becomes loathsome to you, because you have rejected Yahweh who is among you and have wept before him, saying, ‘Why did we ever come out of Egypt?’”
translation:
  language: sw
  text: kwa mwezi mzima, mpaka itoke katika mianzi ya pua zenu na kuwa kitu cha kuchukiza kwenu[a], kwa sababu mmemkataa Yahweh aliye miongoni mwenu, na mmelia mbele yake, mkisema, ‘Kwa nini tulitoka Misri?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kuwachukiza” au “na kuwa chukizo kwenu.” Neno la Kiebrania linaonyesha hisia kali ya kuchukizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד חֹדֶשׁ יָמִים
  choice: kwa muda wa mwezi mzima
  rationale: Nahau hii inaonyesha muda kamili wa mwezi; tafsiri hii ni ya kawaida katika Kiswahili na huhifadhi msisitizo wa muda.
- source_word: יֵצֵא מֵאַפְּכֶם
  choice: mpaka iwatoke puani
  rationale: אַף hapa ina maana halisi ya pua; usemi huu unahifadhi picha kali ya Kiebrania kwa lugha ya Kiswahili inayoeleweka.
- source_word: וְהָיָה לָכֶם לְזָרָא
  choice: na kuwa chukizo kwenu
  rationale: זָרָא ni neno adimu linaloonyesha kuchukiza au kuleta kinyaa. ‘Chukizo’ huhifadhi nguvu yake bila kufafanua zaidi ya matini.
- source_word: יַעַן כִּי
  choice: Hii ni kwa sababu
  rationale: Kirai hiki kinatanguliza sababu ya hukumu; muundo huu unaunganisha sentensi kwa uwazi katika Kiswahili.
- source_word: מְאַסְתֶּם
  choice: mmemkataa
  rationale: Kitenzi kinaweza kumaanisha kukataa au kudharau. ‘Mmemkataa’ huhifadhi wazo kuu la kumkataa Yahweh bila kuongeza hisia zisizolazimishwa na muktadha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limewasilishwa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: aliye katikati yenu
  rationale: Kirai hiki kinaeleza uwepo wa Yahweh miongoni mwa jumuiya, si ndani ya kila mtu binafsi.
- source_word: וַתִּבְכּוּ לְפָנָיו
  choice: na mmelia mbele zake
  rationale: Tafsiri hii huhifadhi kitendo cha kulia pamoja na wazo la kufanya hivyo mbele ya Yahweh.
- source_word: לָמָּה זֶּה
  choice: Kwa nini
  rationale: Katika swali hili, muundo wa kawaida wa Kiswahili huwasilisha malalamiko kwa uwazi bila kuongeza neno la msisitizo lisilo lazima.
- source_word: יָצָאנוּ מִמִּצְרָיִם
  choice: tulitoka Misri
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kitendo cha kutoka Misri.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina binafsi la Mungu, יהוה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Picha halisi ya kitu kutoka puani imehifadhiwa kwa sababu ni sehemu muhimu ya ukali wa onyo la Kiebrania.
