  yaml_path: translation/ot/numbers/011/027.yaml
  text: Then a young man ran and told Moses[a], and said, “Eldad and Medad are prophesying in the camp.”
translation:
  language: sw
  text: Kisha kijana mmoja akakimbia, akamjulisha Musa[a], akisema, “Eldadi na Medadi wanatabiri kambini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yule kijana akakimbia na kumpa Musa taarifa.” Kibainishi cha Kiebrania kilicho katika neno “kijana” kinaweza kutafsiriwa kwa karibu zaidi kuwa “yule kijana”; pia kitenzi hiki kinaweza kutafsiriwa “kumpa taarifa” au “kumweleza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: akakimbia
  rationale: Kitenzi רוץ kina maana ya kukimbia; umbo la mfululizo wa simulizi limetafsiriwa kwa ‘aka-’ ili kuhifadhi mwendo wa matukio.
- source_word: הַנַּעַר
  choice: kijana mmoja
  rationale: נַעַר inaweza kumaanisha mvulana au kijana. Katika muktadha huu ni mjumbe asiyepewa jina; ‘kijana mmoja’ ni Kiswahili cha kawaida kinachomtambulisha kwa mara ya kwanza bila kudai umri mahususi zaidi.
- source_word: וַיַּגֵּד לְמֹשֶׁה
  choice: na kumjulisha Musa
  rationale: Hifili ya נגד humaanisha kueleza, kutoa taarifa, au kujulisha. ‘Kumjulisha’ huonyesha wazi kuwa Musa ndiye anayepokea taarifa, huku maneno yanayofuata yakitoa yaliyomo katika taarifa hiyo.
- source_word: וַיֹּאמַר
  choice: akisema
  rationale: אמר huanzisha maneno yaliyonukuliwa. ‘Akisema’ huunganisha taarifa na nukuu kwa njia ya asili katika Kiswahili bila kupoteza mfuatano wa Kiebrania.
- source_word: אֶלְדָּד וּמֵידָד
  choice: Eldadi na Medadi
  rationale: Majina yamenukuliwa kwa maumbo yaliyozoeleka katika Kiswahili, yenye vokali ya mwisho inayorahisisha matamshi.
- source_word: מִתְנַבְּאִים
  choice: wanatoa unabii
  rationale: Kishiriki cha Hitpaeli cha נבא kinaonyesha shughuli ya kinabii inayoendelea. ‘Wanatoa unabii’ ni usemi wa sasa unaoeleweka na huhifadhi maana ya tendo linaloendelea.
- source_word: בַּמַּחֲנֶה
  choice: kambini
  rationale: מַחֲנֶה ni kambi ya Israeli; ‘kambini’ ni tafsiri fupi, ya kawaida, na sahihi ya mahali.
