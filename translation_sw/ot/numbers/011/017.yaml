  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/יָרַדְתִּ֗י וְ/דִבַּרְתִּ֣י עִמְּ/ךָ֮ שָׁם֒ וְ/אָצַלְתִּ֗י מִן הָ/ר֛וּחַ אֲשֶׁ֥ר עָלֶ֖י/ךָ וְ/שַׂמְתִּ֣י עֲלֵי/הֶ֑ם וְ/נָשְׂא֤וּ אִתְּ/ךָ֙ בְּ/מַשָּׂ֣א הָ/עָ֔ם וְ/לֹא תִשָּׂ֥א אַתָּ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/017.yaml
  text: And I will come down and speak with you there[a], and I will take some of the Spirit that is on you and put it on them, and they will bear the burden of the people with you, so that you will not bear it by yourself alone.
translation:
  language: sw
  text: Nami nitashuka na kusema nawe huko. Nitachukua sehemu ya Roho[a] iliyo juu yako na kuiweka juu yao. Nao watabeba pamoja nawe mzigo wa watu, ili usibebe mzigo huo wewe peke yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho.” Neno la Kiebrania רוּחַ linaweza kumaanisha roho, upepo, au pumzi; hapa linarejelea nguvu inayowezesha kutoka kwa Mungu, iliyotolewa kwa Musa kwa ajili ya uongozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתִּי
  choice: nitashuka
  rationale: Kitenzi ירד humaanisha kushuka. Tafsiri hii inadumisha lugha ya Kiebrania inayomweleza Mungu akishuka bila kuifanya kuwa ya kitaaluma.
- source_word: וְדִבַּרְתִּי עִמְּךָ שָׁם
  choice: na kusema nawe huko
  rationale: Neno 'nawe' linaonyesha kusema pamoja na mtu, na 'huko' linahifadhi rejeo la mahali lililo katika maandishi.
- source_word: וְאָצַלְתִּי
  choice: nitachukua sehemu
  rationale: Kitenzi adimu אצל hapa kinaonyesha kuchukua kutoka katika kilicho juu ya Musa na kukiweka juu ya wazee. 'Kuchukua sehemu' huwasilisha uhamisho huo bila kuamua kama alichonacho Musa kinapungua.
- source_word: מִן הָרוּחַ אֲשֶׁר עָלֶיךָ
  choice: sehemu ya Roho aliye juu yako
  rationale: רוּחַ katika muktadha huu ni uwepo na uwezo unaotolewa na Mungu kwa ajili ya uongozi. Herufi kubwa katika 'Roho' inaonyesha maana hiyo, huku tanbihi ikihifadhi uwezekano wa kuandika 'roho'.
- source_word: וְשַׂמְתִּי עֲלֵיהֶם
  choice: na kuiweka juu yao
  rationale: Hii inahifadhi taswira ya maandishi ya kuweka Roho juu ya watu. Kiwakilishi 'i-' kinarejelea 'sehemu' iliyotajwa.
- source_word: וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם
  choice: Nao wataubeba pamoja nawe mzigo wa watu
  rationale: Maneno haya yanadumisha sitiari ya kubeba mzigo na yanaeleza wazi kwamba jukumu la kuwaongoza watu litashirikishwa.
- source_word: וְלֹא תִשָּׂא אַתָּה לְבַדֶּךָ
  choice: ili usiubebe wewe peke yako
  rationale: '''Ili'' linaonyesha kusudi au matokeo ya mpango huo, na ''wewe peke yako'' linahifadhi mkazo wa Kiebrania.'
theological_decisions:
- issue: Iwapo רוּחַ itafsiriwe 'Roho' au 'roho'
  choice: Roho
  alternative: roho
  rationale: Muktadha, hasa Hesabu 11:25, unaonyesha uwezo wa kimungu uliokuwa juu ya Musa na kuwekwa juu ya wazee. Herufi kubwa inaonyesha maana hiyo bila kulazimisha ufafanuzi wa kimadhehebu; tanbihi inahifadhi hali ya neno la Kiebrania kutokuwa na herufi kubwa.
- issue: Iwapo kuchukua sehemu ya Roho kunamaanisha kwamba Musa alipungukiwa
  choice: Kutosema kwamba Musa alipungukiwa
  alternative: Kueleza kuwa sehemu ya Roho iliondolewa kwa Musa
  rationale: Kitenzi אצל kinaonyesha kuchukua na kuhamisha, lakini mstari hausemi wazi kama uwezo wa Musa ulipungua. Tafsiri haiongezi hitimisho hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni wazi kwa msomaji wa kawaida, huku sitiari za kushuka, kuweka Roho juu ya watu, na kubeba mzigo zikihifadhiwa.
