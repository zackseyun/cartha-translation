base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/013.yaml
  text: Where am I to get meat to give to all this people? For they are weeping before me[a], saying, ‘Give us meat, so that we may eat.’
translation:
  language: sw
  text: Nitapata wapi nyama ya kuwapa watu hawa wote? Kwa maana wananililia[a] wakisema, ‘Tupe nyama ili tule.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanalia mbele yangu,” au, “wananishinikiza kwa kilio chao.” Nahau ya Kiebrania kwa maana halisi ni “wanalia juu yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן לִי
  choice: Nitapata wapi
  rationale: Swali hili linauliza chanzo ambako Musa angeweza kupata nyama, huku likionyesha kutoweza kwake; ‘Nitapata wapi’ ni Kiswahili cha kawaida na chenye nguvu hiyo.
- source_word: בָּשָׂר
  choice: nyama
  rationale: Katika muktadha wa chakula, neno hili humaanisha nyama ya kuliwa, si ‘mwili.’
- source_word: לָתֵת לְכָל הָעָם הַזֶּה
  choice: ya kuwapa watu hawa wote
  rationale: ‘Kuwapa’ huwasilisha kitenzi cha kutoa kwa kawaida, na ‘watu hawa wote’ hutafsiri kwa ufasaha nomino ya mkusanyiko עָם.
- source_word: כִּי
  choice: Kwa maana
  rationale: Hapa kiunganishi kinatoa sababu ya malalamiko ya Musa.
- source_word: יִבְכּוּ עָלַי
  choice: wananililia
  rationale: Muundo wa Kiebrania unaelekeza kilio kwa Musa na unaweza pia kudokeza shinikizo linalomlemea. ‘Wananililia’ huhifadhi uelekeo huo bila kuamua kuwa ni uhasama.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Hutambulisha maneno yanayonukuliwa kwa mtiririko wa kawaida wa Kiswahili.
- source_word: תְּנָה לָּנוּ
  choice: Tupe
  rationale: Ni amri ya moja kwa moja yenye maana ya ‘tupatie.’
- source_word: וְנֹאכֵלָה
  choice: ili tule
  rationale: Umbo la cohortative linaonyesha kusudi au matokeo yanayotamaniwa; ‘ili tule’ ni la asili na huhifadhi maana hiyo.
