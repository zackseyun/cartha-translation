translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. ‘Wananililia’ limechaguliwa ili kuonyesha kwamba kilio chao kinaelekezwa kwa Musa, huku tanbihi ikihifadhi upana wa nahau ya Kiebrania.
