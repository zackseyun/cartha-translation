  text: וְ/עַתָּ֛ה נַפְשֵׁ֥/נוּ יְבֵשָׁ֖ה אֵ֣ין כֹּ֑ל בִּלְתִּ֖י אֶל הַ/מָּ֥ן עֵינֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/006.yaml
  text: But now our appetite is dried up[a]; there is nothing at all except the manna before our eyes.
translation:
  language: sw
  text: Lakini sasa hamu yetu ya kula imekauka[a]; hakuna kitu chochote isipokuwa mana tu mbele ya macho yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi yetu imekauka.” Neno la Kiebrania נֶפֶשׁ (nefesh) linaweza kumaanisha “nafsi,” “uhai,” au, katika muktadha wa chakula, “hamu ya kula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Lakini sasa
  rationale: Kiunganishi pamoja na kielezi cha wakati kinaonyesha tofauti kati ya hali yao ya sasa na vyakula walivyokuwa wamevitaja; “Lakini sasa” ni ya kawaida na inaonyesha vizuri mkazo huo.
- source_word: נַפְשֵׁנוּ
  choice: hamu yetu ya kula
  rationale: Ingawa נֶפֶשׁ inaweza kumaanisha nafsi au uhai, katika muktadha wa chakula na tamaa inaweza kutaja hamu ya kula. Hapa watu wanalalamika kuhusu chakula, hivyo maana hii inaeleweka kwa urahisi bila kuingiza dai lisilokusudiwa kuhusu nafsi.
- source_word: יְבֵשָׁה
  choice: imekauka
  rationale: Neno hilo linaeleza hali ya ukavu au kunyauka. “Imekauka” inadumisha taswira halisi ya Kiebrania, ingawa ni taswira isiyo ya kawaida kidogo katika Kiswahili.
- source_word: אֵין כֹּל
  choice: hakuna kitu chochote
  rationale: Muundo wa ukanushaji wenye כֹּל unasisitiza kutokuwapo kabisa kwa kitu kingine; “hakuna kitu chochote” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: בִּלְתִּי אֶל
  choice: isipokuwa
  rationale: 'Muundo huu unaonyesha utengaji: kwa maoni yao, hakuna kitu kingine ila mana.'
- source_word: הַמָּן
  choice: mana
  rationale: “Mana” ndilo neno la kawaida la Kibiblia katika Kiswahili. Kibainishi cha Kiebrania kinaonyesha mana inayojulikana katika muktadha, lakini Kiswahili hakihitaji kuongeza “hii,” jambo ambalo lingeweza kuzidisha sauti ya dharau isiyoonyeshwa wazi na neno lenyewe.
- source_word: עֵינֵינוּ
  choice: mbele ya macho yetu
  rationale: Tafsiri hii inadumisha taswira halisi ya kitu pekee wanachokiona kila wakati, badala ya kuibadili kabisa kuwa kauli ya jumla kuhusu chakula.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika malalamiko kuhusu chakula
  choice: hamu yetu ya kula
  alternative: nafsi yetu
  rationale: Muktadha wa njaa na uchovu wa kula mana unaunga mkono maana ya hamu ya kula, huku tanbihi ikihifadhi maana pana na halisi zaidi ya neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inadumisha ukali wa malalamiko na taswira ya ukavu. “Mana tu” pamoja na “hakuna kitu chochote” huhifadhi msisitizo wa Kiebrania bila kuongeza neno la kuonyesha kama “hii.”
