  text: Hamtakula kwa siku moja tu[a], wala siku mbili, wala siku tano, wala siku kumi, wala siku ishirini,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa muundo unaokaribia zaidi Kiebrania: “Hamtakula kwa siku moja, wala kwa siku mbili, wala kwa siku tano, wala kwa siku kumi, wala kwa siku ishirini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: hamta... wala
  rationale: Kikanushi kimerudiwa pamoja na vipindi vya muda. Kiswahili cha kawaida huwasilisha mfuatano huu kwa kitenzi kilichokanushwa kisha “wala” kabla ya kila kipindi kinachofuata.
- source_word: יוֹם אֶחָד
  choice: kwa siku moja tu
  rationale: “Siku moja” huhifadhi hesabu ya Kiebrania; “tu” hufanya maana ya kipindi kimoja pekee iwe wazi na ya kawaida katika Kiswahili.
- source_word: תֹּאכְלוּ/ן
  choice: hamtakula
  rationale: Ni Qal imperfect nafsi ya pili wingi, na hapa ina maana ya wakati ujao katika tangazo la Mungu.
- source_word: יוֹמָיִם
  choice: siku mbili
  rationale: Umbo la uwili linamaanisha wazi siku mbili.
- source_word: חֲמִשָּׁה יָמִים
  choice: siku tano
  rationale: Tafsiri ya moja kwa moja huhifadhi mfuatano unaoongezeka.
- source_word: עֲשָׂרָה יָמִים
  choice: siku kumi
  rationale: Tafsiri ya moja kwa moja huhifadhi mkazo wa mfuatano wa vipindi.
- source_word: עֶשְׂרִים יוֹם
  choice: siku ishirini
  rationale: Hili ndilo umbo la kawaida la Kiswahili, ingawa Kiebrania hutumia nomino ya umoja baada ya ishirini.
- source_word: וְ
  choice: wala
  rationale: Ingawa waw mara nyingi humaanisha “na,” katika mfuatano huu wa vikanushi “wala” huonyesha kwa kawaida vipindi vinavyokataliwa kimoja baada ya kingine.
