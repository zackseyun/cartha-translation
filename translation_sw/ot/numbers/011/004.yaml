base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/004.yaml
  text: The rabble among them had a strong craving[a], and the sons of Israel also turned back and wept, and said[d][c][b], “Who will feed us meat?”
translation:
  language: sw
  text: Umati wa watu wa ovyo[a] uliokuwa miongoni mwao ulitamani sana[b], nao wana wa Israeli wakalia tena, wakasema, “Ni nani atakayetulisha nyama?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umati mchanganyiko.” Neno la Kiebrania ni adimu na la dharau; linarejelea kundi lisilo sehemu ya msingi lililokuwa ndani ya Israeli.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno moja moja, Kiebrania kinasema “walitamani tamaa,” usemi wa kusisitiza hamu kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאסַפְסֻף
  choice: umati wa watu wa ovyo
  rationale: Nomino hii adimu ya mkusanyiko ina dharau na humaanisha kundi lisilo la msingi lililokuwa ndani ya jamii ya Israeli. Tafsiri hii inaonyesha maana ya kundi na hisia hasi bila kutumia neno lisiloeleweka kwa urahisi.
- source_word: אֲשֶׁר בְּקִרְבּוֹ
  choice: uliokuwa miongoni mwao
  rationale: Huhifadhi wazo la kundi hilo kuwapo katikati ya jamii ya Israeli kwa Kiswahili cha kawaida.
- source_word: הִתְאַוּוּ תַּאֲוָה
  choice: ukatamani sana
  rationale: Kitenzi na nomino yenye mzizi mmoja husisitiza nguvu ya tamaa. Kiswahili cha asili hutumia kielezi ‘sana’ badala ya kuiga muundo huo kwa maneno yasiyo ya kawaida.
- source_word: וַיָּשֻׁבוּ וַיִּבְכּוּ
  choice: wakaanza tena kulia
  rationale: שׁוּב hapa inaelekea kuonyesha kurudi au kuanza upya tendo la kulia; ‘tena’ huwasilisha maana hiyo kwa uwazi.
- source_word: גַּם בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli nao
  rationale: ‘Wana wa Israeli’ huhifadhi usemi wa kifamilia wa Kiebrania, na ‘nao’ huwasilisha גַּם.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Ni nani atakayetulisha nyama?
  rationale: Hifili ya אכל ina maana ya kusababisha mtu ale, yaani kumlisha; בָּשָׂר hapa ni nyama inayoliwa.
