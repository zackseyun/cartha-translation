  to: Watu walikuwa wakizunguka-zunguka na kuikusanya; waliisaga kwa mawe ya kusagia au waliiponda katika kinu, kisha waliipika katika sufuria na wakafanya mikate nayo. Ladha yake ilikuwa kama ladha ya mafuta yenye unono.[a]
