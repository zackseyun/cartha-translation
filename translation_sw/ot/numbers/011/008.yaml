base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/008.yaml
  text: The people would roam about and gather it, and grind it in the millstones or crush it in the mortar, and boil it in the pot, and make it into cakes; and its taste was like the taste of rich oil.
translation:
  language: sw
  text: Watu walikuwa wakizunguka-zunguka na kuikusanya; waliisaga kwa mawe ya kusagia au waliiponda katika kinu, kisha waliipika katika sufuria na wakafanya mikate nayo. Ladha yake ilikuwa kama ladha ya mafuta yenye unono.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ladha ya mafuta mabichi.” Kifungu cha Kiebrania לְשַׁד הַשָּׁמֶן ni kigumu; huenda kinamaanisha unono wa mafuta au mafuta mabichi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁטוּ
  choice: walikuwa wakizungukazunguka
  rationale: Kitenzi kinaonyesha kwenda huku na huku katika eneo; muundo huu pia unaonyesha tendo lao la kawaida la kukusanya mana.
- source_word: וְלָקְטוּ
  choice: na kuikusanya
  rationale: ‘Kukusanya’ ni neno la kawaida na linaloeleweka kwa tendo la kuokota mana iliyotapakaa.
- source_word: וְטָחֲנוּ בָרֵחַיִם
  choice: waliisaga kwa mawe ya kusagia
  rationale: ‘Mawe ya kusagia’ yanahifadhi maana halisi ya רֵחַיִם, yaani jiwe au mawe ya kusagia kwa mkono; ‘kwa’ huonyesha chombo kilichotumiwa.
- source_word: אוֹ דָכוּ בַּמְּדֹכָה
  choice: au waliiponda katika kinu
  rationale: ‘Kuponda’ huwasilisha kitendo cha kuvunja kwa kupiga, na ‘kinu’ ni chombo cha kawaida kinacholingana na מְּדֹכָה katika muktadha huu.
- source_word: וּבִשְּׁלוּ בַּפָּרוּר
  choice: kisha waliipika katika sufuria
  rationale: Kitenzi kinaweza kumaanisha kupika au kuchemsha. ‘Kuipika’ ni cha asili zaidi hapa na hakibani njia ya upishi kuliko ushahidi wa Kiebrania unavyoruhusu.
- source_word: וְעָשׂוּ אֹתוֹ עֻגוֹת
  choice: na kuitengeneza kuwa mikate
  rationale: עֻגוֹת ni mikate midogo au ya mviringo; ‘mikate’ ni neno la kawaida la Kiswahili na huepuka kuingiza aina maalumu ya keki ya kisasa.
- source_word: טַעְמוֹ
  choice: ladha yake
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya nomino inayomaanisha ladha.
- source_word: לְשַׁד הַשָּׁמֶן
  choice: mafuta mazuri
  rationale: Kifungu hiki ni kigumu na huenda kinarejelea utomvu, unono, au upya wa mafuta. ‘Mafuta mazuri’ huwasilisha ubora na utajiri wa ladha kwa Kiswahili cha kawaida bila kudai uhakika usiokuwapo; utata umehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ndefu ya Kiebrania imegawanywa ili isomeke kwa urahisi, huku mfuatano wa matendo ukihifadhiwa. Viwakilishi vya kitu katika ‘kuikusanya,’ ‘waliisaga,’ na ‘waliiponda’ vinarejelea mana iliyotajwa katika muktadha.
