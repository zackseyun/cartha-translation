  text: וַ/יִּשָּׁאֲר֣וּ שְׁנֵֽי אֲנָשִׁ֣ים בַּֽ/מַּחֲנֶ֡ה שֵׁ֣ם הָ/אֶחָ֣ד אֶלְדָּ֡ד וְ/שֵׁם֩ הַ/שֵּׁנִ֨י מֵידָ֜ד וַ/תָּ֧נַח עֲלֵי/הֶ֣ם הָ/ר֗וּחַ וְ/הֵ֨מָּה֙ בַּ/כְּתֻבִ֔ים וְ/לֹ֥א יָצְא֖וּ הָ/אֹ֑הֱלָ/ה וַ/יִּֽתְנַבְּא֖וּ בַּֽ/מַּחֲנֶֽה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/026.yaml
  text: But two men remained in the camp[a]. The name of the one was Eldad, and the name of the second was Medad. And the Spirit rested on them; they were among those recorded, but they had not gone out to the tent[b], and they prophesied in the camp.
translation:
  language: sw
  text: Lakini wanaume wawili walibaki kambini. Mmoja aliitwa Eldadi, na wa pili Medadi. Roho akatua juu yao. Walikuwa miongoni mwa walioandikwa[a], lakini hawakuwa wametoka kwenda hemani[b], nao wakatabiri kambini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa walioorodheshwa.” Kiebrania kinasema kihalisi “miongoni mwa walioandikwa.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, huenda ni hema la kukutania katika muktadha wa tukio hili.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשָּׁאֲרוּ
  choice: walibaki
  rationale: Kitenzi hiki kinaonyesha kubaki bila kueleza sababu iliyowafanya wasiende pamoja na wengine.
- source_word: בַּמַּחֲנֶה
  choice: kambini
  rationale: Hii ni tafsiri ya kawaida na ya asili ya mahali walipokuwa ndani ya kambi ya Israeli.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: wanaume wawili
  rationale: אֲנָשִׁים hapa ni wingi wa kiume, hivyo ‘wanaume wawili’ huhifadhi maana hiyo waziwazi.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: Mmoja aliitwa ... na wa pili ...
  rationale: Muundo huu ni wa asili katika Kiswahili na bado huhifadhi utofautishaji wa Kiebrania kati ya mmoja na wa pili.
- source_word: אֶלְדָּד / מֵידָד
  choice: Eldadi / Medadi
  rationale: Majina yameandikwa kwa namna iliyozoeleka katika Kiswahili, kwa kuongeza irabu ya mwisho ili yatamkike kwa urahisi.
- source_word: וַתָּנַח עֲלֵיהֶם הָרוּחַ
  choice: Roho akatua juu yao
  rationale: נוח ina wazo la kutua au kukaa juu ya mtu; ‘akatua juu yao’ ni wazi na huhifadhi taswira ya chanzo.
- source_word: וְהֵמָּה בַּכְּתֻבִים
  choice: Walikuwa miongoni mwa walioandikwa
  rationale: כְּתֻבִים kihalisi ni ‘walioandikwa’; katika muktadha ni watu waliokuwa wameorodheshwa, lakini tafsiri kuu imehifadhi usemi mpana wa chanzo.
- source_word: וְלֹא יָצְאוּ הָאֹהֱלָה
  choice: hawakuwa wametoka kwenda hemani
  rationale: Tafsiri hii huhifadhi kitenzi cha kutoka pamoja na kiishio cha mwelekeo kinachoonyesha kwenda kwenye hema.
- source_word: וַיִּתְנַבְּאוּ
  choice: wakatoa unabii
  rationale: Hii inaeleza shughuli ya kinabii bila kuongeza wazo lisilolazimishwa na kitenzi kwamba ndipo walipoanza.
theological_decisions:
- issue: Ikiwa הָרוּחַ itafsiriwe kama roho kwa maana ya kawaida au Roho wa Mungu
  choice: Roho
  alternative: roho
  rationale: Muktadha wa karibu unaonyesha kwamba huyu ndiye Roho wa Mungu aliyewawezesha wazee kutoa unabii. Herufi kubwa inaonyesha rejeo hilo bila kuongeza jina kamili lisilokuwapo katika mstari.
- issue: Ikiwa הָאֹהֱלָה ifafanuliwe moja kwa moja kuwa hema la kukutania
  choice: hemani
  alternative: kwenye hema la kukutania
  rationale: Kiebrania cha mstari huu kinasema tu ‘hema.’ Utambulisho unaowezekana kutokana na muktadha umewekwa katika tanbihi badala ya kuongezwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Viunganishi na mpangilio wa sentensi vimefanywa kuwa vya asili bila kuondoa marudio muhimu ya simulizi. Alama za tanbihi zimewekwa baada ya vifungu vinavyoelezewa.
