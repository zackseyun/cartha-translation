base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/032.yaml
  text: And the people rose up all that day and all that night and all the next day[a], and they gathered the quail. The one who gathered the least gathered ten homers[b], and they spread them out for themselves all around the camp.
translation:
  language: sw
  text: Ndipo watu wakainuka na kukusanya kware siku ile yote, usiku ule wote, na siku yote iliyofuata. Hata aliyekusanya kidogo zaidi kuliko wote alikusanya homeri kumi[a][b]. Nao wakazitandaza kwa ajili yao wenyewe pande zote kuzunguka kambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Homeri ilikuwa kipimo kikubwa cha vitu vikavu. Kiasi chake kamili katika vipimo vya kisasa hakijulikani kwa uhakika; jambo linalosisitizwa hapa ni kwamba hata aliyekusanya kidogo kuliko wote alipata kiasi kikubwa sana.
    reason: cultural_note
  - marker: b
    text: Au, “mizigo kumi ya punda.” Tafsiri hii hutegemea uhusiano wa kiasili wa neno חֳמָרִים na neno la Kiebrania linalomaanisha punda, badala ya kulichukulia kuwa wingi wa kipimo kinachoitwa homeri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הָעָם
  choice: Ndipo watu wakainuka
  rationale: ‘Wakainuka’ huhifadhi nahau na msukumo wa kitenzi קום bila kudokeza kwamba watu waliondoka kambini. ‘Ndipo’ linaendeleza simulizi kwa kawaida.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה וְכֹל י֣וֹם הַמָּחֳרָת
  choice: siku ile yote, usiku ule wote, na siku yote iliyofuata
  rationale: Muundo huu unahifadhi msisitizo wa muda mfululizo—mchana, usiku, na siku iliyofuata—kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: וַיַּאַסְפוּ אֶת־הַשְּׂלָו
  choice: na kukusanya kware
  rationale: ‘Kukusanya’ ni maana ya kawaida ya אסף katika muktadha huu, na ‘kware’ ndilo jina la kawaida la ndege שְׂלָו kwa Kiswahili.
- source_word: הַמַּמְעִיט
  choice: aliyekusanya kiasi kidogo kuliko wote
  rationale: Kirai kinaeleza mtu aliyekusanya kiwango cha chini zaidi. Ufafanuzi wa tendo la kukusanya unatokana na kitenzi kinachofuata na muktadha.
- source_word: עֲשָׂרָה חֳמָרִים
  choice: homeri kumi
  rationale: ‘Homeri’ huhifadhi jina la kipimo kikubwa cha ujazo bila kutoa thamani ya kisasa yenye uhakika wa uongo. Uwezekano wa ‘mizigo ya punda’ umewekwa katika tanbihi.
- source_word: וַיִּשְׁטְחוּ לָהֶם שָׁטוֹחַ
  choice: wakazitandaza kwa ajili yao wenyewe
  rationale: ‘Wakazitandaza’ linaonyesha tendo la kuzieneza kware, na ‘kwa ajili yao wenyewe’ linaakisi לָהֶם bila kuongeza kusudi lisilotajwa, kama vile kuzikausha.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: pande zote kuzunguka kambi
  rationale: Hili linaonyesha kwamba walizitandaza katika eneo lote lililoizunguka kambi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, ya heshima, na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa muda umeunganishwa kwa kawaida na tendo la kukusanya, huku ‘wakainuka’ likihifadhi msukumo wa simulizi la Kiebrania. Alama zote za tanbihi zimewekwa moja kwa moja baada ya ‘homeri kumi,’ ambako maelezo hayo yanahusika.
