  text: Then all the congregation raised their voices and cried out[a], and the people wept that night.
translation:
  language: sw
  text: Ndipo kusanyiko lote likapaza sauti, wakapiga kelele[a]; nao watu wakalia usiku ule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “kusanyiko lote likainua [sauti], nao wakatoa sauti yao”; hii ni nahau ya kilio kikubwa cha pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: likapaza
  rationale: Kitenzi נָשָׂא kwa msingi humaanisha kuinua; katika nahau hii ya sauti, “kupaza sauti” ni Kiswahili cha kawaida kinachohifadhi taswira ya Kiebrania.
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה humaanisha jumuiya ya Israeli iliyokusanyika. “Kusanyiko lote” ni wazi, cha heshima, na kinahifadhi כָּל.
- source_word: וַיִּתְּנוּ אֶת־קוֹלָם
  choice: kulia kwa sauti kubwa
  rationale: Maneno hayo kihalisi ni “wakatoa sauti yao,” nahau inayomaanisha kutoa kilio kikubwa cha pamoja. Tafsiri hii inaeleza maana yake kwa Kiswahili cha sasa huku ikitofautishwa na kulia kwa machozi kunakofuata.
- source_word: הָעָם
  choice: watu
  rationale: Ni tafsiri ya moja kwa moja ya עָם na inadumisha tofauti ya msamiati kati ya “kusanyiko” na “watu” katika Kiebrania.
- source_word: וַיִּבְכּוּ
  choice: wakalia
  rationale: בכה humaanisha kulia au kutoa machozi. “Wakalia” ni ya kawaida na inafaa katika muktadha wa huzuni.
- source_word: בַּלַּיְלָה הַהוּא
  choice: usiku ule
  rationale: Hii ni tafsiri ya asili na fasaha ya kishazi cha wakati “katika usiku ule.”
