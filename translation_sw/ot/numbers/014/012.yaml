base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/012.yaml
  text: I will strike him with the plague and dispossess him[a], and I will make you into a nation greater and mightier than he.
translation:
  language: sw
  text: Nitawapiga kwa tauni na kuwanyang’anya milki yao[a], nami nitakufanya wewe kuwa taifa kubwa na lenye nguvu kuliko wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “na kuwaondolea urithi wao.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwanyang’anya milki au kuwaondolea urithi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכֶּנּוּ
  choice: Nitawapiga
  rationale: Hifili ya נכה humaanisha ‘kupiga.’ Ingawa kiambishi cha Kiebrania ni cha umoja wa kiume, kinawarejelea Waisraeli kwa pamoja; wingi ni wa kawaida na wazi zaidi katika Kiswahili.
- source_word: בַדֶּבֶר
  choice: kwa tauni
  rationale: דֶּבֶר humaanisha tauni au ugonjwa wa kuambukiza unaoleta maafa, hasa katika muktadha wa hukumu. ‘Tauni’ ni neno fupi na linaloeleweka katika Kiswahili sanifu.
- source_word: וְאוֹרִשֶׁנּוּ
  choice: na kuwanyang’anya milki yao
  rationale: Hifili ya ירשׁ inaweza kumaanisha kuwanyang’anya watu milki yao au kuwaondolea urithi. Tafsiri hii inabainisha kupoteza umiliki bila kufuta kabisa dokezo la urithi; maana mbadala imehifadhiwa katika tanbihi.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: nami nitakufanya wewe kuwa taifa
  rationale: Muundo wa עשה pamoja na לְ unaonyesha kumfanya mtu awe kitu fulani. ‘Nitakufanya wewe kuwa taifa’ ni Kiswahili cha kawaida, huku ‘wewe’ ikisisitiza kwamba Mungu anamwambia Musa.
- source_word: גָּדוֹל וְעָצוּם
  choice: kubwa na lenye nguvu
  rationale: גָּדוֹל huonyesha ukubwa, na עָצוּם inaweza kuonyesha nguvu, uwezo, au wingi. ‘Kubwa na lenye nguvu’ huhifadhi sifa zote mbili kwa lugha ya kawaida.
- source_word: מִמֶּנּוּ
  choice: kuliko wao
  rationale: מן pamoja na kiambishi cha umoja huunda ulinganisho na Israeli kama jumuiya moja. Kiswahili hutumia ‘wao’ kwa kawaida kwa watu hao, bila kubadili rejeleo.
theological_decisions:
- issue: Umoja wa kisarufi wa viambishi vinavyowarejelea Israeli
  choice: Kutumia wingi ‘wa-’ na ‘wao’ kwa sababu rejeleo ni watu wa Israeli kwa pamoja.
  alternative: Kutumia umoja wa kijumuiya, kama ‘nitalipiga’ na ‘kuliko hilo,’ kwa kulichukulia taifa kama kitu kimoja.
  rationale: Kiebrania huwachukulia watu kama jumuiya moja kwa viambishi vya umoja wa kiume, lakini Kiswahili cha kawaida huwarejelea watu kwa wingi. Wingi huhifadhi rejeleo la Israeli bila kuleta dhana kwamba mtu mmoja ndiye anayehukumiwa.
- issue: Maana ya ירשׁ katika tishio hili
  choice: ‘kuwanyang’anya milki yao’ katika maandishi makuu
  alternative: ‘kuwaondolea urithi wao’
  rationale: Kitenzi kinaweza kuonyesha kuondolewa katika milki au urithi. Tafsiri kuu ni pana na ya moja kwa moja, huku tanbihi ikihifadhi dokezo halisi la urithi bila kulazimisha maana moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa msomaji wa kawaida; ‘wewe’ imetumiwa kwa msisitizo unaolingana na tofauti kati ya Israeli na Musa.
