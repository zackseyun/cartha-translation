  text: וְ/אָמְר֗וּ אֶל יוֹשֵׁב֮ הָ/אָ֣רֶץ הַ/זֹּאת֒ שָֽׁמְעוּ֙ כִּֽי אַתָּ֣ה יְהוָ֔ה בְּ/קֶ֖רֶב הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁר עַ֨יִן בְּ/עַ֜יִן נִרְאָ֣ה אַתָּ֣ה יְהוָ֗ה וַ/עֲנָֽנְ/ךָ֙ עֹמֵ֣ד עֲלֵ/הֶ֔ם וּ/בְ/עַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִ/פְנֵי/הֶם֙ יוֹמָ֔ם וּ/בְ/עַמּ֥וּד אֵ֖שׁ לָֽיְלָה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/014.yaml
  text: And they will tell the inhabitants of this land[a], who have heard that you, Yahweh, are in the midst of this people, that you, Yahweh, are seen face to face, and your cloud stands over them, and you go before them in a pillar of cloud by day and in a pillar of fire by night.
translation:
  language: sw
  text: Nao watawaambia wenyeji wa nchi hii, ambao wamesikia kwamba wewe, Yahwe, uko katikati ya watu hawa, kwamba wewe, Yahwe, unaonekana ana kwa ana[a], na wingu lako linasimama juu yao, nawe unawatangulia katika nguzo ya wingu wakati wa mchana na katika nguzo ya moto wakati wa usiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania, kwa maana halisi: “unaonekana jicho kwa jicho”; yaweza pia kutafsiriwa, “unajitokeza ana kwa ana.”'
    reason: Huhifadhi taswira halisi ya עַיִן בְּעַיִן na huonyesha mbadala unaowezekana bila kuongeza wazi mtendaji au walengwa wa tendo la kuona.
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַזֹּאת
  choice: wenyeji wa nchi hii
  rationale: Umoja wa Kiebrania una maana ya jumla; wingi wa Kiswahili ‘wenyeji’ unaeleza kwa kawaida watu wanaoishi katika nchi hiyo.
- source_word: שָׁמְעוּ
  choice: ambao wamesikia
  rationale: Kauli hii inaeleza habari waliyoipata tayari na wanayoifahamu; wakati timilifu wa Kiswahili unafaa katika muktadha huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia inayosomeka kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: בְּקֶרֶב
  choice: uko katikati ya
  rationale: Huhifadhi wazo halisi la kuwapo kwa Yahwe miongoni mwa watu bila kulipunguza kuwa ukaribu wa jumla tu.
- source_word: עַיִן בְּעַיִן נִרְאָה
  choice: unaonekana kwao ana kwa ana
  rationale: ‘Ana kwa ana’ ni nahau ya asili ya Kiswahili inayowasilisha ukaribu wa moja kwa moja wa nahau ya Kiebrania, huku kitenzi ‘unaonekana’ kikihifadhi nguvu ya Nifali ya ראה.
- source_word: וַעֲנָנְךָ עֹמֵד עֲלֵהֶם
  choice: wingu lako linasimama juu yao
  rationale: Tafsiri hii inadumisha picha halisi ya wingu lililosimama juu ya watu.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: unawatangulia
  rationale: Ni Kiswahili cha kawaida kinachohifadhi maana ya kwenda mbele yao bila kuongeza kwa lazima dhana ya kuwaongoza.
- source_word: בְּעַמּוּד עָנָן ... וּבְעַמּוּד אֵשׁ
  choice: katika nguzo ya wingu ... na katika nguzo ya moto
  rationale: ‘Katika’ huhifadhi uwezekano wa maana ya mahali au namna ya kuonekana katika kiambishi ב, badala ya kuamua kuwa ni chombo pekee.
- source_word: יוֹמָם ... לָיְלָה
  choice: wakati wa mchana ... wakati wa usiku
  rationale: Hizi ni kauli za kawaida na wazi za Kiswahili kwa vielezi vya wakati vya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu; kulitaja moja kwa moja huhifadhi jambo hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עַיִן בְּעַיִן נִרְאָה
  choice: unaonekana kwao ana kwa ana
  alternative: unaonekana jicho kwa jicho; unajidhihirisha waziwazi
  rationale: Tafsiri kuu ni ya kawaida katika Kiswahili na inahifadhi wazo la kukutana moja kwa moja. Tanbihi inaonyesha taswira halisi ya Kiebrania ili kutoficha utata wake au kuigeuza kuwa dai maalumu zaidi kuhusu namna ya kumwona Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unafuata hoja ya Kiebrania lakini umetenganishwa kwa alama za mkato ili usomeke kwa urahisi. ‘Wakati wa mchana/usiku’ na ‘unawatangulia’ ni za kawaida kwa wasomaji wengi, huku taswira za wingu na nguzo zikihifadhiwa.
