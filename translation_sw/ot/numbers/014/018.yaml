  text: יְהוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד נֹשֵׂ֥א עָוֺ֖ן וָ/פָ֑שַׁע וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֞ד עֲוֺ֤ן אָבוֹת֙ עַל בָּנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/018.yaml
  text: Yahweh is slow to anger and abundant in steadfast love[a], forgiving iniquity and transgression, but he will by no means clear the guilty[d][c][b], visiting the iniquity of fathers on children to the third and to the fourth generation.
translation:
  language: sw
  text: Yahweh si mwepesi wa hasira, ni mwingi wa upendo wa kudumu[a], husamehe uovu na uasi[b], lakini kwa hakika hamwachi mwenye hatia bila adhabu[c]. Huleta adhabu kwa ajili ya uovu wa baba juu ya watoto wao, hata kizazi cha tatu na hata kizazi cha nne[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ni mwingi wa uaminifu wa agano,” “ni mwingi wa rehema,” au “amejaa fadhili za kudumu.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “husamehe” kihalisi linaweza kumaanisha “hubeba” uovu na uasi.
    reason: lexical_alternative
  - marker: c
    text: Au “hakika hataacha bila adhabu” au “hatamhesabia mwenye hatia kuwa hana hatia.”
    reason: lexical_alternative
  - marker: d
    text: Kwa Kiebrania, maneno “cha tatu na cha nne” yanarejelea vizazi.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limeandikwa kama “Yahweh,” badala ya kubadilishwa na cheo kama “Bwana.”
- source_word: אֶרֶךְ אַפַּיִם
  choice: si mwepesi wa hasira
  rationale: Hii ni tafsiri ya kawaida na ya asili ya nahau ya Kiebrania inayomaanisha kuchelewa kukasirika.
- source_word: רַב חֶסֶד
  choice: ni mwingi wa upendo thabiti
  rationale: “Upendo thabiti” huwasilisha upendo, rehema, na uaminifu wa kudumu uliomo katika חֶסֶד; “mwingi” huakisi רַב.
- source_word: נֹשֵׂא עָוֺן וָפָשַׁע
  choice: husamehe uovu na uasi
  rationale: Katika muktadha huu, נֹשֵׂא ina maana ya kubeba au kuondoa dhambi, yaani kusamehe. “Uovu” na “uasi” zinadumisha tofauti ya maneno mawili ya Kiebrania.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: lakini kwa hakika hamwachi mwenye hatia bila adhabu
  rationale: Muundo wa Kiebrania unasisitiza kabisa kutosafisha au kutomwacha bila adhabu. “Mwenye hatia” ni yambwa linalodokezwa na maana ya kimahakama.
- source_word: פֹּקֵד עֲוֺן אָבוֹת עַל בָּנִים
  choice: huupatiliza uovu wa baba kwa watoto wao
  rationale: “Huupatiliza” huonyesha kwamba Mungu analeta hukumu au matokeo ya uovu huo, bila kupunguza kauli hiyo iwe athari za kawaida tu.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: hata kizazi cha tatu na cha nne
  rationale: Kiebrania kinataja “wa tatu na wa nne” kwa ufupi; “kizazi” limeongezwa ili maana iwe wazi katika Kiswahili.
theological_decisions:
- issue: Msamaha wa Mungu na hukumu inayofikia vizazi vinavyofuata
  choice: 'Kudumisha mvutano wa andiko: Mungu husamehe, lakini hamwachi mwenye hatia bila adhabu, na huupatiliza uovu wa baba kwa watoto wao.'
  alternative: Kufafanua kauli hiyo kuwa matokeo ya kawaida tu, au kuilegeza ili ionekane kuwa haihusiani na hukumu ya Mungu.
  rationale: Kiebrania chenyewe kinaweka rehema na hukumu pamoja. Tafsiri haipaswi kuondoa mvutano huo wala kuamua kimya kimya jinsi unavyopaswa kupatanishwa na mafundisho mengine kuhusu wajibu wa mtu binafsi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka. “Si mwepesi wa hasira” ni nahau ya asili; “huupatiliza” ni neno la kimahakama lenye uzito linalohifadhi mvutano wa kauli ya Kiebrania.
