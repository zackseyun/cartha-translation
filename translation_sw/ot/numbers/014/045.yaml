base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/045.yaml
  text: Then the Amalekites and the Canaanites who lived in that hill country came down and struck them and beat them down as far as Hormah[a].
translation:
  language: sw
  text: Ndipo Waamaleki na Wakanaani waliokuwa wakiishi katika nchi ile ya vilima wakashuka, wakawapiga na kuwapondeka mpaka Horma[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Horma ni jina la mahali; jina hilo la Kiebrania linahusiana na neno linalomaanisha “maangamizi” au “kutengwa kwa ajili ya kuangamizwa.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: wakashuka
  rationale: Kitenzi kinaonyesha mwendo wa kushuka kutoka nchi ya vilima. Ingawa kiko katika umoja kabla ya kiima ambatano, Kiswahili huhitaji upatanisho wa wingi kwa makundi hayo mawili.
- source_word: הָעֲמָלֵקִי
  choice: Waamaleki
  rationale: Jina hili la taifa liko katika umbo la umoja kwa Kiebrania lakini lina maana ya jamii nzima; wingi ni wa kawaida na wazi katika Kiswahili.
- source_word: וְהַכְּנַעֲנִי
  choice: na Wakanaani
  rationale: Kama jina lililotangulia, umbo la umoja la Kiebrania limetumiwa kwa maana ya kundi la watu; Kiswahili cha kawaida hutumia wingi.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: waliokuwa wakiishi katika nchi ile ya vilima
  rationale: יֹשֵׁב inaonyesha kukaa au kuishi, na הָר hapa inaelekea kutaja eneo la miinuko badala ya mlima mmoja; ‘nchi ya vilima’ inaeleza mazingira ya kijeshi na kijiografia kwa kawaida.
- source_word: וַיַּכּוּם
  choice: wakawapiga
  rationale: נכה ni kitenzi kipana cha kupiga, kushambulia, au kushinda. ‘Wakawapiga’ huhifadhi picha halisi bila kutangulia nguvu ya kitenzi kinachofuata.
- source_word: וַיַּכְּתוּם
  choice: na kuwashinda vibaya
  rationale: Kitenzi hiki kinaonyesha kupondwa au kushindwa kwa nguvu baada ya pigo la kwanza. Usemi huu ni wa kawaida katika Kiswahili na hauashirii bila msingi kwamba wote waliangamizwa.
- source_word: עַד הַחָרְמָה
  choice: mpaka Horma
  rationale: עַד huonyesha kikomo cha mwendo au ushindi; ‘mpaka Horma’ ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo.
- source_word: הַחָרְמָה
  choice: Horma
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa katika matini kuu. Uhusiano wake wa kimaana na uharibifu umeelezwa katika tanbihi.
