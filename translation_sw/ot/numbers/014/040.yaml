id: NUM.14.40
reference: Numbers 14:40
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֔קֶר וַ/יַּֽעֲל֥וּ אֶל רֹאשׁ הָ/הָ֖ר לֵ/אמֹ֑ר הִנֶּ֗/נּוּ וְ/עָלִ֛ינוּ אֶל הַ/מָּק֛וֹם אֲשֶׁר אָמַ֥ר יְהוָ֖ה כִּ֥י חָטָֽאנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/040.yaml
  text: They rose early in the morning and went up to the top of the mountain[a], saying, “Here we are, and we will go up to the place that Yahweh has spoken of, for we have sinned.”
translation:
  language: sw
  text: Wakaamka mapema asubuhi, wakapanda hadi kilele cha mlima, wakisema, “Tazama, tuko hapa; tutapanda kwenda mahali ambayo Yahwe aliitaja[a], kwa maana tumetenda dhambi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “mahali ambayo Yahwe alisema.” Kitenzi cha Kiebrania ni “alisema” au “alinena”; “aliitaja” kimetumiwa kwa maana ya kawaida katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: Wakaamka asubuhi na mapema
  rationale: Muundo huu unawakilisha tendo la kuamka mapema pamoja na kirai ‘asubuhi’ kwa Kiswahili cha kawaida bila kurudia wazo kwa namna isiyo ya asili.
- source_word: וַיַּעֲלוּ אֶל רֹאשׁ הָהָר
  choice: wakapanda hadi kilele cha mlima
  rationale: עלה ni ‘kupanda,’ na רֹאשׁ הָהָר ni nahau inayomaanisha kilele cha mlima. ‘Hadi’ huonyesha mahali walipoelekea.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Kiswahili hiki kinatambulisha maneno ya moja kwa moja kwa njia iliyo karibu na muundo wa Kiebrania na bado ni ya asili.
- source_word: הִנֶּנּוּ
  choice: Tazama, tuko hapa!
  rationale: Hii inahifadhi mwito wa kuvuta fikira na kujitokeza kwao wenyewe, bila kuifasiri moja kwa moja kuwa ‘tuko tayari.’
- source_word: וְעָלִינוּ
  choice: Tutapanda
  rationale: Katika muktadha, kauli timilifu yenye kiunganishi inaeleza azimio lao la kufanya jambo linalofuata.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר אָמַר יְהוָה
  choice: kwenda mahali alipopataja Yahwe[a]
  rationale: Kitenzi אָמַר kimsingi ni ‘alisema,’ lakini hapa kinatambulisha mahali ambako Yahwe alikuwa amesema habari zake. ‘Alipopataja’ ni Kiswahili cha asili na hakiongezi dhana yenye nguvu zaidi ya ‘aliahidi.’ Tanbihi inadumisha uwazi kuhusu usemi halisi wa chanzo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne za Kiebrania limetolewa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: כִּי חָטָאנוּ
  choice: kwa maana tumetenda dhambi
  rationale: כִּי inatoa sababu ya azimio lao, na חטא ina uzito wa kimaadili na kitheolojia unaohifadhiwa na ‘kutenda dhambi.’
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi la agano, hivyo limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- issue: Kauli אֲשֶׁר אָמַר יְהוָה isiyo na kijalizo wazi
  choice: mahali alipopataja Yahwe
  alternative: mahali ambapo Yahwe alisema; mahali ambapo Yahwe alisema twende
  rationale: Chaguo kuu ni la asili katika Kiswahili na haliongezi kijalizo kisichotajwa. Chaguo la ‘alisema twende’ lingeingiza maneno yanayoeleweka kutokana na muktadha lakini yasiyopo wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa vitenzi vya masimulizi umehifadhiwa kwa viambishi vya ‘waka-’, huku tamko lao likitolewa kwa lugha rahisi na yenye uzito.
