  to: Wakaamka mapema asubuhi, wakapanda hadi kilele cha mlima, wakisema, “Tazama, tuko hapa; tutapanda kwenda mahali ambayo Yahwe aliitaja[a], kwa maana tumetenda dhambi.”
  rationale: The relative clause has been recast so that Yahwe is unambiguously its subject and the place is the implied object, while “aliitaja” retains the contextual sense ‘spoke of/mentioned’ without importing ‘promised.’ The footnote has been aligned with the corrected wording.
