base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/027.yaml
  text: How long shall this evil congregation grumble against me? I have heard the complaints of the sons of Israel[b][a], which they are grumbling against me.
translation:
  language: sw
  text: “Nitalivumilia[a] mpaka lini kusanyiko hili ovu, ambalo linanung’unika dhidi yangu? Nimeyasikia malalamiko ya wana wa Israeli[b], wanaonung’unika dhidi yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania hakitaji wazi kitenzi “kulivumilia”; kwa neno kwa neno: “Mpaka lini kwa kusanyiko hili ovu...?”'
    reason: source_ellipsis
  - marker: b
    text: Au “Waisraeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: mpaka lini
  rationale: Ni swali la muda linaloonyesha kuchoshwa na hali inayoendelea; “mpaka lini” ni Kiswahili cha kawaida na huhifadhi nguvu ya usemi wa Kiebrania.
- source_word: לָעֵדָה
  choice: kusanyiko
  rationale: עֵדָה humaanisha jamii iliyokusanyika ya Israeli. “Kusanyiko” ni neno la kawaida, lenye hadhi, na linafaa kwa kundi linalotajwa kwa pamoja.
- source_word: הָרָעָה הַזֹּאת
  choice: hili ovu
  rationale: רָעָה hapa ni hukumu ya kimaadili, si maelezo kwamba kundi hilo ni baya kwa maana ya kutopendeza tu; “ovu” huhifadhi uzito huo.
- source_word: מַלִּינִים
  choice: linanung’unika / wanayonung’unika
  rationale: Kitenzi hiki katika simulizi za jangwani hueleza kulalamika kwa ukaidi na kwa kuendelea. “Kunung’unika” ni cha asili katika Kiswahili na huhifadhi tofauti yake na nomino “malalamiko.”
- source_word: עָלַי
  choice: dhidi yangu
  rationale: Kihusishi kinaonyesha kwamba manung’uniko yanaelekezwa kwa Mungu kwa upinzani; “dhidi yangu” huhifadhi maana hiyo.
- source_word: תְּלֻנּוֹת
  choice: malalamiko
  rationale: Nomino hii hurejelea maneno ya kutoridhika yaliyotolewa; “malalamiko” ni wazi na ya sasa katika Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu muundo wa Kiebrania huku ikibaki wazi katika Kiswahili; hapa inarejelea watu wa Israeli.
- source_word: שָׁמָעְתִּי
  choice: nimeyasikia
  rationale: Kauli timilifu inaonyesha kwamba Mungu ameyasikia malalamiko hayo na sasa anaitikia; wakati timilifu wa Kiswahili unafaa kwa matokeo hayo ya sasa.
theological_decisions:
- issue: Kitenzi kisichotajwa wazi katika swali la kwanza
  choice: Nitalivumilia
  alternative: Mpaka lini kwa kusanyiko hili ovu
  rationale: Maandishi ya Kiebrania yana “mpaka lini kwa kusanyiko hili ovu” bila kitenzi kinachoelezwa wazi. Muktadha unaashiria wazo la kuvumilia au kushughulika na kusanyiko hilo. Kitenzi “kulivumilia” kimeongezwa ili sentensi iwe ya asili katika Kiswahili, huku tanbihi ikihifadhi hali ya usemi wa chanzo usio kamili waziwazi.
- issue: Utambulisho wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” hufuata usemi wa Kiebrania kwa karibu bila kuamua zaidi ya chanzo; mbadala wa kawaida zaidi umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kunung’unika” huhifadhi sauti ya malalamiko ya ukaidi, na “kusanyiko hili ovu” huhifadhi hukumu kali ya kimaadili katika chanzo.
