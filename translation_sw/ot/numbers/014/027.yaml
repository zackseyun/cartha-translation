  rationale: Revised only the final relative clause so that “wana wa Israeli” is plainly the subject of “wanaonung’unika.” This resolves the Swahili grammatical ambiguity while preserving the Hebrew’s sense that Israel’s complaints are grumbling directed against God. The contextual completion of the Hebrew ellipsis and both footnote anchors are retained.
