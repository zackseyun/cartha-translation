base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/030.yaml
  text: Surely you shall not come into the land in which I raised my hand to settle you[a], except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: sw
  text: Hakika hamtaingia katika nchi ambayo niliinua mkono wangu kuapa kwamba nitawakalisha humo[a], isipokuwa Kalebu mwana wa Yefune na Yoshua mwana wa Nuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa neno halisi: “nchi ambayo niliinua mkono wangu ili niwakalishe humo.” Kuinua mkono kulikuwa ishara ya kiapo; Mungu aliapa kwamba angewakalisha katika nchi hiyo.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם אַתֶּם תָּבֹאוּ
  choice: Hakika hamtaingia
  rationale: Katika tamko hili la kiapo, אִם ina nguvu ya ukanushaji mkali, si sharti la kawaida. Kiswahili hiki kinaonyesha uhakika wa hukumu hiyo.
- source_word: אֶל הָאָרֶץ
  choice: katika nchi
  rationale: Pamoja na kitenzi cha kuingia, 'katika nchi' ni usemi wa kawaida wa Kiswahili unaoonyesha kuingia ndani ya eneo hilo.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: ambayo niliinua mkono wangu kuwaapisha kwamba
  rationale: Huhifadhi picha ya Kiebrania ya kuinua mkono, huku ikifafanua kwa Kiswahili kwamba tendo hilo ni ishara ya kiapo.
- source_word: לְשַׁכֵּן אֶתְכֶם בָּהּ
  choice: nitawakalisha humo
  rationale: 'Huwakilisha maana ya kisababishi ya שׁכן: kuwafanya wakae au kuwapa makao humo.'
- source_word: כִּי אִם
  choice: isipokuwa
  rationale: Muundo huu unaanzisha watu pekee wanaoondolewa katika hukumu iliyotangulia.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Kalebu mwana wa Yefune
  rationale: Majina yameandikwa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili, na uhusiano wa mwana umehifadhiwa.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: na Yoshua mwana wa Nuni
  rationale: Kiunganishi na jina la ukoo vimetolewa kwa Kiswahili cha kawaida; maumbo ya majina yanafuata matumizi yaliyozoeleka.
theological_decisions:
- issue: Kutafsiri nahau ya kiapo bila kudhoofisha hukumu ya Mungu
  choice: Hakika hamtaingia katika nchi
  alternative: Ikiwa mtaingia katika nchi
  rationale: אִם mwanzoni mwa tamko hili la kiapo hutoa ukanushaji wenye mkazo. Kutafsiri kama sharti kungeacha sentensi isiyo kamili na kuficha nguvu ya hukumu.
- issue: Kuhifadhi ishara ya kuinua mkono na maana yake
  choice: niliinua mkono wangu kuwaapisha kwamba nitawakalisha humo
  alternative: niliapa kuwakalisha humo
  rationale: Chaguo hili linahifadhi taswira halisi ya ishara ya kiapo, huku likisaidia msomaji wa sasa kuelewa maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. 'Hakika hamtaingia' huonyesha hukumu yenye mkazo; tanbihi inaeleza nahau ya kiapo bila kuondoa taswira yake katika matini kuu.
