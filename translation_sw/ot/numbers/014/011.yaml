  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַד אָ֥נָה יְנַאֲצֻ֖/נִי הָ/עָ֣ם הַ/זֶּ֑ה וְ/עַד אָ֨נָה֙ לֹא יַאֲמִ֣ינוּ בִ֔/י בְּ/כֹל֙ הָֽ/אֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/011.yaml
  text: And Yahweh said to Moses[a], “How long will this people treat me with contempt? And how long will they not believe in me[c][b], despite all the signs that I have done among them?”
translation:
  language: sw
  text: Yahwe akamwambia Musa, “Mpaka lini watu hawa watanidharau[a]? Na mpaka lini hawataniamini[b], licha ya ishara zote nilizofanya katikati yao[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watanikataa kwa dharau.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hawatanitumainia.”
    reason: lexical_alternative
  - marker: c
    text: Kwa tafsiri ya moja kwa moja, “katikati yake,” kwa kuwa neno “watu” katika Kiebrania linatazamwa kama kundi moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne za Kiebrania limetafsiriwa kwa umbo la kawaida la Kiswahili ‘Yahwe,’ badala ya kulibadilisha kuwa cheo kama ‘BWANA.’
- source_word: עַד אָנָה
  choice: Mpaka lini
  rationale: Hili ni swali la muda lenye uzito wa malalamiko; ‘Mpaka lini’ ni la kawaida na lenye nguvu katika Kiswahili.
- source_word: יְנַאֲצֻנִי
  choice: watanidharau
  rationale: Kitenzi נאץ kinaonyesha dharau inayoambatana na kumkataa au kumpuuza mtu; ‘watanidharau’ ni wazi, cha sasa, na kinahifadhi ukali wake.
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: ‘Watu hawa’ ni Kiswahili cha kawaida kwa kundi linalotajwa kwa sauti yenye umbali na kukemea, ingawa Kiebrania hutumia nomino ya umoja yenye maana ya mkusanyiko.
- source_word: לֹא יַאֲמִינוּ בִי
  choice: hawataniamini
  rationale: Muundo wa אמן pamoja na ב unaweza kumaanisha kumwamini au kumtumainia mtu. ‘Hawataniamini’ huhifadhi maana hiyo pana kwa Kiswahili cha kawaida.
- source_word: בְּכֹל הָאֹתוֹת
  choice: licha ya ishara zote
  rationale: 'Katika muktadha, kishazi hiki kinaonyesha hali inayopingana na kutokuamini kwao: wameona ishara zote, lakini bado hawaamini.'
- source_word: הָאֹתוֹת
  choice: ishara
  rationale: אוֹת ni ‘ishara’; muktadha unaonyesha matendo ya ajabu bila kuhitaji kuongeza kivumishi ‘za kimiujiza’ katika matini kuu.
- source_word: עָשִׂיתִי
  choice: nilizofanya
  rationale: Wakati uliopita wa Kiswahili unaonyesha matendo ambayo Mungu tayari amefanya na ambayo bado ni msingi wa swali lake.
- source_word: בְּקִרְבּוֹ
  choice: katikati yao
  rationale: Kiwakilishi cha Kiebrania ni cha umoja kwa sababu kinarejelea ‘watu’ kama kundi moja; Kiswahili cha kawaida hutumia wingi, ‘katikati yao.’
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Matini ya Kiebrania inatumia jina lenyewe la Mungu. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kuamini katika לֹא יַאֲמִינוּ בִי
  choice: hawataniamini
  alternative: hawatanitumainia
  rationale: Kiebrania kinaweza kuhusisha kukubali ukweli wa Mungu na pia kumtegemea. ‘Hawataniamini’ kinaacha upana huo, huku maana ya kumtumainia ikitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa moja kwa moja, na unaofaa kusomwa hadharani. Marudio ya ‘Mpaka lini’ yamehifadhiwa kwa ajili ya nguvu ya swali la Kiebrania.
