  yaml_path: translation/ot/numbers/014/013.yaml
  text: But Moses said to Yahweh[a], “Then the Egyptians will hear, for by your power you brought up this people from among them.”
translation:
  language: sw
  text: Lakini Musa akamwambia Yahweh, “Basi Wamisri watasikia, kwa maana kwa nguvu zako uliwaleta watu hawa kutoka miongoni mwao.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na Wamisri wamesikia, kwa maana kwa nguvu zako uliwaleta watu hawa kutoka miongoni mwao.” Umbo la kitenzi cha Kiebrania linaweza kueleweka kuwa la wakati uliopita au kama matokeo ya wakati ujao katika ombi la Musa; maandishi makuu yamechagua maana ya wakati ujao, inayolingana na hoja inayofuata.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini Musa akamwambia
  rationale: Waw-consecutive inaendeleza simulizi, lakini katika muktadha Musa anajibu tangazo la hukumu la Yahweh; “Lakini” huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וְשָׁמְעוּ
  choice: Basi Wamisri watasikia
  rationale: Muundo wa kitenzi unaweza kueleweka kama wakati uliopita au kama matokeo yajayo. Muktadha wa ombi la Musa unaunga mkono maana ya matokeo yajayo, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: מִצְרַיִם
  choice: Wamisri
  rationale: Ingawa neno linaweza kumaanisha nchi ya Misri au watu wake, kitendo cha kusikia hapa kinawaelekea watu.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inaleta msingi au maelezo ya kauli kuhusu Wamisri kusikia.
- source_word: הֶעֱלִיתָ
  choice: uliwaleta
  rationale: Hiphil ya עלה ina maana ya ‘kuleta juu’; katika Kiswahili, “uliwaleta” ni ya kawaida na inaeleza kuwatoa watu hao Misri bila kuingiza mwelekeo usio wa kawaida.
- source_word: בְכֹחֲךָ
  choice: kwa nguvu zako
  rationale: Kihusishi ב pamoja na כוח huonyesha njia au uwezo uliotumika.
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: Hili ni tamko la kawaida la Kiswahili kwa nomino ya mkusanyiko עם pamoja na kiashiria.
- source_word: מִקִּרְבּוֹ
  choice: kutoka miongoni mwao
  rationale: Kiambishi cha umoja kinarejelea Misri kama jumuiya; Kiswahili hutumia wingi wa watu kwa njia ya kawaida na iliyo wazi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Wakati wa וְשָׁמְעוּ katika hoja ya Musa
  choice: Wamisri watasikia
  alternative: Wamisri wamesikia
  rationale: Mfuatano wa hoja unaelekea kwenye matokeo ya hukumu iliyotangazwa, lakini umbo la Kiebrania linaweza pia kuchukuliwa kama tendo lililokamilika; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa mtiririko wa kawaida huku ikihifadhi hoja ya Musa na utata halisi wa wakati wa kitenzi kupitia tanbihi.
