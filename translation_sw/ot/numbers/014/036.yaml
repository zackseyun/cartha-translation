  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָ֣/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יָּשֻׁ֗בוּ ו/ילונו עָלָי/ו֙ אֶת כָּל הָ֣/עֵדָ֔ה לְ/הוֹצִ֥יא דִבָּ֖ה עַל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/036.yaml
  text: The men whom Moses sent to scout out the land returned and caused the whole congregation to grumble against him by bringing out a bad report about the land[a][b].
translation:
  language: sw
  text: Wale watu ambao Musa aliwatuma kuipeleleza nchi[a] walirudi, wakasababisha kusanyiko lote limnung’unikie kwa kueneza habari mbaya kuhusu nchi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuichunguza nchi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kutoa taarifa mbaya juu ya nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Wale watu
  rationale: Kifungu hiki kinawarejelea kwa uwazi wale wanaume waliotumwa; “wale watu” ni cha asili katika Kiswahili na kinaendeleza simulizi bila kuongeza kiashiria cha wakati kisichokuwapo katika Kiebrania.
- source_word: אֲשֶׁר שָׁלַח מֹשֶׁה
  choice: ambao Musa aliwatuma
  rationale: Hii inawakilisha kwa uwazi kishazi rejeshi ambacho watu ndio yambwa wa kitenzi “kutuma.”
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: kuipeleleza nchi
  rationale: Katika muktadha huu תור ina maana ya kuichunguza nchi kwa kusudi la kupata habari. “Kuipeleleza” ni Kiswahili cha kawaida kinachohifadhi wazo la upelelezi bila kulazimisha maana ya ujasusi wa kisiasa.
- source_word: וַיָּשֻׁבוּ
  choice: walirudi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kurudi katika simulizi.
- source_word: וילונו עָלָיו
  choice: wakasababisha ... limnung’unikie
  rationale: Muundo na yambwa inayofuata vinaonyesha maana ya kusababisha kusanyiko linung’unike dhidi ya Musa, si kwamba watu hao pekee ndio walionung’unika. “Kunung’unika” huhifadhi dhamira ya malalamiko ya jangwani.
- source_word: אֶת כָּל־הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה hapa ni jumuiya ya Israeli iliyokusanyika; “kusanyiko lote” ni wazi, lenye heshima, na linafaa muktadha wa Pentateuko.
- source_word: לְהוֹצִיא דִבָּה
  choice: kwa kueneza habari mbaya
  rationale: Kitenzi-jina kinaeleza njia iliyotumiwa kusababisha manung’uniko. “Kueneza habari mbaya” ni Kiswahili cha asili na kinaonyesha kwamba taarifa hiyo ilitolewa na kusambazwa kwa wengine.
- source_word: עַל־הָאָרֶץ
  choice: kuhusu nchi
  rationale: עַל hapa inaonyesha jambo lililokuwa mada ya habari hiyo; “kuhusu nchi” ndiyo kauli ya kawaida zaidi katika Kiswahili.
theological_decisions:
- issue: Mwelekeo wa manung’uniko katika וילונו עָלָיו
  choice: Kusanyiko lilisababishwa limnung’unikie Musa
  alternative: Watu waliotumwa wenyewe walimnung’unikia Musa
  rationale: 'Yambwa “kusanyiko lote” na muktadha vinaunga mkono nguvu ya kisababishi: wale watu walichochea manung’uniko ya jumuiya dhidi ya Musa. Tafsiri haiongezi hitimisho la kimadhehebu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Wale watu” husaidia urejeo wa simulizi, “kusanyiko” huhifadhi dhana ya jumuiya ya Israeli, na “kunung’unika” hudumisha msamiati wa malalamiko ya jangwani.
