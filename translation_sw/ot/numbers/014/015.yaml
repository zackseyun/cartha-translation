lexical_decisions:
- source_word: וְהֵמַתָּה
  choice: Na ukiwaua
  rationale: Hifili ya מות ina maana ya ‘kusababisha kufa/kuua.’ Ingawa וְ ni kiunganishi tu, muktadha wa hoja ya Musa una hali ya sharti, ambayo Kiswahili huiwasilisha kwa ‘uki-’.
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: עָם humaanisha jamii ya Israeli kwa ujumla; ‘watu hawa’ ni ya kawaida katika Kiswahili na inadumisha nguvu ya kiashiria.
- source_word: כְּאִישׁ אֶחָד
  choice: kana kwamba ni mtu mmoja
  rationale: Inahifadhi taswira ya Kiebrania ‘kama mtu mmoja’ huku ikisomeka kwa kawaida; nahau hiyo inaonyesha kuwa watu wote watauawa pamoja au mara moja.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: ‘Mataifa’ ndiyo maana ya kawaida ya גּוֹיִם hapa, yakitofautishwa na Israeli bila kuingiza dhana za baadaye za kidini.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת שִׁמְעֲךָ
  choice: yaliyosikia habari zako
  rationale: שֵׁמַע inaweza kumaanisha habari, taarifa, au sifa inayosikika. ‘Habari zako’ hudumisha uwezekano wa habari kumhusu Mungu au habari/sifa zake bila kuibana maana kuwa ‘umaarufu’ pekee.
- source_word: לֵאמֹר
  choice: yatasema,
  rationale: Kitenzi-jina hiki kinaanzisha maneno ya mataifa yanayofuata katika mstari unaofuata; Kiswahili cha kawaida kinahitaji ‘yatasema’.
theological_decisions:
- issue: Nahau ya kianthropolojia yenye nomino ya kiume katika umoja
  choice: kana kwamba ni mtu mmoja
  alternative: wote kwa pamoja / wote mara moja
  rationale: אִישׁ hapa ni sehemu ya nahau, si dai kwamba kundi hilo ni la wanaume pekee. Tafsiri inadumisha taswira na mvutano wa usemi wa chanzo, huku tanbihi ikifafanua maana yake ya ujumla.
- issue: Maana ya שִׁמְעֲךָ
  choice: habari zako
  alternative: sifa zako / habari zilizohusu wewe
  rationale: Neno linaweza kurejelea habari au sifa zilizosikika kuhusu Bwana. ‘Habari zako’ huhifadhi upana huo badala ya kuamua kimya kimya kuwa maana ni umaarufu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sharti umeonyeshwa kwa ‘uki-’; sentensi imeachwa wazi kwa koma kwa sababu maneno yatakayosemwa yanafuata katika mstari wa 16.
