  text: Na ukiwaua watu hawa kama mtu mmoja[a], mataifa yaliyosikia habari zako yatasema[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kama mtu mmoja,” nahau yenye maana ya watu wote pamoja au wote mara moja.'
