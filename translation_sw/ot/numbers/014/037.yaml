  text: וַ/יָּמֻ֨תוּ֙ הָֽ/אֲנָשִׁ֔ים מוֹצִאֵ֥י דִבַּת הָ/אָ֖רֶץ רָעָ֑ה בַּ/מַּגֵּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/037.yaml
  text: those men who had brought out a bad report about the land died by the plague before Yahweh.
translation:
  language: sw
  text: Wale watu walioleta habari mbaya kuhusu nchi walikufa kwa tauni mbele za Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֻתוּ
  choice: walikufa
  rationale: Kitenzi cha masimulizi katika Qal kinaeleza tukio la wakati uliopita; kiunganishi hakihitajiki hapa katika Kiswahili cha kawaida.
- source_word: הָאֲנָשִׁים
  choice: wale watu
  rationale: Kielezi “wale” kinaonyesha kwamba ni watu waliotajwa katika muktadha uliotangulia.
- source_word: מוֹצִאֵי דִבַּת הָאָרֶץ רָעָה
  choice: walioleta habari mbaya kuhusu nchi
  rationale: Muundo wa kishirikishi unawatambulisha kwa tendo lao la awali; “habari mbaya” huhifadhi maana hasi ya דִבָּה, huku “walioleta” ikidumisha taswira ya הוציא.
- source_word: בַּמַּגֵּפָה
  choice: kwa tauni
  rationale: Kirai kinaonyesha njia au chombo cha kifo; “tauni” ni neno la kawaida na lenye hadhi kwa pigo la mauti.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: “Mbele za” huonyesha kuwapo mbele ya Mungu na kudumisha uzito wa hukumu, huku jina la agano likitafsiriwa Yahweh.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina la agano bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Sentensi huhifadhi mtiririko wa simulizi na uzito wa hukumu bila kuongeza ufafanuzi wa kimadhehebu.
