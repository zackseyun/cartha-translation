  text: וַ/יֹּ֣אמֶר יְהוָ֔ה סָלַ֖חְתִּי כִּ/דְבָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/020.yaml
  text: And Yahweh said[a], “I have forgiven, according to your word.”
translation:
  language: sw
  text: Ndipo Yahwe akasema[a], “Nimesamehe kulingana na neno lako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimesamehe kama ulivyosema.”
    reason: Mbadala huu unaonyesha maana ya kawaida ya כִּדְבָרֶךָ kwa Kiswahili cha asili zaidi, huku maandishi makuu yakihifadhi kwa karibu zaidi muundo wa Kiebrania.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Waw-consecutive inaendeleza simulizi. “Ndipo ... akasema” ni ya asili katika Kiswahili na inaonyesha mwendelezo bila kuongeza maana isiyokuwamo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi unaolingana na tahajia na matamshi ya Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: סָלַחְתִּי
  choice: Nimesamehe
  rationale: Kitenzi hiki humaanisha kusamehe au kuondolea hatia. Kauli “Nimesamehe” inaonyesha tendo lililotimizwa lenye matokeo ya sasa, kulingana na hali timilifu ya Kiebrania.
- source_word: כִּדְבָרֶךָ
  choice: kulingana na neno lako
  rationale: Huhifadhi kwa karibu muundo wa Kiebrania, yaani “kulingana na neno lako,” na kuunganisha msamaha na maneno ya Musa bila kuyafasiri moja kwa moja kuwa ombi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku likifuata tahajia ya kawaida ya Kiswahili.
- issue: Upeo wa msamaha uliotangazwa
  choice: Nimesamehe kulingana na neno lako
  alternative: Nimewasamehe kabisa kama ulivyoomba
  rationale: Tafsiri haiongezi yambwa kama “wao,” wala neno “kabisa,” kwa kuwa hayajaelezwa katika mstari huu. Hivyo haiamui kimya kimya upeo wa msamaha au kuondolewa kwa matokeo yanayotajwa baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Kulingana na neno lako” ni rasmi kiasi lakini wazi, na husaidia kuhifadhi mvutano na ufupi wa kauli ya Kiebrania.
