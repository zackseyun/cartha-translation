base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/038.yaml
  text: But Joshua son of Nun and Caleb son of Jephunneh remained alive from among those men who had gone to spy out the land[a].
translation:
  language: sw
  text: Lakini Yoshua mwana wa Nuni na Kalebu mwana wa Yefune ndio waliobaki hai kati ya wale watu waliokuwa wameenda kuipeleleza nchi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuichunguza nchi” au “kuikagua nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: Lakini Yoshua
  rationale: Kiunganishi kimetafsiriwa kwa maana ya kulinganisha na waliokufa katika muktadha uliotangulia; jina limetoholewa kwa matumizi ya kawaida ya Kiswahili.
- source_word: בִּן נוּן
  choice: mwana wa Nuni
  rationale: Muundo wa ukoo umehifadhiwa kwa Kiswahili cha kawaida.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: na Kalebu mwana wa Yefune
  rationale: Kiunganishi kinamwunganisha Kalebu na Yoshua kama waokokaji wawili; majina yametoholewa kwa namna inayotambulika katika Kiswahili.
- source_word: חָיוּ
  choice: ndio waliobaki hai
  rationale: Huwasilisha maana ya kuendelea kuwa hai kwa kulinganisha na wale wengine waliokufa; 'ndio' huonyesha kwa kawaida kwamba hawa wawili ndio waliokuwa tofauti na kundi hilo.
- source_word: מִן הָאֲנָשִׁים הָהֵם
  choice: kati ya wale watu
  rationale: מִן inaonyesha kwamba Yoshua na Kalebu walikuwa wa pekee kutoka ndani ya kundi hilo; 'kati ya' ni usemi wa asili wa Kiswahili.
- source_word: הַהֹלְכִים
  choice: waliokuwa wameenda
  rationale: Kirai cha urejeshi kinaonyesha tendo lililotangulia katika simulizi na linafafanua wale watu.
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: kuipeleleza nchi
  rationale: Katika muktadha huu תור ni kuchunguza nchi kwa kusudi la upelelezi; tafsiri hii inafaa kwa safari ya wapelelezi bila kulazimisha maana ya ujasusi wa siri.
