base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/008.yaml
  text: If Yahweh delights in us[a], he will bring us into this land and give it to us—a land flowing with milk and honey.
translation:
  language: sw
  text: Ikiwa Yahweh anapendezwa nasi[a], atatuingiza katika nchi hii na kutupa nchi hii—nchi itiririkayo maziwa na asali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anatufurahia” au “anatufadhili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Huanzisha sharti halisi; inadumisha mvutano wa kauli bila kuibadili kuwa uhakika wa ‘wakati.’
- source_word: חָפֵץ בָּנוּ
  choice: anapendezwa nasi
  rationale: Huonyesha furaha au mtazamo wa kibali wa Yahweh kwa watu wake kwa Kiswahili cha kawaida na chenye heshima.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina la Mungu lililoandikwa moja kwa moja katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo.
- source_word: וְהֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: atatuingiza katika nchi hii
  rationale: Kitenzi kinaendeleza matokeo ya sharti, na ‘kuingiza katika’ kinafaa kwa muktadha wa kuingia Kanaani.
- source_word: וּנְתָנָהּ לָנוּ
  choice: na kutupa nchi hiyo
  rationale: ‘Kutoa’ ni maana ya moja kwa moja ya נתן; kurudia ‘nchi hiyo’ huweka wazi rejeo la kiambishi bila utata usio wa lazima.
- source_word: אֶרֶץ אֲשֶׁר הִוא זָבַת חָלָב וּדְבָשׁ
  choice: nchi inayotiririka maziwa na asali
  rationale: Huhifadhi taswira ya nahau ya Kiebrania inayoeleza rutuba na wingi, kwa usemi unaoeleweka katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia Tetragramatoni kama jina binafsi; ‘Yahweh’ huhifadhi jina hilo bila kulibadili kuwa cheo.
- issue: Maana ya חָפֵץ בָּנוּ
  choice: anapendezwa nasi
  alternative: anatukubali kwa kibali
  rationale: Chaguo hili huhifadhi maana ya kibinafsi na ya kihisia ya kupendezwa, huku tanbihi ikitaja uwezekano wa maana ya kutufadhili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sharti na taswira ya Kiebrania vimehifadhiwa bila kulainisha mvutano wa kiteolojia.
