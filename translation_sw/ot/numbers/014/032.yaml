  text: וּ/פִגְרֵי/כֶ֖ם אַתֶּ֑ם יִפְּל֖וּ בַּ/מִּדְבָּ֥ר הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/032.yaml
  text: But as for you[a], your dead bodies will fall in this wilderness.
translation:
  language: sw
  text: Lakini ninyi, maiti zenu zitaanguka katika nyika hii.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/פִגְרֵי/כֶם
  choice: maiti zenu
  rationale: פֶּגֶר humaanisha mwili uliokufa au maiti. “Maiti zenu” ni Kiswahili cha kawaida, chenye uzito unaofaa, na kinahifadhi picha halisi ya hukumu.
- source_word: אַתֶּם
  choice: Lakini ninyi
  rationale: Kiwakilishi huru אַתֶּם kina mkazo na nguvu ya kutofautisha. “Lakini ninyi” huonyesha kwa kawaida tofauti hiyo katika muktadha.
- source_word: יִפְּלוּ
  choice: zitaanguka
  rationale: נפל maana yake ya msingi ni kuanguka; hapa maiti ndizo kiima, hivyo “zitaanguka” huhifadhi usemi wa Kiebrania na maana yake ya kufa katika muktadha.
- source_word: בַּ/מִּדְבָּר
  choice: katika nyika
  rationale: מִדְבָּר ni eneo kame lisilokaliwa kwa kawaida. “Nyika” ni neno la kawaida katika Kiswahili cha Biblia na linafaa kwa mazingira ya Hesabu.
- source_word: הַ/זֶּה
  choice: hii
  rationale: Kionyeshi kinataja nyika maalumu walimokuwa ndani yake; “hii” hutoa maana hiyo bila kuongeza mkazo usiokuwapo.
theological_decisions:
- issue: Ukali na uhalisi wa picha ya hukumu katika פִגְרֵיכֶם
  choice: maiti zenu
  alternative: mizoga yenu
  rationale: “Maiti zenu” hudumisha tangazo la moja kwa moja na la kutisha la kifo bila kuongeza dharau ambayo “mizoga” mara nyingi huleta inaposemwa kuhusu wanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na mkali kama Kiebrania; “Lakini ninyi” huhifadhi msisitizo wa kiwakilishi, na “maiti zenu” huepuka lugha ya kale au ya dharau.
