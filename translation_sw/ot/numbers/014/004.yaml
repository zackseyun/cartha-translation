lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Wakaambiana
  rationale: Wayyiqtol ya אמר inaendeleza simulizi. Katika Kiswahili, “wakaambiana” huunganisha kwa kawaida kitendo cha kusema na maana ya kurudiana iliyomo katika אִישׁ אֶל אָחִיו.
- source_word: אִישׁ אֶל אָחִיו
  choice: wakaambiana
  rationale: Nahau hiyo kwa neno halisi ni “mtu kwa ndugu yake,” lakini hapa ina maana ya wao kusema wao kwa wao. Kiambishi cha kutendeana “-ana” kinawasilisha maana hiyo kwa Kiswahili cha kawaida bila kusisitiza jinsia.
- source_word: נִתְּנָה
  choice: Na tumweke
  rationale: Hii ni cohortative ya nafsi ya kwanza wingi ya נתן. Ikiwa na רֹאשׁ kama yambwa, ina maana ya kumweka au kumteua mtu kuwa mkuu. “Na tumweke” huhifadhi nguvu ya pendekezo la pamoja.
- source_word: רֹאשׁ
  choice: kiongozi
  rationale: Ingawa maana ya msingi ni “kichwa,” katika muktadha huu neno hilo humaanisha mtu anayewekwa juu ya kundi. “Kiongozi” ni wazi na la asili katika Kiswahili cha sasa.
- source_word: וְנָשׁוּבָה
  choice: turudi
  rationale: Cohortative ya שוב imeunganishwa na cohortative iliyotangulia. “Turudi” hudumisha wito wa pamoja bila ulazima wa kurudia “na” kwa namna nzito.
- source_word: מִצְרָיְמָה
  choice: Misri
  rationale: Kiishio cha mwelekeo kinaonyesha mwendo kuelekea Misri. Kitenzi “turudi” tayari kinaonyesha maana ya kurudi huko, hivyo “Misri” inatosha kwa Kiswahili.
