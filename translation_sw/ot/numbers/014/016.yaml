source:
  edition: WLC
  text: מִ/בִּלְתִּ֞י יְכֹ֣לֶת יְהוָ֗ה לְ/הָבִיא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣ע לָ/הֶ֑ם וַ/יִּשְׁחָטֵ֖/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/016.yaml
  text: Because Yahweh was not able to bring this people into the land that he swore to them[a], he slaughtered them in the wilderness.
translation:
  language: sw
  text: Kwa sababu Yahwe hakuweza kuwaingiza watu hawa katika nchi aliyowaapia, aliwachinja jangwani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבִּלְתִּי יְכֹלֶת
  choice: Kwa sababu ... hakuweza
  rationale: 'Muundo huu unaeleza sababu ambayo mataifa yangetoa katika muktadha: kwamba Yahwe hakuwa na uwezo. Kiswahili hiki ni cha kawaida na kinahifadhi madai hayo bila kuyapunguza.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo kama “BWANA”.
- source_word: לְהָבִיא אֶת הָעָם הַזֶּה
  choice: kuwaingiza watu hawa
  rationale: Hifili ya בוא ina maana ya kusababisha waingie. “Kuwaingiza” ni sahihi na ya asili zaidi hapa kuliko “kuwaleta,” hasa kwa kuwa mahali panapolengwa ni nchi.
- source_word: אֶל הָאָרֶץ
  choice: katika nchi
  rationale: Inaonyesha kuingia ndani ya nchi, si kuelekea huko tu.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: aliyoapa kuwapa
  rationale: Kitenzi kinaeleza kiapo alichowaapia; “kuwapa” kimetolewa na muktadha wa ahadi ya nchi na hufanya sentensi iwe ya asili katika Kiswahili. Tanbihi inahifadhi muundo wa karibu zaidi na Kiebrania.
- source_word: וַיִּשְׁחָטֵם
  choice: aliwachinja
  rationale: “Kuchinja” kinahifadhi ukali wa שׁחט na madai mazito yanayowekwa kinywani mwa mataifa; “kuwaua” kingepunguza nguvu hiyo.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: Ni tafsiri ya kawaida na ya asili ya mazingira ya מִדְבָּר katika simulizi hili.
theological_decisions:
- issue: Madai ya mataifa kuhusu uwezo wa Yahwe
  choice: Yahwe hakuweza
  alternative: Yahwe hakutaka
  rationale: Kiebrania kinawasilisha madai kwamba Yahwe hakuwa na uwezo, si kwamba hakutaka. Tafsiri inahifadhi mvutano huo wa usemi katika muktadha bila kuufanya kuwa tamko la moja kwa moja la msimulizi kuhusu asili ya Mungu.
- issue: Yaliyomo katika kiapo kuhusu nchi
  choice: aliyoapa kuwapa
  alternative: aliyowaapia
  rationale: “Kuwapa” haijasemwa wazi kama kitenzi tofauti katika Kiebrania, lakini ndiyo yaliyomo katika kiapo kulingana na muktadha. Chaguo kuu linaweka Kiswahili cha asili, huku tanbihi ikionyesha muundo wa kifupi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Watu hawa” ni cha asili kwa nomino ya pamoja, na “aliwachinja” huhifadhi ukali wa shtaka la mataifa.
