source:
  edition: WLC
  text: בַּ/מִּדְבָּ֣ר הַ֠/זֶּה יִפְּל֨וּ פִגְרֵי/כֶ֜ם וְ/כָל פְּקֻדֵי/כֶם֙ לְ/כָל מִסְפַּרְ/כֶ֔ם מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה אֲשֶׁ֥ר הֲלִֽינֹתֶ֖ם עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/029.yaml
  text: In this wilderness your dead bodies will fall[a], all of you who were counted according to your whole number, from twenty years old and upward[c][b], who have grumbled against me.
translation:
  language: sw
  text: Katika nyika hii maiti zenu zitaanguka[a]—ninyi nyote mliohesabiwa, kwa jumla yenu yote[b], wenye umri wa miaka ishirini na zaidi, ambao mlilinung’unika dhidi yangu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mizoga yenu itaanguka.” Kiebrania kina usemi mkali na halisi unaokazia miili ya waliokufa katika nyika.
    reason: lexical_alternative
  - marker: b
    text: “Mliohesabiwa” huwarejelea walioandikishwa katika sensa, ambayo pia ilikuwa orodha ya wanaume walioweza kwenda vitani.
    reason: cultural_note
  - marker: c
    text: Au, “mlilalamika dhidi yangu.” Neno la Kiebrania lina maana ya kunung’unika kwa upinzani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: Katika nyika hii
  rationale: Neno מִדְבָּר humaanisha eneo la nyika au jangwa. “Nyika” ni neno la kawaida na lenye hadhi katika Kiswahili, nalo linafaa kwa mazingira ya safari ya Israeli.
- source_word: יִפְּלוּ פִגְרֵיכֶם
  choice: maiti zenu zitaanguka
  rationale: Tafsiri hii inadumisha picha halisi ya kitenzi נפל, “kuanguka,” pamoja na maana ya פגר, “maiti,” badala ya kuirahisisha kuwa “mtakufa.”
- source_word: וְכָל פְּקֻדֵיכֶם לְכָל מִסְפַּרְכֶם
  choice: ninyi nyote mliohesabiwa katika hesabu yenu yote
  rationale: פְּקֻדֵיכֶם huwarejelea walioandikishwa katika sensa au mkusanyo wa kijeshi, na kifungu kinachofuata kinakazia jumla nzima ya waliohesabiwa.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: wenye umri wa miaka ishirini na zaidi
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kueleza kiwango cha umri kinachoanzia miaka ishirini.
- source_word: אֲשֶׁר הֲלִינֹתֶם עָלָי
  choice: ambao mlilinung’unika dhidi yangu
  rationale: Katika masimulizi ya jangwani, לון hueleza manung’uniko ya uasi. “Kuninung’unikia” huhifadhi wazo la malalamiko ya chinichini yenye upinzani.
theological_decisions:
- issue: Uzito na uhalisi wa hukumu iliyotangazwa
  choice: Kudumisha maneno halisi “maiti zenu zitaanguka.”
  alternative: “mtakufa katika nyika hii”
  rationale: Kiebrania kinakazia vifo vya kimwili kama hukumu, hivyo picha kali ya maiti zinazoanguka haipaswi kufupishwa kuwa taarifa ya jumla tu kuhusu kufa.
- issue: Mhusika anayelengwa na hukumu
  choice: Kuwatambulisha kama wote waliohesabiwa wenye umri wa miaka ishirini na zaidi ambao walinung’unika.
  alternative: Kuitafsiri hukumu kana kwamba inawahusu Waisraeli wote bila sifa hizi.
  rationale: Vifungu vya Kiebrania vinaweka mipaka ya kundi kwa sensa, umri, na tendo la kunung’unika; tafsiri inadumisha mipaka hiyo bila kuongeza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. “Nyika,” “maiti,” na “kunung’unika” hudumisha uzito wa kifungu bila kuwa ya kizamani. Kistari kirefu kinaonyesha kwamba maneno yanayofuata yanafafanua wale ambao maiti zao zitaanguka.
