base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/025.yaml
  text: The Amalekites and the Canaanites are living in the valley[a]. Tomorrow turn and set out for yourselves into the wilderness by the way of the Red Sea.
translation:
  language: sw
  text: Waamaleki na Wakanaani wanaishi bondeni. Kesho geukeni, kisha safirini kuelekea jangwani kwa njia ya Bahari ya Shamu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Bahari ya Matete.” Kwa kawaida huitwa “Bahari ya Shamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: Nao Waamaleki na Wakanaani
  rationale: Majina ya watu yaliyo katika umoja wa Kiebrania yana maana ya makundi kwa ujumla, hivyo yametafsiriwa kwa wingi. “Nao” linawakilisha kiunganishi cha mwanzo kwa Kiswahili cha kawaida bila kuingiza wazo la wakati lisilokuwamo katika chanzo.
- source_word: יוֹשֵׁב
  choice: wanaishi
  rationale: Hali ya kitenzi inaonyesha ukaaji unaoendelea; “wanaishi” ni ya asili na inaeleweka kwa urahisi.
- source_word: בָּעֵמֶק
  choice: bondeni
  rationale: עֵמֶק humaanisha bonde au eneo la chini; “bondeni” ni tafsiri fupi na ya kawaida.
- source_word: מָחָר
  choice: Kesho
  rationale: Kielezi hiki humaanisha siku inayofuata.
- source_word: פְּנוּ
  choice: geukeni
  rationale: Amri ya wingi inaagiza kubadili mwelekeo bila kusema wazi “rudi,” hivyo “geukeni” huhifadhi upeo wa chanzo.
- source_word: וּסְעוּ
  choice: mwondoke
  rationale: Katika muktadha wa safari, נסע humaanisha kuondoa kambi na kuanza kusafiri; “mwondoke” huwasilisha amri hiyo kwa Kiswahili cha asili.
- source_word: לָכֶם
  choice: imewakilishwa katika umbo la amri ya wingi
  rationale: Dhamiri hii huongeza mkazo kwa wanaoamriwa, lakini tafsiri ya neno kwa neno kama “kwa ajili yenu wenyewe” ingekuwa nzito na ingeweza kupotosha maana. Umbo la wingi “geukeni, mwondoke” linaelekeza amri kwao wazi.
- source_word: הַמִּדְבָּר
  choice: jangwani
  rationale: מִדְבָּר ni eneo kame au lisilokaliwa sana, si lazima jangwa la mchanga; “jangwani” ni neno la kawaida katika muktadha huu wa safari ya Israeli.
- source_word: דֶּרֶךְ יַם סוּף
  choice: kwa njia ya Bahari ya Shamu
  rationale: דֶּרֶךְ huonyesha njia au mwelekeo. “Bahari ya Shamu” ni jina la jadi na linalotambulika sana kwa יַם סוּף, huku maana yake ya karibu zaidi ikielezwa katika tanbihi.
