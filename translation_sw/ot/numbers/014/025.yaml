  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya moja kwa moja na inaendeleza amri za wingi za chanzo. Alama ya tanbihi imewekwa baada ya “Bahari ya Shamu,” ambako maelezo yake yanahusika.
