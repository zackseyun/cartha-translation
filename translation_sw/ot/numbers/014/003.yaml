base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/003.yaml
  text: And why is Yahweh bringing us into this land to fall by the sword? Our wives and our little ones will become plunder[a]. Would it not be better for us to return to Egypt?
translation:
  language: sw
  text: Na kwa nini Yahweh anatuleta katika nchi hii ili tuanguke kwa upanga? Wake zetu na watoto wetu wadogo watakuwa nyara[a]. Je, si afadhali turudi Misri?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mawindo”; neno la Kiebrania linaweza kumaanisha watu au vitu vinavyotekwa na adui kama nyara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Kwa nini basi
  rationale: Kiunganishi וְ kinaendeleza malalamiko yaliyotangulia; “basi” hudumisha mtiririko huo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa Tetragramatoni limehifadhiwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: מֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: anatuleta katika nchi hii
  rationale: Kauli ya wakati unaoendelea au unaokaribia imewasilishwa kwa umbo la sasa; “katika nchi hii” huonyesha mwendo wa kuingia.
- source_word: לִנְפֹּל בַּחֶרֶב
  choice: ili tuanguke kwa upanga
  rationale: Nahau ya Kiebrania ya kufa vitani imehifadhiwa kwa namna inayoeleweka katika Kiswahili.
- source_word: נָשֵׁינוּ
  choice: wake zetu
  rationale: Katika muktadha wa familia, neno hilo linarejelea wake, si wanawake kwa ujumla.
- source_word: וְטַפֵּנוּ
  choice: na watoto wetu wadogo
  rationale: טַף hukazia watoto wadogo au wategemezi walio dhaifu; tafsiri hii huhifadhi mkazo huo.
- source_word: יִהְיוּ לָבַז
  choice: watakuwa nyara
  rationale: בַּז hurejelea vitu au watu wanaotekwa na adui; “nyara” linafaa katika muktadha wa vita, huku uwezekano wa maana ya mawindo ukibainishwa katika tanbihi.
- source_word: הֲלוֹא טוֹב לָנוּ שׁוּב מִצְרָיְמָה
  choice: Je, si afadhali turudi Misri?
  rationale: Swali la balagha limewasilishwa kwa Kiswahili asilia; “turudi” huhifadhi wazo la kurejea walikotoka.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahweh” hulihifadhi badala ya kuweka cheo mahali pake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa wasomaji wengi, huku nahau ya “kuanguka kwa upanga” na uzito wa malalamiko ya watu vikihifadhiwa.
