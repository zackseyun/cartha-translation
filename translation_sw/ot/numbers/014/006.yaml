  yaml_path: translation/ot/numbers/014/006.yaml
  text: And Joshua son of Nun and Caleb son of Jephunneh[a], from those who had spied out the land[b], tore their clothes.
translation:
  language: sw
  text: Yoshua mwana wa Nuni na Kalebu mwana wa Yefune, waliokuwa miongoni mwa wale walioupeleleza nchi, wakararua mavazi yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kurarua mavazi kulikuwa desturi ya kuonyesha huzuni, mshtuko mkubwa, au dhiki.
    reason: cultural_note
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: Lakini Yoshua
  rationale: Kiunganishi ו kinaunganisha simulizi na pia, katika muktadha, kinaonyesha tofauti kati ya Yoshua na Kalebu na mkutano uliokuwa ukilalamika; “Lakini” huleta tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: בִּן נוּן
  choice: mwana wa Nuni
  rationale: Muundo huu wa nasaba umetafsiriwa kwa njia ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: na Kalebu mwana wa Yefune
  rationale: Kiunganishi kinawaunganisha Kalebu na Yoshua kama wahusika wa tendo moja; majina yameandikwa kwa maumbo yanayotambulika katika Kiswahili.
- source_word: מִן הַתָּרִים
  choice: miongoni mwa wale walioipeleleza
  rationale: 'מִן hapa lina maana ya kuwa sehemu ya kundi: Yoshua na Kalebu walikuwa miongoni mwa wapelelezi. Kauli ya Kiswahili inaonyesha tendo lililotangulia kwa kawaida.'
- source_word: אֶת הָאָרֶץ
  choice: nchi
  rationale: אֶת ni alama ya yambwa na haitafsiriwi; הָאָרֶץ ni “nchi” inayojulikana katika muktadha, bila kuongeza jina lisilotajwa katika mstari huu.
- source_word: קָרְעוּ
  choice: wakararua
  rationale: Kitenzi kina maana ya kurarua au kuchana; “wakararua” ni cha sasa, wazi, na kinafaa kwa tendo la makusudi.
- source_word: בִּגְדֵיהֶם
  choice: mavazi yao
  rationale: “Mavazi” ni neno la heshima na la kawaida linalowasilisha maana ya nguo walizokuwa wamevaa.
