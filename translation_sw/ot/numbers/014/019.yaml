  variant: Standard East African Swahili
source:
  edition: WLC
  text: סְלַֽח נָ֗א לַ/עֲוֺ֛ן הָ/עָ֥ם הַ/זֶּ֖ה כְּ/גֹ֣דֶל חַסְדֶּ֑/ךָ וְ/כַ/אֲשֶׁ֤ר נָשָׂ֨אתָה֙ לָ/עָ֣ם הַ/זֶּ֔ה מִ/מִּצְרַ֖יִם וְ/עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/019.yaml
  text: Please forgive the iniquity of this people according to the greatness of your steadfast love[a], just as you have forgiven this people from Egypt until now.
translation:
  language: sw
  text: Tafadhali usamehe uovu wa watu hawa kwa kadiri ya ukuu wa upendo wako thabiti, kama vile ulivyowavumilia watu hawa tangu Misri mpaka sasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama vile ulivyowasamehe watu hawa tangu Misri mpaka sasa.” Kitenzi cha Kiebrania kinaweza kumaanisha “kubeba,” na katika baadhi ya miktadha, “kusamehe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סְלַח נָא
  choice: Tafadhali usamehe
  rationale: Amri סלח pamoja na chembe נָא ni ombi la dhati; “Tafadhali usamehe” huwasilisha kwa Kiswahili cha kawaida ombi hilo lenye uzito na unyenyekevu.
- source_word: לַעֲוֺן
  choice: uovu
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au matokeo ya kosa. “Uovu” huhifadhi uzito wa kimaadili bila kuifanya maana kuwa hatia pekee au adhabu yake.
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: Ingawa עַם ni nomino ya umoja yenye maana ya mkusanyiko, Kiswahili sanifu hutumia kwa kawaida “watu hawa” kwa kurejelea jamii hii.
- source_word: כְּגֹדֶל חַסְדֶּךָ
  choice: kwa kadiri ya ukuu wa upendo wako thabiti
  rationale: גֹּדֶל ni “ukuu,” na חֶסֶד ni upendo mwaminifu na wa kudumu, mara nyingi katika muktadha wa agano. “Upendo wako thabiti” huhifadhi wazo hilo kuliko “upendo” peke yake.
- source_word: וְכַאֲשֶׁר
  choice: kama vile
  rationale: Kiunganishi hiki kinaonyesha ulinganisho na matendo ya Mungu yaliyotangulia; “kama vile” ni usemi wa asili wa Kiswahili.
- source_word: נָשָׂאתָה
  choice: ulivyowavumilia
  rationale: נשא kimsingi ni kubeba au kuchukua, na katika baadhi ya miktadha humaanisha kusamehe. Kwa kuwa hapa kitu cha moja kwa moja ni watu wenyewe, “kuwavumilia” huonyesha ustahimilivu wa Mungu bila kuondoa uwezekano wa maana ya kusamehe, unaotajwa katika tanbihi.
- source_word: מִמִּצְרַיִם וְעַד הֵנָּה
  choice: tangu Misri mpaka sasa
  rationale: Kirai hiki kinaonyesha mwendelezo kutoka Misri hadi wakati au mahali pa sasa; “tangu Misri mpaka sasa” huwasilisha muda huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya נָשָׂאתָה katika ombi la Musa
  choice: Matendo ya Mungu ya awali yanaelezwa kuwa kuwavumilia au kuwabeba watu, yakidokeza subira ya muda mrefu inayohusisha msamaha lakini haipunguzwi kuwa msamaha pekee.
  alternative: Umewasamehe watu hawa tangu Misri mpaka sasa.
  rationale: Kwa kuwa kitu cha moja kwa moja ni “watu hawa,” si “uovu wao,” maana pana ya kubeba au kuvumilia inafaa zaidi. Tanbihi huhifadhi maana nyingine halali ya “kusamehe” bila kufuta mvutano wa kileksia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa wasomaji wa kawaida huku ukihifadhi uzito wa ombi, maana ya חֶסֶד, na utata halisi wa נָשָׂאתָה.
