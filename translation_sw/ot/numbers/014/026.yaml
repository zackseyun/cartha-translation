lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Katika fomula hii ya hotuba ya Mungu, kitenzi דבר pamoja na אֶל huonyesha kwamba Yahwe aliwahutubia Musa na Aroni; “akasema na” ni Kiswahili cha kawaida na chenye heshima.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne YHWH limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: na Musa na Aroni
  rationale: אֶל hutaja waelekezewa wa hotuba. Kiswahili cha asili hutumia “sema na”; kiunganishi cha pili kinamhusisha Aroni wazi kama mhutubiwa wa pili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hii ni fomula inayounganisha kitendo cha kusema na maneno yanayonukuliwa katika mstari unaofuata; “akisema” huhifadhi uhusiano huo rasmi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo; tanbihi inaeleza desturi nyingine ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kawaida lakini wa heshima. Muundo wa kifomula “akisema” umehifadhiwa kwa sababu hotuba yenyewe inaanza katika mstari unaofuata.
