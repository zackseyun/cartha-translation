  yaml_path: translation/ot/numbers/014/042.yaml
  text: Do not go up[a], for Yahweh is not among you[b], so that you may not be struck down before your enemies.
translation:
  language: sw
  text: Msipande, kwa maana Yahweh hayuko katikati yenu[a], msije mkapigwa[b] mbele ya adui zenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwenu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mkashindwa mbele ya adui zenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּעֲלוּ
  choice: Msipande
  rationale: Kikanushi אַל pamoja na kitenzi cha hali ya kusihi/kukataza hutoa katazo. Kitenzi עלה humaanisha kupanda au kwenda juu; katika muktadha huu wa kijeshi na kijiografia, “msipande” ni fupi na ya asili huku ikihifadhi taswira ya Kiebrania.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya katazo lililotangulia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֵין יְהוָה בְּקִרְבְּכֶם
  choice: Yahweh hayuko katikati yenu
  rationale: Muundo huu unakanusha kuwapo kwa Yahweh ndani ya kusanyiko. “Katikati yenu” huhifadhi maana ya mahali na uwepo wa kijumuiya ya קֶרֶב.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: msije mkashindwa
  rationale: Katika onyo hili, וְלֹא linaonyesha matokeo mabaya yanayopaswa kuepukwa, ambayo Kiswahili huyatoa kwa kawaida kwa “msije.” Kitenzi נגף katika muktadha wa vita kinaweza kumaanisha kupigwa au kushindwa.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: mbele ya adui zenu
  rationale: Huu ni usemi wa kawaida wa Kiebrania unaoeleza kushindwa katika kukabiliana na adui.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi יהוה. “Yahweh” hulihifadhi kama jina bila kulibadilisha kuwa cheo.
- issue: Maana ya uwepo wa Mungu katika בְּקִרְבְּכֶם
  choice: hayuko katikati yenu
  alternative: hayuko pamoja nanyi
  rationale: “Katikati yenu” huhifadhi lugha halisi ya uwepo ndani ya jumuiya bila kuongeza maelezo ya kiteolojia yasiyosemwa moja kwa moja.
- issue: Nguvu ya תִּנָּגְפוּ katika muktadha wa vita
  choice: mkashindwa
  alternative: mkapigwa na kuanguka
  rationale: Kitenzi kinaweza kueleza kupigwa na pia kushindwa vitani. Tafsiri kuu inatumia Kiswahili cha kawaida, na tanbihi inahifadhi taswira kali zaidi ya kupigwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Msipande” huhifadhi ufupi wa katazo na mwelekeo wa kijiografia; “msije mkashindwa” ni onyo la kawaida na la asili katika Kiswahili.
