base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/034.yaml
  text: According to the number of the days in which you spied out the land, forty days, a day for a year, a day for a year, you shall bear your iniquities forty years, and you shall know my opposition.
translation:
  language: sw
  text: Kwa hesabu ya siku mlizopeleleza nchi, siku arobaini—siku moja kwa mwaka mmoja, siku moja kwa mwaka mmoja—mtabeba hatia zenu kwa miaka arobaini, nanyi mtajua upinzani wangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “kujitenga kwangu,” “uhasama wangu,” au “kutoridhika kwangu.” Tafsiri za jadi mara nyingi zina “kuvunja kwangu ahadi,” lakini huenda neno la Kiebrania linamaanisha upinzani au kujitenga kwa BWANA na kizazi hiki kilichoasi, wala si kwamba Mungu alishindwa kutimiza ahadi yake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר הַיָּמִים
  choice: Kwa kadiri ya hesabu ya siku
  rationale: Muundo wa ב pamoja na מִסְפָּר unaonyesha uwiano kati ya siku za kuipeleleza nchi na miaka ya hukumu. Tafsiri hii inadumisha uhusiano huo wazi kwa Kiswahili.
- source_word: תַּרְתֶּם
  choice: mlizoipeleleza
  rationale: Katika muktadha huu kitenzi תור kinahusu kazi ya upelelezi wa Kanaani, si kutalii tu. ‘Kuipeleleza’ ni ya kawaida na sahihi katika Kiswahili.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Neno hili linarejelea nchi waliyoahidiwa. ‘Nchi’ ni tafsiri ya kawaida inayotosha bila kuongeza ufafanuzi usio katika mstari.
- source_word: אַרְבָּעִים יוֹם
  choice: siku arobaini
  rationale: Ni tafsiri ya moja kwa moja ya namba na nomino.
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: siku moja kwa mwaka mmoja, siku moja kwa mwaka mmoja
  rationale: Marudio ya Kiebrania yanaweka mkazo na kueleza uwiano wa siku arobaini na miaka arobaini; yamehifadhiwa badala ya kufupishwa.
- source_word: תִּשְׂאוּ אֶת עֲוֺנֹתֵיכֶם
  choice: mtabeba hatia zenu
  rationale: Nahau נשא עון hujumuisha kubeba hatia na matokeo yake. ‘Mtabeba hatia zenu’ inadumisha taswira ya mzigo na uzito wa kimaadili bila kuifafanua tu kuwa ‘mtaadhibiwa.’
- source_word: אַרְבָּעִים שָׁנָה
  choice: miaka arobaini
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kipindi cha hukumu.
- source_word: וִידַעְתֶּם
  choice: nanyi mtajua
  rationale: ידע inaweza kumaanisha kujua kwa uzoefu. ‘Mtajua’ inadumisha upana huo bila kulazimisha maana moja tu.
- source_word: תְּנוּאָתִי
  choice: upinzani wangu
  rationale: Nomino hii adimu inaweza kueleza upinzani, kujitenga, uhasama, au kutoridhika. ‘Upinzani wangu’ inafaa muktadha wa hukumu na haidokezi kwamba BWANA alivunja ahadi yake.
theological_decisions:
- issue: Maana ya תְּנוּאָתִי katika kauli ya hukumu ya Mungu
  choice: upinzani wangu
  alternative: kujitenga kwangu; uhasama wangu; kutoridhika kwangu; kuvunja kwangu ahadi
  rationale: Neno la Kiebrania ni adimu na lina mvutano halisi wa kileksia. ‘Upinzani wangu’ linaonyesha msimamo wa hukumu wa Mungu dhidi ya kizazi kilichoasi bila kudai kwamba Mungu hakutimiza ahadi. Maana nyingine zinazowezekana zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘siku moja kwa mwaka mmoja’ yamehifadhiwa kwa sababu ni mkazo wa makusudi katika Kiebrania. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachohusika.
