base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/031.yaml
  text: But your little ones[a], whom you said would become plunder, I will bring in[c][b], and they will know the land that you rejected.
translation:
  language: sw
  text: Lakini watoto wenu wadogo, ambao mlisema wangekuwa nyara[a], nitawaingiza, nao wataijua[b] nchi ambayo mliikataa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wangekuwa windo” au “wangekuwa ngawira.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wataifahamu kwa uzoefu.” Kitenzi cha Kiebrania kinachotafsiriwa “kujua” hapa kinaweza kumaanisha kuifahamu nchi kwa kuingia na kuishi humo.
    reason: lexical_alternative
  - marker: c
    text: Au, “mliyoidharau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: watoto wenu wadogo
  rationale: Neno טַף humaanisha hasa watoto wadogo na linasisitiza udhaifu wao katika muktadha huu; tafsiri hii ni ya kawaida na wazi kwa Kiswahili.
- source_word: לָבַז
  choice: wangekuwa nyara
  rationale: בַּז ni mali au watu wanaotekwa na adui vitani. ‘Nyara’ huhifadhi picha ya muktadha wa kijeshi bila kuleta picha ya mnyama anayewindwa.
- source_word: וְהֵבֵיאתִי אֹתָם
  choice: nitawaingiza
  rationale: Hifili ya בוא hapa ina maana ya kusababisha waingie; mahali wanapoingizwa panaeleweka kuwa nchi inayotajwa baadaye.
- source_word: וְיָדְעוּ
  choice: wataijua
  rationale: יָדַע kimsingi ni ‘kujua,’ lakini hapa inaweza kumaanisha kuijua nchi kwa kuingia na kuishi humo. ‘Wataijua’ huhifadhi upana huo wa maana.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha huu הָאָרֶץ ni nchi iliyokuwa mbele yao; ‘nchi’ ni tafsiri ya kawaida bila kuongeza ‘ya ahadi’ au ‘Kanaani,’ maneno yasiyopo katika mstari.
- source_word: מְאַסְתֶּם בָּהּ
  choice: mliikataa
  rationale: מָאַס inaweza kumaanisha kukataa, kudharau, au kutupilia mbali. ‘Mliikataa’ huonyesha uamuzi wao wa kuikataa nchi bila kulazimisha kiwango kikali zaidi cha hisia.
theological_decisions:
- issue: Iwapo kuitaja wazi nchi kuwa nchi ya ahadi au Kanaani
  choice: Kubaki na ‘nchi’ katika matini kuu
  alternative: ‘nchi ya ahadi’ au ‘nchi ya Kanaani’
  rationale: Kiebrania kinasema tu ‘nchi.’ Muktadha unatambulisha nchi hiyo, hivyo kuongeza maelezo hayo kungeingiza maneno yasiyomo katika mstari.
- issue: Maana ya ‘kujua’ nchi
  choice: Kuhifadhi kitenzi ‘wataijua’ huku tanbihi ikionyesha maana ya uzoefu
  alternative: ‘wataishi katika nchi hiyo’ au ‘wataipata nchi hiyo’
  rationale: Kitenzi cha Kiebrania יָדַע kinaweza kuwa na maana ya ufahamu unaotokana na uzoefu. Tafsiri halisi kiasi inadumisha mvutano na upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umewekwa wa asili kwa Kiswahili, na viwakilishi vya ngeli vimefanya uhusiano wa ‘nchi’ kuwa wazi. Alama zote za tanbihi [a], [b], na [c] zimewekwa katika matini kuu.
