review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the oath formula, divine glory, and broad scope of הארץ. However, וְיִמָּלֵא is Niphal and is best represented here by a passive/resultative construction: the earth is to be filled with Yahweh’s glory. Rendering it actively as “utukufu wa Yahwe utaijaza dunia yote” changes the source construction and makes the glory the direct agent.'
  naturalness: The revised passive wording is natural, clear Standard East African Swahili and retains the solemn register appropriate to a divine oath.
  terminology: “Utukufu wa Yahwe” is appropriate for כְבוֹד יְהוָה. “Dunia yote” suitably expresses the likely universal sense of הארץ, while the footnote preserves the legitimate alternative “nchi yote.”
  issues:
  - severity: medium
    issue: The Niphal verb וְיִמָּלֵא is rendered with an active transitive verb, “utaijaza.”
    rationale: In this clause the Hebrew most naturally means that all the earth will be filled with Yahweh’s glory. A passive Swahili rendering preserves the source voice/resultative sense without resolving the grammatical issue in favor of an active agent construction.
  revised_text: Lakini, kama niishivyo mimi, dunia yote itajazwa na utukufu wa Yahwe.[a]
  revised_footnotes:
  - marker: a
    text: Au “nchi yote”; neno la Kiebrania אֶרֶץ linaweza kumaanisha “dunia” au “nchi.”
    reason: lexical_alternative
