source:
  edition: WLC
  text: וְ/אוּלָ֖ם חַי אָ֑נִי וְ/יִמָּלֵ֥א כְבוֹד יְהוָ֖ה אֶת כָּל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/021.yaml
  text: But as I live[a], the glory of Yahweh will fill all the earth.
translation:
  language: sw
  text: Lakini, kama niishivyo mimi, dunia yote itajazwa na utukufu wa Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi yote”; neno la Kiebrania אֶרֶץ linaweza kumaanisha “dunia” au “nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Lakini kwa hakika
  rationale: Kirai hiki kinaonyesha tofauti yenye mkazo na maneno yaliyotangulia; “Lakini kwa hakika” huhifadhi nguvu hiyo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: חַי אָ֑נִי
  choice: kama niishivyo
  rationale: Hii ni kauli ya kiapo cha Mungu. “Kama niishivyo” ni usemi wa Kiswahili unaohifadhi uzito na muundo wa kiapo hicho.
- source_word: וְיִמָּלֵא
  choice: utaijaza
  rationale: Ingawa kitenzi cha Kiebrania kiko katika muundo wa Nifali, sentensi humtaja “utukufu wa Yahwe” pamoja na “dunia yote.” Tafsiri ya kutenda, “utaijaza,” ni wazi na ya asili, huku ikitoa maana ya utukufu kuenea katika eneo lote.
- source_word: כְבוֹד
  choice: utukufu
  rationale: “Utukufu” ndilo neno la kawaida na linalofaa kwa כָּבוֹד inapomhusu Mungu; linaweza kuonyesha ukuu, heshima, na uwepo wake wenye uzito.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” huwakilisha jina la Mungu lililoandikwa katika matini ya Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: אֶת כָּל הָאָרֶץ
  choice: dunia yote
  rationale: Katika muktadha huu, “dunia yote” huwasilisha kwa kawaida upeo mpana wa tamko. Kwa kuwa אֶרֶץ pia linaweza kumaanisha “nchi,” uwezekano huo umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Upeo wa הָאָרֶץ
  choice: dunia yote
  alternative: nchi yote
  rationale: Kiapo na tamko kuhusu utukufu wa Yahwe vinaelekea kuonyesha upeo wa dunia nzima. Hata hivyo, neno la Kiebrania linaweza pia kuwa na maana ya eneo au nchi fulani, kwa hiyo tafsiri hiyo mbadala haijaondolewa.
- issue: Uhusiano wa kisarufi kati ya utukufu wa Yahwe na dunia yote
  choice: utukufu wa Yahwe utaijaza dunia yote
  alternative: dunia yote itajazwa na utukufu wa Yahwe
  rationale: Tafsiri ya kutenda hufuata mpangilio wa majina katika Kiebrania na ni ya asili katika Kiswahili. Tafsiri ya kutendwa inawezekana pia kutokana na muundo wa kitenzi, lakini haibadili kiini cha tamko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, rahisi kueleweka, na yenye hadhi inayofaa kiapo cha Mungu. Jina “Yahwe” limetumiwa moja kwa moja, na tanbihi imewekwa baada ya kirai kinachohusika.
