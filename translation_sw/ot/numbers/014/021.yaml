  rationale: 'The text has been revised only to represent the Niphal form of מלא with a natural passive construction in Kiswahili: “dunia yote itajazwa na utukufu wa Yahwe.” The footnote is retained because אֶרֶץ can denote either “earth/world” or “land.”'
