source:
  edition: WLC
  text: אֲנִ֣י יְהוָה֮ דִּבַּרְתִּי֒ אִם לֹ֣א זֹ֣את אֶֽעֱשֶׂ֗ה לְ/כָל הָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את הַ/נּוֹעָדִ֖ים עָלָ֑/י בַּ/מִּדְבָּ֥ר הַ/זֶּ֛ה יִתַּ֖מּוּ וְ/שָׁ֥ם יָמֻֽתוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/035.yaml
  text: 'I[a], Yahweh, have spoken[b]. Surely I will do this to all this evil congregation who have gathered together against me: in this wilderness they will come to an end, and there they will die.'
translation:
  language: sw
  text: '“Mimi, Yahwe, nimesema: Hakika[b] nitawafanyia hivi kusanyiko[a] hili lote ovu, ambalo limekusanyika dhidi yangu. Katika nyika hii watafikia mwisho wao, na huko watakufa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jumuiya” au “mkutano.”
    reason: lexical_alternative
  - marker: b
    text: Kirai cha Kiebrania kilichotafsiriwa “Hakika” kwa neno moja ni “ikiwa sivyo”; hapa ni namna ya kiapo inayosisitiza uhakika mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu kwa umbo linalosomeka kwa kawaida katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: דִּבַּרְתִּי
  choice: nimesema
  rationale: Wakati timilifu unaonyesha tamko la Mungu lililokamilika na lenye nguvu ya sasa; “nimesema” ni la asili na lenye uzito katika Kiswahili.
- source_word: אִם לֹא
  choice: Hakika
  rationale: Katika muktadha wa kiapo, kirai hiki ni tamko lenye msisitizo mkubwa, si sharti lisilokamilika.
- source_word: זֹאת אֶעֱשֶׂה לְכָל
  choice: nitaufanyia hivi ... hili lote
  rationale: Muundo huu unahifadhi tendo la wakati ujao, rejeo la “hivi,” na wazo kwamba hukumu itaifikia jumuiya yote.
- source_word: הָעֵדָה
  choice: kusanyiko
  rationale: Neno hili linaonyesha jamii ya Israeli iliyokusanyika kama kundi; “kusanyiko” ni wazi na halidokezi taasisi ya kidhehebu.
- source_word: הָרָעָה
  choice: ovu
  rationale: Kivumishi hiki kinawasilisha hukumu ya kimaadili juu ya uasi wa kundi, si hali mbaya tu.
- source_word: הַנּוֹעָדִים עָלָי
  choice: ambalo limekusanyika dhidi yangu
  rationale: Tafsiri hii inadumisha tendo la kukusanyika pamoja na maana ya kumpinga Mungu.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: Katika nyika hii
  rationale: “Nyika” linafaa kwa mazingira ya Pentateuki na linaeleza eneo lisilokaliwa bila kulazimisha maana ya jangwa la mchanga.
- source_word: יִתַּמּוּ
  choice: watafikia mwisho wao
  rationale: Inahifadhi maana ya kufikia ukomo bila kuiunganisha kabisa na kitenzi kinachofuata kinachotaja kufa waziwazi.
- source_word: וְשָׁם יָמֻתוּ
  choice: na hapa ndipo watakapokufa
  rationale: “Hapa” hurejelea nyika ambayo msemaji anaitaja kama “hii,” huku muundo wa msisitizo ukihifadhi uzito wa שָׁם.
theological_decisions:
- issue: Kauli ya kiapo אִם לֹא
  choice: 'Tamko la msisitizo: “Hakika ...”'
  alternative: 'Muundo halisi lakini usio wa kawaida: “ikiwa sivyo ...”'
  rationale: Katika muktadha huu kirai cha Kiebrania kinafanya kazi kama uthibitisho wa kiapo; tafsiri ya kiidioma inahifadhi uhakika wa hukumu bila kuongeza mafundisho.
- issue: Jina la pamoja עֵדָה
  choice: kusanyiko
  alternative: jumuiya au mkutano
  rationale: “Kusanyiko” linaonyesha watu kama kundi lililokusanyika na kuhukumiwa kwa pamoja, bila kulihusisha moja kwa moja na muundo wa kanisa wa baadaye.
- issue: Uhusiano kati ya יִתַּמּוּ na יָמֻתוּ
  choice: Kutofautisha “watafikia mwisho wao” na “watakapokufa”
  alternative: Kuunganisha yote kuwa “wataangamia”
  rationale: Kutenganisha vitenzi kunadumisha mfuatano na msisitizo wa Kiebrania badala ya kufuta mvutano wa kisemantiki kati ya kufikia ukomo na kufa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa msomaji wa kawaida. Sentensi inahifadhi sauti nzito ya hukumu ya Mungu, jina “Yahwe,” msisitizo wa kiapo, na utofauti wa vitenzi viwili vya mwisho.
