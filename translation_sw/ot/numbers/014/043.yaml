  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּי֩ הָ/עֲמָלֵקִ֨י וְ/הַ/כְּנַעֲנִ֥י שָׁם֙ לִ/פְנֵי/כֶ֔ם וּ/נְפַלְתֶּ֖ם בֶּ/חָ֑רֶב כִּֽי עַל כֵּ֤ן שַׁבְתֶּם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/לֹא יִהְיֶ֥ה יְהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/043.yaml
  text: For the Amalekites and the Canaanites are there before you, and you will fall by the sword, because you have turned back from following Yahweh, and Yahweh will not be with you.
translation:
  language: sw
  text: Kwa maana Waamaleki na Wakanaani wako huko mbele yenu, nanyi mtauawa kwa upanga, kwa sababu mmeacha kumfuata Yahweh; naye Yahweh hatakuwa pamoja nanyi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya onyo lililotangulia; “Kwa maana” ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: Waamaleki na Wakanaani
  rationale: Nomino za Kiebrania ziko katika umoja wa kijumla, lakini Kiswahili kwa kawaida hutaja makundi haya ya watu kwa wingi.
- source_word: שָׁם לִפְנֵיכֶם
  choice: wako huko mbele yenu
  rationale: Huhifadhi maana ya mahali ya שָׁם na mwelekeo wa לִפְנֵיכֶם kwa Kiswahili cha kawaida.
- source_word: וּנְפַלְתֶּם בֶּחָרֶב
  choice: nanyi mtauawa kwa upanga
  rationale: Neno kwa neno ni “mtaanguka kwa upanga,” lakini katika muktadha wa vita usemi huo humaanisha kuuawa. Tafsiri hii huwasilisha maana hiyo wazi bila kuongeza maelezo.
- source_word: כִּי עַל כֵּן
  choice: kwa sababu
  rationale: Kirai hiki kinatoa sababu ya kushindwa kwao; “kwa sababu” huwasilisha uhusiano huo wa kisababishi kwa ufasaha.
- source_word: שַׁבְתֶּם מֵאַחֲרֵי יְהוָה
  choice: mmeacha kumfuata Yahweh
  rationale: Huhifadhi picha ya kugeuka na kuacha kwenda nyuma ya Yahweh, yaani kuacha kumfuata, kwa lugha ya asili ya Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano YHWH limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: וְלֹא יִהְיֶה יְהוָה עִמָּכֶם
  choice: naye Yahweh hatakuwa pamoja nanyi
  rationale: Huhifadhi moja kwa moja wazo la kuwapo kwa Yahweh pamoja nao; “naye” huunganisha matokeo haya kwa ufasaha.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu YHWH lenyewe. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kuanguka kwa upanga
  choice: mtauawa kwa upanga
  alternative: mtaanguka kwa upanga
  rationale: Katika muktadha huu wa mapambano, “kuanguka kwa upanga” hurejelea kuuawa vitani. Kiswahili cha kawaida hueleza maana hiyo kwa “mtauawa,” bila kubadili sababu au uhakika wa onyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini kinachoeleweka kwa urahisi. Majina ya makabila yametolewa kwa maumbo ya kawaida ya Kiswahili, na sentensi imehifadhi msururu wa onyo, sababu, na matokeo.
