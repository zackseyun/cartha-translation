  text: וְ/עַתָּ֕ה יִגְדַּל נָ֖א כֹּ֣חַ אֲדֹנָ֑/י כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתָּ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/017.yaml
  text: And now[a], please let the power of the Lord be great, just as you have spoken, saying,
translation:
  language: sw
  text: 'Na sasa, tafadhali, uweza wa Bwana na uwe mkuu[a], kama ulivyosema hivi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uweza wa Bwana na utukuzwe.”
    reason: Njia nyingine ya kutafsiri יִגְדַּל, ambayo inaweza kueleza kuwa mkuu au kutukuzwa.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi וְ pamoja na kielezi cha wakati עַתָּה, na kuanzisha ombi la Musa kwa kawaida katika Kiswahili.
- source_word: יִגְדַּל
  choice: na uwe mkuu
  rationale: Kauli hii ya ombi inaeleza tamanio au dua. ‘Na uwe mkuu’ inabaki karibu na maana ya msingi ya גדל bila kuamua kimya kimya ikiwa nguvu hiyo iongezeke au itukuzwe.
- source_word: נָא
  choice: tafadhali
  rationale: Inaonyesha kusihi na kulainisha ombi kwa lugha ya sasa na inayoeleweka.
- source_word: כֹּחַ
  choice: uweza
  rationale: ‘Uweza’ huwasilisha nguvu au uwezo wa kutenda, na hapa inaendana vizuri na uwezo wa Mungu wa kutekeleza rehema na hukumu.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la cheo אֲדֹנָי, si jina la agano YHWH; ‘Bwana’ ndilo neno la kawaida na lenye heshima katika Kiswahili.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: Inaonyesha ulinganisho na ulinganifu kati ya ombi la Musa na maneno ya Mungu yaliyotangulia.
- source_word: דִּבַּרְתָּ
  choice: ulivyosema
  rationale: Kitenzi kinamwelekea Mungu katika nafsi ya pili umoja na kurejelea kauli yake ya awali ambayo bado ni msingi wa ombi hili.
- source_word: לֵאמֹר
  choice: 'hivi:'
  rationale: Kiswahili hutanguliza nukuu inayofuata kwa kawaida kwa ‘hivi’ na alama ya koloni; hii inadumisha kazi ya neno la Kiebrania ya kuanzisha yaliyosemwa bila kauli nzito isiyo ya kawaida.
theological_decisions:
- issue: Tafsiri ya jina la cheo אֲדֹנָי
  choice: Bwana
  alternative: Bwana Mungu
  rationale: Chanzo kina אֲדֹנָי pekee. ‘Bwana’ huhifadhi jina la cheo bila kuongeza ‘Mungu’ wala kulichanganya na jina YHWH.
- issue: Maana ya יִגְדַּל kuhusu uweza wa Bwana
  choice: uweza wa Bwana na uwe mkuu
  alternative: uweza wa Bwana na utukuzwe
  rationale: Tafsiri kuu inadumisha maana ya moja kwa moja ya ‘kuwa mkuu,’ huku tanbihi ikihifadhi uwezekano wa maana ya ‘kutukuzwa’ bila kufafanua kimadhehebu jinsi uweza wa Mungu unavyokuwa mkuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa dua ‘na uwe mkuu’ unahifadhi sauti ya kusihi; ‘hivi:’ huunganisha mstari huu kwa kawaida na nukuu inayoanza katika mstari unaofuata.
