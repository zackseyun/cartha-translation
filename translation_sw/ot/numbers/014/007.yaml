  yaml_path: translation/ot/numbers/014/007.yaml
  text: And they said to all the congregation of the sons of Israel[b][a], “The land through which we passed to spy it out is an exceedingly good land.”
translation:
  language: sw
  text: Wakaliambia kusanyiko lote la Waisraeli[a], “Nchi tuliyoipitia ili kuipeleleza[b] ni nzuri sana, sana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusanyiko lote la wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuichunguza” au “kuipeleleza kwa uangalifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Wakaliambia
  rationale: Kitenzi אמר katika usimulizi kina maana ya kusema; muundo wenye kiambishi cha yambwa unaonyesha kwa Kiswahili fasaha kwamba waliambia kusanyiko.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: kusanyiko lote la Waisraeli
  rationale: עֵדָה ni jumuiya iliyokusanyika, na 'Waisraeli' ni tafsiri ya kawaida na ya asili ya בְּנֵי יִשְׂרָאֵל katika Kiswahili cha sasa.
- source_word: לֵאמֹר
  choice: haikutafsiriwa kwa neno tofauti
  rationale: Huu ni muundo wa Kiebrania wa kuanzisha maneno ya moja kwa moja; katika Kiswahili tayari unaonyeshwa kwa nukuu.
- source_word: הָאָרֶץ
  choice: Nchi
  rationale: Neno linarejelea nchi ya Kanaani inayozungumziwa; 'nchi' ni tafsiri ya kawaida na inayofaa muktadha.
- source_word: אֲשֶׁר עָבַרְנוּ בָהּ
  choice: tuliyopita
  rationale: Muundo huu unaonyesha kupita katika eneo; Kiswahili kinaweza kuwasilisha maana hiyo kwa ufupi kwa 'nchi tuliyopita.'
- source_word: לָתוּר אֹתָהּ
  choice: ili kuipeleleza
  rationale: תור hapa ni kwenda kuichunguza nchi kwa kusudi la upelelezi; 'kuipeleleza' huhifadhi maana ya safari ya uchunguzi katika simulizi hili.
- source_word: טוֹבָה
  choice: nzuri
  rationale: '''Nzuri'' huwasilisha maana ya msingi ya טוֹב bila kuongeza tafsiri zaidi ya msisitizo unaofuata.'
- source_word: מְאֹד מְאֹד
  choice: sana, sana
  rationale: Kurudia 'sana' kunahifadhi uradidi na msisitizo wa Kiebrania badala ya kuufupisha kuwa kielezi kimoja.
