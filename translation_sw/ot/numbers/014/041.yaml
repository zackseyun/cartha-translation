  yaml_path: translation/ot/numbers/014/041.yaml
  text: But Moses said[c][b][a], “Why is this that you are transgressing the command of Yahweh? It will not succeed.”
translation:
  language: sw
  text: Lakini Musa akasema, “Kwa nini mnaivunja amri ya Yahwe?[a] Jambo hili halitafanikiwa.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri halisi, “kinywa cha Yahwe”; nahau inayomaanisha alichosema au kuamuru Yahwe. Pia inaweza kutafsiriwa “neno la Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Jambo hili halitafaulu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini Musa akasema
  rationale: Waw-consecutive inaendeleza simulizi, lakini katika muktadha Musa anapinga azimio la watu; kwa hiyo “Lakini” linaonyesha vizuri uhusiano huo wa kupingana.
- source_word: לָמָה זֶּה
  choice: Kwa nini
  rationale: Muundo huu wa Kiebrania una msisitizo, lakini Kiswahili cha kawaida huutoa kwa swali la moja kwa moja “Kwa nini”; kuongeza “jambo hili kwamba” kungekuwa nzito na isiyo ya asili.
- source_word: אַתֶּם עֹבְרִים
  choice: mnaivunja
  rationale: Kitenzi עבר pamoja na “kinywa/amri ya Yahwe” hapa ni nahau ya kukiuka agizo, si kuvuka kihalisi. “Mnaivunja” ni wazi, ya sasa, na huhifadhi uzito wa uasi.
- source_word: אֶת פִּי יְהוָה
  choice: amri ya Yahwe
  rationale: Kwa neno ni “kinywa cha Yahwe,” lakini ni nahau inayomaanisha jambo alilosema au kuamuru. “Amri ya Yahwe” inafaa muktadha wa kutotii, huku tanbihi ikihifadhi picha ya asili.
- source_word: וְהִוא
  choice: Jambo hili
  rationale: Kiwakilishi cha kike huenda kinarejelea tendo au jaribio walilokusudia kutokana na muktadha. “Jambo hili” huweka rejeo hilo wazi bila kulifafanua kupita ushahidi.
- source_word: לֹא תִצְלָח
  choice: halitafanikiwa
  rationale: צלח hapa humaanisha kufanikiwa au kusitawi katika shughuli iliyokusudiwa. “Halitafanikiwa” ni Kiswahili cha kawaida na sahihi katika onyo hili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja. “Yahwe” hulitambulisha kama jina badala ya kulibadili kuwa cheo, bila kuingiza upendeleo wa dhehebu.
- issue: Rejeo la וְהִוא katika onyo la mwisho
  choice: Jambo hili halitafanikiwa
  alternative: Hamtafanikiwa / Nalo halitafanikiwa
  rationale: Kiwakilishi kinarejelea kwa uwezekano mkubwa jaribio au tendo linalokusudiwa, si watu wenyewe. Tafsiri hii huhifadhi tofauti hiyo bila kuamua kwa undani zaidi jambo linalorejelewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ya swali imetolewa kwa mtiririko wa kawaida wa Kiswahili, huku msisitizo wa kukemea ukibebwa na muktadha na kitenzi “mnaivunja.” Alama zote za tanbihi zimewekwa katika matini kuu.
