base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/010.yaml
  text: But all the congregation said to stone them with stones[a], and the glory of Yahweh appeared in the tent of meeting to all the sons of Israel.
translation:
  language: sw
  text: Lakini kusanyiko lote likasema wawapige kwa mawe. Ndipo utukufu wa Yahwe ukaonekana katika Hema la Kukutania mbele ya wana wote wa Israeli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa lugha ya kawaida zaidi, “Waisraeli wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: Neno עֵדָה humaanisha jumuiya iliyokusanyika; “kusanyiko lote” ni la kawaida, lenye heshima, na linahifadhi maana ya pamoja.
- source_word: לִרְגּוֹם אֹתָם בָּאֲבָנִים
  choice: wapigwe kwa mawe
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza kuwapiga watu kwa mawe. Haiongezi “hadi wafe,” kwa kuwa hilo halijasemwa wazi katika mstari huu.
- source_word: כְבוֹד יְהוָה
  choice: utukufu wa Yahwe
  rationale: “Utukufu” huwakilisha כָּבוֹד kama udhihirisho unaoonekana wa uwepo wa Mungu, huku jina la agano likihifadhiwa kama “Yahwe.”
- source_word: נִרְאָה
  choice: ukawatokea
  rationale: Niphal ya ראה hapa inaeleza kujidhihirisha kwa kuonekana. “Ukawatokea” ni Kiswahili cha asili na pia huhifadhi walengwa wa tukio hilo.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika hema la kukutania
  rationale: Hili ni jina linaloeleweka la mahali pa kukutana, na “katika” linaakisi kihusishi בְּ.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: wana wote wa Israeli
  rationale: Tafsiri hii inahifadhi kwa karibu usemi wa Kiebrania wa kitaifa “wana wa Israeli”; tafsiri ya kawaida zaidi imewekwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kama jina la agano bila kulibadilisha kuwa cheo.
- issue: Usemi wa kitaifa בְּנֵי יִשְׂרָאֵל
  choice: wana wote wa Israeli
  alternative: Waisraeli wote
  rationale: Usemi halisi umehifadhiwa katika maandishi makuu kwa sababu ni jina la jadi la taifa; tanbihi inatoa Kiswahili cha kawaida zaidi bila kudai kwamba walengwa walikuwa wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ya kwanza imetumia kauli tendwa “wapigwe” ili kuwasilisha kwa kawaida agizo la kusanyiko bila kuongeza “hadi wafe.” Alama ya tanbihi imewekwa baada ya “wana wote wa Israeli,” ambako mbadala wake unahusika.
