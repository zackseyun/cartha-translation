base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/002.yaml
  text: And all the sons of Israel grumbled against Moses and against Aaron[a], and the whole congregation said to them[b], “If only we had died in the land of Egypt! Or if only we had died in this wilderness!”
translation:
  language: sw
  text: Wana wote wa Israeli[a] wakawanung’unikia[b] Musa na Haruni, na kusanyiko lote likawaambia, “Laiti tungalikufa katika nchi ya Misri! Au laiti tungalikufa katika jangwa hili!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Waisraeli wote.” Kiebrania: “wana wote wa Israeli.”'
    reason: lexical_alternative
  - marker: b
    text: Au “wakawalalamikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: wakawanung’unikia
  rationale: Kitenzi hiki katika simulizi la jangwani kinaonyesha manung’uniko ya pamoja yaliyoelekezwa kwa viongozi. “Kuwanung’unikia” ni Kiswahili cha kawaida kinachohifadhi hisia ya kutoridhika na kupinga.
- source_word: עַל
  choice: -wa- katika “wakawanung’unikia”
  rationale: Katika Kiswahili, yule anayelengwa na manung’uniko huonyeshwa kwa kiambishi cha yambwa katika kitenzi. Hivyo maana ya malalamiko dhidi ya Musa na Haruni inabaki bila kutumia muundo mzito.
- source_word: כֹּל בְּנֵי יִשְׂרָאֵל
  choice: Wana wote wa Israeli
  rationale: “Wana” linahifadhi kwa ukaribu zaidi neno la Kiebrania בְּנֵי na pia linaweza kumaanisha wazao au watu wa Israeli kwa ujumla.
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה humaanisha jamii ya agano iliyokusanyika. “Kusanyiko lote” ni wazi, la heshima, na linaonyesha kundi zima.
- source_word: לוּ
  choice: Laiti
  rationale: “Laiti” huanzisha tamanio lisilotimia na kwa kawaida huambatana na hali ya masharti ya wakati uliopita.
- source_word: מַתְנוּ / מָתְנוּ
  choice: tungalikufa
  rationale: 'Muundo wa -ngali- unaonyesha tamanio kinyume na yaliyotokea kuhusu wakati uliopita: walitamani kwamba wangekuwa wamekufa.'
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Tafsiri hii inadumisha neno אֶרֶץ na muundo kamili wa mahali katika Kiebrania.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: katika jangwa hili
  rationale: “Jangwa” ni neno linaloeleweka sana katika Kiswahili kwa mazingira ya safari ya Israeli, bila kulibana neno מִדְבָּר kuwa mchanga mtupu.
theological_decisions:
- issue: Jina la taifa lenye umbo la kiume katika בְּנֵי יִשְׂרָאֵל
  choice: Wana wote wa Israeli
  alternative: Waisraeli wote
  rationale: Neno “wana” linadumisha umbo la Kiebrania huku katika muktadha likirejelea watu wote wa Israeli; tanbihi inaweka wazi tafsiri ya kimaanana bila kufuta umbo la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Laiti tungalikufa” huhifadhi tamanio la zamani lisilotimia; “wakawanung’unikia” ni la kawaida zaidi kuliko muundo mzito wa “wakanung’unika dhidi ya.”
