  text: אִם יִרְאוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לַ/אֲבֹתָ֑/ם וְ/כָל מְנַאֲצַ֖/י לֹ֥א יִרְאֽוּ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/023.yaml
  text: they certainly shall not see the land that I swore to their fathers[b][a], and none of those who despised me shall see it.
translation:
  language: sw
  text: hakika hawataiona nchi niliyowaapia baba zao[a], wala hakuna hata mmoja wa wale walionidharau atakayeiona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “mababu zao.” Kiebrania: “baba zao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִרְאוּ
  choice: hakika hawataiona
  rationale: Katika muktadha huu אִם ni sehemu ya kauli ya kiapo yenye nguvu ya kukanusha, si sharti la kawaida. Kiswahili huonyesha maana hiyo kwa njia ya asili kwa kusema “hakika hawataiona.”
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Hapa neno hilo linamaanisha nchi maalumu ambayo Mungu aliwaahidi mababu wa Israeli; “nchi” ni tafsiri ya kawaida na wazi katika Kiswahili.
- source_word: נִשְׁבַּעְתִּי
  choice: niliyowaapia
  rationale: Kitenzi hiki huonyesha kuapa kwa kiapo. Muundo “niliyowaapia” unaonyesha kwa ufupi kwamba Mungu aliwaapia baba zao kuhusu nchi hiyo.
- source_word: לַאֲבֹתָם
  choice: baba zao
  rationale: Tafsiri hii inadumisha usemi halisi wa Kiebrania na marejeo yake kwa mababa wa Israeli, bila kuubadili kimya kimya kuwa usemi usio wa kijinsia.
- source_word: מְנַאֲצַי
  choice: wale walionidharau
  rationale: Mzizi נאץ una maana ya kumdharau au kumkataa mtu kwa dharau. “Walionidharau” ni ya moja kwa moja, nzito, na inafahamika kwa urahisi.
- source_word: לֹא יִרְאוּהָ
  choice: atakayeiona
  rationale: Kiambishi cha yambwa kinarejelea nchi. Baada ya “hakuna hata mmoja,” muundo chanya wa kitenzi “atakayeiona” huunda ukanushaji wa asili wa Kiswahili huku ukihifadhi marudio ya wazo la kuona nchi.
theological_decisions:
- issue: Nguvu ya kauli ya kiapo mwanzoni
  choice: 'Kutafsiri kama ukanushaji wa mkazo: “hakika hawataiona”'
  alternative: 'Kutafsiri kihalisi zaidi: “ikiwa wataiona nchi”'
  rationale: Katika fomula hii ya kiapo, אִם ina maana ya ukanushaji mkali. Tafsiri ya sharti la kawaida ingeficha hukumu inayotamkwa na Mungu.
- issue: Tafsiri ya אָבוֹת
  choice: “baba zao” katika maandishi makuu
  alternative: “mababu zao” au “wazee wao wa kale”
  rationale: Kiebrania kinatumia neno la kiume “baba.” “Baba zao” huhifadhi sura hiyo ya chanzo na maana ya mababa wa Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na uzito wa tamko la hukumu. Muundo wa kiapo umeelezwa kwa Kiswahili cha kawaida badala ya kufuatwa neno kwa neno. Alama ya tanbihi [a] imewekwa mara moja baada ya “baba zao.”
