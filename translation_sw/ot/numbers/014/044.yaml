    text: Kiebrania, “sanduku la agano la Yahweh”; pia yaweza kutolewa, “sanduku la agano lake Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְפִּלוּ
  choice: walithubutu kwa kiburi
  rationale: Kitenzi hiki kinaonyesha tendo la makusudi lenye kiburi au ukaidi, si kupanda tu. Kauli hii inawasilisha uzito wa kosa lao kwa Kiswahili cha kawaida.
- source_word: לַעֲלוֹת
  choice: kupanda
  rationale: Huhifadhi maana ya mwendo wa kwenda juu kwa lugha fupi na ya kawaida.
- source_word: אֶל רֹאשׁ הָהָר
  choice: hadi kilele cha mlima
  rationale: רֹאשׁ hapa ni 'kilele,' na הָהָר katika tukio hili inaeleweka vizuri kama mlima mmoja unaotajwa.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahweh
  rationale: Huhifadhi mfuatano wa umilikaji wa Kiebrania na istilahi ya kibiblia inayotambulika katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: וּמֹשֶׁה
  choice: na Musa
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: לֹא מָשׁוּ
  choice: hawakuondoka
  rationale: Katika muktadha huu מוש ina maana ya kutosogea au kutoondoka mahali; 'hawakuondoka' huonyesha wazi kwamba sanduku na Musa hawakuandamana na watu.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: katikati ya kambi
  rationale: Hutoa maana ya kuwa ndani au katikati ya kambi kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja; 'Yahweh' huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Uzito wa kimaadili wa וַיַּעְפִּלוּ
  choice: walithubutu kwa kiburi kupanda
  alternative: walipanda kwa ukaidi; walifanya kwa kimbelembele wakapanda
  rationale: Chaguo hili huhifadhi wazo la hatua ya makusudi na yenye kiburi bila kuifanya kuwa taarifa ya mwendo wa kawaida tu.
- issue: Uhusiano wa sanduku na agano katika וַאֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahweh
  alternative: sanduku la agano la Yahweh mwenyewe
  rationale: Muundo wa karibu na Kiebrania umehifadhiwa, huku tanbihi ikitaja namna nyingine inayowezekana ya kueleza uhusiano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Walithubutu kwa kiburi' huepuka neno adimu na kuhifadhi maana ya kimakusudi na yenye majivuno. Viashiria vya tanbihi vimewekwa mara tu baada ya vipashio vinavyohusika.
