  text: But they presumed to go up to the top of the mountain[b][a], though the ark of the covenant of Yahweh and Moses did not move from the midst of the camp.
translation:
  language: sw
  text: Lakini walithubutu kupanda hadi kilele cha mlima[a], lakini sanduku la agano la Yahweh[b] na Musa hawakusogea kutoka katikati ya kambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walitenda kwa kimbelembele wakapanda” au “walipanda kwa ukaidi.” Kitenzi cha Kiebrania kinaonyesha kitendo cha makusudi cha kujitumainisha kinyume cha amri.
    reason: lexical_alternative
