base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/022.yaml
  text: For all the men who have seen my glory and my signs that I did in Egypt and in the wilderness[a], and have tested me these ten times and have not listened to my voice—
translation:
  language: sw
  text: Kwa maana wanaume wote waliouona utukufu wangu na ishara zangu nilizozitenda nchini Misri na nyikani, walinijaribu mara hizi kumi na hawakuisikiliza sauti yangu[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuitii sauti yangu.” Nahau ya Kiebrania “kusikiliza sauti yangu” inaweza kumaanisha kuitii sauti yangu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu neno hili linaanzisha sababu ya kiapo na hukumu ya Mungu iliyotangulia.
- source_word: כָל הָאֲנָשִׁים
  choice: wanaume wote
  rationale: Neno la Kiebrania linataja wanaume, na katika simulizi hili linawahusu wanaume watu wazima wa kizazi kinachohukumiwa.
- source_word: הָרֹאִים
  choice: ambao wameuona
  rationale: Kauli ya wakati timilifu inaonyesha kuwa waliona hapo awali na kwamba jambo hilo bado lina uzito katika hukumu inayotamkwa.
- source_word: כְּבֹדִי
  choice: utukufu wangu
  rationale: Huhifadhi maana ya utukufu wa Mungu uliojidhihirisha bila kuipanua kwa maelezo ya ziada.
- source_word: אֹתֹתַי
  choice: ishara zangu
  rationale: ‘Ishara’ huhifadhi kazi ya matendo hayo kama ushahidi; ‘miujiza’ ingeongeza ufafanuzi usio wa lazima.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: nilizotenda
  rationale: Ni tafsiri ya kawaida na yenye hadhi ya kitenzi עשה katika muktadha wa matendo ya Mungu.
- source_word: בְמִצְרַיִם וּבַמִּדְבָּר
  choice: nchini Misri na nyikani
  rationale: ‘Nyikani’ linaonyesha eneo la pori lisilokaliwa katika simulizi la kutoka Misri bila kulifanya lazima kuwa jangwa la mchanga.
- source_word: וַיְנַסּוּ אֹתִי
  choice: nao wamenijaribu
  rationale: Hutoa maana ya kumtia Mungu majaribuni huku kiunganishi ‘nao’ kikiendeleza mfululizo wa shutuma kwa Kiswahili cha asili.
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: mara hizi kumi
  rationale: Huhifadhi msisitizo wa kiashiria זֶה badala ya kutafsiri kwa ‘mara kumi’ pekee.
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: na hawakuisikiliza sauti yangu
  rationale: Huhifadhi nahau ya Kiebrania ya ‘kusikiliza sauti,’ ambayo pia inaweza kumaanisha kuitii.
theological_decisions:
- issue: Kauli ya Mungu kujirejelea mwenyewe
  choice: Kudumisha nafsi ya kwanza katika ‘utukufu wangu,’ ‘ishara zangu,’ na ‘sauti yangu’
  alternative: Kuongeza maelezo ya kitheolojia kuhusu udhihirisho au mamlaka ya Mungu
  rationale: Mstari ni hotuba ya Mungu moja kwa moja; tafsiri inadumisha uzito wake bila kuongeza mafundisho yasiyotajwa katika Kiebrania.
- issue: Jinsia katika הָאֲנָשִׁים
  choice: wanaume wote
  alternative: watu wote
  rationale: Neno la Kiebrania na muktadha vinawalenga wanaume wa kizazi kilichohukumiwa, hivyo tafsiri ya kijinsia iliyo wazi ndiyo sahihi zaidi.
- issue: Maana ya שׁמע בקול
  choice: hawakuisikiliza sauti yangu
  alternative: hawakuitii sauti yangu
  rationale: Tafsiri kuu inahifadhi taswira ya Kiebrania huku tanbihi ikionyesha maana yake ya kutii, bila kufuta utata halisi wa nahau.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umeachwa ukiishia kwa kistari kirefu kwa kuwa sentensi na hukumu yake zinaendelea katika mstari unaofuata.
