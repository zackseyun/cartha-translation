base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/009.yaml
  text: Only[a], do not rebel against Yahweh. And do not fear the people of the land, for they are our bread; their protection has departed from over them, and Yahweh is with us[b]. Do not fear them.
translation:
  language: sw
  text: Lakini msimwasi Yahwe, wala msiwaogope watu wa nchi ile, kwa maana wao ni mkate wetu[a]. Ulinzi wao umewaondokea[b], naye Yahwe yuko pamoja nasi. Msiwaogope.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wao ni chakula chetu.” Kiebrania kinasema kihalisi, “wao ni mkate wetu,” sitiari inayoonyesha kwamba watashindwa kwa urahisi au watamezwa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kivuli chao kimeondoka kutoka juu yao.” Hapa “kivuli” huenda kinamaanisha hifadhi au ulinzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ila tu
  rationale: Kielezi hiki kinaweka sharti au msisitizo wenye nguvu katika himizo. “Ila tu” ni usemi wa kawaida wa Kiswahili unaodumisha nguvu hiyo bila kuufanya kuwa kiunganishi dhaifu.
- source_word: בַּיהוָה אַל תִּמְרֹדוּ
  choice: msimwasi Yahwe
  rationale: Kitenzi מרד pamoja na ב humaanisha kuasi dhidi ya mwenye mamlaka. Kiswahili hutumia kwa kawaida kitenzi “mwasi” na yambwa moja kwa moja, hivyo “msimwasi Yahwe” ni sahihi na fasaha.
- source_word: תִּירְאוּ / תִּירָאֻם
  choice: msiwaogope / Msiwaogope
  rationale: Katika muktadha huu ירא ni kuwaogopa maadui. Marudio ya katazo mwishoni yamedumishwa kama yalivyo katika Kiebrania.
- source_word: עַם הָאָרֶץ
  choice: watu wa nchi hiyo
  rationale: Hii inadumisha maana ya “watu wa nchi” huku “hiyo” ikifanya rejeo lisikike kwa kawaida katika Kiswahili cha sasa.
- source_word: כִּי לַחְמֵנוּ הֵם
  choice: kwa maana wao ni mkate wetu
  rationale: Tafsiri hii inadumisha sitiari fupi na yenye nguvu ya Kiebrania badala ya kuifafanua moja kwa moja kuwa watashindwa au kuliwa. Maana mbadala ya kisitiari imeelezwa katika tanbihi.
- source_word: סָר צִלָּם מֵעֲלֵיהֶם
  choice: Ulinzi wao umeondoka juu yao
  rationale: צֵל ni “kivuli” kihalisi lakini hapa inaashiria hifadhi au ulinzi. “Ulinzi” huwasilisha maana kwa uwazi, huku picha ya kitu kilichokuwa juu yao na sasa kuondoka ikidumishwa.
- source_word: וַיהוָה אִתָּנוּ
  choice: naye Yahwe yuko pamoja nasi
  rationale: Kiunganishi waw kimetafsiriwa kwa “naye,” ambacho huunganisha sentensi kwa kawaida bila kuongeza utofautishaji usio wazi katika chanzo. Jina la agano יהוה limetoholewa kuwa “Yahwe.”
theological_decisions:
- issue: Sitiari ya ushindi katika כִּי לַחְמֵנוּ הֵם
  choice: Kudumisha “wao ni mkate wetu” katika matini kuu
  alternative: “wao ni chakula chetu” au “tutawameza”
  rationale: Kiebrania kina sitiari ya moja kwa moja na hakifafanui namna watakavyoshindwa. Kudumisha picha hiyo huepuka kuamua kimya kimya tafsiri moja ya sitiari.
- issue: Maana ya צִלָּם katika muktadha wa vita
  choice: Kutafsiri maana yake kuwa “ulinzi wao”
  alternative: “kivuli chao” au “hifadhi yao”
  rationale: “Kivuli” ni picha ya Kiebrania inayoweza kumaanisha hifadhi au ulinzi. Matini kuu inatoa maana inayoeleweka, na tanbihi inadumisha tafsiri halisi pamoja na uwezekano wake wa kisitiari.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja. “Yahwe” hulidumisha kama jina bila kuingiza badala ya cheo; hakuna dai la kimadhehebu linaloongezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya katazo yamedumishwa, na alama za tanbihi zimewekwa baada ya vifungu vinavyohusika nazo.
