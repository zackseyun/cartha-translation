  yaml_path: translation/ot/numbers/014/033.yaml
  text: And your sons will be shepherds in the wilderness for forty years, and they will bear your acts of sexual unfaithfulness until your dead bodies are finished off in the wilderness.
translation:
  language: sw
  text: Na wana wenu watakuwa wachungaji[a] jangwani kwa miaka arobaini, nao watabeba uzinzi wenu[b] mpaka maiti zenu zitakapokwisha jangwani.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazururaji.” Neno la Kiebrania linahusiana moja kwa moja na kuchunga au kulisha mifugo, lakini wengine hulielewa kuwa linasisitiza maisha yao ya kuhamahama jangwani.
    reason: lexical_alternative
  - marker: b
    text: “Uzinzi” hapa ni taswira ya kingono ya kutokuwa waaminifu kwa agano; neno hilo pia linaweza kutafsiriwa “ukahaba” au, kwa maana pana zaidi, “kutokuwa waaminifu.”
    reason: lexical_alternative
  - marker: c
    text: Au “mpaka mizoga yenu itakapofikia mwisho jangwani.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵיכֶם
  choice: Na wana wenu
  rationale: Nomino בנים iko katika wingi wa kiume na hapa maana yake ya kawaida ni “wana”; muktadha haulazimishi kuipanua kuwa “watoto” kwa ujumla.
- source_word: רֹעִים
  choice: wachungaji
  rationale: Neno hili limetokana na kitenzi cha kuchunga au kulisha mifugo. “Wachungaji” huhifadhi taswira halisi ya maisha ya ufugaji jangwani, huku maana ya kuzurura ikielezwa katika tanbihi.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: מִדְבָּר ni eneo la nyika au malisho lisilokaliwa sana, si lazima jangwa la mchanga pekee. “Jangwani” ni usemi wa kawaida na unaofaa katika Kiswahili cha Biblia.
- source_word: אַרְבָּעִים שָׁנָה
  choice: kwa miaka arobaini
  rationale: Hii ni kauli ya moja kwa moja ya muda.
- source_word: וְנָשְׂאוּ
  choice: nao wataubeba
  rationale: נשא humaanisha kubeba au kuchukua juu yako. Kitenzi “kubeba” kinahifadhi nahau na uzito wa matokeo ya kosa bila kuifafanua kupita kiasi.
- source_word: אֶת זְנוּתֵיכֶם
  choice: uzinzi wenu
  rationale: זְנוּת hutumia lugha ya uasherati au ukahaba kuelezea kutokuwa waaminifu. “Uzinzi wenu” huhifadhi taswira ya kingono kwa lugha ya sasa na yenye kueleweka, bila kudai kwamba jambo linalotajwa ni tendo la kingono tu.
- source_word: עַד תֹּם
  choice: mpaka ... zitakapokwisha
  rationale: Mzizi תמם huonyesha kufikia mwisho au kukamilika. “Zitakapokwisha” huonyesha kwamba kizazi kilichohukumiwa kitakufa chote jangwani bila kuongeza namna ya kifo.
- source_word: פִּגְרֵיכֶם
  choice: maiti zenu
  rationale: פגר humaanisha maiti, mzoga, au mwili uliokufa. “Maiti zenu” ni ya kawaida, nzito, na yenye heshima katika Kiswahili cha sasa kuliko “mizoga yenu”.
theological_decisions:
- issue: Iwapo זְנוּתֵיכֶם itafsiriwe kama dhambi halisi ya kingono au kama kutokuwa waaminifu kwa agano
  choice: uzinzi wenu
  alternative: kutokuwa waaminifu kwenu
  rationale: Muktadha unahusu uasi wa Israeli dhidi ya BWANA. Hata hivyo, neno la Kiebrania linatumia kwa makusudi taswira ya kingono; kwa hiyo “uzinzi” huhifadhi mvutano huo, na tanbihi hufafanua matumizi yake ya kiagano.
- issue: Iwapo רֹעִים itafsiriwe kwa maana yake ya msingi au kwa matokeo ya maisha ya kuzurura
  choice: wachungaji
  alternative: wazururaji
  rationale: Maana ya kileksika inahusiana moja kwa moja na kuchunga. Maisha ya kuhamahama yanaweza kudokezwa na muktadha, lakini hayapaswi kuchukua nafasi ya taswira iliyopo katika matini kuu.
- issue: Iwapo עַד תֹּם פִּגְרֵיכֶם ionyeshe kuangamizwa kwa nguvu au kufikia mwisho kwa maiti zao
  choice: mpaka maiti zenu zitakapokwisha
  alternative: mpaka maiti zenu zitakapoangamia kabisa
  rationale: Kiebrania kinasisitiza kukamilika au kufikia mwisho, lakini hakitaji wazi njia ya vifo. Tafsiri iliyochaguliwa huepuka kuongeza wazo maalumu la kuangamizwa kwa nguvu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unabaki karibu na Kiebrania lakini unasomeka kwa kawaida. “Uzinzi” ni neno kali kwa makusudi ili kuhifadhi taswira ya chanzo; tanbihi huzuia lisieleweke kama madai ya dhambi ya kingono pekee. Alama zote za tanbihi [a], [b], na [c] zimewekwa katika matini kuu.
