  yaml_path: translation/ot/numbers/014/005.yaml
  text: Then Moses and Aaron fell on their faces before the whole assembly of the congregation of the sons of Israel[a][b].
translation:
  language: sw
  text: Ndipo Musa na Haruni wakaanguka kifudifudi[a] mbele ya mkutano wote wa jumuiya ya wana wa Israeli[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “juu ya nyuso zao”; ni usemi wa kuwa kifudifudi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina maneno mawili yanayohusiana, “mkutano” na “jumuiya,” yakisisitiza kundi lote lililokusanyika.
    reason: lexical_alternative
  - marker: c
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania kinasema “wana wa Israeli,” usemi unaoweza kuwataja watu wote wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: wakaanguka
  rationale: Kitenzi נפל kina maana ya msingi ya kuanguka. Umbo la wingi katika Kiswahili linapatana na wahusika wawili, Musa na Haruni, ingawa kitenzi cha Kiebrania kiko katika umoja kwa sababu mtendaji wa kwanza ni Musa.
- source_word: עַל־פְּנֵיהֶם
  choice: kifudifudi
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kujiweka uso chini kwa unyenyekevu mkubwa au kusujudu. ‘Kifudifudi’ ni Kiswahili cha kawaida na cha heshima kinachowasilisha tendo hilo bila kuongeza sababu yake.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Inaonyesha kuwa tendo lilifanyika hadharani katika uwepo wa kusanyiko lote.
- source_word: כָּל קְהַל
  choice: kusanyiko lote
  rationale: כָּל huonyesha ujumla, na קָהָל ni kundi lililokusanyika; ‘kusanyiko lote’ ni fasaha na huhifadhi maana zote mbili.
- source_word: עֲדַת
  choice: la jumuiya
  rationale: עֵדָה humaanisha jamii au jumuiya iliyotambuliwa kama kundi. Kutumia ‘jumuiya’ pamoja na ‘kusanyiko’ kunahifadhi maneno mawili ya kijamii yaliyopo katika Kiebrania.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania ‘wana wa Israeli.’ Katika muktadha huu usemi huo ni jina la watu wa Israeli kwa ujumla, si lazima wanaume pekee.
theological_decisions:
- issue: Iwapo kuunganisha קְהַל עֲדַת kuwa neno moja la Kiswahili
  choice: kusanyiko lote la jumuiya
  alternative: jumuiya yote; kusanyiko lote
  rationale: Kiebrania kina nomino mbili zinazohusiana. Kuzihifadhi kama ‘kusanyiko ... la jumuiya’ kunadumisha uzito wa tukio la hadharani bila kudai tofauti ya kiteolojia isiyoelezwa na mstari.
- issue: Iwapo בְּנֵי יִשְׂרָאֵל itafsiriwe kwa jina la jumla
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: ‘Wana wa Israeli’ hufuata umbo la chanzo kwa karibu na bado ni usemi unaoeleweka katika Kiswahili. Tanbihi inaweka wazi kuwa hapa ni jina la watu wote wa Israeli.
- issue: Iwapo עַל־פְּנֵיהֶם ifasiriwe wazi kuwa ibada
  choice: kifudifudi
  alternative: wakasujudu; wakaanguka nyuso zao chini
  rationale: Muktadha unaonyesha unyenyekevu na dhiki, lakini neno lenyewe halisemi wazi kuwa tendo hilo lilikuwa ibada. ‘Kifudifudi’ huhifadhi tendo bila kulifasiri kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. ‘Ndipo’ linaendeleza simulizi; ‘kifudifudi’ ni la kawaida zaidi kuliko tafsiri sisisi ya nahau ya Kiebrania. Muundo ‘kusanyiko lote la jumuiya’ ni wa kimakusudi ili kuhifadhi nomino mbili za chanzo, ingawa ni mzito kidogo kuliko Kiswahili cha mazungumzo.
