base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/028.yaml
  text: Say to them, ‘As I live, declares the LORD, surely just as you have spoken in my hearing, so I will do to you.’
translation:
  language: sw
  text: Waambie, ‘Kama niishivyo, asema BWANA, kwa hakika kama mlivyosema masikioni mwangu, ndivyo nitakavyowatendea.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי אָ֨נִי֙
  choice: Kwa hakika kama niishivyo
  rationale: Nahau ya kiapo cha Mungu imehifadhiwa kwa Kiswahili cha heshima; ‘kwa hakika’ pia hubeba nguvu ya kiapo inayosisitizwa na muundo wa Kiebrania.
- source_word: נְאֻם יְהוָה
  choice: asema BWANA
  rationale: Muundo wa tangazo la kimungu umetafsiriwa kwa lugha ya kawaida ya kinabii, huku jina la agano likiwakilishwa kwa desturi ya ‘BWANA’.
- source_word: דִּבַּרְתֶּם בְּאָזְנָי
  choice: mlivyosema masikioni mwangu
  rationale: Taswira halisi ya Kiebrania imehifadhiwa kwa kuwa inaeleweka na kusisitiza kwamba Mungu mwenyewe aliyasikia maneno yao.
- source_word: כֵּן אֶעֱשֶׂה לָכֶם
  choice: ndivyo nitakavyowatendea
  rationale: Huhifadhi ulinganifu wa ‘kama ... ndivyo’ na maana ya hatua ambayo Mungu atawafanyia.
theological_decisions:
- issue: Nguvu ya kiapo katika אִם לֹא baada ya ‘kama niishivyo’
  choice: kwa hakika
  alternative: kuacha bila neno la msisitizo
  rationale: Katika kiapo hiki אִם לֹא hufanya kazi kama uthibitisho wenye nguvu; ‘kwa hakika’ huwasilisha nguvu hiyo bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kiapo na ulinganifu wa Kiebrania umehifadhiwa bila kufanya sentensi kuwa ngumu isivyo lazima.
