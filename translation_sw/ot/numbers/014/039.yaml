  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּֽתְאַבְּל֥וּ הָ/עָ֖ם מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/039.yaml
  text: Moses spoke these words to all the sons of Israel[a], and the people mourned greatly.
translation:
  language: sw
  text: Musa aliwaambia Waisraeli wote maneno haya, nao watu wakaomboleza sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: aliwaambia
  rationale: Katika muktadha huu kitenzi hiki kinaonyesha Musa akiwafikishia watu maneno ya hukumu ya Mungu. “Aliwaambia” ni Kiswahili cha kawaida na huweka wazi walengwa bila kuongeza wazo la kutangaza rasmi.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya
  rationale: דְּבָרִים inaweza kumaanisha maneno, mambo, au ujumbe. Hapa inarejelea yale yaliyosemwa katika tamko lililotangulia, hivyo “maneno haya” huhifadhi maana ya moja kwa moja.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli wote
  rationale: בְּנֵי יִשְׂרָאֵל ni jina la kawaida la jamii ya Israeli. “Waisraeli wote” ni tafsiri ya asili, wazi, na jumuishi katika Kiswahili cha sasa; tafsiri ya neno kwa neno “wana wa Israeli” ingeweza kueleweka kuwa wanaume pekee.
- source_word: וַיִּתְאַבְּלוּ
  choice: wakaomboleza
  rationale: Hitpaeli ya אבל inaonyesha kuingia katika hali ya maombolezo. “Wakaomboleza” huwasilisha huzuni nzito ya pamoja kwa usahihi kuliko neno pana zaidi kama “wakahuzunika.”
- source_word: הָעָם
  choice: watu
  rationale: עָם hapa inairejelea jamii kwa ujumla. “Watu” ni sawa la kawaida na la wazi katika Kiswahili.
- source_word: מְאֹד
  choice: sana
  rationale: מְאֹד inatilia nguvu kiwango cha maombolezo. “Sana” ni usemi wa kawaida na wenye nguvu unaoandamana vizuri na “wakaomboleza.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “aliwaambia ... maneno haya” ni wa kawaida kuliko “alisema maneno haya kwa ...”, huku mfuatano wa simulizi ukihifadhiwa kwa “nao ... wakaomboleza.” Hakuna tanbihi inayohitajika kwa sababu “Waisraeli” huwasilisha wazi jina la jamii bila upotoshaji wa kijinsia.
