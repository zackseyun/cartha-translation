base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/024.yaml
  text: But my servant Caleb[a], because a different spirit was with him and he followed me fully, I will bring him into the land where he went[c][b], and his offspring will possess it.
translation:
  language: sw
  text: Lakini mtumishi wangu Kalebu, kwa sababu alikuwa na roho tofauti[a], naye alinifuata kwa moyo wote[b], nitamwingiza katika nchi ambako alienda, na uzao wake utaimiliki[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho nyingine ilikuwa pamoja naye”; huenda kauli hii inamaanisha kwamba Kalebu alikuwa na mwelekeo au mtazamo tofauti na Waisraeli wengine.
    reason: lexical_alternative
  - marker: b
    text: Nahau ya Kiebrania ni “alijaza baada yangu,” yaani, alimfuata BWANA kikamilifu au kwa moyo wote.
    reason: lexical_alternative
  - marker: c
    text: Au, “utairithi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַבְדִּי
  choice: Lakini mtumishi wangu
  rationale: Kiunganishi kimetafsiriwa kwa maana ya upinzani kwa sababu Kalebu analinganishwa na kizazi kisichoamini kilichotajwa kabla yake. “Mtumishi” linafaa kwa mfuasi mwaminifu wa Mungu bila kusisitiza hali ya utumwa.
- source_word: כָלֵב
  choice: Kalebu
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: עֵקֶב
  choice: kwa sababu
  rationale: Neno hili linaanzisha sababu ya Mungu kumtendea Kalebu kwa njia tofauti.
- source_word: הָיְתָה רוּחַ אַחֶרֶת עִמּוֹ
  choice: alikuwa na roho tofauti
  rationale: Hii ni kauli ya kawaida katika Kiswahili na inadumisha upana wa maana ya רוּחַ, ambayo inaweza kumaanisha roho, mwelekeo wa ndani, au mtazamo.
- source_word: וַיְמַלֵּא אַחֲרָי
  choice: na akanifuata kwa moyo wote
  rationale: Nahau ya Kiebrania, kihalisi “alijaza baada yangu,” ina maana ya kumfuata Mungu kikamilifu au kwa uaminifu wa moyo wote. Tafsiri hii ni ya asili na inayoeleweka katika Kiswahili.
- source_word: וַהֲבִיאֹתִיו
  choice: nitamwingiza
  rationale: Ingawa umbo la Kiebrania ni timilifu lenye kiunganishi, katika tangazo hili la Mungu linaeleza tendo la wakati ujao. “Kumwingiza” pia huhifadhi wazo la kumleta ndani ya nchi.
- source_word: אֶל הָאָרֶץ אֲשֶׁר בָּא שָׁמָּה
  choice: katika nchi aliyokwenda
  rationale: Kauli hii inarejelea safari ya Kalebu kwenda katika nchi hiyo kama mpelelezi na inafuata kwa karibu maana ya mwendo iliyo katika Kiebrania.
- source_word: וְזַרְעוֹ
  choice: na uzao wake
  rationale: “Uzao” ni nomino ya mkusanyiko inayoweza kumaanisha watoto na vizazi vya Kalebu, na inadumisha taswira ya זֶרַע bila kuwa ngumu kueleweka.
- source_word: יוֹרִשֶׁנָּה
  choice: utaimiliki
  rationale: Kitenzi ירשׁ katika muktadha wa nchi kinaweza kumaanisha kurithi au kumiliki. “Kumiliki” kinafaa kwa ahadi ya kuipokea na kuishikilia nchi.
theological_decisions:
- issue: Maana ya “roho tofauti” kwa Kalebu
  choice: Kauli imeachwa ikiwa pana, bila kuitambulisha wazi kuwa Roho Mtakatifu.
  alternative: “alikuwa na mtazamo tofauti” au “Roho wa Mungu alikuwa pamoja naye kwa namna ya pekee”
  rationale: רוח inaweza kutaja roho, hali ya ndani, au mtazamo. Andiko halimtaji wazi Roho wa Mungu hapa, hivyo tafsiri haifungi maana kwa fundisho moja mahususi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Kalebu,” “uzao,” na “kumiliki” hudumisha sauti ya kibiblia bila kutumia lugha ya kizamani; “kwa moyo wote” hufafanua nahau ya Kiebrania kwa njia ya kawaida ya Kiswahili.
