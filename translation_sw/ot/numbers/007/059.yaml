  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
translation:
  language: sw
  text: 'Na kwa dhabihu ya sadaka za amani[a]: ng’ombe wawili[b], kondoo dume watano, mbuzi dume watano, na wana-kondoo watano wenye umri wa mwaka mmoja. Hii ndiyo sadaka ya Gamalieli mwana wa Pedahsuri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za ustawi.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania lina neno la kijumla linalomaanisha mifugo ya jamii ya ng’ombe; kwa mapokeo limetafsiriwa “ng’ombe dume wawili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח
  choice: Na kwa ajili ya dhabihu ya
  rationale: Kiunganishi na kihusishi vinaendeleza orodha ya matoleo, huku זֶבַח ikitafsiriwa kwa maana yake ya kawaida ya dhabihu.
- source_word: הַשְּׁלָמִים
  choice: sadaka za amani
  rationale: Hili ni neno maalumu la mfumo wa dhabihu. ‘Sadaka za amani’ linadumisha tafsiri inayotambulika, huku tanbihi ikionyesha maana nyingine zinazowezekana.
- source_word: בָּקָר שְׁנַיִם
  choice: ng’ombe wawili
  rationale: בָּקָר ni jina la kijumla la mifugo ya jamii ya ng’ombe; tafsiri hii haibani maana kuwa maksai au mafahali pekee.
- source_word: אֵילִם חֲמִשָּׁה
  choice: kondoo dume watano
  rationale: אֵילִם humaanisha kondoo wa kiume waliokomaa.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: mbuzi dume watano
  rationale: עַתֻּדִים hutaja hasa mbuzi wa kiume.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: wana-kondoo watano wenye umri wa mwaka mmoja
  rationale: Tafsiri hii ya Kiswahili inaeleweka kwa urahisi na inadumisha bayana sharti la umri lililo katika Kiebrania.
- source_word: זֶה קָרְבַּן
  choice: Hii ndiyo sadaka ya
  rationale: Kishazi cha Kiebrania hakina kitenzi kilichotamkwa. Muundo ‘Hii ndiyo’ unaakisi utambulisho huo bila kulazimisha wakati uliopo au uliopita.
- source_word: גַּמְלִיאֵל בֶּן פְּדָה־צוּר
  choice: Gamalieli mwana wa Pedasuri
  rationale: Majina yametoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili, na בֶּן imetafsiriwa ‘mwana wa.’
theological_decisions:
- issue: Maana ya שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za ustawi
  rationale: Neno la Kiebrania linaweza kusisitiza amani, ustawi, au ushirika unaohusiana na dhabihu. Tafsiri kuu inatumia istilahi inayotambulika, bila kuficha uwezekano mwingine katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa orodha umehifadhiwa, istilahi za wanyama zimewekwa wazi, na kishazi cha mwisho hakijafungamanishwa na wakati ambao Kiebrania hakikutaja.
