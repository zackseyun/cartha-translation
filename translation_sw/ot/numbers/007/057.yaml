  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: sw
  text: ng’ombe dume mmoja kutoka kundini[a], kondoo dume mmoja, mwanakondoo dume mmoja wa mwaka mmoja, kwa ajili ya sadaka ya kuteketezwa;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa neno kwa neno, “ng’ombe dume mmoja, mwana wa kundi la ng’ombe.” Kirai hiki ni nahau inayomaanisha ng’ombe dume kutoka katika kundi la ng’ombe, na mara nyingi hutafsiriwa “ng’ombe dume mmoja mchanga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: ng’ombe dume
  rationale: Neno hili humaanisha ng’ombe dume, mara nyingi ng’ombe dume mchanga, katika orodha za dhabihu.
- source_word: אֶחָד
  choice: mmoja
  rationale: Ni namba inayotaja mnyama mmoja katika kila kipengele cha orodha.
- source_word: בֶּן בָּקָר
  choice: kutoka kundini
  rationale: Kirai hiki kwa neno kwa neno ni ‘mwana wa kundi la ng’ombe,’ lakini hapa ni nahau inayobainisha kwamba huyo ni mnyama wa jamii ya ng’ombe; ‘kutoka kundini’ huepuka urudiaji usio wa lazima baada ya ‘ng’ombe dume.’
- source_word: אַיִל
  choice: kondoo dume
  rationale: Hili ndilo neno la kawaida kwa kondoo dume aliyekomaa anayetolewa katika dhabihu.
- source_word: כֶּבֶשׂ
  choice: mwanakondoo dume
  rationale: Neno hili hutaja mwanakondoo, na katika muktadha huu wa dhabihu jinsia ya kiume inafanywa wazi.
- source_word: בֶּן שְׁנָתוֹ
  choice: wa mwaka mmoja
  rationale: Nahau hii huonyesha kwamba mnyama ana umri wa mwaka mmoja; tafsiri hii ni ya kawaida na inayoeleweka kwa Kiswahili.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi ya kawaida ya dhabihu inayoteketezwa, na kiambishi לְ kinaonyesha kusudi lake katika orodha.
