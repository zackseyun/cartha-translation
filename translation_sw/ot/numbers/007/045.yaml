  yaml_path: translation/ot/numbers/007/045.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: sw
  text: fahali mmoja wa kundi la ng'ombe, kondoo dume mmoja, mwanakondoo dume mmoja wa mwaka mmoja, kwa ajili ya sadaka ya kuteketezwa;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר
  choice: fahali
  rationale: Katika muktadha wa dhabihu, neno hili humaanisha ng'ombe dume; “fahali” ni tafsiri ya kawaida na iliyo wazi katika Kiswahili.
- source_word: אֶחָד
  choice: mmoja
  rationale: Kurudiwa kwa idadi hii kunabainisha hesabu ya kila mnyama mmoja mmoja na kuhifadhi muundo wa orodha.
- source_word: בֶּן בָּקָר
  choice: kutoka kundini
  rationale: Kirai hiki kwa njia ya nahau humtambulisha mnyama wa jamii ya ng'ombe; “kutoka kundini” kinahifadhi tofauti yake na kondoo kwa Kiswahili cha kawaida.
- source_word: אַיִל
  choice: kondoo dume
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kondoo dume aliyekomaa katika muktadha wa dhabihu.
- source_word: כֶּבֶשׂ
  choice: mwanakondoo dume
  rationale: Neno la Kiebrania humaanisha mwanakondoo wa kiume; kutaja “dume” kunaweka wazi maana yake ya kileksika.
- source_word: בֶּן שְׁנָתוֹ
  choice: wa mwaka mmoja
  rationale: Nahau hii hubainisha umri wa mnyama; “wa mwaka mmoja” ni ya asili na wazi katika Kiswahili cha sasa.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi ya kawaida kwa sadaka inayoteketezwa yote; tafsiri hii ni wazi na inafaa muundo wa orodha.
