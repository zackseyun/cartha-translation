  text: ng’ombe dume mmoja wa kundi,[a] kondoo dume mmoja, mwanakondoo dume mmoja wa mwaka mmoja, kwa ajili ya sadaka ya kuteketezwa;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ng’ombe dume mchanga mmoja, kondoo dume mmoja, mwanakondoo dume mmoja aliye katika mwaka wake wa kwanza, kwa ajili ya sadaka ya kuteketezwa.” Kirai cha Kiebrania cha “ng’ombe dume wa kundi” ni nahau inayomaanisha mnyama wa jamii ya ng’ombe, na kirai “mwana wa mwaka wake” ni nahau inayomaanisha mnyama aliye katika mwaka wake wa kwanza.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: ng’ombe dume mmoja kutoka kundini
  rationale: Kirai hiki kinamtaja mnyama dume wa jamii ya ng’ombe anayetoka katika kundi; tafsiri hii ni ya asili katika Kiswahili na huepuka usemi halisi usioeleweka wa ‘mwana wa ng’ombe.’
- source_word: אַיִל
  choice: kondoo dume mmoja
  rationale: Ni neno la kawaida la dhabihu linalomaanisha kondoo dume aliyekomaa.
- source_word: כֶּבֶשׂ
  choice: mwanakondoo dume mmoja
  rationale: Neno hili humaanisha mwanakondoo na katika orodha hii ya dhabihu linamtaja mnyama dume.
- source_word: בֶּן־שְׁנָתוֹ
  choice: wa mwaka mmoja
  rationale: Nahau hii humaanisha mnyama wa mwaka mmoja, yaani aliye katika mwaka wake wa kwanza.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni sadaka inayoteketezwa; kiambishi לְ kinaonyesha kusudi la wanyama hawa.
- source_word: אֶחָד
  choice: mmoja
  rationale: Idadi imerudiwa kwa kila mnyama, kama ilivyo katika muundo wa orodha ya Kiebrania.
