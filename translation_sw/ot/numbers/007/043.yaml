base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/043.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: sw
  text: Sadaka yake ilikuwa sinia moja la fedha[a], lenye uzito wa shekeli 130, na bakuli moja la fedha[b], lenye uzito wa shekeli 70, kwa kipimo cha shekeli ya mahali patakatifu[c]; vyombo hivyo viwili vilikuwa vimejaa unga laini uliochanganywa na mafuta kwa ajili ya sadaka ya nafaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sahani” badala ya “sinia” (קַעֲרָה).
    reason: lexical_alternative
  - marker: b
    text: Chombo hiki (מִזְרָק) kilikuwa bakuli la ibada; pia linaweza kuitwa “beseni.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “kwa shekeli ya mahali patakatifu,” yaani kwa kiwango rasmi cha uzito cha mahali patakatifu.'
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Sadaka yake ilikuwa
  rationale: קָרְבָּן ni sadaka inayoletwa katika ibada. Kitenzi “ilikuwa” kimeongezwa ili sentensi isiyo na kitenzi katika Kiebrania iwe ya kawaida kwa Kiswahili.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: sinia moja la fedha
  rationale: קַעֲרָה ni chombo kipana kama sahani au sinia; “sinia” linafaa kwa chombo kikubwa cha ibada na ni Kiswahili cha kawaida.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: lenye uzito wa shekeli 130
  rationale: Huhifadhi taarifa dhahiri ya uzito huku ikitumia mpangilio wa kawaida wa namba katika Kiswahili.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: bakuli moja la fedha
  rationale: מִזְרָק ni chombo cha ibada, mara nyingi cha kumwagia au kunyunyizia; “bakuli” ni tafsiri pana na ya kawaida isiyoongeza matumizi ambayo hayajasemwa hapa.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: lenye uzito wa shekeli 70
  rationale: Kirai hiki kinaeleza uzito wa bakuli; uwasilishaji huu ni wazi na wa kawaida kwa Kiswahili.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Formula hii inaonyesha kiwango rasmi cha uzito kilichotumiwa katika patakatifu. Neno “kipimo” linaweka maana hiyo wazi bila kuondoa neno halisi “shekeli.”
- source_word: שְׁנֵיהֶם
  choice: vyombo hivyo viwili
  rationale: Hurejelea wazi sinia na bakuli, huku ikihifadhi msisitizo wa Kiebrania kwamba vyote viwili vinahusika.
- source_word: מְלֵאִים
  choice: vilikuwa vimejaa
  rationale: Ni ulinganifu wa moja kwa moja wa kivumishi chenye maana ya kuwa vimejaa.
- source_word: סֹלֶת
  choice: unga laini
  rationale: סֹלֶת ni unga uliosagwa vizuri unaotumiwa katika sadaka; “unga laini” ni wazi na sahihi.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Huhifadhi hali tendwa ya unga kuwa umechanganywa na mafuta kwa lugha ya sasa na ya kawaida.
- source_word: לְמִנְחָה
  choice: kwa ajili ya sadaka ya nafaka
  rationale: Katika muktadha huu wa kikuhani, מִנְחָה ni sadaka ya nafaka, si sadaka kwa ujumla.
