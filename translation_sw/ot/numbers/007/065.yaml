  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/065.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Abidan son of Gideoni.'
translation:
  language: sw
  text: 'na kwa ajili ya dhabihu za amani[a]: ng’ombe wawili, kondoo dume watano, mbuzi dume watano, na wanakondoo dume watano wenye umri wa mwaka mmoja. Hii ndiyo sadaka ya Abidani mwana wa Gideoni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhabihu za ushirika” au “dhabihu za ustawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: na kwa ajili ya dhabihu za amani
  rationale: Viambishi וּלְ vinaunganisha orodha hii na iliyotangulia na kuonyesha kusudi; זֶבַח ni dhabihu, na שְׁלָמִים ni istilahi ya ibada inayoweza kumaanisha amani, ushirika, au hali njema. ‘Dhabihu za amani’ ni tafsiri fupi, inayotambulika, na iliyo karibu na muundo wa Kiebrania.
- source_word: בָּקָר שְׁנַיִם
  choice: ng’ombe wawili
  rationale: בָּקָר ni jina la jumla la mifugo ya jamii ya ng’ombe na hapa halibainishi jinsia; ‘ng’ombe wawili’ linaacha maana hiyo wazi bila kuongeza kuwa ni madume.
- source_word: אֵילִים חֲמִשָּׁה
  choice: kondoo dume watano
  rationale: אֵילִים humaanisha kondoo madume, hivyo tafsiri hii inahifadhi jinsia ya wanyama kwa uwazi.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: mbuzi dume watano
  rationale: עַתֻּדִים hutaja mbuzi madume; ‘mbuzi dume’ ni Kiswahili cha sasa na cha wazi.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: wanakondoo dume watano wenye umri wa mwaka mmoja
  rationale: כְּבָשִׂים katika orodha hii ni wanakondoo madume, na msemo בְּנֵי שָׁנָה unaonyesha umri wa mwaka mmoja.
- source_word: זֶה קָרְבַּן
  choice: Hii ndiyo sadaka ya
  rationale: Huu ni usemi wa kuhitimisha orodha. Kiebrania hakina kitenzi cha wakati kilicho wazi, hivyo ‘Hii ndiyo’ huhifadhi hali hiyo bila kulazimisha wakati uliopita.
- source_word: אֲבִידָן בֶּן גִּדְעֹנִי
  choice: Abidani mwana wa Gideoni
  rationale: Majina yamenukuliwa kwa maumbo yanayofaa Kiswahili, na בֶּן limetafsiriwa kwa kawaida kuwa ‘mwana wa.’
theological_decisions:
- issue: Maana pana ya שְׁלָמִים
  choice: dhabihu za amani
  alternative: dhabihu za ushirika; dhabihu za ustawi
  rationale: Istilahi hii inaweza kuhusishwa na amani, ushirika, au hali njema. Maandishi makuu yanatumia tafsiri ya jadi iliyo karibu na neno la Kiebrania, huku tanbihi ikihifadhi uwezekano mwingine bila kuamua maana yake yote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Orodha imehifadhi mpangilio wa Kiebrania, na sentensi ya mwisho haijalazimishwa kuwa katika wakati uliopita kwa kuwa Kiebrania hakibainishi wakati hapa.
