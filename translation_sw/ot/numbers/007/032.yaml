translation:
  language: sw
  text: sahani moja ya dhahabu yenye uzito wa shekeli kumi,[a] iliyojaa uvumba;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “sahani moja, kumi, dhahabu, iliyojaa uvumba”; neno “shekeli” limeongezwa kutokana na muundo wa matoleo unaorudiwa katika mistari inayozunguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sahani
  rationale: Katika orodha ya matoleo ya hema la kukutania, neno hili linamaanisha chombo kidogo cha kuwekea uvumba, si kiganja cha mkono. “Sahani” ni neno la kawaida na linalofaa kwa chombo hiki.
- source_word: אַחַת
  choice: moja
  rationale: Ni namba inayopatana na nomino ya kike כַּף; tafsiri yake ya moja kwa moja ni “moja.”
- source_word: עֲשָׂרָה
  choice: yenye uzito wa shekeli kumi
  rationale: Kiebrania kinasema kihalisi “kumi” bila kutaja kipimo. Kutokana na mtindo unaorudiwa katika mistari inayozunguka, kinachokusudiwa ni uzito wa shekeli kumi. Maneno “yenye uzito wa” yanaondoa uwezekano wa kuelewa kuwa sahani ilikuwa na shekeli ndani yake.
- source_word: זָהָב
  choice: ya dhahabu
  rationale: Neno linaonyesha kitu ambacho sahani ilitengenezwa nacho. “Ya dhahabu” ni Kiswahili cha kawaida na cha wazi.
- source_word: מְלֵאָה
  choice: ikiwa imejaa
  rationale: Muundo huu unaeleza hali ya chombo na yaliyomo ndani yake. “Ikiwa imejaa” ni wa asili katika orodha hii.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: “Uvumba” ndilo neno la kawaida la Kiswahili kwa dutu yenye harufu nzuri iliyotolewa katika ibada ya hema la kukutania.
