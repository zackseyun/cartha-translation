  yaml_path: translation/ot/numbers/007/018.yaml
  text: On the second day Nethanel son of Zuar, the leader of Issachar, presented his offering.
translation:
  language: sw
  text: Siku ya pili, Nethaneli mwana wa Suari, kiongozi wa Isakari, akatoa sadaka yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema tu “akatoa”; maneno “sadaka yake” yameongezwa kutokana na muktadha unaorudiwa katika Hesabu 7, ambamo kila kiongozi wa kabila anatoa sadaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Siku ya pili
  rationale: Kirai hiki cha wakati kinatafsiriwa kwa Kiswahili cha kawaida na kudumisha mfuatano wa siku bila kuongeza habari isiyomo katika aya.
- source_word: הִקְרִיב
  choice: akatoa sadaka yake
  rationale: Hifili ya קרב katika muktadha wa ibada humaanisha kuleta au kutoa kitu kama sadaka. Yambwa haikutajwa wazi katika aya hii, lakini inafahamika kutokana na muundo unaorudiwa katika Hesabu 7; tanbihi inaonyesha nyongeza hiyo.
- source_word: נְתַנְאֵל
  choice: Nethaneli
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likibaki karibu na umbo la Kiebrania.
- source_word: בֶּן צוּעָר
  choice: mwana wa Suari
  rationale: Muundo wa ukoo בן umetafsiriwa kwa kirai cha kawaida cha Kiswahili, “mwana wa”; jina צוּעָר limetoholewa kuwa Suari.
- source_word: נְשִׂיא
  choice: kiongozi
  rationale: Katika muktadha wa makabila, נָשִׂיא humaanisha mkuu au kiongozi anayetambuliwa; “kiongozi” ni wazi na haleti dhana isiyokusudiwa ya mwana wa kifalme.
- source_word: יִשָּׂשכָר
  choice: Isakari
  rationale: Jina la kabila limetolewa katika umbo la Kiswahili linalotambulika na wasomaji wa Biblia.
