  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִירַ֖ע בֶּן עֵינָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/083.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Ahira son of Enan.'
translation:
  language: sw
  text: 'Na kwa ajili ya dhabihu ya sadaka za amani[a]: ng’ombe wawili, kondoo dume watano, mbuzi dume watano, na wana-kondoo dume watano wa mwaka mmoja. Hii ilikuwa sadaka ya Ahira mwana wa Enani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za hali njema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח
  choice: Na kwa ajili ya dhabihu ya
  rationale: Kiunganishi וּ na kihusishi לְ vinaendeleza orodha na kutambulisha sehemu inayofuata; neno “dhabihu” linahifadhi nomino זֶבַח badala ya kuifanya kuwa jina la aina ya sadaka pekee.
- source_word: הַשְּׁלָמִים
  choice: sadaka za amani
  rationale: Hili ni jina la kawaida la aina hii ya dhabihu katika lugha ya Biblia. Linadumisha wazo la שׁלם bila kulifungamanisha kwa lazima na tafsiri moja tu kama ushirika au hali njema.
- source_word: בָּקָר שְׁנַיִם
  choice: ng’ombe wawili
  rationale: בָּקָר ni nomino ya jumla ya ng’ombe na hapa haisemi jinsia yao; tafsiri hii haiongezi jinsia isiyotajwa.
- source_word: אֵילִם חֲמִשָּׁה
  choice: kondoo dume watano
  rationale: אֵילִים humaanisha kondoo wa kiume waliokomaa, hivyo “kondoo dume” ni sahihi na ya kawaida kwa Kiswahili.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: mbuzi dume watano
  rationale: עַתּוּדִים hutaja mbuzi wa kiume; “mbuzi dume” huonyesha jinsia hiyo wazi kwa lugha ya sasa.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: wana-kondoo dume watano wa mwaka mmoja
  rationale: כְּבָשִׂים hapa hutaja wana-kondoo wa kiume, na בְּנֵי שָׁנָה huonyesha kuwa walikuwa na umri wa mwaka mmoja.
- source_word: זֶה קָרְבַּן
  choice: Hii ilikuwa sadaka ya
  rationale: Muundo huu ni kauli ya kumtambulisha mwenye sadaka mwishoni mwa orodha. Wakati uliopita unasomeka kwa kawaida katika simulizi la Kiswahili, huku “sadaka” ikiwakilisha קָרְבָּן.
- source_word: אֲחִירַע בֶּן עֵינָן
  choice: Ahira mwana wa Enani
  rationale: Majina yameandikwa kwa umbo linalofaa Kiswahili, na “mwana wa” linahifadhi wazi uhusiano wa kifamilia unaoonyeshwa na בֶּן.
theological_decisions:
- issue: Maana ya istilahi ya dhabihu הַשְּׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za hali njema
  rationale: Istilahi ya Kiebrania inaweza kusisitiza amani, ushirika, au hali njema. Matini kuu inatumia jina linalotambulika, huku tanbihi ikihifadhi uwezekano wa maana nyingine bila kuamua kwa upande mmoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa msomaji wa kawaida. Orodha imewasilishwa kwa mpangilio wa Kiebrania, jinsia za wanyama zimetajwa pale tu chanzo kinapozitaja, na istilahi ya dhabihu imewekewa tanbihi ili kuhifadhi upana wake wa maana.
