  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: sw
  text: bakuli moja la dhahabu[a], lenye uzito wa shekeli kumi, lililojaa uvumba;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “bakuli moja la dhahabu, kumi, lililojaa uvumba”; neno “shekeli” linaeleweka kutokana na mfumo wa sadaka unaorudiwa katika muktadha unaozunguka mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sahani
  rationale: Katika orodha ya vyombo vya ibada, neno hili linamaanisha chombo kidogo cha kuwekea uvumba, si kiganja cha mkono. “Sahani” ni neno la kawaida na linaloeleweka kwa chombo hicho.
- source_word: אַחַת
  choice: moja
  rationale: Ni namba ya kawaida inayopatana na nomino ya ngeli ya sahani katika Kiswahili.
- source_word: עֲשָׂרָה
  choice: shekeli kumi
  rationale: Kiebrania kinasema kihalisi “kumi” bila kurudia kipimo, lakini muundo unaorudiwa katika muktadha wa karibu unaonyesha kuwa shekeli za uzito ndizo zinazokusudiwa.
- source_word: זָהָב
  choice: ya dhahabu
  rationale: Huonyesha kitu ambacho chombo kilitengenezwa nacho; “ya dhahabu” ni Kiswahili cha kawaida na wazi.
- source_word: מְלֵאָה
  choice: iliyojaa
  rationale: Ni kivumishi kinachoeleza hali ya chombo kuwa kimejaa yaliyomo.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Ni neno la kawaida la Kiswahili kwa dutu yenye harufu nzuri iliyotumiwa katika ibada.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Ellipsisi ya kipimo imefafanuliwa katika matini, huku maana halisi ya Kiebrania ikihifadhiwa katika tanbihi.
