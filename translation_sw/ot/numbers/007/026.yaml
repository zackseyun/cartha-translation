base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/026.yaml
  text: one golden dish of ten shekels[a], full of incense;
translation:
  language: sw
  text: bakuli moja la dhahabu lenye uzito wa shekeli kumi,[a] lililojaa uvumba;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “bakuli moja la dhahabu, kumi, lililojaa uvumba”; neno “shekeli” limeongezwa kutokana na mfumo wa kawaida wa matoleo katika muktadha wa karibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sahani
  rationale: Katika orodha ya vyombo vya ibada, neno hili humaanisha chombo kidogo, si kiganja cha mkono. “Sahani” ni neno la kawaida na linafaa kwa chombo kilichowekwa uvumba.
- source_word: אַחַת
  choice: moja
  rationale: Ni namba ya kawaida inayofafanua sahani.
- source_word: עֲשָׂרָה
  choice: yenye uzito wa shekeli kumi
  rationale: Kiebrania kinasema kihalisi “kumi,” lakini kipimo cha shekeli kinaeleweka kutokana na mtindo unaorudiwa katika muktadha wa karibu. Kutaja uzito huonyesha wazi kwamba si thamani wala idadi ya vyombo.
- source_word: זָהָב
  choice: ya dhahabu
  rationale: Inaonyesha kitu ambacho sahani ilitengenezwa nacho.
- source_word: מְלֵאָה
  choice: iliyojaa
  rationale: Hutoa kwa Kiswahili cha asili hali ya chombo kuwa kimejaa kitu.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Ni neno la kawaida la Kiswahili kwa dutu yenye harufu nzuri iliyotumiwa katika ibada ya patakatifu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “yenye uzito wa” unaweka wazi kipimo kilichodokezwa katika Kiebrania, huku tanbihi ikihifadhi usemi wake mfupi na wenye pengo.
