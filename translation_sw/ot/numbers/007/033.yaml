  variant: Standard East African Swahili
source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/033.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: sw
  text: fahali mmoja kutoka katika kundi la ng’ombe[a], kondoo dume mmoja, mwanakondoo dume mmoja wa mwaka mmoja[b], kwa ajili ya sadaka ya kuteketezwa;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa tafsiri sisisi, ‘fahali mmoja, mwana wa kundi la ng’ombe’—nahau inayomaanisha fahali kutoka katika kundi la ng’ombe, ambaye mara nyingi hueleweka kuwa fahali mchanga.
    reason: lexical_alternative
  - marker: b
    text: Au ‘aliye katika mwaka wake wa kwanza.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: fahali mmoja kutoka katika kundi la ng’ombe
  rationale: פַּר ni fahali, na בֶּן בָּקָר ni nahau inayobainisha kuwa anatoka katika kundi la ng’ombe. Tafsiri hii ni ya kawaida kwa Kiswahili na huepuka tafsiri sisisi isiyo ya asili, ‘mwana wa kundi.’
- source_word: אַיִל אֶחָד
  choice: kondoo dume mmoja
  rationale: אַיִל ni kondoo dume aliyekomaa, neno mahususi linalofaa katika orodha ya wanyama wa dhabihu.
- source_word: כֶּבֶשׂ אֶחָד
  choice: mwanakondoo dume mmoja
  rationale: כֶּבֶשׂ humaanisha mwanakondoo na katika muktadha huu wa dhabihu ni wa kiume; ‘mwanakondoo dume’ huweka wazi jinsia ya mnyama.
- source_word: בֶּן שְׁנָתוֹ
  choice: wa mwaka mmoja
  rationale: Hii ni nahau ya Kiebrania kuhusu umri, inayoweza kumaanisha mwenye umri wa mwaka mmoja au aliye katika mwaka wake wa kwanza.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni dhabihu inayoteketezwa; ‘sadaka ya kuteketezwa’ ni istilahi ya kawaida, iliyo wazi na yenye heshima katika Kiswahili.
- source_word: אֶחָד
  choice: mmoja
  rationale: Namba hii imerudiwa ili kutaja idadi ya kila mnyama, hivyo imetafsiriwa kwa uthabiti kuwa ‘mmoja.’
