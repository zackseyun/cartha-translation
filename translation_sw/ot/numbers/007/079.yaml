source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: sw
  text: Sadaka yake ilikuwa sahani moja ya fedha[a], yenye uzito wa shekeli 130, na bakuli moja la fedha[b], lenye uzito wa shekeli 70 kwa kipimo cha shekeli ya mahali patakatifu; vyombo hivyo viwili vilikuwa vimejaa unga laini uliochanganywa na mafuta kwa ajili ya sadaka ya nafaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bakuli moja la fedha.” Neno la Kiebrania קַעֲרָה linamaanisha chombo, lakini umbo lake kamili halijulikani kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: Au “beseni moja la fedha,” au “bakuli moja la fedha la kunyunyizia.” Neno la Kiebrania מִזְרָק linaweza kusisitiza matumizi ya chombo hiki katika ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Sadaka yake
  rationale: Katika muktadha huu wa ibada, קָרְבָּן ni kitu kinacholetwa mbele za Mungu kama sadaka. “Sadaka yake” ni tafsiri ya kawaida, wazi na yenye heshima.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: sahani moja ya fedha
  rationale: קַעֲרָה ni chombo ambacho huenda kilikuwa kipana na kifupi. “Sahani” hutofautisha chombo hiki na bakuli linalotajwa baadaye, bila kudai uhakika kamili kuhusu umbo lake.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yenye uzito wa shekeli 130
  rationale: Huwasilisha wazi taarifa ya Kiebrania kuhusu uzito wa chombo kwa Kiswahili cha kawaida.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: bakuli moja la fedha
  rationale: מִזְרָק ni chombo cha ibada, ambacho kingeweza kutumiwa kubeba au kunyunyizia kimiminika. “Bakuli” ni neno linaloeleweka na halifungii maana kwenye kazi moja tu.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: lenye uzito wa shekeli 70
  rationale: Kirai hiki kinaeleza uzito wa bakuli; muundo huu ni wazi na wa asili katika Kiswahili.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Hifadhi maana ya kiwango rasmi cha uzito kilichotumiwa katika huduma ya mahali patakatifu, badala ya kueleza shekeli yenyewe kuwa takatifu kimaadili.
- source_word: שְׁנֵיהֶם
  choice: vyombo hivyo viwili
  rationale: Kiebrania kinarejelea wazi vitu vyote viwili. Kutaja “vyombo” huondoa utata wa kiwakilishi na ni Kiswahili cha kawaida.
- source_word: מְלֵאִים
  choice: vilikuwa vimejaa
  rationale: Huwakilisha hali ya vyombo kuwa na yaliyomo hadi kujaa kwa namna ya asili katika Kiswahili.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Ni istilahi ya unga uliosagwa vizuri uliotumiwa katika sadaka; “unga laini” ni wazi kwa msomaji wa kisasa.
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Kitenzi kinaonyesha kuwa unga ulikuwa umechanganywa na mafuta. Tafsiri hii ni ya sasa na sahihi.
- source_word: לְמִנְחָה
  choice: kwa ajili ya sadaka ya nafaka
  rationale: Katika sheria za kikuhani, מִנְחָה hapa ni aina maalumu ya sadaka iliyotengenezwa kwa nafaka, si sadaka kwa maana pana tu.
