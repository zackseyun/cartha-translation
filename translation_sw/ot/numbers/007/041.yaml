  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/041.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old[b]. This was the offering of Shelumiel son of Zurishaddai.'
translation:
  language: sw
  text: 'na kwa ajili ya dhabihu za amani[a]: ng’ombe wawili[b], kondoo dume watano, mbuzi dume watano, na wana-kondoo dume watano wa mwaka mmoja. Hii ilikuwa sadaka ya Shelumieli mwana wa Surishadai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhabihu za ushirika” au “dhabihu za hali njema.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania בָּקָר ni neno pana linalomaanisha ng’ombe; tafsiri nyingine husema “maksai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: na kwa ajili ya dhabihu ya sadaka za amani
  rationale: Viambishi וּלְ vinaendeleza orodha na kuonyesha kusudi. Neno זֶבַח ni ‘dhabihu,’ na שְׁלָמִים ni istilahi ya ibada inayoweza kumaanisha sadaka za amani, ushirika, au hali njema; ‘sadaka za amani’ huhifadhi istilahi ya jadi bila kufuta uwezekano mwingine.
- source_word: בָּקָר שְׁנַיִם
  choice: ng’ombe wawili
  rationale: בָּקָר ni neno pana la ng’ombe na halibainishi moja kwa moja kwamba ni maksai; Kiswahili ‘ng’ombe’ kinadumisha upana huo.
- source_word: אֵילִם חֲמִשָּׁה
  choice: kondoo dume watano
  rationale: אֵילִם humaanisha kondoo wa kiume waliokomaa, hivyo ‘kondoo dume’ ni sahihi na ya kawaida.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: mbuzi dume watano
  rationale: עַתֻּדִים hubainisha mbuzi wa kiume, kwa hiyo jinsia imeelezwa wazi.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: wana-kondoo dume watano wa mwaka mmoja
  rationale: כְּבָשִׂים katika orodha hii ya dhabihu ni wana-kondoo wa kiume, na בְּנֵי שָׁנָה ni nahau ya walio na umri wa mwaka mmoja.
- source_word: זֶה קָרְבַּן
  choice: Hii ndiyo ilikuwa sadaka ya
  rationale: זֶה ni ya kuonyesha na קָרְבַּן ni sadaka inayotolewa; wakati uliopita unasikika kiasili katika simulizi hii huku mkazo wa נוסחה ukihifadhiwa kwa ‘ndiyo.’
- source_word: שְׁלֻמִיאֵל בֶּן צוּרִישַׁדָּי
  choice: Shelumieli mwana wa Surishadai
  rationale: Majina yameandikwa kwa namna inayofaa mfumo wa sauti na matumizi ya kawaida ya Kibiblia katika Kiswahili, huku בֶּן ikitafsiriwa ‘mwana wa.’
theological_decisions:
- issue: Maana ya שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za hali njema
  rationale: Istilahi ya Kiebrania ina wigo wa amani, ustawi, na ushirika. Tafsiri kuu inatumia istilahi fupi ya jadi, na tanbihi inahifadhi mbadala halali bila kulazimisha fasiri moja ya kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa orodha na ubainishaji wa jinsia na umri wa wanyama umehifadhiwa. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
