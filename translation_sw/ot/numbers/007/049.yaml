translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha umehifadhiwa, huku vipashio vya uzito na yaliyomo vikiunganishwa kwa sintaksia ya kawaida ya Kiswahili.
