  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/049.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: sw
  text: Sadaka yake ilikuwa sinia moja la fedha[a], lenye uzito wa shekeli mia moja na thelathini, na bakuli moja la fedha lenye uzito wa shekeli sabini, kwa kipimo cha shekeli ya mahali patakatifu; vyombo hivyo viwili vilikuwa vimejaa unga laini uliochanganywa na mafuta kwa ajili ya sadaka ya nafaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sahani” badala ya “sinia”; na “beseni” badala ya “bakuli.”
    reason: Mambo yote mawili ni mbadala halali wa majina ya vyombo קַעֲרָה na מִזְרָק; maumbo mahususi ya vyombo hivyo hayawezi kuthibitishwa kwa uhakika kutokana na maneno pekee.
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Sadaka yake ilikuwa
  rationale: Katika muktadha wa ibada, קָרְבָּן ni kitu kinacholetwa kama sadaka. “Sadaka yake” ni tafsiri ya kawaida na wazi; “ilikuwa” huifanya sentensi ya orodha isomeke kwa Kiswahili cha kawaida.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: sinia moja la fedha
  rationale: קַעֲרָה humaanisha chombo kipana, mara nyingi kisicho na kina kirefu. “Sinia” linafaa kwa chombo hicho na hutofautisha chombo hiki na מִזְרָק inayofuata.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: lenye uzito wa shekeli mia moja na thelathini
  rationale: Huhifadhi taarifa ya Kiebrania kuhusu uzito wa chombo huku ikitumia muundo wa asili na unaoeleweka katika Kiswahili.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: bakuli moja la fedha
  rationale: מִזְרָק ni bakuli au beseni lililotumiwa katika huduma ya dhabihu. “Bakuli” ni neno la sasa na linaloeleweka kwa urahisi, bila kuongeza matumizi ambayo mstari wenyewe hautaji.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: lenye uzito wa shekeli sabini
  rationale: Kirai hiki kinaeleza uzito wa chombo cha pili; kurudia “lenye uzito wa” huondoa utata na ni Kiswahili cha asili.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai kinaonyesha kiwango rasmi cha uzani kilichohusishwa na mahali patakatifu. “Kwa kipimo cha” hufafanua kazi yake bila kubadili maana ya kiibada.
- source_word: שְׁנֵיהֶם
  choice: vyombo hivyo viwili
  rationale: Kiebrania hurejelea vitu vyote viwili. Kutaja “vyombo” kwa uwazi ni kwa kawaida zaidi katika Kiswahili na kuzuia kiwakilishi kisichoeleweka.
- source_word: מְלֵאִים
  choice: vilijaa
  rationale: Ni kivumishi cha kiarifu kinachoeleza kuwa vyombo vyote viwili vilikuwa vimejaa; “vilijaa” ni muundo mfupi na wa kawaida.
- source_word: סֹלֶת
  choice: unga laini
  rationale: סֹלֶת ni unga uliosafishwa vizuri uliotumiwa katika sadaka. “Unga laini” ni tafsiri iliyo wazi na isiyoongeza aina maalumu ya nafaka ambayo haikutajwa hapa.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Hueleza jinsi unga ulivyotayarishwa. “Uliochanganywa na mafuta” ni sahihi na la sasa kuliko maneno ya kizamani.
- source_word: לְמִנְחָה
  choice: kwa ajili ya sadaka ya nafaka
  rationale: Katika sheria za kikuhani, מִנְחָה hapa ni sadaka inayotokana na nafaka, si sadaka kwa maana ya jumla. Tafsiri hii huhifadhi upekee wa aina hiyo ya sadaka.
