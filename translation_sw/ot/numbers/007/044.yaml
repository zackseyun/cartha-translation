  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: sw
  text: sahani moja ya dhahabu yenye uzito wa shekeli kumi,[a] iliyojaa uvumba;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa maana halisi, “sahani moja, dhahabu kumi, iliyojaa uvumba”; neno “shekeli” limeongezwa kwa ufafanuzi kutokana na kanuni ya uzito inayorudiwa katika sura hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sahani
  rationale: Katika orodha inayorudiwa katika Hesabu 7, neno hili linamaanisha chombo kidogo cha kuwekea uvumba. “Sahani” ni neno la kawaida na la kueleweka bila kulifanya kuwa kijiko mahsusi.
- source_word: אַחַת
  choice: moja
  rationale: Ni namba ya kawaida inayopatana na nomino ya kike כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: ya dhahabu yenye uzito wa shekeli kumi
  rationale: Muundo huu unaonyesha dhahabu na uzito wa chombo; kipimo cha “shekeli” kinaeleweka kutokana na kanuni ya uzito inayorudiwa katika sura hii. Kutaja uzito wazi kunatoa Kiswahili cha asili na chenye kueleweka.
- source_word: מְלֵאָה
  choice: iliyojaa
  rationale: Kivumishi hiki kinaeleza hali ya chombo na yaliyomo ndani yake; “iliyojaa” ni kifupi na cha kawaida.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa dutu yenye harufu nzuri inayoteketezwa katika ibada.
