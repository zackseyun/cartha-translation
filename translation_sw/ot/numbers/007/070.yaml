lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: mbeberu wa mbuzi
  rationale: Kirai hiki cha Kiebrania ni nahau inayomaanisha mbuzi dume. Neno “mbeberu” ni la kawaida katika Kiswahili sanifu kwa mbuzi dume na linabainisha aina ya mnyama wa dhabihu.
- source_word: אֶחָד
  choice: mmoja
  rationale: Namba hii inahesabu mnyama wa dhabihu; kuihifadhi kunadumisha mtindo wa orodha unaorudiwa katika Hesabu 7.
- source_word: לְחַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Katika muktadha wa dhabihu, חַטָּאת humaanisha sadaka inayohusiana na dhambi. “Kwa ajili ya” linawakilisha kiambishi לְ katika muundo huu wa orodha, huku “sadaka ya dhambi” likiweka wazi maana ya kiibada.
theological_decisions:
- issue: Maana ya חַטָּאת katika muktadha wa dhabihu
  choice: sadaka ya dhambi
  alternative: dhambi
  rationale: Mstari huu ni sehemu ya orodha ya sadaka, kwa hiyo maana ya kitu kinachotolewa kama sadaka ndiyo inayodaiwa na muktadha. Hata hivyo, tanbihi inahifadhi uwezekano wa msingi wa neno kumaanisha “dhambi.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni fupi, yenye heshima, na inafuata mtindo wa orodha ya sadaka. “Mbeberu” limetumiwa kwa usahihi na kwa uelewekevu kumaanisha mbuzi dume.
