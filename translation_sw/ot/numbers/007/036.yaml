  yaml_path: translation/ot/numbers/007/036.yaml
  text: On the fifth day Shelumiel son of Zurishaddai[a], leader of the sons of Simeon,
translation:
  language: sw
  text: Siku ya tano, kiongozi wa wana wa Simeoni[a], Shelumieli mwana wa Surishadai,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wa Wasimeoni.” Kiebrania kinasema kwa maana halisi zaidi, “wa wana wa Simeoni.”
