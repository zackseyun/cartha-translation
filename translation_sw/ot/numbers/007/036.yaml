lexical_decisions:
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: Siku ya tano
  rationale: Hii ndiyo njia ya kawaida na ya asili katika Kiswahili ya kuonyesha wakati kwa kutumia namba ya mpangilio; haiongezi maneno yasiyokuwapo katika mstari huu.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Katika muktadha huu neno hilo humaanisha mkuu anayetambuliwa wa kabila. ‘Kiongozi’ ni wazi katika Kiswahili cha sasa na halidokezi ufalme kama ‘mwana-mfalme.’
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: wa wana wa Simeoni
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania na uhusiano wa kiongozi huyo na wazao wa Simeoni. Kiswahili laini zaidi kinaweza kusema ‘wa Wasimeoni,’ kama ilivyoelezwa katika tanbihi.
- source_word: שְׁלֻמִיאֵל
  choice: Shelumieli
  rationale: Jina limetoholewa kwa namna inayotambulika na inayofaa mfumo wa sauti wa Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ndio usemi wa kawaida wa Kiswahili katika kutaja nasaba ya mtu.
- source_word: צוּרִישַׁדָּי
  choice: Surishadai
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili inayohifadhi kwa karibu matamshi ya jina la Kiebrania.
