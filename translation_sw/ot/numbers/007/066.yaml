lexical_decisions:
- source_word: בַּיּוֹם הָעֲשִׂירִי
  choice: Siku ya kumi
  rationale: Hii ni kauli ya kawaida na ya asili ya Kiswahili kuonyesha wakati katika mfululizo huu; namba ya mpangilio imehifadhiwa.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Katika Hesabu neno hili humaanisha mkuu anayetambuliwa kuwa mwakilishi wa kabila; “kiongozi” ni wazi na halileti dhana isiyokusudiwa ya ufalme.
- source_word: לִבְנֵי דָן
  choice: wa wana wa Dani
  rationale: Muundo huu unatambulisha jamii iliyowakilishwa na kiongozi na unahifadhi picha ya kifamilia ya Kiebrania בני.
- source_word: אֲחִיעֶזֶר
  choice: Ahiezeri
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili badala ya kutafsiriwa.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ni muundo wa kawaida wa kutaja ukoo wa mtu kwa jina la baba yake.
- source_word: עַמִּישַׁדָּי
  choice: Amishadai
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili badala ya kutafsiriwa.
