base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/035.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Elizur son of Shedeur.'
translation:
  language: sw
  text: 'na kwa sadaka za amani[a]: ng’ombe wawili, kondoo dume watano, mbuzi dume watano, na wana-kondoo dume watano wa mwaka mmoja. Hii ilikuwa sadaka ya Elisuri mwana wa Shedeuri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za hali njema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: na kwa dhabihu ya sadaka za amani
  rationale: Viambishi וּלְ vinaendeleza orodha na kuonyesha kusudi; זֶבַח ni dhabihu, na שְׁלָמִים ni istilahi ya ibada yenye maana zinazoweza kujumuisha amani, ushirika, na hali njema. ‘Sadaka za amani’ inadumisha istilahi iliyozoeleka bila kuficha mbadala halali.
- source_word: בָּקָר שְׁנַיִם
  choice: ng’ombe wawili
  rationale: בָּקָר ni jina la jumla la mifugo ya ng’ombe na halibainishi jinsia; ‘ng’ombe wawili’ huhifadhi upana huo.
- source_word: אֵילִם חֲמִשָּׁה
  choice: kondoo dume watano
  rationale: אֵילִם humaanisha kondoo wa kiume waliokomaa, yaani kondoo dume.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: mbuzi dume watano
  rationale: עַתֻּדִים hubainisha mbuzi wa kiume, hivyo ‘dume’ imewekwa wazi.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: wana-kondoo dume watano wa mwaka mmoja
  rationale: כְּבָשִׂים hapa ni wana-kondoo wa kiume, na בְּנֵי שָׁנָה ni nahau ya walio na umri wa mwaka mmoja.
- source_word: זֶה קָרְבַּן
  choice: Hii ndiyo iliyokuwa sadaka ya
  rationale: קָרְבַּן ni kitu kinacholetwa kama sadaka. Wakati uliopita unasomeka kwa kawaida katika simulizi hii, huku ‘ndiyo’ ikihifadhi mkazo wa זֶה.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Elisuri mwana wa Shedeuri
  rationale: Majina yamenukuliwa kwa tahajia inayofaa mfumo wa sauti wa Kiswahili; בֶּן imetafsiriwa moja kwa moja kuwa ‘mwana wa’.
theological_decisions:
- issue: Maana ya istilahi ya dhabihu שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za hali njema
  rationale: Neno la Kiebrania lina uwanja mpana wa maana unaohusiana na amani, ukamilifu/hali njema, na ushirika wa mlo wa dhabihu. Tafsiri kuu inadumisha istilahi ya jadi, na tanbihi inalinda uwezekano mwingine bila kulazimisha tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa orodha na marudio ya fomula ya sadaka yamehifadhiwa. Alama ya tanbihi imewekwa baada ya istilahi inayofafanuliwa, si baada ya ‘ng’ombe wawili’.
