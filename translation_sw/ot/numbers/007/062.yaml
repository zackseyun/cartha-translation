  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: sw
  text: sahani moja ya dhahabu yenye uzito wa shekeli kumi,[a] iliyojaa uvumba;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “sahani moja, dhahabu kumi, iliyojaa uvumba.” Kipimo cha uzito “shekeli” kinaeleweka kutokana na muundo wa matoleo unaorudiwa katika Hesabu 7.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sahani
  rationale: Katika muktadha wa matoleo ya hema la kukutania, neno hili linamaanisha chombo kidogo cha kuwekea uvumba, si kiganja halisi. “Sahani” ni neno la kawaida na linalofaa kwa chombo hiki.
- source_word: אַחַת
  choice: moja
  rationale: Ni namba ya kuonyesha idadi ya chombo.
- source_word: עֲשָׂרָה
  choice: kumi
  rationale: Ni namba inayotaja uzito wa chombo.
- source_word: זָהָב
  choice: ya dhahabu
  rationale: Hapa dhahabu ni nyenzo ambayo sahani ilitengenezwa.
- source_word: עֲשָׂרָה זָהָב
  choice: yenye uzito wa shekeli kumi
  rationale: Ingawa neno שֶׁקֶל halijaandikwa katika mstari huu uliofupishwa, muundo unaorudiwa katika Hesabu 7 unaonyesha kwamba kipimo cha uzito cha shekeli kinakusudiwa.
- source_word: מְלֵאָה
  choice: ikiwa imejaa
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kivumishi kinachoeleza hali ya chombo.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa dutu yenye harufu nzuri iliyoteketezwa katika ibada.
