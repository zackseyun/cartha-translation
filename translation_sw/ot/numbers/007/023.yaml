source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/023.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Nethanel son of Zuar.'
translation:
  language: sw
  text: 'na kwa ajili ya dhabihu ya sadaka za amani[a]: ng’ombe wawili, kondoo dume watano, mbuzi dume watano, na wanakondoo dume watano wa mwaka mmoja. Hii ilikuwa sadaka ya Nethaneli mwana wa Suari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za ustawi” kwa neno la Kiebrania שְׁלָמִים.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח
  choice: na kwa ajili ya dhabihu ya
  rationale: Kiunganishi na kihusishi vinaanzisha kipengele kinachofuata katika orodha; usemi huu ni wa kawaida katika Kiswahili na unahifadhi uhusiano wa kisarufi wa Kiebrania.
- source_word: הַשְּׁלָמִים
  choice: sadaka za amani
  rationale: Hili ni jina la kundi maalumu la sadaka. Tafsiri ya jadi “sadaka za amani” inadumisha istilahi ya kiibada, huku tanbihi ikionyesha maana nyingine zinazowezekana.
- source_word: בָּקָר שְׁנַיִם
  choice: ng’ombe wawili
  rationale: בָּקָר ni istilahi ya jumla ya mifugo ya bovini na haibainishi jinsia; “ng’ombe wawili” haliwekei matini jinsia ambayo haikutajwa.
- source_word: אֵילִם חֲמִשָּׁה
  choice: kondoo dume watano
  rationale: אֵילִם humaanisha kondoo wa kiume waliokomaa, kwa hiyo “kondoo dume” ni sahihi na wazi.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: mbuzi dume watano
  rationale: עַתּוּדִים hurejelea mbuzi wa kiume; tafsiri hii ni ya kawaida na bayana katika Kiswahili cha sasa.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: wanakondoo dume watano wa mwaka mmoja
  rationale: כְּבָשִׂים hapa ni wanakondoo wa kiume, na בְּנֵי שָׁנָה hubainisha umri wa mwaka mmoja.
- source_word: זֶה קָרְבַּן
  choice: Hii ndiyo ilikuwa sadaka ya
  rationale: Hii ni fomula ya kuhitimisha na kutambulisha sadaka; wakati uliopita unaendana na masimulizi ya Kiswahili.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: Nethaneli mwana wa Suari
  rationale: Majina yametoholewa kwa namna inayosomeka katika Kiswahili, na patronimiki בֶּן imetafsiriwa kwa usemi wa kawaida “mwana wa.”
theological_decisions:
- issue: Maana ya istilahi ya dhabihu שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za ustawi
  rationale: Neno la Kiebrania linaweza kusisitiza amani, ushirika, au hali njema. Tafsiri kuu inadumisha istilahi inayotambulika bila kudai kwamba wazo moja pekee ndilo lililokusudiwa; uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Istilahi za dhabihu zimetolewa kwa uthabiti; orodha na jinsia za wanyama zimehifadhiwa pale zinapobainishwa na Kiebrania.
