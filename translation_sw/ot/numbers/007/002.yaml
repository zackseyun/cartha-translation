  yaml_path: translation/ot/numbers/007/002.yaml
  text: Then the leaders of Israel[a], the heads of their fathers’ houses, brought offerings. They were the leaders of the tribes[c][b]; they were the ones standing over those who were counted.
translation:
  language: sw
  text: Ndipo viongozi wa Israeli, yaani wakuu wa koo za baba zao,[a] wakaleta matoleo. Hao ndio viongozi wa makabila; hao ndio wasimamizi wa wale waliohesabiwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Koo za baba zao” ni vitengo vya ukoo au familia za upande wa baba katika Israeli.
    reason: cultural_note
  - marker: b
    text: Au, “hao ndio waliokuwa wakiwasimamia walioandikishwa katika sensa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: wakaleta matoleo
  rationale: Hifili ya קרב humaanisha kuleta karibu au kuwasilisha; katika muktadha wa kuwekwa wakfu katika Hesabu 7, inalenga zawadi zinazotolewa. Kiswahili ‘wakaleta matoleo’ ni cha kawaida na kinaonyesha maana ya kimuktadha, huku tanbihi ikihifadhi uwezekano wa ‘wakawasilisha.’
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: viongozi wa Israeli
  rationale: נָשִׂיא hapa ni kiongozi au mkuu wa kikabila, si lazima mwana wa mfalme. ‘Viongozi’ ni wazi, cha sasa, na hakileti dhana ya kifalme isiyokusudiwa.
- source_word: רָאשֵׁי בֵּית אֲבֹתָם
  choice: wakuu wa jamaa za baba zao
  rationale: Kirai hiki kinataja vitengo vya ukoo vinavyotokana na mababu. ‘Jamaa za baba zao’ huhifadhi muundo wa ukoo wa upande wa baba bila kutumia tafsiri ngumu isiyo ya kawaida.
- source_word: הֵם נְשִׂיאֵי הַמַּטֹּת
  choice: Hao ndio waliokuwa viongozi wa makabila
  rationale: מַטּוֹת maana yake ya msingi ni ‘fimbo,’ lakini hapa ni istilahi ya kawaida ya makabila ya Israeli. ‘Makabila’ huwasilisha rejeleo la kijamii na kisiasa kwa uwazi.
- source_word: הֵם הָעֹמְדִים עַל
  choice: hao ndio waliokuwa wasimamizi wa
  rationale: עמד pamoja na עַל hapa huonyesha kusimamia au kuwa na mamlaka juu ya kundi fulani. ‘Wasimamizi wa’ ni Kiswahili cha kawaida kinachowasilisha kazi hiyo kwa usahihi kuliko tafsiri ya kimatini ‘waliosimama juu ya.’
- source_word: הַפְּקֻדִים
  choice: wale waliohesabiwa
  rationale: Neno hili linawahusu waliokuwa wamehesabiwa au kuandikishwa katika sensa. ‘Wale waliohesabiwa’ ni wazi na haliongezi kwa lazima dhana ya kijeshi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Ndipo’ na mfuatano wa vitenzi vya ‘waka-’ huhifadhi mwendelezo wa simulizi. Marudio ya ‘hao ndio’ yanahifadhi msisitizo wa הֵם mara mbili. Tanbihi zote zina viashiria vinavyolingana katika matini kuu.
