base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/081.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: sw
  text: ng’ombe dume mmoja kutoka kundini, kondoo dume mmoja, mwanakondoo dume mmoja wa mwaka mmoja, kwa ajili ya sadaka ya kuteketezwa;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר
  choice: ng’ombe dume
  rationale: Neno hili humaanisha fahali au ng’ombe dume mchanga; “ng’ombe dume” ni wazi na la kawaida katika orodha ya wanyama wa dhabihu.
- source_word: אֶחָד
  choice: mmoja
  rationale: Kurudia namba hii kunadumisha mpangilio wa kuhesabu kila mnyama mmoja mmoja.
- source_word: בֶּן בָּקָר
  choice: kutoka kundini
  rationale: Ni nahau ya Kiebrania inayomhusisha mnyama na kundi la ng’ombe; pamoja na “ng’ombe dume,” tafsiri hii huepuka urudiaji usio wa asili huku ikihifadhi uainishaji wake.
- source_word: אַיִל
  choice: kondoo dume
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kondoo mume aliyekomaa katika muktadha wa dhabihu.
- source_word: כֶּבֶשׂ
  choice: mwanakondoo dume
  rationale: Neno la Kiebrania humaanisha mwanakondoo wa kiume, hivyo tafsiri inahifadhi jinsia iliyotajwa.
- source_word: בֶּן שְׁנָתוֹ
  choice: wa mwaka mmoja
  rationale: Nahau hii inaeleza umri wa mnyama; usemi huu ni wa asili na unaeleweka katika Kiswahili cha sasa.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni sadaka iliyoteketezwa yote; istilahi hii inaendana na matumizi ya kibiblia ya Kiswahili na muundo wa orodha.
