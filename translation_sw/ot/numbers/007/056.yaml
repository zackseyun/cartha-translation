  text: one gold dish weighing ten shekels[a], full of incense;
translation:
  language: sw
  text: sahani moja ya dhahabu yenye uzito wa shekeli kumi[a], iliyojaa uvumba;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “sahani moja ya dhahabu, kumi [shekeli], iliyojaa uvumba.” Kiebrania hakitaji kipimo cha uzito hapa, lakini katika fomula hii ya sadaka inayorudiwa, maana ni shekeli kumi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sahani
  rationale: Katika muktadha wa sadaka za Hesabu 7, neno hili linamaanisha chombo kidogo cha kuwekea uvumba, si kiganja wala kijiko cha kulia. “Sahani” ni neno la kawaida na linalofaa kwa chombo hiki.
- source_word: אַחַת
  choice: moja
  rationale: Ni namba ya kawaida inayopatana na nomino ya kike כַּף.
- source_word: עֲשָׂרָה
  choice: kumi
  rationale: Namba hii inaeleza kipimo cha uzito ambacho hakikutajwa wazi katika Kiebrania; katika fomula inayorudiwa katika Hesabu 7, kipimo kinachoeleweka ni shekeli.
- source_word: זָהָב
  choice: ya dhahabu
  rationale: Inaonyesha kitu ambacho chombo kilitengenezwa nacho.
- source_word: מְלֵאָה
  choice: iliyojaa
  rationale: Inaeleza hali ya chombo na yaliyomo ndani yake kwa Kiswahili cha kawaida na fasaha.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa dutu yenye harufu nzuri iliyotolewa katika ibada.
