  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/071.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs. This was the offering of Ahiezer son of Ammishaddai.'
translation:
  language: sw
  text: 'na kwa ajili ya dhabihu ya amani[a]: ng’ombe wawili, kondoo dume watano, mbuzi dume watano, na wanakondoo watano wa mwaka mmoja. Hii ndiyo sadaka ya Ahiezeri mwana wa Amishadai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhabihu ya ushirika” au “dhabihu ya hali njema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: na kwa ajili ya dhabihu ya amani
  rationale: Viambishi vya Kiebrania vinaendeleza orodha na kutambulisha dhabihu ya mwisho. “Dhabihu ya amani” ni istilahi fupi, ya heshima, na inayoeleweka katika muktadha wa ibada; tanbihi inahifadhi maana nyingine zinazowezekana za שְׁלָמִים.
- source_word: בָּקָר שְׁנַיִם
  choice: ng’ombe wawili
  rationale: בָּקָר ni mifugo ya jamii ya ng’ombe bila kubainisha jinsia; “ng’ombe wawili” huepuka kuongeza jinsia ambayo Kiebrania hakijataja.
- source_word: אֵילִם חֲמִשָּׁה
  choice: kondoo dume watano
  rationale: אֵילִם humaanisha kondoo dume, na tafsiri hii inabainisha jinsia kwa usahihi na kwa Kiswahili cha kawaida.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: mbuzi dume watano
  rationale: עַתֻּדִים humaanisha mbuzi wa kiume; “mbuzi dume” ni usemi wazi na wa sasa.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: wanakondoo watano wa mwaka mmoja
  rationale: Usemi wa Kiebrania unabainisha umri wa wanyama. “Wa mwaka mmoja” ni Kiswahili cha asili kinachohifadhi sharti hilo.
- source_word: זֶה קָרְבַּן
  choice: Hii ndiyo sadaka ya
  rationale: Ingawa Kiebrania hutumia fomula ya moja kwa moja yenye maana ya “hii ni,” Kiswahili hiki kinafaa katika simulizi na hakihitaji kuingiza wakati uliopita usiotamkwa wazi katika chanzo.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: Ahiezeri mwana wa Amishadai
  rationale: Majina yamenukuliwa kwa mfumo unaosomeka kiasili katika Kiswahili, na “mwana wa” huwakilisha בֶּן moja kwa moja.
theological_decisions:
- issue: Maana ya istilahi ya dhabihu שְׁלָמִים
  choice: dhabihu ya amani
  alternative: dhabihu ya ushirika; dhabihu ya hali njema
  rationale: Istilahi ya Kiebrania inaweza kuhusishwa na amani, ushirika, au hali njema. Matini kuu inatumia istilahi ya kawaida “dhabihu ya amani,” huku tanbihi ikihifadhi upana wa maana bila kuamua kwa lazima kusudi moja la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha ya dhabihu umehifadhiwa, na jinsia ya ng’ombe haijabainishwa kwa kuwa chanzo hakufanyi hivyo.
