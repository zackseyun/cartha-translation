  text: ng’ombe dume mmoja wa kundi[a], kondoo dume mmoja, mwanakondoo dume mmoja[b] wa mwaka mmoja, kwa sadaka ya kuteketezwa;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “ng’ombe dume mmoja, mwana wa kundi la ng’ombe.”
    reason: lexical_alternative
  - marker: b
    text: Au “mwanakondoo mmoja”; neno la Kiebrania hapa hutumiwa mara nyingi kumaanisha mwanakondoo dume katika miktadha ya dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: ng’ombe dume
  rationale: Neno hili humaanisha fahali au ng’ombe dume mchanga; “ng’ombe dume” ni wazi na linafaa katika orodha ya wanyama wa dhabihu.
- source_word: אֶחָד
  choice: mmoja
  rationale: Namba hii inarudiwa kwa kila mnyama; imetafsiriwa kwa uthabiti ili kuhifadhi muundo wa orodha.
- source_word: בֶּן בָּקָר
  choice: wa kundi
  rationale: Kirai hiki, kihalisi “mwana wa ng’ombe,” ni nahau inayomtambulisha mnyama kuwa wa jamii ya ng’ombe; “wa kundi” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: אַיִל
  choice: kondoo dume
  rationale: Ni neno la kawaida kwa kondoo dume aliyekomaa, hasa katika muktadha wa dhabihu.
- source_word: כֶּבֶשׂ
  choice: mwanakondoo dume
  rationale: Neno hili humaanisha mwanakondoo; katika orodha ya dhabihu, kutaja kwamba ni dume huweka wazi jinsia inayodokezwa na matumizi ya neno hili.
- source_word: בֶּן שְׁנָתוֹ
  choice: wa mwaka mmoja
  rationale: Nahau hii hutaja umri wa mnyama, yaani mwenye mwaka mmoja au aliye katika mwaka wake wa kwanza.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni sadaka inayoteketezwa yote; usemi huu unafaa katika muundo wa orodha ya vitu vya kutolewa.
