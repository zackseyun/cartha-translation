source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/077.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five male lambs a year old[b]. This was the offering of Pagiel son of Ocran.'
translation:
  language: sw
  text: 'na kwa ajili ya dhabihu ya sadaka za amani[a]: ng’ombe wawili, kondoo dume watano, mbuzi dume watano, na wanakondoo dume watano wenye umri wa mwaka mmoja. Hii ilikuwa sadaka ya Pagieli mwana wa Okrani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za ustawi” kwa istilahi ya Kiebrania ambayo kwa kawaida hutafsiriwa “sadaka za amani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: na kwa ajili ya dhabihu ya sadaka za amani
  rationale: Viambishi vya Kiebrania vinaendeleza orodha na kutaja aina ya dhabihu. “Sadaka za amani” ni istilahi ya kibiblia inayotambulika, huku tanbihi ikihifadhi maana nyingine zinazowezekana za שְׁלָמִים.
- source_word: בָּקָר שְׁנַיִם
  choice: ng’ombe wawili
  rationale: בָּקָר ni jina la jumla la ng’ombe na halibainishi jinsia katika kifungu hiki; kwa hiyo “ng’ombe wawili” huepuka kuongeza “mafahali” bila msingi wa wazi.
- source_word: אֵילִם חֲמִשָּׁה
  choice: kondoo dume watano
  rationale: אֵילִם humaanisha kondoo wa kiume waliokomaa; “kondoo dume” ni Kiswahili cha kawaida na sahihi.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: mbuzi dume watano
  rationale: עַתֻּדִים hutaja mbuzi wa kiume, hivyo jinsia imehifadhiwa wazi.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: wanakondoo dume watano wenye umri wa mwaka mmoja
  rationale: כְּבָשִׂים hapa ni wanakondoo wa kiume, na בְּנֵי שָׁנָה hueleza kwamba kila mmoja alikuwa na umri wa mwaka mmoja.
- source_word: זֶה קָרְבַּן
  choice: Hii ndiyo ilikuwa sadaka ya
  rationale: Kauli hii inafunga orodha ya sadaka ya kiongozi huyo. Wakati uliopita unafaa muktadha wa simulizi, huku “sadaka” ikitoa maana ya קָרְבַּן kwa kawaida.
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  choice: Pagieli mwana wa Okrani
  rationale: Majina yamenukuliwa kwa maumbo yanayosomeka kwa kawaida katika Kiswahili, na בֶּן imetafsiriwa “mwana wa.”
theological_decisions:
- issue: Maana ya istilahi ya dhabihu שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za ustawi
  rationale: Istilahi hiyo inaweza kuhusishwa na amani, ustawi, au ushirika. Tafsiri kuu inahifadhi jina la kimapokeo linalotambulika bila kudai kwamba ndilo pekee linalowezekana; tanbihi inaonyesha upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa orodha umehifadhiwa, jinsia ya wanyama imetajwa pale Kiebrania kinapoibainisha, na utata halisi wa שְׁלָמִים umewekwa katika tanbihi.
