source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: sw
  text: Sadaka yake ilikuwa sahani moja ya fedha[a], yenye uzito wa shekeli 130, na bakuli moja la fedha, lenye uzito wa shekeli 70, kwa kipimo cha shekeli ya mahali patakatifu[b]. Vyombo hivyo viwili vilikuwa vimejaa unga laini uliochanganywa na mafuta kwa ajili ya sadaka ya nafaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sinia.” Neno la Kiebrania linamaanisha chombo kipana cha fedha kisicho na kina kirefu kilichotumiwa katika patakatifu.
    reason: lexical_alternative
  - marker: b
    text: Yaani, kwa kiwango rasmi cha uzani kilichotumiwa katika mahali patakatifu.
    reason: clarification
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Sadaka yake ilikuwa
  rationale: Katika muktadha huu wa ibada, קָרְבָּן ni kitu kinacholetwa mbele za Mungu kama sadaka. Muundo huu pia huwasilisha kwa Kiswahili fasaha orodha ya Kiebrania isiyo na kitenzi wazi.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: sahani moja ya fedha
  rationale: קְעָרָה ni chombo kipana na kisicho na kina kirefu katika orodha ya vyombo vya maskani; “sahani” ni neno la kawaida na linaloeleweka, huku “sinia” likibaki uwezekano wa kileksia.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yenye uzito wa shekeli 130
  rationale: Hueleza uzito wa sahani. Muundo wa “yenye uzito wa” ni wa asili katika Kiswahili na unaweka wazi uhusiano huo.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: bakuli moja la fedha
  rationale: מִזְרָק ni chombo cha ibada kilichotumika katika huduma ya patakatifu. “Bakuli” hueleza umbo la chombo kwa Kiswahili cha sasa bila kudai matumizi ambayo mstari huu hautaji.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: lenye uzito wa shekeli 70
  rationale: Kirai hiki kinataja uzito wa bakuli; kitenzi-elezi kimeongezwa ili maana iwe wazi na ya kawaida katika Kiswahili.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai hiki kinaonyesha kiwango rasmi cha uzani kilichohusishwa na patakatifu. “Kwa kipimo cha” hufafanua kazi ya shekeli hapa bila kubadili maana.
- source_word: שְׁנֵיהֶם
  choice: Vyombo hivyo viwili
  rationale: Kiwakilishi kinarejelea sahani na bakuli. Kutaja “vyombo” huondoa utata wa Kiswahili huku kukidumisha kiini cha marejeo hayo mawili.
- source_word: מְלֵאִים
  choice: vilikuwa vimejaa
  rationale: Hali ya vyombo vyote viwili imeelezwa kwa namna ya kawaida na wazi katika Kiswahili.
- source_word: סֹלֶת
  choice: unga laini
  rationale: סֹלֶת ni unga uliosagwa vizuri uliotumiwa kwa sadaka; “unga laini” ni tafsiri sahihi na inayoeleweka kwa wasomaji wa sasa.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Kauli tendwa ya Kiebrania inaonyesha kwamba unga ulikuwa umechanganywa na mafuta; tafsiri hii hudumisha hali hiyo.
- source_word: לְמִנְחָה
  choice: kwa ajili ya sadaka ya nafaka
  rationale: Katika sheria za dhabihu, מִנְחָה humaanisha sadaka inayotokana na nafaka, si sadaka kwa maana pana tu.
