  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini cha sasa na kinachoeleweka. Tarakimu zimetumiwa kwa uzito ili orodha ndefu ya kiibada isomeke kwa urahisi; “mahali patakatifu” huhifadhi maana ya הַקֹּדֶשׁ katika muktadha wa maskani.
