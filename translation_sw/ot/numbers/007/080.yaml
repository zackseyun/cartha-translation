lexical_decisions:
- source_word: כַּף
  choice: bakuli
  rationale: Katika orodha ya sadaka za maskani, neno hili linamaanisha chombo kidogo cha kuwekea uvumba, si kiganja. “Bakuli” ni neno la kawaida na linaloeleweka kwa chombo hicho.
- source_word: אַחַת
  choice: moja
  rationale: Ni namba ya kawaida inayopatana na nomino ya kike כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: yenye uzito wa shekeli kumi
  rationale: Kauli ya Kiebrania imefupisha kipimo cha uzito; kutokana na muundo unaorudiwa katika sura hii, kipimo kinachoeleweka ni shekeli. Kutaja uzito wazi kunaleta Kiswahili cha kawaida.
- source_word: זָהָב
  choice: ya dhahabu
  rationale: Inaonyesha kwamba chombo kilitengenezwa kwa dhahabu.
- source_word: מְלֵאָה
  choice: iliyojaa
  rationale: Kivumishi hiki kinaeleza hali ya chombo kuwa kimejaa kilichomo.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa dutu iliyoteketezwa ili kutoa harufu nzuri katika ibada ya maskani.
