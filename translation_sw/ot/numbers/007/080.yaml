    text: 'Kwa karibu, Kiebrania husema: “bakuli moja la dhahabu, [cha] kumi [za dhahabu], lililojaa uvumba.” Neno “shekeli” ni kipimo cha uzito kinachoeleweka kutokana na muundo wa orodha ya sadaka katika sura hii.'
