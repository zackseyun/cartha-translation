  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
translation:
  language: sw
  text: 'na kwa dhabihu ya sadaka za amani[a]: ng’ombe wawili, kondoo dume watano, mbuzi dume watano, na wana-kondoo watano wa mwaka mmoja. Hii ndiyo ilikuwa sadaka ya Eliasafu mwana wa Deueli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za ustawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: na kwa ajili ya dhabihu ya sadaka za amani
  rationale: Viambishi vya Kiebrania vinaendeleza orodha kwa maana ya “na kwa ajili ya,” huku זֶבַח ikionyesha dhabihu na שְׁלָמִים ikiwa istilahi ya sadaka inayohusishwa na amani, ukamilifu, au ushirika.
- source_word: בָּקָר שְׁנַיִם
  choice: ng’ombe wawili
  rationale: בָּקָר ni jina la jumla la mifugo ya ng’ombe na halibainishi jinsia hapa; “ng’ombe wawili” huhifadhi kutobainishwa huko.
- source_word: אֵילִם חֲמִשָּׁה
  choice: kondoo dume watano
  rationale: אֵילִם humaanisha kondoo wa kiume waliokomaa; tafsiri hii inabainisha jinsia kwa lugha ya kawaida ya Kiswahili.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: mbuzi dume watano
  rationale: עַתֻּדִים humaanisha mbuzi wa kiume, hivyo jinsia imehifadhiwa wazi.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: wana-kondoo watano wa mwaka mmoja
  rationale: Kirai hicho kwa maana halisi ni wana-kondoo walio na umri wa mwaka mmoja; mpangilio huu ni wa kawaida na wazi kwa Kiswahili.
- source_word: זֶה קָרְבַּן
  choice: Hii ndiyo ilikuwa sadaka ya
  rationale: זֶה קָרְבַּן ni muhtasari wa sadaka iliyoorodheshwa. Wakati uliopita unafaa katika simulizi la Kiswahili, na “sadaka” ni neno pana linalofaa muktadha huu.
- source_word: אֶלְיָסָף בֶּן דְּעוּאֵל
  choice: Eliasafu mwana wa Deueli
  rationale: Majina yametoholewa kwa matamshi na maumbo yanayotumika kwa kawaida katika Kiswahili cha Biblia, huku uhusiano wa kifamilia wa בֶּן ukitafsiriwa “mwana wa.”
theological_decisions:
- issue: Maana ya istilahi ya dhabihu שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za ustawi
  rationale: “Sadaka za amani” huhifadhi istilahi inayotambulika katika mapokeo ya tafsiri bila kufunga maana yake kwa ushirika pekee au ustawi pekee; tanbihi inaonyesha upana halisi wa istilahi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Muundo wa orodha ya sadaka umehifadhiwa, na jinsia au umri wa wanyama umebainishwa tu pale Kiebrania inapobainisha.
