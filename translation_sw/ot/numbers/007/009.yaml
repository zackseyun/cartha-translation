  text: But to the sons of Kohath he gave none[a], because the service of the holy things was upon them; they were to carry them on the shoulder.
translation:
  language: sw
  text: Lakini hakuwapa wana wa Kohathi kitu chochote, kwa sababu huduma ya vitu vitakatifu[a] ilikuwa juu yao; walipaswa kuvibeba mabegani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa tafsiri ya karibu zaidi: “kwa maana huduma ya patakatifu ilikuwa juu yao; walipaswa kuibeba begani.” Kiebrania huenda inarejelea hasa vitu vitakatifu walivyokabidhiwa Wakohathi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: Lakini ... wana wa Kohathi
  rationale: Kiunganishi וְ kinaonyesha tofauti na zawadi walizopewa koo nyingine katika muktadha uliotangulia. ‘Wana wa Kohathi’ linahifadhi jina rasmi la ukoo kwa lugha ya kibiblia inayoeleweka.
- source_word: לֹא נָתָן
  choice: hakuwapa ... kitu chochote
  rationale: Kitenzi kinarejelea magari na ng’ombe waliotolewa katika mstari uliotangulia. Kiswahili hiki ni cha kawaida na hakiongezi majina hayo moja kwa moja.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kinaanzisha sababu ya kutowapa magari na ng’ombe.
- source_word: עֲבֹדַת הַקֹּדֶשׁ
  choice: jukumu la kuhudumia vitu vitakatifu
  rationale: עֲבֹדָה hapa ni kazi au huduma waliyokabidhiwa, na הַקֹּדֶשׁ katika muktadha huu inaelekea kumaanisha vyombo au vitu vitakatifu walivyopaswa kusafirisha.
- source_word: עֲלֵיהֶם
  choice: walipewa jukumu
  rationale: Nahau ya Kiebrania ni halisi ‘ilikuwa juu yao’; tafsiri hii ya Kiswahili inaonyesha kwa kawaida wajibu waliokabidhiwa bila kutumia tamathali isiyo wazi.
- source_word: בַּכָּתֵף
  choice: mabegani
  rationale: Umoja wa Kiebrania umetumiwa kwa maana ya kugawanyika kwa kila mtu; ‘mabegani’ ni usemi wa kawaida wa Kiswahili katika muktadha wa kubeba.
- source_word: יִשָּׂאוּ
  choice: walipaswa kuvibeba
  rationale: Kauli isiyotimilika hapa inaonyesha wajibu uliowekwa. Kiambishi ‘vi-’ kinarejelea vitu vitakatifu vinavyotajwa katika kishazi kilichotangulia.
