  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha sadaka inayoshughulikia dhambi na unajisi wa kiibada.
