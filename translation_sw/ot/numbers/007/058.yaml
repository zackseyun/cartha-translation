lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: mbuzi dume
  rationale: Kirai hiki cha Kiebrania ni nahau inayomaanisha mbuzi wa kiume. “Mbuzi dume” ni Kiswahili cha kawaida, wazi, na kinabainisha jinsia ya mnyama wa dhabihu.
- source_word: אֶחָד
  choice: mmoja
  rationale: Namba imetajwa wazi ili kudumisha mtindo wa kuorodhesha na kuhesabu sadaka unaorudiwa katika Hesabu 7.
- source_word: לְחַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Katika muktadha wa dhabihu, חַטָּאת humaanisha sadaka inayohusiana na dhambi au utakaso. Kirai hiki kinaonyesha kusudi la sadaka kwa Kiswahili cha kawaida na kinachotambulika.
theological_decisions:
- issue: Jinsi ya kutafsiri חַטָּאת katika muktadha wa dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno la Kiebrania linaweza kusisitiza dhambi au utakaso kutokana na unajisi. “Sadaka ya dhambi” ndiyo istilahi inayotambulika zaidi katika Kiswahili, huku maana nyingine halali ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha fupi, yenye hadhi na inayoeleweka, ikidumisha muundo wa orodha ya dhabihu.
