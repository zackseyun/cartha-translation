  yaml_path: translation/ot/numbers/007/012.yaml
  text: And the one presenting his offering on the first day was Nahshon son of Amminadab[a], of the tribe of Judah.
translation:
  language: sw
  text: Siku ya kwanza, aliyewasilisha sadaka yake alikuwa Nahshoni mwana wa Aminadabu[a], wa kabila la Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyetoa sadaka yake ... kwa niaba ya kabila la Yuda.” Muundo wa Kiebrania unaweza kueleza uhusiano wa Nahshoni na kabila la Yuda na, katika muktadha huu, uwakilishi wake wa kabila hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: alikuwa
  rationale: Muundo wa simulizi unaotokana na היה umetolewa kwa kitenzi kishirikishi cha kawaida katika Kiswahili; mpangilio wa sentensi tayari unaendeleza simulizi bila kuongeza msemo mzito kama ‘ikawa kwamba’.
- source_word: הַמַּקְרִיב
  choice: aliyewasilisha
  rationale: Hii ni participle ya Hiphil ya קרב, ikimtaja mtu anayeileta sadaka karibu au kuiwasilisha. ‘Aliyewasilisha’ ni ya asili na inadumisha maana ya kiibada.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Siku ya kwanza
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha wakati; umewekwa mwanzoni ili sentensi iwe wazi na ya asili.
- source_word: אֶת קָרְבָּנוֹ
  choice: sadaka yake
  rationale: קָרְבָּן hapa ni kitu kinachotolewa katika mazingira ya kuwekwa wakfu kwa maskani; ‘sadaka’ ni neno la kawaida lenye uzito unaofaa wa kiibada.
- source_word: נַחְשׁוֹן
  choice: Nashoni
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likihifadhi umbo la Kiebrania.
- source_word: בֶּן עַמִּינָדָב
  choice: mwana wa Aminadabu
  rationale: Huu ni uwasilishaji wa moja kwa moja na wa kawaida wa nasaba ya Kiebrania.
- source_word: לְמַטֵּה יְהוּדָה
  choice: kwa ajili ya kabila la Yuda
  rationale: לְ inaonyesha uhusiano au uwakilishi katika muktadha huu. ‘Kwa ajili ya’ inadumisha uwezekano kwamba Nashoni alitoa kama mwakilishi wa kabila, badala ya kueleza tu kwamba alikuwa mwanakabila.
