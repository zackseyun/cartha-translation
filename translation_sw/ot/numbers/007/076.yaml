  text: mbuzi dume mmoja kwa sadaka ya dhambi;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sadaka ya utakaso.” Katika miktadha ya dhabihu, neno la Kiebrania חַטָּאת linaweza kumaanisha sadaka inayoshughulikia dhambi na unajisi wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: mbuzi dume
  rationale: Kirai hiki cha Kiebrania humaanisha mbuzi wa kiume. “Mbuzi dume” ni Kiswahili cha kawaida, wazi, na kinahifadhi aina na jinsia ya mnyama wa dhabihu.
- source_word: אֶחָד
  choice: mmoja
  rationale: Namba imetajwa wazi ili kuhifadhi mtindo wa orodha unaojirudia katika Hesabu 7; upatanisho wa kisarufi na “mbuzi” unahitaji “mmoja.”
- source_word: לְחַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Katika muktadha wa dhabihu, חַטָּאת humaanisha sadaka inayohusika na dhambi na utakaso, si dhambi kama dhana pekee. Tafsiri hii ni ya kawaida na inaeleweka kwa wasomaji wa Kiswahili.
theological_decisions:
- issue: Maana ya חַטָּאת katika muktadha wa dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Hapa neno linataja dhabihu, lakini linaweza kusisitiza pia kazi yake ya kuondoa unajisi wa kiibada. “Sadaka ya dhambi” imetumika katika maandishi, huku tafsiri mbadala ikihifadhiwa katika tanbihi ili kutofuta upana wa maana ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. Muundo mfupi wa orodha na idadi iliyotajwa wazi vimehifadhiwa.
