  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/075.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: sw
  text: ng’ombe dume mmoja wa kundi la ng’ombe, kondoo dume mmoja, mwanakondoo dume mmoja wa mwaka mmoja, kwa ajili ya sadaka ya kuteketezwa;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: ng’ombe dume mmoja kutoka kundini
  rationale: פַּר ni ng’ombe dume, na בֶּן בָּקָר humtambulisha kuwa wa kundi la ng’ombe. Tafsiri hii ni ya kawaida na inaepuka urudiaji usio wa lazima.
- source_word: אַיִל אֶחָד
  choice: kondoo dume mmoja
  rationale: אַיִל humaanisha kondoo dume aliyekomaa, hasa katika orodha za dhabihu.
- source_word: כֶּבֶשׂ אֶחָד
  choice: mwanakondoo dume mmoja
  rationale: כֶּבֶשׂ ni mwanakondoo, kwa kawaida wa kiume katika muktadha huu wa dhabihu.
- source_word: בֶּן שְׁנָתוֹ
  choice: wa mwaka mmoja
  rationale: Nahau hii ya Kiebrania huonyesha mnyama wa umri wa mwaka mmoja; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni dhabihu inayoteketezwa kabisa; 'sadaka ya kuteketezwa' ni istilahi inayoeleweka, huku 'kwa ajili ya' ikiwakilisha kiambishi לְ.
- source_word: אֶחָד
  choice: mmoja
  rationale: Idadi inayorudiwa kwa kila mnyama imehifadhiwa wazi katika orodha.
