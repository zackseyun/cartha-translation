  yaml_path: translation/ot/numbers/007/060.yaml
  text: On the ninth day[a], the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: sw
  text: Siku ya tisa, kiongozi wa wana wa Benyamini[a] alikuwa Abidani mwana wa Gideoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiongozi kwa ajili ya wana wa Benyamini.” Kihusishi cha Kiebrania hapa kinaweza kuonyesha uhusiano au uwakilishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַתְּשִׁיעִי
  choice: Siku ya tisa
  rationale: Hii ni njia ya kawaida na ya wazi ya Kiswahili ya kutaja wakati; inaonyesha kuwa tukio lilitokea katika siku ya tisa.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Katika Hesabu 7 neno hili humaanisha mkuu anayetambuliwa wa kabila. “Kiongozi” linaeleweka katika Kiswahili cha sasa bila kuleta dhana ya kifalme ambayo “mwana-mfalme” ingeweza kuleta.
- source_word: לִבְנֵי בִנְיָמִן
  choice: wa wana wa Benyamini
  rationale: “Wa” linaonyesha uhusiano wa kiongozi na kundi la ukoo, huku “wana wa Benyamini” likihifadhi lugha ya kifamilia ya Kiebrania. Kihusishi ל pia kinaweza kumaanisha uwakilishi, jambo linalotajwa katika tanbihi.
- source_word: אֲבִידָן
  choice: Abidani
  rationale: Jina limetoholewa kwa tahajia na matamshi yaliyozoeleka katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ni usemi wa kawaida wa nasaba unaoonyesha kuwa Abidani alikuwa mwana wa Gideoni.
- source_word: גִּדְעֹנִי
  choice: Gideoni
  rationale: Jina limetoholewa kwa namna ya kawaida katika Kiswahili.
theological_decisions:
- issue: Usemi wa kikabila wenye jinsia בְנֵי
  choice: wana wa Benyamini
  alternative: watu wa Benyamini; Wabenyamini
  rationale: “Wana wa Benyamini” huhifadhi picha ya ukoo na umbo la kifamilia la Kiebrania. Katika muktadha huu usemi huo unalitaja kabila linalotokana na babu Benyamini, bila kubadili kimya kimya lugha ya chanzo.
- issue: Maana ya kihusishi ל katika לִבְנֵי בִנְיָמִן
  choice: kiongozi wa wana wa Benyamini
  alternative: kiongozi kwa ajili ya wana wa Benyamini
  rationale: Tafsiri kuu inaonyesha uhusiano wa kiongozi na kabila kwa Kiswahili cha kawaida. Kwa kuwa ל linaweza pia kuonyesha kwamba alikuwa mwakilishi wao, uwezekano huo umehifadhiwa katika tanbihi badala ya kuamuliwa kwa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo mfupi wa aya na majina ya kibiblia yaliyotoholewa umehifadhiwa.
