base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/025.yaml
  text: His offering was one silver plate, its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: sw
  text: Sadaka yake ilikuwa sahani moja ya fedha[a], yenye uzito wa shekeli mia moja na thelathini, na bakuli moja la fedha[b], lenye uzito wa shekeli sabini, kwa kipimo cha shekeli ya mahali patakatifu.[c] Vyote viwili vilikuwa vimejaa unga laini uliochanganywa na mafuta kwa ajili ya sadaka ya nafaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sinia moja ya fedha.”
    reason: lexical_alternative
  - marker: b
    text: Au “beseni moja la fedha.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “kwa shekeli ya mahali patakatifu,” yaani, kwa kufuata kiwango cha uzito cha mahali patakatifu.'
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Sadaka yake ilikuwa
  rationale: קָרְבָּן ni kitu kinacholetwa mbele za Mungu katika muktadha wa ibada. “Sadaka” ni neno la kawaida na sahihi katika Kiswahili, na “ilikuwa” hukamilisha kwa ufasaha muundo wa orodha.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: sahani moja ya fedha
  rationale: קְעָרָה hutaja chombo kama sahani au sinia. “Sahani” ni neno la sasa na linaloeleweka kwa urahisi bila kudai kwa uhakika umbo ambalo maandishi hayafafanui kikamilifu.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yenye uzito wa shekeli mia moja na thelathini
  rationale: Huhifadhi taarifa ya wazi kuhusu uzito huku ikitumia mpangilio wa kawaida wa namba katika Kiswahili.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: bakuli moja la fedha
  rationale: מִזְרָק ni chombo kilichotumiwa katika shughuli za ibada na kinaweza kutafsiriwa bakuli au beseni. “Bakuli” linafaa kwa chombo hiki bila kuleta taswira ya beseni kubwa la kuogea au kuoshea.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: lenye uzito wa shekeli sabini
  rationale: Kitenzi-kivumishi “lenye uzito” kinaweka wazi kuwa idadi hii ni uzito wa bakuli, kama muktadha wa Kiebrania unavyoonyesha.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai hiki kinaonyesha kiwango rasmi cha uzito kilichotumiwa katika mahali patakatifu. “Kwa kipimo cha” huwasilisha kazi hiyo kwa Kiswahili cha kawaida huku tanbihi ikihifadhi muundo wa karibu zaidi wa Kiebrania.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Vyote viwili vilijaa
  rationale: Hurejelea kwa uwazi vyombo viwili na kuwasilisha hali yake kwa Kiswahili fasaha.
- source_word: סֹלֶת
  choice: unga laini
  rationale: סֹלֶת ni unga uliosagwa vizuri uliotumika kwa sadaka. “Unga laini” ni tafsiri ya moja kwa moja na inayoeleweka.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Kirai cha Kiebrania hueleza unga uliotayarishwa kwa kuchanganywa na mafuta; tafsiri hii ni ya kawaida na sahihi.
- source_word: לְמִנְחָה
  choice: kwa ajili ya sadaka ya nafaka
  rationale: Katika muktadha huu wa kikuhani, מִנְחָה ni sadaka ya nafaka, si sadaka kwa maana pana tu.
