base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/015.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: sw
  text: ng’ombe dume mmoja kutoka katika kundi la ng’ombe, kondoo dume mmoja, mwanakondoo dume mmoja wa mwaka mmoja, kwa ajili ya sadaka ya kuteketezwa;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן בָּקָר
  choice: ng’ombe dume mmoja kutoka kundini
  rationale: פַּר humaanisha ng’ombe dume, na בֶּן בָּקָר hubainisha kuwa ni mnyama wa jamii ya ng’ombe. ‘Kutoka kundini’ huhifadhi ubainisho huo bila tafsiri sisisi isiyo ya kawaida.
- source_word: אַיִל
  choice: kondoo dume mmoja
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kondoo dume aliyekomaa katika muktadha wa dhabihu.
- source_word: כֶּבֶשׂ
  choice: mwanakondoo dume mmoja
  rationale: Neno hili humaanisha mwanakondoo, na katika orodha hii ya dhabihu linarejelea mnyama dume; ubainisho wa jinsia unaondoa utata wa Kiswahili.
- source_word: בֶּן שְׁנָתוֹ
  choice: wa mwaka mmoja
  rationale: Nahau hii ya Kiebrania huonyesha umri wa mnyama; Kiswahili hiki ni cha kawaida na wazi.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni sadaka iliyoteketezwa yote. Kauli hii ni ya kawaida katika istilahi za Biblia za Kiswahili na inafaa muundo wa orodha.
- source_word: אֶחָד
  choice: mmoja
  rationale: Idadi imetajwa tena kwa kila mnyama, hivyo imedumishwa ili kuhifadhi mtindo wa orodha ya Kiebrania.
