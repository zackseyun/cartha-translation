  text: בְּ/יוֹם֙ עַשְׁתֵּ֣י עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י אָשֵׁ֑ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/072.yaml
  text: On the eleventh day[a], the leader of the sons of Asher was Pagiel son of Ocran.
translation:
  language: sw
  text: Siku ya kumi na moja, kiongozi wa wana wa Asheri alikuwa Pagieli mwana wa Okrani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/יוֹם ... י֔וֹם
  choice: Siku ya kumi na moja
  rationale: Muundo wa Kiebrania ni fomula ya wakati inayorudiwa katika Hesabu 7; Kiswahili cha kawaida husema kwa ufupi na kwa kawaida, “Siku ya kumi na moja.”
- source_word: עַשְׁתֵּי עָשָׂר
  choice: ya kumi na moja
  rationale: Katika mfululizo huu nambari hiyo ina kazi ya kiordinali; “ya kumi na moja” ni usemi wa asili wa Kiswahili.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Neno hili humaanisha mkuu anayetambuliwa wa kabila. “Kiongozi” linaeleweka kwa urahisi na halileti dhana ya kifalme ambayo “mwana-mfalme” ingeweza kuleta.
- source_word: לִ/בְנֵי אָשֵׁר
  choice: wa wana wa Asheri
  rationale: Hifadhi usemi wa ukoo wa Kiebrania “wana wa Asheri” pamoja na uhusiano wa kiongozi na kundi hilo.
- source_word: פַּגְעִיאֵל
  choice: Pagieli
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili huku likibaki karibu na umbo la Kiebrania.
- source_word: בֶּן עָכְרָן
  choice: mwana wa Okrani
  rationale: “Mwana wa” ni tafsiri ya kawaida ya patronimiki בֶּן; Okrani limetoholewa kwa mfumo wa sauti wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa moja kwa moja. Hakuna tanbihi iliyoongezwa kwa sababu kifungu chenyewe tayari kinaweka wazi kuwa Pagieli ni kiongozi wa wana wa Asheri; tanbihi ya Kiingereza iliyonukuliwa inaonekana kutolingana na alama yake na ingerudia maandishi.
