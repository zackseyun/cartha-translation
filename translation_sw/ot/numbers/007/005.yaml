  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
translation:
  language: sw
  text: “Vichukue kutoka kwao, ili vitumike katika huduma ya Hema la Kukutania; na uwape Walawi, kila mmoja kulingana na huduma yake.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח מֵאִתָּם
  choice: Vipokee kutoka kwao
  rationale: Kitenzi לקח hapa ni agizo kwa Musa avipokee vitu vilivyotolewa na viongozi. ‘Vipokee’ ni ya asili katika muktadha wa matoleo na kiambishi ‘vi-’ kinarejelea magari na ng’ombe waliotajwa kabla.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת
  choice: ili vitumike katika huduma
  rationale: Muundo wa Kiebrania unaonyesha kusudi la vitu visivyo na uhai. Tafsiri hii inatoa maana hiyo kwa Kiswahili cha kawaida bila kuvifanya vitu vyenyewe kuwa watendaji wa huduma.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni jina linaloeleweka na lililozoeleka katika Kiswahili kwa mahali patakatifu pa kukutana jangwani.
- source_word: וְנָתַתָּה אוֹתָם אֶל הַלְוִיִּם
  choice: kisha uwape Walawi
  rationale: נתן maana yake ya msingi ni ‘kutoa/kumpa.’ ‘Uwape Walawi’ huhifadhi usemi huo, huku ‘kisha’ ikiendeleza mlolongo wa maagizo kwa njia ya asili.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: kila mmoja kulingana na huduma yake
  rationale: אִישׁ imetumiwa kwa maana ya kugawa mmoja mmoja, na כְּפִי עֲבֹדָתוֹ inaonyesha ugawaji unaolingana na jukumu la huduma la kila Mlawi.
