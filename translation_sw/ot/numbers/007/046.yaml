translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio “mbuzi dume mmoja” ni wa asili katika Kiswahili na unahifadhi hesabu iliyo wazi katika maandishi ya Kiebrania.
