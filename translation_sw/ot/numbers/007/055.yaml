  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/055.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: sw
  text: Sadaka yake ilikuwa sahani moja ya fedha[a], yenye uzito wa shekeli mia moja na thelathini, na bakuli moja la fedha[b], lenye uzito wa shekeli sabini, kwa kipimo cha shekeli ya mahali patakatifu[c]; vyombo hivyo vyote viwili vilikuwa vimejaa unga laini uliochanganywa na mafuta kwa ajili ya sadaka ya nafaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sinia”; neno la Kiebrania linamaanisha chombo kipana cha fedha kisicho na kina kirefu.
    reason: lexical_alternative
  - marker: b
    text: Au “beseni”; neno la Kiebrania linamaanisha chombo kilichotumiwa katika huduma ya mahali patakatifu.
    reason: lexical_alternative
  - marker: c
    text: Yaani, kwa kufuata kiwango cha uzani kilichotumiwa katika mahali patakatifu.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Sadaka yake ilikuwa
  rationale: קָרְבָּן ni kitu kinacholetwa kama sadaka katika ibada. Muundo wa Kiebrania hauna kitenzi; 'ilikuwa' linaongezwa ili sentensi iwe ya kawaida katika Kiswahili.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: sahani moja ya fedha
  rationale: קְעָרָה hapa ni chombo kipana na kisicho na kina kirefu; 'sahani' ni neno la kawaida na lenye kueleweka, huku tanbihi ikihifadhi uwezekano wa 'sinia'.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yenye uzito wa shekeli mia moja na thelathini
  rationale: Hutoa kwa uwazi uzito wa chombo na kuweka idadi katika mpangilio wa kawaida wa Kiswahili.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: bakuli moja la fedha
  rationale: מִזְרָק ni chombo cha ibada; 'bakuli' ni tafsiri ya asili katika Kiswahili na haidai umbo maalumu kupita ushahidi wa neno.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: lenye uzito wa shekeli sabini
  rationale: Kirai kinaonyesha uzito wa bakuli; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai kinataja kiwango rasmi cha uzani kilichotumiwa katika mahali patakatifu, si shekeli nyingine iliyotolewa kama sadaka.
- source_word: שְׁנֵיהֶם
  choice: vyombo hivyo vyote viwili
  rationale: Kiwakilishi kinarejelea sahani na bakuli; kutaja 'vyombo' kunaleta uwazi wa kawaida katika Kiswahili.
- source_word: מְלֵאִים
  choice: vilikuwa vimejaa
  rationale: Kivumishi cha Kiebrania kinahitaji kiunganishi cha kitenzi katika Kiswahili; hali timilifu inaonyesha vyombo vilivyokuwa vimejazwa.
- source_word: סֹלֶת
  choice: unga laini
  rationale: סֹלֶת ni unga uliosagwa vizuri uliotumiwa katika sadaka; 'unga laini' ni wazi na wa kawaida.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Huhifadhi hali ya kutendwa ya participio na kueleza kwa kawaida kwamba unga ulikuwa umechanganywa na mafuta.
- source_word: לְמִנְחָה
  choice: kwa ajili ya sadaka ya nafaka
  rationale: Katika muktadha wa kikuhani, מִנְחָה ni sadaka inayotokana na nafaka; tafsiri mahususi huhifadhi istilahi ya ibada.
