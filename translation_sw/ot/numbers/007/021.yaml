lexical_decisions:
- source_word: פַּר
  choice: fahali
  rationale: Neno hili humaanisha fahali au fahali mchanga; “fahali” ni neno la kawaida na sahihi katika orodha hii ya wanyama wa dhabihu.
- source_word: אֶחָד
  choice: mmoja
  rationale: Kurudia namba “mmoja” kunahifadhi muundo rasmi wa orodha ya matoleo.
- source_word: בֶּן בָּקָר
  choice: kutoka kundini
  rationale: Kirai hiki kwa maana halisi ni “mwana wa ng’ombe,” lakini ni nahau inayomaanisha mnyama wa jamii ya ng’ombe kutoka kundini; tafsiri hii ni ya asili katika Kiswahili bila kuwa ya neno kwa neno kupita kiasi.
- source_word: אַיִל
  choice: kondoo dume
  rationale: Hili ni neno la kawaida kwa kondoo dume aliyekomaa, hasa katika orodha za dhabihu.
- source_word: כֶּבֶשׂ
  choice: mwanakondoo dume
  rationale: Neno hili humaanisha mwanakondoo; kutaja “dume” kunaonyesha jinsia ya kiume inayodhihirishwa na umbo la Kiebrania na muktadha wa dhabihu.
- source_word: בֶּן שְׁנָתוֹ
  choice: wa mwaka mmoja
  rationale: Nahau hii hutaja umri wa mnyama. “Wa mwaka mmoja” ni Kiswahili cha kawaida na kinachoeleweka, huku tanbihi ikihifadhi uwezekano wa kuelewa kuwa yuko katika mwaka wake wa kwanza.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni sadaka iliyoteketezwa yote; kirai hiki ni wazi na kinaonyesha kazi ya wanyama waliotajwa katika orodha.
