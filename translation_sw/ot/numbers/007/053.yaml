  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/053.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old[b]. This was the offering of Elishama son of Ammihud.'
translation:
  language: sw
  text: 'na kwa dhabihu ya sadaka za amani[a]: ng’ombe wawili, kondoo dume watano, mbuzi dume watano, na wana-kondoo dume watano wa mwaka mmoja. Hii ilikuwa sadaka ya Elishama mwana wa Amihudi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za ushirika” au “sadaka za ustawi.” Neno la Kiebrania hurejelea aina ya dhabihu inayohusishwa na amani, ukamilifu, au ustawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: na kwa ajili ya dhabihu ya sadaka za amani
  rationale: Viambishi vinaendeleza orodha na kutambulisha dhabihu nyingine. “Sadaka za amani” ni istilahi fupi na inayotambulika kwa שְׁלָמִים, huku “dhabihu” ikiwakilisha זֶבַח.
- source_word: בָּקָר שְׁנַיִם
  choice: ng’ombe wawili
  rationale: בָּקָר ni jina la jumla la ng’ombe; Kiebrania hakibainishi hapa kuwa ni maksai.
- source_word: אֵילִם חֲמִשָּׁה
  choice: kondoo dume watano
  rationale: אֵילִם humaanisha kondoo dume, hasa katika orodha za dhabihu.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: mbuzi dume watano
  rationale: עַתֻּדִים hubainisha mbuzi wa kiume, hivyo jinsia imehifadhiwa.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: wana-kondoo watano wa mwaka mmoja
  rationale: בְּנֵי שָׁנָה ni usemi wa Kiebrania unaomaanisha wenye umri wa mwaka mmoja. Katika mstari huu כְּבָשִׂים haikulazimishi kubainisha jinsia, tofauti na אֵילִם.
- source_word: זֶה קָרְבַּן
  choice: Hii ndiyo ilikuwa sadaka ya
  rationale: Kishazi kisicho na kitenzi kinatambulisha sadaka ya kiongozi aliyetajwa; wakati uliopita unasomeka kwa kawaida katika simulizi hii ya orodha.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Elishama mwana wa Amihudi
  rationale: Majina yamenukuliwa kwa umbo linalofaa Kiswahili, na patronimia בֶּן imetafsiriwa “mwana wa.”
theological_decisions:
- issue: Maana ya הַשְּׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za ustawi
  rationale: Istilahi ya Kiebrania inaweza kuhusishwa na amani, ukamilifu, ustawi, na mlo wa ushirika. “Sadaka za amani” huhifadhi istilahi ya kidini iliyozoeleka bila kufungia maana katika kipengele kimoja cha tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha umehifadhiwa kwa uwazi, na hakuna maelezo ya kimadhehebu yaliyoingizwa.
