base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/087.yaml
  text: 'All the cattle for the burnt offering: twelve bulls[a], twelve rams, twelve one-year-old lambs, and their grain offering; and twelve male goats for a sin offering.'
translation:
  language: sw
  text: Jumla ya wanyama wa sadaka ya kuteketezwa ilikuwa mafahali kumi na wawili, kondoo dume kumi na wawili, wanakondoo wa mwaka mmoja kumi na wawili, pamoja na sadaka zao za nafaka; na mbuzi dume kumi na wawili kwa ajili ya sadaka ya dhambi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kusisitiza utakaso kutokana na unajisi pamoja na dhambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבָּקָר
  choice: Ng’ombe wote
  rationale: Huwakilisha jumla ya wanyama wa jamii ya ng’ombe katika orodha hii, huku פָּרִים ikibainisha kwamba waliotolewa walikuwa mafahali.
- source_word: לָעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: Kiambishi לְ kinaonyesha kusudi, na istilahi hii ya kawaida ya dhabihu inaeleza sadaka iliyoteketezwa madhabahuni.
- source_word: פָּרִים
  choice: mafahali
  rationale: Ni neno la kawaida la Kiswahili kwa ng’ombe dume wanaotajwa katika muktadha wa dhabihu.
- source_word: אֵילִם
  choice: kondoo dume
  rationale: Hutoa maana ya kiume ya neno la Kiebrania kwa lugha iliyo wazi na ya sasa.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: wanakondoo wa mwaka mmoja
  rationale: Inahifadhi kwa uwazi aina na umri uliotakiwa wa wanyama hao.
- source_word: וּמִנְחָתָם
  choice: pamoja na sadaka zao za nafaka
  rationale: מִנְחָה katika sheria za dhabihu kwa kawaida ni sadaka ya nafaka; kiambishi cha umilikaji kinarejelea wanyama wa sadaka ya kuteketezwa waliotangulia.
- source_word: וּשְׂעִירֵי עִזִּים
  choice: na mbuzi dume
  rationale: Huhifadhi jinsia ya wanyama hao kwa Kiswahili cha kawaida kisicho cha kizamani.
- source_word: לְחַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Hii ndiyo istilahi inayotambulika zaidi katika muktadha wa dhabihu, huku maana mbadala ya utakaso ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya חַטָּאת katika sheria za dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno hilo linaweza kuhusishwa na dhambi na pia kuondoa unajisi. Tafsiri iliyozoeleka imewekwa katika maandishi, bila kuficha maana ya utakaso, ambayo imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha umehifadhiwa, na kitenzi “walikuwa” kimeongezwa kwa ulaini wa Kiswahili bila kubadili maana.
