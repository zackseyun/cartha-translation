  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/051.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: sw
  text: ng’ombe dume mmoja wa kundi la ng’ombe, kondoo dume mmoja, mwana-kondoo dume mmoja wa mwaka mmoja, kwa ajili ya sadaka ya kuteketezwa;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: ng’ombe dume mmoja kutoka kundini
  rationale: פַּר ni ng’ombe dume, na בֶּן־בָּקָר ni msemo unaomtambulisha kuwa mnyama wa jamii ya ng’ombe kutoka kundini. Tafsiri hii inahifadhi vipengele vyote bila kurudia kwa namna isiyo ya kawaida.
- source_word: אַיִל
  choice: kondoo dume mmoja
  rationale: Ni neno la kawaida kwa kondoo dume aliyekomaa, hasa katika orodha za dhabihu.
- source_word: כֶּבֶשׂ
  choice: mwana-kondoo dume mmoja
  rationale: Neno hili humaanisha mwana-kondoo na katika muktadha huu wa dhabihu humtaja mnyama dume; jinsia imewekwa wazi ili kuakisi nomino ya Kiebrania kwa usahihi.
- source_word: בֶּן־שְׁנָתוֹ
  choice: wa mwaka mmoja
  rationale: Msemo huu unaonyesha umri wa mnyama; ‘wa mwaka mmoja’ ni Kiswahili cha kawaida na wazi.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni dhabihu inayoteketezwa yote. ‘Sadaka ya kuteketezwa’ ni istilahi ya kawaida na inayoeleweka katika Kiswahili cha Biblia.
- source_word: אֶחָד
  choice: mmoja
  rationale: Namba hii imetafsiriwa kila inaporudiwa ili kuhifadhi idadi mahsusi ya kila mnyama katika orodha.
