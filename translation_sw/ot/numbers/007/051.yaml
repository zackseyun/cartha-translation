  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kawaida wa orodha za ibada. Muundo wa orodha na marudio ya ‘mmoja’ yamehifadhiwa; hakuna tanbihi zinazohitajika.
