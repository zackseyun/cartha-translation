  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כֹ֞ל בְּקַ֣ר זֶ֣בַח הַ/שְּׁלָמִ֗ים עֶשְׂרִ֣ים וְ/אַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/088.yaml
  text: And all the cattle for the sacrifice of peace offerings were twenty-four bulls[a], sixty rams, sixty male goats, and sixty one-year-old lambs. This was the dedication of the altar after it had been anointed.
translation:
  language: sw
  text: Na jumla ya ng’ombe kwa ajili ya sadaka za amani[a] ilikuwa mafahali ishirini na wanne, kondoo dume sitini, mbuzi dume sitini, na wanakondoo wa mwaka mmoja sitini. Huu ulikuwa wakfu wa madhabahu baada ya kutiwa mafuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhabihu za ushirika”; au, “dhabihu za ustawi.”
    reason: Njia mbadala hizi zinaonyesha upana wa maana ya שְׁלָמִים, inayoweza kusisitiza amani, ushirika, au hali njema.
lexical_decisions:
- source_word: וְכֹל בְּקַר
  choice: Na ng’ombe wote
  rationale: Inahifadhi kiunganishi וְ, maana ya ujumla ya כֹל, na jina la mkusanyo בְּקַר kwa Kiswahili cha kawaida.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: dhabihu za amani
  rationale: Ni istilahi inayotambulika kwa aina hii ya dhabihu; wingi wa Kiswahili unaonyesha kundi la sadaka zinazojumlishwa katika mstari huu.
- source_word: פָּרִים
  choice: mafahali
  rationale: Neno hili hutaja ng’ombe dume katika muktadha wa dhabihu bila kulazimisha maana ya kwamba ni wadogo.
- source_word: אֵילִם
  choice: kondoo dume
  rationale: Hutoa wazi jinsia ya wanyama na ni Kiswahili cha sasa kinachoeleweka.
- source_word: עַתֻּדִים
  choice: mbuzi dume
  rationale: Huhifadhi maana mahsusi ya mbuzi wa kiume kwa lugha ya kawaida.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: wanakondoo wa mwaka mmoja
  rationale: Huhifadhi aina ya mnyama na sharti la umri lililo katika Kiebrania.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: sadaka ya kuwekwa wakfu kwa madhabahu
  rationale: Katika muktadha wa jumla ya wanyama waliotolewa, ‘sadaka’ hufanya rejeo la nomino חֲנֻכָּה lieleweke, huku ‘kuwekwa wakfu kwa madhabahu’ ikihifadhi maana ya uzinduzi au wakfu.
- source_word: אַחֲרֵי הִמָּשַׁח אֹתוֹ
  choice: baada ya kutiwa mafuta
  rationale: Muundo huu wa kutendwa hauongezi mtendaji ambaye Kiebrania hakumtaji, na kiwakilishi kinarejelea madhabahu kwa kawaida.
theological_decisions:
- issue: Tafsiri ya aina ya dhabihu שְׁלָמִים
  choice: dhabihu za amani
  alternative: dhabihu za ushirika; dhabihu za ustawi
  rationale: ‘Amani’ hudumisha istilahi ya jadi na uhusiano wake wa kileksia, lakini maana za ushirika na ustawi pia zinawezekana; kwa hiyo zimehifadhiwa katika tanbihi bila kufunga mvutano wa maana.
- issue: Maana ya חֲנֻכָּה katika muhtasari wa dhabihu
  choice: sadaka ya kuwekwa wakfu kwa madhabahu
  alternative: kuwekwa wakfu kwa madhabahu
  rationale: Muktadha wa hesabu za wanyama unaelekeza kwenye sadaka iliyohusiana na wakfu, ingawa nomino yenyewe inaweza kutaja tukio la kuweka wakfu. Chaguo la matini linaweka rejeo la muktadha wazi bila kuongeza fundisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Majina ya wanyama yameelezwa wazi bila msamiati wa kizamani, na nambari zimeandikwa kwa maneno ili sentensi isomeke kwa mtiririko.
