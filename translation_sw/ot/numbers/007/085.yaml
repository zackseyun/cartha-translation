translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ya Kiebrania isiyo na kitenzi imewasilishwa kwa ‘lilikuwa na uzito wa’ ili iwe ya kawaida katika Kiswahili, bila kubadili maana ya orodha.
