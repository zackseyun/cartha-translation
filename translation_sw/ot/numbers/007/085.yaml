  text: each silver plate weighing one hundred thirty shekels, and each basin seventy; all the silver of the vessels was two thousand four hundred shekels, by the shekel of the sanctuary.
translation:
  language: sw
  text: Kila sinia la fedha lilikuwa na uzito wa shekeli 130, na kila bakuli lilikuwa na uzito wa shekeli 70. Fedha yote ya vyombo hivyo ilikuwa na uzito wa shekeli 2,400, kwa kipimo cha shekeli ya mahali patakatifu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na shekeli ya mahali patakatifu.”
    reason: Njia nyingine ya kutafsiri בְּ kama kiwango kinachotumiwa kupimia uzani.
lexical_decisions:
- source_word: שְׁלֹשִׁים וּמֵאָה
  choice: shekeli 130
  rationale: Namba ya Kiebrania, kihalisi ‘thelathini na mia,’ imetolewa kwa mpangilio wa kawaida wa namba katika Kiswahili.
- source_word: הַקְּעָרָה הָאַחַת כֶּסֶף
  choice: kila sinia la fedha
  rationale: Katika orodha hii, umoja wenye kibainishi na namba una maana ya ugawaji, yaani uzito wa kila sinia; כֶּסֶף hapa ni madini ya fedha, si pesa.
- source_word: הַמִּזְרָק הָאֶחָד
  choice: kila bakuli
  rationale: מִזְרָק ni chombo kama bakuli au beseni kilichotumiwa katika ibada; ‘bakuli’ ni neno la kawaida na linaloeleweka, huku ‘kila’ likionyesha maana ya ugawaji ya muundo wa Kiebrania.
- source_word: כֹּל כֶּסֶף הַכֵּלִים
  choice: fedha yote ya vyombo hivyo
  rationale: כֹּל inaonyesha jumla, na כֵּלִים inarejelea vyombo vilivyotajwa katika muktadha.
- source_word: אַלְפַּיִם וְאַרְבַּע מֵאוֹת
  choice: shekeli 2,400
  rationale: Jumla imetolewa kwa mpangilio wa kawaida wa namba katika Kiswahili; kipimo cha shekeli kinaeleweka kutokana na kishazi kinachofuata.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kihusishi בְּ hapa kinaonyesha kiwango rasmi cha uzani kilichotumiwa; ‘mahali patakatifu’ linawasilisha הַקֹּדֶשׁ kwa lugha ya kawaida na yenye heshima.
