base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/039.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: sw
  text: fahali mmoja kutoka kundini, kondoo dume mmoja, mwanakondoo dume mmoja mwenye umri wa mwaka mmoja, kwa ajili ya sadaka ya kuteketezwa;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן בָּקָר
  choice: fahali mmoja kutoka kundini
  rationale: פַּר ni fahali, na בֶּן בָּקָר ni nahau ya Kiebrania inayomtambulisha kuwa wa jamii ya ng'ombe. Tafsiri hii ni ya asili katika Kiswahili bila kufuata maneno ya nahau hiyo kihalisi.
- source_word: אֶחָד
  choice: mmoja
  rationale: Kurudia kwa namba kunahifadhi hesabu tofauti ya kila mnyama katika orodha.
- source_word: אַיִל
  choice: kondoo dume
  rationale: Neno hili humaanisha kondoo dume aliyekomaa, hasa katika muktadha wa dhabihu.
- source_word: כֶּבֶשׂ
  choice: mwanakondoo dume
  rationale: Katika orodha za dhabihu, neno hili hutaja mwanakondoo na kwa kawaida hueleweka kuwa dume; kutaja jinsia kunabainisha tofauti yake na kondoo dume aliyekomaa.
- source_word: בֶּן שְׁנָתוֹ
  choice: mwenye umri wa mwaka mmoja
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi ya nahau ya Kiebrania kuhusu umri wa mnyama.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni sadaka inayoteketezwa kabisa; kirai hiki pia huakisi kiambishi לְ kinachoonyesha kusudi.
