- source_word: שְׂעִיר עִזִּים
  choice: mbuzi dume
  rationale: Kirai hiki katika muktadha wa dhabihu humaanisha mbuzi wa kiume. “Mbuzi dume” ni Kiswahili cha kawaida, wazi, na huhifadhi jinsia ya mnyama bila kuiga wingi wa Kiebrania usio wa kawaida katika Kiswahili.
- source_word: אֶחָד
  choice: mmoja
  rationale: Neno hili ni idadi iliyo wazi katika orodha ya vitu vya kutolewa. “Mmoja” huhifadhi mtindo wa kuhesabu, badala ya kuliacha kama kiashiria kisicho dhahiri.
- source_word: לְחַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Katika muktadha huu חַטָּאת humaanisha sadaka maalumu inayohusiana na dhambi, si dhambi kwa maana ya jumla. “Kwa ajili ya sadaka ya dhambi” huonyesha kazi ya mnyama katika orodha ya matoleo.
