  yaml_path: translation/ot/numbers/007/024.yaml
  text: On the third day[a], the leader of the sons of Zebulun was Eliab son of Helon.
translation:
  language: sw
  text: Siku ya tatu, kiongozi wa wana wa Zabuloni[a] alikuwa Eliabu mwana wa Heloni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiongozi kwa ajili ya wana wa Zabuloni.” Kihusishi cha Kiebrania kinaweza kuonyesha uhusiano nao au kuwawakilisha kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Siku ya tatu
  rationale: Hii ni kauli ya kawaida ya wakati katika simulizi; Kiswahili hakihitaji kihusishi kabla ya “siku” hapa.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Katika Hesabu, neno hili humaanisha mkuu anayetambuliwa wa kabila. “Kiongozi” ni la sasa na lenye heshima bila kudokeza ufalme kama “mwana-mfalme.”
- source_word: לִבְנֵי זְבוּלֻן
  choice: wa wana wa Zabuloni
  rationale: Muundo huu unahifadhi maana ya ukoo na uhusiano wa kiongozi na wazao wa Zabuloni, huku kihusishi cha Kiebrania kikibaki na uwezekano wa kuonyesha uwakilishi.
- source_word: אֱלִיאָב
  choice: Eliabu
  rationale: Umbo la kawaida la Kiswahili la jina hili la Kiebrania.
- source_word: בֶּן
  choice: mwana wa
  rationale: Kauli ya kawaida ya nasaba katika orodha na simulizi za Kiebrania.
- source_word: חֵלֹן
  choice: Heloni
  rationale: Umbo la kawaida la Kiswahili la jina hili la Kiebrania.
