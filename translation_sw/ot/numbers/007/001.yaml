  text: וַ/יְהִ֡י בְּ/יוֹם֩ כַּלּ֨וֹת מֹשֶׁ֜ה לְ/הָקִ֣ים אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּמְשַׁ֨ח אֹת֜/וֹ וַ/יְקַדֵּ֤שׁ אֹת/וֹ֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת הַ/מִּזְבֵּ֖חַ וְ/אֶת כָּל כֵּלָ֑י/ו וַ/יִּמְשָׁחֵ֖/ם וַ/יְקַדֵּ֥שׁ אֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/001.yaml
  text: And it happened on the day Moses finished setting up the tabernacle[a], that he anointed it and consecrated it, along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them.
translation:
  language: sw
  text: Ikawa, siku Musa alipomaliza kuisimamisha maskani[a], aliipaka mafuta na kuiweka wakfu, pamoja na vyombo vyake vyote; pia madhabahu na vyombo vyake vyote; akavipaka mafuta na kuviweka wakfu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Musa alipokuwa amemaliza kuisimamisha maskani.” Usemi wa Kiebrania wa wakati unaweza kutafsiriwa kwa njia hii ya kawaida zaidi katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni utangulizi wa kisimulizi unaohifadhi kazi ya wayyiqtol ya היה kwa Kiswahili cha kibiblia kinachoeleweka bila kutumia lugha ndefu.
- source_word: בְּיוֹם כַּלּוֹת
  choice: siku ... alipomaliza
  rationale: Inahifadhi kwa kiasi kikubwa nahau ya Kiebrania ya wakati; maana ya kawaida ya 'Musa alipokuwa amemaliza' imeelezwa katika tanbihi.
- source_word: לְהָקִים
  choice: kuisimamisha
  rationale: Hiphil ya קום hapa inahusu kuinua au kusimamisha maskani; 'kuisimamisha' ni ya asili na sahihi katika muktadha.
- source_word: הַמִּשְׁכָּן
  choice: maskani
  rationale: Neno hili limezoeleka katika Kiswahili cha Biblia kwa patakatifu pa jangwani na pia linahifadhi wazo la mahali pa kukaa lililo katika משכן.
- source_word: וַיִּמְשַׁח
  choice: aliipaka mafuta
  rationale: Katika muktadha wa vitu, 'kupaka mafuta' huonyesha wazi tendo la ibada la משׁח kuliko 'kutia mafuta,' ambalo linaweza kueleweka kwa namna pana.
- source_word: וַיְקַדֵּשׁ
  choice: kuiweka wakfu
  rationale: Hueleza kutengwa kwa matumizi matakatifu ya ibada bila kudokeza mabadiliko ya kimaadili katika vitu.
- source_word: כָּל כֵּלָיו
  choice: vyombo vyake vyote
  rationale: כְּלִי ni neno pana kwa vifaa au vyombo. 'Vyombo' linafaa kwa maskani na kwa madhabahu huku likihifadhi urudiaji wa Kiebrania.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Ni istilahi sanifu na inayotambulika kwa מזבח.
- source_word: וַיִּמְשָׁחֵם ... וַיְקַדֵּשׁ אֹתָם
  choice: aliweka wakfu madhabahu na vyombo vyake vyote kwa kuvipaka mafuta
  rationale: Muundo huu wa Kiswahili unawakilisha kutiwa mafuta na kuwekwa wakfu kwa kundi la mwisho lililotajwa, huku ukiepuka msururu mzito wa viwakilishi. Hata hivyo, kiambishi cha wingi cha Kiebrania kinaweza kuwa muhtasari mpana wa vitu vyote vilivyotajwa.
theological_decisions:
- issue: Istilahi ya utakatifu wa ibada
  choice: kuweka wakfu
  alternative: kutakasa / kufanya vitakatifu
  rationale: Muktadha unahusu kutenga maskani na vifaa vyake kwa matumizi matakatifu, si kuvibadili kimaadili. 'Kuweka wakfu' huwasilisha maana hiyo kwa usahihi na kwa lugha ya kawaida.
- issue: Upeo wa viwakilishi vya wingi katika וַיִּמְשָׁחֵם ... וַיְקַדֵּשׁ אֹתָם
  choice: Kuvihusisha moja kwa moja na madhabahu na vyombo vyake katika sentensi ya Kiswahili
  alternative: Kuvichukulia kuwa muhtasari wa maskani, vyombo vyake, madhabahu, na vyombo vyake vyote
  rationale: Kundi la mwisho ndilo rejeo la karibu zaidi, lakini Kiebrania kinaweza kufanya majumuisho ya vitu vyote vilivyotangulia. Tafsiri haipaswi kujenga fundisho juu ya upeo huu usio wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Istilahi 'maskani,' 'madhabahu,' na 'kuweka wakfu' zinadumisha muktadha wa ibada bila lugha nzito kupita kiasi.
