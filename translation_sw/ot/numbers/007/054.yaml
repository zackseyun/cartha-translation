  yaml_path: translation/ot/numbers/007/054.yaml
  text: On the eighth day[a], the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: sw
  text: Siku ya nane, kiongozi wa wana wa Manase[a] alikuwa Gamalieli mwana wa Pedahsuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Manase,” jina la kikabila; yaani, wazao au kabila la Manase.'
