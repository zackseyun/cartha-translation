lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Siku ya nane
  rationale: Muundo wa kihusishi ב pamoja na יוֹם na namba ya mpangilio unaonyesha wakati. “Siku ya nane” ni Kiswahili cha kawaida na hakiongezi habari ya muktadha ambayo haimo wazi katika mstari huu.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Katika muktadha huu, neno hili humaanisha mkuu anayetambulika wa kundi la kikabila. “Kiongozi” ni neno la sasa na linaloeleweka, bila kudokeza ufalme kama ambavyo “mwana-mfalme” lingeweza kufanya.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: wa wana wa Manase
  rationale: Muundo huu unalitambulisha kundi ambalo kiongozi anahusishwa nalo. Tafsiri hii inadumisha nahau ya kifamilia na kikabila ya Kiebrania, huku tanbihi ikifafanua maana yake.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: גַּמְלִיאֵל
  choice: Gamalieli
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ni muundo wa kawaida wa kutaja mtu kwa jina la baba yake, na “mwana wa” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: פְּדָה צוּר
  choice: Pedasuri
  rationale: Jina hili la kibinafsi limetoholewa kama jina moja kwa kufuata matumizi ya kawaida ya Kiswahili, ingawa muundo wake wa Kiebrania una vipashio viwili.
