  yaml_path: translation/ot/numbers/007/011.yaml
  text: Then Yahweh said to Moses[a], “One leader each day, one leader each day, they shall present their offering for the dedication of the altar.”
translation:
  language: sw
  text: Ndipo Yahweh akamwambia Musa, “Kiongozi mmoja kwa siku, kiongozi mmoja kwa siku[a], watoe sadaka zao kwa ajili ya kuwekwa wakfu kwa madhabahu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiongozi mmoja wa kabila kwa siku.” Kiebrania kinarudia “kiongozi mmoja, siku moja” ili kusisitiza mfululizo uliopangwa wa sadaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu unaendeleza simulizi kwa Kiswahili cha kawaida huku ukihifadhi maana rahisi ya kusema kwa Musa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Katika muktadha huu neno linamaanisha wakuu wa makabila ya Israeli; “kiongozi” ni wazi na halileti maana ya kifalme isiyolazimu.
- source_word: אֶחָד לַיּוֹם
  choice: mmoja kila siku
  rationale: Hutoa maana ya mgao wa mtu mmoja kwa kila siku katika mfululizo uliopangwa.
- source_word: יַקְרִיבוּ
  choice: atoe
  rationale: Kitenzi hiki katika muktadha wa ibada humaanisha kuwasilisha au kutoa sadaka. Umoja wa Kiswahili unafuata kila kiongozi anayehusika siku yake, ingawa Kiebrania hutumia wingi kwa viongozi kwa jumla.
- source_word: קָרְבָּנָם
  choice: sadaka yake
  rationale: “Sadaka” ni neno la kawaida katika muktadha wa ibada. Kiwakilishi cha umoja kinaafikiana kwa Kiswahili na “kiongozi mmoja” wa kila siku, huku kikirejelea sadaka ya kila mmoja wao.
- source_word: לַחֲנֻכַּת
  choice: kwa ajili ya kuwekwa wakfu kwa
  rationale: Huonyesha kusudi la tukio la kuiweka madhabahu wakfu kwa matumizi yake ya ibada.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno sanifu la Kiswahili kwa mahali pa kutolea dhabihu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kauli יַקְרִיבוּ
  choice: atoe
  alternative: atatoa
  rationale: Katika usemi huu kwa Musa, umbo hilo linaeleweka kwa kawaida kama agizo kuhusu utaratibu wa utoaji, lakini linaweza pia kutafsiriwa kama taarifa ya jambo litakalofanyika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Marudio ya Kiebrania yamehifadhiwa ili kuonyesha msisitizo na utaratibu wa kila siku.
