id: NUM.7.37
reference: Numbers 7:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/037.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: sw
  text: Sadaka yake ilikuwa sahani moja ya fedha[a], yenye uzito wa shekeli mia moja na thelathini, na bakuli moja la fedha[b], lenye uzito wa shekeli sabini kwa kipimo cha shekeli ya mahali patakatifu[c]. Vyombo hivyo vyote viwili vilikuwa vimejaa unga laini uliochanganywa na mafuta kwa ajili ya sadaka ya nafaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bakuli pana” au “kombe pana”; neno la Kiebrania קַעֲרָה linaweza kumaanisha chombo kipana kama sahani au bakuli.
    reason: lexical_alternative
  - marker: b
    text: Au “bakuli la kunyunyizia”; neno la Kiebrania מִזְרָק hutumiwa pia kwa chombo cha ibada kilichohusishwa na kunyunyizia au kurusha damu.
    reason: lexical_alternative
  - marker: c
    text: “Kwa kipimo cha shekeli ya mahali patakatifu” maana yake ni kwa kufuata kiwango rasmi cha uzito kilichotumiwa katika mahali patakatifu.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Sadaka yake
  rationale: קָרְבָּן ni kitu kinacholetwa na kutolewa katika ibada; “sadaka” ni neno la kawaida, lenye heshima na linalofaa muktadha huu.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: sahani moja ya fedha
  rationale: קְעָרָה inaweza kuwa sahani, kombe pana au bakuli; “sahani” inadokeza chombo kipana na kifupi bila kukibainisha kupita ushahidi wa neno.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yenye uzito wa shekeli mia moja na thelathini
  rationale: Muundo wa Kiswahili unaeleza kwa kawaida kwamba hii ni uzito wa sahani huku ukihifadhi idadi kamili ya Kiebrania.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: bakuli moja la fedha
  rationale: מִזְרָק ni chombo kama bakuli kilichotumiwa katika huduma ya ibada; “bakuli” ni wazi na hakilazimishi matumizi maalumu yasiyotajwa hapa.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: lenye uzito wa shekeli sabini
  rationale: Kirai hiki kinaonyesha uzito wa bakuli; umbo la Kiswahili linaweka uhusiano huo wazi.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai kinaonyesha kiwango rasmi cha uzito cha mahali patakatifu, si aina nyingine ya fedha; “kwa kipimo” huwasilisha kazi hiyo kwa uwazi.
- source_word: שְׁנֵיהֶם
  choice: Vyombo hivyo vyote viwili
  rationale: Kiwakilishi cha uwili kinarejelea sahani na bakuli; kutaja “vyombo” kunafanya rejeo liwe wazi katika Kiswahili.
- source_word: מְלֵאִים
  choice: vilikuwa vimejaa
  rationale: Hii ni hali ya vyombo viwili; umbo la kitenzi ni la kawaida na sahihi katika Kiswahili.
- source_word: סֹלֶת
  choice: unga laini
  rationale: סֹלֶת ni unga uliosagwa vizuri unaotumiwa katika sadaka; “unga laini” ni tafsiri ya kawaida na inayoeleweka.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Hueleza unga uliounganishwa na mafuta; “uliochanganywa” ni lugha ya sasa na ya asili.
- source_word: לְמִנְחָה
  choice: kwa ajili ya sadaka ya nafaka
  rationale: Katika muktadha wa kikuhani, מִנְחָה ni sadaka inayotokana na nafaka; tafsiri hii huitofautisha na sadaka kwa maana pana.
