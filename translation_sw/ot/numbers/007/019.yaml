  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הִקְרִ֨ב אֶת קָרְבָּנ֜/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/019.yaml
  text: 'He presented his offering: one silver plate[a], its weight one hundred thirty shekels; one silver basin, seventy shekels, by the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.'
translation:
  language: sw
  text: 'Aliwasilisha sadaka yake: sahani moja ya fedha[a], yenye uzito wa shekeli mia moja na thelathini; bakuli moja la fedha[b], lenye uzito wa shekeli sabini kwa kipimo cha shekeli ya mahali patakatifu[c]; vyombo hivyo viwili vilikuwa vimejaa unga laini uliochanganywa na mafuta kwa ajili ya sadaka ya nafaka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sinia ya fedha.”
    reason: lexical_alternative
  - marker: b
    text: Au “beseni la fedha.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, kwa kiwango rasmi cha uzani kilichotumiwa mahali patakatifu.
    reason: cultural_note
lexical_decisions:
- source_word: הִקְרִב
  choice: aliwasilisha
  rationale: Hifili ya קרב katika muktadha wa sadaka humaanisha kuleta karibu au kuwasilisha; “aliwasilisha” linafaa kwa mtindo rasmi wa orodha hii bila kurudia neno sadaka kama kitenzi.
- source_word: קָרְבָּנוֹ
  choice: sadaka yake
  rationale: Ni istilahi ya kawaida kwa kitu kinacholetwa mbele za Mungu; “sadaka” ni neno la Kiswahili linaloeleweka na linalofaa katika muktadha wa ibada.
- source_word: קַעֲרַת כֶּסֶף
  choice: sahani moja ya fedha
  rationale: קַעֲרָה ni chombo kipana kinachoweza kueleweka kama sahani au kombe; “sahani” linafaa kwa chombo hiki katika orodha ya vifaa vya mahali patakatifu, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yenye uzito wa shekeli mia moja na thelathini
  rationale: Kirai hiki kinaonyesha wazi uzito wa sahani; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: מִזְרָק
  choice: bakuli moja la fedha
  rationale: Neno hili hutaja chombo cha ibada, huenda bakuli au beseni; “bakuli” linatofautisha kwa urahisi chombo hiki na sahani iliyotangulia bila kudai umbo kwa usahihi kupita ushahidi.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai hiki kinaonyesha kiwango rasmi cha uzani kilichotumika katika huduma ya patakatifu; kuongeza “kipimo” kunafanya maana hiyo iwe wazi kwa msomaji wa sasa.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: vyombo hivyo viwili vilikuwa vimejaa
  rationale: Rejeo la vitu viwili ni kwa sahani na bakuli; kutaja “vyombo” huleta uwazi wa asili katika Kiswahili.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Ni unga uliosafishwa na bora uliotumiwa katika sadaka; “unga laini” ni tafsiri sahihi na inayoeleweka kwa kawaida.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Hueleza namna unga ulivyotayarishwa; muundo huu ni wa kawaida katika Kiswahili cha sasa.
- source_word: לְמִנְחָה
  choice: kwa ajili ya sadaka ya nafaka
  rationale: Katika sheria za kikuhani, מִנְחָה ni sadaka maalumu ya mazao ya nafaka, si zawadi ya jumla; tafsiri hii huhifadhi umahususi huo.
