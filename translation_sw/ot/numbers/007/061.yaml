  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: sw
  text: Sadaka yake ilikuwa sinia moja ya fedha[a], yenye uzito wa shekeli mia moja na thelathini, na bakuli moja la fedha[b], lenye uzito wa shekeli sabini, kwa kipimo cha shekeli ya mahali patakatifu[c]; vyombo hivyo viwili vilikuwa vimejaa unga laini uliochanganywa na mafuta kwa ajili ya sadaka ya nafaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sahani kubwa” kwa neno קַעֲרָה.
    reason: lexical_alternative
  - marker: b
    text: Au “beseni” kwa neno מִזְרָק, yaani chombo kilichotumiwa katika huduma ya mahali patakatifu.
    reason: lexical_alternative
  - marker: c
    text: “Kwa kipimo cha shekeli ya mahali patakatifu” maana yake ni kwa kufuata kiwango rasmi cha uzito cha mahali patakatifu.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Sadaka yake ilikuwa
  rationale: קָרְבָּן ni kitu kinacholetwa kama sadaka katika ibada. “Sadaka yake” ni ya kawaida na wazi, huku “ilikuwa” ikikamilisha kwa Kiswahili orodha inayofuata.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: sinia moja ya fedha
  rationale: קַעֲרָה ni chombo kipana na kisicho na kina kirefu. “Sinia” hutofautisha chombo hiki na bakuli linalotajwa baadaye na kinafaa kwa orodha ya vyombo vya ibada.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yenye uzito wa shekeli mia moja na thelathini
  rationale: Huhifadhi taarifa dhahiri ya Kiebrania kuhusu uzito kwa Kiswahili cha kawaida.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: bakuli moja la fedha
  rationale: מִזְרָק ni chombo kilichotumiwa katika huduma ya mahali patakatifu. “Bakuli” ni neno linaloeleweka kwa urahisi; dokezo linaonyesha uwezekano wa “beseni.”
- source_word: שִׁבְעִים שֶׁקֶל
  choice: lenye uzito wa shekeli sabini
  rationale: Kitenzi kilichodokezwa katika Kiebrania kinawekwa wazi ili msomaji atambue kuwa idadi hii inaonyesha uzito wa bakuli.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai hiki kinataja kiwango rasmi cha uzito kilichotumiwa katika mahali patakatifu, si aina tofauti ya fedha.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: vyombo hivyo viwili vilikuwa vimejaa
  rationale: Kiwakilishi kinarejelea sinia na bakuli. Kutaja “vyombo” hufanya rejeo hilo liwe wazi na la asili katika Kiswahili.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Ni unga uliosafishwa uliotumiwa kwa sadaka; “unga laini” ni tafsiri iliyo wazi na ya kawaida.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Kauli ya Kiebrania inaonyesha unga uliokuwa umechanganywa na mafuta.
- source_word: לְמִנְחָה
  choice: kwa ajili ya sadaka ya nafaka
  rationale: Katika muktadha wa kikuhani, מִנְחָה ni sadaka ya nafaka, si sadaka kwa maana ya jumla.
