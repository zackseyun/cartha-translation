base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/017.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Nahshon son of Amminadab.'
translation:
  language: sw
  text: 'na kwa ajili ya dhabihu za amani[a]: ng’ombe wawili, kondoo dume watano, mbuzi dume watano, na wana-kondoo watano wenye umri wa mwaka mmoja. Hii ndiyo sadaka ya Nashoni mwana wa Aminadabu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za ustawi”; neno la Kiebrania mara nyingi hutumiwa kuhusu dhabihu iliyohusisha mlo wa dhabihu ulioshirikiwa katika ushirika na amani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: na kwa ajili ya dhabihu ya sadaka za amani
  rationale: Viambishi vinaendeleza orodha na kuonyesha kusudi; istilahi ya dhabihu imehifadhiwa, huku ‘sadaka za amani’ ikiwakilisha neno la kiibada שְׁלָמִים bila kuondoa maana zake nyingine zinazowezekana.
- source_word: בָּקָר שְׁנַיִם
  choice: ng’ombe wawili
  rationale: בָּקָר ni jina la jumla la ng’ombe na halibainishi jinsia hapa; Kiswahili ‘ng’ombe wawili’ huhifadhi kutobainishwa huko.
- source_word: אֵילִם חֲמִשָּׁה
  choice: kondoo dume watano
  rationale: אֵילִם humaanisha kondoo dume kwa wazi.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: mbuzi dume watano
  rationale: עַתּוּדִים hutaja mbuzi wa kiume.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: wana-kondoo watano wenye umri wa mwaka mmoja
  rationale: Kifungu kinataja wana-kondoo wa mwaka mmoja; jinsia haijaongezwa kwa kuwa maandishi haya hayaibainishi wazi katika kifungu hiki.
- source_word: זֶה קָרְבַּן
  choice: Hii ndiyo sadaka ya
  rationale: Sentensi ya Kiebrania haina kitenzi; muundo huu wa Kiswahili ni wa kawaida na huhifadhi msisitizo wa muhtasari.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Nashoni mwana wa Aminadabu
  rationale: Majina yametoholewa kwa namna inayoeleweka katika Kiswahili, na patronimi imewasilishwa moja kwa moja.
theological_decisions:
- issue: Maana ya istilahi ya dhabihu שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za ustawi
  rationale: ‘Sadaka za amani’ ni istilahi fupi ya kiibada, lakini tanbihi inahifadhi uwezekano wa maana ya ushirika au ustawi unaohusishwa na dhabihu hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Orodha imewekwa wazi, jinsia imebainishwa pale tu inapothibitishwa na Kiebrania, na alama ya tanbihi [a] imewekwa kwenye istilahi inayohusika.
