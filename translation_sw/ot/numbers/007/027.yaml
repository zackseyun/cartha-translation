  text: ng’ombe dume mmoja kutoka katika kundi la ng’ombe[a], kondoo dume mmoja, mwana-kondoo dume mmoja wa mwaka mmoja, kwa ajili ya sadaka ya kuteketezwa[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa halisi, “ng’ombe dume mmoja, mwana wa kundi la ng’ombe.” Nahau ya Kiebrania humaanisha ng’ombe dume kutoka katika kundi la ng’ombe, na mara nyingi hueleweka kuwa ng’ombe dume mchanga.
    reason: lexical_alternative
  - marker: b
    text: Kwa halisi, “mwana-kondoo dume mmoja, mwana wa mwaka wake,” yaani, mwana-kondoo dume wa mwaka mmoja au aliye katika mwaka wake wa kwanza.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: ng’ombe dume
  rationale: Neno hili humaanisha ng’ombe wa kiume; ‘ng’ombe dume’ ni usemi wa kawaida na sahihi katika Kiswahili cha sasa.
- source_word: אֶחָד
  choice: mmoja
  rationale: Kurudia ‘mmoja’ kunahifadhi muundo wa orodha ya wanyama mmoja mmoja katika Kiebrania.
- source_word: בֶּן בָּקָר
  choice: kutoka kundini
  rationale: Kirai hiki kwa halisi ni ‘mwana wa kundi la ng’ombe,’ nahau inayomtaja mnyama wa jamii ya ng’ombe kutoka kundini; tafsiri hii ni ya asili katika Kiswahili bila kulazimisha maana ya umri.
- source_word: אַיִל
  choice: kondoo dume
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kondoo wa kiume aliyetajwa katika muktadha wa dhabihu.
- source_word: כֶּבֶשׂ
  choice: mwana-kondoo dume
  rationale: Neno la Kiebrania linamtaja mwana-kondoo wa kiume; ‘dume’ huhifadhi ubainifu huo.
- source_word: בֶּן שְׁנָתוֹ
  choice: wa mwaka mmoja
  rationale: Nahau hii ya Kiebrania inaeleza umri wa mnyama kuwa mwaka mmoja au kuwa katika mwaka wake wa kwanza; tafsiri ya maandiko inatumia usemi wa kawaida ‘wa mwaka mmoja.’
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni sadaka inayoteketezwa; kirai hiki kinaonyesha kusudi la wanyama hao na kinafaa muundo wa orodha.
