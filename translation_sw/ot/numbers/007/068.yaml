  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: sw
  text: sahani moja ya dhahabu,[a] yenye uzito wa shekeli kumi, iliyojaa uvumba;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “sahani moja ya dhahabu, kumi, iliyojaa uvumba”; kipimo cha uzito “shekeli” kimedokezwa na mfumo wa sadaka unaorudiwa katika Hesabu 7.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: sahani
  rationale: Katika muktadha wa sadaka za hema takatifu, neno hili linamaanisha chombo kidogo cha ibada kilichotumiwa kubebea uvumba. “Sahani” ni neno la kawaida na linaloeleweka kuliko tafsiri halisi inayoweza kudokeza kijiko cha kulia.
- source_word: אַחַת
  choice: moja
  rationale: Ni namba ya msingi inayopatana na nomino ya kike כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: yenye uzito wa shekeli kumi
  rationale: Kiebrania kimedokeza kipimo bila kukitaja. Mfumo unaorudiwa katika Hesabu 7 unaonyesha kwamba kinachokusudiwa ni uzito wa shekeli kumi; maneno yaliyoongezwa yanaifanya maana iwe wazi kwa Kiswahili.
- source_word: זָהָב
  choice: ya dhahabu
  rationale: Inaonyesha kitu ambacho chombo kilitengenezwa nacho.
- source_word: מְלֵאָה
  choice: iliyojaa
  rationale: Ni kivumishi kinachoeleza hali ya chombo na yaliyomo ndani yake.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa manukato yaliyoteketezwa kama sadaka ya ibada.
