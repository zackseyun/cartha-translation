language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ אֶת קָרְבָּנָ֜/ם לִ/פְנֵ֣י יְהוָ֗ה שֵׁשׁ עֶגְלֹ֥ת צָב֙ וּ/שְׁנֵ֣י עָשָׂ֣ר בָּקָ֔ר עֲגָלָ֛ה עַל שְׁנֵ֥י הַ/נְּשִׂאִ֖ים וְ/שׁ֣וֹר לְ/אֶחָ֑ד וַ/יַּקְרִ֥יבוּ אוֹתָ֖/ם לִ/פְנֵ֥י הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/003.yaml
  text: 'And they brought their offering before Yahweh: six covered carts and twelve oxen[a], a cart for every two leaders and an ox for each one; and they presented them before the tabernacle.'
translation:
  language: sw
  text: 'Nao wakaleta sadaka yao mbele za Yahweh: mikokoteni sita iliyofunikwa[a] na ng’ombe kumi na wawili—mkokoteni mmoja kwa viongozi wawili, na ng’ombe mmoja kwa kila kiongozi—kisha wakavileta mbele ya Maskani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mikokoteni sita ya kusafirishia mizigo.” Maana kamili ya kirai cha Kiebrania עֶגְלֹת צָב si hakika; kwa mapokeo kimeeleweka kuwa mikokoteni yenye vifuniko.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנָם
  choice: sadaka yao
  rationale: Katika muktadha huu wa ibada, קָרְבָּן ni kitu kinacholetwa na kutolewa kwa Mungu; “sadaka” ni neno la kawaida na la heshima katika Kiswahili.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: לִפְנֵי ina maana ya kuwa mbele au katika uwepo wa mtu; “mbele za” ni usemi wa asili wa Kiswahili katika muktadha huu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: עֶגְלֹת צָב
  choice: mikokoteni iliyofunikwa
  rationale: עֲגָלוֹת ni mikokoteni ya kusafirishia mizigo, na צָב kwa mapokeo hueleweka kuwa yenye kifuniko; tafsiri hii inalinda maana inayowezekana bila kuongeza maelezo yasiyo katika maandishi.
- source_word: בָּקָר
  choice: ng’ombe
  rationale: בָּקָר inaweza kumaanisha ng’ombe kwa ujumla; Kiswahili “ng’ombe” kinafaa kwa wanyama hawa wa kuvuta mikokoteni bila kudai kwa lazima kwamba walikuwa maksai.
- source_word: עֲגָלָה עַל שְׁנֵי הַנְּשִׂאִים
  choice: mkokoteni mmoja kwa kila viongozi wawili
  rationale: 'Muundo huu ni wa mgawanyo: kila jozi ya viongozi ilitoa mkokoteni mmoja.'
- source_word: הַנְּשִׂאִים
  choice: viongozi
  rationale: נְשִׂיאִים hapa ni wakuu wa makabila; “viongozi” ni sahihi na ya kawaida bila kuingiza wazo la kifalme.
- source_word: וְשׁוֹר לְאֶחָד
  choice: na ng’ombe mmoja kwa kila kiongozi
  rationale: “Kila kiongozi” huweka wazi rejeo la אֶחָד na kuhifadhi mgawanyo wa ng’ombe mmoja kwa kila mmoja wao.
- source_word: וַיַּקְרִיבוּ אוֹתָם
  choice: kisha wakavileta
  rationale: הקריב hapa ni kuleta au kuwasilisha vitu mbele ya mahali patakatifu, si lazima kuvitoa kama dhabihu ya kuchinjwa. Kiambishi “-vi-” kinarejelea kwa pamoja vitu vilivyotolewa.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: מִשְׁכָּן ni mahali pa Mungu kukaa kati ya Israeli; “Maskani” ni istilahi fupi na inayotambulika, tofauti na Hema la Kukutania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo.
- issue: Maana ya kuwasilishwa kwa mikokoteni na ng’ombe
  choice: wakavileta mbele ya Maskani
  alternative: wakavitoa sadaka mbele ya Maskani
  rationale: Kitenzi הקריב kinaweza kuwa na maana ya kutoa au kuleta karibu, lakini hapa vitu vinavyohusika ni mikokoteni na ng’ombe wa huduma. “Wakavileta” huepuka kudokeza bila msingi kwamba vyote vilitolewa kama dhabihu za kuchinjwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha urudiaji na mgawanyo wa chanzo huku vistari vikisaidia usomaji. “Maskani” imeandikwa kwa herufi kubwa kama jina la mahali patakatifu maalumu.
