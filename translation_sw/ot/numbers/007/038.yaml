translation:
  language: sw
  text: bakuli moja la dhahabu[a], lenye uzito wa shekeli kumi[b], lililojaa uvumba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sahani,” “chombo,” au kwa tafsiri ya jadi, “kijiko.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kwa neno kwa neno: “bakuli moja la dhahabu, kumi za dhahabu, lililojaa uvumba.” Neno “shekeli” limeongezwa kwa sababu katika muktadha huu huo ni usemi wa mkato wa kipimo cha uzito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: bakuli
  rationale: Katika muktadha wa matoleo ya maskani, neno hili linamaanisha chombo kidogo cha kuweka uvumba, si kiganja. “Bakuli” ni neno la kawaida la Kiswahili linaloonyesha chombo hicho bila kudokeza kimakosa kijiko cha kulia.
- source_word: אַחַת
  choice: moja
  rationale: Ni namba inayopatana na nomino ya kike כַּף; imetafsiriwa moja kwa moja.
- source_word: זָהָב
  choice: la dhahabu
  rationale: Inaonyesha kitu ambacho chombo kilitengenezwa nacho; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: עֲשָׂרָה זָהָב
  choice: lenye uzito wa shekeli kumi
  rationale: Huu ni usemi wa mkato wa kipimo cha uzito. Mistari inayofanana katika sura hii inaonyesha kwamba shekeli ndicho kipimo kinachokusudiwa; kutaja uzito huondoa utata katika Kiswahili bila kubadili maana.
- source_word: מְלֵאָה
  choice: lililojaa
  rationale: Kivumishi hiki kinaeleza hali ya chombo na yaliyomo ndani yake; “lililojaa” ni tafsiri fupi na ya kawaida.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa dutu yenye harufu nzuri iliyotumiwa katika ibada.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa kwa mtiririko wa kawaida wa Kiswahili huku ukihifadhi mpangilio wa taarifa za Kiebrania. “Bakuli” limetumiwa badala ya “kijiko” ili lisilete picha ya chombo cha kulia; tanbihi imehifadhi uwezekano wa tafsiri nyingine. Alama zote za tanbihi zimewekwa katika matini kuu.
