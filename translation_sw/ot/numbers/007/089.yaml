  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה אֶל אֹ֣הֶל מוֹעֵד֮ לְ/דַבֵּ֣ר אִתּ/וֹ֒ וַ/יִּשְׁמַ֨ע אֶת הַ/קּ֜וֹל מִדַּבֵּ֣ר אֵלָ֗י/ו מֵ/עַ֤ל הַ/כַּפֹּ֨רֶת֙ אֲשֶׁר֙ עַל אֲרֹ֣ן הָ/עֵדֻ֔ת מִ/בֵּ֖ין שְׁנֵ֣י הַ/כְּרֻבִ֑ים וַ/יְדַבֵּ֖ר אֵלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/089.yaml
  text: When Moses went into the tent of meeting to speak with him[a], he heard the voice speaking to him from above the mercy seat that was on the ark of the testimony, from between the two cherubim[c][b]; and he spoke to him.
translation:
  language: sw
  text: Musa alipoingia katika hema la kukutania ili kuzungumza naye[a], alisikia sauti ikisema naye[c] kutoka juu ya kifuniko cha upatanisho[b] kilichokuwa juu ya sanduku la ushuhuda, kutoka katikati ya makerubi wawili; na sauti ikasema naye[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kuzungumza na Mungu; Kiebrania kinatumia kiwakilishi tu, bila kutaja jina lake hapa.
    reason: referent_clarification
  - marker: b
    text: “Kifuniko cha upatanisho” ni kifuniko cha sanduku. Tafsiri nyingine hukiita “kiti cha rehema.”
    reason: cultural_note
  - marker: c
    text: Au, kwa tofauti ndogo ya kisarufi, “sauti ikisemwa kwake.” “Sauti ikisema naye” ndiyo usomaji wa moja kwa moja zaidi wa kishiriki cha Kiebrania.
    reason: lexical_alternative
  - marker: d
    text: 'Kiebrania hakitaji kiima kwa wazi katika kishazi hiki. Kinaweza kueleweka kwamba sauti ilisema naye, kama ilivyotafsiriwa hapa; muktadha pia unaelekeza kwa Mungu kama msemaji: “na BWANA akasema naye.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְבֹא
  choice: Musa alipoingia
  rationale: Muundo wa ב pamoja na kitenzi-jina בוא unaanzisha kishazi cha wakati. “Alipoingia” ni Kiswahili cha kawaida kinachohifadhi maana ya wakati bila kuamua kwamba jambo hili lilitokea mara moja tu au kila mara.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni jina linaloeleweka kwa mahali patakatifu ambapo Mungu alikutana na watu wake; linahifadhi wazo la kukutana lililo katika מוֹעֵד.
- source_word: לְדַבֵּר אִתּוֹ
  choice: ili kusema naye
  rationale: דבר pamoja na אֵת inaweza kumaanisha kusema na au kuzungumza na mtu. “Kusema naye” ni ya asili na huacha kiwakilishi cha Kiebrania bila kutaja wazi mhusika wake.
- source_word: וַיִּשְׁמַע אֶת־הַקּוֹל
  choice: aliisikia sauti
  rationale: קוֹל inaweza kuwa sauti kwa ujumla au sauti ya anayesema; kishiriki kinachofuata kinaonyesha kwamba hapa ni sauti inayosema.
- source_word: מִדַּבֵּר
  choice: ikisema
  rationale: Kishiriki hiki kinaeleza הַקּוֹל, “sauti.” Tafsiri ya “ikisema” ndiyo usomaji wa moja kwa moja, huku tanbihi ikitaja uwezekano wa kuelewa muundo kwa maana inayokaribia hali ya kutendwa.
- source_word: אֵלָיו
  choice: naye
  rationale: Katika muktadha, Musa ndiye anayeelekezewa maneno. “Naye” ni Kiswahili cha kawaida kwa kusema na mtu, na hakipanui maandishi kupita kiasi.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: kutoka juu ya kifuniko cha upatanisho
  rationale: כַּפֹּרֶת ni kifuniko cha sanduku chenye kazi ya kiibada inayohusiana na upatanisho. “Kifuniko cha upatanisho” hutaja kitu hicho na kazi yake kwa uwazi zaidi kuliko kukiita kiti.
- source_word: אֲרֹן הָעֵדֻת
  choice: sanduku la ushuhuda
  rationale: עֵדוּת humaanisha ushuhuda wa agano, hasa vibao vilivyowekwa ndani ya sanduku. Tafsiri hii huhifadhi istilahi ya Kiebrania bila kuongeza “agano” mahali ambapo halipo wazi katika fungu hili.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: kutoka katikati ya wale makerubi wawili
  rationale: “Makerubi” ni istilahi ya kawaida ya Kiswahili kwa viumbe hawa maalumu; “wale ... wawili” hudhihirisha idadi na mahali pa sauti.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: kisha akasema naye
  rationale: Kitenzi kina kiima kilichodokezwa tu. Kiswahili hiki hakiongezi jina “BWANA” lisilokuwamo katika sentensi, na tanbihi inaeleza kwamba msemaji anaeleweka kwa kawaida kuwa Mungu, ingawa “sauti” inaweza kuchukuliwa kuwa kiima.
theological_decisions:
- issue: Mhusika wa viwakilishi katika “ili kusema naye” na “kisha akasema naye”
  choice: Maandishi yanaacha mhusika bila kutajwa kwa jina, kama Kiebrania, huku muktadha ukielekeza kwa Mungu akisema na Musa.
  alternative: Kifungu cha mwisho kinaweza kuwekwa wazi kuwa “kisha BWANA akasema naye,” au kueleweka kuwa “nayo sauti ikasema naye.”
  rationale: Mahali sauti inapotoka—juu ya kifuniko, katikati ya makerubi—huonyesha ufunuo wa Mungu. Hata hivyo, Kiebrania hakitaji jina la Mungu katika kishazi cha mwisho; kwa hiyo tafsiri haiingizi jina hilo kimya kimya wala kuondoa uwezekano wa “sauti” kuwa kiima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa. “Hema la kukutania,” “sanduku la ushuhuda,” na “makerubi” hudumisha msamiati wa patakatifu unaotambulika. Muundo wa mwisho umeachwa na kiima kilichodokezwa ili kuhifadhi utata halisi wa Kiebrania.
