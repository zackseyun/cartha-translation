lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: mbeberu
  rationale: Kirai hiki cha Kiebrania ni nahau inayomaanisha mbuzi dume. Katika Kiswahili sanifu cha Afrika Mashariki, “mbeberu” humtaja wazi mbuzi dume na linafaa katika orodha ya wanyama wa dhabihu.
- source_word: אֶחָד
  choice: mmoja
  rationale: Namba imetafsiriwa wazi ili kuhifadhi mtindo wa kuhesabu sadaka unaorudiwa katika Hesabu 7; upatanisho wa ngeli na “mbeberu” unahitaji “mmoja.”
- source_word: לְחַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Katika muktadha wa dhabihu, חַטָּאת humaanisha sadaka ya dhambi, si dhambi kwa maana ya jumla. “Kwa ajili ya” huakisi kiambishi לְ na kutoa Kiswahili cha kawaida.
