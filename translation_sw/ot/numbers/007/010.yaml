  text: Then the leaders presented the dedication offering for the altar on the day it was anointed[a], and the leaders presented their offering before the altar.
translation:
  language: sw
  text: Ndipo viongozi wakaleta sadaka za kuwekwa wakfu kwa madhabahu siku madhabahu ilipotiwa mafuta,[a] nao viongozi wakaleta sadaka yao mbele ya madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “kuwekwa wakfu kwa madhabahu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: wakaleta
  rationale: Hifili ya קרב katika muktadha wa ibada humaanisha kuleta karibu au kuwasilisha sadaka. “Wakaleta” ni Kiswahili cha kawaida na kinafaa kwa matumizi yote mawili katika mstari.
- source_word: הַנְּשִׂאִים
  choice: viongozi
  rationale: Katika Hesabu, נָשִׂיא humrejelea mkuu wa kabila. “Viongozi” ni neno la sasa, wazi, na lisiloleta maana ya kifalme isiyokusudiwa.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: matoleo kwa ajili ya kuwekwa wakfu kwa madhabahu
  rationale: Kimsingi kirai hiki ni “kuwekwa wakfu kwa madhabahu,” lakini tendo la viongozi kuleta linaonyesha vitu vilivyotolewa katika hafla hiyo. “Matoleo kwa ajili ya” huweka wazi maana ya kimuktadha bila kuficha tafsiri halisi, ambayo imeonyeshwa katika tanbihi.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: siku ilipotiwa mafuta
  rationale: Muundo huu unaonyesha wakati. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha kwamba madhabahu ndiyo iliyotiwa mafuta.
- source_word: קָרְבָּנָם
  choice: sadaka yao
  rationale: קָרְבָּן ni kitu kinacholetwa kama zawadi au sadaka katika ibada. “Sadaka” linafaa kwa muktadha wa madhabahu na ni istilahi inayoeleweka kwa urahisi.
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: mbele ya madhabahu
  rationale: Hii inadumisha maana ya mahali ya לִפְנֵי na ni usemi wa asili katika Kiswahili.
