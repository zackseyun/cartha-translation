  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “sahani moja ya dhahabu, kumi [za dhahabu], iliyojaa uvumba”; neno “shekeli” limeongezwa kutokana na fomula ya sadaka inayorudiwa katika muktadha huu.
