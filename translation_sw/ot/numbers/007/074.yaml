lexical_decisions:
- source_word: כַּף
  choice: sahani
  rationale: Katika orodha ya matoleo ya maskani, neno hili linamaanisha chombo kidogo cha kuwekea kitu, si kiganja. “Sahani” ni neno la kawaida na linaepuka picha ya kijiko cha kulia.
- source_word: אַחַת
  choice: moja
  rationale: Ni namba ya kawaida inayopatana na nomino ya kike כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: yenye uzito wa shekeli kumi
  rationale: Kiebrania kinataja “kumi” na “dhahabu” bila kutaja kipimo; katika fomula inayorudiwa katika muktadha huu, shekeli ndiyo kipimo kinachoeleweka. Kauli hii inafafanua uzito wa chombo bila kudokeza kwamba kilikuwa na shekeli ndani yake.
- source_word: זָהָב
  choice: ya dhahabu
  rationale: Nomino hii inaonyesha kwamba chombo kilitengenezwa kwa dhahabu.
- source_word: מְלֵאָה
  choice: ikiwa imejaa
  rationale: Hueleza hali ya chombo na yaliyomo ndani yake kwa Kiswahili cha kawaida.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa dutu yenye harufu nzuri iliyotolewa katika ibada ya mahali patakatifu.
