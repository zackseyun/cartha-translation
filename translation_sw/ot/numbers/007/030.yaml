  yaml_path: translation/ot/numbers/007/030.yaml
  text: On the fourth day[b][a], the leader of the sons of Reuben was Elizur son of Shedeur.
translation:
  language: sw
  text: Siku ya nne, kiongozi wa wana wa Reubeni[a] alikuwa Elisuri mwana wa Shedeuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiongozi kwa ajili ya wana wa Reubeni”; kihusishi cha Kiebrania hapa kinaweza kuonyesha uhusiano au uwakilishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: Siku ya nne
  rationale: Katika mfululizo huu wa masimulizi, בְּ pamoja na יוֹם ina maana ya wakati. Kiswahili cha kawaida hutumia “Siku ya nne” bila kihusishi cha ziada.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Neno hili humaanisha mkuu rasmi wa kabila au ukoo. “Kiongozi” ni la sasa na linaloeleweka, bila kuingiza maana ya kifalme inayoweza kudokezwa na “mwana-mfalme”.
- source_word: לִבְנֵי רְאוּבֵן
  choice: wa wana wa Reubeni
  rationale: Muundo huu unafuata kwa karibu usemi wa kifamilia na kikabila wa Kiebrania; kihusishi לְ kinaweza kuonyesha uhusiano au uwakilishi.
- source_word: אֱלִיצוּר
  choice: Elisuri
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ndio usemi wa kawaida wa Kiswahili katika utambulisho wa mtu kwa jina la baba yake.
- source_word: שְׁדֵיאוּר
  choice: Shedeuri
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
