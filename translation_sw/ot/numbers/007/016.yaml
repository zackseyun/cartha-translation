lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: beberu
  rationale: Kirai hiki cha Kiebrania kinamaanisha mbuzi dume. “Beberu” ni neno la kawaida na lenye heshima katika Kiswahili cha Afrika Mashariki, na linabainisha jinsia ya mnyama wa dhabihu.
- source_word: אֶחָד
  choice: mmoja
  rationale: Nambari imetajwa wazi ili kuhifadhi mtindo wa kuorodhesha na idadi rasmi ya vitu vya sadaka katika Hesabu 7.
- source_word: לְחַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Katika muktadha wa dhabihu, חַטָּאת humaanisha sadaka ya dhambi, si dhambi kwa maana ya jumla. “Kwa ajili ya” linawakilisha kiambishi לְ na linasikika kawaida katika orodha hii.
