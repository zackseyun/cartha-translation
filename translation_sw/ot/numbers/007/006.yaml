translation:
  language: sw
  text: Basi Musa akachukua mikokoteni[a] na ng’ombe[b], akawapa Walawi vitu hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “magari ya kubebea mizigo.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “ng’ombe”; mahali pengine katika sura hii muktadha unabainisha kuwa walikuwa ng’ombe waume.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Kitenzi לקח katika muundo huu kwa kawaida humaanisha ‘kuchukua.’ Hapa Musa anapokea vitu vilivyokuwa vimetolewa na kuvitwaa ili avigawanye.
- source_word: הָעֲגָלֹת
  choice: mikokoteni
  rationale: Neno עגלה hapa linamaanisha vyombo vya magurudumu vya kusafirishia mizigo. ‘Mikokoteni’ ni neno la kawaida na wazi katika Kiswahili cha Afrika Mashariki.
- source_word: הַבָּקָר
  choice: ng’ombe
  rationale: בקר ni nomino ya pamoja inayotaja ng’ombe kwa ujumla. ‘Ng’ombe’ huhifadhi upana huo, ingawa muktadha wa sura unawataja hasa ng’ombe waume wa kuvuta mikokoteni.
- source_word: וַיִּתֵּן
  choice: akawapa
  rationale: נתן humaanisha moja kwa moja ‘kutoa’ au ‘kumpa.’ Muundo ‘akawapa Walawi’ unaeleza kwa kawaida uhamisho wa vitu hivyo kwenda kwao bila kuongeza wazo la uteuzi wa kiutawala.
- source_word: אֹתָם
  choice: '[yamebainishwa kwa maana katika ‘akawapa’]'
  rationale: Kiwakilishi hiki kinarejelea kwa pamoja mikokoteni na ng’ombe. Kiswahili hakiwezi kutumia kiambishi kimoja cha yambwa kinachopatana na makundi yote mawili ya nomino; kwa hiyo yambwa linaachwa lieleweke kutokana na sentensi, huku ‘akawapa’ ikiwataja Walawi kama wapokeaji.
- source_word: אֶל־הַלְוִיִּם
  choice: Walawi
  rationale: אֶל huonyesha mwelekeo wa uhamisho kwenda kwa Walawi. Katika Kiswahili, kiambishi ‘-wa-’ ndani ya ‘akawapa’ tayari huonyesha kwamba Walawi ndio waliopokea, hivyo hakuna haja ya kuongeza kihusishi.
