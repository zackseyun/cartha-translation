  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sahani moja ya dhahabu” au “chombo kimoja kidogo cha dhahabu.” Tafsiri za jadi mara nyingi hutumia “kijiko,” lakini neno la Kiebrania lina maana pana zaidi ya chombo kidogo cha ibada.
