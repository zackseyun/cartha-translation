lexical_decisions:
- source_word: כַּף
  choice: bakuli
  rationale: Katika orodha ya vyombo vya ibada, neno hili linamaanisha chombo kidogo cha kuwekea kitu, si kiganja. “Bakuli” ni neno la kawaida na pana linalofaa kwa chombo hiki cha sherehe.
- source_word: אַחַת
  choice: moja
  rationale: Ni namba ya kawaida inayopatana na nomino ya kike כַּף.
- source_word: עֲשָׂרָה
  choice: yenye uzito wa shekeli kumi
  rationale: Ingawa “shekeli” haijatajwa wazi katika kishazi hiki, muktadha wa kanuni inayorudiwa katika Hesabu 7 unaonyesha kuwa namba hii ni kipimo cha uzito. Kuongeza “shekeli” huweka maana wazi katika Kiswahili bila kuongeza wazo jipya.
- source_word: זָהָב
  choice: ya dhahabu
  rationale: Inaonyesha nyenzo ambayo chombo hicho kilitengenezwa nayo.
- source_word: מְלֵאָה
  choice: iliyojaa
  rationale: Kivumishi hiki kinaeleza kuwa chombo kilikuwa kimejaa kitu kilichotajwa.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa manukato yanayoteketezwa katika ibada.
