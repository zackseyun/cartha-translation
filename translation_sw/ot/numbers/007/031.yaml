  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/031.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: sw
  text: Sadaka yake ilikuwa sahani moja ya fedha[a], yenye uzito wa shekeli mia moja na thelathini, na bakuli moja la fedha[b], lenye uzito wa shekeli sabini, kwa kipimo cha shekeli ya mahali patakatifu[c]. Vyombo hivyo viwili vilikuwa vimejaa unga laini uliochanganywa na mafuta kwa ajili ya sadaka ya nafaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sinia”; neno la Kiebrania linamaanisha chombo kilichotumiwa katika ibada.
    reason: lexical_alternative
  - marker: b
    text: Au, “beseni”; neno la Kiebrania linamaanisha chombo kilichohusishwa na matumizi ya sadaka.
    reason: lexical_alternative
  - marker: c
    text: Yaani, kwa kufuata kiwango rasmi cha uzani cha mahali patakatifu.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Sadaka yake ilikuwa
  rationale: Katika muktadha huu wa ibada, קָרְבָּן ni kitu kinacholetwa kama sadaka; muundo huu pia unaanzisha orodha ya vitu vilivyotolewa kwa Kiswahili cha kawaida.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: sahani moja ya fedha
  rationale: קְעָרָה ni chombo kipana kinachoweza kuitwa sahani au sinia; 'sahani' ni neno la kawaida na maelezo ya chini yanahifadhi uwezekano mwingine.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yenye uzito wa shekeli mia moja na thelathini
  rationale: Huwasilisha wazi kauli ya Kiebrania kuhusu uzito kwa mtiririko wa asili wa Kiswahili.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: bakuli moja la fedha
  rationale: מִזְרָק ni chombo cha ibada, huenda bakuli au beseni; 'bakuli' linaeleweka vizuri bila kudai umbo kamili lisilo hakika.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: lenye uzito wa shekeli sabini
  rationale: Kirai hiki kinaeleza uzito wa chombo cha pili; tamko la wazi huepusha utata.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Fomula hii inataja kiwango rasmi cha uzani kilichotumiwa katika mahali patakatifu, si shekeli nyingine ya kiini tofauti.
- source_word: שְׁנֵיהֶם
  choice: Vyombo hivyo viwili
  rationale: Kurejelea vyombo kwa jina ni Kiswahili cha asili na huhifadhi msisitizo wa Kiebrania kwamba vyote viwili vilijazwa.
- source_word: סֹלֶת
  choice: unga laini
  rationale: סֹלֶת ni unga uliosagwa vizuri uliotumika kwa sadaka; 'unga laini' ni wazi kwa wasomaji wa Kiswahili cha sasa.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Huhifadhi hali ya unga uliokuwa umechanganywa na mafuta bila kutumia lugha ya kizamani.
- source_word: לְמִנְחָה
  choice: kwa ajili ya sadaka ya nafaka
  rationale: Katika sheria za kikuhani, מִנְחָה hapa ni sadaka inayotokana na nafaka, si sadaka kwa maana pana tu.
