  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/029.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Eliab son of Helon.'
translation:
  language: sw
  text: na kwa dhabihu ya sadaka za amani:[a] ng’ombe wawili, kondoo dume watano, mbuzi dume watano, na wanakondoo dume watano wa mwaka mmoja. Hii ndiyo sadaka ya Eliabu mwana wa Heloni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za hali njema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים
  choice: na kwa ajili ya dhabihu ya sadaka za amani
  rationale: Viambishi vya kuunganisha na kuelekeza vinaendeleza orodha ya mstari uliotangulia. Neno זֶבַח linaonyesha dhabihu, huku שְׁלָמִים likiwa istilahi ya sadaka inayoweza kumaanisha amani, ushirika, au hali njema; ‘sadaka za amani’ ni fupi, ya heshima, na inayotambulika katika muktadha wa ibada.
- source_word: בָּקָר שְׁנַיִם
  choice: ng’ombe wawili
  rationale: בָּקָר ni jina la jumla la ng’ombe na hapa halibainishi jinsia; kwa hiyo ‘ng’ombe wawili’ huhifadhi kutobainishwa huko.
- source_word: אֵילִם חֲמִשָּׁה
  choice: kondoo dume watano
  rationale: אֵילִם humaanisha kondoo wa kiume, hivyo jinsia imeonyeshwa wazi.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: mbuzi dume watano
  rationale: עַתֻּדִים humaanisha hasa mbuzi wa kiume.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: wanakondoo dume watano wa mwaka mmoja
  rationale: כְּבָשִׂים ni wanakondoo na katika orodha hii ya dhabihu ni wa kiume; בְּנֵי שָׁנָה ni nahau ya umri, iliyotafsiriwa kwa Kiswahili cha kawaida kuwa ‘wa mwaka mmoja.’
- source_word: זֶה קָרְבַּן
  choice: Hii ndiyo sadaka ya
  rationale: Muundo wa Kiebrania ni wa kuonyesha na kutambulisha sadaka. Kiswahili ‘Hii ndiyo sadaka ya’ huhifadhi nguvu hiyo bila kulazimisha wakati uliopita usioonyeshwa moja kwa moja.
- source_word: אֱלִיאָב בֶּן חֵלֹן
  choice: Eliabu mwana wa Heloni
  rationale: Majina yamenukuliwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia, na patronimu בֶּן imetafsiriwa kwa ufupi kuwa ‘mwana wa.’
theological_decisions:
- issue: Maana ya istilahi ya dhabihu שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za hali njema
  rationale: Istilahi ya Kiebrania ina wigo wa maana unaohusisha amani, hali njema, na ushirika wa chakula cha dhabihu. Tafsiri kuu inatumia ‘sadaka za amani,’ huku tanbihi ikihifadhi njia nyingine halali za kuielewa bila kuamua maana moja kwa kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima, na unaosomeka kwa urahisi. Muundo wa orodha ya ibada umehifadhiwa, jinsia za wanyama zimebainishwa pale Kiebrania inapozibainisha, na alama ya tanbihi [a] imewekwa mara tu baada ya istilahi inayohusika.
