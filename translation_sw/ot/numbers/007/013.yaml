  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/013.yaml
  text: And his offering was one silver plate[a], its weight one hundred thirty shekels, one silver bowl of seventy shekels, according to the shekel of the sanctuary[b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: sw
  text: Sadaka yake ilikuwa sahani moja ya fedha[a], yenye uzito wa shekeli mia moja na thelathini, na bakuli moja la fedha[b], lenye uzito wa shekeli sabini kwa kipimo cha shekeli ya mahali patakatifu; vyote viwili vilikuwa vimejaa unga laini uliochanganywa na mafuta kwa ajili ya sadaka ya nafaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sinia”; neno la Kiebrania linamaanisha chombo kipana kisicho na kina kirefu.
    reason: lexical_alternative
  - marker: b
    text: Au “beseni”; hili ni neno la chombo kilichotumiwa katika ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְבָּנוֹ
  choice: Sadaka yake ilikuwa
  rationale: קָרְבָּן katika muktadha huu wa ibada ni kitu kinacholetwa kama sadaka; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: sahani moja ya fedha
  rationale: קַעֲרָה ni chombo kipana na kisicho na kina kirefu; “sahani” huwasilisha umbo hilo kwa lugha inayoeleweka, huku mbadala “sinia” ukitajwa katika tanbihi.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yenye uzito wa shekeli mia moja na thelathini
  rationale: Huwasilisha kwa uwazi uzito wa chombo kwa mpangilio wa kawaida wa namba katika Kiswahili.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: bakuli moja la fedha
  rationale: מִזְרָק ni chombo cha ibada, lakini kazi yake maalumu haitajwi katika mstari huu; “bakuli” ni neno la kawaida lisiloongeza maelezo yasiyosemwa.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: lenye uzito wa shekeli sabini
  rationale: Huweka wazi kuwa idadi hii ni uzito wa bakuli.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai hiki kinaonyesha kiwango rasmi cha uzani kilichohusishwa na mahali patakatifu; “kwa kipimo cha” hufanya maana hiyo iwe wazi bila kuiparafrazi kupita kiasi.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: vyote viwili vilikuwa vimejaa
  rationale: Huhifadhi rejeo la wazi kwa vile vyombo viwili na kupatana kisarufi na nomino za Kiswahili.
- source_word: סֹלֶת
  choice: unga laini
  rationale: סֹלֶת ni unga uliosafishwa vizuri uliotumiwa kwa sadaka; “unga laini” ni tafsiri ya kawaida na inayoeleweka.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Huwasilisha hali ya unga kuwa tayari umechanganywa na mafuta.
- source_word: לְמִנְחָה
  choice: kwa ajili ya sadaka ya nafaka
  rationale: Katika muktadha wa kikuhani, מִנְחָה ni aina maalumu ya sadaka inayotokana na nafaka, si sadaka kwa maana pana tu.
