base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/086.yaml
  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
translation:
  language: sw
  text: Sahani kumi na mbili za dhahabu zilizojaa uvumba,[a] kila moja ikiwa na uzito wa shekeli kumi, kwa kipimo cha shekeli ya mahali patakatifu; jumla ya dhahabu ya sahani hizo ilikuwa shekeli mia moja na ishirini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bakuli,” “visahani,” au, katika tafsiri za mapokeo, “vijiko,” kwa vyombo vya uvumba.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפּוֹת
  choice: sahani
  rationale: Katika muktadha wa matoleo ya maskani, neno hili linamaanisha vyombo vidogo vya kuwekea uvumba. “Sahani” ni neno la kawaida na linaloeleweka, huku tanbihi ikihifadhi uwezekano wa maumbo mengine ya chombo.
- source_word: זָהָב
  choice: dhahabu
  rationale: Ni jina la moja kwa moja la kitu kilichotengeneza vyombo hivyo.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: kumi na mbili
  rationale: Ni idadi ya jumla ya vyombo.
- source_word: מְלֵאֹת קְטֹרֶת
  choice: zilizojaa uvumba
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya vyombo kuwa vimejazwa uvumba.
- source_word: עֲשָׂרָה עֲשָׂרָה הַכַּף
  choice: kila sahani ikiwa na uzito wa shekeli kumi
  rationale: 'Kurudiwa kwa namba katika Kiebrania kuna maana ya mgawanyo: kila chombo kilikuwa na uzito wa shekeli kumi.'
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Hifadhi maana ya kiwango rasmi cha uzito kilichotumiwa katika huduma ya mahali patakatifu, kwa usemi unaoeleweka kwa msomaji wa sasa.
- source_word: כָּל זְהַב הַכַּפּוֹת
  choice: jumla ya dhahabu ya sahani hizo
  rationale: Muundo huu unatoa muhtasari wa jumla ya uzito wa dhahabu iliyokuwa katika vyombo vyote.
- source_word: עֶשְׂרִים וּמֵאָה
  choice: shekeli mia moja na ishirini
  rationale: Kiebrania kinataja 120; kipimo cha shekeli kinaeleweka kutokana na kishazi kilichotangulia na kimewekwa wazi katika tafsiri.
