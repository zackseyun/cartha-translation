  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: mbuzi dume
  rationale: Kirai hiki humaanisha mbuzi wa kiume katika muktadha wa dhabihu. “Mbuzi dume” ni Kiswahili cha kawaida na wazi, na kinahifadhi jinsia ya mnyama iliyoonyeshwa na Kiebrania.
- source_word: אֶחָד
  choice: mmoja
  rationale: Neno hili hutaja idadi ya kitu kinachotolewa. “Mmoja” linadumisha mtindo wa kuorodhesha matoleo katika Hesabu 7 na linapatana kisarufi na “mbuzi.”
- source_word: לְחַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Katika orodha za dhabihu, חַטָּאת ni aina maalumu ya sadaka, si dhambi kwa maana ya jumla. Kiambishi לְ kinaelezwa kwa kawaida hapa kwa “kwa ajili ya.”
theological_decisions:
- issue: Tafsiri ya istilahi ya dhabihu חַטָּאת
  choice: sadaka ya dhambi
  alternative: kwa ajili ya dhambi
  rationale: Muktadha wa ibada unaonyesha kuwa neno hili linataja aina maalumu ya sadaka iliyowekwa, hivyo “sadaka ya dhambi” huhifadhi maana hiyo bila kuifanya dhambi ya jumla tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye heshima. “Mbuzi dume” limechaguliwa badala ya “beberu” ili kueleweka kwa urahisi zaidi katika eneo pana huku maana ya jinsia ikihifadhiwa.
