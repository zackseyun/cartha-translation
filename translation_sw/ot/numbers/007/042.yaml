lexical_decisions:
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: Siku ya sita
  rationale: Hii ni kauli ya kawaida ya wakati katika mfululizo huu; Kiswahili cha asili hakihitaji kihusishi kabla ya “siku.”
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Katika Hesabu 7 neno hili humaanisha mkuu anayetambuliwa wa kabila. “Kiongozi” ni wazi kwa wasomaji wa sasa na halidokezi ufalme kama “mwana wa mfalme.”
- source_word: לִבְנֵי גָד
  choice: wa wana wa Gadi
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania ya ukoo na uhusiano wa kiongozi na wazao au kabila la Gadi.
- source_word: אֶלְיָסָף
  choice: Eliasafu
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kuonyesha uhusiano wa baba na mwana katika jina la nasaba.
- source_word: דְּעוּאֵל
  choice: Deueli
  rationale: Umbo la Kiebrania katika aya hii ni Deuel; irabu ya mwisho imeongezwa kulingana na utamkaji wa kawaida wa majina katika Kiswahili.
