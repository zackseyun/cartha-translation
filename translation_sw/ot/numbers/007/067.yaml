  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/067.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: sw
  text: Sadaka yake ilikuwa sahani moja ya fedha[a], yenye uzito wa shekeli 130, na bakuli moja la fedha[b], lenye uzito wa shekeli 70 kwa shekeli ya mahali patakatifu[c]. Vyombo hivyo viwili vilikuwa vimejaa unga laini uliochanganywa na mafuta kwa ajili ya sadaka ya nafaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sinia”; neno la Kiebrania linamaanisha chombo kipana kisicho na kina kirefu.
    reason: lexical_alternative
  - marker: b
    text: Au “beseni”; ni chombo kilichotumiwa katika ibada.
    reason: lexical_alternative
  - marker: c
    text: Yaani, kwa kufuata kiwango cha uzani kilichotumiwa katika mahali patakatifu.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Sadaka yake
  rationale: Katika muktadha wa ibada, קָרְבָּן ni kitu kinacholetwa na kutolewa kwa Mungu; “sadaka” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: sahani moja ya fedha
  rationale: קְעָרָה ni chombo kipana na kisicho na kina kirefu; “sahani” kinafaa katika orodha hii ya vyombo vya sadaka, huku uwezekano wa “sinia” ukitajwa katika tanbihi.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yenye uzito wa shekeli 130
  rationale: Huwasilisha kwa Kiswahili cha kawaida kauli ya Kiebrania inayotaja wazi uzito wa chombo.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: bakuli moja la fedha
  rationale: מִזְרָק ni chombo cha ibada; “bakuli” ni neno linaloeleweka kwa chombo chenye kina, bila kudai matumizi maalumu ambayo mstari hautaji.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: lenye uzito wa shekeli 70
  rationale: Hufanya wazi kwamba idadi hiyo ni uzito wa bakuli.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai hiki kinaonyesha kiwango rasmi cha uzani kilichotumiwa katika mahali patakatifu, si shekeli tofauti kama kitu.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Vyombo hivyo viwili vilijaa
  rationale: Huhifadhi msisitizo wa Kiebrania kwamba vyombo vyote viwili vilikuwa vimejaa.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Ni unga uliosagwa vizuri uliotumiwa katika sadaka; “unga laini” ni sahihi na ya kawaida katika Kiswahili.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Huwakilisha hali ya unga uliokuwa umechanganywa na mafuta kwa lugha ya sasa.
- source_word: לְמִנְחָה
  choice: kwa ajili ya sadaka ya nafaka
  rationale: Katika muktadha huu wa kikuhani, מִנְחָה ni sadaka iliyotengenezwa kwa nafaka, hivyo tafsiri mahususi inaepusha utata usio wa lazima.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Muundo wa orodha umehifadhiwa, huku sentensi zikisawazishwa kwa mtiririko wa kawaida wa Kiswahili. Nambari zimetumiwa kwa uzito ili kuweka orodha kuwa fupi na wazi.
