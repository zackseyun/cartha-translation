base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/008.yaml
  text: And he gave the four carts and the eight oxen to the sons of Merari[a], according to their service[b], under the direction of Ithamar son of Aaron the priest.
translation:
  language: sw
  text: Akawapa wana wa Merari yale magari manne na wale ng’ombe wanane, kulingana na huduma yao, chini ya usimamizi wa Ithamari, mwana wa Haruni, kuhani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: magari
  rationale: Katika muktadha huu neno hilo linamaanisha vyombo vya magurudumu vya kubebea mizigo; “magari” ni neno la kawaida na linaloeleweka katika Kiswahili, huku hesabu ya ng’ombe ikionyesha kuwa yalikuwa magari ya kukokotwa.
- source_word: הַבָּקָר
  choice: ng’ombe
  rationale: Neno la Kiebrania linaweza kumaanisha ng’ombe kwa ujumla; hapa ni wanyama waliotolewa pamoja na magari ili kuyakokota.
- source_word: נָתַן
  choice: akawapa
  rationale: Huhifadhi maana ya kawaida ya kitenzi ‘alitoa/aliwapa’ bila kuongeza wazo mahsusi la kuwagawia rasmi.
- source_word: לִבְנֵי מְרָרִי
  choice: wana wa Merari
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania na ni wazi katika Kiswahili.
- source_word: כְּפִי עֲבֹדָתָם
  choice: kulingana na huduma yao
  rationale: Usemi huu unaonyesha kwamba kiasi walichopewa kililingana na wajibu wao wa huduma ya maskani.
- source_word: בְּיַד אִיתָמָר
  choice: chini ya usimamizi wa Ithamari
  rationale: Kwa maana halisi ni ‘kwa mkono wa Ithamari,’ lakini katika muktadha wa kiutawala ni nahau ya uangalizi au usimamizi.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Kirai cha Kiebrania kinamtambulisha Haruni kwa cheo chake; mpangilio wa Kiswahili ‘mwana wa kuhani Haruni’ ni wa kawaida na wazi.
