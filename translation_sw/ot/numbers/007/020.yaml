lexical_decisions:
- source_word: כַּף
  choice: sahani
  rationale: Katika orodha ya sadaka za Maskani, neno hili linamaanisha chombo kidogo cha kuwekea kitu, si kiganja cha mkono. “Sahani” ni neno la kawaida na linafaa kwa chombo hiki; “kijiko” kingeweza kueleweka kimakosa kama kifaa cha kulia.
- source_word: אַחַת
  choice: moja
  rationale: Ni nambari ya kawaida inayopatana na nomino ya kike כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: yenye uzito wa shekeli kumi
  rationale: Ingawa neno “shekeli” halijaandikwa wazi katika kishazi hiki, kipimo hicho kimeachwa kwa ufupisho na kinaeleweka kutokana na muundo wa orodha katika mistari inayozunguka. Kutaja uzito huleta maana hiyo wazi kwa Kiswahili cha kawaida.
- source_word: זָהָב
  choice: ya dhahabu
  rationale: Inaonyesha kwamba chombo hicho kilitengenezwa kwa dhahabu.
- source_word: מְלֵאָה
  choice: ikiwa imejaa
  rationale: Ni kivumishi cha kiarifu kinachoeleza hali ya chombo na yaliyomo ndani yake.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kitu chenye harufu nzuri kilichoteketezwa katika ibada ya Maskani.
