  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: זֹ֣את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ מֵ/אֵ֖ת נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל קַעֲרֹ֨ת כֶּ֜סֶף שְׁתֵּ֣ים עֶשְׂרֵ֗ה מִֽזְרְקֵי כֶ֨סֶף֙ שְׁנֵ֣ים עָשָׂ֔ר כַּפּ֥וֹת זָהָ֖ב שְׁתֵּ֥ים עֶשְׂרֵֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/084.yaml
  text: 'This was the dedication offering of the altar on the day it was anointed[a], from the leaders of Israel: twelve silver dishes, twelve silver bowls[c][b], and twelve gold pans.'
translation:
  language: sw
  text: 'Hii ndiyo sadaka ya kuiweka madhabahu wakfu[a] siku ilipotiwa mafuta, iliyotolewa na viongozi wa Israeli[b]: sahani kumi na mbili za fedha, mabakuli kumi na mawili ya fedha, na vijiko kumi na viwili vya dhahabu.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huku ndiko kuwekwa wakfu kwa madhabahu.” Kiebrania kinaweza kutafsiriwa kwa namna hiyo iliyo rasmi zaidi, lakini muktadha unaonyesha kuwa hii ni jumla ya sadaka zilizotolewa.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakuu wa Israeli.” Neno la Kiebrania linamaanisha viongozi waliotambulika wa makabila.
    reason: lexical_alternative
  - marker: c
    text: Majina ya vyombo hivyo yanaweza pia kutafsiriwa “masinia ya fedha,” “mabeseni ya fedha,” na “vyombo vidogo” au “miiko ya dhahabu,” kwa kuwa umbo kamili la vyombo hivi vya ibada halijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: Hii ndiyo sadaka ya kuiweka madhabahu wakfu
  rationale: חֲנֻכָּה humaanisha kuweka wakfu au uzinduzi. Katika muktadha huu sentensi inajumlisha vitu vilivyotolewa kwa ajili ya kuiweka madhabahu wakfu, hivyo ‘sadaka’ huweka wazi maana inayodokezwa bila kuondoa uwezekano wa tafsiri rasmi zaidi.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: siku ilipotiwa mafuta
  rationale: Kirai hiki kinaonyesha wakati, na kiwakilishi kinarejelea madhabahu. ‘Kutiwa mafuta’ ni usemi wa kawaida na unaofaa katika muktadha wa ibada.
- source_word: מֵאֵת נְשִׂיאֵי יִשְׂרָאֵל
  choice: iliyotolewa na viongozi wa Israeli
  rationale: מֵאֵת huonyesha chanzo cha sadaka, na נְשִׂיאִים hapa ni viongozi wanaotambulika wa makabila, si lazima wana wa kifalme.
- source_word: קַעֲרֹת כֶּסֶף
  choice: sahani ... za fedha
  rationale: קְעָרָה ni chombo kipana kama sahani au kombe; ‘sahani’ hukitofautisha kwa urahisi na chombo kinachofuata.
- source_word: מִזְרְקֵי כֶסֶף
  choice: mabakuli ... ya fedha
  rationale: מִזְרָק ni bakuli au beseni lililotumiwa katika ibada. ‘Mabakuli’ ni Kiswahili cha kawaida na kinachosomeka kwa urahisi.
- source_word: כַּפּוֹת זָהָב
  choice: vijiko ... vya dhahabu
  rationale: כַּף kimsingi ni kiganja, na kwa upanuzi ni chombo kidogo kama kijiko au upawa. ‘Vijiko’ kinafaa kwa vyombo vidogo vilivyobeba uvumba katika muktadha huu, huku tanbihi ikihifadhi kutokuwa na uhakika kuhusu umbo lake.
- source_word: שְׁתֵּים עֶשְׂרֵה / שְׁנֵים עָשָׂר
  choice: kumi na mbili / kumi na mawili / kumi na viwili
  rationale: Nambari imetafsiriwa kwa upatanisho wa kisarufi unaolingana na ngeli za ‘sahani,’ ‘mabakuli,’ na ‘vijiko’ katika Kiswahili.
