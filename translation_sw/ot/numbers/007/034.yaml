  text: one male goat for a sin offering;[a]
translation:
  language: sw
  text: mbuzi dume mmoja kwa sadaka ya dhambi;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “mbuzi dume mmoja wa mbuzi kwa sadaka ya dhambi”; “wa mbuzi” huakisi nahau ya Kiebrania inayomaanisha mbuzi dume.
    reason: Hufafanua muundo wa nahau ya Kiebrania שְׂעִיר עִזִּים bila kuuwasilisha kama Kiswahili cha kawaida.
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: mbuzi dume
  rationale: Kirai hiki cha Kiebrania, ambacho kwa muundo wa maneno ni ‘mwenye manyoya wa mbuzi,’ ni nahau inayomaanisha mbuzi wa kiume. ‘Mbuzi dume’ ni Kiswahili cha kawaida, wazi, na kinachobainisha jinsia ya mnyama wa dhabihu.
- source_word: אֶחָד
  choice: mmoja
  rationale: Nambari imetajwa wazi ili kuhifadhi mtindo wa kuorodhesha na kuhesabu sadaka unaorudiwa katika Hesabu 7.
- source_word: לְחַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Katika muktadha huu wa ibada, חַטָּאת ni aina maalumu ya sadaka, si dhambi kama dhana tu. Kiambishi לְ kimetafsiriwa kwa kawaida kuwa ‘kwa ajili ya.’
theological_decisions:
- issue: Maana ya חַטָּאת katika muktadha wa dhabihu
  choice: sadaka ya dhambi
  alternative: dhambi
  rationale: Muktadha wa karibu ni orodha ya vitu vya dhabihu vilivyotolewa na viongozi wa makabila. Kwa hiyo, neno hili linataja aina ya sadaka bila kuingiza ufafanuzi wa kiteolojia usiotajwa katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Muundo mfupi wa orodha na alama ya nukta mkato umehifadhiwa kulingana na muktadha.
