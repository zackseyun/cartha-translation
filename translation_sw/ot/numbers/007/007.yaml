base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/007.yaml
  text: He gave the two carts and the four cattle to the sons of Gershon[b][a], according to their service.
translation:
  language: sw
  text: Aliwapa wana wa Gershoni mikokoteni miwili[a] na ng’ombe wanne[b], kulingana na huduma yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “magari mawili ya kubebea mizigo.”
    reason: lexical_alternative
  - marker: b
    text: Au “maksai wanne.” Kiebrania kimetumia neno la kijumla kwa wanyama wa jamii ya ng’ombe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: mikokoteni
  rationale: Neno עֲגָלָה humaanisha mkokoteni wa kubebea mizigo. “Mikokoteni” ni Kiswahili cha kawaida kinachofaa katika muktadha wa kusafirisha vifaa vya hema la kukutania.
- source_word: הַבָּקָר
  choice: ng’ombe
  rationale: בָּקָר ni nomino ya kijumla kwa wanyama wa jamii ya ng’ombe. “Ng’ombe” huhifadhi maana hiyo bila kubainisha jinsia, ingawa katika muktadha huu walitumika kuvuta mikokoteni.
- source_word: לִבְנֵי גֵרְשׁוֹן
  choice: wana wa Gershoni
  rationale: Huhifadhi muundo wa Kiebrania, yaani “wana wa Gershoni,” badala ya kuugeuza kuwa jina la kikundi.
- source_word: כְּפִי עֲבֹדָתָם
  choice: kulingana na huduma yao
  rationale: Kifungu hiki kina maana ya jambo linalolingana na huduma au wajibu wao. “Huduma” huhifadhi muktadha wa majukumu yao katika hema la kukutania.
- source_word: נָתַן
  choice: Aliwapa
  rationale: Kitenzi kina maana ya moja kwa moja ya kutoa. Kiambishi cha yambwa “-wa-” kinaonyesha kwamba aliwapa wao vitu hivyo kwa Kiswahili cha asili.
theological_decisions: []
translation_notes:
