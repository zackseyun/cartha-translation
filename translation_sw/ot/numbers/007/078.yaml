  text: בְּ/יוֹם֙ שְׁנֵ֣ים עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/078.yaml
  text: On the twelfth day, the leader of the sons of Naphtali was Ahira son of Enan.
translation:
  language: sw
  text: Siku ya kumi na mbili, kiongozi wa wana wa Naftali alikuwa Ahira mwana wa Enani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁנֵים עָשָׂר
  choice: Siku ya kumi na mbili
  rationale: Hii ni kauli ya wakati yenye maana ya ‘siku ya kumi na mbili’; Kiswahili cha kawaida hutumia muundo huu wa namba ya mpangilio.
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Katika muktadha wa kabila, neno hili humaanisha mkuu au kiongozi anayetambulika; ‘kiongozi’ ni la sasa na halidokezi ufalme.
- source_word: לִבְנֵי נַפְתָּלִי
  choice: wa wana wa Naftali
  rationale: Kiambishi ל kinaonyesha uhusiano wa kiongozi na kundi la kikabila; tafsiri hii inadumisha pia usemi wa Kiebrania wa kijinsia ‘wana wa Naftali.’
- source_word: אֲחִירַע
  choice: Ahira
  rationale: Jina la mtu limetoholewa kwa mwandiko wa Kiswahili badala ya kutafsiriwa maana yake.
- source_word: בֶּן עֵינָן
  choice: mwana wa Enani
  rationale: Huu ni muundo wa kawaida wa Kiebrania unaotaja baba wa mtu.
theological_decisions:
- issue: Usemi wa kikabila wenye jinsia בְּנֵי
  choice: wana wa Naftali
  alternative: watoto wa Naftali; wazao wa Naftali
  rationale: Kiebrania kina nomino ya wingi wa kiume inayotumiwa kama jina la kawaida la kabila. ‘Wana wa Naftali’ huhifadhi muundo huo bila kuugeuza kuwa usemi usio na jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa aya umehifadhi fomula ya kurudiwa katika sura hii.
