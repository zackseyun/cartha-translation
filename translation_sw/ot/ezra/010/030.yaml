  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa orodha ya nasaba, wenye hadhi na ulio wazi. Majina yametoholewa kwa mfumo wa sauti wa Kiswahili, na hakuna ufafanuzi wa kimadhehebu ulioongezwa.
