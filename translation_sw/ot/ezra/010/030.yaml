base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/030.yaml
  text: 'And from the sons of Pahath-moab: Adna, Chelal, Benaiah, Maaseiah, Mattaniah, Bezalel, Binnui, and Manasseh.'
translation:
  language: sw
  text: 'Na katika wana wa Pahath-Moabu: Adna, Kelali, Benaya, Maaseya, Matania, Besaleli, Binui na Manase.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Na katika wana wa
  rationale: Muundo huu unaonyesha mwendelezo wa orodha kwa וּ, maana ya kutoka miongoni mwa kundi kwa מִן, na mpangilio wa kifamilia wa בְּנֵי. Neno “wana” linahifadhi umbo la nasaba la chanzo.
- source_word: פַּחַת מוֹאָב
  choice: Pahath-Moabu
  rationale: Jina la ukoo limetoholewa badala ya kutafsiriwa; kistari kinaonyesha kuwa vipashio hivyo viwili vinaunda jina moja, na “Moabu” ni umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: עַדְנָא
  choice: Adna
  rationale: Jina limetoholewa kwa mfumo unaosomeka kwa kawaida katika Kiswahili bila kuongeza sauti isiyohitajika mwishoni.
- source_word: וּ/כְלָל
  choice: Kelali
  rationale: Jina limetoholewa kwa sauti ya כ kama k na kupewa irabu ya mwisho ili lisomeke kwa urahisi katika Kiswahili.
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Utohozi huu unakaribia matamshi ya Kiebrania na unafaa mfumo wa sauti wa Kiswahili.
- source_word: מַעֲשֵׂיָה
  choice: Maaseya
  rationale: Jina limetoholewa kwa kuhifadhi mfuatano mkuu wa sauti wa Kiebrania kwa umbo linalotamkika kwa Kiswahili.
- source_word: מַתַּנְיָה
  choice: Matania
  rationale: Utohozi huu unawakilisha jina la Kiebrania kwa umbo la kawaida na linalosomeka katika Kiswahili.
- source_word: בְצַלְאֵל
  choice: Besaleli
  rationale: Jina limetoholewa kwa “s” kwa herufi צ na kupewa irabu ya mwisho kulingana na mtindo wa majina ya kibiblia katika Kiswahili.
- source_word: וּ/בִנּוּי
  choice: Binui
  rationale: Jina limetoholewa kwa kuhifadhi mfuatano wa sauti wa Kiebrania; kiunganishi kimewakilishwa katika uratibu wa orodha.
- source_word: וּ/מְנַשֶּׁה
  choice: na Manase
  rationale: Jina limetoholewa kwa umbo la Kiswahili linalojulikana, huku וּ ikitafsiriwa “na” kwa kipengele cha mwisho cha orodha.
theological_decisions: []
