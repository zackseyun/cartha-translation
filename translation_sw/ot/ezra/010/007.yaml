lexical_decisions:
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: wakatangaza
  rationale: Muunganiko wa Hifili wa עבר na קוֹל ni nahau ya kusambaza tangazo hadharani. ‘Wakatangaza’ ni Kiswahili cha kawaida na kinachofaa muktadha huu wa kiutawala.
- source_word: בִּיהוּדָה וִירוּשָׁלִַם
  choice: katika Yuda yote na Yerusalemu
  rationale: Kihusishi ב hapa kinaonyesha eneo ambamo tangazo lilienezwa. Neno ‘yote’ baada ya Yuda linaonyesha usambazaji mpana bila kudokeza kwamba Yerusalemu si sehemu mahususi iliyotajwa pamoja nayo.
- source_word: לְכֹל בְּנֵי הַגּוֹלָה
  choice: kwa wana wote wa uhamisho
  rationale: Hili linahifadhi kwa karibu usemi wa Kiebrania ‘wana wa uhamisho’ na wingi wake wa kiume, badala ya kuufasiri moja kwa moja kuwa ‘wahamishwa’ au ‘waliorudi kutoka uhamishoni.’ Tanbihi inaeleza maana ya nahau hiyo.
- source_word: הַגּוֹלָה
  choice: uhamisho
  rationale: Nomino inaweza kumaanisha hali au tukio la kuhamishwa, au jumuiya iliyotokana nalo. ‘Uhamisho’ huhifadhi utata huo kwa kiasi kikubwa katika usemi huu.
- source_word: לְהִקָּבֵץ
  choice: kwamba wakusanyike
  rationale: Infinitivi ya Nifali yenye ל inaonyesha yaliyomo au kusudi la tangazo. ‘Kwamba wakusanyike’ huwasilisha mwito huo kwa Kiswahili cha asili.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Baada ya ‘wakusanyike,’ jina la mahali bila kihusishi cha ziada linaeleweka kiasili kuwa mahali pa kukusanyika; pia huepuka kuongeza kwa lazima maana ya mwendo ‘kwenda’ isiyotajwa wazi.
