  text: 'Na miongoni mwa Waisraeli, kutoka kwa wana wa Paroshi: Ramia, Yizia, Malkia, Miyamini, Eleazari, Malkia[a], na Benaya.'
  philosophy: optimal-equivalence
  footnotes:
