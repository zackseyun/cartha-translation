lexical_decisions:
- source_word: וּמִֽיִּשְׂרָאֵל
  choice: Na miongoni mwa Waisraeli
  rationale: Kiunganishi וּ kinaendeleza orodha kutoka mstari uliotangulia, na מִן katika muktadha huu huonyesha watu waliotoka katika kundi la Israeli. Kiswahili cha wingi 'Waisraeli' ni cha kawaida na wazi kwa orodha ya watu.
- source_word: מִבְּנֵי
  choice: kutoka kwa wana wa
  rationale: Muundo huu huhifadhi maana ya msingi ya 'wana wa' huku ukiruhusu maana ya wanaukoo au washiriki wa jamaa katika orodha ya nasaba.
- source_word: פַרְעֹשׁ
  choice: Paroshi
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: רַמְיָה
  choice: Ramia
  rationale: Jina limetoholewa kwa kufuata sauti za Kiebrania na muundo wa tahajia ya Kiswahili.
- source_word: יִזִּיָּה
  choice: Izia
  rationale: Jina limetoholewa kwa njia ya asili katika Kiswahili bila kuongeza sauti isiyohitajika mwanzoni.
- source_word: מַלְכִּיָּה
  choice: Malkia
  rationale: Jina limetoholewa kwa karibu na umbo la Kiebrania; tahajia ileile imetumiwa katika sehemu zote mbili ambako jina linarudiwa.
- source_word: מִיָּמִן
  choice: Mijamini
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili inayowakilisha konsonanti ya kati /y/ kwa 'j' katika mfuatano huu.
- source_word: אֶלְעָזָר
  choice: Eleazari
  rationale: Umbo la Kiswahili lililozoeleka la jina hili limetumiwa.
- source_word: בְנָיָה
  choice: Benaia
  rationale: Jina limetoholewa kwa tahajia ya kawaida na inayosomeka kwa urahisi katika Kiswahili.
