  text: 'And from the sons of Elam: Mattaniah, Zechariah, Jehiel, Abdi, Jeremoth, and Elijah.'
translation:
  language: sw
  text: 'Na kutoka miongoni mwa wana wa Elamu: Matania, Zekaria, Yehieli, Abdi, Yeremothi, na Eliya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Na wa wana wa
  rationale: Muundo huu unawakilisha kiunganishi, kihusishi, na wingi wa בֵּן katika orodha ya koo. Neno “wana” linadumisha nahau ya Kiebrania kwa uwazi, huku “wa” ya kwanza ikieleweka kwa maana ya watu waliotoka katika kundi hilo.
- source_word: עֵילָם
  choice: Elamu
  rationale: Ni jina la babu au ukoo katika muktadha huu; limeandikwa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: מַתַּנְיָה
  choice: Matania
  rationale: Uhawilishaji wa kawaida na unaosomeka kwa urahisi wa jina la Kiebrania katika Kiswahili.
- source_word: זְכַרְיָה
  choice: Zekaria
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: וִ/יחִיאֵל
  choice: Yehieli
  rationale: Uhawilishaji unaokaribia sauti ya Kiebrania יְחִיאֵל na unaolingana na mfumo wa sauti wa Kiswahili.
- source_word: וְ/עַבְדִּי
  choice: Abdi
  rationale: Hili ni jina la mtu katika muundo wa orodha, si kirai cha kawaida chenye maana ya “mtumishi wangu”; kwa hiyo limehawilishwa.
- source_word: וִ/ירֵמוֹת
  choice: Yeremothi
  rationale: Uhawilishaji wa jina unaohifadhi konsonanti kuu za Kiebrania na kuongeza irabu ya mwisho ili lisomeke kwa kawaida katika Kiswahili.
- source_word: וְ/אֵלִיָּה
  choice: Eliya
  rationale: Umbo lililozoeleka katika Biblia na lugha ya kawaida ya Kiswahili kwa jina אֵלִיָּה.
