  text: 'Na katika wana wa Pashuri: Elioenai, Maaseya, Ishmaeli, Nethaneli, Yozabadi na Elasa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Na katika wazao wa
  rationale: Muundo huu unahifadhi kiunganishi וּ, maana ya sehemu ya kundi katika מִן, na matumizi ya בְּנֵי kwa ukoo au kundi la kifamilia; “wazao” ni ya asili zaidi kuliko “wana” katika orodha hii.
- source_word: פַּשְׁחוּר
  choice: Pashuri
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likibaki karibu na umbo la Kiebrania.
- source_word: אֶלְיוֹעֵינַי
  choice: Elioenai
  rationale: Jina limetoholewa bila kutafsiri maana yake, kwa umbo linalofaa fonolojia ya Kiswahili.
- source_word: מַעֲשֵׂיָה
  choice: Maaseya
  rationale: Tahajia hii inawakilisha jina la Kiebrania kwa uwazi na inatumia umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: יִשְׁמָעֵאל
  choice: Ishmaeli
  rationale: Umbo hili la jina limezoeleka katika Biblia za Kiswahili na linawakilisha jina la Kiebrania.
- source_word: נְתַנְאֵל
  choice: Nethaneli
  rationale: Jina limetoholewa kwa kuongeza irabu ya mwisho inayorahisisha matamshi ya Kiswahili bila kutafsiri jina.
- source_word: יוֹזָבָד
  choice: Yozabadi
  rationale: Konsonanti ya mwanzo yod imewakilishwa kwa “Y,” na irabu ya mwisho imeongezwa kwa matamshi ya kawaida ya Kiswahili.
- source_word: וְ/אֶלְעָשָׂה
  choice: na Elasa
  rationale: Kiunganishi וְ kimetafsiriwa wazi kuwa “na,” na jina limetoholewa kwa umbo fupi linalokaribia Kiebrania.
