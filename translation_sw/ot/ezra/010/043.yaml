  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye heshima unaofaa orodha ya majina. “Miongoni mwa wazao” linaweka wazi kuwa hawa ni baadhi ya watu wa ukoo huo. Alama ya tanbihi imewekwa baada ya jina linalohusika, Yadai.
