base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/043.yaml
  text: 'From the sons of Nebo: Jeiel[a], Mattithiah, Zabad, Zebina, Jaddai, Joel, and Benaiah.'
translation:
  language: sw
  text: 'Miongoni mwa wazao wa Nebo: Yeieli, Matithia, Zabadi, Zebina, Yadai[a], Yoeli, na Benaya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Usomaji wa jina hili la Kiebrania hauna uhakika; linaweza pia kutoholewa kuwa Ido au Yedo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: Miongoni mwa wazao wa
  rationale: Kirai hiki kinaonyesha watu waliotajwa kuwa sehemu ya kundi la ukoo. “Wazao” linaeleza kazi ya genealogia kwa Kiswahili cha kawaida bila kudai kwamba wote walikuwa wana wa moja kwa moja.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Jina la ukoo au la mtu limetoholewa kwa umbo linalotambulika katika Kiswahili.
- source_word: יְעִיאֵל
  choice: Yeieli
  rationale: Utohozi wa jina la Kiebrania unaofuata matamshi na uandishi wa majina ya kibiblia katika Kiswahili.
- source_word: מַתִּתְיָה
  choice: Matithia
  rationale: Utohozi wa moja kwa moja wa jina la Kiebrania kwa mfumo wa sauti wa Kiswahili.
- source_word: זָבָד
  choice: Zabadi
  rationale: Jina limetoholewa kwa kuongeza irabu ya mwisho ili lisomeke kwa kawaida katika Kiswahili.
- source_word: זְבִינָא
  choice: Zebina
  rationale: Utohozi wa karibu wa jina la asili unaosomika kwa kawaida katika Kiswahili.
- source_word: ידו
  choice: Yadai[a]
  rationale: Maandishi ya jina hili hayana uhakika. “Yadai” limetumiwa katika maandishi, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: וְ/יוֹאֵל
  choice: Yoeli
  rationale: Kiunganishi cha Kiebrania kinawakilishwa na “na” kabla ya jina la mwisho katika orodha ya Kiswahili; jina lenyewe limetoholewa kuwa “Yoeli.”
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Utohozi wa kawaida wa jina la Kiebrania unaolingana na mfumo wa sauti wa Kiswahili.
