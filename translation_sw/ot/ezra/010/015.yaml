id: EZR.10.15
reference: Ezra 10:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַ֣ךְ יוֹנָתָ֧ן בֶּן עֲשָׂהאֵ֛ל וְ/יַחְזְיָ֥ה בֶן תִּקְוָ֖ה עָמְד֣וּ עַל זֹ֑את וּ/מְשֻׁלָּ֛ם וְ/שַׁבְּתַ֥י הַ/לֵּוִ֖י עֲזָרֻֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/015.yaml
  text: Only Jonathan son of Asahel and Jahzeiah son of Tikvah stood against this[b][a], and Meshullam and Shabbethai the Levite supported them.
translation:
  language: sw
  text: Ni Yonathani mwana wa Asaheli na Yahzeya mwana wa Tikva[a] tu waliopinga jambo hili; nao Meshulamu na Shabethai Mlawi waliwaunga mkono[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahazia mwana wa Tikva.”
    reason: lexical_alternative
  - marker: b
    text: Au, “waliwasaidia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: tu
  rationale: Katika muktadha huu neno hili linaweka mpaka na kuwatenga watu waliotajwa na makubaliano ya wengi. Kuweka “tu” baada ya majina ni mtindo wa kawaida na wa asili katika Kiswahili.
- source_word: יוֹנָתָן בֶּן עֲשָׂהאֵל
  choice: Yonathani mwana wa Asaheli
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika Kiswahili cha Biblia, na בֶּן limetafsiriwa “mwana wa” katika utambulisho wa ukoo.
- source_word: יַחְזְיָה בֶן תִּקְוָה
  choice: Yahzeya mwana wa Tikva
  rationale: “Yahzeya” linafuata kwa karibu matamshi ya umbo la Kiebrania; umbo jingine la kawaida, “Yahazia,” limehifadhiwa katika tanbihi.
- source_word: עָמְדוּ עַל זֹאת
  choice: waliopinga jambo hili
  rationale: Katika muktadha wa pendekezo lililotangulia, kirai hiki kinaeleweka kwa kawaida kuwa kuchukua msimamo dhidi ya jambo hilo. “Waliopinga jambo hili” ni wazi na asili katika Kiswahili, ingawa Kiebrania chenyewe kina picha halisi ya ‘kusimama juu/dhidi ya jambo hili.’
- source_word: וּמְשֻׁלָּם וְשַׁבְּתַי הַלֵּוִי
  choice: nao Meshulamu na Shabethai Mlawi
  rationale: Mpangilio wa Kiebrania unaonyesha kwamba “Mlawi” linamtambulisha Shabethai peke yake, si watu wote wawili.
- source_word: עֲזָרֻם
  choice: waliwaunga mkono
  rationale: Kitenzi עזר pamoja na kiambishi cha nafsi ya tatu wingi humaanisha kuwasaidia. Katika muktadha huu wa msimamo kuhusu utaratibu uliopendekezwa, “waliwaunga mkono” linaonyesha kwamba Meshulamu na Shabethai walikuwa upande wao; maana ya moja kwa moja zaidi imeonyeshwa katika tanbihi.
theological_decisions: []
translation_notes:
