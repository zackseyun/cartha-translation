  yaml_path: translation/ot/ezra/010/027.yaml
  text: 'And from the sons of Zattu: Elioenai, Eliashib, Mattaniah, Jeremoth, Zabad, and Aziza.'
translation:
  language: sw
  text: 'Na kutoka kwa wana wa Zatu: Elioenai, Eliashibu, Matania, Yeremothi, Zabadi, na Aziza.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Na kutoka kwa wana wa
  rationale: Inahifadhi kiunganishi cha kuendeleza orodha, kihusishi, na maana ya moja kwa moja ya wingi wa בֵּן; katika muktadha huu inaweza pia kuashiria wazao au ukoo.
- source_word: זַתּוּא
  choice: Zatu
  rationale: Jina la ukoo limeandikwa kwa mfumo unaosomeka kiasili katika Kiswahili.
- source_word: אֶלְיוֹעֵנַי
  choice: Elioenai
  rationale: Jina limenukuliwa kwa herufi za Kiswahili huku umbo lake la Kiebrania likihifadhiwa kwa karibu.
- source_word: אֶלְיָשִׁיב
  choice: Eliashibu
  rationale: Jina limetoholewa kwa matamshi yanayofaa Kiswahili, likiongezewa vokali ya mwisho ili kuepuka konsonanti ya mwisho isiyo ya kawaida.
- source_word: מַתַּנְיָה
  choice: Matania
  rationale: Jina limetoholewa kwa namna rahisi na ya kawaida katika Kiswahili.
- source_word: וִֽ/ירֵמוֹת
  choice: Yeremothi
  rationale: Jina limetoholewa kutoka umbo la Kiebrania; kiunganishi chake kimewakilishwa kwa mtindo wa kawaida wa orodha ya Kiswahili.
- source_word: וְ/זָבָד
  choice: Zabadi
  rationale: Jina limetoholewa kwa fonolojia ya Kiswahili; kiunganishi hakijarudiwa kwa kuwa orodha ya Kiswahili hutumia koma.
- source_word: וַ/עֲזִיזָא
  choice: na Aziza
  rationale: Kiunganishi cha Kiebrania kimehifadhiwa kama “na” kabla ya jina la mwisho, kwa mtindo wa kawaida wa orodha ya Kiswahili.
