translation:
  language: sw
  text: Inuka, kwa maana jambo hili ni jukumu lako[a], nasi tuko pamoja nawe. Uwe hodari, lifanye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo hili liko juu yako.” Nahau ya Kiebrania ina maana kwamba wajibu wa kushughulikia jambo hili ni wa Ezra.
