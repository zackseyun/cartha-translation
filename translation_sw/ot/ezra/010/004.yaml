lexical_decisions:
- source_word: קוּם
  choice: Inuka
  rationale: Amri hii inamtaka Ezra achukue hatua mara moja. “Inuka” ni Kiswahili cha kawaida, cha moja kwa moja, na chenye nguvu ya himizo.
- source_word: כִּי
  choice: kwa maana
  rationale: Neno hili linatanguliza sababu ya amri iliyotangulia; “kwa maana” linaonyesha uhusiano huo wazi na kwa lugha yenye hadhi.
- source_word: עָלֶיךָ הַדָּבָר
  choice: jambo hili ni jukumu lako
  rationale: Nahau ya Kiebrania yenye עַל pamoja na mtu inaonyesha kwamba wajibu wa kushughulikia jambo hilo unamwangukia mtu huyo. Tafsiri hii ni ya asili katika Kiswahili na inaweka wazi maana ya nahau bila kuongeza fundisho.
- source_word: וַאֲנַחְנוּ עִמָּךְ
  choice: nasi tuko pamoja nawe
  rationale: Inaonyesha mshikamano na msaada. “Pamoja nawe” ni usemi wa kawaida na huhifadhi maana ya kuwa upande wake.
- source_word: חֲזַק
  choice: Uwe hodari
  rationale: Amri ya חזק inahimiza nguvu na uthabiti. “Uwe hodari” ni ya asili katika muktadha huu na huepuka kuifanya kuwa hisia ya ujasiri pekee.
- source_word: וַעֲשֵׂה
  choice: ulifanye
  rationale: Kiwakilishi “li” kinarejelea “jambo hili,” ambalo ndilo jambo linaloeleweka kuwa kitendwa. Hivyo tafsiri inabaki fupi na ya wazi.
