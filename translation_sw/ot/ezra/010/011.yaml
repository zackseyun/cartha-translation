base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/011.yaml
  text: So now give praise to Yahweh[a], the God of your fathers, and do his will[b]. Separate yourselves from the peoples of the land and from the foreign women.
translation:
  language: sw
  text: Basi sasa mpeni Yahwe[a], Mungu wa baba zenu, sifa, na mfanye mapenzi yake. Jitengeni na mataifa ya nchi na wanawake wa kigeni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ungameni mbele za Yahwe.” Nahau ya Kiebrania inaweza kumaanisha kutoa sifa au shukrani, na katika muktadha huu inaweza pia kumaanisha kuungama.
    reason: alternative_reading
  - marker: b
    text: Au “wake wa kigeni.” Muktadha mpana unahusu ndoa, ingawa Kiebrania cha aya hii kinasema “wanawake wa kigeni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ תוֹדָה
  choice: mpeni ... sifa
  rationale: Neno תּוֹדָה linaweza kumaanisha shukrani au sifa, na katika muktadha huu pia linaweza kudokeza ungamo. Kauli “mpeni ... sifa” ni ya asili katika Kiswahili na inaacha maana mbadala katika tanbihi.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kufichwa ndani ya cheo.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Mungu wa mababu zenu
  rationale: “Mababu zenu” huhifadhi lugha ya ukoo na agano huku ikiwa ya kawaida na inayoeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: וַעֲשׂוּ רְצוֹנוֹ
  choice: na mfanye mapenzi yake
  rationale: Tafsiri hii ni ya kawaida katika Kiswahili na huhifadhi nguvu ya amri ya kutenda lile analolitaka Mungu.
- source_word: וְהִבָּדְלוּ
  choice: Jitengeni
  rationale: Kitenzi hiki huonyesha amri yenye maana ya kujitenga wenyewe, sawasawa na nguvu ya Kiebrania ya Niphal katika muktadha huu.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: na watu wa nchi hii
  rationale: “Watu” linaweza kutaja makundi mbalimbali ya wakazi, na “nchi hii” huwasilisha rejeo la הָאָרֶץ kwa Kiswahili cha kawaida bila kuwataja kwa tafsiri ya ziada kuwa mataifa maalumu.
- source_word: וּמִן הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: na wanawake wa kigeni
  rationale: Kiebrania cha aya hii kinasema moja kwa moja “wanawake wa kigeni”; muktadha mpana unaonyesha kuwa wake ndio wanaohusika, lakini hilo limehifadhiwa kama maana mbadala katika tanbihi.
theological_decisions:
- issue: Iwapo תּוֹדָה hapa litafsiriwe kuwa sifa/shukrani au ungamo
  choice: mpeni ... sifa
  alternative: ungameni mbele za Yahwe
  rationale: Kishazi cha Kiebrania kinaweza kuwa na maana ya sifa au shukrani, lakini katika muktadha wa kukubali kosa na kutii kinaweza pia kumaanisha ungamo. Maandishi makuu yanatumia “sifa,” huku tanbihi ikihifadhi maana ya ungamo bila kuondoa mvutano huo.
- issue: Iwapo הַנָּשִׁים הַנָּכְרִיּוֹת itajwe kuwa wanawake au wake
  choice: wanawake wa kigeni
  alternative: wake wa kigeni
  rationale: Aya yenyewe inasema “wanawake,” ingawa habari yote inahusu ndoa. Tafsiri kuu inafuata usemi halisi wa aya, na maana ya kimuktadha imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wazi na wa kisasa. Muundo wa amri umehifadhiwa, na tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
