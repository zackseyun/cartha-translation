lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Na miongoni mwa wana wa
  rationale: Muundo huu una kiunganishi, kihusishi, na wingi wa neno ‘wana.’ Katika orodha hii, ‘miongoni mwa’ ni Kiswahili cha kawaida kinachoonyesha kwamba majina yanayofuata yametoka katika ukoo huo, huku ‘wana wa’ kikihifadhi usemi wa Kiebrania.
- source_word: בֵּבָי
  choice: Bebai
  rationale: Jina la mtu au ukoo limetoholewa kwa kuzingatia umbo lake la Kiebrania.
- source_word: יְהוֹחָנָן
  choice: Yehohanani
  rationale: Utohozi huu unawakilisha kwa karibu umbo kamili la jina la Kiebrania na kipengele chake cha mwanzo Yeho-; umbo lililorahisishwa ‘Yohanani’ limeonyeshwa katika tanbihi.
- source_word: חֲנַנְיָה
  choice: Hanania
  rationale: Jina limetoholewa kwa namna ya kawaida na inayoeleweka katika Kiswahili.
- source_word: זַבַּי
  choice: Zabai
  rationale: Jina limetoholewa kwa mfumo wa sauti na tahajia unaofaa Kiswahili, bila kurudufu konsonanti isiyohitajika.
- source_word: עַתְלָי
  choice: Atlai
  rationale: Jina limetoholewa kwa karibu kutoka katika umbo la Kiebrania.
