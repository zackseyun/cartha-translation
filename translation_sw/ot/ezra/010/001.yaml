  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/כְ/הִתְפַּלֵּ֤ל עֶזְרָא֙ וּ/כְ֨/הִתְוַדֹּת֔/וֹ בֹּכֶה֙ וּ/מִתְנַפֵּ֔ל לִ/פְנֵ֖י בֵּ֣ית הָ/אֱלֹהִ֑ים נִקְבְּצוּ֩ אֵלָ֨י/ו מִ/יִּשְׂרָאֵ֜ל קָהָ֣ל רַב מְאֹ֗ד אֲנָשִׁ֤ים וְ/נָשִׁים֙ וִֽ/ילָדִ֔ים כִּֽי בָכ֥וּ הָ/עָ֖ם הַרְבֵּה בֶֽכֶה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/001.yaml
  text: While Ezra was praying and making confession[a], weeping and falling down before the house of God, a very large assembly from Israel gathered to him—men, women, and children—for the people wept bitterly.
translation:
  language: sw
  text: Ezra alipokuwa akisali na kuungama[a], huku akilia na kujiangusha chini mbele ya nyumba ya Mungu, kusanyiko kubwa sana kutoka Israeli likakusanyika kwake—wanaume, wanawake na watoto—kwa maana watu walilia sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kuungama dhambi.” Kiebrania hakitaji wazi kitu kinachoungamwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְהִתְפַּלֵּל
  choice: alipokuwa akisali
  rationale: Kiambishi כְּ pamoja na umbo la kitenzi huonyesha tendo linaloendelea wakati tendo jingine linatokea; tafsiri hii ni ya asili katika Kiswahili.
- source_word: וּכְהִתְוַדֹּתוֹ
  choice: na kuungama
  rationale: Hitpaeli ya ידה hapa humaanisha kuungama, hasa katika muktadha wa toba na sala.
- source_word: בֹּכֶה וּמִתְנַפֵּל
  choice: huku akilia na kujiangusha chini
  rationale: Vivumishi-tendo hivi vinaonyesha matendo yanayoendelea. 'Kujiangusha chini' huhifadhi maana ya kujitupa chini bila kulazimisha kwamba alikuwa amelala kifudifudi kabisa.
- source_word: לִפְנֵי בֵּית הָאֱלֹהִים
  choice: mbele ya nyumba ya Mungu
  rationale: Huhifadhi usemi halisi wa Kiebrania na sauti yake yenye heshima badala ya kuubadili moja kwa moja kuwa 'hekalu.'
- source_word: נִקְבְּצוּ אֵלָיו
  choice: likamkusanyikia
  rationale: Huwasilisha kwa kawaida katika Kiswahili kusany gathered toward Ezra, bila kuongeza wazo lisilo wazi la kumzunguka.
- source_word: מִיִּשְׂרָאֵל קָהָל רַב מְאֹד
  choice: kusanyiko kubwa sana la Waisraeli
  rationale: מִיִּשְׂרָאֵל humaanisha watu kutoka miongoni mwa Israeli; 'la Waisraeli' ni fasaha na wazi. קהל ni mkusanyiko, na רַב מְאֹד huonyesha ukubwa mkubwa sana.
- source_word: אֲנָשִׁים וְנָשִׁים וִילָדִים
  choice: wanaume, wanawake na watoto
  rationale: Huhifadhi kwa uwazi makundi yote matatu yaliyotajwa katika chanzo.
- source_word: כִּי בָכוּ הָעָם הַרְבֵּה בֶכֶה
  choice: kwa maana watu walilia sana
  rationale: כִּי inaleta sababu au maelezo. 'Walilia sana' ni Kiswahili cha kawaida kinachohifadhi msisitizo wa הַרְבֵּה בֶכֶה bila kuongeza kwa lazima dhana ya uchungu.
