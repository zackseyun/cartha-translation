  text: וַ/יָּ֨קָם עֶזְרָ֤א הַ/כֹּהֵן֙ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַתֶּ֣ם מְעַלְתֶּ֔ם וַ/תֹּשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת לְ/הוֹסִ֖יף עַל אַשְׁמַ֥ת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/010.yaml
  text: Then Ezra the priest stood up and said to them[a], “You have acted unfaithfully and have taken foreign women as wives, adding to the guilt of Israel.”
translation:
  language: sw
  text: Kisha Ezra kuhani akasimama na kuwaambia, “Ninyi mmekosa uaminifu na mmewachukua wanawake wa kigeni kuwa wake[a], na hivyo mmeongeza hatia ya Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “wanawake wa kigeni”; katika muktadha huu ni wanawake waliochukuliwa kuwa wake.
    reason: Kufafanua kwamba nomino ya Kiebrania inaweza kumaanisha “wanawake” au “wake,” na kwamba uhusiano wa ndoa unatokana na muktadha.
lexical_decisions:
- source_word: וַיָּקָם
  choice: akasimama
  rationale: Kitenzi קום hapa kinaonyesha Ezra akisimama ili kulihutubia kusanyiko; “akasimama” ni Kiswahili cha kawaida kinachohifadhi tendo hilo la hadharani.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Ni cheo kinachomtambulisha Ezra; muundo “Ezra kuhani” ni wa asili na wenye heshima katika Kiswahili.
- source_word: מְעַלְתֶּם
  choice: mmekosa uaminifu
  rationale: מעל humaanisha kuvunja uaminifu, hasa katika uhusiano wa agano. “Mmekosa uaminifu” hudumisha uzito wa kimaadili na wa kiagano bila kutumia istilahi ngumu.
- source_word: וַתֹּשִׁיבוּ
  choice: kwa kuwachukua ... kuwa wake
  rationale: Hifili ya ישב ni kihalisi “kuwafanya wakae,” lakini katika muktadha huu inahusu kuwaingiza wanawake hao nyumbani katika uhusiano wa ndoa. Tafsiri hii inaeleza maana ya kimuktadha bila kutumia neno la jumla lisilo wazi.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: wanawake wa kigeni kuwa wake
  rationale: נָשִׁים inaweza kumaanisha wanawake au wake. Maneno “wanawake wa kigeni” yanahifadhi umbo la Kiebrania, huku “kuwa wake” yakifafanua uhusiano unaokusudiwa katika sura hii.
- source_word: לְהוֹסִיף
  choice: na hivyo mmeongeza
  rationale: Kitenzi-jina hiki kinaweza kuonyesha kusudi au matokeo. “Na hivyo mmeongeza” huwasilisha matokeo ya tendo hilo kwa Kiswahili fasaha.
- source_word: אַשְׁמַת
  choice: hatia
  rationale: Katika muktadha huu אַשְׁמָה ni hali ya kuwa na hatia, si sadaka ya hatia.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina linarejelea jumuiya ya watu wa agano kwa pamoja.
theological_decisions:
- issue: Hatia ya pamoja ya jumuiya ya agano
  choice: mmeongeza hatia ya Israeli
  alternative: mmeongeza kosa la Israeli
  rationale: Kifungu kinaonyesha kwamba tendo la watu hao liliongeza hatia ya jumuiya nzima, si kosa la binafsi tu. “Hatia” huhifadhi dhana ya uwajibikaji wa pamoja bila kuipanua zaidi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku ukihifadhi uzito wa kukosa uaminifu, maana ya ndoa katika muktadha, na hatia ya Israeli kwa pamoja.
