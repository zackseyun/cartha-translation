base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/016.yaml
  text: So the sons of the exile did so. And Ezra the priest set apart men, heads of fathers’ houses according to their fathers’ houses, all of them by name; and they sat down on the first day of the tenth month to investigate the matter.
translation:
  language: sw
  text: Basi wana wa uhamisho[a] wakafanya hivyo. Ezra, kuhani, pamoja na wanaume waliokuwa wakuu wa nyumba za baba zao[c], wakajitenga[b], wote wakitajwa kwa majina yao. Wakaketi siku ya kwanza ya mwezi wa kumi ili kuchunguza jambo hilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “wana wa uhamisho,” yaani jina la pamoja la jumuiya ya watu waliokuwa uhamishoni na kurudi.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakatengwa” au “wakawekwa kando.” Kitenzi cha Kiebrania ni cha wingi na kinaweza kueleza kujitenga au kutengwa; katika muktadha huu kinaweza kurejelea Ezra pamoja na wanaume hao waliowekwa kwa ajili ya uchunguzi.
    reason: alternative_reading
  - marker: c
    text: “Nyumba za baba” ni makundi ya ukoo au jamaa yanayotokana na mababu wa upande wa kiume; “wakuu” ni viongozi wa makundi hayo.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי הַגּוֹלָה
  choice: wana wa uhamisho
  rationale: Huhifadhi kwa karibu nahau ya Kiebrania, inayolitaja kwa pamoja jumuiya ya watu waliokuwa uhamishoni na kurudi.
- source_word: וַיִּבָּדְלוּ
  choice: wakajitenga
  rationale: Nifali ya בדל ina maana ya kutengwa au kujitenga. Umbo la wingi linafaa kusomwa pamoja na Ezra na viongozi waliotajwa, huku tanbihi ikihifadhi uwezekano wa maana ya kuteuliwa au kutengwa kwa kazi.
- source_word: עֶזְרָא הַכֹּהֵן
  choice: Ezra kuhani
  rationale: Chanzo kinamtaja hapa kama kuhani tu; neno ‘mwandishi’ halijaongezwa kutoka muktadha mwingine.
- source_word: אֲנָשִׁים רָאשֵׁי הָאָבוֹת לְבֵית אֲבֹתָם
  choice: wanaume waliokuwa viongozi wa koo za mababu, kila mmoja kwa ukoo wake
  rationale: ‘Wanaume’ huwakilisha אֲנָשִׁים, na ‘koo za mababu’ hueleza muundo wa kijamii wa nyumba za baba kwa Kiswahili cha kawaida bila kuupunguza kuwa familia za nyumbani tu.
- source_word: וְכֻלָּם בְּשֵׁמוֹת
  choice: wote wakiwa wametajwa kwa majina
  rationale: Inaonyesha kwamba washiriki hao walitambuliwa mmoja mmoja kwa majina.
- source_word: וַיֵּשְׁבוּ
  choice: wakaketi
  rationale: Huhifadhi picha halisi ya ישב; katika muktadha huu kuketi kwao ni kukutana ili kufanya uchunguzi.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הָעֲשִׂירִי
  choice: Siku ya kwanza ya mwezi wa kumi
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kuwasilisha nahau ya Kiebrania ‘siku moja’ katika tarehe ya mwezi.
- source_word: לְדַרְיוֹשׁ הַדָּבָר
  choice: ili kulichunguza jambo hilo
  rationale: דרש hapa humaanisha kutafuta habari kwa makini au kufanya uchunguzi wa jambo la kiutawala.
theological_decisions:
- issue: Ni nani anayefanya tendo la וַיִּבָּדְלוּ, na tendo hilo lina maana gani?
  choice: Ezra na viongozi ‘wakajitenga.’
  alternative: Ezra aliwatenga au aliwateua viongozi.
  rationale: Kitenzi cha Kiebrania ni cha wingi na katika Nifali, hivyo kinaweza kumhusisha Ezra pamoja na wanaume kama wahusika waliojitenga au waliotengwa. Tafsiri ya ‘Ezra aliwateua’ hulifanya tendo kuwa la Ezra peke yake na kulibadili kuwa kausativi bila ishara wazi katika umbo la kitenzi. Tanbihi inahifadhi maana inayowezekana katika muktadha wa uteuzi wa wajumbe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Koo za mababu’ limetumiwa kueleza kitengo cha kijamii cha בית אבות bila usemi mgumu wa moja kwa moja ‘nyumba za baba.’ Sentensi imepangwa upya kidogo ili tarehe na kusudi la kikao visomeke kwa kawaida.
