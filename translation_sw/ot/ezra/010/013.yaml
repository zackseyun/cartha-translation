  text: אֲבָ֞ל הָ/עָ֥ם רָב֙ וְ/הָ/עֵ֣ת גְּשָׁמִ֔ים וְ/אֵ֥ין כֹּ֖חַ לַ/עֲמ֣וֹד בַּ/ח֑וּץ וְ/הַ/מְּלָאכָ֗ה לֹֽא לְ/י֤וֹם אֶחָד֙ וְ/לֹ֣א לִ/שְׁנַ֔יִם כִּֽי הִרְבִּ֥ינוּ לִ/פְשֹׁ֖עַ בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/013.yaml
  text: But the people are many[a], and it is the rainy season, and there is no strength to stand outside. And the work is not for one day or for two[c][b], for we have greatly transgressed in this matter.
translation:
  language: sw
  text: Lakini watu ni wengi, na huu ni wakati wa mvua, wala hatuwezi kusimama nje. Na kazi hii si ya siku moja wala mbili,[a] kwa maana tumekosa sana katika jambo hili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kazi hii haiwezi kufanywa kwa siku moja au mbili.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tumetenda uasi sana katika jambo hili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Lakini
  rationale: Inaonyesha tofauti na pendekezo la mstari uliotangulia kwa Kiswahili cha kawaida na chenye heshima.
- source_word: הָעָם רָב
  choice: watu ni wengi
  rationale: Inahifadhi muundo na maana ya kivumishi רָב kinachoeleza wingi wa kusanyiko.
- source_word: וְהָעֵת גְּשָׁמִים
  choice: huu ni wakati wa mvua
  rationale: Ni tafsiri ya asili ya Kiswahili kwa Kiebrania 'wakati wa mvua,' bila kulazimisha maana nyembamba ya msimu rasmi.
- source_word: וְאֵין כֹּחַ לַעֲמֹד בַּחוּץ
  choice: wala hatuwezi kusimama nje
  rationale: Muundo wa uwezo ni wa kawaida zaidi katika Kiswahili na unaonyesha kutoweza kustahimili kukaa nje katika mvua.
- source_word: וְהַמְּלָאכָה
  choice: kazi hii
  rationale: Neno hili linamaanisha shughuli au jukumu la kushughulikia jambo hilo, si lazima kazi ya mikono.
- source_word: לֹא לְיוֹם אֶחָד וְלֹא לִשְׁנַיִם
  choice: si ya siku moja wala mbili
  rationale: Inafuata kwa karibu muundo wa Kiebrania huku ikieleweka kuwa kazi hiyo haiwezi kumalizika haraka.
- source_word: כִּי הִרְבִּינוּ לִפְשֹׁעַ
  choice: kwa maana tumefanya kosa kubwa
  rationale: Hiphil ya רבה pamoja na פשע huonyesha ukubwa au wingi wa kukosa. Kiswahili hiki ni cha asili na huhifadhi uzito wa tendo, ingawa 'tumekosa sana' pia inawezekana.
- source_word: בַּדָּבָר הַזֶּה
  choice: katika jambo hili
  rationale: Ni usemi wa kawaida wa Kiswahili unaorejelea suala linalozungumziwa.
theological_decisions:
- issue: Asili ya kosa linaloelezwa na לִפְשֹׁעַ
  choice: tumefanya kosa kubwa
  alternative: tumekosa sana; tumetenda uasi mkubwa
  rationale: Tafsiri inahifadhi uzito wa ukiukaji bila kufafanua zaidi aina yake ya kiteolojia au kuingiza dhana ya uasi wa kisiasa ambayo muktadha haulazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa wasomaji wa kawaida; ‘wala’ na ‘kwa maana’ hudumisha mtiririko rasmi wa simulizi bila kuwa wa kizamani.
