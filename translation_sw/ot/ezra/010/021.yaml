translation:
  language: sw
  text: 'Na miongoni mwa wana wa Harimu[a]: Maaseya, Eliya, Shemaya, Yehieli na Uzia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na kutoka kwa wana wa Harimu.” Muundo wa Kiebrania unaonyesha kwamba hili ni kundi jingine la familia katika orodha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Na miongoni mwa wazao wa
  rationale: Muundo huu unaunganisha kifungu na orodha iliyotangulia na kuonyesha watu waliochaguliwa kutoka katika kundi la ukoo. ‘Wazao’ hapa huwasilisha maana ya kifamilia ya בְּנֵי kwa Kiswahili cha kawaida.
- source_word: חָרִם
  choice: Harimu
  rationale: Jina la mtu au ukoo limeandikwa kwa namna inayofaa matamshi na mazoea ya majina ya Biblia katika Kiswahili.
- source_word: מַעֲשֵׂיָה
  choice: Maaseya
  rationale: Uhawilishaji wa jina la Kiebrania kwa umbo linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: וְ/אֵלִיָּה
  choice: Eliya
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili; kiunganishi chake kimewakilishwa katika mtiririko wa orodha.
- source_word: וּֽ/שְׁמַֽעְיָה
  choice: Shemaya
  rationale: Uhawilishaji unaofuata kwa karibu jina la Kiebrania huku ukibaki rahisi kusoma kwa Kiswahili.
- source_word: וִ/יחִיאֵל
  choice: Yehieli
  rationale: Uhawilishaji unaohifadhi mwanzo wa Kiebrania ‘Y’ na kutoa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: וְ/עֻזִיָּה
  choice: Uzia
  rationale: Umbo la jina linalotumika na kutambulika kwa urahisi katika Biblia za Kiswahili.
