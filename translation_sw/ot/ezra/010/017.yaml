  text: And they finished with all the men who had taken foreign wives by the first day of the first month[a].
translation:
  language: sw
  text: Nao wakamaliza kushughulikia wanaume wote waliokuwa wameoa wanawake wa kigeni kufikia siku ya kwanza ya mwezi wa kwanza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi siku ya kwanza ya mwezi wa kwanza.” Usemi wa wakati katika Kiebrania unaweza kutafsiriwa kwa njia zote mbili; maandishi makuu yanatumia “kufikia” kuonyesha tarehe ambayo uchunguzi ulikuwa umekamilika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ
  choice: wakamaliza
  rationale: Kitenzi מן כלה kinaonyesha kukamilika kwa mchakato uliotajwa katika muktadha; “wakamaliza” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: בַכֹּל אֲנָשִׁים
  choice: kushughulikia kesi za wanaume wote
  rationale: Muundo wa Kiebrania unaonyesha kukamilisha shughuli kuhusu jumla ya wanaume waliohusika. Neno “kesi” linafafanua kwa kiasi kinachohitajika mchakato wa uchunguzi wa muktadha bila kudai kwamba lilitajwa wazi katika mstari huu.
- source_word: הַהֹשִׁיבוּ
  choice: waliokuwa wameoa
  rationale: Kwa maana halisi ni “waliowafanya wakae,” lakini katika muktadha huu ni nahau ya kuwaingiza wanawake nyumbani kama wake. “Walikuwa wameoa” huwasilisha maana ya kindoa kwa Kiswahili cha asili.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: wanawake wa kigeni
  rationale: Nָשִׁים inaweza kumaanisha wanawake au wake; kwa kuwa kitenzi tayari kimetafsiriwa “wameoa,” “wanawake wa kigeni” huepuka kurudia neno “wake” na kuhifadhi maelezo ya asili yao ya nje.
- source_word: עַד יוֹם אֶחָד
  choice: kufikia siku ya kwanza
  rationale: עַד huweka mpaka wa wakati. “Kufikia” huonyesha kwa ufasaha tarehe ambayo kazi ilikuwa imekamilika, huku uwezekano wa “hadi” ukihifadhiwa katika tanbihi.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: ya mwezi wa kwanza
  rationale: Ni usemi wa moja kwa moja wa tarehe na huhifadhi rejeo la kalenda bila kuongeza jina la mwezi lisilotajwa katika mstari.
