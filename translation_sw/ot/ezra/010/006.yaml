base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/006.yaml
  text: Then Ezra rose from before the house of God and went to the chamber of Jehohanan son of Eliashib[a]. He went there and ate no bread and drank no water[c][b], because he was mourning over the unfaithfulness of the exiles.
translation:
  language: sw
  text: Kisha Ezra akainuka kutoka mbele ya nyumba ya Mungu, akaenda katika chumba cha Yehohanani mwana wa Eliashibu.[a] Akaenda huko; hakula mkate wala hakunywa maji, kwa maana alikuwa akiomboleza kwa sababu ya ukosefu wa uaminifu wa watu wa uhamisho.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yohanani mwana wa Eliashibu.”
    reason: lexical_alternative
  - marker: b
    text: “Ukosefu wa uaminifu” unaweza pia kutafsiriwa “usaliti” au “kutokuwa waaminifu.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, jumuiya ya watu waliorudi kutoka uhamishoni.
    reason: cultural_note
lexical_decisions:
- source_word: מִלִּפְנֵי בֵּית הָאֱלֹהִים
  choice: kutoka mbele ya nyumba ya Mungu
  rationale: Inahifadhi usemi wa mahali wa Kiebrania na neno halisi ‘nyumba ya Mungu’ bila kuufasiri moja kwa moja kuwa ‘hekalu.’
- source_word: לִשְׁכַּת
  choice: chumba
  rationale: Neno hili humaanisha chumba katika jengo la hekalu au jengo rasmi; ‘chumba’ ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: יְהוֹחָנָן בֶּן אֶלְיָשִׁיב
  choice: Yehohanani mwana wa Eliashibu
  rationale: Majina yamenukuliwa kwa namna inayokaribia maumbo ya Kiebrania huku yakifuata matamshi ya kawaida ya Kiswahili.
- source_word: וַיֵּלֶךְ שָׁם
  choice: Akaenda huko
  rationale: Inadumisha urudiaji wa kitenzi ‘akaenda’ na hali ya ghafla ya kishazi bila kuongeza kwamba aliingia au alikaa huko.
- source_word: לֶחֶם לֹא אָכַל וּמַיִם לֹא שָׁתָה
  choice: hakula mkate wala kunywa maji
  rationale: Inahifadhi vitu vilivyotajwa wazi, mkate na maji, na kutoa usemi wa kawaida wa Kiswahili unaoonyesha kufunga kabisa.
- source_word: מִתְאַבֵּל
  choice: alikuwa akiomboleza
  rationale: Kitenzi kinaonyesha hali endelevu ya maombolezo, ambayo katika muktadha huu inaambatana na kutokula wala kunywa.
- source_word: מַעַל
  choice: hawakuwa waaminifu
  rationale: Muundo wa kishazi cha Kiswahili huepuka utata wa kisarufi wa ‘ukosefu wa uaminifu wa’ huku ukihifadhi wazo la kuvunja uaminifu wa agano.
- source_word: הַגּוֹלָה
  choice: watu waliotoka uhamishoni
  rationale: Katika Ezra, neno hili linaitaja jumuiya ya waliokuwa uhamishoni na waliorudi; tafsiri hii inaweka maana hiyo wazi kwa msomaji wa sasa.
theological_decisions:
- issue: Maana ya מַעַל katika muktadha wa kuvunja uaminifu wa agano
  choice: hawakuwa waaminifu
  alternative: walifanya usaliti / walikosa uaminifu
  rationale: ‘Hawakuwa waaminifu’ huhifadhi uzito wa kimaadili na wa kiagano bila kulifanya neno hilo kuwa kosa la kisheria tu au kuingiza tafsiri ya kimadhehebu.
- issue: Iwapo בֵּית הָאֱלֹהִים itafsiriwe kihalisi au ifafanuliwe kuwa hekalu
  choice: nyumba ya Mungu
  alternative: hekalu la Mungu
  rationale: Usemi wa chanzo unaeleweka katika Kiswahili na unadumisha taswira yake; hakuna ulazima wa kuubadili kuwa ‘hekalu.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa ‘akaenda’ umehifadhiwa kwa sababu upo katika Kiebrania; ‘lakini’ husaidia kuunganisha kwa kawaida kufika kwake na kufunga kwake bila kubadili maana.
