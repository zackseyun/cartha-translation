base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/012.yaml
  text: Then all the assembly answered and said with a loud voice[a], “Yes, according to your words, so it is upon us to do.”
translation:
  language: sw
  text: Ndipo kusanyiko lote likajibu kwa sauti kubwa[a], likisema, “Ndiyo, kama ulivyosema, ndivyo tunavyopaswa kufanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa mtiririko mwingine wa maneno, “Ndiyo, kama ulivyosema, ni wajibu wetu kufanya hivyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: likajibu
  rationale: Kitenzi ענה hapa kinaanzisha jibu la kusanyiko kwa agizo lililotangulia; “likajibu” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: כָל הַקָּהָל
  choice: kusanyiko lote
  rationale: קָהָל ni jumuiya iliyokusanyika. “Kusanyiko lote” huhifadhi maana ya kundi zima lililokutana bila kuingiza maana maalumu ya kidhehebu.
- source_word: וַיֹּאמְרוּ
  choice: likisema
  rationale: אָמַר ni kitenzi cha kawaida cha kusema. Umbo “likisema” huunganisha kwa Kiswahili fasaha mlolongo wa Kiebrania wa kujibu na kusema bila kuacha tendo la pili.
- source_word: קוֹל גָּדוֹל
  choice: kwa sauti kubwa
  rationale: Tafsiri hii ya kawaida huhifadhi taswira halisi ya Kiebrania, ‘sauti kubwa,’ na kusisitiza jibu la hadharani la kusanyiko.
- source_word: כֵּן
  choice: Ndiyo ... ndivyo
  rationale: כֵּן inaonyesha kukubali pendekezo na pia inachangia muundo wa ‘kama ... ndivyo’; Kiswahili hiki huhifadhi uthibitisho na msisitizo bila kuwa kigumu.
- source_word: כִדְבָרֶיךָ
  choice: kama ulivyosema
  rationale: Ingawa kihalisi ni ‘kulingana na maneno yako,’ “kama ulivyosema” ni usemi wa asili wa Kiswahili unaowasilisha maana ileile.
- source_word: עָלֵינוּ לַעֲשׂוֹת
  choice: tunavyopaswa kufanya
  rationale: עָלֵינוּ huonyesha wajibu uliowakalia wasemaji. “Tunavyopaswa kufanya” hutoa maana hiyo kwa Kiswahili cha sasa na fasaha, huku לַעֲשׂוֹת ikitafsiriwa moja kwa moja kuwa “kufanya.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa Kiebrania ‘wakajibu wakasema’ umewekwa kwa namna ya asili zaidi, ‘likajibu ... likisema,’ na wajibu unaodokezwa na עָלֵינוּ umeelezwa bila kuongeza tafsiri ya kidhehebu.
