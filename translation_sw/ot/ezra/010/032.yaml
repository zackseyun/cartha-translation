lexical_decisions:
- source_word: בְּנְיָמִן
  choice: Binyamini
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya Kiebrania huku likipewa umbo linalotamkika kwa kawaida katika Kiswahili. Herufi ya mwisho -i inaendana na mazoea ya Kiswahili katika jina hili.
- source_word: מַלּוּךְ
  choice: Maluki
  rationale: Jina la mtu limetoholewa moja kwa moja; konsonanti maradufu haijahifadhiwa kwa kuwa si ya lazima katika tahajia ya kawaida ya Kiswahili, na sauti ya mwisho imetolewa kwa umbo la Kiswahili -ki.
- source_word: שְׁמַרְיָה
  choice: Shemaria
  rationale: Jina la mtu limetoholewa kwa umbo linaloeleweka na kutamkika kwa urahisi katika Kiswahili, bila kuligeuza kuwa maana ya jina.
