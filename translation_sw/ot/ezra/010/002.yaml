  text: וַ/יַּעַן֩ שְׁכַנְיָ֨ה בֶן יְחִיאֵ֜ל מִ/בְּנֵ֤י עולם וַ/יֹּ֣אמֶר לְ/עֶזְרָ֔א אֲנַ֨חְנוּ֙ מָעַ֣לְנוּ בֵ/אלֹהֵ֔י/נוּ וַ/נֹּ֛שֶׁב נָשִׁ֥ים נָכְרִיּ֖וֹת מֵ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/עַתָּ֛ה יֵשׁ מִקְוֶ֥ה לְ/יִשְׂרָאֵ֖ל עַל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/002.yaml
  text: Then Shecaniah son of Jehiel[a], from the sons of Elam, answered and said to Ezra, “We have acted unfaithfully against our God and have married foreign women from the peoples of the land[c][b]. Yet now there is hope for Israel concerning this.
translation:
  language: sw
  text: Ndipo Shekania mwana wa Yehieli, mmoja wa wazao wa Elamu, akamjibu Ezra, “Tumekosa uaminifu kwa Mungu wetu kwa kuwaoa wanawake wageni kutoka kwa mataifa ya nchi[a]. Lakini sasa kuna tumaini kwa Israeli kuhusu jambo hili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Tumekosa uaminifu kwa Mungu wetu na tumewachukua wanawake wageni kutoka kwa mataifa ya nchi kuwa wake.”'
    reason: Huhifadhi kwa uwazi zaidi muundo wa Kiebrania wa kuchukua wanawake katika hali ya ndoa.
lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Kitenzi cha kawaida cha masimulizi kinachoonyesha kuitikia; katika Kiswahili, ‘akamjibu’ pia huunganisha kwa kawaida fomula ya Kiebrania ‘akajibu na kusema’ bila urudiaji mzito.
- source_word: שְׁכַנְיָה בֶן יְחִיאֵל
  choice: Shekania mwana wa Yehieli
  rationale: Majina yamenukuliwa kwa namna inayofaa matamshi na tahajia ya Kiswahili, huku uhusiano wa kifamilia ukihifadhiwa wazi.
- source_word: מִבְּנֵי עוֹלָם
  choice: mmoja wa wazao wa Elamu
  rationale: Neno בְּנֵי hapa linatambulisha ukoo, si wana wa moja kwa moja; ‘wazao’ ni wazi na la kawaida kwa Kiswahili.
- source_word: מָעַלְנוּ בֵאלֹהֵינוּ
  choice: Tumekosa uaminifu kwa Mungu wetu
  rationale: מעל huonyesha kuvunja uaminifu, hasa katika uhusiano na Mungu. ‘Tumekosa uaminifu’ huhifadhi uzito huo kuliko neno la jumla ‘tumetenda dhambi’.
- source_word: וַנֹּשֶׁב נָשִׁים נָכְרִיּוֹת
  choice: kwa kuwaoa wanawake wageni
  rationale: Katika muktadha huu, kitenzi kina maana ya kuwachukua wanawake kuwa wake. ‘Kuwaoa’ ni Kiswahili cha kawaida na sahihi, huku ‘wanawake wageni’ kikihifadhi nomino ya Kiebrania bila kuibadili kuwa ‘wake’.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: kutoka kwa mataifa ya nchi hii
  rationale: ‘Mataifa’ huhifadhi wingi wa עַמִּים na maana ya makundi ya watu; ‘nchi hii’ ni namna ya asili ya kueleza הָאָרֶץ katika muktadha huu.
- source_word: וְעַתָּה יֵשׁ מִקְוֶה
  choice: Lakini hata sasa bado kuna tumaini
  rationale: Kauli hii inaonyesha mgeuko kutoka ungamo kwenda uwezekano wa kurekebisha hali. ‘Hata sasa bado’ huwasilisha tumaini linalobaki licha ya kosa bila kulifafanua kupita maandishi.
- source_word: עַל זֹאת
  choice: kuhusu jambo hili
  rationale: ‘Kuhusu jambo hili’ hufuata maana ya msingi ya עַל זֹאת na kuacha wazi hasa tumaini hilo linahusianaje na hali iliyotajwa.
theological_decisions:
- issue: Uzito wa kiagano wa מָעַלְנוּ
  choice: Tumekosa uaminifu kwa Mungu wetu
  alternative: Tumetenda dhambi dhidi ya Mungu wetu; tumemsaliti Mungu wetu
  rationale: Chaguo hili huhifadhi wazo la kuvunja uaminifu kwa Mungu bila kupunguza maana kuwa dhambi kwa ujumla wala kuongeza lugha kali zaidi kuliko ilivyo lazima.
- issue: Utambulisho wa נָשִׁים נָכְרִיּוֹת
  choice: wanawake wageni
  alternative: wake wageni
  rationale: Nomino yenyewe ni ‘wanawake,’ huku kitenzi kikionyesha ndoa. Hivyo tafsiri huhifadhi tofauti hiyo na haiongezi madai ya kitheolojia kuhusu ukabila zaidi ya maandishi.
- issue: Maana ya tumaini katika עַל זֹאת
  choice: kuna tumaini kwa Israeli kuhusu jambo hili
  alternative: kuna tumaini kwa Israeli licha ya jambo hili
  rationale: ‘Kuhusu’ huhifadhi uhusiano mpana na wenye kiasi fulani cha utata wa עַל, bila kuamua kimya kimya kwamba maana ni ‘licha ya’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Fomula ya Kiebrania ‘akajibu na kusema’ imewasilishwa kwa ‘akamjibu’ ili kuepuka urudiaji usio wa kawaida, huku mtiririko wa masimulizi ukihifadhiwa. Alama ya tanbihi [a] imewekwa baada ya kishazi inachokifafanua.
