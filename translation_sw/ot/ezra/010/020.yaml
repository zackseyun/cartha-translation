- source_word: וּ/מִ/בְּנֵי
  choice: Na kutoka kwa wana wa
  rationale: Muundo huu unahifadhi kiunganishi, kihusishi, na neno la ukoo linalotambulisha kundi jingine katika orodha. “Wana wa” ni wa kawaida katika orodha za nasaba na koo, bila kupanua maana waziwazi kuwa “wazao wa.”
- source_word: אִמֵּר
  choice: Imeri
  rationale: Jina la ukoo wa kikuhani limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: חֲנָנִי
  choice: Hanani
  rationale: Jina la mtu limetoholewa moja kwa moja kwa tahajia inayofaa Kiswahili.
- source_word: וּ/זְבַדְיָה
  choice: na Zebadia
  rationale: Kiunganishi kilichotangulizwa katika Kiebrania kimehifadhiwa, na jina limetoholewa kwa umbo linalosomeka kwa Kiswahili.
