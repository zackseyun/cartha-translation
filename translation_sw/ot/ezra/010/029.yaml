  yaml_path: translation/ot/ezra/010/029.yaml
  text: 'And from the sons of Bani: Meshullam[a], Malluk, Adaiah, Jashub, Sheal[b], and Jeremoth.'
translation:
  language: sw
  text: 'Na kutoka kwa wana wa Bani: Meshulamu, Maluki[a], Adaya, Yashubu, Sheali, na Yeremothi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika baadhi ya tafsiri za Kiingereza, jina hili huandikwa Malluch.
    reason: lexical_alternative
  - marker: b
    text: Jina Yeremothi huenda likaonyesha uwekaji tofauti wa vokali au umbo jingine la jina katika baadhi ya mapokeo.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Na kutoka kwa wana wa
  rationale: Muundo huu unawakilisha kiunganishi, kihusishi, na wingi wa neno ‘mwana’ katika hali ya kutegemea. Katika orodha hii, ‘kutoka kwa wana wa’ hutambulisha watu wa ukoo huo huku ikihifadhi lugha rasmi ya nasaba.
- source_word: בָּנִי
  choice: Bani
  rationale: Ni jina la mtu au ukoo; limenukuliwa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: מְשֻׁלָּם
  choice: Meshulamu
  rationale: Ni jina la mtu; umbo hili linafuata matamshi ya Kiebrania kwa namna ya kawaida na inayosomeka katika Kiswahili.
- source_word: מַלּוּךְ
  choice: Maluki
  rationale: Ni jina la mtu. ‘Maluki’ linaakisi kwa karibu umbo la Kiebrania na linafaa kimatamshi katika Kiswahili; tofauti ya tahajia imetajwa katika tanbihi.
- source_word: וַ/עֲדָיָה
  choice: Adaya
  rationale: Kiunganishi na jina la mtu. Katika orodha ya Kiswahili, viunganishi vya Kiebrania havihitaji kurudiwa kwa kila jina.
- source_word: יָשׁוּב
  choice: Yashubu
  rationale: Ni jina la mtu; umbo hili linafuata vokali za mapokeo ya Kimasora na kanuni za uandishi wa majina kwa Kiswahili.
- source_word: וּ/שְׁאָל
  choice: Sheali
  rationale: Kiunganishi na jina la mtu. ‘Sheali’ linafuata vokali za maandishi ya Kimasora na linaweza kutamkwa kwa urahisi katika Kiswahili.
- source_word: ירמות
  choice: Yeremothi
  rationale: Katika muktadha huu jina limesomwa ‘Yeremothi’ kwa kufuata mapokeo makuu ya orodha hii. Kwa kuwa konsonanti zinaweza kupewa vokali kwa namna nyingine, uwezekano huo umehifadhiwa katika tanbihi.
