translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi na wenye heshima unaofaa orodha ya majina. Majina yameandikwa kwa maumbo yanayotamkika kiasili katika Kiswahili, huku tanbihi zikihifadhi tofauti halisi za umbo la majina. Alama za tanbihi zimewekwa baada ya majina yanayohusika.
