  text: וַ/יָּ֣קָם עֶזְרָ֡א וַ/יַּשְׁבַּ֣ע אֶת שָׂרֵי֩ הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם וְ/כָל יִשְׂרָאֵ֗ל לַ/עֲשׂ֛וֹת כַּ/דָּבָ֥ר הַ/זֶּ֖ה וַ/יִּשָּׁבֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/005.yaml
  text: So Ezra arose and made the chief priests[a], the Levites, and all Israel swear to do according to this word, and they swore.
translation:
  language: sw
  text: Ndipo Ezra akasimama, akawaapisha viongozi wa makuhani, Walawi, na Israeli wote wafanye kulingana na jambo hili[a]; nao wakaapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na neno hili” au “kulingana na pendekezo hili.” Neno la Kiebrania linaweza kumaanisha neno lililosemwa au jambo linalozungumziwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akasimama
  rationale: Kitenzi קום katika mfuatano wa simulizi kinaonyesha Ezra kuinuka ili kuchukua hatua; “akasimama” ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: וַיַּשְׁבַּע
  choice: akawaapisha
  rationale: Hifili ya שׁבע ina maana ya kuwasababisha wengine waape; “akawaapisha” huhifadhi maana hiyo ya kisababishi kwa ufupi.
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: viongozi wa makuhani
  rationale: שָׂרֵי humaanisha wakuu au viongozi; hapa ni viongozi walio miongoni mwa makuhani, na tafsiri hii huepuka kuingiza cheo maalumu kisicholazimishwa na maandishi.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la Walawi.
- source_word: וְכָל יִשְׂרָאֵל
  choice: na Israeli wote
  rationale: Huhifadhi usemi wa pamoja wa Kiebrania “Israeli wote” badala ya kuubadili kuwa jina la watu mmoja mmoja.
- source_word: לַעֲשׂוֹת
  choice: wafanye
  rationale: עשה ni kitenzi kipana cha kufanya; “wafanye” ni cha moja kwa moja na kinaendana na kiapo.
- source_word: כַּדָּבָר הַזֶּה
  choice: kulingana na jambo hili
  rationale: דָּבָר inaweza kumaanisha neno, jambo, au pendekezo. Katika muktadha huu inarejelea jambo lililopendekezwa hapo awali; tanbihi huhifadhi uwezekano wa “neno hili.”
- source_word: וַיִּשָּׁבֵעוּ
  choice: nao wakaapa
  rationale: Nifali ya שׁבע inaeleza jibu lao la moja kwa moja; marudio ya mzizi wa kiapo yamehifadhiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi wenye “aka-” huhifadhi mwendo wa matukio, huku “akawaapisha … nao wakaapa” ukihifadhi marudio na uzito wa kiapo katika Kiebrania.
