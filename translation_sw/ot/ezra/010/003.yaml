base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/003.yaml
  text: So now let us make a covenant with our God to send away all the women and what has been born from them, according to the counsel of my lord and of those who tremble at the commandment of our God; and let it be done according to the law.
translation:
  language: sw
  text: Basi sasa tufanye agano na Mungu wetu kwamba tuwaondoe wanawake wote pamoja na watoto waliozaliwa na wanawake hao, kwa shauri la bwana wangu na la wale wanaotetemeka kwa sababu ya amri ya Mungu wetu; na jambo hilo lifanywe kulingana na Sheria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִכְרָת בְּרִית
  choice: tufanye agano
  rationale: Nahau ya Kiebrania kwa maana halisi ni ‘tukate agano,’ lakini Kiswahili cha kawaida na chenye hadhi husema ‘kufanya agano.’
- source_word: לְהוֹצִיא
  choice: tutawafukuza
  rationale: Katika muktadha huu kitenzi kina maana ya kuwaondoa au kuwaacha waende; ‘kuwafukuza’ huonyesha hatua inayokusudiwa bila kuifanya kuwa talaka kwa tafsiri yenyewe.
- source_word: כָל נָשִׁים
  choice: wanawake wote
  rationale: Chanzo kinasema ‘wanawake,’ si moja kwa moja ‘wake’; uchaguzi huu unahifadhi upana wa usemi wa Kiebrania.
- source_word: וְהַנּוֹלָד מֵהֶם
  choice: pamoja na watoto waliozaliwa nao
  rationale: Nomino ya mkusanyiko ya kile ‘kilichozaliwa kutoka kwao’ inarejelea watoto katika muktadha; ‘nao’ ni Kiswahili cha asili kinachoonyesha uzazi wao.
- source_word: אֲדֹנָי
  choice: bwana wangu
  rationale: Umbo lenye kiambishi cha nafsi ya kwanza hapa linaeleweka kama heshima kwa kiongozi wa kibinadamu, tofauti na jina la Mungu; herufi ndogo zinadumisha tofauti hiyo.
- source_word: הַחֲרֵדִים
  choice: wale wanaotetemeka
  rationale: Tafsiri ya karibu huhifadhi nguvu ya neno linaloeleza hofu yenye unyenyekevu na uzito mbele ya amri ya Mungu.
- source_word: כַתּוֹרָה
  choice: kulingana na Sheria
  rationale: ‘Sheria’ linafaa hapa kwa torah kama mwongozo wenye mamlaka, na herufi kubwa inaonyesha Sheria inayorejelewa katika muktadha wa Ezra.
theological_decisions:
- issue: Utambulisho wa אֲדֹנָי
  choice: bwana wangu
  alternative: Bwana
  rationale: Uakifishaji wa WLC na muktadha vinaunga mkono kumrejelea Ezra au kiongozi wa kibinadamu; tafsiri haipaswi kuubadili usemi huu kuwa jina la Mungu.
- issue: Maana ya ‘wanawake’
  choice: wanawake wote
  alternative: wake wote wa kigeni
  rationale: Ingawa muktadha mpana unawahusu wake wa kigeni, aya hii yenyewe haisemi kivumishi ‘wa kigeni’; tafsiri inahifadhi maneno ya chanzo bila kuingiza ufafanuzi wa muktadha ndani ya maandishi.
- issue: Wahusika wa shauri
  choice: shauri la bwana wangu na la wale wanaotetemeka
  alternative: shauri la bwana wangu, akisaidiwa na wale wanaotetemeka
  rationale: Muundo wa Kiebrania unaweza kuhusisha ‘wale wanaotetemeka’ na shauri hilo; tafsiri inahifadhi uratibu rahisi badala ya kuamua kwa undani uhusiano wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa kwa urahisi wa usomaji huku uratibu wa chanzo ukihifadhiwa. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zilizoongezwa.
