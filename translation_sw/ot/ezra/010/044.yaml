  text: Wote hawa walikuwa wameoa wanawake wa kigeni, na baadhi yao walikuwa na wake waliokuwa wamezaa watoto.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa karibu zaidi: “na miongoni mwao walikuwapo wake, nao waliweka wana.” Mwisho wa mstari huu katika Kiebrania ni mfupi na maana yake si wazi kabisa.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana”; hapa limetafsiriwa “watoto” kwa sababu katika muktadha neno hilo linaweza kumaanisha wazao kwa ujumla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נשא/י
  choice: walikuwa wameoa
  rationale: Katika muundo huu, kitenzi נשׂא pamoja na kitu ‘wanawake’ ni nahau ya kuoa. Tafsiri hii ni ya kawaida katika Kiswahili na inaonyesha kuwa ndoa hizo zilikuwa tayari zimefanyika.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: wanawake wa kigeni
  rationale: Kirai hiki kinamaanisha wanawake waliotoka nje ya jumuiya ya watu wa Israeli. ‘Wa kigeni’ huhifadhi tofauti hiyo bila kutumia lugha ya kizamani au yenye dharau.
- source_word: וְיֵשׁ מֵהֶם
  choice: na baadhi yao
  rationale: Muundo wa uwepo יֵשׁ pamoja na מֵהֶם unaelezwa kwa Kiswahili cha kawaida kuwa ‘baadhi yao,’ huku ukitambulisha kundi dogo miongoni mwa wanaume waliotajwa.
- source_word: נָשִׁים
  choice: wake hao
  rationale: Ingawa neno lenyewe ni ‘wanawake/wake,’ hapa uhusiano wa ndoa unaifanya ‘wake’ kuwa ya asili zaidi. ‘Hao’ huunganisha kifungu hiki na wanawake wa kigeni waliotajwa mwanzoni.
- source_word: וַיָּשִׂימוּ בָּנִים
  choice: walikuwa wamepata watoto pamoja na wake hao
  rationale: Kifungu cha Kiebrania ni kifupi na kigumu; tafsiri ya neno kwa neno kama ‘waliweka wana’ haileti maana wazi katika Kiswahili. Muktadha unaonyesha kwamba baadhi ya ndoa hizo zilikuwa zimezaa watoto, huku tanbihi ikihifadhi ugumu wa muundo wa asili.
- source_word: בָּנִים
  choice: watoto
  rationale: Kwa umbo neno hili ni ‘wana,’ lakini linaweza kutumiwa kwa maana pana ya watoto au wazao. Muktadha unalenga kuwepo kwa watoto katika ndoa hizo, si lazima watoto wa kiume pekee; maana halisi zaidi imeonyeshwa katika tanbihi.
