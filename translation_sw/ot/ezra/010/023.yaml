base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/023.yaml
  text: 'And from the Levites: Jozabad[a], Shimei, Keliah (that is, Kelita), Pethahiah, Judah, and Eliezer.'
translation:
  language: sw
  text: 'Na miongoni mwa Walawi: Yozabadi, Shimei, Kelaya (yaani, Kelita), Pethahia, Yuda na Eliezeri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: Na miongoni mwa Walawi
  rationale: Huhifadhi maana ya מן kwamba watu wanaotajwa ni baadhi ya Walawi, kwa Kiswahili cha kawaida na fasaha.
- source_word: יוֹזָבָד
  choice: Yozabadi
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likifuata umbo la Kiebrania.
- source_word: וְשִׁמְעִי
  choice: Shimei
  rationale: Tahajia hii ya jina la mtu imezoeleka katika tafsiri za Kiswahili na inawakilisha umbo la Kiebrania.
- source_word: וְקֵלָיָה הוּא קְלִיטָא
  choice: Kelaya (yaani, Kelita)
  rationale: Neno הוּא linaunganisha majina haya kwa ufafanuzi; “yaani” linaonyesha kwamba Kelita ni jina au umbo jingine la jina la mtu yuleyule bila kuongeza dhana ya kuitwa kwa jina hilo katika mazingira fulani.
- source_word: פְּתַחְיָה
  choice: Pethahia
  rationale: Jina limetoholewa kwa kufuata kwa karibu konsonanti za Kiebrania na mfumo wa sauti wa Kiswahili.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Umbo la kawaida la Kiswahili la jina hili; hapa muktadha unaonyesha ni mtu, si kabila wala eneo.
- source_word: וֶאֱלִיעֶזֶר
  choice: na Eliezeri
  rationale: Hufuata umbo la Kiebrania אֱלִיעֶזֶר na kulitofautisha na Eleazari.
