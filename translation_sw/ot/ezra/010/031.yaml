translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Majina yametoholewa kwa kuzingatia maandishi ya Kiebrania na mazoea ya Kiswahili. Alama za tanbihi zimewekwa kwenye vipengele vinavyohusika moja kwa moja.
