base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/031.yaml
  text: 'And from the sons of Harim: Eliezer[a], Isshijah, Malkijah, Shemaiah[c][b], and Shimeon.'
translation:
  language: sw
  text: Na kutoka kwa wana wa Harimu:[a] Eliezeri, Yishiya,[b] Malkiya, Shemaya, na Shimeoni.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Na wana wa Harimu: Eliezeri, Yishiya, Malkiya, Shemaya, na Shimeoni,” ikiwa maneno hayo yatachukuliwa kuwa kichwa rahisi cha orodha bila kuongeza waziwazi “kutoka kwa.”'
    reason: lexical_alternative
  - marker: b
    text: Yishiya pia linaweza kutoholewa kuwa “Yeshia” au “Ishiya.”
    reason: lexical_alternative
  - marker: c
    text: Shimeoni kwa mapokeo hutajwa “Simeoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Na kutoka kwa wana wa
  rationale: Kiunganishi וּ kinaendeleza orodha, na בְנֵי ni hali ya kutegemea ya wingi wa ‘mwana.’ Katika muktadha huu majina yanataja watu waliotoka katika ukoo wa Harimu, hivyo ‘kutoka kwa wana wa’ huleta maana hiyo kwa Kiswahili cha kawaida.
- source_word: חָרִם
  choice: Harimu
  rationale: Jina la ukoo limetoholewa kwa mfumo wa kawaida wa majina ya Kiebrania katika Kiswahili.
- source_word: אֱלִיעֶזֶר
  choice: Eliezeri
  rationale: Utohozi wa jina la Kiebrania unaoeleweka na unaolingana na matumizi ya kawaida ya Kiswahili.
- source_word: יִשִּׁיָּה
  choice: Yishiya
  rationale: Utohozi huu unawakilisha kwa karibu konsonanti na vokali za maandishi ya Kiebrania; maumbo mengine yanawezekana kwa sababu ya desturi tofauti za utohozi.
- source_word: מַלְכִּיָּה
  choice: Malkiya
  rationale: Utohozi wa moja kwa moja unaowakilisha sauti ya כ kwa ‘k’ na kiambishi cha jina -יה kwa ‘-iya.’
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Utohozi wa kawaida na rahisi kusoma wa jina la Kiebrania.
- source_word: שִׁמְעוֹן
  choice: Shimeoni
  rationale: ‘Shimeoni’ huakisi sauti ya mwanzo שׁ kwa ‘sh’; ‘Simeoni’ ni umbo la mapokeo lililozoeleka.
