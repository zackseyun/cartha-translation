  text: וְ/כֹל֩ אֲשֶׁ֨ר לֹֽא יָב֜וֹא לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים כַּ/עֲצַ֤ת הַ/שָּׂרִים֙ וְ/הַ/זְּקֵנִ֔ים יָחֳרַ֖ם כָּל רְכוּשׁ֑/וֹ וְ/ה֥וּא יִבָּדֵ֖ל מִ/קְּהַ֥ל הַ/גּוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/008.yaml
  text: And everyone who does not come within three days[a], according to the counsel of the officials and the elders, all his property shall be forfeited, and he himself shall be separated from the assembly of the exiles.
translation:
  language: sw
  text: Na yeyote ambaye hatafika ndani ya siku tatu, kwa uamuzi wa maafisa na wazee, mali yake yote itawekwa wakfu kwa maangamizi[a], naye mwenyewe atatengwa na kusanyiko la watu wa uhamisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “itataifishwa,” au, “itawekwa chini ya heremu.” Kitenzi cha Kiebrania humaanisha kuweka kitu chini ya חרם (heremu), yaani marufuku au wakfu ambao unaweza kuhusisha maangamizi au utaifishaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: Na yeyote ambaye
  rationale: Huwasilisha sharti la jumla kwa Kiswahili cha kawaida huku ikihifadhi maana ya kumhusu kila mtu binafsi.
- source_word: לֹא יָבוֹא
  choice: hatafika
  rationale: Katika muktadha wa kuitikia wito, בוא humaanisha kufika au kujitokeza; wakati ujao unafaa tangazo hili la kisheria.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: katika muda wa siku tatu
  rationale: Hueleza kwa wazi muda uliowekwa wa kutii wito bila kulazimisha hesabu ya siku isiyoelezwa zaidi katika Kiebrania.
- source_word: כַּעֲצַת
  choice: kulingana na uamuzi wa
  rationale: עֵצָה inaweza kumaanisha shauri au uamuzi; hapa mamlaka ya viongozi na adhabu inayofuata zinafanya 'uamuzi' kuwa ya asili na sahihi kimuktadha.
- source_word: הַשָּׂרִים וְהַזְּקֵנִים
  choice: maafisa na wazee
  rationale: Katika mazingira ya kiutawala baada ya uhamisho, שׂרים ni maafisa, si lazima wana wa kifalme; 'wazee' ni tafsiri ya kawaida ya זקנים.
- source_word: יָחֳרַם
  choice: itawekwa wakfu kwa maangamizi
  rationale: Huhifadhi maana nzito na ya kiufundi ya חרם, yaani kuwekwa chini ya marufuku au wakfu usioweza kutenguliwa, huku tanbihi ikieleza uwezekano wa kunyang'anywa.
- source_word: כָּל רְכוּשׁוֹ
  choice: mali yake yote
  rationale: רכוש hurejelea mali au vitu anavyomiliki; 'mali' ni wazi na inafaa mazingira ya adhabu ya kisheria.
- source_word: וְהוּא יִבָּדֵל
  choice: naye mwenyewe atatengwa
  rationale: Kiwakilishi cha kusisitiza kimewakilishwa kwa 'mwenyewe,' na 'atatengwa' huhifadhi maana ya בדל bila kuingiza istilahi ya baadaye ya kidini.
- source_word: מִקְּהַל הַגּוֹלָה
  choice: na kusanyiko la watu waliokuwa uhamishoni
  rationale: קהל ni kusanyiko la jamii, na הגולה hapa ni jumuiya ya watu wa uhamisho; usemi huu ni wa kawaida kuliko kuwaita wote 'wahamishwa' huku ukihifadhi rejeo la kihistoria.
theological_decisions:
- issue: Maana ya adhabu ya חרם juu ya mali
  choice: itawekwa wakfu kwa maangamizi
  alternative: itanyang'anywa; itawekwa chini ya marufuku
  rationale: Kitenzi kina uzito wa kiufundi wa kuwekwa chini ya חרם, ambao unaweza kuhusisha maangamizi au kunyang'anywa. Tafsiri kuu huhifadhi uzito huo, na tanbihi hulinda uwezekano wa maana ya kiutawala katika muktadha huu.
- issue: Hali ya kutengwa na jumuiya
  choice: atatengwa na kusanyiko
  alternative: ataondolewa katika jumuiya; atafukuzwa
  rationale: Andiko linataja kutengwa na kusanyiko bila kufafanua taratibu za baadaye za kidini; kwa hiyo 'atatengwa' huhifadhi kauli na mvutano wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kisheria wa tangazo umehifadhiwa; istilahi za kimadhehebu zimeepukwa.
