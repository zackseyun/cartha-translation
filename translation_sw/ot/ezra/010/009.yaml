  to: Basi wanaume wote wa Yuda na Benyamini wakakusanyika Yerusalemu ndani ya siku hizo tatu[a]. Ilikuwa mwezi wa tisa, siku ya ishirini ya mwezi huo. Watu wote wakaketi katika uwanja wa wazi wa nyumba ya Mungu[b], wakitetemeka kwa sababu ya jambo hilo na kwa sababu ya mvua.
