  text: וַ/יִּקָּבְצ֣וּ כָל אַנְשֵֽׁי יְהוּדָה֩ וּ/בִנְיָמִ֨ן יְרוּשָׁלִַ֜ם לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים ה֛וּא חֹ֥דֶשׁ הַ/תְּשִׁיעִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ וַ/יֵּשְׁב֣וּ כָל הָ/עָ֗ם בִּ/רְחוֹב֙ בֵּ֣ית הָ/אֱלֹהִ֔ים מַרְעִידִ֥ים עַל הַ/דָּבָ֖ר וּ/מֵ/הַ/גְּשָׁמִֽים־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/009.yaml
  text: So all the men of Judah and Benjamin gathered in Jerusalem within the three days[a]. It was the ninth month, on the twentieth day of the month. And all the people sat in the open square of the house of God[c][b], trembling because of this matter and because of the heavy rain.
translation:
  language: sw
  text: Basi wanaume wote wa Yuda na Benyamini wakakusanyika Yerusalemu ndani ya siku hizo tatu[a]. Ilikuwa mwezi wa tisa, siku ya ishirini ya mwezi huo. Watu wote wakaketi katika uwanja wa wazi wa nyumba ya Mungu[b], wakitetemeka kwa sababu ya jambo hilo na kwa sababu ya mvua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakajikusanya.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika uwanja ulio mbele ya nyumba ya Mungu.” Kiebrania kinamaanisha eneo pana la wazi, si lazima ua wa ndani wa hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: wakakusanyika
  rationale: Nifali ya קבץ inaeleza kukusanyika; kitenzi hiki ni cha kawaida na cha asili katika Kiswahili.
- source_word: כָל אַנְשֵׁי יְהוּדָה וּבִנְיָמִן
  choice: watu wote wa Yuda na Benyamini
  rationale: Ingawa אַנְשֵׁי ni ya kiume kisarufi na kihalisia inaweza kumaanisha wanaume, Kiswahili cha kawaida hutumia 'watu wa' kwa kundi; tanbihi inahifadhi uwezekano wa wanaume au wawakilishi wa kiume.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: kabla ya siku hizo tatu kuisha
  rationale: Hufafanua kwa Kiswahili cha asili kuwa walitimiza agizo ndani ya muda wa siku tatu uliokuwa umetangazwa.
- source_word: הוּא חֹדֶשׁ הַתְּשִׁיעִי בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: Ilikuwa mwezi wa tisa, siku ya ishirini ya mwezi huo
  rationale: Huhifadhi taarifa ya kalenda kwa muundo wa tarehe unaoeleweka katika Kiswahili.
- source_word: וַיֵּשְׁבוּ
  choice: wakaketi
  rationale: ישׁב hapa ina maana ya kuketi; 'wakaketi' inafaa mfuatano wa masimulizi.
- source_word: בִּרְחוֹב בֵּית הָאֱלֹהִים
  choice: katika uwanja wa wazi wa nyumba ya Mungu
  rationale: רְחוֹב ni eneo pana la wazi, si lazima ua wa ndani; tafsiri hii huepuka kubainisha usanifu usiotajwa.
- source_word: מַרְעִידִים
  choice: wakitetemeka
  rationale: Hueleza mtetemeko wa mwili ambao unaweza kutokana na hofu au baridi ya mvua, bila kuchagua sababu moja tu.
- source_word: עַל הַדָּבָר
  choice: kwa sababu ya jambo hilo
  rationale: הַדָּבָר hurejelea suala maalumu lililokuwa mbele yao; 'jambo hilo' huhifadhi rejeo hilo.
- source_word: וּמֵהַגְּשָׁמִים
  choice: na kwa sababu ya mvua kubwa
  rationale: Wingi גְּשָׁמִים unaweza kumaanisha mvua za msimu au mvua nyingi; 'mvua kubwa' ni usemi wa asili unaowasilisha hali hiyo.
