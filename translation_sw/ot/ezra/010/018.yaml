id: EZR.10.18
reference: Ezra 10:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּמָּצֵא֙ מִ/בְּנֵ֣י הַ/כֹּהֲנִ֔ים אֲשֶׁ֥ר הֹשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת מִ/בְּנֵ֨י יֵשׁ֤וּעַ בֶּן יֽוֹצָדָק֙ וְ/אֶחָ֔י/ו מַֽעֲשֵׂיָה֙ וֶֽ/אֱלִיעֶ֔זֶר וְ/יָרִ֖יב וּ/גְדַלְיָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/018.yaml
  text: 'And among the sons of the priests who had taken foreign wives[a], there were found from the sons of Jeshua son of Jozadak and his brothers: Maaseiah, Eliezer, Jarib, and Gedaliah.'
translation:
  language: sw
  text: 'Miongoni mwa wana wa makuhani waliokuwa wameoa wanawake wa kigeni[a], walipatikana hawa kutoka kwa wana wa Yeshua mwana wa Yosadaki na ndugu zake: Maaseya, Eliezeri, Yaribu na Gedalia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa wamechukua wake wa kigeni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא
  choice: walipatikana hawa
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umoja, kinaanzisha orodha ya wanaume kadhaa; wingi wa Kiswahili unawasilisha maana hiyo ya kijumla kwa kawaida.
- source_word: מִבְּנֵי הַכֹּהֲנִים
  choice: miongoni mwa wana wa makuhani
  rationale: Neno 'wana' linahifadhi lugha ya ukoo ya Kiebrania, huku 'miongoni mwa' likionyesha kwamba watu waliotajwa ni sehemu ya kundi la kikuhani.
- source_word: אֲשֶׁר הֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת
  choice: waliokuwa wameoa wanawake wa kigeni
  rationale: Katika muktadha huu kirai kinahusu mahusiano ya ndoa; 'wameoa' ni Kiswahili cha kawaida na cha wazi bila kuongeza hukumu isiyosemwa na maandishi.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: wanawake wa kigeni
  rationale: Hili linahifadhi kwa ukaribu maana ya msingi ya maneno ya Kiebrania; hali yao kama wake imeonyeshwa tayari na kitenzi 'wameoa'.
- source_word: מִבְּנֵי יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: kutoka kwa wana wa Yeshua mwana wa Yosadaki
  rationale: Muundo wa ukoo wa 'wana wa' umehifadhiwa, na majina yamenukuliwa kwa namna inayosomeka kwa Kiswahili.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: '''Ndugu zake'' ni tafsiri ya kawaida ya Kiswahili inayoweza kutaja ndugu wa kiume au watu wa ukoo kulingana na muktadha, hivyo haipanui wala kubana maana kupita kiasi.'
- source_word: מַעֲשֵׂיָה וֶאֱלִיעֶזֶר וְיָרִיב וּגְדַלְיָה
  choice: Maaseya, Eliezeri, Yaribu na Gedalia
  rationale: Majina ya watu yamenukuliwa badala ya kutafsiriwa, kwa tahajia zinazofaa mfumo wa sauti na matumizi ya majina ya kibiblia katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ukoo umehifadhiwa, lakini sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili. Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
