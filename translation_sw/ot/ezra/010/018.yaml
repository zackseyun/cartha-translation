  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: kundi la makuhani, ndoa na wanawake wa kigeni, tawi la Yeshua mwana wa Yosadaki pamoja na ndugu zake, kisha orodha ya majina. Wingi katika “walipatikana hawa” ni wa kawaida katika Kiswahili kwa kitenzi hiki kinachoanzisha orodha, ingawa Kiebrania kina umoja wa kijumla.'
