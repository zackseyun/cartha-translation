source:
  edition: WLC
  text: יַֽעֲמְדוּ נָ֣א שָׂ֠רֵי/נוּ לְֽ/כָל הַ/קָּהָ֞ל וְ/כֹ֣ל אֲשֶׁ֣ר בֶּ/עָרֵ֗י/נוּ הַ/הֹשִׁ֞יב נָשִׁ֤ים נָכְרִיּוֹת֙ יָבֹא֙ לְ/עִתִּ֣ים מְזֻמָּנִ֔ים וְ/עִמָּ/הֶ֛ם זִקְנֵי עִ֥יר וָ/עִ֖יר וְ/שֹׁפְטֶ֑י/הָ עַ֠ד לְ/הָשִׁ֞יב חֲר֤וֹן אַף אֱלֹהֵ֨י/נוּ֙ מִמֶּ֔/נּוּ עַ֖ד לַ/דָּבָ֥ר הַ/זֶּֽה־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/014.yaml
  text: Please let our leaders stand for the whole assembly[a], and let everyone in our cities who has taken foreign wives come at appointed times, with them the elders of each city and its judges[b], until the burning anger of our God is turned back from us in this matter.
translation:
  language: sw
  text: Tafadhali viongozi wetu wasimame kwa niaba ya kusanyiko lote. Kisha kila mtu katika miji yetu ambaye amechukua wake wa kigeni[a] aje kwa nyakati zilizowekwa, akiwa pamoja na wazee wa kila mji na waamuzi wake, mpaka ghadhabu inayowaka ya Mungu wetu iondolewe mbali nasi kuhusu jambo hili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye ameoa wanawake wa kigeni.” Nahau ya Kiebrania ni, kihalisi, “amewakalisha wanawake wa kigeni,” yaani amewaingiza katika nyumba yake kama wake.
    reason: lexical_alternative
  - marker: b
    text: Au, “mpaka hasira kali ya Mungu wetu ituondokee kwa habari ya jambo hili.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲמְדוּ נָא
  choice: Tafadhali ... wasimame
  rationale: Kauli ya ombi pamoja na נָא inaonyesha pendekezo la heshima, si taarifa rahisi ya wakati ujao. “Tafadhali ... wasimame” huhifadhi nguvu hiyo ya kusihi.
- source_word: שָׂרֵינוּ
  choice: viongozi wetu
  rationale: שָׂרִים hapa ni wenye mamlaka ya uongozi au utawala. “Viongozi” ni Kiswahili cha sasa, wazi na kisicho na ladha ya kifalme isiyohitajika.
- source_word: לְכָל הַקָּהָל
  choice: kwa niaba ya kusanyiko lote
  rationale: Kihusishi kinaonyesha viongozi kusimama wakiwakilisha jumuiya nzima. “Kwa niaba ya” huweka wazi kazi hiyo ya uwakilishi bila kubadili hoja.
- source_word: הַהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: amechukua wake wa kigeni
  rationale: Kauli ya Kiebrania, kihalisi ‘amewakalisha wanawake wa kigeni,’ katika muktadha huu inahusu kuwaingiza nyumbani kama wake. “Amechukua wake” huhifadhi nahau ya kuchukua mke huku maana ya kindoa ikibaki wazi.
- source_word: יָבֹא
  choice: aje
  rationale: Ingawa kitenzi ni umoja, kinatumika kwa namna ya mgawanyo pamoja na ‘kila mtu.’ Hali ya kutaka ‘aje’ inaendeleza pendekezo la mstari.
- source_word: לְעִתִּים מְזֻמָּנִים
  choice: kwa nyakati zilizowekwa
  rationale: Maneno haya yanarejelea nyakati rasmi zilizopangwa kwa ajili ya kusikiliza mashauri.
- source_word: וְעִמָּהֶם זִקְנֵי עִיר וָעִיר וְשֹׁפְטֶיהָ
  choice: pamoja na wazee wa mji wake na waamuzi wake
  rationale: עִיר וָעִיר ni usemi wa mgawanyo, ‘kila mji.’ Kwa kuwa ‘kila mtu’ na ‘aje’ ni umoja, “mji wake” huonyesha kwa kawaida kwamba kila mhusika angeandamana na wazee na waamuzi wa mji wake.
- source_word: חֲרוֹן אַף אֱלֹהֵינוּ
  choice: ghadhabu inayowaka ya Mungu wetu
  rationale: Nahau ya Kiebrania ina taswira ya kuwaka kwa hasira. “Ghadhabu inayowaka” huihifadhi kwa lugha ya heshima na inayoeleweka.
- source_word: מִמֶּנּוּ
  choice: mbali nasi
  rationale: Kiwakilishi kinarejelea jumuiya inayokabili hukumu; “nasi” huhifadhi marejeo ya pamoja.
- source_word: עַד לַדָּבָר הַזֶּה
  choice: kuhusu jambo hili
  rationale: Kifungu cha mwisho kinahusianisha ghadhabu na jambo linaloshughulikiwa, bila kulazimisha ufafanuzi mpana kuliko maandishi.
theological_decisions:
- issue: Jinsi ya kutafsiri lugha ya ghadhabu ya Mungu bila kuipunguza au kuipa mfumo wa mafundisho usiotajwa
  choice: ghadhabu inayowaka ya Mungu wetu
  alternative: hasira kali ya Mungu wetu
  rationale: Maandishi yanataja wazi חֲרוֹן אַף ya Mungu kwa sababu ya kosa la jumuiya. Tafsiri iliyochaguliwa inadumisha uzito na taswira ya lugha hiyo bila kuongeza maelezo ya kimafundisho.
- issue: Kitendo cha kuondoka kwa ghadhabu na mhusika wake
  choice: igeuzwe mbali nasi
  alternative: ituondokee
  rationale: Muundo wa kusababisha katika עַד לְהָשִׁיב unaelekeza kwenye kugeuzwa au kuondolewa kwa ghadhabu. Kauli tendwa haimtaji mtendaji, hivyo haifafanui kimya kimya nani anayeigeuza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa baada ya pendekezo la viongozi ili kupunguza uzito wa muundo mrefu wa Kiebrania, huku mtiririko wa hoja ukihifadhiwa. “Kusanyiko” limetumiwa kwa קָהָל kwa sababu hapa ni jumuiya rasmi iliyokusanyika, na “waamuzi” kwa שֹׁפְטִים ili kuonyesha jukumu lao la kutoa uamuzi.
