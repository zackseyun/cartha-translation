  yaml_path: translation/ot/ezra/010/019.yaml
  text: They pledged themselves to send away their wives[a], and being guilty[b], they offered a ram from the flock for their guilt.
translation:
  language: sw
  text: Waliahidi kuwaacha wake zao[a]; na, wakiwa na hatia, wakatoa kondoo dume wa kundi kwa ajili ya hatia yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “walitoa mkono wao,” nahau ya Kiebrania inayomaanisha kutoa ahadi au kujifunga kwa makubaliano.
    reason: lexical_alternative
  - marker: b
    text: Au kwa uwazi zaidi, “wakatoa kondoo dume wa kundi kuwa sadaka ya hatia kwa ajili ya hatia yao.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנוּ יָדָם
  choice: Walitoa ahadi
  rationale: Kirai hiki kwa neno halisi ni ‘walitoa mkono wao,’ lakini ni nahau ya Kiebrania inayomaanisha kutoa ahadi au kujifunga kwa makubaliano. ‘Walitoa ahadi’ huwasilisha maana hiyo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: לְהוֹצִיא
  choice: ya kuwaacha
  rationale: Hifili ya יצא humaanisha kusababisha waondoke. Katika muktadha huu wa kuvunja uhusiano wa ndoa na wake waliotajwa, ‘kuwaacha’ ni ya asili katika Kiswahili na haiongezi maelezo yasiyomo.
- source_word: נְשֵׁיהֶם
  choice: wake zao
  rationale: Katika muktadha huu neno linamaanisha wake, si wanawake kwa maana pana.
- source_word: וַאֲשֵׁמִים
  choice: na kwa kuwa walikuwa na hatia
  rationale: Kivumishi hiki kinaonyesha hali yao ya kuwa na hatia. Muundo huu wa Kiswahili unaunganisha wazi hali hiyo na kondoo dume aliyetolewa, bila kuifanya kuwa jina la sadaka lisilotajwa moja kwa moja hapa.
- source_word: אֵיל צֹאן
  choice: kondoo dume kutoka kundini
  rationale: Kirai hiki humtaja kondoo dume wa kundi kama mnyama wa dhabihu. ‘Kutoka kundini’ ni Kiswahili cha asili na huhifadhi picha halisi.
- source_word: עַל אַשְׁמָתָם
  choice: kwa ajili ya hatia yao
  rationale: 'Kihusishi pamoja na nomino huonyesha sababu au msingi wa tendo hilo: kondoo dume alitolewa kutokana na hatia yao.'
theological_decisions:
- issue: Iwapo kutaja wazi ‘sadaka ya hatia’ katika matini kuu
  choice: Matini inasema ‘walitoa kondoo dume ... kwa ajili ya hatia yao’ bila kuingiza jina la kitaalamu ‘sadaka ya hatia.’
  alternative: Walitoa kondoo dume wa kundi kuwa sadaka ya hatia kwa ajili ya hatia yao.
  rationale: Kiebrania kinamtaja wazi kondoo dume na hatia yao, lakini katika kifungu hiki hakina nomino tofauti ya ‘sadaka.’ Kitenzi ‘walitoa’ kinakamilisha sentensi kwa Kiswahili huku tanbihi ikihifadhi ufafanuzi wa maana ya kidhabihu bila kuzidisha matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau ya Kiebrania imetafsiriwa kwa maana yake katika matini kuu na umbo lake halisi limehifadhiwa katika tanbihi. ‘Kuwaacha wake zao’ ni ya kawaida na inaeleweka katika muktadha wa kutengana, bila kuingiza istilahi mahususi ya kisheria isiyotajwa moja kwa moja.
