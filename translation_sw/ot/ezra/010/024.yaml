lexical_decisions:
- source_word: וּמִן
  choice: Na katika
  rationale: Inaendeleza muundo wa orodha kwa kuonyesha kundi jingine ndani ya orodha kubwa; katika Kiswahili, ‘na katika’ ni ya asili kuliko tafsiri halisi ‘na kutoka kwa’.
- source_word: הַמְשֹׁרְרִים
  choice: waimbaji
  rationale: Neno hili linawataja wale waliotumikia kama waimbaji katika ibada; ‘waimbaji’ ni neno la kawaida, wazi, na sahihi.
- source_word: אֶלְיָשִׁיב
  choice: Eliashibu
  rationale: Jina limeandikwa kwa namna inayofuata matamshi ya Kiebrania na kaida za majina ya Biblia katika Kiswahili.
- source_word: הַשֹּׁעֲרִים
  choice: walinda malango
  rationale: Katika muktadha wa huduma ya hekalu, hawa ni watu waliopewa jukumu la kulinda malango; kirai hiki kinaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: שַׁלֻּם
  choice: Shalumu
  rationale: Jina limetoholewa kwa kuzingatia umbo na matamshi ya Kiebrania.
- source_word: טֶלֶם
  choice: Telemu
  rationale: Jina limetoholewa kwa kuzingatia umbo na matamshi ya Kiebrania.
- source_word: אוּרִי
  choice: Uri
  rationale: Jina limetoholewa moja kwa moja kwa kuwa umbo lake linafaa katika Kiswahili.
