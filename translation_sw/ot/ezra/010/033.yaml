  yaml_path: translation/ot/ezra/010/033.yaml
  text: 'From the sons of Hashum: Mattenai[a], Mattattah, Zabad, Eliphelet, Jeremai, Manasseh, and Shimei.'
translation:
  language: sw
  text: 'Miongoni mwa wana wa Hashumu: Matenai, Matata, Zabadi, Elifeleti, Yeremai, Manase na Shimei.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: Miongoni mwa wana wa
  rationale: Katika orodha hii, muundo huu unawatambulisha watu waliotoka katika ukoo wa Hashumu. Kauli hii ni ya asili katika Kiswahili na inadumisha maana ya kuchagua baadhi ya wana au wazao wa kundi hilo.
- source_word: חָשֻׁם
  choice: Hashumu
  rationale: Jina la mtu au ukoo limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: מַתְּנַי
  choice: Matenai
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: מַתַּתָּה
  choice: Matata
  rationale: Jina limetoholewa kwa namna inayoakisi matamshi ya Kiebrania na iliyo ya asili katika Kiswahili.
- source_word: זָבָד
  choice: Zabadi
  rationale: Jina limetoholewa kwa kuongezwa irabu ya mwisho ili kupatana na matamshi ya kawaida ya Kiswahili.
- source_word: אֱלִיפֶלֶט
  choice: Elifeleti
  rationale: Jina limetoholewa kwa mfumo wa sauti wa Kiswahili bila kutafsiri maana yake.
- source_word: יְרֵמַי
  choice: Yeremai
  rationale: Tahajia ya Kiswahili inatumia Y kuwakilisha konsonanti ya mwanzo ya jina la Kiebrania.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Umbo hili la jina ni la kawaida na linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: שִׁמְעִי
  choice: Shimei
  rationale: Jina limetoholewa kwa kuhifadhi umbo lake la Kiebrania huku likisomeka kwa urahisi katika Kiswahili.
