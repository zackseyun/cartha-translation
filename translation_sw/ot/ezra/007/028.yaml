base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/028.yaml
  text: and who extended steadfast love to me before the king and his counselors and all the king’s mighty officials[a]. And I took courage, because the hand of Yahweh my God was upon me[c][b], and I gathered leading men from Israel to go up with me.
translation:
  language: sw
  text: ambaye alinionyesha fadhili[a] mbele ya mfalme, washauri wake, na wakuu wote wenye nguvu wa mfalme. Nami nikajipa moyo, kwa sababu mkono wa Yahwe Mungu wangu ulikuwa juu yangu[b], nami nikawakusanya wakuu[c] kutoka miongoni mwa Israeli ili wapande pamoja nami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akanitendea kwa upendo wa kudumu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Nilijitia nguvu kadiri ya mkono wa Yahwe Mungu wangu uliokuwa juu yangu.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “vichwa,” yaani, wakuu au viongozi wa Israeli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִטָּה חֶסֶד
  choice: akanitendea kwa upendo thabiti
  rationale: Nahau hii ina wazo la kuelekeza au kunyosha חֶסֶד kwa mtu. Tafsiri hii ni ya asili katika Kiswahili huku ikihifadhi uzito wa upendo mwaminifu na wenye kudumu.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Inawakilisha moja kwa moja wazo la kuwa mbele au katika uwepo wa mfalme na watu wa baraza lake.
- source_word: יֹעֲצָיו
  choice: washauri wake
  rationale: Neno hili linafaa kwa watu waliompa mfalme mashauri katika mazingira ya kifalme.
- source_word: שָׂרֵי הַמֶּלֶךְ הַגִּבֹּרִים
  choice: wakuu wote wenye nguvu wa mfalme
  rationale: ‘Wakuu’ linaonyesha vyeo vyao vya juu, na ‘wenye nguvu’ linahifadhi kivumishi הַגִּבֹּרִים bila kuwafanya lazima wawe makamanda wa kijeshi.
- source_word: הִתְחַזַּקְתִּי
  choice: Nikajipa moyo
  rationale: Hii ni nahau ya kawaida ya Kiswahili kwa kuimarika au kupata ujasiri; kifungu kinachofuata kinaonyesha wazi kwamba nguvu hiyo haikutokana na Ezra peke yake.
- source_word: כְּיַד ... עָלַי
  choice: kwa sababu mkono wa Yahwe Mungu wangu ulikuwa juu yangu
  rationale: Inahifadhi taswira ya mkono wa Mungu na kueleza kwa Kiswahili cha kawaida uhusiano wa kisababishi unaoonekana katika muktadha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וָאֶקְבְּצָה
  choice: nikawakusanya
  rationale: Ni kitenzi cha moja kwa moja na cha kawaida kinachoendeleza simulizi.
- source_word: רָאשִׁים
  choice: viongozi
  rationale: Ingawa maana halisi ni ‘vichwa,’ hapa neno hilo linawahusu watu waliotambuliwa kuwa viongozi wa Israeli.
- source_word: לַעֲלוֹת
  choice: ili wapande
  rationale: Inahifadhi lugha ya kibiblia ya kupanda kuelekea Yerusalemu na ni fupi na inayoeleweka katika muktadha.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, si cheo; ‘Yahwe’ hulihifadhi wazi katika Kiswahili.
- issue: Chanzo cha ujasiri wa Ezra
  choice: Nikajipa moyo, kwa sababu mkono wa Yahwe Mungu wangu ulikuwa juu yangu
  alternative: Nilijitia nguvu kadiri ya mkono wa Yahwe Mungu wangu uliokuwa juu yangu
  rationale: Tafsiri kuu inaonyesha mkono wa Mungu kuwa msingi wa ujasiri wa Ezra bila kufuta hali ya kitenzi inayomhusisha Ezra katika kujitia moyo; tanbihi inahifadhi muundo rasmi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi umehifadhiwa kwa viunganishi vya ‘-ka-’ na ‘nami’; istilahi za kifalme ni rasmi bila kuwa za kale kupita kiasi.
