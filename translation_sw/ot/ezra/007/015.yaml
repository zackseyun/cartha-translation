base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/015.yaml
  text: and to bring the silver and gold that the king and his counselors have freely offered to the God of Israel[a], whose dwelling is in Jerusalem,
translation:
  language: sw
  text: na kuleta fedha na dhahabu ambazo mfalme na washauri wake wamemtolea Mungu wa Israeli kwa hiari, ambaye makao yake yako Yerusalemu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְהֵיבָלָה
  choice: na kuleta
  rationale: Kitenzi-jina cha Kiaramu chenye viambishi vya kuunganisha na kusudi kinaonyesha sehemu ya agizo la kifalme. “Kuleta” ni Kiswahili cha kawaida kinachofaa kwa kupeleka mali Yerusalemu bila kubainisha njia ya usafirishaji.
- source_word: כְּסַף וּדְהַב
  choice: fedha na dhahabu
  rationale: Hutaja mali hususa inayofafanuliwa na kishazi kinachofuata. Kiswahili hakihitaji kibainishi kinacholingana na “the” ya Kiingereza.
- source_word: דִּי
  choice: ambazo
  rationale: Kiambishi hiki cha uhusiano kinaanzisha kishazi kinachoeleza fedha na dhahabu; “ambazo” kinapatana na nomino hizo mbili katika Kiswahili.
- source_word: מַלְכָּא
  choice: mfalme
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya Kiaramu katika hali sisitizi yenye maana bainifu.
- source_word: וְיָעֲטוֹהִי
  choice: na washauri wake
  rationale: Neno linamaanisha washauri wa kifalme; “washauri” ni la kawaida na linadumisha mazingira ya ikulu.
- source_word: הִתְנַדַּבוּ
  choice: wamemtolea kwa hiari
  rationale: Kitenzi kinaonyesha mchango uliotolewa kwa moyo wa kujitolea. “Kwa hiari” huhifadhi wazi wazo la kutolazimishwa, huku “wamemtolea” likibainisha kuwa sadaka hiyo imeelekezwa kwa Mungu.
- source_word: לֶאֱלָהּ יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni namna ya kawaida na iliyo wazi ya kutafsiri jina hili la Mungu. Kiambishi cha yambwa katika “wamemtolea” kinawakilisha uhusiano wa Kiaramu unaomaanisha kutolewa kwa Mungu.
- source_word: דִּי בִירוּשְׁלֶם מִשְׁכְּנֵהּ
  choice: ambaye makao yake yako Yerusalemu
  rationale: Tafsiri hii inadumisha muundo wa Kiaramu unaotumia nomino “makao” badala ya kuigeuza moja kwa moja kuwa kitenzi “anakaa”; pia haiongezi wazo maalumu la hema.
theological_decisions:
- issue: Uhusiano wa Mungu na Yerusalemu katika מִשְׁכְּנֵהּ
  choice: ambaye makao yake yako Yerusalemu
  alternative: anayekaa Yerusalemu
  rationale: Kiaramu hutumia nomino inayomaanisha makao, si kitenzi rahisi cha kukaa. Tafsiri iliyochaguliwa inadumisha mkazo wa maandishi kuhusu Yerusalemu kuwa mahali pa makao ya Mungu bila kutatua kimya-kimya mvutano kuhusu uwepo wake au kudokeza kwamba amefungiwa humo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imedumishwa kama kishazi kinachoendelea kutoka muktadha wa agizo la kifalme. “Kwa hiari” ni usemi wa kawaida unaoonyesha wazi hali ya kujitolea.
