base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/010.yaml
  text: For Ezra had set his heart to seek the Law of Yahweh[a], and to do it[d][c][b], and to teach statutes and judgments in Israel.
translation:
  language: sw
  text: Kwa maana Ezra alikuwa ameuelekeza moyo wake kutafuta Sheria ya Yahwe[a], kuitekeleza, na kuwafundisha Waisraeli amri na hukumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuichunguza” au “kujifunza Sheria ya Yahwe.” Kitenzi cha Kiebrania kinaweza kuhusisha kutafuta kwa bidii, kuchunguza, au kujifunza.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya kibali na mafanikio yaliyotajwa katika muktadha uliotangulia.
- source_word: הֵכִין לְבָבוֹ
  choice: alikuwa ameuelekeza moyo wake
  rationale: Nahau hii inaonyesha azimio la ndani lililofanywa kwa makusudi; Kiswahili hiki ni cha asili na kinadumisha picha ya moyo.
- source_word: לִדְרוֹשׁ
  choice: kutafuta
  rationale: Kitenzi kinaweza kumaanisha kutafuta, kuchunguza, au kujifunza. ‘Kutafuta’ kinahifadhi upana wa kujitolea kiakili na kiroho.
- source_word: תּוֹרַת יְהוָה
  choice: Sheria ya Yahwe
  rationale: Katika mazingira ya kikuhani na kiuandishi ya Ezra, torah inaelekea kumaanisha Sheria ya agano, si mafundisho ya kawaida tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha jina la Mungu YHWH moja kwa moja katika tahajia ya kawaida ya Kiswahili.
- source_word: וְלַעֲשׂוֹת
  choice: kuitekeleza
  rationale: Kiwakilishi ‘-i-’ kinarejelea Sheria iliyotajwa; ‘kutekeleza’ huonyesha kuitenda kwa uaminifu bila kuongeza tafsiri ya kidhehebu.
- source_word: וּלְלַמֵּד
  choice: na kufundisha
  rationale: Piel ya למד humaanisha kufundisha au kutoa maelekezo.
- source_word: בְּיִשְׂרָאֵל
  choice: Israeli
  rationale: Katika Kiswahili, ‘kufundisha Israeli’ ni usemi wa asili unaowasilisha Israeli kama jamii iliyopokea mafundisho, huku ukihifadhi maana ya huduma iliyofanyika miongoni mwao.
- source_word: חֹק וּמִשְׁפָּט
  choice: masharti na hukumu
  rationale: Majina ya umoja ya Kiebrania yanaweza kutumiwa kwa maana ya kijumla; wingi wa Kiswahili unasikika wa asili na kuonyesha mkusanyo wa maagizo ya kisheria.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina la agano YHWH; ‘Yahwe’ hulionyesha moja kwa moja badala ya kutumia cheo.
- issue: Upeo wa maana ya תּוֹרָה
  choice: Sheria
  alternative: mafundisho
  rationale: Katika muktadha wa Ezra kama kuhani na mwandishi, neno hili linarejelea hasa Sheria ya agano, ingawa maana yake ya msingi inaweza kuwa pana zaidi.
- issue: Mpangilio wa kutafuta, kutenda, na kufundisha
  choice: kutafuta Sheria, kuitekeleza, na kufundisha
  alternative: kujifunza Sheria, kuitii, na kufundisha
  rationale: Mpangilio wa Kiebrania umehifadhiwa ili kuonyesha mvutano muhimu kati ya uchunguzi, utendaji, na ufundishaji bila kuufanya mstari kuwa kauli ya kimafundisho iliyoelezwa zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unadumisha mfululizo wa Kiebrania wa azimio, uchunguzi, utendaji, na ufundishaji.
