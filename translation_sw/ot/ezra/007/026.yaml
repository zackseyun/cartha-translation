base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/026.yaml
  text: And anyone who will not obey the law of your God and the law of the king[a], let judgment be executed on him promptly, whether for death, or for banishment, or for confiscation of goods, or for imprisonment.
translation:
  language: sw
  text: Na mtu yeyote asiyetii sheria ya Mungu wako na sheria ya mfalme, hukumu itekelezwe juu yake bila kuchelewa, iwe ni kifo, au kufukuzwa[a], au kunyang’anywa mali, au kufungwa gerezani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuondolewa,” au kwa maana ya karibu zaidi, “kung’olewa.” Neno hili la Kiaramu ni adimu na huenda linamaanisha kufukuzwa kutoka mahali au jumuiya ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל דִּי
  choice: Na yeyote ambaye
  rationale: Hutanguliza kishazi cha uhusiano kisicho na mhusika maalumu na kuhifadhi maana ya kumhusu kila mtu anayekidhi sharti hilo.
- source_word: לָא לֶהֱוֵא עָבֵד
  choice: hatatii
  rationale: Ingawa maana ya karibu ni ‘hafanyi’ au ‘hatekelezi,’ pamoja na דָּתָא inaonyesha kutotii sheria; ‘hatatii’ ni ya kawaida na wazi katika Kiswahili.
- source_word: דָּתָא
  choice: sheria
  rationale: Neno linaweza kumaanisha sheria, amri, au agizo la kisheria. ‘Sheria’ hudumisha usambamba kati ya sheria ya Mungu na sheria ya mfalme.
- source_word: אֱלָהָךְ
  choice: Mungu wako
  rationale: Huhifadhi umilikishi wa nafsi ya pili umoja unaomwelekea Ezra.
- source_word: וְדָתָא דִּי מַלְכָּא
  choice: na sheria ya mfalme
  rationale: Huhifadhi muundo unaolingana na ‘sheria ya Mungu wako’ na sauti rasmi ya kisheria.
- source_word: אָסְפַּרְנָא
  choice: bila kuchelewa
  rationale: Huwasilisha wazo la kutenda kwa haraka katika muktadha wa utekelezaji wa hukumu kwa Kiswahili cha kawaida.
- source_word: דִּינָה לֶהֱוֵא מִתְעֲבֵד מִנֵּהּ
  choice: hukumu itekelezwe juu yake
  rationale: Huhifadhi kauli tendwa na maana ya kutekeleza uamuzi wa mahakama dhidi ya mkosaji.
- source_word: הֵן ... הֵן ... הֵן ... וְ
  choice: iwe ni ... au ... au ... au
  rationale: Muundo huu huonyesha adhabu mbadala kwa njia ya asili katika Kiswahili.
- source_word: לְמוֹת
  choice: kuuawa
  rationale: Hutoa kwa uwazi adhabu ya kifo katika orodha ya adhabu bila kutumia istilahi pana zaidi ya kisheria.
- source_word: לשרשו
  choice: kufukuzwa
  rationale: Neno hili adimu linaweza kuhusiana na ‘kung’oa’; katika muktadha wa adhabu ya kisheria huenda likamaanisha kuondolewa kutoka mahali au jumuiya.
- source_word: לַעֲנָשׁ נִכְסִין
  choice: kunyang’anywa mali
  rationale: Huwasilisha adhabu inayohusu mali kama kupokonywa mali na mamlaka.
- source_word: וְלֶאֱסוּרִין
  choice: kufungwa gerezani
  rationale: Katika orodha ya adhabu, maana inayokusudiwa ni kifungo; usemi huu ni wazi zaidi kuliko tafsiri halisi ya ‘kufungwa.’
theological_decisions:
- issue: Uhusiano kati ya sheria ya Mungu na sheria ya mfalme katika amri
  choice: 'Zimetafsiriwa kwa uwazi na kwa hadhi iliyoratibiwa: ‘sheria ya Mungu wako na sheria ya mfalme.’'
  alternative: Kufanya sheria moja ionekane kuwa chini ya nyingine, au kueleza sheria ya mfalme kuwa njia tu ya kutekeleza sheria ya Mungu.
  rationale: Mstari wenyewe unazitaja sheria hizo mbili kwa uratibu katika amri ya Uajemi; tafsiri haiongezi mpangilio wa kiteolojia ambao haujaelezwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye sauti ya kisheria iliyo rasmi lakini inayoeleweka kwa msomaji wa kawaida. Alama ya tanbihi imewekwa baada ya neno lenye utata ‘kufukuzwa.’
