lexical_decisions:
- source_word: עַד
  choice: hadi
  rationale: Katika orodha hii ya kiutawala, neno hili linaonyesha kiwango cha juu kinachoweza kutolewa.
- source_word: כְּסַף
  choice: fedha
  rationale: Neno lenyewe humaanisha metali ya fedha, na hapa inapimwa kwa talanta.
- source_word: כַּכְּרִין
  choice: talanta
  rationale: Ni kipimo cha kale cha uzito; kulitaja kwa jina lake huhifadhi kipimo mahususi cha matini.
- source_word: חִנְטִין
  choice: ngano
  rationale: Neno hili humaanisha ngano hasa, wala si nafaka kwa ujumla.
- source_word: כֹּרִין
  choice: kori
  rationale: Ni kipimo cha kale cha vitu vikavu; jina la kipimo limehifadhiwa badala ya kukigeuza kwa makadirio kuwa kipimo cha kisasa.
- source_word: חֲמַר
  choice: divai
  rationale: Hili ndilo neno la Kiaramu kwa divai katika orodha hii ya mahitaji.
- source_word: בַּתִּין
  choice: bati
  rationale: Ni wingi wa kipimo cha kale cha vimiminika; umbo la Kiswahili linatumika bila ubadilishaji wa makadirio.
- source_word: מְשַׁח
  choice: mafuta
  rationale: Matini inasema mafuta bila kutaja wazi kuwa ni mafuta ya zeituni.
- source_word: מְלַח
  choice: chumvi
  rationale: Tafsiri ya moja kwa moja ya bidhaa ya mwisho katika orodha.
- source_word: דִּי לָא כְתָב
  choice: bila kiwango kilichowekwa
  rationale: Kauli halisi ni ‘ambayo haijaandikwa’; katika amri hii inaonyesha kwamba hakuna kiasi maalumu kilichoandikwa au kuwekewa mpaka.
