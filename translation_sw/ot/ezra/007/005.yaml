lexical_decisions:
- source_word: בֶּן
  choice: mwana wa
  rationale: Hili ndilo neno la moja kwa moja katika orodha ya ukoo. Hata hivyo, katika nasaba za Kiebrania linaweza pia kumaanisha mzao wa baadaye, jambo linaloelezwa katika tanbihi.
- source_word: אֲבִישׁוּעַ
  choice: Abishua
  rationale: Jina la mtu limetoholewa kwa herufi za Kiswahili bila kutafsiri maana yake.
- source_word: פִּינְחָס
  choice: Finehasi
  rationale: Umbo hili linafuata matumizi yaliyozoeleka ya jina hili katika Biblia za Kiswahili.
- source_word: אֶלְעָזָר
  choice: Eleazari
  rationale: Umbo la jina lililozoeleka katika Kiswahili cha Biblia.
- source_word: אַהֲרֹן
  choice: Haruni
  rationale: Umbo la jina lililozoeleka katika Kiswahili cha Biblia.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Neno hilo humtaja mtu mwenye huduma ya ukuhani; hapa linaunganishwa na הָרֹאשׁ kuwa cheo.
- source_word: הָרֹאשׁ
  choice: kiongozi
  rationale: Neno רֹאשׁ humaanisha kihalisi ‘kichwa’ na katika cheo huonyesha aliye wa kwanza au anayeongoza. ‘Kiongozi’ huhifadhi maana hiyo na kulitofautisha fungu hili na istilahi ya kawaida zaidi ya Kiebrania inayotafsiriwa ‘kuhani mkuu.’
theological_decisions:
- issue: Cheo cha kikuhani cha Haruni
  choice: kuhani kiongozi
  alternative: kuhani mkuu
  rationale: Kiebrania kinasema kihalisi ‘kuhani, aliye kichwa/kiongozi’ (הַכֹּהֵן הָרֹאשׁ), si istilahi ya kawaida הַכֹּהֵן הַגָּדוֹל. Tafsiri ‘kuhani kiongozi’ inahifadhi tofauti hiyo bila kukataa kwamba kwa mapokeo cheo hiki huweza kuitwa ‘kuhani mkuu.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Mfuatano wa ‘mwana wa’ umehifadhiwa ili kuonyesha muundo wa nasaba wa Kiebrania. Majina Finehasi, Eleazari na Haruni yanafuata maumbo yaliyozoeleka katika Biblia za Kiswahili.
