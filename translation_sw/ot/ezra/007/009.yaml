base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/009.yaml
  text: For on the first day of the first month he began the journey up from Babylon, and on the first day of the fifth month he came to Jerusalem, according to the good hand of his God upon him.
translation:
  language: sw
  text: Kwa maana siku ya kwanza ya mwezi wa kwanza alianza safari ya kupanda kutoka Babeli, na siku ya kwanza ya mwezi wa tano akafika Yerusalemu, kwa msaada wa mkono mwema wa Mungu wake uliokuwa juu yake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mkono mwema wa Mungu wake” ni nahau inayomaanisha fadhili, msaada, na ulinzi wa Mungu.
    reason: Hufafanua nahau ya Kiebrania iliyohifadhiwa katika maandishi, bila kuibana kwa maana moja tu.
lexical_decisions:
- source_word: יְסֻד הַמַּעֲלָה
  choice: alianza safari ya kupanda
  rationale: Kitenzi יְסֻד kimetokana na יסד, kwa maana ya kuweka msingi au kuanzisha; hapa katika muktadha wa safari, ‘alianza safari’ ni Kiswahili cha kawaida. הַמַּעֲלָה ni ‘kupanda,’ yaani safari ya kuelekea Yerusalemu.
- source_word: כְּיַד אֱלֹהָיו הַטּוֹבָה עָלָיו
  choice: kwa kuwa mkono mwema wa Mungu wake ulikuwa juu yake
  rationale: Nahau ya Kiebrania imehifadhiwa kwa sababu ni taswira muhimu ya fadhili, ulinzi, na msaada wa Mungu. כְּ hapa inaeleza hali iliyowezesha kufika kwake, hivyo ‘kwa kuwa’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya ‘mkono mwema wa Mungu’
  choice: Nahau imehifadhiwa bila kuibana iwe aina moja tu ya tendo la Mungu.
  alternative: kwa sababu Mungu wake alimfadhili na kumlinda
  rationale: Chanzo kina taswira pana inayoweza kujumuisha fadhili, ulinzi, na msaada; tafsiri isiamue kimya kimya maana moja pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Safari ya kupanda’ ni ya kueleweka huku ikihifadhi mtazamo wa Kiebrania wa kwenda juu kuelekea Yerusalemu; muundo wa tarehe umewekwa wazi na kwa urahisi.
