  yaml_path: translation/ot/ezra/007/018.yaml
  text: And whatever seems good to you and your brothers to do with the rest of the silver and the gold[b][a], do according to the will of your God.
translation:
  language: sw
  text: Na jambo lolote ambalo wewe na ndugu zako mnaona ni jema[a] kufanya kwa fedha na dhahabu iliyobaki, lifanyeni kulingana na mapenzi ya Mungu wenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo lolote lililo jema kwako na kwa ndugu zako.” Nahau ya Kiaramu inaweza kutafsiriwa kwa namna ya moja kwa moja kuwa “ni jema” au kwa namna ya kimaanawi kuwa “mnaona ni jema.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kulingana na matakwa ya Mungu wenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה דִי
  choice: Na jambo lolote ambalo
  rationale: Muundo huu wa Kiaramu unaanzisha kishazi rejeshi kisicho na kikomo; ‘jambo lolote ambalo’ ni Kiswahili cha asili na huhifadhi upana wa maana.
- source_word: עֲלָיִךְ וְעַל אַחַיִךְ יֵיטַב
  choice: wewe na ndugu zako mnaona ni jema
  rationale: Nahau ya יטב pamoja na על hueleza jambo linaloonekana kuwa jema au linalowapendeza wahusika; tafsiri hii inadumisha hali ya kutafakari na kuamua.
- source_word: אַחַיִךְ
  choice: ndugu zako
  rationale: Neno lenyewe ni ‘ndugu zako’; muktadha unaweza kumaanisha Wayahudi wenzake au washirika wake, lakini tafsiri ya kifamilia inaepuka kufafanua zaidi ya chanzo.
- source_word: בִּשְׁאָר כַּסְפָּא וְדַהֲבָה
  choice: kwa fedha na dhahabu iliyobaki
  rationale: שְׁאָר ni kile kilichosalia. Kiswahili hiki kinaonyesha kuwa mali iliyotajwa awali ndiyo inayobaki.
- source_word: לְמֶעְבַּד
  choice: kufanya
  rationale: Kitenzi עבד hapa kina maana pana ya kufanya au kutekeleza jambo kwa kutumia mali; ‘kufanya’ hudumisha upana huo.
- source_word: כִּרְעוּת
  choice: kulingana na mapenzi
  rationale: רעות inaweza kuwa mapenzi, shauku, au yanayompendeza mtu. ‘Mapenzi’ inafaa kwa mtindo rasmi wa amri bila kuondoa uwezekano wa maana ya ‘shauku.’
- source_word: אֱלָהֲכֹם
  choice: Mungu wenu
  rationale: Kiambishi ni cha wingi, kwa kuwa maagizo yanawahusu Ezra na ndugu zake. ‘Mungu’ humtambulisha Mungu wao mahususi.
- source_word: תַּעַבְדוּן
  choice: lifanyeni
  rationale: Kitenzi cha wingi hapa kina nguvu ya ruhusa iliyoambatana na agizo; ‘lifanyeni’ huiwasilisha kwa kawaida na huonyesha wazi kwamba Ezra na wenzake ndio watendaji.
theological_decisions:
- issue: Jinsi ya kutaja אֱלָהֲכֹם
  choice: Mungu wenu
  alternative: mungu wenu
  rationale: Rejeo ni kwa Mungu mahususi anayeabudiwa na Ezra na wenzake, si mungu wa jumla; herufi kubwa inaonyesha utambulisho huo bila kuongeza fundisho.
- issue: Maana ya כִּרְעוּת
  choice: kulingana na mapenzi ya Mungu wenu
  alternative: kulingana na shauku ya Mungu wenu
  rationale: ‘Mapenzi’ ni ya kawaida na yenye hadhi katika Kiswahili cha Biblia, huku tanbihi ikihifadhi maana mbadala ya hamu au shauku.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umefanywa kuwa wa kawaida kwa Kiswahili huku wingi wa watendaji katika kitenzi cha mwisho na utata wa nahau ya Kiaramu vikihifadhiwa.
