  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כֹל֙ כְּסַ֣ף וּ/דְהַ֔ב דִּ֣י תְהַשְׁכַּ֔ח בְּ/כֹ֖ל מְדִינַ֣ת בָּבֶ֑ל עִם֩ הִתְנַדָּב֨וּת עַמָּ֤/א וְ/כָֽהֲנַיָּ/א֙ מִֽתְנַדְּבִ֔ין לְ/בֵ֥ית אֱלָהֲ/הֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/016.yaml
  text: and all the silver and gold that you find in all the province of Babylon[a], together with the freewill offering of the people and the priests[b], who are freely offering for the house of their God that is in Jerusalem.
translation:
  language: sw
  text: na fedha yote na dhahabu yote utakayopata katika jimbo lote la Babeli, pamoja na sadaka ya hiari[a] ambayo watu na makuhani wanaitoa kwa hiari kwa ajili ya nyumba ya Mungu wao[b] iliyoko Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “toleo la hiari.” Neno la Kiaramu linamaanisha zawadi inayotolewa kwa hiari, hasa katika muktadha wa ibada.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya Mungu wao” hapa ni hekalu lililokuwa Yerusalemu.
    reason: cultural_note
lexical_decisions:
- source_word: וְכֹל כְּסַף וּדְהַב
  choice: na fedha yote na dhahabu yote
  rationale: Huhifadhi kiunganishi na maana pana ya כֹּל, huku kurudia “yote” kukifanya Kiswahili kiwe wazi kwamba fedha na dhahabu zote zinahusika.
- source_word: דִּי תְהַשְׁכַּח
  choice: utakayopata
  rationale: Kitenzi kinamwelekea Ezra moja kwa moja; “kupata” ni cha kawaida na hakiongezi dhana ya namna mali hiyo ilivyokusanywa.
- source_word: בְּכֹל מְדִינַת בָּבֶל
  choice: katika jimbo lote la Babeli
  rationale: מְדִינָה humaanisha eneo la utawala; “jimbo” linafaa katika muktadha wa utawala wa kifalme.
- source_word: עִם הִתְנַדָּבוּת
  choice: pamoja na sadaka ya hiari
  rationale: “Pamoja na” huonyesha chanzo kingine cha mali, na “sadaka ya hiari” huhifadhi wazo la zawadi inayotolewa kwa hiari katika muktadha wa ibada.
- source_word: עַמָּא וְכָהֲנַיָּא מִתְנַדְּבִין
  choice: ambayo watu na makuhani wanaitoa kwa hiari
  rationale: Kirai hiki kinaonyesha kwamba watu na makuhani ndio wanaotoa sadaka hiyo kwa hiari; muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: לְבֵית אֱלָהֲהֹם
  choice: kwa ajili ya nyumba ya Mungu wao
  rationale: “Nyumba ya Mungu wao” huhifadhi tamathali halisi ya Kiaramu, huku “kwa ajili ya” ikionyesha kusudi la sadaka.
- source_word: דִּי בִירוּשְׁלֶם
  choice: iliyoko Yerusalemu
  rationale: Hutaja mahali nyumba hiyo ilipo kwa Kiswahili cha kawaida na kwa uaminifu kwa kishazi cha uhusiano.
theological_decisions:
- issue: Maana ya “nyumba ya Mungu wao”
  choice: Kuhifadhi usemi “nyumba ya Mungu wao” katika matini na kuufafanua katika tanbihi kuwa ni hekalu
  alternative: Kutafsiri moja kwa moja “hekalu la Mungu wao”
  rationale: Usemi halisi una thamani ya kimtindo na kitheolojia, lakini tanbihi huzuia msomaji asielewe kuwa ni nyumba ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa urahisi. Alama za tanbihi zimewekwa baada ya maneno yanayofafanuliwa.
