base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/019.yaml
  text: And the vessels that are given to you for the service of the house of your God[b][a], deliver in full before the God of Jerusalem.
translation:
  language: sw
  text: Na vyombo unavyopewa kwa ajili ya huduma[a] ya nyumba ya Mungu wako, vikabidhi kikamilifu[b] mbele ya Mungu wa Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ibada.”
    reason: lexical_alternative
  - marker: b
    text: Au, “vikabidhi vyote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָאנַיָּא
  choice: Na vyombo
  rationale: Katika muktadha wa hekalu, neno hili la Kiaramu humaanisha vyombo au vifaa vinavyotumiwa humo; “vyombo” ni neno la kawaida na lenye staha katika Kiswahili.
- source_word: דִּי מִתְיַהֲבִין לָךְ
  choice: unavyopewa
  rationale: Huhifadhi maana ya kutendwa ya umbo la Kiaramu na kueleza kwa Kiswahili cha kawaida kwamba vyombo hivyo vinapewa Ezra.
- source_word: לְפָלְחָן בֵּית אֱלָהָךְ
  choice: kwa ajili ya huduma katika nyumba ya Mungu wako
  rationale: “Huduma” huhifadhi upana wa neno la Kiaramu, ambalo hapa linahusu matumizi ya kiibada ya hekalu bila kulifinyanga kuwa tendo la kuabudu pekee. “Katika nyumba” huleta maana ya matumizi ndani ya hekalu kwa Kiswahili cha kawaida.
- source_word: הַשְׁלֵם
  choice: vikabidhi vyote
  rationale: Amri hii ina wazo la kuwasilisha au kukabidhi kwa ukamilifu. “Vikabidhi vyote” ni ya asili katika Kiswahili na inaonyesha kwamba hakuna chombo kinachopaswa kukosekana.
- source_word: קֳדָם
  choice: mbele za
  rationale: Ni tafsiri ya kawaida ya kuwa mbele ya mtu au katika uwepo wake.
- source_word: אֱלָהּ יְרוּשְׁלֶם
  choice: Mungu wa Yerusalemu
  rationale: Hufuata moja kwa moja namna ya kifungu cha Kiaramu kinavyomtambulisha Mungu kwa uhusiano wake na Yerusalemu, bila kukibadili kuwa “Mungu aliye Yerusalemu.”
theological_decisions:
- issue: Istilahi ya huduma ya hekaluni
  choice: kwa ajili ya huduma katika nyumba ya Mungu wako
  alternative: kwa ajili ya ibada katika nyumba ya Mungu wako
  rationale: Neno la Kiaramu linaweza kumaanisha huduma ya kiibada, lakini ni pana kuliko “ibada” peke yake. “Huduma” huhifadhi maana hiyo pana huku muktadha wa nyumba ya Mungu ukionyesha wazi kuwa ni huduma ya hekaluni.
- issue: Uhusiano wa Mungu na Yerusalemu
  choice: Mungu wa Yerusalemu
  alternative: Mungu aliye Yerusalemu
  rationale: Muundo wa chanzo unaweza kueleweka kwa uhusiano na Yerusalemu. Tafsiri iliyochaguliwa huhifadhi usemi wa hati ya kifalme bila kudai kwamba Mungu amefungiwa mahali hapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inadumisha sauti ya amri ya kifalme, huku ikitumia “unavyopewa” na “vikabidhi vyote” kwa urahisi wa kueleweka.
