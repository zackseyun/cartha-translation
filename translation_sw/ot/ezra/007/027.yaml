base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/027.yaml
  text: Blessed be Yahweh[a], the God of our fathers, who put this into the king’s heart, to beautify the house of Yahweh that is in Jerusalem,
translation:
  language: sw
  text: Abarikiwe Yahwe, Mungu wa baba zetu, aliyeweka jambo hili moyoni mwa mfalme ili kuipamba[a] nyumba ya Yahwe iliyoko Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuifanya iwe ya fahari” au “kuitukuza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Abarikiwe
  rationale: Kauli hii ya sifa ni kirai cha baraka kinachomwelekea Mungu; “Abarikiwe” ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi muundo huo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: Mungu wa baba zetu
  rationale: Huhifadhi usemi wa agano ulio katika Kiebrania na rejeo lake mahsusi kwa mababa wa taifa.
- source_word: אֲשֶׁר נָתַן כָּזֹאת בְּלֵב הַמֶּלֶךְ
  choice: aliyeweka jambo hili moyoni mwa mfalme
  rationale: “Kuweka moyoni” ni usemi wa asili wa Kiswahili unaowasilisha wazo la Mungu kusababisha kusudi au nia ndani ya mfalme; כָּזֹאת hapa imetafsiriwa kwa kawaida kuwa “jambo hili.”
- source_word: לְפָאֵר
  choice: kuipamba
  rationale: Katika muktadha wa hekalu, piel ya פאר inaelekea kwenye kulifanya jengo liwe la fahari au zuri; “kuipamba” ni halisi na ya kawaida bila kuifanya maana iwe ya kitheolojia kupita kiasi.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Tafsiri halisi ya “nyumba” imehifadhiwa badala ya “hekalu,” huku muktadha ukiweka wazi jengo linalokusudiwa.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: iliyoko Yerusalemu
  rationale: Hiki ni kishazi rejeshi cha kawaida kinachoonyesha mahali nyumba hiyo ilipo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina la Mungu; “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya פאר kuhusu nyumba ya Yahwe
  choice: kuipamba
  alternative: kuitukuza
  rationale: Muktadha unaruhusu maana ya kuifanya nyumba iwe nzuri au yenye fahari. “Kuipamba” huhifadhi maana ya kimwili inayowezekana, huku tanbihi ikitaja maana pana zaidi bila kuondoa utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Koloni kabla ya kishazi cha kusudi hufanya uhusiano wa kisintaksia uwe wazi bila kuongeza maelezo yasiyokuwamo katika chanzo.
