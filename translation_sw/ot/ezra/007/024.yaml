base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/024.yaml
  text: And we make known to you that it is not permitted to impose tribute[a], tax, or toll on any of the priests, Levites, singers, gatekeepers, temple servants[b], or servants of this house of God.
translation:
  language: sw
  text: Nasi tunawajulisha kwamba hairuhusiwi kutoza kodi, ushuru wa forodha, au ada ya njia[a] kwa yeyote kati ya makuhani, Walawi, waimbaji, walinzi wa malango, watumishi wa hekalu[b], au watumishi wa nyumba hii ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno haya matatu huenda yanatofautisha aina mbalimbali za tozo za kifalme. Pia yanaweza kutafsiriwa “kodi, ushuru, au ada ya kupita.”
    reason: lexical_alternative
  - marker: b
    text: Au “Wanethini,” jina la jadi la נְתִינַיָּא.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוֹדְעִין
  choice: tunawajulisha
  rationale: Kauli hii ni tamko rasmi la kiutawala; “tunawajulisha” ni ya kawaida katika Kiswahili huku ikidumisha uzito wa taarifa rasmi.
- source_word: כָל
  choice: yeyote kati ya
  rationale: Katika muktadha wa marufuku inayohusu makundi yaliyotajwa, usemi huu unaonyesha wazi kwamba hakuna hata mmoja wao anayepaswa kutozwa.
- source_word: כָּהֲנַיָּא
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kundi la kikuhani.
- source_word: לֵוָיֵא
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la kibiblia katika Kiswahili kwa watu wa kabila na huduma ya Lawi.
- source_word: זַמָּרַיָּא
  choice: waimbaji
  rationale: Neno la Kiaramu linataja waliohusika na uimbaji wa Hekaluni; “waimbaji” ni tafsiri ya moja kwa moja na iliyo wazi.
- source_word: תָרָעַיָּא
  choice: walinzi wa malango
  rationale: Usemi huu unaeleza kwa Kiswahili cha sasa wale waliolinda au kusimamia malango, bila kutumia istilahi ya zamani isiyoeleweka kwa urahisi.
- source_word: נְתִינַיָּא
  choice: watumishi wa Hekalu
  rationale: Badala ya kuacha jina la jadi lisiloeleweka, tafsiri hii inaeleza kazi ya kundi hilo. Tanbihi inahifadhi uwezekano wa kunukuu jina lao kama “Wanethini.”
- source_word: פָלְחֵי בֵּית אֱלָהָא דְנָה
  choice: watumishi wa nyumba hii ya Mungu
  rationale: Tafsiri hii inadumisha maana pana ya wale wanaotumika katika nyumba ya Mungu na haiingizi neno “wengine,” ambalo halipo wazi katika chanzo.
- source_word: מִנְדָּה
  choice: kodi
  rationale: Neno hili linamaanisha tozo au kodi iliyowekwa na mamlaka; “kodi” ni neno pana na la kawaida la Kiswahili.
- source_word: בְלוֹ
  choice: ushuru wa forodha
  rationale: Tafsiri hii inalifanya neno la pili litofautiane na kodi ya jumla na inaonyesha aina ya ushuru wa kiutawala au wa bidhaa.
- source_word: וַהֲלָךְ
  choice: ada ya njia
  rationale: Neno hili huenda linamaanisha tozo ya kupita au ya usafiri; “ada ya njia” ni fupi, wazi, na tofauti na kodi na ushuru wa forodha.
- source_word: לָא שַׁלִּיט לְמִרְמֵא עֲלֵיהֹם
  choice: hairuhusiwi kutoza ... kwa
  rationale: Muundo huu unaonyesha marufuku ya kisheria kwa Kiswahili cha kawaida na kuhifadhi wazo la kutowekewa tozo.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya tamko rasmi. “Hekalu” limeandikwa kwa herufi kubwa katika jina la kazi la kundi hilo, huku “nyumba hii ya Mungu” ikifuata taswira ya chanzo. Mpangilio wa tanbihi umewekwa kulingana na mahali pa viashiria katika sentensi: tanbihi [a] inaeleza aina tatu za tozo, na [b] inaeleza “watumishi wa Hekalu.”'
