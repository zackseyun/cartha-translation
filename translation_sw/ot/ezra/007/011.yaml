base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/011.yaml
  text: 'This is the copy of the document that King Artaxerxes gave to Ezra the priest[a], the scribe[b], a scribe of the words of the commandments of Yahweh and of his statutes for Israel:'
translation:
  language: sw
  text: 'Hii ndiyo nakala ya hati[a] ambayo Mfalme Artashasta alimpa Ezra, kuhani, mwandishi—mwandishi wa maneno ya amri za Yahweh na kanuni zake kwa ajili ya Israeli[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matini ya barua” au “nakala ya maandishi ya hati.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuhusu Israeli” au “juu ya Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Hii ndiyo
  rationale: Hutambulisha hati inayofuata kwa Kiswahili cha kawaida bila kuongeza kiashiria cha wakati ambacho hakipo wazi katika chanzo.
- source_word: פַּרְשֶׁגֶן הַנִּשְׁתְּוָן
  choice: nakala ya hati
  rationale: Kirai hiki kinamaanisha nakala au maandishi yaliyotolewa ya waraka rasmi. ‘Hati’ haibani maana kuwa barua tu au amri ya kifalme tu.
- source_word: נָתַן
  choice: alimpa
  rationale: Huhifadhi maana ya msingi ya kitenzi, ‘kutoa/kumpa,’ badala ya kuongeza wazo la ‘kuagiza itolewe.’
- source_word: הַמֶּלֶךְ אַרְתַּחְשַׁסְתְּא
  choice: Mfalme Artashasta
  rationale: Cheo kimetafsiriwa, na jina limetoholewa kwa umbo linalotumika katika Kiswahili.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: kuhani na mwandishi
  rationale: Huyahifadhi majukumu yote mawili ya Ezra bila kubadili ‘mwandishi’ kuwa neno la kisasa na lenye tafsiri pana zaidi kama ‘msomi.’
- source_word: סֹפֵר דִּבְרֵי מִצְוֺת יְהוָה
  choice: mwandishi wa maneno ya amri za Yahweh
  rationale: Hufuata muundo wa ufafanuzi wa Kiebrania na kuhifadhi msisitizo wake juu ya maneno yaliyoandikwa ya amri za Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וְחֻקָּיו
  choice: na kanuni zake
  rationale: ‘Kanuni’ linafaa kwa maagizo yaliyowekwa na linatofautisha חֻקִּים kwa kiasi fulani na ‘amri’ iliyotangulia.
- source_word: עַל יִשְׂרָאֵל
  choice: kwa ajili ya Israeli
  rationale: Katika muktadha huu huonyesha kwa njia ya kawaida kwamba amri na kanuni zinawahusu au zimeelekezwa kwa Israeli, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Chanzo kina jina la Mungu lenye herufi nne; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עַל יִשְׂרָאֵל
  choice: kwa ajili ya Israeli
  alternative: kuhusu Israeli; juu ya Israeli
  rationale: Kihusishi kinaweza kuonyesha wanaolengwa, habari inayohusika, au mamlaka. Tafsiri kuu inafaa zaidi katika muktadha wa amri na kanuni, lakini tanbihi haifuti utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mstari umetumia vistari virefu kuonyesha kwamba kirai cha pili ‘mwandishi’ kinamfafanua Ezra zaidi, huku ukaribu wa muundo wa Kiebrania ukihifadhiwa. Alama zote za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
