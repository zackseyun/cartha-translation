base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/021.yaml
  text: 'And from me, I, King Artaxerxes, issue a decree to all the treasurers in Beyond the River: whatever Ezra the priest, the scribe of the law of the God of heaven, asks of you, let it be done diligently.'
translation:
  language: sw
  text: Nami, mimi Mfalme Artashasta, ninatoa amri hii kwa watunza hazina wote walioko Ng’ambo ya Mto:[b] chochote ambacho Ezra kuhani, mwandishi wa sheria ya Mungu wa mbinguni, atawaomba, kifanywe kwa uangalifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa usahihi” au “bila kuchelewa”; kielezi cha Kiaramu kinasisitiza kutekeleza agizo kwa makini na kikamilifu.
    reason: lexical_alternative
  - marker: b
    text: “Ng’ambo ya Mto” lilikuwa jina la utawala wa Kiajemi kwa eneo lililokuwa magharibi mwa Mto Eufrate.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי אֲנָה
  choice: Nami, mimi
  rationale: Inahifadhi msisitizo wa Kiaramu kwamba mamlaka ya amri hii inatoka kwa mfalme mwenyewe, huku ikisomeka kwa Kiswahili cha kawaida.
- source_word: אַרְתַּחְשַׁסְתְּא מַלְכָּא
  choice: Mfalme Artashasta
  rationale: Mpangilio huu wa cheo na jina ni wa kawaida na unaoeleweka katika Kiswahili.
- source_word: שִׂים טְעֵם
  choice: ninatoa amri hii
  rationale: Nahau hii ya kiutawala ina maana ya kuweka au kutangaza agizo rasmi; tafsiri hii inahifadhi uzito wake wa kisheria.
- source_word: לְכֹל גִּזַּבְרַיָּא
  choice: kwa watunza hazina wote
  rationale: Neno linawahusu maafisa wenye wajibu wa hazina; “watunza hazina” ni wazi na fupi.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: walioko Ng’ambo ya Mto
  rationale: Inahifadhi jina la kiutawala la Kiajemi la eneo lililokuwa magharibi mwa Mto Eufrate.
- source_word: כָל דִּי יִשְׁאֲלֶנְכוֹן
  choice: chochote ambacho ... atawaomba
  rationale: Inawasilisha kwa ufasaha muundo wa Kiaramu unaomaanisha kila kitu ambacho angewaomba, bila kuipa kitenzi nguvu ya kulazimisha isiyomo ndani yake.
- source_word: עֶזְרָא כָהֲנָה
  choice: Ezra kuhani
  rationale: Ni utambulisho wa moja kwa moja wa Ezra kwa cheo chake.
- source_word: סָפַר דָּתָא
  choice: mwandishi wa sheria
  rationale: “Mwandishi” huhifadhi pande za cheo hiki za uandishi, elimu, na utumishi rasmi bila kukifasiri kupita kiasi.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: ya Mungu wa mbinguni
  rationale: Hili ni jina la Mungu lililozoeleka katika mazingira ya utawala wa wakati huo, na ni la kawaida katika Kiswahili cha Biblia.
- source_word: אָסְפַּרְנָא
  choice: kwa uangalifu
  rationale: Kielezi hiki cha Kiaramu kinaweza kudokeza utekelezaji makini, kamili, sahihi, au wa haraka; “kwa uangalifu” kinahifadhi kiini cha utiifu makini bila kufungia maana katika kasi pekee.
