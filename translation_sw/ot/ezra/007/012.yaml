base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/012.yaml
  text: 'Artaxerxes[a], king of kings, to Ezra the priest, the scribe of the law of the God of heaven: complete peace[b]. And now—'
translation:
  language: sw
  text: 'Artashasta, mfalme wa wafalme, kwa Ezra, kuhani, mwandishi wa sheria[a] ya Mungu wa mbinguni: amani kamili[b]. Na sasa—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwandishi wa amri ya Mungu wa mbinguni,” ikiwa דָּתָא linaeleweka katika maana pana ya kiutawala ya “amri” badala ya “sheria.”
    reason: lexical_alternative
  - marker: b
    text: Salamu hii ya Kiaramu ni kauli rasmi iliyozoeleka; “amani kamili” inaweza pia kutafsiriwa “amani timilifu,” au kwa lugha ya kawaida zaidi, “salamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֨רְתַּחְשַׁ֔סְתְּא
  choice: Artashasta
  rationale: Jina la mfalme limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: מֶ֖לֶךְ מַלְכַיָּ֑א
  choice: mfalme wa wafalme
  rationale: Huhifadhi cheo cha kifalme cha Kiaramu kwa mtindo wa kawaida na wenye hadhi katika Kiswahili.
- source_word: לְעֶזְרָ֣א כָהֲנָא
  choice: kwa Ezra kuhani
  rationale: Kiambishi לְ humtaja anayeandikiwa; 'kuhani' ni maelezo yanayomfuata Ezra kwa kawaida katika Kiswahili.
- source_word: סָפַר דָּתָא
  choice: mwandishi wa sheria
  rationale: סָפַר ni mwandishi mwenye utaalamu wa maandiko, na katika maelezo haya ya Ezra דָּתָא inaeleweka vizuri kuwa sheria ya Mungu, ingawa inaweza pia kumaanisha amri.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: ya Mungu wa mbinguni
  rationale: Hutoa moja kwa moja uhusiano wa umilikaji na kuhifadhi cheo cha kibiblia 'Mungu wa mbinguni.'
- source_word: גְּמִיר
  choice: kamili
  rationale: Neno lina maana ya ukamilifu au utimilifu na hapa linaeleza salamu ya amani.
- source_word: וּכְעֶנֶת
  choice: Na sasa—
  rationale: Ni kauli ya mpito katika barua rasmi; kistari kirefu kinaonyesha kuwa wazo linaendelea katika mstari unaofuata.
theological_decisions:
- issue: Maana ya דָּתָא katika maelezo ya Ezra na Mungu wa Israeli
  choice: sheria
  alternative: amri
  rationale: Katika muktadha huu Ezra anaelezwa kwa uhusiano wake na mafundisho ya kisheria ya Mungu wa mbinguni, si hasa amri ya mfalme; tanbihi huhifadhi maana pana ya kiutawala.
- issue: Namna ya kutafsiri kauli ya barua גְּמִיר וּכְעֶנֶת
  choice: Amani kamili. Na sasa—
  alternative: Salamu. Na sasa—
  rationale: Tafsiri hii huhifadhi picha ya amani na ukamilifu katika chanzo pamoja na mpito unaoanzisha sehemu kuu ya waraka, bila kuifanya kuwa kauli iliyorahisishwa kupita kiasi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo rasmi wa kichwa cha waraka umehifadhiwa, na kistari kirefu kinaonyesha kuwa sentensi inaendelea katika mstari unaofuata.
