base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/014.yaml
  text: because you are sent from before the king and his seven counselors to inquire concerning Judah and Jerusalem according to the law of your God that is in your hand[a][b].
translation:
  language: sw
  text: kwa maana umetumwa kutoka mbele ya mfalme na washauri wake saba ili kuchunguza habari za Yuda na Yerusalemu kwa mujibu wa sheria ya Mungu wako iliyo mkononi mwako[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika uwepo wa mfalme.” Nahau hii ya Kiaramu ya mazingira ya ikulu inasisitiza kwamba utume wa Ezra unatoka katika uwepo wa kifalme.
    reason: lexical_alternative
  - marker: b
    text: Au, “uliyo nayo” au “uliyokabidhiwa.” Neno kwa neno ni “iliyo mkononi mwako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: kwa maana
  rationale: Nahau hii ya Kiaramu inaonyesha sababu; ‘kwa maana’ ni ya kawaida, yenye hadhi, na inadumisha uhusiano wa kisababu.
- source_word: מִן קֳדָם מַלְכָּא
  choice: kutoka mbele ya mfalme
  rationale: Tafsiri hii inadumisha nahau rasmi ya ikulu inayosisitiza kuwa utume wa Ezra unatoka katika uwepo na mamlaka ya mfalme.
- source_word: וְשִׁבְעַת יָעֲטֹהִי
  choice: na washauri wake saba
  rationale: Neno hilo linamaanisha maafisa wanaompa mfalme ushauri; ‘washauri’ ni Kiswahili cha kawaida na kinachofaa mazingira ya kifalme.
- source_word: שְׁלִיחַ
  choice: umetumwa
  rationale: Muundo wa Kiaramu unaeleza hali rasmi ya Ezra akiwa ametumwa; ‘umetumwa’ ni sahihi bila kuongeza wazo la ziada.
- source_word: לְבַקָּרָא
  choice: ili kuchunguza
  rationale: Kitenzi hiki kinaweza kumaanisha kutafuta habari, kuchunguza, au kufanya uchunguzi; ‘kuchunguza’ linafaa muktadha wa kiutawala.
- source_word: עַל יְהוּד וְלִירוּשְׁלֶם
  choice: habari za Yuda na Yerusalemu
  rationale: Kirai hiki kinaonyesha jambo linalochunguzwa, yaani hali au mwenendo wa Yuda na Yerusalemu.
- source_word: בְּדָת אֱלָהָךְ
  choice: kwa kufuata sheria ya Mungu wako
  rationale: Kihusishi kinaonyesha sheria ya Mungu kuwa kipimo au mwongozo wa uchunguzi; ‘kwa kufuata’ huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: דִּי בִידָךְ
  choice: iliyo mkononi mwako
  rationale: Tafsiri ya karibu inadumisha taswira ya Kiaramu na uwezekano wa maana za kuwa nayo, kukabidhiwa, au kuwa chini ya uangalizi wa Ezra.
