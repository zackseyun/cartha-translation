lexical_decisions:
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika nasaba, בֶּן kwa kawaida humaanisha “mwana wa.” Ingawa nasaba zinaweza kuruka vizazi, muundo huu wa kawaida unafuata kwa karibu mpangilio wa Kiebrania bila kufafanua zaidi ya chanzo.
- source_word: זְרַחְיָה
  choice: Zerahia
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida na inayoeleweka katika Kiswahili, likihifadhi umbo la jina la Kiebrania.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Jina limetoholewa kwa Kiswahili; konsonanti maradufu ya tahajia ya Kiingereza si lazima ili kuwakilisha matamshi ya Kiebrania kwa maandishi ya Kiswahili.
- source_word: בֻּקִּי
  choice: Buki
  rationale: Jina limetoholewa kwa Kiswahili kwa umbo la asili linalosomeka; dageshi ya Kiebrania haihitaji kuonyeshwa kwa konsonanti maradufu katika tahajia ya Kiswahili.
