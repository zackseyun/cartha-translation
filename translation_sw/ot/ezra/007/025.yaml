source:
  edition: WLC
  text: וְ/אַ֣נְתְּ עֶזְרָ֗א כְּ/חָכְמַ֨ת אֱלָהָ֤/ךְ דִּֽי בִ/ידָ/ךְ֙ מֶ֣נִּי שָׁפְטִ֞ין וְ/דַיָּנִ֗ין דִּי לֶהֱוֺ֤ן דאנין לְ/כָל עַמָּ/ה֙ דִּ֚י בַּ/עֲבַ֣ר נַהֲרָ֔/ה לְ/כָל יָדְעֵ֖י דָּתֵ֣י אֱלָהָ֑/ךְ וְ/דִ֧י לָ֦א יָדַ֖ע תְּהוֹדְעֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/025.yaml
  text: And you[a], Ezra, according to the wisdom of your God that is in your hand, appoint magistrates and judges who may judge all the people who are beyond the River—all who know the laws of your God; and those who do not know them[b], you shall teach.
translation:
  language: sw
  text: Nawe, Ezra, kulingana na hekima ya Mungu wako iliyo mkononi mwako[a], teua mahakimu na waamuzi ili wawahukumu watu wote walio Ng’ambo ya Mto[b]—yaani, wote wanaozijua sheria za Mungu wako. Na wale wasiozijua, ninyi mtawafundisha.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uliyo nayo.” Nahau “iliyo mkononi mwako” inaweza kumaanisha kitu alicho nacho mtu au mamlaka aliyokabidhiwa.
    reason: lexical_alternative
  - marker: b
    text: “Ng’ambo ya Mto” lilikuwa jina la kiutawala la Uajemi kwa eneo lililokuwa magharibi mwa Mto Frati.
    reason: cultural_note
  - marker: c
    text: Kiaramu kinabadilika hapa kutoka “wewe” wa umoja kwenda “ninyi” wa wingi, huenda kikimhusisha Ezra pamoja na wasaidizi wake.
    reason: textual_grammar
lexical_decisions:
- source_word: כְּחָכְמַת אֱלָהָךְ
  choice: kwa kadiri ya hekima ya Mungu wako
  rationale: Kiambishi כְּ kinaonyesha kufuata au kupatana na kiwango fulani; “kwa kadiri ya” kinahifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: דִּי בִידָךְ
  choice: iliyo mkononi mwako
  rationale: Tafsiri hii inadumisha taswira ya nahau ya Kiaramu bila kuamua kimya kimya ikiwa maana yake hasa ni kitu alicho nacho Ezra au mamlaka aliyokabidhiwa.
- source_word: מֶנִּי
  choice: teua
  rationale: Katika muktadha wa utawala, kitenzi kinamaanisha kuwachagua na kuwaweka watu rasmi katika nyadhifa.
- source_word: שָׁפְטִין וְדַיָּנִין
  choice: mahakimu na waamuzi
  rationale: Maneno mawili yanahifadhiwa kama makundi mawili ya watendaji wa sheria, ingawa maana zake zinakaribiana.
- source_word: דִּי לֶהֱוֺן דאנין
  choice: ili wawahukumu
  rationale: Muundo huu unaonyesha kusudi au kazi ya wale watakaoteuliwa.
- source_word: לְכָל עַמָּה
  choice: watu wote
  rationale: Nomino ya jumla pamoja na כּל inatolewa kwa wingi wa kawaida katika Kiswahili.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: walio Ng’ambo ya Mto
  rationale: Hili ni jina la kiutawala na kijiografia la eneo lililokuwa magharibi mwa Frati kwa mtazamo wa Uajemi; herufi kubwa zinaonyesha matumizi yake kama jina rasmi.
- source_word: לְכָל יָדְעֵי דָּתֵי אֱלָהָךְ
  choice: wote wanaozijua sheria za Mungu wako
  rationale: דָּתֵי ni wingi na hapa hurejelea sheria au maagizo ya kisheria; kiwakilishi “zi-” kinadumisha wingi huo.
- source_word: וְדִי לָא יָדַע
  choice: wale wasiozijua
  rationale: Kirejeshi kinatofautisha kundi hili na wanaozijua sheria; yambwa linalorejelea sheria limetajwa wazi kwa Kiswahili.
- source_word: תְּהוֹדְעוּן
  choice: ninyi mtawafundisha
  rationale: Kitenzi cha kusababisha kujua kina maana ya kufundisha au kujulisha. Umbo la Kiaramu ni la nafsi ya pili wingi, tofauti na maumbo ya umoja yaliyomtaja Ezra mapema.
theological_decisions:
- issue: Hekima iliyo “mkononi” mwa Ezra
  choice: Taswira ya chanzo imehifadhiwa katika andiko, huku tanbihi ikieleza uwezekano wake wa kumaanisha miliki au mamlaka aliyokabidhiwa.
  alternative: “hekima ya Mungu wako uliyo nayo”
  rationale: Mbadala ni wazi zaidi lakini ungeondoa taswira na huenda ungeamua mapema maana ya nahau hiyo.
- issue: Mabadiliko kutoka umoja kwenda wingi katika amri ya mwisho
  choice: “ninyi mtawafundisha”
  alternative: “utawafundisha”
  rationale: Umbo la chanzo ni la wingi, hivyo tafsiri hailisawazishi kimya kimya na maumbo ya umoja yanayomtaja Ezra; tanbihi inaonyesha uwezekano kwamba Ezra anahusishwa na wasaidizi wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. “Teua,” “mahakimu,” na “waamuzi” zinafaa kwa mazingira ya utawala na sheria; “Ng’ambo ya Mto” imetendewa kama jina rasmi la eneo.
