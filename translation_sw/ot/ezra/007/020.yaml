base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/020.yaml
  text: And whatever other need of the house of your God falls to you to provide[a], you shall provide it from the house of the king’s treasuries.
translation:
  language: sw
  text: Na chochote kingine kinachohitajika kwa ajili ya nyumba ya Mungu wako, ambacho itakupasa kukitoa, utakitoa kutoka katika nyumba ya hazina za mfalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “kutoka katika hazina ya mfalme.” Kiaramu kwa uhalisi zaidi ni, “kutoka katika nyumba ya hazina za mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר חַשְׁחוּת
  choice: Na hitaji lingine lolote
  rationale: Kirai hiki kinamaanisha hitaji au takwa lolote la ziada. Tafsiri hii ni ya kawaida katika Kiswahili na haifupishi maana kuwa gharama ya fedha pekee.
- source_word: בֵּית אֱלָהָךְ
  choice: nyumba ya Mungu wako
  rationale: Inahifadhi nahau ya Kiaramu ya ‘nyumba,’ ambayo katika muktadha huu inarejelea hekalu, bila kuibadili kimyakimya kuwa neno la ufafanuzi.
- source_word: יִפֶּל לָךְ לְמִנְתַּן
  choice: itakupasa kulitimiza
  rationale: Nahau ya Kiaramu, kihalisi jambo ‘litakalokuangukia’ utoe, inaonyesha wajibu unaomwangukia Ezra. ‘Itakupasa’ huwasilisha wajibu huo kwa Kiswahili cha asili.
- source_word: תִּנְתֵּן
  choice: utalitimiza kwa kutoa
  rationale: Kitenzi kinarudia wazo la kutoa. Muundo huu unahifadhi marudio hayo kwa kiasi kinachosomeka na unaonyesha kwamba mahitaji hayo yatatimizwa kwa utoaji kutoka hazina ya kifalme.
- source_word: מִן בֵּית גִּנְזֵי מַלְכָּא
  choice: kutoka katika nyumba ya hazina za mfalme
  rationale: Tafsiri hii inahifadhi muundo wa Kiaramu, ‘kutoka katika nyumba ya hazina za mfalme,’ huku tafsiri laini zaidi ikiwekwa katika tanbihi.
