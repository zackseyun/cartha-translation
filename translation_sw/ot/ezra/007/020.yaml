translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi istilahi ya kibiblia ‘nyumba ya Mungu’ na kiwango cha urasmi cha amri ya kifalme.
