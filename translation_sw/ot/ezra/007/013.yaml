base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/013.yaml
  text: A decree is issued by me that anyone in my kingdom from the people of Israel[a], and their priests and Levites, who freely offers himself to go to Jerusalem with you[b], may go.
translation:
  language: sw
  text: Mimi natoa amri kwamba yeyote katika ufalme wangu, kutoka miongoni mwa watu wa Israeli, makuhani wao, na Walawi, anayejitolea kwa hiari kwenda Yerusalemu pamoja nawe, anaweza kwenda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנִּי שִׂים טְעֵם
  choice: Nimeamuru
  rationale: Hii ni kauli rasmi ya kiutawala inayomaanisha kwamba mfalme ametoa amri. Kiswahili tendaji ni cha kawaida na kinaonyesha wazi chanzo cha amri.
- source_word: כָל מִתְנַדַּב
  choice: mtu yeyote ... anayejitolea kwa hiari
  rationale: Umbo la Hitpael linaonyesha tendo la hiari la mtu mwenyewe; tafsiri hii inadumisha maana hiyo bila kupunguza kuwa utayari wa jumla tu.
- source_word: בְּמַלְכוּתִי
  choice: katika ufalme wangu
  rationale: Inarejelea eneo lote lililo chini ya mamlaka ya mfalme.
- source_word: מִן עַמָּה יִשְׂרָאֵל וְכָהֲנוֹהִי וְלֵוָיֵא
  choice: aliye wa watu wa Israeli, makuhani wao, au Walawi
  rationale: Orodha inataja makundi ambayo watu wanaoweza kujitolea wanatoka. 'Au' huonyesha kwa kawaida kwamba mtu wa kundi lolote kati ya hayo anaruhusiwa kwenda, ingawa Kiaramu kina viunganishi vya 'na'.
- source_word: לִמְהָךְ לִירוּשְׁלֶם עִמָּךְ
  choice: kwenda pamoja nawe Yerusalemu
  rationale: Hutoa kwa Kiswahili cha kawaida mwendo kuelekea Yerusalemu na kuandamana na Ezra.
- source_word: יְהָךְ
  choice: anaweza kwenda
  rationale: Katika muktadha wa amri, umbo hili linatoa ruhusa, si taarifa ya wakati ujao pekee.
