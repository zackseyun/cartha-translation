base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/017.yaml
  text: Therefore you shall diligently buy with this silver bulls[a], rams, lambs, along with their grain offerings and their drink offerings[c][b], and you shall offer them on the altar of the house of your God that is in Jerusalem.
translation:
  language: sw
  text: Kwa hiyo, kwa fedha hii ununue kwa uangalifu mafahali, kondoo dume, na wana-kondoo, pamoja na sadaka zao za nafaka na sadaka zao za kinywaji, kisha uvitoe juu ya madhabahu ya nyumba ya Mungu wenu, iliyoko Yerusalemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: Kwa hiyo
  rationale: Nahau hii ya Kiaramu inaonyesha hitimisho au matokeo; “Kwa hiyo” ni ya asili na huhifadhi nguvu hiyo.
- source_word: אָסְפַּרְנָא
  choice: kwa uangalifu
  rationale: Kielezi hiki husisitiza utekelezaji makini au sahihi wa agizo; “kwa uangalifu” ni wazi kwa wasomaji wa sasa.
- source_word: תִקְנֵא
  choice: nunueni
  rationale: Kitenzi kina maana ya kununua. Ingawa umbo la Kiaramu ni la nafsi ya pili umoja, Ezra anawakilisha kundi linalotekeleza agizo; wingi wa heshima na wa kimuktadha ni wa asili katika Kiswahili.
- source_word: בְּכַסְפָּא דְנָה
  choice: kwa fedha hii
  rationale: “Fedha” huhifadhi maana halisi ya metali na pia maana yake ya pesa katika muktadha huu wa kiutawala.
- source_word: תּוֹרִין
  choice: mafahali
  rationale: Katika muktadha wa dhabihu, neno hili humaanisha ng’ombe dume; “mafahali” ni fasiri sahihi na ya kawaida.
- source_word: דִּכְרִין
  choice: kondoo dume
  rationale: Neno hili linataja kondoo wa kiume, hivyo “kondoo dume” ni wazi na sahihi.
- source_word: אִמְּרִין
  choice: wana-kondoo
  rationale: Ni neno la kawaida kwa kondoo wachanga katika orodha za dhabihu.
- source_word: מִנְחָתְהוֹן
  choice: sadaka zao za nafaka
  rationale: Katika muktadha wa ibada, מִנְחָה ni sadaka ya nafaka inayoambatana na wanyama waliotajwa.
- source_word: נִסְכֵּיהוֹן
  choice: sadaka zao za kinywaji
  rationale: Hili ni neno la kiibada kwa vimiminika vinavyomiminwa kama sadaka; usemi huu ni wazi kuliko istilahi ya kitaalamu.
- source_word: וּתְקָרֵב הִמּוֹ
  choice: kisha mzitoe
  rationale: Kitenzi ni cha kawaida kwa kuleta karibu au kutoa sadaka; “mzitoe” huwasilisha kitendo cha dhabihu katika muktadha wa madhabahu.
- source_word: עַל מַדְבְּחָה
  choice: juu ya madhabahu
  rationale: Huhifadhi kwa uwazi uhusiano wa mahali ulio katika maandishi ya Kiaramu.
- source_word: בֵּית אֱלָהֲכֹם
  choice: nyumba ya Mungu wenu
  rationale: Huhifadhi taswira halisi ya “nyumba,” ingawa katika muktadha inarejelea hekalu.
