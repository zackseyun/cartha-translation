    text: Usemi wa Kiebrania “mkono wa Yahwe, Mungu wake, uliokuwa juu yake” unaweza kumaanisha kibali, nguvu, au msaada wa Mungu unaoongoza mambo.
    reason: lexical_alternative
  revision_rationale: Revision is limited to improving the rendering of the Hebrew idiom כְּיַד ... עָלָיו and sharpening the competence nuance of מָהִיר. The text continues to retain the hand imagery in the main text, does not add “mwema/good,” and keeps the footnote anchored to the idiom it explains.
