  text: ה֤וּא עֶזְרָא֙ עָלָ֣ה מִ/בָּבֶ֔ל וְ/הֽוּא סֹפֵ֤ר מָהִיר֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר נָתַ֥ן יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּתֶּן ל֣/וֹ הַ/מֶּ֗לֶךְ כְּ/יַד יְהוָ֤ה אֱלֹהָי/ו֙ עָלָ֔י/ו כֹּ֖ל בַּקָּשָׁתֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/006.yaml
  text: This Ezra went up from Babylon[a], and he was a skilled scribe in the Law of Moses, which Yahweh, the God of Israel, had given. And the king granted him all his request, according to the hand of Yahweh his God upon him.
translation:
  language: sw
  text: Ezra huyu alipanda kutoka Babeli. Alikuwa mwandishi mahiri katika Sheria ya Musa, ambayo Yahwe, Mungu wa Israeli, alikuwa ametoa. Mfalme akampa kila kitu alichoomba, sawasawa na mkono wa Yahwe, Mungu wake, uliokuwa juu yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Usemi wa Kiebrania “mkono wa Yahwe, Mungu wake, uliokuwa juu yake” unaweza kumaanisha kibali, nguvu, au msaada wa Mungu unaoongoza mambo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה מִבָּבֶל
  choice: alipanda kutoka Babeli
  rationale: Kitenzi עָלָה pamoja na מִן ni usemi wa kawaida wa kusafiri kwenda mahali panapohesabiwa kuwa juu, hasa Yerusalemu. ‘Alipanda’ huhifadhi mtazamo huo kuliko ‘alitoka’ peke yake.
- source_word: סֹפֵר מָהִיר
  choice: mwandishi stadi
  rationale: סֹפֵר hapa ni mwandishi mwenye utaalamu wa maandiko na sheria, na מָהִיר huonyesha umahiri au utayari. ‘Mwandishi stadi’ huhifadhi maana hiyo bila kumfanya katibu tu wala kuondoa kazi yake ya maandishi.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: katika Sheria ya Musa
  rationale: Katika muktadha huu wa agano na sheria baada ya uhamisho, תּוֹרָה linaeleweka vizuri kama ‘Sheria’; herufi kubwa huonyesha mkusanyo maalumu unaohusishwa na Musa.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: ambayo Yahwe, Mungu wa Israeli, alikuwa ametoa
  rationale: Kishazi hiki kinarejelea Sheria ya Musa. ‘Alikuwa ametoa’ huonyesha kwamba tendo la kuitoa Sheria lilitangulia habari inayosimuliwa kuhusu Ezra.
- source_word: וַיִּתֶּן לוֹ הַמֶּלֶךְ כֹּל בַּקָּשָׁתוֹ
  choice: Mfalme akampa kila kitu alichoomba
  rationale: Hii ni Kiswahili cha kawaida na wazi kwa maana ya mfalme kukubali kikamilifu ombi la Ezra, huku kikihifadhi wazo la נתן, ‘kutoa/kumpa.’
- source_word: כְּיַד יְהוָה אֱלֹהָיו עָלָיו
  choice: kwa kadiri ya mkono wa Yahwe Mungu wake ulivyokuwa juu yake
  rationale: Tafsiri inahifadhi taswira halisi ya ‘mkono’ na uhusiano unaoonyeshwa na כְּ, bila kuamua kimya-kimya kama mkono huo hasa ni kibali, nguvu, au msaada wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ina jina la Mungu la herufi nne, יהוה. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo.
- issue: Kama usemi wa ‘mkono wa Yahwe ... juu yake’ ufafanuliwe katika matini kuu
  choice: Kuhifadhi sitiari ya mkono katika matini kuu
  alternative: kwa sababu Yahwe Mungu wake alimkubali, alimpa nguvu, au alimsaidia
  rationale: Usemi huo unaweza kujumuisha kibali, nguvu, uongozi, na msaada wa Mungu. Kuhifadhi sitiari huepuka kuifanya maana yake kuwa finyu kuliko Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Alipanda’ huhifadhi mwelekeo wa Yerusalemu, na ‘mwandishi stadi’ ni wa kawaida zaidi kuliko istilahi finyu ya kitaalamu. Alama ya tanbihi imewekwa baada ya usemi unaoelezwa.
