  terminology: “Mungu wa mbinguni,” “nyumba ya Mungu wa mbinguni,” “kwa bidii,” “ufalme wa mfalme,” na “wanawe” zinafaa. Tanbihi ya hekalu inaeleza “nyumba” bila kuibadilisha katika tafsiri kuu; tanbihi ya pili huhifadhi uwezekano wa swali la balagha.
