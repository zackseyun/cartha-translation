  to: Lolote lililoamriwa na Mungu wa mbinguni, lifanywe kwa bidii kwa ajili ya nyumba ya Mungu wa mbinguni[a], ili ghadhabu isije juu ya ufalme wa mfalme na wanawe.[b]
  rationale: 'Marekebisho mawili ya kisarufi na kimtindo yamefanywa: “na” imeondolewa kabla ya “lifanywe,” na onyo limetolewa kama “ili ghadhabu isije juu ya ...” Hii huhifadhi maana ya onyo ya דִּי לְמָה לֶהֱוֵא קְצַף, huakisi kihusishi עַל (“juu ya”), na huepuka utata wa upatanisho wa yambwa. Alama za tanbihi zimehifadhiwa kwenye vifungu vinavyofafanuliwa.'
