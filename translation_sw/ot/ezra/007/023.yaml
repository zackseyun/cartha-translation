  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כָּל דִּ֗י מִן טַ֨עַם֙ אֱלָ֣הּ שְׁמַיָּ֔/א יִתְעֲבֵד֙ אַדְרַזְדָּ֔א לְ/בֵ֖ית אֱלָ֣הּ שְׁמַיָּ֑/א דִּֽי לְ/מָ֤ה לֶֽהֱוֵא֙ קְצַ֔ף עַל מַלְכ֥וּת מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/023.yaml
  text: Whatever is commanded by the God of heaven[a], let it be done diligently for the house of the God of heaven[b], lest wrath come upon the kingdom of the king and his sons.
translation:
  language: sw
  text: Lolote lililoamriwa na Mungu wa mbinguni, lifanywe kwa bidii kwa ajili ya nyumba ya Mungu wa mbinguni[a], ili ghadhabu isije juu ya ufalme wa mfalme na wanawe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba ya Mungu wa mbinguni” hapa ni hekalu.
    reason: cultural_note
  - marker: b
    text: Au kwa tafsiri ya karibu zaidi na maneno ya asili, “kwa maana kwa nini kuwe na ghadhabu juu ya ufalme wa mfalme na wanawe?”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דִּי
  choice: Lolote
  rationale: Muundo huu una maana ya jumla isiyo na mpaka, ‘lolote’ au ‘yote ambayo.’ ‘Lolote’ ni Kiswahili cha kawaida na huhifadhi upeo huo.
- source_word: מִן טַעַם אֱלָהּ שְׁמַיָּא
  choice: lililoamriwa na Mungu wa mbinguni
  rationale: טַעַם hapa inaweza kumaanisha amri, agizo au uamuzi; katika muktadha huu wa kiutawala, ‘lililoamriwa’ ni wazi, na מִן huonyesha chanzo cha amri.
- source_word: יִתְעֲבֵד
  choice: na lifanywe
  rationale: Kitenzi cha kutendwa kina nguvu ya agizo katika muktadha huu. ‘Na lifanywe’ huhifadhi nguvu hiyo bila kuongeza ulazima usiotajwa.
- source_word: אַדְרַזְדָּא
  choice: kwa bidii
  rationale: Kielezi hiki huonyesha utekelezaji wa haraka, makini na kamili. ‘Kwa bidii’ ni cha asili na kinafaa lugha ya agizo la kiutawala.
- source_word: לְבֵית אֱלָהּ שְׁמַיָּא
  choice: kwa ajili ya nyumba ya Mungu wa mbinguni
  rationale: '‘Nyumba’ huhifadhi sitiari ya chanzo, huku katika muktadha ikirejelea hekalu. לְ imetafsiriwa kwa maana ya manufaa au kusudi: ‘kwa ajili ya.’'
- source_word: דִּי לְמָה לֶהֱוֵא קְצַף
  choice: ili ghadhabu isiupate
  rationale: Kifungu hiki kinaweza kuwasilishwa kihalisi kama swali, ‘kwa nini kuwe na ghadhabu?’ Katika Kiswahili, ‘ili ... isiupate’ huonyesha kwa kawaida onyo na kusudi la kuepuka matokeo hayo.
- source_word: עַל מַלְכוּת מַלְכָּא
  choice: ufalme wa mfalme
  rationale: Kirai kinarejelea eneo au utawala wa mfalme, si mfalme peke yake. ‘Ufalme wa mfalme’ ni wazi na karibu na muundo wa chanzo.
- source_word: וּבְנוֹהִי
  choice: na wanawe
  rationale: Neno linamaanisha moja kwa moja ‘wanawe.’ Ingawa linaweza kuwa na maana pana ya nasaba, tafsiri ya moja kwa moja imehifadhiwa.
theological_decisions:
- issue: Maana ya בֵית אֱלָהּ שְׁמַיָּא
  choice: nyumba ya Mungu wa mbinguni
  alternative: hekalu la Mungu wa mbinguni
  rationale: Tafsiri kuu inahifadhi neno ‘nyumba’ la chanzo badala ya kulifafanua moja kwa moja kuwa ‘hekalu’; tanbihi inaeleza rejeo lake bila kubadili sitiari.
- issue: Namna ya kutafsiri onyo דִּי לְמָה לֶהֱוֵא קְצַף
  choice: ili ghadhabu isiupate ufalme wa mfalme na wanawe
  alternative: kwa maana kwa nini kuwe na ghadhabu juu ya ufalme wa mfalme na wanawe?
  rationale: Chanzo kina umbo linaloweza kusomwa kama swali la balagha, lakini kazi yake katika sentensi ni kuonya ili ghadhabu iepukwe. Tafsiri kuu huonyesha kazi hiyo, na tanbihi huhifadhi umbo la karibu zaidi na chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa agizo ‘na lifanywe’ unafaa hati rasmi, huku ‘kwa bidii’ na ‘ili ... isiupate’ vikifanya sentensi ieleweke kwa wasomaji wa kawaida.
