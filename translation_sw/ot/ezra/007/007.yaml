base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/007.yaml
  text: And some of the sons of Israel[a], and some of the priests, and the Levites, and the singers, and the gatekeepers[b], and the temple servants went up to Jerusalem in the seventh year of King Artaxerxes.
translation:
  language: sw
  text: Nao baadhi ya Waisraeli,[a] na baadhi ya makuhani, na Walawi, na waimbaji, na walinda malango, na watumishi wa Hekalu[b] walipanda kwenda Yerusalemu katika mwaka wa saba wa utawala wa Mfalme Artashasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “baadhi ya wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “Wanethini,” istilahi maalumu kwa kundi la watumishi wa Hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: walipanda kwenda
  rationale: Kitenzi עלה kinaonyesha kwenda juu; usemi huu unahifadhi dhana ya kupanda kuelekea Yerusalemu kwa lugha ya kawaida ya Kiswahili.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: baadhi ya Waisraeli
  rationale: מִן ina maana ya sehemu ya kundi, hivyo “baadhi ya” ni muhimu; “Waisraeli” ni ya asili zaidi katika Kiswahili kuliko tafsiri sisisi ya “wana wa Israeli.”
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kundi hili la huduma ya ibada.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Jina la kawaida la Kiswahili kwa watu wa kabila na tabaka hili la huduma ya Hekalu.
- source_word: הַמְשֹׁרְרִים
  choice: waimbaji
  rationale: Neno la Kiebrania linawahusu hasa walioimba katika huduma ya Hekalu, si wanamuziki kwa ujumla.
- source_word: הַשֹּׁעֲרִים
  choice: walinda malango
  rationale: Linaeleza kwa uwazi wahudumu waliokuwa na jukumu la kulinda na kusimamia malango.
- source_word: הַנְּתִינִים
  choice: watumishi wa Hekalu
  rationale: Tafsiri ya kiutendaji inafafanua kundi hili maalumu la watumishi wa Hekalu; istilahi ya asili imehifadhiwa kama mbadala katika tanbihi.
- source_word: אֶל יְרוּשָׁלִָם
  choice: kwenda Yerusalemu
  rationale: Hii inaonyesha mwelekeo wa safari kwa Kiswahili cha kawaida.
- source_word: בִּשְׁנַת שֶׁבַע
  choice: katika mwaka wa saba wa utawala
  rationale: “Wa utawala” huweka wazi kwa Kiswahili kwamba mwaka huo unahesabiwa katika kipindi cha kutawala kwa mfalme.
- source_word: לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: wa Mfalme Artashasta
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi cheo cha kifalme.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Viunganishi vimerudiwa kwa kiasi ili kuakisi orodha ya Kiebrania bila kuifanya sentensi iwe ngumu. “Walipanda kwenda” huhifadhi maana ya kuelekea juu Yerusalemu; “baadhi ya” limetumiwa kwa Waisraeli na makuhani, ambako Kiebrania linaonyesha wazi maana ya sehemu ya kundi.
