lexical_decisions:
- source_word: וַיָּבֹא
  choice: Naye akafika
  rationale: Kitenzi בוא katika mfululizo wa masimulizi kinaonyesha tukio linalofuata. “Akafika” ni Kiswahili cha kawaida na cha asili kwa kufika mahali palipotajwa.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalemu
  rationale: Jina la mahali limetolewa kwa umbo lililozoeleka katika Kiswahili Sanifu.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: katika mwezi wa tano
  rationale: Kihusishi ב hapa kina maana ya wakati; “katika mwezi wa tano” huhifadhi rejeo la kalenda kwa uwazi.
- source_word: הִיא
  choice: ambao ulikuwa
  rationale: Kiwakilishi kinaunganisha taarifa ya mwezi na taarifa ya mwaka wa utawala. Muundo huu huhifadhi uhusiano huo bila kuamua zaidi ya maandishi.
- source_word: שְׁנַת הַשְּׁבִיעִית
  choice: mwaka wa saba
  rationale: Huu ni muundo wa kutaja mwaka wa utawala kwa namba ya mpangilio; “mwaka wa saba” ni Kiswahili cha kawaida.
- source_word: לַמֶּלֶךְ
  choice: wa mfalme
  rationale: Lamed inaonyesha uhusiano wa mwaka na utawala wa mfalme. Jina Artashasta halijaongezwa kwa kuwa halipo moja kwa moja katika mstari huu.
