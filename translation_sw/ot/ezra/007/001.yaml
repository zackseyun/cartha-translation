base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/001.yaml
  text: After these things[a], in the reign of Artaxerxes king of Persia, Ezra son of Seraiah, son of Azariah, son of Hilkiah—
translation:
  language: sw
  text: Baada ya mambo hayo, wakati wa utawala wa Artashasta, mfalme wa Uajemi, Ezra mwana wa[a] Seraya, mwana wa Azaria, mwana wa Hilkia—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika nasaba, neno la Kiebrania linalotafsiriwa “mwana wa” linaweza pia kumaanisha mzao wa mbali zaidi, si lazima mtoto wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר
  choice: Baada ya
  rationale: Muundo huu unatanguliza sehemu mpya ya simulizi kwa kuiunganisha na yaliyotangulia. Kiswahili cha sasa hakihitaji kutafsiri וְ kwa neno tofauti hapa; “Baada ya” huwasilisha uhusiano wa wakati kwa kawaida.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: mambo hayo
  rationale: דְּבָרִים hapa inarejelea mambo au matukio yaliyosimuliwa kabla. “Mambo hayo” ni ya kawaida na yanadumisha upana wa usemi wa Kiebrania.
- source_word: בְּ/מַלְכוּת
  choice: wakati wa utawala wa
  rationale: Neno hili linamaanisha kipindi cha kutawala kwa mfalme, si eneo la ufalme. Usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: אַרְתַּחְשַׁסְתְּא
  choice: Artashasta
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: מֶלֶךְ פָּרָס
  choice: mfalme wa Uajemi
  rationale: Kirai hiki kinamtambulisha Artashasta kwa cheo na nchi aliyotawala. “Uajemi” ni jina la kawaida la kibiblia kwa Persia katika Kiswahili.
- source_word: עֶזְרָא
  choice: Ezra
  rationale: Jina limetoholewa kwa umbo la Kiswahili linalotambulika.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ndio mtindo wa kawaida wa nasaba na unadumisha usemi wa Kiebrania, bila kuondoa uwezekano kwamba anayerejelewa ni mzao wa mbali zaidi.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Jina limetoholewa kwa umbo la Kiswahili linalotambulika.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Jina limetoholewa kwa umbo la Kiswahili linalotambulika.
- source_word: חִלְקִיָּה
  choice: Hilkia
  rationale: Jina limetoholewa kwa umbo la Kiswahili linalotambulika.
