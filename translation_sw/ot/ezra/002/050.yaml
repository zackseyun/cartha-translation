translation_notes:
  register: Mtindo ni mfupi na wenye urudiaji kama orodha ya asili. “Wazao wa” ni lugha ya sasa, yenye heshima, na inafaa kwa koo bila kulazimisha maana ya wana wa moja kwa moja. Alama za tanbihi zimewekwa baada ya majina yanayohusika.
