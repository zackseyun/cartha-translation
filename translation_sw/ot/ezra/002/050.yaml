  text: the sons of Asnah[a], the sons of Meunim[b], the sons of Nephisim.
translation:
  language: sw
  text: wazao wa Asna, wazao wa Meunimu[a], wazao wa Nefisimu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Meunimu pia huandikwa Maonimu katika baadhi ya mapokeo ya tafsiri.
    reason: lexical_alternative
  - marker: b
    text: Jina Nefisimu pia huandikwa Nefusimu katika baadhi ya mapokeo ya tafsiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: wazao wa
  rationale: Katika orodha hii ya koo na waliorejea, neno hili hutambulisha watu wa ukoo au kundi linalohusishwa na jina fulani; “wazao wa” ni Kiswahili cha kawaida na hakidokezi kwamba wote walikuwa wana wa moja kwa moja.
- source_word: אַסְנָה
  choice: Asna
  rationale: Jina la mtu au ukoo limetoholewa kwa tahajia inayofaa Kiswahili, bila kulitafsiri maana.
- source_word: מעינים
  choice: Meunimu
  rationale: Jina la kundi limetoholewa kwa namna inayoweza kutamkwa kwa kawaida katika Kiswahili; umbo jingine la jina limehifadhiwa katika tanbihi kwa sababu mapokeo ya utohozi hutofautiana.
- source_word: נפיסים
  choice: Nefisimu
  rationale: Jina la kundi limetoholewa kwa kufuata umbo lililowasilishwa katika matini ya Kiebrania na kwa tahajia ya Kiswahili; tofauti ya kimapokeo imeonyeshwa katika tanbihi.
