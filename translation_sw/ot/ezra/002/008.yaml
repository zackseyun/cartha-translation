  rationale: Katika orodha ya watu waliorudi katika Ezra, neno hili hutambulisha watu wa ukoo au jamaa fulani. “Wana wa” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili cha Biblia, huku ikihifadhi muundo wa orodha ya nasaba.
- source_word: זַתּוּא
