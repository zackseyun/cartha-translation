  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: watu wa ukoo wa
  rationale: Katika orodha hii ya waliorudi, neno hili linatambulisha kundi la kifamilia au ukoo linalohusishwa na babu wa kiume. Kiswahili cha kawaida ‘watu wa ukoo wa’ kinaeleza maana hiyo kwa uwazi kuliko tafsiri ya moja kwa moja ‘wana wa,’ ambayo inaweza kueleweka kuwa watoto wa moja kwa moja tu.
- source_word: חָשֻׁם
  choice: Hashumu
  rationale: Jina la Kiebrania limetoholewa kwa tahajia inayoweza kutamkwa kwa kawaida katika Kiswahili, kwa kuongeza vokali ya mwisho bila kubadili utambulisho wa jina.
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: mia mbili ishirini na watatu
  rationale: Mfuatano wa nambari wa Kiebrania una maana ya jumla ya 223. Umeandikwa kwa maneno kwa mtindo wa kawaida wa Kiswahili na upatanisho wa ngeli unaowarejelea watu.
theological_decisions: []
translation_notes:
  register: Lugha ni ya kisasa, yenye heshima, na inayofaa muundo mfupi wa orodha. ‘Watu wa ukoo wa’ huepuka dhana isiyo ya lazima kwamba wote walikuwa wana wa moja kwa moja wa Hashumu.
