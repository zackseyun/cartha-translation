lexical_decisions:
- source_word: הַנְּתִינִים
  choice: Watumishi wa Hekalu
  rationale: Neno hili ni jina la kundi maalumu lililotolewa kwa ajili ya huduma ya mahali patakatifu. Tafsiri ya kiutendaji inaeleweka kwa msomaji wa sasa kuliko kulinakili kama Nethini.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Huhifadhi muundo unaorudiwa wa orodha ya Kiebrania; katika nasaba, usemi huu unaweza pia kumaanisha wazao au ukoo, si watoto wa kiume wa moja kwa moja tu.
- source_word: צִיחָא
  choice: Siha
  rationale: Jina limenakiliwa kwa tahajia ya Kiswahili, huku sauti ya mwanzo inayowakilishwa na herufi צ ikitolewa kwa 'S' na ח kwa 'h'.
- source_word: חֲשׂוּפָא
  choice: Hasufa
  rationale: Jina limenakiliwa kwa muundo wa kawaida na unaosomeka kwa Kiswahili.
- source_word: טַבָּעוֹת
  choice: Tabaoti
  rationale: Katika orodha hii umbo hilo ni jina la mtu au ukoo; kwa hiyo limenakiliwa badala ya kutafsiriwa kama nomino ya kawaida.
