lexical_decisions:
- source_word: סוּסֵיהֶם
  choice: farasi wao
  rationale: Nomino סוּס humaanisha ‘farasi’; umbo la wingi lenye kiambishi cha nafsi ya tatu wingi linaonyesha umilikaji, kwa hiyo ‘farasi wao’ ni tafsiri ya kawaida na sahihi.
- source_word: שְׁבַע מֵאוֹת שְׁלֹשִׁים וְשִׁשָּׁה
  choice: mia saba thelathini na sita
  rationale: Mfuatano huu wa namba unatoa jumla ya 736; usemi huu ni wa kawaida katika Kiswahili Sanifu.
- source_word: פִּרְדֵיהֶם
  choice: nyumbu wao
  rationale: פֶּרֶד humaanisha ‘nyumbu’; neno hilo ni sahihi zaidi kuliko neno pana kama ‘wanyama wa kubeba mizigo,’ na kiambishi kinaonyesha umilikaji.
- source_word: מָאתַיִם אַרְבָּעִים וַחֲמִשָּׁה
  choice: mia mbili arobaini na watano
  rationale: Mfuatano wa namba unatoa jumla ya 245. ‘Watano’ hupatana kisarufi na ‘nyumbu’ wa ngeli ya A-WA, ambayo namba inairejelea.
