lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya nasaba na waliorejea, muundo huu unatambulisha ukoo au jamaa inayotokana na mtu aliyetajwa. “Wana wa” ni tafsiri ya moja kwa moja, ya kawaida, na inafaa pia kwa maana pana ya wazao katika muktadha huu.
- source_word: בַרְקוֹס
  choice: Barkosi
  rationale: Ni jina la mtu au babu wa ukoo; limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, bila kutafsiri maana yake.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Ni jina la mtu au babu wa ukoo, limenukuliwa kwa umbo lililozoeleka katika Biblia za Kiswahili.
- source_word: תָמַח
  choice: Tema
  rationale: Ni jina la mtu au babu wa ukoo. “Tema” linaakisi konsonanti na vokali za Kiebrania תָמַח kwa namna ya asili katika Kiswahili.
