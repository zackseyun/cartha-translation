lexical_decisions:
- source_word: כָּל
  choice: wote
  rationale: Inaonyesha jumla kamili ya makundi mawili yanayofuata na ni usemi wa kawaida wa Kiswahili.
- source_word: הַנְּתִינִים
  choice: watumishi wa Hekalu
  rationale: Ni istilahi maalumu ya baada ya uhamisho kwa kundi lililowekwa kufanya huduma ya Hekalu; tafsiri hii inaeleza kazi yao kwa msomaji wa kawaida.
- source_word: וּבְנֵי
  choice: na wazao wa
  rationale: Ingawa maana ya msingi ni ‘wana wa’, hapa neno hilo linataja kundi la ukoo; ‘wazao wa’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kudokeza kuwa wote walikuwa wana wa moja kwa moja.
- source_word: עַבְדֵי
  choice: watumishi wa
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa; katika orodha hii ya ukoo na utawala, jina la kundi ndilo linalosisitizwa, hivyo ‘watumishi’ linafaa bila kuamua zaidi hadhi yao.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: mia tatu tisini na wawili
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya idadi 392; upatanisho wa ‘wawili’ unarejelea watu waliohesabiwa.
