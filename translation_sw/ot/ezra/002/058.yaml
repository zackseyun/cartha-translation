translation:
  language: sw
  text: Jumla ya watumishi wa Hekalu[a] na wana wa watumishi wa Sulemani ilikuwa mia tatu tisini na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania נְתִינִים (Nethinimu), istilahi maalumu kwa kundi lililowekwa kufanya huduma ya Hekalu.
