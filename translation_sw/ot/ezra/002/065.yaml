translation:
  language: sw
  text: Mbali na watumwa wao wa kiume na wa kike[a], waliokuwa 7,337, walikuwa na waimbaji wa kiume na wa kike, 200.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi wao wa kiume na wa kike.” Maneno ya Kiebrania yanaweza kumaanisha watumishi wa nyumbani kwa ujumla, lakini katika orodha hii ya sensa “watumwa” huonyesha kwa uwazi zaidi hali yao ya utumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: Mbali na
  rationale: Hutambulisha kundi la ziada ambalo halikuhesabiwa katika jumla iliyotangulia; ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: watumwa wao wa kiume na wa kike
  rationale: Katika orodha hii ya sensa, maneno haya yanaonyesha watu tegemezi wenye hadhi ya utumwa; tafsiri hii pia inadumisha tofauti ya jinsia iliyo wazi katika Kiebrania.
- source_word: אֵלֶּה שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: ambao walikuwa 7,337
  rationale: Kiunganishi cha kurejelea kundi lililotajwa kinafanya sentensi iwe ya asili katika Kiswahili huku kikihifadhi idadi kamili.
- source_word: וְלָהֶם
  choice: walikuwa pia na
  rationale: Muundo wa Kiebrania wa umilikaji umetafsiriwa kwa Kiswahili cha kawaida; neno 'pia' linaonyesha kuwa hili ni kundi jingine lililokuwa pamoja nao.
- source_word: מְשֹׁרְרִים וּמְשֹׁרְרוֹת
  choice: waimbaji 200, wanaume kwa wanawake
  rationale: Huhifadhi jinsia zote mbili zinazotajwa wazi na Kiebrania bila kudokeza kuwa kulikuwa na wanaume 200 pamoja na wanawake wengine 200.
- source_word: מָאתָיִם
  choice: '200'
  rationale: Tarakimu zinafaa kwa urahisi wa kusoma katika orodha ya sensa na zinahifadhi idadi kamili.
