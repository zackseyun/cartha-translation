source:
  edition: WLC
  text: אֲשֶׁר בָּ֣אוּ עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְ֠חֶמְיָה שְׂרָיָ֨ה רְֽעֵלָיָ֜ה מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפָּ֥ר בִּגְוַ֖י רְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/002.yaml
  text: 'who came with Zerubbabel: Jeshua[a], Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, and Baanah[d][c][b]. The number of the men of the people of Israel:'
translation:
  language: sw
  text: 'waliokuja pamoja na Zerubabeli: Yeshua, Nehemia, Seraya, Reelaya[a], Mordekai, Bilshani, Mispari[b], Bigvai, Rehumu[c] na Baana. Idadi ya wanaume wa watu wa Israeli:[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika orodha sambamba ya Nehemia 7:7, “Reelaya” anaitwa “Raamia.”
    reason: alternative_reading
  - marker: b
    text: Katika orodha sambamba ya Nehemia 7:7, “Mispari” anaitwa “Misperethi.”
    reason: alternative_reading
  - marker: c
    text: Katika orodha sambamba ya Nehemia 7:7, “Rehumu” anaitwa “Nehumu.”
    reason: alternative_reading
  - marker: d
    text: Kishazi hiki kinatanguliza hesabu ya watu inayoanza katika mstari unaofuata.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר בָּאוּ
  choice: waliokuja
  rationale: Kishazi rejeshi kinaendeleza sentensi ya mstari uliotangulia; kitenzi בוא kimetafsiriwa kwa maana yake ya msingi, ‘kuja,’ bila kuongeza wazo la ‘kurudi’ ambalo linatokana na muktadha mpana.
- source_word: עִם
  choice: pamoja na
  rationale: Huonyesha kuandamana na mtu; ‘pamoja na’ ni usemi wa kawaida na wa heshima katika Kiswahili.
- source_word: זְרֻבָּבֶל
  choice: Zerubabeli
  rationale: Umbo la jina linalotambulika katika matumizi ya kawaida ya Biblia ya Kiswahili.
- source_word: יֵשׁוּעַ
  choice: Yeshua
  rationale: Linawakilisha kwa karibu umbo la Kiebrania la jina hili la kipindi cha baada ya uhamisho, bila kulifanya moja kwa moja kuwa ‘Yoshua.’
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Maandishi ya Kimasoreti yana jina Seraya hapa; tofauti katika mapokeo sambamba haijaingizwa katika matini kuu.
- source_word: רְעֵלָיָה
  choice: Reelaya
  rationale: Unukuzi wa umbo lililo katika WLC; umbo tofauti la orodha sambamba limehifadhiwa katika tanbihi.
- source_word: מִסְפָּר
  choice: Mispari
  rationale: Hapa neno ni jina la mtu, si nomino ya kawaida yenye maana ya ‘idadi’; umbo la orodha sambamba limetajwa katika tanbihi.
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: Idadi ya wanaume wa watu wa Israeli ilikuwa kama ifuatavyo
  rationale: ‘Idadi’ hutofautisha nomino hii na jina Mispari lililotangulia; ‘wanaume’ huhifadhi maana ya אַנְשֵׁי, na nyongeza ndogo ‘ilikuwa kama ifuatavyo’ huonyesha kwa Kiswahili kwamba takwimu zinaanza katika mstari unaofuata.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Majina yameandikwa kwa maumbo yanayofaa matamshi ya Kiswahili huku tofauti muhimu za orodha sambamba zikihifadhiwa katika tanbihi.
