lexical_decisions:
- source_word: בְּנֵי
  choice: wazao wa
  rationale: Katika orodha ya ukoo na waliorejea, neno hili hutambulisha watu wa jamaa au ukoo fulani, si lazima wana wa moja kwa moja tu; “wazao wa” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: זַכָּי
  choice: Zakai
  rationale: Jina limetoholewa kwa kufuata kwa karibu matamshi na konsonanti za Kiebrania, kwa tahajia iliyo rahisi katika Kiswahili.
- source_word: שְׁבַע מֵאוֹת
  choice: mia saba
  rationale: Huu ndio uwasilishaji wa kawaida na wa moja kwa moja wa idadi hii katika Kiswahili.
- source_word: וְשִׁשִּׁים
  choice: na sitini
  rationale: Kiunganishi na idadi hii hukamilisha jumla kuwa mia saba na sitini.
