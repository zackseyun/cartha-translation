  text: the sons of Shephatiah[a], the sons of Hattil, the sons of Pokereth-hazzebaim, the sons of Ami.
translation:
  language: sw
  text: wana wa Shefatia, wana wa Hatili, wana wa Pokereth-Hasebaimu[a], wana wa Ami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “Pokereth wa Sebaimu”; Kiebrania kinaweza kueleweka kuwa jina la ukoo lenye sehemu mbili, au jina linalofuatwa na kipashio kinacholibainisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya nasaba, neno hili linatambulisha familia au koo. “Wana wa” ni usemi wa kawaida wa kibiblia katika Kiswahili, huku muktadha ukiruhusu maana pana ya wazao.
- source_word: שְׁפַטְיָה
  choice: Shefatia
  rationale: Jina la mtu au ukoo limetoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili.
- source_word: חַטִּיל
  choice: Hatili
  rationale: Jina la mtu au ukoo limetoholewa badala ya kutafsiriwa.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: Pokereth-Hasebaimu
  rationale: Vipashio hivi vimewasilishwa kama jina ambatani ili kuhifadhi uhusiano wake wa karibu katika maandishi ya Kiebrania bila kuamua kwa uhakika kwamba kipashio cha pili ni maelezo ya mahali au ukoo.
- source_word: אָמִי
  choice: Ami
  rationale: Jina la mtu au ukoo limetoholewa badala ya kutafsiriwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo wa orodha ni mfupi, wenye hadhi, na unaorudia “wana wa” kama ilivyo katika Kiebrania. Kiunganishi “na” kabla ya kundi la mwisho kinafanya orodha isomeke kwa kawaida katika Kiswahili.
