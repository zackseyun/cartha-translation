translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Watu wa” hufanya orodha ya wakazi au vikundi vya maeneo ieleweke kwa urahisi bila kuficha kwamba Kiebrania kinasema kihalisi “wana wa.”
