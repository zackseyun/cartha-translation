  text: 'The sons of Lod[a], Hadid[b], and Ono: seven hundred twenty-five.'
translation:
  language: sw
  text: 'Watu[a] wa Lodi[b], Hadidi na Ono: mia saba ishirini na tano.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “Wana wa.” Katika orodha hii ya waliorudi, usemi huo unaweza kumaanisha wazao, jamaa, au watu wa maeneo hayo, si wana wa kiume wa moja kwa moja tu.
    reason: lexical_alternative
  - marker: b
    text: Lodi baadaye ilijulikana kama Lida.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: Watu wa
  rationale: Katika orodha hii, neno hili linaweza kutaja ukoo au kundi la watu wanaohusishwa na maeneo yanayofuata, wala si lazima wana wa kiume wa mtu mmoja. “Watu wa” ni Kiswahili cha kawaida na cha wazi katika muktadha huu, huku tanbihi ikihifadhi muundo halisi na upana wa maana ya Kiebrania.
- source_word: לֹד
  choice: Lodi
  rationale: Ni jina la mahali. Umbo “Lodi” linawakilisha jina la Kiebrania Lod kwa namna inayotamkika kwa kawaida katika Kiswahili; tanbihi inataja jina lake la baadaye, Lida.
- source_word: חָדִיד
  choice: Hadidi
  rationale: Ni jina la mahali lililotoholewa kwa tahajia na matamshi ya Kiswahili.
- source_word: וְאוֹנוֹ
  choice: na Ono
  rationale: Kiunganishi וְ kimetafsiriwa “na,” na jina la mahali Ono limehifadhiwa kwa umbo linalofaa Kiswahili.
- source_word: שְׁבַע מֵאוֹת עֶשְׂרִים וַחֲמִשָּׁה
  choice: mia saba ishirini na watano
  rationale: Hii ndiyo idadi kamili 725, iliyotolewa kwa mtindo wa kawaida wa namba katika Kiswahili.
