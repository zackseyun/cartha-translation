- source_word: בֵצָי
  choice: Besai
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili, ambapo herufi ya Kiebrania צ inawakilishwa kwa sauti ya “s”.
- source_word: שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וּשְׁלֹשָׁה
  choice: mia tatu ishirini na watatu
  rationale: Idadi ya Kiebrania imetafsiriwa kwa muundo wa kawaida wa Kiswahili. Umbo “watatu” linapatana kisarufi na watu wanaohesabiwa.
