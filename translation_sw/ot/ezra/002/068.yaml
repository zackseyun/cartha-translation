  text: וּ/מֵ/רָאשֵׁי֙ הָֽ/אָב֔וֹת בְּ/בוֹאָ֕/ם לְ/בֵ֥ית יְהוָ֖ה אֲשֶׁ֣ר בִּ/ירוּשָׁלִָ֑ם הִֽתְנַדְּבוּ֙ לְ/בֵ֣ית הָֽ/אֱלֹהִ֔ים לְ/הַעֲמִיד֖/וֹ עַל מְכוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/068.yaml
  text: And some of the heads of the fathers’ houses[a], when they came to the house of Yahweh that is in Jerusalem, gave freewill offerings for the house of God[c][b], to set it up on its foundation.
translation:
  language: sw
  text: Na baadhi ya wakuu wa nyumba za baba[a], walipofika katika nyumba ya Yahwe iliyoko Yerusalemu, walitoa kwa hiari[b] kwa ajili ya nyumba ya Mungu, ili kuisimamisha mahali pake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baadhi ya viongozi wa ukoo.” Kiebrania hasa husema “wakuu wa nyumba za baba,” yaani viongozi wa vitengo vya ukoo vya Israeli.
    reason: lexical_alternative
  - marker: b
    text: Au, “walijitolea kutoa.” Kitenzi kinakazia kwamba utoaji wao ulikuwa wa hiari.
    reason: lexical_alternative
  - marker: c
    text: Au, “juu ya msingi wake.” Kiebrania kinaweza kurejelea mahali au eneo lake lililowekwa, au msingi wake.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: Baadhi ya viongozi wa jamaa za ukoo
  rationale: מן ina maana ya kuchagua sehemu ya kundi, yaani ‘baadhi ya.’ Kirai hiki kinarejelea viongozi wa vitengo vya kijamii vya Israeli vilivyotegemea ukoo; ‘jamaa za ukoo’ ni cha asili katika Kiswahili na hakifuti muundo huo wa kihistoria.
- source_word: בְּבוֹאָם
  choice: walipofika
  rationale: ב pamoja na kitenzi-jina na kiambishi cha nafsi ina maana ya wakati; ‘walipofika’ ni Kiswahili cha kawaida na sahihi.
- source_word: לְבֵית יְהוָה
  choice: kwenye nyumba ya Yahwe
  rationale: בַּיִת ni ‘nyumba’; katika muktadha huu ni hekalu, lakini ‘nyumba’ huhifadhi taswira na urudiaji wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kwa tahajia ya Kiswahili inayotambulika.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: iliyoko Yerusalemu
  rationale: Kishazi rejeshi kinabainisha mahali nyumba hiyo ilipo; muundo huu ni mfupi na wa kawaida katika Kiswahili.
- source_word: הִתְנַדְּבוּ
  choice: walitoa kwa hiari
  rationale: Hitpaeli ya נדב hukazia tendo la kujitolea kwa utashi. Muktadha unaonyesha kuwa walitoa michango, lakini tafsiri hii haiongezi nomino isiyosemwa wazi.
- source_word: לְבֵית הָאֱלֹהִים
  choice: kwa ajili ya nyumba ya Mungu
  rationale: ל inaonyesha mlengwa au kusudi la utoaji; ‘nyumba ya Mungu’ huhifadhi ulinganifu na ‘nyumba ya Yahwe.’
- source_word: לְהַעֲמִידוֹ
  choice: ili kuisimamisha
  rationale: Hifili ya עמד ina maana ya kusababisha isimame au kuithibitisha. ‘Kuisimamisha’ ni halisi bila kulazimisha wazo la ujenzi mpya au urejeshaji pekee.
- source_word: עַל מְכוֹנוֹ
  choice: mahali pake
  rationale: מָכוֹן inaweza kumaanisha mahali palipowekwa, eneo, au msingi. ‘Mahali pake’ huhifadhi maana pana ya eneo lake maalumu, huku uwezekano wa ‘juu ya msingi wake’ ukielezwa katika tanbihi.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja. ‘Yahwe’ huhifadhi jina hilo la agano badala ya kulibadili kuwa cheo.
- issue: Muundo wa kijamii katika רָאשֵׁי הָאָבוֹת
  choice: viongozi wa jamaa za ukoo
  alternative: wakuu wa nyumba za baba; viongozi wa familia
  rationale: Chaguo hili linaonyesha vitengo vya ukoo vya Israeli na uongozi wake bila kutumia kirai cha Kiswahili kisichoeleweka vizuri au kufifisha kabisa muundo wa kijamii wa chanzo.
- issue: Maana ya עַל מְכוֹנוֹ katika ujenzi wa hekalu
  choice: mahali pake
  alternative: juu ya msingi wake
  rationale: Neno linaweza kurejelea eneo lake lililowekwa au msingi wake. Maandishi makuu yanahifadhi maana pana ya mahali, na tanbihi inatunza uwezekano wa msingi wa jengo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia ‘nyumba’ badala ya ‘hekalu’ ili kuhifadhi urudiaji wa chanzo, na tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
