lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya ukoo, neno hili linataja watu wa jamaa au ukoo unaohusishwa na mtu aliyetajwa. “Wana wa” huhifadhi muundo wa Kiebrania na inafaa kwa mtindo wa orodha ya nasaba.
- source_word: דְלָיָה
  choice: Delaya
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili inayokaribia matamshi ya Kiebrania.
- source_word: טוֹבִיָּה
  choice: Tobia
  rationale: Jina la mtu limetoholewa kwa namna iliyo wazi na ya kawaida katika Kiswahili.
- source_word: נְקוֹדָא
  choice: Nekoda
  rationale: Jina la mtu limetoholewa kwa kufuata kwa karibu umbo la Kiebrania.
- source_word: שֵׁשׁ מֵאוֹת חֲמִשִּׁים וּשְׁנָיִם
  choice: mia sita hamsini na wawili
  rationale: Idadi imetafsiriwa kwa Kiswahili cha kawaida; “wawili” inapatana na watu wanaohesabiwa.
