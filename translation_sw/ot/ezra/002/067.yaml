- source_word: גְּמַלֵּיהֶם
  choice: ngamia wao
  rationale: Nomino ya wingi katika hali ya uambatano ikiwa na kiambishi cha nafsi ya tatu wingi wa kiume inaonyesha umiliki; “ngamia wao” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: אַרְבַּע מֵאוֹת שְׁלֹשִׁים וַחֲמִשָּׁה
  choice: '435'
