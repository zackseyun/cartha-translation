  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi na wenye hadhi unaofaa orodha ya sensa. Kitenzi “walikuwa” kimeongezwa kwa ufasaha wa Kiswahili; hakibadili maana ya jumla ya kishazi cha Kiebrania kisicho na kitenzi.
