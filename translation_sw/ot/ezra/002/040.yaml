base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/040.yaml
  text: 'The Levites: the sons of Jeshua and Kadmiel[a], of the sons of Hodaviah, seventy-four.'
translation:
  language: sw
  text: 'Walawi: wazao wa Yeshua na Kadmieli, wa ukoo wa Hodavia[a], walikuwa sabini na wanne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kiebrania hapa yana “Hodavia”; sehemu sambamba katika Nehemia 7:43 ina “Hodeva.”
    reason: textual_variant
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Nomino yenye kibainishi inatanguliza kundi jipya katika orodha ya sensa; “Walawi” ni kichwa cha kundi kilicho wazi na cha kawaida kwa Kiswahili.
- source_word: בְּנֵי
  choice: wazao wa
  rationale: Katika orodha ya nasaba na sensa, neno hili linaweza kumaanisha wana au washiriki wa ukoo; “wazao wa” huepuka kudokeza kuwa wote walikuwa wana wa moja kwa moja.
- source_word: יֵשׁוּעַ
  choice: Yeshua
  rationale: Jina la mtu limetoholewa kwa namna inayokaribia umbo la Kiebrania na kulitofautisha na umbo la kawaida “Yoshua” katika mazingira mengine.
- source_word: וְקַדְמִיאֵל
  choice: na Kadmieli
  rationale: Kiunganishi kimetafsiriwa “na,” huku jina la mtu likitoholewa kwa mfumo wa kawaida wa Kiswahili.
- source_word: לִבְנֵי הוֹדַוְיָה
  choice: wa ukoo wa Hodavia
  rationale: Kiambishi לְ pamoja na בְּנֵי hapa kinaonyesha uhusiano wa kikundi au nasaba. “Wa ukoo wa” ni Kiswahili cha asili kinachohifadhi uainishaji huo bila muundo mzito wa “wa wana wa.”
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: sabini na wanne
  rationale: Hili ndilo umbo la kawaida la namba hii kwa Kiswahili, likipatana na watu wanaohesabiwa.
