  text: wana wa Lebana[a], wana wa Hagaba, wana wa Akubu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “wana wa” linaweza kumaanisha wazao au watu wa jamaa fulani, si watoto wa kiume wa moja kwa moja tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya ukoo au kundi, neno hilo kwa muundo wake ni ‘wana wa’ lakini linaweza kumaanisha wazao au watu wa jamaa fulani. ‘Wana wa’ huhifadhi urudiaji na muundo wa Kiebrania bila kuficha upana wa maana.
- source_word: לְבָנָה
  choice: Lebana
  rationale: Jina la mtu au jamaa limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili na inayokaribia matamshi ya Kiebrania.
- source_word: חֲגָבָה
  choice: Hagaba
  rationale: Jina la mtu au jamaa limetoholewa moja kwa moja kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: עַקּוּב
  choice: Akubu
  rationale: Jina limetoholewa kwa namna ya kawaida ya Kiswahili, likihifadhi sauti kuu za Kiebrania huku likiepuka konsonanti ya mwisho isiyo ya kawaida katika maneno ya Kiswahili.
