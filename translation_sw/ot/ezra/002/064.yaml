lexical_decisions:
- source_word: כָּל הַקָּהָל
  choice: Kusanyiko lote
  rationale: Kirai hiki kinaonyesha jumla ya jamii iliyokusanyika. ‘Kusanyiko lote’ ni Kiswahili cha kawaida na chenye hadhi, bila kuingiza maana maalumu ya kidhehebu.
- source_word: כְּאֶחָד
  choice: kwa pamoja
  rationale: Nahau hii, ambayo neno kwa neno ni ‘kama mmoja,’ hapa inaonyesha kwamba idadi hiyo ni jumla ya kusanyiko zima. ‘Kwa pamoja’ huwasilisha maana hiyo kwa Kiswahili cha asili, huku tafsiri ya moja kwa moja ikihifadhiwa katika tanbihi.
- source_word: אַרְבַּע רִבּוֹא אַלְפַּיִם שְׁלֹשׁ מֵאוֹת שִׁשִּׁים
  choice: watu 42,360
  rationale: Muundo wa namba wa Kiebrania unatoa jumla ya 42,360. Kuongeza ‘watu’ hufanya sentensi iwe wazi na ya kawaida katika Kiswahili bila kubadili maana.
