base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/063.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b][c].
translation:
  language: sw
  text: Naye mtawala[a] akawaambia kwamba wasile sehemu za matoleo matakatifu sana[b] mpaka atakapotokea kuhani mwenye Urimu na Thumimu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tirshatha,” jina la cheo cha kiutawala cha Kiajemi.
    reason: lexical_alternative
  - marker: b
    text: Yaani, mafungu ya sadaka yaliyotengwa kwa ajili ya makuhani na kuhesabiwa kuwa matakatifu sana; si Patakatifu pa Patakatifu ndani ya hekalu.
    reason: cultural_note
  - marker: c
    text: Urimu na Thumimu zilikuwa njia takatifu za ukuhani za kuulizia; umbo na utaratibu kamili wa matumizi yake havijulikani kwa uhakika.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: mtawala
  rationale: Hili ni jina la cheo cha kiutawala cha Kiajemi. ‘Mtawala’ linaeleweka kwa msomaji wa sasa, huku tanbihi ikihifadhi jina la cheo lililonukuliwa kwa sauti.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: akawaambia kwamba wasile
  rationale: Kiswahili hiki cha kawaida kinawasilisha kwa uwazi amri iliyoripotiwa bila kuifanya iwe kali kuliko ilivyo katika Kiebrania.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: sehemu za matoleo matakatifu sana
  rationale: Katika muktadha wa uthibitisho wa ukuhani, usemi huu unahusu sehemu za sadaka zilizokuwa chakula cha makuhani na zilizohesabiwa kuwa takatifu sana, wala si Patakatifu pa Patakatifu kama mahali.
- source_word: עַד עֲמֹד כֹּהֵן
  choice: mpaka atakapotokea kuhani
  rationale: Muundo wenye עַד unaonyesha kikomo cha wakati cha baadaye. ‘Atakapotokea’ ni Kiswahili cha asili kinachohifadhi wazo la kuhani kujitokeza au kupatikana kwa jukumu hilo.
- source_word: לְאוּרִים וּלְתֻמִּים
  choice: mwenye Urimu na Thumimu
  rationale: Majina haya ya kiufundi ya ibada yamenukuliwa kwa sauti. ‘Mwenye’ linaonyesha kuhani aliye na njia hizi za kuulizia bila kudai uhakika usiokuwapo kuhusu umbo au utaratibu wake.
theological_decisions:
- issue: Maana ya קֹדֶשׁ הַקֳּדָשִׁים katika muktadha huu
  choice: Sehemu za matoleo matakatifu sana zinazoweza kuliwa na makuhani
  alternative: Patakatifu pa Patakatifu kama mahali ndani ya hekalu
  rationale: Muktadha unahusu watu ambao nasaba yao ya ukuhani haikuthibitishwa na katazo la kula. Kwa hiyo kinachomaanishwa ni chakula au mafungu matakatifu ya kikuhani, si kuingia katika eneo la ndani la patakatifu.
- issue: Jinsi ya kutafsiri Urimu na Thumimu
  choice: 'Kuhifadhi majina ya kiufundi kwa kunukuu sauti: ‘Urimu na Thumimu’'
  alternative: Kuyatafsiri kwa maana inayodhaniwa, kama ‘mianga na ukamilifu’
  rationale: Maana halisi, umbo, na utaratibu wake havijulikani kwa uhakika. Kunukuu majina kunahifadhi umahususi wa ibada na sintofahamu halisi ya kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usimulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Naye ... akawaambia’ hudumisha mwendelezo wa simulizi; maneno ya kiufundi yamefafanuliwa kwa tanbihi bila kuingiza msimamo wa dhehebu.
