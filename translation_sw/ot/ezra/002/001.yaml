  text: וְ/אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָֽ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֥ר הֶגְלָ֛ה נבוכדנצור מֶֽלֶךְ בָּבֶ֖ל לְ/בָבֶ֑ל וַ/יָּשׁ֛וּבוּ לִ/ירוּשָׁלִַ֥ם וִֽ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/001.yaml
  text: These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon, and they returned to Jerusalem and Judah[c][b], each to his own city.
translation:
  language: sw
  text: Hawa ndio watu wa jimbo[a] waliopanda kutoka katika uteka wa watu waliohamishwa[b], ambao Nebukadneza, mfalme wa Babeli, alikuwa amewapeleka uhamishoni Babeli; na wakarudi Yerusalemu na Yuda, kila mmoja kwenye mji wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno la Kiebrania, “wana wa jimbo”; huu ni msemo unaomaanisha watu wa jimbo hilo.
    reason: lexical_alternative
  - marker: b
    text: Usemi wa Kiebrania unaweza pia kutafsiriwa “kutoka katika uteka wa uhamisho.” Unataja kwa pamoja uteka na watu waliopelekwa uhamishoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: watu wa jimbo
  rationale: Neno kwa neno ni ‘wana wa jimbo,’ lakini huu ni msemo wa Kiebrania unaomaanisha watu au wakazi wa jimbo. ‘Watu wa jimbo’ huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi umbo la asili.
- source_word: הָעֹלִים
  choice: waliopanda
  rationale: Kitenzi kinadumisha lugha ya kupanda kuelekea Yuda na Yerusalemu. Hakijatafsiriwa ‘waliorudi,’ kwa sababu wazo la kurudi linaelezwa wazi baadaye kwa וַיָּשׁוּבוּ.
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: kutoka katika uteka wa watu waliohamishwa
  rationale: 'Tafsiri hii inawakilisha vipengele vyote viwili vya usemi wa Kiebrania: hali ya uteka na kundi la waliopelekwa uhamishoni. Haifupishi usemi huo kuwa ‘kutoka uhamishoni’ pekee.'
- source_word: הֶגְלָה
  choice: alikuwa amewapeleka uhamishoni
  rationale: Hifili ya גלה inaonyesha kuondolewa kwa nguvu na kupelekwa uhamishoni. Usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: נבוכדנצור
  choice: Nebukadneza
  rationale: Hili ndilo umbo la jina lililozoeleka katika matumizi ya Biblia ya Kiswahili, huku likiwakilisha jina la Kiebrania.
- source_word: וַיָּשׁוּבוּ
  choice: Walirudi
  rationale: Kitenzi hiki kinataja kurudi moja kwa moja na kinatofautishwa na lugha ya awali ya ‘kupanda.’
- source_word: לִירוּשָׁלַם וִיהוּדָה
  choice: Yerusalemu na Yuda
  rationale: Maeneo yote mawili yamewasilishwa moja kwa moja kama mahali walikorudi.
- source_word: אִישׁ לְעִירוֹ
  choice: kila mmoja katika mji wake
  rationale: אִישׁ hapa ina nguvu ya mgawanyo, ‘kila mmoja.’ Kiswahili hiki ni cha kawaida na kinahifadhi umoja wa kirai cha asili.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Tafsiri inatumia ulinganifu bora: inafafanua msemo ‘wana wa jimbo’ katika maandishi makuu, lakini inadumisha lugha ya ‘kupanda’ na ukamilifu wa kirai kinachohusu uteka na uhamisho.'
