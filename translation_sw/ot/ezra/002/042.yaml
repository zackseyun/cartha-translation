  text: בְּנֵ֣י הַ/שֹּֽׁעֲרִ֗ים בְּנֵי שַׁלּ֤וּם בְּנֵֽי אָטֵר֙ בְּנֵי טַלְמ֣וֹן בְּנֵי עַקּ֔וּב בְּנֵ֥י חֲטִיטָ֖א בְּנֵ֣י שֹׁבָ֑י הַ/כֹּ֕ל מֵאָ֖ה שְׁלֹשִׁ֥ים וְ/תִשְׁעָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/042.yaml
  text: 'The sons of the gatekeepers: the sons of Shallum, the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, all together one hundred thirty-nine.'
translation:
  language: sw
  text: 'Wana wa walinda malango: wana wa Shalumu, wana wa Ateri, wana wa Talmoni, wana wa Akubu, wana wa Hatita, na wana wa Shobai; wote walikuwa mia moja thelathini na tisa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya ukoo na makundi, neno hili linaonyesha watu wanaohusishwa kwa nasaba na babu au mkuu wa ukoo. “Wana wa” huhifadhi muundo unaorudiwa wa Kiebrania bila kuufasiri kupita kiasi.
- source_word: הַשֹּׁעֲרִים
  choice: walinda malango
  rationale: Neno hili linawataja waliokuwa na jukumu la kulinda au kuhudumia malango, hasa malango ya hekalu. “Walinda malango” ni Kiswahili cha sasa, wazi na cha kawaida.
- source_word: שַׁלּוּם
  choice: Shalumu
  rationale: Jina la mtu limetoholewa kwa muundo unaosomeka kwa urahisi katika Kiswahili huku likifuata matamshi ya Kiebrania.
- source_word: אָטֵר
  choice: Ateri
  rationale: Jina limetoholewa kwa Kiswahili kwa kuongeza irabu ya mwisho ili liwe rahisi kutamkwa.
- source_word: טַלְמוֹן
  choice: Talmoni
  rationale: Jina limetoholewa kwa Kiswahili kwa namna inayokaribia matamshi ya Kiebrania na kufaa mfumo wa sauti wa Kiswahili.
- source_word: עַקּוּב
  choice: Akubu
  rationale: Konsonanti maradufu ya Kiebrania haihitaji kuonyeshwa kwa tahajia nzito katika Kiswahili; “Akubu” ni toleo la kawaida na linalotamkika kwa urahisi.
- source_word: חֲטִיטָא
  choice: Hatita
  rationale: Jina limetoholewa moja kwa moja kwa tahajia ya Kiswahili.
- source_word: שֹׁבָי
  choice: Shobai
  rationale: Tahajia hii inadumisha uwezekano wa matamshi unaoonyeshwa na vokali za Kimasora.
- source_word: הַכֹּל
  choice: wote walikuwa
  rationale: Katika jumla ya sensa, usemi huu unakusanya makundi yaliyotangulia. “Wote walikuwa” huingiza jumla hiyo kwa Kiswahili cha asili.
- source_word: מֵאָה שְׁלֹשִׁים וְתִשְׁעָה
  choice: mia moja thelathini na tisa
  rationale: Hii ni namna ya kawaida na iliyo wazi ya kuandika idadi 139 kwa Kiswahili.
theological_decisions: []
translation_notes:
  register: Mtindo ni wa orodha rasmi lakini unaosomeka kwa urahisi. Kurudiwa kwa “wana wa” kumehifadhiwa kwa sababu ni sehemu muhimu ya muundo wa chanzo na kunaonyesha makundi ya ukoo. Hakuna tanbihi inayohitajika katika mstari huu.
