base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/061.yaml
  text: 'And from among the sons of the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: sw
  text: 'Na miongoni mwa wana wa makuhani: wana wa Hobaya, wana wa Hakosi, na wana wa Barzilai, ambaye alioa mmoja wa binti za Barzilai Mgileadi, naye akaitwa kwa jina lao.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “naye akachukua jina lao.” Kiebrania kinasema kihalisi, “naye akaitwa kwa jina lao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי הַכֹּהֲנִים
  choice: Na miongoni mwa wana wa makuhani
  rationale: Kiambishi מן kina maana ya sehemu ya kundi, hivyo “miongoni mwa” kinaonyesha kwamba hawa walitoka katika wana wa makuhani. “Wana” kinadumisha mtindo wa nasaba wa Kiebrania.
- source_word: בְּנֵי חֳבַיָּה ... בְּנֵי הַקּוֹץ ... בְּנֵי בַרְזִלַּי
  choice: wana wa Hobaya, wana wa Hakosi, na wana wa Barzilai
  rationale: Marudio ya בְּנֵי yamehifadhiwa kwa “wana wa” ili kudumisha muundo wa orodha ya nasaba. Majina yameandikwa kwa namna inayofaa matamshi ya Kiswahili.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: Barzilai alikuwa amemwoa mmoja wa binti za
  rationale: Kirai לקח ... אשה ni nahau ya kuoa. “Alikuwa amemwoa” ni Kiswahili cha kawaida na huonyesha tendo lililotangulia kuitwa kwa jina; “mmoja wa binti” huweka wazi maana ya מן ya kuchagua mmoja miongoni mwao.
- source_word: בַּרְזִלַּי הַגִּלְעָדִי
  choice: Barzilai Mgileadi
  rationale: Kivumishi cha asili הַגִּלְעָדִי kimetafsiriwa kwa umbo la kawaida la Kiswahili “Mgileadi,” yaani mtu wa Gileadi.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: naye akaitwa kwa jina lao
  rationale: Kauli ya kutendwa ya קרא pamoja na על־שם imehifadhiwa kwa karibu. “Lao” linaendeleza wingi wa Kiebrania bila kuamua kwa ziada utaratibu halisi wa kijamii wa kuchukua jina hilo.
