  yaml_path: translation/ot/ezra/002/055.yaml
  text: 'the sons of Solomon’s servants: the sons of Sotai[a], the sons of Hassophereth, the sons of Peruda.'
translation:
  language: sw
  text: 'Wazao wa watumishi wa Sulemani: wazao wa Sotai, wazao wa Hasoferethi, wazao wa Peruda.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kiebrania ya Ezra yanasoma Peruda; orodha inayolingana katika Nehemia 7:57 ina Perida.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: wazao wa
  rationale: Katika orodha hii ya ukoo, neno hili linaonyesha familia au ukoo, si lazima wana wa kiume wa kizazi cha kwanza tu. “Wazao wa” ni Kiswahili cha kawaida na sahihi, huku urudiaji wake ukihifadhi mdundo wa orodha ya Kiebrania.
- source_word: עַבְדֵי
  choice: watumishi
  rationale: Ingawa neno la Kiebrania linaweza pia kumaanisha watumwa, hapa ni jina la kundi linalojulikana katika orodha ya waliorejea. “Watumishi” huhifadhi maana hiyo bila kusisitiza hali ya utumwa ambayo muktadha huu hauifafanui.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili cha Biblia.
- source_word: סֹטַי
  choice: Sotai
  rationale: Jina limenukuliwa kutoka Kiebrania kwa tahajia inayosomeka kwa Kiswahili bila kulitafsiri.
- source_word: הַסֹּפֶרֶת
  choice: Hasoferethi
  rationale: Umbo hili linawakilisha jina la Kiebrania pamoja na kiambishi chake kilichoungana, na limerekebishwa kwa tahajia na matamshi ya Kiswahili.
- source_word: פְרוּדָא
  choice: Peruda
  rationale: Maandishi ya Kiebrania ya Ezra katika WLC yanasoma Peruda; tofauti ya jina katika orodha sambamba imehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa orodha ya ukoo. “Wazao wa” ni cha asili zaidi kuliko “wana wa” katika kutaja makundi ya kifamilia na hakifungi maana kwa watoto wa moja kwa moja pekee. Majina yamenukuliwa kwa tahajia inayofaa Kiswahili.
