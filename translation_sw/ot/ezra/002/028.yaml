  rationale: Jina la mahali limetoholewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia badala ya kutafsiri maana yake.
- source_word: וְהָעָי
  choice: na Ai
  rationale: Kiunganishi kimetafsiriwa kuwa “na”; kibainishi cha Kiebrania hakihitajiki mbele ya jina hili la mahali katika Kiswahili.
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: mia mbili ishirini na watatu
  rationale: Hii ni namba ya kawaida 223; “watatu” inapatana kisarufi na wanaume wanaohesabiwa.
