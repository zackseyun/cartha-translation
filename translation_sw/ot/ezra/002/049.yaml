lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Ni umbo la wingi la neno ‘mwana’ katika hali ya kutegemea. Katika orodha hii ya ukoo, usemi huu mfupi unadumisha muundo unaorudiwa wa Kiebrania, huku ukiweza kumaanisha watu wa ukoo au wazao, si watoto wa moja kwa moja pekee.
- source_word: עֻזָּא
  choice: Uza
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: פָסֵחַ
  choice: Pasea
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida katika mapokeo ya Biblia ya Kiswahili; konsonanti ya mwisho ya Kiebrania haiwakilishwi kwa herufi tofauti katika tahajia hii.
- source_word: בֵסָי
  choice: Besai
  rationale: Jina la mtu limetoholewa kwa tahajia inayohifadhi matamshi ya mwisho ya jina la Kiebrania na iliyozoeleka katika Kiswahili.
