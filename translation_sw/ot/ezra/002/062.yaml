base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/062.yaml
  text: These sought their record among those enrolled by genealogy[a], but they were not found, and they were excluded from the priesthood.
translation:
  language: sw
  text: Hawa walitafuta majina yao katika orodha za nasaba, lakini hawakupatikana; wakatengwa na ukuhani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walihesabiwa kuwa najisi kwa habari ya ukuhani,” au, “walikataliwa kuwa makuhani.” Kitenzi cha Kiebrania kina wazo la kutendewa kama wasiostahili hadhi ya kikuhani kwa sababu nasaba yao haikuweza kuthibitishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa
  rationale: Kiwakilishi hiki cha wingi kinawarejelea waliodai kuwa wa ukoo wa kikuhani katika muktadha uliotangulia.
- source_word: בִּקְשׁוּ
  choice: walitafuta
  rationale: Kitenzi hiki humaanisha kutafuta; hapa kinahusu jitihada ya kupata uthibitisho katika kumbukumbu rasmi.
- source_word: כְתָבָם
  choice: hati yao
  rationale: Neno hili humaanisha maandishi au hati; katika muktadha huu ni hati iliyotarajiwa kuthibitisha nasaba yao.
- source_word: הַמִּתְיַחְשִׂים
  choice: katika orodha ya walioandikishwa kwa ukoo
  rationale: Muundo huu unahusu kuhesabiwa au kuandikishwa kwa msingi wa nasaba; tafsiri hii hudumisha maana ya kiutawala na ya kiukoo.
- source_word: וְלֹא נִמְצָאוּ
  choice: lakini hawakupatikana
  rationale: 'Kitenzi cha wingi kinawaelekea watu wenyewe: majina au uthibitisho wao haukuonekana katika orodha hiyo.'
- source_word: וַיְגֹאֲלוּ
  choice: waliondolewa
  rationale: Katika muktadha huu kitenzi kinaonyesha kutangazwa kuwa hawafai au kutiwa unajisi kwa habari ya hadhi ya kikuhani; 'waliondolewa' huonyesha matokeo ya kiutawala bila kufuta kabisa utata wa neno, ambao umeelezwa katika tanbihi.
- source_word: מִן הַכְּהֻנָּה
  choice: katika ukuhani
  rationale: Neno כְּהֻנָּה humaanisha ukuhani au cheo cha kikuhani; pamoja na 'waliondolewa,' Kiswahili cha kawaida hutumia 'katika ukuhani.'
theological_decisions:
- issue: Maana ya וַיְגֹאֲלוּ kuhusiana na hadhi ya kikuhani
  choice: waliondolewa katika ukuhani
  alternative: walihesabiwa kuwa najisi kwa habari ya ukuhani; walikataliwa kuwa makuhani
  rationale: Kitenzi cha Kiebrania kinaweza kuonyesha kutiwa unajisi au kuhesabiwa kutofaa. Muktadha unasisitiza matokeo—kutokubaliwa katika ukuhani kwa sababu nasaba haikuthibitishwa—lakini tanbihi huhifadhi maana mbadala yenye dhana ya unajisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. 'Hati,' 'orodha,' 'ukoo,' na 'ukuhani' huwasilisha mazingira ya kiutawala na kidini kwa uwazi bila kutumia istilahi nzito isivyo lazima.
