lexical_decisions:
- source_word: בְּנֵי
  choice: wazao wa
  rationale: Katika orodha hii neno hilo linataja kundi la kifamilia au ukoo, si lazima wana wa kiume wa kizazi cha kwanza; “wazao wa” ni wazi na la kawaida katika Kiswahili cha sasa.
- source_word: פַחַת מוֹאָב
  choice: Pahath-Moabu
  rationale: Ni jina maalumu la ukoo, kwa hiyo limetoholewa badala ya kutafsiriwa; “Moabu” linafuata umbo la majina ya kibiblia lililozoeleka katika Kiswahili.
- source_word: לִבְנֵי
  choice: wa ukoo wa
  rationale: Kiambishi לְ kinaunganisha kundi la Pahath-Moabu na tawi linalohusishwa na Yeshua na Yoabu. “Wa ukoo wa” linaeleza uhusiano huo kwa Kiswahili cha kawaida bila kuufanya kuwa wa wana wa moja kwa moja.
- source_word: יֵשׁוּעַ
  choice: Yeshua
  rationale: Umbo hili linatofautisha jina hili la kipindi cha baada ya uhamisho na umbo la kawaida “Yoshua,” huku likifuata kwa karibu matamshi ya Kiebrania.
- source_word: יוֹאָב
  choice: Yoabu
  rationale: Hili ni toleo la kawaida na linalosomeka kwa urahisi la jina la Kiebrania katika Kiswahili.
- source_word: אַלְפַּיִם שְׁמֹנֶה מֵאוֹת וּשְׁנֵים עָשָׂר
  choice: 2,812
  rationale: Namba ya Kiebrania ni elfu mbili mia nane na kumi na mbili; tarakimu zinafaa kwa uwazi na usomaji rahisi katika orodha ya sensa.
