id: EZR.2.69
reference: Ezra 2:69
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כְּ/כֹחָ֗/ם נָתְנוּ֮ לְ/אוֹצַ֣ר הַ/מְּלָאכָה֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שֵׁשׁ רִבֹּ֣אות וָ/אֶ֔לֶף וְ/כֶ֕סֶף מָנִ֖ים חֲמֵ֣שֶׁת אֲלָפִ֑ים וְ/כָתְנֹ֥ת כֹּהֲנִ֖ים מֵאָֽה־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/069.yaml
  text: 'According to their ability they gave to the treasury for the work: 61,000 gold darics[a], 5,000 minas of silver[b], and 100 priests’ tunics.'
translation:
  language: sw
  text: Kwa kadiri ya uwezo wao, walitoa kwa hazina ya kazi hiyo dariki 61,000 za dhahabu[a], mina 5,000 za fedha[b], na kanzu 100 za makuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sarafu za dhahabu”; neno la Kiebrania linarejelea hasa dariki za Uajemi.
    reason: lexical_alternative
  - marker: b
    text: Mina ilikuwa kipimo cha kale cha uzito na pia cha thamani ya fedha.
    reason: cultural_note
lexical_decisions:
- source_word: כְּכֹחָם
  choice: Kwa kadiri ya uwezo wao
  rationale: Muundo huu unaonyesha kipimo au uwiano wa utoaji wao kulingana na uwezo waliokuwa nao, bila kuufanya useme tu kuhusu nguvu za mwili.
- source_word: נָתְנוּ
  choice: walitoa
  rationale: Hili ni neno la kawaida na la moja kwa moja kwa tendo la kutoa, bila kuongeza maana isiyokuwamo katika chanzo.
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: kwa hazina ya kazi hiyo
  rationale: אוֹצָר ni hazina au ghala, na מְלָאכָה hapa ni kazi ya ujenzi; tafsiri hii inaonyesha kuwa mali hiyo ilitengwa kwa mradi huo.
- source_word: דַּרְכְּמוֹנִים
  choice: dariki
  rationale: Neno hili la mkopo linarejelea sarafu maalumu ya dhahabu ya Uajemi; jina la kihistoria limehifadhiwa, huku tanbihi ikitoa ufafanuzi.
- source_word: שֵׁשׁ רִבֹּאות וָאֶלֶף
  choice: 61,000
  rationale: Kiebrania kinasema kihalisi makumi ya maelfu sita na elfu moja; tarakimu ni sahihi na rahisi kusoma katika orodha.
- source_word: מָנִים
  choice: mina
  rationale: מָנֶה ni kipimo cha kale cha uzito na thamani; jina la kipimo limehifadhiwa badala ya kutumia kipimo cha kisasa kisicho sawa kabisa.
- source_word: חֲמֵשֶׁת אֲלָפִים
  choice: 5,000
  rationale: Tarakimu inaonyesha idadi hiyo kwa uwazi na inalingana na mtindo wa orodha.
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: na kanzu 100 za makuhani
  rationale: כָתְנֹת humaanisha kanzu au vazi refu la ndani; “kanzu” ni neno mahususi zaidi kuliko “mavazi” na muundo “za makuhani” huhifadhi uwezekano wa kuwa zilikuwa za makuhani au zilikusudiwa kwao.
- source_word: מֵאָה
  choice: '100'
  rationale: Tarakimu ni wazi na inafuata mtindo wa idadi nyingine katika mstari.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kwa msomaji wa kawaida, huku majina ya vipimo na sarafu za kale yakihifadhiwa na kufafanuliwa katika tanbihi.
