  source_fidelity: 'Tafsiri inafuata kwa usahihi Kiebrania: mchango ulitolewa kwa kadiri ya uwezo wao, kwa hazina ya kazi; kiasi cha dariki 61,000 za dhahabu, mina 5,000 za fedha, na kanzu 100 za makuhani kimehifadhiwa. Mpangilio wa vipengele na uhusiano wa ''za makuhani'' hauongezi tafsiri isiyopo katika chanzo.'
