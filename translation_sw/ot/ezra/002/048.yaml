  text: בְּנֵי רְצִ֥ין בְּנֵי נְקוֹדָ֖א בְּנֵ֥י גַזָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/048.yaml
  text: the sons of Rezin[a], the sons of Nekoda, the sons of Gazzam;
translation:
  language: sw
  text: wana wa Resini[a], wana wa Nekoda, wana wa Gazamu;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazao wa” katika kila sehemu inayorudia maneno “wana wa,” kwa sababu usemi huo unaweza kumaanisha ukoo au kundi la kifamilia, wala si wana wa kiume wa moja kwa moja tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya nasaba, umbo hili linaweza kumaanisha wana wa kiume au kwa upana zaidi watu wa ukoo wa mtu aliyetajwa. “Wana wa” huhifadhi muundo wa Kiebrania na ni usemi wa kawaida, huku tanbihi ikionyesha maana pana inayowezekana.
- source_word: רְצִין
  choice: Resini
  rationale: Jina maalumu limetoholewa kwa tahajia ya Kiswahili inayokaribia matamshi ya Kiebrania.
- source_word: נְקוֹדָא
  choice: Nekoda
  rationale: Jina maalumu limetoholewa bila kutafsiriwa; umbo “Nekoda” linaakisi vokali za maandishi ya WLC.
- source_word: גַזָּם
  choice: Gazamu
  rationale: Jina maalumu limetoholewa kwa muundo unaotamkika kiasili katika Kiswahili; konsonanti maradufu ya Kiebrania haihitaji kuwakilishwa kwa herufi maradufu katika tahajia ya kawaida ya Kiswahili.
