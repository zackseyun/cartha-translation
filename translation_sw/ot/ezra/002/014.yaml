  register: Mtindo ni mfupi na wa heshima, unaofaa orodha ya sensa na nasaba. “Wana wa” linaweza kumaanisha wana wa moja kwa moja au wazao/wanaukoo katika muktadha huu bila kulazimisha ufafanuzi mmoja.
