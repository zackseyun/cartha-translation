  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii neno hilo linatambulisha ukoo au kundi la wazao; “wana wa” linadumisha muundo wa Kiebrania na ni la kawaida katika sajili ya kibiblia.
- source_word: בִגְוָי
  choice: Bigwai
  rationale: Ni jina la mtu au ukoo, hivyo limetoholewa badala ya kutafsiriwa; “w” linawakilisha kwa kawaida sauti ya herufi ya Kiebrania waw katika Kiswahili.
- source_word: אַלְפַּיִם
  choice: elfu mbili
  rationale: Ni idadi ya watu elfu mbili, iliyotolewa moja kwa moja katika mpangilio wa kawaida wa Kiswahili.
- source_word: חֲמִשִּׁים
  choice: hamsini
  rationale: Namba ya msingi yenye maana ya hamsini.
- source_word: וְשִׁשָּׁה
  choice: na sita
  rationale: Kiunganishi pamoja na namba sita; muundo “hamsini na sita” ni wa kawaida na pia huhifadhi uunganishaji wa Kiebrania.
