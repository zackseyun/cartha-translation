  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם וּֽ/מִן הָ/עָ֞ם וְ/הַ/מְשֹׁרְרִ֧ים וְ/הַ/שּׁוֹעֲרִ֛ים וְ/הַ/נְּתִינִ֖ים בְּ/עָרֵי/הֶ֑ם וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/070.yaml
  text: So the priests[a], the Levites, some of the people, the singers, the gatekeepers, and the temple servants lived in their cities, and all Israel lived in their cities.
translation:
  language: sw
  text: Basi makuhani, Walawi, baadhi ya watu, waimbaji, walinda malango na watumishi wa hekalu[a] wakaishi katika miji yao; nao Waisraeli wote wakaishi katika miji yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Wanethini,” jina maalumu la kundi lililowekwa kwa ajili ya huduma ya hekalu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: wakaishi
  rationale: Katika muktadha huu, kitenzi ישׁב kinaonyesha kukaa au kuanza kuishi mahali; “wakaishi” ni usemi wa kawaida na pia unafaa kwa kishazi kinachorudiwa mwishoni.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kundi la makuhani katika huduma ya ibada.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Linataja kundi la Walawi lililotofautishwa hapa na makuhani.
- source_word: וּמִן הָעָם
  choice: baadhi ya watu
  rationale: Kihusishi מן kimetumiwa kwa maana ya sehemu ya kundi; tafsiri hii inaonyesha wazi kwamba ni baadhi tu ya watu wengine.
- source_word: הַמְשֹׁרְרִים
  choice: waimbaji
  rationale: Neno hili linawataja watu waliokuwa na jukumu la kuimba, hasa katika huduma ya hekalu.
- source_word: הַשּׁוֹעֲרִים
  choice: walinda malango
  rationale: Tafsiri hii inaeleza kwa Kiswahili cha sasa watu waliokuwa wakihudumia na kulinda malango.
- source_word: הַנְּתִינִים
  choice: watumishi wa hekalu
  rationale: Hili ni jina maalumu la kundi lililopewa kazi za huduma ya hekalu; kutaja jukumu lao kunaeleweka vizuri zaidi kuliko kuacha neno la Kiebrania bila tafsiri.
- source_word: בְּעָרֵיהֶם
  choice: katika miji yao
  rationale: עיר inaweza kuwa mji wa ukubwa tofauti; “miji” huhifadhi usemi wa kawaida wa kijiografia katika Biblia.
- source_word: וְכָל יִשְׂרָאֵל
  choice: nao Waisraeli wote
  rationale: Usemi huu unaliwakilisha kwa kawaida na kwa uwazi kundi lote linaloitwa Israeli katika muktadha huu.
- source_word: בְּעָרֵיהֶם
  choice: wakaishi katika miji yao
  rationale: Kiebrania kinaacha kitenzi katika kishazi cha pili kitegemee kitenzi cha kwanza; kukirudia kwa Kiswahili kunafanya sentensi iwe wazi na ya kawaida.
theological_decisions:
- issue: Tafsiri ya jina maalumu הַנְּתִינִים
  choice: watumishi wa hekalu
  alternative: Wanethini
  rationale: Tafsiri kuu inaeleza kazi ya kundi hili kwa msomaji wa kawaida bila kudai zaidi ya ushahidi wa muktadha. Jina la jadi la kundi hilo limehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa orodha na urudiaji wa “katika miji yao” umehifadhiwa ili kufuata msisitizo wa Kiebrania.
