  text: wana wa Gideli, wana wa Gahari, wana wa Reaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Ni wingi wa hali ya kuambatanisha wa בֵּן katika orodha ya ukoo; hapa humaanisha wana au wazao wa mkuu wa familia, na “wana wa” huhifadhi muundo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: גִדֵּל
  choice: Gideli
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, huku konsonanti na vokali kuu za jina la Kiebrania zikihifadhiwa.
- source_word: גַחַר
  choice: Gahari
  rationale: Jina la mtu limetoholewa kwa mfumo wa silabi unaofaa Kiswahili; h ya Kiebrania imehifadhiwa badala ya kubadilishwa kuwa sauti nyingine.
- source_word: רְאָיָה
  choice: Reaya
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka umbo la Kiebrania, likihifadhi mfuatano wa vokali kwa kadiri inayowezekana katika tahajia ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Mtindo mfupi na wenye hadhi wa orodha ya ukoo umehifadhiwa. Kurudiwa kwa “wana wa” kunaakisi kwa makusudi muundo wa chanzo. Hakuna alama ya tanbihi iliyowekwa, kwa kuwa tofauti ya Kiingereza “Reaiah/Raiah” ni suala la utaratibu wa utohozi wa Kiingereza, si tofauti ya maana katika chanzo cha Kiebrania.
