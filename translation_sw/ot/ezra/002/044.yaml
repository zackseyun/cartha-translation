lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya ukoo, neno hili ni fomula ya kawaida inayoweza kumaanisha wazao au watu wa jamaa iliyopewa jina. “Wana wa” huhifadhi muundo unaorudiwa wa Kiebrania na ni Kiswahili cha kawaida katika orodha za ukoo.
- source_word: קֵרֹס
  choice: Keros
  rationale: Ni jina la mtu au jamaa; limetoholewa kwa kufuata umbo la Kiebrania badala ya kutafsiriwa.
- source_word: סִיעֲהָא
  choice: Siaha
  rationale: Ni jina katika orodha ya jamaa za watumishi wa Hekalu. “Siaha” linaakisi umbo la matini ya Kiebrania ya WLC, bila kufupisha jina kutokana na mapokeo sambamba.
- source_word: פָדוֹן
  choice: Padoni
  rationale: Ni jina la mtu au jamaa. “Padoni” ni utohozi wa Kiswahili unaoakisi matamshi ya Kiebrania huku ukitumia irabu ya mwisho inayorahisisha matamshi ya kawaida ya Kiswahili.
