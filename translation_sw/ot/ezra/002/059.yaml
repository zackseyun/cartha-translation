translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yameandikwa kwa mfumo wa sauti unaofaa Kiswahili; muundo wa ukoo wa upande wa baba umehifadhiwa na kufafanuliwa kwa tanbihi.
