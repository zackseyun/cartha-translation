base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/059.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addan, and Immer, but they were not able to declare their fathers’ house and their offspring, whether they were from Israel.
translation:
  language: sw
  text: Nao hawa ndio waliopanda kutoka Tel-Mela, Tel-Harsha, Kerubu, Adani, na Imeri; lakini hawakuweza kuonyesha nyumba ya baba zao na wazao wao,[a] kama walikuwa wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukoo wao wa upande wa baba na wazao wao.” Usemi wa Kiebrania “nyumba ya baba” unarejelea nasaba inayofuatwa kwa upande wa baba.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹלִים
  choice: waliopanda
  rationale: Kitenzi עלה katika muktadha huu wa waliohamia Yuda baada ya uhamisho kina maana ya kupanda kwenda katika nchi; ‘waliopanda’ huhifadhi taswira ya kijiografia bila kuongeza wazi dhana ya ‘waliorudi.’
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדָּן אִמֵּר
  choice: kutoka Tel-Mela, Tel-Harsha, Kerubu, Adani na Imeri
  rationale: Majina haya yamenukuliwa kifonetiki kama majina ya mahali au koo, kwa tahajia inayosomeka kwa Kiswahili.
- source_word: לֹא יָכְלוּ לְהַגִּיד
  choice: hawakuweza kuthibitisha
  rationale: Katika orodha hii ya kiutawala, נגד ina wazo la kutoa au kuonyesha taarifa ya ukoo. ‘Kuthibitisha’ huwasilisha kwa kawaida kutoweza kwao kuonyesha dai lao la nasaba, bila kudai kwamba tatizo lilikuwa la kusema tu.
- source_word: בֵּית אֲבוֹתָם
  choice: ukoo wa nyumba za baba zao
  rationale: Hili ni tamko la kiufundi kuhusu jamaa au nasaba inayofuatwa kwa upande wa baba. Tafsiri hii huhifadhi taswira ya ‘nyumba ya baba’ huku ‘ukoo’ ikifafanua maana yake kwa msomaji wa sasa.
- source_word: וְזַרְעָם
  choice: na asili yao
  rationale: זרע hapa huhusu chimbuko au mstari wa uzao unaotumiwa kuthibitisha utambulisho wao; ‘asili yao’ ni ya kawaida katika Kiswahili na haileti taswira isiyofaa ya ‘mbegu.’
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: ikiwa walikuwa Waisraeli
  rationale: Kirai hiki kinaonyesha kutokuwa na uhakika kuhusu nasaba yao ya Kiisraeli. ‘Ikiwa walikuwa Waisraeli’ ni wazi na cha kawaida bila kutatua kutokuwa na uhakika huko.
