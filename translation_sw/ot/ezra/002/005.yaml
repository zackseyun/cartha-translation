  rationale: Katika orodha hii ya waliorejea, neno hili linatambulisha ukoo au jamaa inayohusishwa na babu aliyetajwa. “Wana wa” ni tafsiri ya moja kwa moja na ya kawaida katika mtindo wa kibiblia, bila kulazimisha maana ya watoto wa kiume wa kizazi cha kwanza pekee.
- source_word: אָרַח
  choice: Ara
  rationale: Jina la mtu au ukoo limetoholewa kwa tahajia inayosomeka kwa Kiswahili badala ya kutafsiriwa kimaana.
- source_word: שְׁבַע מֵאוֹת חֲמִשָּׁה וְשִׁבְעִים
  choice: mia saba sabini na watano
  rationale: Hesabu ya Kiebrania ni 700 + 5 + 70, yaani 775. Mpangilio umewekwa kwa Kiswahili cha kawaida, na “watano” hutumiwa kwa kuwa wanaohesabiwa ni watu.
