  rationale: Katika orodha hii ya ukoo na sensa, neno hili linaonyesha watu wa familia au ukoo fulani, si lazima wana wa moja kwa moja; “wazao wa” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: אָטֵר
