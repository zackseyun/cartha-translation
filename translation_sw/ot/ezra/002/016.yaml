  rationale: Ni jina la mtu au familia; limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: לִיחִזְקִיָּה
  choice: wa ukoo wa Hezekia
  rationale: Kiambishi לִ־ hapa kinaonyesha uhusiano au tawi la familia. Kauli hii inaweka wazi kwa Kiswahili kwamba hawa ni wazao wa Ateri waliohusishwa na ukoo wa Hezekia, bila kulifanya jina Hezekia kuwa sifa ya Ateri.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: tisini na wanane
  rationale: Hili ndilo umbo la kawaida la idadi 98 katika Kiswahili Sanifu.
