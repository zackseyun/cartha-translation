lexical_decisions:
- source_word: אַנְשֵׁי
  choice: watu wa
  rationale: Ni umbo la wingi la hali ya kuambatanisha la אִישׁ. Katika orodha hii ya sensa linamaanisha wanajamii wa kiume wa mahali hapo; Kiswahili cha kawaida hutumia “watu wa” kwa kundi la wakazi bila kulazimisha “wanaume wa,” ambayo hapa inaweza kusikika kama inasisitiza jinsia kuliko utambulisho wa kundi.
- source_word: עֲנָתוֹת
  choice: Anathothi
  rationale: Ni jina la mahali. Limeandikwa kwa tahajia ya Kiswahili yenye vokali ya mwisho ili litamkike kwa urahisi na kwa mtindo unaotumiwa kwa kawaida katika majina ya Biblia ya Kiswahili.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: mia moja ishirini na wanane
  rationale: Ni hesabu ya kardinali, 128. Imeandikwa kwa maneno kwa Kiswahili cha kawaida; “wanane” inapatana na kundi la watu linalohesabiwa.
