lexical_decisions:
- source_word: בְּנֵי
  choice: wazao wa
  rationale: Katika orodha hii ya koo za waliorejea, neno hili linaonyesha watu wa ukoo au familia fulani. “Wazao wa” ni Kiswahili cha kawaida na sahihi zaidi kuliko “wana wa,” ambacho kingeweza kueleweka kuwa wana wa moja kwa moja tu.
- source_word: חָגָב
  choice: Hagabu
  rationale: Jina la mtu au ukoo limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likifuatisha umbo la Kiebrania.
- source_word: שמלי
  choice: Shamlai
  rationale: Jina limetoholewa kwa kufuata kwa karibu konsonanti za maandishi ya Kiebrania. Umbo “Shalmai” ni tofauti inayojulikana na limehifadhiwa katika tanbihi.
- source_word: חָנָן
  choice: Hanani
  rationale: Jina la mtu au ukoo limetoholewa kwa namna ya kawaida katika Kiswahili, kwa vokali ya mwisho inayorahisisha matamshi.
theological_decisions: []
translation_notes:
  register: Mtindo ni wa orodha rasmi ya nasaba lakini umetumia “wazao wa” ili kueleza kwa kawaida makundi ya kifamilia au koo. Majina yametoholewa kwa tahajia inayofaa Kiswahili cha Afrika Mashariki.
