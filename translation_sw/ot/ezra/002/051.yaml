- source_word: בַקְבּוּק
  choice: Bakbuki
  rationale: Jina la pekee limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili; irabu ya mwisho hurahisisha muundo wa Kiswahili.
- source_word: חֲקוּפָא
  choice: Hakufa
  rationale: Jina la pekee limetoholewa moja kwa moja; herufi ya Kiebrania פ hapa ina matamshi ya /f/.
- source_word: חַרְחוּר
  choice: Harhuri
  rationale: Jina la pekee limetoholewa kwa kufuata konsonanti za Kiebrania na muundo wa kawaida wa matamshi ya Kiswahili.
