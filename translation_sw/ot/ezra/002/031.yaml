  choice: Elamu
  rationale: Jina maalumu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אַחֵר
  choice: mwingine
  rationale: Neno hili linatofautisha kundi hili la Elamu na lile lililotajwa mapema, huku likihifadhi uwezekano wa kuelewa ama “Elamu mwingine” ama “kundi jingine” la Elamu.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254
  rationale: Mfuatano wa namba za Kiebrania unatoa jumla kamili ya 1,254; tarakimu zinafaa kwa urahisi wa kusoma orodha ya sensa.
