lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya waliorejea, neno hili linatambulisha kundi linalohusishwa na ukoo au mahali. “Wana wa” linahifadhi muundo unaorudiwa wa Kiebrania na linaeleweka kwa Kiswahili, bila kulazimisha uamuzi kati ya ukoo na mahali.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Ni jina la pekee la mahali au ukoo, kwa hiyo limetoholewa kwa herufi za Kiswahili badala ya kutafsiriwa.
- source_word: חֲמִשִּׁים וּשְׁנָיִם
  choice: hamsini na wawili
  rationale: Hii ndiyo namna ya kawaida na ya asili ya kutaja idadi ya watu 52 kwa Kiswahili cha sasa.
