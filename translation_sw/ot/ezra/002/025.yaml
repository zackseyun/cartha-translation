lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Muundo huu huhifadhi namna rasmi ya orodha ya Kiebrania, huku ukieleweka kuwa unarejelea watu waliotokana na au waliohusishwa na maeneo yaliyotajwa.
- source_word: קִרְיַת עָרִים
  choice: Kiriath-arimu
  rationale: Ni jina la mahali; limetoholewa kwa mwandiko wa Kiswahili badala ya kutafsiriwa.
- source_word: כְּפִירָה
  choice: Kefira
  rationale: Ni jina la mahali; 'Kefira' linaakisi matamshi ya Kiebrania kwa namna ya kawaida na inayosomeka katika Kiswahili.
- source_word: וּבְאֵרוֹת
  choice: na Beerothi
  rationale: Kiunganishi וּ kimetafsiriwa wazi kuwa 'na'; jina la mahali limetoholewa kwa umbo linalosomeka katika Kiswahili.
- source_word: שְׁבַע מֵאוֹת וְאַרְבָּעִים וּשְׁלֹשָׁה
  choice: '743'
  rationale: Tarakimu hudumisha idadi kamili na hufanya orodha ya sensa isomeke kwa urahisi.
