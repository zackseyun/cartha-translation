lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Ni wingi wa hali ya kuambatana wa neno ‘wana’; katika orodha hii ya sensa linaweza kumaanisha wana au wazao wa kundi fulani. ‘Wana wa’ huhifadhi mtindo rasmi na utata huo.
- source_word: סְנָאָה
  choice: Senaa
  rationale: Ni jina maalumu, hivyo limetoholewa kwa kufuata umbo la Kiebrania badala ya kutafsiriwa.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: elfu tatu
  rationale: Hii ndiyo namna ya kawaida na wazi ya kutaja idadi hiyo kwa Kiswahili.
- source_word: וְשֵׁשׁ מֵאוֹת
  choice: mia sita
  rationale: Kiunganishi cha Kiebrania ni sehemu ya muundo wa kujumlisha idadi; katika Kiswahili, vipashio vya idadi huunganishwa kwa kawaida bila kurudia ‘na’ hapa.
- source_word: וּשְׁלֹשִׁים
  choice: thelathini
  rationale: Kipashio cha mwisho kinakamilisha jumla ya 3,630; Kiswahili sanifu kwa kawaida husema ‘elfu tatu mia sita thelathini’.
