translation:
  language: sw
  text: 'Makuhani: wana wa Yedaya[a], wa nyumba ya Yeshua[b], 973.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazao wa Yedaya.” Kiebrania kinasema kihalisi “wana wa Yedaya,” usemi wa kawaida katika nasaba.
    reason: lexical_alternative
  - marker: b
    text: Yeshua ni jina la mtu lililotumiwa baada ya uhamisho na linahusiana na jina Yoshua.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Makuhani
  rationale: Nomino ya wingi yenye kiainishi, ikitambulisha kundi la makuhani linalohesabiwa katika orodha hii.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Huhifadhi usemi halisi wa Kiebrania wa kizazi; katika orodha za nasaba unaweza pia kumaanisha wazao au watu wa ukoo.
- source_word: יְדַעְיָה
  choice: Yedaya
  rationale: Jina limetoholewa kwa kufuata umbo la Kiebrania na tahajia ya kawaida ya Kiswahili.
- source_word: לְבֵית
  choice: wa nyumba ya
  rationale: Kihusishi pamoja na 'nyumba' kinaonyesha uhusiano na ukoo au jamaa fulani.
- source_word: יֵשׁוּעַ
  choice: Yeshua
  rationale: Jina limetoholewa moja kwa moja kutoka umbo la Kiebrania la kipindi cha baada ya uhamisho, bila kulibadilisha kuwa Yoshua.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: '973'
  rationale: Mfuatano wa namba za Kiebrania una jumla ya 973; tarakimu zinafaa kwa usomaji rahisi katika orodha ya sensa.
