  text: 'Waimbaji: wana wa Asafu, mia moja ishirini na wanane.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: Waimbaji
  rationale: Neno hili ni umbo la kushiriki linalotokana na שׁיר, ‘kuimba,’ na hapa linamaanisha watu wenye jukumu la kuimba. ‘Waimbaji’ ni tafsiri ya moja kwa moja na ya kawaida; ‘wanamuziki’ ni pana mno, na ‘waimbaji wa Hekalu’ ingeongeza maelezo yasiyotajwa wazi katika mstari huu.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha za nasaba na koo, בְּנֵי hutambulisha watu wa ukoo au kundi linalohusishwa na babu au mwanzilishi fulani. ‘Wana wa’ huhifadhi muundo wa Kiebrania na inaeleweka katika mtindo wa kibiblia wa Kiswahili, bila kulazimisha maana pana ya ‘wazao.’
- source_word: אָסָף
  choice: Asafu
  rationale: Jina hili limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: mia moja ishirini na wanane
  rationale: Mpangilio wa idadi katika Kiebrania ni 100 + 20 + 8. Usemi huu ni wa kawaida na wazi katika Kiswahili Sanifu.
