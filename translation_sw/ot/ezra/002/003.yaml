  rationale: Hili ni jina la mtu au ukoo; limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: אַלְפַּיִם מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: 2,172
  rationale: Mfuatano wa namba za Kiebrania unatoa jumla kamili ya 2,172. Tarakimu zimetumiwa ili kurahisisha usomaji katika orodha ya sensa.
