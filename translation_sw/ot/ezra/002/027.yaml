  choice: Wanaume wa
  rationale: Ni umbo la wingi katika hali ya kutegemea la אִישׁ. Katika orodha hii ya sensa linamaanisha wanaume au wawakilishi wa kaya waliohusishwa na mahali panapotajwa.
- source_word: מִכְמָס
  choice: Mikmasi
  rationale: Ni jina la mahali. Limeandikwa kwa namna inayokaribia matamshi ya Kiebrania huku likifuata muundo wa kawaida wa majina ya kibiblia katika Kiswahili.
- source_word: מֵאָה עֶשְׂרִים וּשְׁנָיִם
  choice: mia moja ishirini na wawili
  rationale: 'Mfuatano wa namba katika Kiebrania ni wa kujumlisha: 100 + 20 + 2. Upatanisho wa ''wawili'' unarejelea wanaume wanaohesabiwa.'
