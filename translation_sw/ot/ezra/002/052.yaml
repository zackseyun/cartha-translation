  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza pia kutafsiriwa “wana wa” katika kila sehemu; katika orodha hii, בְּנֵי mara nyingi humaanisha watu wa ukoo au nasaba, si wana wa moja kwa moja tu.
