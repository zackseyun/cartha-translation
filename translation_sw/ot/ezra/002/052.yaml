lexical_decisions:
- source_word: בְּנֵי
  choice: wazao wa
  rationale: Katika orodha hii, neno hili ni fomula ya ukoo inayomaanisha watu wa familia au nasaba fulani, si lazima wana wa moja kwa moja. “Wazao wa” linaonyesha maana hiyo kwa Kiswahili cha kawaida na linafaa kurudiwa kwa kila kundi.
- source_word: בַצְלוּת
  choice: Basluthi
  rationale: Jina limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili; צ limewakilishwa kwa “s,” na ת ya mwisho kwa “thi” ili kukaribia umbo la Kiebrania bila kulitafsiri.
- source_word: מְחִידָא
  choice: Mehida
  rationale: Jina limetoholewa badala ya kutafsiriwa; “h” linawakilisha ח kwa namna inayosomeka kwa urahisi katika Kiswahili.
- source_word: חַרְשָׁא
  choice: Harsha
  rationale: Jina limetoholewa kwa umbo linalosomeka katika Kiswahili; alefu ya mwisho haijapewa sauti tofauti kwa kuwa haina konsonanti inayotamkwa hapa.
