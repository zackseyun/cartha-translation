  yaml_path: translation/ot/ezra/001/009.yaml
  text: 'And this was their number: 30 gold basins[a], 1,000 silver basins, and 29 knives.'
translation:
  language: sw
  text: 'Na hii ndiyo hesabu yake: mabakuli ya dhahabu 30, mabakuli ya fedha 1,000, na visu 29.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda “vyombo vingine 29,” “vyombo 29 vinavyofanana,” au “vyombo 29 vya badala”; maana ya neno la Kiebrania haina uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה מִסְפָּרָם
  choice: Hii ndiyo ilikuwa hesabu yake
  rationale: Ingawa וְאֵלֶּה ni wingi kihalisi, kishazi hiki kinatanguliza orodha moja; Kiswahili cha kawaida hutumia muundo wa umoja. Kiambishi cha wingi katika מִסְפָּרָם kinarejelea jumla ya vyombo, lakini 'hesabu yake' hurejelea orodha/jumla hiyo kwa mtiririko wa asili.
- source_word: אֲגַרְטְלֵי
  choice: mabakuli
  rationale: Neno hili linataja vyombo vya hekalu vya aina ya bakuli au beseni. 'Mabakuli' ni neno la kawaida na wazi bila kudai umbo au matumizi mahususi yasiyothibitishwa.
- source_word: זָהָב / כֶסֶף
  choice: dhahabu / fedha
  rationale: Hutaja malighafi ya vyombo katika orodha.
- source_word: שְׁלֹשִׁים / אָלֶף / תִּשְׁעָה וְעֶשְׂרִים
  choice: 30 / 1,000 / 29
  rationale: Tarakimu zimetumiwa ili orodha ya hesabu isomeke kwa urahisi na kwa uthabiti.
- source_word: מַחֲלָפִים
  choice: visu
  rationale: Neno la Kiebrania ni gumu na maana yake haina uhakika. 'Visu' ni tafsiri ya jadi inayowezekana katika muktadha wa vifaa vya ibada, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
