id: EZR.1.2
reference: Ezra 1:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֗ר כֹּ֚רֶשׁ מֶ֣לֶךְ פָּרַ֔ס כֹּ֚ל מַמְלְכ֣וֹת הָ/אָ֔רֶץ נָ֣תַן לִ֔/י יְהוָ֖ה אֱלֹהֵ֣י הַ/שָּׁמָ֑יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֥ר בִּֽ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/002.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has appointed me to build a house for him in Jerusalem[b], which is in Judah.'
translation:
  language: sw
  text: '“Hivi ndivyo asemavyo Koreshi, mfalme wa Uajemi: ‘Yahwe, Mungu wa mbinguni, amenipa falme zote za dunia, naye ameniagiza[a] nimjengee nyumba[b] katika Yerusalemu, ulio katika Yuda.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ameniteua kujenga.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, hekalu la Yerusalemu.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Hivi ndivyo asemavyo
  rationale: Ni fomula rasmi ya kutangaza maneno ya mfalme au nabii. Kauli hii inadumisha uzito wa tangazo huku ikibaki ya asili katika Kiswahili cha Biblia.
- source_word: כֹּרֶשׁ מֶלֶךְ פָּרַס
  choice: Koreshi, mfalme wa Uajemi
  rationale: Koreshi na Uajemi ni maumbo yaliyozoeleka katika Kiswahili kwa Cyrus na Persia; kibainishi cha cheo cha kifalme kimetafsiriwa wazi.
- source_word: כֹּל מַמְלְכוֹת הָאָרֶץ
  choice: falme zote za dunia
  rationale: Wingi wa מַמְלְכוֹת umehifadhiwa. Katika tangazo hili la kifalme, הָאָרֶץ lina maana pana ya dunia, si eneo moja tu.
- source_word: נָתַן לִי
  choice: amenipa
  rationale: 'Wakati timilifu wa Kiswahili unaonyesha tendo lililotokea na matokeo yake yanayoendelea: Koreshi sasa anatawala falme hizo.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limenakiliwa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA.’ ‘Yahwe’ ni tahajia ya kawaida na inayosomeka kwa Kiswahili.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Mungu wa mbinguni
  rationale: Hii ndiyo namna ya asili ya Kiswahili ya kutafsiri cheo hiki; wingi wa Kiebrania הַשָּׁמַיִם hauhitaji kuonyeshwa kwa ‘mbingu’ katika kauli hii.
- source_word: וְהוּא
  choice: naye
  rationale: Kiunganishi pamoja na kiwakilishi huru cha Kiebrania kinaendelezwa kwa ‘naye,’ ambacho huonyesha mwendelezo na msisitizo wa mhusika kwa ufasaha.
- source_word: פָקַד עָלַי
  choice: ameniagiza
  rationale: Katika muktadha huu kitenzi kinaonyesha kupewa wajibu au agizo. ‘Ameniagiza’ ni wazi na ya asili, huku maana mbadala ya kukabidhiwa wajibu ikihifadhiwa katika tanbihi.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: nimjengee nyumba
  rationale: ‘Nimjengee’ huonyesha kwa ufupi na kwa kawaida kwamba nyumba inajengwa kwa ajili yake. בַיִת limetafsiriwa kwa maana yake ya moja kwa moja ‘nyumba,’ bila kulibadili kimafasiri kuwa ‘hekalu’ katika matini kuu.
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: huko Yerusalemu, ulioko Yuda
  rationale: Kishazi cha mahali na kishazi rejeshi vimehifadhiwa. ‘Ulioko’ linarejelea mji wa Yerusalemu unaoeleweka katika muktadha.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu. Kulihifadhi kama ‘Yahwe’ kunatofautisha jina hilo na cheo ‘Bwana’ bila kuingiza mapokeo ya dhehebu fulani.
- issue: Ikiwa בַיִת litafsiriwe ‘nyumba’ au ‘hekalu’
  choice: nyumba
  alternative: hekalu
  rationale: ‘Nyumba’ huhifadhi maana ya moja kwa moja ya neno la Kiebrania na lugha ya agizo la Koreshi. Muktadha unaonyesha kuwa ni hekalu, jambo linalofafanuliwa katika tanbihi bila kubana matini kuu.
- issue: Nguvu ya פָקַד עָלַי
  choice: ameniagiza
  alternative: amenikabidhi jukumu; ameniteua
  rationale: Kitenzi kinaweza kueleza agizo au kukabidhi wajibu. ‘Ameniagiza’ linafaa kwa tangazo la kifalme, lakini tanbihi inahifadhi uwezekano wa maana ya kukabidhi wajibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye hadhi ya tangazo la kifalme, lakini kinachoeleweka kwa msomaji wa kawaida. Kauli ‘Hivi ndivyo asemavyo’ inadumisha mtindo rasmi wa Kiebrania; msamiati mwingine ni wa sasa na wa kawaida. Alama za tanbihi zimewekwa karibu na maneno yanayofafanuliwa.
