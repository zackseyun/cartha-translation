  text: 30 gold bowls[a], 410 silver bowls of a second kind, and 1,000 other vessels.
translation:
  language: sw
  text: Mabakuli 30 ya dhahabu, mabakuli 410 ya fedha ya aina ya pili[a], na vyombo vingine 1,000.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mabakuli ya fedha maradufu, 410.” Maana ya neno la Kiebrania lililotafsiriwa “ya aina ya pili” haijulikani kwa hakika katika orodha hii; huenda likamaanisha kundi la pili, nakala, au umbo la maradufu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפוֹרֵי
  choice: mabakuli
  rationale: Nomino hii hutaja aina ya chombo. “Mabakuli” ni neno la kawaida na linaloeleweka katika orodha hii bila kubainisha kupita kiasi umbo au matumizi yake.
- source_word: זָהָב
  choice: ya dhahabu
  rationale: Neno la kawaida la nyenzo; hapa linaeleza mabakuli yalitengenezwa kwa dhahabu.
- source_word: שְׁלֹשִׁים
  choice: '30'
  rationale: Nambari imetolewa kwa tarakimu ili orodha ya hesabu isomeke kwa urahisi.
- source_word: כְּפוֹרֵי כֶסֶף
  choice: mabakuli ya fedha
  rationale: Neno la chombo limetafsiriwa kwa uthabiti kama “mabakuli,” na כֶסֶף inaonyesha nyenzo yake, fedha.
- source_word: מִשְׁנִים
  choice: ya aina ya pili
  rationale: Maana ya neno hili katika orodha hii si hakika. Tafsiri hii inaonyesha kuwa mabakuli hayo yalikuwa kundi tofauti bila kudai kwa uhakika kuwa yalikuwa maradufu au nakala.
- source_word: אַרְבַּע מֵאוֹת וַעֲשָׂרָה
  choice: '410'
  rationale: Nambari changamano imetolewa kwa tarakimu kwa uwazi na ulinganifu katika orodha.
- source_word: כֵּלִים
  choice: vyombo
  rationale: Ni neno pana kwa vitu au vifaa, hasa katika muktadha wa vifaa vya hekalu; “vyombo” linafaa kwa Kiswahili cha kawaida.
- source_word: אֲחֵרִים
  choice: vingine
  rationale: Linatofautisha vitu hivi na mabakuli yaliyotajwa kabla kwa njia ya moja kwa moja.
- source_word: אָלֶף
  choice: 1,000
  rationale: Nambari imetolewa kwa tarakimu kwa ulinganifu na hesabu nyingine katika mstari.
