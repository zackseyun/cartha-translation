base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/003.yaml
  text: Whoever among all his people is among you[a], may his God be with him, and let him go up to Jerusalem, which is in Judah, and rebuild the house of Yahweh[b], the God of Israel—he is the God who is in Jerusalem.
translation:
  language: sw
  text: Mtu yeyote kati yenu, kutoka miongoni mwa watu wake wote—Mungu wake awe pamoja naye; na apande kwenda Yerusalemu, ulioko Yuda, na aijenge upya[a] nyumba ya Yahweh, Mungu wa Israeli—yeye ndiye Mungu[b] aliye Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aijenge.” Kitenzi cha Kiebrania kinamaanisha tu “jenga”; “aijenge upya” huweka wazi muktadha wa kurejeshwa kwa hekalu.
    reason: lexical_alternative
  - marker: b
    text: Au, “yeye ni Mungu aliye Yerusalemu.” Kiebrania kinaweza kutafsiriwa kwa ufupi hivyo, lakini kibainishi chake kinaunga mkono maana mahsusi ya “ndiye Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: Yeyote kati yenu aliye wa watu wake
  rationale: מִי linafanya kazi hapa kama mwaliko usioelekezwa kwa mtu mmoja, hivyo ‘Yeyote’ ni ya kawaida kuliko swali la moja kwa moja. Usemi huu unahifadhi rejeo la kiambishi cha nafsi ya tatu katika ‘watu wake’ bila kumtaja mhusika kwa maelezo yaliyoongezwa.
- source_word: יְהִי אֱלֹהָיו עִמּוֹ
  choice: Mungu wake na awe pamoja naye
  rationale: Kauli ya matamanio יְהִי imetafsiriwa kama baraka au ombi, kwa muundo wa Kiswahili ‘na awe,’ huku ‘Mungu wake’ ikihifadhi kiambishi cha Kiebrania.
- source_word: וְיַעַל
  choice: Na apande kwenda
  rationale: עלה ni usemi wa kawaida wa kupanda kwenda Yerusalemu; ‘apande kwenda’ huhifadhi wazo hilo la kijiografia na la ibada kwa Kiswahili kinachoeleweka.
- source_word: לִירוּשָׁלַם אֲשֶׁר בִּיהוּדָה
  choice: Yerusalemu, ulioko Yuda
  rationale: Kishazi cha uhusiano kinabainisha mahali pa Yerusalemu; ‘ulioko Yuda’ ni usemi wa kawaida na wazi wa Kiswahili.
- source_word: וְיִבֶן
  choice: akaijenge upya
  rationale: Kitenzi בנה kimsingi ni ‘jenga,’ lakini katika muktadha wa kurudi kutoka uhamishoni maana inayokusudiwa ni kuijenga tena nyumba iliyoharibiwa. Tanbihi inadumisha uwezekano wa tafsiri ya moja kwa moja.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: ‘Nyumba’ inahifadhi sitiari ya Kiebrania badala ya kuibadilisha moja kwa moja kuwa ‘hekalu,’ na יְהוָה imetolewa kama jina ‘Yahweh.’
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hii ni tafsiri ya moja kwa moja ya muundo wa umilikaji, ikihifadhi utambulisho wa Mungu kwa uhusiano wake na Israeli.
- source_word: הוּא הָאֱלֹהִים
  choice: yeye ndiye Mungu
  rationale: ‘Ndiye’ hudhihirisha mkazo wa הוּא na utambulisho mahsusi unaoashiriwa na nomino yenye kibainishi הָ.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: aliye Yerusalemu
  rationale: Kishazi hiki kimeachwa kimwelezee Mungu na kuhifadhi kauli ya mahali ya tangazo la kale bila kuilegeza au kuifafanua kwa teolojia ya baadaye.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano moja kwa moja. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: 'Kishazi kinachomhusisha Mungu na mahali: אֲשֶׁר בִּירוּשָׁלָם'
  choice: aliye Yerusalemu
  alternative: aliye huko Yerusalemu; kuilegeza kuwa ‘anayeabudiwa Yerusalemu’
  rationale: Tangazo la Koreshi linatumia mtazamo wa kihistoria unaomhusisha Mungu wa Israeli na Yerusalemu na nyumba yake huko. Tafsiri inadumisha mvutano huo bila kuingiza ufafanuzi wa kiteolojia usiomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa tangazo la kifalme lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘na awe’ huhifadhi sauti ya baraka, na ‘apande kwenda’ huhifadhi nahau ya safari ya kwenda Yerusalemu.
