  text: וַ/יּֽוֹצִיאֵ֗/ם כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס עַל יַ֖ד מִתְרְדָ֣ת הַ/גִּזְבָּ֑ר וַֽ/יִּסְפְּרֵ/ם֙ לְ/שֵׁשְׁבַּצַּ֔ר הַ/נָּשִׂ֖יא לִ/יהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/008.yaml
  text: King Cyrus of Persia brought them out by the hand of Mithredath the treasurer[a], and counted them out to Sheshbazzar[b], the prince of Judah.
translation:
  language: sw
  text: Mfalme Koreshi wa Uajemi akavitoa kwa mkono wa Mithredathi, mtunza hazina[a], naye akavihesabu kwa Sheshbaza, mkuu wa Yuda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia Mithredathi, mtunza hazina.” Nahau ya Kiebrania ni, neno kwa neno, “kwa mkono wa Mithredathi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kiongozi wa Yuda” au “mtawala wa Yuda.” Neno la Kiebrania linaweza kumaanisha mkuu au mtawala kwa maana pana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: akavitoa
  rationale: Kitenzi cha Kiebrania katika Hiphil kina maana ya kusababisha vitu vitoke au kuvitoa. Kiambishi -vi- kinaonyesha kuwa vinavyotajwa ni vyombo vya hekalu vya mstari uliotangulia, si watu.
- source_word: עַל יַד
  choice: kwa mkono wa
  rationale: Hii inahifadhi nahau ya Kiebrania inayoonyesha uwakala; katika muktadha huu ina maana kwamba Mithredathi ndiye aliyetumiwa kutekeleza tendo hilo.
- source_word: מִתְרְדָת
  choice: Mithredathi
  rationale: Jina la Kiajemi limetoholewa kwa mfumo unaosomeka kwa kawaida katika Kiswahili.
- source_word: הַגִּזְבָּר
  choice: mtunza hazina
  rationale: Neno hili linamtaja afisa mwenye wajibu kuhusu hazina. ‘Mtunza hazina’ ni wazi na la kawaida katika Kiswahili bila kuongeza cheo kisichotajwa.
- source_word: וַיִּסְפְּרֵם
  choice: akavihesabu
  rationale: Kitenzi ספר hapa kina maana ya kuhesabu au kufanya hesabu ya vitu. Tafsiri hii inafaa kwa vyombo vilivyokuwa vikitolewa katika hazina.
- source_word: לְשֵׁשְׁבַּצַּר
  choice: kwa Sheshbaza
  rationale: Kihusishi לְ kinaonyesha kwamba hesabu hiyo ilifanywa kuelekea au kwa ajili ya Sheshbaza. Muundo huu huepuka kuongeza wazi tendo la kukabidhi ambalo halijaandikwa moja kwa moja.
- source_word: הַנָּשִׂיא
  choice: mkuu
  rationale: נָשִׂיא linaweza kumaanisha mkuu, kiongozi, au mtawala. ‘Mkuu’ huhifadhi upana huo bila kulifanya kuwa cheo mahususi cha kiutawala kama ‘gavana.’
- source_word: לִיהוּדָה
  choice: wa Yuda
  rationale: Kihusishi kinamtambulisha Sheshbaza kwa uhusiano wake na Yuda; ‘mkuu wa Yuda’ ni muundo wa kawaida wa Kiswahili.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Mfalme Koreshi wa Uajemi
  rationale: Muundo huu wa Kiswahili unahifadhi jina, cheo, na ufalme wake kwa mpangilio wa kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Nahau ‘kwa mkono wa’ imehifadhiwa katika matini kwa sababu inaeleweka, huku maana yake mbadala ikifafanuliwa katika tanbihi. Kirai ‘akavihesabu kwa Sheshbaza’ kinahifadhi uhusiano usiofafanuliwa kikamilifu wa kihusishi cha Kiebrania bila kuongeza moja kwa moja kwamba alimkabidhi.
