base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/006.yaml
  text: And all those around them strengthened their hands with vessels of silver[a], with gold, with goods, with livestock, and with precious things[b], besides all that was freely offered.
translation:
  language: sw
  text: Nao watu wote waliowazunguka wakawasaidia[a] kwa vyombo vya fedha, dhahabu, mali, mifugo na vitu vya thamani, zaidi ya yote yaliyotolewa kwa hiari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “wakaitia nguvu mikono yao,” yaani, wakawapa msaada.
    reason: lexical_alternative
  - marker: b
    text: Au “zaidi ya kila toleo la hiari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתֵיהֶם
  choice: watu wote waliowazunguka
  rationale: Huwataja watu wa maeneo yaliyowazunguka bila kuwalazimisha kuwa majirani kwa maana finyu.
- source_word: חִזְּקוּ בִידֵיהֶם
  choice: wakawasaidia
  rationale: Nahau ya Kiebrania, kwa maana halisi ‘waliitia nguvu mikono yao,’ hapa humaanisha kuwapa msaada wa vitendo; ‘wakawasaidia’ ni Kiswahili cha kawaida na wazi, huku tanbihi ikihifadhi taswira ya asili.
- source_word: בִּכְלֵי כֶסֶף
  choice: kwa vyombo vya fedha
  rationale: כְּלִי ni neno pana la chombo au kitu; katika orodha hii ya vitu vilivyotolewa, ‘vyombo vya fedha’ linafaa na kuhifadhi aina ya zawadi.
- source_word: בַּזָּהָב
  choice: dhahabu
  rationale: Nomino iliyo wazi inaendeleza orodha ya msaada; hakuna ulazima wa kuongeza ‘vyombo vya’ ambako Kiebrania hakurudii.
- source_word: בָּרְכוּשׁ
  choice: mali
  rationale: רְכוּשׁ humaanisha mali au vitu vinavyomilikiwa, hasa mali inayohamishika; ‘mali’ ni pana na ya kawaida katika Kiswahili.
- source_word: וּבַבְּהֵמָה
  choice: mifugo
  rationale: Nomino hii ya pamoja inarejelea wanyama wa kufugwa kama mali; ‘mifugo’ huwasilisha maana hiyo ya kiuchumi.
- source_word: וּבַמִּגְדָּנוֹת
  choice: vitu vya thamani
  rationale: מִגְדָּנוֹת inaweza kumaanisha vitu vya thamani au zawadi bora, na wakati mwingine vyakula vitamu; chaguo hili linahifadhi upana wa maana katika muktadha.
- source_word: לְבַד עַל כָּל הִתְנַדֵּב
  choice: mbali na matoleo yote ya hiari
  rationale: Kirai kilichofupishwa cha Kiebrania huonyesha nyongeza juu ya vitu vilivyoorodheshwa na utoaji wa hiari; tafsiri hii ni ya asili bila kutaja kwa lazima mtoaji asiyeelezwa.
