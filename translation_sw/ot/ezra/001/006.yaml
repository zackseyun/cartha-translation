translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Nahau isiyo ya kawaida ya Kiebrania imetafsiriwa kwa maana katika matini kuu na taswira yake halisi kuhifadhiwa katika tanbihi; utata wa מִגְדָּנוֹת umehifadhiwa kwa ‘vitu vya thamani.’
