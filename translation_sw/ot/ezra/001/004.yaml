  text: וְ/כָל הַ/נִּשְׁאָ֗ר מִֽ/כָּל הַ/מְּקֹמוֹת֮ אֲשֶׁ֣ר ה֣וּא גָֽר שָׁם֒ יְנַשְּׂא֨וּ/הוּ֙ אַנְשֵׁ֣י מְקֹמ֔/וֹ בְּ/כֶ֥סֶף וּ/בְ/זָהָ֖ב וּ/בִ/רְכ֣וּשׁ וּ/בִ/בְהֵמָ֑ה עִם הַ֨/נְּדָבָ֔ה לְ/בֵ֥ית הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/004.yaml
  text: And everyone who remains[a], in any place where he is living, let the men of his place support him with silver and gold, with goods and with livestock[c][b], together with the freewill offering for the house of God that is in Jerusalem.
translation:
  language: sw
  text: Na kila aliyebaki, popote anapoishi[a], watu wa mahali pake[b] wamsaidie[c] kwa fedha na dhahabu, kwa mali na mifugo, pamoja na sadaka ya hiari kwa ajili ya nyumba ya Mungu iliyoko Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “popote anapokaa” au “popote anapoishi kama mgeni.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi “wanaume wa mahali pake”; usemi huo unaweza pia kumaanisha wakaaji wa eneo hilo au majirani zake kwa ujumla.
    reason: lexical_alternative
  - marker: c
    text: Au “wampatie msaada.” Kitenzi cha Kiebrania kihalisi ni “kuinua/kubeba,” lakini hapa kinamaanisha kumpatia msaada wa vitendo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָר
  choice: aliyebaki
  rationale: Neno hili ni kitenzi-jina cha Niphal cha שׁאר, likimaanisha mtu aliyesalia au aliyeachwa. “Aliyebaki” ni Kiswahili cha kawaida na hakiamui ikiwa mtu huyo hatarudi kabisa au amebaki kwa muda.
- source_word: מִכָּל הַמְּקֹמוֹת אֲשֶׁר הוּא גָר שָׁם
  choice: popote anapoishi
  rationale: Kirai hiki hutaja kila eneo ambako mtu huyo anaishi ugenini. גּוּר inaweza kumaanisha kukaa au kuishi kama mgeni; “popote anapoishi” ni ya asili katika Kiswahili huku tanbihi ikihifadhi maana nyingine inayowezekana.
- source_word: יְנַשְּׂאֻהוּ
  choice: wamsaidie
  rationale: Ingawa נשׂא kimsingi ni “kuinua/kubeba,” hapa vifaa vinavyotajwa vinaonyesha msaada wa vitendo. “Wamsaidie” huwasilisha maana hiyo bila kudokeza kwamba walipaswa kumbeba kimwili.
- source_word: אַנְשֵׁי מְקֹמוֹ
  choice: watu wa mahali pake
  rationale: Kiebrania kina umbo la kiume “wanaume wa mahali pake,” lakini katika kirai hiki linaweza kutaja wakaaji au majirani wa eneo kwa upana. “Watu wa mahali pake” ni Kiswahili cha asili; tanbihi inaweka wazi umbo halisi na uwezekano wa maana finyu.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: kwa fedha na dhahabu
  rationale: Haya ni majina ya kawaida ya madini ya thamani. “Fedha na dhahabu” huhifadhi usemi wa Kiebrania bila kubainisha kama fedha hiyo ilikuwa sarafu au uzani wa madini.
- source_word: וּבִרְכוּשׁ
  choice: kwa mali
  rationale: רְכוּשׁ humaanisha mali au vitu vinavyomilikiwa. “Mali” ni neno pana, la kawaida, na linafaa katika orodha hii ya msaada wa vitu.
- source_word: וּבִבְהֵמָה
  choice: na mifugo
  rationale: בְהֵמָה limetumiwa kwa maana ya pamoja kuhusu wanyama wa kufugwa, ambao wangeweza kuwa mali au kutumiwa katika safari.
- source_word: עִם הַנְּדָבָה
  choice: pamoja na sadaka ya hiari
  rationale: נְדָבָה ni mchango unaotolewa kwa hiari. “Sadaka ya hiari” ni wazi na inafaa katika muktadha wa ibada.
- source_word: לְבֵית הָאֱלֹהִים
  choice: kwa ajili ya nyumba ya Mungu
  rationale: Tafsiri hii inahifadhi usemi halisi “nyumba ya Mungu.” Ingawa hapa inarejelea hekalu, neno “hekalu” lingekuwa ufafanuzi zaidi kuliko maandishi yenyewe.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: iliyoko Yerusalemu
  rationale: Hiki ni kishazi rejeshi kinachoonyesha mahali nyumba ya Mungu ilipo; “iliyoko Yerusalemu” ni Kiswahili cha asili na sahihi.
theological_decisions:
- issue: Upeo wa jinsia katika אַנְשֵׁי מְקֹמוֹ
  choice: watu wa mahali pake
  alternative: wanaume wa mahali pake; majirani zake
  rationale: Umbo la Kiebrania ni la kiume kwa sarufi, lakini usemi unaweza kutaja wakaaji wa eneo kwa ujumla. Tafsiri kuu haitoi dai lisilo la lazima kwamba wanaume pekee ndio waliokusudiwa, na tanbihi huhifadhi umbo halisi pamoja na uwezekano huo.
- issue: Maana ya יְנַשְּׂאֻהוּ katika muktadha
  choice: wamsaidie
  alternative: wambebe; wamtegemeze
  rationale: Maana halisi ya “kuinua/kubeba” inaweza kupotosha hapa. Kutajwa kwa fedha, dhahabu, mali na mifugo kunaonyesha kumpatia msaada wa vitu kwa safari na kazi ya nyumba ya Mungu.
- issue: Nyumba ya Mungu au hekalu
  choice: nyumba ya Mungu
  alternative: hekalu la Mungu
  rationale: “Nyumba ya Mungu” hudumisha taswira na muundo wa Kiebrania. “Hekalu” ni maana sahihi kimuktadha, lakini huondoa taswira ya chanzo na hivyo imeachwa kuwa ufafanuzi unaowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa orodha umehifadhiwa, huku nahau ya Kiebrania katika יְנַשְּׂאֻהוּ ikitafsiriwa kwa maana yake ya kimuktadha. “Watu wa mahali pake” limetumiwa badala ya “wanaume wa mahali pake” ili kuepuka kufanya umbo la kisarufi kuwa dai lisilo na hakika kuhusu jinsia ya wote waliokusudiwa.
