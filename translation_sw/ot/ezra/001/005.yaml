source:
  edition: WLC
  text: וַ/יָּק֜וּמוּ רָאשֵׁ֣י הָ/אָב֗וֹת לִֽ/יהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/כֹ֨ל הֵעִ֤יר הָ/אֱלֹהִים֙ אֶת רוּח֔/וֹ לַ/עֲל֣וֹת לִ/בְנ֔וֹת אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/005.yaml
  text: Then the heads of the fathers’ houses of Judah and Benjamin[a], and the priests and the Levites[b], arose—everyone whose spirit God had stirred—to go up to build the house of Yahweh that is in Jerusalem.
translation:
  language: sw
  text: Ndipo wakuu wa jamaa za Yuda na Benyamini, makuhani na Walawi, na wote ambao Mungu alikuwa ameamsha roho zao[a], wakasimama ili wapande kwenda kuijenga nyumba ya Yahwe[b] iliyoko Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ambao Mungu alikuwa ameichochea roho zao,” au “ambao Mungu alikuwa amewasukuma rohoni.”
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya Yahwe” hapa ni hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֜וּמוּ
  choice: wakasimama
  rationale: Kitenzi קום kinaonyesha kuanza kuchukua hatua kuitikia wito. “Wakasimama” kinahifadhi mwendo wa simulizi bila kukifasiri moja kwa moja kuwa tayari waliondoka.
- source_word: רָאשֵׁ֣י הָאָב֗וֹת
  choice: viongozi wa koo
  rationale: Huu ni usemi wa kijamii unaowataja viongozi wa vikundi vya ukoo. “Viongozi wa koo” ni Kiswahili cha kawaida na chenye kueleweka kuliko tafsiri ya neno kwa neno “vichwa vya nyumba za baba.”
- source_word: לִֽיהוּדָה֙ וּבִנְיָמִ֔ן
  choice: za Yuda na Benyamini
  rationale: Kiambishi ל hapa kinaonyesha uhusiano au kufungamana na makabila hayo, si mwelekeo wa safari.
- source_word: וְהַכֹּהֲנִ֖ים וְהַלְוִיִּ֑ם
  choice: pamoja na makuhani na Walawi
  rationale: “Makuhani” na “Walawi” ni istilahi za kawaida za vikundi hivi; “pamoja na” linaunganisha orodha kwa Kiswahili cha asili bila kubadili maana.
- source_word: לְכֹ֨ל הֵעִ֤יר הָאֱלֹהִים֙ אֶת רוּח֔וֹ
  choice: yaani, kila mtu ambaye Mungu alikuwa ameamsha roho yake
  rationale: Muundo huu unawahusu kwa kugawa mmoja mmoja wale ambao Mungu aliwasukuma kutoka ndani. “Ameamsha roho yake” linahifadhi picha ya Kiebrania na tendo la Mungu lililotangulia hatua yao.
- source_word: רוּחַ
  choice: roho
  rationale: Hapa neno hili linamaanisha hali ya ndani au msukumo wa mtu. “Roho” linahifadhi istilahi ya chanzo na uzito wake wa kiteolojia kuliko “moyo” au “nia.”
- source_word: לַעֲל֣וֹת
  choice: ili wapande kwenda
  rationale: עלה ni kitenzi cha kawaida cha kwenda juu kuelekea Yerusalemu. “Wapande kwenda” kinahifadhi maana ya kupanda na pia ni wazi kuhusu safari.
- source_word: לִבְנ֔וֹת
  choice: kuijenga
  rationale: Kiebrania kinasema tu “kujenga.” Ingawa muktadha unahusu kujenga tena, tafsiri haiongezi wazo la “tena” ambalo halimo wazi katika kitenzi hiki.
- source_word: בֵּ֥ית יְהוָ֖ה
  choice: nyumba ya Yahwe
  rationale: Tafsiri hii inahifadhi taswira halisi ya “nyumba” katika Kiebrania; katika muktadha nyumba hiyo ni hekalu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama “Yahwe,” badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: אֲשֶׁ֥ר בִּירוּשָׁלִָֽם
  choice: iliyoko Yerusalemu
  rationale: Kishazi hiki kinatambulisha mahali nyumba hiyo ilipo. “Iliyoko” hakilazimishi hitimisho kuhusu hali ya jengo wakati huo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina יהוה moja kwa moja. “Yahwe” linahifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Kiwango cha kufasiri tendo la Mungu katika הֵעִיר הָאֱלֹהִים אֶת רוּחוֹ
  choice: Mungu alikuwa ameamsha roho yake
  alternative: Mungu alikuwa amemhimiza au amemvuvia
  rationale: Kiebrania kinahusisha wazi msukumo wa ndani na Mungu lakini hakielezi utaratibu wake zaidi. Tafsiri iliyochaguliwa inahifadhi mvutano huo bila kuingiza maelezo ya ziada ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi inahifadhi orodha na kishazi cha ufafanuzi cha Kiebrania; vistari virefu vinasaidia kuonyesha kuwa waliochukua hatua ni wale ambao Mungu alikuwa ameamsha roho zao.
