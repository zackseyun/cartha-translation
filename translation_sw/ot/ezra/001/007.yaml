  text: וְ/הַ/מֶּ֣לֶךְ כּ֔וֹרֶשׁ הוֹצִ֖יא אֶת כְּלֵ֣י בֵית יְהוָ֑ה אֲשֶׁ֨ר הוֹצִ֤יא נְבֽוּכַדְנֶצַּר֙ מִ/יר֣וּשָׁלִַ֔ם וַֽ/יִּתְּנֵ֖/ם בְּ/בֵ֥ית אֱלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/007.yaml
  text: And King Cyrus brought out the vessels of the house of Yahweh[b][a], which Nebuchadnezzar had brought out from Jerusalem and had put in the house of his god.
translation:
  language: sw
  text: Mfalme Koreshi akavitoa vyombo vya nyumba ya Yahwe[a], ambavyo Nebukadneza alikuwa amevitoa kutoka Yerusalemu na kuviweka katika nyumba ya mungu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu la Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ
  choice: Mfalme Koreshi
  rationale: Mpangilio huu wa cheo kabla ya jina ni wa kawaida na wa asili katika Kiswahili.
- source_word: הוֹצִיא
  choice: akavitoa / alikuwa amevitoa
  rationale: Hifili ya יצא ina maana ya kusababisha vitu vitoke, hivyo hapa ni ‘kutoa.’ Kurudia mzizi huo katika sehemu zote mbili kunadumisha uhusiano wa kimakusudi wa matendo ya Koreshi na Nebukadneza.
- source_word: כְּלֵי
  choice: vyombo
  rationale: Katika muktadha wa ibada, ‘vyombo’ ni neno la kawaida linalojumuisha vifaa vya hekaluni bila kubainisha maumbo au matumizi ambayo maandishi hayajataja.
- source_word: בֵית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Huhifadhi picha halisi ya Kiebrania, ‘nyumba ya YHWH,’ na pia usambamba wake na ‘nyumba ya mungu wake.’ ‘Hekalu la Yahwe’ ni tafsiri mbadala iliyo wazi zaidi kimuktadha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kwa tahajia ya Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: אֲשֶׁר
  choice: ambavyo
  rationale: Kiwakilishi hiki kinarejelea ‘vyombo’ na kuanzisha kishazi kinachovitambulisha.
- source_word: וַיִּתְּנֵם
  choice: na kuviweka
  rationale: Ingawa נתן inaweza kumaanisha ‘kutoa/kupa,’ pamoja na kirai ‘katika nyumba’ maana ya hapa ni kuweka au kuhifadhi mahali.
- source_word: בְּבֵית אֱלֹהָיו
  choice: katika nyumba ya mungu wake
  rationale: Tafsiri hii inadumisha umoja wa ‘mungu’ na usambamba wa neno ‘nyumba’ katika vifungu vyote viwili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina maalumu la Mungu, si cheo. ‘Yahwe’ ni utohozi unaofaa kwa Kiswahili na unalihifadhi kama jina.
- issue: Tofauti kati ya Mungu wa Israeli na mungu wa Nebukadneza
  choice: mungu wake
  alternative: miungu yake
  rationale: אֱלֹהָיו hapa ina kiambishi cha nafsi ya tatu umoja na, katika muundo huu, inarejelea kwa umoja. Tafsiri haipanui neno hilo kuwa miungu mingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Akavitoa’ huendeleza mtiririko wa simulizi, huku ‘alikuwa amevitoa’ ikionyesha wazi kwamba tendo la Nebukadneza lilitangulia. Tahajia ‘Nebukadneza’ imetumiwa kama umbo la kawaida la jina hilo katika Kiswahili.
