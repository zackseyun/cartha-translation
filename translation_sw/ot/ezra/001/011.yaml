  naturalness: “Vyombo vyote vya dhahabu na fedha vilikuwa jumla ya elfu tano na mia nne” ni mtiririko wa Kiswahili Sanifu ulio wazi zaidi kuliko kuanza na “Jumla ya vyombo vyote ... ilikuwa.” “Wakati wahamishwa walipoletwa” ni ya asili na inaweka wazi kwamba kundi, si vyombo, ndilo linalorejelewa na kitenzi cha pili.
  terminology: “Vyombo,” “dhahabu na fedha,” “wahamishwa,” “Babeli,” “Yerusalemu,” na “Sheshbaza” zinafaa kwa Kiswahili Sanifu cha Afrika Mashariki na kwa muktadha wa vyombo vya hekalu. Tanbihi ya namba inahitajika na imehifadhiwa.
