base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/011.yaml
  text: All the articles of gold and silver were five thousand four hundred in all[c][b][a]. Sheshbazzar brought them up with the exiles when they were brought up from Babylon to Jerusalem.
translation:
  language: sw
  text: Vyombo vyote vya dhahabu na fedha vilikuwa jumla ya elfu tano na mia nne.[a] Sheshbaza alivileta pamoja na wahamishwa, wakati wahamishwa walipoletwa kutoka Babeli kwenda Yerusalemu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika orodha ya aya ya 9–10, jumla ya idadi zilizotajwa ni 2,499, lakini hapa maandishi ya Kiebrania yanasema 5,400.
    reason: textual_or_numerical_note
  - marker: b
    text: Kiebrania hutumia neno lenye maana ya “kupandisha” mara mbili katika mstari huu, kufuatana na usemi wa kawaida wa kupanda kwenda Yerusalemu. Neno lililotafsiriwa “wahamishwa” linaweza pia kumaanisha “jamii ya uhamishoni.”
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: כָּל כֵּלִים
  choice: vyombo vyote
  rationale: כֵּלִים ni neno pana linaloweza kumaanisha vyombo, vifaa, au vitu vinavyotumiwa; katika muktadha wa hazina ya hekalu, “vyombo” ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: לַזָּהָב וְלַכֶּסֶף
  choice: vya dhahabu na fedha
  rationale: Viambishi vya ל vinaainisha vyombo kwa nyenzo; “vya dhahabu na fedha” ni usemi wa asili na mfupi.
- source_word: חֲמֵשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת הַכֹּל
  choice: Jumla ... ilikuwa elfu tano na mia nne
  rationale: הַכֹּל inaonyesha jumla ya hesabu; muundo huu ni wazi na wa kawaida katika Kiswahili huku ukihifadhi idadi iliyo katika Kiebrania.
- source_word: הֶעֱלָה
  choice: alivipandisha
  rationale: Hifil ya עלה humaanisha kusababisha vipande au watu wapande; “alivipandisha” huhifadhi lugha ya kupanda kwenda Yerusalemu na kiambishi cha vitu vilivyotajwa.
- source_word: שֵׁשְׁבַּצַּר
  choice: Sheshbaza
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: עִם
  choice: pamoja na
  rationale: 'Hutoa maana ya uandamani kwa uwazi: vyombo vilisafirishwa sambamba na jamii iliyorudi.'
- source_word: הֵעָלוֹת הַגּוֹלָה
  choice: wahamishwa walipopandishwa
  rationale: Muundo wa kitenzi-jina cha Hifil unaonyesha mazingira au wakati wa kupandishwa kwa jamii ya uhamishoni; kishazi cha wakati kinatoa Kiswahili cha asili na kuhifadhi hali ya kutendwa.
- source_word: הַגּוֹלָה
  choice: wahamishwa
  rationale: Katika muktadha huu neno linarejelea watu waliokuwa uhamishoni na sasa wanarudi, si hali ya uhamisho tu.
- source_word: מִבָּבֶל לִירוּשָׁלִָם
  choice: kutoka Babeli kwenda Yerusalemu
  rationale: Tafsiri ya moja kwa moja ya mahali pa kuondoka, mwendo, na mahali pa kufika.
theological_decisions:
- issue: Lugha ya kupanda kwenda Yerusalemu katika עלה
  choice: Kuhifadhi “alivipandisha” na “walipopandishwa”
  alternative: alivileta / walipoletwa
  rationale: Kiebrania kinatumia mzizi עלה mara mbili. Kuhifadhi dhana ya kupanda kunadumisha maana ya kijiografia na mtindo wa simulizi bila kuongeza dai la kimadhehebu.
- issue: Rejeleo la הַגּוֹלָה
  choice: wahamishwa, yaani watu
  alternative: uhamisho / jamii ya uhamishoni
  rationale: Muktadha unaeleza jamii inayorudi kutoka Babeli; “wahamishwa” hutaja watu kwa wazi huku tanbihi ikihifadhi uwezekano wa maana ya kijamii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi bila kufuta urudiaji wa mzizi עלה katika Kiebrania. “Vyombo” linafaa kwa vifaa vya hekalu, na “wahamishwa” linaeleweka kwa wasomaji wa kawaida.
