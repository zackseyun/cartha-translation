reference: Ezra 1:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה מִ/פִּ֣י יִרְמְיָ֑ה הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כֹּ֣רֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/001.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh from the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he sent a proclamation throughout all his kingdom, and also in writing[c][b], saying:'
translation:
  language: sw
  text: 'Katika mwaka wa kwanza wa Koreshi, mfalme wa Uajemi, ili neno la Yahweh lililotoka kinywani mwa Yeremia litimie[a], Yahweh aliiamsha roho ya Koreshi, mfalme wa Uajemi. Naye Koreshi akatangaza katika ufalme wake wote, na pia kwa maandishi[b], akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “ili kukamilisha neno la Yahweh.” Katika muktadha huu maana yake ni kwamba neno la kinabii lilifikia utimilifu. Maneno “lililotoka kinywani mwa Yeremia” yanaonyesha kwamba Yeremia alikuwa msemaji ambaye kupitia kwake Yahweh alitoa neno hilo.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “akasababisha sauti kupita katika ufalme wake wote”; yaani, alisambaza tangazo rasmi hadharani. Maneno “na pia kwa maandishi” yanaonyesha kwamba tangazo hilo lilitolewa pia kwa njia ya maandishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת
  choice: Katika mwaka wa kwanza
  rationale: Ni fomula ya wakati inayofungua hatua mpya ya simulizi; kiunganishi cha Kiebrania hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili.
- source_word: לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: wa Koreshi, mfalme wa Uajemi
  rationale: Huhifadhi fomula ya kutaja mwaka wa utawala na kutafsiri cheo na jina la nchi kwa Kiswahili sanifu.
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: ili neno la Yahweh ... litimie
  rationale: Katika muktadha wa unabii, kitenzi cha kukamilisha neno kinaelezwa kwa kawaida kuwa neno kutimia, bila kupoteza wazo la kufikishwa kwenye ukamilifu.
- source_word: מִפִּי יִרְמְיָה
  choice: lililotoka kinywani mwa Yeremia
  rationale: Huhifadhi taswira ya Kiebrania na kuonyesha kwamba Yeremia ndiye msemaji wa kibinadamu ambaye kupitia kwake neno hilo lilitolewa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ni unukuzi wa jina binafsi la Mungu lililoandikwa kwa Tetragramatoni katika chanzo.
- source_word: הֵעִיר אֶת רוּחַ כֹּרֶשׁ
  choice: aliiamsha roho ya Koreshi
  rationale: Huhifadhi upana wa רוּחַ kama roho, mwelekeo, au msukumo wa ndani, na pia hatua ya Mungu ya kumchochea Koreshi.
- source_word: וַיַּעֲבֶר קוֹל
  choice: akatangaza
  rationale: Nahau hii ina maana ya kueneza tangazo rasmi hadharani; 'akatangaza' ni Kiswahili cha kawaida na chenye hadhi.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: katika ufalme wake wote
  rationale: Huonyesha kwamba tangazo lilienezwa kote katika eneo lote la utawala wake.
- source_word: וְגַם בְּמִכְתָּב
  choice: na pia kwa maandishi
  rationale: Huonyesha wazi kwamba tangazo hilo halikutolewa kwa mdomo tu bali pia katika umbo la maandishi.
- source_word: לֵאמֹר
  choice: 'akisema:'
  rationale: Ni utangulizi wa kawaida wa maneno ya moja kwa moja na huandaa tamko linalofuata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja; 'Yahweh' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya לִכְלוֹת דְּבַר יְהוָה
  choice: ili neno la Yahweh ... litimie
  alternative: ili neno la Yahweh likamilishwe
  rationale: Mstari unaunganisha hatua ya Koreshi na kutekelezwa kwa neno la kinabii; 'litimie' huwasilisha uhusiano huo bila kuongeza maelezo ya kidhehebu.
- issue: Maana ya רוּחַ katika roho ya Koreshi
  choice: roho ya Koreshi
  alternative: nia ya Koreshi
  rationale: '''Roho'' huhifadhi utata wa neno la Kiebrania, ambalo linaweza kuhusisha hali ya ndani, msukumo, au mwelekeo, bila kulibana kuwa akili au nia pekee.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Sentensi imegawanywa ili iwe rahisi kusomeka, huku uhusiano wa kusudi kati ya unabii na hatua ya Yahweh ukihifadhiwa. Jina Koreshi na Uajemi yametumiwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
