base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/007.yaml
  text: So they gave money to the stonecutters and to the craftsmen[a], and food and drink and oil to the Sidonians and the Tyrians, to bring cedar timber from Lebanon to the sea at Joppa[c][b], according to the authorization of Cyrus king of Persia upon them.
translation:
  language: sw
  text: Basi wakawapa wachonga mawe na mafundi fedha[a], na wakawapa watu wa Sidoni na Tiro chakula, vinywaji na mafuta, ili hao walete mbao za mierezi kutoka Lebanoni hadi bahari ya Yafa[b], kulingana na kibali cha Koreshi, mfalme wa Uajemi, kwao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pesa.” Neno la Kiebrania linaweza kumaanisha metali ya fedha au pesa katika muktadha wa malipo.
    reason: lexical_alternative
  - marker: b
    text: Au “hadi bandari ya Yafa.” Kiebrania kihalisi ni “hadi bahari ya Yafa.”
    reason: lexical_alternative
  - marker: c
    text: Au “kulingana na ruhusa ya Koreshi, mfalme wa Uajemi, kwao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Basi wakawapa
  rationale: Wayyiqtol inaendeleza simulizi; “Basi” huonyesha mwendelezo wa matukio kwa Kiswahili cha kawaida.
- source_word: כֶסֶף
  choice: fedha
  rationale: “Fedha” inaweza kumaanisha metali yenyewe au pesa ya malipo, hivyo inadumisha upana wa neno la Kiebrania.
- source_word: לַחֹצְבִים
  choice: wachonga mawe
  rationale: Katika muktadha wa ujenzi, neno hili linawahusu watu waliokata au kuchonga mawe.
- source_word: וְלֶחָרָשִׁים
  choice: na mafundi
  rationale: חָרָשׁ humaanisha wafanyakazi wenye ustadi bila lazima kutaja ufundi maalumu.
- source_word: וּמַאֲכָל וּמִשְׁתֶּה וָשֶׁמֶן
  choice: chakula, vinywaji na mafuta
  rationale: Hivi ni vitu walivyopewa kama mahitaji au bidhaa; wingi “vinywaji” ni wa kawaida katika Kiswahili.
- source_word: לַצִּדֹנִים וְלַצֹּרִים
  choice: Wasidoni na Watiro
  rationale: Majina haya yanawataja watu wa Sidoni na Tiro kwa namna fupi na ya kawaida katika Kiswahili.
- source_word: עֲצֵי אֲרָזִים
  choice: mbao za mierezi
  rationale: Katika muktadha wa ujenzi, usemi huu unaeleweka kama mbao za miti ya mierezi bila kudai kwamba zilikuwa magogo tu.
- source_word: אֶל יָם יָפוֹא
  choice: hadi bahari ya Yafa
  rationale: Hii inafuata kwa karibu usemi halisi “bahari ya Yafa,” huku tanbihi ikieleza maana inayowezekana ya bandari au pwani.
- source_word: כְּרִשְׁיוֹן כּוֹרֶשׁ ... עֲלֵיהֶם
  choice: kulingana na ruhusa ambayo Koreshi, mfalme wa Uajemi, alikuwa amewapa
  rationale: Hutoa Kiswahili cha asili kwa nahau ya mamlaka ya kifalme, huku ikihifadhi wazo kwamba ruhusa hiyo ilitolewa kwao.
