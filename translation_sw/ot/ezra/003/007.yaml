translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umetenganisha kwa uwazi malipo ya mafundi na mahitaji yaliyotolewa kwa Wasidoni na Watiro. Majina yametolewa kwa maumbo ya Kiswahili “Koreshi,” “Uajemi,” “Yafa,” “Wasidoni,” na “Watiro.”
