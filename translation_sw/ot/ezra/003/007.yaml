- from: Basi wakawapa wachonga mawe na mafundi fedha[a], na wakawapa Wasidoni na Watiro chakula, vinywaji na mafuta, ili walete mbao za mierezi kutoka Lebanoni hadi bahari ya Yafa[b], kulingana na ruhusa ambayo Koreshi, mfalme wa Uajemi, alikuwa amewapa[c].
  to: Basi wakawapa wachonga mawe na mafundi fedha[a], na wakawapa watu wa Sidoni na Tiro chakula, vinywaji na mafuta, ili hao walete mbao za mierezi kutoka Lebanoni hadi bahari ya Yafa[b], kulingana na kibali cha Koreshi, mfalme wa Uajemi, kwao[c].
