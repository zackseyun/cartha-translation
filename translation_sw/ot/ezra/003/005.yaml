  text: וְ/אַחֲרֵי כֵ֞ן עֹלַ֤ת תָּמִיד֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּ/לְ/כָל מוֹעֲדֵ֥י יְהוָ֖ה הַ/מְקֻדָּשִׁ֑ים וּ/לְ/כֹ֛ל מִתְנַדֵּ֥ב נְדָבָ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/005.yaml
  text: And after that came the regular burnt offering[a], and the offerings for the new moons and for all the appointed feasts of Yahweh that were consecrated[c][b], and for everyone who willingly offered a freewill offering to Yahweh.
translation:
  language: sw
  text: Baada ya hayo, wakatoa sadaka ya kuteketezwa ya kawaida[a], na sadaka za mwezi mpya[b], na sadaka za nyakati[c] zote za Yahwe zilizowekwa wakfu, na sadaka za hiari za kila mtu aliyemtolea Yahwe kwa hiari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya kuteketezwa ya daima” au “sadaka ya kuteketezwa ya kila siku.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “miezi mipya,” yaani maadhimisho matakatifu ya kila mwezi yaliyofanyika mwanzoni mwa mwezi.
    reason: cultural_note
  - marker: c
    text: Au, “sikukuu zote za Yahwe zilizowekwa wakfu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  choice: Kisha
  rationale: Inaonyesha mfuatano wa matukio kwa Kiswahili cha kawaida; kiunganishi cha Kiebrania kinaingizwa kwa kawaida katika mpito huu.
- source_word: עֹלַת תָּמִיד
  choice: sadaka ya kuteketezwa ya kawaida
  rationale: עֹלָה ni sadaka inayoteketezwa kabisa, na תָּמִיד hapa inaonyesha utoaji wa mara kwa mara au wa kudumu bila kulazimisha tafsiri ya 'kila siku' katika maandishi makuu.
- source_word: וְלֶחֳדָשִׁים
  choice: sadaka za sikukuu za mwezi mpya
  rationale: חֹדֶשׁ katika muktadha wa ibada ni mwandamo wa mwezi uliotambulisha mwanzo wa mwezi; 'sikukuu za mwezi mpya' inaeleweka kwa wasomaji wa kisasa, huku neno 'sadaka' likikamilishwa kutokana na muktadha.
- source_word: וּלְכָל מוֹעֲדֵי יְהוָה הַמְקֻדָּשִׁים
  choice: za nyakati zote zilizowekwa wakfu kwa Yahwe
  rationale: מוֹעֵד inaweza kuwa wakati uliowekwa au sikukuu; 'nyakati' huhifadhi upana huo, na הַמְקֻדָּשִׁים inaonyesha kuwa zilitengwa kuwa takatifu.
- source_word: וּלְכֹל מִתְנַדֵּב נְדָבָה
  choice: sadaka za hiari za kila mtu aliyejitolea
  rationale: Huhifadhi mkazo wa mzizi unaorudiwa kuhusu kutoa kwa hiari, lakini kwa muundo wa Kiswahili usio mzito.
- source_word: לַיהוָה
  choice: kwa Yahwe / kumtolea Yahwe
  rationale: Jina la agano יְהוָה linawakilishwa moja kwa moja kama 'Yahwe'; viambishi vinabadilishwa kulingana na uhusiano wa kisarufi katika sentensi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja. 'Yahwe' huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa הַמְקֻדָּשִׁים na nyakati zilizowekwa
  choice: zilizowekwa wakfu
  alternative: takatifu / zilizotakaswa
  rationale: Umbo la Kiebrania ni shamirisho tendwa linaloonyesha nyakati zilizotengwa rasmi kwa kusudi takatifu, bila kudai zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Kitenzi 'wakatoa' kimewekwa wazi kutokana na muktadha wa sadaka katika mstari uliotangulia, kwa kuwa Kiebrania cha mstari huu kinaendeleza orodha kwa mtindo wa mkato. Alama zote za tanbihi zimewekwa katika maandishi makuu.
