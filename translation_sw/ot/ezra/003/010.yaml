id: EZR.3.10
reference: Ezra 3:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/יִסְּד֥וּ הַ/בֹּנִ֖ים אֶת הֵיכַ֣ל יְהוָ֑ה וַ/יַּעֲמִידוּ֩ הַ/כֹּהֲנִ֨ים מְלֻבָּשִׁ֜ים בַּ/חֲצֹֽצְר֗וֹת וְ/הַ/לְוִיִּ֤ם בְּנֵֽי אָסָף֙ בַּֽ/מְצִלְתַּ֔יִם לְ/הַלֵּל֙ אֶת יְהוָ֔ה עַל יְדֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/010.yaml
  text: When the builders laid the foundation of the temple of Yahweh[a], they stationed the priests, clothed in their vestments, with trumpets, and the Levites, the sons of Asaph, with cymbals, to praise Yahweh according to the directions of David king of Israel.
translation:
  language: sw
  text: Wajenzi walipoweka msingi wa hekalu la Yahwe, waliwaweka makuhani, waliovalia mavazi rasmi, wenye tarumbeta, na Walawi, wana wa Asafu, wenye matoazi, ili wamsifu Yahwe kufuatana na maagizo ya Daudi[a], mfalme wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania: “kwa mkono wa Daudi”; hapa ni nahau inayomaanisha kufuatana na mwongozo au utaratibu uliotolewa na Daudi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִסְּדוּ הַבֹּנִים
  choice: Wajenzi walipoweka msingi
  rationale: Kitenzi יסד katika muktadha wa ujenzi humaanisha kuweka msingi. Muundo wa wakati wenye “walipo-” unaonyesha mazingira ya tendo kuu linalofuata kwa Kiswahili cha kawaida.
- source_word: הֵיכַל יְהוָה
  choice: hekalu la Yahwe
  rationale: הֵיכָל hapa ni jengo la hekalu, na jina la agano יְהוָה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo.
- source_word: וַיַּעֲמִידוּ
  choice: waliwasimamisha
  rationale: Hifili ya עמד ina maana ya kuwafanya watu wasimame au kuchukua nafasi zao kwa huduma. “Waliwasimamisha” huhifadhi picha ya Kiebrania bila kulazimisha maana ya kuteua.
- source_word: הַכֹּהֲנִים מְלֻבָּשִׁים
  choice: makuhani wakiwa wamevalia mavazi yao rasmi
  rationale: מְלֻבָּשִׁים humaanisha waliovikwa au waliovalia. Kutaja mavazi rasmi kunawasilisha mazingira ya ibada bila kuongeza aina mahususi ya vazi ambayo haikutajwa wazi katika mstari.
- source_word: בַּחֲצֹצְרוֹת
  choice: na kushika tarumbeta
  rationale: חֲצֹצְרוֹת ni tarumbeta za sherehe za ibada. “Kushika” huweka wazi uhusiano wa makuhani na vyombo hivyo kwa Kiswahili cha asili.
- source_word: וְהַלְוִיִּם בְּנֵי אָסָף
  choice: na Walawi, wana wa Asafu
  rationale: Kirai cha pili kinawatambulisha Walawi kuwa wa ukoo au kundi la Asafu. “Wana wa Asafu” huhifadhi namna ya kifamilia ya Kiebrania.
- source_word: בַּמְצִלְתַּיִם
  choice: wakiwa na matoazi
  rationale: מְצִלְתַּיִם ni matoazi yaliyotumiwa katika muziki wa ibada; hili ndilo neno la kawaida la Kiswahili kwa cymbals.
- source_word: לְהַלֵּל אֶת יְהוָה
  choice: ili wamsifu Yahwe
  rationale: Kiwakilishi cha kusudi לְ kinaonyeshwa kwa “ili,” na הלל limetafsiriwa moja kwa moja kuwa kumsifu.
- source_word: עַל יְדֵי דָּוִיד
  choice: kufuatana na maagizo ya Daudi
  rationale: Nahau hiyo, kwa uhalisi “kwa mkono wa Daudi,” hapa inaelekea kueleza mpangilio au mwongozo wa ibada uliotolewa na Daudi. Tafsiri kuu inatoa maana hiyo, huku tanbihi ikihifadhi umbo halisi.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Hiki ni cheo cha kifalme kinachoweza kutafsiriwa moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Kutumia “Yahwe” huhifadhi jina binafsi la agano lililo katika maandishi ya Kiebrania badala ya kulibadilisha na cheo; limetumiwa kwa uthabiti katika sehemu zote mbili za mstari.
- issue: Maana ya עַל יְדֵי דָּוִיד katika mpangilio wa ibada
  choice: kufuatana na maagizo ya Daudi
  alternative: kwa mkono wa Daudi
  rationale: Maana ya nahau katika muktadha huu ni kwamba sifa ilifanywa kwa kufuata mpangilio au mwongozo unaohusishwa na Daudi, si kwamba Daudi alikuwepo na kuifanya mwenyewe. Umbo la neno kwa neno limeonyeshwa katika tanbihi ili kutoficha picha ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa sasa. Sentensi inafuata mwendo wa simulizi la Kiebrania huku ikitumia miundo ya kawaida kama “walipoweka” na “ili wamsifu.”
