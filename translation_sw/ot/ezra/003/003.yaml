id: EZR.3.3
reference: Ezra 3:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּכִ֤ינוּ הַ/מִּזְבֵּ֨חַ֙ עַל מְכ֣וֹנֹתָ֔י/ו כִּ֚י בְּ/אֵימָ֣ה עֲלֵי/הֶ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת ו/יעל עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה עֹל֖וֹת לַ/בֹּ֥קֶר וְ/לָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/003.yaml
  text: They set up the altar on its foundations[a], for fear was upon them because of the peoples of the lands, and they offered up burnt offerings on it to Yahweh[b], burnt offerings morning and evening.
translation:
  language: sw
  text: Wakaisimamisha madhabahu juu ya misingi yake[a], kwa maana hofu ilikuwa imewaingia kwa sababu ya mataifa ya nchi zile[b]; wakatoa sadaka za kuteketezwa juu ya madhabahu kwa Yahwe, sadaka za kuteketezwa asubuhi na jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “juu ya kitako chake” au “mahali pake palipowekwa.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “hofu ilikuwa juu yao kutoka kwa mataifa ya nchi zile”; yaani, waliogopa kwa sababu ya mataifa yaliyowazunguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: wakaisimamisha
  rationale: Hifili ya כון hapa inaonyesha kuiweka madhabahu mahali pake na kuitayarisha kwa matumizi; “wakaisimamisha” ni ya kawaida na inaendana na kutajwa kwa misingi yake.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa מזבח katika muktadha wa dhabihu.
- source_word: עַל מְכֹנוֹתָיו
  choice: juu ya misingi yake
  rationale: מְכוֹנוֹתָיו inaweza kumaanisha misingi, vitegemezo, au mahali pake palipowekwa; tafsiri hii inadumisha picha halisi huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: כִּי בְּאֵימָה עֲלֵיהֶם
  choice: kwa maana hofu ilikuwa imewaingia
  rationale: Husema kwa Kiswahili cha asili kwamba hofu ilikuwa juu yao bila kupunguza uzito wa hofu iliyowatawala.
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  choice: kwa sababu ya watu wa nchi zile
  rationale: מִן baada ya usemi wa hofu inaweza kuonyesha chanzo au sababu; “kwa sababu ya” hutoa maana ya kimuktadha, huku wingi wa הָאֲרָצוֹת ukihifadhiwa.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: wakamtolea ... sadaka za kuteketezwa juu yake
  rationale: Hifili ya עלה pamoja na עֹלוֹת ni nahau ya kawaida ya kutoa sadaka za kuteketezwa; Kiswahili hiki kinaeleza tendo kwa ufasaha na kudumisha madhabahu kama mahali pa kutolea.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili.
- source_word: עֹלוֹת לַבֹּקֶר וְלָעָרֶב
  choice: sadaka za kuteketezwa asubuhi na jioni
  rationale: Inadumisha kurudiwa kwa עֹלוֹת na kueleza nyakati mbili za kawaida za utoaji kwa Kiswahili cha asili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; “Yahwe” huhifadhi jina la pekee badala ya kulibadili kuwa cheo.
- issue: Sababu ya kujenga madhabahu licha ya hofu
  choice: kwa maana hofu ilikuwa imewaingia kwa sababu ya watu wa nchi zile
  alternative: ingawa waliwaogopa watu wa nchi zile
  rationale: כִּי kwa kawaida hutoa sababu, si utofautishaji. Tafsiri haielezi zaidi kama madhabahu ilikuwa hatua ya kujilinda, bali inadumisha mvutano wa kauli ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umewekwa wazi kwa wasomaji wa kawaida, huku nahau ya hofu, wingi wa nchi, kurudiwa kwa sadaka, na jina Yahwe vikihifadhiwa.
