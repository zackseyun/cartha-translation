    rationale: The footnote anchor should accompany the fear clause and explain its literal/source expression, preserving audit-trail alignment and giving readers the relevant clarification at the appropriate location.
  - severity: low
    issue: '"juu yake" follows "Yahwe" in the sacrificial clause.'
    rationale: Although the intended antecedent is the altar, the pronoun can momentarily be read ambiguously. Naming the altar explicitly preserves the source’s "on it" without ambiguity.
  - severity: low
    issue: '"watu wa nchi zile" weakens the plural "peoples of the lands."'
    rationale: '"Mataifa ya nchi zile" naturally retains the collective/plural regional sense without identifying specific groups.'
