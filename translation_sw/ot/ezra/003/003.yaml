  source_fidelity: Draft correctly represents the altar’s installation, the fear arising from surrounding peoples, the burnt offerings, and the morning-and-evening schedule. However, the final wording places the dative recipient before the locative phrase, leaving "juu yake" potentially ambiguous in Swahili; the altar should be made explicit as the location. The draft also does not preserve the plural sense of "lands" as well as it could.
