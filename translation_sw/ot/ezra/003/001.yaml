base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/001.yaml
  text: When the seventh month arrived[a], and the sons of Israel were in the cities[b], the people gathered as one man to Jerusalem.
translation:
  language: sw
  text: Mwezi wa saba ulipowadia, wana wa Israeli[a] wakiwa katika miji, watu wakakusanyika kwenda Yerusalemu kama mtu mmoja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Waisraeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
  - marker: b
    text: Nahau ya Kiebrania “kama mtu mmoja” humaanisha kwamba walitenda kwa umoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע
  choice: ulipowadia
  rationale: Kitenzi נגע kwa kawaida humaanisha ‘kugusa/kufikia,’ lakini kinapotumiwa kuhusu wakati huonyesha kwamba kipindi kimewadia. ‘Ulipowadia’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: mwezi wa saba
  rationale: Hili ni tafsiri ya moja kwa moja ya usemi wa Kiebrania bila kuingiza jina la mwezi lisilotajwa katika mstari.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: ‘Wana wa Israeli’ hudumisha muundo wa Kiebrania בְּנֵי יִשְׂרָאֵל, huku tanbihi ikitoa tafsiri ya kawaida zaidi, ‘Waisraeli.’
- source_word: בֶּעָרִים
  choice: wakiwa katika miji
  rationale: Kiebrania kina kishazi cha mahali bila kitenzi wazi. ‘Wakiwa katika miji’ huwasilisha maana hiyo kwa Kiswahili fasaha bila kuongeza kimilikishi ‘yao,’ ambacho hakipo wazi katika Kiebrania.
- source_word: וַיֵּאָסְפוּ
  choice: walikusanyika
  rationale: Nifali ya אָסף hapa inaonyesha watu kukusanyika. ‘Walikutana’ ingeweza kudhoofisha wazo la mkusanyiko wa jumuiya.
- source_word: הָעָם
  choice: watu
  rationale: Neno הָעָם linarejelea kwa pamoja jumuiya iliyorudi; ‘watu’ ni tafsiri ya kawaida na iliyo wazi.
- source_word: כְּאִישׁ אֶחָד
  choice: kama mtu mmoja
  rationale: Tafsiri hii huhifadhi taswira halisi ya nahau ya Kiebrania, huku tanbihi ikifafanua kwamba inamaanisha kutenda kwa umoja.
- source_word: אֶל יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Katika Kiswahili, kitenzi ‘walikusanyika’ pamoja na jina la mahali huonyesha kuelekea mahali hapo kiasili; si lazima kuongeza ‘kwenda’ au ‘huko.’
theological_decisions:
- issue: Lugha ya jumuiya yenye muundo wa kiume katika בְּנֵי יִשְׂרָאֵל na כְּאִישׁ אֶחָד
  choice: Kudumisha ‘wana wa Israeli’ na ‘kama mtu mmoja’ katika matini kuu
  alternative: ‘Waisraeli’ na ‘kwa umoja’
  rationale: Chaguo hili linaweka wazi muundo na taswira ya Kiebrania bila kudai kwamba mkusanyiko uliwahusu wanaume peke yao. Tanbihi zinaeleza matumizi ya kijumuiya na maana ya nahau.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. ‘Ulipowadia’ na ‘wakiwa katika miji’ huepuka ukakasi, huku ‘kama mtu mmoja’ ikihifadhi taswira ya chanzo. Alama zote za tanbihi zimewekwa karibu na maneno yanayofafanuliwa.
