  text: וַ/יָּקָם֩ יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וּ/זְרֻבָּבֶ֤ל בֶּן שְׁאַלְתִּיאֵל֙ וְ/אֶחָ֔י/ו וַ/יִּבְנ֕וּ אֶת מִזְבַּ֖ח אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לְ/הַעֲל֤וֹת עָלָי/ו֙ עֹל֔וֹת כַּ/כָּת֕וּב בְּ/תוֹרַ֖ת מֹשֶׁ֥ה אִישׁ הָ/אֱלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/002.yaml
  text: Then Jeshua son of Jozadak arose with his brothers the priests[a], and Zerubbabel son of Shealtiel with his brothers, and they built the altar of the God of Israel to offer burnt offerings on it, as it is written in the Law of Moses[b], the man of God.
translation:
  language: sw
  text: Ndipo Yeshua mwana wa Yosadaki, pamoja na ndugu zake makuhani[a], na Zerubabeli mwana wa Shealtieli, pamoja na ndugu zake, waliinuka. Wakajenga madhabahu ya Mungu wa Israeli ili watoe juu yake sadaka za kuteketezwa, kama ilivyoandikwa katika Sheria[b] ya Musa, mtu wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa zake” au “wenzake.” Kiebrania kinasema “ndugu zake,” na maneno yanayofuata yanabainisha kundi la Yeshua kuwa makuhani.
    reason: lexical_alternative
  - marker: b
    text: Neno “Sheria” limetafsiri neno la Kiebrania torah, ambalo pia linaweza kumaanisha “mafundisho” au “maagizo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום hapa kinaanzisha hatua ya uamuzi katika simulizi. “Akainuka” kinadumisha mwendo huo bila kukifanya kitendo hiki kuwa kusimama kimwili tu.
- source_word: יֵשׁוּעַ
  choice: Yeshua
  rationale: Jina limenukuliwa kwa namna inayokaribia umbo la Kiebrania na inayosomeka kwa kawaida katika Kiswahili.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: ndugu zake, yaani makuhani
  rationale: “Ndugu zake” huhifadhi maana ya msingi ya אחים, huku “yaani makuhani” ikionyesha wazi kwamba kirai kinachofuata kinaitambulisha kundi la Yeshua.
- source_word: זְרֻבָּבֶל
  choice: Zerubabeli
  rationale: Hili ni umbo la jina linalofaa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: שְׁאַלְתִּיאֵל
  choice: Shealtieli
  rationale: Jina limenukuliwa kutoka umbo la Kiebrania na kupewa mwisho unaotamkika kwa kawaida katika Kiswahili.
- source_word: וַיִּבְנוּ
  choice: wakajenga
  rationale: בנה humaanisha “kujenga.” Muktadha unaweza kudokeza urejeshaji, lakini kitenzi chenyewe hakisemi wazi “kujenga upya.”
- source_word: מִזְבַּח אֱלֹהֵי יִשְׂרָאֵל
  choice: madhabahu ya Mungu wa Israeli
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha Kiebrania.
- source_word: לְהַעֲלוֹת עָלָיו עֹלוֹת
  choice: ili kutoa juu yake sadaka za kuteketezwa
  rationale: Hii ni nahau ya ibada kuhusu kutoa sadaka zinazoteketezwa, na “juu yake” inadumisha rejeo la wazi kwa madhabahu.
- source_word: כַּכָּתוּב
  choice: kama ilivyoandikwa
  rationale: Hili ni tamko la kawaida linaloonyesha kufuata agizo lililoandikwa.
- source_word: תּוֹרַת מֹשֶׁה
  choice: Sheria ya Musa
  rationale: Katika muktadha wa maagizo ya sadaka yaliyoandikwa, “Sheria” huwasilisha vizuri nguvu ya kisheria ya תּוֹרָה, huku tanbihi ikihifadhi maana pana ya “mafundisho/maagizo.”
theological_decisions:
- issue: Maana ya אחים katika kundi la wawakilishi
  choice: ndugu zake
  alternative: jamaa zake / wenzake
  rationale: Kiebrania kinasema kihalisi “ndugu zake,” lakini neno hilo linaweza pia kutaja jamaa au washirika. Maandishi makuu yanadumisha neno la msingi, na tanbihi inalinda upana wake wa maana.
- issue: Tafsiri ya תּוֹרָה katika rejeo la maagizo ya ibada
  choice: Sheria ya Musa
  alternative: mafundisho ya Musa / Torati ya Musa
  rationale: Muktadha unahusu kufuata agizo la sadaka lililoandikwa. “Sheria” ni ya asili na wazi katika Kiswahili, bila kukana kwamba תּוֹרָה linaweza kuwa na maana pana ya mafundisho au maagizo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Majina yameandikwa kwa maumbo yanayotamkika kwa kawaida katika Kiswahili; sentensi mbili zimetumiwa ili kuepuka msongamano bila kupoteza mfuatano wa simulizi.
