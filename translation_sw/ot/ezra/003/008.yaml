  text: וּ/בַ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/בוֹאָ֞/ם אֶל בֵּ֤ית הָֽ/אֱלֹהִים֙ לִ/יר֣וּשָׁלִַ֔ם בַּ/חֹ֖דֶשׁ הַ/שֵּׁנִ֑י הֵחֵ֡לּוּ זְרֻבָּבֶ֣ל בֶּן שְׁ֠אַלְתִּיאֵל וְ/יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וּ/שְׁאָ֥ר אֲחֵי/הֶ֣ם הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֗ם וְ/כָל הַ/בָּאִים֙ מֵ/הַ/שְּׁבִ֣י יְרֽוּשָׁלִַ֔ם וַ/יַּעֲמִ֣ידוּ אֶת הַ/לְוִיִּ֗ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה לְ/נַצֵּ֖חַ עַל מְלֶ֥אכֶת בֵּית יְהוָֽה־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/008.yaml
  text: And in the second year after their coming to the house of God at Jerusalem[a], in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak, and the rest of their brothers the priests and the Levites, and all who had come from the captivity to Jerusalem, began and appointed the Levites from twenty years old and upward to oversee the work of the house of Yahweh.
translation:
  language: sw
  text: Katika mwaka wa pili baada ya kufika kwao kwenye nyumba ya Mungu huko Yerusalemu, mwezi wa pili, Zerubabeli mwana wa Shealtieli, Yeshua mwana wa Yosadaki, na ndugu zao wengine, makuhani na Walawi, pamoja na wote waliokuwa wamekuja kutoka uhamishoni hadi Yerusalemu, walianza; kisha wakawaweka Walawi wenye umri wa miaka ishirini na zaidi wasimamie kazi ya nyumba ya Yahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבוֹאָם
  choice: baada ya kufika kwao
  rationale: Muundo huu unaonyesha wakati na unasomeka kwa Kiswahili cha kawaida bila kupoteza maana ya kuwasili kwao.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Tafsiri hii inafuata usemi wa Kiebrania kwa karibu na haiongezi neno la kufasiri ‘hekalu,’ ingawa mahali pa hekalu ndilo linalozungumziwa.
- source_word: הֵחֵלּוּ
  choice: walianza kazi
  rationale: Kitenzi cha Kiebrania hakitaji wazi kitu kilichoanzwa. Kiswahili huhitaji ukamilifu zaidi hapa; ‘kazi’ inaeleweka kutokana na muktadha wa ujenzi na sentensi inayofuata.
- source_word: וַיַּעֲמִידוּ
  choice: wakawaweka
  rationale: Hiphil ya עמד hapa ina maana ya kuwaweka watu katika nafasi au jukumu maalumu. Muundo huu unaonyesha uteuzi wao kwa kazi ya usimamizi.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: wenye umri wa miaka ishirini na zaidi
  rationale: Huu ni usemi wa kawaida na wazi wa Kiswahili unaowakilisha kikomo cha umri kilichomo katika Kiebrania.
- source_word: לְנַצֵּחַ
  choice: wasimamie
  rationale: Katika muktadha huu neno linahusu kusimamia kazi, si kuongoza muziki.
- source_word: מֵהַשְּׁבִי
  choice: kutoka uhamishoni
  rationale: Neno linaweza kurejelea hali ya uhamisho au kuwa mateka. ‘Uhamishoni’ linaeleza kwa kawaida muktadha wa kurejea Yerusalemu, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: אֲחֵיהֶם
  choice: ndugu zao
  rationale: ‘Ndugu’ linafaa kwa uhusiano wa kundi hapa; muktadha unaonyesha kuwa wale wanaotajwa ni makuhani na Walawi wenzao.
- source_word: מְלֶאכֶת בֵּית יְהוָה
  choice: kazi ya nyumba ya Yahwe
  rationale: Tafsiri hii inahifadhi uhusiano wa maneno ya Kiebrania na inaweza kuhusisha kazi ya ujenzi katika eneo la nyumba ya Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano lililoandikwa kwa Tetragramatoni linawakilishwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina na kuepuka kulibadilisha kimya kuwa cheo.
- issue: Kitu kilichoanzwa katika הֵחֵלּוּ
  choice: walianza kazi
  alternative: walianza
  rationale: Kiebrania kinaacha kitu cha kitenzi bila kutajwa, lakini muktadha unakihusisha na kazi ya nyumba. Kiswahili cha kawaida kinahitaji sentensi kamili zaidi; ‘kazi’ linafanya maana iliyodokezwa iwe wazi bila kuamua aina ya kazi zaidi ya muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi ndefu ya Kiebrania imegawanywa baada ya ‘walianza kazi’ ili kuleta uwazi. Majina yameandikwa kwa namna inayokaribia maumbo ya Kiebrania huku yakifuata tahajia inayoweza kutamkwa kwa Kiswahili.
