base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/006.yaml
  text: From the first day of the seventh month they began to offer burnt offerings to Yahweh[a], though the foundation of the temple of Yahweh had not been laid.
translation:
  language: sw
  text: Tangu siku ya kwanza ya mwezi wa saba, walianza kumtolea Yahwe sadaka za kuteketezwa, ingawa msingi wa hekalu la Yahwe ulikuwa bado haujawekwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “lakini msingi wa hekalu la Yahwe ulikuwa bado haujawekwa.” Kiunganishi cha Kiebrania kinaweza pia kutafsiriwa kwa urahisi kuwa “na”; maana ni kwamba utoaji wa sadaka ulianza kabla ya msingi wa hekalu kuwekwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיּוֹם אֶחָד לַחֹדֶשׁ הַש׼ְּבִיעִי
  choice: Tangu siku ya kwanza ya mwezi wa saba
  rationale: מִן inaonyesha mwanzo wa kipindi cha wakati; “Tangu” huhifadhi maana ya kuanzia tarehe hiyo, badala ya kuifanya iwe tukio la siku moja tu.
- source_word: הֵחֵלּוּ
  choice: walianza
  rationale: Hifili ya החל ina maana ya kuanza; kitenzi hiki ni cha kawaida na wazi katika Kiswahili.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: kumtolea ... sadaka za kuteketezwa
  rationale: Hii ni nahau ya ibada inayohusu sadaka zilizoteketezwa kabisa. “Kumtolea” huonyesha anayepokea sadaka kwa Kiswahili cha asili.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: הֵיכַל יְהוָה
  choice: hekalu la Yahwe
  rationale: הֵיכָל katika muktadha wa kurejeshwa kwa ibada Yerusalemu humaanisha patakatifu au hekalu; “hekalu” ndilo neno wazi zaidi hapa.
- source_word: לֹא יֻסָּד
  choice: msingi ... ulikuwa bado haujawekwa
  rationale: Kauli tendwa ya יסד inahusu kuweka msingi. Kiswahili huhitaji kutaja “msingi” wazi ili kutoa maana ya kawaida na kamili.
- source_word: וְ
  choice: ingawa
  rationale: Kiunganishi kinaweza kuwa cha kawaida (“na”) au cha kupinga/kukubali hali (“lakini/ingawa”). “Ingawa” huonyesha kwamba utoaji wa sadaka ulianza kabla ya msingi kuwekwa, huku tanbihi ikihifadhi uwezekano wa “na” au “lakini.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, tetragramatoni יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya kuanza kwa sadaka na kutowekwa kwa msingi
  choice: ingawa
  alternative: na au lakini
  rationale: 'Muktadha unaunga mkono maana ya hali inayokubaliwa licha ya kizuizi: sadaka zilianza kabla ya msingi wa hekalu kuwekwa. Hata hivyo, וְ lenyewe linaweza kutafsiriwa kwa urahisi kama “na,” kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Sadaka za kuteketezwa” ni istilahi ya kawaida ya kibiblia; sentensi inahifadhi mpangilio wa wakati na mvutano wa maandishi ya Kiebrania.
