base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/011.yaml
  text: 'And they sang responsively praising and giving thanks to Yahweh: “For he is good[c][b][a], for his steadfast love toward Israel is forever.” And all the people shouted a great shout in praise to Yahweh because the house of Yahweh had been founded.'
translation:
  language: sw
  text: 'Nao wakaimba kwa kuitikiana[a], wakimsifu na kumshukuru Yahweh: “Kwa maana yeye ni mwema, kwa maana upendo wake thabiti kwa Israeli ni wa milele[b].” Watu wote wakapaza sauti kwa kishindo kikubwa wakimsifu Yahweh, kwa sababu nyumba ya Yahweh ilikuwa imewekewa msingi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaitikia.” Kitenzi cha Kiebrania kinaweza kumaanisha kuitikia; hapa huenda walikuwa wakisifu kwa kupokezana au kuitikiana.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa maana upendo wake thabiti hudumu milele kwa Israeli.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, Kiebrania kinasema kwamba nyumba ya Yahweh “ilikuwa imeanzishwa” au “imewekewa msingi”; katika muktadha huu ni kuwekwa kwa msingi wa Hekalu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: wakaimba kwa kuitikiana
  rationale: Katika muktadha huu wa ibada, kitenzi ענה kinaonyesha kuitikiana katika sifa; neno ‘wakaimba’ linaweka wazi hali ya ibada bila kuficha maana ya msingi ya kuitikia.
- source_word: בְּהַלֵּל וּבְהוֹדֹת
  choice: wakimsifu na kumshukuru
  rationale: 'Muundo wa kivitenzi ni wa asili katika Kiswahili na unahifadhi matendo yote mawili tofauti: kusifu na kushukuru.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano lililoandikwa kwa herufi nne za Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: כִּי טוֹב
  choice: Kwa maana yeye ni mwema
  rationale: Huu ni usemi wa kawaida wa ungamo la sifa; kiwakilishi na kitenzi vimewekwa wazi ili sentensi iwe kamili na ya kawaida kwa Kiswahili.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: kwa maana upendo wake thabiti ... ni wa milele
  rationale: ‘Upendo thabiti’ huonyesha upendo, uaminifu, na kudumu kunakohusishwa na חֶסֶד, bila kuufungia neno hilo katika maana moja finyu.
- source_word: עַל יִשְׂרָאֵל
  choice: kwa Israeli
  rationale: Hapa עַל inaonyesha yule anayeelekezewa upendo huo; ‘kwa Israeli’ ni ya kawaida katika Kiswahili na inadumisha uhusiano huo.
- source_word: הֵרִיעוּ תְרוּעָה גְדוֹלָה
  choice: wakapaza sauti kwa kishindo kikubwa
  rationale: Kiebrania kinatumia kitenzi na nomino zenye mzizi mmoja kwa mkazo. Kiswahili kinafikisha nguvu hiyo kwa usemi wa asili ‘kupaza sauti kwa kishindo kikubwa’.
- source_word: בְּהַלֵּל לַיהוָה
  choice: wakimsifu Yahwe
  rationale: Usemi huu unaeleza tabia na kusudi la kishindo cha watu; muundo wa kivitenzi unasomeka kwa urahisi katika Kiswahili.
- source_word: עַל הוּסַד בֵּית יְהוָה
  choice: kwa sababu nyumba ya Yahwe ilikuwa imewekewa msingi
  rationale: Hophal ya יסד ina maana ya kuwekewa msingi au kuanzishwa. Tafsiri hii inadumisha ‘nyumba’ kama kiima cha Kiebrania huku ikionyesha wazi tukio la kuwekwa kwa msingi katika muktadha.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חַסְדּוֹ katika ungamo la agano
  choice: upendo wake thabiti
  alternative: fadhili zake; rehema zake; upendo wake wa agano
  rationale: Chaguo hili linahifadhi kwa pamoja wazo la upendo na uaminifu unaodumu, bila kuongeza neno ‘agano’ ambalo halijaandikwa wazi katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ibada umewekwa kwa lugha inayoeleweka kwa wasomaji wa kawaida; uradidi wa ‘kwa maana’ umehifadhiwa kwa sababu ni sehemu ya mfumo wa sifa wa Kiebrania.
