  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inalenga usawa bora: inatunza tofauti kati ya shangwe na kilio, huku ikitumia miundo inayoeleweka kwa msomaji wa kawaida.'
