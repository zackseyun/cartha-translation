base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/013.yaml
  text: And the people could not distinguish the sound of the shout of joy from the sound of the people’s weeping[a], for the people were shouting with a great shout[b], and the sound was heard far away.
translation:
  language: sw
  text: Watu hawakuweza kutofautisha sauti ya shangwe na sauti ya kilio cha watu,[a] kwa maana watu walikuwa wakipiga kelele kwa sauti kubwa,[b] nayo sauti hiyo ikasikika mbali sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuweza kuitambua sauti ya shangwe kutokana na sauti ya kilio cha watu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kwa shangwe kubwa”; neno hilo linaweza pia kutafsiriwa “kelele kubwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכִּירִים
  choice: hawakuweza kutofautisha
  rationale: Katika kausativi ya Kiebrania, kitenzi hiki hapa kinaonyesha kutambua tofauti kati ya sauti mbili; ‘kutofautisha’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: קוֹל
  choice: sauti
  rationale: Muktadha unahusu jambo linalosikika, si maneno yanayosemwa; ‘sauti’ ni neno la kawaida na sahihi.
- source_word: תְּרוּעַת הַשִּׂמְחָה
  choice: sauti ya shangwe
  rationale: תְּרוּעָה ni mlio au kelele kubwa ya furaha; ‘sauti ya shangwe’ ni ya asili kwa Kiswahili na inahifadhi wazo la furaha inayosikika.
- source_word: לְקוֹל בְּכִי הָעָם
  choice: na sauti ya kilio cha watu
  rationale: לְ hapa inaunganisha vitu vinavyolinganishwa. ‘Kilio’ huhifadhi uzito wa kihisia wa בְּכִי na kurejelea watu waliokuwa wakilia.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya kutoweza kutofautisha sauti hizo.
- source_word: מְרִיעִים תְּרוּעָה גְדוֹלָה
  choice: walikuwa wakipiga kelele kwa sauti kubwa
  rationale: Kirai hiki huhifadhi tendo linaloendelea na nguvu ya תְּרוּעָה גְדוֹלָה kwa Kiswahili cha kawaida, ingawa uradidi wa mzizi wa Kiebrania hauwezi kuigwa kikamilifu.
- source_word: נִשְׁמַע
  choice: ikasikika
  rationale: Huhifadhi hali tendwa ya kitenzi cha Kiebrania huku ikiunganisha sentensi kwa mtiririko wa kawaida wa Kiswahili.
- source_word: עַד לְמֵרָחוֹק
  choice: mbali sana
  rationale: Kirai kinaonyesha kwamba sauti ilifika umbali mkubwa; ‘mbali sana’ ni wazi na ya asili.
