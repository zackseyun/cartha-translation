  yaml_path: translation/ot/ezra/003/004.yaml
  text: They kept the Festival of Booths as it is written, and offered the daily burnt offerings by number according to the ordinance, as each day required.
translation:
  language: sw
  text: Wakaadhimisha Sikukuu ya Vibanda kama ilivyoandikwa, wakatoa sadaka za kuteketezwa za kila siku kwa idadi, kulingana na utaratibu, kama ilivyotakiwa kwa kila siku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַג הַסֻּכּוֹת
  choice: Sikukuu ya Vibanda
  rationale: Jina la kawaida na linaloeleweka la sikukuu hiyo, likidumisha picha halisi ya makao ya muda.
- source_word: וְעֹלַת יוֹם בְּיוֹם
  choice: wakatoa sadaka za kuteketezwa kila siku
  rationale: עֹלָה ni sadaka inayoteketezwa; יוֹם בְּיוֹם inaonyesha utoaji wa siku kwa siku.
- source_word: בְּמִסְפָּר
  choice: kwa idadi iliyowekwa
  rationale: Muktadha unaonyesha idadi maalumu ya sadaka kwa kila siku, si kuhesabu tu bila kiwango kilichoamriwa.
- source_word: כְּמִשְׁפָּט
  choice: kulingana na utaratibu
  rationale: Hapa neno linaashiria kanuni au utaratibu uliowekwa kwa ibada.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: kama kila siku ilivyohitaji
  rationale: Nahau hiyo inaeleza sehemu au wajibu uliopangwa kwa siku husika.
theological_decisions:
- issue: Uhusiano wa ibada na maagizo yaliyoandikwa
  choice: kama ilivyoandikwa
  alternative: kulingana na yaliyoandikwa
  rationale: Tafsiri ya moja kwa moja inahifadhi msisitizo wa mwandishi kwamba maadhimisho yalifuata maandiko bila kubainisha zaidi ni kifungu gani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umerahisishwa kiasi bila kupoteza marudio ya kila siku na wazo la idadi iliyoamriwa.
