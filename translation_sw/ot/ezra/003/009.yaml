  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד יֵשׁ֡וּעַ בָּנָ֣י/ו וְ֠/אֶחָי/ו קַדְמִיאֵ֨ל וּ/בָנָ֤י/ו בְּנֵֽי יְהוּדָה֙ כְּ/אֶחָ֔ד לְ/נַצֵּ֛חַ עַל עֹשֵׂ֥ה הַ/מְּלָאכָ֖ה בְּ/בֵ֣ית הָ/אֱלֹהִ֑ים בְּנֵי֙ חֵֽנָדָ֔ד בְּנֵי/הֶ֥ם וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּֽם־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/009.yaml
  text: Then Jeshua[a], his sons and his brothers, and Kadmiel and his sons, the sons of Judah, stood together as one to oversee those doing the work in the house of God, along with the sons of Henadad, their sons and their brothers, the Levites.
translation:
  language: sw
  text: Ndipo Yeshua, wanawe na ndugu zake, Kadmieli na wanawe, wana wa Yuda[a], wakasimama pamoja ili kuwasimamia wale waliokuwa wakifanya kazi katika nyumba ya Mungu, pamoja na wana wa Henadadi, wana wao na ndugu zao, Walawi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Yuda.” Baadhi ya tafsiri za kale na tafsiri za kisasa husoma “wana wa Hodavia.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: wakasimama
  rationale: Kitenzi עמד humaanisha kusimama au kuchukua nafasi; hapa kinaonyesha kuwa makundi hayo yalichukua nafasi yao ya usimamizi.
- source_word: יֵשׁוּעַ
  choice: Yeshua
  rationale: Jina limetoholewa kwa namna inayokaribia umbo la Kiebrania na inayosomeka kwa kawaida katika Kiswahili.
- source_word: בָּנָיו וְאֶחָיו
  choice: wanawe na ndugu zake
  rationale: Huhifadhi wazi istilahi za ukoo za kiume katika chanzo, huku viwakilishi vya Kiswahili vikirejelea Yeshua kwa kawaida.
- source_word: קַדְמִיאֵל וּבָנָיו
  choice: pamoja na Kadmieli na wanawe
  rationale: Huwasilisha kundi la pili la kifamilia sambamba na lile la Yeshua; “pamoja na” huunganisha orodha kwa Kiswahili cha kawaida.
- source_word: בְּנֵי יְהוּדָה
  choice: wana wa Yuda
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya maandishi ya Kimasora yaliyotolewa. Tofauti ya “Hodavia” imehifadhiwa katika tanbihi.
- source_word: כְּאֶחָד
  choice: kwa umoja
  rationale: Hueleza hatua yao ya pamoja na nia moja bila kutumia msemo mzito au wa kizamani.
- source_word: לְנַצֵּחַ
  choice: ili kuwasimamia
  rationale: Katika muktadha huu mzizi נצח katika piel unahusu kuongoza au kusimamia kazi, si uongozi wa muziki.
- source_word: עַל עֹשֵׂה הַמְּלָאכָה
  choice: wale waliofanya kazi
  rationale: Nomino-tendo ya umoja imetumiwa kwa maana ya kundi; tafsiri hii huhifadhi wazo la watu wanaotekeleza kazi bila kuongeza maelezo yasiyokuwapo.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: katika nyumba ya Mungu
  rationale: Huhifadhi usemi wa kawaida wa kibiblia unaolitaja hekalu kama nyumba ya Mungu.
- source_word: בְּנֵי חֵנָדָד בְּנֵיהֶם וַאֲחֵיהֶם הַלְוִיִּם
  choice: pamoja na wana wa Henadadi, wana wao na ndugu zao, ambao walikuwa Walawi
  rationale: Huwajumuisha wana wa Henadadi na jamaa zao katika kundi la wasimamizi, huku kishazi cha mwisho kikiwatambulisha wazi kuwa Walawi.
theological_decisions:
- issue: Tofauti ya matini au tafsiri katika בְּנֵי יְהוּדָה
  choice: Kutafsiri matini ya Kimasora moja kwa moja kuwa “wana wa Yuda.”
  alternative: wana wa Hodavia
  rationale: WLC iliyotolewa inasoma “Yuda.” Kwa kuwa mapokeo mengine yanaonyesha jina tofauti, usomaji huo haujaingizwa kimya kimya katika matini bali umeandikwa katika tanbihi.
- issue: Uhusiano wa “wana wa Yuda” na Kadmieli na wanawe
  choice: Kutumia “yaani wana wa Yuda” ili kuonyesha utambulisho wa karibu wa kundi lililotajwa kabla.
  alternative: 'Kuliorodhesha kama kundi jingine tofauti: “na wana wa Yuda.”'
  rationale: Muundo wa Kiebrania unaweka בְּנֵי יְהוּדָה baada ya Kadmieli na wanawe bila kiunganishi, jambo linalounga mkono kuichukulia kama maelezo ya utambulisho wao, ingawa muundo huo una ugumu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Majina yametoholewa kuwa Yeshua, Kadmieli na Henadadi. Sentensi ndefu ya orodha imehifadhiwa kwa sababu inaonyesha muundo wa kifamilia wa chanzo, huku “pamoja na” na “ambao walikuwa” zikisaidia uwazi.
