base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/012.yaml
  text: But many of the priests and the Levites and the heads of the fathers’ houses[a], the old men who had seen the first house, were weeping with a loud voice when this house was founded before their eyes[c][b], while many were raising their voice with a shout of joy.
translation:
  language: sw
  text: Lakini wengi miongoni mwa makuhani, Walawi, na wakuu wa jamaa za ukoo[a]—wazee waliokuwa wameiona nyumba ya kwanza[b]—walilia kwa sauti kubwa wakati nyumba hii ilipowekewa msingi mbele ya macho yao[c], huku wengi wakipaza sauti kwa shangwe ya furaha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, wakuu wa vikundi vya kifamilia vilivyotokana na babu mmoja.
    reason: cultural_note
  - marker: b
    text: Au, “nyumba ya awali.” Kiebrania kinasema kihalisi “nyumba ya kwanza,” kikimaanisha hekalu la awali.
    reason: lexical_alternative
  - marker: c
    text: Au, “wakati nyumba hii ilipoanzishwa mbele ya macho yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַבִּים
  choice: Lakini wengi
  rationale: Kiunganishi וְ kinaweza kuwa ‘na,’ lakini hapa ‘lakini’ linaonyesha tofauti na shangwe ya mstari uliotangulia.
- source_word: מֵהַכֹּהֲנִים וְהַלְוִיִּם וְרָאשֵׁי הָאָבוֹת
  choice: kati ya makuhani, Walawi, na viongozi wa jamaa za ukoo
  rationale: מִן ina maana ya sehemu ya kundi, hivyo ‘kati ya.’ ‘Viongozi wa jamaa za ukoo’ hueleza kwa Kiswahili cha kawaida viongozi wa vikundi vya kifamilia vya mababu.
- source_word: הַזְּקֵנִים
  choice: wazee
  rationale: Muktadha unasisitiza umri wao kwa kuwa waliiona nyumba ya awali; ‘wazee’ ni neno la kawaida linaloweza kueleza umri bila kulazimisha cheo rasmi.
- source_word: אֲשֶׁר רָאוּ אֶת הַבַּיִת הָרִאשׁוֹן
  choice: waliokuwa wameiona nyumba ya kwanza
  rationale: ‘Nyumba’ huhifadhi istilahi ya Kiebrania, huku ‘ya kwanza’ ikihifadhi maana ya הָרִאשׁוֹן; hapa nyumba hiyo ni hekalu.
- source_word: בְּיָסְדוֹ זֶה הַבַּיִת בְּעֵינֵיהֶם
  choice: walipoona msingi wa nyumba hii ukiwekwa
  rationale: Tafsiri hii inaonyesha kitendo cha kuweka msingi na pia ushuhuda wa moja kwa moja unaoelezwa na ‘machoni pao,’ kwa Kiswahili cha asili.
- source_word: בֹּכִים בְּקוֹל גָּדוֹל
  choice: walilia kwa sauti kubwa
  rationale: Huhifadhi kitendo kinachoendelea katika simulizi na taswira ya ‘sauti kubwa.’
- source_word: בִּתְרוּעָה בְשִׂמְחָה לְהָרִים קוֹל
  choice: wakipaza sauti kwa shangwe ya furaha
  rationale: ‘Kupaza sauti’ huhifadhi nahau ya kuinua sauti, na ‘shangwe ya furaha’ huwakilisha תרועה pamoja na שמחה.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unaonyesha tofauti kati ya kilio cha wazee na shangwe ya kundi jingine bila kuongeza sababu ya huzuni ambayo haijasemwa wazi katika mstari.
