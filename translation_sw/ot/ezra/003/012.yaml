revisions:
- from: Lakini wengi kati ya makuhani, Walawi, na viongozi wa jamaa za ukoo[a]—wazee waliokuwa wameiona nyumba ya kwanza[b]—walilia kwa sauti kubwa walipoona msingi wa nyumba hii ukiwekwa[c], huku wengine wengi wakipaza sauti kwa shangwe ya furaha.
  to: Lakini wengi miongoni mwa makuhani, Walawi, na wakuu wa jamaa za ukoo[a]—wazee waliokuwa wameiona nyumba ya kwanza[b]—walilia kwa sauti kubwa wakati nyumba hii ilipowekewa msingi mbele ya macho yao[c], huku wengi wakipaza sauti kwa shangwe ya furaha.
  rationale: The revision renders the foundation-laying as the temporal event and explicitly retains “mbele ya macho yao,” matching the Hebrew construction without adding an action of seeing. It also removes the unsupported explicit designation “wengine,” while preserving the contrast through “huku.” The revised clan-leader expression is natural Standard East African Swahili and retains the ancestral-household sense, supported by the cultural note.
