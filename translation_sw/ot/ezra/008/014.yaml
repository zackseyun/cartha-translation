  text: 'And from the sons of Bigvai: Uthai and Zabbud[b][a], and with them seventy males.'
translation:
  language: sw
  text: 'Na kutoka kwa wana wa Bigwai: Utai na Zabudi[a], na pamoja naye[b] wanaume sabini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya mapokeo ya maandishi na tafsiri za kale huonyesha jina tofauti la pili hapa; Maandishi ya Kimasoreti yanasema “Zabudi.”
    reason: textual_variant
  - marker: b
    text: Kiebrania kinasema “pamoja naye” kwa umoja, ingawa baadhi ya tafsiri hutumia “pamoja nao” kwa sababu majina mawili yametajwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Na kutoka kwa wana wa
  rationale: Muundo huu unafuata moja kwa moja מִן + בְּנֵי katika orodha ya kifamilia. Hapa “wana” inaweza pia kumaanisha wazao, lakini inadumisha namna ya ukoo iliyo katika Kiebrania.
- source_word: בִגְוַי
  choice: Bigvai
  rationale: Jina la mtu au ukoo limetoholewa kwa herufi za Kiswahili bila kubadili utambulisho wake.
- source_word: עוּתַי
  choice: Uthai
  rationale: Jina limetoholewa kwa kufuata umbo la Kiebrania.
- source_word: ו/זבוד
  choice: na Zabudi
  rationale: Maandishi ya Kimasoreti yana jina זבוד; kiambishi ו kimetafsiriwa “na.” Umbo “Zabudi” linaendana na matamshi na maumbo ya majina ya kibiblia katika Kiswahili.
- source_word: וְ/עִמּ/וֹ
  choice: na pamoja naye
  rationale: Kiwakilishi cha Kiebrania ni nafsi ya tatu umoja wa kiume, hivyo “naye” kinahifadhi umoja huo badala ya kuusawazisha kuwa wingi kwa sababu ya majina mawili yaliyotangulia.
- source_word: שִׁבְעִים
  choice: sabini
  rationale: Ni tafsiri ya moja kwa moja ya namba ya Kiebrania.
- source_word: הַ/זְּכָרִים
  choice: wanaume
  rationale: זְכָרִים hubainisha watu wa jinsia ya kiume katika muktadha huu wa orodha; “wanaume” ni Kiswahili cha kawaida na chenye usahihi hapa.
