base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/019.yaml
  text: and Hashabiah[a], and with him Jeshaiah, from the sons of Merari, his brothers and their sons, twenty[b];
translation:
  language: sw
  text: na Hashabia, na Yeshaya pamoja naye, kutoka kwa wana wa Merari[a], ndugu zake[b] na wana wao, jumla watu ishirini;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa Wamerari.” Kiebrania kinasema kihalisi, “kutoka kwa wana wa Merari.”
    reason: lexical_alternative
  - marker: b
    text: Huenda “ndugu zake” hapa inamaanisha ndugu wa ukoo au jamaa wa karibu wa kiume katika ukoo wa Merari, wala si lazima wawe ndugu wa tumbo moja tu.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֶת חֲשַׁבְיָה
  choice: na Hashabia
  rationale: Kiunganishi kinaendeleza orodha ya waliotajwa katika muktadha uliotangulia; alama ya yambwa ya Kiebrania haihitaji kutafsiriwa moja kwa moja. Jina limenukuliwa kwa tahajia ya kawaida ya Kiswahili.
- source_word: וְאִתּוֹ יְשַׁעְיָה
  choice: na pamoja naye Yeshaya
  rationale: Huhifadhi maana ya kuandamana na uratibu wa Kiebrania. Tahajia ‘Yeshaya’ inawakilisha jina la Kiebrania kwa namna ya kawaida na inalitofautisha na tahajia iliyozoeleka ‘Isaya’.
- source_word: מִבְּנֵי מְרָרִי
  choice: kutoka kwa wana wa Merari
  rationale: Hufuata kwa karibu nahau ya ukoo ya Kiebrania, ‘kutoka kwa wana wa Merari,’ bila kuifasiri kimya kimya kuwa kundi la kikabila pekee.
- source_word: אֶחָיו
  choice: ndugu zake
  rationale: Neno la Kiebrania kwa msingi ni ‘ndugu zake,’ lakini katika orodha hii linaweza kumaanisha ndugu wa ukoo au jamaa wa kiume, si lazima ndugu wa tumbo moja.
- source_word: וּבְנֵיהֶם
  choice: na wana wao
  rationale: Huhifadhi nomino ya kiume ya Kiebrania na uhusiano wake na kundi lililotajwa, bila kuongeza kihusishi kisichokuwapo katika chanzo.
- source_word: עֶשְׂרִים
  choice: watu ishirini
  rationale: Idadi inaeleweka kuwa jumla ya watu katika kundi lililotajwa; kuongeza ‘watu’ hufanya Kiswahili kiwe wazi na cha kawaida bila kubadili maana.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa orodha na nahau ya ukoo vimehifadhiwa kwa kadiri inayowezekana, huku ‘watu’ ikiongezwa kabla ya idadi kwa ufasaha wa Kiswahili.
