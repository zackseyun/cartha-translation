  text: from the sons of Phinehas, Gershom; from the sons of Ithamar, Daniel; from the sons of David, Hattush.
translation:
  language: sw
  text: kutoka kwa wana wa Finehasi, Gershomu; kutoka kwa wana wa Ithamari, Danieli; kutoka kwa wana wa Daudi, Hatushi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּנֵי
  choice: kutoka kwa wana wa
  rationale: Muundo huu unahifadhi fomula ya ukoo/chanzo na urudiaji wa Kiebrania katika orodha. Katika muktadha huu, “wana” linaweza kujumuisha wazao wa baadaye, bila kulazimisha ufafanuzi huo ndani ya matini.
- source_word: פִינְחָס
  choice: Finehasi
  rationale: Jina la mtu limeandikwa kwa umbo linalotambulika na lililozoeleka katika Kiswahili cha Biblia.
- source_word: גֵּרְשֹׁם
  choice: Gershomu
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili huku likibaki karibu na umbo la Kiebrania.
- source_word: אִיתָמָר
  choice: Ithamari
  rationale: Jina la mtu limetoholewa kwa Kiswahili na kuhifadhi konsonanti ya mwanzo ya Kiebrania.
- source_word: דָּנִיֵּאל
  choice: Danieli
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: דָוִיד
  choice: Daudi
  rationale: Umbo la kawaida la jina hili katika Kiswahili; hapa linatambulisha ukoo wa kifalme.
- source_word: חַטּוּשׁ
  choice: Hatushi
  rationale: Jina limetoholewa kwa Kiswahili kwa kuzingatia matamshi ya Kiebrania.
