reference: Ezra 8:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ/בְּנֵ֥י שְׁכַנְיָ֖ה בֶּן יַחֲזִיאֵ֑ל וְ/עִמּ֕/וֹ שְׁלֹ֥שׁ מֵא֖וֹת הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/005.yaml
  text: From the sons of Shecaniah[a], the son of Jahaziel, and with him three hundred males.
translation:
  language: sw
  text: Miongoni mwa wana wa Shekania, mwana wa Yahazieli,[a] na pamoja naye watu wa kiume mia tatu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Muundo wa Kiebrania si wa kawaida. Huenda “mwana wa Yahazieli” anamfafanua Shekania; au huenda jina la kiongozi wa kundi halikutajwa.
    reason: syntactic_ambiguity
  - marker: b
    text: Au “wanaume.” Kiebrania kinasema hasa “wa kiume,” kikisisitiza jinsia badala ya umri au hadhi ya kijamii.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: Miongoni mwa wana wa
  rationale: Kirai hiki kinaonyesha kikundi kilichotoka ndani ya ukoo mkubwa zaidi. Neno “wana” linadumisha muundo wa nasaba wa orodha ya Kiebrania.
- source_word: שְׁכַנְיָה
  choice: Shekania
  rationale: Jina limetoholewa kwa tahajia ya kawaida na inayosomeka katika Kiswahili.
- source_word: בֶּן יַחֲזִיאֵל
  choice: mwana wa Yahazieli
  rationale: Tafsiri ya karibu inadumisha uhusiano wa nasaba, huku mpangilio wa Kiebrania ukibaki na utata kuhusu namna kirai hiki kinavyohusiana na Shekania.
- source_word: וְעִמּוֹ
  choice: na pamoja naye
  rationale: Inaendeleza muundo wa orodha na kuonyesha kwamba kundi lililohesabiwa liliandamana na mtu aliyetajwa.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: mia tatu
  rationale: Hii ndiyo hesabu ya moja kwa moja katika Kiswahili cha kawaida.
- source_word: הַזְּכָרִים
  choice: watu wa kiume
  rationale: Neno la Kiebrania linataja jinsia ya kiume hasa, wala si lazima wanaume watu wazima; “watu wa kiume” ni sahihi zaidi kuliko “wanaume” katika muktadha huu wa orodha.
theological_decisions:
- issue: Utambulisho wa “mwana wa Yahazieli” katika muundo mfupi wa orodha
  choice: Muundo wa karibu “Shekania, mwana wa Yahazieli” umetumiwa bila kuongeza jina lisilokuwamo katika maandishi ya Kiebrania.
  alternative: 'Kutafsiri kana kwamba kuna kiongozi ambaye jina lake halikutajwa: “mwana wa Yahazieli.”'
  rationale: Kiebrania kina muundo usio wa kawaida na hakitoi jina jingine la kiongozi. Tafsiri haiongezi jina kutoka mapokeo mengine ya maandishi, na tanbihi inaweka wazi utata huo.
translation_notes:
  register: Kiswahili ni sanifu, cha sasa na chenye heshima. Muundo wa kipande cha sentensi umehifadhiwa kwa sababu aya ni sehemu ya orodha inayoendelea. “Watu wa kiume” ni sahihi katika muktadha wa kihesabu, ingawa tanbihi inatoa “wanaume” kama usemi wa kawaida zaidi.
