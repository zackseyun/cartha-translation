lexical_decisions:
- source_word: וַנָּבוֹא
  choice: Basi tukafika
  rationale: Kitenzi בוא katika mfululizo wa simulizi kinaeleza kufika kwa wasafiri katika hatua inayofuata. “Tukafika” ni ya kawaida na sahihi katika muktadha huu; “Basi” linaendeleza simulizi kwa Kiswahili cha asili.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapa katika Kiswahili cha Biblia.
- source_word: וַנֵּשֶׁב
  choice: tukakaa
  rationale: ישב inaweza kumaanisha kuketi, kuishi, kubaki, au kukaa. Katika muktadha wa safari, “tukakaa” linaonyesha kukaa kwa muda baada ya kufika bila kudokeza makazi ya kudumu.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki kinarejelea Yerusalemu kama mahali palipotajwa; “huko” ni rejeleo la kawaida na la asili kwa mahali hapo.
- source_word: יָמִים שְׁלֹשָׁה
  choice: siku tatu
  rationale: Kirai hiki kinaonyesha muda waliokaa. Kiswahili hueleza muda huo moja kwa moja kama “siku tatu” bila kuhitaji kihusishi.
