  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֣י בֹ֗שְׁתִּי לִ/שְׁא֤וֹל מִן הַ/מֶּ֨לֶךְ֙ חַ֣יִל וּ/פָרָשִׁ֔ים לְ/עָזְרֵ֥/נוּ מֵ/אוֹיֵ֖ב בַּ/דָּ֑רֶךְ כִּֽי אָמַ֨רְנוּ לַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר יַד אֱלֹהֵ֤י/נוּ עַל כָּל מְבַקְשָׁי/ו֙ לְ/טוֹבָ֔ה וְ/עֻזּ֣/וֹ וְ/אַפּ֔/וֹ עַ֖ל כָּל עֹזְבָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/022.yaml
  text: For I was ashamed to ask the king for troops and horsemen to help us against the enemy on the way[a], because we had said to the king, “The hand of our God is for good on all who seek him[b], but his strength and his anger are against all who forsake him.”
translation:
  language: sw
  text: Kwa maana niliona aibu kumwomba mfalme kikosi cha askari na wapanda farasi ili watusaidie dhidi ya adui njiani.[a] Kwa sababu tulikuwa tumemwambia mfalme, “Mkono wa Mungu wetu[b] uko juu ya wote wanaomtafuta, kwa ajili ya mema yao; lakini nguvu zake na hasira yake ziko dhidi ya wote wanaomwacha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili watusaidie kutoka kwa adui safarini.” Kirai cha Kiebrania kinaweza kutafsiriwa kwa karibu hivi; “dhidi ya adui njiani” kinaendana vizuri na ombi la ulinzi wa kijeshi.
    reason: lexical_alternative
  - marker: b
    text: “Mkono wa Mungu wetu” ni usemi wa Kiebrania unaoonyesha utendaji wake wenye nguvu au fadhili zake.
    reason: cultural_note
lexical_decisions:
- source_word: בֹשְׁתִּי
  choice: niliona aibu
  rationale: Huwasilisha maana ya kuaibika au kuona jambo kuwa la aibu, si fedheha ndogo ya kijamii tu; pia ni usemi wa kawaida katika Kiswahili cha sasa.
- source_word: חַיִל
  choice: kikosi cha askari
  rationale: Katika muktadha huu neno linamaanisha jeshi au nguvu ya kijeshi ambayo mfalme angeitoa. “Kikosi cha askari” ni wazi bila kudokeza jeshi lote.
- source_word: פָרָשִׁים
  choice: wapanda farasi
  rationale: Hutunza picha halisi ya watu waliopanda farasi na ni wazi kuliko istilahi ya kitaalamu ya kijeshi.
- source_word: לְעָזְרֵנוּ
  choice: ili watusaidie
  rationale: Huonyesha kusudi la ombi kwa Kiswahili cha kawaida na cha asili.
- source_word: מֵאוֹיֵב בַּדָּרֶךְ
  choice: dhidi ya adui njiani
  rationale: Muktadha wa kuomba ulinzi wa kijeshi unaunga mkono “dhidi ya adui”; “njiani” kwa ufupi huonyesha adui aliyekabiliwa wakati wa safari.
- source_word: יַד אֱלֹהֵינוּ
  choice: Mkono wa Mungu wetu
  rationale: Inahifadhi sitiari ya Kiebrania kuhusu utendaji, uwezo, au fadhili za Mungu badala ya kuifafanua kwa maana moja tu.
- source_word: עַל כָּל מְבַקְשָׁיו לְטוֹבָה
  choice: huwa juu ya wote wanaomtafuta, kwa mema
  rationale: Inahifadhi taswira ya mkono kuwa “juu ya” watu pamoja na kirai “kwa mema,” bila kulazimisha kama kinamaanisha fadhili, manufaa, au matokeo mema pekee.
- source_word: וְעֻזּוֹ וְאַפּוֹ
  choice: nguvu zake na hasira yake
  rationale: Inayatenganisha majina mawili yaliyounganishwa katika Kiebrania, badala ya kuyachanganya kuwa wazo moja la “hasira yenye nguvu.”
- source_word: עַל כָּל עֹזְבָיו
  choice: dhidi ya wote wanaomwacha
  rationale: “Kumwacha” ni lugha ya sasa na inabeba maana ya kugeuka kutoka kwake; “dhidi ya” huonyesha wazi upinzani wa Mungu.
theological_decisions:
- issue: Sitiari ya kibinadamu katika יַד אֱלֹהֵינוּ
  choice: Kudumisha “Mkono wa Mungu wetu.”
  alternative: “Nguvu za Mungu wetu” au “fadhili za Mungu wetu.”
  rationale: Kiebrania kinatumia kwa makusudi taswira ya mkono kwa utendaji wa Mungu. Kuihifadhi huepuka kuifungia maana katika uwezo au fadhili pekee.
- issue: Maana ya לְטוֹבָה katika kauli kuhusu wanaomtafuta Mungu
  choice: “kwa mema,” ikiwa imeunganishwa na mkono wa Mungu kuwa juu yao
  alternative: “kwa faida yao” au “kwa fadhili.”
  rationale: Kirai cha Kiebrania kinaelekea kuonyesha matokeo au kusudi jema, lakini hakifafanui kwa ukamilifu aina ya wema huo. Tafsiri hii inadumisha upana wake.
- issue: Upinzani wa Mungu katika וְעֻזּוֹ וְאַפּוֹ
  choice: 'Kutafsiri vipengele viwili tofauti: “nguvu zake na hasira yake.”'
  alternative: “hasira yake yenye nguvu.”
  rationale: Matini ina majina mawili yaliyoratibiwa. Kuyadumisha huonyesha uwezo wa Mungu wa kutenda pamoja na hasira yake, bila kuyafanya kuwa dhana moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi ndefu ya Kiebrania imegawanywa mara mbili ili isomeke kwa urahisi, huku uhusiano wa sababu na kauli iliyonukuliwa ukidumishwa. Sitiari kuu ya “mkono” imehifadhiwa, na alama zote za tanbihi zimewekwa katika matini.
