base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/013.yaml
  text: 'And from the sons of Adonikam[a], the last ones, and these were their names: Eliphelet, Jeiel, and Shemaiah, and with them sixty males.'
translation:
  language: sw
  text: 'Na kutoka kwa wazao wa Adonikamu[a], wale wa mwisho—na haya ndiyo majina yao: Elifeleti, Yeieli, na Shemaya; pamoja nao walikuwa wanaume sitini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wale wa baadaye.” Huenda Kiebrania kinamaanisha kundi la mwisho kutoka katika ukoo wa Adonikamu, labda kwa kulitofautisha na kundi lililotajwa awali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Na kutoka kwa wazao wa
  rationale: Katika orodha ya ukoo, בְּנֵי inaweza kumaanisha wana au wazao. “Wazao” ni Kiswahili cha kawaida kinachoonyesha ukoo bila kudokeza kwamba wote walikuwa wana wa moja kwa moja.
- source_word: אֲדֹנִיקָם
  choice: Adonikamu
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: אַחֲרֹנִים
  choice: wale wa mwisho
  rationale: Huhifadhi maana ya ‘wa mwisho’ au ‘wa baadaye’ na pia utata kuhusu kama ni kundi la mwisho la ukoo huo.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: na haya ndiyo majina yao
  rationale: Ni namna ya asili ya Kiswahili ya kuanzisha orodha ya majina huku ikihifadhi kiunganishi cha Kiebrania.
- source_word: אֱלִיפֶלֶט
  choice: Elifeleti
  rationale: Jina limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: יְעִיאֵל
  choice: Yeieli
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa namna inayosomeka katika Kiswahili.
- source_word: וּשְׁמַעְיָה
  choice: na Shemaya
  rationale: Jina limetoholewa, na kiunganishi kimehifadhiwa katika orodha.
- source_word: וְעִמָּהֶם
  choice: pamoja nao walikuwa
  rationale: Huonyesha uandamani na hukamilisha sentensi kwa Kiswahili cha kawaida; kiunganishi kinawakilishwa na muendelezo wa kishazi baada ya nuktamkato.
- source_word: שִׁשִּׁים
  choice: sitini
  rationale: Tafsiri ya moja kwa moja ya namba.
- source_word: הַזְּכָרִים
  choice: wanaume
  rationale: Neno la Kiebrania hubainisha watu wa jinsia ya kiume. “Wanaume” ni la kawaida na lenye heshima katika Kiswahili; katika muktadha huu halilazimishi tafsiri kuwa watoto wa kiume.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha umehifadhiwa, lakini “wazao” umetumiwa badala ya “wana” ili kuwasilisha kwa kawaida matumizi mapana ya neno la ukoo. Alama ya dashi hutenga kirai “wale wa mwisho,” na nuktamkato huifanya orodha ndefu isomeke kwa urahisi.
