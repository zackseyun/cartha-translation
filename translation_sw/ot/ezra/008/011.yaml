  text: 'And from the sons of Bebai: Zechariah son of Bebai[a], and with him twenty-eight males.'
translation:
  language: sw
  text: 'Na kutoka kwa wana wa Bebai[a]: Zekaria mwana wa Bebai, na pamoja naye wanaume ishirini na wanane.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “wana wa Bebai” inaweza kumaanisha kwa upana zaidi wazao au watu wa ukoo wa Bebai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Na kutoka kwa wana wa
  rationale: Huhifadhi muundo wa Kiebrania katika orodha hii; hapa “wana” inaweza pia kumaanisha wazao au watu wa ukoo.
- source_word: בֵבַי
  choice: Bebai
  rationale: Jina la mtu limetoholewa kwa namna iliyo wazi na inayofaa Kiswahili.
- source_word: זְכַרְיָה
  choice: Zekaria
  rationale: Namna ya kawaida ya kulitaja jina hili katika Kiswahili cha Biblia.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika muundo huu wa kumtaja mtu kwa baba yake, tafsiri ya moja kwa moja na ya kawaida ni “mwana wa.”
- source_word: וְעִמּוֹ
  choice: na pamoja naye
  rationale: Huhifadhi kiunganishi na kueleza kuwa watu waliotajwa waliandamana na Zekaria.
- source_word: עֶשְׂרִים וּשְׁמֹנָה
  choice: ishirini na wanane
  rationale: Namba imetafsiriwa kwa muundo wa kawaida wa Kiswahili na kupatanishwa na nomino “wanaume.”
- source_word: הַזְּכָרִים
  choice: wanaume
  rationale: Neno la Kiebrania linabainisha watu wa jinsia ya kiume. “Wanaume” ni ya asili zaidi katika orodha ya Kiswahili kuliko “wa kiume,” ingawa inaweza kudokeza utu uzima.
