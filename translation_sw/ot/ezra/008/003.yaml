base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/003.yaml
  text: 'From the sons of Shecaniah[a], from the sons of Parosh: Zechariah, and with him were enrolled by genealogy 150 males.'
translation:
  language: sw
  text: 'Miongoni mwa wazao wa Shekania; miongoni mwa wazao wa Paroshi: Zekaria; pamoja naye, wanaume 150 waliandikishwa kwa nasaba[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliorodheshwa kwa nasaba.” Kitenzi cha Kiebrania kinamaanisha kuandikishwa au kuhesabiwa rasmi katika kumbukumbu za nasaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: miongoni mwa wazao wa
  rationale: Katika orodha hii, kirai kinaonyesha watu wanaotoka katika ukoo fulani. “Wazao” ni ya kawaida na inafaa zaidi kuliko “wana” pale panapohusika vizazi vya ukoo.
- source_word: שְׁכַנְיָה
  choice: Shekania
  rationale: Tahajia ya Kiswahili inayowakilisha jina la Kiebrania kwa uwazi.
- source_word: פַרְעֹשׁ
  choice: Paroshi
  rationale: Utohozi wa kawaida wa jina hili kwa muundo wa matamshi ya Kiswahili.
- source_word: זְכַרְיָה
  choice: Zekaria
  rationale: Umbo la jina linalotambulika na wasomaji wa Biblia ya Kiswahili.
- source_word: וְעִמּוֹ
  choice: Pamoja naye
  rationale: Linahifadhi maana fupi ya watu walioandamana au kuhusishwa na Zekaria katika orodha.
- source_word: הִתְיַחֵשׂ
  choice: waliandikishwa kwa nasaba
  rationale: Kitenzi kinahusu kuingizwa rasmi katika kumbukumbu au orodha ya nasaba, si kutajwa tu kuwa wazao.
- source_word: לִזְכָרִים
  choice: wanaume
  rationale: Neno la Kiebrania linabainisha jinsia ya waliohesabiwa; “wanaume” ni tafsiri ya kawaida na inayoeleweka.
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: '150'
  rationale: Tarakimu inafaa kwa urahisi wa kusoma katika orodha ya watu na inahifadhi idadi kamili.
theological_decisions:
- issue: Uhusiano wa Shekania na ukoo wa Paroshi
  choice: Kuhifadhi vifungu viwili vinavyofuatana kwa alama ya nuktamkato
  alternative: Kumfanya Shekania moja kwa moja kuwa wa ukoo wa Paroshi au kudhani jina lililokosekana
  rationale: Muundo wa Kiebrania una vifungu viwili vya nasaba vinavyofuatana na hautoi wazi jinsi vinavyohusiana. Tafsiri haiongezi jina wala kutatua kimya kimya ugumu huo wa maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo wa orodha umehifadhiwa, pamoja na kutokuwekwa wazi kwa uhusiano kati ya Shekania na Paroshi.
