  text: ו/אשקול/ה לָ/הֶ֔ם אֶת הַ/כֶּ֥סֶף וְ/אֶת הַ/זָּהָ֖ב וְ/אֶת הַ/כֵּלִ֑ים תְּרוּמַ֣ת בֵּית אֱלֹהֵ֗י/נוּ הַ/הֵרִ֨ימוּ֙ הַ/מֶּ֨לֶךְ֙ וְ/יֹעֲצָ֣י/ו וְ/שָׂרָ֔י/ו וְ/כָל יִשְׂרָאֵ֖ל הַ/נִּמְצָאִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/025.yaml
  text: And I weighed out to them the silver[a], the gold, and the vessels—the contribution for the house of our God that the king, his counselors, his officials, and all Israel who were present had offered.
translation:
  language: sw
  text: Nikawapimia kwa uzani fedha, dhahabu, na vyombo—mchango[a] kwa ajili ya nyumba ya Mungu wetu, ambao mfalme, washauri wake, maafisa wake, na Israeli wote waliokuwapo walikuwa wameutoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka.” Neno la Kiebrania linaweza kumaanisha mchango uliotengwa kwa matumizi matakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֳלָה
  choice: Nikawapimia kwa uzani
  rationale: Kitenzi שקל kinamaanisha kupima kwa uzani. Katika muktadha huu Ezra anawakabidhi watu hao vitu vya thamani vilivyopimwa; kauli hii inahifadhi tendo halisi la kupima na pia wazo la kuwapa walengwa.
- source_word: לָהֶם
  choice: -wa- katika “Nikawapimia”
  rationale: Kiambishi cha yambwa kinaonyesha kwamba wao ndio waliopokea vitu vilivyopimwa, kwa namna ya kawaida katika Kiswahili.
- source_word: הַכֶּסֶף
  choice: fedha
  rationale: Hapa כסף inarejelea madini ya fedha, si pesa kwa ujumla, kwa kuwa imetajwa pamoja na dhahabu na vyombo.
- source_word: הַזָּהָב
  choice: dhahabu
  rationale: Hili ni jina la moja kwa moja la madini ya thamani yanayotajwa.
- source_word: הַכֵּלִים
  choice: vyombo
  rationale: כֵּלִים ni neno pana kwa vifaa au vitu vinavyotumika; “vyombo” linafaa katika muktadha wa nyumba ya Mungu bila kubainisha matumizi ambayo maandishi hayajabainisha.
- source_word: תְּרוּמַת
  choice: mchango
  rationale: Neno hili humaanisha kitu kilichotolewa na kutengwa, hasa kwa matumizi matakatifu. “Mchango” linaonyesha hali ya vitu hivi kuwa vilitolewa, bila kulifanya kuwa aina maalumu ya dhabihu.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: nyumba ya Mungu wetu
  rationale: Tafsiri hii inahifadhi taswira ya Kiebrania ya “nyumba,” ingawa katika muktadha inarejelea hekalu.
- source_word: הֵרִימוּ
  choice: walikuwa wameutoa
  rationale: Katika muktadha wa ibada, Hifili ya רום hutumika kwa kutoa au kuwasilisha mchango. Wakati timilifu uliotangulia unaonyesha kwamba mchango ulitolewa kabla ya Ezra kuupima.
- source_word: יֹעֲצָיו
  choice: washauri wake
  rationale: Neno hili linawataja watu waliompa mfalme ushauri.
- source_word: שָׂרָיו
  choice: maofisa wake
  rationale: Katika mazingira ya utawala wa Uajemi, “maofisa” linaonyesha kazi yao ya kiutawala bila kudokeza lazima kwamba walikuwa wana wa kifalme.
- source_word: כָּל יִשְׂרָאֵל הַנִּמְצָאִים
  choice: Israeli wote waliokuwapo
  rationale: Kauli hii inahifadhi matumizi ya “Israeli” kama jina la pamoja la watu na inaonyesha wale waliokuwa mahali hapo.
theological_decisions:
- issue: Maana ya neno la kiibada תְּרוּמָה katika muktadha wa vitu vilivyotolewa kwa hekalu
  choice: mchango
  alternative: sadaka
  rationale: “Mchango” huhifadhi wazo la kitu kilichotolewa na kutengwa kwa matumizi matakatifu bila kuingiza aina maalumu ya ibada ya dhabihu ambayo muktadha hautaji. “Sadaka” bado ni tafsiri inayowezekana na imeonyeshwa katika tanbihi.
- issue: Tafsiri ya בֵּית אֱלֹהֵינוּ
  choice: nyumba ya Mungu wetu
  alternative: hekalu la Mungu wetu
  rationale: “Nyumba ya Mungu wetu” inafuata taswira halisi ya maandishi ya Kiebrania na haisuluhishi kimya kimya lugha hiyo kuwa “hekalu,” ingawa hekalu ndilo linalorejelewa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Nikawapimia kwa uzani” unaeleweka kwa urahisi huku ukihifadhi tendo la kupima; “nyumba ya Mungu wetu” inadumisha taswira ya chanzo. Alama ya tanbihi imewekwa baada ya neno “mchango,” ambalo ndilo tanbihi inalolifafanua.
