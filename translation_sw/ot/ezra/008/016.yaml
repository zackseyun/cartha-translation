base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/016.yaml
  text: Then I sent for Eliezer[a], Ariel, Shemaiah, Elnathan, Jarib, Elnathan, Nathan, Zechariah, and Meshullam, heads, and for Joiarib and Elnathan[b], men of understanding.
translation:
  language: sw
  text: Ndipo nikatuma kuwaita Eliezeri, Arieli, Shemaya, Elnathani, Yaribu, Elnathani, Nathani, Zekaria na Meshulamu, wakuu,[a] na Yoyaribu na Elnathani, watu wenye ufahamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “vichwa,” yaani wakuu au viongozi.
    reason: lexical_alternative
  - marker: b
    text: “Watu wenye ufahamu” pia yaweza kutafsiriwa “watu wenye utambuzi” au “watu wenye busara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: Ndipo nikatuma watu wawaite
  rationale: Kitenzi שׁלח kinaendeleza mfululizo wa simulizi. Katika muktadha huu Ezra alituma ili watu hao waitwe; usemi huu ni wa kawaida katika Kiswahili, ingawa ‘watu’ wanaotumwa wameachwa kudokezwa katika Kiebrania.
- source_word: לֶאֱלִיעֶזֶר ... וּלְאֶלְנָתָן
  choice: wawaite Eliezeri ... na Elnathani
  rationale: Herufi ל inayorudiwa inaonyesha watu walioelekezewa wito. Muundo wa Kiswahili hauhitaji kurudia kihusishi mbele ya kila jina.
- source_word: רָאשִׁים
  choice: viongozi
  rationale: Nomino hii maana yake halisi ni ‘vichwa,’ lakini hapa inaeleza hadhi ya watu waliokuwa wakuu au viongozi. ‘Viongozi’ ni ya wazi na ya kawaida katika Kiswahili cha sasa, huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: מְבִינִים
  choice: watu wenye ufahamu
  rationale: Kivumishi-partisipo cha בין kina maana ya kuelewa, kutambua, au kuwa na busara ya kuchanganua. Tafsiri hii haibainishi bila ushahidi kwamba walikuwa na cheo rasmi cha ualimu.
- source_word: וּלְיוֹיָרִיב וּלְאֶלְנָתָן מְבִינִים
  choice: pamoja na Yoyaribu na Elnathani, waliokuwa watu wenye ufahamu
  rationale: Kirai cha mwisho kinaeleweka kwa kawaida kuwa kinawahusu Yoyaribu na Elnathani, tofauti na kundi lililotangulia linaloitwa viongozi.
- source_word: אֶלְנָתָן
  choice: Elnathani
  rationale: Jina limedumishwa mara zote tatu kama lilivyo katika chanzo; kurudiwa kwake huenda kunaonyesha watu tofauti wenye jina moja.
- source_word: יוֹיָרִיב
  choice: Yoyaribu
  rationale: Huu ni unukuzi unaosomeka kwa kawaida kwa Kiswahili na unaakisi umbo la jina la Kiebrania katika aya hii.
