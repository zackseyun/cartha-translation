  yaml_path: translation/ot/ezra/008/009.yaml
  text: 'From the sons of Joab: Obadiah son of Jehiel[a], and with him 218 males.'
translation:
  language: sw
  text: 'Kutoka kwa wana wa Yoabu: Obadia mwana wa Yehieli, na pamoja naye watu wa kiume 218.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: Kutoka kwa wana wa
  rationale: Muundo huu unaonyesha kundi lililotoka katika ukoo wa Yoabu na kuhifadhi mtindo wa orodha ya nasaba bila kulazimisha maana ya wana wa moja kwa moja.
- source_word: יוֹאָב
  choice: Yoabu
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: עֹבַדְיָה
  choice: Obadia
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida na inayoeleweka katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Hii ndiyo namna ya kawaida ya kuonyesha uhusiano wa kifamilia katika taarifa za nasaba.
- source_word: יְחִיאֵל
  choice: Yehieli
  rationale: Jina la mtu limetoholewa kwa umbo la Kiswahili linalokaribia matamshi ya Kiebrania.
- source_word: וְ/עִמּוֹ
  choice: na pamoja naye
  rationale: Tafsiri hii inahifadhi kiunganishi na wazo la wale walioandamana na kiongozi aliyetajwa.
- source_word: מָאתַיִם וּ/שְׁמֹנָה עָשָׂר
  choice: '218'
  rationale: Namba imetolewa kwa tarakimu ili orodha isomeke kwa urahisi; maana yake ni mia mbili na kumi na nane.
- source_word: הַ/זְּכָרִים
  choice: watu wa kiume
  rationale: Kiebrania kinabainisha jinsia ya kiume bila kusema lazima wote walikuwa watu wazima; ‘watu wa kiume’ ni sahihi zaidi kuliko ‘wanaume’ katika muktadha huu.
