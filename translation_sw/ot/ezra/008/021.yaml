source:
  edition: WLC
  text: וָ/אֶקְרָ֨א שָׁ֥ם צוֹם֙ עַל הַ/נָּהָ֣ר אַהֲוָ֔א לְ/הִתְעַנּ֖וֹת לִ/פְנֵ֣י אֱלֹהֵ֑י/נוּ לְ/בַקֵּ֤שׁ מִמֶּ֨/נּוּ֙ דֶּ֣רֶךְ יְשָׁרָ֔ה לָ֥/נוּ וּ/לְ/טַפֵּ֖/נוּ וּ/לְ/כָל רְכוּשֵֽׁ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/021.yaml
  text: Then I proclaimed a fast there[a], at the Ahava River, that we might humble ourselves before our God, to seek from him a straight path for us, for our little ones[b], and for all our possessions.
translation:
  language: sw
  text: Kisha nikatangaza kufunga pale, kando ya mto Ahava, ili tujinyenyekeze[a] mbele za Mungu wetu, tukimwomba atupe njia iliyonyooka[b] kwa ajili yetu, watoto wetu wadogo, na mali zetu zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tujinyime” au “tujitese.” Usemi wa Kiebrania unahusu kujinyima au kujinyenyekeza, hasa wakati wa kufunga.
    reason: lexical_alternative
  - marker: b
    text: Au, “njia iliyo sawa” au “safari salama.” Kiebrania husema kihalisi “njia iliyonyooka.”
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: Kisha nikatangaza
  rationale: Katika muktadha huu קרא ni kutangaza jambo hadharani. “Kisha” huwasilisha mwendelezo wa simulizi kwa Kiswahili cha kawaida.
- source_word: צוֹם
  choice: mfungo
  rationale: Nomino hii hutaja tendo au kipindi cha kufunga; “mfungo” ni neno la kawaida na linaloeleweka katika muktadha wa kidini.
- source_word: עַל הַנָּהָר אַהֲוָא
  choice: kando ya Mto Ahava
  rationale: עַל inapotumiwa kuhusu mto inaweza kumaanisha kuwa kando au karibu nao. Ahava limehifadhiwa kama jina la mahali.
- source_word: לְהִתְעַנּוֹת
  choice: ili tujinyenyekeze
  rationale: Katika muktadha wa kufunga, hitpaeli ya ענה huonyesha kujinyima au kujishusha mbele za Mungu. “Kujinyenyekeza” huwasilisha maana hiyo bila kudokeza kujidhuru kimwili.
- source_word: לִפְנֵי אֱלֹהֵינוּ
  choice: mbele za Mungu wetu
  rationale: Huu ni usemi wa kawaida unaoonyesha msimamo na uhusiano wa waabudu katika uwepo wa Mungu.
- source_word: לְבַקֵּשׁ מִמֶּנּוּ
  choice: tukimwomba atupe
  rationale: בקש מן inaweza kumaanisha kutafuta au kuomba kitu kutoka kwa mtu. Muundo huu ni wa asili katika Kiswahili na huhifadhi utegemezi wa sala bila kuongeza namna Mungu angejibu.
- source_word: דֶּרֶךְ יְשָׁרָה
  choice: njia iliyonyooka
  rationale: Hii ndiyo picha halisi ya Kiebrania, nayo inaweza kuhusisha mwongozo ulio sawa pamoja na safari njema; haijabanwa kuwa usalama wa kimwili pekee.
- source_word: לָנוּ וּלְטַפֵּנוּ וּלְכָל רְכוּשֵׁנוּ
  choice: kwa ajili yetu, watoto wetu wadogo, na mali zetu zote
  rationale: טף huwatambulisha watoto wadogo au wategemezi walio dhaifu katika kundi, na רְכוּשׁ hutaja mali au vitu walivyokuwa navyo.
theological_decisions:
- issue: Maana ya usemi wa kufunga לְהִתְעַנּוֹת
  choice: ili tujinyenyekeze mbele za Mungu wetu
  alternative: ili tujitese mbele za Mungu wetu; ili tujinyime mbele za Mungu wetu
  rationale: Kiebrania kinaweza kutafsiriwa kwa namna ya karibu zaidi kama “kujitesa,” lakini kwa Kiswahili hilo linaweza kueleweka kuwa kujidhuru. “Kujinyenyekeza” huonyesha msimamo wa kujishusha na kujinyima unaoambatana na kufunga.
- issue: Maana ya דֶּרֶךְ יְשָׁרָה
  choice: njia iliyonyooka
  alternative: njia iliyo sawa; safari salama
  rationale: Muktadha unaweza kuelekeza kwenye safari salama au kwa upana zaidi kwenye mwongozo ulio sawa. Tafsiri imehifadhi picha na upana wa usemi wa Kiebrania badala ya kuufanya umaanishe usalama pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia muundo wa kawaida wa simulizi na sala; picha ya “njia iliyonyooka” imehifadhiwa, huku maana mbadala zikielezwa katika tanbihi.
