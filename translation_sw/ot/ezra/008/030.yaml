revisions:
- from: Basi makuhani na Walawi wakapokea kiasi kilichopimwa kwa uzito cha fedha[a], dhahabu na vyombo, ili kuvileta Yerusalemu, katika nyumba ya Mungu wetu.[b]
  to: Basi makuhani na Walawi wakapokea uzito wa fedha, dhahabu, na vyombo[a], ili kuvileta Yerusalemu, hadi katika nyumba ya Mungu wetu.[b]
  rationale: The revision uses the direct and established biblical Swahili expression “uzito wa ...” for מִשְׁקַל, preserving its possible sense of either weight or an amount measured by weight. It also clarifies that the valuables were to be brought all the way to God’s house in Jerusalem, without replacing the Hebrew’s literal “house” with the interpretive term “hekalu” in the main text.
