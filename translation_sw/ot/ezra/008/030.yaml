base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/030.yaml
  text: So the priests and the Levites received the weighed amount of the silver[a], the gold, and the vessels, to bring them to Jerusalem[b], to the house of our God.
translation:
  language: sw
  text: Basi makuhani na Walawi wakapokea uzito wa fedha, dhahabu, na vyombo[a], ili kuvileta Yerusalemu, hadi katika nyumba ya Mungu wetu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiasi kilichopimwa kwa uzito cha fedha, dhahabu, na vyombo.” Neno la Kiebrania linaweza kumaanisha uzito wenyewe au kiasi kilichopimwa kwa uzito.
    reason: lexical_alternative
  - marker: b
    text: Au, “hekalu la Mungu wetu.” Kiebrania kinasema kihalisi, “nyumba ya Mungu wetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבְּלוּ
  choice: wakapokea
  rationale: Kitenzi קבל katika muktadha huu kinaonyesha kupokea vitu walivyokabidhiwa ili wavitunze na kuvisafirisha; “wakapokea” ni wazi na ya kawaida.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: makuhani na Walawi
  rationale: Hili ni tafsiri ya moja kwa moja ya majina ya makundi hayo mawili, kwa matumizi ya kawaida ya Biblia ya Kiswahili.
- source_word: מִשְׁקַל
  choice: kiasi kilichopimwa kwa uzito
  rationale: Nomino hii inaweza kumaanisha uzito wenyewe au kiasi kilichobainishwa kwa kupimwa uzito. Kauli hii inaeleza kwa Kiswahili cha kawaida kwamba vitu vya thamani vilikuwa vimepimwa, bila kufuta upeo wa maana wa neno la Kiebrania.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: fedha, dhahabu na vyombo
  rationale: “Fedha” na “dhahabu” hutafsiri metali hizo moja kwa moja. Katika mazingira ya nyumba ya Mungu, “vyombo” ni neno la kawaida na lenye hadhi kwa כֵּלִים, ingawa neno la Kiebrania linaweza kujumuisha vifaa au vitu vya aina mbalimbali.
- source_word: לְהָבִיא
  choice: ili kuvileta
  rationale: Muundo wa ל pamoja na kitenzi-jina unaonyesha kusudi. Kiambishi “vi-” kinarejelea vitu vilivyotajwa, na “kuvileta” huhifadhi maana ya causative ya בוא katika safari ya kwenda Yerusalemu.
- source_word: לִירוּשָׁלַם
  choice: Yerusalemu
  rationale: Jina la mahali limetolewa kwa umbo lake la kawaida katika Kiswahili; mwelekeo unaeleweka kupitia kitenzi “kuvileta.”
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: katika nyumba ya Mungu wetu
  rationale: Huhifadhi taswira halisi ya Kiebrania, “nyumba ya Mungu wetu.” Katika muktadha huu nyumba hiyo ni hekalu, lakini tafsiri kuu haibadili taswira kuwa istilahi ya kufasiri.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa urahisi. “Basi” na mfuatano wa vitenzi huhifadhi mwendelezo wa simulizi; “nyumba ya Mungu wetu” huhifadhi usemi halisi wa Kiebrania huku tanbihi ikieleza maana ya kimuktadha.
