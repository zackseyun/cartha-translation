base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/036.yaml
  text: And they delivered the king’s decrees to the king’s satraps and the governors Beyond the River[c][b][a], and they supported the people and the house of God.
translation:
  language: sw
  text: Nao wakawasilisha amri za mfalme kwa maliwali wa mfalme na kwa magavana wa Ng’ambo ya Mto[b]; nao wakatoa msaada kwa watu na kwa nyumba ya Mungu[a][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakawaunga mkono”; kitenzi cha Kiebrania maana yake halisi ni “kuinua” au “kubeba,” na hapa kinamaanisha kutoa msaada.
    reason: lexical_alternative
  - marker: b
    text: “Ng’ambo ya Mto” lilikuwa jina la kiutawala la Uajemi kwa eneo lililokuwa magharibi mwa Mto Eufrate.
    reason: cultural_note
  - marker: c
    text: Au “hekalu la Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: wakawasilisha
  rationale: Kitenzi נתן kimsingi ni ‘kutoa,’ lakini hapa kinahusu kuzikabidhi rasmi nyaraka za kifalme kwa maafisa; ‘kuwasilisha’ ni cha asili na hudumisha muktadha wa kiutawala.
- source_word: דָּתֵי הַמֶּלֶךְ
  choice: amri za mfalme
  rationale: Katika mazingira ya Uajemi, דָּת humaanisha maagizo rasmi yenye mamlaka. ‘Amri’ ni wazi kwa msomaji wa kawaida bila kudokeza mkusanyo mzima wa sheria.
- source_word: אֲחַשְׁדַּרְפְּנֵי
  choice: maliwali
  rationale: Neno hili humaanisha watawala wakuu wa majimbo katika utawala wa Uajemi. ‘Maliwali’ ni istilahi ya Kiswahili inayotambulika kwa watawala wa ngazi hiyo.
- source_word: פַחֲוֹת
  choice: watawala
  rationale: פַּחַת humaanisha magavana au wasimamizi wa maeneo. ‘Watawala’ hutofautisha maafisa hawa na maliwali huku ikibaki wazi na ya kawaida.
- source_word: עֵבֶר הַנָּהָר
  choice: Ng’ambo ya Mto
  rationale: Hili ni jina la kiutawala la Uajemi kwa eneo lililokuwa magharibi mwa Mto Eufrate; herufi kubwa zinaonyesha matumizi yake kama jina rasmi la eneo.
- source_word: וְנִשְּׂאוּ
  choice: wakawasaidia
  rationale: נשא maana yake ya msingi ni ‘kuinua’ au ‘kubeba,’ lakini hapa inaonyesha kutoa msaada kwa watu na nyumba ya Mungu. ‘Wakawasaidia’ ni Kiswahili cha asili na hakibainishi aina ya msaada isiyotajwa.
- source_word: הָעָם
  choice: watu
  rationale: Kiebrania kinasema tu ‘watu’; tafsiri haiongezi utambulisho mwembamba zaidi.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Hii ndiyo maana ya moja kwa moja ya kifungu, na ni jina linaloeleweka la hekalu huku likihifadhi usemi wa Kiebrania.
