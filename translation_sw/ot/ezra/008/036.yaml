  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi wenye ‘Nao ... nao ...’ unahifadhi mtiririko wa Kiebrania bila kuwa mzito; istilahi za kiutawala zimewekwa wazi kwa wasomaji wa kawaida.
