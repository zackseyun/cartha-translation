base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/004.yaml
  text: 'From the sons of Pahath-moab: Eliehoenai son of Zerahiah[a], and with him two hundred males.'
translation:
  language: sw
  text: 'Kutoka kwa wana wa Pahath-Moabu: Eliehoenai mwana wa Zerahia, na pamoja naye wanaume mia mbili.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: Kutoka kwa wana wa
  rationale: Inahifadhi kihusishi ‘kutoka kwa’ na usemi wa ukoo ‘wana wa,’ unaofaa katika orodha hii ya kifamilia.
- source_word: פַּחַת מוֹאָב
  choice: Pahath-Moabu
  rationale: Ni jina maalumu la ukoo, hivyo limetoholewa badala ya kutafsiriwa; ‘Moabu’ linafuata umbo la kawaida la Kiswahili la jina Moab.
- source_word: אֶלְיְהוֹעֵינַי
  choice: Eliehoenai
  rationale: Jina la mtu limetoholewa kwa namna inayokaribia matamshi ya Kiebrania na inayotambulika katika mapokeo ya majina ya Biblia.
- source_word: בֶּן זְרַחְיָה
  choice: mwana wa Zerahia
  rationale: Inawakilisha moja kwa moja uhusiano wa mwana na baba ulio wazi katika Kiebrania.
- source_word: וְ/עִמּוֹ
  choice: na pamoja naye
  rationale: Inahifadhi kiunganishi na inaonyesha wazi kwamba idadi inayofuata iliandamana na kiongozi aliyetajwa.
- source_word: מָאתַיִם
  choice: mia mbili
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya namba hiyo katika Kiswahili.
- source_word: הַזְּכָרִים
  choice: wanaume
  rationale: Katika muktadha wa orodha ya watu, ‘wanaume’ ni Kiswahili cha kawaida na chenye heshima kinachohifadhi rejeleo mahususi kwa watu wa jinsia ya kiume bila ukakasi wa ‘madume.’
theological_decisions: []
