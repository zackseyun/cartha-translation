base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/012.yaml
  text: 'And from the sons of Azgad: Johanan son of Hakkatan[b][a], and with him 110 males.'
translation:
  language: sw
  text: 'Na kutoka kwa wazao wa Azgadi[a]: Yohanani mwana wa Hakatani[b], na pamoja naye wanaume 110.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “wana wa Azgadi”; usemi huo unaweza kumaanisha wazao wa ukoo, si wana wa moja kwa moja tu.
    reason: lexical_alternative
  - marker: b
    text: Au “mwana wa yule mdogo,” ikiwa הַקָּטָן linaeleweka kama maelezo badala ya jina Hakatani.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Na kutoka kwa wazao wa
  rationale: Katika orodha hii, בְּנֵי inaonyesha ukoo au kundi la kifamilia, si lazima wana wa moja kwa moja. “Wazao” ni ya asili na sahihi katika Kiswahili.
- source_word: עַזְגָּד
  choice: Azgadi
  rationale: Jina la mtu au ukoo limetoholewa kwa tahajia inayoeleweka katika Kiswahili.
- source_word: יוֹחָנָן
  choice: Yohanani
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa umbo linalofaa Kiswahili.
- source_word: בֶּן הַ/קָּטָן
  choice: mwana wa Hakatani
  rationale: Katika orodha hii kirai kinafanya kazi kama jina la baba; hata hivyo, uwezekano wa kusoma קָטָן kama sifa umehifadhiwa katika tanbihi.
- source_word: וְ/עִמּוֹ
  choice: na pamoja naye
  rationale: Huhifadhi kiunganishi na fomula ya orodha inayomtaja kiongozi pamoja na walioandamana naye.
- source_word: מֵאָה וַ/עֲשָׂרָה
  choice: '110'
  rationale: Namba ya kisasa inawasilisha kwa uwazi maana ya ‘mia moja na kumi’ bila kupoteza taarifa.
- source_word: הַ/זְּכָרִים
  choice: wanaume
  rationale: Neno la Kiebrania linabainisha jinsia ya kiume. “Wanaume” ni usemi wa kawaida wa Kiswahili katika orodha ya watu, ingawa unaweza kueleweka kuwa watu wazima.
