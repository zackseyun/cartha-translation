  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. Taswira ya ‘mikononi mwao’ imehifadhiwa, huku usemi uliofupishwa kuhusu vyombo vya fedha ukitolewa kwa uwazi wa kiasi bila kuufanya kuwa idadi ya vyombo.
