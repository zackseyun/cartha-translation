  yaml_path: translation/ot/ezra/008/026.yaml
  text: And I weighed out into their hands six hundred and fifty talents of silver[a], and one hundred talents worth of silver vessels, and one hundred talents of gold.
translation:
  language: sw
  text: Nami nikawapimia na kuwatia mikononi mwao talanta mia sita na hamsini za fedha, vyombo vya fedha vya thamani ya talanta mia moja[a], na talanta mia moja za dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hapa kimefupishwa; yaelekea maana yake ni kwamba vyombo vya fedha kwa jumla vilihusishwa na talanta mia moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֲלָה
  choice: nikawapimia
  rationale: Kitenzi שׁקל hapa kinamaanisha kupima vitu vya thamani kwa uzito wakati wa kuvikabidhi. ‘Nikawapimia’ huwasilisha tendo la kupima na mwelekeo wa kukabidhi kwao.
- source_word: עַל יָדָם
  choice: mikononi mwao
  rationale: Hifadhi taswira halisi ya Kiebrania ya kuweka vitu mikononi mwa watu, yaani kuwakabidhi wavihifadhi.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Muktadha unahusu madini ya thamani yanayopimwa kwa uzito, si sarafu au pesa kwa ujumla.
- source_word: כִּכָּרִים
  choice: talanta
  rationale: Talanta ni kipimo kikubwa cha uzito kinachotumiwa katika orodha hii ya hazina; istilahi hii ya kibiblia imezoeleka katika Kiswahili.
- source_word: וּכְלֵי כֶסֶף
  choice: vyombo vya fedha
  rationale: כְּלִי linaweza kumaanisha vyombo, vifaa, au vitu; ‘vyombo’ linafaa kwa orodha ya hazina ya hekalu na lina hadhi ya lugha inayofaa.
- source_word: מֵאָה לְכִכָּרִים
  choice: vya thamani ya talanta mia moja
  rationale: Usemi wa Kiebrania umefupishwa. Herufi ל inaelekea kuonyesha kiasi au thamani ya jumla ya vyombo; tafsiri hii huleta maana hiyo kwa Kiswahili cha kawaida bila kudai idadi ya vyombo.
- source_word: זָהָב מֵאָה כִכָּר
  choice: talanta mia moja za dhahabu
  rationale: Hii ni idadi na kipimo cha uzito vinavyoeleza kiasi cha dhahabu.
