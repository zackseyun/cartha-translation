  naturalness: Kiswahili ni sanifu na cha asili kwa ujumla. “Penye mto” huwasilisha kwa uwazi zaidi mahali pa kukusanyikia/kupigia kambi kuliko “kwenye mto,” ambayo inaweza kusikika kana kwamba wako ndani ya mto. Kuongeza “miongoni mwa” pia hufanya sentensi ya mwisho itiririke kwa kawaida.
  terminology: “Makuhani,” “wazao wa Lawi,” na tanbihi ya “wana wa Lawi” ni sahihi. “Ahava” na “Lawi” zimeandikwa kwa uthabiti. Tanbihi ya mto/mfereji inadumisha uwezekano wa kileksika wa נָהָר katika muktadha huu.
