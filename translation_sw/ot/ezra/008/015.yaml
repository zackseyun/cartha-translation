base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/015.yaml
  text: I gathered them to the river that comes to Ahava[a], and we camped there three days. Then I examined the people and the priests[b], but I found none of the sons of Levi there.
translation:
  language: sw
  text: Niliwakusanya penye mto unaoelekea Ahava[a], tukapiga kambi huko kwa siku tatu. Kisha nikawachunguza watu na makuhani, lakini sikumpata huko hata mmoja miongoni mwa wazao wa Lawi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfereji unaoelekea Ahava.” Neno la Kiebrania katika mazingira haya linaweza kumaanisha mto au mfereji uliotengenezwa na watu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana wa Lawi,” yaani Walawi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְבְּצֵם
  choice: Niliwakusanya
  rationale: Kitenzi קבץ humaanisha kukusanya au kuwakutanisha watu; “niliwakusanya” ni cha kawaida na kinaonyesha jukumu hai la Ezra.
- source_word: הַנָּהָר הַבָּא אֶל אַהֲוָא
  choice: mto unaoelekea Ahava
  rationale: נָהָר kwa kawaida ni “mto,” ingawa katika mazingira haya inaweza kuwa mfereji; הַבָּא אֶל inaeleza mkondo au njia inayoelekea Ahava.
- source_word: וַנַּחֲנֶה
  choice: tukapiga kambi
  rationale: חנה humaanisha kupiga kambi; usemi huu ni wa asili na wazi katika Kiswahili cha sasa.
- source_word: יָמִים שְׁלֹשָׁה
  choice: kwa siku tatu
  rationale: Ni uwasilishaji wa kawaida wa muda huo katika Kiswahili.
- source_word: וָאָבִינָה
  choice: nikawachunguza
  rationale: Katika muktadha huu בין ina wazo la kuangalia kwa makini ili kutambua muundo wa kundi, si kuelewa kiakili tu.
- source_word: בָעָם וּבַכֹּהֲנִים
  choice: watu na makuhani
  rationale: עָם na כֹּהֲנִים zinatofautisha watu kwa jumla na makuhani; tafsiri hii ni ya moja kwa moja.
- source_word: וּמִבְּנֵי לֵוִי
  choice: hata mmoja wa wazao wa Lawi
  rationale: Kiebrania ni “kutoka miongoni mwa wana wa Lawi”; “wazao wa Lawi” huhifadhi maana ya ukoo kwa Kiswahili cha asili.
- source_word: לֹא מָצָאתִי שָׁם
  choice: sikumpata huko hata mmoja
  rationale: Muundo huu unaonyesha kutokuwapo kabisa kwa mtu yeyote wa kundi lililotajwa.
