  yaml_path: translation/ot/ezra/008/008.yaml
  text: 'And from the sons of Shephatiah: Zebadiah son of Michael[a], and with him eighty males.'
translation:
  language: sw
  text: 'Na kutoka kwa wana wa Shefatia[a]: Zebadia mwana wa Mikaeli, na pamoja naye watu wa kiume themanini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania “wana wa” hapa linaweza kumaanisha ukoo mpana, yaani “wazao wa,” wala si lazima wana wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Na kutoka kwa wana wa
  rationale: Muundo huu unahifadhi kihusishi na jina la ukoo la Kiebrania. Katika orodha hii, “wana wa” linaweza kumaanisha watu wa ukoo au wazao, si lazima wana wa moja kwa moja.
- source_word: שְׁפַטְיָה
  choice: Shefatia
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili inayokaribia matamshi ya Kiebrania.
- source_word: זְבַדְיָה
  choice: Zebadia
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בֶּן
  choice: mwana wa
  rationale: Kwa kuwa neno hili linaunganisha majina mawili ya watu moja kwa moja, maana ya kawaida ya uhusiano wa baba na mwana ndiyo inayofaa zaidi.
- source_word: מִיכָאֵל
  choice: Mikaeli
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: וְ/עִמּוֹ
  choice: na pamoja naye
  rationale: Tafsiri hii inadumisha kiunganishi na muundo wa orodha unaomtaja kiongozi kisha walioandamana naye.
- source_word: שְׁמֹנִים
  choice: themanini
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya idadi hiyo.
- source_word: הַזְּכָרִים
  choice: watu wa kiume
  rationale: Kiebrania kinabainisha jinsia ya kiume bila kubainisha umri. “Watu wa kiume” ni sahihi zaidi kuliko “wanaume,” ambalo linaweza kudokeza watu wazima pekee.
