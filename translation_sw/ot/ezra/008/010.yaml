base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/010.yaml
  text: And from the sons of Shelomith[a], the son of Josiphiah, and with him 160 males.
translation:
  language: sw
  text: Na kutoka kwa wana wa Shelomithi[a], mwana wa Yosifia, pamoja naye walikuwa wanaume 160.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazao wa Shelomithi”; Kiebrania kihalisi, “wana wa Shelomithi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Na kutoka kwa wana wa
  rationale: Muundo huu unahifadhi kiunganishi, maana ya sehemu inayoletwa na kihusishi, na usemi halisi wa ukoo ‘wana wa’ unaotumika katika orodha za Ezra.
- source_word: שְׁלוֹמִית
  choice: Shelomithi
  rationale: Jina limetoholewa kwa kufuata umbo la Kiebrania na matamshi yanayoeleweka kwa msomaji wa Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika usemi wa ufafanuzi, neno hili linamtambulisha Shelomithi kuwa mwana wa Yosifia.
- source_word: יוֹסִפְיָה
  choice: Yosifia
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa tahajia ya kawaida ya Kiswahili.
- source_word: וְ/עִמּוֹ
  choice: pamoja naye walikuwa
  rationale: ‘Pamoja naye’ huonyesha walioandamana na kiongozi aliyetajwa; ‘walikuwa’ huifanya sentensi iwe ya kawaida kwa Kiswahili bila kuongeza maudhui mapya.
- source_word: מֵאָה וְשִׁשִּׁים
  choice: '160'
  rationale: Tarakimu zinaonyesha idadi hiyo kwa uwazi katika orodha ya majina na hesabu.
- source_word: הַזְּכָרִים
  choice: wanaume
  rationale: Neno la Kiebrania linabainisha jinsia ya kiume. ‘Wanaume’ ni usemi wa kawaida na wenye hadhi katika Kiswahili, ingawa katika muktadha huu huenda likajumuisha watu wa kiume bila kusisitiza umri.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa orodha ya nasaba ulio wazi na wenye hadhi. Usemi halisi ‘wana wa’ umehifadhiwa katika maandishi, huku maana pana ya ukoo ikionyeshwa katika tanbihi.
