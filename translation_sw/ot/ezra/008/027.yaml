  text: and twenty bowls of gold worth a thousand darics[a], and two vessels of fine gleaming bronze[b], precious as gold.
translation:
  language: sw
  text: na mabakuli ishirini ya dhahabu yenye thamani ya dariki elfu moja[a], na vyombo viwili vya shaba nzuri inayong'aa[b], vyenye thamani kama dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mabakuli ishirini ya dhahabu yenye thamani ya dariki elfu moja.” Kiebrania kinaweza kueleweka kuwa kinatoa jumla ya thamani ya mabakuli hayo.
    reason: lexical_alternative
  - marker: b
    text: Au, “vyombo viwili vya shaba nzuri iliyong'arishwa.” Usemi wa Kiebrania unaoieleza shaba ni adimu, na huenda unamaanisha shaba bora sana yenye mng'ao.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפֹרֵי
  choice: mabakuli
  rationale: Neno hili linataja vyombo vyenye umbo la bakuli; “mabakuli” ni Kiswahili cha kawaida na linafaa katika orodha ya vyombo vya thamani.
- source_word: זָהָב
  choice: dhahabu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa metali inayotajwa.
- source_word: עֶשְׂרִים
  choice: ishirini
  rationale: Idadi imetafsiriwa moja kwa moja.
- source_word: לַאֲדַרְכֹנִים אָלֶף
  choice: yenye thamani ya dariki elfu moja
  rationale: Kiambishi ל kinaeleweka hapa kuwa cha tathmini ya thamani; “dariki” linahifadhi jina la kihistoria la sarafu au kipimo cha uzani cha Uajemi.
- source_word: וּכְלֵי
  choice: na vyombo
  rationale: כלי ni neno pana kwa vitu au vyombo; “vyombo” linafaa kwa orodha ya hazina ya hekalu.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: נחשת linaweza kumaanisha shaba au aloi ya shaba; “shaba” ni neno la Kiswahili linaloeleweka kwa urahisi katika muktadha huu.
- source_word: מֻצְהָב
  choice: inayong'aa
  rationale: Neno hili adimu linaelekea kueleza mwonekano wenye mng'ao au uliong'arishwa, bila kulazimisha maana ya kupakwa dhahabu.
- source_word: טוֹבָה
  choice: nzuri
  rationale: Kivumishi hiki kinaonyesha ubora wa shaba au ustadi wa utengenezaji.
- source_word: שְׁנַיִם
  choice: viwili
  rationale: Idadi imetafsiriwa moja kwa moja na kupatanishwa kisarufi na “vyombo”.
- source_word: חֲמוּדֹת
  choice: vyenye thamani
  rationale: Neno linaonyesha vitu vinavyotamanika au vya bei kubwa; hapa “vyenye thamani” linaunganika kwa kawaida na ulinganisho unaofuata.
- source_word: כַזָּהָב
  choice: kama dhahabu
  rationale: Huhifadhi ulinganisho wa wazi wa Kiebrania.
