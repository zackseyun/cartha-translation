base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/029.yaml
  text: Be watchful and guard them until you weigh them out before the chief priests and the Levites and the heads of the fathers’ houses of Israel in Jerusalem[c][b][a], in the chambers of the house of Yahweh.
translation:
  language: sw
  text: Kuweni macho, na vilindeni[a] mpaka mtakapovipima mbele ya wakuu wa makuhani, Walawi, na viongozi wa koo za Israeli[b] huko Yerusalemu, katika vyumba vya nyumba ya Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kuweni waangalifu sana na vitunzeni.” Amri za Kiebrania zinasisitiza kukesha na kulinda kwa makini vitu walivyokabidhiwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “viongozi wa nyumba za mababu za Israeli”; yaani, viongozi wa koo au jamaa za ukoo.
    reason: cultural_note
  - marker: c
    text: “Nyumba ya Yahweh” hapa ni hekalu.
    reason: clarification
lexical_decisions:
- source_word: שִׁקְדוּ וְשִׁמְרוּ
  choice: Kuweni macho na kuvilinda
  rationale: Amri hizi mbili zinawataka walengwa wawe waangalifu sana na walinde vitu vya thamani walivyokabidhiwa. Kiambishi “-vi-” kimejazwa kutokana na muktadha wa fedha, dhahabu na vyombo katika mstari uliotangulia.
- source_word: עַד תִּשְׁקְלוּ
  choice: mpaka mtakapovipima
  rationale: שׁקל hapa ni kupima uzito wa vitu vya thamani kwa ajili ya kuthibitisha hesabu na makabidhiano.
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: wakuu wa makuhani
  rationale: שָׂרֵי inaonyesha viongozi au wakuu miongoni mwa makuhani, bila kulazimisha maana ya kundi la kiufundi la baadaye.
- source_word: וְהַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hilo la kidini na kikabila.
- source_word: וְשָׂרֵי הָאָבוֹת לְיִשְׂרָאֵל
  choice: na viongozi wa koo za Israeli
  rationale: Usemi wa Kiebrania unawahusu viongozi wa nyumba za mababu, yaani koo au jamaa pana za ukoo. “Viongozi wa koo” ni wazi na wa asili katika Kiswahili cha sasa.
- source_word: הַלִּשְׁכוֹת
  choice: vyumba
  rationale: Neno hili linamaanisha vyumba katika jengo au eneo la hekalu; “maghala” lingekuwa mahususi kupita kiasi.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Tafsiri hii inadumisha picha halisi ya “nyumba” na kulitaja jina la Mungu lililo katika matini ya Kiebrania.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina la agano יְהוָה. “Yahweh” hulionyesha kama jina binafsi bila kulibadili kuwa cheo, huku tanbihi ikifafanua kwamba nyumba hiyo ni hekalu.
- issue: Utambulisho wa “wakuu wa makuhani”
  choice: wakuu wa makuhani
  alternative: viongozi wa makuhani
  rationale: Usemi huu unaonyesha cheo cha uongozi katika mazingira ya Ezra, lakini hautafsiriwi kwa namna inayolazimisha kufanana kabisa na matumizi ya kiufundi ya Agano Jipya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kuweni macho” ni usemi wa sasa na wa kawaida unaobeba wazo la uangalifu wa kukesha; “koo” huepuka tafsiri nzito isiyo ya asili ya “nyumba za mababu” katika mstari mkuu.
