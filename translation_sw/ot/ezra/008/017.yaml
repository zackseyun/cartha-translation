  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: ו/אוצא/ה אוֹתָ/ם֙ עַל אִדּ֣וֹ הָ/רֹ֔אשׁ בְּ/כָסִפְיָ֖א הַ/מָּק֑וֹם וָ/אָשִׂימָ/ה֩ בְּ/פִי/הֶ֨ם דְּבָרִ֜ים לְ֠/דַבֵּר אֶל אִדּ֨וֹ אָחִ֤י/ו ה/נתונים בְּ/כָסִפְיָ֣א הַ/מָּק֔וֹם לְ/הָֽבִיא לָ֥/נוּ מְשָׁרְתִ֖ים לְ/בֵ֥ית אֱלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/017.yaml
  text: And I sent them to Iddo[a], the chief at the place Casiphia, and I put in their mouths words to speak to Iddo and his brothers, the temple servants at the place Casiphia[b], to bring us ministers for the house of our God.
translation:
  language: sw
  text: Nami nikawatuma kwa Ido, mkuu, huko Kasifia, mahali pale. Nikaweka vinywani mwao maneno ya kuwaambia Ido na ndugu zake[a]—Wanethini[b] walioko Kasifia, mahali pale—ili watuletee wahudumu[c] kwa ajili ya nyumba ya Mungu wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania chenye irabu kinaweza pia kusomeka “Ido na ndugu yake.” Hapa tafsiri ya “ndugu zake” hufuata muktadha na rejeo la kundi la Wanethini linalofuata; “ndugu” linaweza pia kumaanisha jamaa au washirika wa kundi lake.
    reason: textual_ambiguity
  - marker: b
    text: “Wanethini” ni jina la kundi maalumu la watumishi waliotengwa kwa huduma ya Hekalu.
    reason: lexical_alternative
  - marker: c
    text: “Wahudumu” hapa ni watu wanaotumikia katika nyumba ya Mungu, si lazima wenye cheo rasmi cha kidini cha nyakati za baadaye.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹוצִיאָה אוֹתָם
  choice: nikawatuma
  rationale: Hifili ya יצא hapa ina maana ya kuwasababisha waende kwa ujumbe; “nikawatuma” ni Kiswahili cha kawaida na sahihi kwa muktadha.
- source_word: אִדּוֹ הָרֹאשׁ
  choice: Ido, mkuu
  rationale: הָרֹאשׁ, kihalisi “kichwa,” hapa ni cheo cha mtu aliyeongoza; “mkuu” huhifadhi maana hiyo kwa lugha ya kawaida.
- source_word: בְּכָסִפְיָא הַמָּקוֹם
  choice: mahali paitwapo Kasifia
  rationale: Huhifadhi neno מָקוֹם, “mahali,” na kwa Kiswahili cha kawaida huonyesha kwamba Kasifia ni jina la mahali.
- source_word: וָאָשִׂימָה בְּפִיהֶם דְּבָרִים
  choice: Nikaweka vinywani mwao maneno
  rationale: Huhifadhi taswira ya Kiebrania ya kuwapa wajumbe maneno mahsusi ya kusema, ingawa ni tamathali isiyo ya kawaida kidogo katika Kiswahili.
- source_word: אֶל אִדּוֹ אָחִיו
  choice: kwa Ido na ndugu zake
  rationale: Muktadha na neno la wingi linalofuata vinaunga mkono kuelewa kundi la jamaa au ndugu wa Ido; tanbihi inadokeza uwezekano wa kusoma umoja.
- source_word: הַנְּתוּנִים
  choice: Wanethini
  rationale: Ni jina la kundi maalumu lililotengwa kwa huduma ya Hekalu. Uhamishaji wa jina huhifadhi tofauti yake na מְשָׁרְתִים, huku tanbihi ikieleza kazi yao.
- source_word: מְשָׁרְתִים
  choice: wahudumu
  rationale: Neno hili humaanisha watu wanaofanya huduma katika nyumba ya Mungu. “Wahudumu” ni tofauti na jina la kundi la Wanethini na halidokezi cheo cha kidini cha nyakati za baadaye.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: kwa ajili ya nyumba ya Mungu wetu
  rationale: Huhifadhi usemi wa Kiebrania “nyumba ya Mungu wetu” na uzito wake wa kiteolojia badala ya kuubadili moja kwa moja kuwa “Hekalu.”
theological_decisions:
- issue: Utambulisho wa הַנְּתוּנִים katika mazingira ya huduma ya Hekalu
  choice: Wanethini, yaani kundi maalumu la watumishi wa Hekalu
  alternative: watumishi wa Hekalu
  rationale: Kutumia jina la kihistoria kunahifadhi kwamba hili lilikuwa kundi linalotambulika katika Ezra–Nehemia na kunazuia kulichanganya na wahudumu wengine wanaotafutwa katika mstari huu.
- issue: Kutofautisha מְשָׁרְתִים na הַנְּתוּנִים
  choice: wahudumu
  alternative: watumishi
  rationale: “Wahudumu” huhifadhi tofauti ya kileksia kati ya kundi la Wanethini na watu wanaoletwa kufanya huduma, bila kuingiza dhana ya cheo rasmi cha kidini cha baadaye.
- issue: Idadi katika אִדּוֹ אָחִיו na uhusiano wake na neno la wingi linalofuata
  choice: Ido na ndugu zake
  alternative: Ido na ndugu yake
  rationale: Ingawa umbo lenye irabu linaweza kueleweka kama umoja, muktadha na kauli ya wingi kuhusu Wanethini vinaunga mkono maana ya kundi. Tanbihi huhifadhi uwezekano mwingine bila kuuficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “nikaweka vinywani mwao maneno” umehifadhiwa kwa makusudi ili kuonyesha taswira ya Kiebrania ya ujumbe waliokabidhiwa; sentensi imegawanywa mara mbili ili isomeke kwa urahisi.
