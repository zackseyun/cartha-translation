source:
  edition: WLC
  text: הַ֠/בָּאִים מֵֽ/הַ/שְּׁבִ֨י בְנֵֽי הַ/גּוֹלָ֜ה הִקְרִ֥יבוּ עֹל֣וֹת לֵ/אלֹהֵ֣י יִשְׂרָאֵ֗ל פָּרִ֨ים שְׁנֵים עָשָׂ֤ר עַל כָּל יִשְׂרָאֵל֙ אֵילִ֣ים תִּשְׁעִ֣ים וְ/שִׁשָּׁ֗ה כְּבָשִׂים֙ שִׁבְעִ֣ים וְ/שִׁבְעָ֔ה צְפִירֵ֥י חַטָּ֖את שְׁנֵ֣ים עָשָׂ֑ר הַ/כֹּ֖ל עוֹלָ֥ה לַ/יהוָֽה־׀־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/035.yaml
  text: 'Those who had come from the captivity[a], the sons of the exile, offered burnt offerings to the God of Israel: twelve bulls for all Israel, ninety-six rams, seventy-seven lambs, and twelve male goats as a sin offering[c][b]. All of it was a burnt offering to Yahweh.'
translation:
  language: sw
  text: 'Wale waliokuja kutoka utekwani, wana wa uhamisho, walimtolea Mungu wa Israeli sadaka za kuteketezwa: mafahali kumi na wawili kwa ajili ya Israeli wote[a], kondoo dume tisini na sita, wanakondoo sabini na saba, na beberu kumi na wawili kwa sadaka ya dhambi. Vyote vilikuwa sadaka ya kuteketezwa kwa Yahwe.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa niaba ya Israeli wote.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema, “Vyote vilikuwa sadaka ya kuteketezwa kwa Yahwe,” ingawa kauli iliyotangulia pia inataja beberu kwa sadaka ya dhambi.
    reason: textual_tension
lexical_decisions:
- source_word: הַבָּאִים מֵהַשְּׁבִי
  choice: Wale waliotoka utekwani
  rationale: Kirai hiki kinatambulisha kundi lililowasili kutoka hali ya kutekwa. Wakati uliopita unafaa muktadha wa simulizi, na “utekwani” huhifadhi maana halisi ya שְׁבִי.
- source_word: בְנֵי הַגּוֹלָה
  choice: yaani watu wa uhamisho
  rationale: Hiki ni kirai cha Kiebrania cha kuwatambulisha watu waliohusishwa na uhamisho. “Watu wa uhamisho” ni cha asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno “wana wa uhamisho,” bila kuongeza wazi wazo la kurejea ambalo halimo katika kirai chenyewe.
- source_word: הִקְרִיבוּ עֹלוֹת
  choice: walimtolea ... sadaka za kuteketezwa
  rationale: Katika muktadha wa ibada, הקריב humaanisha kutoa sadaka, na עֹלָה ni sadaka inayoteketezwa. Kiambishi cha yambwa kwa “Mungu” huleta Kiswahili cha kawaida.
- source_word: פָּרִים שְׁנֵים עָשָׂר עַל כָּל יִשְׂרָאֵל
  choice: mafahali kumi na wawili kwa ajili ya Israeli wote
  rationale: עַל inaweza kuonyesha sadaka iliyotolewa kwa ajili au kwa niaba ya Israeli wote. Matini kuu inatumia usemi mpana wa kawaida, huku tanbihi ikihifadhi maana ya uwakilishi.
- source_word: אֵילִים תִּשְׁעִים וְשִׁשָּׁה
  choice: kondoo dume tisini na sita
  rationale: אֵילִים ni kondoo dume; idadi imetolewa kwa maneno katika mtindo wa kifasihi.
- source_word: כְּבָשִׂים שִׁבְעִים וְשִׁבְעָה
  choice: wanakondoo sabini na saba
  rationale: כְּבָשִׂים kwa kawaida humaanisha wanakondoo katika orodha za dhabihu.
- source_word: צְפִירֵי חַטָּאת
  choice: beberu kumi na wawili kuwa sadaka ya dhambi
  rationale: צְפִירִים ni mbuzi dume, ambao kwa Kiswahili huitwa beberu, na חַטָּאת hapa ni aina ya dhabihu, yaani sadaka ya dhambi.
- source_word: הַכֹּל עוֹלָה לַיהוָה
  choice: Vyote vilikuwa sadaka ya kuteketezwa kwa Yahwe
  rationale: Kauli ya muhtasari ya Kiebrania imehifadhiwa bila kuondoa mvutano unaotokana na kutajwa kwa sadaka ya dhambi mara moja kabla yake. Jina יהוה limetolewa kama “Yahwe.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia jina la agano יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina mahususi badala ya kulibadilisha kuwa cheo.
- issue: Mvutano kati ya beberu wa sadaka ya dhambi na muhtasari kwamba vyote vilikuwa sadaka ya kuteketezwa
  choice: Kuhifadhi kauli ya Kiebrania bila kuisawazisha
  alternative: Kufanya “vyote” virejelee wanyama wa sadaka za kuteketezwa pekee
  rationale: Kiebrania kinataja sadaka ya dhambi kisha kinasema kwamba vyote vilikuwa sadaka ya kuteketezwa kwa Yahwe. Tafsiri haiamui kimya kimya upeo wa “vyote,” bali inahifadhi mvutano huo na kuueleza katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Istilahi za dhabihu zimetolewa kwa lugha ya kawaida ya Biblia: “sadaka za kuteketezwa” na “sadaka ya dhambi.”'
