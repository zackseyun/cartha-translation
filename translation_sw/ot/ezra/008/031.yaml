base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/031.yaml
  text: Then we set out from the river Ahava on the twelfth day of the first month to go to Jerusalem[a], and the hand of our God was upon us, and he delivered us from the hand of the enemy and the ambushes along the way.
translation:
  language: sw
  text: Kisha tuliondoka kutoka Mto Ahava siku ya kumi na mbili ya mwezi wa kwanza, ili kwenda Yerusalemu. Mkono wa Mungu wetu ulikuwa juu yetu, naye akatuokoa kutoka mkononi mwa adui na kutoka kwa mtu aliyevizia njiani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka katika hatari ya kuviziwa.” Neno la Kiebrania linaweza kumaanisha mtu anayevizia au, kwa maana ya kimuktadha, hatari ya kuviziwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּסְעָה
  choice: Kisha tuliondoka
  rationale: Katika muktadha wa safari, נסע humaanisha kuvunja kambi na kuanza safari. “Tuliondoka” ni Kiswahili cha kawaida na “Kisha” hudumisha mfuatano wa simulizi.
- source_word: מִנְּהַר אֲהֲוָא
  choice: kutoka mto Ahava
  rationale: נָהָר ni “mto,” na Ahava ni jina la mahali lililohamishiwa kwa herufi za Kiswahili.
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: siku ya kumi na mbili ya mwezi wa kwanza
  rationale: Neno “siku” linaeleweka katika Kiebrania na limetajwa wazi kwa ajili ya Kiswahili cha kawaida.
- source_word: לָלֶכֶת יְרוּשָׁלִָם
  choice: ili kwenda Yerusalemu
  rationale: Infinitivu ya הלך inaonyesha kusudi; “ili kwenda” hulionyesha wazi na kwa kawaida.
- source_word: וְיַד אֱלֹהֵינוּ הָיְתָה עָלֵינוּ
  choice: Mkono wa Mungu wetu ulikuwa juu yetu
  rationale: Taswira halisi ya mkono imehifadhiwa kwa sababu ni nahau muhimu inayojirudia katika Ezra-Nehemia, ikionyesha fadhili na ulinzi wa Mungu.
- source_word: וַיַּצִּילֵנוּ
  choice: naye akatuokoa
  rationale: נצל humaanisha kuokoa au kukomboa kutoka hatarini. “Akatuokoa” ni ya asili na inaeleweka kwa urahisi.
- source_word: מִכַּף אוֹיֵב
  choice: kutoka mkononi mwa adui
  rationale: כַּף ni kiganja au mkono, na hapa ni nahau ya mamlaka au nguvu. “Mkononi mwa” huhifadhi taswira na ulinganifu na mkono wa Mungu.
- source_word: וְאוֹרֵב
  choice: na kutoka kwa mtu aliyevizia
  rationale: אוֹרֵב ni umbo la kishiriki linaloweza kumaanisha mtu anayevizia. Uamuzi huu huhifadhi marejeo ya moja kwa moja kwa mhusika bila kuyageuza kuwa dhana ya “uvamizi wa kuvizia”; uwezekano huo umeelezwa katika tanbihi.
- source_word: עַל הַדָּרֶךְ
  choice: njiani
  rationale: Maana yake ni “barabarani/katika njia.” “Njiani” ni fupi, ya kawaida, na inafaa simulizi la safari.
theological_decisions:
- issue: Nahau ya kibinadamu kuhusu ulinzi wa Mungu
  choice: Kuhifadhi usemi “Mkono wa Mungu wetu ulikuwa juu yetu” katika matini kuu
  alternative: Mungu wetu alitulinda
  rationale: Kiebrania kinatumia wazi taswira ya mkono wa Mungu, jambo linalojirudia katika Ezra-Nehemia kuonyesha fadhili na ulinzi wake. Kuihifadhi hudumisha mshikamano wa kifasihi na mvutano wa kitheolojia bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa baada ya “Yerusalemu” ili isomeke kwa urahisi bila kupoteza mfuatano wa Kiebrania. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
