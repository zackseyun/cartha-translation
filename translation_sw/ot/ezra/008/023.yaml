base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/023.yaml
  text: So we fasted and sought our God concerning this[a], and he answered our plea.
translation:
  language: sw
  text: Basi tulifunga na kumwomba Mungu wetu kuhusu jambo hili, naye akatusikia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri rasmi zaidi, “naye akakubali ombi letu,” au “naye akaitikia sala yetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנָּצוּמָה
  choice: tulifunga
  rationale: Kitenzi צום kinamaanisha kufunga; umbo la nafsi ya kwanza wingi linaripoti tendo la kundi moja kwa moja, bila kuongeza wazo la kutangaza mfungo.
- source_word: וַנְּבַקְשָׁה מֵאֱלֹהֵינוּ
  choice: tukamwomba Mungu wetu
  rationale: בקשׁ pamoja na מן hapa ina maana ya kuomba au kutafuta jambo kutoka kwa Mungu. Katika muktadha wa kufunga na sala, “kumwomba Mungu wetu” ni Kiswahili cha kawaida na huonyesha wazi anayeelekezewa ombi.
- source_word: עַל זֹאת
  choice: kuhusu jambo hili
  rationale: Kirai hiki kinarejelea jambo lililotangulia; tafsiri hii huhifadhi uhusiano huo kwa uwazi bila kulifafanua zaidi kuliko matini.
- source_word: וַיֵּעָתֵר לָנוּ
  choice: naye akatusikia
  rationale: Nifali ya עתר pamoja na לָנוּ huonyesha kwamba Mungu alikubali kusikiliza ombi lao na kulijibu kwa fadhili. “Akatusikia” ni usemi wa kawaida wa kibiblia katika Kiswahili, huku tanbihi ikihifadhi mbadala rasmi zaidi.
theological_decisions:
- issue: Jinsi ya kutafsiri mwitikio wa Mungu katika וַיֵּעָתֵר לָנוּ
  choice: naye akatusikia
  alternative: naye akakubali ombi letu; au, naye akaitikia sala yetu
  rationale: Matini inaonyesha mwitikio mzuri wa Mungu kwa dua yao, lakini haisemi kwa undani namna jibu hilo lilivyotolewa. “Akatusikia” huhifadhi maana hiyo bila kuongeza madai mengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi; “kuhusu jambo hili” huhifadhi rejeo la muktadha, na “akatusikia” linaeleweka kama kusikia kwa kuitikia ombi.
