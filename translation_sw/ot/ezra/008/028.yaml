  yaml_path: translation/ot/ezra/008/028.yaml
  text: And I said to them, “You are holy to Yahweh, and the vessels are holy; and the silver and the gold are a freewill offering to Yahweh, the God of your fathers.”
translation:
  language: sw
  text: Nikawaambia, “Ninyi ni watakatifu kwa Yahwe, na vyombo ni vitakatifu; nayo fedha na dhahabu ni sadaka ya hiari kwa Yahwe, Mungu wa baba zenu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Nikawaambia
  rationale: Wayyiqtol ya אמר inaendeleza mfululizo wa simulizi; umbo hili la Kiswahili linaonyesha kwa kawaida kwamba Ezra alisema maneno yaliyofuata kwa kundi hilo.
- source_word: אַתֶּם קֹדֶשׁ לַיהוָה
  choice: Ninyi ni watakatifu kwa Yahwe
  rationale: Kiwakilishi cha wazi “Ninyi” kinabeba msisitizo wa אַתֶּם, na “watakatifu kwa Yahwe” kinahifadhi maana ya kuwa wamewekwa wakfu na kuwa mali yake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti YHWH limetoholewa kwa namna ya kawaida katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: הַכֵּלִים
  choice: vyombo hivi
  rationale: Katika muktadha wa hekalu, כֵּלִים ni vyombo au vifaa vya ibada. “Vyombo” ni neno la kawaida na lenye heshima; “hivi” huvitambulisha vile vilivyokuwa vimekabidhiwa katika muktadha.
- source_word: קֹדֶשׁ
  choice: vitakatifu
  rationale: Linarudia mzizi na wazo la utakatifu katika kishazi cha kwanza, huku upatanisho wa kisarufi wa Kiswahili ukifuata “vyombo.”
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: fedha na dhahabu
  rationale: Hutaja metali hizo mbili kwa uwazi na kwa mtiririko wa kawaida wa Kiswahili; uainishaji wa Kiebrania hauhitaji kurudiwa kwa viashiria vya Kiswahili.
- source_word: נְדָבָה
  choice: sadaka ya hiari
  rationale: Hueleza sadaka iliyotolewa kwa utashi, si kwa kulazimishwa, na ni istilahi inayoeleweka katika Kiswahili cha ibada.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Mungu wa baba zenu
  rationale: Huhifadhi muundo wa agano na wingi wa kiume wa אֲבֹתֵיכֶם bila kuubadili kimya kuwa usemi usioainisha jinsia.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi kwa tahajia ya Kiswahili, badala ya kulibadilisha kuwa cheo.
- issue: Maana ya קֹדֶשׁ לַיהוָה kuhusu watu
  choice: watakatifu kwa Yahwe
  alternative: mmewekwa wakfu kwa Yahwe
  rationale: “Watakatifu” huhifadhi msamiati wa utakatifu na mlingano na vyombo, huku “kwa Yahwe” ikiacha wazi pamoja maana za kuwekwa wakfu kwake na kuwa mali yake.
- issue: Usemi wa agano אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Mungu wa baba zenu
  alternative: Mungu wa mababu zenu
  rationale: “Baba zenu” hufuata kwa karibu neno la kiume la chanzo na kudumisha usemi wa jadi wa uhusiano wa agano, ingawa “mababu” lingekuwa pana zaidi katika Kiswahili.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unalenga usawa bora: unasomeka kwa kawaida huku ukihifadhi urudiaji wa “watakatifu/vitakatifu,” jina Yahwe, na lugha ya agano.'
