translation:
  language: sw
  text: 'Na kutoka kwa wana wa Adini: Ebedi mwana wa Yonathani, na pamoja naye wanaume hamsini.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema hasa “wa kiume,” kikidumisha ubainifu wa jinsia katika orodha hii.
    reason: lexical_note
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Na kutoka kwa wana wa
  rationale: Muundo huu unaakisi kiunganishi, kihusishi, na neno la ukoo katika Kiebrania. “Wana wa” linafaa katika orodha ya ukoo, ingawa kwa maana pana linahusu wazao.
- source_word: עָדִין
  choice: Adini
  rationale: Jina la mtu limeandikwa kwa namna inayotamkika kwa kawaida katika Kiswahili.
- source_word: עֶבֶד
  choice: Ebedi
  rationale: Hapa neno hili ni jina la mtu, si nomino yenye maana ya “mtumishi” au “mtumwa”; kwa hiyo limetoholewa kama jina.
- source_word: בֶּן
  choice: mwana wa
  rationale: Hiki ndicho kiashiria cha kawaida cha uhusiano wa baba na mwana katika orodha ya ukoo.
- source_word: יוֹנָתָן
  choice: Yonathani
  rationale: Jina limetoholewa kwa mfumo unaoeleweka na kutamkika kwa urahisi katika Kiswahili.
- source_word: וְ/עִמּוֹ
  choice: na pamoja naye
  rationale: Tafsiri hii inadumisha kiunganishi cha Kiebrania na inaonyesha kwamba watu waliotajwa waliandamana na Ebedi.
- source_word: חֲמִשִּׁים
  choice: hamsini
  rationale: Ni tafsiri ya moja kwa moja ya idadi iliyotajwa.
- source_word: הַזְּכָרִים
  choice: watu wa kiume
  rationale: Kiebrania kinataja jinsia ya kiume waziwazi. “Watu wa kiume” huhifadhi umahususi huo bila kudokeza kwa lazima umri wa utu uzima kama neno “wanaume” linavyoweza kufanya.
