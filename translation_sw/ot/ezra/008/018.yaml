base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/018.yaml
  text: And by the good hand of our God upon us[a], they brought to us a man of insight from the sons of Mahli son of Levi, son of Israel—namely Sherebiah, and his sons and his brothers, eighteen.
translation:
  language: sw
  text: Nao, kwa mkono mwema wa Mungu wetu uliokuwa juu yetu[a], wakatuletea mtu mwenye ufahamu kutoka miongoni mwa wazao wa Mahli, mwana wa Lawi, mwana wa Israeli, yaani Sherebia, wanawe, na ndugu zake, kumi na wanane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuwa mkono mwema wa Mungu wetu ulikuwa juu yetu.” Nahau hii ya Kiebrania inaeleza utendaji wa Mungu wenye kibali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: wakatuletea
  rationale: Hifili ya בוא hapa ina maana ya ‘kuleta’; umbo hili linaendeleza simulizi na linaonyesha wazi kwamba walimleta kwa kundi la Ezra.
- source_word: כְּיַד אֱלֹהֵינוּ הַטּוֹבָה עָלֵינוּ
  choice: kwa mkono mwema wa Mungu wetu uliokuwa juu yetu
  rationale: Hifadhi taswira ya Kiebrania ya ‘mkono’ kama ishara ya utendaji na kibali cha Mungu, huku sentensi ikibaki ya kawaida na kueleweka kwa Kiswahili.
- source_word: אִישׁ שֶׂכֶל
  choice: mtu mwenye ufahamu
  rationale: שׂכל hudokeza uelewa, utambuzi na busara; ‘mwenye ufahamu’ ni ya sasa na haipunguzi maana kuwa ustadi wa kiufundi pekee.
- source_word: מִבְּנֵי מַחְלִי
  choice: kutoka miongoni mwa wazao wa Mali
  rationale: בני katika taarifa ya ukoo humaanisha wazao, si lazima wana wa moja kwa moja; ‘miongoni mwa’ pia huwasilisha מן kwa kawaida.
- source_word: בֶּן לֵוִי בֶּן יִשְׂרָאֵל
  choice: mwana wa Lawi, mwana wa Israeli
  rationale: Muundo uliorudiwa wa ukoo umehifadhiwa kwa karibu ili kuonyesha nasaba kama ilivyo katika chanzo.
- source_word: וְשֵׁרֵבְיָה
  choice: yaani Sherebia
  rationale: Kiunganishi hapa kinamtambulisha kwa jina mtu mwenye ufahamu aliyetajwa; ‘yaani’ huonyesha uhusiano huo wa ufafanuzi kwa Kiswahili.
- source_word: וּבָנָיו וְאֶחָיו
  choice: pamoja na wanawe na ndugu zake
  rationale: Tafsiri hii ya kawaida huhifadhi mahusiano yote mawili ya kifamilia na kuonyesha kwamba waliandamana na Sherebia.
- source_word: שְׁמֹנָה עָשָׂר
  choice: jumla yao walikuwa kumi na wanane
  rationale: Kiebrania hutaja idadi bila kurudia nomino. Kiswahili huhitaji upatanisho wa ngeli; ‘jumla yao’ huifanya idadi hiyo iwe wazi bila kubadili wanaohesabiwa.
theological_decisions:
- issue: Tafsiri ya nahau inayohusu mkono wa Mungu
  choice: kwa mkono mwema wa Mungu wetu uliokuwa juu yetu
  alternative: kwa kuwa mkono mwema wa Mungu wetu ulikuwa juu yetu
  rationale: Chaguo kuu linahifadhi sitiari ya Kiebrania na kuhusisha kuletwa kwa watu hao na utendaji wenye kibali wa Mungu, bila kufafanua zaidi namna ya majaliwa yake.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Mali, Lawi, Israeli na Sherebia. Sentensi inahifadhi sitiari ya ‘mkono wa Mungu’ huku ikitumia ‘wazao’ kwa maana ya kiukoo ya בני.'
