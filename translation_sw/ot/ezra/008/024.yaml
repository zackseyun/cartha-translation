  yaml_path: translation/ot/ezra/008/024.yaml
  text: 'Then I set apart twelve of the leading priests: Sherebiah[a], Hashabiah[b], and with them ten of their brothers.'
translation:
  language: sw
  text: Kisha nikawatenga watu kumi na wawili kutoka miongoni mwa viongozi wa makuhani:[a] Sherebia, Hashabia, na pamoja nao ndugu zao kumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya moja kwa moja zaidi, “kutoka kwa wakuu wa makuhani.”
    reason: lexical_alternative
  - marker: b
    text: “Ndugu” hapa inaweza pia kumaanisha jamaa zao au wenzao; Kiebrania kinatumia neno la kifamilia la jinsia ya kiume.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַבְדִּילָה
  choice: Kisha nikawatenga
  rationale: Hifili ya בדל ina maana ya kutenga au kuweka kando. “Nikawatenga” ni ya kawaida katika Kiswahili na inadumisha mfuatano wa simulizi unaoonyeshwa na kiunganishi.
- source_word: מִשָּׂרֵי הַכֹּהֲנִים
  choice: kutoka miongoni mwa viongozi wa makuhani
  rationale: שָׂרִים ni wakuu, viongozi, au maafisa; מן hapa inaonyesha kwamba watu hao walitoka katika kundi hilo. “Viongozi wa makuhani” huepuka mkanganyiko ambao “makuhani wakuu” ungeweza kuleta.
- source_word: שְׁנֵים עָשָׂר
  choice: watu kumi na wawili
  rationale: Idadi ni kumi na mbili; neno “watu” limeongezwa kwa ulaini wa Kiswahili na ngeli inayofaa.
- source_word: לְשֵׁרֵבְיָה חֲשַׁבְיָה
  choice: Sherebia, Hashabia
  rationale: Majina ya watu yametoholewa kwa tahajia ya kawaida na inayosomeka katika Kiswahili. Nukta pacha zinaonyesha kwamba majina yanayofuata yanabainisha wale kumi na wawili.
- source_word: וְעִמָּהֶם
  choice: na pamoja nao
  rationale: Muundo wa nyongeza wa Kiebrania umehifadhiwa wazi.
- source_word: מֵאֲחֵיהֶם
  choice: ndugu zao
  rationale: אָח inaweza kumaanisha ndugu wa kiume, jamaa, au mshirika wa kundi. “Ndugu zao” inadumisha neno la kifamilia bila kulazimisha maana finyu.
- source_word: עֲשָׂרָה
  choice: kumi
  rationale: Tafsiri ya moja kwa moja ya idadi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. “Viongozi wa makuhani” limetumiwa badala ya “makuhani wakuu” ili kuepuka kudokeza cheo maalumu cha kuhani mkuu. Muundo wa mstari unaonyesha wazi kwamba Sherebia, Hashabia, na ndugu zao kumi ndio jumla ya watu kumi na wawili.
