base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/020.yaml
  text: And from the temple servants whom David and the officials had assigned to the service of the Levites[a], there were 220 temple servants[b]; all of them were designated by name.
translation:
  language: sw
  text: Tena, miongoni mwa watumishi wa Hekalu[a] ambao Daudi na wakuu waliwaweka kwa ajili ya kazi ya Walawi, walikuwapo watumishi 220 wa Hekalu. Wote walitajwa kwa majina[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Nethinim, jina la kitaalamu la kundi maalumu la watumishi wa Hekalu.'
    reason: lexical_alternative
  - marker: b
    text: Au, “waliorodheshwa kwa majina.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַנְּתִינִים / נְתִינִים
  choice: watumishi wa Hekalu
  rationale: Hili ni jina la kitaalamu la kundi maalumu lililohudumu Hekaluni; tafsiri hii inaeleza kazi yao wazi kuliko kunukuu tu jina Nethinim.
- source_word: שֶׁנָּתַן
  choice: waliwatoa
  rationale: Kitenzi kimsingi ni ‘kutoa’; hapa kinaonyesha kwamba Daudi na viongozi waliwatoa au kuwaweka watu hawa kwa kazi hiyo, bila kuondoa taswira ya asili ya ‘kutolewa.’
- source_word: וְהַשָּׂרִים
  choice: viongozi
  rationale: Neno hili linaonyesha watu wenye mamlaka; ‘viongozi’ ni la kawaida na lenye heshima katika Kiswahili cha sasa bila kulazimisha maana ya kifalme ya ‘wakuu.’
- source_word: לַעֲבֹדַת הַלְוִיִּם
  choice: kwa ajili ya kazi ya Walawi
  rationale: Huhifadhi maana pana ya עֲבֹדָה kama kazi au huduma, bila kuamua kimyakimya ikiwa walikuwa chini ya Walawi au walifanya kazi pamoja nao.
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: '220'
  rationale: Tarakimu ni rahisi kusoma na huhifadhi idadi kamili.
- source_word: כֻּלָּם
  choice: wote
  rationale: Huhifadhi msisitizo kwamba kila mmoja katika kundi hilo alitambuliwa.
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: walitajwa kwa majina
  rationale: Hutoa maana ya kutambuliwa wazi mmoja mmoja kwa majina, huku tanbihi ikihifadhi uwezekano wa maana ya kiutawala ya kuorodheshwa.
