translation:
  language: sw
  text: Vitu vyote vilihesabiwa kwa idadi na kupimwa kwa uzito, na jumla ya uzito ikaandikwa wakati huo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Kwa idadi, kwa uzito, kwa vyote; na uzito wote ukaandikwa wakati huo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפָּר
  choice: kilihesabiwa
  rationale: Nomino מִסְפָּר ina maana ya idadi au hesabu. Katika muktadha wa kukagua vitu vya thamani, kitenzi ‘kilihesabiwa’ kinaeleza utaratibu huo kwa Kiswahili cha kawaida.
- source_word: בְּמִשְׁקָל
  choice: kupimwa kwa uzito
  rationale: מִשְׁקָל humaanisha uzito. Kauli hii inaonyesha kwamba vitu vilikaguliwa kwa kuvipima uzito, sambamba na kuhesabiwa.
- source_word: לַכֹּל
  choice: Kila kitu
  rationale: 'Kirai hiki kinaonyesha ujumla: kuhesabu na kupima kulihusu shehena yote.'
- source_word: וַיִּכָּתֵב
  choice: ikaandikwa
  rationale: Niphal ya כתב ni hali ya kutendwa, ‘iliandikwa.’ Hapa inaashiria kuwekwa kwa taarifa katika kumbukumbu rasmi.
- source_word: כָּל הַמִּשְׁקָל
  choice: jumla ya uzito
  rationale: Kihalisi ni ‘uzito wote’; katika Kiswahili cha kawaida, ‘jumla ya uzito’ huwasilisha kiasi chote kilichowekwa katika kumbukumbu.
- source_word: בָּעֵת הַהִיא
  choice: wakati huo
  rationale: Kirai hiki hutaja wakati wa kukabidhi na kukagua mali, huku kikihifadhi nguvu ya kiashiria ‘huo.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Tafsiri inatumia ulinganifu mwafaka na kuhifadhi maana ya utaratibu wa kuhesabu, kupima na kuandika kumbukumbu.
