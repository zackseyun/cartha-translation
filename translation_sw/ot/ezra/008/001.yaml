  yaml_path: translation/ot/ezra/008/001.yaml
  text: 'These are the heads of their fathers’ houses[a], and their genealogy, of those who went up with me from Babylon in the reign of King Artaxerxes:'
translation:
  language: sw
  text: 'Hawa ndio wakuu wa jamaa zao za upande wa baba na orodha yao ya ukoo[a] wa wale waliopanda pamoja nami kutoka Babeli wakati wa utawala wa Mfalme Artashasta:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nasaba yao” au “kuandikishwa kwao kulingana na ukoo.” Neno la Kiebrania linamaanisha kuandikishwa au kumbukumbu ya ukoo, si asili ya kifamilia kwa maana ya jumla tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hawa ndio
  rationale: Hutambulisha orodha mpya kwa Kiswahili cha kawaida; kiunganishi cha Kiebrania hakihitaji kuongezewa neno la wakati kama “sasa”.
- source_word: רָאשֵׁי אֲבֹתֵיהֶם
  choice: wakuu wa jamaa zao za upande wa baba
  rationale: Neno “wakuu” linadumisha taswira ya רָאשֵׁי, huku “jamaa zao za upande wa baba” likieleza kitengo cha kijamii cha kifamilia kinachokusudiwa na אֲבֹתֵיהֶם bila kukifanya kuwa baba mmoja mmoja.
- source_word: וְהִתְיַחְשָׂם
  choice: na orodha yao ya ukoo[a]
  rationale: Katika muktadha huu neno linahusu kuandikishwa au kumbukumbu iliyopangwa kwa ukoo, si asili ya mtu kwa maana ya jumla tu.
- source_word: הָעֹלִים
  choice: wale waliopanda
  rationale: Linadumisha usemi wa Kiebrania wa “kupanda” kuelekea Yuda au Yerusalemu kutoka nchi ya uhamisho.
- source_word: עִמִּי
  choice: pamoja nami
  rationale: Ni tafsiri ya moja kwa moja ya kihusishi pamoja na kiambishi cha nafsi ya kwanza umoja.
- source_word: בְּמַלְכוּת
  choice: wakati wa utawala wa
  rationale: Hueleza kwa Kiswahili cha kawaida kipindi ambacho mfalme huyo alitawala.
- source_word: אַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: Mfalme Artashasta
  rationale: Jina limetoholewa kwa umbo linalotumika katika Kiswahili cha Biblia, na mpangilio umewekwa kwa namna ya kawaida ya Kiswahili.
- source_word: מִבָּבֶל
  choice: kutoka Babeli
  rationale: Hutaja mahali walikoanzia wale waliopanda pamoja na Ezra.
