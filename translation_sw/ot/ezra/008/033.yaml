base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/033.yaml
  text: And on the fourth day[a], the silver and the gold and the vessels were weighed out in the house of our God into the hand of Meremoth son of Uriah the priest, and with him was Eleazar son of Phinehas, and with them were Jozabad son of Jeshua and Noadiah son of Binnui[b], the Levites.
translation:
  language: sw
  text: Siku ya nne, fedha, dhahabu na vyombo[a] vilipimwa kwa mizani katika nyumba ya Mungu wetu na kukabidhiwa kwa Meremothi mwana wa Uria, kuhani.[b] Pamoja naye alikuwa Eleazari mwana wa Finehasi; pamoja nao walikuwa Yozabadi mwana wa Yeshua na Noadia mwana wa Binui, Walawi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, vyombo au vifaa vya hekalu.
    reason: cultural_note
  - marker: b
    text: Kihalisi, “juu ya mkono wa Meremothi,” yaani chini ya uangalizi wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: Siku ya nne
  rationale: Hutoa kiashirio cha wakati kwa Kiswahili cha kawaida bila kuongeza maelezo yasiyokuwamo katika Kiebrania.
- source_word: נִשְׁקַל
  choice: vilipimwa kwa mizani
  rationale: Kitenzi cha Kiebrania kiko katika kauli ya kutendwa na kinaeleza upimaji wa uzito; kirai hiki ni wazi na cha asili kwa Kiswahili.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: fedha, dhahabu na vyombo
  rationale: Maneno haya yanahifadhi vitu vitatu vya orodha; ‘vyombo’ linafaa kwa vifaa au vitu vya hekalu, ingawa maana yake ni pana.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: katika nyumba ya Mungu wetu
  rationale: Huhifadhi taswira halisi ya Kiebrania ya ‘nyumba ya Mungu wetu’ badala ya kuibadili moja kwa moja kuwa ‘hekalu.’
- source_word: עַל יַד
  choice: kukabidhiwa kwa
  rationale: Nahau hiyo inaonyesha kuwekwa chini ya uangalizi au mamlaka ya mtu. Kiswahili hiki kinawasilisha tendo la kukabidhi mali kwa uwajibikaji.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Cheo hiki kimewekwa baada ya jina la Meremothi, kama maelezo ya utambulisho wake; mpangilio wa Kiebrania unaweza kwa nje kuruhusu kuhusishwa na Uria, hivyo tanbihi inadokeza jambo hilo.
- source_word: הַלְוִיִּם
  choice: ambao walikuwa Walawi
  rationale: Nomino ya wingi ya mwisho inawatambulisha Yozabadi na Noadia kwa pamoja; muundo huu unaweka rejeo hilo wazi kwa Kiswahili.
theological_decisions:
- issue: Mhusika anayeitwa kuhani katika kirai מְרֵמוֹת בֶּן אֽוּרִיָּה הַכֹּהֵן
  choice: Meremothi anatambulishwa kuwa kuhani
  alternative: Uria anatambulishwa kuwa kuhani
  rationale: Katika muktadha wa orodha ya maafisa waliopokea mali, cheo hicho kwa kawaida humwelezea Meremothi, ingawa mpangilio wa maneno unaweza kuonekana kuwa na utata wa kisarufi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yameandikwa kwa maumbo yanayotumika kwa urahisi katika Kiswahili; sentensi imegawanywa kwa alama za uakifishaji ili orodha ndefu ya wahusika ibaki wazi.
