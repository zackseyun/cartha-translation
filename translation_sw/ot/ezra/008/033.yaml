  terminology: “Fedha,” “dhahabu,” “vyombo,” “nyumba ya Mungu wetu,” “kuhani,” na “Walawi” ni istilahi sahihi na za asili. Majina yamehifadhiwa kwa uthabiti wa kifonolojia wa Kiswahili.
