  text: 'And from the sons of Elam: Jeshaiah son of Athaliah[a], and with him seventy males.'
translation:
  language: sw
  text: 'Na miongoni mwa wana wa Elamu: Yeshaya mwana wa Athalia, na wanaume sabini pamoja naye.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Na kutoka kwa wana wa
  rationale: Huhifadhi muundo wa nasaba na orodha wa Kiebrania; hapa “wana” humaanisha washiriki au wazao wa ukoo, si lazima watoto wa moja kwa moja.
- source_word: עֵילָם
  choice: Elamu
  rationale: Jina la ukoo limeandikwa kwa namna ya kawaida katika Kiswahili.
- source_word: יְשַׁעְיָה
  choice: Yeshaya
  rationale: Unukuzi unaotambulika katika Kiswahili wa jina la Kiebrania.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika muundo huu wa kutaja baba, “mwana wa” ni tafsiri ya kawaida na sahihi.
- source_word: עֲתַלְיָה
  choice: Athalia
  rationale: Jina limenukuliwa kwa tahajia ya kawaida ya Kiswahili.
- source_word: וְ/עִמּוֹ
  choice: na pamoja naye
  rationale: Huwasilisha kiunganishi na wazo la kuandamana, huku ikidumisha mfuatano wa orodha.
- source_word: שִׁבְעִים
  choice: sabini
  rationale: Tafsiri ya moja kwa moja ya idadi.
- source_word: הַזְּכָרִים
  choice: wanaume
  rationale: Neno la Kiebrania linabainisha watu wa kiume; “wanaume” ni la asili zaidi katika Kiswahili cha sasa kuliko “waume” au “madume” kwa watu, huku likihifadhi ubainisho huo.
