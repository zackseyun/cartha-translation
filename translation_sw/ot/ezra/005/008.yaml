base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/008.yaml
  text: Let it be known to the king that we went to the province of Judah[a], to the house of the great God. It is being built with great stones, and timber is being laid in the walls[b]. This work is being done diligently and is prospering in their hands.
translation:
  language: sw
  text: Ijulikane kwa mfalme kwamba tulienda katika jimbo la Yuda, kwenye nyumba ya Mungu Mkuu. Nyumba hiyo inajengwa kwa mawe makubwa sana[a], na mbao zinawekwa katika kuta. Kazi hii inafanywa kwa bidii[b] na inafanikiwa mikononi mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mawe makubwa.” Kirai cha Kiaramu huenda kinarejelea kwa ujumla mawe makubwa sana ya ujenzi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa uangalifu,” na huenda “kwa haraka.” Maana mahsusi ya kielezi hiki inajadiliwa, lakini ni wazi kwamba kinaeleza kazi ikiendelea kwa ufanisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא
  choice: Ijulikane
  rationale: Ni fomula rasmi ya Kiaramu ya kutoa taarifa; ‘Ijulikane’ huhifadhi mtindo wa kiutawala kwa Kiswahili cha asili.
- source_word: לְמַלְכָּא
  choice: kwa mfalme
  rationale: Kihusishi kinamtaja mfalme kuwa mpokeaji wa taarifa.
- source_word: אֲזַלְנָא
  choice: tulienda
  rationale: Kitenzi kimsingi humaanisha kwenda, kwa mtazamo wa watoa taarifa.
- source_word: לִיהוּד מְדִינְתָּא
  choice: katika jimbo la Yuda
  rationale: מְדִינְתָּא ni jimbo la kiutawala la milki; ‘Yuda’ ni umbo la kawaida la jina hilo katika Kiswahili.
- source_word: לְבֵית אֱלָהָא רַבָּא
  choice: kwenye nyumba ya Mungu mkuu
  rationale: Hufuata maana halisi ya ‘nyumba ya Mungu mkuu’; katika muktadha ni hekalu, lakini ‘nyumba’ huhifadhi taswira ya chanzo.
- source_word: מִתְבְּנֵא
  choice: Nyumba hiyo inajengwa
  rationale: Kauli tendwa endelevu huhifadhi hali ya ujenzi unaoendelea; kurudia ‘nyumba hiyo’ huondoa utata wa kiwakilishi katika Kiswahili.
- source_word: אֶבֶן גְּלָל
  choice: kwa mawe makubwa sana
  rationale: Kirai kinaelekea kumaanisha mawe makubwa ya ujenzi, ingawa maana yake mahsusi haijathibitika kabisa.
- source_word: וְאָע
  choice: na mbao
  rationale: Nomino humaanisha kuni au mbao; ‘mbao’ inafaa zaidi katika muktadha wa ujenzi.
- source_word: מִתְּשָׂם בְּכֻתְלַיָּא
  choice: zinawekwa katika kuta
  rationale: Huhifadhi kauli tendwa na mahali ambapo mbao zinaingizwa au kuwekwa katika muundo wa kuta.
- source_word: וַעֲבִידְתָּא דָךְ
  choice: Kazi hii
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya nomino pamoja na kiashiria.
- source_word: אָסְפַּרְנָא
  choice: kwa bidii
  rationale: Kielezi hiki kina maana inayojadiliwa; ‘kwa bidii’ huonyesha utekelezaji wenye nguvu na ufanisi bila kuamua kwamba kasi pekee ndiyo inayokusudiwa.
- source_word: מִתְעַבְדָא
  choice: inafanywa
  rationale: Huhifadhi umbo la kauli tendwa linaloeleza kazi inayoendelea.
- source_word: וּמַצְלַח בְּיֶדְהֹם
  choice: na inafanikiwa mikononi mwao
  rationale: Huhifadhi maana ya kufanikiwa pamoja na nahau ya chanzo ‘mikononi mwao,’ bila kuibadili kuwa dai maalumu kuhusu usimamizi.
