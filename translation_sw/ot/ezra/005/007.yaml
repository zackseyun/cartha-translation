base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/007.yaml
  text: 'They sent a report to him[b][a], and this was what was written in it: “To Darius the king: all peace.”'
translation:
  language: sw
  text: 'Walimtumia taarifa[a], na haya ndiyo yaliyoandikwa ndani yake: “Kwa Mfalme Dario: Amani tele.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ujumbe,” “hati,” au “barua rasmi.” Neno la Kiaramu פתגמא linaweza kumaanisha mawasiliano rasmi ya aina mbalimbali.
    reason: lexical_alternative
  - marker: b
    text: “Amani tele” ni salamu rasmi iliyotumiwa katika barua, ikimaanisha amani kamili au hali njema.
    reason: cultural_note
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: taarifa
  rationale: Neno hili la Kiaramu linaweza kumaanisha ujumbe, taarifa, au hati rasmi. Katika muktadha huu wa mawasiliano ya kiutawala kwa mfalme, “taarifa” linafaa na ni la kawaida katika Kiswahili cha sasa.
- source_word: שְׁלַחוּ
  choice: walimpelekea
  rationale: Kitenzi kinaonyesha kuwa waliituma taarifa kwa mtu aliyetajwa kwa kiambishi katika neno linalofuata. “Walimpelekea” linaonyesha tendo la kutuma pamoja na mpokeaji bila kuongeza maelezo yasiyokuwamo.
- source_word: עֲלֹוהִי
  choice: -m- … -kea
  rationale: Katika muundo huu, kihusishi chenye kiambishi cha nafsi kinaeleweka kuwa kinaelekeza ujumbe kwa mpokeaji. Kiswahili huonyesha uhusiano huo kwa kiambishi cha mtendewa katika “walimpelekea.”
- source_word: וְכִדְנָה
  choice: nayo … hivi
  rationale: Kirai hiki kinatanguliza maneno yaliyomo katika hati. “Nayo ilikuwa imeandikwa hivi” ni cha asili katika Kiswahili na kinahifadhi maana ya “na namna hii.”
- source_word: כְּתִיב
  choice: ilikuwa imeandikwa
  rationale: Umbo hili lina maana ya hali tendwa, yaani yaliyokuwamo katika taarifa yalikuwa yameandikwa.
- source_word: בְּגַוֵּהּ
  choice: imeandikwa hivi
  rationale: Maana ya “ndani yake” imewasilishwa kiasili kwa kuifanya taarifa kuwa kiima cha “ilikuwa imeandikwa”; hivyo yaliyofuata yanaeleweka kuwa ndiyo yaliyokuwa ndani yake.
- source_word: לְדָרְיָוֶשׁ
  choice: Kwa … Dario
  rationale: Kihusishi kinamtambulisha anayeandikiwa. “Kwa” ni namna ya kawaida ya kuonyesha mwandikiwa katika kichwa cha barua au hati ya Kiswahili.
- source_word: מַלְכָּא
  choice: Mfalme
  rationale: Nomino hii ni cheo cha Dario. Mpangilio “Mfalme Dario” ni wa asili zaidi katika Kiswahili kuliko kuiga moja kwa moja mpangilio wa Kiaramu.
- source_word: שְׁלָמָא
  choice: amani
  rationale: Neno linamaanisha amani au hali njema na hapa linatumika katika salamu rasmi. “Amani” huhifadhi maana yake ya msingi badala ya kulitafsiri kwa jumla kuwa “salamu.”
- source_word: כֹלָּא
  choice: tele
  rationale: Hapa neno hilo linatilia mkazo ukamilifu au wingi wa amani. “Tele” huwasilisha wazo la amani nyingi au kamili kwa Kiswahili cha asili kuliko “amani yote.”
