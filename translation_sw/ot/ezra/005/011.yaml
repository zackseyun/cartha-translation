base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/011.yaml
  text: 'And this is the answer they returned to us[a], saying: We are the servants of the God of heaven and earth, and we are rebuilding the house that was built many years ago[b], which a great king of Israel built and completed.'
translation:
  language: sw
  text: Nao walitujibu hivi[a], wakisema, “Sisi ni watumishi wa Mungu wa mbingu na dunia, na tunaijenga upya[b] nyumba ambayo ilijengwa miaka mingi iliyopita, na ambayo mfalme mkuu wa Israeli aliijenga na kuikamilisha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na hivi ndivyo ujumbe walioturudishia ulivyokuwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tunaijenga nyumba.” Umbo la kitenzi cha Kiaramu linaweza kuonyesha tendo linaloendelea; neno “upya” linaweka wazi kwamba nyumba hii ilikuwapo hapo awali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְנֵמָא פִתְגָמָא הֲתִיבוּנָא
  choice: Nao walitujibu hivi
  rationale: Kirai hiki kinaanzisha maudhui ya jibu lao. Tafsiri hii ni ya kawaida katika Kiswahili na inawakilisha maana ya kurudisha au kutoa jibu.
- source_word: לְמֵמַר
  choice: wakisema
  rationale: Hiki ni kitenzi-jina cha kunukuu kinachoanzisha maneno ya moja kwa moja; “wakisema” ni muundo wa kawaida wa Kiswahili.
- source_word: עַבְדוֹהִי
  choice: watumishi
  rationale: Katika muktadha huu neno linaonyesha kumtumikia Mungu na kuwa chini ya mamlaka yake, si kusisitiza hali ya utumwa wa mali.
- source_word: אֱלָהּ שְׁמַיָּא וְאַרְעָא
  choice: Mungu wa mbingu na dunia
  rationale: Hili linahifadhi jina la heshima linalosisitiza mamlaka ya Mungu juu ya ulimwengu wote kwa Kiswahili cha kawaida.
- source_word: וּבָנַיִן
  choice: na tunaijenga upya
  rationale: Umbo la kitenzi linaonyesha tendo linaloendelea. “Upya” linaweka wazi kutokana na muktadha kwamba nyumba hii ilikuwapo zamani na sasa inajengwa tena.
- source_word: בַּיְתָא
  choice: nyumba
  rationale: Hii ndiyo maana ya moja kwa moja ya neno la Kiaramu; katika muktadha linarejelea hekalu bila kulazimisha ufafanuzi ndani ya matini.
- source_word: דִּי הֲוָא בְנֵה מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן
  choice: iliyokuwa imejengwa miaka mingi iliyopita
  rationale: Tafsiri hii inatoa kwa Kiswahili cha kawaida maana ya nyumba kujengwa miaka mingi kabla ya wakati huo.
- source_word: וּמֶלֶךְ לְיִשְׂרָאֵל רַב
  choice: Mfalme mkuu wa Israeli
  rationale: “Mkuu” linaonyesha ukuu au umashuhuri wa mfalme bila kumtaja kwa jina, kama ilivyo katika chanzo.
- source_word: בְּנָהִי וְשַׁכְלְלֵהּ
  choice: aliyeijenga na kuikamilisha
  rationale: Vitenzi viwili vinatofautisha kujenga na kufikisha jengo kwenye ukamilifu.
theological_decisions:
- issue: Jina la Mungu katika barua ya kiutawala
  choice: Mungu wa mbingu na dunia
  alternative: Mungu wa mbingu na nchi
  rationale: “Dunia” hapa huonyesha kwa uwazi upeo wa mamlaka ya Mungu juu ya uumbaji wote, bila kumfanya aonekane kuwa mungu wa eneo moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetenganishwa kabla ya kumtaja mfalme ili maneno yawe rahisi kueleweka bila kupoteza uhusiano wa mawazo katika chanzo.
