base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/017.yaml
  text: And now[a], if it seems good to the king, let a search be made in the royal treasury there in Babylon, whether it is so that a decree was issued by King Cyrus to rebuild this house of God in Jerusalem[b]; and let the king send to us his pleasure concerning this matter.
translation:
  language: sw
  text: Basi, kama mfalme akiona inafaa, uchunguzi ufanywe katika hazina ya kifalme huko Babeli, ili kujua kama kweli Mfalme Koreshi alitoa amri ya kuijenga upya nyumba hii ya Mungu huko Yerusalemu[a]; na mfalme atutumie uamuzi wake kuhusu jambo hili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuijenga nyumba hii ya Mungu huko Yerusalemu.” Kitenzi cha Kiaramu kinaweza kutafsiriwa tu “kujenga”; “kujenga upya” huonyesha muktadha wa kurejeshwa kwa nyumba hiyo.
    reason: lexical_alternative
  - marker: b
    text: Au, “mapenzi yake” au “ridhaa yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעַן
  choice: Basi sasa
  rationale: Ni kiunganishi cha Kiaramu kinachoanzisha hitimisho au hatua inayofuata ya ombi; “Basi sasa” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: הֵן עַל מַלְכָּא טָב
  choice: kama mfalme akiona inafaa
  rationale: Hii ni lugha ya heshima ya kifalme; tafsiri hii ni ya asili katika Kiswahili na hudumisha unyenyekevu wa ombi.
- source_word: יִתְבַּקַּר
  choice: uchunguzi ufanywe
  rationale: Umbo hili lina maana ya ombi/amri katika hali ya kutendwa; linatoshea utafutaji wa kumbukumbu rasmi.
- source_word: בְּבֵית גִּנְזַיָּא
  choice: katika hazina ya kifalme
  rationale: Kifungu hicho kihalisi ni “nyumba ya hazina”; katika muktadha huu ni mahali pa kuhifadhi mali na nyaraka za kifalme.
- source_word: הֵן אִיתַי דִּי
  choice: ili kujua kama kweli
  rationale: Huonyesha lengo la uchunguzi, yaani kuthibitisha iwapo amri hiyo ilikuwapo kweli.
- source_word: מִן כּוֹרֶשׁ מַלְכָּא שִׂים טְעֵם
  choice: Mfalme Koreshi alitoa amri
  rationale: טְעֵם hapa ni uamuzi au amri rasmi, na שִׂים pamoja nayo humaanisha kuitoa au kuiweka rasmi.
- source_word: לְמִבְנֵא
  choice: kuijenga upya
  rationale: Kitenzi chenyewe kinaweza kumaanisha “kujenga,” lakini muktadha wa kurejesha hekalu lililoharibiwa unafanya “kujenga upya” iwe wazi zaidi; mbadala wa karibu umewekwa katika tanbihi.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: nyumba hii ya Mungu
  rationale: Huhifadhi nomino ya chanzo “nyumba” na kiashiria “hii” bila kubadili kuwa neno la kifafanuzi zaidi “hekalu.”
- source_word: וּרְעוּת מַלְכָּא
  choice: uamuzi wake
  rationale: Katika ombi hili rasmi, neno linaweza kumaanisha mapenzi, ridhaa, au uamuzi wa mfalme; “uamuzi wake” huwasilisha jambo analotakiwa kuwatumia kwa Kiswahili cha asili.
- source_word: עַל דְּנָה
  choice: kuhusu jambo hili
  rationale: Huleta maana ya kiashiria cha Kiaramu kwa mtindo rasmi na wa kawaida wa Kiswahili.
- source_word: יִשְׁלַח עֲלֵינָא
  choice: na atutumie
  rationale: Huhifadhi ombi la heshima la mfalme kuwatumia jibu au uamuzi wake.
