  text: וְ/הִתְנַבִּ֞י חַגַּ֣י נביא/ה וּ/זְכַרְיָ֤ה בַר עִדּוֹא֙ נביאי/א עַל יְה֣וּדָיֵ֔/א דִּ֥י בִ/יה֖וּד וּ/בִ/ירוּשְׁלֶ֑ם בְּ/שֻׁ֛ם אֱלָ֥הּ יִשְׂרָאֵ֖ל עֲלֵי/הֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/001.yaml
  text: Haggai the prophet and Zechariah son of Iddo[a], the prophets, prophesied to the Jews who were in Judah and in Jerusalem[b], in the name of the God of Israel who was over them.
translation:
  language: sw
  text: Hagai nabii na Zekaria mwana wa Ido, manabii hao, waliwatolea Wayahudi[a] unabii waliokuwa katika Yuda na Yerusalemu, kwa jina[b] la Mungu wa Israeli aliyekuwa juu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Yuda.” Neno la Kiaramu linaweza kumaanisha Wayahudi au, kwa mkazo wa kijiografia, watu wa Yuda.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa mamlaka ya Mungu wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְנַבִּי
  choice: waliwatolea unabii
  rationale: Kitenzi kinaeleza tendo la kutoa unabii kwa hadhira fulani. Usemi huu huepuka kuifanya maana kuwa kutabiri matukio yajayo pekee, huku ukibaki wa kawaida na wazi katika Kiswahili.
- source_word: חַגַּי נביאה
  choice: Hagai nabii
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia, na umbo bainifu la cheo limetafsiriwa kwa apposition ya kawaida, ‘Hagai nabii.’
- source_word: וּזְכַרְיָה בַר עִדּוֹא
  choice: na Zekaria mwana wa Ido
  rationale: בַר ni neno la Kiaramu linalomaanisha ‘mwana wa’; majina yametoholewa kwa mazoea ya Kiswahili.
- source_word: נביאיא
  choice: manabii hao
  rationale: Nomino ya wingi inawarejelea kwa apposition Hagai na Zekaria. ‘Hao’ hufanya muundo huo uwe wa asili katika Kiswahili bila kuondoa marudio yaliyomo katika chanzo.
- source_word: עַל יְהוּדָיֵא
  choice: Wayahudi
  rationale: Baada ya kitenzi cha kutoa unabii, עַל huonyesha walengwa wa ujumbe. יְהוּדָיֵא inaweza kumaanisha Wayahudi au watu wa Yuda; chaguo la kawaida ni ‘Wayahudi,’ huku uwezekano wa kijiografia ukihifadhiwa katika tanbihi.
- source_word: דִּי בִיהוּד וּבִירוּשְׁלֶם
  choice: waliokuwa Yuda na Yerusalemu
  rationale: דִּי inaanzisha kishazi rejeshi. ‘Yuda’ inafaa kwa eneo la kipindi cha baada ya uhamisho, na matumizi ya ‘kuwa Yuda/Yerusalemu’ ni ya kawaida katika Kiswahili.
- source_word: בְּשֻׁם
  choice: kwa jina
  rationale: Nahau hii inaonyesha kusema kwa uwakilishi na mamlaka ya Mungu. ‘Kwa jina’ ni usemi wa kawaida unaohifadhi picha ya chanzo; maana ya mamlaka imeelezwa katika tanbihi.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huu ni mfuatano wa umilikaji ulio wazi na umetafsiriwa moja kwa moja.
- source_word: עֲלֵיהוֹן
  choice: aliyekuwa juu yao
  rationale: Kirai hiki kinaeleweka zaidi kuwa kinamfafanua Mungu wa Israeli na kuonyesha mamlaka au uangalizi wake juu ya Wayahudi. Kishazi rejeshi kinatoa Kiswahili kilicho wazi bila kuficha uhusiano huo.
theological_decisions:
- issue: Kirejeleo na nguvu ya kirai cha mwisho עֲלֵיהוֹן
  choice: Kimeunganishwa na ‘Mungu wa Israeli’ na kutafsiriwa ‘aliyekuwa juu yao,’ kikihifadhi wazo la mamlaka au uangalizi wa Mungu.
  alternative: Kinaweza kushikiliwa kwa namna iliyobanwa zaidi kama ‘juu yao,’ labda kikisisitiza kuwapo kwa Mungu pamoja nao au kikihusishwa kwa upana zaidi na tendo la kutoa unabii.
  rationale: Sintaksia inaelekea kukiunganisha kirai hiki na ‘Mungu wa Israeli.’ Tafsiri haiongezi dhana mahususi ya kimadhehebu, bali inadumisha lugha pana ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘manabii hao’ huhifadhi apposition ya chanzo kwa namna ya asili. ‘Waliwatolea unabii’ huchaguliwa badala ya ‘waliwatabiria’ ili neno lisieleweke kuwa utabiri wa wakati ujao pekee. Alama zote za tanbihi zimewekwa katika matini kwenye maneno yanayohusika.
