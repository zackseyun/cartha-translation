base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/006.yaml
  text: This is a copy of the letter that Tattenai[a], the governor of Beyond the River, and Shethar-bozenai and his associates, the officials who were in Beyond the River, sent to King Darius.
translation:
  language: sw
  text: Hii ni nakala ya barua ambayo Tatenai, gavana wa Ng’ambo ya Mto, Shethar-bozenai, na wenzake, maafisa[a] waliokuwa Ng’ambo ya Mto, walimtumia Mfalme Dario.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waafarsakai,” ikiwa neno hili linaeleweka kuwa jina la watu au la kikundi cha kiutawala, badala ya kumaanisha maafisa.
    reason: alternative_reading
lexical_decisions:
- source_word: פַּרְשֶׁגֶן
  choice: nakala
  rationale: Neno hili linamaanisha nakala ya maandishi au hati; “nakala” ni Kiswahili cha kawaida na kinafaa katika muktadha wa hati rasmi.
- source_word: אִגַּרְתָּא
  choice: barua
  rationale: Linamaanisha ujumbe rasmi ulioandikwa; “barua” ni neno la kawaida na linaloeleweka wazi.
- source_word: שְׁלַח
  choice: walimtumia
  rationale: Kitenzi kinamaanisha kutuma. Umbo la wingi linafuata kwa kawaida orodha ya watumaji katika Kiswahili, na kiambishi -m- kinamtaja Dario kama mpokeaji.
- source_word: תַּתְּנַי
  choice: Tatenai
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: פַּחַת
  choice: gavana
  rationale: Katika utawala wa Uajemi neno hili humaanisha mtawala wa eneo; “gavana” ni sawia iliyo wazi na ya sasa.
- source_word: עֲבַר נַהֲרָה
  choice: Ng’ambo ya Mto
  rationale: Ni jina la kiutawala la eneo lililokuwa magharibi mwa Mto Frati. Herufi kubwa zinaonyesha kuwa hapa ni jina maalumu la eneo, si maelezo ya kawaida tu.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: na Shethar-bozenai
  rationale: Jina la mtu limehifadhiwa kwa utohozi; kistari kinaonyesha sehemu mbili za jina hilo.
- source_word: וּכְנָוָתֵהּ
  choice: pamoja na wenzake
  rationale: Neno hili linawataja watu waliohusiana naye katika shughuli rasmi; “wenzake” ni la kawaida na linaendana na muktadha.
- source_word: אֲפַרְסְכָיֵא
  choice: maafisa
  rationale: Neno hili lina utata na huenda likamaanisha kundi la maafisa au jina la kikundi cha watu. “Maafisa” linaonyesha kazi yao katika muktadha bila kudai kwa uhakika utambulisho wa kikabila.
- source_word: עַל
  choice: -tumia
  rationale: Pamoja na kitenzi cha kutuma na jina la mpokeaji, maana yake ya kimuktadha imewasilishwa kwa kitenzi “walimtumia,” yaani walituma kwake.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: Mfalme Dario
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi cheo cha kifalme.
