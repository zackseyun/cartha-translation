translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umehifadhi mtindo wa hati rasmi, huku “yaani” ikifafanua uhusiano wa “maafisa” na wenzake. Alama ya tanbihi imewekwa moja kwa moja baada ya neno lenye utata.
