id: EZR.5.2
reference: Ezra 5:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בֵּ/אדַ֡יִן קָ֠מוּ זְרֻבָּבֶ֤ל בַּר שְׁאַלְתִּיאֵל֙ וְ/יֵשׁ֣וּעַ בַּר יֽוֹצָדָ֔ק וְ/שָׁרִ֣יו לְ/מִבְנֵ֔א בֵּ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירֽוּשְׁלֶ֑ם וְ/עִמְּ/ה֛וֹן נביאי/א דִֽי אֱלָהָ֖/א מְסָעֲדִ֥ין לְ/הֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/002.yaml
  text: Then Zerubbabel son of Shealtiel and Jeshua son of Jozadak arose and began to build the house of God that is in Jerusalem[a], and with them were the prophets of God[c][b], supporting them.
translation:
  language: sw
  text: Ndipo Zerubabeli mwana wa Shealtieli na Yeshua[b] mwana wa Yosadaki wakainuka na kuanza kuijenga nyumba ya Mungu iliyoko Yerusalemu[a]; nao manabii wa Mungu walikuwa pamoja nao, wakiwasaidia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hekalu la Mungu.” Kiaramu kinasema kihalisi “nyumba ya Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Yeshua ni umbo la jina la mtu lililotumiwa hapa; linganisha na umbo la jina linalohusiana nalo, “Yoshua,” mahali pengine.
    reason: lexical_alternative
  - marker: c
    text: Au “wakiwaunga mkono.” Umbo la kitenzi linaonyesha msaada wa vitendo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Ndipo
  rationale: Ni kiashiria cha mwendelezo wa masimulizi kinachoanzisha tukio linalofuata; “Ndipo” ni cha asili katika Kiswahili na huhifadhi maana ya “wakati huo/halafu.”
- source_word: קָמוּ
  choice: wakainuka
  rationale: Huhifadhi maana ya msingi ya kusimama au kuinuka, huku katika muktadha ikionyesha kujitokeza ili kuanza kazi.
- source_word: זְרֻבָּבֶל בַּר שְׁאַלְתִּיאֵל
  choice: Zerubabeli mwana wa Shealtieli
  rationale: Majina yameandikwa kwa namna inayosomeka kwa Kiswahili, na neno la Kiaramu בַּר limetafsiriwa moja kwa moja kuwa “mwana wa.”
- source_word: יֵשׁוּעַ בַּר יוֹצָדָק
  choice: Yeshua mwana wa Yosadaki
  rationale: “Yeshua” huhifadhi umbo la jina lililo katika matini hii badala ya kulibadilisha kimya kuwa umbo jingine linalohusiana nalo; “mwana wa” hutafsiri patronimu ya Kiaramu.
- source_word: וְשָׁרִיו לְמִבְנֵא
  choice: na kuanza kuijenga
  rationale: Kitenzi kisaidizi kina maana ya kuanza, nacho kinafuatwa na kitenzi-jina “kujenga”; kiambishi “-i-” kinairejelea nyumba iliyotajwa.
- source_word: בֵּית אֱלָהָא
  choice: nyumba ya Mungu
  rationale: Hii ndiyo tafsiri ya karibu ya maneno ya Kiaramu. Ingawa katika muktadha inamaanisha hekalu, tamathali ya asili imehifadhiwa katika matini kuu.
- source_word: דִּי בִירוּשְׁלֶם
  choice: iliyoko Yerusalemu
  rationale: Hutoa kwa Kiswahili cha kawaida kishazi husishi kinachoonyesha mahali nyumba ya Mungu ilipo.
- source_word: וְעִמְּהוֹן נביאיא דִי אֱלָהָא
  choice: nao manabii wa Mungu walikuwa pamoja nao
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kwamba manabii waliandamana na Zerubabeli na Yeshua katika kazi hiyo.
- source_word: מְסָעֲדִין לְהוֹן
  choice: wakiwasaidia
  rationale: Kitenzi kishirikishi kinaonyesha msaada wa vitendo uliokuwa ukiendelea; “wakiwasaidia” ni cha kawaida na wazi kwa wasomaji wa sasa.
theological_decisions:
- issue: Maana ya בֵּית אֱלָהָא
  choice: nyumba ya Mungu
  alternative: hekalu la Mungu
  rationale: Matini ya Kiaramu inasema kihalisi “nyumba ya Mungu.” Muktadha unaonyesha kuwa ni hekalu, lakini kuweka usemi halisi katika matini kuu huhifadhi lugha ya chanzo bila kuficha tafsiri halali ya kimuktadha.
- issue: Umbo la jina יֵשׁוּעַ
  choice: Yeshua
  alternative: Yoshua
  rationale: Umbo lililoandikwa hapa ni Yeshua. Kulihifadhi kunatofautisha ushahidi halisi wa matini na umbo refu linalohusiana nalo linalopatikana kwingine, bila kudai kwamba ni watu tofauti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya masimulizi ya Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. “Ndipo,” “wakainuka,” na “wakiwasaidia” huhifadhi mwendo wa simulizi na tendo hai bila kutumia lugha ya kizamani. Alama zote za tanbihi zimewekwa moja kwa moja katika matini kuu.
