  yaml_path: translation/ot/ezra/005/010.yaml
  text: We also asked them their names[a], to make them known to you[b], that we might write down the names of the men who were at their head.
translation:
  language: sw
  text: Pia tuliwauliza majina yao, ili tupate kukujulisha majina yao, tupate kuandika majina ya watu waliokuwa viongozi wao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “waliokuwa kichwani mwao”; yaani, waliowaongoza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: Pia
  rationale: Inaendeleza taarifa kwa kuongeza jambo jingine kwa Kiswahili cha kawaida.
- source_word: שְׁמָהָתְהֹם
  choice: majina yao
  rationale: Nomino ya wingi pamoja na kiambishi cha nafsi ya tatu wingi inaonyesha umilikaji.
- source_word: שְׁאֵלְנָא לְּהֹם
  choice: tuliwauliza
  rationale: Hutoa maana ya kuuliza au kutaka habari kutoka kwao kwa lugha ya asili.
- source_word: לְהוֹדָעוּתָךְ
  choice: ili tukujulishe
  rationale: Hii ni kauli ya kusudi; tafsiri hii ni ya kawaida na inaonyesha kwamba habari hiyo ilikusudiwa kufikishwa kwa mhusika wa pili umoja.
- source_word: דִּי נִכְתֻּב
  choice: tupate kuandika
  rationale: Inaonyesha kusudi au matokeo yaliyokusudiwa ya kuuliza majina.
- source_word: שֻׁם גֻּבְרַיָּא
  choice: majina ya watu
  rationale: Ingawa שֻׁם ina umbo la umoja, hapa ina maana ya kijumla kwa kurejelea watu wengi; 'watu' ni pana na ya kawaida.
- source_word: דִּי בְרָאשֵׁיהֹם
  choice: waliokuwa viongozi wao
  rationale: Nahau ya Kiaramu, kihalisi 'waliokuwa kichwani mwao,' humaanisha watu waliokuwa wakiongoza kundi.
