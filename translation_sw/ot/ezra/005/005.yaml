base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/005.yaml
  text: But the eye of their God was on the elders of the Jews[a], and they did not make them stop until a decree should go to Darius[c][b]; then they would send back a letter concerning this matter.
translation:
  language: sw
  text: Lakini jicho la Mungu wao lilikuwa juu ya wazee wa Wayahudi[a], nao hawakuwazuia mpaka uamuzi ufikishwe kwa Dario[b]; ndipo wangetuma barua kuhusu jambo hilo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jicho la Mungu wao lilikuwa likiwaangalia wazee wa Wayahudi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mpaka amri ifikishwe kwa Dario.” Neno la Kiaramu linaweza kumaanisha pia uamuzi au amri rasmi.
    reason: lexical_alternative
  - marker: c
    text: Au, “ndipo wangerudisha barua kuhusu jambo hilo,” au “wangetuma jibu kwa maandishi kuhusu jambo hili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵין אֱלָהֲהֹם הֲוָת עַל
  choice: Lakini jicho la Mungu wao lilikuwa juu ya
  rationale: Inahifadhi sitiari ya umoja, “jicho,” pamoja na kiambishi cha umilikaji “wao.” “Lakini” huonyesha tofauti na hatua ya maofisa katika muktadha uliotangulia.
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: wazee wa Wayahudi
  rationale: שָׂבֵי humaanisha wazee, si viongozi kwa ujumla; muundo wa uhusiano umehifadhiwa kwa Kiswahili cha kawaida.
- source_word: וְלָא בַטִּלוּ הִמּוֹ
  choice: nao hawakuwasimamisha
  rationale: Kitenzi cha Pael kina maana ya kusababisha kazi ikome. Katika Kiswahili, “hawakuwasimamisha” huwasilisha maana hiyo kwa ufupi na kwa kawaida.
- source_word: עַד טַעְמָא לְדָרְיָוֶשׁ יְהָךְ
  choice: mpaka uamuzi upelekwe kwa Dario
  rationale: טַעְמָא katika mazingira ya utawala inaweza kuwa uamuzi au amri rasmi. “Uamuzi” huhifadhi upana huo, na hali ya kutarajiwa ya kitenzi imewasilishwa kwa “upelekwe.”
- source_word: וֶאֱדַיִן יְתִיבוּן נִשְׁתְּוָנָא
  choice: ndipo wangetuma jibu la maandishi
  rationale: יְתִיבוּן inaweza kuonyesha kurudisha au kujibu, huku נִשְׁתְּוָנָא ikiwa mawasiliano rasmi yaliyoandikwa. Tafsiri hii inaonyesha jibu linalorudishwa kwa maandishi bila kulifanya kuwa tu barua ya kawaida.
- source_word: עַל דְּנָה
  choice: kuhusu jambo hilo
  rationale: Kirai hiki kinarejelea suala lililokuwa likichunguzwa; “jambo hilo” ni wazi na la kawaida katika Kiswahili.
theological_decisions:
- issue: Maelezo ya Mungu kwa kutumia mfano wa kibinadamu kuhusu uangalizi wake
  choice: Kuhifadhi “jicho la Mungu wao lilikuwa juu ya” katika matini kuu
  alternative: “Mungu wao alikuwa akiwaangalia” au “jicho la Mungu wao lilikuwa likiwalinda”
  rationale: Kiaramu kinatumia picha halisi ya “jicho.” Kuihifadhi hudumisha nguvu ya kifasihi na wazo la uangalizi wa Mungu bila kuingiza ufafanuzi wa ziada wa kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sitiari ya “jicho” imehifadhiwa; istilahi za kiutawala zimewekwa kwa lugha ya sasa bila kufuta utata wa Kiaramu.
