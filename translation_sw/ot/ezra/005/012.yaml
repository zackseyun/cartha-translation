id: EZR.5.12
reference: Ezra 5:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לָהֵ֗ן מִן דִּ֨י הַרְגִּ֤זוּ אֲבָהֳתַ֨/נָא֙ לֶ/אֱלָ֣הּ שְׁמַיָּ֔/א יְהַ֣ב הִמּ֔וֹ בְּ/יַ֛ד נְבוּכַדְנֶצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל כסדי/א וּ/בַיְתָ֤/ה דְנָה֙ סַתְרֵ֔/הּ וְ/עַמָּ֖/ה הַגְלִ֥י לְ/בָבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/012.yaml
  text: Therefore[a], because our fathers provoked the God of heaven to wrath, he gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean[c][b], and he destroyed this house and carried the people away to Babylon.
translation:
  language: sw
  text: Kwa hiyo, kwa sababu baba zetu walimkasirisha Mungu wa mbinguni, aliwatia mikononi mwa Nebukadneza, mfalme wa Babeli, Mkaldayo. Naye akaibomoa nyumba hii[b] na akawapeleka watu uhamishoni Babeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Yaani, hekalu.
    reason: ‘Nyumba hii’ katika muktadha huu inarejelea hekalu la Mungu.
lexical_decisions:
- source_word: לָהֵן
  choice: Lakini
  rationale: Katika muktadha huu kiunganishi kinaonyesha tofauti kati ya ujenzi wa hekalu uliotajwa hapo awali na hukumu iliyofuata. Neno hilo pia linaweza kueleweka kwa maana ya hitimisho, hivyo chaguo hilo limetajwa katika tanbihi.
- source_word: מִן דִּי
  choice: kwa sababu
  rationale: Muungano huu wa Kiaramu hutumika kama kiunganishi cha sababu; ‘kwa sababu’ ni Kiswahili cha kawaida na wazi.
- source_word: הַרְגִּזוּ
  choice: walimkasirisha
  rationale: Kitenzi cha kisababishi kinaonyesha kwamba mababu walisababisha hasira ya Mungu. ‘Walimkasirisha’ huhifadhi maana hiyo kwa lugha ya kawaida yenye heshima.
- source_word: אֲבָהֳתַנָא
  choice: baba zetu
  rationale: Hili ni tafsiri ya karibu ya usemi wa Kiaramu unaowarejelea waliotangulia; katika mtindo wa kibiblia wa Kiswahili linaeleweka kama mababu.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: Mungu wa mbinguni
  rationale: Huhifadhi cheo cha Mungu kilicho katika maandishi ya Kiaramu na kinatumika kwa kawaida katika Kiswahili.
- source_word: יְהַב הִמּוֹ בְּיַד
  choice: aliwatia mikononi mwa
  rationale: Huhifadhi sitiari ya kibiblia ya kuwaweka watu chini ya mamlaka ya mwingine huku ikisomeka kwa urahisi katika Kiswahili.
- source_word: נְבוּכַדְנֶצַּר מֶלֶךְ בָּבֶל
  choice: Nebukadneza, mfalme wa Babeli
  rationale: ‘Nebukadneza’ ni umbo lililozoeleka katika Biblia za Kiswahili; cheo chake kimetafsiriwa moja kwa moja.
- source_word: כסדיא
  choice: Mkaldayo
  rationale: Jina hili la taifa liko katika umoja na linamfafanua Nebukadneza; ‘Mkaldayo’ huhifadhi umbo hilo bila kulibadili kuwa ‘Mbabeli.’
- source_word: וּבַיְתָה דְנָה
  choice: nyumba hii
  rationale: Maandishi yanasema ‘nyumba,’ ingawa katika muktadha yanamaanisha hekalu. Tafsiri halisi imehifadhiwa na maana yake kufafanuliwa katika tanbihi.
- source_word: סַתְרֵהּ
  choice: akaibomoa
  rationale: Kitenzi kina maana ya kubomoa au kuangusha jengo. ‘Akaibomoa’ ni mahususi na cha kawaida kwa uharibifu wa hekalu.
- source_word: וְעַמָּה הַגְלִי
  choice: kuwapeleka watu uhamishoni
  rationale: Kitenzi cha kisababishi kinaonyesha kuwatoa watu nchini na kuwapeleka uhamishoni; tafsiri hii huweka wazi maana hiyo bila kupoteza tendo la kuwapeleka.
- source_word: לְבָבֶל
  choice: Babeli
  rationale: Hapa kihusishi kinaonyesha mwisho wa safari ya uhamisho; muundo ‘uhamishoni Babeli’ ni wa asili katika Kiswahili.
theological_decisions:
- issue: Lugha ya hukumu ya Mungu na uhusika wake wa moja kwa moja
  choice: aliwatia mikononi mwa Nebukadneza
  alternative: aliruhusu waanguke mikononi mwa Nebukadneza
  rationale: Maandishi yanamhusisha Mungu moja kwa moja na kuwakabidhi watu kama hukumu kwa kumkasirisha. Tafsiri hailegezi kauli hiyo na kuifanya ruhusa tu.
- issue: Neno linalolitaja hekalu
  choice: nyumba hii
  alternative: hekalu hili
  rationale: Ingawa kinachorejelewa ni hekalu, neno la Kiaramu ni ‘nyumba.’ Kulihifadhi kunadumisha lugha ya chanzo na maana ya kitheolojia ya hekalu kama nyumba ya Mungu; tanbihi hufafanua rejeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili kuboresha usomaji bila kubadili mlolongo wa matendo. ‘Baba zetu’ na ‘mikononi mwa’ huhifadhi ladha ya kibiblia lakini bado zinaeleweka kwa msomaji wa kawaida.
