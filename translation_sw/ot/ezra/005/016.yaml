base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/016.yaml
  text: Then this Sheshbazzar came and laid the foundations of the house of God that is in Jerusalem[a]; and from then until now it has been being built[b], but it is not finished.
translation:
  language: sw
  text: Ndipo huyo Sheshbaza akaja, akaweka misingi ya nyumba ya Mungu iliyoko Yerusalemu[a]. Tangu wakati huo mpaka sasa, nyumba hiyo inaendelea kujengwa[b], lakini bado haijakamilika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa mtindo rasmi zaidi, “kuweka misingi.” Nahau ya Kiaramu ni “kutoa misingi” kihalisi.
    reason: lexical_alternative
  - marker: b
    text: Au, “inajengwa.” Kitenzi cha Kiaramu kinaweza kutafsiriwa kuwa mchakato wa kutendwa unaoendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Ndipo
  rationale: Kielezi hiki cha Kiaramu huonyesha hatua inayofuata katika simulizi; “Ndipo” ni cha asili katika Kiswahili na hudumisha mfuatano wa wakati.
- source_word: שֵׁשְׁבַּצַּר דֵּךְ
  choice: huyo Sheshbaza
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili, na “huyo” huhifadhi nguvu ya kiashiria kinachomrejelea mtu aliyetajwa.
- source_word: אֲתָא
  choice: akaja
  rationale: Hii ni kitenzi rahisi cha kisimulizi kinachoonyesha kuja kwake.
- source_word: יְהַב אֻשַּׁיָּא
  choice: kuweka misingi
  rationale: Nahau hiyo ni ‘kutoa misingi’ kihalisi, lakini “kuweka misingi” ndiyo usemi wa kawaida wa ujenzi katika Kiswahili.
- source_word: בֵית אֱלָהָא
  choice: nyumba ya Mungu
  rationale: Huhifadhi usemi wa Kiaramu bila kuufasiri moja kwa moja kuwa ‘hekalu.’
- source_word: דִּי בִירוּשְׁלֶם
  choice: iliyoko Yerusalemu
  rationale: Hutoa kwa kawaida kishazi cha uhusiano chenye maana ya mahali.
- source_word: וּמִן אֱדַיִן וְעַד כְּעַן
  choice: Tangu wakati huo mpaka sasa
  rationale: Huhifadhi kipindi kinachoanzia kuwekwa kwa misingi hadi wakati wa wasemaji.
- source_word: מִתְבְּנֵא
  choice: inaendelea kujengwa
  rationale: Huhifadhi hali ya kutendwa na mchakato unaoendelea katika muktadha.
- source_word: וְלָא שְׁלִם
  choice: lakini bado haijakamilika
  rationale: Hueleza wazi kwamba kufikia wakati huo kazi haikuwa imefikia mwisho; “bado” ni ya asili kutokana na muktadha wa muda.
