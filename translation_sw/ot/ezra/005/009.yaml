  yaml_path: translation/ot/ezra/005/009.yaml
  text: 'Then we asked those elders and said to them as follows: “Who gave you a decree to build this house and to complete this structure?”[a][b]'
translation:
  language: sw
  text: 'Ndipo tukawauliza wale wazee, tukawaambia hivi: “Ni nani aliyewapa amri ya kuijenga nyumba hii na kuukamilisha muundo huu?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuijenga nyumba hii na kuukamilisha jengo hili,” ikihifadhi usemi wa karibu zaidi wa “nyumba hii” na “muundo huu”; “nyumba” hapa inarejelea hekalu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiaramu lililotafsiriwa “muundo” linaweza kurejelea hasa sehemu zilizojengwa, fremu, au ujenzi unaohusiana na jengo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Ndipo
  rationale: Kielezi hiki cha Kiaramu kinaonyesha mfuatano wa matukio; “Ndipo” ni cha kawaida katika masimulizi ya Kiswahili na huhifadhi maendeleo ya wakati.
- source_word: שְׁאֵלְנָא
  choice: tukawauliza
  rationale: Kitenzi kinaeleza kitendo cha kuuliza; muundo huu unaunganisha kwa kawaida na “Ndipo” katika usimulizi.
- source_word: לְשָׂבַיָּא אִלֵּךְ
  choice: wale wazee
  rationale: Kirejeshi kinaelekeza kwa viongozi waliotajwa katika mazingira ya simulizi; “wale” huhifadhi maana hiyo ya uelekezaji.
- source_word: כְּנֵמָא אֲמַרְנָא לְּהֹם
  choice: na kuwaambia hivi
  rationale: Kauli hii inatanguliza maneno yaliyonukuliwa; “hivi” ni ya asili na wazi katika Kiswahili cha sasa.
- source_word: מַן
  choice: Ni nani
  rationale: Kiwakilishi ulizi kinauliza mtu au mamlaka iliyotoa agizo.
- source_word: שָׂם לְכֹם טְעֵם
  choice: aliyewapa amri
  rationale: טְעֵם katika Kiaramu cha utawala humaanisha agizo, uamuzi, au amri rasmi; “amri” huhifadhi maana ya mamlaka bila kulazimisha aina mahususi ya hati.
- source_word: בַּיְתָא דְנָה
  choice: nyumba hii
  rationale: Maana ya moja kwa moja ni “nyumba hii.” Ingawa hapa inarejelea hekalu, tafsiri kuu huhifadhi taswira ya chanzo.
- source_word: לְמִבְנְיָה
  choice: kuijenga
  rationale: Kitenzi chenyewe ni “kujenga,” si “kujenga upya”; kiambishi “-i-” kinarejelea nyumba.
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: ujenzi huu
  rationale: Nomino hii adimu inaweza kurejelea muundo, fremu, au sehemu iliyojengwa. “Ujenzi” ni pana na ya asili, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: לְשַׁכְלָלָה
  choice: kuukamilisha
  rationale: Kitenzi kina maana ya kufikisha kazi kwenye ukamilifu; “kukamilisha” kinafaa kwa mtindo rasmi wa taarifa hii.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kawaida kueleweka. Muundo wa taarifa rasmi umehifadhiwa bila kufanya sentensi kuwa nzito; istilahi adimu imewekwa kwa upana katika matini na kufafanuliwa katika tanbihi.
