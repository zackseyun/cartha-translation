  yaml_path: translation/ot/ezra/005/013.yaml
  text: However[a], in the first year of Cyrus king of Babylon, Cyrus the king issued a decree to rebuild this house of God.
translation:
  language: sw
  text: Lakini katika mwaka wa kwanza wa Koreshi, mfalme wa Babeli, Mfalme Koreshi alitoa amri kwamba nyumba hii ya Mungu ijengwe upya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ijengwe.” Kitenzi cha Kiaramu chenyewe humaanisha “kujenga”; “ijengwe upya” inaonyesha muktadha wa kulirudisha hekalu lililoharibiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: Lakini
  rationale: Kiunganishi hiki cha Kiaramu kinaonyesha utofautishaji na habari iliyotangulia; “Lakini” ni ya kawaida, wazi, na yenye hadhi katika Kiswahili cha sasa.
- source_word: בִּשְׁנַת חֲדָה
  choice: katika mwaka wa kwanza
  rationale: Hii ni kauli ya kawaida ya kutaja mwaka wa utawala; tafsiri hii ni ya asili katika Kiswahili.
- source_word: לְכוֹרֶשׁ מַלְכָּא דִּי בָבֶל
  choice: wa Koreshi, mfalme wa Babeli
  rationale: Lamed katika mtindo huu wa tarehe huhusisha mwaka na utawala wa Koreshi akiwa mfalme wa Babeli.
- source_word: שָׂם טְעֵם
  choice: alitoa amri
  rationale: Ingawa שָׂם kimsingi ni “aliweka,” pamoja na טְעֵם katika muktadha wa utawala wa kifalme msemo huo humaanisha kutoa amri rasmi.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: nyumba hii ya Mungu
  rationale: Tafsiri hii inahifadhi taswira halisi ya Kiaramu; katika muktadha nyumba hiyo ni hekalu.
- source_word: לִבְנֵא
  choice: ijengwe upya
  rationale: Kitenzi chenyewe humaanisha “kujenga,” lakini “kujengwa upya” huonyesha wazi muktadha wa kurudishwa kwa hekalu lililoharibiwa; maana ya msingi imehifadhiwa katika tanbihi.
