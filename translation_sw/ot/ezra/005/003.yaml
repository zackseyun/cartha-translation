  text: בֵּ/הּ זִמְנָ/א֩ אֲתָ֨א עֲלֵי/ה֜וֹן תַּ֠תְּנַי פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה וּ/שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן וְ/כֵן֙ אָמְרִ֣ין לְ/הֹ֔ם מַן שָׂ֨ם לְ/כֹ֜ם טְעֵ֗ם בַּיְתָ֤/א דְנָה֙ לִ/בְּנֵ֔א וְ/אֻשַּׁרְנָ֥/א דְנָ֖ה לְ/שַׁכְלָלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/003.yaml
  text: 'At that time Tattenai[a], the governor of Beyond the River[c][b], and Shethar-bozenai and their associates came to them and spoke thus to them: “Who gave you a decree to build this house and to complete this structure?”'
translation:
  language: sw
  text: 'Wakati huo, Tatenai, gavana wa Ng’ambo ya Mto[a], Shethar-bozenai, na wenzao waliwaendea na kuwaambia hivi: “Ni nani aliyewapa amri ya kujenga nyumba hii na kukamilisha jengo hili[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ng’ambo ya Mto” lilikuwa jina la kiutawala la Kiajemi kwa eneo lililokuwa magharibi ya Mto Frati.
    reason: cultural_note
  - marker: b
    text: Maana mahususi ya neno la Kiaramu lililotafsiriwa “jengo” haiko wazi hapa; huenda linamaanisha kazi hii ya ujenzi, ukuta, au kiunzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: Wakati huo
  rationale: Ni usemi wa kawaida wa Kiaramu unaoweka tukio katika wakati wa simulizi; tafsiri hii ni ya asili na wazi katika Kiswahili.
- source_word: אֲתָא עֲלֵיהוֹן
  choice: waliwaendea
  rationale: Kitenzi pamoja na kihusishi kinaonyesha kuwa maafisa waliwakaribia wajenzi; ‘waliwaendea’ ni Kiswahili cha asili bila kuongeza wazo la uadui.
- source_word: תַּתְּנַי
  choice: Tatenai
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: liwali wa Ng’ambo ya Mto
  rationale: פַּחַת ni mtawala wa eneo chini ya himaya, na עֲבַר נַהֲרָה ni jina la kiutawala la Kiajemi kwa eneo lililokuwa magharibi ya Frati. ‘Liwali’ linafaa kwa cheo hicho, huku tanbihi ikifafanua jina la eneo.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: Shethar-bozenai
  rationale: Jina limetoholewa, huku kistari kikihifadhi umbo lake la kiambatani.
- source_word: וּכְנָוָתְהוֹן
  choice: na wenzao
  rationale: Neno hili linawahusu walioambatana au kushirikiana nao; ‘wenzao’ ni pana, la kawaida, na halibainishi zaidi ya chanzo.
- source_word: וְכֵן אָמְרִין לְהֹם
  choice: na kuwauliza hivi
  rationale: Ingawa maana ya msingi ni ‘wakawaambia hivi,’ maneno yanayofuata ni swali la moja kwa moja; ‘kuwauliza hivi’ hutoa Kiswahili cha asili na kuhifadhi dhima ya usemi.
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: Ni nani aliyewapa amri
  rationale: טְעֵם katika Kiaramu cha utawala inaweza kumaanisha amri, agizo, au azimio rasmi. ‘Amri’ ni neno la kawaida linalobeba wazo la mamlaka bila kulazimisha aina maalumu ya hati.
- source_word: בַּיְתָא דְנָה לִבְנֵא
  choice: kujenga nyumba hii
  rationale: ‘Nyumba’ huhifadhi neno la chanzo na katika muktadha humaanisha hekalu; ‘kujenga’ haiongezi dhana ya ‘kujenga upya’ ambayo haimo wazi katika kitenzi.
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: jengo hili
  rationale: Maana mahususi ya nomino hii si hakika; ‘jengo’ ni pana vya kutosha kuhifadhi uwezekano wa kazi ya ujenzi, kiunzi, au ukuta unaohusiana na hekalu.
- source_word: לְשַׁכְלָלָה
  choice: kukamilisha
  rationale: Kitenzi kina maana ya kufikisha kazi mwisho au kuifanya kamili; ‘kukamilisha’ ni sahihi na ya asili.
