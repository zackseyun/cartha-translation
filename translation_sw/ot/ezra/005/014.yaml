  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili. Alama ya tanbihi imewekwa kwenye fomula ya kumtaja Sheshbaza, ambayo ndiyo inayofafanuliwa na tanbihi.
