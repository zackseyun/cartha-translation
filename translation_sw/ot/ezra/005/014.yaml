base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/014.yaml
  text: Also[a], the gold and silver vessels of the house of God, which Nebuchadnezzar had taken out from the temple that was in Jerusalem and brought them to the temple of Babylon—Cyrus the king took them out from the temple of Babylon and gave them to one named Sheshbazzar, whom he had appointed governor.
translation:
  language: sw
  text: Tena, vyombo vya dhahabu na fedha vya nyumba ya Mungu, ambavyo Nebukadneza alikuwa amevitoa katika hekalu lililokuwa Yerusalemu na kuvileta katika hekalu la Babeli—Mfalme Koreshi alivitoa katika hekalu la Babeli na akampa mtu aliyeitwa Sheshbaza vyombo hivyo,[a] ambaye alikuwa amemweka kuwa gavana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa maneno kwa karibu zaidi, “akampa Sheshbaza—jina lake—vyombo hivyo, ambaye alikuwa amemweka kuwa gavana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: Tena
  rationale: Kiunganishi hiki kinaongeza jambo lingine katika taarifa; “Tena” ni cha asili na chenye hadhi katika Kiswahili.
- source_word: מָאנַיָּא
  choice: vyombo
  rationale: Neno hili linarejelea vifaa au vyombo vya ibada vya hekaluni; “vyombo” ni sahihi na linaeleweka kwa urahisi.
- source_word: בֵית אֱלָהָא
  choice: nyumba ya Mungu
  rationale: Tafsiri ya karibu ya usemi wa Kiaramu, huku “hekalu” likihifadhiwa kwa הֵיכְלָא baadaye katika aya.
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: vya dhahabu na fedha
  rationale: Inaonyesha vitu vilivyotengenezwa kwa dhahabu na fedha kwa mtindo wa kawaida wa Kiswahili.
- source_word: הַנְפֵּק
  choice: alikuwa amevitoa / alivitoa
  rationale: Kwa tendo la Nebukadneza, wakati timilifu wa zamani unaonyesha tendo lililotangulia; kwa Koreshi, wakati uliopita unaendeleza taarifa.
- source_word: הֵיכְלָא
  choice: hekalu
  rationale: Katika muktadha huu neno linarejelea majengo ya ibada huko Yerusalemu na Babeli.
- source_word: וְהֵיבֵל הִמּוֹ
  choice: na kuvileta
  rationale: Kiambishi cha yambwa “-vi-” kinarejelea wazi vyombo vilivyotajwa.
- source_word: כּוֹרֶשׁ מַלְכָּא
  choice: Mfalme Koreshi
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi cheo cha Koreshi.
- source_word: וִיהִיבוּ לְשֵׁשְׁבַּצַּר שְׁמֵהּ
  choice: na kumpa mtu aliyeitwa Sheshbaza
  rationale: Hutoa kwa Kiswahili cha asili fomula ya Kiaramu inayosema kihalisi “akampa Sheshbaza—jina lake.”
- source_word: פֶחָה
  choice: gavana
  rationale: Ni neno la kawaida na linaloeleweka kwa cheo hiki cha utawala wa Uajemi.
- source_word: שָׂמֵהּ
  choice: alikuwa amemweka
  rationale: Linaonyesha kwamba Koreshi alikuwa amemteua rasmi Sheshbaza katika wadhifa huo.
