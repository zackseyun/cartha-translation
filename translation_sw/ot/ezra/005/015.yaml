  text: And he said to him[a], ‘Take these vessels, go and put them in the temple that is in Jerusalem, and let the house of God be rebuilt on its site.’
translation:
  language: sw
  text: Naye akamwambia, “Chukua vyombo hivi, uende ukaviweke katika hekalu lililoko Yerusalemu; na nyumba ya Mungu ijengwe upya mahali pake.”[a]
  philosophy: optimal-equivalence
  footnotes:
