lexical_decisions:
- source_word: וַאֲמַר לֵהּ
  choice: Naye akamwambia
  rationale: Kauli hii inawakilisha kitenzi cha nafsi ya tatu umoja pamoja na kiwakilishi cha mtendewa, kwa Kiswahili cha kawaida na cha masimulizi.
- source_word: אֵלֶּה מָאנַיָּא
  choice: vyombo hivi
  rationale: Katika muktadha huu מָאנַיָּא ni vifaa au vyombo vitakatifu vya hekalu, si vyombo vya kawaida tu; “vyombo” ni neno pana na la kawaida katika Kiswahili.
- source_word: שֵׂא אֵזֶל אֲחֵת הִמּוֹ
  choice: Chukua vyombo hivi, uende ukaviweke
  rationale: Mfuatano huu unahifadhi amri za kuchukua, kwenda na kuweka, huku muundo wa “uende ukaviweke” ukisomeka kwa kawaida katika Kiswahili.
- source_word: בְּהֵיכְלָא דִּי בִירוּשְׁלֶם
  choice: katika hekalu lililoko Yerusalemu
  rationale: הֵיכְלָא hapa humaanisha hekalu kutokana na muktadha wa vyombo vitakatifu na nyumba ya Mungu; kishazi cha uhusiano דִּי kimetafsiriwa wazi.
- source_word: וּבֵית אֱלָהָא
  choice: nayo nyumba ya Mungu
  rationale: Tafsiri hii inahifadhi taswira halisi ya hekalu kuwa “nyumba ya Mungu” na kuunganisha sehemu ya mwisho ya agizo kwa Kiswahili sanifu.
- source_word: יִתְבְּנֵא
  choice: ijengwe upya
  rationale: Umbo hili lina maana ya kutendwa, “ijengwe.” Neno “upya” linaonyesha muktadha wa kurejesha hekalu lililoharibiwa, bila kuficha kwamba kitenzi chenyewe pia kinaweza kutafsiriwa kwa urahisi “ijengwe.”
- source_word: עַל אַתְרֵהּ
  choice: mahali pake
  rationale: אַתְרָא humaanisha mahali au eneo; kiambishi chake kinarejelea nyumba ya Mungu. “Mahali pake” ni tafsiri ya moja kwa moja na ya kawaida.
