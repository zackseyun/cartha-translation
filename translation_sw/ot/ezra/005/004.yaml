  text: 'Ndipo tukawaambia hivi: “Majina ya wanaume wanaojenga jengo hili ni yapi?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa tafsiri ya karibu zaidi na muundo wa Kiaramu: “Ndipo tukasema hivi kwao: ‘Majina ya wanaume wanaojenga jengo hili ni yapi?’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Ndipo
  rationale: Ni kielezi cha wakati na mfuatano wa matukio; “ndipo” kinaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: כְּנֵמָא
  choice: hivi
  rationale: Maana yake ni “hivyo/namna hii”; “hivi” hutambulisha kwa kawaida maneno yanayofuata.
- source_word: אֲמַרְנָא לְּהֹם
  choice: tukawauliza
  rationale: Kitenzi cha Kiaramu kimsingi ni “tulisema kwao,” lakini kwa kuwa maneno yanayofuata ni swali, “tukawauliza” ni Kiswahili cha asili. Maana halisi zaidi imeonyeshwa katika tanbihi.
- source_word: מַן אִנּוּן שְׁמָהָת
  choice: Majina … ni yapi?
  rationale: Muundo huu unauliza majina yenyewe kwa Kiswahili sanifu na kuhifadhi neno “majina” lililo wazi katika Kiaramu.
- source_word: גֻּבְרַיָּא
  choice: watu
  rationale: Katika muktadha huu neno linawarejelea wanaume, lakini “watu” ni usemi wa kawaida wa Kiswahili kwa kundi la wajenzi bila kudai jinsia ambayo Kiswahili si lazima iitaje katika sentensi hii.
- source_word: דִּי
  choice: wanao-
  rationale: Kiambishi cha uhusiano “wanao-” kinaunganisha “watu” na tendo lao kwa kawaida.
- source_word: דְנָה
  choice: hili
  rationale: Kiwakilishi kionyeshi kinapatana na ngeli ya “jengo.”
- source_word: בִנְיָנָא
  choice: jengo
  rationale: Hurejelea kitu kinachojengwa; “jengo” ni neno la kawaida na linafaa katika muktadha.
- source_word: בָּנַיִן
  choice: wanaojenga
  rationale: Umbo la kushiriki linaonyesha tendo linaloendelea; “wanaojenga” linahifadhi hali hiyo bila kuongeza wazo la “kujenga upya.”
