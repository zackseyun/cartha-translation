translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nyumba ya Mungu’ na ‘hekalu’ zimetofautishwa kwa makusudi ili kufuata maneno mawili tofauti ya Kiaramu. Muundo wa amri umehifadhiwa bila kuufanya mzito kupita kiasi.
