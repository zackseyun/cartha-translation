  terminology: “Vyombo,” “nyumba ya Mungu,” “hekalu,” “dhahabu,” na “fedha” ni istilahi za asili, za kawaida, na zenye hadhi inayofaa. Jina “Nebukadneza” ni umbo linalotambulika katika Kiswahili cha Biblia.
