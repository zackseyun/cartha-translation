base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/005.yaml
  text: And also let the gold and silver vessels of the house of God[a], which Nebuchadnezzar took out of the temple that was in Jerusalem and brought to Babylon, be returned and brought to the temple that is in Jerusalem, each to its place; and you shall put them in the house of God.
translation:
  language: sw
  text: Tena, vyombo vya dhahabu na fedha vya nyumba ya Mungu, ambavyo Nebukadneza alivitoa katika hekalu lililoko Yerusalemu na kuvileta Babeli, virudishwe na vipelekwe katika hekalu lililoko Yerusalemu, kila kimoja mahali pake[a]; nawe uviweke katika nyumba ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “virudishwe, navyo viende katika hekalu lililoko Yerusalemu, kila kimoja mahali pake.” Maneno ya Kiaramu katika sehemu hii yana ugumu fulani, lakini maana kuu ni kwamba vyombo vya hekalu virejeshwe mahali pake panapostahili katika Yerusalemu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף
  choice: Tena
  rationale: Inaingiza kipengele kingine cha amri kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: מָאנֵי
  choice: vyombo
  rationale: Ni neno pana linalofaa kwa vifaa au vitu vya hekalu vilivyotumiwa katika ibada.
- source_word: בֵית אֱלָהָא
  choice: nyumba ya Mungu
  rationale: Inahifadhi maana halisi na pia tofauti ya msamiati na הֵיכְלָא, ambalo limetafsiriwa ‘hekalu’.
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: vya dhahabu na fedha
  rationale: Inaonyesha kwa kawaida kwamba vyombo hivyo vilitengenezwa kwa dhahabu na fedha.
- source_word: הַנְפֵּק
  choice: alivitoa
  rationale: Kitenzi kinaonyesha Nebukadneza alisababisha vyombo vitoke hekaluni, yaani aliviondoa humo.
- source_word: הֵיכְלָא
  choice: hekalu
  rationale: Katika muktadha huu ni jengo la hekalu la Yerusalemu, si jumba la mfalme.
- source_word: וְהֵיבֵל
  choice: na kuvileta
  rationale: Inawasilisha tendo la kuvisafirisha hadi Babeli kwa Kiswahili cha kawaida.
- source_word: יַהֲתִיבוּן
  choice: virudishwe
  rationale: Inaonyesha amri ya kuvirejesha vyombo hivyo mahali vilikotoka.
- source_word: וִיהָךְ
  choice: na kupelekwa
  rationale: Hutoa maana ya kuelekea hekaluni ndani ya mfululizo wa amri, huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi, ‘viende’.
- source_word: לְאַתְרֵהּ
  choice: kila kimoja mahali pake
  rationale: Umoja wa ‘mahali pake’ unaeleweka kwa namna ya kugawa kwa kila chombo, jambo linalofanya sentensi iwe wazi kwa Kiswahili.
- source_word: וְתַחֵת
  choice: nawe uviweke
  rationale: Inahifadhi amri iliyoelekezwa moja kwa moja kwa mtu wa pili wa umoja.
