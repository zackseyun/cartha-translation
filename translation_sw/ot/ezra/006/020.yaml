  yaml_path: translation/ot/ezra/006/020.yaml
  text: For the priests and the Levites had purified themselves as one; all of them were clean. And they slaughtered the Passover lamb for all the sons of the exile, and for their brothers the priests, and for themselves.
translation:
  language: sw
  text: Kwa maana makuhani na Walawi walikuwa wamejitakasa kwa pamoja; wote walikuwa safi. Wakachinja mwana-kondoo wa Pasaka kwa ajili ya watu wote wa uhamishoni, kwa ajili ya ndugu zao makuhani, na kwa ajili yao wenyewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְאֶחָד
  choice: kwa pamoja
  rationale: Kirai hiki kinaonyesha kwamba makuhani na Walawi walijitakasa kwa umoja au wote kwa namna ileile. ‘Kwa pamoja’ ni Kiswahili cha kawaida kinachohifadhi wazo la pamoja bila kudokeza kwamba walikuwa mtu mmoja.
- source_word: בְּנֵי הַגּוֹלָה
  choice: watu wote waliorudi kutoka uhamishoni
  rationale: Kwa neno ni ‘wana wa uhamisho,’ lakini katika Ezra ni jina la jumuiya ya waliokuwa uhamishoni na kurudi. Tafsiri hii inawasilisha maana hiyo kwa uwazi katika Kiswahili cha sasa.
- source_word: הַפֶּסַח
  choice: mwana-kondoo wa Pasaka
  rationale: Katika muktadha wa kitenzi ‘wakachinja,’ neno hili linamaanisha mnyama wa dhabihu ya Pasaka, si sikukuu kwa ujumla.
- source_word: טְהוֹרִים
  choice: safi
  rationale: Hapa usafi ni wa kiibada; ‘safi’ ni neno la kawaida la kibiblia, huku muktadha wa kujitakasa ukifafanua aina ya usafi.
theological_decisions:
- issue: Maana ya kujitakasa na kuwa safi
  choice: walikuwa wamejitakasa ... walikuwa safi
  alternative: walikuwa wamejitakasa ... walikuwa safi kiibada
  rationale: Maandishi yenyewe hayana kielezi kinacholingana moja kwa moja na ‘kiibada.’ Muktadha wa makuhani, Walawi, na Pasaka unatosha kuonyesha usafi wa ibada bila kuongeza ufafanuzi ndani ya mstari.
- issue: Mtendaji wa kuchinja Pasaka
  choice: Wakachinja
  alternative: Walawi wakachinja
  rationale: Kiwakilishi cha wingi kinaweza kurejelea makuhani na Walawi waliotajwa pamoja, ingawa muktadha mpana unaweza kuelekeza hasa kwa Walawi. Kutotaja kundi moja pekee kunahifadhi muundo na uwezekano wa rejeo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Muundo umegawanywa katika sentensi mbili ili kudumisha mtiririko wa asili. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zilizohitajika.
