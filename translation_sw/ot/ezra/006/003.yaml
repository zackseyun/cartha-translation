base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/003.yaml
  text: 'In the first year of King Cyrus[a], Cyrus the king issued a decree: Concerning the house of God in Jerusalem, let the house be rebuilt, the place where they offer sacrifices, and let its foundations be laid. Its height shall be sixty cubits, and its width sixty cubits,'
translation:
  language: sw
  text: 'Katika mwaka wa kwanza wa Koreshi mfalme, Koreshi mfalme alitoa amri: “Kuhusu nyumba ya Mungu huko Yerusalemu, nyumba hiyo ijengwe upya kuwa mahali pa kutolea dhabihu, na misingi yake iwekwe[a]. Kimo chake kiwe dhiraa sitini, na upana wake dhiraa sitini,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “misingi yake ihifadhiwe/iinuliwe.” Kifungu cha Kiaramu ni kigumu, na tafsiri hutofautiana; “misingi yake iwekwe” inafaa zaidi katika muktadha wa ujenzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם טְעֵם
  choice: alitoa amri
  rationale: Nahau ya Kiaramu ina maana ya kutangaza rasmi uamuzi wa kifalme; ‘alitoa amri’ ni Kiswahili cha kawaida chenye uzito wa kiutawala.
- source_word: בֵּית אֱלָהָא
  choice: nyumba ya Mungu
  rationale: Tafsiri hii inahifadhi neno halisi ‘nyumba’ na urudiaji wake katika mstari, ingawa kinachorejelewa ni hekalu.
- source_word: יִתְבְּנֵא
  choice: na ijengwe upya
  rationale: Katika muktadha wa amri, kitenzi kina nguvu ya kuagiza. ‘Upya’ huonyesha urejeshaji baada ya kuharibiwa, unaoeleweka kutokana na muktadha wa kihistoria.
- source_word: אֲתַר דִּי דָבְחִין דִּבְחִין
  choice: mahali ambapo wanatoa dhabihu
  rationale: Kiaramu kinatumia kitenzi na nomino zenye mzizi mmoja; Kiswahili hiki cha asili kinahifadhi maana ya mahali pa ibada ya dhabihu bila urudiaji usio wa kawaida.
- source_word: וְאֻשּׁוֹהִי מְסוֹבְלִין
  choice: na misingi yake iwekwe[a]
  rationale: Kifungu hiki ni kigumu kisarufi na kileksika. Katika muktadha wa ujenzi, ‘misingi yake iwekwe’ linafaa, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: רוּמֵהּ
  choice: Kimo chake
  rationale: Neno hili linamaanisha urefu wa kwenda juu; ‘kimo’ ni istilahi ya kawaida na wazi katika maelezo ya jengo.
- source_word: אַמִּין שִׁתִּין
  choice: dhiraa sitini
  rationale: ‘Dhiraa’ huhifadhi kipimo cha kale badala ya kukibadili kuwa kipimo cha kisasa kisicho hakika kabisa.
- source_word: פְּתָיֵהּ
  choice: upana wake
  rationale: ‘Upana’ ni tafsiri ya moja kwa moja na ya kawaida ya kipimo hiki cha jengo.
