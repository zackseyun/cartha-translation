  text: And the sons of the exile kept the Passover on the fourteenth day of the first month[a].
translation:
  language: sw
  text: Nao watu waliokuwa wamehamishwa[a] wakaadhimisha Pasaka siku ya kumi na nne ya mwezi wa kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “wana wa uhamisho”; yaani, jamii ya watu waliokuwa wamehamishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: wakaadhimisha
  rationale: Kitenzi hiki kwa msingi humaanisha ‘kufanya,’ lakini Pasaka ikiwa yambwa wake, maana ya kimuktadha ni kuiadhimisha au kuitunza kama ibada.
- source_word: בְנֵי הַגּוֹלָה
  choice: watu waliokuwa wamehamishwa
  rationale: Huu ni msemo wa pamoja unaoitaja jamii iliyokuwa uhamishoni, si wanaume pekee. Tafsiri hii ni ya kawaida katika Kiswahili na huepuka dhana potofu kwamba ni watoto waliozaliwa uhamishoni.
- source_word: הַפָּסַח
  choice: Pasaka
  rationale: Neno linahusu maadhimisho ya Pasaka kwa upana, bila kulibana kuwa dhabihu au karamu pekee.
- source_word: בְּאַרְבָּעָה עָשָׂר
  choice: siku ya kumi na nne
  rationale: Kiebrania hutumia idadi ‘kumi na nne’ katika fomula ya tarehe; ‘siku ya’ imewekwa wazi kama Kiswahili cha kawaida kinavyohitaji.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: ya mwezi wa kwanza
  rationale: Hukamilisha fomula ya tarehe kwa namna ya asili na iliyo karibu na muundo wa Kiebrania.
