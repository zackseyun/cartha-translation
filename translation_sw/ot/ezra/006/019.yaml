translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa urahisi. ‘Watu waliokuwa wamehamishwa’ limetumiwa badala ya tafsiri ya neno kwa neno ‘wana wa uhamisho,’ ambayo si ya kawaida katika Kiswahili na inaweza kueleweka vibaya.
