  text: And this house was finished by the third day of the month Adar[b][a], which was the sixth year of the reign of King Darius.
translation:
  language: sw
  text: Nyumba hii ilikamilika kufikia siku ya tatu ya mwezi wa Adari[a], katika mwaka wa sita wa utawala wa Mfalme Dario.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku ya tatu ya mwezi wa Adari.” Maneno hayo yanaweza kueleweka kuwa tarehe yenyewe ambayo ujenzi ulikamilika.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁיצִיא
  choice: ikakamilika
  rationale: Kitenzi cha Kiaramu katika muktadha huu kinaonyesha kazi ya ujenzi kufikishwa mwisho. Muundo huu unaweka mkazo kwa nyumba, bila kuongeza watendaji ambao hawakutajwa katika kifungu.
- source_word: בַּיְתָה דְנָה
  choice: nyumba hii
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya Kiaramu. Katika Ezra, “nyumba” humaanisha hekalu, na muktadha unaliweka wazi.
- source_word: עַד יוֹם תְּלָתָה
  choice: kufikia siku ya tatu
  rationale: עַד pamoja na tarehe huonyesha kikomo ambacho kufikia kwake kazi ilikuwa imekamilika. “Kufikia” huhifadhi maana hiyo huku ikiruhusu uwezekano wa kuelewa siku hiyo kuwa tarehe ya kukamilika.
- source_word: לִירַח אֲדָר
  choice: ya mwezi wa Adari
  rationale: Hutoa kwa kawaida katika Kiswahili muundo wa tarehe wa Kiaramu, yaani mwezi unaoitwa Adari.
- source_word: דִּי הִיא
  choice: ambayo ilikuwa
  rationale: Kishazi hiki cha uhusiano huunganisha tarehe iliyotajwa na mwaka wa utawala.
- source_word: שְׁנַת שֵׁת
  choice: mwaka wa sita
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa mwaka wa sita katika hesabu ya utawala.
- source_word: לְמַלְכוּת
  choice: wa utawala wa
  rationale: Katika kanuni hii ya tarehe, neno linahusu kipindi cha kutawala kwa mfalme, si eneo la ufalme.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: Mfalme Dario
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi wazi cheo cha kifalme kilichomo katika Kiaramu.
