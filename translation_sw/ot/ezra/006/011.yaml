id: EZR.6.11
reference: Ezra 6:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל אֱנָ֗שׁ דִּ֤י יְהַשְׁנֵא֙ פִּתְגָמָ֣/א דְנָ֔ה יִתְנְסַ֥ח אָע֙ מִן בַּיְתֵ֔/הּ וּ/זְקִ֖יף יִתְמְחֵ֣א עֲלֹ֑/הִי וּ/בַיְתֵ֛/הּ נְוָל֥וּ יִתְעֲבֵ֖ד עַל דְּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/011.yaml
  text: 'And from me a decree is issued: if any man alters this edict[a], a beam shall be pulled out from his house, and he shall be impaled on it[c][b]; and his house shall be made a refuse heap because of this.'
translation:
  language: sw
  text: '“Nami ninatoa amri hii: Mtu yeyote atakayebadili agizo hili, boriti itang’olewa katika nyumba yake[a], naye atachomwa juu yake[b]. Kisha nyumba yake itafanywa kuwa lundo la takataka[c] kwa sababu ya kosa hilo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mbao itang’olewa katika nyumba yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “atundikwe juu yake.”
    reason: alternative_reading
  - marker: c
    text: Kwa mapokeo, “lundo la samadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים טְעֵם
  choice: ninatoa amri hii
  rationale: Nahau hii ya kiutawala ina maana ya kuweka au kutoa amri rasmi. Kauli hii ni ya kawaida katika Kiswahili na inadumisha mamlaka ya kifalme ya tamko hilo.
- source_word: יְהַשְׁנֵא
  choice: atakayebadili
  rationale: Kitenzi hiki hapa kinamaanisha kubadili au kuingilia tamko rasmi, si kutolatii tu.
- source_word: פִּתְגָמָא דְנָה
  choice: agizo hili
  rationale: Neno la Kiaramu linaashiria tamko au agizo rasmi. ‘Agizo’ linaeleweka kwa urahisi na linafaa katika muktadha wa utawala.
- source_word: יִתְנְסַח אָע מִן בַּיְתֵהּ
  choice: boriti itang’olewa katika nyumba yake
  rationale: Tafsiri hii inahifadhi kwa uwazi kitendo cha kuondoa kipande cha mbao cha ujenzi kutoka katika nyumba ya mkosaji.
- source_word: וּזְקִיף יִתְמְחֵא עֲלֹהִי
  choice: naye atachomwa juu yake
  rationale: Kauli hii inaelekea kueleza adhabu ya kumchoma mtu kwa boriti au mti uliosimamishwa. ‘Atachomwa’ inadumisha ukali na mazingira ya kale bila kudokeza mahsusi kitanzi cha kunyonga.
- source_word: נְוָלוּ
  choice: lundo la takataka
  rationale: Neno hili linaonyesha mahali pachafu na pa aibu, au magofu yaliyofanywa lundo la uchafu. ‘Lundo la takataka’ ni Kiswahili cha sasa na kinadumisha fedheha inayokusudiwa.
- source_word: יִתְעֲבֵד
  choice: itafanywa kuwa
  rationale: 'Muundo wa kutendwa unafaa kwa tamko la adhabu: nyumba itageuzwa kwa makusudi kuwa lundo la takataka.'
- source_word: כָל אֱנָשׁ
  choice: mtu yeyote
  rationale: Ingawa umbo la chanzo ni la umoja, ‘mtu yeyote’ linawasilisha maana yake ya jumla kwa Kiswahili cha kawaida bila kupunguza upeo wa amri.
- source_word: עַל דְנָה
  choice: kwa sababu ya kosa hilo
  rationale: Kirai hiki kihalisi ni ‘kwa sababu ya hili.’ Kutaja ‘kosa’ kunabainisha kwa kawaida kuwa kinachorejelewa ni kubadili agizo, bila kubadili mantiki ya adhabu.
theological_decisions:
- issue: Aina ya adhabu inayotajwa katika lugha ya sheria ya kifalme
  choice: atachomwa juu yake
  alternative: atundikwe juu yake
  rationale: Maneno ya Kiaramu yanaelekea kuonyesha mtu akiinuliwa na kuwekwa au kuchomwa kwenye boriti iliyotolewa nyumbani kwake. Tafsiri kuu inadumisha uwezekano wa kuchomwa kwa mti, huku tafsiri ya jadi ya kutundikwa ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo rasmi na wenye hadhi unaofaa amri ya kifalme, lakini msamiati unabaki wazi kwa msomaji wa kawaida. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
