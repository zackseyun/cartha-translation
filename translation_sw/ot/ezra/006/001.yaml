  text: Then King Darius issued a decree[a], and they searched in the house of the archives, where the treasures were stored[c][b], there in Babylon.
translation:
  language: sw
  text: Ndipo Mfalme Dario akatoa amri, wakatafuta katika nyumba ya nyaraka[a], ambamo hazina zilikuwa zimehifadhiwa[b], huko Babeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kihalisi, “nyumba ya vitabu/nyaraka,” yaani mahali rasmi pa kuhifadhi kumbukumbu. Kitenzi “wakatafuta” kinaweza pia kueleweka bila kutaja watendaji: “utafutaji ulifanywa.”'
    reason: lexical_alternative
  - marker: b
    text: “Hazina” hapa inaweza pia kumaanisha kwa upana vitu vya thamani au vitu vingine vilivyowekwa akiba katika nyumba hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Ndipo
  rationale: Kiashiria hiki cha mfululizo wa simulizi kinaonyesha tukio lililofuata; “Ndipo” ni cha kawaida na huhifadhi mwendelezo huo.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: Mfalme Dario
  rationale: Mpangilio huu ni wa asili katika Kiswahili, huku jina la mfalme likinakiliwa kwa namna iliyozoeleka.
- source_word: שָׂם טְעֵם
  choice: akatoa amri
  rationale: Kirai hiki kihalisi kina maana ya ‘kuweka amri’; “akatoa amri” ni Kiswahili cha kawaida katika muktadha wa utawala wa kifalme.
- source_word: וּבַקַּרוּ
  choice: nao wakatafuta
  rationale: Kitenzi cha Kiaramu kiko katika nafsi ya tatu wingi, ingawa watendaji hawatajwi; tafsiri hai inahifadhi umbo hilo.
- source_word: בְּבֵית סִפְרַיָּא
  choice: katika jumba la nyaraka
  rationale: Kihalisi ni ‘nyumba ya vitabu/nyaraka,’ yaani mahali rasmi pa kuhifadhi kumbukumbu; “jumba la nyaraka” ni wazi na hudumisha taswira ya mahali.
- source_word: דִּי
  choice: mahali
  rationale: Kiunganishi hiki hapa kina maana ya mahali na kinaunganisha jumba la nyaraka na hazina zilizowekwa humo.
- source_word: גִנְזַיָּא
  choice: hazina
  rationale: Neno linaweza kumaanisha hazina, vitu vya thamani, au vitu vilivyowekwa akiba; “hazina” huhifadhi upana huo bila kulibana kuwa nyaraka pekee.
- source_word: מְהַחֲתִין
  choice: zilipokuwa zimewekwa
  rationale: Umbo hili linaeleza hali ya vitu vilivyokuwa vimewekwa au kuhifadhiwa mahali hapo.
- source_word: תַּמָּה
  choice: huko
  rationale: Kielezi cha mahali kimehifadhiwa ili kuonyesha msisitizo uliopo katika matini chanzi.
- source_word: בְּבָבֶל
  choice: Babeli
  rationale: Hili ni umbo la kawaida la jina la mahali katika Kiswahili cha Biblia.
