  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘wana wa uhamisho’ umehifadhiwa katika matini ili kuakisi chanzo, huku tanbihi ikitoa usemi wa kawaida zaidi.
