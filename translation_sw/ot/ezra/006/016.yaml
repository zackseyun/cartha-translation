base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/016.yaml
  text: And the sons of Israel[a], the priests, the Levites, and the rest of the sons of the exile celebrated the dedication of this house of God with joy.
translation:
  language: sw
  text: Nao wana wa Israeli, makuhani, Walawi, na wana wengine wa uhamisho[a] wakaadhimisha kuwekwa wakfu kwa nyumba hii ya Mungu kwa furaha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa usemi laini zaidi, “na wahamishwa wengine.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדוּ
  choice: wakaadhimisha
  rationale: Katika muktadha huu wa Kiaramu, kitenzi kina maana ya kutekeleza au kuadhimisha tukio la sherehe; pamoja na nomino ‘kuwekwa wakfu,’ ‘wakaadhimisha’ ni Kiswahili cha kawaida na sahihi.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi muundo wa chanzo na mtindo wa orodha huku ikiwa inaeleweka katika Kiswahili cha kibiblia.
- source_word: כָּהֲנַיָּא
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa tabaka la kikuhani.
- source_word: וְלֵוָיֵא
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa Walawi waliokuwa na huduma hekaluni.
- source_word: וּשְׁאָר בְּנֵי גָלוּתָא
  choice: na wengine wa wana wa uhamisho
  rationale: Huhifadhi kwa ukaribu usemi halisi ‘wana wa uhamisho’ na kuonyesha watu wengine wa jumuiya hiyo zaidi ya makuhani na Walawi; usemi laini zaidi umetolewa katika tanbihi.
- source_word: חֲנֻכַּת
  choice: kuwekwa wakfu
  rationale: Nomino hii humaanisha tendo au sherehe ya kuweka nyumba au madhabahu wakfu; usemi huu ni wa kawaida na wazi kwa Kiswahili.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: nyumba hii ya Mungu
  rationale: Ni tafsiri ya karibu ya chanzo. ‘Hekalu’ ingekuwa ufafanuzi zaidi kuliko neno la Kiaramu ‘nyumba.’
- source_word: בְּחֶדְוָה
  choice: kwa furaha
  rationale: Hutoa kwa kawaida maana ya kihusishi pamoja na nomino katika Kiswahili.
