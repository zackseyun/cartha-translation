base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/002.yaml
  text: 'And in Ecbatana[a], the fortress that is in the province of Media, a scroll was found[c][b], and this was written in it as a record:'
translation:
  language: sw
  text: 'Na huko Ekbatana[a], katika ngome[b] iliyoko katika jimbo la Umedi, hati-kunjo moja ilipatikana, na ndani yake kuliandikwa hivi: Kumbukumbu[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Akmetha,” umbo linalokaribia zaidi jina la Kiaramu la Ekbatana.
    reason: lexical_alternative
  - marker: b
    text: Au “ngome kuu.” Neno la Kiaramu linaweza kumaanisha ngome au makao ya kifalme/kiutawala yaliyoimarishwa.
    reason: lexical_alternative
  - marker: c
    text: Au “waraka wa kumbukumbu.” Neno hili linamaanisha kumbukumbu rasmi iliyoandikwa au taarifa iliyohifadhiwa katika nyaraka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁתְּכַח
  choice: ilipatikana
  rationale: Huhifadhi maana ya kutendwa ya kitenzi cha Kiaramu, ‘kupatikana,’ na inafaa katika muktadha wa kutafuta nyaraka.
- source_word: אַחְמְתָא
  choice: Ekbatana
  rationale: Hili ni umbo la kihistoria linalotambulika kwa mji mkuu wa Umedi; umbo la Kiaramu ‘Akmetha’ limetajwa katika tanbihi.
- source_word: בִּירְתָא
  choice: ngome
  rationale: Neno hilo humaanisha jengo au eneo la kifalme au kiutawala lililoimarishwa; ‘ngome’ ni neno la kawaida na pana katika Kiswahili.
- source_word: דִּי בְּמָדַי מְדִינְתָּה
  choice: iliyoko katika jimbo la Umedi
  rationale: Huwakilisha wazi kishazi tegemezi pamoja na jina la eneo la kiutawala.
- source_word: מְגִלָּה חֲדָה
  choice: hati-kunjo moja
  rationale: ‘Hati-kunjo’ huonyesha hati iliyokunjwa, na ‘moja’ huhifadhi neno la Kiaramu bila kulitia mkazo usio wa lazima.
- source_word: וְכֵן כְּתִיב
  choice: yaliandikwa maneno haya
  rationale: Kauli hii hutanguliza yaliyomo katika kumbukumbu; Kiswahili cha asili kinahitaji kutaja ‘maneno’ ili upatanisho na ‘haya’ uwe wazi.
- source_word: בְּגַוַּהּ
  choice: ndani yake
  rationale: Hutoa kwa kawaida rejeo la mahali ndani ya hati-kunjo.
- source_word: דִּכְרוֹנָה
  choice: kama kumbukumbu
  rationale: Katika muktadha wa kiutawala, neno hili linaashiria kumbukumbu rasmi au waraka wa kuhifadhi taarifa.
