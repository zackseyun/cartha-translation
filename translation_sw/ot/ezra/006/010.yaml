  text: ili watoe matoleo yenye harufu ya kupendeza[a] kwa Mungu wa mbinguni, na waombe kwa ajili ya maisha ya mfalme na wanawe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matoleo yenye harufu tamu” au “matoleo yenye harufu ya kutuliza.” Neno la Kiaramu linahusu harufu ya kupendeza ya dhabihu zinazokubalika.
