lexical_decisions:
- source_word: דִּי
  choice: ili
  rationale: Katika muktadha huu chembe hii inaonyesha kusudi la mahitaji yaliyotolewa kwa amri ya mfalme.
- source_word: לֶהֱוֺן מְהַקְרְבִין
  choice: watoe
  rationale: Muundo huu unaonyesha kusudi au uwezekano, na kitenzi קרב katika muktadha wa ibada humaanisha kutoa au kuwasilisha matoleo.
- source_word: נִיחוֹחִין
  choice: matoleo yenye harufu ya kupendeza
  rationale: Usemi huu unahusu harufu ya kupendeza ya matoleo yanayokubalika. Tafsiri hii huhifadhi picha ya harufu na pia hufanya Kiswahili kiwe cha asili kuliko kusema kwamba mtu 'anatoa harufu'.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: kwa Mungu wa mbinguni
  rationale: Kihusishi kinaonyesha anayepokea matoleo; 'Mungu wa mbinguni' huhifadhi cheo cha Mungu kinachotumiwa katika Ezra.
- source_word: וּמְצַלַּיִן
  choice: na waombe
  rationale: Kitenzi kinamaanisha kusali au kuomba, na hapa kinaendeleza kusudi la amri.
- source_word: לְחַיֵּי
  choice: kwa ajili ya uhai wa
  rationale: Hii hufuata maana halisi ya 'uhai' huku ikiacha wazi kwamba ombi linaweza kuhusisha kuhifadhiwa na ustawi.
- source_word: מַלְכָּא
  choice: mfalme
  rationale: Neno la Kiaramu ni neno la kawaida kwa mfalme, hata ingawa anayerejelewa ni mtawala wa Uajemi.
- source_word: וּבְנוֹהִי
  choice: na wanawe
  rationale: Neno la asili linawataja wana wa kiume hasa; 'wanawe' huhifadhi umahususi huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Usemi wa kiibada נִיחוֹחִין katika amri ya kifalme kuhusu matoleo ya Hekalu
  choice: matoleo yenye harufu ya kupendeza
  alternative: harufu za kupendeza; dhabihu zinazokubalika
  rationale: Chaguo hili huhifadhi taswira ya harufu ya matoleo yanayompendeza Mungu bila kuibadili kuwa istilahi ya kiteolojia isiyokuwamo katika maandishi.
- issue: Maana ya לְחַיֵּי katika ombi kwa ajili ya mfalme
  choice: kwa ajili ya uhai wa mfalme
  alternative: kwa ajili ya ustawi wa mfalme
  rationale: Tafsiri ya msingi ni 'uhai'; maana pana ya ustawi inawezekana na imewekwa katika tanbihi badala ya kuondoa utata huo katika maandishi.
- issue: Neno la kifamilia la kiume kuhusu uzao wa mfalme
  choice: wanawe
  alternative: watoto wake
  rationale: Kiaramu kinataja wana wa kiume, kwa hiyo tafsiri haipanui maana kuwa watoto wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inaendeleza muundo wa kusudi wa muktadha. 'Matoleo yenye harufu ya kupendeza' huleta ufasaha wa kawaida huku ikihifadhi taswira ya ibada ya maandishi ya Kiaramu.
