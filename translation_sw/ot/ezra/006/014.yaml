  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/שָׂבֵ֤י יְהוּדָיֵ/א֙ בָּנַ֣יִן וּ/מַצְלְחִ֔ין בִּ/נְבוּאַת֙ חַגַּ֣י נביא/ה וּ/זְכַרְיָ֖ה בַּר עִדּ֑וֹא וּ/בְנ֣וֹ וְ/שַׁכְלִ֗לוּ מִן טַ֨עַם֙ אֱלָ֣הּ יִשְׂרָאֵ֔ל וּ/מִ/טְּעֵם֙ כּ֣וֹרֶשׁ וְ/דָרְיָ֔וֶשׁ וְ/אַרְתַּחְשַׁ֖שְׂתְּא מֶ֥לֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/014.yaml
  text: And the elders of the Jews were building and prospering through the prophecy of Haggai the prophet and Zechariah son of Iddo[c][b][a]. They finished building by the decree of the God of Israel and by the decree of Cyrus and Darius and Artaxerxes king of Persia.
translation:
  language: sw
  text: Nao wazee wa Wayahudi walikuwa wakijenga na kufanikiwa[a] kwa njia ya unabii wa Hagai nabii na Zekaria mwana wa Ido. Wakajenga na kukamilisha kazi hiyo kwa amri[b] ya Mungu wa Israeli na kwa amri ya Koreshi, Dario na Artashasta, mfalme wa Uajemi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na kufanya maendeleo.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa agizo la.”
    reason: lexical_alternative
  - marker: c
    text: Mstari huu unahusisha kukamilika kwa kazi hiyo na amri ya Mungu pamoja na amri za wafalme wa Uajemi, huku amri ya Mungu ikitajwa kwanza.
    reason: theological_clarification
lexical_decisions:
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: wazee wa Wayahudi
  rationale: Hutaja viongozi wazee wa jumuiya ya Wayahudi; tafsiri hii inahifadhi cheo chao na utambulisho wao bila kuifanya kuwa rejeo la kijiografia pekee.
- source_word: בָּנַיִן
  choice: waliendelea kujenga
  rationale: Hali ya kushiriki inaonyesha tendo lililokuwa likiendelea. ‘Waliendelea kujenga’ ni Kiswahili cha kawaida kinachoonyesha mwendelezo huo bila kuongeza wazo la ‘kujenga upya’ lisilotajwa moja kwa moja katika kitenzi.
- source_word: וּמַצְלְחִין
  choice: na kufanikiwa
  rationale: Kitenzi kina maana ya kufanikiwa au kufanya maendeleo; ‘kufanikiwa’ huhifadhi maana pana huku tanbihi ikionyesha uwezekano mwingine.
- source_word: בִּנְבוּאַת
  choice: kwa njia ya unabii wa
  rationale: 'Kihusishi kinaonyesha njia au chombo: huduma ya kinabii ya Hagai na Zekaria ndiyo njia ambayo kazi yao ilitiwa nguvu na kufanikiwa.'
- source_word: חַגַּי נביאה
  choice: Hagai nabii
  rationale: Ni uwasilishaji wa kawaida wa jina likifuatiwa na cheo katika Kiswahili.
- source_word: וּזְכַרְיָה בַּר עִדּוֹא
  choice: na Zekaria mwana wa Ido
  rationale: Neno la Kiaramu בַּר ni alama ya kawaida ya uhusiano wa mwana; ‘mwana wa Ido’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: וּבְנוֹ וְשַׁכְלִלוּ
  choice: Wakajenga na kukamilisha kazi hiyo
  rationale: Vitenzi viwili vinaonyesha kujenga na kuleta kazi kwenye ukamilifu. ‘Kazi hiyo’ hurejelea kwa kawaida kazi ya ujenzi iliyotajwa, bila kulazimika kuongeza ‘hekalu’ katika mstari huu.
- source_word: מִן טַעַם
  choice: kwa amri ya
  rationale: Katika Kiaramu cha kifalme, kirai hiki huonyesha amri, agizo au uamuzi wenye mamlaka. ‘Kwa amri ya’ kinafaa kwa Mungu na kwa wafalme na huhifadhi muundo unaorudiwa.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya moja kwa moja ya jina hili la Mungu.
- source_word: כּוֹרֶשׁ וְדָרְיָוֶשׁ וְאַרְתַּחְשַׁשְׂתְּא
  choice: Koreshi, Dario na Artashasta
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia, huku orodha ya wafalme watatu ikihifadhiwa.
- source_word: מֶלֶךְ פָּרָס
  choice: mfalme wa Uajemi
  rationale: Cheo cha umoja kinafuata jina la mwisho katika sarufi ya mstari; tafsiri haikibadili kimyakimya kuwa wingi.
theological_decisions:
- issue: Uhusiano kati ya mamlaka ya Mungu na mamlaka ya kifalme
  choice: Kukamilika kwa kazi kunahusishwa na amri ya Mungu wa Israeli na pia na amri za wafalme wa Uajemi, huku amri ya Mungu ikitajwa kwanza.
  alternative: Kueleza amri za kifalme kuwa utekelezaji wa amri ya Mungu pekee.
  rationale: Mstari wenyewe unataja pande zote mbili bila kueleza moja kuwa ufafanuzi tu wa nyingine. Tafsiri inahifadhi mvutano huo wa kitheolojia bila kuongeza hitimisho lisilotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa simulizi ‘Nao… Wakajenga’ ni wa asili katika usomaji wa Biblia. ‘Uajemi’ limetumiwa badala ya ‘Persia’ kwa kuwa ndilo jina la Kiswahili lililozoeleka.
