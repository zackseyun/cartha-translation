source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ לְ/מָ֣א דִֽי תַֽעַבְד֗וּן עִם שָׂבֵ֤י יְהוּדָיֵ/א֙ אִלֵּ֔ךְ לְ/מִבְנֵ֖א בֵּית אֱלָהָ֣/א דֵ֑ךְ וּ/מִ/נִּכְסֵ֣י מַלְכָּ֗/א דִּ֚י מִדַּת֙ עֲבַ֣ר נַהֲרָ֔/ה אָסְפַּ֗רְנָא נִפְקְתָ֛/א תֶּהֱוֵ֧א מִֽתְיַהֲבָ֛א לְ/גֻבְרַיָּ֥/א אִלֵּ֖ךְ דִּי לָ֥א לְ/בַטָּלָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/008.yaml
  text: 'Moreover, I issue a decree concerning what you are to do for these Jewish elders as they rebuild this house of God: Their expenses are to be paid promptly from the royal revenues—the tribute collected in Beyond the River[a]—so that the work is not interrupted.'
translation:
  language: sw
  text: 'Zaidi ya hayo, ninatoa amri kuhusu mnachopaswa kuwafanyia wazee hawa Wayahudi wanapoijenga upya nyumba hii ya Mungu: Gharama zao zilipwe mara moja kutokana na mapato ya mfalme—kodi inayokusanywa katika Ng’ambo ya Mto[a]—ili kazi isisitishwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ng’ambo ya Mto” lilikuwa jina la kiutawala la Uajemi kwa maeneo yaliyokuwa magharibi mwa Mto Eufrate.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: Zaidi ya hayo, ninatoa amri
  rationale: Nahau hii ya Kiaramu huonyesha kuwekwa kwa uamuzi rasmi. Kauli tendaji inamhifadhi mfalme kama msemaji na kuonyesha nguvu ya kiutawala ya amri.
- source_word: שָׂבֵי יְהוּדָיֵא אִלֵּךְ
  choice: wazee hawa wa Kiyahudi
  rationale: Kirai hiki kinawatambulisha viongozi wazee wa jumuiya ya Wayahudi; tafsiri hii ni fupi na ya kawaida katika Kiswahili.
- source_word: לְמִבְנֵא בֵּית אֱלָהָא דֵךְ
  choice: wanapoijenga upya nyumba hii ya Mungu
  rationale: דֵךְ ni kiashiria ‘hii,’ si kimilikishi ‘wenu.’ Muktadha wa Ezra unaonyesha kuwa kazi ilikuwa kujenga upya.
- source_word: מִנִּכְסֵי מַלְכָּא דִּי מִדַּת עֲבַר נַהֲרָה
  choice: kutokana na mapato ya mfalme—kodi inayokusanywa katika Ng’ambo ya Mto
  rationale: מִדַּת humaanisha kodi au ushuru, si jimbo. Kodi ya eneo la ng’ambo ya Eufrate ndiyo chanzo cha fedha za kifalme.
- source_word: אָסְפַּרְנָא
  choice: mara moja
  rationale: Neno hili la kiutawala linasisitiza utekelezaji wa haraka na makini; katika muktadha wa malipo, ‘mara moja’ huwasilisha wazi dhana ya kutochelewesha.
- source_word: נִפְקְתָא תֶּהֱוֵא מִתְיַהֲבָא לְגֻבְרַיָּא אִלֵּךְ
  choice: Gharama zao zilipwe
  rationale: Muundo wa kutendwa unaagiza kwamba gharama za mradi zipatiwe watu hawa; kiwakilishi kinaepusha urudiaji usio wa lazima.
- source_word: דִּי לָא לְבַטָּלָא
  choice: ili kazi isisitishwe
  rationale: Kifungu cha kusudi kinazuia kusimama kwa kazi. Kutaja ‘kazi’ kunaweka wazi yambwa inayodokezwa na muktadha bila kumpa kitenzi mhusika wa wingi asiyeelezwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa amri ya kifalme lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Nyumba ya Mungu’ imehifadhiwa badala ya ‘hekalu’ ili kufuata istilahi ya chanzo, na ‘hii’ imehifadhi nguvu ya kiashiria.
