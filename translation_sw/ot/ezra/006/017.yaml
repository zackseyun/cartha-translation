  text: וְ/הַקְרִ֗בוּ לַ/חֲנֻכַּת֮ בֵּית אֱלָהָ֣/א דְנָה֒ תּוֹרִ֣ין מְאָ֔ה דִּכְרִ֣ין מָאתַ֔יִן אִמְּרִ֖ין אַרְבַּ֣ע מְאָ֑ה וּ/צְפִירֵ֨י עִזִּ֜ין ל/חטיא עַל כָּל יִשְׂרָאֵל֙ תְּרֵֽי עֲשַׂ֔ר לְ/מִנְיָ֖ן שִׁבְטֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/017.yaml
  text: And they offered for the dedication of this house of God one hundred bulls[a], two hundred rams, four hundred lambs, and twelve male goats as a sin offering for all Israel[b], according to the number of the tribes of Israel.
translation:
  language: sw
  text: Nao wakatoa kwa ajili ya kuwekwa wakfu kwa nyumba hii ya Mungu mafahali mia moja, kondoo dume mia mbili, wanakondoo mia nne, na mbuzi dume kumi na wawili kuwa sadaka ya dhambi kwa ajili ya Israeli yote[a], kulingana na idadi ya makabila ya Israeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa niaba ya Israeli yote.”
    reason: lexical_alternative
  - marker: b
    text: Mbuzi dume kumi na wawili walilingana na makabila kumi na mawili ya Israeli, wakionyesha kwamba sadaka hiyo ilihusu Israeli yote.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַקְרִבוּ
  choice: Nao wakatoa
  rationale: Kitenzi cha Kiaramu katika muktadha wa dhabihu humaanisha kuwasilisha au kutoa wanyama kama sadaka; “wakatoa” ni Kiswahili cha kawaida na kinachofaa hapa.
- source_word: לַחֲנֻכַּת
  choice: kwa ajili ya kuwekwa wakfu
  rationale: Neno hilo humaanisha uzinduzi au uwekaji wakfu. Kauli hii inaonyesha kusudi la sherehe kwa lugha ya kawaida ya Kiswahili.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: kwa nyumba hii ya Mungu
  rationale: “Nyumba ya Mungu” huhifadhi taswira halisi ya chanzo bila kubadili moja kwa moja kuwa “hekalu.”
- source_word: תּוֹרִין
  choice: mafahali
  rationale: Katika orodha ya dhabihu neno hili linarejelea ng'ombe dume; “mafahali” ni wazi na la kawaida.
- source_word: דִּכְרִין
  choice: kondoo dume
  rationale: Neno la Kiaramu humaanisha kondoo wa kiume; Kiswahili hutumia kwa kawaida “kondoo dume.”
- source_word: אִמְּרִין
  choice: wanakondoo
  rationale: Neno hili humaanisha kondoo wachanga; “wanakondoo” linafaa katika orodha ya wanyama wa dhabihu.
- source_word: וּצְפִירֵי עִזִּין
  choice: mbuzi dume
  rationale: Kirai hiki kinabainisha mbuzi wa kiume; tafsiri hii ni ya moja kwa moja na ya asili.
- source_word: לחטיא
  choice: kuwa sadaka ya dhambi
  rationale: Hili ni neno la kiibada linalohusiana na sadaka ya dhambi au utakaso; “sadaka ya dhambi” huhifadhi istilahi ya chanzo bila kuifafanua kupita kiasi.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: kwa ajili ya Israeli yote
  rationale: Kihusishi kinaonyesha manufaa au uwakilishi. Kauli hii huhifadhi upeo wa jumuiya yote na pia utata mdogo wa uhusiano huo.
- source_word: תְּרֵי עֲשַׂר
  choice: kumi na wawili
  rationale: Hii ni tafsiri ya moja kwa moja ya namba, ikipatana kisarufi na “mbuzi dume.”
- source_word: לְמִנְיָן שִׁבְטֵי יִשְׂרָאֵל
  choice: kulingana na idadi ya makabila ya Israeli
  rationale: Kirai kinaeleza kwa nini mbuzi walikuwa kumi na wawili; tafsiri hii huhifadhi nguvu hiyo ya ufafanuzi.
theological_decisions:
- issue: Upeo wa “Israeli yote” baada ya uhamisho
  choice: kwa ajili ya Israeli yote
  alternative: kwa ajili ya wahamiaji waliorudi pekee; kwa niaba ya watu wote wa agano
  rationale: Chanzo kinasema wazi “Israeli yote” na kukihusisha na idadi ya makabila kumi na mawili. Tafsiri haipunguzi upeo huo wala kuamua kwa niaba ya msomaji namna uwakilishi huo unavyopaswa kufasiriwa.
- issue: Tabia ya sadaka iliyotolewa kwa mbuzi kumi na wawili
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno la chanzo linaweza kuhusishwa na dhambi na utakaso. “Sadaka ya dhambi” ni istilahi inayoeleweka na huhifadhi muundo wa kiibada bila kuongeza maelezo ya kiteolojia katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umefanywa kuwa wa kawaida kwa Kiswahili huku mpangilio wa orodha na uhusiano wa mbuzi kumi na wawili na sadaka ya dhambi vikihifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
