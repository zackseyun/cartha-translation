  text: וּ/מָ֣ה חַשְׁחָ֡ן וּ/בְנֵ֣י תוֹרִ֣ין וְ/דִכְרִ֣ין וְ/אִמְּרִ֣ין לַ/עֲלָוָ֣ן לֶ/אֱלָ֪הּ שְׁמַיָּ֟/א חִנְטִ֞ין מְלַ֣ח חֲמַ֣ר וּ/מְשַׁ֗ח כְּ/מֵאמַ֨ר כָּהֲנַיָּ֤/א דִי בִ/ירֽוּשְׁלֶם֙ לֶהֱוֵ֨א מִתְיְהֵ֥ב לְ/הֹ֛ם י֥וֹם בְּ/י֖וֹם דִּי לָ֥א שָׁלֽוּ׀׀׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/009.yaml
  text: And whatever is needed—young bulls[a], rams, and lambs for burnt offerings to the God of heaven, wheat, salt, wine, and oil, according to the word of the priests who are in Jerusalem—let it be given to them day by day without fail[b],
translation:
  language: sw
  text: Na chochote kinachohitajika—mafahali wachanga, kondoo dume, na wanakondoo kwa ajili ya sadaka za kuteketezwa kwa Mungu wa mbinguni, ngano, chumvi, divai, na mafuta—kulingana na neno la makuhani walioko Yerusalemu[a], wapewe siku baada ya siku bila kukosa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kulingana na maagizo ya makuhani walioko Yerusalemu.” Kifungu cha Kiaramu ni, kihalisi, “kulingana na neno la makuhani.”
    reason: lexical_alternative
  - marker: b
    text: Au “pasitokee upungufu wowote” au “bila kukatizwa.” Kifungu cha mwisho kinasisitiza kwamba mahitaji ya kila siku yasiache kutolewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה חַשְׁחָן
  choice: chochote kinachohitajika
  rationale: Huunganisha kiwakilishi kisichoainisha na wazo la uhitaji katika Kiswahili cha kawaida, huku ikidumisha upana wa mahitaji yanayofuata.
- source_word: בְנֵי תוֹרִין
  choice: mafahali wachanga
  rationale: Nahau ya Kiaramu, kihalisi ‘wana wa ng’ombe’, humaanisha mafahali wachanga wanaofaa kutolewa dhabihu.
- source_word: דִכְרִין
  choice: kondoo dume
  rationale: Hili ndilo neno la kawaida na sahihi kwa kondoo wa kiume katika orodha ya dhabihu.
- source_word: אִמְּרִין
  choice: wanakondoo
  rationale: Hutaja kondoo wadogo na linafaa katika muktadha wa dhabihu.
- source_word: לַעֲלָוָן
  choice: kwa ajili ya sadaka za kuteketezwa
  rationale: Hili ni neno linaloeleweka kwa aina ya sadaka inayoteketezwa kabisa, likihifadhi maana ya kiibada ya chanzo.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: kwa Mungu wa mbinguni
  rationale: Huhifadhi cheo cha kawaida katika Kiaramu cha Ezra na huingia kwa kawaida katika muktadha wa sadaka.
- source_word: חִנְטִין
  choice: ngano
  rationale: Neno la chanzo hutaja ngano hasa, si nafaka kwa ujumla.
- source_word: מְלַח חֲמַר וּמְשַׁח
  choice: chumvi, divai, na mafuta
  rationale: Visawe vya moja kwa moja na vya kawaida; ‘mafuta’ hayabanwi kuwa mafuta ya zeituni kwa kuwa chanzo hakisemi hivyo wazi.
- source_word: כְּמֵאמַר
  choice: kulingana na neno
  rationale: Huhifadhi usemi wa karibu na halisi ‘kulingana na neno’, ambao katika muktadha huu unaweza pia kumaanisha maagizo yenye mamlaka.
- source_word: יֹום בְּיֹום
  choice: siku baada ya siku
  rationale: Nahau ya asili inasisitiza utoaji wa kila siku; Kiswahili hiki ni cha kawaida na wazi.
- source_word: דִי לָא שָׁלוּ
  choice: bila kukosa
  rationale: Hutoa kwa ufupi msisitizo kwamba utoaji wa kila siku usiache kufanyika, huku tanbihi ikihifadhi uwezekano wa maana ya kutokuwapo kwa upungufu au katizo.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mistari mirefu iliyotenganishwa kwa vistari virefu inadumisha muundo wa orodha ya amri ya kiutawala. Alama za tanbihi zimewekwa pale zinapohusu moja kwa moja: [a] baada ya ‘Yerusalemu’ kwa כְּמֵאמַר, na [b] baada ya ‘bila kukosa’ kwa kifungu cha mwisho.'
