base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/012.yaml
  text: And may the God who has caused his name to dwell there overthrow any king or people who stretches out his hand to alter this[a], to destroy this house of God that is in Jerusalem. I, Darius, have issued a decree[b]; let it be done with all diligence.
translation:
  language: sw
  text: Mungu ambaye amefanya jina lake likae huko aangushe mfalme yeyote atakayonyosha mkono wake kubadili hili, au taifa lolote litakalonyosha mkono wake kubadili hili na kuharibu nyumba hii ya Mungu iliyoko Yerusalemu. Mimi, Dario, nimetoa amri hii; na itekelezwe kwa bidii yote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa haraka.” Neno la Kiaramu linaweza kusisitiza utekelezaji wa haraka; “kwa bidii yote” pia huonyesha umakini katika kutii amri.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁכִּן שְׁמֵהּ תַּמָּה
  choice: amelikalisha jina lake huko
  rationale: Inahifadhi kauli ya Kiaramu ya Mungu kulifanya jina lake likae mahali hapo, huku ikiwa Kiswahili cha kawaida na bila kumaanisha kwamba Mungu amefungiwa katika hekalu.
- source_word: יְמַגַּר
  choice: amwangushe
  rationale: Kitenzi kinaonyesha kuangusha au kupindua kwa hukumu, jambo linalofaa katika laana hii ya kifalme.
- source_word: כָּל מֶלֶךְ וְעַם
  choice: mfalme au taifa lolote
  rationale: Hutoa maana jumuishi ya yeyote—mfalme au jamii ya watu—atakayekiuka amri.
- source_word: יִשְׁלַח יְדֵהּ
  choice: litakalonyosha mkono wake
  rationale: Inadumisha sitiari ya Kisemiti ya kuchukua hatua dhidi ya kitu.
- source_word: לְהַשְׁנָיָה
  choice: ili kubadili jambo hili
  rationale: Inaonyesha kubadili agizo au mpango uliowekwa katika muktadha wa kisheria na kiutawala.
- source_word: לְחַבָּלָה בֵּית אֱלָהָא
  choice: yaani kuiharibu nyumba hii ya Mungu
  rationale: Kitenzi kina nguvu ya kuharibu au kuangamiza; muundo unahifadhi uhusiano wa kubadili jambo hili kwa lengo la kuliharibu hekalu.
- source_word: שָׂמֶת טְעֵם
  choice: nimetoa amri hii
  rationale: Ni Kiswahili cha sasa kinachoonyesha kwa uwazi fomula rasmi ya kifalme.
- source_word: אָסְפַּרְנָא
  choice: kwa bidii yote
  rationale: Inabeba uzito wa utekelezaji wa haraka na makini; tanbihi inadokeza uwezekano wa msisitizo wa kasi.
- source_word: יִתְעֲבִד
  choice: na itekelezwe
  rationale: Inahifadhi nguvu ya amri katika muundo wa kutendwa unaofaa kwa Kiswahili.
theological_decisions:
- issue: Teolojia ya jina la Mungu katika hekalu
  choice: amelikalisha jina lake huko
  alternative: ameweka jina lake huko; anayekaa huko
  rationale: Kauli ya ‘jina’ inadumisha uhusiano wa kiagano wa Mungu na hekalu bila kusema kwamba Mungu mwenyewe amefungiwa katika eneo hilo.
- issue: Uhusiano wa kubadili na kuharibu
  choice: ili kubadili jambo hili, yaani kuiharibu nyumba hii
  alternative: ili kubadili au kuiharibu nyumba hii
  rationale: Kiaramu kina viambishi viwili vya kusudi vilivyofuatana na kinaweza kueleweka kuwa uharibifu unaeleza aina au matokeo ya badiliko. ‘Yaani’ huonyesha uhusiano huo bila kuongeza kitendo tofauti kisicholazimishwa na maandishi.
translation_notes:
  register: Lugha ni ya heshima, ya sasa, na inasomeka kwa urahisi katika Kiswahili Sanifu cha Afrika Mashariki. Muundo wa laana ya kifalme na sitiari ya kunyoosha mkono vimehifadhiwa. Kila alama ya tanbihi iliyotumiwa inaonekana katika maandishi.
