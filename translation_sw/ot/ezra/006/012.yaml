- from: Mungu ambaye amelikalisha jina lake huko na amwangushe mfalme au taifa lolote litakalonyosha mkono wake ili kubadili jambo hili, yaani kuiharibu nyumba hii ya Mungu iliyoko Yerusalemu. Mimi, Dario, nimetoa amri hii; na itekelezwe kwa bidii yote.[a]
  to: Mungu ambaye amefanya jina lake likae huko aangushe mfalme yeyote atakayonyosha mkono wake kubadili hili, au taifa lolote litakalonyosha mkono wake kubadili hili na kuharibu nyumba hii ya Mungu iliyoko Yerusalemu. Mimi, Dario, nimetoa amri hii; na itekelezwe kwa bidii yote.[a]
