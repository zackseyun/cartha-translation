  text: נִדְבָּכִ֞ין דִּי אֶ֤בֶן גְּלָל֙ תְּלָתָ֔א וְ/נִדְבָּ֖ךְ דִּי אָ֣ע חֲדַ֑ת וְ/נִ֨פְקְתָ֔/א מִן בֵּ֥ית מַלְכָּ֖/א תִּתְיְהִֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/004.yaml
  text: with three layers of dressed stone and one layer of new timber[b][a], and let the cost be given from the king’s house.
translation:
  language: sw
  text: kwa safu tatu za mawe yaliyochongwa[a] na safu moja ya mbao mpya, na gharama itolewe kutoka katika nyumba ya mfalme.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai cha Kiaramu kinaweza pia kueleweka kuwa “mawe makubwa.”
    reason: lexical_alternative
  - marker: b
    text: Huenda “nyumba ya mfalme” hapa ikamaanisha hazina au fedha za kifalme.
    reason: cultural_note
lexical_decisions:
- source_word: נִדְבָּכִין / נִדְבָּךְ
  choice: safu / safu moja
  rationale: Neno hili la ujenzi linamaanisha safu za mawe au mbao zilizopangwa katika jengo; “safu” ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: אֶבֶן גְּלָל
  choice: mawe yaliyochongwa
  rationale: Katika muktadha wa ujenzi, kirai hiki kinaelekea kumaanisha mawe yaliyotayarishwa kwa uashi. Maana yake halisi na kamili ina utata, kwa hiyo uwezekano mwingine umeonyeshwa katika tanbihi.
- source_word: תְּלָתָא
  choice: tatu
  rationale: Ni namba ya kuhesabu inayofafanua safu za mawe.
- source_word: אָע חֲדַת
  choice: mbao mpya
  rationale: אָע humaanisha miti, mbao, au kuni; katika ujenzi “mbao” ndiyo tafsiri ya kawaida, huku חֲדַת ikimaanisha “mpya.”
- source_word: נִפְקְתָא
  choice: gharama
  rationale: Neno hili humaanisha matumizi au gharama ya kazi; “gharama” ni la kawaida katika Kiswahili cha kiutawala.
- source_word: מִן בֵּית מַלְכָּא
  choice: kutoka katika nyumba ya mfalme
  rationale: Tafsiri hii inadumisha tamko halisi la Kiaramu, ambalo katika muktadha huenda likamaanisha hazina au fedha za kifalme.
- source_word: תִּתְיְהִב
  choice: itolewe
  rationale: Kauli tendwa inaonyesha agizo la kiutawala kwamba gharama hiyo itolewe; “itolewe” huhifadhi nguvu ya agizo kwa Kiswahili cha asili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na ulio wazi. “Safu” na “mbao” ni maneno ya kawaida ya ujenzi; muundo wa “itolewe” unafaa lugha ya amri ya kifalme.
