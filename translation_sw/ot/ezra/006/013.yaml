  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֱ֠דַיִן תַּתְּנַ֞י פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן לָ/קֳבֵ֗ל דִּֽי שְׁלַ֞ח דָּרְיָ֧וֶשׁ מַלְכָּ֛/א כְּנֵ֖מָא אָסְפַּ֥רְנָא עֲבַֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/013.yaml
  text: Then Tattenai[a], the governor of Beyond the River, Shethar-bozenai, and their associates did exactly so[b], in accordance with what King Darius had sent.
translation:
  language: sw
  text: Ndipo Tatenai, gavana wa Ng’ambo ya Mto[a], Shethar-bozenai, na washirika wao wakafanya hivyo kwa usahihi kabisa[b], kulingana na yale ambayo Mfalme Dario alikuwa ametuma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ng’ambo ya Mto” lilikuwa jina la kiutawala la Waajemi kwa eneo lililokuwa magharibi mwa Mto Frati.
    reason: cultural_note
  - marker: b
    text: Au “wakafanya hivyo kwa uangalifu” au “wakatekeleza kwa usahihi wote.” Usemi wa Kiaramu unasisitiza kwamba walifuata maelekezo ya mfalme kwa usahihi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Ndipo
  rationale: Ni kiashiria cha mwendelezo wa simulizi kinachoanzisha tukio linalofuata; “Ndipo” ni cha kawaida na cha asili katika Kiswahili.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: gavana wa Ng’ambo ya Mto
  rationale: פַּחַת ni gavana wa jimbo, na עֲבַר נַהֲרָה ni jina rasmi la kiutawala la Waajemi kwa eneo la magharibi mwa Frati. Tafsiri hii inadumisha mtazamo wa jina la kale badala ya kulibadili kuwa jina la kisasa.
- source_word: שְׁתַר בּוֹזְנַי
  choice: Shethar-bozenai
  rationale: Jina la mtu limetoholewa kwa herufi za Kilatini bila kulitafsiri; kistari kinadumisha uwasilishaji wa kawaida wa jina hilo ambatani.
- source_word: וּכְנָוָתְהוֹן
  choice: na washirika wao
  rationale: Neno hilo linawahusu watu walioungana nao au walioandamana nao katika kazi rasmi; “washirika” linafaa kwa muktadha wa kiutawala.
- source_word: לָקֳבֵל דִּי
  choice: kulingana na yale ambayo
  rationale: Kirai hiki huonyesha kupatana na agizo au maelekezo fulani. Chaguo hili ni la asili katika Kiswahili na linadumisha maana ya kutii yaliyotumwa.
- source_word: שְׁלַח
  choice: alikuwa ametuma
  rationale: Kitenzi humaanisha kihalisi “alituma.” Wakati timilifu unaonyesha kuwa Dario alikuwa amekwisha kutuma yaliyoelekeza hatua yao, bila kuongeza nomino kama “amri” ambayo haijaandikwa wazi.
- source_word: כְּנֵמָא אָסְפַּרְנָא
  choice: kwa usahihi kabisa
  rationale: Mkusanyiko huu wa vielezi unasisitiza utekelezaji makini na kamili. “Kwa usahihi kabisa” huwasilisha msisitizo huo kwa Kiswahili cha asili.
- source_word: עֲבַדוּ
  choice: wakafanya hivyo
  rationale: Kitenzi hiki ni kipana, “walifanya.” “Wakafanya hivyo” kinaeleweka kwa kurejelea walichotumiwa na mfalme bila kuongeza kitu kisichotajwa wazi.
