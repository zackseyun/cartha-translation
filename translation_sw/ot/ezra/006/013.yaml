translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi inayofaa simulizi la Maandiko. Majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili; jina rasmi la kiutawala limehifadhiwa na kufafanuliwa katika tanbihi.
