  text: וַ/יַּֽעֲשׂ֧וּ חַג מַצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֑ה כִּ֣י שִׂמְּחָ֣/ם יְהוָ֗ה וְֽ/הֵסֵ֞ב לֵ֤ב מֶֽלֶךְ אַשּׁוּר֙ עֲלֵי/הֶ֔ם לְ/חַזֵּ֣ק יְדֵי/הֶ֔ם בִּ/מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִ֖ים אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/022.yaml
  text: And they kept the Feast of Unleavened Bread for seven days with joy[a], because Yahweh had made them joyful and had turned the heart of the king of Assyria toward them, to strengthen their hands in the work of the house of God[c][b], the God of Israel.
translation:
  language: sw
  text: Nao wakaadhimisha Sikukuu ya Mikate Isiyotiwa Chachu kwa siku saba kwa furaha, kwa maana Yahwe alikuwa amewafurahisha[b] na alikuwa ameuelekeza moyo[c] wa mfalme wa Ashuru[a] kwao, ili kuimarisha mikono yao katika kazi ya nyumba ya Mungu, Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mfalme wa Ashuru.” Ingawa mtawala wa wakati wa Ezra alikuwa Mwajemi, matini inatumia cheo hiki; huenda kilirejelea milki iliyojumuisha eneo la zamani la Ashuru.'
    reason: cultural_note
  - marker: b
    text: Au “alikuwa amewafanya wafurahi.”
    reason: lexical_alternative
  - marker: c
    text: Au “alikuwa ameugeuza moyo wa mfalme wa Ashuru kwao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: wakaadhimisha
  rationale: Kitenzi עשה kinapotumiwa pamoja na sikukuu humaanisha kuiadhimisha au kuitunza, si ‘kuifanya’ kwa maana ya kawaida.
- source_word: חַג מַצּוֹת
  choice: Sikukuu ya Mikate Isiyotiwa Chachu
  rationale: Hili ni jina linalotambulika la sikukuu ya Israeli; tafsiri hii ni wazi na inahifadhi wazo la mikate isiyo na chachu.
- source_word: שִׁבְעַת יָמִים בְּשִׂמְחָה
  choice: kwa siku saba kwa furaha
  rationale: Muundo huu unaonyesha muda wa maadhimisho na namna yalivyofanywa huku ukihifadhi nomino ‘furaha.’
- source_word: שִׂמְּחָם
  choice: alikuwa amewafurahisha
  rationale: 'Hifili ya kitenzi ina nguvu ya kusababisha: Yahwe ndiye aliyewafanya wawe na furaha. Wakati timilifu unaonyesha kwamba tendo hilo lilikuwa sababu ya maadhimisho yao.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika Kiebrania linatoholewa badala ya kubadilishwa kuwa cheo.
- source_word: וְהֵסֵב לֵב
  choice: na kuugeuza moyo
  rationale: Tafsiri hii inafuata taswira ya Kiebrania ya kugeuza mwelekeo au msimamo wa moyo bila kuibana kuwa ‘kumpendelea.’
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Kiebrania kinamtaja wazi ‘mfalme wa Ashuru’; tafsiri haiubadili kuwa mfalme wa Uajemi kwa lengo la kuoanisha historia.
- source_word: עֲלֵיהֶם
  choice: kuelekea kwao
  rationale: Kirai hiki kinaonyesha mwelekeo wa moyo wake kwao bila kuongeza wazi dhana ya upendeleo, ingawa muktadha unaidokeza.
- source_word: לְחַזֵּק יְדֵיהֶם
  choice: ili kuimarisha mikono yao
  rationale: Taswira ya Kiebrania ya kuimarisha mikono ina maana ya kuwapa nguvu au msaada; imehifadhiwa kwa kuwa inaeleweka katika muktadha.
- source_word: בִּמְלֶאכֶת בֵּית הָאֱלֹהִים
  choice: katika kazi ya nyumba ya Mungu
  rationale: Kirai hiki kinarejelea kazi iliyofanywa katika nyumba ya Mungu na kinafuata kwa karibu mnyororo wa majina wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia Tetragramatoni kama jina binafsi; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Cheo ‘mfalme wa Ashuru’ katika mazingira ya kipindi cha Uajemi
  choice: Kuhifadhi ‘mfalme wa Ashuru’ katika matini kuu
  alternative: mfalme wa Uajemi au mfalme aliyetawala Ashuru
  rationale: Matini ya Kiebrania yenyewe inasema ‘mfalme wa Ashuru.’ Kuibadili kungeondoa mvutano wa kihistoria na kuingiza ufafanuzi ndani ya matini.
- issue: Mhusika wa kusababisha furaha
  choice: Yahwe alikuwa amewafurahisha
  alternative: Yahwe alikuwa amewafanya wafurahi
  rationale: Chaguo hili linahifadhi wazi kwamba furaha yao ilisababishwa na Yahwe, bila kuongeza maelezo ya jinsi alivyofanya hivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. ‘Wakaadhimisha’ ni ya kawaida kwa sikukuu, huku ‘kuimarisha mikono yao’ ikihifadhi taswira muhimu ya Kiebrania. Alama zote za tanbihi zimewekwa mara moja katika matini kuu karibu na maneno yanayohusika.
