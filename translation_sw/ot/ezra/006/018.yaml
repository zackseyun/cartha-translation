base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/018.yaml
  text: And they set up the priests in their divisions and the Levites in their divisions for the service of God that is in Jerusalem[b][a], as it is written in the Book of Moses.
translation:
  language: sw
  text: Nao wakawaweka makuhani katika zamu zao na Walawi katika makundi yao kwa ajili ya huduma ya Mungu huko Yerusalemu, kama ilivyoandikwa katika Kitabu cha Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִימוּ
  choice: wakawaweka
  rationale: Kitenzi cha Kisababishi cha קום kina maana ya kuwafanya wasimame mahali pao, kuwaweka, au kuwateua. “Wakawaweka” ni cha kawaida na kinaonyesha kupangiwa nafasi na kazi bila kuzidisha maana kuwa uteuzi rasmi.
- source_word: כָהֲנַיָּא
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa watumishi hawa wa ibada.
- source_word: בִּפְלֻגָּתְהוֹן
  choice: katika zamu zao
  rationale: Nomino hii inaonyesha migawanyo ya kikazi. “Zamu” inaeleweka kwa urahisi katika muktadha wa makuhani waliopangwa kuhudumu kwa vipindi au vikundi.
- source_word: וְלֵוָיֵא
  choice: na Walawi
  rationale: Tafsiri ya kawaida ya watu wa kabila la Lawi waliokuwa na majukumu ya huduma ya hekalu.
- source_word: בְּמַחְלְקָתְהוֹן
  choice: katika makundi yao
  rationale: Nomino hii pia inaonyesha mgawanyo wa kiutendaji. “Makundi” huhifadhi ukaribu wake wa maana na neno lililotumiwa kwa makuhani huku ikitoa Kiswahili cha kawaida.
- source_word: עַל עֲבִידַת אֱלָהָא
  choice: kwa ajili ya huduma ya Mungu
  rationale: Kirai hiki kinaonyesha kwamba waliwekwa kwa kazi au huduma ya Mungu; tafsiri hii ni ya asili katika Kiswahili na haibani maana kuwa usimamizi pekee.
- source_word: דִּי בִירוּשְׁלֶם
  choice: huko Yerusalemu
  rationale: Kiunganishi cha Kiaramu kinahusisha huduma hiyo na Yerusalemu. “Huko Yerusalemu” hutoa maana hiyo kwa Kiswahili cha kawaida bila kirai kizito cha “ambayo iko Yerusalemu.”
- source_word: כִּכְתָב
  choice: kama ilivyoandikwa
  rationale: Nahau hii inaonyesha kufuata mamlaka ya maandishi; “kama ilivyoandikwa” ni usemi wa kawaida na mwaminifu.
- source_word: סְפַר מֹשֶׁה
  choice: Kitabu cha Musa
  rationale: סְפַר inaweza kuwa kitabu, hati, au gombo. “Kitabu cha Musa” ni usemi wazi unaohifadhi namna maandishi yanavyoitaja kazi hiyo bila kuongeza madai kuhusu upeo wake.
theological_decisions:
- issue: Uhusiano wa mpangilio wa makuhani na Walawi na maagizo ya Musa
  choice: Sentensi inaonyesha kwamba waliwekwa kwa huduma ya Mungu huko Yerusalemu kwa kufuata yaliyoandikwa katika Kitabu cha Musa.
  alternative: Maneno ya mwisho yanaweza kuhusishwa kwa karibu zaidi na huduma ya Mungu yenyewe au kutafsiriwa “kulingana na yaliyoandikwa katika Kitabu cha Musa.”
  rationale: Mahali pa kirai cha mwisho kinaonyesha wazi ulinganifu na maandishi ya Musa, lakini tafsiri haiongezi madai ya kimadhehebu kuhusu kanoni, uandishi, au aina kamili ya taratibu hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Zamu” kwa makuhani na “makundi” kwa Walawi vinaakisi maneno mawili ya Kiaramu yaliyo karibu kimaana bila kudokeza tofauti kubwa isiyothibitishwa. Hakuna tanbihi iliyohitajika katika mstari huu.
