  text: וַ/יֹּאכְל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל הַ/שָּׁבִים֙ מֵֽ/הַ/גּוֹלָ֔ה וְ/כֹ֗ל הַ/נִּבְדָּ֛ל מִ/טֻּמְאַ֥ת גּוֹיֵֽ הָ/אָ֖רֶץ אֲלֵ/הֶ֑ם לִ/דְרֹ֕שׁ לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/021.yaml
  text: The sons of Israel who had returned from the exile ate, together with everyone who had separated himself from the uncleanness of the peoples of the land to join them, to seek Yahweh, the God of Israel.
translation:
  language: sw
  text: Waisraeli[a] waliokuwa wamerudi kutoka uhamishoni wakala, pamoja na kila mtu aliyejitenga na unajisi wa watu wa nchi[b] na kujiunga nao[c], ili kumtafuta Yahwe, Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “wana wa Israeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
  - marker: b
    text: Au “uchafu wa watu wa nchi.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kwao”; yaani, walijihusisha na jumuiya ya wale waliokuwa wamerudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: wakala
  rationale: Kitenzi cha Kiebrania kinamaanisha tu ‘walikula’; chakula cha Pasaka kinaeleweka kutokana na mstari uliotangulia, hivyo hakijaongezwa wazi.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania, huku tanbihi ikitoa usemi wa kawaida zaidi ‘Waisraeli.’ Katika muktadha huu haimaanishi wanaume pekee.
- source_word: הַשָּׁבִים מֵהַגּוֹלָה
  choice: waliokuwa wamerudi kutoka uhamishoni
  rationale: Hutambulisha waliorejea kutoka uhamishoni kwa Kiswahili cha kawaida na sahihi kimuktadha.
- source_word: וְכֹל הַנִּבְדָּל
  choice: pamoja na kila mtu aliyejitenga
  rationale: ‘Pamoja na’ huonyesha kuwa kundi hili pia lilishiriki, na ‘kila mtu’ huwasilisha umoja wa kijumla wa כֹל kwa njia ya kawaida.
- source_word: מִטֻּמְאַת גּוֹיֵי הָאָרֶץ
  choice: na unajisi wa watu wa nchi
  rationale: ‘Unajisi’ huhifadhi maana ya kiibada na kimaadili ya טֻמְאָה; ‘watu wa nchi’ haifanyi makundi hayo kuwa taifa moja.
- source_word: אֲלֵהֶם
  choice: na kujiunga nao
  rationale: Kihalisi ni ‘kwao’; katika muktadha inaonyesha kuelekea au kuhusishwa na jumuiya ya waliorejea. Tanbihi huhifadhi usemi halisi.
- source_word: לִדְרֹשׁ
  choice: ili kumtafuta
  rationale: Huhifadhi maana pana ya kumwelekea Mungu kwa uaminifu na ibada bila kuipunguza kuwa ‘kumwabudu’ au ‘kumwuliza’ tu.
- source_word: לַיהוָה
  choice: YAHWE
  rationale: Huwakilisha jina la agano יהוה kama jina binafsi la Mungu, kwa tahajia inayotambulika katika Kiswahili.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya kawaida ya muundo wa umilikaji na huhifadhi utambulisho wa kiagano.
theological_decisions:
- issue: Utambulisho wa washiriki wa ziada katika Pasaka
  choice: Maandishi yanawaeleza kwa upana kuwa watu waliojitenga na unajisi wa watu wa nchi, wakajiunga na waliorejea ili kumtafuta YAHWE.
  alternative: Wanaweza kueleweka kuwa waongofu kutoka kwa watu wa karibu, au Waisraeli waliokuwa nchini ambao walijitenga na uchafu wa kigeni.
  rationale: Kiebrania hakiwaiti wazi waongofu wala hakiwatambulishi kuwa Waisraeli pekee; tafsiri haifungi utambulisho wao zaidi ya maandishi.
- issue: Uhusiano wa אֲלֵהֶם katika sentensi
  choice: 'Imehusishwa na kujiunga na jumuiya ya waliorejea: ‘na kujiunga nao.’'
  alternative: Inaweza kuachwa kihalisi kuwa ‘kwao,’ au sintaksia ikaeleweka bila kuongeza kitenzi cha kujiunga.
  rationale: Kiwakilishi ‘kwao’ kipo katika maandishi na kwa kawaida huashiria kuelekea kwa kundi hilo; ‘kujiunga nao’ huifanya maana hiyo ieleweke kwa Kiswahili, huku tanbihi ikionyesha uhalisi na kutunza uwezekano wa kisintaksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi bila kuamua ikiwa washiriki wa ziada walikuwa waongofu wa mataifa au Waisraeli waliobaki nchini. Alama zote za tanbihi zimewekwa katika matini kuu.
