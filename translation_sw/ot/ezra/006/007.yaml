  yaml_path: translation/ot/ezra/006/007.yaml
  text: Leave the work on this house of God alone[a]; let the governor of the Jews and the elders of the Jews rebuild this house of God on its site.
translation:
  language: sw
  text: Msiingilie kazi ya nyumba hii ya Mungu. Gavana wa Wayahudi[a] na wazee wa Wayahudi waijenge upya nyumba hii ya Mungu mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Watu wa Yuda” badala ya “Wayahudi.” Neno la Kiaramu linaweza kumaanisha watu wa Yuda kwa maana ya kikabila au ya kieneo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻקוּ לַעֲבִידַת
  choice: Iacheni bila kuingilia kazi
  rationale: Amri ya wingi ya kitenzi שבק hapa inaagiza wahusika waache kuzuia au kuingilia shughuli ya ujenzi. Usemi huu ni wa asili katika Kiswahili na unaonyesha nguvu ya amri.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: nyumba hii ya Mungu
  rationale: דֵךְ huelekeza kwenye hekalu mahususi linalozungumziwa; “hii” inahifadhi rejeo hilo la karibu.
- source_word: פַּחַת
  choice: gavana
  rationale: Neno hilo humaanisha mtawala wa jimbo. “Gavana” ni neno la kawaida na linaloeleweka bila kuipa cheo maana finyu kupita kiasi.
- source_word: יְהוּדָיֵא
  choice: Wayahudi
  rationale: Neno la Kiaramu linaweza kuwataja watu wa Yuda kwa maana ya kikabila au ya kieneo. “Wayahudi” linaeleweka kwa urahisi, huku uwezekano wa “Watu wa Yuda” ukibainishwa katika tanbihi.
- source_word: וּלְשָׂבֵי יְהוּדָיֵא
  choice: na wazee wa Wayahudi
  rationale: שָׂבֵי hapa ni viongozi wa jumuiya; “wazee” ndilo neno la kawaida katika muktadha huu wa kiutawala.
- source_word: יִבְנוֹן
  choice: waijenge upya
  rationale: Kauli isiyotimilika ya wingi ina nguvu ya ruhusa au agizo katika hati hii. “Waijenge upya” inaonyesha urejeshaji wa hekalu na kuendeleza kazi iliyokuwa imeanza.
- source_word: עַל אַתְרֵהּ
  choice: mahali pake
  rationale: אַתַר humaanisha mahali au eneo. “Mahali pake” ni Kiswahili cha asili kinachoonyesha kwamba nyumba ijengwe tena katika eneo lake.
