base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/006.yaml
  text: Now Tattenai[a], governor of the province Beyond the River, Shethar-bozenai, and your associates, the officials of Persia who are in Beyond the River[c][b], keep far away from there.
translation:
  language: sw
  text: Sasa, Tatenai, gavana wa Ng’ambo ya Mto, Shethar-Bozenai, pamoja na washirika wenu, Waafarsaki[a] mlio Ng’ambo ya Mto[b], kaeni mbali na huko.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maofisa wa Uajemi.” Maana kamili ya jina hili la Kiaramu haijulikani kwa hakika.
    reason: alternative_reading
  - marker: b
    text: “Ng’ambo ya Mto” lilikuwa jina la kiutawala la Uajemi kwa eneo lililokuwa magharibi mwa Mto Frati.
    reason: cultural_note
  - marker: c
    text: Kwa maana halisi, “iweni mbali na huko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Basi sasa
  rationale: Kiashiria cha mazungumzo cha Kiaramu kinaanzisha agizo la mfalme; “Basi sasa” hudumisha mpito na nguvu ya maagizo bila kulifanya hitimisho la kimantiki kupita kiasi.
- source_word: תַּתְּנַי
  choice: Tatenai
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: gavana wa Ng’ambo ya Mto
  rationale: פַּחַת ni gavana wa utawala, na עֲבַר נַהֲרָה ni jina la eneo la utawala wa Uajemi upande wa magharibi wa Frati. Neno “jimbo” halijaongezwa katika matini, huku tanbihi ikifafanua jina hilo.
- source_word: שְׁתַר בּוֹזְנַי
  choice: Shethar-Bozenai
  rationale: Jina la mtu limetoholewa; kistari kinaonyesha umbo lake ambatani.
- source_word: וּכְנָוָתְהוֹן
  choice: pamoja na washirika wenu
  rationale: Kiambishi ni cha nafsi ya pili wingi, kwa hiyo “wenu” hudumisha usemi wa moja kwa moja wa amri kuliko “wao.”
- source_word: אֲפַרְסְכָיֵא
  choice: Waafarsaki
  rationale: Neno lenye utata limetoholewa badala ya kulifasiri kwa uhakika kama “maofisa wa Uajemi”; tanbihi inatoa uwezekano huo wa maana.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: mlio Ng’ambo ya Mto
  rationale: Kishazi husika kinawatambulisha wale wanaosemewa kwa mahali walipo; wingi wa nafsi ya pili unafaa muktadha wa agizo la moja kwa moja.
- source_word: רַחִיקִין הֲוֹו מִן תַּמָּה
  choice: kaeni mbali kabisa na mahali hapo
  rationale: Hii ni amri yenye maana halisi ya kuwa mbali na huko. “Kaeni mbali kabisa” ni Kiswahili cha kawaida chenye nguvu ya zuio la kifalme bila kuongeza kitendo kingine.
