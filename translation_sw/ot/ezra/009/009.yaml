  text: כִּֽי עֲבָדִ֣ים אֲנַ֔חְנוּ וּ/בְ/עַבְדֻ֔תֵ/נוּ לֹ֥א עֲזָבָ֖/נוּ אֱלֹהֵ֑י/נוּ וַֽ/יַּט עָלֵ֣י/נוּ חֶ֡סֶד לִ/פְנֵי֩ מַלְכֵ֨י פָרַ֜ס לָֽ/תֶת לָ֣/נוּ מִֽחְיָ֗ה לְ/רוֹמֵ֞ם אֶת בֵּ֤ית אֱלֹהֵ֨י/נוּ֙ וּ/לְ/הַעֲמִ֣יד אֶת חָרְבֹתָ֔י/ו וְ/לָֽ/תֶת לָ֣/נוּ גָדֵ֔ר בִּֽ/יהוּדָ֖ה וּ/בִ/ירוּשָׁלִָֽם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/009.yaml
  text: For we are servants[a]; yet in our slavery our God has not forsaken us, but has extended covenant faithfulness to us before the kings of Persia, to give us reviving, to raise up the house of our God, to set up its ruins[b], and to give us a wall in Judah and in Jerusalem.
translation:
  language: sw
  text: Kwa maana sisi ni watumwa; lakini katika utumwa wetu Mungu wetu hakutuacha, bali ametuonyesha upendo wa agano[a] mbele ya wafalme wa Uajemi, ili kutuhuisha, kuiinua nyumba ya Mungu wetu, kuyasimamisha tena magofu yake, na kutupa ukuta[b] katika Yuda na Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo thabiti,” “fadhili,” au “neema.” Neno la Kiebrania חֶסֶד linahusu upendo wenye neema, uaminifu, na ushikamanifu katika agano.
    reason: lexical_alternative
  - marker: b
    text: Au, “uzio wa ulinzi” au “kinga.” Picha hii huenda inamaanisha usalama na ulinzi katika Yuda na Yerusalemu, wala si lazima ukuta halisi pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים / וּבְעַבְדֻתֵנוּ
  choice: watumwa / katika utumwa wetu
  rationale: Maneno haya yanahusu hali ya kuwa chini ya mamlaka na utumishi wa lazima; kurudia mzizi wa 'utumwa' kunahifadhi uhusiano wa maneno na msisitizo wa Kiebrania.
- source_word: עֲזָבָנוּ
  choice: hakutuacha
  rationale: Kitenzi kina maana ya kuacha au kutelekeza. 'Hakutuacha' ni Kiswahili cha kawaida na chenye uzito unaofaa katika sala hii.
- source_word: וַיַּט עָלֵינוּ חֶסֶד
  choice: ametutendea upendo wa agano
  rationale: Nahau hiyo inaeleza Mungu kuwafikishia watu wake ḥesed, yaani upendo wenye neema na uaminifu katika uhusiano wa agano. 'Ametutendea' ni ya asili zaidi kwa Kiswahili kuliko kufuata moja kwa moja picha ya kunyoosha.
- source_word: לִפְנֵי מַלְכֵי פָרַס
  choice: mbele ya wafalme wa Uajemi
  rationale: Huhifadhi maana ya kuwa katika uwepo au machoni pa wafalme wa Uajemi.
- source_word: מִחְיָה
  choice: kutuhuisha
  rationale: Nomino hiyo inaweza kumaanisha kuhifadhi uhai au kuurudisha. Kitenzi 'kutuhuisha' kinaeleza kwa kawaida kupewa uhai mpya katika mazingira ya baada ya uhamisho.
- source_word: לְרוֹמֵם אֶת בֵּית אֱלֹהֵינוּ
  choice: kuiinua nyumba ya Mungu wetu
  rationale: Huhifadhi sitiari ya kuinua na msemo halisi 'nyumba ya Mungu wetu,' huku muktadha ukionyesha kuwa ni hekalu.
- source_word: וּלְהַעֲמִיד אֶת חָרְבֹתָיו
  choice: kuyasimamisha tena magofu yake
  rationale: Kitenzi cha kisababishi kina maana ya kufanya kisimame. Neno 'tena' linafanya kauli ieleweke kwa Kiswahili kama kujenga upya yaliyokuwa magofu bila kuondoa picha ya kuyasimamisha.
- source_word: גָדֵר
  choice: ukuta
  rationale: Neno hilo linaweza kuwa ukuta, uzio, au kinga inayozunguka. 'Ukuta' huhifadhi picha halisi, huku tanbihi ikidokeza maana pana ya ulinzi.
- source_word: בִּיהוּדָה וּבִירוּשָׁלִָם
  choice: katika Yuda na Yerusalemu
  rationale: Vihusishi ni vya mahali; tafsiri hii haibadili kimakusudi ukuta kuwa kitu kinachozunguka maeneo hayo.
theological_decisions:
- issue: Maana ya חֶסֶד
  choice: upendo wa agano
  alternative: upendo thabiti; fadhili; neema
  rationale: Chaguo hili linahifadhi upendo wa Mungu wenye neema na uaminifu kwa watu wake katika uhusiano wa agano. Tanbihi inaacha wazi wigo wa maana badala ya kuufunga kwa neno moja.
- issue: Picha ya גָדֵר
  choice: ukuta
  alternative: uzio wa ulinzi; kinga
  rationale: Maandishi yanatumia picha halisi inayoweza pia kuashiria usalama uliopatikana chini ya utawala wa Uajemi. Tafsiri kuu inahifadhi picha hiyo, na tanbihi inalinda uwezekano wa maana pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya lugha ya sala. Muundo unadumisha utofauti kati ya utumwa wa jamii na rehema ya Mungu, pamoja na mfuatano wa malengo katika maandishi ya Kiebrania.
