  text: וּ/כְ/כַלּ֣וֹת אֵ֗לֶּה נִגְּשׁ֨וּ אֵלַ֤/י הַ/שָּׂרִים֙ לֵ/אמֹ֔ר לֹֽא נִבְדְּל֞וּ הָ/עָ֤ם יִשְׂרָאֵל֙ וְ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת כְּ֠/תוֹעֲבֹֽתֵי/הֶם לַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הַ/פְּרִזִּ֣י הַ/יְבוּסִ֗י הָֽ/עַמֹּנִי֙ הַ/מֹּ֣אָבִ֔י הַ/מִּצְרִ֖י וְ/הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/001.yaml
  text: When these things were finished[a], the officials approached me, saying, “The people of Israel, and the priests and the Levites, have not separated themselves from the peoples of the lands, according to their abominations—the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.”
translation:
  language: sw
  text: Baada ya mambo hayo kukamilika, wakuu walinijia na kusema, “Watu wa Israeli, makuhani na Walawi hawajajitenga na mataifa ya nchi mbalimbali, kwa kufuatia machukizo yao[a]—yaani, ya Wakanaani, Wahiti, Waperizi, Wayebusi, Waamoni, Wamoabu, Wamisri na Waamori.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kadiri ya machukizo yao.” Neno la Kiebrania ni kali na mara nyingi hutumiwa kuhusu matendo yanayochukiza kidini, hasa yanayohusiana na ibada ya sanamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹת אֵלֶּה
  choice: Baada ya mambo hayo kukamilika
  rationale: Muundo huu ni kishazi cha wakati kinachoonyesha kwamba taarifa hiyo ilitolewa mambo yaliyotangulia yalipokuwa yamekamilika. ‘Baada ya’ ni Kiswahili cha kawaida na hakiongezi kiashiria kisichokuwamo cha maana ya ‘sasa’.
- source_word: נִגְּשׁוּ אֵלַי
  choice: walinijia
  rationale: Kitenzi hiki kina maana ya kukaribia au kumwendea mtu. ‘Walinijia’ ni usemi wa asili wa Kiswahili katika muktadha wa wakuu wanaomletea Ezra taarifa.
- source_word: הַשָּׂרִים
  choice: wakuu
  rationale: Neno hili humaanisha viongozi au maafisa wenye mamlaka. ‘Wakuu’ linafaa katika mazingira ya utawala wa kipindi hicho bila kudokeza kwamba walikuwa wana wa kifalme.
- source_word: לֹא נִבְדְּלוּ
  choice: hawajajitenga
  rationale: Hifadhi maana ya kujitenga inayotolewa na kitenzi cha Kiebrania bila kuamua zaidi nia au namna ya kujitenga huko.
- source_word: הָעָם יִשְׂרָאֵל וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: Watu wa Israeli, makuhani na Walawi
  rationale: Makundi yote matatu yameunganishwa chini ya shtaka lilelile, kama ilivyo katika sintaksia ya Kiebrania.
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  choice: na watu wa nchi mbalimbali
  rationale: ‘Watu’ na wingi wa maeneo mbalimbali umehifadhiwa kwa Kiswahili cha asili; ‘nchi mbalimbali’ huepuka kudokeza bila msingi kwamba ni nchi zinazowazunguka tu.
- source_word: כְּתוֹעֲבֹתֵיהֶם
  choice: bali wamefuata matendo yao ya kuchukiza
  rationale: Kiambishi כ־ kinaonyesha kulingana na au kufuata mwenendo fulani. Uundaji huu unaeleza kwa Kiswahili kinachoeleweka kwamba kutokujitenga kulionekana katika kufuata desturi hizo, huku ‘matendo ya kuchukiza’ likihifadhi uzito wa kimaadili na kidini wa תועבות.
- source_word: לַכְּנַעֲנִי ... וְהָאֱמֹרִי
  choice: ya Wakanaani, Wahiti, Waperizi, Wayebusi, Waamoni, Wamoabu, Wamisri na Waamori
  rationale: Majina ya Kiebrania yako katika umoja wa kutaja jamii, lakini wingi ndio namna ya kawaida ya Kiswahili ya kutaja makabila na mataifa haya. ‘Yaani’ linaonyesha kwamba orodha inafafanua watu waliotajwa.
theological_decisions:
- issue: Uzito wa neno la agano תועבות
  choice: matendo yao ya kuchukiza
  alternative: machukizo yao
  rationale: Tafsiri iliyochaguliwa ni ya kawaida zaidi kwa msomaji wa sasa lakini bado inaonyesha hukumu kali ya kimaadili na kidini. Haipunguzi shtaka kuwa tofauti ya kijamii tu.
- issue: Upeo wa shtaka kwa makundi ya Israeli
  choice: Watu wa Israeli, makuhani na Walawi wote wanatajwa kuwa hawajajitenga
  alternative: Kulichukulia shtaka kuwa linawahusu watu wa kawaida hasa, huku makuhani na Walawi wakitajwa kwa pembeni
  rationale: Muundo wa Kiebrania unaunganisha makundi yote matatu na kitenzi kimoja; kwa hiyo tafsiri haipunguzi upeo wa shtaka.
- issue: Uhusiano wa כְתוֹעֲבֹתֵיהֶם na kutokujitenga
  choice: bali wamefuata matendo yao ya kuchukiza
  alternative: kuhusiana na machukizo yao
  rationale: כ־ inaweza kuonyesha kulingana au kufanana. Tafsiri inaonyesha hali ya kufuata matendo hayo bila kuingiza fundisho la ziada; tanbihi inahifadhi uwezekano wa tafsiri rasmi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina ya jamii yamefuata maumbo yaliyozoeleka katika Kiswahili cha Biblia. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya kirai inachokifafanua.
