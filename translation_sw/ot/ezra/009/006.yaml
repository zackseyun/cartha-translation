base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/006.yaml
  text: And I said[a], “My God, I am ashamed and humiliated to lift up my face to you, my God, because our iniquities have multiplied above our heads, and our guilt has grown as high as the heavens.”
translation:
  language: sw
  text: Nikasema, “Mungu wangu, nina aibu na nimefedheheka kuinua uso wangu kwako, Mungu wangu, kwa maana maovu yetu yameongezeka hata yakawa juu ya vichwa vyetu,[a] na hatia yetu imekuwa kubwa hata kufika mbinguni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno moja moja, Kiebrania kinasema “juu ya kichwa.” Hapa “kichwa” katika umoja kina maana ya kijumla kwa watu wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Nikasema
  rationale: Inaendeleza simulizi kwa njia ya kawaida katika Kiswahili bila kuongeza maana nyingine.
- source_word: בֹּשְׁתִּי וְנִכְלַמְתִּי
  choice: ninaona aibu na kufedheheka
  rationale: Kauli hizi mbili zinazokaribiana zinaendeleza msisitizo wa Ezra kuhusu aibu na fedheha yake; wakati wa sasa unaonyesha hali anayopitia katika muktadha huu.
- source_word: לְהָרִים ... פָּנַי אֵלֶיךָ
  choice: kuinua uso wangu kwako
  rationale: Inahifadhi taswira ya Kiebrania ya kuuelekeza uso kwa Mungu badala ya kuibadili kuwa kuinua macho.
- source_word: עֲוֺנֹתֵינוּ
  choice: maovu yetu
  rationale: ‘Maovu’ yanawasilisha uzito wa kimaadili wa עָוֹן na kubaki tofauti na ‘hatia’ inayotafsiri אַשְׁמָה baadaye.
- source_word: רָבוּ לְמַעְלָה רֹאשׁ
  choice: yamekuwa mengi hata yakapita vichwa vyetu
  rationale: Inawasilisha wingi unaoongezeka pamoja na taswira ya maovu kupanda juu kuliko kichwa, kwa Kiswahili cha kawaida.
- source_word: אַשְׁמָתֵנוּ
  choice: hatia yetu
  rationale: Katika muktadha huu neno linamaanisha hali ya kuwa na kosa, si sadaka ya hatia.
- source_word: גָדְלָה עַד לַשָּׁמָיִם
  choice: imeongezeka hata kufika mbinguni
  rationale: Inahifadhi taswira ya wima na ukubwa uliokithiri kwa lugha ya kawaida ya Kiswahili.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Inahifadhi namna ya moja kwa moja ya kumwita Mungu na kurudiwa kwake kwa msisitizo.
