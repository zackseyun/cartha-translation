id: EZR.9.10
reference: Ezra 9:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֛ה מַה נֹּאמַ֥ר אֱלֹהֵ֖י/נוּ אַֽחֲרֵי זֹ֑את כִּ֥י עָזַ֖בְנוּ מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/010.yaml
  text: And now[a], what shall we say, our God, after this? For we have forsaken your commandments.
translation:
  language: sw
  text: Na sasa, tuseme nini[a], Ee Mungu wetu, baada ya hayo? Kwa maana tumeziacha amri zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tunaweza kusema nini?”
    reason: Muktadha unaweza kufanya umbo la Kiebrania lisikike kama swali la kujadiliana au kama usemi wa kukosa kabisa la kusema.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi וְ pamoja na maana ya wakati ya עַתָּה bila kuamua kwamba uhusiano wa hoja ni wa kupinga au wa kuhitimisha.
- source_word: מַה נֹּאמַר
  choice: tuseme nini
  rationale: Hali ya tegemezi katika Kiswahili huwasilisha vizuri swali la kujadiliana lenye hisia ya kukosa la kusema, huku ikibaki karibu na hali ya kitenzi cha Kiebrania.
- source_word: אֱלֹהֵינוּ
  choice: Ee Mungu wetu
  rationale: Ni namna ya kumwita Mungu moja kwa moja katika sala. ‘Ee’ huonyesha wazi usemi wa kumwelekea bila kuleta lugha ya kizamani isiyo ya lazima.
- source_word: אַחֲרֵי זֹאת
  choice: baada ya hayo
  rationale: Ni usemi wa kawaida wa Kiswahili unaorejelea mambo yaliyotangulia, yaani dhambi na hali iliyosimuliwa.
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya Ezra kukosa la kusema na kuhifadhi uhusiano wa ufafanuzi kati ya sentensi hizi.
- source_word: עָזַבְנוּ
  choice: tumeziacha
  rationale: Kitenzi hiki kinaonyesha kuziacha amri na kutokuwa waaminifu kwa wajibu wa agano; umbo la wakati timilifu linaonyesha tendo lililotokea ambalo matokeo yake bado yana uzito.
- source_word: מִצְוֺתֶיךָ
  choice: amri zako
  rationale: Ni tafsiri ya kawaida, yenye hadhi na iliyo wazi ya maagizo ya Mungu katika muktadha wa agano.
theological_decisions:
- issue: Toni ya ungamo la Ezra
  choice: Swali la toba linaloonyesha hatia na kukosa la kusema mbele za Mungu
  alternative: Ombi la kawaida la kuongozwa kuhusu jambo la kusema baadaye
  rationale: Sababu inayofuata—kwamba wameziacha amri za Mungu—inaonyesha kuwa swali hili ni ungamo lenye uzito, si ombi lisiloegemea upande wowote. Tafsiri haiongezi maelezo yanayoondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayofaa sala ya toba. ‘Tuseme nini’ ni ya asili na inahifadhi kwa ufupi nguvu ya swali la Kiebrania.
