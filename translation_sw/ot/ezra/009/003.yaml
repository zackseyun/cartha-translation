  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/כְ/שָׁמְעִ/י֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה קָרַ֥עְתִּי אֶת בִּגְדִ֖/י וּ/מְעִילִ֑/י וָ/אֶמְרְטָ֞/ה מִ/שְּׂעַ֤ר רֹאשִׁ/י֙ וּ/זְקָנִ֔/י וָ/אֵשְׁבָ֖/ה מְשׁוֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/003.yaml
  text: As soon as I heard this matter[a], I tore my garment and my robe, pulled out some of the hair of my head and my beard[b], and sat appalled.
translation:
  language: sw
  text: Mara tu niliposikia habari hii[a], nilirarua vazi langu na joho langu, nikang’oa baadhi ya nywele za kichwa changu na za ndevu zangu[b], kisha nikaketi nikiwa nimepigwa na butwaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Niliposikia jambo hili...”
    reason: lexical_alternative
  - marker: b
    text: Kurarua mavazi na kung’oa nywele kulikuwa njia za kawaida za kuonyesha huzuni, hofu kuu, au maombolezo.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְשָׁמְעִי
  choice: Mara tu niliposikia
  rationale: Muundo huu unaonyesha wakati wa kusikia na pia mwitikio wa haraka, huku ukibaki wa kawaida katika Kiswahili cha sasa.
- source_word: הַדָּבָר הַזֶּה
  choice: habari hii
  rationale: דָּבָר inaweza kumaanisha neno, jambo, au taarifa. Katika muktadha huu Ezra anaitikia taarifa aliyopewa; “habari hii” ni ya asili bila kufunga maana kupita kiasi.
- source_word: קָרַעְתִּי
  choice: nilirarua
  rationale: Kitenzi kinaeleza kurarua mavazi kama ishara ya huzuni au mshtuko; “nilirarua” ni wazi na chenye hadhi.
- source_word: בִּגְדִי
  choice: vazi langu
  rationale: בֶּגֶד ni neno la jumla kwa vazi. Umoja umehifadhiwa na kutofautishwa na joho la nje linalofuata.
- source_word: וּמְעִילִי
  choice: na joho langu
  rationale: מְעִיל hurejelea joho au vazi la nje; “joho” ni neno linaloeleweka na linatofautisha mavazi hayo mawili.
- source_word: וָאֶמְרְטָה
  choice: nikang’oa
  rationale: Kitenzi kinaonyesha kuondoa nywele kwa nguvu. “Kung’oa” ni cha kawaida na kinaonyesha uzito wa tendo hilo.
- source_word: מִשְּׂעַר רֹאשִׁי וּזְקָנִי
  choice: baadhi ya nywele za kichwa changu na za ndevu zangu
  rationale: Kihusishi מִן kinaweza kuwa na maana ya kuchukua sehemu kutoka katika nywele, si lazima kuziondoa zote; “baadhi ya” huweka wazi maana hiyo ya kisehemu.
- source_word: וָאֵשְׁבָה
  choice: kisha nikaketi
  rationale: Kitenzi cha kawaida cha kuketi kinawasilishwa kwa ufupi; “kisha” huunganisha kwa kawaida mfuatano wa matendo.
- source_word: מְשׁוֹמֵם
  choice: nikiwa nimepigwa na butwaa
  rationale: Kishirikishi hiki kinaonyesha mtu aliyeshtushwa, kufadhaishwa, au kubaki kama aliyeganda. Usemi huu wa Kiswahili huwasilisha mshtuko mkubwa kuliko mshangao wa kawaida.
