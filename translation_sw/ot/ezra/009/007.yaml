- from: Tangu siku za babu zetu mpaka leo hii, tumekuwa na hatia kubwa. Kwa sababu ya maovu yetu, sisi, wafalme wetu na makuhani wetu tumetiwa mikononi mwa wafalme wa nchi mbalimbali, tukakabiliwa na upanga, utumwa, uporaji na aibu ya uso[a], kama ilivyo leo hii.
  to: Tangu siku za baba zetu mpaka leo hii, tumekuwa na hatia kubwa. Kwa sababu ya maovu yetu, sisi, wafalme wetu, na makuhani wetu tumetiwa mikononi mwa wafalme wa nchi, kwa upanga, kuwa mateka, uporaji, na aibu ya uso[a], kama ilivyo leo hii.
