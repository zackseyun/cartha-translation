language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ/ימֵ֣י אֲבֹתֵ֗י/נוּ אֲנַ֨חְנוּ֙ בְּ/אַשְׁמָ֣ה גְדֹלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בַ/עֲוֺנֹתֵ֡י/נוּ נִתַּ֡נּוּ אֲנַחְנוּ֩ מְלָכֵ֨י/נוּ כֹהֲנֵ֜י/נוּ בְּ/יַ֣ד מַלְכֵ֣י הָ/אֲרָצ֗וֹת בַּ/חֶ֜רֶב בַּ/שְּׁבִ֧י וּ/בַ/בִּזָּ֛ה וּ/בְ/בֹ֥שֶׁת פָּנִ֖ים כְּ/הַ/יּ֥וֹם הַ/זֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/007.yaml
  text: From the days of our fathers until this day[a], we have been in great guilt. Because of our iniquities, we, our kings, and our priests have been given into the hand of the kings of the lands, to the sword, to captivity, to plunder, and to shame of face, as it is this day.
translation:
  language: sw
  text: Tangu siku za baba zetu mpaka leo hii, tumekuwa na hatia kubwa. Kwa sababu ya maovu yetu, sisi, wafalme wetu, na makuhani wetu tumetiwa mikononi mwa wafalme wa nchi, kwa upanga, kuwa mateka, uporaji, na aibu ya uso[a], kama ilivyo leo hii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fedheha ya hadharani” au “kudhalilishwa”; kwa neno halisi, “aibu ya uso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִימֵי אֲבֹתֵינוּ
  choice: Tangu siku za babu zetu
  rationale: Kirai hiki huonyesha mwanzo wa kipindi kinachoendelea. “Babu zetu” ni Kiswahili cha kawaida kinachorejelea vizazi vya mababu bila kudokeza baba wa karibu tu.
- source_word: אֲנַחְנוּ בְּאַשְׁמָה גְדֹלָה
  choice: tumekuwa na hatia kubwa
  rationale: אַשְׁמָה hapa ni hali ya kuwa na hatia, si hisia ya kuona aibu. Wakati timilifu unaonyesha hali iliyoendelea tangu zamani mpaka wakati wa Ezra.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo hii
  rationale: Huhifadhi maana ya kuendelea hadi wakati wa sasa na msisitizo wa kiwakilishi הַזֶּה.
- source_word: וּבַעֲוֹנֹתֵינוּ
  choice: Kwa sababu ya maovu yetu
  rationale: בְּ ina nguvu ya kisababishi katika muktadha huu, na עָוֹן humaanisha maovu yenye hatia pamoja na athari zake.
- source_word: נִתַּנּוּ ... בְּיַד
  choice: tumetiwa mikononi mwa
  rationale: Kauli tendwa ya נָתַן na nahau בְּיַד zinaonyesha kutiwa chini ya mamlaka ya watawala wengine. Wingi “mikononi” ni nahau ya kawaida ya Kiswahili.
- source_word: מַלְכֵי הָאֲרָצוֹת
  choice: wafalme wa nchi mbalimbali
  rationale: אֲרָצוֹת hapa ni nchi au mataifa yaliyowazunguka, si dunia yote; “mbalimbali” huifanya maana ya wingi iwe wazi kwa Kiswahili cha kawaida.
- source_word: בַּחֶרֶב בַּשְּׁבִי וּבַבִּזָּה
  choice: tukakabiliwa na upanga, utumwa, uporaji
  rationale: 'Orodha hii huhifadhi aina tatu za hukumu: maangamizi ya vita, hali ya mateka, na kunyang''anywa mali. “Utumwa” hapa ni hali ya kuwa mateka, si lazima taasisi ya umiliki wa watumwa.'
- source_word: וּבְבֹשֶׁת פָּנִים
  choice: aibu ya uso
  rationale: Tafsiri hii huhifadhi taswira halisi ya Kiebrania ya fedheha inayoonekana hadharani; tanbihi inaeleza maana yake ya kawaida.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: kama ilivyo leo hii
  rationale: Hulinganisha hali ya sasa na hukumu zilizoelezwa na kuhifadhi msisitizo wa “siku hii.”
theological_decisions:
- issue: Kutofautisha אַשְׁמָה na עָוֹן katika ungamo
  choice: אַשְׁמָה limetafsiriwa “hatia,” na עָוֹן “maovu.”
  alternative: Kutafsiri yote mawili kwa neno pana “dhambi.”
  rationale: Kutofautisha maneno hayo huhifadhi mfuatano wa matendo maovu na hali ya hatia katika ungamo bila kuongeza mfumo maalumu wa kimadhehebu.
- issue: Mshikamano wa jumuiya katika ungamo
  choice: Kuhifadhi “sisi, wafalme wetu na makuhani wetu” kama kundi moja lililotiwa chini ya hukumu.
  alternative: Kupanga sentensi kwa namna inayotenganisha watu na viongozi wao.
  rationale: Kiebrania kinawajumuisha wazi watu, wafalme na makuhani katika ungamo na matokeo yake; tafsiri haipunguzi uwajibikaji huo wa pamoja.
- issue: Uhusiano kati ya maovu na hukumu
  choice: Kutafsiri בַּעֲוֹנֹתֵינוּ kwa kisababishi “Kwa sababu ya maovu yetu.”
  alternative: “Katika maovu yetu” au “kwa maovu yetu.”
  rationale: Muktadha unaonyesha maovu kuwa sababu ya kutiwa chini ya wafalme wa nchi nyingine, huku ukiacha wazi jinsi hukumu hiyo ilivyotekelezwa kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau “mikononi mwa” imetumiwa kwa uasilia; “aibu ya uso” imehifadhiwa kwa sababu ya taswira ya Kiebrania na kufafanuliwa katika tanbihi.
