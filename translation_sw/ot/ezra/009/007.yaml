review_pass:
  verdict: revise
  source_fidelity: Draft accurately preserves the temporal span, corporate confession, causal relation of the community's iniquities to judgment, and the concluding comparison with the present. However, “utumwa” normally denotes slavery in contemporary Standard East African Swahili and is too narrow for שְׁבִי, which denotes captivity. The recasting with “tukakabiliwa na” also weakens the Hebrew’s single passive ‘we ... were given/handed over’ governing the entire list.
  naturalness: The draft is generally clear and appropriately formal. “Baba zetu” is the established and natural biblical Swahili idiom for ancestors; it is preferable to “babu zetu,” which more readily suggests grandfathers. “Kuwa mateka” communicates captivity naturally and without importing the distinct institution of slavery.
  terminology: “Hatia kubwa,” “maovu yetu,” “mikononi mwa,” and “aibu ya uso” are appropriate. The footnote correctly identifies the literal wording and gives natural alternatives. “Wafalme wa nchi” adequately renders the plural ‘kings of the lands’; “mbalimbali” is unnecessary and slightly explicative.
  issues:
  - severity: medium
    issue: “Utumwa” for בַּשְּׁבִי
    rationale: In modern Swahili, utumwa chiefly means slavery. The Hebrew term refers to captivity/the condition of being captives, so “kuwa mateka” is more accurate and avoids narrowing the meaning.
  - severity: low
    issue: “Tukakabiliwa na” changes the construction of the judgment list
    rationale: The Hebrew states that the people, kings, and priests were handed over both to foreign kings and to the listed consequences. Retaining “tumetiwa ... kwa upanga, kuwa mateka...” better reflects that governing passive.
  - severity: low
    issue: “Babu zetu” and “nchi mbalimbali” are less exact choices
    rationale: “Baba zetu” is the conventional biblical idiom for ancestors and corresponds directly to ‘our fathers.’ “Nchi mbalimbali” adds an explicit sense of variety not required by ‘lands’; “nchi” naturally carries the plural sense in this possessive construction.
  revised_text: Tangu siku za baba zetu mpaka leo hii, tumekuwa na hatia kubwa. Kwa sababu ya maovu yetu, sisi, wafalme wetu, na makuhani wetu tumetiwa mikononi mwa wafalme wa nchi, kwa upanga, kuwa mateka, uporaji, na aibu ya uso[a], kama ilivyo leo hii.
  revised_footnotes:
  - marker: a
    text: Au, “fedheha ya hadharani” au “kudhalilishwa”; kwa neno halisi, “aibu ya uso.”
    reason: lexical_alternative
  revision_rationale: Revision preserves the Hebrew passive judgment formula and replaces the overly specific “utumwa” with “kuwa mateka,” which accurately conveys captivity. It also uses the established biblical idiom “baba zetu” and removes the unnecessary explicative “mbalimbali.” The literal expression “aibu ya uso” and its explanatory footnote are retained.
