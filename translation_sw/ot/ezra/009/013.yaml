source:
  edition: WLC
  text: וְ/אַֽחֲרֵי֙ כָּל הַ/בָּ֣א עָלֵ֔י/נוּ בְּ/מַעֲשֵׂ֨י/נוּ֙ הָ/רָעִ֔ים וּ/בְ/אַשְׁמָתֵ֖/נוּ הַ/גְּדֹלָ֑ה כִּ֣י אַתָּ֣ה אֱלֹהֵ֗י/נוּ חָשַׂ֤כְתָּֽ לְ/מַ֨טָּה֙ מֵֽ/עֲוֺנֵ֔/נוּ וְ/נָתַ֥תָּה לָּ֛/נוּ פְּלֵיטָ֖ה כָּ/זֹֽאת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/013.yaml
  text: And after all that has come upon us because of our evil deeds and our great guilt—though you, our God, have punished us less than our iniquities deserve and have given us such a remnant as this—
translation:
  language: sw
  text: Na baada ya hayo yote yaliyotupata kwa sababu ya matendo yetu maovu na hatia yetu kubwa—ingawa wewe, Mungu wetu, umetuadhibu kwa kiwango kidogo kuliko maovu yetu yalivyostahili[a], na umetupa mabaki kama haya[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umetuepusha zaidi ya vile maovu yetu yalivyostahili.” Nahau ya Kiebrania husema kihalisi kwamba Mungu alizuia hukumu yake isiwe kwa kiwango kinacholingana na hatia yao.
    reason: lexical_alternative
  - marker: b
    text: Au, “walionusurika” au “kuponyoka.” Neno hilo linawahusu wale waliohifadhiwa kupitia hukumu; “mabaki” hukazia mazingira ya jamii iliyobaki baada ya uhamisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי
  choice: Na baada ya
  rationale: Huhifadhi kiunganishi cha Kiebrania na kuonyesha kuwa sala ya Ezra inaendelea kutoka mstari uliotangulia.
- source_word: כָּל הַבָּא עָלֵינוּ
  choice: hayo yote yaliyotupata
  rationale: Ni Kiswahili cha kawaida kinachoeleza kwa uaminifu jumla ya misiba iliyowajia watu.
- source_word: בְּמַעֲשֵׂינוּ הָרָעִים
  choice: kwa sababu ya matendo yetu maovu
  rationale: Hufanya wazi maana ya kisababishi ya בְּ katika muktadha na kuhifadhi uzito wa maadili wa matendo hayo.
- source_word: וּבְאַשְׁמָתֵנוּ הַגְּדֹלָה
  choice: na hatia yetu kubwa
  rationale: אַשְׁמָה hapa ni hali halisi ya kuwa na hatia, si hisia ya kujiona mwenye hatia.
- source_word: כִּי
  choice: ingawa
  rationale: 'Katika mtiririko huu neno hilo lina maana ya kukubali tofauti: licha ya hatia na yaliyowapata, Mungu aliwaonyesha rehema.'
- source_word: חָשַׂכְתָּ לְמַטָּה מֵעֲוֺנֵנוּ
  choice: umetuadhibu kwa kiasi kidogo kuliko uovu wetu ulivyostahili
  rationale: Hueleza kwa Kiswahili cha asili nahau inayosema kwamba Mungu hakuwatendea kwa kipimo kamili kilichostahiliwa na uovu wao, huku tanbihi ikihifadhi taswira ya moja kwa moja ya ‘kuzuia’ au ‘kuacha’.
- source_word: עָוֺן
  choice: uovu wetu
  rationale: Neno hili linabeba dhana ya kosa lenye hatia na pia wajibu wake; ‘uovu’ huhifadhi uzito huo bila kurudia ‘hatia’ ya kishazi kilichotangulia.
- source_word: וְנָתַתָּה לָּנוּ
  choice: na umetupa
  rationale: Kauli timilifu yenye matokeo yanayoendelea imewasilishwa kwa wakati timilifu wa Kiswahili.
- source_word: פְּלֵיטָה
  choice: mabaki
  rationale: Katika mazingira ya baada ya uhamisho neno hili linaonyesha jamii iliyobaki hai baada ya hukumu; ‘mabaki’ ni istilahi ya kawaida ya kibiblia kwa kundi hilo.
- source_word: כָּזֹאת
  choice: kama haya
  rationale: Kiwakilishi hiki huonyesha kwa msisitizo mabaki halisi yaliyokuwa mbele ya Ezra kama ushahidi wa rehema.
theological_decisions:
- issue: Rehema ya Mungu ikilinganishwa na hukumu iliyostahiliwa
  choice: umetuadhibu kwa kiasi kidogo kuliko uovu wetu ulivyostahili
  alternative: umetuepusha zaidi ya vile uovu wetu ulivyoruhusu
  rationale: Chaguo kuu linaweka wazi kwamba hukumu ilikuwa ndogo kuliko ilivyostahiliwa, bila kufuta haki wala rehema ya Mungu. Tanbihi inadumisha uwezekano wa kuieleza nahau kwa lugha ya kuepusha.
- issue: Maana ya פְּלֵיטָה baada ya uhamisho
  choice: mabaki
  alternative: walionusurika; njia ya kuponyoka
  rationale: ‘Mabaki’ huonyesha kundi la watu lililohifadhiwa kupitia hukumu katika muktadha wa kihistoria wa Ezra, huku tanbihi ikionyesha upana wa maana ya neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Mstari umeachwa na kistari kirefu mwishoni kwa sababu kisarufi na kimawazo unaendelea katika Ezra 9:14.
