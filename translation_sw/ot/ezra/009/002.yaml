source:
  edition: WLC
  text: כִּֽי נָשְׂא֣וּ מִ/בְּנֹֽתֵי/הֶ֗ם לָ/הֶם֙ וְ/לִ/בְנֵי/הֶ֔ם וְ/הִתְעָֽרְבוּ֙ זֶ֣רַע הַ/קֹּ֔דֶשׁ בְּ/עַמֵּ֖י הָ/אֲרָצ֑וֹת וְ/יַ֧ד הַ/שָּׂרִ֣ים וְ/הַ/סְּגָנִ֗ים הָֽיְתָ֛ה בַּ/מַּ֥עַל הַ/זֶּ֖ה רִאשׁוֹנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/002.yaml
  text: For they have taken some of their daughters for themselves and for their sons[a], and the holy seed has mixed itself with the peoples of the lands[c][b]. And the hand of the officials and the deputies has been foremost in this unfaithfulness.
translation:
  language: sw
  text: Kwa maana wamewachukua baadhi ya binti zao kuwa wake wao na wa wana wao[a], na uzao mtakatifu[b] umechanganyika na watu wa nchi mbalimbali. Wakuu na maafisa ndio wamekuwa mstari wa mbele katika ukosefu huu wa uaminifu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wamechukua baadhi ya binti zao katika ndoa.” Kiebrania kinasema kihalisi, “wamechukua kutoka miongoni mwa binti zao.”
    reason: lexical_alternative
  - marker: b
    text: “Uzao mtakatifu” pia unaweza kutafsiriwa “wazao watakatifu.” Kiebrania kinahifadhi lugha ya nasaba ya jumuiya ya agano.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “mkono wa wakuu na maafisa ulikuwa wa kwanza katika ukosefu huu wa uaminifu”; nahau hiyo inamaanisha kwamba wao waliongoza katika kosa hili na walikuwa na wajibu mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשְׂאוּ מִבְּנֹתֵיהֶם
  choice: wamewachukua baadhi ya binti zao kuwa wake
  rationale: Kitenzi נָשָׂא kimsingi ni ‘chukua/beba,’ lakini katika muktadha huu kinamaanisha kuwachukua wanawake katika ndoa. Kuongeza ‘kuwa wake’ huzuia kauli ya Kiswahili kueleweka kama kutwaa tu, huku ‘baadhi ya’ ikiwakilisha matumizi ya sehemu ya מִן.
- source_word: לָהֶם וְלִבְנֵיהֶם
  choice: kuwa wake zao wenyewe na wa wana wao
  rationale: Herufi ל inaonyesha wale ambao wanawake hao walichukuliwa kwa ajili yao; muundo huu unaonyesha wazi kwamba ndoa hizo zilihusu wanaume wenyewe na wana wao.
- source_word: וְהִתְעָרְבוּ
  choice: umechanganyika
  rationale: Hithpael inaonyesha kuchanganyika au kuingiliana. Umoja wa kitenzi unaafikiana na kiima cha umoja ‘uzao.’
- source_word: זֶרַע הַקֹּדֶשׁ
  choice: uzao mtakatifu
  rationale: ‘Uzao’ huhifadhi lugha ya nasaba na mwendelezo wa jumuiya ya agano bila kuifanya kuwa nadharia ya kibaguzi au ya kibiolojia pekee.
- source_word: בְּעַמֵּי הָאֲרָצוֹת
  choice: na watu wa nchi mbalimbali
  rationale: Kauli hii inadumisha wingi wa ‘watu’ na ‘nchi’ kwa Kiswahili cha kawaida, ikirejelea jamii za maeneo yaliyowazunguka.
- source_word: הַשָּׂרִים וְהַסְּגָנִים
  choice: wakuu na maafisa
  rationale: Majina haya yanataja viongozi na wasimamizi wa utawala. ‘Wakuu na maafisa’ ni ya sasa na hayaingizii vyeo vya kifalme visivyolazimishwa na muktadha.
- source_word: מַעַל
  choice: ukosefu wa uaminifu
  rationale: מעל mara nyingi humaanisha kuvunja uaminifu, hasa uaminifu wa agano; tafsiri hii huhifadhi uzito wake wa kimaadili na wa kiagano.
- source_word: וְיַד ... רִאשׁוֹנָה
  choice: ndio wamekuwa mstari wa mbele
  rationale: Hii inawasilisha maana ya nahau ya Kiebrania kwamba viongozi hao waliongoza katika kosa na walibeba wajibu mkubwa, badala ya kudokeza tu mpangilio wa wakati.
theological_decisions:
- issue: Maana ya ‘uzao mtakatifu’ katika habari ya ndoa na watu wa mataifa mengine
  choice: Kudumisha usemi wa kiagano ‘uzao mtakatifu’ bila kuufafanua kama nadharia ya kikabila au kibaguzi.
  alternative: Kutafsiri ‘wazao watakatifu’ au kuueleza moja kwa moja kama usafi wa kikabila.
  rationale: Kiebrania kinatumia lugha yenye nguvu ya nasaba ya jumuiya takatifu. Tafsiri inapaswa kuihifadhi ndani ya muktadha wa agano baada ya uhamisho bila kuingiza makundi ya kibaguzi ya baadaye.
- issue: Wajibu wa viongozi katika kosa
  choice: Kutafsiri nahau kwa ‘wamekuwa mstari wa mbele’ ili kuonyesha uongozi wao katika kosa na wajibu wao mkubwa.
  alternative: Kuhifadhi neno kwa neno ‘mkono wa wakuu na maafisa ulikuwa wa kwanza.’
  rationale: Muundo wa neno kwa neno si wa kawaida katika Kiswahili na unaweza kuficha maana; tanbihi huhifadhi picha halisi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa asili kwa msomaji wa kawaida; istilahi ‘uzao mtakatifu’ imehifadhiwa kwa sababu ya uzito wake wa kiagano, huku nahau ya ‘mkono’ ikielezwa katika tanbihi.
