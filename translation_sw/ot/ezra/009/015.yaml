reference: Ezra 9:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ צַדִּ֣יק אַ֔תָּה כִּֽי נִשְׁאַ֥רְנוּ פְלֵיטָ֖ה כְּ/הַ/יּ֣וֹם הַ/זֶּ֑ה הִנְ/נ֤וּ לְ/פָנֶ֨י/ךָ֙ בְּ/אַשְׁמָתֵ֔י/נוּ כִּ֣י אֵ֥ין לַ/עֲמ֛וֹד לְ/פָנֶ֖י/ךָ עַל זֹֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/015.yaml
  text: O Yahweh[a], God of Israel, you are righteous, for we have been left as a remnant, as it is this day. Here we are before you in our guilt[c][b], for no one can stand before you because of this.
translation:
  language: sw
  text: Ee Yahweh, Mungu wa Israeli, wewe ni mwenye haki, kwa maana sisi tumeachwa tukiwa mabaki yaliyosalia[a], kama ilivyo leo hii. Tazama, tuko mbele zako katika hatia yetu; kwa sababu ya jambo hili hakuna awezaye kusimama mbele zako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waokokaji” au “mabaki ya watu walioponyoka.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “hakuna kusimama mbele zako kwa sababu ya jambo hili”; maana yake ni kwamba mwenye hatia hawezi kudumu au kustahimili mbele za Mungu.'
    reason: idiom_explanation
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetafsiriwa moja kwa moja kwa umbo linalotambulika katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo huu wa kawaida unahifadhi anwani ya moja kwa moja na uhusiano wa Mungu na Israeli.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Huwasilisha wema na uadilifu wa Mungu katika hukumu bila kuupunguza maana kuwa haki ya kimahakama pekee.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי ya kwanza inatanguliza msingi wa kukiri kwamba Mungu ni mwenye haki.
- source_word: נִשְׁאַרְנוּ
  choice: tumeachwa
  rationale: 'Huhifadhi hali ya kutendewa ya Nifali: watu wameachwa au wamesazwa baada ya hukumu.'
- source_word: פְלֵיטָה
  choice: mabaki yaliyookoka
  rationale: Neno linarejelea waliosalia baada ya kuponyoka maangamizi; kifungu hiki huunganisha dhana za mabaki na waokokaji.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: kama ilivyo leo hii
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha hali inayoonekana wakati huo.
- source_word: הִנְנוּ לְפָנֶיךָ
  choice: Tazama, tuko mbele zako
  rationale: “Tazama” huhifadhi nguvu ya neno la kuwasilisha הִנְנוּ, huku “mbele zako” ikihifadhi taswira ya kuwapo mbele za Mungu.
- source_word: בְּאַשְׁמָתֵינוּ
  choice: katika hatia yetu
  rationale: Hueleza hali yao ya kuwa na hatia mbele za Mungu, si hisia ya kujiona na hatia tu.
- source_word: כִּי אֵין לַעֲמוֹד לְפָנֶיךָ
  choice: hakuna awezaye kusimama mbele zako
  rationale: Muundo usio na mhusika maalumu umehifadhiwa kwa kauli ya jumla, na “kusimama mbele” hubeba maana ya kutoweza kudumu au kustahimili mbele za Mungu.
- source_word: עַל זֹאת
  choice: kwa sababu ya jambo hili
  rationale: Huhifadhi nguvu ya kisababishi na kurejelea hatia iliyokiriwa katika muktadha.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulifanya cheo.
- issue: Maana ya צַדִּיק kuhusu Mungu
  choice: mwenye haki
  alternative: mwadilifu
  rationale: “Mwenye haki” huhifadhi upana wa maana ya kimaadili na kimahakama bila kufafanua zaidi namna haki ya Mungu inavyohusiana na kuachwa kwa mabaki.
- issue: Uhusiano wa kifungu cha mwisho na hatia
  choice: kwa sababu ya jambo hili hakuna awezaye kusimama mbele zako
  alternative: kwa maana hakuna kusimama mbele zako kwa sababu ya jambo hili
  rationale: Kauli ya kisababishi imehifadhiwa, bila kugeuza כִּי kuwa kauli ya utofautishaji kama “ingawa.” Jambo linalorejelewa limeachwa kwa upana wake wa kimuktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala ya kukiri lakini kinachoeleweka kwa msomaji wa kawaida. “Ee” limetumiwa katika mwito wa moja kwa moja; “Tazama” limehifadhiwa kwa kuwa presentative ya Kiebrania ina uzito wa kimatamshi hapa.
