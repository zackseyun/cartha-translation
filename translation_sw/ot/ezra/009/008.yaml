  text: וְ/עַתָּ֡ה כִּ/מְעַט רֶגַע֩ הָיְתָ֨ה תְחִנָּ֜ה מֵ/אֵ֣ת יְהוָ֣ה אֱלֹהֵ֗י/נוּ לְ/הַשְׁאִ֥יר לָ֨/נוּ֙ פְּלֵיטָ֔ה וְ/לָ/תֶת לָ֥/נוּ יָתֵ֖ד בִּ/מְק֣וֹם קָדְשׁ֑/וֹ לְ/הָאִ֤יר עֵינֵ֨י/נוּ֙ אֱלֹהֵ֔י/נוּ וּ/לְ/תִתֵּ֛/נוּ מִֽחְיָ֥ה מְעַ֖ט בְּ/עַבְדֻתֵֽ/נוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/008.yaml
  text: But now[a], for a brief moment, favor has come from Yahweh our God, to leave us a remnant that has escaped and to give us a peg in his holy place[c][b], so that our God may brighten our eyes and give us a little reviving in our slavery.
translation:
  language: sw
  text: Lakini sasa, kwa muda mfupi, kumekuwa na kibali kutoka kwa Yahwe Mungu wetu, cha kutuachia mabaki ya watu waliookoka na kutupa kigingi katika mahali pake patakatifu[a], ili Mungu wetu ayaangaze macho yetu[b] na kutupa uhai kidogo katika utumwa wetu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pa kushikilia imara.” Kiebrania kinadumisha taswira ya kigingi kilichowekwa imara.
    reason: lexical_alternative
  - marker: b
    text: Au, “ayape macho yetu mwanga.” Nahau hii inaonyesha kurejeshewa uhai, nguvu, au tumaini.
    reason: lexical_alternative
  - marker: c
    text: Au, “katika hali yetu ya kutiishwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחִנָּה
  choice: kibali
  rationale: Katika muundo הָיְתָה ... מֵאֵת יְהוָה, neno hili linaonyesha kibali au rehema iliyotoka kwa Yahwe, si tendo la Israeli la kuomba.
- source_word: כִּמְעַט רֶגַע
  choice: kwa muda mfupi
  rationale: Huhifadhi wazo la kipindi kifupi cha nafuu kwa Kiswahili cha kawaida na fasaha.
- source_word: פְּלֵיטָה
  choice: mabaki waliookoka
  rationale: Hujumuisha maana mbili za kundi lililosalia na watu walionusurika au kuponyoka.
- source_word: יָתֵד
  choice: kigingi
  rationale: Huhifadhi taswira halisi ya kitu kilichowekwa imara badala ya kuibadili moja kwa moja kuwa maana yake ya sitiari.
- source_word: בִּמְקוֹם קָדְשׁוֹ
  choice: katika mahali pake patakatifu
  rationale: Ni tafsiri ya karibu inayodokeza mazingira ya hekalu bila kuongeza ubainishaji usio katika maneno yenyewe.
- source_word: לְהָאִיר עֵינֵינוּ
  choice: ayatie nuru macho yetu
  rationale: Huhifadhi nahau ya Kiebrania inayomaanisha kurejeshewa nguvu, uhai, au tumaini.
- source_word: מִחְיָה מְעַט
  choice: uhai kidogo
  rationale: Huhifadhi lugha ya uhai na kiwango kidogo cha nafuu; ni wazi na ya asili katika muktadha huu.
- source_word: בְּעַבְדֻתֵנוּ
  choice: katika utumwa wetu
  rationale: Huhifadhi uzito wa hali ya kutiishwa chini ya mamlaka ya kigeni kuliko neno laini kama 'utumishi'.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina la agano la Mungu lililoandikwa kwa herufi YHWH katika matini ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini inatumia jina la Mungu YHWH; 'Yahwe' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya יָתֵד katika mahali patakatifu
  choice: Kudumisha taswira ya 'kigingi'
  alternative: mahali salama au nafasi thabiti
  rationale: Kiebrania kina sitiari halisi inayoweza kumaanisha uthabiti au mahali pa kushikilia; tafsiri kuu haifungi maana hiyo kwa ufafanuzi mmoja.
- issue: Hali ya watu chini ya utawala wa kigeni
  choice: utumwa wetu
  alternative: utumishi wetu au hali yetu ya kutiishwa
  rationale: Neno עַבְדוּת lina nguvu ya utumwa au ufungwa; tafsiri hii hudumisha mvutano wa kuwa wamepata nafuu huku bado wametiishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umefanywa wa asili bila kuondoa taswira za Kiebrania. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
