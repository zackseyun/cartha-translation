reference: Ezra 9:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ֠/עַתָּה בְּֽנוֹתֵי/כֶ֞ם אַל תִּתְּנ֣וּ לִ/בְנֵי/הֶ֗ם וּ/בְנֹֽתֵי/הֶם֙ אַל תִּשְׂא֣וּ לִ/בְנֵי/כֶ֔ם וְ/לֹֽא תִדְרְשׁ֧וּ שְׁלֹמָ֛/ם וְ/טוֹבָתָ֖/ם עַד עוֹלָ֑ם לְמַ֣עַן תֶּחֶזְק֗וּ וַ/אֲכַלְתֶּם֙ אֶת ט֣וּב הָ/אָ֔רֶץ וְ/הוֹרַשְׁתֶּ֥ם לִ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/012.yaml
  text: So now[a], do not give your daughters to their sons, and do not take their daughters for your sons. Never seek their peace or their prosperity[b], so that you may be strong and eat the good of the land and leave it as an inheritance to your sons forever.
translation:
  language: sw
  text: Basi sasa, msiwaoze binti zenu kwa wana wao, wala msiwaozeshe wana wenu na binti zao. Msitafute kamwe[a] amani yao wala ustawi wao, ili mpate kuwa na nguvu, mle mema ya nchi, na kuwafanya wana wenu warithi milele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri ya neno kwa neno: “msitafute amani yao wala mema yao milele.”'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hakitaji wazi kitu kinachorithishwa; huenda ni nchi au mema ya nchi.
    reason: genuine_ambiguity
lexical_decisions:
- source_word: בְּנוֹתֵיכֶם ... לִבְנֵיהֶם
  choice: msiwaoze binti zenu kwa wana wao
  rationale: Kauli ya Kiebrania ni ‘msiwape binti zenu wana wao,’ lakini katika muktadha huu kutoa binti kwa mwana ni kumwoza. Kiswahili cha sasa huhitaji kitenzi ‘kuoza’ ili maana ya ndoa iwe wazi na ya kawaida.
- source_word: וּבְנֹתֵיהֶם אַל תִּשְׂאוּ לִבְנֵיכֶם
  choice: msiwachukulie wana wenu binti zao
  rationale: נשא hapa ni nahau ya kuchukua katika ndoa. ‘Kuwachukulia wana wenu’ huhifadhi uelekeo wa kirai cha Kiebrania na usambamba wa sentensi bila kuongeza ‘kuwa wake.’
- source_word: תִדְרְשׁוּ
  choice: msitafute
  rationale: דרש humaanisha kutafuta au kujitahidi kupata. ‘Msitafute’ ni kisawe cha moja kwa moja na huonyesha kuwahangaikia kwa bidii.
- source_word: שְׁלֹמָם
  choice: amani yao
  rationale: שָׁלוֹם inaweza kumaanisha amani, hali njema, au ustawi. ‘Amani’ huhifadhi neno la msingi, huku nomino inayofuata ikipanua wazo la hali njema.
- source_word: וְטוֹבָתָם
  choice: ustawi wao
  rationale: טוֹבָה hapa ni mema, manufaa, au hali njema. ‘Ustawi’ hutofautisha wazo hili na ‘amani’ na kueleza vizuri manufaa yao ya kijamii na kimwili.
- source_word: עַד עוֹלָם
  choice: kamwe
  rationale: Katika amri hasi, kirai hiki cha muda usio na mwisho huwasilishwa kwa Kiswahili cha kawaida na chenye nguvu kama ‘kamwe.’ Maana halisi zaidi imeonyeshwa katika tanbihi [a].
- source_word: לְמַעַן תֶּחֶזְקוּ
  choice: ili mpate kuwa na nguvu
  rationale: לְמַעַן huonyesha kusudi au matokeo, na חזק katika Qal humaanisha kuwa au kuzidi kuwa na nguvu. Tafsiri hii inahifadhi yote mawili.
- source_word: וַאֲכַלְתֶּם אֶת טוּב הָאָרֶץ
  choice: mle mema ya nchi
  rationale: Tafsiri hii huhifadhi taswira halisi ya ‘kula mema ya nchi,’ ambayo kwa muktadha humaanisha kufurahia mazao na wingi wa nchi.
- source_word: וְהוֹרַשְׁתֶּם
  choice: kuwaachia ... iwe urithi
  rationale: 'Hiphil ya ירש ni ya kisababishi: kufanya kitu kirithiwe au kukipitisha kwa warithi. Kiswahili cha kawaida hueleza hilo kwa ‘kuwaachia ... iwe urithi.’'
- source_word: לִבְנֵיכֶם
  choice: wana wenu
  rationale: Kiebrania kimetaja ‘wana’ kwa umbo la kiume la wingi. Tafsiri haibadili hilo kuwa ‘watoto,’ ingawa vizazi vinavyofuata vinaweza kuwa katika upeo mpana.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Mwisho wa aya, kirai hiki kinaeleza kudumu kwa urithi. ‘Milele’ ni tafsiri fupi na ya kawaida.
theological_decisions:
- issue: Lugha ya kujitenga kikabila na kidini katika muktadha wa agano baada ya uhamisho
  choice: Katazo la kuoana na la kutafuta amani au ustawi wa watu hao limetafsiriwa moja kwa moja katika muktadha wake wa kihistoria wa agano.
  alternative: Kulainisha kuwa onyo la jumla dhidi ya mahusiano yenye madhara ya kiroho, au kulipanua kuwa amri ya kudumu kuhusu watu wote wa nje.
  rationale: Aya yenyewe inatoa amri kali katika mazingira ya Ezra baada ya uhamisho. Tafsiri haipaswi kupunguza ukali wake wala kuingiza matumizi mapana ya kimafundisho yasiyotajwa na matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kuoza’ na ‘kuchukulia’ zinaweka wazi muktadha wa ndoa huku zikihifadhi usambamba. Tanbihi [b] inalinda utata wa kiwakilishi kinachodokezwa katika Kiebrania badala ya kuamua kimya kimya kati ya nchi na mema ya nchi.
