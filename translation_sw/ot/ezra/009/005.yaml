base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/005.yaml
  text: At the evening offering I rose from my fasting[a], with my garment and my robe torn, and I fell on my knees and spread out my hands to Yahweh my God.
translation:
  language: sw
  text: Wakati wa sadaka ya jioni[a], niliinuka kutoka katika kufunga kwangu, huku vazi langu na joho langu vikiwa vimeraruliwa. Kisha nikapiga magoti na kunyoosha mikono yangu kuelekea kwa Yahwe, Mungu wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana mahususi zaidi, “sadaka ya nafaka ya jioni.” Neno la Kiebrania mara nyingi humaanisha sadaka ya nafaka, ingawa hapa linaweza kutaja kwa upana wakati wa sadaka ya jioni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמִנְחַת הָעֶרֶב
  choice: Wakati wa sadaka ya jioni
  rationale: מִנְחָה inaweza kumaanisha zawadi au sadaka, na mara nyingi sadaka ya nafaka. Katika muktadha huu, kirai kizima kinaonyesha wakati wa ibada ya sadaka ya jioni; ‘sadaka ya jioni’ ni ya kawaida kwa Kiswahili huku maana mahususi zaidi ikiwekwa katika tanbihi.
- source_word: קַמְתִּי מִתַּעֲנִיתִי
  choice: niliinuka kutoka katika kufunga kwangu
  rationale: קום ni kuinuka, na תַּעֲנִית hapa inaelekea kutaja kufunga kama tendo la kujinyenyekeza na kuomboleza. Tafsiri inahifadhi uhusiano wa moja kwa moja wa ‘kuinuka kutoka’ bila kuufanya kuwa ‘baada ya’ pekee.
- source_word: וּבְקָרְעִי בִגְדִי וּמְעִילִי
  choice: huku nguo yangu na joho langu zikiwa zimeraruliwa
  rationale: Kirai kinaonyesha hali iliyoandamana na kuinuka kwa Ezra. ‘Nguo’ na ‘joho’ zinadumisha tofauti kati ya בֶּגֶד na מְעִיל, na hali ya kuraruliwa inaonyesha maombolezo.
- source_word: וָאֶכְרְעָה עַל בִּרְכַּי
  choice: nikapiga magoti
  rationale: כרע ina maana ya kupiga au kukunja magoti. ‘Kupiga magoti’ ni usemi wa kawaida na wenye heshima katika Kiswahili kwa tendo la kuingia katika mkao wa sala.
- source_word: וָאֶפְרְשָׂה כַפַּי
  choice: na kunyoosha mikono yangu
  rationale: פרשׂ pamoja na כף inaeleza kufungua au kunyoosha viganja/mikono katika sala. ‘Kunyoosha mikono’ ni ya asili katika Kiswahili na inaweka wazi ishara hiyo ya kimwili.
- source_word: אֶל יְהוָה אֱלֹהָי
  choice: kwa Yahwe, Mungu wangu
  rationale: אֶל katika muktadha wa sala inaelekeza tendo hilo kwa Mungu. Jina la agano יְהוָה limetoholewa kuwa ‘Yahwe’, na אֱלֹהָי ni ‘Mungu wangu’.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu lenye herufi nne. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Joho’ linatofautishwa na ‘nguo’, na sentensi imegawanywa ili mtiririko wake uwe wa asili bila kupoteza mfululizo wa matendo ya Kiebrania.
