base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/014.yaml
  text: Shall we again break your commandments and intermarry with the peoples of these abominations? Would you not be angry with us until you had consumed us[b][a], leaving no remnant or survivor?
translation:
  language: sw
  text: Je, tutarudia kuvunja amri zako na kuoana na mataifa yenye machukizo haya?[a] Je, hungetukasirikia mpaka ukatuangamiza kabisa, bila kuacha mabaki wala manusura?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi: “na mataifa ya machukizo haya.” Huenda Kiebrania kinamaanisha mataifa yanayotambulishwa kwa matendo hayo ya kuchukiza.'
    reason: lexical_alternative
  - marker: b
    text: Au, “bila kuacha waliosalia wala manusura.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָשׁוּב
  choice: tutarudia tena
  rationale: Kitenzi שוב kimsingi humaanisha kurudi; hapa swali la balagha linahusu kurejea katika uasi wa awali, hivyo usemi huu unaonyesha kurudia tendo.
- source_word: לְהָפֵר
  choice: kuvunja
  rationale: Katika muktadha wa sheria na agano, הפר humaanisha kuvunja au kukiuka; “kuvunja amri” ni usemi wa kawaida na wenye uzito unaofaa.
- source_word: מִצְוֺתֶיךָ
  choice: amri zako
  rationale: Inahifadhi wingi na kiambishi cha nafsi ya pili umoja kinachomwelekea Mungu moja kwa moja.
- source_word: וּלְהִתְחַתֵּן
  choice: kuoana
  rationale: Hitpaeli ya חתן hueleza kuingia katika mahusiano ya ndoa baina ya makundi; “kuoana” ni ya asili na inaonyesha hali ya pande mbili.
- source_word: בְּעַמֵּי הַתֹּעֵבוֹת הָאֵלֶּה
  choice: na mataifa yenye machukizo haya
  rationale: Muundo wa Kiebrania ni kwa karibu “na mataifa ya machukizo haya.” “Yenye machukizo haya” huhifadhi ufupi na utata wa uhusiano huo bila kudai kwamba kabila lenyewe ndilo chukizo au kuongeza wazi kitenzi “yanayotenda.”
- source_word: הֲלוֹא תֶאֱנַף בָּנוּ
  choice: Je, hungetukasirikia
  rationale: אנף huonyesha hasira kali ya Mungu; “kutukasirikia” ni Kiswahili cha kawaida kinachofaa katika swali hili la balagha.
- source_word: עַד כַּלֵּה
  choice: mpaka ukatuangamiza kabisa
  rationale: כלה hapa huonyesha kufikisha mwisho au kuharibu kikamilifu; tafsiri hii huwasilisha kwa uwazi tishio la maangamizi kamili.
- source_word: לְאֵין שְׁאֵרִית וּפְלֵיטָה
  choice: pasibaki mabaki wala mtu aliyeokoka
  rationale: לְאֵין huonyesha matokeo ya kutokuwapo kabisa; שְׁאֵרִית ni kile kinachosalia, na פְלֵיטָה inaweza kumaanisha aliyeponyoka au aliyeokoka.
theological_decisions:
- issue: Uhusiano wa mataifa na “machukizo”
  choice: mataifa yenye machukizo haya
  alternative: mataifa yanayotenda machukizo haya; mataifa ya machukizo haya
  rationale: Tafsiri iliyochaguliwa inafuata muundo uliobanwa wa Kiebrania na kuelekeza sifa hiyo kwa machukizo yanayohusishwa nao bila kuifanya kuwa hukumu ya asili ya kikabila. Tanbihi huhifadhi tafsiri halisi zaidi.
- issue: Lugha ya mabaki baada ya hukumu
  choice: mabaki wala mtu aliyeokoka
  alternative: waliosalia wala walioponyoka
  rationale: “Mabaki” huhifadhi mwangwi muhimu wa kibiblia wa שְׁאֵרִית, huku “mtu aliyeokoka” ikiwasilisha maana halisi ya mtu aliyenusurika katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Maswali ya balagha na uzito wa sala ya Ezra vimehifadhiwa; “machukizo” na “mabaki” zimetumiwa kwa mwangwi wa lugha ya kibiblia bila kufanya sentensi isiwe ya kawaida.
