  text: אֲשֶׁ֣ר צִוִּ֗יתָ בְּ/יַ֨ד עֲבָדֶ֣י/ךָ הַ/נְּבִיאִים֮ לֵ/אמֹר֒ הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֤ם בָּאִים֙ לְ/רִשְׁתָּ֔/הּ אֶ֤רֶץ נִדָּה֙ הִ֔יא בְּ/נִדַּ֖ת עַמֵּ֣י הָ/אֲרָצ֑וֹת בְּ/תוֹעֲבֹֽתֵי/הֶ֗ם אֲשֶׁ֥ר מִלְא֛וּ/הָ מִ/פֶּ֥ה אֶל פֶּ֖ה בְּ/טֻמְאָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/011.yaml
  text: which you commanded by the hand of your servants the prophets[a], saying, ‘The land that you are entering to possess is a land of impurity because of the impurity of the peoples of the lands[b], because of their abominations with which they have filled it from end to end with their uncleanness.’
translation:
  language: sw
  text: ambayo uliamuru kwa mkono wa watumishi wako manabii, ukisema, “Nchi mnayoingia kuimiliki ni nchi yenye unajisi[a] kwa sababu ya unajisi wa watu wa nchi hizo, kwa sababu ya machukizo yao ambayo wameijaza kutoka upande mmoja hadi mwingine[b] kwa unajisi wao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchi najisi.” Neno la Kiebrania linaonyesha hali ya kutiwa najisi na linaweza kuwa na maana za kiibada na za kimaadili.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa maana halisi, “kutoka kinywa hadi kinywa”; ni nahau inayomaanisha kwamba nchi yote ilijazwa kabisa, kutoka upande mmoja hadi mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: kwa mkono wa
  rationale: Inahifadhi nahau ya Kiebrania inayoonyesha kwamba Mungu alitoa amri kupitia kwa watumishi wake, bila kupoteza picha ya ‘mkono.’
- source_word: עֲבָדֶיךָ הַנְּבִיאִים
  choice: watumishi wako manabii
  rationale: ‘Watumishi’ ni neno la heshima linalofaa kwa mawakala wa Mungu; ‘manabii’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: לְרִשְׁתָּהּ
  choice: kuimiliki
  rationale: Kitenzi kina maana ya kuchukua na kumiliki nchi; ‘kuimiliki’ ni kifupi, cha asili, na kinadumisha wazo la umiliki wa nchi.
- source_word: אֶרֶץ נִדָּה
  choice: nchi yenye unajisi
  rationale: ‘Unajisi’ hudumisha lugha ya kutiwa najisi bila kuamua kwamba maana ni ya kiibada pekee au ya kimaadili pekee.
- source_word: בְּנִדַּת עַמֵּי הָאֲרָצוֹת
  choice: kwa sababu ya unajisi wa watu wa nchi hizo
  rationale: Kiambishi בְּ kinaeleweka kwa maana ya sababu katika muktadha huu; ‘watu wa nchi hizo’ kinahifadhi wingi wa nchi kwa Kiswahili cha kawaida.
- source_word: בְּתוֹעֲבֹתֵיהֶם
  choice: kwa sababu ya machukizo yao
  rationale: ‘Machukizo’ yanahifadhi uzito wa neno la Kiebrania kuhusu matendo yanayochukiza katika muktadha wa agano na maadili.
- source_word: מִלְאוּהָ
  choice: wameijaza nchi hiyo
  rationale: Umbo hili linaonyesha kitendo kilichotendeka na hali yake inayoendelea; kutaja tena ‘nchi hiyo’ huondoa utata wa kiwakilishi kwa Kiswahili.
- source_word: מִפֶּה אֶל־פֶּה
  choice: kutoka upande mmoja hadi mwingine
  rationale: Hii inawasilisha maana ya nahau ya eneo lote kwa Kiswahili cha sasa, huku maana yake halisi ikielezwa katika tanbihi.
- source_word: בְּטֻמְאָתָם
  choice: kwa uchafu wao
  rationale: ‘Uchafu’ linatofautisha kidogo neno hili na נִדָּה lililotafsiriwa ‘unajisi,’ huku likidumisha wazo la kuchafua au kutia najisi.
theological_decisions:
- issue: Asili ya lugha kuhusu kutiwa najisi kwa nchi
  choice: Kutumia ‘unajisi,’ ‘machukizo,’ na ‘uchafu’ bila kuiwekea mipaka maana kuwa ya kiibada pekee au ya kimaadili pekee.
  alternative: Kutafsiri maneno yote kama uchafu wa kiibada tu, au kama upotovu wa kimaadili tu.
  rationale: Maneno נִדָּה, תּוֹעֵבָה, na טֻמְאָה yanaweza kuunganisha dhana za kiibada na za kimaadili-kimaagano; tafsiri inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘kwa mkono wa’ umehifadhiwa kama nahau ya uwakala wa kinabii; sehemu nyingine zimetolewa kwa mpangilio wa asili wa Kiswahili.
