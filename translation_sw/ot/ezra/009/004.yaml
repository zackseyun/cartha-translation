source:
  edition: WLC
  text: וְ/אֵלַ֣/י יֵאָסְפ֗וּ כֹּ֤ל חָרֵד֙ בְּ/דִבְרֵ֣י אֱלֹהֵֽי יִשְׂרָאֵ֔ל עַ֖ל מַ֣עַל הַ/גּוֹלָ֑ה וַ/אֲנִי֙ יֹשֵׁ֣ב מְשׁוֹמֵ֔ם עַ֖ד לְ/מִנְחַ֥ת הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/004.yaml
  text: Then everyone who trembled at the words of the God of Israel because of the unfaithfulness of the exiles gathered to me[b][a], while I sat appalled until the evening offering.
translation:
  language: sw
  text: Ndipo wote waliotetemeka mbele ya maneno ya Mungu wa Israeli wakakusanyika kwangu kwa sababu ya ukosefu wa uaminifu wa jumuiya ya uhamisho[a]. Nami nilikaa nikiwa nimepigwa na butwaa mpaka wakati wa sadaka ya jioni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kosa la jumuiya ya uhamisho.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linalotafsiriwa “sadaka” mara nyingi humaanisha hasa sadaka ya nafaka; hapa pia linataja wakati wa sadaka ya kawaida ya hekaluni ya jioni.
    reason: cultural_note
lexical_decisions:
- source_word: יֵאָסְפוּ
  choice: wakakusanyika kwangu
  rationale: Nifali ya אסף hapa inaeleza watu kuja pamoja kwa Ezra. ‘Wakakusanyika kwangu’ ni Kiswahili cha kawaida na hakilazimishi maana kuwa ama tendwa ama kujikusanya.
- source_word: כֹּל חָרֵד
  choice: wote waliotetemeka
  rationale: Kivumishi cha umoja חָרֵד baada ya כֹּל kina maana ya mkusanyiko. Tafsiri hii inadumisha hofu nzito na yenye unyenyekevu mbele za Mungu.
- source_word: בְּדִבְרֵי אֱלֹהֵי יִשְׂרָאֵל
  choice: kwa sababu ya maneno ya Mungu wa Israeli
  rationale: Herufi ב pamoja na חרד inaweza kuonyesha kitu au sababu inayowafanya watetemeke. ‘Kwa sababu ya maneno’ ni ya asili katika Kiswahili na inadumisha wingi wa דִבְרֵי.
- source_word: עַל מַעַל הַגּוֹלָה
  choice: kwa sababu ya uvunjaji wa uaminifu wa jumuiya ya wahamishwa
  rationale: מַעַל ni ukiukaji au uvunjaji wa uaminifu kwa Mungu, wenye uzito wa agano. הַגּוֹלָה hapa ni jamii ya watu wa uhamisho, si hali dhahania ya ‘uhamisho’ pekee.
- source_word: יֹשֵׁב מְשׁוֹמֵם
  choice: nilikaa nikiwa nimepigwa na butwaa
  rationale: Muundo huu unaonyesha Ezra akiendelea kuketi katika hali ya mshtuko na kufadhaika sana. ‘Nimepigwa na butwaa’ ni usemi wa sasa, wa kawaida na wenye uzito unaofaa.
- source_word: עַד לְמִנְחַת הָעָרֶב
  choice: mpaka wakati wa sadaka ya jioni
  rationale: מִנְחָה inaweza kumaanisha hasa sadaka ya nafaka, lakini katika usemi huu pia inataja wakati wa ibada ya kawaida ya jioni. ‘Sadaka ya jioni’ haiongezi aina ya sadaka ambayo muktadha hauitaji kuitaja wazi.
theological_decisions:
- issue: Maana ya מַעַל katika muktadha wa dhambi dhidi ya agano
  choice: uvunjaji wa uaminifu
  alternative: kosa; kukosa uaminifu
  rationale: Usemi huu unaonyesha si kosa la kawaida tu bali tendo la kuvunja uaminifu kwa Mungu; hata hivyo, hauingizi istilahi ya dhehebu au mfumo wa baadaye wa mafundisho.
- issue: Maana ya הַגּוֹלָה
  choice: jumuiya ya wahamishwa
  alternative: watu wa uhamisho; watu waliorudi kutoka uhamishoni
  rationale: Nomino hiyo inarejelea jumuiya ya wale waliopelekwa uhamishoni na, katika muktadha huu, waliorejea. ‘Jumuiya ya wahamishwa’ inadumisha namna jamii hiyo inavyotambulishwa bila kuongeza wazi neno ‘waliorudi,’ ambalo halipo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili zinadumisha mwendo wa simulizi na hali ya Ezra ya kuendelea kuketi kwa mshangao mkubwa. Alama zote za tanbihi zimewekwa mara moja katika matini mahali zinapohusika.
