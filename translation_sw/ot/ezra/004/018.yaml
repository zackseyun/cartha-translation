  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. “Hati” inadumisha muktadha rasmi wa kiutawala, na “mbele yangu” inadumisha mtindo wa jibu la kifalme.
