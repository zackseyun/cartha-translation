  yaml_path: translation/ot/ezra/004/018.yaml
  text: The document that you sent to us has been read plainly before me[a].
translation:
  language: sw
  text: Hati mliyotutumia imesomwa wazi mbele yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Barua mliyotutumia imesomwa kwa uwazi mbele yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁתְּוָנָא
  choice: Hati
  rationale: Neno hili la Kiaramu cha kiutawala humaanisha maandishi rasmi. “Hati” linafaa katika muktadha wa mawasiliano ya serikali, huku “barua” likibaki tafsiri mbadala inayowezekana.
- source_word: דִּי
  choice: mliyo-
  rationale: Kiwakilishi rejeshi kimeunganishwa kwa njia ya kawaida ya Kiswahili katika “mliyotutumia,” kikihusisha hati na tendo la kuituma.
- source_word: שְׁלַחְתּוּן
  choice: mliyotutumia
  rationale: Kitenzi ni nafsi ya pili wingi katika wakati timilifu. Muundo huu wa Kiswahili unaonyesha kwa kawaida tendo lililokamilika la kuituma hati.
- source_word: עֲלֶינָא
  choice: tutumia
  rationale: Katika muktadha huu wa barua ya kiutawala, kiambishi cha mtendewa “-tu-” kinatoa maana ya “kwetu,” yaani kwa mfalme na watu wake wa ikulu, si “dhidi yetu.”
- source_word: מְפָרַשׁ
  choice: wazi
  rationale: “Wazi” huhifadhi wazo la usomaji ulio dhahiri au wenye kueleweka bila kuamua kimya kimya kwamba hati ilitafsiriwa au kufafanuliwa.
- source_word: קֱרִי
  choice: imesomwa
  rationale: 'Muktadha unahitaji maana ya kutendwa: hati ilisomwa, yaelekea kwa sauti, mbele ya mfalme. Wakati timilifu wa Kiswahili unafaa kwa jibu kuhusu tendo lililofanyika karibuni.'
- source_word: קָדָמָי
  choice: mbele yangu
  rationale: Huu ni usemi wa kawaida wa kimahakama unaoonyesha kwamba jambo lilifanyika katika uwepo wa mfalme.
theological_decisions: []
