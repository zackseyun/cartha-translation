  to: Katika siku za Artashasta, Bishlamu, Mithredathi, Tabeeli, na wenzake waliobaki[b] walimwandikia Artashasta, mfalme wa Uajemi. Maandishi ya waraka huo yaliandikwa kwa Kiaramu na kutafsiriwa kwa Kiaramu.[a]
