  text: וּ/בִ/ימֵ֣י אַרְתַּחְשַׁ֗שְׂתָּא כָּתַ֨ב בִּשְׁלָ֜ם מִתְרְדָ֤ת טָֽבְאֵל֙ וּ/שְׁאָ֣ר כנות/ו עַל ארתחששתא מֶ֣לֶךְ פָּרָ֑ס וּ/כְתָב֙ הַֽ/נִּשְׁתְּוָ֔ן כָּת֥וּב אֲרָמִ֖ית וּ/מְתֻרְגָּ֥ם אֲרָמִֽית־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/007.yaml
  text: And in the days of Artaxerxes[a], Bishlam, Mithredath, Tabeel, and the rest of his associates wrote to Artaxerxes king of Persia[b]. The text of the letter was written in Aramaic and translated from Aramaic.
translation:
  language: sw
  text: Katika siku za Artashasta, Bishlamu, Mithredathi, Tabeeli, na wenzake waliobaki[b] walimwandikia Artashasta, mfalme wa Uajemi. Maandishi ya waraka huo yaliandikwa kwa Kiaramu na kutafsiriwa kwa Kiaramu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maandishi ya waraka huo yaliandikwa kwa mwandiko wa Kiaramu na kutafsiriwa kwa lugha ya Kiaramu.” Msemo wa Kiebrania wenye maneno ya Kiaramu hapa ni mgumu, na wafafanuzi hawakubaliani kama unatofautisha mwandiko na lugha, au kuandika na kutafsiri.
    reason: lexical_alternative
  - marker: b
    text: Au, “na wenzao waliobaki.” Kiambishi katika “wenzake” kina umbo la umoja, lakini huenda kinarejelea kundi kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי
  choice: Katika siku za
  rationale: Ni nahau ya wakati inayohifadhi maana ya msingi ya ‘katika siku za’ bila kuifanya kimakusudi kuwa fomula ya utawala.
- source_word: אַרְתַּחְשַׁשְׂתָּא
  choice: Artashasta
  rationale: Hili ni umbo la jina la mfalme linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: כָּתַב ... עַל
  choice: walimwandikia
  rationale: Katika muktadha huu wa mawasiliano ya kiutawala, kitenzi pamoja na kihusishi kinaonyesha kumwandikia mpokeaji; tafsiri hii haiongezi wazo la shtaka ambalo halijasemwa wazi katika aya.
- source_word: בִּשְׁלָם מִתְרְדָת טָבְאֵל
  choice: Bishlamu, Mithredathi, Tabeeli
  rationale: Majina ya watu yametoholewa kwa maumbo yanayosomeka kwa kawaida katika Kiswahili.
- source_word: וּשְׁאָר כנותו
  choice: na wenzake wengine
  rationale: שְׁאָר ni ‘waliobaki/wengine,’ na nomino adimu inayofuata inaeleweka kuwa ‘wenzake’ au ‘washirika.’ Kiambishi cha umoja kimehifadhiwa katika ‘-ake,’ huku tanbihi ikitaja uwezekano wa marejeo ya kundi.
- source_word: מֶלֶךְ פָּרָס
  choice: mfalme wa Uajemi
  rationale: Ni cheo cha kifalme kinachomtambulisha Artashasta; ‘Uajemi’ ni jina la kawaida la Persia katika Kiswahili cha kibiblia.
- source_word: וּכְתָב הַנִּשְׁתְּוָן
  choice: Maandishi ya waraka huo
  rationale: כְתָב huelekea kumaanisha maandishi au matini, na נִשְׁתְּוָן ni waraka/barua; usemi huu unaonyesha kuwa sentensi inayofuata inahusu namna waraka ulivyoandikwa.
- source_word: כָּתוּב אֲרָמִית וּמְתֻרְגָּם אֲרָמִית
  choice: yaliandikwa kwa mwandiko wa Kiaramu na kutafsiriwa kwa lugha ya Kiaramu
  rationale: Marudio ya ‘Kiaramu’ yanaweza kutofautisha mwandiko na lugha. Tafsiri hii inaleta maana hiyo kwa Kiswahili kinachoeleweka, huku tanbihi ikihifadhi uchangamano na tafsiri nyingine zinazowezekana.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaosomeka kwa urahisi; majina yametoholewa kwa maumbo yanayotambulika katika mapokeo ya Biblia ya Kiswahili. Alama za tanbihi zimewekwa karibu na vipashio vinavyoelezwa.
