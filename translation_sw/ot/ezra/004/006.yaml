  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בְ/מַלְכוּת֙ אֲחַשְׁוֵר֔וֹשׁ בִּ/תְחִלַּ֖ת מַלְכוּת֑/וֹ כָּתְב֣וּ שִׂטְנָ֔ה עַל יֹשְׁבֵ֥י יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/006.yaml
  text: And in the reign of Ahasuerus[a], at the beginning of his reign, they wrote an accusation against the inhabitants of Judah and Jerusalem.
translation:
  language: sw
  text: Na katika utawala wa Ahasuero, mwanzoni mwa utawala wake, waliandika shtaka[a] dhidi ya wakazi wa Yuda na Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “malalamiko” au “shtaka la uhasama.” Neno la Kiebrania lina maana ya upinzani unaoelezwa kwa njia ya shtaka rasmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/מַלְכוּת
  choice: Na katika utawala wa
  rationale: Kiunganishi na kihusishi vinaweka wakati wa tukio; ‘katika utawala wa’ ni Kiswahili cha kawaida na chenye heshima kinachoonyesha kipindi cha kutawala kwa mfalme.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasuero
  rationale: Jina la Kiebrania limetoholewa kwa umbo lililozoeleka katika Kiswahili, bila kulibadili kuwa utambulisho wa kihistoria ‘Xerxes.’
- source_word: בִּ/תְחִלַּת מַלְכוּת/וֹ
  choice: mwanzoni mwa utawala wake
  rationale: Kirai hiki kinaonyesha kipindi cha kwanza cha kutawala kwake; tafsiri hii ni ya asili katika Kiswahili na inadumisha maana ya wakati.
- source_word: כָּתְבוּ
  choice: waliandika
  rationale: Kitenzi kinamaanisha ‘waliandika’; kiima kisichotajwa wazi katika Kiebrania kinaachwa vivyo hivyo katika Kiswahili.
- source_word: שִׂטְנָה
  choice: shtaka
  rationale: Nomino hii huonyesha shutuma au malalamiko rasmi yenye uhasama. ‘Shtaka’ linafaa katika muktadha wa maandishi ya kiutawala bila kubainisha kupita kiasi aina ya hati.
- source_word: עַל
  choice: dhidi ya
  rationale: Katika muktadha wa kuandika shtaka, kihusishi hiki kinaonyesha walengwa wa maandishi ya upinzani.
- source_word: יֹשְׁבֵי יְהוּדָה וִ/ירוּשָׁלִָם
  choice: wakazi wa Yuda na Yerusalemu
  rationale: Kirai participio kinamaanisha watu wanaokaa mahali hapo; ‘wakazi’ ni kifupi, cha sasa, na cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa Kiebrania wa kuweka wakati mwanzoni mwa sentensi na kiima kisichotajwa cha ‘waliandika’ umehifadhiwa.
