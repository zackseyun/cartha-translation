base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/016.yaml
  text: We make known to the king that if this city is rebuilt and its walls are completed[b][a], then because of this you will have no possession in the province Beyond the River.
translation:
  language: sw
  text: Tunamjulisha mfalme kwamba ikiwa mji huu utajengwa upya na kuta zake zikamilishwa, basi kwa sababu hiyo hutakuwa na sehemu yoyote[a] katika Ng’ambo ya Mto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiaramu lililotafsiriwa “sehemu” linaweza pia kumaanisha “fungu” au “hisa”; katika muktadha huu huenda likahusu milki, mamlaka, au mapato ya kifalme.
    reason: lexical_alternative
  - marker: b
    text: “Ng’ambo ya Mto” lilikuwa jina rasmi la utawala wa Uajemi kwa eneo lililokuwa magharibi ya Mto Eufrate.
    reason: cultural_note
lexical_decisions:
- source_word: מְהוֹדְעִין אֲנַחְנָה לְמַלְכָּא
  choice: Tunamjulisha mfalme
  rationale: Kauli ya taarifa rasmi ya barua imetafsiriwa kwa Kiswahili cha kawaida lakini chenye hadhi; umbo la wingi ‘tuna-’ linawakilisha אֲנַחְנָה.
- source_word: דִּי הֵן
  choice: kwamba ikiwa
  rationale: Chembe hizi zinaanzisha maudhui ya taarifa pamoja na sharti; tafsiri hii ni ya asili katika Kiswahili na haiwezi kulifanya sharti kuwa uhakika.
- source_word: קִרְיְתָא דָךְ
  choice: mji huu
  rationale: Kiashiria דָךְ kimehifadhiwa kwa ‘huu,’ kikirejelea Yerusalemu kwa mtazamo wa waandishi.
- source_word: תִּתְבְּנֵא
  choice: utajengwa upya
  rationale: Kauli tendwa ya wakati ujao ndani ya sharti inaonyesha kurudishwa kwa mji kwa kuujenga tena.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: na kuta zake zikamilishwa
  rationale: ‘Kuta zake’ huonyesha wazi uhusiano na mji, na ‘zikamilishwa’ huhifadhi wazo la kazi kufikishwa mwisho.
- source_word: לָקֳבֵל דְּנָה
  choice: basi kwa sababu hiyo
  rationale: Usemi huu unatoa matokeo ya sharti na pia huhifadhi kiashiria ‘hiyo.’
- source_word: חֲלָק
  choice: sehemu yoyote
  rationale: ‘Sehemu’ huhifadhi maana pana ya fungu au hisa bila kuibana kimakusudi kuwa kodi, mapato, milki, au mamlaka pekee; ‘yoyote’ hutoa kwa kawaida nguvu ya ukanushi wa sentensi.
- source_word: בַּעֲבַר נַהֲרָא
  choice: katika Ng’ambo ya Mto
  rationale: Jina la eneo limehifadhiwa bila kuongeza neno lisilokuwapo moja kwa moja katika chanzo; kihusishi ‘katika’ kinaifanya sentensi iwe ya asili kwa Kiswahili.
- source_word: לָא אִיתַי לָךְ
  choice: hutakuwa na
  rationale: Muundo wa Kiaramu wa kuwako pamoja na yambwa ya umilikaji umetolewa kwa muundo wa kawaida wa Kiswahili wa ‘kuwa na.’
