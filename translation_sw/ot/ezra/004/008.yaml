  yaml_path: translation/ot/ezra/004/008.yaml
  text: Rehum the commander and Shimshai the scribe wrote a letter against Jerusalem to King Artaxerxes as follows:[a]
translation:
  language: sw
  text: 'Rehumu, mkuu wa utawala[a], na Shimshai, mwandishi, walimwandikia Mfalme Artashasta barua dhidi ya Yerusalemu, kama ifuatavyo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kansela.” Maneno ya Kiaramu בְּעֵל טְעֵם ni cheo rasmi, lakini wadhifa mahsusi unaolingana nacho katika utawala wa Kiajemi haujulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵל טְעֵם
  choice: mkuu wa utawala
  rationale: Hiki ni cheo rasmi cha Kiaramu chenye maana ya mamlaka ya kiutawala, ingawa wadhifa mahsusi wa Kiajemi haujulikani kwa uhakika. Tafsiri hii ni ya kawaida na haifungi maana kwenye cheo mahususi kupita ushahidi uliopo.
- source_word: סָפְרָא
  choice: mwandishi
  rationale: Neno hili humaanisha afisa aliyefanya kazi ya uandishi au ukatibu. “Mwandishi” huhifadhi maana ya msingi na linaeleweka vizuri katika Kiswahili cha kawaida.
- source_word: כְּתַבוּ
  choice: walimwandikia
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba waliandika barua na kuielekeza kwa mfalme, bila kuongeza wazo lisilokuwamo katika chanzo.
- source_word: אִגְּרָה חֲדָה
  choice: barua
  rationale: Katika Kiaramu cha kifalme, חֲדָה hapa linaweza kutumika kwa namna inayotambulisha nomino isiyo maalumu. “Barua” ni ya kawaida zaidi kuliko kusisitiza “barua moja,” kwa kuwa idadi si hoja ya muktadha.
- source_word: עַל יְרוּשְׁלֶם
  choice: dhidi ya Yerusalemu
  rationale: Muktadha ni wa upinzani na mashtaka, hivyo “dhidi ya” huhifadhi nguvu ya kiadui ya kirai hicho kuliko “kuhusu.”
- source_word: לְאַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: Mfalme Artashasta
  rationale: Mpangilio huu ni wa asili katika Kiswahili na huhifadhi jina pamoja na cheo cha kifalme.
- source_word: כְּנֵמָא
  choice: 'kama ifuatavyo:'
  rationale: Kishazi hiki kinatanguliza yaliyomo katika barua yanayoanza katika mstari unaofuata.
- source_word: רְחוּם
  choice: Rehumu
  rationale: Jina limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: שִׁמְשַׁי
  choice: Shimshai
  rationale: Jina limetoholewa kwa tahajia inayokaribia umbo la chanzo na iliyo rahisi kusomeka kwa Kiswahili.
- source_word: אַרְתַּחְשַׁשְׂתְּא
  choice: Artashasta
  rationale: Hili ndilo umbo la jina la mfalme lililozoeleka katika tafsiri za Biblia za Kiswahili.
