base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/019.yaml
  text: And a decree was issued by me[a], and they searched and found that this city has from ancient days risen up against kings[b], and rebellion and sedition have been carried out in it.
translation:
  language: sw
  text: Nami nilitoa amri, nao wakachunguza na kugundua kwamba tangu siku za kale jiji hili limekuwa likiinuka dhidi ya wafalme[a], na kwamba uasi na fitina[b] zimekuwa zikifanyika ndani yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “limekuwa likijikweza dhidi ya wafalme.” Kitenzi cha Kiaramu kinaweza kumaanisha kujikweza, lakini hapa kinadokeza kuinuka kwa upinzani.
    reason: lexical_alternative
  - marker: b
    text: Au, “uasi na uchochezi vimekuwa vikifanyika ndani yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים טְעֵם ... וּמִנִּי
  choice: Nami nilitoa amri
  rationale: Nahau ya Kiaramu, kihalisi ‘amri iliwekwa kutoka kwangu,’ inaonyesha kwamba mfalme ndiye aliyetoa amri. Kiswahili tendaji ni cha kawaida na kinahifadhi mamlaka ya msemaji.
- source_word: וּבַקַּרוּ וְהַשְׁכַּחוּ
  choice: nao wakachunguza na kugundua
  rationale: Vitenzi hivi vinaeleza uchunguzi rasmi wa kumbukumbu na matokeo yake.
- source_word: קִרְיְתָא דָךְ
  choice: jiji hili
  rationale: Kiashiria kinarejelea jiji linalozungumziwa katika barua ya kifalme.
- source_word: מִן יוֹמָת עָלְמָא
  choice: tangu siku za kale
  rationale: Hii ni nahau ya Kiaramu inayorejelea nyakati za zamani sana; tafsiri hii ni ya asili na yenye hadhi katika Kiswahili.
- source_word: עַל מַלְכִין מִתְנַשְּׂאָה
  choice: limekuwa likiinuka dhidi ya wafalme
  rationale: Umbo la kitenzi linaweza kudokeza kujikweza, lakini katika muktadha wa kisiasa linaeleza kuinuka kwa upinzani. Tafsiri hii haichanganyi wazo hilo moja kwa moja na neno linalofuata la ‘uasi.’
- source_word: וּמְרַד
  choice: uasi
  rationale: Ni neno la kawaida la kisiasa kwa upinzani au uasi dhidi ya mamlaka ya kifalme.
- source_word: וְאֶשְׁתַּדּוּר
  choice: fitina
  rationale: Neno hili linaonyesha shughuli ya kuvuruga au kuchochea dhidi ya serikali, likibaki tofauti lakini likiingiliana kimaana na ‘uasi.’
- source_word: מִתְעֲבֶד בַּהּ
  choice: zimekuwa zikifanyika ndani yake
  rationale: Usemi huu unadokeza kwamba matendo hayo yalikuwa yakitendeka katika jiji hilo, si tukio moja tu.
