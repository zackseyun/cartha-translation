  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kwa mtiririko wa kawaida wa masimulizi. “Mara tu” huonyesha kuwa hatua ilifuata kusomwa kwa barua bila kuchelewa; “mwandishi” ni cheo kinachoeleweka kwa wasomaji wa kawaida.
