  text: אֱדַ֗יִן מִן דִּ֞י פַּרְשֶׁ֤גֶן נִשְׁתְּוָנָ/א֙ דִּ֚י ארתחששתא מַלְכָּ֔/א קֱרִ֧י קֳדָם רְח֛וּם וְ/שִׁמְשַׁ֥י סָפְרָ֖/א וּ/כְנָוָתְ/ה֑וֹן אֲזַ֨לוּ בִ/בְהִיל֤וּ לִ/ירֽוּשְׁלֶם֙ עַל יְה֣וּדָיֵ֔/א וּ/בַטִּ֥לוּ הִמּ֖וֹ בְּ/אֶדְרָ֥ע וְ/חָֽיִל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/023.yaml
  text: Then[a], as soon as the copy of the letter of King Artaxerxes was read before Rehum and Shimshai the scribe and their associates, they went in haste to Jerusalem, to the Jews[b], and made them stop by force and power.
translation:
  language: sw
  text: Kisha, mara tu nakala ya barua ya Mfalme Artashasta iliposomwa mbele ya Rehumu, Shimshai mwandishi, na wenzao, walikwenda kwa haraka Yerusalemu dhidi ya Wayahudi[a], wakawalazimisha waache kwa nguvu na uwezo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa Wayahudi.” Kihusishi cha Kiaramu kinaweza kumaanisha kwenda kwao au kwenda dhidi yao; hatua inayofuata inaonyesha uhasama.
    reason: lexical_alternative
  - marker: b
    text: Au “wakawasimamisha kwa nguvu na ukakamavu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Kisha
  rationale: Ni kielezi cha masimulizi kinachoonyesha tukio linalofuata katika mfuatano; “Kisha” ni Kiswahili cha kawaida na cha wazi.
- source_word: פַּרְשֶׁגֶן נִשְׁתְּוָנָא
  choice: nakala ya barua
  rationale: פַּרְשֶׁגֶן ni nakala au hati iliyonakiliwa, na נִשְׁתְּוָנָא ni mawasiliano rasmi ya maandishi.
- source_word: קֱרִי קֳדָם
  choice: iliposomwa mbele ya
  rationale: Kirai kinaeleza hati kusomwa mbele au katika uwepo wa maofisa hao.
- source_word: רְחוּם וְשִׁמְשַׁי סָפְרָא וּכְנָוָתְהוֹן
  choice: Rehumu, Shimshai mwandishi, na wenzao
  rationale: Majina yamenukuliwa kwa mwandiko wa Kiswahili; סָפְרָא inaweza kumaanisha mwandishi au katibu, na “mwandishi” huhifadhi cheo hicho kwa uwazi; כְנָוָתְהוֹן ni wenzao.
- source_word: אֲזַלוּ בִבְהִילוּ
  choice: walikwenda kwa haraka
  rationale: Muundo huu unasisitiza mwendo wa haraka na wa dharura bila kupoteza kitenzi cha kwenda.
- source_word: עַל יְהוּדָיֵא
  choice: dhidi ya Wayahudi
  rationale: Katika muktadha huu עַל inaelekea kuwa na maana ya mwendo wa uhasama, kama inavyothibitishwa na hatua inayofuata ya kuwalazimisha kusimamisha kazi; uwezekano wa maana isiyo wazi sana umeonyeshwa katika tanbihi.
- source_word: וּבַטִּלוּ הִמּוֹ
  choice: wakawalazimisha kusimamisha kazi
  rationale: Umbo la kisababishi linaonyesha kuwa waliwafanya Wayahudi waache; “kazi” imewekwa wazi kutokana na muktadha wa ujenzi.
- source_word: בְּאֶדְרָע וְחָיִל
  choice: kwa nguvu na uwezo
  rationale: Nahau hii inaonyesha shuruti inayotekelezwa kwa nguvu; tafsiri hudumisha vipashio vyote viwili huku tanbihi ikitoa mbadala wa karibu.
