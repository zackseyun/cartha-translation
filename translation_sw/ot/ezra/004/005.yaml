  text: וְ/סֹכְרִ֧ים עֲלֵי/הֶ֛ם יוֹעֲצִ֖ים לְ/הָפֵ֣ר עֲצָתָ֑/ם כָּל יְמֵ֗י כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס וְ/עַד מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/005.yaml
  text: And they hired counselors against them to frustrate their plan all the days of Cyrus king of Persia[a], even until the reign of Darius king of Persia.
translation:
  language: sw
  text: Nao waliwaajiri washauri ili kuwapinga na kuvuruga mpango wao[a] siku zote za Koreshi, mfalme wa Uajemi, hadi wakati wa utawala wa Dario, mfalme wa Uajemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili kulibatilisha shauri lao.” Neno la Kiebrania עֲצָה linaweza kumaanisha “shauri,” “mpango,” au “kusudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֹכְרִים
  choice: waliwaajiri
  rationale: Kitenzi שׂכר hapa kinaonyesha kuwalipa watu kwa huduma zao; ‘waliwaajiri’ ni Kiswahili cha kawaida na hakiongezi wazo mahususi la rushwa lisilotajwa wazi.
- source_word: עֲלֵיהֶם
  choice: ili kuwapinga
  rationale: Katika muktadha huu wa uhasama, עַל ina maana ya kutenda dhidi yao; muundo huu unasikika kwa kawaida pamoja na kusudi linalofuata.
- source_word: יוֹעֲצִים
  choice: washauri
  rationale: Neno linalotokana na יעץ linamaanisha watu wanaotoa ushauri, hasa katika mazingira ya kiutawala au kisiasa.
- source_word: לְהָפֵר
  choice: kuvuruga
  rationale: הפר inaweza kumaanisha kuvunja, kubatilisha, au kuzuia lisitimie. Kwa mpango unaopingwa, ‘kuvuruga’ huwasilisha kwa kawaida jaribio la kuufanya ushindwe.
- source_word: עֲצָתָם
  choice: mpango wao
  rationale: עֵצָה linaweza kumaanisha shauri, mpango, au kusudi. ‘Mpango wao’ linaeleweka wazi katika muktadha wa kazi ya kujenga upya, huku uwezekano wa ‘shauri’ ukihifadhiwa katika tanbihi.
- source_word: כָּל יְמֵי
  choice: siku zote za
  rationale: Huu ni msemo wa muda unaomaanisha kipindi chote; tafsiri hii huhifadhi umbo la Kiebrania bila kuwa ngumu katika Kiswahili.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Koreshi, mfalme wa Uajemi
  rationale: Jina limetoholewa kwa matumizi ya kawaida ya Biblia ya Kiswahili, na cheo pamoja na jina la nchi vimetafsiriwa.
- source_word: וְעַד
  choice: hadi
  rationale: Kiunganishi na kihusishi hiki vinaonyesha kuendelea kwa kipindi mpaka utawala wa Dario; ‘hadi’ ni cha asili na wazi.
- source_word: מַלְכוּת
  choice: wakati wa utawala
  rationale: Katika muundo huu wa muda, מַלְכוּת ni kipindi ambacho mfalme alitawala, si eneo la ufalme; ‘wakati wa utawala’ huweka maana hiyo wazi.
- source_word: דָּרְיָוֶשׁ מֶלֶךְ פָּרָס
  choice: Dario, mfalme wa Uajemi
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili, huku cheo na nchi vikitafsiriwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia ‘waliwaajiri washauri’ kwa uwazi wa kisasa na ‘kuvuruga mpango wao’ kwa maana ya kuzuia utekelezaji wake. Alama ya tanbihi imewekwa baada ya sentensi kwa kuwa tanbihi inahusu kirai ‘mpango wao’ ndani ya aya.
