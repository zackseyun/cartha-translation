base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/015.yaml
  text: so that a search may be made in the book of records of your fathers[a], and you may find in the book of records and know that this city is a rebellious city, harmful to kings and provinces, and that sedition has been made within it from ancient days[b]; for this reason this city was laid waste.
translation:
  language: sw
  text: ili uchunguzi ufanywe katika kitabu cha kumbukumbu za baba zako[a], na katika kitabu cha kumbukumbu utapata na kujua kwamba mji huu ni mji wa uasi, unaowaletea madhara wafalme na majimbo, na kwamba uasi umefanywa ndani yake tangu siku za kale[b]; kwa sababu hiyo mji huu uliharibiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mababu zako” au “watawala waliokutangulia”; neno kwa neno, “baba zako.”
    reason: lexical_alternative
  - marker: b
    text: Kirai cha Kiaramu kinaweza pia kutafsiriwa, “uchochezi umefanywa ndani yake”; kinamaanisha kuanzisha au kuendeleza uasi katika mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקַּר
  choice: uchunguzi ufanywe
  rationale: Kauli isiyotaja mtendaji inaakisi ombi la kiutawala na maana ya kuchunguza kumbukumbu rasmi.
- source_word: סְפַר דָּכְרָנַיָּא
  choice: kitabu cha kumbukumbu
  rationale: Huhifadhi taswira ya rejesta iliyoandikwa na kueleweka kwa kawaida katika Kiswahili.
- source_word: אֲבָהָתָךְ
  choice: baba zako
  rationale: Hii ndiyo maana halisi; katika muktadha inaweza kumaanisha mababu au wafalme waliokutangulia, jambo linalobainishwa katika tanbihi.
- source_word: וּתְהַשְׁכַּח וְתִנְדַּע
  choice: utaona na kujua
  rationale: ‘Kuona’ hapa huwasilisha kwa kawaida matokeo ya kupata habari katika kumbukumbu, huku ‘kujua’ ikihifadhi kitenzi cha pili.
- source_word: קִרְיָא מָרָדָא
  choice: mji wa uasi
  rationale: Kauli hii ya asili inautambulisha mji kwa sifa ya kuasi mamlaka ya kifalme.
- source_word: מְהַנְזְקַת מַלְכִין וּמְדִנָן
  choice: unaowaletea madhara wafalme na majimbo
  rationale: Huwasilisha dhara la kisiasa au kiuchumi kwa watawala na maeneo yao ya kiutawala.
- source_word: אֶשְׁתַּדּוּר עָבְדִין
  choice: watu wamekuwa wakichochea uasi
  rationale: Kirai kigumu cha Kiaramu kinaashiria kufanya au kuendeleza uchochezi wa kisiasa; tafsiri hii ni ya kawaida bila kuficha ugumu wake.
- source_word: מִן יוֹמָת עָלְמָא
  choice: tangu siku za kale
  rationale: Ni nahau ya muda mrefu wa kihistoria, si kauli ya umilele kwa maana ya kifalsafa.
- source_word: הָחָרְבַת
  choice: uliharibiwa
  rationale: Kauli tendwa inaeleza kwamba mji ulifanywa ukiwa magofu au ukiwa umeachwa ukiwa tupu.
