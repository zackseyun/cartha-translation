translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye hadhi ya barua rasmi ya kiutawala. Muundo wa kauli tendwa umehifadhiwa mwanzoni, na marudio ya ‘kitabu cha kumbukumbu’ yamepunguzwa kidogo kwa kutumia ‘kitabu hicho’ ili sentensi iwe ya kawaida na wazi.
