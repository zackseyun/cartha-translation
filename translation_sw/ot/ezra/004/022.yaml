translation:
  language: sw
  text: Nanyi jihadharini msipuuze kutekeleza jambo hili.[a] Kwa nini madhara yaongezeke kwa hasara ya wafalme?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msiwe wazembe kutekeleza jambo hili.”
    reason: lexical_alternative
  - marker: b
    text: Kiaramu kinasema “wafalme” kwa wingi, huenda kikirejelea kwa upana maslahi ya kifalme au nasaba ya watawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְהִירִין הֱווֹ
  choice: Nanyi jihadharini
  rationale: Muundo huu wa Kiaramu una nguvu ya agizo la tahadhari. “Jihadharini” ni Kiswahili cha sasa, cha kawaida na chenye uzito wa onyo.
- source_word: שָׁלוּ לְמֶעְבַּד
  choice: msipuuze kutekeleza
  rationale: שָׁלוּ huonyesha uzembe au kuacha jambo litelekezwe, huku לְמֶעְבַּד ikimaanisha kufanya. “Msipuuze kutekeleza” huunganisha maana hizo kwa njia ya asili.
- source_word: עַל דְּנָה
  choice: jambo hili
  rationale: Kirai hiki kinarejelea agizo la kifalme lililotangulia. “Jambo hili” ni wazi zaidi kuliko kiwakilishi pekee.
- source_word: לְמָה יִשְׂגֵּא חֲבָלָא
  choice: Kwa nini madhara yaongezeke
  rationale: Swali la balagha na maana ya kitenzi ‘kuongezeka’ zimehifadhiwa. “Madhara” hufaa kwa aina pana ya uharibifu au hasara inayokusudiwa.
- source_word: לְהַנְזָקַת מַלְכִין
  choice: na kuwaletea hasara wafalme
  rationale: Kirai cha Kiaramu kinaonyesha matokeo yenye kuwadhuru wafalme. Tafsiri hii ni ya asili katika Kiswahili na inadumisha wingi wa מַלְכִין.
