  text: וַ/יֹּאמֶר֩ לָ/הֶ֨ם זְרֻבָּבֶ֜ל וְ/יֵשׁ֗וּעַ וּ/שְׁאָ֨ר רָאשֵׁ֤י הָֽ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לֹֽא לָ֣/כֶם וָ/לָ֔/נוּ לִ/בְנ֥וֹת בַּ֖יִת לֵ/אלֹהֵ֑י/נוּ כִּי֩ אֲנַ֨חְנוּ יַ֜חַד נִבְנֶ֗ה לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֣ר צִוָּ֔/נוּ הַ/מֶּ֖לֶךְ כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/003.yaml
  text: But Zerubbabel[a], Jeshua, and the rest of the heads of the fathers’ houses of Israel said to them, “You have no part with us in building a house for our God, for we alone will build it for Yahweh, the God of Israel, just as King Cyrus, the king of Persia[b], commanded us.”
translation:
  language: sw
  text: Lakini Zerubabeli, Yeshua, na viongozi wengine wa jamaa za Israeli wakawaambia, “Ninyi hamna sehemu pamoja nasi katika kujenga nyumba kwa ajili ya Mungu wetu; kwa maana sisi wenyewe[a] tutaijenga kwa ajili ya Yahweh, Mungu wa Israeli, kama vile Mfalme Koreshi, mfalme wa Uajemi, alivyotuamuru.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya moja kwa moja zaidi, “sisi pamoja tutajenga.” Neno la Kiebrania lililotafsiriwa “wenyewe” hapa kwa maana ya muktadha ni “pamoja”; katika muktadha huu linaonyesha kwamba wao ndio wangejenga, bila wale waliotaka kushirikiana nao.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba” inayotajwa hapa ni hekalu.
    reason: cultural_note
lexical_decisions:
- source_word: זְרֻבָּבֶל וְיֵשׁוּעַ
  choice: Zerubabeli, Yeshua
  rationale: Majina yamenukuliwa kwa maumbo yanayotambulika katika Kiswahili huku Yeshua ikifuata kwa karibu umbo la Kiebrania יֵשׁוּעַ.
- source_word: וּשְׁאָר רָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: na viongozi wengine wa jamaa za Israeli
  rationale: Kirai hiki kinamaanisha viongozi wa makundi ya kifamilia au koo; ‘viongozi wa jamaa’ ni cha asili na kinaeleweka katika Kiswahili cha sasa.
- source_word: לֹא לָכֶם וָלָנוּ
  choice: Ninyi hamna sehemu pamoja nasi
  rationale: Huwasilisha nguvu ya nahau inayokataa ushiriki wa pamoja bila kuifanya kauli kuwa ngumu isivyo kawaida katika Kiswahili.
- source_word: לִבְנוֹת בַּיִת לֵאלֹהֵינוּ
  choice: katika kumjengea Mungu wetu nyumba
  rationale: ‘Nyumba’ huhifadhi maana ya msingi ya בַּיִת; muktadha unaonyesha kuwa ni hekalu.
- source_word: כִּי אֲנַחְנוּ יַחַד נִבְנֶה
  choice: Sisi wenyewe kwa pamoja tutamjengea
  rationale: יַחַד maana yake ya moja kwa moja ni ‘pamoja’; ‘sisi wenyewe’ huonyesha utofautishaji na wale waliokataliwa, huku ‘kwa pamoja’ ikihifadhi maneno ya Kiebrania na utata wake.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Yahweh, Mungu wa Israeli
  rationale: Jina la agano יְהוָה limenukuliwa kama Yahweh, na kirai kinachofuata kimetafsiriwa moja kwa moja.
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ מֶלֶךְ פָּרָס
  choice: Koreshi mfalme wa Uajemi
  rationale: Hutoa cheo kamili kwa Kiswahili cha asili bila urudiaji usiohitajika wa neno ‘mfalme’.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina maalumu la Mungu; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya יַחַד katika kauli ya kujenga
  choice: kwa pamoja, ikifafanuliwa na ‘sisi wenyewe’
  alternative: sisi peke yetu
  rationale: Maana ya msingi ni ‘pamoja,’ lakini muktadha unaonyesha kuwa kundi la Zerubabeli ndilo litakalojenga bila washirika waliojitolea. Tafsiri inahifadhi neno la msingi na pia nguvu ya utofautishaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa kuwa wa asili katika Kiswahili huku istilahi ‘nyumba’ na utata wa יַחַד vikihifadhiwa.
