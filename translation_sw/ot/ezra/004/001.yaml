base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/001.yaml
  text: The adversaries of Judah and Benjamin heard that the sons of the exile were building a temple for Yahweh[a], the God of Israel.
translation:
  language: sw
  text: Maadui wa Yuda na Benyamini walisikia kwamba watu wa uhamisho[a] walikuwa wakijenga hekalu kwa ajili ya Yahweh, Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa uhamisho”; yaani, jamii iliyotambulishwa kwa uhusiano wake na uhamisho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: walisikia
  rationale: Kitenzi hiki kinasimulia tukio la wakati uliopita kwa njia ya moja kwa moja; hakuna neno la wazi linalomaanisha “basi” au “wakati huo”.
- source_word: צָרֵי
  choice: maadui
  rationale: Neno hili humaanisha watu wenye uhasama au wanaopinga; “maadui” ni la kawaida na linaonyesha uhasama uliopo katika muktadha.
- source_word: יְהוּדָה וּבִנְיָמִן
  choice: Yuda na Benyamini
  rationale: Haya ni majina ya makabila au maeneo, kwa hiyo yameandikwa kwa maumbo yanayotumika katika Kiswahili.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha maudhui ya habari waliyosikia, wala halitoi sababu.
- source_word: בְנֵי הַגּוֹלָה
  choice: watu wa uhamisho
  rationale: Kiebrania halisi ni “wana wa uhamisho,” nahau inayotaja jamii iliyotambulishwa na uhamisho. “Watu wa uhamisho” huhifadhi uhusiano huo bila kutoa Kiswahili kisicho cha kawaida sana.
- source_word: בּוֹנִים
  choice: walikuwa wakijenga
  rationale: Umbo la participle linaonyesha shughuli iliyokuwa ikiendelea wakati habari hiyo iliposikiwa; kitenzi chenyewe hakisemi wazi “kujenga upya.”
- source_word: הֵיכָל
  choice: hekalu
  rationale: Ingawa neno hili linaweza pia kumaanisha jumba, hapa ni jengo linalojengwa kwa ajili ya Mungu wa Israeli, hivyo “hekalu” ndilo chaguo linalofaa muktadha.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahweh
  rationale: Kihusishi ל kinaonyesha kwamba hekalu linajengwa kwa ajili ya Yahweh; jina la agano יְהוָה limewakilishwa kama “Yahweh.”
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huu ni muundo wa umilikaji unaomtambulisha Yahweh kuwa Mungu wa Israeli.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la Kiebrania YHWH. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. Alama ya tanbihi imewekwa baada ya kirai kinachoifafanua, yaani “watu wa uhamisho,” badala ya baada ya jina “Yahweh.”
