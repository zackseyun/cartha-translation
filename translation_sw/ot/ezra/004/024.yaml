  text: בֵּ/אדַ֗יִן בְּטֵלַת֙ עֲבִידַ֣ת בֵּית אֱלָהָ֔/א דִּ֖י בִּ/ירוּשְׁלֶ֑ם וַ/הֲוָת֙ בָּֽטְלָ֔א עַ֚ד שְׁנַ֣ת תַּרְתֵּ֔ין לְ/מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/024.yaml
  text: Then the work on the house of God that is in Jerusalem stopped[c][b][a], and it remained stopped until the second year of the reign of Darius king of Persia.
translation:
  language: sw
  text: Ndipo kazi ya nyumba ya Mungu[b] iliyoko Yerusalemu ikasimama[a], nayo ikabaki imesimama[c] mpaka mwaka wa pili wa utawala wa Dario, mfalme wa Uajemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ikakoma” au “ikasitishwa.” Mzizi wa Kiaramu בטל unaweza kuwa na maana ya kusimama, kukoma, au kusitishwa.
    reason: lexical_alternative
  - marker: b
    text: Au “hekalu la Mungu.” Tafsiri ya neno kwa neno ni “nyumba ya Mungu.”
    reason: lexical_alternative
  - marker: c
    text: Maneno “ikabaki imesimama” yanaonyesha kwamba hali hiyo iliendelea, si kwamba kusimama kwa kazi kunatajwa tu mara ya pili.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Ndipo
  rationale: Kielezi hiki cha Kiaramu kinaendeleza mfuatano wa simulizi. “Ndipo” ni Kiswahili cha kawaida kinachoonyesha kuwa jambo hili lilifuata yaliyotangulia.
- source_word: בְּטֵלַת
  choice: ikasimama
  rationale: Mzizi wa Kiaramu בטל unaweza kumaanisha kukoma, kusimama, au kusitishwa. Kwa kazi, “ikasimama” ni usemi wa asili na hauamui bila lazima kama ilisimama yenyewe au ilisimamishwa.
- source_word: עֲבִידַת
  choice: kazi
  rationale: Nomino hii humaanisha kazi au utendaji. Muktadha unaonyesha kazi ya ujenzi, lakini tafsiri haiongezi neno “ujenzi” ambalo halijaandikwa wazi hapa.
- source_word: בֵּית אֱלָהָא
  choice: nyumba ya Mungu
  rationale: Hii inafuata moja kwa moja muundo wa Kiaramu na kuhifadhi picha ya “nyumba”; “hekalu la Mungu” ni maana inayowezekana kulingana na muktadha.
- source_word: דִּי בִּירוּשְׁלֶם
  choice: iliyoko Yerusalemu
  rationale: Kirai hiki kinaitambulisha nyumba ya Mungu kwa mahali ilipo. “Iliyoko” ni Kiswahili cha kawaida na wazi.
- source_word: וַהֲוָת בָּטְלָא
  choice: nayo ikabaki imesimama
  rationale: Muundo wa kitenzi cha kuwapo pamoja na umbo la בטל unaonyesha hali iliyoendelea. “Ikabaki imesimama” hutofautisha kudumu kwa hali hiyo na tukio la kwanza la kusimama.
- source_word: עַד שְׁנַת תַּרְתֵּין
  choice: mpaka mwaka wa pili
  rationale: Hii ni tafsiri ya kawaida ya kirai cha wakati kinachotaja mwaka wa pili.
- source_word: לְמַלְכוּת דָּרְיָוֶשׁ
  choice: wa utawala wa Dario
  rationale: Kirai hiki kinataja mwaka kwa kuuhesabu katika utawala wa mfalme Dario.
- source_word: מֶלֶךְ פָּרָס
  choice: mfalme wa Uajemi
  rationale: Hili ni jina la cheo linalofuatia jina la Dario; “Uajemi” ni jina la kawaida la kibiblia kwa Persia katika Kiswahili.
