base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/013.yaml
  text: Now let it be known to the king that if this city is rebuilt and its walls are completed, they will not pay tribute, tax, or toll, and in the end it will damage the revenue of the kings.
translation:
  language: sw
  text: Sasa, na ijulikane kwa mfalme kwamba ikiwa mji huu utajengwa upya na kuta zake zikamilishwa, hawatalipa ushuru, kodi wala ada, na hatimaye jambo hilo litapunguza mapato ya wafalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na mwishowe litawaletea wafalme hasara.” Usemi wa Kiaramu ni mfupi, na wazo mahususi la kupungua kwa mapato limetokana na muktadha wa kutolipwa kwa ushuru, kodi na ada.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Basi
  rationale: Kielezi hiki cha Kiaramu kinaanzisha onyo au hitimisho. “Basi” kinaonyesha mpito huo kwa Kiswahili cha kawaida bila kulifanya kuwa hitimisho la kimantiki kupita kiasi.
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: mfalme na ajulishwe
  rationale: Hii ni kauli rasmi ya barua za kiutawala. Muundo huu unadumisha heshima na urasmi wake kwa Kiswahili cha sasa.
- source_word: דִּי הֵן
  choice: kwamba ikiwa
  rationale: Maneno haya yanaingiza taarifa yenye sharti; “kwamba ikiwa” yanafuata uhusiano wa kisintaksia kwa ufasaha.
- source_word: קִרְיְתָא דָךְ
  choice: mji huu
  rationale: Kiwakilishi cha kuonyesha kinarejelea Yerusalemu kama mji unaozungumziwa na waandishi.
- source_word: תִּתְבְּנֵא
  choice: utajengwa upya
  rationale: Katika sharti hili, kitenzi kinahusu kurudishwa kwa mji katika hali yake kwa kuujenga tena.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: na kuta zake zikamilishwa
  rationale: Kitenzi kina maana ya kufikishwa mwisho au kukamilishwa; “kuta zake” kinaweka wazi uhusiano wake na mji.
- source_word: מִנְדָּה בְלוֹ וַהֲלָךְ
  choice: ushuru, kodi wala ada
  rationale: Haya ni makundi matatu tofauti ya malipo ya kiutawala ya Uajemi. Maneno ya Kiswahili yanadumisha orodha hiyo bila kudai tofauti zilizo sahihi zaidi kuliko ushahidi unavyoruhusu.
- source_word: לָא יִנְתְּנוּן
  choice: hawatalipa
  rationale: Ingawa maana ya msingi ni “hawatatoa,” katika muktadha wa malipo ya serikali Kiswahili cha kawaida hutumia “kulipa.” Kiima kisichotajwa kinaeleweka kuwa wakazi wa mji.
- source_word: וְאַפְּתֹם מַלְכִים תְּהַנְזִק
  choice: na hatimaye jambo hilo litapunguza mapato ya wafalme
  rationale: Usemi huu ni mfupi na maana yake kamili si dhahiri. Muktadha wa kutolipwa kwa tozo unaunga mkono “mapato,” huku tanbihi ikihifadhi uwezekano mpana wa hasara kwa wafalme.
