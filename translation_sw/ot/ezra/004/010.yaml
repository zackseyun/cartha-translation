base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/010.yaml
  text: 'and the rest of the peoples whom the great and noble Osnappar deported and settled in the city of Samaria[c][b][a], and in the rest of Beyond the River—and now:'
translation:
  language: sw
  text: na watu wengine ambao Osnapari, mkuu na mwenye heshima, aliwahamisha na akawapa makazi katika mji wa Samaria[a], na katika maeneo mengine ya Ng’ambo ya Mto[b]—na sasa:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mara nyingi Osnapari hutambuliwa kuwa mfalme wa Ashuru aitwaye Ashurbanipali, lakini hapa jina la Kiaramu lililo katika maandishi limehifadhiwa.
    reason: cross_reference
  - marker: b
    text: Au, “ng’ambo ya Mto.” Hili lilikuwa jina la kiutawala la Uajemi kwa eneo lililokuwa magharibi mwa Mto Frati.
    reason: cultural_note
  - marker: c
    text: Maneno ya mwisho ni kauli ya Kiaramu iliyotumiwa katika barua. Pia yanaweza kutafsiriwa “na kadhalika” au “wakati huo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר
  choice: watu wengine
  rationale: Katika muktadha huu neno linaonyesha watu waliobaki katika orodha pana; Kiswahili cha kawaida hutumia “watu wengine” kwa maana hiyo.
- source_word: אֻמַּיָּא
  choice: watu
  rationale: Neno la Kiaramu linamaanisha makundi ya watu; “watu” ni la kawaida na halilazimishi dhana ya kisiasa ya mataifa.
- source_word: הַגְלִי
  choice: aliwahamisha
  rationale: Kitenzi kinaeleza kuondolewa na kupelekwa mahali pengine na mamlaka ya kifalme; “aliwahamisha” kinaeleweka kwa urahisi na kinadokeza uhamisho wa kulazimishwa katika muktadha.
- source_word: אָסְנַפַּר
  choice: Osnapari
  rationale: Jina la Kiaramu limehifadhiwa kwa umbo linalosomeka kiasili katika Kiswahili badala ya kubadilishwa kuwa Ashurbanipali.
- source_word: רַבָּא וְיַקִּירָא
  choice: mkuu na mwenye heshima
  rationale: Maneno haya ni vyeo vya heshima; tafsiri hii huhifadhi mtindo rasmi bila kutumia lugha ya kizamani.
- source_word: וְהוֹתֵב הִמּוֹ
  choice: na kuwapa makao
  rationale: Umbo la kisababishi linaonyesha kwamba aliwafanya wakae huko; “kuwapa makao” linaonyesha tendo la kuwatawalisha mahali.
- source_word: בְּקִרְיָה דִּי שָׁמְרָיִן
  choice: katika mji wa Samaria
  rationale: Nakala ya Kiaramu ina “mji” katika umoja, ambao umehifadhiwa badala ya kulainishwa kuwa “miji.”
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: na katika sehemu nyingine ya Ng’ambo ya Mto
  rationale: “Ng’ambo ya Mto” limehifadhiwa kama jina la eneo la kiutawala la Uajemi; “sehemu nyingine” hufanya uhusiano wa kisarufi ueleweke katika Kiswahili.
- source_word: וּכְעֶנֶת
  choice: 'na sasa:'
  rationale: Hii ni kauli ya kimabarua inayotanguliza kiini cha barua; nukta mbili zinaonyesha wazi mpito huo.
