base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/012.yaml
  text: Let it be known to the king that the Jews who came up from you to us have come to Jerusalem[a]. They are rebuilding the rebellious and wicked city[b], finishing the walls and repairing the foundations.
translation:
  language: sw
  text: Na ijulikane kwa mfalme kwamba Wayahudi[a] waliopanda kutoka kwako kuja kwetu wamefika Yerusalemu. Wanaujenga upya mji huo wa uasi na uovu, wanakamilisha kuta zake na kukarabati misingi yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wayudea.” Neno la Kiaramu linaweza kumaanisha watu wa Yuda/Yudea, au Wayahudi kwa maana pana zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuweka misingi yake.” Usemi wa Kiaramu si wazi kabisa; huenda unamaanisha kukarabati misingi iliyokuwapo au kuiweka mahali pake.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא
  choice: Mfalme na ajulishwe
  rationale: Ni fomula rasmi ya Kiaramu katika barua. Kiswahili hiki ni cha heshima, cha kawaida katika taarifa rasmi, na kinamtaja mpokeaji kwa uwazi.
- source_word: יְהוּדָיֵא
  choice: Wayahudi
  rationale: Neno linaweza kumaanisha Wayahudi kwa upana au watu wa Yuda/Yudea. “Wayahudi” ndilo neno la Kiswahili linalotambulika zaidi, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: סְלִקוּ מִן לְוָתָךְ עֲלֶינָא
  choice: waliopanda kutoka kwako kuja kwetu
  rationale: “Kupanda” huhifadhi maana ya mwendo ya סלק, na “kuja kwetu” huonyesha mtazamo wa waandishi waliokuwa katika eneo walikofika.
- source_word: אֲתוֹ לִירוּשְׁלֶם
  choice: wamefika Yerusalemu
  rationale: Huwasilisha kitendo cha kufika na umuhimu wake wa sasa katika taarifa ya barua kwa Kiswahili cha kawaida.
- source_word: קִרְיְתָא מָרָדְתָּא וּבִאישְׁתָּא
  choice: mji huo wa uasi na uovu
  rationale: Huhifadhi lugha kali ya kisiasa na kimaadili ya washtaki bila kuifanya kuwa kauli ya msimulizi.
- source_word: בָּנַיִן
  choice: wanaujenga upya
  rationale: Muktadha ni urejeshaji wa Yerusalemu iliyokuwapo hapo awali; “kujenga upya” ni ya asili na sahihi katika Kiswahili.
- source_word: וְשׁוּרַיָּא אֶשְׁכְּלָלוּ
  choice: wanakamilisha kuta zake
  rationale: Kitenzi kina maana ya kukamilisha au kufanya ziwe kamili; “wanakamilisha” huhifadhi maana hiyo moja kwa moja.
- source_word: וְאֻשַּׁיָּא יַחִיטוּ
  choice: kukarabati misingi yake
  rationale: Usemi wa Kiaramu una ugumu wa kifasiri. Katika muktadha wa urejeshaji, “kukarabati” ni chaguo linaloeleweka, huku maana ya kuweka misingi ikitajwa katika tanbihi.
