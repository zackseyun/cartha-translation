base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/017.yaml
  text: 'The king sent a reply to Rehum the commander[a], Shimshai the scribe, and the rest of their associates who live in Samaria, and the rest beyond the River: Peace[c][b]. And now—'
translation:
  language: sw
  text: 'Mfalme akatuma jibu kwa Rehumu, mkuu wa utawala[a], Shimshai mwandishi, na wengine wa washirika wao wanaoishi Samaria, na wengine walio Ng’ambo ya Mto[b]: Amani[c]. Na sasa—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kansela” au “afisa mkuu.” Maana kamili ya cheo hiki cha Kiaramu haijulikani kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: “Ng’ambo ya Mto” ni jina la eneo la utawala wa Uajemi lililokuwa magharibi mwa Mto Frati.
    reason: cultural_note
  - marker: c
    text: Au, “Salamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: jibu
  rationale: Katika muktadha huu ni ujumbe rasmi wa mfalme unaojibu barua iliyotangulia; “jibu” linaonyesha uhusiano huo bila kuifanya lazima iwe amri rasmi.
- source_word: שְׁלַח
  choice: akatuma
  rationale: Ni tafsiri ya kawaida ya kitenzi hiki na inafaa mtiririko wa simulizi.
- source_word: מַלְכָּא
  choice: Mfalme
  rationale: Umbo hilo ni bainifu katika muktadha na linamtaja mfalme wa Uajemi aliyekwisha tajwa.
- source_word: עַל
  choice: kwa
  rationale: Baada ya kitenzi cha kutuma, neno hili linaonyesha wapokeaji wa ujumbe.
- source_word: בְּעֵל טְעֵם
  choice: mkuu wa utawala
  rationale: Cheo hiki cha kiutawala kina maana isiyo hakika kabisa. “Mkuu wa utawala” ni cha kawaida na hakikibani kuwa cheo mahususi kupita ushahidi wa Kiaramu.
- source_word: סָפְרָא
  choice: mwandishi
  rationale: Hutaja afisa mwenye jukumu la uandishi; “mwandishi” ni neno la kawaida la kibiblia na la kiutawala katika Kiswahili.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: washirika wao wengine
  rationale: Kifungu hiki kinawataja wengine waliofungamana na maafisa waliotajwa; “washirika” kinahifadhi upana huo.
- source_word: דִּי יָתְבִין בְּשָׁמְרָיִן
  choice: waliokuwa wanaishi Samaria
  rationale: Kirai cha kishiriki kinaonyesha makazi, na tafsiri hii ni ya kawaida katika Kiswahili cha sasa.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: na sehemu nyingine ya Ng’ambo ya Mto
  rationale: “Ng’ambo ya Mto” ni jina la eneo la utawala wa Uajemi upande wa magharibi wa Frati. “Sehemu nyingine” huwasilisha שְׁאָר bila kuongeza neno lisilokuwamo wazi la “jimbo.”
- source_word: שְׁלָם
  choice: Amani
  rationale: Ni salamu ya barua; “Amani” huhifadhi maana ya msingi, huku “Salamu” ikiwa njia nyingine ya kuiwasilisha kimatumizi.
- source_word: וּכְעֶת
  choice: Na sasa—
  rationale: Ni fomula ya kuingiza kiini cha ujumbe; alama ya mkato inaonyesha kwamba sentensi inaendelea katika mstari unaofuata.
