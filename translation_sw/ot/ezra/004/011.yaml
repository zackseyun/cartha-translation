  text: 'This is a copy of the letter that they sent to King Artaxerxes: “Your servants[a], the men of Beyond the River[b], and now—”'
translation:
  language: sw
  text: 'Hii ndiyo nakala ya barua waliyomtumia Mfalme Artashasta: “Watumishi wako, watu wa Ng’ambo ya Mto[a], na sasa—”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ng’ambo ya Mto” lilikuwa jina la kiutawala la Uajemi kwa eneo lililokuwa magharibi mwa Mto Frati; pia linaweza kutafsiriwa “waliotoka Ng’ambo ya Mto.”
    reason: lexical_alternative
  - marker: b
    text: Maneno ya Kiaramu hapa ni fomula rasmi ya barua, ambayo kwa desturi hutafsiriwa “na wakati kama huu” au kueleweka kuwa “na kadhalika.” Maandishi yanaendelea katika aya inayofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה פַּרְשֶׁגֶן אִגַּרְתָּא
  choice: Hii ndiyo nakala ya barua
  rationale: Kauli hii inatanguliza nakala ya waraka rasmi; “nakala ya barua” ni ya kawaida, wazi, na inadumisha maana ya maandishi ya Kiaramu.
- source_word: דִּי שְׁלַחוּ עֲלוֹהִי עַל אַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: waliyomtumia Mfalme Artashasta
  rationale: Muktadha wa barua unaonyesha kwamba mfalme ndiye mpokeaji. Muundo wa Kiswahili wenye kiambishi cha mtendewa ni wa asili na huepuka kurudia “kwa/to” kusiko lazima.
- source_word: עַבְדָיךְ
  choice: Watumishi wako
  rationale: Hii inadumisha lugha rasmi ya unyenyekevu iliyotumiwa na walio chini ya mfalme, bila kuifasiri zaidi kuwa “maafisa wako.”
- source_word: אֱנָשׁ
  choice: watu
  rationale: Nomino ya Kiaramu imetumiwa kwa maana ya jumla ya kundi. “Watu” ni Kiswahili cha kawaida na cha heshima katika anwani hii, bila kulazimisha jinsia zaidi ya inavyohitajika katika Kiswahili.
- source_word: עֲבַר נַהֲרָה
  choice: wa Ng’ambo ya Mto
  rationale: Hifadhi tafsiri ya moja kwa moja ya jina la kiutawala la jimbo la Uajemi, huku herufi kubwa zikionyesha kuwa ni istilahi maalumu ya kijiografia.
- source_word: וּכְעֶנֶת
  choice: Na sasa—
  rationale: Kauli hii ni fomula rasmi ya barua na mstari unaendelea katika aya inayofuata. “Na sasa—” inadumisha mpito na hali ya sentensi kutokamilika.
