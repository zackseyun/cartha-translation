translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima unaofaa barua ya kifalme. Jina “Artashasta” linafuata umbo lililozoeleka katika Biblia za Kiswahili. Alama ya mstari mrefu inaonyesha wazi kwamba dondoo la barua linaendelea katika aya inayofuata.
