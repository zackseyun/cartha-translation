base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/009.yaml
  text: Then Rehum the commander[a], Shimshai the scribe, and the rest of their associates—the judges, the officials, the Tarpelites, the Persians, the Erechites, the Babylonians, the men of Susa (that is[b], the Elamites)—
translation:
  language: sw
  text: Ndipo Rehumu, mkuu wa utawala, Shimshai, mwandishi, na washirika wao wengine—waamuzi[a], maafisa[b], Watarpeli, Waajemi, Waereki, Wababeli, na watu wa Susa (yaani, Waelamu)—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wadinai.” Neno la Kiaramu דִּינָיֵא linaweza kuwa jina la kundi la watu, kama lilivyoeleweka katika tafsiri nyingi za jadi, au cheo cha kiutawala kinachomaanisha “waamuzi.”
    reason: alternative_reading
  - marker: b
    text: Au “Waafarsathki.” Neno la Kiaramu אֲפַרְסַתְכָיֵא halina maana iliyo hakika; mara nyingi limetoholewa kama jina la kundi la watu, lakini hapa limeeleweka kuwa jina la maafisa wa utawala.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱדַיִן
  choice: Ndipo
  rationale: Kielezi hiki cha Kiaramu kinaendeleza mfuatano wa simulizi; “Ndipo” ni cha kawaida na huonyesha hatua inayofuata.
- source_word: רְחוּם בְּעֵל טְעֵם
  choice: Rehumu, mkuu wa utawala
  rationale: Jina limetoholewa, na cheo chenye maana inayobishaniwa kimetafsiriwa kwa namna ya jumla inayoonyesha mamlaka ya kiutawala bila kudai wazi kuwa ni cheo cha kijeshi.
- source_word: שִׁמְשַׁי סָפְרָא
  choice: Shimshai mwandishi
  rationale: סָפְרָא humaanisha mwandishi au katibu katika mazingira ya kiutawala; “mwandishi” ni tafsiri ya moja kwa moja na inayoeleweka.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: washirika wao wengine
  rationale: Kirai hiki kinataja waliobaki walioungana nao; “washirika wao wengine” ni Kiswahili cha kawaida na kinachofaa mazingira haya.
- source_word: דִּינָיֵא
  choice: waamuzi
  rationale: Umbo hili linaweza kueleweka kama cheo cha kiutawala, “waamuzi,” ingawa mapokeo mengine hulichukulia kuwa jina la kundi la watu; uwezekano huo umehifadhiwa katika tanbihi.
- source_word: אֲפַרְסַתְכָיֵא
  choice: maofisa
  rationale: Neno hili gumu limeeleweka hapa kama jina la watendaji wa kiutawala. Tafsiri ya jumla “maofisa” haiongezi bila msingi wazo la cheo cha chini; uwezekano wa kuwa jina la kundi umeonyeshwa katika tanbihi.
- source_word: טַרְפְּלָיֵא
  choice: Watarpeli
  rationale: Ni jina la kundi lisilotambulika kwa uhakika, kwa hiyo limetoholewa badala ya kufasiriwa kwa kubahatisha.
- source_word: אֲפָרְסָיֵא
  choice: Waajemi
  rationale: Ni jina linalotambulika la watu wa Uajemi; “Waajemi” ndiyo istilahi ya kawaida ya Kiswahili.
- source_word: ארכוי
  choice: Waarki
  rationale: Ni jina la watu wanaohusishwa na Ereki/Uruki; limetoholewa kwa ufupi kwa sababu utambulisho wake haupaswi kuelezwa zaidi ya ushahidi wa maandishi.
- source_word: בָבְלָיֵא
  choice: Wababeli
  rationale: Ni jina la watu wa Babeli na limetafsiriwa kwa umbo la kawaida la Kiswahili.
- source_word: שׁוּשַׁנְכָיֵא דהוא עֵלְמָיֵא
  choice: watu wa Susa (yaani, Waelamu)
  rationale: Maandishi yenyewe yanawatambulisha watu wa Susa kuwa Waelamu; mabano yanaweka ufafanuzi huo wazi bila kubadili uhusiano wake.
