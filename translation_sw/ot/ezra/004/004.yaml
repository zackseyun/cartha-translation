  text: Then the people of the land kept weakening the hands of the people of Judah and frightening them from building[a][b].
translation:
  language: sw
  text: Ndipo watu wa nchi wakawavunja moyo watu wa Yuda[a] na kuwatia hofu ili wasijenge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kudhoofisha mikono ya,” nahau yenye maana ya kuwavunja moyo au kudhoofisha azimio lao.'
    reason: lexical_alternative
  - marker: b
