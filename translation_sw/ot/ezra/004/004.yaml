    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Ndipo
  rationale: Waw-consecutive inaendeleza simulizi kwa tukio linalofuata; “Ndipo” ni ya asili katika Kiswahili cha kisasa.
- source_word: עַם הָאָרֶץ
  choice: watu wa nchi hiyo
  rationale: Inahifadhi usemi wa Kiebrania huku “hiyo” ikionyesha kwa kawaida wakazi wa eneo linalozungumziwa.
- source_word: מְרַפִּים יְדֵי
  choice: wakaendelea kuwavunja moyo
  rationale: Usemi halisi ni “kudhoofisha mikono,” yaani kudhoofisha azimio au kuwakatisha tamaa. Tafsiri ya matini inaweka maana ya nahau kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi picha ya Kiebrania. Umbo la participle linaonyesha tendo lililoendelea.
- source_word: עַם יְהוּדָה
  choice: watu wa Yuda
  rationale: Ni tafsiri ya moja kwa moja ya jumuiya ya Wayuda iliyokuwa ikijenga.
- source_word: וּמְבַלְהִים
  choice: na kuwatia hofu
  rationale: Mzizi בהל hapa unasababisha hofu au fadhaa; “kuwatia hofu” ni wa kawaida na unaendana na tendo la kuwavunja moyo.
- source_word: אוֹתָם
  choice: wa-
  rationale: Kiambishi cha yambwa katika “kuwatia” kinawarejelea watu wa Yuda kwa kawaida katika sarufi ya Kiswahili.
- source_word: לִבְנוֹת
  choice: ili wasijenge
  rationale: Katika muktadha, infinitive yenye ל inaonyesha shughuli ambayo wapinzani walitaka kuizuia. “Ili wasijenge” huwasilisha kusudi/athari hiyo kwa uwazi bila kutumia muundo usio wa asili.
theological_decisions:
- issue: Uhusiano wa לִבְנוֹת na tendo la kuwatia hofu
  choice: ili wasijenge
  alternative: kuwatia hofu wasijenge / kuwafanya waogope kujenga
  rationale: Kiebrania ni kifupi na kinaweza kuonyesha kuwazuia kujenga au kuwafanya waogope kujenga. Matini inatoa maana ya kuzuia inayodokezwa na muktadha, na tanbihi inahifadhi uwezekano wa pili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau ya Kiebrania imetafsiriwa kwa maana yake katika matini ili ieleweke kwa urahisi, na picha yake halisi imehifadhiwa katika tanbihi. Alama zote za tanbihi zimewekwa katika matini.
