lexical_decisions:
- source_word: כְּעַן
  choice: Basi
  rationale: Katika muktadha huu neno la Kiaramu linaanzisha agizo la mfalme linalopaswa kutekelezwa mara moja; “Basi” ni la kawaida na lenye uzito wa kiutawala.
- source_word: שִׂימוּ טְּעֵם
  choice: toeni amri
  rationale: Nahau hii, kihalisi “wekeni amri/uamuzi,” inarejelewa kwa Kiswahili cha kawaida na rasmi kuwa “toeni amri.”
- source_word: לְבַטָּלָא
  choice: ili kuwazuia
  rationale: Kitenzi kina maana ya kusimamisha au kusababisha shughuli ikome. “Kuwazuia” kinaonyesha kwamba watu hao walipaswa kulazimishwa kuacha kazi yao.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: watu hawa
  rationale: Ingawa kihalisi ni “wanaume hawa,” katika Kiswahili “watu hawa” hurejelea kundi husika kwa njia ya asili bila kubadili rejeleo la muktadha.
- source_word: וְקִרְיְתָא דָךְ לָא תִתְבְּנֵא
  choice: nao mji huu usijengwe upya
  rationale: Huhifadhi kiunganishi, kauli tendwa, na nguvu ya katazo la kiutawala katika sentensi ya Kiaramu.
- source_word: עַד מִנִּי טַעְמָא יִתְּשָׂם
  choice: mpaka nitakapotoa amri nyingine
  rationale: Kihalisi ni “mpaka amri iwekwe kutoka kwangu.” Kiswahili tendaji ni cha asili zaidi; “nyingine” huonyesha kwa uwazi kwamba ni amri ya baadaye, bila kubadili maana.
