  text: Sasa, toeni amri ili kuwafanya wanaume hawa waache[a], na mji huu usijengwe upya mpaka nitoe amri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili kuwasimamisha wanaume hawa.”
