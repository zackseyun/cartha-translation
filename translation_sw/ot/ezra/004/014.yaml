  text: כְּעַ֗ן כָּ/ל קֳבֵל֙ דִּֽי מְלַ֤ח הֵֽיכְלָ/א֙ מְלַ֔חְנָא וְ/עַרְוַ֣ת מַלְכָּ֔/א לָ֥א אֲֽרִֽיךְ לַ֖/נָא לְ/מֶֽחֱזֵ֑א עַ֨ל דְּנָ֔ה שְׁלַ֖חְנָא וְ/הוֹדַ֥עְנָא לְ/מַלְכָּֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/014.yaml
  text: Because we eat the salt of the palace, and it is not fitting for us to see the king’s dishonor, therefore we have sent and informed the king,
translation:
  language: sw
  text: Kwa kuwa tunakula chumvi ya ikulu, wala si vema kwetu kuona fedheha ya mfalme, ndiyo sababu tumetuma ujumbe na kumjulisha mfalme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְלַח הֵיכְלָא מְלַחְנָא
  choice: tunakula chumvi ya ikulu
  rationale: Nahau hii ya Kiaramu inaeleza kuwa waandishi walikuwa wakipata riziki au manufaa kutoka kwa ikulu. Tafsiri ya moja kwa moja imehifadhiwa kwa sababu ni wazi vya kutosha katika muktadha na inadumisha taswira ya chanzo.
- source_word: עֶרְוַת מַלְכָּא
  choice: mfalme akivunjiwa heshima
  rationale: Neno עֶרְוָה kimsingi huhusu uchi au kufunuliwa, lakini hapa kwa njia ya sitiari linamaanisha fedheha, hasara ya heshima, au jambo la aibu kwa mfalme. Muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: שְׁלַחְנָא וְהוֹדַעְנָא
  choice: tumetuma ujumbe huu kumjulisha
  rationale: Vitenzi viwili kwa pamoja vinaeleza tendo la kutuma taarifa kwa mfalme. Kutaja “ujumbe huu” kunafanya Kiswahili kiwe cha asili bila kubadili maana ya msingi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa msomaji wa kawaida. Nahau ya chumvi imehifadhiwa, huku sitiari ya fedheha ikitolewa kwa lugha ya kawaida.
