    issue: “hatustahili” for לָא אֲרִיךְ לַנָא
    rationale: This wording can mean “we do not deserve,” whereas the Aramaic states that it is not fitting/proper for them to see the king's dishonor.
  - severity: low
    issue: “ujumbe huu”
    rationale: The demonstrative “huu” is not present in the source. A non-demonstrative expression can retain the implied act of sending a report while avoiding this addition.
