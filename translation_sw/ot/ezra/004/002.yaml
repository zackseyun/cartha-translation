base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/002.yaml
  text: Then they approached Zerubbabel and the heads of the fathers’ houses and said to them[a], “Let us build with you, for like you we seek your God, and we have been sacrificing to him since the days of Esar-haddon king of Assyria[b], who brought us up here.”
translation:
  language: sw
  text: Ndipo wakawakaribia Zerubabeli na wakuu wa jamaa za ukoo, wakawaambia, “Tujenge pamoja nanyi, kwa maana sisi, kama ninyi, tunamtafuta Mungu wenu[b], na tumekuwa tukimtolea dhabihu[a] tangu siku za Esar-hadoni, mfalme wa Ashuru, aliyetupandisha kuja hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kiebrania yaliyoandikwa yanasema kihalisi, “na si sisi tunaotoa dhabihu.” Hata hivyo, usomaji wa kimapokeo unaeleweka kuwa “na kwake tunatoa dhabihu,” maana chanya inayolingana na muktadha.
    reason: textual_variant
  - marker: b
    text: Au, “tunamwabudu Mungu wenu” au “tunamwomba Mungu wenu mashauri.” Kitenzi cha Kiebrania cha “kutafuta” kinaweza kuwa na maana za kidini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: wakamwendea
  rationale: Inaonyesha kuwakaribia Zerubabeli na viongozi kwa kusudi la kusema nao, kwa Kiswahili cha kawaida cha masimulizi.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: viongozi wa jamaa za ukoo
  rationale: Inahifadhi wazo la viongozi wa vikundi vya kifamilia vya mababu bila kutumia msemo usio wa kawaida ‘vichwa vya baba’.
- source_word: נִבְנֶה עִמָּכֶם
  choice: Turuhusuni tujenge pamoja nanyi
  rationale: Kauli ya nafsi ya kwanza wingi ina nguvu ya pendekezo au ombi; ‘turuhusuni’ huifanya hali hiyo iwe wazi na ya kawaida katika Kiswahili.
- source_word: כִּי כָכֶם
  choice: kwa maana sisi, kama ninyi
  rationale: Inadumisha ulinganisho ambao wasemaji wanadai kuwa msingi wa kushirikiana.
- source_word: נִדְרֹשׁ לֵאלֹהֵיכֶם
  choice: tunamtafuta Mungu wenu
  rationale: ‘Kumtafuta’ huhifadhi upana wa דרשׁ, ambayo katika muktadha wa dini inaweza kumaanisha kumtafuta, kumwomba mashauri, au kumwabudu.
- source_word: ולא אֲנַחְנוּ זֹבְחִים
  choice: na tumekuwa tukimtolea dhabihu
  rationale: Tafsiri inafuata maana chanya inayodokezwa na muktadha na usomaji wa kimapokeo לו (‘kwake’), huku ugumu wa maandishi ukielezwa katika tanbihi.
- source_word: מִימֵי אֵסַר חַדֹּן
  choice: tangu siku za Esar-hadoni
  rationale: ‘Tangu siku za’ ni namna ya kawaida ya Kiswahili ya kuonyesha kipindi kinachoanzia zamani na kuendelea hadi wakati wa usemi.
- source_word: הַמַּעֲלֶה אֹתָנוּ פֹּה
  choice: aliyetupandisha kuja hapa
  rationale: Inahifadhi kauli ya kusababisha na mwelekeo wa ‘kupanda’ uliopo katika Kiebrania, kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Dai la kidini la walowezi
  choice: tunamtafuta Mungu wenu; tumekuwa tukimtolea dhabihu
  alternative: tunamwabudu Mungu wenu; tunamwomba mashauri Mungu wenu
  rationale: Maneno yanaeleza dai lao bila kuthibitisha wala kukanusha unyoofu au usahihi wake wa kidini; mvutano huo unabaki katika muktadha wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Jamaa za ukoo’ linaeleza muundo wa kifamilia wa רָאשֵׁי הָאָבוֹת kwa uwazi. Alama zote za tanbihi zimewekwa katika matini kuu; tanbihi [a] inaambatana na kishazi chenye tatizo la maandishi, na [b] na usemi wa mwisho kuhusu kuletwa au kupandishwa hapa.
