  yaml_path: translation/ot/ezra/004/020.yaml
  text: And mighty kings were over Jerusalem, ruling over all the region Beyond the River, and tribute, tax, and toll were paid to them.
translation:
  language: sw
  text: Na wafalme wenye nguvu walikuwa na mamlaka juu ya Yerusalemu, wakitawala Ng’ambo yote ya Mto[a]; ushuru, kodi, na ada[b] zililipwa kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ng’ambo ya Mto” lilikuwa jina rasmi la eneo la utawala la Uajemi lililokuwa magharibi mwa Mto Frati.
    reason: cultural_note
  - marker: b
    text: Maneno haya matatu yanataja aina tofauti za mapato ya utawala. Neno la mwisho linaweza kumaanisha ada ya njia, usafirishaji, au forodha.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִין תַּקִּיפִין
  choice: wafalme wenye nguvu
  rationale: Huhifadhi wingi na wazo la nguvu au uwezo wa kifalme kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: הֲווֹ עַל יְרוּשְׁלֶם
  choice: walitawala Yerusalemu
  rationale: Katika muktadha huu עַל huonyesha mamlaka juu ya Yerusalemu, si kuwapo mahali tu; kitenzi ‘walitawala’ ni cha asili katika Kiswahili.
- source_word: וְשַׁלִּיטִין בְּכֹל עֲבַר נַהֲרָה
  choice: na kuitawala nchi yote Ng’ambo ya Mto
  rationale: Huwasilisha utawala juu ya eneo lote huku ‘Ng’ambo ya Mto’ ikihifadhi jina rasmi la eneo la kifalme lililokuwa magharibi mwa Frati.
- source_word: מִדָּה
  choice: ushuru
  rationale: Ni neno la kwanza katika orodha ya aina tatu za mapato ya utawala; ‘ushuru’ huonyesha malipo yaliyotozwa na mamlaka.
- source_word: בְלוֹ
  choice: kodi
  rationale: Hutoa maana pana na inayoeleweka ya aina tofauti ya tozo katika fomula hii ya kiutawala.
- source_word: הֲלָךְ
  choice: ada
  rationale: Huonyesha tozo kama ya njia, usafirishaji au forodha bila kuilinganisha kabisa na ‘kodi’; tanbihi inaeleza uwezekano wa maana.
- source_word: מִתְיְהֵב לְהוֹן
  choice: nao walipewa
  rationale: Huhifadhi muundo wa kutendwa, yaani mapato hayo yaliwasilishwa kwa wafalme; kiwakilishi ‘wao’ kinarejelea wafalme.
