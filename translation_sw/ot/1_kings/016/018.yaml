base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/018.yaml
  text: And when Zimri saw that the city had been captured[a], he went into the citadel of the king’s house and burned the king’s house over himself with fire[b], and died.
translation:
  language: sw
  text: Ikawa, Zimri alipoona kwamba mji ulikuwa umetwaliwa, akaingia katika ngome ya ikulu ya mfalme[a], akaichoma kwa moto ikulu ya mfalme juu yake mwenyewe[b], akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ngome” au “ikulu yenye ngome.” Neno la Kiebrania אַרְמוֹן linaweza kutaja jengo la kifalme lenye ulinzi.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “akaichoma kwa moto ikulu ya mfalme juu yake mwenyewe.” Usemi huu unaonyesha kwamba Zimri aliichoma ikulu hiyo huku yeye mwenyewe akiwa chini ya moto huo; mstari unasema kwamba akafa.
    reason: cultural_note
lexical_decisions:
- source_word: כִּ/רְאוֹת
  choice: alipoona
  rationale: Muundo wa infinitivi pamoja na כ unaonyesha wakati; “alipoona” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo wa wakati.
- source_word: נִלְכְּדָה הָ/עִיר
  choice: mji ulikuwa umetwaliwa
  rationale: Nifali ya לכד ina maana ya kutwaliwa au kutekwa. Wakati uliotangulia katika “ulikuwa umetwaliwa” unaonyesha kwamba kutwaliwa kwa mji kulikuwa tayari kumetokea Zimri alipoliona.
- source_word: אַרְמוֹן בֵּית הַ/מֶּלֶךְ
  choice: ngome ya ikulu
  rationale: אַרְמוֹן hapa inaweza kumaanisha jengo la kifalme lenye ulinzi au ngome ya ndani. “Ngome ya ikulu” ni ya asili katika Kiswahili na inaitofautisha na בֵּית הַמֶּלֶךְ inayofuata.
- source_word: וַ/יִּשְׂרֹף ... אֶת בֵּית מֶלֶךְ בָּ/אֵשׁ
  choice: akaichoma kwa moto nyumba ya mfalme
  rationale: Huhifadhi kitenzi “choma,” chombo “kwa moto,” na kirai “nyumba ya mfalme” bila kuongeza wazi kwamba jengo lote liliteketea.
- source_word: עָלָי/ו
  choice: akiwa ndani
  rationale: Katika muktadha huu nyumba ilichomwa ikiwa imemzunguka Zimri. “Akiwa ndani” huwasilisha tendo la kujiangamiza kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi umbo halisi la Kiebrania.
- source_word: וַ/יָּמֹת
  choice: akafa
  rationale: Ni mwendelezo rahisi wa simulizi na matokeo ya kitendo kilichotangulia.
