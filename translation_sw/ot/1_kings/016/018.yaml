translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ngome ya ikulu” huepuka uradidi usio wa kawaida wa “nyumba ya mfalme” huku ikihifadhi tofauti kati ya אַרְמוֹן na בֵּית; tanbihi inaweka wazi uwezekano wa kileksika na usemi halisi kuhusu kujiteketeza.
