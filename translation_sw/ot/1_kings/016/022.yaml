  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa vikundi viwili pinzani umehifadhiwa. Hakuna tanbihi iliyowekwa kwa kuwa maana mbadala ya חזק inaweza kuwakilishwa kwa ufupi na kitenzi “kuwashinda” bila kupoteza mvutano muhimu wa kifungu.
