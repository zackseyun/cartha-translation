  text: וַ/יֶּחֱזַ֤ק הָ/עָם֙ אֲשֶׁ֣ר אַחֲרֵ֣י עָמְרִ֔י אֶת הָ/עָ֕ם אֲשֶׁ֥ר אַחֲרֵ֖י תִּבְנִ֣י בֶן גִּינַ֑ת וַ/יָּ֣מָת תִּבְנִ֔י וַ/יִּמְלֹ֖ךְ עָמְרִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/022.yaml
  text: But the people who followed Omri prevailed over the people who followed Tibni son of Ginath. So Tibni died[a], and Omri became king.
translation:
  language: sw
  text: Lakini watu waliomuunga mkono Omri wakawashinda watu waliomuunga mkono Tibni mwana wa Ginathi. Basi Tibni akafa, na Omri akawa mfalme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: wakawashinda
  rationale: Katika muundo huu wenye אֶת, kitenzi חזק kinaonyesha kuwa kundi la Omri lilipata nguvu kuliko kundi pinzani na kulishinda katika pambano la kisiasa.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי עָמְרִי
  choice: watu waliomuunga mkono Omri
  rationale: אַחֲרֵי katika muktadha huu wa mgawanyiko wa kisiasa ina maana ya kumfuata au kumuunga mtu mkono; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: אֶת הָעָם אֲשֶׁר אַחֲרֵי תִּבְנִי
  choice: watu waliomuunga mkono Tibni
  rationale: Tafsiri hii inadumisha usambamba wa Kiebrania na kuonyesha wazi kundi pinzani lililokuwa upande wa Tibni.
- source_word: תִּבְנִי בֶן גִּינַת
  choice: Tibni mwana wa Ginathi
  rationale: בן ni utambulisho wa ukoo, na majina yametoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: וַיָּמָת תִּבְנִי
  choice: Basi Tibni akafa
  rationale: Waw ya kisimulizi inaendeleza mfuatano wa matukio. “Basi” huonyesha matokeo katika muktadha bila kudai wazi kwamba aliuawa.
- source_word: וַיִּמְלֹךְ עָמְרִי
  choice: Omri akawa mfalme
  rationale: מלך hapa inaonyesha Omri kupata ufalme baada ya kifo cha mpinzani wake; “akawa mfalme” ni ya asili na sahihi kwa muktadha.
theological_decisions: []
