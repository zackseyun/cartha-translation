base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/013.yaml
  text: because of all the sins of Baasha and the sins of Elah his son[a], which they committed and by which they caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: sw
  text: kwa sababu ya dhambi zote za Baasha na dhambi za Ela, mwanawe, dhambi walizozitenda na ambazo kwazo waliwafanya Waisraeli watende dhambi, wakimkasirisha Yahwe, Mungu wa Israeli, kwa sanamu zao zisizo na maana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa ubatili wao” au “kwa vitu vyao visivyo na maana,” usemi wa dhihaka unaotumiwa mara nyingi kuhusu sanamu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: kwa sababu ya
  rationale: Katika kauli hii ya hukumu, neno hili linaonyesha sababu ya hukumu iliyotangulia, wala si mwelekeo.
- source_word: כָּל חַטֹּאות
  choice: dhambi zote
  rationale: Tafsiri ya moja kwa moja inayodumisha ukamilifu wa shtaka.
- source_word: בַּעְשָׁא
  choice: Baasha
  rationale: Jina la mtu limetoholewa kwa tahajia inayotambulika katika Kiswahili.
- source_word: וְחַטֹּאות אֵלָה בְנוֹ
  choice: na dhambi za Ela mwanawe
  rationale: Inadumisha uhusiano wa Ela kuwa mwana wa Baasha kwa lugha ya kawaida ya Kiswahili.
- source_word: אֲשֶׁר חָטְאוּ
  choice: walizotenda
  rationale: Kitenzi kinarejelea dhambi zilizotajwa; ‘kutenda dhambi’ ni usemi wa kawaida wa Kiswahili.
- source_word: וַאֲשֶׁר הֶחֱטִיאוּ אֶת יִשְׂרָאֵל
  choice: na ambazo kwa hizo waliwasababisha watu wa Israeli watende dhambi
  rationale: Hifili ya חטא ina maana ya kusababisha; ‘watu wa Israeli’ huweka wazi kwamba jina la taifa linawakilisha watu wake.
- source_word: לְהַכְעִיס
  choice: wakimkasirisha
  rationale: Inawasilisha matokeo au kusudi la matendo yao kwa mtiririko wa kawaida wa Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo wa kawaida unaomtambulisha Mungu ambaye walimkasirisha.
- source_word: בְּהַבְלֵיהֶם
  choice: kwa sanamu zao zisizo na maana
  rationale: הֶבֶל kimsingi ni pumzi au mvuke, na kwa upanuzi ni kitu kisicho na maana au chenye ubatili; katika muktadha huu linarejelea sanamu kwa dhihaka. Tafsiri hii inaweka wazi rejeleo bila kupoteza nguvu ya dhihaka.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya בְּהַבְלֵיהֶם katika muktadha wa ibada ya sanamu
  choice: kwa sanamu zao zisizo na maana
  alternative: kwa ubatili wao; kwa vitu vyao visivyo na maana
  rationale: Neno lina maana halisi ya kitu kama pumzi au mvuke na kwa njia ya dhihaka humaanisha vitu visivyo na thamani. Muktadha unaelekeza kwa sanamu, lakini tanbihi inadumisha taswira na upana wa neno la Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unabaki karibu na sentensi ya Kiebrania huku ukitumia ‘watu wa Israeli’ ili kitenzi cha wingi kiwe wazi. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja.
