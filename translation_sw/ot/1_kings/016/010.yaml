base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/010.yaml
  text: Then Zimri came in, struck him down, and killed him, in the twenty-seventh year of Asa king of Judah; and he reigned in his place.
translation:
  language: sw
  text: Ndipo Zimri akaingia, akampiga na kumuua katika mwaka wa ishirini na saba wa utawala wa Asa, mfalme wa Yuda; naye akawa mfalme badala yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Ndipo ... akaingia
  rationale: Kitenzi בוא kinaweza kumaanisha ‘kuja’ au ‘kuingia.’ Katika muktadha huu wa mauaji ndani ya jengo, ‘akaingia’ ni ya kawaida na haiainishi mahali pasipotajwa; ‘Ndipo’ huendeleza mfuatano wa simulizi.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Jina la mtu limenukuliwa kwa umbo linalotambulika katika Kiswahili.
- source_word: וַיַּכֵּהוּ
  choice: akampiga
  rationale: נכה humaanisha ‘kupiga.’ Tafsiri hii inadumisha tendo la kwanza tofauti na kitenzi kinachofuata cha kumuua bila kuongeza maelezo yasiyokuwapo.
- source_word: וַיְמִיתֵהוּ
  choice: na kumuua
  rationale: Katika Hiphil, מות humaanisha kusababisha afe, yaani ‘kuua’; huu ni usemi wa moja kwa moja na wa kawaida.
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע
  choice: katika mwaka wa ishirini na saba
  rationale: Huu ni mtindo wa kawaida wa kutaja mwaka wa utawala.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: wa utawala wa Asa, mfalme wa Yuda
  rationale: לְ huonyesha kwamba mwaka unahesabiwa kwa kurejelea utawala wa Asa. Kuongeza ‘utawala’ kunafanya maana ya mfumo wa tarehe iwe wazi katika Kiswahili bila kubadili taarifa.
- source_word: וַיִּמְלֹךְ
  choice: naye akatawala
  rationale: מלך inaweza kumaanisha ‘kutawala’ au ‘kuwa mfalme.’ ‘Akatawala’ huhifadhi uchaguzi wa kitenzi cha Kiebrania, huku kirai kinachofuata kikionyesha urithi wa kiti cha ufalme.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika muktadha wa urithi wa kifalme, תחתיו humaanisha kuchukua nafasi ya mtangulizi; ‘mahali pake’ ni tafsiri wazi na ya karibu.
