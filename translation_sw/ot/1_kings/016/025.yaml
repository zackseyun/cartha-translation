base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/025.yaml
  text: Omri did what was evil in the eyes of Yahweh[a], and he did more evil than all who were before him.
translation:
  language: sw
  text: Omri akafanya yaliyo maovu machoni pa Yahwe, naye akatenda maovu zaidi kuliko wote waliomtangulia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye alikuwa mwovu kuliko wote waliomtangulia.” Kitenzi cha Kiebrania kinaweza kueleweka kuwa kinamwelezea Omri mwenyewe au matendo yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה
  choice: akafanya
  rationale: Kitenzi עשה pamoja na הָרַע humaanisha kufanya matendo maovu; “akafanya” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: הָרַע
  choice: yaliyo maovu
  rationale: Neno lenye kibainishi limetumika kama nomino katika usemi wa kawaida wa Kiebrania unaomaanisha kufanya mambo yaliyo maovu.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Hii inahifadhi taswira ya nahau ya Kiebrania inayoonyesha tathmini kutoka kwa mtazamo wa Yahwe, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: וַיָּרַע
  choice: akatenda maovu
  rationale: Katika muktadha huu umbo la kitenzi linaeleza kuwa Omri alizidi katika uovu wa matendo; “akatenda maovu” pia hudumisha mwendelezo na kishazi cha kwanza.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: kuliko wote waliomtangulia
  rationale: Usemi huu unawalinganisha Omri na wote waliokuwa kabla yake. “Waliomtangulia” ni wazi na wa kawaida bila kuongeza neno “wafalme,” ambalo halijatajwa wazi katika mstari huu.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וַיָּרַע
  choice: akatenda maovu
  alternative: alikuwa mwovu zaidi
  rationale: Muktadha wa tathmini ya matendo ya mfalme unaunga mkono “akatenda maovu,” lakini kitenzi cha Kiebrania kinaweza pia kueleweka kuwa kinamwelezea Omri mwenyewe; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa urahisi. Muundo wa Kiebrania “machoni pa” umehifadhiwa kwa sababu ni taswira iliyo wazi katika Kiswahili. Kiunganishi “naye” kinaonyesha kishazi kipya chenye mhusika yuleyule.
