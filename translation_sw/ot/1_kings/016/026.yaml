base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/026.yaml
  text: For he walked in all the way of Jeroboam son of Nebat[a], and in his sins by which he caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: sw
  text: Kwa maana alifuata kabisa mwenendo wa Yeroboamu mwana wa Nebati na dhambi zake, ambazo kwazo aliwafanya Israeli watende dhambi, akimkasirisha Yahweh, Mungu wa Israeli, kwa sanamu zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa mambo yao ya ubatili” au “kwa vitu vyao visivyo na thamani”; neno hili hutumiwa kwa kejeli kuhusu sanamu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: alifuata kabisa mwenendo
  rationale: Katika muktadha huu, הלך בדרך ni sitiari ya mwenendo wa maisha, si kutembea kimwili. Kauli hii ya Kiswahili inaonyesha kufuata kikamilifu kielelezo cha Yeroboamu kwa lugha ya kawaida na yenye heshima.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Majina yametoholewa kwa tahajia inayotambulika katika matumizi ya Biblia za Kiswahili.
- source_word: וּבְחַטֹּאתָיו
  choice: na dhambi zake
  rationale: Nomino ya wingi yenye kiambishi cha nafsi ya tatu umoja inarejelea dhambi za Yeroboamu.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ambazo kwa hizo aliwasababisha Israeli watende dhambi
  rationale: Muundo wa Hiphil wa חטא una maana ya kusababisha; tafsiri hii inalinda nguvu hiyo ya kisababishi. 'Israeli' hapa inaeleweka kuwa watu, hivyo upatanisho wa wingi umetumiwa.
- source_word: לְהַכְעִיס
  choice: akimkasirisha
  rationale: Kitenzi-jina kinaweza kuonyesha kusudi au matokeo. Muundo huu wa Kiswahili huhifadhi uhusiano huo bila kulazimisha uchaguzi kati ya maana hizo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hii ni tafsiri ya moja kwa moja ya muundo wa utegemezi wa Kiebrania.
- source_word: בְּהַבְלֵיהֶם
  choice: kwa sanamu zao
  rationale: הבל kimsingi ni kitu cha mvuke, ubatili, au kisicho na thamani; katika muktadha huu ni neno la kejeli kwa sanamu. 'Sanamu' huwasilisha rejeleo kwa uwazi, huku sitiari halisi ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko lina jina la pekee la Mungu, si cheo. 'Yahweh' hulihifadhi kama jina na hufuata ushahidi wa matamshi unaokubalika kwa kawaida.
- issue: Uhusiano wa לְהַכְעִיס na mwenendo uliotangulia
  choice: akimkasirisha
  alternative: ili amkasirishe
  rationale: Kiebrania kinaweza kueleweka kuwa kusudi au matokeo. Muundo wa kishirikishi katika Kiswahili unaacha mvutano huo wazi badala ya kuamua kwamba kusudi la moja kwa moja ndilo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya Kiebrania ya 'kutembea katika njia' imewasilishwa kwa usemi asilia 'kufuata mwenendo,' huku maana na msisitizo wake vikihifadhiwa.
