base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/030.yaml
  text: Ahab son of Omri did what was evil in the sight of Yahweh[b][a], more than all who were before him.
translation:
  language: sw
  text: Ahabu mwana wa Omri akafanya yaliyo maovu machoni pa Yahweh kuliko wote waliomtangulia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi עשה ni ‘kufanya’; pamoja na הָרַע kinaunda usemi wa kawaida wa kufanya yaliyo maovu.
- source_word: הָרַע
  choice: yaliyo maovu
  rationale: Kivumishi chenye kibainishi kimetumika kama nomino; ‘yaliyo maovu’ ni Kiswahili cha kawaida na huhifadhi tathmini ya kimaadili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Tafsiri hii huhifadhi kwa njia ya asili nahau ya Kiebrania inayomaanisha kwa mtazamo au tathmini ya Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: kuliko wote waliomtangulia
  rationale: מן ni ya ulinganisho, na לְפָנָיו hapa ina maana ya wale waliokuwapo kabla yake; usemi huu ni wazi na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina יהוה; ‘Yahweh’ huhifadhi jina hilo bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Nahau ‘machoni pa Yahweh’ imehifadhiwa kwa kuwa ni ya kawaida na inaeleweka; ‘waliomtangulia’ huonyesha wazi maana ya wakati ya לְפָנָיו.
