  yaml_path: translation/ot/1_kings/016/023.yaml
  text: In the thirty-first year of Asa king of Judah[a], Omri became king over Israel for twelve years; he reigned in Tirzah six years.
translation:
  language: sw
  text: Katika mwaka wa thelathini na moja wa Asa, mfalme wa Yuda, Omri alianza kutawala Israeli kwa miaka kumi na miwili; alitawala huko Tirza kwa miaka sita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya moja kwa moja zaidi: “Omri alitawala Israeli miaka kumi na miwili; huko Tirza alitawala miaka sita.” Mstari unatofautisha jumla ya muda wa utawala wake na miaka sita aliyotawala huko Tirza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁלֹשִׁים וְ/אַחַת שָׁנָה
  choice: Katika mwaka wa thelathini na moja wa utawala
  rationale: Ni namna ya kawaida ya Kiswahili ya kueleza fomula ya Kiebrania ya kuhesabu mwaka wa utawala.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: wa Asa, mfalme wa Yuda
  rationale: Herufi ל inaonyesha kwamba mwaka unahesabiwa kwa kurejelea utawala wa Asa; apposition ya 'mfalme wa Yuda' imehifadhiwa kwa lugha ya kawaida.
- source_word: מָלַךְ
  choice: alianza kutawala
  rationale: Tukio la kwanza lina maana ya kuingia katika ufalme, kwa hiyo 'alianza kutawala' linaonyesha mwanzo wa utawala kwa uwazi.
- source_word: עַל יִשְׂרָאֵל
  choice: Israeli
  rationale: Pamoja na kitenzi 'kutawala,' Kiswahili cha kawaida kinaweza kutaja taifa moja kwa moja bila 'juu ya,' huku maana ya mamlaka juu ya Israeli ikibaki wazi.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: kwa miaka kumi na miwili
  rationale: Huu ndio muda wote wa utawala wa Omri, na muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: בְּ/תִרְצָה
  choice: akiwa Tirza
  rationale: ב ni ya mahali; 'akiwa Tirza' huonyesha kwa kawaida kwamba Tirza ndiko alikokuwa akitawala.
- source_word: מָלַךְ שֵׁשׁ שָׁנִים
  choice: miaka sita kati ya hiyo alitawala akiwa Tirza
  rationale: Inatofautisha wazi miaka sita ya utawala uliokuwa na makao Tirza na jumla ya miaka kumi na miwili, bila kubadili taarifa ya Kiebrania.
