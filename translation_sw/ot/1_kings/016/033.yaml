source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אַחְאָ֖ב אֶת הָ/אֲשֵׁרָ֑ה וַ/יּ֨וֹסֶף אַחְאָ֜ב לַ/עֲשׂ֗וֹת לְ/הַכְעִיס֙ אֶת יְהֹוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִ/כֹּ֨ל מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/033.yaml
  text: Ahab also made the Asherah[a], and Ahab went on to do more to provoke Yahweh, the God of Israel, than all the kings of Israel who were before him.
translation:
  language: sw
  text: Ahabu pia akatengeneza Ashera[a]. Naye Ahabu akaendelea kufanya zaidi ili kumkasirisha Yahwe, Mungu wa Israeli, kuliko wafalme wote wa Israeli waliomtangulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguzo ya Ashera.” Neno la Kiebrania אֲשֵׁרָה linaweza kumaanisha mungu wa kike Ashera au kifaa cha ibada kilichohusishwa naye.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akatengeneza
  rationale: Kitenzi עשה kwa msingi humaanisha ‘kutengeneza/kufanya.’ ‘Akatengeneza’ kinadumisha maana ya moja kwa moja bila kukibana kuwa ‘akasimamisha.’
- source_word: הָאֲשֵׁרָה
  choice: Ashera
  rationale: Neno la Kiebrania linaweza kumaanisha mungu wa kike Ashera au kifaa cha ibada kilichohusishwa naye. Kulihamisha kama jina kunahifadhi utata huo.
- source_word: וַיּוֹסֶף ... לַעֲשׂוֹת
  choice: akaendelea kufanya mengi zaidi
  rationale: Muundo יסף pamoja na kitenzi-jina huonyesha kuendelea au kuongeza tendo; pamoja na ulinganisho unaofuata, tafsiri hii inaonyesha kwamba Ahabu aliwazidi wafalme waliotangulia.
- source_word: לְהַכְעִיס
  choice: ili kumkasirisha
  rationale: Hifili ya כעס ina maana ya kusababisha hasira au kuchokoza. ‘Kumkasirisha’ ni Kiswahili cha kawaida kinachohifadhi maana ya kisababishi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limehamishwa kwa sauti kama ‘Yahwe’ badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huu ni mfuatano wa moja kwa moja wa nomino unaomtambulisha Yahwe kuwa Mungu wa Israeli.
- source_word: מִכֹּל מַלְכֵי יִשְׂרָאֵל
  choice: kuliko wafalme wote wa Israeli
  rationale: Kiambishi מן hapa kinaonyesha ulinganisho; ‘kuliko’ kinautoa kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: waliomtangulia
  rationale: Nahau hii inawahusu wafalme waliokuwapo kabla ya Ahabu; ‘waliomtangulia’ ni wazi na ya asili katika Kiswahili.
theological_decisions:
- issue: Kirejelewa cha אֲשֵׁרָה
  choice: Kudumisha neno ‘Ashera’ bila kuamua katika matini kuu kama ni mungu wa kike au kifaa chake cha ibada.
  alternative: nguzo ya Ashera; Ashera, mungu wa kike
  rationale: Muktadha wa aya yenyewe hautoshi kuamua kwa hakika kati ya maana hizi, kwa hiyo utata halisi wa Kiebrania unahifadhiwa na kufafanuliwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ahabu’ na ‘Israeli’ ni maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili; sentensi imewekwa wazi kwa wasomaji wa kawaida huku ikihifadhi ulinganisho na utata wa neno Ashera.
