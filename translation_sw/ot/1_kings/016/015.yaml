base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/015.yaml
  text: In the twenty-seventh year of Asa king of Judah[a], Zimri became king for seven days in Tirzah, while the people were camped against Gibbethon, which belonged to the Philistines.
translation:
  language: sw
  text: Katika mwaka wa ishirini na saba wa Asa, mfalme wa Yuda, Zimri akawa mfalme kwa siku saba huko Tirsa, wakati watu walikuwa wamepiga kambi dhidi ya Gibethoni[a], mji uliokuwa wa Wafilisti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huko Gibethoni.” Katika mazingira haya ya kijeshi, “dhidi ya Gibethoni” huenda ikaeleza vizuri zaidi kwamba watu walikuwa wamepiga kambi kuupinga mji huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: Katika mwaka wa ishirini na saba
  rationale: Hii ni namna ya kawaida na ya asili ya Kiswahili ya kutaja mwaka wa utawala, huku ikihifadhi hesabu ya maandishi ya Kiebrania.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: wa Asa, mfalme wa Yuda
  rationale: Inahifadhi ulinganisho wa miaka ya wafalme na cheo cha Asa kwa Kiswahili kinachoeleweka.
- source_word: מָלַךְ
  choice: akawa mfalme
  rationale: Katika muktadha huu kitenzi kinaweza kueleza kuingia katika ufalme; uchaguzi huu unahifadhi maana hiyo kabla ya kutaja muda mfupi wa siku saba.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Kiambishi ‘kwa’ kinaonyesha muda kwa njia ya kawaida katika Kiswahili.
- source_word: בְּתִרְצָה
  choice: huko Tirsa
  rationale: ‘Huko’ ni kiashiria cha mahali kinachofaa kwa jina la mji.
- source_word: וְהָעָם
  choice: wakati watu
  rationale: Kiunganishi kimetafsiriwa kwa maana ya hali ya wakati mmoja; ‘watu’ huhifadhi neno la jumla la Kiebrania bila kulibadili moja kwa moja kuwa ‘jeshi.’
- source_word: חֹנִים
  choice: walikuwa wamepiga kambi
  rationale: Huwasilisha hali inayoendelea ya kishiriki cha Kiebrania katika mazingira ya kijeshi.
- source_word: עַל גִּבְּתוֹן
  choice: dhidi ya Gibethoni
  rationale: Katika mazingira ya kijeshi, עַל yaweza kuonyesha kuelekezwa kwa uhasama dhidi ya mji; tafsiri hii haiongezi wazo maalumu zaidi la kuuzingira.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: mji uliokuwa wa Wafilisti
  rationale: Inaeleza uhusiano wa umiliki kwa uwazi; neno ‘mji’ linaweka wazi rejeo la kiwakilishi bila kuongeza madai kuhusu namna Wafilisti walivyoutawala.
