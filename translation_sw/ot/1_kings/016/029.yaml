base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/029.yaml
  text: And Ahab son of Omri became king over Israel in the thirty-eighth year of Asa king of Judah, and Ahab son of Omri reigned over Israel in Samaria twenty-two years.
translation:
  language: sw
  text: Na Ahabu mwana wa Omri akawa mfalme wa Israeli katika mwaka wa thelathini na nane wa utawala wa Asa, mfalme wa Yuda. Ahabu mwana wa Omri akatawala Israeli katika Samaria kwa miaka ishirini na miwili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: akawa mfalme
  rationale: Katika taarifa za kifalme, kitenzi hiki hapa kinaonyesha kuingia katika ufalme; uchaguzi huu unatofautisha tukio hilo na muda wa kutawala unaotajwa baadaye.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: katika mwaka wa thelathini na nane wa utawala
  rationale: Hutoa maana ya mwaka wa mpangilio katika utawala wa Asa kwa Kiswahili cha kawaida, huku neno 'wa utawala' likiweka wazi kipimo cha wakati kilichodokezwa na fomula ya Kiebrania.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: wa Asa mfalme wa Yuda
  rationale: Inahifadhi rejeleo la wakati kwa utawala wa Asa na mtindo mfupi wa taarifa za kifalme.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Kitenzi hiki kinaanzisha taarifa ya muda wa utawala, kwa hiyo 'akatawala' huonyesha utawala unaoendelea badala ya kuingia madarakani.
- source_word: בְּשֹׁמְרוֹן
  choice: akiwa Samaria
  rationale: Huwasilisha Samaria kama mahali pa makao ya kifalme ambako Ahabu alitawala, kwa lugha ya asili ya Kiswahili.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: kwa miaka ishirini na miwili
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha muda wa utawala kwa uwazi.
- source_word: וְ
  choice: Ahabu
  rationale: Muunganisho wa simulizi umeachwa udokezwe na mfululizo wa habari; kuanza kwa jina ni mtindo wa kawaida wa Kiswahili kuliko kulazimisha 'Na' mwanzoni.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Ahabu, Omri, Israeli, Asa, Yuda na Samaria. Sentensi mbili zimetumiwa ili kutenganisha wazi kuingia katika ufalme na muda wa utawala.'
