base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/005.yaml
  text: The rest of the acts of Baasha[a], and what he did, and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: sw
  text: Habari nyingine za Baasha, na mambo aliyofanya, na nguvu zake—je, hayajaandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kitabu cha Kumbukumbu za Wafalme wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Matendo mengine
  rationale: Katika muhtasari huu wa kifalme, דִּבְרֵי humaanisha mambo au matendo yaliyorekodiwa, si maneno yaliyosemwa tu; “matendo mengine” ni ya kawaida na yanaonyesha yaliyobaki bila kuongeza neno “yote.”
- source_word: בַעְשָׁא
  choice: Baasha
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: mambo aliyofanya
  rationale: Huhifadhi kishazi cha uhusiano cha Kiebrania bila kuongeza maana ya “yote.”
- source_word: וּגְבוּרָתוֹ
  choice: na ushujaa wake
  rationale: גְּבוּרָה inaweza kumaanisha nguvu, uwezo, ushujaa, au matendo makuu. “Ushujaa wake” huhifadhi nomino ya hali na inafaa katika habari za mfalme bila kuibadili moja kwa moja kuwa “matendo makuu.”
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayajaandikwa
  rationale: Huhifadhi swali la balagha lililo katika fomula ya kitabu cha Wafalme; upatanisho wa ngeli unarejelea matendo na mambo yaliyotajwa.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kimsingi ni “juu ya,” katika nahau ya kuandika kumbukumbu humaanisha kwamba habari imo katika hati au kitabu.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Kitabu cha Mambo ya Nyakati
  rationale: Ni tafsiri wazi ya jina la kumbukumbu rasmi; “Kitabu cha Kumbukumbu za Kifalme” pia kinawezekana.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: za Wafalme wa Israeli
  rationale: 'Kiambishi לְ hapa kinaonyesha uhusiano: kumbukumbu zinazowahusu wafalme wa Israeli.'
