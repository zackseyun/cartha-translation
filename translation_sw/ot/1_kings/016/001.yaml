  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶל יֵה֣וּא בֶן חֲנָ֔נִי עַל בַּעְשָׁ֖א לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/001.yaml
  text: Then the word of Yahweh came to Jehu son of Hanani against Baasha[a], saying,
translation:
  language: sw
  text: Kisha neno la Yahwe likamjia Yehu mwana wa Hanani dhidi ya Baasha[a], likisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuhusu Baasha.” Kihusishi cha Kiebrania kinaweza kuwa na maana pana zaidi, lakini hapa kinaanzisha tamko la hukumu; kwa hiyo “dhidi ya” limependelewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Kisha ... likamjia
  rationale: Muundo huu unaanzisha hatua mpya katika simulizi. “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, huku “likamjia” likiunda kwa ufasaha kauli ya kwamba neno la Mungu lilimfikia nabii.
- source_word: דְבַר יְהוָה
  choice: neno la Yahwe
  rationale: “Neno” linahifadhi istilahi ya kawaida ya kinabii na uzito wa ufunuo wa Mungu, badala ya tafsiri fafanuzi zaidi kama “ujumbe.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.” Tahajia “Yahwe” inafaa mfumo wa sauti na maandishi wa Kiswahili.
- source_word: אֶל
  choice: -mjia
  rationale: Katika kauli hii ya ufunuo, kihusishi kinaonyesha mpokeaji wa neno; Kiswahili cha asili huwasilisha maana hiyo ndani ya kitenzi “likamjia.”
- source_word: יֵהוּא בֶן חֲנָנִי
  choice: Yehu mwana wa Hanani
  rationale: Majina yametoholewa kwa matumizi ya kawaida ya Kiswahili, na “mwana wa” linawasilisha moja kwa moja uhusiano wa kifamilia.
- source_word: עַל
  choice: dhidi ya
  rationale: Kwa kuwa kifungu kinaanzisha tamko la hukumu, “dhidi ya” linaonyesha mwelekeo wa upinzani wa tamko hilo; hata hivyo, maana pana ya “kuhusu” imehifadhiwa katika tanbihi.
- source_word: בַּעְשָׁא
  choice: Baasha
  rationale: Huu ni utohozi wa jina la mtu unaolitofautisha wazi na maneno ya kawaida ya Kiswahili.
- source_word: לֵאמֹר
  choice: likisema,
  rationale: Neno hili linaanzisha maneno ya Mungu yanayofuata. “Likisema” linarejelea “neno” kwa upatanisho wa kisarufi na kudumisha muendelezo wa sentensi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu. Kulitaja kama “Yahwe” huhifadhi tofauti kati ya jina hilo na cheo, bila kuingiza mbadala wa kimapokeo.
- issue: Nguvu ya kihusishi עַל katika kauli ya kinabii
  choice: dhidi ya Baasha
  alternative: kuhusu Baasha
  rationale: Muktadha unaofuata ni wa hukumu, kwa hiyo “dhidi ya” linafaa zaidi; lakini kwa kuwa kihusishi chenyewe kinaweza kuwa kipana zaidi, uwezekano wa “kuhusu” umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kinabii “neno la Yahwe likamjia” umehifadhiwa kwa lugha ya sasa; majina yametoholewa kwa umbo la Kiswahili, na alama ya tanbihi [a] imewekwa katika matini.
