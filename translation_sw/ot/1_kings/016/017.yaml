lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: wakapanda
  rationale: Kitenzi עלה kimsingi humaanisha kupanda au kwenda juu. “Wakapanda” kinadumisha namna ya Kiebrania ya kueleza mwendo bila kuongeza wazo mahsusi la kuandamana kijeshi.
- source_word: עָמְרִי
  choice: Omri
  rationale: Tahajia ya kawaida ya Kiswahili ya jina hili la mtu.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: na Israeli wote waliokuwa pamoja naye
  rationale: Kinahifadhi jina la kijumla “Israeli” na kufanya maana ya עִמּוֹ iwe wazi na ya asili katika Kiswahili.
- source_word: מִגִּבְּתוֹן
  choice: kutoka Gibethoni
  rationale: Kihusishi מן kimetafsiriwa moja kwa moja kuwa “kutoka,” na jina la mahali limeandikwa kwa namna inayofaa matamshi ya Kiswahili.
- source_word: וַיָּצֻרוּ
  choice: wakauzingira
  rationale: Katika muktadha wa kijeshi, צור humaanisha kuzingira mji ili kuushambulia au kuulazimisha ujisalimishe. “Wakauzingira” ni usemi wa kawaida na sahihi wa Kiswahili.
- source_word: עַל
  choice: -u-
  rationale: Lengo la tendo la kuzingira limeonyeshwa kiasili kwa kiambishi cha yambwa katika “wakauzingira,” badala ya kutafsiri kihusishi עַל kivyake.
- source_word: תִּרְצָה
  choice: Tirsa
  rationale: Tahajia ya jina la mahali inayolingana na mfumo wa sauti na tahajia wa Kiswahili.
