  variant: Standard East African Swahili
source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר הֲרִימֹתִ֨י/ךָ֙ מִן הֶ֣/עָפָ֔ר וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֣/י יִשְׂרָאֵ֑ל וַ/תֵּ֣לֶךְ בְּ/דֶ֣רֶךְ יָרָבְעָ֗ם וַֽ/תַּחֲטִא֙ אֶת עַמִּ֣/י יִשְׂרָאֵ֔ל לְ/הַכְעִיסֵ֖/נִי בְּ/חַטֹּאתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/002.yaml
  text: Because I raised you up from the dust and made you ruler over my people Israel[a], and you walked in the way of Jeroboam and caused my people Israel to sin, provoking me to anger by their sins,
translation:
  language: sw
  text: Kwa kuwa nilikuinua kutoka mavumbini na kukufanya mtawala juu ya watu wangu Israeli, nawe ukaenenda katika njia ya Yeroboamu na ukawafanya watu wangu Israeli watende dhambi ili kunikasirisha kwa dhambi zao,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Kwa kuwa
  rationale: Inaonyesha sababu ya hukumu inayofuata na ni usemi wa kawaida, wenye heshima, katika Kiswahili.
- source_word: הֲרִימֹתִיךָ
  choice: nilikuinua
  rationale: Inahifadhi picha ya kuinuliwa na pia maana ya kupandishwa kutoka hali ya chini hadi mamlakani.
- source_word: מִן הֶעָפָר
  choice: kutoka mavumbini
  rationale: ‘Mavumbi’ huhifadhi picha ya asili ya unyonge na hali ya chini.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: na kukufanya mtawala
  rationale: ‘Mtawala’ hueleza wazi cheo cha uongozi wa kifalme bila kutumia neno la kizamani.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: juu ya watu wangu Israeli
  rationale: Inahifadhi mkazo wa umiliki katika ‘watu wangu’ na uhusiano wa mamlaka unaoonyeshwa na עַל.
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: lakini ukaenenda katika njia ya Yeroboamu
  rationale: ‘Ukaenenda katika njia’ huhifadhi sitiari ya Kiebrania kuhusu mwenendo; ‘lakini’ huonyesha utofauti wa kimuktadha kati ya kuinuliwa na Mungu na mwitikio wa Baasha.
- source_word: וַתַּחֲטִא אֶת עַמִּי יִשְׂרָאֵל
  choice: na kuwasababisha watu wangu Israeli kutenda dhambi
  rationale: Muundo wa Hifili ni sababishi; tafsiri hii inaonyesha wazi kuwa mfalme aliwaingiza watu katika kutenda dhambi.
- source_word: לְהַכְעִיסֵנִי
  choice: wakinikasirisha
  rationale: Inatoa kwa Kiswahili cha kawaida matokeo ya dhambi za watu—kumchokoza Mungu hata akasirike—na inaendana na kiima cha karibu cha wingi.
- source_word: בְּחַטֹּאתָם
  choice: kwa dhambi zao
  rationale: Inahifadhi wingi na kiambishi cha nafsi ya tatu wingi, huku ‘kwa’ ikionyesha njia au sababu ya kumkasirisha Mungu.
theological_decisions:
- issue: Kiashirio cha kiambishi cha wingi katika בְּחַטֹּאתָם (‘dhambi zao’)
  choice: Kinawahusu watu wa Israeli waliotenda dhambi kutokana na uongozi wa Baasha.
  alternative: Kinaweza kueleweka kwa upana kuwa mazoea ya dhambi yaliyoambatana na njia ya Yeroboamu, pamoja na ushiriki wa Baasha mwenyewe.
  rationale: Kisintaksia, kiashirio cha karibu ni ‘watu wangu Israeli’; hivyo tafsiri inadumisha wajibu wa Baasha kwa kuwaongoza na pia wajibu wa watu kwa dhambi walizotenda.
- issue: Nguvu ya kiunganishi וַ kabla ya ‘ukaenenda’
  choice: lakini
  alternative: na
  rationale: Ingawa וַ kwa kawaida ni kiunganishi cha mfululizo, hapa muktadha unaonyesha utofauti kati ya neema ya Mungu ya kumwinua Baasha na mwenendo wake. ‘Lakini’ huwasilisha utofauti huo bila kubadili hoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sitiari ‘kuenenda katika njia’ imehifadhiwa kwa sababu inaeleweka katika mtindo wa kibiblia. Hakuna tanbihi iliyoongezwa kwa kuwa maana sababishi imeelezwa moja kwa moja katika matini.
