base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/016.yaml
  text: And the people who were camped there heard it said, “Zimri has conspired and has also struck down the king.” So all Israel made Omri, the commander of the army over Israel, king that day in the camp.
translation:
  language: sw
  text: Watu waliokuwa wamepiga kambi waliposikia ikisemwa, “Zimri amefanya njama na pia amemuua mfalme,” Israeli wote wakamtawaza Omri, jemadari wa jeshi la Israeli, kuwa mfalme siku hiyo kambini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַחֹנִים
  choice: Watu waliokuwa wamepiga kambi
  rationale: Huwasilisha kwa Kiswahili cha kawaida kishazi kinachowatambulisha watu kama waliokuwa kambini.
- source_word: קָשַׁר
  choice: amefanya njama
  rationale: Kitenzi hiki katika muktadha wa kisiasa humaanisha kupanga njama dhidi ya mtawala; tafsiri hii haiingizi maelezo yasiyosemwa wazi.
- source_word: הִכָּה אֶת־הַמֶּלֶךְ
  choice: amemuua mfalme
  rationale: Ingawa maana ya msingi ni ‘alimpiga,’ katika muktadha huu tendo hilo lilisababisha kifo cha mfalme; Kiswahili ‘amemuua’ huwasilisha maana iliyokusudiwa kwa uwazi.
- source_word: וַיַּמְלִכוּ
  choice: wakamtawaza ... kuwa mfalme
  rationale: 'Huwasilisha kisababishi cha kitenzi cha Kiebrania: walimweka au kumfanya Omri kuwa mfalme.'
- source_word: שַׂר צָבָא עַל־יִשְׂרָאֵל
  choice: jemadari wa jeshi la Israeli
  rationale: Ni usemi wa kawaida na wenye heshima kwa afisa mkuu wa jeshi aliyekuwa juu ya jeshi la Israeli.
- source_word: בַּמַּחֲנֶה
  choice: kambini
  rationale: Tafsiri fupi na ya kawaida ya mahali walipokuwa wamepiga kambi.
