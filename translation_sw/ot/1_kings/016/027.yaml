base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/027.yaml
  text: The rest of the acts of Omri[a], what he did[b], and his might that he showed—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: sw
  text: Matendo mengine ya Omri, aliyoyafanya, na uwezo wake aliouonyesha[a]—je, hayajaandikwa katika Kitabu cha Mambo ya Nyakati ya Wafalme wa Israeli?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na matendo yake ya nguvu.” Neno la Kiebrania linaweza kumaanisha uwezo au nguvu yenyewe, au matendo yanayoonyesha uwezo huo.
    reason: lexical_alternative
  - marker: b
    text: “Kitabu cha Mambo ya Nyakati ya Wafalme wa Israeli” kinarejelea kumbukumbu za kifalme, si kitabu cha Biblia kinachoitwa Mambo ya Nyakati.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי עָמְרִי
  choice: Matendo mengine ya Omri
  rationale: Katika muhtasari wa utawala wa mfalme, דִּבְרֵי humaanisha matendo au mambo ya utawala, si maneno tu; וְיֶתֶר huonyesha yaliyobaki katika kumbukumbu.
- source_word: אֲשֶׁר עָשָׂה
  choice: aliyoyafanya
  rationale: Huhifadhi kishazi cha uhusiano kinachofupisha mambo ambayo Omri alifanya.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: na uwezo wake aliouonyesha
  rationale: גְּבוּרָה inaweza kumaanisha nguvu au uwezo, au matendo yanayodhihirisha nguvu hiyo. Tafsiri hii huhifadhi nomino ya sifa huku ikitoa kishazi kinachofuata kwa Kiswahili cha kawaida.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayajaandikwa
  rationale: Huhifadhi swali la balagha linalotarajia jibu la kukubali, pamoja na hali ya kuwa mambo hayo yameandikwa.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: katika Kitabu cha Mambo ya Nyakati
  rationale: Katika fomula hii ya kumbukumbu za kifalme, עַל סֵפֶר hutafsiriwa kiasili kuwa 'katika Kitabu,' na דִּבְרֵי הַיָּמִים humaanisha kumbukumbu au mambo ya nyakati.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: za Wafalme wa Israeli
  rationale: לְ hapa huonyesha uhusiano wa kumbukumbu hizo na wafalme wa Israeli.
