base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/008.yaml
  text: In the twenty-sixth year of Asa king of Judah, Elah son of Baasha became king over Israel in Tirzah for two years.
translation:
  language: sw
  text: Katika mwaka wa ishirini na sita wa utawala wa Asa, mfalme wa Yuda, Ela mwana wa Baasha akawa mfalme wa Israeli huko Tirsa kwa miaka miwili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֵׁשׁ שָׁנָה
  choice: Katika mwaka wa ishirini na sita wa utawala
  rationale: Ni fomula ya kuhesabu mwaka wa utawala. Neno “utawala” linawekwa wazi kwa Kiswahili cha kawaida bila kurudia kwa namna isiyo ya asili muundo halisi wa Kiebrania.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: wa Asa, mfalme wa Yuda
  rationale: Herufi ל katika fomula hii inaonyesha kwamba mwaka huo unahesabiwa kwa kurejelea utawala wa Asa; apposition “mfalme wa Yuda” huhifadhi cheo chake kwa lugha ya kawaida.
- source_word: מָלַךְ
  choice: akawa mfalme
  rationale: Katika taarifa ya kupanda kwa mfalme, kitenzi kina maana ya kuingia katika ufalme. “Akawa mfalme” huhifadhi maana hiyo kuliko “alitawala,” ambayo inaweza kueleweka kama muhtasari wa kipindi chote.
- source_word: אֵלָה
  choice: Ela
  rationale: Jina limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: בֶן בַּעְשָׁא
  choice: mwana wa Baasha
  rationale: Huu ni uhusiano wa kawaida wa ukoo; “mwana wa” ni tafsiri ya moja kwa moja na ya asili.
- source_word: עַל יִשְׂרָאֵל
  choice: wa Israeli
  rationale: Pamoja na “akawa mfalme,” Kiswahili cha kawaida hutumia “mfalme wa Israeli” kueleza kutawala juu ya Israeli bila kuongeza neno “ufalme,” ambalo halipo wazi katika chanzo.
- source_word: בְּתִרְצָה
  choice: huko Tirsa
  rationale: Kiambishi ב kinaonyesha mahali. “Huko Tirsa” ni ya asili kwa mji unaotajwa kama mahali pa utawala.
- source_word: שְׁנָתָיִם
  choice: kwa miaka miwili
  rationale: Umbo la uwili linamaanisha miaka miwili; “kwa” huonyesha muda wa utawala kwa uwazi.
