base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/019.yaml
  text: because of his sins that he committed[a], doing what was evil in the eyes of Yahweh, walking in the way of Jeroboam and in the sin that he caused Israel to commit.
translation:
  language: sw
  text: kwa sababu ya dhambi zake alizotenda[a], kwa kufanya yaliyo maovu machoni pa Yahweh, kwa kuenenda katika njia ya Yeroboamu na katika dhambi yake aliyofanya kwa kuwafanya Waisraeli watende dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa uhalisia: “dhambi yake aliyotenda.” Muundo huo unarudia mzizi wa neno “dhambi/kutenda dhambi”; maandishi makuu yanatumia wingi kwa maana ya jumla.'
    reason: Muundo wa asili ni wa umoja na hutumia nomino pamoja na kitenzi cha mzizi mmoja; maandishi makuu yanatoa maana yake ya kijumla kwa Kiswahili cha kawaida.
lexical_decisions:
- source_word: עַל
  choice: kwa sababu ya
  rationale: Kihusishi hiki kinaonyesha sababu ya hukumu iliyotajwa katika muktadha uliotangulia; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: חטאתו אֲשֶׁר חָטָא
  choice: dhambi zake alizotenda
  rationale: Kiebrania kina muundo wa mzizi mmoja, kwa uhalisia ‘dhambi yake aliyotenda.’ Wingi wa Kiswahili unaonyesha maana ya kijumla ya matendo yake ya dhambi bila kubadili hoja ya kifungu.
- source_word: לַעֲשׂוֹת הָרַע
  choice: kwa kufanya yaliyo maovu
  rationale: Kirai hiki kinafafanua yaliyokuwa ndani ya dhambi yake. ‘Yaliyo maovu’ ni Kiswahili cha kawaida na chenye heshima.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Tafsiri hii huhifadhi sitiari ya Kiebrania ya tathmini ya Mungu na inaeleweka kwa urahisi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: לָלֶכֶת בְּדֶרֶךְ יָרָבְעָם
  choice: kwa kuenenda katika njia ya Yeroboamu
  rationale: Huhifadhi sitiari ya Kiebrania ya mwenendo au namna ya maisha, huku ikitumia lugha yenye hadhi ya kibiblia inayoeleweka leo.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר עָשָׂה לְהַחֲטִיא אֶת יִשְׂרָאֵל
  choice: na kwa kutenda dhambi iliyosababisha Israeli itende dhambi
  rationale: 'Muundo huu unaunganisha kitendo chake na kausativi ya Hiphil: dhambi yake ilisababisha Israeli kutenda dhambi. Pia huepuka kirai tegemezi kinachoning’inia.'
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Wajibu wa mfalme katika dhambi ya Israeli
  choice: dhambi iliyosababisha Israeli itende dhambi
  alternative: dhambi aliyotenda, na hivyo Israeli ikatenda dhambi
  rationale: Kitenzi לְהַחֲטִיא ni cha kisababishi. Tafsiri iliyochaguliwa hudumisha dai kwamba tendo lake liliifanya Israeli itende dhambi bila kueleza kwa ziada namna alivyowashawishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘kwa kufanya … kwa kuenenda … na kwa kutenda’ unaendeleza maelezo ya sababu kutoka muktadha uliotangulia. Jina Yeroboamu linafuata umbo lililozoeleka katika Biblia za Kiswahili.
