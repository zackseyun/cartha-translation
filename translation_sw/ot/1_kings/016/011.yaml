base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/011.yaml
  text: And it happened that when he became king[a], as soon as he sat on his throne, he struck down all the house of Baasha. He did not leave him a single male[b], or any of his kinsmen or his friends.
translation:
  language: sw
  text: Ikawa, alipoanza kutawala, mara tu alipoketi kwenye kiti chake cha ufalme, akaiangamiza nyumba yote ya Baasha. Hakumwachia hata mwanamume mmoja[a], wala yeyote wa jamaa zake[b] au rafiki zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “anayekojoa ukutani,” nahau kali inayomaanisha “mwanamume.”
    reason: lexical_alternative
  - marker: b
    text: Au “wakombozi wake” au “walipiza-kisasi wake”; neno la Kiebrania humaanisha ndugu wa ukoo mwenye wajibu wa kifamilia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni alama ya kawaida ya masimulizi inayoendeleza mfululizo wa matukio; “Ikawa” inadumisha mtindo huo bila kutumia lugha nzito.
- source_word: בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Katika muktadha huu kifungu kinaelekeza kwenye mwanzo wa ufalme wake, si kipindi fulani tu ndani ya utawala wake.
- source_word: כְשִׁבְתּוֹ עַל־כִּסְאוֹ
  choice: mara tu alipoketi kwenye kiti chake cha ufalme
  rationale: “Mara tu” huonyesha ufuatano wa karibu wa matukio, na “kiti cha ufalme” ni Kiswahili cha kawaida kwa kiti cha mfalme kama ishara ya mamlaka.
- source_word: הִכָּה
  choice: akaiangamiza
  rationale: Kitenzi kinamaanisha kupiga, kuua, au kuangamiza kulingana na muktadha. Hapa kinahusu kuwaua watu wa nyumba ya Baasha, hivyo “akaiangamiza” huwasilisha ukamilifu wa tendo hilo.
- source_word: אֶת כָּל בֵּית בַּעְשָׁא
  choice: nyumba yote ya Baasha
  rationale: “Nyumba” hapa ni ukoo au nasaba ya kifalme, si jengo. Kudumisha “nyumba” kunahifadhi istilahi ya nasaba inayotumiwa mara kwa mara katika Wafalme.
- source_word: לֹא הִשְׁאִיר לוֹ
  choice: Hakumwachia
  rationale: Kauli hii inamaanisha kwamba hakumwachia Baasha mtu yeyote akiwa hai; umbo lenye kiambishi cha mtendewa linaakisi kiwakilishi cha Kiebrania kwa njia ya kawaida ya Kiswahili.
- source_word: מַשְׁתִּין בְּקִיר
  choice: hata mwanamume mmoja
  rationale: Ni nahau kali ya Kiebrania inayomaanisha mwanamume. Maana yake imetolewa wazi katika matini, huku usemi halisi ukihifadhiwa katika tanbihi.
- source_word: וְגֹאֲלָיו
  choice: jamaa zake
  rationale: Neno גאל linaweza kumaanisha ndugu wa ukoo mwenye wajibu wa kifamilia, kama kukomboa au kulipiza kisasi. “Jamaa zake” huhifadhi maana pana ya kifamilia bila kuchagua wajibu mmoja pekee.
- source_word: וְרֵעֵהוּ
  choice: rafiki zake
  rationale: רֵעַ humaanisha rafiki, mwenzi, au mshirika. “Rafiki zake” ni tafsiri ya moja kwa moja na ya kawaida, ingawa inaweza kuwajumuisha washirika wa kisiasa.
theological_decisions:
- issue: Maana ya גֹאֲלָיו katika kuangamizwa kwa nyumba ya Baasha
  choice: jamaa zake
  alternative: wakombozi wake au walipiza-kisasi wake
  rationale: Muktadha hautaji wazi ni wajibu gani wa kindugu unaokusudiwa. Tafsiri pana inahifadhi utata huo badala ya kuamua kwamba walikuwa hasa wakombozi au walipiza-kisasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimasimulizi lakini kinachoeleweka kwa msomaji wa kawaida. “Ikawa” na “nyumba ya Baasha” zinadumisha ladha ya masimulizi ya kifalme; nahau chafu ya Kiebrania imeelezwa katika tanbihi badala ya kuwekwa moja kwa moja katika matini.
