base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/020.yaml
  text: The rest of the acts of Zimri[a], and his conspiracy that he carried out—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: sw
  text: Matendo mengine ya Zimri na njama yake aliyopanga[a]—je, hayajaandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “njama yake aliyofanya.” Kiebrania hutumia nomino na kitenzi kutoka mzizi mmoja ili kutia mkazo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי זִמְרִי
  choice: Matendo mengine ya Zimri
  rationale: Katika muundo huu wa taarifa za kifalme, דִּבְרֵי humaanisha mambo au matendo ya mfalme, si maneno yake tu; יֶתֶר hurejelea yaliyosalia.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: na njama yake aliyopanga
  rationale: קֶשֶׁר ni njama ya kisiasa, na kiambishi cha nafsi ya tatu kimehifadhiwa kwa ‘yake.’ ‘Aliyopanga’ ni Kiswahili cha kawaida kinachowasilisha kitenzi cha mzizi huohuo bila kauli ngumu isiyo ya asili.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayajaandikwa
  rationale: Imehifadhiwa kama swali la balagha linalotarajia jibu la kukubali, kama ilivyo katika Kiebrania.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: katika Kitabu cha Mambo ya Nyakati
  rationale: ‘Katika’ ni matumizi ya kawaida ya Kiswahili kwa jambo lililoandikwa ndani ya kumbukumbu; דִּבְרֵי הַיָּמִים ni jina la kumbukumbu za matukio ya kifalme.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: za Wafalme wa Israeli
  rationale: לְ hapa ina kazi ya kuonyesha uhusiano katika jina la kumbukumbu, si mpokeaji wa kitabu.
