lexical_decisions:
- source_word: וַיָּקֶם
  choice: Akaisimamisha
  rationale: Kitenzi קום katika Hiphil hapa kina maana ya kusababisha kitu kisimame au kukiweka; “akaisimamisha” ni Kiswahili cha kawaida kinachofaa kwa madhabahu na kinabaki karibu na tendo la Kiebrania.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa מזבח, mahali pa kutolea dhabihu.
- source_word: לַבָּעַל
  choice: kwa ajili ya Baali
  rationale: Kiambishi ל kinaonyesha kuwekwa wakfu au kuelekezwa kwa Baali; “kwa ajili ya Baali” linaeleza uhusiano huo kwa Kiswahili cha kawaida bila kulazimisha maana ya utoaji wa moja kwa moja.
- source_word: בֵּית הַבַּעַל
  choice: nyumba ya Baali
  rationale: Hii inafuata kwa uwazi maana halisi ya Kiebrania, “nyumba ya Baali,” huku tanbihi ikieleza kuwa hapa ni hekalu.
- source_word: אֲשֶׁר בָּנָה
  choice: aliyokuwa ameijenga
  rationale: Kifungu hiki kinarejelea nyumba ya Baali; muundo huu wa Kiswahili unaonyesha kwa kawaida kuwa ujenzi wake ulitangulia kusimamishwa kwa madhabahu.
- source_word: בְּשֹׁמְרוֹן
  choice: huko Samaria
  rationale: Ni tafsiri ya kawaida ya jina שֹׁמְרוֹן pamoja na kiambishi cha mahali ב; “huko” linafaa kwa eneo lililotajwa.
theological_decisions:
- issue: Tafsiri ya בֵּית הַבַּעַל
  choice: nyumba ya Baali
  alternative: hekalu la Baali
  rationale: “Nyumba ya Baali” huhifadhi kwa uwazi tamko halisi la Kiebrania na uhusiano wake na matumizi mapana ya neno “nyumba,” huku “hekalu la Baali” likiwa ufafanuzi sahihi wa maana katika muktadha. Tanbihi inahifadhi chaguo hilo la kileksika bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili na unaeleweka kwa wasomaji wa kawaida, huku ukihifadhi kwa makusudi usemi wa Kiebrania “nyumba ya Baali” na kuufafanua katika tanbihi.
