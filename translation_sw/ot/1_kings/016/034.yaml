  verdict: revise
  source_fidelity: 'Maana kuu imehifadhiwa vizuri: Hieli wa Betheli anamjenga Yeriko, kwa gharama ya Abiramu na Segubu, kama kutimia kwa neno la Yahwe kupitia Yoshua. Hata hivyo, ‘Hilo lilitokea’ huongeza kiarifu kisichopo na hufanya kifungu cha mwisho kionekane kurejelea tukio lote badala ya ujenzi wa Hieli; ni bora kukiunganisha moja kwa moja na tendo la ujenzi. ‘Mwanawe mdogo zaidi’ pia hubadilisha sambamba ya Kiebrania, ambayo humtaja Segubu kama ‘mdogo wake’ (yaani mtoto wake wa mwisho) bila kurudia nomino ‘mwana’ kwa umbo la umilikaji tofauti.'
  naturalness: Kiswahili ni cha kawaida kwa ujumla. ‘Katika siku zake’ ni sahihi, ingawa ‘Wakati wa utawala wake’ ingekuwa fasaha zaidi kimuktadha; usemi wa sasa unaweza kubaki kwa ajili ya ukaribu na chanzo. Muundo ‘Kwa gharama ya ... aliweka ...; na kwa gharama ya ... alisimamisha ...’ unasomeka vizuri. Kuondoa ‘Hilo lilitokea’ kunafanya sentensi ya mwisho iwe ya moja kwa moja na ya asili zaidi.
  terminology: Majina Hieli, Betheli, Yeriko, Abiramu, Segubu, Yoshua, na Nuni yanafuata maumbo ya Biblia ya Kiswahili. ‘Yahwe’ inaendana na audit trail ya Kiingereza. ‘Malango’ ni tafsiri ya asili katika muktadha wa mji. ‘Mzaliwa wake wa kwanza’ na ‘mdogo wake’ hudumisha tofauti ya maneno ya Kiebrania בְּכֹרוֹ na צְעִירוֹ.
  issues:
