  to: Katika siku zake, Hieli wa Betheli aliujenga upya Yeriko.[a] Kwa gharama ya Abiramu, mzaliwa wake wa kwanza, aliweka msingi wake; na kwa gharama ya Segubu, mdogo wake, alisimamisha malango yake,[b] sawasawa na neno la Yahwe alilolisema kupitia Yoshua mwana wa Nuni.
