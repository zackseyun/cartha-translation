base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/034.yaml
  text: In his days Hiel of Bethel rebuilt Jericho[a]. At the cost of Abiram his firstborn he laid its foundation, and at the cost of Segub his youngest he set up its gates[b], according to the word of Yahweh that he had spoken through Joshua son of Nun.
translation:
  language: sw
  text: Katika siku zake, Hieli wa Betheli aliujenga upya Yeriko.[a] Kwa gharama ya Abiramu, mzaliwa wake wa kwanza, aliweka msingi wake; na kwa gharama ya Segubu, mdogo wake, alisimamisha malango yake,[b] sawasawa na neno la Yahwe alilolisema kupitia Yoshua mwana wa Nuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno zaidi, “aliujenga Yeriko.” “Aliujenga upya” huzingatia kwamba Yeriko lilikuwa limeharibiwa hapo awali.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “kwa/na Abiramu, mzaliwa wake wa kwanza ... na kwa/na Segubu, mdogo wake.” Maana inaonekana kuwa ujenzi huo uligharimu maisha ya wana hao, kwa kutimiza Yoshua 6:26.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Katika siku zake
  rationale: Nahau ya wakati inayorejelea kipindi cha mtawala aliyetajwa kabla; inahifadhi muundo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: בָּנָה
  choice: aliujenga upya
  rationale: Kitenzi chenyewe ni ‘alijenga,’ lakini muktadha unaonyesha kwamba Yeriko lilikuwa limeharibiwa hapo awali; ‘alijenga upya’ huwasilisha maana ya kimuktadha.
- source_word: חִיאֵל בֵּית הָאֱלִי
  choice: Hieli wa Betheli
  rationale: Kirai hiki huonyesha asili au uhusiano wake na Betheli; ‘wa Betheli’ ni cha asili katika Kiswahili.
- source_word: בַּאֲבִירָם בְּכֹרוֹ
  choice: Kwa gharama ya Abiramu, mzaliwa wake wa kwanza
  rationale: Kihusishi ב katika muktadha wa kutimia kwa laana kinaonyesha hasara iliyohusiana na ujenzi; usemi huu unaeleza hilo bila kuongeza namna ya vifo.
- source_word: יִסְּדָהּ
  choice: aliweka msingi wake
  rationale: Kitenzi יסד katika lugha ya ujenzi wa mji humaanisha kuweka msingi.
- source_word: וּבִשְׂגוּב צְעִירוֹ
  choice: na kwa gharama ya Segubu, mwanawe mdogo zaidi
  rationale: Ni sambamba na kirai cha Abiramu; צעיר katika muktadha wa watoto wa familia humaanisha aliye mdogo zaidi.
- source_word: הִצִּיב דְּלָתֶיהָ
  choice: alisimamisha malango yake
  rationale: Katika muktadha wa mji, דלתות hurejelea malango au milango mikubwa ya mji; ‘malango’ ndiyo ya asili zaidi.
- source_word: כִּדְבַר יְהוָה
  choice: sawasawa na neno la Yahwe
  rationale: Huhifadhi fomula ya Kiebrania ya kutimia kwa neno la Mungu na kulitaja jina la agano יהוה kwa ‘Yahwe.’
- source_word: אֲשֶׁר דִּבֶּר בְּיַד
  choice: alilokuwa amesema kupitia
  rationale: ביד ni usemi wa wakala; ‘kupitia’ huwasilisha kwa kawaida kwamba Yoshua ndiye aliyekuwa mjumbe.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yoshua mwana wa Nuni
  rationale: Ni uwasilishaji wa kawaida wa jina na nasaba yake katika Kiswahili.
theological_decisions:
- issue: Maana ya kutimia kwa laana iliyowahusu wana wa Hieli
  choice: Ujenzi wa Yeriko ulifanyika kwa hasara ya mzaliwa wa kwanza na mwana mdogo zaidi wa Hieli, sawasawa na Yoshua 6:26.
  alternative: Vishazi hivyo vinaweza kutafsiriwa kijuujuu kuwa hatua za ujenzi zilitokea tu wakati wana hao walipokuwa hai, bila kudokeza vifo vyao.
  rationale: Mlingano wa moja kwa moja na Yoshua 6:26 unaunga mkono maana ya kupoteza wana hao. ‘Kwa gharama ya’ huwasilisha kutimia kwa laana bila kuongeza maelezo yasiyomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili; sentensi imegawanywa kwa uakifishaji ili kudumisha uwazi bila kupoteza ulinganifu wa Kiebrania.
