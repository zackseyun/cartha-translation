base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/014.yaml
  text: The rest of the acts of Elah[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: sw
  text: Matendo yaliyosalia ya Ela, na yote aliyofanya, je, hayajaandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kitabu cha kumbukumbu za matukio ya wafalme wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֵלָה
  choice: Matendo mengine ya Ela
  rationale: יֶתֶר ni yaliyobaki au mengine, na דִּבְרֵי katika fomula hii ya kifalme hurejelea matendo au mambo ya utawala wake. ‘Matendo mengine’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: na yote aliyofanya
  rationale: Huhifadhi kiunganishi na maana pana ya עָשָׂה bila kuongeza ufafanuzi usiotajwa.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: je, hayajaandikwa
  rationale: Huhifadhi swali la balagha linalotarajia jibu la kukubali. Upatanisho wa ngeli unarejelea ‘matendo’ na ‘yote.’
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kwa msingi ni ‘juu ya,’ Kiswahili hutaja habari zilizoandikwa ndani ya hati kwa ‘katika.’ Herufi kubwa inaonyesha jina la kumbukumbu mahususi.
- source_word: דִּבְרֵי הַיָּמִים
  choice: Mambo ya Nyakati
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kumbukumbu za matukio ya kihistoria; uwezekano wa maana ya ‘kumbukumbu za matukio’ umeonyeshwa katika tanbihi.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: za Wafalme wa Israeli
  rationale: Katika kichwa hiki לְ huonyesha uhusiano wa kumbukumbu hizo na wafalme wa Israeli.
