base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/031.yaml
  text: And as if it were a light thing for him to walk in the sins of Jeroboam son of Nebat[a], he took Jezebel daughter of Ethbaal, king of the Sidonians, as his wife, and went and served Baal and bowed down to him.
translation:
  language: sw
  text: Kana kwamba kuenenda katika dhambi za Yeroboamu mwana wa Nebati kulikuwa jambo dogo kwake,[a] akamchukua Yezebeli binti Ethbaali, mfalme wa Wasidoni, kuwa mke wake. Kisha akaenda, akatumikia Baali na kumsujudia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, lilikuwa jambo dogo kwake kuenenda katika dhambi za Yeroboamu mwana wa Nebati...?” Mwanzo wa Kiebrania ni wa kinahau na wa balagha, ukisisitiza kwamba Ahabu alizichukulia dhambi hizo kuwa zisizo na uzito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָקֵל
  choice: kana kwamba ... kulikuwa jambo dogo kwake
  rationale: Muundo huu unaonyesha kwa njia ya balagha kwamba Ahabu aliziona dhambi za Yeroboamu kuwa zisizo na uzito, huku ukitayarisha hatua yake mbaya zaidi. Tanbihi inahifadhi uwezekano wa kuusoma mwanzo kama swali la balagha.
- source_word: לֶכְתּוֹ בְּחַטֹּאות
  choice: kuenenda katika dhambi
  rationale: Kitenzi cha Kiebrania kinatumia sitiari ya kuenenda kueleza mwenendo wa kudumu. Kiswahili hiki ni cha heshima, kinaeleweka, na kinahifadhi picha ya matini chanzo.
- source_word: בְּחַטֹּאות יָרָבְעָם בֶּן נְבָט
  choice: katika dhambi za Yeroboamu mwana wa Nebati
  rationale: Hii inadumisha kauli ya moja kwa moja ya Kiebrania na fomula ya simulizi inayorejelea mwenendo wa ibada potovu ulioanzishwa na Yeroboamu.
- source_word: וַיִּקַּח אִשָּׁה אֶת אִיזֶבֶל
  choice: akamchukua Yezebeli ... awe mke wake
  rationale: Tafsiri hii inakaribia muundo halisi, ‘akamchukua ... kuwa mke,’ kuliko kufupisha tu kuwa ‘akamwoa,’ lakini bado ni Kiswahili cha kawaida.
- source_word: אֶתְבַּעַל
  choice: Ethbaali
  rationale: Jina limetoholewa kwa tahajia inayoweza kutamkwa kwa kawaida katika Kiswahili bila kutafsiri maana ya jina la Kifoinike.
- source_word: צִידֹנִים
  choice: Wasidoni
  rationale: Nomino ya wingi inayotaja watu wa Sidoni imetafsiriwa kwa jina la taifa la Kiswahili.
- source_word: וַיֵּלֶךְ
  choice: kisha akaenda
  rationale: Neno ‘akaenda’ linahifadhi mwendo wa simulizi; ‘kisha’ linaweka wazi mfuatano wa vitendo bila kuongeza maana mpya.
- source_word: וַיַּעֲבֹד אֶת הַבַּעַל
  choice: akamtumikia Baali
  rationale: ‘Kutumikia’ linahifadhi maana ya עבד ya kujitoa katika utumishi wa kidini na kuitofautisha na tendo la kusujudu linalofuata.
- source_word: הַבַּעַל
  choice: Baali
  rationale: Limetolewa kama jina la mungu, bila kibainishi, kufuatana na matumizi ya kawaida ya majina ya pekee katika Kiswahili.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: akamsujudia
  rationale: Kitenzi hiki kinawasilisha tendo mahususi la kuinama au kujilaza mbele ya Baali, badala ya kulichanganya na dhana pana ya kumtumikia.
theological_decisions:
- issue: Uasi wa Ahabu ukilinganishwa na dhambi za Yeroboamu
  choice: Kauli ya mwanzo inaonyesha kwamba Ahabu alizichukulia dhambi za Yeroboamu kana kwamba hazikuwa na uzito, kisha akaenda mbali zaidi kwa kumtumikia na kumsujudia Baali.
  alternative: 'Mwanzo unaweza kusomwa moja kwa moja kama swali la balagha: ‘Je, lilikuwa jambo dogo kwake kuenenda katika dhambi za Yeroboamu mwana wa Nebati...?’'
  rationale: Kiambishi cha swali na nahau ya Kiebrania huruhusu swali la balagha, huku muktadha wa simulizi ukionyesha kuongezeka kwa uasi. Tafsiri kuu na tanbihi zinahifadhi pande zote bila kufuta utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kuenenda’ limetumiwa kudumisha sitiari ya mwenendo wa maisha; majina yametoholewa kuwa Yeroboamu, Nebati, Yezebeli, Ethbaali, Wasidoni, na Baali.
