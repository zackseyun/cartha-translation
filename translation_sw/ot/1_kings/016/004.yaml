base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/004.yaml
  text: Whoever belonging to Baasha dies in the city[a], the dogs will eat; and whoever belonging to him dies in the field[b], the birds of the heavens will eat.
translation:
  language: sw
  text: Yeyote wa Baasha[a] atakayekufa mjini, mbwa watamla; na yeyote wake atakayekufa kondeni, ndege wa angani[b] watamla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yeyote aliye wa Baasha.” Kiebrania kinaonyesha uhusiano na Baasha, huenda watu wa nyumba au nasaba yake.
    reason: lexical_alternative
  - marker: b
    text: Tafsiri nyingine ya maneno hayo ni “ndege wa mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת
  choice: yeyote ... atakayekufa
  rationale: Kivumishi-tendo cha umoja kimetumiwa kwa maana ya jumla; muundo huu wa Kiswahili unaeleza kwa kawaida mtu yeyote anayehusika.
- source_word: לְבַעְשָׁא
  choice: wa Baasha
  rationale: Herufi lamed hapa huonyesha uhusiano au umilikaji. “Wa Baasha” huhifadhi upana huo bila kuamua wazi kuwa ni jamaa, watu wa nyumba, au nasaba yake.
- source_word: בָּעִיר
  choice: mjini
  rationale: Ni usemi wa kawaida wa mahali unaohifadhi tofauti kati ya mji na eneo la mashambani.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: mbwa watamla
  rationale: Kitenzi אָכַל maana yake ya msingi ni “kula”; “watamla” ni Kiswahili cha kawaida na huhifadhi ukali wa picha.
- source_word: וְהַמֵּת לוֹ
  choice: na yeyote wa watu wake atakayekufa
  rationale: Kiwakilishi kinamrejelea Baasha. “Wa watu wake” huifanya sentensi iwe ya asili kwa Kiswahili huku ikihifadhi uhusiano mpana uliopo katika Kiebrania.
- source_word: בַּשָּׂדֶה
  choice: kondeni
  rationale: שׂדה inaweza kumaanisha shamba au eneo la wazi nje ya mji; “kondeni” linafaa kwa ulinganifu wa mjini dhidi ya mashambani.
- source_word: עוֹף הַשָּׁמָיִם
  choice: ndege wa angani
  rationale: Huu ni usemi wa asili wa Kiswahili unaowakilisha nomino ya mkusanyiko עוֹף na uhusiano wake na שׁמים.
