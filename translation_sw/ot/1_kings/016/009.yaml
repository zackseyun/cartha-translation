  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֤ר עָלָי/ו֙ עַבְדּ֣/וֹ זִמְרִ֔י שַׂ֖ר מַחֲצִ֣ית הָ/רָ֑כֶב וְ/ה֤וּא בְ/תִרְצָה֙ שֹׁתֶ֣ה שִׁכּ֔וֹר בֵּ֣ית אַרְצָ֔א אֲשֶׁ֥ר עַל הַ/בַּ֖יִת בְּ/תִרְצָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/009.yaml
  text: But his servant Zimri[a], commander of half the chariots, conspired against him while he was in Tirzah, drinking himself drunk in the house of Arza[b], who was over the household in Tirzah.
translation:
  language: sw
  text: Lakini Zimri, mtumishi wake na mkuu wa nusu ya magari ya vita, akafanya njama dhidi yake. Wakati huo, mfalme alikuwa Tirza, akinywa mpaka akalewa[a] katika nyumba ya Arza, aliyekuwa msimamizi wa nyumba ya kifalme[b] huko Tirza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akinywa hadi kulewa.” Usemi wa Kiebrania unaonyesha wazi tendo la kunywa lililosababisha ulevi.
    reason: lexical_alternative
  - marker: b
    text: “Msimamizi wa nyumba ya kifalme” lilikuwa cheo cha kiutawala, yaelekea likimaanisha afisa aliyesimamia nyumba au jumba la mfalme.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: akafanya njama dhidi yake
  rationale: Kitenzi קשר pamoja na עַל katika masimulizi ya kifalme humaanisha kupanga njama ya kisiasa dhidi ya mtawala; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: Neno עבד kimsingi ni ‘mtumishi,’ ingawa katika mazingira ya kifalme linaweza kumaanisha afisa wa mfalme. Tafsiri hii inadumisha maana ya msingi bila kuondoa uwezekano wa cheo rasmi.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: שַׂר מַחֲצִית הָרָכֶב
  choice: mkuu wa nusu ya magari ya vita
  rationale: שַׂר ni mkuu au kamanda, na רכב hapa ni kikosi cha magari ya vita. Usemi huu unafuata muundo wa Kiebrania huku ukiwa wazi kwa msomaji wa Kiswahili.
- source_word: וְהוּא בְתִרְצָה
  choice: Wakati huo, mfalme alikuwa Tirza
  rationale: Kirai kinaeleza mazingira ya njama. Kutaja ‘mfalme’ kunazuia kiwakilishi cha Kiswahili kueleweka kimakosa kuwa kinamrejelea Zimri, huku hakubadili mhusika anayerejelewa katika muktadha.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: akinywa mpaka akalewa
  rationale: Muundo huu unaonyesha tendo la kunywa lililoendelea hadi likasababisha ulevi, na unadumisha uzito na uhai wa usemi wa Kiebrania.
- source_word: בֵּית אַרְצָא
  choice: katika nyumba ya Arza
  rationale: בית pamoja na jina la mtu kwa kawaida ni ‘nyumba ya’; tafsiri hii ni ya karibu na ya asili katika Kiswahili.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: aliyekuwa msimamizi wa nyumba ya kifalme
  rationale: Hiki ni cheo cha kiutawala cha mtu aliyesimamia nyumba au jumba la mfalme. ‘Msimamizi wa nyumba ya kifalme’ huwasilisha kazi hiyo bila kudai kwa uhakika kwamba neno בית hapa ni jengo pekee.
- source_word: בְּתִרְצָה
  choice: huko Tirza
  rationale: Mahali pametajwa tena kama katika Kiebrania, na ‘huko’ huepuka urudiaji usio wa kawaida huku ikidumisha msisitizo wa eneo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa urahisi. ‘Magari ya vita’ limetumiwa badala ya neno la kitaalamu lisilozoeleka, na sentensi imegawanywa mara mbili ili kuondoa utata wa mhusika anayekunywa.
