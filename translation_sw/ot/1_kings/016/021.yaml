base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/021.yaml
  text: 'Then the people of Israel were divided into two parts: half of the people followed Tibni son of Ginath[a], to make him king, and half followed Omri.'
translation:
  language: sw
  text: 'Ndipo watu wa Israeli wakagawanyika katika sehemu mbili: nusu ya watu wakamfuata Tibni mwana wa Ginathi ili wamfanye kuwa mfalme, na nusu nyingine wakamfuata Omri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵחָלֵק
  choice: wakagawanyika
  rationale: Nifali ya חלק inaonyesha kugawanyika; umbo la wingi ni la kawaida katika Kiswahili kwa sababu 'watu' ni wingi.
- source_word: הָעָם יִשְׂרָאֵל
  choice: watu wa Israeli
  rationale: Hutambulisha jamii ya taifa la Israeli kwa Kiswahili cha kawaida na wazi.
- source_word: לַחֵצִי
  choice: katika sehemu mbili
  rationale: Huonyesha kwamba watu waligawanyika katika makundi mawili, bila kulazimisha kuwa yalikuwa sawa kabisa kihesabu.
- source_word: חֲצִי הָעָם
  choice: nusu ya watu
  rationale: Huhifadhi uwiano na urudiaji wa kirai cha Kiebrania.
- source_word: הָיָה אַחֲרֵי
  choice: wakamfuata
  rationale: Katika muktadha wa kisiasa, nahau hii ina maana ya kumuunga mkono au kumfuata mdai wa ufalme.
- source_word: תִבְנִי בֶן גִּינַת
  choice: Tibni mwana wa Ginathi
  rationale: Majina yametoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: לְהַמְלִיכוֹ
  choice: ili wamfanye kuwa mfalme
  rationale: Hifili ya מלך ina maana ya kumsababisha atawale, yaani kumfanya kuwa mfalme; haisemi wazi kuhusu sherehe ya kutawazwa.
- source_word: וְהַחֲצִי אַחֲרֵי עָמְרִי
  choice: na nusu nyingine wakamfuata Omri
  rationale: Kitenzi kinachukuliwa kutoka kifungu sambamba, huku 'nyingine' kikifanya sentensi iwe wazi na ya kawaida katika Kiswahili.
