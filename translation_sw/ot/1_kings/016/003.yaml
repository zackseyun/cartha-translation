base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/003.yaml
  text: Behold[a], I am sweeping away Baasha and his house, and I will make your house like the house of Jeroboam son of Nebat.
translation:
  language: sw
  text: Tazama,[a] ninaenda kuwafutilia mbali Baasha na watu wa nyumba yake, nami nitaifanya nyumba yako iwe kama nyumba ya Yeroboamu mwana wa Nebati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na maneno ya Kiebrania, “ninawateketeza walio nyuma ya Baasha.” Nahau hiyo ina maana kwamba nitamwangamiza Baasha pamoja na ukoo wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Tazama
  rationale: Linadumisha uzito wa utangulizi wa tangazo rasmi la Mungu kwa lugha ya kinabii iliyoeleweka katika Kiswahili.
- source_word: מַבְעִיר אַחֲרֵי
  choice: ninamfutilia mbali
  rationale: Muundo huu ni nahau ya hukumu yenye maana ya kumwondoa kabisa mtu pamoja na wale wanaomfuata katika ukoo wake. Kiswahili hiki kinaonyesha uangamizi kamili bila kudai kwamba njia yake ni moto halisi.
- source_word: בַעְשָׁא
  choice: Baasha
  rationale: Hili ni umbo la kawaida la jina hilo katika matumizi ya Biblia ya Kiswahili.
- source_word: בֵיתוֹ
  choice: nyumba yake
  rationale: Neno 'nyumba' linahifadhi taswira ya Kiebrania huku likiruhusu maana pana ya jamaa, ukoo wa kifalme, au nasaba kubaki wazi kutokana na muktadha.
- source_word: וְנָתַתִּי
  choice: nami nitaifanya
  rationale: Ingawa kitenzi נתן kwa msingi humaanisha 'kutoa,' katika muundo huu kina maana ya kufanya kitu kiwe kama kingine.
- source_word: בֵיתְךָ
  choice: nyumba yako
  rationale: Linahifadhi taswira na utata halisi wa 'nyumba' huku likirejelea familia na nasaba ya kifalme ya Baasha.
- source_word: כְּבֵית
  choice: iwe kama nyumba ya
  rationale: Huwasilisha kwa Kiswahili cha kawaida ulinganisho unaoletwa na kihusishi כְּ.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Ni uwasilishaji wa kawaida wa jina na jina la baba katika Biblia ya Kiswahili.
theological_decisions:
- issue: Asili ya hukumu dhidi ya nasaba ya Baasha
  choice: Nahau imetafsiriwa kuwa kuondolewa kabisa kwa Baasha na nyumba yake bila kutaja moto halisi katika matini kuu.
  alternative: “Ninawateketeza wale walio nyuma ya Baasha” au “ninachoma baada ya Baasha.”
  rationale: Kiebrania kinatangaza hukumu kamili juu ya Baasha na ukoo wake. Tafsiri ya neno kwa neno ingekuwa isiyo wazi katika Kiswahili na ingeweza kudokeza kimakosa kwamba moto ndio njia mahususi ya hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na uzito wa tangazo la kinabii. 'Nyumba' imehifadhiwa ili kubeba maana ya familia, jamaa, na nasaba ya kifalme bila kuibana kwa ufafanuzi mmoja.
