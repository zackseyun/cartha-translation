source:
  edition: WLC
  text: וַ/יִּ֜קֶן אֶת הָ/הָ֥ר שֹׁמְר֛וֹן מֵ֥/אֶת שֶׁ֖מֶר בְּ/כִכְּרַ֣יִם כָּ֑סֶף וַ/יִּ֨בֶן֙ אֶת הָ/הָ֔ר וַ/יִּקְרָ֗א אֶת שֵׁ֤ם הָ/עִיר֙ אֲשֶׁ֣ר בָּנָ֔ה עַ֣ל שֶׁם שֶׁ֔מֶר אֲדֹנֵ֖י הָ/הָ֥ר שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/024.yaml
  text: He bought the hill of Samaria from Shemer for two talents of silver[a], built on the hill, and called the name of the city that he built Samaria, after the name of Shemer[b], the owner of the hill.
translation:
  language: sw
  text: Akanunua kilima cha Samaria kutoka kwa Shemeri kwa talanta mbili za fedha[a]. Akajenga juu ya kilima hicho, akaupa mji alioujenga jina la Samaria, kwa jina la Shemeri[b], mwenye kilima hicho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talanta ni kipimo kikubwa cha uzito; hapa kiasi cha fedha kilipimwa kwa uzito.
    reason: cultural_note
  - marker: b
    text: Kwa Kiebrania, jina Shomron (“Samaria”) linahusishwa hapa na jina Shemer (“Shemeri”).
    reason: lexical_note
lexical_decisions:
- source_word: וַיִּקֶן
  choice: Akanunua
  rationale: Kitenzi קנה hapa kinaonyesha kupata mali kwa kulipa; “akanunua” ni Kiswahili cha kawaida na sahihi katika muktadha wa bei iliyotajwa.
- source_word: הָהָר
  choice: kilima
  rationale: Neno הַר linaweza kumaanisha mlima au kilima; kwa eneo la mji huu, “kilima” linafaa kijiografia na kimatumizi.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Hili ndilo jina la mahali lililozoeleka katika Biblia za Kiswahili; hapa linataja kwanza kilima na kisha mji.
- source_word: מֵאֵת שֶׁמֶר
  choice: kutoka kwa Shemeri
  rationale: Kihusishi kinaonyesha mtu ambaye mali ilinunuliwa kwake; “kutoka kwa” huwasilisha wazi maana hiyo.
- source_word: בְּכִכְּרַיִם כָּסֶף
  choice: kwa talanta mbili za fedha
  rationale: כִּכָּר katika muktadha wa fedha ni talanta, yaani kipimo kikubwa cha uzito; umbo la uwili linaonyesha talanta mbili.
- source_word: וַיִּבֶן אֶת הָהָר
  choice: Akajenga juu ya kilima hicho
  rationale: Kiebrania kinasema kihalisi “akakijenga kilima,” lakini maana ya kawaida ni kujenga kwenye eneo hilo; tafsiri hii ni ya asili bila kutaja majengo ambayo chanzo hakuyabainisha.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: akauita mji
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuwasilisha nahau ya Kiebrania “akaliita jina la mji,” bila uzito usio wa lazima.
- source_word: עַל שֵׁם
  choice: kwa jina la
  rationale: Kirai hiki kinaonyesha kwamba mji ulipewa jina kwa kurejelea jina la Shemeri.
- source_word: אֲדֹנֵי הָהָר
  choice: mwenye kilima hicho
  rationale: אדון hapa ina maana ya umiliki wa mali, si cheo cha kifalme wala jina la Mungu; “mwenye” ni neno la asili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa msomaji wa kawaida. Majina “Samaria” na “Shemeri” yanafuata matumizi yaliyozoeleka ya Kiswahili; tanbihi inaonyesha uhusiano wa majina unaoonekana wazi zaidi katika Kiebrania.
