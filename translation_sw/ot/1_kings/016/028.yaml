  terminology: Majina 'Omri,' 'Samaria,' na 'Ahabu' yameandikwa kwa kawaida katika Kiswahili cha Biblia. 'Akazikwa' ni sahihi kwa kitenzi cha Kiebrania kilicho katika hali ya kutendwa. Kwa fomula ya kifalme, 'akalala pamoja na baba zake' na 'akatawala badala yake' hudumisha msamiati wa kawaida wa urithi wa kifalme.
