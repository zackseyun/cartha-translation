  text: And Omri slept with his fathers and was buried in Samaria[a], and Ahab his son reigned in his place.
translation:
  language: sw
  text: Omri akalala pamoja na baba zake[a], akazikwa Samaria. Kisha Ahabu mwanawe akatawala badala yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli ya Kiebrania “akalala pamoja na baba zake” ni usemi wa kawaida katika simulizi za kifalme unaomaanisha kwamba alikufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Katika simulizi za kifalme, kitenzi hiki pamoja na kirai ‘pamoja na mababu zake’ ni usemi wa kawaida unaomaanisha kufa. ‘Akalala’ huhifadhi taswira na mtindo wa kurudiwa wa Kiebrania.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na mababu zake
  rationale: Kirai hiki ni sehemu ya fomula ya kifalme kuhusu kifo na mwendelezo wa nasaba. ‘Mababu’ ni Kiswahili cha kawaida kinachowakilisha waliotangulia katika ukoo.
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Nifali ya Kiebrania ina maana ya kutendwa; Kiswahili ‘akazikwa’ huiwasilisha kwa kawaida na kwa usahihi.
- source_word: בְּשֹׁמְרוֹן
  choice: huko Samaria
  rationale: Kihusishi בְּ kinaonyesha mahali. ‘Huko Samaria’ ni usemi wa asili wa Kiswahili kwa eneo la maziko.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika fomula ya urithi wa ufalme, ‘akatawala’ ni fupi na ya kawaida, bila kuongeza wazi wazo la kuanza ambalo halilazimishwi na muundo wa Kiebrania.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Kirai hiki kinaonyesha kwamba Ahabu alimrithi Omri katika utawala; ‘mahali pake’ huhifadhi maana ya msingi ya kuchukua nafasi yake.
