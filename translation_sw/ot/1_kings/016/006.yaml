  text: Baasha slept with his fathers and was buried in Tirzah[a], and Elah his son reigned in his place.
translation:
  language: sw
  text: Baasha akalala pamoja na baba zake[a], akazikwa Tirza, na Ela mwanawe akawa mfalme badala yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na mababu zake.” Msemo wa Kiebrania “alilala pamoja na baba zake” ni kauli ya kawaida ya kifo cha mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Kitenzi cha Kiebrania maana yake ya moja kwa moja ni ‘alilala’ na hapa ni sehemu ya msemo maalumu unaotangaza kifo cha mfalme. Kukihifadhi huepusha kubadili msemo huo moja kwa moja kuwa ufafanuzi ‘alikufa’.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Hufuata kwa karibu msemo wa Kiebrania unaorudiwa katika taarifa za vifo vya wafalme. ‘Mababu zake’ ni tafsiri mbadala ya maana inayosikika kwa urahisi zaidi katika Kiswahili.
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Umbo la Kiebrania ni la kutendwa; ‘akazikwa’ ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: בְּתִרְצָה
  choice: huko Tirza
  rationale: Kwa jina la mji, ‘huko Tirza’ huwasilisha kwa kawaida maana ya mahali ya kihusishi ב katika Kiswahili.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika taarifa ya mrithi wa kifalme, ‘akatawala’ ni usemi mfupi na wa kawaida unaolingana na kitenzi cha Kiebrania.
- source_word: אֵלָה בְנוֹ
  choice: Ela mwanawe
  rationale: Mpangilio huu unafuata mfuatano wa Kiebrania na bado ni wa asili na wazi katika Kiswahili.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika muktadha wa urithi wa ufalme, usemi huu unaonyesha wazi kwamba Ela alimrithi Baasha.
