id: 1KI.16.7
reference: 1 Kings 16:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/גַ֡ם בְּ/יַד יֵה֨וּא בֶן חֲנָ֜נִי הַ/נָּבִ֗יא דְּבַר יְהוָ֡ה הָיָה֩ אֶל בַּעְשָׁ֨א וְ/אֶל בֵּית֜/וֹ וְ/עַ֥ל כָּל הָ/רָעָ֣ה אֲשֶׁר עָשָׂ֣ה בְּ/עֵינֵ֣י יְהוָ֗ה לְ/הַכְעִיס/וֹ֙ בְּ/מַעֲשֵׂ֣ה יָדָ֔י/ו לִ/הְי֖וֹת כְּ/בֵ֣ית יָרָבְעָ֑ם וְ/עַ֥ל אֲשֶׁר הִכָּ֖ה אֹתֽ/וֹ־־־־־־׀־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/007.yaml
  text: And also through Jehu son of Hanani the prophet[a], the word of Yahweh came against Baasha and against his house, both because of all the evil that he did in the sight of Yahweh, provoking him to anger by the work of his hands, by becoming like the house of Jeroboam, and because he struck him down.
translation:
  language: sw
  text: Tena, kupitia Yehu mwana wa Hanani, nabii, neno la Yahwe lilikuja dhidi ya Baasha na dhidi ya nyumba yake kwa sababu ya uovu wote alioufanya machoni pa Yahwe, akimkasirisha Yahwe kwa matendo ya mikono yake kwa kuwa kama nyumba ya Yeroboamu, na kwa sababu alimwangamiza[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliiangamiza.” Kiwakilishi cha Kiebrania ni umoja wa kiume na kinaweza kumrejelea Yeroboamu mwenyewe au, yaelekea zaidi katika muktadha huu, nyumba yake—yaani ukoo wake wa kifalme—kama kundi.
    reason: Kiswahili hulazimika kuchagua ngeli ya kiwakilishi, ilhali Kiebrania kinaacha rejeleo likiwa na utata.
lexical_decisions:
- source_word: וְגַם
  choice: Tena
  rationale: Huendeleza na kuongeza jambo kwenye muktadha wa hukumu uliotangulia kwa Kiswahili cha kawaida.
- source_word: בְּיַד
  choice: kupitia
  rationale: Nahau hii inaonyesha Yehu kuwa mpatanishi ambaye kupitia kwake ujumbe wa kinabii ulitolewa.
- source_word: דְּבַר יְהוָה
  choice: neno la Yahwe
  rationale: Huhifadhi kauli ya kawaida ya kinabii pamoja na jina la agano יְהוָה.
- source_word: אֶל ... וְאֶל
  choice: dhidi ya ... na
  rationale: Katika muktadha huu neno ni tangazo la hukumu, hivyo ‘dhidi ya’ linaonyesha nguvu ya uadui ya kihusishi bila kubadili ujumbe kuwa maelezo ya kawaida tu.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: ‘Nyumba’ huhifadhi upana wa neno la Kiebrania, linaloweza kumaanisha jamaa, watu wa nyumbani, au ukoo wa kifalme.
- source_word: עַל כָּל הָרָעָה
  choice: kwa sababu ya uovu wote
  rationale: Kihusishi hapa kinatoa msingi wa hukumu; ‘kwa sababu ya’ huwasilisha maana hiyo wazi.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi sitiari ya Kiebrania katika usemi wa Kiswahili unaoeleweka na kuonyesha tathmini ya Mungu.
- source_word: לְהַכְעִיסוֹ
  choice: alimkasirisha Yahwe
  rationale: Huwasilisha maana sababishi ya kumchokoza Mungu hata akakasirika, huku jina likirudiwa ili kuepuka utata wa kiwakilishi.
- source_word: בְּמַעֲשֵׂה יָדָיו
  choice: kwa matendo ya mikono yake
  rationale: Huhifadhi taswira halisi ya Kiebrania huku ikimaanisha matendo yake kwa upana, bila kuamua kimya kimya kuwa ni sanamu pekee.
- source_word: לִהְיוֹת כְּבֵית יָרָבְעָם
  choice: akawa kama nyumba ya Yeroboamu
  rationale: Hutoa kwa Kiswahili cha kawaida matokeo ya Baasha kufanana na nyumba ya Yeroboamu katika uovu.
- source_word: וְעַל אֲשֶׁר הִכָּה אֹתוֹ
  choice: pia, alimwangamiza[a]
  rationale: Kitenzi הִכָּה katika muktadha huu kina maana ya kumpiga hadi kumwondoa au kumwangamiza. Kiwakilishi cha Kiebrania kina utata ambao Kiswahili hulazimika kuainisha; chaguo jingine limehifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; ‘Yahwe’ huhifadhi jina la agano bila kulibadilisha kuwa cheo.
- issue: Rejeleo la kiwakilishi katika אֹתוֹ
  choice: alimwangamiza, yaani rejeleo la kiume binafsi katika matini kuu
  alternative: aliiangamiza nyumba/ukoo wa Yeroboamu kama kundi
  rationale: Kiwakilishi cha Kiebrania ni umoja wa kiume na kinaweza kueleweka kibinafsi au kwa ‘nyumba’ kama kundi. Kwa kuwa Kiswahili hutofautisha ngeli hizi wazi, tanbihi inahifadhi uwezekano mwingine badala ya kuficha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kinabii ‘neno la Yahwe’ na taswira ‘matendo ya mikono yake’ zimehifadhiwa, lakini sentensi imegawanywa ili isomeke kwa urahisi. Alama ya tanbihi imewekwa kwenye neno lenye utata.
