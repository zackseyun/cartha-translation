  text: וַ/יַּשְׁמֵ֣ד זִמְרִ֔י אֵ֖ת כָּל בֵּ֣ית בַּעְשָׁ֑א כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל בַּעְשָׁ֔א בְּ/יַ֖ד יֵה֥וּא הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/012.yaml
  text: So Zimri destroyed all the house of Baasha[b][a], according to the word of Yahweh that he had spoken against Baasha through Jehu the prophet.
translation:
  language: sw
  text: Hivyo Zimri akaangamiza nyumba yote ya Baasha[a], kulingana na neno la Yahwe alilolisema dhidi ya Baasha[b] kupitia nabii Yehu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba ya Baasha” hapa ni ukoo wake wa kifalme, yaani nasaba yake, si jengo lake wala watu wa nyumbani mwake tu.
    reason: cultural_note
  - marker: b
    text: Au “kwa Baasha.” Kihusishi cha Kiebrania ni “kwa,” lakini hapa kinaanzisha neno la hukumu lililoelekezwa dhidi yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: akaangamiza
  rationale: Hifili ya שׁמד ina maana ya kusababisha maangamizi au kuondoa kabisa. “Akaangamiza” ni Kiswahili cha kawaida, chenye hadhi, na hakibainishi kupita kiasi namna tendo hilo lilivyofanywa.
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: nyumba yote ya Baasha
  rationale: Katika muktadha wa kifalme, “nyumba” humaanisha ukoo au nasaba ya mtawala, si jengo wala watu wa nyumbani pekee. Muundo huu unahifadhi tamathali ya Kiebrania, huku tanbihi ikifafanua maana yake.
- source_word: כִּדְבַר
  choice: sawasawa na neno la
  rationale: Kirai hiki kinaonyesha kwamba tukio lilitokea kwa kulingana na kutimiza tangazo la awali. “Sawasawa na neno la” ni wazi na cha asili katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: אֲשֶׁר דִּבֶּר
  choice: alilolisema
  rationale: Muundo huu unaunganisha kwa kawaida “neno” na kitendo cha kulisema, na muktadha tayari unaonyesha kuwa tangazo hilo lilitangulia kutimizwa kwake.
- source_word: אֶל בַּעְשָׁא
  choice: dhidi ya Baasha
  rationale: Ingawa אֶל kwa kawaida humaanisha “kwa,” hapa neno la kinabii ni hukumu inayomwelekea Baasha kwa uadui. “Dhidi ya” linaonyesha nguvu hiyo ya kimuktadha; maana ya moja kwa moja imehifadhiwa katika tanbihi.
- source_word: בְּיַד יֵהוּא הַנָּבִיא
  choice: kupitia Yehu nabii
  rationale: Nahau ya Kiebrania “kwa mkono wa” huonyesha chombo au wakala. “Kupitia Yehu nabii” ni Kiswahili cha sasa kinachoonyesha kwamba ujumbe ulitolewa kwa njia yake.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni, hivyo tafsiri inahifadhi jina binafsi la Mungu badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya אֶל katika tamko la kinabii kuhusu Baasha
  choice: dhidi ya Baasha
  alternative: kwa Baasha
  rationale: Kihusishi chenyewe kinaweza kutafsiriwa “kwa,” lakini muktadha ni tangazo la hukumu. “Dhidi ya” linafikisha mwelekeo wake wa hukumu bila kuficha uwezekano wa tafsiri ya moja kwa moja, ambao umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imetumia muundo wa simulizi ulio wazi, imehifadhi nahau ya kifalme “nyumba ya Baasha,” na imeweka wazi katika tanbihi utata halisi wa kihusishi אֶל.
