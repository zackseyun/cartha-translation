base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/041.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land for the sake of your name—
translation:
  language: sw
  text: Tena kuhusu mgeni[a], ambaye si wa watu wako Israeli, na anakuja kutoka nchi ya mbali kwa ajili ya jina lako—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu wa kigeni” au “mtu wa nje.” Neno la Kiebrania linamaanisha mtu asiye Mwisraeli, si msafiri tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Tena
  rationale: Neno hili linaendeleza ombi lililotangulia na kuongeza jambo jingine; “Tena” ni la asili na lenye hadhi katika Kiswahili.
- source_word: אֶל
  choice: kuhusu
  rationale: Katika muktadha wa sala, kihusishi hiki kinaanzisha habari au hali inayozungumziwa, si mwelekeo wa kimahali.
- source_word: הַנָּכְרִי
  choice: mgeni
  rationale: Hapa neno linamaanisha mtu asiye Mwisraeli. “Mgeni” ni neno la kawaida la Kiswahili, huku tanbihi ikibainisha maana yake maalumu katika mstari huu.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: ambaye si wa watu wako Israeli
  rationale: Kauli hii inahifadhi tofauti ya kimahusiano kati ya taifa la Israeli kama watu wa Mungu na huyo asiye Mwisraeli.
- source_word: וּבָא
  choice: lakini anakuja
  rationale: 'Ingawa kiunganishi cha Kiebrania kimsingi huendeleza sentensi, hapa kuna utofautishaji wa kiasi: si wa Israeli, lakini anakuja kutoka mbali.'
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: kutoka nchi ya mbali
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kauli inayoonyesha umbali wa kijiografia.
- source_word: לְמַעַן שְׁמֶךָ
  choice: kwa ajili ya jina lako
  rationale: Inahifadhi uzito wa kibiblia wa “jina” kama sifa, umaarufu, na kujifunua kwa Mungu, bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Tofauti ya kiagano kati ya Israeli na mtu asiye Mwisraeli
  choice: mgeni, ambaye si wa watu wako Israeli
  alternative: mtu wa nje, ambaye si wa watu wako Israeli
  rationale: Tafsiri inabaki wazi kwamba anayezungumziwa si Mwisraeli, bila kugeuza tofauti hiyo kuwa kundi la kijamii tu au kuingiza mafundisho ya dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeachwa ikiendelea kwa kistari kirefu kwa kuwa wazo la sala linaendelea katika mistari inayofuata.
