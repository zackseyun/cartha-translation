base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/007.yaml
  text: For the cherubim spread out their wings over the place of the ark[a], and the cherubim overshadowed the ark and its poles from above.
translation:
  language: sw
  text: Kwa maana makerubi walikuwa wametandaza mabawa yao juu ya mahali pa sanduku[a], na makerubi wakalifunika sanduku na fito zake kutoka juu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuelekea mahali pa sanduku.” Kihusishi cha Kiebrania kinaweza kueleweka kwa maana ya mwelekeo, ingawa muktadha unaonyesha kwamba mabawa yalienea juu ya mahali lilipokuwa sanduku.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha maelezo yanayotoa sababu ya kauli iliyotangulia; “Kwa maana” ni ya kawaida na huhifadhi nguvu hiyo ya ufafanuzi.
- source_word: הַכְּרוּבִים
  choice: makerubi
  rationale: Ni umbo la Kiswahili lililozoeleka kwa viumbe hawa katika muktadha wa hema na hekalu.
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: yalikuwa yamenyoosha mabawa yao
  rationale: Kirai kishirikishi kinaeleza hali au mkao uliokuwa ukiendelea; tafsiri hii inaonyesha kwamba mabawa yalikuwa yamekunjuliwa na kubaki yametandazwa.
- source_word: אֶל מְקוֹם הָאָרוֹן
  choice: juu ya mahali pa sanduku
  rationale: Ingawa אֶל mara nyingi humaanisha “kuelekea,” picha ya mahali hapa na kishazi kinachofuata zinaonyesha mabawa yakienea juu ya eneo la sanduku; uwezekano wa maana ya mwelekeo umehifadhiwa katika tanbihi.
- source_word: וַיָּסֹכּוּ
  choice: yakalifunika
  rationale: Kitenzi סכך kina maana ya kufunika au kukinga; “kufunika” ni wazi na kinafaa kwa picha ya makerubi yaliyo juu ya sanduku.
- source_word: עַל הָאָרוֹן
  choice: sanduku
  rationale: Maana ya עַל imejumuishwa kiasili katika kitenzi “kufunika,” huku “kutoka juu” ikibainisha mahali pa tendo hilo.
- source_word: בַּדָּיו
  choice: mipiko yake
  rationale: Hurejelea fito za kulibebea sanduku; “mipiko” ni neno la Kiswahili linalofaa katika muktadha huu na huepuka maelezo marefu ndani ya mstari.
- source_word: מִלְמָעְלָה
  choice: kutoka juu
  rationale: Huhifadhi kwa karibu kirai cha Kiebrania kinachoonyesha upande au mahali ambako kufunika kulitokea.
