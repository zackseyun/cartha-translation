base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/004.yaml
  text: They brought up the ark of Yahweh[a], the tent of meeting, and all the holy vessels that were in the tent[b]; the priests and the Levites brought them up.
translation:
  language: sw
  text: Wakapandisha sanduku la Yahweh, hema la kukutania, na vyombo vyote vitakatifu vilivyokuwa ndani ya hema; makuhani na Walawi wakavipandisha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Wakalipandisha
  rationale: Hifili ya עלה hapa ina maana ya kuleta au kupeleka juu. “Wakalipandisha” ni Kiswahili cha kawaida kinachohifadhi mwelekeo wa kwenda juu kuelekea hekalu bila kuamua kama walibeba kwa mikono au kwa namna nyingine.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahweh
  rationale: “Sanduku” ni neno linaloeleweka kwa אֲרוֹן katika muktadha wa sanduku la agano; muundo “la Yahweh” unahifadhi uhusiano wa moja kwa moja wa Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetafsiriwa kwa unukuzi “Yahweh,” badala ya kulibadilisha kuwa cheo.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni jina la mahali patakatifu pa hema ambako Mungu alikutana na watu wake. “Hema la kukutania” ni usemi wa kawaida wa kibiblia na unaofuata maana ya Kiebrania.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: vyombo vyote vitakatifu
  rationale: כְּלִים ni neno pana kwa vyombo, vifaa, au vitu vya matumizi. “Vyombo” ni wazi na haliongezi dhana kwamba vitu vyote vilikuwa samani kubwa.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: vilivyokuwa ndani ya hema
  rationale: Kishazi hiki kwa kawaida kinaeleza vyombo vitakatifu. “Ndani ya hema” kinarejelea wazi hema la kukutania bila kurudia jina lote.
- source_word: וַיַּעֲלוּ אֹתָם
  choice: wakavipandisha
  rationale: Kitenzi kilichorudiwa katika Kiebrania kimehifadhiwa, huku kiwakilishi cha ngeli ya vyombo kikifanya sentensi iwe ya asili katika Kiswahili.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: makuhani na Walawi
  rationale: Kiebrania kinataja makundi yote mawili moja kwa moja. Tafsiri haiyaunganishi kuwa kundi moja wala kuondoa tofauti iliyopo katika maandishi.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahweh” linahifadhi jina hilo kwa unukuzi bila kulibadilisha kuwa “BWANA.”
- issue: Uhusiano wa makuhani na Walawi katika tendo la kuhamisha vitu vitakatifu
  choice: Kutaja “makuhani na Walawi” kama makundi yote mawili katika maandishi makuu
  alternative: makuhani Walawi
  rationale: Kiebrania kinasema wazi “makuhani na Walawi.” Kutaja wote kunahifadhi uwezekano wa tofauti kati yao na mvutano unaoweza kuonekana unapolinganishwa na vifungu vingine kuhusu majukumu yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi “waka-” umetumiwa kwa mtiririko wa kihistoria; marudio ya kitenzi cha kupandisha yamehifadhiwa kama katika Kiebrania.
