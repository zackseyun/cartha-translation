revisions:
- from: Na maneno yangu haya, ambayo nimeomba kwa unyenyekevu mbele za Yahwe, na yawe karibu na Yahwe Mungu wetu mchana na usiku, ili aitendee haki[a] sababu ya mtumishi wake na sababu ya watu wake Israeli, kulingana na mahitaji ya kila siku[b].
  to: Na maneno yangu haya, ambayo nimeomba kwa kusihi mbele ya Yahwe, yawe karibu na Yahwe Mungu wetu mchana na usiku, ili atetee shauri[a] la mtumishi wake na shauri la watu wake Israeli, kama inavyohitajika kila siku[b].
  rationale: The revision corrects the Swahili syntax and restores a clear legal-cause rendering for the repeated Hebrew מִשְׁפָּט. 'Kwa kusihi' more directly reflects the earnest supplication of הִתְחַנַּנְתִּי, while the footnote retains the legitimate 'do justice/maintain the right' alternatives. Footnote anchors remain sequential and attached to the relevant phrases.
