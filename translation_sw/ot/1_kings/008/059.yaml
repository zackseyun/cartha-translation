id: 1KI.8.59
reference: 1 Kings 8:59
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/יִֽהְי֨וּ דְבָרַ֜/י אֵ֗לֶּה אֲשֶׁ֤ר הִתְחַנַּ֨נְתִּי֙ לִ/פְנֵ֣י יְהוָ֔ה קְרֹבִ֛ים אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ יוֹמָ֣ם וָ/לָ֑יְלָה לַ/עֲשׂ֣וֹת מִשְׁפַּ֣ט עַבְדּ֗/וֹ וּ/מִשְׁפַּ֛ט עַמּ֥/וֹ יִשְׂרָאֵ֖ל דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/059.yaml
  text: And may these words of mine[a], with which I have pleaded before Yahweh, be near Yahweh our God day and night, that he may uphold the cause of his servant and the cause of his people Israel, as each day requires[c][b],
translation:
  language: sw
  text: Na maneno yangu haya, ambayo nimeomba kwa kusihi mbele ya Yahwe, yawe karibu na Yahwe Mungu wetu mchana na usiku, ili atetee shauri[a] la mtumishi wake na shauri la watu wake Israeli, kama inavyohitajika kila siku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atendee haki” au “adumishe haki ya.” Nahau ya Kiebrania inahusu kutekeleza haki kwa niaba ya mtu au kutetea shauri lake.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “jambo la siku katika siku yake,” yaani, jambo linalohitajika kila siku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: na yawe
  rationale: Umbo hili linaonyesha ombi au tamanio, si taarifa rahisi ya wakati ujao.
- source_word: דְבָרַי אֵלֶּה
  choice: maneno yangu haya
  rationale: Huhifadhi umilikaji na msisitizo wa maneno aliyoyasema Solomoni.
- source_word: אֲשֶׁר הִתְחַנַּנְתִּי
  choice: ambayo nimeomba kwa unyenyekevu
  rationale: Kitenzi kinaashiria dua au ombi la dhati; Kiswahili hiki ni cha kawaida na chenye heshima.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Ni nahau ya kawaida ya Kiswahili kwa jambo linalofanywa katika uwepo wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: קְרֹבִים אֶל יְהוָה אֱלֹהֵינוּ
  choice: yawe karibu na Yahwe Mungu wetu
  rationale: Hufuata maana ya msingi ya קְרֹבִים na huhifadhi taswira ya maneno ya sala kubaki karibu na Mungu.
- source_word: יוֹמָם וָלָיְלָה
  choice: mchana na usiku
  rationale: Huhifadhi nahau ya Kiebrania inayoonyesha mwendelezo.
- source_word: לַעֲשׂוֹת מִשְׁפַּט
  choice: aitendee haki sababu ya
  rationale: Huwasilisha nahau ya kisheria ya kushughulikia kwa haki au kutetea shauri la mtu, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: Katika sala ya kifalme kwa Mungu, 'mtumishi' ndilo neno linalofaa kimuktadha na katika rejista ya kibiblia.
- source_word: וּמִשְׁפַּט עַמּוֹ יִשְׂרָאֵל
  choice: na sababu ya watu wake Israeli
  rationale: Kurudiwa kwa מִשְׁפַּט kumewakilishwa kwa muundo unaolingana na sehemu ya kwanza.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: kulingana na mahitaji ya kila siku
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya jambo la siku kwa siku bila kupoteza mgawanyo wa kila siku.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; 'Yahwe' huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Maana ya לַעֲשׂוֹת מִשְׁפַּט
  choice: aitendee haki sababu ya
  alternative: atetee shauri la; afanye haki kwa ajili ya
  rationale: Kiebrania kinaweza kueleza kutekeleza haki au kudumisha shauri la mtu. Tafsiri kuu na tanbihi zinahifadhi upana huo bila kuufungamanisha na tafsiri moja ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa ombi umehifadhiwa, pamoja na taswira ya maneno kuwa karibu na Mungu mchana na usiku.
