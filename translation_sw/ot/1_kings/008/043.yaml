review_pass:
  verdict: revise
  source_fidelity: The draft generally follows the Hebrew prayer and preserves the volitional force of Solomon’s petition. However, "ukiwa mbinguni, makao yako" shifts the construction toward God being in heaven rather than identifying heaven as his dwelling place. The placement of both footnote markers also does not correspond to the words annotated. The revised wording restores the apposition and places each marker at its relevant phrase.
  naturalness: '"Mahali pa makao yako" is natural, clear Standard East African Swahili in this elevated prayer register. "Mataifa yote ya dunia" more accurately represents the collective peoples/nations in the Hebrew than the individual-focused "watu wote wa dunia." "Mgeni atakayekuomba" is a natural expression for a foreigner’s petition to God.'
  terminology: '"Mgeni" suitably renders הַנָּכְרִי in this context. "Kukuogopa" appropriately retains the biblical force of fearing God. "Jina lako limetajwa juu ya nyumba hii" gives a usable Swahili rendering of the Hebrew idiom without reducing it in the main text to a doctrinal interpretation; the footnote supplies the more literal form and explanation.'
  issues:
  - severity: medium
    issue: The phrase "ukiwa mbinguni, makao yako" is syntactically and semantically imprecise.
    rationale: 'It can mean "while you are in heaven" and leaves "makao yako" loosely attached. The Hebrew identifies heaven as God’s dwelling place: "hear in heaven, your dwelling place."'
  - severity: medium
    issue: Footnote anchors [a] and [b] are attached to unrelated locations.
    rationale: Footnote a discusses the verb for calling/crying to God but is anchored after "atakuitia" only in the revised placement, not after "mbinguni". Footnote b explains the name-called-upon-the-house idiom and must be anchored at the house phrase, not after the Israel comparison.
  - severity: low
    issue: '"Watu wote wa dunia" weakens the collective national sense of כָּל עַמֵּי הָאָרֶץ.'
    rationale: '"Mataifa yote ya dunia" better conveys all peoples/nations while remaining idiomatic.'
  revised_text: Nawe usikie huko mbinguni, mahali pa makao yako, na utende kulingana na yote ambayo mgeni atakayekuomba[a], ili mataifa yote ya dunia wajue jina lako, na wakuogope kama watu wako Israeli wanavyokuogopa, na wajue kwamba jina lako limetajwa juu ya nyumba hii niliyoijenga.[b]
