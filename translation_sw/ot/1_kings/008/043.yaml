source:
  edition: WLC
  text: אַתָּ֞ה תִּשְׁמַ֤ע הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ/ן֩ כָּל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/043.yaml
  text: may you hear in heaven[a], the place where you dwell, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name, to fear you as your people Israel do[b], and to know that your name is called on this house that I have built.
translation:
  language: sw
  text: Nawe usikie huko mbinguni, mahali pa makao yako, na utende kulingana na yote ambayo mgeni atakayekuomba[a], ili mataifa yote ya dunia wajue jina lako, na wakuogope kama watu wako Israeli wanavyokuogopa, na wajue kwamba jina lako limetajwa juu ya nyumba hii niliyoijenga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakakuitia” au “atakakulilia.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “jina lako limeitwa juu ya nyumba hii”; nahau hii inaonyesha kwamba nyumba hiyo ni yako au inalibeba jina lako.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: usikie
  rationale: Ingawa kimaumbo ni kitenzi cha hali isiyotimilika, katika ombi hili kina nguvu ya dua au ombi; hali ya kuamuru ya Kiswahili inaeleza jambo hilo kwa kawaida.
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: ukiwa mbinguni, makao yako
  rationale: Hueleza mbingu kuwa mahali pa makao ya Mungu. 'Ukiwa mbinguni' ni Kiswahili cha kawaida bila kulazimisha maana ya 'kutoka' ambayo haijaonyeshwa wazi katika Kiebrania.
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר
  choice: na utende kulingana na yote ambayo
  rationale: Hudumisha upana wa kitenzi 'kutenda' na uhusiano wa kufuata ombi lote, bila kueleza mapema aina ya jibu la Mungu.
- source_word: יִקְרָא אֵלֶיךָ
  choice: atakuitia
  rationale: קרא אל ni kumwitia au kumlilia mtu. 'Atakuitia' huhifadhi picha ya kumwita Mungu, huku tanbihi ikionyesha maana nyingine zinazowezekana katika muktadha wa sala.
- source_word: הַנָּכְרִי
  choice: huyo mgeni
  rationale: Neno hili humaanisha mtu wa taifa jingine. Katika muktadha huu 'mgeni' ni la kawaida na lenye heshima, ingawa maana si tu mtu asiyejulikana bali mtu asiye Mwisraeli.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: watu wote wa dunia
  rationale: Kauli ina upeo wa ulimwengu mzima na inarejelea makundi yote ya watu, si eneo la karibu tu.
- source_word: לְיִרְאָה אֹתְךָ
  choice: kukuogopa
  rationale: '''Kuogopa'' huhifadhi mvutano wa kibiblia wa hofu, kicho na staha badala ya kuupunguza kuwa heshima pekee.'
theological_decisions:
- issue: Nahau שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: jina lako linaitwa juu ya nyumba hii
  alternative: nyumba hii inaitwa kwa jina lako / nyumba hii ni yako
  rationale: Tafsiri kuu huhifadhi kwa uwazi nahau ya Kiebrania inayohusisha jina la Mungu na nyumba, bila kuifupisha moja kwa moja kuwa umiliki tu; tanbihi inaeleza maana yake.
- issue: Maana ya ירא katika mwitikio wa mataifa kwa Mungu
  choice: kukuogopa
  alternative: kukucha / kukuheshimu
  rationale: Neno 'kuogopa' huhifadhi kwa pamoja hofu, kicho na heshima katika uhusiano na Mungu, bila kulainisha uzito wake wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo 'nawe usikie' huendeleza sauti ya ombi, na marudio ya 'jina lako' na 'nyumba hii' yamehifadhiwa kwa sababu ni muhimu katika hoja ya mstari.
