  text: וַ/יְהִ֕י עִם לְבַ֖ב דָּוִ֣ד אָבִ֑/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/017.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[a], the God of Israel.
translation:
  language: sw
  text: Daudi baba yangu alikuwa na nia moyoni mwake ya kujenga nyumba[a] kwa ajili ya jina la Yahwe, Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kujenga hekalu kwa ajili ya jina la Yahwe.” Kiebrania kinasema kihalisi “kujenga nyumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: alikuwa na
  rationale: Katika muundo huu, kitenzi kinaonyesha hali iliyokuwapo zamani. Kiswahili ‘alikuwa na’ kinaunganika kwa kawaida na wazo lililokuwa moyoni mwa Daudi bila kuongeza kihusishi cha wakati kisichokuwapo katika Kiebrania.
- source_word: עִם לְבַב
  choice: nia moyoni mwake
  rationale: Nahau hii inaonyesha kusudi au tamanio lililokuwa moyoni. Tafsiri hii ni ya kawaida katika Kiswahili na bado inadumisha taswira ya moyo badala ya kuibadili kabisa kuwa ‘alikusudia.’
- source_word: דָּוִד אָבִי
  choice: Daudi baba yangu
  rationale: Mpangilio huu unafuata mpangilio wa Kiebrania na unaeleweka vizuri katika Kiswahili.
- source_word: לִבְנוֹת
  choice: kujenga
  rationale: Hili ndilo neno la kawaida na la wazi kwa ujenzi wa jengo, likiwemo hekalu.
- source_word: בַּיִת
  choice: nyumba
  rationale: Kiebrania kinasema kihalisi ‘nyumba.’ Neno hilo linahifadhi taswira muhimu ya hekalu kuwa nyumba ya Mungu; ‘hekalu’ limetolewa katika tanbihi kama ufafanuzi unaowezekana.
- source_word: לְשֵׁם
  choice: kwa ajili ya jina la
  rationale: Usemi huu unahifadhi lugha ya Kiebrania kuhusu jengo lililowekwa wakfu kwa jina la Mungu bila kuifafanua kupita kiasi kuwa heshima, sifa, au uwepo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi ‘Yahwe’ badala ya kubadilishwa na cheo ‘BWANA.’ Umbo ‘Yahwe’ ni la kawaida katika maandishi ya Kiswahili.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaomtambulisha Yahwe kuwa Mungu wa Israeli.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi la Mungu. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, huku likitumia umbo linalotambulika katika Kiswahili.
- issue: Iwapo בַּיִת itafsiriwe ‘nyumba’ au ‘hekalu’
  choice: nyumba
  alternative: hekalu
  rationale: Neno la Kiebrania ni ‘nyumba,’ ingawa katika muktadha linarejelea hekalu. Kulihifadhi katika matini kuu kunadumisha taswira ya asili na mvutano wake wa kitheolojia; maana ya kimuktadha imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘alikuwa na nia moyoni mwake’ ni wa asili katika Kiswahili na unahifadhi maana ya kusudi pamoja na taswira ya moyo. Alama ya tanbihi imewekwa baada ya ‘nyumba,’ neno ambalo tanbihi inalifafanua.
