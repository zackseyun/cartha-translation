reference: 1 Kings 8:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/כָל עֲדַ֤ת יִשְׂרָאֵל֙ הַ/נּוֹעָדִ֣ים עָלָ֔י/ו אִתּ֖/וֹ לִ/פְנֵ֣י הָֽ/אָר֑וֹן מְזַבְּחִים֙ צֹ֣אן וּ/בָקָ֔ר אֲשֶׁ֧ר לֹֽא יִסָּפְר֛וּ וְ/לֹ֥א יִמָּנ֖וּ מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/005.yaml
  text: And King Solomon[a], and all the assembly of Israel who had assembled before him, were with him before the ark, sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: sw
  text: Mfalme Sulemani na kusanyiko lote la Israeli, waliokusanyika kwake[a], walikuwa pamoja naye mbele ya sanduku, wakitoa dhabihu za kondoo na ng’ombe, ambao hawakuweza kuhesabiwa wala kuorodheshwa kwa sababu ya wingi wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokusanyika mbele yake.” Maneno ya Kiebrania yanaweza kusisitiza kwamba watu walikusanyika kuhusiana na Sulemani.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת
  choice: kusanyiko
  rationale: “Kusanyiko” linaeleza mwili wa kitaifa uliokusanyika kwa tukio la ibada, bila kuleta maana maalumu ya dhehebu.
- source_word: הַנּוֹעָדִים עָלָיו
  choice: waliokuwa wamekusanyika kwake[a]
  rationale: Kitenzi cha Kiebrania kinaonyesha watu waliokusanyika kuhusiana na Sulemani; “kwake” kinahifadhi mwelekeo huo huku tanbihi ikitunza uwezekano mwingine wa uhusiano huo.
- source_word: אִתּוֹ
  choice: walikuwa pamoja naye
  rationale: Kiebrania hakina kitenzi wazi hapa; Kiswahili kinahitaji kitenzi ili kueleza kwamba kusanyiko lilikuwa pamoja na Sulemani.
- source_word: לִפְנֵי הָאָרוֹן
  choice: mbele ya sanduku
  rationale: Hii ni tafsiri ya moja kwa moja ya mahali walipokuwa. “Sanduku” ni neno la kawaida la Kiswahili kwa אָרוֹן katika muktadha huu.
- source_word: מְזַבְּחִים צֹאן וּבָקָר
  choice: wakitoa kondoo na ng’ombe kuwa dhabihu
  rationale: Muundo huu unaonyesha tendo la ibada linaloendelea na unafanya wazi kwa Kiswahili kwamba wanyama ndio waliotolewa kuwa dhabihu.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: wanyama hao hawangeweza kuhesabiwa wala kujulikana idadi yao
  rationale: Maneno mawili ya Kiebrania yanayokaribiana yanasisitiza kwamba idadi ilikuwa kubwa mno; tafsiri hii inadumisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: מֵרֹב
  choice: kwa sababu ya wingi wao
  rationale: 'Huhifadhi maana ya sababu: kutohesabika kulitokana na wingi mkubwa wa wanyama.'
theological_decisions:
- issue: Utambulisho wa “sanduku”
  choice: sanduku
  alternative: sanduku la agano
  rationale: Aya hii ina neno “sanduku” pekee. Kuongeza “la agano” kungeingiza maelezo kutoka muktadha mpana badala ya kutafsiri maneno yaliyopo.
- issue: Uhusiano wa kusanyiko na Sulemani katika עָלָיו
  choice: waliokuwa wamekusanyika kwake
  alternative: waliokuwa wamekusanyika mbele yake / waliokutana kwa ajili yake
  rationale: Kihusishi kinaweza kueleza mwelekeo au uhusiano na Sulemani. Tafsiri kuu haifanyi uhusiano huo kuwa wa ibada au mamlaka kwa namna isiyolazimishwa na maandishi, na tanbihi inadumisha utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Sanduku” limeachwa bila upanuzi wa kimapokeo, na urudiaji wa wazo la kuhesabu umetolewa kwa namna ya asili katika Kiswahili.
