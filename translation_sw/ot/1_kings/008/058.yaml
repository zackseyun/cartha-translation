  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְ/הַטּ֥וֹת לְבָבֵ֖/נוּ אֵלָ֑י/ו לָ/לֶ֣כֶת בְּ/כָל דְּרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֤י/ו וְ/חֻקָּי/ו֙ וּ/מִשְׁפָּטָ֔י/ו אֲשֶׁ֥ר צִוָּ֖ה אֶת אֲבֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/058.yaml
  text: that he may incline our hearts to himself[a], to walk in all his ways and to keep his commandments, his statutes, and his judgments, which he commanded our fathers.
translation:
  language: sw
  text: aielekeze mioyo yetu kwake, ili tuenende katika njia zake zote na kuzishika amri zake, sheria zake na hukumu zake, alizowaamuru baba zetu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mababu zetu.” Kiebrania kinasema “baba zetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַטּוֹת
  choice: aielekeze
  rationale: Hifili ya נטה ina maana ya kusababisha ielekee au igeuke; ‘aielekeze’ huhifadhi picha ya Mungu kuuelekeza utu wa ndani.
- source_word: לְבָבֵנוּ
  choice: mioyo yetu
  rationale: לֵבָב huhusu moyo kama kitovu cha nia, mawazo na hisia; ‘mioyo’ huhifadhi lugha ya picha ya Kiebrania na inaeleweka kwa kawaida.
- source_word: אֵלָיו
  choice: kwake
  rationale: Kihusishi kinaonyesha mwelekeo kumwelekea Mungu; ‘kwake’ ni kifupi na cha asili katika Kiswahili.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: tuenende katika njia zake zote
  rationale: ‘Kuenenda katika njia’ huhifadhi sitiari ya Kiebrania kuhusu mwenendo wa maisha na pia hadhi ya lugha ya agano.
- source_word: וְלִשְׁמֹר
  choice: kuzishika
  rationale: שׁמר ikitumiwa kuhusu maagizo humaanisha kuyatii au kuyazingatia; ‘kuzishika’ ni istilahi ya kawaida ya kibiblia na inaunganika na orodha inayofuata.
- source_word: מִצְוֺתָיו
  choice: amri zake
  rationale: מִצְוָה ni agizo lenye mamlaka; ‘amri’ ni tafsiri ya wazi na thabiti.
- source_word: חֻקָּיו
  choice: masharti yake
  rationale: חֹק/חֻקָּה hurejelea masharti yaliyowekwa; ‘masharti’ hutofautisha neno hili na amri na hukumu kwa Kiswahili cha sasa.
- source_word: וּמִשְׁפָּטָיו
  choice: hukumu zake
  rationale: מִשְׁפָּט lina maana ya hukumu, uamuzi au kanuni ya kisheria; ‘hukumu’ huhifadhi dhana ya kisheria na tofauti ya istilahi katika utatu huu.
- source_word: אֲשֶׁר צִוָּה
  choice: ambazo aliwaamuru
  rationale: Kishazi cha uhusiano kinarejelea vipengele vya sheria; kitenzi chenye kiambishi cha watendewa kinaonyesha kwamba Mungu aliwaagiza mababa kuvishika.
- source_word: אֶת אֲבֹתֵינוּ
  choice: baba zetu
  rationale: אָבוֹתֵינוּ ni neno la ukoo lenye umbo la kiume linalomaanisha mababa au watangulizi wa Israeli; ‘baba zetu’ linafuata umbo la chanzo, huku chaguo pana zaidi likielezwa katika tanbihi.
theological_decisions:
- issue: Istilahi tatu za sheria ya agano
  choice: amri zake, masharti yake na hukumu zake
  alternative: maagizo yake, sheria zake na kanuni zake
  rationale: Chanzo kinatumia istilahi tatu tofauti. Tafsiri inadumisha tofauti hizo badala ya kuzisawazisha, ingawa maeneo ya maana yanaingiliana.
- issue: Rejeo la mababu lenye jinsia ya kiume
  choice: baba zetu
  alternative: mababu zetu
  rationale: Neno la Kiebrania lina umbo la kiume na linaweza kumaanisha mababa wa Israeli au watangulizi kwa ujumla. Maandishi yanahifadhi ‘baba zetu,’ na tanbihi inaonyesha chaguo pana bila kufuta mvutano huo.
- issue: Kazi ya Mungu na mwitikio wa binadamu
  choice: aielekeze mioyo yetu kwake, ili tuenende ... na kuzishika
  alternative: augeuze moyo wetu kwake, tuishi ... na kutii
  rationale: Muundo wa Kiebrania unaomba Mungu aelekeze mioyo, huku kusudi likiwa mwenendo na utii wa watu. Tafsiri huhifadhi pande zote bila kueleza kinadharia uhusiano wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye hadhi ya sala ya kifalme lakini kinachoeleweka kwa msomaji wa leo. ‘Tuenende’ na ‘njia zake’ zinahifadhi sitiari ya mwenendo wa maisha; ‘masharti’ ni la sasa zaidi kuliko ‘maagizo ya sheria’ na linasaidia kutofautisha istilahi tatu.
