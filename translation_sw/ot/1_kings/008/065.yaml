  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה בָֽ/עֵת הַ/הִ֣יא אֶת הֶ/חָ֡ג וְ/כָל יִשְׂרָאֵ֣ל עִמּ/וֹ֩ קָהָ֨ל גָּד֜וֹל מִ/לְּב֥וֹא חֲמָ֣ת עַד נַ֣חַל מִצְרַ֗יִם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת יָמִ֑ים אַרְבָּעָ֥ה עָשָׂ֖ר יֽוֹם־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/065.yaml
  text: At that time Solomon held the feast[a], and all Israel with him, a great assembly from Lebo-hamath to the Brook of Egypt, before Yahweh our God, seven days and seven days[b], fourteen days.
translation:
  language: sw
  text: Wakati huo Sulemani akaadhimisha sikukuu mbele za Yahwe, Mungu wetu, pamoja na Israeli wote—kusanyiko kubwa kutoka Lebo-Hamathi[a] hadi Kijito cha Misri[b]—kwa siku saba na siku saba, jumla siku kumi na nne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pa kuingilia Hamathi.” Kiebrania kinaweza kueleweka kama maelezo ya mpaka au kama jina la mahali, Lebo-Hamathi.
    reason: alternative_reading
  - marker: b
    text: Au, “Wadi ya Misri.” Neno la Kiebrania mara nyingi humaanisha mkondo wa maji wa msimu, si mto mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת הֶחָג
  choice: akaadhimisha sikukuu
  rationale: Kitenzi עשה kwa kuambatana na חָג ni nahau yenye maana ya kuadhimisha au kutunza sikukuu, si kuitengeneza. ‘Akaadhimisha sikukuu’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: קָהָל גָּדוֹל
  choice: kusanyiko kubwa
  rationale: קָהָל humaanisha jamii iliyokusanyika. ‘Kusanyiko kubwa’ linahifadhi maana ya mkutano rasmi wa watu bila kuingiza maana maalumu ya kidhehebu.
- source_word: מִלְּבוֹא חֲמָת
  choice: kutoka Lebo-Hamathi
  rationale: Kirai hiki kinaweza kueleweka kama jina la mahali au kama ‘mahali pa kuingilia Hamathi.’ Jina la mahali limewekwa katika matini kwa kuwa ni alama ya mpaka inayojulikana, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: נַחַל מִצְרַיִם
  choice: Kijito cha Misri
  rationale: נַחַל kwa kawaida ni mkondo au bonde la maji linaloweza kuwa la msimu, wala si lazima mto mkubwa. ‘Kijito cha Misri’ ni cha asili kwa Kiswahili na hakichanganywi na Mto Nile.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: mbele za Yahwe Mungu wetu
  rationale: Tafsiri hii inahifadhi uhusiano wa kuwa mbele au katika uwepo wa Mungu, pamoja na jina la agano יְהוָה.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת יָמִים
  choice: kwa siku saba na siku saba
  rationale: Urudiaji wa Kiebrania umehifadhiwa badala ya kufupishwa, kwa kuwa huenda unaonyesha vipindi viwili vinavyofuatana vya siku saba.
- source_word: אַרְבָּעָה עָשָׂר יוֹם
  choice: yaani siku kumi na nne
  rationale: Hiki ni kijalizo kinachofafanua jumla ya muda; ‘yaani’ kinaonyesha uhusiano huo wazi kwa Kiswahili bila kubadili maana.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Matini ya Kiebrania inatumia jina la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuongeza fundisho la dhehebu.
- issue: Vipindi viwili vya siku saba
  choice: siku saba na siku saba, yaani siku kumi na nne
  alternative: siku kumi na nne
  rationale: Urudiaji unaweza kurejelea maadhimisho mawili ya siku saba yanayofuatana. Tafsiri haubainishi zaidi ya asemavyo mstari, bali huhifadhi urudiaji na jumla yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umegawanywa katika sentensi mbili ili kuepuka sentensi ndefu isiyo ya kawaida, huku wahusika, eneo, uwepo wa Yahwe, na muda vikihifadhiwa. Alama za tanbihi zimewekwa baada ya maneno yanayohusika, si baada ya ‘sikukuu’ au urudiaji wa siku.
