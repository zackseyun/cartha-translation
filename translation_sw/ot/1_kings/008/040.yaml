lexical_decisions:
- source_word: לְמַעַן
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi au matokeo katika sala ya Sulemani kwa njia ya kawaida na wazi katika Kiswahili.
- source_word: יִרָאוּךָ
  choice: wakuogope
  rationale: Kitenzi ירא kinapomhusu Mungu hubeba maana ya hofu yenye uchaji. “Wakuogope” kinadumisha uzito huo wa kibiblia bila kuupunguza kuwa heshima tu.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: siku zote watakazoishi
  rationale: Usemi huu wa Kiswahili ni wa asili na unaonyesha kipindi chote cha maisha yao, huku ukibaki karibu na taswira ya Kiebrania ya “siku zote.”
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: katika nchi
  rationale: Ingawa muundo wa Kiebrania ni kama “juu ya uso wa nchi/ardhi,” Kiswahili cha kawaida hakihitaji kuhifadhi nahau hiyo neno kwa neno. Muktadha wa nchi aliyoitoa Mungu unaunga mkono “katika nchi.”
- source_word: הָאֲדָמָה
  choice: nchi
  rationale: Neno hili linaweza kumaanisha ardhi au dunia, lakini kishazi kinachofuata kuhusu zawadi kwa baba zao kinaelekeza kwa nchi ya urithi.
- source_word: אֲשֶׁר נָתַתָּה
  choice: uliyowapa
  rationale: Wakati uliopita unaonyesha tendo la Mungu la kutoa nchi; kiambishi “-wa-” humtaja mpokeaji wa wingi kwa kawaida katika Kiswahili.
- source_word: לַאֲבֹתֵינוּ
  choice: baba zetu
  rationale: Hii inafuata kwa karibu usemi wa Kiebrania na kudumisha lugha ya kihistoria ya agano; “mababu zetu” au “wahenga wetu” yanaweza kueleza maana pana zaidi.
theological_decisions:
- issue: Maana ya ירא inapomhusu Mungu
  choice: wakuogope
  alternative: wamheshimu; wamche kwa uchaji
  rationale: “Wakuogope” huhifadhi wazo la kibiblia la kumwogopa Mungu, ambalo linajumuisha uchaji na utii lakini halipaswi kufupishwa kuwa heshima pekee.
- issue: Upeo wa הָאֲדָמָה
  choice: nchi
  alternative: dunia; ardhi
  rationale: Kishazi “uliyowapa baba zetu” kinaonyesha kwamba hapa inakusudiwa nchi waliyopewa Israeli, ingawa neno lenyewe linaweza kuwa na maana pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya sala lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “siku zote watakazoishi” unahifadhi nahau ya muda ya Kiebrania kwa Kiswahili cha asili; “katika nchi” huepuka tafsiri ngumu ya neno kwa neno ya “juu ya uso wa ardhi.”
