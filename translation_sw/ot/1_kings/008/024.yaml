base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/024.yaml
  text: who have kept for your servant David my father what you spoke to him[a]; you spoke with your mouth, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: sw
  text: Wewe uliyeyatunza kwa ajili ya mtumishi wako Daudi, baba yangu, yale uliyomwambia[a]; ulisema kwa kinywa chako, na kwa mkono wako umeyatimiza, kama ilivyo leo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uliyoyatunza kwa mtumishi wako Daudi, baba yangu, yale uliyomwambia.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Ulisema kwa kinywa chako, na kwa mkono wako umeyatimiza”—taswira inayoonyesha kwamba Mungu alitimiza kwa tendo yale aliyosema.'
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: uliyemtimizia
  rationale: Katika muktadha huu, kitenzi kinaeleza Mungu kutunza na kutekeleza neno lake kwa ajili ya Daudi. ‘Uliyemtimizia’ ni Kiswahili cha kawaida na kinadumisha tofauti na מִלֵּאתָ, ambalo limetafsiriwa moja kwa moja ‘umetimiza’ baadaye.
- source_word: לְעַבְדְּךָ
  choice: mtumishi wako
  rationale: Muundo ‘uliyemtimizia mtumishi wako’ unaonyesha kwamba Mungu alitenda kwa ajili ya Daudi, huku ukihifadhi cheo chake cha unyenyekevu na uhusiano, ‘mtumishi wako.’
- source_word: דָּוִד אָבִי
  choice: Daudi, baba yangu
  rationale: Mpangilio huu unafuata kwa karibu mfuatano wa Kiebrania na ni wa asili katika Kiswahili.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: yale uliyomwambia
  rationale: ‘Uliyomwambia’ huwasilisha usemi halisi bila kuufasiri moja kwa moja kuwa ahadi, hivyo kudumisha mwangwi wa kitenzi cha kusema katika kishazi kinachofuata.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: Ulinena kwa kinywa chako
  rationale: ‘Ulinena’ ni lugha yenye hadhi lakini inayoeleweka, na ‘kwa kinywa chako’ huhifadhi msisitizo na usambamba wa picha ya Kiebrania.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: na kwa mkono wako umetimiza
  rationale: Tafsiri hii huhifadhi picha halisi inayotofautisha kinywa cha Mungu, yaani kusema, na mkono wake, yaani kutenda, huku ‘umetimiza’ ikieleza kukamilishwa kwa neno hilo.
- source_word: כַּיּוֹם הַזֶּה
  choice: kama ilivyo leo
  rationale: Ni msemo wa sasa na wa asili unaoonyesha kwamba utimilifu huo unaonekana wazi katika hali ya siku hiyo.
theological_decisions:
- issue: 'Lugha ya kibinadamu kuhusu Mungu: ‘kinywa’ na ‘mkono’'
  choice: 'Kuhifadhi picha halisi katika matini kuu: ‘kwa kinywa chako’ na ‘kwa mkono wako.’'
  alternative: Kufafanua kuwa ‘uliahidi na ukatekeleza.’
  rationale: Kiebrania kwa makusudi huunganisha kusema kwa Mungu na kutenda kwake kwa picha hizi. Kuzihifadhi kunatunza nguvu ya usemi bila kulazimisha ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ulinena’ limetumiwa kwa msisitizo wa kishairi, huku sentensi nyingine ikibaki rahisi kueleweka. Alama zote za tanbihi [a] na [b] zimo katika matini kuu.
