id: 1KI.8.56
reference: 1 Kings 8:56
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בָּר֣וּךְ יְהוָ֗ה אֲשֶׁ֨ר נָתַ֤ן מְנוּחָה֙ לְ/עַמּ֣/וֹ יִשְׂרָאֵ֔ל כְּ/כֹ֖ל אֲשֶׁ֣ר דִּבֵּ֑ר לֹֽא נָפַ֞ל דָּבָ֣ר אֶחָ֗ד מִ/כֹּל֙ דְּבָר֣/וֹ הַ/טּ֔וֹב אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/056.yaml
  text: Blessed be Yahweh[a], who has given rest to his people Israel, according to all that he spoke. Not one word has failed of all his good words that he spoke by the hand of Moses his servant.
translation:
  language: sw
  text: Yahwe na abarikiwe, ambaye amewapa watu wake Israeli pumziko, sawasawa na yote aliyosema. Katika maneno yake yote mema aliyoyasema kwa njia ya Musa mtumishi wake, hakuna hata neno moja lililoshindwa kutimia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: na abarikiwe
  rationale: Muundo huu wa ombi na sifa unahifadhi nguvu ya kauli ya baraka kwa Mungu, bila kuibadili moja kwa moja kuwa kitenzi cha ‘kusifu.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: נָתַן מְנוּחָה
  choice: amewapa ... pumziko
  rationale: ‘Pumziko’ hapa linamaanisha hali ya utulivu na usalama baada ya maadui na misukosuko, si amani ya moyoni tu.
- source_word: לְעַמּוֹ יִשְׂרָאֵל
  choice: watu wake Israeli
  rationale: Inahifadhi lugha ya agano na uhusiano wa Israeli kama watu wake Mungu kwa Kiswahili cha kawaida.
- source_word: כְּכֹל אֲשֶׁר דִּבֵּר
  choice: sawasawa na yote aliyosema
  rationale: Inadumisha kitenzi cha Kiebrania ‘alisema’ bila kukibadili kimya kimya kuwa ‘aliahidi.’
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: Hakuna hata neno moja ... ambalo halikutimia
  rationale: Nahau ya Kiebrania ya neno ‘kuanguka’ inaelezwa kwa Kiswahili cha sasa kuwa kutokosa kutimia.
- source_word: מִכֹּל דְּבָרוֹ הַטּוֹב
  choice: kati ya maneno yake yote mema
  rationale: Wingi wa Kiswahili unawasilisha vizuri maana ya jumla ya nomino ya umoja katika Kiebrania na kuleta sentensi ya kawaida.
- source_word: בְּיַד מֹשֶׁה
  choice: kwa njia ya Musa
  rationale: Hii ni nahau ya uwakala; ‘kwa njia ya’ inaonyesha kwamba Musa alikuwa mpatanishi wa ujumbe kwa Kiswahili cha asili.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: Katika habari ya Musa kama wakala mwenye heshima wa Mungu, ‘mtumishi’ ndilo neno linalofaa zaidi kuliko ‘mtumwa.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; kulitaja ‘Yahwe’ kunahifadhi ushahidi huo wa chanzo.
- issue: Iwapo דָּבָר / דְּבָרוֹ itafsiriwe ‘neno’ au ‘ahadi’
  choice: neno
  alternative: ahadi
  rationale: Muktadha unahusu ahadi zilizotimizwa, lakini Kiebrania kinasema ‘neno.’ Maandishi makuu yanahifadhi msamiati huo, huku tanbihi ikieleza maana ya ahadi.
- issue: Maana ya kutotimia kwa neno la Mungu
  choice: halikutimia
  alternative: halikuanguka
  rationale: ‘Kuanguka’ ni picha ya nahau ya Kiebrania; ‘halikutimia’ huwasilisha maana yake bila kuamua zaidi ya madai ya kifungu kwamba hakuna alilosema lililoshindwa kutekelezeka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa urahisi. Muundo wa Kiebrania umehifadhiwa pale ulipo wa kawaida katika Kiswahili; nahau ‘kwa mkono wa’ imewasilishwa kwa njia ya asili zaidi kama ‘kwa njia ya.’
