  text: וַֽ/יַּעְמֹ֕ד וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל ק֥וֹל גָּד֖וֹל לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/055.yaml
  text: 'And he stood and blessed all the assembly of Israel with a loud voice[b][a], saying:'
translation:
  language: sw
  text: 'Kisha akasimama, akalibariki kusanyiko lote la Israeli kwa sauti kubwa, akisema:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעְמֹד
  choice: Kisha akasimama
  rationale: Kitenzi hiki kinaendeleza mfululizo wa matendo katika simulizi; “akasimama” ndilo maana ya moja kwa moja ya עמד katika mazingira haya.
- source_word: וַיְבָרֶךְ
  choice: akalibariki
  rationale: ברך hapa humaanisha kutamka baraka juu ya watu waliokusanyika. “Akalibariki” ni fupi, ya asili, na haiingizi maelezo ya kitheolojia yasiyotajwa wazi.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: kusanyiko lote la Israeli
  rationale: קהל ni jamii iliyokusanyika hadharani; “kusanyiko” linaeleza maana hiyo kwa Kiswahili cha sasa, huku כָּל ikiwakilishwa na “lote.”
- source_word: קוֹל גָּדוֹל
  choice: kwa sauti kubwa
  rationale: Kirai hiki kwa neno moja moja ni “sauti kubwa,” na katika muktadha huu kinaonyesha sauti yenye kusikika kwa nguvu; usemi huo ni wa kawaida katika Kiswahili.
- source_word: לֵאמֹר
  choice: 'akisema:'
  rationale: Kitenzi-jina hiki kinaanzisha maneno yanayofuata katika mstari unaofuata; “akisema:” huhifadhi uhusiano huo wa moja kwa moja.
theological_decisions:
- issue: Maana ya kumbariki Israeli
  choice: Sulemani alitamka baraka juu ya watu waliokusanyika.
  alternative: Kwamba Sulemani mwenyewe aliwapa neema ya Mungu kwa uwezo wake.
  rationale: ברך inaweza kumaanisha kutamka baraka katika mazingira rasmi ya hadhara. Tafsiri inadumisha neno “bariki” bila kuamua utaratibu wa kitheolojia ambao mstari wenyewe hautaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili na wazi kwa msomaji wa kawaida, huku ukidumisha mtiririko rasmi wa hotuba ya kifalme na ya ibada.
