base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/008.yaml
  text: And the poles were so long that the ends of the poles were seen from the Holy Place before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: sw
  text: Miti ya kubebea ilikuwa mirefu kiasi kwamba ncha zake zilionekana na mtu aliyekuwa Patakatifu, mbele ya chumba cha ndani[a], lakini hazikuonekana kutoka nje; nayo iko huko mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele ya Patakatifu Zaidi.” Neno la Kiebrania linamaanisha chumba cha ndani cha hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִכוּ
  choice: ilikuwa mirefu kiasi kwamba
  rationale: Muundo huu wa Kiswahili unaonyesha hali iliyotokana na urefu wa miti na uhusiano wake na kuonekana kwa ncha zake, bila kulazimisha maana ya kwamba miti ilirefushwa na mtu.
- source_word: הַבַּדִּים
  choice: miti ya kubebea
  rationale: Neno hili linarejelea miti iliyotumiwa kulibebea sanduku. ‘Miti ya kubebea’ ni wazi na ya kawaida kuliko istilahi ya kizamani.
- source_word: וַיֵּרָאוּ רָאשֵׁי הַבַּדִּים
  choice: ncha zake zilionekana
  rationale: רָאשֵׁי ni ‘vichwa’ kihalisi, lakini kwa miti mirefu ‘ncha’ ndiyo Kiswahili cha kawaida. Kauli ‘zilionekana’ inawakilisha hali ya kuonekana ya kitenzi cha Kiebrania.
- source_word: מִן הַקֹּדֶשׁ
  choice: mtu akiwa Patakatifu
  rationale: Hapa הַקֹּדֶשׁ ni chumba cha nje cha hekalu, tofauti na chumba cha ndani. Muundo huu unaeleza kwamba ncha zilionekana kwa mtazamaji aliyekuwa Patakatifu na huepuka dhana isiyokusudiwa kwamba ncha zilitokeza nje ya Patakatifu.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: mbele ya chumba cha ndani
  rationale: דְּבִיר ni chumba cha ndani ambamo sanduku liliwekwa, na עַל־פְּנֵי hapa ni ‘mbele ya.’ Tafsiri hii ni sahihi na inaeleweka, huku mbadala wa ‘Patakatifu Zaidi’ ukiwekwa katika tanbihi.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: lakini hazikuonekana kutoka nje
  rationale: Hii inadumisha tofauti kati ya kuonekana kutoka eneo la Patakatifu na kutoweza kuonekana na mtu aliyekuwa nje.
- source_word: וַיִּהְיוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: nayo iko huko mpaka leo
  rationale: Hii ni nahau ya Kiebrania inayoonyesha hali iliyoendelea hadi wakati wa msimuliaji. Umoja wa ‘iko’ unapatana na ngeli ya neno ‘miti’ katika Kiswahili.
theological_decisions:
- issue: Utambulisho wa הַדְּבִיר
  choice: chumba cha ndani
  alternative: Patakatifu Zaidi
  rationale: ‘Chumba cha ndani’ linawakilisha moja kwa moja eneo la ndani la hekalu bila kuingiza ufafanuzi zaidi; jina la kiibada ‘Patakatifu Zaidi’ ni mbadala halali na limetajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Patakatifu’ limetumiwa kama jina la sehemu maalumu ya hekalu, na sentensi imewekwa katika mtiririko wa kawaida wa masimulizi ya Biblia.
