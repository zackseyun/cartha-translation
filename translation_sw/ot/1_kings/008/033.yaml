language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בְּֽ/הִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב אֲשֶׁ֣ר יֶחֶטְאוּ לָ֑/ךְ וְ/שָׁ֤בוּ אֵלֶ֨י/ךָ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִֽתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ אֵלֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/033.yaml
  text: When your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back to you and confess your name and pray and plead with you in this house,
translation:
  language: sw
  text: Watu wako Israeli watakaposhindwa mbele ya adui kwa sababu wamekutenda dhambi, kisha wakurudie, wakalikiri jina lako[a], wakaomba na kukusihi katika nyumba hii,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakalisifu jina lako” au “wakakushukuru kwa ajili ya jina lako.” Kitenzi cha Kiebrania kinaweza kumaanisha kukiri, kusifu, au kushukuru kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִנָּגֵף
  choice: watakaposhindwa
  rationale: Katika muktadha wa vita, umbo hili linaonyesha Israeli kushindwa mbele ya adui. Kiswahili hiki ni cha kawaida na kinahifadhi maana ya tukio bila kutumia lugha ya kizamani.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: watu wako Israeli
  rationale: Inahifadhi umilikishi wa agano na kulitambulisha taifa kuwa Israeli.
- source_word: לִפְנֵי אוֹיֵב
  choice: mbele ya adui
  rationale: Inafuata kwa karibu maana ya לִפְנֵי katika fomula ya kushindwa vitani; nomino haina kibainishi.
- source_word: אֲשֶׁר יֶחֶטְאוּ לָךְ
  choice: kwa sababu wamekutenda dhambi
  rationale: Kishazi hiki kinaeleza sababu ya kushindwa. 'Kukutenda dhambi' ni usemi wa kawaida wa kibiblia unaoonyesha dhambi iliyoelekezwa dhidi ya Mungu.
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: kisha wakurudie
  rationale: Inahifadhi sitiari ya kurudi kwa Mungu bila kuongeza neno la kiteolojia lenye maana pana kuliko kitenzi chenyewe.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: wakalikiri jina lako
  rationale: Katika muktadha wa dhambi, kushindwa na kumrudia Mungu, 'kulikiri jina lako' linaonyesha kumtambua Mungu na mamlaka yake. Maana nyingine halali zimehifadhiwa katika tanbihi.
- source_word: וְהִתְפַּלְלוּ
  choice: wakaomba
  rationale: Ni tafsiri ya kawaida na ya asili ya tendo la kusali au kuomba.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: na kukusihi
  rationale: Inaonyesha ombi la dhati linaloelekezwa kwa Mungu bila kupanua waziwazi kuwa ombi la kupata neema.
- source_word: בַּבַּיִת הַזֶּה
  choice: katika nyumba hii
  rationale: Kihusishi ni 'katika,' na 'nyumba' huhifadhi neno la chanzo ingawa katika muktadha linamaanisha hekalu.
theological_decisions:
- issue: Lugha ya kurejezwa baada ya dhambi bila kufafanua kupita kiasi toba
  choice: wakurudie
  alternative: watubu na kukurudia
  rationale: Kitenzi שׁוּב kimsingi ni 'kurudi' au 'kugeuka kurudi.' Chaguo hili linaonyesha mwendo wa kumrudia Mungu bila kuingiza ufafanuzi mpana wa kimafundisho.
- issue: Maana ya וְהוֹדוּ אֶת שְׁמֶךָ katika muktadha wa toba
  choice: wakalikiri jina lako
  alternative: wakalisifu jina lako; wakalishukuru jina lako
  rationale: Muktadha wa dhambi, kushindwa na kurudi unaunga mkono maana ya kukiri au kulitambua jina la Mungu. Kwa kuwa kitenzi pia kinaweza kumaanisha kusifu au kushukuru, uwezekano huo haujafutwa bali umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unaendeleza kishazi cha masharti cha sala ya Sulemani, hivyo mstari unamalizika kwa koma.
