  rationale: 'The revision makes the opening a fluent Swahili prayer wish, “Yahweh, Mungu wetu, awe pamoja nasi,” while retaining every element of the Hebrew: the divine name, “our God,” presence “with us,” comparison with the fathers, and the two negative petitions. The footnote remains appropriate and its anchor is retained.'
