  text: יְהִ֨י יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ עִמָּ֔/נוּ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אֲבֹתֵ֑י/נוּ אַל יַעַזְבֵ֖/נוּ וְ/אַֽל יִטְּשֵֽׁ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/057.yaml
  text: May Yahweh our God be with us[a], as he was with our fathers. May he not forsake us or abandon us.
translation:
  language: sw
  text: Yahweh, Mungu wetu, awe pamoja nasi, kama alivyokuwa pamoja na baba zetu.[a] Asituache wala asitutelekeze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mababu zetu.” Kiebrania kinasema “baba zetu,” kikirejelea mababu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: na awe
  rationale: Kauli ya ombi ya kitenzi היה inaonyesha nia au sala; “na awe” ni usemi wa kawaida na wenye heshima katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Muundo wenye kiambishi cha nafsi ya kwanza wingi unamaanisha moja kwa moja “Mungu wetu.”
- source_word: עִמָּנוּ
  choice: pamoja nasi
  rationale: Kihusishi עם hapa kinaonyesha kuwapo na kuandamana; “pamoja nasi” ni cha asili na sahihi.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: Neno hili linaanzisha ulinganisho kati ya kuwapo kwa Mungu sasa na kuwapo kwake pamoja na vizazi vilivyotangulia.
- source_word: הָיָה עִם אֲבֹתֵינוּ
  choice: alivyokuwa pamoja na baba zetu
  rationale: Tafsiri hii inatunza neno la msingi “baba” na kumbukumbu ya uaminifu wa Mungu kwa mababu wa Israeli.
- source_word: אַל יַעַזְבֵנוּ
  choice: Asituache
  rationale: Katazo lenye nguvu ya ombi linaomba Mungu asiwaache watu wake; “asituache” ni wazi na la kawaida.
- source_word: וְאַל יִטְּשֵׁנוּ
  choice: wala asitutelekeze
  rationale: נטש lina maana ya kuacha kabisa au kutupa kando; “asitutelekeze” linatofautisha kwa kiasi fulani neno hili na עזב huku likitunza usambamba.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, YHWH. “Yahwe” linatunza jina hilo badala ya kutumia cheo, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Tafsiri ya אֲבֹתֵינוּ
  choice: baba zetu
  alternative: mababu zetu; wahenga wetu
  rationale: Kiebrania kinasema kihalisi “baba zetu” na katika muktadha kinarejelea mababu wa Israeli. Tafsiri kuu inatunza umbo hilo, huku tanbihi ikieleza maana ya kimuktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa sasa, wazi na wenye heshima. “Na awe” na viambishi vya ombi “asitu-” vinatunza nguvu ya kauli za ombi za Kiebrania; “wala” linaonyesha ukaribu wa makatazo mawili bila kuyafanya yafanane kabisa.
