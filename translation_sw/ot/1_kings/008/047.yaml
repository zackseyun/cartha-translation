base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/047.yaml
  text: and if they come to their senses in the land where they were taken captive, and return and plead with you in the land of those who took them captive, saying, ‘We have sinned and acted perversely; we have acted wickedly,’
translation:
  language: sw
  text: na ikiwa watatafakari moyoni mwao katika nchi walikopelekwa mateka, wakarejea[a] na kukusihi katika nchi ya wale waliowateka, wakisema, ‘Tumetenda dhambi, tumetenda kwa upotovu, tumetenda uovu,’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, wakatubu; au, wakageuka.
    reason: Kitenzi cha Kiebrania kina maana ya msingi ya kurudi, lakini katika muktadha huu kinaweza pia kumaanisha kugeuka au kutubu.
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לִבָּם
  choice: watajijirudia moyoni
  rationale: Nahau ya Kiebrania ina maana ya kurudisha jambo moyoni, yaani kutambua hali yao au kurudiwa na fahamu. Usemi huu wa Kiswahili ni wa kawaida na pia unadumisha picha ya moyo.
- source_word: וְשָׁבוּ
  choice: wakarejea
  rationale: Kitenzi שׁוב kimsingi ni kurudi au kurejea, na katika muktadha huu kinaweza pia kudokeza kugeuka kiroho au kutubu. Tafsiri kuu inahifadhi wazo la kurudi bila kulifunga kwa istilahi moja ya kitheolojia.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: na kukusihi
  rationale: Kitenzi חנן katika hitpaeli humaanisha kuomba neema au rehema kwa unyenyekevu; ‘kukusihi’ ni usemi wa asili unaobeba uzito huo.
- source_word: חָטָאנוּ וְהֶעֱוִינוּ רָשָׁעְנוּ
  choice: Tumetenda dhambi, tumepotoka na kutenda uovu
  rationale: 'Maneno haya matatu ya ungamo yametofautishwa: kukosa au kutenda dhambi, kupotosha njia au kutenda kwa upotovu, na kutenda kwa uovu.'
theological_decisions:
- issue: Maana ya וְשָׁבוּ katika mazingira ya uhamisho
  choice: wakarejea
  alternative: wakatubu / wakageuka
  rationale: Kwa kuwa watu bado wako katika nchi ya waliowateka, kurejea kunaweza kueleweka kiroho, lakini Kiebrania hakisemi moja kwa moja ‘kutubu.’ Tafsiri na tanbihi zinahifadhi utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa ungamo la sehemu tatu umehifadhiwa.
