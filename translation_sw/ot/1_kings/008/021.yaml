base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/021.yaml
  text: And there I have set a place for the ark[b][a], in which is the covenant of Yahweh that he made with our fathers when he brought them out of the land of Egypt.
translation:
  language: sw
  text: Nami humo nimeweka mahali kwa ajili ya Sanduku, ambamo mna agano la Yahweh, alilofanya[a] na baba zetu[b] alipowatoa katika nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa maana halisi: “alikata agano.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au “mababu zetu.” Kiebrania: “baba zetu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂם שָׁם מָקוֹם
  choice: Nami humo nimeweka mahali
  rationale: Kitenzi שׂים kina maana ya kuweka; muundo huu unadumisha tendo lililokamilika na mkazo wa mahali unaotolewa na שָׁם.
- source_word: לָאָרוֹן
  choice: kwa ajili ya Sanduku
  rationale: אָרוֹן hapa ni Sanduku la Agano. Neno “Sanduku” linatosha kwa kuwa kishazi kinachofuata kinaeleza agano lililomo.
- source_word: אֲשֶׁר שָׁם
  choice: ambamo mna
  rationale: Muundo wa mahali “ambamo mna” unaonyesha kwa kawaida kwamba agano limo ndani ya Sanduku.
- source_word: בְּרִית יְהוָה
  choice: agano la Yahweh
  rationale: Muundo huu unahifadhi uhusiano wa moja kwa moja kati ya agano na jina la Mungu, יְהוָה.
- source_word: כָּרַת
  choice: alilofanya
  rationale: Ingawa maana ya moja kwa moja ni “kukata,” Kiswahili cha kawaida husema kufanya agano.
- source_word: עִם אֲבֹתֵינוּ
  choice: na baba zetu
  rationale: אבות ni umbo la kiume linalomaanisha “baba”; tafsiri hii inalihifadhi, huku “mababu zetu” ikitajwa kama uwezekano katika tanbihi.
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: alipowatoa
  rationale: ב pamoja na kitenzi-jina huonyesha wakati hapa, na Hifili ya יצא humaanisha kuwatoa.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Pamoja na “alipowatoa,” kirai hiki kinaeleza mahali walikotolewa kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahweh” hulihifadhi kwa unukuzi bila kulibadilisha kuwa cheo.
- issue: Maana ya אֲבֹתֵינוּ
  choice: baba zetu
  alternative: mababu zetu
  rationale: “Baba zetu” hudumisha umbo la kiume la Kiebrania, lakini katika muktadha linaweza pia kumaanisha watangulizi wa taifa kwa upana.
- issue: Nahau כָּרַת בְּרִית
  choice: kufanya agano
  alternative: kukata agano
  rationale: “Kukata agano” hufuata maneno ya Kiebrania moja kwa moja lakini si nahau ya kawaida ya Kiswahili; maana imewasilishwa katika matini na umbo halisi limehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Humo” na “ambamo mna” zinadumisha msisitizo wa mahali wa Kiebrania bila kufanya sentensi kuwa ngumu.
