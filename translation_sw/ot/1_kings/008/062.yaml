  yaml_path: translation/ot/1_kings/008/062.yaml
  text: And the king and all Israel with him were sacrificing sacrifices before Yahweh[a].
translation:
  language: sw
  text: Na mfalme pamoja na Israeli wote waliokuwa naye walikuwa wakitoa dhabihu[a] mbele za Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “walikuwa wakichinja dhabihu,” yaani muundo unaotumia kitenzi na nomino zenye mzizi mmoja ili kusisitiza tendo la kutoa dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Na mfalme
  rationale: Kiunganishi וְ kinaendeleza simulizi, na nomino yenye kibainishi inamrejelea mfalme ambaye tayari ametajwa.
- source_word: וְכָל יִשְׂרָאֵל
  choice: pamoja na Israeli wote
  rationale: Jina la taifa limehifadhiwa kama dhana ya pamoja badala ya kufafanuliwa kuwa ‘Waisraeli wote’; ‘pamoja na’ linaunganisha kiima changamani kwa Kiswahili cha kawaida.
- source_word: עִמּוֹ
  choice: waliokuwa naye
  rationale: Kirai hiki kinaonyesha kwamba Israeli walikuwa pamoja na mfalme; muundo huu ni wazi na wa asili katika Kiswahili.
- source_word: זֹבְחִים זֶבַח
  choice: walikuwa wakitoa dhabihu
  rationale: Muundo wa ‘walikuwa waki-’ unahifadhi tendo linaloendelea la participio ya Kiebrania. Kiswahili cha kawaida hutumia ‘kutoa dhabihu’ badala ya kuiga moja kwa moja uradidi wa kitenzi na nomino wenye mzizi mmoja.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Huu ni usemi wa kawaida na wenye hadhi kwa tendo linalofanywa katika uwepo wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika tetragramatoni limeandikwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imetumia ‘walikuwa wakitoa dhabihu’ kwa ufasaha huku tanbihi ikihifadhi muundo maalumu wa Kiebrania.
