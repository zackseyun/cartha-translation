base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/039.yaml
  text: then may you hear in heaven[a], the place where you dwell, and forgive, and act, and give to each man according to all his ways, whose heart you know—for you alone know the heart of all the sons of man—
translation:
  language: sw
  text: basi usikie mbinguni, mahali pa makao yako, na usamehe, na utende, na umpe kila mtu kulingana na njia zake zote, kwa kuwa unaujua moyo wake. Maana wewe peke yako ndiye unayeijua mioyo ya wanadamu wote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “wana wote wa mwanadamu,” nahau inayomaanisha wanadamu wote.
    reason: Kufafanua nahau ya Kiebrania bila kumfanya אָדָם kuwa jina maalumu “Adamu.”
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: usikie
  rationale: Katika muktadha wa sala ya Sulemani, kitenzi hiki ni ombi kwa Mungu, si taarifa rahisi kuhusu wakati ujao.
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: ukiwa mbinguni, mahali unapokaa
  rationale: Kauli hii inaonyesha mahali Mungu anaposikia; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha ufafanuzi unaofuata kuhusu makao yake.
- source_word: וְסָלַחְתָּ וְעָשִׂיתָ
  choice: na usamehe, na utende
  rationale: Vitenzi vinaendeleza mfululizo wa maombi. “Utende” huhifadhi upana wa kitenzi cha Kiebrania bila kubainisha tendo lisilotajwa.
- source_word: וְנָתַתָּ לָאִישׁ כְּכָל דְּרָכָיו
  choice: na umpe kila mtu kulingana na njia zake zote
  rationale: Umoja wa jumla una maana ya ugawaji kwa kila mtu mmoja mmoja; “njia zake” inadumisha sitiari ya mwenendo iliyomo katika Kiebrania.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: kwa kuwa unaujua moyo wake
  rationale: Huhusianisha hukumu ya kila mtu na ujuzi wa Mungu wa moyo wake, kwa lugha ya kawaida huku ikidumisha maana ya mtu wa ndani.
- source_word: לְבַדְּךָ
  choice: wewe peke yako
  rationale: Inasisitiza kwamba ujuzi huu wa mioyo ni wa Mungu pekee.
- source_word: כָּל בְּנֵי הָאָדָם
  choice: wanadamu wote
  rationale: Hii ndiyo kauli ya kawaida na yenye staha katika Kiswahili kwa nahau ya Kiebrania inayowahusu binadamu wote; umbo halisi linafafanuliwa katika tanbihi.
theological_decisions:
- issue: Ujuzi wa Mungu kuhusu moyo wa mwanadamu
  choice: wewe peke yako ndiye unayeijua mioyo ya wanadamu wote
  alternative: wewe peke yako ndiye unayeujua moyo wa wana wote wa Adamu
  rationale: Tafsiri inahifadhi dai la wazi kwamba Mungu pekee anajua maisha ya ndani ya wanadamu wote, bila kulipanua kuwa fundisho jingine lisilotajwa katika mstari.
- issue: Maana ya “njia” katika kutoa kwa kila mtu
  choice: kulingana na njia zake zote
  alternative: kulingana na mwenendo wake wote
  rationale: “Njia” inadumisha sitiari ya kimaadili ya maandishi ya Kiebrania na haibainishi mapema kama tendo la Mungu ni thawabu, adhabu, au yote mawili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa sala na hadhi ya maandiko. Viunganishi vya “na” vimedumishwa ili kuonyesha mfululizo wa maombi katika Kiebrania; istilahi za kawaida kama “moyo” na “njia” zimehifadhi sitiari za chanzo.
