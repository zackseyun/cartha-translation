base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/011.yaml
  text: and the priests were not able to stand to minister because of the cloud[b][a], for the glory of Yahweh filled the house of Yahweh.
translation:
  language: sw
  text: Makuhani hawakuweza kusimama ili kuhudumu[a] kwa sababu ya lile wingu, kwa maana utukufu wa Yahweh uliijaza nyumba ya Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusimama kuhudumu.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, hekalu la Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: hawakuweza
  rationale: Kitenzi hiki kinaeleza kutokuwa na uwezo; ‘hawakuweza’ ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida kwa watumishi wa kikuhani katika muktadha wa hekalu.
- source_word: לַעֲמֹד
  choice: kusimama
  rationale: Inahifadhi maana ya msingi ya kitenzi, huku muktadha ukidokeza kusimama katika nafasi yao ya huduma.
- source_word: לְשָׁרֵת
  choice: ili kuhudumu
  rationale: Muundo wa kusudi unaendana na infinitivu ya Kiebrania, na ‘kuhudumu’ linafaa kwa huduma rasmi ya kikuhani.
- source_word: מִפְּנֵי הֶעָנָן
  choice: kwa sababu ya lile wingu
  rationale: Kirai hiki kinaonyesha sababu ya makuhani kushindwa kusimama; ‘lile wingu’ hurejelea wingu lililotajwa katika muktadha wa karibu.
- source_word: כִּי
  choice: kwa maana
  rationale: Kinaanzisha maelezo yanayofafanua kwa nini wingu liliwazuia makuhani.
- source_word: מָלֵא
  choice: ulijaza
  rationale: Wakati uliopita rahisi unawakilisha tendo kamili la Kiebrania bila kuongeza ufafanuzi wa wakati usiotajwa wazi.
- source_word: כְבוֹד יְהוָה
  choice: utukufu wa Yahweh
  rationale: Inahifadhi uhusiano wa maneno na taswira ya utukufu wa Mungu unaodhihirika, bila kuibadili kuwa ‘uwepo.’
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Inahifadhi usemi halisi wa Kiebrania; katika muktadha, nyumba hiyo ni hekalu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetolewa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Kiebrania kinatumia jina la agano moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya כְבוֹד יְהוָה
  choice: utukufu wa Yahweh
  alternative: uwepo wa Yahweh
  rationale: ‘Utukufu’ huhifadhi taswira na uzito wa neno כָּבוֹד, pamoja na mvutano wa wazo la utukufu wa Mungu kuijaza nyumba, bila kulifafanua kwa tafsiri pana ya ‘uwepo.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Nyumba ya Yahweh’ imehifadhiwa katika matini, huku tanbihi ikifafanua kuwa inamaanisha hekalu.
