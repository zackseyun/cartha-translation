base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/009.yaml
  text: There was nothing in the ark except the two stone tablets that Moses had placed there at Horeb[c][b][a], where Yahweh made a covenant with the sons of Israel when they came out from the land of Egypt.
translation:
  language: sw
  text: Ndani ya sanduku hakukuwa na kitu chochote isipokuwa vibao viwili vya mawe[a] ambavyo Musa alikuwa ameviweka huko Horebu, ambako Yahwe alifanya agano[b] na Waisraeli[c] walipotoka katika nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vibao viwili vya jiwe.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “alikata agano”; hii ni nahau yenye maana ya “alifanya agano.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “wana wa Israeli”; yaani Waisraeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: Ndani ya sanduku hakukuwa na kitu chochote isipokuwa
  rationale: Muundo huu unaonyesha ukanushi wa kuwepo pamoja na hali ya kutenga kitu kimoja, kwa Kiswahili cha kawaida na kwa ukaribu na maana ya Kiebrania.
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: vibao viwili vya mawe
  rationale: “Vibao” linafaa kwa mawe bapa yaliyoandikwa, na muundo “vya mawe” unaakisi kwa uwazi umbo la Kiebrania.
- source_word: אֲשֶׁר הִנִּחַ שָׁם מֹשֶׁה
  choice: ambavyo Musa alikuwa ameviweka humo
  rationale: Kauli “alikuwa ameviweka” inaonyesha kwamba tendo la Musa lilitangulia hali ya sanduku inayosimuliwa; “humo” hurejelea ndani ya sanduku.
- source_word: בְּחֹרֵב
  choice: huko Horebu
  rationale: “Horebu” ni umbo la kawaida la jina hili katika Kiswahili, na “huko” linaonyesha mahali pa tukio.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: ambako Yahwe alifanya agano na
  rationale: Kitenzi כרת, kihalisi “kata,” ni sehemu ya nahau ya Kiebrania ya kufanya agano. “Ambako” huunganisha tukio hilo na Horebu bila kuongeza maelezo yasiyokuwapo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa umbo linalolingana na tahajia na matamshi ya kawaida ya Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Katika muktadha huu usemi wa kifamilia “wana wa Israeli” unamaanisha watu wa Israeli kwa jumla; “Waisraeli” ni Kiswahili cha sasa, wazi na cha kawaida.
- source_word: בְּצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: walipotoka katika nchi ya Misri
  rationale: Hii inawakilisha kwa kawaida kishazi cha wakati cha Kiebrania na inadumisha rejeo la kutoka Misri.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kina jina la Mungu, si cheo; kwa hiyo “Yahwe” huhifadhi jina hilo moja kwa moja katika umbo la Kiswahili.
- issue: Uwasilishaji wa בני ישראל
  choice: Waisraeli
  alternative: wana wa Israeli
  rationale: Usemi huo wa Kiebrania ni jina la pamoja la watu wa Israeli. “Waisraeli” huwasilisha maana hiyo bila kudokeza kuwa wanaume pekee ndio wanaokusudiwa, huku tanbihi ikihifadhi muundo wa asili.
- issue: Nahau כרת ya agano
  choice: alifanya agano
  alternative: alikata agano
  rationale: “Kukata agano” ni tafsiri ya neno kwa neno lakini si nahau ya kawaida ya Kiswahili; “kufanya agano” huwasilisha maana bila kuondoa dhana ya agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Sanduku” limeachwa bila kuongeza “la Agano” kwa kuwa neno hilo halipo waziwazi katika mstari huu, na muktadha hutambulisha sanduku linalokusudiwa.
