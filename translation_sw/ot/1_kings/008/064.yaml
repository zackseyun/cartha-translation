  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא קִדַּ֨שׁ הַ/מֶּ֜לֶךְ אֶת תּ֣וֹךְ הֶ/חָצֵ֗ר אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּי עָ֣שָׂה שָׁ֗ם אֶת הָֽ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֔ה קָטֹ֗ן מֵֽ/הָכִיל֙ אֶת הָ/עֹלָ֣ה וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/064.yaml
  text: On that day the king consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offering and the grain offering and the fat portions of the peace offerings[c][b], because the bronze altar that was before Yahweh was too small to contain the burnt offering and the grain offering and the fat portions of the peace offerings.
translation:
  language: sw
  text: Siku hiyo mfalme aliweka wakfu sehemu ya katikati ya ua[a] uliokuwa mbele ya nyumba ya Yahwe[b], kwa sababu hapo alitoa sadaka ya kuteketezwa, sadaka ya nafaka, na mafuta ya sadaka za amani[c], kwa maana madhabahu ya shaba iliyokuwa mbele ya Yahwe ilikuwa ndogo mno kutosha kupokea sadaka ya kuteketezwa, sadaka ya nafaka, na mafuta ya sadaka za amani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ya ndani ya ua.”
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya Yahwe” hapa ni hekalu.
    reason: lexical_clarification
  - marker: c
    text: Au, “sehemu za mafuta za sadaka za amani”; yaani, mafuta yaliyotengwa kwa ajili ya kuteketezwa madhabahuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִדַּשׁ
  choice: aliweka wakfu
  rationale: Katika muktadha huu kitenzi kinamaanisha kutenga eneo kwa matumizi matakatifu; “kuweka wakfu” ni Kiswahili cha sasa, cha heshima, na chenye maana ya ibada.
- source_word: תּוֹךְ הֶחָצֵר
  choice: sehemu ya katikati ya ua
  rationale: תּוֹךְ inaonyesha eneo la ndani au katikati; tafsiri hii inahifadhi maana ya mahali bila kudai kwamba ni nukta halisi ya katikati.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: mbele ya nyumba ya Yahwe
  rationale: לִפְנֵי ni usemi wa mahali, na “nyumba ya Yahwe” huhifadhi sitiari ya Kiebrania badala ya kuibadili moja kwa moja kuwa “hekalu.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja kwa umbo linalofaa tahajia ya Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: עָשָׂה שָׁם
  choice: hapo alitoa
  rationale: Ingawa עשה kwa kawaida ni “kufanya,” katika muktadha wa dhabihu humaanisha kutekeleza au kutoa dhabihu.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno la kawaida na linaloeleweka kwa aina hii ya dhabihu iliyoteketezwa madhabahuni.
- source_word: הַמִּנְחָה
  choice: sadaka ya nafaka
  rationale: Katika muktadha wa ibada מִנְחָה ni sadaka ya mazao ya nafaka, si sadaka yoyote kwa ujumla.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: sehemu zenye mafuta za sadaka za amani
  rationale: חֶלְבֵי hapa hurejelea sehemu za mafuta zilizoteketezwa madhabahuni; שְׁלָמִים imetafsiriwa kwa istilahi inayotambulika “sadaka za amani.”
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: madhabahu ya shaba
  rationale: נְחֹשֶׁת inaweza kumaanisha shaba au bronzi; “shaba” ni istilahi ya kawaida ya Kiswahili kwa kifaa hiki cha ibada na haibani zaidi ya ushahidi wa muktadha.
- source_word: קָטֹן מֵהָכִיל
  choice: ilikuwa ndogo mno kutoshea
  rationale: Muundo huu unaonyesha ukosefu wa nafasi au uwezo; “ndogo mno kutoshea” ni wa asili na huhifadhi ulinganisho wa ukubwa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano יהוה, hivyo limetolewa kama jina binafsi badala ya cheo, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Maana ya שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika
  rationale: “Sadaka za amani” huhifadhi uhusiano wa neno hili na wazo la amani/ukamilifu, huku “sadaka za ushirika” ikiwa tafsiri nyingine halali; aya yenyewe haisuluhishi vipengele vyote vya maana ya istilahi hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umegawanywa katika sentensi mbili ili kuweka wazi sababu iliyotolewa katika Kiebrania bila kupoteza marudio ya aina tatu za sadaka.
