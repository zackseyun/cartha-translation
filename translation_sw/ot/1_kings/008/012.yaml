  text: Then Solomon said[a], “Yahweh said that he would dwell in the thick darkness.”
translation:
  language: sw
  text: Ndipo Sulemani akasema, “Yahwe alisema kwamba angekaa katika giza nene.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika wingu jeusi.” Neno la Kiebrania עֲרָפֶל linaweza kumaanisha giza zito au wingu jeusi, hasa katika maelezo ya uwepo wa Yahwe unapodhihirishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Ni kiashiria cha wakati kinachoendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: אָמַר
  choice: akasema / alisema
  rationale: Kitenzi cha kawaida cha kusema; “akasema” kinaendeleza simulizi, na “alisema” kinatanguliza taarifa ya maneno ya Yahwe.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Umbo la jina lililozoeleka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu lililo katika matini ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: לִשְׁכֹּן
  choice: kwamba angekaa
  rationale: Baada ya kitenzi “alisema,” infinitivu hii inaeleza yaliyosemwa au yaliyokusudiwa; umbo hili ni la asili katika Kiswahili.
- source_word: בָּעֲרָפֶל
  choice: katika giza nene
  rationale: Linawakilisha giza zito au hali ya utusitusi inayohusishwa na udhihirisho wa uwepo wa Yahwe, bila kuifanya kuwa wingu tu.
theological_decisions:
- issue: Makao ya Yahwe katika עֲרָפֶל
  choice: Yahwe alisema kwamba angekaa katika giza nene
  alternative: Yahwe alisema kwamba angekaa katika wingu jeusi
  rationale: “Giza nene” linahifadhi mvutano wa picha ya uwepo wa Mungu unaodhihirika katika hali ya kufichika, huku tanbihi ikihifadhi uwezekano wa maana ya wingu jeusi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo ni wa ulinganifu mwafaka na unahifadhi utata halisi wa עֲרָפֶל.
