    text: Au “mahali palipowekwa imara ili ukae milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֹה בָנִיתִי
  choice: Hakika nimekujengea
  rationale: Muundo wa kitenzi-jina kisicho na kikomo ukifuatwa na kitenzi kilichokamilika unasisitiza tendo. “Hakika” huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: בֵּית
  choice: nyumba
  rationale: Neno hilo lina maana ya moja kwa moja ya “nyumba.” Ingawa hapa linarejelea hekalu, “nyumba” huhifadhi taswira na uzito wa usemi wa Kiebrania.
- source_word: זְבֻל
  choice: iliyotukuka
  rationale: Neno hili linaweza kuonyesha makao ya juu, adhimu, au yaliyotukuka. Kulitafsiri kama kivumishi cha “nyumba” kunatoa maana kwa njia ya asili bila kurudia wazo la makao.
- source_word: לָךְ
  choice: -ku- katika “nimekujengea”
  rationale: Kiambishi na kiishio cha kutendea vinaonyesha kwamba nyumba imejengwa kwa ajili ya Mungu huku vikihifadhi usemi wa moja kwa moja kwake.
- source_word: מָכוֹן
  choice: mahali palipowekwa imara
  rationale: Neno linaonyesha mahali palipothibitishwa, palipowekwa, au pa kudumu. Tafsiri hii inasisitiza uthabiti bila kulifanya neno lenyewe kuwa “makao,” kwa kuwa wazo la kukaa linafuata.
- source_word: לְשִׁבְתְּךָ
  choice: ukae
  rationale: Mzizi ישׁב unaweza kumaanisha kukaa au kufanya makao; katika muktadha wa hekalu unaweza pia kudokeza kuketi kifalme. “Ukae” huhifadhi kwa kiasi fulani upana huo kuliko ufafanuzi wenye kubana maana.
- source_word: עוֹלָמִים
  choice: milele
  rationale: Wingi huu unasisitiza muda usio na mwisho au wa kudumu. “Milele” ni usemi wa kawaida, wenye hadhi, na ulio wazi katika Kiswahili.
theological_decisions:
- issue: Ikiwa lugha kuhusu hekalu kama mahali Mungu anakaa ipunguzwe ili kuepuka dhana ya kwamba Mungu amefungiwa humo
  choice: Kuhifadhi wazi usemi wa Mungu kukaa humo
  alternative: Kutafsiri kuwa mahali pa jina la Mungu au mahali pa kumwabudu
  rationale: Kiebrania chenyewe kinataja nyumba na mahali pa Mungu kukaa. Tafsiri haipaswi kuingiza katika mstari huu ufafanuzi wa kitheolojia kutoka muktadha mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nimekujengea” ni cha asili zaidi kuliko kurudia kitenzi ili kuonyesha msisitizo. Alama zote za tanbihi zimewekwa katika matini kuu.
