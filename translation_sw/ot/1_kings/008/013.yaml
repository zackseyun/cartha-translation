  text: I have indeed built you an exalted house[b][a], a settled place for you to dwell forever.
translation:
  language: sw
  text: Hakika nimekujengea nyumba iliyotukuka[a], mahali imara pa kukaa kwako milele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyumba ya fahari” au “makao ya juu.” Neno la Kiebrania זְבֻל hurejelea makao yaliyotukuka.
    reason: lexical_alternative
