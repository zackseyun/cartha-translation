base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/051.yaml
  text: For they are your people and your inheritance[a], whom you brought out of Egypt[b], out of the midst of the iron furnace.
translation:
  language: sw
  text: Kwa maana wao ni watu wako na urithi wako[a], ambao uliwatoa Misri, kutoka katika tanuru ya chuma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “milki yako” au “sehemu yako” badala ya “urithi wako.”
    reason: lexical_alternative
  - marker: b
    text: “Tanuru ya chuma” ni sitiari ya Misri kama mahali pa ukandamizaji na mateso makali; linganisha Kumbukumbu la Torati 4:20.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kinaeleza msingi wa ombi la Sulemani katika sala; “Kwa maana” ni kiunganishi cha kawaida na chenye nguvu ya kutoa sababu.
- source_word: עַמְּךָ
  choice: watu wako
  rationale: Ni tafsiri ya moja kwa moja ya jina la agano linalowatambulisha Israeli kuwa watu wa Mungu.
- source_word: וְנַחֲלָתְךָ
  choice: na urithi wako
  rationale: “Urithi” huhifadhi lugha ya Kiebrania ya fungu au milki aliyojitengea Mungu, bila kufifisha uzito wake wa kiagano.
- source_word: הֵם
  choice: wao ni
  rationale: Kiwakilishi huru kimesisitizwa na kinahitaji kitenzi kishirikishi katika Kiswahili.
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: uliowatoa
  rationale: Kiwakilishi rejeshi cha ngeli ya watu kinaunganisha sentensi kwa ufasaha; umbo la usababishi la יצא lina maana ya kuwatoa nje.
- source_word: מִמִּצְרַיִם
  choice: Misri
  rationale: Baada ya “uliowatoa,” Kiswahili cha kawaida hakihitaji kurudia kihusishi “kutoka”; chanzo cha tendo kinaeleweka wazi.
- source_word: מִתּוֹךְ
  choice: kutoka katikati ya
  rationale: Huhifadhi taswira ya kutolewa kutoka ndani kabisa ya mahali au hali fulani.
- source_word: כּוּר הַבַּרְזֶל
  choice: tanuru ya chuma
  rationale: Huhifadhi sitiari halisi ya Kiebrania ya Misri kama mahali pa mateso makali; maelezo yake yametolewa katika tanbihi badala ya kuingizwa katika matini.
theological_decisions:
- issue: Israeli kuitwa “urithi” wa Mungu katika lugha ya agano
  choice: urithi wako
  alternative: milki yako; sehemu yako
  rationale: “Urithi” huhifadhi wazo la fungu au mali ya Mungu lililomo katika נַחֲלָה, bila kuongeza dai la kimadhehebu lisilosemwa na matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa msomaji wa leo lakini unahifadhi lugha ya agano, urudiaji wa wazo la kutoka ndani, na sitiari ya “tanuru ya chuma.”
