  text: basi usikie huko mbinguni[a], mahali pa makao yako, sala yao na dua yao, na uwatendee haki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makao yako.” Usemi wa Kiebrania unamaanisha mahali pa makao palipowekwa imara.
    reason: lexical_alternative
  - marker: b
    text: Au, “usimamie shauri lao” au “uwatetee.” Kwa neno kwa neno, Kiebrania kinasema “ufanye haki/hukumu yao,” nahau ya kuchukua hatua kwa niaba ya shauri lao.
