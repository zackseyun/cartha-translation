lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: basi usikie
  rationale: Kitenzi katika mfululizo huu wa ombi kina nguvu ya dua iliyoelekezwa kwa Mungu. “Basi” huonyesha mwendelezo wa masharti yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: הַשָּׁמַיִם
  choice: huko mbinguni
  rationale: Ingawa umbo la Kiebrania ni “mbingu,” hapa linamaanisha eneo la mbinguni ambako Mungu anakaa. “Huko mbinguni” huhifadhi wazo la mahali bila kuongeza kihusishi cha “kutoka,” ambacho hakijaandikwa wazi.
- source_word: מְכוֹן שִׁבְתְּךָ
  choice: makao yako
  rationale: מָכוֹן huonyesha mahali palipowekwa au imara, na שׁבתך ni kukaa kwako. “Makao yako” ni usemi wa asili na wenye heshima unaobeba wazo la mahali pa kudumu pa kukaa; ufafanuzi wa maana ya uimarifu umewekwa katika tanbihi.
- source_word: תְּפִלָּתָם
  choice: sala yao
  rationale: “Sala” ni neno la kawaida la Kiswahili kwa ombi linaloelekezwa kwa Mungu.
- source_word: תְּחִנָּתָם
  choice: dua yao
  rationale: Neno hili huonyesha ombi la dhati la kuomba fadhili au rehema. “Dua” hulitofautisha kwa kiasi na “sala” huku likibaki wazi kwa wasomaji wa kawaida.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: na uwatendee haki
  rationale: Nahau ya Kiebrania, kwa neno, ni “ufanye hukumu/haki yao,” ikimaanisha kuchukua hatua ya kimahakama kwa niaba yao. “Uwatendee haki” ni Kiswahili cha asili kinachohifadhi maana hiyo.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu makao ya Mungu mbinguni
  choice: Kudumisha kwamba Mungu anasikia “huko mbinguni,” katika “makao” yake
  alternative: usikie kutoka mbinguni, mahali unapoishi
  rationale: Matini hutumia taswira ya sala ya hekalu kuhusu makao ya Mungu mbinguni. Tafsiri haiibadilishi kuwa wazo dhahania wala kudokeza kwamba Mungu amefungiwa katika eneo fulani.
- issue: Maana ya kimahakama ya מִשְׁפָּטָם
  choice: uwatendee haki
  alternative: usimamie shauri lao / uwatetee
  rationale: Chaguo hili huhifadhi ombi la Mungu achukue hatua ya haki kwa niaba yao bila kuamua kimya kimya kwamba lazima matokeo yawe kuwatangaza kuwa hawana hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Huko mbinguni” ni cha kawaida na huzuia sentensi kuwa nzito; “sala” na “dua” zinadumisha tofauti ya maneno mawili ya Kiebrania. Alama zote za tanbihi zimewekwa katika matini.
