  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: sw
  text: Kisha mfalme akageuka[a] na kulibariki kusanyiko lote la Israeli[b], huku kusanyiko lote la Israeli likiwa limesimama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “aliugeuza uso wake”; pia inaweza kutafsiriwa “akageuka.”
    reason: lexical_alternative
  - marker: b
    text: Au “jumuiya yote ya Israeli iliyokusanyika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב ... אֶת־פָּנָיו
  choice: akageuka
  rationale: Kiebrania kinasema kihalisi kwamba mfalme ‘aliugeuza uso wake.’ ‘Akageuka’ ni usemi wa kawaida wa Kiswahili unaoonyesha tendo hilo la kugeuza upande bila kuongeza alikoelekea.
- source_word: וַיְבָרֶךְ
  choice: kulibariki
  rationale: ‘Kubariki’ ndilo neno la kawaida na lenye hadhi kwa ברך katika tukio hili la hadhara; linaweza kujumuisha kutamka baraka bila kulazimisha ufafanuzi huo ndani ya matini.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: kusanyiko lote la Israeli
  rationale: קהל humaanisha watu waliokusanyika kama jumuiya. ‘Kusanyiko’ ni la sasa, linaeleweka kwa urahisi, na linahifadhi maana ya mkutano wa watu.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עֹמֵד
  choice: huku kusanyiko lote la Israeli likiwa limesimama
  rationale: Kirai hiki kinaeleza hali iliyoendelea wakati wa baraka. ‘Huku ... likiwa limesimama’ huwasilisha vizuri tendo la usuli linaloonyeshwa na participio עֹמֵד.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unarudia ‘kusanyiko lote la Israeli’ kama Kiebrania badala ya kutumia kiwakilishi, na ‘likuwa limesimama’ linapatana kisarufi na nomino ya umoja ya kijumla ‘kusanyiko.’
