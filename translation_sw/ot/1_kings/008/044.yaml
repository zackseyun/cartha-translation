id: 1KI.8.44
reference: 1 Kings 8:44
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל אֹ֣יְב֔/וֹ בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֶל יְהוָ֗ה דֶּ֤רֶךְ הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥תִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/044.yaml
  text: When your people go out to battle against their enemy by the way you send them[a], and they pray to Yahweh toward the city that you have chosen and the house that I have built for your name[b],
translation:
  language: sw
  text: Watu wako watakapotoka kwenda vitani kupigana na adui yao, kwa njia utakayowatuma, nao wakimwomba Yahwe kuelekea mji uliouchagua[a] na nyumba niliyoijenga kwa ajili ya jina lako[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa njia/upande wa mji”; yaani, wakielekea mji huo katika sala.'
    reason: lexical_alternative
  - marker: b
    text: “Nyumba” hapa ni hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יֵצֵא
  choice: watakapotoka
  rationale: כִּי huanzisha hali inayoweza kutokea katika mfululizo wa maombi, nayo יֵצֵא ni ‘kutoka.’ Muundo wa ‘watakapotoka’ ni wa kawaida katika Kiswahili na unaendeleza maana ya ‘wakati/ikiwa watatoka’ bila kuifanya sababu.
- source_word: עַמְּךָ
  choice: watu wako
  rationale: Hii ni istilahi ya kawaida ya agano inayomtaja Israeli kuwa watu wa Mungu.
- source_word: לַמִּלְחָמָה עַל אֹיְבוֹ
  choice: kwenda vitani kupigana na adui yao
  rationale: ‘Kwenda vitani’ ni Kiswahili cha asili kwa kwenda kwenye vita, na ‘kupigana na’ huwasilisha nguvu ya עַל katika muktadha huu. ‘Adui yao’ inakubaliana kwa kawaida na nomino ya jamii ‘watu,’ ingawa kiambishi cha Kiebrania ni umoja.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: kwa njia utakayowatuma
  rationale: Uamuzi huu unahifadhi taswira halisi ya דֶּרֶךְ, ‘njia,’ na pia wazo kwamba Mungu ndiye anayewatuma katika safari hiyo ya vita.
- source_word: וְהִתְפַּלְלוּ אֶל יְהוָה
  choice: nao wakamwomba Yahwe
  rationale: התפלל ni kitenzi cha kawaida cha kusali au kuomba. ‘Kumwomba Yahwe’ ni usemi wa asili wa Kiswahili unaohifadhi wazi anayeelekezewa sala.
- source_word: דֶּרֶךְ הָעִיר
  choice: wakielekea mji
  rationale: Katika kifungu hiki דֶּרֶךְ huonyesha upande ambao waombaji wanaelekea. ‘Wakielekea mji’ ni wazi na ya kawaida bila kupoteza taswira ya mwelekeo.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: mji uliouchagua
  rationale: Hufuatilia dai la Kiebrania kwamba Mungu aliuchagua mji, bila kuongeza hapa kusudi la uchaguzi huo.
- source_word: וְהַבַּיִת
  choice: na nyumba
  rationale: בַּיִת ni ‘nyumba.’ Ingawa hapa inamaanisha hekalu, kuhifadhi ‘nyumba’ kunadumisha usemi muhimu wa kibiblia.
- source_word: אֲשֶׁר בָּנִתִי לִשְׁמֶךָ
  choice: niliyoijenga kwa ajili ya jina lako
  rationale: ‘Kwa ajili ya jina lako’ huhifadhi usemi wa Kiebrania unaohusiana na uwepo, heshima, na sifa ya Mungu, badala ya kuufafanua kupita kiasi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Kiebrania kina jina binafsi la Mungu, YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya הַבַּיִת katika muktadha wa hekalu
  choice: nyumba
  alternative: hekalu
  rationale: Mrejeo ni hekalu, lakini Kiebrania chenyewe kinasema ‘nyumba.’ Uamuzi huu unahifadhi usemi ‘nyumba ... kwa ajili ya jina lako,’ huku tanbihi ikifafanua mrejeo.
- issue: Mwelekeo wa sala
  choice: wakielekea mji ... na nyumba
  alternative: wakiomba kwa njia ya mji
  rationale: דֶּרֶךְ hapa inaonyesha upande au mwelekeo wa sala, si kwamba mji ni mpatanishi wa sala. Tafsiri inaacha wazi umuhimu wa kitheolojia wa mwelekeo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umeachwa wazi kuwa sehemu ya ombi linaloendelea katika mstari unaofuata; ndiyo sababu mstari unaishia kwa koma.
