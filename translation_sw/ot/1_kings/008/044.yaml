review_pass:
  verdict: revise
  source_fidelity: Draft accurately represents the people going out to battle against an enemy, being sent by God, praying to Yahwe, and the chosen city and house. However, the construction "wakamwomba ... wakielekea" can suggest physical travel toward the city and house, rather than the specified direction of prayer. "Wakimwomba ... kuelekea" more directly reflects the Hebrew prayer-orientation phrase.
  naturalness: The wording is generally standard and dignified Kiswahili. Recasting the prayer clause with "wakimwomba Yahwe kuelekea" makes the conditional sequence smoother and avoids the potentially awkward implication that the people are moving toward both a city and a building.
  terminology: '"Watu wako," "vitani," "Yahwe," "mji," and "nyumba ... kwa ajili ya jina lako" are appropriate. Retaining "nyumba" faithfully reflects בַּיִת; the footnote appropriately identifies its temple referent. The divine-name rendering follows the supplied audit trail.'
  issues:
  - severity: medium
    issue: The phrase "nao wakamwomba Yahwe wakielekea mji ... na nyumba" is ambiguous in Kiswahili.
    rationale: '"Wakielekea" commonly describes moving/traveling toward a destination. The Hebrew specifies the direction in which prayer is made. Placing "kuelekea" directly with the prayer verb more clearly conveys orientation in prayer, without altering the meaning.'
  revised_text: Watu wako watakapotoka kwenda vitani kupigana na adui yao, kwa njia utakayowatuma, nao wakimwomba Yahwe kuelekea mji uliouchagua[a] na nyumba niliyoijenga kwa ajili ya jina lako[b],
  revised_footnotes:
  - marker: a
    text: 'Kiebrania: “kwa njia/upande wa mji”; yaani, wakielekea mji huo katika sala.'
    reason: lexical_alternative
  - marker: b
    text: “Nyumba” hapa ni hekalu.
    reason: lexical_alternative
  revision_rationale: Revision is limited to clarifying that the city and house indicate the direction of prayer, as in the Hebrew דֶּרֶךְ הָעִיר. The verse remains an unfinished conditional petition and therefore retains its final comma.
