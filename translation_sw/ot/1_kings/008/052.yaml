  yaml_path: translation/ot/1_kings/008/052.yaml
  text: that your eyes may be open to the plea of your servant and to the plea of your people Israel[b][a], to listen to them whenever they call to you.
translation:
  language: sw
  text: ili macho yako yawe wazi kwa maombi ya mtumishi wako na kwa maombi ya watu wako Israeli,[a] ili uwasikilize[b] kila wanapokuita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dua.” Neno la Kiebrania linamaanisha ombi la dhati la kutaka fadhili au rehema.
    reason: lexical_alternative
  - marker: b
    text: Au “uwasikie” au “uwaitikie.” Kitenzi cha Kiebrania kinaweza kumaanisha kusikia, kusikiliza, au kuitikia kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: ili ... yafumbuke
  rationale: Infinitivi yenye ל inaendeleza ombi la Sulemani; kishazi cha kusudi kinatoa Kiswahili cha kawaida na kuhifadhi nguvu ya ombi.
- source_word: עֵינֶיךָ פְתֻחוֹת
  choice: macho yako yafumbuke
  rationale: Huhifadhi sitiari ya Kiebrania kuhusu Mungu kuwa makini na tayari kuitikia, bila kuibadili kuwa maelezo yasiyo ya kisitiari.
- source_word: תְּחִנַּת
  choice: dua
  rationale: Katika muktadha huu neno linamaanisha ombi la dhati la kutaka fadhili au rehema; “dua” ni neno la sasa, lenye heshima, na linaloeleweka kwa wasomaji wengi wa Kiswahili.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Hili ni jina la unyenyekevu analotumia Sulemani mbele za Mungu; “mtumishi” linafaa zaidi kuliko “mtumwa” katika muktadha huu.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: watu wako Israeli
  rationale: Hutambulisha Israeli kuwa watu wa Mungu kwa mpangilio wa kawaida wa Kiswahili.
- source_word: לִשְׁמֹעַ אֲלֵיהֶם
  choice: ili uwasikilize
  rationale: שׁמע inaweza kuwa kusikia, kusikiliza, au kuitikia. “Uwasikilize” huonyesha usikivu wa makusudi huku ikiacha wazi kama msisitizo unafikia kuitikia.
- source_word: בְּכֹל קָרְאָם אֵלֶיךָ
  choice: kila wanapokuita
  rationale: בְּכֹל pamoja na umbo la kitenzi hapa lina maana ya wakati au kila tukio; tafsiri hii ni ya kawaida na aminifu.
theological_decisions:
- issue: 'Lugha ya kisitiari inayompa Mungu viungo vya mwili: “macho yako yafumbuke”'
  choice: Kuhifadhi sitiari katika matini kuu
  alternative: “ili uwe makini”
  rationale: Kiebrania kinatumia wazi taswira ya macho kueleza usikivu na fadhili za Mungu. Kuihifadhi hudumisha uzito wa kifasihi na kitheolojia bila kulazimisha dai kwamba Mungu ana mwili.
- issue: Upeo wa maana ya שׁמע katika ombi
  choice: “uwasikilize”
  alternative: “uwasikie” au “uwaitikie”
  rationale: “Uwasikilize” huhifadhi uwezekano wa kusikia kwa makini bila kufunga maana moja kwa moja kuwa kuitikia, hivyo mvutano wa kimaana unabaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ombi na sitiari ya macho umehifadhiwa; “dua” limetumiwa kwa ombi la dhati, huku tanbihi ikitoa ufafanuzi mpana.
