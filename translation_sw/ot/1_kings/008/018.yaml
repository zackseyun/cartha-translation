base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/018.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name, you did well that it was in your heart.’
translation:
  language: sw
  text: Lakini Yahwe alimwambia Daudi, baba yangu, “Kwa kuwa ilikuwa moyoni mwako kujenga nyumba[a] kwa ajili ya jina langu, ulifanya vyema, kwa kuwa ilikuwa moyoni mwako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu.” Kiebrania kinasema kihalisi, “kujenga nyumba kwa ajili ya jina langu.”
    reason: Neno בַּיִת maana yake ya moja kwa moja ni “nyumba,” lakini katika muktadha huu linarejelea hekalu.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: alimwambia
  rationale: Kitenzi cha masimulizi אמר pamoja na kihusishi אֶל kinaelezwa kwa Kiswahili cha kawaida kama “alimwambia,” kikitambulisha usemi wa moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi unaoeleweka katika Kiswahili badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: דָּוִד אָבִי
  choice: Daudi baba yangu
  rationale: Kiambishi cha nafsi ya kwanza umoja katika אָבִי kinaonyesha kwamba Sulemani anamwita Daudi baba yake.
- source_word: יַעַן אֲשֶׁר
  choice: kwa kuwa
  rationale: Jozi hii ya chembe huanzisha sababu; “kwa kuwa” ni ya asili, yenye heshima, na inafaa katika usemi huu.
- source_word: הָיָה עִם לְבָבְךָ
  choice: ilikuwa moyoni mwako
  rationale: Hifadhi sitiari ya Kiebrania ya moyo kama mahali pa kusudi au tamanio bila kuifanya sentensi ya Kiswahili kuwa ngumu.
- source_word: לִבְנוֹת בַּיִת
  choice: kujenga nyumba
  rationale: בַּיִת maana yake ya moja kwa moja ni “nyumba.” Katika muktadha inarejelea hekalu, lakini “nyumba” huhifadhi nahau ya chanzo; tanbihi inaonyesha maana ya kimuktadha.
- source_word: לִשְׁמִי
  choice: kwa ajili ya jina langu
  rationale: Tafsiri hii huhifadhi usemi wa kitheolojia unaohusianisha nyumba takatifu na jina la Mungu.
- source_word: הֱטִיבֹתָ
  choice: ulifanya vyema
  rationale: Hifili ya יטב hapa inaonyesha kibali; “ulifanya vyema” ni fupi, ya kawaida, na ya heshima.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: kwa kuwa jambo hilo lilikuwa moyoni mwako
  rationale: כִּי ina nguvu ya kutoa sababu au ufafanuzi. “Kwa kuwa” huhifadhi nguvu hiyo, na “jambo hilo” hurejelea wazi kusudi lililotajwa bila kufuta marudio ya “moyoni mwako.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: “Yahwe” huhifadhi jina binafsi la Mungu kwa umbo linalofaa Kiswahili, badala ya kulibadilisha kuwa cheo; “Yehova” ni unukuzi mwingine wa kimapokeo.
- issue: Ikiwa בַּיִת itafsiriwe “nyumba” au “hekalu”
  choice: nyumba
  alternative: hekalu
  rationale: Neno la Kiebrania linasema “nyumba,” ingawa kitu kinachorejelewa ni hekalu. Maandishi yanahifadhi taswira ya chanzo, huku tanbihi ikifafanua maana ya kimuktadha.
- issue: Maana ya kibali katika הֱטִיבֹתָ כִּי הָיָה עִם לְבָבֶךָ
  choice: ulifanya vyema kwa kuwa jambo hilo lilikuwa moyoni mwako
  alternative: ilikuwa vyema kwamba ulikuwa na nia hiyo
  rationale: Tafsiri iliyochaguliwa huhifadhi usemi unaomwelekea Daudi moja kwa moja na uhusiano wa sababu au ufafanuzi wa כִּי, bila kudai kwamba Daudi ndiye aliyejenga hekalu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya “moyoni mwako” yamehifadhiwa kwa sababu ni sehemu ya mkazo wa maandishi ya Kiebrania. Alama ya tanbihi imewekwa baada ya “nyumba,” ambako maelezo yake yanahusika.
