  - marker: b
    text: Au, “uwarejeshe.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, wale waliowatangulia ambao Mungu aliwapa nchi hiyo.
    reason: cultural_note
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: usikie ukiwa mbinguni
  rationale: Kiebrania hakina kihusishi wazi hapa; usemi huu unataja mbingu kuwa makao ya Mungu. Kiswahili cha sasa kinahitaji ‘ukiwa’ ili maana ya kusikia akiwa mbinguni iwe ya asili bila kuifanya mbingu kuwa kitu kinachosikiwa.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: uwasamehe ... dhambi yao
  rationale: Kitenzi סלח humaanisha kusamehe dhambi, na חטאת ya umoja hapa ni kosa la watu kwa maana ya jumla. Muundo huu ni wa kawaida katika Kiswahili na unaweka wazi kwamba watu ndio wanaosamehewa dhambi yao.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: watu wako Israeli
  rationale: Tafsiri hii inahifadhi utambulisho wa Israeli kuwa watu wa Mungu bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: וַהֲשֵׁבֹתָם
  choice: uwarudishe
  rationale: Hifili ya שוב ina maana ya kusababisha warudi. ‘Uwarudishe’ huhifadhi maana hiyo ya kusababisha kurudi kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: אֶל הָאֲדָמָה
  choice: katika nchi
  rationale: Katika muktadha wa ahadi na kurudishwa kwa Israeli, אֲדָמָה linamaanisha nchi waliyopewa, si udongo tu.
- source_word: אֲשֶׁר נָתַתָּ לַאֲבוֹתָם
  choice: uliyowapa baba zao
  rationale: ‘Baba zao’ hufuata lugha ya Kiebrania na kuhifadhi rejeo la wanaume wa zamani waliohusishwa na ahadi ya nchi; tanbihi inaeleza maana yake kwa msomaji wa sasa.
theological_decisions:
- issue: Maana ya לַאֲבוֹתָם katika lugha ya ahadi ya nchi
  choice: baba zao
  alternative: mababu zao / wazee wao wa kale
  rationale: ‘Baba zao’ huhifadhi umbo la kiume na lugha ya uhusiano wa kizazi katika Kiebrania, huku tanbihi ikibainisha kwamba hapa ni wale waliotangulia ambao walipewa nchi.
- issue: Aina ya kurudishwa katika וַהֲשֵׁבֹתָם
  choice: uwarudishe katika nchi
  alternative: uwarejeshe katika nchi
  rationale: Muktadha unaonyesha kurudi halisi katika nchi baada ya hukumu, si urejesho wa jumla tu; tafsiri hii inalinda maana ya mahali bila kuingiza mfumo mwingine wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Basi’ linaunganisha ombi hili na sharti lililotangulia; vitenzi vya hali ya kutakia/kuomba vinaendeleza sauti ya sala. Alama zote za tanbihi zimewekwa mara moja mahali zinapohusika.
