  text: then may you hear in heaven and forgive the sin of your people Israel[c][b][a], and bring them back to the land that you gave to their fathers.
translation:
  language: sw
  text: basi usikie ukiwa mbinguni[a], uwasamehe watu wako Israeli dhambi yao, na uwarudishe[b] katika nchi uliyowapa baba zao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usikie kutoka mbinguni.”
