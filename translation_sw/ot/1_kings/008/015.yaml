base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/015.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it with his hand, saying,”
translation:
  language: sw
  text: Naye akasema, “Abarikiwe Yahwe[a], Mungu wa Israeli, aliyesema kwa kinywa chake kwa Daudi, baba yangu, na kwa mkono wake ametimiza, akisema,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Asifiwe Yahwe.” Fomula ya Kiebrania ya baraka hutafsiriwa kimapokeo “Abarikiwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Abarikiwe
  rationale: Ni umbo la baraka linalomtaja Mungu kuwa mwenye kubarikiwa. Linahifadhi lugha rasmi ya Kiebrania, huku tanbihi ikionyesha tafsiri ya maana iliyo ya kawaida zaidi katika Kiswahili, ‘Asifiwe.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja badala ya kubadilishwa na cheo kama ‘Bwana.’ Umbo ‘Yahwe’ ni uandishi wa kawaida wa jina hilo katika Kiswahili.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania unaomhusianisha Mungu na Israeli.
- source_word: אֲשֶׁר דִּבֶּר בְּפִיו אֵת דָּוִד אָבִי
  choice: aliyesema kwa kinywa chake na Daudi baba yangu
  rationale: ‘Kwa kinywa chake’ limehifadhiwa ili kudumisha ulinganifu wa makusudi na ‘kwa mkono wake.’ Kihusishi ‘na’ kinahifadhi uwezekano wa maana ya kusema na Daudi, bila kulazimisha tafsiri finyu kuliko Kiebrania.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: na kwa mkono wake ametimiza
  rationale: Nahau ya mkono imehifadhiwa kwa sababu inatofautisha ahadi iliyotamkwa na tendo lililoitekeleza. Kitenzi hakina yambwa lililotajwa wazi katika Kiebrania, kwa hiyo tafsiri pia hailiongezi.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni usemi wa kawaida unaoanzisha maneno yanayofuata katika mstari unaofuata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. Kulihamisha kama ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya fomula בָּרוּךְ inapomhusu Mungu
  choice: Abarikiwe
  alternative: Asifiwe
  rationale: ‘Abarikiwe’ huhifadhi umbo rasmi la baraka, lakini ‘Asifiwe’ huonyesha kwa uwazi zaidi kazi ya fomula hiyo inapomhusu Mungu. Tofauti hiyo imewekwa katika tanbihi bila kuamua mvutano wa kileksia kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Nahau sambamba za ‘kinywa’ na ‘mkono’ zimehifadhiwa kwa sababu ni muhimu kwa muundo na maana ya mstari.
