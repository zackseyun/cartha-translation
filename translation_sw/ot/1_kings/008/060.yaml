  text: ili watu wa mataifa yote duniani wajue kwamba BWANA ndiye Mungu; hakuna mwingine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן דַּעַת
  choice: ili ... wajue
  rationale: Kishazi hiki kinaonyesha kusudi; muundo wa Kiswahili 'ili ... wajue' ni wa kawaida na unahifadhi maana hiyo.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: watu wote wa dunia
  rationale: Neno עַמִּים hapa hurejelea jamii au mataifa ya dunia kwa upana. 'Watu wote wa dunia' ni ya asili katika Kiswahili na haibani maana kuwa serikali au nchi pekee.
- source_word: יְהוָה
  choice: BWANA
  rationale: Inafuata desturi pana ya tafsiri za Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa herufi kubwa, bila kuongeza matamshi yasiyoandikwa kikamilifu katika maandishi ya Kiebrania.
- source_word: הוּא הָאֱלֹהִים
  choice: ndiye Mungu
  rationale: Kibainishi cha Kiswahili '-ndiye' kinawasilisha msisitizo wa kiwakilishi הוּא kwa njia ya kawaida na yenye hadhi.
- source_word: אֵין עוֹד
  choice: hakuna mwingine
  rationale: Huhifadhi dai la kipekee kwa ufupi, huku 'mwingine' ikirejelea Mungu mwingine kwa kueleweka kutokana na muktadha.
theological_decisions:
- issue: Msisitizo wa הוּא katika dai kwamba YHWH ni Mungu
  choice: BWANA ndiye Mungu
  alternative: BWANA ni Mungu
  rationale: '''Ndiye'' huhifadhi msisitizo wa Kiebrania bila kuongeza ufafanuzi wa kimadhehebu.'
- issue: Upekee unaodaiwa na אֵין עוֹד
  choice: hakuna mwingine
  alternative: hakuna Mungu mwingine
  rationale: Toleo fupi linafuata ukamilifu wa usemi wa Kiebrania na kuacha rejeleo lake lieleweke kutoka kishazi kilichotangulia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Sentensi inahifadhi muundo wa kusudi, msisitizo wa utambulisho, na dai la upekee la maandishi ya Kiebrania.
