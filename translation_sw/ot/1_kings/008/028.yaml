  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָֽ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֧ר עַבְדְּ/ךָ֛ מִתְפַּלֵּ֥ל לְ/פָנֶ֖י/ךָ הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/028.yaml
  text: Yet turn toward the prayer of your servant and to his plea for favor[a], O Yahweh my God[b], to hear the cry and the prayer that your servant is praying before you today.
translation:
  language: sw
  text: Lakini ugeukie sala ya mtumishi wako na dua yake[a], Ee Yahwe, Mungu wangu, ili usikie kilio[b] na sala ambayo mtumishi wako anasali mbele zako leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ombi lake la dhati.” Neno la Kiebrania linamaanisha ombi la dhati la kuomba rehema au fadhili.
    reason: lexical_alternative
  - marker: b
    text: Au, “kilio kikuu.” Neno la Kiebrania linaweza kumaanisha kilio au sauti kubwa; hapa linaeleweka kuwa kilio kinachoelekezwa kwa Mungu katika sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: Lakini ugeukie
  rationale: Kitenzi פנה kimsingi humaanisha ‘kugeuka’ au ‘kuelekea.’ ‘Ugeukie’ kinahifadhi taswira ya Kiebrania ya Mungu kuelekeza uangalifu wake kwenye sala; ‘lakini’ linaonyesha utofautishaji wa kiasi na mstari uliotangulia.
- source_word: תְּפִלַּת / הַתְּפִלָּה
  choice: sala
  rationale: ‘Sala’ ni neno la kawaida na lenye heshima kwa תפלה; kurudiwa kwake kunahifadhi urudiaji na ulinganifu wa Kiebrania.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika namna ya mfalme kujinyenyekeza mbele za Mungu, עבד hapa ni ‘mtumishi’ kuliko neno linalosisitiza hali ya utumwa. Tafsiri hiyo imetumiwa kwa namna ileile katika sehemu zote mbili.
- source_word: תְּחִנָּתוֹ
  choice: dua yake ya kuomba fadhili
  rationale: תחנה ni ombi la dhati la kuomba rehema au fadhili. Kirai hiki kinaeleza maana hiyo kwa Kiswahili cha sasa bila kupoteza uzito wa ombi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa namna inayotumiwa kwa kawaida katika Kiswahili badala ya kubadilishwa na cheo.
- source_word: אֱלֹהָי
  choice: Mungu wangu
  rationale: Hii ni tafsiri ya moja kwa moja ya umilikishi katika wito unaoelekezwa kwa Mungu.
- source_word: לִשְׁמֹעַ
  choice: ili usikie
  rationale: Muundo wa ‘ili’ unaonyesha kusudi la ombi la awali, na ‘usikie’ linatafsiri maana ya msingi ya שמע.
- source_word: הָרִנָּה
  choice: kilio
  rationale: רנה linaweza kumaanisha kilio au sauti kubwa. Katika muktadha wa sala na dua, ‘kilio’ kinafaa bila kulazimisha wazo la wimbo au shangwe.
- source_word: מִתְפַּלֵּל
  choice: anasali
  rationale: Kauli ya wakati wa sasa inadokeza tendo linaloendelea wakati Sulemani anaposema maneno haya.
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Tafsiri hii ni ya karibu na maandishi ya Kiebrania na ni ya kawaida katika muktadha wa ibada na sala.
- source_word: הַיּוֹם
  choice: leo
  rationale: ‘Leo’ ni tafsiri ya kawaida na ya moja kwa moja ya הַיּוֹם.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la Mungu יהוה moja kwa moja. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha na cheo, huku ‘Yehova’ likiwa umbo jingine la kimapokeo.
- issue: Maana ya רנה katika muktadha wa sala
  choice: kilio
  alternative: kilio kikuu, sauti ya shangwe, au wimbo
  rationale: Neno lenyewe lina upana wa maana, lakini hapa ulinganifu wake na sala na dua unaelekeza kwenye kilio kinachoelekezwa kwa Mungu. Tanbihi inahifadhi uwezekano wa maana ya sauti kubwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Ugeukie’ linahifadhi taswira halisi ya Kiebrania, na miundo ya sala imewekwa kwa lugha ya asili bila kuondoa mvutano wa ombi la mwanadamu kwa Mungu.
