lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: walipofika
  rationale: Kitenzi בוא katika mfululizo wa simulizi kinaonyesha kuja au kufika; hapa “walipofika” ni Kiswahili cha asili kinachounganisha tukio hili na tendo kuu linalofuata bila kutaja mahali pasipotajwa katika mstari.
- source_word: כֹּל
  choice: wote
  rationale: Hukadiria kundi lote la wazee wa Israeli na kwa kawaida hufuata nomino katika Kiswahili.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: Wazee wa Israeli
  rationale: Ni mlolongo wa umilikaji unaowataja viongozi wanaotambulika wa Israeli; “Wazee wa Israeli” ni usemi wa kawaida, wazi na wenye hadhi.
- source_word: וַיִּשְׂאוּ
  choice: wakalibeba
  rationale: נשׂא inaweza kumaanisha kuinua au kubeba. Katika muktadha wa kulihamisha Sanduku, “kubeba” huwasilisha tendo lote kwa Kiswahili cha kawaida, huku kiambishi “-ka-” kikidumisha mfululizo wa simulizi.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Nomino hii ya wingi yenye uainisho inarejelea kundi maalumu la makuhani; muktadha wa Kiswahili unaruhusu uainisho huo bila neno la ziada.
- source_word: אֵת הָאָרוֹן
  choice: Sanduku
  rationale: Nomino yenye uainisho inarejelea Sanduku linalojulikana katika muktadha. Herufi kubwa husaidia kuonyesha kuwa ni Sanduku maalumu, bila kuongeza “la Agano,” maneno ambayo hayapo katika mstari huu.
theological_decisions:
- issue: Utambulisho wa הָאָרוֹן
  choice: Kutafsiri “Sanduku” na kufafanua muktadha katika tanbihi
  alternative: “Sanduku la Agano” katika maandishi makuu
  rationale: Mstari wenyewe unasema tu “Sanduku.” Tafsiri haiongezi jina kamili katika maandishi, ingawa muktadha unaonyesha wazi kuwa ni Sanduku la Agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “walipofika ... wakalibeba” ni wa asili katika simulizi la Kiswahili na unaepusha urudiaji mzito wa “na ... na,” huku ukiendeleza mpangilio wa matukio wa Kiebrania. Alama zote za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
