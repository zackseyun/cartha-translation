  text: Wazee wote wa Israeli wakaja, na makuhani wakalibeba[a] Sanduku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “wakaliinua” au “wakalibeba.”
