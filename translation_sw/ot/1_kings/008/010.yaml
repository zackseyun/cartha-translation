source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ וְ/הֶ/עָנָ֥ן מָלֵ֖א אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/010.yaml
  text: And when the priests came out from the holy place[a], the cloud filled the house of Yahweh.
translation:
  language: sw
  text: Ikawa makuhani walipotoka mahali patakatifu[a], wingu likaijaza nyumba ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “patakatifu,” au “Mahali Patakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: Ikawa ... walipotoka
  rationale: Muundo huu unaonyesha mpito wa simulizi pamoja na wakati wa tendo, bila kuifanya sentensi kuwa nzito isivyo lazima.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya nomino hii ya wingi.
- source_word: מִן הַקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Neno קֹדֶשׁ hapa linamaanisha eneo takatifu walikotoka makuhani; tafsiri hii ni wazi huku ikihifadhi uwezekano wa kulielewa kama patakatifu au Patakatifu.
- source_word: וְהֶעָנָן מָלֵא
  choice: wingu likaijaza
  rationale: Muundo wa simulizi unaendelezwa kwa kitenzi cha wakati uliopita; kiambishi cha yambwa kinaonyesha wazi kwamba kilichojazwa ni nyumba.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi taswira halisi ya hekalu, na Yahwe huwakilisha jina la agano יהוה badala ya kulibadili kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina lenyewe la Mungu, si cheo; “Yahwe” hulihifadhi jina hilo katika umbo linalotumika kwa kawaida katika Kiswahili.
- issue: Maana ya הַקֹּדֶשׁ katika mpangilio wa hekalu
  choice: mahali patakatifu
  alternative: Patakatifu
  rationale: Maandishi yanaweza kurejelea eneo takatifu kwa ujumla au kulitumika kama jina la kiufundi la sehemu ya hekalu; tafsiri kuu haifungi maana kwa mojawapo bila ulazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya simulizi ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Ikawa” huhifadhi ladha ya simulizi la Kiebrania bila kutumia muundo mrefu, na “likaijaza” huendeleza mfuatano wa matukio kwa kawaida.
