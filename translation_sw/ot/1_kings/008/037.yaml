translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa orodha na mkato wa mwisho umehifadhiwa kwa kuwa sentensi inaendelea katika mstari unaofuata. Viwakilishi vya umoja katika sehemu ya adui vimehifadhiwa ili kutotatua kimyakimya rejeo la Kiebrania.
