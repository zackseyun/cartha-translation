source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִ֠הְיֶה שִׁדָּפ֨וֹן יֵרָק֜וֹן אַרְבֶּ֤ה חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אֹיְב֖/וֹ בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע כָּֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/037.yaml
  text: If there is famine in the land[a], if there is pestilence, blight, mildew, locust, or caterpillar; if his enemy besieges him in the land of his gates; whatever plague[b], whatever sickness—
translation:
  language: sw
  text: Ikiwa kutakuwa na njaa nchini, ikiwa kutakuwa na tauni, mnyauko wa mimea, ukungu wa mimea, nzige au viwavi[a]; ikiwa adui yake atamzingira katika nchi ya miji yake[b]; pigo lolote, ugonjwa wowote—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aina ya nzige wanaokula mazao”; neno la Kiebrania huenda likamaanisha kwa upana zaidi nzige anayeteketeza mimea, au hatua au aina fulani ya nzige.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “katika nchi ya malango yake.” Hapa “malango” yanawakilisha miji au makazi ya nchi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: njaa
  rationale: Katika orodha ya majanga, neno hili linamaanisha njaa kubwa iliyoenea, si hisia ya kawaida ya kuwa na njaa.
- source_word: דֶּבֶר
  choice: tauni
  rationale: Hurejelea ugonjwa wa kuambukiza unaoenea na kuua; “tauni” ni neno la kawaida la Kiswahili katika muktadha huu na linatofautishwa na נֶגַע iliyo pana zaidi.
- source_word: שִׁדָּפוֹן
  choice: mnyauko wa mimea
  rationale: Hueleza kuharibika kwa mazao kwa kukauka au kwa upepo wenye joto; tafsiri hii inaeleweka kwa urahisi katika orodha ya majanga ya kilimo.
- source_word: יֵרָקוֹן
  choice: ukungu
  rationale: Katika muktadha wa kilimo, neno hili hueleza hali au ugonjwa wa mimea unaoharibu mazao, kwa desturi ukitafsiriwa kama mildew.
- source_word: אַרְבֶּה
  choice: nzige
  rationale: Hili ndilo neno la kawaida la nzige; umoja wa Kiebrania umetumiwa kwa maana ya kundi au aina kwa ujumla.
- source_word: חָסִיל
  choice: viwavi
  rationale: Neno hili hurejelea wadudu wanaokula mazao, lakini aina kamili haijulikani; “viwavi” inafaa katika matini, huku tanbihi ikihifadhi uwezekano wa kuwa aina au hatua fulani ya nzige.
- source_word: כִּי יִהְיֶה ... כִּי יָצַר לוֹ אֹיְבוֹ
  choice: ikiwa adui yake atamzingira
  rationale: Kitenzi צור katika muundo huu kina maana ya kumfungia mtu kwa kumzunguka kijeshi, yaani kumzingira.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: katika nchi ya malango yake
  rationale: Tafsiri hii inahifadhi taswira halisi ya “malango,” ambayo kwa matumizi ya kimajazi humaanisha miji au makazi yenye malango; maana hiyo imefafanuliwa katika tanbihi.
- source_word: כָּל נֶגַע
  choice: pigo lolote
  rationale: נֶגַע ni neno pana linaloweza kumaanisha pigo, dhiki au tauni; “pigo lolote” huhifadhi upana wake na nguvu ya כָּל.
- source_word: כָּל מַחֲלָה
  choice: ugonjwa wowote
  rationale: Ni neno la jumla kwa maradhi; “ugonjwa wowote” ni Kiswahili cha kawaida na huhifadhi tofauti yake na “pigo lolote.”
