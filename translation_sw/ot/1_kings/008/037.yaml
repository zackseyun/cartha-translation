    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “katika nchi ya malango yake.” Hapa “malango” yanawakilisha miji au makazi ya nchi hiyo.
    reason: lexical_alternative
  revision_rationale: The revision improves ordinary Swahili clarity for the plant disease and the gates/cities metonymy while retaining the Hebrew’s scope, sequence, singular possessives, and unfinished sentence structure. Footnote anchors remain correctly attached to viwavi and miji.
