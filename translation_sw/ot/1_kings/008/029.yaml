base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/029.yaml
  text: that your eyes may be open toward this house night and day[a], toward the place of which you said, ‘My name will be there,’ to hear the prayer that your servant prays toward this place.
translation:
  language: sw
  text: ili macho yako yawe wazi kuelekea nyumba hii usiku na mchana, kuelekea mahali uliposema, ‘Jina langu litakuwa humo’[a], ili uisikie sala ambayo mtumishi wako anaomba akielekea mahali hapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Jina langu litakuwa humo’ ni lugha ya hekalu inayoonyesha kwamba Mungu amelichagua mahali hapa lihusishwe naye kwa namna ya pekee, ikidokeza uwepo wake wa kiagano bila kuifanya kauli hiyo imaanishe jambo hilo pekee.
    reason: Ufafanuzi wa istilahi muhimu ya kiteolojia bila kuibadili katika matini kuu.
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶךָ פְתֻחוֹת
  choice: ili macho yako yawe wazi
  rationale: Muundo wa kusudi/matokeo umetafsiriwa kwa ‘ili’; ‘macho yako yawe wazi’ huhifadhi taswira ya Kiebrania ya Mungu kutazama kwa uangalifu bila kuibadili kuwa maelezo ya kufasiri.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: kuelekea nyumba hii
  rationale: אֶל huonyesha mwelekeo. ‘Nyumba’ huhifadhi lugha ya hekalu katika sala ya Sulemani.
- source_word: לַיְלָה וָיוֹם
  choice: usiku na mchana
  rationale: Huhifadhi msemo wa Kiebrania unaodokeza uangalizi wa daima na ni Kiswahili cha kawaida.
- source_word: אֲשֶׁר אָמַרְתָּ יִהְיֶה שְׁמִי שָׁם
  choice: uliposema, ‘Jina langu litakuwa humo’
  rationale: ‘Jina langu’ huhifadhi istilahi muhimu ya Kiebrania badala ya kuifasiri moja kwa moja kuwa ‘uwepo wangu’; ‘humo’ hurejelea mahali palipotajwa.
- source_word: לִשְׁמֹעַ אֶל הַתְּפִלָּה
  choice: ili uisikie sala
  rationale: Infinitivu inaonyesha kusudi. ‘Kuisikia sala’ ni usemi wa moja kwa moja unaobeba pia wazo la kuisikiliza kwa makini.
- source_word: אֲשֶׁר יִתְפַּלֵּל עַבְדְּךָ
  choice: ambayo mtumishi wako anaomba
  rationale: ‘Mtumishi wako’ inafaa kwa kauli ya unyenyekevu mbele za Mungu. Wakati wa sasa wa kawaida unaonyesha sala inayotolewa au itakayotolewa bila kulazimisha tukio moja tu la wakati ujao.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: akielekea mahali hapa
  rationale: Huhifadhi mwelekeo wa mwombaji kuelekea mahali pa hekalu, unaoonyeshwa na אֶל.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu macho ya Mungu kuwa wazi
  choice: macho yako yawe wazi
  alternative: uiangalie nyumba hii kwa makini
  rationale: Tafsiri huhifadhi taswira ya mwili iliyopo katika Kiebrania na haipunguzi nguvu yake ya kishairi na kiteolojia kuwa dhana ya jumla.
- issue: Maana ya ‘Jina langu litakuwa humo’
  choice: Kuhifadhi kauli ‘Jina langu litakuwa humo’ katika matini kuu
  alternative: uwepo wangu utakuwa humo; nitakaa humo
  rationale: Kiebrania kinasema wazi ‘jina langu.’ Kauli hiyo inahusisha uteuzi na uwepo wa Mungu kwa msingi wa agano, lakini tafsiri haipaswi kuifungia katika ufafanuzi mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa ‘kuelekea’ na ‘mahali’ umehifadhiwa kwa sababu ni sehemu ya msisitizo wa matini kuhusu hekalu na mwelekeo wa sala.
