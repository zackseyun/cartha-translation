  text: כִּ֣י יֶֽחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֤וּ/ם שֹֽׁבֵי/הֶם֙ אֶל אֶ֣רֶץ הָ/אוֹיֵ֔ב רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/046.yaml
  text: When they sin against you—for there is no one who does not sin—and you become angry with them and give them over to an enemy[a], and their captors carry them away captive to the land of the enemy, whether far away or near,
translation:
  language: sw
  text: Watakapokukosea—kwa maana hakuna mtu asiyetenda dhambi—nawe ukawakasirikia na ukawatia mikononi mwa adui, watekaji wao wakawapeleka mateka katika nchi ya adui, iwe mbali au karibu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: Watakapokutenda dhambi
  rationale: Muktadha unaanzisha hali inayotarajiwa ndani ya sala ya Sulemani. Muundo wa Kiswahili wa wakati ujao wenye -taka- unawasilisha kwa kawaida maana ya ‘watakapotenda,’ huku dhambi ‘dhidi yako’ ikielezwa kwa kitenzi cha Kiswahili ‘kukukosea/kukutenda dhambi’; hapa ‘kukutenda dhambi’ inadumisha wazi uhusiano na Mungu.
- source_word: אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: hakuna mtu asiyetenda dhambi
  rationale: אָדָם hapa ni jina la jumla linalomaanisha mwanadamu yeyote. ‘Mtu’ ni la kawaida, jumuishi, na sahihi katika Kiswahili bila kupoteza umoja wa usemi wa Kiebrania.
- source_word: וְאָנַפְתָּ בָם
  choice: nawe ukawakasirikia
  rationale: Kitenzi kinaonyesha hasira ya Mungu dhidi yao; ‘ukawakasirikia’ ni cha sasa na chenye hadhi, na kinaendeleza mfuatano wa matendo.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: na kuwatia mikononi mwa adui
  rationale: Nahau hii ya Kiswahili inaeleza kwa uwazi kukabidhiwa chini ya mamlaka ya adui, maana inayokusudiwa na נתן לפני katika muktadha huu wa kushindwa.
- source_word: וְשָׁבוּם שֹׁבֵיהֶם
  choice: nao waliowateka wakawapeleka mateka
  rationale: Muundo huu unabainisha watekaji kuwa wahusika na watu waliotekwa kuwa watendwa. ‘Wakawapeleka mateka’ huwasilisha wazi kuhamishwa kwao kwenda uhamishoni.
- source_word: אֶל אֶרֶץ הָאוֹיֵב רְחוֹקָה אוֹ קְרוֹבָה
  choice: katika nchi ya adui, iwe mbali au karibu
  rationale: Tafsiri hii inadumisha nchi kama mahali wanakopelekwa na kuhifadhi utofautishaji wa umbali wa nchi hiyo.
theological_decisions:
- issue: Matumizi ya jumla ya אָדָם
  choice: mtu
  alternative: mwanadamu
  rationale: Katika Kiswahili, ‘mtu’ kwa kawaida humaanisha mwanadamu yeyote bila kuashiria jinsia ya kiume pekee; hivyo inahifadhi maana ya jumla ya chanzo bila kuingiza msimamo wa kimadhehebu.
- issue: Uhakika wa dhambi ya binadamu katika kishazi cha masharti
  choice: Watakapokutenda dhambi
  alternative: Wakikutenda dhambi
  rationale: Kishazi kinachofuata—‘hakuna mtu asiyetenda dhambi’—kinafanya ‘watakapokutenda’ kufaa katika mtiririko wa sala, bila kubadili kauli hiyo kuwa fundisho pana zaidi ya yale yanayosemwa na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhiwa kama sehemu inayoendelea ya sala, ndiyo maana inaishia kwa koma. Hakuna tanbihi iliyohitajika, kwa kuwa ‘mtu’ huwasilisha kwa kawaida maana ya jumla ya אָדָם na muundo wa Kiswahili unaeleza uhamisho kwa uwazi.
