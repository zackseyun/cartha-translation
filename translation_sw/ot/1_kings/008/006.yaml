base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/006.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place[b], under the wings of the cherubim.
translation:
  language: sw
  text: Kisha makuhani wakalileta Sanduku la Agano la Yahwe mahali pake, katika patakatifu pa ndani ya Hekalu[a], katika Patakatifu pa Patakatifu, chini ya mabawa ya makerubi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “nyumba”; hapa neno hili linarejelea Hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Kisha ... wakalileta
  rationale: Kitenzi hiki kinaendeleza mfuatano wa simulizi. “Kisha” pamoja na “wakalileta” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wahudumu hawa wa ibada.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: Sanduku la Agano la Yahwe
  rationale: Muundo huu unahifadhi uhusiano wa maneno katika Kiebrania na kutaja wazi sanduku, agano, na mwenye agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: מְקוֹמוֹ
  choice: mahali pake
  rationale: Kiambishi cha umilikaji kinarejelea Sanduku; tafsiri hii haisemi zaidi ya maandishi.
- source_word: דְּבִיר הַבַּיִת
  choice: patakatifu pa ndani mwa Hekalu
  rationale: דְּבִיר katika muktadha wa Hekalu ni chumba cha ndani kabisa kilichowekwa wakfu. “Hekalu” huwasilisha maana ya הַבַּיִת katika muktadha huu kwa uwazi, huku tanbihi ikihifadhi maana yake halisi.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: Patakatifu Zaidi
  rationale: Huu ni usemi wa Kiebrania unaoonyesha kiwango cha juu kabisa cha utakatifu. Tafsiri hii ni wazi na ya kawaida; muundo halisi umewekwa katika tanbihi.
- source_word: תַּחַת
  choice: chini ya
  rationale: Hutoa maana ya kawaida ya mahali iliyo katika kihusishi hiki.
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: mabawa ya makerubi
  rationale: “Mabawa” ni maana ya moja kwa moja, na “makerubi” ni umbo la Kiswahili linalotambulika kwa viumbe hawa wanaohusishwa na Sanduku.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kuliwakilisha kwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Utambulisho wa קֹדֶשׁ הַקֳּדָשִׁים
  choice: Patakatifu Zaidi
  alternative: Patakatifu pa Patakatifu
  rationale: Chaguo kuu linaeleweka kwa urahisi katika Kiswahili cha sasa, huku tanbihi ikihifadhi namna ya mkazo ya usemi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya kihusishi אֶל yamewasilishwa kwa vifungu vinavyofuatana bila kuifanya sentensi kuwa nzito. Herufi kubwa katika “Sanduku la Agano,” “Hekalu,” na “Patakatifu Zaidi” zinaonyesha majina ya vitu na maeneo maalumu katika simulizi.
