  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָקֻ֡ם תַּחַת֩ דָּוִ֨ד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/020.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, just as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: sw
  text: Yahwe amelitimiza neno lake alilolinena[a], nami nimechukua mahali pa Daudi, baba yangu, na nimeketi kwenye kiti cha enzi cha Israeli, kama Yahwe alivyosema; nami nimeijenga nyumba[b] kwa ajili ya jina la Yahwe, Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amelithibitisha neno lake” au “amelitekeleza neno lake.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, hekalu; katika Kiebrania, “nyumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: amelitimiza
  rationale: Hifili ya קום pamoja na ‘neno’ humaanisha kulithibitisha kwa kulifanya litimie. ‘Amelitimiza’ ni Kiswahili cha kawaida kinachoonyesha kwamba Yahwe ametenda kile alichosema.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama ‘BWANA’.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: neno lake alilolinena
  rationale: Huhifadhi urudiaji wa mzizi דבר na mkazo wa Kiebrania juu ya neno lililonenwa, bila kulifasiri moja kwa moja kuwa ‘ahadi’.
- source_word: וָאָקֻם תַּחַת דָּוִד אָבִי
  choice: nimeinuka kuchukua nafasi ya Daudi baba yangu
  rationale: ‘Nimeinuka’ huhifadhi mwangwi wa קום, huku ‘kuchukua nafasi ya’ ikieleza kwa Kiswahili cha kawaida maana ya urithi wa kifalme iliyo katika תַּחַת.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: nimeketi katika kiti cha ufalme cha Israeli
  rationale: Usemi huu huhifadhi picha ya kuketi kwenye kiti cha enzi huku ‘kiti cha ufalme’ kikieleweka wazi kama ishara ya kutawala.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: kama Yahwe alivyosema
  rationale: Huhifadhi rejeo la moja kwa moja kwa yale Yahwe aliyosema, bila kuongeza tafsiri ya ‘aliahidi’.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: nimeijenga nyumba
  rationale: ‘Nyumba’ ndiyo maana ya moja kwa moja ya הַבַּיִת na huhifadhi dhamira ya nyumba ya Mungu; tanbihi inafafanua kuwa hapa ni hekalu.
- source_word: לְשֵׁם יְהוָה
  choice: kwa ajili ya jina la Yahwe
  rationale: Huhifadhi usemi muhimu wa kibiblia ‘kwa ajili ya jina la’ bila kuupunguza kuwa ‘kwa heshima ya’.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya cheo hiki cha agano.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha na cheo.
- issue: Ikiwa הַבַּיִת itafsiriwe ‘nyumba’ au ‘hekalu’
  choice: nyumba
  alternative: hekalu
  rationale: ‘Nyumba’ hufuata neno la Kiebrania na kuhifadhi dhamira ya nyumba ya Yahwe, huku tanbihi ikitambulisha wazi jengo linalokusudiwa.
- issue: Ikiwa דְּבָרוֹ litafsiriwe ‘neno lake’ au ‘ahadi yake’
  choice: neno lake
  alternative: ahadi yake
  rationale: Muktadha unaonyesha ahadi, lakini Kiebrania kinasema ‘neno’; tafsiri iliyochaguliwa huhifadhi upana huo na urudiaji wa ‘neno/kunena’.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Nimeinuka kuchukua nafasi’ hudumisha picha ya Kiebrania bila kuwa na ukakasi, na ‘kiti cha ufalme’ ni wazi zaidi katika matumizi ya sasa kuliko ‘kiti cha enzi’ bila kupoteza maana ya kifalme.
