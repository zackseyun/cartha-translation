base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/031.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and the oath comes before your altar in this house,
translation:
  language: sw
  text: Mtu akimkosea mwenzake, na akawekewa kiapo[a] ili aapishwe, na kiapo hicho kikaja mbele ya madhabahu yako katika nyumba hii,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “laana”; neno la Kiebrania linaweza kumaanisha kiapo chenyewe au laana inayotamkwa iwapo kiapo kitavunjwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא אִישׁ לְרֵעֵהוּ
  choice: Mtu akimtendea mwenzake dhambi
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unadumisha maana ya kosa la kimaadili na kidini dhidi ya mtu mwingine. “Mtu” hapa huwakilisha matumizi ya jumla ya אִישׁ bila kulazimisha jinsia katika Kiswahili.
- source_word: וְנָשָׂא בוֹ אָלָה
  choice: kisha akawekewa kiapo
  rationale: Kauli tendwa inadumisha kwamba kiapo kinawekwa juu ya mtu huyo, huku Kiswahili kikiendelea kuwa wazi na cha kawaida.
- source_word: לְהַאֲלֹתוֹ
  choice: ili aapishwe
  rationale: 'Kauli hii inaonyesha maana ya kisababishi ya kitenzi: mtu huyo anafanywa aape. Pia inadumisha kipengele hiki tofauti na kuwekwa kwa kiapo.'
- source_word: וּבָא אָלָה
  choice: na kiapo hicho kikaja
  rationale: “Kiapo” kinabaki kuwa kiima cha kitenzi kama ilivyo kwa usomaji wa moja kwa moja wa Kiebrania, na picha ya kiapo kufika mbele za Mungu inadumishwa.
- source_word: לִפְנֵי מִזְבַּחֲךָ
  choice: mbele ya madhabahu yako
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa mahali wenye pia uzito wa kimahakama.
- source_word: בַּבַּיִת הַזֶּה
  choice: katika nyumba hii
  rationale: “Nyumba” inadumisha neno la Kiebrania na maana yake ya kitheolojia, ingawa katika muktadha linarejelea hekalu.
theological_decisions:
- issue: Maana ya אָלָה katika muktadha wa kiapo cha kimahakama hekaluni
  choice: kiapo
  alternative: laana
  rationale: Muktadha unaonyesha utaratibu wa kumwapisha mtu mbele ya madhabahu, hivyo “kiapo” ndiyo maana ya msingi hapa. Hata hivyo, אָלָה pia linaweza kumaanisha laana inayotamkwa kama adhabu ya kuvunja kiapo; maana hiyo haijaondolewa bali imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masharti unaendelea kutoka katika muktadha wa sala ya Sulemani, na koma ya mwisho inaonyesha kwamba sentensi inaendelea katika aya inayofuata.
