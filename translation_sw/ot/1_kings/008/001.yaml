id: 1KI.8.1
reference: 1 Kings 8:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אָ֣ז יַקְהֵ֣ל שְׁלֹמֹ֣ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֡ל אֶת כָּל רָאשֵׁ֣י הַ/מַּטּוֹת֩ נְשִׂיאֵ֨י הָ/אָב֜וֹת לִ/בְנֵ֧י יִשְׂרָאֵ֛ל אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖ד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/001.yaml
  text: Then Solomon assembled the elders of Israel[a], all the heads of the tribes, the leaders of the fathers’ houses of the sons of Israel, to King Solomon in Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David, that is, Zion.
translation:
  language: sw
  text: Ndipo Sulemani akawakusanya wazee wa Israeli, wakuu wote wa makabila, na viongozi wa jamaa za mababu za wana wa Israeli[a], wamjie Mfalme Sulemani huko Yerusalemu, ili walipandishe sanduku la agano la Yahwe kutoka Mji wa Daudi, yaani, Sayuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “wana wa Israeli”; huu ni usemi wa kifamilia na kitaifa unaowarejelea Waisraeli kwa pamoja.
    reason: Kufafanua maana ya kitaifa ya usemi wa Kiebrania huku umbo lake la kifamilia likihifadhiwa katika matini.
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Ni kiashiria cha wakati kinachoendeleza masimulizi kwa tukio linalofuata.
- source_word: יַקְהֵל
  choice: akawakusanya
  rationale: Hifili ya קהל ina maana ya kusababisha watu wakusanyike; tafsiri hii inafaa mkutano rasmi ulioitishwa na mfalme.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: wazee wa Israeli
  rationale: Ni istilahi ya kijamii na kisiasa kwa viongozi wakuu waliotambuliwa katika Israeli.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: wakuu wote wa makabila
  rationale: Katika muktadha huu מַטּוֹת humaanisha makabila, wala si fimbo halisi.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: viongozi wa jamaa za mababu
  rationale: Kirai kinawarejelea viongozi wa vikundi vya kifamilia vya ukoo; 'jamaa za mababu' kinaonyesha muundo huo bila kuingiza neno lisilokuwapo wazi katika Kiebrania.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: za wana wa Israeli
  rationale: Inahifadhi picha ya kifamilia ya Kiebrania huku tanbihi ikifafanua kuwa ni usemi wa kitaifa unaolihusu taifa zima.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: waje kwake Mfalme Sulemani
  rationale: אֶל huonyesha mwelekeo wa kuja kwa mfalme. Muundo huu wa Kiswahili unaweka wazi kwamba waliokusanywa walikuja kwa Sulemani, huku ukihifadhi kurudiwa kwa jina lake katika chanzo.
- source_word: לְהַעֲלוֹת
  choice: kulipandisha
  rationale: Kitenzi kina maana ya kupeleka juu; 'kulipandisha' kinahifadhi wazo la mwendo wa kupanda kuelekea Yerusalemu.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahwe
  rationale: Inafuata mnyororo wa umilikaji wa Kiebrania na kulitaja sanduku linalohusiana na agano la Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja katika tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: מֵעִיר דָּוִד
  choice: kutoka Mji wa Daudi
  rationale: Ni jina la kijiografia linalotafsiriwa moja kwa moja na kwa uwazi.
- source_word: הִיא צִיּוֹן
  choice: yaani, Sayuni
  rationale: Kirai kinautambulisha Mji wa Daudi kuwa Sayuni; 'yaani' ni apposisheni ya kawaida na wazi katika Kiswahili.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia Tetragramatoni kama jina binafsi. 'Yahwe' hulihifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Usemi wa kitaifa wenye umbo la kifamilia לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Tafsiri iliyochaguliwa inahifadhi sitiari halisi ya undugu katika Kiebrania; tanbihi inaeleza kwamba hapa usemi huo hulitaja taifa kwa pamoja.
- issue: Maana ya אֶל katika mkusanyiko ulioitishwa na Sulemani
  choice: waje kwake Mfalme Sulemani
  alternative: mbele ya Mfalme Sulemani
  rationale: Chaguo hili huhifadhi mwelekeo wa preposisheni 'kwa/kuelekea' bila kuamua kwamba maana yake hasa ni hadhira rasmi 'mbele ya' mfalme.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi wenye heshima na unaoeleweka. Majina 'Yahwe' na 'Sayuni' yametolewa kwa tahajia zilizozoeleka katika Kiswahili. Kurudiwa kwa 'Sulemani' kumehifadhiwa kwa kuwa kunapatikana katika chanzo, lakini sentensi imeundwa kwa 'waje kwake' ili iwe ya kawaida zaidi katika Kiswahili.
