  text: וְ/עַתָּ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵאָ֤מֶן נָא֙ דברי/ך אֲשֶׁ֣ר דִּבַּ֔רְתָּ לְ/עַבְדְּ/ךָ֖ דָּוִ֥ד אָבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/026.yaml
  text: And now[a], God of Israel[b], please let your word that you spoke to your servant David my father be confirmed.
translation:
  language: sw
  text: Na sasa, Ee Mungu wa Israeli, tafadhali maneno yako[a] uliyomwambia mtumishi wako Daudi, baba yangu, yathibitike.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania “maneno yako”; yanaweza kueleweka kwa pamoja kuwa “neno lako” au “ahadi yako.”
    reason: lexical_alternative
  - marker: b
    text: Au “yawe imara,” “yaonekane kuwa ya kweli,” au kwa tafsiri yenye maana pana zaidi, “yatimizwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi pamoja na kielezi cha wakati, na kuonyesha mwendelezo wa sala ya Sulemani kwa Kiswahili cha kawaida.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Ee Mungu wa Israeli
  rationale: Kirai hiki kinatumika kama mwito wa moja kwa moja katika sala; “Ee” huonyesha mwito huo kwa lugha ya heshima na iliyo ya kawaida.
- source_word: יֵאָמֶן
  choice: yathibitike
  rationale: Nifali ya אמן hapa inaomba kwamba yale aliyosema Mungu yaonekane kuwa imara na ya kweli. “Yathibitike” inadumisha hali ya kutendwa bila kufafanua kupita kiasi namna ya kutimizwa kwake.
- source_word: נָא
  choice: tafadhali
  rationale: Neno hili linaonyesha ombi la unyenyekevu; “tafadhali” linawasilisha nguvu hiyo kwa Kiswahili cha sasa.
- source_word: דבריך
  choice: maneno yako
  rationale: Umbo la Kiebrania ni la wingi, hivyo “maneno yako” linafuata ushahidi wa maandishi, ingawa katika muktadha linaweza kuwa na maana ya ujumbe au ahadi moja kwa ujumla.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: uliyomwambia
  rationale: Kitenzi דבר kinamaanisha kusema au kunena; kwa kuwa לְעַבְדְּךָ humtaja mpokeaji, “uliyomwambia” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: לְעַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika maombi haya kuhusu Daudi, neno עבד linaonyesha uhusiano wa huduma na heshima mbele za Mungu; “mtumishi” linafaa kuliko “mtumwa” katika muktadha huu.
- source_word: דָּוִד אָבִי
  choice: Daudi, baba yangu
  rationale: Mpangilio huu unafuata mfuatano wa Kiebrania na kuweka wazi kwamba Daudi ndiye baba anayerejelewa.
theological_decisions:
- issue: Asili ya ombi kuhusu yale Mungu aliyomwambia Daudi
  choice: Ombi kwamba maneno ya Mungu yathibitike
  alternative: Ombi kwamba ahadi ya Mungu itimie
  rationale: “Yathibitike” huhifadhi wazo la mzizi אמן la uthabiti na ukweli, huku pia ikiruhusu maana ya kutimia bila kubadili “maneno” moja kwa moja kuwa “ahadi” au kuongeza ufafanuzi wa kimadhehebu.
- issue: Wingi wa דבריך na umoja wa wazo linalowakilishwa
  choice: maneno yako
  alternative: neno lako; ahadi yako
  rationale: Tafsiri inahifadhi wingi wa umbo la Kiebrania. Hata hivyo, muktadha unaweza kuyachukulia maneno hayo kwa pamoja kama ujumbe au ahadi moja, jambo linaloelezwa katika tanbihi bila kulazimisha uamuzi ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa sala lakini kinachoeleweka kwa wasomaji wa sasa. “Ee” limetumiwa kuonyesha mwito wa moja kwa moja, na “tafadhali” kuwasilisha ombi la unyenyekevu bila lugha ya kizamani.
