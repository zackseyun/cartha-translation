base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/063.yaml
  text: 'And Solomon sacrificed the sacrifice of peace offerings that he sacrificed to Yahweh: twenty-two thousand cattle and one hundred twenty thousand sheep[b][a]. So the king and all the sons of Israel dedicated the house of Yahweh.'
translation:
  language: sw
  text: 'Sulemani akamtolea Yahwe dhabihu ya amani[a]: ng’ombe elfu ishirini na mbili, na mifugo midogo elfu mia moja na ishirini[b]. Hivyo mfalme na wana wote wa Israeli wakaiweka wakfu nyumba ya Yahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhabihu ya ushirika” au “dhabihu ya hali njema.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania צֹאן humaanisha mifugo midogo ya kundi, inayoweza kujumuisha kondoo na mbuzi; tafsiri nyingine husema “kondoo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: akamtolea ... dhabihu
  rationale: Katika muktadha wa ibada, זבח huonyesha tendo la kutoa mnyama kama dhabihu; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: dhabihu ya sadaka za amani
  rationale: Huhifadhi muundo wa Kiebrania na istilahi inayotambulika ya sadaka, huku tanbihi ikihifadhi maana mbadala ya ushirika au hali njema.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יְהוָה limetoholewa moja kwa moja kama Yahwe badala ya kubadilishwa kuwa cheo.
- source_word: בָּקָר
  choice: ng’ombe
  rationale: Ni nomino ya jumla kwa wanyama wa jamii ya ng’ombe na inafaa kwa idadi kubwa iliyotajwa.
- source_word: צֹאן
  choice: kondoo na mbuzi
  rationale: צֹאן ni kundi la mifugo midogo linaloweza kujumuisha kondoo na mbuzi; kutaja aina zote mbili huepuka kuifanya maana kuwa nyembamba kuliko chanzo.
- source_word: וַיַּחְנְכוּ
  choice: wakaiweka wakfu
  rationale: Katika muktadha huu חנך ni kuiweka nyumba rasmi kwa matumizi matakatifu; usemi huu ni wa asili na unaeleweka katika Kiswahili.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Huhifadhi kwa uwazi sitiari ya chanzo 'nyumba' badala ya kuifasiri moja kwa moja kuwa hekalu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wote wa Israeli
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania na jinsia yake ya kisarufi, huku neno 'wote' likiwakilisha כָּל.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; 'Yahwe' huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya זֶבַח הַשְּׁלָמִים
  choice: dhabihu ya sadaka za amani
  alternative: dhabihu ya sadaka za ushirika; dhabihu ya sadaka za hali njema
  rationale: Neno שְׁלָמִים lina wigo unaohusisha amani, hali njema, na ushirika. Istilahi ya kawaida imetumiwa katika matini, na wigo huo umehifadhiwa katika tanbihi.
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wote wa Israeli
  alternative: Waisraeli wote; watu wote wa Israeli
  rationale: Usemi rasmi wa Kiebrania umehifadhiwa bila kuamua kimyakimya kwamba ni jina la jumla lisiloonyesha jinsia, ingawa katika muktadha unarejelea jumuiya ya Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ni wa kawaida, istilahi za ibada zimewekwa wazi, na marudio mazito ya Kiebrania yamepunguzwa bila kupoteza taarifa. Alama zote za tanbihi [a] na [b] zimo katika matini.
