base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/048.yaml
  text: and they return to you with all their heart and with all their soul in the land of their enemies who took them captive[a], and pray to you toward their land that you gave to their fathers, the city that you chose, and the house that I have built for your name[c][b],
translation:
  language: sw
  text: na wakurudie kwa moyo wao wote na kwa nafsi zao zote[a] katika nchi ya adui zao waliowachukua mateka, na wakuombe wakielekea upande wa nchi yao[b] uliyowapa baba zao, mji uliouchagua, na nyumba niliyoijenga kwa ajili ya jina lako[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na warejee kwako.” Katika muktadha huu, kurudi kwa Mungu kunaweza pia kuwa na maana ya kutubu.
    reason: lexical_alternative
  - marker: b
    text: Yaani, wakiwa wameelekeza nyuso zao upande wa nchi yao. Usemi wa Kiebrania unaonyesha mwelekeo walioutazama walipokuwa wakiomba.
    reason: lexical_alternative
  - marker: c
    text: Yaani, nyumba au hekalu lililowekwa wakfu kwa jina lako.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: na wakurudie
  rationale: Kitenzi שׁוּב kimsingi humaanisha kurudi au kugeuka. “Wakurudie” kinahifadhi mwelekeo wa uhusiano na Mungu bila kufanya maana ya kutubu iwe wazi kupita maandishi ya Kiebrania.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: kwa moyo wao wote na kwa nafsi yao yote
  rationale: Huhifadhi taswira mbili za Kiebrania—moyo na nafsi—na kusisitiza kujitoa kwa ukamilifu.
- source_word: בְּאֶרֶץ אֹיְבֵיהֶם
  choice: katika nchi ya adui zao
  rationale: “Nchi” hudumisha ulinganifu wa kimakusudi kati ya nchi ya uhamisho na nchi yao inayotajwa baadaye.
- source_word: אֲשֶׁר שָׁבוּ אֹתָם
  choice: waliowachukua mateka
  rationale: Hutoa maana ya moja kwa moja ya שׁבה, yaani kuwakamata na kuwafanya mateka, kwa Kiswahili cha kawaida.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: na kukuomba
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kusali kwa Mungu huku ukihifadhi kwamba sala inaelekezwa kwake.
- source_word: דֶּרֶךְ אַרְצָם
  choice: wakielekea upande wa nchi yao
  rationale: דֶּרֶךְ hapa huonyesha mwelekeo wa kimwili. Kauli hii ni ya asili katika Kiswahili na haimaanishi kwamba walikuwa njiani kwenda huko.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: uliyowapa baba zao
  rationale: “Baba zao” huhifadhi usemi wa agano wa maandishi ya Kiebrania, badala ya kuupanua kimya kimya kuwa “mababu zao.”
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: mji uliouchagua
  rationale: Huhifadhi kwa uwazi tendo la Mungu la kuuchagua mji.
- source_word: וְהַבַּיִת אֲשֶׁר בנית לִשְׁמֶךָ
  choice: na nyumba niliyoijenga kwa ajili ya jina lako
  rationale: “Nyumba” huhifadhi בַּיִת na mwangwi wake wa kiteolojia; “niliyoijenga” hudumisha nafsi ya kwanza ya usemi wa Sulemani, na “kwa ajili ya jina lako” huhifadhi nahau ya jina la Mungu kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Maana ya toba katika וְשָׁבוּ אֵלֶיךָ
  choice: na wakurudie
  alternative: na watubu mbele zako
  rationale: Katika muktadha wa agano, kurudi kwa Mungu kunahusisha toba, lakini maandishi yanaeleza tendo hilo kwa lugha ya kurudi. Tafsiri hii huhifadhi maana ya uhusiano na pia mvutano huo wa kiteolojia.
- issue: Nafsi ya msemaji katika אֲשֶׁר בנית
  choice: niliyoijenga
  alternative: iliyojengwa / waliyoijenga
  rationale: Maandishi ya konsonanti ya MT katika muktadha wa sala ya Sulemani yanaeleweka kwa kawaida kama nafsi ya kwanza umoja. Kuyahifadhi huepuka kufuta rejeo la Sulemani kwa kazi yake ya kujenga nyumba.
- issue: “Nyumba” na jina la Mungu
  choice: nyumba ... kwa ajili ya jina lako
  alternative: hekalu nililoliweka wakfu kwa jina lako
  rationale: Tafsiri kuu huhifadhi istilahi na nahau za chanzo bila kuingiza maelezo ya kitamaduni ndani ya mstari; ufafanuzi kwamba ni hekalu lililowekwa wakfu kwa jina la Mungu umetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya sala lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa utegemezi “wakurudie ... na kukuomba” unaendana na sentensi pana ya masharti inayozunguka mstari huu. Alama za tanbihi zimewekwa mara moja kila moja mahali panapohusika.
