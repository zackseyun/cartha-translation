base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/032.yaml
  text: then hear in heaven and act[a], and judge your servants, condemning the wicked by bringing his way upon his own head[c][b], and justifying the righteous by giving to him according to his righteousness.
translation:
  language: sw
  text: 'ndipo usikie ukiwa mbinguni[a] na utende, na uwahukumu watumishi wako: umtie mwovu hatiani kwa kuirudisha njia yake juu ya kichwa chake mwenyewe[b], na umtangaze mwenye haki kuwa hana hatia[c], ukimpa kulingana na haki yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usikie kutoka mbinguni.” Kiebrania kwa maneno halisi kinasema “usikie mbingu”; katika mtindo huu wa sala, maana inaweza kuwa Mungu anasikia akiwa mbinguni au kutoka mbinguni.
    reason: lexical_alternative
  - marker: b
    text: “Kuirudisha njia yake juu ya kichwa chake mwenyewe” ni nahau ya Kiebrania yenye maana ya kumlipa mtu kulingana na mwenendo wake.
    reason: cultural_note
  - marker: c
    text: Au, “umthibitishe mwenye haki kuwa mwadilifu” au “umtete mwenye haki.”
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: usikie ukiwa mbinguni
  rationale: Katika muktadha huu wa sala, maneno haya yanamwomba Mungu asikie akiwa mbinguni. Kiswahili hiki ni cha kawaida na kinahifadhi wazo la mahali bila kutumia usemi usio wa kawaida ‘usikie mbingu.’
- source_word: וְעָשִׂיתָ
  choice: na utende
  rationale: Kitenzi hiki kina maana pana ya kufanya au kutenda; ‘utende’ kinawasilisha hatua ya Mungu ya kuitikia ombi bila kubainisha zaidi ya maandishi ya Kiebrania.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: na uwahukumu watumishi wako
  rationale: ‘Uwahukumu’ kinahifadhi mazingira ya kisheria na hakitangulizi uamuzi ambao vifungu vinavyofuata vinaueleza.
- source_word: לְהַרְשִׁיעַ רָשָׁע
  choice: umtie mwovu hatiani
  rationale: Katika matumizi ya kisheria, kitenzi hiki humaanisha kumtangaza mtu kuwa na hatia. Usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: kwa kumrudishia matendo yake juu ya kichwa chake mwenyewe
  rationale: ‘Njia yake’ hapa inaashiria mwenendo au matendo yake. ‘Kumrudishia matendo yake’ hufafanua malipo yanayolingana na mwenendo, huku taswira ya ‘juu ya kichwa chake’ ikihifadhiwa.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: na umtangaze mwenye haki kuwa hana hatia
  rationale: Kitenzi cha Kiebrania kina maana ya kisheria ya kumtangaza mtu kuwa mwenye haki. Kiswahili hiki kinaonyesha wazi uamuzi wa mahakama na kudumisha ulinganifu wake na kumtia mwovu hatiani.
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: ukimpa kulingana na haki yake
  rationale: Tafsiri hii inafuata muundo wa Kiebrania na kuepuka kuongeza neno ‘thawabu,’ ambalo lingekuwa ufafanuzi zaidi.
theological_decisions:
- issue: Maana ya kisheria au ya mabadiliko ya kimaadili katika vitenzi vya hukumu
  choice: 'Vitenzi vimetafsiriwa kwa maana ya kisheria: ‘umtie ... hatiani’ na ‘umtangaze ... kuwa hana hatia.’'
  alternative: ‘Umwadhibu mwovu’ na ‘umtetee mwenye haki.’
  rationale: Muktadha ni wa shauri linaloletwa mbele ya Mungu ili atoe hukumu. Miundo ya Kiebrania ni istilahi za kisheria za kutangaza mwenye hatia na mwenye haki; hivyo tafsiri haiongezi wazo la mabadiliko ya ndani ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa heshima unaoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria umehifadhiwa, lakini nahau ya Kiebrania imefafanuliwa kiasi katika matini na kuelezwa katika tanbihi.
