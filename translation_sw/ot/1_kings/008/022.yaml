id: 1KI.8.22
reference: 1 Kings 8:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד שְׁלֹמֹ֗ה לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/022.yaml
  text: Then Solomon stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands toward heaven[a].
translation:
  language: sw
  text: Ndipo Sulemani akasimama mbele ya madhabahu ya Yahweh, mbele ya kusanyiko lote la Israeli, akanyosha mikono yake kuelekea mbinguni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mbingu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: akasimama
  rationale: Kitenzi cha usimulizi kinaonyesha tendo lililofuata katika mfululizo; “akasimama” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: mbele ya madhabahu ya Yahweh
  rationale: “Mbele ya” huhifadhi maana ya mahali, na muundo “madhabahu ya Yahweh” unaakisi uhusiano wa maneno katika Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: mbele ya kusanyiko lote la Israeli
  rationale: “Mbele ya” huonyesha kwamba Sulemani alikuwa akikabiliana na mkutano huo hadharani; “kusanyiko lote” ni usemi wa kawaida unaohifadhi wazo la jamii iliyokusanyika.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: akanyosha mikono yake
  rationale: Katika muktadha wa sala, usemi huu unaeleza kunyoosha au kutandaza mikono; “akanyosha mikono yake” ni wa asili na unaeleweka wazi kwa wasomaji wa Kiswahili.
- source_word: הַשָּׁמָיִם
  choice: mbinguni
  rationale: Katika muktadha huu wa mwelekeo wa sala, “kuelekea mbinguni” ni Kiswahili cha kawaida; umbo la Kiebrania linaweza kuwakilishwa kihalisi zaidi kama “mbingu.”
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahweh” hulihifadhi bila kulibadilisha kuwa cheo, huku “Yehova” likiwa umbo jingine la kitamaduni.
- issue: Maana ya הַשָּׁמָיִם katika ishara ya sala
  choice: mbinguni
  alternative: mbingu
  rationale: “Mbinguni” huwasilisha kwa kawaida mwelekeo wa mikono katika sala bila kuamua kwa undani kama neno hilo linamaanisha anga au makao ya Mungu; tanbihi inahifadhi umbo la karibu zaidi na Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa usimulizi wenye “aka-” umetumiwa kuonyesha mfululizo wa matendo. Kurudiwa kwa “mbele ya” kumedumishwa kwa sababu vitu vinavyorejelewa ni tofauti—madhabahu na kusanyiko—na maana inabaki wazi.
