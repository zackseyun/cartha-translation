id: 1KI.8.66
reference: 1 Kings 8:66
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/שְּׁמִינִי֙ שִׁלַּ֣ח אֶת הָ/עָ֔ם וַֽ/יְבָרֲכ֖וּ אֶת הַ/מֶּ֑לֶךְ וַ/יֵּלְכ֣וּ לְ/אָהֳלֵי/הֶ֗ם שְׂמֵחִים֙ וְ/ט֣וֹבֵי לֵ֔ב עַ֣ל כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/דָוִ֣ד עַבְדּ֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/066.yaml
  text: On the eighth day he sent the people away[a], and they blessed the king and went to their tents, rejoicing and glad of heart because of all the good that Yahweh had done for David his servant and for Israel his people.
translation:
  language: sw
  text: Siku ya nane, aliwaaga watu waende[a]. Nao wakambariki mfalme, kisha wakaenda mahemani mwao, wakiwa na furaha na mioyo yenye shangwe kwa sababu ya mema yote ambayo Yahweh alikuwa amemfanyia Daudi, mtumishi wake, na Israeli, watu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waende nyumbani kwao”; kwa neno halisi, “mahemani mwao.”
    reason: Maana ya kiidioma ya לְאָהֳלֵיהֶם inaweza kuwa kurudi nyumbani, ingawa neno lenyewe linamaanisha mahema.
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Siku ya nane
  rationale: Kauli ya wakati imetafsiriwa moja kwa moja bila kuongeza “ya sikukuu,” jambo linaloeleweka kutokana na muktadha lakini halimo wazi katika mstari huu.
- source_word: שִׁלַּח אֶת הָעָם
  choice: aliwaruhusu watu waondoke
  rationale: Piel ya שלח hapa ina maana ya kuwapa ruhusa waondoke au kuwaaga rasmi; tafsiri hii ni ya kawaida katika Kiswahili na inaepuka dhana isiyokusudiwa ya kuwafukuza.
- source_word: וַיְבָרֲכוּ אֶת הַמֶּלֶךְ
  choice: wakambariki mfalme
  rationale: ברך kimsingi ni “bariki.” Ingawa katika muktadha huenda tendo hili lilihusisha kumuaga mfalme, tafsiri hii inadumisha maana ya msingi na uwezekano wa kumtakia mema.
- source_word: לְאָהֳלֵיהֶם
  choice: kwenye mahema yao
  rationale: Hii ndiyo picha halisi ya Kiebrania. Maana ya kiidioma “nyumbani kwao” imehifadhiwa katika tanbihi.
- source_word: שְׂמֵחִים
  choice: wakiwa na furaha
  rationale: Inaeleza hali yao walipokuwa wakiondoka kwa lugha ya kawaida na iliyo wazi.
- source_word: וְטוֹבֵי לֵב
  choice: na mioyo yenye shangwe
  rationale: Inahifadhi taswira ya Kiebrania ya moyo huku ikitoa maana ya furaha ya ndani kwa Kiswahili cha asili.
- source_word: עַל כָּל הַטּוֹבָה
  choice: kwa sababu ya mema yote
  rationale: עַל hapa inaonyesha sababu ya furaha yao, na הַטּוֹבָה inajumuisha matendo yote mema au baraka walizopokea.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa uhamishaji wa sauti badala ya kubadilishwa na cheo.
- source_word: לְדָוִד עַבְדּוֹ
  choice: Daudi mtumishi wake
  rationale: Katika lugha ya kifalme na ya agano, עבד kuhusu Daudi inafaa kutafsiriwa “mtumishi,” bila kuingiza dhana finyu ya utumwa wa mali.
- source_word: וּלְיִשְׂרָאֵל עַמּוֹ
  choice: na Israeli watu wake
  rationale: Muundo huu unahifadhi utambulisho wa Israeli kuwa watu wa Yahweh kwa mtiririko wa kawaida wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetungwa kwa uwazi wa kawaida huku ikihifadhi taswira ya “mahema” na “mioyo,” pamoja na jina Yahweh.
