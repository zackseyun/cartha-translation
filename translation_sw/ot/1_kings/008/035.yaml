  text: בְּ/הֵעָצֵ֥ר שָׁמַ֛יִם וְ/לֹא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּֽלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וּ/מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/035.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and give thanks to your name and turn from their sin because you afflict them[b],
translation:
  language: sw
  text: Mbingu zinapofungwa na mvua isinyeshe kwa sababu wamekutenda dhambi dhidi yako, nao wakisali wakielekea mahali hapa, wakiliungama jina lako[a], na kugeuka kutoka dhambi yao kwa sababu unawanyenyekeza[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakilisifu jina lako” au “wakilishukuru jina lako.” Kitenzi cha Kiebrania kinaweza kumaanisha kukiri wazi, kusifu, au kushukuru, kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sababu unawaadhibu.” Umbo la Kiebrania linaweza pia kueleweka kuwa “kwa sababu unawajibu,” lakini muktadha wa ukame kama nidhamu unaunga mkono maana ya kuwanyenyekeza au kuwaadhibu.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהֵעָצֵר שָׁמַיִם
  choice: Mbingu zinapofungwa
  rationale: Muundo wa wakati wenye kitenzi cha kutendwa unaonyesha hali ya mbingu kufungwa au kuzuiwa; usemi huu pia unahifadhi taswira ya Kiebrania.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: na mvua isinyeshe
  rationale: Hii ni njia ya kawaida na ya wazi ya Kiswahili kueleza kutokuwapo kwa mvua katika hali inayotajwa.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: kwa sababu wamekutenda dhambi
  rationale: כִּי inaonyesha sababu, na לָךְ hapa inaonyesha dhambi iliyoelekezwa dhidi ya Mungu.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: nao wakisali wakielekea mahali hapa
  rationale: אֶל inaonyesha mwelekeo wa sala kuelekea mahali hapa, si kwamba mahali penyewe ndiko kunakoombwa.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: wakalikiri jina lako
  rationale: Katika muktadha wa dhambi na kugeuka kutoka dhambini, ידה inaweza kueleza kulikiri au kulikubali wazi jina la Mungu; maana zinazohusiana za kusifu au kushukuru zimehifadhiwa katika tanbihi.
- source_word: וּמֵחַטָּאתָם יְשׁוּבוּן
  choice: na kugeuka kutoka katika dhambi yao
  rationale: שׁוב pamoja na מִן humaanisha kuacha au kugeuka kutoka katika dhambi; tafsiri hii inaonyesha taswira ya kitenzi badala ya kutumia neno la kifasiri zaidi.
- source_word: כִּי תַעֲנֵם
  choice: kwa sababu umewatesa
  rationale: Katika muktadha wa ukame kama adhabu inayoongoza kwenye kugeuka kutoka dhambini, umbo hili linaeleweka kwa kufaa kuwa Mungu amewatesa au amewanyenyekeza; uwezekano wa ‘umewajibu’ umeonyeshwa katika tanbihi.
theological_decisions:
- issue: Mwelekeo wa sala kuhusu hekalu
  choice: wakisali wakielekea mahali hapa
  alternative: wakisali kwa mahali hapa
  rationale: Maana ni kuelekeza sala upande wa mahali palipowekwa jina la Mungu, si kuliomba eneo lenyewe.
- issue: Maana ya תַעֲנֵם
  choice: umewatesa
  alternative: umewajibu
  rationale: Mtiririko wa wazo unaunganisha ukame, dhambi, mateso au kunyenyekezwa, na kugeuka kutoka dhambini. Hata hivyo, umbo hilo linaweza pia kueleweka kuwa ‘umewajibu,’ kwa hiyo uwezekano huo haujafichwa.
- issue: Maana ya וְהוֹדוּ אֶת שְׁמֶךָ
  choice: wakalikiri jina lako
  alternative: wakalishukuru au kulisifu jina lako
  rationale: Kitenzi kina wigo wa maana unaojumuisha kukiri wazi, kusifu, na kushukuru. Muktadha wa toba unaunga mkono ‘kulikiri,’ huku tanbihi ikihifadhi maana nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. ‘Mbingu zinapofungwa’ inadumisha taswira ya kibiblia, na ‘wakielekea mahali hapa’ huepuka kudokeza kwamba sala inaelekezwa kwa jengo lenyewe.
