source:
  edition: WLC
  text: וְ/סָלַחְתָּ֤ לְ/עַמְּ/ךָ֙ אֲשֶׁ֣ר חָֽטְאוּ לָ֔/ךְ וּ/לְ/כָל פִּשְׁעֵי/הֶ֖ם אֲשֶׁ֣ר פָּשְׁעוּ בָ֑/ךְ וּ/נְתַתָּ֧/ם לְ/רַחֲמִ֛ים לִ/פְנֵ֥י שֹׁבֵי/הֶ֖ם וְ/רִֽחֲמֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/050.yaml
  text: and forgive your people who have sinned against you[a], and all their transgressions that they have committed against you, and grant them compassion before those who took them captive[b], so that they may have compassion on them.
translation:
  language: sw
  text: Uwasamehe watu wako waliokutenda dhambi dhidi yako, na maasi yao yote waliyokuasi[a]. Uwajalie rehema mbele ya watekaji wao, ili wawahurumie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makosa yao yote.” “Maasi” hukazia uasi au uvunjaji wa wajibu dhidi ya Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au “nao watawahurumia.” Kishazi cha mwisho kinaweza kueleweka kuwa matokeo badala ya kusudi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָלַחְתָּ
  choice: uwasamehe
  rationale: Katika muktadha wa sala ya Sulemani, kitenzi hiki kina nguvu ya ombi. “Uwasamehe” ni Kiswahili cha kawaida na chenye hadhi kinachoonyesha ombi hilo.
- source_word: לְעַמְּךָ
  choice: watu wako
  rationale: Kirai hiki humtaja Israeli kuwa watu wa Mungu; kiambishi cha yambwa katika “uwasamehe” kinaondoa haja ya kutafsiri kihusishi cha Kiebrania moja kwa moja.
- source_word: חָטְאוּ לָךְ
  choice: waliokutenda dhambi
  rationale: Kihusishi ל huonyesha kwamba Mungu ndiye aliyekosewa. “Kukutenda dhambi” ni usemi wa kawaida wa Kiswahili unaohifadhi mwelekeo huo.
- source_word: וּלְכָל פִּשְׁעֵיהֶם
  choice: pamoja na makosa yao yote
  rationale: פשע inaweza kumaanisha kosa zito au uasi. “Makosa” ni ya asili katika muundo wa kusamehe watu pamoja na makosa yao, huku tanbihi ikihifadhi maana kali zaidi ya “maasi.”
- source_word: אֲשֶׁר פָּשְׁעוּ בָךְ
  choice: waliyokutendea
  rationale: Hii inaonyesha kwamba makosa hayo yalielekezwa dhidi ya Mungu bila kurudia kwa njia isiyo ya kawaida maneno yenye mzizi mmoja. Maana ya uasi imehifadhiwa katika tanbihi.
- source_word: וּנְתַתָּם לְרַחֲמִים
  choice: Uwajaalie wapate huruma
  rationale: Muundo wa נתן pamoja na רחמים humwomba Mungu awaweke katika hali ya kuhurumiwa. “Uwajaalie wapate huruma” ni wa asili na humwonyesha Mungu kuwa chanzo cha fadhili hiyo.
- source_word: לִפְנֵי שֹׁבֵיהֶם
  choice: mbele ya wale waliowachukua mateka
  rationale: Tafsiri hii inaonyesha wazi maana ya participio שֹׁבֵי na kuhifadhi wazo la kuwa mbele au katika mamlaka ya waliowateka.
- source_word: וְרִחֲמוּם
  choice: ili wawahurumie
  rationale: “Ili” huonyesha kusudi au matokeo yanayotarajiwa, na “wawahurumie” huhifadhi uhusiano wa kimatamshi na “huruma” katika kishazi kilichotangulia.
theological_decisions:
- issue: Uhusiano kati ya msamaha wa Mungu na huruma ya watekaji
  choice: Mstari unaomba Mungu awasamehe watu wake na kuwajaalia wahurumiwe na waliowateka.
  alternative: 'Kishazi cha mwisho kinaweza kueleweka kama matokeo ya moja kwa moja: “nao watawahurumia.”'
  rationale: Mfuatano wa Kiebrania unaunganisha msamaha wa Mungu na kuwapa watu wake huruma mbele ya watekaji wao, lakini וְ inaweza kuwasilisha kusudi au matokeo. Tanbihi inahifadhi uwezekano huo bila kulazimisha hitimisho la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sala umehifadhiwa, huku marudio yasiyo ya asili yakiepukwa. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno au vishazi vinavyohusika.
