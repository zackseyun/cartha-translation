  to: Uwasamehe watu wako waliokutenda dhambi dhidi yako, na maasi yao yote waliyokuasi[a]. Uwajalie rehema mbele ya watekaji wao, ili wawahurumie.[b]
  rationale: The revision strengthens fidelity to the repeated פשע wordplay by using “maasi ... waliyokuasi,” explicitly identifies God as the one sinned against, and renders the compassion idiom more naturally. It preserves the source’s purpose/result ambiguity in footnote b and retains correctly placed anchors.
