  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תְּחִנַּ֤ת עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע אֶל מְק֤וֹם שִׁבְתְּ/ךָ֙ אֶל הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/030.yaml
  text: And hear the plea of your servant and of your people Israel when they pray toward this place[a]. And hear in heaven, the place of your dwelling[b]; hear and forgive.
translation:
  language: sw
  text: Usikie dua ya mtumishi wako na ya watu wako Israeli wanapoomba wakielekea mahali hapa[a]. Nawe usikie huko mbinguni, mahali pa makao yako[b]; usikie na usamehe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mahali hapa.” Kiebrania kinaweza kutafsiriwa hivyo kwa uhalisi zaidi, lakini “wakielekea mahali hapa” kinaonyesha vizuri kwamba sala inaelekezwa upande wa hekalu.
    reason: lexical_alternative
  - marker: b
    text: Au, “mahali unapokaa mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִנַּת
  choice: dua
  rationale: Neno hili linaashiria ombi la dhati la kutafuta kibali au rehema; “dua” ni neno la Kiswahili sanifu linalofaa katika muktadha wa sala ya unyenyekevu.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika sala ya kifalme kwa Mungu, neno hili ni namna ya kujitaja kwa unyenyekevu na kujitiisha; “mtumishi wako” linafaa zaidi kuliko “mtumwa wako” katika muktadha huu.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: watu wako Israeli
  rationale: Huhifadhi uhusiano wa moja kwa moja unaomtambulisha Israeli kuwa watu wa Mungu.
- source_word: יִתְפַּלְלוּ
  choice: watakaposali
  rationale: Kitenzi hiki ndicho kitenzi cha kawaida cha kuomba kwa Mungu; muundo wa wakati unaonyesha tukio la baadaye katika muktadha wa ombi hili.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: wakielekea mahali hapa
  rationale: Kihusishi kinaweza kumaanisha “kwa” au mwelekeo wa kuelekea; hapa mwelekeo wa sala kuelekea hekalu unaelezwa kwa Kiswahili cha kawaida.
- source_word: מְקוֹם שִׁבְתְּךָ
  choice: mahali unapokaa
  rationale: Hutoa kwa lugha ya asili maana ya mahali pa makao ya Mungu bila kuwa nzito kupita kiasi.
- source_word: אֶל הַשָּׁמַיִם
  choice: huko mbinguni
  rationale: Ingawa kihusishi kwa kawaida ni “kwa/kuelekea,” muundo huu pamoja na kusikia na mahali pa makao una maana ya mahali Mungu alipo; “huko mbinguni” ni ya kawaida na huhifadhi msisitizo huo.
- source_word: וְשָׁמַעְתָּ
  choice: usikie
  rationale: Katika sala, “kusikia” humaanisha kusikiliza kwa makini na kuitikia; hali ya ombi inafaa katika Kiswahili.
- source_word: וְסָלָחְתָּ
  choice: usamehe
  rationale: Hiki ndicho kitenzi cha kawaida na wazi cha msamaha wa Mungu.
theological_decisions:
- issue: Makao ya Mungu na mbingu katika teolojia ya hekalu
  choice: Sala inaelekezwa mahali pa hekalu, huku mbingu zikibaki mahali pa makao ya Mungu.
  alternative: Kutafsiri kwamba watu wanasali ndani ya hekalu, au kwamba Mungu anasikia kutoka mbinguni.
  rationale: Andiko linashikilia pamoja hekalu la duniani kama kitovu cha kuelekeza sala na mbingu kama makao ya Mungu; tafsiri haiondoi mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa urahisi. Muundo wa ombi “usikie… usamehe” huhifadhi sauti ya sala ya Sulemani; “Nawe” huonyesha wazi mabadiliko kutoka kwa wanaosali hadi kwa Mungu anayesikia.
