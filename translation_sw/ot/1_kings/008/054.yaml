  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת שְׁלֹמֹ֗ה לְ/הִתְפַּלֵּל֙ אֶל יְהוָ֔ה אֵ֛ת כָּל הַ/תְּפִלָּ֥ה וְ/הַ/תְּחִנָּ֖ה הַ/זֹּ֑את קָ֞ם מִ/לִּ/פְנֵ֨י מִזְבַּ֤ח יְהוָה֙ מִ/כְּרֹ֣עַ עַל בִּרְכָּ֔י/ו וְ/כַפָּ֖י/ו פְּרֻשׂ֥וֹת הַ/שָּׁמָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/054.yaml
  text: And when Solomon had finished praying to Yahweh with all this prayer and plea for favor[a], he rose from before the altar of Yahweh[b], from kneeling on his knees with his palms spread out toward heaven.
translation:
  language: sw
  text: Sulemani alipomaliza kumwomba Yahweh kwa sala hii yote na dua hii ya kuomba fadhili[a], aliinuka kutoka mbele ya madhabahu ya Yahweh, kutoka katika hali ya kupiga magoti huku viganja vyake vikiwa vimekunjuliwa kuelekea mbinguni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dua hii”; neno la Kiebrania humaanisha ombi la dhati la kutafuta rehema au fadhili.
    reason: lexical_alternative
  - marker: b
    text: Neno kwa neno, “viganja vyake vikiwa vimekunjuliwa kuelekea mbinguni”; tafsiri nyingine husema kwa ujumla zaidi, “mikono yake ikiwa imenyooshwa kuelekea mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: alipomaliza
  rationale: Muundo wa כְּ pamoja na kitenzi-jina huanzisha kishazi cha wakati. Kiswahili cha kawaida huwasilisha maana hiyo kwa ufupi na kwa ufasaha kwa ‘alipomaliza.’
- source_word: לְהִתְפַּלֵּל אֶל יְהוָה
  choice: kumwomba Yahweh
  rationale: Kitenzi התפלל pamoja na אֶל humaanisha kusali au kuomba kwa kuelekezwa kwa Mungu; ‘kumwomba Yahweh’ ni usemi wa kawaida wa Kiswahili na huhifadhi jina la Mungu lililo katika maandishi.
- source_word: אֵת כָּל הַתְּפִלָּה וְהַתְּחִנָּה הַזֹּאת
  choice: kwa sala hii yote na dua hii ya kuomba fadhili
  rationale: תְּפִלָּה ni ‘sala,’ na תְּחִנָּה ni ombi la dhati la kutafuta rehema au fadhili. ‘Dua hii ya kuomba fadhili’ hutofautisha maneno hayo mawili bila kutumia lugha nzito isiyo ya kawaida.
- source_word: קָם מִלִּפְנֵי מִזְבַּח יְהוָה
  choice: aliinuka kutoka pale mbele ya madhabahu ya Yahweh
  rationale: Tafsiri hii huhifadhi badiliko la mkao linaloonyeshwa na קום na maana ya mahali ya מִלִּפְנֵי, huku ikibaki ya kawaida katika Kiswahili.
- source_word: מִכְּרֹעַ עַל בִּרְכָּיו
  choice: ambapo alikuwa amepiga magoti
  rationale: Kiebrania hutaja wazi kupiga magoti. Kishazi hiki cha Kiswahili huonyesha hali aliyokuwa nayo kabla ya kuinuka bila usemi mgumu wa neno kwa neno kama ‘kutoka kupiga magoti juu ya magoti yake.’
- source_word: וְכַפָּיו פְּרֻשׂוֹת הַשָּׁמָיִם
  choice: huku viganja vyake vikiwa vimekunjuliwa kuelekea mbinguni
  rationale: כַּף hurejelea hasa kiganja, na פרשׂ huonyesha kuvipanua au kuvikunjua. ‘Kuelekea mbinguni’ huwasilisha mwelekeo wa ishara hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, YHWH. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya תְּחִנָּה
  choice: dua hii ya kuomba fadhili
  alternative: dua hii / ombi hili la rehema
  rationale: Neno hilo linaweza kumaanisha dua au ombi la dhati la kupata rehema au fadhili. Tafsiri iliyochaguliwa hudokeza maana hiyo bila kuamua kwamba ombi lilihusu msamaha pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imepangwa upya kidogo ili mkao wa Sulemani ueleweke kwa urahisi, lakini maelezo yote ya Kiebrania—mahali, kupiga magoti, viganja, na mwelekeo wa mbinguni—yamehifadhiwa.
