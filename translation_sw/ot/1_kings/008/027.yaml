source:
  edition: WLC
  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֥ב אֱלֹהִ֖ים עַל הָ/אָ֑רֶץ הִ֠נֵּה הַ/שָּׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/027.yaml
  text: For will God indeed dwell on the earth? Behold[a], the heavens, even the highest heavens, cannot contain you[c][b]; how much less this house that I have built!
translation:
  language: sw
  text: Kwa maana, je, kweli Mungu atakaa duniani? Tazama, mbingu, hata mbingu za juu kabisa[a], haziwezi kukutosha[b]; sembuse nyumba hii[c] niliyoijenga!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mbingu na mbingu za mbingu,” nahau inayomaanisha mbingu za juu kabisa.'
    reason: lexical_alternative
  - marker: b
    text: Au “haziwezi kukuweka ndani.”
    reason: lexical_alternative
  - marker: c
    text: “Nyumba hii” ni hekalu ambalo Sulemani alilijenga.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי הַאֻמְנָם
  choice: Lakini je, kweli
  rationale: Muundo huu unaanzisha swali la balagha lenye mshangao na tafakari. “Kweli” huhifadhi msisitizo wa הַאֻמְנָם, huku “Lakini je” ikiunganisha wazo hili na muktadha kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יֵשֵׁב
  choice: atakaa
  rationale: Kitenzi kinaweza kumaanisha kuketi au kukaa mahali. “Atakaa” ni cha asili katika Kiswahili na kinaweza kueleza uwepo wa Mungu bila kudai kwamba nafasi fulani inamweka ndani.
- source_word: עַל הָאָרֶץ
  choice: duniani
  rationale: Hapa dunia inatofautishwa na mbingu; “duniani” ndiyo namna ya kawaida na wazi ya kueleza tofauti hiyo kwa Kiswahili.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa msisitizo na linafaa kwa lugha ya sala yenye hadhi.
- source_word: וּשְׁמֵי הַשָּׁמַיִם
  choice: hata mbingu za juu kabisa
  rationale: Hii ni nahau ya Kiebrania ya kiwango cha juu kabisa, kihalisi “mbingu za mbingu.” Tafsiri hii inawasilisha maana yake kwa uwazi, huku tanbihi ikihifadhi umbo la asili.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: haziwezi kukutosha
  rationale: Kitenzi kinaeleza uwezo wa nafasi kumpokea au kumweka ndani. “Kukutosha” ni usemi wa asili unaohifadhi wazo kwamba hata mbingu hazina uwezo wa kumchukua Mungu kikamilifu.
- source_word: אַף כִּי
  choice: sembuse
  rationale: '“Sembuse” huonyesha hoja ya kutoka jambo kubwa kwenda dogo: ikiwa hata mbingu haziwezi kumtosha Mungu, nyumba hii haiwezi hata zaidi.'
- source_word: הַבַּיִת הַזֶּה אֲשֶׁר בָּנִיתִי
  choice: nyumba hii niliyoijenga
  rationale: “Nyumba” huhifadhi neno la Kiebrania na dhamira ya hekalu kama nyumba, na “niliyoijenga” huonyesha tendo lililokamilika.
theological_decisions:
- issue: Ukuu wa Mungu usiozuiliwa na mahali dhidi ya uwepo wake hekaluni
  choice: Kuhifadhi swali la balagha na tamko kwamba hata mbingu za juu kabisa haziwezi kumtosha Mungu, bila kukana uwepo wake wa agano hekaluni.
  alternative: Kutafsiri kwamba Mungu hakai kabisa duniani, au kwamba hekalu linaweza kumweka Mungu ndani yake.
  rationale: Kiebrania kinashikilia kwa pamoja mshangao kwamba Mungu atakaa duniani na ukweli kwamba hakuna sehemu ya uumbaji inayoweza kumtosha. Tafsiri haiondoi mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa wasomaji wa kawaida. “Tazama” na “sembuse” huhifadhi nguvu ya balagha bila kufanya sentensi kuwa ya kizamani.
