lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: basi usikie
  rationale: Kitenzi katika mfululizo wa masharti ya awali kinaeleweka kama ombi kwa Mungu; “basi” huonyesha matokeo kwa Kiswahili cha kawaida.
- source_word: הַשָּׁמַיִם
  choice: mbinguni
  rationale: Kiebrania kina neno lenye umbo la wingi, “mbingu,” bila kihusishi; katika mtindo huu wa sala, “usikie mbinguni” ni Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa kuelewa “kutoka mbinguni.”
- source_word: תְּפִלָּתָם
  choice: sala yao
  rationale: תְּפִלָּה ni neno la jumla kwa sala; umoja wenye kiambishi cha wingi unatafsiriwa kiasili kama sala yao ya pamoja.
- source_word: תְּחִנָּתָם
  choice: dua yao
  rationale: תְּחִנָּה ni ombi la dhati la kuomba fadhili au rehema; “dua” hulitofautisha kwa ufupi na neno la jumla “sala.”
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: na uwatendee haki
  rationale: Nahau hiyo kwa neno moja moja ni “ufanye hukumu/haki yao,” lakini maana yake ni kutekeleza haki kwa niaba yao au kuitetea hoja yao. “Uwatendee haki” ni ya asili na huhifadhi maana ya kimahakama.
theological_decisions:
- issue: Nahau ya kimahakama katika ombi kwa Mungu
  choice: na uwatendee haki
  alternative: na uitetee hoja yao; na utekeleze haki kwa ajili yao
  rationale: Tafsiri inaonyesha ombi la Mungu kutenda kwa haki kwa niaba yao bila kudai mapema kwamba kila dai lao ni sahihi, wala kuingiza fundisho finyu lisilomo katika nahau ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sala iliyo ya heshima lakini rahisi kueleweka. “Sala” na “dua” zimetumiwa pamoja ili kuhifadhi utofauti wa maneno mawili ya Kiebrania; alama za tanbihi zote zimewekwa katika matini kuu.
