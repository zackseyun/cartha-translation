source:
  edition: WLC
  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/סָ֨לַחְתָּ֜ לְ/חַטַּ֤את עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל כִּ֥י תוֹרֵ֛/ם אֶת הַ/דֶּ֥רֶךְ הַ/טּוֹבָ֖ה אֲשֶׁ֣ר יֵֽלְכוּ בָ֑/הּ וְ/נָתַתָּ֤ה מָטָר֙ עַל אַרְצְ/ךָ֔ אֲשֶׁר נָתַ֥תָּה לְ/עַמְּ/ךָ֖ לְ/נַחֲלָֽה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/036.yaml
  text: then may you hear in heaven and forgive the sin of your servants[a], your people Israel, when you teach them the good way in which they should walk. And may you give rain on your land[b], which you have given to your people as an inheritance.
translation:
  language: sw
  text: Basi usikie huko mbinguni[a] na usamehe dhambi ya watumishi wako, watu wako Israeli, utakapowafundisha njia njema wanayopaswa kuifuata[b]. Na ulete mvua juu ya nchi yako, ambayo umewapa watu wako kuwa urithi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usikie kutoka mbinguni.” Kiebrania kinasema kihalisi “usikie mbingu,” bila kihusishi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kuwa unawafundisha njia njema wanayopaswa kuifuata.” Neno la Kiebrania כִּי linaweza hapa kueleweka kama “wakati” au “kwa kuwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: usikie ukiwa mbinguni
  rationale: Kiebrania hakina kihusishi kinachoeleza wazi kama Mungu anasikia akiwa mbinguni au kutoka mbinguni. Tafsiri kuu inaeleza mahali alipo msikiaji kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: usamehe dhambi
  rationale: Katika muktadha huu חַטָּאת ni kosa linalohitaji msamaha, si sadaka ya dhambi; hivyo “dhambi” ndiyo tafsiri ya moja kwa moja.
- source_word: עֲבָדֶיךָ וְעַמְּךָ יִשְׂרָאֵל
  choice: watumishi wako na watu wako Israeli
  rationale: “Watumishi” linafaa kwa watu walio chini ya mamlaka ya Mungu bila kusisitiza hali ya utumwa. Kiunganishi וְ kimetafsiriwa wazi kama “na,” bila kulazimisha kwamba vikundi hivyo viwili ni kitu kimoja.
- source_word: כִּי תוֹרֵם
  choice: kwa kuwa unawafundisha
  rationale: כִּי kwa maana yake ya kawaida inaweza kuanzisha sababu, na Hiphil ya ירה humaanisha kufundisha au kuelekeza. Maana ya wakati, “utakapowafundisha,” imehifadhiwa katika tanbihi.
- source_word: הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ בָהּ
  choice: njia njema wanayopaswa kuiendea
  rationale: Hii inadumisha sitiari ya “njia” na “kuenda” kwa mwenendo wa maisha, huku “wanayopaswa” ikionyesha mwenendo unaotarajiwa.
- source_word: וְנָתַתָּה מָטָר
  choice: Na ulete mvua
  rationale: Ingawa kitenzi ni “kutoa/kupa,” Kiswahili cha kawaida husema Mungu analeta mvua. Muundo wa ombi “ulete” unaendeleza sauti ya sala.
- source_word: עַל אַרְצְךָ
  choice: juu ya nchi yako
  rationale: Kiwakilishi cha nafsi ya pili kimehifadhiwa ili kuonyesha kwamba nchi bado ni ya Mungu.
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: ambayo umewapa watu wako iwe urithi wao
  rationale: נַחֲלָה ni urithi au milki ya kurithi; “iwe urithi wao” ni ya kawaida na inahifadhi wazo la zawadi ya agano.
theological_decisions:
- issue: Umiliki wa Mungu na nchi kutolewa kwa Israeli
  choice: nchi yako, ambayo umewapa watu wako iwe urithi wao
  alternative: nchi uliyowapa watu wako kuwa urithi wao
  rationale: Tafsiri iliyochaguliwa inadumisha kwa pamoja umiliki wa Mungu unaoonyeshwa na kiambishi cha nafsi ya pili na ukweli kwamba aliwapa watu wake nchi hiyo kuwa urithi.
- issue: Uhusiano wa “watumishi wako” na “watu wako Israeli”
  choice: watumishi wako na watu wako Israeli
  alternative: watumishi wako, yaani watu wako Israeli
  rationale: Kiebrania kina kiunganishi וְ (“na”). Kukihifadhi huepuka kuamua bila lazima kwamba usemi wa pili ni ufafanuzi kamili wa wa kwanza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa msomaji wa kawaida. Muundo wa maombi umetumiwa katika “usikie,” “usamehe,” na “ulete,” na sitiari ya njia ya maisha imehifadhiwa.
