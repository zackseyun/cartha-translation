  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/023.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven above or on earth beneath[b], keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: sw
  text: Akasema, “Ee Yahweh, Mungu wa Israeli, hakuna Mungu aliye kama wewe mbinguni juu wala duniani chini, wewe unayeshika agano na upendo mwaminifu kwa watumishi wako wanaotembea mbele zako kwa mioyo yao yote.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Akasema
  rationale: Wayyiqtol ya kisimulizi imetafsiriwa kwa wakati uliopita unaoendelea kiasili katika Kiswahili; kiunganishi ‘na’ si lazima kila mara mwanzoni mwa sentensi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo huu wa kumwita Mungu ni wa kawaida, wazi, na mwaminifu kwa hali ya uambatano ya Kiebrania.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: hakuna Mungu aliye kama wewe
  rationale: Huhifadhi dai la kwamba Yahweh hana anayelingana naye, bila kulifanya kuwa kauli pana zaidi kuliko ilivyo katika chanzo.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת
  choice: mbinguni juu wala duniani chini
  rationale: Jozi hii inaeleza upeo wote wa juu na chini; ‘wala’ ni ya asili baada ya kauli hasi ya Kiswahili.
- source_word: שֹׁמֵר הַבְּרִית
  choice: wewe unayeshika agano
  rationale: Kishiriki kinachoendelea kinamfafanua Yahweh; ‘kushika agano’ ni Kiswahili cha kawaida kinachodumisha sitiari ya chanzo.
- source_word: וְהַחֶסֶד
  choice: na kudumisha upendo mwaminifu
  rationale: Hesed katika muktadha wa agano huunganisha upendo na uaminifu wa kudumu; kitenzi ‘kudumisha’ kinafanya tungo iwe ya asili pamoja na ‘agano’.
- source_word: לַעֲבָדֶיךָ
  choice: kwa watumishi wako
  rationale: ‘Watumishi’ linafaa katika uhusiano wa ibada na agano kuliko neno linalosisitiza utumwa wa kijamii.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: wanaoishi mbele zako
  rationale: ‘Kutembea mbele za’ ni nahau ya Kiebrania inayomaanisha mwenendo wa maisha katika uwepo wa Mungu; ‘wanaoishi’ huwasilisha maana hiyo kwa Kiswahili cha sasa.
- source_word: בְּכָל לִבָּם
  choice: kwa moyo wao wote
  rationale: Huwasilisha kujitoa kwa ndani bila kugawanyika na kudumisha taswira ya moyo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Unukuzi huhifadhi jina binafsi la Mungu wa Israeli na kulitofautisha na cheo.
- issue: Maana ya חֶסֶד katika muktadha wa agano
  choice: upendo mwaminifu
  alternative: fadhili; rehema; upendo wa kudumu
  rationale: ‘Upendo mwaminifu’ huhifadhi kwa pamoja hisia ya upendo na uaminifu wa agano bila kuifupisha kuwa rehema pekee.
- issue: Maana ya ‘kutembea mbele zako’
  choice: wanaoishi mbele zako
  alternative: wanaotembea mbele zako
  rationale: Uchaguzi huu unaonyesha kwamba ni nahau ya mwenendo mzima wa maisha katika uwepo wa Mungu, si mwendo wa kimwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sala na jina Yahweh vimehifadhiwa; nahau ngumu ya Kiebrania imewasilishwa kwa lugha inayoeleweka bila kuondoa uzito wa kiagano.
