  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֜אתִי אֶת עַמִּ֣/י אֶת יִשְׂרָאֵל֮ מִ/מִּצְרַיִם֒ לֹֽא בָחַ֣רְתִּי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔ד לִֽ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/016.yaml
  text: From the day that I brought my people Israel out of Egypt[a], I have not chosen a city from all the tribes of Israel to build a house for my name to be there[b], but I chose David to be over my people Israel.
translation:
  language: sw
  text: Tangu siku nilipowatoa watu wangu Israeli nchini Misri, sikuchagua mji wowote katika kabila lolote la Israeli ili kujenga nyumba ili jina langu liwe huko[b]; lakini[a] nilimchagua Daudi awe juu ya watu wangu Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “na nilimchagua Daudi.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa “na,” lakini muktadha unapendelea utofauti: hakuna mji uliokuwa umechaguliwa, ilhali Daudi alikuwa amechaguliwa.'
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ili jina langu liwe huko” ni usemi wa Kiebrania unaomaanisha mahali patakatifu panapohusishwa na jina na uwepo wa BWANA; yaani, hekalu.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵאתִי
  choice: nilipowatoa
  rationale: Hifili ya יצא ina maana ya kusababisha watoke. “Nilipowatoa” ni Kiswahili cha kawaida kinachohifadhi maana ya kisababishi na kumbukumbu ya kutoka Misri.
- source_word: עַמִּי אֶת־יִשְׂרָאֵל
  choice: watu wangu Israeli
  rationale: Muundo huu wa ufafanuzi unawatambulisha “watu wangu” kuwa Israeli, huku ukihifadhi lugha ya uhusiano wa agano.
- source_word: לֹא בָחַרְתִּי בְעִיר
  choice: sikuchagua mji wowote
  rationale: “Sikuchagua mji wowote” ni usemi wa asili wa Kiswahili unaowasilisha wazi ukanushaji wa בחר bila kubadili maana kuwa uteuzi wa aina nyingine.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: kutoka katika makabila yote ya Israeli
  rationale: Tafsiri hii inafuata kwa karibu kihusishi cha Kiebrania na kuonyesha kwamba mji huo ungekuwa mji unaohusishwa na mojawapo ya makabila ya Israeli.
- source_word: לִבְנוֹת בַּיִת
  choice: ili nijenge nyumba
  rationale: בַּיִת ni “nyumba” kwa maana ya moja kwa moja. Msemaji ni Mungu, kwa hiyo muundo wa kusudi “ili nijenge” unaweka wazi mhusika aliyedokezwa na kitenzi-jina cha Kiebrania bila kubadili marejeo yake.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: ambamo jina langu litakuwamo
  rationale: Huhifadhi dhana ya jina la Mungu kuwapo mahali hapo, bila kuongeza kitenzi “kukaa” ambacho hakimo katika Kiebrania.
- source_word: וָאֶבְחַר בְּדָוִד
  choice: lakini nilimchagua Daudi
  rationale: Waw inaweza kutafsiriwa “na,” lakini muktadha unaonyesha utofauti kati ya kutokuchaguliwa kwa mji na kuchaguliwa kwa Daudi. “Lakini” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: לִהְיוֹת עַל־עַמִּי יִשְׂרָאֵל
  choice: awe juu ya watu wangu Israeli
  rationale: “Awe juu ya” huhifadhi usemi wa Kiebrania na mamlaka ya Daudi bila kuufafanua zaidi kwa neno kama “atawale.”
theological_decisions:
- issue: Teolojia ya hekalu katika usemi “nyumba ambamo jina langu litakuwamo”
  choice: Kuhifadhi “nyumba” na “jina langu litakuwamo” badala ya kuweka moja kwa moja “hekalu” au “mahali nitakapokaa.”
  alternative: “hekalu kwa ajili ya jina langu” au “nyumba ambamo jina langu litakaa”
  rationale: Kiebrania kinatumia “nyumba” na kitenzi “kuwa.” Tafsiri hii huhifadhi lugha ya kitheolojia kuhusu jina la BWANA bila kuifanya iwe maelezo mapana kuliko andiko.
- issue: Utofauti kati ya mji ambao haukuchaguliwa na Daudi aliyechaguliwa
  choice: Kutafsiri ו kwa “lakini.”
  alternative: “na nilimchagua Daudi”
  rationale: Muktadha unatofautisha kutokuchaguliwa kwa mji na kuchaguliwa kwa Daudi. Tanbihi huhifadhi uwezekano halisi wa kuisoma waw kama kiunganishi cha kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa wasomaji wa kawaida huku ukihifadhi nahau ya “nyumba” na “jina,” pamoja na usemi wa mamlaka “awe juu ya.”
