  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤ד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֤י/ךָ אֶת דַּרְכָּ/ם֙ לָ/לֶ֣כֶת לְ/פָנַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/025.yaml
  text: And now[a], Yahweh, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man shall not be cut off from before me for you, one sitting on the throne of Israel, if only your sons keep their way, by walking before me as you have walked before me.’
translation:
  language: sw
  text: 'Basi sasa, Yahwe, Mungu wa Israeli, utimize kwa ajili ya mtumishi wako Daudi, baba yangu, yale uliyomwambia, ukisema: “Hutakosa mtu atakayeketi kwenye kiti cha enzi cha Israeli mbele zangu[a], mradi tu wanao wazingatie mwenendo wao kwa kuenenda mbele zangu kama wewe ulivyoenenda mbele zangu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa maneno halisi zaidi: “Mtu hatakatiliwa mbali kwa ajili yako kutoka mbele zangu, aketiye kwenye kiti cha enzi cha Israeli.”'
    reason: Nahau ya Kiebrania לֹא יִכָּרֵת לְךָ אִישׁ imetafsiriwa kwa njia ya kawaida katika matini kuu; tanbihi huhifadhi picha ya “kukatiliwa mbali,” pamoja na “kwa ajili yako” na “kutoka mbele zangu.”
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: שְׁמֹר
  choice: mtimizie
  rationale: Katika ombi ambalo ahadi ndiyo kiima-tendwa, kitenzi hiki kina maana ya kushika au kutimiza ahadi; “mtimizie” ni Kiswahili cha kawaida na huonyesha kuwa manufaa yake yanamhusu Daudi.
- source_word: לְעַבְדְּךָ דָוִד אָבִי
  choice: mtumishi wako Daudi, baba yangu
  rationale: “Mtumishi” linafaa katika lugha ya agano na unyenyekevu mbele za Mungu; vir koma vinafafanua kuwa Daudi ndiye baba ya msemaji.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לּוֹ
  choice: yale uliyomwambia
  rationale: Huhifadhi maana ya msingi ya kusema bila kuongeza moja kwa moja neno “kuahidi,” ingawa muktadha unaonyesha kuwa maneno hayo ni ahadi.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מִלְּפָנַי
  choice: Hutakosa mtu mbele zangu
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza nahau ya Kiebrania kuhusu kutokatika kwa mwendelezo wa nasaba; maana halisi zaidi imeonyeshwa katika tanbihi.
- source_word: יֹשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: wa kuketi kwenye kiti cha enzi cha Israeli
  rationale: Kishazi hiki kinaeleza jukumu la huyo mtu kwa Kiswahili fasaha huku kikihifadhi picha ya kuketi kwenye kiti cha enzi.
- source_word: רַק אִם
  choice: mradi tu
  rationale: Huonyesha sharti lenye mkazo bila kulipunguza au kuliondoa.
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: wanao waangalie mwenendo wao
  rationale: Nahau ya kushika au kulinda njia imetolewa kwa Kiswahili cha kawaida kama kuangalia mwenendo.
- source_word: לָלֶכֶת לְפָנַי
  choice: kwa kuenenda mbele zangu
  rationale: “Kwa” huonyesha kuwa kuenenda mbele za Mungu ndiyo namna ya kuangalia mwenendo; “kuenenda” huhifadhi sitiari ya Kiebrania kwa lugha yenye hadhi.
- source_word: כַּאֲשֶׁר הָלַכְתָּ לְפָנָי
  choice: kama wewe ulivyoenenda mbele zangu
  rationale: Kiwakilishi “wewe” kinaweka wazi kwamba ndani ya dondoo Mungu anamwelekea Daudi, na kirai kinahifadhi ulinganisho wa maandishi.
theological_decisions:
- issue: Sharti katika ahadi kwa Daudi
  choice: Ahadi ya mwendelezo wa nasaba imewasilishwa pamoja na sharti la wazi kuhusu mwenendo wa wana wa Daudi.
  alternative: Kuieleza ahadi kuwa haina sharti, huku sharti likihusu tu jinsi manufaa yake yatakavyofurahiwa.
  rationale: רַק אִם huanzisha sharti dhahiri. Tafsiri inalihifadhi bila kuamua mvutano wake na vifungu vingine kuhusu agano la Daudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kiti cha enzi” na “kuenenda mbele zangu” huhifadhi taswira za kifalme na kimaadili za Kiebrania bila kufanya sentensi kuwa ngumu kueleweka.
