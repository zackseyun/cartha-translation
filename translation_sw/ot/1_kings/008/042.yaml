base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/042.yaml
  text: for they will hear of your great name[a], and of your mighty hand and your outstretched arm, and he will come and pray toward this house—
translation:
  language: sw
  text: Kwa maana watasikia habari za jina lako kuu, na za mkono wako wenye nguvu na mkono wako ulionyoshwa; naye atakuja[a] na kusali kuelekea nyumba hii—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hubadilika kutoka wingi (‘watasikia’) kwenda umoja (‘atakuja’), huenda kikihama kutoka kwa wageni kwa jumla hadi kwa mgeni mmoja anayewakilisha wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza sababu au maelezo ya ombi lililotangulia, bila kuibadili kuwa sharti la wakati.
- source_word: יִשְׁמְעוּן
  choice: watasikia habari za
  rationale: Wakati ujao unafaa katika sala ya Sulemani, na usemi huu wa Kiswahili unaonyesha kusikia sifa au taarifa kuhusu jambo.
- source_word: אֶת שִׁמְךָ הַגָּדוֹל
  choice: jina lako kuu
  rationale: Inahifadhi taswira ya ‘jina,’ ambayo hapa pia hubeba wazo la sifa na umaarufu wa Mungu, bila kuigeuza kuwa ufafanuzi tu.
- source_word: יָדְךָ הַחֲזָקָה
  choice: mkono wako wenye nguvu
  rationale: Ni Kiswahili cha kawaida na chenye heshima kinachohifadhi taswira halisi ya nguvu za Mungu.
- source_word: זְרֹעֲךָ הַנְּטוּיָה
  choice: mkono wako ulionyoshwa
  rationale: Kiswahili hutumia ‘mkono’ kwa hand na arm; usemi huu unahifadhi taswira ya Mungu akitenda kwa nguvu.
- source_word: וּבָא
  choice: naye atakuja
  rationale: Kiwakilishi cha umoja kinahifadhi badiliko la Kiebrania kutoka wingi wa wageni kwa jumla hadi mgeni mmoja anayewakilisha wengine.
- source_word: וְהִתְפַּלֵּל
  choice: na kusali
  rationale: Kitenzi kinaunganishwa kwa kawaida na ‘atakuja,’ huku mhusika wa umoja akiendelea kueleweka.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: akielekea nyumba hii
  rationale: ‘Akielekea’ linaonyesha mwelekeo wa sala kuelekea hekalu bila kudai kwamba mhusika anaingia ndani yake.
theological_decisions:
- issue: Lugha ya kumwelezea Mungu kwa viungo vya mwili
  choice: Kuhifadhi ‘mkono’ katika matini kuu
  alternative: Kutafsiri kwa dhana kama ‘nguvu’ au ‘uwezo’
  rationale: Kiebrania kinatumia taswira halisi ya mkono ulio na nguvu na ulionyoshwa. Taswira hiyo ni muhimu kifasihi na kiteolojia, hivyo haipaswi kufupishwa kuwa dhana isiyo na picha.
- issue: Badiliko la mhusika kutoka wingi kwenda umoja
  choice: ‘watasikia ... naye atakuja’
  alternative: 'Kulainisha yote yawe wingi: ‘watasikia ... watakuja na kusali’'
  rationale: Kiebrania hubadilika wazi kutoka wageni kwa jumla kwenda kwa mgeni mmoja anayewakilisha kundi. Tafsiri inahifadhi badiliko hilo badala ya kulisawazisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Habari za jina lako’ ni usemi unaoeleweka kwa urahisi; ‘mkono wako wenye nguvu’ na ‘mkono wako ulionyoshwa’ huhifadhi urudiaji na taswira ya Kiebrania. Alama ya mwisho ya mstari mrefu imehifadhiwa kwa kuwa sentensi inaendelea katika mstari unaofuata.
