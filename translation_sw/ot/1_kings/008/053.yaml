  text: כִּֽי אַתָּ֞ה הִבְדַּלְתָּ֤/ם לְ/ךָ֙ לְֽ/נַחֲלָ֔ה מִ/כֹּ֖ל עַמֵּ֣י הָ/אָ֑רֶץ כַּ/אֲשֶׁ֨ר דִּבַּ֜רְתָּ בְּ/יַ֣ד מֹשֶׁ֣ה עַבְדֶּ֗/ךָ בְּ/הוֹצִיאֲ/ךָ֧ אֶת אֲבֹתֵ֛י/נוּ מִ/מִּצְרַ֖יִם אֲדֹנָ֥/י יְהוִֽה־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/053.yaml
  text: For you set them apart for yourself as an inheritance from all the peoples of the earth[a], just as you spoke by the hand of Moses your servant when you brought our fathers out from Egypt[c][b], Lord GOD.
translation:
  language: sw
  text: Kwa maana uliwatenga kwa ajili yako kuwa urithi wako kutoka miongoni mwa mataifa yote ya dunia, kama ulivyosema kwa mkono wa Musa[a], mtumishi wako, ulipowatoa baba zetu[b] kutoka Misri, Bwana Yahwe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia Musa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mababu zetu.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “Bwana YHWH.” “Yahwe” ni namna ya kuwakilisha jina la Mungu YHWH.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבְדַּלְתָּם
  choice: uliwatenga
  rationale: Hifili ya בדל ina maana ya kutenganisha au kuweka kando. “Uliwatenga” ni ya kawaida na inadumisha wazo la Israeli kutengwa na mataifa mengine.
- source_word: לְךָ לְנַחֲלָה
  choice: kwa ajili yako kuwa urithi wako
  rationale: Muundo huu unaonyesha kwamba watu hao walitengwa wawe mali ya Mungu mwenyewe. “Urithi” inadumisha sitiari ya agano iliyomo katika נחלה.
- source_word: מִכֹּל עַמֵּי הָאָרֶץ
  choice: kutoka miongoni mwa mataifa yote ya dunia
  rationale: “Kutoka miongoni mwa” huonyesha uteuzi kutoka katika kundi pana, na “mataifa yote ya dunia” hudumisha upeo wa jumla wa maneno ya Kiebrania.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: kama ulivyosema
  rationale: Huwasilisha ulinganifu kati ya tendo la Mungu na neno lake la awali kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בְּיַד מֹשֶׁה
  choice: kwa mkono wa Musa
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania inayomwonyesha Musa kuwa wakala ambaye Mungu alitumia; maana ya “kupitia Musa” imeelezwa katika tanbihi.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Katika muktadha huu עבד ni cheo cha heshima kinachoeleza huduma ya Musa kwa Mungu; “mtumishi” inafaa kuliko “mtumwa.”
- source_word: בְּהוֹצִיאֲךָ
  choice: ulipowatoa
  rationale: ב pamoja na kitenzi-jina huonyesha wakati au hali ya tendo; “ulipowatoa” ni Kiswahili asilia kinachodumisha maana hiyo.
- source_word: אֶת אֲבֹתֵינוּ
  choice: baba zetu
  rationale: Tafsiri hii inadumisha umbo la kiume la אבות na lugha ya kihistoria ya vizazi vilivyotangulia, huku “mababu zetu” ikiwezekana pia.
- source_word: מִמִּצְרַיִם
  choice: Misri
  rationale: Pamoja na kitenzi “kuwatoa,” jina “Misri” peke yake huwasilisha kwa kawaida maana ya kutoka Misri bila kuhitaji kihusishi kingine.
- source_word: אֲדֹנָי יְהוִה
  choice: Bwana Yahwe
  rationale: “Bwana” hutafsiri אֲדֹנָי, na “Yahwe” hudumisha jina la agano יהוה badala ya kulificha chini ya cheo kingine.
theological_decisions:
- issue: Jinsi ya kutafsiri אֲדֹנָי יְהוִה
  choice: Bwana Yahwe
  alternative: Bwana MUNGU
  rationale: Maandishi yana cheo אֲדֹנָי pamoja na jina la Mungu יהוה. “Bwana Yahwe” hudumisha vipengele vyote viwili na huepuka kurudia “Bwana Bwana.”
- issue: Israeli kuitwa נחלה ya Mungu
  choice: urithi wako
  alternative: mali yako
  rationale: “Urithi” hudumisha sitiari halisi na mvutano wa kiteolojia wa watu kuwa urithi wa Mungu; “mali” ingefafanua maana lakini ingeondoa sitiari hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Nahau “kwa mkono wa Musa” imedumishwa kwa sababu inaeleweka katika muktadha wa kibiblia, huku njia ya kawaida zaidi ikitolewa katika tanbihi.
