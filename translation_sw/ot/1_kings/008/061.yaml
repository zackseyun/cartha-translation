base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/061.yaml
  text: Let your heart therefore be wholly with Yahweh our God[a], to walk in his statutes and to keep his commandments[b], as at this day.
translation:
  language: sw
  text: Basi mioyo yenu na iwe mikamilifu[a] kwa Yahwe, Mungu wetu, ili mwenende katika sheria zake na kuzishika amri zake, kama ilivyo leo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “isiyogawanyika”: “mioyo yenu na iwe isiyogawanyika kwa Yahwe, Mungu wetu.”'
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kama siku hii”; siku ya sasa inatajwa kuwa mfano au ushahidi wa kujitoa huko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: na iwe
  rationale: Katika muktadha huu, muundo huo una nguvu ya himizo; “na iwe” ni usemi wa kawaida wa Kiswahili unaoonyesha wito, si utabiri tu.
- source_word: לְבַבְכֶם
  choice: mioyo yenu
  rationale: Neno la Kiebrania linamaanisha utu wa ndani, hasa nia na uaminifu wa kujitoa. Wingi wa Kiswahili unasikika kwa kawaida unapolihutubia kundi zima.
- source_word: שָׁלֵם
  choice: kamili
  rationale: Hapa linaonyesha ukamilifu au kutogawanyika kwa kujitoa katika uhusiano wa agano, bila kudai kutokuwa na dhambi kabisa.
- source_word: עִם יְהוָה אֱלֹהֵינוּ
  choice: kwa Yahwe Mungu wetu
  rationale: Ingawa עִם kwa msingi ni “pamoja na,” katika Kiswahili “kamili kwa Yahwe” huwasilisha kwa uwazi mwelekeo wa moyo na uaminifu wa uhusiano bila kuongeza maelezo mengi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: לָלֶכֶת
  choice: mwenende
  rationale: “Kuenenda” huhifadhi sitiari ya Kiebrania ya kutembea, ambayo hapa inahusu mwenendo wa maisha.
- source_word: בְחֻקָּיו
  choice: katika masharti yake
  rationale: חֻקִּים ni maagizo au masharti yaliyowekwa; “masharti” ni neno la sasa na linaloeleweka katika muktadha wa agano.
- source_word: וְלִשְׁמֹר
  choice: na kuzishika
  rationale: Katika lugha ya agano, שׁמר humaanisha kutii au kuzingatia kwa uangalifu; “kushika” huhifadhi usemi wa kibiblia unaoeleweka.
- source_word: מִצְוֺתָיו
  choice: amri zake
  rationale: Hili ni neno la kawaida na la moja kwa moja kwa maagizo yenye mamlaka.
- source_word: כַּיּוֹם הַזֶּה
  choice: kama ilivyo leo
  rationale: Usemi huu unataja siku ya sasa kuwa mfano au ushahidi wa kujitoa kwao; tafsiri hii ni ya kawaida bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Maana ya ukamilifu katika שָׁלֵם
  choice: kamili
  alternative: isiyogawanyika
  rationale: “Kamili” huhifadhi upana wa neno la Kiebrania, ambalo linaweza kumaanisha kujitoa kikamilifu au kwa moyo usiogawanyika, bila kulifanya dai la ukamilifu usio na dhambi.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu; “Yahwe” hulihifadhi jina hilo kwa umbo linalofaa tahajia ya Kiswahili.
- issue: Nguvu ya כַּיּוֹם הַזֶּה
  choice: kama ilivyo leo
  alternative: kama siku hii
  rationale: Tafsiri iliyochaguliwa huhifadhi rejeo la wakati wa sasa na kuliacha wazi kama siku hiyo ni mfano au ushahidi wa utiifu wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Kuenenda” na “kushika amri” huhifadhi taswira za chanzo, huku “kama ilivyo leo” ikifanya nahau ya Kiebrania isikike kwa kawaida.
