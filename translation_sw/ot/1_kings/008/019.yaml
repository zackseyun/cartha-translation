base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/019.yaml
  text: Nevertheless[a], you shall not build the house; rather, your son who comes from your own body, he shall build the house for my name.
translation:
  language: sw
  text: Lakini wewe hutajenga nyumba hiyo; bali mwana wako atakayetoka viunoni mwako[a], ndiye atakayejenga nyumba hiyo kwa ajili ya jina langu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “atakayetoka viunoni mwako”; hii ni nahau ya Kiebrania inayomaanisha uzao wako wa kimwili.
    reason: Ufafanuzi wa nahau ya Kiebrania kuhusu uzao wa kimwili.
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: 'Hapa neno hili linaweka mpaka katika kukubaliwa kwa nia ya Daudi na kuleta utofautishaji: nia yake ilikuwa njema, lakini si yeye atakayejenga.'
- source_word: לֹא תִבְנֶה
  choice: hutajenga
  rationale: Kauli ya wakati ujao yenye ukanushi inahifadhi mvutano kati ya tangazo la Mungu na katazo bila kuamua upande mmoja pekee.
- source_word: הַבָּיִת
  choice: nyumba hiyo
  rationale: Kiebrania kinasema 'nyumba,' si 'hekalu.' Kiashiria 'hiyo' kinaifanya kauli iwe ya kawaida katika Kiswahili huku kikihifadhi istilahi ya chanzo.
- source_word: כִּי אִם
  choice: bali
  rationale: 'Inaonyesha usahihishaji wa kimkinzano: si Daudi, bali mwana wake.'
- source_word: בִּנְךָ
  choice: mwana wako
  rationale: Umoja wenye kiambishi cha nafsi unaelekeza kwa mwana maalumu katika muktadha.
- source_word: הַיֹּצֵא מֵחֲלָצֶיךָ
  choice: atakayetoka katika viuno vyako
  rationale: Tafsiri hii inadumisha taswira halisi ya nahau ya Kiebrania; tanbihi inaeleza maana yake ya uzao wa kimwili.
- source_word: הוּא
  choice: ndiye
  rationale: 'Neno ''ndiye'' linaonyesha mkazo wa kiwakilishi huru: mwana huyo, wala si Daudi, ndiye atakayejenga.'
- source_word: יִבְנֶה הַבַּיִת
  choice: atakayeijenga nyumba hiyo
  rationale: Inarudia kitenzi na nomino kama Kiebrania na kuonyesha tangazo la wakati ujao.
- source_word: לִשְׁמִי
  choice: kwa ajili ya jina langu
  rationale: Inahifadhi usemi wa kibiblia kuhusu nyumba iliyowekwa wakfu kwa jina la Mungu bila kuupanua kiufafanuzi.
theological_decisions:
- issue: Kutafsiri בַּיִת kama 'nyumba' au kuifafanua kuwa 'hekalu'
  choice: nyumba hiyo
  alternative: hekalu
  rationale: Chanzo kinatumia neno 'nyumba.' Ingawa kinachorejelewa ni hekalu, taswira ya nyumba ina uzito wake wa kitheolojia na haipaswi kuondolewa kimya kimya.
- issue: Kauli לֹא תִבְנֶה ni katazo au utabiri
  choice: hutajenga
  alternative: usijenge
  rationale: Kauli 'hutajenga' huhifadhi uwezekano wa kueleweka kama agizo la kimungu na pia tangazo la jambo litakalotokea, badala ya kuifanya katazo pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo 'ndiye atakayeijenga' unahifadhi mkazo wa Kiebrania; 'nyumba hiyo' huhifadhi neno la chanzo badala ya kulifasiri moja kwa moja kuwa 'hekalu'.
