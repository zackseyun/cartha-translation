  text: And all the men of Israel assembled before King Solomon at the festival, in the month of Ethanim, which is the seventh month.
translation:
  language: sw
  text: Waisraeli wote wakakusanyika mbele ya Mfalme Sulemani wakati wa sikukuu, katika mwezi wa Ethanimu, yaani mwezi wa saba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: Waisraeli wote
  rationale: Kirai hiki cha Kiebrania kina maana ya watu wote wa Israeli; tafsiri hii ni ya asili katika Kiswahili na haikazii wanaume pekee bila ulazima wa muktadha.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: mbele ya Mfalme Sulemani
  rationale: Ingawa אֶל kwa kawaida humaanisha ‘kwa’ au ‘kuelekea’, hapa mkusanyiko rasmi mbele ya mfalme unaelezwa kwa Kiswahili cha kawaida kwa ‘mbele ya’.
- source_word: בֶּחָג
  choice: wakati wa sikukuu
  rationale: Neno חַג linaashiria sikukuu ya kidini; hapa lina arifu na muktadha unaitambulisha kama sikukuu maalumu bila kuitaja kwa jina.
- source_word: יֶרַח הָאֵתָנִים
  choice: mwezi wa Ethanimu
  rationale: Jina la kale la mwezi limehifadhiwa kwa unukuzi wa Kiswahili badala ya kubadilishwa kuwa jina jingine la kalenda.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: yaani mwezi wa saba
  rationale: ‘Yaani’ huwasilisha kwa kawaida maelezo ya utambulisho yanayotolewa na kifungu cha Kiebrania.
