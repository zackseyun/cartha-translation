  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר תִֽהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ/ן אִ֚ישׁ נֶ֣גַע לְבָב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/038.yaml
  text: whatever prayer[a], whatever plea, may be made by any man or by all your people Israel, each knowing the affliction of his own heart and spreading out his hands toward this house[c][b],
translation:
  language: sw
  text: sala yoyote, dua yoyote, itakayotolewa na mtu yeyote[a] au na watu wako wote Israeli, kila mmoja akijua dhiki ya moyo wake[b] na akinyoosha mikono yake kuelekea nyumba hii[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ajili ya mtu yeyote.” Kihusishi cha Kiebrania kinaweza kueleweka kwa njia zaidi ya moja hapa.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi zaidi, “pigo linaloupata moyo wake.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, hekalu, ambalo hapa linaitwa “nyumba hii.”
    reason: cultural_note
lexical_decisions:
- source_word: כָּל תְּפִלָּה
  choice: sala yoyote
  rationale: Muundo huu unaonyesha upeo usio na kikomo; “sala yoyote” ni Kiswahili cha kawaida na huhifadhi maana ya kila aina ya sala.
- source_word: כָל תְּחִנָּה
  choice: dua yoyote
  rationale: תְּחִנָּה ni ombi la unyenyekevu linalotafuta rehema au fadhili. “Dua” hutofautisha neno hili na “sala” huku ikibaki ya kawaida na yenye heshima.
- source_word: אֲשֶׁר תִהְיֶה
  choice: itakayotolewa
  rationale: Ingawa kwa karibu ni “itakayokuwa,” katika muktadha wa sala Kiswahili hutumia kwa kawaida sala au dua “kutolewa.”
- source_word: לְכָל הָאָדָם
  choice: na mtu yeyote
  rationale: לְ hapa inaeleweka kuwa inahusisha sala na mwombaji, yaani sala inayotolewa na mtu yeyote; tanbihi inahifadhi uwezekano wa maana “kwa ajili ya mtu yeyote.”
- source_word: לְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: au na watu wako wote Israeli
  rationale: Kirai hiki kinalingana na kile cha mtu mmoja na kupanua wigo hadi kwa jumuiya yote ya Israeli.
- source_word: אֲשֶׁר יֵדְעוּן אִישׁ
  choice: kila mmoja akijua
  rationale: 'אִישׁ ina nguvu ya kigawanyo hapa: kila mtu mmoja mmoja ndani ya kundi anajua hali yake mwenyewe.'
- source_word: נֶגַע לְבָבוֹ
  choice: dhiki ya moyo wake
  rationale: נֶגַע inaweza kumaanisha pigo, tauni, au dhiki. “Dhiki ya moyo wake” huwasilisha taabu ya ndani kwa Kiswahili cha asili bila kuondoa kabisa uzito wa taswira; maana halisi zaidi imetajwa katika tanbihi.
- source_word: וּפָרַשׂ כַּפָּיו
  choice: na akinyoosha mikono yake
  rationale: Hii ni ishara ya sala ya kunyoosha mikono au viganja; “kunyoosha mikono” ni usemi wa kawaida na wazi.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: kuelekea nyumba hii
  rationale: אֶל inaonyesha mwelekeo, na “nyumba” huhifadhi neno la Kiebrania huku muktadha ukionyesha kuwa ni hekalu.
theological_decisions:
- issue: Maana ya לְ katika לְכָל הָאָדָם
  choice: na mtu yeyote
  alternative: kwa ajili ya mtu yeyote
  rationale: Mlingano na “watu wako wote Israeli,” pamoja na tendo la kila mmoja kujua dhiki yake na kunyoosha mikono, unaunga mkono kuelewa mtu huyo kuwa mwombaji. Hata hivyo, muundo wa Kiebrania unaweza pia kueleweka kuwa sala ni kwa ajili yake, hivyo uwezekano huo umehifadhiwa katika tanbihi.
- issue: Taswira ya נֶגַע לְבָבוֹ
  choice: dhiki ya moyo wake
  alternative: pigo la moyo wake
  rationale: “Dhiki” hutoa maana ya mateso au taabu ya ndani kwa uwazi, ilhali tanbihi huhifadhi taswira halisi ya “pigo” na mvutano wake wa kitheolojia.
- issue: Kutafsiri הַבַּיִת kama nyumba au hekalu
  choice: nyumba hii
  alternative: hekalu hili
  rationale: Marejeo ni kwa hekalu, lakini Kiebrania kinasema “nyumba.” Kuhifadhi “nyumba” kunadumisha lugha ya chanzo na wazo la hekalu kuwa nyumba ya BWANA.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Sala” na “dua” hutenganisha istilahi mbili za Kiebrania bila kutumia lugha nzito isiyo ya kawaida. Muundo wa sentensi umeachwa ukiendelea kwa koma kwa kuwa mstari huu ni sehemu ya sentensi ndefu ya sala ya Sulemani.
