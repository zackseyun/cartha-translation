  text: And it was reported to Solomon that Shimei had gone from Jerusalem to Gath and had returned.
translation:
  language: sw
  text: Ndipo Sulemani akaambiwa kwamba Shimei alikuwa ametoka Yerusalemu kwenda Gathi, kisha akarudi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: akaambiwa
  rationale: Kauli ya kutendwa inadumisha kwamba habari ilifikishwa kwa Sulemani bila kumtaja mtoa habari; muundo huu ni wa kawaida katika masimulizi ya Kiswahili.
- source_word: לִשְׁלֹמֹה
  choice: Sulemani
  rationale: Kiambishi ל־ humtaja Sulemani kuwa mpokeaji wa taarifa; katika Kiswahili, maana hiyo imejengwa ndani ya kitenzi “akaambiwa.”
- source_word: כִּי
  choice: kwamba
  rationale: Hutambulisha yaliyomo katika taarifa kwa usemi usio wa moja kwa moja.
- source_word: הָלַךְ
  choice: alikuwa ametoka ... kwenda
  rationale: הלך huonyesha kwenda au kusafiri; muundo huu unaonyesha kwamba safari ilikuwa imekwisha kutokea kabla Sulemani hajapokea taarifa.
- source_word: שִׁמְעִי
  choice: Shimei
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: מִירוּשָׁלִַם
  choice: kutoka Yerusalemu
  rationale: Kiambishi מ־ huonyesha mahali safari ilikoanzia.
- source_word: גַּת
  choice: kwenda Gathi
  rationale: Ingawa hakuna kihusishi cha wazi kabla ya jina hili, Gathi ni mwisho wa safari; Kiswahili huhitaji “kwenda” ili kuonyesha mwelekeo kwa kawaida.
- source_word: וַיָּשֹׁב
  choice: kisha akarudi
  rationale: שׁוב humaanisha kurudi; “kisha” huonyesha kwa uwazi kwamba kurudi kulifuata safari ya kwenda Gathi.
