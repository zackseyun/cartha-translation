  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inalenga ulinganifu mwafaka: inahifadhi marudio na wazo la kuchukua nafasi, huku ikieleza kwa kawaida jukumu la Benaya kama mkuu wa jeshi.'
