  yaml_path: translation/ot/1_kings/002/035.yaml
  text: And the king appointed Benaiah son of Jehoiada in his place over the army[a], and the king appointed Zadok the priest in place of Abiathar.
translation:
  language: sw
  text: Mfalme akamweka Benaya mwana wa Yehoyada kuwa mkuu wa jeshi badala yake[a], naye mfalme akamweka kuhani Sadoki badala ya Abiathari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “badala yake”; kiwakilishi hiki kinamrejelea Yoabu, aliyekuwa mkuu wa jeshi na ambaye alikuwa ameondolewa, kama inavyoonekana katika muktadha unaotangulia.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: akamweka
  rationale: Ingawa kitenzi kimsingi kinaweza kumaanisha ‘kutoa’ au ‘kuweka,’ hapa kinahusu kumweka mtu katika wadhifa; ‘akamweka’ ni cha asili na kinadumisha picha ya Kiebrania.
- source_word: בְּנָיָהוּ בֶן־יְהוֹיָדָע
  choice: Benaya mwana wa Yehoyada
  rationale: Muundo wa jina na nasaba umetafsiriwa moja kwa moja, huku majina yakifuata matamshi yanayofaa Kiswahili.
- source_word: תַּחְתָּיו עַל־הַצָּבָא
  choice: kuwa mkuu wa jeshi badala yake
  rationale: Kirai kinaonyesha kwamba Benaya alichukua nafasi ya mtangulizi katika uongozi wa jeshi. ‘Kuwa mkuu wa jeshi’ huwasilisha kwa Kiswahili cha kawaida maana ya kuwa juu ya jeshi.
- source_word: צָדוֹק הַכֹּהֵן
  choice: kuhani Sadoki
  rationale: Cheo cha ukuhani kimeunganishwa na jina kwa mpangilio wa kawaida wa Kiswahili.
- source_word: תַּחַת אֶבְיָתָר
  choice: mahali pa Abiathari
  rationale: תַּחַת hapa huonyesha kuchukua nafasi ya mtu mwingine katika wadhifa; ‘mahali pa’ huhifadhi wazo hilo kwa lugha ya asili.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Cheo chenye uainisho kimetafsiriwa moja kwa moja, na marudio yake katika kishazi cha pili yamehifadhiwa kwa uaminifu kwa maandishi ya Kiebrania.
