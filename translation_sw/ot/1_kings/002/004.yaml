  text: לְמַעַן֩ יָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֣ר עָלַ/י֮ לֵ/אמֹר֒ אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֤כֶת לְ/פָנַ/י֙ בֶּ/אֱמֶ֔ת בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָׁ֑/ם לֵ/אמֹ֕ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/004.yaml
  text: so that Yahweh may establish his word that he spoke concerning me[a], saying, ‘If your sons keep their way by walking before me in truth with all their heart and with all their soul,’ saying[c][b], ‘A man of yours shall not be cut off from upon the throne of Israel.’
translation:
  language: sw
  text: ili Yahwe athibitishe neno lake alilosema kunihusu,[a] akisema, “Ikiwa wana wako wataishika njia yao kwa kutembea mbele zangu kwa uaminifu, kwa moyo wao wote na kwa nafsi zao zote,” akisema, “Hautakosa mtu wako kwenye kiti cha enzi cha Israeli.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliloniambia.” Kiebrania hapa kwa kawaida humaanisha “alilosema kunihusu.”
    reason: alternative_reading
  - marker: c
    text: 'Kwa tafsiri halisi zaidi: “Mtu wako hatakatiliwa mbali kutoka juu ya kiti cha enzi cha Israeli.” Nahau hii humaanisha, “Hautakosa mtu wako kwenye kiti cha enzi cha Israeli.”'
    reason: literal_idiom
lexical_decisions:
- source_word: לְמַעַן
  choice: ili
  rationale: Huonyesha kusudi au matokeo na ni ya kawaida katika Kiswahili sanifu.
- source_word: יָקִים
  choice: alithibitishe
  rationale: Hifili ya קום hapa ni kulifanya neno lisimame imara, yaani kulithibitisha au kulitimiza; “alithibitishe” inadumisha picha ya uthabiti bila kudai kwamba ahadi hiyo haijaanza kutimizwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: דְּבָרוֹ
  choice: neno lake
  rationale: Ni tafsiri ya moja kwa moja inayoweza pia kumaanisha ahadi katika muktadha huu.
- source_word: דִּבֶּר עָלַי
  choice: alilosema kunihusu
  rationale: עַל pamoja na דבר hapa ina maana ya kusema kuhusu au kumhusu Daudi; tanbihi inataja uwezekano wa kuelewa ‘aliloniambia.’
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם
  choice: watailinda njia yao
  rationale: Inahifadhi sitiari ya Kiebrania ya kuilinda njia, yaani kuangalia kwa makini mwenendo wao.
- source_word: בָנֶיךָ
  choice: wana wako
  rationale: Nomino ya Kiebrania ni ya kiume na katika muktadha inawahusu wazao wa kiume wa ukoo wa kifalme wa Daudi.
- source_word: לָלֶכֶת לְפָנַי
  choice: kwa kutembea mbele zangu
  rationale: Inahifadhi sitiari ya agano ya kutembea mbele za Mungu na kueleza namna ya kuilinda njia yao.
- source_word: בֶּאֱמֶת
  choice: kwa uaminifu
  rationale: אמת inaweza kumaanisha ukweli, uaminifu, au unyofu; ‘kwa uaminifu’ ni Kiswahili cha kawaida katika muktadha wa mwenendo, huku tanbihi ikihifadhi upana wa maana.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: kwa moyo wao wote na kwa nafsi yao yote
  rationale: Inadumisha msisitizo wa kujitoa kikamilifu kwa moyo na nafsi.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: Hutakosa mtu wa kuketi katika kiti cha ufalme cha Israeli
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kwamba ukoo wa Daudi hautakosa mwakilishi katika kiti cha ufalme; tafsiri ya Kiswahili ni ya asili, na tanbihi inahifadhi muundo halisi.
theological_decisions:
- issue: Masharti ya ahadi kwa ukoo wa Daudi
  choice: 'Sentensi inabaki na sharti la wazi: “Ikiwa wana wako...”'
  alternative: Kulainisha sharti hilo kana kwamba ni himizo tu ndani ya ahadi isiyo na masharti.
  rationale: Kiebrania kinaweka sharti wazi kuhusu mwenendo wa wazao wa Daudi. Tafsiri hailiondoi wala kulipatanisha kimya kimya na matamko mengine kuhusu agano la Daudi.
- issue: Maana ya ‘neno lake’
  choice: Kudumisha “neno lake” badala ya kuandika moja kwa moja “ahadi yake.”
  alternative: “ahadi yake”
  rationale: Katika muktadha neno hilo ni ahadi, lakini tafsiri pana zaidi inadumisha uchaguzi wa Kiebrania na haifungi maana kupita kiasi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari za “njia” na “kutembea mbele” zimehifadhiwa; nahau isiyo ya kawaida kuhusu mtu ‘kukatiliwa mbali kutoka juu ya kiti’ imetolewa kwa Kiswahili cha asili na kuhifadhiwa katika tanbihi.
