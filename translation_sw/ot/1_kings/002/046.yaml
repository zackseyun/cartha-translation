  text: וַ/יְצַ֣ו הַ/מֶּ֗לֶךְ אֶת בְּנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וַ/יֵּצֵ֕א וַ/יִּפְגַּע בּ֖/וֹ וַ/יָּמֹ֑ת וְ/הַ/מַּמְלָכָ֥ה נָכ֖וֹנָה בְּ/יַד שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/046.yaml
  text: Then the king commanded Benaiah son of Jehoiada[a], and he went out and struck him down, and he died. So the kingdom was established in the hand of Solomon.
translation:
  language: sw
  text: Ndipo mfalme akamwamuru Benaya mwana wa Yehoyada. Naye akaenda, akampiga, naye akafa. Hivyo ufalme ukaimarishwa mikononi mwa Sulemani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ufalme ukawa imara chini ya utawala wa Sulemani.” Nahau ya Kiebrania “mikononi mwa” huonyesha mamlaka au umiliki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: mfalme akamwamuru
  rationale: Kitenzi צוה kina maana ya kuamuru au kutoa agizo; muundo huu unaonyesha wazi mamlaka ya kifalme na mlengwa wa agizo.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya mwana wa Yehoyada
  rationale: Majina yametoholewa kwa namna inayofaa Kiswahili, huku uhusiano wa kifamilia wa muundo wa Kiebrania ukihifadhiwa.
- source_word: וַיֵּצֵא
  choice: Naye akaenda
  rationale: Ingawa maana ya msingi ni ‘akatoka,’ katika mfululizo huu wa utekelezaji ‘akaenda’ ni Kiswahili cha kawaida kinachoonyesha kwamba Benaya aliondoka kutekeleza agizo bila kuongeza mahali pasipotajwa.
- source_word: וַיִּפְגַּע בּוֹ
  choice: akampiga
  rationale: פגע pamoja na ב inaweza kumaanisha kumpiga au kumshambulia. ‘Akampiga’ huhifadhi tendo la vurugu huku kishazi kinachofuata kikieleza wazi matokeo yake.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: 'Tafsiri ya moja kwa moja inayohifadhi mfuatano wa Kiebrania: alipigwa, kisha akafa.'
- source_word: וְהַמַּמְלָכָה נָכוֹנָה
  choice: Hivyo ufalme ukaimarishwa
  rationale: נכון katika Nifali huonyesha hali ya kuanzishwa kwa uthabiti au kuimarishwa. ‘Hivyo’ huonyesha matokeo ya matukio yaliyotangulia, na ‘ukaimarishwa’ huwasilisha wazo la uthabiti.
- source_word: בְּיַד שְׁלֹמֹה
  choice: mikononi mwa Sulemani
  rationale: Huhifadhi taswira ya nahau ya Kiebrania ‘katika mkono wa’ huku umbo la Kiswahili ‘mikononi mwa’ likieleweka kama mamlaka au udhibiti.
