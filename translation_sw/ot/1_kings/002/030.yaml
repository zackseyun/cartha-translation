base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/030.yaml
  text: 'Then Benaiah came to the tent of Yahweh and said to him[a], “Thus says the king: ‘Come out.’” But he said, “No, for I will die here.” And Benaiah brought word back to the king, saying, “Thus Joab spoke, and thus he answered me.”'
translation:
  language: sw
  text: 'Ndipo Benaya akafika kwenye hema la Yahwe[a] na kumwambia Yoabu, “Mfalme amesema hivi: ‘Toka nje.’” Lakini Yoabu akasema, “Hapana, kwa maana nitafia hapa.” Basi Benaya akampelekea mfalme taarifa, akisema, “Yoabu alisema hivi, na alinijibu hivi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maskani ya Yahwe.” Kiebrania kinasema kihalisi “hema la Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל יְהוָה
  choice: hema la Yahwe
  rationale: אֹהֶל humaanisha kihalisi ‘hema.’ Tafsiri hii inafuata neno la Kiebrania bila kulibadili kuwa ‘nyumba,’ huku tanbihi ikitaja ‘Maskani’ kama neno la kimapokeo linalowezekana katika muktadha huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limetafsiriwa kwa namna ya kawaida ya Kiswahili ‘Yahwe,’ badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Mfalme amesema hivi
  rationale: Huu ni mfumo rasmi wa mjumbe wa kuwasilisha maneno ya mwenye mamlaka; usemi huu ni wa asili katika Kiswahili cha sasa na unadumisha uzito wa taarifa.
- source_word: צֵא
  choice: Toka nje
  rationale: Amri ya יצא humwagiza aliye ndani aondoke mahali hapo; ‘Toka nje’ ni wazi na ya kawaida katika Kiswahili.
- source_word: לֹא כִּי פֹה אָמוּת
  choice: Hapana, kwa maana nitafia hapa
  rationale: Tafsiri hii inadumisha kukataa kwa Yoabu na sababu au azimio linalofuata. ‘Nitafia hapa’ huonyesha kwamba kifo chake kitatokea mahali hapo bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: akamrudishia mfalme taarifa
  rationale: Muundo huu wa Kiebrania una maana ya kurudi na jibu au taarifa. Kiswahili hiki kinawasilisha kwa kawaida tendo la Benaya la kupeleka majibu kwa mfalme.
- source_word: כֹּה דִבֶּר יוֹאָב וְכֹה עָנָנִי
  choice: Yoabu alisema hivi, na alinijibu hivi
  rationale: Kurudiwa kwa כֹּה kumehifadhiwa kwa kurudia ‘hivi,’ hivyo kudumisha mtindo wa taarifa na usambamba wa Kiebrania.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Kiebrania kinatumia jina binafsi יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu fulani.
- issue: Kauli ya Yoabu kuhusu kufa mahali patakatifu
  choice: kwa maana nitafia hapa
  alternative: bali nitakufa hapa
  rationale: כִּי inaweza kueleweka kama ikitoa sababu au kusisitiza azimio tofauti. ‘Kwa maana’ inafaa katika muktadha wa kukataa kutoka, lakini tafsiri haiongezi madai kuhusu nia ya kitheolojia ya Yoabu au athari ya kushika madhabahu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Jina ‘Yoabu’ limewekwa wazi katika sentensi ya kwanza ili kuondoa utata wa kiwakilishi cha Kiswahili bila kubadili mhusika anayelengwa.
