  text: וַ/יִּשְׁלַ֨ח הַ/מֶּ֜לֶךְ וַ/יִּקְרָ֣א לְ/שִׁמְעִ֗י וַ/יֹּ֨אמֶר אֵלָ֜י/ו הֲ/ל֧וֹא הִשְׁבַּעְתִּ֣י/ךָ בַֽ/יהוָ֗ה וָ/אָעִ֤ד בְּ/ךָ֙ לֵ/אמֹ֔ר בְּ/י֣וֹם צֵאתְ/ךָ֗ וְ/הָֽלַכְתָּ֙ אָ֣נֶה וָ/אָ֔נָה יָדֹ֥עַ תֵּדַ֖ע כִּ֣י מ֣וֹת תָּמ֑וּת וַ/תֹּ֧אמֶר אֵלַ֛/י ט֥וֹב הַ/דָּבָ֖ר שָׁמָֽעְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/042.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Did I not make you swear by Yahweh and warn you, saying, ‘On the day you go out and go anywhere at all, know for certain that you shall surely die’? And you said to me, ‘The word is good[c][b]; I have heard.’”
translation:
  language: sw
  text: 'Ndipo mfalme akatuma watu wamwite Shimei, akamwambia, “Je, sikukuapisha kwa Yahweh na kukuonya[a] hivi: ‘Siku utakapotoka na kwenda kokote kabisa[b], ujue kwa hakika kwamba hakika utakufa’? Nawe ukaniambia, ‘Neno hilo ni jema[c]; nimesikia.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kukushuhudia dhidi yako” au “kukuagiza kwa uzito.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “kwenda huku au kule,” nahau yenye maana ya kwenda kokote kabisa.
    reason: lexical_alternative
  - marker: c
    text: Au, “Jambo hilo ni jema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּיךָ בַיהוָה
  choice: sikukuapisha kwa Yahweh
  rationale: Hifili ya שבע ina maana ya kumsababisha mtu aape au kumweka chini ya kiapo. “Kukuapisha” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kisababishi, na בַיהוָה ni kauli ya kiapo kwa jina la Yahweh.
- source_word: וָאָעִד בְּךָ
  choice: na kukuonya
  rationale: Hifili ya עוד inaweza kumaanisha kuonya, kushuhudia dhidi ya mtu, au kumwagiza kwa uzito. Katika muktadha huu ni onyo rasmi lililofungamanishwa na kiapo; “kukuonya” ni wazi na ya kawaida, huku maana ya kisheria ikihifadhiwa katika tanbihi.
- source_word: בְּיוֹם צֵאתְךָ
  choice: Siku utakapotoka
  rationale: Muundo wa wakati umetolewa kwa sentensi ya Kiswahili iliyo ya kawaida bila kupoteza sharti linalohusishwa na siku ya kutoka.
- source_word: וְהָלַכְתָּ אָנֶה וָאָנָה
  choice: na kwenda kokote kabisa
  rationale: Jozi ya vielezi אָנֶה וָאָנָה, kihalisi “huku au kule,” inaonyesha mahali popote pasipoainishwa. “Kokote kabisa” huwasilisha upana na mkazo wake kwa Kiswahili cha kawaida.
- source_word: יָדֹעַ תֵּדַע
  choice: ujue kwa hakika
  rationale: Jina-jinsi kamili pamoja na kitenzi huongeza mkazo wa uhakika. “Kwa hakika” huwasilisha mkazo huo kwa ufasaha.
- source_word: מוֹת תָּמוּת
  choice: hakika utakufa
  rationale: Jina-jinsi kamili pamoja na kitenzi cha mzizi huongeza uhakika wa hukumu. “Hakika utakufa” ni ya heshima, nzito, na ya kawaida.
- source_word: טוֹב הַדָּבָר
  choice: Neno hilo ni jema
  rationale: דָּבָר inaweza kumaanisha neno, kauli, au jambo. “Neno hilo” huhifadhi uhusiano na kauli ya mfalme bila kuamua kimya kimya kwamba maana ni “jambo.”
- source_word: שָׁמָעְתִּי
  choice: nimesikia
  rationale: Tafsiri hii huhifadhi maana ya msingi ya שמע. Ingawa kusikia kunaweza kudokeza kukubali au kutii katika muktadha wa kisheria, maandishi hayasemi hivyo wazi.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja katika kauli ya kiapo. “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya שָׁמַע katika jibu la Shimei
  choice: nimesikia
  alternative: nimekubali / nitatii
  rationale: Maana pana ya kitenzi inaweza kuhusisha kukubali au kutii, lakini hapa tafsiri inahifadhi kauli yenyewe na kutolazimisha hitimisho la kitheolojia au kisheria lisilotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa simulizi la kifalme na kauli rasmi ya kisheria, lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya mkazo katika “ujue kwa hakika kwamba hakika utakufa” yanahifadhi miundo miwili ya Kiebrania yenye kusisitiza uhakika.
