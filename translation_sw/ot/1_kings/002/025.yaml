  text: So King Solomon sent Benaiah son of Jehoiada[a], and he struck him down, and he died.
translation:
  language: sw
  text: Basi Mfalme Sulemani akamtuma Benaya mwana wa Yehoyada[a]. Benaya akampiga, naye akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “akatuma kwa mkono wa Benaya mwana wa Yehoyada,” nahau inayomaanisha kwamba alimtuma awe wakala wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akamtuma
  rationale: Kitenzi שׁלח katika usimulizi huu humaanisha kwa kawaida ‘kutuma.’ Kiswahili ‘akamtuma’ ni cha asili na kinaacha kitendo kinachofuata kieleze kusudi la kutumwa kwake.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Mfalme Sulemani
  rationale: Huu ni mpangilio wa kawaida wa Kiswahili unaohifadhi cheo cha kifalme na jina la mtu.
- source_word: בְּיַד
  choice: akamtuma Benaya mwana wa Yehoyada
  rationale: Kirai בְּיַד, kihalisi ‘kwa mkono wa,’ kinaonyesha kwamba Benaya alikuwa wakala wa Sulemani. Katika Kiswahili cha asili, maana hiyo inaelezwa kwa kumfanya Benaya kuwa mtendwa wa ‘akamtuma’; tafsiri ya neno kwa neno imewekwa katika tanbihi.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya mwana wa Yehoyada
  rationale: ‘Mwana wa’ huwasilisha wazi uhusiano wa jina la baba kwa mtindo wa kawaida na wenye hadhi wa Kiswahili.
- source_word: וַיִּפְגַּע בּוֹ
  choice: Benaya akampiga
  rationale: Kitenzi פגע pamoja na ב kinaweza kumaanisha kukutana na, kushambulia, au kupiga. Katika muktadha huu wa utekelezaji wa hukumu, ‘akampiga’ huhifadhi tendo la shambulio bila kulimeza tamko tofauti linalofuata kwamba alikufa. Kutaja Benaya tena kunaondoa utata wa viwakilishi katika Kiswahili.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Tafsiri hii huhifadhi tamko la wazi na linalofuatana la Kiebrania kwamba mtu aliyepigwa alikufa.
