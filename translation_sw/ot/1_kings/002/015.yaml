  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַ֤תְּ יָדַ֨עַתְּ֙ כִּי לִ/י֙ הָיְתָ֣ה הַ/מְּלוּכָ֔ה וְ/עָלַ֞/י שָׂ֧מוּ כָֽל יִשְׂרָאֵ֛ל פְּנֵי/הֶ֖ם לִ/מְלֹ֑ךְ וַ/תִּסֹּ֤ב הַ/מְּלוּכָה֙ וַ/תְּהִ֣י לְ/אָחִ֔/י כִּ֥י מֵ/יְהוָ֖ה הָ֥יְתָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/015.yaml
  text: And he said[a], “You know that the kingdom was mine, and that all Israel had set their faces on me to reign; but the kingdom turned and became my brother’s[b], for it was his from Yahweh.”
translation:
  language: sw
  text: Naye akasema, “Wewe unajua kwamba ufalme ulikuwa wangu, na kwamba Israeli wote walikuwa wamenitazamia[a] ili nitawale. Lakini ufalme ukageuka, ukawa wa ndugu yangu, kwa maana ulikuwa wake kutoka kwa Yahwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Israeli wote walikuwa wameelekeza nyuso zao kwangu ili nitawale.” Nahau ya Kiebrania kwa neno ni “walikuwa wameweka nyuso zao juu yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּלוּכָה
  choice: ufalme
  rationale: Neno hili linamaanisha mamlaka au cheo cha kifalme katika muktadha wa urithi wa kiti cha enzi; “ufalme” ni tafsiri ya kawaida na inayoeleweka vizuri katika Kiswahili.
- source_word: וְעָלַי שָׂמוּ כָל־יִשְׂרָאֵל פְּנֵיהֶם
  choice: Israeli wote walikuwa wamenielekezea nyuso zao
  rationale: Tafsiri hii inadumisha picha ya nahau ya Kiebrania ya kuelekeza nyuso kwa mtu, ikionyesha matarajio au kusudi lao bila kufafanua kupita kiasi.
- source_word: לִמְלֹךְ
  choice: ili nitawale
  rationale: Kitenzi kinamaanisha kutenda kama mfalme. “Ili nitawale” ni cha asili katika sentensi hii na hakiongezi dai lisilokuwapo kwamba alikuwa tayari ametawazwa.
- source_word: וַתִּסֹּב
  choice: ukageuka
  rationale: Kinahifadhi sitiari ya Kiebrania ya mambo kubadilika au kuelekea upande mwingine.
- source_word: וַתְּהִי לְאָחִי
  choice: ukawa wa ndugu yangu
  rationale: Kifungu kinaonyesha kwamba ufalme ulihamia kwa ndugu yake Adoniya, yaani ukawa wake.
- source_word: כִּי מֵיְהוָה הָיְתָה לּוֹ
  choice: kwa maana ulitoka kwa Yahwe ukawa wake
  rationale: Maneno haya yanadumisha wazo kwamba ufalme ulikuwa wa ndugu yake kwa kutoka kwa Yahwe, bila kuongeza kitenzi mahsusi cha kumpa ambacho hakipo katika Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa umbo linalotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: אָחִי
  choice: ndugu yangu
  rationale: Ni tafsiri ya moja kwa moja ya neno la kifamilia linalomtaja Sulemani kwa mtazamo wa Adoniya.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina la Mungu moja kwa moja; “Yahwe” linahifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Kiwango cha uwazi kuhusu tendo la Mungu katika kifungu cha mwisho
  choice: kwa maana ulitoka kwa Yahwe ukawa wake
  alternative: kwa maana Yahwe alimpa
  rationale: Kiebrania hakitumii kitenzi cha “kumpa.” Tafsiri iliyochaguliwa inahifadhi dai la chanzo au uamuzi wa Mungu bila kufanya namna ya tendo hilo iwe wazi zaidi kuliko andiko.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka. Taswira ya Kiebrania kuhusu kuelekeza nyuso imehifadhiwa katika maandishi, huku maana yake ya kawaida ikielezwa katika tanbihi. “Yahwe” limetumiwa kama umbo la Kiswahili la jina la Mungu.
