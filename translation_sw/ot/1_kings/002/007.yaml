base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/007.yaml
  text: But show kindness to the sons of Barzillai the Gileadite[a], and let them be among those who eat at your table[c][b], for this is how they came near to me when I fled from Absalom your brother.
translation:
  language: sw
  text: Lakini uwatendee wema wana wa Barzilai, yule Mgileadi,[a] nao wawe miongoni mwa wale wanaokula mezani pako,[b] kwa maana walinisaidia kwa namna hiyo[c] nilipokuwa nikikimbia kutoka mbele ya Absalomu ndugu yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwatendee kwa uaminifu wana wa Barzilai.” Nahau ya Kiebrania “kutenda wema” inaweza kumaanisha wema wenye uaminifu, si hisia tu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wawe miongoni mwa wanaokula meza yako”; hii ni nahau inayomaanisha kupewa riziki na fadhili za mfalme kwa kudumu.
    reason: cultural_note
  - marker: c
    text: Au, “walikuja kwangu” au “walisimama upande wangu.” Kitenzi cha Kiebrania kihalisi ni “walikaribia,” lakini hapa kinadokeza kwamba walimsaidia Daudi alipokuwa akikimbia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Lakini ... wana wa
  rationale: Waw inaendeleza maagizo ya Daudi kwa nguvu ya utofautishaji baada ya agizo lililotangulia; 'wana wa' linafaa kwa wazao wa kiume wa Barzilai katika muktadha huu.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: Barzilai, Mgileadi
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili, na gentiliki imetafsiriwa kwa umbo la kawaida la Kiswahili.
- source_word: תַּעֲשֶׂה חֶסֶד
  choice: uwatendee wema
  rationale: Nahau hii inaeleza tendo la wema lenye uaminifu; 'uwatendee wema' ni ya asili na ya heshima bila kulazimisha istilahi maalumu ya agano.
- source_word: וְהָיוּ
  choice: nao wawe
  rationale: Katika maagizo haya umbo hilo lina nguvu ya amri au matokeo yanayotakiwa.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: miongoni mwa wale wanaokula mezani pako
  rationale: Huhifadhi picha ya watu wanaopata riziki na fadhili za mfalme kwa kudumu.
- source_word: כִּי כֵן
  choice: kwa maana hivyo ndivyo
  rationale: Huhifadhi nguvu ya kutoa sababu na kuonyesha namna inayolingana na wema ulioagizwa.
- source_word: קָרְבוּ אֵלַי
  choice: walivyonikaribia
  rationale: Hufuata maana ya msingi ya 'kuja karibu' huku muktadha ukidokeza kuwa walimsaidia na kumuunga mkono Daudi.
- source_word: בְּבָרְחִי
  choice: nilipokuwa nikimkimbia
  rationale: Kiswahili hiki huonyesha kwa kawaida tendo lililoendelea wakati msaada huo ulipotolewa.
- source_word: מִפְּנֵי
  choice: nikimkimbia
  rationale: Katika muktadha wa kukimbia, kiambishi cha Kiswahili kinaonyesha kwamba Daudi alikuwa akikimbia kutoka kwa Absalomu.
- source_word: אַבְשָׁלוֹם אָחִיךָ
  choice: Absalomu ndugu yako
  rationale: Jina limetoholewa kwa Kiswahili, na uhusiano wa kifamilia umehifadhiwa kwa sababu ni sehemu muhimu ya kauli ya Daudi.
