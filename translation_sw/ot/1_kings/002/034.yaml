  text: וַ/יַּ֗עַל בְּנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וַ/יִּפְגַּע בּ֖/וֹ וַ/יְמִתֵ֑/הוּ וַ/יִּקָּבֵ֥ר בְּ/בֵית֖/וֹ בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/034.yaml
  text: Then Benaiah son of Jehoiada went up[a], struck him down, and put him to death[b]; and he was buried at his house in the wilderness.
translation:
  language: sw
  text: Ndipo Benaya mwana wa Yehoyada akapanda, akampiga[a] na kumuua; naye akazikwa nyumbani kwake jangwani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamshambulia.” Kiebrania kinatumia kitenzi kimoja kwa shambulio au pigo, kisha kitenzi kingine kwa kumuua; matini kuu inayatofautisha matendo hayo.
    reason: lexical_alternative
  - marker: b
    text: “Nyumbani kwake” hapa huenda ikamaanisha katika eneo la nyumba yake au kwenye mali ya familia yake jangwani, si lazima ndani ya jengo lenyewe.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה humaanisha kupanda au kwenda juu. “Akapanda” kinahifadhi maana hiyo ya mwendo bila kuongeza wazi wazo la kumvamia.
- source_word: וַיִּפְגַּע בּוֹ
  choice: akampiga
  rationale: Katika muktadha huu פגע ב־ inaonyesha tendo la kumshambulia au kumpiga. “Akampiga” ni wazi na halichanganyi tendo hilo na kitenzi kinachofuata cha kumuua.
- source_word: וַיְמִתֵהוּ
  choice: na kumuua
  rationale: Hifili ya מות ina maana ya kusababisha afe, yaani kumuua. Tafsiri hii ni ya kawaida na inahifadhi tendo la pili tofauti na kumpiga.
- source_word: וַיִּקָּבֵר
  choice: naye akazikwa
  rationale: Nifali ina hali ya kutendwa. “Akazikwa” inaonyesha wazi kuwa mhusika anayezikwa ni Yoabu, huku “naye” ikiashiria mabadiliko ya mtendaji katika simulizi.
- source_word: בְּבֵיתוֹ
  choice: nyumbani kwake
  rationale: בית inaweza kumaanisha nyumba, makao, au eneo la familia. “Nyumbani kwake” ni Kiswahili cha kawaida kinachoweza kurejelea makao au eneo lake bila kulazimisha maana ya kwamba alizikwa ndani ya jengo.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: מדבר humaanisha eneo la nyika au jangwa. “Jangwani” ni tafsiri fupi, ya kawaida, na inayofaa taarifa hii ya mahali.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Vitenzi viwili vya shambulio na mauaji vimehifadhiwa tofauti, na maana pana ya בית katika taarifa ya maziko imeelezwa kwa tanbihi.
