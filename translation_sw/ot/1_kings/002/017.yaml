  text: And he said[a], “Please speak to King Solomon, for he will not refuse you, and let him give me Abishag the Shunammite as a wife.”
translation:
  language: sw
  text: Naye akasema, “Tafadhali, mwambie Mfalme Sulemani, kwa maana hatakukataa, anipe Abishagi, yule Mshunami, awe mke wangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: Tafadhali, mwambie
  rationale: Kitenzi cha kuamuru katika umoja wa kike pamoja na נָא kinaonyesha ombi la heshima. ‘Tafadhali, mwambie’ ni Kiswahili cha kawaida na kinafaa kwa ombi ambalo Adonia anataka Bathsheba amfikishie Sulemani.
- source_word: לִשְׁלֹמֹה הַמֶּלֶךְ
  choice: Mfalme Sulemani
  rationale: Mpangilio huu wa cheo na jina ni wa kawaida katika Kiswahili na unahifadhi maana ya tamko la Kiebrania.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya Adonia kumwomba Bathsheba azungumze na Sulemani.
- source_word: לֹא יָשִׁיב אֶת פָּנָיִךְ
  choice: hatakukatalia ombi lako
  rationale: Hii ni nahau ya Kiebrania ambayo kihalisi inahusu ‘kuurudisha uso’ wa mtu, lakini hapa maana yake ni kutokataa ombi lake. Tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: וְיִתֶּן לִי
  choice: anipe
  rationale: Kitenzi hiki kinaeleza jambo ambalo Bathsheba anapaswa kumwomba Sulemani alifanye. Hali ya utegemezi ‘anipe’ ni ya asili katika Kiswahili baada ya ‘mwambie’.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: Abishagi, Mshunami
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili, na neno la asili yake limetafsiriwa kama jina la mtu kutoka Shunemu.
- source_word: לְאִשָּׁה
  choice: awe mke wangu
  rationale: Muundo huu unaonyesha wazi kusudi la kumwoa Abishagi. ‘Awe mke wangu’ ni Kiswahili cha kawaida na kinaweka wazi uhusiano wa ndoa uliokusudiwa.
