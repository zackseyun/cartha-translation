id: 1KI.2.32
reference: 1 Kings 2:32
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הֵשִׁיב֩ יְהוָ֨ה אֶת דָּמ֜/וֹ עַל רֹאשׁ֗/וֹ אֲשֶׁ֣ר פָּגַ֣ע בִּ/שְׁנֵֽי אֲ֠נָשִׁים צַדִּקִ֨ים וְ/טֹבִ֤ים מִמֶּ֨/נּוּ֙ וַ/יַּהַרְגֵ֣/ם בַּ/חֶ֔רֶב וְ/אָבִ֥/י דָוִ֖ד לֹ֣א יָדָ֑ע אֶת אַבְנֵ֤ר בֶּן נֵר֙ שַׂר צְבָ֣א יִשְׂרָאֵ֔ל וְ/אֶת עֲמָשָׂ֥א בֶן יֶ֖תֶר שַׂר צְבָ֥א יְהוּדָֽה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/032.yaml
  text: 'And Yahweh will return his blood on his own head[a], because he struck down two men more righteous and better than he, and killed them with the sword while my father David did not know it: Abner son of Ner, commander of Israel’s army, and Amasa son of Jether, commander of Judah’s army.'
translation:
  language: sw
  text: 'Yahweh atairudisha damu yake juu ya kichwa chake mwenyewe[a], kwa sababu aliwashambulia watu wawili waliokuwa waadilifu na wema kuliko yeye, akawaua kwa upanga bila baba yangu Daudi kujua: Abneri mwana wa Neri, mkuu wa jeshi la Israeli, na Amasa mwana wa Yetheri, mkuu wa jeshi la Yuda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atairudisha hatia yake ya damu juu ya kichwa chake.” Nahau ya Kiebrania inaonyesha kwamba wajibu na adhabu ya damu aliyomwaga vinamrudia mwenye hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: atairudisha
  rationale: Kauli ya kusababisha ya שוב hapa inaonyesha malipo yanayomrudia mkosaji; ‘atairudisha’ huhifadhi taswira ya Kiebrania inayoungana na ‘juu ya kichwa chake.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: דָּמוֹ ... עַל רֹאשׁוֹ
  choice: damu yake juu ya kichwa chake mwenyewe
  rationale: Huhifadhi nahau fupi ya Kiebrania kuhusu wajibu wa umwagaji damu; ‘mwenyewe’ huonyesha wazi kwamba matokeo yanamrudia mkosaji.
- source_word: פָּגַע
  choice: aliwashambulia
  rationale: Katika muktadha huu kitenzi kinaonyesha kuwavamia kwa uhasama, na kifo chao kinaelezwa wazi na kitenzi kinachofuata.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: watu wawili
  rationale: Ni Kiswahili cha kawaida na wazi; majina yanayofuata yanaonyesha kwamba walikuwa wanaume.
- source_word: צַדִּקִים וְטֹבִים מִמֶּנּוּ
  choice: waliokuwa waadilifu na wema kuliko yeye
  rationale: ‘Waadilifu’ huhifadhi maana ya kimaadili na kisheria ya צדיקים, huku ‘wema kuliko yeye’ ikidumisha ulinganisho wa maandishi.
- source_word: וַיַּהַרְגֵם בַּחֶרֶב
  choice: akawaua kwa upanga
  rationale: Ni tafsiri ya moja kwa moja, ya asili, na inayohifadhi chombo kilichotumiwa kuwaua.
- source_word: וְאָבִי דָוִד לֹא יָדָע
  choice: bila baba yangu Daudi kujua
  rationale: 'Muunganiko huo unaeleweka kimazingira: Daudi hakuwa na habari kuhusu mauaji hayo. Kiswahili hiki ni wazi bila kudai kwamba hakujua mambo kwa ujumla.'
- source_word: שַׂר צְבָא יִשְׂרָאֵל / יְהוּדָה
  choice: mkuu wa jeshi la Israeli / Yuda
  rationale: ‘Mkuu wa jeshi’ ni cheo cha kijeshi kinachoeleweka katika Kiswahili cha sasa na kinatumika kwa uthabiti kwa viongozi wote wawili.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu; kulitoh oa kama ‘Yahweh’ huhifadhi tofauti kati ya jina hilo na cheo.
- issue: Maana ya nahau ya damu juu ya kichwa
  choice: Kuhifadhi nahau katika maandishi na kuifafanua katika tanbihi kuwa hatia na adhabu ya umwagaji damu vinamrudia mkosaji
  alternative: Kutafsiri moja kwa moja kuwa ‘atamrudishia hatia ya damu’
  rationale: Chaguo hili huhifadhi taswira na mvutano wa maandishi ya Kiebrania bila kumwacha msomaji na maana halisi potovu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi huhifadhi muundo wa hukumu na orodha ya waliouawa, huku usemi ‘bila ... kujua’ ukiweka wazi hali ya Daudi. Majina yametolewa kwa maumbo ya Kiswahili yaliyozoeleka: Abneri, Neri, Yetheri, Israeli, na Yuda.'
