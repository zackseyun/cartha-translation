base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/044.yaml
  text: Then the king said to Shimei[a], “You know all the evil that your heart knows, which you did to David my father[b]; and Yahweh has returned your evil on your own head.”
translation:
  language: sw
  text: Ndipo mfalme akamwambia Shimei, “Wewe unajua uovu wote ambao moyo wako unaujua[a], ule uliomtendea Daudi baba yangu; na Yahwe ameirudisha[b] juu ya kichwa chako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambao unaujua moyoni mwako.” Kiebrania kinasema kwa karibu zaidi, “ambao moyo wako unaujua,” kikisisitiza ufahamu wa ndani wa Shimei kuhusu hatia yake.
    reason: lexical_alternative
  - marker: b
    text: Au, “ameurejesha” au “amekulipiza kwa.” Kitenzi cha Kiebrania kina wazo la kuufanya uovu wa Shimei umrudie yeye mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ אֶל־שִׁמְעִי
  choice: Ndipo mfalme akamwambia Shimei
  rationale: “Ndipo” pamoja na umbo la masimulizi “akamwambia” huendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida, huku “mfalme” ikihifadhi cheo chenye kiambishi cha uamilifu.
- source_word: אַתָּה יָדַעְתָּ
  choice: Wewe unajua
  rationale: Kiwakilishi huru “Wewe” kinahifadhi msisitizo wa אַתָּה, na “unajua” linaonyesha ufahamu wa Shimei unaosisitizwa katika hotuba hii.
- source_word: כָּל־הָרָעָה
  choice: uovu wote
  rationale: Katika muktadha huu רָעָה ni kosa lenye uzito wa kimaadili, si maafa tu; “uovu” huhifadhi nguvu hiyo.
- source_word: אֲשֶׁר יָדַע לְבָבְךָ
  choice: ambao moyo wako unaujua
  rationale: Tafsiri hii inadumisha tamathali ya Kiebrania inayoufanya moyo kuwa mhusika anayejua, hivyo ikisisitiza ufahamu wa ndani wa hatia.
- source_word: אֲשֶׁר עָשִׂיתָ לְדָוִד אָבִי
  choice: ule uliomtendea Daudi baba yangu
  rationale: “Uliomtendea” huonyesha kwamba uovu huo ulielekezwa kwa Daudi; “ule” huunganisha wazi kishazi hiki na “uovu” bila kuongeza maelezo ya kiitikadi.
- source_word: וְהֵשִׁיב
  choice: naye ... ameurejesha
  rationale: Hifili ya שוב inaonyesha kusababisha kitu kirudi. “Ameurejesha” huhifadhi picha ya uovu kurudishwa kwa mtendaji wake badala ya kuibadili moja kwa moja kuwa “amelipiza.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limetolewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: אֶת־רָעָתְךָ בְּרֹאשֶׁךָ
  choice: uovu wako juu ya kichwa chako
  rationale: Kurudia “uovu” kunadumisha ulinganifu wa רָעָה katika aya, na “juu ya kichwa chako” huhifadhi tamathali ya matokeo ya kosa kumrudia aliyelitenda.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahwe
  alternative: Bwana
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; kutaja “Yahwe” huhifadhi jina hilo binafsi bila kulibadilisha kuwa cheo.
- issue: Utendaji wa Mungu katika malipo ya uovu
  choice: Yahwe ameurejesha uovu wako juu ya kichwa chako
  alternative: Yahwe amekulipiza kwa uovu wako
  rationale: Aya inamtaja Yahwe wazi kuwa mtendaji, lakini kitenzi na tamathali ya kurudi kwa uovu zimehifadhiwa bila kupanua dai hilo kuwa maelezo mapana ya kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kifalme lakini kinachoeleweka kwa msomaji wa kawaida. Tamathali isiyo ya kawaida ya “moyo wako unaujua” imehifadhiwa makusudi, huku tanbihi ikitoa usemi wa kawaida zaidi. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
