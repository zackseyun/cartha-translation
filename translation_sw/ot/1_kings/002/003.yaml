  naturalness: Matini iliyorekebishwa ni Kiswahili Sanifu cha Afrika Mashariki, yenye mtiririko wa kawaida na inayohifadhi muundo wa orodha ya sheria. “Popote utakakoelekea” hutoa kwa uwazi zaidi wazo la “wherever you turn.”
  terminology: “Yahwe” huhifadhi jina la binafsi יהוה. “Maagizo, amri, hukumu, na shuhuda” hudumisha orodha ya istilahi za kisheria na kiagano bila kudai kwamba kila istilahi ina tofauti kali isiyobadilika katika Kiswahili.
