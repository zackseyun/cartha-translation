  - severity: medium
    issue: “ili ufanikiwe” kama matini kuu
    rationale: Hii inawezekana kimuktadha, lakini Hifili ya שׂכל hapa kwa karibu zaidi hueleza kutenda kwa hekima au busara. Maana ya kufanikiwa ihifadhiwe katika tanbihi.
  - severity: low
    issue: “na kila utakakoelekea”
    rationale: Usemi huo hauonyeshi wazi “katika” kila mwelekeo/mahali. “na popote utakakoelekea” ni wa kawaida na sahihi zaidi.
