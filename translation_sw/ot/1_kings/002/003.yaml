revisions:
- from: Nawe utimize wajibu wako kwa Yahwe Mungu wako kwa kuenenda katika njia zake na kushika masharti yake, amri zake, hukumu zake na shuhuda zake, kama ilivyoandikwa katika Sheria ya Musa, ili ufanikiwe[a] katika yote utakayofanya na kila utakakoelekea.
  to: Na ushike maagizo ya Yahwe, Mungu wako, kwa kuenenda katika njia zake na kwa kushika maagizo yake, amri zake, hukumu zake, na shuhuda zake, kama ilivyoandikwa katika Sheria ya Musa, ili utende kwa busara[a] katika kila utakachofanya na popote utakakoelekea.
