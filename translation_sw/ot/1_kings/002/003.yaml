source:
  edition: WLC
  text: וְ/שָׁמַרְתָּ֞ אֶת מִשְׁמֶ֣רֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לָ/לֶ֤כֶת בִּ/דְרָכָי/ו֙ לִ/שְׁמֹ֨ר חֻקֹּתָ֤י/ו מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/עֵדְוֺתָ֔י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֣ת מֹשֶׁ֑ה לְמַ֣עַן תַּשְׂכִּ֗יל אֵ֚ת כָּל אֲשֶׁ֣ר תַּֽעֲשֶׂ֔ה וְ/אֵ֛ת כָּל אֲשֶׁ֥ר תִּפְנֶ֖ה שָֽׁם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/003.yaml
  text: And keep the charge of Yahweh your God by walking in his ways and by keeping his statutes[a], his commandments, his judgments, and his testimonies, as it is written in the Law of Moses, so that you may act wisely in all that you do and wherever you turn.
translation:
  language: sw
  text: Na ushike maagizo ya Yahwe, Mungu wako, kwa kuenenda katika njia zake na kwa kushika maagizo yake, amri zake, hukumu zake, na shuhuda zake, kama ilivyoandikwa katika Sheria ya Musa, ili utende kwa busara[a] katika kila utakachofanya na popote utakakoelekea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili ufanikiwe.” Kitenzi cha Kiebrania kinaweza kukazia kutenda kwa busara au mafanikio yanayotokana na mwenendo huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ אֶת־מִשְׁמֶרֶת
  choice: Nawe utimize wajibu wako
  rationale: Katika muktadha huu kitenzi kinaendeleza agizo la Daudi, na nomino מִשְׁמֶרֶת humaanisha jukumu au wajibu uliokabidhiwa. Kiswahili hiki ni cha kawaida kuliko tafsiri ya neno kwa neno ‘ushike ulinzi.’
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: Jina binafsi la Mungu limehifadhiwa kwa umbo la Kiswahili ‘Yahwe,’ likifuatiwa na kifungu cha agano ‘Mungu wako.’
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: kwa kuenenda katika njia zake
  rationale: Huhifadhi sitiari ya Kiebrania ya kuenenda katika njia za Mungu huku ikiwa lugha ya heshima na inayoeleweka kwa wasomaji wa Kiswahili.
- source_word: חֻקֹּתָיו מִצְוֺתָיו וּמִשְׁפָּטָיו וְעֵדְוֺתָיו
  choice: masharti yake, amri zake, hukumu zake na shuhuda zake
  rationale: 'Maneno tofauti ya kisheria na kiagano yamehifadhiwa kadiri Kiswahili kinavyoruhusu: masharti, amri, hukumu na shuhuda.'
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: katika Sheria ya Musa
  rationale: Katika muktadha huu תּוֹרָה hurejelea maandishi ya Musa yenye mamlaka; ‘Sheria ya Musa’ ni usemi ulio wazi na uliozoeleka.
- source_word: לְמַעַן תַּשְׂכִּיל
  choice: ili ufanikiwe[a]
  rationale: Kitenzi kinaweza kueleza kufanikiwa kunakotokana na kutenda kwa busara. ‘Ufanikiwe’ kinafaa katika muktadha wa matokeo ya uaminifu wa mfalme, huku tanbihi ikihifadhi maana ya kutenda kwa busara.
- source_word: וְאֵת כָּל־אֲשֶׁר תִּפְנֶה שָׁם
  choice: na kila utakakoelekea
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kila upande au mahali atakakoelekea, bila kulipanua kuliko maandishi ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la pekee יהוה, si cheo tu; kwa hiyo jina hilo limeandikwa ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- issue: Maana ya לְמַעַן תַּשְׂכִּיל
  choice: ili ufanikiwe
  alternative: ili utende kwa busara
  rationale: Kiebrania kinaweza kusisitiza mwenendo wa busara au mafanikio yanayotokana nao. Matini kuu imetumia ‘ufanikiwe,’ na tanbihi imehifadhi maana nyingine bila kuahidi ustawi wa mali au kuingiza fundisho la baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi sitiari ya ‘kuenenda katika njia zake’ na orodha ya istilahi za kiagano, lakini umetumia ‘utimize wajibu wako’ ili sentensi iwe ya kawaida na wazi kwa msomaji wa leo.
