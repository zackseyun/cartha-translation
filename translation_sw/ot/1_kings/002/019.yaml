base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/019.yaml
  text: So Bathsheba went to King Solomon to speak to him on behalf of Adonijah. The king rose to meet her and bowed down before her. Then he sat on his throne and had a throne placed for the king's mother, and she sat at his right hand.
translation:
  language: sw
  text: Basi Bathsheba akaenda kwa Mfalme Sulemani ili kuzungumza naye kwa ajili ya Adonia. Mfalme akasimama kumlaki, akamwinamia, kisha akaketi kwenye kiti chake cha enzi. Akaagiza kiti cha enzi kiwekwe kwa ajili ya mama wa mfalme, naye akaketi upande wake wa kulia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל אֲדֹנִיָּהוּ
  choice: kwa ajili ya Adonia
  rationale: Katika muktadha huu Bathsheba anamwendea Sulemani akiwa mwombezi wa Adonia; usemi huu unaonyesha kusudi hilo kwa Kiswahili cha kawaida.
- source_word: וַיִּשְׁתַּחוּ לָהּ
  choice: akainama mbele yake
  rationale: Kitenzi kinaonyesha kuinama kwa heshima. Tafsiri hii inahifadhi tendo la heshima bila kulifanya lisikike kama ibada ya kidini.
- source_word: כִּסֵּא
  choice: kiti cha enzi
  rationale: Neno linarejelea kiti cha kifalme katika matukio yote mawili, si kiti cha kawaida.
- source_word: לִימִינוֹ
  choice: upande wake wa kulia
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya nafasi ya heshima iliyotajwa.
theological_decisions:
- issue: Maana ya kuinama kwa mfalme mbele ya mama yake
  choice: akainama mbele yake
  alternative: akamsujudia
  rationale: Muktadha unaonyesha heshima ya kifalme na ya kifamilia, wala si lazima ibada. Chaguo hili haliongezi hitimisho la kidhehebu.
- issue: Bathsheba kuzungumza kuhusu Adonia
  choice: kwa ajili ya Adonia
  alternative: kuhusu Adonia
  rationale: Muktadha wa ombi unaunga mkono maana ya uwakilishi au maombezi, ingawa kihusishi cha Kiebrania peke yake kinaweza pia kumaanisha ‘kuhusu.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano mrefu wa vitenzi vya Kiebrania umegawanywa katika sentensi za asili bila kuondoa tendo lolote. ‘Mama yake mfalme’ imehifadhiwa karibu na muundo wa Kiebrania huku ikisomeka kwa kawaida.
