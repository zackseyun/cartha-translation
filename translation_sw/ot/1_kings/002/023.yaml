  text: וַ/יִּשָּׁבַע֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף כִּ֣י בְ/נַפְשׁ֔/וֹ דִּבֶּר֙ אֲדֹ֣נִיָּ֔הוּ אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/023.yaml
  text: Then King Solomon swore by Yahweh[a], saying, “May God do so to me, and more also[b], for Adonijah has spoken this word against his own life.”
translation:
  language: sw
  text: Ndipo Mfalme Sulemani akaapa kwa Yahwe[a], akisema, “Mungu na anitendee hivi, tena na zaidi, kwa maana Adoniya amesema jambo hili kwa kuhatarisha uhai wake mwenyewe.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina la Kiebrania hapa ni יְהוָה (YHWH), lililotoholewa kuwa “Yahwe.”
    reason: divine_name
  - marker: b
    text: Kihalisi, “amesema jambo hili kwa/juu ya uhai wake.” Hii ni nahau inayomaanisha kwamba kauli yake imeweka uhai wake hatarini au itamgharimu uhai wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: akaapa
  rationale: Kitenzi hiki humaanisha kuapa au kula kiapo; “akaapa” ni usemi mfupi na wa kawaida katika simulizi la Kiswahili.
- source_word: בַּיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi kinaonyesha yule ambaye kiapo kinaapiwa kwake; jina la Mungu יְהוָה limetoholewa kuwa “Yahwe.”
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: Mungu na anitendee hivi, tena na zaidi
  rationale: Hii ni kauli maalumu ya kiapo inayomwomba Mungu alete adhabu isiyotajwa wazi. Muundo huu unahifadhi uzito wa kujilaani na nyongeza ya Kiebrania huku ukiwa wa kueleweka kwa Kiswahili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la neno ni la wingi, hapa linamtaja Mungu mmoja na hivyo limetafsiriwa kwa umoja.
- source_word: כִּי
  choice: kwa maana
  rationale: 'Katika muktadha huu כִּי inaeleza sababu au kusisitiza msingi wa kiapo: kauli ya Adoniya imehatarisha uhai wake. Haisomwi hapa kama sharti lililokanushwa.'
- source_word: בְנַפְשׁוֹ
  choice: kwa kuhatarisha uhai wake mwenyewe
  rationale: Kirai hicho kwa karibu ni “kwa/juu ya nafsi yake”; katika muktadha kinamaanisha kwamba alichosema kinamweka katika hatari ya kupoteza uhai. Tafsiri hii huwasilisha maana bila kufanya tamathali ya Kiebrania isieleweke.
- source_word: דִּבֶּר ... אֶת־הַדָּבָר הַזֶּה
  choice: amesema jambo hili
  rationale: “Jambo” linaweza kuwakilisha דָּבָר kama neno, kauli, au jambo, na hapa ni la asili zaidi kuliko “amesema neno hili.”
- source_word: אֲדֹנִיָּהוּ
  choice: Adoniya
  rationale: Jina limetoholewa kwa namna inayofaa matamshi na tahajia ya Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la agano יְהוָה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza mapokeo ya dhehebu fulani.
- issue: Nguvu ya kiapo cha Sulemani
  choice: Mungu na anitendee hivi, tena na zaidi
  alternative: Mungu na aniadhibu vikali
  rationale: Kauli ya asili haielezi adhabu yenyewe. Tafsiri imehifadhi kutotajwa huko badala ya kufafanua aina ya hukumu.
- issue: Maana ya כִּי katika kiapo
  choice: kwa maana
  alternative: ikiwa
  rationale: Hapa kauli inayofuata inatoa sababu ya hukumu ya Sulemani na inalingana na mtiririko wa simulizi. Kutafsiri “ikiwa” kungeweza kuunda sharti lisilo wazi au kuhitaji kuongeza ukanushi usiopo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. “Ndipo ... akaapa” hudumisha mwendelezo wa simulizi; kauli ya kiapo imeachwa nzito na yenye kutotaja wazi adhabu, kama ilivyo katika Kiebrania.
