  text: וּ/שְׁלֹמֹ֕ה יָשַׁ֕ב עַל כִּסֵּ֖א דָּוִ֣ד אָבִ֑י/ו וַ/תִּכֹּ֥ן מַלְכֻת֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/012.yaml
  text: And Solomon sat on the throne of David his father[a], and his kingdom was firmly established.
translation:
  language: sw
  text: Sulemani akaketi juu ya kiti cha enzi cha Daudi, baba yake, na ufalme wake ukawa imara sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utawala wake ukathibitishwa sana” au “utawala wake ukawa salama sana.”
    reason: Neno מַלְכוּת linaweza kumaanisha ufalme au utawala, na וַתִּכֹּן linaweza kueleweka kuwa kuthibitishwa, kuimarishwa, au kuwa salama.
lexical_decisions:
- source_word: יָשַׁב
  choice: akaketi
  rationale: Katika muktadha wa kurithi ufalme, pamoja na עַל כִּסֵּא (‘kwenye kiti cha ufalme’), kitenzi kinaonyesha Sulemani kukalia kiti cha kifalme na kuanza kutawala; ‘akaketi’ huhifadhi taswira ya Kiebrania bila kufafanua kupita kiasi.
- source_word: כִּסֵּא
  choice: kiti cha ufalme
  rationale: Katika muktadha wa kifalme, neno hili linamaanisha kiti cha mfalme, si kiti cha kawaida. ‘Kiti cha ufalme’ ni usemi wa kawaida na wenye heshima katika Kiswahili.
- source_word: אָבִיו
  choice: baba yake
  rationale: Daudi alikuwa baba halisi wa Sulemani, kwa hiyo maana ya moja kwa moja ya kifamilia inafaa.
- source_word: וַתִּכֹּן
  choice: ukaimarika
  rationale: Nifali ya כון huonyesha hali ya kuthibitishwa, kuimarishwa, au kuwa salama. ‘Ukaimarika’ ni ya asili katika Kiswahili na inaonyesha matokeo ya utawala kuwa thabiti bila kutaja mtendaji ambaye maandiko hayamtaji.
- source_word: מַלְכֻתוֹ
  choice: ufalme wake
  rationale: Neno linaweza kumaanisha ufalme, utawala, au umfalme. ‘Ufalme wake’ huhifadhi upana wa maana, huku tanbihi ikionyesha uwezekano wa kulielewa kama utawala au hadhi ya kifalme.
- source_word: מְאֹד
  choice: sana
  rationale: ‘Sana’ huwasilisha moja kwa moja nguvu ya kielezi cha Kiebrania na kusikika kwa kawaida pamoja na ‘ukaimarika.’
theological_decisions:
- issue: Lugha ya urithi wa kiti cha Daudi
  choice: Mstari umetafsiriwa kama taarifa ya kihistoria kuhusu Sulemani kukalia kiti cha Daudi na kuimarika kwa ufalme wake.
  alternative: Kutumia maneno yanayosisitiza kwa uwazi uhalali wa nasaba au maana ya baadaye ya Kimasihi.
  rationale: Mstari wenyewe unasimulia Sulemani kuanza kutawala baada ya Daudi. Ingawa kiti cha Daudi kina umuhimu mpana katika Biblia, maana hiyo ya baadaye haijaelezwa wazi hapa, hivyo haijaingizwa katika tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kueleweka kwa wasomaji wa kawaida, huku taswira ya kuketi kwenye kiti cha ufalme na utata wa מַלְכוּת vikihifadhiwa.
