base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/026.yaml
  text: And to Abiathar the priest the king said[a], “Go to Anathoth, to your field, for you are a man deserving death; but on this day I will not put you to death, because you carried the ark of the Lord GOD before David my father, and because you shared in all the affliction with which my father was afflicted.”
translation:
  language: sw
  text: Mfalme akamwambia kuhani Abiathari, “Nenda Anatothi, kwenye shamba lako, kwa maana unastahili kuuawa.[a] Lakini leo sitakuua, kwa sababu uliibeba Sanduku la Bwana Yahweh mbele ya Daudi baba yangu, na kwa sababu uliteseka katika yote ambayo baba yangu aliteseka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “wewe ni mtu wa kifo,” yaani, mtu anayestahili kifo au aliye chini ya hukumu ya kuuawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָתֹת
  choice: Anatothi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku likihifadhi umbo la jina la Kiebrania.
- source_word: עַל שָׂדֶיךָ
  choice: kwenye shamba lako
  rationale: Huhifadhi maana halisi ya eneo la kilimo au mali yake huko Anatothi bila kuipanua kuwa ‘milki’ kwa ujumla.
- source_word: אִישׁ מָוֶת
  choice: unastahili kuuawa
  rationale: Nahau ya Kiebrania, kihalisi ‘mtu wa kifo,’ humaanisha mtu anayestahili hukumu ya kifo au aliye chini ya adhabu hiyo. Kiswahili hiki ni wazi na cha kawaida; umbo halisi limeelezwa katika tanbihi.
- source_word: אֲמִיתֶךָ
  choice: sitakuua
  rationale: Hifili ya מות humaanisha kusababisha mtu afe au kumuua; katika muktadha huu ni kutotekeleza hukumu ya kifo siku hiyo.
- source_word: נָשָׂאתָ אֶת אֲרוֹן אֲדֹנָי יְהוִה
  choice: uliibeba Sanduku la Bwana YAHWEH
  rationale: נשא hapa ni kubeba kwa mwili. ‘Sanduku’ linarejelea Sanduku la Agano katika muktadha, bila kuongeza neno ‘Agano’ ambalo halipo katika mstari. Majina yote mawili ya Mungu katika אֲדֹנָי יְהוִה yamehifadhiwa.
- source_word: לִפְנֵי דָוִד אָבִי
  choice: mbele ya Daudi baba yangu
  rationale: Hutoa maana ya mahali na uhusiano ya לִפְנֵי kwa njia fupi na ya asili.
- source_word: הִתְעַנִּיתָ ... הִתְעַנָּה
  choice: uliteseka ... aliteseka
  rationale: Marudio ya ‘teseka’ yanahifadhi mwangwi wa vitenzi viwili vya mzizi mmoja katika Kiebrania na yanaonyesha kwamba Abiathari alishiriki mateso ya Daudi.
- source_word: כִּי ... וְכִי
  choice: kwa sababu ... na kwa sababu
  rationale: Vishazi vyote viwili vinatoa sababu za mfalme kutotekeleza hukumu ya kifo mara moja.
theological_decisions:
- issue: Kutafsiri jina la Mungu katika אֲדֹנָי יְהוִה
  choice: Bwana YAHWEH
  alternative: Bwana MUNGU
  rationale: Kiebrania kina cheo אֲדֹנָי pamoja na jina la agano יהוה. ‘Bwana YAHWEH’ huhifadhi vipengele vyote viwili na huepuka kurudia ‘Bwana Bwana.’
- issue: Nguvu ya hukumu katika אִישׁ מָוֶת
  choice: unastahili kuuawa
  alternative: wewe ni mtu wa kifo
  rationale: Hii inaonyesha ustahili au uwajibikaji wa hukumu ya kifo, si tangazo kwamba Abiathari tayari amekufa. Tanbihi huhifadhi nahau halisi bila kutatua zaidi msingi wa hukumu hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Mpangilio wa sentensi umefanywa wa kawaida kwa Kiswahili, huku marudio ya sababu na ya kitenzi ‘teseka’ yakihifadhiwa.
