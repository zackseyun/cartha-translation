base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/033.yaml
  text: So their blood shall return on the head of Joab and on the head of his offspring forever[a], but for David and for his offspring and for his house and for his throne, there shall be peace forever from Yahweh.
translation:
  language: sw
  text: Damu yao itarudi juu ya kichwa cha Yoabu na juu ya kichwa cha uzao wake milele[a]. Lakini kwa Daudi, na kwa uzao wake, na kwa nyumba yake, na kwa kiti chake cha enzi, kutakuwa na amani milele kutoka kwa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “damu yao”; hii ni nahau ya hatia ya damu waliyoimwaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: itarudi
  rationale: 'Kitenzi kinaeleza matokeo ya baadaye ya hukumu: hatia na matokeo ya damu iliyomwagwa yanamrudia mwenye kuhusika.'
- source_word: דְמֵיהֶם
  choice: damu yao
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya damu ya waliouawa, huku tanbihi ikifafanua maana yake ya uwajibikaji kwa damu iliyomwagwa.
- source_word: בְּרֹאשׁ
  choice: juu ya kichwa cha
  rationale: Hifadhi nahau ya Kiebrania inayowakilisha lawama au matokeo ya kitendo kumwangukia mhusika.
- source_word: זַרְעוֹ
  choice: uzao wake
  rationale: ‘Uzao’ ni neno la kawaida na lenye uzito wa kifasihi linaloweza kumaanisha vizazi vya mtu kwa ujumla.
- source_word: לְעֹלָם / עַד עוֹלָם
  choice: milele
  rationale: Neno hili linaonyesha kudumu kwa hukumu upande mmoja na kwa amani ya kifalme upande mwingine.
- source_word: יִהְיֶה שָׁלוֹם
  choice: kutakuwa na amani
  rationale: Muundo huu wa kuwepo unahifadhi maana pana ya שָׁלוֹם bila kuifupisha kuwa ustawi wa mali pekee.
- source_word: לְדָוִד וּלְזַרְעוֹ וּלְבֵיתוֹ וּלְכִסְאוֹ
  choice: kwa Daudi, uzao wake, nyumba yake, na kiti chake cha ufalme
  rationale: ‘Kwa’ huonyesha wale watakaonufaika na amani; ‘nyumba’ na ‘kiti cha ufalme’ zinahifadhi maana ya nasaba ya kifalme.
- source_word: מֵעִם יְהוָה
  choice: kutoka kwa Yahweh
  rationale: Inaonyesha wazi kuwa Yahweh ndiye chanzo cha amani hiyo.
theological_decisions:
- issue: Tofauti kati ya hukumu juu ya ukoo wa Yoabu na amani kwa ukoo wa Daudi
  choice: Kutumia ‘Lakini kwa Daudi...’
  alternative: Kutumia kiunganishi cha kawaida ‘Na kwa Daudi...’
  rationale: Ingawa kiunganishi cha Kiebrania kwa umbo ni ‘na,’ muktadha unatofautisha hukumu inayompata Yoabu na amani anayopewa Daudi.
- issue: Maana ya שָׁלוֹם katika muktadha wa nasaba ya kifalme
  choice: amani
  alternative: ustawi au hali njema
  rationale: ‘Amani’ huhifadhi upana wa neno, unaoweza kujumuisha usalama, hali njema, na uthabiti wa nasaba bila kulifafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa nahau ‘damu ... juu ya kichwa’ umehifadhiwa kwa sababu ya uzito wake wa kisheria na kifasihi, kisha umefafanuliwa katika tanbihi.
