  text: Naye akasema, “Abishagi, Mshunami, apewe Adoniya, ndugu yako, awe mke wa Adoniya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Naye akasema
  rationale: Waw-consecutive inaendeleza simulizi; “Naye akasema” hudumisha mtiririko wa kawaida wa Kiebrania na kurejelea msemaji wa kike bila kufafanua zaidi.
- source_word: יֻתַּן
  choice: na apewe
  rationale: Hii ni jussive tendwa inayoonyesha ombi au pendekezo; “na apewe” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya hiari.
- source_word: אֲבִישַׁג
  choice: Abishagi
  rationale: Jina limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: הַשֻּׁנַמִּית
  choice: Mshunemu
  rationale: Neno la utambulisho linaonyesha kwamba Abishagi alitoka Shunemu; “Mshunemu” ni namna fupi na ya asili ya Kiswahili ya kutaja mwenyeji wa huko.
- source_word: לַאֲדֹנִיָּהוּ
  choice: Adoniya
  rationale: Kiambishi ל kinaonyesha mpokeaji katika tendo la kumpa mwanamke katika ndoa; Kiswahili hutumia “apewe Adoniya” bila kuhitaji kihusishi kingine.
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Kiambishi cha nafsi ya pili umoja wa kiume kinamwelekea Sulemani moja kwa moja na kuhifadhi uhusiano wa kifamilia.
- source_word: לְאִשָּׁה
  choice: awe mke wake
  rationale: Katika muktadha huu muundo huo unaeleza ndoa. “Awe mke wake” ni wazi na wa asili katika Kiswahili, bila kupunguza maana rasmi ya kuwa mke.
