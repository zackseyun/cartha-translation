base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/040.yaml
  text: Then Shimei arose[a], saddled his donkey, and went to Gath, to Achish, to look for his servants. Shimei went and brought his servants back from Gath.
translation:
  language: sw
  text: Ndipo Shimei akainuka, akamtandika punda wake, akaenda Gathi kwa Akishi kuwatafuta watumwa wake.[a] Shimei akaenda, akawaleta watumwa wake kutoka Gathi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumishi wake.” Neno la Kiebrania עֲבָדָיו linaweza kumaanisha watumishi au watumwa; hapa muktadha wa kutoroka kwao na kuchukuliwa kwao unaonyesha hali ya utumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Neno קום humaanisha kuinuka au kusimama. “Akainuka” linadumisha mfuatano wa simulizi bila kulifanya neno hilo limaanishe moja kwa moja kuanza safari.
- source_word: וַיַּחֲבֹשׁ אֶת חֲמֹרוֹ
  choice: akamtandika punda wake
  rationale: Katika muktadha wa safari, חבש pamoja na punda humaanisha kumtandika au kumwandaa kwa ajili ya kupandwa. “Akamtandika punda wake” ni usemi wa kawaida na mahususi.
- source_word: גַּתָה
  choice: Gathi
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kwenda kuelekea Gathi; Kiswahili huonyesha jambo hilo kwa “akaenda Gathi.”
- source_word: אָכִישׁ
  choice: Akishi
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: לְבַקֵּשׁ
  choice: kuwatafuta
  rationale: בקש hapa ni kutafuta watu waliotoroka. “Kuwatafuta” ni Kiswahili cha sasa, wazi na cha kawaida katika simulizi.
- source_word: עֲבָדָיו
  choice: watumwa wake
  rationale: עבד inaweza kumaanisha mtumishi au mtumwa. Kwa kuwa watu hawa walikuwa wametoroka na Shimei alienda kuwachukua, muktadha unaonyesha hali ya utumwa; hata hivyo, maana nyingine imehifadhiwa katika tanbihi.
- source_word: וַיָּבֵא אֶת עֲבָדָיו מִגַּת
  choice: akawaleta watumwa wake kutoka Gathi
  rationale: Hifili ya בוא humaanisha kuleta. Tafsiri inadumisha kwa ukaribu kauli ya chanzo bila kuongeza waziwazi wazo la “kurudi,” ingawa hilo linaeleweka kutokana na muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kuwa Shimei, Gathi na Akishi; muundo wa vitenzi mfululizo unadumisha mwendo wa simulizi la Kiebrania.
