  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/שְּׁמֻעָה֙ בָּ֣אָה עַד יוֹאָ֔ב כִּ֣י יוֹאָ֗ב נָטָה֙ אַחֲרֵ֣י אֲדֹנִיָּ֔ה וְ/אַחֲרֵ֥י אַבְשָׁל֖וֹם לֹ֣א נָטָ֑ה וַ/יָּ֤נָס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/028.yaml
  text: And the report came to Joab[a], for Joab had turned after Adonijah, though he had not turned after Absalom[b]. So Joab fled to the tent of Yahweh and took hold of the horns of the altar.
translation:
  language: sw
  text: Habari hiyo ikamfikia Yoabu, kwa maana Yoabu alikuwa amemfuata Adoniya[a], ingawa hakumfuata Absalomu. Basi Yoabu akakimbilia hema la Yahwe, akazishika pembe za madhabahu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amemuunga mkono Adoniya … hakumuunga mkono Absalomu.” Kiebrania kinasema kihalisi “alikuwa amegeuka na kumfuata.”
    reason: lexical_alternative
  - marker: b
    text: “Pembe” zilikuwa sehemu zilizochomoza kama pembe kwenye pembe nne za madhabahu. Kuzishika kulikuwa njia ya kuomba hifadhi au rehema.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֻעָה
  choice: Habari hiyo
  rationale: Neno hili humaanisha habari au taarifa iliyomfikia mtu. “Habari hiyo” ni ya kawaida na ya asili katika Kiswahili, huku kiashiria “hiyo” kikihifadhi umaalumu wa neno la Kiebrania.
- source_word: בָּאָה עַד
  choice: ikamfikia
  rationale: Nahau hiyo ni “ilikuja mpaka kwa,” lakini “ikamfikia” huwasilisha kwa Kiswahili cha kawaida wazo la habari kumfikia mtu.
- source_word: נָטָה אַחֲרֵי
  choice: alikuwa amemfuata
  rationale: Uchaguzi huu unahifadhi sitiari ya Kiebrania ya “kugeuka/kufuata nyuma ya” na marudio yake kuhusu Adoniya na Absalomu, bila kuficha maana ya kisiasa; tanbihi inatoa maana ya wazi zaidi ya kuunga mkono.
- source_word: וְאַחֲרֵי אַבְשָׁלוֹם לֹא נָטָה
  choice: ingawa hakumfuata Absalomu
  rationale: “Ingawa” huonyesha vizuri nguvu ya kukubali tofauti iliyomo katika kifungu, na “hakumfuata” huhifadhi marudio ya nahau ileile.
- source_word: וַיָּנָס
  choice: akakimbilia
  rationale: Katika muktadha huu Yoabu anakimbia kwa haraka kwenda mahali pa kujisitiri; “akakimbilia” huonyesha kukimbia kwake pamoja na mahali alipoelekea.
- source_word: אֹהֶל יְהוָה
  choice: hema la Yahwe
  rationale: Hii inafuata kwa uwazi muundo wa Kiebrania “hema la Yahwe” bila kuingiza istilahi ya kiufundi zaidi ya “maskani.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja katika tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּחֲזֵק בְּקַרְנוֹת הַמִּזְבֵּחַ
  choice: akazishika pembe za madhabahu
  rationale: Maneno haya yanahifadhi tendo halisi la kushika sehemu za madhabahu bila kutafsiri ndani ya mstari maana yake ya kiishara au ya kutafuta rehema.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano יהוה lenyewe. “Yahwe” hulihifadhi kama jina binafsi kwa namna ya kawaida katika Kiswahili.
- issue: Kuhifadhi au kufafanua nahau ya kisiasa נָטָה אַחֲרֵי
  choice: alikuwa amemfuata … hakumfuata
  alternative: alikuwa amemuunga mkono … hakumuunga mkono
  rationale: Kuhifadhi “kumfuata” kunadumisha sitiari na marudio ya Kiebrania, huku tanbihi ikieleza maana yake ya kisiasa bila kuondoa mvutano wa lugha ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wazi, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kama Yoabu, Adoniya, Absalomu na Yahwe; sentensi imehifadhi uhusiano wa kisababishi na marudio ya nahau ya Kiebrania.
