  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בָּר֑וּךְ וְ/כִסֵּ֣א דָוִ֗ד יִהְיֶ֥ה נָכ֛וֹן לִ/פְנֵ֥י יְהוָ֖ה עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/045.yaml
  text: But King Solomon will be blessed[a], and the throne of David will be established before Yahweh forever.
translation:
  language: sw
  text: Lakini Mfalme Sulemani atabarikiwa[a], na kiti cha enzi cha Daudi kitaimarishwa mbele za Yahwe milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mfalme Sulemani amebarikiwa.” Katika Kiebrania, kiarifu hiki kinaweza kueleweka kama tamko la hali ya sasa, ingawa muktadha pia unaunga mkono maana ya wakati ujao iliyotumiwa katika maandishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ שְׁלֹמֹה
  choice: Lakini Mfalme Sulemani
  rationale: Ingawa וְ kwa kawaida humaanisha ‘na’, hapa inaonyesha tofauti kati ya hukumu ya Shimei katika mstari uliotangulia na baraka ya Sulemani; hivyo ‘Lakini’ linaonyesha vizuri mtiririko wa habari.
- source_word: בָּרוּךְ
  choice: atabarikiwa
  rationale: Kivumishi/kauli tendwa hii humaanisha ‘aliyebarikiwa’ au ‘amebarikiwa’. Katika tamko hili la kifalme, sambamba na kitenzi cha wakati ujao kinachofuata, ‘atabarikiwa’ linaonyesha mwelekeo wa wakati ujao huku uwezekano wa maana ya sasa ukihifadhiwa katika tanbihi.
- source_word: וְ/כִסֵּא דָוִד
  choice: na kiti cha enzi cha Daudi
  rationale: כִּסֵּא ni ‘kiti cha enzi’, na muundo tegemezi unaonyesha kuwa ni kiti cha enzi cha Daudi.
- source_word: יִהְיֶה נָכוֹן
  choice: kitaimarishwa
  rationale: Muungano wa היה na נכון una wazo la kuwa imara, salama, au kuthibitishwa. ‘Kitaimarishwa’ ni Kiswahili cha asili kinachofaa kwa kiti cha enzi na kinahifadhi wazo la uthabiti wa nasaba.
- source_word: לִ/פְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי humaanisha ‘mbele ya’ au ‘katika uwepo wa’. Nahau ya Kiswahili ‘mbele za’ ni ya kawaida na yenye heshima; jina la agano יְהוָה limetolewa kama ‘Yahwe’.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Kirai hiki humaanisha muda usio na mwisho au wa kudumu; ‘milele’ ni tafsiri fupi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni. ‘Yahwe’ linahifadhi jina la agano badala ya kulibadili kuwa cheo.
- issue: Nguvu na wakati wa בָּרוּךְ
  choice: 'mwelekeo wa wakati ujao: ‘atabarikiwa’'
  alternative: 'tamko la sasa: ‘amebarikiwa’'
  rationale: Kishazi hakina kitenzi wazi na kinaweza kuwa tamko la hali ya sasa. Hata hivyo, muktadha wa tamko la kifalme na ulinganifu wake na ‘kitaimarishwa’ unaunga mkono tafsiri yenye mwelekeo wa wakati ujao; utata halisi umeonyeshwa katika tanbihi.
- issue: Maana ya uthabiti wa kiti cha enzi
  choice: kitaimarishwa
  alternative: kitakuwa imara / kitathibitishwa
  rationale: Tafsiri hii inadumisha taswira ya uthabiti wa kiti cha enzi na nasaba bila kuongeza maelezo ya kidhehebu kuhusu namna ahadi hiyo inavyotimizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Kiti cha enzi’ limetumiwa kwa usahihi wa taswira ya kifalme, na ‘mbele za Yahwe’ kwa mtindo wa kawaida wa kibiblia bila kuwa wa kizamani kupita kiasi.
