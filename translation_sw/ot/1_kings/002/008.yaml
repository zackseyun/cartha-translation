id: 1KI.2.8
reference: 1 Kings 2:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה עִ֠מְּ/ךָ שִֽׁמְעִ֨י בֶן גֵּרָ֥א בֶן הַ/יְמִינִי֮ מִ/בַּחֻרִים֒ וְ/ה֤וּא קִֽלְלַ֨/נִי֙ קְלָלָ֣ה נִמְרֶ֔צֶת בְּ/י֖וֹם לֶכְתִּ֣/י מַחֲנָ֑יִם וְ/הֽוּא יָרַ֤ד לִ/קְרָאתִ/י֙ הַ/יַּרְדֵּ֔ן וָ/אֶשָּׁ֨בַֽע ל֤/וֹ בַֽ/יהוָה֙ לֵ/אמֹ֔ר אִם אֲמִֽיתְ/ךָ֖ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/008.yaml
  text: And behold[a], with you is Shimei son of Gera, the Benjaminite from Bahurim, and he cursed me with a grievous curse on the day I went to Mahanaim. But he came down to meet me at the Jordan, and I swore to him by Yahweh, saying, ‘I will not put you to death with the sword.’
translation:
  language: sw
  text: Tazama, Shimei mwana wa Gera, Mbenyamini kutoka Bahurimu, yuko pamoja nawe. Yeye alinilaani kwa laana kali sana siku nilipokwenda Mahanaimu. Lakini alishuka kunilaki kwenye Yordani, nami nikamwapia kwa Yahweh, nikisema, “Sitakuua kwa upanga.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “ikiwa nitakuua kwa upanga,” yaani, muundo mfupi wa kiapo ambao sehemu ya kujilaani imeachwa bila kutajwa; maana yake ni, “Sitakuua kwa upanga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwenye mtu au hali muhimu; “Tazama” ni la heshima, wazi, na linaendeleza nguvu ya uashiriaji ya Kiebrania.
- source_word: עִמְּךָ
  choice: yuko pamoja nawe
  rationale: Kirai hiki kinaonyesha kwamba Shimei yumo katika eneo au mamlaka ya Sulemani; tafsiri hii ni ya kawaida na haiongezi maana isiyokuwapo.
- source_word: שִׁמְעִי בֶן גֵּרָא בֶן הַיְמִינִי
  choice: Shimei mwana wa Gera, Mbenyamini
  rationale: Majina yamenukuliwa kifonetiki, na jina la kikabila limetafsiriwa kwa namna ya kawaida ya Kiswahili bila kurudia kwa namna ngumu kirai “mwana wa”.
- source_word: מִבַּחֻרִים
  choice: kutoka Bahurimu
  rationale: Kiambishi מִן kinaonyesha mahali alikotoka; “kutoka” huwasilisha uhusiano huo wazi.
- source_word: קִלְלַנִי קְלָלָה נִמְרֶצֶת
  choice: alinilaani kwa laana kali sana
  rationale: Kurudia mzizi wa “kulaani/laana” kunahifadhi msisitizo wa muundo wa Kiebrania, na “kali sana” huonyesha uzito mkubwa wa laana bila kuidokeza kuwa vurugu ya kimwili.
- source_word: בְּיוֹם לֶכְתִּי מַחֲנָיִם
  choice: siku nilipokwenda Mahanaimu
  rationale: Hii ni sentensi ya wakati iliyo wazi na ya kawaida, inayohifadhi mwelekeo wa kwenda mahali hapo.
- source_word: יָרַד לִקְרָאתִי
  choice: alishuka kunilaki
  rationale: “Alishuka” huhifadhi kitenzi cha mwendo ירד, na “kunilaki” huwasilisha kusudi la kuja kukutana na msemaji.
- source_word: הַיַּרְדֵּן
  choice: Yordani
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la mto; neno “Mto” si lazima katika muktadha huu.
- source_word: וָאֶשָּׁבַע לוֹ בַיהוָה
  choice: nikamwapia kwa Yahweh
  rationale: Tafsiri hii inadumisha tendo la kutoa kiapo kwa Shimei na kutaja wazi jina la Mungu lililo katika matini.
- source_word: אִם אֲמִיתְךָ בֶּחָרֶב
  choice: Sitakuua kwa upanga
  rationale: Katika kiapo hiki אִם ni sehemu ya tamko lenye apodosi ya laana iliyoachwa; maana yake ya kimuktadha ni ahadi thabiti ya kutomwua. Kiswahili cha moja kwa moja kinaonyesha nguvu hiyo bila kutoa “ikiwa” inayoweza kupotosha.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania inatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kiapo kifupi אִם אֲמִיתְךָ בֶּחָרֶב
  choice: 'Kiapo hasi kilichowekwa wazi: “Sitakuua kwa upanga”'
  alternative: 'Tafsiri ya neno kwa neno: “Ikiwa nitakuua kwa upanga”'
  rationale: Muundo wa Kiebrania umeacha bila kutaja matokeo ya kujilaani ya kiapo. Katika muktadha huu unamaanisha kwamba Daudi aliapa kutomwua Shimei; tanbihi inahifadhi umbo halisi na mvutano wa kimatini.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. Majina ya mahali yametolewa kwa maumbo ya Kiswahili: Bahurimu, Mahanaimu, na Yordani. Alama ya tanbihi imewekwa baada ya kiapo ambacho tanbihi hiyo inafafanua.'
