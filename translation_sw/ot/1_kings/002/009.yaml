source:
  edition: WLC
  text: וְ/עַתָּה֙ אַל תְּנַקֵּ֔/הוּ כִּ֛י אִ֥ישׁ חָכָ֖ם אָ֑תָּה וְ/יָֽדַעְתָּ֙ אֵ֣ת אֲשֶׁ֣ר תַּֽעֲשֶׂה לּ֔/וֹ וְ/הוֹרַדְתָּ֧ אֶת שֵׂיבָת֛/וֹ בְּ/דָ֖ם שְׁאֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/009.yaml
  text: But now[a], do not hold him guiltless, for you are a wise man, and you will know what you should do to him; and you shall bring his gray head down to Sheol with blood.
translation:
  language: sw
  text: Lakini sasa usimwache bila adhabu, kwa maana wewe ni mtu mwenye hekima, nawe utajua utakachomtendea; nawe utazishusha mvi zake mpaka Sheoli[a] kwa damu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kaburi” au “makao ya wafu.”
    reason: Sheoli ina wigo wa maana unaoweza kurejelea kaburi au ulimwengu wa wafu; tanbihi huhifadhi njia hizo bila kulazimisha moja katika matini kuu.
lexical_decisions:
- source_word: תְּנַקֵּהוּ
  choice: usimwache bila adhabu
  rationale: Kitenzi נקה katika Pieli hapa kina maana ya kutomhesabu kuwa hana hatia au kutomwacha bila kuadhibiwa. Usemi huu unaonyesha nguvu ya kimahakama kwa Kiswahili cha kawaida bila kuifanya kuwa hukumu ya kuachiliwa mahakamani pekee.
- source_word: אִישׁ חָכָם
  choice: mtu mwenye hekima
  rationale: Hii ni njia ya kawaida na yenye heshima ya kumwelezea Sulemani kama mwanamume mwenye hekima; neno 'mtu' halibadili jinsia inayojulikana kutokana na muktadha.
- source_word: וְיָדַעְתָּ אֵת אֲשֶׁר תַּעֲשֶׂה לוֹ
  choice: nawe utajua utakachomtendea
  rationale: Inahifadhi mwelekeo wa wakati ujao wa kauli na imani ya Daudi katika busara ya Sulemani, bila kuongeza wazi wazo la wajibu ambalo halijasemwa moja kwa moja.
- source_word: וְהוֹרַדְתָּ
  choice: nawe utazishusha
  rationale: Hifili ya ירד ina maana ya kusababisha kushuka. Kauli ya wakati ujao inaendeleza agizo lenye nguvu kwa Sulemani.
- source_word: שֵׂיבָתוֹ
  choice: mvi zake
  rationale: Nomino hiyo kimsingi hurejelea mvi na kwa njia ya sitiari uzee. 'Mvi zake' huhifadhi picha ya Kiebrania bila kuingiza neno 'kichwa,' ambalo halimo wazi katika matini.
- source_word: בְּדָם
  choice: kwa damu
  rationale: Tafsiri hii huhifadhi usemi mkali na ulio finyu wa Kiebrania, unaodokeza kifo cha jeuri chenye umwagaji damu bila kufafanua zaidi ya matini.
- source_word: שְׁאוֹל
  choice: Sheoli
  rationale: Utohozi huu huhifadhi dhana ya Kiebrania na huepuka kuipunguza iwe kaburi la kimwili tu. Umbo 'Sheoli' ni la kawaida na linaweza kutumiwa kwa urahisi katika sentensi ya Kiswahili.
theological_decisions:
- issue: Maana ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; makao ya wafu
  rationale: Matini haielezi hapa kwa usahihi ikiwa inakusudia kaburi au ulimwengu wa wafu kwa maana pana. 'Sheoli' huhifadhi upana huo wa maana na mvutano wa kidhana.
- issue: Nguvu ya וְיָדַעְתָּ ... תַּעֲשֶׂה
  choice: utajua utakachomtendea
  alternative: unajua utakachomtendea; utajua unachopaswa kumtendea
  rationale: Uchaguzi huu huhifadhi kauli ya Daudi kuhusu utambuzi wa Sulemani bila kuifanya kuwa taarifa ya maarifa ya sasa wala kuongeza moja kwa moja dhana ya 'kupaswa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa Kiebrania na picha ya 'mvi' umehifadhiwa kadiri unavyobaki wazi kwa Kiswahili.
