base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/031.yaml
  text: Then the king said to him[a], “Do as he has said, and strike him down and bury him[b], and remove from me and from my father’s house the innocent blood that Joab shed.”
translation:
  language: sw
  text: Ndipo mfalme akamwambia, “Fanya kama alivyosema; muue[a] na umzike, na uiondoe kutoka juu yangu na kutoka juu ya nyumba ya baba yangu damu isiyo na hatia[b] ambayo Yoabu aliimwaga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mshambulie.” Nahau ya Kiebrania kwa maana halisi ni “mwangiie”; katika muktadha huu inamaanisha kumuua kwa kutekeleza hukumu.
    reason: lexical_alternative
  - marker: b
    text: “Damu isiyo na hatia” ni usemi wa Kiebrania wa kisheria na kimaadili unaomaanisha damu iliyomwagwa bila sababu ya haki, pamoja na hatia inayotokana na tendo hilo.
    reason: cultural_note
lexical_decisions:
- source_word: עֲשֵׂה כַּאֲשֶׁר דִּבֶּר
  choice: Fanya kama alivyosema
  rationale: Kauli hii ya amri inarejelea moja kwa moja maneno yaliyotangulia na inasikika kwa kawaida katika Kiswahili sanifu.
- source_word: וּפְגַע בּוֹ
  choice: muue
  rationale: Katika muktadha huu, kitenzi פגע pamoja na ב kinamaanisha kumshambulia mtu kwa kusudi la kumuua, yaani kutekeleza hukumu ya kifo. ‘Muue’ huwasilisha maana ya muktadha wazi bila kutumia nahau isiyo ya kawaida katika Kiswahili.
- source_word: וּקְבַרְתּוֹ
  choice: na umzike
  rationale: Huhifadhi amri inayofuata ya kumzika baada ya kuuawa.
- source_word: וַהֲסִירֹתָ
  choice: na hivyo uondoe
  rationale: Huonyesha mwendelezo wa amri pamoja na matokeo yaliyokusudiwa, bila kuifanya sentensi kuwa maelezo ya sababu yaliyo wazi kuliko Kiebrania.
- source_word: דְּמֵי חִנָּם
  choice: damu isiyo na hatia
  rationale: Huhifadhi taswira halisi ya Kiebrania na uzito wake wa kisheria na kimaadili kuhusu damu iliyomwagwa bila sababu ya haki.
- source_word: מֵעָלַי וּמֵעַל בֵּית אָבִי
  choice: juu yangu na juu ya nyumba ya baba yangu
  rationale: Huhifadhi sitiari ya hatia ya damu inayokaa juu ya mtu na ukoo wake, huku ‘nyumba’ ikidumisha maana ya kifalme na ya kizazi.
theological_decisions:
- issue: Hatia ya damu na uwajibikaji wa nyumba ya kifalme
  choice: Kudumisha usemi wa kuondoa damu isiyo na hatia ‘juu yangu na juu ya nyumba ya baba yangu.’
  alternative: Kusema moja kwa moja ‘kuondoa hatia ya damu kwangu na kwa familia ya baba yangu.’
  rationale: 'Tafsiri iliyochaguliwa inadumisha lugha halisi na mvutano wa kifungu: damu ya mauaji yasiyo ya haki inaelezwa kana kwamba iko juu ya mfalme na nyumba ya baba yake. Haibadili taswira hiyo kuwa mfumo wa kiteolojia uliofafanuliwa zaidi ya matini.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya heshima, ya moja kwa moja, na rahisi kueleweka. Muundo ‘nyumba ya baba yangu’ umehifadhiwa kwa sababu hapa ‘nyumba’ inaweza kumaanisha familia, ukoo, au nasaba ya kifalme.
