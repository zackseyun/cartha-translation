  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/גַ֣ם אַתָּ֣ה יָדַ֡עְתָּ אֵת֩ אֲשֶׁר עָ֨שָׂה לִ֜/י יוֹאָ֣ב בֶּן צְרוּיָ֗ה אֲשֶׁ֣ר עָשָׂ֣ה לִ/שְׁנֵֽי שָׂרֵ֣י צִבְא֣וֹת יִ֠שְׂרָאֵל לְ/אַבְנֵ֨ר בֶּן נֵ֜ר וְ/לַ/עֲמָשָׂ֤א בֶן יֶ֨תֶר֙ וַ/יַּ֣הַרְגֵ֔/ם וַ/יָּ֥שֶׂם דְּמֵֽי מִלְחָמָ֖ה בְּ/שָׁלֹ֑ם וַ/יִּתֵּ֞ן דְּמֵ֣י מִלְחָמָ֗ה בַּ/חֲגֹֽרָת/וֹ֙ אֲשֶׁ֣ר בְּ/מָתְנָ֔י/ו וּֽ/בְ/נַעֲל֖/וֹ אֲשֶׁ֥ר בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/005.yaml
  text: 'And you also know what Joab son of Zeruiah did to me[a], what he did to the two commanders of the armies of Israel, to Abner son of Ner and to Amasa son of Jether: he killed them and put the blood of war in peace[b], and put the blood of war on the belt that was around his waist and on the sandals that were on his feet.'
translation:
  language: sw
  text: Nawe pia unajua alichonitendea Yoabu mwana wa Seruya, na alichowatendea majemadari wawili wa majeshi ya Israeli, yaani Abneri mwana wa Neri na Amasa mwana wa Yetheri. Aliwaua na kumwaga damu ya vita wakati wa amani,[a] kisha akaiweka damu ya vita kwenye mkanda aliokuwa amefunga kiunoni na kwenye viatu alivyokuwa amevaa miguuni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “akaweka damu ya vita katika amani.” Maana yake ni kwamba Yoabu alifanya umwagaji damu wa vitani wakati wa amani.
    reason: lexical_alternative
  - marker: b
    text: Taswira ya damu kwenye mkanda na viatu vya Yoabu yaelekea kuonyesha kwamba hatia ya damu kutokana na mauaji hayo ilimwandama waziwazi.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אַתָּה
  choice: Nawe pia
  rationale: Huonyesha kiunganishi, msisitizo wa nyongeza, na kumwelekeza Sulemani moja kwa moja kwa Kiswahili cha kawaida.
- source_word: יָדַעְתָּ
  choice: unajua
  rationale: Hali ya sasa inaonyesha jambo ambalo tayari linajulikana na bado limo katika ufahamu wa Sulemani.
- source_word: אֵת אֲשֶׁר עָשָׂה לִי
  choice: alichonitendea
  rationale: Katika muktadha huu לִי inaonyesha tendo lililomdhuru Daudi; ‘alichonitendea’ ni ya asili na huhifadhi maana hiyo.
- source_word: לִשְׁנֵי שָׂרֵי צִבְאוֹת יִשְׂרָאֵל
  choice: majemadari wawili wa majeshi ya Israeli
  rationale: ‘Majemadari’ hueleza viongozi wa kijeshi, huku ‘majeshi’ ikihifadhi wingi wa צִבְאוֹת.
- source_word: וַיַּהַרְגֵם
  choice: Aliwaua
  rationale: Tafsiri ya moja kwa moja na ya wazi ya kitenzi pamoja na kiambishi chake cha yambwa.
- source_word: וַיָּשֶׂם דְּמֵי מִלְחָמָה בְּשָׁלֹם
  choice: na kumwaga damu ya vita wakati wa amani
  rationale: Huwasilisha kwa Kiswahili kinachoeleweka shtaka la kufanya umwagaji damu unaofaa vitani katika hali ya amani, huku tofauti kati ya vita na amani ikihifadhiwa.
- source_word: וַיִּתֵּן דְּמֵי מִלְחָמָה בַּחֲגֹרָתוֹ ... וּבְנַעֲלוֹ
  choice: kisha akaiweka damu ya vita kwenye mkanda ... na kwenye viatu
  rationale: Huhifadhi taswira halisi ya damu kwenye mavazi ya Yoabu. ‘Viatu’ ni Kiswahili cha kawaida na hutumika kwa maana ya jumla ingawa Kiebrania kina umbo la umoja.
theological_decisions:
- issue: Maana ya ‘damu ya vita wakati wa amani’
  choice: Kudumisha tofauti ya kimakusudi kati ya vita na amani bila kuongeza hukumu ya kidhehebu
  alternative: Kufafanua moja kwa moja kuwa yalikuwa mauaji ya hila au ya kihaini
  rationale: Muktadha unaonyesha mauaji yaliyofanywa katika mazingira ya amani, lakini mstari wenyewe unatumia taswira yenye mkazo badala ya istilahi ya kisheria; tafsiri haiipaswi kuamua zaidi ya maandishi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Yoabu, Seruya, Abneri, Neri, Amasa, na Yetheri. Sentensi ndefu ya Kiebrania imegawanywa kwa usomaji wazi bila kupoteza mfuatano wa shtaka.'
