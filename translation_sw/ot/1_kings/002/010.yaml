  text: Then David slept with his fathers and was buried in the city of David[a].
translation:
  language: sw
  text: Kisha Daudi akalala pamoja na baba zake[a], akazikwa katika Mji wa Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “akalala pamoja na baba zake”; hii ni nahau ya kawaida inayomaanisha kwamba alikufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Kitenzi שׁכב humaanisha kulala au kujilaza. Katika taarifa hii ya kifo cha mfalme ni nahau ya kufa; kutafsiri “akalala” kunahifadhi taswira na mtindo wa Kiebrania.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na mababu zake
  rationale: Katika muktadha huu אבות hurejelea waliomtangulia katika ukoo. “Mababu zake” ni Kiswahili cha sasa na cha heshima kinachoonyesha maana hiyo vizuri kuliko “baba zake,” ambayo ingeweza kueleweka kama baba wa moja kwa moja au wengi.
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: 'Umbo la Nifali hapa lina maana ya kutendwa: Daudi alizikwa. “Akazikwa” ni tafsiri ya kawaida na ya moja kwa moja.'
- source_word: בְּעִיר דָּוִד
  choice: katika Mji wa Daudi
  rationale: Hili ni jina maalumu la eneo la ngome ya Daudi huko Yerusalemu; “Mji wa Daudi” linahifadhi utambulisho huo wa mahali.
- source_word: וַ
  choice: Kisha / aka-
  rationale: Viunganishi vya waw vinaendeleza mfululizo wa simulizi. “Kisha” na kiambishi cha mfululizo “aka-” vinatoa mtiririko wa asili wa Kiswahili bila kupoteza ufuatano.
theological_decisions:
- issue: Nahau ya kifo “alilala pamoja na mababu zake”
  choice: Nahau ya Kiebrania imehifadhiwa katika andiko na kufafanuliwa katika tanbihi kuwa inamaanisha kufa.
  alternative: Daudi akafa na kuungana na mababu zake.
  rationale: Kuhifadhi “akalala” kunatunza taswira ya chanzo na mwendelezo wake wa kifasihi bila kuingiza dai la ziada kuhusu hali ya wafu; tanbihi huondoa uwezekano wa kuielewa kama usingizi wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “akazikwa” unaunganisha matukio kwa mtiririko wa kawaida, na “Mji wa Daudi” limetumiwa kama jina maalumu la mahali.
