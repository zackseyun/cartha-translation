base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/027.yaml
  text: So Solomon drove Abiathar out from being priest to Yahweh[b][a], fulfilling the word of Yahweh that he had spoken concerning the house of Eli in Shiloh.
translation:
  language: sw
  text: Basi Sulemani akamfukuza Abiathari asiwe tena kuhani wa Yahwe, hivyo akatimiza[a] neno la Yahwe ambalo Yahwe alikuwa amenena huko Shilo kuhusu nyumba ya Eli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili kutimiza neno la Yahwe.” Kiebrania kinaweza kuonyesha kusudi au matokeo.
    reason: alternative_reading
  - marker: b
    text: Tazama 1 Samweli 2:27–36; 3:11–14 kuhusu neno lililotamkwa dhidi ya nyumba ya Eli.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: akamwondoa
  rationale: Kitenzi גרשׁ kinaonyesha kufukuza au kuondoa kwa nguvu kutoka katika nafasi. Katika Kiswahili, “akamwondoa” kinaeleza wazi kuondolewa kwa Abiathari katika wadhifa wake bila kudokeza kwamba alifukuzwa katika nchi.
- source_word: מִהְיוֹת כֹּהֵן לַיהוָה
  choice: katika ukuhani wa Yahwe
  rationale: Muundo wenye מִן na kitenzi היה unaonyesha kuondolewa katika hali au wadhifa. “Katika ukuhani wa Yahwe” ni Kiswahili cha asili kinachohifadhi maana ya kutoruhusiwa tena kumtumikia Yahwe kama kuhani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe,” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: לְמַלֵּא
  choice: na hivyo kutimiza
  rationale: Kitenzi-jina chenye ל kinaweza kuonyesha kusudi au matokeo. “Na hivyo kutimiza” kinaeleza matokeo katika simulizi bila kudai kwa uhakika kwamba hilo ndilo lilikuwa kusudi la ndani la Sulemani; tanbihi inahifadhi uwezekano wa kusudi.
- source_word: דְּבַר יְהוָה
  choice: neno la Yahwe
  rationale: “Neno la Yahwe” ni usemi wa kawaida na sahihi kwa tamko la Mungu lililotolewa hapo awali.
- source_word: אֲשֶׁר דִּבֶּר
  choice: alilokuwa amesema
  rationale: Wakati uliopita unaonyesha kwamba tamko la Yahwe lilitangulia tendo la Sulemani.
- source_word: עַל בֵּית עֵלִי
  choice: kuhusu nyumba ya Eli
  rationale: עַל inaweza kumaanisha “kuhusu” au, katika hukumu, “dhidi ya.” “Kuhusu” huhifadhi upana wa kihusishi, huku muktadha na tanbihi ya rejeo vikionyesha kwamba lilikuwa tamko la hukumu.
- source_word: בְּשִׁלֹה
  choice: huko Shilo
  rationale: Kihusishi בְּ hapa kinaonyesha mahali ambako Yahwe alisema neno hilo; “huko Shilo” ni Kiswahili cha kawaida katika simulizi.
theological_decisions:
- issue: Uhusiano kati ya tendo la Sulemani na kutimia kwa neno la Mungu
  choice: Tendo hilo linaelezwa kama lililosababisha neno la Yahwe litimie.
  alternative: Sulemani alimwondoa Abiathari kusudi atimize neno la Yahwe.
  rationale: לְמַלֵּא inaweza kuonyesha matokeo au kusudi. Matini kuu inatumia “na hivyo kutimiza” ili kutoeleza nia ya Sulemani kupita ushahidi wa maandishi, na tanbihi [a] inahifadhi usomaji wa kusudi.
- issue: Maana ya “nyumba ya Eli”
  choice: Familia au ukoo wa Eli
  alternative: Jengo halisi la Eli
  rationale: Katika muktadha, בֵּית עֵלִי humaanisha familia au nasaba ya kikuhani ya Eli, si jengo lake; neno “nyumba” linahifadhi nahau ya kibiblia bila kuifafanua kupita kiasi katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Abiathari” na “Shilo” zimetumiwa kama maumbo ya majina yanayofaa katika Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
