  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֨ר מָלַ֤ךְ דָּוִד֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֔ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֹ֖שׁ שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/011.yaml
  text: The days that David reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: sw
  text: Muda ambao Daudi alitawala juu ya Israeli ulikuwa miaka arobaini. Huko Hebroni alitawala miaka saba, na huko Yerusalemu alitawala miaka thelathini na mitatu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים
  choice: Muda
  rationale: Ingawa Kiebrania husema kihalisi “na siku,” hapa ni nahau inayoonyesha jumla ya muda wa utawala. “Muda” ni Kiswahili cha kawaida na huunganika vizuri na “ulikuwa miaka arobaini.”
- source_word: אֲשֶׁר מָלַךְ דָּוִד
  choice: ambao Daudi alitawala
  rationale: “Alitawala” huakisi moja kwa moja kitenzi מָלַךְ katika muhtasari wa utawala wa kifalme; muundo wa uhusiano umehifadhiwa kwa Kiswahili cha asili.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Kirai hiki huonyesha watu waliokuwa chini ya mamlaka ya Daudi. “Kutawala juu ya Israeli” ni wazi na kinadumisha muundo wa chanzo.
- source_word: אַרְבָּעִים שָׁנָה
  choice: miaka arobaini
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa idadi hii ya miaka.
- source_word: בְּחֶבְרוֹן
  choice: Huko Hebroni
  rationale: Kiambishi בְּ kinaonyesha mahali. “Huko” hufaa kwa kurejelea mji, na “Hebroni” ni umbo lililozoeleka katika Kiswahili.
- source_word: מָלַךְ שֶׁבַע שָׁנִים
  choice: alitawala miaka saba
  rationale: Kurudia “alitawala” kunahifadhi urudiaji na msisitizo wa muundo wa Kiebrania.
- source_word: וּבִירוּשָׁלִַם
  choice: na huko Yerusalemu
  rationale: Kiunganishi “na” na kiashiria cha mahali vimehifadhiwa; “Yerusalemu” ni jina la kawaida la Kiswahili.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנִים
  choice: miaka thelathini na mitatu
  rationale: Huu ni mpangilio wa kawaida wa Kiswahili unaohifadhi idadi kamili ya Kiebrania.
