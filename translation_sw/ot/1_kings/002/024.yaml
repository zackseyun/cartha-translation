  text: וְ/עַתָּ֗ה חַי יְהוָה֙ אֲשֶׁ֣ר הֱכִינַ֗/נִי ו/יושיבי/ני עַל כִּסֵּא֙ דָּוִ֣ד אָבִ֔/י וַ/אֲשֶׁ֧ר עָֽשָׂה לִ֛/י בַּ֖יִת כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּ֣י הַ/יּ֔וֹם יוּמַ֖ת אֲדֹנִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/024.yaml
  text: And now[a], as Yahweh lives, who has established me and seated me on the throne of David my father, and who has made for me a house as he promised, surely Adonijah shall be put to death today.
translation:
  language: sw
  text: Na sasa, kama Yahwe aishivyo, yeye aliyenithibitisha na kuniketisha kwenye kiti cha enzi cha Daudi, baba yangu, na ambaye amenijengea nyumba[a] kama alivyoahidi, hakika Adonia atauawa leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amenianzishia nasaba ya kifalme.” Hapa “nyumba” huenda inamaanisha nasaba ya kifalme yenye kudumu, wala si jengo tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: kama aishivyo Yahwe
  rationale: Ni fomula ya kawaida ya kiapo katika Kiebrania. Tafsiri hii ni ya asili katika Kiswahili na inadumisha rejeleo la wazi kwa uhai wa Yahwe.
- source_word: הֱכִינַנִי
  choice: aliyeniweka imara
  rationale: Hifili ya כון ina maana ya kumweka mtu imara, kumthibitisha, au kumstahilisha katika nafasi yake. Hapa inahusu uthabiti wa utawala wa Sulemani.
- source_word: וַיּוֹשִׁיבֵנִי עַל כִּסֵּא
  choice: na kuniketi kwenye kiti cha enzi
  rationale: 'Muundo wa kisababishi wa ישׁב umehifadhiwa: Yahwe ndiye aliyemketisha Sulemani katika kiti cha enzi.'
- source_word: כִּסֵּא דָּוִד אָבִי
  choice: kiti cha enzi cha Daudi baba yangu
  rationale: Inafuata uhusiano wa maneno katika Kiebrania huku ikiwa wazi na ya kawaida katika Kiswahili.
- source_word: עָשָׂה לִי בַּיִת
  choice: amenifanyia nyumba
  rationale: Neno בַּיִת limehifadhiwa kama ‘nyumba’ ili kudumisha picha na uhusiano wake na ahadi ya kifalme, huku tanbihi ikieleza maana inayowezekana ya ukoo wa kifalme.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: kama alivyoahidi
  rationale: Ingawa maana ya msingi ni ‘kama alivyosema,’ katika muktadha huu kauli ya Mungu ni ahadi; ‘alivyoahidi’ huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: כִּי
  choice: hakika
  rationale: Hapa כִּי inasisitiza tamko lililo ndani ya kiapo, si kutoa sababu tu.
- source_word: יוּמַת
  choice: atauawa
  rationale: Hofali ya מות ni ya kutendwa na inaonyesha kusababishwa kwa kifo; ‘atauawa’ hudumisha maana hiyo bila kuifanya kuwa ‘atakufa’ tu.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonia
  rationale: Hili ndilo umbo la jina linalotambulika na la kawaida katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Maana ya ‘nyumba’ katika lugha ya agano la kifalme
  choice: Kudumisha ‘nyumba’ katika matini kuu na kueleza uwezekano wa maana ya ukoo wa kifalme katika tanbihi
  alternative: Kutafsiri moja kwa moja ‘ukoo wa kifalme’ au ‘nasaba’
  rationale: בַּיִת inaweza kumaanisha familia au nasaba ya kudumu katika muktadha wa kifalme. Hata hivyo, kudumisha ‘nyumba’ kunahifadhi utata halisi na miunganisho ya lugha ya ahadi ya Daudi bila kuamua kimya-kimya kuwa maana moja pekee ndiyo iliyokusudiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Fomula ya kiapo na lugha ya hukumu ya kifalme zimehifadhiwa bila kuongeza maelezo ya kimadhehebu.
