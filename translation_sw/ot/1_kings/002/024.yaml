  to: Na sasa, kama Yahwe aishivyo, yeye aliyenithibitisha na kuniketisha kwenye kiti cha enzi cha Daudi, baba yangu, na ambaye amenijengea nyumba[a] kama alivyoahidi, hakika Adonia atauawa leo.
