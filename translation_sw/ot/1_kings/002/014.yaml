lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha akasema
  rationale: Wayyiqtol ya אָמַר inaendeleza mfuatano wa matukio; “Kisha akasema” ni Kiswahili cha kawaida kinachoonyesha hatua inayofuata.
- source_word: דָּבָר
  choice: jambo
  rationale: Ingawa neno hili linaweza kumaanisha “neno,” “jambo,” au “kitu,” katika nahau hii linarejelea jambo ambalo msemaji anataka kumwambia mwenzake.
- source_word: לִי ... אֵלָיִךְ
  choice: Nina ... la kukuambia
  rationale: Muundo wa Kiebrania unaonyesha kuwa msemaji ana jambo linaloelekezwa kwa mwanamke anayezungumziwa; Kiswahili hiki cha kawaida kinawasilisha maana ya nahau bila kubadili kusudi lake.
- source_word: וַתֹּאמֶר
  choice: Naye akasema
  rationale: Wayyiqtol inaendeleza mazungumzo, na “Naye akasema” huonyesha kwa kawaida jibu la mhusika mwingine.
- source_word: דַּבֵּר
  choice: Sema
  rationale: Amri ya umoja ya דָּבַר ni mwaliko mfupi wa kuendelea kusema; “Sema” ni ya moja kwa moja na ya kawaida katika Kiswahili.
