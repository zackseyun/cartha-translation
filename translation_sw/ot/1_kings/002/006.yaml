  yaml_path: translation/ot/1_kings/002/006.yaml
  text: Act according to your wisdom[b][a], and do not let his gray head go down to Sheol in peace.
translation:
  language: sw
  text: Tenda kulingana na hekima yako, wala usimwache huyo mwenye mvi ashuke kwa amani mpaka Sheoli.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usimshushe huyo mwenye mvi kwa amani mpaka Sheoli.”
    reason: lexical_alternative
  - marker: b
    text: “Sheoli” ni neno la Kiebrania linalorejelea makao ya wafu; pia linaweza kutafsiriwa “kaburi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tenda
  rationale: Kitenzi עשה kina maana pana ya ‘kufanya.’ Katika agizo hili, ‘Tenda’ linaonyesha kwa ufupi kwamba Sulemani anapaswa kuchukua hatua.
- source_word: כְּחָכְמָתֶךָ
  choice: kulingana na hekima yako
  rationale: Kihusishi כ pamoja na ‘hekima yako’ kinaonyesha kutenda kwa kufuata utambuzi na uamuzi wa Sulemani.
- source_word: וְלֹא תוֹרֵד
  choice: wala usimwache ... ashuke
  rationale: Muundo wa Hiphil wa ירד ni wa kusababisha, yaani ‘kusababisha ashuke.’ Usemi huu wa Kiswahili ni wa kawaida na unabaki na wazo la kwamba Sulemani asiruhusu Joabu afe kwa amani bila kuhukumiwa.
- source_word: שֵׂיבָתוֹ
  choice: yeye mwenye mvi
  rationale: Nomino hiyo inaweza kumaanisha mvi au uzee. ‘Yeye mwenye mvi’ inadumisha taswira ya Kiebrania huku ikiepuka usemi usio wa kawaida wa kusema mvi zenyewe zinashuka.
- source_word: בְּשָׁלֹם
  choice: kwa amani
  rationale: שלום hapa inaonyesha kufa au kufikia mwisho bila madhara wala adhabu; ‘kwa amani’ inadumisha muundo na maana ya chanzo.
- source_word: שְׁאֹל
  choice: Sheoli
  rationale: Jina la Kiebrania limetoholewa kwa mfumo wa kawaida wa Kiswahili badala ya kufupishwa kuwa ‘kaburi,’ kwa kuwa linaweza kumaanisha makao ya wafu kwa upana zaidi.
theological_decisions:
- issue: Maana ya שְׁאֹל
  choice: Sheoli
  alternative: kaburini; katika makao ya wafu
  rationale: Kutumia ‘Sheoli’ kunahifadhi dhana ya Kiebrania bila kuilazimisha imaanishe kaburi la mwili pekee. Muktadha unaonyesha agizo kwamba Joabu asife kwa amani bila kupata hukumu.
- issue: Nguvu ya agizo kuhusu kifo cha Joabu
  choice: usimwache ... ashuke kwa amani
  alternative: usimshushe kwa amani
  rationale: Chaguo hili linahifadhi usemi wa kusababisha bila kuamua kwa undani namna ambayo Sulemani angetekeleza hukumu hiyo; hivyo haliongezi ufafanuzi wa kimadhehebu au wa mfasiri binafsi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘yeye mwenye mvi’ umechaguliwa ili kuhifadhi taswira ya uzee bila kufanya mvi kuwa mtendaji wa kitendo kisicho cha kawaida katika Kiswahili.
