  text: וַ/יְהִ֗י מִ/קֵּץ֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יִּבְרְח֤וּ שְׁנֵֽי עֲבָדִים֙ לְ/שִׁמְעִ֔י אֶל אָכִ֥ישׁ בֶּֽן מַעֲכָ֖ה מֶ֣לֶךְ גַּ֑ת וַ/יַּגִּ֤ידוּ לְ/שִׁמְעִי֙ לֵ/אמֹ֔ר הִנֵּ֥ה עֲבָדֶ֖י/ךָ בְּ/גַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/039.yaml
  text: At the end of three years[a], two servants of Shimei ran away to Achish son of Maacah, king of Gath. And they told Shimei, saying, “Look, your servants are in Gath.”
translation:
  language: sw
  text: Ilipofika mwisho wa miaka mitatu, watumwa wawili wa Shimei[a] wakatoroka, wakaenda kwa Akishi mwana wa Maaka, mfalme wa Gathi. Wakamwambia Shimei, “Tazama, watumwa wako wako Gathi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumishi.” Neno la Kiebrania linaweza kumaanisha watumishi au watumwa; katika muktadha huu, “watumwa” ni tafsiri inayofaa kwa watu waliomtoroka Shimei.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שָׁלֹשׁ שָׁנִים
  choice: Baada ya miaka mitatu
  rationale: Kirai hiki kinaonyesha kufika mwisho wa kipindi cha miaka mitatu. Katika Kiswahili cha kawaida, “baada ya miaka mitatu” huwasilisha maana hiyo kwa uwazi na ufasaha.
- source_word: וַיִּבְרְחוּ
  choice: walitoroka
  rationale: Kitenzi ברח humaanisha kukimbia au kutoroka. “Walitoroka” linaonyesha kwamba waliondoka kwa bwana wao bila ruhusa.
- source_word: עֲבָדִים / עֲבָדֶיךָ
  choice: watumwa / watumwa wako
  rationale: Ingawa עבד linaweza kumaanisha mtumishi au mtumwa, muktadha wa kutoroka kwao kutoka kwa Shimei unaonyesha hali ya utumwa au utegemezi wa lazima.
- source_word: אֶל אָכִישׁ
  choice: kwa Akishi
  rationale: Kihusishi kinaonyesha kuelekea kwa mtu; “kwa Akishi” ni Kiswahili cha asili katika muktadha huu.
- source_word: בֶּן מַעֲכָה
  choice: mwana wa Maaka
  rationale: Huu ni utambulisho wa kawaida wa mtu kwa jina la mzazi wake.
- source_word: מֶלֶךְ גַּת
  choice: mfalme wa Gathi
  rationale: Muundo huu unamtambulisha Akishi kwa cheo chake na eneo analotawala.
- source_word: וַיַּגִּידוּ לְשִׁמְעִי לֵאמֹר
  choice: Watu wakamwambia Shimei
  rationale: Kitenzi cha wingi kina mtendaji asiyeainishwa. “Watu wakamwambia” huhifadhi wingi huo bila kubuni utambulisho wao; kiingizio cha moja kwa moja cha maneno hufanya tafsiri tofauti ya לֵאמֹר isiwe lazima.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta usikivu kwa taarifa inayofuata. “Tazama” ni la heshima, linaeleweka, na huhifadhi msisitizo wake.
- source_word: בְּגַת
  choice: Gathi
  rationale: Katika Kiswahili, mahali panapotajwa baada ya kitenzi “wako” halihitaji kihusishi kingine; “wako Gathi” huonyesha mahali kwa kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina yametoholewa kama Shimei, Akishi, Maaka, na Gathi. Muundo wa simulizi umetolewa kwa ufasaha bila kuongeza kiashirio cha wakati kisichokuwapo katika chanzo.
