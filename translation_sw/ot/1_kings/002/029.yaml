revisions:
- from: Mfalme Sulemani akaambiwa kwamba Yoabu alikuwa amekimbilia katika hema la Yahweh[a]; na tazama, alikuwa kando ya madhabahu. Basi Sulemani akamtuma Benaya mwana wa Yehoyada, akisema, “Nenda ukampige na kumwangusha[b].”
  to: Mfalme Sulemani akaambiwa kwamba Yoabu alikuwa amekimbilia hema la Yahweh[a]; na tazama, alikuwa kando ya madhabahu. Basi Sulemani akamtuma Benaya mwana wa Yehoyada, akisema, “Nenda ukampige[b].”
  rationale: The revision restores the directional force of the Hebrew phrase for fleeing to the tent and removes the added result 'kumwangusha' from the final imperative. It also makes the lexical alternative in footnote a more precise and corrects the Swahili object form in the killing alternative in footnote b.
  reviewer_model: gpt-5.6-terra
