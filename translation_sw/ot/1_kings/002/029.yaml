id: 1KI.2.29
reference: 1 Kings 2:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֻּגַּ֞ד לַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה כִּ֣י נָ֤ס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וְ/הִנֵּ֖ה אֵ֣צֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁלַ֨ח שְׁלֹמֹ֜ה אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע לֵ/אמֹ֖ר לֵ֥ךְ פְּגַע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/029.yaml
  text: And it was reported to King Solomon that Joab had fled to the tent of Yahweh[a], and behold, he was beside the altar. So Solomon sent Benaiah son of Jehoiada, saying, “Go[b], strike him down.”
translation:
  language: sw
  text: Mfalme Sulemani akaambiwa kwamba Yoabu alikuwa amekimbilia hema la Yahweh[a]; na tazama, alikuwa kando ya madhabahu. Basi Sulemani akamtuma Benaya mwana wa Yehoyada, akisema, “Nenda ukampige[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tabernakulo ya Yahweh.” Kiebrania kinasema kihalisi “hema la Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Au “ukamshambulie” au “ukamwue.” Kitenzi cha Kiebrania kinaweza kumaanisha kumpiga au kumshambulia mtu; katika muktadha huu kina maana ya pigo la kuua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: akaambiwa
  rationale: Kauli tendwa ya נגד inaonyesha kwamba habari ilifikishwa kwa Sulemani; ‘akaambiwa’ ni ya kawaida katika masimulizi ya Kiswahili na huhifadhi mtazamo wa Kiebrania.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: Mfalme Sulemani
  rationale: Muundo huu wa cheo pamoja na jina ni wa kawaida na wazi katika Kiswahili.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaingiza yaliyomo katika taarifa.
- source_word: נָס
  choice: alikuwa amekimbilia
  rationale: Kitendo cha Yoabu kilitangulia kupelekwa kwa taarifa; umbo hili linaonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: אֶל אֹהֶל יְהוָה
  choice: katika hema la Yahweh
  rationale: אֹהֶל ni ‘hema’; ‘katika’ linaeleza kwa kawaida kukimbilia mahali pa hifadhi, na jina la agano יְהוָה limetoholewa kuwa ‘Yahweh’.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi chembe ya kisimulizi inayovuta uangalifu kwa hali iliyogunduliwa.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: alikuwa kando ya madhabahu
  rationale: אֵצֶל huonyesha ukaribu; ‘kando ya’ ni wazi na asilia.
- source_word: וַיִּשְׁלַח
  choice: Basi Sulemani akamtuma
  rationale: ‘Basi’ huonyesha hatua inayofuata kutokana na taarifa, huku ‘akamtuma’ ikidumisha mwendo wa simulizi.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya mwana wa Yehoyada
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa jina na nasaba.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huingiza maneno ya moja kwa moja kwa karibu na muundo wa Kiebrania.
- source_word: לֵךְ
  choice: Nenda
  rationale: Ni amri ya moja kwa moja na ya kawaida.
- source_word: פְּגַע בּוֹ
  choice: ukampige na kumwangusha
  rationale: פגע ב־ inaweza kumaanisha kumpiga au kumshambulia; katika muktadha huu ni pigo la kumuua. Kauli iliyochaguliwa huonyesha nguvu na matokeo yanayokusudiwa bila kutumia moja kwa moja ‘umuue’, ambalo linafafanua zaidi kuliko kitenzi chenyewe.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la pekee la agano, יְהוָה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya amri פְּגַע בּוֹ
  choice: ukampige na kumwangusha
  alternative: ukamuue; ukamshambulie
  rationale: Muktadha unaonyesha kwamba Sulemani anaagiza pigo la kuua, lakini kitenzi chenyewe kina wigo wa kupiga au kushambulia. Tafsiri inabeba uzito wa muktadha huku tanbihi ikihifadhi wigo huo wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Majina yametoholewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili. ‘Na tazama’ limehifadhiwa kwa sababu lina uzito wa kisimulizi katika chanzo.
