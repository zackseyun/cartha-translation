lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי דָוִד לָמוּת
  choice: Siku za Daudi zilipokaribia mwisho wake
  rationale: Kirai hiki cha Kiswahili kinahifadhi picha ya siku kukaribia huku kikieleza kwa njia ya kawaida kwamba wakati wa kifo cha Daudi ulikuwa karibu. ‘Mwisho wake’ ni lugha yenye heshima na ya asili katika muktadha wa kifo.
- source_word: וַיְצַו
  choice: alimwamuru
  rationale: Kitenzi צוה kina maana ya kuamuru au kutoa agizo lenye uzito; ‘alimwamuru’ kinaakisi nguvu hiyo katika Kiswahili cha sasa.
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: mwanawe Sulemani
  rationale: Hutambulisha kwa kawaida na kwa uwazi kwamba Sulemani ndiye mwana wa Daudi, ingawa mpangilio umegeuzwa kidogo ili sentensi iwe ya asili kwa Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni utangulizi rasmi wa maneno ya moja kwa moja yanayofuata na unadumisha kiunganishi cha Kiebrania bila kuongeza maelezo.
