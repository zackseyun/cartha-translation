  text: Why then have you not kept the oath of Yahweh and the command that I commanded you?[a][b]
translation:
  language: sw
  text: Basi, kwa nini hukushika kiapo cha Yahwe[a] na amri niliyokuamuru?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiapo ulichomwapia Yahwe”—yaani, kiapo kilichofanywa kwa jina la Yahwe au chini ya mamlaka yake.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, Kiebrania kinasema, “amri niliyoamuru juu yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדּוּעַ
  choice: Basi, kwa nini
  rationale: Kiunganishi וּ kinaunganisha swali hili na shtaka lililotangulia; “basi” huonyesha uhusiano huo kwa Kiswahili cha kawaida, huku מַדּוּעַ ikitafsiriwa “kwa nini.”
- source_word: לֹא שָׁמַרְתָּ
  choice: hukushika
  rationale: שׁמר hapa ni kutunza au kutimiza wajibu. “Kushika” hutumika kwa kawaida pamoja na kiapo na amri, na hudumisha maana ya kuwajibika.
- source_word: אֵת שְׁבֻעַת יְהוָה
  choice: kiapo cha Yahwe
  rationale: Muundo wa Kiebrania ni wa kimilikishi, lakini katika muktadha unamaanisha kiapo kilichofanywa mbele za Yahwe, kwa jina lake, au chini ya mamlaka yake; tanbihi inadumisha uwezekano huu bila kuuficha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kuwa “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: וְאֶת הַמִּצְוָה
  choice: na amri
  rationale: מִצְוָה ni agizo lenye mamlaka; “amri” ni neno la kawaida, lenye heshima, na linalofaa katika hotuba ya kifalme.
- source_word: אֲשֶׁר צִוִּיתִי עָלֶיךָ
  choice: niliyokuamuru
  rationale: צוה inatafsiriwa moja kwa moja kwa “kuamuru.” Kiswahili hiki ni cha kawaida na huwasilisha wajibu uliowekwa juu ya mtu, ingawa עָלֶיךָ kwa neno kwa neno ni “juu yako”; hilo limeelezwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kama jina huku ikiepuka kuingiza tofauti ya kimadhehebu.
- issue: Mhusika wa kiapo katika שְׁבֻעַת יְהוָה
  choice: kiapo cha Yahwe, pamoja na ufafanuzi katika tanbihi
  alternative: kiapo ulichomwapia Yahwe
  rationale: Muundo wenyewe unaweza kusomeka “kiapo cha Yahwe,” lakini muktadha unaonyesha kiapo kilichofanywa kwa jina lake au mbele zake, si lazima kiapo alichokula Yahwe mwenyewe. Tafsiri kuu inahifadhi muundo na tanbihi inazuia mkanganyiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Basi, kwa nini” huunganisha swali na shtaka lililotangulia; “hukushika” linafaa kwa kiapo na amri. Marudio ya “amri niliyokuamuru” yamedumishwa kwa sababu yanaakisi mzizi unaorudiwa katika Kiebrania na yanaeleweka kwa Kiswahili.
