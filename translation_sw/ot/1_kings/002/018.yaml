  text: וַ/תֹּ֥אמֶר בַּת שֶׁ֖בַע ט֑וֹב אָנֹכִ֕י אֲדַבֵּ֥ר עָלֶ֖י/ךָ אֶל הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/018.yaml
  text: Bathsheba said[a], “Good; I will speak to the king for you.”
translation:
  language: sw
  text: Bathsheba akasema, “Vema. Nitasema na mfalme kwa ajili yako.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuhusu wewe” au “kwa niaba yako.” Kifungu cha Kiebrania kinaweza kumaanisha kusema kuhusu mtu; katika muktadha huu huenda kinadokeza kumwombea Adonia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: akasema
  rationale: Ni wayyiqtol ya kawaida ya אָמַר inayoanzisha maneno ya moja kwa moja; ‘akasema’ ni simulizi ya kawaida na ya asili kwa Kiswahili.
- source_word: בַּת שֶׁבַע
  choice: Bathsheba
  rationale: Jina la mtu limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia badala ya kutafsiriwa maana yake halisi.
- source_word: טוֹב
  choice: Vema
  rationale: Hapa neno hili ni jibu fupi la kukubali. ‘Vema’ huhifadhi ufupi na heshima ya kauli ya Kiebrania.
- source_word: אָנֹכִי
  choice: ni-
  rationale: Kiwakilishi huru cha Kiebrania kinaweka wazi mhusika; katika Kiswahili mhusika huyo huonyeshwa kiasili kwa kiambishi cha nafsi ‘ni-’ katika ‘nitasema’.
- source_word: אֲדַבֵּר
  choice: nitasema
  rationale: Kitenzi hiki hapa humaanisha kusema au kuzungumza; ‘nitasema’ ni tafsiri ya moja kwa moja isiyoongeza wazo mahsusi la kuomba ambalo linadokezwa tu na muktadha.
- source_word: עָלֶיךָ
  choice: kwa ajili yako
  rationale: Kihusishi עַל pamoja na דבר kinaweza kumaanisha kusema kuhusu mtu, lakini katika muktadha huu wa kumwombea Adonia mbele ya mfalme kinaelekea kuwa na maana ya kusema kwa manufaa yake. Tanbihi huhifadhi uwezekano wa maana nyingine.
- source_word: אֶל הַמֶּלֶךְ
  choice: na mfalme
  rationale: Katika Kiswahili cha sasa, ‘kusema na mfalme’ ni namna ya asili ya kueleza kumwelekea mfalme kwa maneno, ingawa Kiebrania hutumia kihusishi chenye maana ya ‘kwa/kuelekea’.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. ‘Vema’ hudumisha jibu fupi la kukubali, na ‘kwa ajili yako’ huwasilisha maana inayowezekana zaidi huku tanbihi ikihifadhi utata wa Kiebrania.
