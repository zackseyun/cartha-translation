base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/022.yaml
  text: King Solomon answered and said to his mother[a], “Why are you asking for Abishag the Shunammite for Adonijah? Ask for the kingship for him as well, since he is my older brother—and for him, for Abiathar the priest, and for Joab son of Zeruiah!”
translation:
  language: sw
  text: Mfalme Sulemani akamjibu mama yake, akasema, “Kwa nini unamwombea Adoniya apewe Abishagi Mshunami? Mwombee pia ufalme[a], kwa kuwa yeye ni ndugu yangu mkubwa kuniliko—umwombee yeye, na Abiathari, kuhani, na Yoabu mwana wa Seruya!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mamlaka ya kifalme,” “utawala,” au “kiti cha ufalme.” Neno la Kiebrania linaweza kumaanisha utawala wa mfalme kwa upana; hapa linaonyesha kwamba Sulemani aliona ombi la Adoniya kuwa na maana ya kudai haki ya kutawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: akamjibu ... akasema
  rationale: Inahifadhi mfuatano wa vitenzi viwili vya Kiebrania huku ikitumia mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: אֶת אֲבִישַׁג הַשֻּׁנַמִּית
  choice: Abishagi Mshunami
  rationale: Inahifadhi jina na utambulisho wake wa kijiografia kwa mtindo mfupi unaotumika katika Kiswahili cha Biblia.
- source_word: וְשַׁאֲלִי לוֹ
  choice: Mwombee pia
  rationale: Kitenzi hiki kinamaanisha kumwomba mtu jambo kwa manufaa ya Adoniya; “pia” linaonyesha nguvu ya nyongeza katika jibu la kejeli la Sulemani.
- source_word: אֶת הַמְּלוּכָה
  choice: ufalme
  rationale: “Ufalme” linaweza kumaanisha mamlaka au haki ya kutawala, si eneo la nchi peke yake, na hivyo linadumisha upana wa neno la Kiebrania.
- source_word: כִּי הוּא אָחִי הַגָּדוֹל מִמֶּנִּי
  choice: kwa kuwa yeye ni ndugu yangu mkubwa
  rationale: Ni Kiswahili cha kawaida kinachohifadhi sababu iliyotolewa na msisitizo wa umri au mpangilio wa kuzaliwa.
- source_word: וְלוֹ וּלְאֶבְיָתָר הַכֹּהֵן וּלְיוֹאָב בֶּן צְרוּיָה
  choice: —naam, umwombee yeye, na Abiathari kuhani, na Yoabu mwana wa Seruya!
  rationale: Inahifadhi muundo wa mwisho ulio wa mkato na wenye msisitizo, huku kitenzi na jambo linaloombwa vikieleweka kutokana na sentensi iliyotangulia.
theological_decisions:
- issue: Maana ya kisiasa na kifalme ya ombi kuhusu Abishagi
  choice: Kauli ya Sulemani inaonyesha wazi kwamba ombi hilo linahusishwa na kudai ufalme.
  alternative: Kutafsiri ombi la Abishagi bila kuonyesha uhusiano wake na mamlaka ya kifalme.
  rationale: Andiko la Kiebrania lenyewe linaongeza amri ya kejeli ya kumwombea Adoniya “ufalme”; tafsiri haiongezi fundisho, bali inadumisha maana ya kisiasa iliyomo katika mstari.
- issue: Uhusiano wa Abiathari na Yoabu na ombi la ufalme
  choice: Kudumisha usemi wa mkato unaowaunganisha na Adoniya bila kufafanua zaidi nafasi yao.
  alternative: Kusema wazi kwamba wao ni washirika wake au kwamba ufalme ungekuwa wao pia.
  rationale: Kiebrania ni cha mkato katika sehemu hii; ufafanuzi kamili ungeondoa utata halisi na kuongeza habari isiyosemwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kejeli na ghadhabu ya Sulemani umehifadhiwa kwa swali la balagha, neno “naam,” na kifungu cha mwisho cha mkato.
