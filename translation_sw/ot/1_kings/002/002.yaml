lexical_decisions:
- source_word: אָנֹכִי
  choice: Mimi
  rationale: Kiwakilishi huru cha nafsi ya kwanza kimetafsiriwa wazi; hapa kinafaa katika kauli nzito ya Daudi kuhusu kifo chake kinachokaribia.
- source_word: הֹלֵךְ
  choice: ninaenda
  rationale: Kitenzi kishirikishi cha Qal pamoja na kiwakilishi huonyesha mwendo unaoendelea au unaokaribia; “ninaenda” huhifadhi sitiari bila kuifafanua moja kwa moja kuwa kufa.
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: katika njia ya dunia yote
  rationale: Huhifadhi taswira ya Kiebrania kuhusu hatima ya kawaida ya wote walio duniani, yaani kifo, bila kuondoa sitiari iliyoko katika chanzo.
- source_word: וְחָזַקְתָּ
  choice: Basi uwe hodari
  rationale: Ingawa umbo ni timilifu lenye kiunganishi, katika muktadha lina nguvu ya himizo; “basi” huonyesha vizuri uhusiano na taarifa iliyotangulia.
- source_word: וְהָיִיתָ לְאִישׁ
  choice: na uwe mwanamume
  rationale: Tafsiri hii huhifadhi nomino ya kiume inayomlenga Solomoni na maana pana ya kuonyesha ujasiri na kuwajibika, bila kuibadili kuwa usemi usio na jinsia.
theological_decisions:
- issue: Usemi wa kijinsia katika himizo
  choice: uwe mwanamume
  alternative: ujionyeshe kuwa mwanamume; uwe kiume
  rationale: Kiebrania kinatumia nomino ya kiume na kinamwelekea Solomoni mahsusi. Tafsiri kuu huhifadhi umbo hilo na mvuto wa himizo la baba kwa mwana, huku tanbihi ikieleza maana zinazoweza kudokezwa bila kuingiza dhana za kisasa kuhusu uanaume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya kifo imehifadhiwa, na usemi wa kiume umeachwa wazi kwa sababu unamwelekea Solomoni mahsusi.
