base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/038.yaml
  text: Shimei said to the king[a], “The word is good. Just as my lord the king has spoken, so your servant will do.” And Shimei lived in Jerusalem many days.
translation:
  language: sw
  text: Shimei akamwambia mfalme, “Neno hilo ni jema.[a] Kama bwana wangu mfalme alivyosema, ndivyo mtumishi wako atakavyofanya.” Basi Shimei akaishi Yerusalemu kwa siku nyingi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Jambo hilo ni jema,” au “Uliyosema ni jema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב הַדָּבָר
  choice: Neno hilo ni jema
  rationale: דָּבָר inaweza kumaanisha ‘neno,’ ‘jambo,’ au ‘kauli.’ Katika muktadha huu Shimei anakubali agizo la mfalme; ‘neno hilo ni jema’ huhifadhi usemi wa Kiebrania na kueleweka kwa Kiswahili.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Ni usemi wa heshima wa kumwita mfalme; ‘bwana wangu mfalme’ huhifadhi heshima hiyo kwa lugha ya kifalme bila kusisitiza kupita kiasi hali ya utumwa.
- source_word: כֵּן יַעֲשֶׂה עַבְדֶּךָ
  choice: ndivyo mtumishi wako atakavyofanya
  rationale: עַבְדֶּךָ hapa ni namna ya unyenyekevu ya mtu kujitaja mbele ya mfalme, hivyo ‘mtumishi wako’ inafaa kuliko ‘mtumwa wako.’ Kitenzi kimetafsiriwa kwa wakati ujao kwa kuwa Shimei anaahidi kutii.
- source_word: וַיֵּשֶׁב
  choice: akaishi
  rationale: יָשַׁב katika muktadha wa makazi humaanisha kuishi au kukaa mahali; ‘akaishi’ ni ya kawaida na inaonyesha makazi yake chini ya sharti la mfalme.
- source_word: יָמִים רַבִּים
  choice: kwa siku nyingi
  rationale: Huhifadhi nahau halisi ya Kiebrania, ikionyesha kipindi kirefu bila kutaja muda kamili.
- source_word: שִׁמְעִי
  choice: Shimei
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בִּירוּשָׁלִַם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la jina la mahali lililozoeleka katika Kiswahili.
