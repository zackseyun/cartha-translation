  yaml_path: translation/ot/1_kings/002/013.yaml
  text: Then Adonijah son of Haggith came to Bathsheba[a], the mother of Solomon, and she said, “Do you come in peace?” And he said, “In peace.”
translation:
  language: sw
  text: Kisha Adoniya mwana wa Hagithi akaja kwa Bathsheba, mama yake Sulemani. Bathsheba akamuuliza, “Je, umekuja kwa amani?”[a] Naye akajibu, “Kwa amani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri halisi zaidi, “Je, kuja kwako ni kwa amani?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Kitenzi בוא kinaweza kumaanisha ‘kuja’ au ‘kwenda’ kutegemea mtazamo. ‘Akaja’ kinafaa hapa kwa kuwa simulizi linaelekeza tukio kwa Bathsheba.
- source_word: אֲדֹנִיָּהוּ
  choice: Adoniya
  rationale: Jina limetoholewa kwa tahajia ya kawaida na inayosomeka kwa Kiswahili.
- source_word: בֶן חַגִּית
  choice: mwana wa Hagithi
  rationale: Huu ni muundo wa kawaida wa Kiebrania unaomtambulisha Adoniya kwa kutaja mama yake; ‘mwana wa’ unauwasilisha wazi.
- source_word: בַּת שֶׁבַע
  choice: Bathsheba
  rationale: Jina la mtu limetoholewa kwa namna inayohifadhi utambulisho wake na inayosomeka kwa Kiswahili.
- source_word: אֵם שְׁלֹמֹה
  choice: mama yake Sulemani
  rationale: Kirai hiki kinamtambulisha Bathsheba kwa uhusiano wake na Sulemani. Muundo huu ni wa asili katika Kiswahili na unahifadhi msisitizo wa simulizi.
- source_word: הֲשָׁלוֹם בֹּאֶךָ
  choice: Je, umekuja kwa amani?
  rationale: שָׁלוֹם hapa inauliza kuhusu nia ya amani, si salamu ya kawaida tu. Tafsiri hii ni ya asili katika mazungumzo ya Kiswahili huku ikihifadhi tahadhari iliyomo katika swali.
- source_word: שָׁלוֹם
  choice: Kwa amani
  rationale: Jibu la Adoniya ni fupi na linairudia lugha ya swali. ‘Kwa amani’ linahifadhi ufupi huo na kusikika kwa kawaida katika Kiswahili.
