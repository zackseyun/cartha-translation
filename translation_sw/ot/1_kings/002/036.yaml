base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/036.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Build yourself a house in Jerusalem and live there, and do not go out from there anywhere.”
translation:
  language: sw
  text: Kisha mfalme akatuma kumwita Shimei, akamwambia, “Jijengee nyumba katika Yerusalemu, ukae humo, wala usitoke humo kwenda popote.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, nahau hii ni “huku au kule,” yaani, “popote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ וַיִּקְרָא לְשִׁמְעִי
  choice: mfalme akatuma watu wamwite Shimei
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba mfalme alituma wajumbe ili Shimei aitwe, huku ukihifadhi vitendo viwili vya Kiebrania, ‘kutuma’ na ‘kuita.’
- source_word: בְּנֵה לְךָ בַיִת
  choice: Jijengee nyumba
  rationale: Kitenzi cha kujirejelea ‘jijengee’ kinaonyesha kwamba nyumba hiyo ilikuwa kwa ajili yake mwenyewe, na ‘nyumba’ hudumisha maana ya makao halisi.
- source_word: בִּירוּשָׁלִַם
  choice: Yerusalemu
  rationale: Jina la mahali limetumiwa kwa umbo lake la kawaida katika Kiswahili; hapa kiambishi cha mahali kinaeleweka bila kuongeza ‘katika.’
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: ukae humo
  rationale: ‘Kukaa’ ni neno la kawaida lenye maana ya kuishi au kubaki mahali; ‘humo’ hurejelea Yerusalemu kama eneo alilopaswa kuishi.
- source_word: וְלֹא תֵצֵא מִשָּׁם
  choice: wala usitoke humo
  rationale: ‘Usitoke’ huakisi moja kwa moja katazo la kutoka katika eneo hilo, na ‘wala’ huunganisha katazo hilo kwa mtiririko wa asili.
- source_word: אָנֶה וָאָנָה
  choice: kwenda popote
  rationale: Nahau ya Kiebrania ina maana ya ‘huku au kule,’ yaani kwenda mahali popote; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
