base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/016.yaml
  text: And now I am asking one request of you; do not turn away my face. And she said to him[a], “Speak.”
translation:
  language: sw
  text: Na sasa nina ombi moja ninalokuomba; usinikatalie[a]. Naye akamwambia, “Sema.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “usiurudishe uso wangu”; ni nahau yenye maana ya “usinikatae” au “usilikatae ombi langu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi cha simulizi pamoja na alama ya wakati inayoanzisha hatua inayofuata katika mazungumzo.
- source_word: שְׁאֵלָה אַחַת
  choice: ombi moja
  rationale: שְׁאֵלָה humaanisha ombi au dua; “ombi moja” ni Kiswahili cha kawaida na huhifadhi idadi iliyotajwa.
- source_word: אָנֹכִי שֹׁאֵל מֵאִתָּךְ
  choice: nina ... kwako
  rationale: Muundo huu huwasilisha ombi la sasa linaloelekezwa kwa mhusika wa pili; umeunganishwa na “ombi moja” ili kuepuka marudio yasiyo ya kawaida katika Kiswahili.
- source_word: אַל תָּשִׁיבִי אֶת פָּנָי
  choice: usinikatalie
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kutomkataa mwombaji au ombi lake. Tafsiri ya maana ni ya kawaida na wazi katika Kiswahili, huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Naye akamwambia
  rationale: Hufuatisha mtiririko wa simulizi wa Kiebrania bila kuongeza jina ambalo halimo katika mstari.
- source_word: דַּבֵּר
  choice: Sema
  rationale: Amri fupi inayomruhusu ataje ombi lake; “Sema” ni ya moja kwa moja na ya kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Nahau isiyoeleweka kwa urahisi imetafsiriwa kwa maana yake, huku umbo lake la Kiebrania likielezwa katika tanbihi.
