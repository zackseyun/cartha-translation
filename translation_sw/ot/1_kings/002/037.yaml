base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/037.yaml
  text: For on the day you go out and cross the Kidron Valley[a], know for certain that you shall surely die[b]; your blood shall be on your own head.
translation:
  language: sw
  text: Kwa maana siku utakapotoka na kuvuka Bonde la Kidroni[a], ujue kwa hakika kwamba hakika utakufa; damu yako itakuwa juu ya kichwa chako mwenyewe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuvuka kijito cha Kidroni.” Neno la Kiebrania נחל linaweza kumaanisha bonde, korongo lenye mkondo wa maji, au kijito cha msimu.
    reason: lexical_alternative
  - marker: b
    text: Usemi wa Kiebrania “damu yako itakuwa juu ya kichwa chako” unamaanisha kwamba wewe mwenyewe utawajibika kwa kifo chako.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: Kwa maana siku
  rationale: Katika muktadha huu kifungu kinaendeleza onyo kwa kutaja wakati ambapo sharti litavunjwa. “Siku” huhifadhi uzito wa kisheria wa usemi wa Kiebrania, huku “Kwa maana” ikiunganisha sababu ya onyo kwa Kiswahili cha kawaida.
- source_word: צֵאתְךָ
  choice: utakapotoka
  rationale: Muundo huu unaonyesha tendo la baadaye la Shimei kuondoka katika eneo aliloamriwa kubaki; “utakapotoka” huunganisha kwa kawaida maana ya wakati na tendo hilo.
- source_word: וְעָבַרְתָּ אֶת נַחַל קִדְרוֹן
  choice: na kuvuka Bonde la Kidroni
  rationale: עבר ina maana ya kuvuka, na נחל inaweza kumaanisha bonde, korongo, au mkondo wa maji wa msimu. “Bonde la Kidroni” ni jina la kijiografia linaloeleweka, huku tanbihi ikihifadhi uwezekano wa maana nyingine.
- source_word: יָדֹעַ תֵּדַע
  choice: ujue kwa hakika
  rationale: Kitenzi-jina kisicho na kikomo pamoja na kitenzi kilichokamilika huongeza mkazo. “Ujue kwa hakika” huwasilisha amri na uhakika huo kwa Kiswahili cha sasa.
- source_word: כִּי מוֹת תָּמוּת
  choice: kwamba hakika utakufa
  rationale: Muundo wa Kiebrania unasisitiza uhakika wa kifo. “Hakika utakufa” huhifadhi mkazo na uzito wa hukumu bila tafsiri ya neno kwa neno isiyo ya kawaida katika Kiswahili.
- source_word: דָּמְךָ יִהְיֶה בְרֹאשֶׁךָ
  choice: damu yako itakuwa juu ya kichwa chako mwenyewe
  rationale: Tafsiri hii huhifadhi taswira ya nahau ya Kiebrania na kuonyesha wazi kwamba mhusika mwenyewe atawajibika kwa kifo chake.
theological_decisions:
- issue: Nahau ya hukumu ya kifo na wajibu binafsi
  choice: Kuhifadhi usemi “damu yako itakuwa juu ya kichwa chako mwenyewe” katika matini kuu.
  alternative: “Utawajibika mwenyewe kwa kifo chako.”
  rationale: Usemi wa picha wa Kiebrania una nguvu ya kisheria na kimaadili. Kuuhifadhi huepuka kufafanua kupita kiasi, na tanbihi hutoa maana yake kwa msomaji wa sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye uzito wa onyo la kifalme na kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. Jina “Kidroni” limetumiwa kwa umbo lililozoeleka katika Kiswahili cha Biblia; nahau ya damu imehifadhiwa na kufafanuliwa katika tanbihi.
