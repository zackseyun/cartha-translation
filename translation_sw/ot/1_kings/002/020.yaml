base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/020.yaml
  text: She said, “I am asking one small request of you; do not turn away my face.” And the king said to her, “Ask, my mother, for I will not turn away your face.”
translation:
  language: sw
  text: Akasema, “Nina ombi moja dogo ninalokuomba; usinikatalie.”[a] Mfalme akamwambia, “Omba, mama yangu, kwa maana sitakukatalia.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “usiurudishe uso wangu,” yaani, usinikatae mimi au ombi langu.
    reason: Kuhifadhi taswira ya nahau ya Kiebrania huku maandishi makuu yakibaki ya kawaida na wazi katika Kiswahili.
  - marker: b
    text: Kwa neno halisi, “sitaurudisha uso wako.”
    reason: Kuonyesha kwamba jibu la mfalme linarudia nahau ileile iliyotumiwa na mama yake.
lexical_decisions:
- source_word: שְׁאֵלָה אַחַת קְטַנָּה
  choice: ombi moja dogo
  rationale: Huhifadhi maana na msisitizo wa Kiebrania kwa mpangilio wa kawaida wa Kiswahili.
- source_word: אָנֹכִי שֹׁאֶלֶת מֵאִתָּךְ
  choice: ninalokuomba
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba ombi linaelekezwa kwa mfalme bila kurudia maneno kwa namna nzito.
- source_word: אַל תָּשֶׁב אֶת פָּנָי / לֹא אָשִׁיב אֶת פָּנָיִךְ
  choice: usinikatalie / sitakukatalia
  rationale: Nahau ya Kiebrania inamaanisha kukataa mtu au ombi lake. Tafsiri hii ni ya asili katika Kiswahili na inadumisha urudiaji wa kauli katika majibu ya mfalme; taswira halisi imehifadhiwa katika tanbihi.
- source_word: אִמִּי
  choice: mama yangu
  rationale: Huhifadhi namna ya moja kwa moja na yenye heshima ambayo mfalme anamwita mama yake.
