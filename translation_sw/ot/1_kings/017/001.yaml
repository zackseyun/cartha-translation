  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ הַ/תִּשְׁבִּ֜י מִ/תֹּשָׁבֵ֣י גִלְעָד֮ אֶל אַחְאָב֒ חַי יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו אִם יִהְיֶ֛ה הַ/שָּׁנִ֥ים הָ/אֵ֖לֶּה טַ֣ל וּ/מָטָ֑ר כִּ֖י אִם לְ/פִ֥י דְבָרִֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/001.yaml
  text: And Elijah the Tishbite[a], from the inhabitants of Gilead, said to Ahab, “As Yahweh, the God of Israel, lives, before whom I stand, there will be neither dew nor rain in these years[c][b], except by my word.”
translation:
  language: sw
  text: Basi Eliya Mtishbi[a], kutoka miongoni mwa wakazi wa Gileadi, akamwambia Ahabu, “Kama Yahwe, Mungu wa Israeli, aishivyo, ambaye ninasimama mbele zake, katika miaka hii hakutakuwa na umande wala mvua[b], isipokuwa kwa neno langu.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Eliya wa Tishbe”; utambulisho wa Kiebrania unaweza kuonyesha asili yake, huku kishazi kinachofuata kikimtaja kuwa kutoka miongoni mwa wakazi au walowezi wa Gileadi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia namna ya kiapo inayosema kihalisi, “ikiwa kutakuwa na …,” lakini maana yake hapa ni, “hakutakuwa na ….”
    reason: cultural_note
  - marker: c
    text: Au, “kulingana na neno langu” au “kwa tamko langu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּשְׁבִּי
  choice: Mtishbi
  rationale: Ni jina la utambulisho linalomhusisha Eliya na Tishbe; umbo la Kiswahili lenye kiambishi M- ni fupi na linafuata namna ya kawaida ya kutaja mtu wa mahali fulani.
- source_word: מִתֹּשָׁבֵי גִלְעָד
  choice: mmoja wa wakazi wa Gileadi
  rationale: תּוֹשָׁבֵי inaweza kumaanisha wakazi au walowezi. ‘Mmoja wa wakazi’ ni ya asili katika Kiswahili na haiamui kwamba alikuwa mzaliwa wa huko.
- source_word: חַי יְהוָה
  choice: Kama aishivyo Yahwe
  rationale: Hii ni kauli ya kiapo. Tafsiri hii huwasilisha nguvu yake kwa Kiswahili cha kawaida huku ikihifadhi kitenzi ‘kuishi’.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya moja kwa moja ya kishazi tegemezi cha Kiebrania na huhifadhi maana yake ya agano.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: ambaye ninasimama mbele zake
  rationale: Huhifadhi taswira halisi ya kusimama mbele za Mungu, ambayo pia inaweza kudokeza kumhudumia, bila kuifanya maana hiyo ya pili kuwa tafsiri pekee.
- source_word: אִם יִהְיֶה
  choice: hakutakuwa
  rationale: Katika kiapo hiki אִם huleta ukanushaji wenye nguvu; Kiswahili huhitaji ukanushaji huo kusemwa wazi.
- source_word: טַל וּמָטָר
  choice: umande wala mvua
  rationale: ‘Wala’ huunganisha kwa kawaida vitu viwili vilivyokanushwa na huhifadhi tofauti kati ya umande na mvua.
- source_word: הַשָּׁנִים הָאֵלֶּה
  choice: katika miaka hii
  rationale: Ni usemi wa wakati ulio wazi na wa asili unaodokeza kipindi cha ukame.
- source_word: כִּי אִם
  choice: isipokuwa
  rationale: Kishazi hiki kinaweka jambo la pekee ambalo chini yake umande au mvua inaweza kutokea.
- source_word: לְפִי דְבָרִי
  choice: kwa neno langu
  rationale: Ni tafsiri fupi na ya asili inayohifadhi mamlaka ya neno la kinabii bila kudai kwamba Eliya anatenda kwa uwezo unaojitegemea.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya kusimama mbele za Yahwe
  choice: ambaye ninasimama mbele zake
  alternative: ninayemtumikia
  rationale: Tafsiri iliyochaguliwa huhifadhi taswira na uwezekano wa maana mbili—kuwapo mbele zake na kumhudumia—badala ya kuamua kimya kimya kwamba inamaanisha huduma pekee.
- issue: Mamlaka ya kinabii katika לְפִי דְבָרִי
  choice: isipokuwa kwa neno langu
  alternative: isipokuwa kulingana na neno langu; isipokuwa kwa amri yangu
  rationale: Huhifadhi nguvu ya kauli ya Eliya kama nabii bila kupanua mstari kuwa fundisho kwamba ana mamlaka iliyo huru na Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Basi … akamwambia’ hudumisha mwendelezo wa simulizi; majina Ahabu, Israeli na Gileadi yanafuata maumbo yaliyozoeleka katika Biblia za Kiswahili. Lugha imehifadhi uzito wa kiapo na taswira ya Kiebrania bila kuwa ngumu kupita kiasi.
