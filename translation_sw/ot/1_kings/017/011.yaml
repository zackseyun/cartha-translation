  text: As she went to get it[a], he called to her and said[b], “Please bring me a piece of bread in your hand.”
translation:
  language: sw
  text: Alipokuwa akienda kuyachukua, Eliya akamwita[a] na kusema, “Tafadhali, niletee kipande cha mkate mkononi mwako[b].”
  philosophy: optimal-equivalence
