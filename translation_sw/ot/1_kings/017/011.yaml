lexical_decisions:
- source_word: וַתֵּלֶךְ לָקַחַת
  choice: Alipokuwa akienda kuyachukua
  rationale: Muundo huu unaonyesha kwamba alikuwa katika hatua ya kwenda kuyachukua maji yaliyotajwa katika mstari uliotangulia, ndipo Eliya alipomwita. Kiwakilishi “ya-” kinarejelea “maji” kwa kawaida ya Kiswahili.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: akamwita
  rationale: קרא pamoja na אֶל humaanisha kumwita mtu. “Akamwita” ni lugha ya kawaida na inaendeleza mtiririko wa simulizi bila kuongeza wazo lisilo wazi katika Kiebrania.
- source_word: לִקְחִי נָא לִי
  choice: Tafadhali, niletee
  rationale: נָא hulainisha amri na kwa kawaida inalingana na “tafadhali.” Katika muktadha huu לקח ina maana ya kuchukua kitu na kukileta kwa msemaji, hivyo “niletee” ni ya asili kuliko tafsiri kavu ya “nichukulie.”
- source_word: פַּת לֶחֶם
  choice: kipande cha mkate
  rationale: Kirai hiki humaanisha kipande au kiasi kidogo cha mkate. “Kipande cha mkate” ni wazi, cha kawaida, na hakiongezi maelezo yasiyokuwapo katika matini.
- source_word: בְּיָדֵךְ
  choice: mkononi mwako
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania, yaani kubeba mkate mkononi, nayo inaeleweka katika Kiswahili.
