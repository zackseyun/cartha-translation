base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/010.yaml
  text: So he arose and went to Zarephath. When he came to the entrance of the city[a], behold, a widow was there gathering sticks. He called to her and said, “Please bring me a little water in a vessel, so that I may drink.”
translation:
  language: sw
  text: Basi akainuka, akaenda Sarepta. Alipofika kwenye ingilio la mji[a], tazama, palikuwa na mjane akikusanya kuni. Akamwita na kusema, “Tafadhali niletee maji kidogo katika chombo, ili ninywe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “lango la mji.” Neno la Kiebrania hapa linamaanisha “ingilio” au “mahali palipo wazi pa kuingilia,” nalo ni pana kuliko neno maalumu zaidi linalomaanisha “lango.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: akainuka, akaenda
  rationale: 'Muundo huu unahifadhi mfululizo wa vitenzi vya simulizi: kwanza alijiinua ili kutenda, kisha akaenda.'
- source_word: צָרְפַתָה
  choice: Sarepta
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kwenda mahali hapo; jina la mahali limetolewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: פֶּתַח הָעִיר
  choice: ingilio la mji
  rationale: פֶּתַח humaanisha nafasi au mahali pa kuingilia na si lazima lango maalumu; “ingilio” linahifadhi upana huo wa maana.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili huvuta uangalifu wa msomaji kwa tukio linalojitokeza na kudumisha uhai wa simulizi.
- source_word: אִשָּׁה אַלְמָנָה
  choice: mjane
  rationale: Hii ndiyo njia ya kawaida na ya asili ya kutaja mwanamke ambaye mume wake amekufa.
- source_word: מְקֹשֶׁשֶׁת עֵצִים
  choice: akikusanya kuni
  rationale: Kitenzi kinaonyesha kukusanya vipande vidogo vya miti kwa matumizi ya moto; “kuni” linafaa katika muktadha bila kudokeza magogo makubwa.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: akamwita
  rationale: קרא pamoja na אֶל humaanisha kumwita mtu au kumwita kwa sauti; “akamwita” ni ya kawaida na wazi katika Kiswahili.
- source_word: קְחִי נָא
  choice: Tafadhali niletee
  rationale: Ingawa לקח kimsingi ni “chukua,” katika ombi la kupata kitu kwa ajili ya msemaji, “niletee” ni Kiswahili cha asili; נָא imewakilishwa na “tafadhali.”
- source_word: מְעַט מַיִם
  choice: maji kidogo
  rationale: Huwakilisha moja kwa moja kiasi kidogo cha maji kwa mtindo wa kawaida wa Kiswahili.
- source_word: בַּכְּלִי
  choice: katika chombo
  rationale: כְּלִי ni neno pana kwa chombo au kifaa; “chombo” huepuka kukisia kwamba kilikuwa mtungi au aina nyingine maalumu.
- source_word: וְאֶשְׁתֶּה
  choice: ili ninywe
  rationale: Umbo la kitenzi linaonyesha kusudi au matokeo yanayotamaniwa; “ili ninywe” ni fupi, wazi, na la asili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa urahisi. “Tazama” limedumishwa ili kuhifadhi msisitizo wa kisahili wa וְהִנֵּה, na “chombo” limetumiwa bila kulibana kuwa mtungi.
