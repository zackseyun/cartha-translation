  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָלָ֕ה בֶּן הָ/אִשָּׁ֖ה בַּעֲלַ֣ת הַ/בָּ֑יִת וַ/יְהִ֤י חָלְי/וֹ֙ חָזָ֣ק מְאֹ֔ד עַ֛ד אֲשֶׁ֥ר לֹא נֽוֹתְרָה בּ֖/וֹ נְשָׁמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/017.yaml
  text: After these things[a], the son of the woman who owned the house became sick, and his illness became very severe, until no breath was left in him.
translation:
  language: sw
  text: Baada ya mambo hayo, mwana wa yule mwanamke aliyemiliki nyumba hiyo akaugua, na ugonjwa wake ukawa mkali sana, hata pumzi haikubaki ndani yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hata uhai haukubaki ndani yake.” Kiebrania kinasema kihalisi, “hata pumzi haikubaki ndani yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Baada ya mambo hayo
  rationale: Ni mwanzo wa simulizi ulio wa kawaida na wa asili kwa Kiswahili, huku ukihifadhi wingi wa הַדְּבָרִים na maana ya wakati bila kutumia muundo mzito wa neno kwa neno.
- source_word: חָלָה
  choice: akaugua
  rationale: Kitenzi hiki kinaonyesha kuanza kuwa mgonjwa; “akaugua” ni usemi wa kawaida wa kisimulizi unaowasilisha maana hiyo.
- source_word: בֶּן הָאִשָּׁה בַּעֲלַת הַבָּיִת
  choice: mwana wa yule mwanamke mwenye nyumba
  rationale: “Mwenye nyumba” huwasilisha maana ya בַּעֲלַת הַבָּיִת kwa uwazi na kwa lugha ya sasa, bila kuingiza cheo cha kizamani.
- source_word: וַיְהִי חָלְיוֹ חָזָק מְאֹד
  choice: na ugonjwa wake ukawa mkali sana
  rationale: “Ukawa mkali sana” huonyesha hali ya ugonjwa kuwa mbaya kupita kiasi na hufuata mfuatano wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: עַד אֲשֶׁר לֹא נוֹתְרָה בוֹ נְשָׁמָה
  choice: hata pumzi haikubaki ndani yake
  rationale: “Pumzi” ndiyo maana ya moja kwa moja ya נְשָׁמָה hapa. Tafsiri hii huhifadhi tamathali ya Kiebrania bila kuibadili kimya kimya kuwa kauli ya moja kwa moja kwamba alikufa.
theological_decisions:
- issue: Iwapo kishazi cha mwisho kitafsiriwe moja kwa moja kuwa kifo au tamathali ya Kiebrania ihifadhiwe
  choice: Kuhifadhi usemi “hata pumzi haikubaki ndani yake”
  alternative: hata uhai haukubaki ndani yake; hata akafa
  rationale: Kiebrania kinasema kwamba hakuna נְשָׁמָה iliyobaki ndani yake. Kuhifadhi “pumzi” kunadumisha maneno na mvutano wa andiko badala ya kuweka hitimisho la ufafanuzi katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Muundo ni wazi kwa msomaji wa kawaida; “mwenye nyumba” huepuka lugha ya kizamani, na “pumzi” huhifadhi picha ya matini chanzi.
