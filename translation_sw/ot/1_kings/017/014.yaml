  source_fidelity: Tafsiri inawakilisha kwa uaminifu tamko la kinabii, jina la Mungu, vyombo na vilivyomo, hali ya kutokwisha/kutopungua, na kikomo cha wakati hadi Yahwe atakapotoa mvua. “Unga uliomo mtungini” na “mafuta yaliomo chupani” ni ufasiri wa Kiswahili unaofafanua metonimia ya Kiebrania bila kubadili maana.
  naturalness: Kiswahili ni sanifu, cha kisasa, na chenye mtiririko wa kawaida. “Hivi ndivyo asemavyo,” “wala,” na “mpaka siku ... atakapotoa” vina register inayofaa kwa usemi wa kinabii. “Chupa” hufanya kazi kwa kawaida kama chombo cha mafuta katika muktadha huu.
  terminology: “Yahwe” ni umbo linalokubalika katika Kiswahili kwa יְהוָה na limetumika kwa uthabiti mara zote mbili. “Mungu wa Israeli,” “mtungi,” “unga,” “chupa,” “mafuta,” na “uso wa ardhi” ni chaguo sahihi na yasiyo ya kimadhehebu. Tanbihi ya alama a imefungwa ipasavyo kwenye tukio la kwanza la jina.
