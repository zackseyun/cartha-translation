  text: כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א תִכְלָ֔ה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א תֶחְסָ֑ר עַ֠ד י֧וֹם תתן יְהוָ֛ה גֶּ֖שֶׁם עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/014.yaml
  text: 'For this is what Yahweh[a], the God of Israel, says: ‘The jar of flour will not be used up, and the jug of oil will not run dry[c][b], until the day Yahweh gives rain on the face of the ground.’'
translation:
  language: sw
  text: 'Kwa maana hivi ndivyo asemavyo Yahwe[a], Mungu wa Israeli: “Unga uliomo mtungini hautaisha, wala mafuta yaliomo chupani hayatapungua, mpaka siku Yahwe atakapotoa mvua juu ya uso wa ardhi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH, jina la Mungu; kwa kawaida hutamkwa “Yahwe.”'
    reason: textual_or_cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina la Mungu lililoandikwa kwa herufi YHWH; umbo “Yahwe” linafuata tahajia na matamshi ya kawaida ya Kiswahili.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mnyororo huu wa umilikaji.
- source_word: כַּד הַקֶּמַח
  choice: unga uliomo mtungini
  rationale: כַּד ni chombo cha nyumbani, na muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba unga umehifadhiwa ndani ya mtungi.
- source_word: לֹא תִכְלָה
  choice: hautaisha
  rationale: Kitenzi כלה hapa humaanisha kufikia mwisho au kumalizika; “hautaisha” ni sahihi na ya kawaida kwa akiba ya unga.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: mafuta yaliomo chupani
  rationale: צַפַּחַת ni chombo kidogo cha kuhifadhia kimiminika. “Chupa” hutofautisha chombo hiki na mtungi wa unga bila kubainisha zaidi ya maandishi.
- source_word: לֹא תֶחְסָר
  choice: hayatapungua
  rationale: חסר inaweza kumaanisha kupungua au kukosekana. “Hayatapungua” huhifadhi maana ya kiasi kutopungua bila kulazimisha taswira ya chombo kukauka.
- source_word: עַד יוֹם
  choice: mpaka siku
  rationale: Huhifadhi wazi usemi wa wakati uliopo katika Kiebrania.
- source_word: תתן יְהוָה גֶּשֶׁם
  choice: Yahwe atakapotoa mvua
  rationale: נתן kimsingi ni “kutoa”; tafsiri hii inadumisha kitenzi hicho huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: juu ya uso wa ardhi
  rationale: Huhifadhi taswira ya Kiebrania ya “uso wa ardhi” na muktadha wa ukame na mvua.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi YHWH, si cheo “Bwana.” “Yahwe” hulihifadhi jina hilo katika umbo linalofaa Kiswahili bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa kinabii “hivi ndivyo asemavyo” umehifadhiwa, pamoja na taswira ya “uso wa ardhi.”
