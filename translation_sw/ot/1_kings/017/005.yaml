  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ וַ/יַּ֖עַשׂ כִּ/דְבַ֣ר יְהוָ֑ה וַ/יֵּ֗לֶךְ וַ/יֵּ֨שֶׁב֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/005.yaml
  text: So he went and did according to the word of Yahweh[a], and he went and stayed by the Wadi Cherith[b], which is before the Jordan.
translation:
  language: sw
  text: Basi akaenda, akafanya sawasawa na neno la Yahweh. Akaenda akakaa kando ya kijito cha Kerithi[a], kilicho mkabala na Yordani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “korongo la Kerithi” au “mkondo wa Kerithi”; neno la Kiebrania linaweza kumaanisha kijito, korongo, au mkondo wa maji wa msimu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kilicho mbele ya/kuelekea Yordani.” Wengine huelewa kuwa maana yake ni “mashariki ya Yordani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ וַיַּעַשׂ
  choice: Basi akaenda, akafanya
  rationale: Mfululizo wa vitenzi vya masimulizi unaendeleza tukio na kuonyesha kwamba Eliya aliitikia agizo lililotangulia.
- source_word: כִּדְבַר יְהוָה
  choice: sawasawa na neno la Yahweh
  rationale: Huhifadhi maana ya kutenda kwa kufuata agizo lililonenwa, huku jina la Mungu likitafsiriwa kwa unukuzi.
- source_word: וַיֵּשֶׁב
  choice: akakaa
  rationale: Katika muktadha huu kitenzi kina maana ya kukaa au kubaki mahali kwa muda; 'akakaa' ni Kiswahili cha kawaida kisichodokeza makazi ya kudumu.
- source_word: בְּנַחַל כְּרִית
  choice: kando ya kijito cha Kerithi
  rationale: בְ pamoja na muktadha wa kukaa inawasilishwa kwa kawaida kama 'kando ya'; נַחַל inaweza kuwa kijito, korongo, au mkondo wa maji wa msimu, hivyo tanbihi inahifadhi upana huo.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: kilicho mkabala na Yordani
  rationale: '''Mkabala na'' hudumisha wazo la kuwa mbele ya au kuelekeana na Yordani bila kuongeza mwelekeo wa ''mashariki'' ambao haujatajwa wazi katika Kiebrania.'
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Maandishi yana jina la pekee la Mungu, si cheo. 'Yahweh' hulihifadhi kwa unukuzi bila kulibadilisha kuwa cheo.
- issue: Maana ya kijiografia ya עַל פְּנֵי הַיַּרְדֵּן
  choice: mkabala na Yordani
  alternative: mashariki ya Yordani; mbele ya Yordani
  rationale: Usemi wa Kiebrania unaweza kumaanisha mbele ya, kuelekea, au mkabala na. Tafsiri haiongezi 'mashariki' ingawa eneo hilo mara nyingi hueleweka hivyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umegawanywa katika sentensi mbili ili usomeke kwa urahisi, huku urudiaji wa 'akaenda' wa Kiebrania ukihifadhiwa.
