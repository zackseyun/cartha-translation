base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/013.yaml
  text: And Elijah said to her[a], “Do not fear. Go, do as you have said. But first make me a small cake from there and bring it out to me[b], and afterward make some for yourself and for your son.”
translation:
  language: sw
  text: Eliya akamwambia, “Usiogope. Nenda ukafanye kama ulivyosema. Lakini kwanza unitengenezee mkate mdogo kwa vilivyomo humo[a], kisha uniletee. Baadaye utengeneze kwa ajili yako na mwanao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “keki ndogo.” Neno la Kiebrania עֻגָה linaweza kumaanisha mkate au keki ndogo iliyookwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Usiogope
  rationale: Ni katazo la moja kwa moja linaloeleza hofu kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בֹּאִי
  choice: Nenda
  rationale: Ingawa kitenzi kwa msingi ni ‘njoo’, hapa kinatumika kama himizo la kuendelea kutenda; ‘Nenda’ linafaa katika muktadha wa kwenda kuandaa chakula.
- source_word: עֲשִׂי כִדְבָרֵךְ
  choice: ukafanye kama ulivyosema
  rationale: Linaonyesha kutenda sawasawa na mpango ambao mjane alikuwa ametaja.
- source_word: אַךְ
  choice: Lakini
  rationale: Linaanzisha sharti au badiliko linalowekewa agizo lililotangulia.
- source_word: מִשָּׁם
  choice: kwa vilivyomo humo
  rationale: Kiebrania ni ‘kutoka humo’; katika Kiswahili, kauli hii inaelekeza kwa kawaida kwenye akiba ya unga na mafuta iliyotajwa katika muktadha bila kuifanya ionekane kama mahali pekee.
- source_word: עֻגָה קְטַנָּה
  choice: mkate mdogo
  rationale: עֻגָה ni chakula kidogo cha unga kilichookwa; ‘mkate mdogo’ ni wazi na hakidokezi keki tamu ya kisasa.
- source_word: בָרִאשֹׁנָה
  choice: kwanza
  rationale: Linahifadhi wazi utangulizi wa wakati katika ombi la Eliya.
- source_word: וְהוֹצֵאתְ לִי
  choice: kisha uniletee
  rationale: Hiphil ya יצא ina maana ya kutoa au kuleta nje; Kiswahili ‘uniletee’ huwasilisha tendo hilo kwa kawaida katika muktadha huu.
- source_word: וְלָךְ וְלִבְנֵךְ תַּעֲשִׂי
  choice: ujitengenezee wewe na mwanao
  rationale: Kitu kinachotengenezwa kinaeleweka kutokana na kishazi kilichotangulia; muundo huu ni wa kawaida na unahifadhi walengwa wote wawili.
- source_word: בָאַחֲרֹנָה
  choice: Baadaye
  rationale: Linaonyesha mpangilio unaofuata baada ya kumwandalia Eliya, bila kudai mwisho wa kudumu.
theological_decisions:
- issue: Agizo la Eliya apewe chakula kwanza linaweza kuzua mvutano wa kimaadili au kiteolojia
  choice: Kuhifadhi wazi mpangilio wa ‘kwanza’ na ‘baadaye’ bila kuupunguza
  alternative: Kulainisha ombi au kulifafanua ili kuhalalisha tendo la Eliya
  rationale: Kiebrania kinasisitiza kwamba sehemu ya Eliya iandaliwe kwanza, halafu ya mjane na mwanawe. Tafsiri inalinda mvutano huo badala ya kuutatua kwa maelezo ya kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. ‘Mkate mdogo’ limechaguliwa badala ya ‘keki ndogo’ ili kuepuka dhana ya keki tamu ya kisasa. Alama ya tanbihi [a] ipo katika matini kuu.
