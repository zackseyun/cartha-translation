source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אֵלִיָּ֜הוּ אֶת הַ/יֶּ֗לֶד וַ/יֹּרִדֵ֤/הוּ מִן הָ/עֲלִיָּה֙ הַ/בַּ֔יְתָ/ה וַֽ/יִּתְּנֵ֖/הוּ לְ/אִמּ֑/וֹ וַ/יֹּ֨אמֶר֙ אֵ֣לִיָּ֔הוּ רְאִ֖י חַ֥י בְּנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/023.yaml
  text: Then Elijah took the boy[a], brought him down from the upper room into the house, and gave him to his mother. And Elijah said, “See, your son is alive.”
translation:
  language: sw
  text: Kisha Eliya akamchukua mtoto, akamshusha kutoka chumba cha juu hadi ndani ya nyumba, akampa mama yake. Eliya akasema, “Tazama, mwanao yu hai[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanao anaishi.”
    reason: Mbadala wa kileksia unaowakilisha חַי kama tendo la kuishi badala ya hali ya kuwa hai.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akamchukua
  rationale: Kitenzi לָקַח hapa ni kitenzi cha kawaida cha simulizi chenye maana ya ‘kuchukua’; ‘akamchukua’ ni cha asili na hakiongezi namna alivyombeba.
- source_word: הַיֶּלֶד
  choice: mtoto
  rationale: יֶלֶד inaweza kumaanisha mtoto au mvulana. ‘Mtoto’ linafaa katika muktadha wa mama na mwana bila kukisia umri wake kwa usahihi usiotolewa na maandishi.
- source_word: וַיֹּרִדֵהוּ
  choice: akamshusha
  rationale: Umbo la kisababishi la יָרַד linaonyesha kumfanya ashuke au kumleta chini; ‘akamshusha’ linahifadhi maana hiyo bila kubainisha kama alimchukua mikononi.
- source_word: הָעֲלִיָּה
  choice: chumba cha juu
  rationale: עֲלִיָּה ni chumba kilicho sehemu ya juu ya jengo; ‘chumba cha juu’ ni wazi, cha sasa, na huhifadhi maana ya usanifu.
- source_word: הַבַּיְתָה
  choice: hadi ndani ya nyumba
  rationale: Kiambishi cha mwelekeo -ה katika בַּיְתָה kinaonyesha mwendo kuelekea au kuingia nyumbani; ‘hadi ndani ya nyumba’ kinaonyesha kikomo cha mwendo huo kwa Kiswahili cha kawaida.
- source_word: וַיִּתְּנֵהוּ לְאִמּוֹ
  choice: akampa mama yake
  rationale: נָתַן pamoja na mtendewa humaanisha moja kwa moja ‘kumpa’; tafsiri hii haiongezi wazo la ‘kumrudisha,’ ingawa muktadha unaweza kulidokeza.
- source_word: רְאִי
  choice: Tazama
  rationale: Ni amri ya umoja wa kike iliyoelekezwa kwa mama. ‘Tazama’ huhifadhi msisitizo wa kumwelekeza aone bila kutumia lugha ya kizamani isiyoeleweka.
- source_word: חַי בְּנֵךְ
  choice: mwanao yu hai
  rationale: Kivumishi חַי kinatumika kama kiarifu kuhusu mwana. ‘Yu hai’ ni usemi wa Kiswahili unaoeleza hali ya kuwa hai na kuhifadhi ufupi na msisitizo wa Kiebrania.
theological_decisions:
- issue: Kiwango cha kuweka wazi muujiza wa kurudishwa kwa uhai
  choice: mwanao yu hai
  alternative: mwanao amefufuliwa / mwanao amerudishwa kwenye uhai
  rationale: Kiebrania kinatangaza tu kwamba mwana yu hai. Muktadha unaonyesha muujiza, lakini tafsiri haipaswi kuongeza maelezo ya jinsi au hatua ya kurudishwa kwa uhai ambayo hayajasemwa hapa.
- issue: Uwezekano wa kutafsiri חַי kama hali au tendo endelevu
  choice: mwanao yu hai
  alternative: mwanao anaishi
  rationale: Muundo wa Kiebrania unaweza kuwasilishwa kwa Kiswahili kama hali ya kuwa hai au kwa kitenzi ‘anaishi.’ Maandishi makuu yanatumia usemi wa hali ulio wa asili katika muktadha huu, huku mbadala halali ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi vya ‘aka-’ umehifadhi mwendo wa haraka wa simulizi la Kiebrania. ‘Mwanao’ katika usemi wa Eliya huonyesha uhusiano wa kifamilia kwa kawaida zaidi kuliko kurudia ‘mtoto wako.’
