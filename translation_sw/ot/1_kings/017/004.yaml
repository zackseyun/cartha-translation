base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/004.yaml
  text: And it shall be that you will drink from the brook[c][b][a], and I have commanded the ravens to provide for you there.
translation:
  language: sw
  text: Utakunywa maji kutoka kijitoni[a], nami nimewaamuru kunguru[c] wakutunze[b] huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkondo wa maji” au “bonde la mto wa msimu.”
    reason: lexical_alternative
  - marker: b
    text: Au “wakulishe” au “wawapatie mahitaji yako.”
    reason: lexical_alternative
  - marker: c
    text: Wengine wamependekeza usomaji usiorejelea ndege badala ya “kunguru,” lakini maana ya kawaida ya neno la Kiebrania ni ndege hao, na muktadha unaofuata unaunga mkono maana hiyo.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Utakunywa
  rationale: Mfumo huu wa Kiebrania unaanzisha hali itakayofuata. Katika Kiswahili, maana yake ya wakati ujao huwasilishwa kwa kawaida na kwa uwazi katika kitenzi kinachofuata, bila kutumia kauli nzito kama “itakuwa kwamba.”
- source_word: מֵהַנַּחַל
  choice: maji ya kijito
  rationale: נחל inaweza kumaanisha kijito, mkondo wa maji, au bonde lenye maji kwa majira. “Kijito” ni neno la kawaida na linafaa katika muktadha huu; kuongeza “maji” hufanya usemi wa kunywa uwe wa asili katika Kiswahili.
- source_word: תִּשְׁתֶּה
  choice: utakunywa
  rationale: Kitenzi hiki ni nafsi ya pili umoja wa kiume na kinaeleza tendo la wakati ujao. “Utakunywa” ni tafsiri ya moja kwa moja na ya sasa katika Kiswahili.
- source_word: הָעֹרְבִים
  choice: kunguru
  rationale: Maana ya kawaida ya nomino hii ni ndege wa jamii ya kunguru. Muktadha unaofuata, ambamo wanaleta mkate na nyama, unaunga mkono maana hii ya kawaida.
- source_word: צִוִּיתִי
  choice: nimewaamuru
  rationale: Kauli timilifu ya Kiebrania inaonyesha agizo ambalo tayari limetolewa na bado lina umuhimu kwa hali ya sasa. “Nimewaamuru” huhifadhi maana hiyo.
- source_word: לְכַלְכֶּלְךָ
  choice: wakutegemeze
  rationale: Kitenzi kina maana pana ya kumwezesha mtu kuendelea kuishi, kumtunza, au kumpatia mahitaji. “Wakutegemeze” huhifadhi upana huo bila kuifinya maana kuwa kulisha pekee.
- source_word: שָׁם
  choice: huko
  rationale: Ni kielezi rahisi cha mahali. “Huko” hurejelea kwa kawaida mahali alipoagizwa Eliya kwenda.
theological_decisions:
- issue: Utambulisho wa walioamriwa kumtegemeza Eliya
  choice: Kunguru halisi ndio walioamriwa na Mungu.
  alternative: Wengine wamependekeza jina la mahali au kundi la watu badala ya ndege.
  rationale: Maana ya kawaida ya הָעֹרְבִים ni ndege waitwao kunguru, na simulizi linalofuata linasema kwamba walileta mkate na nyama. Tafsiri haipaswi kuondoa hali hii isiyo ya kawaida kwa kubadili maana ya kawaida ya neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo mzito wa moja kwa moja wa וְהָיָה umewekwa katika wakati ujao wa kawaida wa Kiswahili. Alama zote za tanbihi zimewekwa mara moja katika matini kuu karibu na maneno yanayohusika.
