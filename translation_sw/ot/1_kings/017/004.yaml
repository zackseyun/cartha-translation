  source_fidelity: 'The future statement, drinking from the נחל, the completed divine command, the literal ravens, and the location adverb are retained. The draft''s “wakutegemeze,” however, is not the best direct rendering of לְכַלְכֶּלְךָ: it can suggest merely giving support rather than sustaining/caring for Elijah''s needs.'
