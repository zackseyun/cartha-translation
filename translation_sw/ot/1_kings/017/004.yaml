  terminology: “Kijito” is a suitable accessible rendering of נחל, with seasonal streambed/wadi retained in a note. “Kunguru” correctly represents the ordinary meaning of הָעֹרְבִים. “Wakutunze” accurately conveys provision/sustenance without prematurely limiting it to feeding.
