  yaml_path: translation/ot/1_kings/017/020.yaml
  text: Then he cried out to Yahweh and said[a], “O Yahweh my God, have you also brought harm on the widow with whom I am staying[b], by causing her son to die?”
translation:
  language: sw
  text: Kisha akamlilia Yahwe, akisema, “Ee Yahwe, Mungu wangu, je, hata umemletea madhara[a] mjane huyu ambaye ninakaa kwake[b], kwa kumfisha mwanawe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umemtendea vibaya mjane”; kitenzi cha Kiebrania kinaweza kumaanisha kuleta madhara au msiba, kutenda uovu, au kumtendea mtu vibaya.
    reason: lexical_alternative
  - marker: b
    text: Au “ninayeishi kwake kama mgeni”; Kiebrania kinaonyesha kukaa kwa muda kama mgeni au mtu anayemtegemea mwenyeji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל־יְהוָה
  choice: akamlilia Yahwe
  rationale: Katika muktadha wa sala ya dharura, kitenzi קרא pamoja na אֶל kinaonyesha mwito wa nguvu na wenye uchungu; “akamlilia” ni Kiswahili cha kawaida kinachoonyesha uzito huo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: יְהוָה אֱלֹהָי
  choice: Ee Yahwe, Mungu wangu
  rationale: “Ee” huonyesha wazi kwamba haya ni maneno ya kumwita Mungu moja kwa moja, huku “Mungu wangu” kikihifadhi kiambishi cha nafsi ya kwanza.
- source_word: הֲגַם
  choice: je, hata
  rationale: Muungano huu unaonyesha swali la mshangao kuhusu msiba mwingine ulioongezeka; “je, hata” huhifadhi nguvu hiyo.
- source_word: מִתְגּוֹרֵר עִמָּהּ
  choice: ninayekaa kwake
  rationale: Kitenzi kinaonyesha kukaa kwa muda kama mgeni au mtu anayemtegemea mwenyeji. Kauli hii ni ya asili katika Kiswahili na inaendana na hali ya Eliya.
- source_word: הֲרֵעוֹתָ
  choice: umemletea madhara
  rationale: Hifili ya רעע hapa inaweza kumaanisha kusababisha madhara au kuleta msiba, bila kulazimisha maana ya kutenda uovu wa kimaadili.
- source_word: לְהָמִית
  choice: kwa kumfisha
  rationale: Jina la kitendo linaonyesha njia au matokeo ya madhara. “Kwa kumfisha” huhifadhi wazo la kusababisha kifo bila kulainisha uwajibikaji unaotajwa katika ombi.
- source_word: בְּנָהּ
  choice: mwanawe
  rationale: Neno בן linamaanisha mwana wa kiume, na tafsiri hii inadumisha umahususi wa chanzo.
theological_decisions:
- issue: Je, sala ya Eliya inamshtaki Mungu kwa uovu wa kimaadili au inamlilia kuhusu madhara/msiba aliouleta?
  choice: umemletea madhara ... kwa kumfisha mwanawe
  alternative: umemtendea uovu mjane ... kwa kumuua mwanawe
  rationale: רעע inaweza kueleza kuleta madhara au msiba bila kutamka moja kwa moja kwamba Mungu ametenda uovu wa kimaadili. Tafsiri inadumisha ukali wa kilio cha Eliya na kauli yake kwamba Mungu amesababisha kifo, bila kuamua zaidi ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa msomaji wa kawaida. “Ee” hudumisha mwito wa moja kwa moja, na mpangilio wa swali huhifadhi mshangao na mvutano wa kilio cha Eliya.
