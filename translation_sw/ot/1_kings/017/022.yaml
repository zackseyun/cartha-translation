  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה בְּ/ק֣וֹל אֵלִיָּ֑הוּ וַ/תָּ֧שָׁב נֶֽפֶשׁ הַ/יֶּ֛לֶד עַל קִרְבּ֖/וֹ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/022.yaml
  text: And Yahweh listened to the voice of Elijah[a], and the life of the child returned to his inner being, and he lived.
translation:
  language: sw
  text: Yahwe akasikiliza sauti ya Eliya, na uhai wa mtoto ukarudi ndani yake[a], naye akaishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi ya mtoto ikarudi ndani yake.” Neno la Kiebrania nefesh linaweza kumaanisha “uhai,” “nafsi,” au “utu,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: akasikiliza
  rationale: Katika muktadha wa sala, kitenzi שׁמע kinaonyesha si kusikia tu bali pia kuitikia kwa kibali; “akasikiliza” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo.
- source_word: בְּקוֹל
  choice: sauti ya
  rationale: Huhifadhi taswira halisi ya Kiebrania ya kuisikiliza sauti ya Eliya bila kuipanua kiufafanuzi kuwa “sala” au “ombi.”
- source_word: וַתָּשָׁב
  choice: ukarudi
  rationale: שׁוב hapa huonyesha kurudi au kurejeshwa; “ukarudi” ni ya moja kwa moja na ya kawaida katika muktadha wa mtoto kufufuliwa.
- source_word: נֶפֶשׁ
  choice: uhai
  rationale: Katika muktadha huu wa mtoto aliyekufa kuishi tena, “uhai” huwasilisha vizuri nguvu au hali ya kuwa hai bila kuamua kwamba neno hilo lazima limaanishe nafsi iliyo tofauti na mwili.
- source_word: הַיֶּלֶד
  choice: mtoto
  rationale: יֶלֶד humaanisha mtoto au mvulana; “mtoto” inafaa katika simulizi hili na ni ya kawaida kwa Kiswahili.
- source_word: עַל קִרְבּוֹ
  choice: ndani yake
  rationale: Kirai hicho huelekeza kwenye sehemu za ndani au utu wa ndani wa mtoto. “Ndani yake” ni Kiswahili cha asili kinachohifadhi wazo la kurudi ndani ya mtoto bila kuwa kizito.
- source_word: וַיֶּחִי
  choice: naye akaishi
  rationale: 'Hutoa matokeo kwa ufupi kama Kiebrania: mtoto aliishi. Kiunganishi “naye” huweka wazi kuwa kiwakilishi kinamhusu mtoto.'
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika muktadha wa kurudishwa kwa mtoto kwenye uhai
  choice: uhai
  alternative: nafsi
  rationale: “Uhai” hufuata maana ya moja kwa moja ya simulizi—mtoto alianza kuishi tena—bila kuingiza kwa lazima mtazamo maalumu kuhusu uhusiano wa nafsi na mwili. “Nafsi” ni tafsiri halali ya jadi, hivyo imehifadhiwa katika tanbihi ili kuonyesha uwazi wa kileksia na mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa simulizi la Biblia lakini unasomeka kwa urahisi; “ndani yake” limechaguliwa badala ya kirai kizito kama “katika utu wake wa ndani.”
