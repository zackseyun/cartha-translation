base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/024.yaml
  text: Then the woman said to Elijah[a], “Now I know that you are a man of God, and that the word of Yahweh in your mouth is truth.”
translation:
  language: sw
  text: Ndipo mwanamke akamwambia Eliya, “Sasa ninajua kwamba wewe ni mtu wa Mungu, na kwamba neno la Yahweh lililo kinywani mwako ni la kweli.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni ukweli,” au “ni la kuaminika.” Nomino ya Kiebrania inaweza kukazia ukweli, uaminifu, au kutegemeka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano wa tukio kwa Kiswahili cha kawaida.
- source_word: הָאִשָּׁה
  choice: mwanamke
  rationale: Neno la Kiebrania hapa ni “mwanamke.” Ingawa muktadha unamtambulisha kuwa mjane, tafsiri haiingizi maelezo hayo katika mstari huu.
- source_word: אֶל אֵלִיָּהוּ
  choice: akamwambia Eliya
  rationale: Muundo wa Kiswahili huwasilisha kwa kawaida kitendo cha kusema kilichoelekezwa kwa Eliya.
- source_word: עַתָּה זֶה
  choice: Sasa
  rationale: Mchanganyiko huu wa maneno unaonyesha utambuzi wa wakati huu kwa msisitizo; “Sasa” ni wa kawaida na hudumisha nguvu hiyo.
- source_word: יָדַעְתִּי
  choice: ninajua
  rationale: Ingawa kitenzi ni cha hali timilifu kwa umbo, katika muktadha kinaeleza uhakika wa sasa uliotokana na tukio lililotokea.
- source_word: כִּי
  choice: kwamba
  rationale: Hutambulisha maudhui ya jambo ambalo mwanamke sasa analijua.
- source_word: אִישׁ אֱלֹהִים
  choice: mtu wa Mungu
  rationale: Huu ni msemo unaotambulika kwa nabii au mtu aliye wa Mungu; “mtu wa Mungu” ni wazi na wa kawaida.
- source_word: וּדְבַר יְהוָה
  choice: na kwamba neno la Yahweh
  rationale: “Neno” huhifadhi taswira na uzito wa usemi wa kinabii, huku jina la agano יְהוָה likitolewa kama “Yahweh.” Kurudiwa kwa “kwamba” kunafanya sentensi iwe wazi katika Kiswahili.
- source_word: בְּפִיךָ
  choice: lililo kinywani mwako
  rationale: Huhifadhi taswira ya Kiebrania ya neno lililo katika kinywa cha nabii na bado ni Kiswahili kinachoeleweka.
- source_word: אֱמֶת
  choice: ni la kweli
  rationale: Hii ni kauli ya asili katika Kiswahili inayowasilisha ukweli na uaminifu wa neno bila kulazimisha maana moja tu ya nomino ya Kiebrania.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אֱמֶת kuhusu neno la Yahweh
  choice: ni la kweli
  alternative: ni ukweli; ni la kuaminika
  rationale: אֱמֶת inaweza kusisitiza ukweli, uaminifu, au kutegemeka. Tafsiri kuu ni ya kawaida kwa Kiswahili, huku tanbihi ikihifadhi upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ni wa kawaida, na taswira ya kinabii ya “neno ... kinywani mwako” imehifadhiwa bila kuwa ngumu kueleweka.
