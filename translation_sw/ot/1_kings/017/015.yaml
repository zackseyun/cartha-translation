base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/015.yaml
  text: So she went and did according to the word of Elijah[a], and she ate—he and she and her household—for many days.
translation:
  language: sw
  text: Basi akaenda akafanya kama Eliya alivyosema[a]. Naye akala—Eliya, huyo mwanamke, na watu wa nyumbani mwake—kwa siku nyingi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “Naye akala—yeye, yeye, na watu wa nyumbani mwake—kwa siku nyingi.” Kitenzi “akala” kiko katika umoja wa kike, kikimrejelea huyo mwanamke, kisha Kiebrania huwataja waliokula: yeye (yaani Eliya katika muktadha), yeye, na watu wa nyumbani mwake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: Basi akaenda
  rationale: Kitenzi hiki kinaendeleza mfululizo wa simulizi; “Basi” huonyesha matokeo ya maagizo yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: וַתַּעֲשֶׂה
  choice: akafanya
  rationale: עשה hapa humaanisha kutekeleza aliloagizwa, si kutengeneza kitu tu.
- source_word: כִּדְבַר אֵלִיָּהוּ
  choice: sawasawa na neno la Eliya
  rationale: דבר hapa ni kauli au agizo lililotolewa; tafsiri hii inadumisha muundo na uzito wa Kiebrania bila kuufanya kuwa wa kimadhehebu.
- source_word: וַתֹּאכַל
  choice: naye akala
  rationale: Kitenzi cha Kiebrania kiko katika nafsi ya tatu, umoja wa kike, kikimrejelea mjane; umoja umehifadhiwa badala ya kulainishwa kuwa “wakala.”
- source_word: הוּא וְהִיא וּבֵיתָהּ
  choice: yeye mwanamume, yeye mwanamke, na watu wa nyumbani mwake
  rationale: Orodha ya wazi na mpangilio wake zimehifadhiwa. Maelezo ya jinsia yanaondoa utata usio wa asili katika Kiswahili, ambacho “yeye” pekee hakionyeshi tofauti ya הוּא na הִיא.
- source_word: בֵּיתָהּ
  choice: watu wa nyumbani mwake
  rationale: בַּיִת inaweza kumaanisha nyumba au jamaa ya nyumbani; katika muktadha wa kula, watu wa nyumbani ndio maana inayokusudiwa kwa urahisi zaidi.
- source_word: יָמִים
  choice: kwa siku nyingi
  rationale: Wingi huu umetumiwa kueleza muda ulioendelea; “kwa siku nyingi” ni Kiswahili cha kawaida kinachobaki ndani ya maana ya neno.
theological_decisions:
- issue: Utambulisho wa kiwakilishi הוּא (“yeye mwanamume”)
  choice: Kiwakilishi kimehifadhiwa bila kukibadili moja kwa moja kuwa jina “Eliya.”
  alternative: Eliya, yeye mwanamke, na watu wa nyumbani mwake
  rationale: Muktadha unaelekeza kwa Eliya, lakini maandishi yenyewe yanatumia kiwakilishi; kuhifadhi kiwakilishi huepuka kuongeza ufafanuzi usioandikwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo usio wa kawaida wa kitenzi cha umoja ukifuatwa na orodha umehifadhiwa kwa mikato mirefu na umeelezwa katika tanbihi.
