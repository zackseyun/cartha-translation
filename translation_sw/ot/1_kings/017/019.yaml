base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/019.yaml
  text: And he said to her[a], “Give me your son.” Then he took him from her bosom, carried him up to the upper room where he was staying[b], and laid him on his own bed.
translation:
  language: sw
  text: Akamwambia, “Nipe mwanao.” Kisha akamchukua kutoka kifuani mwake[a], akambeba hadi kwenye chumba cha juu alikokuwa akiishi[b], akamlaza kitandani mwake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka mapajani mwake.” Neno la Kiebrania hurejelea eneo la kifua au mapaja na linaonyesha kushikwa kwa ukaribu.
    reason: lexical_alternative
  - marker: b
    text: Au, “chumba cha orofani” au “darini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנִי לִי
  choice: Nipe
  rationale: Kauli ya amri yenye kiwakilishi cha mtendewa לִי inaelezwa kwa Kiswahili cha kawaida na cha moja kwa moja kuwa “Nipe,” bila kuongeza ukali usio katika maandishi.
- source_word: בְּנֵךְ
  choice: mwanao
  rationale: בֵּן hapa humaanisha mwana wa kiume; “mwanao” ni fupi, ya asili, na inadumisha maana hiyo katika muktadha.
- source_word: מֵחֵיקָהּ
  choice: kutoka kifuani mwake
  rationale: חֵיק hurejelea eneo la kifua au mapaja ambako mtu hushikwa kwa ukaribu. “Kifuani mwake” inadumisha picha ya mama aliyemkumbatia mwanawe bila kuibadili moja kwa moja kuwa “mikononi.”
- source_word: וַיַּעֲלֵהוּ
  choice: akambeba juu
  rationale: Kitenzi kinaonyesha kumpeleka kuelekea juu. Kwa kuwa Eliya alikuwa amemchukua mwana huyo, “akambeba juu” huonyesha kwa Kiswahili cha kawaida tendo la kumpeleka akiwa amembeba.
- source_word: הָעֲלִיָּה
  choice: chumba cha juu
  rationale: עֲלִיָּה ni chumba kilicho sehemu ya juu ya nyumba au juu ya paa. “Chumba cha juu” ni sawia iliyo wazi na isiyobana muundo wa jengo kuliko ushahidi unavyoruhusu.
- source_word: אֲשֶׁר הוּא יֹשֵׁב שָׁם
  choice: ambako alikuwa akiishi
  rationale: Ingawa יֹשֵׁב inaweza kumaanisha kuketi, hapa ina maana ya kukaa au kuishi mahali. “Ambako alikuwa akiishi” ni ya kawaida na inafaa muktadha.
- source_word: וַיַּשְׁכִּבֵהוּ
  choice: akamlaza
  rationale: Hifili ya שׁכב humaanisha kumsababisha mtu alale; “akamlaza” ni tafsiri sahihi na fupi.
- source_word: עַל מִטָּתוֹ
  choice: juu ya kitanda chake mwenyewe
  rationale: Kiwakilishi cha umilikaji kinamrejelea Eliya. “Mwenyewe” hufanya rejeo hilo liwe wazi katika Kiswahili bila kubadili tendo.
