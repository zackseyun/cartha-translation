base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/018.yaml
  text: She said to Elijah[a], “What do I have to do with you, man of God? Have you come to me to bring my iniquity to remembrance and to cause my son to die?”
translation:
  language: sw
  text: Akamwambia Eliya, “Nina nini nawe, ewe mtu wa Mungu? Je, umekuja kwangu kuifanya hatia yangu[a] ikumbukwe na kumfanya mwanangu afe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhambi yangu” au “uovu wangu.” Neno la Kiebrania linaweza kumaanisha kosa, hatia, au mzigo na matokeo ya hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: Una nini nami
  rationale: Ni nahau ya malalamiko, kujitenga, au kupinga. Tafsiri hii ni ya kawaida na yenye nguvu katika Kiswahili, bila kuibadili kuwa swali la kawaida kuhusu uhusiano.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ewe mtu wa Mungu
  rationale: “Mtu wa Mungu” huhifadhi cheo cha Kiebrania cha nabii au mjumbe wa Mungu; “ewe” huonyesha kwamba ni usemi wa moja kwa moja na wenye uzito.
- source_word: בָּאתָ אֵלַי
  choice: umekuja kwangu
  rationale: Wakati timilifu wa Kiswahili unafaa kwa swali la lawama kuhusu kuja kwake na matokeo yanayoonekana sasa.
- source_word: לְהַזְכִּיר
  choice: kuifanya ... ikumbukwe
  rationale: Muundo huu huhifadhi maana ya kisababishi, yaani kuifanya hatia ile iletwe katika kumbukumbu au izingatiwe, bila kumtaja wazi anayekumbuka kwa kuwa Kiebrania hakumtaji.
- source_word: עֲוֺנִי
  choice: hatia yangu
  rationale: “Hatia” inaweza kuelekea kwenye kosa lenyewe au hali ya kuwajibika kwa kosa, hivyo huhifadhi upana wa עָוֹן vizuri kuliko neno linalomaanisha tendo la dhambi pekee.
- source_word: וּלְהָמִית
  choice: na kumfanya ... afe
  rationale: Huhifadhi hali ya kisababishi ya kitenzi cha Kiebrania badala ya kuifanya moja kwa moja kuwa “kumuua.”
- source_word: בְּנִי
  choice: mwanangu
  rationale: Katika muktadha huu neno la Kiebrania linamaanisha mwana wa kiume; “mwanangu” ni la kawaida na sahihi katika Kiswahili.
theological_decisions:
- issue: Maana ya עֲוֺנִי katika lawama ya mjane
  choice: hatia yangu
  alternative: dhambi yangu; uovu wangu
  rationale: Mjane anahusianisha kifo cha mwanawe na kosa au uwajibikaji wake mwenyewe. “Hatia” huhifadhi mvutano kati ya tendo baya na hali au mzigo wa kuwajibika, bila kuamua kimya kimya upande mmoja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi “Una nini nami?” una nguvu ya malalamiko inayolingana na nahau ya Kiebrania; sentensi iliyobaki inaweka wazi sauti ya lawama bila kuongeza maelezo yasiyomo katika chanzo.
