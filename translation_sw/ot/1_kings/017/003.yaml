base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/003.yaml
  text: Go from here and turn yourself eastward[a], and hide yourself by the Wadi Cherith[c][b], which is east of the Jordan.
translation:
  language: sw
  text: Ondoka hapa, ugeuke uelekee mashariki, ukajifiche kando ya kijito cha Kerithi[a], kilicho mbele ya Yordani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania נחל linaweza kumaanisha kijito, bonde au korongo lenye mkondo wa maji, mara nyingi wa msimu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “kilicho mbele ya Yordani.” Hapa inaweza kumaanisha “mkabala na Yordani”; pia huenda ikamaanisha “mashariki mwa Yordani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ מִזֶּה
  choice: Ondoka hapa
  rationale: Amri לֵךְ pamoja na מִזֶּה inamtaka Eliya aondoke mahali alipo. “Ondoka hapa” ni Kiswahili cha kawaida, cha moja kwa moja.
- source_word: וּפָנִיתָ לְּךָ קֵדְמָה
  choice: ugeuke uelekee mashariki
  rationale: פנה ina wazo la kugeuka au kubadili mwelekeo, na קֵדְמָה huelekeza mashariki. לְךָ inaongeza mguso wa kujielekeza mwenyewe, lakini Kiswahili cha asili hakihitaji kusema “mwenyewe” hapa.
- source_word: וְנִסְתַּרְתָּ
  choice: ukajifiche
  rationale: Nifali ya סתר katika muktadha huu ina maana ya kujiweka mafichoni. “Ukajifiche” ni amri ya asili inayofuata hatua iliyotangulia.
- source_word: בְּנַחַל
  choice: kando ya kijito
  rationale: נחל inaweza kumaanisha kijito, bonde la mto, korongo, au mkondo wa maji wa msimu. “Kando ya kijito” inafaa muktadha wa mahali na pia tukio la kunywa maji katika mstari unaofuata, huku tanbihi ikihifadhi upana wa maana.
- source_word: כְּרִית
  choice: Kerithi
  rationale: Jina la mahali limetoholewa kwa kuzingatia konsonanti ya kwanza ya Kiebrania כ na matamshi yanayoeleweka kwa wasomaji wa Kiswahili.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: kilicho mkabala na Yordani
  rationale: עַל־פְּנֵי inaweza kumaanisha mbele ya, mkabala na, au upande fulani wa kitu. “Mkabala na Yordani” hudumisha uhusiano wa kijiografia bila kuamua kimyakimya kwamba mahali hapo lazima pawe mashariki mwa mto.
