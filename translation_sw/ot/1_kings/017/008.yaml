base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/008.yaml
  text: Then the word of Yahweh came to him[a], saying,
translation:
  language: sw
  text: 'Kisha neno la Yahwe likamjia[a], likisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH, jina binafsi la Mungu; hapa limetafsiriwa “Yahwe.”'
    reason: Maelezo ya jina la Mungu katika Kiebrania na uchaguzi wa kulitafsiri kwa umbo la “Yahwe.”
lexical_decisions:
- source_word: וַיְהִי
  choice: Kisha ... likamjia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi. Kiswahili cha sasa hutumia “Kisha” kwa kawaida bila msemo mzito wa “ikawa kwamba”; wazo la kutokea kwa tukio linaendelezwa pamoja na kitenzi “likamjia.”
- source_word: דְבַר
  choice: neno
  rationale: Katika muundo wa kinabii דְבַר יְהוָה, “neno” huhifadhi nahau ya mawasiliano ya Mungu na uzito wake wa kiteolojia kuliko tafsiri ya ufafanuzi zaidi kama “ujumbe.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni umbo la Kiswahili la jina binafsi la Mungu linalowakilishwa na tetragramatoni יְהוָה, badala ya kulibadili kuwa cheo kama “BWANA.”
- source_word: אֵלָיו
  choice: likamjia
  rationale: Kihusishi אֶל pamoja na kiambishi cha nafsi ya tatu kiume umoja kina maana ya “kwake.” Katika Kiswahili, “neno ... likamjia” ni usemi wa kawaida na sahihi unaoonyesha kwamba mawasiliano hayo yalimfikia.
- source_word: לֵאמֹר
  choice: likisema
  rationale: Kitenzi-jina hiki huanzisha maneno ya moja kwa moja. “Likisema” kinafuata muundo wa chanzo na kuandaa maneno yanayoanza katika aya inayofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo cha Kiebrania kinatumia jina binafsi יְהוָה moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, huku tanbihi ikieleza utambulisho wake kwa msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kisha” ni kiunganishi cha kawaida cha simulizi; “likamjia, likisema” huhifadhi fomula ya kinabii bila kutumia lugha ya kizamani. Alama ya nukta mbili inaonyesha kwamba usemi wa moja kwa moja unaanza katika aya inayofuata.
