lexical_decisions:
- source_word: וַיְהִי
  choice: Baada ya muda, ...
  rationale: Mfumo huu ni kiunganishi cha simulizi kinachoanzisha tukio linalofuata; katika Kiswahili cha kawaida maana yake inaingizwa kwa ufasaha katika sentensi badala ya kutafsiriwa kwa namna nzito kama “ikawa kwamba.”
- source_word: מִקֵּץ יָמִים
  choice: baada ya muda
  rationale: Nahau hii inaonyesha kupita kwa kipindi kisichotajwa kwa usahihi; “baada ya muda” ni ya asili na inadumisha kutokuwa mahususi huko.
- source_word: וַיִּיבַשׁ
  choice: kikakauka
  rationale: Kitenzi kinaeleza mkondo wa maji kukosa maji na kuwa mkavu; “kukauka” ni usemi wa kawaida kwa kijito.
- source_word: הַנָּחַל
  choice: kijito kile
  rationale: נחל ni mkondo wa maji, mara nyingi wa msimu, au bonde lake. “Kijito” kinaeleweka kwa urahisi katika Kiswahili; tanbihi inaeleza maana pana ya kijiografia.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa kiunganishi kinaonyesha sababu ya kijito kukauka.
- source_word: לֹא הָיָה גֶשֶׁם
  choice: mvua haikunyesha
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza kutokuwapo kwa mvua katika kipindi kilichosababisha kijito kukauka.
- source_word: בָּאָרֶץ
  choice: nchini
  rationale: אֶרֶץ hapa ni nchi au eneo lililoathiriwa na ukame, si dunia nzima; “nchini” ni ya asili katika muktadha huu.
