base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/009.yaml
  text: Get up[a], go to Zarephath, which belongs to Sidon, and stay there. Look[b], I have commanded a widow there to provide for you.
translation:
  language: sw
  text: Ondoka, uende Sarepta ya Sidoni[a], ukae huko. Tazama, nimemwamuru[b] mwanamke mmoja mjane huko akutunze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Sarepta iliyo katika eneo la Sidoni” au “Sarepta iliyo karibu na Sidoni.” Kiebrania kinahusianisha Sarepta na Sidoni, huenda kwa upande wa eneo au mamlaka ya kisiasa.
    reason: lexical_alternative
  - marker: b
    text: Au “nimemteua mwanamke mmoja mjane huko ili akutunze.” Kiebrania kinasema “nimemwamuru”; huenda usemi huo ukaeleza uongozi mkuu wa Mungu hata kama simulizi halionyeshi bado kwamba mjane huyo aliijua amri hiyo.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וּם
  choice: Ondoka
  rationale: Amri ya קום humtaka Eliya ainuke na kuanza hatua inayofuata. “Ondoka” ni Kiswahili cha sasa na cha kawaida kinachohifadhi nguvu ya amri katika muktadha wa safari.
- source_word: לֵ֤ךְ
  choice: uende
  rationale: Amri ya הלך inaeleza mwendo kuelekea mahali fulani. “Uende” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: צָרְפַתָ/ה֙
  choice: Sarepta
  rationale: Ni jina la mahali; umbo “Sarepta” linatambulika katika mapokeo ya majina ya Biblia ya Kiswahili.
- source_word: אֲשֶׁ֣ר לְ/צִיד֔וֹן
  choice: ulio wa Sidoni
  rationale: Kirai hiki kinahusianisha Sarepta na Sidoni, huenda kwa upande wa eneo au mamlaka ya kisiasa. “Ulio wa Sidoni” huhifadhi uhusiano huo bila kuufanya kwa lazima kuwa wa ndani ya mji wenyewe.
- source_word: וְ/יָשַׁבְתָּ֖ שָׁ֑ם
  choice: ukae huko
  rationale: Kitenzi hiki katika mfuatano wa amri kinaagiza makazi au kukaa mahali hapo. “Ukae huko” ni cha kawaida na hakina ladha ya kizamani.
- source_word: הִנֵּ֨ה
  choice: Tazama
  rationale: Neno hili huvuta fikira kwa jambo linalofuata. “Tazama” huhifadhi kazi hiyo ya kimazungumzo kwa lugha yenye heshima na inayoeleweka.
- source_word: צִוִּ֥יתִי
  choice: nimemwamuru
  rationale: Piel timilifu ya צוה kwa kawaida humaanisha “kuamuru.” Tafsiri hii inadumisha nguvu ya neno na haiondoi mvutano wa simulizi kuhusu jinsi mjane huyo alivyopokea amri hiyo.
- source_word: אִשָּׁ֥ה אַלְמָנָ֖ה
  choice: mwanamke mmoja mjane
  rationale: Kiebrania kinamtaja wazi kama mwanamke aliye mjane. Umbo hili huhifadhi taarifa zote mbili kwa Kiswahili cha kawaida.
- source_word: לְ/כַלְכְּלֶֽ/ךָ
  choice: akutunze
  rationale: כלכל ina maana ya kudumisha maisha au kumpatia mtu mahitaji. Katika muktadha huu “akutunze” ni fupi, ya kawaida, na inajumuisha kumpatia chakula na mahitaji ya kuishi.
theological_decisions:
- issue: Maana ya kauli ya Mungu kwamba amemwamuru mjane
  choice: Kuhifadhi usemi wa moja kwa moja “nimemwamuru.”
  alternative: “Nimemteua” au “nimemwandaa” mwanamke mjane huko.
  rationale: צוה humaanisha moja kwa moja “kuamuru.” Simulizi linalofuata halisemi wazi kwamba mjane alikuwa tayari anajua amri hiyo; kwa hiyo tafsiri haiufafanui mvutano huo kwa kubadili kitenzi kuwa “teua” au “andaa.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. “Tazama” limetumiwa kudumisha msisitizo wa הִנֵּה, na “ulio wa Sidoni” kuhifadhi kutokuwa dhahiri kabisa kwa aina ya uhusiano kati ya Sarepta na Sidoni.
