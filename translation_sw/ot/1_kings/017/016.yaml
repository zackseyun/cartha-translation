base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/016.yaml
  text: The jar of flour was not used up[a], and the jug of oil did not run out, according to the word of Yahweh that he had spoken by the hand of Elijah.
translation:
  language: sw
  text: Mtungi wa unga haukuisha, wala mafuta katika chupa hayakupungua, sawasawa na neno la Yahwe alilolinena kwa mkono wa Eliya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa mkono wa Eliya,” nahau yenye maana ya “kupitia Eliya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּד הַקֶּמַח
  choice: mtungi wa unga
  rationale: “Mtungi” ni neno la kawaida kwa chombo cha kuhifadhia unga na linadumisha taswira ya chombo cha nyumbani.
- source_word: לֹא כָלָתָה
  choice: haukuisha
  rationale: Katika muktadha huu kitenzi כלה humaanisha kufikia mwisho au kumalizika; “haukuisha” ni Kiswahili cha asili kinachoeleza ugavi ulioendelea.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: chupa ya mafuta
  rationale: צַפַּחַת ni chombo kidogo cha kubebea au kuhifadhia kimiminika; “chupa” ni wazi kwa wasomaji wa sasa na inakitofautisha na mtungi wa unga.
- source_word: לֹא חָסֵר
  choice: haikupungua
  rationale: חסר hapa huonyesha kutopungua au kutokosekana. “Haikupungua” huhifadhi tofauti ndogo dhidi ya כלה, badala ya kutafsiri vitenzi vyote kuwa “kuisha.”
- source_word: כִּדְבַר יְהוָה
  choice: sawasawa na neno la Yahwe
  rationale: Huhifadhi uhusiano wa wazi kati ya tukio na neno la Mungu lililotangulia, huku jina la agano יְהוָה likitolewa kama “Yahwe.”
- source_word: אֲשֶׁר דִּבֶּר
  choice: alilolinena
  rationale: Muundo huu unaonyesha kwamba Yahwe alikuwa amekwisha kunena neno hilo kabla ya kutimizwa kwake; “nena” inafaa kwa lugha ya heshima bila kuwa ya kizamani kupita kiasi.
- source_word: בְּיַד אֵלִיָּהוּ
  choice: kwa mkono wa Eliya
  rationale: Huhifadhi nahau ya Kiebrania ya uwakala wa kinabii; tanbihi inaeleza maana yake ya kawaida ya “kupitia Eliya.”
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, si cheo; “Yahwe” hulihifadhi kwa unukuzi wa kawaida wa kisasa.
- issue: Nahau ya uwakala katika unabii
  choice: alilolinena kwa mkono wa Eliya
  alternative: alilolinena kupitia Eliya
  rationale: Toleo kuu linahifadhi nahau ya chanzo na kutenganisha Yahwe, msemaji wa neno, na Eliya, mjumbe aliyetumiwa; tanbihi hutoa maana yake kwa Kiswahili cha moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha usambamba wa vishazi viwili na nahau ya kinabii ya Kiebrania, huku tanbihi ikisaidia uelewevu.
