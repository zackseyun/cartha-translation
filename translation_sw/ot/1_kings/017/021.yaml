base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/021.yaml
  text: Then he stretched himself out over the boy three times[a], and he cried out to Yahweh and said, “Yahweh my God, please let this boy’s life return to him.”
translation:
  language: sw
  text: Kisha akajinyoosha juu ya mvulana mara tatu, akamlilia Yahweh na kusema, “Ee Yahweh, Mungu wangu, tafadhali, uhai[a] wa mvulana huyu urudi ndani yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi ya mvulana huyu irudi ndani yake.” Kiebrania kina neno nefesh, ambalo hapa linaweza kumaanisha “uhai” au “nafsi”; kwa karibu zaidi, sentensi hiyo ni “nefesh ya mvulana huyu irudi katika sehemu yake ya ndani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְמֹדֵד
  choice: akajinyoosha
  rationale: Kitenzi hiki adimu cha kujirejelea kinaeleza Eliya akiunyosha mwili wake juu ya mtoto; ‘akajinyoosha’ ni Kiswahili cha kawaida na hudumisha tendo la kimwili bila kutumia usemi hafifu wa ‘akajipima.’
- source_word: עַל הַיֶּלֶד
  choice: juu ya mvulana
  rationale: עַל hapa huonyesha mahali mwili wa Eliya ulipokuwa kuhusiana na mtoto. ‘Juu ya mvulana’ ni ya asili na haidai kwamba uzito wote wa Eliya ulimlemea.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: mara tatu
  rationale: Hii ndiyo njia ya kawaida na iliyo wazi ya kutafsiri idadi pamoja na ‘nyakati/matukio.’
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: akamlilia Yahweh
  rationale: Katika muktadha wa sala, קרא אל huonyesha mwito wa dhati na wa haraka. ‘Akamlilia’ huwasilisha uzito wa ombi hilo bila kulifanya kuwa kilio cha maombolezo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa namna ya kulitamka badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: יְהוָה אֱלֹהָי
  choice: Ee Yahweh, Mungu wangu
  rationale: ‘Ee’ huonyesha wazi kwamba haya ni maneno ya kumwita Mungu moja kwa moja, huku ‘Mungu wangu’ ikihifadhi kiambishi cha nafsi ya kwanza.
- source_word: תָּשָׁב נָא
  choice: tafadhali ... na urudi
  rationale: Kitenzi cha ombi pamoja na נָא kinaonyesha dua ya dhati yenye adabu. Muundo ‘tafadhali ... na urudi’ ni wa asili na unahifadhi kwamba ‘uhai/nafsi’ ndiyo kiima cha kurudi.
- source_word: נֶפֶשׁ
  choice: uhai
  rationale: Katika simulizi hili la kumrudisha mtoto kwenye uhai, נֶפֶשׁ hueleweka kwa kawaida kama uhai unaohuisha. ‘Uhai’ huepuka kulazimisha fundisho maalumu kuhusu sehemu isiyo ya mwili, huku ‘nafsi’ ikihifadhiwa katika tanbihi kama maana nyingine halali.
- source_word: הַיֶּלֶד הַזֶּה
  choice: mvulana huyu
  rationale: יַלֶד inaweza kumaanisha mtoto au mvulana. Muktadha humtambulisha kama mwana wa mjane, kwa hiyo ‘mvulana huyu’ ni mahsusi na sahihi kwa jinsia.
- source_word: עַל קִרְבּוֹ
  choice: ndani yake
  rationale: Usemi huu kwa karibu ni ‘kwenye sehemu yake ya ndani.’ ‘Ndani yake’ ni Kiswahili cha asili kinachodumisha picha ya uhai kurudi ndani ya mtoto bila kuingiza maelezo ya kisasa ya viungo vya mwili.
theological_decisions:
- issue: Tafsiri ya נֶפֶשׁ katika muktadha wa kurudi kwenye uhai
  choice: uhai
  alternative: nafsi
  rationale: ‘Uhai’ huwasilisha maana ya simulizi kwamba mtoto aishi tena bila kuamua kimya kimya mfumo fulani wa elimu kuhusu mwili na nafsi. Kwa kuwa ‘nafsi’ ni tafsiri ya jadi na inayowezekana kimsamiati, imeonyeshwa katika tanbihi ili kudumisha uwazi na mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sala ni rahisi kueleweka lakini unadumisha uzito wa tukio. Jina ‘Yahweh’ limehifadhiwa kama jina binafsi, na tanbihi inaweka wazi uwezekano wa ‘nafsi’ bila kulazimisha hitimisho la kimadhehebu.
