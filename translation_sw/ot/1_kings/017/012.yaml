  text: וַ/תֹּ֗אמֶר חַי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אִם יֶשׁ לִ֣/י מָע֔וֹג כִּ֣י אִם מְלֹ֤א כַף קֶ֨מַח֙ בַּ/כַּ֔ד וּ/מְעַט שֶׁ֖מֶן בַּ/צַּפָּ֑חַת וְ/הִנְ/נִ֨י מְקֹשֶׁ֜שֶׁת שְׁנַ֣יִם עֵצִ֗ים וּ/בָ֨אתִי֙ וַ/עֲשִׂיתִ֨י/הוּ֙ לִ֣/י וְ/לִ/בְנִ֔/י וַ/אֲכַלְנֻ֖/הוּ וָ/מָֽתְנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/012.yaml
  text: And she said[a], “As Yahweh your God lives, I have no bread-cake, only a handful of flour in the jar and a little oil in the jug. And look, I am gathering two sticks, so that I may go in and prepare it for myself and for my son, and we may eat it and die.”
translation:
  language: sw
  text: Akasema, “Kama Yahwe, Mungu wako, aishivyo, sina mkate mdogo uliookwa[a], isipokuwa kiganja kimoja tu cha unga katika mtungi na mafuta kidogo katika chupa. Na tazama, ninaokota vijiti viwili ili niingie nikauandae kwa ajili yangu na mwanangu; kisha tule na tufe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sina mkate” au “sina mkate uliookwa.” Neno la Kiebrania מָעוֹג linamaanisha mkate mdogo, kwa kawaida wa umbo la duara.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: Kama Yahwe, Mungu wako, aishivyo
  rationale: Ni kiapo cha kawaida cha Kiebrania. Muundo huu unawasilisha uzito wa kiapo kwa Kiswahili cha asili huku ukihifadhi jina la Mungu, Yahwe, na kauli ya moja kwa moja ‘Mungu wako.’
- source_word: אִם יֶשׁ לִי מָעוֹג
  choice: sina mkate
  rationale: Katika muktadha wa kiapo, אִם inatoa ukanushaji wenye mkazo. מָעוֹג ni mkate mdogo uliookwa; ‘mkate’ ni usemi wa kawaida wa Kiswahili, huku maana mahsusi ikielezwa katika tanbihi.
- source_word: כִּי אִם מְלֹא כַף קֶמַח
  choice: nina konzi moja tu ya unga
  rationale: כִּי אִם ni kauli ya upekee, na מְלֹא כַף ni kiasi kinachoweza kushikwa katika kiganja. ‘Konzi moja tu’ huonyesha kwa asili kiasi kidogo sana.
- source_word: כַּד
  choice: gudulia
  rationale: Ni chombo cha nyumbani cha kuhifadhia unga; ‘gudulia’ linatofautisha chombo hiki na chombo kidogo cha mafuta.
- source_word: מְעַט שֶׁמֶן בַּצַּפָּחַת
  choice: mafuta kidogo katika chupa
  rationale: צַפַּחַת ni chombo kidogo cha kubebea au kuhifadhia kimiminika. ‘Chupa’ ni neno linaloeleweka kwa urahisi bila kudai umbo lisilothibitishwa.
- source_word: וְהִנְנִי
  choice: Tazama
  rationale: Huvuta fikira kwa tendo linaloendelea wakati huo; ‘Tazama’ ni kifupi, chenye hadhi, na kinadumisha nguvu ya neno la Kiebrania.
- source_word: מְקֹשֶׁשֶׁת שְׁנַיִם עֵצִים
  choice: ninaokota vijiti viwili
  rationale: Umbo la kitenzi linaonyesha tendo linaloendelea. Katika mazingira ya moto mdogo, עֵצִים hapa yanaeleweka kuwa vijiti, si magogo.
- source_word: וּבָאתִי וַעֲשִׂיתִיהוּ לִי וְלִבְנִי
  choice: ili niingie nikapike kwa ajili yangu na mwanangu
  rationale: ‘Niingie’ huhifadhi mwendo wa kuingia nyumbani, na ‘nikapike’ huwasilisha kwa kawaida tendo la kuandaa chakula kinachorejelewa na kiambishi cha Kiebrania.
- source_word: וַאֲכַלְנֻהוּ וָמָתְנוּ
  choice: tule, kisha tufe
  rationale: Huhifadhi mfuatano wa matendo na kauli ya kuhuzunisha kwamba chakula hicho cha mwisho kitafuatiwa na kifo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה katika kiapo cha mjane Msidoni
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Kauli וָמָתְנוּ kuhusu kifo kinachotarajiwa
  choice: kisha tufe
  alternative: halafu tutakufa
  rationale: Kauli tegemezi baada ya ‘tule’ inafaa kuhifadhiwa; ‘tufe’ huonyesha kusudi au matokeo yaliyotazamiwa bila kuamua zaidi uhusiano wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Konzi,’ ‘gudulia,’ na ‘vijiti’ huhifadhi picha ya uhaba; sentensi fupi ya mwisho inalinda uzito wa huzuni katika simulizi.
