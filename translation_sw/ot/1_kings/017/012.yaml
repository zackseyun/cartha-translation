  naturalness: Rasimu inaeleweka na kwa kiasi kikubwa ni Kiswahili Sanifu. Hata hivyo, “sina mkate; nina ...” inaweza kusikika kama taarifa mbili zisizounganishwa badala ya “sina ... isipokuwa ...,” na “nikapike kwa ajili yangu na mwanangu” haisemi wazi kwamba anaandaa chakula hicho kilichotajwa.
  terminology: “Yahwe” ni uhamishaji unaokubalika wa jina takatifu katika Kiswahili. “Kiganja kimoja cha unga” huwasilisha kwa usahihi zaidi מְלֹא כַף kuliko “konzi moja,” ambayo huelekea kumaanisha ngumi. “Mtungi” ni chombo cha kawaida kinachofaa kwa כַּד; “chupa” inaweza kubaki kwa צַפָּחַת.
