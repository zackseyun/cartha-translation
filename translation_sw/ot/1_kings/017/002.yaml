  text: 'Neno la Yahwe[a] likamjia, likisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH.” Jina hili kwa kawaida limetafsiriwa “BWANA” katika tafsiri nyingi.'
