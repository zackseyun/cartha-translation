lexical_decisions:
- source_word: וַיְהִי
  choice: likamjia
  rationale: Waw-consecutive pamoja na היה inaendeleza simulizi; katika Kiswahili, kiambishi -ka- katika “likamjia” huonyesha mfuatano wa tukio kwa njia ya kawaida bila tafsiri ngumu ya neno kwa neno.
- source_word: דְבַר
  choice: Neno
  rationale: Huhifadhi kauli maalumu ya kinabii “neno la Yahwe” na maana yake ya ufunuo, badala ya tafsiri fafanuzi zaidi kama “ujumbe.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni unukuzi wa jina la Mungu YHWH katika tahajia ya kawaida ya Kiswahili, badala ya kulibadilisha kwa cheo.
- source_word: אֵלָיו
  choice: -mjia
  rationale: 'Kiambishi cha mtendewa -m- katika “likamjia” huwasilisha kwa kawaida mwelekeo wa אֶל pamoja na kiambishi cha nafsi ya tatu: “likaja kwake.”'
- source_word: לֵאמֹר
  choice: likisema
  rationale: Hutanguliza maneno ya moja kwa moja na kudumisha muundo wa fomula ya Kiebrania kwa Kiswahili cha asili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni; “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kwa cheo, bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Likamjia” ni mtiririko wa kawaida wa kisimulizi; “likisema” huhifadhi utangulizi wa usemi wa moja kwa moja. Kiwakilishi “-m-” kinamrejelea Eliya kutokana na muktadha wa aya iliyotangulia.
