  text: And the ravens were bringing him bread and meat in the morning[a], and bread and meat in the evening, and he would drink from the wadi.
translation:
  language: sw
  text: Kunguru walikuwa wakimletea mkate na nyama asubuhi, na mkate na nyama jioni; naye alikuwa akinywa maji kutoka katika mkondo wa maji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wadi.” Neno la Kiebrania נַחַל humaanisha mkondo wa maji au bonde la maji, mara nyingi wenye maji ya msimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹרְבִים
  choice: Kunguru
  rationale: עֹרְבִים kwa kawaida humaanisha kunguru; tafsiri hii inadumisha maana ya moja kwa moja ya neno la Kiebrania.
- source_word: מְבִיאִים לוֹ
  choice: walikuwa wakimletea
  rationale: Muundo huu wa Kiswahili unaonyesha tendo lililoendelea au lililorudiwa na pia unawakilisha yambwa tendewa לוֹ kwa njia ya kawaida.
- source_word: לֶחֶם וּבָשָׂר
  choice: mkate na nyama
  rationale: Maneno mahususi ya Kiebrania yanadumishwa bila kuyapanua kuwa chakula kwa ujumla.
- source_word: בַּבֹּקֶר
  choice: asubuhi
  rationale: Hii ni njia ya kawaida na sahihi ya kueleza wakati huo kwa Kiswahili.
- source_word: וְלֶחֶם וּבָשָׂר בָּעָרֶב
  choice: na mkate na nyama jioni
  rationale: Marudio ya Kiebrania yamedumishwa ili kuhifadhi mkazo na mdundo wa utoaji wa chakula asubuhi na jioni.
- source_word: וּמִן הַנַּחַל
  choice: kutoka kwenye kijito
  rationale: נַחַל ni mkondo wa maji, ambao huenda ukawa wa msimu; 'kijito' ni neno la kawaida na linaloeleweka kwa wasomaji wa Kiswahili, huku tanbihi ikihifadhi upana wa maana.
- source_word: יִשְׁתֶּה
  choice: alikuwa akinywa
  rationale: Kauli hii huonyesha tendo la kawaida au lililorudiwa katika muktadha wa simulizi; 'alikuwa akinywa' huwasilisha hali hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Utambulisho wa עֹרְבִים waliomletea Eliya chakula
  choice: kunguru halisi
  alternative: Waarabu, wafanyabiashara, au watu wengine
  rationale: Maana ya kawaida ya עֹרְבִים ni 'kunguru,' na muktadha wa karibu haulazimishi neno hilo litafsiriwe kuwa watu ili kuondoa hali ya kimiujiza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya 'mkate na nyama' yamehifadhiwa. Kiunganishi cha mwanzo וְ hakijatafsiriwa kwa 'Na' kwa sababu aya hii inaweza kusomeka kwa kawaida kama sentensi inayojitegemea, bila kupoteza mwendelezo wa simulizi.
