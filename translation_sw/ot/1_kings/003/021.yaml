base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/021.yaml
  text: When I got up in the morning to nurse my son[a], behold, he was dead. But when I looked closely at him in the morning, behold, he was not my son[b], whom I had borne.
translation:
  language: sw
  text: Nilipoamka asubuhi ili nimnyonyeshe mwanangu, kumbe alikuwa amekufa. Lakini nilipomtazama kwa makini[a] asubuhi, kumbe hakuwa mwanangu niliyemzaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilipomchunguza kwa makini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקֻם
  choice: Nilipoamka
  rationale: Kitenzi hiki kinasimulia tendo la mwanamke kuamka; muundo wa ‘nilipo-’ unaonyesha kwa kawaida uhusiano wa wakati na kusudi linalofuata.
- source_word: בַּבֹּקֶר
  choice: asubuhi
  rationale: Ni usemi wa kawaida wa wakati. Umerudiwa mara zote mbili kama katika Kiebrania ili kuhifadhi mwendo wa simulizi.
- source_word: לְהֵינִיק
  choice: ili nimnyonyeshe
  rationale: Hiphil ya ינק hapa humaanisha kumpa mtoto maziwa ya mama. ‘Kumnyonyesha’ ni Kiswahili cha sasa, cha kawaida na sahihi.
- source_word: אֶת־בְּנִי
  choice: mwanangu
  rationale: בֵּן pamoja na kiambishi cha nafsi ya kwanza umoja humaanisha hasa ‘mwanangu’; muktadha unaonyesha mtoto wa kiume.
- source_word: וְהִנֵּה
  choice: kumbe
  rationale: Chembe hii huonyesha ugunduzi wa ghafla. ‘Kumbe’ huhifadhi mshangao wa simulizi kwa Kiswahili cha asili, na imerudiwa mara zote mbili.
- source_word: מֵת
  choice: alikuwa amekufa
  rationale: Hueleza hali ya mtoto aliyoikuta mwanamke alipoamka. Kauli hii ni wazi na ya kawaida kwa Kiswahili.
- source_word: וָאֶתְבּוֹנֵן אֵלָיו
  choice: nilipomtazama kwa makini
  rationale: Umbo la kitenzi huonyesha kumwangalia au kumchunguza kwa uangalifu ili kutambua hali halisi.
- source_word: לֹא הָיָה בְנִי
  choice: hakuwa mwanangu
  rationale: Hufuata moja kwa moja maana ya Kiebrania na humrejelea mtoto kama mtu.
- source_word: אֲשֶׁר יָלָדְתִּי
  choice: niliyemzaa
  rationale: Kitenzi ילד katika nafsi ya kwanza humaanisha kumzaa mtoto. Tafsiri hii ni fupi, ya kawaida, na inahifadhi kauli ya mama mwenyewe.
