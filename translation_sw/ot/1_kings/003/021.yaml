  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Kurudiwa kwa ‘asubuhi’ na ‘kumbe’ kunahifadhi msisitizo na hatua za ugunduzi katika Kiebrania.
