id: 1KI.3.12
reference: 1 Kings 3:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הִנֵּ֥ה עָשִׂ֖יתִי כִּ/דְבָרֶ֑י/ךָ הִנֵּ֣ה נָתַ֣תִּי לְ/ךָ֗ לֵ֚ב חָכָ֣ם וְ/נָב֔וֹן אֲשֶׁ֤ר כָּמ֨וֹ/ךָ֙ לֹא הָיָ֣ה לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹא יָק֥וּם כָּמֽוֹ/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/012.yaml
  text: Behold[a], I have done according to your words. Behold, I have given you a wise and discerning heart, such that no one like you has been before you, and no one like you shall arise after you.
translation:
  language: sw
  text: Tazama, nimefanya sawasawa na maneno yako. Tazama, nimekupa moyo wenye hekima na utambuzi[a], kiasi kwamba kabla yako hakujawahi kuwa na mtu kama wewe, wala baada yako hatatokea mtu kama wewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moyo wenye hekima na ufahamu.” Katika Kiebrania, “moyo” unahusisha uwezo wa ndani wa kufikiri, kuhukumu na kutambua, wala si hisia pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Imehifadhiwa kama neno la kuvuta fikira na kusisitiza tangazo la Mungu; ni la sasa, lenye heshima, na la kawaida katika lugha ya Biblia ya Kiswahili.
- source_word: עָשִׂיתִי כִּדְבָרֶיךָ
  choice: nimefanya sawasawa na maneno yako
  rationale: Kauli hii huhifadhi kitenzi cha tendo lililotimizwa na maana halisi ya 'maneno yako,' bila kubadili moja kwa moja kuwa 'ombi lako.'
- source_word: נָתַתִּי לְךָ
  choice: nimekupa
  rationale: Huwakilisha kwa kawaida tendo la kutoa ambalo limekamilishwa katika kauli ya Mungu.
- source_word: לֵב חָכָם וְנָבוֹן
  choice: moyo wenye hekima na utambuzi
  rationale: Neno 'moyo' limehifadhiwa kwa sababu katika Kiebrania linahusisha fikira, hukumu, nia, na hisia. 'Utambuzi' hutofautisha נבון na 'hekima' huku likifaa katika muktadha wa kufanya maamuzi.
- source_word: אֲשֶׁר כָּמוֹךָ לֹא הָיָה לְפָנֶיךָ
  choice: kiasi kwamba kabla yako hakujawahi kuwa na mtu kama wewe
  rationale: '''Kiasi kwamba'' huonyesha matokeo au sifa ya kipawa, si kusudi. Muundo wa Kiswahili ni wa asili na huhifadhi dai la kutokuwapo kwa mtu wa kulinganishwa naye hapo kabla.'
- source_word: וְאַחֲרֶיךָ לֹא יָקוּם כָּמוֹךָ
  choice: wala baada yako hatatokea mtu kama wewe
  rationale: Katika muktadha huu קום ina maana ya kutokea au kujitokeza katika historia; 'hatatokea' ni Kiswahili cha asili kuliko tafsiri halisi ya 'hatasimama.'
theological_decisions:
- issue: Upeo wa kutolinganishwa kwa Sulemani
  choice: Ulinganisho umeachwa ukifuatia moja kwa moja kipawa cha moyo wenye hekima na utambuzi.
  alternative: Kuelewa kauli hiyo kuwa Sulemani atakuwa mkuu kuliko watu wote katika kila jambo.
  rationale: Muktadha wa karibu unahusu hekima na utambuzi aliopewa kwa ajili ya kutawala na kuhukumu. Tafsiri haipanui dai hilo zaidi ya kile kifungu kinachosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “Tazama” yamehifadhiwa kwa msisitizo wa usemi wa Mungu; 'kiasi kwamba' huepuka kuifanya sentensi ionekane kueleza kusudi.
