base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/010.yaml
  text: And the matter was good in the eyes of the Lord[a], because Solomon had asked this thing.
translation:
  language: sw
  text: Jambo hilo lilikuwa jema machoni pa Bwana[a], kwa sababu Sulemani alikuwa ameomba jambo hili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jambo hilo lilimpendeza Bwana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב
  choice: lilikuwa jema
  rationale: Huhifadhi tathmini ya kitenzi יטב kwa Kiswahili cha kawaida bila kuibadili moja kwa moja kuwa hisia ya 'kupendeza'.
- source_word: הַדָּבָר
  choice: jambo hilo
  rationale: דבר ni neno pana linaloweza kumaanisha jambo au kitu; 'jambo hilo' linaelekeza kwa ombi la Sulemani bila kulifafanua kupita chanzo.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Huhifadhi sitiari ya Kiebrania ya tathmini kwa namna inayoeleweka na iliyozoeleka katika Kiswahili cha kibiblia.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Chanzo kina אֲדֹנָי, si יהוה; kwa hiyo 'Bwana' ni tafsiri ya moja kwa moja ya cheo hiki.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inaleta sababu ya jambo hilo kuwa jema machoni pa Bwana.
- source_word: שָׁאַל
  choice: alikuwa ameomba
  rationale: Kitenzi kina maana ya kuomba au kuomba apewe; wakati timilifu wa Kiswahili unaonyesha kuwa ombi lilitangulia tathmini katika mtiririko wa simulizi.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: jambo hilo
  rationale: Huhifadhi kirai kamili cha yambwa pamoja na kiashiria chake, badala ya kukifupisha.
theological_decisions:
- issue: Tafsiri ya cheo cha Mungu אֲדֹנָי
  choice: Bwana
  alternative: BWANA
  rationale: Maandishi ya chanzo yanatumia אֲדֹנָי na si jina יהוה; hivyo 'Bwana' linatofautisha cheo hiki na desturi ya kutumia 'BWANA' kwa tetragramatoni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Nahau 'machoni pa' imehifadhiwa kwa kuwa ni wazi katika muktadha, huku tanbihi ikitoa tafsiri ya maana iliyo laini zaidi.
