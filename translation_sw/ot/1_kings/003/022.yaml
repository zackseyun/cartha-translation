base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/022.yaml
  text: But the other woman said[a], “No! My son is the living one, and your son is the dead one.” And this one said, “No! Your son is the dead one, and my son is the living one.” So they spoke before the king.
translation:
  language: sw
  text: Lakini yule mwanamke mwingine akasema[a], “Hapana! Mwanangu ndiye aliye hai, na mwanao ndiye aliyekufa.” Naye huyu akasema, “Hapana! Mwanao ndiye aliyekufa, na mwanangu ndiye aliye hai.” Hivyo walisema mbele ya mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa lugha ya moja kwa moja zaidi, “Mwanangu yuko hai, na mwanao amekufa ... mwanao amekufa, na mwanangu yuko hai.” Maandishi makuu yanahifadhi utofautishaji wa Kiebrania kati ya “aliye hai” na “aliyekufa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: akasema
  rationale: Kitenzi cha kawaida cha masimulizi ya usemi; “akasema” ni cha asili katika Kiswahili na kinaendeleza mfuatano wa simulizi.
- source_word: הָאִשָּׁה הָאַחֶרֶת
  choice: yule mwanamke mwingine
  rationale: Hurejelea mwanamke wa pili katika mgogoro; “mwanamke” huepuka kuingiza maana ya mke ambayo muktadha hauhitaji.
- source_word: לֹא כִי
  choice: Hapana!
  rationale: Muungano huu unaonyesha kukataa kwa nguvu; alama ya mshangao inawasilisha ukali wa kupingana kwao.
- source_word: בְּנִי הַחַי
  choice: Mwanangu ndiye aliye hai
  rationale: Muundo wa “ndiye aliye hai” unahifadhi utofautishaji wa Kiebrania kati ya mtoto aliye hai na aliyekufa, huku ukiwa wa kawaida katika Kiswahili.
- source_word: וּבְנֵךְ הַמֵּת
  choice: na mwanao ndiye aliyekufa
  rationale: “Ndiye aliyekufa” huakisi mtoto mahususi anayelinganishwa na aliye hai na ni wa asili kuliko tafsiri kavu ya “yule mfu.”
- source_word: וְזֹאת אֹמֶרֶת
  choice: Naye huyu akasema
  rationale: “Huyu” huhifadhi nguvu ya kiashiria cha kike זֹאת; “naye” huanzisha dai linalopingana kwa Kiswahili fasaha.
- source_word: הֶחָי
  choice: aliye hai
  rationale: Huhifadhi kwa uthabiti ulinganisho wa aliye hai dhidi ya aliyekufa.
- source_word: וַתְּדַבֵּרְנָה
  choice: Hivyo wakabishana
  rationale: Ingawa kimsingi ni “wakasema/wakanena,” muktadha na kauli zao zinazopingana zinaonyesha mabishano; “wakabishana” hutoa muhtasari wa asili wa tukio bila kuongeza jambo lisilokuwamo.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: mbele ya mfalme
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kuwa katika uwepo wa mfalme; haiongezi jina la Sulemani ambalo halipo katika mstari.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “ndiye aliye hai/aliyekufa” unadumisha msisitizo na ulinganifu wa chanzo. “Wakabishana” ni uwasilishaji wa kimuktadha wa usemi wa pande mbili mbele ya mfalme.
