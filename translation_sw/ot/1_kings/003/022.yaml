    text: Au, kwa lugha ya moja kwa moja zaidi, “Mwanangu yuko hai, na mwanao amekufa ... mwanao amekufa, na mwanangu yuko hai.” Maandishi makuu yanahifadhi utofautishaji wa Kiebrania kati ya “aliye hai” na “aliyekufa.”
    reason: lexical_alternative
  revision_rationale: 'Only the final narrative verb is revised: ‘walisema’ directly represents the plural Hebrew verb for speaking and avoids adding an explicit sense of arguing. All other wording faithfully and naturally retains the alternating, emphatic claims and the Hebrew contrast.'
