  text: וְ/גַ֨ם אֲשֶׁ֤ר לֹֽא שָׁאַ֨לְתָּ֙ נָתַ֣תִּי לָ֔/ךְ גַּם עֹ֖שֶׁר גַּם כָּב֑וֹד אֲ֠שֶׁר לֹא הָיָ֨ה כָמ֥וֹ/ךָ אִ֛ישׁ בַּ/מְּלָכִ֖ים כָּל יָמֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/013.yaml
  text: And I have also given you what you did not ask for[a], both riches and honor, so that there has been no man like you among the kings all your days.
translation:
  language: sw
  text: 'Nami pia nimekupa yale ambayo hukuyaomba: utajiri na heshima, hivi kwamba hajawahi kuwapo mtu kama wewe miongoni mwa wafalme katika siku zako zote.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hivi kwamba katika siku zako zote hakutakuwa na mtu kama wewe miongoni mwa wafalme.”
    reason: Muktadha wa ahadi unaweza kufanya kauli timilifu ya Kiebrania ieleweke kuwa na athari ya wakati ujao.
lexical_decisions:
- source_word: וְגַם
  choice: Nami pia
  rationale: Muunganiko huu unaendeleza maneno ya Mungu na kuonyesha kuwa zawadi nyingine zinaongezwa juu ya kile ambacho Sulemani aliomba.
- source_word: אֲשֶׁר לֹא שָׁאַלְתָּ
  choice: yale ambayo hukuyaomba
  rationale: Hii ni njia ya kawaida na ya wazi ya Kiswahili ya kueleza kitu ambacho Sulemani hakumwomba Mungu.
- source_word: נָתַתִּי לָךְ
  choice: nimekupa
  rationale: Kauli timilifu ya Kiebrania inaonyesha utoaji uliothibitishwa wenye matokeo ya sasa; wakati timilifu wa Kiswahili unafaa katika kauli hii ya Mungu.
- source_word: גַּם עֹשֶׁר גַּם כָּבוֹד
  choice: utajiri na heshima
  rationale: Kurudiwa kwa גַּם kunaunganisha zawadi mbili. עֹשֶׁר ni utajiri, na כָּבוֹד hapa ni heshima au hadhi ya kifalme kuliko utukufu wa kimungu.
- source_word: אֲשֶׁר לֹא הָיָה כָמוֹךָ אִישׁ
  choice: hivi kwamba ... hakutakuwa na mtu kama wewe
  rationale: ‘Hivi kwamba’ linaonyesha matokeo ya zawadi hizo. Ingawa kitenzi cha Kiebrania kina umbo timilifu, muktadha wa ahadi na kirai ‘siku zako zote’ unaelekeza kwenye matokeo yatakayoendelea katika maisha ya Sulemani.
- source_word: בַּמְּלָכִים
  choice: miongoni mwa wafalme
  rationale: Kihusishi hiki kinaweka ulinganisho ndani ya kundi la wafalme.
- source_word: כָּל יָמֶיךָ
  choice: katika siku zako zote
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania huku ikiwa wazi kwa msomaji wa Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya wakati katika לֹא הָיָה pamoja na כָּל יָמֶיךָ
  choice: hakutakuwa na mtu kama wewe ... katika siku zako zote
  alternative: hajawahi kuwapo mtu kama wewe ... katika siku zako zote
  rationale: Ahadi inahusu maisha ya Sulemani kuanzia wakati huo na kuendelea, kwa hiyo wakati ujao unafikisha maana ya muktadha. Tanbihi inadumisha uwezekano wa kusoma umbo timilifu kwa karibu zaidi.
- issue: Kutafsiri אִישׁ katika ulinganisho
  choice: mtu
  alternative: mwanamume
  rationale: Katika sentensi hii אִישׁ inafanya kazi kama nomino isiyobainisha mtu mmoja katika kundi la wafalme. ‘Mtu’ ni Kiswahili cha kawaida na haibadili ulinganisho kuwa ‘mfalme,’ ambao ungetegemea zaidi kirai kinachofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa sasa, na unaosomeka kwa urahisi. ‘Hivi kwamba’ limechaguliwa ili kuonyesha matokeo bila kulifanya kuwa kusudi pekee. Alama ya tanbihi imewekwa baada ya dai linalohusika.
