source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהָ֔/י אַתָּה֙ הִמְלַ֣כְתָּ אֶֽת עַבְדְּ/ךָ֔ תַּ֖חַת דָּוִ֣ד אָבִ֑/י וְ/אָֽנֹכִי֙ נַ֣עַר קָטֹ֔ן לֹ֥א אֵדַ֖ע צֵ֥את וָ/בֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/007.yaml
  text: And now[a], O Yahweh my God, you have made your servant king in place of David my father, though I am a little child[b]; I do not know how to go out or come in.
translation:
  language: sw
  text: Na sasa, Ee Yahweh, Mungu wangu, wewe umemfanya mtumishi wako kuwa mfalme badala ya Daudi, baba yangu. Lakini mimi ni kijana mdogo tu[a]; sijui jinsi ya kutoka na kuingia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtoto mdogo.” Neno la Kiebrania linaweza kumaanisha mtoto au kijana; hapa ni maelezo ya unyenyekevu yanayosisitiza ujana na kutokuwa na uzoefu.
    reason: lexical_alternative
  - marker: b
    text: “Kutoka na kuingia” ni nahau ya Kiebrania inayomaanisha kutekeleza wajibu wa mtu, hasa wajibu wa uongozi wa hadhara.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi וְ pamoja na maana ya mpito ya עַתָּה kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יְהוָה אֱלֹהָי
  choice: Ee Yahweh Mungu wangu
  rationale: Jina la agano יְהוָה limetoholewa kuwa “Yahweh,” na אֱלֹהָי limetafsiriwa moja kwa moja kuwa “Mungu wangu”; “Ee” huonyesha mwito wa moja kwa moja kwa njia ya asili katika Kiswahili.
- source_word: הִמְלַכְתָּ אֶת־עַבְדְּךָ
  choice: wewe umemfanya mtumishi wako kuwa mfalme
  rationale: Muundo wa kusababisha wa מלך umehifadhiwa kwa “umemfanya ... kuwa mfalme,” huku עַבְדְּךָ ikitafsiriwa “mtumishi wako,” linalofaa katika sala ya unyenyekevu mbele za Mungu.
- source_word: תַּחַת דָּוִד אָבִי
  choice: mahali pa Daudi baba yangu
  rationale: 'תַּחַת hapa huonyesha urithi wa kiti cha enzi: Sulemani amekuwa mfalme mahali pa Daudi, baba yake.'
- source_word: נַעַר קָטֹן
  choice: kijana mdogo tu
  rationale: Kauli hii ya kujishusha inaonyesha ujana na kutokuwa na uzoefu bila kulazimisha umri hususa; “tu” huwasilisha msisitizo wa unyenyekevu wa msemaji.
- source_word: לֹא אֵדַע
  choice: sijui
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi, na kirai kinachofuata kinaonyesha jambo asilolijua kufanya.
- source_word: צֵאת וָבֹא
  choice: kutoka wala kuingia
  rationale: Taswira halisi ya nahau ya Kiebrania imehifadhiwa; “wala” ni muunganiko wa asili katika sentensi hasi ya Kiswahili, huku maana yake ya kutekeleza wajibu wa uongozi ikifafanuliwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina lenye herufi nne moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya נַעַר קָטֹן katika kujieleza kwa Sulemani
  choice: kijana mdogo tu, pamoja na tanbihi
  alternative: mtoto mdogo
  rationale: נַעַר inaweza kumaanisha mtoto, kijana, au kijana mtumishi. Tafsiri hii huhifadhi msisitizo wa ujana na kutokuwa na uzoefu bila kudai kwamba Sulemani alikuwa mtoto mdogo kihalisi.
- issue: Nahau צֵאת וָבֹא
  choice: kuhifadhi taswira ya “kutoka wala kuingia” katika matini kuu
  alternative: sijui jinsi ya kuongoza au kutekeleza wajibu wangu
  rationale: Kiebrania hakisemi “kuongoza” moja kwa moja. Matini kuu huhifadhi nahau na tanbihi hueleza matumizi yake kuhusu utekelezaji wa wajibu, hasa wa uongozi wa hadhara.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi bila kupoteza uhusiano wa mawazo. “Wewe” imehifadhiwa kwa msisitizo uliopo katika kiwakilishi cha Kiebrania אַתָּה. Nahau ya mwisho imeachwa katika umbo lake la picha na kufafanuliwa kwa tanbihi.
