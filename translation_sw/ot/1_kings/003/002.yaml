base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/002.yaml
  text: Only the people were sacrificing at the high places[a], because no house had yet been built for the name of Yahweh in those days.
translation:
  language: sw
  text: Hata hivyo, watu walikuwa wakitoa dhabihu mahali pa juu[a], kwa sababu nyumba kwa ajili ya jina la Yahwe ilikuwa bado haijajengwa wakati huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu”; Kiebrania, “nyumba.” Usemi “kwa ajili ya jina la Yahwe” unarejelea hekalu litakalojengwa Yerusalemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Hata hivyo
  rationale: Hapa neno hili linaweka mpaka au tahadhari juu ya tathmini iliyotangulia kuhusu Sulemani; “Hata hivyo” huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: הָעָם
  choice: watu
  rationale: Neno עַם linawarejelea watu kwa ujumla, bila kulazimisha tofauti ya kitaalamu kati yao na viongozi.
- source_word: מְזַבְּחִים
  choice: walikuwa wakitoa dhabihu
  rationale: Umbo la kishiriki linaonyesha tendo lililoendelea au lililokuwa desturi; muundo huu unahifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: בַּבָּמוֹת
  choice: mahali pa juu
  rationale: במות ni maeneo ya ibada, mara nyingi yaliyoinuka; “mahali pa juu” ni tafsiri ya kawaida inayohifadhi taswira ya Kiebrania bila kuongeza hukumu juu ya uhalali wake.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya watu kutoa dhabihu mahali pa juu.
- source_word: לֹא נִבְנָה בַיִת
  choice: nyumba ilikuwa bado haijajengwa
  rationale: Kitenzi cha kutendwa kinaonyesha kwamba hadi wakati huo nyumba haikuwa imejengwa. “Nyumba” huhifadhi neno halisi בַיִת, huku tanbihi ikifafanua maana ya hekalu.
- source_word: לְשֵׁם יְהוָה
  choice: kwa ajili ya jina la Yahwe
  rationale: Tafsiri hii inahifadhi usemi muhimu wa kiteolojia kuhusu nyumba iliyojengwa kwa ajili ya jina la Mungu, badala ya kuufupisha kuwa tu “kwa ajili ya Yahwe.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa kama jina maalumu, kwa mwandiko unaotumika kwa kawaida katika Kiswahili.
- source_word: עַד הַיָּמִים הָהֵם
  choice: hadi siku hizo
  rationale: Hii inafuata usemi wa wakati wa Kiebrania kwa njia inayoeleweka na kuonyesha kwamba hali hiyo iliendelea mpaka kipindi kinachozungumziwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu la herufi nne; “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Ikiwa בַיִת itafsiriwe “nyumba” au “hekalu”
  choice: nyumba katika matini, ikiwa na ufafanuzi katika tanbihi
  alternative: hekalu
  rationale: Neno la Kiebrania ni “nyumba,” na usemi “kwa ajili ya jina la Yahwe” unaonyesha kuwa ni hekalu. Hivyo matini inahifadhi neno la chanzo huku tanbihi ikihakikisha maana iko wazi.
- issue: Tathmini ya maeneo ya juu ya ibada
  choice: kutoyaita moja kwa moja maeneo haramu
  alternative: maeneo haramu ya ibada
  rationale: Aya hii inaeleza sababu ya matumizi yake—hekalu lilikuwa bado halijajengwa—bila kutamka hapa hukumu kamili juu yake; tafsiri haipaswi kuongeza hukumu isiyotajwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “walikuwa wakitoa dhabihu” unaonyesha tendo la kawaida au linaloendelea; “hadi siku hizo” huhifadhi usemi wa wakati wa chanzo.
