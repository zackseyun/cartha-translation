  text: וַ/יִּתְחַתֵּ֣ן שְׁלֹמֹ֔ה אֶת פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וַ/יִּקַּ֣ח אֶת בַּת פַּרְעֹ֗ה וַ/יְבִיאֶ֨/הָ֙ אֶל עִ֣יר דָּוִ֔ד עַ֣ד כַּלֹּת֗/וֹ לִ/בְנ֤וֹת אֶת בֵּית/וֹ֙ וְ/אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת חוֹמַ֥ת יְרוּשָׁלִַ֖ם סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/001.yaml
  text: Solomon formed a marriage alliance with Pharaoh king of Egypt[a], and he took Pharaoh’s daughter and brought her into the city of David until he had finished building his own house, and the house of Yahweh[b], and the wall around Jerusalem.
translation:
  language: sw
  text: Solomoni akafanya muungano wa ndoa na Farao, mfalme wa Misri.[a] Akamwoa binti ya Farao, akamleta katika Mji wa Daudi mpaka alipomaliza kujenga nyumba yake, nyumba ya Yahwe,[b] na ukuta unaozunguka Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawa jamaa ya Farao kwa njia ya ndoa.” Kitenzi cha Kiebrania kinakazia kuingia katika uhusiano wa kindoa; hapa huenda pia kinadokeza muungano wa kisiasa.
    reason: lexical_alternative
  - marker: b
    text: Au, “hekalu la Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַתֵּן
  choice: akafanya muungano wa ndoa na
  rationale: Kauli ya Kiebrania inaonyesha kuingia katika uhusiano wa kindoa; katika muktadha wa kifalme pia ina vidokezo vya muungano wa kisiasa. Usemi huu unahifadhi pande zote mbili.
- source_word: אֶת פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: na Farao, mfalme wa Misri
  rationale: Muundo huu unamtambulisha Farao kwa cheo chake; koma inaleta Kiswahili cha kawaida na wazi.
- source_word: וַיִּקַּח אֶת בַּת פַּרְעֹה
  choice: Akamwoa binti ya Farao
  rationale: Kitenzi לקח pamoja na mwanamke kama yambwa ni nahau ya kumchukua kuwa mke. Kiswahili cha moja kwa moja 'akamchukua' kingeweza kuficha maana hiyo, hivyo 'akamwoa' kinaifanya iwe wazi.
- source_word: וַיְבִיאֶהָ אֶל עִיר דָּוִד
  choice: akamleta katika Jiji la Daudi
  rationale: Kitenzi kina maana ya kumleta, na kihusishi kinaonyesha kuingia mahali. 'Katika' kinafaa kwa kuletwa ndani ya eneo la makazi.
- source_word: עַד כַּלֹּתוֹ לִבְנוֹת
  choice: mpaka alipomaliza kujenga
  rationale: עַד huonyesha kikomo cha muda, na muundo wa Kiswahili 'alipomaliza kujenga' ni wa kawaida na huhifadhi uhusiano huo wa wakati.
- source_word: אֶת בֵּיתוֹ
  choice: nyumba yake mwenyewe
  rationale: בית kimsingi ni 'nyumba'; katika muktadha huu huenda ni jumba la kifalme, lakini 'nyumba yake mwenyewe' haifafanui kupita chanzo na huitofautisha na nyumba ya Yahwe.
- source_word: וְאֶת בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Tafsiri ya karibu ya בית יהוה ni 'nyumba ya Yahwe.' Neno 'nyumba' linahifadhi taswira ya chanzo, ingawa hapa linamaanisha hekalu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetolewa kama jina binafsi 'Yahwe' badala ya kubadilishwa kuwa cheo.
- source_word: וְאֶת חוֹמַת יְרוּשָׁלִַם סָבִיב
  choice: na ukuta unaozunguka Yerusalemu
  rationale: חוֹמָה ni ukuta wa ulinzi katika umoja, na סָבִיב huonyesha kwamba ulizunguka jiji.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu. 'Yahwe' hulihifadhi jina hilo badala ya kuliwakilisha kwa cheo 'BWANA'.
- issue: Maana ya בֵּית יְהוָה
  choice: nyumba ya Yahwe
  alternative: hekalu la Yahwe
  rationale: Neno la chanzo ni 'nyumba.' Tafsiri hiyo imehifadhiwa katika matini, huku tanbihi ikieleza maana yake ya kiutendaji hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya utambulisho wa Farao ili kupunguza uzito bila kupoteza mfuatano wa masimulizi ya Kiebrania. 'Jiji la Daudi' limetumiwa kama jina maalumu la mahali.
