  yaml_path: translation/ot/1_kings/003/008.yaml
  text: And your servant is in the midst of your people whom you have chosen[a], a great people[b], too numerous to be counted or numbered.
translation:
  language: sw
  text: Na mtumishi wako yuko katikati ya watu wako uliowachagua, watu wengi sana[a] wasioweza kuhesabiwa wala kuorodheshwa kwa sababu ya wingi wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wengi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַבְדְּךָ
  choice: Na mtumishi wako
  rationale: Katika sala ya heshima ya Sulemani kwa Mungu, “mtumishi” ni la kawaida na lenye staha, huku likidumisha uhusiano wa unyenyekevu na utegemezi.
- source_word: בְּתוֹךְ
  choice: yuko katikati ya
  rationale: Huhifadhi maana ya kuwa miongoni mwa watu kwa lugha ya kawaida na yenye heshima.
- source_word: עַמְּךָ אֲשֶׁר בָּחָרְתָּ
  choice: watu wako uliowachagua
  rationale: Hutafsiri moja kwa moja umiliki wa Mungu na tendo lake la kuwachagua watu hao.
- source_word: עַם רָב
  choice: watu wengi sana
  rationale: Katika muktadha huu רָב inaelekeza hasa kwenye wingi wa idadi, kama kifungu kinachofuata kinavyothibitisha; Kiswahili hiki ni cha asili na wazi.
- source_word: לֹא יִמָּנֶה וְלֹא יִסָּפֵר
  choice: wasioweza kuhesabiwa wala kuorodheshwa
  rationale: Huhifadhi ulinganifu wa vitenzi viwili vya Kiebrania vinavyohusu kuhesabu au kufanya sensa, bila kuvifanya neno moja.
- source_word: מֵרֹב
  choice: kwa sababu ya wingi wao
  rationale: 'Hutoa wazi maana ya kisababishi: hawawezi kuhesabiwa kwa sababu ya wingi wao.'
theological_decisions:
- issue: Hadhi ya Israeli kuwa watu wa Mungu waliochaguliwa
  choice: watu wako uliowachagua
  alternative: watu wako
  rationale: Kiebrania hutaja wazi kwamba Mungu aliwachagua watu hao; tafsiri inadumisha lugha hiyo ya agano bila kuongeza madai ya kiteolojia ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Watu wengi sana” huwasilisha maana ya idadi ya עַם רָב; tanbihi huhifadhi uwezekano wa maana pana ya “wakubwa.”
