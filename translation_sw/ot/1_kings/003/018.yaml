base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/018.yaml
  text: And on the third day after I gave birth[a], this woman also gave birth. And we were together; there was no stranger with us in the house, only the two of us were in the house.
translation:
  language: sw
  text: Ikawa, siku ya tatu baada ya kujifungua kwangu, mwanamke huyu naye akajifungua. Tulikuwa pamoja; hakukuwa na mtu mgeni[a] pamoja nasi ndani ya nyumba. Tulikuwa sisi wawili tu ndani ya nyumba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu asiye wa familia au wa nyumba hiyo.” Neno la Kiebrania linaweza kumaanisha mtu ambaye si wa kundi au wa nyumba hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutanguliza tukio linalofuata katika mtiririko wa simulizi kwa lugha ya kawaida lakini yenye hadhi.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי לְלִדְתִּי
  choice: siku ya tatu baada ya mimi kujifungua
  rationale: Muundo wa לְ pamoja na kitenzi-jina na kiambishi cha nafsi unaonyesha uhusiano wa wakati; tafsiri hii inaweka wazi kwamba kuzaa kwa msemaji ndiko kunakotumiwa kama mwanzo wa kuhesabu.
- source_word: וַתֵּלֶד גַּם הָאִשָּׁה הַזֹּאת
  choice: mwanamke huyu naye akajifungua
  rationale: “Huyu” huhifadhi rejeleo lenye kusisitiza la הַזֹּאת, na “naye” huwasilisha גַּם kwa Kiswahili cha asili.
- source_word: וַאֲנַחְנוּ יַחְדָּו
  choice: Tulikuwa pamoja
  rationale: Huhifadhi maana ya moja kwa moja ya יַחְדָּו bila kuingiza mapema wazo la kuwa peke yao, ambalo linaelezwa na sentensi inayofuata.
- source_word: אֵין זָר אִתָּנוּ בַּבַּיִת
  choice: hakukuwa na mtu mgeni pamoja nasi ndani ya nyumba
  rationale: זָר humaanisha mtu asiye wa kundi au nyumba hiyo. “Mtu mgeni” huhifadhi nguvu ya neno la Kiebrania, huku tanbihi ikionyesha uwezekano wa “mtu wa nje.”
- source_word: זוּלָתִי שְׁתַּיִם אֲנַחְנוּ
  choice: Tulikuwa sisi wawili tu
  rationale: Huwasilisha kwa Kiswahili fasaha msisitizo wa kwamba wanawake hao wawili ndio pekee waliokuwamo.
- source_word: בַּבָּיִת
  choice: ndani ya nyumba
  rationale: Marudio ya mahali katika Kiebrania yamehifadhiwa kwa sababu yanasisitiza kutokuwapo kwa shahidi mwingine.
