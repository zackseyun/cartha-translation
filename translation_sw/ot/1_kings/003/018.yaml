translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa, na wenye hadhi. Marudio ya “ndani ya nyumba” yamehifadhiwa kwa ajili ya msisitizo wa ushahidi uliomo katika chanzo.
