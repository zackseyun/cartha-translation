  text: Then two women who were prostitutes came to the king and stood before him[a].
translation:
  language: sw
  text: Ndipo wanawake wawili waliokuwa makahaba wakaja kwa mfalme, wakasimama mbele yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa ufupi, “makahaba wawili wakaja kwa mfalme, wakasimama mbele yake.” Neno la Kiebrania זֹנוֹת linaweza kutafsiriwa moja kwa moja kuwa “makahaba” au kwa ufafanuzi zaidi kuwa “wanawake waliokuwa makahaba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Ni kiashiria cha wakati kinachoanzisha tukio linalofuata; “Ndipo” huhifadhi mtiririko wa simulizi kwa Kiswahili cha kawaida.
- source_word: תָּבֹאנָה
  choice: wakaja
  rationale: Kitenzi hiki katika muktadha wa simulizi kinaeleza kuja kwao kwa mfalme; “wakaja” ni cha asili na huhifadhi mwelekeo huo.
- source_word: שְׁתַּיִם נָשִׁים
  choice: wanawake wawili
  rationale: Huu ni uwasilishaji wa moja kwa moja wa namba pamoja na nomino kwa mpangilio wa kawaida wa Kiswahili.
- source_word: זֹנוֹת
  choice: waliokuwa makahaba
  rationale: Umbo hili linawafafanua wanawake hao. Kishazi “waliokuwa makahaba” ni cha asili kwa Kiswahili na kinaweka wazi maana bila kutumia lugha ya kizamani.
- source_word: אֶל הַמֶּלֶךְ
  choice: kwa mfalme
  rationale: Kihusishi kinaonyesha mwendo kuelekea kwa mfalme; “kwa mfalme” ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: וַתַּעֲמֹדְנָה
  choice: wakasimama
  rationale: Kitenzi kinaendeleza mfululizo wa simulizi. “Wakasimama” huhifadhi tendo lenyewe bila kuongeza wazo la kujitambulisha au la shauri la mahakamani.
- source_word: לְפָנָיו
  choice: mbele yake
  rationale: Ni nahau ya kawaida ya kuwapo mbele ya mwenye mamlaka; tafsiri hii ni fupi, wazi, na ya asili.
