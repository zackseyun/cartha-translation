base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/003.yaml
  text: Solomon loved Yahweh[a], walking in the statutes of David his father; only[b], he was sacrificing and burning incense at the high places.
translation:
  language: sw
  text: Sulemani alimpenda Yahwe, akifuata sheria za Daudi, baba yake. Isipokuwa tu kwamba[a] alikuwa akitoa dhabihu na kufukiza uvumba katika mahali pa juu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini alikuwa akitoa dhabihu na kufukiza uvumba katika mahali pa juu.”
    reason: alternative_reading
  - marker: b
    text: “Mahali pa juu” ni sehemu za ibada za mahali palipoinuka.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: alimpenda
  rationale: Kitenzi אהב kinaonyesha upendo wa kweli; “alimpenda” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa namna inayotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: לָלֶכֶת
  choice: akiishi kwa kufuata
  rationale: Nahau ya Kiebrania ya “kutembea” inaeleza mwenendo wa kudumu. “Akiishi kwa kufuata” inawasilisha maana hiyo kwa Kiswahili cha kawaida bila kupoteza uhusiano wake na upendo wa Sulemani.
- source_word: בְּחֻקּוֹת
  choice: masharti
  rationale: חֻקּוֹת hurejelea maagizo au kanuni zilizowekwa. “Masharti” huhifadhi maana ya mambo yanayopasa kufuatwa na inafaa katika sentensi hii.
- source_word: דָּוִד אָבִיו
  choice: ya Daudi baba yake
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unaonyesha wazi kwamba Daudi alikuwa baba yake Sulemani.
- source_word: רַק
  choice: Hata hivyo
  rationale: רַק hapa inaweka mpaka juu ya sifa chanya iliyotangulia. “Hata hivyo” huonyesha tofauti hiyo bila kuifanya kuwa shutuma kali kuliko ilivyo katika chanzo.
- source_word: בַּבָּמוֹת
  choice: katika mahali pa juu
  rationale: בָּמוֹת ni maeneo ya ibada yaliyojulikana kama “mahali pa juu.” Usemi huo mfupi umehifadhiwa, huku maelezo ya kitamaduni yakitolewa katika tanbihi.
- source_word: מְזַבֵּחַ
  choice: alikuwa akitoa dhabihu
  rationale: Umbo la kitenzi linaonyesha tendo la kawaida au linaloendelea; “alikuwa akitoa dhabihu” huhifadhi hali hiyo.
- source_word: וּמַקְטִיר
  choice: na kufukiza uvumba
  rationale: Katika muktadha wa ibada, קטר katika Hiphil huonyesha kuchoma kitu ili moshi wake upande, mara nyingi uvumba. Tafsiri hii ni wazi na inalitofautisha tendo hilo na kutoa dhabihu.
theological_decisions:
- issue: Tathmini ya simulizi kuhusu ibada ya Sulemani
  choice: Aya inathibitisha kwa dhati kwamba Sulemani alimpenda Yahwe, kisha inaweka mpaka juu ya sifa hiyo kwa kutaja ibada yake katika mahali pa juu.
  alternative: Kuiona sifa ya mwanzo kuwa ya kejeli, au kuona aya ikiidhinisha bila masharti ibada ya mahali pa juu.
  rationale: Muundo wa Kiebrania huanza na sifa chanya na kisha רַק huleta kizuizi. Tafsiri imehifadhi mvutano huo bila kuugeuza kuwa idhini kamili wala hukumu kamili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ni rahisi kueleweka kwa wasomaji wa kawaida; nahau ya Kiebrania ya “kutembea” imewasilishwa kwa maana yake ya mwenendo wa maisha, na jina Yahwe limehifadhiwa.
