base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/005.yaml
  text: At Gibeon Yahweh appeared to Solomon in a dream at night[a], and God said, “Ask what I should give you.”
translation:
  language: sw
  text: Huko Gibeoni Yahweh alimtokea Sulemani katika ndoto usiku[a], na Mungu akasema, “Omba nikupe nini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “katika ndoto ya usiku”; yaani, katika ndoto wakati wa usiku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/גִבְעוֹן
  choice: Huko Gibeoni
  rationale: בְּ inaonyesha mahali; “huko Gibeoni” ni usemi wa kawaida wa Kiswahili katika simulizi na unaweka wazi eneo la tukio.
- source_word: נִרְאָה
  choice: alimtokea
  rationale: Nifali ya ראה katika muktadha huu humaanisha kujitokeza kwa Mungu kwa mtu; “alimtokea” ni tafsiri ya kawaida bila kufafanua zaidi namna ya ufunuo.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetafsiriwa moja kwa moja kama “Yahweh,” badala ya kulibadilisha kuwa cheo.
- source_word: אֶל שְׁלֹמֹה
  choice: Sulemani
  rationale: Katika muundo wa Kiswahili, kiambishi cha mtendewa katika “alimtokea” tayari kinawasilisha uelekeo wa אֶל kwa Sulemani.
- source_word: בַּ/חֲלֹם הַ/לָּיְלָה
  choice: katika ndoto usiku
  rationale: Hii ni tafsiri ya asili ya Kiswahili ya tamko halisi “katika ndoto ya usiku,” ikihifadhi kwamba ndoto hiyo ilitokea wakati wa usiku.
- source_word: וַ/יֹּאמֶר
  choice: na ... akasema
  rationale: Waw ya kisimulizi inaendeleza matukio; “na ... akasema” huhifadhi mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Tafsiri hii inadumisha badiliko la kimakusudi kutoka jina יהוה hadi jina la kawaida אֱלֹהִים.
- source_word: שְׁאַל
  choice: Omba
  rationale: Amri hii katika muktadha inamhimiza Sulemani kuomba apewe jambo; “omba” ni ya kawaida na inaendana na kisemwa kinachofuata.
- source_word: מָה אֶתֶּן לָךְ
  choice: niku­pe nini
  rationale: Kiebrania kina maana ya “nikupe nini?” Baada ya “Omba,” mpangilio “niku­pe nini” ni wa kawaida na huhifadhi swali lililowekwa ndani ya ombi.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini inatumia Tetragramatoni kama jina binafsi; “Yahweh” huilinda kama jina badala ya kuibadili kuwa cheo.
- issue: Kuhifadhi badiliko kutoka יהוה hadi אֱלֹהִים
  choice: Yahweh ... Mungu
  alternative: Kutafsiri yote mawili kama “Mungu” au “Yahweh”
  rationale: Kiebrania kinatumia majina mawili tofauti kwa ukaribu. Kuyahifadhi huepuka kulainisha tofauti iliyo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Huko Gibeoni” na “katika ndoto usiku” ni miundo ya kawaida katika simulizi; majina Sulemani, Yahweh, na Mungu yanafuata matumizi yanayoeleweka kwa wasomaji wa Biblia.
