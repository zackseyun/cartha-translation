  text: Then the king answered and said[a], “Give her the living child, and by no means put him to death; she is his mother.”
translation:
  language: sw
  text: Ndipo mfalme akajibu, akasema, “Mpeni yule mwanamke mtoto aliye hai, wala msimwue kamwe; yeye ndiye mama yake.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ וַיֹּאמֶר
  choice: Ndipo mfalme akajibu, akasema
  rationale: Inahifadhi fomula ya masimulizi ya Kiebrania yenye vitenzi viwili, ‘akajibu, akasema,’ kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: תְּנוּ לָהּ
  choice: Mpeni yule mwanamke
  rationale: Amri iko katika wingi, ikielekezwa kwa watekelezaji kadhaa. Kirai ‘yule mwanamke’ kinaweka wazi kuwa kiwakilishi cha Kiebrania kinamrejelea mwanamke aliyekuwa ametajwa katika muktadha.
- source_word: אֶת הַיָּלוּד הַחַי
  choice: mtoto aliye hai
  rationale: יַלוּד humaanisha aliyezaliwa, na katika muktadha huu ‘mtoto’ ni tafsiri ya kawaida; הַחַי inaelezwa kwa ufasaha kuwa ‘aliye hai.’
- source_word: וְהָמֵת לֹא תְמִיתֻהוּ
  choice: wala msimwue kamwe
  rationale: Muundo wa Kiebrania una kitenzi-jina pamoja na kitenzi cha kusababisha kufa ili kusisitiza katazo. ‘Kamwe’ huhifadhi msisitizo huo kwa Kiswahili cha asili bila kuwa na uzito usio wa lazima.
- source_word: הִיא אִמּוֹ
  choice: yeye ndiye mama yake
  rationale: ‘Ndiye’ huonyesha utambulisho wenye msisitizo unaofaa katika uamuzi wa mfalme, huku kiambishi cha umilikaji kikihifadhi maana ya ‘mama yake.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa masimulizi ni wa sasa, wenye hadhi na unaoeleweka kwa urahisi. Msisitizo wa katazo la Kiebrania umewekwa katika matini kwa neno ‘kamwe,’ hivyo tanbihi si lazima.
