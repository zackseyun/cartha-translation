  text: וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ גִּבְעֹ֨נָ/ה֙ לִ/זְבֹּ֣חַ שָׁ֔ם כִּ֥י הִ֖יא הַ/בָּמָ֣ה הַ/גְּדוֹלָ֑ה אֶ֤לֶף עֹלוֹת֙ יַעֲלֶ֣ה שְׁלֹמֹ֔ה עַ֖ל הַ/מִּזְבֵּ֥חַ הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/004.yaml
  text: And the king went to Gibeon to sacrifice there[a], for that was the great high place. Solomon offered a thousand burnt offerings on that altar.
translation:
  language: sw
  text: Naye mfalme akaenda Gibeoni kutoa dhabihu huko, kwa maana huko ndiko kulikokuwa mahali pa juu mashuhuri[a]. Sulemani akatoa sadaka elfu moja za kuteketezwa juu ya madhabahu hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pa juu pakubwa.” Kivumishi cha Kiebrania kinaweza kumaanisha ukubwa au umashuhuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Ni kitenzi cha kawaida cha masimulizi kinachoonyesha hatua inayofuata; hakidai maana ya ‘akapanda’ hapa.
- source_word: גִּבְעֹנָה
  choice: Gibeoni
  rationale: Herufi ya mwelekeo iliyoambatanishwa na jina la mahali inaonyesha kwenda kuelekea Gibeoni; umbo la Kiswahili ‘akaenda Gibeoni’ ni la kawaida.
- source_word: לִזְבֹּחַ
  choice: kutoa dhabihu
  rationale: Kitenzi hiki kinamaanisha kufanya tendo la dhabihu; ‘kutoa dhabihu’ ni Kiswahili cha kawaida na sahihi.
- source_word: כִּי הִיא הַבָּמָה הַגְּדוֹלָה
  choice: kwa maana hapo ndipo palipokuwa mahali pa juu palipo mashuhuri
  rationale: בָּמָה ni mahali pa ibada panapoitwa ‘mahali pa juu.’ הַגְּדוֹלָה inaweza kueleza ukubwa au umaarufu; ‘palipo mashuhuri’ huonyesha hadhi bila kudai kwamba palikuwa pakubwa zaidi kwa vipimo.
- source_word: אֶלֶף עֹלוֹת
  choice: sadaka elfu moja za kuteketezwa
  rationale: עֹלוֹת ni sadaka zinazoteketezwa kabisa, si dhabihu kwa ujumla; idadi elfu moja imehifadhiwa moja kwa moja.
- source_word: יַעֲלֶה
  choice: akatoa
  rationale: Hifili ya עלה pamoja na עֹלוֹת ni nahau ya kutoa sadaka za kuteketezwa. Katika muktadha huu yiqtol inaeleweka kwa kawaida kama tukio la wakati uliopita, bila kulazimisha maana ya kitendo cha mazoea.
- source_word: עַל הַמִּזְבֵּחַ הַהוּא
  choice: juu ya madhabahu hiyo
  rationale: Tafsiri ya moja kwa moja na ya asili inayohifadhi kiwakilishi cha kuonyesha ‘hiyo.’
theological_decisions:
- issue: Tafsiri ya בָּמָה katika ibada ya kabla ya kujengwa kwa hekalu
  choice: mahali pa juu
  alternative: mahali pa ibada
  rationale: ‘Mahali pa juu’ huhifadhi istilahi ya kihistoria na mvutano wa kiteolojia unaohusishwa na ibada katika maeneo hayo, badala ya kuufifisha kwa neno la jumla.
- issue: Maana ya הַגְּדוֹלָה kuhusu mahali pa juu
  choice: palipo mashuhuri
  alternative: palipokuwa pakubwa
  rationale: Kivumishi kinaweza kuonyesha ukubwa au hadhi. Muktadha unaunga mkono umaarufu au ukuu wa mahali hapo, lakini uwezekano wa ukubwa halisi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Istilahi za kawaida za Biblia ‘dhabihu,’ ‘sadaka za kuteketezwa,’ na ‘madhabahu’ zimetumiwa. ‘Mahali pa juu’ limehifadhiwa kama istilahi ya kihistoria ya ibada.
