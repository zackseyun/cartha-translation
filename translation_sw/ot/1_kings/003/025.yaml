translation:
  language: sw
  text: Kisha mfalme akasema[a], “Mkateni mtoto aliye hai vipande viwili, na mpeni mmoja nusu, na mwingine nusu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa mmoja ... na kwa mmoja,” kwa kutumia maumbo ya kike yanayowarejelea wanawake wawili katika simulizi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akasema
  rationale: Muundo wa simulizi unaendeleza mfuatano wa matukio; “Kisha ... akasema” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino maalumu kwa muktadha; Kiswahili hakihitaji kibainishi kinacholingana na herufi ya utambulisho ya Kiebrania.
- source_word: גִּזְרוּ
  choice: Mkateni
  rationale: Ni amri ya wingi ya kukata kitu kimwili. Kiambishi cha yambwa humrejelea mtoto waziwazi na kwa ufasaha.
- source_word: הַיֶּלֶד הַחַי
  choice: mtoto aliye hai
  rationale: Hutofautisha mtoto huyu na mtoto aliyekufa katika muktadha; usemi huu ni wazi na wa kawaida.
- source_word: לִשְׁנָיִם
  choice: vipande viwili
  rationale: Hueleza kugawanywa katika sehemu mbili. Kiswahili huhitaji kirai hiki ili kutoa maana ya asili kwa kawaida baada ya “Mkateni.”
- source_word: וּתְנוּ
  choice: mkampe
  rationale: Ni amri ya pili ya wingi inayoratibiwa na ya kwanza; “mkampe” huhifadhi tendo la kutoa na kulielekeza kwa kila mmoja.
- source_word: הַחֲצִי
  choice: nusu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kila sehemu ya vitu viwili vilivyogawanywa.
- source_word: לְאַחַת ... לְאֶחָת
  choice: mmoja ... mwingine
  rationale: Huhifadhi mgawanyo kati ya wale wanawake wawili wanaojulikana katika muktadha bila kuongeza nomino “mwanamke” katika matini.
