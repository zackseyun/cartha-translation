base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/026.yaml
  text: Then the woman whose son was alive said to the king[a], because her compassion was stirred for her son, and she said, "Please, my lord, give her the living child, and do not put him to death." But the other said, "It shall be neither mine nor yours[b]; cut him in two."
translation:
  language: sw
  text: Ndipo yule mwanamke ambaye mwanawe alikuwa hai akamwambia mfalme, kwa maana alimhurumia sana mwanawe[a], akasema, “Tafadhali, bwana wangu, mpeni huyo mwanamke mtoto aliye hai, wala kwa vyovyote usimuue[b]!” Lakini yule mwanamke mwingine akasema, “Hatakuwa wangu wala wako; mkateni vipande viwili!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia nahau inayosema kwamba huruma zake kwa mwanawe “zilipata joto”; nahau hii huonyesha huruma kali.
    reason: cultural_note
  - marker: b
    text: 'Kiebrania kinasisitiza katazo hili: “usimuue kabisa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְמְרוּ רַחֲמֶיהָ
  choice: alimwonea mwanawe huruma kubwa
  rationale: Nahau ya Kiebrania inaeleza kuchochewa kwa hisia nyingi za huruma ya kimama. Kiswahili hiki ni cha kawaida na kinaweka wazi nguvu ya hisia bila kutafsiri viungo vya ndani kwa namna isiyo ya asili.
- source_word: בִּי אֲדֹנִי
  choice: Tafadhali, bwana wangu
  rationale: בִּי hapa ni neno la kusihi kwa heshima, si kishazi cha mahali; “Tafadhali” linaonyesha ombi lake la haraka na la unyenyekevu.
- source_word: הַיָּלוּד הַחַי
  choice: mtoto aliye hai
  rationale: יַלוּד humaanisha aliyezaliwa, yaani mtoto; tafsiri hii haitaji umri mahususi usioelezwa na maandishi.
- source_word: וְהָמֵת אַל תְּמִיתֻהוּ
  choice: wala usimuue kamwe
  rationale: Muundo wa kitenzi kisoukomo pamoja na kitenzi kilichonyambuliwa unasisitiza katazo. “Kamwe” linahifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: וְזֹאת אֹמֶרֶת
  choice: Lakini yule mwanamke mwingine akasema
  rationale: Kiwakilishi cha kuonyesha kinamtambulisha kwa kulinganisha mwanamke wa pili; “mwingine” linafanya rejeo hilo lieleweke kwa kawaida.
- source_word: גַּם לִי גַם לָךְ לֹא יִהְיֶה
  choice: Asiwe wangu wala wako
  rationale: Mtoto ndiye kiima kinachoeleweka. Muundo huu mfupi unahifadhi ushindani wa umiliki na ukali wa kauli.
- source_word: גְּזֹרוּ
  choice: mkateni vipande viwili
  rationale: Amri ni ya wingi na ni ya ghafla. Muktadha wa mstari uliotangulia unaonyesha kwamba mtoto akatwe mara mbili; kuongeza “vipande viwili” kunafanya maana hiyo iwe wazi.
