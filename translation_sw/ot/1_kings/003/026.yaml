translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mabadiliko ya idadi katika amri yamehifadhiwa kadiri inavyowezekana: “mpeni” na “mkateni” ni ya wingi, huku “usimuue” ikimwelekea mfalme katika umoja kama ilivyo katika umbo la Kiebrania.'
