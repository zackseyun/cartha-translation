review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the verse’s contrast, the mother’s urgent plea, the emphatic prohibition, and the second woman’s cruel demand. A small adjustment is needed in the final declaration: Hebrew לֹא יִהְיֶה is an indicative declaration (''he shall not be''), rather than the Swahili subjunctive ''Asiwe.'''
  naturalness: The Swahili is generally clear and appropriately formal. Recasting the compassion clause with the natural verb 'alimhurumia sana' avoids the slightly heavy 'alimwonea ... huruma kubwa' while retaining the idiom’s force. 'Kwa vyovyote usimuue' naturally expresses the emphatic prohibition.
  terminology: Names and forms of address are appropriate. 'Bwana wangu,' 'mtoto aliye hai,' and the plural commands 'mpeni' and 'mkateni' suitably reflect the Hebrew and the narrative context. The footnote on the Hebrew idiom is revised into more idiomatic Swahili.
  issues:
  - severity: low
    issue: The phrase 'Asiwe wangu wala wako' uses a subjunctive form.
    rationale: The Hebrew imperfect לֹא יִהְיֶה is a declaration that the child will be neither woman’s. 'Hatakuwa wangu wala wako' preserves this force more directly.
  - severity: low
    issue: The compassion clause is somewhat less idiomatic than necessary.
    rationale: '''Alimwonea mwanawe huruma kubwa'' is understandable, but ''alimhurumia sana mwanawe'' is smoother modern Standard East African Swahili and communicates the intense compassion expressed by the Hebrew idiom.'
  revised_text: Ndipo yule mwanamke ambaye mwanawe alikuwa hai akamwambia mfalme, kwa maana alimhurumia sana mwanawe[a], akasema, “Tafadhali, bwana wangu, mpeni huyo mwanamke mtoto aliye hai, wala kwa vyovyote usimuue[b]!” Lakini yule mwanamke mwingine akasema, “Hatakuwa wangu wala wako; mkateni vipande viwili!”
