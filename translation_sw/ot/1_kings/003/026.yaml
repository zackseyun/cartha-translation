  to: Ndipo yule mwanamke ambaye mwanawe alikuwa hai akamwambia mfalme, kwa maana alimhurumia sana mwanawe[a], akasema, “Tafadhali, bwana wangu, mpeni huyo mwanamke mtoto aliye hai, wala kwa vyovyote usimuue[b]!” Lakini yule mwanamke mwingine akasema, “Hatakuwa wangu wala wako; mkateni vipande viwili!”
