language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ זֹ֣את אֹמֶ֔רֶת זֶה בְּנִ֥/י הַ/חַ֖י וּ/בְנֵ֣/ךְ הַ/מֵּ֑ת וְ/זֹ֤את אֹמֶ֨רֶת֙ לֹ֣א כִ֔י בְּנֵ֥/ךְ הַ/מֵּ֖ת וּ/בְנִ֥/י הֶ/חָֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/023.yaml
  text: Then the king said[a], “This one says, ‘This is my son, the living one, and your son is the dead one,’ and this one says, ‘No, for your son is the dead one, and my son is the living one.’”
translation:
  language: sw
  text: Ndipo mfalme akasema[a], “Huyu anasema, ‘Huyu ni mwanangu, aliye hai, na mwanao ndiye aliyekufa,’ naye huyu anasema, ‘La! Mwanao ndiye aliyekufa, na mwanangu ndiye aliye hai.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kueleza wazi zaidi, “Mwanamke huyu anasema ... naye yule mwingine anasema ...” Kiebrania kinatumia viwakilishi vya kike vinavyomaanisha kihalisi “huyu ... na huyu,” vikirejelea wale wanawake wawili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida huku ukihifadhi hatua inayofuata katika tukio.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainisho imetafsiriwa moja kwa moja kwa cheo kilichotumiwa katika Kiebrania, bila kuingiza jina la mfalme.
- source_word: זֹאת ... וְזֹאת
  choice: Huyu ... naye huyu
  rationale: Viwakilishi vya kuonyesha vinadumisha namna mfalme anavyowatofautisha wanawake hao wawili. Kiswahili hakionyeshi jinsia katika ‘huyu,’ hivyo ufafanuzi umewekwa katika tanbihi.
- source_word: אֹמֶרֶת
  choice: anasema
  rationale: Kauli ya wakati wa sasa inahifadhi uhai wa muhtasari wa madai ya kila mwanamke.
- source_word: זֶה בְּנִי הַחַי
  choice: Huyu ni mwanangu, aliye hai
  rationale: Tafsiri hii inadumisha msisitizo wa kiwakilishi na kauli ya utambulisho, pamoja na kirai kinachomtambulisha mtoto kuwa ndiye aliye hai.
- source_word: בְּנִי / בְּנֵךְ
  choice: mwanangu / mwanao
  rationale: בֵּן humaanisha ‘mwana’ au ‘mwana wa kiume’; katika muktadha huu ‘mwana’ ni ya kawaida na sahihi kwa mtoto huyo wa kiume.
- source_word: הַחַי
  choice: aliye hai
  rationale: Kirai hiki kinawakilisha umbo la Kiebrania linalotaja yule aliye hai na kudumisha utofautishaji wake na aliyekufa.
- source_word: הַמֵּת
  choice: aliyekufa
  rationale: Hili ni chaguo la kawaida na lenye hadhi kwa Kiswahili, linalodumisha utofautishaji na ‘aliye hai’ bila kutumia usemi mgumu.
- source_word: לֹא כִי
  choice: La!
  rationale: Katika muktadha wa mabishano, muungano huu unakanusha dai lililotangulia na kuanzisha dai la kulisahihisha. ‘La!’ huwasilisha upinzani huo kwa uwazi; sentensi inayofuata inaeleza madai mbadala.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Marudio ya ‘aliye hai’ na ‘aliyekufa’ yamehifadhiwa kwa sababu ndiyo kiini cha madai yanayokinzana.
