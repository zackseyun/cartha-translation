  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa madai mawili yanayokinzana: mfalme anayataja kwa wakati wa sasa, utambulisho wa mwana aliye hai na mwana aliyekufa, na kanusho la mwanamke wa pili. “Huyu ni mwanangu, aliye hai” huwasilisha vizuri apposisheni ya Kiebrania, na “La!” huonyesha kanusho la לֹא kwa kawaida.'
  naturalness: Kiswahili ni sanifu, cha sasa, na kina mtiririko wa asili. Marudio ya “huyu,” “mwanangu/mwanao,” “aliye hai,” na “aliyekufa” yanafaa kwa kuwa yanadumisha mantiki ya shauri na msisitizo wa tamko la mfalme.
