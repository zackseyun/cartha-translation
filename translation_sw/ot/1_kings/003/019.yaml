lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Wayyiqtol ya מוּת inasimulia tukio lililotokea; wakati uliopita wa Kiswahili unafaa katika simulizi.
- source_word: בֶּן
  choice: mwana
  rationale: Neno la Kiebrania humaanisha mwana wa kiume; katika muktadha huu “mwana” ni la kawaida na linadumisha maana hiyo.
- source_word: בֶּן הָאִשָּׁה הַזֹּאת
  choice: mwana wa mwanamke huyu
  rationale: Muundo huu wa kawaida wa Kiswahili unaakisi kwa uwazi kirai cha Kiebrania.
- source_word: לָיְלָה
  choice: usiku
  rationale: Nomino hii imetumiwa kama kielezi cha wakati; “usiku” ni tafsiri ya kawaida na ya asili.
- source_word: אֲשֶׁר
  choice: kwa sababu
  rationale: Ingawa אֲשֶׁר inaweza kuwa kiunganishi cha uhusiano au wakati, muktadha unaonyesha kuwa kulalia mtoto ndiko kulikosababisha kifo.
- source_word: שָׁכְבָה עָלָיו
  choice: alimlalia
  rationale: Kitenzi “alimlalia” kinaeleza kwa Kiswahili cha kawaida kwamba mwanamke alilala akiwa juu ya mtoto, huku kikidumisha uhusiano wa kimwili unaoonyeshwa na עַל.
