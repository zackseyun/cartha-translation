source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֵלָ֗י/ו יַעַן֩ אֲשֶׁ֨ר שָׁאַ֜לְתָּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה וְ/לֹֽא שָׁאַ֨לְתָּ לְּ/ךָ֜ יָמִ֣ים רַבִּ֗ים וְ/לֹֽא שָׁאַ֤לְתָּ לְּ/ךָ֙ עֹ֔שֶׁר וְ/לֹ֥א שָׁאַ֖לְתָּ נֶ֣פֶשׁ אֹיְבֶ֑י/ךָ וְ/שָׁאַ֧לְתָּ לְּ/ךָ֛ הָבִ֖ין לִ/שְׁמֹ֥עַ מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/011.yaml
  text: And God said to him, “Because you have asked for this thing, and have not asked for yourself many days, nor have asked for yourself riches, nor have asked for the life of your enemies, but have asked for yourself understanding to hear justice,”
translation:
  language: sw
  text: Mungu akamwambia, “Kwa kuwa umeomba jambo hili, wala hukujiombea maisha marefu, utajiri, au mauti ya adui zako[a], bali umejiombea ufahamu wa kutambua haki,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno moja moja, “uhai wa adui zako”; maana yake hapa ni kuomba waangamizwe.
    reason: Kufafanua nahau ya Kiebrania huku ushahidi wa muundo halisi ukihifadhiwa.
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: maisha marefu
  rationale: Ingawa maneno hayo ni ‘siku nyingi,’ katika muktadha huu ni nahau inayomaanisha kuishi muda mrefu; ‘maisha marefu’ ni Kiswahili cha kawaida na sahihi.
- source_word: נֶפֶשׁ אֹיְבֶיךָ
  choice: mauti ya adui zako
  rationale: Kifungu hicho kwa neno moja moja ni ‘uhai/nafsi ya adui zako,’ lakini hapa kinamaanisha kuomba uhai wao uchukuliwe, yaani waangamizwe. ‘Mauti’ huepuka maana ya kupotosha kwamba Sulemani angeomba adui zake waendelee kuishi.
- source_word: הָבִין לִשְׁמֹעַ מִשְׁפָּט
  choice: ufahamu wa kutambua haki
  rationale: Muundo wa Kiebrania unaunganisha kuelewa, kusikia/kutambua, na hukumu au haki. Tafsiri hii ni ya asili katika Kiswahili na inadumisha lengo la kupambanua yaliyo ya haki bila kuongeza wazo la kiufafanuzi lisilokuwamo wazi katika mstari.
theological_decisions:
- issue: 'Maana ya מִשְׁפָּט: hukumu au haki'
  choice: haki
  alternative: hukumu
  rationale: Katika ombi la Sulemani, neno linaweza kuelekeza kwenye uamuzi wa kimahakama na pia kanuni ya haki. ‘Kutambua haki’ huhifadhi kusudi la maadili la hukumu bila kuifanya sentensi isikike kana kwamba anaomba tu kusikia hukumu iliyokwisha kutolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa ‘wala … au … bali’ unaweka wazi utofautishaji wa ombi la Sulemani bila uzito usio wa lazima.
