  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfuatano wa Kiebrania: sababu ya ombi, mambo ambayo Sulemani hakujiombea, na ombi lake la ufahamu wa kutambua haki. “Maisha marefu” hutoa maana ya kiasili ya יָמִים רַבִּים, na “mauti ya adui zako” hutoa kwa uwazi maana ya nahau נֶפֶשׁ אֹיְבֶיךָ katika muktadha huu.'
  naturalness: Kiswahili ni sanifu, cha asili, na kina hadhi inayofaa simulizi la kibiblia. Muundo “wala ... au ... bali” unasomeka vizuri bila kurudia viambishi vya “kujiombea” kwa namna nzito.
  terminology: “Mungu,” “maisha marefu,” “utajiri,” “mauti,” “ufahamu,” na “haki” ni istilahi zinazofaa. “Ufahamu wa kutambua haki” ni uwasilishaji wa asili wa הָבִין לִשְׁמֹעַ מִשְׁפָּט na hauingizi msimamo wa dhehebu. Tanbihi imefungwa vizuri kwenye “adui zako” na hufafanua maana ya nahau bila kubadili matini.
