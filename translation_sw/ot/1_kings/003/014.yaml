base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/014.yaml
  text: And if you walk in my ways[a], keeping my statutes and my commandments, as David your father walked, then I will lengthen your days.
translation:
  language: sw
  text: Na ikiwa utatembea katika njia zangu na kuzishika sheria zangu na amri zangu, kama Daudi baba yako alivyotembea, basi nitarefusha siku zako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitarefusha maisha yako.”
    reason: Nahau ya Kiebrania “kurefusha siku” humaanisha kurefusha maisha.
lexical_decisions:
- source_word: וְאִם
  choice: Na ikiwa
  rationale: Inahifadhi kiunganishi kinachoendeleza maneno ya Bwana pamoja na sharti linalofuata.
- source_word: תֵּלֵךְ בִּדְרָכַי
  choice: utatembea katika njia zangu
  rationale: Inadumisha sitiari ya Kiebrania kuhusu mwenendo wa maisha na lugha ya agano bila kuifafanua kupita kiasi.
- source_word: לִשְׁמֹר
  choice: ukishika
  rationale: Inaonyesha namna ya kutembea katika njia za Mungu, yaani kwa kuyatii na kuyazingatia maagizo yake.
- source_word: חֻקַּי
  choice: sheria zangu
  rationale: Ni neno la kawaida na linaloeleweka kwa masharti yaliyowekwa na Mungu, huku likibaki tofauti na ‘amri.’
- source_word: וּמִצְוֺתַי
  choice: na amri zangu
  rationale: Linawasilisha kwa uwazi maagizo ya Mungu na kudumisha tofauti ya msamiati na חֻקַּי.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִיד אָבִיךָ
  choice: kama Daudi baba yako alivyotembea
  rationale: Inahifadhi ulinganisho na Daudi pamoja na mwangwi wa kitenzi ‘kutembea’ katika sehemu ya kwanza ya aya.
- source_word: וְהַאַרַכְתִּי
  choice: basi nitaziongeza
  rationale: ‘Basi’ linaweka wazi matokeo ya sharti kwa Kiswahili cha kawaida; ‘nitaziongeza’ linawasilisha maana ya kurefusha muda.
- source_word: אֶת יָמֶיךָ
  choice: siku zako
  rationale: Inahifadhi nahau halisi ya Kiebrania, huku tanbihi ikitoa maana yake ya wazi ya kurefusha maisha.
theological_decisions:
- issue: Ahadi ya maisha marefu yenye sharti la utii wa agano
  choice: 'Sharti na ahadi vimetafsiriwa moja kwa moja: ikiwa Sulemani atatembea katika njia za Mungu, Mungu ataongeza siku zake.'
  alternative: Kuitafsiri kama ahadi isiyo na sharti kwa nasaba ya kifalme, au kama baraka ya jumla tu.
  rationale: Muundo wa Kiebrania unaweka wazi sharti la mwenendo wa Sulemani na matokeo yake ya kuongezewa siku; tafsiri haipaswi kulainisha wala kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sitiari ya ‘kutembea katika njia’ imehifadhiwa kwa kuwa inaeleweka katika muktadha wa mwenendo wa maisha. Alama ya tanbihi imewekwa baada ya ‘siku zako,’ ambako mbadala wake wa kileksia unahusika.
