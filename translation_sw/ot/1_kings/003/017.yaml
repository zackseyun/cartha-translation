- source_word: בִּי אֲדֹנִי
  choice: Tafadhali, bwana wangu!
  rationale: Nahau ya heshima inayotumiwa kumwomba mwenye mamlaka asikilize; tafsiri hii ni ya kawaida na yenye staha katika Kiswahili.
- source_word: יֹשְׁבֹת בְּבַיִת אֶחָד
  choice: tunaishi katika nyumba moja
  rationale: Kitenzi hapa kinaeleza makao yao ya pamoja; wakati wa sasa unafuata umbo la Kiebrania na ushahidi wa matini ya mashauriano.
- source_word: וָאֵלֵד עִמָּהּ בַּבָּיִת
  choice: Nilijifungua nikiwa naye humo nyumbani
  rationale: Huwasilisha kwamba mwanamke huyo mwingine alikuwapo pamoja naye ndani ya nyumba wakati wa kujifungua, kwa Kiswahili cha asili bila kuongeza maelezo yasiyomo.
