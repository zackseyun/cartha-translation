  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה אַתָּ֨ה עָשִׂ֜יתָ עִם עַבְדְּ/ךָ֙ דָוִ֣ד אָבִ/י֮ חֶ֣סֶד גָּדוֹל֒ כַּ/אֲשֶׁר֩ הָלַ֨ךְ לְ/פָנֶ֜י/ךָ בֶּ/אֱמֶ֧ת וּ/בִ/צְדָקָ֛ה וּ/בְ/יִשְׁרַ֥ת לֵבָ֖ב עִמָּ֑/ךְ וַ/תִּשְׁמָר ל֗/וֹ אֶת הַ/חֶ֤סֶד הַ/גָּדוֹל֙ הַ/זֶּ֔ה וַ/תִּתֶּן ל֥/וֹ בֵ֛ן יֹשֵׁ֥ב עַל כִּסְא֖/וֹ כַּ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/006.yaml
  text: And Solomon said[a], “You have shown great covenant faithfulness to your servant David my father, because he walked before you in faithfulness, in righteousness, and in uprightness of heart with you; and you have kept for him this great covenant faithfulness and have given him a son sitting on his throne[c][b], as it is this day.”
translation:
  language: sw
  text: Naye Sulemani akasema, “Umemwonyesha mtumishi wako Daudi, baba yangu, uaminifu mkuu wa agano[a], kama alivyoishi mbele zako kwa uaminifu[b], kwa haki, na kwa unyofu wa moyo pamoja nawe. Umemhifadhia uaminifu huu mkuu wa agano, nawe umempa mwana anayeketi kwenye kiti chake cha enzi, kama ilivyo leo[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upendo thabiti,” “upendo wa kudumu,” au “fadhili.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa kweli” au “kwa unyofu.”
    reason: lexical_alternative
  - marker: c
    text: Nahau ya Kiebrania “kama siku hii” inaonyesha kwamba hali iliyopo sasa ni uthibitisho unaoonekana wa jambo hilo.
    reason: cultural_note
lexical_decisions:
- source_word: חֶסֶד
  choice: uaminifu wa agano
  rationale: Katika muktadha huu wa Daudi na mwendelezo wa ufalme wake, neno hili linaonyesha upendo wenye uaminifu unaodumisha uhusiano na ahadi. Tafsiri hii inaweka wazi nguvu ya kiagano bila kuondoa maana ya upendo na fadhili.
- source_word: עָשִׂיתָ עִם
  choice: umemwonyesha
  rationale: Muundo wa Kiebrania, kihalisi ‘umefanya pamoja na,’ unapotumiwa na חֶסֶד humaanisha kumwonyesha mtu uaminifu au fadhili.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika sala ya kifalme mbele za Mungu, ‘mtumishi’ huonyesha nafasi ya Daudi chini ya mamlaka ya Mungu kwa lugha ya kawaida na yenye heshima.
- source_word: כַּאֲשֶׁר
  choice: kwa kuwa
  rationale: Katika muktadha huu kishazi kinataja msingi unaohusishwa na jinsi Mungu alivyomtendea Daudi, ingawa Kiebrania kinaweza pia kueleweka ‘kama vile.’
- source_word: הָלַךְ לְפָנֶיךָ
  choice: aliishi mbele zako
  rationale: Hii ni nahau ya Kiebrania kuhusu mwenendo mzima wa maisha ya mtu katika uwepo wa Mungu. ‘Aliishi’ ni ya kawaida zaidi katika Kiswahili kuliko tafsiri ya moja kwa moja ‘alitembea.’
- source_word: בֶּאֱמֶת
  choice: kwa uaminifu
  rationale: אֱמֶת hapa inaweza kumaanisha ukweli, uaminifu, au unyofu. ‘Kwa uaminifu’ inafaa katika orodha ya sifa za mwenendo wa Daudi huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: בִצְדָקָה
  choice: kwa haki
  rationale: Neno hili linaeleza mwenendo mwadilifu wa Daudi mbele za Mungu; ‘kwa haki’ ni usemi wa asili na wa moja kwa moja katika Kiswahili.
- source_word: וּבְיִשְׁרַת לֵבָב
  choice: kwa unyofu wa moyo
  rationale: Usemi huu unaonyesha uadilifu na unyoofu wa ndani, huku ukihifadhi taswira ya Kiebrania ya moyo.
- source_word: עִמָּךְ
  choice: pamoja nawe
  rationale: Kihusishi cha Kiebrania ni ‘pamoja na/wewe.’ Kukihifadhi kunadumisha maana ya uhusiano wa Daudi na Mungu badala ya kukifanya marudio ya ‘mbele zako.’
- source_word: וַתִּשְׁמָר לוֹ
  choice: umemdumishia
  rationale: שׁמר hapa ni kuhifadhi au kuendeleza uaminifu uliotajwa. ‘Umemdumishia’ huonyesha kwamba Mungu aliendeleza uaminifu huo kwa ajili ya Daudi.
- source_word: בֵן יֹשֵׁב עַל כִּסְאוֹ
  choice: mwana anayeketi kwenye kiti chake cha ufalme
  rationale: Kivumishi-tendo cha Kiebrania kinaonyesha mwana ambaye sasa ameketi katika kiti cha enzi. ‘Kiti cha ufalme’ ni wazi kwa wasomaji wa kawaida na huhifadhi picha ya kutawazwa.
- source_word: כַּיּוֹם הַזֶּה
  choice: kama ilivyo leo
  rationale: Nahau hii inaelekeza kwenye hali ya sasa inayoonekana kuwa uthibitisho wa uaminifu wa Mungu.
theological_decisions:
- issue: Maana ya חֶסֶד katika muktadha wa kifalme na wa kiagano
  choice: uaminifu wa agano
  alternative: upendo thabiti; upendo wa kudumu; fadhili
  rationale: Kutolewa kwa mwana anayeketi kwenye kiti cha Daudi kunaonyesha mwendelezo wa ahadi na uhusiano wa Mungu na Daudi. ‘Uaminifu wa agano’ huonyesha kipengele hicho bila kukana kwamba חֶסֶד pia hubeba maana ya upendo na fadhili.
- issue: Uhusiano kati ya uaminifu wa Mungu na mwenendo wa Daudi katika כַּאֲשֶׁר
  choice: kwa kuwa
  alternative: kama vile; kadiri
  rationale: Kiswahili ‘kwa kuwa’ huwasilisha uhusiano wa sababu unaowezekana katika muktadha, lakini haisemi kwamba Daudi alipata ahadi ya Mungu kwa matendo yake pekee. Tanbihi ya ziada haijaongezwa kwa sababu tofauti hii haibadili kiini cha sentensi, nayo imeandikwa katika maamuzi ya kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Aliishi mbele zako’ huwasilisha nahau ya mwenendo wa maisha kwa kawaida; ‘kiti cha ufalme’ huepuka utata wa ‘kiti’ pekee. Muundo wa sentensi umebaki karibu na Kiebrania huku ukisomeka kwa urahisi.
