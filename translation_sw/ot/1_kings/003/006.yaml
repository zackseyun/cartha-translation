  to: Naye Sulemani akasema, “Umemwonyesha mtumishi wako Daudi, baba yangu, uaminifu mkuu wa agano[a], kama alivyoishi mbele zako kwa uaminifu[b], kwa haki, na kwa unyofu wa moyo pamoja nawe. Umemhifadhia uaminifu huu mkuu wa agano, nawe umempa mwana anayeketi kwenye kiti chake cha enzi, kama ilivyo leo[c].”
