  text: Ndipo mfalme akasema, “Nileteeni upanga.” Basi wakauleta upanga mbele ya mfalme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Waw-consecutive inaendeleza simulizi kwa tukio linalofuata; “Ndipo ... akasema” ni Kiswahili cha kawaida kinachohifadhi mfuatano huo.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye kibainishi imetafsiriwa kwa njia ya kawaida katika Kiswahili; muktadha humtambulisha mfalme anayezungumziwa.
- source_word: קְחוּ לִי
  choice: Nileteeni
  rationale: Ingawa לקח kimsingi ni “chukua,” hapa amri ya wingi ina maana ya kwenda kuchukua kitu na kukileta kwa msemaji. “Nileteeni” ni ya asili na huhifadhi wingi wa wanaoamriwa.
- source_word: חָרֶב
  choice: upanga
  rationale: Kutokuwapo kwa kibainishi katika kutajwa kwa kwanza huleta kitu kisichokuwa kimetajwa awali. Kiswahili hakihitaji neno linalolingana moja kwa moja na “a.”
- source_word: וַיָּבִאוּ
  choice: Basi wakauleta
  rationale: Kitenzi cha wingi pamoja na kiunganishi cha kisimulizi kinaonyesha utekelezaji uliofuata amri. “Basi” na “waka-” huwasilisha mwendelezo na matokeo kwa Kiswahili cha asili.
- source_word: הַחֶרֶב
  choice: upanga
  rationale: Kutajwa kwa pili kunarejelea upanga ulioagizwa. Kiambishi cha yambwa “-u-” katika “wakauleta” pia huonyesha kuwa ni upanga ule unaojulikana katika muktadha.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: mbele ya mfalme
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi ya kuletwa katika uwepo wa mfalme, bila kuongeza maelezo yasiyomo katika maandishi.
