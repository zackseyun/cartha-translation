  text: וַ/תָּקָם֩ בְּ/ת֨וֹךְ הַ/לַּ֜יְלָה וַ/תִּקַּ֧ח אֶת בְּנִ֣/י מֵֽ/אֶצְלִ֗/י וַ/אֲמָֽתְ/ךָ֙ יְשֵׁנָ֔ה וַ/תַּשְׁכִּיבֵ֖/הוּ בְּ/חֵיקָ֑/הּ וְ/אֶת בְּנָ֥/הּ הַ/מֵּ֖ת הִשְׁכִּ֥יבָה בְ/חֵיקִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/020.yaml
  text: She got up in the middle of the night and took my son from beside me while your servant was sleeping[a], and she laid him in her bosom, and laid her dead son in my bosom.
translation:
  language: sw
  text: Akaamka katikati ya usiku, akamchukua mwanangu kutoka kando yangu wakati mimi, mjakazi wako, nilipokuwa nimelala. Akamlaza kifuani mwake[a], kisha akamlaza mwanawe aliyekuwa amekufa kifuani mwangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mapajani mwake ... mapajani mwangu.” Neno la Kiebrania חֵיק linaweza kumaanisha kifua au mapaja.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ הַלַּיְלָה
  choice: katikati ya usiku
  rationale: Kirai hiki kinaonyesha sehemu ya ndani au katikati ya usiku, si wakati wa usiku kwa ujumla tu.
- source_word: מֵאֶצְלִי
  choice: kutoka kando yangu
  rationale: אֵצֶל huonyesha kuwa karibu au ubavuni mwa mtu; “kando yangu” ni Kiswahili cha kawaida kinachofaa mazingira ya kulala.
- source_word: וַאֲמָתְךָ
  choice: mimi, mjakazi wako
  rationale: Hili ni neno la kujishusha la mwanamke anayemwambia mfalme. Kutaja “mimi” kunafanya uhusiano wake na kitenzi “nilipokuwa nimelala” uwe wazi kwa Kiswahili.
- source_word: יְשֵׁנָה
  choice: nilipokuwa nimelala
  rationale: Umbo hili linaeleza hali iliyoendelea wakati kitendo kingine kilipotokea.
- source_word: וַתַּשְׁכִּיבֵהוּ
  choice: akamlaza
  rationale: Hifili ya שׁכב humaanisha kumsababisha mtu alale au kumweka akiwa amelala; “akamlaza” ni fupi na ya asili katika muktadha huu.
- source_word: בְּחֵיקָהּ / בְחֵיקִי
  choice: kifuani mwake / kifuani mwangu
  rationale: חֵיק inaweza kuwa kifua au mapaja. “Kifuani” inadumisha ukaribu wa mama na mtoto katika mazingira ya kulala, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: בְּנָהּ הַמֵּת
  choice: mwanawe aliyekuwa amekufa
  rationale: Kirai hiki humtambulisha mwana wa yule mwanamke kuwa ndiye aliyekufa; tafsiri hii ni wazi na ya kawaida kwa Kiswahili.
