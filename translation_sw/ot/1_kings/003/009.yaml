  text: וְ/נָתַתָּ֨ לְ/עַבְדְּ/ךָ֜ לֵ֤ב שֹׁמֵ֨עַ֙ לִ/שְׁפֹּ֣ט אֶֽת עַמְּ/ךָ֔ לְ/הָבִ֖ין בֵּֽין ט֣וֹב לְ/רָ֑ע כִּ֣י מִ֤י יוּכַל֙ לִ/שְׁפֹּ֔ט אֶת עַמְּ/ךָ֥ הַ/כָּבֵ֖ד הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/009.yaml
  text: So give your servant a listening heart to judge your people[a], to discern between good and evil[b], for who is able to judge this great people of yours?
translation:
  language: sw
  text: Basi umpe mtumishi wako moyo unaosikiliza[a], ili niwahukumu watu wako na kupambanua kati ya mema na mabaya; kwa maana ni nani awezaye kuwahukumu watu wako hawa wakuu[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “moyo wenye ufahamu”; kihalisi, “moyo unaosikia” au “moyo unaosikiliza.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “wakuu” maana yake ya msingi ni “wazito” au “wenye uzito.” Hapa linaweza kudokeza ukubwa au umuhimu wa watu hao, au uzito wa jukumu la kuwahukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Basi umpe
  rationale: Katika muktadha wa sala, kiunganishi pamoja na kitenzi hiki kinaendeleza ombi linalotokana na yaliyotangulia. “Basi umpe” ni ombi la heshima na la kawaida katika Kiswahili.
- source_word: לְעַבְדְּךָ
  choice: mtumishi wako
  rationale: Hili ni neno la kawaida la kujinyenyekeza ambalo Sulemani anatumia mbele za Mungu; “mtumishi” linafaa zaidi hapa kuliko “mtumwa,” kwa kuwa hali ya utumwa si jambo linalosisitizwa.
- source_word: לֵב שֹׁמֵעַ
  choice: moyo unaosikiliza
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya moyo unaosikia kwa makini na kuitikia, huku ikidokeza ufahamu unaohitajika kwa hukumu ya hekima.
- source_word: לִשְׁפֹּט
  choice: kuwahukumu
  rationale: Kitenzi cha Kiebrania kinaweza kujumuisha kutawala na kusimamia haki, lakini “kuwahukumu” kinahifadhi maana yake ya msingi na kinaendana na muktadha wa kupambanua mema na mabaya.
- source_word: עַמְּךָ
  choice: watu wako
  rationale: Tafsiri hii huhifadhi uhusiano wa watu hao na Mungu bila kupunguza maana za kiagano au kisiasa.
- source_word: לְהָבִין
  choice: kupambanua
  rationale: Katika muundo huu kitenzi kinamaanisha kuelewa kwa kutofautisha kwa makini; “kupambanua” linafaa hasa katika muktadha wa kutoa hukumu.
- source_word: בֵּין טוֹב לְרָע
  choice: kati ya mema na mabaya
  rationale: Hii huhifadhi lugha pana ya Kiebrania kuhusu mema na mabaya badala ya kuifupisha kuwa haki na makosa pekee.
- source_word: כִּי מִי יוּכַל
  choice: kwa maana ni nani awezaye
  rationale: Maneno haya yanatoa sababu ya ombi na kuonyesha kutotosha kwa mwanadamu mbele ya jukumu hilo.
- source_word: הַכָּבֵד
  choice: walio wengi sana
  rationale: Kwa habari ya watu wanaotawaliwa, “walio wengi sana” huwasilisha kwa Kiswahili cha kawaida ukubwa wa taifa na uzito wa jukumu. Maana halisi ya uzito na uwezekano wa kuelewa neno hili kama “wakubwa” imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Nahau ya kibinadamu katika ombi la Sulemani
  choice: moyo unaosikiliza
  alternative: moyo wenye ufahamu
  rationale: Katika Kiebrania, moyo ni kitovu cha kufikiri, kutaka na kuitikia. Kudumisha neno “moyo” na taswira ya kusikiliza huhifadhi mtazamo huo wa kibiblia bila kuufanya uwe suala la akili pekee.
- issue: Upeo wa jukumu la kifalme katika לִשְׁפֹּט
  choice: kuwahukumu
  alternative: kuwatawala / kuwasimamia kwa haki
  rationale: “Kuwahukumu” huhifadhi maana ya msingi ya kitenzi, huku muktadha wa kifalme ukiruhusu maana pana ya kutawala na kusimamia haki bila kuilazimisha ndani ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sala umehifadhiwa kwa “Basi umpe mtumishi wako,” na taswira ya “moyo unaosikiliza” imeachwa wazi badala ya kufasiriwa kupita kiasi.
