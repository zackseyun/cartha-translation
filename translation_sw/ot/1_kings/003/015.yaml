  text: וַ/יִּקַ֥ץ שְׁלֹמֹ֖ה וְ/הִנֵּ֣ה חֲל֑וֹם וַ/יָּב֨וֹא יְרוּשָׁלִַ֜ם וַֽ/יַּעֲמֹ֣ד לִ/פְנֵ֣י אֲר֣וֹן בְּרִית אֲדֹנָ֗/י וַ/יַּ֤עַל עֹלוֹת֙ וַ/יַּ֣עַשׂ שְׁלָמִ֔ים וַ/יַּ֥עַשׂ מִשְׁתֶּ֖ה לְ/כָל עֲבָדָֽי/ו׀׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/015.yaml
  text: Then Solomon awoke[a], and behold, it was a dream. And he came to Jerusalem and stood before the ark of the covenant of the LORD, and offered up burnt offerings and made peace offerings, and made a feast for all his servants.
translation:
  language: sw
  text: Kisha Sulemani akaamka, na kumbe, ilikuwa ndoto. Akaenda Yerusalemu, akasimama mbele ya sanduku la agano la Bwana, akatoa sadaka za kuteketezwa na sadaka za amani[a], kisha akawaandalia watumishi wake wote karamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika”; neno la Kiebrania linaweza kukazia ushirika wa pamoja katika mlo wa dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַץ
  choice: akaamka
  rationale: Kitenzi hiki humaanisha kuamka kutoka usingizini; “akaamka” ni simulizi la kawaida na la moja kwa moja katika Kiswahili.
- source_word: וְהִנֵּה חֲלוֹם
  choice: na kumbe, ilikuwa ndoto
  rationale: “Kumbe” hudumisha msisitizo wa הִנֵּה na hisia ya Sulemani kutambua kwa ghafula kwamba jambo hilo lilikuwa ndoto.
- source_word: וַיָּבוֹא יְרוּשָׁלִַם
  choice: akaenda Yerusalemu
  rationale: בוא ina maana ya kuja au kuingia. Kwa kuwa msimulizi hayuko Yerusalemu kama kituo cha mtazamo, “akaenda Yerusalemu” ni Kiswahili cha kawaida bila kuongeza wazo la kurudi, ambalo halijasemwa wazi.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: akasimama mbele ya
  rationale: Huu ni ulinganifu wa moja kwa moja unaodumisha maana ya kujihudhurisha mbele ya kitu kitakatifu.
- source_word: אֲרוֹן בְּרִית אֲדֹנָי
  choice: sanduku la agano la Bwana
  rationale: “Sanduku la agano” ni istilahi iliyo wazi na iliyozoeleka. Maandishi yaliyotolewa yana אֲדֹנָי, kwa hiyo “Bwana” hudumisha jina hilo la cheo bila kulifanya moja kwa moja kuwa tetragramatoni.
- source_word: עֹלוֹת
  choice: sadaka za kuteketezwa
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa sadaka zilizoteketezwa juu ya madhabahu.
- source_word: וַיַּעַל
  choice: akatoa
  rationale: Katika muktadha wa ibada, Hifili ya עלה humaanisha kutoa sadaka juu ya madhabahu; “akatoa” ni ya kawaida na sahihi katika Kiswahili.
- source_word: שְׁלָמִים
  choice: sadaka za amani
  rationale: Tafsiri hii hudumisha jina la jadi la aina hii ya sadaka na uhusiano wake wa kimsamiati na amani au ustawi, bila kuifupisha maana yake kuwa ushirika peke yake.
- source_word: מִשְׁתֶּה
  choice: karamu
  rationale: Nomino hii humaanisha karamu au sherehe yenye chakula na kinywaji; “karamu” ni neno la kawaida na lenye heshima.
- source_word: לְכָל עֲבָדָיו
  choice: watumishi wake wote
  rationale: עֲבָדִים inaweza kumaanisha watumishi, wahudumu, au maafisa wa kifalme. “Watumishi” ni pana na haiingizi maana nyembamba ya maafisa pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri אֲדֹנָי katika kirai אֲרוֹן בְּרִית אֲדֹנָי
  choice: Bwana
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yaliyotolewa yana אֲדֹנָי (“Bwana”), si יהוה. Kwa hiyo “Bwana” huheshimu ushahidi huo wa moja kwa moja; “BWANA” lingefaa zaidi kama maandishi yangekuwa na jina la agano יהוה.
- issue: Maana ya שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika
  rationale: Sadaka hizi zilihusisha amani, ustawi, shukrani na ushirika katika mlo wa dhabihu. “Sadaka za amani” hudumisha upana na uhusiano wa neno la Kiebrania, huku tanbihi ikitaja tafsiri nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi vya simulizi umedumishwa kwa “aka-”. Alama ya tanbihi imewekwa baada ya “sadaka za amani,” ambako maelezo yake yanahusika.
