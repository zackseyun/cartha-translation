base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/028.yaml
  text: And all Israel heard of the judgment that the king had rendered[a], and they feared the king[b], because they saw that the wisdom of God was within him to administer justice.
translation:
  language: sw
  text: Israeli wote wakasikia kuhusu hukumu ambayo mfalme alikuwa ametoa, wakamcha mfalme[a], kwa sababu waliona kwamba hekima ya Mungu ilikuwa ndani yake ili kutenda haki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamwogopa mfalme” au “wakawa na kicho mbele ya mfalme.” Neno la Kiebrania linaweza kuonyesha hofu, heshima, au kicho mbele ya mamlaka inayotambuliwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoa hukumu” au “kutekeleza haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ כָל יִשְׂרָאֵל
  choice: Israeli wote wakasikia kuhusu
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha kwamba taifa lote lilipata habari kuhusu uamuzi huo, huku ukihifadhi usemi wa jumla ‘Israeli wote.’
- source_word: הַמִּשְׁפָּט אֲשֶׁר שָׁפַט הַמֶּלֶךְ
  choice: hukumu aliyokuwa ametoa mfalme
  rationale: ‘Hukumu’ inadumisha muktadha wa kisheria, na ‘kutoa hukumu’ ni usemi wa kawaida wa Kiswahili unaowakilisha kitenzi שׁפט pamoja na nomino מִשְׁפָּט.
- source_word: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: wakamcha mfalme
  rationale: ‘Kumcha’ linaweza kuhusisha hofu, heshima na kicho, hivyo linahifadhi upana wa maana ya ירא katika mwitikio kwa mamlaka ya mfalme.
- source_word: חָכְמַת אֱלֹהִים
  choice: hekima ya Mungu
  rationale: Tafsiri hii inahifadhi mtajo wa wazi wa Mungu na uhusiano wa moja kwa moja wa hekima hiyo na Mungu.
- source_word: בְּקִרְבּוֹ
  choice: ilikuwa ndani yake
  rationale: Huhifadhi picha ya Kiebrania ya hekima kuwa ndani ya Sulemani na ni Kiswahili cha kawaida.
- source_word: לַעֲשׂוֹת מִשְׁפָּט
  choice: ili kutenda haki
  rationale: Huhifadhi muundo wa kusudi wa kishazi cha Kiebrania na maana yake pana ya kutekeleza haki katika kazi ya kutoa hukumu.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika maelezo ya hekima ya kifalme
  choice: Mungu
  alternative: ya kimungu
  rationale: Kiebrania kinamtaja Mungu waziwazi; tafsiri ya jina inadumisha dai kwamba hekima ya Sulemani ilitoka kwa Mungu.
- issue: Mvutano wa maana katika וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: wakamcha mfalme
  alternative: wakamwogopa mfalme
  rationale: ‘Kumcha’ hudumisha mvutano kati ya hofu na heshima yenye kicho bila kuufanya mwitikio huo kuwa woga mtupu au heshima ya kawaida tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Wakamcha’ limechaguliwa kwa sababu hubeba pamoja dhana za hofu, heshima na kicho.
