  text: גֶּ֥בֶר בֶּן אֻרִ֖י בְּ/אֶ֣רֶץ גִּלְעָ֑ד אֶ֜רֶץ סִיח֣וֹן מֶ֣לֶךְ הָ/אֱמֹרִ֗י וְ/עֹג֙ מֶ֣לֶךְ הַ/בָּשָׁ֔ן וּ/נְצִ֥יב אֶחָ֖ד אֲשֶׁ֥ר בָּ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/019.yaml
  text: Geber son of Uri[a], in the land of Gilead, the land of Sihon king of the Amorites and of Og king of Bashan; and he was the only governor who was in the land.
translation:
  language: sw
  text: Geberi mwana wa Uri, katika nchi ya Gileadi—nchi ya Sihoni mfalme wa Waamori, na ya Ogu mfalme wa Bashani; naye alikuwa msimamizi mmoja tu aliyekuwa katika nchi hiyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyekuwa juu ya nchi hiyo.” Kiebrania kinasema moja kwa moja “aliyekuwa katika nchi hiyo,” lakini wengine wanaelewa kirai hiki kuwa kina maana ya kusimamia nchi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר בֶּן אֻרִי
  choice: Geberi mwana wa Uri
  rationale: Majina yametoholewa kwa tahajia ya kawaida ya Kiswahili, na muundo wa nasaba בֶּן umetafsiriwa kwa namna ya kawaida kuwa “mwana wa.”
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: katika nchi ya Gileadi
  rationale: Neno אֶרֶץ limehifadhiwa wazi kama “nchi” kwa sababu linarudiwa katika kirai kinachofuata kinachoifafanua Gileadi.
- source_word: אֶרֶץ סִיחוֹן מֶלֶךְ הָאֱמֹרִי וְעֹג מֶלֶךְ הַבָּשָׁן
  choice: nchi ya Sihoni mfalme wa Waamori, na ya Ogu mfalme wa Bashani
  rationale: Kirai hiki kinaifafanua nchi ya Gileadi kwa kuitaja kuwa eneo lililohusishwa na falme za zamani za Sihoni na Ogu. “Ya” imerudiwa kabla ya Ogu ili uhusiano wa kisarufi uwe wazi kwa Kiswahili.
- source_word: נְצִיב
  choice: msimamizi
  rationale: Katika muktadha wa utawala wa 1 Wafalme 4, neno hili linamaanisha afisa aliyeteuliwa kusimamia eneo. “Msimamizi” ni neno la sasa na linaloeleweka, bila kuingiza cheo mahususi cha kisasa kama “mkuu wa mkoa.”
- source_word: אֶחָד
  choice: mmoja tu
  rationale: Namba “mmoja” imehifadhiwa, huku “tu” ikionyesha kwa Kiswahili mkazo kwamba alikuwa msimamizi pekee wa eneo hilo.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: aliyekuwa katika nchi hiyo
  rationale: Tafsiri hii inafuata maana ya moja kwa moja ya kihusishi בְּ, yaani “katika,” huku rejeo la “nchi hiyo” likiweka kirai hicho katika Kiswahili cha kawaida.
theological_decisions:
- issue: Uhusiano wa נְצִיב אֶחָד na Geberi
  choice: naye alikuwa msimamizi mmoja tu
  alternative: na kulikuwa na msimamizi mmoja katika nchi hiyo
  rationale: Muundo wa Kiebrania hauna kitenzi wazi, lakini katika orodha hii unasomeka kwa kawaida kuwa Geberi mwenyewe ndiye huyo msimamizi mmoja. Tafsiri hiyo imewekwa wazi bila kuongeza wazo la kitheolojia.
- issue: Maana ya אֲשֶׁר בָּאָרֶץ
  choice: aliyekuwa katika nchi hiyo
  alternative: aliyekuwa juu ya nchi hiyo
  rationale: Kihusishi בְּ kwa kawaida humaanisha “katika,” lakini baadhi wanaelewa kirai hiki kiutawala kuwa “juu ya nchi hiyo.” Maana ya moja kwa moja imewekwa katika matini, na uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili. Kistari kirefu kimetumiwa kuonyesha kwamba kirai kinachofuata kinaifafanua “nchi ya Gileadi.”
