  text: Ahimaaz[a], in Naphtali; he too took Basemath, the daughter of Solomon[b], as a wife.
translation:
  language: sw
  text: Ahimaasi, katika Naftali[a]; yeye pia alimwoa[b] Basemathi, binti ya Sulemani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “juu ya Naftali” au “kwa ajili ya Naftali”; kihusishi cha Kiebrania kinaweza kuonyesha eneo alilokabidhiwa Ahimaasi katika orodha hii ya maafisa wa wilaya.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “alimchukua Basemathi, binti ya Sulemani, kuwa mke”; hii ni nahau ya kawaida yenye maana kwamba alimwoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִימַעַץ
  choice: Ahimaasi
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili.
- source_word: בְּנַפְתָּלִי
  choice: katika Naftali
  rationale: Kihusishi בְ pamoja na jina la eneo kinaonyesha wilaya au eneo alilohudumia afisa huyu; “katika” huhifadhi maana ya mahali bila kuamua zaidi ya maandishi.
- source_word: גַּם הוּא
  choice: yeye pia
  rationale: Huhifadhi msisitizo wa nyongeza unaomjumuisha Ahimaasi katika mtindo uliotangulia wa orodha.
- source_word: לָקַח ... לְאִשָּׁה
  choice: alimwoa
  rationale: Hii ni nahau ya kawaida ya Kiebrania yenye maana ya kumchukua mwanamke kuwa mke; “alimwoa” ni Kiswahili cha kawaida, wazi na cha heshima.
- source_word: בָּשְׂמַת
  choice: Basemathi
  rationale: Jina la mtu limetoholewa kwa namna inayofaa matamshi ya Kiswahili.
- source_word: בַּת שְׁלֹמֹה
  choice: binti ya Sulemani
  rationale: Muundo wa Kiebrania unaonyesha wazi uhusiano wa mzazi na mtoto; tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
