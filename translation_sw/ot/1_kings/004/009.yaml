translation:
  language: sw
  text: Ben-Dekeri[a], katika Makazi, na Shaalbimu, na Beth-Shemeshi, na Eloni-Beth-Hanani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa maneno kwa karibu zaidi, “mwana wa Dekeri”; hapa muundo wa jina wa Kiebrania umehifadhiwa kama utambulisho wa mtu, “Ben-Dekeri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן דֶּקֶר
  choice: Ben-Dekeri
  rationale: Katika orodha hii ya maofisa, muundo wa Kiebrania ben pamoja na jina maalumu unatumiwa kama jina au utambulisho wa mtu. Uhawilishaji wa jina unahifadhi muundo huo badala ya kuugeuza kimya kuwa maelezo kamili.
- source_word: בְּ/מָקַץ
  choice: huko Makasi
  rationale: Kihusishi בְ kinaonyesha eneo linalohusishwa na ofisa huyu. 'Huko' ni usemi wa kawaida wa Kiswahili katika orodha hii ya maeneo, bila kuingiza moja kwa moja maana ya kiutawala ya 'juu ya'.
- source_word: וּ/בְ/שַׁעַלְבִים
  choice: Shaalbimu
  rationale: Jina la mahali limehawilishwa kwa tahajia inayosomeka kwa Kiswahili; nguvu ya mahali ya kihusishi inaendelea kutoka kwa 'huko' mwanzoni mwa orodha.
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: Beth-Shemeshi
  rationale: Ingawa kihusishi hakirudiwi wazi katika Kiebrania, maana yake ya mahali inaendelea katika mfululizo. Jina la mahali limehawilishwa badala ya kutafsiriwa kuwa 'Nyumba ya Jua'.
- source_word: וְ/אֵילֹון בֵּית חָנָן
  choice: na Eloni-Beth-Hanani
  rationale: Maneno haya yamechukuliwa kuwa jina ambatani la mahali. Maana ya 'huko' inaendelea katika orodha bila kulazimika kurudiwa kabla ya kila jina.
