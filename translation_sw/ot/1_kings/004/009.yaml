translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya watu na mahali yamehawilishwa kwa namna inayosomeka kwa Kiswahili; 'huko' imetumiwa mara moja na kueleweka kwa maeneo yote yanayofuata ili sentensi ibaki ya asili na isiyokuwa nzito.
