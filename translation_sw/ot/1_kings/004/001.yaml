  text: Mfalme Sulemani alikuwa mfalme juu ya Israeli yote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: alikuwa
  rationale: Katika muktadha huu, muundo huu unatambulisha taarifa mpya ya simulizi; kitenzi “alikuwa” hubeba kauli hiyo kwa Kiswahili cha kawaida bila kuongeza neno la wakati lisilokuwapo wazi katika chanzo.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: 'Nomino yenye kibainishi inatumika kama cheo kinachoandamana na jina: “Mfalme Sulemani.”'
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili na matumizi mapana ya Kiswahili.
- source_word: מֶלֶךְ
  choice: mfalme
  rationale: Nomino hii ni kiarifu kinachosema hadhi ya Sulemani; kurudia “mfalme” kunahifadhi muundo na msisitizo wa Kiebrania.
- source_word: עַל
  choice: juu ya
  rationale: Katika muktadha wa utawala, kirai hiki huonyesha mamlaka juu ya watu.
- source_word: כָּל
  choice: yote
  rationale: Kivumishi hiki kinaonyesha Israeli kwa ujumla wake.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ndilo umbo la kawaida la jina la taifa hilo katika Kiswahili.
theological_decisions:
- issue: Kurudiwa kwa neno מֶלֶךְ
  choice: 'Kuhifadhi matukio yote mawili: “Mfalme Sulemani alikuwa mfalme juu ya Israeli yote.”'
  alternative: “Sulemani alikuwa mfalme juu ya Israeli yote” au “Mfalme Sulemani alitawala Israeli yote.”
  rationale: Chanzo kinatumia neno lilelile kwanza kama cheo na kisha kama kiarifu. Kulirudia kunahifadhi msisitizo kwamba Sulemani alikuwa na mamlaka ya kifalme juu ya Israeli yote bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kurudia “Mfalme ... mfalme” si wa kawaida sana katika Kiswahili, lakini umehifadhiwa kwa makusudi ili kuakisi msisitizo wa chanzo.
