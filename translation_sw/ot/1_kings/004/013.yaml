base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/013.yaml
  text: 'Ben-geber[a], in Ramoth-gilead—to him belonged the villages of Jair son of Manasseh, which are in Gilead; to him belonged the region of Argob[b], which is in Bashan: sixty large cities with walls and bronze bars.'
translation:
  language: sw
  text: 'Ben-Geberi, katika Ramoth-Gileadi; yeye alipewa vijiji vya Yairi[a] mwana wa Manase, vilivyoko Gileadi; na eneo la Argobu[b], lililoko Bashani: miji mikubwa sitini yenye kuta na makomeo ya shaba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makazi ya mahema ya Yairi,” au, kwa kunukuu jina la Kiebrania, “Havoth-Yairi.”
    reason: lexical_alternative
  - marker: b
    text: Au “wilaya ya Argobu” au “himaya ya Argobu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן גֶּבֶר
  choice: Ben-Geberi
  rationale: Katika orodha hii ya maafisa, kirai hiki kinatumika kama jina la afisa. Utohozi wa jina unafaa zaidi hapa kuliko kukitafsiri kuwa “mwana wa Geberi,” ingawa kimuundo maana hiyo inawezekana.
- source_word: בְּרָמֹת גִּלְעָד
  choice: huko Ramoth-Gileadi
  rationale: Kihusishi בְּ ni cha mahali. “Huko” ni cha kawaida katika Kiswahili kwa kumtaja afisa pamoja na eneo alilowekwa, huku jina la mahali likitoholewa kwa namna inayoeleweka.
- source_word: לֹו
  choice: chini ya mamlaka yake
  rationale: Kirai hiki kinachorudiwa kinaonyesha eneo alilokabidhiwa afisa katika mpangilio wa kiutawala, si umiliki wake binafsi tu. Tafsiri hii inaweka wazi uhusiano huo bila kuongeza wazo la umiliki wa mali.
- source_word: חַוֺּת יָאִיר
  choice: vijiji vya Yairi
  rationale: Neno חַוֺּת linarejelea makazi au vijiji vilivyohusishwa na Yairi. “Vijiji” ni neno la kawaida na wazi kwa wasomaji wa sasa; maana ya karibu zaidi ya makazi ya mahema imehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: vilivyoko Gileadi
  rationale: Kishazi hiki kinaonyesha mahali vijiji vya Yairi vilipokuwa. Wakati wa sasa unafaa katika maelezo ya kijiografia ya orodha hii.
- source_word: חֶבֶל אַרְגֹּב
  choice: eneo la Argobu
  rationale: חֶבֶל hapa ni sehemu ya nchi iliyopimwa au kutengwa, yaani eneo, wilaya, au himaya. “Eneo” ni la kawaida na halibani maana kuliko lazima.
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: lililoko Bashani
  rationale: Kishazi hiki kinaweka eneo la Argobu ndani ya Bashani kwa njia ya kawaida ya Kiswahili.
- source_word: שִׁשִּׁים עָרִים גְּדֹלוֹת
  choice: miji mikubwa sitini
  rationale: גְּדֹלוֹת inaweza kumaanisha mikubwa au yenye umuhimu. “Mikubwa” inahifadhi maana ya moja kwa moja katika maelezo ya miji yenye ngome.
- source_word: חוֹמָה
  choice: yenye kuta
  rationale: Ingawa Kiebrania kina umbo la umoja, neno hili linaeleza kwa ujumla miji yote sitini. Wingi “kuta” ni wa asili katika Kiswahili.
- source_word: וּבְרִיחַ נְחֹשֶׁת
  choice: na makomeo ya shaba
  rationale: בְרִיחַ ni komeo au boriti ya kufungia lango, si lango lenyewe. “Makomeo ya shaba” huhifadhi picha halisi ya ulinzi wa miji.
