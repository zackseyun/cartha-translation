  rationale: Kihusishi ב kimsingi humaanisha ‘katika’; hapa kinataja eneo alilokabidhiwa afisa huyo bila kuongeza tafsiri ya ‘juu ya’.
- source_word: וּ/בְעָלֽוֹת
  choice: na Bealothi
  rationale: Neno limechukuliwa kuwa jina la pili la mahali lililounganishwa kwa ‘na’. Kiebrania hakirudii kihusishi kabla yake, hivyo mtindo mfupi wa orodha umehifadhiwa.
