  text: Elihoreph and Ahijah[a], the sons of Shisha, were secretaries[c][b]; Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: sw
  text: Elihorefu na Ahiya, wana wa Shisha[a], walikuwa waandishi[b]; Yehoshafati mwana wa Ahiludi alikuwa mtunza kumbukumbu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Shisha.” Kifungu sambamba katika 2 Samweli 8:17 kina umbo la jina linalohusiana, ambalo mara nyingi hutafsiriwa “Shavsha.”'
    reason: alternative_reading
  - marker: b
    text: Au, “makatibu”; neno la Kiebrania linarejelea maafisa wa ikulu walioshughulikia uandishi na nyaraka.
    reason: lexical_alternative
  - marker: c
    text: Au, “mwandishi wa matukio” au “mkumbushaji”; hili lilikuwa cheo cha afisa wa ikulu aliyetunza kumbukumbu na kuwasilisha mambo kwa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיחֹרֶף
  choice: Elihorefu
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: וַאֲחִיָּה
  choice: na Ahiya
  rationale: Kiunganishi kimetafsiriwa kuwa “na,” nalo jina limetoholewa kwa namna ya kawaida katika Kiswahili.
- source_word: בְּנֵי שִׁישָׁא
  choice: wana wa Shisha
  rationale: Hufuata moja kwa moja uhusiano wa kifamilia na umbo la jina lililo katika maandishi ya Kiebrania ya mstari huu.
- source_word: סֹפְרִים
  choice: waandishi wa kifalme
  rationale: Katika orodha hii ya utawala, neno linaonyesha maafisa wa ikulu walioshughulikia uandishi na nyaraka. Kivumishi “wa kifalme” kinaweka wazi muktadha wa ofisi na kutofautisha cheo hiki na הַמַּזְכִּיר.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina la mtu limetoholewa kulingana na matumizi yanayoeleweka katika Kiswahili.
- source_word: בֶּן אֲחִילוּד
  choice: mwana wa Ahiludi
  rationale: Ni tafsiri ya kawaida na ya asili ya utambulisho wa ukoo.
- source_word: הַמַּזְכִּיר
  choice: mtunza kumbukumbu
  rationale: Cheo hiki cha ikulu kilihusu kuhifadhi kumbukumbu na kuwasilisha mambo kwa mfalme; tafsiri hii ni wazi kwa msomaji wa kisasa na haitatanishi na waandishi waliotajwa awali.
