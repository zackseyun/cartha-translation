  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד תַּעְנַ֖ךְ וּ/מְגִדּ֑וֹ וְ/כָל בֵּ֣ית שְׁאָ֡ן אֲשֶׁר֩ אֵ֨צֶל צָרְתַ֜נָ/ה מִ/תַּ֣חַת לְ/יִזְרְעֶ֗אל מִ/בֵּ֤ית שְׁאָן֙ עַ֚ד אָבֵ֣ל מְחוֹלָ֔ה עַ֖ד מֵ/עֵ֥בֶר לְ/יָקְמֳעָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/012.yaml
  text: 'Baana son of Ahilud: Taanach and Megiddo[a], and all Beth-shean, which is beside Zarethan below Jezreel, from Beth-shean to Abel-meholah, as far as beyond Jokmeam.'
translation:
  language: sw
  text: 'Baana mwana wa Ahiludi: Taanaki na Megido, pamoja na eneo lote la Beth-sheani, lililo kando ya Zarethani, chini ya Yezreeli, kuanzia Beth-sheani hadi Abel-Mehola, mpaka ng’ambo ya Yokmeamu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpaka eneo lililo ng’ambo ya Yokmeamu.” Usemi wa Kiebrania unaoeleza mpaka ni mfupi na una ugumu fulani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד
  choice: Baana mwana wa Ahiludi
  rationale: Majina ya watu yametoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, na uhusiano wa kifamilia wa בֶּן umetafsiriwa moja kwa moja kuwa “mwana wa.”
- source_word: תַּעְנַ֖ךְ וּ/מְגִדּ֑וֹ
  choice: Taanaki na Megido
  rationale: Majina ya mahali yametoholewa kwa maumbo yanayofaa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: וְ/כָל בֵּ֣ית שְׁאָ֡ן
  choice: pamoja na eneo lote la Beth-sheani
  rationale: כָל pamoja na jina la mahali hapa inaelekea kumaanisha eneo lote lililohusishwa na Beth-sheani, si mji pekee; “eneo lote” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר֩ אֵ֨צֶל צָרְתַ֜נָ/ה
  choice: lililo kando ya Zarethani
  rationale: אֵצֶל huonyesha ukaribu wa mahali; “kando ya” huhifadhi uhusiano huo bila kubainisha umbali usiotajwa.
- source_word: מִ/תַּ֣חַת לְ/יִזְרְעֶ֗אל
  choice: chini ya Yezreeli
  rationale: Tafsiri hii huhifadhi picha ya nafasi ya chini ya kijiografia katika Kiebrania badala ya kuifasiri moja kwa moja kuwa upande fulani wa dira.
- source_word: מִ/בֵּ֤ית שְׁאָן֙ עַ֚ד אָבֵ֣ל מְחוֹלָ֔ה
  choice: kuanzia Beth-sheani hadi Abel-Mehola
  rationale: Muundo huu wa Kiswahili unaonyesha wazi mipaka ya eneo iliyotajwa na עַד.
- source_word: עַ֖ד מֵ/עֵ֥בֶר לְ/יָקְמֳעָֽם
  choice: mpaka ng’ambo ya Yokmeamu
  rationale: “Ng’ambo ya” huhifadhi maana ya msingi ya מֵעֵבֶר na pia ukakamavu fulani wa usemi mfupi wa mpaka katika Kiebrania; uwezekano wa kuelewa eneo la ng’ambo umewekwa katika tanbihi.
