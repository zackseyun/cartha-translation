translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka. Majina yametoholewa kwa maumbo yanayosomeka kwa Kiswahili, huku mpangilio wa kijiografia na utata halisi wa kifungu cha mwisho vikihifadhiwa.
