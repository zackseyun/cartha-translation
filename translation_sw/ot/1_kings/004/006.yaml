  text: and Ahishar was over the household[b][a], and Adoniram son of Abda was over the forced labor.
translation:
  language: sw
  text: Ahishari alikuwa msimamizi wa nyumba ya kifalme[a], naye Adoniramu mwana wa Abda alikuwa msimamizi wa kazi ya shuruti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikulu” au “nyumba.” Kiebrania husema kihalisi, “juu ya nyumba,” cheo cha usimamizi wa nyumba ya kifalme.
    reason: lexical_alternative
  - marker: b
    text: Au, “kazi ya lazima.” Neno la Kiebrania linamaanisha kazi ambayo mamlaka ya kifalme yaliwalazimisha watu kufanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִישָׁר
  choice: Ahishari
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili; kiunganishi cha Kiebrania hakijatafsiriwa kwa neno tofauti mwanzoni kwa sababu aya hii ni mwendelezo wa orodha.
- source_word: עַל הַבָּיִת
  choice: alikuwa msimamizi wa nyumba ya kifalme
  rationale: Katika orodha ya maafisa, עַל huonyesha mamlaka au usimamizi. הַבַּיִת ni ‘nyumba’ kihalisi, lakini katika muktadha wa ikulu humaanisha nyumba ya mfalme au utawala wake; ‘nyumba ya kifalme’ huhifadhi maana hiyo bila kuibana kuwa jengo pekee.
- source_word: וַאֲדֹנִירָם
  choice: naye Adoniramu
  rationale: Jina limetoholewa kwa Kiswahili, na kiunganishi וַ kimetolewa kwa ‘naye’ ili kuendeleza orodha kwa mtiririko wa kawaida.
- source_word: בֶּן עַבְדָּא
  choice: mwana wa Abda
  rationale: Hii ni kauli ya kawaida ya nasaba inayomtambulisha afisa kwa jina la baba yake.
- source_word: עַל הַמַּס
  choice: alikuwa msimamizi wa kazi ya lazima
  rationale: מַס katika utawala wa kifalme humaanisha huduma ya kazi iliyodaiwa kwa lazima na serikali, si kodi ya fedha tu. ‘Kazi ya lazima’ ni wazi na ya kawaida kuliko istilahi ya kitaalamu.
