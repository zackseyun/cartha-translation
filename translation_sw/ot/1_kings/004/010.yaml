lexical_decisions:
- source_word: בֶּן חֶסֶד
  choice: Ben-Hesedi
  rationale: Katika orodha hii ya maofisa, kirai hiki kinatumiwa kama jina la mtu; limetoholewa badala ya kutafsiriwa moja kwa moja.
- source_word: בָּאֲרֻבּוֹת
  choice: huko Arubothi
  rationale: Kiambishi ב ni cha mahali; 'huko' kinaonyesha eneo la utawala, na jina la mahali limetoholewa kwa Kiswahili.
- source_word: לוֹ
  choice: alikuwa na mamlaka juu ya
  rationale: Katika muktadha wa mgawanyo wa maeneo kwa maofisa, kirai hiki kinaonyesha eneo alilokabidhiwa, si lazima umiliki wake binafsi.
- source_word: שֹׂכֹה
  choice: Soko
  rationale: Jina la mahali limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili.
- source_word: וְכָל אֶרֶץ חֵפֶר
  choice: na nchi yote ya Heferi
  rationale: '''Nchi'' hapa ni eneo maalumu, na ''yote'' huhifadhi maana ya כָל.'
