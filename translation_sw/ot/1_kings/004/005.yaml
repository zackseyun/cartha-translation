base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/005.yaml
  text: Azariahu son of Nathan was over the governors[a], and Zabud son of Nathan was priest and the king’s friend.
translation:
  language: sw
  text: Azariahu mwana wa Nathani alikuwa msimamizi wa magavana, naye Zabudi mwana wa Nathani alikuwa kuhani[a] na rafiki wa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, katika maana ya cheo cha ikulu, “afisa mkuu” au “mshauri wa mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַרְיָהוּ
  choice: Azariahu
  rationale: Jina limetoholewa kwa kufuata umbo la Kiebrania lenye kiishio -yahu.
- source_word: בֶן
  choice: mwana wa
  rationale: Hili ndilo neno la kawaida na la asili la Kiswahili kwa uhusiano huu wa kifamilia katika orodha ya maafisa.
- source_word: עַל הַנִּצָּבִים
  choice: alikuwa mkuu wa maafisa
  rationale: Katika muktadha huu עַל huonyesha mamlaka au usimamizi, nao הַנִּצָּבִים ni maafisa walioteuliwa. Tafsiri hii ni ya asili kwa Kiswahili bila kudai kwamba wote walikuwa watawala wa mikoa.
- source_word: זָבוּד
  choice: Zabudi
  rationale: Jina limetoholewa kwa muundo unaosomeka kwa urahisi katika Kiswahili.
- source_word: כֹּהֵן
  choice: kuhani
  rationale: Maana ya msingi ya neno la Kiebrania ni “kuhani.” Maana inayowezekana ya cheo cha juu katika ikulu imehifadhiwa katika tanbihi.
- source_word: רֵעֶה הַמֶּלֶךְ
  choice: rafiki wa mfalme
  rationale: Tafsiri hii huhifadhi maana ya moja kwa moja ya rafiki au msiri wa karibu wa mfalme na ni ya kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya כֹּהֵן katika orodha ya maafisa wa kifalme
  choice: kuhani katika matini kuu
  alternative: waziri mkuu au mshauri wa mfalme
  rationale: Maana ya kawaida ya neno ni “kuhani,” lakini mazingira ya ikulu yanaweza kuruhusu maana ya afisa mkuu. Utata huo umehifadhiwa kwa tanbihi badala ya kuamuliwa kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Kiunganishi “naye” hutenganisha kwa uwazi majukumu ya watu hao wawili. Alama ya tanbihi imewekwa baada ya “kuhani,” kwa kuwa tanbihi inahusu כֹּהֵן, si “maafisa.”
