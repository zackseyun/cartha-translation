  yaml_path: translation/ot/1_kings/004/020.yaml
  text: Judah and Israel were as numerous as the sand by the sea in multitude[a], eating and drinking and rejoicing.
translation:
  language: sw
  text: Yuda na Israeli walikuwa wengi sana, kama mchanga ulio kando ya bahari,[a] wakila, wakinywa na kufurahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama mchanga wa ufukweni,” usemi wa kawaida wa Kiebrania unaomaanisha idadi kubwa mno.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: Yuda na Israeli
  rationale: Majina haya yametolewa kwa maumbo yao yaliyozoeleka katika Kiswahili, huku yakibaki kuwa kiima kimoja chenye sehemu mbili.
- source_word: רַבִּים ... לָרֹב
  choice: walikuwa wengi sana
  rationale: Kivumishi רַבִּים kina maana ya kuwa wengi, na לָרֹב kinakazia wingi huo. Kiswahili cha kawaida huwasilisha mkazo huu kwa usemi ‘wengi sana’ bila kurudia ‘kwa wingi’ kwa namna isiyo ya kawaida.
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם
  choice: kama mchanga ulio kando ya bahari
  rationale: Huhifadhi tashbihi ya Kiebrania na maana ya עַל הַיָּם kwa lugha ya asili na inayoeleweka. ‘Kando ya bahari’ ni ya karibu zaidi na muundo wa chanzo kuliko kufasiri moja kwa moja kuwa ‘ufukweni.’
- source_word: אֹכְלִים וְשֹׁתִים
  choice: wakila, wakinywa
  rationale: Vitenzi vya hali endelevu vinaendeleza mtiririko wa vielezi vya Kiebrania na kuonyesha hali ya maisha iliyoendelea au ya kawaida.
- source_word: וּשְׂמֵחִים
  choice: na kufurahi
  rationale: Huwasilisha hali ya shangwe na ustawi, na hukamilisha mfululizo wa kula, kunywa na kufurahi kwa Kiswahili cha kawaida.
