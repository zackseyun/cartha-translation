  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo na maana ya Kiebrania: Sulemani ana maafisa kumi na wawili juu ya Israeli yote; wao wanatoa mahitaji ya mfalme na nyumba yake; na kila mmoja hubeba wajibu huo kwa mwezi mmoja katika mwaka. Maana ya mgawanyo wa zamu imehifadhiwa bila kuongeza maelezo ya kiitikadi au kiutawala yasiyomo katika chanzo.'
  naturalness: Kiswahili ni sanifu, cha kisasa, na kina mtiririko mzuri. “Watu wa nyumbani mwake” hueleweka hapa kwa maana ya kaya/nyumba ya kifalme, na “kwa mwezi mmoja kwa mwaka” hufikisha kwa uwazi muda wa wajibu wa kila afisa.
  terminology: “Maafisa” ni chaguo pana na linalofaa kwa נִצָּבִים, bila kudai cheo mahsusi kama ugavana. “Mahitaji” kwa כלכל na “wajibu” kwa idiomu ya wajibu ulio juu ya kila mmoja vinaendana na muktadha wa ugavi wa ikulu. Dokezo la chini linaweka kwa usahihi mbadala za kileksika.
