base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/007.yaml
  text: And Solomon had twelve deputies over all Israel[a], and they provided for the king and his household; each one had to provide for one month in the year.
translation:
  language: sw
  text: Naye Sulemani alikuwa na maafisa kumi na wawili waliowekwa juu ya Israeli yote[a]. Hao walimpatia mfalme na watu wa nyumbani mwake mahitaji yao; kila mmoja alikuwa na wajibu wa kufanya hivyo kwa mwezi mmoja kwa mwaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wasimamizi,” “magavana,” au “wakuu.” Neno la Kiebrania linamaanisha kwa upana maafisa walioteuliwa kusimamia shughuli fulani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה
  choice: Naye Sulemani alikuwa na
  rationale: Kiambishi ל hapa kinaonyesha umilikaji; Kiswahili cha kawaida hueleza maana hiyo kwa ‘alikuwa na.’ ‘Naye’ kinadumisha kiungo cha simulizi.
- source_word: שְׁנֵים עָשָׂר
  choice: kumi na wawili
  rationale: Hii ndiyo namba ya kawaida, ikipatana kisarufi na watu.
- source_word: נִצָּבִים
  choice: maafisa
  rationale: Neno hili humaanisha watu waliowekwa katika nafasi ya usimamizi. ‘Maafisa’ ni pana na halidai kwa lazima kwamba walikuwa magavana wa majimbo.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: waliowekwa juu ya Israeli yote
  rationale: עַל katika muktadha huu huonyesha eneo la mamlaka au mgawo wa kiutawala; muundo huu unahifadhi maana hiyo.
- source_word: וְכִלְכְּלוּ
  choice: walimpatia ... mahitaji yao
  rationale: Kitenzi כלכל hapa kinahusu kutoa mahitaji au riziki kwa jumba la kifalme; usemi huu ni wa kawaida na wazi kwa Kiswahili.
- source_word: אֶת הַמֶּלֶךְ וְאֶת בֵּיתוֹ
  choice: mfalme na watu wa nyumbani mwake
  rationale: בֵּיתוֹ hapa ni nyumba kwa maana ya kaya au jamaa ya kifalme, si jengo pekee.
- source_word: חֹדֶשׁ בַּשָּׁנָה
  choice: kwa mwezi mmoja kwa mwaka
  rationale: Kirai hiki kinaonyesha muda wa wajibu wa kila afisa katika zamu yake ya kila mwaka.
- source_word: יִהְיֶה עַל אֶחָד
  choice: kila mmoja alikuwa na wajibu
  rationale: Kihalisi wajibu ‘ulikuwa juu ya mmoja’; tafsiri hii inaeleza kwa Kiswahili asilia mgawanyo wa wajibu kwa kila mmoja kwa zamu.
- source_word: לְכַלְכֵּל
  choice: wa kufanya hivyo
  rationale: Hurejelea kitendo kilekile cha kutoa mahitaji kilichotajwa awali, huku ikiepuka urudiaji mzito katika Kiswahili.
