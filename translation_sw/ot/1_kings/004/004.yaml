lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: alikuwa msimamizi wa jeshi
  rationale: Kirai עַל pamoja na eneo la wajibu huonyesha mamlaka au usimamizi. Tafsiri hii ni ya kawaida katika Kiswahili na haiongezi cheo maalumu cha kijeshi ambacho hakijatajwa wazi katika Kiebrania.
- source_word: הַצָּבָא
  choice: jeshi
  rationale: Katika muktadha huu צָבָא ni jeshi lililopangwa, si jeshi la mbinguni. “Jeshi” ndilo neno la wazi na la kawaida katika Kiswahili.
- source_word: כֹּהֲנִים
  choice: makuhani
  rationale: Maana ya kawaida na ya msingi ya כֹּהֲנִים ni “makuhani.” Sadoki na Abiathari pia wanajulikana mahali pengine kama makuhani, hivyo maana hiyo inafaa kudumishwa hapa.
- source_word: בְנָיָהוּ
  choice: Benaya
  rationale: Jina limeandikwa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: יְהוֹיָדָע
  choice: Yehoyada
  rationale: Jina limeandikwa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: צָדוֹק
  choice: Sadoki
  rationale: Jina limeandikwa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֶבְיָתָר
  choice: Abiathari
  rationale: Jina limeandikwa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
theological_decisions:
- issue: Ikiwa כֹּהֲנִים itafsiriwe kwa maana isiyo ya kikuhani, kama “maafisa wakuu,” kwa sababu mstari huu ni sehemu ya orodha ya watumishi wa kifalme.
  choice: makuhani
  alternative: maafisa wakuu au watumishi wakuu
  rationale: Maana ya kawaida ya neno la Kiebrania ni “makuhani,” na Sadoki pamoja na Abiathari wanatambulika wazi kuwa makuhani katika vifungu vingine. Muktadha wa utawala wa kifalme pekee haulazimishi maana nyingine, ingawa uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Msimamizi wa jeshi” huhifadhi dhana ya mamlaka bila kuweka cheo cha kijeshi kisichotajwa wazi. Alama ya tanbihi imewekwa baada ya “makuhani,” kwa kuwa tanbihi inahusu neno hilo.
