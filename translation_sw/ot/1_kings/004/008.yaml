  text: 'Na haya ndiyo majina yao: Ben-Huri[a], katika nchi ya vilima ya Efraimu;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwana wa Huri,” ikiwa maneno haya yanaeleza ukoo badala ya kuwa jina la mtu.
