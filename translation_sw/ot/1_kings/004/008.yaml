lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Na haya ndiyo
  rationale: Kiunganishi na kiwakilishi vinaanzisha orodha kwa njia ya kawaida, huku “ndiyo” kikifanya sentensi isiyo na kitenzi iwe wazi katika Kiswahili.
- source_word: שְׁמוֹתָם
  choice: majina yao
  rationale: Huhifadhi maana halisi ya umbo la wingi lenye kiambishi cha nafsi ya tatu wingi; wakati haujalazimishwa kwa sababu Kiebrania hakina kitenzi hapa.
- source_word: בֶּן חוּר
  choice: Ben-Huri
  rationale: Limetolewa kama jina la mtu katika orodha ya maafisa, bila kuamua kimya kimya kwamba lazima liwe tamko la ukoo. Umbo “Huri” linafuata namna ya kawaida ya Kiswahili ya kuandika jina hili.
- source_word: בְּ/הַר אֶפְרָיִם
  choice: katika nchi ya vilima ya Efraimu
  rationale: Katika usemi huu wa kieneo, הַר inaonyesha eneo la miinuko au vilima, si lazima mlima mmoja.
