lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Na hawa ndio
  rationale: Muundo huu unaendeleza simulizi na kutambulisha orodha kwa Kiswahili cha kawaida.
- source_word: הַשָּׂרִים
  choice: maofisa
