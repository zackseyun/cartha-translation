  rationale: Kivumishi hiki kinaonyesha kwamba maofisa hao walikuwa wa utawala wa Sulemani bila kuongeza maelezo yasiyotajwa kuhusu kazi zao.
- source_word: עֲזַרְיָהוּ
  choice: Azaria
  rationale: Jina limetoholewa kwa namna inayotumiwa kwa kawaida katika Kiswahili cha Biblia.
- source_word: בֶן צָדוֹק
  choice: mwana wa Sadoki
  rationale: Huu ni uwasilishaji wa moja kwa moja na wa kawaida wa uhusiano wa mwana na baba.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Kiebrania kinasema “kuhani,” wala hakisemi wazi “kuhani mkuu”; tafsiri haiongezi cheo kisichotajwa.
theological_decisions:
- issue: Mhusika anayetambulishwa na neno “kuhani”
  choice: Kudumisha muundo “Azaria mwana wa Sadoki, kuhani” na kueleza utata katika tanbihi
  alternative: “Azaria mwana wa kuhani Sadoki” au “Azaria mwana wa Sadoki, kuhani mkuu”
  rationale: Kiebrania kinaweza kueleweka kuwa “kuhani” ni Sadoki au kwamba ni cheo cha Azaria. Pia hakisemi wazi “kuhani mkuu,” kwa hiyo tafsiri haipaswi kuamua jambo hilo kimyakimya.
translation_notes:
