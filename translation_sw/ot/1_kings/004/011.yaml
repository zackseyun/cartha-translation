  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אֲבִינָדָב
  choice: Ben-Abinadabu
  rationale: Jina la Kiebrania limetoholewa kwa tahajia inayosomeka kwa Kiswahili huku sehemu 'Ben' ikihifadhiwa kama ilivyo katika orodha hii ya maofisa.
- source_word: כָּל נָפַת דֹּאר
  choice: katika eneo lote la vilima vya Dori
  rationale: נָפָה hapa inaashiria wilaya au eneo la kijiografia; Dori lilihusishwa na ukanda wa vilima. Tafsiri hii huepuka neno lisilo la kawaida 'kimo' huku ikihifadhi maana ya kijiografia.
- source_word: טָפַת
  choice: Tafathi
  rationale: Jina limetoholewa kwa mfumo wa sauti wa Kiswahili.
- source_word: בַּת שְׁלֹמֹה
  choice: binti ya Sulemani
  rationale: Muundo wa kawaida wa Kiswahili kwa kutaja uhusiano wa kifamilia; 'ya' hupatana na nomino 'binti' katika matumizi sanifu.
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: alikuwa mke wake
  rationale: Ni usemi wa asili na wa moja kwa moja wa Kiswahili unaowasilisha uhusiano wa ndoa.
