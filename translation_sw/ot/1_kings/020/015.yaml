base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/015.yaml
  text: So he mustered the young men of the provincial commanders[a], and they were two hundred and thirty-two; and after them he mustered all the people, all the sons of Israel, seven thousand.
translation:
  language: sw
  text: Basi akawakusanya vijana wa wakuu wa majimbo; walikuwa mia mbili thelathini na wawili. Baada yao akawakusanya watu wote—wana wote wa Israeli[a]—elfu saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli wote.” Kiebrania kinasema “wana wote wa Israeli,” usemi wa kifamilia wa kiume unaotumiwa kumaanisha watu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד / פָּקַד
  choice: akawakusanya
  rationale: Katika muktadha huu wa kijeshi, kitenzi kina maana ya kuwakusanya na kuwaandaa watu kwa ajili ya mapambano, si kuwahesabu tu.
- source_word: נַעֲרֵי
  choice: vijana
  rationale: Neno la Kiebrania linaweza kumaanisha vijana, watumishi, au wahudumu. “Vijana” huhifadhi maana yake ya msingi bila kuamua kwa lazima hadhi yao.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: wakuu wa majimbo
  rationale: שָׂרֵי ni viongozi au maofisa, na הַמְּדִינוֹת ni maeneo ya kiutawala. “Wakuu wa majimbo” ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo bila kuwafanya makamanda wa kijeshi moja kwa moja.
- source_word: מָאתַיִם שְׁנַיִם וּשְׁלֹשִׁים
  choice: mia mbili thelathini na wawili
  rationale: Hii ndiyo namna ya kawaida ya kutaja idadi ya watu 232 kwa Kiswahili.
- source_word: וְאַחֲרֵיהֶם
  choice: baada yao
  rationale: Huhifadhi mpangilio halisi wa makundi mawili yaliyokusanywa.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Ingawa ni muktadha wa kijeshi, Kiebrania kinasema “watu wote,” hivyo tafsiri haiongezi neno finyu zaidi kama “jeshi.”
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: wana wote wa Israeli
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania na pia uhusiano wake wa ufafanuzi na “watu wote.” Tanbihi inatoa tafsiri ya kawaida zaidi.
- source_word: שִׁבְעַת אֲלָפִים
  choice: elfu saba
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya idadi iliyotajwa.
