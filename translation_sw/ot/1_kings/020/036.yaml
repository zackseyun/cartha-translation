base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/036.yaml
  text: Then he said to him, “Because you have not listened to the voice of the LORD, look, when you depart from me, the lion will strike you down.” And when he departed from him, the lion found him and struck him down.
translation:
  language: sw
  text: Ndipo akamwambia, “Kwa sababu hukuisikiliza sauti ya BWANA, tazama, utakapoondoka kwangu, simba atakupiga.” Alipoondoka kwake, simba akamkuta na kumpiga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: hukuisikiliza sauti
  rationale: Nahau hii ina maana ya kusikiliza kwa kutii; tafsiri ya ‘kuisikiliza sauti’ huhifadhi taswira ya Kiebrania huku muktadha ukionyesha kutotii.
- source_word: הִנְּךָ
  choice: tazama
  rationale: Inahifadhi kiashiria cha kusisitiza na kuvuta fikira kabla ya tangazo la hukumu.
- source_word: וְהִכְּךָ / וַיַּכֵּהוּ
  choice: atakupiga / akampiga
  rationale: Kitenzi נכה kimsingi ni ‘kupiga’; chanzo hakitamki wazi ‘kuua’, hivyo tafsiri haiongezi hitimisho hilo.
- source_word: הָאַרְיֵה
  choice: simba
  rationale: Tafsiri ya moja kwa moja ya nomino yenye kiambishi cha uainisho katika muktadha.
theological_decisions:
- issue: Kutotii sauti ya BWANA na hukumu iliyotabiriwa
  choice: Kwa sababu hukuisikiliza sauti ya BWANA
  alternative: Kwa sababu hukumtii BWANA
  rationale: Chaguo lililotumika huhifadhi usemi halisi ‘sauti ya BWANA’ na wakati huohuo linaeleweka kwa kawaida kuwa ni kushindwa kutii.
- issue: Matokeo ya shambulio la simba
  choice: simba ... akampiga
  alternative: simba ... akamuua
  rationale: Kiebrania hutumia נכה bila kutaja moja kwa moja kifo katika mstari huu; kutafsiri ‘akampiga’ kunahifadhi upeo na uwezekano wa maana ya chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘BWANA’ limetumika kwa jina la agano יהוה kwa kufuata desturi pana ya Biblia za Kiswahili.
