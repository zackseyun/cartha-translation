base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/009.yaml
  text: So he said to the messengers of Ben-hadad[a], “Say to my lord the king, ‘All that you sent to your servant the first time, I will do; but this thing I cannot do.’” And the messengers went and brought back word to him.
translation:
  language: sw
  text: Basi akawaambia wajumbe wa Ben-hadadi, “Mwambieni bwana wangu mfalme, ‘Yote uliyomtumia mtumishi wako mara ya kwanza nitafanya, lakini jambo hili[a] siwezi kulifanya.’” Wajumbe wakaenda, wakamrudishia jibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “suala hili”; neno la Kiebrania דָּבָר linaweza kumaanisha “jambo,” “suala,” au “neno/ujumbe,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאֲכֵי
  choice: wajumbe
  rationale: Katika muktadha huu wa kifalme, neno hili linamaanisha wawakilishi wanaopeleka ujumbe, si viumbe wa rohoni.
- source_word: בֶן הֲדַד
  choice: Ben-hadadi
  rationale: Jina limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili huku likihifadhi utambulisho wa jina la Kiebrania.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Hii inadumisha lugha rasmi ya heshima inayotumiwa na mtu aliye chini ya mfalme, bila kuifanya kuwa rejeo la Mungu.
- source_word: כֹּל אֲשֶׁר שָׁלַחְתָּ
  choice: Yote uliyomtumia
  rationale: Kitenzi cha Kiebrania ni ‘kutuma’; muundo wa Kiswahili unaonyesha kwamba yaliyotumwa yalielekezwa kwa ‘mtumishi wako’ bila kuyafasiri moja kwa moja kuwa madai.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Hapa ni usemi wa kidiplomasia wa kujishusha mbele ya mfalme; ‘mtumishi’ unafaa kuliko ‘mtumwa,’ ambalo lingeongeza maana isiyokusudiwa katika muktadha huu.
- source_word: בָרִאשֹׁנָה
  choice: mara ya kwanza
  rationale: Usemi huu unarejelea ujumbe wa awali wa Ben-hadadi kwa njia ya wazi na ya kawaida katika Kiswahili.
- source_word: וְהַדָּבָר הַזֶּה
  choice: lakini jambo hili
  rationale: ‘Jambo’ huhifadhi upana wa maana ya דָּבָר kuliko ‘dai,’ ambalo lingekuwa tafsiri ya kimuktadha zaidi.
- source_word: לֹא אוּכַל לַעֲשׂוֹת
  choice: siwezi kulifanya
  rationale: Hii ni kauli ya moja kwa moja ya kutoweza kutekeleza jambo hilo na ni Kiswahili cha kawaida.
- source_word: וַיְשִׁבֻהוּ דָּבָר
  choice: wakamrudishia jibu
  rationale: Huu ni usemi wa Kiebrania wa kurudisha taarifa au jibu; ‘wakamrudishia jibu’ ni wa asili katika Kiswahili na unaonyesha kuwa jibu lilipelekwa tena kwa Ben-hadadi.
