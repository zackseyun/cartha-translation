  text: Then he quickly removed the bandage from over his eyes[a], and the king of Israel recognized him, that he was one of the prophets.
translation:
  language: sw
  text: Ndipo akaondoa haraka kile kitambaa kilichokuwa juu ya macho yake[a], naye mfalme wa Israeli akamtambua kuwa alikuwa mmoja wa manabii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania hapa kwa kawaida humaanisha “majivu,” lakini katika muktadha huu huenda linamaanisha kifuniko au kitambaa kilichowekwa juu ya macho ili kujificha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: haraka
  rationale: Kitenzi מהר kinaonyesha kufanya jambo kwa pupa au bila kukawia; ‘haraka’ ni usemi wa kawaida unaohifadhi mwendo wa simulizi.
- source_word: וַיָּסַר
  choice: akaondoa
  rationale: Hifili ya סור hapa ina maana ya kuondoa kitu kilichokuwa juu ya macho.
- source_word: הָאֲפֵר
  choice: kile kitambaa
  rationale: Ingawa אֵפֶר kwa kawaida humaanisha ‘majivu,’ muktadha wa 1 Wafalme 20:38, 41 unaonyesha kitu kilichovaliwa juu ya macho kama kificho. ‘Kitambaa’ kinaeleza kitu hicho kwa Kiswahili cha kawaida bila kukifafanua kupita ushahidi wa muktadha.
- source_word: מֵעַל עֵינָיו
  choice: kilichokuwa juu ya macho yake
  rationale: Huhifadhi maana ya mahali ya מן־על, yaani kitu kilichoondolewa kutoka juu ya macho.
- source_word: וַיַּכֵּר אֹתוֹ
  choice: akamtambua
  rationale: Hifili ya נכר humaanisha kumtambua au kumtambua mtu alivyo baada ya kificho kuondolewa.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya muundo huu wa umilikaji.
- source_word: כִּי
  choice: kuwa
  rationale: Hapa כִּי inatambulisha yaliyotambuliwa na mfalme, si sababu; ‘kuwa’ ni muundo wa asili katika Kiswahili.
- source_word: מֵהַנְּבִאִים
  choice: mmoja wa manabii
  rationale: מן ina matumizi ya kugawa sehemu ya kundi; usemi huu unaonyesha kwamba alikuwa miongoni mwa manabii.
- source_word: הוּא
  choice: alikuwa
  rationale: Kiwakilishi katika sentensi isiyo na kitenzi kishirikishi kinaonyeshwa kwa ‘alikuwa’ kulingana na wakati wa simulizi.
