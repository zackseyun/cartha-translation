  text: Then he found another man and said[a], “Please strike me.” So the man struck him and wounded him.
translation:
  language: sw
  text: Kisha akamkuta mwanamume mwingine, akamwambia, “Tafadhali, nipige.” Basi yule mwanamume akampiga na kumjeruhi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania hurudia mzizi wa kitenzi “kupiga” kwa msisitizo; kwa karibu: “yule mwanamume akampiga, akimpiga na kumjeruhi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: Kisha akamkuta
  rationale: Muundo wa wayyiqtol unaendeleza simulizi; “kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, huku “akamkuta” ikitoa maana ya מצא katika muktadha huu.
- source_word: אִישׁ אַחֵר
  choice: mtu mwingine
  rationale: אִישׁ humaanisha mwanamume au mtu kulingana na muktadha. Kiswahili “mtu mwingine” ni cha asili na hakiongezi taarifa ambayo kifungu hiki hakisisitizi.
- source_word: הַכֵּינִי נָא
  choice: Tafadhali, nipige
  rationale: Amri ya נכה pamoja na kiambishi cha nafsi ya kwanza ni “nipige”; נָא huonyesha ombi au msisitizo wa heshima, unaowakilishwa na “tafadhali.”
- source_word: וַיַּכֵּהוּ הָאִישׁ
  choice: Basi yule mtu akampiga
  rationale: “Basi” huonyesha mwitikio wa mtu huyo kwa ombi lililotangulia. “Yule mtu” humtambulisha wazi mtu mwingine aliyekuwa ametajwa.
- source_word: הַכֵּה וּפָצֹעַ
  choice: na kumjeruhi
  rationale: Kirai hiki kinaendeleza mzizi wa “kupiga” na kueleza matokeo ya jeraha. Kiswahili cha asili kinaweza kutoa maana hiyo kwa “akampiga na kumjeruhi,” huku tanbihi ikihifadhi urudiaji wa Kiebrania.
