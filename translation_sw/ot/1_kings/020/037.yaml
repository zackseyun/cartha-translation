translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usimulizi. “Nipige” ni wazi na cha kawaida; “kumjeruhi” huhifadhi uzito wa matokeo bila kufanya sentensi kuwa ngumu. Alama ya tanbihi imewekwa baada ya kishazi kinachofafanuliwa.
