  text: So the prophet went and stood by the road for the king[a], and disguised himself with a bandage over his eyes.
translation:
  language: sw
  text: Basi nabii akaenda, akasimama kando ya barabara akimngojea mfalme, akajifanya asitambulike kwa kuweka majivu[a] juu ya macho yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “majivu juu ya macho yake.” Ingawa “majivu” ndiyo maana ya kawaida, kirai hiki kinaweza, katika muktadha huu, kurejelea kifuniko au bandeji iliyotumiwa kujificha utambulisho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Basi ... akaenda
  rationale: Waw-consecutive inaendeleza simulizi; “Basi” pamoja na wakati wa masimulizi wa “aka-” hutoa mtiririko wa kawaida wa Kiswahili.
- source_word: הַנָּבִיא
  choice: nabii
  rationale: Tafsiri ya moja kwa moja ya nomino yenye uainishaji; katika Kiswahili “nabii” inatosha katika muktadha huu.
- source_word: וַיַּעֲמֹד
  choice: akasimama
  rationale: Inahifadhi tendo rahisi la kusimama bila kuongeza wazo lisilo wazi la kujipanga au kuvizia.
- source_word: לַמֶּלֶךְ
  choice: ili kumngojea mfalme
  rationale: Katika muktadha, nabii alijiweka kwenye njia ambayo mfalme angepitia. Kiswahili hiki kinaeleza kusudi la tendo kwa njia ya kawaida, bila kudokeza kwamba tayari alikuwa mbele ya mfalme.
- source_word: עַל הַדָּרֶךְ
  choice: kando ya barabara
  rationale: Hii ni kauli ya kawaida kwa mtu anayesimama karibu na njia akingojea mpita njia; haimlazimishi msomaji kumwona akiwa katikati ya barabara.
- source_word: וַיִּתְחַפֵּשׂ
  choice: akajificha sura
  rationale: Kitenzi cha Kiebrania kina maana ya kujifanya asitambulike. Kauli hii ya Kiswahili inaeleweka kwa urahisi na inaendana na kifuniko kilichowekwa machoni.
- source_word: בָּאֲפֵר
  choice: kwa kuweka kitambaa[a]
  rationale: Neno kwa kawaida huhusishwa na “majivu,” lakini katika kirai hiki linaweza kuashiria kifuniko au kitambaa cha kujibadilisha sura. “Kitambaa” kinafaa katika simulizi, huku tanbihi ikihifadhi maana halisi na utata wa Kiebrania.
- source_word: עַל עֵינָיו
  choice: juu ya macho yake
  rationale: Tafsiri ya karibu na ya kawaida inayobainisha mahali kifuniko kilipowekwa.
