  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/ה֥וּא שֹׁתֶ֛ה ה֥וּא וְ/הַ/מְּלָכִ֖ים בַּ/סֻּכּ֑וֹת וַ/יֹּ֤אמֶר אֶל עֲבָדָי/ו֙ שִׂ֔ימוּ וַ/יָּשִׂ֖ימוּ עַל הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/012.yaml
  text: And when he heard this word[a], while he and the kings were drinking in the booths, he said to his servants[c][b], “Take your positions.” So they took their positions against the city.
translation:
  language: sw
  text: Aliposikia ujumbe huu[a], wakati yeye na wafalme walipokuwa wakinywa katika vibanda[b], akawaambia watumishi wake, “Jipangeni!”[c] Basi wakajipanga dhidi ya mji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “neno hili” au “jambo hili.”
    reason: lexical_alternative
  - marker: b
    text: Au “katika makao ya muda”; kwa mapokeo, “katika mahema ya fahari.”
    reason: lexical_alternative
  - marker: c
    text: Amri ya Kiebrania kwa halisi ni “Wekeni!” au “Pangeni!” Ni amri fupi ya kijeshi, huenda ikimaanisha wajipange dhidi ya mji.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר הַזֶּה
  choice: ujumbe huu
  rationale: דָּבָר inaweza kumaanisha neno, jambo, au ujumbe. Katika muktadha huu ni jibu lililowasilishwa kwa Ben-hadadi, hivyo “ujumbe huu” ni Kiswahili cha kawaida kinachofaa simulizi huku mbadala zikibainishwa katika tanbihi.
- source_word: שֹׁתֶה הוּא וְהַמְּלָכִים
  choice: yeye na wafalme walipokuwa wakinywa
  rationale: Kirai cha Kiebrania kinaonyesha tendo lililokuwa likiendelea wakati ujumbe uliposikiwa. Wingi wa Kiswahili unawasilisha kwa kawaida maana ya “yeye pamoja na wafalme.”
- source_word: בַּסֻּכּוֹת
  choice: katika vibanda
  rationale: סֻכּוֹת ni makao au vivuli vya muda. “Vibanda” ni neno la moja kwa moja na linaloeleweka kwa wasomaji wa sasa bila kuingiza wazo lisilokuwamo la jengo la kudumu.
- source_word: שִׂימוּ
  choice: Jipangeni!
  rationale: Hii ni amri fupi sana inayotumia kitenzi “weka/panga” bila kutaja kitu kinachowekwa. Katika muktadha wa kijeshi, “Jipangeni!” inadumisha ufupi wa amri na kuashiria kuchukua nafasi za vita bila kuongeza maelezo ya silaha au mbinu.
- source_word: וַיָּשִׂימוּ עַל הָעִיר
  choice: wakajipanga dhidi ya mji
  rationale: Kirai hiki ni kifupi na kinaonyesha kujipanga kwa uhasama kuelekea mji. Tafsiri hii huhifadhi marudio ya kitenzi cha amri na jibu lake bila kufafanua kupita chanzo kama walishambulia mara moja.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Maandiko. “Jipangeni!” limechaguliwa ili kuhifadhi ufupi wa amri ya kijeshi; “dhidi ya mji” hudumisha mwelekeo wa uhasama bila kudai kwamba shambulio lenyewe lilikuwa tayari limeanza.
