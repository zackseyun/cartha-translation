base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/014.yaml
  text: 'And Ahab said[a], “By whom?” And he said, “Thus says Yahweh: By the young men of the provincial officials.” Then he said, “Who will begin the battle?” And he said, “You.”'
translation:
  language: sw
  text: 'Ahabu akauliza, “Kwa nani?” Naye akasema, “Yahweh asema hivi: ‘Kwa vijana wa wakuu wa majimbo.’” Kisha akauliza, “Ni nani atakayeanzisha vita?” Naye akasema, “Wewe.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּמִי
  choice: Kwa njia ya nani?
  rationale: Herufi ב pamoja na kiulizi מִי huuliza kuhusu mtu ambaye kupitia kwake jambo litatekelezwa; tafsiri hii inaonyesha uhusika huo kwa Kiswahili cha kawaida.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Hii ni kauli rasmi ya kinabii ya kumtambulisha msemaji wa ujumbe, huku jina la Mungu likihifadhiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: בְּנַעֲרֵי
  choice: kwa njia ya vijana
  rationale: נַעַר kimsingi inaweza kumaanisha kijana, lakini pia mtumishi au msaidizi wa kiongozi; maana ya msingi imewekwa katika matini na maana ya kiutumishi katika tanbihi.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: wakuu wa majimbo
  rationale: שָׂרִים ni viongozi au maafisa wenye mamlaka, na מְדִינוֹת ni maeneo ya kiutawala; “wakuu wa majimbo” ni wazi na haibainishi cheo cha kijeshi kisichotajwa.
- source_word: מִי יֶאְסֹר הַמִּלְחָמָה
  choice: Ni nani atakayeanzisha vita?
  rationale: Ingawa אָסַר kwa kawaida ni “funga,” katika tamathali hii pamoja na מִלְחָמָה maana yake ni kuanzisha au kuingia vitani.
- source_word: אָתָּה
  choice: Wewe
  rationale: Kiwakilishi huru cha nafsi ya pili umoja wa kiume kinatoa jibu la moja kwa moja na lenye mkazo kwa Ahabu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akauliza/akajibu” hutaja kazi ya kauli kwa ufasaha bila kuondoa mfuatano wa mazungumzo. Kiwakilishi “naye” kinahifadhi kutotajwa kwa jina la nabii katika mstari huu.
