  text: וְ/עַבְדֵ֨י מֶֽלֶךְ אֲרָ֜ם אָמְר֣וּ אֵלָ֗י/ו אֱלֹהֵ֤י הָרִים֙ אֱלֹ֣הֵי/הֶ֔ם עַל כֵּ֖ן חָזְק֣וּ מִמֶּ֑/נּוּ וְ/אוּלָ֗ם נִלָּחֵ֤ם אִתָּ/ם֙ בַּ/מִּישׁ֔וֹר אִם לֹ֥א נֶחֱזַ֖ק מֵ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/023.yaml
  text: And the servants of the king of Aram said to him[a], “Their gods are gods of the hills; therefore they were stronger than we were. But if we fight against them on the plain, surely we will be stronger than they are.”
translation:
  language: sw
  text: Watumishi wa mfalme wa Aramu wakamwambia, “Miungu yao ni miungu ya milima[a]; ndiyo sababu walikuwa na nguvu kuliko sisi. Lakini tukipigana nao katika nchi tambarare, hakika tutakuwa na nguvu kuliko wao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu wao ni mungu wa milima.” Kiebrania kimetumia maumbo ya wingi (“miungu”), yakionyesha namna ya kipagani ambayo Waaramu walizungumza kuhusu Mungu wa Israeli.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: Watumishi
  rationale: Neno hili linaweza kumaanisha watumishi au maofisa wa ikulu. “Watumishi” ni tafsiri ya moja kwa moja na inafaa katika usemi wa kifalme bila kulazimisha cheo maalumu.
- source_word: אֲרָם
  choice: Aramu
  rationale: Jina la asili la eneo na taifa limehifadhiwa badala ya kutumia jina la baadaye, Siria.
- source_word: אֱלֹהֵי הָרִים
  choice: miungu ya milima
  rationale: Maumbo ya Kiebrania ni ya wingi, na usemi huu unaonyesha mtazamo wa kipagani wa Waaramu kuhusu Mungu wa Israeli. “Milima” huleta tofauti wazi na nchi tambarare.
- source_word: אֱלֹהֵיהֶם
  choice: miungu yao
  rationale: Wingi umehifadhiwa ili kuonyesha jinsi wasemaji Waaramu walivyomwelewa vibaya Mungu wa Israeli, bila kugeuza kauli yao kuwa tamko la msimulizi.
- source_word: עַל כֵּן
  choice: ndiyo sababu
  rationale: Hutoa uhusiano wa sababu kwa Kiswahili cha kawaida, cha sasa na chenye hadhi.
- source_word: חָזְקוּ מִמֶּנּוּ
  choice: walikuwa na nguvu kuliko sisi
  rationale: Kitenzi pamoja na kihusishi cha ulinganisho kinaeleza nguvu zinazozidi; tafsiri hii huhifadhi ulinganisho wa moja kwa moja.
- source_word: וְאוּלָם
  choice: Lakini
  rationale: Huonyesha wazi tofauti kati ya maelezo yao ya kushindwa na mkakati mpya wanaopendekeza.
- source_word: נִלָּחֵם אִתָּם
  choice: tukipigana nao
  rationale: 'Katika muktadha huu kauli ina maana ya pendekezo lenye sharti: wakibadili uwanja wa vita, wanatarajia matokeo tofauti.'
- source_word: בַּמִּישׁוֹר
  choice: katika nchi tambarare
  rationale: Hutaja eneo tambarare la mapigano na kulinganisha wazi mandhari hiyo na milima.
- source_word: אִם לֹא
  choice: hakika
  rationale: Hapa muundo huu ni msisitizo wa uhakika, si sharti hasi la kawaida.
- source_word: נֶחֱזַק מֵהֶם
  choice: tutakuwa na nguvu kuliko wao
  rationale: Huhifadhi ulinganisho na kurudia kwa neno la nguvu kama katika sehemu ya kwanza ya mstari.
theological_decisions:
- issue: Jinsi ya kutafsiri maelezo ya Waaramu kuhusu Mungu wa Israeli
  choice: Miungu yao ni miungu ya milima
  alternative: Mungu wao ni mungu wa milima
  rationale: Mstari unanukuu dhana potovu ya kipagani, si kufundisha kwamba Israeli ilikuwa na miungu mingi. Wingi wa Kiebrania umehifadhiwa ili kuonyesha mtazamo wa wasemaji na mvutano wa simulizi bila kuusahihisha kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya kawaida kwa wasomaji wengi; “nchi tambarare” inaweka wazi tofauti ya kijiografia na “milima,” huku marudio ya “nguvu kuliko” yakihifadhi muundo wa Kiebrania.
