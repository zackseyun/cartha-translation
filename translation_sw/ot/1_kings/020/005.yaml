  to: 'Wajumbe wakarudi na kusema, “Ben-Hadadi asema hivi: ‘Kwa maana nilikupelekea ujumbe, nikisema, “Utanipa fedha yako, dhahabu yako, wake zako na wana wako wa kiume,”’”'
  rationale: Revision avoids treating the syntactically and contextually debated particle כִּי as definitely concessive, while retaining that possibility in a footnote. It also uses idiomatic Swahili for the prior dispatch and explicitly retains the source's reference to sons rather than children generally.
