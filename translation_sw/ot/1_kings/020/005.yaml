base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/005.yaml
  text: 'The messengers returned and said[a], “Thus says Ben-hadad: ‘Though I sent to you, saying, “You shall give me your silver and your gold and your wives and your sons,”’”'
translation:
  language: sw
  text: 'Wajumbe wakarudi na kusema, “Ben-Hadadi asema hivi: ‘Kwa maana nilikupelekea ujumbe, nikisema, “Utanipa fedha yako, dhahabu yako, wake zako na wana wako wa kiume,”’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: wakarudi
  rationale: Kitenzi שוב kinaendeleza mfululizo wa simulizi na hapa kina maana ya kurudi.
- source_word: הַמַּלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu wa kisiasa na kijeshi, neno hili linamaanisha wajumbe wa kibinadamu, si malaika.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Hii ni kauli rasmi ya mjumbe; wakati wa sasa ni wa kawaida na wa asili katika Kiswahili wakati ujumbe unanukuliwa.
- source_word: בֶּן הֲדַד
  choice: Ben-hadadi
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: כִּי
  choice: Ingawa
  rationale: Imechukuliwa kwa maana ya kukubali jambo kabla ya kuliongezea uzito, kwa kuzingatia dai kali zaidi linalokamilishwa katika mstari unaofuata; uwezekano mwingine umehifadhiwa katika tanbihi.
- source_word: שָׁלַחְתִּי אֵלֶיךָ
  choice: nilituma ujumbe kwako
  rationale: Kitenzi kinarejelea ujumbe uliotumwa awali. Neno “ujumbe” linaweka wazi kwa Kiswahili kile kinachoeleweka katika muktadha.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: fedha yako, dhahabu yako
  rationale: Majina halisi ya vitu vya thamani yamehifadhiwa kwa lugha ya kawaida na yenye heshima.
- source_word: וְנָשֶׁיךָ
  choice: wake zako
  rationale: Katika muktadha, neno hili linawarejelea wake wa Ahabu, si wanawake kwa ujumla.
- source_word: וּבָנֶיךָ
  choice: wana wako
  rationale: “Wana” ni neno la kawaida la Kiswahili linaloweza kumaanisha wana wa kiume katika muktadha huu, bila kutumia maelezo mazito yasiyo ya lazima.
- source_word: לִי תִתֵּן
  choice: Utanipa
  rationale: Wakati ujao wa Kiswahili hapa una nguvu ya amri au dai, na hivyo unaonyesha wajibu uliolazimishwa.
