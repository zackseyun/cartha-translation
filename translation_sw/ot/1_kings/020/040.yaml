base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/040.yaml
  text: And as your servant was busy here and there[a], he was gone. Then the king of Israel said to him, “So shall your judgment be[c][b]; you yourself have decided it.”
translation:
  language: sw
  text: Mtumishi wako alipokuwa akishughulika huku na huku[a], yule mtu hakuwepo tena[b]. Mfalme wa Israeli akamwambia, “Hivyo ndivyo hukumu yako itakavyokuwa[c]; wewe mwenyewe umeamua.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akifanya hili na lile.” Nahau ya Kiebrania ina maana ya kushughulika na mambo mbalimbali.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya moja kwa moja, “naye hayupo”; maana yake ni kwamba mtu aliyekuwa chini ya ulinzi hakuwepo tena.
    reason: lexical_alternative
  - marker: c
    text: Au, “Hiyo ndiyo hukumu yako” au “Huo ndio uamuzi wako.” Mfalme anakubali kwamba msemaji mwenyewe ametoa kipimo cha hukumu kitakachotumika dhidi yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Ni namna ya kujitaja kwa unyenyekevu mbele ya mfalme; hapa ‘mtumishi’ linafaa kuliko ‘mtumwa’ bila kuzidisha hali ya kijamii inayodokezwa.
- source_word: עֹשֵׂה הֵנָּה וָהֵנָּה
  choice: alipokuwa akishughulika huku na huku
  rationale: Nahau hii inaonyesha kuwa mtu alikuwa ametingwa na shughuli au mizunguko mbalimbali; Kiswahili hiki ni cha kawaida na kinahifadhi wazo la kuvurugwa na mambo mengi.
- source_word: וְהוּא אֵינֶנּוּ
  choice: yule mtu akawa hayupo
  rationale: Tafsiri hii inahifadhi usemi wa Kiebrania wa kutokuwapo bila kuongeza wazi kwamba alitoroka, ingawa muktadha unaelekeza hivyo.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: Mfalme wa Israeli
  rationale: Ni tafsiri ya moja kwa moja ya cheo hicho.
- source_word: כֵּן מִשְׁפָּטֶךָ
  choice: Hivyo ndivyo hukumu yako itakavyokuwa
  rationale: Inaonyesha hitimisho rasmi la kimahakama na kwamba matokeo yaliyotajwa yatatumika kwa msemaji.
- source_word: אַתָּה חָרָצְתָּ
  choice: wewe mwenyewe umeamua
  rationale: ‘Wewe mwenyewe’ linahifadhi msisitizo wa kiwakilishi cha Kiebrania, huku ‘umeamua’ likibeba maana ya kutoa uamuzi katika mazingira ya hukumu.
