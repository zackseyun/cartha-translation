  text: 'Fanya hivi: ondoa wafalme, kila mmoja kutoka mahali pake, na uwaweke magavana mahali pao.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת הַדָּבָר הַזֶּה עֲשֵׂה
  choice: Fanya hivi
  rationale: Hii ni amri ya utangulizi iliyo ya asili katika Kiswahili; maana ya דָּבָר hapa ni jambo au tendo, si lazima neno lililosemwa.
- source_word: הָסֵר
  choice: waondoe
  rationale: Kauli ya kuamuru ya Hifili ina maana ya kusababisha waondolewe; umbo hili halielezi kupita kiasi kama wanaondolewa kabisa katika ufalme au katika nafasi ya uongozi wa vita.
- source_word: הַמְּלָכִים אִישׁ מִמְּקֹמוֹ
  choice: wafalme, kila mmoja kutoka mahali pake
  rationale: אִישׁ baada ya nomino ya wingi ina maana ya kugawa mmoja mmoja. “Mahali pake” huhifadhi upana wa מָקוֹם, ambao unaweza kumaanisha mahali, cheo, au nafasi aliyopewa.
- source_word: וְשִׂים
  choice: nawe uwaweke
  rationale: שׂים kimsingi ni kuweka; katika muktadha huu ni kuwaweka watu wengine kuchukua nafasi zao.
- source_word: פַּחוֹת
  choice: watawala wa majimbo
  rationale: Neno hili humaanisha maafisa wa utawala, hasa magavana au watawala wa maeneo; “watawala wa majimbo” linaweka wazi hadhi yao ya kiutawala bila kuwafanya makamanda wa kijeshi tu.
- source_word: תַּחְתֵּיהֶם
  choice: mahali pao
  rationale: Ingawa kwa umbo la msingi linaweza kuwa “chini yao,” hapa ni nahau ya kuwabadilisha, yaani kuwaweka wengine mahali pao.
