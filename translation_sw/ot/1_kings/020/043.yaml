base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/043.yaml
  text: So the king of Israel went to his house sullen and angry[a], and he came to Samaria.
translation:
  language: sw
  text: Basi, mfalme wa Israeli akaenda nyumbani kwake akiwa amenuna na mwenye hasira[a], akafika Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa na kinyongo na mwenye hasira.” Maneno haya mawili ya Kiebrania yanaunganisha kutoridhika kwa ndani na hasira inayoonekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Ni kitenzi cha kawaida cha masimulizi kinachoendeleza mfululizo wa matukio; “akaenda” ni cha asili katika simulizi la Kiswahili.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Huhifadhi wazi muundo unaomtambulisha mhusika bila kuongeza ufafanuzi.
- source_word: עַל בֵּיתוֹ
  choice: nyumbani kwake
  rationale: Katika muktadha wa mwendo, עַל inaelekeza kwenye mahali pa kwenda. “Nyumbani kwake” ni Kiswahili cha kawaida na hakifasiri בֵּיתוֹ kwa upana zaidi kuwa “ikulu.”
- source_word: סַר
  choice: amenuna
  rationale: Katika jozi hii neno linaonyesha hali ya ndani ya kutoridhika au kinyongo; “amenuna” hutoa picha ya mtu aliyekasirika kimya na mwenye hali nzito.
- source_word: וְזָעֵף
  choice: mwenye hasira
  rationale: Neno linaonyesha kukasirika au kuudhika sana. “Mwenye hasira” ni wazi na huhifadhi sifa ya pili tofauti na kununa.
- source_word: וַיָּבֹא
  choice: akafika
  rationale: Ingawa maana ya msingi ni “akaja,” pamoja na mahali pa mwisho pa safari, “akafika” ni mtiririko wa asili wa Kiswahili na haibadili tukio.
- source_word: שֹׁמְרוֹנָה
  choice: Samaria
  rationale: Herufi ya mwelekeo inaonyesha mwendo kuelekea Samaria; baada ya “akafika,” jina la mahali hutumika moja kwa moja kwa Kiswahili.
