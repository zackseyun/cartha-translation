id: 1KI.20.29
reference: 1 Kings 20:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יַּחֲנ֧וּ אֵ֦לֶּה נֹ֥כַח אֵ֖לֶּה שִׁבְעַ֣ת יָמִ֑ים וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/תִּקְרַב֙ הַ/מִּלְחָמָ֔ה וַ/יַּכּ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל אֶת אֲרָ֛ם מֵאָה אֶ֥לֶף רַגְלִ֖י בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/029.yaml
  text: And these camped opposite those for seven days[a]. Then on the seventh day the battle drew near[c][b], and the sons of Israel struck down Aram—one hundred thousand foot soldiers in one day.
translation:
  language: sw
  text: Hawa wakapiga kambi wakikabiliana na wale kwa siku saba. Siku ya saba, vita vikakaribia, nao wana wa Israeli[a] wakawapiga watu wa Aramu[b], askari wa miguu[c] laki moja, katika siku moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania ni “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Waaramu.” Jina “Aramu” linaweza kumaanisha ufalme wa Aramu au watu wake.
    reason: lexical_alternative
  - marker: c
    text: Yaani, askari waliopigana kwa miguu.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה humaanisha kuweka au kupiga kambi; usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: אֵלֶּה נֹכַח אֵלֶּה
  choice: Hawa ... wakikabiliana na wale
  rationale: Muundo huu unahifadhi utofautishaji mfupi wa Kiebrania kati ya majeshi mawili na wazo la kukaa yakielekeana.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha muda uliotajwa.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Siku ya saba
  rationale: Kauli ya masimulizi ויהי imetolewa kwa njia ya asili katika Kiswahili bila kuongeza maneno mazito yasiyo ya lazima.
- source_word: וַתִּקְרַב הַמִּלְחָמָה
  choice: vita vikaanza
  rationale: Ingawa קרב kimsingi ni ‘karibia,’ hapa kishazi kinaonyesha kwamba majeshi yalianza kupigana; ‘vita vikaanza’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וַיַּכּוּ
  choice: wakawapiga
  rationale: נכה ni kitenzi kipana cha kupiga au kuangusha vitani. ‘Wakawapiga’ huhifadhi upana wake bila kulazimisha maana mahsusi ya ‘kuua’ au ‘kushinda.’
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili linafuata kwa karibu usemi halisi ‘wana wa Israeli’ na katika muktadha huu linarejelea jeshi la Israeli.
- source_word: אֲרָם
  choice: watu wa Aramu
  rationale: Jina Aramu limehifadhiwa badala ya kutumia jina la baadaye ‘Siria’; ‘watu wa’ huifanya Aramu kuwa yambwa ya asili katika Kiswahili huku ikionyesha maana ya pamoja ya ufalme au watu wake.
- source_word: מֵאָה אֶלֶף
  choice: laki moja
  rationale: ‘Laki moja’ ni namna ya kawaida na sahihi ya kusema 100,000 katika Kiswahili cha Afrika Mashariki.
- source_word: רַגְלִי
  choice: askari wa miguu
  rationale: Neno hili humaanisha wapiganaji wanaopigana kwa miguu; tafsiri hii ni wazi kuliko istilahi ya kijeshi isiyo ya kawaida kwa baadhi ya wasomaji.
- source_word: בְּיוֹם אֶחָד
  choice: kwa siku moja
  rationale: Usemi huu unaonyesha muda ambao tukio hilo lilitokea, yaani ndani ya siku moja.
theological_decisions:
- issue: Jinsi ya kutafsiri בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Maandishi ya Kiebrania yanasema kihalisi ‘wana wa Israeli.’ Muundo huo umehifadhiwa kwa kuwa ni wa kueleweka katika Kiswahili na hapa unarejelea wapiganaji wa Israeli.
- issue: Jinsi ya kutafsiri אֲרָם
  choice: watu wa Aramu
  alternative: Waaramu
  rationale: Uamuzi huu unahifadhi jina la mahali au ufalme Aramu huku ukiruhusu maana yake ya pamoja kwa watu wake, bila kuingiza jina la baadaye la kisiasa ‘Siria.’
- issue: Nguvu ya וַיַּכּוּ katika simulizi la vita
  choice: wakawapiga
  alternative: wakawaua
  rationale: Kitenzi cha Kiebrania kinaweza kuhusisha kuua katika muktadha wa vita, lakini chenyewe kina maana pana ya kupiga au kuangusha. Tafsiri haikufanya matokeo ya kifo kuwa ya moja kwa moja kuliko chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wazi, wa sasa na wenye heshima. Muundo mfupi ‘Hawa ... wale’ unadumisha ukinzani wa Kiebrania, huku ‘vita vikaanza’ ukitoa kwa njia ya asili nahau ya vita ‘vilikaribia.’
