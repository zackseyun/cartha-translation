translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa 'Wana wa Israeli' umehifadhiwa kwa sababu ya uzito wake wa kimapokeo, huku tanbihi ikitoa 'Waisraeli' kama namna ya kawaida zaidi. Tashbihi adimu imeelezwa kwa lugha ya kawaida bila kufuta hali yake isiyo ya kawaida.
