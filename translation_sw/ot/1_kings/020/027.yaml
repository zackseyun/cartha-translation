base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/027.yaml
  text: And the sons of Israel were mustered and supplied[a], and they went to meet them. The sons of Israel camped opposite them like two little flocks of goats[c][b], but Aram filled the land.
translation:
  language: sw
  text: Wana wa Israeli[a] walikusanywa na kupewa mahitaji[b], kisha wakaenda kuwakabili. Wana wa Israeli wakapiga kambi mkabala nao, kama makundi mawili madogo ya mbuzi[c], lakini Waaramu wakaijaza nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kinasema kihalisi “wana wa Israeli,” jina la jadi la watu hao kama jumuiya.
    reason: lexical_alternative
  - marker: b
    text: Au, “waliandaliwa kwa mahitaji” au “walitunzwa.” Inaelekea kitenzi hiki kinahusu kupatiwa mahitaji kwa ajili ya vita.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema kihalisi “kama חֲשִׂפֵי mbili za mbuzi.” Neno חֲשִׂפֵי ni adimu; picha hiyo inaonyesha vikundi vidogo sana vikilinganishwa na jeshi kubwa la Waaramu.
    reason: cultural_note
lexical_decisions:
- source_word: הָתְפָּקְדוּ
  choice: walikusanywa kwa ajili ya vita
  rationale: Kitenzi katika muktadha huu kinaonyesha kukusanywa au kuandikishwa kwa hatua ya kijeshi. Tafsiri hii ni ya kawaida kwa Kiswahili na inaweka wazi muktadha bila kuishusha kuwa kuhesabiwa tu.
- source_word: וְכָלְכְּלוּ
  choice: na kupewa mahitaji
  rationale: Mzizi כלכל hapa unaelekea kumaanisha kuandaliwa au kutunzwa kwa mahitaji ya shughuli ya kijeshi. Kauli hii ni pana vya kutosha kutodai kwamba ni chakula pekee kilichotolewa.
- source_word: לִקְרָאתָם
  choice: wakaenda kukabiliana nao
  rationale: Kirai hiki humaanisha kwenda kuonana au kukutana na mtu; katika mazingira ya vita, 'kukabiliana nao' huwasilisha kwa kawaida kwamba huu ulikuwa mkutano wa maadui.
- source_word: נֶגְדָּם
  choice: mbele yao
  rationale: נגד huonyesha nafasi ya kuwa mbele ya au mkabala na upande mwingine. 'Mbele yao' ni Kiswahili cha kawaida kinachoeleza kambi zinazokabiliana.
- source_word: כִּשְׁנֵי חֲשִׂפֵי עִזִּים
  choice: kama makundi mawili madogo ya mbuzi
  rationale: Neno חֲשִׂפֵי ni adimu na picha yake inaonyesha vikundi viwili vidogo vilivyotengwa. 'Makundi mawili madogo ya mbuzi' huhifadhi tashbihi na tofauti ya ukubwa bila kutumia usemi usioeleweka.
- source_word: וַאֲרָם מִלְאוּ אֶת־הָאָרֶץ
  choice: lakini Waaramu walijaa katika nchi yote
  rationale: Ingawa kiunganishi ni waw, muktadha unaweka tofauti dhahiri kati ya vikundi vidogo vya Israeli na jeshi kubwa la Aramu. Wingi wa kitenzi cha Kiebrania unaunga mkono 'Waaramu,' na 'walijaa' huhifadhi picha ya מלא.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi kwa kiasi kikubwa usemi wa agano wa Kiebrania badala ya kuubadilisha moja kwa moja kuwa 'Waisraeli,' huku ukiendelea kueleweka katika Kiswahili cha kibiblia.
