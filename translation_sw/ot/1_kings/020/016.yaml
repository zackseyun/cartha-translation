base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/016.yaml
  text: They went out at noon[a], while Ben-hadad was drinking himself drunk in the booths, he and the thirty-two kings who were helping him.
translation:
  language: sw
  text: Wakatoka adhuhuri, huku Ben-Hadadi akinywa mpaka akalewa vibandani[a], yeye na wale wafalme thelathini na wawili waliokuwa wakimsaidia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika makao ya muda.” Neno la Kiebrania linasema kihalisi “katika vibanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Wakatoka
  rationale: Kitenzi cha simulizi kutoka mzizi יצא kinaeleza kutoka kwao kwa mwendo wa kijeshi bila kuongeza wazo lisilokuwamo katika Kiebrania.
- source_word: בַּצָּהֳרָיִם
  choice: wakati wa adhuhuri
  rationale: Neno hili hutaja katikati ya mchana; “wakati wa adhuhuri” ni Kiswahili sanifu na cha kawaida.
- source_word: וּבֶן הֲדַד
  choice: huku Ben-hadadi
  rationale: Kiunganishi waw hapa kinaonyesha hali iliyokuwa ikiendelea wakati huo, si tu kuongeza tukio jingine; “huku” huonyesha vizuri samtidighet hiyo.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: akiwa anakunywa akiwa amelewa
  rationale: Kishirikishi שֹׁתֶה kinaonyesha tendo linaloendelea, na שִׁכּוֹר hali ya ulevi. Tafsiri hii inadumisha yote mawili bila kuongeza kinywaji ambacho hakikutajwa.
- source_word: בַּסֻּכּוֹת
  choice: vibandani
  rationale: סֻכּוֹת humaanisha vibanda au makao ya muda. “Vibandani” huhifadhi taswira halisi ya Kiebrania.
- source_word: הוּא וְהַמְּלָכִים
  choice: yeye pamoja na wale wafalme
  rationale: Kiwakilishi kinamtia Ben-hadadi mwenyewe katika kundi hilo; “yeye pamoja na” huweka msisitizo huo wazi na kwa Kiswahili cha kawaida.
- source_word: שְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ
  choice: wafalme thelathini na wawili
  rationale: Muundo wa nambari wa Kiebrania hutafsiriwa kwa wingi unaohitajika katika Kiswahili.
- source_word: עֹזֵר אֹתוֹ
  choice: waliokuwa wakimsaidia
  rationale: Kishirikishi cha עזר kinaonyesha msaada unaoendelea; kishazi hiki cha uhusiano kinaeleza kwa kawaida uhusiano wa wafalme hao na Ben-hadadi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha simulizi na chenye heshima. Jina Ben-hadadi limetoholewa kwa muundo unaosomeka kwa kawaida katika Kiswahili. Alama ya tanbihi imewekwa baada ya “vibandani,” ambako tofauti ya kileksika inahusika.
