    reason: lexical_alternative
  revision_rationale: The revision replaces the awkward repeated "akiwa" construction with natural narrative Swahili while retaining the action of drinking and its drunken result. It also narrows the lexical footnote to a defensible alternative without adding an unsupported sense of leisure or possession.
