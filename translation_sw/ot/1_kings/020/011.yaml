base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/011.yaml
  text: And the king of Israel answered and said[a], “Tell him, ‘Let not the one who girds on his armor boast like the one who takes it off.’”
translation:
  language: sw
  text: Mfalme wa Israeli akajibu, akasema[a], “Mwambieni, ‘Anayevaa silaha asijisifu kama yule anayezivua.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “Anayejifunga asijisifu kama anayefungua.” Vifaa vya vita vinaeleweka kutokana na muktadha. Methali hii inatofautisha kujiandaa kwa vita na kuvua vifaa hivyo baada ya vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: akajibu
  rationale: Ni matumizi ya kawaida ya kitenzi ענה katika utangulizi wa mazungumzo; ‘akajibu’ hudumisha mtiririko wa simulizi.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: Mfalme wa Israeli
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania, inayomtambulisha rasmi msemaji.
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Hudumisha mfuatano wa Kiebrania ‘akajibu, akasema’ badala ya kuondoa urudiaji wake wa kimakusudi.
- source_word: דַּבְּרוּ
  choice: Mwambieni
  rationale: Amri hii iko katika wingi na inaelekezwa kwa wajumbe; kiambishi cha mtendewa cha umoja kinaonyesha kwa kawaida kwamba ujumbe urudishwe kwa mfalme aliyewatuma.
- source_word: אַל יִתְהַלֵּל
  choice: asijisifu
  rationale: Muundo hasi wa kuzuia pamoja na hitpaeli ya הלל una maana ya kujisifu au kujigamba; ‘asijisifu’ ni ya kawaida na yenye hadhi.
- source_word: חֹגֵר
  choice: anayejifunga silaha
  rationale: Kihalisi ni ‘anayejifunga’; katika methali hii ya kivita, silaha au vifaa vya vita vinaeleweka kutokana na muktadha. ‘Anayejifunga silaha’ huhifadhi picha ya kujiandaa kwa vita.
- source_word: כִּמְפַתֵּחַ
  choice: kama yule anayezifungua
  rationale: Kitenzi פתח hapa kina maana ya kufungua au kulegeza kilichofungwa. Kinyume chake na חֹגֵר kinaonyesha kuvua vifaa baada ya vita; ‘kuzifungua’ huhifadhi kwa kiasi fulani picha halisi bila kuamua wazi kwamba ushindi umetajwa katika maneno yenyewe.
theological_decisions:
- issue: Iwapo anayefungua silaha lazima awe mshindi
  choice: Maandishi yanadumisha tu tofauti kati ya kujifunga na kufungua silaha.
  alternative: Kutafsiri moja kwa moja kuwa ‘anayezivua baada ya kushinda.’
  rationale: Methali inadokeza kumaliza vita kwa mafanikio, lakini ushindi hautajwi wazi katika Kiebrania; hivyo haujaingizwa katika mstari wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wa heshima na unaoeleweka kwa wasomaji wa kawaida. Urudiaji ‘akajibu, akasema’ umehifadhiwa kwa ulinganifu na mfumo wa Kiebrania; lugha ya methali imewekwa fupi na yenye uzito.
