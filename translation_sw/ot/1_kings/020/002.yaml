  text: And he sent messengers into the city[a], to Ahab king of Israel.
translation:
  language: sw
  text: Naye akatuma wajumbe mjini[a], kwa Ahabu mfalme wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuelekea mjini.” Umbo la Kiebrania lina kiambishi elekezi kwenye neno “mji,” kinachoonyesha mwendo kuelekea mjini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Naye akatuma
  rationale: Umbo la wayyiqtol la שׁלח linaendeleza simulizi kwa tendo lililopita; “akatuma” ni la kawaida katika simulizi la Kiswahili, na “naye” linaunganisha tendo hili na muktadha bila kufafanua zaidi uhusiano wake.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu wa kisiasa na kijeshi, neno hili linamaanisha watu waliotumwa kupeleka ujumbe, si malaika.
- source_word: אֶל אַחְאָב
  choice: kwa Ahabu
  rationale: Kihusishi אֶל kinamtaja mlengwa wa wajumbe; “kwa Ahabu” ni Kiswahili cha kawaida kinachoonyesha walikotumwa na mtu waliyemwendea.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Muundo huu wa umilikaji unamtambulisha Ahabu kwa cheo chake cha kifalme; Kiswahili hakihitaji kibainishi tofauti hapa.
- source_word: הָעִירָה
  choice: mjini
  rationale: Nomino עִיר yenye kiambishi elekezi -ה inaonyesha mwendo kuelekea au kuingia mjini. “Mjini” ni usemi wa asili wa Kiswahili unaohifadhi maana ya mahali pa kufikiwa, huku tanbihi ikionyesha uwezekano wa “kuelekea mjini.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Mpangilio “mjini, kwa Ahabu” umehifadhi tofauti kati ya mahali wajumbe walikoelekea na mtu waliyelengwa kumfikia. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya neno linalohusika.
