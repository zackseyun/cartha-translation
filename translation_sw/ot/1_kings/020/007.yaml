base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/007.yaml
  text: Then the king of Israel called all the elders of the land and said, “Please know and see that this man is seeking trouble, for he sent to me for my wives, my sons, my silver, and my gold, and I did not withhold them from him.”
translation:
  language: sw
  text: Ndipo mfalme wa Israeli akawaita wazee wote wa nchi, akawaambia, “Jueni basi, na oneni kwamba mtu huyu anatafuta mabaya; kwa maana alituma kwangu kudai wake zangu, wanangu, fedha yangu, na dhahabu yangu, nami sikumnyima.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּעוּ נָא וּרְאוּ
  choice: Tafadhali, fahamuni na mwone
  rationale: Inahifadhi ombi lenye msisitizo la vitenzi viwili ‘jueni/fahamuni’ na ‘oneni,’ huku likisikika kwa kawaida katika Kiswahili.
- source_word: רָעָה זֶה מְבַקֵּשׁ
  choice: mtu huyu anatafuta maafa
  rationale: רָעָה inaweza kumaanisha uovu, madhara, au maafa. Katika muktadha huu mfalme anasema kuwa Ben-hadadi ananuia kuleta madhara; ‘maafa’ huhifadhi upana huo bila kuamua kwamba anatafuta ugomvi tu.
- source_word: שָׁלַח אֵלַי לְנָשַׁי וּלְבָנַי וּלְכַסְפִּי וְלִזְהָבִי
  choice: alituma watu kwangu awadai wake zangu, wanangu, fedha yangu na dhahabu yangu
  rationale: Kitenzi ‘alituma’ kimetumiwa kwa maana ya kutuma ujumbe au wajumbe; ‘awadai’ huonyesha kwamba לְ hapa inaleta maana ya kudai vitu hivyo, si kuvitumia kama walengwa wa ujumbe.
- source_word: וְלֹא מָנַעְתִּי מִמֶּנּוּ
  choice: nami sikumnyima vitu hivyo
  rationale: Hutoa maana ya kutovizuia vitu vilivyotajwa kwake. ‘Vitu hivyo’ ni ufafanuzi mdogo unaohitajika kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya רָעָה katika madai ya mfalme
  choice: maafa
  alternative: uovu / shari / ugomvi
  rationale: Neno la Kiebrania lina upana wa maana. ‘Maafa’ linaelekeza kwenye madhara anayokusudia bila kuingiza hukumu ya kidhehebu au kupunguza dai hilo kuwa ugomvi pekee.
- issue: Kauli kwamba mfalme hakumnyima wake na wanawe
  choice: Kuidumisha kama ilivyo katika kauli ya mfalme
  alternative: Kufafanua kuwa alikubali tu madai ya kwanza bila kuwakabidhi tayari
  rationale: Aya yenyewe haielezi tofauti hiyo wazi. Tafsiri haipaswi kutatua mvutano wa simulizi kwa kuingiza maelezo kutoka nje ya sentensi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Wazee wa nchi’ huhifadhi cheo cha viongozi wa jamii; ‘wake zangu’ ni wingi wa mke unaofaa hapa. Muundo wa hotuba umesawazishwa bila kufuta msisitizo wa Kiebrania.
