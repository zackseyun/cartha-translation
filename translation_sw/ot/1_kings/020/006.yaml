base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/006.yaml
  text: No[a], but about this time tomorrow I will send my servants to you, and they will search your house and the houses of your servants; and whatever is desirable in your eyes[b], they will put into their hands and take away.
translation:
  language: sw
  text: La, bali kesho wakati kama huu nitawatuma watumishi wangu kwako. Watapekua nyumba yako na nyumba za watumishi wako; nao watavitia mikononi mwao vitu vyote vya thamani machoni pako[a] na kuvichukua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitu vyote vinavyopendeza machoni pako,” yaani, kila kitu unachokithamini sana.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “watavitia mikononi mwao na kuchukua”; usemi huu unamaanisha kujitwalia vitu na kwenda navyo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: La, bali
  rationale: Katika muktadha huu, muunganiko huu unapinga mpaka uliowekwa katika jibu lililotangulia na kuongeza ukali wa tishio. “La, bali” hudhihirisha nguvu hiyo ya kusahihisha kwa Kiswahili cha kawaida.
- source_word: כָּעֵת מָחָר
  choice: kesho karibu na wakati huu
  rationale: Ni usemi wa wakati unaoelekeza kwenye takriban saa kama hii siku inayofuata. Tafsiri hii ni wazi na ya kawaida kwa Kiswahili.
- source_word: עֲבָדַי
  choice: watumishi wangu
  rationale: Hapa neno hili linawahusu mawakala au wahudumu wa mfalme waliotumwa kutekeleza agizo lake; hadhi ya utumwa si jambo linalosisitizwa.
- source_word: וְחִפְּשׂוּ
  choice: wataipekua
  rationale: Kitenzi kina maana ya kutafuta au kuchunguza kwa makini. “Kupekua” linafaa kwa upekuzi wa nyumba kwa kusudi la kupata mali bila kuongeza moja kwa moja wazo la uharibifu.
- source_word: בֵּיתְךָ ... בָּתֵּי עֲבָדֶיךָ
  choice: nyumba yako na nyumba za watumishi wako
  rationale: בַּיִת linaweza kumaanisha nyumba au jumba la kifalme. “Nyumba” linahifadhi ulinganifu wa Kiebrania kati ya makao ya mfalme na yale ya watumishi wake.
- source_word: כָּל מַחְמַד עֵינֶיךָ
  choice: vitu vyote vya thamani machoni pako
  rationale: Usemi huu unamaanisha kila kitu ambacho mtu anakiona kuwa cha thamani, cha kutamanika, au cha kupendeza. Tafsiri inahifadhi nahau ya “machoni” huku maana ikieleweka.
- source_word: יָשִׂימוּ בְיָדָם
  choice: watavitia mikononi mwao
  rationale: Kiebrania kinasema kihalisi “wataweka mikononi mwao,” likionyesha kujitwalia vitu. Tafsiri hii inadumisha picha na mpangilio wa vitendo vya chanzo.
- source_word: וְלָקָחוּ
  choice: na kuvichukua
  rationale: Kitenzi cha mwisho kinakamilisha tishio la kunyang’anya mali na kuondoka nayo. “Kuvichukua” ni cha asili na kiko wazi katika muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa tishio na picha za Kiebrania zimehifadhiwa bila kufanya sentensi kuwa ngumu.
