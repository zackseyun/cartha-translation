base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/003.yaml
  text: 'And he said to him[a], “Thus says Ben-hadad: Your silver and your gold are mine; your wives and your sons, the best, are mine.”'
translation:
  language: sw
  text: 'Naye akamwambia, “Ben-Hadadi asema hivi: Fedha yako na dhahabu yako ni mali yangu; wake zako na wana wako walio bora ni mali yangu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: Naye akamwambia
  rationale: Muundo wa kawaida wa masimulizi; kiambishi -mw- kinaonyesha kwamba alisema maneno hayo kwake.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Ni kauli rasmi ya mjumbe inayotanguliza ujumbe ulionukuliwa; wakati wa sasa huhifadhi nguvu ya tangazo.
- source_word: בֶּן הֲדַד
  choice: Ben-hadadi
  rationale: Jina limetoholewa kwa tahajia na matamshi ya kawaida ya Kiswahili.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: Fedha yako na dhahabu yako
  rationale: Huhifadhi vitu vya thamani vilivyotajwa wazi badala ya kujumlisha fedha kuwa mali kwa ujumla.
- source_word: לִי הוּא
  choice: ni mali yangu
  rationale: Huwasilisha dai la umiliki kwa Kiswahili cha kawaida licha ya kiwakilishi cha Kiebrania kuwa katika umoja baada ya kiima ambatano.
- source_word: וְנָשֶׁיךָ
  choice: wake zako
  rationale: Katika muktadha huu wa familia, neno hilo linamaanisha wake, si wanawake kwa ujumla.
- source_word: וּבָנֶיךָ
  choice: wana wako
  rationale: Huhifadhi maana ya wana wa kiume kwa neno la Kiswahili lenye hadhi ya kifasihi na linalofaa katika muktadha wa familia.
- source_word: הַטּוֹבִים
  choice: walio bora
  rationale: Kivumishi kinaweza kuonyesha walio wazuri, bora, au wa kuchaguliwa; ‘walio bora’ ni cha asili katika muktadha wa kutwaa vitu na watu wenye thamani.
- source_word: לִי הֵם
  choice: ni mali yangu
  rationale: Kurudia dai la umiliki kunahifadhi msisitizo na ulinganifu wa kauli ya Kiebrania.
