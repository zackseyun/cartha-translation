  yaml_path: translation/ot/1_kings/020/008.yaml
  text: Then all the elders and all the people said to him[a], “Do not listen, and do not consent.”
translation:
  language: sw
  text: Ndipo wazee wote na watu wote wakamwambia, “Usisikilize wala usikubali.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usitii wala usiridhie.” Vitenzi vya Kiebrania vinaweza kumaanisha kusikiliza au kutii (שׁמע), na kuwa tayari, kuridhia, au kukubali (אבה).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ndipo ... wakamwambia
  rationale: Muundo wa wayyiqtol unaendeleza simulizi; ‘Ndipo’ huonyesha mfuatano kwa Kiswahili cha kawaida, na ‘wakamwambia’ hujumuisha kitenzi cha kusema pamoja na kiwakilishi cha mtendewa.
- source_word: אֵלָיו
  choice: -mwambia (yeye)
  rationale: Kiebrania kina kiwakilishi ‘kwake’; Kiswahili hukiwakilisha kwa kiambishi cha mtendewa -mw- bila kuongeza jina ‘Ahabu,’ ambalo halipo wazi katika aya hii.
- source_word: כָּל הַזְּקֵנִים
  choice: wazee wote
  rationale: Katika muktadha huu זְקֵנִים ni wazee wenye nafasi ya uongozi au ushauri, si wanaume wenye umri mkubwa tu.
- source_word: וְכָל הָעָם
  choice: na watu wote
  rationale: עָם inaonyesha jamii pana iliyokuwa pamoja na wazee; ‘watu wote’ ni tafsiri ya kawaida na iliyo wazi.
- source_word: אַל תִּשְׁמַע
  choice: Usisikilize
  rationale: שׁמע inaweza kumaanisha kusikia, kusikiliza, au kutii. ‘Usisikilize’ huhifadhi upana huo bila kuamua kimya kimya kwamba maana ni utii pekee.
- source_word: וְלֹא תֹאבֶה
  choice: wala usikubali
  rationale: אבה huonyesha kuwa tayari, kuridhia, au kukubali. ‘Usikubali’ ni ya asili katika muktadha wa kukataa madai, na ‘wala’ huunganisha makatazo hayo mawili kwa Kiswahili fasaha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wazee’ limetumiwa kwa viongozi wa jamii; sentensi imehifadhi makatazo mawili tofauti na utata wa kimsamiati wa vitenzi vya Kiebrania.
