base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/017.yaml
  text: Then the young men of the commanders of the provinces went out first[a], and Ben-hadad sent, and they reported to him, saying, “Men have come out from Samaria.”
translation:
  language: sw
  text: Kisha vijana wa wakuu wa majimbo wakatoka kwanza, na Ben-hadadi akatuma, nao wakamwarifu wakisema, “Wanaume wametoka Samaria.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעֲרֵי
  choice: vijana wa
  rationale: Neno נַעַר linaweza kumaanisha kijana, mtumishi, au msaidizi. “Vijana” huhifadhi maana yake ya msingi bila kuondoa uwezekano kwamba walikuwa wasaidizi wa kijeshi.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: wakuu wa majimbo
  rationale: שָׂרִים ni wakuu, maafisa, au makamanda, na מְדִינוֹת ni majimbo ya kiutawala. “Wakuu wa majimbo” ni ya kawaida na haiweki wazi cheo cha kijeshi ambacho Kiebrania hakibainishi kikamilifu.
- source_word: בָּרִאשֹׁנָה
  choice: kwanza
  rationale: Hueleza utangulizi katika mpangilio wa matukio bila kuongeza wazo maalumu la ‘wimbi la kwanza’ la mashambulizi.
- source_word: וַיִּשְׁלַח
  choice: akatuma watu
  rationale: Kitenzi chenyewe ni “akatuma” bila kutaja waliotumwa. Kiswahili cha kawaida huhitaji shamirisho hapa; “watu” linaifanya sentensi iwe wazi bila kuwataja mahsusi kuwa wapelelezi.
- source_word: וַיַּגִּידוּ לוֹ לֵאמֹר
  choice: nao wakamletea habari wakisema
  rationale: נגד katika Hifili humaanisha kutoa taarifa au kuleta habari. Tafsiri hii inafaa muktadha wa kijeshi na inadumisha utangulizi wa maneno ya moja kwa moja.
- source_word: אֲנָשִׁים
  choice: Watu
  rationale: Ingawa אֲנָשִׁים mara nyingi humaanisha wanaume, katika taarifa hii “watu” ni Kiswahili cha kawaida na hakiongezi utambulisho wa wapiganaji ambao haujasemwa wazi.
- source_word: יָצְאוּ מִשֹּׁמְרוֹן
  choice: wametoka Samaria
  rationale: Kauli timilifu inaonyesha tendo lililokamilika wakati wa taarifa; “wametoka Samaria” ni ya asili na huhifadhi maana ya kutoka mjini.
- source_word: בֶּן הֲדַד
  choice: Ben-hadadi
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Kiswahili cha Biblia.
