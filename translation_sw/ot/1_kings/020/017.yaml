  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa msomaji wa kawaida. Uambatano wa vitenzi vya Kiebrania umegawanywa kwa uakifishaji wa kawaida wa Kiswahili.
