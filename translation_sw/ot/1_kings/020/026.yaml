  yaml_path: translation/ot/1_kings/020/026.yaml
  text: At the turn of the year[c][b][a], Ben-hadad mustered Aram and went up to Aphek for battle with Israel.
translation:
  language: sw
  text: Ikawa, mwaka uliporudia[a], Ben-Hadadi akakusanya jeshi la Aramu[b], akapanda kwenda Afeki kupigana na Israeli[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa maana halisi, ‘mwaka uliporudi,’ yaani mzunguko wa mwaka ulipofika tena; wengine hutafsiri ‘wakati wa majira ya kuchipua.’
    reason: lexical_alternative
  - marker: b
    text: Au ‘Waaramu.’ Neno la Kiebrania ‘Aramu’ linaweza kumaanisha ufalme huo au watu na jeshi lake.
    reason: lexical_alternative
  - marker: c
    text: Au ‘dhidi ya Israeli.’ Kihusishi cha Kiebrania kwa maana halisi ni ‘na,’ nacho kimetumiwa hapa katika muktadha wa vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: mwanzoni mwa mwaka mpya
  rationale: Nahau hiyo ina maana halisi ya ‘mwaka uliporudi,’ yaani mzunguko wa mwaka ulipoanza tena. ‘Mwanzoni mwa mwaka mpya’ ni Kiswahili cha kawaida bila kuamua kimya kwamba ilikuwa majira ya kuchipua.
- source_word: וַיִּפְקֹד
  choice: akakusanya jeshi
  rationale: Katika muktadha wa kijeshi, פקד humaanisha kukusanya, kukagua, au kuhesabu askari kwa ajili ya vita. ‘Akakusanya jeshi’ huwasilisha tendo hilo kwa Kiswahili cha kawaida.
- source_word: אֶת אֲרָם
  choice: jeshi la Aramu
  rationale: Kiebrania kinataja ‘Aramu,’ lakini hapa ufalme au watu wake wanakusanywa kwa kampeni ya kijeshi. ‘Jeshi la Aramu’ huweka jina la asili na kufanya maana ya kimuktadha ieleweke.
- source_word: וַיַּעַל
  choice: akapanda kwenda
  rationale: Kitenzi עלה ni ‘kupanda/kwenda juu.’ ‘Akapanda kwenda’ huhifadhi taswira ya Kiebrania na mwendo wa kijeshi bila kuongeza maana isiyotajwa.
- source_word: אֲפֵקָה
  choice: kwenda Afeki
  rationale: Kiambishi cha mwelekeo katika jina kinaonyesha mwendo kuelekea Afeki; Kiswahili huieleza kwa ‘kwenda Afeki.’
- source_word: לַמִּלְחָמָה
  choice: kupigana
  rationale: Nomino hiyo humaanisha vita au mapigano. Katika sentensi hii, ‘kupigana’ ni njia ya kawaida na wazi ya kueleza kusudi la safari.
- source_word: עִם יִשְׂרָאֵל
  choice: na Israeli
  rationale: Kihusishi עִם maana yake halisi ni ‘na/pamoja na’; katika muktadha wa vita kinaonyesha upande unaopigwa. ‘Kupigana na Israeli’ ni Kiswahili cha kawaida na huhifadhi kwa karibu muundo wa chanzo.
