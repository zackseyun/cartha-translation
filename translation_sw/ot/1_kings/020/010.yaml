  text: וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ בֶּן הֲדַ֔ד וַ/יֹּ֕אמֶר כֹּֽה יַעֲשׂ֥וּ/ן לִ֛/י אֱלֹהִ֖ים וְ/כֹ֣ה יוֹסִ֑פוּ אִם יִשְׂפֹּק֙ עֲפַ֣ר שֹׁמְר֔וֹן לִ/שְׁעָלִ֕ים לְ/כָל הָ/עָ֖ם אֲשֶׁ֥ר בְּ/רַגְלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/010.yaml
  text: Ben-hadad sent to him and said[a], “May the gods do so to me, and more also, if the dust of Samaria will be enough for handfuls for all the people who are at my feet.”
translation:
  language: sw
  text: Ben-Hadadi akatuma ujumbe kwake, akisema[a], “Miungu na inifanyie hivyo, na zaidi, ikiwa mavumbi ya Samaria yatatosha kwa konzi za watu wote walio miguuni pangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa karibu zaidi: “ikiwa mavumbi ya Samaria yatatosha kwa konzi za watu wote walio miguuni pangu.” Huu ni usemi wa majivuno: Ben-Hadadi anadai kwamba mavumbi ya Samaria hayangetosha hata kwa konzi za watu wake wote.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: akatuma ujumbe kwake
  rationale: Muktadha ni mawasiliano ya kidiplomasia; ‘akatuma ujumbe’ ni Kiswahili cha kawaida kinachoonyesha maana bila kudai wazi kwamba wajumbe ndio waliotumwa.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadadi
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: כֹּה יַעֲשׂוּן לִי אֱלֹהִים וְכֹה יוֹסִפוּ
  choice: Miungu na initendee hivyo, na kuzidi
  rationale: Hii huhifadhi muundo wa kiapo chenye laana na wingi wa אֱלֹהִים katika kinywa cha mfalme asiye Mwisraeli.
- source_word: אִם
  choice: ikiwa
  rationale: Huhifadhi umbo la sharti katika kiapo bila kufafanua kwa maneno ya ziada laana iliyodokezwa.
- source_word: יִשְׂפֹּק
  choice: yatatosha
  rationale: Hutoa kwa kawaida maana ya kutosha.
- source_word: עֲפַר שֹׁמְרוֹן
  choice: mavumbi ya Samaria
  rationale: Huhifadhi uhusiano wa moja kwa moja wa maneno hayo na picha ya mavumbi ya mji.
- source_word: לִשְׁעָלִים
  choice: konzi moja
  rationale: Katika muktadha huu neno linaeleweka kama kiasi kinachotoshea katika kiganja, si ‘mbweha’; ‘konzi moja’ huwasilisha majivuno ya kutotosha kwa mavumbi hayo kwa kila mtu.
- source_word: לְכָל הָעָם אֲשֶׁר בְּרַגְלָי
  choice: kila mmoja wa watu wote walio miguuni pangu
  rationale: Huhifadhi nahau ya Kiebrania ‘walio miguuni pangu,’ inayomaanisha walio chini ya amri yake au wanaomfuata, huku ‘kila mmoja’ ikifafanua mgawanyo unaodaiwa na majivuno hayo.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika kiapo cha mfalme mpagani
  choice: Miungu
  alternative: Mungu
  rationale: Msemaji ni Ben-Hadadi, mfalme asiye Mwisraeli; wingi wa kitenzi pamoja na mazingira unaelekeza kwa miungu yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kiapo umeachwa kwa namna ya kimakusudi kuwa wa kifomula, na nahau ‘walio miguuni pangu’ imehifadhiwa huku tanbihi ikieleza maana yake katika majivuno ya kijeshi.
