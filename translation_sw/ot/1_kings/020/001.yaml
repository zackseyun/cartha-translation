  text: וּ/בֶן הֲדַ֣ד מֶֽלֶךְ אֲרָ֗ם קָבַץ֙ אֶת כָּל חֵיל֔/וֹ וּ/שְׁלֹשִׁ֨ים וּ/שְׁנַ֥יִם מֶ֛לֶךְ אִתּ֖/וֹ וְ/ס֣וּס וָ/רָ֑כֶב וַ/יַּ֗עַל וַ/יָּ֨צַר֙ עַל שֹׁ֣מְר֔וֹן וַ/יִּלָּ֖חֶם בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/001.yaml
  text: Ben-hadad king of Aram gathered all his army[a], and thirty-two kings with him, and horses and chariots[b]; then he went up and besieged Samaria and fought against it.
translation:
  language: sw
  text: Ben-Hadadi[a], mfalme wa Aramu,[b] alikusanya jeshi lake lote, pamoja na wafalme thelathini na wawili waliokuwa naye, farasi na magari ya vita. Kisha akapanda, akauzingira Samaria na akapigana dhidi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naye Ben-Hadadi.” Kiunganishi cha mwanzo kinaweza kutafsiriwa wazi kuwa “naye.”
    reason: lexical_alternative
  - marker: b
    text: “Aramu” ndilo jina la mahali katika Kiebrania; kwa jadi limetafsiriwa “Siria.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֶן הֲדַד
  choice: Ben-Hadadi
  rationale: Jina limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili. Kiunganishi וּ־ hakijawekwa katika matini kuu kwa sababu hapa kinaendeleza simulizi; uwezekano wa kukitafsiri wazi umehifadhiwa katika tanbihi [a].
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: Aramu linafuata moja kwa moja jina la mahali la Kiebrania אֲרָם badala ya jina la jadi Siria.
- source_word: קָבַץ אֶת כָּל חֵילוֹ
  choice: alikusanya jeshi lake lote
  rationale: קבץ ni ‘kukusanya,’ na חַיִל katika muktadha huu ni jeshi au nguvu za kijeshi.
- source_word: וּשְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ אִתּוֹ
  choice: pamoja na wafalme thelathini na wawili waliokuwa naye
  rationale: Kauli hii inaonyesha wafalme washirika walioandamana na Ben-Hadadi; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha wazo la kuwa pamoja naye.
- source_word: וְסוּס וָרָכֶב
  choice: farasi na magari ya vita
  rationale: Nomino za Kiebrania zimetumiwa kwa maana ya jumla ya kijeshi. ‘Magari ya vita’ hufafanua רֶכֶב kwa usahihi kuliko ‘magari’ peke yake.
- source_word: וַיַּעַל
  choice: Kisha akapanda
  rationale: עלה kimsingi ni ‘kupanda/kwenda juu’; ‘kisha’ na kiambishi ka- vinaonyesha mfuatano wa simulizi bila kuifanya kuwa ‘alishambulia.’
- source_word: וַיָּצַר עַל שֹׁמְרוֹן
  choice: akauzingira Samaria
  rationale: צור על katika muktadha wa kijeshi humaanisha kuuzingira mji ili kuushambulia au kuushurutisha ujisalimishe.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: na kupigana dhidi yake
  rationale: לחם ב־ ni kupigana dhidi ya mlengwa. ‘Dhidi yake’ inadumisha kirejeleo cha kike cha Kiebrania kinachorudi kwa Samaria bila kuongeza kwamba mji ulitekwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye hadhi. Muundo wa vitenzi vya mfululizo na kiambishi ka- unafaa usimulizi wa Kiswahili, huku ‘magari ya vita’ na ‘akauzingira’ zikitoa maana ya kijeshi bila lugha ya kizamani.
