  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Mfululizo wa vitenzi vya “waka-/aka-” unadumisha mwendo wa simulizi la Kiebrania. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
