  naturalness: Kiswahili kwa ujumla ni sanifu na kinatiririka. “Ukuta ukaanguka juu ya...” ni tafsiri ya moja kwa moja na ya kawaida, bila kudai zaidi ya matini. “Chumba cha ndani” ni cha asili katika Kiswahili na huacha nafasi ya utata wa usemi wa Kiebrania; tanbihi huhifadhi usemi halisi.
  terminology: “Afeki,” “Ben-hadadi,” “walionusurika,” na “wanaume elfu ishirini na saba” zinafaa. “Walio baki” katika tukio la pili hudumisha maana ya הַנּוֹתָרִים. Tanbihi inapaswa kueleza usemi bila kuingiza hoja ya kujificha.
