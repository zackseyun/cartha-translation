base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/030.yaml
  text: The survivors fled to Aphek[a], into the city, and the wall fell on twenty-seven thousand of the remaining men. Ben-hadad also fled and entered the city, into an inner room.
translation:
  language: sw
  text: Walionusurika wakakimbilia Afeki, ndani ya mji; ukuta ukaanguka juu ya wanaume elfu ishirini na saba waliobaki. Ben-hadadi naye akakimbia, akaingia mjini, katika chumba cha ndani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “chumba ndani ya chumba,” usemi unaoweza kumaanisha chumba cha ndani au cha ndani kabisa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָרִים
  choice: walionusurika / waliokuwa wamebaki
  rationale: Neno hili humaanisha wale waliosalia baada ya mapigano. “Walionusurika” ni Kiswahili cha kawaida katika muktadha huu; katika kutokea kwake mara ya pili, “waliokuwa wamebaki” huepuka urudiaji usio wa lazima huku ikihifadhi maana.
- source_word: אֲפֵקָה
  choice: Afeki
  rationale: Herufi ya mwelekeo inaonyesha kwenda Afeki. Muundo “wakakimbilia Afeki” huwasilisha mwelekeo huo kwa Kiswahili cha kawaida.
- source_word: אֶל הָעִיר / אֶל הָעִיר
  choice: ndani ya mji / mjini
  rationale: Matukio yote mawili ya “mji” yamehifadhiwa; utofauti wa kisarufi unafanya simulizi lisikike kwa kawaida bila kubadili rejeo.
- source_word: וַתִּפֹּל הַחוֹמָה
  choice: ukuta ukawaangukia
  rationale: Neno la Kiebrania lina kibainishi, hivyo “ukuta” unaeleweka kuwa ukuta wa mji au sehemu yake. Kitenzi chenye kiambishi cha yambwa huonyesha wazi kwamba uliwaangukia watu.
- source_word: עַל עֶשְׂרִים וְשִׁבְעָה אֶלֶף אִישׁ
  choice: wanaume elfu ishirini na saba
  rationale: Idadi imetolewa kwa mpangilio wa kawaida wa Kiswahili. “Wanaume” inafaa kwa אִישׁ katika muktadha wa jeshi.
- source_word: וּבֶן הֲדַד
  choice: Ben-hadadi naye
  rationale: “Naye” huonyesha kwa kawaida kwamba Ben-hadadi pia alikimbia, sambamba na walionusurika waliotajwa kwanza.
- source_word: נָס
  choice: akakimbia
  rationale: Huhifadhi uhusiano wa kileksia na kitenzi cha mwanzo na dharura ya kutoroka.
- source_word: חֶדֶר בְּחָדֶר
  choice: akajificha katika chumba cha ndani kabisa
  rationale: Kirai hicho ni “chumba ndani ya chumba” kwa uhalisia na huelekea kumaanisha chumba cha ndani sana kilichotumiwa kujificha. “Akajificha” huweka wazi maana inayodokezwa na muktadha; uhalisia umehifadhiwa katika tanbihi.
theological_decisions: []
