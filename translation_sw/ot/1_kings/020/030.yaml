  to: Walionusurika wakakimbilia Afeki, ndani ya mji; ukuta ukaanguka juu ya wanaume elfu ishirini na saba waliobaki. Ben-hadadi naye akakimbia, akaingia mjini, katika chumba cha ndani.[a]
  rationale: Marekebisho yanaondoa upinzani na tendo la kujificha vilivyoongezwa, huku yakihifadhi mpangilio wa matukio, idadi, na maana ya usemi wenye utata. Tanbihi imefungwa kwenye “chumba cha ndani” na huhifadhi uhalisia wa Kiebrania bila kulazimisha tafsiri moja.
