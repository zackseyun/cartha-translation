base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/020.yaml
  text: And each man struck down his man[a], and Aram fled, and Israel pursued them[b]. But Ben-hadad king of Aram escaped on a horse with horsemen.
translation:
  language: sw
  text: Kila mtu akampiga yule aliyekuwa akikabiliana naye[a]. Watu wa Aramu wakakimbia, nao Waisraeli wakawafuatilia. Lakini Ben-Hadadi, mfalme wa Aramu, akatoroka akiwa amepanda farasi pamoja na wapanda-farasi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kila mtu akampiga mtu wake,” yaani, kila mmoja akampiga mtu aliyekuwa akikabiliana naye.
    reason: lexical_alternative
  - marker: b
    text: Au, “akatoroka kwa farasi, akiwa pamoja na wapanda-farasi.” Kiebrania kinaweza kumaanisha kwamba Ben-Hadadi alitoroka akiwa amepanda farasi na akifuatana na wapanda-farasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: akampiga
  rationale: Katika muktadha wa vita, נכה humaanisha kupiga kwa nguvu na kumshinda mtu. ‘Akampiga’ huhifadhi maana hiyo bila kudai wazi kwamba alimwua.
- source_word: אִישׁ אִישׁוֹ
  choice: Kila mtu ... yule aliyekuwa akikabiliana naye
  rationale: Nahau ya Kiebrania ni kihalisi ‘kila mtu mtu wake’ na humaanisha kwamba kila mpiganaji alimpiga mpinzani aliyekuwa mbele yake. Tafsiri hii inaeleza maana kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi muundo halisi.
- source_word: אֲרָם
  choice: Aramu / Watu wa Aramu
  rationale: Jina la kale ‘Aramu’ linahifadhiwa badala ya kutumia ‘Siria’. Katika kishazi cha kukimbia, ‘Watu wa Aramu’ huonyesha kwa kawaida kwamba kinachokusudiwa ni jeshi au watu wake.
- source_word: וַיָּנֻסוּ
  choice: wakakimbia
  rationale: Kitenzi hiki kinaonyesha kukimbia kutoka vitani; ‘wakakimbia’ ni wazi na cha kawaida katika simulizi.
- source_word: וַיִּרְדְּפֵם
  choice: wakawafuatilia
  rationale: רדף katika muktadha wa kijeshi ni kuwafuata maadui wanaokimbia; ‘wakawafuatilia’ ni tafsiri ya asili na yenye hadhi.
- source_word: וַיִּמָּלֵט
  choice: akatoroka
  rationale: Katika tukio hili la kuokoka hatari ya vita, ‘akatoroka’ huwasilisha maana bila kuingiza wazo la kitheolojia lisilotajwa.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadadi
  rationale: Jina limetoholewa kwa tahajia inayosikika kwa kawaida katika Kiswahili huku likibaki karibu na umbo la Kiebrania.
- source_word: עַל סוּס
  choice: akiwa amepanda farasi
  rationale: Huwakilisha moja kwa moja farasi mmoja anayemtaja maandishi na ni Kiswahili cha kawaida kwa namna ya kutoroka.
- source_word: וּפָרָשִׁים
  choice: pamoja na wapanda-farasi
  rationale: Neno hili linamaanisha waendeshaji farasi. ‘Pamoja na’ linaonyesha uwezekano kwamba walikuwa waandamani wake, huku tanbihi ikitaja uwezekano mwingine wa kisarufi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mfululizo wa vitenzi vya simulizi umetolewa kwa viambishi vya -ka-. Jina Aramu limehifadhiwa, lakini ‘Watu wa Aramu’ limetumiwa pale taifa linapowakilisha jeshi lake ili sentensi iwe ya kawaida. Alama ya tanbihi [b] imewekwa baada ya kishazi cha kutoroka ambacho tanbihi hiyo inakieleza.
