  text: וְ/הִנֵּ֣ה נָבִ֣יא אֶחָ֗ד נִגַּשׁ֮ אֶל אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֗אמֶר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הְֽ/רָאִ֔יתָ אֵ֛ת כָּל הֶ/הָמ֥וֹן הַ/גָּד֖וֹל הַ/זֶּ֑ה הִנְ/נִ֨י נֹתְנ֤/וֹ בְ/יָֽדְ/ךָ֙ הַ/יּ֔וֹם וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/013.yaml
  text: 'And behold[a], a certain prophet came near to Ahab king of Israel and said, “Thus says Yahweh: Have you seen all this great multitude? Behold, I am giving it into your hand today, and you shall know that I am Yahweh.”'
translation:
  language: sw
  text: 'Tazama, nabii mmoja akamkaribia Ahabu, mfalme wa Israeli, akasema, “Yahweh asema hivi: ‘Je, umeona umati huu mkubwa wote[a]? Tazama, leo nitautia mkononi mwako, nawe utajua kwamba mimi ni Yahweh.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jeshi hili lote kubwa” au “kundi hili lote kubwa”; neno la Kiebrania linaweza kumaanisha umati au jeshi kubwa, na hapa linahusu jeshi la adui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Inahifadhi nguvu ya kishazi cha Kiebrania kinachoelekeza fikira kwenye tukio jipya la kushangaza, kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: נָבִיא אֶחָד
  choice: nabii mmoja
  rationale: Muundo huu humtambulisha mtu asiyeainishwa; “nabii mmoja” ni wa asili katika Kiswahili na unabaki karibu na Kiebrania.
- source_word: נִגַּשׁ אֶל
  choice: akamkaribia
  rationale: Kitenzi hiki huonyesha kusogea karibu na mtu; “akamkaribia” ni sahihi na cha kawaida katika simulizi.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Inatoa kwa kawaida kauli rasmi ya mjumbe wa kinabii huku ikihifadhi wakati wa usemi unaoendelea.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Inawakilisha jina la Mungu lililoandikwa moja kwa moja katika matini ya Kiebrania.
- source_word: הֲרָאִיתָ
  choice: Je, umeona
  rationale: Kauli timilifu yenye swali inaelekeza kwenye jeshi linaloonekana tayari mbele ya Ahabu.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: umati huu wote mkubwa
  rationale: “Umati” huhifadhi maana pana ya kundi kubwa bila kuamua kimyakimya kwamba nomino yenyewe humaanisha jeshi, ingawa muktadha ni wa kijeshi.
- source_word: הִנְנִי נֹתְנוֹ
  choice: Tazama, leo nitautia
  rationale: “Tazama” huhifadhi msisitizo wa הִנְנִי, na wakati ujao wa Kiswahili huwasilisha tendo la Mungu lililo karibu na hakika kwa namna ya asili.
- source_word: בְיָדְךָ
  choice: mkononi mwako
  rationale: Inahifadhi nahau ya Kiebrania ya kumweka adui chini ya mamlaka ya mtu, nayo inaeleweka katika Kiswahili.
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: nawe utajua kwamba mimi ni Yahweh
  rationale: Inahifadhi kauli ya utambuzi unaotokana na tendo la ukombozi la Mungu bila kufafanua zaidi aina ya maarifa hayo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Nguvu ya kauli וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: nawe utajua kwamba mimi ni Yahweh
  alternative: ndipo utakapotambua ukuu au enzi ya Yahweh
  rationale: Tafsiri haiongezi kiini cha kile Ahabu atakachotambua, hivyo inadumisha upeo na mvutano wa kauli ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa sasa. Muundo “akamkaribia” na nahau “mkononi mwako” huhifadhi ladha ya chanzo bila kuwa mgumu; “umati” huacha wazi upana wa neno la Kiebrania, na tanbihi hufafanua muktadha wa kijeshi.
