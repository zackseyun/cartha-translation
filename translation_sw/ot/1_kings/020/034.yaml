  text: וַ/יֹּ֣אמֶר אֵלָ֡י/ו הֶ/עָרִ֣ים אֲשֶׁר לָֽקַח אָבִ/י֩ מֵ/אֵ֨ת אָבִ֜י/ךָ אָשִׁ֗יב וְ֠/חוּצוֹת תָּשִׂ֨ים לְ/ךָ֤ בְ/דַמֶּ֨שֶׂק֙ כַּ/אֲשֶׁר שָׂ֤ם אָבִ/י֙ בְּ/שֹׁ֣מְר֔וֹן וַ/אֲנִ֖י בַּ/בְּרִ֣ית אֲשַׁלְּחֶ֑/ךָּ וַ/יִּכְרָת ל֥/וֹ בְרִ֖ית וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/034.yaml
  text: Then he said to him[a], “The cities that my father took from your father I will restore, and you may establish streets for yourself in Damascus, as my father established them in Samaria.” And I, in the treaty[c][b], will let you go.” So he made a treaty with him and let him go.
translation:
  language: sw
  text: 'Ndipo Ben-hadadi akamwambia, “Miji ambayo baba yangu aliitwaa kutoka kwa baba yako nitakurudishia, nawe unaweza kujiwekea mitaa[a] huko Damaski, kama baba yangu alivyojiwekea huko Samaria.”


    Ahabu akasema, “Nami nitakuacha uende kwa agano hili[b].” Basi Ahabu akafanya agano[c] naye, akamwacha aende.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “barabara” au “maeneo ya wazi.” Neno la Kiebrania lina maana hizo kihalisi; hapa huenda linamaanisha mitaa au maeneo ya biashara yaliyotolewa kwa masharti ya mapatano.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa mapatano haya” au “kwa mkataba huu.” Neno la Kiebrania pia hutafsiriwa “agano,” lakini hapa linahusu makubaliano ya kisiasa kati ya wafalme.
    reason: alternative_reading
  - marker: c
    text: Kiebrania kinasema kihalisi, “akakata agano naye,” nahau ya kufanya rasmi makubaliano yanayowafunga wahusika.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָרִים
  choice: miji
  rationale: עִיר humaanisha mji au jiji; “miji” inafaa katika muktadha wa maeneo yaliyotekwa na kurejeshwa kati ya falme.
- source_word: לָקַח ... אָשִׁיב
  choice: aliitwaa ... nitakurudishia
  rationale: Jozi hii inaonyesha kutwaa milki na baadaye kuirudisha. “Aliitwaa” na “nitakurudishia” ni ya asili katika Kiswahili na huhifadhi wazo la kurejesha maeneo.
- source_word: וְחוּצוֹת
  choice: mitaa
  rationale: חוּצוֹת kimsingi ni barabara au maeneo ya wazi, lakini hapa huenda inamaanisha mitaa yenye haki za kibiashara au kiutawala. “Mitaa” huhifadhi maana ya kimji bila kuamua kabisa matumizi yake.
- source_word: תָּשִׂים לְךָ בְדַמֶּשֶׂק
  choice: unaweza kujiwekea ... huko Damaski
  rationale: שׂים ni kuweka au kuanzisha; muundo huu katika mapatano unampa Ahabu ruhusa ya kuwa na mitaa au maeneo yake. “Unaweza kujiwekea” huwasilisha ruhusa hiyo kwa Kiswahili cha kawaida.
- source_word: כַּאֲשֶׁר שָׂם אָבִי בְּשֹׁמְרוֹן
  choice: kama baba yangu alivyojiwekea huko Samaria
  rationale: Kitenzi kilekile שׂים kinarudiwa, hivyo “alivyojiwekea” hudumisha ulinganifu na mpango uliokuwapo Samaria.
- source_word: בַּבְּרִית
  choice: kwa agano hili
  rationale: בְּרִית ni agano au mapatano yanayofunga wahusika. Hapa ni makubaliano ya kisiasa kati ya wafalme; “agano” hudumisha neno pana la Kiebrania, huku tanbihi ikieleza maana ya kisiasa.
- source_word: אֲשַׁלְּחֶךָּ ... וַיְשַׁלְּחֵהוּ
  choice: nitakuacha uende ... akamwacha aende
  rationale: Katika muktadha huu שׁלח ni kumwachilia mfalme aliyeshindwa. Kurudia “kuacha aende” hudumisha ahadi na kutimizwa kwake.
- source_word: וַיִּכְרָת לוֹ בְרִית
  choice: akafanya agano naye
  rationale: כרת ברית, kihalisi “kukata agano,” ni nahau ya kawaida ya kufanya makubaliano yanayofunga. Kiswahili cha asili hutumia “kufanya agano.”
theological_decisions:
- issue: Maana ya בְּרִית katika makubaliano kati ya wafalme
  choice: agano
  alternative: mapatano; mkataba
  rationale: Neno la Kiebrania ni lilelile linaloweza kumaanisha agano katika miktadha mingine, lakini hapa linahusu makubaliano ya kisiasa. “Agano” huhifadhi uhusiano huo wa kileksia bila kulifanya kuwa agano la Mungu na wanadamu; tanbihi inaeleza muktadha.
- issue: Mabadiliko ya msemaji katika וַאֲנִי בַּבְּרִית אֲשַׁלְּחֶךָּ
  choice: Kauli imewasilishwa kama jibu la Ahabu
  alternative: Kuendeleza maneno yote kana kwamba yamesemwa na Ben-hadadi
  rationale: Kiwakilishi cha mkazo וַאֲנִי, “nami,” kinaashiria jibu la Ahabu kwa masharti ya Ben-hadadi, ingawa maandishi ya Kiebrania hayana kitenzi kipya cha kusema. Kutaja msemaji huzuia mkanganyiko bila kubadili kiini cha mazungumzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa sasa. Majina “Ben-hadadi,” “Ahabu,” “Damaski,” na “Samaria” yametumiwa ili kubainisha warejeleo wa viwakilishi na mabadiliko ya msemaji. “Mitaa” limechaguliwa badala ya neno la kiufundi ili kuhifadhi upana wa חוּצוֹת; uwezekano wa maeneo ya biashara umewekwa katika tanbihi.
