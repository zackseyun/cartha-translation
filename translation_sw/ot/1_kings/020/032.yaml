base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/032.yaml
  text: So they tied sackcloth around their waists and ropes on their heads[a], and they came to the king of Israel and said, “Your servant Ben-hadad says, ‘Please let me live.’” And he said[b], “Is he still alive? He is my brother.”
translation:
  language: sw
  text: Basi wakajifunga nguo za gunia viunoni, wakaweka kamba vichwani mwao, kisha wakamwendea mfalme wa Israeli wakasema, “Mtumishi wako Ben-hadadi amesema, ‘Tafadhali, niache niishi.’”[a] Naye akauliza, “Je, bado yu hai? Yeye ni ndugu yangu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tafadhali, uache nafsi yangu iishi.” Kwa neno halisi, “Nafsi yangu na iishi, tafadhali.”
    reason: lexical_alternative
  - marker: b
    text: Kauli “Yeye ni ndugu yangu” huenda ikaonyesha udugu wa kisiasa au wa agano, si lazima undugu wa kuzaliwa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּחְגְּרוּ
  choice: wakajifunga
  rationale: Kitenzi חגר humaanisha kujifunga au kuvaa kitu kwa kukifunga; ‘wakajifunga’ kinaonyesha kitendo hicho kwa Kiswahili cha kawaida.
- source_word: שַׂקִּים
  choice: nguo za magunia
  rationale: Hapa שַׂקִּים ni kitambaa kigumu kilichovaliwa kuonyesha maombolezo au kujinyenyekeza, si magunia ya kubebea vitu tu.
- source_word: בְּמָתְנֵיהֶם
  choice: viunoni
  rationale: מָתְנַיִם hurejelea kiuno; ‘viunoni’ ni ya asili na wazi kwa msomaji wa kisasa.
- source_word: וַחֲבָלִים
  choice: kamba
  rationale: חֲבָלִים humaanisha kamba au nyororo za kamba; ‘kamba’ ni neno la kawaida na huhifadhi taswira halisi.
- source_word: בְּרָאשֵׁיהֶם
  choice: vichwani mwao
  rationale: Kirai cha Kiebrania kinaonyesha kamba zikiwa juu ya vichwa vyao bila kubainisha zaidi jinsi zilivyowekwa.
- source_word: עַבְדְּךָ
  choice: Mtumishi wako
  rationale: Katika mazungumzo na mfalme, עבד ni lugha ya kujishusha; ‘mtumishi’ inafaa muktadha huo kuliko kusisitiza hali ya utumwa.
- source_word: בֶן הֲדַד
  choice: Ben-hadadi
  rationale: Jina la mtu limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: תְּחִי נָא נַפְשִׁי
  choice: Tafadhali, niache niishi
  rationale: Maana ya neno kwa neno ni ‘nafsi yangu na iishi, tafadhali’; tafsiri hii ya Kiswahili huwasilisha ombi la kuhifadhiwa hai kwa uwazi.
- source_word: הַעוֹדֶנּוּ חַי
  choice: Je, bado yu hai?
  rationale: עוד pamoja na חַי huuliza kama mtu angali hai; ‘bado yu hai’ ni Kiswahili cha kawaida chenye hadhi.
- source_word: אָחִי הוּא
  choice: Yeye ni ndugu yangu
  rationale: Tafsiri ya moja kwa moja huhifadhi uwezekano wa neno ‘ndugu’ kumaanisha undugu halisi au uhusiano wa kisiasa.
theological_decisions:
- issue: Maana ya ‘ndugu’ katika jibu la Ahabu
  choice: Yeye ni ndugu yangu
  alternative: Yeye ni mshirika wangu
  rationale: Kiebrania kinatumia neno la kawaida la undugu, אָחִי. Ingawa katika muktadha huenda likamaanisha udugu wa kisiasa au wa agano, tafsiri hailazimishi maana hiyo na hivyo inadumisha utata wa simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umefanywa uwe wa asili kwa Kiswahili, huku taswira halisi ya nguo za magunia na kamba, lugha ya kujishusha mbele ya mfalme, na utata wa neno ‘ndugu’ vikihifadhiwa.
