base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/042.yaml
  text: 'And he said to him[a], “Thus says Yahweh: Because you have let go from your hand the man I had devoted to destruction, your life shall be for his life, and your people for his people.”'
translation:
  language: sw
  text: 'Naye akamwambia, “Yahwe asema hivi: ‘Kwa sababu umemwachilia kutoka mkononi mwako mtu niliyemweka chini ya hukumu ya kuangamizwa[a], uhai wako utakuwa badala ya uhai wake, na watu wako badala ya watu wake.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu niliyemweka wakfu aangamizwe.” Neno la Kiebrania חֵרֶם humaanisha hapa mtu aliyetengwa ili aangamizwe chini ya hukumu ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la agano la Mungu kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: יַעַן
  choice: Kwa sababu
  rationale: Linaonyesha wazi kuwa tendo la mfalme ndilo msingi wa hukumu inayofuata.
- source_word: שִׁלַּחְתָּ ... מִיָּד
  choice: umemwachilia kutoka mkononi mwako
  rationale: Linahifadhi maana ya kumwacha huru pamoja na nahau ya Kiebrania inayomaanisha kuwa chini ya mamlaka au ulinzi wa mtu, bila kuongeza wazo la kutoroka.
- source_word: אִישׁ חֶרְמִי
  choice: mtu niliyemweka chini ya hukumu ya kuangamizwa
  rationale: Linaonyesha kiambishi cha nafsi ya kwanza katika חֶרְמִי na uzito wa חֵרֶם kama hukumu ya Mungu, huku likiepuka neno la kitaalamu lisiloeleweka kwa urahisi.
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: uhai wako utakuwa badala ya uhai wake
  rationale: נֶפֶשׁ hapa ni uhai, na תַּחַת linaonyesha uingizwaji katika hukumu.
- source_word: וְעַמְּךָ תַּחַת עַמּוֹ
  choice: na watu wako badala ya watu wake
  rationale: Linadumisha usambamba wa kishairi na kisharia wa kishazi kilichotangulia.
theological_decisions:
- issue: Maana ya istilahi חֵרֶם katika tamko la hukumu
  choice: niliyemweka chini ya hukumu ya kuangamizwa
  alternative: aliye chini ya marufuku yangu; niliyemweka wakfu aangamizwe
  rationale: Tafsiri hii inatunza wazo la mtu kutengwa kwa ajili ya kuangamizwa chini ya hukumu ya Mungu, si chuki ya kibinafsi tu. Tanbihi inahifadhi njia nyingine ya kueleza istilahi hiyo bila kuufanya usemi mkuu kuwa wa kitaalamu au wenye utata usio wa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya tamko la kinabii lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “Yahwe asema hivi” unahifadhi fomula ya mjumbe wa kinabii; “kutoka mkononi mwako” unatunza nahau ya chanzo bila kuwa mgumu.
