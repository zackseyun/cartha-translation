source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/מֶּ֨לֶךְ֙ עֹבֵ֔ר וְ/ה֖וּא צָעַ֣ק אֶל הַ/מֶּ֑לֶךְ וַ/יֹּ֜אמֶר עַבְדְּ/ךָ֣ יָצָ֣א בְ/קֶֽרֶב הַ/מִּלְחָמָ֗ה וְ/הִנֵּֽה אִ֨ישׁ סָ֜ר וַ/יָּבֵ֧א אֵלַ֣/י אִ֗ישׁ וַ/יֹּ֨אמֶר֙ שְׁמֹר֙ אֶת הָ/אִ֣ישׁ הַ/זֶּ֔ה אִם הִפָּקֵד֙ יִפָּקֵ֔ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ א֥וֹ כִכַּר כֶּ֖סֶף תִּשְׁקֽוֹל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/039.yaml
  text: As the king was passing by[a], he cried out to the king and said, “Your servant went out into the midst of the battle, and behold, a man turned aside and brought a man to me and said, ‘Guard this man. If he is ever missing, then your life shall be for his life[b], or you shall weigh out a talent of silver.’”
translation:
  language: sw
  text: Ikawa mfalme alipokuwa akipita, yule mtu akamlilia mfalme, akasema, “Mtumishi wako alitoka kwenda katikati ya vita. Mara mtu mmoja akageuka kando, akaniletea mtu mwingine na kuniambia, ‘Mlinde mtu huyu. Ikiwa atatoweka kabisa[a], uhai wako utakuwa badala ya uhai wake[b], au utapima talanta moja ya fedha.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa kwa vyovyote hatapatikana.” Kiebrania kinarudia umbo la kitenzi ili kusisitiza kutoweka kwake.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “uhai wako chini ya uhai wake”; huu ni usemi wa kisheria unaomaanisha uhai mmoja kuchukua nafasi ya mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵר
  choice: alipokuwa akipita
  rationale: Kirai cha kitenzi kishirikishi pamoja na ויהי kinaonyesha tendo lililokuwa likiendelea; Kiswahili hiki kinatunza hali hiyo ya usuli.
- source_word: צָעַק אֶל
  choice: akamwita ... kwa sauti
  rationale: Kitenzi kinaonyesha mwito mkubwa au wa haraka. Usemi huu ni wa kawaida kwa Kiswahili na haudokezi bila lazima kwamba alikuwa akilia machozi.
- source_word: עַבְדְּךָ
  choice: Mtumishi wako
  rationale: Huu ni usemi wa heshima wa mtu anayejitaja mbele ya mfalme; “mtumwa wako” ungeweza kusisitiza hadhi ya utumwa isiyokusudiwa hapa.
- source_word: בְּקֶרֶב הַמִּלְחָמָה
  choice: kwenda katikati ya vita
  rationale: Neno קֶרֶב linaonyesha kuwa ndani au katikati; tafsiri hii inadumisha picha ya kuingia penye mapigano.
- source_word: וְהִנֵּה
  choice: Mara
  rationale: Chembe hii inatambulisha tukio kwa uhai na ghafla. “Mara” ni ya asili katika simulizi la Kiswahili bila kutumia usemi wa kizamani.
- source_word: אִישׁ סָר
  choice: mtu mmoja akajitenga
  rationale: סוּר humaanisha kugeuka kando au kuondoka kwenye njia. Katika muktadha huu inaelekea mtu alijitenga na mapigano ili kumkaribia msemaji.
- source_word: וַיָּבֵא אֵלַי אִישׁ
  choice: akaniletea mtu mwingine
  rationale: Mtu wa kwanza anamleta mtu wa pili chini ya ulinzi wa msemaji; “mwingine” huondoa utata wa kawaida wa Kiswahili bila kubadili wahusika wa Kiebrania.
- source_word: שְׁמֹר
  choice: Mlinde
  rationale: Amri hiyo inamtaka amweke mtu chini ya ulinzi na kuhakikisha haondoki; “mlinde” ni fupi na inafaa mazingira ya kijeshi.
- source_word: אִם הִפָּקֵד יִפָּקֵד
  choice: Ikiwa atatoweka kabisa
  rationale: Muundo wa Kiebrania wa kitenzi-jina pamoja na kitenzi chenye kikomo unasisitiza kutokuwapo au kutopatikana kwake. “Kabisa” kinawakilisha msisitizo huo.
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: uhai wako utakuwa badala ya uhai wake
  rationale: נֶפֶשׁ hapa ni uhai wa mtu, na תַּחַת ni badala au mbadala; tafsiri inatunza kanuni ya kisheria ya kubadilishana uhai.
- source_word: כִּכַּר כֶּסֶף
  choice: talanta moja ya fedha
  rationale: כִּכַּר ni kipimo kikubwa cha uzito kinachoitwa kwa kawaida talanta katika tafsiri za Biblia; fedha ililipwa kwa uzito.
- source_word: תִּשְׁקוֹל
  choice: utapima
  rationale: Kitenzi humaanisha kupima kwa uzito, si kulipa tu; hivyo kinatunza taswira halisi ya fedha iliyopimwa.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika adhabu ya kubadilishana
  choice: uhai
  alternative: nafsi
  rationale: Muktadha unahusu kifo kama adhabu ya kumpoteza mfungwa, si maelezo kuhusu sehemu isiyo ya kimwili ya mwanadamu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Muundo wa simulizi umetolewa kwa mtiririko wa sasa wa Kiswahili, huku lugha ya hukumu ikibaki nzito na ya kisheria. Alama [a] imewekwa kwenye kifungu inachofafanua katika Kiebrania, badala ya baada ya “akipita,” ambako ingeleta uhusiano usio sahihi.
