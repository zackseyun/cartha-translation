translation:
  language: sw
  text: 'Hawa wakatoka mjini: vijana wa wakuu wa majimbo[a], na jeshi lililokuwa nyuma yao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumishi au wahudumu wa wakuu wa majimbo.” Neno la Kiebrania נַעֲרֵי linaweza kumaanisha vijana au watumishi binafsi; katika muktadha huu huenda maana zote mbili zikahusika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hawa
  rationale: Kiwakilishi hiki cha wingi kinarejelea kundi lililohesabiwa katika mstari uliotangulia; kiunganishi cha Kiebrania hakihitaji kutafsiriwa moja kwa moja ili Kiswahili kiwe cha kawaida.
- source_word: יָצְאוּ מִן הָעִיר
  choice: wakatoka mjini
  rationale: Huu ni usemi wa kawaida na wa moja kwa moja unaoonyesha kuondoka ndani ya mji, bila kuongeza maana ya kuandamana kijeshi ambayo haimo wazi katika kitenzi.
- source_word: נַעֲרֵי
  choice: vijana
  rationale: Neno la Kiebrania linaweza kumaanisha vijana au watumishi/wahudumu. Maana ya msingi ‘vijana’ imewekwa katika matini, huku maana nyingine halali ikihifadhiwa katika tanbihi.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: wakuu wa majimbo
  rationale: Muundo huu unaonyesha viongozi au maofisa wenye mamlaka katika majimbo. ‘Wakuu wa majimbo’ ni wa kawaida, wenye heshima, na hauwalazimishi kuwa makamanda wa kijeshi pekee.
- source_word: וְהַחַיִל
  choice: pamoja na jeshi
  rationale: Katika muktadha huu חַיִל ni kikosi cha kijeshi. ‘Jeshi’ linaeleweka wazi; ‘pamoja na’ huunganisha makundi hayo kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר אַחֲרֵיהֶם
  choice: lililokuwa nyuma yao
  rationale: Tafsiri hii inadumisha taswira halisi ya kikosi kilichokuwa nyuma yao, bila kuamua zaidi ikiwa kilikuwa kikiwafuata kwa mwendo au kimepangwa nyuma yao.
