  text: וַ/יֹּאמְר֣וּ אֵלָי/ו֮ עֲבָדָי/ו֒ הִנֵּֽה נָ֣א שָׁמַ֔עְנוּ כִּ֗י מַלְכֵי֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּֽי מַלְכֵ֥י חֶ֖סֶד הֵ֑ם נָשִׂ֣ימָה נָּא֩ שַׂקִּ֨ים בְּ/מָתְנֵ֜י/נוּ וַ/חֲבָלִ֣ים בְּ/רֹאשֵׁ֗/נוּ וְ/נֵצֵא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל אוּלַ֖י יְחַיֶּ֥ה אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/031.yaml
  text: And his servants said to him, “Look, please, we have heard that the kings of the house of Israel are merciful kings. Please let us put sackcloth around our waists and ropes on our heads, and let us go out to the king of Israel; perhaps he will let you live.”
translation:
  language: sw
  text: Watumishi wake wakamwambia, “Tafadhali, tumesikia kwamba wafalme wa nyumba ya Israeli ni wafalme wenye rehema. Tafadhali, na tujivike nguo za magunia viunoni, tufunge kamba vichwani, kisha twende kwa mfalme wa Israeli. Labda atakuacha hai.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכֵי חֶסֶד
  choice: wafalme wenye rehema
  rationale: Neno חֶסֶד hapa linaeleza tabia ya wafalme ya kuwa na huruma au rehema kwa waliowashinda; ‘wenye rehema’ ni la asili na lenye heshima katika Kiswahili.
- source_word: שַׂקִּים בְּמָתְנֵינוּ
  choice: nguo za magunia viunoni
  rationale: שַׂקִּים ni mavazi ya kitambaa kigumu cha gunia, ishara ya kujinyenyekeza; בְּמָתְנֵינוּ huonyesha kuwekwa au kufungwa kiunoni.
- source_word: חֲבָלִים בְּרֹאשֵׁנוּ
  choice: kamba vichwani
  rationale: Tafsiri ya moja kwa moja inayohifadhi ishara ya kujisalimisha bila kuongeza maelezo yasiyo katika matini.
- source_word: יְחַיֶּה אֶת נַפְשֶׁךָ
  choice: atakuacha hai
  rationale: Nahau hiyo humaanisha kuhifadhi uhai wa mtu; Kiswahili hiki ni cha kawaida na kinaweka wazi kwamba kiwakilishi ni cha umoja, kikimrejelea Ben-hadadi.
theological_decisions:
- issue: Maana ya חֶסֶד katika maelezo ya wafalme wa Israeli
  choice: wenye rehema
  alternative: wenye fadhili
  rationale: Katika muktadha wa mfalme aliyeshindwa kuomba kuachwa hai, ‘rehema’ huwasilisha kwa usahihi huruma kwa mtu aliye katika mamlaka ya mshindi, bila kuingiza maana maalumu ya agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ombi umerudiwa kwa ‘Basi, na…’ ili kuonyesha chembe נָא huku ukiepuka Kiswahili kizito; sentensi ya mwisho inadumisha hali ya kutokuwa na uhakika ya אוּלַי (‘labda’).
