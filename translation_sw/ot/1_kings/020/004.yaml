base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/004.yaml
  text: The king of Israel answered and said[a], “According to your word, my lord the king, I am yours, and all that is mine.”
translation:
  language: sw
  text: Mfalme wa Israeli akajibu, akasema[a], “Kama ulivyosema, bwana wangu, mfalme, mimi ni wako, pamoja na vyote nilivyo navyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mfalme wa Israeli akajibu, ‘Kama ulivyosema, bwana wangu, mfalme, mimi na vyote nilivyo navyo ni vyako.’”
    reason: Mbadala wa kimtindo huacha kitenzi cha pili cha utangulizi wa hotuba na huunganisha mimi na mali zote katika kauli moja ya “ni vyako.”
lexical_decisions:
- source_word: וַיַּעַן
  choice: akajibu
  rationale: Ni kitenzi cha kawaida cha masimulizi kinachoanzisha jibu katika mazungumzo; ‘akajibu’ huhifadhi wazi uhusiano na ujumbe uliotangulia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: Mfalme wa Israeli
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania, inayofaa katika masimulizi ya Kiswahili.
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Huhifadhi kitenzi cha pili cha kusema kilicho katika chanzo, hata kama Kiswahili kingeweza pia kusema kwa ufupi ‘akajibu.’
- source_word: כִּדְבָרְךָ
  choice: Kama ulivyosema
  rationale: Ni Kiswahili cha asili na cha sasa kinachowasilisha maana ya ‘kulingana na neno lako’ bila kufanya usemi kuwa mgumu; pia huhifadhi sauti ya kukubali matakwa yaliyotolewa.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: ‘Bwana wangu’ hapa ni namna ya heshima ya kumwambia mtawala wa kibinadamu, si jina la Mungu; ‘mfalme’ huhifadhi cheo chake.
- source_word: לְךָ אֲנִי
  choice: mimi ni wako
  rationale: Huhifadhi mpangilio wenye msisitizo wa kiwakilishi na kueleza kujisalimisha au kuwa chini ya mamlaka ya anayesemeshwa.
- source_word: וְכָל אֲשֶׁר לִי
  choice: pamoja na vyote nilivyo navyo
  rationale: Ni usemi wa kawaida wa Kiswahili unaofikisha kwa upana kila kitu alicho nacho mfalme; ‘pamoja na’ huunganisha kwa asili mtu mwenyewe na mali yake.
theological_decisions:
- issue: Maana ya אֲדֹנִי anapoambiwa mfalme wa kibinadamu
  choice: bwana wangu
  alternative: mtawala wangu
  rationale: Muktadha unamhusu Ben-hadadi, mfalme wa kibinadamu. Kwa hiyo usemi umetafsiriwa kama heshima ya kijamii na kisiasa bila kupewa maana ya jina au cheo cha Mungu.
- issue: Nguvu ya kauli לְךָ אֲנִי
  choice: mimi ni wako
  alternative: mimi ni mali yako
  rationale: ‘Mimi ni wako’ huhifadhi uwezekano wa kumaanisha utii, kujisalimisha, au kuwa chini ya mamlaka ya mwingine bila kuibana kauli kuwa umiliki wa mali pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha hadhi ya masimulizi lakini kinachoeleweka kwa urahisi. Muundo ‘akajibu, akasema’ umehifadhiwa kwa sababu chanzo kina vitenzi vyote viwili; tanbihi inatoa Kiswahili kilichofupishwa na cha asili zaidi.
