reference: 1 Kings 20:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּגַּ֞שׁ אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּאמֶר֮ אֶל מֶ֣לֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֠עַן אֲשֶׁ֨ר אָמְר֤וּ אֲרָם֙ אֱלֹהֵ֤י הָרִים֙ יְהוָ֔ה וְ/לֹֽא אֱלֹהֵ֥י עֲמָקִ֖ים ה֑וּא וְ֠/נָתַתִּי אֶת כָּל הֶ/הָמ֨וֹן הַ/גָּ֤דוֹל הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/028.yaml
  text: 'Then the man of God came near and said to the king of Israel[a], “Thus says Yahweh: Because Aram has said, ‘Yahweh is a god of the mountains, but he is not a god of the valleys,’ I will give all this great multitude into your hand[c][b], and you shall know that I am Yahweh.”'
translation:
  language: sw
  text: 'Ndipo mtu wa Mungu akakaribia, akamwambia mfalme wa Israeli, “Yahweh asema hivi: Kwa sababu watu wa Aramu[a] wamesema, ‘Yahweh ni mungu wa milima, wala si mungu wa mabonde,’[b] nitatia umati huu wote mkubwa mkononi mwako, nanyi mtajua[c] kwamba mimi ni Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waaramu.” Aramu huitwa pia Shamu katika baadhi ya mapokeo ya tafsiri.
    reason: alternative_reading
  - marker: b
    text: Au, “mungu wa vilima ... mungu wa nchi tambarare.” Kiebrania kinatofautisha maeneo yaliyoinuka na mabonde au maeneo ya chini.
    reason: lexical_alternative
  - marker: c
    text: Kitenzi cha Kiebrania “mtajua” ni cha wingi; hivyo kauli inawahusu Waisraeli kwa pamoja, si mfalme peke yake.
    reason: grammatical_clarification
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Ni cheo cha kinabii kinachotambulika katika muktadha; Kiswahili hakihitaji kibainishi tofauti ili kuonyesha umaalumu huo.
- source_word: וַיִּגַּשׁ
  choice: akakaribia
  rationale: Kitenzi נגשׁ kinaonyesha kusogea karibu bila kueleza zaidi namna ya tendo.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Hii ni fomula ya kawaida ya mjumbe wa kinabii, imetolewa kwa Kiswahili cha sasa na chenye hadhi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘Bwana’.
- source_word: יַעַן אֲשֶׁר
  choice: Kwa sababu
  rationale: Muungano huu unaanzisha sababu ya hatua ya Mungu kwa njia ya kawaida na wazi.
- source_word: אֲרָם
  choice: watu wa Aramu
  rationale: Jina Aramu limehifadhiwa, huku ‘watu wa’ likiwezesha upatanisho wa asili wa Kiswahili na kitenzi cha wingi cha Kiebrania, אָמְרוּ.
- source_word: אֱלֹהֵי הָרִים ... וְלֹא אֱלֹהֵי עֲמָקִים
  choice: mungu wa milima, wala si mungu wa mabonde
  rationale: Herufi ndogo katika ‘mungu’ inaonyesha dai la Waaramu kwamba Yahweh ni mmoja wa miungu yenye mipaka ya maeneo; ‘milima’ na ‘mabonde’ zinafuata tofauti ya kijiografia ya Kiebrania.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: umati huu wote mkubwa
  rationale: הָמוֹן ni kundi au wingi mkubwa wa watu; ‘umati’ huhifadhi upana huo ingawa muktadha ni wa kijeshi.
- source_word: בְּיָדֶךָ
  choice: mkononi mwako
  rationale: Taswira ya nahau ya Kiebrania imehifadhiwa na inaeleweka kwa Kiswahili kuwa kuwekwa chini ya mamlaka au kushindwa na mtu.
- source_word: וִידַעְתֶּם
  choice: nanyi mtajua
  rationale: Kitenzi ni nafsi ya pili wingi. ‘Nanyi’ kinaonyesha wazi kwamba matokeo yanawahusu Waisraeli kwa pamoja, ingawa ujumbe unasemwa kwa mfalme.
- source_word: כִּי אֲנִי יְהוָה
  choice: kwamba mimi ni Yahweh
  rationale: Kauli ya kujitambulisha kwa Mungu imehifadhiwa moja kwa moja, pamoja na jina Yahweh.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Bwana; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la pekee la Mungu; ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Iwapo dai la Waaramu lionyeshe wazo la mungu mwenye eneo maalumu
  choice: mungu wa milima, wala si mungu wa mabonde
  alternative: Mungu wa milima, wala si Mungu wa mabonde
  rationale: ‘mungu’ kwa herufi ndogo huwasilisha mtazamo potovu wa Waaramu kwamba Yahweh ni mungu mmoja wa eneo fulani; mwisho wa aya unapinga mtazamo huo bila tafsiri kuutatua kimya kimya.
- issue: Idadi ya wanaoambiwa katika וִידַעְתֶּם
  choice: wingi—‘nanyi mtajua’
  alternative: umoja—‘nawe utajua’
  rationale: Ingawa mtu wa Mungu anamwambia mfalme, kitenzi cha Kiebrania ni wingi na kinaipanua kauli kwa Israeli kwa pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kinabii ‘Yahweh asema hivi’ na taswira ‘mkononi mwako’ zimehifadhiwa, huku upatanisho wa kawaida wa Kiswahili ukitumika katika ‘watu wa Aramu wamesema.’
