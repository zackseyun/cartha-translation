  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִ֨ישׁ אֶחָ֜ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֗ים אָמַ֧ר אֶל רֵעֵ֛/הוּ בִּ/דְבַ֥ר יְהוָ֖ה הַכֵּ֣י/נִי נָ֑א וַ/יְמָאֵ֥ן הָ/אִ֖ישׁ לְ/הַכֹּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/035.yaml
  text: A certain man from the sons of the prophets said to his companion by the word of Yahweh[b][a], “Please strike me.” But the man refused to strike him.
translation:
  language: sw
  text: Mtu mmoja kutoka miongoni mwa wana wa manabii[a] alimwambia mwenzake kwa neno la Yahwe[b], “Tafadhali, nipige.” Lakini mtu huyo akakataa kumpiga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka katika kundi la manabii” au “kutoka miongoni mwa wanafunzi wa manabii.” Kiebrania kinasema “kutoka miongoni mwa wana wa manabii,” nahau ya kawaida inayorejelea kundi la kinabii.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa agizo la Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֶחָד
  choice: Mtu mmoja
  rationale: Kirai hiki humtambulisha mtu fulani katika simulizi. “Mtu mmoja” ni Kiswahili cha kawaida na hakiongezi kielezi cha wakati ambacho hakipo wazi katika Kiebrania.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: kutoka miongoni mwa wana wa manabii
  rationale: Tafsiri hii inahifadhi nahau ya Kiebrania “wana wa manabii,” huku “kutoka miongoni mwa” ikionyesha kwamba alikuwa mmoja wa kundi hilo. Maana zinazofafanua kundi hilo zaidi zimewekwa katika tanbihi.
- source_word: רֵעֵהוּ
  choice: mwenzake
  rationale: Neno hili linaweza kumaanisha rafiki, mwenzi, au mtu mwenzake. “Mwenzake” linafaa katika muktadha bila kudokeza ukaribu wa kihisia usiotajwa.
- source_word: בִּדְבַר יְהוָה
  choice: kwa neno la Yahwe
  rationale: Kirai hiki kinahifadhi nahau ya Kiebrania na kuonyesha kwamba ombi hilo lilitolewa kwa mamlaka au agizo la Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: הַכֵּינִי נָא
  choice: Tafadhali, nipige
  rationale: Kitenzi נכה humaanisha kupiga; ingawa pigo hilo lingesababisha jeraha katika muktadha unaofuata, mstari huu wenyewe hauhitaji kutafsiriwa “nijeruhi.” נָא limewakilishwa kwa “tafadhali.”
- source_word: וַיְמָאֵן
  choice: akakataa
  rationale: Kitenzi kinaonyesha kukataa, si kusita tu. Umbo la “aka-” linaendeleza mfuatano wa simulizi kwa njia ya kawaida katika Kiswahili.
- source_word: לְהַכֹּתוֹ
  choice: kumpiga
  rationale: Tafsiri hii inadumisha ulinganifu wa kitenzi kilekile kilichotumiwa katika amri na haiongezi matokeo ya kujeruhi kabla hayajasemwa na maandishi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu YHWH. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Kiwango cha ufafanuzi wa בְּנֵי הַנְּבִיאִים
  choice: wana wa manabii
  alternative: kundi la manabii; wanafunzi wa manabii
  rationale: Kirai huenda kinamaanisha washiriki wa jumuiya ya kinabii, lakini tafsiri kuu inahifadhi nahau ya Kiebrania ili isiamue bila lazima muundo halisi wa kundi hilo.
- issue: Nguvu ya בִּדְבַר יְהוָה
  choice: kwa neno la Yahwe
  alternative: kwa agizo la Yahwe
  rationale: Tafsiri kuu inahifadhi uwezekano wa kuelewa kirai hicho kama neno la kinabii lenye mamlaka, bila kukifanya moja kwa moja kuwa amri katika maandishi yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Nahau muhimu ya Kiebrania imehifadhiwa katika maandishi, huku ufafanuzi wake ukitolewa katika tanbihi.
