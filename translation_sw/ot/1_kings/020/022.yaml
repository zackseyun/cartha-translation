base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/022.yaml
  text: Then the prophet came near to the king of Israel and said to him[a], “Go, strengthen yourself, and know and see what you should do[c][b], because at the turn of the year the king of Aram will come up against you.”
translation:
  language: sw
  text: Kisha nabii akamkaribia mfalme wa Israeli na kumwambia, “Nenda, ujiimarishe, ujue na uone utakachofanya[b], kwa maana mwaka utakapogeuka[a], mfalme wa Aramu[c] atakupandia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mwaka utakapogeuka/kurudi.” Hii ni nahau ambayo mara nyingi hurejelea majira ambapo kampeni za kijeshi zilianza tena; tafsiri nyingine husema “majira yajayo ya kuchipua.”
    reason: cultural_note
  - marker: b
    text: Au “unachopaswa kufanya.” Umbo la Kiebrania ni la wakati ujao, lakini katika muktadha huu huenda linamaanisha jambo ambalo mfalme anapaswa kufanya ili kujiandaa.
    reason: lexical_alternative
  - marker: c
    text: Kimapokeo, “mfalme wa Syria”; Kiebrania kinasema “Aramu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: akamkaribia
  rationale: Kitenzi hiki kinaonyesha kusogea karibu na mtu; ‘akamkaribia’ ni cha kawaida katika simulizi na kinahifadhi mwendo huo.
- source_word: הִתְחַזַּק
  choice: ujiimarishe
  rationale: Kauli ya kujirejelea inahifadhiwa, huku muktadha ukidokeza kujiandaa na kujitia nguvu kwa ajili ya mapambano yajayo.
- source_word: וְדַע וּרְאֵה
  choice: ujue na uone
  rationale: Maneno yote mawili yamehifadhiwa ili kutofuta jozi ya Kiebrania, ingawa kwa Kiswahili yanaweza pia kueleweka kama wito wa kutambua na kuchunguza kwa makini.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: utakachofanya
  rationale: Muundo wa Kiebrania ni wa wakati ujao, ‘kile utakachofanya.’ Muktadha unaweza kuupa maana ya jambo analopaswa kufanya, lakini tafsiri kuu inaacha mvutano huo wazi.
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: wakati wa kugeuka kwa mwaka
  rationale: Hii inahifadhi nahau ya Kiebrania ya mwaka kugeuka au kurudi bila kuifasiri moja kwa moja kuwa ‘majira ya kuchipua yajayo.’
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: ‘Aramu’ linafuata jina la Kiebrania moja kwa moja badala ya kutumia jina la baadaye la kijiografia, ‘Syria.’
- source_word: עֹלֶה עָלֶיךָ
  choice: atapanda kuja dhidi yako
  rationale: Kauli hii inahifadhi taswira ya kijeshi ya kupanda au kusonga dhidi ya mpinzani na inaonyesha tishio la wakati ujao.
theological_decisions:
- issue: Nguvu ya kauli אֲשֶׁר תַּעֲשֶׂה
  choice: utakachofanya
  alternative: unachopaswa kufanya
  rationale: Tafsiri kuu inafuata zaidi umbo la wakati ujao la Kiebrania na haifanyi wajibu kuwa wazi kuliko ulivyo katika chanzo; maana ya ushauri wa vitendo imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Jozi ‘ujue na uone’ imehifadhiwa kwa makusudi ili kutofupisha msisitizo wa chanzo, na nahau ya mwaka imeachwa katika matini huku maana yake ya kitamaduni ikifafanuliwa katika tanbihi.
