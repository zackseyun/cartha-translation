  text: Then the king of Israel went out and struck the horses and the chariots[a], and inflicted a great blow on Aram.
translation:
  language: sw
  text: Ndipo mfalme wa Israeli akatoka, akapiga farasi na magari ya vita, na akapiga Aramu[a] pigo kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawapiga Waaramu.” Neno la Kiebrania “Aramu” linaweza kurejelea ufalme huo au majeshi yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi יצא katika mfululizo wa masimulizi kina maana ya kutoka; ‘akatoka’ ni cha kawaida na hakiongezi dhana ya kuandamana kijeshi ambayo haijasemwa wazi.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Huu ni muundo wa kawaida wa umilikishi unaomtambulisha mhusika.
- source_word: וַיַּךְ
  choice: akawashambulia
  rationale: נכה inaweza kumaanisha kupiga au kushambulia. Katika muktadha wa farasi na magari ya vita, ‘kuwashambulia’ ni Kiswahili cha kawaida huku kikiepuka kudai kwamba viliharibiwa kabisa.
- source_word: הַסּוּס
  choice: farasi
  rationale: Ingawa neno la Kiebrania ni umoja kisarufi, hapa lina maana ya jumla ya kundi la farasi wa jeshi.
- source_word: הָרָכֶב
  choice: magari ya vita
  rationale: רכב hapa humaanisha magari ya kivita kwa ujumla; ‘magari ya vita’ ni wazi kwa msomaji wa kisasa.
- source_word: וְהִכָּה
  choice: na kuipiga
  rationale: Matumizi ya pili ya נכה yanafuatwa na nomino yenye mzizi uleule, מַכָּה; ‘kuipiga ... pigo’ huhifadhi kwa kiasi kikubwa tamathali ya Kiebrania.
- source_word: בַאֲרָם
  choice: Aramu
  rationale: Jina la Kiebrania ni Aramu, si jina la baadaye ‘Siria.’ Katika muktadha huu linaweza kurejelea ufalme au majeshi yake.
- source_word: מַכָּה גְדוֹלָה
  choice: pigo kubwa
  rationale: Tafsiri hii huhifadhi maana halisi na tamathali ya Kiebrania bila kubainisha mauaji au kushindwa kabisa zaidi ya maandishi yanavyosema.
