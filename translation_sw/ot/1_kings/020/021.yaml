translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Magari ya vita’ limetumiwa badala ya istilahi ya kitaalamu zaidi, na jina ‘Aramu’ limehifadhiwa ili kufuata maandishi ya Kiebrania.
