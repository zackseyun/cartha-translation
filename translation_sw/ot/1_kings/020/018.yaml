  yaml_path: translation/ot/1_kings/020/018.yaml
  text: And he said[a], “If they have come out for peace, seize them alive; and if they have come out for battle, seize them alive.”
translation:
  language: sw
  text: Akasema, “Kama wametoka kwa amani, wakamateni wakiwa hai; na kama wametoka kwa vita, wakamateni wakiwa hai.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Ni namna ya kawaida na ya asili ya Kiswahili ya kuendeleza simulizi na kutambulisha usemi wa moja kwa moja.
- source_word: אִם
  choice: Kama
  rationale: Huonyesha sharti katika hali zote mbili na ni ya kawaida katika Kiswahili sanifu.
- source_word: לְשָׁלוֹם
  choice: kwa amani
  rationale: Huhifadhi maana ya kutoka kwa kusudi au mwelekeo wa amani, bila kuamua zaidi ya maandishi.
- source_word: יָצָאוּ
  choice: wametoka
  rationale: Kauli ya wakati timilifu inaonyesha kwamba tayari wametoka na sasa wanaonekana mbele ya msemaji.
- source_word: תִּפְשׂוּם
  choice: wakamateni
  rationale: Kitenzi hiki kinafaa kwa amri ya kuwakamata watu katika mazingira ya kijeshi.
- source_word: חַיִּים
  choice: wakiwa hai
  rationale: Huonyesha hali ambayo wanapaswa kuwa nayo wanapokamatwa.
- source_word: וְאִם
  choice: na kama
  rationale: Huhifadhi kiunganishi sahili cha Kiebrania kinachounganisha hali ya pili na ya kwanza.
- source_word: לְמִלְחָמָה
  choice: kwa vita
  rationale: Huhifadhi ulinganifu na “kwa amani” na kueleza kusudi la mapigano.
- source_word: חַיִּים תִּפְשׂוּם
  choice: wakamateni wakiwa hai
  rationale: Amri iliyorudiwa imehifadhiwa kwa sababu marudio hayo yana nguvu ya kimakusudi katika chanzo.
