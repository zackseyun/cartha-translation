base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/033.yaml
  text: The men were watching for an omen[a], and they quickly seized on it from him and said, “Ben-hadad is your brother.” And he said, “Come, take him.” Then Ben-hadad came out to him[c][b], and he had him come up into the chariot.
translation:
  language: sw
  text: Watu wale walikuwa wakitafuta ishara ya bahati[a]. Mara walipoisikia kauli hiyo, wakaichangamkia upesi[b] wakisema, “Ben-hadadi ni ndugu yako.” Ahabu akasema, “Njooni, mchukueni.” Basi Ben-hadadi akatoka, akamjia Ahabu, naye Ahabu akampandisha katika gari la vita[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walikuwa wakifanya ubashiri” au “walikuwa wakiichukulia kama ishara.” Kitenzi cha Kiebrania kinaweza kumaanisha kutafuta ishara za bahati; hapa yaelekea walikuwa wakisubiri kwa makini neno la Ahabu ambalo lingewapa matumaini.
    reason: lexical_alternative
  - marker: b
    text: Usemi wa Kiebrania hapa ni mgumu. Maana yake yaelekea ni kwamba waliinasa mara moja kauli ya Ahabu na kuichukulia kuwa idhini yenye manufaa kwao.
    reason: lexical_alternative
  - marker: c
    text: 'Neno la Kiebrania lina muundo wa kusababisha: Ahabu alisababisha Ben-hadadi apande katika gari la vita. Pia yaweza kutafsiriwa, “akamleta juu katika gari la vita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַחֲשׁוּ
  choice: walikuwa wakitafuta ishara ya bahati
  rationale: Kitenzi נחשׁ katika Piel kinaweza kumaanisha kutafuta au kufasiri ishara ya bahati. Katika muktadha huu watu hao walikuwa makini kusikia neno lolote la Ahabu ambalo lingeonyesha kuwa amewakubalia, wala si lazima kwamba walikuwa wakifanya tambiko rasmi la uganga.
- source_word: וַיְמַהֲרוּ
  choice: kwa haraka
  rationale: Huhifadhi wazo la kutenda upesi baada ya kutambua kauli yenye matumaini.
- source_word: וַיַּחְלְטוּ הֲמִמֶּנּוּ
  choice: Mara walipoisikia kauli hiyo, wakaishikilia kwa haraka
  rationale: Usemi wa Kiebrania ni mgumu, lakini katika muktadha unaonyesha kwamba walinasa kauli ya Ahabu na kuitumia mara moja kama tamko lenye manufaa kwao. Kitu kinachoshikiliwa hakitajwi wazi katika Kiebrania, hivyo ‘kauli hiyo’ kimewekwa kutokana na muktadha.
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Hii ndiyo tafsiri ya moja kwa moja na huhifadhi lugha ya heshima au ujamaa wa kidiplomasia ambayo watumishi waliitumia kwa manufaa yao.
- source_word: בֹּאוּ קָחֻהוּ
  choice: Nendeni mkamchukue
  rationale: Amri hizi zinaelekeza watu hao waende kumtoa Ben-hadadi alikojificha na kumleta kwa Ahabu. ‘Nendeni’ ni ya kawaida zaidi katika Kiswahili kwa mwendo unaofuata kutoka kwa msemaji kwenda kwa Ben-hadadi.
- source_word: וַיַּעֲלֵהוּ עַל הַמֶּרְכָּבָה
  choice: akampandisha katika gari la vita
  rationale: Hiphil ya עלה ina maana ya kusababisha mtu apande. ‘Akampandisha’ huhifadhi maana hiyo bila kudai kwamba Ahabu alimwinua kwa mikono.
- source_word: הַמֶּרְכָּבָה
  choice: gari la vita
  rationale: ‘Gari la vita’ ni neno la kawaida na linaloeleweka kwa chombo cha kifalme au kijeshi kinachokusudiwa hapa. Matini ina kibainishi ‘lile/ hilo’ lakini haina kiwakilishi cha umilikaji.
