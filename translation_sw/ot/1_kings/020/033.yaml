translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Majina ya wahusika yamerudiwa katika sentensi ya mwisho ili kuondoa utata wa viwakilishi vya Kiebrania bila kubadili wahusika. ‘Ishara ya bahati’ huhifadhi kidokezo cha kutafuta omen bila kufanya tukio lionekane lazima kuwa tambiko rasmi.
