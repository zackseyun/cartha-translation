base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/025.yaml
  text: And you, muster for yourself an army like the army that fell from you, and horse for horse and chariot for chariot; then let us fight against them on the plain. Surely we will be stronger than they are.” So he listened to their voice and did so.
translation:
  language: sw
  text: Nawe ujikusanyie jeshi kama lile jeshi ulilopoteza, farasi kwa farasi na gari la vita kwa gari la vita. Kisha tupigane nao katika nchi tambarare; hakika tutakuwa na nguvu kuliko wao.” Basi akasikiliza ushauri wao, akafanya hivyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִמְנֶה לְךָ חַיִל
  choice: ujikusanyie jeshi
  rationale: Kitenzi מנה hapa kinahusu kuhesabu, kuandikisha, au kupanga upya jeshi. ‘Ujikusanyie jeshi’ ni Kiswahili cha kawaida kinachowasilisha hatua ya kuunda jeshi la badala bila kudai kwamba ni kuhesabu tu.
- source_word: כַחַיִל הַנֹּפֵל מֵאוֹתָךְ
  choice: kama lile jeshi ulilopoteza
  rationale: Kwa muktadha, jeshi lililoanguka au kuondolewa kwake ni lile alilopoteza vitani. Hii huhifadhi maana ya hasara ya kijeshi kwa lugha ya asili.
- source_word: סוּס כַּסּוּס וְרֶכֶב כָּרֶכֶב
  choice: farasi kwa farasi na gari la vita kwa gari la vita
  rationale: Muundo wa kulinganisha mmoja kwa mmoja umehifadhiwa; ‘gari la vita’ huweka wazi maana ya רֶכֶב katika muktadha wa kijeshi.
- source_word: בַּמִּישׁוֹר
  choice: katika nchi tambarare
  rationale: מִישׁוֹר humaanisha eneo tambarare au uwanda; ‘nchi tambarare’ ni ya asili na haibani maana kuwa tambarare moja maalumu.
- source_word: וַיִּשְׁמַע לְקוֹלָם
  choice: akasikiliza ushauri wao
  rationale: Nahau ya Kiebrania ‘kusikiliza sauti yao’ hapa inamaanisha kukubali na kufuata walichoshauri; tafsiri hii ni ya kawaida katika Kiswahili.
theological_decisions:
- issue: Kauli ya uhakika אִם לֹא נֶחֱזַק מֵהֶם
  choice: hakika tutakuwa na nguvu kuliko wao
  alternative: labda tutakuwa na nguvu kuliko wao
  rationale: Muundo אִם לֹא katika kiapo au kauli ya msisitizo unaonyesha uhakika wenye nguvu, si uwezekano wa kawaida. Tafsiri haithibitishi ukweli wa madai yao, bali inahifadhi kujiamini kwa washauri wa mfalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mtiririko wa ushauri wa kijeshi na marudio ya ‘farasi kwa farasi’ na ‘gari la vita kwa gari la vita’. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zilizohitajika.
