base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/020.yaml
  text: Ahab said to Elijah[a], “Have you found me, O my enemy?” And he said, “I have found you, because you have sold yourself to do what is evil in the eyes of Yahweh.”
translation:
  language: sw
  text: Ahabu akamwambia Eliya, “Umenipata, ewe adui yangu?” Naye akasema, “Nimekupata, kwa sababu umejiuza ili kutenda yaliyo mabaya machoni pa Yahwe.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH.” Kwa kawaida limetafsiriwa “BWANA”; namna nyingine ni “Yahwe” na “Yehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְצָאתַנִי
  choice: Umenipata
  rationale: Kitenzi מצא kimetafsiriwa moja kwa moja kuwa ‘kupata’; kinafaa katika swali hili la makabiliano na kinawezesha mwangwi wa kitenzi hicho kuhifadhiwa katika jibu la Eliya.
- source_word: אֹיְבִי
  choice: ewe adui yangu
  rationale: Nomino yenye kiambishi cha nafsi ya kwanza umoja ni ‘adui yangu’; ‘ewe’ huonyesha wazi matumizi ya moja kwa moja ya kumwita mtu bila kubadili maana.
- source_word: מָצָאתִי
  choice: Nimekupata
  rationale: Huhifadhi kurudiwa kwa mzizi מצא kutoka katika swali la Ahabu na hivyo kudumisha nguvu ya mazungumzo.
- source_word: יַעַן
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaonyesha sababu ya tamko la Eliya; ‘kwa sababu’ ni Kiswahili cha kawaida na wazi.
- source_word: הִתְמַכֶּרְךָ
  choice: umejiuza
  rationale: Umbo la kujirejelea la מכר lina maana halisi ya ‘kujiuza’; tafsiri hii huhifadhi taswira yenye nguvu ya kujikabidhi mwenyewe kwa uovu.
- source_word: לַעֲשׂוֹת הָרַע
  choice: ili kufanya yaliyo maovu
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la kutenda mambo yenye sifa ya uovu, huku ikihifadhi kusudi linaloonyeshwa na לַעֲשׂוֹת.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi tamathali ya Kiebrania kuhusu tathmini ya Mungu kwa njia inayoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa tetragramatoni YHWH limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi YHWH. ‘Yahwe’ hulihifadhi kama jina, bila kuingiza badala yake cheo cha ‘BWANA’; tanbihi inaonyesha mapokeo na uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mazungumzo ya makabiliano yamehifadhiwa kwa ‘ewe adui yangu,’ na mwangwi wa ‘umenipata/nimekupata’ umetunzwa.
