  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfuatano wa simulizi wa Kiebrania: kutuma ujumbe kwa Yezebeli, taarifa kwamba Nabothi alipigwa mawe, na kwamba akafa. Kauli tendwa “amepigwa mawe” huhifadhi Pual סֻקַּל, na “akafa” huwasilisha vizuri wayyiqtol וַיָּמֹת bila kuongeza “hadi kufa” katika kitenzi cha kwanza.'
  naturalness: “Kisha wakatuma ujumbe kwa Yezebeli, wakisema” ni Kiswahili sanifu, cha asili, na kinafaa kwa simulizi. “Nabothi amepigwa mawe, akafa” ni taarifa fupi na iliyo wazi; mchanganyiko wa hali timilifu katika taarifa na tendo la matokeo unaeleweka vizuri katika muktadha huu.
