base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/014.yaml
  text: Then they sent word to Jezebel[a], saying, “Naboth has been stoned and is dead.”
translation:
  language: sw
  text: Kisha wakatuma ujumbe kwa Yezebeli, wakisema, “Nabothi amepigwa mawe, akafa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nabothi amepigwa mawe, naye amekufa.”
    reason: Tofauti halali ya kisarufi inayowasilisha matukio hayo mawili kama matendo yaliyokamilika katika taarifa.
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Kisha wakatuma ujumbe
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” ni ya kawaida katika Kiswahili. “Wakatuma ujumbe” inaonyesha kuwa walituma taarifa, kama inavyodhihirishwa na fomula inayofuata ya kusema.
- source_word: אֶל
  choice: kwa
  rationale: Katika muktadha wa kutuma ujumbe kwa mtu, “kwa” ni kihusishi cha kawaida na cha asili katika Kiswahili.
- source_word: אִיזֶבֶל
  choice: Yezebeli
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Hii ndiyo fomula ya Kiebrania ya kutambulisha yaliyomo katika ujumbe; “wakisema” ni fupi, wazi, na ya asili katika simulizi.
- source_word: סֻקַּל
  choice: amepigwa mawe
  rationale: Umbo la Pual ni tendwa. Kauli hii huhifadhi kitendo cha kumpiga mtu kwa mawe bila kuongeza maneno “hadi kufa,” kwa kuwa kifo kinatajwa katika kishazi kinachofuata.
- source_word: נָבוֹת
  choice: Nabothi
  rationale: Jina limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili na inayolingana na matumizi yaliyozoeleka.
- source_word: וַיָּמֹת
  choice: akafa
  rationale: 'Wayyiqtol inaonyesha tukio linalofuata: “naye akafa.” Muundo mfupi “akafa” ni wa asili katika Kiswahili na huhifadhi ufuatano wa matukio katika chanzo.'
