  text: Then the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: sw
  text: 'Kisha[a] neno la Yahweh likamjia Eliya, Mtishbi, kusema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikawa kwamba neno la Yahweh likamjia Eliya, Mtishbi, kusema:”
    reason: Njia nyingine ya kutafsiri וַיְהִי kwa kufuata kwa karibu zaidi muundo wa Kiebrania.
lexical_decisions:
- source_word: וַיְהִי
  choice: Kisha ... likamjia
  rationale: Muundo huu unaendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida, bila kutumia msemo mzito wa kale kama “ikawa kwamba.”
- source_word: דְּבַר יְהוָה
  choice: neno la Yahweh
  rationale: “Neno” linahifadhi kauli ya kawaida ya kinabii na uzito wa ufunuo wa Mungu kuliko tafsiri fafanuzi zaidi ya “ujumbe.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limeandikwa kwa matamshi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: אֶל
  choice: likamjia
  rationale: Katika kauli hii ya ufunuo unaomfikia mtu, kiambishi cha Kiswahili “-jia” kinaeleza kwa kawaida kwamba neno lilimjia Eliya.
- source_word: אֵלִיָּהוּ
  choice: Eliya
  rationale: Hili ndilo umbo la jina linalotumiwa kwa kawaida katika Kiswahili.
- source_word: הַתִּשְׁבִּי
  choice: Mtishbi
  rationale: Neno hili linahifadhi kwa ufupi jina la utambulisho wa Eliya linalotokana na mahali au jamii, bila kulipanua kwa maelezo yasiyothibitishwa katika mstari huu.
- source_word: לֵאמֹר
  choice: likisema
  rationale: Neno hili linatanguliza moja kwa moja maneno ya Mungu yanayofuata na linadumisha muundo wa chanzo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu, si cheo. “Yahweh” linahifadhi jina hilo huku likiepuka kulibadilisha kimya kimya kuwa “BWANA.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kisha” ni ya kawaida katika simulizi; “likamjia” na “likisema” huhifadhi kauli ya kinabii bila kufanya sentensi iwe ngumu.
