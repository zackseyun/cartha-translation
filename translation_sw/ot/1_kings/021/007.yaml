  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר אֵלָי/ו֙ אִיזֶ֣בֶל אִשְׁתּ֔/וֹ אַתָּ֕ה עַתָּ֛ה תַּעֲשֶׂ֥ה מְלוּכָ֖ה עַל יִשְׂרָאֵ֑ל ק֤וּם אֱכָל לֶ֨חֶם֙ וְ/יִטַ֣ב לִבֶּ֔/ךָ אֲנִי֙ אֶתֵּ֣ן לְ/ךָ֔ אֶת כֶּ֖רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/007.yaml
  text: Then Jezebel his wife said to him[a], “Do you now govern Israel as king? Get up, eat bread, and let your heart be cheerful[b]; I will give you the vineyard of Naboth the Jezreelite.”
translation:
  language: sw
  text: Kisha Yezebeli mkewe akamwambia[a], “Je, sasa wewe unatawala Israeli kama mfalme? Inuka, kula chakula, na moyo wako uchangamke[b]. Mimi nitakupa shamba la mizabibu la Nabothi Myezreeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sasa wewe unatawala Israeli kama mfalme.” Kiebrania kinaweza kueleweka kama kauli ya dhihaka badala ya swali.
    reason: alternative_reading
  - marker: b
    text: Kiebrania, “ule mkate,” ni nahau yenye maana ya kula mlo.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: Yezebeli mkewe
  rationale: Inahifadhi muundo wa Kiebrania unaomtaja msemaji na uhusiano wake na Ahabu.
- source_word: אַתָּה עַתָּה תַּעֲשֶׂה מְלוּכָה עַל יִשְׂרָאֵל
  choice: Je, sasa wewe ndiye unayetawala Israeli kama mfalme?
  rationale: Kauli ya Kiebrania, kihalisi ‘kufanya ufalme,’ inaeleza kutumia mamlaka ya kifalme. Swali la kejeli linafaa muktadha, huku uwezekano wa kauli ya dhihaka ukihifadhiwa katika tanbihi.
- source_word: קוּם
  choice: Inuka
  rationale: Ni amri ya moja kwa moja na ya kawaida katika Kiswahili sanifu.
- source_word: אֱכָל לֶחֶם
  choice: ule chakula
  rationale: Kihalisi ni ‘ule mkate,’ lakini katika Kiebrania ni nahau ya kula mlo. “Ule chakula” huwasilisha maana ya nahau kwa Kiswahili cha kawaida; umbo halisi limeelezwa katika tanbihi.
- source_word: וְיִטַב לִבֶּךָ
  choice: na moyo wako uchangamke
  rationale: Inahifadhi ‘moyo’ kama kitovu cha hali ya ndani na kuwasilisha wazo la kuondoka katika huzuni.
- source_word: אֲנִי אֶתֵּן לְךָ
  choice: Mimi nitakupa
  rationale: Kiwakilishi cha wazi אֲנִי kina mkazo; “Mimi” kinahifadhi mkazo wa Yezebeli kwamba yeye mwenyewe atalitenda.
- source_word: כֶּרֶם נָבוֹת הַיִּזְרְעֵאלִי
  choice: shamba la mizabibu la Nabothi Myezreeli
  rationale: Huwasilisha mnyororo wa umilikaji kwa Kiswahili cha asili na kuhifadhi utambulisho wa Nabothi kuwa mtu wa Yezreeli.
theological_decisions:
- issue: Nguvu ya kauli ya kwanza ya Yezebeli
  choice: 'Imetafsiriwa kama swali la kejeli: “Je, sasa wewe ndiye unayetawala Israeli kama mfalme?”'
  alternative: 'Kauli au dhihaka: “Sasa wewe ndiye unayetawala Israeli kama mfalme.”'
  rationale: Kiebrania hakina alama wazi ya kuuliza. Muktadha unaunga mkono swali la kejeli linalomkemea Ahabu kwa kutotumia mamlaka yake, lakini uwezekano wa kauli ya dhihaka haujaondolewa na umeandikwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi bila kupoteza mkazo wa Kiebrania; majina yametolewa kama Yezebeli, Nabothi, na Myezreeli.
