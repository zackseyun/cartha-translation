  text: וַ/יְדַבֵּ֣ר אַחְאָ֣ב אֶל נָב֣וֹת לֵ/אמֹר֩ תְּנָ/ה לִּ֨/י אֶֽת כַּרְמְ/ךָ֜ וִֽ/יהִי לִ֣/י לְ/גַן יָרָ֗ק כִּ֣י ה֤וּא קָרוֹב֙ אֵ֣צֶל בֵּיתִ֔/י וְ/אֶתְּנָ֤ה לְ/ךָ֙ תַּחְתָּ֔י/ו כֶּ֖רֶם ט֣וֹב מִמֶּ֑/נּוּ אִ֚ם ט֣וֹב בְּ/עֵינֶ֔י/ךָ אֶתְּנָה לְ/ךָ֥ כֶ֖סֶף מְחִ֥יר זֶֽה־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/002.yaml
  text: And Ahab spoke to Naboth[a], saying, “Give me your vineyard, so that it may become a vegetable garden for me, because it is near my house; and in its place I will give you a better vineyard than it. Or, if it seems good in your eyes, I will give you its price in silver.”
translation:
  language: sw
  text: Ahabu akamwambia Nabothi, “Nipe shamba lako la mizabibu ili liwe bustani yangu ya mboga, kwa sababu liko karibu na nyumba yangu. Badala yake nitakupa shamba la mizabibu lililo bora kuliko hilo; au, ukiona ni vyema,[a] nitakupa fedha kama bei yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “ikiwa ni vyema machoni pako,” nahau yenye maana ya “ukiona ni vyema” au “ukikubali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אַחְאָב אֶל נָבוֹת
  choice: Ahabu akamwambia Nabothi
  rationale: Kitenzi דִּבֵּר pamoja na אֶל humaanisha kumwambia au kusema na mtu. Muundo huu ni wa kawaida katika masimulizi ya Kiswahili na hauongezi namna maalumu ya kusema.
- source_word: תְּנָה לִּי אֶת כַּרְמְךָ
  choice: Nipe shamba lako la mizabibu
  rationale: Kauli ya kuamuru ya נתן pamoja na kiwakilishi cha nafsi ya kwanza ina directness ya ombi la Ahabu. כֶּרֶם hapa ni shamba la mizabibu.
- source_word: וִיהִי לִי לְגַן יָרָק
  choice: ili liwe bustani yangu ya mboga
  rationale: Umbo la היה linaonyesha kusudi au matokeo yaliyokusudiwa. גַּן יָרָק ni bustani ya mimea inayoliwa, kwa hiyo ‘bustani ya mboga’ ni Kiswahili cha sasa na kilicho wazi.
- source_word: כִּי הוּא קָרוֹב אֵצֶל בֵּיתִי
  choice: kwa sababu liko karibu na nyumba yangu
  rationale: Kifungu hiki kinatoa sababu ya Ahabu na kinahifadhi maana ya ukaribu wa mahali.
- source_word: וְאֶתְּנָה לְךָ תַּחְתָּיו
  choice: Badala yake nitakupa
  rationale: תַּחַת pamoja na kiambishi chake huonyesha ubadilishaji; ‘badala yake’ ni usemi wa kawaida unaohifadhi maana hiyo.
- source_word: כֶּרֶם טוֹב מִמֶּנּוּ
  choice: shamba la mizabibu lililo bora kuliko hilo
  rationale: טוֹב pamoja na מִן ni ulinganisho wa ubora, unaotafsiriwa wazi kwa ‘bora kuliko hilo.’
- source_word: אִם טוֹב בְּעֵינֶיךָ
  choice: ukiona ni vyema
  rationale: Hii ni nahau ya Kiebrania ya kuonyesha ridhaa au jambo linalompendeza mtu. ‘Ukiona ni vyema’ ni ya asili katika Kiswahili huku tanbihi ikihifadhi picha halisi ya ‘machoni pako.’
- source_word: כֶּסֶף מְחִיר זֶה
  choice: fedha iliyo thamani yake
  rationale: Kifungu hiki kinaonyesha malipo ya fedha yanayolingana na bei au thamani ya shamba; tafsiri hii ni wazi bila kuongeza dhana ya kisheria isiyosemwa.
