  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa urahisi. Majina yametolewa kwa maumbo yaliyozoeleka ya Kibiblia, ‘Ahabu’ na ‘Nabothi.’
