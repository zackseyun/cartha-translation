base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/027.yaml
  text: And it happened[a], when Ahab heard these words, that he tore his clothes and put sackcloth on his flesh and fasted and lay in sackcloth and went about softly.
translation:
  language: sw
  text: Ikawa Ahabu aliposikia maneno hayo, akararua mavazi yake, akajivika nguo ya gunia juu ya mwili wake, akafunga, akajilaza akiwa amevaa nguo ya gunia, na akawa akitembea kwa taratibu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa upole,” “kwa utulivu,” au “kwa unyonge.” Neno la Kiebrania linaweza kueleza mwendo wa polepole au wa upole; katika muktadha huu linaendana na mwenendo wa maombolezo na kujinyenyekeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Ikawa Ahabu aliposikia
  rationale: “Ikawa” inadumisha fomula ya masimulizi וַיְהִי, huku “aliposikia” ikiwakilisha kwa Kiswahili cha kawaida kishazi cha wakati כִשְׁמֹעַ.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: maneno hayo
  rationale: Muktadha unahusu hukumu iliyotamkwa na Eliya; “maneno” huhifadhi maana ya ujumbe uliosemwa bila kuufanya kuwa dhana ya jumla tu.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: akararua mavazi yake
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya tendo la maombolezo linaloelezwa.
- source_word: וַיָּשֶׂם שַׂק עַל בְּשָׂרוֹ
  choice: akajivika nguo ya gunia mwilini
  rationale: “Nguo ya gunia” ni istilahi inayoeleweka kwa vazi la maombolezo, na “mwilini” huhifadhi picha ya kulivaa juu ya mwili wake bila kutumia usemi mgumu usio wa kawaida.
- source_word: וַיָּצֹם
  choice: akafunga
  rationale: Kitenzi “kufunga” ni njia ya kawaida ya Kiswahili ya kueleza kujinyima chakula kwa kusudi la kidini au la maombolezo.
- source_word: וַיִּשְׁכַּב בַּשָּׂק
  choice: akajilaza akiwa amevaa nguo ya gunia
  rationale: “Akajilaza” huhifadhi tendo la kulala chini bila kuamua kwamba alilala usingizi; kirai kinachofuata kinaonyesha kuwa alikuwa katika vazi hilo.
- source_word: וַיְהַלֵּךְ אַט
  choice: akawa akitembea kwa utulivu
  rationale: Muundo “akawa akitembea” unaonyesha mwenendo unaoendelea, huku “kwa utulivu” ikidokeza mwendo wa taratibu na ulionyenyekea bila kulazimisha maana moja pekee ya אַט.
theological_decisions:
- issue: Hali ya ndani ya mwitikio wa Ahabu
  choice: Kutaja matendo yake ya nje ya maombolezo na kujinyenyekeza bila kutamka kama toba yake ilikuwa ya kweli moyoni
  alternative: Kusema wazi kwamba Ahabu alitubu kwa dhati, au kwamba alifanya maonyesho ya nje tu
  rationale: Aya ya Kiebrania inasimulia matendo yake lakini haitoi hukumu ya moja kwa moja kuhusu uhalisi wa nia yake. Tafsiri kwa hiyo inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi huhifadhi kasi ya simulizi la Kiebrania; istilahi “nguo ya gunia” inaeleweka kwa wasomaji wa kawaida na inadumisha taswira ya maombolezo.
