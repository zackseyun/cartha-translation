base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/004.yaml
  text: So Ahab went into his house sullen and angry because of the word that Naboth the Jezreelite had spoken to him[a], saying, “I will not give you the inheritance of my fathers.” And he lay down on his bed and turned his face away[c][b], and he would not eat bread.
translation:
  language: sw
  text: Basi Ahabu akaingia nyumbani kwake akiwa amenuna na mwenye hasira kwa sababu ya neno ambalo Nabothi Myezreeli alikuwa amemwambia,[a] akisema, “Sitakupa urithi wa baba zangu.”[b] Kisha akajilaza kitandani mwake, akageuza uso wake, wala hakula chakula.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa sababu ya jambo ambalo Nabothi Myezreeli alikuwa amemwambia.” Neno la Kiebrania linaweza kumaanisha “neno,” “jambo,” au “kitu.”
    reason: lexical_alternative
  - marker: b
    text: 'Au “urithi wa mababu zangu.” Kiebrania: “urithi wa baba zangu.”'
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “hakula mkate.” Hii inaweza kuwa nahau inayomaanisha kutokula chakula kwa ujumla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַר וְזָעֵף
  choice: amenuna na mwenye hasira
  rationale: Maneno haya mawili yanaeleza hali ya Ahabu ya kujitenga kwa kinyongo na kuwa amekasirika. “Amenuna na mwenye hasira” ni Kiswahili cha sasa, cha kawaida na chenye uzito unaofaa simulizi.
- source_word: עַל הַדָּבָר אֲשֶׁר דִּבֶּר אֵלָיו
  choice: kwa sababu ya neno ambalo ... alikuwa amemwambia
  rationale: Muundo huu unabaki karibu na urudiaji wa mzizi דבר katika Kiebrania huku ukieleweka kwa Kiswahili. Tanbihi inahifadhi uwezekano wa kutafsiri דָּבָר kuwa “jambo” au kauli kwa ujumla.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Nabothi Myezreeli
  rationale: Jina limetoholewa kwa namna inayosomeka katika Kiswahili, na neno la asili linaloonyesha mtu wa Yezreeli limetafsiriwa “Myezreeli.”
- source_word: נַחֲלַת אֲבוֹתָי
  choice: urithi wa baba zangu
  rationale: “Urithi” huhifadhi maana ya mali ya familia iliyorithiwa, hasa ardhi, na “baba zangu” huhifadhi lugha ya ukoo wa kiume iliyo wazi katika chanzo.
- source_word: וַיִּשְׁכַּב עַל מִטָּתוֹ
  choice: akajilaza kitandani mwake
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayoonyesha tendo la kwenda kujilaza, bila kulazimisha usemi mzito wa “juu ya kitanda chake.”
- source_word: וַיַּסֵּב אֶת פָּנָיו
  choice: akageuza uso wake
  rationale: Tafsiri hii huhifadhi tendo halisi na pia inadokeza kujitenga kwa kununa bila kuongeza upande ambao haukutajwa wazi katika Kiebrania.
- source_word: וְלֹא אָכַל לָחֶם
  choice: wala hakula chakula
  rationale: Ingawa לֶחֶם kimsingi ni “mkate,” hapa inaweza kutumiwa kwa maana pana ya kula chakula. Kiswahili “hakula chakula” huwasilisha nahau hiyo kwa kawaida; maana halisi imewekwa katika tanbihi.
theological_decisions:
- issue: Lugha ya ukoo katika kauli ya Nabothi
  choice: baba zangu
  alternative: mababu zangu / wazee wangu wa zamani
  rationale: Kiebrania אֲבוֹתָי ni wingi wa kiume na, katika muktadha wa ardhi ya urithi wa familia, “baba zangu” huhifadhi mkazo wa chanzo kuhusu urithi uliopokelewa katika ukoo bila kuugeuza kuwa lugha isiyoonyesha jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Viunganishi vya mfululizo “aka-” vinadumisha mwendo wa simulizi, huku tofauti za kileksika na nahau ya “kula mkate” zikihifadhiwa katika tanbihi.
