  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה כֶּ֧רֶם הָיָ֛ה לְ/נָב֥וֹת הַ/יִּזְרְעֵאלִ֖י אֲשֶׁ֣ר בְּ/יִזְרְעֶ֑אל אֵ֚צֶל הֵיכַ֣ל אַחְאָ֔ב מֶ֖לֶךְ שֹׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/001.yaml
  text: After these things[a], Naboth the Jezreelite had a vineyard in Jezreel, beside the palace of Ahab king of Samaria.
translation:
  language: sw
  text: Baada ya mambo hayo[a], Nabothi, Myezreeli, alikuwa na shamba la mizabibu huko Yezreeli, kando ya jumba la kifalme la Ahabu, mfalme wa Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulikuwa na shamba la mizabibu la Nabothi, Myezreeli.” Kiebrania huonyesha umilikaji kwa kusema kihalisi, “kulikuwa na ... kwa Nabothi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: (haijatafsiriwa kwa neno maalumu)
  rationale: Muundo huu unaanzisha tukio jipya katika simulizi. Katika Kiswahili, mpito huo unabebwa kwa kawaida na kishazi cha wakati kinachofuata bila kuongeza ‘ikawa’ au ‘basi’.
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Baada ya mambo hayo
  rationale: Huhifadhi wingi wa Kiebrania na hutumika kwa kawaida kama mpito wa wakati katika Kiswahili sanifu.
- source_word: כֶּרֶם
  choice: shamba la mizabibu
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa vineyard katika Kiswahili cha Afrika Mashariki.
- source_word: הָיָה לְנָבוֹת
  choice: Nabothi ... alikuwa na
  rationale: Muundo wa Kiebrania unaoonyesha kuwapo na umilikaji umetolewa kwa Kiswahili cha kawaida kama ‘alikuwa na’; tafsiri iliyo karibu zaidi na umbo la asili imehifadhiwa katika tanbihi.
- source_word: נָבוֹת
  choice: Nabothi
  rationale: Jina limetoholewa kwa tahajia inayotumika katika mapokeo ya Biblia ya Kiswahili.
- source_word: הַיִּזְרְעֵאלִי
  choice: Myezreeli
  rationale: Neno la nasaba/mahali linamtambulisha Nabothi kuwa mtu wa Yezreeli.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: huko Yezreeli
  rationale: Hukitaja wazi mahali lilipokuwa shamba hilo kwa mtiririko wa kawaida wa Kiswahili.
- source_word: אֵצֶל
  choice: kando ya
  rationale: Huonyesha ukaribu wa moja kwa moja kwa usahihi zaidi kuliko ‘karibu na’.
- source_word: הֵיכַל
  choice: jumba la kifalme
  rationale: Katika muktadha wa mfalme, neno hili linamaanisha makao ya kifalme, si hekalu.
- source_word: אַחְאָב
  choice: Ahabu
  rationale: Jina limetoholewa kwa namna inayotambulika katika Kiswahili.
- source_word: מֶלֶךְ שֹׁמְרוֹן
  choice: mfalme wa Samaria
  rationale: Huhifadhi uhusiano wa muundo wa Kiebrania unaomtambulisha Ahabu kwa eneo lake la kifalme.
