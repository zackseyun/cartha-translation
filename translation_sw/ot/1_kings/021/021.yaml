  text: הִנְ/נִ֨י מבי אֵלֶ֨י/ךָ֙ רָעָ֔ה וּ/בִעַרְתִּ֖י אַחֲרֶ֑י/ךָ וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/021.yaml
  text: Behold[a], I am bringing disaster upon you, and I will sweep away after you, and I will cut off from Ahab every male, both bond and free in Israel.
translation:
  language: sw
  text: “Tazama, nitaleta maafa juu yako. Nitawafagilia mbali wazao wako, na nitamwangamiza kila mwanamume[a] wa Ahabu katika Israeli, awe mtumwa au mtu huru.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kila anayekojoa ukutani,” nahau kali inayomaanisha kila mwanamume.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Tazama
  rationale: Linadumisha uzito na uharaka wa kauli ya kinabii kwa Kiswahili cha kawaida na chenye heshima.
- source_word: מֵבִיא אֵלֶיךָ רָעָה
  choice: nitaleta maafa juu yako
  rationale: Katika muktadha wa hukumu, רָעָה humaanisha balaa au maafa, si lazima uovu wa kimaadili. Wakati ujao wa Kiswahili unaonyesha hatua inayokaribia kutekelezwa.
- source_word: וּבִעַרְתִּי אַחֲרֶיךָ
  choice: Nitaufagilia mbali uzao wako
  rationale: Kirai hiki cha hukumu kinamaanisha kuondoa kabisa wale wanaokuja baada ya Ahabu, yaani uzao wake. 'Kufagilia mbali' huhifadhi picha ya kuondolewa kabisa, huku 'uzao wako' ikiweka wazi rejeo linalodokezwa.
- source_word: וְהִכְרַתִּי לְאַחְאָב
  choice: nitamwangamiza ... wa nyumba ya Ahabu
  rationale: כרת katika fomula hii ni kuondoa au kuangamiza kabisa. 'Wa nyumba ya Ahabu' ni Kiswahili cha asili kinachoonyesha wale walio wa ukoo wake bila kumaanisha jengo.
- source_word: מַשְׁתִּין בְּקִיר
  choice: kila mwanamume[a]
  rationale: Ni nahau kali ya Kiebrania inayowataja wanaume wote. Maana yake imewekwa katika matini, na usemi halisi umehifadhiwa katika tanbihi.
- source_word: וְעָצוּר וְעָזוּב
  choice: awe mtumwa au mtu huru
  rationale: Jozi hii katika fomula ya kuangamiza huonyesha kutobakizwa mtu wa hali yoyote. Tafsiri hii ya kimapokeo ni wazi kwa msomaji wa sasa, ingawa maneno ya Kiebrania yenyewe yanaweza kueleweka kihalisi kama aliyefungwa na aliyeachwa huru.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Ni tafsiri ya kawaida ya mahali na inasomeka kwa urahisi.
theological_decisions:
- issue: Maana ya רָעָה katika tangazo la hukumu ya Mungu
  choice: maafa
  alternative: uovu
  rationale: '''Maafa'' huwasilisha balaa la hukumu linalokusudiwa katika muktadha bila kudai kwamba Mungu anatenda uovu wa kimaadili.'
- issue: Walengwa wa וּבִעַרְתִּי אַחֲרֶיךָ
  choice: uzao wako
  alternative: walio nyuma yako
  rationale: Muktadha unaofuata kuhusu kukatiliwa mbali kwa wanaume wa nyumba ya Ahabu unaonyesha kwamba wanaokuja baada yake ni uzao au nasaba yake. Tafsiri hii inaeleweka kwa Kiswahili huku ikidumisha ukali wa hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye uzito wa tangazo la kinabii lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi zimegawanywa ili hukumu tatu zisomeke kwa uwazi. Tanbihi huhifadhi ukali wa nahau ya Kiebrania bila kuuweka katika matini kuu.
