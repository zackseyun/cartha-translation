  text: וְ֠/הוֹשִׁיבוּ שְׁנַ֨יִם אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ נֶגְדּ/וֹ֒ וִ/יעִדֻ֣/הוּ לֵ/אמֹ֔ר בֵּרַ֥כְתָּ אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וְ/הוֹצִיאֻ֥/הוּ וְ/סִקְלֻ֖/הוּ וְ/יָמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/010.yaml
  text: And seat two worthless men opposite him[a], and let them testify against him, saying, ‘You have cursed God and the king.’ Then bring him out and stone him, so that he dies.
translation:
  language: sw
  text: Wakalisheni mbele yake watu wawili waovu, nao watoe ushahidi dhidi yake, wakisema, “Umemlaani[a] Mungu na mfalme.” Kisha mtoeni nje, mkampige kwa mawe ili afe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, Kiebrania kinasema, “Umembariki Mungu na mfalme.” Hapa kitenzi “bariki” ni fumbo la staha linalomaanisha “laani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיבוּ
  choice: Wakalishe
  rationale: Kauli ya kutendesha ya kitenzi ישׁב ina maana ya kuwafanya wakae; “wakalishe” huhifadhi nguvu hiyo ya amri kwa Kiswahili cha kawaida.
- source_word: שְׁנַיִם אֲנָשִׁים
  choice: watu wawili
  rationale: Huhifadhi idadi ya mashahidi inayotajwa wazi katika mazingira haya ya kisheria.
- source_word: בְּנֵי בְלִיַּעַל
  choice: watu wawili waovu
  rationale: Nahau hii inaeleza watu wapotovu na wasio na maadili; “waovu” huwasilisha hukumu ya kimaadili bila kutafsiri kwa namna ngumu ya neno kwa neno au kufanya Beliali kuwa jina maalumu.
- source_word: נֶגְדּוֹ
  choice: mbele yake
  rationale: Inaonyesha kuwa watu hao wakae wakimkabili Nabothi katika mkutano wa hadhara; “mbele yake” ni ya asili na yenye hadhi katika Kiswahili.
- source_word: וִיעִדֻהוּ
  choice: wamshuhudie
  rationale: Katika muktadha wa kisheria kitenzi hiki kinamaanisha kutoa ushahidi dhidi ya mtu. Muktadha unaonyesha wazi kuwa ushahidi huo ni dhidi yake.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Ni utangulizi wa kawaida wa maneno yaliyonukuliwa.
- source_word: בֵּרַכְתָּ
  choice: Umemlaani
  rationale: Ingawa kitenzi ברך kwa kawaida ni “bariki,” hapa kinatumika kama lugha ya staha badala ya “laani.” Muktadha wa shtaka la kifo unahitaji maana ya “laani,” huku umbo halisi likielezwa katika tanbihi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika shtaka hili, sambamba na “mfalme,” rejeleo la umoja kwa Mungu ndilo linalokusudiwa.
- source_word: וָמֶלֶךְ
  choice: na mfalme
  rationale: Huhifadhi uratibu wa moja kwa moja wa shtaka dhidi ya Mungu na dhidi ya mamlaka ya kifalme.
- source_word: וְהוֹצִיאֻהוּ
  choice: Kisha mtoe nje
  rationale: Hutoa kwa uwazi amri ya kumpeleka nje kwa ajili ya utekelezaji wa hukumu.
- source_word: וְסִקְלֻהוּ
  choice: mkampige mawe
  rationale: Ni usemi wa kawaida wa Kiswahili kwa adhabu ya kumuua mtu kwa kumpiga kwa mawe.
- source_word: וְיָמֹת
  choice: ili afe
  rationale: Huhifadhi kusudi au matokeo yaliyokusudiwa ya kumpiga mawe.
theological_decisions:
- issue: Matumizi ya ברך kama lugha ya staha Mungu akiwa ndiye mtendewa
  choice: Kutafsiri “Umemlaani” katika matini kuu
  alternative: Kutafsiri neno kwa neno “Umembariki” na kutegemea tanbihi kueleza maana
  rationale: Shtaka lililotungwa ni la kumkufuru Mungu na kumtukana mfalme, kosa lililolengwa kuleta hukumu ya kifo. “Umembariki” lingepotosha maana kwa msomaji wa kawaida; tanbihi inadumisha uwazi kuhusu umbo la Kiebrania.
- issue: Maana ya בְּנֵי בְלִיַּעַל
  choice: watu waovu
  alternative: wana wa Beliali; watu wasiofaa kitu
  rationale: Hapa ni nahau ya watu wapotovu, si lazima jina la kiumbe cha kiroho. “Waovu” huepuka kuingiza uhusiano wa kidemonolojia usiotakiwa na huwasilisha tabia yao ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri za wingi umehifadhiwa, na sentensi imewekwa kwa mtiririko wa kawaida bila kuficha mazingira yake ya kisheria.
