base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/011.yaml
  text: So the men of his city—the elders and the nobles who lived in his city—did as Jezebel had sent to them[a], as it was written in the letters that she had sent to them.
translation:
  language: sw
  text: Basi wanaume wa mji wake—wazee na wakuu[a] walioishi katika mji wake—wakafanya kama Yezebeli alivyowatumia, kama ilivyoandikwa katika barua alizowatumia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waheshimiwa”; neno la Kiebrania lililotafsiriwa “wakuu” linaweza kumaanisha watu mashuhuri katika jamii au maofisa wenye cheo cha juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: wakafanya
  rationale: Kitenzi עשה hapa kinaonyesha kuwa viongozi wa mji walitekeleza maagizo ya Yezebeli; “wakafanya” huhifadhi usimulizi wa moja kwa moja.
- source_word: אַנְשֵׁי עִירוֹ
  choice: watu wa mji wake
  rationale: Ingawa אַנְשֵׁי kwa umbo ni “wanaume wa,” hapa kirai kinawatambulisha wenyeji wanaofafanuliwa mara moja kuwa wazee na wakuu; “watu wa mji wake” ni Kiswahili cha kawaida na hakibadili utambulisho wao wa kiuongozi.
- source_word: הַזְּקֵנִים
  choice: wazee
  rationale: Katika muktadha wa kiraia, neno hili linamaanisha viongozi wa jamii wanaotambuliwa, si watu wenye umri mkubwa tu.
- source_word: הַחֹרִים
  choice: wakuu
  rationale: Katika muktadha huu חֹרִים ni watu wenye hadhi ya juu au mamlaka katika jamii. “Wakuu” ni neno la kawaida la Kiswahili linalofaa hapa, huku tanbihi ikitaja uwezekano wa “waheshimiwa.”
- source_word: הַיֹּשְׁבִים בְּעִירוֹ
  choice: walioishi katika mji wake
  rationale: ישב hapa huonyesha makazi; “walioishi” ni ya kawaida na huepuka tafsiri halisi isiyofaa ya “walioketi.”
- source_word: כַּאֲשֶׁר שָׁלְחָה אֲלֵיהֶם אִיזָבֶל
  choice: kama Yezebeli alivyowaagiza
  rationale: Kiebrania kinasema kihalisi “kama Yezebeli alivyotuma kwao,” huku kitu kilichotumwa kikieleweka kutokana na barua na muktadha wa maagizo. “Alivyowaagiza” hutoa maana hiyo kwa Kiswahili cha kawaida bila kuongeza maudhui mapya.
- source_word: כָּתוּב בַּסְּפָרִים
  choice: kama ilivyoandikwa katika barua
  rationale: סְפָרִים hapa ni maandishi ya mawasiliano aliyotuma Yezebeli; “barua” ni sahihi zaidi kimuktadha kuliko “vitabu” au “hati.”
- source_word: אֲשֶׁר שָׁלְחָה אֲלֵיהֶם
  choice: alizowatumia
  rationale: Kirai hiki kinazitambulisha barua kuwa zile alizowatuma; “alizowatumia” ni kifupi, wazi, na cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa lakini wenye heshima. Marudio ya “mji wake” na muundo wa kulinganisha yamehifadhiwa kwa sababu yanaakisi msisitizo wa maandishi ya Kiebrania.
