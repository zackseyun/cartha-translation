translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo ya kawaida ya kibiblia: Yezebeli, Nabothi, Ahabu, na Yezreeli. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachohusika.'
