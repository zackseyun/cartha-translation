  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ אִיזֶ֔בֶל כִּֽי סֻקַּ֥ל נָב֖וֹת וַ/יָּמֹ֑ת וַ/תֹּ֨אמֶר אִיזֶ֜בֶל אֶל אַחְאָ֗ב ק֣וּם רֵ֞שׁ אֶת כֶּ֣רֶם נָב֣וֹת הַ/יִּזְרְעֵאלִ֗י אֲשֶׁ֤ר מֵאֵן֙ לָ/תֶת לְ/ךָ֣ בְ/כֶ֔סֶף כִּ֣י אֵ֥ין נָב֛וֹת חַ֖י כִּי מֵֽת־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/015.yaml
  text: When Jezebel heard that Naboth had been stoned and had died[a], Jezebel said to Ahab, “Get up, take possession of the vineyard of Naboth the Jezreelite, which he refused to give you for silver, because Naboth is not alive; he is dead.”
translation:
  language: sw
  text: Ikawa, Yezebeli aliposikia kwamba Nabothi alikuwa amepigwa mawe, akafa, akamwambia Ahabu, “Inuka, ukamiliki shamba la mizabibu la Nabothi wa Yezreeli, ambalo alikataa kukupa kwa fedha,[a] kwa maana Nabothi hayuko hai; amekufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambalo alikataa kukuuzia kwa pesa.” Kiebrania kinasema kihalisi, “ambalo alikataa kukupa kwa fedha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Ikawa ... aliposikia
  rationale: Muundo huu unahifadhi fomula ya usimulizi wa Kiebrania huku ukitumia Kiswahili cha kawaida kinachoonyesha wakati wa tukio.
- source_word: סֻקַּל
  choice: alikuwa amepigwa mawe
  rationale: Kitenzi cha hali tendwa kinahifadhi njia halisi ya adhabu na kuonyesha kwamba tukio lilikuwa limetangulia maneno ya Yezebeli.
- source_word: וַיָּמֹת
  choice: na kufa
  rationale: 'Kauli hii inaendeleza taarifa aliyosikia Yezebeli: Nabothi alipigwa mawe, naye akafa.'
- source_word: קוּם
  choice: Inuka
  rationale: Ni amri ya moja kwa moja na yenye hadhi, inayolingana vizuri na קוּם bila kutumia lugha ya kizamani isiyo ya lazima.
- source_word: רֵשׁ
  choice: ukamiliki
  rationale: ירש hapa ina maana ya kuingia katika umiliki wa mali. 'Ukamiliki' ni ya kawaida na haibani maana kuwa urithi wa kisheria.
- source_word: כֶּרֶם
  choice: shamba la mizabibu
  rationale: Hili ni neno la kawaida na linaloeleweka katika Kiswahili kwa eneo linalolimwa mizabibu.
- source_word: הַיִּזְרְעֵאלִי
  choice: Myezreeli
  rationale: Nomino hii ya Kiswahili inahifadhi sifa ya Nabothi kuwa mtu wa Yezreeli.
- source_word: מֵאֵן לָתֵת לְךָ בְכֶסֶף
  choice: alilokataa kukupa kwa fedha
  rationale: Tafsiri hii inafuata kwa karibu usemi wa Kiebrania, 'kukupa kwa fedha,' bila kuufasiri kimya kimya kuwa kuuza.
- source_word: בְכֶסֶף
  choice: kwa fedha
  rationale: '''Fedha'' huhifadhi maana halisi ya כסף na pia hueleweka kama malipo katika muktadha huu.'
- source_word: אֵין נָבוֹת חַי
  choice: Nabothi hayuko hai
  rationale: Usemi huu unahifadhi kauli ya kwanza ya Kiebrania na mkazo wake kabla ya kauli ya mwisho, 'amekufa.'
- source_word: כִּי מֵת
  choice: amekufa
  rationale: Kauli fupi na ya moja kwa moja inahifadhi ukali wa maneno ya Yezebeli na kutofautisha kauli hii na 'hayuko hai.'
