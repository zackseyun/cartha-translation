revisions:
- from: Ikawa Yezebeli aliposikia kwamba Nabothi alikuwa amepigwa mawe na kufa, akamwambia Ahabu, “Inuka, ukamiliki shamba la mizabibu la Nabothi Myezreeli, ambalo alikataa kukupa kwa fedha,[a] kwa maana Nabothi hayuko hai; amekufa.”
  to: Ikawa, Yezebeli aliposikia kwamba Nabothi alikuwa amepigwa mawe, akafa, akamwambia Ahabu, “Inuka, ukamiliki shamba la mizabibu la Nabothi wa Yezreeli, ambalo alikataa kukupa kwa fedha,[a] kwa maana Nabothi hayuko hai; amekufa.”
  rationale: The revision corrects the awkward coordination of Naboth’s stoning and death, and uses a natural Swahili expression for his Jezreelite identity. It otherwise preserves the draft’s close rendering of the Hebrew, including “kwa fedha” and the emphatic final statement that Naboth is not alive and is dead.
