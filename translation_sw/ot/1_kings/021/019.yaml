  text: וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/רָצַ֖חְתָּ וְ/גַם יָרָ֑שְׁתָּ וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה בִּ/מְק֗וֹם אֲשֶׁ֨ר לָקְק֤וּ הַ/כְּלָבִים֙ אֶת דַּ֣ם נָב֔וֹת יָלֹ֧קּוּ הַ/כְּלָבִ֛ים אֶת דָּמְ/ךָ֖ גַּם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/019.yaml
  text: 'And you shall speak to him[a], saying, ‘Thus says Yahweh: Have you murdered and also taken possession?’ And you shall speak to him, saying, ‘Thus says Yahweh: In the place where the dogs licked the blood of Naboth[b], the dogs shall lick your blood—you also.’'
translation:
  language: sw
  text: 'Utazungumza naye, ukisema, “Yahwe asema hivi: Je, umeua[a] na pia ukajitwalia?” Na utazungumza naye, ukisema, “Yahwe asema hivi: Mahali ambapo mbwa waliiramba damu ya Nabothi, mbwa watairamba damu yako—wewe pia[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umefanya mauaji.” Kitenzi cha Kiebrania humaanisha kuua isivyo halali, si kuua kwa maana ya jumla tu.
    reason: lexical_alternative
  - marker: b
    text: Maneno ya mwisho “wewe pia” yana msisitizo katika Kiebrania, yakionyesha kwamba hukumu hiyo itamhusu Ahabu yeye mwenyewe.
    reason: lexical_emphasis
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו לֵאמֹר
  choice: Utazungumza naye, ukisema
  rationale: Inahifadhi muundo wa agizo la kinabii na marudio yake katika Kiebrania, huku ikibaki kuwa Kiswahili cha kawaida na chenye hadhi.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahwe asema hivi
  rationale: Inahifadhi fomula ya mjumbe wa kinabii na kulitaja jina la Mungu יְהוָה kwa unukuzi wa moja kwa moja.
- source_word: הֲרָצַחְתָּ
  choice: Je, umeua
  rationale: Kitenzi רצח kina nguvu ya kimaadili ya kuua isivyo halali. Kiswahili ‘umeua’ ni cha moja kwa moja; tanbihi inaeleza maana kali ya mauaji bila kuongeza maneno yasiyokuwapo wazi katika sentensi.
- source_word: וְגַם יָרָשְׁתָּ
  choice: na pia ukajitwalia
  rationale: ירש hapa inaeleza kuchukua kuwa milki baada ya kifo cha Nabothi. ‘Ukajitwalia’ huwasilisha kuchukua umiliki kwa muktadha huu, huku kitu kilichotwaliwa kikibaki kama kilivyoachwa wazi katika Kiebrania.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: Mahali ambapo
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya muundo wa mahali katika Kiebrania.
- source_word: לָקְקוּ ... יָלֹקּוּ
  choice: waliiramba ... watairamba
  rationale: Mzizi uleule wa kitenzi unarudiwa ili kuhifadhi ulinganifu wa hukumu ya kinabii.
- source_word: דַּם נָבוֹת
  choice: damu ya Nabothi
  rationale: Muundo wa umilikaji umetafsiriwa moja kwa moja, na jina limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: אֶת דָּמְךָ גַּם אָתָּה
  choice: damu yako—wewe pia
  rationale: Muundo huu unahifadhi msisitizo wa ghafla wa maneno ya mwisho גם אתה badala ya kuuyeyusha katika sentensi laini zaidi.
theological_decisions:
- issue: Nguvu ya kimaadili ya הֲרָצַחְתָּ
  choice: Kutumia ‘umeua’ na kueleza katika tanbihi kuwa hapa ni kuua isivyo halali, yaani kufanya mauaji.
  alternative: Umefanya mauaji
  rationale: ‘Umeua’ ni ya moja kwa moja na haisukumii nomino ya Kiswahili katika wingi, lakini tanbihi inalinda uzito wa shtaka la kinabii uliomo katika רצח.
- issue: Msisitizo wa mwisho גם אָתָּה
  choice: 'Kuhifadhi maneno yaliyotengwa: ‘—wewe pia.’'
  alternative: hata damu yako
  rationale: Kiebrania kinamalizia kwa kiwakilishi chenye msisitizo kinachomlenga Ahabu mwenyewe. Muundo uliotengwa unahifadhi ukali na mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya ‘Utazungumza naye, ukisema’ yamehifadhiwa kwa sababu ni sehemu ya muundo na nguvu ya usemi wa kinabii. Taswira kali ya mbwa kuramba damu haijalainishwa.
