    issue: “Kisha” in the second commissioning formula
    rationale: The Hebrew repeats waw + the same commission formula; it does not specifically mark a subsequent step. “Na” preserves the formal repetition more closely.
  - severity: medium
    issue: Footnote b introduces “aibu ileile”
    rationale: גם אתה emphasizes that the announced outcome applies to Ahab personally; the phrase itself does not explicitly state disgrace. The note should explain the grammatical/rhetorical emphasis without adding that characterization.
