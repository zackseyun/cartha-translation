  text: הֲֽ/רָאִ֔יתָ כִּֽי נִכְנַ֥ע אַחְאָ֖ב מִ/לְּ/פָנָ֑/י יַ֜עַן כִּֽי נִכְנַ֣ע מִ/פָּנַ֗/י לֹֽא אבי הָֽ/רָעָה֙ בְּ/יָמָ֔י/ו בִּ/ימֵ֣י בְנ֔/וֹ אָבִ֥יא הָ/רָעָ֖ה עַל בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/029.yaml
  text: Have you seen that Ahab has humbled himself before me? Because he has humbled himself before me[a], I will not bring the disaster in his days[b]; in his son's days I will bring the disaster on his house.
translation:
  language: sw
  text: Je, umeona kwamba Ahabu amejinyenyekeza mbele zangu? Kwa sababu amejinyenyekeza mbele zangu, sitaleta maafa[a] hayo katika siku zake; katika siku za mwanawe nitaleta maafa hayo juu ya nyumba yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msiba”; kwa Kiebrania, “uovu/maafa.” Katika muktadha huu wa hukumu, neno hilo linamaanisha maafa ya adhabu, si uovu wa kimaadili.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba yake” inaweza kumaanisha watu wa nyumbani mwake au ukoo wake wa kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: Je, umeona
  rationale: Kitenzi timilifu katika swali la moja kwa moja kwa Eliya kinaonyesha jambo ambalo ameona na ambalo lina umuhimu sasa.
- source_word: נִכְנַע
  choice: alivyojinyenyekeza / amejinyenyekeza
  rationale: Nifali ya כנע hapa inaonyesha Ahabu kujishusha na kukubali hukumu mbele za Mungu; ‘kujinyenyekeza’ huhifadhi maana hiyo bila kuitafsiri moja kwa moja kuwa toba kamili.
- source_word: מִלְּפָנַי / מִפָּנַי
  choice: mbele zangu
  rationale: Hii ni tafsiri ya kawaida na ya asili ya nahau inayomaanisha kuwa katika uwepo wa Mungu au katika uhusiano wa unyenyekevu kwake.
- source_word: יַעַן כִּי
  choice: Kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya Mungu kuahirisha hukumu iliyotangazwa.
- source_word: לֹא אָבִיא
  choice: sitaleta
  rationale: Hifili ya בוא pamoja na רָעָה humaanisha kuleta au kusababisha maafa yatokee.
- source_word: הָרָעָה
  choice: maafa hayo
  rationale: Katika muktadha wa hukumu, רָעָה ni janga au maafa ya adhabu, si uovu wa kimaadili; ‘hayo’ yanaelekeza kwenye hukumu iliyotangazwa tayari.
- source_word: בְּיָמָיו
  choice: katika siku zake
  rationale: Huhifadhi nahau ya Kiebrania na kuonyesha kipindi cha maisha ya Ahabu.
- source_word: בִּימֵי בְנוֹ
  choice: katika siku za mwanawe
  rationale: Huhifadhi ulinganifu na ‘katika siku zake’ na utofauti wa vizazi uliomo katika Kiebrania.
- source_word: עַל בֵּיתוֹ
  choice: juu ya nyumba yake
  rationale: ‘Nyumba’ huhifadhi picha pana ya Kiebrania, ambayo katika muktadha wa kifalme inaweza kumaanisha jamaa ya nyumbani au ukoo wa kifalme.
theological_decisions:
- issue: Asili ya mwitikio wa Ahabu
  choice: am(e)jinyenyekeza
  alternative: ametubu / amejisalimisha
  rationale: Aya inasema Ahabu alijinyenyekeza mbele za Mungu, lakini haitumii wazi msamiati wa kawaida wa toba; tafsiri haiongezi hitimisho la kitheolojia lisilotajwa.
- issue: Maana ya רָעָה inapoletwa na Mungu
  choice: maafa
  alternative: uovu / msiba
  rationale: Muktadha unahusu hukumu yenye adhabu, si uovu wa kimaadili unaofanywa na Mungu. ‘Maafa’ huwasilisha kwa uwazi janga la hukumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa swali umefanywa wa kawaida kwa ‘Je, umeona jinsi...’; ulinganifu wa ‘katika siku zake / katika siku za mwanawe’ umehifadhiwa. Viashiria vyote vya tanbihi vimewekwa katika maandishi.
