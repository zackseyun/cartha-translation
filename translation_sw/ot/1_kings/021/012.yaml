  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mahali pa mbele kati ya watu” kinaeleweka kwa urahisi na hakiamui kwa lazima ikiwa Nabothi alikuwa mbele ya kusanyiko au katika nafasi ya heshima miongoni mwao.
