  text: They proclaimed a fast and seated Naboth at the head of the people[a].
translation:
  language: sw
  text: Wakatangaza mfungo na kumketisha Nabothi mahali pa mbele miongoni mwa watu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbele ya watu” au “mahali pa kwanza miongoni mwa watu.” Kihalisi, usemi wa Kiebrania unasema “kwenye kichwa cha watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: Wakatangaza
  rationale: Kitenzi קרא pamoja na צום humaanisha kutangaza rasmi mfungo wa hadhara; “wakatangaza” ni Kiswahili cha kawaida na sahihi kwa tendo hilo.
- source_word: צוֹם
  choice: mfungo
  rationale: Nomino hii inaashiria kipindi rasmi cha kujinyima chakula kilichotangazwa kwa jamii; “mfungo” huhifadhi maana ya tukio rasmi kuliko “kufunga” pekee.
- source_word: וְהֹשִׁיבוּ
  choice: na kumketisha
  rationale: Hifili ya ישב humaanisha kumsababisha mtu akae, yaani kumketisha katika nafasi iliyotengwa.
- source_word: אֶת נָבוֹת
  choice: Nabothi
  rationale: אֶת humtambulisha Nabothi kuwa mtendwa bayana; jina limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: בְּרֹאשׁ
  choice: mahali pa mbele kati ya
  rationale: Kirai hiki kihalisi ni “kwenye kichwa/mwanzo wa”; katika mkutano wa hadhara kinaashiria nafasi ya mbele au mashuhuri. Tafsiri hii ni ya asili kwa Kiswahili huku tanbihi ikihifadhi taswira halisi na uwezekano mwingine.
- source_word: הָעָם
  choice: watu
  rationale: עם hapa ni watu waliokusanyika, huenda katika mkutano wa kijamii au wa kimahakama; “watu” ndiyo tafsiri ya moja kwa moja isiyoongeza ufafanuzi.
