  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: רַ֚ק לֹֽא הָיָ֣ה כְ/אַחְאָ֔ב אֲשֶׁ֣ר הִתְמַכֵּ֔ר לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה אֲשֶׁר הֵסַ֥תָּה אֹת֖/וֹ אִיזֶ֥בֶל אִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/025.yaml
  text: Surely there was no one like Ahab, who sold himself to do what was evil in the sight of Yahweh, because Jezebel his wife incited him.
translation:
  language: sw
  text: Kwa kweli, hakukuwa na mtu kama Ahabu, aliyejiuza kufanya yaliyo maovu machoni pa Yahwe, ambaye Yezebeli mkewe alimchochea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Kwa kweli
  rationale: Katika muktadha huu chembe hii inasisitiza kauli inayofuata; “Kwa kweli” huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: לֹא הָיָה כְאַחְאָב
  choice: hakukuwa na mtu kama Ahabu
  rationale: Hii ni nahau ya kutokuwa na kifani. Neno “mtu” linaongezwa ili sentensi iwe kamili na ya kawaida kwa Kiswahili bila kubadili maana.
- source_word: הִתְמַכֵּר
  choice: aliyejiuza
  rationale: Kauli hii ina picha ya sitiari ya mtu aliyejiuza ili kujitoa kwa uovu; tafsiri hii inadumisha ukali na picha ya Kiebrania.
- source_word: לַעֲשׂוֹת הָרַע
  choice: kufanya yaliyo maovu
  rationale: Hueleza kutenda mambo yanayohukumiwa kuwa maovu, na muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Nahau ya Kiebrania ya tathmini imehifadhiwa kwa picha yake ya “machoni,” ambayo inaeleweka vizuri kwa Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: הֵסַתָּה
  choice: alimchochea
  rationale: Kitenzi hiki kinaonyesha kumsukuma au kumshawishi mtu kuelekea tendo baya; “alimchochea” kinawasilisha maana hiyo ya hasi.
- source_word: אֲשֶׁר הֵסַתָּה אֹתוֹ אִיזֶבֶל אִשְׁתּוֹ
  choice: ambaye Yezebeli mkewe alimchochea
  rationale: Kishazi rejeshi cha Kiebrania kinamhusisha Ahabu moja kwa moja na kitendo cha Yezebeli; muundo huu unadumisha uhusiano huo bila kuugeuza waziwazi kuwa sababu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uwajibikaji wa Ahabu na ushawishi wa Yezebeli
  choice: Ahabu “aliyejiuza,” naye Yezebeli “alimchochea”
  alternative: 'Kutafsiri kishazi cha mwisho waziwazi kuwa sababu: “kwa sababu Yezebeli mkewe alimchochea”'
  rationale: Maandishi yanashikilia pamoja kujitoa kwa hiari kwa Ahabu katika uovu na kuchochewa kwake na Yezebeli. Kishazi rejeshi kinadumisha mvutano huo bila kufanya ushawishi wa Yezebeli uondoe uwajibikaji wa Ahabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari “aliyejiuza” na nahau “machoni pa Yahwe” zimehifadhiwa kwa sababu zinaeleweka na kubeba nguvu ya maandishi ya Kiebrania.
