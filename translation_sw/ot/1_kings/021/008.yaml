  text: וַ/תִּכְתֹּ֤ב סְפָרִים֙ בְּ/שֵׁ֣ם אַחְאָ֔ב וַ/תַּחְתֹּ֖ם בְּ/חֹתָמ֑/וֹ וַ/תִּשְׁלַ֣ח ה/ספרים אֶל הַ/זְקֵנִ֤ים וְ/אֶל הַֽ/חֹרִים֙ אֲשֶׁ֣ר בְּ/עִיר֔/וֹ הַ/יֹּשְׁבִ֖ים אֶת נָבֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/008.yaml
  text: So she wrote letters in Ahab’s name[a], sealed them with his seal, and sent the letters to the elders and to the nobles who were in his city, who were living with Naboth.
translation:
  language: sw
  text: Basi akaandika barua kwa jina la Ahabu, akazitia muhuri kwa muhuri wake, kisha akazituma kwa wazee na kwa wakuu waliokuwa katika mji wake[a], walioishi pamoja na Nabothi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa katika mji wa Ahabu.” Kiambishi cha Kiebrania katika “mji wake” kinaweza kueleweka kuwa kinamrejelea Nabothi au Ahabu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Basi akaandika
  rationale: Waw-consecutive inaendeleza simulizi; “Basi” huonyesha mwendelezo wa matukio kwa Kiswahili cha kawaida. Kiambishi cha kitenzi cha Kiswahili hakibainishi jinsia, lakini mtendaji anaeleweka kuwa Yezebeli kutokana na muktadha.
- source_word: סְפָרִים / הַסְּפָרִים
  choice: barua
  rationale: Katika muktadha huu סֵפֶר ni nyaraka za mawasiliano rasmi zilizotumwa kwa viongozi wa mji; “barua” ni tafsiri ya kawaida na sahihi.
- source_word: בְּשֵׁם אַחְאָב
  choice: kwa jina la Ahabu
  rationale: Nahau hii huonyesha kutenda kwa mamlaka au uwakilishi wa Ahabu; “kwa jina la Ahabu” huhifadhi maana hiyo kwa Kiswahili sanifu.
- source_word: וַתַּחְתֹּם בְּחֹתָמוֹ
  choice: akazitia muhuri wake
  rationale: Kitenzi חתם pamoja na חותם humaanisha kuweka muhuri rasmi kwenye nyaraka. Kauli hii ni ya asili kwa Kiswahili na huhifadhi kwamba muhuri ulikuwa wa Ahabu.
- source_word: הַזְּקֵנִים
  choice: wazee
  rationale: Neno hili humaanisha wazee au viongozi wa kiraia wa eneo; “wazee” ni tafsiri iliyozoeleka na muktadha unaonyesha jukumu lao la uongozi.
- source_word: הַחֹרִים
  choice: wakuu
  rationale: חֹרִים hurejelea watu wa hadhi ya juu au viongozi mashuhuri. “Wakuu” ni neno la sasa, lenye heshima, na linaloeleweka kwa urahisi.
- source_word: אֲשֶׁר בְּעִירוֹ
  choice: waliokuwa katika mji wake
  rationale: Kiambishi cha nafsi ya tatu umoja wa kiume kimehifadhiwa kama “wake” bila kukiondoa; katika matini kuu kinaelekezwa kwa Nabothi, huku uwezekano wa kumrejelea Ahabu ukihifadhiwa katika tanbihi.
- source_word: הַיֹּשְׁבִים אֶת נָבוֹת
  choice: walioishi pamoja na Nabothi
  rationale: ישב pamoja na אֶת inaweza kueleza kukaa au kuishi pamoja na mtu katika eneo lilelile. Tafsiri hii huhifadhi uhusiano wa kimahali kwa lugha ya kawaida.
theological_decisions:
- issue: Mrejelewa wa kiambishi katika בְּעִירוֹ (“mji wake”)
  choice: Katika matini kuu, “wake” anamrejelea Nabothi.
  alternative: “Wake” anaweza kumrejelea Ahabu, hivyo maana ikawa “mji wa Ahabu.”
  rationale: Mwisho wa kishazi na maelezo yanayofuata kuhusu walioishi pamoja na Nabothi yanaunga mkono mrejelewa Nabothi. Hata hivyo, kwa kuwa barua ziliandikwa kwa jina la Ahabu, sarufi pia inaruhusu Ahabu kuwa mrejelewa; uwezekano huo umehifadhiwa katika tanbihi badala ya kuamuliwa kimya kimya.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Ahabu na Nabothi. Alama ya tanbihi imewekwa moja kwa moja baada ya kirai chenye utata, “mji wake.”'
