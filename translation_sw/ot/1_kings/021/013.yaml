  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הָ/אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ וַ/יֵּשְׁב֣וּ נֶגְדּ/וֹ֒ וַ/יְעִדֻ/הוּ֩ אַנְשֵׁ֨י הַ/בְּלִיַּ֜עַל אֶת נָב֗וֹת נֶ֤גֶד הָ/עָם֙ לֵ/אמֹ֔ר בֵּרַ֥ךְ נָב֛וֹת אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וַ/יֹּצִאֻ֨/הוּ֙ מִ/ח֣וּץ לָ/עִ֔יר וַ/יִּסְקְלֻ֥/הוּ בָ/אֲבָנִ֖ים וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/013.yaml
  text: Then the two worthless men came in and sat opposite him[a], and the worthless men testified against Naboth before the people, saying, “Naboth cursed God and the king.” So they brought him outside the city and stoned him with stones[b], and he died.
translation:
  language: sw
  text: Ndipo wale watu wawili waovu wakaingia, wakaketi mkabala naye[a]. Watu hao waovu wakatoa ushahidi dhidi ya Nabothi mbele ya watu, wakisema, “Nabothi amemlaani Mungu na mfalme[b].” Kisha wakampeleka nje ya mji, wakampiga kwa mawe, naye akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “wana wa Beliali” au “watu wa Beliali,” nahau inayomaanisha watu wasiofaa au waovu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “amebariki”; hapa neno hilo limetumiwa kwa staha likimaanisha “amelaani” katika shtaka la kukufuru.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיַּעַל / אַנְשֵׁי הַבְּלִיַּעַל
  choice: watu waovu
  rationale: Nahau hiyo inaeleza watu wasiofaa kimaadili au waovu, si wana wa kimwili wala jina maalumu la Beliali. 'Watu waovu' ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: נֶגְדּוֹ
  choice: kumkabili
  rationale: Kihusishi kinaonyesha kuwa walikaa wakielekeana na Nabothi. 'Kumkabili' ni usemi wa asili unaofaa mazingira ya hukumu.
- source_word: וַיְעִדֻהוּ
  choice: wakatoa ushahidi dhidi ya Nabothi
  rationale: Hifili ya עוּד hapa inahusu ushahidi wa kisheria; tafsiri hii inaweka wazi kwamba walikuwa mashahidi wa mashtaka.
- source_word: נֶגֶד הָעָם
  choice: mbele ya watu
  rationale: Kirai hiki kinaonyesha kwamba shtaka lilitolewa hadharani mbele ya kusanyiko la watu.
- source_word: בֵּרַךְ
  choice: amemlaani
  rationale: Katika shtaka hili la kukufuru, kitenzi chenye maana ya kawaida 'bariki' kimetumiwa kwa staha badala ya 'laani.' Maana iliyokusudiwa imewekwa wazi katika matini kuu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu wa Israeli, anayerejelewa ni Mungu wa Israeli, si miungu kwa wingi.
- source_word: וָמֶלֶךְ
  choice: na mfalme
  rationale: 'Kiunganishi kinaunganisha walengwa wawili wa laana iliyodaiwa: Mungu na mfalme.'
- source_word: וַיֹּצִאֻהוּ מִחוּץ לָעִיר
  choice: wakampeleka nje ya mji
  rationale: Hii inaeleza wazi kuondolewa kwa Nabothi mjini ili auawe.
- source_word: וַיִּסְקְלֻהוּ בָאֲבָנִים
  choice: wakampiga kwa mawe
  rationale: Hii ni njia ya kawaida na wazi ya Kiswahili kueleza kuuawa kwa kurushiwa mawe, huku ikihifadhi kutajwa kwa mawe katika Kiebrania.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Kauli hii inaendeleza simulizi na kutaja matokeo moja kwa moja.
theological_decisions:
- issue: Tafsiri ya kitenzi cha staha בֵּרַךְ katika shtaka la kukufuru
  choice: Kutafsiri maana iliyokusudiwa kuwa 'amemlaani' katika matini kuu
  alternative: Kutafsiri kifasihi kuwa 'amebariki' na kueleza kuwa ni usemi wa staha
  rationale: Ingawa Kiebrania kinatumia neno 'bariki' kwa staha, shtaka lenyewe ni kwamba Nabothi alimlaani Mungu na mfalme. Kutafsiri maana katika matini kuu huzuia mkanganyiko, huku tanbihi ikihifadhi umbo halisi la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa masimulizi ya Biblia lakini unaeleweka kwa msomaji wa kawaida. Alama [a] imewekwa baada ya maelezo ya watu waovu, na [b] baada ya kishazi cha kupigwa kwa mawe kulingana na mpangilio wa data ya Kiingereza, ingawa maelezo ya [b] yanahusu kitenzi 'amemlaani'.
