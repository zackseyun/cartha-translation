base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/024.yaml
  text: Anyone belonging to Ahab who dies in the city the dogs will eat[b][a], and anyone who dies in the field the birds of the sky will eat.
translation:
  language: sw
  text: Mtu yeyote wa nyumba ya Ahabu atakayekufa mjini, mbwa watamla; na atakayekufa shambani, ndege wa angani watamla.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndege wa mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְאַחְאָב
  choice: Mtu yeyote wa nyumba ya Ahabu atakayekufa
  rationale: Kirai hiki kina maana ya kijumla na kinawahusu watu walio wa Ahabu, yaani nyumba au ukoo wake; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: בָּעִיר
  choice: mjini
  rationale: Hutoa maana ya mahali na kudumisha utofauti kati ya mji na shamba.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: mbwa watamla
  rationale: Huhifadhi maana ya moja kwa moja ya אכל, ‘kula,’ pamoja na taswira kali ya hukumu na fedheha.
- source_word: בַּשָּׂדֶה
  choice: shambani
  rationale: Huhifadhi taswira ya Kiebrania na ulinganifu wa mjini/shambani.
- source_word: עוֹף הַשָּׁמָיִם
  choice: ndege wa angani
  rationale: Ni Kiswahili cha kawaida kinachohifadhi muundo na picha ya usemi wa Kiebrania; pia unaweza kutafsiriwa ‘ndege wa mbinguni.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo sambamba wa vifungu viwili umehifadhiwa. ‘Wa nyumba ya Ahabu’ huweka wazi uhusiano wa kifamilia au wa nasaba unaodokezwa na Kiebrania bila kuufanya kuwa fundisho maalumu la dhehebu.
