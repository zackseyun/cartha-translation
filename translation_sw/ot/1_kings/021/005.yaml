translation:
  language: sw
  text: Ndipo Yezebeli, mke wake, akamjia na kumwambia[a], “Kwa nini roho yako imenuna, nawe huli chakula?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa maana halisi, “Hii ni nini—roho yako imenuna—nawe huli mkate?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֵלָיו
  choice: akamjia
  rationale: Muundo huu unaendeleza simulizi na kueleza kwa Kiswahili cha kawaida kwamba Yezebeli alikuja mahali alipokuwa Ahabu.
- source_word: אִיזֶבֶל
  choice: Yezebeli
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אִשְׁתּוֹ
  choice: mke wake
  rationale: Huwasilisha moja kwa moja uhusiano wa Yezebeli na Ahabu.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: na kumuuliza
  rationale: Ingawa kitenzi ni ‘akanena naye,’ usemi unaofuata ni swali; ‘kumuuliza’ ni Kiswahili cha asili kinachowasilisha kazi ya usemi huo.
- source_word: מַה זֶּה
  choice: Kwa nini
  rationale: Kirai hiki ni ‘Hii ni nini?’ kihalisi, lakini hapa kinatumika kuuliza sababu ya hali yake; ‘Kwa nini’ hutoa maana ya kimuktadha kwa ufasaha.
- source_word: רוּחֲךָ
  choice: roho yako
  rationale: Huhifadhi sitiari ya Kiebrania kuhusu hali ya ndani badala ya kuibadilisha moja kwa moja kuwa ‘hisia’ au ‘hali ya moyo.’
- source_word: סָרָה
  choice: imenuna
  rationale: Neno linaeleza hali ya kujitenga, kukasirika, au kuwa na huzuni ya ukaidi; ‘imenuna’ ni ya kawaida na inafaa kwa muktadha.
- source_word: וְאֵינְךָ אֹכֵל לָחֶם
  choice: hata huli chakula
  rationale: ‘Kula mkate’ ni nahau ya Kiebrania inayoweza kumaanisha kula chakula. ‘Hata’ huunganisha hali yake ya kununa na kutokula bila kuongeza swali la pili.
