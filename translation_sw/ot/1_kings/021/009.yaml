base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/009.yaml
  text: She wrote in the letters[a], saying, “Proclaim a fast, and seat Naboth at the head of the people.”
translation:
  language: sw
  text: Akaandika katika barua hizo akisema, “Tangazeni mfungo, na mketishe Nabothi mahali pa mbele miongoni mwa watu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbele ya watu” au “mahali pa heshima kati ya watu.” Kiebrania kinasema kihalisi “kwenye kichwa cha watu,” nalo fungu hili huenda likamaanisha nafasi ya mbele au inayoonekana wazi katika mkutano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Akaandika
  rationale: Kitenzi hiki cha masimulizi kinaendeleza tendo linalofuata. Kiswahili hakionyeshi jinsia katika kitenzi, lakini muktadha unamtambulisha mhusika kuwa Yezebeli.
- source_word: בַּסְּפָרִים
  choice: katika barua hizo
  rationale: Katika muktadha huu neno hilo linamaanisha barua zilizoandikwa na kutumwa kwa viongozi wa mji, si vitabu.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hii ni kauli ya kawaida ya Kiebrania inayotanguliza maneno yaliyonukuliwa; “akisema” inadumisha muundo huo kwa Kiswahili cha kawaida.
- source_word: קִרְאוּ צוֹם
  choice: Tangazeni siku ya kufunga
  rationale: Amri ya wingi inataka watu watangaze rasmi mfungo wa jumuiya. “Siku ya kufunga” ni usemi wazi na wa kawaida kwa wasomaji wa Kiswahili.
- source_word: וְהוֹשִׁיבוּ
  choice: na mketishe
  rationale: Hili ni umbo la kusababisha kuketi, hivyo “mketishe” linahifadhi maana hiyo kuliko “mweke”.
- source_word: אֶת נָבוֹת
  choice: Nabothi
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kiasili katika Kiswahili.
- source_word: בְּרֹאשׁ הָעָם
  choice: mbele ya watu
  rationale: Kihalisi ni “kwenye kichwa cha watu,” lakini katika mkutano huenda likamaanisha nafasi ya mbele, inayoonekana wazi, au yenye hadhi. “Mbele ya watu” ni ya kawaida na haifungi maana kwa ufafanuzi mmoja tu.
