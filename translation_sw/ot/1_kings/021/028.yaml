lexical_decisions:
- source_word: וַיְהִי
  choice: Ndipo ... likamjia
  rationale: Katika muundo wa kinabii ויהי דבר־יהוה אל, Kiswahili cha kawaida na chenye hadhi husema kwamba neno lilimjia mtu; “ndipo” huendeleza simulizi bila kufuata kwa ugumu maana ya msingi ya ‘ikawa.’
- source_word: דְּבַר יְהוָה
  choice: neno la Yahweh
  rationale: דָּבָר inaweza kuwa ‘neno’ au ‘ujumbe’; ‘neno la Yahweh’ huhifadhi istilahi ya kinabii na mwangwi wake katika Maandiko.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֶל
  choice: likamjia
  rationale: Kihusishi kinachoonyesha kuelekezwa kwa ufunuo kwa mpokeaji kinaelezwa kwa muundo wa asili wa Kiswahili ‘likamjia.’
- source_word: אֵלִיָּהוּ
  choice: Eliya
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: הַתִּשְׁבִּי
  choice: Mtishbi
  rationale: Huhifadhi jina la utambulisho la Kiebrania kwa ufupi; linaweza kumaanisha mtu wa Tishbe.
- source_word: לֵאמֹר
  choice: likisema
  rationale: Huanzisha maneno ya Mungu yanayofuata katika mstari unaofuata na kuhifadhi kiungo hicho katika mpaka wa mistari.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kina jina binafsi la Mungu, si cheo; ‘Yahweh’ huhifadhi utofauti huo bila kuingiza badala ya kimapokeo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kinabii umehifadhiwa kwa lugha inayoeleweka. Hakuna alama ya tanbihi iliyowekwa kwa sababu data ya Kiingereza ina mgongano: alama [a] imeambatanishwa na ‘Mtishbi’ lakini maandishi yake yanaeleza jina YHWH; kuweka tanbihi hiyo hapo kungepotosha.'
