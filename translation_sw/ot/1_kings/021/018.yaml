  text: ק֣וּם רֵ֗ד לִ/קְרַ֛את אַחְאָ֥ב מֶֽלֶךְ יִשְׂרָאֵ֖ל אֲשֶׁ֣ר בְּ/שֹׁמְר֑וֹן הִנֵּה֙ בְּ/כֶ֣רֶם נָב֔וֹת אֲשֶׁר יָ֥רַד שָׁ֖ם לְ/רִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/018.yaml
  text: Arise[a], go down to meet Ahab king of Israel, who is in Samaria. Look, he is in the vineyard of Naboth, where he has gone down to take possession of it.
translation:
  language: sw
  text: Inuka, ushuke ukutane na Ahabu, mfalme wa Israeli, aliyeko Samaria. Tazama, yuko katika shamba la mizabibu la Nabothi, ambako ameshuka ili kulimiliki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kulitwaa kuwa mali yake.” Kitenzi cha Kiebrania kinaweza kumaanisha kutwaa milki, kumiliki, au kurithi, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּם
  choice: Inuka
  rationale: Amri hii ya kitenzi קום inamaanisha kuinuka au kuondoka ili kutenda jambo. “Inuka” inadumisha ufupi na uzito wa amri ya kinabii.
- source_word: רֵד
  choice: ushuke
  rationale: Kitenzi ירד kinaeleza mwendo wa kushuka. “Ushuke” ni Kiswahili cha kawaida kinachohifadhi mwelekeo huo.
- source_word: לִקְרַאת
  choice: ukutane na
  rationale: Kirai hiki kwa kawaida humaanisha kwenda kukutana na mtu. “Ukutane na” hakiongezi wazo la kumkabili kwa uadui, ambalo muktadha unaweza kudokeza lakini neno lenyewe halilazimishi.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Hili ni jina la cheo cha kifalme katika muundo wa umilikaji, hivyo limetafsiriwa moja kwa moja.
- source_word: אֲשֶׁר בְּשֹׁמְרוֹן
  choice: aliye Samaria
  rationale: Kifungu hiki kisicho na kitenzi kinamtambulisha Ahabu kwa mahali alipo; Kiswahili huwasilisha maana hiyo kwa “aliye.”
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwenye jambo linalofuata. “Tazama” lina uzito wa simulizi la Biblia lakini bado linaeleweka katika Kiswahili cha sasa.
- source_word: בְּכֶרֶם נָבוֹת
  choice: katika shamba la mizabibu la Nabothi
  rationale: Kihusishi בְּ kinaonyesha mahali, na muundo huu unahifadhi wazi kuwa shamba hilo ni la Nabothi.
- source_word: אֲשֶׁר יָרַד שָׁם
  choice: ambako ameshuka
  rationale: Kiwakilishi husishi kinarejelea shamba la mizabibu. Wakati timilifu “ameshuka” unaunganisha tendo lililotangulia na kuwapo kwake huko sasa.
- source_word: לְרִשְׁתּוֹ
  choice: ili kulimiliki
  rationale: Kitenzi ירשׁ kinaweza kumaanisha kumiliki, kutwaa milki, au kurithi kutegemea muktadha. Hapa “kulimiliki” linaeleza kusudi la Ahabu bila kuongeza kwa lazima wazo la kutumia nguvu.
theological_decisions:
- issue: Maana ya ירשׁ katika kuchukua shamba la Nabothi
  choice: kulimiliki
  alternative: kulitwaa; kulirithi
  rationale: Muktadha unaonyesha Ahabu akienda kulichukua shamba kuwa mali yake baada ya kifo cha Nabothi. Tafsiri haifanyi tendo hilo lionekane halali wala haiingizi katika kitenzi chenyewe wazo la vurugu ambalo halijasemwa wazi; uwezekano wa kileksia umeonyeshwa katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Amri fupi “Inuka, ushuke” inadumisha kasi ya usemi wa kinabii. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Ahabu, Israeli, Samaria, na Nabothi. Alama ya tanbihi imewekwa baada ya neno linalohusika, “kulimiliki.”'
