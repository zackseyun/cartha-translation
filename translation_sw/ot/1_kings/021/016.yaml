base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/016.yaml
  text: And when Ahab heard that Naboth was dead[a], Ahab arose to go down to the vineyard of Naboth the Jezreelite[b], to take possession of it.
translation:
  language: sw
  text: Ikawa, Ahabu aliposikia kwamba Nabothi amekufa[a], Ahabu akaondoka kwenda chini kwenye shamba la mizabibu la Nabothi, Myezreeli, kulimiliki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nabothi alikuwa amekufa.” Kiebrania kinaweza kueleweka kama taarifa ya hali ya kuwa mfu au ya tukio la kifo lililokuwa limetangulia.
    reason: lexical_alternative
  - marker: b
    text: Au, “kulitwaa liwe milki yake” au “kulirithi.” Kitenzi cha Kiebrania kinaweza kumaanisha kutwaa milki, kumiliki, au kurithi kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni kiunganishi cha masimulizi kinachoendeleza habari kwa lugha yenye hadhi bila kutumia muundo mrefu wa kizamani.
- source_word: כִּשְׁמֹעַ
  choice: aliposikia
  rationale: Muundo wa כ pamoja na kitenzi-jina unaanzisha kishazi cha wakati; 'aliposikia' ni Kiswahili cha kawaida na huhifadhi mfuatano.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי hutambulisha maudhui ya habari aliyoisikia Ahabu.
- source_word: מֵת
  choice: alikuwa amekufa
  rationale: Huwasilisha hali iliyotokana na tukio lililokamilika; Kiswahili hiki kinaweza kuonyesha hali ya kuwa mfu huku kikihifadhi mtazamo wa nyuma wa simulizi.
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: Katika simulizi קום mara nyingi huonyesha kuanza kwa hatua au mwendo wa makusudi; 'akaondoka' ni ya asili kuliko tafsiri halisi 'akasimama' katika muktadha huu.
- source_word: לָרֶדֶת
  choice: ili ashuke kwenda
  rationale: Huhifadhi maana ya mwelekeo ya ירד, yaani kwenda chini, kwa usemi wa kawaida wa Kiswahili.
- source_word: כֶּרֶם
  choice: shamba la mizabibu
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa vineyard katika Kiswahili sanifu.
- source_word: הַיִּזְרְעֵאלִי
  choice: Myezreeli
  rationale: Kivumishi hiki cha Kiebrania humtambulisha Nabothi kuwa mtu wa Yezreeli; umbo la Kiswahili linaonyesha utambulisho huo moja kwa moja.
- source_word: לְרִשְׁתּוֹ
  choice: kulimiliki
  rationale: ירשׁ inaweza kumaanisha kurithi, kumiliki, au kutwaa milki. Hapa Ahabu anakwenda kuchukua shamba liwe milki yake; 'kulimiliki' huhifadhi upana huo bila kuongeza kwa neno lenyewe nguvu ya 'kunyang'anya' ambayo muktadha tayari unaonyesha.
