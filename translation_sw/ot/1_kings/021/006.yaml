base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/006.yaml
  text: And he spoke to her, because I spoke to Naboth the Jezreelite and said to him, ‘Give me your vineyard for silver, or, if you prefer, I will give you a vineyard in place of it,’ but he said, ‘I will not give you my vineyard.’
translation:
  language: sw
  text: Akamwambia, “Kwa sababu nilizungumza na Nabothi, Myezreeli, nikamwambia, ‘Nipe shamba lako la mizabibu kwa fedha; au ukipenda, nitakupa shamba la mizabibu badala yake.’ Lakini akasema, ‘Sitakupa shamba langu la mizabibu.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלֶיהָ
  choice: Akamjibu
  rationale: Katika muktadha wa swali la Yezebeli katika mstari uliotangulia, kitenzi cha kusema kinafanya kazi kama jibu; Kiswahili hiki ni cha kawaida na kinahifadhi mhusika wa kiume.
- source_word: כִּי
  choice: Kwa sababu
  rationale: Huhifadhi kiunganishi cha sababu kilicho wazi katika maandishi ya Kiebrania, hata ingawa matumizi yake ndani ya jibu ni yasiyo ya kawaida.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Nabothi, Myezreeli
  rationale: Huwasilisha jina na utambulisho wa mahali kwa namna ya kawaida katika Kiswahili.
- source_word: תְּנָה לִּי
  choice: Nipe
  rationale: Amri hii katika muktadha wa pendekezo la kununua au kubadilishana inaeleweka kwa urahisi bila kuongeza maana isiyokuwamo.
- source_word: בְּכֶסֶף
  choice: kwa fedha
  rationale: Tafsiri ya karibu ya neno la chanzo; inaweza kumaanisha malipo ya fedha bila kulazimisha 'bei' au kiasi maalumu.
- source_word: אִם חָפֵץ אַתָּה
  choice: ukipenda
  rationale: Ni usemi wa asili wa Kiswahili kwa wazo la kuwa jambo hilo linampendeza au analipendelea.
- source_word: כֶרֶם תַּחְתָּיו
  choice: shamba lingine la mizabibu badala yake
  rationale: Hufanya wazi kuwa kinachotolewa ni shamba la mizabibu la kuchukua nafasi ya la Nabothi, bila kuongeza madai kuhusu thamani yake.
theological_decisions:
- issue: Sababu halisi ya kukataa kwa Nabothi
  choice: Maneno ya Ahabu yanaishia kwa ‘Sitakupa shamba langu la mizabibu.’
  alternative: Kuongeza rejeo la Nabothi kuhusu marufuku ya BWANA au urithi wa mababu kutoka mstari uliotangulia.
  rationale: Mstari huu unasimulia kwa ufupi jibu la Nabothi na haujumuishi sababu ya kidini; kuiongeza hapa kungebadili namna Ahabu anavyosimulia tukio.
- issue: Kiunganishi כִּי kisicho cha kawaida
  choice: Kwa sababu
  alternative: ‘Nilizungumza...’ bila kiunganishi, au ‘Ni kwamba...’
  rationale: ‘Kwa sababu’ huhifadhi kwa uwazi mvutano wa kisarufi wa maandishi ya Kimasora badala ya kuusawazisha kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mazungumzo yamewekewa alama wazi; sentensi imeachwa na ‘Kwa sababu’ ili kuhifadhi hali isiyo ya kawaida ya chanzo. Hakuna maelezo ya kidhehebu yaliyoongezwa.
