  yaml_path: translation/ot/1_kings/021/026.yaml
  text: He acted very abominably by going after idols[a], according to all that the Amorites had done[b], whom Yahweh drove out before the sons of Israel.
translation:
  language: sw
  text: Alitenda kwa kuchukiza sana kwa kufuata sanamu[a], kama yote ambayo Waamori walifanya, ambao Yahweh aliwafukuza mbele ya wana wa Israeli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “sanamu” ni neno kali la dharau; linaweza pia kutafsiriwa “sanamu za kuchukiza,” au, kwa maana ya karibu sana, “sanamu za mavi.”
    reason: lexical_alternative
  - marker: b
    text: Au “Waisraeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתְעֵב מְאֹד
  choice: Alitenda machukizo makubwa sana
  rationale: Muundo huu unaonyesha tendo lililokuwa la kuchukiza mno, badala ya kueleza tu hali ya mtu kuwa mwenye kuchukiza. Neno מְאֹד limewakilishwa kwa “sana.”
- source_word: לָלֶכֶת אַחֲרֵי
  choice: kwa kufuata
  rationale: Kirai hiki kinaeleza namna alivyotenda machukizo na kinadumisha picha ya kufuata kitu kwa uaminifu au ibada.
- source_word: הַגִּלֻּלִים
  choice: sanamu
  rationale: “Sanamu” ni neno la kawaida na linaloeleweka kwa vitu vinavyoabudiwa; dharau kali iliyomo katika neno la Kiebrania imeelezwa katika tanbihi.
- source_word: כְּכֹל אֲשֶׁר עָשׂוּ
  choice: sawasawa na yote waliyofanya
  rationale: Tafsiri hii inadumisha ulinganisho wa karibu kati ya mwenendo wake na matendo yote ya Waamori.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Ingawa umbo la Kiebrania ni la umoja, hapa linatumiwa kwa maana ya jamii nzima; Kiswahili hutumia wingi “Waamori.”
- source_word: הוֹרִישׁ
  choice: aliwafukuza
  rationale: Katika muktadha huu kitenzi kina maana ya kuwaondoa wenyeji katika nchi yao; “aliwafukuza” ni wazi na ya kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetafsiriwa kwa unukuzi “Yahweh,” bila kulibadilisha kuwa cheo.
- source_word: מִפְּנֵי
  choice: mbele ya
  rationale: Kirai hiki kinaonyesha kuwa Waamori waliondolewa mbele ya watu wa Israeli.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inadumisha kwa karibu usemi wa Kiebrania “wana wa Israeli”; mbadala wa kawaida zaidi umewekwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja; “Yahweh” linadumisha jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Usemi wa agano בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Tafsiri kuu inahifadhi umbo la chanzo, huku tanbihi ikitoa usemi wa kawaida zaidi wa Kiswahili bila kubadili kundi linalorejelewa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Machukizo makubwa sana” huhifadhi uzito wa tathmini ya kimaadili, na “sawasawa na yote” huakisi kwa karibu muundo wa ulinganisho wa Kiebrania.
