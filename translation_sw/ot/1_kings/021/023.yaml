base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/023.yaml
  text: And also concerning Jezebel[a], Yahweh spoke, saying, ‘The dogs will eat Jezebel in the territory of Jezreel.’
translation:
  language: sw
  text: 'Pia kuhusu Yezebeli[a], Yahweh alisema: “Mbwa watamla Yezebeli katika eneo la Yezreeli.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “karibu na boma la Yezreeli.” Neno la Kiebrania lililotumika hapa ni gumu kueleweka na huenda likimaanisha hasa eneo la nje la mji lililoimarishwa kwa ngome.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Pia
  rationale: Inaendeleza hukumu iliyotangulia na kuhifadhi maana ya nyongeza kwa Kiswahili cha kawaida.
- source_word: לְאִיזֶבֶל
  choice: kuhusu Yezebeli
  rationale: Katika muktadha huu, לְ pamoja na דִּבֶּר humtaja mtu anayehusu tangazo, bila kudokeza kwamba Yezebeli ndiye aliyesemeshwa moja kwa moja.
- source_word: דִּבֶּר יְהוָה לֵאמֹר
  choice: Yahwe alisema
  rationale: Hutoa kwa Kiswahili cha asili fomula ya Kiebrania ya kusema na kutanguliza maneno yaliyonukuliwa bila urudiaji mzito wa ‘alisema, akisema.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa tetragramatoni badala ya kulibadilisha kuwa cheo.
- source_word: הַכְּלָבִים
  choice: Mbwa
  rationale: Kiswahili hakihitaji kibainishi kinacholingana na הַ; nomino hii katika muktadha inawakilisha mbwa wanaotajwa katika hukumu.
- source_word: יֹאכְלוּ אֶת אִיזֶבֶל
  choice: watamla Yezebeli
  rationale: Huhifadhi maana ya kawaida ya ‘kula’ na kauli ya wakati ujao ya tangazo la kinabii bila kuiongeza nguvu kuwa ‘kurarua’ au ‘kumeza.’
- source_word: בְּחֵל יִזְרְעֶאל
  choice: katika eneo la Yezreeli
  rationale: חֵל ni neno gumu hapa; ‘eneo’ huhifadhi maana pana ya mahali bila kudai kwa uhakika kwamba kinachokusudiwa ni ngome au ukuta wa nje.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yana jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kutumia cheo kama ‘BWANA.’
- issue: Maana ya לְאִיזֶבֶל pamoja na דִּבֶּר
  choice: kuhusu Yezebeli
  alternative: kwa Yezebeli; dhidi ya Yezebeli
  rationale: Muktadha unaonyesha Eliya akiripoti tangazo la Mungu juu ya hukumu ya Yezebeli, si lazima maneno yaliyoelekezwa kwake uso kwa uso.
- issue: Maana ya בְּחֵל יִזְרְעֶאל
  choice: katika eneo la Yezreeli
  alternative: karibu na boma la Yezreeli
  rationale: Neno חֵל halina uhakika wa kutosha katika mstari huu. Tafsiri kuu inabaki wazi na ya kimaeneo, huku tanbihi ikihifadhi uwezekano wa maana ya sehemu ya nje yenye ulinzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye staha na inayoeleweka kwa urahisi. Muundo wa kunukuu umerahisishwa kwa ufasaha wa Kiswahili bila kupoteza uhusiano wa tangazo na maneno yanayofuata.
