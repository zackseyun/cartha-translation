id: 1KI.21.22
reference: 1 Kings 21:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אֶת בֵּיתְ/ךָ֗ כְּ/בֵית֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט וּ/כְ/בֵ֖ית בַּעְשָׁ֣א בֶן אֲחִיָּ֑ה אֶל הַ/כַּ֨עַס֙ אֲשֶׁ֣ר הִכְעַ֔סְתָּ וַֽ/תַּחֲטִ֖א אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/022.yaml
  text: And I will make your house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a], because of the provocation with which you have provoked me and caused Israel to sin.
translation:
  language: sw
  text: Nami nitaifanya nyumba yako[a] iwe kama nyumba ya Yeroboamu mwana wa Nebati, na kama nyumba ya Baasha mwana wa Ahiya, kwa sababu ya jinsi ulivyonikasirisha na kuifanya Israeli itende dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nasaba yako.” Hapa “nyumba” inamaanisha ukoo wa kifalme wa Ahabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Nami nitaifanya ... iwe
  rationale: Kitenzi נָתַן kwa msingi ni ‘kutoa,’ lakini katika kauli hii ya hukumu kinaeleza kuifanya nyumba ya Ahabu ipate hali ileile ya nasaba zilizohukumiwa; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: בֵּיתְךָ
  choice: nyumba yako[a]
  rationale: בַּיִת hapa inamaanisha ukoo au nasaba ya kifalme. ‘Nyumba’ inahifadhi sitiari ya Kiebrania, huku tanbihi ikifafanua maana yake katika muktadha.
- source_word: כְּבֵית ... וּכְבֵית
  choice: kama nyumba ya ... na kama nyumba ya
  rationale: כְ ni kiashiria cha ulinganisho; ‘kama’ ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Majina yamenukuliwa kwa maumbo yanayotambulika katika Kiswahili, na fomula ya nasaba בֶּן imetafsiriwa ‘mwana wa.’
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baasha mwana wa Ahiya
  rationale: Jina na fomula ya nasaba vimetafsiriwa moja kwa moja kwa matumizi ya kawaida ya Kibiblia katika Kiswahili.
- source_word: אֶל הַכַּעַס אֲשֶׁר הִכְעַסְתָּ
  choice: kwa sababu ya jinsi ulivyonikasirisha
  rationale: Kirai hiki kinaonyesha sababu ya hukumu na tendo la kumchokoza Mungu hadi hasira. Muundo ‘jinsi ulivyonikasirisha’ ni wa asili katika Kiswahili na unawasilisha maana bila kurudia maneno kwa namna isiyo ya kawaida.
- source_word: וַתַּחֲטִא אֶת יִשְׂרָאֵל
  choice: na kuifanya Israeli itende dhambi
  rationale: Hifili ya חטא ina maana ya kusababisha mwingine atende dhambi. ‘Kuifanya Israeli itende dhambi’ inahifadhi wazi maana hiyo ya kisababishi.
theological_decisions:
- issue: Kutaja wazi mtendewa wa tendo katika אֲשֶׁר הִכְעַסְתָּ
  choice: Kutumia ‘ulivyonikasirisha,’ na hivyo kutaja ‘-ni-’ inayomrejelea Bwana
  alternative: Kutafsiri bila mtendewa wa wazi, kama ‘ulivyochokoza’
  rationale: Ingawa mtendewa hajatajwa kwa nomino katika Kiebrania, mzungumzaji ni Bwana na muktadha unaonyesha wazi kuwa yeye ndiye aliyekasirishwa. Kiambishi ‘-ni-’ hufanya Kiswahili kiwe wazi na cha kawaida bila kuongeza dai jipya la kitheolojia.
- issue: Maana ya בֵּית katika tamko la hukumu dhidi ya mfalme
  choice: Kuhifadhi ‘nyumba’ katika matini kuu na kufafanua ‘nasaba ya kifalme’ katika tanbihi
  alternative: Kutumia ‘nasaba yako’ moja kwa moja katika matini kuu
  rationale: ‘Nyumba’ huhifadhi sitiari na mwangwi wa lugha ya kifalme ya Kiebrania, huku tanbihi ikizuia msomaji asiielewe kuwa jengo tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa Kiebrania umehifadhiwa pale unapobaki wa asili katika Kiswahili, na tanbihi moja imeongezwa kufafanua sitiari ya ‘nyumba.’
