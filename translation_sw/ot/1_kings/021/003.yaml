  yaml_path: translation/ot/1_kings/021/003.yaml
  text: But Naboth said to Ahab[a], “Far be it from me by Yahweh to give you the inheritance of my fathers.”
translation:
  language: sw
  text: Lakini Nabothi akamwambia Ahabu, “Yahwe na aniepushe na kukupatia urithi wa baba zangu!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa muundo ulio karibu zaidi na Kiebrania: “Iwe mbali nami, kwa Yahwe, kukupatia urithi wa baba zangu.”'
    reason: Nahau ya Kiebrania ni kauli kali ya kukataa, yenye rejeleo kwa Yahwe; muundo huu wa karibu huhifadhi mpangilio wake bila kubadili maana ya tendo linalokataliwa.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini ... akamwambia
  rationale: Kiunganishi kinaendeleza simulizi huku jibu la Nabothi likipinga pendekezo la Ahabu; “Lakini” huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: נָבוֹת
  choice: Nabothi
  rationale: Jina la mtu limetoholewa kwa tahajia inayotambulika katika Kiswahili.
- source_word: אַחְאָב
  choice: Ahabu
  rationale: Jina la mtu limetoholewa kwa matumizi ya kawaida ya Kiswahili.
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: Yahwe apishilie mbali nisi-
  rationale: Hii ni nahau kali ya kukataa inayomhusisha Yahwe moja kwa moja. “Apishilie mbali” ni Kiswahili cha asili kinachodumisha nguvu ya usemi bila kuufanya kuwa kauli hafifu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: מִתִּתִּי ... לָךְ
  choice: nisikupatie
  rationale: Muundo huu unaeleza tendo linalokataliwa; “nisikupatie” ni wa kawaida na hujumuisha maana ya ‘kukupa wewe.’
- source_word: נַחֲלַת
  choice: urithi
  rationale: Neno hili linamaanisha mali ya ukoo iliyorithiwa, hasa ardhi, hivyo “urithi” huhifadhi uzito wake wa kifamilia na kisheria.
- source_word: אֲבֹתַי
  choice: baba zangu
  rationale: Kiebrania kinasema kihalisi “baba zangu”; tafsiri hii inadumisha lugha ya ukoo wa kiume ya chanzo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la Mungu lenye herufi nne moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Jinsi ya kueleza חָלִילָה לִּי מֵיְהוָה
  choice: Yahwe apishilie mbali nisikupatie
  alternative: Ni mbali nami, kwa Yahwe, kukupatia
  rationale: Kauli hiyo ni nahau yenye nguvu inayokataa tendo mbele za Yahwe, na huenda pia ikawa na ladha ya kiapo. Tafsiri kuu ni ya asili katika Kiswahili, huku tanbihi ikihifadhi muundo wa karibu zaidi na Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya kisasa na yenye heshima. “Apishilie mbali” ni nahau inayoeleweka na inayofaa uzito wa Nabothi kukataa kutoa ardhi ya urithi wa ukoo.
