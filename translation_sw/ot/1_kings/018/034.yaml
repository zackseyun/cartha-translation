  text: וַ/יֹּ֗אמֶר מִלְא֨וּ אַרְבָּעָ֤ה כַדִּים֙ מַ֔יִם וְ/יִֽצְק֥וּ עַל הָ/עֹלָ֖ה וְ/עַל הָ/עֵצִ֑ים וַ/יֹּ֤אמֶר שְׁנוּ֙ וַ/יִּשְׁנ֔וּ וַ/יֹּ֥אמֶר שַׁלֵּ֖שׁוּ וַ/יְשַׁלֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/034.yaml
  text: Then he said[a], “Fill four jars with water and pour it on the burnt offering and on the wood.” Then he said, “Do it a second time,” and they did it a second time. Then he said, “Do it a third time,” and they did it a third time.
translation:
  language: sw
  text: Kisha akasema, “Jazeni mitungi minne[a] kwa maji, kisha myamimine juu ya sadaka ya kuteketezwa na juu ya kuni.” Kisha akasema, “Fanyeni hivyo mara ya pili,” nao wakafanya hivyo mara ya pili. Kisha akasema, “Fanyeni hivyo mara ya tatu,” nao wakafanya hivyo mara ya tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vyombo vinne vya kubebea maji”; neno la Kiebrania hurejelea chombo cha kubebea au kuchotea vimiminika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha akasema
  rationale: Muundo wa masimulizi unaendeleza mfululizo wa matukio; ‘Kisha akasema’ ni Kiswahili cha kawaida kinachoonyesha hatua inayofuata.
- source_word: מִלְאוּ
  choice: Jazeni
  rationale: Ni amri kwa watu wengi kutoka mzizi מלא, ikiwataka wajaze vyombo.
- source_word: אַרְבָּעָה כַדִּים
  choice: mitungi minne
  rationale: כַּדִּים ni vyombo vya kubebea kimiminika; ‘mitungi’ ni neno la kawaida la Kiswahili lisilobainisha umbo kupita kiasi.
- source_word: מַיִם
  choice: maji
  rationale: Tafsiri ya moja kwa moja ya nomino hii ya kawaida.
- source_word: וְיִצְקוּ
  choice: mkayamimine
  rationale: Inaendeleza amri kwa wingi na kiwakilishi ‘-ya-’ kinarejelea maji kwa upatanisho wa kawaida wa Kiswahili.
- source_word: עַל הָעֹלָה
  choice: juu ya sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi ya kawaida ya sadaka iliyoteketezwa; ‘juu ya’ inaonyesha mahali maji yalipomiminwa.
- source_word: וְעַל הָעֵצִים
  choice: na juu ya kuni
  rationale: עֵצִים katika muktadha huu ni kuni zilizopangwa kwa ajili ya sadaka.
- source_word: שְׁנוּ / וַיִּשְׁנוּ
  choice: Fanyeni hivyo mara ya pili / nao wakafanya hivyo mara ya pili
  rationale: Huhifadhi kwa uwazi hatua ya pili ya tendo na ulinganifu kati ya amri na utekelezaji wake.
- source_word: שַׁלֵּשׁוּ / וַיְשַׁלֵּשׁוּ
  choice: Fanyeni hivyo mara ya tatu / nao wakafanya hivyo mara ya tatu
  rationale: Huhifadhi maendeleo ya kuhesabu na ulinganifu wa lugha ya Kiebrania kati ya amri na utekelezaji.
theological_decisions:
- issue: Tafsiri ya istilahi ya dhabihu עֹלָה
  choice: sadaka ya kuteketezwa
  alternative: sadaka ya kuteketezwa kabisa
  rationale: ‘Sadaka ya kuteketezwa’ ni istilahi inayoeleweka na iliyo sahihi bila kuongeza neno ‘kabisa,’ ambalo halijaandikwa wazi katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Marudio ya ‘mara ya pili’ na ‘mara ya tatu’ yamedumishwa kwa sababu ni sehemu muhimu ya muundo wa masimulizi ya Kiebrania.
