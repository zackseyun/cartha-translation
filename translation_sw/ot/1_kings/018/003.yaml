  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א אַחְאָ֔ב אֶל עֹבַדְיָ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/עֹבַדְיָ֗הוּ הָיָ֥ה יָרֵ֛א אֶת יְהוָ֖ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/003.yaml
  text: And Ahab called Obadiah[a], who was over the household. Now Obadiah feared Yahweh greatly.
translation:
  language: sw
  text: Ahabu akamwita Obadia[a], aliyekuwa msimamizi wa nyumba ya mfalme. Naye Obadia alimcha Yahwe sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyekuwa msimamizi wa ikulu.” Kiebrania kinasema kihalisi “aliyekuwa juu ya nyumba,” usemi unaomaanisha afisa mkuu wa nyumba ya kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אַחְאָב אֶל עֹבַדְיָהוּ
  choice: Ahabu akamwita Obadia
  rationale: Kitenzi קרא pamoja na אֶל hapa kinaonyesha Ahabu alimwita Obadia. “Akamwita” ni Kiswahili cha kawaida na hakiongezi dhana yenye nguvu zaidi ya kuamuru aitwe.
- source_word: עֹבַדְיָהוּ
  choice: Obadia
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: aliyekuwa msimamizi wa nyumba ya mfalme
  rationale: Kirai hiki kinamtaja afisa mkuu aliyesimamia nyumba au kaya ya kifalme. Tafsiri hii inaeleza wajibu wake kwa lugha ya kawaida bila kuibana בַּיִת kuwa jengo la ikulu pekee.
- source_word: וְעֹבַדְיָהוּ
  choice: Naye Obadia
  rationale: Kiunganishi kinaanzisha maelezo ya usuli kuhusu tabia ya Obadia; “Naye” kinaendeleza simulizi kwa kawaida katika Kiswahili.
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: alimcha Yahwe
  rationale: Muundo huu unaonyesha hali au sifa ya kudumu ya Obadia. “Kumcha” huhifadhi maana ya hofu yenye heshima mbele za Mungu bila kuipunguza kuwa heshima tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe” badala ya kubadilishwa kwa cheo.
- source_word: מְאֹד
  choice: sana
  rationale: “Sana” ni kielezi cha kawaida kinachohifadhi nguvu ya מְאֹד kwa Kiswahili cha sasa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu mwenyewe. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Maana ya יָרֵא katika uhusiano na Mungu
  choice: alimcha
  alternative: alimstahi
  rationale: “Alimcha” huhifadhi mvutano wa maana kati ya hofu na heshima ya kidini uliomo katika ירא; “alimstahi” pekee ingelegeza kipengele cha hofu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia “aka-” kwa mwendelezo wa tukio, huku “Naye” ikianzisha maelezo ya usuli. “Nyumba ya mfalme” ni wazi zaidi kwa msomaji wa kawaida kuliko “nyumba” peke yake na pana zaidi kuliko “ikulu.”
