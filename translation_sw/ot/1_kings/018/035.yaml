translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Vitenzi vya mfululizo vyenye kiambishi -ka- vinaendeleza mwendo wa simulizi; ‘hilo’ hurejelea handaki lililotajwa katika muktadha uliotangulia.
