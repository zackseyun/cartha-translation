  text: And the water went all around the altar[b][a], and it also filled the trench with water.
translation:
  language: sw
  text: Maji yakatiririka[a] kuzunguka madhabahu pande zote, na pia yakajaza handaki[b] hilo kwa maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri nyingine: “yakaenda.” Kitenzi cha Kiebrania kwa maana halisi ni “kwenda,” lakini hapa kimetumiwa kueleza mwendo wa maji.'
    reason: lexical_alternative
  - marker: b
    text: Au “mfereji” au “mtaro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: yakatiririka
  rationale: Kitenzi cha Kiebrania kwa maana ya msingi ni ‘kwenda,’ lakini maji ndiyo kiima; kwa Kiswahili cha kawaida ‘kutiririka’ hueleza mwendo wa maji kwa ufasaha bila kuongeza wazo lisilokuwamo.
- source_word: הַמַּיִם
  choice: Maji
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa nomino ya Kiebrania yenye umbo la wingi lakini inayotaja maji kwa ujumla.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: pande zote kuizunguka madhabahu
  rationale: Usemi huu unaonyesha maji yakizunguka madhabahu; ‘pande zote’ huwasilisha vizuri wazo la kuzunguka kote katika tukio hili.
- source_word: וְגַם
  choice: pia
  rationale: ‘Pia’ huhifadhi nyongeza na msisitizo wa jambo la pili kwa Kiswahili cha asili.
- source_word: אֶת־הַתְּעָלָה
  choice: handaki hilo
  rationale: Katika muktadha wa madhabahu ya Eliya, neno hili linamaanisha mfereji au handaki lililochimbwa kuizunguka madhabahu. ‘Handaki’ ni neno wazi na la kawaida hapa.
- source_word: מִלֵּא מָיִם
  choice: yakalijaza
  rationale: Kwa kuwa ‘maji’ tayari ndiyo kiima katika Kiswahili, ‘yakalijaza handaki hilo’ hutoa maana kamili ya kulijaza kwa maji bila marudio yasiyo ya kawaida.
