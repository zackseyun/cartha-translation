  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: חַ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אִם יֶשׁ גּ֤וֹי וּ/מַמְלָכָה֙ אֲ֠שֶׁר לֹֽא שָׁלַ֨ח אֲדֹנִ֥/י שָׁם֙ לְ/בַקֶּשְׁ/ךָ֔ וְ/אָמְר֖וּ אָ֑יִן וְ/הִשְׁבִּ֤יעַ אֶת הַ/מַּמְלָכָה֙ וְ/אֶת הַ/גּ֔וֹי כִּ֖י לֹ֥א יִמְצָאֶֽ/כָּה׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/010.yaml
  text: As Yahweh your God lives, there is no nation or kingdom where my lord has not sent to seek you. When they said, ‘He is not here,’ he made the kingdom and the nation swear that they could not find you.
translation:
  language: sw
  text: Aishivyo Yahweh, Mungu wako, hakuna taifa wala ufalme ambako bwana wangu hajatuma watu kukutafuta. Waliposema, ‘Hayupo,’ aliweka ufalme huo na taifa hilo chini ya kiapo kwamba hawakuweza kukupata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: Kama aishivyo Yahweh, Mungu wako
  rationale: Hii ni kauli ya kiapo inayotaja uhai wa Yahweh. Muundo huu ni wa asili na wenye uzito katika Kiswahili, huku ukihifadhi jina la Mungu.
- source_word: אִם יֶשׁ גּוֹי וּמַמְלָכָה אֲשֶׁר לֹא
  choice: hakuna taifa wala ufalme ambako ... haja-
  rationale: Katika muktadha wa kiapo, אִם ina nguvu ya kusisitiza, si kuonyesha sharti lenye mashaka. ‘Hakuna ... ambako’ huwasilisha maana hiyo wazi.
- source_word: גּוֹי וּמַמְלָכָה
  choice: taifa wala ufalme
  rationale: Maneno haya yanahifadhi jozi ya kisiasa ya Kiebrania; ‘wala’ linafaa baada ya ‘hakuna’ katika Kiswahili cha kawaida.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Obadia anamrejelea Mfalme Ahabu kwa heshima, wala si Mungu.
- source_word: שָׁלַח ... לְבַקֶּשְׁךָ
  choice: hajatuma watu wakutafute
  rationale: Kitenzi ‘kutuma’ kwa kawaida huhitaji watendaji wanaoeleweka katika Kiswahili; ‘watu’ limewekwa wazi kutokana na tendo lenyewe bila kubadili maana.
- source_word: וְאָמְרוּ אָיִן
  choice: Waliposema, ‘Hayupo hapa,’
  rationale: אָיִן hapa humaanisha kwamba Eliya hakuwapo mahali pale. Kiwakilishi kilichodokezwa kimewekwa wazi kwa usemi wa asili.
- source_word: וְהִשְׁבִּיעַ
  choice: aliutaka ... waape
  rationale: Hifili ya שבע ina maana ya kumsababisha mtu aape au kumweka chini ya kiapo. ‘Aliwataka waape’ ni lugha ya sasa na yenye kueleweka.
- source_word: אֶת הַמַּמְלָכָה וְאֶת הַגּוֹי
  choice: ufalme huo na taifa hilo
  rationale: Viashiria vinaonyesha kwamba kila eneo lililotafutwa ndilo lililotakiwa kutoa kiapo.
- source_word: כִּי לֹא יִמְצָאֶךָ
  choice: kwamba hawakukupata
  rationale: כִּי hutanguliza yaliyomo katika kiapo. Katika muktadha wa utafutaji uliokwisha, ‘hawakukupata’ huhifadhi dai la matokeo bila kuliongeza kuwa kutokuwa na uwezo.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Jina binafsi limetoholewa kuwa ‘Yahweh’ badala ya kubadilishwa na cheo, kwa kufuata ushahidi uliotolewa na kudumisha tofauti kati ya Yahweh na אֲדֹנִי anayemaanisha Ahabu hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha uzito wa kiapo na lugha ya heshima kwa mfalme bila kuwa ya kizamani. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi iliyohitajika.
