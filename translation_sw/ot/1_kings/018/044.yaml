base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/044.yaml
  text: And it happened on the seventh time that he said[a], “Look, a small cloud, like a man’s palm, is rising from the sea.” Then he said, “Go up, say to Ahab, ‘Harness your chariot and go down[c][b], so that the rain does not stop you.’”
translation:
  language: sw
  text: Ikawa mara ya saba, akasema, “Tazama, wingu dogo kama kiganja cha mtu[a] linapanda kutoka baharini.” Kisha Eliya akasema, “Panda, umwambie Ahabu, ‘Tayarisha gari lako[b] na ushuke, ili mvua isikuzuie[c].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama kiganja cha mkono wa mtu.”
    reason: lexical_alternative
  - marker: b
    text: Hapa kutayarisha gari kunamaanisha kuwafunga farasi kwenye gari ili liwe tayari kwa safari.
    reason: cultural_note
  - marker: c
    text: Au, “mvua isikucheleweshe” au “isikukwamishe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּשְּׁבִעִית
  choice: Ikawa mara ya saba
  rationale: Muundo huu unaendeleza simulizi na kuweka wazi kwamba ni tukio la saba la mtumishi kwenda kutazama, si siku ya saba.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili la kuelekeza fikira linaonyesha haraka jambo ambalo mtumishi ameliona.
- source_word: עָב קְטַנָּה
  choice: wingu dogo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili cha sasa.
- source_word: כְּכַף אִישׁ
  choice: kama kiganja cha mkono wa mtu
  rationale: כַּף hapa hueleweka kuwa kiganja; usemi huu unaonyesha udogo wa wingu kwa ufasaha wa kawaida wa Kiswahili.
- source_word: עֹלָה מִיָּם
  choice: linapanda kutoka baharini
  rationale: Hali ya kuendelea ya kitenzi cha Kiebrania imehifadhiwa, na 'kutoka baharini' inaonyesha mahali wingu linapoonekana likitokea.
- source_word: עֲלֵה
  choice: Panda
  rationale: Amri hii inahifadhi mwelekeo wa kwenda juu uliomo katika kitenzi cha Kiebrania.
- source_word: אֱמֹר אֶל אַחְאָב
  choice: umwambie Ahabu
  rationale: Huu ni usemi wa kawaida na wazi wa kumwagiza mtumishi amfikishie Ahabu ujumbe.
- source_word: אֱסֹר
  choice: Tayarisha gari lako
  rationale: Katika muktadha huu kitenzi cha kufunga kinamaanisha kufungia farasi gari ili liwe tayari kusafiri. Tafsiri hii huepuka maana ya kisasa ya kulifungia gari kwa kufuli huku tanbihi ikihifadhi picha ya kitamaduni.
- source_word: וָרֵד
  choice: na ushuke
  rationale: Inahifadhi amri pamoja na mwelekeo wa kushuka kutoka eneo la juu.
- source_word: וְלֹא יַעַצָרְכָה הַגָּשֶׁם
  choice: ili mvua isikuzuie
  rationale: עצר inaweza kumaanisha kuzuia, kukwamisha, au kuchelewesha. 'Isikuzuie' ni ya asili na haibani maana kuliko inavyohitajika.
