  yaml_path: translation/ot/1_kings/018/002.yaml
  text: So Elijah went to show himself to Ahab[b][a]. Now the famine was severe in Samaria.
translation:
  language: sw
  text: Basi Eliya akaenda kujionyesha kwa Ahabu.[a] Wakati huo njaa ilikuwa kali huko Samaria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ajitokeze mbele ya Ahabu” au “ajiwasilishe kwa Ahabu.”
    reason: lexical_alternative
  - marker: b
    text: Au “njaa ilikuwa kubwa sana huko Samaria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Basi ... akaenda
  rationale: Waw-consecutive inaendeleza simulizi kwa mtiririko unaotokana na aya iliyotangulia; “Basi” ni ya asili katika Kiswahili na huhifadhi uhusiano huo.
- source_word: אֵלִיָּהוּ
  choice: Eliya
  rationale: Jina limetolewa kwa umbo la kawaida katika Biblia za Kiswahili.
- source_word: לְהֵרָאוֹת אֶל אַחְאָב
  choice: kujionyesha kwa Ahabu
  rationale: Kitenzi cha Niphal cha ראה hapa kina maana ya kujitokeza au kujionyesha; tafsiri hii huhifadhi maana yake ya kujirejelea bila kufafanua zaidi ya chanzo.
- source_word: וְהָרָעָב
  choice: Wakati huo njaa
  rationale: Waw inaanzisha maelezo ya hali iliyokuwapo nyuma ya tukio, si tendo linalofuata tu; “Wakati huo” huonyesha mabadiliko hayo kwa Kiswahili cha kawaida.
- source_word: חָזָק
  choice: ilikuwa kali
  rationale: Ikiwa inahusishwa na njaa, חָזָק huonyesha ukali au uzito wake, si nguvu ya kimwili.
- source_word: בְּשֹׁמְרוֹן
  choice: huko Samaria
  rationale: בְּ huonyesha mahali. “Huko Samaria” ni usemi wa asili unaoacha wazi kama jina linarejelea mji au eneo pana zaidi.
