base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/007.yaml
  text: As Obadiah was on the way, behold, Elijah came to meet him. When he recognized him, he fell on his face and said, “Is that you, my lord Elijah?”
translation:
  language: sw
  text: Obadia alipokuwa njiani, tazama, Eliya akaja kumlaki. Obadia alipomtambua, akaanguka kifudifudi, akasema, “Je, ni wewe, bwana wangu Eliya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Imehifadhi ishara ya simulizi inayovuta fikira kwa tukio la ghafla, huku ikibaki ya kawaida katika usimulizi wa kibiblia wa Kiswahili.
- source_word: לִקְרָאתוֹ
  choice: kumlaki
  rationale: Inaonyesha kwamba Eliya alikuja kukutana na Obadia, bila kudokeza uhasama.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: akaanguka kifudifudi
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha tendo la kuanguka uso kuelekea chini kwa heshima.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Hapa ni namna ya heshima ya kumwita Eliya, si jina la Mungu; herufi ndogo zinatunza tofauti hiyo.
- source_word: הַאַתָּה זֶה
  choice: Je, ni wewe
  rationale: Hutoa swali la kumtambua mtu kwa Kiswahili cha kawaida bila kulifanya kuwa na maana zaidi ya iliyo katika Kiebrania.
theological_decisions:
- issue: Maana ya אֲדֹנִי anapotumiwa Eliya
  choice: bwana wangu
  alternative: Bwana wangu
  rationale: Muktadha unaonyesha cheo cha heshima kwa mwanadamu; herufi ndogo huepuka kukichanganya na cheo cha Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa mfululizo wa matendo umehifadhiwa kwa vitenzi vya '-ka-', huku kurudiwa kwa jina Obadia kukiondoa utata wa kiwakilishi katika Kiswahili.
