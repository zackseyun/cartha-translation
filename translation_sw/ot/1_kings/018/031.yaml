  yaml_path: translation/ot/1_kings/018/031.yaml
  text: And Elijah took twelve stones[a], according to the number of the tribes of the sons of Jacob, to whom the word of Yahweh had come, saying[b], “Israel shall be your name.”
translation:
  language: sw
  text: Kisha Eliya akachukua mawe kumi na mawili, kulingana na idadi ya makabila ya wana wa Yakobo[a], ambaye Yahwe alikuwa amemwambia,[b] “Jina lako litakuwa Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wa Yakobo.” Kiebrania kihalisi ni “wana wa Yakobo.”
    reason: lexical_alternative
  - marker: b
    text: 'Hili linakumbusha jinsi Mungu alivyompa Yakobo jina jipya katika Mwanzo 32:28; 35:10: “Jina lako litakuwa Israeli.”'
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Muundo wa masimulizi wa Kiebrania unaendeleza tukio; “akachukua” ni wa kawaida na wa asili katika Kiswahili.
- source_word: אֵלִיָּהוּ
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: mawe kumi na mawili
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya idadi pamoja na nomino.
- source_word: כְּמִסְפַּר
  choice: kulingana na idadi ya
  rationale: Huhifadhi maana ya ulinganifu iliyomo katika kihusishi כְּ pamoja na מִסְפַּר, kwa Kiswahili cha kawaida.
- source_word: שִׁבְטֵי
  choice: makabila
  rationale: “Makabila” ni neno la kawaida kwa mgawanyo wa kizazi na kitaifa unaokusudiwa hapa.
- source_word: בְנֵי יַעֲקֹב
  choice: wana wa Yakobo
  rationale: Hufuata kwa karibu usemi wa Kiebrania huku “wana” likiwa neno la Kiswahili lenye hadhi na linalofaa katika muktadha huu.
- source_word: אֲשֶׁר הָיָה דְבַר־יְהוָה אֵלָיו
  choice: ambaye neno la Yahwe lilikuwa limemjia
  rationale: Kiwakilishi kinamrejelea Yakobo, na wakati uliotumika unaonyesha kwamba ujumbe huo wa Mungu ulikuwa umemjia hapo awali.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadili kuwa cheo.
- source_word: לֵאמֹר
  choice: likisema
  rationale: Hutambulisha maneno yanayonukuliwa na kubaki karibu na muundo wa Kiebrania bila kuwa mzito katika Kiswahili.
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: Jina lako litakuwa Israeli
  rationale: Ni tamko la kawaida na lenye uzito katika Kiswahili la kubadilishwa kwa jina; haliongezi maana ya ziada zaidi ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יְהוָה. “Yahwe” hulihifadhi kama jina binafsi bila kulibadili kuwa cheo.
- issue: Mhusika anayerejelewa na אֲשֶׁר ... אֵלָיו
  choice: Yakobo ndiye aliyelijiwa na neno la Yahwe
  alternative: wana wa Yakobo kwa pamoja ndio waliorejelewa
  rationale: Kiwakilishi cha Kiebrania ni cha umoja wa kiume, na nukuu inayofuata inarejelea wazi matukio ambayo Yakobo alipewa jina Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wazi, wa sasa na wenye hadhi. Usemi “wana wa Yakobo” umehifadhiwa kwa ukaribu na Kiebrania, huku tanbihi ikitoa mbadala unaoeleweka kwa upana zaidi.
