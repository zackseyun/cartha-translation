  text: וַ/יֹּ֤אמֶר אַחְאָב֙ אֶל עֹ֣בַדְיָ֔הוּ לֵ֤ךְ בָּ/אָ֨רֶץ֙ אֶל כָּל מַעְיְנֵ֣י הַ/מַּ֔יִם וְ/אֶ֖ל כָּל הַ/נְּחָלִ֑ים אוּלַ֣י נִמְצָ֣א חָצִ֗יר וּ/נְחַיֶּה֙ ס֣וּס וָ/פֶ֔רֶד וְ/ל֥וֹא נַכְרִ֖ית מֵ/הַ/בְּהֵמָֽה־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/005.yaml
  text: And Ahab said to Obadiah[a], “Go through the land to all the springs of water and to all the wadis. Perhaps we may find grass and keep horse and mule alive[b], so that we do not have to cut off some of the livestock.”
translation:
  language: sw
  text: Ahabu akamwambia Obadia, “Nenda kotekote nchini, kwenye chemchemi zote za maji na vijito vyote[a]. Huenda tukapata majani na kuwaweka hai farasi na nyumbu, ili tusipunguze idadi ya mifugo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikondo yote ya maji” au “mabonde yote ya vijito.” Neno la Kiebrania linaweza kumaanisha kijito, mkondo wa maji, au bonde ambalo maji hupita kwa msimu; katika ukame huu huenda linarejelea mikondo ya msimu.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “tusikate kutoka katika mifugo.” Inaelekea usemi huu unamaanisha kupunguza idadi ya wanyama kwa sababu hakuna malisho ya kutosha kuwaweka hai.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: Pamoja na kitenzi cha kwenda, kirai hiki kinaonyesha kupita na kutafuta kotekote katika eneo la nchi; muundo wa Kiswahili unaeleweka kwa urahisi katika muktadha huu.
- source_word: מַעְיְנֵי הַמַּיִם
  choice: chemchemi zote za maji
  rationale: Tafsiri hii inadumisha picha halisi ya vyanzo vya asili vya maji na ni ya kawaida katika Kiswahili.
- source_word: הַנְּחָלִים
  choice: vijito vyote
  rationale: Neno la Kiebrania linaweza kumaanisha vijito, mikondo ya maji, au mabonde yake yanayokauka kwa misimu. ‘Vijito’ ni neno la kawaida na fupi, huku tanbihi ikihifadhi upana wa maana.
- source_word: אוּלַי נִמְצָא
  choice: Huenda tukapata
  rationale: Muundo huu unadumisha kutokuwa na uhakika pamoja na kusudi la pamoja la Ahabu na Obadia.
- source_word: חָצִיר
  choice: majani
  rationale: Katika muktadha huu ni mimea inayoweza kulisha wanyama; ‘majani’ ni ya kawaida zaidi kuliko neno linaloweza kudokeza malisho yaliyokatwa na kukaushwa.
- source_word: וּנְחַיֶּה
  choice: na kuwaweka hai
  rationale: Hifili ya kitenzi ina maana ya kusababisha waendelee kuishi au kuhifadhi uhai wao; ‘kuwaweka hai’ inaeleza kusudi hilo wazi.
- source_word: סוּס וָפֶרֶד
  choice: farasi na nyumbu
  rationale: Umoja wa Kiebrania unatumiwa kwa maana ya makundi ya wanyama; Kiswahili linaweza kutumia majina haya kwa maana ya jumla bila kulazimisha idadi ya mmoja mmoja.
- source_word: וְלֹא נַכְרִית מֵהַבְּהֵמָה
  choice: ili tusilazimike kupunguza idadi ya mifugo
  rationale: Kitenzi כרת kwa msingi ni ‘kata’ au ‘ondoa,’ na מִן hapa inaelekea kuwa ya sehemu. Kiswahili hiki kinaonyesha kwa kawaida kupotezwa au kuondolewa kwa sehemu ya mifugo kwa sababu ya ukosefu wa malisho, bila kubainisha kimya kimya njia hasa ambayo wanyama wangeondolewa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa sasa na wenye heshima. ‘Akamwambia’ linaendeleza mtiririko wa simulizi, na maneno ya kawaida kama ‘chemchemi,’ ‘vijito,’ ‘majani,’ na ‘mifugo’ yanafanya mstari ueleweke bila kupoteza utata wa Kiebrania.
