base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/019.yaml
  text: Now send and gather to me all Israel at Mount Carmel[a], along with the prophets of Baal, four hundred and fifty, and the prophets of Asherah, four hundred[c][b], who eat at Jezebel’s table.
translation:
  language: sw
  text: Basi sasa, tuma watu wakusanye Israeli wote waje kwangu kwenye Mlima Karmeli,[a] pamoja na manabii mia nne hamsini wa Baali na manabii mia nne wa Ashera,[b] wanaokula kwenye meza ya Yezebeli.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi Mlima Karmeli.” Kihusishi cha Kiebrania kinaonyesha mwendo kuelekea mahali pa mkusanyiko.
    reason: lexical_alternative
  - marker: b
    text: “Ashera” linaweza kumaanisha mungu wa kike Ashera au, katika miktadha mingine, kitu cha ibada kilichohusishwa naye. Hapa ulinganifu na “Baali” unapendelea maana ya mungu huyo.
    reason: cultural_note
  - marker: c
    text: Au, “wanaokula chakula kwenye meza ya Yezebeli”; usemi huo unaonyesha kwamba walitunzwa kwa ufadhili wake wa kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Ni kiashiria cha mazungumzo kinachoanzisha agizo la haraka la Eliya; “Basi sasa” ni cha asili na chenye hadhi katika Kiswahili.
- source_word: שְׁלַח קְבֹץ
  choice: tuma watu wakusanye
  rationale: Vitenzi viwili vya amri vinaonyesha kutuma watu au wajumbe ili mkusanyiko ufanyike; usemi huu ni wazi kwa Kiswahili cha sasa bila kupoteza nguvu ya agizo.
- source_word: אֵלַי
  choice: waje kwangu
  rationale: Kihusishi kinaonyesha mwendo kuelekea kwa Eliya; “waje kwangu” huunganisha kwa kawaida wazo hilo na kitendo cha kukusanyika.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Inahifadhi jina la pamoja la taifa na upana wa wito, bila kulazimisha maana kwamba lazima kila mtu mmoja mmoja awepo.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: kwenye Mlima Karmeli
  rationale: Kiebrania kinaonyesha kuelekea mahali pa mkusanyiko; “kwenye” ni cha kawaida katika Kiswahili kwa mahali walipoagizwa kukusanyika, huku tanbihi ikihifadhi maana ya mwelekeo.
- source_word: נְבִיאֵי הַבַּעַל
  choice: manabii ... wa Baali
  rationale: Muundo huu unatambulisha manabii wanaohusishwa na kumtumikia Baali; “wa Baali” ni wazi na wa kawaida.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: mia nne hamsini
  rationale: Nambari imeandikwa kwa maneno ili kufaa mtindo wa kifasihi wa tafsiri ya Biblia.
- source_word: נְבִיאֵי הָאֲשֵׁרָה
  choice: manabii ... wa Ashera
  rationale: Ulinganifu na Baali unapendelea kulichukulia Ashera kama jina la mungu wa kike; jina lenyewe linahifadhiwa bila kuingiza ufafanuzi wenye mjadala katika matini.
- source_word: אַרְבַּע מֵאוֹת
  choice: mia nne
  rationale: Nambari imeandikwa kwa maneno kwa uthabiti wa mtindo.
- source_word: אֹכְלֵי שֻׁלְחַן אִיזָבֶל
  choice: wanaokula mezani pa Yezebeli
  rationale: Usemi huu wa Kiswahili huhifadhi taswira halisi ya kula mezani pake na pia huruhusu maana iliyodokezwa ya kutunzwa kwa ufadhili wake.
theological_decisions:
- issue: Maana ya אֲשֵׁרָה katika mstari huu
  choice: 'Ashera limetafsiriwa kama jina la mungu wa kike: “manabii ... wa Ashera.”'
  alternative: Kulielewa kama kitu cha ibada, kwa mfano “nguzo ya Ashera.”
  rationale: Ulinganifu wa karibu na “manabii wa Baali” unapendelea rejeo la mungu badala ya kifaa cha ibada. Kutumia jina kunazuia kuamua kimya kimya suala lenye mjadala.
- issue: Upeo wa כָּל יִשְׂרָאֵל
  choice: “Israeli wote” limehifadhiwa kama tamko la pamoja la kitaifa.
  alternative: “Waisraeli wote,” ambalo linaweza kusikika zaidi kama kila mtu mmoja mmoja.
  rationale: Kiebrania hutumia jina la taifa kwa maana ya pamoja; tafsiri inahifadhi upana wa kimatamshi bila kufafanua kupita kiasi namna uwakilishi ulivyotekelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kinachoeleweka na chenye hadhi. Majina “Baali,” “Ashera,” “Yezebeli,” na “Mlima Karmeli” yametumiwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia. Mpangilio wa maneno umerekebishwa kidogo ili nambari zifuate nomino kwa mtiririko wa asili wa Kiswahili.
