  text: So they cried out with a loud voice and cut themselves according to their custom with swords and spears until the blood gushed out on them[a][b].
translation:
  language: sw
  text: Basi wakapaza sauti kwa nguvu, wakajikata-kata[a] kwa mapanga na mikuki, kama ilivyokuwa desturi yao[b], mpaka damu ikamwagika juu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakajichanja.” Kitenzi cha Kiebrania kinamaanisha kujitia mikato mwilini kama sehemu ya ibada.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa utaratibu wao” au “kama ilivyokuwa kawaida yao.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ בְּקוֹל גָּדוֹל
  choice: wakapaza sauti
  rationale: Kirai hiki huonyesha kuita au kulia kwa sauti kubwa. ‘Wakapaza sauti’ ni usemi wa kawaida wa Kiswahili unaohifadhi nguvu ya tendo bila kuliongezea maana.
- source_word: וַיִּתְגֹּדְדוּ
  choice: wakajikata-kata
  rationale: Umbo la kujirejelea linaonyesha walijijeruhi kwa kujikata katika ibada. Uradidi katika ‘-kata-kata’ unaonyesha mikato ya kurudiwa na ni wa asili katika Kiswahili.
- source_word: כְּמִשְׁפָּטָם
  choice: kwa desturi yao
  rationale: Katika muktadha huu מִשְׁפָּטָם ni utaratibu au desturi yao iliyokubalika ya ibada, si hukumu ya kisheria.
- source_word: בַּחֲרָבוֹת וּבָרְמָחִים
  choice: kwa mapanga na mikuki
  rationale: Herufi ב inaonyesha vyombo vilivyotumiwa; ‘mapanga na mikuki’ ni tafsiri wazi na ya kawaida.
- source_word: עַד שְׁפָךְ דָּם עֲלֵיהֶם
  choice: mpaka damu ikawatiririka mwilini
  rationale: Kirai kinaonyesha damu ikimwagika au kutiririka juu yao kutokana na majeraha. ‘Ikawatiririka mwilini’ ni Kiswahili cha kawaida na kinaeleza kwa uwazi mwelekeo wa עֲלֵיהֶם bila kuongeza kwamba damu ilichuruzika kwa nguvu.
