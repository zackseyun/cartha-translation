  yaml_path: translation/ot/1_kings/018/015.yaml
  text: And Elijah said[a], “As Yahweh of hosts lives, before whom I stand, today I will surely present myself to him.”
translation:
  language: sw
  text: Eliya akasema, “Kama Yahweh wa majeshi aishivyo, ambaye ninasimama mbele zake, hakika leo nitajionyesha kwake.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nitaonekana mbele yake.” Kitenzi cha Kiebrania kinaweza kumaanisha kuonekana au kujionyesha kwa mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Kama aishivyo Yahweh
  rationale: Hii ni fomula ya kawaida ya kiapo cha Kiebrania. Tafsiri hii inadumisha uzito wa kiapo huku ikisikika kwa ufasaha katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetolewa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: צְבָאוֹת
  choice: wa majeshi
  rationale: Neno hili humaanisha majeshi au makundi yaliyopangwa. “Wa majeshi” linadumisha upana na uzito wa cheo hiki cha Mungu bila kukifafanua kupita kiasi.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: ambaye ninasimama mbele zake
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya kusimama mbele ya mkuu, ambayo pia hudokeza kuwa katika huduma yake, bila kuondoa maana hiyo ya picha.
- source_word: כִּי הַיּוֹם
  choice: hakika leo
  rationale: Katika kiapo hiki כִּי linaimarisha uhakikisho wa Eliya; “hakika” linaonyesha msisitizo huo, na “leo” linadumisha mkazo wa wakati.
- source_word: אֵרָאֶה אֵלָיו
  choice: nitajionyesha kwake
  rationale: Niphal ya ראה hapa inaweza kumaanisha kuonekana au kujitokeza mbele ya mtu. “Nitajionyesha kwake” linaeleza kwa Kiswahili cha kawaida kwamba Eliya atajitokeza kwa makusudi mbele ya Ahabu, huku tanbihi ikihifadhi uwezekano mwingine wa kimuundo.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la agano moja kwa moja. Kulitoa kama “Yahweh” kunahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kusimama mbele za Yahweh
  choice: ambaye ninasimama mbele zake
  alternative: ninayemtumikia
  rationale: Kifungu hiki kinaweza kudokeza huduma ya Eliya kwa Mungu, lakini tafsiri ya picha ya “kusimama mbele zake” inadumisha kwa pamoja wazo la kuwapo mbele zake na la kumhudumia, bila kulazimisha maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa kiapo cha kinabii lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa Kiebrania umehifadhiwa pale unapobaki wa asili katika Kiswahili; “hakika” limetumiwa kuwasilisha nguvu ya uhakikisho.
