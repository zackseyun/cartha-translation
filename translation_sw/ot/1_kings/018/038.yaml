base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/038.yaml
  text: Then the fire of Yahweh fell and consumed the burnt offering[a], the wood, the stones, the dust, and licked up the water that was in the trench.
translation:
  language: sw
  text: Ndipo moto wa Yahwe[a] ukaanguka, ukateketeza sadaka ya kuteketezwa, kuni, mawe, na mavumbi, kisha ukayalamba maji yaliyokuwa mtaroni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moto kutoka kwa Yahwe.” Kiebrania kinaweza kueleweka kuwa kinakazia kwamba moto huo ulitoka kwa Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל
  choice: ukaanguka
  rationale: Neno נפל kimsingi humaanisha ‘kuanguka.’ Hapa linadumisha taswira ya moto unaoanguka kutoka juu bila kuibadili kuwa maelezo yasiyo ya moja kwa moja.
- source_word: אֵשׁ יְהוָה
  choice: moto wa Yahwe
  rationale: Muundo wa Kiebrania unaonyesha moto unaohusishwa na Yahwe; Kiswahili ‘moto wa Yahwe’ ni wa kawaida na pia huhifadhi uwezekano wa kueleweka kuwa moto uliotoka kwake.
- source_word: וַתֹּאכַל
  choice: ukateketeza
  rationale: Ingawa kitenzi hiki kwa kawaida ni ‘kula,’ ‘kuteketeza’ ndilo neno la kawaida na lenye nguvu kwa moto katika Kiswahili.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Katika muktadha wa dhabihu, עֹלָה ni sadaka iliyoteketezwa yote; istilahi hii inaeleweka na inadumisha maana ya kiibada.
- source_word: הָעֵצִים
  choice: kuni
  rationale: Hapa עצים ni mbao zilizopangwa kwa ajili ya kuchoma sadaka; ‘kuni’ ni neno la asili na sahihi katika muktadha huu.
- source_word: הָאֲבָנִים
  choice: mawe
  rationale: 'Ni tafsiri ya moja kwa moja inayohifadhi msisitizo wa ajabu hiyo: moto uliteketeza hata mawe.'
- source_word: הֶעָפָר
  choice: mavumbi
  rationale: עפר humaanisha mavumbi au udongo laini; ‘mavumbi’ yanahifadhi taswira dhahiri ya maandishi.
- source_word: לִחֵכָה
  choice: ukayalamba kabisa
  rationale: Kitenzi לחך humaanisha ‘kulamba.’ Neno ‘kabisa’ linaonyesha kwamba maji yaliondolewa yote huku taswira hai ya moto unaolamba ikidumishwa.
- source_word: הַמַּיִם אֲשֶׁר בַּתְּעָלָה
  choice: maji yaliyokuwa mtaroni
  rationale: תעלה ni mtaro au mfereji uliozunguka madhabahu; ‘mtaro’ ni neno dhahiri na la kawaida katika simulizi hili.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina la agano יְהוָה moja kwa moja. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano katika אֵשׁ יְהוָה
  choice: moto wa Yahwe
  alternative: moto kutoka kwa Yahwe
  rationale: ‘Moto wa Yahwe’ hudumisha muundo mfupi wa Kiebrania na kutatua kwa kiwango kidogo zaidi uhusiano huo, huku tanbihi ikionyesha wazi uwezekano wa kusisitiza chanzo cha kimungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya simulizi la Maandiko. Mfuatano wa vitenzi vyenye ‘uka-’ unaendeleza kasi ya tukio, na ‘kisha’ huweka wazi tendo la mwisho bila kulegeza msisitizo.
