base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/022.yaml
  text: Then Elijah said to the people[a], “I, I alone, am left as a prophet of Yahweh, but the prophets of Baal are four hundred and fifty men.”
translation:
  language: sw
  text: Ndipo Eliya akawaambia watu, “Mimi peke yangu[a] nimebaki kuwa nabii wa Yahwe, lakini manabii wa Baali ni wanaume mia nne na hamsini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mimi peke yangu nimesalia kama nabii wa Yahwe.” Kauli ya Eliya inaonyesha hali yake katika pambano hili la hadharani, ingawa simulizi pia linataja manabii wengine waliofichwa na Obadia (1 Wafalme 18:4, 13).
    reason: Hutoa usomaji mbadala wa kitenzi נוֹתַרְתִּי na kuhifadhi mvutano wa simulizi bila kubadili dai la Eliya katika maandishi makuu.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akawaambia
  rationale: Muundo huu unaendeleza simulizi kwa Kiswahili cha kawaida; kiambishi -wa- katika ‘akawaambia’ kinawakilisha watu walioambiwa.
- source_word: אֵלִיָּהוּ
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: אֶל הָעָם
  choice: watu
  rationale: עָם inarejelea watu wa Israeli waliokusanyika; ‘watu’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֲנִי ... לְבַדִּי
  choice: Mimi peke yangu
  rationale: Kiwakilishi huru ‘Mimi’ pamoja na ‘peke yangu’ kinahifadhi msisitizo wa Eliya kuhusu upweke wake bila kurudia ‘mimi’ kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: נוֹתַרְתִּי
  choice: nimebaki
  rationale: Wakati timilifu wa Kiswahili unaeleza hali ya sasa iliyotokana na yaliyotangulia, sawasawa na dai la Eliya kwamba yeye ndiye aliyesalia.
- source_word: נָבִיא לַיהוָה
  choice: kuwa nabii wa Yahwe
  rationale: ‘Nabii wa Yahwe’ ni Kiswahili cha kawaida kinachoonyesha kwamba nabii huyo ni wake na hunena kwa niaba yake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: ‘Yahwe’ ni umbo la Kiswahili la jina la agano YHWH, likihifadhi jina binafsi badala ya kulibadili kuwa cheo.
- source_word: וּנְבִיאֵי הַבַּעַל
  choice: lakini manabii wa Baali
  rationale: Ingawa וּ ni kiunganishi cha jumla, hapa muktadha unaonyesha tofauti kati ya Eliya mmoja na manabii wengi wa Baali; ‘lakini’ huiwasilisha kwa kawaida.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים אִישׁ
  choice: ni watu mia nne na hamsini
  rationale: Tafsiri hii inahifadhi hesabu kamili na neno אִישׁ linalowahesabu watu mmoja mmoja.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Dai la Eliya kwamba yeye peke yake ndiye nabii aliyebaki
  choice: Mimi peke yangu nimebaki kuwa nabii wa Yahwe
  alternative: Mimi peke yangu ndiye nabii wa Yahwe aliyesimama hapa hadharani
  rationale: Tafsiri inahifadhi dai lenyewe kama lilivyosemwa, bila kulipatanisha kimya kimya na taarifa kuhusu manabii wengine waliofichwa na Obadia katika 1 Wafalme 18:4, 13.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Eliya,’ ‘Yahwe,’ na ‘Baali’ yametumiwa kama maumbo ya kawaida ya majina hayo katika Kiswahili. Mpangilio wa sentensi unalenga usawa bora kati ya ukaribu na Kiebrania na usemi wa asili wa Kiswahili.
