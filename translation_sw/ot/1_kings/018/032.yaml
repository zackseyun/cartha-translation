base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/032.yaml
  text: And with the stones he built an altar in the name of Yahweh[a], and he made a trench around the altar, like the capacity for two seahs of seed.
translation:
  language: sw
  text: Kwa mawe hayo akajenga madhabahu kwa jina la Yahweh, kisha akachimba mtaro kuizunguka madhabahu, wa kipimo cha sea mbili za mbegu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kama kipimo cha sea mbili za mbegu.” Usemi huu wa kipimo una utata; unaweza kurejelea ukubwa, eneo, au ujazo wa mtaro. Sea ilikuwa kipimo cha kale cha vitu vikavu.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְנֶה אֶת־הָאֲבָנִים מִזְבֵּחַ
  choice: Kwa mawe hayo akajenga madhabahu
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la Kiebrania, ‘akajenga mawe hayo kuwa madhabahu,’ bila kuingiza kwa wazi dhana ya ‘kujenga upya’ kutoka mstari uliotangulia.
- source_word: בְּשֵׁם יְהוָה
  choice: kwa jina la Yahweh
  rationale: ‘Kwa jina la’ ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kutenda kwa kumtambua au kumwakilisha mwenye jina hilo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Kiebrania limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּעַשׂ תְּעָלָה
  choice: akachimba mtaro
  rationale: Ingawa kitenzi chenyewe ni ‘akafanya,’ kuchimba ni kitendo cha kawaida cha kutengeneza mtaro na hutoa Kiswahili cha asili katika mazingira haya.
- source_word: כְּבֵית סָאתַיִם זֶרַע
  choice: wenye ukubwa wa kadiri ya mbegu sea mbili
  rationale: Usemi wa Kiebrania ni mgumu na unaweza kueleza ukubwa au ujazo. Tafsiri hii inadumisha kipimo cha kale na kuepuka kuamua kwa uhakika zaidi ya matini.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: kuizunguka madhabahu
  rationale: Hueleza kwa ufupi na kwa kawaida kwamba mtaro ulikuwa pande zote za madhabahu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini inatumia moja kwa moja jina la agano יהוה. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa sasa. Neno ‘sea’ limehifadhiwa kama kipimo cha kale, huku tanbihi ikieleza utata wa usemi wa Kiebrania.
