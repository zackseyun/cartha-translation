reference: 1 Kings 18:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֛י כִּ/רְא֥וֹת אַחְאָ֖ב אֶת אֵלִיָּ֑הוּ וַ/יֹּ֤אמֶר אַחְאָב֙ אֵלָ֔י/ו הַ/אַתָּ֥ה זֶ֖ה עֹכֵ֥ר יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/017.yaml
  text: And when Ahab saw Elijah[a], Ahab said to him, “Is that you, troubler of Israel?”
translation:
  language: sw
  text: Basi, Ahabu alipomwona Eliya, akamwambia, “Je, ni wewe huyu unayeiletea Israeli taabu?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unayeiletea Israeli msiba,” au, “msumbufu wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa Kiswahili cha sasa bila kutumia msemo mzito kama ‘ikawa kwamba.’
- source_word: כִּרְאוֹת
  choice: alipomwona
  rationale: Muundo wa kitenzi-jina pamoja na כִּ unaonyesha wakati; ‘alipomwona’ ni wa asili na unaweka wazi kuwa tendo la kusema lilifuata kumwona Eliya.
- source_word: אַחְאָב
  choice: Ahabu
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: אֵלִיָּהוּ
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: וַיֹּאמֶר ... אֵלָיו
  choice: akamwambia
  rationale: Kitenzi hiki kimoja cha Kiswahili kinawakilisha kwa kawaida maana ya ‘akasema kwake.’
- source_word: הַאַתָּה זֶה
  choice: Je, ni wewe huyu
  rationale: Muundo huu unadumisha swali lenye msisitizo na sauti ya kukabili moja kwa moja.
- source_word: עֹכֵר
  choice: unayeiletea ... taabu
  rationale: Kivumishi-tendaji cha Kiebrania humaanisha mtu anayeleta taabu, msiba, au madhara; usemi huu ni wa kawaida kwa Kiswahili na unadumisha shtaka hilo bila kulifanya kuwa jepesi.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa limetolewa kwa umbo lake la kawaida la Kiswahili.
theological_decisions:
- issue: Sauti na uzito wa shtaka la Ahabu
  choice: unayeiletea Israeli taabu
  alternative: mleta msiba kwa Israeli; msumbufu wa Israeli
  rationale: Tafsiri inawasilisha lawama ya moja kwa moja ya Ahabu kwamba Eliya ndiye chanzo cha dhiki ya Israeli, bila kukubaliana na lawama hiyo wala kuamua mapema jibu la Eliya katika mstari unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inatumia mtiririko wa kawaida wa simulizi na inadumisha ukali wa swali la Ahabu. Kurudiwa kwa jina ‘Ahabu’ katika Kiebrania hakujarudiwa mara ya pili kwa sababu kiambishi cha kiima katika ‘akamwambia’ kinamtambulisha wazi na kurudia jina kungekuwa kuzito katika Kiswahili.
