base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/037.yaml
  text: Answer me[a], O Yahweh, answer me, so that this people may know that you, O Yahweh, are God[b], and that you have turned their heart back.
translation:
  language: sw
  text: Unijibu, ee Yahweh, unijibu, ili watu hawa wajue kwamba wewe, Yahweh, ndiwe Mungu,[a] na kwamba wewe umeigeuza mioyo yao irudi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwamba wewe, Yahweh, ndiwe Mungu huyo.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “moyo wao” (umoja), umoja wa kijumla unaorejelea watu wote kwa pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנֵנִי
  choice: Unijibu
  rationale: Katika ombi hili, kitenzi ענה kinaomba jibu la Mungu linalodhihirishwa kwa tendo. Kurudia ‘unijibu’ kunahifadhi msisitizo wa Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: וְיֵדְעוּ
  choice: ili ... wajue
  rationale: Muundo huu unaonyesha kusudi au matokeo yanayoombwa na Eliya; ‘ili ... wajue’ ni Kiswahili cha kawaida na sahihi.
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: Ingawa עָם ni nomino ya jamii katika umoja, ‘watu hawa’ ni usemi wa kawaida wa Kiswahili unaowakilisha kusanyiko hilo bila kubadili maana.
- source_word: כִּי אַתָּה יְהוָה הָאֱלֹהִים
  choice: kwamba wewe, Yahweh, ndiwe Mungu
  rationale: ‘Ndiwe’ huhifadhi mkazo wa kiwakilishi אַתָּה na hutambulisha Yahweh kuwa Mungu, tofauti na Baali. Tanbihi inataja uwezekano wa kuhifadhi uainisho wa הָאֱלֹהִים kama ‘Mungu huyo.’
- source_word: הֲסִבֹּתָ
  choice: umeigeuza ... ikurudie
  rationale: Hiphil ya סבב inaonyesha kwamba Mungu ndiye anayesababisha kugeuka. Muundo huu unahifadhi uwakala huo na kuweka wazi mwelekeo wa kurudi unaodokezwa na muktadha.
- source_word: אֶת לִבָּם
  choice: mioyo yao
  rationale: Kiebrania kina ‘moyo wao’ katika umoja wa kijamii. Kiswahili cha kawaida hutumia wingi ‘mioyo yao’; tanbihi inahifadhi umbo halisi la Kiebrania.
- source_word: אֲחֹרַנִּית
  choice: ikurudie
  rationale: Kielezi hiki huonyesha kugeuka au kurudi. Muktadha unaonyesha kurudi kwa Yahweh; ‘ikurudie’ ni ya asili kwa Kiswahili, bila kuongeza wazo la ‘tena’ lisilotajwa wazi.
theological_decisions:
- issue: Tendo la Mungu katika kurudi kwa watu
  choice: wewe umeigeuza mioyo yao ikurudie
  alternative: wewe unairudisha mioyo yao kwako
  rationale: Kauli timilifu imewasilishwa kama tendo lililotimizwa, huku uwakala wenye nguvu wa Mungu ukihifadhiwa. Tafsiri haipanui mstari huu kuwa mfumo mpana wa kimafundisho.
- issue: Utambulisho wa Yahweh kuwa Mungu
  choice: wewe, Yahweh, ndiwe Mungu
  alternative: wewe, Yahweh, ndiwe Mungu huyo
  rationale: Kauli kuu ni ya kawaida na yenye heshima katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa kusisitiza kibainishi cha Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ee’ inafaa kwa mwito wa sala; marudio yamehifadhiwa kwa msisitizo. Muundo umewekwa wazi na wa kawaida bila kuondoa mvutano wa kiteolojia kuhusu Mungu kuugeuza moyo wa watu.
