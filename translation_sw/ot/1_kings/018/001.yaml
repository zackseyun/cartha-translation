base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/001.yaml
  text: And it happened after many days that the word of Yahweh came to Elijah in the third year[a], saying, “Go, show yourself to Ahab, and I will give rain upon the face of the land.”
translation:
  language: sw
  text: Ikawa, baada ya siku nyingi, neno la Yahwe likamjia Eliya katika mwaka wa tatu, likisema, “Nenda ukajionyeshe kwa Ahabu, nami nitatoa mvua juu ya nchi.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nami nitanyesha mvua nchini.” Kiebrania kinasema kwa maana halisi, “nami nitatoa mvua juu ya uso wa nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יָמִים רַבִּים
  choice: Baada ya siku nyingi
  rationale: Kirai hiki kinaanzisha tukio jipya baada ya kipindi kirefu. Tafsiri hii inahifadhi picha ya Kiebrania na ni ya kawaida katika Kiswahili.
- source_word: וּדְבַר יְהוָה הָיָה אֶל
  choice: neno la Yahwe likamjia
  rationale: Hii ni kauli ya kawaida ya kinabii inayoonyesha ujumbe wa Mungu ukimfikia nabii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: katika mwaka wa tatu
  rationale: Hii inawakilisha moja kwa moja usemi wa wakati wa Kiebrania bila kuamua kwa kimya mwaka huo ulianza kuhesabiwa kutoka tukio gani.
- source_word: לֵאמֹר
  choice: likisema
  rationale: Inahifadhi muundo unaoanzisha maneno ya moja kwa moja huku ikirejelea neno lililomjia Eliya.
- source_word: לֵךְ הֵרָאֵה אֶל אַחְאָב
  choice: Nenda ukajionyeshe kwa Ahabu
  rationale: Kitenzi cha Kiebrania kina maana ya kuonekana au kujifanya aonekane; “ukajionyeshe” kinahifadhi agizo la Eliya kujiweka wazi mbele ya Ahabu.
- source_word: וְאֶתְּנָה מָטָר
  choice: nami nitatoa mvua
  rationale: Kitenzi נתן kimsingi ni “kutoa/kupa.” “Nitatoa mvua” ni Kiswahili kinachoeleweka na kinahifadhi wazo la mvua kama kitu kinachotolewa na Mungu.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: juu ya nchi
  rationale: Kwa neno moja moja ni “juu ya uso wa ardhi/nchi,” lakini katika Kiswahili “juu ya nchi” huwasilisha maana kwa kawaida bila kudokeza lazima dunia nzima.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina na kutumia tahajia inayofaa Kiswahili.
- issue: Mahali pa kuanzia kuhesabu “mwaka wa tatu”
  choice: katika mwaka wa tatu
  alternative: katika mwaka wa tatu wa ukame
  rationale: Maandishi hayasemi wazi ndani ya mstari huu mwaka huo unahesabiwa kutoka tukio gani; tafsiri haiongezi ufafanuzi wa kiimani au kihistoria katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa simulizi umefanywa wa asili bila kupoteza urudiaji wa kinabii au utata wa usemi “mwaka wa tatu.” Alama ya tanbihi imewekwa baada ya kauli kuhusu mvua, kwa kuwa maelezo yake yanahusu kauli hiyo.
