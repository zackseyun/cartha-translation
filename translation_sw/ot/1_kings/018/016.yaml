lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Kitenzi kinaendeleza mfululizo wa simulizi kwa maana ya kawaida ya kwenda; “akaenda” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: עֹבַדְיָהוּ
  choice: Obadia
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: לִקְרַאת
  choice: kumlaki
  rationale: Muundo huu unaonyesha kwenda kuelekea kwa mtu ili kukutana naye; “kumlaki” ni sahihi, fupi, na wenye heshima katika muktadha huu.
- source_word: אַחְאָב
  choice: Ahabu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: וַיַּגֶּד לוֹ
  choice: kumjulisha
  rationale: Kitenzi נגד katika Hiphil kinaweza kumaanisha kumwambia, kumjulisha, au kumpa taarifa. “Kumjulisha” huhifadhi ufupi wa Kiebrania bila kutaja wazi habari ambayo imeachwa kudokezwa na muktadha.
- source_word: וַיֵּלֶךְ אַחְאָב
  choice: naye Ahabu akaenda
  rationale: Huu ni mwendelezo wa matukio; “naye ... akaenda” huleta mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: אֵלִיָּהוּ
  choice: Eliya
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
