  text: So Obadiah went to meet Ahab and told him[a], and Ahab went to meet Elijah.
translation:
  language: sw
  text: Basi Obadia akaenda kumlaki Ahabu, akamwambia[a], naye Ahabu akaenda kumlaki Eliya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akampa taarifa” au “akamjulisha.” Kitenzi cha Kiebrania kinaweza kumaanisha “kumwambia,” “kumpa taarifa,” au “kumjulisha.”
