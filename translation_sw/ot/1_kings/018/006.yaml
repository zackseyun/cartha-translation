  text: 'So they divided the land between themselves to pass through it: Ahab went one way by himself[a], and Obadiah went another way by himself.'
translation:
  language: sw
  text: 'Basi wakaigawana nchi ili waipitie: Ahabu akaenda peke yake kwa njia moja, na Obadia akaenda peke yake kwa njia nyingine.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinarudia kihalisi “kwa njia moja” kwa watu wote wawili: “Ahabu akaenda peke yake kwa njia moja, na Obadia akaenda peke yake kwa njia moja.” Tafsiri imetumia “njia nyingine” katika sehemu ya pili ili kuonyesha tofauti hiyo kwa Kiswahili cha kawaida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלְּקוּ לָהֶם
  choice: wakaigawana
  rationale: Kitenzi cha kutendeana kinaeleza kwa kawaida kwamba wale wawili waligawana eneo la kupitia, bila kudokeza umiliki wa nchi.
- source_word: אֶת הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha huu אֶרֶץ ni eneo walilokusudia kulipitia; “nchi” ni neno la kawaida na lenye upana unaofaa.
- source_word: לַעֲבָר בָּהּ
  choice: ili waipitie
  rationale: Muundo huu unaonyesha kusudi la kugawana eneo, yaani kulipitia; “waipitie” ni Kiswahili cha asili na huhifadhi wazo la kwenda katika sehemu mbalimbali za nchi.
- source_word: הָלַךְ
  choice: akaenda
  rationale: Katika simulizi la njia walizochukua, “akaenda” ni tafsiri ya kawaida kuliko “akatembea,” ambayo ingeweza kudokeza namna maalumu ya kusafiri.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: kwa njia moja / kwa njia nyingine
  rationale: Kiebrania kinarudia “kwa njia moja” kwa kila mtu. Katika Kiswahili, “njia moja ... njia nyingine” huonyesha kwa uwazi na kawaida kwamba walichukua njia tofauti.
- source_word: לְבַדּוֹ
  choice: peke yake
  rationale: Huhifadhi msisitizo kwamba kila mmoja alienda akiwa ametengana na mwenzake.
- source_word: אַחְאָב
  choice: Ahabu
  rationale: Jina limetolewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: עֹבַדְיָהוּ
  choice: Obadia
  rationale: Jina limetolewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
