lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Hudumisha kiunganishi na msisitizo wa wakati katika malalamiko ya Obadia.
- source_word: לַאדֹנֶיךָ
  choice: bwana wako
  rationale: Hapa ni rejeo la kawaida kwa mkuu wa kibinadamu, yaani Ahabu, si jina la Mungu.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huwasilisha kishiria cha kuvuta fikira kwa lugha yenye hadhi na iliyozoeleka katika simulizi la Biblia.
- source_word: וַהֲרָגָנִי
  choice: naye ataniua
  rationale: Waw yenye umbo la kitenzi katika muktadha huu huonyesha matokeo yanayotarajiwa; kiwakilishi ‘naye’ kinamrejelea bwana wa Obadia.
theological_decisions:
- issue: Utambulisho wa mhusika atakayemuua Obadia
  choice: naye ataniua
  alternative: na ataniua
  rationale: Kiwakilishi ‘naye’ kinaweka wazi rejeo la kisarufi kwa bwana wake bila kuongeza jina lisilokuwapo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa usemi ulionukuliwa umehifadhiwa, pamoja na sauti ya hofu ya Obadia.
