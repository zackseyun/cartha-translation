  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: Elijah anajitambulisha kwa msisitizo, kisha anamwamuru Obadia aende amwambie bwana wake kwamba Eliya yupo. “Naye akamwambia” huwasilisha vizuri וַיֹּאמֶר לוֹ, na “yuko hapa” hutoa kwa kawaida nguvu ya הִנֵּה katika muktadha.'
