  text: וַ/יֹּ֥אמֶר ל֖/וֹ אָ֑נִי לֵ֛ךְ אֱמֹ֥ר לַ/אדֹנֶ֖י/ךָ הִנֵּ֥ה אֵלִיָּֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/008.yaml
  text: And he said to him[a], “I am he. Go, say to your master, ‘Look, Elijah is here.’”
translation:
  language: sw
  text: Naye akamwambia, “Ni mimi.[a] Nenda ukamwambie bwana wako, ‘Tazama, Eliya yuko hapa.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mimi ndiye.” Kiebrania kina kiwakilishi cha msisitizo “mimi,” ambacho hapa kinatumika kujitambulisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: Naye akamwambia
  rationale: Muundo wa usimulizi wa Kiebrania unaendeleza tendo linalofuata, huku kiambishi cha yambwa katika ‘akamwambia’ kikionyesha aliyesemeshwa kwa Kiswahili cha kawaida.
- source_word: אָנִי
  choice: Ni mimi
  rationale: Kiwakilishi huru cha nafsi ya kwanza kimetumika kwa msisitizo kama kujitambulisha; ‘Ni mimi’ ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: לֵךְ אֱמֹר
  choice: Nenda ukamwambie
  rationale: Amri mbili zinaeleza kwenda kisha kutoa ujumbe. ‘Nenda ukamwambie’ ni Kiswahili asilia kinachohifadhi mfuatano huo.
- source_word: לַאדֹנֶיךָ
  choice: bwana wako
  rationale: Neno linamtaja Ahabu kama mwenye mamlaka juu ya Obadia, si Mungu. Herufi ndogo katika ‘bwana’ husaidia kutofautisha cheo hiki cha kibinadamu na jina au cheo cha Mungu.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Chembe hii inavuta fikira kwenye tangazo linalofuata. ‘Tazama’ ni neno lenye hadhi, linaloeleweka, na huhifadhi nguvu ya kuonyesha.
- source_word: אֵלִיָּהוּ
  choice: Eliya
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
theological_decisions:
- issue: Kutafsiri אָדוֹן inapomtaja mkuu wa kibinadamu
  choice: bwana wako
  alternative: mkuu wako
  rationale: Katika muktadha, anayelengwa ni Ahabu, aliye bwana wa Obadia. ‘Bwana wako’ huhifadhi uhusiano wa mamlaka uliomo katika neno la Kiebrania, na herufi ndogo huepusha kulichanganya na cheo cha Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye hadhi na unaosomeka kwa urahisi. Uambishaji wa Kiswahili umetumiwa ili mazungumzo yasikike ya kawaida bila kupoteza ufupi na msisitizo wa Kiebrania.
