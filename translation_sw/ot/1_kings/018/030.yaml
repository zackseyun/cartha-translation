  text: וַ/יֹּ֨אמֶר אֵלִיָּ֤הוּ לְ/כָל הָ/עָם֙ גְּשׁ֣וּ אֵלַ֔/י וַ/יִּגְּשׁ֥וּ כָל הָ/עָ֖ם אֵלָ֑י/ו וַ/יְרַפֵּ֛א אֶת מִזְבַּ֥ח יְהוָ֖ה הֶ/הָרֽוּס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/030.yaml
  text: Then Elijah said to all the people[a], “Come near to me.” So all the people came near to him, and he repaired the altar of Yahweh that had been torn down.
translation:
  language: sw
  text: Ndipo Eliya akawaambia watu wote, “Nikaribieni.” Basi watu wote wakamkaribia, naye akaitengeneza[a] madhabahu ya Yahweh iliyokuwa imebomolewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akairudisha katika hali yake.” Kitenzi cha Kiebrania kwa maana halisi ni “aliponya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּשׁוּ
  choice: Nikaribieni
  rationale: Kitenzi hiki cha amri kinawaita watu wamsogelee Eliya kimwili; “Nikaribieni” ni cha kawaida na kinahifadhi mwelekeo wa kitendo.
- source_word: וַיִּגְּשׁוּ
  choice: wakamkaribia
  rationale: Kimerejelea mzizi uleule uliotumiwa katika amri na kuonyesha kwamba watu walitekeleza agizo la Eliya.
- source_word: וַיְרַפֵּא
  choice: akaitengeneza
  rationale: Ingawa maana ya msingi ya רפא ni “kuponya,” inapotumiwa kuhusu madhabahu humaanisha kuifanya iwe katika hali nzuri tena. “Akaitengeneza” ni Kiswahili cha asili na halisi katika muktadha huu.
- source_word: מִזְבַּח יְהוָה
  choice: madhabahu ya Yahweh
  rationale: Muundo huu unaonyesha kwamba madhabahu hiyo ilikuwa ya Yahweh, huku jina la Mungu likihifadhiwa kama jina binafsi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: הֶהָרוּס
  choice: iliyokuwa imebomolewa
  rationale: Kivumishi-tendo hiki huonyesha kitu kilichobomolewa au kuangushwa; tafsiri hii inaweka wazi uharibifu uliotangulia.
- source_word: וַיֹּאמֶר
  choice: Ndipo Eliya akawaambia
  rationale: “Ndipo” linaendeleza mfuatano wa simulizi, na “akawaambia” linafaa kwa sababu Eliya anawahutubia watu wote.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: Hii ni tafsiri ya kawaida na ya asili ya Kiswahili kwa kundi lote la watu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: YEHOVA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu; “Yahweh” hulihifadhi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Urudiaji wa “Nikaribieni/wakamkaribia” umehifadhiwa ili kuakisi urudiaji wa mzizi wa Kiebrania. Alama ya tanbihi imewekwa baada ya “akaitengeneza,” neno linalofafanuliwa na tanbihi.
