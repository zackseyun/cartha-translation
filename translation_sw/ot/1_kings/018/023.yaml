source:
  edition: WLC
  text: וְ/יִתְּנוּ לָ֜/נוּ שְׁנַ֣יִם פָּרִ֗ים וְ/יִבְחֲר֣וּ לָ/הֶם֩ הַ/פָּ֨ר הָ/אֶחָ֜ד וִֽ/ינַתְּחֻ֗/הוּ וְ/יָשִׂ֨ימוּ֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֣א יָשִׂ֑ימוּ וַ/אֲנִ֞י אֶעֱשֶׂ֣ה אֶת הַ/פָּ֣ר הָ/אֶחָ֗ד וְ/נָֽתַתִּי֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֥א אָשִֽׂים־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/023.yaml
  text: Let them give us two bulls[a], and let them choose one bull for themselves, cut it into pieces, and place it on the wood, but put no fire under it. And I will prepare the other bull and place it on the wood, and I will put no fire under it.
translation:
  language: sw
  text: Basi watupe mafahali wawili. Wao wajichagulie fahali mmoja, wamkate vipande vipande, kisha wamweke juu ya kuni, lakini wasitie moto. Nami nitamtayarisha fahali yule mwingine na kumweka juu ya kuni, lakini sitatie moto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִתְּנוּ לָנוּ
  choice: Basi watupe
  rationale: 'Muundo huu wa Kiebrania unatoa pendekezo au sharti la shindano: ‘watupe.’ ‘Basi’ linaunganisha pendekezo hili kwa kawaida na muktadha uliotangulia.'
- source_word: שְׁנַיִם פָּרִים
  choice: mafahali wawili
  rationale: פַּר humaanisha fahali wa kundi la ng’ombe, hasa katika mazingira ya dhabihu. ‘Mafahali’ ni wazi na haliongezi wazo la umri ambalo halijasemwa wazi hapa.
- source_word: וְיִבְחֲרוּ לָהֶם
  choice: Wao wajichagulie
  rationale: Kitenzi בחר ni ‘chagua,’ na לָהֶם huonyesha kwamba wanachagua kwa ajili ya upande wao wenyewe. ‘Wajichagulie’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: הַפָּר הָאֶחָד
  choice: fahali mmoja
  rationale: Kirai hiki humtaja mmoja kati ya mafahali wawili. ‘Fahali mmoja’ ni cha kawaida katika Kiswahili na kinahifadhi hesabu iliyo wazi katika Kiebrania.
- source_word: וִינַתְּחֻהוּ
  choice: wamkate vipandevipande
  rationale: נתח katika utayarishaji wa dhabihu ni kukata mnyama katika vipande. ‘Vipandevipande’ huonyesha mgawanyo huo bila kubainisha idadi au ukubwa wa vipande.
- source_word: וְיָשִׂימוּ עַל־הָעֵצִים
  choice: kisha wamweke juu ya kuni
  rationale: שׂים ni kuweka, na הָעֵצִים hapa ni kuni zilizotayarishwa kuwa fueli ya dhabihu. ‘Juu ya kuni’ ni usemi wa kawaida na sahihi.
- source_word: וְאֵשׁ לֹא יָשִׂימוּ
  choice: lakini wasiweke moto
  rationale: Tafsiri hii inafuata kwa karibu kauli ya Kiebrania, ‘wasiweke moto,’ bila kuongeza ‘chini yake.’ Katika muktadha maana ni kwamba wasiwashe dhabihu au kuni.
- source_word: וַאֲנִי אֶעֱשֶׂה אֶת־הַפָּר הָאֶחָד
  choice: Nami nitamtayarisha fahali yule mwingine
  rationale: עשה inapohusishwa na mnyama wa dhabihu hapa humaanisha kumtayarisha. Kwa kuwa fahali mmoja tayari amechaguliwa na upande mwingine, ‘yule mwingine’ humtambulisha kwa kawaida fahali aliyebaki.
- source_word: וְנָתַתִּי עַל־הָעֵצִים
  choice: na kumweka juu ya kuni
  rationale: נתן hapa ina maana ya kumweka mnyama juu ya kuni na inalingana na kitendo kilichotajwa katika sehemu ya kwanza ya mstari.
- source_word: וְאֵשׁ לֹא אָשִׂים
  choice: lakini sitaweka moto
  rationale: Kauli hii inadumisha usambamba na agizo la kwanza na kuhifadhi tamko la moja kwa moja la Kiebrania kwamba moto hautawekwa.
theological_decisions:
- issue: Lugha ya kutayarisha dhabihu bila kuingiza mafundisho yasiyotajwa
  choice: 'Kutumia maneno ya vitendo vya kawaida: kukata vipandevipande, kutayarisha, kuweka juu ya kuni, na kutoweka moto'
  alternative: Kutumia kila mahali istilahi za kiibada kama ‘kutoa dhabihu’ au ‘kupanga dhabihu’
  rationale: Mstari unaeleza hatua halisi za shindano la Karmeli, si kufafanua teolojia ya dhabihu. Lugha ya vitendo inafuata Kiebrania bila kuongeza maana ya kidhehebu au madai ya kiteolojia yasiyosemwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wajichagulie’ na ‘vipandevipande’ ni maneno yanayoeleweka kwa urahisi, huku mpangilio wa sentensi ukihifadhi usambamba wa pande mbili katika changamoto ya Eliya.
