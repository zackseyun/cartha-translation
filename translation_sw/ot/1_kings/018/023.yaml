- from: Basi watupe mafahali wawili. Wao wajichagulie fahali mmoja, wamkate vipandevipande, kisha wamweke juu ya kuni, lakini wasiweke moto[a]. Nami nitamtayarisha fahali yule mwingine na kumweka juu ya kuni, lakini sitaweka moto.
  to: Basi watupe mafahali wawili. Wao wajichagulie fahali mmoja, wamkate vipande vipande, kisha wamweke juu ya kuni, lakini wasitie moto. Nami nitamtayarisha fahali yule mwingine na kumweka juu ya kuni, lakini sitatie moto.
