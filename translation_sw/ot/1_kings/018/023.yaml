review_pass:
  verdict: revise
  source_fidelity: Draft accurately represents the two bulls, the opposing side's selection and cutting of one bull, placement on the wood, and Elijah's parallel preparation of the remaining bull. The proposed revision retains the Hebrew's deliberately nonspecific expression that no fire is to be put, without supplying a location or an interpretive object.
  naturalness: The draft is generally fluent Standard East African Swahili. However, "vipandevipande" should be written as the normal separate reduplication "vipande vipande," and "kutia moto" is more idiomatic than "kuweka moto" for the Hebrew expression in this sacrificial context.
  terminology: '"Mafahali," "kuni," and "kutayarisha" are appropriate. "Kumkata vipande vipande" is a clear, nontechnical rendering of sacrificial dismemberment. The revision preserves the concrete register and avoids adding technical or doctrinal terminology.'
  issues:
  - severity: low
    issue: Orthography of reduplication
    rationale: Standard writing is "vipande vipande," rather than the fused form "vipandevipande."
  - severity: low
    issue: Idiomatic rendering of putting no fire
    rationale: '"Wasiitie moto" / "sitatie moto" is more natural Swahili than "wasiweke moto" while retaining the source''s nonspecific wording. The draft footnote''s explanation that this means lighting either the wood or the offering adds an unnecessary interpretive alternative beyond the wording of the Hebrew.'
  revised_text: Basi watupe mafahali wawili. Wao wajichagulie fahali mmoja, wamkate vipande vipande, kisha wamweke juu ya kuni, lakini wasitie moto. Nami nitamtayarisha fahali yule mwingine na kumweka juu ya kuni, lakini sitatie moto.
  revised_footnotes: []
