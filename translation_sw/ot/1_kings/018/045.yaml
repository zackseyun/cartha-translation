base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/045.yaml
  text: And in a little while[a], the sky grew black with clouds and wind, and there was a heavy rain[c][b]. Then Ahab mounted his chariot and went to Jezreel.
translation:
  language: sw
  text: Baada ya muda mfupi[a], anga likawa jeusi, kukiwa na mawingu na upepo, na kukawa na mvua kubwa[c][b]. Ndipo Ahabu akapanda gari lake la vita na kwenda Yezreeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi ni “mpaka hivi na mpaka hivi,” nahau yenye maana ya “wakati huohuo” au “baada ya muda mfupi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mbingu zikawa na giza.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “mvua kuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד כֹּה וְעַד כֹּה
  choice: Baada ya muda mfupi
  rationale: Nahau hii ya Kiebrania inaonyesha kupita kwa muda mfupi. Tafsiri hii ni ya asili katika Kiswahili na huepuka kuitafsiri kijuujuu kuwa ‘mpaka hivi na mpaka hivi.’
- source_word: הַשָּׁמַיִם
  choice: anga
  rationale: Katika muktadha wa hali ya hewa, ‘anga’ hurejelea sehemu ya mbingu inayoonekana ambako mawingu hukusanyika, na ni ya kawaida zaidi kuliko ‘mbingu’ katika sentensi hii.
- source_word: הִתְקַדְּרוּ
  choice: likawa jeusi
  rationale: Kitenzi kinaeleza kutiwa giza au kuwa na sura ya huzuni. ‘Likawa jeusi’ linaonyesha wazi giza la dhoruba inayokuja.
- source_word: עָבִים וְרוּחַ
  choice: kwa mawingu na upepo
  rationale: Kirai kinaonyesha vitu vilivyoandamana na kusababisha anga kuwa jeusi. ‘Mawingu na upepo’ huhifadhi vipengele vyote bila kuongeza kwamba mawingu yalikuwa mazito.
- source_word: וַיְהִי גֶּשֶׁם גָּדוֹל
  choice: kukawa na mvua kubwa
  rationale: ‘Mvua kubwa’ ni usemi wa kawaida wa Kiswahili unaoonyesha mvua nyingi au kali, huku ukibaki karibu na maana halisi ya גָּדוֹל, ‘kubwa.’
- source_word: וַיִּרְכַּב
  choice: akapanda gari lake
  rationale: Kitenzi humaanisha kupanda au kusafiri kwa kupanda. Gari halitajwi moja kwa moja katika mstari huu, lakini linajulikana kutokana na muktadha wa simulizi; Kiswahili huhitaji kukamilisha wazo kwa njia hii ili liwe wazi.
- source_word: יִזְרְעֶאלָה
  choice: kwenda Yezreeli
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha mwendo kuelekea Yezreeli; Kiswahili hueleza hilo kwa kawaida kwa ‘kwenda Yezreeli.’
