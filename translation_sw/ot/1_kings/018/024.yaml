base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/024.yaml
  text: Then call on the name of your god[a], and I will call on the name of Yahweh; and the God who answers by fire, he is God." And all the people answered and said[b], "The word is good.
translation:
  language: sw
  text: “Kisha liitieni jina la mungu wenu[a], nami nitaliitia jina la Yahweh. Mungu atakayejibu kwa moto, huyo ndiye Mungu.” Watu wote wakajibu wakasema, “Jambo hilo ni jema[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miungu yenu,” ikiwa neno אֱלֹהֵיכֶם linaeleweka hapa kuwa wingi halisi badala ya kumrejelea mungu mmoja anayewakilishwa katika shindano hili.
    reason: lexical_alternative
  - marker: b
    text: Au, “Pendekezo hilo ni jema” au “Neno hilo ni jema.” Neno la Kiebrania דָּבָר linaweza kumaanisha “neno,” “jambo,” au “pendekezo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם בְּשֵׁם
  choice: liitieni jina la
  rationale: Muundo huu wa Kiswahili unaonyesha kumwomba au kumwita mungu kwa kulitaja jina lake, na unadumisha maana ya ibada ya kitenzi קרא pamoja na בְּשֵׁם.
- source_word: אֱלֹהֵיכֶם
  choice: mungu wenu
  rationale: Ingawa umbo la Kiebrania linaweza kuwa la wingi, muktadha wa shindano unawalenga manabii wa Baali wakimwita mungu wao mmoja; uwezekano wa wingi umehifadhiwa katika tanbihi.
- source_word: וַאֲנִי אֶקְרָא
  choice: nami nitaliitia
  rationale: “Nami” huhifadhi uratibu wenye utofautishaji wa Kiebrania, huku wakati ujao ukionyesha hatua ambayo Eliya atachukua.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika herufi nne za Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: הָאֱלֹהִים אֲשֶׁר יַעֲנֶה בָאֵשׁ
  choice: Mungu atakayejibu kwa moto
  rationale: “Kwa moto” huwasilisha matumizi ya moto kama njia au ishara ya jibu, kwa lugha ya kawaida na yenye hadhi.
- source_word: הוּא הָאֱלֹהִים
  choice: huyo ndiye Mungu
  rationale: “Huyo ndiye” huhifadhi mkazo wa kiwakilishi הוּא na tamko la kumtambua Mungu wa kweli.
- source_word: וַיַּעַן כָּל הָעָם
  choice: Watu wote wakajibu
  rationale: Huhifadhi mwitikio wa kundi lote na mwendelezo wa usimulizi.
- source_word: טוֹב הַדָּבָר
  choice: Jambo hilo ni jema
  rationale: Katika muktadha, דָּבָר ni jambo au pendekezo lililotolewa na Eliya. Tafsiri hii ni ya asili katika Kiswahili bila kuondoa upana wa neno la Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la agano, si cheo; “Yahweh” hulihifadhi wazi.
- issue: Umoja au wingi wa אֱלֹהֵיכֶם
  choice: mungu wenu
  alternative: miungu yenu
  rationale: Muktadha wa shindano na Baali unaelekeza kwenye rejeleo la umoja, lakini umbo la Kiebrania linaweza kusomwa kama wingi; tanbihi huhifadhi uwezekano huo.
- issue: Hadhi ya yule anayejibu kwa moto
  choice: huyo ndiye Mungu
  alternative: huyo ndiye mungu
  rationale: Kauli ya kilele inamtambulisha anayejibu kuwa Mungu wa kweli, huku muundo wenye mkazo wa Kiebrania ukihifadhiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Liitieni jina” ni usemi unaoeleweka katika mazingira ya ibada; “Jambo hilo ni jema” ni mwitikio wa kawaida wa kukubali pendekezo. Alama zote za tanbihi zimewekwa katika matini kuu.
