base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/046.yaml
  text: And the hand of Yahweh was on Elijah[b][a], and he tucked up his loins and ran ahead of Ahab as far as the entrance to Jezreel.
translation:
  language: sw
  text: Mkono wa Yahwe ulikuwa juu ya Eliya[a]. Eliya akakusanya vazi lake na kulifunga kiunoni[b], kisha akakimbia mbele ya Ahabu mpaka kwenye njia ya kuingia Yezreeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa mtindo wa kimapokeo, “Mkono wa Yahwe ukamjia Eliya.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “akajifunga viuno”; yaani, alikusanya vazi lake refu na kulifunga ili aweze kukimbia.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni umbo la kawaida la Kiswahili la jina la agano la Mungu, likihifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- source_word: וְיָד יְהוָה הָיְתָה אֶל
  choice: Mkono wa Yahwe ulikuwa juu ya
  rationale: Inahifadhi sitiari ya Kiebrania ya mkono wa Mungu na kitenzi rahisi 'ulikuwa,' bila kufafanua kupita kiasi namna ya uwezeshaji wa Eliya.
- source_word: וַיְשַׁנֵּס מָתְנָיו
  choice: akakusanya vazi lake na kulifunga kiunoni
  rationale: Nahau hiyo inaeleza kukusanya vazi refu na kulifunga ili mtu aweze kukimbia. Tafsiri hii inaeleweka kwa msomaji wa sasa huku tanbihi ikihifadhi umbo halisi.
- source_word: וַיָּרָץ לִפְנֵי
  choice: akakimbia mbele ya
  rationale: Inaonyesha nafasi ya Eliya mbele ya Ahabu bila kuamua kama kitendo hicho kilikuwa cha kiibada au cha kimila.
- source_word: עַד בֹּאֲכָה יִזְרְעֶאלָה
  choice: mpaka njia ya kuingia Yezreeli
  rationale: Kirai kinaashiria kufika kwenye njia au sehemu ya kuingilia mahali; tafsiri hii haidai waziwazi kuwapo kwa lango la mji.
- source_word: יִזְרְעֶאל
  choice: Yezreeli
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mahali hapo.
theological_decisions:
- issue: Namna Eliya alivyowezeshwa na Mungu
  choice: Sitiari 'Mkono wa Yahwe ulikuwa juu ya Eliya' imehifadhiwa bila kubainisha namna hasa ya uwezeshaji huo.
  alternative: Kusema moja kwa moja kwamba Yahwe alimpa Eliya nguvu za kimiujiza au kwamba alimvuvia kinabii.
  rationale: Kiebrania kinaonyesha utendaji na uwezeshaji wa Mungu, lakini hakisemi wazi kama ulikuwa nguvu za kimiujiza, msukumo wa kinabii, au yote mawili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zimetumiwa kwa mtiririko wa kawaida, huku sitiari ya Kiebrania kuhusu mkono wa Yahwe ikihifadhiwa na nahau ya mavazi ikifafanuliwa kwa lugha inayoeleweka.
