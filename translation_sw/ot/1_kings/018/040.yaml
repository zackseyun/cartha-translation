base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/040.yaml
  text: Then Elijah said to them[a], “Seize the prophets of Baal; let not one of them escape.” And they seized them[b], and Elijah brought them down to the Kishon Wadi and slaughtered them there.
translation:
  language: sw
  text: Ndipo Eliya akawaambia, “Wakamate manabii wa Baali; hata mmoja wao asiponyoke.”[a] Wakawakamata, naye Eliya akawateremsha mpaka kwenye bonde la Kishoni[b] na kuwachinja huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa namna halisi: “mtu asiponyoke kutoka kwao”; maana yake ni kwamba hata mmoja wao asitoroke.'
    reason: lexical_alternative
  - marker: b
    text: Au “kijito cha Kishoni.” Neno la Kiebrania naḥal linaweza kumaanisha bonde lenye mkondo wa maji, njia ya mkondo wa maji, au kijito.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּ
  choice: Wakamate
  rationale: Kauli ya amri kwa wingi inadai kuwakamata kwa nguvu; neno hili linaonyesha uharaka bila kuongeza maelezo.
- source_word: נְבִיאֵי הַבַּעַל
  choice: manabii wa Baali
  rationale: Huhifadhi moja kwa moja uhusiano wa muundo wa Kiebrania na jina Baali.
- source_word: אִישׁ אַל יִמָּלֵט מֵהֶם
  choice: hata mmoja wao asiponyoke
  rationale: 'Ni Kiswahili cha kawaida kinachohifadhi maana ya mgawanyo ya אִישׁ: hakuna hata mtu mmoja katika kundi hilo anayepaswa kutoroka.'
- source_word: וַיִּתְפְּשׂוּם
  choice: Wakawakamata
  rationale: Hurudia mzizi wa kitenzi kilichotumiwa katika amri na kudumisha mwendelezo wa simulizi.
- source_word: וַיּוֹרִדֵם
  choice: akawateremsha
  rationale: Huhifadhi maana ya kisababishi ya Hifili ya ירד, yaani kuwafanya washuke au kuwapeleka chini.
- source_word: נַחַל קִישׁוֹן
  choice: bonde la mto Kishoni
  rationale: נַחַל inaweza kumaanisha bonde lenye mkondo wa maji, kijito, au bonde la mto; usemi huu ni wa asili katika Kiswahili na unahifadhi sura ya kijiografia.
- source_word: וַיִּשְׁחָטֵם
  choice: kuwachinja
  rationale: שׁחט ni kali kuliko kuua kwa ujumla na mara nyingi humaanisha kuchinja; tafsiri hii haiupunguzi ukali wa tendo.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi cha mahali kinarejelea eneo lililotajwa mara moja kabla yake.
theological_decisions:
- issue: Tendo la kikatili dhidi ya manabii wa Baali
  choice: Kusimulia wazi kwamba Eliya aliwachinja bila kulainisha lugha wala kuongeza hukumu ya kimaadili.
  alternative: Kutumia ‘aliwaua’ au ‘aliwahukumu kifo,’ au kuongeza kwamba tendo hilo liliidhinishwa na Mungu.
  rationale: Kiebrania kinasimulia kukamatwa na kuchinjwa kwao moja kwa moja, lakini mstari huu wenyewe hauongezi ufafanuzi wa kimaadili au tamko la idhini ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa msomaji wa kawaida. ‘Kuwachinja’ limehifadhiwa kwa sababu ya ukali mahususi wa kitenzi cha Kiebrania; ‘bonde la mto’ limetumiwa badala ya istilahi isiyozoeleka ‘wadi.’
