base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/004.yaml
  text: When Jezebel was cutting off the prophets of Yahweh[a], Obadiah took a hundred prophets and hid them, fifty men to a cave[b], and provided them with bread and water.
translation:
  language: sw
  text: Yezebeli alipokuwa akiwaangamiza manabii wa Yahwe[a], Obadia aliwachukua manabii mia moja, akawaficha, watu hamsini katika kila pango[b], na kuwapatia mkate na maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akiwaua”; kihalisi, “akiwakatilia mbali” manabii wa Yahwe.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “watu hamsini katika pango.” Inaelekea Kiebrania kinamaanisha kwamba aliwaficha katika makundi ya watu hamsini, yaonekana katika mapango tofauti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּהַכְרִית
  choice: alipokuwa akiwaangamiza
  rationale: Muundo wa וַיְהִי pamoja na kitenzi-jina chenye בְּ unaweka mazingira ya wakati. Hifili ya כרת kihalisi ni ‘katilia mbali,’ lakini hapa ina maana ya kuwaondoa kwa kuwaua; ‘alipokuwa akiwaangamiza’ ni ya kawaida na hudokeza tendo lililokuwa likiendelea.
- source_word: אִיזֶבֶל
  choice: Yezebeli
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: נְבִיאֵי יְהוָה
  choice: manabii wa Yahwe
  rationale: Mnyororo wa umilikaji umetafsiriwa kwa muundo wa kawaida wa Kiswahili, huku jina la Mungu likihifadhiwa kama jina maalumu.
- source_word: וַיִּקַּח
  choice: aliwachukua
  rationale: לקח maana yake ya msingi ni ‘chukua’; katika muktadha huu Obadia aliwachukua chini ya ulinzi wake bila kuongeza ufafanuzi usiotajwa wazi.
- source_word: עֹבַדְיָהוּ
  choice: Obadia
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: מֵאָה נְבִאִים
  choice: manabii mia moja
  rationale: Idadi na nomino zimewasilishwa moja kwa moja kwa mpangilio wa kawaida wa Kiswahili.
- source_word: וַיַּחְבִּיאֵם
  choice: akawaficha
  rationale: Hifili ya חבא humaanisha kumficha au kumsitiri mtu; ‘akawaficha’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: watu hamsini kwa kila pango
  rationale: Kihalisi maneno yanasema ‘watu hamsini katika pango.’ Muktadha wa manabii mia moja unaonyesha ugawaji wa makundi ya watu hamsini katika mapango, nao umeelezwa kwa Kiswahili kinachoeleweka huku tanbihi ikihifadhi umbo la Kiebrania.
- source_word: וְכִלְכְּלָם
  choice: na kuwapatia
  rationale: Pilpeli ya כלכל hueleza kutunza au kukimu kwa kuwapatia mahitaji. ‘Kuwapatia’ huendana vizuri na mkate na maji vinavyofuata.
- source_word: לֶחֶם וָמָיִם
  choice: mkate na maji
  rationale: Vitu halisi vilivyotajwa katika Kiebrania vimehifadhiwa moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina maalumu la agano, tetragramatoni יְהוָה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Majina ‘Yezebeli’ na ‘Obadia’ yanafuata maumbo yaliyozoeleka katika Kiswahili; ‘Yahwe’ linahifadhi jina la Mungu. Alama zote za tanbihi [a] na [b] zimewekwa ndani ya matini kuu.
