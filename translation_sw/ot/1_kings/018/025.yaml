base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/025.yaml
  text: Then Elijah said to the prophets of Baal[a], “Choose one bull for yourselves and prepare it first, because you are many; then call on the name of your god[b], but put no fire under it.”
translation:
  language: sw
  text: Kisha Eliya akawaambia manabii wa Baali, “Jichagulieni fahali mmoja na muitayarishe kwanza, kwa sababu ninyi ni wengi. Kisha liitieni jina la mungu wenu[a], lakini msiweke moto[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mwombeni au mwitieni mungu wenu.
    reason: Nahau ya Kiebrania “kuliitia jina” inaweza kutokuwa wazi mara moja kwa msomaji wa Kiswahili.
  - marker: b
    text: Au “msiweke moto chini yake.” Kiebrania hakisemi wazi “chini yake,” lakini hilo linaeleweka kutokana na muktadha wa dhabihu.
    reason: Tanbihi huhifadhi tofauti kati ya maneno yaliyotamkwa wazi na maana inayodokezwa na muktadha.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha Eliya akawaambia
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: לִנְבִיאֵי הַבַּעַל
  choice: manabii wa Baali
  rationale: Muundo wa umilikaji unarejelea manabii wanaomhudumia Baali; hili ni tamko la kawaida na wazi katika Kiswahili.
- source_word: בַּחֲרוּ לָכֶם הַפָּר הָאֶחָד
  choice: Jichagulieni fahali mmoja
  rationale: Kiambishi cha kujinufaisha katika “jichagulieni” kinawakilisha לָכֶם, na “fahali mmoja” humaanisha mmoja kati ya wale waliotajwa katika muktadha.
- source_word: וַעֲשׂוּ
  choice: muitayarishe
  rationale: Katika muktadha wa dhabihu, kitenzi kinamaanisha kuitayarisha fahali, si tu ‘kuifanya’ wala, kwa hatua hii, kusema wazi zaidi ‘kuitoa dhabihu.’
- source_word: רִאשֹׁנָה
  choice: kwanza
  rationale: Umbo hili linafanya kazi kama kielezi cha mpangilio.
- source_word: כִּי אַתֶּם הָרַבִּים
  choice: kwa sababu ninyi ni wengi
  rationale: Kishazi kinatoa sababu ya wao kuanza; tafsiri hii inadumisha msisitizo wa kiwakilishi na wingi wao.
- source_word: וְקִרְאוּ בְּשֵׁם אֱלֹהֵיכֶם
  choice: Kisha liitieni jina la mungu wenu
  rationale: קרא בשם ni nahau ya kuomba au kumwitia mungu; “liitieni jina” huhifadhi taswira ya Kiebrania huku tanbihi ikifafanua maana yake.
- source_word: וְאֵשׁ לֹא תָשִׂימוּ
  choice: lakini msiweke moto
  rationale: Tafsiri hii huhifadhi yale yaliyosemwa wazi katika Kiebrania bila kuongeza ‘chini yake,’ ingawa muktadha wa dhabihu unaashiria mahali pa moto.
theological_decisions:
- issue: אֱלֹהֵיכֶם ikimrejelea Baali
  choice: mungu wenu
  alternative: miungu yenu
  rationale: Ingawa אֱלֹהִים linaweza kuwa na umbo la wingi, hapa rejeleo la karibu ni Baali mmoja; umoja huepuka kuingiza wingi wa miungu ambao mstari huu hautamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Biblia. “Baali,” “fahali,” na “muitayarishe” ni maneno yanayoeleweka kwa wasomaji wa kawaida; sentensi fupi zinadumisha kasi ya simulizi na hotuba ya moja kwa moja.
