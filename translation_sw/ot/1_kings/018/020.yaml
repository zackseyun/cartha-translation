  text: Basi Ahabu akatuma kwa wana wote wa Israeli[a], akawakusanya manabii kwenye Mlima Karmeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Waisraeli wote.” Kiebrania kinasema kihalisi, “kwa wana wote wa Israeli.”
