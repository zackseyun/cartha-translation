lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma ujumbe
  rationale: Kitenzi שׁלח humaanisha “kutuma.” Katika muktadha huu, Kiswahili cha kawaida kinahitaji kueleza kilichotumwa; “ujumbe” huonyesha kwa kawaida kwamba Ahabu aliwasiliana na watu wote bila kuifanya sentensi isikike kana kwamba aliwatuma wao mahali fulani.
- source_word: בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: kwa wana wote wa Israeli
  rationale: בְּ baada ya שׁלח hapa huonyesha waliolengwa na ujumbe. “Wana wote wa Israeli” huhifadhi kwa karibu nahau ya Kiebrania בְּנֵי יִשְׂרָאֵל, huku “Waisraeli wote” likiwa badala ya asili zaidi katika Kiswahili.
- source_word: וַיִּקְבֹּץ
  choice: akawakusanya
  rationale: קבץ humaanisha kukusanya au kuwakutanisha watu. Kiambishi cha yambwa “-wa-” huonyesha wazi kwamba waliokusanywa ni manabii.
- source_word: הַנְּבִיאִים
  choice: manabii
  rationale: Hili ndilo neno la kawaida na linalotambulika kwa נְבִיאִים katika Kiswahili.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: kwenye Mlima Karmeli
  rationale: אֶל huonyesha mwendo kuelekea mahali pa mkutano; “kwenye Mlima Karmeli” ni usemi wa kawaida wa Kiswahili katika muundo wa “kuwakusanya ... kwenye,” na huhifadhi jina la mahali.
