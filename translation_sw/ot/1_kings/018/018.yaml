base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/018.yaml
  text: And he said[a], “I have not troubled Israel, but you and your father's house have[c][b], because you have forsaken the commandments of Yahweh and have gone after the Baals.”
translation:
  language: sw
  text: Naye akasema, “Si mimi niliyeleta taabu juu ya Israeli, bali ni wewe na nyumba ya baba yako, kwa sababu mmeziacha amri za Yahwe na kuwafuata miungu ya Baali.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania ni wingi: “Mabaali,” yaani miungu au madhihirisho mbalimbali ya Baali yaliyoabudiwa katika maeneo tofauti.'
    reason: cultural_note
lexical_decisions:
- source_word: עָכַרְתִּי
  choice: niliyeleta taabu juu ya
  rationale: Kitenzi עכר hapa humaanisha kuiletea jamii taabu au maafa. Usemi huu ni wa kawaida katika Kiswahili na unaendeleza shtaka la mstari uliotangulia.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ndilo jina la kawaida la taifa na watu wa agano katika Kiswahili.
- source_word: כִּי אִם
  choice: bali
  rationale: Vihisishi hivi vinakanusha shtaka dhidi ya Eliya na kulielekeza kwa Ahabu; “bali” huonyesha upinzani huo kwa uwazi.
- source_word: וּבֵית אָבִיךָ
  choice: na nyumba ya baba yako
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania inayoweza kurejelea ukoo, jamaa, au nasaba ya kifalme ya baba yake.
- source_word: בַּעֲזָבְכֶם
  choice: kwa sababu mmeziacha
  rationale: Kiambishi ב pamoja na kitenzi-jina kinaonyesha sababu. Wingi wa “mme-” unalingana na Kiebrania, ambacho kinawahusisha Ahabu na nyumba ya baba yake.
- source_word: מִצְוֺת
  choice: amri
  rationale: “Amri” ni tafsiri ya kawaida na yenye uzito wa kimaagano na kisheria.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja badala ya kubadilishwa na cheo; “Yahwe” ni umbo linalofaa sauti na tahajia ya Kiswahili.
- source_word: וַתֵּלֶךְ אַחֲרֵי
  choice: kuwafuata
  rationale: Nahau hii ina maana ya kufuata kwa utii au ibada. “Kuwafuata” ni ya asili katika Kiswahili na inaonyesha uaminifu wa kidini.
- source_word: הַבְּעָלִים
  choice: Mabaali
  rationale: Kiebrania kina wingi dhahiri. “Mabaali” huhifadhi wingi huo na kurejelea maumbo au ibada mbalimbali za Baali.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia Tetragramatoni kama jina binafsi. Kulitaja “Yahwe” huhifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Wingi wa הַבְּעָלִים
  choice: Mabaali
  alternative: Baali
  rationale: Wingi wa Kiebrania umehifadhiwa ili kutoficha maumbo au madhihirisho mbalimbali ya ibada ya Baali.
- issue: Wingi katika בַּעֲזָבְכֶם
  choice: mmeziacha
  alternative: umeziacha
  rationale: Kiebrania hubadilika kutoka kwa “wewe” wa umoja kwenda kiambishi cha wingi, ambacho kinamweka Ahabu pamoja na nyumba ya baba yake katika lawama. Tafsiri inadumisha mvutano huo wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Si mimi ... bali ni wewe” unadumisha msisitizo wa Kiebrania; “nyumba ya baba yako” imehifadhiwa kwa sababu ina maana ya kifamilia na ya nasaba.
