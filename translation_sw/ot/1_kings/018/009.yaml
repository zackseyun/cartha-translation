base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/009.yaml
  text: And he said[a], “What have I sinned, that you are giving your servant into Ahab’s hand to put me to death?”
translation:
  language: sw
  text: Akasema, “Nimefanya dhambi gani, hata unanikabidhi mimi mtumishi wako mikononi mwa Ahabu ili aniue?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Kauli ya kawaida ya kusimulia inayotanguliza jibu; wakati uliopita wa Kiswahili unasomeka kwa kawaida bila kulazimisha kiunganishi cha Kiebrania.
- source_word: מֶה חָטָאתִי
  choice: Nimefanya dhambi gani
  rationale: Huhifadhi swali la Kiebrania na uzito wa kimaadili wa חטא kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: כִּי אַתָּה נֹתֵן
  choice: hata unanikabidhi
  rationale: Katika malalamiko haya, כִּי huunganisha kosa linalodhaniwa na matokeo yake; 'hata' ni kiunganishi cha asili katika Kiswahili, huku 'unani-' ikihifadhi msisitizo kwa anayekabidhiwa.
- source_word: עַבְדְּךָ
  choice: mimi mtumishi wako
  rationale: Ni namna ya kujirejelea kwa unyenyekevu mbele ya mwenye mamlaka; 'mtumishi' inafaa zaidi hapa kuliko 'mtumwa'.
- source_word: בְּיַד אַחְאָב
  choice: mikononi mwa Ahabu
  rationale: Huhifadhi sitiari ya Kiebrania ya kuwa chini ya mamlaka au udhibiti wa mtu kwa usemi wa kawaida wa Kiswahili.
- source_word: לַהֲמִיתֵנִי
  choice: ili aniue
  rationale: Hiphil ya מות ina maana ya kusababisha kifo; 'aniue' ni tafsiri sahihi, wazi, na ya kawaida kwa kusudi linalokusudiwa.
