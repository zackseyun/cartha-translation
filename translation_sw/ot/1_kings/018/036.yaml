id: 1KI.18.36
reference: 1 Kings 18:36
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/עֲל֣וֹת הַ/מִּנְחָ֗ה וַ/יִּגַּ֞שׁ אֵלִיָּ֣הוּ הַ/נָּבִיא֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל הַ/יּ֣וֹם יִוָּדַ֗ע כִּֽי אַתָּ֧ה אֱלֹהִ֛ים בְּ/יִשְׂרָאֵ֖ל וַ/אֲנִ֣י עַבְדֶּ֑/ךָ ו/ב/דברי/ך עָשִׂ֔יתִי אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/036.yaml
  text: And it happened[a], at the offering up of the grain offering, that Elijah the prophet came near and said, “O Yahweh, God of Abraham, Isaac, and Israel, let it be known today that you are God in Israel, and that I am your servant[b], and that by your word I have done all these things.”
translation:
  language: sw
  text: Ikawa wakati wa kutoa sadaka ya nafaka, nabii Eliya akakaribia na kusema, “Ee Yahwe, Mungu wa Abrahamu, Isaka na Israeli,[a] na ijulikane leo kwamba wewe ni Mungu katika Israeli, kwamba mimi ni mtumishi wako, na kwamba kwa neno lako[b] nimefanya mambo haya yote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “Israeli.” Wasomaji wengine huenda wakatarajia “Yakobo” kutokana na kauli ya mababu inayojulikana zaidi, lakini hapa maandishi yanasema wazi “Israeli.”
    reason: alternative_reading
  - marker: b
    text: Au “kulingana na neno lako” au “kwa amri yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלוֹת הַמִּנְחָה
  choice: wakati wa kutoa sadaka ya nafaka
  rationale: Muundo huu unawasilisha kwa Kiswahili cha kawaida matumizi ya עלה katika maana ya kutoa sadaka, huku מִנְחָה ikitafsiriwa kwa usahihi kuwa sadaka ya nafaka bila kuongeza wazo la ‘jioni,’ ambalo halitajwi wazi katika kifungu hiki.
- source_word: וַיִּגַּשׁ
  choice: akakaribia
  rationale: Kitenzi hiki kinahifadhi tendo halisi la Eliya kusogea karibu na pia kinafaa kwa uzito wa tukio la ibada.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: Mungu wa Abrahamu, Isaka na Israeli
  rationale: Maandishi yanasema ‘Israeli,’ si ‘Yakobo’; tafsiri haijapatanishwa na kauli nyingine zinazojulikana zaidi.
- source_word: הַיּוֹם יִוָּדַע
  choice: na ijulikane leo
  rationale: Kauli hii inaonyesha ombi la Eliya katika sala, si taarifa tu ya jambo litakalotokea.
- source_word: אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Mungu katika Israeli
  rationale: ‘Katika’ huhifadhi maana ya msingi ya kihusishi ב bila kuamua kimyakimya kati ya maana zinazowezekana kama ‘miongoni mwa’ au ‘juu ya.’
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Katika muktadha wa huduma ya kinabii, ‘mtumishi’ ni neno la kawaida na lenye heshima linaloonyesha utiifu na utume.
- source_word: וּבִדְבָרֶךָ
  choice: kwa neno lako
  rationale: Muundo huu huhifadhi uwezekano wa kueleweka kuwa kwa njia ya neno la Mungu, kulingana nalo, au kwa amri yake, bila kuufinya kuwa maana moja pekee.
- source_word: עָשִׂיתִי אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: nimefanya mambo haya yote
  rationale: Hapa דְּבָרִים inarejelea mambo au matendo, na wakati timilifu ‘nimefanya’ unaunganisha matendo yaliyokamilika na ombi la sasa.
theological_decisions:
- issue: Kutafsiri jina la agano יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina יהוה moja kwa moja; kulitohowa kama ‘Yahwe’ huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Kauli ya mababu kutumia ‘Israeli’ badala ya ‘Yakobo’
  choice: Mungu wa Abrahamu, Isaka na Israeli
  alternative: Mungu wa Abrahamu, Isaka na Yakobo
  rationale: Kiebrania kinasema ‘Israeli.’ Kulihifadhi neno hilo kunatanguliza ushahidi wa maandishi na huepuka kupatanisha kifungu na kauli nyingine.
- issue: Uhusiano unaoonyeshwa na ב katika אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Mungu katika Israeli
  alternative: Mungu juu ya Israeli au Mungu miongoni mwa Israeli
  rationale: ‘Katika’ huhifadhi upana wa usemi wa Kiebrania na haumalizi mvutano wake kwa ufafanuzi wa ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. ‘Ikawa’ huhifadhi ladha ya usimulizi wa Kiebrania, huku miundo mingine ikifanywa kuwa ya kawaida katika Kiswahili. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
