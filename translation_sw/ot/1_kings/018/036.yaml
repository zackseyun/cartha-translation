  source_fidelity: 'Tafsiri inafuata kwa uaminifu vipengele vya msingi vya Kiebrania: wakati wa kutoa sadaka ya nafaka, Eliya kumkaribia, wito kwa Yahwe, orodha yenye “Israeli” badala ya Yakobo, ombi la kijusivu “na ijulikane leo,” na dai kwamba ametenda mambo hayo kwa neno la Mungu. “Katika Israeli” huhifadhi kwa makusudi upana wa בְּיִשְׂרָאֵל bila kuongeza tafsiri ya “juu ya” au “miongoni mwa.”'
  naturalness: Kiswahili ni sanifu, cha heshima, na kinaeleweka vizuri. Muundo “Ikawa wakati wa ... nabii Eliya akakaribia” una mtindo unaofaa simulizi la kibiblia bila kuwa mgumu. “Na ijulikane leo” ni ombi la kawaida na linalosikika kiasili katika muktadha wa sala.
  terminology: “Yahwe,” “Mungu,” “mtumishi wako,” na “sadaka ya nafaka” zinafaa katika Kiswahili cha Afrika Mashariki na zinadumisha tofauti muhimu za chanzo. Jina “Israeli” limehifadhiwa sawasawa na WLC. Tanbihi a na b zimefungwa kwenye maneno yanayohusika na zinaeleza suala la matini na uwezekano wa kileksia kwa usahihi.
