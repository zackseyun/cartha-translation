  text: Kisha akazipanga kuni, akamkata fahali vipande-vipande, na akaviweka juu ya kuni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: akazipanga
  rationale: Kitenzi ערך hapa kina maana ya kupanga au kuweka kwa utaratibu katika maandalizi ya dhabihu; “akazipanga” ni Kiswahili cha kawaida na huonyesha tendo hilo wazi.
- source_word: הָעֵצִים
  choice: kuni
  rationale: Ingawa neno la Kiebrania ni la wingi, katika muktadha huu linamaanisha vipande vya mti vilivyotumiwa kama fueli ya madhabahu; “kuni” ndiyo istilahi ya kawaida na ya asili katika Kiswahili.
- source_word: וַיְנַתַּח
  choice: akamkata ... vipandevipande
  rationale: Kitenzi נתּח humaanisha kugawanya mnyama katika vipande, hasa wakati wa kuandaa dhabihu; usemi huu unatoa maana hiyo kwa uwazi bila kutumia lugha ya kitaalamu kupita kiasi.
- source_word: הַפָּר
  choice: yule fahali
  rationale: פַּר humaanisha fahali katika muktadha wa dhabihu. Kiashiria “yule” kinarejelea fahali aliyetajwa katika muktadha uliotangulia, huku “fahali” ikihifadhi maana ya mnyama dume.
- source_word: וַיָּשֶׂם
  choice: na kumweka
  rationale: שׂים hapa huonyesha kumweka mnyama aliyekatwa mahali palipokusudiwa. “Kumweka” ni ya kawaida, yenye heshima, na inafaa kwa mfuatano wa matendo.
- source_word: עַל הָעֵצִים
  choice: juu ya kuni
  rationale: עַל ina maana ya mahali hapa; “juu ya kuni” ni usemi wa kawaida wa Kiswahili unaoonyesha wazi kwamba vipande viliwekwa kwenye kuni.
