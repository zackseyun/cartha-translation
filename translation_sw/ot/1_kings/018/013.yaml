base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/013.yaml
  text: Has it not been told to my lord what I did when Jezebel was killing the prophets of Yahweh—how I hid a hundred of the prophets of Yahweh[a], fifty men in each cave, and provided them with bread and water?
translation:
  language: sw
  text: Je, bwana wangu hakuambiwa nilichofanya Yezebeli alipokuwa akiwaua manabii wa Yahweh—jinsi nilivyowaficha watu mia moja miongoni mwa manabii wa Yahweh, watu hamsini katika kila pango[a], na kuwapatia mkate na maji?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “watu hamsini hamsini, mtu, katika pango.” Kurudiwa kwa “hamsini” huonyesha ugawaji katika makundi ya hamsini; pia yaweza kueleweka, “watu hamsini kila mmoja katika pango,” au “makundi mawili ya watu hamsini katika mapango.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֻגַּד לַאדֹנִי
  choice: Je, bwana wangu hajaambiwa
  rationale: Swali la balagha linatarajia jibu la kukubali. “Bwana wangu” ni namna ya heshima kwa Eliya, si jina la Mungu.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי
  choice: nilichofanya
  rationale: Hutoa kwa lugha ya kawaida maana ya kishazi cha Kiebrania kinachotaja jambo alilofanya Obadia.
- source_word: בַּהֲרֹג אִיזֶבֶל
  choice: Yezebeli alipokuwa akiwaua
  rationale: Muundo wa wakati pamoja na kitenzi endelevu unaonyesha hali iliyokuwa ikiendelea Obadia alipotenda.
- source_word: נְבִיאֵי יְהוָה
  choice: manabii wa Yahweh
  rationale: Muundo wa umilikaji umetafsiriwa wazi, na jina la agano יְהוָה limetolewa kama “Yahweh.”
- source_word: מִנְּבִיאֵי יְהוָה מֵאָה אִישׁ
  choice: watu mia moja miongoni mwa manabii wa Yahweh
  rationale: Neno מִן linaonyesha sehemu ya kundi, na “watu” linawakilisha אִישׁ iliyo wazi katika matini.
- source_word: חֲמִשִּׁים חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: watu hamsini katika kila pango
  rationale: Kurudiwa kwa “hamsini” kuna maana ya ugawaji kwa makundi ya watu hamsini; “kila pango” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kudai kwamba wote walikuwa katika pango moja.
- source_word: וָאֲכַלְכְּלֵם לֶחֶם וָמָיִם
  choice: nami nikawapatia mkate na maji
  rationale: Kitenzi kina maana ya kuwatunza au kuwapa mahitaji; vitu vilivyotajwa moja kwa moja ni mkate na maji.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Cheo לַאדֹנִי kwa Eliya
  choice: bwana wangu
  alternative: mkubwa wangu
  rationale: Hapa אדֹן ni kauli ya heshima kwa Eliya, wala haimtambulishi kama Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Swali refu la Kiebrania limegawanywa katika sentensi mbili ili lisomeke kwa urahisi bila kubadili nguvu ya swali la balagha.
