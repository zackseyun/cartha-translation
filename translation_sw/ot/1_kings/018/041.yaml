  text: Kisha Eliya akamwambia Ahabu, “Panda, ule na unywe, kwa maana kuna sauti ya mvumo wa mvua nyingi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” pamoja na kitenzi cha kisimulizi ni Kiswahili cha kawaida na huonyesha mfuatano.
- source_word: אֵלִיָּהוּ
  choice: Eliya
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: לְאַחְאָב
  choice: akamwambia Ahabu
  rationale: Kiambishi לְ kinaonyesha mlengwa wa maneno; “akamwambia Ahabu” ni muundo wa asili wa Kiswahili.
- source_word: עֲלֵה
  choice: Panda
  rationale: Kitenzi עלה kina maana ya kupanda au kwenda juu; “Panda” huhifadhi maana ya mwelekeo wa mahali.
- source_word: אֱכֹל וּשְׁתֵה
  choice: ule na unywe
  rationale: Amri hizi mbili zimetafsiriwa moja kwa moja kwa maumbo ya kawaida na yenye heshima katika Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya agizo la Eliya na hudumisha mtiririko wenye hadhi.
- source_word: קוֹל
  choice: sauti
  rationale: קוֹל inaweza kumaanisha sauti au kelele; hapa “sauti” inafaa kwa ishara inayosikika ya mvua.
- source_word: הֲמוֹן הַגָּשֶׁם
  choice: mvua kubwa inayokuja
  rationale: Kirai cha Kiebrania ni kifupi na chenye taswira ya kishindo au wingi wa mvua. Tafsiri hii ya kimuktadha huwasilisha kwa Kiswahili cha asili mvua nzito inayokaribia bila kudai kwamba mvua tayari ilikuwa ikinyesha.
