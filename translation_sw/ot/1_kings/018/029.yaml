base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/029.yaml
  text: And it happened[a], when noon had passed, that they kept prophesying until the offering up of the grain offering, but there was no voice, no one answering[b], and no one paying attention.
translation:
  language: sw
  text: Ikawa, adhuhuri ilipopita, wakaendelea kutabiri[a] mpaka wakati wa kutolewa kwa sadaka ya nafaka[b]. Lakini hakukuwa na sauti, wala aliyekuwa akijibu, wala aliyekuwa akisikiliza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walifanya mambo ya wazimu.” Kiebrania kinatumia hapa kitenzi cha kawaida cha “kutabiri” kueleza mwenendo wa manabii wa Baali wenye msisimko wa kinabii.
    reason: lexical_alternative
  - marker: b
    text: “Wakati wa kutolewa kwa sadaka ya nafaka” unaweza pia kueleweka kuwa wakati wa sadaka ya kawaida ya jioni.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya masimulizi inayoanzisha hatua inayofuata; “Ikawa” huihifadhi kwa Kiswahili cha heshima bila maelezo ya ziada.
- source_word: כַּעֲבֹר הַצָּהֳרַיִם
  choice: adhuhuri ilipopita
  rationale: Muundo wenye כ na kitenzi-jina unaonyesha wakati; tafsiri hii inaonyesha kwamba muda wa adhuhuri ulikuwa umepita.
- source_word: וַיִּתְנַבְּאוּ
  choice: wakaendelea kutabiri
  rationale: Kitenzi ni neno la kawaida la Kiebrania la kutabiri, lakini hapa kinahusu mwenendo wa kinabii wenye msisimko wa manabii wa Baali. “Wakaendelea” huonyesha tendo lililodumu hadi wakati uliotajwa.
- source_word: עַד לַעֲלוֹת הַמִּנְחָה
  choice: mpaka wakati wa kutolewa kwa sadaka ya nafaka
  rationale: מִנְחָה kwa kawaida ni sadaka ya nafaka, na עלה hapa huhusu kutolewa au kupandishwa kwa sadaka. Neno “wakati” linaonyesha matumizi ya kirai hiki kama alama ya muda bila kuingiza “jioni” katika matini kuu.
- source_word: וְאֵין קוֹל
  choice: hapakuwa na sauti
  rationale: קוֹל inaweza kumaanisha sauti au sauti ya mtu; “sauti” huhifadhi upana huo na kutosikika kwa jibu lolote kutoka kwa Baali.
- source_word: וְאֵין עֹנֶה
  choice: wala aliyejibu
  rationale: Kirai cha participio kinaonyesha kwamba hakuwapo yeyote aliyejibu.
- source_word: וְאֵין קָשֶׁב
  choice: wala aliyewasikiliza
  rationale: קָשֶׁב humaanisha usikivu au kuzingatia. Tafsiri hii inaeleza kwa Kiswahili cha kawaida kwamba hakuna aliyewasikiliza au kuwapa uangalifu.
theological_decisions:
- issue: Jinsi ya kutafsiri mwenendo wenye msisimko wa manabii wa Baali
  choice: wakaendelea kutabiri
  alternative: wakaendelea kufanya mambo kama wenye wazimu
  rationale: Kiebrania kinatumia kitenzi cha kawaida cha kutabiri. Matini kuu inadumisha uhusiano huo wa kileksia na kuacha muktadha uonyeshe kejeli na hali ya mwenendo wao; tafsiri ya ‘kufanya mambo kama wenye wazimu’ ni ya kufasiri zaidi na kwa hiyo imewekwa katika tanbihi.
- issue: Maana ya מִנְחָה kama sadaka na kama alama ya wakati
  choice: wakati wa kutolewa kwa sadaka ya nafaka
  alternative: wakati wa sadaka ya kawaida ya jioni
  rationale: Matini inataja מִנְחָה, yaani sadaka ya nafaka, bila kutaja wazi ‘jioni.’ Maana ya wakati wa sadaka ya kawaida ya jioni ni ya uwezekano na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Muundo wa marudio “hapakuwa na… wala… wala…” huhifadhi msisitizo unaoongezeka wa Kiebrania. Viashiria vya tanbihi vimewekwa moja kwa moja baada ya vifungu vinavyohusika.
