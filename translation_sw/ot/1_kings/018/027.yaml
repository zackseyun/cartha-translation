base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/027.yaml
  text: And it happened at noon that Elijah mocked them and said[a], “Cry out with a loud voice, for he is a god. For he is musing, or he has gone aside, or he is on a journey. Perhaps he is sleeping and will awake.”
translation:
  language: sw
  text: Ikawa wakati wa adhuhuri, Eliya akawadhihaki na kusema, “Mwiteni kwa sauti kubwa, kwa maana yeye ni mungu! Huenda anatafakari, au ameenda kando[a], au yuko safarini. Labda amelala, naye ataamka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “ameenda kujisaidia.” Inaelekea usemi wa Kiebrania ni wa staha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַצָּהֳרַיִם
  choice: Ikawa wakati wa adhuhuri
  rationale: Huhifadhi mpito wa kisimulizi wa Kiebrania na kutaja wazi katikati ya siku kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: וַיְהַתֵּל בָּהֶם
  choice: akawadhihaki
  rationale: Kitenzi hiki kinaonyesha kejeli ya kudharau; “kuwadhihaki” ni sahihi na kina uzito unaofaa katika simulizi.
- source_word: קִרְאוּ בְקוֹל גָּדוֹל
  choice: Mwiteni kwa sauti kubwa
  rationale: Huhifadhi amri na taswira halisi ya kuita kwa sauti kubwa; kiambishi cha umoja kinamrejelea Baali.
- source_word: כִּי אֱלֹהִים הוּא
  choice: kwa maana yeye ni mungu
  rationale: Katika muktadha huu Eliya anasema kwa kejeli kuhusu Baali. Herufi ndogo na nomino isiyo maalumu huepuka kumtambulisha kuwa Mungu wa Israeli.
- source_word: שִׂיחַ
  choice: anatafakari
  rationale: Neno linaweza kuonyesha kuzama katika mawazo. Tafsiri hii huhifadhi maana hiyo bila kuifanya kuwa mahususi kupita ushahidi wa chanzo.
- source_word: שִׂיג לוֹ
  choice: amejitenga
  rationale: Usemi huu adimu unaonekana kuwa wa staha na huenda unamaanisha kwenda kujisaidia. Matini kuu inadumisha usemi usio wa moja kwa moja, na tanbihi inaeleza maana inayowezekana.
- source_word: דֶרֶךְ לוֹ
  choice: yuko safarini
  rationale: Ni Kiswahili cha kawaida kinachoeleza kwamba yuko njiani au ameondoka kwa safari.
- source_word: אוּלַי יָשֵׁן הוּא וְיִקָץ
  choice: Labda amelala, naye ataamka
  rationale: Huhifadhi pendekezo la kejeli na kutafsiri kitenzi cha mwisho kama tendo la mhusika mwenyewe, bila kuongeza kwamba lazima aamshwe.
theological_decisions:
- issue: Kutafsiri אֱלֹהִים inapomrejelea Baali
  choice: mungu
  alternative: Mungu
  rationale: Muktadha ni dhihaka ya Eliya kwa manabii wa Baali, si ukiri kwamba Baali ndiye Mungu wa Israeli. “mungu” huhifadhi kejeli bila kuleta utambulisho huo.
- issue: Kushughulikia usemi wa staha שִׂיג לוֹ
  choice: amejitenga
  alternative: ameenda kujisaidia
  rationale: Kiebrania chenyewe hakisemi maana hiyo kwa uwazi. Matini kuu huhifadhi usemi wa staha na tanbihi huonyesha tafsiri inayowezekana, hivyo utata halisi hauondolewi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisimulizi umewekwa wazi bila kuwa wa kizamani; kejeli ya Eliya imehifadhiwa, na usemi wa staha haujafanywa kuwa wazi kupita chanzo.
