base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/042.yaml
  text: So Ahab went up to eat and to drink[a], but Elijah went up to the top of Carmel[c][b], and he bent down to the ground and put his face between his knees.
translation:
  language: sw
  text: Basi Ahabu akapanda ili ale na anywe, lakini[a] Eliya akapanda mpaka kilele cha Karmeli[b]. Akajiinamisha mpaka chini[c], akaweka uso wake katikati ya magoti yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye Eliya.” Kiunganishi cha Kiebrania ni “na,” ingawa “lakini” huonyesha utofauti kati ya tendo la Ahabu na la Eliya.
    reason: lexical_alternative
  - marker: b
    text: Au, “sehemu ya juu ya Karmeli,” au “kilele cha Mlima Karmeli.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinaeleza mkao wa mwili wa Eliya. Muktadha mpana unadokeza kwamba alikuwa akiomba, lakini mstari huu hausemi hivyo waziwazi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: akapanda kwenda
  rationale: Kitenzi עלה kinaonyesha kwenda juu. Muundo huu wa Kiswahili unahifadhi mwelekeo huo na pia kusudi linalofuata, yaani kula na kunywa.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: kwenda kula na kunywa
  rationale: Vitenzi-jina vinaonyesha kusudi. Kiswahili cha kawaida hakihitaji kurudia kiashiria cha kusudi kabla ya kila kitenzi.
- source_word: וְאֵלִיָּהוּ
  choice: lakini Eliya
  rationale: Kiunganishi cha Kiebrania kimsingi ni ‘na,’ lakini hapa matendo ya Eliya na Ahabu yanatofautishwa. ‘Lakini’ huonyesha utofauti huo kwa Kiswahili cha kawaida bila kubadili tukio.
- source_word: עָלָה אֶל רֹאשׁ הַכַּרְמֶל
  choice: akapanda mpaka kilele cha Karmeli
  rationale: רֹאשׁ maana yake ya msingi ni ‘kichwa,’ na hapa kimetumiwa kwa maana ya sehemu ya juu au kilele. ‘Kilele cha Karmeli’ ni wazi na hakiongezi neno ‘Mlima,’ ambalo halipo wazi katika kifungu hiki.
- source_word: וַיִּגְהַר אַרְצָה
  choice: akainama hadi chini
  rationale: Kitenzi adimu גהר kinaeleza kujipinda au kuinama sana. Tafsiri hii inaonyesha mkao wa mwili bila kuufasiri moja kwa moja kuwa tendo la ibada.
- source_word: וַיָּשֶׂם פָּנָיו בֵּין ברכיו
  choice: na kuweka uso wake katikati ya magoti yake
  rationale: Hii inadumisha maelezo halisi ya mkao wa Eliya kwa lugha ya kawaida na inayoeleweka.
theological_decisions:
- issue: Ikiwa mkao wa Eliya uitwe waziwazi sala
  choice: Kuhifadhi maelezo ya mkao bila kuongeza kwamba aliomba
  alternative: Aliinama akaomba, uso wake ukiwa katikati ya magoti yake
  rationale: Muktadha mpana unaweza kudokeza sala, lakini mstari huu wenyewe unaeleza mkao wa mwili tu. Kutotaja sala kunazuia tafsiri isiingize jambo lisilosemwa wazi katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametolewa kama Ahabu, Eliya, na Karmeli. Tafsiri inadumisha maelezo halisi ya mkao na haitumii ‘kusujudu’ au ‘kuomba,’ kwa kuwa maneno hayo yangeongeza ufafanuzi wa kidini usiotajwa wazi katika mstari.
