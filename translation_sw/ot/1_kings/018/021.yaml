  text: וַ/יִּגַּ֨שׁ אֵלִיָּ֜הוּ אֶל כָּל הָ/עָ֗ם וַ/יֹּ֨אמֶר֙ עַד מָתַ֞י אַתֶּ֣ם פֹּסְחִים֮ עַל שְׁתֵּ֣י הַ/סְּעִפִּים֒ אִם יְהוָ֤ה הָֽ/אֱלֹהִים֙ לְכ֣וּ אַחֲרָ֔י/ו וְ/אִם הַ/בַּ֖עַל לְכ֣וּ אַחֲרָ֑י/ו וְ/לֹֽא עָנ֥וּ הָ/עָ֛ם אֹת֖/וֹ דָּבָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/021.yaml
  text: Then Elijah came near to all the people and said[a], “How long will you keep limping between two opinions? If Yahweh is God, follow him; but if Baal, follow him.” But the people did not answer him a word.
translation:
  language: sw
  text: Kisha Eliya akawakaribia watu wote na kusema, “Mtaendelea kuchechemea kati ya matawi mawili mpaka lini?[a] Ikiwa Yahwe ndiye Mungu, mfuateni; lakini ikiwa Baali ndiye Mungu, mfuateni.” Lakini watu hawakumjibu hata neno moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtaendelea kusitasita kati ya maoni mawili mpaka lini?” Kwa maana halisi zaidi, Kiebrania huzungumzia kuchechemea juu ya au kati ya matawi mawili—picha ya uaminifu uliogawanyika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: akawakaribia
  rationale: Kitenzi hiki kinaonyesha Eliya akisogea karibu na watu; ‘akawakaribia’ ni Kiswahili cha kawaida kinachohifadhi tendo hilo.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Huhifadhi ukamilifu wa kundi ambalo Eliya alilihutubia.
- source_word: עַד מָתַי
  choice: mpaka lini?
  rationale: Ni namna ya kawaida ya Kiswahili ya kutoa changamoto hii ya muda.
- source_word: פֹּסְחִים
  choice: mtaendelea kuchechemea
  rationale: Huhifadhi picha halisi ya kuchechemea au kwenda kwa kutokuwa thabiti, badala ya kuibadili moja kwa moja kuwa ‘kusitasita.’
- source_word: עַל שְׁתֵּי הַסְּעִפִּים
  choice: kati ya matawi mawili
  rationale: Huhifadhi picha ya Kiebrania ya matawi au migawanyiko miwili pamoja na maana yake ya uaminifu uliogawanyika.
- source_word: אִם יְהוָה הָאֱלֹהִים
  choice: Ikiwa Yahwe ndiye Mungu
  rationale: Hutaja jina la agano יְהוָה moja kwa moja na kutoa muundo wa kiarifu kwa Kiswahili cha asili.
- source_word: לְכוּ אַחֲרָיו
  choice: mfuateni
  rationale: Ni tamko la kawaida la Kiswahili linaloonyesha kumtii na kuwa mwaminifu kwake, si kusogea nyuma yake kimwili tu.
- source_word: הַבַּעַל
  choice: Baali
  rationale: ‘Baali’ ni umbo la jina hili lililozoeleka katika Kiswahili; kibainishi cha Kiebrania hakihitaji kutafsiriwa kando.
- source_word: וְלֹא עָנוּ הָעָם אֹתוֹ דָּבָר
  choice: Lakini watu hawakumjibu hata neno moja
  rationale: Huhifadhi msisitizo wa ukimya wao kamili; ‘lakini’ huonyesha tofauti kati ya changamoto ya Eliya na kutokujibu kwao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la Mungu lenye herufi nne moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Sitiari ya uaminifu uliogawanyika katika פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים
  choice: 'kuhifadhi picha halisi: ‘kuchechemea kati ya matawi mawili’'
  alternative: kusitasita kati ya misimamo miwili
  rationale: Kiebrania kina picha yenye makusudi ya mwendo usio thabiti na matawi au migawanyiko miwili. Tafsiri haiamui kimya-kimya kwamba neno hilo linamaanisha ‘maoni’ pekee.
- issue: Kiima kilichodokezwa baada ya ‘ikiwa Baali’
  choice: ndiye Mungu
  alternative: kuacha tu ‘ikiwa Baali’
  rationale: Maneno haya yamedokezwa katika Kiebrania. Kuyarudia kwa Kiswahili huweka usambamba wazi bila kuongeza dai jipya la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kinabii na sitiari halisi vimehifadhiwa; tanbihi inaeleza maana ya sitiari bila kuifuta katika matini kuu.
