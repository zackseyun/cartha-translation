source:
  edition: WLC
  text: וְ/הָיָ֞ה אֲנִ֣י אֵלֵ֣ךְ מֵ/אִתָּ֗/ךְ וְ/ר֨וּחַ יְהוָ֤ה יִֽשָּׂאֲ/ךָ֙ עַ֚ל אֲשֶׁ֣ר לֹֽא אֵדָ֔ע וּ/בָ֨אתִי לְ/הַגִּ֧יד לְ/אַחְאָ֛ב וְ/לֹ֥א יִֽמְצָאֲ/ךָ֖ וַ/הֲרָגָ֑/נִי וְ/עַבְדְּ/ךָ֛ יָרֵ֥א אֶת יְהוָ֖ה מִ/נְּעֻרָֽ/י׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/012.yaml
  text: And when I go away from you[a], the Spirit of Yahweh may carry you where I do not know. Then when I come and tell Ahab and he does not find you, he will kill me—though your servant has feared Yahweh from my youth.
translation:
  language: sw
  text: Nitakapoondoka kwako, Roho wa Yahweh[a] atakuchukua na kukupeleka mahali nisikojua. Kisha nitakapokuja kumwambia Ahabu, naye asipokupata, ataniua; ilhali mtumishi wako amemcha Yahweh tangu ujana wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upepo wa Yahweh.” Neno la Kiebrania רוּחַ linaweza kumaanisha “roho,” “upepo,” au “pumzi”; hapa “Roho” inafaa zaidi katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אֲנִי אֵלֵךְ מֵאִתָּךְ
  choice: Itakuwa kwamba nitakapoondoka kwako
  rationale: Inahifadhi utangulizi wa tukio la wakati ujao na hali inayohofiwa, huku ikisomeka kwa Kiswahili cha kawaida.
- source_word: רוּחַ יְהוָה
  choice: Roho wa Yahweh
  rationale: Katika muktadha wa kinabii, neno רוּחַ linaeleweka kwa kawaida kuwa nguvu au utendaji wa Mungu; hata hivyo, uwezekano wa maana ya ‘upepo’ umehifadhiwa katika tanbihi.
- source_word: יִשָּׂאֲךָ
  choice: atakuchukua na kukupeleka
  rationale: Kitenzi נשׂא kina wazo la kuinua au kubeba; usemi huu wa Kiswahili unaonyesha kuondolewa na kupelekwa mahali pengine bila kulazimisha namna hasa ya tukio.
- source_word: עַל אֲשֶׁר לֹא אֵדָע
  choice: mahali nisipopajua
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha mahali pasipojulikana, kama ilivyo katika Kiebrania.
- source_word: וּבָאתִי לְהַגִּיד לְאַחְאָב
  choice: Kisha nikienda kumwambia Ahabu
  rationale: 'Inawasilisha mfuatano wa hatua: Obadia anaondoka kwenda kumpa Ahabu habari.'
- source_word: וְלֹא יִמְצָאֲךָ וַהֲרָגָנִי
  choice: naye asipokupata, ataniua
  rationale: Muundo wa sharti unaeleza wazi matokeo anayoyaogopa Obadia bila kuongeza uhakika usio katika muktadha.
- source_word: וְעַבְדְּךָ יָרֵא אֶת־יְהוָה מִנְּעֻרָי
  choice: Lakini mtumishi wako amemcha Yahweh tangu ujana wangu
  rationale: ‘Mtumishi wako’ ni namna ya heshima ya kujirejelea; ‘amemcha’ huonyesha hofu yenye heshima iliyoanza zamani na kuendelea hadi sasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Maana ya רוּחַ יְהוָה
  choice: Roho wa Yahweh
  alternative: upepo wa Yahweh
  rationale: Muktadha wa Eliya kuondolewa kwa uwezo wa Mungu unaunga mkono ‘Roho’, lakini upana halisi wa neno רוּחַ unaruhusu pia ‘upepo’; tanbihi inalinda utata huo.
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina binafsi la Mungu, hivyo limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- issue: Nguvu ya kauli יִשָּׂאֲךָ katika hofu ya Obadia
  choice: atakuchukua na kukupeleka
  alternative: huenda akakuchukua na kukupeleka
  rationale: Kitenzi chenyewe ni kauli ya wakati ujao ndani ya hali inayodhaniwa; kutokuwa na uhakika kunatokana na muktadha mzima, kwa hiyo hakukuongezwa neno la uwezekano ndani ya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Jina Ahabu limetumiwa kwa umbo linalozoeleka katika Kiswahili cha Biblia. Muundo wa sharti na hofu ya Obadia umehifadhiwa bila kufafanua kupita matini.
