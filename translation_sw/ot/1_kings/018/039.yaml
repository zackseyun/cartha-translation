  text: וַ/יַּרְא֙ כָּל הָ/עָ֔ם וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֹּ֣אמְר֔וּ יְהוָה֙ ה֣וּא הָ/אֱלֹהִ֔ים יְהוָ֖ה ה֥וּא הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/039.yaml
  text: When all the people saw it[a], they fell on their faces and said, “Yahweh, he is God! Yahweh, he is God!”
translation:
  language: sw
  text: Watu wote walipoona hayo, wakaanguka kifudifudi, wakasema, “Yahweh, ndiye Mungu! Yahweh, ndiye Mungu!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא כָּל הָעָם
  choice: Watu wote walipoona hayo
  rationale: Kitenzi kina maana ya ‘kuona’; ‘hayo’ kinaweka wazi kiwakilishi kilichodokezwa na muktadha, yaani moto na tukio lililotangulia, bila kulifafanua kupita kiasi.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: wakaanguka kifudifudi
  rationale: Hii ni nahau ya Kiebrania inayoonyesha kuanguka uso chini. ‘Kifudifudi’ ni Kiswahili cha kawaida na chenye staha kinachohifadhi picha ya kusujudu.
- source_word: וַיֹּאמְרוּ
  choice: wakasema
  rationale: Kitenzi cha kawaida cha kusema hakitaji kwa chenyewe sauti kubwa wala kupaza sauti.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: הוּא
  choice: ndiye
  rationale: ‘Ndiye’ huhifadhi msisitizo wa kiwakilishi cha Kiebrania na ni usemi wa asili wa Kiswahili katika tamko hili la utambulisho.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Nomino yenye kibainishi humtambulisha Yahweh kuwa Mungu wa kweli kwa kulinganishwa na Baali; Kiswahili huwasilisha maana hiyo kwa kawaida kwa ‘Mungu’ bila kibainishi tofauti.
- source_word: יְהוָה הוּא הָאֱלֹהִים
  choice: Yahweh, ndiye Mungu!
  rationale: Muundo huu unahifadhi jina la Mungu, msisitizo wa kiwakilishi, nguvu ya ungamo, na urudiaji wa kishazi cha Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kwa cheo.
- issue: Maana ya הָאֱלֹהִים katika muktadha wa ushindani na Baali
  choice: Mungu
  alternative: Mungu wa kweli; ndiye Mungu pekee
  rationale: ‘Mungu’ pamoja na ‘ndiye’ hudumisha dai la kipekee lililomo katika muktadha bila kuongeza maneno ‘wa kweli’ au ‘pekee,’ ambayo hayajaandikwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakaanguka kifudifudi’ ni cha kueleweka kwa wasomaji wa kawaida na huhifadhi taswira halisi; urudiaji umeachwa kama ulivyo kwa ajili ya msisitizo wa kilele.
