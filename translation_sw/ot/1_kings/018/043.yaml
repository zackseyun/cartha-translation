base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/043.yaml
  text: Then he said to his servant[a], “Please go up and look toward the sea.” So he went up and looked, and said, “There is nothing.” Then he said[c][b], “Go back seven times.”
translation:
  language: sw
  text: Kisha akamwambia mtumishi wake[a], “Tafadhali panda ukatazame upande wa bahari.”[b] Basi akapanda, akatazama, akasema, “Hakuna kitu.” Kisha akamwambia, “Rudi mara saba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kijana wake” au “mhudumu wake.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “utazame kuelekea bahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: mtumishi wake
  rationale: Neno נַעַר linaweza kumaanisha kijana, mtumishi, au mhudumu. Katika muktadha huu mtu huyo anatekeleza maagizo ya Eliya, hivyo “mtumishi wake” linaeleza wajibu wake kwa Kiswahili cha kawaida bila kudai umri wake.
- source_word: עֲלֵה נָא
  choice: Tafadhali panda
  rationale: עֲלֵה ni amri ya kupanda, na נָא hulainisha ombi au kulipa uzito wa heshima. “Tafadhali panda” huhifadhi mwendo na sauti hiyo.
- source_word: הַבֵּט דֶּרֶךְ יָם
  choice: ukaangalie kuelekea baharini
  rationale: הַבֵּט humaanisha kuangalia, na דֶּרֶךְ יָם hapa huonyesha upande au mwelekeo wa bahari. Kauli hii ni ya asili na inaacha wazi kwamba alitazama upande wa bahari.
- source_word: אֵין מְאוּמָה
  choice: Hakuna kitu
  rationale: Hii ni kauli fupi ya kukana kwamba kuna kitu chochote kinachoonekana; “Hakuna kitu” ni ya kawaida na mwaminifu kwa msisitizo wa muktadha.
- source_word: שֻׁב
  choice: Rudi
  rationale: שׁוּב humaanisha kurudi. “Rudi” huhifadhi amri fupi ya Kiebrania bila kuongeza kitendo kisichotajwa moja kwa moja.
- source_word: שֶׁבַע פְּעָמִים
  choice: mara saba
  rationale: Ni usemi wa moja kwa moja wa idadi ya kurudiwa kwa tendo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mfuatano wa vitenzi “akapanda, akaangalia, akasema” umehifadhi mwendo wa simulizi la Kiebrania. “Baharini” limetumiwa kwa mwelekeo wa kutazama, si kwa maana ya kuingia baharini.
