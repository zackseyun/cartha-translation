  text: וַ֠/יִּקְחוּ אֶת הַ/פָּ֨ר אֲשֶׁר נָתַ֣ן לָ/הֶם֮ וַֽ/יַּעֲשׂוּ֒ וַ/יִּקְרְא֣וּ בְ/שֵׁם הַ֠/בַּעַל מֵ/הַ/בֹּ֨קֶר וְ/עַד הַ/צָּהֳרַ֤יִם לֵ/אמֹר֙ הַ/בַּ֣עַל עֲנֵ֔/נוּ וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין עֹנֶ֑ה וַֽ/יְפַסְּח֔וּ עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֥ר עָשָֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/026.yaml
  text: So they took the bull that had been given to them[a], prepared it, and called on the name of Baal from morning until noon, saying, “O Baal, answer us!” But there was no voice, and no one answered. And they limped around the altar that had been made.
translation:
  language: sw
  text: Basi wakachukua yule fahali waliopewa, wakamtayarisha, kisha wakaliitia jina la Baali tangu asubuhi mpaka adhuhuri, wakisema, “Ee Baali, tujibu!” Lakini hakukuwa na sauti, wala hakukuwa na aliyejibu. Nao wakachechemea kuizunguka madhabahu iliyokuwa imetengenezwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walicheza kuizunguka madhabahu” au “walirukaruka kuizunguka madhabahu.” Huenda kitenzi cha Kiebrania kinaeleza mwendo wa kiibada wa kuchechemea au kurukaruka, na huenda kimetumiwa kwa makusudi kuhusiana na mzizi huohuo alioutumia Eliya katika mstari wa 21.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ אֶת הַפָּר אֲשֶׁר נָתַן לָהֶם
  choice: wakamtwaa yule fahali waliyokuwa wamepewa
  rationale: ‘Wakamtwaa’ na ‘fahali’ zinawasilisha tendo la kuchukua mnyama wa dhabihu; usemi wa kutendwa unaepuka kumtaja kwa jina mhusika ambaye Kiebrania hakumtaji hapa.
- source_word: וַיַּעֲשׂוּ
  choice: wakamtayarisha
  rationale: Katika muktadha wa dhabihu, kitenzi hiki kimetumiwa kwa maana iliyodokezwa ya kumwandaa fahali; ‘wakamtambua’ au ‘wakamtoa dhabihu’ kungezidisha maana.
- source_word: וַיִּקְרְאוּ בְשֵׁם הַבַּעַל
  choice: wakaliitia jina la Baali
  rationale: Huhifadhi nahau ya Kiebrania ya kuliitia jina la mungu katika dua bila kuhalalisha ibada hiyo.
- source_word: מֵהַבֹּקֶר וְעַד הַצָּהֳרַיִם
  choice: tangu asubuhi mpaka adhuhuri
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili kwa kipindi hicho cha wakati.
- source_word: הַבַּעַל עֲנֵנוּ
  choice: Ee Baali, utujibu!
  rationale: ‘Ee’ huonyesha mwito wa moja kwa moja, na ‘utujibu’ hutoa ombi hilo kwa lugha ya kawaida ya sala.
- source_word: וְאֵין קוֹל וְאֵין עֹנֶה
  choice: hakukuwa na sauti, wala hakukuwa na aliyejibu
  rationale: 'Huhifadhi uradidi wenye mkazo: kwanza hakuna sauti, kisha hakuna mtu aliyejibu.'
- source_word: וַיְפַסְּחוּ עַל הַמִּזְבֵּחַ
  choice: wakachechemea kuizunguka madhabahu
  rationale: ‘Wakachechemea’ huhifadhi maana inayowezekana ya mwendo wa kulemaa au kurukaruka na mwangwi wa mzizi huohuo katika mstari wa 21; ‘kuizunguka’ ni Kiswahili cha asili kwa mwendo wa kiibada kandokando ya madhabahu.
- source_word: אֲשֶׁר עָשָׂה
  choice: iliyokuwa imetengenezwa
  rationale: Kitenzi cha Kiebrania ni umoja lakini mtendaji wake hajatajwa wazi; muundo wa kutendwa katika Kiswahili huhifadhi kutotajwa huko bila kumlazimisha msomaji kumtambua mtendaji.
theological_decisions:
- issue: Nahau ya kuliitia jina la Baali
  choice: wakaliitia jina la Baali
  alternative: walimwomba Baali
  rationale: Chaguo hili huhifadhi namna ya usemi wa Kiebrania na nguvu yake ya kiibada bila kuingiza hukumu ya ziada; simulizi lenyewe linaonyesha kutokujibu kwa Baali.
- issue: Maana ya וַיְפַסְּחוּ
  choice: wakachechemea kuizunguka madhabahu
  alternative: walicheza au walirukaruka kuizunguka madhabahu
  rationale: Maana ya mwendo huo si hakika kabisa. ‘Wakachechemea’ huhifadhi uwezekano wa kejeli ya kifasihi na uhusiano na matumizi ya mzizi huohuo katika mstari wa 21, huku tanbihi ikihifadhi mbadala halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa simulizi ni wa kawaida kwa wasomaji wengi; ‘adhuhuri,’ ‘fahali,’ na ‘madhabahu’ huhifadhi sajili ya kibiblia inayoeleweka. Alama ya tanbihi imewekwa baada ya kishazi kinachohusu mwendo wa kiibada.
