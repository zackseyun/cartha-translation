lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: Mfalme Daudi
  rationale: Cheo na jina vimetafsiriwa moja kwa moja. Kiunganishi cha mwanzo וְ hakihitaji neno la pekee katika Kiswahili kwa kuwa hapa kinaanzisha maelezo ya tukio.
- source_word: זָקֵן
  choice: alikuwa mzee
  rationale: Hutoa maana ya uzee kwa lugha ya kawaida, ya moja kwa moja na yenye heshima.
- source_word: בָּא בַּ/יָּמִים
  choice: mwenye umri mkubwa[a]
  rationale: Hii ni nahau ya Kiebrania inayosisitiza kwamba Daudi alikuwa amezeeka sana. Tafsiri hii ni ya asili katika Kiswahili, huku tanbihi ikihifadhi taswira ya maneno ya asili.
- source_word: וַ/יְכַסֻּ/הוּ
  choice: wakamfunika
  rationale: Kitenzi kina maana ya ‘walimfunika’; kiambishi cha nafsi nyingi kisichotajwa wazi kimehifadhiwa bila kubainisha wahusika.
- source_word: בַּ/בְּגָדִים
  choice: kwa nguo
  rationale: בְּגָדִים humaanisha nguo au mavazi. ‘Nguo’ ni neno la kawaida na sahihi; ‘blanketi’ lingeongeza ufafanuzi usiomo katika chanzo.
- source_word: וְ/לֹא יִחַם ל/וֹ
  choice: lakini hakupata joto
  rationale: Hueleza kwamba mwili wake haukupata joto licha ya kufunikwa. ‘Lakini’ huwasilisha utofauti wa matokeo kwa Kiswahili cha asili bila kuongeza sababu mpya.
