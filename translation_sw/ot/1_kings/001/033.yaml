base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/033.yaml
  text: And the king said to them[a], “Take with you the servants of your lord, and have my son Solomon ride on the mule that is mine, and bring him down to Gihon.”
translation:
  language: sw
  text: Mfalme akawaambia, “Chukueni pamoja nanyi watumishi wa bwana wenu, mkampandishe[a] mwanangu Sulemani juu ya nyumbu wangu mwenyewe, kisha mteremsheni mpaka Gihoni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mweke mwanangu Sulemani juu ya nyumbu wangu.” Kitenzi cha Kiebrania kiko katika kauli ya kusababisha: watumishi hao wanapaswa kumfanya Sulemani apande.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: watumishi
  rationale: Katika mazingira ya ikulu, neno hili linawahusu watu wanaomtumikia mfalme; ‘watumishi’ ni la kawaida na halisisitizi bila sababu kwamba walikuwa watumwa.
- source_word: אֲדֹנֵיכֶם
  choice: bwana wenu
  rationale: Huhifadhi namna rasmi ambayo mfalme anajirejelea kwa nafsi ya tatu katika mazingira ya kifalme.
- source_word: וְהִרְכַּבְתֶּם
  choice: mkampandishe
  rationale: Kauli ya kusababisha ya kitenzi cha Kiebrania inaonyesha kwamba walioagizwa walipaswa kumweka Sulemani juu ya nyumbu ili apande.
- source_word: הַפִּרְדָּה
  choice: nyumbu
  rationale: Neno linamaanisha nyumbu; jinsia ya mnyama haisisitizwi katika muktadha huu.
- source_word: אֲשֶׁר לִי
  choice: nyumbu wangu mwenyewe
  rationale: Kauli hii ya kawaida ya Kiswahili inasisitiza kwamba nyumbu huyo alikuwa mali binafsi ya mfalme, ishara muhimu ya idhini ya kifalme.
- source_word: וְהוֹרַדְתֶּם
  choice: mteremsheni
  rationale: Huhifadhi maana ya kusababisha kushuka na pia mwelekeo wa kwenda mahali palipo chini.
- source_word: גִּחוֹן
  choice: Gihoni
  rationale: Jina la mahali limetoholewa kwa umbo la kawaida la Kiswahili, huku kiambishi cha mahali kikifaa baada ya ‘mpaka’.
- source_word: בְנִי
  choice: mwanangu
  rationale: Huhifadhi wazi uhusiano wa Sulemani na mfalme, ambao ni muhimu katika muktadha wa urithi wa ufalme.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Mfalme akawaambia
  rationale: Hutoa kwa Kiswahili cha masimulizi mwendelezo wa kitenzi cha Kiebrania na pia yambwa ya wingi iliyo wazi katika לָהֶם.
