translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima unaofaa simulizi la kifalme. ‘Bwana wenu’ imeachwa badala ya kuibadili kuwa ‘mfalme wenu’ ili kuhifadhi namna ya kujirejelea ya kifalme; ‘nyumbu wangu mwenyewe’ ni ya asili zaidi kuliko tafsiri ya moja kwa moja ‘nyumbu aliye wangu’ huku ikidumisha msisitizo wa umiliki.
