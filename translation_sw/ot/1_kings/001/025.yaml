review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the explanatory כִּי, the directional 'has gone down,' the sacrificial feast, the invited groups, and the scene of eating and drinking in Adonijah’s presence. However, 'aishi maisha marefu' expands the Hebrew acclamation, which asks simply that the king live.
  naturalness: The wording is clear, idiomatic Standard East African Swahili. 'Tazama' is an appropriate elevated narrative cue in this biblical register. 'Kwa wingi' naturally expresses the abundance of the sacrificial animals without attaching 'wengi sana' only to the final noun.
  terminology: Dhabihu, kuhani, wakuu wa jeshi, Abiathari, and Adonia are suitable. 'Ng’ombe walionona' appropriately represents fattened livestock without restricting the term to calves.
  issues:
  - severity: medium
    issue: The acclamation is expanded as 'Mfalme Adonia aishi maisha marefu!'
    rationale: יְחִי means 'may ... live'; 'maisha marefu' adds the distinct notion of a long lifespan, not stated in the Hebrew. Use an equivalent acclamation without this addition.
  - severity: low
    issue: '''kondoo wengi sana'' most directly modifies only ''kondoo.'''
    rationale: לָרֹב denotes the lavish quantity of the animals sacrificed. 'kwa wingi' represents the idiom more flexibly and naturally.
  revised_text: Kwa maana leo ameshuka[a], akatoa dhabihu za ng’ombe dume, ng’ombe walionona, na kondoo kwa wingi. Amewaalika wana wote wa mfalme, wakuu wa jeshi, na kuhani Abiathari. Tazama, wanakula na kunywa mbele yake, nao wanasema[b], “Mfalme Adonia na aishi!”
  revised_footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi: “leo alishuka.” Kitenzi cha Kiebrania kinahifadhi wazo la kwenda au kuja chini.'
    reason: lexical_alternative
  - marker: b
    text: 'Kwa muundo wa karibu zaidi, tamko la Kiebrania ni: “Mfalme Adonia na aishi!”'
    reason: lexical_alternative
  revision_rationale: Revised the royal acclamation to avoid adding 'long life' beyond the Hebrew, and rendered abundance as 'kwa wingi.' All other wording is retained because it is faithful and natural.
