revisions:
- from: Kwa maana leo ameshuka[a], akatoa dhabihu za ng’ombe dume, ng’ombe walionona, na kondoo wengi sana. Amewaalika wana wote wa mfalme, wakuu wa jeshi, na kuhani Abiathari. Tazama, wanakula na kunywa mbele yake, nao wanasema[b], “Mfalme Adonia aishi maisha marefu!”
  to: Kwa maana leo ameshuka[a], akatoa dhabihu za ng’ombe dume, ng’ombe walionona, na kondoo kwa wingi. Amewaalika wana wote wa mfalme, wakuu wa jeshi, na kuhani Abiathari. Tazama, wanakula na kunywa mbele yake, nao wanasema[b], “Mfalme Adonia na aishi!”
  rationale: Revised the royal acclamation to avoid adding 'long life' beyond the Hebrew, and rendered abundance as 'kwa wingi.' All other wording is retained because it is faithful and natural.
