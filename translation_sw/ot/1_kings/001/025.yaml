  text: כִּ֣י יָרַ֣ד הַ/יּ֗וֹם וַ֠/יִּזְבַּח שׁ֥וֹר וּֽ/מְרִיא וְ/צֹאן֮ לָ/רֹב֒ וַ/יִּקְרָא֩ לְ/כָל בְּנֵ֨י הַ/מֶּ֜לֶךְ וּ/לְ/שָׂרֵ֤י הַ/צָּבָא֙ וּ/לְ/אֶבְיָתָ֣ר הַ/כֹּהֵ֔ן וְ/הִנָּ֛/ם אֹכְלִ֥ים וְ/שֹׁתִ֖ים לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ יְחִ֖י הַ/מֶּ֥לֶךְ אֲדֹנִיָּֽהוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/025.yaml
  text: For he has gone down today and sacrificed oxen[a], fattened calves, and sheep in abundance, and he has invited all the king’s sons, the commanders of the army, and Abiathar the priest. And look, they are eating and drinking before him, and they are saying[b], ‘Long live King Adonijah!’
translation:
  language: sw
  text: Kwa maana leo ameshuka[a], akatoa dhabihu za ng’ombe dume, ng’ombe walionona, na kondoo kwa wingi. Amewaalika wana wote wa mfalme, wakuu wa jeshi, na kuhani Abiathari. Tazama, wanakula na kunywa mbele yake, nao wanasema[b], “Mfalme Adonia na aishi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi: “leo alishuka.” Kitenzi cha Kiebrania kinahifadhi wazo la kwenda au kuja chini.'
    reason: lexical_alternative
  - marker: b
    text: 'Kwa muundo wa karibu zaidi, tamko la Kiebrania ni: “Mfalme Adonia na aishi!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha taarifa hii na onyo lililotangulia kwa kutoa sababu au maelezo, bila kulazimisha maana kuwa sababu pekee.
- source_word: יָרַד הַיּוֹם
  choice: leo ameshuka
  rationale: Inahifadhi wazo la mwelekeo lililomo katika יָרַד na pia kuonyesha kuwa tendo la leo bado lina umuhimu kwa hali ya sasa.
- source_word: וַיִּזְבַּח
  choice: akatoa dhabihu za
  rationale: Muktadha ni wa kuchinja kwa kusudi la dhabihu na karamu; ‘kutoa dhabihu’ huhifadhi maana ya kiibada kuliko ‘kuchinja’ peke yake.
- source_word: שׁוֹר
  choice: ng’ombe dume
  rationale: Neno linaweza kumaanisha fahali au ng’ombe wa jamii hiyo; hapa limetofautishwa na kundi linalofuata la mifugo iliyonona.
- source_word: מְרִיא
  choice: ng’ombe walionona
  rationale: Neno humaanisha mifugo iliyonenepeshwa; tafsiri hii haibani maana kwa ndama pekee.
- source_word: צֹאן
  choice: kondoo
  rationale: Ni tafsiri fupi na ya kawaida katika orodha za dhabihu, ingawa neno la Kiebrania linaweza kutaja kwa upana mifugo midogo ya kundi.
- source_word: לָרֹב
  choice: wengi sana
  rationale: Inaonyesha wingi mkubwa wa wanyama waliotolewa dhabihu kwa Kiswahili cha kawaida.
- source_word: וַיִּקְרָא לְ
  choice: Amewaalika
  rationale: Katika mazingira ya karamu, קרא pamoja na ל־ humaanisha kuwaita au kuwaalika watu wahudhurie.
- source_word: שָׂרֵי הַצָּבָא
  choice: wakuu wa jeshi
  rationale: Ni usemi wa sasa na unaoeleweka kwa viongozi au makamanda wa kijeshi.
- source_word: וְהִנָּם
  choice: Tazama
  rationale: Inavuta fikira kwenye hali inayoendelea bila kutumia lugha iliyopitwa na wakati.
- source_word: יְחִי הַמֶּלֶךְ אֲדֹנִיָּהוּ
  choice: Mfalme Adonia aishi maisha marefu!
  rationale: Ni tamko la shangwe la kawaida kwa Kiswahili linalowasilisha ombi la Kiebrania kwamba mfalme aishi.
