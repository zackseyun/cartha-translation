base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/003.yaml
  text: So they searched throughout all the territory of Israel for a beautiful young woman[b][a], and they found Abishag the Shunammite and brought her to the king.
translation:
  language: sw
  text: Basi wakatafuta msichana mrembo[a] katika eneo lote la Israeli. Wakampata Abishagi, Mshunami[b], wakamleta kwa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamtafuta msichana mrembo katika nchi yote ya Israeli.”
    reason: lexical_alternative
  - marker: b
    text: “Mshunami” maana yake ni mwanamke aliyetoka Shunemu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבַקְשׁוּ
  choice: wakatafuta
  rationale: Kitenzi בקשׁ hapa kinaeleza juhudi ya kumtafuta mtu; “wakatafuta” ni Kiswahili cha kawaida na sahihi katika simulizi.
- source_word: נַעֲרָה
  choice: msichana
  rationale: Neno hili humaanisha mtu wa kike aliye kijana, mara nyingi wa umri wa kuolewa. “Msichana” ni la kawaida na halina ladha ya kizamani.
- source_word: יָפָה
  choice: mrembo
  rationale: Kivumishi kinaeleza uzuri wa sura; “mrembo” ni tafsiri ya moja kwa moja na ya kawaida kwa mtu.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: katika eneo lote la Israeli
  rationale: גְּבוּל hapa inaelekea kumaanisha nchi au eneo lote, si mistari ya mipaka pekee.
- source_word: וַיִּמְצְאוּ
  choice: wakampata
  rationale: Ni kitenzi rahisi cha simulizi kinachomaanisha kwamba utafutaji wao ulifanikiwa.
- source_word: אֶת אֲבִישַׁג הַשּׁוּנַמִּית
  choice: Abishagi Mshunemi
  rationale: Jina limetoholewa kwa maumbo yanayosomeka katika Kiswahili, na jina la mahali limetolewa kwa umbo la kumtaja mtu anayetoka Shunemu.
- source_word: וַיָּבִאוּ אֹתָהּ לַמֶּלֶךְ
  choice: wakamleta kwa mfalme
  rationale: Hifili ya בוא humaanisha “kuleta”; “kwa mfalme” linaonyesha mahali au mtu walikomhusisha bila kuongeza wazo lisilokuwamo katika Kiebrania.
