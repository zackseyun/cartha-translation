translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Sentensi imegawanywa mara mbili kwa usomaji wa kawaida, huku mfululizo wa vitendo vya Kiebrania ukihifadhiwa kwa maumbo ya “waka-”.
