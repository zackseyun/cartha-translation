base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/045.yaml
  text: And Zadok the priest and Nathan the prophet have anointed him king at Gihon[a], and they have come up from there rejoicing, and the city is in an uproar. That is the sound that you heard.
translation:
  language: sw
  text: Nao Sadoki kuhani na Nathani nabii wamemtia mafuta awe mfalme huko Gihoni, nao wamepanda kutoka huko wakishangilia, na mji umejaa makelele.[a] Hiyo ndiyo sauti mliyoisikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mji ulivuma kwa sauti” au “mji ulitikisika”; kitenzi cha Kiebrania kinaonyesha makelele na msukosuko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: wamemtia mafuta
  rationale: Katika muktadha wa kifalme, משׁח humaanisha kumtia mtu mafuta ili kumweka rasmi katika wadhifa. Wakati timilifu wa Kiswahili unafaa kwa taarifa ya tukio ambalo matokeo yake yanaonekana sasa.
- source_word: צָדוֹק הַכֹּהֵן
  choice: Sadoki kuhani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili, na התואר כֹּהֵן imetafsiriwa kwa neno la kawaida 'kuhani'.
- source_word: נָתָן הַנָּבִיא
  choice: Nathani nabii
  rationale: Jina limetoholewa kwa matumizi ya Kiswahili; נָבִיא lina maana ya kawaida ya 'nabii'.
- source_word: לְמֶלֶךְ
  choice: awe mfalme
  rationale: Kirai kinaonyesha wadhifa ambao alitiwa mafuta kuushika. 'Awe mfalme' ni Kiswahili cha asili kinachoeleza kusudi na matokeo ya tendo hilo.
- source_word: בְּגִחוֹן
  choice: huko Gihoni
  rationale: Jina la mahali limetoholewa, na 'huko' linaonyesha mahali pa tukio kwa Kiswahili cha kawaida.
- source_word: וַיַּעֲלוּ מִשָּׁם
  choice: wamepanda kutoka huko
  rationale: עלה ina maana ya kupanda au kwenda juu. 'Wamepanda' huhifadhi mwelekeo wa kijiografia na pia matokeo ya sasa katika simulizi.
- source_word: שְׂמֵחִים
  choice: wakishangilia
  rationale: Neno linaeleza hali au namna yao walipokuwa wakipanda; 'wakishangilia' ni hai na linaendana na kelele zinazotajwa baadaye.
- source_word: וַתֵּהֹם הַקִּרְיָה
  choice: mji umejaa makelele
  rationale: Kitenzi הום huonyesha vurugu yenye sauti au msukosuko. Tafsiri hii inasisitiza kelele zinazoeleza 'sauti' ya kishazi kinachofuata bila kudai lazima kuwe na ghasia.
- source_word: הוּא הַקּוֹל אֲשֶׁר שְׁמַעְתֶּם
  choice: Hiyo ndiyo sauti mliyoisikia
  rationale: הוּא ina matumizi ya kuonyesha hapa, na קוֹל ni 'sauti' kwa maana pana. Umbo la wingi 'mliyoisikia' linawakilisha kiambishi cha nafsi ya pili wingi cha Kiebrania.
