base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/005.yaml
  text: Adonijah the son of Haggith exalted himself[a], saying, “I will reign.” So he made for himself a chariot, horsemen[b], and fifty men running before him.
translation:
  language: sw
  text: 'Adoniya mwana wa Hagithi akajikweza[a], akisema, “Mimi nitatawala[b].” Kisha akajiandalia gari la farasi, wapanda farasi, na wanaume hamsini waliokuwa wakikimbia mbele yake.


    [a] Au, “alijitukuza,” au, “alijiweka juu.” Kitenzi cha Kiebrania kina maana ya mtu kujikweza mwenyewe.


    [b] Au, “Mimi nitakuwa mfalme.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alijitukuza,” au, “alijiweka juu.” Kitenzi cha Kiebrania kina maana ya mtu kujikweza mwenyewe.
    reason: lexical_alternative
  - marker: b
    text: Au, “Mimi nitakuwa mfalme.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִתְנַשֵּׂא
  choice: alijiinua
  rationale: Kitenzi cha Kiebrania katika Hitpael kinaonyesha kujikweza au kujitukuza mwenyewe. “Alijiinua” huhifadhi maana ya kujifanyia kitendo na dokezo hasi bila kuongeza hukumu isiyotajwa wazi.
- source_word: לֵאמֹר אֲנִי אֶמְלֹךְ
  choice: akisema, “Mimi nitatawala.”
  rationale: Muundo huu unaanzisha dai la Adoniya. “Nitatawala” huhifadhi nguvu ya kitenzi מלך; uwezekano wa “nitakuwa mfalme” umewekwa katika tanbihi.
- source_word: וַיַּעַשׂ לוֹ
  choice: akajiandalia
  rationale: Katika muktadha wa maandalizi ya hadhi ya kifalme, “akajiandalia” ni Kiswahili cha kawaida kinachoonyesha kwamba alifanya au alipata vitu hivyo kwa ajili yake mwenyewe bila kubainisha njia ya kuvipata.
- source_word: רֶכֶב
  choice: gari la farasi
  rationale: Nomino iko katika umoja na hapa inaashiria gari lililokokotwa na farasi. “Gari la farasi” huepuka maana ya gari la kisasa na pia huepuka kudai kwamba lilikuwa gari la vita.
- source_word: פָרָשִׁים
  choice: wapanda farasi
  rationale: Hili ni neno la kawaida na wazi kwa waandamizi waliopanda farasi, bila maana ya kiufundi zaidi ya kikosi cha wapanda farasi.
- source_word: חֲמִשִּׁים אִישׁ
  choice: wanaume hamsini
  rationale: Neno אִישׁ hapa linawahusu waandamizi wa kiume; kwa hiyo jinsia iliyotajwa katika chanzo imehifadhiwa.
- source_word: רָצִים לְפָנָיו
  choice: wa kukimbia mbele yake
  rationale: Usemi huu unaeleza kazi yao kama wakimbiaji waliotangulia mbele ya Adoniya katika msafara wake.
theological_decisions:
- issue: Namna ya kuonyesha kitendo cha Adoniya
  choice: “Alijiinua” huhifadhi dokezo la kujikweza mwenyewe.
  alternative: “Alijipandisha cheo” au “alijifanya mfalme.”
  rationale: Chanzo kinadokeza tamaa isiyofaa kwa kutumia kitenzi cha kujifanyia, lakini hakitoi hukumu kamili kwa maneno ya moja kwa moja. Tafsiri haiongezi dai kwamba tayari alijifanya mfalme.
- issue: Maana ya dai אֲנִי אֶמְלֹךְ
  choice: “Mimi nitatawala” katika matini, huku “Mimi nitakuwa mfalme” ikiwa tanbihi.
  alternative: “Mimi nitakuwa mfalme” katika matini kuu.
  rationale: Kitenzi kinaweza kueleza kutawala au kuwa mfalme. Matini kuu huhifadhi umbo la kitenzi, na tanbihi huhifadhi maana nyingine halali bila kuondoa mvutano wa dai lake.
- issue: Lugha ya jinsia kuhusu waandamizi
  choice: “wanaume hamsini”
  alternative: “watu hamsini” au “wakimbiaji hamsini”
  rationale: אִישׁ ni ya kiume katika muktadha huu; hivyo tafsiri imehifadhi maelezo hayo badala ya kuyafanya yasitaje jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. “Gari la farasi” limetumiwa badala ya “gari” peke yake ili kuzuia picha ya gari la kisasa; “gari la vita” limeepukwa kwa sababu muktadha hauhitaji kulifanya gari hilo kuwa la kivita.
