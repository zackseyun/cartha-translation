base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/013.yaml
  text: Please go in to King David and say to him[a], ‘My lord the king, did you not swear to your servant, saying, “Solomon your son shall reign after me, and he shall sit on my throne”? Why then has Adonijah become king?’
translation:
  language: sw
  text: Nenda umwendee Mfalme Daudi, umwambie, ‘Bwana wangu mfalme, je, hukuapa kwa mjakazi wako[a], ukisema, “Mwanao Sulemani atatawala baada yangu, naye ataketi juu ya kiti changu cha ufalme”? Kwa nini basi Adoniya amekuwa mfalme?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania ni la jinsia ya kike; Bathsheba anajitaja kwa unyenyekevu kuwa mjakazi wa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי וּבֹאִי
  choice: Nenda kwa
  rationale: Vitenzi viwili vya agizo kwa Bathsheba vina maana ya kwenda na kuingia mbele ya mfalme. Kiswahili cha kawaida hutumia “Nenda kwa” kwa mtiririko wa asili bila kurudia wazo kwa namna isiyo ya kawaida.
- source_word: אֶל הַמֶּלֶךְ דָּוִד
  choice: kwa Mfalme Daudi
  rationale: Hili ni tumizi la kawaida la cheo pamoja na jina katika Kiswahili.
- source_word: וְאָמַרְתְּ אֵלָיו
  choice: umwambie
  rationale: Huwasilisha mwendelezo wa agizo kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: הֲלֹא
  choice: je, hukuapa
  rationale: Muundo huu ni swali la balagha linalotarajia jibu la kukubali kwamba kiapo kilitolewa.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Bwana wangu mfalme
  rationale: Ni lugha ya heshima ya kumwendea mfalme; hapa “bwana” ni cheo cha kibinadamu, si jina la Mungu.
- source_word: נִשְׁבַּעְתָּ
  choice: hukuapa
  rationale: Kitenzi kinaonyesha kuapa kiapo rasmi, si kutoa ahadi ya kawaida tu.
- source_word: לַאֲמָתְךָ
  choice: kwa mjakazi wako
  rationale: Nomino ya Kiebrania ni ya jinsia ya kike na ni namna ya Bathsheba kujitaja kwa unyenyekevu mbele ya mfalme.
- source_word: לֵאמֹר כִּי
  choice: ukisema
  rationale: Hutambulisha yaliyomo katika kiapo bila kuongeza neno la msisitizo lisilohitajika.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: Mwanao Sulemani
  rationale: Hufuata mpangilio wa Kiebrania huku ikibaki ya kawaida na wazi katika Kiswahili.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: atatawala baada yangu
  rationale: Huhifadhi maana ya kutawala kama mfalme na urithi wa ufalme baada ya Daudi.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי
  choice: naye ataketi kwenye kiti changu cha ufalme
  rationale: “Kiti cha ufalme” huwasilisha kwa uwazi taswira ya kuketi kwenye kiti cha mfalme kama ishara ya kutawazwa.
- source_word: וּמַדּוּעַ מָלַךְ אֲדֹנִיָהוּ
  choice: Kwa nini basi Adoniya amekuwa mfalme?
  rationale: “Basi” huonyesha kuwa swali hili linatokana na kiapo kilichotajwa; kauli timilifu inaonyesha hali ambayo tayari imetokea.
