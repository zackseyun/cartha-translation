translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima ya lugha ya kifalme lakini kinachoeleweka kwa wasomaji wa sasa. Tafsiri imeepuka kuongeza msisitizo kama “hakika,” ambao si lazima katika kifungu hiki.
