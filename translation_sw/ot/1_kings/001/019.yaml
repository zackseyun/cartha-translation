  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha umehifadhiwa, pamoja na tofauti kati ya ng’ombe kwa ujumla na ng’ombe waliononeshwa. Majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili.
