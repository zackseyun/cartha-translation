base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/019.yaml
  text: And he sacrificed oxen[a], fattened cattle, and sheep in abundance, and he invited all the king’s sons, Abiathar the priest, and Joab the commander of the army[b]; but he did not invite Solomon your servant.
translation:
  language: sw
  text: Akatoa dhabihu za ng’ombe, ng’ombe walionenepeshwa, na kondoo kwa wingi. Akawaalika wana wote wa mfalme, kuhani Abiathari, na Yoabu, mkuu wa jeshi; lakini hakumwalika Sulemani, mtumishi wako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Akatoa dhabihu
  rationale: Kitenzi זבח hapa kinamaanisha kuchinja au kutoa wanyama kama dhabihu, si kuchinja kwa matumizi ya kawaida tu. ‘Akatoa dhabihu’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: Neno hili la Kiebrania humaanisha mnyama wa jamii ya ng’ombe bila kulazimisha kutaja jinsia yake katika muktadha huu.
- source_word: מְרִיא
  choice: ng’ombe waliononeshwa
  rationale: Neno hili humaanisha mifugo iliyolishwa na kunoneshwa. Kutaja ‘ng’ombe’ tena kunahifadhi tofauti iliyopo katika orodha ya Kiebrania, ingawa marudio hayo ni dhahiri pia katika Kiswahili.
- source_word: צֹאן
  choice: kondoo
  rationale: ‘Kondoo’ ni tafsiri ya kawaida katika orodha ya wanyama wa dhabihu, huku tanbihi ikihifadhi uwezekano mpana wa wanyama wa kundi, wakiwemo mbuzi.
- source_word: לָרֹב
  choice: wengi sana
  rationale: Kirai hiki kinaonyesha wingi mkubwa wa wanyama; ‘wengi sana’ ni cha kawaida na kinaeleweka kwa urahisi.
- source_word: וַיִּקְרָא
  choice: Akawaalika
  rationale: Ingawa קרא kimsingi ni ‘kuita,’ katika mazingira haya ya karamu ya dhabihu tendo hilo ni kuwaalika watu wahudhurie.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: wana wote wa mfalme
  rationale: Tafsiri hii inahifadhi maana mahususi ya wana wa kiume wa mfalme na ni ya asili katika sajili ya kibiblia ya Kiswahili.
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: kuhani Abiathari
  rationale: Cheo kimetafsiriwa na jina limetoholewa kwa namna inayotambulika katika Kiswahili.
- source_word: יֹאָב שַׂר הַצָּבָא
  choice: Yoabu, mkuu wa jeshi
  rationale: שַׂר הַצָּבָא ni kiongozi mkuu wa kijeshi; ‘mkuu wa jeshi’ ni usemi wazi na wa kawaida.
- source_word: וְלִשְׁלֹמֹה עַבְדְּךָ לֹא קָרָא
  choice: lakini hakumwalika Sulemani, mtumishi wako
  rationale: ‘Lakini’ huonyesha wazi tofauti kati ya walioalikwa na Sulemani aliyeachwa nje. ‘Mtumishi wako’ huhifadhi namna ya heshima ambayo Bathsheba anatumia akizungumza na Daudi.
