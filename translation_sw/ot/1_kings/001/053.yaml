base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/053.yaml
  text: Then King Solomon sent[a], and they brought him down from the altar. And he came and bowed down to King Solomon, and Solomon said to him, “Go to your house.”
translation:
  language: sw
  text: Ndipo Mfalme Sulemani akatuma[a], nao wakamshusha Adonia kutoka madhabahuni. Akaja, akainama mbele ya Mfalme Sulemani, naye Sulemani akamwambia, “Nenda nyumbani kwako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema tu “akatuma”; hakitaji aliyemtuma. Wale waliomshusha Adonia hawatajwi wazi.
    reason: Hufafanua udondoshaji wa mtendwa katika kitenzi cha Kiebrania bila kuongeza “watu” katika tafsiri.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma watu
  rationale: Kitenzi kinamaanisha ‘akatuma’; kuongeza ‘watu’ kunafanya Kiswahili kiwe cha kawaida na kunapatana na wingi usiotajwa wazi wa watendaji katika kishazi kinachofuata.
- source_word: וַיֹּרִדֻהוּ
  choice: wakamshusha Adonia
  rationale: Umbo la kisababishi linaonyesha kuwa watendaji wasiotajwa walimfanya ashuke. Jina ‘Adonia’ limewekwa badala ya kiwakilishi pekee ili rejeleo liwe wazi katika aya inayosimama yenyewe.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: kutoka madhabahuni
  rationale: Huwasilisha kuondolewa kwake katika eneo la madhabahu kwa Kiswahili cha kawaida; muktadha uliotangulia unaonyesha alikuwa ameshika pembe za madhabahu, si lazima ameketi juu yake.
- source_word: וַיָּבֹא
  choice: Akaja
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi cha kawaida בוא na inadumisha mtiririko wa simulizi.
- source_word: וַיִּשְׁתַּחוּ לַמֶּלֶךְ שְׁלֹמֹה
  choice: na kuinama mbele ya Mfalme Sulemani
  rationale: ‘Kuinama mbele ya’ ni lugha ya kawaida yenye heshima na huacha wazi kiwango cha tendo hilo—kuinama au kujitupa kifudifudi—pamoja na maana yake ya heshima kwa mfalme.
- source_word: לֵךְ לְבֵיתֶךָ
  choice: Nenda nyumbani kwako
  rationale: Huhifadhi amri pamoja na wazo la kwenda kwenye nyumba yake mwenyewe, kwa Kiswahili cha sasa na cha hadhi.
