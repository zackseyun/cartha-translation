base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/017.yaml
  text: She said to him, “My lord, you swore by the LORD your God to your female servant, ‘Surely Solomon your son will reign after me, and he will sit on my throne.’”
translation:
  language: sw
  text: Akamwambia, “Bwana wangu, wewe uliapa kwa BWANA Mungu wako kwa mjakazi wako, ‘Hakika Sulemani mwana wako atatawala baada yangu, naye ataketi katika kiti changu cha enzi.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Bwana wangu
  rationale: Ni namna ya heshima ya Bathsheba kumwambia mfalme; hapa si jina la Mungu.
- source_word: בַּיהוָה
  choice: kwa BWANA
  rationale: Herufi kubwa zinaonyesha jina la agano יהוה kwa kufuata desturi iliyozoeleka katika tafsiri za Kiswahili.
- source_word: לַאֲמָתֶךָ
  choice: mbele ya mjakazi wako
  rationale: Katika muktadha wa kiapo, kishazi hiki humtaja aliyepokea uthibitisho wa kiapo; ‘mjakazi wako’ huhifadhi lugha ya unyenyekevu ya msemaji.
- source_word: כִּי
  choice: Hakika
  rationale: Katika yaliyomo ya kiapo, neno hili linaweza kuwa la kusisitiza; ‘Hakika’ huhifadhi msisitizo huo bila kuifanya sentensi kuwa isiyo ya kawaida.
- source_word: יִמְלֹךְ
  choice: atatawala
  rationale: Huwasilisha kitendo cha kuwa mfalme kwa Kiswahili cha kawaida na cha heshima.
- source_word: כִּסְאִי
  choice: kiti changu cha ufalme
  rationale: ‘Kiti cha ufalme’ huonyesha wazi maana ya kifalme ya כִּסֵּא kuliko ‘kiti’ peke yake.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni desturi pana ya tafsiri za Biblia za Kiswahili na haitoi msimamo wa kimadhehebu; herufi kubwa huitofautisha na ‘Bwana wangu’.
- issue: Nguvu ya כִּי katika kiapo
  choice: Hakika
  alternative: kuiacha bila neno la kusisitiza
  rationale: Ushahidi wa chanzo unaruhusu maana ya kusisitiza katika nukuu ya kiapo, hivyo ‘Hakika’ huhifadhi uzito wake bila kuongeza fundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kifalme lakini kinachoeleweka kwa wasomaji wa kawaida. Tofauti kati ya ‘Bwana wangu’ na jina la Mungu ‘BWANA’ imehifadhiwa kwa matumizi ya herufi.
