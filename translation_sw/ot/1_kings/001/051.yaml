base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/051.yaml
  text: And it was reported to Solomon, saying, “Look, Adonijah fears King Solomon, and look, he has taken hold of the horns of the altar, saying, ‘Let King Solomon swear to me today that he will not put his servant to death with the sword.’”
translation:
  language: sw
  text: 'Sulemani akaambiwa hivi: “Tazama, Adonia anamwogopa Mfalme Sulemani; na tazama, ameshika pembe za madhabahu, akisema, ‘Mfalme Sulemani na aniapie leo kwamba hatamuua mtumishi wake kwa upanga.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לִשְׁלֹמֹה לֵאמֹר
  choice: Sulemani akaambiwa
  rationale: Hii ni njia ya asili na wazi ya Kiswahili ya kuwasilisha kauli tendwa ya Kiebrania pamoja na לֵאמֹר, bila kuongeza msemaji ambaye hajatajwa.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linaelekeza fikira kwenye habari ya kushangaza au muhimu; “Tazama” linadumisha msisitizo huo kwa lugha yenye hadhi.
- source_word: יָרֵא אֶת
  choice: anamwogopa
  rationale: Katika muktadha huu kitenzi ירא kinaonyesha hofu ya Adonia kwa mfalme, si ibada au heshima ya kidini.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: pembe za madhabahu
  rationale: Tafsiri hii ya moja kwa moja inadumisha maelezo ya kimwili na umuhimu wa kitamaduni wa sehemu hizo za madhabahu.
- source_word: יִשָּׁבַע לִי כַיּוֹם
  choice: na aniapie leo
  rationale: Kiswahili hiki kinaonyesha ombi la Adonia kwamba Sulemani afanye kiapo kwake siku hiyo.
- source_word: אִם יָמִית
  choice: kwamba hataniua
  rationale: אִם hutumika hapa katika kauli ya kiapo yenye maana hasi inayodokezwa; tafsiri hii inatoa maana ya Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: עַבְדּוֹ
  choice: mimi mtumishi wake
  rationale: Adonia anajitaja kwa nafsi ya tatu kama mtumishi wa mfalme; “mimi” hufanya rejeo hilo liwe wazi huku “mtumishi wake” ikihifadhi namna ya kujishusha.
theological_decisions:
- issue: Kushika pembe za madhabahu
  choice: Kauli imetafsiriwa moja kwa moja bila kueleza kuwa ni dai la hifadhi takatifu.
  alternative: Kuongeza maelezo kama “akitafuta hifadhi.”
  rationale: Mstari unasimulia tendo hilo lakini haufafanui moja kwa moja hadhi yake ya kisheria au kiteolojia; kuacha maelezo hayo nje kunazuia kuingiza hitimisho lisilotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umerahisishwa kwa usomaji wa kawaida, huku majina ya kifalme, taswira ya madhabahu, kiapo, na namna ya Adonia kujishusha vikihifadhiwa.
