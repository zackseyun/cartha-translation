base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/052.yaml
  text: And Solomon said[a], “If he proves to be a worthy man, not one of his hairs will fall to the ground; but if evil is found in him[b], he shall die.”
translation:
  language: sw
  text: Sulemani akasema, “Ikiwa atajionyesha kuwa mtu mwema[a], hata unywele wake mmoja hautaanguka chini[b]; lakini uovu ukipatikana ndani yake, atakufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mwana wa uhodari/nguvu.” Nahau hii ya Kiebrania inaweza kumaanisha mtu mwenye thamani, uwezo, au ushujaa kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Kauli “hata unywele wake mmoja hautaanguka chini” ni nahau inayomaanisha kwamba hatapata madhara yoyote.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן־חַיִל
  choice: mtu anayestahili
  rationale: Nahau hii, ambayo kihalisi ni ‘mwana wa uhodari/nguvu,’ hapa inaeleza mtu mwenye thamani, tabia inayofaa, au uwezo. ‘Mtu anayestahili’ hudokeza tathmini ya tabia bila kuifanya sentensi ihusu ushujaa wa kivita pekee.
- source_word: יִהְיֶה
  choice: atajionyesha kuwa
  rationale: Ingawa kitenzi kimsingi ni ‘atakuwa,’ sharti hili linahusu tabia itakayodhihirika katika mwenendo wake wa baadaye. ‘Atajionyesha kuwa’ huwasilisha nguvu hiyo ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: מִשַּׂעֲרָתוֹ
  choice: unywele wake mmoja
  rationale: Nomino ya Kiebrania ni ya umoja yenye maana ya jumla, ‘nywele zake.’ Kiswahili ‘unywele wake mmoja’ huunda nahau ya kawaida na kuhifadhi msisitizo kwamba hatapata madhara hata kidogo.
- source_word: לֹא יִפֹּל ... אָרְצָה
  choice: hata unywele wake mmoja hautaanguka chini
  rationale: Hii ni nahau ya kuhifadhiwa kabisa bila kupata madhara. Tafsiri inadumisha picha halisi ya Kiebrania huku ikiwa ya asili katika Kiswahili.
- source_word: רָעָה
  choice: uovu
  rationale: Neno lina maana pana ya uovu wa kimaadili katika mazingira haya ya hukumu. ‘Uovu’ huepuka kulibana kuwa kosa maalumu lisilotajwa.
- source_word: תִמָּצֵא בוֹ
  choice: ukipatikana ndani yake
  rationale: Muundo huu unaonyesha uovu ukigunduliwa kuwa umo kwake. ‘Ndani yake’ huhifadhi kwa karibu kihusishi cha Kiebrania bila kuamua kwa usahihi kosa lenyewe ni lipi.
- source_word: וָמֵת
  choice: atakufa
  rationale: Hili ndilo tokeo zito la uovu kugunduliwa kwake. ‘Atakufa’ huacha wazi kama kauli hiyo ni tangazo la matokeo au hukumu rasmi.
theological_decisions:
- issue: Asili ya uovu unaoweza kupatikana kwa Adoniya
  choice: uovu
  alternative: kosa au uhaini
  rationale: Kiebrania hakitaji kosa maalumu. Tafsiri pana ‘uovu’ huhifadhi kutokubainishwa huko na haiongezi tafsiri ya kisiasa au kisheria isiyosemwa wazi.
- issue: Nguvu ya kauli וָמֵת
  choice: atakufa
  alternative: lazima auawe
  rationale: Kiebrania kinatangaza kifo kama tokeo lakini hakitaji moja kwa moja mtendaji wala namna ya utekelezaji. ‘Atakufa’ huhifadhi uzito na pia utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masharti na picha ya unywele umehifadhiwa; tanbihi zimewekwa baada ya vifungu vinavyohusika, si baada ya kitenzi cha kusema au kifungu cha uovu.
