  text: וַ/עֲלִיתֶ֣ם אַחֲרָ֗י/ו וּ/בָא֙ וְ/יָשַׁ֣ב עַל כִּסְאִ֔/י וְ/ה֥וּא יִמְלֹ֖ךְ תַּחְתָּ֑/י וְ/אֹת֤/וֹ צִוִּ֨יתִי֙ לִֽ/הְי֣וֹת נָגִ֔יד עַל יִשְׂרָאֵ֖ל וְ/עַל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/035.yaml
  text: Then you shall go up after him[a], and he shall come and sit on my throne, and he shall reign in my place; and I have appointed him to be ruler over Israel and over Judah.
translation:
  language: sw
  text: Kisha mtapanda mkimfuata, naye atakuja na kuketi kwenye kiti changu cha enzi. Yeye atatawala mahali pangu; nami nimemteua awe mtawala[a] juu ya Israeli na juu ya Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimemwamuru awe mkuu/kiongozi juu ya Israeli na juu ya Yuda.” Kitenzi cha Kiebrania mara nyingi humaanisha “kuamuru,” na נָגִיד pia linaweza kutafsiriwa “mkuu” au “kiongozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלִיתֶם
  choice: mtapanda
  rationale: Kitenzi עלה kwa kawaida humaanisha kupanda au kwenda juu. Hapa kinaendeleza mfululizo wa maagizo kuhusu msafara wa kifalme bila kuongeza wazo lisilotajwa moja kwa moja.
- source_word: אַחֲרָיו
  choice: mkimfuata
  rationale: Kirai hiki kinaonyesha kwamba watu hao watakwenda nyuma ya Sulemani katika msafara. “Mkimfuata” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: וּבָא
  choice: atakuja
  rationale: בוא inaweza kumaanisha kuja au kuingia. “Atakuja” ndiyo tafsiri isiyoongeza maelezo, kwa kuwa sentensi inayofuata ndiyo inayoeleza atakachofanya.
- source_word: וְיָשַׁב עַל כִּסְאִי
  choice: kuketi kwenye kiti changu cha enzi
  rationale: Hii ni lugha ya kutawazwa na kurithi ufalme. “Kiti cha enzi” ni usemi unaoeleweka wazi kwa כסא katika muktadha wa kifalme.
- source_word: וְהוּא יִמְלֹךְ תַּחְתָּי
  choice: yeye atatawala mahali pangu
  rationale: תחת hapa inaonyesha kuchukua nafasi ya Daudi katika cheo cha kifalme. “Mahali pangu” huhifadhi wazo la urithi wa mamlaka bila kulifanya kuwa la wakati tu.
- source_word: צִוִּיתִי
  choice: nimemteua
  rationale: Ingawa צוה mara nyingi humaanisha kuamuru, katika muktadha huu tamko la Daudi linamweka Sulemani katika wadhifa. “Nimemteua” huwasilisha nguvu hiyo ya uteuzi; maana ya kawaida ya kuamuru imehifadhiwa katika tanbihi.
- source_word: לִהְיוֹת נָגִיד
  choice: awe mtawala
  rationale: נָגִיד humaanisha mkuu, kiongozi, au mtawala aliyewekwa juu ya watu. “Mtawala” ni neno la sasa na linaloeleweka, huku likitofautishwa na kitenzi מלך, “kutawala kama mfalme.”
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: juu ya Israeli na juu ya Yuda
  rationale: Kurudia “juu ya” kunaakisi kurudiwa kwa עַל katika Kiebrania na kusisitiza mamlaka yake juu ya kila upande uliotajwa.
theological_decisions:
- issue: Neno la cheo נָגִיד kwa uhusiano wake na ufalme
  choice: “mtawala” kwa נָגִיד, huku מלך likitafsiriwa “atatawala”
  alternative: “mkuu” au “kiongozi”
  rationale: Mstari unatumia maneno mawili tofauti kuhusu mamlaka ya kifalme. Kutumia “mtawala” kwa cheo נָגִיד hakulifanyi neno hilo kuwa sawa moja kwa moja na “mfalme,” na tanbihi huhifadhi uwezekano wa “mkuu” au “kiongozi.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kifalme “kiti cha enzi” umehifadhiwa, na sentensi zimegawanywa kwa ufasaha bila kuondoa mfululizo wa matendo katika Kiebrania.
