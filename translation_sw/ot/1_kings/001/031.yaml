base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/031.yaml
  text: Then Bathsheba bowed with her face to the ground and prostrated herself before the king[a], and said, “May my lord King David live forever.”
translation:
  language: sw
  text: Ndipo Bathsheba akainama, akaweka uso wake chini, akajisujudu mbele ya mfalme, akasema, “Bwana wangu, Mfalme Daudi, na aishi milele.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa mtindo wa kauli ya shangwe: “Aishi milele bwana wangu, Mfalme Daudi!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: akainama
  rationale: Kitenzi קָדַד kinaonyesha kuinama kwa heshima; “akainama” ni Kiswahili cha kawaida na hakibainishi mkao kupita ushahidi wa maandishi.
- source_word: אַפַּיִם אֶרֶץ
  choice: kifudifudi mpaka chini
  rationale: Nahau hii inaunganisha uso na ardhi ili kuonyesha kuinama kwa kina. “Kifudifudi mpaka chini” huwasilisha picha hiyo kwa Kiswahili cha asili bila kutumia tafsiri ngumu ya neno kwa neno.
- source_word: וַתִּשְׁתַּחוּ
  choice: akajisujudu
  rationale: Kitenzi שׁחה kinaonyesha kujilaza au kuinama sana kwa heshima. “Akajisujudu” hukitofautisha na kitendo cha kwanza na kudumisha uzito wa ishara hiyo.
- source_word: לַמֶּלֶךְ
  choice: mbele ya mfalme
  rationale: Ingawa לְ kwa msingi ni “kwa,” Kiswahili hutumia kwa kawaida “kujisujudu mbele ya” mtu katika muktadha wa heshima ya kifalme.
- source_word: יְחִי
  choice: na aishi
  rationale: Hali ya jussive inaonyesha ombi au heri. “Na aishi” hudumisha muundo huo badala ya kuugeuza moja kwa moja kuwa kauli ya mshangao.
- source_word: אֲדֹנִי
  choice: Bwana wangu
  rationale: Katika mazungumzo na mfalme, אֲדֹנִי ni cheo cha heshima; “Bwana wangu” ni tafsiri ya kawaida na yenye hadhi.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Mfalme Daudi
  rationale: Kiswahili huunganisha kwa kawaida cheo na jina kwa mpangilio “Mfalme Daudi,” huku kikihifadhi vipengele vyote vya Kiebrania.
- source_word: לְעֹלָם
  choice: milele
  rationale: Neno עוֹלָם hapa linaonyesha matakwa ya kudumu katika kauli ya heshima kwa mfalme; “milele” ni sawa ya kawaida na wazi.
theological_decisions:
- issue: Maana ya kujisujudu mbele ya mfalme
  choice: Imetafsiriwa kama ishara ya heshima ya kifalme bila kuongezwa lugha ya ibada.
  alternative: akamsujudia mfalme
  rationale: Katika muktadha huu tendo linaelekezwa kwa mfalme wa kibinadamu na linaweza kuonyesha heshima au utiifu; “mbele ya mfalme” huhifadhi tendo bila kulifanya kimakusudi kuwa dai la ibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kifalme lakini kinachoeleweka kwa wasomaji wa kawaida. Vitenzi viwili vya kuinama vimetofautishwa ili kuhifadhi msisitizo wa maandishi ya Kiebrania.
