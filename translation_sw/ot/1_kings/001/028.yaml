base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/028.yaml
  text: Then King David answered and said[a], “Call Bathsheba to me.” So she came before the king and stood before the king.
translation:
  language: sw
  text: Ndipo Mfalme Daudi akajibu[a] akasema, “Niitieni Bathsheba.” Basi akaja mbele ya mfalme, akasimama mbele ya mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaitikia.” Mfumo huu wa kawaida wa simulizi ya Kiebrania mara nyingi hutumia “akajibu” kuanzisha maneno ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: akajibu
  rationale: Kitenzi ענה katika simulizi kinaweza kumaanisha ‘kujibu’ au ‘kuitikia.’ ‘Akajibu’ kinahifadhi mtindo wa kawaida wa Kiebrania wa kuanzisha usemi, hata bila swali lililotangulia waziwazi.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Mfalme Daudi
  rationale: Huu ni mpangilio wa kawaida na wa asili wa cheo pamoja na jina katika Kiswahili.
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: אמר ni kitenzi cha kawaida cha kusema; ‘akasema’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: קִרְאוּ לִי
  choice: Niitieni
  rationale: Amri hii ya wingi ina maana ya kumwita au kumleta mtu kwa msemaji. ‘Niitieni’ ni ya asili katika Kiswahili na inadumisha uelekeo wa ‘kwangu.’
- source_word: לְבַת שָׁבַע
  choice: Bathsheba
  rationale: Jina limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili cha Biblia.
- source_word: וַתָּבֹא לִפְנֵי הַמֶּלֶךְ
  choice: akaja mbele ya mfalme
  rationale: בוא pamoja na לפני hueleza kuingia mbele ya mtu au katika uwepo wake; tafsiri hii ni wazi na ya karibu na chanzo.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: akasimama mbele ya mfalme
  rationale: ‘Akasimama’ hutafsiri עמד moja kwa moja. Kurudia ‘mbele ya mfalme’ kunahifadhi urudiaji wa Kiebrania unaoonyesha mazingira rasmi ya kifalme.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa ‘akajibu akasema’ umehifadhiwa ili kuonyesha fomula ya Kiebrania, na urudiaji wa ‘mbele ya mfalme’ umeachwa kwa sababu una umuhimu wa kimtindo katika mazingira ya ikulu.
