base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/032.yaml
  text: Then King David said, “Call Zadok the priest, Nathan the prophet, and Benaiah son of Jehoiada to me.” And they came before the king.
translation:
  language: sw
  text: Ndipo Mfalme Daudi akasema, “Niitieni Sadoki, kuhani, Nathani, nabii, na Benaya mwana wa Yehoyada.” Nao wakaja mbele ya mfalme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Waw ya masimulizi inaendeleza mfuatano wa matukio; “Ndipo” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Mfalme Daudi
  rationale: Muundo huu unamtambulisha Daudi kwa cheo chake cha kifalme; huu ndio mpangilio wa kawaida katika Kiswahili.
- source_word: קִרְאוּ לִי
  choice: Niitieni
  rationale: Amri ya wingi pamoja na kiwakilishi cha nafsi ya kwanza inaomba watu waitwe waje kwa msemaji; “Niitieni” ni fupi, ya asili, na huhifadhi maana hiyo.
- source_word: לְצָדוֹק הַכֹּהֵן
  choice: Sadoki kuhani
  rationale: Jina limetoholewa kwa matumizi ya kawaida ya Biblia ya Kiswahili, na cheo “kuhani” kinatafsiri כֹּהֵן kwa usahihi.
- source_word: וּלְנָתָן הַנָּבִיא
  choice: Nathani nabii
  rationale: Jina limetoholewa, huku “nabii” likitoa maana ya נָבִיא moja kwa moja.
- source_word: וְלִבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: na Benaya mwana wa Yehoyada
  rationale: Majina yametoholewa kwa Kiswahili, na “mwana wa” ni tafsiri ya kawaida ya utambulisho wa ukoo בֶּן.
- source_word: וַיָּבֹאוּ
  choice: Nao wakaja
  rationale: Huendeleza masimulizi na kuonyesha kwamba wale watu watatu waliotajwa ndio waliokuja.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: mbele ya mfalme
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuingia au kuwapo katika hadhira ya mfalme.
