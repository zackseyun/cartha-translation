base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/026.yaml
  text: But me—your servant—and Zadok the priest[a], and Benaiah son of Jehoiada, and Solomon your servant, he did not call.
translation:
  language: sw
  text: Lakini mimi, mtumishi wako, na kuhani Sadoki, na Benaya mwana wa Yehoyada, na Sulemani mtumishi wako, hakutualika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hakutuita” au “hajatuita.” Kitenzi cha Kiebrania kinaweza kumaanisha kuita, kuwaita watu waje, au kuwaalika; “kutualika” kinafaa katika muktadha wa karibu wa karamu ya dhabihu ya Adoniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי אֲנִי עַבְדֶּךָ
  choice: Lakini mimi, mtumishi wako
  rationale: Muundo uliowekwa mbele unasisitiza tofauti kati ya Nathani na wale walioalikwa; “lakini” huonyesha utofautishaji wa muktadha, huku “mtumishi wako” ikihifadhi lugha ya heshima ya kifalme.
- source_word: צָדֹק הַכֹּהֵן
  choice: kuhani Sadoki
  rationale: Hiki ni cheo dhahiri pamoja na jina; mpangilio huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya mwana wa Yehoyada
  rationale: Nasaba ya Kiebrania imetafsiriwa kwa muundo wa kawaida wa Kiswahili.
- source_word: שְׁלֹמֹה עַבְדְּךָ
  choice: Sulemani mtumishi wako
  rationale: Inahifadhi jina na maelezo ya heshima yanayoonyesha uhusiano wake na mfalme.
- source_word: לֹא קָרָא
  choice: hakutualika
  rationale: Kitenzi קרא kinaweza kumaanisha kuita, kuwaita waje, au kualika. Katika muktadha wa karamu ya dhabihu, “alika” ni ya asili; kiambishi “-tu-” kinakusanya watu waliotangulizwa kama yambwa wa kitenzi katika Kiswahili fasaha.
