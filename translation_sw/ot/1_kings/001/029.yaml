base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/029.yaml
  text: And the king swore and said[a], “As Yahweh lives, who has redeemed my life from every distress,”
translation:
  language: sw
  text: Kisha mfalme akaapa, akasema, “Kama Yahwe aishivyo, aliyekomboa maisha yangu[a] kutoka katika kila taabu,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi yangu.” Neno la Kiebrania nefesh linaweza kumaanisha nafsi, mtu mwenyewe, au maisha; hapa kwa kawaida linamaanisha maisha ya Daudi yaliyohifadhiwa katika hatari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: akaapa
  rationale: Kitenzi cha Kiebrania kina maana ya kuapa au kula kiapo; “akaapa” ni simulizi la Kiswahili lililo la moja kwa moja na la kawaida.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino hii ina kibainishi na inamtaja Daudi kwa cheo chake; tafsiri imehifadhi cheo badala ya kuingiza jina lake.
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: Hiki ni kitenzi cha kawaida cha kutambulisha maneno katika simulizi; “akasema” hakiongezi uzito usiokuwamo katika chanzo.
- source_word: חַי יְהוָה
  choice: Kama Yahwe aishivyo
  rationale: Hii ni kauli ya kawaida ya kiapo. Muundo huu wa Kiswahili huhifadhi maana ya kuapa kwa uhai wa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetolewa kwa umbo linalotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: פָּדָה
  choice: aliyekomboa
  rationale: Kitenzi hiki hubeba maana ya kukomboa au kuokoa kwa kuingilia kati. “Aliyekomboa” huhifadhi uzito wake na tendo lililokamilika.
- source_word: נַפְשִׁי
  choice: maisha yangu
  rationale: Katika muktadha wa kuokolewa na hatari, נֶפֶשׁ humaanisha uhai au maisha ya mtu, si lazima nafsi isiyo ya kimwili.
- source_word: מִכָּל צָרָה
  choice: kutoka katika kila taabu
  rationale: Kifungu hiki kinaeleza kukombolewa katika kila aina ya dhiki au shida; “kila taabu” ni Kiswahili cha kawaida kinachohifadhi upana wa כָּל.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina maalumu la Mungu. “Yahwe” huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Maana ya נַפְשִׁי katika muktadha huu
  choice: maisha yangu
  alternative: nafsi yangu; mimi mwenyewe
  rationale: Muktadha unahusu maisha ya Daudi yaliyohifadhiwa kutokana na hatari. Uchaguzi huu huepuka kuingiza dhana maalumu ya nafsi isiyo ya kimwili, huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi na umbo la neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye heshima. Muundo wa kiapo umehifadhiwa, na koma ya mwisho inaonyesha kuwa kauli inaendelea katika mstari unaofuata.
