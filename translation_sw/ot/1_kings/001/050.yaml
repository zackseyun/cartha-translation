base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/050.yaml
  text: And Adonijah was afraid because of Solomon[a], so he arose and went and took hold of the horns of the altar.
translation:
  language: sw
  text: Adoniya akamwogopa Sulemani; akainuka, akaenda, akazishika pembe za madhabahu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kushika pembe za madhabahu kulikuwa ishara ya kutafuta hifadhi au kuomba rehema mahali patakatifu.
    reason: cultural_note
lexical_decisions:
- source_word: יָרֵא מִפְּנֵי
  choice: akaogopa kwa sababu ya
  rationale: Muundo huu unaonyesha kwamba Sulemani ndiye aliyesababisha hofu ya Adoniya, huku ukihifadhi kwa uwazi maana ya kisababishi ya מִפְּנֵי katika muktadha huu.
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Ni kitenzi cha kawaida cha usimulizi kinachoonyesha kwamba Adoniya aliinuka ili kuchukua hatua iliyofuata.
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kitenzi cha mwendo katika mfululizo wa usimulizi.
- source_word: וַיַּחֲזֵק
  choice: akazishika
  rationale: Hueleza tendo la kuzishika pembe kwa nguvu au kwa uthabiti bila kuongeza wazo la vurugu ambalo halijaelezwa wazi.
- source_word: קַרְנוֹת
  choice: pembe
  rationale: Hifadhi istilahi halisi ya sehemu zilizochomoza kwenye pembe za madhabahu; maelezo ya umuhimu wa tendo hilo yanawekwa katika tanbihi.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hii ndiyo istilahi sanifu ya Kiswahili kwa מזבח katika muktadha wa ibada na dhabihu.
- source_word: וַאֲדֹנִיָּהוּ
  choice: Adoniya
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili, na mtiririko wa usimulizi umeendelezwa kwa viambishi vya mfululizo wa matendo.
theological_decisions:
- issue: Tendo la kutafuta hifadhi kwa kushika pembe za madhabahu
  choice: Tendo lenyewe limetafsiriwa moja kwa moja kuwa “akazishika pembe za madhabahu,” bila kufafanua kusudi lake katika matini kuu.
  alternative: “Akakimbilia madhabahuni kutafuta hifadhi.”
  rationale: Kiebrania kinataja tendo la kimwili, lakini hakisemi wazi katika mstari huu kwamba Adoniya alipewa hifadhi. Tanbihi inaeleza maana ya kitamaduni bila kuibadili matini kuwa ufafanuzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa usimulizi wa Biblia. “Kwa sababu ya Sulemani” huhifadhi maana ya kisababishi ya kishazi cha Kiebrania, na “pembe za madhabahu” huhifadhi taswira ya kiibada ya matini asilia.
