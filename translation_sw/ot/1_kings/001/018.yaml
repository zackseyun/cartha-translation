base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/018.yaml
  text: And now, look, Adonijah has become king, and now, my lord the king, you do not know it.
translation:
  language: sw
  text: Na sasa, tazama, Adoniya amekuwa mfalme, na sasa, bwana wangu mfalme, hujui jambo hilo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: tazama
  rationale: Neno hili linavuta fikira za msikilizaji kwenye hali ya kushangaza na ya dharura; “tazama” linaendeleza msisitizo huo kwa lugha yenye hadhi.
- source_word: מָלָךְ
  choice: amekuwa mfalme
  rationale: Kitenzi kinaeleza Adoniya kuchukua au kufikia cheo cha kifalme; tafsiri hii haiamui hapa ikiwa kutawazwa kwake kulikuwa halali.
- source_word: לֹא יָדָעְתָּ
  choice: hujui jambo hilo
  rationale: Huhifadhi kauli ya moja kwa moja kwamba mfalme hana habari kuhusu jambo lililotajwa, bila kuongeza sababu.
theological_decisions:
- issue: Uhalali wa ufalme wa Adoniya
  choice: amekuwa mfalme
  alternative: amejitangaza kuwa mfalme
  rationale: Chanzo kinasema tu kwamba Adoniya ametawala/amekuwa mfalme. “Amejitangaza” lingeongeza maelezo kuhusu namna na uhalali ambayo hayajasemwa wazi katika mstari huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. “Bwana wangu mfalme” huhifadhi namna ya heshima ya kumwambia mfalme. Kiunganishi “lakini” kinaonyesha mgongano wa kimuktadha kati ya tukio hilo na kutokujua kwa Daudi, huku marudio ya Kiebrania ya וְעַתָּה yakitolewa kwa mtiririko wa asili wa Kiswahili.
