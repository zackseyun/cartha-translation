base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/041.yaml
  text: Adonijah and all the invited guests who were with him heard it as they finished eating[a]. And when Joab heard the sound of the trumpet, he said[b], “Why is the sound of the city in an uproar?”
translation:
  language: sw
  text: Adoniya na waalikwa wote waliokuwa pamoja naye wakasikia walipokuwa wakimaliza kula[a]. Yoabu aliposikia sauti ya baragumu[b], akasema, “Kwa nini kuna makelele mengi hivyo mjini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mara tu walipomaliza kula.” Kirai cha Kiebrania kinaweza kueleweka kuwa kinaonyesha ama kukamilika kwa mlo ama wakati walipokuwa tu wakiumaliza.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania shofar, yaani baragumu ya pembe iliyotumiwa kutoa ishara hadharani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: wakasikia
  rationale: Kitenzi kinamaanisha ‘kusikia.’ Kiswahili hakihitaji kuongeza yambwa ‘hilo’; muktadha unaonyesha kwamba walisikia sauti iliyokuwa ikitoka mjini.
- source_word: הַקְּרֻאִים
  choice: waalikwa
  rationale: Hii ni kauli tendwa ya קרא katika muktadha wa karamu, hivyo ‘waalikwa’ ni tafsiri ya kawaida na iliyo wazi.
- source_word: וְהֵם כִּלּוּ לֶאֱכֹל
  choice: walipokuwa wakimaliza kula
  rationale: Muundo huu unaonyesha wakati waliposikia kelele, yaani wakati mlo ulikuwa ukifikia mwisho. Tanbihi huhifadhi uwezekano wa kuelewa kwamba walikuwa tayari wamemaliza.
- source_word: קוֹל הַשּׁוֹפָר
  choice: sauti ya baragumu
  rationale: שׁוֹפָר ni chombo cha kupulizwa kilichotengenezwa kwa pembe na kutumiwa kutoa ishara hadharani. ‘Baragumu’ ni neno la Kiswahili linaloeleweka vizuri katika muktadha huu.
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Hii ndiyo njia ya kawaida na ya moja kwa moja ya kuuliza sababu katika Kiswahili.
- source_word: קוֹל הַקִּרְיָה הוֹמָה
  choice: kuna makelele mengi hivyo mjini
  rationale: Kirai cha Kiebrania kinaeleza sauti yenye msukosuko au makelele kutoka mjini. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha wazo la kelele kubwa bila kuamua kimakosa kwamba zilikuwa za vurugu.
- source_word: אֲדֹנִיָּהוּ
  choice: Adoniya
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: יוֹאָב
  choice: Yoabu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
