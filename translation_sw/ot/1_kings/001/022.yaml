  yaml_path: translation/ot/1_kings/001/022.yaml
  text: And behold[a], while she was still speaking with the king, Nathan the prophet came in.
translation:
  language: sw
  text: Na tazama[a], alipokuwa bado akizungumza na mfalme, nabii Nathani akaingia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Tazama”; neno la Kiebrania linavuta fikira kwenye maendeleo mapya ya tukio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Kiashiria hiki cha mazungumzo kinavuta fikira kwenye tukio jipya la ghafla; “Na tazama” huhifadhi msisitizo huo kwa Kiswahili cha heshima.
- source_word: עוֹדֶנָּה מְדַבֶּרֶת
  choice: alipokuwa bado akizungumza
  rationale: Kielezi chenye kiambishi cha nafsi ya kike pamoja na kitenzi endelevu huonyesha kwamba kitendo cha mwanamke huyo kilikuwa bado kinaendelea wakati Nathani alipowasili.
- source_word: עִם הַמֶּלֶךְ
  choice: na mfalme
  rationale: Kihusishi עִם kimsingi ni “na/pamoja na”; hapa “akizungumza na mfalme” ni usemi wa kawaida wa Kiswahili unaodokeza mazungumzo ya moja kwa moja.
- source_word: וְנָתָן
  choice: Nathani
  rationale: Jina la Kiebrania limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: הַנָּבִיא
  choice: nabii
  rationale: Ni cheo kinachomtambulisha Nathani; Kiswahili hakihitaji kibainishi kinacholingana na “the” katika muktadha huu.
- source_word: בָּא
  choice: akaingia
  rationale: Kitenzi kinaweza kumaanisha kuja au kuingia; katika mazingira ya hadhira ya kifalme, “akaingia” huwasilisha kuwasili kwake ndani ya mahali walipokuwapo.
