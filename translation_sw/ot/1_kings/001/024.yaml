  text: Then Nathan said[a], “My lord the king, have you said, ‘Adonijah will reign after me, and he will sit on my throne’?”
translation:
  language: sw
  text: Ndipo Nathani akasema, “Bwana wangu mfalme, je, umesema[a], ‘Adoniya atatawala baada yangu, naye ataketi kwenye kiti changu cha enzi’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulisema.” Hali timilifu ya kitenzi cha Kiebrania katika swali hili inaweza kutafsiriwa kwa Kiswahili kama “umesema” au “ulisema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Muundo wa waw-consecutive unaendeleza mfululizo wa simulizi; “Ndipo” unaonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Bwana wangu mfalme
  rationale: Hii ni namna ya heshima ya kumwita Daudi; tafsiri inahifadhi kauli ya umilikaji pamoja na cheo cha kifalme.
- source_word: אַתָּה אָמַרְתָּ
  choice: je, umesema
  rationale: Kiwakilishi cha msisitizo na kitenzi katika hali timilifu vinafanya hili kuwa swali kuhusu kama Daudi mwenyewe ametoa kauli hiyo. “Umesema” huhifadhi vizuri hali timilifu, huku “ulisema” pia ikiwezekana.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonia
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: יִמְלֹךְ
  choice: atatawala
  rationale: Kitenzi kina maana ya kutawala au kuwa mfalme; “atatawala” ni cha moja kwa moja na cha kawaida katika muktadha wa urithi wa ufalme.
- source_word: אַחֲרָי
  choice: baada yangu
  rationale: Kirai hiki kinaonyesha urithi wa utawala kwa ufupi bila kuongeza ufafanuzi usiotajwa wazi.
- source_word: יֵשֵׁב עַל כִּסְאִי
  choice: ataketi kwenye kiti changu cha ufalme
  rationale: Kauli hii inahifadhi picha ya kuketi kwenye kiti cha mfalme na maana yake ya kuchukua mamlaka ya kifalme; “kiti cha ufalme” ni Kiswahili cha kawaida na kinachoeleweka.
