  text: But he did not invite Nathan the prophet[a], Benaiah, the mighty men, or Solomon his brother.
translation:
  language: sw
  text: Lakini hakumwalika nabii Nathani[a], Benaya, mashujaa, wala ndugu yake Sulemani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naye hakumwita nabii Nathani, Benaya, mashujaa, wala ndugu yake Sulemani.” Kitenzi cha Kiebrania kwa maana halisi ni “kuita”; hapa kinamaanisha kumwalika au kumwita mtu aje kwenye karamu ya Adoniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Lakini
  rationale: Kiunganishi kinaendeleza simulizi huku muktadha ukionyesha tofauti kati ya walioalikwa katika mstari uliotangulia na walioachwa hapa; “Lakini” huwasilisha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: נָתָן הַנָּבִיא
  choice: nabii Nathani
  rationale: Kiswahili kwa kawaida huweka cheo kabla ya jina; “Nathani” ni umbo la jina lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: וּבְנָיָהוּ
  choice: Benaya
  rationale: Jina limetoholewa kwa namna inayosomeka kwa Kiswahili na inayolingana na matumizi yaliyozoeleka.
- source_word: הַגִּבּוֹרִים
  choice: mashujaa
  rationale: Katika muktadha huu neno linataja watu mashuhuri kwa uhodari, hasa wapiganaji hodari wa Daudi; “mashujaa” ni fupi, asili, na linafaa kimuktadha.
- source_word: שְׁלֹמֹה אָחִיו
  choice: ndugu yake Sulemani
  rationale: Kiswahili asili huweka uhusiano wa kindugu kabla ya jina. Kiwakilishi “yake” kinamrejelea Adoniya kulingana na muktadha.
- source_word: לֹא קָרָא
  choice: hakumwalika
  rationale: Ingawa קרא kimsingi ni “ita,” katika muktadha wa karamu humaanisha kumwalika mtu. Tafsiri hii huwasilisha kitendo kilichokusudiwa kwa uwazi.
