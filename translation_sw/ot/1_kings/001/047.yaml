  text: וְ/גַם בָּ֜אוּ עַבְדֵ֣י הַ/מֶּ֗לֶךְ לְ֠/בָרֵךְ אֶת אֲדֹנֵ֜י/נוּ הַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ יֵיטֵ֨ב אלהי/ך אֶת שֵׁ֤ם שְׁלֹמֹה֙ מִ/שְּׁמֶ֔/ךָ וִֽ/יגַדֵּ֥ל אֶת כִּסְא֖/וֹ מִ/כִּסְאֶ֑/ךָ וַ/יִּשְׁתַּ֥חוּ הַ/מֶּ֖לֶךְ עַל הַ/מִּשְׁכָּֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/047.yaml
  text: And the king’s servants also came to bless our lord King David[a], saying, ‘May your God make Solomon’s name better than your name[b], and may he make his throne greater than your throne.’ And the king bowed himself on the bed.
translation:
  language: sw
  text: Tena, watumishi wa mfalme walikuja kumbariki bwana wetu, Mfalme Daudi, wakisema, “Mungu wako na alifanye jina la Sulemani kuwa bora kuliko jina lako[a], na akifanye kiti chake cha ufalme kuwa kikuu kuliko chako.” Kisha mfalme akainama juu ya kitanda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “jina” lina maana pia ya sifa au umaarufu wa mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “mfalme akaabudu juu ya kitanda.” Kitenzi cha Kiebrania kinaweza kumaanisha kuinama au kuabudu kulingana na muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Tena
  rationale: Inaonyesha kwamba jambo hili linaongezwa kwa taarifa iliyotangulia kwa Kiswahili cha kawaida.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: watumishi wa mfalme
  rationale: Katika mazingira ya ikulu, neno hili linaweza kumaanisha wahudumu au maofisa wa mfalme; “watumishi” linahifadhi upana huo.
- source_word: לְבָרֵךְ
  choice: kumbariki
  rationale: Linahifadhi maana ya kutamka baraka rasmi juu ya Daudi badala ya kuipunguza kuwa pongezi tu.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: bwana wetu, Mfalme Daudi
  rationale: Linahifadhi lugha ya heshima ya kifalme kwa mtindo wa asili wa Kiswahili.
- source_word: יֵיטֵב ... אֶת שֵׁם שְׁלֹמֹה מִשְּׁמֶךָ
  choice: alifanye jina la Sulemani kuwa bora kuliko jina lako
  rationale: Linawakilisha muundo wa kisababishi na ulinganisho wa Kiebrania huku likihifadhi taswira ya “jina.”
- source_word: וִיגַדֵּל אֶת כִּסְאוֹ מִכִּסְאֶךָ
  choice: akifanye kiti chake cha ufalme kuwa kikuu kuliko chako
  rationale: “Kiti cha ufalme” huwasilisha kiti halisi pamoja na mamlaka ya kifalme, na “kuwa kikuu kuliko” huhifadhi ulinganisho.
- source_word: וַיִּשְׁתַּחוּ
  choice: akainama
  rationale: Kitenzi cha Kiebrania kinaweza kueleza kuinama au kusujudu kwa ibada; “akainama” kinahifadhi tendo la mwili bila kulazimisha maana moja.
- source_word: עַל הַמִּשְׁכָּב
  choice: akiwa kitandani
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba tendo hilo lilifanyika akiwa juu ya kitanda.
theological_decisions:
- issue: Ikiwa וַיִּשְׁתַּחוּ inamaanisha wazi kuabudu au kuinama
  choice: mfalme akainama
  alternative: mfalme akaabudu / akasujudu
  rationale: Kifungu hakitaji wazi anayeelekezewa tendo hilo. Tafsiri inadumisha tendo la mwili na kuacha uwezekano wa ibada bila kuamua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifalme lakini kinachoeleweka kwa msomaji wa kawaida. “Bwana wetu” limetumiwa kama cheo cha heshima, na “kiti cha ufalme” huepuka utata wa “kiti” cha kawaida.
