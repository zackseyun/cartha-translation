base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/027.yaml
  text: If this thing has come from my lord the king[a], have you not made known to your servants who will sit on the throne of my lord the king after him?
translation:
  language: sw
  text: Ikiwa jambo hili limetoka kwa bwana wangu mfalme, je, hujawajulisha watumishi wako ni nani atakayeketi kwenye kiti cha enzi cha bwana wangu mfalme baada yake?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Je
  rationale: Katika muktadha huu אִם inaanzisha swali la moja kwa moja lenye nguvu ya masharti au mshangao. Kiswahili cha sasa hutumia “Je” kwa ufasaha bila kulazimisha tafsiri kuwa sharti halisi.
- source_word: מֵאֵת ... נִהְיָה
  choice: limetoka kwa
  rationale: Muungano huu unaonyesha chanzo au idhini ya jambo. “Limetoka kwa” huhifadhi wazo kwamba jambo hilo lilianzia kwa mfalme.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Hii ni namna ya heshima ya kumsemesha mfalme; “bwana wangu mfalme” ni ya kawaida, yenye hadhi, na inaendeleza utii wa msemaji.
- source_word: הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: דבר hapa inarejelea hatua au uamuzi unaohusu urithi wa ufalme. “Jambo hili” ni pana na la asili katika Kiswahili bila kulibainisha kupita kiasi.
- source_word: וְלֹא הוֹדַעְתָּ
  choice: nawe hukuwajulisha
  rationale: Hifili ya ידע ina maana ya kufanya wajue au kuwajulisha. Umbo hili la Kiswahili linafaa kwa swali la kukemea kwa heshima.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika mazingira ya ikulu, neno hili ni namna ya kujitaja kwa unyenyekevu mbele ya mfalme; “watumishi” linaonyesha huduma na hadhi ya chini bila kusisitiza utumwa wa mali.
- source_word: מִי יֵשֵׁב
  choice: ni nani atakayeketi
  rationale: Tafsiri hii huhifadhi kitenzi halisi cha kuketi na taswira ya kurithi mamlaka, badala ya kukifupisha kuwa “kutawala.”
- source_word: עַל כִּסֵּא
  choice: kwenye kiti cha ufalme cha
  rationale: “Kiti cha ufalme” ni usemi wazi na wa kawaida kwa כִּסֵּא katika muktadha wa kifalme; “kwenye” huleta Kiswahili cha asili.
- source_word: אַחֲרָיו
  choice: baada yake
  rationale: Hurejelea mfuatano wa kifalme baada ya mfalme aliyepo na huhifadhi maana ya moja kwa moja bila kuongeza “mahali pake.”
theological_decisions:
- issue: Maana ya עבד katika kujitaja kwa maofisa wa ikulu
  choice: watumishi wako
  alternative: watumwa wako
  rationale: Hapa neno hilo ni kauli ya kawaida ya heshima na unyenyekevu mbele ya mfalme. “Watumishi” huwasilisha uhusiano wa kiutawala unaokusudiwa bila kuingiza dai lisilo la lazima kuhusu hali ya utumwa.
- issue: Nguvu ya אִם mwanzoni mwa swali
  choice: Je
  alternative: Ikiwa
  rationale: Ingawa אִם kwa kawaida humaanisha “ikiwa,” hapa sentensi nzima ni swali la Nathani kuhusu kama jambo hilo lilitoka kwa mfalme. “Je” huhifadhi hali ya kuhoji na kutokuamua jibu, huku ikitoa Kiswahili cha asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya mazungumzo ya ikulu. Mpangilio wa swali umefanywa wa asili kwa Kiswahili huku marudio ya “bwana wangu mfalme” na taswira ya kuketi kwenye kiti cha ufalme yakihifadhiwa.
