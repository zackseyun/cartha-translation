  source_fidelity: 'Tafsiri inafuata maana ya Kiebrania kwa ujumla: watumishi wanapendekeza kutafutwa kwa kijana bikira ili amhudumie mfalme, alale kifuani mwake, na mfalme apate joto. Hata hivyo, ukanushi wa wakati katika “Naye amhudumie” hauendani vyema na msururu wa mapendekezo ya jussive; pia “mwanamke kijana” si mpangilio wa kawaida wa Kiswahili Sanifu.'
