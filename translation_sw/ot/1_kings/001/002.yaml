base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/002.yaml
  text: So his servants said to him[a], “Let them seek for my lord the king a young virgin woman, and let her attend the king and be his caregiver, and let her lie in your bosom[c][b], so that my lord the king may be warm.”
translation:
  language: sw
  text: Watumishi wake wakamwambia, “Waende wakamtafute kwa ajili ya bwana wangu mfalme mwanamke mchanga, bikira; naye ahudumu mbele ya mfalme[a] na awe mlezi wake[b], na alale kifuani pako[c], ili bwana wangu mfalme apate joto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “asimame mbele ya mfalme”; nahau hii ya Kiebrania inaweza kumaanisha kumhudumia au kusubiri mbele ya mtu.
    reason: lexical_alternative
  - marker: b
    text: Au “mhudumu” au “muuguzi.” Neno la Kiebrania ni adimu na humaanisha mtu anayemtunza au kumhudumia mwingine.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kifuani pako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika mazingira ya ikulu, neno hili linaweza kumaanisha watumishi au wahudumu wa kifalme; ‘watumishi’ ni la kawaida na halilazimishi maana ya utumwa.
- source_word: יְבַקְשׁוּ
  choice: Na watafute
  rationale: Huhifadhi pendekezo la nafsi ya tatu wingi katika Kiebrania badala ya kulibadili kuwa ‘na tutafute’.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: kwa ajili ya bwana wangu mfalme
  rationale: Huhifadhi namna ya heshima ya kifalme pamoja na kiwakilishi cha nafsi ya kwanza katika ‘bwana wangu’.
- source_word: נַעֲרָה בְתוּלָה
  choice: mwanamke kijana aliye bikira
  rationale: 'Huwakilisha wazi vipengele vyote viwili: ujana wake na ubikira wake.'
- source_word: וְעָמְדָה לִפְנֵי הַמֶּלֶךְ
  choice: Naye amhudumie mfalme
  rationale: Nahau ya Kiebrania, kihalisi ‘asimame mbele ya mfalme,’ hapa inaelekea kumaanisha kuhudumu mbele yake; tafsiri hii ni ya asili katika Kiswahili.
- source_word: סֹכֶנֶת
  choice: mlezi wake
  rationale: Neno hili adimu humaanisha mtu anayemtunza au kumhudumia mwingine; ‘mlezi’ linafaa katika muktadha wa kumtunza mfalme mzee bila kuingiza maana ya kingono.
- source_word: וְשָׁכְבָה בְחֵיקֶךָ
  choice: na alale kifuani pako
  rationale: Huhifadhi taswira halisi ya חֵיק na ukaribu wa kimwili uliokusudiwa kumpa mfalme joto.
- source_word: וְחַם
  choice: ili bwana wangu mfalme apate joto
  rationale: ‘Ili’ huonyesha kwa kawaida kusudi au matokeo yaliyokusudiwa katika Kiswahili.
