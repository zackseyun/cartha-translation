base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/007.yaml
  text: And he conferred with Joab son of Zeruiah and with Abiathar the priest[a], and they helped Adonijah.
translation:
  language: sw
  text: Naye akashauriana na Yoabu mwana wa Seruya na Abiathari kuhani, nao wakamsaidia Adoniya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa karibu, “walisaidia nyuma ya Adoniya”; usemi huu unamaanisha kwamba walimfuata au walimuunga mkono.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבָרָיו עִם
  choice: akafanya shauri na
  rationale: Kirai cha Kiebrania, kihalisi ‘maneno yake yalikuwa pamoja na,’ katika muktadha huu kinaonyesha kuwasiliana na kushauriana kuhusu mpango. ‘Akafanya shauri na’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuongeza maelezo yasiyokuwamo.
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: Yoabu mwana wa Seruya
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili, na uhusiano wa kifamilia umehifadhiwa.
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: Abiathari kuhani
  rationale: Cheo maalumu cha Abiathari kimehifadhiwa kwa neno la kawaida ‘kuhani’; katika Kiswahili, muundo huu unamtambulisha kwa kawaida bila kulazimisha matumizi ya ‘yule kuhani.’
- source_word: וַיַּעְזְרוּ
  choice: wakamsaidia
  rationale: Kitenzi עזר humaanisha kusaidia au kutoa msaada. Tafsiri hii ni ya moja kwa moja na haifafanui kupita kiasi aina ya msaada.
- source_word: אַחֲרֵי אֲדֹנִיָּה
  choice: Adoniya
  rationale: Baada ya kitenzi ‘kusaidia,’ kihusishi אַחֲרֵי (‘baada ya/nyuma ya’) kinatumiwa kwa maana ya kumfuata au kumuunga mtu mkono. Kiswahili cha kawaida kinahitaji kulainisha kirai kuwa ‘wakamsaidia Adoniya’; umbo la karibu zaidi na Kiebrania limeelezwa katika tanbihi.
