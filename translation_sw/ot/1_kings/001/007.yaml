translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa urahisi. ‘Akafanya shauri na’ limetumiwa kuwasilisha nahau ya Kiebrania kwa ufasaha, huku ‘wakamsaidia’ ikihifadhi kitenzi cha chanzo na tanbihi ikionyesha maana ya kihusishi kilichofichika katika tafsiri laini.
