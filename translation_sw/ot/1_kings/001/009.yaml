  text: וַ/יִּזְבַּ֣ח אֲדֹנִיָּ֗הוּ צֹ֤אן וּ/בָקָר֙ וּ/מְרִ֔יא עִ֚ם אֶ֣בֶן הַזֹּחֶ֔לֶת אֲשֶׁר אֵ֖צֶל עֵ֣ין רֹגֵ֑ל וַ/יִּקְרָ֗א אֶת כָּל אֶחָי/ו֙ בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/כָל אַנְשֵׁ֥י יְהוּדָ֖ה עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/009.yaml
  text: Adonijah sacrificed sheep[a], cattle, and fattened animals by the stone of Zoheleth, which is beside En-rogel, and he invited all his brothers, the king’s sons, and all the men of Judah[e][d][c][b], the king’s servants.
translation:
  language: sw
  text: Adoniya akatoa dhabihu za kondoo[a], ng’ombe, na wanyama waliononeshwa[b] karibu na jiwe la Zohelethi[c], lililo kando ya En-Rogeli. Akawaalika[d] ndugu zake wote, yaani wana wa mfalme, na wanaume wote wa Yuda[e], watumishi wa mfalme[f].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza kumaanisha mifugo midogo kwa ujumla, yaani kondoo na mbuzi.
    reason: lexical_alternative
  - marker: b
    text: Au “mifugo iliyonona”; neno la Kiebrania halitaji ndama pekee.
    reason: lexical_alternative
  - marker: c
    text: Zohelethi ni jina la mahali; maana yake kamili haina uhakika.
    reason: cultural_note
  - marker: d
    text: Au “akawaita” au “akawaita waje.”
    reason: lexical_alternative
  - marker: e
    text: Au “watu wote wa Yuda,” ingawa Kiebrania kinasema “wanaume wa Yuda.”
    reason: lexical_alternative
  - marker: f
    text: “Watumishi wa mfalme” huenda walikuwa wahudumu wa ikulu au maafisa wa kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: akachinja dhabihu
  rationale: Kitenzi זבח hapa kinaonyesha kuchinja kwa kusudi la dhabihu na karamu; usemi huu unahifadhi maana ya kiibada na unasikika kwa kawaida katika Kiswahili.
- source_word: צֹאן
  choice: kondoo
  rationale: Neno la Kiebrania linaweza kumaanisha mifugo midogo, yaani kondoo na mbuzi; “kondoo” ni tafsiri fupi na ya kawaida, huku tanbihi ikihifadhi upana wa maana.
- source_word: בָקָר
  choice: ng’ombe
  rationale: Hili ni neno la jumla kwa mifugo ya jamii ya ng’ombe, na “ng’ombe” ni sawa ya asili katika Kiswahili.
- source_word: מְרִיא
  choice: wanyama waliononeshwa
  rationale: Neno hili halitaji ndama pekee, bali wanyama waliolishwa ili wanene kwa ajili ya tukio maalumu; tafsiri hii huepuka kulifanya kuwa mahususi kupita chanzo.
- source_word: עִם אֶבֶן הַזֹּחֶלֶת
  choice: karibu na jiwe la Zohelethi
  rationale: Kihusishi kinafanya kazi ya kuonyesha mahali hapa. Jina Zohelethi limetoholewa kwa kuwa ni jina la mahali na maana yake kamili haina uhakika.
- source_word: עֵין רֹגֵל
  choice: En-Rogeli
  rationale: Ni jina maalumu la mahali, hivyo limetoholewa badala ya kutafsiriwa kama maelezo ya chemchemi.
- source_word: וַיִּקְרָא
  choice: akawaalika
  rationale: Katika muktadha wa karamu ya dhabihu, kuita huku ni mwaliko wa kuhudhuria, ingawa maana ya moja kwa moja ya “akawaita” imeonyeshwa katika tanbihi.
- source_word: אֶת כָּל אֶחָיו בְּנֵי הַמֶּלֶךְ
  choice: ndugu zake wote, yaani wana wa mfalme
  rationale: “Yaani” linaonyesha wazi kwamba “wana wa mfalme” ni maelezo ya ndugu waliotajwa, huku marudio ya chanzo yakihifadhiwa.
- source_word: אַנְשֵׁי יְהוּדָה
  choice: wanaume wote wa Yuda
  rationale: Kiebrania kinataja wanaume kwa wazi; tafsiri imehifadhi jinsia ya usemi badala ya kuipanua kimya kimya kuwa watu wote.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: waliokuwa watumishi wa mfalme
  rationale: Kirai hiki kinaeleza wanaume wa Yuda waliotajwa. “Watumishi” ni tafsiri ya moja kwa moja, ingawa katika mazingira ya kifalme huenda walikuwa maafisa au wahudumu wa ikulu.
theological_decisions:
- issue: Lugha yenye jinsia katika אַנְשֵׁי יְהוּדָה
  choice: wanaume wote wa Yuda
  alternative: watu wote wa Yuda
  rationale: Nomino ya Kiebrania ni ya kiume na katika muktadha huu yaelekea inawarejelea wanaume waliokuwa watumishi wa kifalme. Tafsiri haibadili jambo hilo kuwa kundi lisilo na jinsia, lakini tanbihi inataja uwezekano wa maana pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Akachinja dhabihu” huhifadhi uzito wa kiibada; majina Adoniya, Zohelethi, na En-Rogeli yametoholewa kwa tahajia inayosomeka kwa Kiswahili. Muundo wa “yaani wana wa mfalme” unaweka wazi uhusiano wa kirai bila kuondoa msisitizo wa Kiebrania.
