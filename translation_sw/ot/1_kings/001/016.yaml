  yaml_path: translation/ot/1_kings/001/016.yaml
  text: Bathsheba bowed down and prostrated herself before the king[a], and the king said, “What do you want?”
translation:
  language: sw
  text: Bathsheba akainama na kujisujudu mbele ya mfalme, naye mfalme akasema, “Unataka nini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: akainama
  rationale: Kitenzi קָדַד kinaonyesha kuinama chini. ‘Akainama’ ni Kiswahili cha kawaida kinachohifadhi tendo hilo bila kudai kwamba alipiga magoti.
- source_word: בַּת שֶׁבַע
  choice: Bathsheba
  rationale: Jina limetolewa kwa tahajia inayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וַתִּשְׁתַּחוּ
  choice: na kujisujudu
  rationale: Umbo la שׁחה linaonyesha kujilaza au kuinama sana kwa heshima. ‘Kujisujudu’ hulitofautisha na tendo la kwanza na kuhifadhi mfululizo wa ishara mbili za heshima.
- source_word: לַמֶּלֶךְ
  choice: mbele ya mfalme
  rationale: Katika muktadha wa tendo la heshima, לַמֶּלֶךְ hutolewa kwa Kiswahili cha kawaida kama ‘mbele ya mfalme.’
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: naye mfalme akamuuliza
  rationale: Ingawa kwa umbo ni ‘mfalme akasema,’ maneno yanayofuata ni swali; ‘akamuuliza’ ni Kiswahili cha asili kinachowasilisha kazi ya kauli bila kupoteza maana.
- source_word: מַה לָּךְ
  choice: Unataka nini?
  rationale: Nahau hii kihalisi ni ‘Kuna nini kwako?’ Katika muktadha huu ni swali la heshima kuhusu ombi lake, na ‘Unataka nini?’ ni tafsiri ya moja kwa moja na ya kawaida.
