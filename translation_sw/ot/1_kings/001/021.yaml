id: 1KI.1.21
reference: 1 Kings 1:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֕ה כִּ/שְׁכַ֥ב אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ עִם אֲבֹתָ֑י/ו וְ/הָיִ֗יתִי אֲנִ֛י וּ/בְנִ֥/י שְׁלֹמֹ֖ה חַטָּאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/021.yaml
  text: And when my lord the king lies down with his fathers[a], I and my son Solomon will be counted as offenders.
translation:
  language: sw
  text: Basi, bwana wangu mfalme atakapolala pamoja na mababu zake, mimi na mwanangu Sulemani tutahesabiwa kuwa wakosaji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye dhambi.” Neno la Kiebrania linaweza kumaanisha watu wanaoonwa kuwa na hatia au wanaostahili kulaumiwa; hapa muktadha unaelekea zaidi kwenye hadhi ya kisiasa na kisheria kuliko maelezo ya jumla kuhusu maadili yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Basi, ... tuta-
  rationale: Muundo huu unaonyesha matokeo yanayotarajiwa katika hofu ya Bathsheba kwa Kiswahili cha kawaida, bila kutafsiri kwa ugumu kuwa ‘na itakuwa.’
- source_word: כִּשְׁכַב
  choice: atakapolala
  rationale: Neno שׁכב pamoja na ‘mababu zake’ ni nahau ya kifo. ‘Atakapolala’ huhifadhi taswira ya Kiebrania na muktadha huonyesha maana yake.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Huhifadhi heshima ya usemi wa ikulu ambao Bathsheba anamwelekezea Daudi.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na mababu zake
  rationale: Huhifadhi nahau ya kuungana na waliotangulia kufa, huku ‘mababu’ ikiwa ya asili na kueleweka katika Kiswahili cha sasa.
- source_word: וְהָיִיתִי אֲנִי
  choice: mimi ... tutahesabiwa kuwa
  rationale: Ingawa kitenzi ni ‘kuwa,’ katika muktadha huu kinaeleza hadhi ambayo Bathsheba na Sulemani wangepewa. ‘Tutahesabiwa kuwa’ huwasilisha maana hiyo bila kudai kwamba kweli walikuwa na hatia.
- source_word: וּבְנִי שְׁלֹמֹה
  choice: na mwanangu Sulemani
  rationale: Tafsiri ya moja kwa moja inayohifadhi uhusiano wa kifamilia na jina.
- source_word: חַטָּאִים
  choice: wakosaji
  rationale: Katika mgogoro wa urithi wa ufalme, neno linaweza kumaanisha watu wanaochukuliwa kuwa na hatia au wanaostahili adhabu. ‘Wakosaji’ huhifadhi upana huo kuliko ‘wahalifu,’ ambalo lingesisitiza mno kosa la jinai.
theological_decisions:
- issue: Je, חַטָּאִים inaeleza dhambi ya kimaadili au hadhi ya kisiasa-kisheria?
  choice: wakosaji
  alternative: wenye dhambi
  rationale: Maana ya msingi ya neno inayohusiana na kosa imehifadhiwa, lakini muktadha wa kugombania ufalme unaelekea kwenye hadhi ya kulaumiwa na kuadhibiwa. Uwezekano wa maana ya ‘wenye dhambi’ umewekwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima inayofaa mazungumzo ya ikulu lakini kinachoeleweka kwa msomaji wa kawaida. Nahau ya Kiebrania ya kulala pamoja na mababu imehifadhiwa; tanbihi imewekwa baada ya neno inalolifafanua.
