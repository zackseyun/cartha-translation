  text: Jonathan answered and said to Adonijah[a], “On the contrary, our lord King David has made Solomon king.”
translation:
  language: sw
  text: Yonathani akamjibu Adoniya akisema, “Kinyume chake,[a] bwana wetu, Mfalme Daudi, amemfanya Sulemani kuwa mfalme.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini bwana wetu, Mfalme Daudi, amemfanya Sulemani kuwa mfalme.” Neno la Kiebrania אֲבָל pia linaweza kutafsiriwa “lakini,” ingawa hapa lina nguvu ya kusahihisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Kitenzi ענה katika mtiririko huu wa kisimulizi huonyesha jibu katika mazungumzo; “akamjibu” ni Kiswahili cha kawaida na pia huweka wazi anayejibiwa.
- source_word: וַיֹּאמֶר
  choice: akisema
  rationale: אמר ni kitenzi cha kawaida cha kusema. “Akamjibu ... akisema” huhifadhi vitenzi vyote viwili vya Kiebrania kwa mtindo wa Kiswahili unaoeleweka.
- source_word: לַאֲדֹנִיָּהוּ
  choice: Adoniya
  rationale: Kiambishi ל kinaonyeshwa na yambwa katika “akamjibu,” na jina la mtu limetoholewa kwa namna inayosomeka kwa Kiswahili.
- source_word: אֲבָל
  choice: Kinyume chake
  rationale: Katika muktadha huu אֲבָל inasahihisha matarajio ya Adoniya kwa nguvu; “Kinyume chake” huleta wazi nguvu hiyo, huku uwezekano wa tafsiri rahisi “Lakini” ukihifadhiwa katika tanbihi.
- source_word: אֲדֹנֵינוּ
  choice: bwana wetu
  rationale: Neno hili humaanisha bwana au mkuu; katika mazingira ya kifalme “bwana wetu” ni la heshima na linaendana na jina la cheo linalofuata.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Mfalme Daudi
  rationale: Mpangilio huu wa cheo na jina ni wa kawaida na wa asili katika Kiswahili.
- source_word: הִמְלִיךְ אֶת שְׁלֹמֹה
  choice: amemfanya Sulemani kuwa mfalme
  rationale: Hifili ya מלך ina maana ya kumsababisha mtu awe mfalme au kumweka katika ufalme. Tafsiri hii haiingizi maana mahususi zaidi ya “kumtia mafuta” ambayo kitenzi chenyewe hakisemi.
