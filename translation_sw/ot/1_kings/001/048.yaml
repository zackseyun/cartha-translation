base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/048.yaml
  text: 'And the king also said thus: ‘Blessed be Yahweh[a], the God of Israel, who today has given one to sit on my throne, and my eyes see it.’'
translation:
  language: sw
  text: 'Pia mfalme alisema hivi: “Abarikiwe Yahweh, Mungu wa Israeli, ambaye leo amemweka mtu kwenye kiti changu cha enzi, nami ninashuhudia kwa macho yangu.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye leo amemweka mtu akae kwenye kiti changu cha enzi, nami ninashuhudia kwa macho yangu.” Kiebrania hutumia kitenzi-shirikishi, ambacho kinaweza kueleza mtu anayeketi au matokeo ya yeye kuwekwa kuketi. Pia hakitaji wazi tukio analoshuhudia mfalme; muktadha hulionyesha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּכָה
  choice: Pia ... hivi
  rationale: “Pia” huhifadhi maana ya nyongeza, na “hivi” huelekeza mbele kwenye maneno yaliyonukuliwa kwa Kiswahili cha kawaida.
- source_word: בָּרוּךְ
  choice: Abarikiwe
  rationale: Ni namna ya kawaida na yenye hadhi ya kuwasilisha kauli ya sifa au baraka kwa Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja katika Kiebrania; limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huwasilisha kwa uwazi muundo wa Kiebrania na ni usemi wa kawaida katika Kiswahili.
- source_word: אֲשֶׁר נָתַן הַיּוֹם יֹשֵׁב
  choice: ambaye leo ametoa mtu wa kuketi
  rationale: “Ametoa” huhifadhi maana ya kawaida ya נתן, huku “mtu wa kuketi” ikiwakilisha kitenzi-shirikishi cha Kiebrania bila kutaja jina ambalo halipo katika mstari huu.
- source_word: עַל כִּסְאִי
  choice: kwenye kiti changu cha enzi
  rationale: “Kiti cha enzi” ndiyo maana ya kifalme ya כִּסֵּא katika muktadha huu; “kwenye” ni ya asili katika Kiswahili cha sasa.
- source_word: וְעֵינַי רֹאוֹת
  choice: na macho yangu yanaona
  rationale: Huhifadhi kiunganishi na hali endelevu ya kitenzi-shirikishi, pia huacha kitu kinachoonekana bila kutajwa kama ilivyo katika Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu lenye herufi nne; “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Kumtambulisha anayeketi kwenye kiti cha enzi
  choice: mtu wa kuketi
  alternative: Solomoni
  rationale: Mstari huu haumtii mtu huyo jina; kutotaja “Solomoni” kunahifadhi namna ya usemi wa chanzo na kunazuia kuingiza ufafanuzi wa muktadha ndani ya matini.
- issue: Kitu kinachoonekana na macho ya mfalme
  choice: kimeachwa bila kutajwa
  alternative: na macho yangu yanaliona jambo hilo
  rationale: Kiebrania hakitaji yambwa la kitenzi “yanaona”; kuacha wazi kunahifadhi mvutano na upekee wa kisintaksia wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kifalme lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “macho yangu yanaona” umehifadhiwa kwa makusudi ili kutotaja yambwa ambalo halipo katika Kiebrania.
