  naturalness: «Abarikiwe Yahweh» ni ya asili na ya hadhi inayofaa. «Amemweka mtu kwenye kiti changu cha enzi» na «nami ninashuhudia kwa macho yangu» ni za kawaida, zenye hadhi ya simulizi, na huwasilisha maana ya mfalme kushuhudia tukio hilo yeye mwenyewe.
  terminology: Yahweh, Mungu wa Israeli, na kiti cha enzi ni istilahi sahihi na thabiti. «Kumweka ... kwenye kiti cha enzi» hueleza kwa Kiswahili matokeo ya נתן pamoja na kitenzi-shirikishi יֹשֵׁב bila kutaja Solomoni.
