id: 1KI.1.39
reference: 1 Kings 1:39
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקַּח֩ צָד֨וֹק הַ/כֹּהֵ֜ן אֶת קֶ֤רֶן הַ/שֶּׁ֨מֶן֙ מִן הָ/אֹ֔הֶל וַ/יִּמְשַׁ֖ח אֶת שְׁלֹמֹ֑ה וַֽ/יִּתְקְעוּ֙ בַּ/שּׁוֹפָ֔ר וַ/יֹּֽאמְרוּ֙ כָּל הָ/עָ֔ם יְחִ֖י הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/039.yaml
  text: Then Zadok the priest took the horn of oil from the tent and anointed Solomon[a]. Then they blew the ram’s horn, and all the people said[b], “Long live King Solomon!”
translation:
  language: sw
  text: Kisha kuhani Sadoki akachukua pembe ya mafuta kutoka hemani[a], akamtia Sulemani mafuta. Kisha wakapiga pembe ya kondoo dume[b], na watu wote wakasema, “Mfalme Sulemani na aishi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika hema la ibada”; Kiebrania kinasema tu “kutoka hemani.”
    reason: alternative_reading
  - marker: b
    text: Au, “wakapiga baragumu”; Kiebrania shofar, baragumu iliyotengenezwa kwa pembe, mara nyingi pembe ya kondoo dume.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Huwasilisha kwa kawaida tendo linalofuata katika simulizi na maana ya msingi ya לקח.
- source_word: צָדוֹק הַכֹּהֵן
  choice: kuhani Sadoki
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili, huku ukihifadhi jina na cheo chake.
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: pembe ya mafuta
  rationale: Huhifadhi taswira halisi ya chombo cha mafuta kilichotengenezwa kwa pembe, bila kukibadili kuwa chupa.
- source_word: מִן הָאֹהֶל
  choice: kutoka hemani
  rationale: אֹהֶל humaanisha kwa msingi ‘hema’; tafsiri hii haiongezi umahususi usiotajwa wazi katika Kiebrania.
- source_word: וַיִּמְשַׁח
  choice: akamtia Sulemani mafuta
  rationale: Ni usemi wa kawaida na unaoeleweka wa Kiswahili kwa tendo la kumweka wakfu mfalme kwa mafuta.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: wakapiga pembe ya kondoo dume
  rationale: Hueleza kwa lugha ya kawaida chombo cha pembe kinachoitwa shofar, badala ya kutumia jina la kigeni lisiloeleweka kwa wengi.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi hali ya shangwe ya hadhara nzima.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: Mfalme Sulemani na aishi!
  rationale: Huhifadhi muundo wa tamko la matamanio katika Kiebrania na ni kauli ya heshima ya kifalme inayoeleweka katika Kiswahili.
theological_decisions:
- issue: Umahususi wa הָאֹהֶל katika mazingira ya kutiwa mafuta kwa mfalme
  choice: hema
  alternative: hema la ibada
  rationale: Kiebrania kinatumia nomino ya kawaida ‘hema’ yenye kibainishi. Ingawa huenda kinachorejelewa ni hema la patakatifu, matini kuu haiongezi umahususi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Viambishi vya mfululizo ‘aka-/waka-’ vinadumisha mwendo wa simulizi. Alama za tanbihi zimewekwa karibu na maneno yanayohusika; mpangilio wake umesahihishwa dhidi ya kutolingana kwa alama katika safu ya ushauri ya Kiingereza.
