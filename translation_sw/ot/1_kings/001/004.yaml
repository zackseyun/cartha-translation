base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/004.yaml
  text: The young woman was very beautiful[a], and she became the king’s attendant and served him, but the king did not know her.
translation:
  language: sw
  text: Mwanamke huyo mchanga alikuwa mrembo sana. Akawa msaidizi wa mfalme, akamhudumia; lakini mfalme hakumjua[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, hakufanya naye tendo la ndoa. Kitenzi cha Kiebrania cha “kujua” kimetumiwa hapa kama msemo wa staha kuhusu mahusiano ya kingono.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: msichana huyo
  rationale: Neno נַעֲרָה humaanisha mtu wa kike aliye kijana. “Msichana” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa bila kutumia “mwanamwali,” ambalo linaweza kusikika la kale au kudokeza zaidi ya maandishi.
- source_word: יָפָה עַד מְאֹד
  choice: alikuwa mzuri sana
  rationale: Kirai hiki kinakazia uzuri wake kwa nguvu; “mzuri sana” ni Kiswahili cha kawaida kinachohifadhi mkazo huo.
- source_word: סֹכֶנֶת
  choice: mhudumu
  rationale: Neno hili linaonyesha jukumu la kumhudumia na kumsaidia mfalme. “Mhudumu” linafaa katika muktadha bila kulifanya jukumu hilo kuwa la kitabibu kama “muuguzi” wala la kimapenzi kama “mwenzi.”
- source_word: וַתְּשָׁרְתֵהוּ
  choice: na kumtumikia
  rationale: Kitenzi שׁרת humaanisha kuhudumu au kutumikia. “Kumtumikia” ni cha kawaida, cha heshima, na kinatofautisha tendo lake na cheo chake kama mhudumu.
- source_word: יְדָעָהּ
  choice: hakumjua
  rationale: Kitenzi ידע hapa ni msemo wa staha unaomaanisha kuwa na uhusiano wa kingono. Tafsiri “hakumjua” inahifadhi tamathali ya Kiebrania, huku tanbihi ikifafanua maana iliyokusudiwa.
theological_decisions:
- issue: Msemo wa staha kuhusu uhusiano wa kingono katika simulizi
  choice: Kuhifadhi msemo “hakumjua” katika matini kuu na kuufafanua katika tanbihi.
  alternative: “hakufanya naye tendo la ndoa” au “hakushiriki naye ngono”
  rationale: Uamuzi huu unahifadhi lugha na mvutano wa kifasihi wa matini ya Kiebrania, lakini pia unamwezesha msomaji wa sasa kuelewa kwamba simulizi linasema hakukuwa na uhusiano wa kingono kati ya mfalme na msichana huyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Sentensi mbili zimetumiwa kwa mtiririko wa asili. Alama ya tanbihi imewekwa baada ya “hakumjua,” ambako ufafanuzi wake unahusika moja kwa moja.
