base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/034.yaml
  text: There Zadok the priest and Nathan the prophet shall anoint him king over Israel[a], and you shall blow the trumpet and say, ‘Long live King Solomon!’
translation:
  language: sw
  text: Hapo Sadoki, kuhani, na Nathani, nabii, watamtia mafuta kuwa mfalme juu ya Israeli; nanyi mtapiga baragumu[a] na kusema, “Mfalme Sulemani na aishi muda mrefu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: shofari, pembe iliyopulizwa kutoa ishara ya hadhara au kufanya tangazo; kwa kawaida hutafsiriwa “baragumu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁח אֹתוֹ
  choice: watamtia mafuta
  rationale: Katika mfululizo huu wa maagizo, kitenzi kina nguvu ya agizo. Kiswahili hiki kinahifadhi tendo halisi la kumtia mtu mafuta kwa ajili ya kuwekwa rasmi.
- source_word: שָׁם
  choice: Hapo
  rationale: Kielezi hiki kinaelekeza mahali palipotajwa awali; “Hapo” ni cha kawaida na wazi katika muktadha.
- source_word: צָדוֹק הַכֹּהֵן
  choice: Sadoki kuhani
  rationale: Jina limetoholewa kwa matumizi ya kawaida ya Kiswahili, na cheo כֹּהֵן kimetafsiriwa “kuhani.”
- source_word: וְנָתָן הַנָּבִיא
  choice: na Nathani nabii
  rationale: Kifungu kinamtaja mtendaji wa pili; נָבִיא ni “nabii” katika Kiswahili sanifu cha Biblia.
- source_word: לְמֶלֶךְ
  choice: awe mfalme
  rationale: Herufi ל inaonyesha matokeo au cheo kinachotolewa kwa tendo la kutia mafuta; “awe mfalme” huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: עַל katika usemi wa kifalme huonyesha mamlaka ya kutawala juu ya watu.
- source_word: וּתְקַעְתֶּם בַּשּׁוֹפָר
  choice: nanyi mtapiga baragumu[a]
  rationale: Kitenzi kinaendelea na mfululizo wa maagizo kwa wingi. שׁוֹפָר ni pembe inayopulizwa kwa ishara au tangazo; “baragumu” ni neno la jadi na linaloeleweka katika muktadha huu, huku tanbihi ikihifadhi umahususi wa chombo.
- source_word: וַאֲמַרְתֶּם
  choice: na kusema
  rationale: Inaendeleza agizo kwa watu wengi; umbo hili ni laini baada ya “nanyi mtapiga.”
- source_word: יְחִי
  choice: na aishi muda mrefu
  rationale: Hii ni kauli ya kushangilia kwa hali ya kutakia; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha maana ya kutamani maisha marefu ya mfalme.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Mfalme Sulemani
  rationale: Kiswahili kwa kawaida huweka cheo kabla ya jina katika kauli ya kifalme.
