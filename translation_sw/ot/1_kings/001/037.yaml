base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/037.yaml
  text: Just as Yahweh has been with my lord the king[a], so may he be with Solomon and make his throne greater than the throne of my lord King David.
translation:
  language: sw
  text: Kama vile Yahwe alivyokuwa pamoja na bwana wangu mfalme, vivyo hivyo awe pamoja na Sulemani[a], na afanye kiti chake cha enzi kiwe kikuu kuliko kiti cha enzi cha bwana wangu Mfalme Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vivyo hivyo Yahwe awe pamoja na Sulemani.” Kitenzi cha Kiebrania kinachotafsiriwa “awe” hakimtaji mtendaji waziwazi; anaeleweka kuwa Yahwe, aliyetajwa katika kishazi kilichotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo kama “BWANA”.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Kama vile ... vivyo hivyo
  rationale: Muundo huu wa ulinganisho unahifadhi uwiano kati ya kuwapo kwa Yahwe pamoja na Daudi na ombi lilelile kwa Sulemani.
- source_word: הָיָה ... עִם
  choice: alivyokuwa pamoja na
  rationale: Kauli hii inaeleza kuwapo na kuandamana kwa Mungu na Daudi; wakati uliopita unafaa katika muktadha wa baraka hii.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Inahifadhi lugha ya heshima ya ikulu pamoja na cheo cha kifalme.
- source_word: יהי
  choice: awe
  rationale: Hali ya ombi au baraka imehifadhiwa; mtendaji hajawekwa wazi katika kitenzi, kama ilivyo katika Kiebrania, lakini anaeleweka kuwa Yahwe kutokana na kishazi kilichotangulia.
- source_word: וִיגַדֵּל
  choice: na akifanye ... kuwa kikuu
  rationale: Hifili ya גדל ina maana ya kufanya kuwa kikuu; namna hii ya Kiswahili pia inaendeleza ombi la baraka.
- source_word: כִּסְאוֹ
  choice: kiti chake cha ufalme
  rationale: Inahifadhi picha halisi ya kiti cha enzi huku ikieleweka kwa urahisi kuwa ishara ya mamlaka ya kifalme.
- source_word: מִכִּסֵּא
  choice: kuliko kiti cha ufalme cha
  rationale: Kiambishi מן kinaonyesha ulinganisho baada ya wazo la kufanya kuwa kikuu.
- source_word: אֲדֹנִי הַמֶּלֶךְ דָּוִד
  choice: bwana wangu Mfalme Daudi
  rationale: Hifadhi ya heshima “bwana wangu” na jina la cheo “Mfalme Daudi” ni ya asili na yenye hadhi katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Mtendaji wa יהי katika ombi kwa ajili ya Sulemani
  choice: Mtendaji ameachwa kudokezwa katika “awe”
  alternative: Yahwe awe pamoja na Sulemani
  rationale: Kiebrania hakirudii jina la Yahwe katika kishazi hiki, ingawa muktadha unamtambulisha wazi. Tafsiri kuu inahifadhi mtiririko huo bila kuficha maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ya heshima ya ikulu imehifadhiwa, huku sentensi ikibaki wazi kwa msomaji wa kawaida.
