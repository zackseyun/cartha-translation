  text: וְ/לֹֽא עֲצָב֨/וֹ אָבִ֤י/ו מִ/יָּמָי/ו֙ לֵ/אמֹ֔ר מַדּ֖וּעַ כָּ֣כָה עָשִׂ֑יתָ וְ/גַם ה֤וּא טֽוֹב תֹּ֨אַר֙ מְאֹ֔ד וְ/אֹת֥/וֹ יָלְדָ֖ה אַחֲרֵ֥י אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/006.yaml
  text: His father had never displeased him at any time by saying[a], “Why have you done thus?” He was also very handsome[b], and his mother had borne him after Absalom.
translation:
  language: sw
  text: Baba yake hakuwahi kumtia huzuni[a] wakati wowote maishani mwake[b] kwa kumuuliza, “Kwa nini umefanya hivyo?” Naye alikuwa na sura nzuri sana, na mama yake alikuwa amemzaa baada ya Absalomu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumkera” au “kumkemea.” Kitenzi cha Kiebrania kinaweza kumaanisha kusababisha maumivu, huzuni, au kero; katika muktadha huu kinahusu Daudi kutomzuia au kutomkabili Adoniya.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “tangu siku zake”; hii ni nahau inayomaanisha wakati wowote katika maisha yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָבוֹ
  choice: kumtia huzuni
  rationale: Kitenzi עצב kinaweza kumaanisha kumsababishia mtu maumivu, huzuni, au kero. Tafsiri hii inahifadhi maana yake ya msingi bila kuamua kimya kimya kwamba tendo hilo lilikuwa hasa kukemea, ingawa muktadha unaonyesha Daudi hakumzuia wala kumhoji Adoniya.
- source_word: מִיָּמָיו
  choice: wakati wowote maishani mwake
  rationale: Kirai hiki, ambacho kwa neno kwa neno ni ‘tangu siku zake,’ ni nahau inayomaanisha kwamba jambo hilo halikutokea kamwe katika maisha yake.
- source_word: לֵאמֹר
  choice: kwa kumuuliza
  rationale: Neno hili linatanguliza maneno ambayo baba hakumwambia. Kwa kuwa maneno yenyewe ni swali, ‘kwa kumuuliza’ ni Kiswahili cha asili katika sentensi hii.
- source_word: מַדּוּעַ כָּכָה עָשִׂיתָ
  choice: Kwa nini umefanya hivyo?
  rationale: Hii ni changamoto ya moja kwa moja kuhusu tendo la Adoniya. ‘Hivyo’ huwasilisha ככה kwa Kiswahili cha sasa na kinachoeleweka.
- source_word: טוֹב תֹּאַר מְאֹד
  choice: alikuwa na sura nzuri sana
  rationale: Kirai hiki kinaeleza mwonekano mzuri wa kimwili. ‘Sura nzuri sana’ ni cha asili na chenye heshima bila kuongeza maana nyingine.
- source_word: וְאֹתוֹ יָלְדָה
  choice: mama yake alikuwa amemzaa
  rationale: Kitenzi cha Kiebrania kina kiima cha kike kisichotajwa wazi. ‘Mama yake’ kinakifanya kiima hicho kieleweke kwa Kiswahili bila kudai kuwa mama huyo pia alikuwa mama ya Absalomu.
- source_word: אַחֲרֵי אַבְשָׁלוֹם
  choice: baada ya Absalomu
  rationale: 'Kirai hiki kwa kawaida kinaonyesha mpangilio wa kuzaliwa: Adoniya alizaliwa baada ya Absalomu. Tafsiri inaacha usemi huo kwa ufupi kama ulivyo katika Kiebrania.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi lawama inayodokezwa kuhusu malezi ya Daudi, huku ikiepuka kufanya ‘kukemea’ kuwa maana pekee ya עצב. Alama zote za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
