source:
  edition: WLC
  text: וְ/אַתָּה֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ עֵינֵ֥י כָל יִשְׂרָאֵ֖ל עָלֶ֑י/ךָ לְ/הַגִּ֣יד לָ/הֶ֔ם מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/020.yaml
  text: And you[a], my lord the king, the eyes of all Israel are on you[b], to tell them who will sit on the throne of my lord the king after him.
translation:
  language: sw
  text: Na wewe, bwana wangu mfalme, macho ya Israeli yote yamekuelekea[a], ili uwaambie ni nani atakayeketi kwenye kiti cha enzi cha bwana wangu mfalme baada yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, «macho ya Israeli yote yako kwako.»
    reason: lexical_alternative
  - marker: b
    text: Yaani, baada ya Mfalme Daudi.
    reason: referent_clarification
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Huhifadhi heshima ya אֲדֹנִי pamoja na cheo cha kifalme, na ni namna ya heshima inayoeleweka katika Kiswahili.
- source_word: עֵינֵי כָל יִשְׂרָאֵל עָלֶיךָ
  choice: macho ya Israeli yote yamekuelekea
  rationale: Huhifadhi taswira ya macho katika Kiebrania huku ikionyesha kwamba taifa zima linamtazamia mfalme atoe uamuzi.
- source_word: לְהַגִּיד לָהֶם
  choice: ili uwaambie
  rationale: Kitenzi cha kusababisha jambo lijulikane kinaweza kutafsiriwa kwa kawaida hapa kuwa ‘kuwaambia’; ‘ili’ huonyesha kusudi la kutazamia kwao.
- source_word: מִי יֵשֵׁב
  choice: ni nani atakayeketi
  rationale: Huhifadhi maana ya moja kwa moja ya ‘kuketi’ na mwelekeo wa wakati ujao katika suala la urithi wa ufalme.
- source_word: עַל כִּסֵּא
  choice: kwenye kiti cha enzi
  rationale: ‘Kiti cha enzi’ ndiyo tafsiri ya kawaida na wazi ya כִּסֵּא katika muktadha wa kifalme; ‘kwenye’ ni ya asili katika Kiswahili.
- source_word: אַחֲרָיו
  choice: baada yake
  rationale: Huhifadhi kiambishi cha nafsi ya tatu, umoja wa kiume, badala ya kukibadili kuwa nafsi ya pili; katika muktadha kinamrejelea Mfalme Daudi.
theological_decisions:
- issue: Mrejelewa wa kiwakilishi katika אַחֲרָיו
  choice: baada yake, yaani baada ya Mfalme Daudi
  alternative: baadaye
  rationale: Umbo la Kiebrania lina kiambishi cha nafsi ya tatu, umoja wa kiume, na kwa kawaida humrejelea mfalme anayezungumziwa. Muktadha wa urithi wa ufalme unamtambulisha kuwa Daudi; matini kuu inadumisha nafsi ya tatu, na tanbihi inafafanua mrejelewa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya mazungumzo ya kifalme lakini kinachoeleweka kwa msomaji wa kawaida. Taswira ya Kiebrania ya ‘macho’ imehifadhiwa, na urudiaji wa ‘bwana wangu mfalme’ umeachwa kwa sababu umo katika chanzo na unaonyesha heshima ya msemaji.
