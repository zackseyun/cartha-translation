id: 1KI.1.30
reference: 1 Kings 1:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ נִשְׁבַּ֨עְתִּי לָ֜/ךְ בַּ/יהוָ֨ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֛וּא יֵשֵׁ֥ב עַל כִּסְאִ֖/י תַּחְתָּ֑/י כִּ֛י כֵּ֥ן אֶעֱשֶׂ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/030.yaml
  text: As I swore to you by Yahweh[a], the God of Israel, saying, ‘Surely Solomon your son will reign after me[b], and he will sit on my throne in my place,’ so I will do this today.
translation:
  language: sw
  text: Kama nilivyokuapia kwa Yahwe[a], Mungu wa Israeli, nikisema, ‘Hakika, mwanao Sulemani atatawala baada yangu, naye ataketi kwenye kiti changu cha enzi mahali pangu,’ ndivyo nitakavyofanya leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa Yahwe”; jina hili la Mungu mara nyingi hutafsiriwa “BWANA.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  choice: Kama ... ndivyo
  rationale: Muundo huu wa Kiswahili unaonyesha ulinganisho kati ya kiapo cha awali na tendo ambalo Daudi ataifanya leo.
- source_word: נִשְׁבַּעְתִּי לָךְ
  choice: nilivyokuapia
  rationale: Kitenzi kinaonyesha kiapo kilichofanywa tayari, na kiambishi -ku- kinamhusu Bathsheba moja kwa moja.
- source_word: בַּיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi kinaonyesha yule ambaye jina lake lilitumiwa kuthibitisha kiapo; jina la agano יהוה limetoholewa kuwa Yahwe.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huu ni uwasilishaji wa kawaida na wa moja kwa moja wa muundo wa Kiebrania.
- source_word: לֵאמֹר
  choice: nikisema
  rationale: Hutambulisha kwa kawaida maudhui ya kiapo katika simulizi ya Kiswahili.
- source_word: כִּי
  choice: Hakika
  rationale: Huhifadhi msisitizo na uhakikisho wa solemn wa maneno ya kiapo.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: mwanao Sulemani
  rationale: Mpangilio huu ni wa asili katika Kiswahili na huhifadhi uhusiano uliotajwa katika Kiebrania.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: atatawala baada yangu
  rationale: Huwasilisha kwa ufupi utawala wa kifalme na urithi wa ufalme baada ya Daudi.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי תַּחְתָּי
  choice: naye ataketi kwenye kiti changu cha enzi mahali pangu
  rationale: ‘Kuketi kwenye kiti cha enzi’ huhifadhi nahau ya kifalme, huku ‘mahali pangu’ ikihifadhi maana ya urithi au kuchukua nafasi bila kuibana kuwa ‘badala yangu.’
- source_word: כִּי כֵן אֶעֱשֶׂה
  choice: ndivyo nitakavyofanya
  rationale: Hukamilisha kwa Kiswahili sanifu muundo wa mwanzo ‘Kama ... ndivyo,’ bila kuongeza kiwakilishi kisichopo wazi katika chanzo.
- source_word: הַיּוֹם הַזֶּה
  choice: leo
  rationale: Ni tafsiri ya kawaida na ya sasa inayohifadhi uharaka wa usemi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya תַּחְתָּי katika urithi wa ufalme
  choice: mahali pangu
  alternative: badala yangu
  rationale: ‘Mahali pangu’ huhifadhi wazo la Sulemani kurithi nafasi ya Daudi bila kudokeza kwa lazima kuondolewa kwake kwa ushindani au kabla ya wakati.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ‘Kama ... ndivyo’ umechaguliwa ili kuhifadhi mantiki ya kiapo, na ‘kiti cha enzi’ hutumiwa kwa uwazi wa muktadha wa kifalme.
