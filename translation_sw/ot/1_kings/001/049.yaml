  text: Then all Adonijah’s invited guests trembled and rose[a], and each man went his way.
translation:
  language: sw
  text: Ndipo wageni wote wa Adoniya waliokuwa wamealikwa wakatetemeka, wakainuka, na kila mmoja akaenda zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kila mtu akaenda njia yake”; ni nahau inayoonyesha kwamba waliondoka, kila mmoja kivyake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֶרְדוּ
  choice: wakatetemeka
  rationale: Kitenzi חרד kinaonyesha kutetemeka kwa hofu au mshtuko. “Wakatetemeka” kinahifadhi maana ya kimwili na ya kihisia bila kuongeza kiwango cha hofu kisichotajwa wazi.
- source_word: וַיָּקֻמוּ
  choice: wakainuka
  rationale: קום humaanisha kuinuka au kusimama. “Wakainuka” ni ya kawaida katika simulizi na inaonyesha mwitikio wao wa haraka.
- source_word: כָּל הַקְּרֻאִים אֲשֶׁר לַאֲדֹנִיָּהוּ
  choice: wageni wote wa Adoniya waliokuwa wamealikwa
  rationale: הַקְּרֻאִים ni ‘walioalikwa’; katika muktadha wa karamu, hao ni wageni wa Adoniya. Muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: וַיֵּלְכוּ
  choice: akaenda
  rationale: הלך ni kitenzi cha kawaida cha kwenda. Umoja umetumiwa kwa kupatana na kishazi cha mgawanyo “kila mmoja.”
- source_word: אִישׁ לְדַרְכּוֹ
  choice: kila mmoja akaenda zake
  rationale: Hii ni nahau yenye maana ya kwamba kila mtu aliondoka kivyake. “Akaenda zake” ni Kiswahili cha asili kinachohifadhi wazo la kutawanyika kwa watu mmoja mmoja.
