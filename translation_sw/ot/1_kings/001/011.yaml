base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/011.yaml
  text: Then Nathan said to Bathsheba[a], Solomon’s mother, “Have you not heard that Adonijah son of Haggith has become king, and our lord David does not know it?”
translation:
  language: sw
  text: Ndipo Nathani akamwambia Bathsheba, mama wa Sulemani, “Je, hujasikia kwamba Adoniya mwana wa Hagithi amekuwa mfalme,[a] na bwana wetu Daudi hajui?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amejitawaza kuwa mfalme.” Kiebrania kinasema kihalisi “amekuwa mfalme/ametawala”; muktadha unaweza kudokeza kwamba alijikweza mwenyewe, lakini maneno ya hapa hayasemi hivyo waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” pamoja na “akamwambia” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: בַּת שֶׁבַע
  choice: Bathsheba
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: אֵם שְׁלֹמֹה
  choice: mama yake Sulemani
  rationale: Huonyesha wazi uhusiano wa Bathsheba na Sulemani kwa mpangilio wa kawaida wa Kiswahili.
- source_word: לֵאמֹר
  choice: halikutafsiriwa kando
  rationale: Fomula ya Kiebrania ya kuanzisha maneno tayari imewakilishwa kwa kitenzi “akamwambia” na usemi wa moja kwa moja.
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: Je, hujasikia
  rationale: Huhifadhi swali la balagha linalotarajia uthibitisho, kwa Kiswahili cha asili.
- source_word: מָלַךְ
  choice: amekuwa mfalme
  rationale: Huhifadhi maana ya kuingia katika ufalme bila kusema wazi kwamba alijifanya mfalme, jambo ambalo muktadha unaweza kudokeza lakini kitenzi chenyewe halisemi moja kwa moja.
- source_word: אֲדֹנִיָּהוּ בֶן חַגִּית
  choice: Adoniya mwana wa Hagithi
  rationale: Majina yametoholewa, na uhusiano wa kifamilia umetafsiriwa moja kwa moja.
- source_word: וַאֲדֹנֵינוּ דָוִד
  choice: na bwana wetu Daudi
  rationale: “Bwana” hapa ni cheo cha heshima kwa mfalme wa kibinadamu, si jina au cheo cha Mungu.
- source_word: לֹא יָדָע
  choice: hajui
  rationale: Kauli ya Kiebrania ina hali yenye umuhimu wa sasa; “hajui” ni ya moja kwa moja na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya אֲדֹנֵינוּ ikimrejelea Daudi
  choice: bwana wetu Daudi
  alternative: mtawala wetu Daudi
  rationale: Neno hilo ni cheo cha heshima cha kibinadamu katika mazingira ya kifalme. Herufi ndogo katika “bwana” husaidia kulitofautisha na matumizi yanayomrejelea Mungu.
- issue: Maana ya מָלַךְ katika jaribio la Adoniya kutwaa ufalme
  choice: amekuwa mfalme
  alternative: amejifanya mfalme
  rationale: 'Tafsiri iliyochaguliwa inadumisha utata wa kitenzi: muktadha unaweza kuonyesha kujikweza, lakini maneno ya aya hii hayasemi wazi kwamba alijifanya mfalme.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na wenye heshima. Majina yametolewa kwa maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili; utata halisi wa מָלַךְ umehifadhiwa katika matini na kufafanuliwa katika tanbihi.
