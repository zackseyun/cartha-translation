lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huunganisha maneno haya na yaliyotangulia huku ikianzisha hatua ya haraka; “basi sasa” ni ya kawaida na yenye uzito unaofaa katika Kiswahili.
- source_word: לְכִי
  choice: njoo
  rationale: Kimsingi kitenzi ni “nenda/tembea,” lakini hapa katika usemi wa moja kwa moja ni mwito wa haraka; “njoo” huwasilisha kazi yake ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: אִיעָצֵךְ נָא עֵצָה
  choice: tafadhali nikupe shauri
  rationale: Muundo wa Kiebrania unarudia mzizi wa “shauri” kwa msisitizo. Kiswahili cha kawaida hutumia “nikupe shauri,” huku “tafadhali” ikiwakilisha נָא.
- source_word: וּמַלְּטִי
  choice: ili uokoe
  rationale: Amri hii inamtaka Bathsheba achukue hatua itakayohifadhi maisha yake na ya Sulemani. “Ili” huonyesha matokeo yaliyokusudiwa ya kufuata shauri bila kubadili nguvu ya wito.
- source_word: נַפְשֵׁךְ
  choice: maisha yako
  rationale: נֶפֶשׁ hapa humaanisha uhai wa mtu unaotishiwa, si “roho” kama sehemu isiyo ya mwili.
- source_word: וְאֶת נֶפֶשׁ בְּנֵךְ שְׁלֹמֹה
  choice: na maisha ya mwanao Sulemani
  rationale: Hudumisha ulinganifu na “maisha yako” na kumtaja Sulemani wazi kama katika chanzo.
