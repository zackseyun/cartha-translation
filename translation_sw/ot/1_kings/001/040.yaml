  yaml_path: translation/ot/1_kings/001/040.yaml
  text: And all the people went up after him[a], and the people were playing flutes and rejoicing with great joy[b], and the earth split apart at their sound.
translation:
  language: sw
  text: Watu wote wakapanda wakimfuata, nao watu walikuwa wakipiga filimbi[a] na kushangilia kwa furaha kubwa; nayo ardhi ikapasuka kwa sauti yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ala za upepo zinazofanana na filimbi; neno la Kiebrania linaweza kutaja kwa upana ala za aina hiyo.
    reason: lexical_alternative
  - marker: b
    text: Kauli kwamba ardhi ilipasuka yaelekea ni usemi wa kutia chumvi unaoonyesha jinsi sauti za shangwe zilivyokuwa kubwa sana.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: wakapanda
  rationale: Kitenzi עלה humaanisha kupanda au kwenda juu; “wakapanda” kinahifadhi mwendo halisi wa msafara bila kuongeza maelezo yasiyokuwamo.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya nomino ya pamoja pamoja na כָל.
- source_word: אַחֲרָיו
  choice: wakimfuata
  rationale: Katika muktadha huu neno linaonyesha watu wakifuata nyuma yake katika msafara; muundo huu ni wa kawaida zaidi katika Kiswahili kuliko “baada yake.”
- source_word: מְחַלְּלִים בַּחֲלִלִים
  choice: walikuwa wakipiga filimbi
  rationale: Kirai hiki kinaeleza upigaji wa ala za upepo aina ya filimbi; tafsiri hii ni wazi na ya kawaida huku tanbihi ikihifadhi upana wa neno la Kiebrania.
- source_word: וּשְׂמֵחִים שִׂמְחָה גְדוֹלָה
  choice: kushangilia kwa furaha kubwa
  rationale: Muundo huu unaonyesha shangwe na msisitizo wa kirai cha Kiebrania bila kuleta urudiaji usio wa kawaida katika Kiswahili.
- source_word: וַתִּבָּקַע הָאָרֶץ
  choice: ardhi ikapasuka
  rationale: “Ardhi” linafaa kwa הָאָרֶץ katika taswira hii, na “ikapasuka” linahifadhi kitenzi hai na picha kali ya Kiebrania.
- source_word: בְּקוֹלָם
  choice: kwa sauti yao
  rationale: קוֹל inaweza kuwa sauti, kelele, au sauti ya mtu; “sauti” inajumuisha milio ya ala na makelele ya umati bila kuibana maana.
