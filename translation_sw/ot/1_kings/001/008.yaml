base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/008.yaml
  text: But Zadok the priest[a], Benaiah son of Jehoiada, Nathan the prophet, Shimei, Rei, and the mighty men who belonged to David were not with Adonijah.
translation:
  language: sw
  text: Lakini kuhani Sadoki, Benaya mwana wa Yehoyada, nabii Nathani, Shimei, Rei, na mashujaa waliokuwa wa Daudi[a] hawakuwa pamoja na Adoniya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mashujaa wa Daudi.” Kiebrania kinasema kihalisi, “mashujaa waliokuwa wa Daudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צָד֣וֹק הַ֠/כֹּהֵן
  choice: Lakini kuhani Sadoki
  rationale: Kiunganishi וְ kinaonyesha utofauti na orodha iliyotangulia ya waliomuunga mkono Adoniya, hivyo “Lakini” ni ya asili katika muktadha. Muundo “kuhani Sadoki” ni Kiswahili cha kawaida kwa cheo kinachoambatana na jina.
- source_word: וּ/בְנָיָ֨הוּ בֶן יְהוֹיָדָ֜ע
  choice: Benaya mwana wa Yehoyada
  rationale: Majina yametoholewa kwa desturi ya Kiswahili, na patronimia ya Kiebrania imehifadhiwa kwa “mwana wa.”
- source_word: וְ/נָתָ֤ן הַ/נָּבִיא֙
  choice: nabii Nathani
  rationale: Cheo הַנָּבִיא kimetafsiriwa kwa “nabii,” katika mpangilio wa kawaida wa Kiswahili kabla ya jina.
- source_word: וְ/שִׁמְעִ֣י וְ/רֵעִ֔י
  choice: Shimei, Rei
  rationale: Majina yametoholewa, huku viunganishi vinavyorudiwa vya Kiebrania vikibadilishwa kuwa orodha ya kawaida ya Kiswahili.
- source_word: וְ/הַ/גִּבּוֹרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑ד
  choice: na mashujaa waliokuwa wa Daudi
  rationale: גִּבּוֹרִים hapa ni mashujaa au wapiganaji hodari. “Waliokuwa wa Daudi” huhifadhi kwa karibu uhusiano mpana unaoonyeshwa na אֲשֶׁר לְדָוִד bila kuulazimisha kuwa umiliki tu.
- source_word: לֹ֥א הָי֖וּ עִם
  choice: hawakuwa pamoja na
  rationale: Hii huhifadhi usemi wa moja kwa moja wa Kiebrania. Muktadha unaonyesha kutomuunga mkono kisiasa, lakini tafsiri haiingizi maana hiyo kwa nguvu zaidi ya maandishi.
- source_word: אֲדֹנִיָּֽהוּ
  choice: Adoniya
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Orodha imepangwa kwa mtiririko wa kawaida wa Kiswahili, huku utofauti wa kisiasa wa muktadha na utata mdogo wa uhusiano wa mashujaa na Daudi vikihifadhiwa.
