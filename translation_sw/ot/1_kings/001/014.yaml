  text: Look[a], while you are still speaking there with the king, I will come in after you and confirm your words.
translation:
  language: sw
  text: Tazama,[a] wakati bado unazungumza huko pamoja na mfalme, nami nitaingia baada yako na kuyathibitisha maneno yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Angalia.” Neno la Kiebrania huvuta fikira kwenye mpango na wakati wake.
    reason: lexical_alternative
  - marker: b
    text: Au, “nitayakamilisha maneno yako” au “nitaongezea maelezo kwa yale unayosema.” Nahau ya Kiebrania inaweza kumaanisha kuongeza maelezo yanayothibitisha kauli ya mtu mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kiashiria hiki huvuta fikira kwenye wakati na mpangilio wa hatua inayofuata; “Tazama” ni ya sasa, yenye hadhi, na hudumisha msisitizo wa Kiebrania.
- source_word: עוֹדָךְ מְדַבֶּרֶת
  choice: wakati bado unazungumza
  rationale: Kielezi pamoja na kiambishi cha nafsi ya pili umoja wa kike na participio huonyesha tendo linaloendelea wakati Nathani atakapoingia.
- source_word: שָׁם עִם הַמֶּלֶךְ
  choice: huko na mfalme
  rationale: “Huko” huhifadhi kielezi cha mahali, na “na mfalme” hufuata maana ya kawaida ya עִם huku ikieleweka katika mazungumzo ya kifalme.
- source_word: וַאֲנִי אָבוֹא אַחֲרַיִךְ
  choice: mimi nitaingia baada yako
  rationale: Katika mazingira ya ikulu, בוא inaashiria kuingia mbele ya mfalme; “mimi” huhifadhi msisitizo wa kiwakilishi huru cha Kiebrania.
- source_word: וּמִלֵּאתִי אֶת דְּבָרָיִךְ
  choice: na kuyathibitisha maneno yako
  rationale: Nahau hii inaweza kumaanisha kukamilisha, kuongeza maelezo yanayounga mkono, au kuthibitisha kauli ya mwingine. Katika muktadha huu Nathani atayaunga mkono maneno ya Bathsheba mbele ya Daudi.
