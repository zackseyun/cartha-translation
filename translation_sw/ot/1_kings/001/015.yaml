base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/015.yaml
  text: So Bathsheba went in to the king in the chamber[a]. Now the king was very old[b], and Abishag the Shunammite was attending the king.
translation:
  language: sw
  text: Basi Bathsheba akaingia kwa mfalme chumbani[a]. Mfalme alikuwa mzee sana, naye Abishagi Mshunami alikuwa akimhudumia mfalme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaingia katika chumba alimokuwa mfalme.”
    reason: lexical_alternative
  - marker: b
    text: Au, “alikuwa akimtumikia mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: akaingia
  rationale: Kitenzi hiki kinaendeleza simulizi na kueleza kuingia kwa Bathsheba katika eneo la faragha la mfalme; “akaingia” ni cha kawaida na wazi katika Kiswahili.
- source_word: בַת שֶׁבַע
  choice: Bathsheba
  rationale: Jina la mtu limeandikwa kwa umbo linalotambulika katika matumizi ya kawaida ya Biblia za Kiswahili.
- source_word: אֶל הַמֶּלֶךְ הַחַדְרָה
  choice: kwa mfalme chumbani
  rationale: Kirai kinaonyesha kwamba Bathsheba aliingia katika chumba alimokuwa mfalme. Muundo huu ni wa asili katika Kiswahili na unadumisha uhusiano wa mwendo kuelekea kwa mfalme na kuingia chumbani.
- source_word: וְהַמֶּלֶךְ זָקֵן מְאֹד
  choice: Mfalme alikuwa mzee sana
  rationale: Waw hapa inaleta maelezo ya hali yanayounda mandharinyuma ya tukio. Sentensi mpya ya Kiswahili huwasilisha kazi hiyo kwa uwazi; זָקֵן מְאֹד ni “mzee sana.”
- source_word: וַאֲבִישַׁג הַשּׁוּנַמִּית
  choice: naye Abishagi, Mshunemi
  rationale: Jina limetoholewa kuwa “Abishagi,” na jina la mahali/asili la mwanamke kutoka Shunemu limetolewa kwa kifupi kama “Mshunemi.”
- source_word: מְשָׁרַת אֶת הַמֶּלֶךְ
  choice: alikuwa akimhudumia mfalme
  rationale: Kivumishi-tendo cha Kiebrania kinaonyesha huduma iliyoendelea. “Alikuwa akimhudumia” ni cha kawaida, chenye heshima, na hakileti maana ya kidini isiyokuwapo katika muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Chumbani” huonyesha chumba cha ndani au cha faragha bila kulazimisha maelezo yasiyosemwa wazi na maandishi ya Kiebrania.
