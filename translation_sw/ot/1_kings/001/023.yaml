base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/023.yaml
  text: And they told the king, saying, “Look, Nathan the prophet is here.” And he came before the king and bowed down to the king with his face to the ground.
translation:
  language: sw
  text: Wakamwambia mfalme, wakisema, “Tazama, nabii Nathani yupo hapa.” Naye akaja mbele ya mfalme, akainama kifudifudi mbele ya mfalme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kihisishi hiki kinavuta fikira kwa ujio wa Nathani; “Tazama” ni cha heshima na kinafaa katika simulizi la kibiblia.
- source_word: נָתָן הַנָּבִיא
  choice: nabii Nathani
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi cheo chake pamoja na jina lake.
- source_word: וַיִּשְׁתַּחוּ
  choice: akamsujudia
  rationale: Kitenzi kinaeleza kuinama kwa heshima mbele ya mfalme, si lazima tendo la ibada ya kidini.
- source_word: עַל־אַפָּיו אָרְצָה
  choice: kifudifudi mpaka chini
  rationale: Huhifadhi picha ya uso kuelekea chini huku kikitoa Kiswahili cha kawaida na kinachoeleweka.
theological_decisions:
- issue: Maana ya kumsujudia mfalme
  choice: akamsujudia mfalme
  alternative: akamwabudu mfalme
  rationale: Katika muktadha huu tendo ni la heshima ya kifalme; “akamwabudu” lingeingiza maana ya ibada ya kidini isiyodaiwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maneno ya taarifa yasiyo ya lazima “akisema” yameachwa ili sentensi iwe ya kawaida, huku usemi wa moja kwa moja ukihifadhi kazi yake.
