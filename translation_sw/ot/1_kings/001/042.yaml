lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: Alipokuwa bado akisema hayo
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati tukio jingine lilipotokea. ‘Akisema hayo’ ni Kiswahili cha kawaida kinachorejelea maneno aliyokuwa akisema.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili huvuta fikira kwenye tukio la ghafla au muhimu; ‘tazama’ huhifadhi msisitizo na uhai wa simulizi.
- source_word: יוֹנָתָן
  choice: Yonathani
  rationale: Tahajia ya jina la Kiebrania inayotumika kwa kawaida katika tafsiri za Biblia za Kiswahili.
- source_word: בֶּן אֶבְיָתָר הַכֹּהֵן
  choice: mwana wa kuhani Abiathari
  rationale: Muundo huu unaonyesha kuwa cheo ‘kuhani’ kinamhusu Abiathari, si Yonathani.
- source_word: בָּא
  choice: akaja
  rationale: Huwasilisha moja kwa moja kuja kwa Yonathani katika mfululizo wa simulizi.
- source_word: בֹּא
  choice: Ingia
  rationale: Amri hii ni mwaliko wa kuingia mahali walipokusanyika; ‘Ingia’ ni ya moja kwa moja na ya asili katika muktadha.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya Adoniya kumkaribisha Yonathani.
- source_word: אִישׁ חַיִל
  choice: mtu hodari
  rationale: Kirai kinaweza kumaanisha mtu shujaa, mwenye uwezo, au mwenye hadhi. ‘Mtu hodari’ huhifadhi upana wa uwezo na ustahili bila kukifunga kwenye ushujaa wa kijeshi pekee.
- source_word: וְטוֹב תְּבַשֵּׂר
  choice: nawe unaleta habari njema
  rationale: Hueleza matarajio ya Adoniya kwamba Yonathani ni mleta habari nzuri; hali ya sasa inafaa kwa kauli inayotolewa anapowasili.
