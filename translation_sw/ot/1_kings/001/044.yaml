translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Mpangilio wa simulizi umefanywa kuwa wa kawaida katika Kiswahili huku orodha ya watu na maana ya kisababishi ya kitenzi ikihifadhiwa. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, yaani 'nyumbu wa mfalme'.
