base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/044.yaml
  text: And the king sent with him Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites; and they mounted him on the king’s mule.
translation:
  language: sw
  text: Mfalme akawatuma pamoja naye Sadoki kuhani, Nathani nabii, Benaya mwana wa Yehoyada, Wakreti na Wapelethi; nao wakampandisha kwenye nyumbu wa mfalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa kubainisha zaidi, “nyumbu jike wa mfalme.” Neno la Kiebrania hapa linaweza kumaanisha nyumbu wa kike.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אִתּוֹ הַמֶּלֶךְ
  choice: Mfalme akawatuma pamoja naye
  rationale: Muundo huu unawasilisha mfalme kama mtendaji, wingi wa watu waliotumwa, na maana ya uandamani katika אִתּוֹ kwa Kiswahili cha kawaida.
- source_word: צָדוֹק הַכֹּהֵן
  choice: Sadoki kuhani
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili, na cheo הַכֹּהֵן kimetafsiriwa kwa neno la kawaida 'kuhani'.
- source_word: נָתָן הַנָּבִיא
  choice: Nathani nabii
  rationale: Jina limetoholewa, huku הַנָּבִיא likitafsiriwa moja kwa moja kuwa 'nabii'.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya mwana wa Yehoyada
  rationale: Muundo wa nasaba umehifadhiwa kwa Kiswahili cha asili na kinachoeleweka.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: Wakerethi na Wapelethi
  rationale: Majina ya makundi yamehifadhiwa kwa utohozi badala ya kupewa fasiri ya kubahatisha; viambishi vya ngeli vinaonyesha kwamba ni makundi ya watu.
- source_word: וַיַּרְכִּבוּ אֹתוֹ
  choice: wakampandisha
  rationale: Hiphil ya רכב ina maana ya kusababisha mtu apande; 'wakampandisha' huhifadhi maana hiyo ya kisababishi kwa ufupi na kwa kawaida.
- source_word: עַל פִּרְדַּת הַמֶּלֶךְ
  choice: juu ya nyumbu wa mfalme
  rationale: '''Nyumbu'' ni neno linalofaa kwa mnyama chotara anayekusudiwa hapa; umbo la Kiebrania linaweza kubainisha jike, jambo lililowekwa katika tanbihi bila kulisisitiza kupita kiasi katika matini.'
