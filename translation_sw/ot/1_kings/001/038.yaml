base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/038.yaml
  text: So Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites went down and had Solomon ride on King David’s mule[c][b], and they brought him to Gihon.
translation:
  language: sw
  text: Basi kuhani Sadoki, nabii Nathani, Benaya mwana wa Yehoyada, pamoja na Wakerethi na Wapelethi[a], wakashuka. Wakampandisha Sulemani juu ya nyumbu jike wa Mfalme Daudi, kisha wakampeleka Gihoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda maneno “Wakerethi na Wapelethi” yanayataja makundi yaliyokuwa walinzi wa mfalme; Kiebrania kinatumia majina yenyewe ya makundi hayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: wakashuka
  rationale: Kitenzi ירד kina maana ya kushuka; tafsiri hii inahifadhi mwelekeo wa safari kwa Kiswahili cha kawaida.
- source_word: צָדוֹק הַכֹּהֵן
  choice: kuhani Sadoki
  rationale: Mpangilio huu ni wa kawaida na wa asili katika Kiswahili, huku ukihifadhi cheo cha Sadoki.
- source_word: נָתָן הַנָּבִיא
  choice: nabii Nathani
  rationale: Huhifadhi jina na cheo kwa mpangilio wa kawaida wa Kiswahili.
- source_word: בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya mwana wa Yehoyada
  rationale: Ni tafsiri ya moja kwa moja ya uhusiano wa kifamilia unaotajwa katika Kiebrania.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: Wakerethi na Wapelethi
  rationale: Majina ya makundi yameendelezwa badala ya kutafsiriwa kuwa kazi yao inayodhaniwa, kwa sababu utambulisho na jukumu lao kamili vina mjadala.
- source_word: וַיַּרְכִּבוּ
  choice: wakampandisha
  rationale: Hifili ya רכב ina maana ya kumsababisha mtu apande; ‘wakampandisha’ inahifadhi maana hiyo kwa ufupi na kwa kawaida.
- source_word: פִּרְדַּת
  choice: nyumbu jike
  rationale: Nomino ya Kiebrania humaanisha nyumbu wa kike; Kiswahili kinaweza kuonyesha taarifa hiyo kwa kawaida kwa kusema ‘nyumbu jike.’
- source_word: פִּרְדַּת הַמֶּלֶךְ דָּוִד
  choice: nyumbu jike wa Mfalme Daudi
  rationale: Muundo wa Kiebrania unaonyesha umiliki; tafsiri hii inahifadhi kwamba mnyama huyo alikuwa wa Mfalme Daudi.
- source_word: וַיֹּלִכוּ אֹתוֹ
  choice: wakampeleka
  rationale: Hifili ya הלך hapa ina maana ya kumsababisha aende au kumpeleka; ‘wakampeleka’ haidokezi bila sababu kwamba Sulemani alitembea kwa miguu.
- source_word: עַל גִּחוֹן
  choice: Gihoni
  rationale: Katika muktadha huu wa mwendo, עַל pamoja na jina la mahali huonyesha walikoelekea; ‘Gihoni’ baada ya ‘wakampeleka’ ni Kiswahili cha asili.
