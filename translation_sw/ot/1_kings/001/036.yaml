  text: Benaiah son of Jehoiada answered the king and said[a], “Amen! May Yahweh, the God of my lord the king, say so.”
translation:
  language: sw
  text: Benaya mwana wa Yehoyada akamjibu mfalme, akasema[a], “Amina! Yahwe, Mungu wa bwana wangu mfalme, aseme hivyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amina! Yahwe, Mungu wa bwana wangu mfalme, na aseme hivyo.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa karibu zaidi kuwa “aseme,” kwa maana ya kuthibitisha au kuidhinisha matakwa ya mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Kitenzi ענה katika simulizi hutambulisha jibu; “akamjibu” ni cha kawaida na kinaonyesha kuwa mfalme ndiye aliyejibiwa.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya mwana wa Yehoyada
  rationale: Majina yametoholewa kwa Kiswahili, na muundo wa ukoo wa Kiebrania umehifadhiwa kwa “mwana wa.”
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Huhifadhi mfuatano wa simulizi la Kiebrania kwa lugha ya Kiswahili iliyo ya kawaida.
- source_word: אָמֵן
  choice: Amina!
  rationale: “Amina” huhifadhi tamko la kukubali na kutakia jambo litimie, huku likiwa neno linaloeleweka katika Kiswahili.
- source_word: כֵּן יֹאמַר
  choice: na aseme hivyo
  rationale: Muundo huu unaonyesha maana ya kutakia au kuomba uthibitisho, si taarifa rahisi ya wakati ujao; “hivyo” hurejelea kusudi la mfalme lililotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika tetragramatoni limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי
  choice: Mungu wa
  rationale: Huwakilisha kwa kawaida muundo tegemezi wa Kiebrania unaofuatiwa na mwenye Mungu huyo.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Huhifadhi umilikaji na heshima ya lugha ya ikulu bila kuongeza maana isiyokuwapo katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya יֹאמַר baada ya אָמֵן
  choice: na aseme hivyo
  alternative: atasema hivyo
  rationale: Katika muktadha huu hali ya kitenzi inaonyesha ombi au takwa la kuthibitisha kusudi la mfalme, si unabii wa moja kwa moja kuhusu wakati ujao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka na hadhi inayofaa mazungumzo ya ikulu. “Bwana wangu mfalme” limetumiwa kama tamko la heshima kwa mfalme, huku “Yahwe” likihifadhiwa kama jina la Mungu.
