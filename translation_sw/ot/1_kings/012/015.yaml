id: 1KI.12.15
reference: 1 Kings 12:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה סִבָּה֙ מֵ/עִ֣ם יְהוָ֔ה לְמַ֜עַן הָקִ֣ים אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ בְּ/יַד֙ אֲחִיָּ֣ה הַ/שִּׁילֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/015.yaml
  text: So the king did not listen to the people[a], for it was a turn of events from Yahweh[b], in order to establish his word that Yahweh had spoken by the hand of Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: sw
  text: Basi mfalme hakuwasikiliza watu, kwa maana hali hii ya mambo[a] ilitokana na Yahweh, ili kuthibitisha neno lake ambalo Yahweh alikuwa amelisema kupitia kwa Ahija Mshiloni[b] kwa Yeroboamu mwana wa Nebati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana sababu yake ilitoka kwa Yahweh.” Neno la Kiebrania סִבָּה linaweza kumaanisha sababu, chanzo, au mgeuko wa hali.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kwa mkono wa Ahija Mshiloni,” nahau yenye maana ya “kupitia kwa Ahija Mshiloni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: kuwasikiliza
  rationale: Katika muktadha wa ombi la watu, kitenzi hiki pamoja na kihusishi אֶל humaanisha kulisikiliza au kulikubali ombi lao, si kusikia sauti tu.
- source_word: הָעָם
  choice: watu
  rationale: Ni tafsiri ya kawaida ya עָם hapa, ikirejelea watu wa Israeli waliomjia mfalme.
- source_word: סִבָּה
  choice: mgeuko wa mambo
  rationale: Nomino hii inaweza kumaanisha sababu, chanzo, au mgeuko wa hali. ‘Mgeuko wa mambo’ inafaa katika simulizi na huhifadhi wazo la matukio yaliyoelekea kwenye matokeo hayo.
- source_word: מֵעִם יְהוָה
  choice: ulitoka kwa Yahweh
  rationale: Kirai hiki kinaonyesha chanzo cha tukio; jina la agano יְהוָה limetafsiriwa ‘Yahweh.’
- source_word: לְמַעַן הָקִים
  choice: ili alithibitishe
  rationale: לְמַעַן huonyesha kusudi, na הֵקִים likitumiwa kuhusu neno humaanisha kulithibitisha au kulifanya lisimame kwa kutimizwa.
- source_word: דְּבָרוֹ
  choice: neno lake
  rationale: Huhifadhi nahau ya kibiblia ya neno la Mungu bila kuibana maana iwe ‘ahadi’ pekee.
- source_word: דִּבֶּר
  choice: alikuwa amesema
  rationale: Muundo huu unaonyesha kwa kawaida kwamba usemi wa Yahweh ulitangulia tukio linalosimuliwa.
- source_word: בְּיַד
  choice: kupitia kwa
  rationale: Ni nahau ya Kiebrania inayoonyesha uwakala; ‘kupitia kwa’ ni Kiswahili cha kawaida kinachowasilisha maana hiyo.
- source_word: הַשִּׁילֹנִי
  choice: Mshiloni
  rationale: Huhifadhi kivumishi cha mahali kinachomtambulisha Ahija kuwa mtu wa Shilo.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Hufuata mtindo wa kawaida wa Kiswahili wa jina la mtu pamoja na jina la baba yake.
theological_decisions:
- issue: Uhusiano wa utawala wa Mungu na uamuzi wa mwanadamu
  choice: Kukataa kwa mfalme kusikiliza watu kunasimuliwa sambamba na ukweli kwamba mgeuko wa mambo ulitoka kwa Yahweh kwa kusudi la kuthibitisha neno lake.
  alternative: Kusema kwamba Yahweh aliruhusu tukio hilo tu, au kusema moja kwa moja kwamba alimlazimisha mfalme kukataa.
  rationale: Kiebrania kinataja wazi chanzo cha mgeuko huo kuwa Yahweh na kinaongeza kirai cha kusudi, lakini hakielezi utaratibu wa jinsi utawala wa Mungu ulivyohusiana na uamuzi wa mfalme. Tafsiri inahifadhi mvutano huo.
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano יְהוָה; ‘Yahweh’ hulitambulisha kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. ‘Mgeuko wa mambo’ huhifadhi upana wa סִבָּה; ‘kupitia kwa’ huwasilisha kwa kawaida nahau ya uwakala ya Kiebrania.
