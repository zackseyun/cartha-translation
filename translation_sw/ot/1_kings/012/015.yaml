- from: Basi mfalme hakuwasikiliza watu, kwa maana mgeuko huo wa mambo ulitoka kwa Yahweh[a], ili alithibitishe neno lake ambalo Yahweh alikuwa amesema kupitia kwa Ahija Mshiloni[b] kwa Yeroboamu mwana wa Nebati.
  to: Basi mfalme hakuwasikiliza watu, kwa maana hali hii ya mambo[a] ilitokana na Yahweh, ili kuthibitisha neno lake ambalo Yahweh alikuwa amelisema kupitia kwa Ahija Mshiloni[b] kwa Yeroboamu mwana wa Nebati.
  rationale: Revised the circumstance phrase for idiomatic Swahili and replaced the potentially ambiguous finite purpose clause with an infinitive clause. The revision preserves the Hebrew’s attribution of the circumstance to Yahweh and its purpose of establishing Yahweh’s previously spoken word. Footnote anchors are retained and placed directly after the expressions they explain.
