  text: But Rehoboam reigned over the Israelites who lived in the cities of Judah.
translation:
  language: sw
  text: Lakini Rehoboamu aliwatawala Waisraeli waliokuwa wakiishi katika miji ya Yuda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa kwa muundo wa maneno ni ‘wana wa Israeli,’ hapa ni jina la taifa; ‘Waisraeli’ ni Kiswahili cha kawaida na sahihi.
- source_word: הַ/יֹּשְׁבִים
  choice: waliokuwa wakiishi
  rationale: Kitenzi kishirikishi kinaonyesha hali ya kuendelea ya kukaa mahali; usemi huu unaonyesha kwamba makao yao yalikuwa katika miji hiyo.
- source_word: בְּ/עָרֵי יְהוּדָה
  choice: katika miji ya Yuda
  rationale: Tafsiri ya moja kwa moja ya kirai cha mahali, bila kuamua zaidi ya maandishi kuhusu mipaka ya kisiasa.
- source_word: וַ/יִּמְלֹךְ
  choice: aliwatawala
  rationale: Katika muktadha huu מלך humaanisha kutawala akiwa mfalme. ‘Aliwatawala’ ni ya asili katika Kiswahili na huunganika vizuri na kiwakilishi cha watu wanaotawaliwa.
- source_word: עֲלֵי/הֶם
  choice: -wa-
  rationale: Kiwakilishi cha yambwa ndani ya ‘aliwatawala’ kinawakilisha maana ya ‘juu yao’ kwa Kiswahili cha kawaida.
- source_word: רְחַבְעָם
  choice: Rehoboamu
  rationale: Jina limetoholewa kwa tahajia inayotambulika katika matumizi ya Biblia za Kiswahili.
- source_word: וּ
  choice: Lakini
  rationale: Kiunganishi hapa kinaonyesha tofauti na uasi wa makabila ya kaskazini uliosimuliwa kabla yake.
