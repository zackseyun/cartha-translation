  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֛י הַ/דָּבָ֥ר הַ/זֶּ֖ה לְ/חַטָּ֑את וַ/יֵּלְכ֥וּ הָ/עָ֛ם לִ/פְנֵ֥י הָ/אֶחָ֖ד עַד דָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/030.yaml
  text: And this thing became a sin[a], and the people went before the one as far as Dan.
translation:
  language: sw
  text: Jambo hili likawa dhambi, nao watu wakaenda mbele ya yule mmoja[a] hadi Dani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “yule mmoja.” Inaelekea kuwa ni mmoja wa wale ndama wawili ambao Yeroboamu aliwasimamisha, hasa yule wa Dani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: likawa
  rationale: 'Katika muundo huu, kitenzi היה pamoja na לְחַטָּאת kinaonyesha matokeo: jambo hilo lilikuja kuwa dhambi.'
- source_word: הַדָּבָר הַזֶּה
  choice: Jambo hili
  rationale: דבר lina maana pana ya jambo au suala; hapa linarejelea mpango wa ibada uliowekwa na Yeroboamu.
- source_word: לְחַטָּאת
  choice: dhambi
  rationale: Katika muktadha wa ibada isiyofaa, חַטָּאת linamaanisha dhambi, si sadaka ya dhambi. Nomino imehifadhiwa bila kuongeza maelezo ya kitheolojia.
- source_word: וַיֵּלְכוּ הָעָם
  choice: nao watu wakaenda
  rationale: הלך katika simulizi humaanisha kwenda. Kiunganishi na mtiririko wa kitenzi cha Kiswahili huendeleza simulizi kwa njia ya kawaida.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Hii ndiyo maana ya moja kwa moja ya לפני. Haijaongezewa kauli kama 'kuabudu' ingawa muktadha unaidokeza.
- source_word: הָאֶחָד
  choice: yule mmoja
  rationale: Kiebrania kinasema kihalisi 'yule mmoja' bila kutaja nomino. Tafsiri inahifadhi udondoshaji huo, huku tanbihi ikieleza rejeleo linalowezekana.
- source_word: עַד דָּן
  choice: hadi Dani
  rationale: עד huonyesha kikomo cha mwendo, na Dani ni mahali pa patakatifu pa kaskazini.
theological_decisions:
- issue: Asili ya dhambi katika mpango wa ibada wa Yeroboamu
  choice: Aya inasema kwamba jambo hili likawa dhambi.
  alternative: Mpango huo ukawa sababu ya watu kutenda dhambi.
  rationale: Tafsiri huhifadhi kauli ya nomino חַטָּאת bila kuipanua kuwa ufafanuzi maalumu wa kimadhehebu; maana ya 'sadaka ya dhambi' haifai katika muktadha huu.
- issue: Rejeleo la 'yule mmoja'
  choice: Maneno hayo yamehifadhiwa katika matini, yakielekea kumaanisha mmoja wa wale ndama wawili, hasa yule wa Dani.
  alternative: Kutaja moja kwa moja 'ndama mmoja' katika matini kuu.
  rationale: Kiebrania ni kifupi na kina utata wa kisintaksia. Tanbihi hufafanua rejeleo linalowezekana bila kuondoa utata halisi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa simulizi umetolewa kwa 'nao ... wakaenda,' huku usemi mfupi wa Kiebrania ukihifadhiwa.
