  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם מָ֚ה אַתֶּ֣ם נֽוֹעָצִ֔ים וְ/נָשִׁ֥יב דָּבָ֖ר אֶת הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁ֨ר דִּבְּר֤וּ אֵלַ/י֙ לֵ/אמֹ֔ר הָקֵל֙ מִן הָ/עֹ֔ל אֲשֶׁר נָתַ֥ן אָבִ֖י/ךָ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/009.yaml
  text: And he said to them[a], “What do you advise, that we may answer this people who have spoken to me, saying[b], ‘Lighten the yoke that your father put on us’?”
translation:
  language: sw
  text: Naye akawaambia[a], “Mnashauri nini, ili tumjibu watu hawa walioniambia, ‘Punguza uzito wa nira ambayo baba yako alituwekea’?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naye akawauliza.” Kiebrania ni, “Naye akawaambia.”
    reason: lexical_alternative
  - marker: b
    text: “Nira” ni mfano wa kazi nzito na wajibu waliowekewa na mfalme.
    reason: cultural_note
lexical_decisions:
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: Mnashauri nini
  rationale: Kauli hii inaomba ushauri wa sasa kutoka kwa washauri; tafsiri hii ni ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: וְנָשִׁיב דָּבָר
  choice: ili tumjibu
  rationale: Kirai cha Kiebrania kina maana ya kurudisha jibu. 'Ili tumjibu' huhifadhi wazo la kusudi kwa Kiswahili cha kawaida.
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: Ingawa עָם ni nomino ya umoja yenye maana ya kundi, Kiswahili kwa kawaida hutumia 'watu hawa' kwa kundi linalotajwa moja kwa moja.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלַי לֵאמֹר
  choice: walioniambia
  rationale: Hukusanya kwa ufasaha muundo wa Kiebrania 'walionena nami, wakisema' bila kupoteza utangulizi wa maneno yao.
- source_word: הָקֵל מִן הָעֹל
  choice: Punguza uzito wa nira
  rationale: Huhifadhi taswira halisi ya nira na kuonyesha wazi kwamba ombi ni kuifanya iwe nyepesi, si kuiondoa kabisa.
- source_word: אֲשֶׁר נָתַן אָבִיךָ עָלֵינוּ
  choice: ambayo baba yako alituwekea
  rationale: '''Alituwekea'' hudumisha taswira ya nira iliyowekwa juu yao na ni ya asili katika Kiswahili.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Taswira ya 'nira' imehifadhiwa, huku ombi la kuipunguza likielezwa kwa lugha ya kawaida.
