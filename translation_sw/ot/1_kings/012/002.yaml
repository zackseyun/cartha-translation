  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ יָרָבְעָ֣ם בֶּן נְבָ֗ט וְ/הוּא֙ עוֹדֶ֣/נּוּ בְ/מִצְרַ֔יִם אֲשֶׁ֣ר בָּרַ֔ח מִ/פְּנֵ֖י הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וַ/יֵּ֥שֶׁב יָרָבְעָ֖ם בְּ/מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/002.yaml
  text: When Jeroboam son of Nebat heard of it—while he was still in Egypt[a], where he had fled from King Solomon—Jeroboam was still living in Egypt.
translation:
  language: sw
  text: Yeroboamu mwana wa Nebati aliposikia habari hiyo—akiwa bado Misri[a], ambako alikuwa amekimbilia ili kumwepuka Mfalme Sulemani—Yeroboamu alikuwa akiishi Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema tu “Yeroboamu ... aliposikia”; jambo alilosikia linadokezwa na muktadha, yaelekea ni habari iliyotajwa katika simulizi linalozunguka mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: aliposikia
  rationale: Muundo wa simulizi וַיְהִי pamoja na כ na kitenzi-jina unaanzisha kishazi cha wakati; ‘aliposikia’ ni Kiswahili cha kawaida na cha asili bila kuongeza neno la wakati lisilo wazi katika Kiebrania.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia, huku uhusiano wa kifamilia ukihifadhiwa.
- source_word: וְהוּא עוֹדֶנּוּ בְמִצְרַיִם
  choice: akiwa bado Misri
  rationale: Kishazi hiki kinaeleza hali na mahali alipokuwa wakati aliposikia; ‘akiwa bado Misri’ ni wazi na asilia.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי הַמֶּלֶךְ שְׁלֹמֹה
  choice: ambako alikuwa amekimbilia ili kumwepuka Mfalme Sulemani
  rationale: Kitenzi בָּרַח na kirai מִפְּנֵי vinaonyesha kukimbia kutoka mbele au mamlaka ya Sulemani. ‘Ili kumwepuka’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kudai kwamba Sulemani mwenyewe alikuwa akimkimbiza.
- source_word: וַיֵּשֶׁב ... בְּמִצְרָיִם
  choice: alikuwa akiishi Misri
  rationale: ישׁב hapa ina maana ya kukaa au kuishi mahali. Muundo wa hali endelevu unahifadhi taarifa kwamba makao yake yalikuwa Misri, bila kulazimisha maana maalumu ya ‘alibaki’.
- source_word: שְׁמֹעַ
  choice: kusikia habari hiyo
  rationale: Kiebrania hakitaji kitu kilichosikiwa; ‘habari hiyo’ hutoa rejeo linalodokezwa na muktadha, na tanbihi inaweka wazi nyongeza hiyo.
