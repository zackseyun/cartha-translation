  text: וְ/עַתָּ֗ה אָבִ/י֙ הֶעְמִ֤יס עֲלֵי/כֶם֙ עֹ֣ל כָּבֵ֔ד וַ/אֲנִ֖י אוֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֕י אֲיַסֵּ֥ר אֶתְ/כֶ֖ם בָּ/עַקְרַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.
translation:
  language: sw
  text: Basi sasa, baba yangu aliifanya nira yenu kuwa nzito, lakini mimi nitaiongezea uzito. Baba yangu aliwaadhibu kwa mijeledi, lakini mimi nitawaadhibu kwa nge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “kwa mijeledi ya nge,” yaani mijeledi au viboko vilivyotengenezwa ili kuumiza zaidi; Kiebrania kinasema kihalisi “kwa nge.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס ... עֹל כָּבֵד
  choice: aliifanya nira yenu kuwa nzito
  rationale: Hiphil ya עמס ina maana ya kuweka au kuongezea mzigo. Tafsiri hii inadumisha nira kama sitiari ya utawala wa ukandamizaji na pia maana halisi ya כָּבֵד, ‘nzito.’
- source_word: עֹל / עֻלְּכֶם
  choice: nira / nira yenu
  rationale: ‘Nira’ ni sitiari halisi ya Kiebrania kwa utawala mzito au kazi ya kulazimishwa; kuibadili kuwa ‘mzigo’ kungefifisha picha hiyo.
- source_word: אוֹסִיף עַל
  choice: nitaiongezea uzito
  rationale: Kirai hiki humaanisha kuongeza kitu. Katika Kiswahili, ‘nitaiongezea uzito’ ni cha kawaida zaidi kuliko ‘nitaongeza juu ya nira yenu’ na kinaweka wazi ongezeko la ukali bila kuondoa sitiari ya nira.
- source_word: יִסַּר / אֲיַסֵּר
  choice: aliwaadhibu / nitawaadhibu
  rationale: Katika tishio hili la kisiasa linalohusisha mijeledi, ‘adhibu’ huwasilisha kwa kawaida maana ya kurudiarudia ya יסר bila kuifanya iwe fundisho la upole au kuibana kuwa hukumu ya kisheria.
- source_word: בַּשּׁוֹטִים
  choice: kwa mijeledi
  rationale: שׁוֹט ni mjeledi au kiboko; ‘mijeledi’ ni tafsiri ya moja kwa moja na ya asili katika muktadha huu.
- source_word: בָּעַקְרַבִּים
  choice: kwa nge
  rationale: Maana halisi ni ‘nge.’ Picha ya Kiebrania imehifadhiwa katika matini kuu, huku uwezekano kwamba ni jina la mijeledi mikali zaidi ukielezwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya ‘baba yangu ... lakini mimi’ yamedumishwa kwa nguvu ya kisanaa. ‘Basi sasa’ limetumiwa kwa וְעַתָּה kama kiunganishi cha hotuba, si kama rejeo kuu la wakati.
