  text: וַ/יֹּ֥אמֶר יָרָבְעָ֖ם בְּ/לִבּ֑/וֹ עַתָּ֛ה תָּשׁ֥וּב הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית דָּוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/026.yaml
  text: And Jeroboam said in his heart[a], “Now the kingdom will return to the house of David.”
translation:
  language: sw
  text: Yeroboamu akasema moyoni mwake[a], “Sasa ufalme utarudi kwa nyumba ya Daudi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akajiambia.” Kiebrania kinasema kihalisi “moyoni mwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Waw-consecutive inaendeleza simulizi; ‘akasema’ ni njia ya kawaida na ya asili ya kuonyesha mfuatano huo katika Kiswahili.
- source_word: יָרָבְעָם
  choice: Yeroboamu
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בְּלִבּוֹ
  choice: moyoni mwake
  rationale: Huhifadhi taswira halisi ya Kiebrania, huku katika muktadha ikimaanisha kwamba alisema ndani yake mwenyewe.
- source_word: עַתָּה
  choice: Sasa
  rationale: Huonyesha ukaribu na uharaka wa wasiwasi wa Yeroboamu kwa lugha fupi na ya kawaida.
- source_word: תָּשׁוּב
  choice: utarudi
  rationale: Kitenzi שוב hapa kina maana ya kurudi au kurejea, na muktadha unaelekeza kwenye wakati ujao.
- source_word: הַמַּמְלָכָה
  choice: ufalme
  rationale: Neno hili hapa linarejelea mamlaka au eneo la kifalme; ‘ufalme’ ni tafsiri ya kawaida na sahihi kimuktadha.
- source_word: לְבֵית דָּוִד
  choice: kwa nyumba ya Daudi
  rationale: Huhifadhi msemo wa kibiblia ‘nyumba ya Daudi,’ unaoweza kumaanisha ukoo au nasaba yake ya kifalme bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Tafsiri ya nahau ya usemi wa ndani בְּלִבּוֹ
  choice: moyoni mwake
  alternative: moyoni; akajiambia
  rationale: Tafsiri hii huhifadhi nahau na taswira ya Kiebrania. Tanbihi inaeleza maana yake ya usemi wa ndani bila kuondoa upekee wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili katika simulizi la Kiswahili, huku nahau ya Kiebrania na msemo wa nasaba ‘nyumba ya Daudi’ vikihifadhiwa.
