  text: He said to them[a], “Go away for three more days, then return to me.” So the people went away.
translation:
  language: sw
  text: Akawaambia, “Ondokeni kwa siku tatu zaidi, kisha mrudi kwangu.” Basi watu wakaondoka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Akawaambia
  rationale: Muundo huu wa kawaida wa masimulizi unaunganisha kitendo na yaliyotangulia, huku kiambishi -wa- kikionyesha wazi walioambiwa.
- source_word: לְכוּ
  choice: Nendeni
  rationale: Ni amri ya wingi ya הלך. Katika muktadha huu inawaagiza waondoke kwa muda; Kiswahili cha kawaida kinaweza kueleza hilo kwa 'Nendeni' bila kuongeza maana isiyokuwamo.
- source_word: עוֹד שְׁלֹשָׁה יָמִים
  choice: kwa siku nyingine tatu
  rationale: עוֹד pamoja na kipindi cha wakati huonyesha muda wa nyongeza; 'siku nyingine tatu' ni usemi wa kawaida unaohifadhi maana hiyo.
- source_word: וְשׁוּבוּ אֵלָי
  choice: kisha mrudi kwangu
  rationale: שוב ina maana ya kurudi, na 'kisha' huwasilisha vizuri mfuatano wa amri mbili unaoeleweka katika muktadha.
- source_word: וַיֵּלְכוּ הָעָם
  choice: Basi watu wakaondoka
  rationale: Kishazi cha masimulizi kinaonyesha watu walitii agizo. 'Wakaondoka' huonyesha kuondoka mbele yake na ni ya asili katika Kiswahili.
