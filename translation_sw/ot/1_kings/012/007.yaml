  text: ו/ידבר אֵלָ֜י/ו לֵ/אמֹ֗ר אִם הַ֠/יּוֹם תִּֽהְיֶה עֶ֜בֶד לָ/עָ֤ם הַ/זֶּה֙ וַֽ/עֲבַדְתָּ֔/ם וַ/עֲנִיתָ֕/ם וְ/דִבַּרְתָּ֥ אֲלֵי/הֶ֖ם דְּבָרִ֣ים טוֹבִ֑ים וְ/הָי֥וּ לְ/ךָ֛ עֲבָדִ֖ים כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/007.yaml
  text: And he spoke to him[a], saying, “If today you will be a servant to this people, and serve them, and answer them, and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: sw
  text: Wakamwambia, “Ikiwa leo utakuwa mtumishi wa watu hawa, ukawatumikia, ukawajibu na kuwaambia maneno mema, basi watakuwa watumishi wako siku zote.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו לֵאמֹר
  choice: Wakamwambia
  rationale: Muktadha na maandishi ya kawaida ya WLC yana kitenzi cha wingi, kikirejelea wazee waliokuwa wakimshauri Rehoboamu. Kiswahili cha masimulizi hakihitaji kutafsiri kando fomula ‘wakisema.’
- source_word: עֶבֶד
  choice: mtumishi
  rationale: Katika shauri hili la kisiasa, neno linaonyesha mfalme kujiweka katika nafasi ya kuwahudumia watu; ‘mtumishi’ ni la kawaida na huhifadhi uhusiano na kitenzi kinachofuata.
- source_word: וַעֲבַדְתָּם
  choice: ukawatumikia
  rationale: Huhifadhi mzizi na wazo lilelile la utumishi lililo katika ‘mtumishi,’ pamoja na mfuatano wa masharti.
- source_word: וַעֲנִיתָם
  choice: ukawajibu
  rationale: Katika muktadha wa ombi la watu, ענה humaanisha kuwajibu, si kuwatesa.
- source_word: דְּבָרִים טוֹבִים
  choice: maneno mema
  rationale: Ni tafsiri ya karibu na ya kawaida inayohifadhi upana wa maana; inaweza kumaanisha maneno mazuri, ya fadhili, au yenye kuwapendeza.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: watakuwa watumishi wako
  rationale: 'Huhifadhi nomino ya Kiebrania na ulinganifu wa kimakusudi: mfalme akiwatumikia sasa, wao watakuwa watumishi wake.'
- source_word: כָּל הַיָּמִים
  choice: siku zote
  rationale: Ni nahau ya asili ya Kiswahili inayolingana na maana ya kudumu ya usemi wa Kiebrania bila kuongeza kimilikishi kisichotajwa moja kwa moja.
- source_word: אִם הַיּוֹם
  choice: Ikiwa leo
  rationale: Huhifadhi msisitizo wa wakati wa sasa na uamuzi wa haraka uliokuwa mbele ya mfalme.
theological_decisions:
- issue: Taswira ya kisiasa ya mfalme kuwa mtumishi
  choice: Kutumia moja kwa moja ‘mtumishi,’ ‘kuwatumikia,’ na ‘watumishi wako.’
  alternative: Kutumia ‘kuwa chini ya watu,’ ‘kuwahudumia,’ au ‘watakuwa raia wako.’
  rationale: Uteuzi huu huhifadhi kinaya na ulinganifu wa lugha ya utumishi bila kuingiza fundisho la baadaye au kupunguza nguvu ya shauri la wazee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini rahisi kueleweka. Muundo ‘ukawatumikia, ukawajibu’ unaonyesha matendo yanayofuata ndani ya sharti. Hakuna tanbihi iliyoongezwa kwa sababu ‘maneno mema’ na ‘siku zote’ huhifadhi maana pana ya chanzo bila kuhitaji mbadala wa lazima. Ingawa maandishi yaliyowasilishwa yanaonekana kupungukiwa na kiambishi cha wingi katika kitenzi cha mwanzo, usomaji wa kawaida wa WLC na muktadha ni וַיְדַבְּרוּ, ‘wakamwambia.’
