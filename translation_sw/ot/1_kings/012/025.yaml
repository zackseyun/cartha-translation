base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/025.yaml
  text: Then Jeroboam built Shechem in the hill country of Ephraim and lived there[a]; and he went out from there and built Penuel.
translation:
  language: sw
  text: Kisha Yeroboamu akajenga Shekemu katika nchi ya vilima ya Efraimu, akaishi huko; akatoka huko, akajenga Penueli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Penueli pia huandikwa Penieli katika tafsiri fulani za Kiingereza na katika vifungu vinavyohusiana vya Biblia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: akajenga
  rationale: Kitenzi בנה kwa kawaida humaanisha ‘kujenga.’ Katika habari ya mji kinaweza pia kudokeza kujenga upya au kuimarisha ngome, lakini ‘akajenga’ huhifadhi maana ya msingi bila kuongeza maelezo yasiyotajwa wazi.
- source_word: שְׁכֶם
  choice: Shekemu
  rationale: Jina la mahali limetoholewa kwa namna inayotambulika na iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בְּהַר אֶפְרַיִם
  choice: katika nchi ya vilima ya Efraimu
  rationale: Neno הַר hapa linaweza kutaja eneo la miinuko au vilima, si lazima mlima mmoja; tafsiri hii inaeleza maana ya kijiografia kwa Kiswahili cha kawaida.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: akaishi huko
  rationale: Kitenzi ישב kinaweza kumaanisha kukaa, kuishi, au kufanya makao. ‘Akaishi huko’ ni cha asili na kiambishi cha kike kinachorejelea mji kimetafsiriwa kwa ‘huko.’
- source_word: וַיֵּצֵא מִשָּׁם
  choice: akatoka huko
  rationale: Kitenzi יצא kimsingi ni ‘kutoka.’ Kauli hii huhifadhi lugha ya mwendo na kwa kawaida inaeleweka kuwa aliondoka Shekemu.
- source_word: פְּנוּאֵל
  choice: Penueli
  rationale: Jina la mahali limetoholewa kwa muundo wa Kiswahili huku likifuata umbo la konsonanti la Kiebrania lililo katika mstari huu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya ‘Penueli,’ ambako maelezo yake yanahusika moja kwa moja.
