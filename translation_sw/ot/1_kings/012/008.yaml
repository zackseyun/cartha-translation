  yaml_path: translation/ot/1_kings/012/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: sw
  text: Lakini aliacha shauri la wazee walilompa, akashauriana na vijana waliokulia pamoja naye, waliokuwa wamesimama mbele yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waliokuwa wakimhudumia”; nahau ya Kiebrania “kusimama mbele yake” inaweza kumaanisha huduma katika ikulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: aliacha
  rationale: Kitenzi עזב humaanisha kuacha au kutupilia mbali. “Aliacha” ni Kiswahili cha kawaida na hapa huonyesha kwamba hakufuata shauri hilo.
- source_word: עֲצַת
  choice: shauri
  rationale: עֵצָה hapa ni mwongozo aliopewa mfalme; “shauri” ni neno la kawaida na lenye hadhi linalofaa muktadha.
- source_word: הַזְּקֵנִים
  choice: wazee
  rationale: Neno hilo linahusu watu wakubwa kwa umri wenye jukumu la ushauri; “wazee” huhifadhi umri na hadhi yao.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: walilompa
  rationale: Kwa kuwa “shauri” limetajwa tayari, “walilompa” hutoa Kiswahili cha asili bila kurudia kitenzi cha kushauri kwa namna nzito.
- source_word: וַיִּוָּעַץ
  choice: akashauriana na
  rationale: Nifali ya יעץ hapa ina maana ya kutafuta au kufanya mashauriano; “akashauriana na” huhifadhi dhana ya kushirikiana katika ushauri.
- source_word: הַיְלָדִים
  choice: vijana
  rationale: Ingawa neno linaweza kutaja watoto au wavulana, muktadha unaonyesha watu wa rika la Rehoboamu; “vijana” huepuka kuwafanya waonekane watoto wadogo.
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: waliokua pamoja naye
  rationale: Usemi huu unaonyesha kuwa walilelewa au walifikia utu uzima pamoja naye; tafsiri hii ni ya moja kwa moja na ya asili.
- source_word: אֲשֶׁר הָעֹמְדִים לְפָנָיו
  choice: waliokuwa wakihudumu mbele yake
  rationale: Nahau “kusimama mbele ya” inaweza kumaanisha kumhudumia mtu katika ikulu. Tafsiri kuu inaonyesha kazi hiyo huku “mbele yake” ikihifadhi taswira ya Kiebrania; maana halisi zaidi imewekwa katika tanbihi.
