  yaml_path: translation/ot/1_kings/012/029.yaml
  text: He set one in Bethel[a], and the other he put in Dan.
translation:
  language: sw
  text: Akaweka mmoja Betheli[a], na mwingine Dani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yaani, mmoja wa ndama wawili waliotajwa katika mstari uliotangulia. Au: “Akaweka ndama mmoja Betheli, na mwingine Dani.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Akamweka
  rationale: Kitenzi שׂים humaanisha kuweka au kutia mahali fulani. Muundo wenye kiambishi cha yambwa '-m-' ni wa kawaida kwa kitu kinachorejelewa kwa ngeli ya mnyama, yaani ndama wa mstari uliotangulia.
- source_word: אֶת הָאֶחָד
  choice: mmoja
  rationale: Kiebrania kihalisi kina 'yule mmoja,' lakini katika jozi inayogawanywa, Kiswahili cha kawaida hutumia 'mmoja' na 'yule mwingine.' Nomino imeachwa wazi kama ilivyo katika chanzo.
- source_word: בְּבֵית אֵל
  choice: Betheli
  rationale: בְ hapa huonyesha mahali. Jina la mahali בֵּית־אֵל limetolewa kwa umbo la Kiswahili lililozoeleka, 'Betheli,' bila kulitafsiri kuwa 'nyumba ya Mungu.'
- source_word: וְאֶת הָאֶחָד
  choice: na yule mwingine
  rationale: 'Ingawa maneno ya Kiebrania ni kihalisi ''na yule mmoja,'' muktadha wa vitu viwili unahitaji utofautishaji wa kawaida wa Kiswahili: ''na yule mwingine.'''
- source_word: נָתַן
  choice: akamweka
  rationale: Katika muktadha wa mahali, נתן ina maana ya kuweka. Kurudia 'akamweka' ni kwa kawaida na kwa uwazi katika Kiswahili, hata ingawa Kiebrania kimetumia kitenzi tofauti chenye maana inayokaribiana.
- source_word: בְּדָן
  choice: Dani
  rationale: בְ huonyesha mahali, na דָּן ni jina la mahali. 'Dani' ni umbo la Kiswahili linalotambulika.
theological_decisions:
- issue: Kirejelewa cha 'mmoja' na 'yule mwingine'
  choice: Nomino 'ndama' haijaongezwa katika matini kuu; maneno hayo yanarejelea ndama wawili waliotajwa katika mstari uliotangulia.
  alternative: Akamweka ndama mmoja Betheli, na yule mwingine akamweka Dani.
  rationale: Kiebrania hakirudii nomino katika mstari huu. Kuacha kirejelewa kikiwa wazi kunahifadhi udondoshaji wa chanzo, huku tanbihi ikifafanua maana inayotokana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Majina ya mahali yametolewa kwa maumbo ya Kiswahili yaliyozoeleka. Udondoshaji wa nomino katika Kiebrania umehifadhiwa, na ufafanuzi umetolewa katika tanbihi.
