base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/018.yaml
  text: Then King Rehoboam sent Adoram[a], who was over the forced labor, and all Israel stoned him with stones, and he died[c][b]. And King Rehoboam made haste to get up into the chariot to flee to Jerusalem.
translation:
  language: sw
  text: Ndipo Mfalme Rehoboamu akamtuma Adoramu[a], aliyekuwa msimamizi wa kazi ya kulazimishwa. Israeli wote wakampiga kwa mawe, naye akafa.[b] Mfalme Rehoboamu akajikaza kupanda gari ili akimbilie Yerusalemu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Adoramu”; katika vifungu vingine vinavyohusiana jina hili lina umbo “Adoniramu.”'
    reason: alternative_reading
  - marker: b
    text: Kiebrania kinasema kihalisi, “wakampiga kwa jiwe”; neno “jiwe” limetumiwa kwa maana ya pamoja.
    reason: lexical_alternative
  - marker: c
    text: Au, “akafanya haraka kupanda gari.” Kiebrania kinasema kwa maana ya karibu zaidi, “akajitia nguvu kupanda gari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akamtuma
  rationale: Ni kitenzi cha kawaida cha masimulizi kinachoonyesha kwamba Rehoboamu alimpeleka Adoramu kwa jukumu fulani.
- source_word: אֲדֹרָם
  choice: Adoramu
  rationale: Hili ndilo umbo la jina lililo katika maandishi ya Kiebrania hapa; limeandikwa kwa namna inayotamkika kwa kawaida katika Kiswahili.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: aliyekuwa msimamizi wa kazi ya kulazimishwa
  rationale: Kirai hiki kinamtambulisha Adoramu kuwa afisa aliyesimamia kazi ya lazima iliyotozwa na serikali, si kodi ya fedha.
- source_word: כָל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Inahifadhi jina la pamoja la kisiasa na la kitaifa lililotumiwa katika simulizi bila kulibadili kuwa maelezo ya makabila fulani.
- source_word: וַיִּרְגְּמוּ ... אֶבֶן
  choice: wakampiga kwa mawe
  rationale: Ni Kiswahili cha kawaida kinachowasilisha wazi tendo la kumpiga mtu kwa mawe huku kikihifadhi picha halisi ya Kiebrania.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Inaendeleza mfuatano wa simulizi na kueleza wazi matokeo ya kupigwa kwa mawe.
- source_word: הִתְאַמֵּץ
  choice: akajikaza
  rationale: Inaonyesha kujitia nguvu au kufanya juhudi ya haraka bila kuondoa kabisa maana ya msingi ya kujikaza.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: kupanda gari
  rationale: Kitenzi עלה pamoja na מֶרְכָּבָה humaanisha kupanda gari; tafsiri hii ni ya kawaida na haiongezi maelezo yasiyotajwa katika chanzo.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: ili akimbilie Yerusalemu
  rationale: Kitenzi נוס kinaonyesha kukimbia hatari, si kuondoka kwa kawaida.
theological_decisions:
- issue: Maana ya pamoja ya כָל יִשְׂרָאֵל
  choice: Israeli wote
  alternative: Waisraeli wote
  rationale: Chaguo hili linahifadhi Israeli kama jina la pamoja la watu na jumuiya ya kisiasa, bila kuamua kimya-kimya kama kila mtu mmoja mmoja alihusika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida, wa heshima na unaoeleweka. “Kazi ya kulazimishwa” imechaguliwa badala ya istilahi ya kitaalamu kama “corvée.” “Akajikaza” hudumisha maana ya juhudi binafsi huku tanbihi ikionyesha maana ya karibu zaidi na uwezekano wa kuelewa tendo hilo kuwa la haraka.
