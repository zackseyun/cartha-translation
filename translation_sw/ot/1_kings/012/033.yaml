base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/033.yaml
  text: And he went up to the altar that he had made in Bethel on the fifteenth day in the eighth month[a], in the month that he had devised from his own heart, and he made a feast for the sons of Israel[b]; and he went up to the altar to burn incense.
translation:
  language: sw
  text: Akapanda madhabahuni, kwenye madhabahu aliyokuwa ameifanya huko Betheli, siku ya kumi na tano ya mwezi wa nane, mwezi alioubuni moyoni mwake[a]. Akafanya sikukuu kwa ajili ya wana wa Israeli[b], kisha akapanda madhabahuni ili kufukiza uvumba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwezi ambao alikuwa ameuchagua mwenyewe.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “wana wa Israeli,” jina la kawaida linalomaanisha watu wa taifa la Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda kwenda
  rationale: Kitenzi עלה humaanisha kupanda au kwenda juu. Tafsiri hii inadumisha wazo la kupanda na marudio ya kitenzi katika simulizi.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa מזבח katika muktadha wa ibada na dhabihu.
- source_word: אֲשֶׁר עָשָׂה בְּבֵית־אֵל
  choice: aliyokuwa ametengeneza huko Betheli
  rationale: Muundo huu unaonyesha kwamba madhabahu ilikuwa imetengenezwa hapo awali, na בְּ inaonyesha mahali.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: siku ya kumi na tano ya mwezi wa nane
  rationale: Hii ni njia ya kawaida na iliyo wazi ya kutaja tarehe kwa Kiswahili.
- source_word: בַּחֹדֶשׁ אֲשֶׁר בָּדָא מִלְּבַד
  choice: mwezi ambao alikuwa ameubuni kutoka moyoni mwake
  rationale: בדא ina maana ya kubuni, na usemi unaofuata unaonyesha chanzo chake mwenyewe. 'Kutoka moyoni mwake' huhifadhi picha ya Kiebrania na tathmini ya msimulizi bila kuiongeza.
- source_word: וַיַּעַשׂ חָג
  choice: akawawekea ... sikukuu
  rationale: עשה pamoja na חג humaanisha kufanya, kuandaa, au kuanzisha sikukuu. 'Akawawekea' ni ya asili kwa Kiswahili na hudumisha kwamba Yeroboamu ndiye aliyeifanya kwa ajili yao.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi muundo halisi wa jina la kitaifa בני ישראל. Tanbihi inaeleza kwamba usemi huo unalihusu taifa la Israeli kwa ujumla.
- source_word: לְהַקְטִיר
  choice: ili kufukiza uvumba
  rationale: Katika muktadha huu wa ibada, הקטיר inaeleweka kwa kawaida kuwa kufukiza uvumba, ingawa kimsingi inaweza kumaanisha kufanya kitu kipande kama moshi.
theological_decisions:
- issue: Kauli ya tathmini בָּדָא מִלְּבַד kuhusu mwezi wa sikukuu wa Yeroboamu
  choice: alikuwa ameubuni kutoka moyoni mwake
  alternative: alikuwa ameuchagua mwenyewe
  rationale: Tafsiri iliyochaguliwa huhifadhi nahau ya Kiebrania na dokezo la kwamba mwezi huo haukuamriwa na Mungu bali ulitokana na uamuzi wa Yeroboamu mwenyewe.
- issue: Tafsiri ya בני ישראל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Muundo rasmi wa Kiebrania umehifadhiwa, huku tanbihi ikifafanua kuwa ni jina la kawaida la taifa zima, si lazima wanaume peke yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Marudio ya וַיַּעַל yamehifadhiwa; alama zote za tanbihi zimo katika maandishi.
