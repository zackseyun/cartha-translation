base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/004.yaml
  text: Your father made our yoke heavy[a]. So now, lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: sw
  text: Baba yako aliifanya nira yetu kuwa ngumu.[a] Basi sasa, tupunguzie utumishi mgumu[b] wa baba yako na nira yake nzito aliyotuwekea, nasi tutakutumikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliifanya nira yetu kuwa nzito.” Kiebrania kinatumia taswira ya nira kuwakilisha masharti mazito ya utawala.
    reason: lexical_alternative
  - marker: b
    text: “Utumishi mgumu” pia inaweza kutafsiriwa “kazi ngumu” au “utumishi wa taabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה אֶת עֻלֵּנוּ
  choice: alifanya nira yetu kuwa nzito
  rationale: Hifadhi taswira halisi ya nira na maana ya kisababishi ya kitenzi; “nzito” ni ya asili kwa Kiswahili na inaunganisha kauli hii na “nira nzito” baadaye.
- source_word: עֻלֵּנוּ
  choice: nira yetu
  rationale: “Nira” huhifadhi sitiari ya masharti mazito ya utawala, kama vile kazi na tozo, badala ya kuibadili moja kwa moja kuwa “mzigo.”
- source_word: עַתָּה הָקֵל
  choice: Basi sasa, tupunguzie
  rationale: “Basi sasa” huonyesha mpito kutoka malalamiko kwenda ombi; “tupunguzie” ni ombi la kawaida la Kiswahili lenye maana ya kufanya mzigo uwe mwepesi.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: utumishi mgumu wa baba yako
  rationale: עֲבֹדָה inaweza kumaanisha utumishi au kazi iliyodaiwa chini ya utawala. “Utumishi mgumu” huhifadhi upana huo bila kuamua kimya kimya kwamba ni kazi ya mikono pekee.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: na nira nzito
  rationale: Hifadhi sitiari na kivumishi cha Kiebrania; katika Kiswahili, kitenzi “tupunguzie” kinaweza kutawala vipashio vyote viwili kwa mtiririko wa kawaida.
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: aliyotuwekea
  rationale: Ni Kiswahili cha kawaida kwa kuweka au kulazimisha mzigo juu ya watu, huku kikihifadhi uhusiano wa nira na wale walioibeba.
- source_word: וְנַעַבְדֶךָּ
  choice: nasi tutakutumikia
  rationale: Huonyesha ahadi au matokeo ya kukubaliwa kwa ombi lao; “kutumikia” pia hudumisha uhusiano wa kimsamiati na “utumishi.”
