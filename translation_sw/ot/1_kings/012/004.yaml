  source_fidelity: The draft preserves the central yoke metaphor, the request to ease the imposed obligations, and the consequent pledge of service. However, the first Hebrew verb, הִקְשָׁה, means “made hard/harsh,” whereas the draft renders it “made ... heavy,” thereby merging it with the distinct later description of the yoke as כָּבֵד (“heavy”).
  naturalness: The wording is generally clear Standard East African Swahili. “Tupunguzie” is natural in this request. Adding the possessive in “nira yake nzito” clarifies the Hebrew suffix and improves the linkage of the relative clause.
  terminology: “Nira,” “utumishi mgumu,” and “kutumikia” are appropriate and retain the source’s metaphor and lexical connections. The initial description should be “ngumu,” while “nzito” should remain for the later yoke.
  issues:
  - severity: medium
    issue: The first occurrence of the yoke is rendered “nzito” rather than “ngumu.”
    rationale: The Hebrew deliberately uses הִקְשָׁה (“made hard/harsh”) first and הַכָּבֵד (“heavy”) later. Retaining this distinction better reflects the source while remaining idiomatic in Swahili.
  - severity: low
    issue: Footnote b is anchored after the whole yoke clause rather than at “utumishi mgumu.”
    rationale: The note concerns the rendering of עֲבֹדָה, so placing its marker directly after “utumishi mgumu” gives a precise anchor.
