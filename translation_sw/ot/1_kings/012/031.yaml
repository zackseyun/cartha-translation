  text: He made houses of high places[a], and he appointed priests from among all the people[b], who were not from the sons of Levi.
translation:
  language: sw
  text: Akafanya nyumba za mahali pa juu[a], na akateua makuhani kutoka miongoni mwa watu wote; hao hawakuwa wa wana wa Lawi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “nyumba ya mahali pa juu”; hii ni nahau inayomaanisha mahali au majengo ya ibada yaliyohusishwa na mahali pa juu.
    reason: lexical_alternative
  - marker: b
    text: Au, “hao hawakuwa Walawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akajenga / akaweka
  rationale: Kitenzi עשה kina maana pana ya ‘kufanya.’ Katika kishazi cha kwanza, ‘akajenga’ ni Kiswahili cha kawaida kwa kuanzisha majengo ya ibada; katika cha pili, ‘akaweka’ huonyesha kuwateua watu kuwa makuhani bila kudai utaratibu maalumu wa kuwaweka wakfu.
- source_word: בֵּית בָּמוֹת
  choice: nyumba za ibada mahali pa juu
  rationale: Kirai hiki kwa tafsiri ya neno kwa neno ni ‘nyumba ya mahali pa juu,’ lakini ni nahau ya mahali au majengo ya ibada yanayohusishwa na mahali pa juu. Wingi wa Kiswahili unaonyesha aina ya vituo vya ibada bila kufanya sentensi iwe ngumu.
- source_word: כֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida na linalofaa katika muktadha wa ibada.
- source_word: מִקְצוֹת הָעָם
  choice: kutoka miongoni mwa watu wote
  rationale: Kirai kinaonyesha kwamba makuhani walichaguliwa kutoka kwa watu kwa ujumla, si kutoka katika ukoo halali wa kikuhani. Tafsiri hii ni ya kawaida katika Kiswahili na inaendeleza utofautishaji unaofuata.
- source_word: אֲשֶׁר לֹא הָיוּ מִבְּנֵי לֵוִי
  choice: ambao hawakuwa wa uzao wa Lawi
  rationale: ‘Uzao wa Lawi’ huhifadhi lugha ya kifamilia na kikabila ya Kiebrania huku ikiwa ya kawaida na inayoeleweka katika Kiswahili.
theological_decisions:
- issue: Taasisi za ibada alizoanzisha Yeroboamu
  choice: nyumba za ibada mahali pa juu
  alternative: nyumba ya mahali pa juu
  rationale: Tafsiri inaonyesha mazingira ya ibada ya kirai cha Kiebrania bila kuongeza hukumu ya kitheolojia ambayo haijasemwa wazi katika mstari huu.
- issue: Makuhani kutokuwa wa ukoo wa Lawi
  choice: ambao hawakuwa wa uzao wa Lawi
  alternative: ambao hawakuwa Walawi
  rationale: Uchaguzi huu huhifadhi wazi tofauti ya kihistoria na kikabila iliyomo katika maandishi bila kuongeza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ‘Akajenga … akaweka’ ni wa asili katika masimulizi ya Biblia, na istilahi ‘nyumba za ibada’ hufafanua maana ya kiibada bila lugha ya kimadhehebu.
