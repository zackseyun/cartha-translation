base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/010.yaml
  text: 'The young men who had grown up with him spoke to him, saying, “This is what you shall say to this people who spoke to you, saying, ‘Your father made our yoke heavy, but you, make it lighter for us’: this is what you shall say to them, ‘My little finger is thicker than my father’s waist.’”'
translation:
  language: sw
  text: 'Vijana waliokulia pamoja naye wakamwambia, “Hivi ndivyo utakavyowaambia watu hawa waliokuambia, ‘Baba yako aliifanya nira yetu kuwa nzito, lakini wewe utupunguzie uzito wake.’ Hivi ndivyo utakavyowaambia: ‘Kidole changu kidogo ni kinene kuliko kiuno cha baba yangu.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיְלָדִים
  choice: Vijana
  rationale: Katika muktadha huu neno linawarejelea watu wa rika la Rehoboamu waliokua pamoja naye, si watoto wadogo.
- source_word: עֻלֵּנוּ
  choice: nira yetu
  rationale: Huhifadhi sitiari ya Kiebrania kuhusu mzigo mzito wa utawala na kazi iliyolazimishwa.
- source_word: הָקֵל מֵעָלֵינוּ
  choice: utupunguzie uzito wake
  rationale: Huonyesha ombi la kuifanya nira iliyotajwa iwe nyepesi bila kuongeza jambo lisilokuwamo katika chanzo.
- source_word: קָטָנִּי
  choice: Kidole changu kidogo
  rationale: Ingawa neno la Kiebrania lina maana ya kitu kidogo changu, katika msemo huu linaeleweka kwa kawaida kuwa kidole kidogo.
- source_word: מָתְנֵי אָבִי
  choice: kiuno cha baba yangu
  rationale: Tafsiri ya moja kwa moja na ya asili ya taswira ya kulinganisha unene au nguvu.
