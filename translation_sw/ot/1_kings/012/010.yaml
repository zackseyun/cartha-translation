  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Marudio ya ‘hivi’ yamehifadhi muundo wa maagizo ya usemi katika Kiebrania, huku sentensi ikifanywa kuwa ya kawaida katika Kiswahili.
