base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: sw
  text: Kisha Mfalme Rehoboamu akawaomba ushauri wazee waliokuwa wakisimama mbele ya Sulemani,[a] baba yake, alipokuwa hai, akisema, “Mnanishauri niwajibu nini watu hawa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “waliokuwa wakisimama mbele ya Sulemani.” Usemi huo unaweza kumaanisha waliokuwa wakimhudumia au kuhudumu katika ikulu yake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: akawataka shauri
  rationale: Nifali ya יעץ hapa inaonyesha kwamba Rehoboamu aliwaendea wengine ili kupata shauri; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: Mfalme Rehoboamu
  rationale: Kiswahili huweka cheo kabla ya jina kwa mtiririko wa kawaida.
- source_word: הַזְּקֵנִים
  choice: wazee
  rationale: Katika mazingira ya kifalme, neno hili linamaanisha wazee wenye hadhi na uzoefu, ambao walikuwa washauri wa mfalme, si wanaume wenye umri mkubwa tu.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים אֶת־פְּנֵי שְׁלֹמֹה
  choice: waliokuwa wakihudumu mbele ya ... Sulemani
  rationale: Nahau ya Kiebrania ‘kusimama mbele ya’ humaanisha kuhudumu au kuwa mhudumu katika ikulu; tafsiri hii inaleta maana hiyo kwa Kiswahili cha kawaida huku ‘mbele ya’ ikihifadhi taswira ya chanzo.
- source_word: אָבִיו
  choice: baba yake
  rationale: Hurejelea moja kwa moja uhusiano wa Sulemani na Rehoboamu.
- source_word: בִּהְיֹתוֹ חַי
  choice: alipokuwa hai
  rationale: Kishazi hiki kinaeleza kuwa wazee hao walimhudumia Sulemani wakati wa uhai wake.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: Mnanishauri
  rationale: Kauli hii inaomba ushauri wao; kiambishi cha yambwa ‘-ni-’ kinaeleweka kutokana na mazingira na hufanya swali liwe la kawaida katika Kiswahili.
- source_word: לְהָשִׁיב ... דָּבָר
  choice: niwajibu nini
  rationale: Kwa pamoja, maneno haya yana maana ya kutoa jibu. ‘Niwajibu nini’ ni ya asili katika Kiswahili na inawakilisha ‘kuwarudishia watu hawa neno’ bila ugumu wa tafsiri ya neno kwa neno.
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: עם ni nomino ya jamii; Kiswahili kwa kawaida hutumia wingi ‘watu hawa,’ ambao pia unaweza kudumisha sauti ya kuwaweka mbali.
