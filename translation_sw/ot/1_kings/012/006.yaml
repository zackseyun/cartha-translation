    rationale: Tanbihi inaeleza ‘waliokuwa wakisimama mbele ya Sulemani,’ kwa hiyo alama inapaswa kuwekwa baada ya fungu hilo, si baada ya ‘alipokuwa hai.’
  - severity: low
