  to: Kisha Mfalme Rehoboamu akawaomba ushauri wazee waliokuwa wakisimama mbele ya Sulemani,[a] baba yake, alipokuwa hai, akisema, “Mnanishauri niwajibu nini watu hawa?”
  rationale: Marekebisho yanaweka Sulemani wazi kuwa ndiye baba yake Rehoboamu na ndiye ambaye wazee walikuwa mbele yake, yanaunganisha tanbihi na nahau yake sahihi, na yanatumia usemi wa kawaida wa Kiswahili kwa tendo la kutafuta ushauri. Maana, hadhi ya simulizi, na uwazi wa swali la mwisho vimehifadhiwa.
