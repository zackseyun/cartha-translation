lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: imeendelea kuasi
  rationale: Katika muktadha huu wa kisiasa, פשע humaanisha kuasi utawala. Kauli hii inaonyesha uasi ulioanza katika simulizi na hali yake iliyoendelea, kama inavyothibitishwa na kirai ‘mpaka leo.’
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa limehifadhiwa; hapa linamaanisha makabila ya kaskazini kwa pamoja, yakitofautishwa na nasaba ya Daudi.
- source_word: בְּבֵית דָּוִד
  choice: dhidi ya nyumba ya Daudi
  rationale: Kihusishi ב pamoja na פשע kinaonyesha upande ulioasiwa, na ‘nyumba ya Daudi’ huhifadhi maana ya nasaba ya kifalme.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Hii ni tafsiri ya kawaida na ya asili ya nahau ya Kiebrania inayoonyesha kuendelea kwa hali hadi wakati wa mwandishi.
