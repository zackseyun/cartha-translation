  to: 'Yahwe asema hivi: “Msipande wala msipigane dhidi ya ndugu zenu, wana wa Israeli.[a] Rudini, kila mtu nyumbani kwake, kwa maana jambo hili limetoka kwangu.”[b] Basi wakalisikiliza neno la Yahwe, wakageuka wakarudi kama neno la Yahwe lilivyosema.'
