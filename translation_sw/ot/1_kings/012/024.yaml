review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the divine prohibition, the kinship/appositional description of Israel, the command to return home, the divine origin of the matter, and the people''s compliance. The final clause, however, is not idiomatic as written: “wakageuka na kurudi” coordinates a finite verb with an infinitive and awkwardly duplicates the return sense.'
  naturalness: Standard East African Swahili is generally clear and appropriately formal. Repeating the negative subject marker in “msipande wala msipigane” makes the paired prohibitions grammatically complete and more natural. “Wakageuka wakarudi” is natural and retains the Hebrew's return/turn-back sense.
  terminology: “Yahwe,” “ndugu zenu,” “wana wa Israeli,” and “neno la Yahwe” are suitable, consistent renderings. “Jambo hili limetoka kwangu” appropriately expresses the source's statement of divine origin without over-defining causation.
  issues:
  - severity: medium
    issue: The second negative verb lacks its subject marker.
    rationale: “Msipande wala kupigana” is understandable, but the direct prohibition is more grammatically complete in Swahili as “Msipande wala msipigane.” This also better represents the Hebrew's two coordinated prohibitions.
  - severity: medium
    issue: The final verbal sequence is unidiomatic.
    rationale: “Wakageuka na kurudi” combines a finite past verb with an infinitive. “Wakageuka wakarudi” is idiomatic, preserves the turn-back/return action, and maintains the meaning in natural Swahili.
  revised_text: 'Yahwe asema hivi: “Msipande wala msipigane dhidi ya ndugu zenu, wana wa Israeli.[a] Rudini, kila mtu nyumbani kwake, kwa maana jambo hili limetoka kwangu.”[b] Basi wakalisikiliza neno la Yahwe, wakageuka wakarudi kama neno la Yahwe lilivyosema.'
  revised_footnotes:
