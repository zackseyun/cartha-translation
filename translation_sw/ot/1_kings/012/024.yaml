reference: 1 Kings 12:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹֽא תַעֲלוּ֩ וְ/לֹא תִלָּ֨חֲמ֜וּ/ן עִם אֲחֵי/כֶ֣ם בְּנֵֽי יִשְׂרָאֵ֗ל שׁ֚וּבוּ אִ֣ישׁ לְ/בֵית֔/וֹ כִּ֧י מֵ/אִתִּ֛/י נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יִּשְׁמְעוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יָּשֻׁ֥בוּ לָ/לֶ֖כֶת כִּ/דְבַ֥ר יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/024.yaml
  text: 'Thus says Yahweh: ‘Do not go up or fight against your brothers[a], the sons of Israel. Return, each man to his house[c][b], for this thing is from me.’ So they listened to the word of Yahweh and turned back to go according to the word of Yahweh.'
translation:
  language: sw
  text: 'Yahwe asema hivi: “Msipande wala msipigane dhidi ya ndugu zenu, wana wa Israeli.[a] Rudini, kila mtu nyumbani kwake, kwa maana jambo hili limetoka kwangu.”[b] Basi wakalisikiliza neno la Yahwe, wakageuka wakarudi kama neno la Yahwe lilivyosema.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi kina “ndugu zenu, wana wa Israeli.” Lugha ya undugu inasisitiza kwamba wangekuwa wakipigana na watu wao wenyewe.
    reason: cultural_note
  - marker: b
    text: Au “kwa maana jambo hili limetokana nami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahwe asema hivi
  rationale: Huhifadhi muundo wa kawaida wa ujumbe wa kinabii na kulitaja jina la agano יְהוָה kwa namna yake ya kawaida katika Kiswahili.
- source_word: לֹא תַעֲלוּ
  choice: Msipande
  rationale: Kitenzi עלה humaanisha kupanda au kwenda juu; hapa kinaweza pia kudokeza kusonga kwenda vitani. “Msipande” huhifadhi taswira ya Kiebrania bila kuongeza maelezo yasiyotajwa.
- source_word: וְלֹא תִלָּחֲמוּן עִם
  choice: wala kupigana dhidi ya
  rationale: Niphal ya לחם humaanisha kupigana. Ingawa עִם kwa kawaida ni “na,” pamoja na kitenzi hiki humaanisha kupigana dhidi ya mtu.
- source_word: אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: ndugu zenu, wana wa Israeli
  rationale: “Ndugu zenu” huhifadhi lugha muhimu ya undugu, na “wana wa Israeli” huhifadhi kirai cha ufafanuzi kilicho katika chanzo.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Rudini, kila mtu nyumbani kwake
  rationale: Amri ya kurudi na maana ya mgawanyo ya אִישׁ zimewasilishwa kwa Kiswahili cha kawaida. “Nyumbani kwake” ni ya asili zaidi kuliko “kwenye nyumba yake” katika muktadha wa kurudi.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: kwa maana jambo hili limetoka kwangu
  rationale: Hueleza kwamba jambo hilo lina asili kwa Mungu bila kufafanua kupita kiasi namna ya usababishaji wake.
- source_word: וַיִּשְׁמְעוּ אֶת דְּבַר יְהוָה
  choice: wakalisikiliza neno la Yahwe
  rationale: שׁמע inaweza kuwa kusikia, kusikiliza, au kutii. “Kusikiliza” huhifadhi maana ya kusikia huku tendo linalofuata likionyesha utiifu.
- source_word: וַיָּשֻׁבוּ לָלֶכֶת כִּדְבַר יְהוָה
  choice: wakageuka na kurudi kama neno la Yahwe lilivyosema
  rationale: Kiswahili hiki cha kawaida kinawasilisha kugeuka kwao na kurudi kwao kwa kufuata ujumbe wa Yahwe, bila kulazimisha muundo wa Kiebrania usio wa kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Lugha ya undugu אֲחֵיכֶם
  choice: ndugu zenu
  alternative: Waisraeli wenzenu
  rationale: Lugha ya kifamilia ni ya msingi katika onyo dhidi ya vita vya wenyewe kwa wenyewe, hivyo imehifadhiwa badala ya kugeuzwa kuwa utambulisho wa kitaifa pekee.
- issue: Kiwango cha usababishaji katika מֵאִתִּי נִהְיָה
  choice: jambo hili limetoka kwangu
  alternative: jambo hili limetokea kwa sababu yangu
  rationale: Kauli iliyochaguliwa huhifadhi dai la asili ya kimungu huku ikiacha wazi kwa kiasi fulani namna halisi ya usababishaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kinabii umehifadhiwa, lakini sentensi ya mwisho imetolewa kwa mtiririko wa kawaida wa Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
