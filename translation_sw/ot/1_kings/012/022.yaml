  text: And the word of God came to Shemaiah the man of God[a], saying,
translation:
  language: sw
  text: 'Neno la Mungu[a] likamjia Shemaya, mtu wa Mungu, likisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “neno la Mungu.” Tafsiri nyingi hutumia “neno la BWANA” katika kauli zinazofanana, lakini hapa maandishi yanasema wazi “Mungu” (אֱלֹהִים), si jina la Mungu YHWH.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְּבַר ... אֶל
  choice: neno ... likamjia
  rationale: Huu ni mtindo wa kawaida wa Kiebrania wa kueleza kwamba ujumbe wa Mungu ulifikishwa kwa mtu. “Likamjia” ni Kiswahili cha asili kinachohifadhi maana ya tukio hilo.
- source_word: דְּבַר
  choice: neno
  rationale: Katika kauli hii ya ufunuo, neno hili linamaanisha mawasiliano kutoka kwa Mungu. “Neno” linahifadhi pia mtindo wa kibiblia kuliko “ujumbe.”
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Neno la Kiebrania ni אֱלֹהִים, likimtaja Mungu wa kweli; hapa si jina la Mungu YHWH.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Jina limetoholewa kwa tahajia inayoeleweka katika Kiswahili huku likikaribia matamshi ya Kiebrania.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hiki ni cheo kinachomtambulisha Shemaya katika jukumu lake la kinabii.
- source_word: לֵאמֹר
  choice: likisema
  rationale: Neno hili linatanguliza maneno ya Mungu yanayofuata katika mstari unaofuata; “likisema” hudumisha kiunganishi hicho cha usemi.
theological_decisions:
- issue: Tafsiri ya אֱלֹהִים katika kauli ya ufunuo
  choice: Mungu
  alternative: BWANA
  rationale: Maandishi ya Kiebrania hapa yana אֱלֹהִים, si jina la Mungu YHWH. Tafsiri haipaswi kulinganisha kifungu hiki kimyakimya na kauli nyingine zinazosema “neno la BWANA.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa kinabii “neno la Mungu likamjia” umehifadhiwa bila kuwa mgumu kupita kiasi.
