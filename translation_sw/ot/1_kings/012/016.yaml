  text: וַ/יַּ֣רְא כָּל יִשְׂרָאֵ֗ל כִּ֠י לֹֽא שָׁמַ֣ע הַ/מֶּלֶךְ֮ אֲלֵי/הֶם֒ וַ/יָּשִׁ֣בוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ דָּבָ֣ר לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜ד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑ד וַ/יֵּ֥לֶךְ יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/016.yaml
  text: When all Israel saw that the king had not listened to them[a], the people answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. To your tents, O Israel! Now see to your own house[b], David.” So Israel went to their tents.
translation:
  language: sw
  text: Israeli wote walipoona kwamba mfalme hakuwasikiliza, watu wakamjibu mfalme wakisema, “Tuna fungu gani katika Daudi? Wala hatuna urithi katika mwana wa Yese. Nendeni hemani kwenu, enyi Israeli![a] Sasa shughulikia nyumba yako mwenyewe[b], Daudi.” Basi Israeli wakaenda hemani kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nendeni nyumbani kwenu, enyi Israeli!” Kiebrania kinasema moja kwa moja “hemani kwenu,” nahau ya kutawanyika na kujiondoa katika utii.
    reason: lexical_alternative
  - marker: b
    text: '“Nyumba” hapa yaweza pia kumaanisha “nasaba”: “Shughulikia nasaba yako mwenyewe, Daudi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא כָּל יִשְׂרָאֵל
  choice: Israeli wote walipoona
  rationale: ‘Kuona’ inadumisha nahau ya Kiebrania, ambayo katika muktadha pia ina maana ya kutambua msimamo wa mfalme; ‘Israeli wote’ inahifadhi usemi wa pamoja wa kisiasa.
- source_word: לֹא שָׁמַע ... אֲלֵיהֶם
  choice: mfalme hakuwasikiliza
  rationale: Kitenzi שׁמע pamoja na אֶל hapa kinamaanisha kusikiliza kwa kukubali au kutii ombi, si kusikia sauti tu.
- source_word: וַיָּשִׁבוּ הָעָם אֶת־הַמֶּלֶךְ דָּבָר
  choice: watu wakamjibu mfalme
  rationale: Hii ni nahau ya Kiebrania ya kutoa jibu; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: מַה לָּנוּ חֵלֶק בְּדָוִד
  choice: Tuna fungu gani katika Daudi?
  rationale: ‘Fungu’ linahifadhi maana ya sehemu au mgao na nguvu ya kauli ya kukataa utii wa kisiasa kwa nyumba ya Daudi.
- source_word: וְלֹא נַחֲלָה בְּבֶן־יִשַׁי
  choice: Wala hatuna urithi katika mwana wa Yese
  rationale: ‘Urithi’ linahifadhi taswira ya milki au mgao wa kikabila, huku ‘mwana wa Yese’ ikidumisha namna ya kumtaja Daudi bila cheo chake cha kifalme.
- source_word: לְאֹהָלֶיךָ יִשְׂרָאֵל
  choice: Nendeni hemani kwenu, enyi Israeli!
  rationale: ‘Hema’ ndilo neno halisi la Kiebrania. Kauli hii ni mwito wa kutawanyika na kujiondoa katika utii; wingi wa amri ni wa kawaida kwa kumwambia umati katika Kiswahili.
- source_word: עַתָּה רְאֵה בֵיתְךָ דָּוִד
  choice: Sasa shughulikia nyumba yako mwenyewe, Daudi
  rationale: ראה hapa ina nguvu ya ‘angalia/shughulikia’; ‘nyumba’ inahifadhi maana yenye tabaka mbili ya jamaa ya kifalme na nasaba.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל לְאֹהָלָיו
  choice: Basi Israeli wakaenda hemani kwao
  rationale: Tafsiri inadumisha kurudiwa kwa ‘hema’ na inaonyesha kuondoka kwa makabila; upatanisho wa wingi unaeleweka kwa Israeli kama watu wa pamoja.
theological_decisions:
- issue: Kauli ya kisiasa dhidi ya nyumba ya Daudi
  choice: Kauli imetafsiriwa kama kukataa utii kwa Daudi bila kuongeza hukumu ya baadaye ya kiteolojia.
  alternative: Kuifanya iwe kauli dhahiri dhidi ya agano au ya kimasihi, au kuipunguza iwe ugomvi wa nyumbani tu.
  rationale: Mstari unasimulia uasi wa kihistoria dhidi ya Rehoboamu na ufalme wa Daudi. Tafsiri inadumisha uzito wa kisiasa na utata wa ‘nyumba’ bila kutatua mvutano wa kiteolojia kwa niaba ya msomaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya masimulizi ya Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Alama [a] imewekwa kwenye nahau ya ‘hema’. Alama [b] haikuwekwa kimakosa katika rasimu hii; kwa kuwa tanbihi [b] ipo, alama yake inapaswa kuonekana baada ya ‘nyumba yako mwenyewe’ katika matini ya mwisho.
