language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אִֽם יַעֲלֶ֣ה הָ/עָ֣ם הַ/זֶּ֗ה לַ/עֲשׂ֨וֹת זְבָחִ֤ים בְּ/בֵית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ֠/שָׁב לֵ֣ב הָ/עָ֤ם הַ/זֶּה֙ אֶל אֲדֹ֣נֵי/הֶ֔ם אֶל רְחַבְעָ֖ם מֶ֣לֶךְ יְהוּדָ֑ה וַ/הֲרָגֻ֕/נִי וְ/שָׁ֖בוּ אֶל רְחַבְעָ֥ם מֶֽלֶךְ יְהוּדָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/027.yaml
  text: If this people goes up to offer sacrifices in the house of Yahweh in Jerusalem[a], then the heart of this people will return to their lord, to Rehoboam king of Judah[c][b], and they will kill me and return to Rehoboam king of Judah.
translation:
  language: sw
  text: Ikiwa[a] watu hawa watapanda kwenda kutoa dhabihu katika nyumba ya Yahwe[b] huko Yerusalemu, basi moyo wa watu hawa utamrudia bwana wao[c], yaani Rehoboamu mfalme wa Yuda; nao wataniua na kumrudia Rehoboamu mfalme wa Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakati watu hawa watakapopanda kwenda...” Chembe ya Kiebrania inaweza wakati mwingine kuwa na maana ya wakati, lakini hapa inaeleweka vizuri zaidi kama sharti ambalo Yeroboamu analihofia.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya Yahwe” hapa ni hekalu lililokuwa Yerusalemu.
    reason: cultural_note
  - marker: c
    text: Au, “mkuu wao” au “bwana wao.” Neno la Kiebrania linaweza kumaanisha bwana au mwenye mamlaka; hapa linamtaja Rehoboamu, kama maneno yanayofuata yanavyoweka wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Inaonyesha jambo ambalo Yeroboamu anahofia kwamba linaweza kutokea; pia inadumisha nguvu ya sharti ya Kiebrania.
- source_word: יַעֲלֶה
  choice: watapanda kwenda
  rationale: Kitenzi עלה humaanisha kupanda au kwenda juu na hapa kinahusu safari ya kwenda Yerusalemu, hivyo kidokezo cha kijiografia na hija kinahifadhiwa.
- source_word: לַעֲשׂוֹת זְבָחִים
  choice: kutoa dhabihu
  rationale: Hii ndiyo njia ya kawaida na ya asili ya Kiswahili ya kueleza nahau ya Kiebrania ya kufanya dhabihu.
- source_word: בְּבֵית יְהוָה
  choice: katika nyumba ya Yahwe
  rationale: Inahifadhi sitiari ya Kiebrania ya 'nyumba' huku tanbihi ikifafanua kwamba ni hekalu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha jina la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadili kuwa cheo.
- source_word: וְשָׁב לֵב הָעָם הַזֶּה
  choice: basi moyo wa watu hawa utamrudia
  rationale: Inahifadhi umoja wa neno 'moyo' na taswira ya kurudi kwa uaminifu wao kwa mtawala wa zamani.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: bwana wao
  rationale: Ingawa umbo la Kiebrania linaweza kuonekana la wingi, hapa kiambatisho kinamtambulisha mtu mmoja, Rehoboamu; 'bwana' pia huhifadhi maana inayoweza kuwa 'mkuu' au 'mwenye mamlaka'.
- source_word: וַהֲרָגֻנִי
  choice: nao wataniua
  rationale: Ni tafsiri ya moja kwa moja, ya sasa, na inayoeleweka ya kitenzi הרג.
- source_word: וְשָׁבוּ
  choice: na kumrudia
  rationale: Kurudiwa kwa mzizi שׁוב kunahifadhiwa kwa kutumia tena kitenzi 'rudia', jambo linalosisitiza kurudi kwao kisiasa kwa Rehoboamu.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania ina jina la agano moja kwa moja. 'Yahwe' huhifadhi jina hilo bila kulibadili kuwa cheo, huku tanbihi ya hekalu ikisaidia ufafanuzi wa mazingira.
- issue: Maana ya kurudi kwa moyo wa watu
  choice: moyo wa watu hawa utamrudia
  alternative: watu hawa watamtii tena
  rationale: Tafsiri iliyochaguliwa inadumisha taswira ya Kiebrania ya moyo na mvutano wake wa uaminifu wa ndani na wa kisiasa, badala ya kuifafanua kwa neno moja tu kama 'kutii'.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi cha Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo 'watapanda kwenda' unahifadhi wazo la kwenda juu Yerusalemu bila kuwa mgumu; 'moyo wa watu hawa' hudumisha taswira na umoja wa Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
