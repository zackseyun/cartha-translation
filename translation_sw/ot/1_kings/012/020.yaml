base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/020.yaml
  text: And when all Israel heard that Jeroboam had returned[a], they sent and called him to the assembly and made him king over all Israel. None followed the house of David except the tribe of Judah alone.
translation:
  language: sw
  text: Basi, Israeli yote iliposikia kwamba Yeroboamu alikuwa amerudi, wakatuma, wakamwita kwenye kusanyiko, wakamfanya kuwa mfalme juu ya Israeli yote. Hakuna aliyefuata nyumba ya Daudi[a], isipokuwa kabila la Yuda peke yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakuna aliyekuwa upande wa nyumba ya Daudi.” Kihalisi, nahau ya Kiebrania husema “alikuwa nyuma ya nyumba ya Daudi,” ikionyesha kuifuata au kuiunga mkono.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Basi ... iliposikia
  rationale: Muundo huu unatambulisha hatua mpya ya simulizi na wakati wa tendo kwa Kiswahili cha kawaida, bila kutafsiri kineno ‘ikawa’ kwa namna nzito.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli yote
  rationale: Inahifadhi usemi wa Kiebrania unaolitaja taifa kwa ujumla badala ya kuubadili kuwa ‘Waisraeli wote.’
- source_word: כִּי שָׁב יָרָבְעָם
  choice: kwamba Yeroboamu alikuwa amerudi
  rationale: Kitenzi שׁוּב kinamaanisha kurudi; ‘alikuwa amerudi’ linaonyesha kuwa kurudi kulitangulia kusikia na matendo yaliyofuata.
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ אֹתוֹ
  choice: wakatuma watu wakamwita
  rationale: Kiebrania hakitaji kilichotumwa, lakini Kiswahili huhitaji kijalizo ili sentensi isikike kamili. ‘Watu’ linaeleza njia ya kawaida iliyodokezwa na kitendo bila kuongeza cheo maalumu kama ‘wajumbe.’
- source_word: אֶל הָעֵדָה
  choice: kwenye kusanyiko
  rationale: ‘Kusanyiko’ linafaa kwa mkutano wa taifa wenye lengo la kisiasa na halileti maana ya taasisi ya kidini isiyosemwa katika muktadha.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: wakamfanya kuwa mfalme
  rationale: Hiphil ya מלך ina maana ya kumsababisha mtu atawale au kumfanya mfalme. Tafsiri hii haiongezi tendo la kutawaza kwa taji ambalo halikutajwa.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: juu ya Israeli yote
  rationale: Inadumisha usemi wa utawala wa kifalme na upeo wake kama ulivyo katika Kiebrania.
- source_word: לֹא הָיָה אַחֲרֵי בֵית דָּוִד
  choice: Hakuna aliyefuata nyumba ya Daudi
  rationale: Usemi ‘kuwa nyuma ya’ unaonyesha kufuata au kuunga mkono kisiasa. ‘Aliyefuata’ huhifadhi picha ya Kiebrania na kueleweka katika muktadha.
- source_word: זוּלָתִי שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: isipokuwa kabila la Yuda peke yake
  rationale: ‘Isipokuwa’ linaonyesha upekee, na ‘peke yake’ linahifadhi msisitizo wa לְבַדּוֹ.
theological_decisions:
- issue: Usemi wa uaminifu wa kisiasa baada ya ufalme kugawanyika
  choice: Hakuna aliyefuata nyumba ya Daudi
  alternative: Hakuna aliyebaki upande wa nyumba ya Daudi
  rationale: ‘Kufuata’ hudumisha kwa karibu nahau ya Kiebrania na maana yake ya uaminifu au kujipanga kisiasa, bila kuifanya kuwa dai la kidhehebu au kuondoa uwezekano wa maana ya ‘kubaki upande wa.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na hadhi inayofaa maandiko. Neno ‘kusanyiko’ limetumiwa badala ya msamiati unaoweza kusikika wa kikanisa; ‘wakamfanya kuwa mfalme’ huepuka kuongeza sherehe ya taji.
