reference: 1 Kings 12:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: ו/יבאו רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת כָּל בֵּ֨ית יְהוּדָ֜ה וְ/אֶת שֵׁ֣בֶט בִּנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם בֵּ֣ית יִשְׂרָאֵ֔ל לְ/הָשִׁיב֙ אֶת הַ/מְּלוּכָ֔ה לִ/רְחַבְעָ֖ם בֶּן שְׁלֹמֹֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/021.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled all the house of Judah and the tribe of Benjamin, one hundred eighty thousand chosen warriors, to fight against the house of Israel, to restore the kingdom to Rehoboam son of Solomon.
translation:
  language: sw
  text: Rehoboamu alipofika Yerusalemu, akakusanya nyumba yote ya Yuda na kabila la Benyamini, wapiganaji teule laki moja na elfu themanini[a], ili wapigane na nyumba ya Israeli na kuurudisha ufalme kwa Rehoboamu mwana wa Sulemani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaume teule laki moja na elfu themanini walio tayari kwa vita.”
    reason: Neno בָּחוּר na kirai עֹשֵׂה מִלְחָמָה vinaweza kutafsiriwa kwa upana zaidi kama wanaume waliochaguliwa au walio bora wenye uwezo wa kupigana.
lexical_decisions:
- source_word: ויבאו / וַיָּבֹאוּ
  choice: alipofika
  rationale: Ingawa umbo la konsonanti linaonekana kuwa la wingi, muktadha humtaja Rehoboamu mmoja na kitenzi kinachofuata ni cha umoja. ‘Alipofika’ ni Kiswahili cha kawaida kwa kuwasili mahali na kinaunganisha vizuri kishazi cha wakati.
- source_word: וַיַּקְהֵל
  choice: al عkusanya
  rationale: Kitenzi cha Kiebrania katika Hifili humaanisha kuwakusanya watu; ‘al عkusanya’ huhifadhi maana hiyo ya kusababisha mkusanyiko kwa lugha ya kawaida.
- source_word: כָּל בֵּית יְהוּדָה
  choice: nyumba yote ya Yuda
  rationale: ‘Nyumba’ huhifadhi tamathali ya kisiasa na kijamii ya Kiebrania na usambamba wake na ‘nyumba ya Israeli’ baadaye katika aya.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: kabila la Benyamini
  rationale: Neno שֵׁבֶט limetajwa wazi na hapa linamaanisha kabila; hivyo tofauti ya kikabila na kisiasa imehifadhiwa.
- source_word: מֵאָה וּשְׁמֹנִים אֶלֶף
  choice: laki moja na themanini elfu
  rationale: Hii ndiyo namna ya kawaida na inayoeleweka ya kutaja 180,000 katika Kiswahili cha Afrika Mashariki.
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: wapiganaji teule
  rationale: Katika muktadha wa kijeshi, בָּחוּר inaweza kumaanisha watu waliochaguliwa au walio bora, na עֹשֵׂה מִלְחָמָה ni wanaofanya vita. ‘Wapiganaji teule’ ni fupi, ya asili, na huhifadhi dhana zote mbili.
- source_word: לְהִלָּחֵם עִם
  choice: ili wapigane na
  rationale: Muktadha unaonyesha mapambano dhidi ya upande mwingine. Kiswahili ‘kupigana na’ huonyesha wazi uadui huo bila kuongeza maelezo yasiyokuwapo.
- source_word: בֵּית יִשְׂרָאֵל
  choice: nyumba ya Israeli
  rationale: Huhifadhi istilahi ileile ya pamoja kama ‘nyumba ya Yuda’ na kuakisi mgawanyiko wa kisiasa wa ufalme.
- source_word: לְהָשִׁיב אֶת הַמְּלוּכָה
  choice: kuurudisha ufalme
  rationale: Hifili ya שׁוב hapa ni kurudisha au kurejesha. ‘Kuurudisha ufalme’ ni ya kawaida na huacha wazi kama msisitizo ni eneo la ufalme au mamlaka ya kifalme.
- source_word: לִרְחַבְעָם בֶּן שְׁלֹמֹה
  choice: kwa Rehoboamu mwana wa Sulemani
  rationale: Kiambishi ל humtaja mpokeaji au mnufaika wa ufalme unaorudishwa; ‘kwa’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya kisiasa ya הַמְּלוּכָה
  choice: ufalme
  alternative: mamlaka ya kifalme
  rationale: Muktadha unahusu kurudishwa kwa utawala kwa Rehoboamu baada ya mgawanyiko. ‘Ufalme’ ni neno la kawaida na pana, huku tanbihi ikihifadhi uwezekano wa maana ya mamlaka ya kifalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili. Tamathali ‘nyumba ya Yuda/Israeli’ imehifadhiwa kwa usambamba na maana yake ya kisiasa-kijamii.
