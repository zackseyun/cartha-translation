lexical_decisions:
- source_word: אֱמֹר אֶל
  choice: Waambie
  rationale: Kauli ya kuamuru inamtaka mpokeaji awasilishe ujumbe kwa watu kadhaa. “Waambie” ni Kiswahili cha kawaida na chenye kueleweka kwa urahisi katika muktadha huu.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: Rehoboamu mwana wa Sulemani
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili, huku uhusiano wa ukoo ukitafsiriwa moja kwa moja.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Cheo cha kifalme na jina la eneo vinawasilishwa kwa Kiswahili cha moja kwa moja.
- source_word: כָּל בֵּית יְהוּדָה וּבִנְיָמִין
  choice: nyumba yote ya Yuda na Benyamini
  rationale: “Nyumba” inadumisha tamathali ya Kiebrania inayoweza kumaanisha jumuiya au utawala wa Yuda; Benyamini imetajwa kama kundi linalohusishwa nayo.
- source_word: וְיֶתֶר הָעָם
  choice: na watu wengine waliobaki
  rationale: Kauli hii inaonyesha sehemu iliyosalia ya watu bila kuibadili kuwa “jeshi,” neno ambalo halipo wazi katika mstari huu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Katika Kiswahili, nukta mbili hutambulisha kwa ufasaha maneno ya ujumbe yanayofuata, badala ya kutumia muundo mzito wa “akisema.”
