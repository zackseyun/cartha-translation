  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all the house of Judah and Benjamin, and the rest of the people, saying[c][b],
translation:
  language: sw
  text: 'Waambie Rehoboamu mwana wa Sulemani, mfalme wa Yuda, na nyumba yote ya Yuda, na Benyamini, na watu waliosalia[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika muktadha huu, “watu” huenda ni wale waliokusanyika kwa ajili ya vita, lakini Kiebrania hakisemi wazi “jeshi.”
