base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had spoken, saying, “Return to me on the third day.”
translation:
  language: sw
  text: 'Basi Yeroboamu na watu wote wakaja kwa Rehoboamu siku ya tatu, kama vile mfalme alivyokuwa amesema: “Rudini kwangu siku ya tatu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: wakaja
  rationale: Kitenzi בוא kinaweza kumaanisha kuja au kwenda kutegemea mtazamo. Kwa kuwa walimwendea Rehoboamu kama ilivyopangwa, “wakaja kwa Rehoboamu” ni usemi wa kawaida unaofuata mtazamo wa simulizi.
- source_word: יָרָבְעָם
  choice: Yeroboamu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: וְכָל הָעָם
  choice: na watu wote
  rationale: עָם hapa inawahusu kwa ujumla watu waliokuwa wamemwendea mfalme; “watu wote” ni wazi na ya asili.
- source_word: אֶל רְחַבְעָם
  choice: kwa Rehoboamu
  rationale: אֶל huonyesha mwelekeo kuelekea kwa mtu; “kwa Rehoboamu” ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: siku ya tatu
  rationale: Huu ni usemi wa kawaida wa wakati katika Kiswahili na unahifadhi mpangilio wa Kiebrania.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Usemi huu unaonyesha kwamba walifanya sawasawa na maagizo ya awali ya mfalme.
- source_word: דִּבֶּר הַמֶּלֶךְ
  choice: mfalme alivyokuwa amesema
  rationale: Kauli ya mfalme ilitangulia kuja kwao; umbo hili linaonyesha vizuri uhusiano huo wa wakati.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Katika Kiswahili cha sasa, nukta mbili hutambulisha maneno ya moja kwa moja kwa njia ya asili bila kulazimisha “akisema,” huku kazi ya לֵאמֹר ikihifadhiwa.
- source_word: שׁוּבוּ אֵלַי
  choice: Rudini kwangu
  rationale: שׁוּב humaanisha kurudi au kugeuka; “Rudini kwangu” ni agizo la moja kwa moja, lenye heshima ya kifasihi, na karibu na maana ya chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetungwa kwa mtiririko wa kawaida huku ikihifadhi marudio ya “siku ya tatu” yaliyomo katika chanzo. Hakuna tanbihi iliyoongezwa kwa sababu tofauti ya ‘kuja/kwenda’ haihitaji maelezo katika muktadha huu, na tanbihi ya safu ya ushauri ya Kiingereza haionyeshi tofauti halisi ya maandishi ya Kiebrania.
