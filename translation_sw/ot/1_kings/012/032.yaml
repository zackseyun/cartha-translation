  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ יָרָבְעָ֣ם חָ֡ג בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֣י בַּ/חֲמִשָּֽׁה עָשָׂר֩ י֨וֹם לַ/חֹ֜דֶשׁ כֶּ/חָ֣ג אֲשֶׁ֣ר בִּ/יהוּדָ֗ה וַ/יַּ֨עַל֙ עַל הַ/מִּזְבֵּ֔חַ כֵּ֤ן עָשָׂה֙ בְּ/בֵֽית אֵ֔ל לְ/זַבֵּ֖חַ לָ/עֲגָלִ֣ים אֲשֶׁר עָשָׂ֑ה וְ/הֶעֱמִיד֙ בְּ/בֵ֣ית אֵ֔ל אֶת כֹּהֲנֵ֥י הַ/בָּמ֖וֹת אֲשֶׁ֥ר עָשָֽׂה׀־׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/032.yaml
  text: Jeroboam made a feast in the eighth month[a], on the fifteenth day of the month, like the feast that was in Judah, and he went up to the altar. So he did in Bethel, sacrificing to the calves that he had made[b]; and he installed in Bethel the priests of the high places that he had made.
translation:
  language: sw
  text: Yeroboamu akaadhimisha sikukuu mwezi wa nane[a], siku ya kumi na tano ya mwezi huo, kama sikukuu iliyokuwa katika Yuda. Akapanda kwenda madhabahuni[b]. Alifanya hivyo huko Betheli, akiwatolea dhabihu ndama aliowatengeneza; naye akaweka huko Betheli makuhani wa mahali pa juu aliyoyatengeneza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sikukuu ya Yuda huenda ni Sikukuu ya Vibanda, iliyoadhimishwa siku ya kumi na tano ya mwezi wa saba; Yeroboamu aliweka sikukuu yake pinzani mwezi mmoja baadaye.
    reason: cross_reference
  - marker: b
    text: Au, “akapanda juu ya madhabahu.” Usemi wa Kiebrania unaweza kutafsiriwa hivyo kwa kufuata maneno yake kwa karibu zaidi, lakini katika muktadha huenda unamaanisha kupanda kwenda madhabahuni ili kuhudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... חָג
  choice: akaadhimisha sikukuu
  rationale: Muunganiko wa עשה na חג hapa una maana ya kufanya au kuadhimisha sikukuu; ‘akaadhimisha sikukuu’ ni Kiswahili cha kawaida na hudumisha tendo la sherehe ya kidini.
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: mwezi wa nane
  rationale: Huu ni usemi wa moja kwa moja wa wakati katika kalenda, bila kuongeza jina la mwezi ambalo halipo katika Kiebrania.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: siku ya kumi na tano ya mwezi huo
  rationale: Hii ndiyo njia ya asili ya kutaja tarehe kwa Kiswahili; ‘huo’ hurejelea wazi mwezi wa nane uliotajwa.
- source_word: כֶּחָג אֲשֶׁר בִּיהוּדָה
  choice: kama sikukuu iliyokuwa katika Yuda
  rationale: Inahifadhi ulinganisho ulio wazi na haibainishi jina la sikukuu ambalo mstari wenyewe haulitaji.
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: akapanda kwenda madhabahuni
  rationale: עלה ina wazo la kupanda, huku על המזבח katika muktadha huu ikielekea kumaanisha kwenda kwenye madhabahu ili kuhudumu. Usemi huu huepuka kudai kwa uhakika kwamba alipanda juu ya sehemu ya madhabahu yenyewe.
- source_word: כֵּן עָשָׂה בְּבֵית אֵל
  choice: Alifanya hivyo huko Betheli
  rationale: כֵּן huonyesha kwamba tendo linalofuata linalingana na lililotangulia; usemi huu ni wazi na wa kawaida kwa Kiswahili.
- source_word: לְזַבֵּחַ לָעֲגָלִים
  choice: akiwatolea dhabihu ndama
  rationale: Kishazi hiki huonyesha kusudi au tendo linaloambatana; kiambishi cha kuelekeza katika ‘akiwatolea’ kinadumisha kwamba dhabihu zilielekezwa kwa ndama.
- source_word: הָעֲגָלִים
  choice: ndama
  rationale: Neno la Kiebrania linamaanisha ‘ndama’; tathmini kwamba ni sanamu inaonekana katika muktadha na haijaongezwa ndani ya nomino.
- source_word: וְהֶעֱמִיד
  choice: akaweka
  rationale: Hiphil ya עמד hapa ina maana ya kuwaweka au kuwasimamisha wahudumu mahali pao. ‘Akaweka’ ni pana vya kutosha kutodai zaidi ya maandishi kwamba kulikuwa na sherehe rasmi ya kuwaingiza ofisini.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: makuhani wa mahali pa juu
  rationale: Huu ni uwasilishaji wa karibu wa usemi wa kidini unaorejelea maeneo ya ibada yaliyoinuliwa; hauongezi moja kwa moja hukumu ya uharamu ndani ya jina.
- source_word: אֲשֶׁר עָשָׂה
  choice: aliokuwa ametengeneza / alikokuwa ametengeneza
  rationale: Vishazi vinavyorudiwa vinahusisha ndama na mahali pa juu na kazi ya Yeroboamu mwenyewe; wakati timilifu unaonyesha kwamba vitu hivyo vilikuwa tayari vimetengenezwa.
theological_decisions:
- issue: Utambulisho wa ‘sikukuu iliyokuwa katika Yuda’
  choice: Kutaja kwa ujumla ‘sikukuu iliyokuwa katika Yuda’
  alternative: Kuitaja moja kwa moja kuwa Sikukuu ya Vibanda
  rationale: Tarehe na muktadha vinaelekea kuashiria Sikukuu ya Vibanda, lakini maandishi ya mstari huu hayaitaji kwa jina. Utambulisho unaowezekana umewekwa katika tanbihi.
- issue: Tathmini ya ibada ya Yeroboamu
  choice: Kusimulia matendo bila kuyaongezea vivumishi vya hukumu
  alternative: Kuwaita ndama ‘sanamu’ na makuhani ‘haramu’ katika maandishi makuu
  rationale: Masimulizi mapana yanahukumu ibada hii, lakini mstari huu unaeleza matendo yenyewe. Tafsiri inaacha muktadha utoe tathmini hiyo.
- issue: Maana ya kupanda madhabahuni
  choice: Kudumisha wazo la kupanda na kuelekea madhabahuni
  alternative: Kusema bila utata kwamba alipanda juu ya madhabahu
  rationale: Usemi wa Kiebrania unaweza kufasiriwa kwa namna ya karibu zaidi kuwa kupanda juu ya madhabahu, lakini katika muktadha unaweza pia kurejelea kuikaribia au kuipandia madhabahu ili kuhudumu. Tanbihi inadumisha uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya masimulizi ya Biblia lakini kinachoeleweka kwa msomaji wa kawaida. ‘Betheli,’ ‘madhabahu,’ na ‘makuhani’ ni istilahi zilizozoeleka. Alama zote za tanbihi zimewekwa mahali zinapohusika moja kwa moja katika maandishi.
