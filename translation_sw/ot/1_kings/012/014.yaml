base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “My father made your yoke heavy, and I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.”
translation:
  language: sw
  text: Akazungumza nao kufuatana na ushauri wa wale vijana, akisema, “Baba yangu aliifanya nira yenu kuwa nzito, nami nitaiongeza. Baba yangu aliwaadhibu kwa mijeledi, lakini mimi nitawaadhibu kwa nge[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au yawezekana, “kwa mijeledi ya nge,” yaani, mijeledi yenye ncha kali au miiba; Kiebrania kinasema kihalisi “kwa nge.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Akazungumza nao
  rationale: Kitenzi דבר katika piel humaanisha ‘kuzungumza.’ Muundo huu unaendeleza simulizi na kudumisha maana ya Kiebrania bila kuifasiri kwa lazima kuwa jibu rasmi.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: kufuatana na ushauri wa wale vijana
  rationale: עֵצָה ni ushauri, na כ inaonyesha kuwa maneno yake yalipatana na ushauri huo. ‘Vijana’ hapa ni washauri vijana waliotofautishwa na wazee, si watoto wadogo.
- source_word: הִכְבִּיד אֶת עֻלְּכֶם
  choice: aliifanya nira yenu kuwa nzito
  rationale: Tafsiri hii inadumisha picha halisi ya nira na maana ya hiphil ya כבד, ‘kufanya kuwa nzito.’
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: nami nitaiongeza
  rationale: יסף על ina maana ya kuongeza juu ya kitu. Kiswahili hiki ni cha kawaida na kinaeleweka kuwa nira iliyotajwa ndiyo itaongezwa, bila kugeuza picha hiyo kuwa ‘mzigo’.
- source_word: יִסַּר / אֲיַסֵּר
  choice: aliwaadhibu / nitawaadhibu
  rationale: יסר inaweza kumaanisha kuadibu au kuadhibu kwa njia ya maumivu. Katika muktadha wa utawala wa kulazimisha na mijeledi, ‘kuadhibu’ ni wazi na la kawaida, huku likidumisha ulinganifu wa vitenzi viwili.
- source_word: בַּשּׁוֹטִים
  choice: kwa mijeledi
  rationale: שׁוֹט ni mjeledi au kifaa cha kuchapia; ‘mijeledi’ ni neno la kawaida na sahihi katika Kiswahili.
- source_word: בָּעַקְרַבִּים
  choice: kwa nge
  rationale: Kiebrania kinasema kihalisi ‘kwa nge.’ Picha hiyo imehifadhiwa katika matini, huku uwezekano wa kumaanisha mijeledi yenye ncha kali ukielezwa katika tanbihi.
theological_decisions:
- issue: Maana ya mfano wa adhabu unaoitwa ‘nge’
  choice: Kuhifadhi neno halisi ‘nge’ katika matini kuu
  alternative: Kutafsiri moja kwa moja kuwa ‘mijeledi ya nge’ au ‘mijeledi yenye miiba’
  rationale: Nomino עקרבים humaanisha ‘nge,’ lakini huenda hapa ikarejelea mijeledi yenye ncha kali au miiba. Kwa kuwa maana kamili si hakika, matini inadumisha picha ya chanzo na tanbihi inaeleza uwezekano mwingine bila kuamua jambo kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Picha ya ‘nira’ imehifadhiwa kwa uwazi, na sentensi imeundwa kwa mtiririko wa kawaida wa simulizi. Kiashiria cha tanbihi [a] kimewekwa baada ya ‘nge,’ ambako ufafanuzi wake unahusika.
