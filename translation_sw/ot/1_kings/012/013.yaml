translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha masimulizi, cha sasa na chenye hadhi. 'Lakini' linaonyesha utofautishaji wa hatua ya mfalme na shauri lililotangulia katika muktadha, ingawa waw ya Kiebrania pia ni kiunganishi cha masimulizi. Hakuna tanbihi zinazohitajika.
