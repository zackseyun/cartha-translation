  text: And the king answered the people harshly, and he abandoned the counsel of the elders who had advised him.
translation:
  language: sw
  text: Mfalme akawajibu watu kwa ukali, akaacha shauri la wazee waliomshauri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: akawajibu
  rationale: Kitenzi ענה katika muktadha huu humaanisha kujibu; kiambishi -wa- kinaonyesha kwamba watu ndio waliopokea jibu.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainisho inamtaja mfalme anayejulikana katika muktadha; Kiswahili hakihitaji kibainishi tofauti.
- source_word: הָעָם
  choice: watu
  rationale: עָם hapa ni watu wa Israeli waliokusanyika kumwomba mfalme; 'watu' ni tafsiri ya kawaida na wazi.
- source_word: קָשָׁה
  choice: kwa ukali
  rationale: Neno hili linaeleza namna mfalme alivyojibu. 'Kwa ukali' ni Kiswahili cha asili kinachobeba maana ya jibu kali lisilo na upole.
- source_word: וַיַּעֲזֹב
  choice: akaacha
  rationale: עזב humaanisha kuacha au kutupilia mbali. 'Akaacha' hufuata kwa karibu maana ya msingi bila kuongeza kwa lazima wazo la kukataa lililo wazi zaidi.
- source_word: עֲצַת
  choice: shauri
  rationale: עֵצָה ni ushauri au shauri. 'Shauri' linafaa katika mazingira ya maamuzi ya kifalme na linaeleweka katika Kiswahili sanifu.
- source_word: הַזְּקֵנִים
  choice: wazee
  rationale: זְקֵנִים hapa huwatambulisha wanaume wenye umri na hadhi ya washauri; 'wazee' huhifadhi maana hiyo ya kijamii na kisiasa.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: waliokuwa wamemshauri
  rationale: Kishazi hiki kinawatambulisha wazee kuwa wale waliokwisha kumpa mfalme shauri. Muundo huu wa Kiswahili unaonyesha kwamba ushauri wao ulitangulia kuachwa kwake.
