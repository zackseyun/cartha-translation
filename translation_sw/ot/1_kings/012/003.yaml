lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ לוֹ
  choice: wakatuma watu kumwita
  rationale: Katika muktadha huu, mfuatano wa vitenzi unamaanisha kwamba walituma watu ili Yeroboamu aitwe aje. Kiswahili huhitaji kutaja kwa njia ya kawaida waliotumwa, ingawa Kiebrania kinaacha kitu kilichotumwa bila kutajwa.
- source_word: וַיָּבֹאוּ
  choice: wakaja
  rationale: Kitenzi hiki cha kawaida kinamaanisha ‘kuja’; wingi unalingana na Yeroboamu pamoja na kusanyiko lote la Israeli.
- source_word: יָרָבְעָם
  choice: Yeroboamu
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל
  choice: na kusanyiko lote la Israeli
  rationale: קהל ni jumuiya iliyokusanyika. ‘Kusanyiko’ linafaa hapa kwa mkutano wa taifa wenye kusudi la umma na kisiasa bila kulipa maana ya kidhehebu.
- source_word: וַיְדַבְּרוּ אֶל־רְחַבְעָם
  choice: wakazungumza na Rehoboamu
  rationale: Tafsiri hii huhifadhi maana ya kusema au kuzungumza na mtu na pia hutenganisha kitenzi hiki na fomula inayofuata ya kuanzisha maneno ya moja kwa moja.
- source_word: לֵאמֹר
  choice: wakisema,
  rationale: Fomula hii ya Kiebrania inaanzisha maneno yatakayofuata katika mstari unaofuata; ‘wakisema’ huhifadhi muundo huo wazi.
