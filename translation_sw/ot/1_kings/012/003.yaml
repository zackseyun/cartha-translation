translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. Majina ‘Yeroboamu,’ ‘Israeli,’ na ‘Rehoboamu’ yameandikwa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili. Koma ya mwisho inaonyesha kwamba usemi wa moja kwa moja unaendelea katika mstari unaofuata.
