  text: וַ/יִּוָּעַ֣ץ הַ/מֶּ֔לֶךְ וַ/יַּ֕עַשׂ שְׁנֵ֖י עֶגְלֵ֣י זָהָ֑ב וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם רַב לָ/כֶם֙ מֵ/עֲל֣וֹת יְרוּשָׁלִַ֔ם הִנֵּ֤ה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/028.yaml
  text: So the king took counsel and made two calves of gold[a], and he said to them, “It is too much for you to go up to Jerusalem. Behold your gods, O Israel[b], who brought you up from the land of Egypt.”
translation:
  language: sw
  text: Basi mfalme akashauriana, akafanya ndama wawili wa dhahabu, kisha akawaambia, “Ni taabu mno kwenu kupanda kwenda Yerusalemu.[a] Tazama miungu yako, ee Israeli,[b] ambayo ilikupandisha kutoka nchi ya Misri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mmekwisha kupanda kwenda Yerusalemu vya kutosha.” Kauli ya Kiebrania inaweza kumaanisha kwamba wamekwenda huko vya kutosha au kwamba kwenda huko ni mzigo mkubwa mno kwao.
    reason: Huhifadhi maana mbadala ya kifungu רַב לָכֶם מֵעֲלוֹת יְרוּשָׁלִַם.
  - marker: b
    text: Au, “Mungu wako, ee Israeli.” Umbo la Kiebrania wakati mwingine linaweza kumaanisha Mungu mmoja; hata hivyo, hapa ndama wawili na kitenzi cha wingi vinaunga mkono tafsiri “miungu yako.” Kauli hii pia ina mwangwi wa Kutoka 32:4.
    reason: Huhifadhi usomaji mbadala wa kisarufi na mwangwi wa Kutoka 32:4 bila kuficha ushahidi wa wingi katika mstari huu.
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: akafanya mashauri
  rationale: Nifali ya יעץ inaonyesha kwamba mfalme alitafuta au alifanya mashauri. Kauli hii ni ya kawaida na yenye heshima katika Kiswahili, bila kuongeza washauri ambao hawakutajwa wazi.
- source_word: שְׁנֵי עֶגְלֵי זָהָב
  choice: ndama wawili wa dhahabu
  rationale: Inafuata muundo wa Kiebrania kwa karibu, hudumisha maana ya sanamu mbili, na pia mwangwi wa Kutoka 32.
- source_word: רַב לָכֶם מֵעֲלוֹת יְרוּשָׁלִַם
  choice: Imewatosha kupanda kwenda Yerusalemu
  rationale: Kauli hii ya Kiswahili huwasilisha wazo la kuwa wamekwenda Yerusalemu vya kutosha, huku tanbihi ikihifadhi uwezekano wa kuelewa safari hiyo kuwa mzigo mkubwa mno.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linaonyesha kwa nguvu kitu kinachowekwa mbele ya watu na linafaa katika usemi wenye uzito bila kuwa la kizamani kupita kiasi.
- source_word: אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: miungu yako, ee Israeli
  rationale: Ingawa אֱלֹהִים wakati mwingine humaanisha Mungu mmoja, hapa ndama wawili na kitenzi cha wingi הֶעֱלוּ vinaunga mkono maana ya wingi. 'Ee Israeli' huonyesha wazi kwamba Israeli anaitwa moja kwa moja.
- source_word: הֶעֱלוּךָ
  choice: iliyokupandisha
  rationale: Kitenzi hiki huendeleza upatanisho wa kisarufi na nomino ya wingi 'miungu' katika ngeli ya I–ZI na kuhifadhi tamko la kuhusisha sanamu hizo na tendo la kutoka Misri.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: kutoka nchi ya Misri
  rationale: Hufuata kwa karibu usemi wa Kiebrania na kuhifadhi mwangwi wa kauli inayotumiwa mara nyingi kuhusu kutoka Misri.
theological_decisions:
- issue: Iwapo אֱלֹהֶיךָ itafsiriwe kwa umoja au kwa wingi katika tangazo la mfalme
  choice: 'wingi: “miungu yako, ee Israeli”'
  alternative: 'umoja: “Mungu wako, ee Israeli”'
  rationale: Nomino inaweza kutumiwa kwa Mungu mmoja, lakini muktadha wa ndama wawili na kitenzi cha Kiebrania cha wingi unaelekeza zaidi kwenye wingi. Tanbihi huhifadhi usomaji wa umoja na mvutano wa kimakusudi unaotokana na mwangwi wa Kutoka 32:4.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Akawaambia watu” huweka wazi warejelewa wa kiwakilishi cha Kiebrania bila kuongeza kundi jipya, na “kupanda kwenda Yerusalemu” huhifadhi dhana ya kupanda kuelekea Yerusalemu.
