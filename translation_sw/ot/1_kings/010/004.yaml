  rationale: Kiunganishi cha wakati kinaonyesha mwanzo wa kishazi kinachoendelea katika mstari unaofuata, huku kikisogeza simulizi mbele kwa Kiswahili cha kawaida.
- source_word: מַלְכַּת שְׁבָא
