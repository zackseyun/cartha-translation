- source_word: וְהַבַּיִת
  choice: na nyumba
  rationale: Neno בַּיִת kimsingi ni 'nyumba'; katika muktadha wa kifalme linaweza kumaanisha jumba la kifalme, jambo linalohifadhiwa katika tanbihi.
- source_word: אֲשֶׁר בָּנָה
  choice: aliyokuwa ameijenga
  rationale: Kishazi hiki kinarejelea nyumba iliyokuwa tayari imekamilika wakati malkia alipoiona.
