base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/026.yaml
  text: Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen, and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: sw
  text: Solomoni akakusanya magari ya vita na wapanda farasi[a], naye alikuwa na magari ya vita 1,400 na wapanda farasi 12,000. Akavipanga katika miji ya magari ya vita na pamoja na mfalme huko Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “askari wapanda farasi”; kwa maana halisi zaidi, Kiebrania kinarejelea watu waliopanda farasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: akakusanya
  rationale: Kitenzi hiki kinaonyesha kukusanya au kujilimbikizia rasilimali za kijeshi; “akakusanya” ni cha kawaida na kinafuata maana ya msingi.
- source_word: רֶכֶב
  choice: magari ya vita
  rationale: Nomino hii hapa inarejelea magari ya kivita kwa maana ya jumla; wakati yanapohesabiwa, wingi wa Kiswahili unafaa.
- source_word: פָרָשִׁים
  choice: wapanda farasi
  rationale: Neno hili humaanisha watu waliopanda farasi, si farasi wenyewe. “Wapanda farasi” ni wazi na halilazimishi maana ya kikosi rasmi.
- source_word: וַיְהִי לוֹ
  choice: alikuwa na
  rationale: Hii ni nahau ya Kiebrania ya kuonyesha umiliki; “alikuwa na” ni Kiswahili cha kawaida na sahihi.
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: magari ya vita 1,400
  rationale: Idadi imetolewa moja kwa moja kwa mtindo unaosomeka kwa urahisi katika Kiswahili cha sasa.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: wapanda farasi 12,000
  rationale: Idadi imetafsiriwa moja kwa moja, huku “wapanda farasi” ikidumishwa kwa ulinganifu na matumizi ya kwanza.
- source_word: וַיַּנְחֵם
  choice: akawaweka
  rationale: Hifili ya נוח hapa ni kuweka mahali. “Akawaweka” ni ya asili; mazingira ya kijeshi yanaonyesha kuwa walipangwa katika vituo hivyo.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: katika miji ya magari ya vita
  rationale: Kirai hiki kinaonyesha miji iliyotengwa au kuhusishwa na magari ya kivita; tafsiri hii ni wazi bila kuongeza maelezo yasiyokuwamo.
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלָם
  choice: na wengine akawaweka pamoja na mfalme huko Yerusalemu
  rationale: Kiswahili kinahitaji kuweka wazi kuwa si magari na wapanda farasi wote waliokuwa katika kila eneo. “Wengine” huwasilisha mgawanyo unaodokezwa na muundo wa Kiebrania, huku “pamoja na mfalme” ikihifadhi usemi wake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Magari ya vita” limetumiwa badala ya istilahi nzito zaidi, na “wapanda farasi” huhifadhi maana halisi ya watu waliopanda farasi. Sentensi ndefu ya Kiebrania imegawanywa kwa usomaji wa kawaida bila kubadili mpangilio wa taarifa.
