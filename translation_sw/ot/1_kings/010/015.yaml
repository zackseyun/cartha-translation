  yaml_path: translation/ot/1_kings/010/015.yaml
  text: besides what came from the traveling merchants and from the trade of the merchants[c][b][a], and from all the kings of Arabia and the governors of the land.
translation:
  language: sw
  text: zaidi ya ile iliyotoka kwa wafanyabiashara waliosafiri huku na huku[a], na kutokana na biashara ya wachuuzi, na kutoka kwa wafalme wote wa Arabia[b], na magavana wa nchi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu waliosafiri huku na huku”; kirai cha Kiebrania ni kigumu na huenda kinawahusu kwa jumla wafanyabiashara wa kuhamahama.
    reason: lexical_alternative
  - marker: b
    text: Au, “wafalme wote wa watu waliochanganyika”; neno la Kiebrania עֶרֶב linaweza kuwa na maana hiyo katika miktadha fulani, ingawa hapa yaelekea zaidi linamaanisha Arabia.
    reason: alternative_reading
  - marker: c
    text: Au, “magavana wa majimbo” au “masatrapi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: zaidi ya
  rationale: Katika muktadha huu neno hilo linaongeza vyanzo vingine vya mapato kwenye jumla iliyotajwa kabla.
- source_word: מֵאַנְשֵׁי הַתָּרִים
  choice: ile iliyotoka kwa wafanyabiashara waliosafiri huku na huku
  rationale: Kirai cha Kiebrania ni kigumu, lakini katika muktadha wa biashara kinaelekea kumaanisha watu waliokuwa wakisafiri, yaelekea wafanyabiashara wa kuhamahama; ‘ile iliyotoka kwa’ huonyesha kwamba mapato ndiyo yanayozungumziwa.
- source_word: וּמִסְחַר הָרֹכְלִים
  choice: biashara ya wachuuzi
  rationale: מִסְחַר ni biashara au shughuli za kibiashara, na רֹכְלִים ni wafanyabiashara wanaosafiri au wachuuzi. ‘Wachuuzi’ hutofautisha kundi hili kwa njia ya kawaida na kundi lililotangulia.
- source_word: וְכָל מַלְכֵי הָעֶרֶב
  choice: wafalme wote wa Arabia
  rationale: Katika orodha hii ya kijiografia na kisiasa, עֶרֶב inaeleweka kwa uwezekano mkubwa kuwa Arabia au watu wa Arabia.
- source_word: וּפַחוֹת הָאָרֶץ
  choice: watawala wa nchi
  rationale: פַחוֹת ni maafisa wa ngazi ya eneo walio chini ya mamlaka kuu; ‘watawala’ ni wazi bila kuingiza istilahi mahususi ya kipindi cha Uajemi.
