translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendeleza orodha ya vyanzo vya mapato kutoka mstari uliotangulia. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika; hakuna tanbihi ya ‘watawala’ kwa kuwa tafsiri hiyo ni wazi na haitumii neno lenye umahususi usio lazima.
