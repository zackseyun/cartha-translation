base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/017.yaml
  text: and three hundred shields of beaten gold[a]; three minas of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: sw
  text: Na ngao mia tatu za dhahabu iliyopigwa[a]. Mina tatu za dhahabu zilitumika kwa kila ngao[b]. Mfalme akaziweka katika Nyumba ya Msitu wa Lebanoni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhahabu iliyogongwa” au “dhahabu iliyopigwa kuwa nyembamba.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mina tatu za dhahabu zilipanda juu ya ngao moja,” yaani kila ngao ilitiwa kiasi hicho cha dhahabu.
    reason: lexical_alternative
  - marker: c
    text: Nyumba ya Msitu wa Lebanoni lilikuwa jina la jengo la kifalme, lililohusishwa na eneo la ikulu ya Sulemani na huenda lilitumika kama ghala la silaha; tazama 1 Wafalme 7:2.
    reason: cross_reference
lexical_decisions:
- source_word: מָגִנִּים
  choice: ngao
  rationale: “Ngao” ni neno la kawaida na linaloeleweka kwa kifaa cha kujikinga kinachotajwa hapa; muktadha unalitofautisha na aina iliyotajwa katika mstari uliotangulia bila kulazimisha kuongeza kivumishi kisichomo katika Kiebrania.
- source_word: זָהָב שָׁחוּט
  choice: dhahabu iliyofuliwa
  rationale: Kitenzi hiki kinaeleza dhahabu iliyotengenezwa kwa kupigwa au kugongwa, yaelekea kuwa tabaka jembamba. “Iliyofuliwa” ni lugha ya kawaida ya ufundi wa metali na hudumisha wazo la namna ilivyotengenezwa.
- source_word: שְׁלֹשֶׁת מָנִים
  choice: mina tatu
  rationale: “Mina” limetumiwa kama jina la kipimo cha uzito cha kale badala ya kukibadili kuwa kipimo cha kisasa kisicho na ulinganifu kamili.
- source_word: יַעֲלֶה עַל
  choice: ziliwekwa juu ya
  rationale: Uamuzi huu huhifadhi taswira halisi ya dhahabu kwenda au kuwekwa juu ya ngao, bila kuamua zaidi ya maandishi kama ngao ilifunikwa kabisa.
- source_word: הַמָּגֵן הָאֶחָת
  choice: kila ngao
  rationale: Ingawa muundo wa Kiebrania ni wa umoja, hapa una maana ya mgawanyo kwa kila moja ya ngao; “kila ngao” ni Kiswahili cha kawaida na sahihi.
- source_word: וַיִּתְּנֵם
  choice: akaziweka
  rationale: Katika muktadha huu נתן ina maana ya kuweka vitu mahali, kwa hiyo “akaziweka” ni tafsiri ya moja kwa moja na ya asili.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Jumba la Msitu wa Lebanoni
  rationale: Hili ni jina la jengo maalumu la kifalme. “Jumba” linaeleweka kwa asili katika muktadha wa majengo ya ikulu, huku jina lote likihifadhiwa.
