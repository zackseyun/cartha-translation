base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/018.yaml
  text: Then the king made a great ivory throne and overlaid it with refined gold[a].
translation:
  language: sw
  text: Kisha mfalme akatengeneza kiti kikubwa cha enzi cha pembe za ndovu, akakifunika kwa dhahabu iliyosafishwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhahabu safi” au “dhahabu bora.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Kisha ... akatengeneza
  rationale: Kauli ya wayyiqtol inaendeleza masimulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akatengeneza” inafaa kwa utengenezaji wa kitu.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainishaji humrejelea Sulemani katika muktadha; Kiswahili hakihitaji neno tofauti la uainishaji hapa.
- source_word: כִּסֵּא
  choice: kiti cha enzi
  rationale: Katika mazingira ya kifalme, “kiti cha enzi” ni sahihi kuliko “kiti” pekee.
- source_word: שֵׁן
  choice: cha pembe za ndovu
  rationale: Ingawa neno hilo kimsingi linaweza kumaanisha jino, hapa linataja pembe za ndovu kama nyenzo ya kiti; muundo huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: גָּדוֹל
  choice: kikubwa
  rationale: Huhifadhi wazo la ukubwa na pia fahari ya kiti cha kifalme bila kuongeza maana isiyokuwamo.
- source_word: וַיְצַפֵּהוּ
  choice: akakifunika
  rationale: Kitenzi kina maana ya kufunika au kupaka kitu kwa tabaka la nyenzo nyingine. “Akakifunika kwa” ni Kiswahili cha asili na hudumisha maana hiyo.
- source_word: זָהָב
  choice: dhahabu
  rationale: Ni tafsiri ya moja kwa moja ya nyenzo inayotajwa.
- source_word: מוּפָז
  choice: iliyosafishwa
  rationale: Neno linaonyesha dhahabu ya ubora wa juu, iliyosafishwa au safi; chaguo hili ni wazi na halidai kwa kupita kiasi umahususi wa kiufundi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kiti cha enzi” ni istilahi ya kawaida ya kifalme; “pembe za ndovu” ni wazi zaidi kuliko kutumia “ndovu” peke yake kama jina la nyenzo. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
