  text: וּ/שְׁנֵ֧ים עָשָׂ֣ר אֲרָיִ֗ים עֹמְדִ֥ים שָׁ֛ם עַל שֵׁ֥שׁ הַֽ/מַּעֲל֖וֹת מִ/זֶּ֣ה וּ/מִ/זֶּ֑ה לֹֽא נַעֲשָׂ֥ה כֵ֖ן לְ/כָל מַמְלָכֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/020.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side[b]; nothing like it had been made in any kingdom.
translation:
  language: sw
  text: Na simba kumi na wawili walikuwa wamesimama pale kwenye hatua sita za ngazi, upande huu na upande ule[a]; kitu kama hicho hakikuwa kimetengenezwa katika ufalme wowote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upande mmoja na upande mwingine.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “haikuwa imefanywa hivyo kwa falme zote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵים עָשָׂר אֲרָיִים
  choice: Na simba kumi na wawili
  rationale: Huhifadhi kiunganishi na idadi ya simba kwa mpangilio wa asili wa Kiswahili.
- source_word: עֹמְדִים שָׁם
  choice: walikuwa wamesimama pale
  rationale: Kirai cha wakati uliopita kinaonyesha hali ya simba hao katika mandhari inayoelezwa; “pale” hurejelea mahali pa kiti cha enzi kilichotangulia.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: kwenye hatua sita za ngazi
  rationale: מַעֲלוֹת hapa ni hatua za ngazi zinazoelekea kwenye kiti cha enzi. Kirai hiki huepuka kueleweka kana kwamba kulikuwa na ngazi sita tofauti.
- source_word: מִ/זֶּה וּ/מִ/זֶּה
  choice: upande huu na upande ule
  rationale: Ni usemi wa mahali unaoonyesha kwamba simba walipangwa pande zote mbili.
- source_word: לֹא נַעֲשָׂה כֵן
  choice: kitu kama hicho hakikuwa kimetengenezwa
  rationale: Hutoa kwa Kiswahili cha kawaida maana kwamba hakuna kazi au kitu cha kulinganishwa nacho kilichokuwa kimetengenezwa.
- source_word: לְ/כָל מַמְלָכוֹת
  choice: katika ufalme wowote
  rationale: 'Katika sentensi kanushi, wingi wenye כָל una maana ya kugawa: hakuna ufalme hata mmoja uliokuwa na kitu kama hicho.'
