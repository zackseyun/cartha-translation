base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/029.yaml
  text: And a chariot was imported from Egypt for six hundred shekels of silver[a], and a horse for a hundred and fifty[c][b]; and so they exported them to all the kings of the Hittites and to the kings of Aram by their hand.
translation:
  language: sw
  text: Na gari moja la vita liliagizwa kutoka Misri kwa shekeli mia sita za fedha[a], na farasi mmoja kwa shekeli mia moja na hamsini. Vivyo hivyo, waliwasafirishia wafalme wote wa Wahiti na wafalme wa Aramu[b] kwa mikono yao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, ‘mia sita za fedha.’ Shekeli ndicho kipimo kinachodokezwa.
    reason: implicit_unit
  - marker: b
    text: Yaani, wafalme wa Waaramu; kwa mapokeo mengine, ‘Siria.’
    reason: alternative_reading
  - marker: c
    text: 'Kiebrania: ‘kwa mkono wao,’ yaani, kwa njia yao au kwa mawakala wao. Vitenzi vya mwendo katika mstari huu vinaweza pia kutafsiriwa kwa karibu zaidi, ‘lilipandishwa kutoka Misri … nao wakazitoa.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה וַתֵּצֵא
  choice: liliagizwa
  rationale: Kwa maana ya msingi, vitenzi hivi vinaeleza kupanda na kutoka; katika muktadha huu wa biashara vinaeleza kuletwa kwa bidhaa kutoka Misri. ‘Liliagizwa’ ni Kiswahili cha kawaida kinachowasilisha wazo hilo bila kurudia vitenzi viwili kwa namna isiyo ya kawaida.
- source_word: מֶרְכָּבָה
  choice: gari moja la vita
  rationale: Neno linamaanisha gari la kukokotwa, hasa gari la vita katika muktadha wa kifalme na kijeshi. ‘Moja’ huonyesha kwamba bei imetajwa kwa kila gari.
- source_word: מִמִּצְרַיִם
  choice: kutoka Misri
  rationale: Hutaja moja kwa moja mahali bidhaa ilikotoka.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: kwa shekeli mia sita za fedha
  rationale: Kiebrania kinasema kihalisi ‘kwa mia sita za fedha’; ‘shekeli’ imeongezwa ili kufafanua kipimo cha uzito na thamani kinachodokezwa.
- source_word: וְסוּס
  choice: na farasi mmoja
  rationale: Maana ya kawaida ni ‘farasi’; maandishi hayasemi wazi ‘farasi wa vita.’ ‘Mmoja’ huweka wazi kuwa hii ni bei ya kila farasi.
- source_word: בַּחֲמִשִּׁים וּמֵאָה
  choice: kwa shekeli mia moja na hamsini
  rationale: Mpangilio wa tarakimu umewekwa katika Kiswahili cha kawaida, huku ‘shekeli’ ikieleweka kutokana na kipimo kilichotangulia.
- source_word: וְכֵן
  choice: Vivyo hivyo
  rationale: Huunganisha bei zilizotajwa na desturi ya kuzipeleka bidhaa hizo kwa wafalme wengine.
- source_word: לְכָל מַלְכֵי הַחִתִּים
  choice: wafalme wote wa Wahiti
  rationale: Huhifadhi jina la kundi la watu na kuwaonyesha kama wapokeaji wa bidhaa.
- source_word: וּלְמַלְכֵי אֲרָם
  choice: na wafalme wa Aramu
  rationale: ‘Aramu’ huhifadhi jina la Kiebrania badala ya kutumia ‘Siria,’ jina la jadi lenye upeo unaoweza kutofautiana.
- source_word: בְּיָדָם
  choice: kupitia kwao
  rationale: Nahau ya Kiebrania ni ‘kwa mkono wao,’ ikimaanisha kwamba biashara hiyo ilifanyika kupitia wao au mawakala wao. Kiswahili ‘kupitia kwao’ ni wazi na cha kawaida.
- source_word: יֹצִאוּ
  choice: waliwasafirishia
  rationale: Hili ni umbo la kusababisha kutoka. Katika muktadha wa biashara, linaonyesha kupeleka au kusafirisha bidhaa hizo kwenda kwa wafalme waliotajwa.
