translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi. ‘Gari la vita,’ ‘liliagizwa,’ na ‘waliwasafirishia’ huwasilisha muktadha wa biashara kwa lugha ya kawaida, huku tanbihi zikihifadhi usemi halisi na uwezekano wa tafsiri ya vitenzi vya mwendo.
