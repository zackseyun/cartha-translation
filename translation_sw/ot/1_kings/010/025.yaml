base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/025.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver, articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: sw
  text: 'Nao walikuwa wakileta, kila mmoja ushuru wake[a]: vyombo vya fedha, vyombo vya dhahabu, mavazi[b], silaha[c], manukato, farasi na nyumbu, mwaka baada ya mwaka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zawadi yake” au “tunu yake.” Neno la Kiebrania linaweza kumaanisha zawadi, tunu, au ushuru; hapa “ushuru” linaendana na muktadha wa kifalme.
    reason: lexical_alternative
  - marker: b
    text: Au “majoho” au “mavazi ya nje.”
    reason: lexical_alternative
  - marker: c
    text: Au “vifaa vya kujikinga vitani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִאִים
  choice: walikuwa wakileta
  rationale: Kirai hiki huonyesha tendo la kawaida lililoendelea au kurudiwa katika kipindi hicho, si tukio moja tu.
- source_word: אִישׁ מִנְחָתוֹ
  choice: kila mmoja ushuru wake
  rationale: אִישׁ imetumiwa kwa maana ya mgawanyo, ‘kila mmoja,’ na מִנְחָה katika muktadha wa kifalme linaelekea kuwa zawadi au ushuru unaotolewa kwa mfalme.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: vyombo vya fedha, vyombo vya dhahabu
  rationale: כְּלִי ni neno pana kwa chombo au kitu kilichotengenezwa; ‘vyombo’ ni Kiswahili cha kawaida na huhifadhi usambamba wa vifungu hivyo viwili.
- source_word: שְׂלָמוֹת
  choice: mavazi
  rationale: Neno hili linaweza kumaanisha mavazi ya nje, majoho, au makoti; ‘mavazi’ ni pana na la kawaida katika orodha hii.
- source_word: נֵשֶׁק
  choice: silaha
  rationale: Neno hili linahusu zana za kijeshi; ‘silaha’ ni wazi na linaweza kuwakilisha maana pana bila kulibana kuwa mavazi ya kujikinga pekee.
- source_word: בְשָׂמִים
  choice: manukato
  rationale: Katika biashara au ushuru, neno hili humaanisha vitu vyenye harufu nzuri, vikiwemo vikolezo na marhamu; ‘manukato’ ni pana na la asili katika Kiswahili.
- source_word: סוּסִים וּפְרָדִים
  choice: farasi na nyumbu
  rationale: Hizi ndizo maana za kawaida za majina hayo ya wanyama.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: mwaka baada ya mwaka
  rationale: Nahau hii inaonyesha kurudiwa kwa utaratibu kila mwaka; tafsiri hii ni ya asili na huhifadhi msisitizo wa urudiaji.
theological_decisions:
- issue: Maana ya מִנְחָה katika mazingira ya kifalme
  choice: ushuru
  alternative: zawadi / tunu
  rationale: Muktadha wa watu kuja mbele ya Mfalme Sulemani kila mwaka unaunga mkono ‘ushuru,’ lakini neno lenyewe pia linaweza kumaanisha zawadi au tunu; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘walikuwa wakileta’ unaonyesha tendo la kawaida lililorudiwa; orodha imewekwa kwa maneno yanayoeleweka kwa wasomaji wa kawaida.
