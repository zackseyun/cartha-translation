  yaml_path: translation/ot/1_kings/010/016.yaml
  text: King Solomon made two hundred large shields of beaten gold[b][a]; six hundred shekels of gold went onto each shield.
translation:
  language: sw
  text: Mfalme Sulemani akatengeneza ngao kubwa[a] mia mbili za dhahabu iliyopigwa kwa nyundo. Dhahabu yenye uzito wa shekeli mia sita[b] iliwekwa juu ya kila ngao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “ngao kubwa” huenda linamaanisha aina ya ngao kubwa, tofauti na ngao ndogo zinazotajwa katika mstari unaofuata.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “dhahabu mia sita ilipanda juu ya ngao ile moja.” Kipimo cha uzito “shekeli” hakikutajwa wazi katika Kiebrania, lakini kinaeleweka kutokana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akatengeneza
  rationale: Kitenzi עשה hapa kina maana ya kutengeneza vitu; “akatengeneza” ni Kiswahili cha kawaida na cha heshima.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Mfalme Sulemani
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unahifadhi cheo pamoja na jina.
- source_word: מָאתַיִם
  choice: mia mbili
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya namba hiyo.
- source_word: צִנָּה
  choice: ngao kubwa
  rationale: צִנָּה kwa kawaida humaanisha ngao kubwa, na huenda inatofautishwa na aina ndogo ya ngao inayotajwa katika mstari unaofuata.
- source_word: זָהָב שָׁחוּט
  choice: dhahabu iliyopigwa kwa nyundo
  rationale: שָׁחוּט inaeleza dhahabu iliyotandazwa au kutengenezwa kwa kuipiga; usemi huu ni wazi kwa msomaji wa kawaida.
- source_word: שֵׁשׁ מֵאוֹת זָהָב
  choice: shekeli mia sita za dhahabu
  rationale: Kiebrania hakitaji kipimo waziwazi, lakini shekeli inaeleweka kuwa kipimo cha uzito katika muundo huu; neno hilo limeongezwa kwa uwazi na kuelezwa katika tanbihi.
- source_word: יַעֲלֶה עַל
  choice: zilitumika kwa
  rationale: Ingawa usemi wa Kiebrania ni kwa maana halisi “ilipanda juu ya,” katika muktadha unaonyesha kiasi cha dhahabu kilichowekwa au kutumiwa kwa kila ngao; “zilitumika kwa” ni Kiswahili cha asili.
- source_word: הַצִּנָּה הָאֶחָת
  choice: kila ngao
  rationale: Kwa maana halisi ni “ngao ile moja,” lakini hapa ni matumizi ya ugawaji yanayoonyesha kiasi kilichotumika kwa kila mojawapo ya ngao mia mbili.
