  text: And all the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: sw
  text: Watu wa dunia yote walitafuta kufika mbele ya Sulemani[a] ili kusikia hekima yake, ambayo Mungu alikuwa ameweka moyoni mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno kwa neno, Kiebrania: “kutafuta uso wa Sulemani,” nahau yenye maana ya kutafuta kuonana naye au kupata nafasi ya kufika mbele yake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: Watu wa dunia yote
  rationale: Kirai hiki ni usemi mpana wa kijumla unaowarejelea watu wa ulimwengu uliojulikana wakati huo. Kuongeza “watu” kunadhihirisha maana iliyokusudiwa na kufanya sentensi iwe ya kawaida katika Kiswahili bila kuondoa uzidishaji wa kifalme uliomo katika Kiebrania.
- source_word: מְבַקְשִׁים
  choice: walitafuta
  rationale: Hali ya kitenzi cha Kiebrania inaonyesha tendo lililoendelea au lililofanyika kwa desturi; wakati uliopita wa Kiswahili unafaa katika muhtasari huu wa kisimulizi.
- source_word: אֶת פְּנֵי שְׁלֹמֹה
  choice: kufika mbele za Sulemani
  rationale: Kwa neno neno ni “kutafuta uso wa Sulemani,” lakini ni nahau ya kutafuta kuonana naye au kupata nafasi ya kufika mbele yake. Tafsiri hii inadumisha wazo la kuwapo mbele ya mfalme kwa Kiswahili cha kawaida.
- source_word: לִשְׁמֹעַ
  choice: ili kusikia
  rationale: Kitenzi-jina hiki kinaonyesha kusudi. “Ili kusikia” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: חָכְמָתוֹ
  choice: hekima yake
  rationale: Inafuata kiambishi cha umilikaji cha Kiebrania na kuweka mkazo juu ya hekima aliyopewa Sulemani.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים
  choice: ambayo Mungu alikuwa ameweka
  rationale: Ingawa נָתַן kwa msingi ni “alitoa,” ikiunganishwa na “moyoni mwake” maana ya Kiswahili “alikuwa ameweka” ni ya kawaida na inaonyesha kuwa Mungu alimpa hekima hiyo kabla watu hawajaja kuisikia.
- source_word: בְּלִבּוֹ
  choice: moyoni mwake
  rationale: “Moyo” huhifadhi taswira ya Kiebrania ya utu wa ndani, unaotia ndani akili na utashi, badala ya kuifinya maana iwe akili peke yake.
theological_decisions:
- issue: Tafsiri ya אֱלֹהִים katika muktadha usiotumia jina la agano
  choice: Mungu
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia אֱלֹהִים, si YHWH; kwa hiyo “Mungu” inadumisha tofauti hiyo ya kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kufika mbele za Sulemani” kinafaa kwa muktadha wa kifalme na bado kinaeleweka kwa wasomaji wa kawaida.
