translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Sikuzisadiki’ na ‘habari’ ni vya kawaida; ‘Na tazama’ huhifadhi mshangao wa simulizi ya Kiebrania bila kutumia lugha ya kizamani kupita kiasi.
