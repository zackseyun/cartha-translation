base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/007.yaml
  text: But I did not believe the reports until I came and my own eyes saw it; and behold[a], not even half was told to me. You have surpassed the report that I heard in wisdom and prosperity.
translation:
  language: sw
  text: Lakini sikuamini habari hizo mpaka nilipokuja na kuona kwa macho yangu mwenyewe. Na tazama, hata nusu yake sikuambiwa! Kwa hekima na ustawi[a], umezidi habari nilizozisikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa hekima na utajiri, umezidi habari nilizozisikia.” Neno la Kiebrania טוֹב linaweza kumaanisha ustawi au hali njema kwa ujumla; katika muktadha huu huenda likatia ndani utajiri kama sehemu ya mafanikio ya Sulemani.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: sikuzisadiki
  rationale: Hiphil ya אמן hapa humaanisha kukubali habari kuwa za kweli au za kuaminika. ‘Kusadiki’ ni ya kawaida na hudumisha maana hiyo bila kuongeza hisia.
- source_word: לַדְּבָרִים
  choice: habari hizo
  rationale: Ingawa neno hilo linaweza kumaanisha ‘maneno’ au ‘mambo,’ muktadha unaonyesha habari zilizosimuliwa kuhusu Sulemani.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: kuona kwa macho yangu mwenyewe
  rationale: Huhifadhi msisitizo wa ushuhuda wa moja kwa moja uliomo katika nahau ya Kiebrania, ‘macho yangu yakaona.’
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Kiashiria hiki cha usemi huonyesha mshangao na msisitizo; ‘Na tazama’ huhifadhi nguvu yake ya balagha.
- source_word: לֹא הֻגַּד לִי הַחֵצִי
  choice: hata nusu yake sikuambiwa
  rationale: Ni usemi wa kusisitiza kwamba habari alizopewa zilikuwa pungufu sana; mpangilio huu ni wa asili katika Kiswahili.
- source_word: הוֹסַפְתָּ
  choice: umezidi
  rationale: Katika muundo huu wa ulinganisho, יסף humaanisha kuvuka au kuzidi kile kilichosikiwa, si kuongeza tu.
- source_word: חָכְמָה וָטוֹב
  choice: hekima na ustawi
  rationale: חָכְמָה ni ‘hekima,’ na טוֹב katika muktadha wa fahari na mafanikio ya kifalme inaweza kumaanisha hali njema au ustawi, ikiwa ni pamoja na utajiri.
- source_word: אֶל הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: habari nilizozisikia
  rationale: שְׁמוּעָה ni habari au taarifa iliyosikiwa. Tafsiri hii ni ya kawaida na inafaa mazingira rasmi ya kifalme.
