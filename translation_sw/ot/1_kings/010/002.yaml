translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo “Akaja… Akamwendea…” unadumisha mfuatano na urudiaji wa vitenzi katika Kiebrania.
