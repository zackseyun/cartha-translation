base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/002.yaml
  text: She came to Jerusalem with a very great retinue[a], with camels carrying spices and very much gold and precious stones. She came to Solomon and spoke with him about all that was in her heart.
translation:
  language: sw
  text: Akaja Yerusalemu akiwa na msafara mkubwa sana[a], pamoja na ngamia waliobeba manukato, dhahabu nyingi sana, na mawe ya thamani. Akamwendea Sulemani, akazungumza naye kuhusu yote yaliyokuwa moyoni mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akiwa na kundi kubwa sana la watu”; neno la Kiebrania חַיִל linaweza kumaanisha mali, nguvu, jeshi, au kundi kubwa la watu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: akiwa na msafara mkubwa sana
  rationale: Neno חַיִל linaweza kumaanisha mali, nguvu, jeshi, au kundi kubwa la watu. Katika muktadha huu wa safari ya kifalme, “msafara mkubwa sana” linaonyesha kundi kubwa na lenye hadhi lililoandamana naye bila kudokeza kwa lazima kwamba lilikuwa jeshi.
- source_word: גְּמַלִּים נֹשְׂאִים בְּשָׂמִים
  choice: ngamia waliobeba manukato
  rationale: Hii inawasilisha kiasili kishiriki cha Kiebrania na maana ya בְּשָׂמִים kama vitu vyenye harufu nzuri au viungo vya thamani.
- source_word: וְזָהָב רַב מְאֹד
  choice: dhahabu nyingi sana
  rationale: Huhifadhi msisitizo wa wingi uliomo katika רַב מְאֹד kwa Kiswahili cha kawaida na wazi.
- source_word: וְאֶבֶן יְקָרָה
  choice: na mawe ya thamani
  rationale: Ingawa אֶבֶן ni umoja kisarufi, hapa linaweza kutumiwa kwa maana ya jumla; wingi ni wa asili zaidi katika orodha hii ya bidhaa za thamani.
- source_word: וַתָּבֹא אֶל שְׁלֹמֹה
  choice: Akamwendea Sulemani
  rationale: Hutofautisha hatua ya kufika Yerusalemu na hatua inayofuata ya kwenda kwa Sulemani, huku ikihifadhi mwendelezo wa simulizi.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: na kumwambia
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba alimweleza Sulemani yaliyokuwa moyoni mwake bila kulazimisha maana ya mazungumzo ya pande mbili.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: yote yaliyokuwa moyoni mwake
  rationale: Huhifadhi sitiari ya Kiebrania ya moyo kama makao ya mawazo, maswali, na mahangaiko, badala ya kuibadili kuwa “aliyokuwa akifikiria” pekee.
