  yaml_path: translation/ot/1_kings/010/023.yaml
  text: So King Solomon surpassed all the kings of the earth in wealth and wisdom[a].
translation:
  language: sw
  text: Basi Mfalme Sulemani akawapita wafalme wote wa dunia kwa utajiri na hekima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na muundo wa Kiebrania, “Basi Mfalme Sulemani akawa mkuu kuliko wafalme wote wa dunia kwa utajiri na hekima.” Neno lililotafsiriwa “dunia” linaweza pia kutafsiriwa “nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: akawapita
  rationale: Katika muundo huu wa kulinganisha wenye מִן, kitenzi גדל kinaonyesha kuwa mkuu kuliko wengine; “akawapita” ni Kiswahili cha kawaida kinachowasilisha ulinganisho huo bila kuongeza maana.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Mfalme Sulemani
  rationale: Muundo wa cheo kikifuatiwa na jina ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: wafalme wote wa dunia
  rationale: אֶרֶץ inaweza kumaanisha “nchi” au “dunia”; katika dai hili pana la kulinganisha wafalme, “dunia” linafaa zaidi, huku uwezekano wa “nchi” ukibainishwa katika tanbihi.
- source_word: לְעֹשֶׁר
  choice: kwa utajiri
  rationale: עֹשֶׁר ni mali au utajiri; “kwa utajiri” linaonyesha eneo ambalo Sulemani aliwapita wafalme wengine.
- source_word: וּלְחָכְמָה
  choice: na hekima
  rationale: חָכְמָה ni “hekima”; kiunganishi kinaunganisha kwa kawaida vipengele viwili vinavyotawaliwa na “kwa.”
- source_word: וַ
  choice: Basi
  rationale: Waw hapa linaendeleza simulizi na kutoa muhtasari wa matokeo; “Basi” huwasilisha kazi hiyo kwa Kiswahili cha asili.
theological_decisions: []
