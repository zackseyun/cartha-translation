  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Akawapita” limetumiwa kwa ulinganisho wa kawaida, huku tanbihi ikihifadhi tafsiri rasmi zaidi na utata wa אֶרֶץ.
