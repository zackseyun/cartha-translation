base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/011.yaml
  text: Also[a], Hiram’s fleet, which carried gold from Ophir[b], brought from Ophir a very great quantity of almug wood and precious stones.
translation:
  language: sw
  text: Pia, meli za Hiramu[a], zilizobeba dhahabu kutoka Ofiri, zilileta kutoka Ofiri mbao nyingi sana za almugi[b] na mawe ya thamani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “meli ya Hiramu.” Nomino ya Kiebrania iko katika umoja, lakini huenda imetumiwa kwa maana ya mkusanyiko wa meli au shughuli za Hiramu za usafiri wa baharini.
    reason: lexical_alternative
  - marker: b
    text: Aina halisi ya mbao zinazoitwa “almugi” haijulikani kwa uhakika; jina hilo pia huandikwa “algumi” katika sehemu nyingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Pia
  rationale: Neno hili linaendeleza simulizi kwa kuongeza habari nyingine; “Pia” ni la kawaida na linahifadhi maana ya nyongeza.
- source_word: אֳנִי חִירָם
  choice: kundi la meli la Hiramu
  rationale: Nomino ya Kiebrania iko katika umoja, lakini katika muktadha inaweza kutumiwa kwa maana ya mkusanyiko wa meli au shughuli za usafiri wa baharini za Hiramu. Tafsiri hii ni ya asili katika Kiswahili huku tanbihi ikihifadhi uwezekano wa meli moja.
- source_word: אֲשֶׁר נָשָׂא זָהָב
  choice: lililobeba dhahabu
  rationale: Kitenzi נָשָׂא kina maana ya kubeba; “kubeba dhahabu” kinafaa kwa shehena ya meli na ni Kiswahili cha kawaida.
- source_word: מֵאוֹפִיר
  choice: kutoka Ofiri
  rationale: Inahifadhi kihusishi cha mahali na jina la mahali Ofiri.
- source_word: הֵבִיא
  choice: lilileta
  rationale: Hii ni maana ya kawaida ya umbo la Hifili la בוא katika muktadha wa kuingiza shehena.
- source_word: עֲצֵי אַלְמֻגִּים
  choice: mbao ... za almugi
  rationale: Aina halisi ya mti haijulikani kwa uhakika; “almugi” huhifadhi jina linalotokana na Kiebrania bila kulinganisha kwa uhakika na aina fulani ya mti.
- source_word: הַרְבֵּה מְאֹד
  choice: nyingi sana
  rationale: Maneno haya yanasisitiza wingi mkubwa; “nyingi sana” ni ya asili na huhifadhi mkazo huo.
- source_word: וְאֶבֶן יְקָרָה
  choice: na mawe ya thamani
  rationale: Ingawa אֶבֶן iko katika umoja wa kisarufi, inaweza kuwa na maana ya jumla; wingi wa Kiswahili unafaa kwa orodha ya shehena.
