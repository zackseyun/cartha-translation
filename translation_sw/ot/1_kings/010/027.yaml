  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֧לֶךְ אֶת הַ/כֶּ֛סֶף בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/027.yaml
  text: The king made silver as common in Jerusalem as stones[b][a], and he made cedars as plentiful as the sycamore trees that are in the Shephelah.
translation:
  language: sw
  text: Mfalme akafanya fedha iwe ya kawaida huko Yerusalemu kama mawe, na akafanya mierezi iwe mingi kama mikuyu[a] iliyo katika Shefela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mikuyu ya sycamore,” yaani miti ya aina ya mkuyu inayozaa tini.'
    reason: lexical_alternative
  - marker: b
    text: Au, “nchi ya vilima vya chini.” “Shefela” ni jina la eneo la vilima vya chini vya Yuda kati ya nchi ya milima na uwanda wa pwani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: akafanya ... iwe ya kawaida / akafanya ... iwe mingi
  rationale: Ingawa kitenzi נתן kwa msingi humaanisha ‘kutoa’ au ‘kuweka,’ hapa kinatumika kwa maana ya kusababisha vitu viwe vingi au vya kawaida. Muundo huu wa Kiswahili unaonyesha maana hiyo ya kisababishi kwa kawaida.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Kiebrania kinasema ‘mfalme,’ bila kumtaja Sulemani moja kwa moja katika aya hii; tafsiri inahifadhi usemi huo.
- source_word: הַכֶּסֶף
  choice: fedha
  rationale: Hapa nomino hii inarejelea fedha kama madini au mali kwa ujumla, si sarafu mahususi.
- source_word: בִּירוּשָׁלִַם
  choice: huko Yerusalemu
  rationale: Ni tafsiri ya kawaida ya mahali; ‘huko’ inasomeka kwa urahisi katika sentensi hii.
- source_word: כָּאֲבָנִים
  choice: kama mawe
  rationale: Kiambishi כ kinaonyesha ulinganisho; ‘kama mawe’ kinahifadhi picha ya wingi na hali ya kuwa kawaida.
- source_word: הָאֲרָזִים
  choice: mierezi
  rationale: Wingi wa אֶרֶז unamaanisha miti ya mierezi au mbao zake. ‘Mierezi’ huhifadhi upana wa usemi wa Kiebrania bila kuamua kimya kuwa ni miti au mbao pekee.
- source_word: כַּשִּׁקְמִים
  choice: kama mikuyu
  rationale: שִׁקְמִים ni miti ya sycamore fig. ‘Mikuyu’ ni neno la kawaida la Kiswahili kwa kundi la miti hii, huku tanbihi ikibainisha aina inayokusudiwa.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: iliyo katika Shefela
  rationale: שְׁפֵלָה ni jina la eneo la vilima vya chini vya Yuda. ‘Shefela’ huhifadhi rejeleo mahususi la kijiografia badala ya kulifanya kuwa ‘nchi tambarare’ kwa ujumla.
- source_word: לָרֹב
  choice: iwe mingi
  rationale: Kirai hiki huonyesha wingi mkubwa; ‘iwe mingi’ kinakamilisha ulinganisho kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Ulinganisho wa kishairi na kurudiwa kwa muundo wa kisababishi vimehifadhiwa.
