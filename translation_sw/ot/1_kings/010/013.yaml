source:
  edition: WLC
  text: וְ/הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה נָתַ֣ן לְ/מַֽלְכַּת שְׁבָ֗א אֶת כָּל חֶפְצָ/הּ֙ אֲשֶׁ֣ר שָׁאָ֔לָה מִ/לְּ/בַד֙ אֲשֶׁ֣ר נָֽתַן לָ֔/הּ כְּ/יַ֖ד הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וַ/תֵּ֛פֶן וַ/תֵּ֥לֶךְ לְ/אַרְצָ֖/הּ הִ֥יא וַ/עֲבָדֶֽי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/013.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what he gave her according to the hand of King Solomon. Then she turned and went to her own land, she and her servants.
translation:
  language: sw
  text: Mfalme Sulemani akampa malkia wa Sheba kila alichotamani, chochote alichoomba, zaidi ya yale aliyompa kwa kadiri ya ukarimu wa Mfalme Sulemani.[a] Kisha malkia akaondoka, akaenda katika nchi yake pamoja na watumishi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, Kiebrania kinasema, “kulingana na mkono wa Mfalme Sulemani,” nahau inayoweza kumaanisha kulingana na uwezo, mali, au ukarimu wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: akampa / aliyompa
  rationale: Kitenzi cha kawaida cha kutoa; “kumpa” kinaonyesha kwa kawaida na kwa usahihi kwamba Sulemani alimpa malkia vitu hivyo.
- source_word: מַלְכַּת שְׁבָא
  choice: malkia wa Sheba
  rationale: Huhifadhi cheo cha kifalme na jina la mahali kwa namna iliyozoeleka katika Kiswahili.
- source_word: כָּל חֶפְצָהּ
  choice: kila alichotamani
  rationale: חֵפֶץ inaweza kumaanisha tamaa, mapendezi, au kitu kinachotamaniwa; usemi huu ni wa asili na unahifadhi maana hiyo.
- source_word: אֲשֶׁר שָׁאָלָה
  choice: chochote alichoomba
  rationale: שׁאל hapa ni kuomba au kutaka apewe; “chochote” huonyesha upana wa kifungu cha Kiebrania.
- source_word: מִלְּבַד
  choice: zaidi ya
  rationale: Katika muktadha huu neno linaonyesha nyongeza, si kuondoa kitu; “zaidi ya” ni wazi na ya kawaida.
- source_word: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: kwa kadiri ya ukarimu wa Mfalme Sulemani
  rationale: Kwa neno moja moja ni “kulingana na mkono wa Mfalme Sulemani,” lakini hapa “mkono” ni nahau inayohusu uwezo, mali, au ukarimu wake. Tafsiri hii inawasilisha maana katika Kiswahili cha kawaida bila kupoteza wazo la utoaji wake wa kifalme.
- source_word: וַתֵּפֶן וַתֵּלֶךְ
  choice: akaondoka, akaenda
  rationale: וַתֵּפֶן kwa msingi ni “akageuka,” lakini katika mfuatano huu inaashiria kuondoka. “Akaondoka, akaenda” ni ya asili huku ikidumisha vitendo viwili vya simulizi.
- source_word: לְאַרְצָהּ
  choice: katika nchi yake
  rationale: Huonyesha mahali alikoelekea, yaani nchi yake mwenyewe, bila kuongeza wazi wazo la kurudi ambalo halijaandikwa moja kwa moja.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: pamoja na watumishi wake
  rationale: עֲבָדֶיהָ inaweza kumaanisha watumishi au wahudumu; katika mazingira ya kifalme “watumishi” ni pana, sahihi, na ya kawaida.
theological_decisions:
- issue: Tafsiri ya nahau כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: kwa kadiri ya ukarimu wa Mfalme Sulemani
  alternative: kulingana na mkono wa Mfalme Sulemani; kwa kadiri ya uwezo wa Mfalme Sulemani
  rationale: Nahau hiyo inaweza kuelekeza kwenye uwezo, mali, au ukarimu wa Sulemani. “Ukarimu” inafaa muktadha wa zawadi, huku tanbihi ikihifadhi picha halisi ya Kiebrania na uwezekano wa maana ya uwezo.
- issue: Maana ya עֲבָדֶיהָ katika simulizi la kifalme
  choice: watumishi wake
  alternative: wahudumu wake; watumwa wake
  rationale: Muktadha unataja watu waliokuwa wakifuatana na malkia bila kusisitiza hadhi yao ya kisheria. “Watumishi” huhifadhi upana wa neno bila kuingiza dai kali zaidi lisilohitajika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa simulizi umetumia viambishi vya mfululizo “aka-”; “malkia” limerudiwa katika sentensi ya pili ili kuepusha utata wa kiwakilishi na kufanya usomaji uwe wa kawaida.
