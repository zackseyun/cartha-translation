  text: Heri wanaume wako! Heri hawa watumishi wako, wanaosimama mbele yako daima na kusikia hekima yako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: Neno hili linaeleza hali yenye kustahili kutamaniwa ya ustawi au baraka. “Heri” ni usemi wa Kiswahili wenye hadhi na unaofaa katika tamko la aina hii.
- source_word: אֲנָשֶׁיךָ
  choice: watu wako
  rationale: Ingawa nomino ya Kiebrania ni ya wingi wa kiume, katika Kiswahili “watu wako” ni usemi wa kawaida na wa asili kwa watu wa mfalme waliokuwa katika ikulu, bila kudai kwamba maana hapa ni raia wote.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika mazingira ya ikulu, neno hili humaanisha walio katika utumishi wa mfalme. “Watumishi” linafaa zaidi kuliko “watumwa,” kwa kuwa hali ya utumwa si jambo linalosisitizwa katika mstari huu.
- source_word: אֵלֶּה
  choice: hawa
  rationale: Kiashiria hiki ni cha ukaribu na kinawatambulisha watumishi maalumu wanaoelezwa baadaye.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: wanaosimama mbele yako
  rationale: Tafsiri hii inadumisha picha halisi ya kusimama mbele ya mfalme huku ikibeba pia wazo la kuhudumu mbele zake.
- source_word: תָּמִיד
  choice: daima
  rationale: “Daima” linaonyesha uwepo wao wa kawaida na unaoendelea mbele ya mfalme, kwa lugha fupi yenye hadhi.
- source_word: הַשֹּׁמְעִים
  choice: na kuisikia
  rationale: Kirai hiki kinaendelea kuwaeleza watumishi hao kuwa wanasikia hekima ya mfalme. “Kuisikia” kinahifadhi kitenzi cha chanzo bila kuongeza wazo la kutii ambalo si wazi hapa.
- source_word: חָכְמָתֶךָ
  choice: hekima yako
  rationale: Hii ni tafsiri ya moja kwa moja inayorejelea hekima ya Sulemani bila kuongeza kwamba ni maneno au mafundisho yake pekee.
