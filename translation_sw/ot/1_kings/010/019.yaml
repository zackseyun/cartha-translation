base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/019.yaml
  text: The throne had six steps[a], and the throne had a rounded top at its back, and armrests on this side and on that beside the seat[b], and two lions standing beside the armrests.
translation:
  language: sw
  text: Kiti cha enzi kilikuwa na ngazi sita. Sehemu yake ya juu ilikuwa ya mviringo upande wa nyuma[a], na kilikuwa na sehemu za kuegemezea mikono pande zote mbili za mahali pa kuketi[b]. Simba wawili walikuwa wamesimama kando ya sehemu za kuegemezea mikono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kiti cha enzi kilikuwa na sehemu ya juu ya mviringo nyuma yake.” Kirai cha Kiebrania ni kifupi na kinaweza kutafsiriwa kwa namna hii ya karibu zaidi.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno moja moja, “mahali pa kuketi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת לַכִּסֵּה
  choice: kiti cha enzi kilikuwa na ngazi sita
  rationale: Katika maelezo ya jengo la kiti cha enzi, מַעֲלוֹת ni ngazi za kupandia. Muundo huu wa Kiswahili unaeleza kwa kawaida uhusiano wao na kiti cha enzi bila kubadili maana.
- source_word: רֹאשׁ עָגֹל
  choice: sehemu yake ya juu ilikuwa ya mviringo
  rationale: Kir حرفياً ni ‘kichwa/sehemu ya juu ya mviringo.’ Tafsiri hii inaeleza umbo bila kudai kwamba ilikuwa sehemu maalumu ya kuegemeza kichwa.
- source_word: מֵאַחֲרָיו
  choice: upande wa nyuma
  rationale: Kirai hiki kinaonyesha mahali sehemu ya juu ya mviringo ilipokuwa, yaani nyuma ya kiti.
- source_word: יָדֹת
  choice: sehemu za kuegemeza mikono
  rationale: Ingawa neno hilo linahusiana na ‘mikono,’ katika muktadha wa samani linamaanisha mikono ya pembeni ya kiti; usemi uliochaguliwa ni wazi katika Kiswahili cha sasa.
- source_word: מִזֶּה וּמִזֶּה
  choice: kila upande
  rationale: Usemi huu unaonyesha kuwa sehemu hizo zilikuwa upande mmoja na upande mwingine. ‘Kila upande’ ni Kiswahili cha kawaida na huhifadhi mpangilio huo wa pande mbili.
- source_word: אֶל מְקוֹם הַשָּׁבֶת
  choice: wa mahali pa kuketi
  rationale: Maana ya karibu kabisa ni ‘mahali pa kuketi.’ Katika muktadha huu, kirai kinaonyesha kwamba sehemu za kuegemeza mikono zilikuwa pembeni mwa eneo la kukalia.
- source_word: אֲרָיוֹת
  choice: simba
  rationale: Ni nomino ya wingi inayotaja simba, huenda sanamu za simba, lakini Kiebrania hakisemi wazi ‘sanamu’; kwa hiyo tafsiri haiongezi neno hilo.
- source_word: עֹמְדִים
  choice: walisimama
  rationale: Kitenzi kishirikishi kinaonyesha simba hao wakiwa katika hali ya kusimama. Wakati uliopita unapatana kwa kawaida na masimulizi ya Kiswahili.
- source_word: אֵצֶל הַיָּדוֹת
  choice: kando ya sehemu hizo
  rationale: Kirai kinaweka simba karibu na sehemu za kuegemeza mikono. ‘Sehemu hizo’ huepuka marudio mazito huku rejeleo likibaki wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Sentensi ndefu ya Kiebrania imegawanywa ili maelezo ya kiti yawe wazi. ‘Kiti cha enzi’ limetumiwa kwa כִּסֵּא, na ‘sehemu za kuegemeza mikono’ linafafanua יָדֹת kwa lugha ya kawaida bila kuifanya maana iwe maalumu kupita ushahidi wa chanzo.
