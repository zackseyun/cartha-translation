  text: כִּי֩ אֳנִ֨י תַרְשִׁ֤ישׁ לַ/מֶּ֨לֶךְ֙ בַּ/יָּ֔ם עִ֖ם אֳנִ֣י חִירָ֑ם אַחַת֩ לְ/שָׁלֹ֨שׁ שָׁנִ֜ים תָּב֣וֹא אֳנִ֣י תַרְשִׁ֗ישׁ נֹֽשְׂאֵת֙ זָהָ֣ב וָ/כֶ֔סֶף שֶׁנְהַבִּ֥ים וְ/קֹפִ֖ים וְ/תֻכִּיִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/022.yaml
  text: For the king had ships of Tarshish at sea with Hiram’s ships. Once every three years the ships of Tarshish would come, carrying gold and silver, ivory, apes, and peacocks.
translation:
  language: sw
  text: Kwa maana mfalme alikuwa na meli za Tarshishi[a] baharini pamoja na meli za Hiramu. Kila baada ya miaka mitatu, meli za Tarshishi zilikuja zikiwa zimebeba dhahabu, fedha, pembe za ndovu, nyani na tausi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “meli za safari za bahari kuu.” Maana ya usemi wa Kiebrania haijulikani kwa hakika.
    reason: Usemi אֳנִי תַרְשִׁישׁ unaweza kutaja meli zinazohusishwa na mahali paitwapo Tarshishi au aina ya meli za safari ndefu.
  - marker: b
    text: Neno la Kiebrania linalotafsiriwa “tausi” halimtambulishi mnyama huyo kwa uhakika.
    reason: Utambulisho wa תֻכִּיִּים una utata wa kileksika katika ushahidi wa lugha ya asili.
lexical_decisions:
- source_word: אֳנִי תַרְשִׁישׁ
  choice: meli za Tarshishi
  rationale: Muundo huu unahifadhi jina la Kiebrania na kufuata maana ya vyombo vya safari ndefu za baharini; unaweza kumaanisha meli zilizohusishwa na Tarshishi au aina ya meli za bahari kuu.
- source_word: שֶׁנְהַבִּים
  choice: pembe za ndovu
  rationale: Neno humaanisha pembe za ndovu/ivory; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: קֹפִים
  choice: nyani
  rationale: Ni neno la jumla linalofaa kwa wanyama wa jamii ya tumbili wanaotajwa katika mzigo wa kigeni.
- source_word: תֻכִּיִּים
  choice: tausi
  rationale: Hii ndiyo tafsiri ya jadi na inayolingana na orodha ya bidhaa za kigeni, ingawa utambulisho kamili wa mnyama haujulikani kwa hakika.
