translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Biblia. “Kila baada ya miaka mitatu” hutoa kwa uwazi wazo la safari inayorudi baada ya kipindi cha miaka mitatu; “zilikuja zikiwa zimebeba” ni ya asili kwa meli zinazoleta mizigo.
