  text: And Solomon answered all her questions[a]; there was nothing hidden from the king that he did not tell her.
translation:
  language: sw
  text: Naye Sulemani akajibu maswali yake yote[a]; hakuna jambo lililofichika kwa mfalme ambalo hakumweleza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na muundo wa Kiebrania, “Sulemani akamweleza mambo yake yote.” Katika muktadha, mambo hayo ni maswali ambayo malkia alimwuliza Sulemani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: akajibu
  rationale: Ingawa kitenzi נגד kwa kawaida humaanisha ‘kueleza’ au ‘kutangaza,’ hapa kinaeleza jinsi Sulemani alivyoitikia maswali magumu ya malkia; ‘akajibu’ ni Kiswahili cha kawaida kinachofaa muktadha huo.
- source_word: דְּבָרֶיהָ
  choice: maswali yake yote
  rationale: דבר inaweza kumaanisha neno, jambo, au suala. Kwa kuwa malkia alikuja kumjaribu Sulemani kwa maswali magumu (mst. 1), hapa maana ya kimuktadha ni ‘maswali yake.’
- source_word: לֹא הָיָה דָּבָר נֶעְלָם
  choice: hakuna jambo lililofichika
  rationale: Kauli hii inadumisha taswira ya Kiebrania kwamba hakuna jambo lililobaki limefichika au nje ya ufahamu wa Sulemani.
- source_word: מִן־הַמֶּלֶךְ
  choice: kwa mfalme
  rationale: Katika Kiswahili, ‘lililofichika kwa mfalme’ huwasilisha kwa kawaida maana ya jambo lililofichwa kutoka kwake au lisilojulikana kwake, huku ‘mfalme’ ikihifadhi msisitizo wa kifalme wa Kiebrania.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: ambalo hakumweleza
  rationale: Kishazi hiki kinafafanua kwamba hakuna jambo ambalo mfalme alishindwa kumfunulia au kumweleza malkia; ‘hakumweleza’ ni wazi na cha kawaida.
theological_decisions: []
