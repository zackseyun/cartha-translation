  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imetumia ‘akajibu maswali yake yote’ kwa ufasaha wa kimuktadha, huku tanbihi ikihifadhi upana wa maana ya maneno ya Kiebrania.
