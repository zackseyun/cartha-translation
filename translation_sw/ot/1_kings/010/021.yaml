base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/021.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[b]. Silver was not considered anything in the days of Solomon.
translation:
  language: sw
  text: Vyombo vyote vya kunywea vya Mfalme Sulemani vilikuwa vya dhahabu, na vyombo vyote vya Nyumba ya Msitu wa Lebanoni vilikuwa vya dhahabu safi[a]. Fedha haikuhesabiwa kuwa ya maana yoyote katika siku za Sulemani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhahabu iliyosafishwa.”
    reason: lexical_alternative
  - marker: b
    text: Au “Fedha haikuhesabiwa kuwa na thamani yoyote katika siku za Sulemani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: vyombo vya kunywea
  rationale: Neno כְּלֵי ni pana, likimaanisha vyombo au vifaa, huku מַשְׁקֵה ikibainisha matumizi yanayohusiana na kunywa. “Vyombo vya kunywea” ni Kiswahili cha kawaida na hakipunguzi maana kuwa vikombe pekee.
- source_word: זָהָב
  choice: dhahabu
  rationale: Hili ni neno la kawaida la nyenzo hiyo, na kurudiwa kwake kunadumisha msisitizo wa utajiri na fahari.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Nyumba ya Msitu wa Lebanoni
  rationale: Jina hili linahifadhi muundo wa Kiebrania na hadhi yake kama jina maalumu la jengo la kifalme, bila kulibainisha zaidi kuwa ikulu.
- source_word: זָהָב סָגוּר
  choice: dhahabu safi
  rationale: Katika muktadha huu סָגוּר huashiria dhahabu yenye ubora mkubwa au iliyosafishwa. “Dhahabu safi” ni ya asili katika Kiswahili na haidai kwa lazima kwamba vyombo vilikuwa dhahabu tupu bila kiini cha nyenzo nyingine.
- source_word: אֵין כֶּסֶף לֹא נֶחְשָׁב לִמְאוּמָה
  choice: Fedha haikuhesabiwa kuwa kitu chochote
  rationale: Kauli hii inaonyesha tathmini ya fedha kuwa isiyo na umuhimu, si kwamba fedha haikuwapo kabisa. Tafsiri inadumisha nahau na nguvu ya tamko la Kiebrania.
- source_word: בִּימֵי שְׁלֹמֹה
  choice: katika siku za Sulemani
  rationale: Hii ni tafsiri ya karibu ya usemi wa wakati katika Kiebrania na inafaa mtindo wenye hadhi wa simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Vyombo vya kunywea” kimetumiwa badala ya “vikombe” ili kuhifadhi upana wa neno la Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
