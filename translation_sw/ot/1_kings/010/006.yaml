  text: וַ/תֹּ֨אמֶר֙ אֶל הַ/מֶּ֔לֶךְ אֱמֶת֙ הָיָ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר שָׁמַ֖עְתִּי בְּ/אַרְצִ֑/י עַל דְּבָרֶ֖י/ךָ וְ/עַל חָכְמָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/006.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: sw
  text: Ndipo akamwambia mfalme, “Habari niliyoisikia katika nchi yangu kuhusu maneno yako[a] na hekima yako ilikuwa ya kweli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mambo yako” au “matendo yako.” Neno la Kiebrania lililotafsiriwa “maneno yako” linaweza pia kumaanisha kwa upana mambo yanayokuhusu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ndipo akamwambia
  rationale: Muundo wa waw-consecutive unaendeleza simulizi; “Ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akamwambia” huwasilisha kwa asili usemi ulioelekezwa kwa mfalme.
- source_word: אֶל־הַמֶּלֶךְ
  choice: mfalme
  rationale: Kiambishi cha mtendewa katika “akamwambia mfalme” kinawakilisha kwa kawaida kishazi cha Kiebrania ‘kwa mfalme,’ huku umaalumu wa nomino ukieleweka katika muktadha.
- source_word: אֱמֶת הָיָה הַדָּבָר
  choice: Habari ... ilikuwa ya kweli
  rationale: דָּבָר hapa ni jambo lililosikiwa kuhusu Solomoni, hivyo “habari” linafaa kuliko “neno”; אֱמֶת imetafsiriwa kiarifu kama “ya kweli.”
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: niliyoisikia
  rationale: Huu ni uwasilishaji wa kawaida wa kishazi rejeshi, ukirejelea “habari.”
- source_word: בְּאַרְצִי
  choice: katika nchi yangu
  rationale: Huhifadhi maana ya moja kwa moja ya אֶרֶץ pamoja na kiambishi cha nafsi ya kwanza.
- source_word: עַל־דְּבָרֶיךָ
  choice: kuhusu maneno yako
  rationale: “Maneno yako” ni tafsiri ya karibu ya wingi דְּבָרֶיךָ, ingawa katika muktadha inaweza kumaanisha kwa upana mambo au matendo yanayomhusu mfalme; utata huo umehifadhiwa kwa tanbihi.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: na hekima yako
  rationale: Tafsiri ya moja kwa moja inayohifadhi uratibu wa kishazi na kiini cha muktadha.
