translation:
  language: sw
  text: Uzito wa dhahabu iliyomfikia Sulemani katika mwaka mmoja ulikuwa talanta mia sita sitini na sita za dhahabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talanta ilikuwa kipimo kikubwa cha uzito; mstari huu unataja kiasi kilichopatikana katika mwaka mmoja kwa kipimo cha kale bila kukibadili kuwa vitengo vya kisasa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: ulikuwa
  rationale: Kitenzi hiki kinaanzisha taarifa ya simulizi; katika Kiswahili maana yake inaunganishwa kwa kawaida na kiarifu “ulikuwa” bila kuongeza neno la wakati kama “sasa” ambalo halipo wazi katika chanzo.
- source_word: מִשְׁקַל
  choice: uzito
  rationale: Nomino hii hutaja uzito au kipimo cha uzito; “uzito” ni tafsiri ya moja kwa moja na ya kawaida katika taarifa hii ya kihesabu.
- source_word: הַזָּהָב ... זָהָב
  choice: dhahabu ... za dhahabu
  rationale: Tajio la kwanza linabainisha bidhaa iliyopokelewa, na la pili linaeleza kuwa talanta hizo ni za dhahabu; kurudia huko kunafuata muundo wa Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: iliyomfikia Sulemani
  rationale: Muundo wa בוא pamoja na ל unaonyesha kitu kilichomjia au kumfikia Sulemani. “Iliyomfikia” huhifadhi maana hiyo bila kudai kwamba mtu fulani ndiye aliyeileta.
- source_word: בְּשָׁנָה אֶחָת
  choice: katika mwaka mmoja
  rationale: Kirai hiki kinaonyesha kiasi kilichopatikana ndani ya kipindi cha mwaka mmoja.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וָשֵׁשׁ
  choice: mia sita sitini na sita
  rationale: Hii ndiyo namna ya kawaida na wazi ya kutaja idadi 666 katika Kiswahili.
- source_word: כִּכַּר
  choice: talanta
  rationale: “Talanta” ni istilahi iliyozoeleka katika tafsiri za Biblia kwa kipimo hiki kikubwa cha kale; kipimo hakibadilishwi kuwa vitengo vya kisasa katika matini kuu.
