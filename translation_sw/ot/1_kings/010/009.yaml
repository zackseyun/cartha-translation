reference: 1 Kings 10:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁר֙ חָפֵ֣ץ בְּ/ךָ֔ לְ/תִתְּ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל בְּ/אַהֲבַ֨ת יְהוָ֤ה אֶת יִשְׂרָאֵל֙ לְ/עֹלָ֔ם וַ/יְשִֽׂימְ/ךָ֣ לְ/מֶ֔לֶךְ לַ/עֲשׂ֥וֹת מִשְׁפָּ֖ט וּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/009.yaml
  text: Blessed be Yahweh your God[a], who delighted in you to set you on the throne of Israel. Because Yahweh loved Israel forever, he has made you king to administer justice and righteousness.
translation:
  language: sw
  text: Na ahimidiwe Yahwe Mungu wako, aliyependezwa nawe na kukuweka kwenye kiti cha enzi cha Israeli. Kwa sababu ya upendo wa Yahwe kwa Israeli milele[a], amekufanya kuwa mfalme ili utekeleze haki na uadilifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa kuwa Yahwe anaipenda Israeli milele.” Kiebrania kinasema kihalisi zaidi, “kwa sababu ya upendo wa Yahwe kwa Israeli milele,” kikitumia “upendo” kama nomino.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: Na ahimidiwe
  rationale: Huu ni usemi wa baraka wenye maana ya kutamani au kutangaza sifa. “Na ahimidiwe” ni Kiswahili cha kawaida na chenye hadhi kinapotumiwa kumhusu Mungu, huku kikihifadhi nguvu ya usemi huo.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe,” na kiambishi cha nafsi ya pili umoja katika אֱלֹהֶיךָ kimetafsiriwa “Mungu wako.”
- source_word: אֲשֶׁר חָפֵץ בְּךָ
  choice: aliyependezwa nawe
  rationale: Kitenzi חפץ pamoja na ב kinaonyesha kupendezwa au kufurahia mtu; “aliyependezwa nawe” ni cha asili na hakiongezi sababu isiyotajwa.
- source_word: לְתִתְּךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: na kukuweka kwenye kiti cha enzi cha Israeli
  rationale: נתן pamoja na עַל כִּסֵּא hapa huonyesha kumweka mtu katika mamlaka ya kifalme. “Kiti cha enzi” kinahifadhi taswira ya Kiebrania.
- source_word: בְּאַהֲבַת יְהוָה אֶת יִשְׂרָאֵל לְעֹלָם
  choice: Kwa sababu ya upendo wa Yahwe kwa Israeli milele
  rationale: ב imetafsiriwa kwa maana ya sababu, na nomino אַהֲבָה imehifadhiwa kama “upendo.” Muundo huu pia huepuka kulazimisha wakati wa kitenzi ambao haujaelezwa wazi katika Kiebrania.
- source_word: וַיְשִׂימְךָ לְמֶלֶךְ
  choice: amekufanya kuwa mfalme
  rationale: שׂים pamoja na לְ huonyesha kuwekwa au kuteuliwa katika cheo. Wakati timilifu wa Kiswahili unafaa kwa tendo lililotimia ambalo matokeo yake yanaendelea.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: ili utekeleze haki na uadilifu
  rationale: Katika muktadha wa kifalme, עשה inaeleza wajibu wa kutawala na kuhukumu. “Kutekeleza haki na uadilifu” ni Kiswahili cha sasa kinachobakiza jozi ya maadili ya מִשְׁפָּט na צְדָקָה.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, kwa hiyo limetoholewa badala ya kubadilishwa kuwa cheo.
- issue: Maana ya בְּאַהֲבַת יְהוָה na wakati wa upendo huo
  choice: Kwa sababu ya upendo wa Yahwe kwa Israeli milele
  alternative: Kwa kuwa Yahwe anawapenda Israeli milele
  rationale: Tafsiri kuu inahifadhi “upendo” kama nomino na kuchukua ב kwa maana ya sababu. Mbadala wa footnote unaonyesha kwamba wazo hilo linaweza kusemwa kwa kitenzi cha wakati wa sasa bila kudai kuwa Kiebrania chenyewe kina kitenzi hicho.
- issue: Uhusiano wa haki na uadilifu katika utawala wa mfalme
  choice: kutekeleza haki na uadilifu
  alternative: kutenda hukumu na haki
  rationale: Chaguo kuu linaonyesha wajibu wa kifalme bila kuziunganisha istilahi hizo na mfumo maalumu wa kiteolojia au wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. “Na ahimidiwe” limetumiwa kama tamko la kawaida la sifa kwa Mungu, na “kiti cha enzi” huhifadhi taswira ya kifalme.
