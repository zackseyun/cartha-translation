base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/012.yaml
  text: The king made the almug wood into supports for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers. Never before had such almug wood come[b], nor has any been seen to this day.
translation:
  language: sw
  text: Mfalme akatengeneza kwa mbao za almugi[a] viegemezo[b] kwa ajili ya nyumba ya Yahweh na nyumba ya mfalme, na vinubi na vinanda kwa ajili ya waimbaji. Mbao za almugi za namna hiyo hazikuwa zimewahi kufika, wala hazikuonekana tena hadi leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbao za algumi.” Neno linalohusiana nalo lina tahajia tofauti katika kifungu sambamba na mapokeo ya maandishi.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “viegemezo” ni adimu; huenda likamaanisha vipengele vya usanifu kama ngazi au reli.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָאַלְמֻגִּים
  choice: mbao za almugi
  rationale: Kirai hiki kinataja mbao ya thamani iliyoagizwa kutoka mbali. Jina la aina hiyo limetoholewa kama “almugi” badala ya kubashiri utambulisho wake wa kisasa wa kibotania; “mbao” linafaa zaidi kwa vitu vilivyotengenezwa.
- source_word: מִסְעָד
  choice: viegemezo
  rationale: Nomino hii ni adimu na maana yake kamili haijulikani. “Viegemezo” hudumisha wazo la kitu cha usanifu kinachotegemeza bila kuamua kwa uhakika kuwa ni ngazi, vizuizi, au nguzo.
- source_word: לְבֵית יְהוָה
  choice: kwa ajili ya nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi tamathali ya Kiebrania, huku “Yahwe” likiwakilisha jina la Mungu יְהוָה.
- source_word: וּלְבֵית הַמֶּלֶךְ
  choice: na nyumba ya mfalme
  rationale: Huhifadhi ulinganifu wa Kiebrania kati ya nyumba ya Yahwe na nyumba ya mfalme; maana ya pili inaweza kuwa ikulu.
- source_word: וְכִנֹּרוֹת וּנְבָלִים
  choice: vinubi na vinanda
  rationale: Majina haya ya kawaida ya vyombo vya nyuzi yanaweka tofauti kati ya aina mbili zilizotajwa, ingawa utambulisho sahihi wa vyombo vya kale hauna uhakika.
- source_word: לַשָּׁרִים
  choice: kwa ajili ya waimbaji
  rationale: Neno linatokana na kitenzi “kuimba,” kwa hiyo “waimbaji” ni sahihi kuliko neno pana “wanamuziki.”
- source_word: לֹא בָא כֵן ... וְלֹא נִרְאָה עַד הַיּוֹם הַזֶּה
  choice: hazikuwa zimewahi kufika, wala hazijaonekana tena hadi leo
  rationale: Kauli hii ya Kiswahili inaeleza hali isiyokuwa na mfano na mwendelezo wa ushuhuda hadi wakati wa msimulizi. “Tena” huweka wazi maana inayodokezwa kwamba baada ya shehena hiyo mbao za namna hiyo hazikuonekana.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la agano moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kusomeka lakini huhifadhi ulinganifu wa “nyumba ya Yahwe” na “nyumba ya mfalme,” pamoja na kutokuwa na uhakika kwa istilahi ya usanifu.
