base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/005.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers, their clothing, his cupbearers, and his burnt offering that he offered at the house of Yahweh, there was no more breath in her.
translation:
  language: sw
  text: chakula mezani pake, mpangilio wa kuketi kwa watumishi wake, jinsi wahudumu wake walivyosimama, mavazi yao, wanyweshaji wake, na sadaka yake ya kuteketezwa[a] aliyotoa katika nyumba ya Yahweh. Malkia alibaki bila pumzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupanda kwake kwenda katika nyumba ya Yahweh,” labda ikimaanisha ngazi au msafara ambao alipitia akipanda kwenda huko.
    reason: alternative_reading
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: chakula mezani pake
  rationale: Huhifadhi picha halisi ya chakula kilichokuwa kwenye meza ya mfalme kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: mpangilio wa kuketi kwa watumishi wake
  rationale: מוֹשָׁב hapa inaelekea kumaanisha mpangilio rasmi wa viti au ukaaji wa watumishi katika mazingira ya kifalme.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: jinsi wahudumu wake walivyosimama
  rationale: Huhifadhi wazo halisi la kusimama au kuwa katika nafasi rasmi, huku 'wahudumu' ikitofautishwa na kundi pana la watumishi.
- source_word: מַלְבֻּשֵׁיהֶם
  choice: mavazi yao
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya nguo au mavazi yao.
- source_word: מַשְׁקָיו
  choice: wanyweshaji wake
  rationale: Katika ikulu neno hili linaweza kutaja maofisa waliomhudumia mfalme kwa vinywaji, si vinywaji vyenyewe tu.
- source_word: עֹלָתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: sadaka yake ya kuteketezwa aliyotoa katika nyumba ya Yahweh
  rationale: Hufuata irabu za MT, ambazo zinaelekeza kwenye sadaka ya kuteketezwa; uwezekano wa 'kupanda kwake' umehifadhiwa katika tanbihi.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Huhifadhi kwa karibu msemo wa Kiebrania 'nyumba ya YHWH' na kulitaja jina la agano Yahweh.
- source_word: וְלֹא הָיָה בָּהּ עוֹד רוּחַ
  choice: Malkia alibaki bila pumzi
  rationale: Huhifadhi picha ya רוּחַ kama pumzi na kueleza kwa Kiswahili asilia mshangao mkubwa uliompata; kutaja malkia huepusha utata wa kiwakilishi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu YHWH moja kwa moja; 'Yahweh' huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Maana ya עֹלָתוֹ katika orodha
  choice: sadaka yake ya kuteketezwa
  alternative: kupanda kwake kwenda katika nyumba ya Yahweh; ngazi aliyopandia
  rationale: Irabu za MT zinaunga mkono maana ya sadaka ya kuteketezwa, lakini maandishi ya konsonanti yameruhusu pia ufafanuzi wa kupanda au njia ya kupandia; tanbihi huhifadhi utata huo wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha umehifadhiwa, huku misemo isiyo ya kawaida ikifanywa kuwa asilia bila kufuta picha na utata wa Kiebrania.
