base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/010.yaml
  text: And she gave the king one hundred and twenty talents of gold[a], and a very great quantity of spices, and precious stones. Never again did such an abundance of spices come as those that the queen of Sheba gave to King Solomon.
translation:
  language: sw
  text: Naye akampa mfalme talanta mia moja na ishirini za dhahabu,[a] manukato mengi sana, na mawe ya thamani. Kamwe hayakuja tena manukato mengi kama yale ambayo malkia wa Sheba alimpa Mfalme Sulemani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talanta ilikuwa kipimo cha uzito cha kale.
    reason: ancient_measure
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Naye akampa
  rationale: Wayyiqtol inaendeleza simulizi; “Naye akampa” ni mtiririko wa kawaida wa masimulizi ya Kiswahili na inaonyesha mtendaji wa kike kwa muktadha.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: talanta mia moja na ishirini za dhahabu
  rationale: כִּכָּר ni kipimo cha uzito cha kale; “talanta” huhifadhi kipimo cha maandishi chanzo badala ya kukibadili kwa makadirio ya kisasa.
- source_word: וּבְשָׂמִים הַרְבֵּה מְאֹד
  choice: manukato mengi sana
  rationale: בְשָׂמִים hurejelea vitu vyenye harufu nzuri, hasa vikolezo au zeri; “manukato mengi sana” ni Kiswahili cha kawaida kinachohifadhi msisitizo wa הַרְבֵּה מְאֹד.
- source_word: וְאֶבֶן יְקָרָה
  choice: na mawe ya thamani
  rationale: Ingawa אֶבֶן ni umoja, hapa yaelekea imetumiwa kwa maana ya jumla; wingi wa Kiswahili unafaa katika orodha ya zawadi.
- source_word: לֹא בָא ... עוֹד
  choice: Tangu wakati huo, hayakuletwa tena
  rationale: Muundo huu unaonyesha kwamba kiasi kama hicho hakikuwasili tena baadaye. Kauli tendwa “hayakuletwa” ni ya asili katika Kiswahili kwa bidhaa zilizoingizwa au kufikishwa.
- source_word: כַבֹּשֶׂם הַהוּא ... לָרֹב
  choice: manukato mengi kama yale
  rationale: בֹּשֶׂם ni umoja wa kijumla, huku לָרֹב ikisisitiza wingi; tafsiri hii huunganisha vipengele hivyo kwa Kiswahili cha kawaida bila kupoteza ulinganisho.
- source_word: מַלְכַּת שְׁבָא
  choice: malkia wa Sheba
  rationale: Hii ndiyo namna ya kawaida na wazi ya kuonyesha cheo na mahali katika Kiswahili.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: Mfalme Sulemani
  rationale: Kiswahili huweka cheo kabla ya jina; herufi kubwa inaonyesha kwamba cheo kinatumiwa pamoja na jina maalumu.
