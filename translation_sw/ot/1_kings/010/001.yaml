  edition: WLC
  text: וּ/מַֽלְכַּת שְׁבָ֗א שֹׁמַ֛עַת אֶת שֵׁ֥מַע שְׁלֹמֹ֖ה לְ/שֵׁ֣ם יְהוָ֑ה וַ/תָּבֹ֥א לְ/נַסֹּת֖/וֹ בְּ/חִידֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/001.yaml
  text: The queen of Sheba heard of Solomon’s fame concerning the name of Yahweh[b][a], and she came to test him with riddles.
translation:
  language: sw
  text: Malkia wa Sheba alisikia kuhusu umaarufu wa Sulemani kuhusiana na jina la Yahwe[a], akaja kumjaribu kwa mafumbo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “habari kuhusu Sulemani kuhusiana na jina la Yahwe.” Kirai cha Kiebrania ni kifupi na kinaweza kumaanisha kwamba umaarufu wa Sulemani ulihusishwa na jina au sifa ya Yahwe.
    reason: lexical_alternative
  - marker: b
    text: Au, “maswali magumu.” Neno la Kiebrania linamaanisha kwa ukaribu zaidi mafumbo au vitendawili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַֽלְכַּת שְׁבָא
  choice: Malkia wa Sheba
  rationale: Muundo huu unatafsiri moja kwa moja hali ya kutegemeana ya ‘malkia wa Sheba.’ Kiunganishi וּ hakihitaji neno la ziada mwanzoni mwa simulizi katika Kiswahili, ambacho kinaweza kuendeleza kisa kwa mfuatano wa sentensi.
- source_word: שֹׁמַעַת
  choice: alisikia
  rationale: Ingawa ni umbo la kitenzi-jina tendaji katika Kiebrania, hapa linatoa usuli unaoanzisha safari yake; wakati uliopita ni wa kawaida na wazi katika masimulizi ya Kiswahili.
- source_word: אֶת שֵׁמַע שְׁלֹמֹה
  choice: habari za umaarufu wa Sulemani
  rationale: שֵׁמַע inaweza kumaanisha habari, taarifa, au umaarufu. Maneno haya yanaonyesha kwamba taarifa iliyomfikia ilihusu sifa zilizoenea za Sulemani bila kupunguza maana kuwa taarifa moja tu.
- source_word: לְ/שֵׁם יְהוָה
  choice: kuhusiana na jina la Yahwe
  rationale: Kirai hiki kifupi kinaweza kuonyesha uhusiano wa umaarufu wa Sulemani na jina au sifa ya Yahwe. ‘Kuhusiana na’ huhifadhi uhusiano huo bila kulazimisha maana ya sababu au kusudi.
- source_word: וַ/תָּבֹא
  choice: akaja
  rationale: Hili linaendeleza mfululizo wa simulizi kwa njia ya kawaida ya Kiswahili na kudumisha mhusika yuleyule.
- source_word: לְ/נַסֹּת/וֹ
  choice: kumjaribu
  rationale: נסה humaanisha kumjaribu au kumpima. ‘Kumjaribu’ ni sawia na haibainishi mapema kama lengo lilikuwa kupima hekima, maarifa, au jambo jingine.
- source_word: בְּ/חִידוֹת
  choice: kwa mafumbo
  rationale: חִידוֹת ni mafumbo, vitendawili, au semi zenye maana iliyofichika. ‘Mafumbo’ ni neno la asili na lenye hadhi katika Kiswahili na linafaa kwa maswali ya kupima hekima.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, si cheo. ‘Yahwe’ hulihifadhi kama jina na huepuka kulibadilisha kimyakimya kuwa cheo.
- issue: Uhusiano kati ya umaarufu wa Sulemani na jina la Yahwe
  choice: kuhusiana na jina la Yahwe
  alternative: kwa sababu ya jina la Yahwe
  rationale: Kihusishi לְ katika kirai hiki kina utata. Tafsiri iliyochaguliwa huhifadhi uhusiano unaotajwa bila kuamua kwamba jina la Yahwe ndilo lililosababisha umaarufu huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Maandiko. ‘Sheba’ na ‘Sulemani’ zinafuata majina yanayotambulika kwa urahisi; ‘Yahwe’ huhifadhi jina la Mungu. Alama zote za tanbihi zimewekwa mara moja katika sehemu zinazohusika.
