base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/028.yaml
  text: And the importation of the horses that belonged to Solomon was from Egypt and Kue[b][a]; the king’s merchants would obtain them from Kue at a price.
translation:
  language: sw
  text: Farasi wa Sulemani waliingizwa kutoka Misri na kutoka Kue[a]; wafanyabiashara wa mfalme waliwapata kutoka Kue kwa bei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Neno la Kiebrania hapa halina maana iliyo hakika. Huenda “Kue” ni jina la mahali, labda eneo la Kilikia. Au mstari huu unaweza kutafsiriwa: “na kutoka katika kundi la farasi; wafanyabiashara wa mfalme walipata kundi hilo kwa bei.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: waliingizwa
  rationale: Nomino hii inaweza kumaanisha kutoka, chanzo, au uingizaji katika biashara. Katika muktadha wa farasi wanaoletwa kwa Sulemani, kauli ya biashara “waliingizwa” inaonyesha mwelekeo bila kuipanua sana maana.
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: Farasi wa Sulemani
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kutaja farasi waliokuwa mali yake au walioingizwa kwa ajili yake, huku uhusiano halisi ukibaki wazi kutokana na muktadha.
- source_word: מִמִּצְרָיִם
  choice: kutoka Misri
  rationale: Tafsiri ya kawaida ya jina la mahali na kihusishi cha asili.
- source_word: וּמִקְוֵה / מִקְוֵה
  choice: na Kue / kutoka Kue
  rationale: Neno la Kiebrania lina utata. Kulichukua kama jina la mahali Kue kunafaa sambamba na Misri na hudumisha matumizi yake mawili katika mstari; maana mbadala ya kundi la farasi imehifadhiwa katika tanbihi.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: wafanyabiashara wa mfalme
  rationale: Ni Kiswahili cha kawaida kwa mawakala wa biashara waliokuwa katika huduma ya mfalme.
- source_word: יִקְחוּ
  choice: waliwapata
  rationale: Kitenzi kwa msingi humaanisha kuchukua, lakini katika muktadha huu wa biashara, “waliwapata” kinaonyesha upatikanaji bila kuongeza waziwazi kwamba walinunua, ingawa bei imetajwa.
- source_word: בִּמְחִיר
  choice: kwa bei fulani
  rationale: Huonyesha shughuli ya kibiashara; “fulani” huepuka kudokeza kwamba bei maalumu imetolewa katika mstari.
