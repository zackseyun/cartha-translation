  yaml_path: translation/ot/1_kings/015/002.yaml
  text: He reigned three years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: sw
  text: Alitawala miaka mitatu Yerusalemu, na jina la mama yake lilikuwa Maaka, binti ya Abishalomu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika baadhi ya miktadha ya nasaba, neno la Kiebrania linalotafsiriwa “binti” linaweza pia kumaanisha mzao wa kike wa vizazi vya baadaye.
    reason: alternative_reading
  - marker: b
    text: Abishalomu ni umbo la jina la Kiebrania lililotumiwa hapa; tafsiri nyingi hutumia “Absalomu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ שָׁנִים
  choice: miaka mitatu
  rationale: Muundo wa namba pamoja na nomino ya wingi unaonyesha muda wa utawala; huu ndio usemi wa kawaida wa Kiswahili.
- source_word: מָלַךְ
  choice: alitawala
  rationale: Kitenzi מלך hapa kinaeleza kutekeleza utawala wa kifalme, si kuanza kuwa mfalme.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kihusishi ב kinaonyesha mahali; “huko Yerusalemu” ni Kiswahili cha kawaida katika taarifa hii ya mahali pa utawala.
- source_word: וְשֵׁם אִמּוֹ
  choice: na jina la mama yake lilikuwa
  rationale: Huhifadhi muundo wa taarifa ya kifalme huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: מַעֲכָה
  choice: Maaka
  rationale: Jina limetoholewa kwa kufuata umbo la Kiebrania na tahajia inayoeleweka kwa wasomaji wa Kiswahili.
- source_word: בַּת
  choice: binti ya
  rationale: Maana ya moja kwa moja ni “binti”; uwezekano wa kumaanisha mzao wa kike kwa upana zaidi umewekwa katika tanbihi.
- source_word: אֲבִישָׁלוֹם
  choice: Abishalomu
  rationale: Hutohowa umbo la jina la Kiebrania lililo katika aya hii, badala ya kulibadilisha kuwa umbo jingine linalojulikana zaidi.
theological_decisions:
- issue: Usemi wa ukoo בַּת אֲבִישָׁלוֹם
  choice: Kudumisha “binti ya Abishalomu” katika matini kuu.
  alternative: mjukuu au mzao wa kike wa Abishalomu
  rationale: Kiebrania chenyewe kinasema “binti.” Kwa kuwa katika baadhi ya nasaba neno hilo linaweza kutumiwa kwa maana pana zaidi, utata huo haujatatuliwa kimya kimya bali umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Matini inatumia sentensi rahisi ya taarifa ya kifalme. Umbo la jina “Abishalomu” limehifadhiwa kwa kuwa ndilo linaloonekana katika Kiebrania cha aya hii; hakuna tanbihi ya tofauti ya Kiingereza “Absalom” kwa sababu hiyo si tofauti muhimu katika mazingira ya tafsiri ya Kiswahili.
