source:
  edition: WLC
  text: וְ/יֶ֣תֶר כָּל דִּבְרֵֽי אָ֠סָא וְ/כָל גְּב֨וּרָת֜/וֹ וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וְ/הֶֽ/עָרִים֙ אֲשֶׁ֣ר בָּנָ֔ה הֲ/לֹֽא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה רַ֚ק לְ/עֵ֣ת זִקְנָת֔/וֹ חָלָ֖ה אֶת רַגְלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/023.yaml
  text: The rest of all the acts of Asa[a], and all his might, and all that he did[b], and the cities that he built—are they not written in the Book of the Chronicles of the Kings of Judah? Yet in the time of his old age he became diseased in his feet.
translation:
  language: sw
  text: Matendo mengine yote ya Asa, ushujaa wake wote, yote aliyoyafanya, na miji aliyoijenga—je, mambo hayo hayakuandikwa katika Kitabu cha Kumbukumbu za Wafalme wa Yuda?[a] Lakini wakati wa uzee wake, aliugua miguu yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kitabu cha historia ya wafalme wa Yuda.”
    reason: Kichwa cha Kiebrania kinaweza kutafsiriwa kwa namna inayoeleza chanzo hiki kuwa kumbukumbu rasmi au historia ya wafalme.
  - marker: b
    text: Kiebrania kinataja kwamba miguu yake ndiyo iliyoathiriwa, lakini hakitaji ugonjwa mahususi.
    reason: Tanbihi inadumisha kutokubainishwa kwa aina ya ugonjwa katika matini ya chanzo.
lexical_decisions:
- source_word: וְיֶתֶר כָּל דִּבְרֵי אָסָא
  choice: Matendo mengine yote ya Asa
  rationale: Katika muhtasari wa utawala wa mfalme, דִּבְרֵי hurejelea matendo na mambo yaliyotokea, si maneno aliyosema tu. Kiswahili hiki ni cha kawaida na kinahifadhi maana ya mabaki ya habari za utawala wake.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: ushujaa wake wote
  rationale: גְּבוּרָה inaweza kumaanisha nguvu, uhodari, au matendo ya kishujaa. ‘Ushujaa wake wote’ inadumisha nomino ya jumla na kuitofautisha na kishazi kinachofuata kuhusu yote aliyoyafanya.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: yote aliyoyafanya
  rationale: Hiki ni kifungu cha asili na pana kinachofuata kwa karibu kishazi cha Kiebrania bila kubana aina ya matendo yanayokusudiwa.
- source_word: וְהֶעָרִים אֲשֶׁר בָּנָה
  choice: na miji aliyoijenga
  rationale: בָּנָה humaanisha ‘kujenga.’ Ingawa muktadha unaweza kuhusisha kuimarisha ngome, tafsiri haiongezi wazo hilo lisilotajwa wazi.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: je, mambo hayo hayakuandikwa
  rationale: Muundo wa swali la balagha umehifadhiwa. ‘Mambo hayo’ huonyesha wazi kiwakilishi cha wingi הֵמָּה na kurejelea orodha nzima iliyotangulia.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: katika Kitabu cha Kumbukumbu za Wafalme wa Yuda
  rationale: Hiki ni kichwa kinachoeleweka kwa chanzo rasmi cha kumbukumbu za kifalme. ‘Katika’ ni Kiswahili cha kawaida kwa mambo yaliyoandikwa kitabuni.
- source_word: רַק
  choice: Lakini
  rationale: רַק hapa huanzisha jambo la pekee au la kutofautisha. ‘Lakini’ huwasilisha tofauti hiyo kwa Kiswahili cha kawaida bila kuifanya kuwa kali kuliko ilivyo.
- source_word: לְעֵת זִקְנָתוֹ
  choice: wakati wa uzee wake
  rationale: Tafsiri hii inadumisha kirai cha wakati na kipindi cha maisha kinachotajwa katika Kiebrania.
- source_word: חָלָה אֶת רַגְלָיו
  choice: aliugua miguu
  rationale: Kiebrania kinataja ugonjwa na sehemu ya mwili iliyoathiriwa lakini hakitaji ugonjwa mahususi. Kiswahili hiki ni kifupi, cha asili, na hakiongezi utambuzi wa kitabibu.
