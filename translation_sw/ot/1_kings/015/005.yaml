  text: אֲשֶׁ֨ר עָשָׂ֥ה דָוִ֛ד אֶת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹֽא סָ֞ר מִ/כֹּ֣ל אֲשֶׁר צִוָּ֗/הוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו רַ֕ק בִּ/דְבַ֖ר אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/005.yaml
  text: because David had done what was right in the eyes of Yahweh and had not turned aside from anything that he had commanded him all the days of his life[a], except in the matter of Uriah the Hittite.
translation:
  language: sw
  text: kwa sababu Daudi alifanya yaliyokuwa sawa machoni pa Yahwe, wala hakukengeuka kutoka katika jambo lolote alilomwamuru siku zote za maisha yake, isipokuwa katika suala la Uria Mhiti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kisa cha Uria Mhiti.”
    reason: Mbadala wa kileksika kwa בִּדְבַר, ambacho kinaweza kumaanisha ‘katika suala la’ au ‘katika kisa cha.’
lexical_decisions:
- source_word: אֲשֶׁר
  choice: kwa sababu
  rationale: Katika muktadha, kiwakilishi hiki kinaonyesha sababu ya kauli iliyotangulia; tafsiri ya kisababishi iko wazi na ni ya kawaida katika Kiswahili.
- source_word: עָשָׂה ... אֶת הַיָּשָׁר
  choice: alifanya yaliyokuwa sawa
  rationale: Hii inawasilisha nahau ya kufanya lililo sawa kimaadili kwa Kiswahili cha kawaida bila kuongeza ufafanuzi.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Inahifadhi sitiari ya Kiebrania ya tathmini huku ikieleweka kwa urahisi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa umbo la kawaida la Kiswahili linalowakilisha tetragramatoni.
- source_word: וְלֹא סָר
  choice: wala hakukengeuka
  rationale: Kitenzi kinaeleza kutopotoka kutoka katika utii ulioamriwa; ‘hakukengeuka’ huhifadhi picha hiyo.
- source_word: מִכֹּל אֲשֶׁר צִוָּהוּ
  choice: kutoka katika jambo lolote alilomwamuru
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unadumisha wazo la kutotoka katika chochote alichoamriwa.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: siku zote za maisha yake
  rationale: Tafsiri hii iko karibu na usemi wa Kiebrania na inaeleweka kiasili katika Kiswahili.
- source_word: רַק
  choice: isipokuwa
  rationale: Hapa neno hili linaanzisha jambo pekee lililotengwa katika sifa iliyotangulia.
- source_word: בִּדְבַר אוּרִיָּה
  choice: katika suala la Uria
  rationale: ‘Suala’ linaonyesha jambo au tukio linalomhusu Uria bila kulifafanua zaidi ya maandishi.
- source_word: אוּרִיָּה הַחִתִּי
  choice: Uria Mhiti
  rationale: Jina limetoholewa kwa Kiswahili na jina la kabila limetafsiriwa kwa umbo la kawaida.
theological_decisions:
- issue: Tathmini pana ya utii wa Daudi licha ya dhambi zake zinazojulikana
  choice: Kudumisha sifa pana ya maandishi pamoja na jambo lake moja lililotajwa kuwa tofauti.
  alternative: Kufafanua kwamba Daudi alikuwa mwaminifu kwa ujumla au kuongeza habari kuhusu toba yake.
  rationale: Aya yenyewe inaweka sifa hiyo na tofauti hiyo pamoja. Tafsiri haipaswi kuondoa mvutano huo kwa kuingiza maelezo ya kiteolojia yasiyotajwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo na sitiari kuu za Kiebrania zimehifadhiwa pale zinapobaki za kawaida katika Kiswahili.
