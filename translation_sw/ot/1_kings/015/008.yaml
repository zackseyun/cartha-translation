translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Sitiari ya Kiebrania kuhusu kifo imehifadhiwa na kufafanuliwa kwa tanbihi. Alama ya tanbihi [b] imewekwa moja kwa moja baada ya jina Abiyamu ili ihusiane wazi na jina hilo.
