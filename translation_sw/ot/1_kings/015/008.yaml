base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/008.yaml
  text: And Abijam lay down with his fathers[a], and they buried him in the city of David[b]. Then Asa his son became king in his place.
translation:
  language: sw
  text: Abiyamu[b] akalala pamoja na mababu zake[a], wakamzika katika Mji wa Daudi. Kisha Asa mwanawe akawa mfalme mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “akalala pamoja na mababu zake” ni msemo wa kawaida unaomaanisha kwamba mtu alikufa.
    reason: cultural_note
  - marker: b
    text: Katika baadhi ya vifungu vinavyofanana au kuhusiana, Abiyamu anaitwa Abiya; hapa maandishi ya Kiebrania yanasema “Abiyamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Neno hili ni sehemu ya nahau ya kawaida ya Kiebrania inayosema mtu alikufa. “Akalala” inadumisha sitiari ya chanzo, huku tanbihi ikizuia isieleweke kama usingizi wa kawaida.
- source_word: אֲבִיָּם
  choice: Abiyamu
  rationale: Hili linawakilisha kwa herufi za Kiswahili umbo la jina אֲבִיָּם lililo katika mstari huu, badala ya kulibadilisha kuwa Abiya kama katika baadhi ya vifungu vinavyohusiana.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na mababu zake
  rationale: Katika nahau hii, אֲבוֹת humaanisha watangulizi wa ukoo. “Mababu zake” ni Kiswahili cha sasa na cha kawaida zaidi kuliko “baba zake,” na kinadumisha maana ya kifamilia na ya nasaba.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: nao wakamzika
  rationale: Kitenzi cha Kiebrania ni cha kutenda na cha wingi. “Nao wakamzika” kinadumisha muundo huo bila kuwataja watu ambao chanzo hakiwatambulishi.
- source_word: בְּעִיר דָּוִד
  choice: katika Mji wa Daudi
  rationale: Hili ni jina la mahali linalotambulika katika Biblia; herufi kubwa katika “Mji” inaonyesha matumizi yake kama jina maalumu.
- source_word: וַיִּמְלֹךְ
  choice: akawa mfalme
  rationale: Katika taarifa hii ya urithi wa kiti cha enzi, kitenzi kinaonyesha kuanza kutawala. “Akawa mfalme” huwasilisha maana hiyo kwa uwazi.
- source_word: אָסָא בְנוֹ
  choice: Asa mwanawe
  rationale: Mpangilio huu unafuata chanzo kwa karibu na bado ni wa kawaida katika Kiswahili.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika kauli ya urithi wa kifalme, maneno haya yanaonyesha kwamba Asa alichukua nafasi ya Abiyamu katika cheo cha mfalme.
