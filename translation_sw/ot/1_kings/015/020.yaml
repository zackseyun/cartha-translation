base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/020.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of the armies that were his against the cities of Israel[a], and he struck Ijon, Dan, Abel-beth-maacah, and all Chinneroth[b], against all the land of Naphtali.
translation:
  language: sw
  text: Basi Ben-hadadi akamsikiliza Mfalme Asa[a], akawatuma makamanda wa majeshi yake dhidi ya miji ya Israeli. Ben-hadadi akashambulia Iyoni, Dani, Abel-beth-maaka, na Kinerothi yote[b], na nchi yote ya Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaitikia ombi la Mfalme Asa.” Nahau ya Kiebrania inaweza kumaanisha kusikiliza kwa nia nzuri na kutenda kulingana na ombi hilo.
    reason: lexical_alternative
  - marker: b
    text: Kinerothi ni jina la mahali hapa, huenda likimaanisha eneo au wilaya, wala si nomino ya kawaida inayomaanisha “vinubi.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: akamsikiliza
  rationale: Nahau hii ina maana ya kumsikiliza mtu kwa kukubali ombi lake na kulitendea kazi. “Akamsikiliza” ni ya kawaida katika Kiswahili na haidokezi kwamba Asa alikuwa na mamlaka ya kumwamuru Ben-hadadi.
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: makamanda wa majeshi yake
  rationale: Tafsiri hii ya kawaida na yenye heshima huonyesha wazi viongozi wa vikosi vya kijeshi vilivyokuwa chini ya Ben-hadadi.
- source_word: עַל עָרֵי יִשְׂרָאֵל
  choice: dhidi ya miji ya Israeli
  rationale: Katika muktadha wa kijeshi, kihusishi עַל pamoja na kutuma makamanda huonyesha miji iliyolengwa kwa uhasama.
- source_word: וַיַּךְ
  choice: akashambulia
  rationale: Kitenzi נכה kinaweza kumaanisha kupiga, kushambulia, au kushinda. Katika orodha ya miji iliyolengwa na jeshi, “akashambulia” ni ya asili na haidai kwamba kila mahali palishindwa kabisa.
- source_word: עִיּוֹן
  choice: Iyoni
  rationale: Unukuzi unaofaa kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: Abel-beth-maaka
  rationale: Jina ambatani la mahali limehifadhiwa kwa unukuzi unaosomeka kwa Kiswahili.
- source_word: כָּל כִּנְרוֹת
  choice: eneo lote la Kinerothi
  rationale: Hapa Kinerothi ni jina la mahali, na matumizi ya כָּל yanaonyesha kwa uwezekano mkubwa eneo au wilaya nzima, si nomino ya kawaida inayomaanisha vinubi.
- source_word: עַל כָּל אֶרֶץ נַפְתָּלִי
  choice: pamoja na nchi yote ya Naftali
  rationale: Kishazi hiki kinapanua orodha hadi eneo kubwa la Naftali. “Pamoja na” huleta vizuri maana ya nyongeza katika Kiswahili bila kurudia kwa namna isiyo ya kawaida wazo la shambulio.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kwa tahajia inayosomeka kwa Kiswahili, huku muundo wa jina Abel-beth-maaka ukihifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
