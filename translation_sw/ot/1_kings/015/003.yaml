base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/003.yaml
  text: He walked in all the sins of his father that he had committed before him[a], and his heart was not wholly devoted to Yahweh his God[c][b], like the heart of David his father.
translation:
  language: sw
  text: Akaenenda katika dhambi zote za baba yake, alizofanya kabla yake[a]. Moyo wake haukuwa umejitoa kikamilifu kwa Yahwe Mungu wake[b], kama moyo wa Daudi baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno ya Kiebrania yanayotafsiriwa “kabla yake” yanaweza kumaanisha “mbele yake” au “kabla ya wakati wake”; huenda yakadokeza pia kwamba dhambi za baba yake zilikuwa mfano alioufuata.
    reason: lexical_alternative
  - marker: b
    text: Au “moyo wake haukuwa mwaminifu kikamilifu kwa Yahwe Mungu wake.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל חַטֹּאות
  choice: Akaenenda katika dhambi zote
  rationale: Neno הלך pamoja na בְּ linaeleza mwenendo wa maisha. “Akaenenda katika” linahifadhi taswira ya Kiebrania na maana yake ya kimaadili kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: אָבִיו
  choice: baba yake
  rationale: Ni rejeo la moja kwa moja kwa baba yake na mtangulizi wake; hakuna sababu ya kulipanua.
- source_word: אֲשֶׁר עָשָׂה לְפָנָיו
  choice: alizokuwa amefanya kabla yake
  rationale: Kishazi hiki kinaeleza dhambi za baba. “Kabla yake” huhifadhi uwezekano wa kutaja yaliyotangulia wakati wake au yaliyokuwa mbele yake kama mfano, bila kulazimisha maana moja.
- source_word: לְבָבוֹ
  choice: moyo wake
  rationale: לֵבָב humaanisha utu wa ndani, kutia ndani nia na uaminifu. “Moyo” ni neno la kawaida na pana la Kiswahili katika muktadha huu.
- source_word: שָׁלֵם עִם יְהוָה אֱלֹהָיו
  choice: haukuwa umejitoa kikamilifu kwa Yahwe Mungu wake
  rationale: שָׁלֵם hapa hueleza moyo mzima na uaminifu usiogawanyika kwa Mungu, si ukamilifu usio na dhambi. “Umejitoa kikamilifu kwa” ni Kiswahili cha asili kinachowasilisha uhusiano huo wa agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo, hivyo kuhifadhi jina la kibinafsi katika chanzo.
- source_word: כִּלְבַב דָּוִד אָבִיו
  choice: kama moyo wa Daudi baba yake
  rationale: Ulinganisho unahusu hasa moyo wa Abiyamu na moyo wa Daudi; muundo huu huhifadhi mkazo huo wa Kiebrania.
theological_decisions:
- issue: Maana ya moyo kutokuwa שָׁלֵם pamoja na Yahwe
  choice: Moyo wake haukuwa umejitoa kikamilifu kwa Yahwe
  alternative: Moyo wake haukuwa mwaminifu kabisa kwa Yahwe
  rationale: Chaguo kuu linaeleza uaminifu wa moyo mzima katika uhusiano na Mungu bila kudai kwamba Daudi hakuwa na dhambi kabisa. Chaguo la “mwaminifu kabisa” pia linawezekana, lakini “umejitoa kikamilifu” linaonyesha vizuri mwelekeo wa moyo kwa Mungu.
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia “Yahwe” huhifadhi jina la Mungu lililo katika maandishi ya Kiebrania; “BWANA” ni uwasilishaji wa kimapokeo lakini hubadilisha jina kwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Akaenenda” huhifadhi sitiari ya mwenendo wa maisha, huku “umejitoa kikamilifu” ikiepuka wazo la ukamilifu usio na dhambi.
