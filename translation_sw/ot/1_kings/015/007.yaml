base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/007.yaml
  text: The rest of the acts of Abijam[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah? And there was war between Abijam and Jeroboam.
translation:
  language: sw
  text: Matendo mengine ya Abiamu[a], na yote aliyofanya, je, hayakuandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda?[b] Kulikuwa na vita kati ya Abiamu na Yeroboamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika baadhi ya vifungu vinavyofanana au vinavyohusiana, Abiamu anaitwa Abiya; maandishi ya Kiebrania hapa yana jina Abiamu.
    reason: alternative_reading
  - marker: b
    text: Au, “Kitabu cha Kumbukumbu za Wafalme wa Yuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי אֲבִיָּם
  choice: Matendo mengine ya Abiamu
  rationale: Katika ka formula ya muhtasari wa kifalme, דִּבְרֵי humaanisha kwa upana matendo au mambo yanayomhusu mfalme; “matendo mengine” ni Kiswahili cha asili kinachoonyesha habari iliyobaki bila kuifanya kuwa maneno aliyosema.
- source_word: אֲבִיָּם
  choice: Abiamu
  rationale: Jina limehamishwa kutoka umbo la Kiebrania lililo katika aya hii, bila kulisawazisha na umbo Abiya linalopatikana katika vifungu vingine.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: pamoja na yote aliyofanya
  rationale: Huhifadhi upana wa kitenzi עשה na kuunganisha kirai kwa Kiswahili cha kawaida.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: Huhifadhi swali la balagha la Kiebrania badala ya kuligeuza kuwa taarifa ya uhakika.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: katika Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda
  rationale: “Katika” ni matumizi ya kawaida kwa kurejelea maandishi yaliyomo kitabuni; jina la kumbukumbu linatafsiri maana ya kichwa cha kihistoria huku likihifadhi uhusiano wake na wafalme wa Yuda.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: Kulikuwa na vita
  rationale: Ni tafsiri ya moja kwa moja ya kishazi cha uwepo, bila kuongeza wazo la kuendelea ambalo halijasemwa wazi.
- source_word: בֵּין אֲבִיָּם וּבֵין יָרָבְעָם
  choice: kati ya Abiamu na Yeroboamu
  rationale: Hutoa kwa kawaida muundo wa Kiebrania unaoonyesha pande mbili zinazopingana.
