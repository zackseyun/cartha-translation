translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha limehifadhiwa. Kiunganishi cha mwanzo וְ hakijapanuliwa kuwa neno la wakati kama “Sasa.” Alama [b] imewekwa baada ya jina la kitabu, ambako mbadala wake wa kileksika unahusika moja kwa moja.
