  yaml_path: translation/ot/1_kings/015/015.yaml
  text: And he brought into the house of Yahweh the holy things of his father and his own holy things[a], silver and gold and vessels.
translation:
  language: sw
  text: Naye akaleta ndani ya nyumba ya Yahweh vitu vitakatifu vya baba yake na vile vyake mwenyewe, fedha, dhahabu, na vyombo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitu ambavyo baba yake alikuwa ameviweka wakfu na vile ambavyo yeye mwenyewe alikuwa ameviweka wakfu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: akavileta ndani
  rationale: Hifili ya בוא humaanisha ‘kuleta’ au ‘kuingiza’; kiambishi ‘-vi-’ kinarejelea vitu vilivyowekwa wakfu, na ‘ndani’ inaonyesha wazi mwelekeo wa בֵּית.
- source_word: קָדְשֵׁי אָבִיו
  choice: vitu vitakatifu vya baba yake
  rationale: Wingi huu wa muundo wa utegemezi unamaanisha vitu vilivyotengwa kuwa vitakatifu au vilivyowekwa wakfu, wala si utakatifu wa kinadharia.
- source_word: וְקָדְשׁוֹ
  choice: na vitu vyake mwenyewe vitakatifu
  rationale: Nomino ya umoja yenye kiambishi cha nafsi ya tatu ya kiume inatumika kwa maana ya mkusanyiko; tafsiri hii inadumisha ulinganifu na vitu vya baba yake bila kubainisha zaidi aina ya matoleo.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: ‘Nyumba’ inadumisha tamathali ya Kiebrania kwa mahali patakatifu, huku jina la agano יְהוָה likitolewa kama Yahweh.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: fedha, dhahabu na vyombo
  rationale: Orodha hii inaeleza vitu vilivyowekwa wakfu. ‘Vyombo’ ni neno pana na la kawaida kwa כלים katika muktadha wa nyumba takatifu.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina la pekee la Mungu, Tetragramatoni; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya vitu vya קֹדֶשׁ
  choice: vitu vitakatifu
  alternative: vitu vilivyowekwa wakfu
  rationale: ‘Vitu vitakatifu’ inadumisha lugha ya kiibada na ulinganifu wa Kiebrania, huku tanbihi ikitoa maana ya tendo la kuviweka wakfu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa orodha umetolewa kwa koma kwa sababu fedha, dhahabu na vyombo vinafafanua vitu vilivyotajwa.
