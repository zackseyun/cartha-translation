base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/019.yaml
  text: There is a covenant between me and you, between my father and your father. Look, I have sent you a bribe of silver and gold. Go, break your covenant with Baasha king of Israel, so that he may withdraw from me.
translation:
  language: sw
  text: “Kuna agano kati yangu na wewe, kati ya baba yangu na baba yako. Tazama, nimekutumia hongo ya fedha na dhahabu. Nenda ukavunje agano lako na Baasha, mfalme wa Israeli, ili aondoke kwangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרִית
  choice: agano
  rationale: Neno hili linamaanisha mapatano rasmi yenye wajibu kati ya pande mbili; ‘agano’ ndilo neno la kawaida na lenye uzito unaofaa katika muktadha huu.
- source_word: שֹׁחַד
  choice: hongo
  rationale: Kwa kawaida neno hili humaanisha malipo yanayotolewa ili kumshawishi mtu atende kwa upendeleo. Hapa fedha na dhahabu zinakusudiwa kumshawishi Ben-hadadi avunje agano lake, hivyo ‘hongo’ huhifadhi nguvu ya neno la Kiebrania kuliko ‘zawadi’.
- source_word: הָפֵרָה
  choice: ukavunje
  rationale: Kitenzi hiki katika umbo la amri humaanisha kubatilisha au kuvunja agano; ‘ukavunje’ ni cha asili na wazi katika Kiswahili.
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: ili aondoke kwangu
  rationale: Kauli ya Kiebrania ina maana ya Baasha kujiondoa kutoka juu ya Asa, yaani kuacha kumsonga au kumshambulia. Tafsiri hii huhifadhi picha ya kuondoka bila kuongeza maelezo yasiyotajwa wazi.
theological_decisions:
- issue: Maadili ya malipo ya fedha na dhahabu
  choice: hongo
  alternative: zawadi
  rationale: Tafsiri haifichi tathmini hasi inayodokezwa na שֹׁחַד, wala haiongezi hukumu ya kitheolojia zaidi ya neno lenyewe.
- issue: Uhusiano wa maagano hayo mawili
  choice: “Kuna agano kati yangu na wewe, kama lilivyokuwa kati ya baba yangu na baba yako”
  alternative: “Kuna agano kati yangu na wewe, kati ya baba yangu na baba yako”
  rationale: Kiebrania kinarudia ‘kati ya’ bila kiunganishi kinachoeleza uhusiano kwa uwazi. ‘Kama lilivyokuwa’ hutoa Kiswahili cha kawaida na kueleza mfululizo wa agano la sasa na lile la baba zao, lakini hakibadili dai la msingi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha hadhi na kinachoeleweka kwa urahisi. Amri zimewasilishwa kwa mtiririko wa kawaida wa Kiswahili, na majina ya kifalme yamehifadhiwa kwa uwazi.
