base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/012.yaml
  text: He removed the male cult prostitutes from the land[d][c][b][a], and he took away all the idols that his fathers had made.
translation:
  language: sw
  text: Aliwaondoa katika nchi wale wanaume waliokuwa wamehusishwa na desturi za kingono za kiibada[a][b], akaondoa sanamu zote za kuchukiza[c] ambazo baba zake walikuwa wamezitengeneza.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliwafukuza.” Kitenzi cha Kiebrania kinaweza kumaanisha kusababisha mtu aondoke mahali fulani.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linawahusu wanaume waliohusishwa na desturi haramu za kiibada, zenye uhusiano wa kingono; namna kamili ya jukumu lao haijulikani kwa uhakika.
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania la “sanamu” ni la dharau sana; linaweza kutafsiriwa “sanamu za kuchukiza,” na huenda likawa na maana ya kejeli kama “sanamu za kinyesi.”
    reason: lexical_alternative
  - marker: d
    text: “Baba zake” hapa yaweza kumaanisha mababu zake au watu wa vizazi vilivyomtangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: Aliwaondoa
  rationale: Hifili ya עבר hapa ina maana ya kusababisha watu waondoke au kutoweka mahali fulani. “Aliwaondoa” ni Kiswahili cha kawaida na huhifadhi maana bila kubainisha kama walifukuzwa kwa nguvu.
- source_word: הַקְּדֵשִׁים
  choice: wale wanaume waliokuwa makahaba wa ibada
  rationale: Katika muktadha huu neno hilo linawahusu wanaume waliohusishwa na ukahaba wa kidini katika ibada isiyoruhusiwa, si “watakatifu.” Tafsiri hii inaonyesha jinsia na mazingira ya ibada bila kutumia istilahi ya mapokeo yenye maana pana au potovu.
- source_word: מִן הָאָרֶץ
  choice: nchini
  rationale: “Nchini” ni usemi wa asili wa Kiswahili unaoonyesha kuondolewa katika eneo la ufalme, yaani nchi ya Yuda, huku ukilingana na maana ya הָאָרֶץ katika muktadha.
- source_word: וַיָּסַר
  choice: akaondoa
  rationale: Hifili ya סור humaanisha kuondoa au kutenga. “Akaondoa” ni wazi na ya kawaida; kurudiwa kwa kitenzi katika Kiswahili hakufichi tofauti yoyote muhimu ya maana.
- source_word: כָּל הַגִּלֻּלִים
  choice: sanamu zote za kuchukiza
  rationale: גִּלּוּלִים ni jina la dharau kwa sanamu. “Sanamu za kuchukiza” huhifadhi kwa kiasi sauti hiyo kali bila kutumia tafsiri ya moja kwa moja isiyo ya kawaida kama “sanamu za kinyesi.”
- source_word: אֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: ambazo baba zake walikuwa wamezitengeneza
  rationale: “Baba zake” huhifadhi umbo la kiume la Kiebrania na linaweza kurejelea waliomtangulia katika vizazi vya awali. “Walikuwa wamezitengeneza” huonyesha kwamba tendo hilo lilitangulia mageuzi ya Asa.
theological_decisions:
- issue: Maana ya אֲבֹתָיו
  choice: baba zake
  alternative: mababu zake / waliomtangulia
  rationale: Umbo la Kiebrania ni la kiume na linaashiria baba au watangulizi wa kiume. “Baba zake” hulihifadhi bila kulifanya kuwa neno lisiloonyesha jinsia, huku tanbihi ikifafanua matumizi ya kiidioma.
- issue: Utambulisho wa הַקְּדֵשִׁים
  choice: wanaume waliokuwa makahaba wa ibada
  alternative: wanaume waliohusishwa na vitendo vya kingono vya kiibada
  rationale: Muktadha unaonyesha jukumu la kiume lililohusishwa na ibada haramu na ngono, lakini maelezo kamili ya taasisi hiyo hayana uhakika. Tafsiri kuu inafuata maana inayokubalika kwa kawaida, huku tanbihi ikihifadhi tahadhari hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi umetumia “Aliwaondoa … akaondoa” ili kuonyesha mfuatano wa vitendo. Alama zote za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
