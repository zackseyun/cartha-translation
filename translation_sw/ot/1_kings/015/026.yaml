base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/026.yaml
  text: He did what was evil in the sight of Yahweh and walked in the way of his father and in his sin with which he caused Israel to sin.
translation:
  language: sw
  text: Alifanya mabaya machoni pa Yahwe, akaenenda katika njia ya baba yake na katika dhambi ya baba yake, ambayo kwa hiyo aliwafanya Israeli watende dhambi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Alifanya yaliyo maovu
  rationale: Muundo huu unaonyesha tathmini ya kawaida ya wafalme katika kitabu cha Wafalme; tafsiri hii ni ya asili katika Kiswahili na inadumisha maana ya kutenda lililo ovu.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Inadumisha sitiari ya Kiebrania ya kutathmini jambo 'machoni' pa Mungu huku ikieleweka vizuri katika Kiswahili.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ אָבִיו
  choice: akaenenda katika njia ya baba yake
  rationale: Neno 'akaenenda' linahifadhi sitiari ya mwenendo wa kimaadili, na 'njia ya baba yake' linafuata kwa karibu muundo wa chanzo.
- source_word: וּבְחַטָּאתוֹ
  choice: na katika dhambi yake
  rationale: Inahifadhi nomino ya umoja na kiambishi cha umilikaji bila kufafanua kimakusudi ikiwa kinamrejelea mhusika mkuu au baba yake.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ambayo kwayo aliisababisha Israeli itende dhambi
  rationale: Kitenzi cha Kiebrania kiko katika muundo wa kisababishi; 'aliisababisha ... itende dhambi' kinaonyesha maana hiyo moja kwa moja. 'Kwayo' linaunganisha kishazi na dhambi iliyotajwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kina jina maalumu la Mungu, YHWH. 'Yahwe' linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Mrejelewa wa kiambishi katika וּבְחַטָּאתוֹ
  choice: dhambi yake
  alternative: dhambi ya baba yake
  rationale: Kiebrania kina kiambishi cha nafsi ya tatu ya kiume ambacho kinaweza kueleweka kwa kuhusishwa na mhusika au baba yake katika muktadha. Tafsiri haiongezi ufafanuzi usiokuwamo wazi katika kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa sasa. 'Akaenenda' limetumiwa ili kuhifadhi sitiari ya mwenendo; muundo wa sentensi unabaki karibu na Kiebrania bila kuwa mgumu kupita kiasi.
