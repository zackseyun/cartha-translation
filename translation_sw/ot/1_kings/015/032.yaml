lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: Kulikuwa na vita
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha hali ya kuwapo kwa vita na kudumisha kiunganishi cha simulizi bila kuongeza wazo la kuendelea ambalo kitenzi chenyewe halisemi wazi.
- source_word: בֵּין ... וּ/בֵין
  choice: kati ya ... na
  rationale: Huu ndio muundo wa kawaida wa Kiswahili unaowakilisha vihusishi vya Kiebrania vinavyohusiana.
- source_word: אָסָא
  choice: Asa
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: בַּעְשָׁא
  choice: Baasha
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Kirai hiki kinamtambulisha Baasha kwa cheo chake; koma zinaonyesha kuwa ni maelezo ya jina.
- source_word: כָּל יְמֵי/הֶם
  choice: siku zao zote
  rationale: Tafsiri hii inadumisha nahau pana ya Kiebrania bila kuiwekea kimya maana maalumu zaidi ya ‘maisha yao yote.’
