base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/001.yaml
  text: In the eighteenth year of King Jeroboam son of Nebat[a], Abijam became king over Judah.
translation:
  language: sw
  text: Katika mwaka wa kumi na minane wa Mfalme Yeroboamu mwana wa Nebati, Abiyamu[a] akawa mfalme wa Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hapa kina “Abiyamu”; mfalme huyu anaitwa “Abiya” katika vifungu vingine.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת
  choice: Katika mwaka wa
  rationale: Hii ni fomula ya kawaida ya Kiebrania ya kutaja wakati. Kiswahili cha kawaida hakihitaji kutafsiri kiunganishi cha וּ kando hapa.
- source_word: שְׁמֹנֶה עֶשְׂרֵה
  choice: kumi na minane
  rationale: Katika muundo huu, Kiswahili hutumia hesabu hii baada ya neno “mwaka” kueleza mwaka wa kumi na nane wa utawala.
- source_word: לַ/מֶּלֶךְ
  choice: wa Mfalme
  rationale: Katika taarifa hii ya tarehe, kifungu hiki kinaonyesha mwaka wa utawala wa mfalme aliyetajwa.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Majina yameandikwa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili, na patronimu ya Kiebrania imehifadhiwa moja kwa moja.
- source_word: מָלַךְ
  choice: akawa mfalme
  rationale: Katika taarifa za kutawazwa, kitenzi hiki huonyesha kuingia katika ufalme, si kipindi chote cha kutawala.
- source_word: אֲבִיָּם
  choice: Abiyamu
  rationale: Maandishi ya Kimasora katika mstari huu yana umbo אֲבִיָּם; umbo hilo limehifadhiwa badala ya kulibadilisha kimya kimya kuwa Abiya.
- source_word: עַל יְהוּדָה
  choice: wa Yuda
  rationale: Ingawa עַל kwa msingi ni “juu ya,” katika Kiswahili “mfalme wa Yuda” ni njia ya kawaida na wazi ya kueleza mamlaka yake juu ya Yuda.
