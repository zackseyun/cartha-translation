  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wazi, na wa kawaida. Fomula ya tarehe na taarifa ya kuingia katika ufalme zimewasilishwa kwa lugha ya asili bila kupoteza upekee wa jina katika maandishi ya Kiebrania.
