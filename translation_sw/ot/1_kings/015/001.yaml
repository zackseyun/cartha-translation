  source_fidelity: Tafsiri inahifadhi kwa usahihi taarifa ya tarehe ya utawala, patronimu ya Yeroboamu, tendo la Abiyamu kuingia katika ufalme, na eneo la utawala wake. “Akawa mfalme” huwasilisha vizuri מָלַךְ katika taarifa ya kutawazwa, na “wa Yuda” ni uundaji wa kawaida wa Kiswahili kwa עַל יְהוּדָה katika muktadha huu.
