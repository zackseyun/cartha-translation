base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/004.yaml
  text: Nevertheless[a], for David’s sake Yahweh his God gave him a lamp in Jerusalem, to raise up his son after him and to establish Jerusalem.
translation:
  language: sw
  text: Hata hivyo[a], kwa ajili ya Daudi, Yahwe Mungu wake alimpa taa katika Yerusalemu, ili amwinue mwanawe kumrithi, na kuithibitisha Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanga”; msemo “alimpa taa katika Yerusalemu” ni sitiari ya kudumishwa kwa nasaba ya kifalme ya Daudi huko.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Hata hivyo
  rationale: Katika muktadha, kishazi hiki kinaeleza kwa namna ya ukinzani kwa nini Abiyamu hakuondolewa kabisa licha ya dhambi yake; kiunganishi hiki kinawasilisha nguvu hiyo ya concessive-adversative kwa Kiswahili cha kawaida.
- source_word: לְמַעַן דָּוִד
  choice: kwa ajili ya Daudi
  rationale: Kirai hiki huonyesha kwamba tendo lilifanywa kwa sababu ya Daudi au kwa kumjali; tafsiri hii ni ya kawaida na yenye heshima.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa na cheo.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Muundo wa umilikaji umehifadhiwa bila kufafanua kupita kiasi rejeo la kiwakilishi.
- source_word: נִיר
  choice: taa
  rationale: Neno hilo humaanisha taa au mwanga na hapa ni sitiari ya kuendelea kwa ukoo wa kifalme wa Daudi; picha halisi ya sitiari imehifadhiwa katika maandishi.
- source_word: בִּירוּשָׁלָם
  choice: Yerusalemu
  rationale: Mahali hapa huonyeshwa kwa Kiswahili kiasili bila kulazimisha kihusishi; maana ni kwamba taa hiyo iliendelezwa katika mji huo.
- source_word: לְהָקִים
  choice: kumwinua
  rationale: Hifili ya קום hapa humaanisha kumfanya mrithi ainuke; 'kumwinua' huhifadhi taswira ya Kiebrania na kueleza urithi wa kifalme.
- source_word: אֶת בְּנוֹ אַחֲרָיו
  choice: mwanawe baada yake
  rationale: Kirai hiki kinaonyesha mfuatano wa urithi huku kikibaki karibu na muundo wa Kiebrania.
- source_word: וּלְהַעֲמִיד
  choice: kuimarisha
  rationale: Hifili ya עמד inaweza kumaanisha kusimamisha, kudumisha, au kufanya kitu kiendelee kusimama; hapa 'kuimarisha' ni ya asili na inaonyesha kudumishwa kwa Yerusalemu kama kitovu cha ufalme.
- source_word: אֶת יְרוּשָׁלָם
  choice: Yerusalemu
  rationale: Jina la mji limehifadhiwa kama lilivyo katika chanzo, bila kulibadilisha moja kwa moja kuwa 'ufalme' au 'nasaba.'
theological_decisions:
- issue: Maana ya kisitiari ya נִיר kuhusiana na agano la Daudi
  choice: Kuhifadhi sitiari “taa” katika maandishi makuu
  alternative: ukoo wa kifalme; nasaba; mwanga
  rationale: Hii huhifadhi taswira ya Kiebrania na mwangwi wake katika vifungu vingine kuhusu ukoo wa Daudi bila kuifafanua kupita kiasi.
- issue: Rejeo la “Mungu wake”
  choice: Kuhifadhi kiwakilishi kama kilivyo, kikielekea kwa mfalme anayezungumziwa katika muktadha
  alternative: Kulihusisha waziwazi na Daudi
  rationale: Muundo wa Kiebrania unasema tu 'Mungu wake'; tafsiri haipaswi kuondoa uwezekano wa mjadala kwa kuongeza jina lisilokuwamo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umefanywa kuwa wa kawaida kwa wasomaji wa leo huku sitiari ya 'taa,' kiwakilishi chenye uwezekano wa mjadala, na mahusiano ya vishazi vya kusudi yakihifadhiwa.
