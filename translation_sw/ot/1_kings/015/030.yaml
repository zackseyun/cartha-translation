base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/030.yaml
  text: because of the sins of Jeroboam that he committed and by which he caused Israel to sin[a], and because of his provocation by which he provoked Yahweh, the God of Israel.
translation:
  language: sw
  text: kwa sababu ya dhambi za Yeroboamu alizotenda na kwa hizo aliifanya Israeli itende dhambi, na kwa sababu ya uchokozi wake[a], ambao ulimkasirisha Yahwe, Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hasira yake”; nomino ya Kiebrania inaweza kumaanisha hasira au uchokozi, lakini hapa “uchokozi” inalingana vizuri zaidi na kitenzi kinachofuata, “ulimkasirisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל חַטֹּאות
  choice: kwa sababu ya dhambi
  rationale: עַל inaonyesha sababu ya hukumu iliyotangulia, nayo חַטֹּאות ni nomino ya wingi; tafsiri hii inawasilisha uhusiano wa kisababishi na wingi wa makosa.
- source_word: חָטָא
  choice: alizotenda
  rationale: Kwa kuwa nomino ‘dhambi’ tayari imetajwa, ‘alizotenda’ huepuka urudiaji usio wa lazima huku ikihifadhi maana ya kitenzi.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: aliifanya Israeli itende dhambi
  rationale: Hifili ya חטא ina maana ya kusababisha; muundo huu unahifadhi wazi kwamba Yeroboamu ndiye aliyeisababisha Israeli kutenda dhambi.
- source_word: בְּכַעְסוֹ
  choice: kwa sababu ya uchokozi wake
  rationale: כַּעַס inaweza kumaanisha hasira au uchokozi. Katika muktadha huu, ‘uchokozi’ inapatana vizuri na kitenzi kinachofuata, הִכְעִיס, kinachoonyesha kumkasirisha mtu.
- source_word: אֲשֶׁר הִכְעִיס
  choice: aliomkasirisha nao
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inadumisha uhusiano kati ya uchokozi wa Yeroboamu na tendo lake la kumkasirisha Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa kimilikishi wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la Mungu la herufi nne; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Wajibu wa Yeroboamu katika dhambi ya Israeli
  choice: aliifanya Israeli itende dhambi
  alternative: aliiongoza Israeli katika dhambi
  rationale: Tafsiri iliyochaguliwa huhifadhi nguvu ya kisababishi ya הֶחֱטִיא bila kufafanua zaidi namna alivyowashawishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kisababishi na urudiaji wa hoja mbili umehifadhiwa, huku sentensi ikibaki ya asili na kueleweka kwa msomaji wa kawaida.
