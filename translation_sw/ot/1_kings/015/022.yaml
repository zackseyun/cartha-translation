base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/022.yaml
  text: Then King Asa summoned all Judah—no one was exempt—and they carried away the stones of Ramah and its timber[a], with which Baasha had built[c][b], and King Asa built with them Geba of Benjamin and Mizpah.
translation:
  language: sw
  text: Kisha Mfalme Asa akatoa mwito kwa Yuda yote[a]—hakuna mtu aliyesamehewa[b]—nao wakabeba mawe ya Rama na mbao zake, ambazo Baasha alikuwa ametumia kuijenga Rama[c]. Mfalme Asa akajenga kwa vitu hivyo Geba katika Benyamini na Mispa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akatangaza kwa Yuda yote.” Kitenzi cha Kiebrania kwa maana halisi ni “alisababisha wasikie.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “hakuna mtu aliye huru,” yaani, hakuna mtu aliyesamehewa wajibu wa kufanya kazi hiyo.'
    reason: lexical_alternative
  - marker: c
    text: Kishazi hiki kinarejelea mawe na mbao kama vifaa ambavyo Baasha alitumia kuijenga Rama.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁמִיעַ
  choice: akawaita watu wote
  rationale: Hifili ya שׁמע hapa ina maana ya kutoa mwito au tangazo kwa Yuda yote. “Akawaita watu wote” inaeleza kwa Kiswahili cha kawaida kusudi la mwito huo wa kazi.
- source_word: אֵין נָקִי
  choice: hakuna hata mmoja aliyeachiliwa
  rationale: Katika muktadha wa kuhamasisha watu kufanya kazi, נָקִי humaanisha mtu aliyeondolewa katika wajibu, si mtu asiye na hatia.
- source_word: וַיִּשְׂאוּ
  choice: wakachukua
  rationale: Kitenzi נשא hapa kinaeleza kuondoa na kusafirisha vifaa vya ujenzi kutoka Rama. “Wakachukua” ni fasaha na kinaendana na muktadha.
- source_word: אַבְנֵי הָרָמָה
  choice: mawe ya Rama
  rationale: Muundo wa Kiebrania unaunganisha mawe na mahali pa Rama; “mawe ya Rama” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: עֵצֶיהָ
  choice: mbao zake
  rationale: עֵצִים hapa ni miti iliyotumiwa kama vifaa vya ujenzi; “mbao” ni sahihi zaidi kimuktadha kuliko “miti” au “kuni.”
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: ambazo Baasha alikuwa ametumia kujenga Rama
  rationale: Kishazi hiki kinarejelea mawe na mbao kama vifaa ambavyo Baasha alitumia katika ujenzi wa Rama. Kutaja Rama kunafanya sentensi iwe kamili na wazi katika Kiswahili bila kubadili maana ya muktadha.
- source_word: וַיִּבֶן בָּם
  choice: akazitumia kujenga
  rationale: Kiambishi בָם kinarejelea mawe na mbao kama vifaa vya ujenzi; “akazitumia kujenga” ni Kiswahili cha kawaida na huonyesha uhusiano huo wazi.
- source_word: גֶּבַע בִּנְיָמִן
  choice: Geba ya Benyamini
  rationale: Huu ni uhusiano wa jina la mahali na eneo au kabila lake; “Geba ya Benyamini” hutofautisha mahali hapa kwa njia ya karibu na Kiebrania.
- source_word: הַמִּצְפָּה
  choice: Mispa
  rationale: “Mispa” ni umbo la jina hili la mahali linaloeleweka katika mapokeo ya Kiswahili; kibainishi cha Kiebrania hakihitajiki mbele ya jina hili katika Kiswahili.
