base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/013.yaml
  text: He also removed Maacah his mother from being queen mother[a], because she had made an abominable image for Asherah[c][b]. Asa cut down her image and burned it in the Kidron Valley.
translation:
  language: sw
  text: Pia alimwondoa Maaka, mama yake, katika cheo cha malkia-mama[a], kwa sababu alikuwa ametengeneza kitu cha kuchukiza[b] kwa ajili ya Ashera[c]. Asa akakikata kitu chake hicho na kukichoma katika Bonde la Kidroni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mama yake.” Katika matumizi ya kifalme, neno hili wakati mwingine laweza kumaanisha nyanya au mwanamke mwingine wa ukoo wa kifalme wa kizazi kilichotangulia.'
    reason: lexical_alternative
  - marker: b
    text: Au “kitu cha kutisha” au “sanamu ya kuchukiza.” Umbo halisi la kitu hiki cha ibada halijulikani kwa hakika.
    reason: lexical_alternative
  - marker: c
    text: “Ashera” laweza kumaanisha mungu wa kike aliyeitwa Ashera au ishara yake ya ibada, ambayo mara nyingi huitwa “nguzo ya Ashera.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Pia
  rationale: Inaonyesha kuwa tendo hili lilikuwa nyongeza kwa matengenezo yaliyotajwa katika muktadha uliotangulia.
- source_word: מַעֲכָה אִמּוֹ
  choice: Maaka mama yake
  rationale: Huhifadhi maana ya moja kwa moja ya Kiebrania, ingawa katika matumizi ya kifalme neno laweza kumaanisha nyanya au babu wa kike.
- source_word: וַיְסִרֶהָ מִגְּבִירָה
  choice: alimwondoa ... katika cheo cha malkia mama
  rationale: Kitenzi kinaonyesha kuondolewa katika wadhifa, na גְּבִירָה hapa ni cheo rasmi cha mwanamke mkuu wa jumba la kifalme, yaani malkia mama.
- source_word: אֲשֶׁר עָשְׂתָה
  choice: kwa sababu alikuwa ametengeneza
  rationale: Katika muktadha huu kishazi kinaeleza sababu ya Maaka kuondolewa katika cheo chake.
- source_word: מִפְלֶצֶת
  choice: sanamu ya kuchukiza
  rationale: Huwasilisha hukumu kali dhidi ya kitu hicho cha ibada bila kubainisha kupita kiasi umbo lake lisilojulikana kwa hakika.
- source_word: לָאֲשֵׁרָה
  choice: kwa ajili ya Ashera
  rationale: Huhifadhi jina Ashera bila kuamua kama linamtaja mungu wa kike au ishara yake ya ibada.
- source_word: וַיִּכְרֹת ... אֶת מִפְלַצְתָּהּ
  choice: akaikata sanamu yake
  rationale: Huhifadhi maana halisi ya כרת, ‘kukata,’ ambayo huenda ikaonyesha kuwa kitu hicho kilikuwa cha mbao au chenye umbo linaloweza kukatwa.
- source_word: וַיִּשְׂרֹף
  choice: kuiteketeza kwa moto
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba kitu hicho kilichomwa kabisa.
- source_word: בְּנַחַל קִדְרוֹן
  choice: katika Bonde la Kidroni
  rationale: נחל laweza kumaanisha bonde, korongo, au kijito cha msimu; ‘Bonde la Kidroni’ ni lugha ya kawaida na inafaa mahali panapotajwa.
theological_decisions:
- issue: Kirejelewa cha אֲשֵׁרָה
  choice: Ashera
  alternative: mungu wa kike Ashera; nguzo au ishara ya Ashera
  rationale: Neno la Kiebrania linaweza kumaanisha mungu wa kike au ishara yake ya ibada. Kwa kuwa mstari tayari unataja kitu tofauti kilichotengenezwa, kutaja ‘Ashera’ pekee kunahifadhi utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Malkia mama’ linaonyesha cheo rasmi cha kifalme; ‘sanamu ya kuchukiza’ ni wazi kwa wasomaji wa kawaida huku tanbihi zikihifadhi kutokuwa na uhakika kuhusu umbo la kitu hicho na maana ya Ashera.
