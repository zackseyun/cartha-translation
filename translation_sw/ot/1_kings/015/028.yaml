  yaml_path: translation/ot/1_kings/015/028.yaml
  text: Baasha put him to death in the third year of Asa king of Judah[a], and reigned in his place.
translation:
  language: sw
  text: Baasha akamuua katika mwaka wa tatu wa utawala wa Asa, mfalme wa Yuda,[a] naye akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika mwaka wa tatu wa Asa kuwa mfalme wa Yuda.”
    reason: Muundo wa Kiebrania ni mfupi, “katika mwaka wa tatu wa Asa, mfalme wa Yuda”; tafsiri kuu imefafanua kuwa ni mwaka wa utawala wake.
lexical_decisions:
- source_word: וַיְמִתֵהוּ
  choice: akamuua
  rationale: Hifili ya מות ina maana ya kusababisha mtu afe. Katika Kiswahili cha masimulizi, “akamuua” huwasilisha maana hiyo kwa uwazi na kwa lugha ya kawaida; tofauti na Kiingereza, usemi “alimtia kifo” si wa asili hapa.
- source_word: בַעְשָׁא
  choice: Baasha
  rationale: Jina la mtu limetoholewa kwa kufuata umbo linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: katika mwaka wa tatu wa utawala
  rationale: Muundo huu ni fomula ya kuhesabu miaka ya utawala. Nyongeza ya “wa utawala” huifanya maana iwe wazi na ya asili kwa Kiswahili bila kubadili rejeleo la wakati.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: wa Asa, mfalme wa Yuda
  rationale: Katika fomula ya mwaka wa kifalme, לְ huonyesha kwamba mwaka unahesabiwa kwa kurejelea utawala wa Asa; cheo na eneo lake vimetafsiriwa moja kwa moja.
- source_word: וַיִּמְלֹךְ
  choice: naye akatawala
  rationale: Qal wayyiqtol ya מלך hapa inaeleza Baasha kuanza au kushika utawala. “Akatawala” ni ya asili na huhifadhi mwendelezo wa simulizi.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: תחת pamoja na kiambishi hapa huonyesha urithi au kuchukua nafasi ya mfalme mwingine; “mahali pake” ni usemi wa kawaida wa Kiswahili.
