  text: Asa did what was right in the eyes of Yahweh[a], as David his father had done.
translation:
  language: sw
  text: Asa alifanya yaliyo sawa machoni pa Yahweh, kama Daudi baba yake alivyofanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “baba” humaanisha mtangulizi katika ukoo wa kifalme, si baba mzazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: alifanya
  rationale: Kitenzi עשה humaanisha ‘kufanya’ au ‘kutenda’; katika kauli hii ya kumtathmini mfalme, ‘alifanya yaliyo sawa’ ni Kiswahili cha kawaida na sahihi.
- source_word: אָסָא
  choice: Asa
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: הַיָּשָׁר
  choice: yaliyo sawa
  rationale: יָשָׁר inaweza kumaanisha ‘sawa’ au ‘nyofu’; hapa inataja mwenendo unaokubaliwa, na ‘yaliyo sawa’ ni usemi wa asili katika Kiswahili.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Huhifadhi sitiari ya Kiebrania inayomaanisha tathmini kulingana na mtazamo wa mtu fulani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: כְּדָוִד
  choice: kama Daudi
  rationale: Kiambishi כְּ kinaonyesha ulinganisho; ‘kama Daudi’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אָבִיו
  choice: baba yake
  rationale: אָב inaweza kumaanisha baba wa karibu au babu/mzazi wa zamani. ‘Baba yake’ huhifadhi lugha ya ukoo wa kifalme ya chanzo, huku tanbihi ikifafanua maana ya babu wa ukoo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya ‘Daudi baba yake’ kuhusiana na Asa
  choice: Kudumisha ‘baba yake’ katika matini kuu kama lugha ya nasaba ya kifalme
  alternative: Daudi babu yake wa ukoo
  rationale: Kiebrania kina אָבִיו, na katika kauli za kifalme ‘baba’ huweza kumaanisha mtangulizi katika ukoo. Tanbihi huzuia dhana kwamba Daudi alikuwa baba mzazi wa Asa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Usemi ‘machoni pa Yahweh’ umehifadhi sitiari ya Kiebrania, na ‘baba yake’ umehifadhi mvutano wa maana ya nasaba huku tanbihi ikifafanua.
