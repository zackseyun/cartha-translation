  text: And when Baasha heard of it[a], he stopped building Ramah and remained in Tirzah.
translation:
  language: sw
  text: Baasha aliposikia hayo, aliacha kujenga Rama, akakaa Tirsa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: akaishi Tirsa.'
    reason: Neno la Kiebrania linaweza kumaanisha kukaa au kuishi mahali.
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: aliposikia hayo
  rationale: Muundo huu wa masimulizi unaanzisha kishazi cha wakati. Neno “hayo” limeongezwa kwa ufasaha wa Kiswahili, likirejelea habari iliyotangulia katika muktadha.
- source_word: בַּעְשָׁא
  choice: Baasha
  rationale: Jina la mtu limetoholewa kwa namna inayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: aliacha kujenga
  rationale: Kitenzi חדל pamoja na מן na kitenzi-jina huonyesha kukoma kufanya jambo; “aliacha kujenga” ni Kiswahili cha kawaida na sahihi.
- source_word: אֶת הָרָמָה
  choice: Rama
  rationale: Hili ni jina la mahali na ndilo yambwa la tendo la kujenga.
- source_word: וַיֵּשֶׁב
  choice: akakaa
  rationale: ישׁב inaweza kumaanisha kukaa, kuishi, au kubaki mahali. “Akakaa” huhifadhi upana huo bila kudokeza kwa lazima makazi ya kudumu.
- source_word: בְּתִרְצָה
  choice: Tirsa
  rationale: Jina la mahali limetoholewa moja kwa moja, na kiambishi ב kimewasilishwa kwa maana ya kuwa mahali hapo.
