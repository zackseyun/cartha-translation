base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/031.yaml
  text: The rest of the acts of Nadab[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: sw
  text: Je, matendo mengine ya Nadabu na yote aliyoyafanya, hayakuandikwa katika Kitabu cha Kumbukumbu za Wafalme wa Israeli?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli.” Usemi wa Kiebrania unarejelea chanzo cha kumbukumbu za kifalme, si lazima kitabu cha Biblia cha Mambo ya Nyakati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי נָדָב
  choice: Matendo mengine ya Nadabu
  rationale: יֶתֶר ni sehemu iliyobaki au mambo mengine, na דִּבְרֵי katika muhtasari huu wa utawala hurejelea matendo au mambo yaliyorekodiwa. “Matendo mengine” ni Kiswahili cha kawaida na kinafaa katika muktadha wa kihistoria.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: na yote aliyoyafanya
  rationale: Huhifadhi kiunganishi na kishazi cha Kiebrania kwa lugha ya kawaida ya Kiswahili bila kupunguza maana ya ujumla.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: הֲלֹא huanzisha swali la balagha linalotarajia jibu la kukubali. Ngeli ya “matendo” inaongoza upatanisho wa “hayakuandikwa.”
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kwa msingi ni “juu ya,” katika rejeleo la maandishi Kiswahili cha kawaida husema mambo yameandikwa “katika kitabu.”
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: Kumbukumbu za Wafalme wa Israeli
  rationale: Usemi huu ni jina la chanzo cha kumbukumbu za kifalme. “Kumbukumbu” huwasilisha kazi yake kwa uwazi huku tanbihi ikihifadhi tafsiri mbadala ya karibu zaidi na muundo wa Kiebrania.
theological_decisions:
- issue: Utambulisho wa kitabu kinachotajwa
  choice: Kimewasilishwa kama chanzo cha kumbukumbu za wafalme, bila kukitambulisha na kitabu fulani cha Biblia.
  alternative: Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli
  rationale: Kiebrania kinarejelea kumbukumbu ya kifalme ambayo si lazima iwe vitabu vya Biblia vinavyoitwa Mambo ya Nyakati; tanbihi inazuia mkanganyiko bila kuamua zaidi ya ushahidi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa swali la balagha umehifadhiwa, na jina Nadabu limetoholewa kwa desturi ya kawaida ya Kiswahili cha Biblia.
