  text: וְ/הַ/בָּמ֖וֹת לֹא סָ֑רוּ רַ֣ק לְבַב אָסָ֗א הָיָ֥ה שָׁלֵ֛ם עִם יְהוָ֖ה כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/014.yaml
  text: But the high places were not removed; nevertheless[a], Asa’s heart was wholly devoted to Yahweh all his days.
translation:
  language: sw
  text: Lakini mahali pa juu pa ibada hapakuondolewa; hata hivyo, moyo wa Asa ulikuwa mwaminifu kikamilifu kwa Yahweh siku zake zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moyo wa Asa ulikuwa mzima pamoja na Yahweh siku zake zote.” Kiebrania kinasema kihalisi, “moyo wa Asa ulikuwa mzima pamoja na Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּמוֹת
  choice: mahali pa juu pa ibada
  rationale: במות humaanisha mahali pa ibada, mara nyingi palipoinuka; kuongeza “pa ibada” huzuia maana ya kijiografia pekee na kubaki wazi kuhusu aina ya ibada.
- source_word: לֹא סָרוּ
  choice: hapakuondolewa
  rationale: Kwa kuwa nomino ya Kiswahili “mahali” iko katika ngeli ya PA na inatumika hapa kwa maana ya jumla, umoja wa kisarufi “hapakuondolewa” ni wa asili na unaonyesha kutokukomeshwa kwa vituo hivyo.
- source_word: רַק
  choice: Hata hivyo
  rationale: 'רק hapa huleta utofautishaji wa kukubali: ingawa mahali pa juu hapakuondolewa, uaminifu wa ndani wa Asa unathibitishwa.'
- source_word: לְבַב אָסָא
  choice: moyo wa Asa
  rationale: “Moyo” kwa kawaida huwakilisha nafsi ya ndani, nia, na uaminifu; muundo wa “wa Asa” ni Kiswahili cha kawaida.
- source_word: שָׁלֵם
  choice: ulikuwa umejitoa kikamilifu
  rationale: Katika muundo wa moyo kuwa שלם pamoja na Yahweh, maana ni uaminifu kamili au usiogawanyika, si ukamilifu usio na dhambi.
- source_word: עִם יְהוָה
  choice: kwa Yahweh
  rationale: Ingawa עם kwa msingi ni “pamoja na,” kitenzi cha Kiswahili “kujitoa” kwa kawaida hufuatiwa na “kwa”; maana halisi zaidi ya “pamoja na” imehifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu linatoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: כָּל יָמָיו
  choice: siku zake zote
  rationale: Huu ni uwasilishaji wa moja kwa moja wa nahau ya Kiebrania, ukidumisha maana ya muda wote wa maisha yake.
theological_decisions:
- issue: Maana ya moyo wa Asa kuwa שלם licha ya mahali pa juu kutokuondolewa
  choice: Mstari unathibitisha uaminifu mkuu na usiogawanyika wa Asa kwa Yahweh, bila kudai kwamba hakuwa na dhambi au kwamba mageuzi yake yalifanikiwa kwa kila jambo.
  alternative: Kutafsiri kwamba Asa alikuwa mkamilifu kimaadili katika kila jambo, au kudhoofisha kauli iwe sifa ya jumla tu.
  rationale: Mfuatano wenyewe unaweka kushindwa kuondoa mahali pa juu sambamba na moyo שלם; hivyo mvutano huo umehifadhiwa bila kuugeuza kuwa dai la kutokuwa na dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mahali pa juu pa ibada” kinaeleweka kuliko “mahali pa juu” peke yake, huku “ulikuwa umejitoa kikamilifu” kikieleza uaminifu wa agano bila kudokeza ukamilifu usio na dhambi.
