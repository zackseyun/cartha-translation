  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Majina yametolewa katika maumbo ya kawaida ya Kibiblia: Nadabu, Yeroboamu, Asa, Israeli, na Yuda. Hakuna tanbihi zinazohitajika.'
