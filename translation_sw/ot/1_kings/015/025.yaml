  text: וְ/נָדָ֣ב בֶּן יָרָבְעָ֗ם מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/025.yaml
  text: Nadab son of Jeroboam became king over Israel in the second year of Asa king of Judah, and he reigned over Israel two years.
translation:
  language: sw
  text: Nadabu mwana wa Yeroboamu akawa mfalme wa Israeli katika mwaka wa pili wa utawala wa Asa, mfalme wa Yuda, naye akatawala Israeli kwa miaka miwili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָדָב
  choice: Nadabu
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia. Kiunganishi וְ kinaendeleza simulizi, lakini hakihitaji neno la mwanzo kama “basi” katika Kiswahili.
- source_word: בֶּן יָרָבְעָם
  choice: mwana wa Yeroboamu
  rationale: Huu ni uhusiano wa kawaida wa kifamilia, na umbo hili ni la asili na wazi katika Kiswahili.
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  choice: akawa mfalme wa Israeli
  rationale: Tendo la kwanza linaonyesha kuingia kwake katika ufalme, si tu kuendelea kutawala; “akawa mfalme” hutofautisha kutawazwa kwake na muda wa utawala unaotajwa baadaye.
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/אָסָא
  choice: katika mwaka wa pili wa utawala wa Asa
  rationale: Hii ni nahau ya kuhesabu miaka ya utawala wa mfalme mwingine. Kuongeza “wa utawala” kunaweka wazi maana ya kihistoria bila kubadili taarifa ya Kiebrania.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Cheo na eneo la ufalme vimetafsiriwa moja kwa moja kwa Kiswahili cha kawaida.
- source_word: וַ/יִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: naye akatawala Israeli
  rationale: Katika sehemu hii kitenzi kinafuatwa na muda wa miaka miwili, kwa hiyo “akatawala” kinaonyesha kipindi cha utawala. “Naye” kinawakilisha mwendelezo wa וַ na kuunganisha vifungu kwa asili.
- source_word: שְׁנָתָיִם
  choice: kwa miaka miwili
  rationale: Hiki ni kirai cha muda kinachoeleza urefu wa utawala wa Nadabu.
