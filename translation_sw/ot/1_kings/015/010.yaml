base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/010.yaml
  text: He reigned forty-one years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: sw
  text: Alitawala huko Yerusalemu kwa miaka arobaini na mmoja. Mama yake aliitwa Maaka, binti[a] ya Abishalomu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “binti” linaweza pia kutumiwa kwa maana pana ya mzao wa kike katika orodha za ukoo.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: Abishalomu; tafsiri nyingi hutumia umbo “Absalomu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעִים וְאַחַת שָׁנָה
  choice: miaka arobaini na mmoja
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kutaja kipindi cha miaka 41, badala ya kufuata neno kwa neno muundo wa Kiebrania, ‘arobaini na mwaka mmoja.’
- source_word: מָלַךְ
  choice: alitawala
  rationale: Katika muktadha huu, kitenzi kinamaanisha kutekeleza utawala wa kifalme kwa kipindi kilichotajwa, si kuanza kuwa mfalme.
- source_word: בִּירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Kiambishi cha Kiebrania kinaonyesha mahali; katika Kiswahili, jina la mji baada ya ‘alitawala’ linaeleweka kwa kawaida bila kuongeza ‘katika.’
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Hii inawasilisha kwa Kiswahili cha asili maana ya kauli ya Kiebrania, ‘na jina la mama yake lilikuwa.’
- source_word: מַעֲכָה
  choice: Maaka
  rationale: Jina hili limenukuliwa kwa herufi za Kiswahili badala ya kutafsiriwa.
- source_word: בַּת
  choice: binti ya
  rationale: Maana ya moja kwa moja ni ‘binti ya.’ Uwezekano wa neno hilo kumaanisha mzao wa kike wa kizazi cha mbali zaidi umewekwa katika tanbihi badala ya kuingizwa katika matini.
- source_word: אֲבִישָׁלוֹם
  choice: Abishalomu
  rationale: Umbo hili linawakilisha kwa karibu jina la Kiebrania lililo katika mstari huu; umbo linalojulikana zaidi, ‘Absalomu,’ limetajwa katika tanbihi.
theological_decisions:
- issue: Uhusiano wa ukoo wa Maaka na Abishalomu
  choice: Kudumisha usemi wa moja kwa moja ‘binti ya Abishalomu’ katika matini kuu.
  alternative: mjukuu wa kike wa Abishalomu; mzao wa kike wa Abishalomu
  rationale: Matini ya Kiebrania inasema wazi ‘binti.’ Ingawa matumizi ya nasaba yanaweza kuruhusu uhusiano wa kizazi cha mbali zaidi, tafsiri haipaswi kutatua kimyakimya swali hilo la kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo umegawanywa katika sentensi mbili kwa usomaji wa asili bila kupoteza uhusiano wa taarifa za Kiebrania.
