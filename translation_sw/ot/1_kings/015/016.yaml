  yaml_path: translation/ot/1_kings/015/016.yaml
  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: sw
  text: Kulikuwa na vita kati ya Asa na Baasha, mfalme wa Israeli, siku zao zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika siku zao zote,” au “siku zote za maisha yao.” Nahau ya Kiebrania inasema kihalisi “siku zao zote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: Kulikuwa na vita
  rationale: Muundo huu wa Kiebrania unaeleza kuwapo kwa hali ya vita. Kiswahili cha kawaida na cha moja kwa moja ni “Kulikuwa na vita”; muktadha unaonyesha hali iliyoendelea bila kulazimisha kuongeza neno “viliendelea.”
- source_word: בֵּין ... וּ/בֵין
  choice: kati ya ... na
  rationale: Muundo wa vihusishi vilivyounganishwa unaonyesha uhasama wa pande mbili, na kwa kawaida hutafsiriwa “kati ya ... na” katika Kiswahili.
- source_word: אָסָא
  choice: Asa
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בַּעְשָׁא
  choice: Baasha
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Mfuatano huu wa nomino unamtambulisha Baasha kwa cheo chake. Katika Kiswahili, “Baasha, mfalme wa Israeli” ni apposition ya kawaida na iliyo wazi.
- source_word: כָּל יְמֵי/הֶם
  choice: siku zao zote
  rationale: Hili ndilo tumizi la karibu la nahau ya Kiebrania “siku zao zote.” Linahifadhi upeo usiofafanuliwa kikamilifu—huenda ukihusu maisha yao au kipindi chao cha kutawala—bila kuamua kimya kimya.
theological_decisions: []
