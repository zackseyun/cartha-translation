  text: וַ/יִּקְשֹׁ֨ר עָלָ֜י/ו בַּעְשָׁ֤א בֶן אֲחִיָּה֙ לְ/בֵ֣ית יִשָּׂשכָ֔ר וַ/יַּכֵּ֣/הוּ בַעְשָׁ֔א בְּ/גִבְּת֖וֹן אֲשֶׁ֣ר לַ/פְּלִשְׁתִּ֑ים וְ/נָדָב֙ וְ/כָל יִשְׂרָאֵ֔ל צָרִ֖ים עַֽל גִּבְּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/027.yaml
  text: Then Baasha son of Ahijah[a], of the house of Issachar, conspired against him, and Baasha struck him down at Gibbethon, which belonged to the Philistines[c][b], while Nadab and all Israel were besieging Gibbethon.
translation:
  language: sw
  text: Ndipo Baasha mwana wa Ahiya, wa ukoo wa Isakari, akafanya njama dhidi yake[a]. Baasha akampiga[b] huko Gibethoni, mji uliokuwa wa Wafilisti[c], wakati Nadabu na Israeli wote walikuwa wameizingira Gibethoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akapanga njama dhidi yake” au “akaingia katika njama dhidi yake.”
    reason: lexical_alternative
  - marker: b
    text: Au “akamuua”; Kiebrania ni “akampiga.”
    reason: lexical_alternative
  - marker: c
    text: Au “mji uliokuwa chini ya udhibiti wa Wafilisti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: akafanya njama dhidi yake
  rationale: Kitenzi קשר pamoja na עַל hapa kinaonyesha njama ya kisiasa dhidi ya mtawala, si wazo au mpango wa siri wa mtu binafsi tu.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baasha mwana wa Ahiya
  rationale: Majina yametoholewa kwa namna inayotambulika katika Kiswahili, na בֶּן limetafsiriwa kwa usemi wa kawaida ‘mwana wa.’
- source_word: לְבֵית יִשָּׂשכָר
  choice: wa ukoo wa Isakari
  rationale: Katika muktadha huu ‘nyumba’ inaonyesha asili ya kifamilia au kikabila; ‘ukoo’ huwasilisha maana hiyo kwa Kiswahili cha sasa bila kudokeza jengo.
- source_word: וַיַּכֵּהוּ
  choice: akamuua
  rationale: Ingawa נכה kimsingi ni ‘kupiga,’ katika simulizi hili pigo hilo ni la kuua. ‘Akamuua’ huonyesha wazi matokeo yanayokusudiwa na muktadha, huku tanbihi ikihifadhi taswira halisi ya Kiebrania.
- source_word: בְּגִבְּתוֹן
  choice: huko Gibethoni
  rationale: ‘Huko’ ni ya kawaida kwa tukio lililotokea katika au karibu na mji uliokuwa umezingirwa.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: mji uliokuwa wa Wafilisti
  rationale: Muundo wenye ל־ unaweza kuonyesha umiliki au udhibiti. Tafsiri hii huhifadhi maana ya msingi, na tanbihi inaonyesha uwezekano wa udhibiti wa kijeshi.
- source_word: וְנָדָב וְכָל יִשְׂרָאֵל
  choice: wakati Nadabu na Israeli wote
  rationale: Kiunganishi kinaanzisha mazingira ya wakati ambayo mauaji yalitokea; ‘wakati’ hufanya kazi hiyo ya kimazingira iwe wazi na ya asili kwa Kiswahili.
- source_word: צָרִים עַל גִּבְּתוֹן
  choice: walipokuwa wameuzingira Gibethoni
  rationale: צור על ni usemi wa kijeshi wa kuuzingira mji ili kuushambulia; muundo huu pia unaonyesha tendo lililokuwa likiendelea wakati huo.
theological_decisions: []
