  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Ukoo’ umetumiwa badala ya tafsiri halisi ‘nyumba’ ili kueleza nasaba kwa ufasaha. Majina Baasha, Ahiya, Isakari, Nadabu na Gibethoni yanafuata maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili.
