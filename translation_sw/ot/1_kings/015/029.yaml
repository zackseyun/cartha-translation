source:
  edition: WLC
  text: וַ/יְהִ֣י כְ/מָלְכ֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית יָרָבְעָ֔ם לֹֽא הִשְׁאִ֧יר כָּל נְשָׁמָ֛ה לְ/יָרָבְעָ֖ם עַד הִשְׁמִד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥ה הַ/שִּׁילֹנִֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/029.yaml
  text: And when he became king[a], he struck down all the house of Jeroboam. He did not leave to Jeroboam a single living thing, until he had destroyed him[b], according to the word of Yahweh that he had spoken by the hand of his servant Ahijah the Shilonite.
translation:
  language: sw
  text: Alipotwaa ufalme, aliwaua watu wote wa nasaba ya Yeroboamu. Hakumwachia Yeroboamu hata mtu mmoja hai[a], mpaka alipoiangamiza nasaba hiyo[b], sawasawa na neno la Yahweh alilolinena kupitia mtumishi wake Ahija wa Shilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa halisi, “hakuacha pumzi yoyote”; maana yake, hakumwacha mtu yeyote hai.
    reason: lexical_alternative
  - marker: b
    text: Kwa halisi, “mpaka alipomwangamiza yeye.” Kiwakilishi cha umoja wa kiume kinaweza kumrejelea Yeroboamu kama mwakilishi wa nasaba yake, au nyumba/nasaba yake kama kundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְמָלְכוֹ
  choice: Alipoanza kutawala
  rationale: Kishazi hiki cha wakati kinaonyesha mwanzo wa utawala wake; tafsiri hii ni ya kawaida katika Kiswahili na inafaa muktadha wa kutwaa ufalme.
- source_word: הִכָּה אֶת כָּל בֵּית יָרָבְעָם
  choice: aliwaua watu wote wa ukoo wa Yeroboamu
  rationale: Katika muktadha huu נכה ni kuua, na ‘nyumba’ ya mfalme ni ukoo au nasaba yake, si jengo. Kutaja watu wa ukoo kunafanya maana hiyo iwe wazi kwa msomaji wa kawaida.
- source_word: לֹא הִשְׁאִיר כָּל נְשָׁמָה לְיָרָבְעָם
  choice: Hakumwachia Yeroboamu hata mtu mmoja hai
  rationale: נְשָׁמָה kwa halisi huhusiana na pumzi, lakini hapa ni nahau inayomaanisha kwamba hakuna mtu aliyeachwa hai katika ukoo wake.
- source_word: עַד הִשְׁמִידוֹ
  choice: mpaka alipouangamiza kabisa ukoo huo
  rationale: Kitenzi kinaonyesha kuondoa kabisa. Kiwakilishi tamati cha Kiebrania ni umoja wa kiume, lakini katika muktadha kinaweza kurejelea nyumba ya Yeroboamu kama kundi; Kiswahili kinataja ukoo wazi ili kuepuka kudokeza kimakosa kwamba Yeroboamu mwenyewe ndiye aliyeuawa wakati huo.
- source_word: כִּדְבַר יְהוָה
  choice: sawasawa na neno la Yahwe
  rationale: Hii ni kauli ya kutimizwa kwa neno la Mungu; jina binafsi יהוה limetoholewa kuwa Yahwe.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: alilolinena kupitia mtumishi wake
  rationale: בְיַד ni nahau ya chombo au uwakilishi. ‘Kupitia’ huwasilisha maana yake kwa Kiswahili cha sasa bila kupoteza dhana ya ujumbe wa kinabii.
- source_word: אֲחִיָּה הַשִּׁילֹנִי
  choice: Ahija wa Shilo
  rationale: Jina limetoholewa, na kivumishi cha mahali kimetafsiriwa kwa muundo wa kawaida wa Kiswahili unaomaanisha mtu aliyetoka Shilo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina la agano יהוה moja kwa moja; ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Kirejelewa cha kiwakilishi katika הִשְׁמִידוֹ
  choice: ukoo huo
  alternative: yeye
  rationale: Kiwakilishi cha Kiebrania ni umoja wa kiume na kinaweza kuwakilisha nyumba ya Yeroboamu kwa ujumla. Tafsiri kuu inaonyesha kirejelewa cha pamoja, huku tanbihi ikihifadhi umbo na uwezekano mwingine wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi cha Biblia lakini kinachoeleweka kwa urahisi. ‘Ukoo’ huwasilisha maana ya kifalme ya בֵּית, na ‘kupitia’ huepuka ugumu wa usemi wa neno kwa neno ‘kwa mkono wa’.
