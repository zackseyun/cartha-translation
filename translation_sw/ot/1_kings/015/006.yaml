  text: וּ/מִלְחָמָ֨ה הָיְתָ֧ה בֵין רְחַבְעָ֛ם וּ/בֵ֥ין יָרָבְעָ֖ם כָּל יְמֵ֥י חַיָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/006.yaml
  text: And there was war between Rehoboam and Jeroboam all the days of his life[a].
translation:
  language: sw
  text: Kulikuwa na vita kati ya Rehoboamu na Yeroboamu siku zote za maisha yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku zote za maisha ya Rehoboamu.” Baadhi ya wafasiri, kwa kuzingatia muktadha na mjadala wa kimatini, wanaelewa kiwakilishi hicho kuwa kinamrejelea Abiya (Abiyamu).
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִלְחָמָה
  choice: Kulikuwa na vita
  rationale: Nomino מִלְחָמָה humaanisha vita au mapigano. Katika Kiswahili, muundo wa pamoja na הָיְתָה hutafsiriwa kwa kawaida na kwa ufasaha kuwa “Kulikuwa na vita”; kiunganishi וּ kinaendeleza simulizi bila kulazimisha neno tofauti la “na” mwanzoni.
- source_word: הָיְתָה
  choice: kulikuwa na
  rationale: Kitenzi היה katika muundo huu kinaonyesha kuwapo kwa hali fulani. “Kulikuwa na” ni usemi wa kawaida wa Kiswahili na hakiongezi maana ya kwamba vita ‘viliendelea,’ ingawa muda unaofuata unaonyesha hali ya kudumu.
- source_word: בֵין ... וּ/בֵין
  choice: kati ya ... na
  rationale: Vihusishi vilivyorudiwa vinaonyesha pande mbili zilizokuwa katika vita. Kiswahili sanifu hutumia kwa kawaida “kati ya ... na” bila kurudia kihusishi.
- source_word: רְחַבְעָם
  choice: Rehoboamu
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: יָרָבְעָם
  choice: Yeroboamu
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: כָּל יְמֵי
  choice: siku zote za
  rationale: Hii ni nahau ya Kiebrania inayoonyesha muda wote wa maisha. “Siku zote za” huhifadhi umbo na maana yake kwa Kiswahili kinachoeleweka.
- source_word: חַיָּיו
  choice: maisha yake
  rationale: Nomino yenye kiambishi cha nafsi ya tatu ya kiume ina maana ya “maisha yake.” Tafsiri hii huhifadhi kiwakilishi bila kumtaja wazi anayerejelewa.
theological_decisions:
- issue: Anayerejelewa na kiwakilishi katika “siku zote za maisha yake”
  choice: Kiwakilishi kimehifadhiwa kama “yake” bila kutaja mhusika katika matini kuu.
  alternative: “siku zote za maisha ya Rehoboamu”; au kuelewa kiwakilishi hicho kuwa kinamrejelea Abiya (Abiyamu).
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya tatu ya kiume umoja, lakini kishazi chenyewe hakimtambulishi wazi anayerejelewa. Muktadha mpana na masuala ya kimatini yamesababisha tofauti ya uelewaji kati ya Rehoboamu na Abiya/Abiyamu. Matini kuu kwa hiyo inahifadhi utata wa chanzo badala ya kuutatua kimafasiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo “Kulikuwa na vita” ni wa kawaida na wa asili; “siku zote za maisha yake” huhifadhi nahau ya Kiebrania pamoja na utata wa kiwakilishi.
