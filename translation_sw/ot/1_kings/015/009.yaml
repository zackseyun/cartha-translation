  text: In the twentieth year of Jeroboam king of Israel[b][a], Asa became king over Judah.
translation:
  language: sw
  text: Katika mwaka wa ishirini wa Yeroboamu, mfalme wa Israeli, Asa akawa mfalme wa Yuda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת
  choice: Katika mwaka wa
  rationale: Muundo huu ni fomula ya kawaida ya kutaja wakati katika masimulizi ya wafalme. Kiunganishi וּ hakihitaji kutafsiriwa kando katika Kiswahili hapa.
- source_word: עֶשְׂרִים
  choice: ishirini
  rationale: Katika fomula ya Kiswahili ‘mwaka wa ishirini,’ namba hii ina maana ya mpangilio, sawa na mwaka wa ishirini wa utawala.
- source_word: לְ/יָרָבְעָם
  choice: wa Yeroboamu
  rationale: Kihusishi לְ kinaonyesha utawala wa Yeroboamu kuwa kipimo cha kuhesabia mwaka; ‘wa Yeroboamu’ ni usemi wa kawaida wa kihistoria katika Kiswahili.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Cheo cha kifalme kimetafsiriwa moja kwa moja na kwa mtindo rasmi wa kawaida.
- source_word: מָלַךְ
  choice: alianza kutawala akiwa mfalme
  rationale: Katika taarifa za kupokezana kwa wafalme, kitenzi hiki kinaonyesha kuanza kwa utawala. Usemi huu unaweka wazi kuingia kwa Asa madarakani bila kudokeza muda wote wa utawala wake.
- source_word: אָסָא
  choice: Asa
  rationale: Umbo la jina linalotumiwa kwa kawaida katika Kiswahili.
- source_word: מֶלֶךְ יְהוּדָה
  choice: akiwa mfalme wa Yuda
  rationale: Kiebrania kwa muundo wa moja kwa moja ni ‘mfalme wa Yuda.’ Kuongeza ‘akiwa’ kunaleta sentensi ya asili katika Kiswahili baada ya ‘alianza kutawala’ huku maana ya cheo na eneo ikibaki.
