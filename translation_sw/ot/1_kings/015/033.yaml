translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa tarehe ya kifalme na tofauti kati ya kuanza kutawala na muda wa utawala vimehifadhiwa kwa ufasaha.
