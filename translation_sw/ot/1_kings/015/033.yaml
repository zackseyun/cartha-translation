base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/033.yaml
  text: In the third year of Asa king of Judah, Baasha son of Ahijah became king over all Israel in Tirzah, and he reigned twenty-four years.
translation:
  language: sw
  text: Katika mwaka wa tatu wa utawala wa Asa, mfalme wa Yuda, Baasha mwana wa Ahiya alianza kutawala Israeli yote huko Tirza, naye akatawala kwa miaka ishirini na minne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלֹשׁ לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Katika mwaka wa tatu wa utawala wa Asa, mfalme wa Yuda
  rationale: Hii ni fomula ya kuonyesha wakati kwa kurejelea mwaka wa utawala wa mfalme mwingine. Neno “utawala” limewekwa wazi ili Kiswahili kiwe cha kawaida na maana ibaki sahihi.
- source_word: מָלַךְ
  choice: alianza kutawala
  rationale: Katika muktadha huu kitenzi kinaanzisha kutawazwa au mwanzo wa utawala wa Baasha; uchaguzi huu pia unaepuka marudio yasiyo ya lazima kabla ya kutaja muda wa utawala.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baasha mwana wa Ahiya
  rationale: Majina yamenukuliwa kwa namna inayofaa Kiswahili, na patronimu ya Kiebrania imehifadhiwa kwa usemi wa kawaida “mwana wa.”
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: Israeli yote
  rationale: Kitenzi “kutawala” tayari huonyesha mamlaka juu ya watu; “yote” huhifadhi כָּל na kuonyesha ufalme wote wa kaskazini.
- source_word: בְּתִרְצָה
  choice: akiwa Tirza
  rationale: Kiambishi בְּ kinaonyesha mahali. “Akiwa Tirza” huunganisha mahali hapo kwa kawaida na utawala wa Baasha bila kudokeza maana nyingine.
- source_word: עֶשְׂרִים וְאַרְבַּע שָׁנָה
  choice: kwa miaka ishirini na minne
  rationale: Hiki ni kipindi cha utawala wa Baasha; “kwa miaka” ni usemi wa kawaida wa Kiswahili wa kutaja muda.
