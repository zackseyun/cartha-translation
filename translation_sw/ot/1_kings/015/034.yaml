base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/034.yaml
  text: He did what was evil in the eyes of Yahweh and walked in the way of Jeroboam and in his sin by which he caused Israel to sin.
translation:
  language: sw
  text: Alifanya yaliyo maovu machoni pa Yahwe, akaenenda katika njia ya Yeroboamu na katika dhambi yake. Kwa dhambi hiyo aliwafanya Waisraeli watende dhambi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Alifanya yaliyo maovu
  rationale: Hutafsiri kwa Kiswahili cha kawaida nahau ya Kiebrania yenye maana ya kufanya mambo yaliyo maovu, badala ya tafsiri ngumu ya neno kwa neno.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Inahifadhi sitiari ya Kiebrania ya tathmini ya Mungu kwa usemi wa Kiswahili unaoeleweka na wenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja kwa tahajia ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: akaenenda katika njia ya Yeroboamu
  rationale: Inahifadhi sitiari ya mwenendo kama kuenenda katika njia fulani na pia mtindo wa kifomula wa kitabu cha Wafalme.
- source_word: וּבְחַטָּאתוֹ
  choice: na katika dhambi yake
  rationale: Inadumisha nomino ya umoja na kiambishi cha umilikaji kinachoelekeza kwenye dhambi maarufu ya Yeroboamu.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ambayo kwa hiyo aliifanya Israeli itende dhambi
  rationale: 'Inahifadhi nguvu ya kisababishi ya kitenzi cha Kiebrania: Yeroboamu hakutenda dhambi peke yake, bali aliisababisha Israeli kutenda dhambi.'
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Ni umbo la kawaida la Kiswahili la jina la taifa na watu wa Israeli.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la Mungu la herufi nne; kulitaja kama Yahwe kunahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Uwajibikaji wa Yeroboamu katika dhambi ya Israeli
  choice: aliifanya Israeli itende dhambi
  alternative: aliiongoza Israeli katika dhambi
  rationale: Kitenzi הֶחֱטִיא ni cha kisababishi. Tafsiri iliyochaguliwa inahifadhi madai thabiti kwamba Yeroboamu aliisababisha Israeli kutenda dhambi bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka. Neno “akaenenda” limetumiwa kwa makusudi kuhifadhi sitiari ya Kiebrania ya kutembea katika njia, huku sentensi nyingine ikibaki ya kawaida na wazi.
