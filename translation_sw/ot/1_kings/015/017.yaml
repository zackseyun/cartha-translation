translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio wa sentensi unafuata kwa karibu Kiebrania huku ukibaki wa kawaida katika Kiswahili. Alama za tanbihi zimewekwa karibu na maneno yanayofafanuliwa.
