base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/017.yaml
  text: Then Baasha king of Israel went up against Judah and built Ramah[b][a], so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: sw
  text: Ndipo Baasha, mfalme wa Israeli, akaenda kupigana na Yuda na akaijenga Rama[a], ili asimruhusu yeyote kwenda au kutoka kwa Asa, mfalme wa Yuda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuijenga Rama kama ngome.” Kitenzi cha Kiebrania kinasema tu “kujenga,” lakini muktadha unaonyesha ujenzi wa kimkakati wa kijeshi.
    reason: lexical_alternative
  - marker: b
    text: Maneno “kwenda au kutoka” ni msemo wa Kiebrania unaohusu usafiri au ufikiaji kwa jumla; Baasha alikusudia kuzuia watu wasiende kwa Asa wala wasitoke kwake.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda dhidi ya
  rationale: Kitenzi עלה pamoja na עַל katika muktadha wa kijeshi kinaonyesha kusonga dhidi ya adui. “Akapanda dhidi ya” kinadumisha taswira ya kupanda bila kuficha uhasama wa hatua hiyo.
- source_word: בַּעְשָׁא
  choice: Baasha
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Huu ni uhamishaji wa moja kwa moja wa mfuatano wa nomino unaotaja cheo na eneo la utawala wa Baasha.
- source_word: עַל יְהוּדָה
  choice: dhidi ya Yuda
  rationale: Katika muktadha huu wa kijeshi, עַל lina maana ya uhasama, si mwelekeo wa kawaida tu.
- source_word: וַיִּבֶן אֶת־הָרָמָה
  choice: kuujenga Rama
  rationale: בנה kimsingi ni “kujenga.” Kiambishi “-u-” kinairejelea Rama kama mji. Dhana ya kuimarisha ngome inawezekana kutokana na muktadha, lakini haijaingizwa kimya kimya katika matini kuu.
- source_word: הָרָמָה
  choice: Rama
  rationale: Jina la mahali limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: לְבִלְתִּי תֵּת
  choice: ili asimruhusu
  rationale: Muundo huu unaonyesha kusudi la kuzuia. Tafsiri hii ni ya asili katika Kiswahili na inadumisha wazo la kutoruhusu.
- source_word: יֹצֵא וָבָא
  choice: kutoka wala kuingia
  rationale: Jozi hii ni msemo mpana unaohusu kwenda na kurudi au usafiri kwa jumla. “Wala” linafaa chini ya ukanushi wa kitenzi “asimruhusu.”
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: kwa Asa, mfalme wa Yuda
  rationale: Kihusishi לְ kinaonyesha uhusiano wa mwendo na Asa. “Kwa Asa” kinahifadhi uwezekano wa kuelekea kwake au kuhusiana naye bila kuongeza wazi maneno yasiyokuwapo katika Kiebrania.
