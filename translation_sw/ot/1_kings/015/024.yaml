base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/024.yaml
  text: And Asa slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoshaphat his son reigned in his place.
translation:
  language: sw
  text: Asa akalala pamoja na baba zake, akazikwa pamoja na baba zake katika Mji wa Daudi, baba yake.[a][b] Yehoshafati mwanawe akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na mababu zake.” Kiebrania kinasema kihalisi “pamoja na baba zake,” ambayo ni fomula ya kawaida ya kifalme kuhusu kifo na maziko.
    reason: lexical_alternative
  - marker: b
    text: “Baba yake” hapa humrejelea Daudi kama babu wa Asa katika ukoo wa kifalme, si mzazi wake wa moja kwa moja.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Huhifadhi nahau ya Kiebrania ya kifalme inayomaanisha kufa, badala ya kuibapa kwa kusema tu ‘akafa’.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Hufuata kwa karibu fomula ya Kiebrania na kuhifadhi maana ya ukoo; tanbihi inaeleza kuwa hapa ni mababu.
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Hutoa kwa njia ya kawaida ya Kiswahili maana tendwa ya umbo la Kiebrania.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: katika Mji wa Daudi, baba yake
  rationale: Huhifadhi muundo na uhusiano wa kidinastia wa Kiebrania; tanbihi inaondoa uwezekano wa kudhani Daudi alikuwa mzazi wake wa moja kwa moja.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Ni usemi mfupi na wa kawaida kwa taarifa ya kurithi ufalme.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Huonyesha kwamba Yehoshafati alimrithi Asa katika nafasi ya kifalme, si tu kwamba alitawala baada yake kwa wakati.
