  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau ya kifalme ‘akalala pamoja na baba zake’ imehifadhiwa, huku tanbihi zikifafanua maana yake. Mpangilio wa viashiria [a][b] umewekwa baada ya kirai kinachohitaji maelezo.
