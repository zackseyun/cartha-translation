source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אָ֠סָא אֶת כָּל הַ/כֶּ֨סֶף וְ/הַ/זָּהָ֜ב הַֽ/נּוֹתָרִ֣ים בְּ/אוֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית מלך וַֽ/יִּתְּנֵ֖/ם בְּ/יַד עֲבָדָ֑י/ו וַ/יִּשְׁלָחֵ֞/ם הַ/מֶּ֣לֶךְ אָסָ֗א אֶל בֶּן הֲ֠דַד בֶּן טַבְרִמֹּ֤ן בֶּן חֶזְיוֹן֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יֹּשֵׁ֥ב בְּ/דַמֶּ֖שֶׂק לֵ/אמֹֽר־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/018.yaml
  text: Then Asa took all the silver and the gold that remained in the treasuries of the house of Yahweh and in the treasuries of the king’s house[a], and put them into the hand of his servants. Then King Asa sent them to Ben-hadad son of Tabrimmon, son of Hezion, king of Aram, who lived in Damascus, saying[b],
translation:
  language: sw
  text: 'Kisha Asa akachukua fedha yote na dhahabu yote iliyobaki katika hazina za nyumba ya Yahwe na katika hazina za nyumba ya mfalme[a], akazikabidhi kwa watumishi wake. Kisha Mfalme Asa akazipeleka kwa Ben-Hadadi, mwana wa Tabrimoni, mwana wa Hezioni, mfalme wa Aramu[c], aliyekaa Dameski, akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jumba la mfalme.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania “Aramu”; kwa kawaida pia huitwa “Siria.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kisha Asa akachukua
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “kisha” na “akachukua” ni Kiswahili cha kawaida kinachohifadhi maana ya לקח.
- source_word: כָּל הַכֶּסֶף וְהַזָּהָב הַנּוֹתָרִים
  choice: fedha yote na dhahabu yote iliyokuwa imebaki
  rationale: “Yote” huhifadhi msisitizo wa כָּל kwa kila aina ya thamani, na “iliyokuwa imebaki” huonyesha hali ya masalio iliyomo katika participle הַנּוֹתָרִים.
- source_word: בְּאֹצְרוֹת בֵּית יְהוָה
  choice: katika hazina za nyumba ya Yahwe
  rationale: אֹצְרוֹת hapa ni mahali pa kuhifadhi mali ya thamani; “hazina” ni ya asili katika muktadha huu. “Nyumba ya Yahwe” humaanisha hekalu huku ikihifadhi taswira ya Kiebrania, na jina יהוה limetoholewa kuwa “Yahwe.”
- source_word: וְאֶת אֹצְרוֹת בֵּית מלך
  choice: na katika hazina za nyumba ya mfalme
  rationale: Tafsiri hii inafuata kwa karibu “nyumba ya mfalme” bila kuficha kwamba katika muktadha inaweza kumaanisha jumba la kifalme.
- source_word: וַיִּתְּנֵם בְּיַד עֲבָדָיו
  choice: akavitia mikononi mwa watumishi wake
  rationale: Kirai cha Kiebrania “katika mkono wa” huonyesha kukabidhi au kuweka chini ya mamlaka ya mtu. Wingi “mikononi” ni wa asili kwa Kiswahili kwa watumishi wengi, na “watumishi” inafaa kwa עֲבָדִים katika mazingira haya.
- source_word: וַיִּשְׁלָחֵם
  choice: akawatuma
  rationale: Kiambishi cha Kiebrania kinaweza kurejelea watumishi waliotajwa karibuni au vitu vya thamani. Matini kuu inachagua watumishi kama rejeleo la karibu zaidi, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: בֶּן הֲדַד בֶּן טַבְרִמֹּן בֶּן חֶזְיוֹן
  choice: Ben-hadadi mwana wa Tabrimoni, mwana wa Hezioni
  rationale: Majina yametoholewa kwa umbo linaloweza kutamkwa kwa urahisi katika Kiswahili, na nasaba yote imehifadhiwa.
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: “Aramu” huhifadhi jina la kihistoria na kijiografia la Kiebrania badala ya kulibadilisha kuwa jina la baadaye “Siria.”
- source_word: הַיֹּשֵׁב בְּדַמֶּשֶׂק
  choice: aliyekaa Dameski
  rationale: Participle ya ישב hapa inaonyesha makao au ukaaji; “aliyekaa Dameski” ni fupi, ya kawaida, na yenye hadhi.
- source_word: לֵאמֹר
  choice: 'akisema:'
  rationale: Neno hili linaanzisha maneno ya moja kwa moja yanayofuata katika mstari unaofuata; alama ya nukta mbili huonyesha kazi hiyo kwa uwazi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania ina jina binafsi יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uwasilishaji wa אֲרָם
  choice: Aramu
  alternative: Siria
  rationale: “Aramu” ndilo jina la kihistoria katika matini ya Kiebrania; “Siria” ni jina la kawaida la baadaye na lingehamisha mazingira ya kihistoria.
- issue: Rejeleo la kiambishi katika וַיִּשְׁלָחֵם
  choice: Watumishi ndio waliotumwa
  alternative: Fedha na dhahabu ndivyo vilivyotumwa
  rationale: Watumishi ndio nomino hai ya karibu zaidi na wanaweza kutumwa kwa mfalme mwingine, lakini sarufi ya Kiebrania haiondoi kabisa uwezekano kwamba kiambishi kinarejelea fedha na dhahabu. Tanbihi inalinda utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi na hadhi ya maandiko bila miundo mizito isiyo ya kawaida. Majina yametoholewa kwa maumbo ya kawaida ya Kiswahili. Matini kuu hutumia “nyumba ya mfalme” kwa ulinganifu na Kiebrania, huku tanbihi ikifafanua maana ya “jumba.”
