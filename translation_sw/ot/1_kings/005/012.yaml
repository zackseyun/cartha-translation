  text: He spoke three thousand proverbs[a], and his songs were one thousand and five.
translation:
  language: sw
  text: Alinena methali elfu tatu[a], na nyimbo zake zilikuwa elfu moja na tano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “misemo elfu tatu” au “mifano elfu tatu”; neno la Kiebrania מָשָׁל lina maana pana kuliko “methali” pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alinena
  rationale: Kitenzi דבר katika piel humaanisha kusema au kutangaza. “Alinena” ni lugha ya heshima na ya sasa inayodokeza usemi bila kuongeza wazo la kuandika au kutunga, ambalo halijaelezwa wazi katika Kiebrania.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: elfu tatu
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kutaja idadi 3,000.
- source_word: מָשָׁל
  choice: methali
  rationale: Ingawa neno la Kiebrania lina umbo la umoja baada ya idadi, hapa linatumika kwa vitu vinavyohesabika. “Methali” linafaa zaidi katika muktadha wa hekima ya Sulemani, huku tanbihi ikihifadhi maana pana ya neno hilo.
- source_word: וַיְהִי
  choice: zilikuwa
  rationale: Katika kauli hii ya idadi, היה inaonyesha jumla. “Zilikuwa” ni Kiswahili cha kawaida kinachopatana na nomino “nyimbo.”
- source_word: שִׁירוֹ
  choice: nyimbo zake
  rationale: Ingawa שִׁיר ni umoja wenye kiambishi cha umilikaji, idadi inayofuata inaonyesha matumizi ya kijumla; Kiswahili hutumia wingi “nyimbo zake.”
- source_word: חֲמִשָּׁה וָאָלֶף
  choice: elfu moja na tano
  rationale: Kiebrania kinasema kihalisi “tano na elfu.” Mpangilio wa kawaida wa Kiswahili ni “elfu moja na tano,” unaohifadhi idadi kamili ya 1,005.
theological_decisions: []
