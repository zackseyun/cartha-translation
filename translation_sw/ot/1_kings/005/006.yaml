  text: And Solomon had forty thousand stalls of horses for his chariots[a], and twelve thousand horsemen.
translation:
  language: sw
  text: Naye Sulemani alikuwa na hori[a] elfu arobaini za farasi wa magari yake ya vita, na wapanda farasi elfu kumi na mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mazizi.” Neno la Kiebrania kwa usahihi zaidi linarejelea sehemu ambazo farasi hukaa au kulishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: Naye Sulemani alikuwa na
  rationale: Muundo wa Kiebrania ויהי ל unaonyesha umiliki au kuwa na kitu. Kiswahili cha kawaida huueleza kwa kitenzi “alikuwa na,” huku “Naye” kikidumisha uhusiano wa simulizi.
- source_word: אַרְבָּעִים אֶלֶף
  choice: elfu arobaini
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya idadi hiyo katika Kiswahili.
- source_word: אֻרְוֺת
  choice: hori
  rationale: Neno hili linarejelea sehemu za farasi kukaa au kulishia. “Hori” ni neno fupi na linaloeleweka, ingawa “mazizi” ni mbadala mpana zaidi; tofauti hiyo imeonyeshwa katika tanbihi.
- source_word: סוּסִים
  choice: za farasi
  rationale: Hii ndiyo tafsiri ya kawaida ya wingi wa סוּס, na kiunganishi “za” kinaonyesha kuwa hori hizo zilikuwa za farasi.
- source_word: לְמֶרְכָּבוֹ
  choice: kwa ajili ya magari yake ya vita
  rationale: Umoja wenye kiambishi cha umilikaji umetumiwa kwa maana ya jumla kuhusu magari ya Sulemani. “Magari ya vita” hutofautisha magari ya kukokotwa ya kijeshi na magari ya kisasa.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף
  choice: na ... elfu kumi na mbili
  rationale: Ni namna ya kawaida ya Kiswahili ya kutaja idadi hiyo huku kiunganishi “na” kikihifadhi muundo wa sentensi ya Kiebrania.
- source_word: פָּרָשִׁים
  choice: wapanda farasi
  rationale: Kwa kawaida neno hili humaanisha watu wanaopanda farasi. Tafsiri hii ni ya moja kwa moja kuliko “waendesha magari ya vita,” ambayo haihitajiki na leksimu yenyewe.
