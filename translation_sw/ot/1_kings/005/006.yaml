  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Magari ya vita” limetumiwa ili kuonyesha kwamba מדובר magari ya kukokotwa ya kijeshi, si magari ya kisasa.
