base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/021.yaml
  text: And when Hiram heard the words of Solomon, he rejoiced greatly and said, “Blessed be the LORD today, who has given David a wise son over this great people.”
translation:
  language: sw
  text: Ikawa, Hiramu aliposikia maneno ya Sulemani, alifurahi sana, akasema, “Abarikiwe BWANA leo, ambaye amempa Daudi mwana mwenye hekima juu ya watu hawa wengi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Abarikiwe
  rationale: Huhifadhi maana ya baraka/sifa inayoelekezwa kwa Mungu kwa mtindo wa kibiblia unaoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: BWANA
  rationale: Huwakilisha jina la agano la Mungu kwa desturi iliyozoeleka katika Biblia za Kiswahili, bila kuingiza matamshi yenye ubishi.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni tafsiri ya moja kwa moja ya kielezi cha wakati na huhifadhi msisitizo wake katika tamko la Hiramu.
- source_word: בֵּן חָכָם
  choice: mwana mwenye hekima
  rationale: Hutoa kwa uwazi sifa ya mwana kama ilivyo katika Kiebrania.
- source_word: עַל הָעָם הָרָב הַזֶּה
  choice: awatawale watu hawa wengi
  rationale: Kihusishi ‘juu ya’ katika muktadha huu kinaonyesha mamlaka ya kifalme; kitenzi ‘awatawale’ hufanya uhusiano huo kuwa wa kawaida katika Kiswahili, huku ‘watu hawa wengi’ kikihifadhi wazo la umati mkubwa.
theological_decisions:
- issue: Kauli ya kumbariki Mungu
  choice: Abarikiwe BWANA
  alternative: Asifiwe BWANA
  rationale: ‘Abarikiwe’ hudumisha istilahi ya Kiebrania בָּרוּךְ na mtindo wake wa kitheolojia badala ya kuibadilisha kuwa sifa pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na mtiririko wa simulizi la kibiblia. Muundo ‘Ikawa ...’ umetumiwa kuhifadhi mpito wa kisimulizi wa וַיְהִי bila kufanya sentensi kuwa nzito.
