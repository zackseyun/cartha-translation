  text: ten fattened cattle[a], and twenty pasture-fed cattle, and a hundred sheep[c][b], besides deer and gazelles and roebucks and fattened fowl.
translation:
  language: sw
  text: ng’ombe kumi wanono, ng’ombe ishirini wa malishoni, na kondoo mia moja[a], bila kuhesabu kulungu, swala, kulungu wa aina isiyojulikana kwa uhakika[b], na ndege walionenepeshwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania צֹאן linaweza kumaanisha kwa upana mifugo midogo, yaani kondoo na mbuzi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania יַחְמוּר humaanisha mnyama wa porini wa jamii ya kulungu, lakini utambulisho wake kamili haujulikani kwa uhakika; huenda akawa kulungu mdogo au kulungu wa mbugani.
    reason: lexical_alternative
  - marker: c
    text: Au “bukini walionenepeshwa”; aina kamili ya ndege inayomaanishwa na בַרְבֻּרִים haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָקָר בְּרִאִים
  choice: ng’ombe wanono
  rationale: בָקָר ni nomino ya jumla ya ng’ombe, na בְּרִאִים hapa inaeleza wanyama wanono au waliolishwa vizuri. “Ng’ombe wanono” ni lugha ya kawaida na haiongezi kwa lazima wazo la tendo la kuwanenepesha.
- source_word: בָּקָר רְעִי
  choice: ng’ombe wa malishoni
  rationale: רְעִי inahusiana na kuchungwa au kula malishoni. Usemi huu wa asili unatofautisha ng’ombe hao na wale wanono waliotajwa kwanza.
- source_word: צֹאן
  choice: kondoo
  rationale: צֹאן inaweza kumaanisha kwa upana mifugo midogo, yaani kondoo na mbuzi, lakini “kondoo” ni tafsiri fupi na ya kawaida katika orodha hii; upana wa neno umehifadhiwa katika tanbihi.
- source_word: לְבַד
  choice: mbali na
  rationale: Hutambulisha vitu vya ziada visivyohesabiwa katika orodha kuu. “Mbali na” ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: אַיָּל
  choice: kulungu
  rationale: Neno hili humaanisha mnyama wa jamii ya kulungu, nyakati nyingine hasa dume. “Kulungu” ni jina la jumla linaloeleweka bila kuweka usahihi usiohitajika hapa.
- source_word: צְבִי
  choice: swala
  rationale: צְבִי kwa kawaida humaanisha swala. Kiswahili hutumia umbo lilelile “swala” katika muktadha huu wa orodha.
- source_word: יַחְמוּר
  choice: kulungu wadogo
  rationale: Utambulisho halisi wa mnyama huyu haujulikani kwa uhakika. “Kulungu wadogo” huwakilisha kwa lugha inayoeleweka pendekezo la roe deer/roebucks bila kudai spishi kwa uhakika; tanbihi inaonyesha uwezekano mwingine.
- source_word: בַרְבֻּרִים אֲבוּסִים
  choice: ndege walionenepeshwa
  rationale: בַרְבֻּרִים ni aina ya ndege isiyotambulika kwa uhakika, na אֲבוּסִים huonyesha kulishwa au kunenepeshwa. Tafsiri hii huhifadhi maana ya jumla bila kutaja spishi kwa uhakika.
