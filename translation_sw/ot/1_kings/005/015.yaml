  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa, na wenye heshima. Sentensi mbili zimetumiwa ili kuepuka mfululizo mzito wa vishazi vya sababu huku maana ya Kiebrania ikihifadhiwa.
