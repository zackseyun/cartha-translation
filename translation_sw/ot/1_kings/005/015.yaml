base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/015.yaml
  text: Then Hiram king of Tyre sent his servants to Solomon[a], because he had heard that they had anointed him king in place of his father, for Hiram had always loved David.
translation:
  language: sw
  text: Basi Hiramu, mfalme wa Tiro, akawatuma watumishi wake kwa Sulemani, kwa sababu alikuwa amesikia kwamba walikuwa wamemtia mafuta awe mfalme badala ya baba yake. Kwa maana Hiramu alikuwa akimpenda Daudi siku zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana Hiramu alikuwa rafiki wa Daudi siku zote.” Kiebrania kinasema kihalisi, “Kwa maana Hiramu alikuwa akimpenda Daudi siku zote,” kikionyesha uhusiano mwema uliodumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akawatuma
  rationale: Kitenzi cha masimulizi kinaendeleza tukio; “akawatuma” ni Kiswahili cha kawaida na huonyesha kuwa aliwatuma watumishi wake.
- source_word: חִירָם
  choice: Hiramu
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: מֶלֶךְ צֹר
  choice: mfalme wa Tiro
  rationale: Muundo huu unatambulisha cheo cha Hiramu na ufalme alioutawala kwa Kiswahili cha kawaida.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Neno la Kiebrania linaweza kumaanisha watumishi, maafisa, au watu walio chini ya mamlaka yake. “Watumishi wake” linahifadhi upana huo bila kudai kwa lazima kwamba walikuwa watumwa au maafisa pekee.
- source_word: אֶל שְׁלֹמֹה
  choice: kwa Sulemani
  rationale: Kihusishi kinaonyesha walikoelekezwa; hakuna kusudi la ziada linaloongezwa.
- source_word: כִּי שָׁמַע
  choice: kwa sababu alikuwa amesikia
  rationale: כִּי hapa linatoa sababu ya Hiramu kuwatuma watumishi, na “alikuwa amesikia” linaonyesha kwamba kusikia kulitangulia kutuma.
- source_word: מָשְׁחוּ לְמֶלֶךְ
  choice: walikuwa wamemtia mafuta awe mfalme
  rationale: Katika muktadha wa kifalme, kitendo hiki ni kumweka au kumthibitisha mtu kuwa mfalme kwa kumtia mafuta. Tafsiri inahifadhi tendo lenyewe na kusudi lake.
- source_word: תַּחַת אָבִיהוּ
  choice: mahali pa baba yake
  rationale: תַּחַת hapa linaonyesha kwamba Sulemani alichukua nafasi ya baba yake katika mfululizo wa kifalme.
- source_word: כִּי אֹהֵב הָיָה חִירָם לְדָוִד
  choice: Hiramu alikuwa akimpenda Daudi
  rationale: Muundo wa Kiebrania unaonyesha hali au uhusiano uliodumu. “Alikuwa akimpenda” huhifadhi joto la neno “kupenda” bila kulipunguza kuwa muungano wa kisiasa tu.
- source_word: כָּל הַיָּמִים
  choice: siku zote
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha mwendelezo wa uhusiano huo kwa muda wote unaokusudiwa.
