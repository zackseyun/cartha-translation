base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/022.yaml
  text: Then Hiram sent to Solomon[a], saying, “I have heard what you sent to me[b]. I will do all your desire concerning cedar timber and cypress timber.”
translation:
  language: sw
  text: Kisha Hiramu akatuma kwa Sulemani, akisema, “Nimesikia uliyotuma kwangu[a]. Nitafanya yote unayotaka kuhusu mbao za mierezi na mbao za miberoshi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uliyoniomba.” Kiebrania kinasema kihalisi “uliyotuma kwangu,” ambayo huenda ikamaanisha ujumbe wa Sulemani wenye ombi lake.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: בְּרוֹשִׁים (beroshim); spishi hususa ya mti haijulikani kwa uhakika. Neno hili pia limetafsiriwa “mivinje” au “mifiri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח חִירָם אֶל שְׁלֹמֹה
  choice: Kisha Hiramu akamtumia Sulemani ujumbe
  rationale: Waw-consecutive inaendeleza simulizi, hivyo ‘Kisha’ ni ya asili katika Kiswahili. Kitenzi ‘akamtumia ... ujumbe’ kinaeleza tendo la kutuma kwa ufasaha bila kubainisha bila msingi kama waliotumwa walikuwa watu gani.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hii ni njia ya kawaida na ya heshima ya kuanzisha maneno ya moja kwa moja katika Kiswahili.
- source_word: שָׁמַעְתִּי
  choice: Nimesikia
  rationale: Kauli ya wakati timilifu inaonyesha tendo lililokamilika lenye matokeo katika jibu la sasa la Hiramu.
- source_word: אֵת אֲשֶׁר שָׁלַחְתָּ אֵלָי
  choice: uliyotuma kwangu
  rationale: Inahifadhi usemi mpana wa Kiebrania bila kuufasiri moja kwa moja kuwa ombi, ingawa muktadha unaweza kuonyesha hivyo.
- source_word: אֶעֱשֶׂה אֶת כָּל חֶפְצְךָ
  choice: Nitafanya yote unayotaka
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inadumisha ahadi pana ya Hiramu bila kuibana kuwa utoaji pekee.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: kuhusu mbao za mierezi
  rationale: Kihusishi kinaonyesha jambo ambalo matakwa hayo yanahusu; ‘mbao’ linafaa kwa muktadha wa vifaa vya ujenzi.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: na mbao za miberoshi
  rationale: ‘Miberoshi’ ni tafsiri ya kawaida ya neno hili la mti, huku kutokuwa na uhakika kuhusu spishi kukihifadhiwa katika tanbihi.
