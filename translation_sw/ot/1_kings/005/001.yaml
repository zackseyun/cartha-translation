source:
  edition: WLC
  text: וּ/שְׁלֹמֹ֗ה הָיָ֤ה מוֹשֵׁל֙ בְּ/כָל הַ/מַּמְלָכ֔וֹת מִן הַ/נָּהָר֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/עַ֖ד גְּב֣וּל מִצְרָ֑יִם מַגִּשִׁ֥ים מִנְחָ֛ה וְ/עֹבְדִ֥ים אֶת שְׁלֹמֹ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/001.yaml
  text: And Solomon was ruling over all the kingdoms from the River to the land of the Philistines and as far as the border of Egypt[b][a]. They were bringing tribute and serving Solomon all the days of his life.
translation:
  language: sw
  text: Naye Sulemani alikuwa akitawala falme zote kuanzia Mto[a] ule hadi nchi ya Wafilisti, na hadi mpaka wa Misri. Walikuwa wakileta ushuru[b] na kumtumikia Sulemani siku zote za maisha yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Mto Frati.
    reason: cross_reference
  - marker: b
    text: Au “zawadi.” Neno la Kiebrania minḥah linaweza kumaanisha zawadi, sadaka, au ushuru; hapa mazingira ya kisiasa yanaunga mkono “ushuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: alikuwa akitawala
  rationale: Muundo wa kishirikishi pamoja na הָיָה unaonyesha hali au tendo lililoendelea wakati uliopita; “alikuwa akitawala” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: בְּכָל הַמַּמְלָכוֹת
  choice: falme zote
  rationale: Kihusishi pamoja na משל huonyesha mamlaka juu ya falme kadhaa; kitenzi “kutawala” tayari hubeba maana ya “juu ya,” hivyo Kiswahili hakihitaji kihusishi kingine.
- source_word: מִן הַנָּהָר
  choice: kuanzia ule Mto
  rationale: Katika muktadha huu wa kijiografia, “Mto” ni jina la kawaida linalorejelea Frati. “Ule Mto” hudumisha usemi wa Kiebrania huku tanbihi ikiutambulisha wazi.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: nchi ya Wafilisti
  rationale: Hii ni tafsiri wazi na ya moja kwa moja ya muundo wa Kiebrania, inayotambulika kwa wasomaji wa Kiswahili.
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: na mpaka kwenye mpaka wa Misri
  rationale: Usemi huu unaonyesha kikomo cha eneo; urudiaji wa “mpaka” ni wa kawaida vya kutosha na huhifadhi tofauti kati ya kihusishi cha upeo na nomino “mpaka.”
- source_word: מַגִּשִׁים מִנְחָה
  choice: wakileta ushuru
  rationale: מִנְחָה linaweza kumaanisha zawadi, sadaka, au ushuru. Katika mazingira ya falme zilizo chini ya Sulemani, “ushuru” linafaa zaidi, huku tanbihi ikihifadhi uwezekano wa “zawadi.”
- source_word: וְעֹבְדִים אֶת שְׁלֹמֹה
  choice: kumtumikia Sulemani
  rationale: עבד ikiwa na mtu kama yambwa huonyesha huduma kwa mwenye mamlaka. “Kumtumikia” hudumisha maana ya utii wa kisiasa bila kuongeza wazo la kazi ya kulazimishwa.
- source_word: כָּל יְמֵי חַיָּיו
  choice: siku zote za maisha yake
  rationale: Huu ni usemi wa Kiebrania unaomaanisha kipindi chote cha maisha; tafsiri hii ni rasmi, wazi, na ya asili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa eneo umetafsiriwa kama masafa kutoka Mto Frati kuelekea nchi ya Wafilisti hadi mpaka wa Misri, na hali endelevu ya utawala imehifadhiwa kwa “alikuwa akitawala.”
