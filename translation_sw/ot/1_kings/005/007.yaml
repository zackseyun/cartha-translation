base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/007.yaml
  text: These deputies provided for King Solomon and for all who came near the table of King Solomon[a], each in his month[b]; they lacked nothing.
translation:
  language: sw
  text: Maafisa hawa[a] walimpatia Mfalme Sulemani na wote waliokaribia meza ya Mfalme Sulemani[b] mahitaji yote, kila mmoja katika mwezi wake; hawakupungukiwa na kitu chochote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watawala” au “wasimamizi.” Neno la Kiebrania hurejelea maafisa waliowekwa kusimamia wilaya.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya moja kwa moja, “wote wanaokaribia meza ya Mfalme Sulemani.” Usemi huu hurejelea wale waliokuwa na nafasi ya kufika kwenye meza ya kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלְכְּלוּ
  choice: walimpatia ... mahitaji yake
  rationale: Kitenzi katika piel kina maana ya kumpatia mtu mahitaji au kumtunza kwa kumpa vifaa na chakula. Kauli hii ni ya kawaida katika Kiswahili na haibainishi kupita kiasi namna mahitaji hayo yalivyotolewa.
- source_word: הַנִּצָּבִים
  choice: watawala
  rationale: Katika mfumo wa utawala wa Sulemani, neno hili linamaanisha maafisa waliowekwa kusimamia maeneo. “Watawala” linaeleweka kwa urahisi na linaonyesha mamlaka yao ya uwakilishi; tanbihi inahifadhi uwezekano wa “maafisa” au “wasimamizi.”
- source_word: הָאֵלֶּה
  choice: hawa
  rationale: Ni kiwakilishi kionyeshi kinachowarejelea watawala waliotajwa.
- source_word: אֶת הַמֶּלֶךְ שְׁלֹמֹה
  choice: Mfalme Sulemani
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kutafsiri jina lililo katika apposition na cheo cha mfalme.
- source_word: וְאֵת כָּל הַקָּרֵב אֶל שֻׁלְחַן הַמֶּלֶךְ שְׁלֹמֹה
  choice: pamoja na wote walioikaribia meza ya Mfalme Sulemani
  rationale: Tafsiri hii inahifadhi taswira ya Kiebrania ya “kuikaribia meza,” huku muktadha ukidokeza watu waliokuwa na nafasi ya kula au kuhudumiwa katika meza ya kifalme.
- source_word: אִישׁ חָדְשׁוֹ
  choice: kila mmoja katika mwezi wake
  rationale: Usemi huu wa kugawa wajibu unaonyesha kwamba kila mtawala alikuwa na mwezi wake katika zamu ya kutoa mahitaji.
- source_word: לֹא יְעַדְּרוּ דָּבָר
  choice: hawakuacha chochote kikosekane
  rationale: 'Kauli hii inaonyesha matokeo ya kazi ya watawala: hakuna kitu kilichohitajika kilichoachwa kikosekane. Pia inadumisha wahusika hao kuwa kiima cha kitenzi.'
