translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi taswira ya meza ya kifalme na zamu ya kila mwezi bila kuingiza ufafanuzi wa kimadhehebu.
