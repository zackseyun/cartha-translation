reference: 1 Kings 5:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִנְ/נִ֣י אֹמֵ֔ר לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑/י כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֗ה אֶל דָּוִ֤ד אָבִ/י֙ לֵ/אמֹ֔ר בִּנְ/ךָ֗ אֲשֶׁ֨ר אֶתֵּ֤ן תַּחְתֶּ֨י/ךָ֙ עַל כִּסְאֶ֔/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/019.yaml
  text: And behold[a], I intend to build a house for the name of Yahweh my God, just as Yahweh spoke to David my father, saying, ‘Your son, whom I will set in your place on your throne[c][b], he will build the house for my name.’
translation:
  language: sw
  text: 'Na tazama, nimeazimia kujenga nyumba[a] kwa ajili ya jina la Yahwe Mungu wangu,[b] kama vile Yahwe alivyomwambia Daudi baba yangu: “Mwana wako, nitakayemweka mahali pako juu ya kiti chako cha ufalme,[c] ndiye atakayeijenga nyumba kwa ajili ya jina langu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kujenga hekalu”; Kiebrania kihalisi ni “kujenga nyumba.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “kwa ajili ya jina la Yahwe Mungu wangu” yanahifadhi kauli ya Kiebrania kuhusu hekalu, yaani nyumba iliyowekwa wakfu kwa jina na uwepo wa Yahwe.
    reason: cultural_note
  - marker: c
    text: Au “nitakayemteua baada yako”; Kiebrania kihalisi ni “nitakayemweka/nitakayemtoa mahali pako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְנִי אֹמֵר
  choice: Na tazama, nimeazimia
  rationale: Kiashiria cha kuvuta fikira הִנְנִי kimehifadhiwa kwa ‘tazama,’ huku אֹמֵר pamoja na kitenzi-jina kinapoonyesha kusudi thabiti, si kusema tu.
- source_word: לִבְנוֹת בַּיִת
  choice: kujenga nyumba
  rationale: בַּיִת maana yake ya moja kwa moja ni ‘nyumba.’ Ingawa hapa inarejelea hekalu, ‘nyumba’ huhifadhi taswira na mwangwi wa kitheolojia wa Kiebrania.
- source_word: לְשֵׁם יְהוָה אֱלֹהָי
  choice: kwa ajili ya jina la Yahwe Mungu wangu
  rationale: Huhifadhi kauli maalumu ya hekalu ‘kwa ajili ya jina la,’ badala ya kuifafanua tu kuwa kumheshimu Mungu.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: kama vile ... alivyomwambia
  rationale: Huwasilisha ulinganifu kati ya azimio la Solomoni na ahadi ya awali ya Yahwe kwa lugha ya kawaida ya Kiswahili.
- source_word: אֶל דָּוִד אָבִי
  choice: Daudi baba yangu
  rationale: Mpangilio huu unafuata Kiebrania na bado unasikika kwa kawaida na kwa heshima katika Kiswahili.
- source_word: אֲשֶׁר אֶתֵּן תַּחְתֶּיךָ
  choice: nitakayemweka mahali pako
  rationale: אֶתֵּן hapa ina wazo la kumweka au kumteua mrithi, na תַּחְתֶּיךָ linaonyesha kuchukua mahali pa Daudi.
- source_word: עַל כִּסְאֶךָ
  choice: juu ya kiti chako cha ufalme
  rationale: ‘Kiti cha ufalme’ ni usemi wazi wa Kiswahili kwa kiti cha mfalme na huhifadhi picha ya urithi wa kifalme.
- source_word: הוּא יִבְנֶה
  choice: ndiye atakayeijenga
  rationale: ‘Ndiye’ huhifadhi msisitizo wa kiwakilishi הוּא kwamba mwana huyo hasa ndiye mjenzi aliyechaguliwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la agano יְהוָה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya nyumba kujengwa ‘kwa ajili ya jina’ la Yahwe
  choice: Kuhifadhi usemi ‘kwa ajili ya jina la Yahwe’
  alternative: kujenga hekalu la kumheshimu Yahwe
  rationale: Tafsiri hii haipunguzi ‘jina’ kuwa heshima pekee, bali huhifadhi mvutano wa kitheolojia unaohusisha wakfu wa nyumba kwa jina na uwepo wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazama’ huhifadhi ishara ya usemi wa Kiebrania bila kufanya sentensi kuwa nzito; ‘nimeazimia’ huonyesha kusudi thabiti. ‘Nyumba’ imehifadhiwa katika matini, huku tanbihi ikifafanua kuwa inarejelea hekalu.
