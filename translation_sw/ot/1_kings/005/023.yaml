  text: עֲ֠בָדַ/י יֹרִ֨דוּ מִן הַ/לְּבָנ֜וֹן יָ֗מָּ/ה וַ֠/אֲנִי אֲשִׂימֵ֨/ם דֹּבְר֤וֹת בַּ/יָּם֙ עַֽד הַ/מָּק֞וֹם אֲשֶׁר תִּשְׁלַ֥ח אֵלַ֛/י וְ/נִפַּצְתִּ֥י/ם שָׁ֖ם וְ/אַתָּ֣ה תִשָּׂ֑א וְ/אַתָּה֙ תַּעֲשֶׂ֣ה אֶת חֶפְצִ֔/י לָ/תֵ֖ת לֶ֥חֶם בֵּיתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/023.yaml
  text: My servants will bring them down from Lebanon to the sea[a], and I will make them into rafts on the sea to the place that you direct me, and I will break them apart there, and you will carry them away[b]. And you shall do what I desire by giving food for my household.
translation:
  language: sw
  text: Watumishi wangu watayateremsha kutoka Lebanoni hadi baharini, nami nitayafunga pamoja kuwa mafungu ya magogo yatakayoelea baharini[a] mpaka mahali utakaponielekeza. Nitayafungua huko, nawe utayachukua. Nawe utanifanyia ninachotaka kwa kuwapa watu wa nyumba yangu chakula.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, magogo yaliyofungwa pamoja ili yaelee na kusafirishwa baharini.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “mkate kwa ajili ya nyumba yangu”; hapa “mkate” yaelekea unamaanisha chakula au mahitaji ya watu wa nyumba ya kifalme ya Hiramu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדַי
  choice: watumishi wangu
  rationale: Katika muktadha huu wa kifalme na kiutawala, neno hili linawahusu watu wanaomtumikia Hiramu; “watumishi” ni la kawaida na halidai bila msingi kwamba walikuwa watumwa.
- source_word: יֹרִדוּ
  choice: watayateremsha
  rationale: Umbo la kisababishi la ירד linaonyesha kuyafanya magogo yashuke kutoka Lebanoni kuelekea baharini.
- source_word: יָמָּה
  choice: hadi baharini
  rationale: Neno linaweza kumaanisha “kuelekea baharini” au “kuelekea magharibi”; hapa usafirishaji wa mbao unaonyesha kwamba bahari ndiyo kituo kinachokusudiwa.
- source_word: אֲשִׂימֵם דֹּבְרוֹת
  choice: nitayafunga kuwa mafu ya magogo
  rationale: Kirai hiki kinaeleza kuyaweka au kuyafanya magogo kuwa mafungu yanayoelea kwa ajili ya usafiri wa baharini; “mafu ya magogo” linaweka wazi umbo na kusudi lake.
- source_word: בַּיָּם
  choice: baharini
  rationale: Huwakilisha mahali ambapo mafu hayo yanaelea na kusafirishwa.
- source_word: עַד הַמָּקוֹם אֲשֶׁר תִּשְׁלַח אֵלַי
  choice: mpaka mahali utakaponielekeza
  rationale: שׁלח hapa huenda inahusu kutuma maelekezo au ujumbe kuhusu kituo; tafsiri hii inatoa maana ya kiutendaji bila kuongeza habari zisizokuwapo.
- source_word: וְנִפַּצְתִּים
  choice: nitayafungua
  rationale: Katika muktadha wa magogo yaliyofungwa pamoja, kitenzi kinachomaanisha kuvunja, kutawanya, au kutenganisha kinaeleza kufungua mafu hayo kwenye kituo.
- source_word: תִשָּׂא
  choice: utayachukua
  rationale: נשא lina maana pana ya kuinua, kubeba, au kuchukua; baada ya mafu kufunguliwa, “utayachukua” ni ya kawaida na halibainishi kupita kiasi namna ya usafiri.
- source_word: חֶפְצִי
  choice: ninachotaka
  rationale: Huhifadhi maana ya tamaa, mapenzi, au matakwa ya Hiramu kwa lugha ya kawaida.
- source_word: לָתֵת לֶחֶם בֵּיתִי
  choice: kwa kuwapa watu wa nyumbani mwangu chakula
  rationale: “Mkate” hapa yaelekea umetumiwa kwa maana pana ya chakula au mahitaji ya watu wa nyumba ya kifalme; “watu wa nyumbani mwangu” linaonyesha kwamba בֵּיתִי inahusu kaya ya Hiramu.
