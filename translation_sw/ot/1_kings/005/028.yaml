base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/028.yaml
  text: He sent them to Lebanon[a], ten thousand a month in shifts; they would be in Lebanon one month and two months at home[c][b], and Adoniram was over the forced labor.
translation:
  language: sw
  text: Aliwatuma Lebanoni kwa zamu[a], elfu kumi kila mwezi. Wangekaa Lebanoni mwezi mmoja na miezi miwili nyumbani kwao[b]. Naye Adoniramu alikuwa msimamizi wa kazi ya kulazimishwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa vikundi vilivyopokezana.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “nyumbani kwake”; maana ni kwamba kila mfanyakazi alikaa nyumbani miezi miwili kati ya vipindi vya mwezi mmoja huko Lebanoni.
    reason: lexical_alternative
  - marker: c
    text: Au, “ushuru wa kazi”; neno la Kiebrania linamaanisha kazi ya lazima iliyodaiwa na serikali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: Aliwatuma
  rationale: Kitenzi pamoja na kiambishi cha nafsi ya tatu wingi humaanisha moja kwa moja kwamba aliwatuma; tafsiri hii ni ya kawaida na inahifadhi tendo la simulizi.
- source_word: לְבָנוֹנָה
  choice: Lebanoni
  rationale: Kiishio cha mwelekeo katika Kiebrania kinaonyesha kwenda Lebanoni; Kiswahili cha kawaida hutumia jina la mahali moja kwa moja baada ya ‘kutuma’.
- source_word: עֲשֶׂרֶת אֲלָפִים בַּחֹדֶשׁ
  choice: elfu kumi kila mwezi
  rationale: 'Kirai kina maana ya mgawanyo: watu elfu kumi kwa kila mwezi. ‘Kila mwezi’ ni wazi na cha kawaida.'
- source_word: חֲלִיפוֹת
  choice: kwa zamu
  rationale: Nomino hii huonyesha kupokezana au mfuatano wa vikundi; ‘kwa zamu’ inaeleza mfumo huo kwa Kiswahili cha sasa.
- source_word: חֹדֶשׁ יִהְיוּ בַלְּבָנוֹן
  choice: Wangekaa Lebanoni mwezi mmoja
  rationale: Mwezi mmoja uliotajwa kwa kulinganisha na miezi miwili nyumbani unaonyesha muda wa kila kipindi cha kazi.
- source_word: שְׁנַיִם חֳדָשִׁים בְּבֵיתוֹ
  choice: na miezi miwili nyumbani kwao
  rationale: Kiebrania husema kihalisi ‘nyumbani kwake’ kwa umoja wa kimkusanyiko; ‘nyumbani kwao’ huwasilisha kwa kawaida kwamba kila mfanyakazi alirudi nyumbani kwake.
- source_word: וַאֲדֹנִירָם
  choice: Adoniramu
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: עַל הַמַּס
  choice: ndiye aliyesimamia kazi ya kulazimishwa
  rationale: מַס hapa ni huduma ya kazi iliyodaiwa kwa lazima na mamlaka ya serikali; usemi huu haupunguzi maana yake ya kulazimisha.
