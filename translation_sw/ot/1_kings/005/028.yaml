translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. ‘Kwa zamu’ na ‘nyumbani kwao’ ni misemo ya kawaida kwa wasomaji wa sasa, huku tanbihi zikihifadhi muundo wa karibu zaidi na Kiebrania. Sentensi zimegawanywa ili orodha ya mzunguko wa kazi isomeke kwa urahisi.
