translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘alikuwa akimpa’ unahifadhi hali ya tendo linaloendelea, na ‘kadiri ya yote aliyotaka’ ni wa asili zaidi kuliko tafsiri sisisi ‘sawasawa na tamaa yake yote.’
