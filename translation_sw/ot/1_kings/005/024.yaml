    rationale: Misunobari kwa kawaida hurejelea pine. Kwa kuwa utambulisho wa beroshim unabishaniwa, tafsiri kuu iwe ‘miberoshi’ (cypress), na mbadala za juniper/fir zihifadhiwe kwenye tanbihi.
