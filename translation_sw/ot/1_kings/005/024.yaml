  yaml_path: translation/ot/1_kings/005/024.yaml
  text: And Hiram was giving Solomon cedar timber and cypress timber[a], according to all his desire.
translation:
  language: sw
  text: Naye Hiramu alikuwa akimpa Sulemani mbao za mierezi na mbao za miberoshi[a], kadiri ya yote aliyotaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbao za mivinje” au, kama ilivyotafsiriwa kimapokeo, “mbao za misunobari”; haijulikani kwa hakika neno la Kiebrania beroshim linamaanisha aina gani ya mti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Naye ... alikuwa
  rationale: Muundo huu unaendeleza simulizi kwa Kiswahili cha kawaida na, pamoja na kitenzi kinachofuata, unahifadhi hali ya tendo lililoendelea katika wakati uliopita.
- source_word: חִירוֹם
  choice: Hiramu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: נֹתֵן
  choice: akimpa
  rationale: Kauli ya hali ya kuendelea baada ya וַיְהִי inaonyesha utoaji uliokuwa ukiendelea au uliofanywa kwa kawaida; ‘alikuwa akimpa’ hudumisha maana hiyo kuliko ‘alimpa’.
- source_word: לִשְׁלֹמֹה
  choice: Sulemani
  rationale: Kiambishi cha yambwa katika ‘akimpa’ kinawasilisha לְ, huku Sulemani akiwa mpokeaji wa mbao.
- source_word: עֲצֵי אֲרָזִים
  choice: mbao za mierezi
  rationale: Katika muktadha wa vifaa vya ujenzi, עֵץ inaelekea kumaanisha mbao badala ya miti iliyo hai; ‘mierezi’ ni jina la kawaida la cedar.
- source_word: וַעֲצֵי בְרוֹשִׁים
  choice: na mbao za misunobari
  rationale: בְּרוֹשִׁים ni aina ya miti ya kijani kibichi mwaka mzima iliyotumiwa katika ujenzi. ‘Misunobari’ ni tafsiri inayoeleweka, huku tanbihi ikihifadhi kutokuwa na uhakika kuhusu spishi hususa.
- source_word: כָּל חֶפְצוֹ
  choice: kadiri ya yote aliyotaka
  rationale: Hii inaonyesha kiwango kizima cha alichotaka Sulemani kwa Kiswahili cha asili, bila kubadili kishazi hicho kuwa dai mahsusi zaidi kuhusu ombi.
