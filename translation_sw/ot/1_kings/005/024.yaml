  verdict: revise
  source_fidelity: Kifungu kinahifadhi vizuri muundo wa tendo endelevu (וַיְהִי ... נֹתֵן), mpokeaji, na upeo wa matakwa ya Sulemani. Hata hivyo, neno kuu la mti בְּרוֹשִׁים limewasilishwa kama ‘misunobari,’ ambalo kwa matumizi ya kawaida ya Kiswahili humaanisha pine na si chaguo linalolingana vyema na ‘cypress’ ya audit trail. Kutokuwa na uhakika wa spishi kunapaswa kubaki katika tanbihi.
  naturalness: ‘Naye Hiramu alikuwa akimpa Sulemani...’ ni Kiswahili Sanifu cha asili na kinachosomeka vizuri. ‘Kadiri ya yote aliyotaka’ pia ni sahihi na huhifadhi maana ya kulingana na matakwa yake.
  terminology: ‘Mbao za mierezi’ ni sahihi katika muktadha wa vifaa vya ujenzi. Kwa בְּרוֹשִׁים, ‘mbao za miberoshi’ ni chaguo bora la msingi kwa ‘cypress timber’; ‘mbao za mivinje’ na ‘mbao za misunobari’ zinaweza kubaki kama mbadala katika tanbihi, bila kudai utambulisho wa spishi kwa hakika.
  issues:
