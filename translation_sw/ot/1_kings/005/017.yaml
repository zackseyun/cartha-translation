base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/017.yaml
  text: You know that David my father could not build a house for the name of Yahweh his God because of the warfare that surrounded him[a], until Yahweh put them under the soles of his feet.
translation:
  language: sw
  text: Wewe unajua kwamba Daudi, baba yangu, hakuweza kujenga nyumba kwa ajili ya jina la Yahwe, Mungu wake, kwa sababu ya vita vilivyomzunguka, mpaka Yahwe alipowaweka chini ya nyayo za miguu ya Daudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chini ya miguu ya Daudi.” Kiebrania kinasema kwa ukamilifu zaidi, “chini ya nyayo za miguu ya Daudi,” picha inayoonyesha kutiishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה יָדַעְתָּ
  choice: Wewe unajua
  rationale: Kauli hii ya moja kwa moja ina maana ya sasa katika muktadha huu. Kiwakilishi “Wewe” kinahifadhi msisitizo wa kiwakilishi cha Kiebrania.
- source_word: בַּיִת
  choice: nyumba
  rationale: Neno la Kiebrania linamaanisha “nyumba” na hapa linarejelea hekalu lililokusudiwa kujengwa; “nyumba” inahifadhi namna ya usemi wa chanzo bila kulitafsiri mapema kuwa “hekalu.”
- source_word: לְשֵׁם יְהוָה אֱלֹהָיו
  choice: kwa ajili ya jina la Yahwe, Mungu wake
  rationale: Hii inahifadhi nahau ya agano “kwa ajili ya jina la” badala ya kuibadili kuwa tafsiri pana kama “kwa heshima ya.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: מִפְּנֵי הַמִּלְחָמָה אֲשֶׁר סְבָבֻהוּ
  choice: kwa sababu ya vita vilivyomzunguka
  rationale: “Vita” linafaa kwa hali ya mapambano ya muda mrefu, na “vilivyomzunguka” linahifadhi picha ya Daudi kuzingirwa na migogoro hiyo.
- source_word: עַד תֵּת יְהוָה אֹתָם
  choice: mpaka Yahwe alipowaweka
  rationale: Kitenzi נתן pamoja na msemo wa kuwa chini ya miguu kinaonyesha kutiishwa. Kiwakilishi cha yambwa kinahifadhi rejeo lisilotajwa wazi kabisa katika mstari, ingawa muktadha unaelekeza kwa maadui wa Daudi.
- source_word: תַּחַת כַּפּוֹת רַגְלוֹ
  choice: chini ya nyayo za miguu yake
  rationale: “Nyayo za miguu” linahifadhi picha kamili ya Kiebrania ya ushindi na kutiishwa, badala ya kuifupisha kuwa “chini ya miguu yake.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Rejeo la kiwakilishi katika “alipowaweka”
  choice: Kudumisha kiwakilishi bila kutaja “maadui” moja kwa moja
  alternative: mpaka Yahwe alipowatia maadui zake chini ya nyayo za miguu yake
  rationale: Muktadha unaonyesha kutiishwa kwa maadui wa Daudi, lakini neno “maadui” halipo wazi katika mstari huu. Kiwakilishi kinadumisha ufupi na kiasi cha utata wa chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo “kujenga nyumba kwa ajili ya jina la Yahwe” umehifadhiwa kwa sababu ni nahau muhimu ya chanzo, ingawa si usemi wa kawaida wa kila siku.
