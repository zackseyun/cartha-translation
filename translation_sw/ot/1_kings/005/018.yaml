  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הֵנִ֨יחַ יְהוָ֧ה אֱלֹהַ֛/י לִ֖/י מִ/סָּבִ֑יב אֵ֣ין שָׂטָ֔ן וְ/אֵ֖ין פֶּ֥גַע רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/018.yaml
  text: But now Yahweh my God has given me rest on every side[b][a]; there is neither adversary nor evil occurrence.
translation:
  language: sw
  text: Lakini sasa Yahwe, Mungu wangu, amenipa pumziko pande zote; hakuna mpinzani[a] wala tukio baya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “adui.” Neno la Kiebrania hapa ni nomino ya kawaida, si lazima jina maalumu “Shetani.”
    reason: lexical_alternative
  - marker: b
    text: Au “msiba,” “balaa,” au “maafa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Lakini sasa
  rationale: Inaonyesha badiliko lenye utofautishaji kutoka hali za awali kwenda hali ya sasa.
- source_word: הֵנִיחַ ... לִי
  choice: amenipa pumziko
  rationale: Muundo wa Hiphil wa נוח una maana ya kusababisha au kutoa pumziko; Kiswahili hiki ni cha kawaida na kinahifadhi maana ya kisababishi pamoja na mnufaika.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano la Mungu kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Linawasilisha moja kwa moja muundo wa umilikishi wa Kiebrania.
- source_word: מִסָּבִיב
  choice: pande zote
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kutokuwapo kwa vitisho kutoka maeneo yote yanayozunguka.
- source_word: אֵין שָׂטָן
  choice: hakuna mpinzani
  rationale: שָׂטָן hapa ni nomino ya kawaida inayomaanisha mtu anayepinga au adui, si lazima jina maalumu Shetani.
- source_word: וְאֵין פֶּגַע רָע
  choice: wala tukio baya
  rationale: Linahifadhi upana wa kirai cha Kiebrania kuhusu jambo lenye madhara bila kukifunga kwa msiba wa aina moja.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja jina la Mungu; kulihifadhi huepuka kulibadilisha kuwa cheo.
- issue: Iwapo שָׂטָן ni jina maalumu la Shetani
  choice: mpinzani, kama nomino ya kawaida
  alternative: Shetani
  rationale: Muktadha unahusu amani ya kisiasa na kutokuwapo kwa upinzani; kutafsiri kama jina maalumu kungeingiza maana ambayo mstari haulazimishi.
- issue: Upana wa maana ya פֶּגַע רָע
  choice: tukio baya
  alternative: msiba
  rationale: Kirai kinaweza kumaanisha tukio lenye madhara, balaa, au msiba; tafsiri pana inahifadhi utata wake wa kimsamiati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa wasomaji wa kawaida huku ikihifadhi muundo wa ukanushi maradufu na upana wa maana ya maneno ya Kiebrania.
