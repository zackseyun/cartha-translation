base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/004.yaml
  text: For he was ruling over all the region beyond the River[a], from Tiphsah to Gaza, over all the kings beyond the River[b]; and he had peace on all sides around him.
translation:
  language: sw
  text: Kwa maana alikuwa akitawala eneo lote ng’ambo ya Mto[a], kuanzia Tifsa[b] hadi Gaza, juu ya wafalme wote waliokuwa ng’ambo ya Mto; naye alikuwa na amani pande zote zilizomzunguka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Mto Frati.
    reason: cultural_note
  - marker: b
    text: Tifsa pia huandikwa Tiphsah.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹדֶה
  choice: alikuwa akitawala
  rationale: Kitenzi katika umbo la participle kinaonyesha utawala uliokuwa ukiendelea; ‘alikuwa akitawala’ huhifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: בְּכָל עֵבֶר הַנָּהָר
  choice: eneo lote ng’ambo ya Mto
  rationale: Kirai hiki ni usemi wa kijiografia unaorejelea nchi iliyo upande mwingine wa Frati. Neno ‘eneo’ linafanya maana ya kimkoa iwe wazi bila kubadili usemi wa chanzo.
- source_word: הַנָּהָר
  choice: Mto
  rationale: Kiebrania kinasema kihalisi ‘Mto,’ jina la kawaida lililotumiwa kumaanisha Mto Frati; ufafanuzi umewekwa katika tanbihi.
- source_word: מִתִּפְסַח וְעַד עַזָּה
  choice: kuanzia Tifsa hadi Gaza
  rationale: Kirai kinaonyesha mipaka ya eneo lililotawaliwa. ‘Tifsa’ ni unukuzi unaofaa katika Kiswahili wa jina תפסח.
- source_word: בְּכָל מַלְכֵי עֵבֶר הַנָּהָר
  choice: na wafalme wote waliokuwa ng’ambo ya Mto
  rationale: Muundo huu unaendeleza kitenzi ‘alitawala’ na unaonyesha mamlaka yake juu ya wafalme wa eneo hilo.
- source_word: וְשָׁלוֹם הָיָה לוֹ
  choice: naye alikuwa na amani
  rationale: Hapa שָׁלוֹם inaonyesha amani na usalama wa kisiasa; ‘alikuwa na amani’ ni usemi wa kawaida usioongeza ufafanuzi usiotajwa.
- source_word: מִכָּל עֲבָרָיו מִסָּבִיב
  choice: pande zote zilizomzunguka
  rationale: Tafsiri hii huwasilisha wazo la amani kutoka kila upande unaomzunguka bila kulazimisha neno hilo kumaanisha hasa majirani au mipaka.
