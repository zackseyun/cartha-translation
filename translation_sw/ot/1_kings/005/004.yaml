  source_fidelity: Tafsiri huhifadhi vyema utawala unaoendelea, eneo lililo ng’ambo ya Mto, mpaka wa Tifsa hadi Gaza, na amani iliyomzunguka Sulemani. Hata hivyo, kirai “na wafalme wote” hakionyeshi wazi mamlaka juu ya wafalme hao, ilhali Kiebrania hurudia kihusishi cha ‘juu ya/katika mamlaka juu ya.’
  naturalness: Kiswahili ni sanifu na kinaeleweka. Kuongeza “juu ya” kabla ya “wafalme wote” kunafanya uhusiano wa kisarufi na kisemantiki uwe wazi na wa kawaida.
  terminology: “Mto” pamoja na tanbihi ya “Mto Frati” ni mwafaka kwa הַנָּהָר. “Tifsa,” “Gaza,” “amani,” na “alitawala”/“akitawala” zinafaa. Tanbihi ya Tifsa inarekebishwa ili itoe tu tahajia mbadala bila dai lisilo la lazima kuhusu tafsiri.
