base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/011.yaml
  text: He was wiser than every man—than Ethan the Ezrahite[a], and Heman, Kalkol, and Darda[c][b], the sons of Mahol—and his name was in all the surrounding nations.
translation:
  language: sw
  text: Alikuwa na hekima kuliko kila mtu[a]—kuliko Ethani Mwezrahi[b], na Hemani, Kalkoli na Darda, wana wa Maholi—nalo jina lake likajulikana katika mataifa yote ya jirani.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuliko wanadamu wote.” Neno la Kiebrania אָדָם linaweza kumaanisha mtu au wanadamu kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: “Mwezrahi” huenda ni jina la ukoo au la kundi fulani; wengine hulihusianisha na “Mzera.”
    reason: lexical_alternative
  - marker: c
    text: Au, “sifa zake zilienea katika mataifa yote ya jirani.” Kihalisi, “jina lake likawa katika mataifa yote ya jirani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחְכַּם
  choice: Alikuwa na hekima kuliko
  rationale: Kitenzi חכם pamoja na kihusishi cha ulinganisho מִן kinaonyesha kwamba alizidi wengine kwa hekima, si tu kwamba alianza kuwa na hekima.
- source_word: מִכָּל הָאָדָם
  choice: kuliko kila mtu
  rationale: אָדָם inaweza kumaanisha mtu mmoja kwa ujumla au wanadamu wote. Katika ulinganisho huu unaofuatwa na majina ya watu wenye hekima, “kila mtu” ni Kiswahili cha kawaida kinachohifadhi upana unaowezekana bila kulazimisha jinsia katika lugha lengwa.
- source_word: מֵאֵיתָן הָאֶזְרָחִי
  choice: kuliko Ethani Mwezrahi
  rationale: Majina na jina la ukoo au kundi yametoholewa kwa namna inayofaa Kiswahili. “Mwezrahi” huepuka kuamua bila ushahidi wa kutosha kwamba maana yake ni “Mzراhi” au “mzaliwa wa nchi.”
- source_word: וְהֵימָן וְכַלְכֹּל וְדַרְדַּע
  choice: na Hemani, Kalkoli na Darda
  rationale: Majina ya watu yametoholewa kwa mfumo wa sauti unaosomeka kwa urahisi katika Kiswahili huku yakibaki karibu na Kiebrania.
- source_word: בְּנֵי מָחוֹל
  choice: wana wa Maholi
  rationale: 'Muundo huu kwa kawaida ni wa ukoo: “wana wa Maholi.” Maana inayohusishwa na kucheza haijalazimishwa katika orodha hii ya majina.'
- source_word: וַיְהִי שְׁמוֹ
  choice: nalo jina lake likajulikana
  rationale: Kiebrania kinasema kihalisi “jina lake likawa,” nahau inayodokeza kujulikana au kuwa na sifa. “Jina lake likajulikana” ni ya asili katika Kiswahili na bado huhifadhi taswira ya jina.
- source_word: בְּכָל הַגּוֹיִם סָבִיב
  choice: katika mataifa yote ya jirani
  rationale: גּוֹיִם ni mataifa au watu wa nchi nyingine, na סָבִיב hapa ni yale yaliyokuwa kandokando; “mataifa yote ya jirani” ni usemi wa kawaida na wazi.
theological_decisions:
- issue: Maana ya אָדָם katika kauli ya ulinganisho
  choice: kila mtu
  alternative: wanadamu wote
  rationale: Kiswahili “mtu” kinaweza kumhusu binadamu bila kubainisha jinsia, huku muktadha ukitaja wanaume mahususi wenye hekima. Hivyo tafsiri haiufungi usemi kwa wanaume pekee wala kuondoa uwezekano wa maana pana.
- issue: Nahau ya “jina” kama sifa au umaarufu
  choice: jina lake likajulikana
  alternative: akawa mashuhuri
  rationale: Chaguo hili linafikisha maana ya sifa iliyoenea bila kuondoa taswira halisi ya Kiebrania kuhusu “jina lake.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa ulinganisho na vistari virefu umehifadhiwa ili orodha ya watu wenye hekima ibaki wazi; nahau isiyo ya kawaida ya Kiebrania imefanywa ya asili bila kufuta taswira yake.
