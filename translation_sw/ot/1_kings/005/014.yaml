base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/014.yaml
  text: And people from all the peoples came to hear the wisdom of Solomon[b][a], from all the kings of the earth who had heard of his wisdom.
translation:
  language: sw
  text: Watu kutoka mataifa yote walikuja kusikia hekima ya Sulemani, kutoka kwa wafalme wote wa dunia waliokuwa wamesikia habari za hekima yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kutoka kwa wafalme wote wa dunia.” Usemi huu uliofinywa unaweza kumaanisha kwamba wageni walitoka kwa wafalme hao au walitumwa nao.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: walikuja
  rationale: Kauli ya wayyiqtol inaendeleza simulizi kwa wakati uliopita; “walikuja” ni ya kawaida na ya moja kwa moja.
- source_word: מִכָּל הָעַמִּים
  choice: kutoka mataifa yote
  rationale: עַמִּים ni wingi na hapa hurejelea makundi ya watu au mataifa; “mataifa” ni Kiswahili cha kawaida katika muktadha wa kimataifa.
- source_word: לִשְׁמֹעַ
  choice: kusikiliza
  rationale: Kitenzi-jina kinaonyesha kusudi la kuja. “Kusikiliza” hudokeza kuja kumsikia Sulemani kwa makusudi, bila kubadili maana ya msingi.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: hekima ya Sulemani
  rationale: Huhifadhi wazi muundo na maana ya kishazi cha Kiebrania.
- source_word: מֵאֵת כָּל מַלְכֵי הָאָרֶץ
  choice: walitumwa na wafalme wote wa dunia
  rationale: Kishazi cha Kiebrania kimebanwa na huonyesha chanzo au uwakilishi; katika Kiswahili, “walitumwa na” huunganisha kwa kawaida wageni na wafalme bila kudai kwamba wafalme wenyewe ndio waliokuja.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת חָכְמָתוֹ
  choice: waliokuwa wamesikia habari za hekima yake
  rationale: “Kusikia habari za” huonyesha kwamba wafalme walipata taarifa kuhusu sifa ya hekima yake, badala ya kuisikia moja kwa moja.
theological_decisions:
- issue: Utambulisho wa waliokuja na uhusiano wao na wafalme
  choice: Watu walikuja, wakiwa wametumwa na wafalme
  alternative: Wafalme wote wa dunia wenyewe walikuja
  rationale: Kiswahili kinaweka wazi uhusiano unaowezekana wa מֵאֵת huku tanbihi ikihifadhi ubanifu wa asili na uwezekano wa tafsiri nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetiririshwa kwa semikoloni ili kuonyesha uhusiano wa kishazi kilichobanwa katika Kiebrania. Alama ya tanbihi [a] ipo katika matini kuu.
