base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/030.yaml
  text: besides Solomon’s chief deputies who were over the work[a], three thousand three hundred[c][b], who ruled over the people doing the work.
translation:
  language: sw
  text: Mbali na maafisa wakuu wa Sulemani waliosimamia kazi hiyo[a], walikuwako elfu tatu na mia tatu waliowatawala[b] watu[c] waliokuwa wakifanya kazi hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maafisa wakuu” au “waangalizi wakuu.” Maneno ya kiutawala ya Kiebrania yanajumuisha dhana za cheo na usimamizi.
    reason: lexical_alternative
  - marker: b
    text: Neno lililotafsiriwa “waliowatawala” linaweza kumaanisha kutumia mamlaka; katika muktadha huu linahusu kuwasimamia wafanyakazi.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema kihalisi “watu”; hapa linarejelea kikosi cha watu waliokuwa wakifanya kazi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: Mbali na
  rationale: Kifungu hiki huongeza kundi jingine lisilohesabiwa katika jumla iliyotangulia; “Mbali na” ni cha kawaida na hudumisha uhusiano huo.
- source_word: שָּׂרֵי הַנִּצָּבִים
  choice: wakuu wa wasimamizi
  rationale: Muungano wa maneno haya unaonyesha cheo cha juu pamoja na jukumu la usimamizi katika utawala wa Sulemani.
- source_word: לִשְׁלֹמֹה
  choice: wa Sulemani
  rationale: Kihusishi cha Kiebrania hapa kinaonyesha uhusiano au umilikaji; muundo huu ni wa asili katika Kiswahili.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  choice: waliokuwa juu ya kazi hiyo
  rationale: Huhifadhi kwa ukaribu taswira ya Kiebrania ya kuwa na mamlaka juu ya kazi huku ikieleweka katika muktadha.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁלֹשׁ מֵאוֹת
  choice: elfu tatu na mia tatu
  rationale: Idadi imetolewa kwa maneno kwa mtindo wa kifasihi na unaosomeka kwa urahisi.
- source_word: הָרֹדִים
  choice: waliowatawala
  rationale: Kitenzi רדה kina maana yenye nguvu ya kutawala au kutumia mamlaka; uchaguzi huu haupunguzi nguvu hiyo, ingawa muktadha ni usimamizi wa wafanyakazi.
- source_word: בָּעָם
  choice: watu
  rationale: Kiebrania kinasema kihalisi “watu”; neno hilo limehifadhiwa, huku tanbihi ikifafanua kuwa hapa linarejelea kikosi cha wafanyakazi.
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: waliokuwa wakifanya kazi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi kinachowatambulisha watu hao kwa kazi waliyokuwa wakifanya.
