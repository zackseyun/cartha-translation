revisions:
- from: Mbali na wakuu wa wasimamizi wa Sulemani waliokuwa juu ya kazi hiyo[a]—watu elfu tatu na mia tatu—waliowatawala[b] watu[c] waliokuwa wakifanya kazi.
  to: Mbali na maafisa wakuu wa Sulemani waliosimamia kazi hiyo[a], walikuwako elfu tatu na mia tatu waliowatawala[b] watu[c] waliokuwa wakifanya kazi hiyo.
  rationale: Revision clarifies that the 3,300 are Solomon’s senior officials, not the labor force, and uses more idiomatic administrative terminology while preserving the Hebrew’s distinction between the officials and the people doing the work.
