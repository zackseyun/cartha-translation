lexical_decisions:
- source_word: וַיַּעַל
  choice: aliwatoza ... kufanya
  rationale: Hifili ya עלה pamoja na מַס ina maana ya kuweka au kuandikisha watu kwa huduma ya lazima; muundo huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: מַס
  choice: kazi ya lazima
  rationale: Katika muktadha wa miradi ya ujenzi ya Sulemani, neno hili linamaanisha huduma ya kazi iliyolazimishwa, si hasa kodi ya fedha.
- source_word: מִכָּל יִשְׂרָאֵל
