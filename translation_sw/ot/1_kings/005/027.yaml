  rationale: Inahifadhi wazo kwamba wafanyakazi walitolewa katika taifa lote la Israeli.
- source_word: וַיְהִי הַמַּס
  choice: nao waliofanya kazi hiyo walikuwa
  rationale: Hueleza kwa Kiswahili cha kawaida idadi ya kundi lililotozwa kazi bila kuufanya mstari usikike kana kwamba kazi yenyewe ndiyo iliyohesabiwa.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: wanaume elfu thelathini
  rationale: אִישׁ hapa huhesabu wafanyakazi wanaume, hivyo tafsiri inahifadhi umahususi wa jinsia na idadi wa chanzo.
