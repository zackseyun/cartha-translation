  text: וְ/עַתָּ֡ה צַוֵּה֩ וְ/יִכְרְתוּ לִ֨/י אֲרָזִ֜ים מִן הַ/לְּבָנ֗וֹן וַֽ/עֲבָדַ/י֙ יִהְי֣וּ עִם עֲבָדֶ֔י/ךָ וּ/שְׂכַ֤ר עֲבָדֶ֨י/ךָ֙ אֶתֵּ֣ן לְ/ךָ֔ כְּ/כֹ֖ל אֲשֶׁ֣ר תֹּאמֵ֑ר כִּ֣י אַתָּ֣ה יָדַ֗עְתָּ כִּ֣י אֵ֥ין בָּ֛/נוּ אִ֛ישׁ יֹדֵ֥עַ לִ/כְרָת עֵצִ֖ים כַּ/צִּדֹנִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/020.yaml
  text: Now command that cedars from Lebanon be cut for me[a], and let my servants be with your servants, and I will give you the wages of your servants according to all that you say[b]; for you know that among us there is no man who knows how to cut timber like the Sidonians.
translation:
  language: sw
  text: “Sasa, amuru wanikatie mierezi kutoka Lebanoni. Watumishi wangu watakuwa pamoja na watumishi wako, nami nitakupa ujira wa watumishi wako kulingana na yote utakayosema. Kwa maana wewe unajua kwamba hakuna mtu miongoni mwetu[a] anayejua kukata miti[b] kama Wasidoni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hakuna mwanamume miongoni mwetu.” Usemi huu unaonyesha kwamba miongoni mwao hakuna yeyote mwenye ustadi unaolingana na huo; si lazima uwe dai la kijamii la kuwatenga wanawake.'
    reason: lexical_alternative
  - marker: b
    text: Au, “kukata mbao.” Kiebrania kinasema kihalisi “kukata miti,” lakini muktadha unahusu kuvuna miti kwa ajili ya mbao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Ni kiashiria cha mpito kinachoanzisha ombi; ‘Basi sasa’ ni cha kawaida katika Kiswahili na kinahifadhi uhusiano na yaliyotangulia.
- source_word: צַוֵּה וְיִכְרְתוּ לִי
  choice: amuru wanikatie
  rationale: ‘Amuru’ linahifadhi nguvu ya agizo la kifalme, na ‘wanikatie’ linaonyesha kusudi la agizo na kwamba ukataji unafanywa kwa ajili ya Sulemani.
- source_word: אֲרָזִים מִן הַלְּבָנוֹן
  choice: mierezi kutoka Lebanoni
  rationale: ‘Mierezi’ ni jina la kawaida la miti hiyo, na ‘kutoka Lebanoni’ linaonyesha chanzo chake.
- source_word: וַעֲבָדַי יִהְיוּ עִם עֲבָדֶיךָ
  choice: Watumishi wangu watakuwa pamoja na watumishi wako
  rationale: ‘Watumishi’ linadumisha istilahi ileile kwa pande zote bila kudokeza kwa lazima hali maalumu ya utumwa; muundo wa wakati ujao unaeleza mpango uliopendekezwa.
- source_word: וּשְׂכַר עֲבָדֶיךָ אֶתֵּן לְךָ
  choice: nami nitakupa ujira wa watumishi wako
  rationale: שׂכר ni malipo ya kazi; ‘ujira’ linaeleza wazi fidia ya kazi bila kuifanya zawadi.
- source_word: כְּכֹל אֲשֶׁר תֹּאמֵר
  choice: kulingana na yote utakayosema
  rationale: Linahifadhi upana wa ‘yote’ na maana ya kukubali masharti yatakayotajwa na Hiramu.
- source_word: אֵין בָּנוּ אִישׁ
  choice: hakuna mtu miongoni mwetu
  rationale: Katika muktadha huu אִישׁ ni usemi wa kukosekana kwa yeyote mwenye ustadi huo; ‘mtu’ ni Kiswahili cha kawaida na hakibadili dai hilo kuwa kauli kuhusu jinsia.
- source_word: יֹדֵעַ לִכְרָת עֵצִים
  choice: anayejua kukata miti
  rationale: Linahifadhi maana ya moja kwa moja ya kukata miti na pia wazo la kuwa na ujuzi wa kufanya hivyo; muktadha unaonyesha uvunaji wa mbao.
- source_word: כַּצִּדֹנִים
  choice: kama Wasidoni
  rationale: Ni ulinganisho wa moja kwa moja na watu wa Sidoni, waliotajwa kwa ustadi wao wa kukata miti.
