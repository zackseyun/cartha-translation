base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/008.yaml
  text: And the barley and the straw for the horses and the steeds were brought to the place where each man was[b][a], according to his duty.
translation:
  language: sw
  text: Nao walileta shayiri na majani makavu kwa ajili ya farasi na wanyama wa kupandwa[a] mpaka mahali ambapo kila mmoja alikuwapo[b], kulingana na wajibu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha wanyama maalumu wa kupandwa, labda farasi bora, nyumbu, au farasi wa magari ya vita.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “kila mtu,” likitumiwa kumaanisha kila mmoja wa watu waliokuwa na jukumu hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׂעֹרִים
  choice: shayiri
  rationale: Neno hilo linamaanisha shayiri iliyotumiwa hapa kama chakula cha wanyama.
- source_word: וְהַתֶּבֶן
  choice: majani makavu
  rationale: Katika muktadha wa malisho, תֶּבֶן ni mabaki makavu ya mimea, hasa majani au mabua; ‘majani makavu’ ni usemi wa kawaida na unaoeleweka kwa wasomaji wengi.
- source_word: לַסּוּסִים
  choice: kwa ajili ya farasi
  rationale: Hii ni tafsiri ya moja kwa moja ya kihusishi na nomino inayotaja farasi.
- source_word: וְלָרָכֶשׁ
  choice: na wanyama wa kupandwa
  rationale: רֶכֶשׁ hutaja wanyama bora au maalumu wa kupandwa katika mazingira ya kifalme; tafsiri hii haibani maana kuwa nyumbu au aina fulani ya farasi.
- source_word: יָבִיאוּ
  choice: walileta
  rationale: Kitenzi cha Kiebrania ni cha kauli tendaji, nafsi ya tatu wingi. Kiswahili kinaweza kuhifadhi watendaji wasiotajwa kwa njia ya kawaida na wazi.
- source_word: אֶל־הַמָּקוֹם
  choice: mpaka mahali
  rationale: Huonyesha mwisho wa safari au uwasilishaji wa vifaa.
- source_word: אֲשֶׁר יִהְיֶה שָּׁם אִישׁ
  choice: ambapo kila mmoja alikuwapo
  rationale: אִישׁ limetumiwa kwa maana ya kugawanya wajibu kwa mtu mmoja mmoja; ‘kila mmoja’ ni ya asili katika Kiswahili na haihitaji kuongeza cheo kisichotajwa.
- source_word: כְּמִשְׁפָּטוֹ
  choice: kulingana na wajibu wake
  rationale: Katika muktadha huu מִשְׁפָּט linaonyesha utaratibu au jukumu lililowekwa, si hukumu ya mahakama.
