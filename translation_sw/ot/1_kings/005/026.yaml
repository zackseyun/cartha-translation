base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/026.yaml
  text: And Yahweh gave wisdom to Solomon[a], just as he had spoken to him. And there was peace between Hiram and Solomon[b], and the two of them made a covenant.
translation:
  language: sw
  text: Yahwe akampa Sulemani hekima, kama alivyomwambia.[a] Kulikuwa na amani kati ya Hiramu na Sulemani, nao wote wawili wakafanya agano.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama alivyomwahidi.” Kitenzi cha Kiebrania kwa maana ya moja kwa moja ni “alisema,” lakini katika muktadha kinaweza kurejelea neno la awali la Yahwe kwa Sulemani.
    reason: alternative_reading
  - marker: b
    text: Kwa maana halisi, Kiebrania kinasema “wakakata agano,” nahau yenye maana ya kufanya agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: נָתַן חָכְמָה
  choice: akampa ... hekima
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la Yahwe kumpa Sulemani hekima.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: kama alivyokuwa amemwambia
  rationale: Inatunza maana ya msingi ya דִּבֶּר, ‘sema/nenea,’ bila kuamua kimya kimya kwamba kila usemi huo ulikuwa ahadi, ingawa muktadha unaruhusu uelewa huo.
- source_word: וַיְהִי שָׁלֹם
  choice: Kulikuwa na amani
  rationale: Ni Kiswahili cha kawaida kinachoeleza mahusiano ya amani katika muktadha huu wa kisiasa.
- source_word: וַיִּכְרְתוּ בְרִית
  choice: wakafanya agano
  rationale: Kiebrania kinasema kwa nahau ‘wakakata agano’; ‘wakafanya agano’ ni Kiswahili cha asili huku kikitunza neno muhimu בְרִית badala ya kulifupisha kuwa mkataba wa kisiasa tu.
- source_word: שְׁנֵיהֶם
  choice: nao wawili
  rationale: Inaonyesha wazi kwamba Hiramu na Sulemani wote wawili walishiriki katika kufanya agano.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: ‘Yahwe’ linawasilisha jina la Mungu lililo katika chanzo bila kulibadilisha kuwa cheo.
- issue: Iwapo בְרִית litafsiriwe kwa lugha ya agano au ya mkataba wa kisiasa
  choice: agano
  alternative: mkataba
  rationale: Ingawa muktadha unahusu uhusiano wa mataifa mawili, chanzo kimetumia neno la kawaida la Kiebrania la ‘agano’; kulitunza huonyesha mwendelezo wa istilahi hiyo katika Maandiko.
- issue: Iwapo דִּבֶּר ifasiriwe wazi kuwa ahadi
  choice: alivyokuwa amemwambia
  alternative: alivyokuwa amemwahidi
  rationale: Kitenzi chenyewe humaanisha ‘alisema/alinena.’ Tafsiri kuu inatunza maana hiyo, huku tanbihi ikionyesha maana inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni nyepesi kwa msomaji wa kawaida; mpangilio wa mawazo, jina la Mungu, lugha ya amani, na istilahi ya agano vimetunzwa. Alama za tanbihi zimewekwa karibu na vifungu vinavyohusika.
