lexical_decisions:
- source_word: וַיְהִי
  choice: kilikuwa
  rationale: Kitenzi hiki kinaendeleza simulizi na kutaja hali iliyokuwapo; Kiswahili cha kawaida hakihitaji kuongeza kiunganishi kama “basi” au “ikawa” hapa.
- source_word: לֶחֶם שְׁלֹמֹה
  choice: Chakula cha Sulemani
  rationale: Ingawa לֶחֶם kimsingi ni “mkate,” katika muktadha huu wa kiasi cha nafaka kwa nyumba ya kifalme humaanisha chakula kwa upana zaidi. Muundo “cha Sulemani” unaonyesha uhusiano wa umilikaji.
- source_word: לְיוֹם אֶחָד
  choice: kwa siku moja
  rationale: Huhifadhi moja kwa moja maana ya kiasi kilichohitajika kwa siku moja.
- source_word: שְׁלֹשִׁים כֹּר
  choice: kori thelathini
  rationale: Jina la kipimo cha kale limeendelezwa kwa unukuzi badala ya kubadilishwa kuwa makadirio ya kipimo cha kisasa.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Hutaja unga uliosagwa vizuri na kuutofautisha na קָמַח.
- source_word: וְשִׁשִּׁים כֹּר
  choice: na kori sitini
  rationale: Kipimo kilekile kimetafsiriwa kwa uthabiti.
- source_word: קָמַח
  choice: unga wa kawaida
  rationale: Huhifadhi tofauti na סֹלֶת, yaani unga laini, kwa lugha inayoeleweka kwa wasomaji wa sasa.
