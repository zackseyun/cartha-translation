base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/005.yaml
  text: And Judah and Israel lived in safety[a], each man under his vine and under his fig tree, from Dan to Beer-sheba[b], all the days of Solomon.
translation:
  language: sw
  text: Yuda na Israeli wakaishi kwa usalama, kila mtu[a] chini ya mzabibu wake na chini ya mtini wake[b], tangu Dani hadi Beer-sheba, siku zote za Sulemani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “kila mwanamume,” kwa kutumia umbo la umoja wa kiume kumaanisha mtu mmoja mmoja.
    reason: lexical_alternative
  - marker: b
    text: “Chini ya mzabibu wake na chini ya mtini wake” ni taswira ya kawaida ya amani, usalama na ustawi katika nchi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: wakaishi
  rationale: Kitenzi kina maana ya kukaa au kuishi; katika muktadha huu kinaonyesha maisha yaliyotulia na ya kudumu. “Wakaishi” ni Kiswahili cha kawaida na huendana na kiima cha pamoja Yuda na Israeli.
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: Yuda na Israeli
  rationale: Majina ya makundi mawili ya kisiasa na ya agano yaliyotajwa katika Kiebrania yamehifadhiwa moja kwa moja.
- source_word: לָבֶטַח
  choice: kwa usalama
  rationale: Neno hili linaonyesha hali ya kutokuwa katika hatari na kuishi kwa utulivu. “Kwa usalama” ni usemi wa asili katika Kiswahili.
- source_word: אִישׁ
  choice: kila mtu
  rationale: Nomino ya Kiebrania iko katika umoja wa kiume lakini imetumiwa kwa maana ya mgawanyo, yaani mtu mmoja mmoja. “Kila mtu” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kudai kuwa wanawake hawakuhusika katika hali iliyoelezwa.
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: chini ya mzabibu wake na chini ya mtini wake
  rationale: Taswira halisi ya Kiebrania imehifadhiwa kwa sababu ni picha ya jadi ya amani, usalama na ustawi katika nchi.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: tangu Dani hadi Beer-sheba
  rationale: Usemi huu unaonyesha eneo lote la nchi kutoka kaskazini hadi kusini. Majina ya mahali yamehifadhiwa kwa namna inayotambulika katika Kiswahili.
- source_word: כֹּל יְמֵי שְׁלֹמֹה
  choice: siku zote za Sulemani
  rationale: Tafsiri hii iliyo karibu na muundo wa Kiebrania inaeleza muda ambao hali hiyo ilidumu, yaani katika siku za utawala wa Sulemani.
theological_decisions:
- issue: Kutafsiri אִישׁ ya umoja wa kiume iliyotumiwa kwa maana ya mgawanyo
  choice: kila mtu
  alternative: kila mwanamume
  rationale: Ingawa umbo la Kiebrania ni la kiume, matumizi yake hapa yanagawa hali hiyo kwa watu mmoja mmoja. “Kila mtu” huhifadhi maana pana ya kiwakilishi bila kuingiza dai lisilo wazi kwamba hali hii iliwahusu wanaume peke yao; tanbihi inaeleza umbo la asili.
- issue: Kushughulikia usemi “chini ya mzabibu wake na chini ya mtini wake”
  choice: Kuhifadhi taswira halisi katika matini kuu
  alternative: kuifafanua kuwa “akiishi kwa amani na ustawi”
  rationale: Taswira hiyo hubeba maana za amani, usalama na ustawi, pamoja na mwangwi wake wa kifasihi. Kuihifadhi huepuka kuifupisha kwa tafsiri moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi ni wa asili, huku majina ya kihistoria na taswira kuu ya Kiebrania vikihifadhiwa.
