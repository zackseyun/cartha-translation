translation:
  language: sw
  text: Solomoni alikuwa na watu elfu sabini waliobeba mizigo, na watu elfu themanini waliokata mawe milimani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waheua mawe milimani.” Kiebrania kinasema kihalisi “wakataji/waheua mlimani,” huenda kikimaanisha wafanyakazi wa machimbo ya mawe katika eneo la milima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: Solomoni alikuwa na
  rationale: Muundo wa Kiebrania היה + ל unaonyesha kuwa na au kuwapo kwa ajili ya mtu. Kiswahili cha kawaida na cha moja kwa moja ni “Solomoni alikuwa na.”
- source_word: שִׁבְעִים אֶלֶף
  choice: watu elfu sabini
  rationale: Idadi imetafsiriwa moja kwa moja; neno “watu” limewekwa wazi kwa sababu muktadha unahesabu wafanyakazi.
- source_word: נֹשֵׂא סַבָּל
  choice: waliobeba mizigo
  rationale: Kirai hiki humaanisha watu waliokuwa na kazi ya kubeba mizigo mizito. Tafsiri hii ni wazi na ya kawaida kuliko nomino nzito kama “wabeba-mizigo.”
- source_word: וּשְׁמֹנִים אֶלֶף
  choice: na watu elfu themanini
  rationale: Idadi imetafsiriwa moja kwa moja, huku “watu” ikirudiwa ili sentensi iwe wazi na ya asili katika Kiswahili.
- source_word: חֹצֵב
  choice: waliochonga mawe
  rationale: Kitenzi חצב humaanisha kukata au kuchonga kitu kigumu, hasa mawe katika muktadha wa ujenzi. Kutaja “mawe” kunaweka wazi kitu kinachodokezwa na muktadha bila kubadili maana.
- source_word: בָּהָר
  choice: milimani
  rationale: Ingawa Kiebrania kina umoja “mlimani,” neno hilo linaweza kutumiwa kwa maana ya eneo la milima. “Milimani” ni Kiswahili cha asili na hudumisha maana ya mahali walikofanyia kazi.
