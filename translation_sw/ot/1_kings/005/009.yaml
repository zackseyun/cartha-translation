  text: וַ/יִּתֵּן֩ אֱלֹהִ֨ים חָכְמָ֧ה לִ/שְׁלֹמֹ֛ה וּ/תְבוּנָ֖ה הַרְבֵּ֣ה מְאֹ֑ד וְ/רֹ֣חַב לֵ֔ב כַּ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֥ת הַ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/009.yaml
  text: And God gave Solomon wisdom and very great understanding[a], and breadth of heart like the sand that is on the seashore.
translation:
  language: sw
  text: Mungu akampa Sulemani hekima na ufahamu mwingi sana, na akili yenye upeo mpana[a] kama mchanga ulio kwenye ufuo wa bahari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “upana wa moyo.” Katika Kiebrania, “moyo” unaweza kumaanisha akili au uwezo wa kuelewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akampa
  rationale: Kitenzi נתן kina maana ya ‘kutoa/kumpa’; ‘akampa’ ni tafsiri ya moja kwa moja na ya kawaida katika simulizi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino ni la wingi, hapa lina maana ya umoja na linamtaja Mungu wa Israeli.
- source_word: חָכְמָה
  choice: hekima
  rationale: ‘Hekima’ ni neno la kawaida la Kiswahili kwa חָכְמָה na linafaa katika muktadha wa Sulemani.
- source_word: לִשְׁלֹמֹה
  choice: Sulemani
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: וּתְבוּנָה
  choice: ufahamu
  rationale: ‘Ufahamu’ huhifadhi maana pana ya kuelewa, kuwa na utambuzi, na kuwa na busara bila kuibana kuwa uwezo mmoja tu.
- source_word: הַרְבֵּה מְאֹד
  choice: mwingi sana
  rationale: Maneno haya yanasisitiza kiwango kikubwa mno; ‘mwingi sana’ ni ya asili na huendana na ‘ufahamu.’
- source_word: וְרֹחַב לֵב
  choice: na akili yenye upeo mpana
  rationale: Kwa Kiebrania, לֵב (‘moyo’) inaweza kumaanisha akili au uwezo wa ndani wa kuelewa. Tafsiri hii huwasilisha maana hiyo kwa Kiswahili cha sasa huku ikihifadhi picha ya upana kupitia ‘upeo mpana.’ Tafsiri halisi imehifadhiwa katika tanbihi.
- source_word: כַּחוֹל
  choice: kama mchanga
  rationale: כְּ huanzisha tashbihi, na ‘kama mchanga’ ni usemi wa kawaida wa Kiswahili.
- source_word: אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: ulio kwenye ufuo wa bahari
  rationale: Hii hutafsiri kishazi cha mahali kwa lugha ya kawaida huku ikihifadhi picha ya mchanga wa pwani.
theological_decisions:
- issue: Nahau ya kianthropolojia וְרֹחַב לֵב
  choice: akili yenye upeo mpana
  alternative: moyo mpana / upana wa moyo
  rationale: Katika matumizi ya Kiebrania, ‘moyo’ unaweza kuwa kitovu cha fikra na ufahamu, si hisia peke yake. ‘Moyo mpana’ katika Kiswahili unaweza kueleweka hasa kama ukarimu au uvumilivu, hivyo ‘akili yenye upeo mpana’ huepuka maana hiyo isiyokusudiwa. Tanbihi huhifadhi umbo halisi na uwezekano wa nahau ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Ufuo wa bahari’ umetumiwa badala ya urudiaji wa kihalisi ‘ukingo wa bahari.’
