  text: Then the king commanded[a], and they quarried great stones, costly stones, cut stones[b], to lay the foundation of the house.
translation:
  language: sw
  text: Ndipo mfalme akaamuru, nao wakachimba mawe makubwa, mawe yenye thamani kubwa, mawe yaliyochongwa[a], ili kuweka msingi wa nyumba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mawe yaliyokatwa” au “mawe yaliyokatwa na kusawazishwa.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, hekalu; Kiebrania kinasema “nyumba.”
    reason: cross_reference
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Ndipo mfalme akaamuru
  rationale: Muundo wa masimulizi unaonyesha tendo linalofuata; “ndipo ... akaamuru” ni wa asili katika Kiswahili na huhifadhi mfuatano wa simulizi.
- source_word: וַיַּסִּעוּ
  choice: wakachimba
  rationale: Katika muktadha wa ujenzi, kitenzi hiki kinaelekea kumaanisha kuyatoa mawe mahali yalipokuwa, yaani kuyachimba machimboni. Tafsiri hii inaeleza tendo kwa ufupi bila kuingiza wazo la kuyasafirisha lisilo wazi.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: mawe makubwa
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na yenye kufaa kwa mawe ya msingi.
- source_word: אֲבָנִים יְקָרוֹת
  choice: mawe yenye thamani kubwa
  rationale: יקר hapa huonyesha ubora au gharama kubwa ya vifaa vya ujenzi, si vito; usemi huu huepuka kueleweka kana kwamba ni mawe ya vito.
- source_word: לְיַסֵּד
  choice: ili kuweka msingi
  rationale: Kiswahili cha kawaida hutumia “kuweka msingi” kueleza kuanzisha msingi wa jengo.
- source_word: הַבָּיִת
  choice: nyumba
  rationale: Huhifadhi neno halisi la Kiebrania, ingawa katika muktadha nyumba hiyo ni hekalu.
- source_word: אַבְנֵי גָזִית
  choice: mawe yaliyochongwa
  rationale: גזית hurejelea mawe yaliyokatwa na kutengenezwa kwa ajili ya ujenzi. “Yaliyochongwa” ni usemi mfupi na unaoeleweka; kirai kimewekwa kama ufafanuzi wa mawe yaliyotajwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya “mawe” yamehifadhiwa ili kuakisi msisitizo wa Kiebrania, huku “yaani” kikionyesha kwamba “mawe yaliyochongwa” yanafafanua mawe hayo hayo badala ya kutaja kundi tofauti.
