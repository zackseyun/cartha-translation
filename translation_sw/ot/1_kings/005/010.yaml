  text: וַ/תֵּ֨רֶב֙ חָכְמַ֣ת שְׁלֹמֹ֔ה מֵֽ/חָכְמַ֖ת כָּל בְּנֵי קֶ֑דֶם וּ/מִ/כֹּ֖ל חָכְמַ֥ת מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/010.yaml
  text: And Solomon’s wisdom surpassed the wisdom of all the people of the east and all the wisdom of Egypt[a].
translation:
  language: sw
  text: Hekima ya Sulemani ilizidi hekima ya watu wote wa mashariki[a] na hekima yote ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “wana wa mashariki,” usemi wa kijiografia unaomaanisha watu wa mashariki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶב
  choice: ilizidi
  rationale: Kitenzi רבה pamoja na מן ya ulinganisho hapa kinaonyesha kuwa hekima ya Sulemani ilikuwa kubwa kuliko ya wengine; “ilizidi” ni Kiswahili cha kawaida na wazi.
- source_word: חָכְמַת
  choice: hekima
  rationale: Nomino חָכְמָה inayorudiwa inahusu kwa upana hekima, maarifa, na uwezo wa kufikiri; “hekima” ndiyo tafsiri ya kawaida na inayofaa katika muktadha.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Umbo la kawaida la jina hili katika Biblia ya Kiswahili.
- source_word: כָּל
  choice: wote / yote
  rationale: Hifadhi maana jumuishi ya neno la Kiebrania, huku upatanisho wa kisarufi wa Kiswahili ukitofautisha “watu wote” na “hekima yote.”
- source_word: בְּנֵי קֶדֶם
  choice: watu wa mashariki
  rationale: Kifungu hiki, kihalisi “wana wa mashariki,” ni usemi wa kijiografia unaowataja watu wa maeneo ya mashariki. “Watu wa mashariki” ni cha asili na kinachoeleweka katika Kiswahili, huku tanbihi ikihifadhi umbo halisi.
- source_word: וּמִכֹּל חָכְמַת מִצְרָיִם
  choice: na hekima yote ya Misri
  rationale: Kifungu cha pili cha ulinganisho kinategemea kitenzi kilekile. Kiswahili hakihitaji kurudia “ilizidi,” na mpangilio huu huhifadhi nguvu ya כֹּל.
- source_word: מִצְרָיִם
  choice: Misri
  rationale: Jina la kawaida la nchi hii katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Tafsiri imetanguliza ulinganifu bora, ikihifadhi maana ya ulinganisho na kuweka usemi halisi wa Kiebrania katika tanbihi.
