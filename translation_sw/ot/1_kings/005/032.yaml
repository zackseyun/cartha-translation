review_pass:
  verdict: revise
  source_fidelity: The three coordinated groups, the two actions, the materials, and the purpose are retained. However, "wakakata" is less precise for פסל when applied jointly to timber and stone; the verb denotes hewing/shaping worked construction materials.
  naturalness: The draft is clear Standard East African Swahili. "Wakachonga" is more idiomatic and accurate for shaping both wood and stone, and "ili kujenga" is a more direct rendering of the Hebrew purpose infinitive than "kwa ajili ya kujenga."
  terminology: Sulemani, Hiramu, Gebali, mbao, mawe, nyumba, and BWANA are appropriate. The ethnic footnote should not unnecessarily narrow the Gebalites to "wafanyakazi," since the source identifies a people/group; their construction role is supplied by the verse context.
  issues:
  - severity: low
    issue: '"wakakata" understates the shaping/hewing sense of וַיִּפְסְלוּ.'
    rationale: The action concerns both timber and stones. "Wakachonga" naturally conveys working/shaping either material without restricting the action to cutting.
  - severity: low
    issue: Footnote a calls the Gebalites "wafanyakazi."
    rationale: The Hebrew uses an ethnic designation, "the Gebalites," rather than the lexical term for workers. "Watu kutoka Gebali" preserves that designation while remaining clear.
  revised_text: Hivyo wajenzi wa Sulemani, wajenzi wa Hiramu, na watu wa Gebali[a] wakachonga na kuandaa mbao na mawe ili kujenga nyumba[b].
