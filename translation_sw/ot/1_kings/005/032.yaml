id: 1KI.5.32
reference: 1 Kings 5:32
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יִּפְסְל֞וּ בֹּנֵ֧י שְׁלֹמֹ֛ה וּ/בֹנֵ֥י חִיר֖וֹם וְ/הַ/גִּבְלִ֑ים וַ/יָּכִ֛ינוּ הָ/עֵצִ֥ים וְ/הָ/אֲבָנִ֖ים לִ/בְנ֥וֹת הַ/בָּֽיִת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/032.yaml
  text: So Solomon’s builders[a], Hiram’s builders[b], and the men of Gebal cut and prepared the timber and the stones to build the house.
translation:
  language: sw
  text: Hivyo wajenzi wa Sulemani, wajenzi wa Hiramu, na watu wa Gebali[a] wakachonga na kuandaa mbao na mawe ili kujenga nyumba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wagebali” au “Wagibli,” yaani watu kutoka Gebali (Byblos).
    reason: lexical_alternative
  - marker: b
    text: Yaani, nyumba ya BWANA, hekalu.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּפְסְלוּ
  choice: wakakata
  rationale: Kitenzi פסל hapa humaanisha kukata au kuchonga vifaa vya ujenzi. “Wakakata” ni Kiswahili cha kawaida kinachoweza kutumiwa kwa mbao na mawe bila kuibana maana kwa uchimbaji wa mawe pekee.
- source_word: בֹּנֵי שְׁלֹמֹה
  choice: wajenzi wa Sulemani
  rationale: Ingawa muundo wake ni “wajenzi wa Sulemani,” maana yake ni wafanyakazi wake wa ujenzi. Tafsiri hii ni wazi na inadumisha maana ya kazi inayofanywa.
- source_word: וּבֹנֵי חִירוֹם
  choice: wajenzi wa Hiramu
  rationale: Tafsiri inayolingana na “wajenzi wa Sulemani” inadumisha usambamba wa Kiebrania.
- source_word: וְהַגִּבְלִים
  choice: watu wa Gebali
  rationale: Jina hili la watu humaanisha watu waliotoka Gebali (Byblos). “Watu wa Gebali” linaeleweka kwa urahisi kuliko kutumia jina la kabila lisilozoeleka.
- source_word: וַיָּכִינוּ
  choice: kuandaa
  rationale: Katika Hiphil, כון humaanisha kuandaa au kufanya kitu kiwe tayari; “kuandaa” linafaa katika muktadha wa vifaa vya ujenzi.
- source_word: הָעֵצִים
  choice: mbao
  rationale: Katika muktadha wa ujenzi, “mbao” ni mahsusi na ya kawaida zaidi kuliko “miti” au “kuni.”
- source_word: וְהָאֲבָנִים
  choice: mawe
  rationale: Kiebrania kinasema tu “mawe”; tafsiri haiongezi wazo la matofali au vipande maalumu vya mawe.
- source_word: לִבְנוֹת הַבָּיִת
  choice: kwa ajili ya kujenga nyumba
  rationale: “Nyumba” inadumisha neno la Kiebrania בַּיִת na sitiari yake ya hekalu, huku tanbihi ikifafanua kinachorejelewa.
theological_decisions:
- issue: Maana ya “nyumba” katika muktadha huu
  choice: nyumba
  alternative: hekalu
  rationale: Muktadha unaonyesha kwamba nyumba hiyo ni nyumba ya BWANA, yaani hekalu, lakini maandishi ya Kiebrania yanasema “nyumba.” Tafsiri inadumisha usemi huo na kutoa ufafanuzi katika tanbihi badala ya kubadilisha neno kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “wakakata na kuandaa” ni wa kawaida na unaonyesha hatua mbili za kazi, huku urudiaji wa “wajenzi” ukidumisha usambamba wa maandishi ya Kiebrania.
