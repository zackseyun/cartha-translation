revisions:
- from: Basi wajenzi wa Sulemani, wajenzi wa Hiramu, na watu wa Gebali[a] wakakata na kuandaa mbao na mawe kwa ajili ya kujenga nyumba[b].
  to: Hivyo wajenzi wa Sulemani, wajenzi wa Hiramu, na watu wa Gebali[a] wakachonga na kuandaa mbao na mawe ili kujenga nyumba[b].
  rationale: The revision renders פסל as "wakachonga," which better reflects hewing or shaping construction materials, retains the Hebrew parallelism among the three groups, and uses a direct purpose clause. The footnote now identifies the ethnic group without adding a narrower lexical claim than the source makes.
