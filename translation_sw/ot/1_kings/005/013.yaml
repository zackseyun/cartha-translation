base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/013.yaml
  text: He spoke about the trees[a], from the cedar that is in Lebanon to the hyssop that grows out of the wall; he also spoke about the animals and the birds and the creeping things and the fish.
translation:
  language: sw
  text: Alizungumza kuhusu miti, kuanzia mwerezi ulioko Lebanoni hadi hisopo[a] inayoota kutoka ukutani. Pia alizungumza kuhusu wanyama, ndege, viumbe vitambaavyo na samaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda “mmea mdogo wenye harufu nzuri.” Utambulisho kamili wa mmea unaoitwa אֵזוֹב kwa Kiebrania hauna uhakika, ingawa “hisopo” ndiyo tafsiri ya jadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל
  choice: alizungumza kuhusu
  rationale: Muundo דבר pamoja na עַל una maana ya kusema kuhusu jambo. Tafsiri hii ni ya kawaida katika Kiswahili cha sasa na haiongezi dhana ya kufundisha au kueleza kitaalamu.
- source_word: הָעֵצִים
  choice: miti
  rationale: עֵץ katika wingi hapa inahusu miti au mimea yenye mashina ya miti. “Miti” inafaa katika orodha inayoanzia mwerezi hadi hisopo.
- source_word: הָאֶרֶז
  choice: mwerezi
  rationale: אֶרֶז ni mwerezi unaohusishwa hasa na Lebanoni; hili ndilo neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: בַּלְּבָנוֹן
  choice: ulioko Lebanoni
  rationale: Kirai hiki kinaonyesha mahali mwerezi huo ulipo. Upatanisho wa “ulioko” na “mwerezi” hutoa Kiswahili cha asili.
- source_word: מִן ... וְעַד
  choice: kuanzia ... hadi
  rationale: Muundo huu unaonyesha upana wa mada kutoka upande mmoja hadi mwingine; “kuanzia ... hadi” ni wa kawaida na huhifadhi taswira hiyo.
- source_word: הָאֵזוֹב
  choice: hisopo
  rationale: Utambulisho kamili wa mmea huu hauna uhakika. “Hisopo” ni tafsiri ya jadi inayotambulika, huku tanbihi ikihifadhi kutokuwa na uhakika kwa upande wa botania.
- source_word: יֹצֵא בַּקִּיר
  choice: inayoota ukutani
  rationale: Ingawa kitenzi יצא kimsingi ni ‘kutoka,’ katika muktadha wa mmea kinamaanisha kuchipuka au kuota kutoka ukutani. “Inayoota ukutani” ni ya kawaida bila kupoteza maana.
- source_word: הַבְּהֵמָה
  choice: wanyama
  rationale: בְּהֵמָה hapa ina maana pana ya wanyama katika orodha ya viumbe, si lazima mifugo pekee.
- source_word: הָעוֹף
  choice: ndege
  rationale: עוֹף inaweza kujumuisha viumbe warukao, lakini “ndege” ndiyo maana ya kawaida na inayofaa zaidi katika orodha hii.
- source_word: הָרֶמֶשׂ
  choice: viumbe vitambaavyo
  rationale: רֶמֶשׂ ni kundi pana la viumbe wanaotambaa; tafsiri hii huepuka kulibana kuwa reptilia pekee.
- source_word: הַדָּגִים
  choice: samaki
  rationale: דָּגִים ni wingi wa kawaida wa samaki, na “samaki” hufanya kazi kama umoja na wingi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi, huku marudio ya Kiebrania ya “alizungumza kuhusu” yakihifadhiwa. “Viumbe vitambaavyo” huhifadhi upana wa kundi la Kiebrania bila kulitambulisha na reptilia pekee.
