translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Kori’ limehifadhiwa kama jina la kipimo cha kale, huku maelezo ya mafuta yakifanywa wazi bila kutumia istilahi nzito.
