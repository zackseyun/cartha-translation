  to: Sulemani akampa Hiramu kori elfu ishirini za ngano, ziwe chakula kwa watu wa nyumbani mwake[a], na kori ishirini za mafuta yaliyotolewa kwa kuponda[b]. Hivyo ndivyo Sulemani alivyokuwa akimpa Hiramu mwaka baada ya mwaka.
