base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/025.yaml
  text: And Solomon gave Hiram twenty thousand cors of wheat as food for his household[a], and twenty cors of beaten oil[b]. Thus Solomon would give to Hiram year by year.
translation:
  language: sw
  text: Sulemani akampa Hiramu kori elfu ishirini za ngano, ziwe chakula kwa watu wa nyumbani mwake[a], na kori ishirini za mafuta yaliyotolewa kwa kuponda[b]. Hivyo ndivyo Sulemani alivyokuwa akimpa Hiramu mwaka baada ya mwaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahitaji ya chakula kwa ajili ya nyumba yake.” Inaelekea Kiebrania kinamaanisha chakula kilichotolewa kwa ajili ya watu wa nyumba ya kifalme ya Hiramu.
    reason: lexical_alternative
  - marker: b
    text: Usemi “mafuta yaliyotolewa kwa kuponda” unamaanisha mafuta ya ubora wa juu yaliyopatikana kwa kuponda au kupiga, badala ya kwa ukamuaji wa kawaida. Katika muktadha huu, huenda yalikuwa mafuta ya zeituni.
    reason: cultural_note
lexical_decisions:
- source_word: נָתַן / יִתֵּן
  choice: akampa / alivyokuwa akimpa
  rationale: Kitenzi cha kwanza kinaeleza tendo au mpango uliowekwa, na kile cha pili, pamoja na ‘hivyo’ na ‘mwaka baada ya mwaka,’ kinaonyesha utoaji uliorudiwa kwa mazoea.
- source_word: כֹּר
  choice: kori
  rationale: Hiki ni kipimo maalumu cha kale cha vitu vikavu au vimiminika; kutaja ‘kori’ kunahifadhi kipimo hicho badala ya kutumia neno lisilo mahususi kama ‘vipimo.’
- source_word: חִטִּים
  choice: ngano
  rationale: Neno la Kiebrania linamaanisha ngano hasa, wala si nafaka kwa ujumla.
- source_word: מַכֹּלֶת לְבֵיתוֹ
  choice: kuwa chakula cha watu wa nyumbani mwake
  rationale: מַכֹּלֶת ni chakula au mahitaji ya chakula, na ‘nyumba yake’ hapa inaelekea kumaanisha jamaa na watumishi wa nyumba ya kifalme ya Hiramu.
- source_word: שֶׁמֶן כָּתִית
  choice: mafuta yaliyotengenezwa kwa zeituni zilizopondwa
  rationale: כָּתִית huonyesha mafuta yaliyopatikana kwa kuziponda au kuzipiga zeituni. Kutaja zeituni kunafanya maana iwe wazi katika Kiswahili, ingawa aina hiyo ya mafuta inaeleweka kutokana na muktadha wa neno שֶׁמֶן.
- source_word: כֹּה
  choice: Hivyo ndivyo
  rationale: Maneno haya yanaunganisha kiasi kilichotajwa na utaratibu wa utoaji uliokuwa ukifanyika kwa kurudiwa.
- source_word: שָׁנָה בְשָׁנָה
  choice: mwaka baada ya mwaka
  rationale: Nahau hii inaonyesha kurudiwa kwa jambo kila mwaka na inasikika kwa kawaida katika Kiswahili.
