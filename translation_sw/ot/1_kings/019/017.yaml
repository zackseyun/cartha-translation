base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/017.yaml
  text: And it shall be that whoever escapes from the sword of Hazael[a], Jehu shall put to death; and whoever escapes from the sword of Jehu, Elisha shall put to death.
translation:
  language: sw
  text: 'Na itakuwa hivi: yeyote atakayeponyoka upanga wa Hazaeli, Yehu atamwua; na yeyote atakayeponyoka upanga wa Yehu, Elisha atamwua.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kiebrania kiko katika umbo la kisababishi, yaani, “kusababisha afe” au “kuua.” Katika muktadha, jukumu la Elisha linaweza kueleweka kuwa la moja kwa moja au kupitia hukumu iliyotekelezwa kwa huduma yake ya kinabii.
    reason: grammatical_explanation
lexical_decisions:
- source_word: וְהָיָה
  choice: Na itakuwa hivi
  rationale: Kauli hii ya kisimulizi na ya wakati ujao inatanguliza matokeo yaliyotangazwa. Tafsiri hii ni ya asili katika Kiswahili huku ikihifadhi kiunganishi na nguvu ya usemi wa Kiebrania.
- source_word: הַנִּמְלָט / וְהַנִּמְלָט
  choice: yeyote atakayeponyoka / na yeyote atakayeponyoka
  rationale: Kivumishi-tendo chenye kibainishi kinatumika kama nomino yenye maana ya jumla. “Yeyote atakayeponyoka” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: מֵחֶרֶב
  choice: atakayeponyoka upanga wa
  rationale: Neno “upanga” limehifadhiwa kwa kuwa חֶרֶב hapa linaweza kuwakilisha silaha yenyewe na hukumu ya mauti kwa nguvu ya kijeshi. Katika Kiswahili, kitenzi “ponyoka” kinaweza kufuatwa moja kwa moja na hatari inayoponyokwa.
- source_word: חֲזָאֵל
  choice: Hazaeli
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: יָמִית
  choice: atamwua
  rationale: Hili ni umbo la kisababishi la מות, lenye maana ya kusababisha mtu afe au kumuua. “Atamwua” ni kauli ya moja kwa moja na ya kawaida katika Kiswahili, bila kupunguza jukumu la mtendaji.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: אֱלִישָׁע
  choice: Elisha
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Jukumu la Elisha katika יָמִית
  choice: Kudumisha kauli ya moja kwa moja kwamba Elisha atamwua atakayemponyoka Yehu.
  alternative: Kufasiri kwamba neno la kinabii au huduma ya Elisha ndiyo itakayoleta hukumu, bila Elisha kuua moja kwa moja.
  rationale: Sarufi ya Kiebrania inawaweka Hazaeli, Yehu na Elisha katika mfuatano wa mawakala wa hukumu ya mauti. Tafsiri kuu haipunguzi mvutano huo; uwezekano wa utekelezaji kupitia huduma ya kinabii umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mistari miwili inayolingana umehifadhiwa, na “upanga” umetumiwa kwa picha halisi ya Kiebrania. Alama ya tanbihi imewekwa baada ya kauli inayomhusu Elisha, ambayo ndiyo inayofafanuliwa.
