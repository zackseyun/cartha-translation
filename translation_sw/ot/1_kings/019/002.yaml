base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/002.yaml
  text: Then Jezebel sent a messenger to Elijah[a], saying, “So may the gods do, and more also, if by this time tomorrow I do not make your life like the life of one of them.”
translation:
  language: sw
  text: Ndipo Yezebeli akatuma mjumbe kwa Eliya, akisema, “Miungu[a] na inifanyie hivyo, tena na zaidi, ikiwa kufikia wakati kama huu kesho sitakuwa nimeufanya uhai wako uwe kama uhai wa mmoja wao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu na anifanyie hivyo, tena na zaidi.” Neno la Kiebrania אֱלֹהִים linaweza kueleweka kuwa “Mungu” au “miungu”; hapa maana ya wingi inalingana na mazingira ya Yezebeli na vitenzi vya wingi vilivyotumiwa katika kiapo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּשְׁלַח
  choice: Ndipo ... akatuma
  rationale: Muundo wa wayyiqtol unaendeleza simulizi; “Ndipo” huonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: מַלְאָךְ
  choice: mjumbe
  rationale: Katika mazingira haya ya kifalme, neno hili linamaanisha mjumbe wa kibinadamu, si malaika.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni njia ya kawaida na ya asili ya kuanzisha maneno yaliyonukuliwa moja kwa moja.
- source_word: כֹּה יַעֲשׂוּן אֱלֹהִים וְכֹה יוֹסִפוּן
  choice: Miungu na inifanyie hivyo, tena na zaidi
  rationale: Huu ni mtindo wa kiapo unaoomba adhabu ya kimungu iwapo msemaji hatatimiza alilosema. “Inifanyie” huweka wazi mlengwa anayedokezwa na msemo huo, huku “tena na zaidi” ikihifadhi mkazo wa sehemu ya pili.
- source_word: אֱלֹהִים
  choice: miungu
  rationale: Ingawa neno hili linaweza kumaanisha Mungu mmoja, vitenzi vinavyoandamana nalo viko katika wingi, na mazingira ya Yezebeli yanaunga mkono maana ya wingi. Utata huo umehifadhiwa katika tanbihi.
- source_word: כִּי
  choice: ikiwa
  rationale: Katika muundo huu wa kiapo, neno linaanzisha sharti ambalo likivunjwa litaleta laana iliyotajwa.
- source_word: כָעֵת מָחָר
  choice: kufikia wakati kama huu kesho
  rationale: Hueleza muda unaolingana katika siku inayofuata na pia huwasilisha kikomo cha tishio.
- source_word: אָשִׂים אֶת־נַפְשְׁךָ
  choice: sitaufanya uhai wako kuwa
  rationale: Tafsiri hii huhifadhi kitenzi “kufanya/kuweka” pamoja na kitu chake “uhai wako,” badala ya kufupisha moja kwa moja kuwa “sitakuua.”
- source_word: נַפְשְׁךָ
  choice: uhai wako
  rationale: Katika muktadha huu נֶפֶשׁ hurejelea uhai wa mtu, si nafsi isiyo ya mwili.
- source_word: כְּנֶפֶשׁ אַחַד מֵהֶם
  choice: kama uhai wa mmoja wao
  rationale: Huhifadhi urudiaji wa “uhai” katika Kiebrania na kulinganisha hatima ya Eliya na ya mmoja wa wale waliouawa.
theological_decisions:
- issue: Mrejeo wa אֱלֹהִים katika kiapo cha Yezebeli
  choice: wingi, “miungu”
  alternative: umoja, “Mungu”
  rationale: Vitenzi יַעֲשׂוּן na יוֹסִפוּן vina umbo la wingi, na mazingira ya Yezebeli yanapatana na usomaji wa “miungu.” Hata hivyo, kwa kuwa אֱלֹהִים pia inaweza kumaanisha Mungu mmoja, usomaji huo mbadala umetajwa katika tanbihi bila kuondoa utata wa asili.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Yezebeli na Eliya. Muundo wa tishio umehifadhi urudiaji wa “uhai” ili kuonyesha lafudhi ya Kiebrania bila kutafsiri kwa ufafanuzi wa moja kwa moja kuwa “nitakuua.”'
