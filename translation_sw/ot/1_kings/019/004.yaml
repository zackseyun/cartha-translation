  text: וְ/הֽוּא הָלַ֤ךְ בַּ/מִּדְבָּר֙ דֶּ֣רֶךְ י֔וֹם וַ/יָּבֹ֕א וַ/יֵּ֕שֶׁב תַּ֖חַת רֹ֣תֶם אחת וַ/יִּשְׁאַ֤ל אֶת נַפְשׁ/וֹ֙ לָ/מ֔וּת וַ/יֹּ֣אמֶר רַ֗ב עַתָּ֤ה יְהוָה֙ קַ֣ח נַפְשִׁ֔/י כִּֽי לֹא ט֥וֹב אָנֹכִ֖י מֵ/אֲבֹתָֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/004.yaml
  text: But he himself went a day's journey into the wilderness[a], and came and sat down under a broom tree. And he asked that he might die, and said, “It is enough; now, Yahweh, take my life[b], for I am no better than my fathers.”
translation:
  language: sw
  text: Lakini yeye mwenyewe akaenda mwendo wa siku moja jangwani, akafika na kuketi chini ya mretemu.[a] Akaomba afe, akisema, “Imetosha! Sasa, Yahwe, uondoe uhai wangu, kwa maana mimi si bora kuliko mababu zangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kichaka cha mretemu.” Neno la Kiebrania רֹתֶם humaanisha mmea wa jangwani unaoweza kuelezwa kuwa kichaka au mti mdogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: מִדְבָּר ni eneo kame lisilokaliwa; ‘jangwani’ ni tafsiri ya kawaida na ya asili katika Kiswahili, huku kitenzi cha mwendo kikionyesha kuingia humo.
- source_word: דֶּרֶךְ יוֹם
  choice: mwendo wa siku moja
  rationale: Muundo huu unaeleza safari au umbali unaosafiriwa kwa siku moja, si muda tu.
- source_word: רֹתֶם אַחַת
  choice: mretemu
  rationale: רֹתֶם ni kichaka au mti mdogo wa jangwani. ‘Mretemu’ huhifadhi jina mahususi la mmea; umbo la umoja linaonyesha mmea mmoja bila kulazimisha neno ‘mmoja’ lisilo la lazima katika Kiswahili.
- source_word: וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת
  choice: akaomba afe
  rationale: Hii ni nahau inayomaanisha kwamba Eliya aliomba kifo chake mwenyewe; tafsiri hii ni wazi na ya asili.
- source_word: רַב עַתָּה
  choice: Imetosha! Sasa
  rationale: רַב ni mshangao wa kusema ‘imetosha,’ na עַתָּה huhifadhiwa kama ‘sasa’ ili kuonyesha uharaka wa ombi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa kama jina binafsi kwa tahajia iliyozoeleka katika Kiswahili, badala ya kubadilishwa na cheo.
- source_word: קַח נַפְשִׁי
  choice: iondoe uhai wangu
  rationale: נֶפֶשׁ hapa humaanisha uhai; katika ombi la kufa, ‘iondoe uhai wangu’ huwasilisha maana ya kitenzi קח kwa Kiswahili cha kawaida.
- source_word: כִּי לֹא טוֹב אָנֹכִי מֵאֲבֹתָי
  choice: kwa maana mimi si bora kuliko mababu zangu
  rationale: טוֹב pamoja na מִן ni ulinganisho, ‘bora kuliko.’ אֲבֹתָי inaweza kumaanisha mababu au waliotangulia; ‘mababu zangu’ huhifadhi uhusiano huo bila kuufafanua zaidi ya maandishi.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia Tetragramatoni kama jina ambalo Eliya anamwitia Mungu moja kwa moja. Kutumia ‘Yahwe’ huhifadhi jina binafsi badala ya kulibadilisha kwa cheo.
- issue: Maana ya נֶפֶשׁ katika ombi la Eliya
  choice: uhai wangu
  alternative: nafsi yangu
  rationale: Muktadha wa ‘akaomba afe’ unaonyesha kuwa נֶפֶשׁ hapa ni uhai wake, bila kutoa dai kuhusu mgawanyo wa mwili na nafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano wa vitenzi ‘akaenda… akafika… kuketi… akaomba’ huhifadhi mwendo wa simulizi la Kiebrania. Alama ya tanbihi [a] imewekwa baada ya neno linalohusika.
