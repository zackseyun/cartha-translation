base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/006.yaml
  text: He looked[a], and behold, at his head was a cake baked on hot stones and a jar of water. He ate and drank and lay down again.
translation:
  language: sw
  text: Akatazama, na kumbe, kando ya kichwa chake kulikuwa na mkate uliookwa juu ya mawe ya moto[a] na mtungi wa maji. Akala, akanywa, akarudi kulala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkate uliookwa juu ya makaa.” Neno la Kiebrania רְצָפִים huenda linamaanisha mawe yaliyopashwa moto yaliyotumiwa kuokea, ingawa pia hutafsiriwa kwa ujumla kuwa “makaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: Akatazama
  rationale: Kitenzi נבט humaanisha kutazama; tafsiri hii inahifadhi tendo bila kuongeza mwelekeo ambao haukutajwa.
- source_word: וְהִנֵּה
  choice: na kumbe
  rationale: Kipashio הִנֵּה huvuta fikira kwenye jambo linaloonekana. “Kumbe” huleta mshangao na uhai wa simulizi kwa Kiswahili cha kawaida bila kuwa kizito.
- source_word: מְרַאֲשֹׁתָיו
  choice: kando ya kichwa chake
  rationale: Neno hili huelekeza mahali palipo karibu na kichwa cha mtu aliyelala; “kando ya kichwa chake” ni wazi na la kawaida katika Kiswahili.
- source_word: עֻגַת
  choice: mkate
  rationale: עֻגָה hapa ni mkate wa umbo la duara au bapa, si keki tamu. “Mkate” huepuka maana ya kisasa ya keki na kufaa mazingira ya simulizi.
- source_word: רְצָפִים
  choice: uliookwa juu ya mawe ya moto
  rationale: Inaelekea neno hili humaanisha mawe yaliyopashwa moto yaliyotumiwa kuokea. Tafsiri hii inaeleza njia inayowezekana ya kuoka, huku mbadala wa “makaa” ukihifadhiwa katika tanbihi.
- source_word: וְצַפַּחַת מָיִם
  choice: na mtungi wa maji
  rationale: צַפַּחַת ni chombo cha kubebea maji, kama mtungi mdogo au chupa. “Mtungi wa maji” ni wazi na wa kawaida katika muktadha huu.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: Akala, akanywa
  rationale: Vitenzi hivi vinaendeleza matendo yanayofuatana kwa urahisi na kwa mdundo wa simulizi ya Kiebrania.
- source_word: וַיָּשָׁב וַיִּשְׁכָּב
  choice: akarudi kulala
  rationale: Muungano wa שׁוב na שׁכב unaonyesha kurudia kulala. “Akarudi kulala” ni wa asili kwa Kiswahili na unahifadhi wazo la kurudia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na wenye heshima. “Mkate” limetumiwa badala ya “keki” ili kuepuka dhana ya kitindamlo kitamu. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja, yaani “mawe ya moto.”
