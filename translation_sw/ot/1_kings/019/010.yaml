  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָֽ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/010.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[c][b], to take it.”
translation:
  language: sw
  text: Akasema, “Nimekuwa na ari kubwa sana[b] kwa ajili ya Yahwe[a], Mungu wa majeshi, kwa maana Waisraeli wameacha agano lako, wamebomoa madhabahu zako, na kuwaua manabii wako kwa upanga. Nimebaki mimi peke yangu, nao wanatafuta uhai wangu ili wauchukue.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina la Kiebrania ni יהוה (YHWH), hapa limetafsiriwa “Yahwe.”
    reason: divine_name
  - marker: b
    text: Au “Nimekuwa na wivu mkubwa sana kwa ajili ya Yahwe.” Kiebrania kinatumia muundo wa kusisitiza sana ari au wivu huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: Nimekuwa na ari kubwa sana
  rationale: Muundo wa kitenzi pamoja na jina-kitenzi la kusisitiza unaonyesha kiwango kikubwa cha ari. ‘Ari kubwa sana’ ni Kiswahili cha sasa na cha kawaida, huku tanbihi ikihifadhi uwezekano wa maana ya ‘wivu.’
- source_word: לַיהוָה
  choice: kwa ajili ya Yahwe
  rationale: Kihusishi ל hapa kinaonyesha kwamba ari ya Eliya ilikuwa kwa ajili ya Yahwe; jina la agano יְהוָה limetoholewa kuwa ‘Yahwe.’
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Mungu wa majeshi
  rationale: צְבָאוֹת humaanisha majeshi au makundi yaliyopangwa. Tafsiri hii huhifadhi picha ya asili bila kuibadilisha kuwa cheo kingine kama ‘Mwenyezi.’
- source_word: עָזְבוּ בְרִיתְךָ
  choice: wameacha agano lako
  rationale: עָזַב ni kuacha au kutelekeza. ‘Wameacha’ ni ya asili katika Kiswahili na inadumisha uzito wa kuvunja uaminifu wa agano.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa kihalisi ni ‘wana wa Israeli,’ hapa usemi huo unalitaja taifa kwa ujumla; ‘Waisraeli’ ni wazi na wa kawaida katika Kiswahili.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: wamebomoa madhabahu zako
  rationale: הָרַס ni kubomoa au kuangusha jengo; ‘wamebomoa’ ni sahihi na ya kawaida kwa madhabahu.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: kuwaua manabii wako kwa upanga
  rationale: Tafsiri hii huhifadhi tendo la kuua na chombo kilichotajwa wazi katika Kiebrania.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: Nimebaki mimi peke yangu
  rationale: Mpangilio huu unadumisha mkazo wa אֲנִי לְבַדִּי juu ya upweke wa Eliya na unasikika kwa kawaida katika Kiswahili.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: wanatafuta uhai wangu ili wauondoe
  rationale: נֶפֶשׁ hapa ni uhai wa mtu, si ‘roho’ kama sehemu isiyo ya mwili. ‘Ili wauondoe’ huhifadhi kiwakilishi kinachorejelea uhai, kama ilivyo katika chanzo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina maalumu la agano, si cheo cha kawaida. ‘Yahwe’ hulihifadhi jina hilo moja kwa moja.
- issue: Maana ya קנא katika kauli ya Eliya
  choice: ari
  alternative: wivu
  rationale: Katika muktadha huu Eliya anaeleza kujitoa kwake kwa ajili ya Yahwe. ‘Ari’ huepuka maana ya kawaida ya wivu wa kijicho, lakini tanbihi inahifadhi maana nyingine halisi ya neno na mvutano wake wa kiagano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa urahisi. ‘Mungu wa majeshi’ huhifadhi taswira ya Kiebrania; ‘uhai wangu’ huepuka kuelekeza נֶפֶשׁ kimakosa kuwa nafsi isiyo ya mwili.
