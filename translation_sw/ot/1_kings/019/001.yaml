  yaml_path: translation/ot/1_kings/019/001.yaml
  text: Ahab told Jezebel all that Elijah had done, and how he had killed all the prophets with the sword.
translation:
  language: sw
  text: Ahabu akamweleza Yezebeli yote ambayo Eliya alikuwa amefanya, na jinsi alivyowaua manabii wote kwa upanga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: akamweleza
  rationale: Kitenzi hiki kinawasilisha tendo la kutoa taarifa; “akamweleza” ni Kiswahili cha kawaida na kinadumisha mfululizo wa simulizi.
- source_word: כָּל אֲשֶׁר עָשָׂה
  choice: yote ambayo ... alikuwa amefanya
  rationale: Huhifadhi upana wa כָּל na huonyesha kwa kawaida kwamba matendo hayo yalitangulia taarifa ya Ahabu.
- source_word: הָרַג
  choice: alivyowaua
  rationale: Hutoa wazi maana ya kuua na inaendana na muundo wa taarifa unaoanzishwa na “jinsi.”
- source_word: בֶּחָרֶב
  choice: kwa upanga
  rationale: Ni ulinganifu wa moja kwa moja unaohifadhi chombo au njia ya mauaji.
theological_decisions:
- issue: Kiima cha tendo la kuwaua manabii
  choice: Eliya ndiye anayerejelewa na “alivyowaua”
  alternative: Ahabu ndiye aliyewaua, au kiima kiachwe bila kubainika
  rationale: Kiima kinachoendelea katika kishazi cha Kiebrania kwa kawaida ni Eliya, ambaye ametajwa mara moja kabla yake; muktadha wa 1 Wafalme 18:40 pia unaunga mkono rejeo hilo.
- issue: Utambulisho wa “manabii wote”
  choice: Kudumisha tu “manabii wote” bila kuongeza “wa Baali”
  alternative: “manabii wote wa Baali”
  rationale: Ingawa muktadha unawatambulisha kuwa manabii wa Baali, kirai hicho hakipo wazi katika mstari huu; kutokiongeza kunahifadhi maandishi ya chanzo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo ya kawaida ya Biblia ya Kiswahili: Ahabu, Yezebeli, Eliya. Muundo “na jinsi” hurekebisha kwa Kiswahili cha kawaida urudiaji wa Kiebrania wa “na yote ambayo,” bila kubadili maana.'
