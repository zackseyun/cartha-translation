base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/011.yaml
  text: And he said[a], “Go out and stand on the mountain before Yahweh.” And behold, Yahweh was passing by, and a great and strong wind was tearing apart the mountains and shattering rocks before Yahweh, but Yahweh was not in the wind. And after the wind, an earthquake[b], but Yahweh was not in the earthquake.
translation:
  language: sw
  text: Akasema, “Toka nje, simama mlimani mbele za Yahweh.” Na tazama, Yahweh alikuwa akipita. Upepo mkubwa na wenye nguvu ulikuwa ukipasua milima na kuvunja miamba mbele za Yahweh, lakini Yahweh hakuwamo katika upepo huo.[a] Baada ya upepo ukaja mtetemeko wa ardhi, lakini Yahweh hakuwamo katika mtetemeko huo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema, “Yahweh hakuwamo katika upepo.” Huenda kauli hiyo ikaeleweka kuwa hakujifunua ndani yake, lakini tafsiri imehifadhi usemi wa moja kwa moja.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema, “Yahweh hakuwamo katika mtetemeko.” Matini haifafanui zaidi maana ya kutokuwamo huko; tafsiri imehifadhi usemi wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limehifadhiwa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: צֵא וְעָמַדְתָּ
  choice: Toka nje, usimame
  rationale: 'Kauli hizi zinaeleza maagizo mawili yanayofuatana: kutoka mahali pa kujisitiri na kusimama mlimani. Kiswahili hiki ni cha kawaida na kinahifadhi mfuatano huo.'
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Huhifadhi maana ya mahali na ya kuwa katika uwepo wa Yahweh bila kuipanua kwa ufafanuzi wa ziada.
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: “Tazama” inaonyesha mshangao na kuvuta fikira kwenye tukio linalofuata, huku ikidumisha hadhi ya simulizi.
- source_word: עֹבֵר
  choice: alikuwa akipita
  rationale: Umbo la kitenzi linaonyesha tendo linaloendelea; “alikuwa akipita” linahifadhi uhai na mwendelezo wa tukio.
- source_word: רוּחַ גְּדוֹלָה וְחָזָק
  choice: upepo mkubwa na wenye nguvu
  rationale: Muktadha wa kupasua milima unaonyesha kuwa רוּחַ hapa ni upepo. Vivumishi vyote viwili vimetafsiriwa ili kuhifadhi msisitizo wa Kiebrania.
- source_word: מְפָרֵק הָרִים וּמְשַׁבֵּר סְלָעִים
  choice: ulikuwa ukipasua milima na kuvunja miamba
  rationale: Kauli hii inadumisha vitendo viwili vya nguvu vinavyoendelea na kutumia maneno ya kawaida, yenye picha dhahiri katika Kiswahili.
- source_word: רַעַשׁ
  choice: mtetemeko wa ardhi
  rationale: Katika mfuatano wa matukio ya kiasili hapa, neno hili linaeleweka kwa kawaida kuwa mtetemeko wa ardhi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; kulihifadhi kama “Yahweh” huepuka kulibadilisha kuwa cheo.
- issue: Maana ya Yahweh kutokuwamo katika upepo na mtetemeko
  choice: Yahweh hakuwamo katika ...
  alternative: Yahweh hakujifunua katika ...
  rationale: Kiebrania kinasema kwa ufupi kwamba Yahweh hakuwa “katika” matukio hayo. Tafsiri ya moja kwa moja inahifadhi utata na mvutano wa kiteolojia bila kuamua kwamba kauli hiyo inahusu tu kujifunua au kutenda kwake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Na tazama” huhifadhi uzito wa kishairi wa kiashiria cha Kiebrania bila kufanya sentensi kuwa ya kizamani.
