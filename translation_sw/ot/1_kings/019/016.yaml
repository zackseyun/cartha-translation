  text: וְ/אֵת֙ יֵה֣וּא בֶן נִמְשִׁ֔י תִּמְשַׁ֥ח לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ מֵ/אָבֵ֣ל מְחוֹלָ֔ה תִּמְשַׁ֥ח לְ/נָבִ֖יא תַּחְתֶּֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/016.yaml
  text: And you shall anoint Jehu son of Nimshi as king over Israel[a], and Elisha son of Shaphat from Abel-meholah you shall anoint as prophet in your place.
translation:
  language: sw
  text: Na Yehu mwana wa Nimshi utamtia mafuta kuwa mfalme juu ya Israeli, na Elisha mwana wa Shafati kutoka Abel-Mehola utamtia mafuta kuwa nabii mahali pako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baada yako” au “badala yako”; Kiebrania kinaweza kumaanisha kurithi wadhifa au kuchukua nafasi ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשַׁח
  choice: utamtia mafuta
  rationale: Kitenzi cha Kiebrania hapa ni agizo linaloelekezwa kwa mtu mmoja wa kiume. ‘Utamtia mafuta’ huhifadhi tendo halisi la kumweka rasmi mtu katika wadhifa na kina sajili inayofaa kwa maandiko.
- source_word: לְמֶלֶךְ
  choice: awe mfalme
  rationale: Kiambishi לְ kinaonyesha kuteuliwa katika wadhifa. ‘Awe mfalme’ ni Kiswahili cha kawaida na wazi kuliko tafsiri ya neno kwa neno ‘kwa mfalme.’
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: עַל katika muktadha wa ufalme huonyesha mamlaka ya kutawala watu; ‘juu ya Israeli’ huhifadhi uhusiano huo wa mamlaka.
- source_word: אֱלִישָׁע
  choice: Elisha
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: מֵאָבֵל מְחוֹלָה
  choice: kutoka Abel-Mehola
  rationale: Kiambishi מִן kinaonyesha mahali alikotoka Elisha. ‘Kutoka’ huwasilisha maana hiyo moja kwa moja.
- source_word: לְנָבִיא
  choice: awe nabii
  rationale: לְ hapa huonyesha kuteuliwa katika wadhifa wa kinabii; ‘awe nabii’ ni wazi na ya asili katika Kiswahili.
- source_word: תַּחְתֶּיךָ
  choice: mahali pako
  rationale: Usemi huu unaweza kuonyesha urithi wa wadhifa au kuchukua nafasi ya mtu. ‘Mahali pako’ huhifadhi wazo la nafasi bila kuamua kimya kimya ikiwa msisitizo ni wakati au ubadilishaji.
- source_word: וְאֵת ... וְאֶת
  choice: Naye ... na
  rationale: אֵת ni kiashiria cha yambwa tendwa na hakihitaji kutafsiriwa moja kwa moja; viunganishi וְ vinaunganisha maagizo haya mawili.
- source_word: בֶן
  choice: mwana wa
  rationale: ‘Mwana wa’ huhifadhi utambulisho wa mtu kwa jina la baba yake kwa usahihi na kwa mtindo wa kawaida wa Kiswahili cha Biblia.
theological_decisions:
- issue: Uhusiano wa Eliya na Elisha katika תַּחְתֶּיךָ
  choice: Elisha anawekwa kuwa nabii ‘mahali pako.’
  alternative: ‘Baada yako’ kwa msisitizo wa mfuatano wa wakati, au ‘badala yako’ kwa msisitizo mkubwa wa kuchukua nafasi.
  rationale: ‘Mahali pako’ huhifadhi wazo la Elisha kurithi wadhifa wa kinabii wa Eliya bila kulazimisha kwamba maandishi yasisitize tu mfuatano wa wakati au kuondolewa kwake mara moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi unafuata kwa kiasi kikubwa mkazo wa Kiebrania kwa kutaja kila mhusika kabla ya agizo la kumtia mafuta.
