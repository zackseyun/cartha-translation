  text: וַ/יְהִ֣י כִּ/שְׁמֹ֣עַ אֵלִיָּ֗הוּ וַ/יָּ֤לֶט פָּנָי/ו֙ בְּ/אַדַּרְתּ֔/וֹ וַ/יֵּצֵ֕א וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הַ/מְּעָרָ֑ה וְ/הִנֵּ֤ה אֵלָי/ו֙ ק֔וֹל וַ/יֹּ֕אמֶר מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/013.yaml
  text: And when Elijah heard it[a], he wrapped his face in his cloak, and went out and stood at the entrance of the cave. And behold, a voice came to him and said, “What are you doing here[b], Elijah?”
translation:
  language: sw
  text: Eliya aliposikia hayo[a], akajifunika uso kwa joho lake, akatoka, akasimama kwenye uwazi wa pango. Tazama, sauti ikamjia, ikasema, “Unafanya nini hapa[b], Eliya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hakitaji wazi kile Eliya alichosikia. Muktadha unaelekeza kwenye yaliyotangulia, ambayo yanaweza kueleweka kuwa sauti iliyotangulia au sauti ya msemaji.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “Una nini hapa?” Nahau hii inauliza shughuli au kusudi la Eliya mahali hapa; pia inaweza kutafsiriwa, “Kwa nini uko hapa?”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: aliposikia hayo
  rationale: Kiambishi כ pamoja na kitenzi-jina kinaanzisha kishazi cha wakati. Kiebrania hakitaji yambwa la ‘kusikia’; ‘hayo’ ni rejeleo la chini kabisa kwa yaliyotangulia bila kuamua wazi kama yalikuwa sauti au sauti ya msemaji.
- source_word: וַיָּלֶט פָּנָיו
  choice: akajifunika uso
  rationale: Kitenzi kina maana ya kufunika au kuzungushia kwa karibu, na hapa kinahusu uso wa Eliya kimwili.
- source_word: בְּאַדַּרְתּוֹ
  choice: kwa joho lake
  rationale: אַדֶּרֶת ni vazi la nje, mara nyingi vazi maalumu kama joho; ‘joho’ ni neno la kawaida na lenye hadhi linalofaa tendo la kufunika uso.
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Inaonyesha mwendo wa kutoka ndani ya pango kwenda nje.
- source_word: וַיַּעֲמֹד פֶּתַח הַמְּעָרָה
  choice: na kusimama kwenye mwingilio wa pango
  rationale: פֶּתַח ni sehemu iliyo wazi ya kuingilia; ‘mwingilio’ huepuka kudokeza kwamba pango lilikuwa na mlango uliotengenezwa.
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Linadumisha ishara ya Kiebrania ya kuelekeza usikivu kwa tukio linalowasilishwa kwa uhai, bila kuongeza wazo la ghafula.
- source_word: אֵלָיו קוֹל
  choice: sauti ikamjia
  rationale: Kishazi kisicho na kitenzi, kihalisi ‘kwake sauti,’ kinaonyesha sauti iliyomfikia na kumwelekea Eliya.
- source_word: מַה לְּךָ פֹה
  choice: Unafanya nini hapa
  rationale: Hii ni nahau inayouliza shughuli, kusudi, au sababu ya Eliya kuwa mahali hapo. Tafsiri hii ni ya kawaida katika Kiswahili na haipunguzi swali liwe la sababu pekee.
- source_word: אֵלִיָּהוּ
  choice: Eliya
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
theological_decisions:
- issue: Yambwa lililodokezwa baada ya ‘kusikia’
  choice: aliposikia hayo
  alternative: aliposikia sauti / aliposikia sauti ya msemaji
  rationale: Kiebrania hakitaji yambwa. ‘Hayo’ hurejelea yaliyotangulia bila kuamua kama marejeleo hasa ni sauti iliyotajwa au sauti yenye ujumbe, hivyo hudumisha utata wa simulizi.
- issue: Nguvu ya swali מַה לְּךָ פֹה
  choice: Unafanya nini hapa?
  alternative: Kwa nini uko hapa?
  rationale: Nahau inaweza kuuliza shughuli, kusudi, au sababu ya kuwepo hapo. ‘Unafanya nini hapa?’ huhifadhi upana huo kuliko tafsiri inayouliza sababu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa simulizi ni mwepesi kueleweka; ‘joho’ na ‘mwingilio wa pango’ ni maneno ya kawaida yasiyoegemea mapokeo ya dhehebu fulani. Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini.
