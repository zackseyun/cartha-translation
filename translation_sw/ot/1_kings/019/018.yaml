base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/018.yaml
  text: Yet I have left for myself seven thousand in Israel—all the knees that have not bowed to Baal[b][a], and every mouth that has not kissed him.
translation:
  language: sw
  text: Lakini nimebakiza katika Israeli watu elfu saba kwa ajili yangu mwenyewe—magoti yote ambayo hayajapigwa mbele ya Baali[a], na kila kinywa ambacho hakijambusu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambayo hayajainama mbele ya Baali.”
    reason: lexical_alternative
  - marker: b
    text: Kubusu sanamu kulikuwa tendo la kutoa heshima au kuabudu.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: Lakini nimewaacha kwa ajili yangu
  rationale: Kitenzi cha Hifili nafsi ya kwanza umoja kutoka שׁאר kinaeleza kusababisha wabaki au kuwahifadhi. Wakati timilifu unaeleweka hapa kuwa tendo lenye matokeo ya sasa; kiunganishi kimetafsiriwa ‘Lakini’ ili kuonyesha jibu linalopingana na malalamiko ya Eliya.
- source_word: בְיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Kirai cha mahali kimetafsiriwa moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: שִׁבְעַת אֲלָפִים
  choice: watu elfu saba
  rationale: Ingawa ‘watu’ halitajwi wazi katika Kiebrania, linaeleweka kutokana na magoti na vinywa vinavyowakilisha watu; kuliongeza hufanya sentensi iwe ya kawaida na wazi kwa Kiswahili.
- source_word: כָּל הַבִּרְכַּיִם
  choice: magoti yote
  rationale: Taswira halisi ya viungo vya mwili imehifadhiwa badala ya kubadilishwa kuwa ‘watu wote.’
- source_word: אֲשֶׁר לֹא כָרְעוּ לַבַּעַל
  choice: ambayo hayajampigia Baali
  rationale: ‘Kupigia magoti’ ni usemi wa kawaida wa Kiswahili unaodumisha tendo la kuinama kwa unyenyekevu au ibada; kiambishi cha yambwa kinaonyesha Baali ndiye anayefanyiwa tendo hilo.
- source_word: הַבַּעַל
  choice: Baali
  rationale: Jina la mungu huyu limetolewa kwa umbo la kawaida la Kiswahili bila kutafsiri kibainishi cha Kiebrania kama neno tofauti.
- source_word: וְכָל הַפֶּה
  choice: na kila kinywa
  rationale: Umoja wa mgawanyo baada ya כָּל umehifadhiwa kwa ‘kila kinywa,’ huku taswira inayolingana na ‘magoti’ ikiendelea kuonekana.
- source_word: אֲשֶׁר לֹא נָשַׁק לוֹ
  choice: ambacho hakijambusu
  rationale: Kitenzi נשׁק kimetafsiriwa moja kwa moja ‘kubusu’; kiwakilishi kinamrejelea Baali na wakati timilifu unaonyesha hali inayodumu hadi sasa.
theological_decisions:
- issue: Kauli kuhusu waliobaki bila kuingiza istilahi ya baadaye ya kiteolojia
  choice: Lakini nimewaacha kwa ajili yangu watu elfu saba katika Israeli
  alternative: Lakini nimejihifadhia watu elfu saba katika Israeli
  rationale: Tafsiri inadumisha tendo la Mungu la kuwaacha au kuwabakiza waaminifu kwa ajili yake bila kuingiza istilahi maalumu ya kiteolojia isiyotajwa wazi katika Kiebrania.
- issue: Matendo kwa Baali kama ibada
  choice: hayajampigia Baali ... hakijambusu
  alternative: hayajainama mbele ya Baali ... hakijabusu sanamu yake
  rationale: Tafsiri inahifadhi viungo vya mwili na matendo halisi ya maandishi. Haiongezi ‘sanamu yake,’ kwa kuwa yambwa katika Kiebrania ni kiwakilishi kinachomrejelea Baali; tanbihi inaeleza maana ya kitamaduni ya busu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘magoti yote ... na kila kinywa’ unahifadhi usambamba na taswira ya Kiebrania; ‘watu’ limeongezwa kabla ya ‘elfu saba’ kwa uwazi wa kawaida wa Kiswahili.
