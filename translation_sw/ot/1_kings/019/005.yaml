base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/005.yaml
  text: Then he lay down and slept under a broom tree. And behold[a], an angel touched him and said to him, “Get up, eat.”
translation:
  language: sw
  text: Kisha akajilaza, akalala chini ya mti mmoja wa mretemu. Na tazama, malaika[a] akamgusa na kumwambia, “Inuka, ule.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe.” Neno la Kiebrania מַלְאָךְ linaweza kumaanisha mjumbe wa kibinadamu au malaika; hapa muktadha unapendelea “malaika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב וַיִּישַׁן
  choice: Kisha akalala usingizi
  rationale: Vitenzi hivi viwili vinaeleza kujilaza na kulala katika mfuatano. Kiswahili cha asili hutumia ‘kulala usingizi’ kwa ufupi bila kupoteza tendo kuu; ‘Kisha’ linaendeleza simulizi.
- source_word: תַּחַת רֹתֶם אֶחָד
  choice: chini ya mti mmoja wa mretemu
  rationale: תַּחַת ni ‘chini ya,’ רֹתֶם ni mmea wa jangwani uitwao mretemu, na אֶחָד imehifadhiwa kama ‘mmoja,’ ingawa hapa pia inaweza kuwa na nguvu ya kutotambulisha mti mahususi.
- source_word: וְהִנֵּה זֶה
  choice: Na tazama
  rationale: Kauli hii inatambulisha tukio la ghafla kwa msisitizo wa kisimulizi. ‘Na tazama’ huhifadhi nguvu hiyo kuliko kuisawazisha kuwa ‘ghafla’ pekee.
- source_word: מַלְאָךְ
  choice: malaika
  rationale: Neno linaweza kumaanisha mjumbe wa kibinadamu au kiumbe wa mbinguni. Muktadha wa msaada wa ajabu unaofuata unapendelea ‘malaika’; maana mbadala imewekwa katika tanbihi.
- source_word: נֹגֵעַ בּוֹ
  choice: akamgusa
  rationale: Kirai cha Kiebrania kinaeleza kuguswa kwake. Katika simulizi la Kiswahili, umbo la tukio lililokamilika ‘akamgusa’ ni la kawaida na wazi.
- source_word: וַיֹּאמֶר לוֹ
  choice: na kumwambia
  rationale: Huhifadhi mhusika anayesemeshwa kwa kiwakilishi cha ‘-mw-’ na kuunganisha vitendo kwa mtiririko wa kawaida wa Kiswahili.
- source_word: קוּם אֱכֹל
  choice: Inuka, ule
  rationale: Amri mbili fupi zimehifadhiwa. ‘Ule’ ni amri chanya ya kawaida na ya sasa katika Kiswahili sanifu.
theological_decisions:
- issue: Iwapo מַלְאָךְ itafsiriwe ‘malaika’ au ‘mjumbe’
  choice: malaika
  alternative: mjumbe
  rationale: Muktadha wa simulizi, hasa chakula kilichoandaliwa kwa namna isiyo ya kawaida na utambulisho unaofuata, unapendelea kiumbe wa mbinguni. Hata hivyo, utata halisi wa neno la Kiebrania umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa urahisi. ‘Na tazama’ limehifadhiwa kama kiashiria hai cha simulizi, na ‘mretemu’ limetumiwa kwa mmea wa jangwani unaoitwa רֹתֶם.
