  yaml_path: translation/ot/1_kings/019/012.yaml
  text: And after the earthquake[a], a fire; Yahweh was not in the fire. And after the fire, a sound of a gentle whisper.
translation:
  language: sw
  text: Na baada ya tetemeko la ardhi, kulikuwa na moto; Yahwe hakuwa ndani ya moto. Na baada ya moto, sauti ya utulivu mwanana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sauti ndogo tulivu,” “mnong’ono mwanana,” au “sauti ya ukimya mwembamba.” Kwa maana halisi, Kiebrania husema, “sauti ya utulivu mwembamba,” usemi wenye upole na ulio mgumu kufasiri.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחַר
  choice: Na baada ya
  rationale: Inahifadhi mtiririko wa matukio yanayofuatana na kiunganishi cha simulizi cha Kiebrania.
- source_word: הָרַעַשׁ
  choice: tetemeko la ardhi
  rationale: רַעַשׁ hapa inaeleweka kwa kawaida kuwa tetemeko au mtikisiko mkali; katika mfululizo huu wa matukio, ‘tetemeko la ardhi’ ni wazi na la kawaida.
- source_word: אֵשׁ
  choice: moto
  rationale: Nomino hii inataja tukio linalofuata. Vitenzi ‘ukaja’ na ‘ikaja’ vimeongezwa kwa ulaini wa Kiswahili bila kubadili mpangilio wa Kiebrania.
- source_word: לֹא בָאֵשׁ יְהוָה
  choice: Yahwe hakuwamo motoni
  rationale: Muundo huu unahifadhi maana ya mahali ya kihusishi ב bila kufafanua kupita kiasi namna ya kuwapo kwa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: קוֹל
  choice: sauti
  rationale: קוֹל inaweza kumaanisha sauti au sauti ya mtu. ‘Sauti’ huhifadhi uwezekano huo bila kudai wazi kwamba maneno yalisemwa.
- source_word: דְּמָמָה
  choice: utulivu
  rationale: Neno hili linaweza kumaanisha utulivu, ukimya, au hali ya kimya. ‘Utulivu’ huhifadhi mvutano wa usemi ‘sauti ya utulivu’.
- source_word: דַקָּה
  choice: mwanana
  rationale: דַקָּה humaanisha kitu chembamba, hafifu, au laini. ‘Mwanana’ ni Kiswahili cha asili kinachoonyesha ubora hafifu na mwororo bila kuugeuza moja kwa moja kuwa mnong’ono.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kuliweka kwa cheo.
- issue: Jinsi ya kutafsiri קוֹל דְּמָמָה דַקָּה
  choice: sauti ya utulivu mwanana
  alternative: sauti ndogo tulivu; mnong’ono mwanana; sauti ya ukimya mwembamba
  rationale: Usemi wa Kiebrania ni wa makusudi, wenye fumbo na mvutano. Tafsiri hii ni ya kueleweka kwa Kiswahili huku ikihifadhi ‘sauti’ pamoja na ‘utulivu,’ bila kuamua kwamba ilikuwa sauti ya mtu au mnong’ono.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mfululizo wa Kiebrania umehifadhiwa; vitenzi ‘ukaja/ikaja’ vimeongezwa ili sentensi iwe ya kawaida kwa Kiswahili. Tanbihi imewekwa kwenye kishazi kinachohusika, si baada ya ‘tetemeko la ardhi.’
