  text: וַ/יָּ֨שָׁב מֵ/אַחֲרָ֜י/ו וַ/יִּקַּ֣ח אֶת צֶ֧מֶד הַ/בָּקָ֣ר וַ/יִּזְבָּחֵ֗/הוּ וּ/בִ/כְלִ֤י הַ/בָּקָר֙ בִּשְּׁלָ֣/ם הַ/בָּשָׂ֔ר וַ/יִּתֵּ֥ן לָ/עָ֖ם וַ/יֹּאכֵ֑לוּ וַ/יָּ֗קָם וַ/יֵּ֛לֶךְ אַחֲרֵ֥י אֵלִיָּ֖הוּ וַ/יְשָׁרְתֵֽ/הוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/021.yaml
  text: Then he turned back from following him[a], took the pair of oxen, and sacrificed them. With the oxen’s equipment he boiled the flesh and gave it to the people, and they ate[b]. Then he arose and went after Elijah and served him.
translation:
  language: sw
  text: Kisha akarudi kutoka kumfuata Eliya, akachukua jozi ya ng’ombe[a], na kuwachinja kama dhabihu. Kwa kutumia vifaa vya ng’ombe hao[b], akaichemsha nyama, akawapa watu, nao wakala. Kisha akaondoka, akamfuata Eliya na kumhudumia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ng’ombe wawili waliofungwa nira.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa nira au zana za ng’ombe hao.” Vifaa hivyo huenda vilitumiwa kama kuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב מֵאַחֲרָיו
  choice: akarudi kutoka kumfuata Eliya
  rationale: Nahau hiyo ina maana ya kurudi baada ya kuwa akimfuata mtu. Jina “Eliya” limewekwa wazi kwa Kiswahili cha kawaida ili kuepuka utata wa viwakilishi, bila kubadili mhusika.
- source_word: צֶמֶד הַבָּקָר
  choice: wale ng’ombe wawili waliokuwa wamefungwa nira
  rationale: צֶמֶד hapa ni jozi ya ng’ombe, kwa kawaida waliofungwa pamoja kwa nira. Tafsiri hii inaonyesha idadi na hali yao kwa uwazi.
- source_word: וַיִּזְבָּחֵהוּ
  choice: kuwachinja kama dhabihu
  rationale: זבח hubeba maana ya kuchinja kwa ajili ya dhabihu. Kirai hiki kinahifadhi maana hiyo bila kudai madhabahu, mpokeaji, au utaratibu ambao kifungu hakitaji.
- source_word: וּבִכְלִי הַבָּקָר
  choice: Kwa kutumia vifaa vya ng’ombe hao
  rationale: כְּלִי ni neno pana linaloweza kumaanisha vifaa au zana. Katika muktadha huu ni vifaa vilivyotumiwa kupikia, huenda kama kuni, lakini jambo hilo halijaelezwa moja kwa moja katika Kiebrania.
- source_word: בִּשְּׁלָם הַבָּשָׂר
  choice: akaichemsha nyama
  rationale: בשל inaweza kumaanisha kupika au kuchemsha. “Kuchemsha nyama” ni ya kawaida katika Kiswahili na inadumisha maana mahususi inayowezekana ya kitenzi.
- source_word: לָעָם
  choice: akawapa watu
  rationale: עם inarejelea watu wa jumuiya waliokula chakula hicho; “watu” ni tafsiri ya moja kwa moja na isiyoingiza maelezo yasiyokuwapo.
- source_word: וַיָּקָם
  choice: Kisha akaondoka
  rationale: Katika mfululizo wa simulizi, קום huonyesha kuinuka na kuanza hatua inayofuata. “Akaondoka” ni ya asili kwa Kiswahili katika muktadha huu na haihitaji kurudia wazo la kwenda linalofuata.
- source_word: וַיֵּלֶךְ אַחֲרֵי אֵלִיָּהוּ
  choice: akamfuata Eliya
  rationale: Kirai hiki kihalisi ni kwenda nyuma ya Eliya, yaani kumfuata. Tafsiri hiyo ni fupi na ya kawaida katika Kiswahili.
- source_word: וַיְשָׁרְתֵהוּ
  choice: na kumhudumia
  rationale: שרת humaanisha kutumikia au kuhudumu kama msaidizi. “Kumhudumia” huhifadhi upana wa jukumu hilo bila kulifanya cheo rasmi.
theological_decisions:
- issue: Iwapo זבח itafsiriwe kwa lugha ya dhabihu
  choice: kuwachinja kama dhabihu
  alternative: kuwachinja tu
  rationale: Kitenzi cha Kiebrania kwa kawaida kina maana inayohusiana na dhabihu, nayo inaendana na mlo wa pamoja. Tafsiri haibainishi dhabihu ilitolewa kwa nani au kwa utaratibu gani, kwa kuwa maandiko hayasemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa simulizi ni wazi na wa kawaida; lugha ya dhabihu imehifadhiwa bila kuongeza maelezo ya kidhehebu. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
