source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלָ֔י/ו לֵ֛ךְ שׁ֥וּב לְ/דַרְכְּ/ךָ֖ מִדְבַּ֣רָ/ה דַמָּ֑שֶׂק וּ/בָ֗אתָ וּ/מָשַׁחְתָּ֧ אֶת חֲזָאֵ֛ל לְ/מֶ֖לֶךְ עַל אֲרָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/015.yaml
  text: And Yahweh said to him[a], “Go, return by your way to the wilderness of Damascus; and when you arrive[b], you shall anoint Hazael as king over Aram.”
translation:
  language: sw
  text: Yahwe akamwambia, “Nenda, urudi kwa njia yako kuelekea nyika ya Damasko.[a] Ukifika, umtie Hazaeli mafuta awe mfalme juu ya Aramu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka kwenye nyika ya Damasko.” Umbo la neno la Kiebrania linalomaanisha “nyika” linaonyesha mwelekeo wa mwendo.
    reason: lexical_alternative
  - marker: b
    text: Aramu ni jina la Kiebrania la nchi ambayo mara nyingi huitwa Siria.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne za Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: לֵךְ שׁוּב
  choice: Nenda, urudi
  rationale: Vitenzi viwili vya amri vimehifadhiwa, bila kuvifupisha kuwa amri moja.
- source_word: לְדַרְכְּךָ
  choice: kwa njia yako
  rationale: Huhifadhi wazo la kurudi kwa njia au safari yake bila kuongeza maelezo ambayo hayajasemwa wazi katika Kiebrania.
- source_word: מִדְבָּרָה דַמָּשֶׂק
  choice: kuelekea nyika ya Damasko
  rationale: Kiishio cha mwelekeo katika neno la Kiebrania kinaonyesha mwendo kuelekea eneo la nyika linalohusishwa na Damasko.
- source_word: וּבָאתָ
  choice: Ukifika
  rationale: Katika mfululizo huu wa maagizo, kuja kunatangulia tendo linalofuata; ‘Ukifika’ huonyesha mpangilio huo kwa Kiswahili cha kawaida.
- source_word: וּמָשַׁחְתָּ
  choice: umtie ... mafuta
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha tendo la kumweka mtu wakfu kwa kumpaka au kumtia mafuta.
- source_word: חֲזָאֵל
  choice: Hazaeli
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: לְמֶלֶךְ עַל אֲרָם
  choice: awe mfalme juu ya Aramu
  rationale: Huhifadhi kauli ya uteuzi na pia kihusishi ‘juu ya,’ huku Aramu likibaki jina la Kiebrania la nchi hiyo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu, kwa hiyo limetoholewa kama jina badala ya kubadilishwa kuwa cheo.
- issue: Maana ya kumtia Hazaeli mafuta
  choice: umtie Hazaeli mafuta awe mfalme
  alternative: umtawaze Hazaeli kuwa mfalme
  rationale: Tafsiri haibadilishi tendo la kutia mafuta kuwa ‘kutawaza’ pekee, hivyo inadumisha lugha halisi na uzito wa uteuzi wa kiungu bila kuingiza utaratibu maalumu usiotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi cha kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa amri umehifadhiwa, na sentensi imegawanywa kwa mtiririko wa asili wa Kiswahili.
