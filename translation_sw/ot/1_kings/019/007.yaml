  yaml_path: translation/ot/1_kings/019/007.yaml
  text: Then the angel of Yahweh returned a second time and touched him and said[a], “Get up and eat, because the journey is too much for you.”
translation:
  language: sw
  text: Kisha malaika wa Yahweh[a] akarudi mara ya pili, akamgusa, akasema, “Inuka, ule, kwa maana safari inakuzidi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe wa Yahweh.”
    reason: Neno la Kiebrania מַלְאָךְ linaweza kumaanisha “malaika” au “mjumbe.”
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Katika muktadha huu wa simulizi, kitenzi שוב kinaonyesha kurudi mahali alipokuwa, na “akarudi” ni usemi wa kawaida na sahihi katika Kiswahili.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: מַלְאָךְ inaweza kumaanisha mjumbe au malaika; katika tukio hili la mjumbe wa mbinguni, “malaika” ni tafsiri ya kawaida, huku “Yahweh” ikihifadhi jina la Mungu lililo katika Kiebrania.
- source_word: שֵׁנִית
  choice: mara ya pili
  rationale: Usemi huu unataja wazi kwamba tendo lilitokea kwa mara ya pili, si tu kwamba lilirudiwa kwa ujumla.
- source_word: וַיִּגַּע בּוֹ
  choice: akamgusa
  rationale: Kitenzi נגע pamoja na kiwakilishi kinamaanisha kumgusa; hakuna haja ya kuongeza “tena” kwa sababu kurudiwa tayari kumeonyeshwa kwa “mara ya pili.”
- source_word: קוּם אֱכֹל
  choice: Inuka, ule
  rationale: Vitenzi hivi viwili ni maagizo ya moja kwa moja. “Inuka, ule” ni Kiswahili cha sasa, cha asili na chenye nguvu inayofaa.
- source_word: כִּי
  choice: kwa maana
  rationale: Neno hili linaanzisha sababu ya maagizo yaliyotangulia; “kwa maana” linafaa katika sajili ya simulizi la Biblia bila kuwa la kizamani.
- source_word: רַב מִמְּךָ הַדָּרֶךְ
  choice: safari hii ni kubwa mno kwako
  rationale: Kiebrania kinasema kihalisi kwamba safari au njia ni “kubwa/nyingi” kuliko uwezo wa Eliya. Tafsiri hii inadumisha upana huo badala ya kuifanya ihusu urefu wa safari pekee.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni יהוה; “Yahweh” linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya safari kuwa רַב מִמְּךָ
  choice: safari hii ni kubwa mno kwako
  alternative: safari hii ni ndefu mno kwako
  rationale: Maandishi hayasemi wazi kwamba tatizo ni umbali pekee; yanaweza kurejelea safari kuzidi nguvu au uwezo wa Eliya. Tafsiri iliyochaguliwa inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Maandiko. “Mara ya pili” huhifadhi umahususi wa Kiebrania, na “kubwa mno kwako” huepuka kufasiri mapema kwamba safari ilikuwa ndefu tu.
