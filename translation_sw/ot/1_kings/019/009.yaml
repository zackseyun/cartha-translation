base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/009.yaml
  text: There he came to the cave and spent the night there. And behold[a], the word of Yahweh came to him and said to him, “What are you doing here, Elijah?”
translation:
  language: sw
  text: Huko akafika kwenye pango, akalala huko usiku. Na tazama, neno la Yahwe likamjia na kumwambia, “Unafanya nini hapa, Eliya?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa nini uko hapa, Eliya?” Nahau ya Kiebrania inasema kihalisi, “Nini kwako hapa, Eliya?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שָׁם אֶל הַמְּעָרָה
  choice: Huko akafika kwenye lile pango
  rationale: Kitenzi בוא pamoja na אֶל kinaeleza kufika mahali; “akafika kwenye” ni Kiswahili cha kawaida bila kuongeza wazo la kuingia ndani. “Lile pango” linawakilisha kibainishi cha Kiebrania na pango linalotambulika katika muktadha.
- source_word: וַיָּלֶן שָׁם
  choice: akalala humo usiku
  rationale: לון/לין humaanisha kukaa au kulala mahali usiku. Kauli hii ni ya asili katika Kiswahili na “humo” hurejelea ndani ya pango.
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: הִנֵּה huvuta fikira kwenye tukio linalofuata na kulipa uhai wa kisimulizi; “Tazama” huhifadhi dhima hiyo kwa lugha yenye hadhi.
- source_word: דְבַר יְהוָה
  choice: neno la Yahwe
  rationale: Hii ni kauli maalumu ya kinabii. “Neno la Yahwe” huhifadhi muundo wake na uzito wake wa kitheolojia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kwa namna ya kawaida ya Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: אֵלָיו
  choice: likamjia
  rationale: Kihusishi אֶל kinaonyesha mwelekeo ‘kwake’; katika Kiswahili “neno ... likamjia” ni ya asili na ina maana hiyo.
- source_word: וַיֹּאמֶר לוֹ
  choice: na kumwambia
  rationale: Muundo huu huendeleza neno la Yahwe kama mhusika wa kisarufi na kuhifadhi wazi kwamba ujumbe ulimwelekea Eliya.
- source_word: מַה לְּךָ פֹה
  choice: Unafanya nini hapa
  rationale: Nahau hiyo, kihalisi ‘Kuna nini kwako hapa?’, ni swali linalochunguza kuwapo kwa Eliya hapo. “Unafanya nini hapa?” ni tafsiri ya asili isiyofungia maana kwenye sababu pekee.
- source_word: אֵלִיָּהוּ
  choice: Eliya
  rationale: Hii ndiyo namna ya kawaida ya jina hili katika mapokeo na matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, kwa tahajia inayofaa Kiswahili.
- issue: Uwasilishaji wa kauli דְבַר יְהוָה
  choice: neno la Yahwe
  alternative: ujumbe kutoka kwa Yahwe
  rationale: “Neno la Yahwe” huhifadhi kauli ya kinabii inayotambulika na mvutano wake wa kisarufi, ambapo ‘neno’ ndilo linalomjia na kusema naye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa kisimulizi ni mwepesi kueleweka, huku “Tazama” na “neno la Yahwe” zikihifadhi nguvu ya usemi wa Kiebrania.
