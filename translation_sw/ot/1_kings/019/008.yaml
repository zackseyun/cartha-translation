base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/008.yaml
  text: So he arose and ate and drank[a], and went in the strength of that food forty days and forty nights to Horeb, the mountain of God.
translation:
  language: sw
  text: Basi akainuka, akala na akanywa, kisha akaenda kwa nguvu ya chakula hicho[a] kwa siku arobaini na usiku arobaini mpaka Horebu, mlima wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa nguvu alizopata kutokana na chakula hicho.” Usemi wa Kiebrania unahusu nguvu alizopata kutokana na kile alichokuwa amekula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Basi akainuka
  rationale: Kitenzi cha masimulizi kutoka קום kinaonyesha tendo linalofuata katika mfululizo. “Akainuka” ni cha kawaida, chenye hadhi, na kiko karibu na maana ya Kiebrania.
- source_word: וַיֹּאכַל וַיִּשְׁתֶּה
  choice: akala na kunywa
  rationale: Vitenzi hivi viwili vimetafsiriwa kwa namna ya moja kwa moja na ya kawaida katika masimulizi ya Kiswahili.
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: הלך hapa kimsingi ni “kwenda”; muda unaotajwa baadaye unaonyesha kwamba ilikuwa safari ndefu bila kulazimika kuongeza maana hiyo ndani ya kitenzi.
- source_word: בְּכֹחַ הָאֲכִילָה הַהִיא
  choice: kwa nguvu alizopata kutokana na chakula hicho
  rationale: Usemi huu unaonyesha kwamba kile alichokula kilimpa nguvu za kuendelea. Tafsiri hii ni ya asili katika Kiswahili na bado inadumisha uhusiano wa moja kwa moja kati ya chakula na nguvu.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: kwa siku arobaini na usiku arobaini
  rationale: Huu ni usemi wa muda unaotaja wazi siku na usiku; kurudia “arobaini” kunafuata msisitizo wa Kiebrania.
- source_word: עַד
  choice: mpaka
  rationale: Katika muktadha huu neno hili linaonyesha kikomo au mwisho wa safari.
- source_word: הַר הָאֱלֹהִים
  choice: mlima wa Mungu
  rationale: Muundo huu unafuata kirai unganishi cha Kiebrania na kuhifadhi uzito wa jina la mahali.
- source_word: חֹרֵב
  choice: Horebu
  rationale: Jina la mahali limetoholewa kwa umbo linalotambulika na linalofaa mfumo wa sauti wa Kiswahili.
theological_decisions:
- issue: Maana ya הָאֱלֹהִים katika הַר הָאֱלֹהִים
  choice: Mungu
  alternative: wa kimungu
  rationale: Katika jina hili linalojulikana la mahali, neno hilo linamrejelea Mungu mwenyewe. “Mlima wa Mungu” huhifadhi uhusiano wa Horebu na Mungu wa Israeli bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wazi, wa sasa, na wenye hadhi. Muundo wa sentensi umefanywa wa asili katika Kiswahili huku marudio ya “arobaini” na kirai “mlima wa Mungu” yakihifadhiwa.
