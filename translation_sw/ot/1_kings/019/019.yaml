base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/019.yaml
  text: So he went from there and found Elisha son of Shaphat[a], and he was plowing with twelve yoke-pairs before him, and he was with the twelfth[b]. Elijah passed by him and threw his cloak over him.
translation:
  language: sw
  text: Basi akaondoka huko, akamkuta Elisha mwana wa Shafati, naye alikuwa akilima kwa jozi kumi na mbili za maksai[a] zilizokuwa mbele yake; yeye mwenyewe alikuwa pamoja na jozi ya kumi na mbili. Eliya akapita karibu naye, akamtupia vazi lake la nje[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jozi kumi na mbili za wanyama wa kulimia”; Kiebrania humaanisha jozi kumi na mbili za wanyama waliounganishwa kwa nira.
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri za jadi: “akamtupia joho lake.” Katika muktadha unaozunguka, vazi hilo linahusishwa na huduma ya Eliya ya kinabii.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: Basi akaondoka huko
  rationale: Kiunganishi cha usimulizi kinaendeleza tukio; “Basi” ni cha kawaida katika Kiswahili, na “huko” kinahifadhi wazo la kuondoka mahali pale.
- source_word: וַיִּמְצָא אֶת אֱלִישָׁע בֶּן שָׁפָט
  choice: akamkuta Elisha mwana wa Shafati
  rationale: “Akamkuta” huwasilisha maana ya מָצָא kwa kawaida katika muktadha huu. Majina yametoholewa kwa namna inayotambulika katika Kiswahili.
- source_word: וְהוּא חֹרֵשׁ
  choice: naye alikuwa akilima
  rationale: Umbo la kitenzi-shirikishi linaonyesha tendo lililokuwa likiendelea wakati Elisha alipokutwa.
- source_word: שְׁנֵים עָשָׂר צְמָדִים
  choice: jozi kumi na mbili za maksai
  rationale: צֶמֶד humaanisha jozi au kundi la wanyama waliounganishwa kwa nira. “Maksai” linaeleweka kiasili kutokana na mazingira ya kulima, huku tanbihi ikieleza upana wa neno la Kiebrania.
- source_word: לְפָנָיו
  choice: zilizokuwa mbele yake
  rationale: 'Huhifadhi uhusiano wa mahali: jozi nyingine zilikuwa zikifanya kazi mbele ya Elisha.'
- source_word: וְהוּא בִּשְׁנֵים הֶעָשָׂר
  choice: yeye mwenyewe alikuwa pamoja na jozi ya kumi na mbili
  rationale: 'Hufafanua rejeo lililoachwa kwa ufupi katika Kiebrania bila kuongeza jambo jipya: Elisha alikuwa na jozi ya mwisho.'
- source_word: וַיַּעֲבֹר אֵלִיָּהוּ אֵלָיו
  choice: Eliya akapita karibu naye
  rationale: Tafsiri hii inaonyesha Eliya akimkaribia na kumpita Elisha, bila kulazimisha maana zaidi ya kitendo kinachosimuliwa.
- source_word: וַיַּשְׁלֵךְ אַדַּרְתּוֹ אֵלָיו
  choice: na kulitupa vazi lake la nje juu yake
  rationale: אַדֶּרֶת hapa ni vazi la nje la Eliya. Kauli hii ni ya sasa na inayoeleweka, huku ikihifadhi kitendo cha ishara bila kukitafsiri moja kwa moja kuwa uteuzi.
theological_decisions:
- issue: Maana ya ishara ya vazi la Eliya
  choice: 'Kitendo kimesimuliwa moja kwa moja: “kulitupa vazi lake la nje juu yake.”'
  alternative: Kutafsiri kwa ufafanuzi kuwa Eliya alimteua Elisha kuwa mrithi wake.
  rationale: Mstari unasimulia ishara lakini hauifafanui wazi. Tafsiri inaacha maana ya wito na urithi wa kinabii ijitokeze katika muktadha badala ya kuiingiza kama maelezo ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa usimulizi wa Biblia lakini kinachoeleweka kwa msomaji wa kawaida. “Maksai” ni neno mahususi la kilimo; “vazi la nje” ni la kawaida zaidi kuliko “joho” na huepuka kufanya ishara hiyo kuwa tafsiri ya kiteolojia ndani ya mstari.
