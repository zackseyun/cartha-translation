source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/014.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[b], to take it.”
translation:
  language: sw
  text: Naye akasema, “Nimekuwa na ari kubwa sana kwa ajili ya Yahwe[a], Mungu wa majeshi, kwa sababu Waisraeli[b] wameacha agano lako, wamebomoa madhabahu zako, na kuwaua manabii wako kwa upanga. Nimebaki mimi peke yangu, nao wanatafuta kuuchukua uhai wangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimekuwa na wivu mwingi sana kwa ajili ya Yahwe.” Kiebrania hutumia muundo wa kitenzi unaotia mkazo mkubwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: Nimekuwa na ari kubwa sana
  rationale: Muundo wa kitenzi kisoukomo kamili pamoja na kitenzi kilichonyambuliwa unasisitiza nguvu ya kauli. “Ari kubwa sana” huonyesha bidii kali ya uaminifu kwa agano kwa Kiswahili cha sasa bila kudokeza husuda.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahwe
  rationale: Kihusishi ל kinaonyesha anayelengwa na ari ya Eliya, na jina la agano יהוה limetoholewa kuwa “Yahwe.”
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Mungu wa majeshi
  rationale: Hili ni jina la cheo la Mungu. “Majeshi” huhifadhi upana wa צבאות bila kuyawekea mpaka kuwa ya duniani au ya mbinguni pekee.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: wameacha agano lako
  rationale: עזב humaanisha kuacha au kutupa. “Wameacha” ni ya kawaida na yenye uzito unaofaa kwa kuvunjwa kwa uaminifu wa agano.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa kwa umbo ni “wana wa Israeli,” hapa ni jina la pamoja la taifa; “Waisraeli” ni Kiswahili cha kawaida na huwahusu watu wa Israeli kwa ujumla.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: wamebomoa madhabahu zako
  rationale: הרס ni kubomoa au kuangusha jengo; “wamebomoa” ni sahihi na ya asili kwa madhabahu.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: kuwaua manabii wako kwa upanga
  rationale: Kauli hii huhifadhi tendo la kuua na chombo kilichotajwa wazi katika Kiebrania.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: Nimebaki mimi peke yangu
  rationale: “Mimi peke yangu” huhifadhi mkazo wa אֲנִי לְבַדִּי juu ya upweke wa Eliya.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: wanatafuta kuniondolea uhai wangu
  rationale: Katika nahau hii נפש ni uhai, si nafsi isiyo ya kimwili. Kiswahili “kuondolea uhai” huwasilisha kwa kawaida kusudi la kuutwaa uhai huku kitenzi “wanatafuta” kikihifadhi wazo la בקש.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya ari au wivu katika קַנֹּא קִנֵּאתִי
  choice: ari kubwa sana
  alternative: wivu mwingi sana
  rationale: Katika muktadha huu Eliya anasema juu ya juhudi kali za uaminifu kwa Yahwe, si husuda. Tanbihi huhifadhi uwezekano wa tafsiri ya karibu zaidi ya kimuundo, “wivu.”
- issue: Utambulisho wa בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  alternative: wana wa Israeli
  rationale: Ni jina la pamoja la watu wa taifa la Israeli; tafsiri ya kawaida haiwekewi maana ya wanaume pekee, huku tanbihi ikionyesha umbo halisi la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ari kubwa sana” ni ya kueleweka kwa wasomaji wa kawaida; “Mungu wa majeshi” huhifadhi cheo cha kimapokeo bila kukifafanua kupita kiasi. Alama zote za tanbihi zimewekwa katika matini mahali zinapohusika.
