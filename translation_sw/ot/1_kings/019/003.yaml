  yaml_path: translation/ot/1_kings/019/003.yaml
  text: And he saw, and arose and went for his life, and came to Beersheba, which belongs to Judah, and left his servant there.
translation:
  language: sw
  text: Naye akaona, akainuka, akakimbia kuokoa uhai wake, akafika Beer-sheba, ambayo ni ya Yuda, akamwacha mtumishi wake huko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipoona hayo
  rationale: Maandishi ya WLC yanasema ‘akaona’; ‘hayo’ hufanya Kiswahili kiwe cha kawaida huku kikirejelea hali iliyotangulia bila kubadili kitenzi kuwa ‘aliogopa.’
- source_word: וַיֵּלֶךְ אֶל־נַפְשׁוֹ
  choice: akaondoka ili kuokoa uhai wake
  rationale: Nahau ya Kiebrania ina maana ya kuondoka kwa ajili ya kulinda uhai wake; tafsiri hii ni wazi na ya kawaida kwa msomaji wa Kiswahili.
- source_word: בְּאֵר שֶׁבַע
  choice: Beer-sheba
  rationale: Jina la mahali limetoholewa kwa namna inayotambulika na rahisi kusoma katika Kiswahili.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: iliyoko Yuda
  rationale: Hueleza uhusiano wa Beer-sheba na eneo la Yuda kwa Kiswahili cha kawaida bila kudai umiliki binafsi.
- source_word: נַעֲרוֹ
  choice: mtumishi wake
  rationale: Katika muktadha huu neno linamtaja kijana aliyekuwa mhudumu au msaidizi wake; ‘mtumishi’ linawasilisha jukumu hilo kwa uwazi.
theological_decisions:
- issue: Iwapo וַיַּרְא itafsiriwe ‘akaona’ au ‘akaogopa’
  choice: alipoona hayo
  alternative: alipoogopa
  rationale: WLC ina kitenzi cha ‘kuona.’ Ingawa baadhi ya ushahidi wa kale na muktadha vinaweza kuunga mkono ‘kuogopa,’ matini ya msingi iliyotolewa inafuatwa bila kusuluhisha tofauti hiyo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi umewekwa kwa mtiririko wa kawaida wa masimulizi, na maana ya nahau ya Kiebrania imewasilishwa wazi.
