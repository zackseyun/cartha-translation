base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/020.yaml
  text: So he left the oxen and ran after Elijah and said[a], “Please let me kiss my father and my mother, and then I will go after you.” And he said to him, “Go back[b], for what have I done to you?”
translation:
  language: sw
  text: Basi akawaacha ng’ombe, akakimbia kumfuata Eliya, akasema[a], “Naomba niwabusu baba yangu na mama yangu, kisha nitakufuata.” Eliya akamwambia, “Rudi[b], kwa maana nimekutendea nini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa maana ya jumla zaidi, “Naomba niwaage baba yangu na mama yangu.” Kitenzi cha Kiebrania humaanisha kihalisi “kubusu.”
    reason: lexical_alternative
  - marker: b
    text: Jibu la Eliya ni gumu kuelewa. Linaweza kumaanisha, “Rudi, kwa maana nimekufanyia nini?” au likawa usemi mfupi wa kumwachia Elisha mwenyewe uamuzi.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: akawaacha
  rationale: Kitenzi עזב hapa humaanisha kuacha; ‘akawaacha’ ni cha kawaida katika simulizi na hakiongezi wazo la kuwaacha kabisa.
- source_word: הַבָּקָר
  choice: wale ng’ombe
  rationale: בקר inaweza kumaanisha kundi la ng’ombe kwa ujumla, lakini muktadha wa kulima unaonyesha wanyama wa kukokota plau. Kiswahili ‘ng’ombe’ ni wazi na cha kawaida.
- source_word: וַיָּרָץ אַחֲרֵי
  choice: akakimbia kumfuata
  rationale: Tafsiri hii inahifadhi tendo la kukimbia na mwelekeo wa kumfuata Eliya bila kudokeza kwamba alimkimbiza kwa uhasama.
- source_word: אֶשְּׁקָה נָּא
  choice: Tafadhali, niruhusu niwabusu
  rationale: נשק humaanisha kihalisi ‘kubusu,’ huku נָא ikionyesha ombi la heshima. Tendo halisi limehifadhiwa badala ya kubadilishwa moja kwa moja kuwa kuaga.
- source_word: לְאָבִי וּלְאִמִּי
  choice: baba yangu na mama yangu
  rationale: Tafsiri inawataja wazazi wote wawili kama Kiebrania badala ya kuwajumlisha kwa neno ‘wazazi.’
- source_word: וְאֵלְכָה אַחֲרֶיךָ
  choice: kisha nitakufuata
  rationale: הלך אחרי katika muktadha huu ni kwenda nyuma ya mtu na pia kuanza kumfuata katika huduma. ‘Nitakufuata’ ni Kiswahili cha asili kinachohifadhi upana huo.
- source_word: לֵךְ שׁוּב
  choice: Rudi
  rationale: Amri mbili za Kiebrania ni fupi na zinaweza kueleweka kwa pamoja kama ruhusa ya kurudi. ‘Rudi’ ni ya asili katika Kiswahili; utata wa jibu lote unaelezwa katika tanbihi.
- source_word: כִּי מֶה עָשִׂיתִי לָךְ
  choice: kwa maana nimekutendea nini?
  rationale: Hii ni tafsiri ya karibu ya swali gumu la Kiebrania na haichagui kimyakimya ikiwa Eliya anatoa ruhusa, anakemea, au anakumbusha kuhusu mwito.
theological_decisions:
- issue: Maana ya jibu la Eliya כִּי מֶה עָשִׂיתִי לָךְ
  choice: Kuhifadhi swali la moja kwa moja, ‘kwa maana nimekutendea nini?’
  alternative: ‘Kwa maana nimekufanyia nini?’ au kuelewa maneno hayo kama njia ya kumwachia Elisha uamuzi.
  rationale: 'Kifungu kina utata wa kweli: kinaweza kuwa ruhusa, karipio, au ukumbusho wa tendo la Eliya. Matini kuu haumalizi mvutano huo kwa ufafanuzi wa kimadhehebu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa simulizi umetumia mfululizo wa vitenzi vya wakati uliopita. Majina ‘Eliya’ na msamiati wa kawaida kama ‘ng’ombe,’ ‘kubusu,’ na ‘kufuata’ yanaeleweka kwa wasomaji wa kawaida.
