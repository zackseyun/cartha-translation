  text: וּ/בַ/שָּׁנָה֩ הָ/אַחַ֨ת עֶשְׂרֵ֜ה בְּ/יֶ֣רַח בּ֗וּל ה֚וּא הַ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֔י כָּלָ֣ה הַ/בַּ֔יִת לְ/כָל דְּבָרָ֖י/ו וּ/לְ/כָל משפט/ו וַ/יִּבְנֵ֖/הוּ שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/038.yaml
  text: And in the eleventh year[a], in the month of Bul (that is, the eighth month), the house was finished in all its parts and according to all its specifications[b]. So he built it in seven years.
translation:
  language: sw
  text: Katika mwaka wa kumi na moja, mwezi wa Buli[a]—yaani, mwezi wa nane—nyumba ikakamilika kwa maelezo yake yote na kulingana na maagizo yake yote[b]. Naye akaijenga kwa miaka saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Buli lilikuwa jina la kale la mwezi wa nane katika kalenda ya Waisraeli.
    reason: cultural_note
  - marker: b
    text: Au, “kwa mambo yake yote na kwa taratibu zake zote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הָאַחַת עֶשְׂרֵה
  choice: Katika mwaka wa kumi na moja
  rationale: Ni namna ya kawaida ya Kiswahili ya kutaja mwaka kwa namba ya mpangilio, huku ikihifadhi taarifa ya wakati.
- source_word: בְּיֶרַח בּוּל
  choice: mwezi wa Buli
  rationale: יֶרַח hapa humaanisha mwezi; jina la mwezi בּוּל limetoholewa kuwa Buli ili lisomeke kwa kawaida katika Kiswahili.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁמִינִי
  choice: yaani, mwezi wa nane
  rationale: Kifungu hiki kinafafanua jina la kale la mwezi kwa mtindo wa wazi na wa kawaida wa Kiswahili.
- source_word: כָּלָה הַבַּיִת
  choice: ujenzi wa nyumba ulikamilika
  rationale: Kitenzi כלה katika muktadha huu kinaeleza kukamilika kwa ujenzi. Kutaja 'ujenzi' hufanya sentensi iwe ya kawaida bila kubadili maana ya 'nyumba' katika Kiebrania.
- source_word: לְכָל דְּבָרָיו
  choice: katika sehemu zake zote
  rationale: דְּבָרָיו katika muktadha wa ujenzi inaelekea kumaanisha maelezo, mambo, au sehemu zote za jengo, si maneno yaliyosemwa.
- source_word: וּלְכָל מִשְׁפָּטוֹ
  choice: kulingana na vipimo vyake vyote
  rationale: מִשְׁפָּטוֹ hapa ina maana ya mpango, utaratibu, au masharti yaliyowekwa kwa ujenzi. 'Vipimo' ni usemi unaoeleweka katika muktadha wa ujenzi, huku tanbihi ikihifadhi uwezekano mpana zaidi.
- source_word: וַיִּבְנֵהוּ
  choice: Hivyo akaijenga
  rationale: Waw ya masimulizi hapa inatoa muhtasari wa kazi ya ujenzi; 'Hivyo' huwasilisha nguvu hiyo ya kuhitimisha.
- source_word: שֶׁבַע שָׁנִים
  choice: kwa miaka saba
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kueleza muda ambao shughuli iliendelea hadi kukamilika.
theological_decisions:
- issue: Maana ya הַבַּיִת katika muktadha wa hekalu
  choice: nyumba
  alternative: hekalu
  rationale: Ingawa muktadha unaonyesha wazi kuwa ni hekalu, neno la Kiebrania ni 'nyumba'. Kulihifadhi huepuka kufafanua zaidi ya matini na hudumisha taswira ya 'nyumba' ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha neno 'nyumba' la Kiebrania huku muktadha wa sura ukionyesha kuwa ni hekalu.
