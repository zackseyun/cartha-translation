  yaml_path: translation/ot/1_kings/006/017.yaml
  text: And the house[a], that is, the nave before the inner sanctuary, was forty cubits long.
translation:
  language: sw
  text: Nayo nyumba[a], yaani ukumbi mkuu uliokuwa mbele ya Patakatifu pa Ndani, ilikuwa na urefu wa dhiraa arobaini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu kuu ya jengo iliyokuwa mbele yake.” Kiebrania linafafanua “nyumba” kuwa הֵיכָל (heikhal), yaani chumba kikuu kilichokuwa mbele ya Patakatifu pa Ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: Nayo ... arobaini
  rationale: Kiunganishi וְ kinaendeleza maelezo ya muundo kutoka mstari uliotangulia; “arobaini” hutafsiri idadi hiyo moja kwa moja.
- source_word: בָּ/אַמָּה
  choice: dhiraa ... kwa urefu
  rationale: אַמָּה ni kipimo cha kawaida cha urefu, “dhiraa”; Kiswahili cha kawaida huonyesha kwa uwazi kuwa hapa ni kipimo cha urefu.
- source_word: הָיָה
  choice: ilikuwa na
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida kitenzi cha kuwapo katika taarifa ya kipimo.
- source_word: הַ/בָּיִת
  choice: nyumba
  rationale: בַּיִת kwa msingi ni “nyumba” na hapa ni jina la jengo la hekalu; neno linalofuata linafafanua sehemu inayokusudiwa.
- source_word: ה֖וּא
  choice: yaani
  rationale: Kiwakilishi hiki kina nguvu ya ufafanuzi/apposition, kikitambulisha “nyumba” kwa usahihi zaidi.
- source_word: הַ/הֵיכָל
  choice: ukumbi mkuu
  rationale: הֵיכָל hapa ni chumba kikuu cha jengo la hekalu, tofauti na Patakatifu pa Ndani; “ukumbi mkuu” ni wazi na wa kawaida kuliko istilahi ya kitaalamu isiyozoeleka.
- source_word: לִ/פְנָֽ/י
  choice: uliokuwa mbele ya Patakatifu pa Ndani
  rationale: Neno hilo lina maana ya “mbele ya”; kwa muktadha linarejelea Patakatifu pa Ndani lililotajwa katika mstari uliotangulia, ambalo limetajwa wazi ili uhusiano wa vyumba ueleweke.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ukumbi mkuu” huepuka istilahi finyu ya usanifu huku ikihifadhi tofauti kati ya chumba kikuu na Patakatifu pa Ndani; “dhiraa” ni istilahi ya kawaida ya kibiblia ya kipimo.
