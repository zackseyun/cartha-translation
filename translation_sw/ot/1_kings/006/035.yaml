  text: He carved cherubim and palm trees and open flowers, and overlaid them with gold, fitted over the carved work.
translation:
  language: sw
  text: Akachonga makerubi, mitende, na maua yaliyochanua, kisha akavifunika kwa dhahabu iliyowekwa juu ya kazi hiyo ya kuchonga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְרוּבִים
  choice: makerubi
  rationale: Neno la kawaida la Kibiblia kwa viumbe hawa; wingi wa Kiebrania umehifadhiwa.
- source_word: תִמֹרוֹת
  choice: mitende
  rationale: Hurejelea maumbo au picha za mitende katika nakshi; katika muktadha wa kuchonga, maana hiyo inaeleweka bila kuongeza 'picha za'.
- source_word: פְטֻרֵי צִצִּים
  choice: maua yaliyochanua
  rationale: Kirai kinaeleza maumbo ya maua yaliyo wazi au yaliyochanua; tafsiri hii ni ya asili na hudumisha taswira.
- source_word: מְיֻשָּׁר עַל הַמְּחֻקֶּה
  choice: iliyowekwa sawasawa juu ya michoro hiyo
  rationale: מְיֻשָּׁר ina wazo la kusawazishwa au kutoshelezwa juu ya kazi iliyochongwa; tafsiri haidai mbinu maalumu zaidi ya chanzo.
