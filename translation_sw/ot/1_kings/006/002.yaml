  yaml_path: translation/ot/1_kings/006/002.yaml
  text: The house that King Solomon built for Yahweh was sixty cubits long[a], twenty cubits wide[c][b], and thirty cubits high.
translation:
  language: sw
  text: Nyumba[a] ambayo Mfalme Sulemani alimjengea Yahweh[b] ilikuwa na urefu wa dhiraa sitini, upana wa dhiraa ishirini[c], na kimo cha dhiraa thelathini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania huanza kwa “Na nyumba”; kiunganishi hicho kinaweza pia kutafsiriwa “Na,” lakini si lazima kitolewe kwa neno tofauti hapa.
    reason: lexical_alternative
  - marker: b
    text: Jina la Kiebrania ni YHWH; kwa kawaida pia hutafsiriwa “BWANA,” na wengine hulitamka “Yehova.”
    reason: alternative_reading
  - marker: c
    text: Kiebrania hakirudii neno “dhiraa” katika kipimo cha upana; kipimo hicho kinaeleweka kutokana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת
  choice: Nyumba
  rationale: בַּיִת maana yake ya msingi ni “nyumba.” Katika muktadha huu ni jengo la hekalu, lakini “nyumba” huhifadhi lugha na mwangwi wa kitheolojia wa Kiebrania. Kiunganishi וְ hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili hapa.
- source_word: אֲשֶׁר בָּנָה הַמֶּלֶךְ שְׁלֹמֹה
  choice: ambayo Mfalme Sulemani alimjengea
  rationale: Kishazi hiki cha uhusiano kinatafsiriwa kwa Kiswahili cha kawaida. Kitenzi cha wakati uliopita kinaonyesha kazi iliyokamilika, na kiambishi -e- pamoja na -a huunganisha kwa kawaida wazo la nyumba kujengwa kwa ajili ya Yahweh.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: ל inaonyesha mlengwa au kusudi la ujenzi; muundo “alimjengea Yahweh” huwasilisha kwamba nyumba ilijengwa kwa ajili yake. Jina la agano יהוה limetolewa kama “Yahweh.”
- source_word: שִׁשִּׁים אַמָּה אָרְכּוֹ
  choice: urefu wa dhiraa sitini
  rationale: אַמָּה ni kipimo cha dhiraa, na אָרְכּוֹ ni urefu wake. Mpangilio huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וְעֶשְׂרִים רָחְבּוֹ
  choice: upana wa dhiraa ishirini
  rationale: Kiebrania hakirudii neno אַמָּה katika kipimo hiki, lakini kipimo hicho kinaeleweka kutokana na mfululizo wa vipimo. “Dhiraa” limeongezwa kwa uwazi katika Kiswahili.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: kimo cha dhiraa thelathini
  rationale: קוֹמָה hurejelea kimo au urefu wa kwenda juu; “kimo” hutofautisha kipimo hiki kwa uwazi na urefu wa jengo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la Mungu יהוה. “Yahweh” huhifadhi jina hilo badala ya kulibadili kuwa cheo, huku maumbo mengine yakitajwa katika tanbihi.
- issue: Maana ya בַּיִת katika muktadha wa hekalu
  choice: Nyumba
  alternative: hekalu
  rationale: Ingawa jengo linalozungumziwa ni hekalu, neno la chanzo ni “nyumba.” Kulihifadhi huepuka kufuta kwa kimya mvutano na mwangwi wa wazo la nyumba ya Yahweh.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vipimo ni wa kawaida kwa wasomaji wa leo, huku “nyumba,” “Yahweh,” na “dhiraa” vikihifadhi kwa karibu istilahi muhimu za chanzo.
