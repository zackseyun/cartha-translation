base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/015.yaml
  text: He built the walls of the house on the inside with cedar boards[a]; from the floor of the house to the walls of the ceiling he covered them with wood on the inside[b], and he overlaid the floor of the house with boards of cypress.
translation:
  language: sw
  text: Akajenga kuta za nyumba kwa ndani kwa mbao za mierezi. Kuanzia sakafu ya nyumba hadi kuta za dari[b], alizifunika kuta hizo kwa mbao kwa ndani; naye akaifunika sakafu ya nyumba kwa mbao za miberoshi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbao za mivinje”; kwa mapokeo, “mbao za misonobari.” Jina hili la mti katika Kiebrania huenda linamaanisha mti wa jamii ya misonobari, kama mberoshi au mvinje.
    reason: lexical_alternative
  - marker: b
    text: Kirai “kuta za dari” huenda kinamaanisha mpaka kwenye dari ya ndani au sehemu ya ndani inayofunika paa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Akajenga
  rationale: Kitenzi cha masimulizi kutoka בנה kinaendeleza mfuatano wa kazi ya ujenzi; kiambishi “Aka-” kinaonyesha mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: קִירוֹת הַבַּיִת
  choice: kuta za nyumba
  rationale: קִירוֹת humaanisha kuta. “Nyumba” inadumisha neno la Kiebrania, ingawa katika muktadha ni nyumba ya Mungu, yaani hekalu.
- source_word: מִבַּיְתָה
  choice: kwa ndani
  rationale: Kirai hiki kinaonyesha mahali au mwelekeo wa ndani, yaani kwamba kuta zilijengewa au kufunikwa upande wa ndani.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: kwa mbao za mierezi
  rationale: צַלְעוֹת hapa ni vipande vya mbao au mbao za kufunika ukuta, si “mbavu” kwa maana halisi; אֲרָזִים ni mierezi.
- source_word: מִקַּרְקַע הַבַּיִת
  choice: tangu sakafu ya nyumba
  rationale: קַרְקַע katika jengo humaanisha sakafu; “tangu” huonyesha mwanzo wa eneo lililofunikwa.
- source_word: עַד קִירוֹת הַסִּפֻּן
  choice: hadi kwenye kuta za dari
  rationale: Tafsiri hii inadumisha muundo usio wa kawaida wa Kiebrania, huku tanbihi ikifafanua kwamba huenda maana yake ni mpaka kwenye dari au sehemu ya ndani ya paa.
- source_word: צִפָּה עֵץ מִבָּיִת
  choice: akafunika sehemu ya ndani kwa mbao
  rationale: צפה hapa ni kufunika uso kwa tabaka jingine; “sehemu ya ndani” huwasilisha מִבָּיִת kwa Kiswahili cha kawaida bila kulazimisha kiwakilishi kisichoelezwa wazi katika Kiebrania.
- source_word: וַיְצַף אֶת קַרְקַע הַבַּיִת
  choice: naye akaifunika sakafu ya nyumba
  rationale: Kitenzi kilekile cha kufunika sasa kina kitu wazi, yaani sakafu; “akaifunika” ni usemi wa asili katika Kiswahili.
- source_word: בְּצַלְעוֹת בְּרוֹשִׁים
  choice: kwa mbao za miberoshi
  rationale: צַלְעוֹת ni mbao za kufunika, na בְּרוֹשִׁים ni jina lisilo hakika kabisa la mti wa jamii ya mik conifer; “miberoshi” ni chaguo la kisasa linalofaa, huku mbadala zikitajwa katika tanbihi.
