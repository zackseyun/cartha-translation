translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi umetumia “aka-” kuonyesha mfuatano. Neno “nyumba” limehifadhiwa badala ya kubadilishwa moja kwa moja kuwa “hekalu,” na ukakasi halisi wa kirai cha Kiebrania kuhusu “kuta za dari” umehifadhiwa na kufafanuliwa kwa tanbihi. Tanbihi [a] imewekwa baada ya jina la mbao za בְּרוֹשִׁים, ambako ndipo kutokuwa na uhakika kwa jina la mti kunapotokea katika chanzo.
