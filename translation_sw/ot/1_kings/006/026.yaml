  yaml_path: translation/ot/1_kings/006/026.yaml
  text: The height of the one cherub was ten cubits[a], and so it was with the second cherub.
translation:
  language: sw
  text: Urefu wa kerubi mmoja ulikuwa dhiraa kumi[a], na kerubi wa pili alikuwa na urefu huohuo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dhiraa ilikuwa kipimo cha kale cha urefu, takriban umbali kutoka kwenye kiwiko hadi ncha za vidole.
    reason: cultural_note
lexical_decisions:
- source_word: קוֹמַת
  choice: Urefu wa
  rationale: Neno קוֹמָה humaanisha urefu au kimo; katika muktadha wa vipimo vya vifaa vya hekalu, “urefu” ni sahihi na ya kawaida.
- source_word: הַכְּרוּב
  choice: kerubi
  rationale: Umbo la umoja linamtaja kerubi mmoja. “Kerubi” ni neno la kawaida la Kiswahili kwa kiumbe au mfano huu wa hekalu.
- source_word: הָאֶחָד
  choice: mmoja
  rationale: Kiebrania kinasema kihalisi “yule mmoja,” kikimtenganisha na wa pili; “mmoja” ni usemi wa asili wa Kiswahili bila kulifanya neno hili kuwa “wa kwanza.”
- source_word: עֶשֶׂר בָּאַמָּה
  choice: dhiraa kumi
  rationale: Kirai hiki kinatoa kipimo moja kwa moja. Kwa kuwa “urefu” tayari umetajwa, hakuna haja ya kurudia “kwa urefu.”
- source_word: וְכֵן
  choice: alikuwa na urefu huohuo
  rationale: וְכֵן huonyesha usawa kati ya vipimo vya makerubi hao wawili; usemi huu unaeleza wazi na kwa Kiswahili cha kawaida kwamba kipimo kilikuwa sawa.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: kerubi wa pili
  rationale: Kiebrania kinasema wazi “wa pili,” si tu “mwingine,” hivyo tafsiri inadumisha tofauti hiyo.
