  text: He made for the house windows with recessed frames[a].
translation:
  language: sw
  text: Akatengeneza kwa ajili ya nyumba madirisha yenye fremu zilizowekwa ndani na zilizofungwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno ya Kiebrania hapa ni istilahi nadra za usanifu, na maana yake si hakika. Kifungu hiki hutafsiriwa kijadi kuwa “madirisha yenye fremu zilizowekwa ndani na zilizofungwa”; pia kinaweza kueleweka kuwa “madirisha yenye fremu zilizokatwa kwa mteremko,” “madirisha yenye miimo inayozidi kuwa myembamba,” au “madirisha mapana kwa ndani na membamba kwa nje.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Wayyiqtol ya עשה ni kitenzi cha kawaida cha simulizi chenye maana ya ‘akatengeneza/akafanya.’ ‘Akatengeneza’ linafaa kwa kazi ya ujenzi.
- source_word: לַבָּיִת
  choice: kwa ajili ya nyumba
  rationale: Kihusishi ל pamoja na עשה kinaeleweka kwa kawaida kuwa kitu kilitengenezwa kwa ajili ya nyumba. ‘Nyumba’ huhifadhi neno la Kiebrania huku muktadha ukionyesha kuwa ni nyumba ya Mungu.
- source_word: חַלּוֹנֵי
  choice: madirisha
  rationale: Ni wingi wa חלון katika hali ya uambatano; ‘madirisha’ ni tafsiri ya kawaida na ya asili.
- source_word: שְׁקֻפִים אֲטֻמִים
  choice: yenye fremu zilizorudi ndani
  rationale: Maneno haya ya usanifu ni nadra na maana yake si hakika. Tafsiri hii inatoa picha inayowezekana ya fremu au miimo iliyowekwa kwa mteremko kuelekea ndani bila kudai uhakika usiokuwapo.
