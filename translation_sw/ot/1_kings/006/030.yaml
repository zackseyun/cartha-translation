base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/030.yaml
  text: He overlaid the floor of the house with gold[b][a], on the inside and on the outside.
translation:
  language: sw
  text: Aliifunika sakafu ya nyumba kwa dhahabu[a], upande wa ndani na upande wa nje.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sakafu ya hekalu.” Kiebrania kwa neno halisi ni “sakafu ya nyumba.”
    reason: lexical_alternative
  - marker: b
    text: Huenda maneno “upande wa ndani na upande wa nje” yanamaanisha kwamba sakafu yote ilifunikwa kwa dhahabu, kuanzia sehemu ya ndani hadi sehemu ya nje.
    reason: cultural_note
lexical_decisions:
- source_word: קַרְקַע
  choice: sakafu
  rationale: Katika muktadha wa ujenzi wa hekalu, neno hili linamaanisha sehemu ya chini ya ndani ya jengo, hivyo “sakafu” ni tafsiri ya kawaida na sahihi kuliko “ardhi”.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Tafsiri hii inahifadhi neno halisi la Kiebrania; katika muktadha huu “nyumba” ni jina la hekalu.
- source_word: צִפָּה
  choice: aliifunika
  rationale: Kitenzi kinaeleza kuweka tabaka la kitu juu ya uso. “Aliifunika ... kwa dhahabu” ni Kiswahili cha kawaida katika maelezo haya ya ujenzi.
- source_word: זָהָב
  choice: dhahabu
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa nyenzo inayotajwa.
- source_word: לִפְנִימָה
  choice: upande wa ndani
  rationale: Linahifadhi wazo la eneo au upande wa ndani na linaendana wazi na neno linalofuata.
- source_word: וְלַחִיצוֹן
  choice: na upande wa nje
  rationale: Linahifadhi utofautishaji wa ndani na nje bila kufafanua kupita kiasi usemi mfupi wa Kiebrania.
