base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/022.yaml
  text: He overlaid the whole house with gold[a], until the whole house was finished[b]; and he overlaid with gold the whole altar that belonged to the inner sanctuary.
translation:
  language: sw
  text: Aliifunika nyumba yote kwa dhahabu, mpaka nyumba yote ilipokamilika; pia aliifunika kwa dhahabu madhabahu yote iliyohusiana na patakatifu pa ndani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “madhabahu yote ya patakatifu pa ndani.” Kiebrania kinaweza kuonyesha kwamba madhabahu hiyo ilihusiana na patakatifu pa ndani au ilikuwa mahali fulani kuhusiana napo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Maana ya msingi ni “nyumba.” Katika muktadha huu ni nyumba ya BWANA, yaani hekalu; “nyumba” pia huhifadhi mwangwi wa matumizi ya neno hilo katika Wafalme.
- source_word: צִפָּה
  choice: aliifunika
  rationale: Kitenzi hiki hapa humaanisha kufunika uso wa kitu kwa tabaka la nyenzo nyingine, katika hali hii dhahabu. “Aliifunika kwa dhahabu” ni Kiswahili cha kawaida na kinachoeleweka katika muktadha wa ujenzi.
- source_word: זָהָב
  choice: dhahabu
  rationale: Hili ndilo neno la kawaida na sahihi kwa nyenzo inayotajwa.
- source_word: עַד תֹּם
  choice: mpaka ... ilipokamilika
  rationale: Kirai kinaonyesha kufikia ukamilifu wa kazi ya nyumba yote; muundo wa kitenzi ni wa asili katika Kiswahili na huhifadhi wazo la kukamilika.
- source_word: כָּל
  choice: yote
  rationale: Neno hilo linarudiwa kusisitiza ukamilifu au ujumla wa nyumba na madhabahu.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno sanifu la Kiswahili kwa madhabahu inayotajwa katika ujenzi wa hekalu.
- source_word: אֲשֶׁר לַדְּבִיר
  choice: iliyohusiana na patakatifu pa ndani
  rationale: Herufi ya uhusiano ל inaweza kuonyesha kuhusika, kuwa mali ya, au mahali panapohusiana na patakatifu pa ndani. Tafsiri hii haibainishi mahali kwa uhakika kuliko Kiebrania.
- source_word: דְּבִיר
  choice: patakatifu pa ndani
  rationale: Hili linaeleza kwa lugha ya sasa chumba cha ndani kabisa cha hekalu bila kutumia istilahi ya zamani isiyoeleweka au kulazimisha jina la kitheolojia maalumu.
theological_decisions:
- issue: Uhusiano wa madhabahu na דְּבִיר
  choice: iliyohusiana na patakatifu pa ndani
  alternative: iliyokuwa ndani ya patakatifu pa ndani / iliyokuwa mbele ya patakatifu pa ndani
  rationale: Kiebrania kinaonyesha uhusiano kwa kutumia ל lakini hakibainishi wazi kama madhabahu ilikuwa ndani, mbele, au ilikuwa mali ya sehemu hiyo; tafsiri kuu huhifadhi utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Nyumba” imehifadhiwa badala ya “hekalu” ili kufuata neno la Kiebrania na matumizi yake mapana katika Wafalme; “patakatifu pa ndani” ni wazi kwa msomaji wa sasa.
