  yaml_path: translation/ot/1_kings/006/009.yaml
  text: So he built the house and finished it, and he covered the house with beams and rows of cedar.
translation:
  language: sw
  text: Basi akaijenga nyumba hiyo na kuimaliza, akaifunika kwa boriti na safu za mbao za mierezi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבַּיִת
  choice: nyumba hiyo
  rationale: Katika muktadha huu neno hilo linamaanisha nyumba ya Hekalu; 'nyumba' inadumisha istilahi na taswira ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: וַיְכַלֵּהוּ
  choice: na kuimaliza
  rationale: Huwasilisha moja kwa moja wazo la kukamilisha ujenzi bila kuongeza ufafanuzi usiotajwa.
- source_word: וַיִּסְפֹּן
  choice: akaifunika
  rationale: Kitenzi kina maana ya kufunika au kuweka kifuniko; tafsiri hii haibainishi zaidi ikiwa kazi hiyo ilikuwa dari au paa.
- source_word: גֵּבִים
  choice: boriti
  rationale: Neno adimu katika muktadha wa ujenzi linaeleweka kuwa vipande vikubwa vya mbao vya kimuundo; 'boriti' ni istilahi ya kawaida na yenye hadhi.
- source_word: שְׂדֵרֹת בָּאֲרָזִים
  choice: safu za mierezi
  rationale: שְׂדֵרֹת huonyesha mistari au safu zilizopangwa, na בָּאֲרָזִים huonyesha nyenzo ya mwerezi; uchaguzi huu huhifadhi muundo wa chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi urudiaji wa 'nyumba' katika chanzo huku ikitumia viwakilishi kwa mtiririko wa asili. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zilizohitajika.
