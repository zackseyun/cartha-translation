language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בַּ/שָּׁנָה֙ הָֽ/רְבִיעִ֔ית יֻסַּ֖ד בֵּ֣ית יְהוָ֑ה בְּ/יֶ֖רַח זִֽו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/037.yaml
  text: In the fourth year[a], the house of Yahweh was founded in the month of Ziv.
translation:
  language: sw
  text: Katika mwaka wa nne, msingi wa nyumba ya Yahweh uliwekwa[a] katika mwezi wa Zivu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyumba ya Yahweh iliasisiwa.”
    reason: Njia nyingine ya kutafsiri kitenzi יֻסַּד, ambacho kinaweza kueleza kuasisiwa kwa jengo au kuwekwa kwa msingi wake.
lexical_decisions:
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: Katika mwaka wa nne
  rationale: Huhifadhi usemi wa wakati wa Kiebrania bila kuongeza maneno “wa utawala wake,” ambayo yanaeleweka kutokana na muktadha lakini hayapo katika aya hii.
- source_word: יֻסַּד
  choice: msingi ... uliwekwa
  rationale: Kitenzi hiki cha hali ya kutendwa humaanisha kuasisiwa au kuwekwa msingi. Kiswahili cha “msingi uliwekwa” ni cha kawaida na kinafaa moja kwa moja katika muktadha wa ujenzi.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: “Nyumba” huhifadhi taswira halisi ya בַּיִת, huku muktadha ukionyesha kwamba ni hekalu; jina la agano יְהוָה limetolewa kama “Yahweh.”
- source_word: בְּיֶרַח זִו
  choice: katika mwezi wa Zivu
  rationale: Hutafsiri יֶרַח kama “mwezi” na kuhifadhi Zivu kama jina la mwezi bila kuongeza kwamba ulikuwa mwezi wa pili, jambo lisilotajwa katika aya hii.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano, Tetragramatoni. “Yahweh” hulihifadhi kama jina binafsi bila kulibadili kuwa cheo.
- issue: Taswira ya hekalu kama “nyumba”
  choice: nyumba ya Yahweh
  alternative: hekalu la Yahweh
  rationale: “Nyumba” huhifadhi sitiari ya maandishi ya Kiebrania; “hekalu” ni ufafanuzi sahihi wa kimuktadha lakini si lazima kuuingiza katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa wa kawaida katika Kiswahili huku maelezo yasiyotajwa wazi katika Kiebrania yakiepukwa.
