    text: Au “nitalitimiza neno langu kwako” au “nitatimiza ahadi yangu kwako.” Nahau ya Kiebrania inayotafsiriwa “kulithibitisha neno” inamaanisha kuthibitisha au kutimiza jambo lililosemwa hapo awali.
    reason: lexical_alternative
