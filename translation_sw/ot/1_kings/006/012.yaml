base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/012.yaml
  text: As for this house that you are building[a], if you walk in my statutes, carry out my judgments, and keep all my commandments by walking in them, then I will establish my word with you, which I spoke to David your father.
translation:
  language: sw
  text: 'Kuhusu nyumba hii unayoijenga: Ukifuata maagizo yangu, ukitekeleza hukumu zangu, na kuzishika amri zangu zote kwa kuishi kulingana nazo, ndipo nitakapolithibitisha neno langu kwako[a], ambalo nilimwambia Daudi baba yako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nitalitimiza neno langu kwako” au “nitatimiza ahadi yangu kwako.” Nahau ya Kiebrania inayotafsiriwa “kulithibitisha neno” inamaanisha kuthibitisha au kutimiza jambo lililosemwa hapo awali.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת הַזֶּה אֲשֶׁר אַתָּה בֹנֶה
  choice: nyumba hii unayoijenga
  rationale: “Nyumba” hudumisha maana ya msingi ya בַּיִת; katika muktadha ni hekalu. “Unayoijenga” huonyesha tendo linaloendelea la participle בֹנֶה.
- source_word: אִם תֵּלֵךְ בְּחֻקֹּתַי
  choice: ukifuata masharti yangu
  rationale: הלך hapa huhusu mwenendo wa maisha. “Ukifuata” ni Kiswahili cha kawaida kinachowasilisha maana hiyo bila kutumia tamathali isiyo ya kawaida ya ‘kutembea katika.’ “Masharti” hudumisha nguvu ya maagizo yaliyowekwa katika חֻקּוֹת.
- source_word: וְאֶת מִשְׁפָּטַי תַּעֲשֶׂה
  choice: ukitekeleza hukumu zangu
  rationale: מִשְׁפָּטִים lina maana ya hukumu au maagizo yenye nguvu ya kisheria; “kutekeleza” huwasilisha תעשה kwa Kiswahili cha kawaida.
- source_word: וְשָׁמַרְתָּ אֶת כָּל מִצְוֺתַי
  choice: na kuzishika amri zangu zote
  rationale: “Kushika amri” ni usemi wa kawaida wa Kiswahili unaodumisha lugha ya utii wa agano ya שׁמר.
- source_word: לָלֶכֶת בָּהֶם
  choice: kwa kuishi kulingana nazo
  rationale: Infinitive hii inaeleza namna amri zinavyoshikwa katika mwenendo. “Kuishi kulingana nazo” huhifadhi maana ya vitendo ya tamathali ya kutembea huku ikiwa ya asili kwa Kiswahili.
- source_word: וַהֲקִמֹתִי אֶת דְּבָרִי אִתָּךְ
  choice: ndipo nitakapolithibitisha neno langu kwako
  rationale: הקים דבר ni nahau ya kuthibitisha au kutimiza jambo lililonenwa. “Kulithibitisha neno” hudumisha neno דבר na uhusiano wake na kitenzi “nilimwambia,” huku “kwako” ikiwakilisha אִתָּךְ.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל דָּוִד אָבִיךָ
  choice: ambalo nilimwambia Daudi baba yako
  rationale: Tafsiri hii hudumisha maana ya moja kwa moja ya דבר, ‘kusema,’ badala ya kuingiza waziwazi maana ya ‘kuahidi’ katika matini kuu.
theological_decisions:
- issue: Uhusiano wa masharti kati ya ujenzi wa hekalu na neno kwa Daudi
  choice: 'Muundo wa sharti umehifadhiwa: utii wa Sulemani unatangulia kuthibitishwa kwa neno la Mungu kwake.'
  alternative: Kulieleza neno hili ama kama agano lisilo na masharti kabisa ama kama ahadi yenye masharti kabisa inayofuta vipengele vingine vya agano la Daudi.
  rationale: Sintaksia ya Kiebrania ina muundo dhahiri wa אִם (‘ikiwa/uki-’) na matokeo yake. Tafsiri haiamui mvutano mpana wa kiteolojia ambao mstari wenyewe hauutatui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Nyumba” limehifadhiwa badala ya “hekalu” ili kudumisha taswira ya Kiebrania; muktadha unabainisha kwamba ni hekalu. Muundo wa mada mwanzoni umewekwa kwa “Kuhusu,” na sharti limeonyeshwa kwa “uki- … ndipo.”
