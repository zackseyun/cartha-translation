review_pass:
  verdict: revise
  source_fidelity: The conditional sequence, the three covenant-obedience terms, the repeated conduct metaphor, and the idiom of establishing God's word are substantially represented. However, “masharti” commonly means conditions/terms and can misleadingly merge God’s statutes with the verse’s conditional construction; “maagizo” better represents חֻקּוֹת while retaining a distinction from “hukumu” and “amri.”
  naturalness: The sentence is clear and idiomatic in Standard East African Swahili. “Kuhusu ... :” appropriately introduces the topical Hebrew phrase, and the uki- ... ndipo construction naturally conveys the protasis and consequence.
  terminology: Retain “nyumba,” “hukumu,” and “amri” as distinct terms. Revise “masharti” to “maagizo” for statutes. The main rendering “kulithibitisha neno langu kwako” and its note suitably preserve the Hebrew idiom without forcing “ahadi” into the text.
  issues:
  - severity: medium
    issue: “Masharti yangu” for חֻקֹּתַי
    rationale: In contemporary Swahili, “masharti” primarily denotes conditions or stipulated terms. In this verse it may be heard as a second reference to the if-condition rather than as God’s prescribed statutes. “Maagizo yangu” is natural and accurately conveys binding divine prescriptions while remaining distinct from “hukumu zangu” and “amri zangu.”
  revised_text: 'Kuhusu nyumba hii unayoijenga: Ukifuata maagizo yangu, ukitekeleza hukumu zangu, na kuzishika amri zangu zote kwa kuishi kulingana nazo, ndipo nitakapolithibitisha neno langu kwako[a], ambalo nilimwambia Daudi baba yako.'
  revised_footnotes:
