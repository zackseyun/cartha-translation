  text: In the inner sanctuary he made two cherubim of olivewood[b][a], each ten cubits high.
translation:
  language: sw
  text: Ndani ya patakatifu pa ndani[b] akatengeneza makerubi wawili kwa mbao za mzeituni; kila mmoja alikuwa na urefu wa dhiraa kumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “urefu wake ulikuwa dhiraa kumi”; umoja hapa unaeleweka kumhusu kila mmoja wa makerubi hao wawili.
    reason: lexical_alternative
  - marker: b
    text: Au “Ndani ya Patakatifu Zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדְּבִיר
  choice: Ndani ya patakatifu pa ndani
  rationale: Neno דְּבִיר humaanisha chumba cha ndani kabisa cha hekalu. Tafsiri hii ni wazi na ya kawaida, huku ikiepuka kuingiza kwa lazima istilahi ya baadaye ya kiufundi.
- source_word: כְרוּבִים
  choice: makerubi
  rationale: Hili ndilo umbo la kawaida la Kiswahili kwa viumbe hawa maalumu wa kibiblia, na linahifadhi utambulisho wao kuliko kutumia maelezo ya jumla.
- source_word: עֲצֵי שָׁמֶן
  choice: kwa mbao za mzeituni
  rationale: Kirai hiki hurejelea mbao za mti wa mzeituni; usemi huu ni wa asili na unaeleweka katika Kiswahili cha kisasa.
- source_word: עֶשֶׂר אַמּוֹת
  choice: dhiraa kumi
  rationale: Dhiraa ni kipimo cha kale kinacholingana na אַמָּה na ndilo neno la Kiswahili lililozoeleka katika muktadha wa Biblia.
- source_word: קוֹמָתוֹ
  choice: kila mmoja alikuwa na urefu
  rationale: Kiebrania kina kiambishi cha umoja, kihalisi ‘urefu wake,’ ingawa makerubi wawili wametajwa. Umoja huo umeeleweka kwa maana ya mgawanyo, ukimhusu kila mmoja.
- source_word: וַיַּעַשׂ
  choice: akatengeneza
  rationale: Kitenzi עשה ni kitenzi cha kawaida cha kufanya au kutengeneza; ‘akatengeneza’ kinafaa kwa vitu vilivyoundwa kwa mbao na kinaendeleza simulizi kwa kawaida.
