translation:
  language: sw
  text: Vivyo hivyo, kwa ajili ya mlango wa ukumbi mkuu alitengeneza miimo ya mlango kwa mbao za mzeituni, yenye pande nne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “kwa fremu yenye pande nne” au “mraba.” Kirai cha Kiebrania, kihalisi “kutoka sehemu ya nne,” ni kigumu kueleweka katika muktadha wa usanifu na huenda kinaeleza umbo la mlango.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: Vivyo hivyo
  rationale: Inaonyesha ulinganifu na kazi iliyoelezwa katika mstari uliotangulia na kudumisha mwendelezo wa simulizi.
- source_word: עָשָׂה
  choice: alitengeneza
  rationale: Ni tafsiri ya kawaida na ya asili katika muktadha wa ujenzi.
- source_word: לְפֶתַח
  choice: kwa ajili ya mwingilio
  rationale: Neno hili linarejelea nafasi ya kuingilia katika muundo wa jengo, si uwazi wa kawaida tu.
- source_word: הַהֵיכָל
  choice: ukumbi mkuu
  rationale: Katika maelezo ya hekalu, neno hili ni chumba kikuu kilicho mbele ya Patakatifu pa Patakatifu; ‘ukumbi mkuu’ ni wazi zaidi kwa wasomaji wa kawaida kuliko istilahi maalumu ya usanifu.
- source_word: מְזוּזוֹת
  choice: miimo ya mlango
  rationale: Hurejelea nguzo wima zilizo pembeni mwa mlango.
- source_word: עֲצֵי שָׁמֶן
  choice: mbao za mzeituni
  rationale: Ni ulinganifu wa kawaida wa Kiswahili kwa mbao zinazotokana na miti ya mzeituni.
- source_word: מֵאֵת רְבִעִית
  choice: ikiwa na pande nne
  rationale: Kirai hiki ni kigumu katika Kiebrania na huenda kinaeleza umbo au fremu ya mwingilio. Tafsiri hii inasomeka kwa kawaida, huku kutokuwa na uhakika kukielezwa katika tanbihi.
