lexical_decisions:
- source_word: וַיְצַף
  choice: akawafunika
  rationale: Katika muktadha wa ujenzi wa hekalu, kitenzi צפה humaanisha kufunika kitu kwa tabaka la nyenzo, hasa metali. ‘Akawafunika’ ni Kiswahili cha kawaida kinachoeleza kitendo hicho bila kudai mbinu hususa ambayo Kiebrania hakuitaji.
- source_word: אֶת
  choice: hakutafsiriwa moja kwa moja
  rationale: אֶת ni alama ya yambwa mahsusi katika Kiebrania na haina neno linalolingana nayo moja kwa moja katika Kiswahili.
- source_word: הַכְּרוּבִים
  choice: makerubi
  rationale: ‘Makerubi’ ni umbo la wingi linalotambulika katika Kiswahili cha Biblia na linafaa kwa viumbe hawa katika samani takatifu za hekalu.
- source_word: זָהָב
  choice: kwa dhahabu
  rationale: Nomino hii hutaja nyenzo iliyotumiwa kufunika makerubi; ‘kwa dhahabu’ ni muundo wa kawaida wa Kiswahili unaoonyesha nyenzo hiyo.
