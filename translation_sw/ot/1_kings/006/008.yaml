base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/008.yaml
  text: The entrance to the middle side chamber was on the right side of the house[a], and by winding stairs they went up to the middle story[b], and from the middle to the third.
translation:
  language: sw
  text: Uingilio wa chumba cha pembeni cha katikati ulikuwa kwenye upande wa kulia wa nyumba. Walipanda kwa ngazi za kupindapinda[a] hadi ghorofa ya kati, na kutoka ghorofa ya kati hadi ya tatu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ngazi za ond.” Neno la Kiebrania huenda linarejelea ngazi zinazozunguka au kupindapinda.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kutoka ya kati hadi ya tatu,” yaani, kutoka ghorofa ya kati hadi ghorofa ya tatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתַח
  choice: uingilio
  rationale: Neno hili linamaanisha sehemu ya kuingilia au uwazi wa mlango; “uingilio” ni la kawaida na linafaa katika maelezo ya jengo.
- source_word: הַצֵּלָע הַתִּיכֹנָה
  choice: chumba cha pembeni cha katikati
  rationale: Katika maelezo ya Hekalu, צֵלָע hurejelea chumba au jengo dogo la pembeni, si ubavu halisi; umoja wa Kiebrania umehifadhiwa.
- source_word: אֶל כֶּתֶף הַבַּיִת הַיְמָנִית
  choice: ulikuwa upande wa kulia wa nyumba
  rationale: כֶּתֶף kwa maana halisi ni bega, lakini hapa humaanisha upande wa jengo. יְמָנִית imetafsiriwa “wa kulia” bila kuibadili kimyakimya kuwa “kusini.”
- source_word: וּבְלוּלִּים
  choice: kwa ngazi zinazopinda
  rationale: Neno hili adimu hueleweka kwa kawaida kuwa ngazi zinazozunguka au kupinda. Tafsiri hii ni wazi kwa msomaji wa sasa huku tanbihi ikihifadhi uwezekano wa ngazi za mzunguko.
- source_word: יַעֲלוּ
  choice: walipanda
  rationale: Kitenzi kiko katika nafsi ya tatu wingi na hapa kinaeleza kwa namna isiyotaja watu mahususi jinsi watu walivyofika ghorofa za juu.
- source_word: עַל הַתִּיכֹנָה
  choice: hadi ghorofa ya kati
  rationale: Mfuatano wa viwango vya jengo unaonyesha kuwa “ya kati” hapa ni ghorofa au kiwango cha kati.
- source_word: וּמִן הַתִּיכֹנָה אֶל הַשְּׁלִשִׁים
  choice: na kutoka ghorofa ya kati hadi ya tatu
  rationale: Kiebrania kinasema kwa ufupi “kutoka ya kati hadi ya tatu.” Neno “ghorofa” limewekwa wazi mara moja ili sentensi iwe ya kawaida na maana ya usanifu ieleweke.
