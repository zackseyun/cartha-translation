translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Sentensi ndefu ya Kiebrania imegawanywa katika sentensi mbili kwa ufasaha bila kupoteza uhusiano wa mawazo. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
