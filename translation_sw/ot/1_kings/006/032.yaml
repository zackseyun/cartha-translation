base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/032.yaml
  text: Also[a], the two doors were of olivewood, and he carved on them engravings of cherubim and palm trees and open flowers, and overlaid them with gold[b]; and he spread the gold over the cherubim and over the palm trees.
translation:
  language: sw
  text: Pia, milango hiyo miwili ilikuwa ya mbao za mzeituni. Alichonga kwenye milango hiyo nakshi za makerubi, mitende, na maua yaliyochanua, kisha akavifunika kwa dhahabu. Akaeneza dhahabu juu ya makerubi na juu ya mitende.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kiebrania hapa kwa kawaida humaanisha “alishusha”; katika muktadha huu kinaeleza kueneza au kuweka dhahabu juu ya maumbo yaliyochongwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי דַּלְתוֹת עֲצֵי שֶׁמֶן
  choice: Pia, milango hiyo miwili ilikuwa ya mbao za mzeituni
  rationale: “Pia” huendeleza uhusiano wa nyongeza wa וּ; דַּלְתוֹת ni milango au vibao vya milango, na עֲצֵי שֶׁמֶן hapa inaeleweka kuwa mbao za mzeituni.
- source_word: וְקָלַע עֲלֵיהֶם מִקְלְעוֹת
  choice: Alichonga juu yake nakshi
  rationale: Kitenzi na nomino zake zinaeleza kazi ya mapambo yaliyochongwa; “nakshi” ni neno la kawaida na lenye hadhi kwa mapambo yaliyochongwa kwenye mbao.
- source_word: כְּרוּבִים
  choice: makerubi
  rationale: Huhifadhi istilahi ya kibiblia ya viumbe hawa wanaohusishwa na uwepo na kiti cha enzi cha Mungu, bila kuwafanya waonekane kama watoto wadogo wenye mabawa.
- source_word: תִמֹרוֹת
  choice: mitende
  rationale: Katika mapambo ya hekalu, neno hili linataja maumbo au picha za mitende; “mitende” ni wazi na ya asili kwa msomaji wa Kiswahili.
- source_word: וּפְטוּרֵי צִצִּים
  choice: na maua yaliyochanua
  rationale: Kirai kinaeleza mapambo ya maua yaliyofunguka; tafsiri hii huwasilisha sura inayoonekana bila kutaja aina maalumu ya ua.
- source_word: וְצִפָּה זָהָב
  choice: kisha akaifunika kwa dhahabu
  rationale: צפה katika ujenzi humaanisha kufunika uso kwa tabaka la metali. Kiwakilishi cha umoja “-i-” kinarejelea kwa ujumla kazi ya nakshi iliyokuwa juu ya milango.
- source_word: וַיָּרֶד ... אֶת־הַזָּהָב
  choice: Akaeneza dhahabu juu ya
  rationale: Muundo huu usio wa kawaida hutumia kitenzi ambacho kwa kawaida humaanisha “kushusha”; katika muktadha wa kupaka dhahabu, “akaeneza” hutoa maana ya kuweka dhahabu juu ya sehemu zilizochongwa huku tanbihi ikihifadhi taswira halisi.
