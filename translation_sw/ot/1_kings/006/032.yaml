  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la ujenzi wa hekalu. “Nakshi” hutumiwa kwa mapambo yaliyochongwa, na “makerubi” huhifadhi istilahi iliyozoeleka katika Biblia za Kiswahili.
