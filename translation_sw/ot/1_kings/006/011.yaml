  text: And the word of Yahweh came to Solomon[a], saying[b],
translation:
  language: sw
  text: Neno la Yahwe likamjia Sulemani, likisema:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “Ikawa, neno la Yahwe likamjia Sulemani, kusema.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: likamjia
  rationale: Katika mfululizo huu wa masimulizi, kitenzi hiki kinaendeleza simulizi. Kiswahili huwasilisha kwa kawaida wazo hilo kwa kiambishi cha mfululizo -ka- bila tafsiri nzito ya neno kwa neno kama ‘ikawa’.
- source_word: דְּבַר
  choice: Neno
  rationale: Katika usemi wa kawaida wa kinabii דְּבַר יְהוָה, ‘Neno’ huhifadhi kwa uwazi dhana ya mawasiliano kutoka kwa Mungu na uhusiano wake na kauli nyingine za Biblia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi ‘Yahwe’ badala ya kubadilishwa kuwa cheo ‘BWANA’.
- source_word: אֶל
  choice: -mjia
  rationale: Kiambishi cha mtendewa katika ‘likamjia’ kinaonyesha kwa Kiswahili cha kawaida kwamba Sulemani ndiye aliyepokea neno hilo.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia na matumizi mapana ya Kiswahili.
- source_word: לֵאמֹר
  choice: likisema
  rationale: Neno hili linatanguliza maneno ya Mungu yanayofuata katika mstari unaofuata; ‘likisema’ huhifadhi kiungo hicho cha kisarufi na kimawazo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kuweka cheo mahali pake, bila kuingiza msimamo wa dhehebu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa sasa, na unaosomeka kwa urahisi. Muundo ‘likamjia’ unaendeleza simulizi kwa kawaida, huku ‘likisema’ kikihifadhi utangulizi wa kauli inayofuata.
