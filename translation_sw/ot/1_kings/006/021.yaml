base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/021.yaml
  text: Solomon overlaid the inside of the house with pure gold[a], and he drew gold chains across the front of the inner sanctuary[c][b], and overlaid it with gold.
translation:
  language: sw
  text: Solomoni akaifunika nyumba kwa ndani kwa dhahabu safi[a]. Akapitisha minyororo ya dhahabu mbele ya patakatifu pa ndani[b][c], nayo akaifunika kwa dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhahabu iliyosafishwa.” Kirai cha Kiebrania, neno kwa neno, ni “dhahabu iliyofungwa,” nahau inayomaanisha dhahabu yenye ubora wa juu.
    reason: lexical_alternative
  - marker: b
    text: Au, “akapanga minyororo ya dhahabu kuvuka sehemu ya mbele ya patakatifu pa ndani.” Kiebrania kinaweza kumaanisha minyororo iliyowekwa mbele yake au iliyopitishwa kutoka upande mmoja hadi mwingine.
    reason: alternative_reading
  - marker: c
    text: “Patakatifu pa ndani” ni debiri, yaani chumba cha ndani kabisa cha hekalu, ambacho baadaye kiliitwa Patakatifu Zaidi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: akaifunika
  rationale: Katika muktadha wa ujenzi wa hekalu, kitenzi צפה humaanisha kufunika uso kwa tabaka la kitu, hapa dhahabu.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Hili ndilo neno la moja kwa moja la Kiebrania; katika muktadha linamaanisha jengo la hekalu.
- source_word: מִפְּנִימָה
  choice: sehemu ya ndani
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya eneo la ndani la nyumba.
- source_word: זָהָב סָגוּר
  choice: dhahabu safi
  rationale: Kirai hiki cha Kiebrania ni nahau inayomaanisha dhahabu yenye ubora wa juu, labda iliyosafishwa.
- source_word: וַיְעַבֵּר
  choice: akapitisha
  rationale: Huhifadhi maana ya msingi ya kusababisha kitu kipite huku ikifaa kwa minyororo iliyowekwa mbele ya chumba cha ndani.
- source_word: בְּרַתּוּקוֹת
  choice: minyororo
  rationale: Nomino hii adimu inaeleweka zaidi kuwa vitu vilivyounganishwa kama minyororo, vilivyotengenezwa kwa dhahabu.
- source_word: לִפְנֵי הַדְּבִיר
  choice: mbele ya patakatifu pa ndani
  rationale: Tafsiri hii huhifadhi uhusiano wa mahali bila kuamua kwa uhakika kwamba minyororo ilivutwa kutoka upande mmoja hadi mwingine.
- source_word: הַדְּבִיר
  choice: patakatifu pa ndani
  rationale: דביר ni chumba cha ndani kabisa cha hekalu; usemi huu unaeleweka na huepuka kuingiza jina la baadaye katika matini kuu.
- source_word: וַיְצַפֵּהוּ
  choice: akapafunika
  rationale: Kiambishi cha umoja kinarejelea kwa uwezekano mkubwa patakatifu pa ndani au sehemu yake ya mbele; umbo la ngeli ya mahali hudumisha urejeo huo bila kuubainisha kupita kiasi.
