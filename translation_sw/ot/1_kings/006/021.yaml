translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Nyumba” imehifadhiwa kwa uaminifu kwa Kiebrania, huku muktadha ukionyesha kuwa ni hekalu. Alama zote za tanbihi zimewekwa katika matini kuu.
