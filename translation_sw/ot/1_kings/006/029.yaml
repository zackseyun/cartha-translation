  text: He carved all the walls of the house all around with engraved figures of cherubim[a], palm trees, and open flowers[c][b], on the inner and outer walls.
translation:
  language: sw
  text: Akachonga kuta zote za nyumba hiyo kuzunguka pande zote, akizitia nakshi za makerubi, mitende, na maua yaliyochanua[a], kwa ndani na kwa nje[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “machipukizi ya maua” au “maua yanayofunguka”; maneno ya Kiebrania yanaeleza mapambo yenye maumbo ya maua, lakini umbo lake kamili halijulikani.
    reason: lexical_alternative
  - marker: b
    text: Kauli hii inaweza pia kutafsiriwa “ndani na nje.” Marejeleo yake hasa—kuta, nyuso, au sehemu za jengo—hayako wazi kabisa katika Kiebrania.
    reason: alternative_reading
lexical_decisions:
- source_word: קִירוֹת הַבַּיִת
  choice: kuta za nyumba hiyo
  rationale: Neno בַּיִת ni ‘nyumba’ kihalisi na hapa humaanisha jengo la hekalu; ‘nyumba hiyo’ huhifadhi istilahi ya Kiebrania huku muktadha ukibainisha maana.
- source_word: מֵסַב
  choice: pande zote
  rationale: Huwasilisha wazo la eneo lote linalozunguka kwa Kiswahili cha kawaida.
- source_word: קָלַע ... פִּתּוּחֵי מִקְלְעוֹת
  choice: akachonga ... kwa michoro
  rationale: Muunganiko huu unaeleza kazi ya kuchonga mapambo yenye maumbo; tafsiri hii ni ya asili bila kudai kwa uhakika kwamba yalikuwa nakshi za aina fulani.
- source_word: כְּרוּבִים
  choice: makerubi
  rationale: Hili ndilo umbo la kawaida la Kiswahili kwa viumbe hawa wa mbinguni katika muktadha wa hekalu.
- source_word: תִמֹרֹת
  choice: mitende
  rationale: Neno hilo huonyesha maumbo au motifu za mitende katika mapambo; ‘mitende’ ni wazi na fupi.
- source_word: פְטוּרֵי צִצִּים
  choice: maua yaliyochanua
  rationale: Huwasilisha mapambo ya maua yaliyofunguka, huku kutokuwa na uhakika kuhusu umbo mahususi kukielezwa katika tanbihi.
- source_word: מִלִּפְנִים וְלַחִיצוֹן
  choice: upande wa ndani na upande wa nje
  rationale: Huhifadhi tofauti ya ndani na nje bila kuamua kimya kimya ikiwa maneno hayo yanarejelea kuta, sehemu, au maeneo ya patakatifu.
