  text: וַ/יִּתֵּ֨ן אֶת הַ/כְּרוּבִ֜ים בְּ/ת֣וֹךְ הַ/בַּ֣יִת הַ/פְּנִימִ֗י וַֽ/יִּפְרְשׂוּ֮ אֶת כַּנְפֵ֣י הַ/כְּרֻבִים֒ וַ/תִּגַּ֤ע כְּנַף הָֽ/אֶחָד֙ בַּ/קִּ֔יר וּ/כְנַף֙ הַ/כְּר֣וּב הַ/שֵּׁנִ֔י נֹגַ֖עַת בַּ/קִּ֣יר הַ/שֵּׁנִ֑י וְ/כַנְפֵי/הֶם֙ אֶל תּ֣וֹךְ הַ/בַּ֔יִת נֹגְעֹ֖ת כָּנָ֥ף אֶל כָּנָֽף־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/027.yaml
  text: He placed the cherubim inside the inner house[a], and the cherubim spread out their wings, so that the wing of the one touched the wall, and the wing of the second cherub touched the other wall; and their wings toward the middle of the house were touching wing to wing.
translation:
  language: sw
  text: Akawaweka makerubi ndani ya nyumba ya ndani[a]. Makerubi hayo yakatandaza mabawa yao, hata bawa la kerubi mmoja likagusa ukuta, na bawa la kerubi wa pili likagusa ukuta mwingine; nayo mabawa yao yaliyoelekea katikati ya nyumba yakagusana, bawa kwa bawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya patakatifu pa ndani.” Kiebrania kinasema kihalisi “ndani ya nyumba ya ndani,” kikimaanisha sehemu ya ndani kabisa ya hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Akawaweka
  rationale: Kitenzi נתן katika muktadha huu wa ujenzi humaanisha kuweka au kupanga mahali; “akawaweka” ni cha kawaida na kinaonyesha kuwa makerubi yaliwekwa mahali maalumu.
- source_word: הַכְּרוּבִים
  choice: makerubi
  rationale: “Makerubi” ni umbo la Kiswahili linalotambulika kwa viumbe hawa wa mbinguni na linadumisha hadhi ya lugha ya ibada.
- source_word: בְּתוֹךְ הַבַּיִת הַפְּנִימִי
  choice: ndani ya nyumba ya ndani
  rationale: Tafsiri hii inadumisha neno la Kiebrania בַּיִת, “nyumba,” na pia tofauti ya sehemu ya ndani kabisa ya hekalu; mbadala unaofafanua zaidi umewekwa katika tanbihi.
- source_word: וַיִּפְרְשׂוּ אֶת כַּנְפֵי הַכְּרֻבִים
  choice: Makerubi hayo yakatandaza mabawa yao
  rationale: Ingawa muundo wa Kiebrania unaweza kusomeka rasmi kuwa “wakatandaza mabawa ya makerubi,” muktadha unaelekeza kwa makerubi wenyewe kuwa watendaji; Kiswahili hiki ni cha kawaida bila kubadili maana.
- source_word: וַתִּגַּע / נֹגַעַת / נֹגְעֹת
  choice: likagusa / likagusa / yakagusana
  rationale: Mzizi נגע unaonyesha kugusana halisi. Mwisho wa aya umetafsiriwa “yakagusana” ili kuwasilisha kwa kawaida hali ya mabawa mawili kugusa moja na jingine.
- source_word: כְּנַף הָאֶחָד
  choice: bawa la kerubi mmoja
  rationale: Kiebrania kinasema kihalisi “bawa la mmoja”; kuongeza “kerubi” kunabainisha rejeo ambalo tayari liko wazi katika muktadha bila kulifanya kuwa “wa kwanza.”
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: kerubi wa pili
  rationale: Hii inadumisha moja kwa moja namba ya mpangilio ya Kiebrania, “wa pili.”
- source_word: הַקִּיר הַשֵּׁנִי
  choice: ukuta mwingine
  rationale: Kihalisi ni “ukuta wa pili,” lakini katika ulinganisho wa kuta mbili, “ukuta mwingine” ni Kiswahili cha kawaida na sahihi.
- source_word: וְכַנְפֵיהֶם אֶל תּוֹךְ הַבַּיִת
  choice: mabawa yao yaliyoelekea katikati ya nyumba
  rationale: תּוֹךְ hapa inaonyesha sehemu ya kati au ndani; kwa kuwa mabawa hayo yanakutana, “kuelekea katikati” huonyesha mpangilio wa mahali kwa uwazi.
- source_word: כָּנָף אֶל כָּנָף
  choice: bawa kwa bawa
  rationale: Usemi huu unadumisha taswira halisi ya Kiebrania ya bawa moja kugusa jingine.
