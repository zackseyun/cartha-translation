translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Nyumba' limehifadhiwa kwa ukaribu na המקור, huku muktadha ukionyesha kuwa ni nyumba ya Mungu/hekalu. Sentensi ya kwanza imeundwa kwa njia ya kawaida ya Kiswahili ili kueleza ufunikaji wa ndani kwa mbao za mwerezi.
