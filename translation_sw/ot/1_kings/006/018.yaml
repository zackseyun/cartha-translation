  yaml_path: translation/ot/1_kings/006/018.yaml
  text: The cedar on the inside of the house was carved with gourds and open flowers[a]. Everything was cedar[b]; no stone was visible.
translation:
  language: sw
  text: Sehemu ya ndani ya nyumba hiyo ilifunikwa kwa mbao za mwerezi zilizochongwa kwa nakshi za maumbo ya maboga[a] na maua yaliyochanua[b]. Yote yalikuwa ya mwerezi; hakuna jiwe lililoonekana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “machipukizi.” Neno la Kiebrania linataja maumbo ya mapambo ya duara, na hapa huenda ni nakshi zenye umbo la maboga.
    reason: lexical_alternative
  - marker: b
    text: Au, “maua yanayofunguka.” Inaelekea Kiebrania kinaeleza nakshi za maua yaliyochanua.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶז
  choice: mbao za mwerezi
  rationale: Neno hili humaanisha mwerezi au mbao zake; katika muktadha huu linarejelea mbao za mwerezi zilizofunika sehemu ya ndani.
- source_word: אֶל־הַבַּיִת פְּנִימָה
  choice: Ndani ya nyumba hiyo
  rationale: Kirai kinaelekeza kwenye uso wa ndani wa jengo; muundo huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: מִקְלַעַת
  choice: zilizochongwa
  rationale: Neno linataja kazi ya mapambo yaliyochongwa au kunakshiwa katika mbao.
- source_word: פְּקָעִים
  choice: maumbo ya maboga
  rationale: Katika maelezo ya hekalu, neno linaweza kutaja mapambo ya mviringo yanayofanana na maboga; kutaja 'maumbo' hufafanua kwamba ni nakshi, si maboga halisi.
- source_word: וּפְטוּרֵי צִצִּים
  choice: na maua yaliyochanua
  rationale: Kirai kinaelekea kueleza nakshi za maua yaliyofunguka au kuchanua.
- source_word: הַכֹּל אֶרֶז
  choice: Kila sehemu ilikuwa ya mwerezi
  rationale: Hii inaonyesha kwamba uso wote ulioonekana ndani ulifunikwa kwa mwerezi, bila kudai kwamba muundo mzima wa jengo ulikuwa mbao.
- source_word: אֵין אֶבֶן נִרְאָה
  choice: hakuna jiwe lililoonekana
  rationale: Tafsiri hii ni ya kawaida na inadumisha hali ya kutendwa ya kauli ya Kiebrania.
