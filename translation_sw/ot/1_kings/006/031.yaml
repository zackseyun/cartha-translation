  text: For the entrance of the inner sanctuary he made doors of olivewood[a]; the doorposts and jambs were five-sided.
translation:
  language: sw
  text: Kwenye ingilio la patakatifu pa ndani, alitengeneza milango ya mbao za mzeituni; nguzo za mlango na miimo zilikuwa na pande tano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fremu na miimo ya mlango ilikuwa sehemu ya tano.” Hii ni tafsiri ya kimapokeo, lakini maana yake ya kiusanifu haiko wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: mwingilio
  rationale: Neno hili linamaanisha nafasi au njia ya kuingilia, tofauti na milango yenyewe inayotajwa baadaye.
- source_word: הַדְּבִיר
  choice: patakatifu pa ndani
  rationale: Katika muktadha wa hekalu, neno hili linataja chumba cha ndani kabisa; tafsiri hii ni wazi bila kuingiza istilahi ya baadaye kwa nguvu.
- source_word: דַּלְתּוֹת
  choice: milango
  rationale: Wingi wa Kiebrania unaelekea kutaja sehemu mbili za mlango; 'milango' ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: עֲצֵי שָׁמֶן
  choice: mti wa mzeituni
  rationale: Kirai hiki kinamaanisha mbao zitokanazo na mzeituni; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: הָאַיִל
  choice: nguzo za mlango
  rationale: Katika matumizi ya kiusanifu, neno linaweza kutaja sehemu ya fremu au nguzo inayotegemeza mlango; hapa limewekwa tofauti na miimo.
- source_word: מְזוּזוֹת
  choice: miimo yake
  rationale: Neno hili kwa kawaida hutaja nguzo za pembeni za mlango; 'miimo' huhifadhi tofauti ya kiusanifu na neno lililotangulia.
- source_word: חֲמִשִׁית
  choice: zilikuwa na pande tano
  rationale: Kiebrania ni kifupi na maana ya usanifu si hakika; tafsiri hii inatoa maana inayowezekana ya umbo huku usomaji mwingine ukiwekwa katika tanbihi.
