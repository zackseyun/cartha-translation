lexical_decisions:
- source_word: וַיִּבֶן
  choice: akaijenga
  rationale: Qal wayyiqtol ya בנה inaendeleza simulizi kwa tendo la wakati uliopita; “akaijenga” ni Kiswahili cha kawaida na huonyesha mwendelezo huo.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: הַבַּיִת
  choice: ile nyumba
  rationale: בַּיִת humaanisha kihalisi “nyumba.” Katika muktadha huu ni hekalu; lakini kutafsiri “ile nyumba” kunahifadhi usemi wa Kiebrania huku rejeo likiwa wazi kutokana na muktadha.
- source_word: וַיְכַלֵּהוּ
  choice: na kuikamilisha
  rationale: Piel ya כלה pamoja na kiambishi cha nafsi ya tatu umoja wa kiume humaanisha kukamilisha kitu. “Kuikamilisha” hurejelea moja kwa moja nyumba na kueleza kwamba kazi ilifikishwa mwisho.
