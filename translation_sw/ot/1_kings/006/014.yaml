  text: Sulemani akaijenga nyumba hiyo, akaikamilisha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hekalu.” Kiebrania husema kihalisi “nyumba,” neno linalotumiwa kwa kawaida kurejelea hekalu katika muktadha huu.
