  to: Nyumba[a] ilipokuwa ikijengwa, ilijengwa kwa mawe yaliyokamilika, yaliyochimbwa mapema machimboni; wala sauti ya nyundo, ya shoka, wala ya chombo chochote cha chuma haikusikika katika nyumba wakati ilipokuwa ikijengwa.
