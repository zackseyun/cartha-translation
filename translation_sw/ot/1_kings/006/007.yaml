base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/007.yaml
  text: The house[a], when it was built, was built of finished stone quarried in advance; and no hammer or axe or any iron tool was heard in the house while it was being built.
translation:
  language: sw
  text: Nyumba[a] ilipokuwa ikijengwa, ilijengwa kwa mawe yaliyokamilika, yaliyochimbwa mapema machimboni; wala sauti ya nyundo, ya shoka, wala ya chombo chochote cha chuma haikusikika katika nyumba wakati ilipokuwa ikijengwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mawe yaliyokamilika, yaliyotayarishwa machimboni.” Neno la Kiebrania מַסָּע ni la kitaalamu na huenda linarejelea uchimbaji wa mawe au kuletwa kwa mawe kutoka machimboni yakiwa tayari yameandaliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Neno la Kiebrania ni ‘nyumba.’ Katika muktadha huu linamaanisha hekalu, lakini ‘nyumba’ huhifadhi tamko la chanzo na matumizi mapana ya kibiblia ya ‘nyumba ya BWANA.’
- source_word: בְּהִבָּנֹתוֹ
  choice: ilipokuwa ikijengwa / wakati ilipokuwa ikijengwa
  rationale: Muundo wenye בְּ na kitenzi-jina unaonyesha wakati. Tafsiri hizi mbili za asili moja zinaweka wazi tendo lililokuwa likiendelea wakati wa ujenzi.
- source_word: אֶבֶן שְׁלֵמָה
  choice: mawe yaliyokamilishwa
  rationale: שְׁלֵמָה huonyesha ukamilifu au kuwa kamili. Katika muktadha wa ujenzi, maana ni mawe yaliyokuwa yameandaliwa kikamilifu kabla ya kuwekwa kwenye jengo.
- source_word: מַסָּע
  choice: mapema
  rationale: Neno hili la kitaalamu linaweza kuhusiana na machimbo, uchimbaji, au kuletwa kwa mawe yakiwa tayari. Katika sentensi, ‘yaliyokamilishwa mapema’ huwasilisha kwamba maandalizi yalifanywa kabla ya mawe kufika eneo la ujenzi, huku tanbihi ikihifadhi uwezekano wa kutaja machimbo moja kwa moja.
- source_word: נִבְנָה
  choice: ilijengwa
  rationale: Nifali timilifu inaeleza namna nyumba ilivyojengwa; ‘ilijengwa’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: מַקָּבוֹת
  choice: nyundo
  rationale: Ingawa umbo la Kiebrania ni wingi, hapa zana zinaorodheshwa kama aina; Kiswahili hutumia ‘nyundo’ kwa kawaida bila kulazimisha idadi.
- source_word: הַגַּרְזֶן
  choice: shoka
  rationale: ‘Shoka’ ndiyo maana ya kawaida na inayoeleweka zaidi, ingawa zana inayofanana na tezo imependekezwa pia.
- source_word: כָּל כְּלִי בַרְזֶל
  choice: chombo chochote cha chuma
  rationale: כָּל pamoja na nomino ya umoja ina maana ya kugawa kwa kila kimoja; ‘chombo chochote cha chuma’ huhifadhi ujumla huo.
- source_word: לֹא נִשְׁמַע
  choice: haikusikika
  rationale: Nifali ya שמע ni ‘kusikika.’ Muundo huu wa Kiswahili huonyesha wazi kwamba sauti ya zana hizo haikusikika.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Nyumba’ imehifadhiwa badala ya ‘hekalu’ ili kufuata neno la Kiebrania, ingawa muktadha unaonyesha wazi kuwa ni hekalu. Sentensi imetumia ‘sauti ya’ ili ‘haikusikika’ iwe ya asili katika Kiswahili.
