  text: And he built the inner court with three rows of cut stone and a row of cedar beams[a].
translation:
  language: sw
  text: Akajenga ua wa ndani kwa safu tatu za mawe yaliyochongwa na safu ya mihimili ya mierezi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tabaka tatu za mawe yaliyochongwa na tabaka la mihimili ya mierezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Akajenga
  rationale: Kitenzi hiki cha mfululizo wa masimulizi kinaendeleza tendo linalofuata; “Akajenga” ni cha kawaida na huifadhi mtiririko huo.
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: ua wa ndani
  rationale: חָצֵר hapa ni eneo la ua katika mazingira ya Hekalu, na פְּנִימִית hulitofautisha kuwa la ndani.
- source_word: שְׁלֹשָׁה טוּרֵי
  choice: safu tatu za
  rationale: טוּר inaweza kumaanisha safu ya vitu au tabaka la ujenzi; “safu” ni neno linaloeleweka kwa urahisi huku maana ya kitaalamu ikihifadhiwa katika tanbihi.
- source_word: גָזִית
  choice: mawe yaliyochongwa
  rationale: Neno hili humaanisha mawe yaliyofanyiwa kazi kwa kuyakata au kuyachonga kwa matumizi ya ujenzi.
- source_word: וְטוּר
  choice: na safu moja ya
  rationale: Ingawa namba ‘moja’ haijaandikwa wazi, umoja wa טוּר baada ya safu tatu unaonyesha safu moja zaidi; Kiswahili cha kawaida hunufaika kwa kuiweka wazi.
- source_word: כְּרֻתֹת אֲרָזִים
  choice: mihimili ya mierezi
  rationale: Kirai hiki kinataja vipande vya mierezi vilivyokatwa kwa ujenzi; “mihimili” huwasilisha kazi yake inayowezekana kwa lugha ya kawaida bila kulazimisha maelezo zaidi.
