translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ua wa ndani” ni rahisi kuliko istilahi nzito ya usanifu; tanbihi huhifadhi maana mbadala ya טוּר kama tabaka la ujenzi.
