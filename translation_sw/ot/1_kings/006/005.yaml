base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/005.yaml
  text: He built against the wall of the house a structure all around[a], against the walls of the house all around, around both the nave and the inner sanctuary[c][b]; and he made side rooms all around.
translation:
  language: sw
  text: Akajenga kandokando ya ukuta wa nyumba jengo la ziada lililozunguka[a], kandokando ya kuta za nyumba kuzunguka, kandokando ya ukumbi mkuu[b] na patakatifu pa ndani[c]; akafanya vyumba vya pembeni kuzunguka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiambatisho kinachozunguka.” Neno la Kiebrania יצוע ni adimu na linarejelea muundo uliojengwa kandokando ya kuta za Hekalu.
    reason: lexical_alternative
  - marker: b
    text: “Ukumbi mkuu” ni sehemu kuu ya Hekalu, tofauti na patakatifu pa ndani.
    reason: cultural_note
  - marker: c
    text: Au “patakatifu zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Akajenga
  rationale: Ka- ya masimulizi huwasilisha kwa kawaida mfuatano wa wayyiqtol katika simulizi la Kiswahili.
- source_word: עַל קִיר הַבַּיִת
  choice: kuzunguka ukuta wa nyumba
  rationale: Katika muktadha huu עַל huonyesha jengo lililounganishwa kandokando ya ukuta; tafsiri hii huepuka wazo la kujenga juu ya ukuta.
- source_word: יצוע
  choice: ukuta wa ziada
  rationale: Neno hili ni adimu na maana yake halisi ya kiusanifu si hakika; katika muktadha linataja jengo la nje lililozunguka Hekalu. Tanbihi huhifadhi mbadala mpana zaidi.
- source_word: סָבִיב
  choice: kuzunguka / kandokando / pande zote
  rationale: Maneno haya ya asili ya Kiswahili yanahifadhi msisitizo unaotokana na kurudiwa kwa סָבִיב bila kufanya sentensi iwe nzito kupita kiasi.
- source_word: לַהֵיכָל
  choice: ukumbi mkuu
  rationale: הֵיכָל hapa ni chumba kikuu cha Hekalu, tofauti na patakatifu pa ndani.
- source_word: וְלַדְּבִיר
  choice: patakatifu pa ndani
  rationale: דְּבִיר hurejelea chumba cha ndani kabisa cha Hekalu; uchaguzi huu ni wazi na hauingizi bila lazima istilahi ya baadaye.
- source_word: וַיַּעַשׂ צְלָעוֹת
  choice: akatengeneza vyumba vya pembeni
  rationale: Ingawa צְלָעוֹת inaweza kumaanisha 'mbavu' au 'pande,' muktadha wa usanifu unaonyesha vyumba vilivyokuwa pembeni mwa Hekalu.
theological_decisions:
- issue: Utambulisho wa דְּבִיר
  choice: patakatifu pa ndani
  alternative: Patakatifu Zaidi
  rationale: Tafsiri ya msingi inaeleza nafasi ya chumba kwa upande wa usanifu, huku tanbihi ikihifadhi jina la kidini linalojulikana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa msomaji wa kawaida. Marudio ya wazo la kuzunguka yamehifadhiwa kwa namna ya asili; istilahi za usanifu zimewekwa wazi bila kudai uhakika usiokuwapo katika neno adimu יצוע.
