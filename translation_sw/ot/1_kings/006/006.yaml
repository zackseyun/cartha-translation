translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inatumia “ghorofa” kwa viwango vya jengo la pembeni, “dhiraa” kuhifadhi kipimo cha kale, na “vipunguzo” kwa istilahi ya ujenzi; tanbihi zinaweka wazi uwezekano wa maana nyingine na nyongeza ya kimuktadha ya “boriti.”
