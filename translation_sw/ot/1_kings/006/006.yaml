  text: ה/יצוע הַ/תַּחְתֹּנָ֜ה חָמֵ֧שׁ בָּ/אַמָּ֣ה רָחְבָּ֗/הּ וְ/הַ/תִּֽיכֹנָה֙ שֵׁ֤שׁ בָּֽ/אַמָּה֙ רָחְבָּ֔/הּ וְ/הַ֨/שְּׁלִישִׁ֔ית שֶׁ֥בַע בָּ/אַמָּ֖ה רָחְבָּ֑/הּ כִּ֡י מִגְרָעוֹת֩ נָתַ֨ן לַ/בַּ֤יִת סָבִיב֙ ח֔וּצָ/ה לְ/בִלְתִּ֖י אֲחֹ֥ז בְּ/קִֽירוֹת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/006.yaml
  text: The lowest story was five cubits wide[a], the middle one six cubits wide, and the third seven cubits wide; for he made offsets around the outside of the temple[b], so that the beams would not be inserted into the walls of the temple.
translation:
  language: sw
  text: Ghorofa ya chini ilikuwa na upana wa dhiraa tano, ya katikati dhiraa sita, na ya tatu dhiraa saba; kwa maana alifanya vipunguzo[a] katika upande wa nje wa hekalu pande zote, ili boriti zisiingizwe katika kuta za hekalu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matuta” au “sehemu zilizorudishwa nyuma”; neno la Kiebrania linaweza kutaja maumbo hayo ya ukuta yaliyotokana na ukuta kupungua kwa madaraja.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ili [kitu] kisishike katika kuta za nyumba.” Maana katika muktadha ni kwamba boriti za jengo la pembeni hazikushikizwa katika kuta za hekalu; “boriti” haikutajwa wazi katika Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּצוּעַ
  choice: ghorofa
  rationale: Katika maelezo haya ya ujenzi, neno hilo linataja sehemu ya pembeni iliyopangwa kwa viwango kadhaa. “Ghorofa” linaeleza kwa kawaida na kwa uwazi kila kiwango cha muundo huo.
- source_word: הַתַּחְתֹּנָה
  choice: ya chini
  rationale: Linarejelea ghorofa ya chini katika mfululizo wa chini, katikati, na ya tatu.
- source_word: בָּאַמָּה
  choice: dhiraa
  rationale: Kipimo cha kale kimehifadhiwa badala ya kubadilishwa kuwa kipimo cha kisasa.
- source_word: רָחְבָּהּ
  choice: ilikuwa na upana wa
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza upana uliopimwa.
- source_word: הַתִּיכֹנָה
  choice: ya katikati
  rationale: Kivumishi hiki kinarejelea ghorofa iliyotajwa; nomino haijarudiwa ili sentensi ibaki ya kawaida.
- source_word: הַשְּׁלִישִׁית
  choice: ya tatu
  rationale: Namba ya mpangilio imehifadhiwa kama ilivyo katika Kiebrania, bila kuibadili kuwa “ya juu.”
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu au maelezo ya tofauti za upana wa ghorofa hizo.
- source_word: מִגְרָעוֹת
  choice: vipunguzo
  rationale: Neno linaeleza sehemu za ukuta zilizorudishwa nyuma hatua kwa hatua, zilizotokeza sehemu za kuegeshea mihimili. “Vipunguzo” huhifadhi wazo la muundo huo bila kuamua kabisa kama ulikuwa matuta au nafasi zilizochongwa.
- source_word: נָתַן לַבַּיִת סָבִיב חוּצָה
  choice: alitengeneza vipunguzo kulizunguka hekalu kwa nje
  rationale: Kauli hii inawasilisha kwa Kiswahili cha kawaida wazo la kuweka muundo huo kuzunguka upande wa nje wa jengo; “hekalu” linafafanua maana ya “nyumba” katika muktadha.
- source_word: לְבִלְתִּי אֲחֹז
  choice: ili boriti zisiingizwe
  rationale: Kirai kinaonyesha kusudi la kuzuia kushikiza kitu katika kuta. “Boriti” imetolewa wazi kutokana na muktadha wa ujenzi, lakini tanbihi inahifadhi usemi halisi usiotaja boriti.
- source_word: בְּקִירוֹת הַבָּיִת
  choice: katika kuta za hekalu
  rationale: “Hekalu” linafafanua jengo linalokusudiwa, na “katika” linafaa kwa wazo la kuingiza au kushikiza boriti ndani ya kuta.
