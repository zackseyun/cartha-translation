  text: And he prepared the inner sanctuary within the house[a], to place there the ark of the covenant of Yahweh.
translation:
  language: sw
  text: Ndani ya nyumba, akatayarisha patakatifu pa ndani kabisa[a], ili kuweka humo sanduku la agano la Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania debir, ambalo kijadi hutafsiriwa “mahali pa kutolea matamko”; hapa humaanisha patakatifu pa ndani, yaani chumba cha ndani kabisa cha hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבִיר
  choice: patakatifu pa ndani
  rationale: Katika muktadha wa hekalu, neno hili linamaanisha chumba cha ndani kabisa, yaani sehemu takatifu ya ndani. Tafsiri hii inaeleza mahali na kazi yake kwa Kiswahili cha kawaida kuliko tafsiri ya jadi isiyo wazi kama “mahali pa tamko.”
- source_word: בְּתוֹךְ הַבַּיִת מִפְּנִימָה
  choice: ndani kabisa ya nyumba
  rationale: Kirai hiki kinaonyesha kwa msisitizo kuwa patakatifu palikuwa sehemu ya ndani kabisa ya jengo. “Nyumba” huhifadhi neno la Kiebrania בַּיִת bila kulibadili kimyakimya kuwa “hekalu.”
- source_word: הֵכִין
  choice: akatayarisha
  rationale: Kitenzi kina maana ya kufanya tayari au kupanga kwa kusudi fulani; “akatayarisha” kinaendana kwa kawaida na kusudi linalofuata.
- source_word: לְתִתֵּן שָׁם
  choice: ili kuweka humo
  rationale: Muundo wa kusudi umehifadhiwa kwa “ili,” na “humo” huonyesha mahali palipotajwa bila kurudia maneno.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahweh
  rationale: Tafsiri hii huhifadhi mfuatano wa nomino wa Kiebrania na istilahi iliyozoeleka ya “sanduku la agano.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetolewa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko lina jina la agano יְהוָה moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi na kuwakilisha kwa karibu zaidi matamshi yanayokubaliwa kwa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. Mpangilio wa “patakatifu pa ndani, ndani kabisa ya nyumba” huhifadhi dhana zote mbili za דְבִיר na מִפְּנִימָה bila kurudia kwa namna nzito.
