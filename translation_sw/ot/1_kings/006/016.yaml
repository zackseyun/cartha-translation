base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/016.yaml
  text: He built twenty cubits at the rear of the house with cedar boards[a], from the floor to the walls, and he built it within as an inner sanctuary[c][b], as the Most Holy Place.
translation:
  language: sw
  text: Katika upande wa nyuma wa nyumba akajenga sehemu ya dhiraa ishirini kwa mbao za mierezi[a], kutoka sakafuni hadi kuta; na ndani akajenga patakatifu pa ndani[b], yaani, Mahali Patakatifu Zaidi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka sakafuni hadi mihimili au viguzo.” Maandishi ya Kiebrania yanasema “hadi kuta,” nayo yamehifadhiwa hapa.
    reason: alternative_reading
  - marker: b
    text: Kiebrania debiri, yaani chumba cha ndani kabisa cha Hekalu.
    reason: cultural_note
  - marker: c
    text: 'Tafsiri ya kimapokeo: “Patakatifu pa Patakatifu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִירְכְּתֵי הַבַּיִת
  choice: upande wa nyuma wa nyumba
  rationale: Kirai hiki huonyesha sehemu ya mbali au ya nyuma ya jengo; tafsiri hii ni ya asili katika Kiswahili na inadumisha maana ya mahali.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: kwa mbao za mierezi
  rationale: צלעות inaweza kumaanisha mbavu, sehemu za pembeni, au mbao katika muktadha wa ujenzi. Hapa mbao za mierezi ndizo zilizotumiwa kutengeneza sehemu ya ndani.
- source_word: מִן הַקַּרְקַע עַד הַקִּירוֹת
  choice: kutoka sakafuni mpaka kwenye kuta
  rationale: Maandishi ya Kiebrania ya Kimasora yanasema kihalisi ‘mpaka kwenye kuta.’ Ingawa usemi huo una ugumu wa kimuundo, umehifadhiwa katika matini kuu; tafsiri ya ‘mihimili/viguzo’ imewekwa katika tanbihi.
- source_word: וַיִּבֶן לוֹ מִבַּיִת
  choice: Humo ndani akaijenga
  rationale: Usemi wa Kiebrania umebanwa, lakini unaonyesha kwamba Sulemani alitengeneza sehemu hiyo ndani ya nyumba. Kiswahili hiki kinaeleza mahali na kitendo bila kuongeza maelezo yasiyothibitishwa.
- source_word: לִדְבִיר
  choice: kuwa patakatifu pa ndani
  rationale: דביר ni istilahi ya chumba cha ndani kabisa cha Hekalu. ‘Patakatifu pa ndani’ inaeleza kazi yake kwa Kiswahili kinachoeleweka.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: Patakatifu Zaidi
  rationale: Kirai hiki cha Kiebrania ni namna ya kusisitiza kiwango cha juu cha utakatifu na hutaja chumba kitakatifu kuliko vyote ndani ya Hekalu.
- source_word: אַמָּה
  choice: dhiraa
  rationale: Kipimo cha kale kimehifadhiwa badala ya kubadilishwa kuwa kipimo cha kisasa, ili kudumisha hali na usahihi wa chanzo.
theological_decisions:
- issue: Uhusiano kati ya דביר na קֹדֶשׁ הַקֳדָשִׁים
  choice: patakatifu pa ndani, yaani, Patakatifu Zaidi
  alternative: patakatifu pa ndani kwa ajili ya Patakatifu Zaidi
  rationale: Kishazi cha pili kinafafanua utambulisho au kusudi la דביר. ‘Yaani’ kinaonyesha kwamba majina hayo yanarejelea chumba kilekile bila kuingiza tofauti ya kiteolojia isiyokuwamo wazi katika chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Sentensi zimepangwa kwa mtiririko wa kawaida wa Kiswahili huku vipimo vya kale, istilahi za hekalu, na ugumu halisi wa maandishi ya Kiebrania vikihifadhiwa.
