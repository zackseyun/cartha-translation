translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye staha na inayoeleweka. Maneno “lilikuwa na urefu wa” yameongezwa kwa uwazi wa kipimo, bila kubadili maana ya maelezo ya usanifu.
