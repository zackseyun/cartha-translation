base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/024.yaml
  text: And five cubits was the one wing of the cherub[a], and five cubits the second wing of the cherub; ten cubits from the end of its wings to the end of its wings.
translation:
  language: sw
  text: Bawa moja la kerubi lilikuwa na urefu wa dhiraa tano, na bawa la pili la kerubi lilikuwa na urefu wa dhiraa tano; umbali kutoka ncha moja ya mabawa yake hadi ncha nyingine ulikuwa dhiraa kumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, upana wote kutoka ncha ya bawa moja hadi ncha ya bawa jingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמֵשׁ אַמּוֹת
  choice: dhiraa tano
  rationale: “Dhiraa” ni kipimo cha kawaida cha kibiblia kwa אַמָּה, na mpangilio huu ni wa asili katika Kiswahili.
- source_word: כְּנַף
  choice: bawa
  rationale: Katika muktadha wa kerubi, neno hili linamaanisha wazi bawa.
- source_word: הַכְּרוּב
  choice: kerubi
  rationale: Umoja wa כְּרוּב umetafsiriwa kwa istilahi ya kawaida ya Kiswahili “kerubi.”
- source_word: הָאֶחָת
  choice: moja
  rationale: Kiebrania kinasema “moja,” si moja kwa moja “la kwanza”; tafsiri inahifadhi tofauti hiyo.
- source_word: הַשֵּׁנִית
  choice: la pili
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya namba ya mpangilio inayopatana na “bawa.”
- source_word: עֶשֶׂר אַמּוֹת
  choice: dhiraa kumi
  rationale: Ni jumla ya kipimo cha upana wote wa mabawa.
- source_word: מִקְצוֹת ... וְעַד קְצוֹת
  choice: kutoka ncha moja ... hadi ncha nyingine
  rationale: Usemi huu unaonyesha umbali wote kutoka mwisho mmoja hadi mwingine; “ncha” ni wazi na wa asili kwa mabawa.
- source_word: כְּנָפָיו
  choice: mabawa yake
  rationale: Kiambishi cha umoja wa kiume katika Kiebrania kinarejelea kerubi; Kiswahili hutumia kwa kawaida “yake” bila kulazimisha ufafanuzi zaidi wa jinsia.
