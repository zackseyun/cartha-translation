  text: and two doors of cypress wood[a]; the one door had two folding leaves[b], and the second door had two folding leaves.
translation:
  language: sw
  text: na milango miwili ya mbao za msipresi[a]; mlango mmoja ulikuwa na mabawa mawili yanayokunjika[b], na mlango wa pili ulikuwa na mabawa mawili yanayokunjika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbao za msonobari”; utambulisho kamili wa mti unaomaanishwa na neno la Kiebrania בְּרוֹשׁ hauna uhakika.
    reason: lexical_alternative
  - marker: b
    text: Maneno ya Kiebrania ya usanifu hapa ni adimu. Huenda yakamaanisha mabawa ya mlango yaliyokunjika au sehemu zilizozunguka kwenye bawaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַלְתוֹת
  choice: milango
  rationale: Nomino ya wingi inaeleza milango miwili; “milango” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: עֲצֵי בְרוֹשִׁים
  choice: mbao za msonobari
  rationale: בְּרוֹשׁ ni aina ya mti wa jamii ya mik conifer, lakini utambulisho wake mahususi hauna uhakika; “msonobari” ni neno linaloeleweka kwa mbao za aina hii, huku tanbihi ikihifadhi uwezekano wa msipresi.
- source_word: צְלָעִים / קְלָעִים
  choice: sehemu mbili
  rationale: Maneno haya adimu ya usanifu yanaelekea kumaanisha vipande au mabawa ya mlango; “sehemu” huepuka uhakika usiothibitishwa wa umbo huku muktadha ukieleza kazi yake.
- source_word: גְּלִילִים
  choice: zinazokunjika
  rationale: Neno lina wazo la kuzunguka au kugeuka; katika muundo huu wa mlango, “zinazokunjika” hutoa maana ya kiutendaji inayokubalika, huku tanbihi ikitaja tafsiri nyingine.
- source_word: הַדֶּלֶת הָאַחַת ... הַדֶּלֶת הַשֵּׁנִית
  choice: kila mmoja wa milango hiyo
  rationale: Muhtasari huu wa Kiswahili unaeleza kwa kawaida kwamba maelezo yaleyale yanaihusu kila milango miwili, bila kupoteza ulinganifu wa Kiebrania.
