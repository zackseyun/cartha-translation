lexical_decisions:
- source_word: וַיִּבֶן
  choice: Akajenga
  rationale: Wayyiqtol ya בנה inaendeleza mfululizo wa masimulizi; kiambishi “aka-” kinaonyesha tendo lililofuata kwa Kiswahili cha kawaida.
- source_word: היצוע
  choice: jengo la pembeni
  rationale: Neno hili linaelekea kumaanisha sehemu ya ujenzi iliyounganishwa kandokando ya hekalu; tafsiri hii haitoi uamuzi usio lazima kwamba ni chumba kimoja au vyumba vingi.
- source_word: עַל כָּל הַבַּיִת
  choice: kandokando ya nyumba yote
  rationale: עַל hapa ina maana ya mahali au mgusano na jengo; “kandokando ya” ni ya kawaida katika Kiswahili na huhifadhi wazo la kuenea kwenye nyumba yote bila kudai kuwa lilizunguka pande zote.
- source_word: חָמֵשׁ אַמּוֹת קוֹמָתוֹ
  choice: kimo chake kikiwa dhiraa tano
  rationale: Huhifadhi kiwakilishi cha umilikaji katika קוֹמָתוֹ na kipimo cha kale “dhiraa” kwa mtindo wa kawaida wa Kiswahili.
- source_word: וַיֶּאֱחֹז
  choice: akaliunganisha
  rationale: Ingawa אחז kimsingi ni kushika, katika muktadha wa ujenzi inaeleza kuambatanisha jengo la pembeni na nyumba. Kauli tendaji inaendana na umbo la Kiebrania na mtendaji aliyeanza mstari.
- source_word: אֶת הַבַּיִת
  choice: na nyumba
  rationale: Baada ya “akaliunganisha,” uhusiano wa kimuundo unaelezwa kwa Kiswahili kwa “na nyumba.”
- source_word: בַּעֲצֵי אֲרָזִים
  choice: kwa mbao za mierezi
  rationale: עֲצֵי katika muktadha huu ni vipande vya miti vilivyotumika katika ujenzi; “mbao” ni pana kuliko “mihimili” na huepuka kubainisha umbo lisilothibitishwa.
