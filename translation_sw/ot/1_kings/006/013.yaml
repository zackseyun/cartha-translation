  source_fidelity: 'Tafsiri inafuata kwa uaminifu vipengele vya Kiebrania: ahadi ya Mungu ya kukaa miongoni mwa בני ישראל, na kutowaacha watu wake Israeli. “Nami” huwakilisha vizuri kiunganishi cha mwanzo, na “wala sitawaacha” hutoa kwa kawaida na kwa nguvu ahadi hasi ya וְלֹא אֶעֱזֹב.'
