  text: וְ/שָׁ֣כַנְתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֥א אֶעֱזֹ֖ב אֶת עַמִּ֥/י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/013.yaml
  text: And I will dwell among the children of Israel[a], and I will not forsake my people Israel.
translation:
  language: sw
  text: Nami nitakaa miongoni mwa wana wa Israeli[a], wala sitawaacha watu wangu Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kihalisi ni “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: Nami nitakaa
  rationale: Kitenzi 'kukaa' kinaeleza uwepo wa Mungu unaodumu miongoni mwa watu wake na kuhifadhi uzito wa agano bila kutumia lugha isiyo ya kawaida.
- source_word: בְּתוֹךְ
  choice: miongoni mwa
  rationale: Kwa kuwa kinachofuata ni kundi la watu, 'miongoni mwa' ni Kiswahili cha kawaida kinachohifadhi maana ya kuwa katikati ya jumuiya.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inafuata kwa karibu usemi wa Kiebrania, ambao kwa muktadha huu unawahusu wazao au watu wa Israeli kwa ujumla, si wanaume pekee.
- source_word: וְלֹא אֶעֱזֹב
  choice: wala sitawaacha
  rationale: '''Sitawaacha'' ni usemi wa asili na wenye nguvu wa uhusiano katika Kiswahili, unaofikisha maana ya kutowatelekeza watu wa agano.'
- source_word: עַמִּי
  choice: watu wangu
  rationale: Huhifadhi moja kwa moja kauli ya agano yenye umilikaji.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa na watu limetolewa kwa umbo la kawaida la Kiswahili.
theological_decisions:
- issue: Lugha ya uwepo wa Mungu katika muktadha wa hekalu
  choice: “nitakaa miongoni mwa”
  alternative: “nitaishi katikati ya”
  rationale: Tafsiri inaeleza ahadi ya uwepo wa Mungu pamoja na watu wake bila kudai kwamba Mungu amefungiwa mahali pa hekalu au kuingiza maelezo ya kiteolojia yasiyosemwa wazi katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo 'Nami ... wala ...' unaendeleza mtiririko wa ahadi katika muktadha; tanbihi huhifadhi tofauti kati ya usemi halisi wa Kiebrania na jina la kawaida la watu.
