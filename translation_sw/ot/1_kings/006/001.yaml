  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֣י בִ/שְׁמוֹנִ֣ים שָׁנָ֣ה וְ/אַרְבַּ֣ע מֵא֣וֹת שָׁנָ֡ה לְ/צֵ֣את בְּנֵֽי יִשְׂרָאֵ֣ל מֵ/אֶֽרֶץ מִצְרַיִם֩ בַּ/שָּׁנָ֨ה הָ/רְבִיעִ֜ית בְּ/חֹ֣דֶשׁ זִ֗ו ה֚וּא הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לִ/מְלֹ֥ךְ שְׁלֹמֹ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּ֥בֶן הַ/בַּ֖יִת לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/001.yaml
  text: And it came about in the four hundred eightieth year after the sons of Israel came out from the land of Egypt[a], in the fourth year, in the month of Ziv (that is, the second month), of Solomon’s reign over Israel[c][b], that he built the house for Yahweh.
translation:
  language: sw
  text: Ikawa, katika mwaka wa mia nne na themanini baada ya wana wa Israeli[a] kutoka katika nchi ya Misri, katika mwaka wa nne wa utawala wa Sulemani juu ya Israeli, katika mwezi wa Zivu[b]—yaani, mwezi wa pili—Sulemani akajenga[c] nyumba kwa ajili ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “wana wa Israeli”; usemi huu unarejelea Waisraeli, yaani watu wa Israeli, kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Zivu lilikuwa jina la zamani la mwezi wa pili katika kalenda ya Kiebrania.
    reason: cultural_note
  - marker: c
    text: Au, kwa kuzingatia muktadha, “akaanza kujenga.” Kitenzi cha Kiebrania chenyewe kinasema tu “akajenga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi kiunganishi cha kawaida cha simulizi la Kiebrania huku kikitoa utangulizi wa taarifa ya kihistoria kwa Kiswahili fasaha.
- source_word: בִּשְׁמוֹנִים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: katika mwaka wa mia nne na themanini
  rationale: Muundo wa Kiebrania unataja mwaka mahsusi katika hesabu, si muda wa miaka 480 uliokamilika kwa namna isiyo dhahiri.
- source_word: לְצֵאת
  choice: tangu ... watoke
  rationale: Infinitivu yenye לְ huweka kutoka Misri kuwa mwanzo wa kuhesabu wakati; 'tangu ... watoke' ni ya asili katika Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi taswira ya kifamilia ya Kiebrania badala ya kuibadilisha moja kwa moja kuwa jina la kitaifa.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Huhifadhi nomino אֶרֶץ, 'nchi,' na pamoja na kitenzi 'watoke' huwasilisha maana ya kutoka nchini Misri.
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: katika mwaka wa nne
  rationale: Ni usemi wa moja kwa moja wa tarehe inayohusishwa na utawala wa Sulemani.
- source_word: בְּחֹדֶשׁ זִו
  choice: mwezi wa Zivu
  rationale: Jina la kihistoria la mwezi limetoholewa kwa mfumo wa sauti wa Kiswahili badala ya kubadilishwa na jina la kalenda ya kisasa.
- source_word: הוּא הַחֹדֶשׁ הַשֵּׁנִי
  choice: yaani mwezi wa pili
  rationale: Huwasilisha ufafanuzi wa Kiebrania kwa mtindo wa kawaida na wazi wa Kiswahili.
- source_word: לִמְלֹךְ שְׁלֹמֹה עַל יִשְׂרָאֵל
  choice: wa utawala wa Sulemani juu ya Israeli
  rationale: Huwasilisha mfumo wa kutaja mwaka kwa kutegemea muda wa utawala wa mfalme.
- source_word: וַיִּבֶן
  choice: akaijenga
  rationale: Kitenzi cha Kiebrania kinasema moja kwa moja 'akajenga'; wazo la kuanza ujenzi linatokana na muktadha na limewekwa katika tanbihi badala ya kuingizwa kimya kimya katika matini.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Huhifadhi neno halisi 'nyumba,' ambalo hapa linarejelea hekalu, bila kubadilisha istilahi ya chanzo.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahwe
  rationale: Huhifadhi mwelekeo wa לְ, yaani nyumba inayojengwa kwa ajili ya Yahwe, na kulitaja jina la agano lililo katika chanzo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina maalumu la Mungu, si cheo; 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Kuhifadhi usemi wa kifamilia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi wa kifamilia umehifadhiwa kwa sababu ni sehemu halisi ya muundo wa chanzo, huku tanbihi ikifafanua kuwa unarejelea taifa kwa ujumla.
- issue: Iwapo וַיִּבֶן itafsiriwe kwa maana ya kuanza
  choice: akaijenga
  alternative: akaanza kuijenga
  rationale: Kitenzi chenyewe hakisemi wazi 'akaanza.' Muktadha unaweza kuonyesha mwanzo wa mradi, lakini tofauti hiyo imehifadhiwa kwa tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa vipashio vya tarehe umerahisishwa kiasi kwa ufasaha bila kuondoa taarifa yoyote; jina 'Sulemani' limerudiwa katika kishazi cha mwisho ili kuepuka utata wa kiwakilishi katika Kiswahili.
