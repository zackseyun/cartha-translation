  yaml_path: translation/ot/1_kings/006/020.yaml
  text: In front of the inner sanctuary was twenty cubits in length[a], twenty cubits in width, and twenty cubits in its height. He overlaid it with pure gold[b], and he overlaid the cedar altar.
translation:
  language: sw
  text: Patakatifu pa ndani[a] palikuwa na urefu wa dhiraa ishirini, upana wa dhiraa ishirini, na kimo cha dhiraa ishirini. Akalifunika patakatifu pa ndani kwa dhahabu safi[b], na akaifunika madhabahu ya mwerezi kwa dhahabu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno, “Mbele ya patakatifu pa ndani.” Sentensi ya Kiebrania imebanwa; kwa muktadha, vipimo hivi vinaeleza patakatifu pa ndani.
    reason: textual_ambiguity
  - marker: b
    text: Au “dhahabu bora iliyosafishwa.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema kwa ufupi, “akaifunika madhabahu ya mwerezi”; dhahabu inaeleweka kutokana na kishazi kilichotangulia.
    reason: source_ellipsis
lexical_decisions:
- source_word: לִפְנֵי הַדְּבִיר
  choice: Patakatifu pa ndani
  rationale: Kiebrania kina muundo uliobanwa, kwa neno ‘mbele ya patakatifu pa ndani.’ Muktadha unaonyesha kwamba vipimo vinavyofuata ni vya patakatifu pa ndani lenyewe. Tafsiri kuu inatoa maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi muundo na utata wa Kiebrania.
- source_word: הַדְּבִיר
  choice: patakatifu pa ndani
  rationale: Neno hili linamaanisha chumba cha ndani kabisa cha hekalu. ‘Patakatifu pa ndani’ ni wazi, cha heshima, na hakilazimishi istilahi ya kimadhehebu.
- source_word: עֶשְׂרִים אַמָּה ... אֹרֶךְ / רֹחַב / קוֹמָתוֹ
  choice: urefu wa dhiraa ishirini, upana wa dhiraa ishirini, na kimo cha dhiraa ishirini
  rationale: Muundo huu unawakilisha kwa uwazi vipimo vitatu vya Kiebrania na kuhifadhi kipimo cha kale ‘dhiraa’ badala ya kukibadili katika matini kuu.
- source_word: וַיְצַפֵּהוּ
  choice: akapafunika
  rationale: Kitenzi צפה hapa kina maana ya kufunika uso kwa tabaka la dhahabu. Upatanisho wa ‘pa-’ unarejelea patakatifu kama mahali.
- source_word: זָהָב סָגוּר
  choice: dhahabu safi
  rationale: Kirai hiki kinaashiria dhahabu bora iliyosafishwa. ‘Dhahabu safi’ ni Kiswahili cha sasa na cha kawaida; tanbihi inaeleza maana pana kidogo.
- source_word: וַיְצַף מִזְבֵּחַ אָרֶז
  choice: akaifunika kwa dhahabu madhabahu ya mbao za mwerezi
  rationale: Kiebrania kinasema kwa ufupi ‘akaifunika madhabahu ya mwerezi.’ Nyenzo ya kufunikia, yaani dhahabu, inaeleweka kutoka kishazi kilichotangulia na imetajwa katika matini kwa uwazi; tanbihi inahifadhi ufupi wa asili.
