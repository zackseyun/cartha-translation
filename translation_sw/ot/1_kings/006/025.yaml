    issue: Unnecessary use of “pia”
    rationale: Although the verse follows a description of the first cherub, “also” is not needed in Swahili and adds emphasis beyond the compact Hebrew wording.
  - severity: low
    issue: “Alikuwa na dhiraa kumi” is slightly ambiguous idiomatically
    rationale: This may be read as possession of ten cubits. “Alikuwa wa dhiraa kumi” idiomatically states the measurement while preserving the source’s lack of a specified dimension.
