base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/025.yaml
  text: And the second cherub was ten cubits[a]; both cherubim had one measure and one form.
translation:
  language: sw
  text: Kerubi wa pili alikuwa wa dhiraa kumi; kerubi hao wawili walikuwa na kipimo kimoja na umbo moja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעֶשֶׂר בָּאַמָּה
  choice: pia alikuwa na dhiraa kumi
  rationale: Kirai hiki kinataja ukubwa wa kerubi wa pili bila kueleza wazi kuwa ni kimo; “alikuwa na dhiraa kumi” huhifadhi kutobainishwa huko, na “pia” huonyesha mwendelezo kutoka aya iliyotangulia.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: Kerubi wa pili
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha uainisho pamoja na kivumishi cha mpangilio.
- source_word: מִדָּה אַחַת
  choice: kipimo kimoja
  rationale: מִדָּה humaanisha kipimo au ukubwa; usemi huu unaendelea kwa urahisi katika Kiswahili na kuonyesha kuwa kerubi hao walilingana.
- source_word: וְקֶצֶב אֶחָד
  choice: na umbo moja
  rationale: קֶצֶב katika muktadha huu hurejelea umbo, uwiano, au muundo wa jumla. “Umbo moja” ni lugha ya kawaida na yenye upana unaofaa.
- source_word: לִשְׁנֵי הַכְּרֻבִים
  choice: kerubi wote wawili walikuwa na
  rationale: Kiebrania halisi ni “kwa kerubi hao wawili”; sentensi imepangwa upya kwa Kiswahili cha kawaida ili kuonyesha kuwa kipimo na umbo vilihusu wote wawili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Dhiraa” limehifadhiwa kama kipimo cha kale kinachotambulika katika matumizi ya Biblia. Hakuna tanbihi iliyoongezwa kwa sababu mbadala uliotolewa katika safu ya Kiingereza unaeleza upya sehemu ya pili ya aya, si kipimo cha dhiraa kumi pekee, na maandishi ya Kiswahili yanaeleza maana hiyo wazi bila kuondoa utata halisi wa neno קֶצֶב.
