base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/003.yaml
  text: The portico in front of the nave of the house was twenty cubits long[a], across the width of the house[c][b], and ten cubits deep in front of the house.
translation:
  language: sw
  text: Ukumbi wa kuingilia uliokuwa mbele ya ukumbi mkuu wa nyumba ulikuwa na urefu wa dhiraa ishirini[a], ukienea upana wote wa nyumba[b], na kina chake mbele ya nyumba kilikuwa dhiraa kumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dhiraa moja ilikuwa takriban sentimita 45; dhiraa ishirini ni karibu mita 9.
    reason: measurement_clarification
  - marker: b
    text: Kifungu cha Kiebrania kinaonyesha kwamba urefu wa ukumbi wa kuingilia ulilingana na upana wa nyumba.
    reason: literal_rendering
lexical_decisions:
- source_word: וְהָאוּלָם
  choice: Ukumbi wa kuingilia
  rationale: Katika usanifu wa hekalu, אוּלָם ni sehemu ya kuingilia iliyo mbele ya ukumbi mkuu. Usemi huu ni wa kawaida na wazi zaidi katika Kiswahili kuliko istilahi ya kitaalamu isiyozoeleka.
- source_word: עַל־פְּנֵי
  choice: mbele ya
  rationale: Huwasilisha kwa kawaida uhusiano wa mahali na mwelekeo katika mpangilio wa jengo.
- source_word: הֵיכַל הַבַּיִת
  choice: ukumbi mkuu wa nyumba
  rationale: הֵיכַל hapa ni chumba kikuu cha jengo la hekalu, tofauti na ukumbi wa kuingilia na Patakatifu Zaidi; 'ukumbi mkuu' ni wazi kwa msomaji wa kawaida.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Huhifadhi maana halisi ya בַּיִת, huku muktadha ukionyesha kuwa nyumba inayotajwa ni jengo la hekalu.
- source_word: עֶשְׂרִים אַמָּה
  choice: dhiraa ishirini
  rationale: Kipimo cha kale kimehifadhiwa badala ya kubadilishwa kuwa kipimo cha kisasa.
- source_word: אָרְכּוֹ
  choice: ulikuwa na urefu
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida nomino ya Kiebrania yenye kiambishi cha umilikaji.
- source_word: עַל־פְּנֵי רֹחַב הַבָּיִת
  choice: ukienea upana wote wa nyumba
  rationale: Kifungu kinaonyesha kwamba urefu wa ukumbi wa kuingilia ulilingana na upana wa mbele wa nyumba; 'wote' huweka wazi uhusiano huo bila kubadili kipimo.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: dhiraa kumi
  rationale: ב iliyotangulia אַמָּה ni matumizi ya kawaida katika vipimo, hivyo maana yake ni kipimo cha dhiraa kumi.
- source_word: רָחְבּוֹ
  choice: kina chake
  rationale: Ingawa neno la Kiebrania kimsingi ni 'upana wake,' hapa linaeleza umbali wa ukumbi kutoka mbele kuelekea nje; 'kina chake' huepuka kuchanganya kipimo hiki na upana wa nyumba.
- source_word: עַל־פְּנֵי הַבָּיִת
  choice: mbele ya nyumba
  rationale: Huhifadhi kwa uwazi mahali pa kipimo cha dhiraa kumi kuhusiana na nyumba.
