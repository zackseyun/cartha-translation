translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Ukumbi wa kuingilia' na 'ukumbi mkuu' zimetumiwa ili kutofautisha sehemu za jengo kwa lugha inayoeleweka kwa urahisi. Vipimo vya dhiraa vimehifadhiwa, huku ufafanuzi wa kisasa ukiwekwa katika tanbihi.
