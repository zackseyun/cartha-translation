base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/018.yaml
  text: He made the pillars[a], and two rows all around on the one latticework, to cover the capitals that were on top of the pomegranates[b]; and so he did for the second capital.
translation:
  language: sw
  text: Akatengeneza nguzo, na safu mbili kuzunguka kazi ya wavu mmoja, ili kufunika mataji yaliyokuwa juu ya makomamanga[a]; vivyo hivyo akafanya kwa taji la pili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania cha mstari huu ni kigumu. “Makomamanga” huenda yakawa mapambo yenye umbo la komamanga; baadhi ya wafasiri pia huona safu hizo kuwa sehemu ya mapambo ya makomamanga yaliyozunguka kazi ya wavu ya kila taji.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akazitengeneza
  rationale: Kitenzi עשה katika mfululizo wa masimulizi humaanisha kufanya au kutengeneza; “akazitengeneza” kinafaa kwa kazi ya usanifu na kinaendeleza masimulizi kwa asili.
- source_word: הָעַמּוּדִים
  choice: nguzo
  rationale: Katika muktadha wa ujenzi, עמודים ni nguzo za jengo; “nguzo” ni neno la kawaida na wazi katika Kiswahili.
- source_word: שְׁנֵי טוּרִים
  choice: safu mbili
  rationale: טורים humaanisha vitu vilivyopangwa kwa mstari au safu; “safu mbili” linaeleza mpangilio wa mapambo bila kuongeza maelezo yasiyomo.
- source_word: סָבִיב
  choice: kuzunguka
  rationale: Linahifadhi wazo la mpangilio unaozunguka kitu pande zote.
- source_word: הַשְּׂבָכָה
  choice: kazi ya wavu
  rationale: Neno hili linataja pambo lililotengenezwa kwa muundo unaofanana na wavu; “kazi ya wavu” ni ya kueleweka kuliko istilahi nzito ya kitaalamu.
- source_word: הָאֶחָת
  choice: mmoja
  rationale: Linarejelea mmoja kati ya miundo miwili inayolingana, bila kuligeuza kimyakimya kuwa namba ya mpangilio “wa kwanza.”
- source_word: לְכַסּוֹת
  choice: ili kufunika
  rationale: Muundo wa infinitivu unaonyesha kusudi; “ili kufunika” unaonyesha hilo wazi.
- source_word: הַכֹּתָרֹת
  choice: mataji
  rationale: כותרות ni sehemu za juu za nguzo, zenye umbo la taji. “Mataji” ni neno la kawaida la usanifu wa kibiblia na linaeleweka katika muktadha.
- source_word: אֲשֶׁר עַל רֹאשׁ
  choice: yaliyokuwa juu ya
  rationale: Tafsiri hii ya kawaida inahifadhi uhusiano wa mahali unaoonyeshwa na Kiebrania.
- source_word: הָרִמֹּנִים
  choice: makomamanga
  rationale: Kiebrania kinasema kihalisi “makomamanga”; katika muktadha huenda ni mapambo yenye umbo la komamanga, jambo linalofafanuliwa katika tanbihi bila kufutwa katika matini.
- source_word: וְכֵן עָשָׂה
  choice: vivyo hivyo akalifanyia
  rationale: Kauli hii inaonyesha kwamba kazi ileile ilirudiwa kwenye sehemu inayolingana.
- source_word: לַכֹּתֶרֶת הַשֵּׁנִית
  choice: taji la pili
  rationale: Hii ndiyo maana ya moja kwa moja, ikirejelea taji linalolingana juu ya nguzo nyingine.
