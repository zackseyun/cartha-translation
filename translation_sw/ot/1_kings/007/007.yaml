  text: And he made the Hall of the Throne[a], where he was to judge—the Hall of Judgment—and it was paneled with cedar from floor to floor.
translation:
  language: sw
  text: Akafanya Ukumbi wa Kiti cha Enzi, ambamo angehukumu—Ukumbi wa Hukumu. Ukumbi huo ulifunikwa kwa mbao za mierezi kutoka sakafuni hadi sakafuni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri yenye kufafanua zaidi, “kutoka sakafuni hadi darini.” Kiebrania kinasema kihalisi, “kutoka sakafuni hadi sakafuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם הַכִּסֵּא
  choice: Akajenga pia Ukumbi wa Kiti cha Enzi
  rationale: אוּלָם ni ukumbi au nafasi kubwa yenye umbo la baraza; katika muktadha wa jumba la kifalme, “Ukumbi” ni neno la kawaida na lenye hadhi. כִּסֵּא ni kiti cha enzi. Kitenzi עָשָׂה kimetolewa mapema katika Kiswahili ili sentensi iwe ya asili, na “akajenga” linafaa kwa maelezo ya ujenzi.
- source_word: אֲשֶׁר יִשְׁפָּט שָׁם
  choice: ambamo angehukumu
  rationale: Kauli hii inaonyesha kusudi au shughuli iliyotarajiwa ya ukumbi. “Angehukumu” huhifadhi uwezekano huo bila kuifanya kwa lazima kuwa tendo moja la wakati uliopita.
- source_word: אֻלָם הַמִּשְׁפָּט
  choice: yaani, Ukumbi wa Hukumu
  rationale: Kirai hiki kinataja ukumbi kwa kazi yake. “Yaani” huonyesha kwa kawaida kwamba ni jina jingine la ukumbi uleule, huku “hukumu” likibaki karibu na maana ya מִשְׁפָּט kuliko tafsiri pana zaidi ya “haki.”
- source_word: וְסָפוּן בָּאֶרֶז
  choice: ulifunikwa kwa mbao za mierezi
  rationale: סָפוּן huonyesha kufunikwa au kupigwa paneli. Kutaja “mbao za mierezi” kunafanya picha ya usanifu iwe wazi katika Kiswahili bila kuongeza mapambo yasiyotajwa.
- source_word: מֵהַקַּרְקַע עַד הַקַּרְקָע
  choice: kutoka sakafuni hadi sakafuni
  rationale: Maandishi ya Kiebrania yaliyo na irabu yanarudia neno “sakafu/ardhi.” Tafsiri kuu inadumisha urudiaji huo usio wa kawaida, huku ufafanuzi unaokubalika katika muktadha wa ujenzi ukiwekwa katika tanbihi.
