  text: It was paneled with cedar above[a], over the side chambers that were on the pillars, forty-five in all, fifteen to a row.
translation:
  language: sw
  text: Jengo hilo lilifunikwa kwa mbao za mierezi upande wa juu,[a] juu ya vyumba vya pembeni vilivyokuwa juu ya nguzo arobaini na tano, kumi na tano katika kila safu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jengo hilo lilifunikwa kwa mbao za mierezi kutoka juu, juu ya miundo ya pembeni iliyokuwa juu ya nguzo arobaini na tano, kumi na tano katika kila safu.” Istilahi za usanifu za Kiebrania hapa ni ngumu, hasa צלעות, ambayo inaweza kumaanisha “pande,” “mbavu,” “vyumba vya pembeni,” au “miundo ya pembeni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפֻן
  choice: lilifunikwa
  rationale: Kitenzi cha kutendwa kinaeleza kufunikwa au kutandikwa kwa nyenzo; “lilifunikwa” ni cha asili na hakiamui bila lazima kwamba ilikuwa paneli za ndani au paa.
- source_word: בָּאֶרֶז
  choice: kwa mbao za mierezi
  rationale: Herufi beth inaonyesha nyenzo iliyotumiwa. “Mbao za mierezi” ni Kiswahili cha kawaida na kinaweka wazi kwamba mierezi ilikuwa nyenzo ya ujenzi.
- source_word: מִמַּעַל
  choice: upande wa juu
  rationale: Hifadhi maana ya mahali katika sehemu ya juu ya jengo kwa lugha ya kawaida.
- source_word: עַל הַצְּלָעֹת
  choice: juu ya vyumba vya pembeni
  rationale: צלעות kimsingi inaweza kumaanisha pande au mbavu, lakini katika muktadha wa jengo huenda ikarejelea vyumba au miundo ya pembeni. Maana hii imewekwa katika maandishi huku utata ukibainishwa katika tanbihi.
- source_word: אֲשֶׁר עַל הָעַמּוּדִים
  choice: vilivyokuwa juu ya nguzo
  rationale: Tafsiri ya karibu inalinda uhusiano wa mahali bila kuongeza dai kwamba vyumba hivyo viliegemezwa moja kwa moja na nguzo.
- source_word: אַרְבָּעִים וַחֲמִשָּׁה
  choice: arobaini na vitano kwa jumla
  rationale: Idadi inaeleweka kuwa jumla ya vitu vilivyotajwa; “kwa jumla” hufanya muundo wa hesabu ueleweke.
- source_word: חֲמִשָּׁה עָשָׂר הַטּוּר
  choice: kumi na vitano katika kila safu
  rationale: הטור ni safu au mstari; kifungu kinaonyesha mgawanyo wa jumla ya arobaini na tano katika safu zenye vitu kumi na vitano kila moja.
