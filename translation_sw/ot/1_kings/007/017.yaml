base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/017.yaml
  text: 'There were lattices of latticework and twisted cords of chainwork for the capitals that were on the tops of the pillars: seven for the one capital[a], and seven for the second capital.'
translation:
  language: sw
  text: 'Kulikuwa na vimiani vya kazi ya kimiani, na kamba zilizosokotwa za kazi ya minyororo, kwa vichwa vya nguzo: saba kwa kichwa kimoja[a], na saba kwa kile cha pili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyavu za kazi ya wavu na nyuzi zilizosukwa za kazi ya minyororo.” Kiebrania kinatumia jozi za istilahi za ufundi kueleza mapambo ya chuma kwenye vichwa vya nguzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂבָכִים מַעֲשֵׂה שְׂבָכָה
  choice: vimiani vya kazi ya kimiani
  rationale: Maneno haya yanadumisha urudiaji wa istilahi mbili zinazohusiana katika Kiebrania na yanaonyesha mapambo ya chuma yenye matundu kama wavu.
- source_word: גְּדִלִים
  choice: kamba zilizosokotwa
  rationale: Nomino hii inaonyesha vipande vilivyosokotwa au kusukwa; ‘kamba zilizosokotwa’ ni picha wazi bila kudhania kwamba yalikuwa mashada ya maua.
- source_word: מַעֲשֵׂה שַׁרְשְׁרוֹת
  choice: za kazi ya minyororo
  rationale: Kauli hii inaeleza ufundi au umbo la vipande hivyo kuwa kama minyororo, huku ikihifadhi mtindo wa maelezo ya ufundi katika Kiebrania.
- source_word: כֹּתָרֹת
  choice: mataji
  rationale: Katika muktadha huu ni sehemu za mapambo juu ya nguzo. ‘Mataji’ ni neno la kawaida na lenye hadhi katika Kiswahili kuliko istilahi ya kiufundi isiyoeleweka kwa wasomaji wengi.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: yaliyokuwa juu ya nguzo
  rationale: Hutoa kwa Kiswahili cha kawaida uhusiano wa mahali unaoelezwa na Kiebrania, ambapo רֹאשׁ ni ‘kichwa’ au ‘sehemu ya juu.’
- source_word: שִׁבְעָה לַכֹּתֶרֶת הָאֶחָת וְשִׁבְעָה לַכֹּתֶרֶת הַשֵּׁנִית
  choice: saba kwa taji moja, na saba kwa taji la pili
  rationale: 'Inahifadhi hesabu ya mgawanyo iliyo wazi katika Kiebrania: saba kwa kila taji.'
