lexical_decisions:
- source_word: וּמִלְמַעְלָה
  choice: Na juu yake
  rationale: Katika maelezo haya ya ujenzi, kirai hiki kinaonyesha kilichokuwa juu ya tabaka zilizotajwa kabla; “juu yake” ni Kiswahili cha kawaida na wazi.
- source_word: אֲבָנִים יְקָרוֹת
  choice: mawe ya gharama kubwa
  rationale: Kivumishi יְקָרוֹת hapa kinaonyesha mawe bora na yenye gharama kubwa ya ujenzi, si lazima vito vya thamani.
- source_word: כְּמִדּוֹת גָּזִית
  choice: yaliyochongwa kwa vipimo[a]
  rationale: Tafsiri hii inaunganisha wazo la mawe yaliyochongwa na kutengenezwa kwa vipimo maalumu kwa Kiswahili cha asili, huku tanbihi ikihifadhi uwezekano wa muundo wa karibu zaidi na Kiebrania.
- source_word: וָאָרֶז
  choice: na mbao za mierezi
  rationale: אֶרֶז ni “mwerezi” na hapa hutumiwa kwa maana ya jumla ya nyenzo ya ujenzi; kutaja “mbao” huweka maana hiyo wazi katika Kiswahili.
