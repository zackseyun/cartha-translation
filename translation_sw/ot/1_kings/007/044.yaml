  text: and the one Sea[a], and the twelve oxen under the Sea;
translation:
  language: sw
  text: na ile Bahari moja,[a] na wale ng’ombe kumi na wawili chini ya ile Bahari;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ile beseni moja, na wale ng’ombe kumi na wawili chini ya beseni hilo.” Kiebrania kinatumia neno “Bahari” kutaja hifadhi kubwa ya maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: Bahari
  rationale: Katika muktadha wa vyombo vya hekalu, neno hili linataja hifadhi kubwa ya maji ya chuma iliyoyeyushwa, ambayo kwa kawaida huitwa “Bahari.” Kutumia herufi kubwa kunaitambulisha kama kitu maalumu huku kukihifadhi kirai halisi cha Kiebrania.
- source_word: הָאֶחָד
  choice: ile ... moja
  rationale: Namba yenye kiainishi inasisitiza kwamba kulikuwa na Bahari moja, tofauti na vifaa vingi vilivyotajwa katika orodha inayozunguka mstari huu.
- source_word: הַבָּקָר
  choice: ng’ombe
  rationale: Hapa neno linamaanisha sanamu za wanyama wa jamii ya ng’ombe zilizokuwa chini ya Bahari. “Ng’ombe” ni neno la kawaida na halibainishi jinsia kupita ushahidi wa neno la Kiebrania.
- source_word: שְׁנֵים עָשָׂר
  choice: kumi na wawili
  rationale: Hii ndiyo namba ya kawaida; upatanisho wa ngeli unafuata nomino “ng’ombe.”
- source_word: תַּחַת
  choice: chini ya
  rationale: Kirai hiki kinaonyesha mahali walipokuwa ng’ombe kuhusiana na Bahari.
- source_word: וְאֶת
  choice: na
  rationale: Kiunganishi kinachoambatana na alama ya yambwa kinaendeleza orodha; Kiswahili hakihitaji kutafsiri alama ya yambwa yenyewe.
