  text: And on the top of the pillars was lily-work[b][a], and the work of the pillars was finished.
translation:
  language: sw
  text: Juu ya vilele vya nguzo hizo kulikuwa na mapambo yenye umbo la yungiyungi[a], na kazi ya nguzo hizo ikakamilika.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mapambo ya yungiyungi” au “nakshi yenye umbo la yungiyungi.”
    reason: lexical_alternative
  - marker: b
    text: Au “ufundi wa nguzo hizo ukakamilika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: juu
  rationale: Katika muktadha wa usanifu, neno hili linarejelea sehemu ya juu ya nguzo; ‘juu’ ni Kiswahili cha kawaida bila kulifanya kuwa istilahi mahususi ya usanifu.
- source_word: הָעַמּוּדִים
  choice: nguzo hizo
  rationale: עַמּוּדִים ni nguzo za jengo; kiashiria ‘hizo’ kinafaa kwa sababu nguzo hizi tayari zimezungumziwa katika muktadha.
- source_word: מַעֲשֵׂה שׁוֹשָׁן
  choice: mapambo yenye umbo la maua ya yungiyungi
  rationale: Kirai hiki kinaeleza kazi ya mapambo yenye sura ya yungiyungi. Tafsiri hii ni wazi na ya asili kuliko muundo usio wa kawaida kama ‘kazi ya yungiyungi,’ huku ikihifadhi maana ya urembo wa maua.
- source_word: וַתִּתֹּם
  choice: ikakamilika
  rationale: Kitenzi kutoka תמם kinaonyesha kufikia ukamilifu; ‘ikakamilika’ hudumisha mtiririko wa simulizi wa wayyiqtol.
- source_word: מְלֶאכֶת הָעַמּוּדִים
  choice: kazi ya nguzo hizo
  rationale: מְלָאכָה linaweza kumaanisha kazi au ufundi. ‘Kazi ya nguzo’ hudumisha upana wa kirai cha Kiebrania bila kubainisha kupita kiasi ikiwa ni ujenzi pekee au pia mapambo.
