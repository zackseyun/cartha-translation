  text: the two pillars[a], and the two bowls of the capitals that were on the tops of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on the tops of the pillars[c][b];
translation:
  language: sw
  text: nguzo mbili, na sehemu mbili za mviringo[a] za vichwa vya nguzo zilizokuwa juu ya nguzo hizo, na mapambo mawili ya kimiani[b] ya kufunika zile sehemu mbili za mviringo za vichwa vya nguzo zilizokuwa juu ya nguzo hizo;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bakuli” au “matufe.” Neno la Kiebrania linamaanisha sehemu zenye umbo la mviringo katika vichwa vya nguzo; umbo lake kamili halijulikani.
    reason: lexical_alternative
  - marker: b
    text: Au “mapambo ya wavu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדִים
  choice: nguzo
  rationale: Neno hili hurejelea nguzo mbili kubwa za Hekalu; “nguzo” ni istilahi ya kawaida na inayoeleweka katika Kiswahili cha usanifu.
- source_word: גֻלֹּת
  choice: maumbo ya mviringo
  rationale: Neno la Kiebrania linaashiria sehemu za mviringo za vichwa vya nguzo, lakini umbo lake kamili halijulikani. Tafsiri hii huhifadhi kutokuwa na uhakika bila kulazimisha maana ya “bakuli” au “tufe.”
- source_word: כֹּתָרֹת
  choice: vichwa vya nguzo
  rationale: Katika muktadha wa usanifu, ni sehemu zilizopambwa zilizo juu ya nguzo. “Vichwa vya nguzo” ni Kiswahili cha kawaida na sahihi kuliko kutumia neno la kitaalamu lisiloeleweka kwa wengi.
- source_word: רֹאשׁ
  choice: juu
  rationale: Ingawa maana ya msingi ni “kichwa,” hapa inaonyesha mahali pa sehemu hizo juu ya nguzo; “juu” ni ya asili katika Kiswahili.
- source_word: שְּׂבָכוֹת
  choice: mapambo ya kimiani
  rationale: Neno hili linaeleza kazi ya mapambo iliyosokotwa au iliyopangwa kama wavu. “Mapambo ya kimiani” huonyesha muundo huo wa usanifu kwa lugha inayoeleweka.
- source_word: לְכַסּוֹת
  choice: ya kufunika
  rationale: Kitenzi-jina kinaonyesha kusudi la miundo hiyo; “ya kufunika” huwasilisha kusudi hilo kwa Kiswahili cha kawaida.
- source_word: שְׁנַיִם / שְׁתָּיִם / שְׁתֵּי
  choice: mbili / mawili
  rationale: Marudio ya idadi yanadumishwa kama yalivyo katika orodha ya Kiebrania, huku upatanisho wa kisarufi wa Kiswahili ukifuatwa.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: yaliyokuwa juu ya nguzo hizo
  rationale: Kirai hiki kinahifadhi utambulisho na mahali pa maumbo hayo, pamoja na marudio yaliyopo katika Kiebrania.
