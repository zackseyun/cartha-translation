base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/040.yaml
  text: And Hiram made the basins[a], the shovels, and the bowls. So Hiram finished doing all the work that he did for King Solomon for the house of Yahweh.
translation:
  language: sw
  text: Hiramu akatengeneza mabeseni, sepetu na mabakuli.[a] Hivyo Hiramu akamaliza kazi yote aliyomfanyia Mfalme Sulemani kwa ajili ya nyumba ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mabakuli ya kunyunyizia,” yaani vyombo vilivyotumiwa katika ibada za dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיֹּרוֹת
  choice: mabeseni
  rationale: Neno hili linataja vyombo vikubwa vya kuoshea katika samani za hekalu. “Mabeseni” ni neno la kawaida, la sasa, na linatofautisha vyombo hivi na mabakuli madogo yanayotajwa baadaye.
- source_word: יָּעִים
  choice: sepetu
  rationale: Hivi ni vifaa vya kuondolea majivu au makaa. “Sepetu” linaeleza kwa kawaida aina ya koleo lililotumiwa kwa kazi hiyo.
- source_word: מִּזְרָקוֹת
  choice: mabakuli
  rationale: Neno hilo linataja vyombo vya kupokea au kunyunyizia damu na vimiminika katika ibada za dhabihu. “Mabakuli” ni tafsiri pana na inayoeleweka; matumizi yake ya kiibada yanafafanuliwa katika tanbihi.
- source_word: וַיְכַל
  choice: akamaliza
  rationale: Kitenzi kinaonyesha kukamilika kwa kazi aliyokabidhiwa; “akamaliza” ni cha kawaida na sahihi katika muktadha huu.
- source_word: כָּל הַמְּלָאכָה
  choice: kazi yote
  rationale: מְלָאכָה ni neno pana linaloweza kumaanisha kazi au ufundi. “Kazi yote” linafaa katika sentensi hii ya muhtasari bila kuongeza maana isiyobainishwa.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi tamathali ya Kiebrania, ingawa kinachorejelewa ni hekalu; jina la agano יְהוָה limetoholewa kuwa “Yahwe”.
- source_word: חִירוֹם / חִירָם
  choice: Hiramu
  rationale: Maumbo haya mawili ya tahajia yanamtaja mtu yuleyule; “Hiramu” ni umbo la Kiswahili linalotambulika na linalofaa kwa yote mawili.
- source_word: עָשָׂה ... לַמֶּלֶךְ שְׁלֹמֹה
  choice: aliyomfanyia Mfalme Sulemani
  rationale: Muundo huu unaonyesha kazi iliyofanywa kwa niaba au kwa ajili ya mfalme. “Aliyomfanyia” ni wa asili katika Kiswahili na huepuka kurudia “kutengeneza” kwa namna ngumu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la agano יְהוָה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa orodha na muundo wa muhtasari wa Kiebrania umehifadhiwa, huku “kwa ajili ya nyumba ya Yahwe” ikionyesha kwamba kazi ilifanywa kwa matumizi ya hekalu, si lazima ndani yake.
