  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּתֵּן֙ אֶת הַ/מְּכֹנ֔וֹת חָמֵ֞שׁ עַל כֶּ֤תֶף הַ/בַּ֨יִת֙ מִ/יָּמִ֔ין וְ/חָמֵ֛שׁ עַל כֶּ֥תֶף הַ/בַּ֖יִת מִ/שְּׂמֹאל֑/וֹ וְ/אֶת הַ/יָּ֗ם נָתַ֞ן מִ/כֶּ֨תֶף הַ/בַּ֧יִת הַ/יְמָנִ֛ית קֵ֖דְמָ/ה מִ/מּ֥וּל נֶֽגֶב־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/039.yaml
  text: He placed five stands on the right side of the house and five on the left side of the house[a], and he placed the Sea on the southeast side of the house.
translation:
  language: sw
  text: Aliweka viegemezo vitano upande wa kulia wa nyumba na vitano upande wa kushoto wa nyumba, naye akaiweka Bahari upande wa kusini-mashariki wa nyumba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, Kiebrania kinasema, “kutoka upande wa kulia wa nyumba, kuelekea mashariki, mkabala na kusini”—maelezo mafupi ya mahali yanayoonyesha upande wa kusini-mashariki.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: viegemezo
  rationale: Katika habari ya vifaa vya hekalu, neno hili linamaanisha miundo ya shaba yenye magurudumu iliyotegemeza mabeseni. “Viegemezo” linaeleza kazi yake kwa Kiswahili cha sasa bila kusisitiza mno kwamba ilikuwa mikokoteni.
- source_word: כֶּתֶף
  choice: upande
  rationale: Ingawa maana ya msingi ni “bega,” katika maelezo ya mahali pa jengo neno hili humaanisha upande wake.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Kiebrania kinasema “nyumba.” Katika muktadha huu ni nyumba ya Mungu, yaani hekalu, lakini “nyumba” kinahifadhi tamathali ya chanzo.
- source_word: מִיָּמִין
  choice: upande wa kulia
  rationale: Huhifadhi namna ya Kiebrania ya kueleza mwelekeo kwa kulinganisha na upande wa mwili, badala ya kuibadili moja kwa moja kuwa kusini.
- source_word: מִשְּׂמֹאלוֹ
  choice: upande wa kushoto
  rationale: Huhifadhi usemi wa Kiebrania wa kulia na kushoto kwa lugha ya kawaida ya Kiswahili.
- source_word: הַיָּם
  choice: Bahari
  rationale: Hili ni jina maalumu la beseni kubwa la shaba katika eneo la hekalu; herufi kubwa inaonyesha kuwa si bahari ya kawaida.
- source_word: הַיְמָנִית קֵדְמָה מִמּוּל נֶגֶב
  choice: upande wa kusini-mashariki
  rationale: Mkusanyiko huu mfupi wa maelekezo unaonyesha mahali palipo upande wa kulia/kusini na kuelekea mashariki; “kusini-mashariki” ni Kiswahili cha asili kinachowasilisha eneo linalokusudiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa kulia na kushoto umehifadhiwa katika sehemu ya kwanza, huku maelezo mazito ya mwisho yakitolewa kwa mwelekeo wa kawaida wa dira na ufafanuzi wa chini.
