base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/009.yaml
  text: All these were costly stones[a], cut according to measure, sawed with a saw on the inside and on the outside, from the foundation to the coping[b], and on the outside as far as the great court.
translation:
  language: sw
  text: Haya yote yalikuwa mawe ya gharama kubwa[a], yaliyokatwa kwa vipimo na kukatwa kwa msumeno upande wa ndani na upande wa nje, kuanzia msingi hadi ukingo wa juu[b], na kwa upande wa nje mpaka ua mkubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mawe ya thamani.” Hapa inaelekea kuwa ni mawe bora ya ujenzi yaliyokuwa ya bei kubwa, si vito.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “hadi kwenye tĕfaḥot.” Sehemu halisi ya jengo inayomaanishwa haijulikani kwa uhakika; huenda ni ukingo wa juu au safu ya juu ya mawe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים יְקָרֹת
  choice: mawe ya gharama kubwa
  rationale: Katika muktadha wa ujenzi, maneno haya yanaelekea kumaanisha mawe bora na ya bei kubwa, si vito.
- source_word: כְּמִדֹּת גָּזִית
  choice: yaliyokatwa kwa vipimo
  rationale: Kauli hii inaunganisha kukatwa au kuchongwa kwa mawe na kufuata vipimo maalumu; tafsiri hii ni ya kawaida na wazi kwa Kiswahili.
- source_word: מְגֹרָרוֹת בַּמְּגֵרָה
  choice: kusawazishwa kwa msumeno
  rationale: Kitenzi na jina la kifaa vinaonyesha wazi matumizi ya msumeno katika kukamilisha nyuso za mawe; 'kusawazishwa' kinafaa kwa kazi hiyo ya uashi.
- source_word: מִבַּיִת וּמִחוּץ
  choice: upande wa ndani na upande wa nje
  rationale: Huhifadhi ulinganifu wa Kiebrania huku kikieleweka kuwa mawe yalitengenezwa katika pande zote mbili.
- source_word: מִמַּסָּד
  choice: tangu msingi
  rationale: מַסָּד ni msingi au sehemu ya chini ya jengo; 'msingi' ndilo neno la kawaida la usanifu katika Kiswahili.
- source_word: עַד הַטְּפָחוֹת
  choice: hadi ukingo wa juu
  rationale: Neno la Kiebrania linataja sehemu ya juu ya jengo ambayo utambulisho wake kamili hauna uhakika; 'ukingo wa juu' ni tafsiri pana isiyodai umahususi usiothibitishwa.
- source_word: וּמִחוּץ עַד הֶחָצֵר הַגְּדוֹלָה
  choice: na kwa upande wa nje mpaka ua mkubwa
  rationale: Huhifadhi mwendo wa maelezo kutoka sehemu ya nje hadi ua mkubwa bila kuondoa urudiaji uliopo katika Kiebrania.
