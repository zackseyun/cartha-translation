base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/016.yaml
  text: He made two capitals of cast bronze to set on the tops of the pillars. The height of the one capital was five cubits[a], and the height of the second capital was five cubits.
translation:
  language: sw
  text: Akatengeneza vichwa viwili vya nguzo, vya shaba iliyomiminwa, ili aviweke juu ya vilele vya nguzo. Urefu wa kichwa kimoja ulikuwa dhiraa tano,[a] na urefu wa kichwa cha pili ulikuwa dhiraa tano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taji.” Neno la Kiebrania hurejelea sehemu ya juu ya nguzo yenye mapambo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: vichwa vya mapambo / kichwa
  rationale: Katika muktadha wa usanifu, neno hili linamaanisha sehemu ya juu yenye mapambo ya nguzo. “Vichwa vya mapambo” ni Kiswahili kinachoeleweka kwa urahisi kuliko istilahi ya kitaalamu pekee, huku “kichwa” katika marudio kikibaki wazi kutokana na muktadha.
- source_word: עָשָׂה
  choice: akatengeneza
  rationale: Kitenzi hiki cha kawaida kinaeleza tendo la kutengeneza bila kuongeza wazo lisilokuwamo katika Kiebrania.
- source_word: לָתֵת
  choice: ili kuviweka
  rationale: Infinitivu inaonyesha kusudi la kutengenezwa kwa vichwa hivyo; “ili kuviweka” ni ya asili na sahihi katika Kiswahili.
- source_word: רָאשֵׁי הָעַמּוּדִים
  choice: juu ya nguzo
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya mahali vilipowekwa, bila tafsiri isiyo ya asili ya “vichwa vya nguzo.”
- source_word: מֻצַק נְחֹשֶׁת
  choice: kwa shaba ya kuyeyushwa
  rationale: Huhifadhi habari kuhusu nyenzo na mchakato wa kuitengeneza kwa kumimina metali iliyoyeyushwa.
- source_word: חָמֵשׁ אַמּוֹת
  choice: dhiraa tano
  rationale: Huhifadhi kipimo cha kale kilichotumiwa katika matini badala ya kukibadili kimyakimya kuwa kipimo cha kisasa.
- source_word: קוֹמַת
  choice: kimo cha
  rationale: “Kimo” ni neno la kawaida na sahihi kwa urefu wa kitu kutoka chini kwenda juu katika muktadha huu wa usanifu.
- source_word: הָאֶחָת
  choice: kimoja
  rationale: Huhifadhi maana ya moja kati ya viwili bila kukifanya kuwa “cha kwanza,” jambo ambalo Kiebrania halisemi wazi.
- source_word: הַשֵּׁנִית
  choice: cha pili
  rationale: Hufuata alama ya wazi ya Kiebrania inayokitaja kichwa cha pili.
