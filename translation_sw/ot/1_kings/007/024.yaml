base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/024.yaml
  text: And gourds were under its rim all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The gourds were in two rows, cast in one piece with it.
translation:
  language: sw
  text: Chini ya ukingo wake kulikuwa na mapambo ya umbo la vibuyu[a], yakiyazunguka pande zote, kumi kwa kila dhiraa; yaliizunguka Bahari pande zote. Mapambo hayo yalikuwa katika safu mbili; yalimiminwa pamoja na umiminaji wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “machipukizi” au “vinundu”; neno la Kiebrania linamaanisha maumbo ya mapambo yanayofanana na vibuyu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקָעִים
  choice: mapambo ya umbo la vibuyu
  rationale: Neno hilo linaashiria maumbo ya mapambo yanayofanana na vibuyu. Tafsiri hii ni halisi na pia inaonyesha kwamba si lazima yawe vibuyu halisi.
- source_word: מִתַּחַת לִשְׂפָתוֹ
  choice: chini ya ukingo wake
  rationale: שָׂפָה ni 'mdomo' au 'ukingo'; kwa bakuli kubwa, 'ukingo' ni Kiswahili cha kawaida na wazi.
- source_word: סָבִיב סֹבְבִים אֹתוֹ
  choice: kuuzunguka pande zote
  rationale: Inahifadhi msisitizo wa mzizi unaorudiwa katika Kiebrania kwa usemi wa asili wa Kiswahili.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: kumi kwa kila dhiraa
  rationale: Kirai kinaeleza idadi ya mapambo katika kila kipimo cha dhiraa kuzunguka mzingo.
- source_word: מַקִּפִים אֶת הַיָּם סָבִיב
  choice: yaliizunguka ile Bahari pande zote
  rationale: Bahari ni jina la birika hili kubwa; 'ile' husaidia kuonyesha kuwa ni kitu maalumu, si bahari ya kawaida.
- source_word: שְׁנֵי טוּרִים
  choice: katika safu mbili
  rationale: טוּרִים humaanisha safu, na muundo huu ni wa kawaida katika Kiswahili.
- source_word: יְצֻקִים בִּיצֻקָתוֹ
  choice: yakiwa yamemiminwa pamoja nayo kuwa kitu kimoja
  rationale: Usemi wa Kiebrania unaonyesha kuwa mapambo yalitengenezwa kama sehemu ya umiminaji uleule, wala hayakuunganishwa baadaye.
