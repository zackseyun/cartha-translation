base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/032.yaml
  text: And the four wheels were underneath the panels[a], and the axles of the wheels were on the stand[b]; and the height of each wheel was a cubit and a half.
translation:
  language: sw
  text: Nayo magurudumu manne yalikuwa chini ya vibao[a], na ekseli za magurudumu zilikuwa kwenye kibebeo[b]. Kimo cha kila gurudumu kilikuwa dhiraa moja na nusu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “fremu” au “kingo” badala ya “vibao” (Kiebrania: מִסְגְּרוֹת).'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “mikono ya magurudumu”; katika muktadha huu huenda ikamaanisha ekseli au fito zinazobeba magurudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹפַנִּים / הָאוֹפַן
  choice: magurudumu / gurudumu
  rationale: Katika maelezo haya ya kifaa cha shaba, neno hili linamaanisha magurudumu halisi yaliyoshikamana na kitako.
- source_word: לְמִתַּחַת
  choice: chini ya
  rationale: Huwasilisha kwa Kiswahili cha kawaida uhusiano wa mahali, yaani kuwa upande wa chini wa kitu.
- source_word: הַמִּסְגְּרוֹת
  choice: vibao
  rationale: Katika muktadha wa ufundi, neno hili linaweza kumaanisha sehemu tambarare zilizowekwa katika fremu; 'vibao' ni fasaha na inaeleweka, huku maana mbadala zikihifadhiwa katika tanbihi.
- source_word: וִידוֹת
  choice: ekseli
  rationale: Ingawa maana yake ya msingi inahusiana na 'mikono,' hapa neno hilo linaonyesha sehemu zinazobeba au kuunganisha magurudumu; 'ekseli' hutoa maana ya kimakanika iliyo wazi.
- source_word: בַּמְּכוֹנָה
  choice: kwenye kitako
  rationale: מְכוֹנָה hapa ni kitako cha shaba chenye magurudumu; 'kwenye' haibani kwa lazima iwapo ekseli zilikuwa ndani yake au zimeshikamana nacho.
- source_word: קוֹמַת
  choice: kimo cha
  rationale: Hapa neno hilo linataja kipimo cha kwenda juu; 'kimo' ni sawa na cha kawaida katika Kiswahili.
- source_word: הָאֶחָד
  choice: kila
  rationale: Ingawa kwa umbo ni 'moja,' hapa hutumiwa kwa maana ya kugawa kipimo hicho kwa kila gurudumu.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: dhiraa moja na nusu
  rationale: Kipimo cha kale kinahifadhiwa badala ya kubadilishwa kuwa kipimo cha kisasa; huu ni usemi wa kawaida wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. 'Kitako' kimetumiwa kwa stand/base ya shaba, na 'ekseli' kama istilahi ya kawaida ya kimakanika. Alama zote za tanbihi zimewekwa ndani ya matini.
