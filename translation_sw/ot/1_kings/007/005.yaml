  text: All the doorways and the doorposts had square frames[b][a], and window was opposite window three times.
translation:
  language: sw
  text: Mianya yote ya milango na miimo ya milango ilikuwa na fremu za mraba[a]; dirisha lilikuwa mkabala na dirisha, mara tatu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mianya yote na miimo ya milango ilikuwa na vizingiti vya juu vya mraba.” Istilahi ya Kiebrania ya ujenzi huenda ikataja hasa sehemu ya juu ya fremu.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “dirisha mkabala na dirisha, mara tatu”; huenda maana yake ni madirisha yanayolingana yaliyopangwa katika safu au tabaka tatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתָחִים
  choice: mianya ya milango
  rationale: Neno hili humaanisha mianya au maingilio; hapa linataja sehemu za jengo, si vibao vya milango vinavyofunguliwa.
- source_word: מְּזוּזוֹת
  choice: miimo yake
  rationale: Neno hili hutaja nguzo za pembeni za mwanya wa mlango; “miimo” ni istilahi ya kawaida na sahihi katika Kiswahili.
- source_word: רְבֻעִים
  choice: za mraba
  rationale: Kivumishi hiki kinaonyesha umbo lenye pande au pembe nne; “za mraba” ni tafsiri fupi na ya kawaida katika maelezo ya jengo.
- source_word: שָׁקֶף
  choice: fremu
  rationale: Ni istilahi ya ujenzi yenye maana isiyo hakika kabisa, huenda ikitaja fremu au hasa sehemu yake ya juu; “fremu” haibani maana kwa kizingiti cha juu pekee.
- source_word: מ֧וּל
  choice: mkabala na
  rationale: Inaonyesha kuwa vitu vimeelekeana au vinalingana katika nafasi.
- source_word: מֶחֱזָה
  choice: dirisha
  rationale: Katika maelezo haya ya jengo, neno hili linaeleweka zaidi kuwa dirisha au mwanya wa kutazamia; “dirisha” ni tafsiri ya kawaida ya usanifu.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: mara tatu
  rationale: Hii inafuata kwa karibu usemi halisi wa Kiebrania na kuhifadhi kutokuwa wazi kama unamaanisha safu au tabaka tatu.
