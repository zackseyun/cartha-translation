  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶת הַ/סִּיר֨וֹת וְ/אֶת הַ/יָּעִ֜ים וְ/אֶת הַ/מִּזְרָק֗וֹת וְ/אֵת֙ כָּל הַ/כֵּלִ֣ים ה/אהל אֲשֶׁ֨ר עָשָׂ֥ה חִירָ֛ם לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מְמֹרָֽט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/045.yaml
  text: and the pots[a], the shovels, the basins[c][b], and all these vessels that Hiram made for King Solomon for the house of Yahweh were of burnished bronze.
translation:
  language: sw
  text: na masufuria, makoleo, mabeseni[a] na vyombo hivi vyote ambavyo Hiramu alimtengenezea Mfalme Sulemani kwa ajili ya nyumba ya Yahwe. Vyote vilikuwa vya shaba iliyong'arishwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mabakuli.”
    reason: lexical_alternative
  - marker: b
    text: Au “shaba iliyosuguliwa hadi kung'aa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: masufuria
  rationale: Neno סִירוֹת humaanisha vyombo kama sufuria au vyungu. “Masufuria” ni neno la kawaida na linalofaa katika orodha hii ya vifaa vya hekalu bila kubainisha matumizi yake kupita kiasi.
- source_word: הַיָּעִים
  choice: sepetu
  rationale: יָעִים ni vifaa vya kuondolea majivu au kuchotea vitu madhabahuni. “Sepetu” huonyesha kwa wazi aina ya kifaa kinachokusudiwa kuliko “majembe,” ambalo pia linaweza kueleweka kuwa vifaa vya kulimia.
- source_word: הַמִּזְרָקוֹת
  choice: mabeseni
  rationale: מִזְרָקוֹת ni vyombo vya kupokelea au kunyunyizia vimiminika. “Mabeseni” linafaa katika muktadha wa ibada, ingawa “mabakuli” pia linawezekana.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: vyombo hivi vyote
  rationale: כֵּלִים ni neno pana kwa vyombo au vifaa, na הָאֵלֶּה hurejelea vitu vilivyotajwa. Mpangilio huu ni wa kawaida katika Kiswahili.
- source_word: עָשָׂה חִירָם לַמֶּלֶךְ שְׁלֹמֹה
  choice: ambavyo Hiramu alimtengenezea Mfalme Sulemani
  rationale: Kitenzi עָשָׂה ni “tengeneza/fanya,” na kiambishi ל־ kinaonyesha mtu ambaye kazi hiyo ilifanywa kwa ajili yake. “Alimtengenezea” hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: בֵּית יְהוָה
  choice: kwa ajili ya nyumba ya Yahwe
  rationale: בֵּית ni “nyumba,” na katika muktadha huu ni jengo la ibada. “Nyumba ya Yahwe” inadumisha picha ya Kiebrania badala ya kuibadilisha kimya kimya kuwa “hekalu.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni jina la Mungu, tetragramu YHWH. Umbo la Kiswahili “Yahwe” hulitaja kama jina badala ya kulibadilisha kuwa cheo.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Katika orodha za vifaa vya hekalu, נְחֹשֶׁת hurejelea metali inayotafsiriwa kwa kawaida kuwa bronze. “Shaba” ndilo neno la kawaida la kibiblia na linaloeleweka katika Kiswahili kwa metali hiyo.
- source_word: מְמֹרָט
  choice: iliyong’arishwa
  rationale: מְמֹרָט hueleza metali iliyosuguliwa au kupigwa msasa hadi kung’aa. “Iliyong’arishwa” ni ya asili, wazi, na yenye hadhi katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kiebrania kinatumia moja kwa moja jina la agano YHWH. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, huku likitumia tahajia ya kawaida ya Kiswahili.
- issue: Uhusiano wa kifungu נְחֹשֶׁת מְמֹרָט na orodha nzima
  choice: Vyote vilikuwa vya shaba iliyong’arishwa
  alternative: '...nyumba ya Yahwe, vya shaba iliyong’arishwa'
  rationale: Kifungu cha mwisho ni kiarifu katika sentensi ya Kiebrania isiyo na kitenzi wazi na kinaeleza vitu vyote vilivyoorodheshwa. Sentensi fupi ya pili huonyesha uhusiano huo wazi kwa Kiswahili bila kubadili maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Sepetu” limetumiwa kwa kifaa cha kuondolea majivu; “nyumba ya Yahwe” limehifadhi sitiari ya Kiebrania. Sentensi imegawanywa mara mbili ili kiarifu cha mwisho kihusishwe kwa uwazi na orodha nzima.
