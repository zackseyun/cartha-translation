  text: וְ/כֹתָרֹ֗ת עַל שְׁנֵי֙ הָֽ/עַמּוּדִ֔ים גַּם מִ/מַּ֨עַל֙ מִ/לְּ/עֻמַּ֣ת הַ/בֶּ֔טֶן אֲשֶׁ֖ר לְ/עֵ֣בֶר שבכה וְ/הָ/רִמּוֹנִ֤ים מָאתַ֨יִם֙ טֻרִ֣ים סָבִ֔יב עַ֖ל הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/020.yaml
  text: And the capitals were on the two pillars[a], also above, opposite the bulge that was beside the latticework; and the pomegranates were two hundred, in rows all around[c][b], on the second capital.
translation:
  language: sw
  text: Mataji yaliyokuwa juu ya zile nguzo mbili yalikuwa pia upande wa juu, mkabala na sehemu iliyovimba[b] iliyokuwa kando ya mapambo ya wavu[c]. Nayo makomamanga mia mbili ya mapambo yalipangwa katika safu kuzunguka taji la pili[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “taji lile jingine.” Neno la Kiebrania linalotafsiriwa “la pili” huenda linatofautisha tu taji linalolingana nalo la nguzo ya pili katika maelezo haya ya usanifu.
    reason: alternative_reading
  - marker: b
    text: Kiebrania kihalisi “tumbo”; huenda ni sehemu ya taji iliyokuwa ya mviringo na iliyovimba.
    reason: lexical_alternative
  - marker: c
    text: Yaani, mapambo yaliyofumwa au kutengenezwa kama wavu na kuwekwa kwenye mataji.
    reason: cultural_note
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: mataji / taji
  rationale: Katika muktadha wa usanifu, neno hili linamaanisha sehemu ya juu yenye mapambo ya nguzo. “Taji” ni neno la kawaida na lenye kueleweka kwa sehemu hiyo.
- source_word: עַל שְׁנֵי הָעַמּוּדִים
  choice: juu ya zile nguzo mbili
  rationale: Huhifadhi kwa uwazi uhusiano wa mahali kati ya mataji na nguzo mbili.
- source_word: גַּם מִמַּעַל
  choice: pia upande wa juu
  rationale: Huhifadhi maana ya nyongeza ya גַּם na mwelekeo wa juu wa מִמַּעַל bila kulainisha kabisa sintaksia ngumu ya maelezo haya.
- source_word: מִלְעֻמַּת הַבֶּטֶן
  choice: mkabala na sehemu iliyovimba
  rationale: לְעֻמַּת ni “mkabala na,” na הַבֶּטֶן, ingawa kihalisi ni “tumbo,” hapa inaelekea kueleza sehemu ya taji yenye umbo la mviringo au uvimbe.
- source_word: אֲשֶׁר לְעֵבֶר שבכה
  choice: iliyokuwa kando ya mapambo ya wavu
  rationale: שבכה ni kazi ya mapambo yenye umbo la wavu. “Kando ya” inaonyesha uhusiano wa mahali bila kudai uhakika usiokuwapo katika sintaksia hii ngumu.
- source_word: הָרִמּוֹנִים
  choice: mapambo ... ya makomamanga
  rationale: Katika muktadha huu si matunda halisi bali maumbo ya makomamanga yaliyotumiwa kama mapambo.
- source_word: מָאתַיִם
  choice: mia mbili
  rationale: Ni tafsiri ya moja kwa moja ya idadi hiyo.
- source_word: טֻרִים
  choice: katika safu
  rationale: Neno hili linaonyesha vitu vilivyopangwa kwa mistari au safu.
- source_word: סָבִיב
  choice: kuzunguka
  rationale: Huonyesha kwamba mapambo hayo yaliwekwa pande zote za taji.
- source_word: עַל הַכֹּתֶרֶת הַשֵּׁנִית
  choice: kuzunguka taji la pili
  rationale: שֵּׁנִית kwa kawaida ni “la pili.” Muundo wa Kiswahili unaunganisha עַל na סָבִיב kwa kawaida huku ukihifadhi rejeo la taji la pili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mataji” limetumiwa kwa maana ya sehemu za juu za nguzo, huku “mapambo ya wavu” na “mapambo ya makomamanga” yakifanya maelezo ya usanifu yaeleweke kwa msomaji wa kawaida. Sintaksia ngumu ya Kiebrania imefanywa isomeke bila kuondoa kutokuwa na uhakika kuhusu mpangilio wa vipengele.
