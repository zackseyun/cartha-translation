base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/046.yaml
  text: In the plain of the Jordan the king cast them[c][b][a], in the clay ground between Sukkoth and Zarethan.
translation:
  language: sw
  text: Katika uwanda wa Yordani[a], mfalme alivisubu[b] katika udongo mzito[c], kati ya Sukothi na Sarethani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Bonde la Yordani.” Kiebrania kinarejelea eneo au uwanda wa Yordani.
    reason: lexical_alternative
  - marker: b
    text: Au, “alivimimina”; kitenzi hiki hurejelea kusubu vitu vya metali.
    reason: lexical_alternative
  - marker: c
    text: Kwa neno moja moja, “katika unene wa ardhi”; huenda maana yake ni udongo mnene, labda unaofaa kwa kusubia metali.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: Katika uwanda wa Yordani
  rationale: Katika muktadha wa kijiografia, כִּכָּר humaanisha eneo tambarare au uwanda; tafsiri hii ni ya asili katika Kiswahili na haiongezi ufafanuzi wa 'bonde' moja kwa moja.
- source_word: יְצָקָם
  choice: alivitengeneza kwa kuvimimina
  rationale: Kitenzi יצק kinaweza kumaanisha kumimina au kusubu metali. Usemi huu unaeleza kwa Kiswahili cha kawaida tendo la kutengeneza vitu vya shaba kwa kumimina metali iliyoyeyushwa, huku kiambishi '-vi-' kikirejelea vitu vilivyotajwa katika muktadha.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Maandishi ya Kiebrania yanasema 'mfalme' badala ya kutaja jina la Sulemani; tafsiri inadumisha namna hiyo ya kumrejelea.
- source_word: בְּמַעֲבֵה הָאֲדָמָה
  choice: katika udongo mzito
  rationale: מַעֲבֶה huonyesha unene au uzito/msongamano wa ardhi. 'Udongo mzito' huhifadhi maana ya msingi bila kuamua kwa uhakika kwamba ulikuwa udongo wa mfinyanzi.
- source_word: בֵּין סֻכּוֹת וּבֵין צָרְתָן
  choice: kati ya Sukothi na Zarethani
  rationale: Majina ya mahali yametoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku yakifuata maumbo ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. 'Kuvitengeneza kwa kuvimimina' limetumiwa badala ya istilahi ya kitaalamu pekee ili msomaji wa kawaida aelewe mchakato; tanbihi inatoa 'kuvisubu' kama mbadala. Utata wa בְּמַעֲבֵה הָאֲדָמָה umehifadhiwa kwa 'udongo mzito' na kufafanuliwa katika tanbihi.
