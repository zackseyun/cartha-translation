  source_fidelity: Marekebisho yanahitajika kwa kitenzi kikuu. Kiebrania יְצָקָם humaanisha moja kwa moja ‘alivisubu/alivimimina’; rasimu ‘alivitengeneza kwa kuvimimina’ huongeza tendo la ‘kutengeneza’ ambalo halisemwi wazi katika chanzo na hufanya usemi kuwa mzito. ‘Katika uwanda wa Yordani,’ ‘mfalme,’ na ‘katika udongo mzito’ kwa ujumla hudumisha maana na tahadhari ya chanzo.
  naturalness: ‘Mfalme alivisubu’ ni Kiswahili Sanifu, kifupi, na wazi katika muktadha wa vifaa vya metali. ‘Alivitengeneza kwa kuvimimina’ ni usemi wa maelezo ya ziada badala ya tafsiri ya moja kwa moja. Tahajia za majina ‘Sukothi’ na ‘Sarethani’ zinaendana na matumizi ya kawaida ya Biblia za Kiswahili.
