base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/038.yaml
  text: He made ten bronze basins[a]. Each basin held forty baths, and each basin was four cubits across[c][b]. One basin stood on each of the ten stands.
translation:
  language: sw
  text: Akatengeneza mabeseni kumi ya shaba. Kila beseni lilikuwa na ujazo wa bathi arobaini[a], na kila beseni lilikuwa na kipimo cha dhiraa nne[b]. Kulikuwa na beseni moja juu ya kila kimoja cha vile vibebeo kumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bathi” kilikuwa kipimo cha Kiebrania cha ujazo wa vimiminika.
    reason: cultural_note
  - marker: b
    text: Au “upana wa dhiraa nne” au “kipenyo cha dhiraa nne.” Kiebrania hapa kinasema tu “dhiraa nne” bila kutaja wazi aina ya kipimo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִיֹּרוֹת
  choice: mabeseni
  rationale: Ni vyombo vikubwa vya kuoshea vilivyotumiwa katika vifaa vya hekalu; “mabeseni” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Katika muktadha wa vifaa vya hekalu, neno hili kwa kawaida hurejelea metali ya shaba au aloi yake; “shaba” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: בַּת
  choice: bati
  rationale: Kipimo asilia cha Kiebrania kimehifadhiwa kwa kutoleta usahihi wa bandia kwa kukibadili kuwa kipimo cha kisasa.
- source_word: יָכִיל
  choice: lilikuwa na ujazo wa
  rationale: Kitenzi kinaeleza uwezo wa chombo kuchukua kiasi fulani; kauli hii ni ya asili na wazi kwa Kiswahili.
- source_word: אַרְבַּע בָּאַמָּה
  choice: upana wa dhiraa nne
  rationale: Kiebrania kinataja dhiraa nne bila neno bayana la kijiometri. “Upana” huwasilisha maana inayowezekana bila kuibana kuwa kipenyo cha kitaalamu.
- source_word: מְכוֹנָה
  choice: vikalio
  rationale: Katika muktadha huu ni miundo yenye magurudumu iliyobeba mabeseni; “vikalio” huonyesha kazi yake ya kutegemeza bila kuifanya aya hii itaje maelezo yote ya muundo.
- source_word: כִּיּוֹר אֶחָד עַל הַמְּכוֹנָה הָאַחַת לְעֶשֶׂר הַמְּכֹנוֹת
  choice: Beseni moja liliwekwa juu ya kila moja ya vile vikalio kumi
  rationale: 'Muundo wa Kiebrania una maana ya mgawanyo: beseni moja kwa kila kikalio kati ya vile kumi. Tafsiri hii huiweka wazi kwa Kiswahili cha kawaida.'
