base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/049.yaml
  text: and the lampstands[a], five on the right and five on the left, before the inner sanctuary, of pure gold; and the flowers, the lamps, and the tongs[c][b], of gold.
translation:
  language: sw
  text: na vinara vya taa, vitano upande wa kulia na vitano upande wa kushoto mbele ya patakatifu pa ndani[a], vya dhahabu safi[b]; na maua, taa, na makoleo[c], vya dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele ya Patakatifu Zaidi.” Neno la Kiebrania דְּבִיר linarejelea chumba cha ndani kabisa cha hekalu.
    reason: lexical_alternative
  - marker: b
    text: Au, “dhahabu iliyosafishwa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “vikata utambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרוֹת
  choice: vinara vya taa
  rationale: Neno hili linamaanisha vinara vinavyobeba taa za mafuta, si taa zenyewe wala mishumaa.
- source_word: מִיָּמִין ... מִשְּׂמֹאול
  choice: upande wa kulia ... upande wa kushoto
  rationale: Huhifadhi lugha halisi ya mahali katika Kiebrania bila kuibadili kimafafanuzi kuwa kusini na kaskazini.
- source_word: לִפְנֵי הַדְּבִיר
  choice: mbele ya patakatifu pa ndani
  rationale: דְּבִיר ni chumba cha ndani kabisa cha hekalu; tafsiri hii ni wazi na ya kawaida huku ikihifadhi maana yake ya kimsingi.
- source_word: זָהָב סָגוּר
  choice: dhahabu safi
  rationale: Kirai hiki kinaelekea kumaanisha dhahabu ya hali ya juu iliyosafishwa; ‘dhahabu safi’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: הַפֶּרַח
  choice: maua
  rationale: Ingawa umbo la Kiebrania ni umoja, hapa linaweza kuwa nomino ya mkusanyiko inayorejelea mapambo ya maua kwenye vinara.
- source_word: הַנֵּרֹת
  choice: taa
  rationale: Hizi ni taa moja moja zilizowekwa kwenye vinara; ‘taa’ ni kisawe cha moja kwa moja.
- source_word: הַמֶּלְקַחַיִם
  choice: makoleo
  rationale: Neno hilo linataja kifaa cha kushikia kilichotumiwa katika kuhudumia taa; ‘makoleo’ huhifadhi maana ya msingi bila kulazimisha kazi maalumu zaidi.
- source_word: זָהָב
  choice: vya dhahabu
  rationale: Dhahabu ya mwisho inahusu maua, taa, na makoleo, na muundo huu unafaa kwa orodha ya vifaa.
