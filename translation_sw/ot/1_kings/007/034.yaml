  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi unahifadhi msisitizo wa Kiebrania kuhusu kitako ‘kimoja’ bila kuubadili kuwa ‘kila kitako.’
