  yaml_path: translation/ot/1_kings/007/034.yaml
  text: And there were four supports at the four corners of the one stand; its supports were part of the stand itself.
translation:
  language: sw
  text: Kulikuwa na viunzi vinne kwenye pembe nne za kile kitako kimoja; viunzi vyake vilikuwa sehemu ya kitako chenyewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּתֵפוֹת / כְּתֵפֶיהָ
  choice: viunzi / viunzi vyake
  rationale: Ingawa neno hili kimsingi humaanisha “mabega,” hapa linataja sehemu za kimuundo zinazotokeza na kutegemeza; “viunzi” ni ya kawaida na inaeleweka katika maelezo haya ya ufundi.
- source_word: מְכוֹנָה
  choice: kitako
  rationale: Katika muktadha wa vyombo vya hekalu, neno hili linamaanisha msingi au standi yenye magurudumu iliyobeba birika; “kitako” kinaonyesha sehemu ya chini inayobeba kitu bila kuongeza maelezo yasiyotajwa katika mstari.
- source_word: הָאֶחָת
  choice: kile ... kimoja
  rationale: Huhifadhi usemi wa Kiebrania unaosema kihalisi “kile kimoja,” badala ya kuugeuza kuwa “kila,” hivyo kutodhoofisha upekee au ugumu wa maandishi.
- source_word: מִן הַמְּכֹנָה
  choice: vilikuwa sehemu ya kitako chenyewe
  rationale: Kihalisi ni “kutoka katika kitako”; katika maelezo ya ujenzi maana yake ni kwamba viunzi vilitengenezwa pamoja na kitako, si vipande vilivyoongezwa baadaye.
