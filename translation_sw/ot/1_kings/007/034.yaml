  text: וְ/אַרְבַּ֣ע כְּתֵפ֔וֹת אֶ֚ל אַרְבַּ֣ע פִּנּ֔וֹת הַ/מְּכֹנָ֖ה הָֽ/אֶחָ֑ת מִן הַ/מְּכֹנָ֖ה כְּתֵפֶֽי/הָ־׃
