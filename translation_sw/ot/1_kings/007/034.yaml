  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa Kiebrania: viunzi vinne viko kwenye pembe nne za kitako kimoja, na viunzi hivyo vinaelezwa kuwa vya kitako chenyewe (yaani, vimeunganishwa nacho badala ya kuongezwa kivyake). Usemi “kile kitako kimoja” huhifadhi הָאֶחָת, sawa na mkondo wa ukaguzi wa Kiingereza “the one stand,” bila kuugeuza kuwa “kila.”'
