  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kiunzi’ limetumiwa kwa stand/base yenye magurudumu; sentensi imehifadhi urudiaji wa ‘juu ya kiunzi’ uliomo katika Kiebrania na imeweka tanbihi kwenye istilahi mbili za usanifu zenye utata.
