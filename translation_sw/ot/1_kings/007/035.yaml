base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/035.yaml
  text: And on the top of the stand there was a round rim all around[a], half a cubit high[b]; and on the top of the stand its supports and its panels were of one piece with it.
translation:
  language: sw
  text: Juu ya kiunzi hicho kulikuwa na ukingo wa mviringo uliozunguka pande zote, wenye kimo cha nusu dhiraa; na juu ya kiunzi hicho, viegemezo vyake[a] na paneli zake[b] vilikuwa sehemu ya kiunzi hicho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vishikio vyake.” Neno la Kiebrania יְדֹתֶיהָ kihalisi ni “mikono yake” na linaweza kumaanisha sehemu zilizochomoza za kiunzi.
    reason: lexical_alternative
  - marker: b
    text: Au “fremu zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹאשׁ הַמְּכוֹנָה
  choice: Juu ya kiunzi hicho
  rationale: רֹאשׁ ni ‘kichwa/sehemu ya juu,’ na katika maelezo ya kifaa hiki ‘juu’ ni ya kawaida. מְכוֹנָה hapa ni kiunzi cha shaba chenye magurudumu kilichobeba birika.
- source_word: חֲצִי הָאַמָּה קוֹמָה
  choice: wenye kimo cha nusu dhiraa
  rationale: קֹמָה huonyesha kimo; tafsiri hii inahifadhi kipimo cha asili kwa lugha ya kawaida ya Kiswahili.
- source_word: עָגֹל סָבִיב
  choice: ukingo wa mviringo uliozunguka pande zote
  rationale: עָגֹל ni ‘wa mviringo’ na סָבִיב ni ‘kuzunguka/pande zote.’ Kwa kuwa nomino ya sehemu hiyo haikutajwa wazi katika Kiebrania, ‘ukingo’ inaeleza kwa ufupi umbo la juu bila kulifanya kuwa maalumu kupita ushahidi.
- source_word: יְדֹתֶיהָ
  choice: viegemezo vyake
  rationale: Neno hili kihalisi ni ‘mikono yake,’ lakini katika maelezo ya kitu linaweza kumaanisha sehemu zinazochomoza, vishikio, au viegemezo. ‘Viegemezo’ linafaa muktadha wa ujenzi, huku uwezekano wa ‘vishikio’ ukihifadhiwa katika tanbihi.
- source_word: וּמִסְגְּרֹתֶיהָ
  choice: mabamba yake
  rationale: מִסְגְּרוֹת hapa huenda ni sehemu zilizozingirwa au paneli za kiunzi. ‘Mabamba’ ni neno la kawaida na linaloeleweka, huku ‘fremu’ ikibaki kuwa tafsiri nyingine inayowezekana.
- source_word: מִמֶּנָּה
  choice: vilikuwa sehemu yake yenyewe
  rationale: מן pamoja na kiambishi hapa huonyesha kwamba sehemu hizo zilitokana na kiunzi na hazikuwa viambatisho tofauti; usemi huu unaonyesha muungano huo bila kudai mbinu maalumu ya utengenezaji.
