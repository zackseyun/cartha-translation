base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/021.yaml
  text: He set up the pillars at the portico of the temple[a]. He set up the right pillar and called its name Jachin; then he set up the left pillar and called its name Boaz.
translation:
  language: sw
  text: Akazisimamisha zile nguzo kwenye ukumbi wa hekalu. Akasimamisha nguzo ya upande wa kulia na kuiita Yakini; kisha akasimamisha nguzo ya upande wa kushoto na kuiita Boazi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yakini na Boazi ni majina ya Kiebrania ya nguzo yaliyotoholewa, si tafsiri za maana zake zinazowezekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: akazisimamisha / akasimamisha
  rationale: Hifili ya קום hapa ina maana ya kufanya kitu kisimame, yaani kukiweka au kukisimamisha mahali pake. ‘Kusimamisha’ ni Kiswahili cha kawaida na kinafaa kwa nguzo.
- source_word: הָעַמֻּדִים
  choice: zile nguzo
  rationale: עַמּוּד humaanisha nguzo. Kionyeshi ‘zile’ kinawakilisha umaalumu wa kifungu cha Kiebrania na kurejelea nguzo zilizotajwa katika muktadha.
- source_word: לְאֻלָם הַהֵיכָל
  choice: kwenye ukumbi wa hekalu
  rationale: אוּלָם ni ukumbi au sehemu ya kuingilia mbele ya jengo la hekalu. ‘Kwenye’ linaeleza mahali ziliposimamishwa bila kulazimisha tafsiri ya kusudi.
- source_word: הָעַמּוּד הַיְמָנִי
  choice: nguzo ya upande wa kulia
  rationale: יְמָנִי humaanisha ya upande wa kulia. Tafsiri hii huhifadhi maelekezo ya kimaeneo bila kuyageuza kuwa upande wa dira.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ
  choice: na kuiita
  rationale: Nahau ya Kiebrania ni ‘akaliita jina lake,’ lakini ‘kuiita’ ni Kiswahili cha sasa na cha kawaida kinachowasilisha tendo la kuipa jina.
- source_word: יָכִין
  choice: Yakini
  rationale: Ni jina maalumu la nguzo, kwa hiyo limetoholewa badala ya kutafsiriwa maana yake inayowezekana. ‘Yakini’ linafuata umbo linalotambulika katika mapokeo ya Kiswahili.
- source_word: הָעַמּוּד הַשְּׂמָאלִי
  choice: nguzo ya upande wa kushoto
  rationale: שְׂמָאלִי humaanisha ya upande wa kushoto; uchaguzi huu unahifadhi usambamba na nguzo ya upande wa kulia.
- source_word: בֹּעַז
  choice: Boazi
  rationale: Ni jina maalumu, hivyo limetoholewa kwa umbo la kawaida la Kiswahili badala ya kutafsiriwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima. Urudiaji wa ‘akasimamisha’ umehifadhiwa ili kuonyesha usambamba wa Kiebrania; majina yametoholewa kwa maumbo yanayotambulika katika Kiswahili.
