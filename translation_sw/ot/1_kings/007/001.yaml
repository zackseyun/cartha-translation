  text: Sulemani alijenga nyumba yake kwa miaka kumi na mitatu[a], na akaikamilisha nyumba yake yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jumba lake la kifalme.” Neno la Kiebrania lililotafsiriwa “nyumba” linaweza kumaanisha makao ya kifalme au tata ya majengo ya jumba la kifalme katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: nyumba yake mwenyewe
  rationale: Neno בַּיִת kwa kawaida humaanisha nyumba, lakini katika muktadha wa kifalme linaweza kumaanisha makao ya mfalme au jumba zima la kifalme. Tafsiri hii inadumisha neno la Kiebrania huku “mwenyewe” ikionyesha utofautishaji na ujenzi wa hekalu uliotangulia.
- source_word: בָּנָה
  choice: alijenga
  rationale: Kitenzi cha Qal perfect, nafsi ya tatu umoja wa kiume, kinatoa maana rahisi ya masimulizi ya wakati uliopita.
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: kwa miaka kumi na mitatu
  rationale: Kirai hiki kinaonyesha muda ambao ujenzi huo uliendelea; “kwa miaka” ni Kiswahili cha kawaida na cha wazi.
- source_word: וַיְכַל
  choice: akaimaliza
  rationale: Wayyiqtol kutoka כלה inaendeleza masimulizi na kuonyesha kwamba Sulemani alikamilisha mradi huo baada ya miaka kumi na mitatu.
- source_word: כָּל בֵּיתוֹ
  choice: nyumba yake yote
  rationale: כָּל huonyesha ukamilifu. Kurudia “nyumba” kunadumisha mwendelezo wa msamiati na kunaelekeza kwenye makao au jengo lote, si watu wa kaya.
- source_word: וְאֶת
  choice: Sulemani alijenga nyumba yake mwenyewe
  rationale: Kiunganishi pamoja na kiashiria cha yambwa kinaanzisha mada mpya inayohusiana lakini inayotofautishwa na habari ya hekalu. Kiswahili kinaonyesha nguvu hiyo kwa “yake mwenyewe” bila kutafsiri kiashiria cha yambwa moja kwa moja.
