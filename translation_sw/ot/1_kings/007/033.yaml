base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/033.yaml
  text: The workmanship of the wheels was like the workmanship of a chariot wheel[a]; their axles, their rims, their spokes[b], and their hubs were all cast metal.
translation:
  language: sw
  text: Muundo wa magurudumu hayo ulikuwa kama muundo wa gurudumu la gari la vita. Mihimili yake[a], kingo zake, miale yake na vitovu vyake[b], vyote vilitengenezwa kwa metali iliyomiminwa katika kalibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mipini” au “viegemezo” badala ya “mihimili”; neno la Kiebrania kimsingi huhusiana na “mikono,” lakini katika muktadha huu huenda linamaanisha sehemu za mhimili au sehemu zinazoyategemeza magurudumu.
    reason: lexical_alternative
  - marker: b
    text: Au “kanda” badala ya “miale,” na “viunzi” au “viungio” badala ya “vitovu”; maneno yote mawili ya Kiebrania ni adimu, na maana zake kamili za kiufundi zinakisiwa kutokana na muktadha wa ujenzi wa gurudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: muundo
  rationale: Katika maelezo haya neno hilo linahusu jinsi kitu kilivyoundwa au kutengenezwa; “muundo” ni la kawaida na linaeleweka kwa urahisi.
- source_word: הָאֹפַנִּים / אוֹפַן
  choice: magurudumu / gurudumu
  rationale: Hii ndiyo maana ya kawaida katika muktadha huu; wingi wa kwanza na umoja katika ulinganisho vimehifadhiwa.
- source_word: כְּמַעֲשֵׂה
  choice: ulikuwa kama muundo wa
  rationale: Huhifadhi ulinganisho unaoletwa na kiambishi כְּ kwa Kiswahili cha kawaida.
- source_word: הַמֶּרְכָּבָה
  choice: gari la vita
  rationale: Katika mazingira ya kale מֶרְכָּבָה kwa kawaida ni gari la vita, si gari la kawaida la kubebea watu.
- source_word: יְדוֹתָם
  choice: mihimili yake
  rationale: Ingawa maana ya msingi ya יָד huhusiana na mkono au mpini, katika orodha ya sehemu za gurudumu inaelekea kumaanisha mihimili au sehemu zinazolishikilia.
- source_word: גַבֵּיהֶם
  choice: kingo zake
  rationale: Katika ujenzi wa gurudumu neno hili linaeleweka kuwa sehemu za nje zinazolizunguka gurudumu; “kingo” ni neno wazi la Kiswahili.
- source_word: חִשֻּׁקֵיהֶם
  choice: miale yake
  rationale: Neno hilo adimu linaeleweka katika muktadha kuwa vijiti vinavyounganisha kitovu na ukingo wa gurudumu; “miale” huepuka mkopo usio wa lazima wa “spoki”.
- source_word: חִשֻּׁרֵיהֶם
  choice: vitovu vyake
  rationale: Katika orodha ya sehemu za gurudumu, neno hili adimu linaelekea kumaanisha sehemu za katikati za magurudumu.
- source_word: הַכֹּל
  choice: vyote
  rationale: Hujumlisha sehemu zote zilizotajwa na kupatana kisarufi na orodha hiyo.
- source_word: מוּצָק
  choice: vilitengenezwa kwa kumimina chuma kilichoyeyushwa katika kalibu
  rationale: Umbo hili kutoka יצק linaonyesha kazi ya kumimina chuma kilichoyeyushwa; tafsiri hii inaeleza kwa Kiswahili cha kawaida maana ya kitu kilichofinyangwa kwa njia ya kalibu.
