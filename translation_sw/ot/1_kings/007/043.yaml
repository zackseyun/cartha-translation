lexical_decisions:
- source_word: וְ/אֶת
  choice: na
  rationale: וְ huendeleza orodha kwa kuongeza vitu vingine; אֵת ni kiashiria cha yambwa mahsusi na hakihitaji neno tofauti katika Kiswahili.
- source_word: הַ/מְּכֹנוֹת
  choice: vile vishikio
  rationale: Katika muktadha wa vifaa vya hekalu, מְכֹנוֹת ni miundo yenye magurudumu iliyobeba mabeseni. “Vishikio” huonyesha kazi yake ya kushikilia bila kusisitiza kupita kiasi kwamba ilikuwa mikokoteni.
- source_word: עָשֶׂר
  choice: kumi
  rationale: Ni namba ya msingi inayohesabu מְכֹנוֹת.
- source_word: הַ/כִּיֹּרֹת
  choice: mabeseni
  rationale: כִּיּוֹר ni chombo kikubwa cha kuoshea; “mabeseni” ni neno la sasa, linaloeleweka kwa urahisi kuliko istilahi ya kale.
- source_word: עֲשָׂרָה
  choice: kumi
  rationale: Ni namba ya msingi inayohesabu כִּיֹּרוֹת.
- source_word: עַל
  choice: juu ya
  rationale: Hueleza mahali mabeseni yalipowekwa, yaani juu ya miundo iliyoyashikilia.
- source_word: הַ/מְּכֹנוֹת
  choice: vile vishikio
  rationale: Neno limetafsiriwa kwa namna ileile katika kutokea kwake mara ya pili ili kudumisha ulinganifu ndani ya mstari.
