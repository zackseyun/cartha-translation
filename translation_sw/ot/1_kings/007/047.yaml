  yaml_path: translation/ot/1_kings/007/047.yaml
  text: And Solomon left all the vessels unweighed because they were exceedingly many[a]; the weight of the bronze was not determined.
translation:
  language: sw
  text: Basi Solomoni akaacha vyombo vyote bila kuvipima uzito kwa sababu vilikuwa vingi mno[a]; uzito wa shaba haukujulikana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Basi Solomoni akaacha vyombo vyote kwa sababu vilikuwa vingi mno; uzito wa shaba haukuchunguzwa wala kubainishwa.”
    reason: Neno la Kiebrania lililotafsiriwa “akaacha ... bila kuvipima uzito” linaweza kutafsiriwa kwa maana ya kawaida ya “akaacha”; sentensi inayofuata ndipo inaeleza kwamba uzito haukubainishwa.
lexical_decisions:
- source_word: וַיַּנַּח
  choice: akaacha ... bila kuvipima uzito
  rationale: Kitenzi kinaweza kumaanisha kuweka, kuacha, au kutofanya jambo zaidi. Muktadha unaofuata unasema uzito haukujulikana; hivyo tafsiri hii inaeleza kwa Kiswahili cha kawaida kile kilichoachwa bila kufanywa huku ikihifadhi maana ya muktadha.
- source_word: כָּל הַכֵּלִים
  choice: vyombo vyote
  rationale: כֵּלִים ni neno pana kwa vifaa au vyombo. Katika muktadha wa vifaa vya hekalu, “vyombo” ni neno la kawaida, halisi, na linaloeleweka.
- source_word: מֵרֹב מְאֹד מְאֹד
  choice: kwa sababu vilikuwa vingi mno
  rationale: מִן pamoja na רֹב inaonyesha sababu inayotokana na wingi, na kurudiwa kwa מְאֹד kunatia mkazo mkubwa. “Vingi mno” ni Kiswahili cha asili kinachohifadhi mkazo huo.
- source_word: לֹא נֶחְקַר
  choice: haukujulikana
  rationale: Nifali ya חקר hapa humaanisha kwamba jambo halikuchunguzwa au kuthibitishwa ili lijulikane. Kuhusu uzito, “haukujulikana” huwasilisha matokeo bila kudai mbinu maalumu ya kuupata.
- source_word: מִשְׁקַל
  choice: uzito
  rationale: Nomino hii humaanisha uzito au kiasi kwa uzito; “uzito” ndiyo tafsiri ya moja kwa moja na ya kawaida.
- source_word: הַנְּחֹשֶׁת
  choice: shaba
  rationale: Katika Kiswahili cha Biblia na katika muktadha wa vyombo vya hekalu, “shaba” ni neno la kawaida kwa נְחֹשֶׁת, ingawa kihistoria nyenzo hiyo mara nyingi ilikuwa aloi ya shaba, yaani bronzi.
