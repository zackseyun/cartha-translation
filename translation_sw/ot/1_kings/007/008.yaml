base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/008.yaml
  text: His house where he was to live[a], in the other court farther back from the Hall, was of the same workmanship. He also made a house like this Hall for Pharaoh’s daughter[b], whom Solomon had taken as wife.
translation:
  language: sw
  text: Nyumba yake, ambamo angeishi[a], ilikuwa katika ua ule mwingine, upande wa ndani zaidi ya Ukumbi, nayo ilijengwa kwa ufundi uleule. Pia alimjengea binti ya Farao[b], ambaye Sulemani alimwoa, nyumba iliyofanana na Ukumbi huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nyumba yake ambamo angeishi ilikuwa katika ua mwingine, upande wa ndani zaidi ya Ukumbi.” Kirai cha Kiebrania kinachoonyesha mahali ni kigumu, na tafsiri hutofautiana kuhusu mahali nyumba hiyo ilipokuwa kuhusiana na Ukumbi.
    reason: alternative_reading
  - marker: b
    text: Kiebrania kihalisi, “ambaye Sulemani alikuwa amemchukua”; yaani, alikuwa amemchukua kuwa mke.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵיתוֹ
  choice: Nyumba yake
  rationale: Kiunganishi וּ kinaingizwa katika mtiririko wa maelezo; nomino yenye kiambishi cha nafsi ina maana ya ‘nyumba yake.’
- source_word: אֲשֶׁר יֵשֶׁב שָׁם
  choice: ambamo angeishi
  rationale: יָשַׁב hapa ina maana ya kukaa au kuishi; hali ya kusudi au matumizi yaliyotarajiwa ya nyumba inaelezwa kwa kawaida kwa ‘angeishi.’
- source_word: חָצֵר הָאַחֶרֶת
  choice: ua ule mwingine
  rationale: חָצֵר ni ua wa jengo; kibainishi kinaelekeza kwenye ua mahususi mwingine katika jumba hilo.
- source_word: מִבֵּית לָאוּלָם
  choice: ndani zaidi kutoka kwenye Ukumbi
  rationale: Kirai hiki cha mahali ni kigumu. Tafsiri hii inaonyesha kuwa ua ulikuwa upande wa ndani zaidi ukilinganishwa na Ukumbi, bila kudai kwa uhakika mpangilio maalumu wa majengo.
- source_word: כַּמַּעֲשֶׂה הַזֶּה הָיָה
  choice: ilijengwa kwa ufundi uleule
  rationale: מַעֲשֶׂה katika muktadha huu hurejelea kazi au ufundi wa ujenzi; usemi huu wa Kiswahili unaonyesha ulinganisho na jengo lililotangulia.
- source_word: וּבַיִת יַעֲשֶׂה לְבַת פַּרְעֹה
  choice: Pia alimjengea binti ya Farao nyumba
  rationale: Yiqtol inaendeleza muhtasari wa ujenzi uliopita; muundo wa ‘alimjengea’ unaonyesha wazi mlengwa wa nyumba bila kubadili maana.
- source_word: אֲשֶׁר לָקַח שְׁלֹמֹה
  choice: ambaye Sulemani alikuwa amemwoa
  rationale: לָקַח ikitumiwa kuhusu mwanamke katika muktadha huu ni nahau ya kumchukua kuwa mke; ‘amemwoa’ ni Kiswahili cha kawaida na sahihi.
- source_word: כָּאוּלָם הַזֶּה
  choice: iliyofanana na Ukumbi huo
  rationale: אוּלָם hapa ni ukumbi mkubwa wa jumba, na כ־ huonyesha kufanana.
