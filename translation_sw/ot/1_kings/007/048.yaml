  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית יְהוָ֑ה אֵ֚ת מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָ֗ן אֲשֶׁ֥ר עָלָ֛י/ו לֶ֥חֶם הַ/פָּנִ֖ים זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/048.yaml
  text: 'And Solomon made all the vessels that were in the house of Yahweh: the golden altar[a], and the table on which was the bread of the Presence[b], of gold.'
translation:
  language: sw
  text: 'Naye Solomoni akatengeneza vyombo vyote vilivyokuwa katika nyumba ya Yahweh: madhabahu ya dhahabu, na meza ya dhahabu ambayo juu yake palikuwa na mikate ya Uwepo[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikate ya wonyesho.” Kihalisi, “mkate wa Uwepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akatengeneza
  rationale: Kitenzi עשה kina maana pana ya kufanya au kutengeneza; katika orodha ya vifaa vya ibada, “akatengeneza” ni cha kawaida na kinaonyesha utengenezaji bila kuongeza maelezo yasiyokuwapo.
- source_word: כָּל הַכֵּלִים
  choice: vyombo vyote
  rationale: כֵּלִים humaanisha vyombo, vifaa, au vitu vya matumizi. “Vyombo” linafaa katika muktadha wa vitu vya hekalu vinavyotajwa.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Tafsiri hii inahifadhi kwa karibu neno בֵּית, “nyumba,” pamoja na jina la agano יְהוָה kama “Yahweh.”
- source_word: מִזְבַּח הַזָּהָב
  choice: madhabahu ya dhahabu
  rationale: Ni tafsiri ya kawaida na wazi ya muundo wa Kiebrania, bila kuamua zaidi ya maandishi kama madhabahu yote yalikuwa dhahabu au yalifunikwa kwa dhahabu.
- source_word: הַשֻּׁלְחָן ... זָהָב
  choice: meza ya dhahabu
  rationale: Neno זָהָב la mwisho linaeleweka kwa kawaida kuwa linaielezea meza; kulileta karibu na “meza” kunafanya Kiswahili kiwe wazi na cha asili.
- source_word: אֲשֶׁר עָלָיו
  choice: ambayo juu yake palikuwa na
  rationale: Huhifadhi uhusiano wa mahali wa kifungu cha Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: לֶחֶם הַפָּנִים
  choice: mikate ya Uwepo
  rationale: Huhifadhi maana ya istilahi ya ibada, yaani mikate iliyowekwa mbele ya uwepo wa Mungu, huku wingi “mikate” ukiwasilisha kwa kawaida kitu kinachojulikana katika muktadha wa hekalu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina la pekee la Mungu, YHWH. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לֶחֶם הַפָּנִים
  choice: mikate ya Uwepo
  alternative: mikate ya wonyesho
  rationale: “Mikate ya Uwepo” inahifadhi maana halisi na ya kiibada ya kuwa mbele za uwepo wa Mungu bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa asili kwa Kiswahili, huku istilahi kuu za maandishi ya Kiebrania zikihifadhiwa.
