base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/023.yaml
  text: Then he made the cast sea[a], ten cubits from brim to brim, round all around; its height was five cubits[c][b], and a line of thirty cubits went around it all around.
translation:
  language: sw
  text: Kisha akatengeneza Bahari iliyosubiwa[a]. Ilikuwa na dhiraa kumi kutoka ukingo mmoja hadi mwingine, nayo ilikuwa ya mviringo pande zote. Kimo chake kilikuwa dhiraa tano, na kamba ya dhiraa thelathini iliizunguka pande zote.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “beseni.” Kiebrania hukiita chombo hiki kikubwa cha Hekalu “Bahari”; jina hilo rasmi limehifadhiwa katika matini kuu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kamba ya dhiraa thelathini”; yaani, mzingo wake ulikuwa dhiraa thelathini.'
    reason: cultural_note
  - marker: c
    text: Neno lililoandikwa hapa ni קוה; kwa mapokeo husomwa קו, kwa maana ya kamba au mstari wa kupimia. Linganisha 2 Mambo ya Nyakati 4:2.
    reason: textual_variant
lexical_decisions:
- source_word: הַיָּם
  choice: Bahari
  rationale: Jina rasmi la chombo hiki kikubwa cha Hekalu katika Kiebrania ni “Bahari.” Kulihifadhi kama jina maalumu kunadumisha taswira ya matini, huku tanbihi ikieleza kwamba kilikuwa birika kubwa.
- source_word: מוּצָק
  choice: ya chuma cha kusubu
  rationale: Neno linaeleza kitu kilichotengenezwa kwa kumimina metali iliyoyeyushwa katika kalibu. Kiswahili hiki ni cha kawaida na kinaonyesha kuwa Bahari ilikuwa chombo cha metali iliyosubiwa.
- source_word: עֶשֶׂר בָּאַמָּה מִשְּׂפָתוֹ עַד שְׂפָתוֹ
  choice: dhiraa kumi kutoka ukingo mmoja hadi mwingine
  rationale: Kirai kinapima upana kutoka upande mmoja wa ukingo wa chombo hadi upande mwingine; tafsiri hii ni ya asili zaidi kuliko kurudia “kutoka ukingo wake hadi ukingo wake.”
- source_word: עָגֹל סָבִיב
  choice: ya mviringo pande zote
  rationale: Huhifadhi maelezo ya umbo la duara pamoja na msisitizo wa kwamba lilikuwa hivyo kuzunguka chombo chote.
- source_word: קוֹמָתוֹ
  choice: kimo chake
  rationale: Katika muktadha wa vipimo vya jengo au chombo, “kimo” ni tafsiri ya kawaida na sahihi.
- source_word: וְקוה
  choice: na kamba yenye urefu wa dhiraa thelathini
  rationale: Umbo lililoandikwa קוה linaeleweka kama mstari au kamba ya kupimia; “kamba” huweka picha halisi ya kifaa cha kale cha kupimia na kuifanya sentensi ieleweke kwa urahisi.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: iliizunguka pande zote
  rationale: Huhifadhi maana ya kuzunguka chombo na msisitizo wa סָבִיב bila urudiaji usio wa kawaida katika Kiswahili.
- source_word: אַמָּה
  choice: dhiraa
  rationale: “Dhiraa” ni istilahi ya kawaida ya Kibiblia katika Kiswahili kwa kipimo hiki cha kale; haibadilishwi kuwa kipimo cha kisasa katika matini kuu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Bahari” imetumiwa kama jina rasmi la chombo na kuandikwa kwa herufi kubwa ili kutofautisha na bahari ya kawaida. Vipimo vimegawanywa katika sentensi fupi kwa uwazi. Alama zote za tanbihi zimo katika matini kuu.
