  text: And the one stand had four bronze wheels and bronze axles[a], and its four corners had supports for them; beneath the basin the supports were cast[c][b], each beside wreathwork.
translation:
  language: sw
  text: 'Kila kiunzi[a] kilikuwa na magurudumu manne ya shaba na eseli za shaba. Kwenye miguu yake minne kulikuwa na viegemezo[b]. Chini ya birika, viegemezo hivyo vilitengenezwa kwa kumimina metali katika kalibu, kila kimoja kando ya mapambo ya vigwe[c].


    [a] Au “msingi”; neno la Kiebrania מְכוֹנָה linamaanisha muundo wenye magurudumu uliobeba birika.


    [b] Neno la Kiebrania כְּתֵפֹת kwa maana halisi ni “mabega”; hapa huenda linamaanisha vipande vilivyojitokeza au vya kutegemezea.


    [c] Neno la mwisho la Kiebrania ni nadra; huenda linamaanisha mapambo ya vigwe, shada za maua, au vitambaa vya sherehe vilivyoning’inizwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msingi”; neno la Kiebrania מְכוֹנָה linamaanisha muundo wenye magurudumu uliobeba birika.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania כְּתֵפֹת kwa maana halisi ni “mabega”; hapa huenda linamaanisha vipande vilivyojitokeza au vya kutegemezea.
    reason: lexical_alternative
  - marker: c
    text: Neno la mwisho la Kiebrania ni nadra; huenda linamaanisha mapambo ya vigwe, shada za maua, au vitambaa vya sherehe vilivyoning’inizwa.
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: אוֹפַנֵּי נְחֹשֶׁת
  choice: magurudumu ya shaba
  rationale: אוֹפַנִּים ni magurudumu, na נְחֹשֶׁת katika maelezo ya vifaa vya hekalu kwa kawaida humaanisha shaba/bronzi; “shaba” ni neno la kawaida na linaloeleweka katika Kiswahili cha Biblia.
- source_word: לַמְּכוֹנָה הָאַחַת
  choice: kila tako
  rationale: מְכוֹנָה ni muundo au msingi wenye magurudumu uliobeba birika. Ingawa Kiebrania kinasema kwa namna ya “tako moja,” muktadha unaeleza sifa ya kila tako, hivyo “kila tako” ni Kiswahili cha asili bila kubadili maana.
- source_word: סַרְנֵי נְחֹשֶׁת
  choice: mihimili ya shaba
  rationale: Katika muktadha wa magurudumu, סַרְנִים humaanisha mihimili inayounganisha au kubeba magurudumu; “mihimili” ni ya asili zaidi kuliko mkopo wa “ekseli.”
- source_word: פַעֲמֹתָיו
  choice: miguu yake minne
  rationale: Neno hili linaweza kutaja miguu au sehemu za chini za kitu. “Miguu” huhifadhi taswira ya Kiebrania, ingawa kimuundo huenda ikawa pembe nne za tako.
- source_word: כְּתֵפֹת
  choice: viegemezo
  rationale: Maana halisi ni “mabega,” lakini hapa ni vipande vilivyojitokeza na kutegemeza birika; “viegemezo” huwasilisha kazi yake huku tanbihi ikihifadhi taswira halisi.
- source_word: מִתַּחַת לַכִּיֹּר
  choice: chini ya birika
  rationale: כִּיּוֹר ni chombo kikubwa cha kuoshea au birika; “chini ya birika” huhifadhi uhusiano wa mahali.
- source_word: יְצֻקוֹת
  choice: vilikuwa vimesubiwa
  rationale: Hii ni kauli tendwa ya יצק katika kazi ya metali, yaani kutengenezwa kwa kumimina metali iliyoyeyushwa kwenye kalibu.
- source_word: מֵעֵבֶר אִישׁ
  choice: kila kimoja kikiwa kando ya
  rationale: Nahau hii inaonyesha mpangilio wa kila kimoja kuhusiana na pambo lililokuwa pembeni yake bila kulazimisha maelezo ya kijiometri yasiyo wazi.
- source_word: לֹיוֹת
  choice: mapambo ya taji
  rationale: Neno hili adimu linaelekea kutaja mapambo kama mataji ya maua, vigwe, au vitambaa vya sherehe; “mapambo ya taji” ni wazi huku tanbihi ikihifadhi kutokuwa na uhakika.
