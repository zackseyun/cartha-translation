  text: בֶּן אִשָּׁה֩ אַלְמָנָ֨ה ה֜וּא מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וְ/אָבִ֣י/ו אִישׁ צֹרִי֮ חֹרֵ֣שׁ נְחֹשֶׁת֒ וַ֠/יִּמָּלֵא אֶת הַ/חָכְמָ֤ה וְ/אֶת הַ/תְּבוּנָה֙ וְ/אֶת הַ/דַּ֔עַת לַ/עֲשׂ֥וֹת כָּל מְלָאכָ֖ה בַּ/נְּחֹ֑שֶׁת וַ/יָּבוֹא֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה וַ/יַּ֖עַשׂ אֶת כָּל מְלַאכְתּֽ/וֹ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/014.yaml
  text: He was the son of a widow from the tribe of Naphtali[a], and his father was a man of Tyre, a worker in bronze. He was filled with wisdom, understanding, and knowledge to do every kind of work in bronze[b]. So he came to King Solomon and did all his work.
translation:
  language: sw
  text: Alikuwa mwana wa mwanamke mjane wa kabila la Naftali, na baba yake alikuwa mtu wa Tiro[a], fundi wa bronzi. Alijazwa hekima, ufahamu na maarifa ya kufanya kila aina ya kazi ya bronzi[b]. Basi akaja kwa Mfalme Sulemani na akafanya kazi yake yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtyro.” Neno la Kiebrania humtambulisha mtu kwa asili yake ya Tiro.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania neḥoshet linaweza kumaanisha shaba au bronzi; “bronzi” inafaa muktadha huu wa vyombo vya hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה אַלְמָנָה
  choice: mwana wa mwanamke mjane
  rationale: Huhifadhi msisitizo wa Kiebrania kwamba mama yake alikuwa mjane, huku ikiwa wazi katika Kiswahili cha sasa.
- source_word: מִמַּטֵּה נַפְתָּלִי
  choice: wa kabila la Naftali
  rationale: מַטֶּה hapa humaanisha kabila; muundo huu ni wa kawaida na unaeleweka vizuri kwa Kiswahili.
- source_word: אִישׁ צֹרִי
  choice: mtu wa Tiro
  rationale: צֹרִי ni jina la kumtambulisha mtu kwa asili yake ya Tiro. Tafsiri hii ni ya asili bila kuongeza maana.
- source_word: חֹרֵשׁ נְחֹשֶׁת
  choice: fundi wa bronzi
  rationale: חֹרֵשׁ humaanisha mfanyakazi stadi au fundi, na katika muktadha wa vyombo vya hekalu נְחֹשֶׁת yaelekea kuwa bronzi.
- source_word: וַיִּמָּלֵא
  choice: Alijazwa
  rationale: Huhifadhi hali tendwa ya kitenzi cha Kiebrania, ikionyesha kupewa uwezo badala ya kuupata mwenyewe.
- source_word: הַחָכְמָה וְאֶת הַתְּבוּנָה וְאֶת הַדַּעַת
  choice: hekima, ufahamu na maarifa
  rationale: Huhifadhi utatu wa sifa unaohusu uwezo wa kiakili na ustadi wa kazi.
- source_word: לַעֲשׂוֹת כָּל מְלָאכָה בַּנְּחֹשֶׁת
  choice: kufanya kila aina ya kazi ya bronzi
  rationale: Huwasilisha upana wa כָּל מְלָאכָה na nyenzo iliyotumiwa kwa Kiswahili cha kawaida.
- source_word: וַיָּבוֹא אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: Basi akaja kwa Mfalme Sulemani
  rationale: “Basi” huendeleza simulizi kwa kawaida na “kwa” hudokeza kufika mbele ya mfalme bila kulazimisha maana zaidi.
- source_word: וַיַּעַשׂ אֶת כָּל מְלַאכְתּוֹ
  choice: na kufanya kazi yake yote
  rationale: Hufuata kwa karibu kiambishi cha nafsi katika Kiebrania bila kuongeza kwamba kazi ilikamilishwa au iliagizwa rasmi.
