translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Bronzi” limetumiwa kutofautisha aloi hiyo na shaba tupu. Alama ya tanbihi [a] imewekwa baada ya “Tiro,” mahali ambapo mbadala wake wa kileksika unahusika.
