base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/050.yaml
  text: and the basins[a], the snuffers, the bowls, the cups, and the firepans, of pure gold; and the hinges for the doors of the inner house, for the Most Holy Place, and for the doors of the house, that is, the nave[d][c][b], of gold.
translation:
  language: sw
  text: na mabeseni, mikasi ya kukatia utambi wa taa, mabakuli[a], vikombe, na vyombo vya kubebea makaa, vyote vya dhahabu safi; pia vitako[c] vya milango ya nyumba ya ndani, yaani Patakatifu Zaidi[b], na vya milango ya nyumba, yaani ukumbi mkuu[d], vilikuwa vya dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mabakuli ya kunyunyizia.”
    reason: lexical_alternative
  - marker: b
    text: Tafsiri ya jadi ni “Patakatifu pa Patakatifu.”
    reason: lexical_alternative
  - marker: c
    text: Huenda Kiebrania kinamaanisha vitako au tundu ambamo milango ilizunguka, si bawaba za kisasa zinazofungwa ubavuni.
    reason: cultural_note
  - marker: d
    text: Au, “sehemu kuu ya Hekalu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפּוֹת
  choice: mabeseni
  rationale: Katika orodha ya vyombo vya Hekalu, neno hili linaelekea kutaja chombo kikubwa kama beseni; uteuzi huu pia unalitofautisha na מִזְרָקוֹת.
- source_word: הַמְזַמְּרוֹת
  choice: mikasi ya kukatia tambi za taa
  rationale: Katika mazingira ya ibada, neno hili linataja vifaa vya kupunguzia tambi za taa. Tafsiri hii inaeleweka wazi kuliko istilahi adimu ya kifaa hicho.
- source_word: הַמִּזְרָקוֹת
  choice: mabakuli
  rationale: Neno hili linataja vyombo vya ibada vilivyoweza kutumiwa kushughulikia au kunyunyizia vimiminika; maana mahususi zaidi imewekwa katika tanbihi.
- source_word: הַכַּפּוֹת
  choice: vikombe
  rationale: Neno hili linamaanisha vyombo vidogo vyenye uvungu; “vikombe” ni lugha ya kawaida bila kubainisha umbo kupita ushahidi wa Kiebrania.
- source_word: הַמַּחְתּוֹת
  choice: vyombo vya kubebea makaa
  rationale: Neno hili linataja vyombo vya kubebea moto au makaa katika ibada. Usemi huu ni wazi na haudokezi kwa lazima kwamba vilitumika kufukizia uvumba pekee.
- source_word: זָהָב סָגוּר
  choice: dhahabu safi
  rationale: Muungano huu wa maneno unamaanisha dhahabu bora iliyosafishwa; “dhahabu safi” ni usemi wa kawaida na sahihi katika Kiswahili.
- source_word: הַפֹּתוֹת
  choice: vitako
  rationale: Inaelekea kuwa vifaa vya chini au tundu ambamo milango ya zamani ilizunguka, si bawaba za kisasa zinazofungwa ubavuni. Tanbihi inaeleza jambo hilo.
- source_word: הַבַּיִת הַפְּנִימִי
  choice: nyumba ya ndani
  rationale: Tafsiri hii inadumisha taswira ya Hekalu kama “nyumba,” huku kirai kinachofuata kikitambulisha sehemu hiyo kuwa Patakatifu Zaidi.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: Patakatifu Zaidi
  rationale: Hii inawasilisha kwa Kiswahili cha sasa nguvu ya muundo wa Kiebrania wa kiwango cha juu kabisa bila kuifanya kuwa jina la kimadhehebu.
- source_word: הֵיכָל
  choice: ukumbi mkuu
  rationale: Hapa neno hili linataja ukumbi mkuu wa Hekalu, tofauti na chumba cha ndani. Tafsiri hii ni wazi kwa msomaji wa kawaida.
- source_word: זָהָב
  choice: vilikuwa vya dhahabu
  rationale: Kitenzi kimeongezwa kwa ulaini wa Kiswahili ili kuonyesha kwamba vifaa vya milango vilikuwa vya dhahabu, kama inavyodokezwa na kishazi cha Kiebrania kisicho na kitenzi.
theological_decisions:
- issue: Tafsiri ya קֹדֶשׁ הַקֳּדָשִׁים
  choice: Patakatifu Zaidi
  alternative: Patakatifu pa Patakatifu
  rationale: “Patakatifu Zaidi” huwasilisha maana ya kiwango cha juu kwa Kiswahili cha kawaida; tafsiri ya jadi imehifadhiwa katika tanbihi bila kupoteza maana au uzito wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka. Maelezo mafupi kama “yaani” yanafafanua uhusiano wa sehemu za Hekalu bila kufuta tofauti iliyopo katika Kiebrania. Majina ya kawaida ya vyombo yametumiwa, huku maana za kiibada au za kiufundi zisizo hakika zikihifadhiwa katika tanbihi.
