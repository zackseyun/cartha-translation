base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/042.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on the tops of the pillars.
translation:
  language: sw
  text: na makomamanga mia nne kwa ajili ya miundo miwili ya kimiani[a], safu mbili za makomamanga kwa kila muundo wa kimiani, ili kufunika zile sehemu mbili za umbo la bakuli[b] za vichwa vya nguzo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miundo ya wavu.” Hii ni kazi ya mapambo ya waziwazi, kama wavu au kimiani, kwenye vichwa vya nguzo.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mabakuli mawili ya mataji.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמֹּנִים
  choice: makomamanga
  rationale: Neno hilo humaanisha matunda ya komamanga; hapa ni mapambo yenye umbo la makomamanga, lakini tafsiri inahifadhi jina halisi la kitu kama ilivyo katika Kiebrania.
- source_word: שְׂבָכוֹת
  choice: kazi za kimiani
  rationale: Neno linaeleza mapambo yaliyotengenezwa kama wavu au kimiani. 'Kazi za kimiani' ni Kiswahili cha kawaida kinachoonyesha kuwa ni sehemu za mapambo ya waziwazi.
- source_word: טוּרִים
  choice: safu
  rationale: Neno linamaanisha vitu vilivyopangwa kwa mistari au safu; 'safu' linaeleza kwa wazi mpangilio wa makomamanga.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: kwa kila kazi ya kimiani
  rationale: 'Ingawa kwa neno moja moja ni ''kwa ile kazi moja ya kimiani,'' katika muktadha huu matumizi yake ni ya kugawanya: safu mbili zilikuwa kwenye kila moja ya kazi hizo mbili.'
- source_word: לְכַסּוֹת
  choice: ili kufunika
  rationale: Kitenzi-jina kinaonyesha kusudi la safu za makomamanga; 'ili kufunika' huhifadhi maana hiyo moja kwa moja.
- source_word: גֻּלֹּת
  choice: mabakuli
  rationale: Neno linaashiria maumbo ya mviringo kama bakuli. Tafsiri ya moja kwa moja 'mabakuli' huhifadhi taswira na uhusiano wake na mataji.
- source_word: כֹּתָרֹת
  choice: mataji
  rationale: Katika muktadha wa usanifu, haya ni mataji ya nguzo, yaani sehemu za mapambo zilizo juu ya nguzo. 'Mataji' ni neno linaloeleweka na linalohifadhi picha ya Kiebrania.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: juu ya nguzo
  rationale: Katika maelezo haya ya usanifu, kirai kinaonyesha mahali mataji yalipowekwa. 'Juu ya nguzo' ni sahihi na hakiongezi kwa lazima dhana ya 'kilele' isiyosemwa wazi.
