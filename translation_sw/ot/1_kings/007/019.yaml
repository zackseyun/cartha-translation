  text: And the capitals that were on the tops of the pillars were made like a lily blossom in the portico[c][b][a], four cubits.
translation:
  language: sw
  text: Na mataji yaliyokuwa juu ya nguzo yalikuwa na umbo la ua la yungiyungi[b] katika ukumbi wa kuingilia[a], dhiraa nne.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika ukumbi wa mbele.” Neno la Kiebrania אוּלָם linamaanisha ukumbi au sehemu ya kuingilia ya jengo la hekalu.
    reason: lexical_alternative
  - marker: b
    text: Au “yalikuwa na umbo la yungiyungi.” Baadhi ya watafsiri huelewa שׁוּשַׁן hapa kuwa pambo la maua lenye umbo la lotus.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “dhiraa nne.” Huenda kipimo hiki kinaeleza kimo cha sehemu ya mataji yenye umbo la yungiyungi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּתָרֹת
  choice: mataji
  rationale: Katika usanifu, neno hili hutaja sehemu za mapambo zilizo juu ya nguzo. “Mataji” ni neno la kawaida na linaloeleweka katika Kiswahili cha Biblia, bila kutumia istilahi ngumu ya kitaalamu.
- source_word: רֹאשׁ הָעַמּוּדִים
  choice: juu ya nguzo
  rationale: Ingawa רֹאשׁ kihalisi ni “kichwa,” katika maelezo ya jengo Kiswahili cha asili husema “juu ya nguzo.”
- source_word: מַעֲשֵׂה שׁוּשַׁן
  choice: yalikuwa na umbo la ua la yungiyungi
  rationale: Kirai hicho kisicho na kitenzi kinaeleza muundo au kazi ya maua. Tafsiri hii hutoa maana ya umbo kwa Kiswahili cha kawaida, huku ikihifadhi yungiyungi badala ya kuchagua kwa uhakika lotus.
- source_word: בָּאוּלָם
  choice: katika ukumbi wa kuingilia
  rationale: אוּלָם ni ukumbi wa mbele au sehemu ya kuingilia ya hekalu. “Ukumbi wa kuingilia” ni wazi na wa sasa kuliko istilahi za kigeni za usanifu.
- source_word: אַרְבַּע אַמּוֹת
  choice: dhiraa nne
  rationale: Kiebrania kinatoa kipimo bila kutaja wazi urefu, upana, au kimo. Tafsiri inadumisha kutobainishwa huko, na tanbihi inaeleza uwezekano wa kurejelea kimo.
