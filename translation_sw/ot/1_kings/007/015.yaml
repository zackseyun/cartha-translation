  source_fidelity: 'Maandishi makuu yanafuata Maandishi ya Kimasoreti kwa uaminifu: nguzo mbili ni za shaba, urefu wa nguzo moja ni dhiraa kumi na nane, na kamba ya dhiraa kumi na mbili inazunguka nguzo ya pili. Hata hivyo, tanbihi ya rasimu huongeza uwezekano kwamba kipimo kilihusu nguzo zote mbili, jambo lisilosemwa na maandishi ya Kiebrania.'
