  yaml_path: translation/ot/1_kings/007/015.yaml
  text: He cast the two bronze pillars; the height of the one pillar was eighteen cubits[a], and a line of twelve cubits measured around it.
translation:
  language: sw
  text: Akazimimina nguzo mbili za shaba. Urefu wa nguzo moja ulikuwa dhiraa kumi na nane, na kamba yenye urefu wa dhiraa kumi na mbili iliizunguka nguzo ya pili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּצַר
  choice: Akazimimina
  rationale: Katika muktadha wa kutengeneza vifaa vya hekalu kwa shaba, kitenzi kinaeleweka kuwa kutengeneza kwa kumimina metali iliyoyeyushwa. ‘Akazimimina’ ni kifupi na cha kawaida katika Kiswahili.
- source_word: שְׁנֵי הָעַמּוּדִים
  choice: nguzo mbili
  rationale: ‘Nguzo’ ni neno la kawaida na linalofaa kwa miundo hii mikubwa ya hekalu.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: ‘Shaba’ ndilo neno la kawaida la kibiblia na la Kiswahili kwa metali hii; katika muktadha huu huenda ni aloi ya bronzi.
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה
  choice: dhiraa kumi na nane
  rationale: Kipimo cha kale kimehifadhiwa badala ya kugeuzwa kuwa kipimo cha kisasa.
- source_word: קוֹמַת הָעַמּוּד הָאֶחָד
  choice: Urefu wa nguzo moja
  rationale: Huhifadhi muundo na maana ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: וְחוּט
  choice: na kamba
  rationale: חוּט humaanisha uzi, kamba, au kamba ya kupimia; ‘kamba’ ni ya kawaida na inafaa katika muktadha wa kupima mzingo.
- source_word: שְׁתֵּים עֶשְׂרֵה אַמָּה
  choice: yenye urefu wa dhiraa kumi na mbili
  rationale: Ufafanuzi mdogo wa ‘yenye urefu wa’ hufanya uhusiano wa kipimo na kamba uwe wazi bila kubadili maana.
- source_word: יָסֹב
  choice: iliizunguka
  rationale: Huhifadhi taswira halisi ya kamba kuzunguka nguzo, huku muktadha ukionyesha kuwa ilikuwa ikipima mzingo.
- source_word: הָעַמּוּד הַשֵּׁנִי
  choice: nguzo ya pili
  rationale: Hili ndilo tamko la moja kwa moja la maandishi ya Kimasoreti, hata ingawa wasomaji wengine hulielewa kuwa linarejelea nguzo iliyotajwa kwanza au kipimo cha nguzo zote mbili.
