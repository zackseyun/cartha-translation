  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo usio wa kawaida wa Kiebrania—urefu wa nguzo moja na mzingo wa nguzo ya pili—umehifadhiwa katika maandishi makuu badala ya kusawazishwa kimya kimya.
