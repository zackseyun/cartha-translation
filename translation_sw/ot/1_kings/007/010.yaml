  text: And the foundation was of costly stones[a], large stones, stones of ten cubits and stones of eight cubits.
translation:
  language: sw
  text: Na msingi ulikuwa wa mawe ya gharama kubwa[a], mawe makubwa, mawe ya dhiraa kumi na mawe ya dhiraa nane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mawe ya thamani.” Kiebrania kinakazia thamani au ubora mkubwa wa mawe hayo; katika muktadha huu wa ujenzi, “mawe ya gharama kubwa” husaidia kuepuka wazo kwamba yalikuwa vito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְיֻסָּד
  choice: Nao msingi ulikuwa wa
  rationale: Kirai hiki kinaonyesha msingi uliowekwa au kujengwa kwa vifaa vinavyotajwa. Tafsiri hii inafanya nomino iliyodokezwa iwe wazi kwa Kiswahili bila kuongeza maelezo ya usanifu yasiyokuwamo katika Kiebrania.
- source_word: אֲבָנִים יְקָרוֹת
  choice: mawe ya gharama kubwa
  rationale: Neno יְקָרוֹת linasisitiza thamani au gharama kubwa. Katika muktadha wa ujenzi, usemi huu huepuka kuwafanya wasomaji wafikiri hasa kuhusu vito.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: mawe makubwa
  rationale: Hapa גְּדֹלוֹת linaeleza ukubwa wa mawe; 'mawe makubwa' ni Kiswahili cha kawaida na sahihi.
- source_word: אַבְנֵי עֶשֶׂר אַמּוֹת
  choice: mawe ya dhiraa kumi
  rationale: Muundo huu unaonyesha kipimo cha mawe, lakini hautaji upande uliopimwa. Tafsiri haiongezi urefu, upana, wala kimo.
- source_word: וְאַבְנֵי שְׁמֹנֶה אַמּוֹת
  choice: na mawe ya dhiraa nane
  rationale: Muundo sambamba na kirai kilichotangulia umehifadhiwa kwa uwazi na ulinganifu.
- source_word: אַמּוֹת
  choice: dhiraa
  rationale: Hili ni neno la kawaida la Kiswahili kwa kipimo cha kale cha אַמָּה, na linahifadhi kipimo cha matini chanzi bila kukibadili kuwa kipimo cha kisasa.
