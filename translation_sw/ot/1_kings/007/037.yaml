  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imefanywa ya kawaida kwa msomaji huku mfuatano wa mambo matatu—namna ya utengenezaji, vipimo, na umbo—ukihifadhiwa. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya usemi unaohusika.
