  language: sw
  text: 'Hivyo akatengeneza vile vikalio kumi: vyote vilikuwa vya kazi moja ya kutupwa[a], vipimo sawa, na umbo moja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vyote vilikuwa kazi moja ya kutupwa, ukubwa mmoja, na muundo mmoja.” Kiebrania kinatumia semi tatu fupi zinazofuatana ili kusisitiza kwamba vikalio vyote kumi vilitengenezwa kwa vipimo na muundo uleule.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּזֹאת
  choice: Hivyo
  rationale: Hurejelea muundo na ufundi ulioelezwa kabla, huku ikitoa muhtasari wa jinsi vikalio vilivyotengenezwa.
- source_word: עָשָׂה
  choice: akatengeneza
  rationale: Ni neno la kawaida na la asili kwa tendo la fundi kutengeneza vifaa hivi.
- source_word: עֶשֶׂר הַמְּכֹנוֹת
  choice: vile vikalio kumi
  rationale: Katika muktadha huu מְכֹנוֹת ni miundo yenye magurudumu iliyobeba mabeseni. ‘Vikalio’ huonyesha kazi yake bila kuifanya tu kuwa mikokoteni.
- source_word: מוּצָק אֶחָד
  choice: vyote vilikuwa vya kazi moja ya kumimina
  rationale: מוּצָק ni kazi ya chuma kilichomiminwa kwenye kalibu. Usemi huu unaonyesha kwamba vikalio vyote vilitengenezwa kwa namna ileile, huku ukidumisha maana ya kiufundi.
- source_word: מִדָּה אַחַת
  choice: vipimo sawa
  rationale: Ingawa Kiebrania kinasema kihalisi ‘kipimo kimoja,’ Kiswahili cha kawaida huwasilisha maana ya kuwa na ukubwa na vipimo vinavyofanana kwa ‘vipimo sawa.’
- source_word: קֶצֶב אֶחָד
  choice: umbo moja
  rationale: קֶצֶב hapa huelekea kumaanisha umbo, muundo, au uwiano. ‘Umbo moja’ huhifadhi ufupi wa Kiebrania bila kuamua kwa nguvu kuwa ni mchoro tu.
- source_word: לְכֻלָּהְנָה
  choice: vyote
  rationale: Hurejelea vikalio vyote kumi na kusisitiza kuwa maelezo hayo yaliwahusu kila kimoja.
