base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/025.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east; and the Sea was on them above[b], and all their rear parts were inward.'
translation:
  language: sw
  text: 'Ilikuwa imesimama juu ya ng’ombe kumi na wawili: watatu wakielekea kaskazini, watatu wakielekea magharibi[a], watatu wakielekea kusini, na watatu wakielekea mashariki. Bahari ilikuwa juu yao, na sehemu zao zote za nyuma zilielekea ndani[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, neno lililotafsiriwa “magharibi” kihalisi ni “kuelekea baharini,” njia ya kawaida katika Biblia ya kutaja upande wa magharibi.
    reason: lexical_alternative
  - marker: b
    text: Au, “na nyuma zao zote zilielekea upande wa ndani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמֵד
  choice: ilikuwa imesimama
  rationale: Kitenzi kishirikishi cha Kiebrania kinaeleza hali ya Bahari katika masimulizi; kauli hii ni ya kawaida na inaonyesha kwamba ilisimama juu ya maumbo ya ng’ombe.
- source_word: בָּקָר
  choice: ng’ombe
  rationale: Neno la Kiebrania linaweza kumaanisha ng’ombe kwa ujumla bila kutaja jinsia kwa lazima; hivyo ‘ng’ombe’ huepuka kuamua bila msingi kwamba walikuwa mafahali.
- source_word: פֹנִים
  choice: wakielekea
  rationale: Ingawa maana halisi inahusiana na nyuso, katika orodha hii neno linaonyesha upande ambao maumbo ya ng’ombe yalielekezwa.
- source_word: יָמָּה
  choice: magharibi
  rationale: Maana halisi ni ‘kuelekea baharini,’ lakini katika matumizi ya kawaida ya Kiebrania cha Biblia hapa linataja upande wa magharibi kati ya pande nne kuu.
- source_word: הַיָּם
  choice: Bahari
  rationale: Hili ni jina la birika kubwa la shaba lililoelezwa katika muktadha; herufi kubwa inalibainisha kama chombo maalumu cha hekalu huku ikihifadhi taswira ya neno la Kiebrania.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: ilikuwa juu yao
  rationale: Tafsiri hii inafuata kwa karibu usemi wa Kiebrania na inaonyesha kuwa Bahari ilikuwa juu ya wale ng’ombe bila kuongeza kitenzi kama ‘iliwekwa.’
- source_word: אֲחֹרֵיהֶם
  choice: sehemu zao zote za nyuma
  rationale: Usemi huu unawakilisha sehemu za nyuma za maumbo ya wanyama kwa lugha iliyo wazi na yenye heshima bila kuwa mahususi kupita kiasi.
- source_word: בָּיְתָה
  choice: zilielekea ndani
  rationale: Umbo hili la kuelekeza lina maana ya kuelekea upande wa ndani, yaani katikati chini ya Bahari.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka. Marudio ya ‘wakielekea’ yamehifadhiwa ili kuonyesha mpangilio wa pande nne kwa uwazi, na ‘Bahari’ limetumiwa kama jina la chombo maalumu cha hekalu.
