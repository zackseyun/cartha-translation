base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/026.yaml
  text: Its thickness was a handbreadth[a], and its rim was made like the rim of a cup, like a lily blossom[b]. It could hold two thousand baths.
translation:
  language: sw
  text: Unene wake ulikuwa upana wa kiganja, na ukingo wake ulitengenezwa kama ukingo wa kikombe, kama ua la yungiyungi[b]. Liliweza kuchukua bathi elfu mbili[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sehemu inayolingana katika 2 Mambo ya Nyakati 4:5 inasema birika hilo lilichukua bathi elfu tatu. Huenda tofauti hii ikatokana na matini, kunakiliwa kwake, au namna tofauti ya kuelewa uwezo wote wa birika na kiasi ambacho kwa kawaida kilitiwa ndani yake.
    reason: cross_reference
  - marker: b
    text: Au, “mdomo wake ... kama mdomo wa kikombe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְיוֹ
  choice: unene wake
  rationale: Nomino hii inaonyesha unene wa ukuta wa birika; kiambishi cha nafsi ya tatu ya kiume kinarejelea chombo hicho.
- source_word: טֶפַח
  choice: upana wa kiganja
  rationale: Tefa ni kipimo cha kale kinacholingana na upana wa kiganja; tafsiri hii ni wazi kwa msomaji wa Kiswahili na haitanui kipimo kuwa shubiri.
- source_word: שְׂפָתוֹ
  choice: ukingo wake
  rationale: Katika muktadha wa birika kubwa, 'ukingo' hueleza sehemu ya juu ya chombo kwa Kiswahili cha kawaida; maana mbadala ya picha ni 'mdomo wake'.
- source_word: כְּמַעֲשֵׂה
  choice: ulitengenezwa kama
  rationale: Kirai hiki kinalinganisha umbo au ufundi wa ukingo; kauli hii ni ya asili kwa Kiswahili bila kupoteza wazo la kutengenezwa.
- source_word: שְׂפַת כּוֹס
  choice: ukingo wa kikombe
  rationale: Ulinganisho huo unaeleza umbo la sehemu ya juu ya birika kwa kulinganisha na ukingo wa kikombe, huku ukidumisha uchaguzi wa 'ukingo'.
- source_word: פֶּרַח שׁוֹשָׁן
  choice: ua la yungiyungi
  rationale: Maneno haya yanaonyesha umbo la ua la yungiyungi, labda ukingo uliopanuka kama ua lililochanua; Kiswahili hiki ni wazi na chenye hadhi.
- source_word: אַלְפַּיִם בַּת
  choice: bathi elfu mbili
  rationale: Bathi ni kipimo cha kale cha ujazo wa vitu vya majimaji; kutohamisha kuwa kipimo cha kisasa huhifadhi kipimo cha matini chanzi.
- source_word: יָכִיל
  choice: Liliweza kuchukua
  rationale: Hifili ya כול hapa inaonyesha uwezo wa chombo kubeba ujazo fulani, si lazima kiasi kilichokuwamo wakati huo.
theological_decisions:
- issue: Tofauti ya ujazo ikilinganishwa na 2 Mambo ya Nyakati 4:5
  choice: Matini kuu inadumisha 'bathi elfu mbili' kama ilivyo katika WLC ya 1 Wafalme 7:26.
  alternative: 2 Mambo ya Nyakati 4:5 inasema bathi elfu tatu.
  rationale: Tofauti hii ya matini au uwasilishaji haipaswi kusawazishwa kimya kimya; tanbihi inaitaja bila kulazimisha suluhisho moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Birika' linaeleweka kutoka muktadha wa kifungu, kwa hiyo kiwakilishi 'liliweza' kinadumisha jinsia ya nomino hiyo. Kipimo cha kale 'bathi' kimehifadhiwa kwa unukuzi, na 'upana wa kiganja' umetumiwa badala ya 'shubiri' ili kutotaja kipimo kikubwa tofauti.
