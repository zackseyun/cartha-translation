translation:
  language: sw
  text: Kulikuwa na safu tatu za fremu za madirisha[a]; kila dirisha lilikuwa likikabiliana na dirisha jingine mara tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “madirisha yalikuwa yakikabiliana katika viwango vitatu.” Kwa karibu, Kiebrania kina, “dirisha kuelekea dirisha mara tatu”; huenda kikieleza mpangilio uliorudiwa katika viwango vitatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁקֻפִים
  choice: fremu za madirisha
  rationale: Katika muktadha huu wa usanifu, neno hili linaelekea kumaanisha nafasi za madirisha zenye fremu, si dhana ya madirisha kwa ujumla; “fremu za madirisha” ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: שְׁלֹשָׁה טוּרִים
  choice: safu tatu
  rationale: טוּר hueleza vitu vilivyopangwa kwa mfuatano; “safu tatu” ni usemi wa kawaida na unahifadhi uwezekano wa safu za mlalo au viwango kulingana na mpangilio wa jengo.
- source_word: מֶחֱזָה
  choice: dirisha
  rationale: Neno hili linaweza kumaanisha nafasi ya kutazamia au kupitishia mwanga; katika muktadha wa jengo na sambamba na שְׁקֻפִים, “dirisha” ndilo neno la Kiswahili linaloeleweka zaidi.
- source_word: אֶל מֶחֱזָה
  choice: likikabiliana na dirisha
  rationale: אֶל hapa huonyesha mwelekeo au ulinganifu wa madirisha. “Likikabiliana na” huwasilisha kwa kawaida kwamba dirisha moja lilikuwa limeelekezwa upande wa jingine.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: mara tatu
  rationale: Hii ndiyo maana ya moja kwa moja ya maneno ya Kiebrania. Maana inayowezekana ya mpangilio katika viwango vitatu imewekwa katika tanbihi badala ya kuamuliwa kimya katika matini.
