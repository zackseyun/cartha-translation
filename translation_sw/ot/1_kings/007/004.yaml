translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo mfupi wa maelezo ya usanifu umehifadhiwa; tanbihi inaonyesha utata halisi wa Kiebrania kuhusu “mara tatu” na “viwango vitatu.”
