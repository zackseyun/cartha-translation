  text: וְ/אֵ֨ת אוּלָ֤ם הָֽ/עַמּוּדִים֙ עָשָׂ֔ה חֲמִשִּׁ֤ים אַמָּה֙ אָרְכּ֔/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה רָחְבּ֑/וֹ וְ/אוּלָם֙ עַל פְּנֵי/הֶ֔ם וְ/עַמֻּדִ֥ים וְ/עָ֖ב עַל פְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/006.yaml
  text: He made the Hall of Pillars fifty cubits long and thirty cubits wide[a], with a porch in front of them[b], and pillars and a threshold in front of them.
translation:
  language: sw
  text: Aliujenga Ukumbi wa Nguzo[a], wenye urefu wa dhiraa hamsini na upana wa dhiraa thelathini. Mbele ya nguzo hizo kulikuwa na ukumbi wa kuingilia, pamoja na nguzo na boriti nene[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno lilelile la Kiebrania, אוּלָם, limetumika kwa “Ukumbi” hapa na kwa “ukumbi wa kuingilia” baadaye katika mstari huu. Katika matumizi ya pili huenda linamaanisha sehemu ya mbele iliyounganishwa na Ukumbi wa Nguzo.
    reason: lexical_alternative
  - marker: b
    text: Maana ya neno la Kiebrania עָב katika muktadha huu wa usanifu haijulikani kwa hakika. Linaweza pia kumaanisha kizingiti, kazi ya boriti, au sehemu nyingine ya jengo iliyofunika eneo la mbele.
    reason: textual_uncertainty
lexical_decisions:
- source_word: אוּלָם הָעַמּוּדִים
  choice: Ukumbi wa Nguzo
  rationale: Muundo huu ni mkubwa na unaainishwa na nguzo zake; “ukumbi” ni Kiswahili cha kawaida na cha heshima kinachofaa zaidi kuliko neno linalodokeza baraza dogo.
- source_word: עָשָׂה
  choice: aliujenga
  rationale: Ingawa maana ya msingi ni ‘alifanya,’ katika muktadha wa jengo ‘aliujenga’ huwasilisha tendo linalokusudiwa kwa Kiswahili cha kawaida.
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ וּשְׁלֹשִׁים אַמָּה רָחְבּוֹ
  choice: wenye urefu wa dhiraa hamsini na upana wa dhiraa thelathini
  rationale: Huhifadhi vipimo kamili na kugeuza nahau ya vipimo ya Kiebrania kuwa Kiswahili fasaha.
- source_word: וְאוּלָם עַל־פְּנֵיהֶם
  choice: Mbele ya nguzo hizo kulikuwa na ukumbi wa kuingilia
  rationale: Neno אוּלָם limerudiwa, lakini hapa linaonekana kumaanisha sehemu ya mbele ya kuingilia; tafsiri hii huhifadhi uhusiano wake na nguzo bila kuifanya iwe sawa kabisa na ukumbi mkubwa uliotajwa kwanza.
- source_word: וְעַמֻּדִים
  choice: pamoja na nguzo
  rationale: Nguzo za ziada zinazotajwa katika sentensi fupi ya Kiebrania zimehifadhiwa wazi.
- source_word: וְעָב
  choice: na boriti nene
  rationale: Neno hili la usanifu halina maana iliyo hakika hapa. “Boriti nene” hufuata kwa kiasi kikubwa wazo la kitu kizito au kinene cha kimuundo, huku tanbihi ikihifadhi uwezekano mwingine.
theological_decisions: []
