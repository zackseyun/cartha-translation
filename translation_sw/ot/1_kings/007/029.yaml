base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/029.yaml
  text: And on the panels that were between the frames were lions[a], oxen, and cherubim; and on the frames likewise above, and beneath the lions and the oxen were wreaths[b], a work of hanging relief.
translation:
  language: sw
  text: Juu ya paneli zilizokuwa kati ya fremu kulikuwa na simba, ng’ombe, na makerubi. Juu ya fremu, vivyo hivyo, kulikuwa na mapambo upande wa juu; na chini ya simba na ng’ombe kulikuwa na mashada ya mapambo[a], kazi ya mapambo iliyoshuka au kuning’inia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taji za mapambo”; neno la Kiebrania ni adimu, na umbo kamili la mapambo haya halijulikani kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: Kirai cha Kiebrania kilichotafsiriwa “kazi ya mapambo iliyoshuka au kuning’inia” ni kigumu; huenda kinamaanisha kazi ya mapambo ya kunyonga au kushuka chini ya simba na ng’ombe.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּסְגְּרוֹת
  choice: paneli
  rationale: Katika maelezo haya ya kimuundo, neno hili linaelekea kumaanisha sehemu bapa za mapambo zilizowekwa ndani ya fremu; “paneli” hulitofautisha kwa uwazi na שְׁלַבִּים.
- source_word: שְׁלַבִּים
  choice: fremu
  rationale: Neno hili linaonyesha sehemu za muundo zilizozunguka au kutenganisha paneli. “Fremu” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: אֲרָיוֹת
  choice: simba
  rationale: Ni tafsiri ya moja kwa moja ya wanyama waliochorwa kama mapambo.
- source_word: בָּקָר
  choice: ng’ombe
  rationale: Neno la Kiebrania ni la jumla kwa wanyama wa jamii ya ng’ombe, hivyo “ng’ombe” huepuka kulibana kuwa “mafahali” pekee.
- source_word: כְרוּבִים
  choice: makerubi
  rationale: “Makerubi” ni istilahi ya kibiblia iliyozoeleka kwa viumbe hawa wa mbinguni na haileti dhana ya watoto wadogo yenye kuweza kuambatana na matumizi mengine ya neno hilo.
- source_word: כֵּן
  choice: pia ... kama hayo
  rationale: Hapa limetafsiriwa kama kielezi cha ulinganifu, likionyesha kwamba fremu nazo zilikuwa na mapambo yanayolingana na yale ya paneli.
- source_word: מִמָּעַל
  choice: upande wa juu
  rationale: Hutoa maana ya mahali pa mapambo kwa Kiswahili cha kawaida na huandaa utofautishaji na “chini” unaofuata.
- source_word: מִתַּחַת
  choice: chini
  rationale: Ni neno la kawaida la mahali na linatofautiana wazi na “upande wa juu.”
- source_word: לֹיוֹת
  choice: mashada ya mapambo
  rationale: Nomino hii adimu inaelekea kutaja mapambo yaliyofanana na mashada au taji za majani. “Mashada ya mapambo” ni ya asili katika Kiswahili huku tanbihi ikihifadhi kutokuwa na uhakika.
- source_word: מַעֲשֵׂה מוֹרָד
  choice: yaliyotengenezwa kwa umbo la kuning’inia
  rationale: Kirai hiki kigumu huenda kinaeleza mapambo yaliyoshuka au kuning’inia. Tafsiri hii inaonyesha mwelekeo wa umbo bila kudai kwa uhakika mbinu mahususi ya uchongaji.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya masimulizi ya Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Paneli” na “fremu” zimetumiwa kwa uthabiti kutofautisha sehemu za mapambo na sehemu za muundo. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno au virai vinavyohusika.
