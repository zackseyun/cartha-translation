base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/012.yaml
  text: And the great court all around had three rows of cut stone and a row of cedar beams[c][b][a], like the inner court of the house of Yahweh and the vestibule of the house.
translation:
  language: sw
  text: Nao ua mkubwa kuzunguka pande zote ulikuwa na safu tatu za mawe yaliyochongwa na safu moja ya mihimili ya mierezi, kama ua wa ndani wa nyumba ya Yahweh na ukumbi wa kuingilia wa nyumba hiyo.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kwa ua wa ndani wa nyumba ya Yahweh na kwa ukumbi wa kuingilia wa nyumba hiyo.” Kihusishi cha Kiebrania kinaweza kuonyesha ulinganisho au uhusiano; hapa kimetafsiriwa kuwa “kama.”
    reason: alternative_reading
  - marker: b
    text: Au, “tabaka tatu za mawe yaliyochongwa na tabaka moja la mihimili ya mierezi.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, ukumbi wa mbele uliokuwa sehemu ya kuingilia katika jengo la hekalu.
    reason: cultural_note
lexical_decisions:
- source_word: חָצֵר הַגְּדוֹלָה
  choice: ua mkubwa
  rationale: 'חָצֵר ni eneo la wazi lililozungushiwa ukuta. Katika muktadha wa jengo la kifalme au hekalu, “ua” ni Kiswahili cha kawaida na kinachoeleweka; kivumishi kinafuata ngeli ya “ua”: “mkubwa.”'
- source_word: סָבִיב
  choice: kuzunguka pande zote
  rationale: Kirai hiki kinatoa maana ya eneo au ujenzi ulioenea kuzunguka ua, na ni cha asili katika Kiswahili cha sasa.
- source_word: שְׁלֹשָׁה טוּרִים גָּזִית
  choice: safu tatu za mawe yaliyochongwa
  rationale: Katika ujenzi, טוּרִים ni safu au tabaka za mawe, na גָּזִית ni mawe yaliyofanyiwa kazi kwa kuchongwa. “Safu” ni wazi zaidi kwa msomaji wa kawaida kuliko istilahi ya kiufundi “tabaka za uashi.”
- source_word: וְטוּר כְּרֻתֹת אֲרָזִים
  choice: na safu moja ya mihimili ya mierezi
  rationale: Kirai kinaenda sambamba na safu za mawe. כְּרֻתֹת ni vipande vilivyokatwa; katika muktadha huu wa ujenzi, “mihimili” inaeleza kazi yake kwa lugha ya kawaida bila kudai umbo lisiloelezwa.
- source_word: וְלַחֲצַר בֵּית יְהוָה הַפְּנִימִית
  choice: kama ua wa ndani wa nyumba ya Yahweh
  rationale: ל־ inaweza kueleza uhusiano au ulinganisho. Muktadha wa maelezo ya ujenzi unaunga mkono “kama,” huku usomaji wa moja kwa moja zaidi ukihifadhiwa katika tanbihi.
- source_word: אֻלָם הַבָּיִת
  choice: ukumbi wa kuingilia wa nyumba hiyo
  rationale: אֻלָם ni ukumbi au baraza la mbele linalotumika kama sehemu ya kuingilia. Kirai hiki ni cha kawaida na pia kinafafanua kazi ya sehemu hiyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa herufi nne za Kiebrania limehamishwa kwa sauti kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina lenyewe, si cheo אֲדֹנָי. “Yahweh” huhifadhi tofauti hiyo na kuwasilisha jina la agano moja kwa moja.
- issue: Maana ya ל־ katika וְלַחֲצַר ... וּלְאֻלָם
  choice: 'ulinganisho: “kama”'
  alternative: 'uhusiano wa moja kwa moja: “na kwa ajili ya” au “na kwa”'
  rationale: Muundo ni mfupi na unaweza kueleweka kwa njia zaidi ya moja. Ulinganisho unaunganisha kwa asili namna ya ujenzi wa ua mkubwa na ua wa ndani pamoja na ukumbi, lakini maana ya kihusiano haijaondolewa na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima lakini wa kawaida. Istilahi rahisi za ujenzi zimetumiwa, huku mbadala wa kiufundi na sintaksia yenye utata ya Kiebrania vikihifadhiwa katika tanbihi.
