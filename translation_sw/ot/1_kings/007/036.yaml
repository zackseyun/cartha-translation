base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/036.yaml
  text: On the panels of its supports and on its frames he engraved cherubim[a], lions, and palm trees, according to the space on each[b], with wreaths all around.
translation:
  language: sw
  text: Akachora kwenye mabamba ya mategemezo yake na kwenye fremu zake makerubi, simba, na mitende, kila kimoja kulingana na nafasi iliyopatikana,[a] pamoja na mashada yaliyozunguka pande zote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila kimoja kulingana na nafasi yake.” Kirai cha Kiebrania ni kigumu na huenda kinaeleza mpangilio wa michoro kulingana na nafasi iliyopatikana.
    reason: lexical_alternative
  - marker: b
    text: Au, “mapambo ya taji yaliyozunguka pande zote.” Neno la Kiebrania huenda linamaanisha mishada, mapambo ya kuning’inia, au mapambo ya mviringo yaliyozunguka vielelezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתַּח
  choice: Akachora
  rationale: Katika muktadha wa mapambo ya kifaa, kitenzi kinaeleza kuchora kwa kuchanja au kunakshi kwenye uso; “akachora” ni ya kawaida na inaeleweka, bila kudai kwa uhakika nyenzo au mbinu.
- source_word: הַלֻּחֹת יְדֹתֶיהָ
  choice: mabamba ya tegemezo zake
  rationale: “Mabamba” yanafaa kwa nyuso tambarare za muundo, na “tegemezo” huwasilisha maana ya kiutendaji ya neno linalomaanisha kihalisi “mikono yake.”
- source_word: מַסְגְּרֹתֶיהָ
  choice: fremu zake
  rationale: Neno hilo linataja mipaka ya kimuundo inayozingira mabamba; “fremu” ni istilahi ya sasa na iliyo wazi katika usanifu.
- source_word: כְּרוּבִים
  choice: makerubi
  rationale: Huhifadhi jina la kawaida la viumbe hawa wa mfano katika mazingira ya hekalu bila kuwaleta karibu na dhana za kisasa za watoto wenye mabawa.
- source_word: אֲרָיוֹת
  choice: simba
  rationale: Ni tafsiri ya moja kwa moja ya wanyama walioonyeshwa katika mapambo.
- source_word: תִמֹרֹת
  choice: mitende
  rationale: Katika mapambo ya hekalu, neno linamaanisha vielelezo vya miti ya mitende.
- source_word: כְּמַעַר אִישׁ
  choice: kila kielelezo kulingana na nafasi iliyopatikana
  rationale: Kirai cha Kiebrania ni kigumu; tafsiri hii huhifadhi wazo linalowezekana la kupanga kila umbo kulingana na nafasi iliyokuwapo.
- source_word: לֹיֹת סָבִיב
  choice: mapambo ya taji yaliyozunguka pande zote
  rationale: Neno adimu huenda linataja mapambo yanayofanana na taji au mashada yaliyozunguka vielelezo; tafsiri kuu inaweka picha ya mapambo ya mviringo na tanbihi huhifadhi uwezekano mwingine.
