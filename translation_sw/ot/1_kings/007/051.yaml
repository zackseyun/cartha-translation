  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣ד אָבִ֗י/ו אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/051.yaml
  text: So all the work that King Solomon did for the house of Yahweh was finished. And Solomon brought in the holy things of David his father—the silver[a], the gold, and the vessels—and put them in the treasuries of the house of Yahweh.
translation:
  language: sw
  text: Basi kazi yote ambayo Mfalme Sulemani alifanya kwa ajili ya nyumba ya Yahwe ikakamilika. Kisha Sulemani akaingiza vitu vitakatifu[a] vya Daudi baba yake—fedha, dhahabu na vyombo—akaviweka katika hazina za nyumba ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitu vilivyowekwa wakfu vya Daudi baba yake.” Kiebrania kinamaanisha vitu vilivyotengwa kuwa vitakatifu kwa ajili ya Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: ikakamilika
  rationale: Kitenzi שלם hapa kinaonyesha kwamba kazi ilifikia ukamilifu. “Ikakamilika” ni Kiswahili cha kawaida na hudumisha hali ya matokeo ya kitenzi cha Kiebrania.
- source_word: כָּל הַמְּלָאכָה
  choice: kazi yote
  rationale: מְלָאכָה hapa ni jumla ya kazi ya ujenzi na uandaaji wa nyumba ya Yahwe; “kazi yote” ni pana, wazi na ya asili.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi taswira ya Kiebrania בֵּית, na “Yahwe” huwakilisha moja kwa moja jina la agano יהוה.
- source_word: וַיָּבֵא
  choice: akaingiza
  rationale: Hifili ya בוא ina maana ya kuleta au kuingiza. Kwa kuwa vitu vilipelekwa ndani na kuwekwa hazinani, “akaingiza” huhifadhi mwelekeo huo.
- source_word: קָדְשֵׁי דָּוִד אָבִיו
  choice: vitu vitakatifu vya Daudi baba yake
  rationale: קָדְשֵׁי ni vitu vilivyotengwa kuwa vitakatifu. Tafsiri hii ni ya moja kwa moja, huku tanbihi ikihifadhi uwezekano wa kusema “vitu vilivyowekwa wakfu.”
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב וְאֶת הַכֵּלִים
  choice: fedha, dhahabu na vyombo
  rationale: Orodha hii inataja mali na vifaa vilivyowekwa wakfu. “Vyombo” ni neno pana linalofaa kwa כֵּלִים katika muktadha wa nyumba ya ibada bila kubainisha matumizi yasiyotajwa.
- source_word: נָתַן בְּאֹצְרוֹת
  choice: akaviweka katika hazina
  rationale: נתן hapa ni kuweka, na אֹצְרוֹת ni sehemu au vyumba vya kuhifadhi mali. “Akaviweka katika hazina” ni fasaha na sahihi kimuktadha.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina binafsi la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya קָדְשֵׁי
  choice: vitu vitakatifu
  alternative: vitu vilivyowekwa wakfu
  rationale: Neno linaweza kusisitiza ama hali ya kuwa vitakatifu ama tendo la kutengwa kwa ajili ya Mungu. Maandishi makuu yanahifadhi uhusiano wake na utakatifu, na tanbihi inaonyesha maana mbadala halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetumia “ikakamilika,” “akaingiza,” na “akaviweka” kwa mtiririko wa kawaida. “Nyumba ya Yahwe” imehifadhiwa badala ya “hekalu la Yahwe” ili kubaki karibu na taswira ya chanzo.
