base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/002.yaml
  text: He built the House of the Forest of Lebanon[a], one hundred cubits long, fifty cubits wide, and thirty cubits high, on four rows of cedar pillars[c][b], with cedar beams on the pillars.
translation:
  language: sw
  text: Akajenga Nyumba ya Msitu wa Lebanoni, yenye urefu wa dhiraa mia moja, upana wa dhiraa hamsini, na kimo cha dhiraa thelathini, iliyokuwa juu ya safu nne za nguzo za mierezi,[b] na mihimili ya mierezi juu ya nguzo hizo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Au “yenye safu nne za nguzo za mierezi”; kihusishi cha Kiebrania kinaweza kuonyesha utegemezo (“juu ya”) au mpangilio (“yenye”).
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania lililotafsiriwa “mihimili” kwa neno halisi ni “vipande vilivyokatwa” vya mierezi; huenda likamaanisha mihimili, viguzo, au sehemu nyingine ya muundo iliyochongwa kwa mwerezi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Akajenga
  rationale: Kitenzi chenye waw-consecutive kinaendeleza simulizi kwa tendo la wakati uliopita; “Akajenga” ni mtiririko wa kawaida wa masimulizi ya Kiswahili.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Jumba la Msitu wa Lebanoni
  rationale: Hili linahifadhi jina la jengo na maana ya msingi ya בֵּית bila kulibainisha moja kwa moja kuwa ikulu; “jumba” linafaa kwa jengo hili kubwa kuliko “nyumba” katika muktadha huu.
- source_word: מֵאָה אַמָּה אָרְכּוֹ וַחֲמִשִּׁים אַמָּה רָחְבּוֹ וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: Lilikuwa na urefu wa dhiraa mia moja, upana wa dhiraa hamsini, na kimo cha dhiraa thelathini
  rationale: Muundo huu ni wa kawaida na wazi katika Kiswahili, huku ukihifadhi vipimo na kitengo cha kale cha אַמָּה kama “dhiraa.”
- source_word: עַל אַרְבָּעָה טוּרֵי עַמּוּדֵי אֲרָזִים
  choice: Lilijengwa juu ya safu nne za nguzo za mierezi
  rationale: טוּרֵי ni safu na עַמּוּדֵי ni nguzo. “Juu ya” huhifadhi maana ya mahali au utegemezo ya עַל, huku tanbihi ikidumisha uwezekano wa maana ya mpangilio.
- source_word: וּכְרֻתוֹת אֲרָזִים עַל הָעַמּוּדִים
  choice: na mihimili ya mierezi ilikuwa juu ya nguzo hizo
  rationale: כְרֻתוֹת humaanisha kwa msingi vipande vilivyokatwa; katika ujenzi, “mihimili” ni tafsiri inayoeleweka na inayowezekana, bila kuficha upana wa neno la Kiebrania, ambao umeelezwa katika tanbihi.
