translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. “Dhiraa” limetumiwa kama kitengo cha kale kinachotambulika katika lugha ya Biblia; sentensi zimegawanywa ili maelezo marefu ya usanifu yaeleweke vizuri bila kupoteza mpangilio wa taarifa za Kiebrania.
