base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/031.yaml
  text: Its opening projected upward from within the capital by a cubit[a], and its opening was round, like the work of a pedestal, a cubit and a half; and also on its opening were carvings, and their panels were square[c][b], not round.
translation:
  language: sw
  text: Kinywa chake kilitokeza kwenda juu kutoka ndani ya taji kwa dhiraa moja[a]. Kinywa hicho kilikuwa cha mviringo, kama kazi ya kiunzi[b], nacho kilikuwa na dhiraa moja na nusu. Juu ya kinywa chake pia kulikuwa na nakshi[c], na vibao vyake vilikuwa vya mraba, si vya mviringo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uwazi wake”; Kiebrania kinatumia “kinywa” kama sitiari ya usanifu kwa uwazi huu.
    reason: lexical_alternative
  - marker: b
    text: Kirai cha Kiebrania ni kigumu kiufundi; kinaweza pia kutafsiriwa “kazi ya kiunzi” au “kilichofanywa kama msingi.”
    reason: lexical_alternative
  - marker: c
    text: Neno hili linaweza pia kumaanisha michoro iliyochongwa, mashada, au taji za maua za mapambo.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִיהוּ / פִיהָ
  choice: kinywa
  rationale: Katika maelezo haya ya usanifu, neno hilo linatumika kimajazi kumaanisha uwazi wa juu. Kiswahili pia hutumia ‘kinywa’ kwa uwazi wa chombo, hivyo sitiari ya Kiebrania inaweza kuhifadhiwa kwa lugha ya kawaida.
- source_word: מִבֵּית לַכֹּתֶרֶת
  choice: kutoka ndani ya taji
  rationale: Kirai kinaonyesha kwamba kinywa kilianzia katika sehemu ya ndani ya kipambo cha juu kinachoitwa taji.
- source_word: וָמַעְלָה
  choice: kilitokeza kwenda juu
  rationale: Kielezi cha Kiebrania kinaonyesha mwendelezo kuelekea juu; kitenzi ‘kilitokeza’ kinaweka wazi wazo hilo linalodokezwa.
- source_word: בָּאַמָּה
  choice: kwa dhiraa moja
  rationale: Hiki ni kipimo cha urefu wa sehemu iliyotokeza kwenda juu.
- source_word: עָגֹל
  choice: cha mviringo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya umbo lililotajwa.
- source_word: מַעֲשֵׂה כֵן
  choice: kazi ya namna ya tako
  rationale: Kirai hiki cha kiufundi ni kigumu. ‘Tako’ hueleza msingi au sehemu ya chini inayotegemeza kitu, huku ‘kazi ya namna ya’ ikihifadhi muundo wa ulinganisho bila kuamua kwa uhakika sura yake.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: dhiraa moja na nusu
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kipimo hicho.
- source_word: מִקְלָעוֹת
  choice: nakshi
  rationale: Neno linaonyesha mapambo yaliyotengenezwa au kuchongwa, lakini aina kamili ya mapambo hayo haijulikani; ‘nakshi’ haibainishi kupita kiasi.
- source_word: מִסְגְּרֹתֵיהֶם
  choice: vibao vyake
  rationale: Katika maelezo haya ya vifaa vya Hekalu, neno linaweza kumaanisha sehemu zilizozingirwa kama vibao; uchaguzi huu unaendana na maelezo ya umbo lake.
- source_word: מְרֻבָּעוֹת לֹא עֲגֻלּוֹת
  choice: vilikuwa vya mraba, si vya mviringo
  rationale: Huhifadhi moja kwa moja tofauti ya Kiebrania kati ya umbo lenye pande nne na umbo la mviringo.
