translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka. ‘Kinywa’ kinahifadhi sitiari ya Kiebrania na ni cha kawaida pia kwa uwazi wa chombo; tanbihi inaeleza maana hiyo. Vipimo vya kale vimehifadhiwa kama ‘dhiraa’. Muundo wa aya umegawanywa katika sentensi tatu ili maelezo mazito ya usanifu yaeleweke bila kupoteza uhusiano wake.
