base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/027.yaml
  text: He made ten bronze stands. The length of each stand was four cubits[a], its width four cubits, and its height three cubits.
translation:
  language: sw
  text: Akatengeneza vibebeo[a] kumi vya shaba. Kila kibebeo kilikuwa na urefu wa dhiraa nne, upana wa dhiraa nne, na kimo cha dhiraa tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “misingi.” Neno la Kiebrania linamaanisha miundo ya shaba iliyobeba mabeseni katika eneo la hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Kitenzi hiki kinaendeleza mfululizo wa simulizi. Umbo la Kiswahili lenye kiambishi “aka-” linaonyesha tendo linalofuata kwa njia ya kawaida.
- source_word: הַמְּכֹנוֹת
  choice: vishikio
  rationale: Katika muktadha huu neno linamaanisha miundo ya shaba iliyobeba mabeseni. “Vishikio” linaeleza kazi yake kwa Kiswahili cha kawaida bila kulifanya kuwa gari, ingawa miundo hiyo ilikuwa na magurudumu.
- source_word: עֶשֶׂר
  choice: kumi
  rationale: Ni idadi ya moja kwa moja ya vishikio.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Katika orodha za vifaa vya hekalu, neno hili kwa kawaida humaanisha shaba iliyochanganywa (bronze); “shaba” ndilo neno la kawaida la Kiswahili katika muktadha huu.
- source_word: אַרְבַּע בָּאַמָּה אֹרֶךְ הַמְּכוֹנָה הָאֶחָת
  choice: Kila kishikio kilikuwa na urefu wa dhiraa nne
  rationale: Kirai “kishikio kimoja” kina nguvu ya kugawa, yaani kila kimoja. Mpangilio wa Kiswahili unaweka wazi kipimo cha urefu bila kubadili thamani.
- source_word: וְאַרְבַּע בָּאַמָּה רָחְבָּהּ
  choice: upana wa dhiraa nne
  rationale: Tafsiri hii huhifadhi kipimo na kiambishi kimilikishi, ambacho katika Kiswahili kinaeleweka kutokana na “kila kishikio.”
- source_word: וְשָׁלֹשׁ בָּאַמָּה קוֹמָתָהּ
  choice: na kimo cha dhiraa tatu
  rationale: קוֹמָה hapa ni kipimo cha kwenda juu; “kimo” ni neno la kawaida na sahihi kwa urefu huo.
- source_word: אַמָּה
  choice: dhiraa
  rationale: Kipimo cha kale kimehifadhiwa badala ya kubadilishwa kuwa kipimo cha kisasa, kwa sababu thamani yake ya kisasa ni ya kukadiriwa.
