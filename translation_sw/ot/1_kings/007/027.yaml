translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Sentensi ya pili imeundwa kwa mtiririko wa asili wa Kiswahili huku ikihifadhi vipimo vyote na maana ya “kila” iliyomo katika Kiebrania.
