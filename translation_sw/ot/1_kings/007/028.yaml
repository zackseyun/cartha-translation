  text: 'And this was the construction of the stand: they had frames[b][a], and there were frames between the supports.'
translation:
  language: sw
  text: 'Na hivi ndivyo msingi huo ulivyotengenezwa: ulikuwa na fremu[a], na kulikuwa na fremu kati ya viunga[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu zilizozungushiwa fremu”; neno la Kiebrania linaweza kumaanisha fremu zenyewe au sehemu za msingi zilizowekwa ndani ya fremu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “viunga” linaweza pia kumaanisha “mihimili ya kuvuka,” “nguzo wima,” au “reli”; sehemu hususa ya muundo inayokusudiwa haijulikani kwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Na hivi ndivyo
  rationale: Hutanguliza maelezo ya muundo huku ikihifadhi mwendelezo wa simulizi unaoonyeshwa na kiunganishi na kiwakilishi.
- source_word: מַעֲשֵׂה
  choice: ulivyotengenezwa
  rationale: Katika muktadha huu wa usanifu, neno linaeleza namna kitu kilivyoundwa au kujengwa, si kazi kwa maana ya jumla.
- source_word: הַמְּכוֹנָה
  choice: msingi huo
  rationale: Neno linataja msingi au kifaa cha kubebea birika; “msingi” ni la kawaida na linaeleweka katika Kiswahili bila kudai kwa uhakika zaidi umbo lake.
- source_word: מִסְגְּרֹת
  choice: fremu
  rationale: Neno la Kiebrania linaweza kutaja fremu au sehemu zilizozungushiwa fremu. “Fremu” huhifadhi ulinganifu wa kileksia na kurudiwa kwa neno hilo katika mstari.
- source_word: לָהֶם
  choice: ulikuwa na
  rationale: Muundo wenye kihusishi na kiambishi cha nafsi unaonyesha umilikaji; Kiswahili cha kawaida huutoa kwa “ulikuwa na.”
- source_word: וּמִסְגְּרֹת
  choice: na kulikuwa na fremu
  rationale: Kurudia nomino kama ilivyo katika Kiebrania kunahifadhi maelezo ya muundo; “kulikuwa na” hufanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: בֵּין
  choice: kati ya
  rationale: Hutoa kwa kawaida mahali palipo baina ya vipengele vya muundo.
- source_word: הַשְׁלַבִּים
  choice: viunga
  rationale: Neno linaonekana kumaanisha vipande vya kuunganisha katika muundo, lakini aina kamili ya vipande hivyo haijulikani; “viunga” ni tafsiri pana na ya tahadhari.
