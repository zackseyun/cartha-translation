base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/026.yaml
  text: He took the treasures of the house of Yahweh and the treasures of the king’s house; he took everything[a]. He also took all the gold shields that Solomon had made.
translation:
  language: sw
  text: Akachukua hazina za nyumba ya Yahweh[a] na hazina za ikulu ya mfalme; akachukua kila kitu. Pia akachukua ngao zote za dhahabu ambazo Sulemani alikuwa ametengeneza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “nyumba ya Yahweh”; yaani, hekalu.
    reason: Ufafanuzi huu hudumisha usemi halisi wa chanzo na wakati huohuo huwasaidia wasomaji kuelewa jengo linalokusudiwa.
lexical_decisions:
- source_word: וַיִּקַּח / לָקָח
  choice: akachukua
  rationale: Kitenzi לקח kimerudiwa katika Kiebrania. “Akachukua” ni tafsiri ya moja kwa moja na ya kawaida, bila kuongeza kwa lazima wazo lenye nguvu zaidi la “alipora” au “alinyakua.”
- source_word: אֹצְרוֹת
  choice: hazina
  rationale: Katika muktadha huu kinachochukuliwa ni mali zenye thamani zilizohifadhiwa, si majengo ya kuhifadhia; kwa hiyo “hazina” inafaa.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Huhifadhi usemi halisi wa Kiebrania, huku tanbihi ikifafanua kwamba hapa ni hekalu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: בֵּית הַמֶּלֶךְ
  choice: ikulu ya mfalme
  rationale: Ingawa maana halisi ni “nyumba ya mfalme,” katika muktadha huu inamaanisha makao rasmi ya kifalme; “ikulu ya mfalme” ni Kiswahili cha kawaida na wazi.
- source_word: וְאֶת הַכֹּל לָקָח
  choice: akachukua kila kitu
  rationale: Kauli hii ya muhtasari huhifadhi msisitizo wa הַכֹּל kwamba hakubakiza mali iliyotajwa.
- source_word: מָגִנֵּי הַזָּהָב
  choice: ngao za dhahabu
  rationale: Hii ni tafsiri ya kawaida na sahihi ya muundo wa Kiebrania, bila kuamua zaidi ya maandishi kuhusu matumizi ya ngao hizo.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: ambazo Sulemani alikuwa ametengeneza
  rationale: Wakati uliopita timilifu unaonyesha kwa kawaida kwamba Sulemani alizitengeneza kabla ya tukio hili.
- source_word: וַיִּקַּח ... וַיִּקַּח
  choice: Akachukua ... Pia akachukua
  rationale: “Pia” huhifadhi uhusiano wa nyongeza katika tendo la pili na kufanya marudio yasomeke kwa urahisi katika Kiswahili.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja tetragramatoni יהוה. “Yahwe” huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ikulu” limetumiwa kwa uwazi wa kawaida, huku “nyumba ya Yahwe” ikihifadhi taswira ya chanzo na kufafanuliwa kwa tanbihi.
