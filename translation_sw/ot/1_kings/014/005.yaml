base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/005.yaml
  text: And Yahweh said to Ahijah[a], “Look, Jeroboam’s wife is coming to ask you about her son, because he is sick. You shall speak to her like this and like that. And when she comes[b], she will be disguising herself.”
translation:
  language: sw
  text: Yahwe akamwambia Ahiya, “Tazama, mke wa Yeroboamu anakuja kukuuliza habari za mwanawe, kwa sababu ni mgonjwa. Utamwambia hivi na hivi.[a] Atakapokuja, atakuwa akijifanya asitambulike.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hivi na hivi”—nahau inayomaanisha ujumbe mahususi ambao maudhui yake bado hayajaelezwa wazi.'
    reason: lexical_alternative
  - marker: b
    text: Au “atakuwa akijifanya kuwa mwanamke mwingine.” Kitenzi cha Kiebrania kina maana ya mtu kujifanya asitambuliwe au kujigeuza ili asijulikane.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahwe
  rationale: Linatambulisha jina la Mungu moja kwa moja na kufuata matamshi ya kawaida ya Kiswahili.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linahifadhi neno la kuvuta fikira katika simulizi kwa lugha yenye heshima na inayoeleweka.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: mke wa Yeroboamu
  rationale: Ni muundo wa kawaida wa Kiswahili unaohifadhi uhusiano wa umilikaji.
- source_word: בָּאָה
  choice: anakuja
  rationale: Wakati wa sasa unaonyesha tendo lililo karibu kutokea katika muktadha huu.
- source_word: לִדְרֹשׁ דָּבָר מֵעִמְּךָ אֶל בְּנָהּ
  choice: kukuuliza habari za mwanawe
  rationale: Linawasilisha kwa Kiswahili cha kawaida wazo la kutafuta neno au taarifa kutoka kwa nabii kuhusu mwanawe.
- source_word: כִּי חֹלֶה הוּא
  choice: kwa sababu ni mgonjwa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi cha sababu.
- source_word: כָּזֹה וְכָזֶה
  choice: hivi na hivi
  rationale: Linahifadhi nahau inayorejelea ujumbe mahususi ambao maudhui yake bado hayajatajwa.
- source_word: תְּדַבֵּר אֵלֶיהָ
  choice: Utamwambia
  rationale: Linaonyesha agizo la Mungu kwa Ahiya kwa namna ya kawaida katika Kiswahili.
- source_word: וִיהִי כְבֹאָהּ
  choice: Atakapokuja
  rationale: Linatoa kwa ufupi na kwa kawaida maana ya kishazi cha wakati.
- source_word: וְהִיא מִתְנַכֵּרָה
  choice: atakuwa amejifanya asitambulike
  rationale: Linahifadhi maana ya kujifanya ili mtu asitambuliwe na pia hali hiyo wakati wa kuwasili kwake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Jina binafsi limewasilishwa moja kwa moja bila kulibadilisha kuwa cheo, huku likifuata umbo linalotumika katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Nahau ya Kiebrania imehifadhiwa, huku maana yake ikifafanuliwa katika tanbihi.
