base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/022.yaml
  text: And Judah did what was evil in the eyes of Yahweh[a], and they provoked him to jealousy more than all that their fathers had done, by the sins that they committed.
translation:
  language: sw
  text: Yuda akafanya yaliyo maovu machoni pa BWANA, nao wakauamsha wivu wake[a] kwa dhambi zao walizotenda, zaidi ya yote waliyoyafanya baba zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamfanya awe na wivu” au “wakachochea wivu wake.” Kiebrania kinatumia lugha ya wivu wa agano kueleza jinsi BWANA alivyoitikia kutokuwa waaminifu kwa Yuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina la ufalme na watu wake kwa maana ya kijumla; ndiyo sababu kitenzi kinachofuata baadaye kiko katika wingi.
- source_word: הָרַע
  choice: yaliyo maovu
  rationale: Muundo עשה + הרע humaanisha kufanya mambo yaliyo maovu; tafsiri hii ni ya kawaida katika Kiswahili huku ikihifadhi hukumu ya kimaadili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa BWANA
  rationale: Huhifadhi sitiari ya Kiebrania ya tathmini ya Mungu. Jina la agano YHWH limewakilishwa kwa BWANA kwa herufi kubwa.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: wakamchochea awe na wivu
  rationale: Huhifadhi lugha ya wivu wa agano unaochochewa na ukosefu wa uaminifu wa Yuda, bila kuibadili tu kuwa hasira.
- source_word: מִכֹּל אֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: kuliko yote ambayo babu zao walikuwa wamefanya
  rationale: Muundo wa kulinganisha מן + כל unaonyesha kwamba matendo yao yalizidi yote yaliyofanywa na waliowatangulia; 'babu zao' hapa ni mababu au wahenga wao.
- source_word: בְּחַטֹּאתָם אֲשֶׁר חָטָאוּ
  choice: kwa dhambi walizotenda
  rationale: Kiswahili cha kawaida huepuka kurudia kwa namna ya 'dhambi walizofanya dhambi,' lakini huhifadhi maana ya njia au sababu inayoonyeshwa na בְּ.
theological_decisions:
- issue: Lugha ya wivu wa Mungu
  choice: wakamchochea awe na wivu
  alternative: wakaamsha wivu wake
  rationale: Tafsiri inahifadhi wazo la Kiebrania la wivu wa agano wa BWANA kutokana na kutokuwa waaminifu kwa Yuda, bila kuudhoofisha kuwa hasira ya kawaida wala kuudokeza kuwa husuda yenye dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Mabadiliko kutoka umoja katika “Yuda akafanya” kwenda wingi katika “nao wakamchochea” yamehifadhiwa kwa sababu Yuda ni jina la kijumla la watu wa ufalme.
