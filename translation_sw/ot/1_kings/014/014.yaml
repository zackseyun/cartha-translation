  text: וְ/הֵקִים֩ יְהוָ֨ה ל֥/וֹ מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יַכְרִ֛ית אֶת בֵּ֥ית יָרָבְעָ֖ם זֶ֣ה הַ/יּ֑וֹם וּ/מֶ֖ה גַּם עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/014.yaml
  text: And Yahweh will raise up for himself a king over Israel who will cut off the house of Jeroboam this day[a]. But what? Even now.
translation:
  language: sw
  text: Yahwe atajiinulia mfalme juu ya Israeli, ambaye ataikatilia mbali nyumba ya Yeroboamu siku hii[a]. Lakini nini? Hata sasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mwisho wa sentensi ya Kiebrania ni wa ghafla na mgumu; kwa karibu ni, “na nini? hata sasa.” Wengine huuelewa kuwa mshangao unaosisitiza kwamba hukumu iko karibu sana, kama vile, “lakini nini? hata sasa!” au “lakini nini zaidi? tayari sasa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵקִים
  choice: atajiinulia
  rationale: Hifili ya קום hapa humaanisha kumwinua au kumleta mtawala atokee; umbo la kujirejelea linaakisi לּוֹ, ‘kwa ajili yake mwenyewe,’ kwa Kiswahili cha asili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa unukuzi wa Kiswahili ‘Yahwe,’ badala ya kulibadilisha kuwa cheo.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: mfalme juu ya Israeli
  rationale: ‘Juu ya’ huhifadhi maana ya עַל ya mamlaka ya kifalme, yaani kutawala Israeli.
- source_word: אֲשֶׁר יַכְרִית
  choice: ambaye ataikatilia mbali
  rationale: Hifili ya כרת hubeba maana ya kukatilia mbali au kuangamiza; ‘kuikatilia mbali’ huhifadhi tamathali ya Kiebrania na nguvu ya hukumu.
- source_word: בֵּית יָרָבְעָם
  choice: nyumba ya Yeroboamu
  rationale: ‘Nyumba’ huhifadhi istilahi ya nasaba ya kifalme bila kuibainisha kupita kiasi kuwa ‘ukoo wa kifalme.’
- source_word: זֶה הַיּוֹם
  choice: siku hii
  rationale: Hii ndiyo tafsiri ya karibu ya kifungu hicho na hudumisha mkazo pamoja na sintaksia ngumu ya mstari.
- source_word: וּמֶה גַּם עָתָּה
  choice: Lakini nini? Hata sasa.
  rationale: Kifungu ni kifupi, cha ghafla, na kisicho kamili kisintaksia; tafsiri hii huhifadhi hali hiyo badala ya kukifafanua kwa uhakika usiopo katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi kwa umbo la kawaida la Kiswahili.
- issue: Kifungu kigumu cha mwisho וּמֶה גַּם עָתָּה
  choice: 'Kuhifadhi ghafla na utata wake: ‘Lakini nini? Hata sasa.’'
  alternative: Hukumu hiyo tayari inaanza sasa; Au, kuna nini zaidi? Tayari ni sasa.
  rationale: Kiebrania kimebanwa na hakina ukamilifu wa kawaida wa kisintaksia. Kukifafanua kuwa taarifa kamili kungeondoa utata halisi na kuongeza maana isiyo hakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa leo. Utata wa mwisho umehifadhiwa kwa makusudi; alama [a] iko katika matini kuu na inaelezwa katika tanbihi.
