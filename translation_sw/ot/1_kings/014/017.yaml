  text: Then Jeroboam’s wife arose and went and came to Tirzah. As she came to the threshold of the house[a], the boy died.
translation:
  language: sw
  text: Ndipo mke wa Yeroboamu akainuka, akaenda, akafika Tirza. Alipofika kwenye kizingiti cha nyumba[a], yule mtoto akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipokuwa akifika kwenye kizingiti cha nyumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: akainuka
  rationale: Qal wayyiqtol ya קום inaendeleza mfululizo wa simulizi. “Akainuka” hudumisha mtindo wa Kiebrania bila kuifasiri moja kwa moja kuwa kuondoka.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: mke wa Yeroboamu
  rationale: Muundo wa construct unaonyesha uhusiano wa ndoa; huu ndio usemi wa kawaida na wazi katika Kiswahili.
- source_word: וַתֵּלֶךְ
  choice: akaenda
  rationale: הלך katika simulizi rahisi humaanisha kwenda; hakuna haja ya kuongeza wazo maalumu la safari au kuondoka.
- source_word: וַתָּבֹא תִרְצָתָה
  choice: akafika Tirza
  rationale: בוא pamoja na he ya mwelekeo katika תִרְצָתָה huonyesha mwendo wenye Tirza kama kikomo. “Akafika Tirza” ni Kiswahili cha kawaida na hakidai hasa kwamba aliingia kupitia lango.
- source_word: הִיא בָּאָה
  choice: Alipokuwa akifika
  rationale: Kiwakilishi huru pamoja na participle huleta mazingira ya wakati na tendo linaloendelea kwenye wakati wa kufika; “alipokuwa akifika” huhifadhi hali hiyo.
- source_word: בְסַף הַבַּיִת
  choice: kwenye kizingiti cha nyumba
  rationale: סַף ni kizingiti au sehemu ya chini ya mlango. “Kizingiti” ndilo neno sahihi zaidi, huku “kwenye” likihifadhi uwezekano wa kuelewa mahali au hatua ya kufikia hapo.
- source_word: וְהַנַּעַר
  choice: yule mtoto
  rationale: נַעַר inaweza kumaanisha mtoto, mvulana, kijana, au mtumishi. Katika muktadha huu ni mwana wa Yeroboamu; “yule mtoto” ni wazi na la kawaida, na kiashiria kinarejelea mtoto aliyetajwa tayari.
- source_word: מֵת
  choice: akafa
  rationale: Ingawa ni umbo la qatal la מות, katika muktadha huu linaonyesha tukio lililotokea wakati huo na kutimiza unabii wa mstari uliotangulia.
