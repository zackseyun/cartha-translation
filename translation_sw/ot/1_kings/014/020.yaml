base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/020.yaml
  text: The days that Jeroboam reigned were twenty-two years. Then he lay down with his fathers[a], and Nadab his son became king in his place.
translation:
  language: sw
  text: Miaka ambayo Yeroboamu alitawala ilikuwa ishirini na miwili. Kisha akalala pamoja na baba zake[a], naye Nadabu mwanawe akawa mfalme mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa mapokeo: “akalala na baba zake.” Nahau hii ya Kiebrania humaanisha kwamba alikufa; hutumiwa katika taarifa za mfuatano wa kifalme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: Miaka ambayo ... alitawala
  rationale: Katika muhtasari huu wa utawala, הַיָּמִים hurejelea muda wa kutawala; Kiswahili cha kawaida hutumia 'miaka ambayo ... alitawala' badala ya tafsiri sisisi ya 'siku ambazo.' Kiunganishi וְ hakihitaji kutafsiriwa kando mwanzoni.
- source_word: יָרָבְעָם
  choice: Yeroboamu
  rationale: Umbo la kawaida la jina hili katika mapokeo ya Biblia ya Kiswahili.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: ishirini na miwili
  rationale: Namna ya kawaida ya Kiswahili ya kutaja idadi ya miaka; neno 'miaka' tayari limetajwa mwanzoni mwa sentensi.
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: akalala pamoja na baba zake
  rationale: Hifadhi nahau ya Kiebrania ya kifo katika taarifa ya urithi wa kifalme bila kuongeza maziko au kuibadili moja kwa moja kuwa 'alikufa.' Tanbihi inaeleza maana yake.
- source_word: וַיִּמְלֹךְ
  choice: akawa mfalme
  rationale: Katika muktadha wa urithi wa ufalme, kauli hii inaonyesha kuingia madarakani, si tu kuendelea kutawala.
- source_word: נָדָב בְּנוֹ
  choice: Nadabu mwanawe
  rationale: Huhifadhi jina na uhusiano wa mwana uliotajwa wazi katika Kiebrania, kwa mpangilio wa asili na unaoeleweka katika Kiswahili.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Hutoa wazi wazo la kuchukua nafasi ya mtawala aliyetangulia katika mfuatano wa kifalme.
theological_decisions:
- issue: Nahau ya kifo katika taarifa ya kifalme
  choice: akalala pamoja na baba zake
  alternative: alikufa; akapumzika pamoja na baba zake
  rationale: Kiebrania kinatumia nahau ya kawaida ya kifo, si maelezo ya kina kuhusu hali ya baada ya kufa. Kuihifadhi hudumisha taswira na mvutano wa matini bila kuingiza fundisho la ziada; tanbihi huzuia isieleweke kwa maana ya kawaida tu ya usingizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. 'Miaka ambayo ... alitawala' ni ya asili zaidi kuliko 'siku ambazo ... alitawala,' huku nahau ya Kiebrania ikihifadhiwa na kufafanuliwa katika tanbihi.
