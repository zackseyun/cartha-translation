  yaml_path: translation/ot/1_kings/014/030.yaml
  text: And there was war between Rehoboam and Jeroboam all their days[a].
translation:
  language: sw
  text: Kulikuwa na vita kati ya Rehoboamu na Yeroboamu siku zao zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “siku zote.” Nahau hii ya Kiebrania inaonyesha kwamba vita hivyo viliendelea katika maisha au tawala zao zote.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלְחָמָה
  choice: Kulikuwa na vita
  rationale: Nomino מִלְחָמָה humaanisha vita; pamoja na הָיְתָה, muundo wa Kiswahili “kulikuwa na vita” unaonyesha kwa kawaida hali ya uhasama bila kuongeza wazo lisilotajwa la mapigano yasiyokoma.
- source_word: הָיְתָה
  choice: kulikuwa na
  rationale: Hapa kitenzi היה kina kazi ya kueleza kuwapo kwa hali fulani. “Kulikuwa na” ni Kiswahili cha kawaida na cha moja kwa moja katika muktadha huu.
- source_word: בֵין ... וּבֵין
  choice: kati ya ... na
  rationale: Vihusishi hivi vilivyorudiwa vinaonyesha uhasama wa pande mbili; “kati ya ... na” ni sawia ya kawaida katika Kiswahili.
- source_word: רְחַבְעָם
  choice: Rehoboamu
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: יָרָבְעָם
  choice: Yeroboamu
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: כָּל הַיָּמִים
  choice: siku zao zote
  rationale: Kihalisi ni “siku zote.” Kwa kuwa muktadha unawataja wafalme wawili, “siku zao zote” ni Kiswahili cha kawaida kinachoonyesha muda wote wa maisha au tawala zao bila kulazimisha moja ya maana hizo.
