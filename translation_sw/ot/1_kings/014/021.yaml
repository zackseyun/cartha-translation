  text: וּ/רְחַבְעָם֙ בֶּן שְׁלֹמֹ֔ה מָלַ֖ךְ בִּֽ/יהוּדָ֑ה בֶּן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִֽית־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/021.yaml
  text: Rehoboam the son of Solomon reigned in Judah[a]. Rehoboam was forty-one years old when he became king, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite woman.
translation:
  language: sw
  text: Rehoboamu mwana wa Sulemani alitawala katika Yuda[a]. Rehoboamu alikuwa na umri wa miaka arobaini na mmoja alipoanza kuwa mfalme, naye alitawala kwa miaka kumi na saba huko Yerusalemu, mji ambao Yahwe alikuwa ameuchagua kutoka katika makabila yote ya Israeli ili aweke jina lake humo[b]. Jina la mama yake lilikuwa Naama, mwanamke Mwamoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alitawala juu ya Yuda.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “ili aweke jina lake humo,” usemi wa agano unaoonyesha mahali palipohusishwa kwa namna ya pekee na uwepo na ibada ya Yahwe.'
    reason: cultural_note
lexical_decisions:
- source_word: מָלַךְ
  choice: alitawala
  rationale: Kitenzi hiki kinaeleza utawala wa kifalme. “Alitawala” ni Kiswahili cha kawaida na chenye heshima kinachofaa katika sehemu zote mbili za aya.
- source_word: בִּיהוּדָה
  choice: katika Yuda
  rationale: Kihusishi בְּ kwa kawaida humaanisha “katika.” Katika muktadha wa kifalme, maana inaweza pia kutolewa kama “juu ya Yuda,” hivyo tofauti hiyo imehifadhiwa katika tanbihi.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kuwa mfalme
  rationale: Muundo wa kihusishi pamoja na kitenzi-jina na kiambishi cha nafsi unaonyesha wakati wa kuingia katika ufalme. Tafsiri hii inaweka wazi kwamba miaka arobaini na mmoja ilikuwa umri wake alipoingia madarakani.
- source_word: הָעִיר אֲשֶׁר בָּחַר יְהוָה
  choice: mji ambao Yahwe alikuwa ameuchagua
  rationale: Kishazi hiki kinaitambulisha Yerusalemu kwa uchaguzi wa Mungu; wakati uliotangulia “alikuwa ameuchagua” unafaa kwa mtazamo wa simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu lililoandikwa kwa konsonanti YHWH limetoholewa kwa tahajia ya kawaida ya Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: ili aliweke jina lake humo
  rationale: Hii inafuata nahau ya Kiebrania “kuweka jina lake huko” bila kuipanua kuwa maelezo yasiyosemwa moja kwa moja katika aya.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: kutoka katika makabila yote ya Israeli
  rationale: Kihusishi מִן kinaonyesha uchaguzi kutoka miongoni mwa makabila ya Israeli.
- source_word: וְשֵׁם אִמּוֹ
  choice: Jina la mama yake lilikuwa
  rationale: Huu ni usemi wa kawaida na wa asili wa Kiswahili unaohifadhi taarifa rasmi ya ukoo inayojirudia katika kitabu cha Wafalme.
- source_word: הָעַמֹּנִית
  choice: Mwamoni
  rationale: Neno hili la jinsia ya kike linamtambulisha Naama kuwa mwanamke wa taifa la Waamoni; “Mwamoni” ni umbo la kawaida la Kiswahili kwa mtu mmoja wa taifa hilo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Matini ina jina la Mungu YHWH moja kwa moja. “Yahwe” linahifadhi jina hilo kwa umbo linalotumika kwa kawaida katika Kiswahili, bila kulibadilisha kuwa cheo kama “BWANA.”
- issue: Nahau ya kuweka jina la Mungu mahali
  choice: ili aliweke jina lake humo
  alternative: ili jina lake likae humo
  rationale: Kiebrania kinasema kihalisi “kuweka jina lake huko.” Tafsiri iliyochaguliwa inadumisha nahau ya agano na mvutano wake wa kitheolojia bila kuifasiri moja kwa moja kuwa uwepo, makao, au ibada pekee.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa, na wenye heshima. Majina yametolewa kwa maumbo yanayotambulika katika Kiswahili: Rehoboamu, Sulemani, Yerusalemu, Israeli, Yahwe, Naama, na Mwamoni.'
