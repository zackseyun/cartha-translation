  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יָרָבְעָ֜ם לְ/אִשְׁתּ֗/וֹ ק֤וּמִי נָא֙ וְ/הִשְׁתַּנִּ֔ית וְ/לֹ֣א יֵֽדְע֔וּ כִּי אתי אֵ֣שֶׁת יָרָבְעָ֑ם וְ/הָלַ֣כְתְּ שִׁלֹ֗ה הִנֵּה שָׁם֙ אֲחִיָּ֣ה הַ/נָּבִ֔יא הֽוּא דִבֶּ֥ר עָלַ֛/י לְ/מֶ֖לֶךְ עַל הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/002.yaml
  text: Jeroboam said to his wife[a], “Please get up and disguise yourself, so that they will not know that you are the wife of Jeroboam, and go to Shiloh. Behold, Ahijah the prophet is there; he is the one who spoke concerning me[b], that I would be king over this people.”
translation:
  language: sw
  text: Yeroboamu akamwambia mkewe, “Tafadhali, inuka ubadilishe sura yako, ili wasijue[a] kwamba wewe ni mke wa Yeroboamu, kisha uende Shilo. Tazama, nabii Ahiya yuko huko; ndiye aliyesema kunihusu[b], kwamba ningekuwa mfalme juu ya watu hawa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “na hawatajua”; Kiebrania hakitaji wazi ni nani watakaojua.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuwa mfalme juu ya watu hawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa masimulizi wa Kiebrania unaendelezwa kwa ‘aka-’; ‘akamwambia’ ni wa kawaida na unaonyesha anayeelekezewa maneno.
- source_word: לְאִשְׁתּוֹ
  choice: mkewe
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya uhusiano wa kindoa pamoja na kiambishi cha umilikaji.
- source_word: קוּמִי נָא
  choice: Tafadhali, inuka
  rationale: ‘Inuka’ huhifadhi amri ya קוּמִי, na ‘tafadhali’ huwakilisha chembe ya ombi נָא bila kutumia lugha ya kizamani.
- source_word: וְהִשְׁתַּנִּית
  choice: ujibadilishe sura
  rationale: Kitenzi cha kujirejelea hapa humaanisha kubadili mwonekano ili mtu asitambulike; usemi huu ni wazi na wa asili katika Kiswahili.
- source_word: וְלֹא יֵדְעוּ
  choice: ili wasijue
  rationale: Katika muktadha huu kishazi kinaonyesha kusudi la kujibadilisha sura. Kiima cha wingi kinaachwa bila kutajwa, kama kilivyo katika Kiebrania.
- source_word: וְהָלַכְתְּ שִׁלֹה
  choice: kisha uende Shilo
  rationale: Kitenzi kinachofuatana na amri kina nguvu ya agizo; ‘kisha’ huonyesha vizuri mfuatano wa vitendo.
- source_word: הִנֵּה שָׁם
  choice: Tazama, ... yuko huko
  rationale: ‘Tazama’ huhifadhi nguvu ya neno la kuleta jambo makini, huku ‘yuko huko’ ikitaja mahali kwa lugha ya kawaida.
- source_word: אֲחִיָּה הַנָּבִיא
  choice: nabii Ahiya
  rationale: Cheo kinawekwa kabla ya jina kwa mpangilio wa kawaida wa Kiswahili, na jina linatoholewa kama Ahiya.
- source_word: הוּא דִבֶּר
  choice: ndiye aliyesema
  rationale: ‘Ndiye’ huhifadhi msisitizo unaotokana na kiwakilishi huru הוּא.
- source_word: עָלַי
  choice: kunihusu
  rationale: Pamoja na דִבֶּר, kihusishi עַל kinaweza kumaanisha ‘kuhusu’; hapa unabii ulimhusu Yeroboamu.
- source_word: לְמֶלֶךְ עַל הָעָם הַזֶּה
  choice: kwamba ningekuwa mfalme juu ya watu hawa
  rationale: Tafsiri hii inaonyesha hadhi iliyotabiriwa ya Yeroboamu na kuhifadhi usemi ‘juu ya watu hawa’ ulio katika chanzo.
theological_decisions:
- issue: Uhusiano wa עָלַי na לְמֶלֶךְ
  choice: ndiye aliyesema kunihusu, kwamba ningekuwa mfalme
  alternative: ndiye aliyesema kunihusu kuwa mfalme
  rationale: Kiswahili cha kishazi kamili ni wazi na huhifadhi kwamba unabii ulimhusu Yeroboamu na ufalme wake, bila kuongeza maelezo ya kiitikadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa masimulizi umetumia ‘aka-’; majina Yeroboamu, Shilo, na Ahiya yamefuata maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili. Lugha huepuka ukale usio wa lazima huku ikihifadhi msisitizo na utata halisi wa Kiebrania.
