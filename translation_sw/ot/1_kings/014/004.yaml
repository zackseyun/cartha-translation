base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/004.yaml
  text: Jeroboam’s wife did so. She arose and went to Shiloh[a], and came to Ahijah’s house. Now Ahijah could not see, because his eyes were dim because of his old age.
translation:
  language: sw
  text: Mke wa Yeroboamu akafanya hivyo. Akaondoka, akaenda Shilo, akafika nyumbani kwa Ahiya. Ahiya hakuweza kuona, kwa maana macho yake yalikuwa yamepofuka kwa uzee wake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “macho yake yalisimama,” nahau inayoeleza kupoteza uwezo wa kuona kwa uzee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ כֵּן
  choice: akafanya hivyo
  rationale: Ni usemi wa kawaida wa simulizi unaoonyesha kwamba alitekeleza maagizo yaliyotangulia.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: Mke wa Yeroboamu
  rationale: Muundo huu wa Kiswahili unawakilisha kwa uwazi tungo ya umilikaji ya Kiebrania.
- source_word: וַתָּקָם
  choice: akaondoka
  rationale: Katika mfuatano wa safari, kitenzi hiki kina maana ya kuinuka na kuanza kwenda; “akaondoka” ni cha asili katika simulizi la Kiswahili.
- source_word: וַתֵּלֶךְ שִׁלֹה
  choice: akaenda Shilo
  rationale: Inahifadhi kitenzi rahisi cha mwendo pamoja na mahali safari ilikoelekea.
- source_word: וַתָּבֹא בֵּית אֲחִיָּה
  choice: akafika nyumbani kwa Ahiya
  rationale: Kiebrania kinaweza kueleza kufika kwenye nyumba bila kusisitiza kuingia ndani; “akafika nyumbani kwa” huhifadhi maana hiyo.
- source_word: וַאֲחִיָּהוּ לֹא יָכֹל לִרְאוֹת
  choice: Ahiya hakuweza kuona
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kutoweza pamoja na kitenzi “kuona.”
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu ya Ahiya kutoweza kuona kwa mtiririko wa asili wa Kiswahili.
- source_word: קָמוּ עֵינָיו
  choice: macho yake yalikuwa yamefifia
  rationale: Kihalisi ni “macho yake yalisimama,” lakini ni nahau inayoeleza kupoteza uwezo wa kuona kutokana na uzee. “Yalikuwa yamefifia” huwasilisha hali hiyo bila kudai upofu kamili.
- source_word: מִשֵּׂיבוֹ
  choice: kutokana na uzee wake
  rationale: Kihusishi kinaonyesha chanzo au sababu; usemi huu ni wa kawaida na sahihi katika Kiswahili.
