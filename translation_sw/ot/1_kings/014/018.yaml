  text: They buried him[a], and all Israel mourned for him, according to the word of Yahweh that he had spoken through his servant Ahijah the prophet.
translation:
  language: sw
  text: Wakamzika, na Israeli wote wakamwombolezea, sawasawa na neno la Yahwe alilolinena kupitia[a] mtumishi wake, nabii Ahiya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa mkono wa mtumishi wake Ahiya, nabii,” nahau yenye maana ya “kupitia mtumishi wake, nabii Ahiya.”'
