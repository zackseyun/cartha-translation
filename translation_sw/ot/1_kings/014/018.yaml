lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Wakamzika
  rationale: Kitenzi cha usimulizi katika wingi pamoja na kiambishi cha yambwa kinawasilisha kwa ufupi na kwa kawaida kwamba walimzika mwana aliyekuwa amekufa.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: wakamwombolezea
  rationale: Mzizi ספד unaonyesha maombolezo ya hadharani kwa ajili ya aliyekufa; “kumwombolezea” ni Kiswahili cha kawaida na kinafaa katika muktadha wa mazishi.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Hili linahifadhi usemi wa kijumla unaowakilisha watu au taifa lote bila kulazimisha maana ya kila mtu mmoja mmoja.
- source_word: כִּדְבַר יְהוָה
  choice: sawasawa na neno la Yahwe
  rationale: “Sawasawa na” linaonyesha kwamba tukio lilitimiza kile kilichokuwa kimesemwa, huku “neno la Yahwe” likihifadhi mtindo rasmi wa utimizo wa unabii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֲשֶׁר דִּבֶּר
  choice: alilokuwa amesema
  rationale: Wakati uliopita unaonyesha kuwa neno hilo lilikuwa limetamkwa kabla ya mazishi na maombolezo.
- source_word: בְּיַד
  choice: kupitia
  rationale: Usemi halisi “kwa mkono wa” ni nahau ya Kiebrania ya kuonyesha wakala au njia; “kupitia” huwasilisha maana hiyo kwa Kiswahili cha sasa.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: Katika kauli kuhusu huduma ya kinabii, “mtumishi” linaonyesha mtu aliyepewa wajibu bila kuingiza wazo lisilohitajika la utumwa wa lazima.
- source_word: אֲחִיָּהוּ הַנָּבִיא
  choice: Ahiya, nabii
  rationale: Jina limetoholewa kwa namna inayofaa Kiswahili, na cheo chake cha kinabii kimehifadhiwa.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina binafsi la agano; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Kauli ya upatanishi wa kinabii בְּיַד עַבְדּוֹ
  choice: kupitia mtumishi wake
  alternative: kwa mkono wa mtumishi wake
  rationale: “Kupitia” linaonyesha kwamba Yahwe alisema kwa njia ya Ahiya bila kuongeza maelezo ya kimafundisho zaidi ya maandishi yenyewe.
translation_notes:
