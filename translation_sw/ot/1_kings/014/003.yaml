  text: And take in your hand ten loaves of bread, some cakes, and a jar of honey, and go to him. He will tell you what will happen to the boy.
translation:
  language: sw
  text: Chukua mkononi mwako mikate kumi, keki kadhaa, na chupa ya asali, kisha uende kwake. Yeye atakuambia kitakachompata mtoto huyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשָׂרָה לֶחֶם
  choice: mikate kumi
  rationale: Neno לֶחֶם hapa lina maana ya mikate inayohesabika; Kiswahili cha kawaida hakihitaji kuongeza “ya kuoka” au maelezo mengine.
- source_word: נִקֻּדִים
  choice: mikate mingine midogo
  rationale: Neno hili adimu linaelekea kutaja vyakula vya kuokwa, labda mikate au maandazi yenye madoadoa; tafsiri hii inaepuka kubainisha aina isiyo hakika huku ikitofautisha na mikate kumi.
- source_word: בַקְבֻּק דְּבַשׁ
  choice: chupa ya asali
  rationale: בַקְבֻּק ni chombo au chupa, na דְּבַשׁ katika muktadha huu inafaa kutafsiriwa kwa maana yake ya kawaida, “asali.”
- source_word: מַה יִּהְיֶה לַנָּעַר
  choice: yatakayompata huyo mtoto
  rationale: Usemi wa Kiebrania unauliza kitakachokuwa kwa mtoto; Kiswahili hiki ni cha asili na huhifadhi maana ya hali au hatima itakayomfikia.
theological_decisions:
- issue: Uhakika wa taarifa ya nabii
  choice: Yeye atakuambia yatakayompata huyo mtoto
  alternative: Yeye anaweza kukuambia yatakayompata huyo mtoto
  rationale: Kitenzi יַגִּיד ni taarifa ya moja kwa moja ya wakati ujao, si uwezekano; tafsiri haipunguzi uhakika uliomo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa kwa mtiririko wa kawaida bila kuondoa urudiaji wa amri za Kiebrania. “Mikate mingine midogo” inaonyesha kutokuwa na uhakika kamili kuhusu נִקֻּדִים bila kutumia istilahi ya kizamani.
