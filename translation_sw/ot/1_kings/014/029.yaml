  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu fomula ya Kiebrania: “Mambo mengine” huwasilisha וְיֶתֶר דִּבְרֵי katika muktadha wa matendo/habari za mfalme; “na yote aliyofanya” ni sahihi kwa וְכָל אֲשֶׁר עָשָׂה; na swali la balagha “je, hayajaandikwa” huhifadhi הֲלֹא הֵמָּה כְתוּבִים. Rejeo la hati, “katika Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda,” linaendana na עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה.'
