  text: וְ/יֶ֛תֶר דִּבְרֵ֥י רְחַבְעָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/029.yaml
  text: The rest of the acts of Rehoboam[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: sw
  text: Mambo mengine ya Rehoboamu, na yote aliyofanya, je, hayajaandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumbukumbu za matukio ya wafalme wa Yuda.” Maneno ya Kiebrania yaliyotafsiriwa “Mambo ya Nyakati” yanamaanisha rekodi ya kifalme ya matukio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי רְחַבְעָם
  choice: Mambo mengine ya Rehoboamu
  rationale: Katika fomula hii ya kihistoria, יֶתֶר ni sehemu iliyobaki au mengine, na דִּבְרֵי humaanisha mambo au shughuli zinazomhusu mfalme, si maneno aliyosema tu.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: na yote aliyofanya
  rationale: Tafsiri pana na ya moja kwa moja ya עשה, bila kuongeza wazo la mafanikio au hukumu ya kimaadili.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: je, hayajaandikwa
  rationale: Inahifadhi swali la balagha lenye kutarajia jibu la kukubali na pia hali ya kutendwa ya kitenzi ‘kuandika.’ Upatanisho wa ngeli unarejelea ‘mambo.’
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kwa msingi ni ‘juu ya,’ katika rejeo la hati Kiswahili cha kawaida husema kwamba habari zimeandikwa ‘katika kitabu.’
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Mambo ya Nyakati za Wafalme wa Yuda
  rationale: Hili ni jina linaloeleweka la kumbukumbu ya kifalme; linahifadhi maana ya rekodi ya matukio ya siku za wafalme bila kulichanganya lazima na kitabu cha Biblia kinachoitwa Mambo ya Nyakati.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha umehifadhiwa, na kiunganishi cha mwanzo וְ hakijaongezewa neno la wakati kama ‘basi’ au ‘sasa.’ Alama ya tanbihi imewekwa baada ya jina la hati inayofafanuliwa.
