  text: וְ/גַם קָדֵ֖שׁ הָיָ֣ה בָ/אָ֑רֶץ עָשׂ֗וּ כְּ/כֹל֙ הַ/תּוֹעֲבֹ֣ת הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/024.yaml
  text: There were also cult prostitutes in the land[a]. They did according to all the abominations of the nations that Yahweh had driven out before the sons of Israel.
translation:
  language: sw
  text: Pia kulikuwa na makahaba wa ibada nchini[a]. Walitenda kulingana na machukizo yote ya mataifa ambayo Yahweh alikuwa ameyafukuza mbele ya wana wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makahaba wa kiume wa ibada” au “makahaba wa hekaluni.” Neno la Kiebrania קָדֵשׁ linamtaja mtu aliyehusishwa na desturi haramu za kingono katika ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Pia kulikuwa na
  rationale: Inaunganisha wazo la nyongeza na tungo ya kuonyesha kuwapo kwa namna ya kawaida katika Kiswahili.
- source_word: קָדֵשׁ
  choice: makahaba wa ibada
  rationale: Nomino ya umoja imetumiwa kwa maana ya kundi katika tungo hii ya kuwapo. Tafsiri hii inaonyesha uhusiano wao na desturi haramu za kingono katika ibada bila kutumia neno lenye maana za baadaye zisizodaiwa na Kiebrania.
- source_word: הָיָה בָאָרֶץ
  choice: kulikuwa na ... nchini
  rationale: Ni tungo ya kuonyesha kuwapo mahali; “nchini” ni Kiswahili cha asili na chenye ufupi.
- source_word: עָשׂוּ
  choice: Walitenda
  rationale: Kitenzi hiki kinahifadhi maana pana ya kufanya au kutenda, huku nomino inayofuata ikibeba uzito wa kimaadili.
- source_word: כְּכֹל הַתּוֹעֲבֹת
  choice: machukizo yote
  rationale: “Machukizo” huhifadhi uzito wa kidini na kimaadili wa תּוֹעֲבוֹת; muundo wa Kiswahili unaeleza kwamba walifuata matendo hayo yote.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu neno hilo linamaanisha jamii zisizo za Israeli zilizokaa Kanaani, bila kuingiza dhana za baadaye za “Wamataifa.”
- source_word: הוֹרִישׁ
  choice: alikuwa ameyafukuza
  rationale: Hifili ya ירש hapa inaonyesha kuwa wakazi wa awali waliondolewa na kupoteza milki yao; “kufukuza” ni wazi na ya kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano limeandikwa kwa namna ya kulitaja moja kwa moja badala ya kulibadilisha kuwa cheo.
- source_word: מִפְּנֵי
  choice: mbele ya
  rationale: Inahifadhi picha ya kuondolewa kutoka mbele au katika uwepo wa wana wa Israeli.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi muundo wa kifamilia wa Kiebrania, ambao pia ni msemo unaoeleweka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Maana ya קָדֵשׁ katika muktadha wa ibada haramu na matendo ya kingono
  choice: makahaba wa ibada
  alternative: makahaba wa kiume wa ibada; makahaba wa hekaluni
  rationale: Neno hilo linataja watu waliohusishwa na desturi za kingono za ibada iliyokatazwa. Tafsiri kuu haitumii neno linaloingiza utambulisho wa kingono wa baadaye, na tanbihi inahifadhi uwezekano kwamba neno linawalenga wanaume.
- issue: Uhusiano wa עָשׂוּ na הַתּוֹעֲבֹת
  choice: Walitenda machukizo yote
  alternative: Waliiga desturi zote za kuchukiza
  rationale: Tafsiri inahifadhi kitenzi kipana na uzito wa neno “machukizo” bila kufafanua kupita kiasi namna hasa walivyoiga mataifa.
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Msemo wa kifamilia wa chanzo umehifadhiwa, bila kudai kwamba rejeo hilo linahusu kila mtu wa Israeli bila tofauti.
- issue: Tafsiri ya יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Hii inawakilisha jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Nchini” na “walitenda” huweka sentensi katika mtindo wa asili bila kupunguza uzito wa hukumu ya kidini na kimaadili.
