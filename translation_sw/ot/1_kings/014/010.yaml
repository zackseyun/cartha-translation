  source_fidelity: 'The draft accurately conveys the judgment oracle, the disaster on Jeroboam''s house, the comprehensive removal of males, and the contemptuous dung simile. However, “Nitamkatilia mbali Yeroboamu kila mwanamume” is grammatically and semantically awkward in Swahili: it does not clearly express that the males are being removed from Jeroboam/his line. The revised wording makes that relationship explicit. The disputed phrase עָצוּר וְעָזוּב is rendered according to its likely totalizing sense while the footnote preserves the lexical uncertainty.'
