source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ אֶל בֵּ֣ית יָרָבְעָ֔ם וְ/הִכְרַתִּ֤י לְ/יָֽרָבְעָם֙ מַשְׁתִּ֣ין בְּ/קִ֔יר עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵ֑ל וּ/בִֽעַרְתִּי֙ אַחֲרֵ֣י בֵית יָרָבְעָ֔ם כַּ/אֲשֶׁ֛ר יְבַעֵ֥ר הַ/גָּלָ֖ל עַד תֻּמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/010.yaml
  text: Therefore[a], behold, I am bringing disaster on the house of Jeroboam, and I will cut off from Jeroboam every male, bond and free in Israel, and I will burn away after the house of Jeroboam[b], just as one burns away dung until it is all gone.
translation:
  language: sw
  text: Kwa hiyo, tazama, nitaleta maafa juu ya nyumba ya Yeroboamu. Nitaondoa katika ukoo wa Yeroboamu kila mwanamume[a], mtumwa na mtu huru[b], katika Israeli. Nitaifagilia mbali kabisa nyumba ya Yeroboamu, kama mtu afagiliavyo kinyesi mpaka kiishe kabisa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “anayekojoa ukutani,” nahau kali inayomaanisha mwanamume.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “aliyezuiwa na aliyeachwa.” Maana kamili ya msemo huu haijulikani kwa uhakika; huenda ni msemo wa kujumuisha wote, yaani, “mtumwa na mtu huru.”
    reason: lexical_alternative
  - marker: c
    text: Kitenzi kilichotafsiriwa “kuifagilia mbali” kinaweza pia kumaanisha “kuteketeza.” Mlinganisho wa kuondoa kinyesi unaonyesha kuondolewa kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: maafa
  rationale: Katika tamko hili la hukumu, neno hili linaonyesha janga au madhara yanayoletwa, si uovu wa kimaadili. “Maafa” ni Kiswahili cha kawaida chenye uzito unaofaa.
- source_word: וְהִכְרַתִּי
  choice: nitamkatilia mbali
  rationale: Kitenzi כרת katika muktadha wa hukumu kina wazo la kuondoa kabisa watu au ukoo. “Kumkatilia mbali” kinahifadhi nguvu ya nahau hiyo bila kuifafanua kupita kiasi.
- source_word: מַשְׁתִּין בְּקִיר
  choice: kila mwanamume
  rationale: Hii ni nahau kali ya Kiebrania inayowataja watu wa kiume. Maana yake imetolewa kwa Kiswahili cha kawaida, na picha halisi imehifadhiwa katika tanbihi.
- source_word: עָצוּר וְעָזוּב
  choice: aliyefungwa na aliyeachwa huru
  rationale: Jozi hii ya maneno si wazi kabisa, lakini inaonekana kuwa msemo unaokusudia kujumuisha wote bila kubakiza yeyote. Tafsiri hii inahifadhi jozi ya chanzo na tanbihi inaonyesha uwezekano mwingine.
- source_word: וּבִעַרְתִּי אַחֲרֵי בֵית יָרָבְעָם
  choice: Nitaifagilia mbali kabisa nyumba ya Yeroboamu
  rationale: Katika mlinganisho na kuondoa kinyesi, בער inaonyesha kuondoa au kusafisha kabisa. “Kuifagilia mbali” huendeleza picha hiyo kwa Kiswahili cha asili; tanbihi inaonyesha kuwa kitenzi kinaweza pia kumaanisha kuteketeza.
- source_word: הַגָּלָל
  choice: kinyesi
  rationale: Neno la chanzo ni la makusudi, lenye picha kali na ya kudharau. “Kinyesi” hakipunguzi ukali huo.
- source_word: עַד תֻּמּוֹ
  choice: mpaka kiishe kabisa
  rationale: Kirai hiki kinasisitiza kuondolewa kusikobakiza chochote. Tafsiri hii ni ya kawaida na wazi kwa msomaji wa Kiswahili.
theological_decisions:
- issue: Kuhifadhi ukali wa tamko la hukumu ya Mungu
  choice: 'Kutumia maneno ya moja kwa moja: “maafa,” “nitamkatilia mbali,” na “kinyesi”'
  alternative: Kulainisha kwa maneno kama “shida,” “nitawaondoa,” au “uchafu”
  rationale: Kiebrania kina lugha kali na ya kudharau kwa makusudi. Tafsiri haipaswi kupunguza uzito wa hukumu hiyo.
- issue: Maana ya jozi עָצוּר וְעָזוּב
  choice: Kuhifadhi jozi kama “aliyefungwa na aliyeachwa huru” na kueleza kutokuwa na uhakika katika tanbihi
  alternative: Kuitafsiri moja kwa moja kuwa “mtumwa na mtu huru” au kuifupisha kuwa “wote”
  rationale: Msemo huo huenda ukawa merizimu inayomaanisha wote, lakini maana sahihi ya sehemu zake inabishaniwa. Tanbihi huhifadhi utata wa kweli wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima, kimetumiwa. “Tazama” inadumisha mtindo wa tamko la kinabii; lugha kali ya chanzo imehifadhiwa bila kuwa ya kizamani. Alama zote za tanbihi zimewekwa mara baada ya maneno au vifungu vinavyohusika.
