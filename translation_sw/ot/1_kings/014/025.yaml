  text: In the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem.
translation:
  language: sw
  text: Katika mwaka wa tano wa Mfalme Rehoboamu, Shishaki, mfalme wa Misri, alipanda[a] dhidi ya Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi “alipanda” hapa ni nahau ya Kiebrania ya kusonga kijeshi kuelekea au dhidi ya mji; si lazima kirejelee kupanda mahali pa juu.
    reason: lexical_explanation
lexical_decisions:
- source_word: וַיְהִי
  choice: Katika ...
  rationale: Kiunganishi cha simulizi hakihitaji kutafsiriwa kwa neno tofauti hapa; sentensi ya wakati huanzisha tukio jipya kwa Kiswahili cha kawaida.
- source_word: בַּשָּׁנָה הַחֲמִישִׁית
  choice: Katika mwaka wa tano
  rationale: Hii ni kauli ya kawaida ya kutaja mwaka wa utawala, na tafsiri hii ni rasmi lakini ya asili.
- source_word: לַמֶּלֶךְ רְחַבְעָם
  choice: wa Mfalme Rehoboamu
  rationale: Lamed katika kauli hii ya tarehe hurejelea utawala wa Rehoboamu; Kiswahili huieleza kwa kawaida kwa muundo huu.
- source_word: עָלָה ... עַל
  choice: alikuja kuishambulia
  rationale: Katika muktadha wa kijeshi, kitenzi pamoja na kihusishi kinaonyesha kusonga dhidi ya mji. 'Alikuja kuishambulia' huonyesha mwelekeo na uhasama bila kudai kwamba shambulio lilifanikiwa.
- source_word: שושק
  choice: Shishaki
  rationale: Hufuata umbo la kawaida la jina hili katika mapokeo ya Biblia ya Kiswahili, likitegemea umbo la Kiebrania badala ya utambulisho wa kihistoria wa Kimisri.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: mfalme wa Misri
  rationale: Kirai cha uambatano kinatambulisha cheo cha Shishaki na nchi anayotawala.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida na linalotambulika la jina la mji katika Kiswahili.
