  text: וַ/יְהִ֛י מִ/דֵּי בֹ֥א הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה יִשָּׂאוּ/ם֙ הָֽ/רָצִ֔ים וֶ/הֱשִׁיב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/028.yaml
  text: And whenever the king entered the house of Yahweh[b][a], the guards would carry them and then return them to the guards’ chamber.
translation:
  language: sw
  text: Kila mara mfalme alipoingia katika nyumba ya Yahweh, walinzi[a] walizibeba ngao hizo[b], kisha wakazirudisha katika chumba cha walinzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wakimbiaji”; katika mazingira haya ya kifalme, neno hilo linamaanisha walinzi wa mfalme.'
    reason: lexical_alternative
  - marker: b
    text: Yaani, ngao za shaba ambazo Rehoboamu alitengeneza badala ya ngao za dhahabu zilizochukuliwa na Shishaki (tazama 1 Wafalme 14:27).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי מִדֵּי בֹא
  choice: Kila mara ... alipoingia
  rationale: Muundo מִדֵּי pamoja na jina-tendo unaonyesha tendo lililokuwa likirudiwa; Kiswahili hiki kinaonyesha wazi desturi ya kila wakati bila kutafsiri וַיְהִי kwa namna ngumu.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainisho humrejelea Rehoboamu katika muktadha; katika Kiswahili uainisho huo unaeleweka bila kiambishi tofauti cha 'the'.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Huhifadhi picha halisi ya Kiebrania ya 'nyumba' kwa hekalu na kulitaja jina la Mungu kama Yahweh.
- source_word: הָרָצִים
  choice: walinzi
  rationale: Ingawa maana ya msingi ni 'wakimbiaji,' katika mazingira ya kifalme neno hili huonyesha walinzi au walinzi wa mfalme; tanbihi huhifadhi maana halisi ya neno.
- source_word: יִשָּׂאוּם
  choice: walizibeba ngao hizo
  rationale: Kitenzi kinaonyesha kitendo cha kawaida kilichorudiwa. Kiambishi cha yambwa kinarejelea ngao za shaba za mstari uliotangulia; kutaja 'ngao hizo' kunafanya rejeo liwe wazi na linalopatana na ngeli ya Kiswahili.
- source_word: וֶהֱשִׁיבוּם
  choice: kisha wakazirudisha
  rationale: Hifili ya שוב ina maana ya kusababisha kitu kirudi au kukirudisha. 'Kisha' huonyesha mfuatano wa tendo bila kuongeza wazo lisilokuwapo.
- source_word: אֶל תָּא הָרָצִים
  choice: katika chumba cha walinzi
  rationale: תָּא ni chumba maalumu; 'chumba cha walinzi' ni usemi wa kawaida na huhifadhi uhusiano wa umilikaji katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja badala ya kubadilishwa kuwa cheo; jambo hili huhifadhi tofauti ya kimsamiati katika chanzo bila kuongeza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa 'kila mara ... alipoingia' unaonyesha desturi iliyojirudia, na 'ngao hizo' huondoa utata wa kiwakilishi bila kupoteza rejeo la mstari uliotangulia. Alama zote za tanbihi zimewekwa katika matini kuu.
