base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/013.yaml
  text: All Israel will mourn for him and bury him[a], because he alone of Jeroboam’s house will come to the grave, since in him something good toward Yahweh, the God of Israel[c][b], has been found in the house of Jeroboam.
translation:
  language: sw
  text: Israeli wote watamwombolezea na kumzika, kwa sababu ni yeye peke yake katika nyumba ya Yeroboamu atakayezikwa[a]. Kwa maana ndani yake limepatikana jambo jema[b] katika uhusiano na Yahweh[c], Mungu wa Israeli, katika nyumba ya Yeroboamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “yeye peke yake wa Yeroboamu atakuja kaburini”; maana yake ni kwamba yeye peke yake katika nyumba ya Yeroboamu atapata maziko.
    reason: lexical_alternative
  - marker: b
    text: Au “kitu chema.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “kuelekea Yahweh.” Hii inaweza kumaanisha mwelekeo au sifa njema inayomhusu Yahweh, au jambo jema katika uhusiano naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפְדוּ לוֹ
  choice: watamwombolezea
  rationale: Kitenzi ספד humaanisha kuomboleza kwa ajili ya mtu aliyekufa. “Kumwombolezea” ni lugha ya kawaida na yenye heshima katika Kiswahili.
- source_word: וְקָבְרוּ אֹתוֹ
  choice: na kumzika
  rationale: Kauli hii inataja moja kwa moja tendo la kumzika; mtendaji anaendelea kuwa “Israeli wote.”
- source_word: כִּי זֶה לְבַדּוֹ
  choice: kwa sababu yeye peke yake
  rationale: Inahifadhi msisitizo wa upekee wa mtoto huyu akilinganishwa na wengine wa nyumba ya Yeroboamu.
- source_word: יָבֹא לְיָרָבְעָם אֶל קָבֶר
  choice: wa nyumba ya Yeroboamu ndiye atakayeingia kaburini
  rationale: “Wa nyumba ya Yeroboamu” huonyesha uhusiano wa kifamilia au wa nasaba unaodokezwa na לְיָרָבְעָם, huku “ataingia kaburini” ikibaki karibu na taswira halisi ya Kiebrania.
- source_word: יַעַן
  choice: kwa maana
  rationale: Kiunganishi hiki kinaanzisha sababu ya hukumu iliyotangulia; “kwa maana” ni cha asili na wazi katika muktadha huu.
- source_word: נִמְצָא בוֹ
  choice: ndani yake limeonekana
  rationale: Kauli tendwa ya Kiebrania inaonyesha kuwa sifa hiyo njema imegunduliwa ndani yake; tafsiri hii hudumisha wazo hilo bila kueleza sifa yenyewe zaidi ya chanzo.
- source_word: דָּבָר טוֹב
  choice: jambo jema
  rationale: דָּבָר ni pana na isiyo bainifu hapa. “Jambo jema” huhifadhi upana huo badala ya kulifafanua kuwa tendo, tabia, au imani fulani.
- source_word: אֶל יְהוָה
  choice: kwa Yahweh
  rationale: “Kwa” huonyesha uhusiano au mwelekeo kuelekea Yahweh kwa Kiswahili cha kawaida, bila kuamua kabisa kama jambo hilo lilikuwa mwelekeo wa moyo au jambo lililompendeza Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahweh” badala ya kubadilishwa na cheo.
- source_word: בְּבֵית יָרָבְעָם
  choice: katika nyumba ya Yeroboamu
  rationale: “Nyumba” hapa inaweza kumaanisha familia, watu wa nyumbani, au nasaba; neno hilo linahifadhi maana hiyo ya kifalme na kifamilia.
theological_decisions:
- issue: Maana ya jambo jema lililokuwa אֶל־יְהוָה
  choice: jambo jema kwa Yahweh
  alternative: jambo jema linalompendeza Yahweh
  rationale: Kihusishi אֶל kinaweza kuonyesha mwelekeo au uhusiano na Yahweh. Tafsiri iliyochaguliwa haibani maana kuwa kibali cha Mungu pekee, wala hailazimishi kuwa ni hali ya moyo tu.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu; kulitaja kama “Yahweh” huhifadhi tofauti kati ya jina hilo na vyeo vya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi la kibiblia ulio wa sasa, wenye heshima, na unaoeleweka kwa wasomaji wa kawaida. “Kuombolezea,” “kuingia kaburini,” na “nyumba ya Yeroboamu” huhifadhi taswira na maana ya nasaba ya chanzo bila kuwa nzito kupita kiasi.
