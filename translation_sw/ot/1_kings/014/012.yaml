  text: But as for you[a], arise, go to your house. When your feet enter the city, the child will die.
translation:
  language: sw
  text: Lakini wewe, inuka, uende nyumbani kwako. Miguu yako itakapoingia mjini[a], mtoto atakufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri halisi, “miguu yako itakapoingia mjini.” Kiebrania kinatumia “miguu yako” kama nahau inayoonyesha wakati wa kuwasili kwako.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתְּ
  choice: Lakini wewe
  rationale: Kiunganishi pamoja na kiwakilishi huru cha nafsi ya pili, umoja, kike, kinaonyesha badiliko lenye mkazo kwa mwanamke anayesemeshwa; “Lakini wewe” huhifadhi utofautishaji huo.
- source_word: ק֖וּמִי
  choice: inuka
  rationale: Amri ya קום; “inuka” ni ya kawaida, yenye heshima, na inadumisha uzito wa agizo la kinabii.
- source_word: לְכִ֣י
  choice: uende
  rationale: Amri ya הלך; umbo “uende” linafuata kwa kawaida baada ya “inuka” katika Kiswahili.
- source_word: לְ/בֵיתֵ֑/ךְ
  choice: nyumbani kwako
  rationale: בַּיִת inaweza kumaanisha nyumba au nyumbani; katika muktadha wa kuelekea mahali anapoishi, “nyumbani kwako” ni Kiswahili cha kawaida na sahihi.
- source_word: בְּ/בֹאָ֥ה
  choice: itakapoingia
  rationale: ב pamoja na kitenzi-jina cha בוא huanzisha kishazi cha wakati; “itakapoingia” hudumisha wakati wa baadaye na maana ya kuwasili au kuingia.
- source_word: רַגְלַ֛יִ/ךְ
  choice: miguu yako
  rationale: Kiebrania kinataja miguu waziwazi kama nahau ya kuwasili. Taswira hiyo imehifadhiwa katika maandishi, huku tanbihi ikifafanua maana yake.
- source_word: הָ/עִ֖ירָ/ה
  choice: mjini
  rationale: Kiambishi cha mwelekeo kinaonyesha kwenda au kuingia ndani ya mji; “mjini” huwasilisha maana hiyo kwa ufupi na kwa kawaida.
- source_word: וּ/מֵ֥ת
  choice: atakufa
  rationale: Kitenzi kamilifu chenye kiunganishi katika unabii huu huonyesha matokeo ya baadaye; “atakufa” ni wazi na cha kawaida.
- source_word: הַ/יָּֽלֶד
  choice: mtoto
  rationale: יֶלֶד inaweza kuwa mtoto au mvulana; hapa jinsia haisisitizwi, hivyo “mtoto” linafaa zaidi.
