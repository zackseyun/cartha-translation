  text: And he will give up Israel because of the sins of Jeroboam[a], which he committed and by which he caused Israel to sin.
translation:
  language: sw
  text: Naye ataikabidhi Israeli[a] kwa sababu ya dhambi za Yeroboamu, alizotenda na kwa hizo aliisababisha Israeli kutenda dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri nyingine: “ataitoa Israeli.” Kitenzi cha Kiebrania maana yake ya msingi ni “kutoa,” lakini hapa, katika muktadha wa hukumu, kinamaanisha kuikabidhi Israeli kwenye maafa au mikononi mwa adui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֵּן
  choice: Naye ataikabidhi
  rationale: Kitenzi נתן kimsingi ni ‘kutoa,’ lakini katika muktadha huu wa hukumu kina maana ya kuikabidhi Israeli ipate maafa au itiwe mikononi mwa adui. ‘Ataikabidhi’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya hukumu bila kutaja chombo cha hukumu ambacho mstari huu haukitaji.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa limehifadhiwa; hapa linarejelea ufalme au watu wa Israeli kwa ujumla.
- source_word: בִּגְלַל
  choice: kwa sababu ya
  rationale: Kirai hiki kinaonyesha sababu; ‘kwa sababu ya’ ni usemi wazi na wa sasa.
- source_word: חַטֹּאות
  choice: dhambi
  rationale: Nomino iko katika wingi katika Kiebrania. Katika Kiswahili, ‘dhambi’ linaweza kuwa umoja au wingi kulingana na muktadha, na hapa ‘dhambi za Yeroboamu’ linaonyesha wingi.
- source_word: יָרָבְעָם
  choice: Yeroboamu
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: אֲשֶׁר חָטָא
  choice: alizotenda
  rationale: Kishazi hiki kinaeleza dhambi za Yeroboamu mwenyewe. ‘Dhambi ... alizotenda’ ni Kiswahili asilia na huhifadhi hatia yake binafsi.
- source_word: וַאֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: na ambazo kwa hizo aliifanya Israeli itende dhambi
  rationale: Muundo wa kusababisha wa חטא una maana ya ‘kusababisha kutenda dhambi.’ Tafsiri hii huhifadhi kwamba Yeroboamu mwenyewe alitenda dhambi na pia kwamba dhambi au matendo hayo yakawa njia ya kuifanya Israeli itende dhambi.
theological_decisions:
- issue: Utendaji wa Mungu katika hukumu
  choice: ataikabidhi Israeli
  alternative: ataitoa Israeli; ataiacha Israeli
  rationale: Kiebrania kinatangaza hukumu ya Mungu lakini hakitaji hapa adui au maafa maalumu yatakayotumiwa. ‘Ataikabidhi’ hudumisha uzito huo bila kuongeza mhusika ambaye hajatajwa.
- issue: Hatia ya Yeroboamu na ushawishi wake kwa Israeli
  choice: dhambi ... alizotenda na ambazo kwa hizo aliifanya Israeli itende dhambi
  alternative: dhambi alizofanya, na kwa kuwaongoza Israeli kutenda dhambi
  rationale: Kiebrania kinaweka pamoja hatia binafsi ya Yeroboamu na jukumu lake la kulisababisha taifa litende dhambi. Tafsiri haipunguzi maana ya kusababisha wala kuibadili kuwa ushawishi usio wa moja kwa moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo ‘aliifanya Israeli itende dhambi’ umechaguliwa ili kuhifadhi wazi maana ya kusababisha iliyomo katika Kiebrania.
