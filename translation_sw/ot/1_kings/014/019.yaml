  text: The rest of the acts of Jeroboam[a], how he fought and how he reigned, behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: sw
  text: Matendo mengine ya Yeroboamu[a], jinsi alivyopigana vita na jinsi alivyotawala, tazama,[b] yameandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “mambo mengine ya Yeroboamu.” Katika muundo huu wa habari za wafalme, “matendo” humaanisha mambo au shughuli zake zilizowekwa katika kumbukumbu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “tazama, yameandikwa,” usemi unaoelekeza fikira kwenye kumbukumbu iliyoandikwa.'
    reason: lexical_alternative
  - marker: c
    text: Yaani, kumbukumbu rasmi ya kifalme au hati ya kihistoria, wala si kitabu cha Biblia cha 1–2 Mambo ya Nyakati.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Matendo mengine
  rationale: Katika muundo huu wa kufunga habari za mfalme, maneno haya yanamaanisha mambo au matendo yake yaliyosalia kutajwa. “Matendo mengine” ni ya asili katika Kiswahili na yanafikisha maana ya kumbukumbu za utawala bila kutafsiri דִּבְרֵי kwa maana finyu ya “maneno.”
- source_word: אֲשֶׁר נִלְחַם
  choice: jinsi alivyopigana vita
  rationale: Kitenzi נלחם humaanisha kupigana au kufanya vita. Muundo wa “jinsi alivyopigana vita” unaeleza kwamba habari hizo zilihusu shughuli zake za kivita bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: וַאֲשֶׁר מָלָךְ
  choice: na jinsi alivyotawala
  rationale: מלך hapa humaanisha kutawala akiwa mfalme. Tafsiri hii inahifadhi usambamba na “jinsi alivyopigana vita.”
- source_word: הִנָּם כְּתוּבִים
  choice: tazama, yameandikwa
  rationale: הִנָּם ni usemi wa kuwasilisha na kuelekeza fikira za msomaji kwenye kumbukumbu inayofuata; “tazama” huhifadhi nguvu hiyo ya usemi. Ngeli ya “yameandikwa” inarejelea “matendo.”
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: katika Kitabu cha Mambo ya Nyakati
  rationale: Ingawa עַל kwa msingi ni “juu ya,” katika usemi wa kumbukumbu iliyoandikwa Kiswahili cha kawaida husema “katika kitabu.” דִּבְרֵי הַיָּמִים hapa ni kumbukumbu za matukio ya kifalme, hivyo “Mambo ya Nyakati” ni tafsiri ya kawaida na sahihi.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: za Wafalme wa Israeli
  rationale: Kihusishi ל katika jina hili kinaonyesha uhusiano wa kumbukumbu hizo na wafalme wa Israeli. “Za Wafalme wa Israeli” ni mtindo wa kawaida wa Kiswahili kwa jina la kumbukumbu hiyo.
