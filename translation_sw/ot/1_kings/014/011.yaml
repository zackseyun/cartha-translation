base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/011.yaml
  text: Anyone belonging to Jeroboam who dies in the city[a], the dogs will eat; and anyone who dies in the field, the birds of the sky will eat[b], for Yahweh has spoken.
translation:
  language: sw
  text: Mtu yeyote wa Yeroboamu atakayekufa mjini[a], mbwa watamla; na mtu yeyote wa Yeroboamu atakayekufa kondeni, ndege wa angani watamla[b], kwa maana Yahwe amesema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “aliyekufa wa Yeroboamu”; maana yake, mtu yeyote wa nyumba ya Yeroboamu anayekufa.'
    reason: lexical_alternative
  - marker: b
    text: Au “ndege wa mbinguni”; kwa mapokeo, “ndege wa hewani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְיָרָבְעָם
  choice: Mtu yeyote wa Yeroboamu atakayekufa
  rationale: Muundo huu unamaanisha kwa namna ya kigawanyo mtu yeyote aliye wa Yeroboamu, yaani wa nyumba au ukoo wake. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi uhusiano unaoonyeshwa na לְ bila kumaanisha Yeroboamu peke yake.
- source_word: בָּעִיר
  choice: mjini
  rationale: Ni usemi wa kawaida wa mahali unaolingana na maana ya ‘katika mji’ na unaweka wazi tofauti na kondeni.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: mbwa watamla
  rationale: Kitenzi אָכַל kimsingi ni ‘kula.’ ‘Watamla’ kinahifadhi picha kali ya Kiebrania bila kuongeza wazo la ‘kurarua’ au ‘kutafuna.’
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: na mtu yeyote atakayekufa kondeni
  rationale: Hili linafuata muundo wa kigawanyo wa kishazi cha kwanza. ‘Kondeni’ ni tafsiri ya asili ya שָׂדֶה katika utofautishaji huu na mji.
- source_word: עוֹף הַשָּׁמָיִם
  choice: ndege wa angani
  rationale: עוֹף ni nomino ya mkusanyiko kwa viumbe warukao, na הַשָּׁמָיִם hapa inaeleza anga. ‘Ndege wa angani’ ni Kiswahili cha sasa, wazi, na karibu na picha ya chanzo.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: kwa maana Yahwe amesema
  rationale: כִּי inatoa msingi na uhakika wa hukumu, hivyo ‘kwa maana’ inafaa. Wakati timilifu wa דִּבֵּר unaonyesha tamko lililotolewa kwa uthabiti, na ‘amesema’ linawasilisha hilo vizuri.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יְהוָה. ‘Yahwe’ linahifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mjini’ na ‘kondeni’ vinatoa utofautishaji wa asili na unaoeleweka kwa urahisi; urudiaji wa ‘mtu yeyote’ umehifadhiwa ili ulinganifu wa hukumu uwe wazi.
