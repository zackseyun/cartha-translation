  source_fidelity: 'Mabadiliko mawili yanahitajika kwa ulinganifu wa karibu na Kiebrania: אֲבֹתָיו katika fomula ya kifalme itafsiriwe “baba zake,” si “babu zake,” kwa kuwa “babu” kwa kawaida humaanisha grandparents katika Kiswahili cha sasa. Pia תַּחְתָּיו inaeleza urithi wa nafasi ya mtawala; “badala yake” huweka maana hiyo wazi zaidi kuliko “mahali pake.”'
  naturalness: Matini iliyorekebishwa inasikika kwa kawaida katika Kiswahili Sanifu cha Afrika Mashariki na inahifadhi mtindo wa taarifa ya kifo na urithi wa kifalme. “Naama, Mwamoni” ni ya asili kuliko “mwanamke Mwamoni”; tanbihi hufafanua jinsia ya kike inayobebwa na umbo la Kiebrania bila kuongeza maneno yasiyohitajika katika matini.
  terminology: “Mji wa Daudi,” “baba zake,” “akazikwa,” na “akatawala badala yake” zinaendana na msamiati wa kawaida wa Biblia na maana ya chanzo. “Mwamoni” hutambulisha utaifa; tanbihi hudumisha taarifa kwamba gentiliki ya Kiebrania ni ya kike. Majina “Naama” na “Abiyamu” yamehifadhiwa, huku tanbihi ikitaja umbo Abiya linalopatikana mahali pengine.
  issues:
  - severity: medium
    issue: “babu zake” kwa אֲבֹתָיו
    rationale: Neno la Kiebrania katika nahau hii ni “fathers,” likimaanisha mababu/waasisi wa ukoo wa kifalme. Katika Kiswahili cha sasa “babu zake” kwa urahisi husomwa kuwa grandparents wake; “baba zake” huhifadhi fomula ya kibiblia na upeo wake wa ukoo.
  - severity: low
    issue: “mahali pake” kwa תַּחְתָּיו
    rationale: Ingawa linaweza kueleweka kimuktadha, linaweza pia kumaanisha eneo la kimwili. “Badala yake” huwasilisha moja kwa moja urithi wa utawala uliokusudiwa na nahau ya chanzo.
  - severity: low
    issue: “mwanamke Mwamoni” si muundo wa kawaida zaidi
    rationale: “Naama, Mwamoni” ni fupi na ya asili; jinsia ya kike ya gentiliki ya Kiebrania inaelezwa kwa usahihi katika tanbihi.
