base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/031.yaml
  text: And Rehoboam slept with his fathers and was buried with his fathers in the city of David[a]. And his mother's name was Naamah the Ammonite[b]. And Abijam his son reigned in his place.
translation:
  language: sw
  text: Rehoboamu akalala pamoja na baba zake, akazikwa pamoja nao katika Mji wa Daudi. Mama yake aliitwa Naama, Mwamoni.[a] Kisha Abiyamu, mwanawe, akatawala badala yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinatumia umbo la kike la jina la utaifa, na hivyo kinamtambulisha wazi kuwa mwanamke wa Waamoni.
    reason: lexical_alternative
  - marker: b
    text: Katika vifungu vingine Abiyamu anaitwa Abiya; mstari huu unasoma “Abiyamu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: akalala pamoja na babu zake
  rationale: Huhifadhi nahau ya taarifa za vifo vya kifalme badala ya kuifafanua moja kwa moja kuwa ‘alikufa’; ‘babu zake’ ni Kiswahili cha kawaida kwa mababu wa ukoo.
- source_word: וַיִּקָּבֵר עִם אֲבֹתָיו
  choice: akazikwa pamoja nao
  rationale: Hutoa kitenzi cha Kiebrania kwa uwazi huku kiwakilishi ‘nao’ kikiepuka marudio mazito na kudumisha rejeo kwa babu zake.
- source_word: בְּעִיר דָּוִד
  choice: katika Mji wa Daudi
  rationale: Ni jina la mahali linalotambulika; herufi kubwa huonyesha kuwa ni eneo maalumu.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Ni Kiswahili cha sasa na cha asili kinachowasilisha kwa usahihi fomula ya kutaja jina la mama wa mfalme.
- source_word: נַעֲמָה הָעַמֹּנִית
  choice: Naama, mwanamke Mwamoni
  rationale: Kivumishi cha Kiebrania ni cha kike; ‘mwanamke Mwamoni’ huonyesha wazi jinsia na asili yake bila kutumia muundo wa kizamani.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika fomula ya urithi wa kifalme, neno hili linaeleza kutawala kama mfalme; muktadha unafanya maana hiyo iwe wazi.
- source_word: אֲבִיָּם
  choice: Abiyamu
  rationale: Hufuata umbo la jina lililo katika mstari huu, tofauti na Abiya linalopatikana katika vifungu vingine.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Huhifadhi nahau ya urithi wa kiti cha enzi, yaani kuchukua nafasi yake.
