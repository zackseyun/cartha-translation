base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/007.yaml
  text: 'Go and say to Jeroboam[a], ‘Thus says Yahweh[b], the God of Israel: Because I raised you up from among the people and made you ruler over my people Israel,’'
translation:
  language: sw
  text: 'Nenda ukamwambie Yeroboamu, ‘Yahwe, Mungu wa Israeli, asema hivi: Kwa kuwa nilikuinua[a] kutoka miongoni mwa watu na kukuweka kuwa mtawala[b] juu ya watu wangu Israeli,’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilikukweza.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kukuteua kuwa kiongozi.” Kiebrania kinasema kihalisi, “nikakupa kuwa mtawala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי אִמְרִי
  choice: Nenda ukamwambie
  rationale: Amri hizi mbili za umoja wa kike zinamwelekeza mke wa Ahiya aende na kufikisha ujumbe. Kiswahili hakionyeshi jinsia katika umbo la amri, na “ukamwambie” linaunganisha kwenda na kusema kwa njia ya kawaida.
- source_word: לְיָרָבְעָם
  choice: Yeroboamu
  rationale: Jina limetoholewa kwa tahajia inayotambulika katika Kiswahili.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Hii ni kauli rasmi ya mjumbe wa kinabii; “asema hivi” ni ya asili katika Kiswahili na inadumisha uzito wake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa umbo la Kiswahili badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo huu unatambulisha Yahwe kuwa Mungu wa Israeli kwa njia wazi na ya kawaida.
- source_word: יַעַן אֲשֶׁר
  choice: Kwa kuwa
  rationale: Inaonyesha sababu ya hukumu itakayotangazwa katika sentensi inayoendelea.
- source_word: הֲרִימֹתִיךָ
  choice: nilikuinua
  rationale: Inahifadhi sitiari ya kuinuliwa huku ikimaanisha kupandishwa cheo au mamlaka.
- source_word: מִתּוֹךְ הָעָם
  choice: kutoka miongoni mwa watu
  rationale: Inaonyesha kwamba Yeroboamu alichaguliwa kutoka ndani ya jamii ya watu.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: na kukuweka kuwa mtawala
  rationale: Kiebrania kinasema kihalisi “nikakutoa kuwa mtawala”; tafsiri hii ya Kiswahili inawasilisha kwa kawaida maana ya kupewa wadhifa na Mungu.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: juu ya watu wangu Israeli
  rationale: Inahifadhi mamlaka juu ya Israeli pamoja na kauli ya Mungu kwamba Israeli ni watu wake.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la Mungu; “Yahwe” hulihifadhi badala ya kuliweka kama cheo.
- issue: Maana ya נָגִיד katika muktadha wa utawala
  choice: mtawala
  alternative: kiongozi
  rationale: Neno linaonyesha mtu aliyewekwa katika mamlaka ya kutawala. “Mtawala” linaonyesha rasmi mamlaka hiyo bila kuongeza wazo lisilokuwamo la cheo maalumu cha kifalme.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kisasa lakini wenye hadhi. Alama za tanbihi [a] na [b] zimewekwa karibu na maneno yanayohusika. Mstari umeachwa ukiendelea kwa koma kwa sababu sentensi ya sababu inakamilishwa katika mstari unaofuata.
