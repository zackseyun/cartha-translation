id: 1KI.14.15
reference: 1 Kings 14:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִכָּ֨ה יְהוָ֜ה אֶת יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֨ר יָנ֣וּד הַ/קָּנֶה֮ בַּ/מַּיִם֒ וְ/נָתַ֣שׁ אֶת יִשְׂרָאֵ֗ל מֵ֠/עַל הָ/אֲדָמָ֨ה הַ/טּוֹבָ֤ה הַ/זֹּאת֙ אֲשֶׁ֤ר נָתַן֙ לַ/אֲב֣וֹתֵי/הֶ֔ם וְ/זֵרָ֖/ם מֵ/עֵ֣בֶר לַ/נָּהָ֑ר יַ֗עַן אֲשֶׁ֤ר עָשׂוּ֙ אֶת אֲשֵׁ֣רֵי/הֶ֔ם מַכְעִיסִ֖ים אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/015.yaml
  text: And Yahweh will strike Israel[a], as a reed sways in the water, and he will uproot Israel from this good land that he gave to their fathers, and scatter them beyond the River, because they made their Asherim[b], provoking Yahweh.
translation:
  language: sw
  text: Yahwe ataipiga Israeli, kama mwanzi unavyoyumba majini; ataing’oa Israeli kutoka katika nchi hii nzuri aliyowapa mababu zao, na kuwatawanya ng’ambo ya Mto[a], kwa sababu walitengeneza Asherim zao[b], huku wakimkasirisha Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ng’ambo ya Eufrate.” Katika muktadha huu, “Mto” ni Mto Eufrate.
    reason: cross_reference
  - marker: b
    text: 'Kiebrania: “Asherim zao”; yaani, vitu vya ibada vilivyohusishwa na mungu wa kike Ashera, ambavyo mara nyingi hufikiriwa kuwa nguzo za mbao au sanamu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכָּה
  choice: ataipiga
  rationale: Kitenzi katika muktadha huu wa unabii kina maana ya wakati ujao. ‘Ataipiga’ ni lugha ya kawaida na hudumisha wazo la hukumu ya Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: כַּאֲשֶׁר יָנוּד הַקָּנֶה בַּמַּיִם
  choice: kama mwanzi unavyoyumba majini
  rationale: ‘Mwanzi’ na ‘kuyumba’ zinawasilisha kwa Kiswahili cha kawaida picha ya mmea usio imara unaosogezwa majini.
- source_word: וְנָתַשׁ
  choice: ataing’oa
  rationale: Neno hili lina picha ya kung’oa kitu pamoja na mizizi yake; tafsiri hii inafaa kwa kuondolewa kwa Israeli nchini.
- source_word: הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: nchi hii nzuri
  rationale: Katika muktadha wa ahadi, אֲדָמָה ni nchi waliyopewa, si udongo tu.
- source_word: אֲשֶׁר נָתַן לַאֲבוֹתֵיהֶם
  choice: aliyowapa babu zao
  rationale: ‘Babu zao’ ni usemi wa Kiswahili unaoeleweka kwa mababa au watangulizi wa kale na unadumisha mwendelezo wa agano.
- source_word: וְזֵרָם
  choice: na kuwatawanya
  rationale: Kitenzi kinaeleza kuwatawanya au kuwaf dispersa watu; kiambishi cha wingi kinaifanya Israeli ieleweke hapa kama watu wake.
- source_word: מֵעֵבֶר לַנָּהָר
  choice: ng’ambo ya Mto
  rationale: Maandishi ya Kiebrania yanasema ‘Mto’; herufi kubwa inaonyesha jina la kimuktadha, huku tanbihi ikitambulisha Eufrate.
- source_word: יַעַן אֲשֶׁר
  choice: kwa sababu
  rationale: Huu ni uhusiano wa sababu, unaosemwa kwa uwazi na kwa kawaida kwa ‘kwa sababu’.
- source_word: עָשׂוּ אֶת אֲשֵׁרֵיהֶם
  choice: walijitengenezea nguzo zao za Ashera
  rationale: ‘Nguzo za Ashera’ ni tafsiri inayoeleweka ya vifaa vya ibada vilivyohusishwa na mungu wa kike Ashera; tanbihi inadumisha kutokuwa na uhakika kuhusu umbo lake hasa.
- source_word: מַכְעִיסִים אֶת יְהוָה
  choice: na hivyo kumkasirisha Yahwe
  rationale: Kirai hiki kinaonyesha kwamba matendo yao yalimchokoza Yahwe akasirike; ‘na hivyo’ huunganisha matokeo hayo kwa Kiswahili cha asili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu, kwa hiyo limetoholewa badala ya kubadilishwa kuwa cheo.
- issue: Mto unaorejelewa
  choice: Kudumisha ‘Mto’ katika matini na kutaja Eufrate katika tanbihi
  alternative: ng’ambo ya Eufrate
  rationale: Hii huhifadhi usemi wa Kiebrania huku ikimsaidia msomaji wa sasa kutambua mto unaokusudiwa.
- issue: Maana ya אֲשֵׁרֵיהֶם
  choice: nguzo zao za Ashera
  alternative: vitu vyao vya ibada vya Ashera; sanamu zao za Ashera
  rationale: Neno linaashiria vifaa vya ibada vinavyohusishwa na Ashera, lakini umbo lake hasa halina uhakika katika kila muktadha. Tafsiri iliyozoeleka imetumiwa, na tahadhari hiyo imewekwa tanbihini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa unabii na picha za kupigwa, kuyumba, kung’olewa, na kutawanywa zimehifadhiwa. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
