  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וָ/אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מִ/בֵּ֣ית דָּוִ֔ד וָ/אֶתְּנֶ֖/הָ לָ֑/ךְ וְ/לֹֽא הָיִ֜יתָ כְּ/עַבְדִּ֣/י דָוִ֗ד אֲשֶׁר֩ שָׁמַ֨ר מִצְוֺתַ֜/י וַ/אֲשֶׁר הָלַ֤ךְ אַחֲרַ/י֙ בְּ/כָל לְבָב֔/וֹ לַ/עֲשׂ֕וֹת רַ֖ק הַ/יָּשָׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/008.yaml
  text: and I tore the kingdom away from the house of David and gave it to you[a]. But you have not been like my servant David, who kept my commandments and who walked after me with all his heart[b], to do only what was right in my eyes.
translation:
  language: sw
  text: Niliurarua ufalme kutoka katika nyumba ya Daudi[a] nikakupa. Lakini hukuwa kama mtumishi wangu Daudi, ambaye alizishika amri zangu na alinifuata[b] kwa moyo wake wote, akifanya tu yaliyo sawa machoni pangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba ya Daudi” hapa ni ukoo wa kifalme wa Daudi.
    reason: cultural_note
  - marker: b
    text: Kiebrania husema kwa neno halisi, “alitembea baada yangu”; yaani, “alinifuata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְרַע
  choice: Niliurarua
  rationale: Kitenzi hiki huhifadhi taswira halisi ya kurarua, inayosisitiza kuondolewa kwa nguvu kwa ufalme.
- source_word: הַמַּמְלָכָה
  choice: ufalme
  rationale: Hapa neno linamaanisha eneo na utawala wa kifalme; “ufalme” ni tafsiri ya kawaida na ya asili.
- source_word: מִבֵּית דָּוִד
  choice: kutoka katika nyumba ya Daudi
  rationale: Inahifadhi nahau ya Kiebrania “nyumba ya Daudi,” yaani ukoo wake wa kifalme, bila kuweka ufafanuzi huo moja kwa moja katika matini.
- source_word: וָאֶתְּנֶהָ לָךְ
  choice: na kukupa wewe
  rationale: Inasimulia tendo la wakati uliopita; kiwakilishi kisichotajwa wazi katika Kiswahili kinarejelea ufalme.
- source_word: עַבְדִּי
  choice: mtumishi wangu
  rationale: Katika muktadha huu ni jina la heshima linaloeleza huduma ya Daudi kwa Mungu, si hasa hali ya utumwa.
- source_word: שָׁמַר מִצְוֺתַי
  choice: alizishika amri zangu
  rationale: “Kushika amri” ni Kiswahili cha kawaida kinachoonyesha kuzitii na kuzifuata.
- source_word: הָלַךְ אַחֲרַי
  choice: kuniandama
  rationale: “Kuniandama” huwasilisha kwa kawaida maana ya kumfuata Mungu, huku tanbihi ikihifadhi taswira halisi ya kutembea nyuma yake.
- source_word: בְּכָל לְבָבוֹ
  choice: kwa moyo wake wote
  rationale: Ni nahau ya kawaida inayoonyesha kujitoa kwa moyo usiogawanyika.
- source_word: לַעֲשׂוֹת רַק הַיָּשָׁר
  choice: akifanya tu yaliyo sawa
  rationale: Muundo huu ni wa asili katika Kiswahili na unahifadhi msisitizo wa רַק, “tu/pekee.”
- source_word: בְּעֵינָי
  choice: machoni pangu
  rationale: Inahifadhi nahau ya Kiebrania inayowasilisha tathmini ya Mungu kwa lugha inayoeleweka katika Kiswahili.
theological_decisions:
- issue: Daudi kutajwa kuwa mfano mwaminifu licha ya dhambi zake zinazosimuliwa kwingine
  choice: Kauli ya mstari kuhusu Daudi imeachwa bila kuwekewa masharti.
  alternative: Kuongeza maneno kama “kwa ujumla” au “kwa sehemu kubwa.”
  rationale: Mstari huu wenyewe unamlinganisha Daudi na Yeroboamu na kusema kwamba alishika amri za Mungu na kufanya yaliyo sawa machoni pake. Kuongeza sifa za kupunguza kauli kungeondoa mvutano wa kitheolojia uliopo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira za “kuurarua ufalme” na “machoni pangu” zimehifadhiwa; nahau isiyo ya kawaida zaidi ya kutembea nyuma ya Mungu imetafsiriwa kwa “kuniandama” na kufafanuliwa katika tanbihi. Alama za tanbihi zimerekebishwa ili kila moja ifuate kirai inachokifafanua.
