base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/023.yaml
  text: They too built for themselves high places[a], pillars, and Asherah poles on every high hill and under every green tree.
translation:
  language: sw
  text: Wao pia wakajijengea mahali pa juu pa ibada, nguzo za ibada, na nguzo za Ashera[a] juu ya kila kilima kirefu na chini ya kila mti wenye majani mabichi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Maashera” au “vitu vya ibada vya Ashera”; neno la Kiebrania linataja vitu vya ibada vilivyohusishwa na Ashera, lakini aina yake hasa haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: wakajijengea
  rationale: Kitenzi בנה kimsingi ni ‘kujenga’; umbo la Kiswahili lenye ‘-ji-’ pamoja na muktadha linaonyesha kwamba walijenga vitu hivyo kwa matumizi yao wenyewe.
- source_word: גַם הֵמָּה
  choice: Wao pia
  rationale: Huhifadhi msisitizo na maana ya nyongeza, huku ikiunganisha tendo hili na dhambi zilizotajwa kabla.
- source_word: לָהֶם
  choice: -jijengea
  rationale: Kiambishi cha kujirejelea na kutendea kinaeleza kwa Kiswahili cha kawaida kwamba walijenga mahali hivyo kwa ajili yao wenyewe.
- source_word: בָּמוֹת
  choice: mahali pa juu pa ibada
  rationale: ‘Mahali pa juu’ huhifadhi picha ya neno la Kiebrania, na ‘pa ibada’ huweka wazi kwamba haya yalikuwa maeneo ya kidini, si maeneo ya kawaida yaliyo juu.
- source_word: מַצֵּבוֹת
  choice: nguzo za ibada
  rationale: Neno hili linamaanisha mawe yaliyosimamishwa kwa kusudi la kidini; ‘nguzo za ibada’ ni wazi na halidokezi kwamba zilikuwa sehemu za kawaida za jengo.
- source_word: אֲשֵׁרִים
  choice: nguzo za Ashera[a]
  rationale: Katika orodha hii neno linaelekea kumaanisha vitu vya ibada vilivyohusishwa na Ashera. Tafsiri hii huhifadhi jina Ashera, huku tanbihi ikitaja kutokuwa na uhakika kuhusu umbo kamili la vitu hivyo.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: juu ya kila kilima kirefu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa kijiografia wenye nguvu ya ujumla.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: na chini ya kila mti wenye majani mabichi
  rationale: רַעֲנָן huonyesha ubichi na ustawi wa majani; usemi huu ni wa asili katika Kiswahili na huhifadhi taswira ya miti yenye uhai mwingi.
theological_decisions:
- issue: Ikiwa אֲשֵׁרִים inamaanisha mungu wa kike Ashera mwenyewe au vitu vya ibada vilivyohusishwa naye
  choice: vitu vya ibada vilivyotafsiriwa ‘nguzo za Ashera’
  alternative: Maashera; sanamu za Ashera; miti mitakatifu
  rationale: Kwa kuwa neno limo pamoja na mahali pa juu na nguzo za ibada, uwezekano mkubwa ni kwamba linataja vitu halisi vya ibada. Jina ‘Ashera’ linadumisha uhusiano wake wa kidini, na tanbihi hailazimishi hitimisho kuhusu umbo au nyenzo zake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mahali pa juu pa ibada’ na ‘nguzo za ibada’ vinafafanua istilahi za kidini bila kutumia lugha nzito kupita kiasi. Muundo wa aya unabaki mfupi na wenye mfuatano wa maandishi ya Kiebrania.
