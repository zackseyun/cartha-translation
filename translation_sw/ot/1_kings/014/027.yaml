base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/027.yaml
  text: So King Rehoboam made bronze shields in their place and committed them into the hand of the commanders of the runners[b][a], who guarded the entrance of the king’s house.
translation:
  language: sw
  text: Basi Mfalme Rehoboamu akatengeneza ngao za shaba badala ya zile, akazikabidhi kwa wakuu wa wakimbiaji[a], waliokuwa wakilinda lango la nyumba ya mfalme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri yenye ufafanuzi zaidi, “wakuu wa walinzi.” Kiebrania kinasema moja kwa moja “wakuu wa wakimbiaji,” ambao huenda walikuwa kikosi cha walinzi wa mfalme au wajumbe wake.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya mfalme” hapa ni ikulu ya mfalme.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akatengeneza
  rationale: Kitenzi עשה hapa kina maana ya kutengeneza au kufanya; “akatengeneza” kinaeleza wazi utengenezaji wa ngao.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: Mfalme Rehoboamu
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na huhifadhi cheo pamoja na jina.
- source_word: תַּחְתָּם
  choice: badala ya zile
  rationale: Kiambishi cha wingi kinarejelea ngao za dhahabu zilizotajwa katika mstari uliotangulia; “zile” huonyesha rejeo hilo bila kuliongeza ndani ya mstari.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: ngao za shaba
  rationale: נְחֹשֶׁת inaweza kumaanisha shaba au bronzi; “shaba” ni neno la kawaida na linaloeleweka katika Kiswahili kwa metali hii ya kale.
- source_word: וְהִפְקִיד עַל יַד
  choice: akazikabidhi kwa
  rationale: Muundo huu una maana ya kuweka kitu chini ya uangalizi au mamlaka ya mtu; “akazikabidhi kwa” ni wa asili katika Kiswahili na huhifadhi dhana ya kuwapa jukumu la kuzitunza.
- source_word: שָׂרֵי הָרָצִים
  choice: wakuu wa wakimbiaji
  rationale: Hili huhifadhi maana ya moja kwa moja ya Kiebrania badala ya kuamua kimyakimya kwamba kikosi hicho kilikuwa walinzi tu; tanbihi inaeleza kazi inayowezekana.
- source_word: הַשֹּׁמְרִים
  choice: waliokuwa wakilinda
  rationale: Muundo huu huonyesha wajibu wao uliokuwa ukiendelea, kama inavyodokezwa na participio ya Kiebrania.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: lango la nyumba ya mfalme
  rationale: “Lango” linaeleza sehemu ya kuingilia, huku “nyumba ya mfalme” ikihifadhi usemi halisi wa Kiebrania; tanbihi inafafanua kuwa ni ikulu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Tafsiri imedumisha usemi wa Kiebrania “wakimbiaji” na “nyumba ya mfalme,” huku tanbihi zikitoa ufafanuzi wa kihistoria na kimuktadha.
