base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/006.yaml
  text: And when Ahijah heard the sound of her feet as she came in at the doorway[a], he said, “Come in, wife of Jeroboam[b]. Why are you disguising yourself? For I am sent to you with a hard message.”
translation:
  language: sw
  text: Ikawa Ahija aliposikia sauti ya miguu yake alipokuwa akiingia mlangoni, akasema, “Ingia, mke wa Yeroboamu. Kwa nini unajifanya usitambulike?[a] Nami nimetumwa kwako na ujumbe mzito.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa nini unajifanya kuwa mtu mwingine?”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno moja, “nimetumwa kwako [jambo] zito.” Kiebrania hakitaji nomino; maana yake ni ujumbe au habari nzito.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל רַגְלֶיהָ
  choice: sauti ya miguu yake
  rationale: Tafsiri hii inahifadhi taswira halisi ya Kiebrania na inaeleweka kwa Kiswahili; ‘sauti ya hatua zake’ pia ingewezekana lakini ni tafsiri laini zaidi.
- source_word: בָּאָה בַפֶּתַח
  choice: alipokuwa akiingia mlangoni
  rationale: Inaonyesha tendo lililokuwa likiendelea Ahija aliposikia, huku פֶּתַח ikieleweka kama sehemu ya kuingilia, yaani mlangoni.
- source_word: בֹּאִי
  choice: Ingia
  rationale: Ni amri ya kike katika Kiebrania; Kiswahili hakitofautishi jinsia katika umbo hili, na ‘Ingia’ ni ya kawaida na ya moja kwa moja.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: mke wa Yeroboamu
  rationale: Inahifadhi wazi uhusiano wa muundo wa Kiebrania na inafaa katika usemi wa moja kwa moja.
- source_word: לָמָּה זֶּה אַתְּ מִתְנַכֵּרָה
  choice: Kwa nini unajifanya usitambulike?
  rationale: Kitenzi cha Kiebrania hapa kinamaanisha kujibadili ili usitambuliwe au kuonekana kuwa mtu mwingine; uchaguzi huu unaendana na muktadha bila kufafanua kupita kiasi namna ya kujisitiri.
- source_word: שָׁלוּחַ אֵלַיִךְ
  choice: nimetumwa kwako
  rationale: Umbo la kutendwa linaonyesha hali inayotokana na kutumwa. ‘Nimetumwa’ ni Kiswahili cha kawaida na hakimtaji mtumaji ambaye hajatajwa katika kishazi hiki.
- source_word: קָשָׁה
  choice: na ujumbe mzito
  rationale: Kivumishi kimesimama bila nomino katika Kiebrania. ‘Ujumbe mzito’ huwasilisha habari kali au yenye kuhuzunisha kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi udondoshaji wa nomino katika chanzo.
theological_decisions:
- issue: Nomino iliyodokezwa baada ya קָשָׁה (‘nzito/kali’)
  choice: Kukamilisha kwa ‘ujumbe mzito’
  alternative: ‘habari kali’ au tafsiri sisisi ‘nimetumwa kwako yaliyo mazito’
  rationale: Kiebrania hakitaji nomino, lakini muktadha wa kinabii unaonyesha jambo zito ambalo Ahija ametumwa kumwambia. ‘Ujumbe’ ni nyongeza ya kiwango cha chini inayofanya Kiswahili kiwe wazi bila kuita jambo hilo rasmi ‘unabii’ au ‘hukumu’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ikawa’ inadumisha mtiririko wa kisimulizi wa וַיְהִי bila kufanya sentensi kuwa ngumu; majina yametolewa kama Ahija na Yeroboamu kwa mazoea ya Biblia za Kiswahili.
