  text: וַ/תָּ֣רַע לַ/עֲשׂ֔וֹת מִ/כֹּ֖ל אֲשֶׁר הָי֣וּ לְ/פָנֶ֑י/ךָ וַ/תֵּ֡לֶךְ וַ/תַּעֲשֶׂה לְּ/ךָ֩ אֱלֹהִ֨ים אֲחֵרִ֤ים וּ/מַסֵּכוֹת֙ לְ/הַכְעִיסֵ֔/נִי וְ/אֹתִ֥/י הִשְׁלַ֖כְתָּ אַחֲרֵ֥י גַוֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/009.yaml
  text: and have done evil above all who were before you. You went and made for yourself other gods and molten images to provoke me to anger[a], and you have cast me behind your back.
translation:
  language: sw
  text: Umetenda maovu kuliko wote waliokutangulia. Ukaenda ukajitengenezea miungu mingine na sanamu za kusubu[a] ili kunikasirisha, nawe umenitupa nyuma ya mgongo wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanamu za metali iliyoyeyushwa.” Neno la Kiebrania hurejelea sanamu iliyotengenezwa kwa kusubu, mara nyingi ya metali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרַע לַעֲשׂוֹת מִכֹּל
  choice: Umetenda maovu kuliko wote
  rationale: Muundo huu unaonyesha kutenda uovu pamoja na ulinganisho unaoletwa na מִכֹּל; “kuliko wote” ni Kiswahili cha kawaida na sahihi.
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: waliokutangulia
  rationale: 'לְפָנֶיךָ hapa ina maana ya wakati: wale waliokuwa kabla yake, si waliokuwa mbele yake mahali.'
- source_word: וַתֵּלֶךְ וַתַּעֲשֶׂה לְּךָ
  choice: Ukaenda ukajitengenezea
  rationale: “Ukaenda” huhifadhi msisitizo wa mfuatano wa Kiebrania, na kiambishi “-ji-” pamoja na “-ea” huwasilisha tendo lililofanywa kwa ajili yake mwenyewe.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hili ni neno la moja kwa moja la agano kwa miungu isiyoruhusiwa; “ya kigeni” ingeongeza wazo lisilotajwa wazi hapa.
- source_word: וּמַסֵּכוֹת
  choice: sanamu za kusubu
  rationale: מַסֵּכָה ni sanamu iliyotengenezwa kwa kumimina kitu kilichoyeyushwa katika kalibu; “kusubu” huhifadhi maana ya njia ya utengenezaji.
- source_word: לְהַכְעִיסֵנִי
  choice: ili kunikasirisha
  rationale: Huwasilisha kusababisha hasira na kuhifadhi nafsi ya kwanza iliyo kiambishi cha yambwa katika Kiebrania.
- source_word: וְאֹתִי הִשְׁלַכְתָּ אַחֲרֵי גַוֶּךָ
  choice: nawe umenitupa nyuma ya mgongo wako
  rationale: Huhifadhi taswira kali ya kumkataa Mungu kwa dharau badala ya kuibadili kuwa maelezo yasiyo na picha kama “umenipuuza.”
theological_decisions:
- issue: Kudumisha uzito wa lugha ya ibada ya sanamu
  choice: miungu mingine na sanamu za kusubu
  alternative: miungu ya kigeni na sanamu
  rationale: Tafsiri inabaki na kundi la kitheolojia la “miungu mingine” na pia vitu halisi vya ibada vilivyotengenezwa kwa kusubu, bila kuvijumlisha vyote chini ya neno la jumla “sanamu.”
- issue: Kuhifadhi sitiari ya kumkataa Mungu
  choice: umenitupa nyuma ya mgongo wako
  alternative: umenipuuza
  rationale: Kiebrania kina sitiari halisi na kali ya mwili. Tafsiri huihifadhi bila kupunguza ukali wake au kuifafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Sanamu za kusubu” ni sahihi lakini huenda si neno linalofahamika kwa kila msomaji, kwa hiyo limefafanuliwa katika tanbihi. Muundo “nyuma ya mgongo wako” umehifadhiwa kwa makusudi ili kuonyesha taswira ya Kiebrania.
