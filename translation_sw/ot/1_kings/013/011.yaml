  text: וְ/נָבִ֤יא אֶחָד֙ זָקֵ֔ן יֹשֵׁ֖ב בְּ/בֵֽית אֵ֑ל וַ/יָּב֣וֹא בְנ֡/וֹ וַ/יְסַפֶּר ל֣/וֹ אֶת כָּל הַ/מַּעֲשֶׂ֣ה אֲשֶׁר עָשָׂה֩ אִישׁ הָ/אֱלֹהִ֨ים הַ/יּ֜וֹם בְּ/בֵֽית אֵ֗ל אֶת הַ/דְּבָרִים֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל הַ/מֶּ֔לֶךְ וַֽ/יְסַפְּר֖וּ/ם לַ/אֲבִי/הֶֽם־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/011.yaml
  text: An old prophet was living in Bethel[a], and his sons came and told him all the deed that the man of God had done that day in Bethel, and the words that he had spoken to the king[b]; they told them to their father.
translation:
  language: sw
  text: Nabii mzee mmoja[a] alikuwa akiishi Betheli. Mwanawe akaja akamsimulia tendo lote ambalo mtu wa Mungu alikuwa amelifanya siku hiyo huko Betheli, pamoja na maneno aliyokuwa amemwambia mfalme; nao wakamsimulia baba yao mambo hayo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nabii fulani mzee.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinabadilika kutoka umoja (“mwanawe akaja akamsimulia”) kwenda wingi (“nao wakamsimulia baba yao”). Huenda hii inadokeza kwamba alikuwa na zaidi ya mwana mmoja, au ni hali isiyo ya kawaida katika maandishi au simulizi. Tafsiri imehifadhi badiliko hilo badala ya kulisawazisha.
    reason: textual_variant
lexical_decisions:
- source_word: נָבִיא אֶחָד זָקֵן
  choice: Nabii mmoja mzee
  rationale: Neno אֶחָד linaweza kuonyesha mtu mmoja asiyeainishwa, yaani “mmoja” au “fulani.” “Nabii mmoja mzee” ni Kiswahili cha kawaida na huhifadhi hali hiyo ya kutotajwa jina.
- source_word: יֹשֵׁב בְּבֵית־אֵל
  choice: alikuwa akiishi Betheli
  rationale: Ingawa יֹשֵׁב kimsingi linaweza kumaanisha kukaa, katika simulizi hili linaonyesha makazi ya kudumu; “akiishi” huwasilisha maana hiyo kwa njia ya asili.
- source_word: וַיָּבֹא בְנוֹ
  choice: Mwanawe akaja
  rationale: בְנוֹ ni umbo la umoja, kwa hiyo tafsiri inadumisha “mwanawe” badala ya kulipatanisha kimya kimya na wingi unaotokea mwishoni mwa aya.
- source_word: וַיְסַפֶּר לוֹ
  choice: akamsimulia
  rationale: Kitenzi ספר katika piel humaanisha kusimulia au kutoa taarifa kwa mpangilio; “akamsimulia” kinafaa katika muktadha huu wa taarifa ya matukio.
- source_word: אֶת כָּל הַמַּעֲשֶׂה
  choice: tendo lote
  rationale: מַעֲשֶׂה ni umoja na hapa linarejelea kwa ujumla tendo la maana la mtu wa Mungu. “Tendo lote” huhifadhi umoja huo.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hiki ni cheo cha kawaida cha kinabii katika vitabu vya kihistoria, na “mtu wa Mungu” ndilo sawazisho lililo wazi na la kawaida katika Kiswahili.
- source_word: הַיּוֹם
  choice: siku hiyo
  rationale: Katika simulizi la wakati uliopita, “siku hiyo” ni ya asili zaidi kuliko “leo” na huhifadhi rejeleo la wakati.
- source_word: אֶת הַדְּבָרִים אֲשֶׁר דִּבֶּר אֶל הַמֶּלֶךְ
  choice: pamoja na maneno aliyokuwa amemwambia mfalme
  rationale: “Maneno” huhifadhi דְּבָרִים na kutenganisha wazi ujumbe wa kinabii na tendo lililotajwa kabla yake.
- source_word: וַיְסַפְּרוּם לַאֲבִיהֶם
  choice: nao wakamsimulia baba yao mambo hayo
  rationale: Kitenzi na viambishi vya Kiebrania hapa ni vya wingi. “Nao wakamsimulia” huhifadhi badiliko hilo kutoka umoja kwenda wingi, huku “mambo hayo” kikionyesha kiambishi cha yambwa cha wingi kwa Kiswahili kinachoeleweka.
