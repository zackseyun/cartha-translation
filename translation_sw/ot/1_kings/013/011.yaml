  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na wenye heshima. Muundo wa umoja kisha wingi umehifadhiwa kwa makusudi kwa sababu unatokana na maandishi ya Kiebrania; tanbihi inaueleza bila kuutatua kwa lazima.
