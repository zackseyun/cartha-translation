base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/024.yaml
  text: And he went[a], and a lion found him on the road and killed him. And his corpse was cast on the road, and the donkey was standing beside it, and the lion was standing beside the corpse.
translation:
  language: sw
  text: Naye akaenda, simba akamkuta njiani na kumuua. Maiti yake ilikuwa imetupwa[a] njiani; punda alikuwa amesimama kando ya maiti hiyo, na simba alikuwa amesimama kando ya maiti hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maiti yake ilikuwa imelala ikiwa imetupwa njiani.” Umbo la Kiebrania linasisitiza kwamba maiti ilikuwa imetupwa au kuangushwa hapo, si kwamba ilikuwa imelala hapo tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Naye akaenda
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa kawaida katika Kiswahili bila kufafanua kupita kiasi uhusiano wa tukio hili na lililotangulia.
- source_word: וַיִּמְצָאֵהוּ
  choice: akamkuta
  rationale: Katika tukio la kukutana njiani, “akamkuta” ni tafsiri ya kawaida na ya moja kwa moja ya מצא.
- source_word: אַרְיֵה
  choice: simba
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mnyama anayetajwa; kutokuwapo kwa kibainishi katika Kiswahili kunafaa kutajwa kwake kwa mara ya kwanza.
- source_word: בַּדֶּרֶךְ
  choice: njiani
  rationale: “Njiani” ni usemi wa kawaida wa Kiswahili katika muktadha wa safari na unadumishwa katika sehemu zote mbili za aya.
- source_word: וַיְמִיתֵהוּ
  choice: na kumuua
  rationale: Hifili ya מות ina maana ya kusababisha afe; “kumuua” ni tafsiri wazi na ya kawaida.
- source_word: נִבְלָתוֹ
  choice: maiti yake
  rationale: “Maiti” hutaja mwili wa mtu aliyekufa kwa lugha yenye staha na inafaa kuliko maneno yanayotumiwa zaidi kwa mzoga wa mnyama.
- source_word: מֻשְׁלֶכֶת
  choice: ilikuwa imetupwa
  rationale: Tafsiri hii inadumisha hali ya kutendwa ya umbo la Kiebrania na inaonyesha kwamba maiti ilikuwa imeangushwa au kutupwa hapo, si kwamba ilikuwa imelala tu.
- source_word: וְהַחֲמוֹר עֹמֵד אֶצְלָהּ
  choice: punda alikuwa amesimama kando yake
  rationale: “Alikuwa amesimama” huonyesha hali inayoendelea ya kielezi-tendo עֹמֵד, na “kando yake” hurejelea maiti.
- source_word: וְהָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: na simba alikuwa amesimama kando ya maiti hiyo
  rationale: Muundo huu hudumisha taswira tulivu ya simulizi na kurudia wazi neno “maiti” kama Kiebrania kinavyofanya.
