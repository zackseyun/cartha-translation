  text: And he said[a], “I cannot return with you or go with you, and I will not eat bread or drink water with you in this place.”
translation:
  language: sw
  text: Naye akasema[a], “Siwezi kurudi pamoja nawe wala kwenda pamoja nawe; wala sitakula mkate wala kunywa maji pamoja nawe mahali hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, maneno mawili ya kwanza yanayotafsiriwa “pamoja nawe” yana kiambishi cha nafsi ya pili ya kike, lakini lile linalohusu kula na kunywa lina kiambishi cha nafsi ya pili ya kiume. Kiswahili hakionyeshi tofauti hiyo ya kijinsia katika “nawe.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Naye akasema
  rationale: Wayyiqtol ya kawaida ya masimulizi huendeleza simulizi na kutambulisha usemi wa moja kwa moja; ‘Naye akasema’ ni ya asili na yenye heshima katika Kiswahili.
- source_word: לֹא אוּכַל
  choice: Siwezi
  rationale: Kitenzi יכל kilichokanushwa huonyesha kutoweza; ‘Siwezi’ kinatoa maana hiyo moja kwa moja.
- source_word: לָשׁוּב
  choice: kurudi
  rationale: שׁוב hapa humaanisha kurudi au kugeuka na kwenda nyuma; ‘kurudi’ linafaa kwa mwaliko wa kuandamana na msemaji.
- source_word: אִתָּךְ / אִתְּךָ
  choice: pamoja nawe
  rationale: Kirai hiki hutafsiri uandamani kwa Kiswahili cha kawaida. Kiebrania hubadili kiambishi kutoka nafsi ya pili ya kike hadi ya kiume, tofauti ambayo haiwezi kuonyeshwa kawaida katika ‘nawe’.
- source_word: וְלָבוֹא
  choice: wala kwenda
  rationale: בוא linaweza kumaanisha kuja, kwenda, au kuingia kulingana na mtazamo. Katika muktadha huu, ‘kwenda pamoja nawe’ ni ya asili bila kuongeza wazo la kuingia ambalo halilazimishwi na maandishi.
- source_word: וְלֹא אֹכַל לֶחֶם
  choice: wala sitakula mkate
  rationale: ‘Mkate’ limehifadhiwa badala ya ‘chakula’ ili kudumisha usemi halisi na unaorudiwa katika kifungu hiki.
- source_word: וְלֹא אֶשְׁתֶּה ... מַיִם
  choice: au kunywa maji
  rationale: ‘Au’ huunganisha kwa kawaida vitu viwili vilivyokanushwa baada ya ‘sitakula,’ huku ‘maji’ likihifadhi maana halisi ya Kiebrania.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: mahali hapa
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kirai cha mahali, yenye uzito zaidi kuliko ‘hapa’ pekee.
