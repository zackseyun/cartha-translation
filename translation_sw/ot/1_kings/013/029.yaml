base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/029.yaml
  text: Then the prophet lifted up the corpse of the man of God and laid it on the donkey and brought it back[a]. And he came to the city of the old prophet to mourn and to bury him.
translation:
  language: sw
  text: Kisha nabii akaiinua maiti ya mtu wa Mungu, akaiweka juu ya punda, akairudisha. Akafika katika mji wa nabii mzee ili kumwombolezea[a] na kumzika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumlilia.” Kitenzi cha Kiebrania kinaweza kumaanisha hasa kutoa maombolezo ya mazishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: akaiinua
  rationale: Kitenzi נשׂא kina maana ya kuinua au kuchukua ili kubeba; “akaiinua” inadumisha tendo halisi linalotangulia kuwekwa kwa maiti juu ya punda.
- source_word: הַנָּבִיא
  choice: nabii
  rationale: Nomino yenye kiambishi cha uainisho humrejelea nabii anayejulikana katika muktadha, yaani nabii mzee aliyepata maiti.
- source_word: נִבְלַת
  choice: maiti
  rationale: נבלה humaanisha mwili uliokufa. “Maiti” ni neno sahihi, la kawaida, na lenye hadhi katika Kiswahili cha sasa.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hii inadumisha cheo cha kibiblia kwa mtu aliyepewa utume wa Mungu bila kukifasiri zaidi.
- source_word: וַיַּנִּחֵהוּ אֶל הַחֲמוֹר
  choice: akaiweka juu ya punda
  rationale: Hiphili ya נוח hapa ina maana ya kuweka; “juu ya punda” huonyesha mahali maiti ilipowekwa kwa usafirishaji.
- source_word: הַחֲמוֹר
  choice: punda
  rationale: Hili ndilo neno la kawaida na la sasa kwa mnyama anayerejelewa.
- source_word: וַיְשִׁיבֵהוּ
  choice: na kuirudisha
  rationale: Hiphili ya שׁוב humaanisha kusababisha kitu au mtu arudi. Kiambishi “-i-” kinarejelea maiti kwa upatanisho wa kawaida wa Kiswahili, huku maana ya kumrudisha marehemu mjini ikibaki wazi.
- source_word: וַיָּבֹא אֶל עִיר הַנָּבִיא הַזָּקֵן
  choice: Akaingia katika mji wa yule nabii mzee
  rationale: Muundo wa Kiebrania unaelekea kumaanisha mji wa nabii mzee, yaani mji alimoishi; “yule” humtambulisha nabii aliyetajwa katika muktadha.
- source_word: הַזָּקֵן
  choice: mzee
  rationale: Hapa neno linaeleza umri na kumtofautisha nabii huyu na mtu wa Mungu, wala si cheo rasmi cha uongozi.
- source_word: לִסְפֹּד
  choice: kumwombolezea
  rationale: ספד hueleza kuomboleza kwa majonzi, hasa katika mazingira ya mazishi. “Kumwombolezea” ni ya asili na inaonyesha kwamba maombolezo yalimhusu marehemu.
- source_word: וּלְקָבְרוֹ
  choice: na kumzika
  rationale: קבר maana yake ni kuzika, na kiambishi cha yambwa kinamrejelea mtu wa Mungu.
