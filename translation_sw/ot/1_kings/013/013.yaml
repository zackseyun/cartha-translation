translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nitayarishieni’ hutoa maana ya kitendo cha חבש katika muktadha wa punda bila kutumia usemi mzito au usio wa kawaida; ‘wanawe’ ni wazi na wa asili katika simulizi.
