  text: And he said to his sons[a], “Saddle the donkey for me.” So they saddled the donkey for him, and he rode on it.
translation:
  language: sw
  text: Akawaambia wanawe, “Mnitandikie punda.” Basi[a] wakamtandikia punda, naye akampanda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Nao wakamtandikia punda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל בָּנָיו
  choice: Akawaambia wanawe
  rationale: Muundo huu unaendeleza mtiririko wa simulizi wa wayyiqtol na kuonyesha kwa kawaida kwamba aliwaambia wanawe; בָּנָיו ni ‘wanawe’ wa kiume katika muktadha huu.
- source_word: חִבְשׁוּ לִי הַחֲמוֹר
  choice: Nitayarishieni punda
  rationale: חבש kuhusu mnyama wa kupandwa humaanisha kumfunga tandiko au kumwandaa kwa safari. ‘Nitayarishieni punda’ ni Kiswahili cha kawaida na hakilazimishi kutaja tandiko ambalo halitajwi kwa nomino katika Kiebrania.
- source_word: הַחֲמוֹר
  choice: punda
  rationale: Hili ndilo neno la kawaida na la sasa la Kiswahili kwa חמור.
- source_word: וַיַּחְבְּשׁוּ לוֹ הַחֲמוֹר
  choice: Basi wakamtayarishia punda
  rationale: Kitenzi kilekile cha amri kinarudiwa katika utekelezaji wake. ‘Basi’ linaonyesha mwitikio wa simulizi kwa njia ya kawaida, huku ‘wakamtayarishia’ likihifadhi maana ya kumwandalia mnyama wa kupandwa.
- source_word: וַיִּרְכַּב עָלָיו
  choice: naye akampanda
  rationale: רכב על humaanisha kumpanda mnyama. Kiswahili hutumia kiambishi cha ngeli ya punda, hivyo ‘akampanda’ ni sahihi na ya kawaida.
