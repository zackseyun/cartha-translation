base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/009.yaml
  text: For this is what he commanded me by the word of the LORD, saying, ‘You shall not eat bread, nor drink water, nor return by the way that you went.’
translation:
  language: sw
  text: 'Kwa maana ndivyo alivyoniamuru kwa neno la BWANA, akisema: ‘Usile mkate, usinywe maji, wala usirudi kwa njia uliyopita.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֵן
  choice: Kwa maana ndivyo
  rationale: Inaonyesha kuwa kauli hii ndiyo sababu ya kukataa mwaliko, huku ikihifadhi maana ya ‘kwa maana hivi/ndivyo.’
- source_word: צִוָּה אֹתִי
  choice: nilivyoamriwa
  rationale: Muundo wa kutendwa ni wa asili katika Kiswahili na unahifadhi wazo la kwamba msemaji alipokea amri, bila kulazimisha kiwakilishi kisichotajwa wazi katika kishazi hiki.
- source_word: בִּדְבַר יְהוָה
  choice: kwa neno la BWANA
  rationale: Huwasilisha njia na mamlaka ya amri; ‘BWANA’ ni uwakilishi wa kawaida wa heshima kwa jina la agano YHWH katika tafsiri za Kiswahili.
- source_word: לֹא תֹאכַל לֶחֶם
  choice: Usile mkate
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya katazo hilo.
- source_word: וְלֹא תִשְׁתֶּה מָיִם
  choice: usinywe maji
  rationale: Tafsiri ya moja kwa moja inayohifadhi ulinganifu wa makatazo.
- source_word: וְלֹא תָשׁוּב בַּדֶּרֶךְ אֲשֶׁר הָלָכְתָּ
  choice: wala usirudi kwa njia uliyopitia
  rationale: ‘Uliyopitia’ huonyesha njia ambayo mtu alikuwa amesafiria, bila kuibadili kuwa ‘uliyokuja,’ ambayo ni ufafanuzi wa muktadha kuliko maneno yenyewe.
theological_decisions:
- issue: Uwakilishi wa jina יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ linatunza desturi iliyoenea ya Kiswahili ya kuonyesha Tetragramatoni kwa cheo cha heshima, bila kuingiza msimamo wa kimadhehebu.
- issue: Mhusika aliyetoa amri
  choice: nilivyoamriwa
  alternative: alivyoniamuru
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu bila kumtaja mhusika kwa nomino katika kishazi hiki. Muundo wa kutendwa unatunza rejeo hilo lisilo wazi badala ya kulifafanua kimyakimya.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa masharti matatu umehifadhiwa kwa mtiririko wa kawaida: ‘usile … usinywe … wala usirudi.’'
