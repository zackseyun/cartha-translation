  naturalness: Kiswahili ni fasaha kwa ujumla. Kumtaja mhusika tangu mwanzo kama «Mfalme Yeroboamu» na kutumia «aliyelia dhidi ya» kunatoa mtiririko wa simulizi ulio wazi na wa asili zaidi.
  terminology: «Mtu wa Mungu», «madhabahu», «Betheli», na «Mkamateni!» zinafaa kwa Kiswahili Sanifu cha Afrika Mashariki. «Ukakauka» hudumisha taswira ya Kiebrania; dokezo la «ukanyauka» ni mbadala unaokubalika.
