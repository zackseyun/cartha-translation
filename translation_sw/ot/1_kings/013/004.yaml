  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הַ/מֶּ֜לֶךְ אֶת דְּבַ֣ר אִישׁ הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר קָרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בְּ/בֵֽית אֵ֔ל וַ/יִּשְׁלַ֨ח יָרָבְעָ֧ם אֶת יָד֛/וֹ מֵ/עַ֥ל הַ/מִּזְבֵּ֖חַ לֵ/אמֹ֣ר תִּפְשֻׂ֑/הוּ וַ/תִּיבַ֤שׁ יָד/וֹ֙ אֲשֶׁ֣ר שָׁלַ֣ח עָלָ֔י/ו וְ/לֹ֥א יָכֹ֖ל לַ/הֲשִׁיבָ֥/הּ אֵלָֽי/ו־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/004.yaml
  text: And when the king heard the word of the man of God[a], who cried out against the altar at Bethel, Jeroboam stretched out his hand from the altar, saying, “Seize him!” But his hand, which he stretched out against him, dried up, and he could not draw it back to himself.
translation:
  language: sw
  text: Mfalme Yeroboamu aliposikia neno la mtu wa Mungu, aliyelia dhidi ya madhabahu huko Betheli, akanyoosha mkono wake kutoka madhabahuni, akisema, “Mkamateni!” Lakini mkono aliounyoosha dhidi yake ukakauka[a], naye hakuweza kuurudisha kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “ukanyauka.” Kiebrania: “ukakauka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: neno
  rationale: ‘Neno’ huhifadhi usemi halisi wa Kiebrania na pia hufaa kwa ujumbe wa kinabii katika muktadha huu.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ni jina la cheo la kawaida katika Kiebrania; tafsiri hii hulihifadhi bila kulifasiri moja kwa moja kuwa ‘nabii wa Mungu.’
- source_word: קָרָא עַל
  choice: ametangaza dhidi ya
  rationale: ‘Ametangaza’ huonyesha kutamka kwa sauti, na ‘dhidi ya’ huhifadhi mwelekeo wa hukumu kwa madhabahu.
- source_word: בְּבֵית אֵל
  choice: huko Betheli
  rationale: Hutaja mahali kwa Kiswahili cha kawaida huku jina la mahali likifuata umbo lililozoeleka.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ מֵעַל הַמִּזְבֵּחַ
  choice: akaunyosha mkono wake kutoka madhabahuni
  rationale: ‘Akaunyosha mkono’ ni usemi wa asili wa Kiswahili kwa ishara hiyo ya uhasama; ‘kutoka madhabahuni’ huakisi מֵעַל הַמִּזְבֵּחַ.
- source_word: תִּפְשֻׂהוּ
  choice: Mkamateni!
  rationale: Amri ya Kiebrania ni ya wingi, ikiwaelekea wasaidizi wa mfalme; ‘Mkamateni!’ ni amri ya moja kwa moja isiyoingiza dhana za kisasa za kisheria.
- source_word: וַתִּיבַשׁ יָדוֹ
  choice: mkono ... ukakauka
  rationale: Kitenzi יבש kimsingi humaanisha kukauka. ‘Ukakauka’ huhifadhi taswira hiyo na hali ya ghafla ya mkono kushindwa kufanya kazi.
- source_word: אֲשֶׁר שָׁלַח עָלָיו
  choice: aliounyoosha dhidi yake
  rationale: Hurejelea mkono uleule na kudumisha maana ya kitendo cha uhasama katika עָלָיו.
- source_word: לַהֲשִׁיבָהּ אֵלָיו
  choice: kuurudisha kwake
  rationale: Huhifadhi maana ya kisababishi ya שוב, yaani kuufanya mkono urudi, kwa Kiswahili fasaha na kinachoeleweka.
theological_decisions:
- issue: Hali ya hukumu iliyoupata mkono wa Yeroboamu
  choice: Kueleza moja kwa moja kwamba mkono ulikauka na ukashindwa kurudi, bila kutaja ugonjwa maalumu.
  alternative: Kutafsiri kwa namna ya kufafanua zaidi kuwa mkono ‘ulinyauka’ au ‘ulipooza.’
  rationale: Simulizi linaonyesha athari ya ghafla ya hukumu baada ya amri ya uhasama. ‘Ukakauka’ hudumisha picha ya Kiebrania bila kuongeza uchunguzi wa kitabibu au maelezo ya kitheolojia yasiyosemwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetolewa kwa mtiririko wa kawaida wa Kiswahili, huku cheo ‘mtu wa Mungu,’ ukali wa amri, na taswira ya Kiebrania ya mkono kukauka vikihifadhiwa.
