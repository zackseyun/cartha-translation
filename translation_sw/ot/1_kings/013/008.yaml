  text: But the man of God said to the king[a], “If you were to give me half your house, I would not go with you, nor would I eat bread or drink water in this place.”
translation:
  language: sw
  text: Lakini mtu wa Mungu akamwambia mfalme, “Kama ungenipa nusu ya nyumba yako[a], singeenda pamoja nawe, wala singekula mkate, wala kunywa maji mahali hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nusu ya nyumba yako.” Usemi huu unaweza kumaanisha sehemu kubwa sana ya mali au milki, lakini tafsiri imehifadhi maneno halisi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Huhifadhi usemi wa kawaida wa Kiebrania kwa mjumbe aliyepewa agizo na Mungu bila kuufasiri moja kwa moja kuwa ‘nabii wa Mungu.’
- source_word: אִם תִּתֶּן לִי אֶת חֲצִי בֵיתֶךָ
  choice: Hata kama ungenipa nusu ya nyumba yako
  rationale: Muundo huu unaeleza kwa Kiswahili cha kawaida hali ya kudhaniwa na kukataa kwa mkazo. ‘Nusu ya nyumba yako’ huhifadhi taswira halisi ya Kiebrania, ingawa inaweza kumaanisha sehemu kubwa ya mali au milki ya mfalme.
- source_word: לֹא אָבֹא עִמָּךְ
  choice: singekwenda pamoja nawe
  rationale: Ingawa kitenzi cha Kiebrania kimsingi ni ‘kuja,’ ‘kwenda pamoja nawe’ ni sawa kimaana na ni cha kawaida zaidi katika muktadha wa mwaliko wa mfalme.
- source_word: לֹא אֹכַל לֶחֶם
  choice: wala singekula mkate
  rationale: ‘Mkate’ huhifadhi neno na taswira ya Kiebrania; katika matumizi ya kibiblia neno hilo pia linaweza kuwakilisha chakula au mlo kwa ujumla.
- source_word: לֹא אֶשְׁתֶּה מַּיִם
  choice: au kunywa maji
  rationale: Tafsiri ya moja kwa moja na ya kawaida, iliyounganishwa kwa ulaini na kishazi kinachotangulia.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: mahali hapa
  rationale: Huhifadhi msisitizo wa kiashiria ‘hapa/pa hapa’ kwa lugha ya kawaida na yenye hadhi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masharti ‘Hata kama ungenipa … singekwenda’ unaonyesha kukataa kwa uthabiti, huku ‘pamoja nawe’ ikiepuka mtindo wa kizamani kupita kiasi. Alama ya tanbihi imewekwa baada ya kirai inachokifafanua.
