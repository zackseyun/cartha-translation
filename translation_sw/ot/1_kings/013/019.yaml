  text: Basi akarudi pamoja naye, akala mkate katika nyumba yake, na akanywa maji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kwa maneno halisi, “akala mkate,” usemi ambao unaweza kumaanisha kula mlo. Tafsiri ya karibu na maneno ya Kiebrania imehifadhiwa hapa kwa sababu “mkate” na “maji” ni muhimu katika simulizi linalozunguka aya hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi שוב katika mfuatano wa simulizi kinaonyesha tendo lililokamilika la kurudi; “akarudi” ni Kiswahili cha kawaida na sahihi katika muktadha.
- source_word: אִתּוֹ
  choice: pamoja naye
  rationale: Huwakilisha wazi maana ya kuandamana iliyo katika kihusishi chenye kiambishi cha nafsi ya tatu umoja.
- source_word: וַיֹּאכַל לֶחֶם
  choice: akala mkate
  rationale: Tafsiri ya karibu ya maneno ni “akala mkate.” Ingawa usemi huo unaweza kumaanisha kula mlo, “mkate” umehifadhiwa kwa sababu ni muhimu katika marudio ya katazo la simulizi hili.
- source_word: בְּבֵיתוֹ
  choice: nyumbani mwake
  rationale: Ni usemi wa asili katika Kiswahili unaowasilisha maana ya kuwa ndani au katika nyumba yake; katika muktadha, kiwakilishi kinamhusu nabii mzee.
- source_word: וַיֵּשְׁתְּ מָיִם
  choice: akanywa maji
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida; kutaja “maji” kunahifadhi mwangwi wa tendo lililokatazwa katika simulizi linalozunguka aya hii.
