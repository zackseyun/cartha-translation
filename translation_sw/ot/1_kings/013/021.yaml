source:
  edition: WLC
  text: וַ/יִּקְרָ֞א אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים אֲשֶׁר בָּ֤א מִֽ/יהוּדָה֙ לֵ/אמֹ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה יַ֗עַן כִּ֤י מָרִ֨יתָ֙ פִּ֣י יְהוָ֔ה וְ/לֹ֤א שָׁמַ֨רְתָּ֙ אֶת הַ/מִּצְוָ֔ה אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/021.yaml
  text: 'And he cried out to the man of God who had come from Judah[a], saying, “Thus says Yahweh: Because you have rebelled against the word of Yahweh and have not kept the command that Yahweh your God commanded you,”'
translation:
  language: sw
  text: 'Naye akamlilia mtu wa Mungu aliyekuwa ametoka Yuda, akisema, “Yahweh asema hivi: ‘Kwa kuwa umeasi neno la Yahweh[a], wala hukuishika amri ambayo Yahweh Mungu wako alikuamuru,’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiswahili, “kinywa cha Yahweh,” yaani yale ambayo Yahweh alisema.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל
  choice: akamwambia kwa sauti
  rationale: Kitenzi קרא pamoja na אֶל hapa kinaonyesha kumwelekea mtu kwa sauti na kutamka ujumbe. Tafsiri hii inaonyesha uzito wa tamko la kinabii bila kudokeza kwamba alimwita aje.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ni jina la cheo la kawaida katika Kiebrania; limetafsiriwa moja kwa moja badala ya kulifafanua kuwa ‘nabii wa Mungu.’
- source_word: מִיהוּדָה
  choice: aliyekuwa ametoka Yuda
  rationale: Muundo huu unaonyesha kwamba hapo awali alikuwa amekuja kutoka Yuda na ni wa kawaida katika Kiswahili cha simulizi.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Hifadhi fomula ya mjumbe wa kinabii kwa Kiswahili cha sasa na chenye hadhi.
- source_word: יַעַן כִּי
  choice: Kwa kuwa
  rationale: Huanzisha sababu ya hukumu inayofuata kwa njia iliyo wazi na ya kawaida.
- source_word: מָרִיתָ
  choice: umeasi
  rationale: מרה ina nguvu ya uasi au ukaidi dhidi ya mamlaka, si kutotii tu; ‘umeasi’ huhifadhi uzito huo.
- source_word: פִּי יְהוָה
  choice: neno la Yahweh
  rationale: Kisahili ni ‘kinywa cha Yahweh,’ lakini hapa ni nahau inayomaanisha yale ambayo Yahweh alisema. ‘Neno la Yahweh’ ni sawa ya asili katika Kiswahili.
- source_word: וְלֹא שָׁמַרְתָּ אֶת הַמִּצְוָה
  choice: wala hukuishika amri
  rationale: שמר katika muktadha wa amri ni kuishika au kuitunza kwa kuitii. ‘Kuishika amri’ huhifadhi lugha ya agano na umoja wa הַמִּצְוָה.
- source_word: אֲשֶׁר צִוְּךָ
  choice: ambayo ... alikuamuru
  rationale: Hutoa maana ya moja kwa moja ya צוה na huhifadhi uhusiano kati ya nomino ‘amri’ na kitenzi ‘kuamuru.’
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh Mungu wako
  rationale: Hifadhi jina la agano יְהוָה na usemi wa uhusiano ‘Mungu wako.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, YHWH. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Nguvu ya מָרִיתָ kuhusu kutii neno la Mungu
  choice: umeasi
  alternative: hukutii; umekaidi
  rationale: Kitenzi hicho kinaonyesha uasi dhidi ya mamlaka ya Mungu. ‘Umeasi’ huhifadhi uzito wa shtaka bila kuongeza maelezo ya kimadhehebu.
- issue: Nahau פִּי יְהוָה
  choice: neno la Yahweh
  alternative: kinywa cha Yahweh; amri ya Yahweh
  rationale: ‘Kinywa’ ni tafsiri ya kimuundo lakini si ya kawaida kwa maana hii katika Kiswahili; ‘neno’ huwasilisha yale aliyosema bila kuibana maana kuwa amri pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inaendeleza muundo wa hotuba unaofunguka katika mstari huu na kukamilika katika mstari unaofuata. Alama [a] imewekwa baada ya ‘neno la Yahweh,’ mahali inapohusika na nahau ya Kiebrania, badala ya baada ya ‘Yuda.’
