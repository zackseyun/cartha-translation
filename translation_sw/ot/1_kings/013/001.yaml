  source_fidelity: 'Tafsiri inawakilisha vipengele vyote vya Kiebrania kwa uaminifu: alama ya msisitizo wa kisimulizi, “mtu wa Mungu,” asili ya Yuda na lengwa Betheli, kuja kwa neno la Yahwe, na hali ya Yeroboamu aliyekuwa amesimama karibu na madhabahu kwa kusudi la kufukiza uvumba. “Huku ... akiwa amesimama” kwa kufaa huonyesha hali ya wakati mmoja inayotolewa na waw pamoja na kitenzi shirikishi.'
