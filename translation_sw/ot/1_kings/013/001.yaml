id: 1KI.13.1
reference: 1 Kings 13:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֣ישׁ אֱלֹהִ֗ים בָּ֧א מִ/יהוּדָ֛ה בִּ/דְבַ֥ר יְהוָ֖ה אֶל בֵּֽית אֵ֑ל וְ/יָרָבְעָ֛ם עֹמֵ֥ד עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/001.yaml
  text: And behold[a], a man of God came from Judah to Bethel by the word of Yahweh[b], while Jeroboam was standing by the altar to burn incense.
translation:
  language: sw
  text: Na tazama, mtu wa Mungu alikuja kutoka Yuda mpaka Betheli kwa neno la Yahwe[a], huku Yeroboamu akiwa amesimama kando ya madhabahu[b] ili kufukiza uvumba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa agizo la Yahwe,” au “kulingana na neno la Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na Yeroboamu alikuwa amesimama kwenye madhabahu.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa kwa urahisi kuwa “na,” na kirai kinachotaja mahali kinaweza pia kutafsiriwa “kwenye madhabahu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Inahifadhi kazi ya kishazi hiki ya kuendeleza simulizi na kuvuta usikivu wa msomaji, pamoja na uchangamfu wake wa kisimulizi.
- source_word: אִישׁ אֱלֹהִים
  choice: mtu wa Mungu
  rationale: Ni tafsiri ya moja kwa moja ya usemi wa Kiebrania; haibadilishwi kuwa ‘nabii,’ ingawa mara nyingi usemi huo humtaja mjumbe au nabii wa Mungu.
- source_word: בָּא מִיהוּדָה
  choice: alikuja kutoka Yuda
  rationale: Inatoa kwa kawaida tendo la kuja na mahali alikotoka.
- source_word: בִּדְבַר יְהוָה
  choice: kwa neno la Yahwe
  rationale: Kiambishi בְּ kinaweza kuonyesha njia, mamlaka, au msingi wa kuja kwake. ‘Kwa neno la Yahwe’ huhifadhi upana huo bila kuamua kupita kiasi kati ya agizo, mamlaka, na kupatana na neno hilo.
- source_word: אֶל בֵּית אֵל
  choice: mpaka Betheli
  rationale: ‘Mpaka’ linaonyesha Betheli kuwa mwisho wa safari kwa Kiswahili cha kawaida; Betheli ni umbo la kawaida la jina hili la mahali.
- source_word: וְיָרָבְעָם עֹמֵד
  choice: huku Yeroboamu akiwa amesimama
  rationale: Kitenzi shirikishi עֹמֵד kinaonyesha hali inayoendelea wakati mtu wa Mungu alipofika; ‘huku ... akiwa’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa kusoma וְ kama ‘na.’
- source_word: עַל הַמִּזְבֵּחַ
  choice: kando ya madhabahu
  rationale: Katika muundo huu עַל huonyesha mahali aliposimama karibu na madhabahu, si lazima juu yake. ‘Kando ya’ ni ya kawaida na inaepusha picha isiyowezekana ya kusimama juu ya madhabahu.
- source_word: לְהַקְטִיר
  choice: ili kufukiza uvumba
  rationale: Katika muktadha wa ibada, kitenzi hiki hutaja kufanya kitu kitoe moshi, na hapa maana mahususi ya kufukiza uvumba inafaa. ‘Ili’ huonyesha kusudi la kusimama kwake hapo.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko lina jina maalumu la agano יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- issue: Maana ya בִּדְבַר יְהוָה katika kuja kwa mtu wa Mungu
  choice: kwa neno la Yahwe
  alternative: kwa agizo la Yahwe au kulingana na neno la Yahwe
  rationale: Tafsiri kuu huhifadhi mvutano wa kimaana kati ya kuja kwa agizo/mamlaka ya Yahwe na kuja kulingana na neno lake; tanbihi inataja njia nyingine halali bila kuifanya moja kuwa ya pekee.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Na tazama’ huhifadhi msisitizo wa simulizi; ‘madhabahu’ na ‘kufukiza uvumba’ ni istilahi za ibada zilizozoeleka. Majina yametolewa kwa maumbo ya Kiswahili: Yuda, Betheli, Yeroboamu, na Yahwe.'
