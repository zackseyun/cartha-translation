lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo akamwambia” ni Kiswahili cha kawaida kinachoonyesha mfuatano wa tukio.
- source_word: אֵלָיו
  choice: -mwambia
  rationale: Kiambishi cha yambwa -mw- kinawakilisha kwa kawaida maana ya ‘akamwambia yeye.’
- source_word: לֵךְ
  choice: Njoo
  rationale: Ingawa kitenzi cha Kiebrania kwa msingi ni ‘nenda/tembea,’ katika mwaliko wa kwenda pamoja na msemaji, Kiswahili hutumia kwa kawaida “njoo pamoja nami.”
- source_word: אִתִּי
  choice: pamoja nami
  rationale: Hutoa moja kwa moja maana ya kuandamana na msemaji.
- source_word: הַבָּיְתָה
  choice: nyumbani
  rationale: Kiambishi cha mwelekeo katika neno ‘nyumba’ kinaonyesha kuelekea nyumbani/kwenye nyumba; “nyumbani” ni mwaliko wa kawaida na wa asili katika Kiswahili.
- source_word: וֶאֱכֹל
  choice: ukale
  rationale: 'Muundo wa Kiswahili unaunganisha kwa kawaida mwaliko wa pili na wa kwanza kwa utegemezi: “njoo ... ukale.”'
- source_word: לָחֶם
  choice: chakula
  rationale: Ingawa maana ya msingi ni ‘mkate,’ hapa neno linaweza kutumiwa kwa maana pana ya chakula au mlo; “ukale chakula” ni Kiswahili cha asili katika mwaliko huu.
