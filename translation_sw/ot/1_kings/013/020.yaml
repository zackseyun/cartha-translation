base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/020.yaml
  text: And it happened, as they were sitting at the table, that the word of Yahweh came to the prophet who had brought him back.
translation:
  language: sw
  text: Ikawa, walipokuwa wameketi mezani, neno la Yahweh likamjia nabii aliyekuwa amemrudisha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutambulisha tukio linalofuata katika simulizi; “Ikawa” ni mtindo wa kisimulizi ulio wazi na wenye hadhi katika Kiswahili.
- source_word: הֵם יֹשְׁבִים
  choice: walipokuwa wameketi
  rationale: Kiwakilishi pamoja na hali ya kuendelea huonyesha tendo lililokuwa likiendelea wakati tukio jingine lilipotokea.
- source_word: אֶל הַשֻּׁלְחָן
  choice: mezani
  rationale: Katika muktadha wa kuketi kwa chakula, hii ndiyo tafsiri ya kawaida na ya asili ya Kiswahili.
- source_word: דְּבַר יְהוָה
  choice: neno la Yahweh
  rationale: Huhifadhi muundo wa kawaida wa kinabii na jina la agano lililo katika maandishi ya Kiebrania.
- source_word: אֶל הַנָּבִיא
  choice: likamjia nabii
  rationale: Kitenzi “likamjia” huwasilisha kwa Kiswahili cha kawaida kwamba nabii ndiye aliyepokea ufunuo.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: aliyekuwa amemrudisha
  rationale: Hifili ya שוב pamoja na kiambishi cha nafsi ya tatu umoja wa kiume inaonyesha kwamba nabii huyo alikuwa amemsababisha mtu huyo arudi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina hilo bila kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umehifadhiwa bila kutumia lugha nzito isiyo ya kawaida; hakuna alama za tanbihi kwa kuwa hakuna tanbihi inayohitajika.
