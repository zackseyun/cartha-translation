  text: כִּי֩ הָיֹ֨ה יִהְיֶ֜ה הַ/דָּבָ֗ר אֲשֶׁ֤ר קָרָא֙ בִּ/דְבַ֣ר יְהוָ֔ה עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֑ל וְ/עַל֙ כָּל בָּתֵּ֣י הַ/בָּמ֔וֹת אֲשֶׁ֖ר בְּ/עָרֵ֥י שֹׁמְרֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/032.yaml
  text: For the word that he cried out by the word of Yahweh against the altar that is in Bethel[a], and against all the houses of the high places that are in the cities of Samaria[b], will surely come to pass.
translation:
  language: sw
  text: Kwa maana neno alilolitangaza kwa neno la Yahweh dhidi ya madhabahu iliyoko Betheli, na dhidi ya nyumba zote za mahali pa juu[a] zilizo katika miji ya Samaria, hakika litatimia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahekalu yote ya mahali pa juu.” Kiebrania kinasema kihalisi, “nyumba zote za mahali pa juu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia muundo unaosisitiza uhakika; pia inaweza kutafsiriwa, “bila shaka litatokea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya ombi lililotangulia kuhusu mahali pa kuzikwa, na hivyo inadumisha uhusiano wa aya hii na muktadha wake.
- source_word: הָיֹה יִהְיֶה
  choice: hakika litatimia
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kisichotimilika unasisitiza uhakika. Kauli hii ni ya kawaida katika Kiswahili na inaonyesha kwamba neno hilo litatimizwa bila shaka.
- source_word: הַדָּבָר
  choice: neno
  rationale: Katika muktadha wa kinabii, neno hili linamaanisha ujumbe au tamko lililonenwa, wala si jambo lisiloelezwa.
- source_word: אֲשֶׁר קָרָא
  choice: alilolitangaza
  rationale: Kitenzi kinaeleza kutolewa hadharani kwa tamko la kinabii. ‘Alilolitangaza’ ni cha asili katika Kiswahili na kinadumisha nguvu ya tendo hilo.
- source_word: בִּדְבַר יְהוָה
  choice: kwa neno la Yahweh
  rationale: Kirai hiki kinaonyesha kwamba nabii alisema kwa msingi na mamlaka ya ufunuo wa Yahweh, huku kikidumisha urudiaji wa ‘neno’ uliopo katika Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: עַל
  choice: dhidi ya
  rationale: Katika muktadha huu wa hukumu ya kinabii, kihusishi hiki kinaonyesha madhabahu na mahali pa juu kuwa shabaha ya tamko.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa mahali pa kutolea dhabihu.
- source_word: בְּבֵית אֵל
  choice: iliyoko Betheli
  rationale: ‘Betheli’ ni umbo la kawaida la jina hili la mahali katika Kiswahili, na ‘iliyoko’ huunganisha kwa asili madhabahu na mahali pake.
- source_word: כָּל בָּתֵּי הַבָּמוֹת
  choice: nyumba zote za mahali pa juu
  rationale: Tafsiri hii inadumisha vipengele vyote viwili vya Kiebrania—‘nyumba’ na ‘mahali pa juu’—bila kuamua kimya kimya kwamba nyumba hizo zilikuwa aina fulani mahususi ya madhabahu au hekalu.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: katika miji ya Samaria
  rationale: Hii inafuata muundo wa Kiebrania na kudumisha rejeo la kijiografia kama linavyotolewa katika simulizi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini inatumia jina binafsi la Mungu. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhakika wa unabii katika הָיֹה יִהְיֶה
  choice: hakika litatimia
  alternative: bila shaka litatokea
  rationale: Muundo wa Kiebrania unasisitiza uhakika wa kutimizwa kwa neno hilo, lakini hauhitaji maelezo ya ziada ya kiteolojia.
- issue: Maana ya בָּתֵּי הַבָּמוֹת
  choice: nyumba za mahali pa juu
  alternative: mahekalu ya mahali pa juu
  rationale: Kiebrania kinasema kihalisi ‘nyumba za mahali pa juu.’ Tafsiri kuu inadumisha usemi huo, huku maana ya ‘mahekalu’ ikitajwa katika tanbihi kama uwezekano wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wenye heshima na unaoeleweka. Urudiaji wa ‘neno ... kwa neno la Yahweh’ umehifadhiwa kwa sababu unatokana na muundo wa Kiebrania na una umuhimu katika muktadha wa unabii. Usemi ‘nyumba za mahali pa juu’ ni rasmi kidogo lakini umehifadhiwa ili kuepuka kufuta taswira halisi ya chanzo; tanbihi inatoa tafsiri ya kawaida zaidi.
