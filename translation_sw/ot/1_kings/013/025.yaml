base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/025.yaml
  text: And behold[a], men were passing by and saw the corpse thrown on the road, and the lion standing beside the corpse; and they came and reported it in the city where the old prophet lived.
translation:
  language: sw
  text: Tazama, watu fulani walikuwa wakipita, wakaona maiti imetupwa barabarani, na simba amesimama kando ya maiti. Kisha wakafika mjini ambako nabii yule mzee aliishi, wakasimulia jambo hilo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakazungumza mjini.” Kitenzi cha Kiebrania ni “wakazungumza,” lakini katika muktadha huu kinamaanisha kutoa habari ya tukio hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Inahifadhi kiashiria cha kisimulizi kinachovuta fikira kwenye tukio la ghafla, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אֲנָשִׁים עֹבְרִים
  choice: watu fulani walikuwa wakipita
  rationale: Kishirikishi עֹבְרִים kinaonyesha tendo linaloendelea. Ingawa אֲנָשִׁים ni wingi wa kiume kisarufi, hapa inaweza kutaja kundi lisilobainishwa; ‘watu fulani’ ni ya asili na haiongezi uhakika usiokuwapo.
- source_word: וַיִּרְאוּ
  choice: wakaona
  rationale: Ni kitenzi rahisi cha mfululizo wa kisimulizi; ‘wakaona’ hudumisha mtiririko wa matukio.
- source_word: הַנְּבֵלָה
  choice: maiti
  rationale: Katika muktadha huu neno linataja mwili wa binadamu aliyekufa; ‘maiti’ ni sahihi, wazi, na ya kawaida katika Kiswahili.
- source_word: מֻשְׁלֶכֶת בַּדֶּרֶךְ
  choice: imetupwa barabarani
  rationale: ‘Imetupwa’ huhifadhi nguvu ya umbo tendwa la שׁלך badala ya kulirahisisha kuwa ‘imelala’; ‘barabarani’ hutoa mahali kwa Kiswahili cha asili.
- source_word: הָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: simba amesimama kando ya maiti
  rationale: Huhifadhi taswira ya simba akiwa amesimama karibu na maiti, bila kuongeza sababu au tendo jingine.
- source_word: וַיָּבֹאוּ
  choice: wakaenda mjini
  rationale: Kiebrania kihalisi ni ‘wakaja,’ lakini mtazamo wa Kiswahili katika simulizi hili hufanya ‘wakaenda mjini’ kuwa wa asili huku ukihifadhi mwendo wao hadi mjini.
- source_word: וַיְדַבְּרוּ בָעִיר
  choice: wakasimulia jambo hilo
  rationale: דבר maana yake ya msingi ni ‘kusema/kuzungumza’; katika muktadha huu wanatangaza habari ya walichokiona. ‘Wakasimulia jambo hilo’ huweka wazi rejeo lililodokezwa bila kulifafanua kupita kiasi.
- source_word: אֲשֶׁר הַנָּבִיא הַזָּקֵן יֹשֵׁב בָּהּ
  choice: ambako nabii yule mzee aliishi
  rationale: יֹשֵׁב בָּהּ hapa inaonyesha makao. ‘Nabii yule mzee’ ni mpangilio wa kawaida wa Kiswahili na hutambulisha mhusika anayejulikana katika muktadha.
