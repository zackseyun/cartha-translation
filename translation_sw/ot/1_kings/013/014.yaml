base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/014.yaml
  text: So he went after the man of God and found him sitting under the terebinth[a], and he said to him, “Are you the man of God who came from Judah?” And he said, “I am.”
translation:
  language: sw
  text: Basi akaenda kumfuata mtu wa Mungu, akamkuta ameketi chini ya mti wa terebinthi[a]. Akamwambia, “Je, wewe ndiye mtu wa Mungu aliyetoka Yuda?” Akajibu, “Ni mimi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chini ya mwaloni.” Neno la Kiebrania אֵלָה hasa humaanisha mti wa terebinthi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אַחֲרֵי
  choice: akaenda kumfuata
  rationale: Muundo huu unaonyesha kwenda baada ya mtu kwa kusudi la kumtafuta au kumpata; “akaenda kumfuata” ni wa kawaida na huhifadhi mwendo wa simulizi.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hii ni tafsiri ya moja kwa moja ya cheo cha Kiebrania na inadumisha istilahi ya kifungu bila kuibana kuwa “nabii wa Mungu.”
- source_word: וַיִּמְצָאֵהוּ
  choice: akamkuta
  rationale: Katika muktadha wa kumfuata mtu, “akamkuta” hutoa maana ya kumpata mahali alipokuwa kwa Kiswahili cha kawaida.
- source_word: יֹשֵׁב
  choice: ameketi
  rationale: Kitenzi-shirikishi kinaeleza hali au mkao wake wakati alipopatikana; “ameketi” ni ya asili na sahihi.
- source_word: תַּחַת הָאֵלָה
  choice: chini ya mti wa mvinje
  rationale: אֵלָה kwa kawaida hutaja terebinthi; “mti wa mvinje” ni jina la Kiswahili linalolenga aina hiyo ya mti, huku tanbihi ikihifadhi uwezekano wa “mwaloni.”
- source_word: הַאַתָּה
  choice: Je, wewe ndiye
  rationale: Huu ni utambulisho wa moja kwa moja katika swali; “wewe ndiye” huwasilisha mkazo wa kiwakilishi cha Kiebrania kwa Kiswahili sanifu.
- source_word: אֲשֶׁר בָּאתָ מִיהוּדָה
  choice: aliyetoka Yuda
  rationale: Kirai hiki kinamtambulisha kwa mahali alikotoka; “aliyetoka Yuda” ni cha kawaida na kinawakilisha מן pamoja na jina la mahali.
- source_word: אָנִי
  choice: Ni mimi
  rationale: Jibu la Kiebrania ni kiwakilishi pekee, yaani “mimi”; “Ni mimi” ni jibu fupi na la kawaida la kuthibitisha utambulisho kwa Kiswahili.
theological_decisions:
- issue: Tafsiri ya אִישׁ הָאֱלֹהִים kama cheo
  choice: mtu wa Mungu
  alternative: nabii wa Mungu
  rationale: “Mtu wa Mungu” huhifadhi cheo cha chanzo moja kwa moja na huepuka kukifasiri kwa cheo chembamba zaidi cha “nabii,” hata kama mhusika anaweza kutambuliwa hivyo katika muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha simulizi, cha sasa na chenye heshima. “Mvinje” limetumika katika maandiko huku “terebinthi” ikifafanuliwa kwenye tanbihi kwa usahihi wa kibotania; sentensi zimegawanywa ili mazungumzo yasomeke kwa urahisi.
