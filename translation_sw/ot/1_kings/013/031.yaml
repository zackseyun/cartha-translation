base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/031.yaml
  text: And it happened, after he had buried him, that he said to his sons, “When I die, bury me in the tomb where the man of God is buried; lay my bones beside his bones.”
translation:
  language: sw
  text: Ikawa, baada ya kumzika, aliwaambia wanawe, “Nitakapokufa, nizikeni katika kaburi ambamo mtu wa Mungu amezikwa; iwekeni mifupa yangu kando ya mifupa yake.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי קָבְרוֹ אֹתוֹ
  choice: Baada ya kumzika
  rationale: Muundo wa wakati unaonyesha kwamba maziko yalitangulia kauli iliyofuata. Katika Kiswahili, ‘Baada ya kumzika’ ni simulizi la kawaida na lenye maana kamili bila kulazimisha kishazi kisicho cha lazima.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha wana wa kiume; ‘wanawe’ linahifadhi maana hiyo kwa lugha ya Kiswahili yenye hadhi na ufupi.
- source_word: בְּמוֹתִי
  choice: Nitakapokufa
  rationale: Huwasilisha kwa kawaida tendo la wakati ujao linalokusudiwa na muundo wa Kiebrania.
- source_word: וּקְבַרְתֶּם אֹתִי
  choice: nizikeni
  rationale: Muktadha unaifanya kauli hii kuwa agizo kwa wanawe; umbo la amri la Kiswahili linaonyesha nguvu hiyo wazi.
- source_word: בַּקֶּבֶר
  choice: katika kaburi
  rationale: ‘Kaburi’ linafaa kwa mahali maalumu pa maziko panapoweza kuwekwa mifupa ya zaidi ya mtu mmoja.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Ni tafsiri ya moja kwa moja ya cheo cha Kiebrania na haikifasiri kwa namna nyembamba zaidi kuwa ‘nabii.’
- source_word: קָבוּר בּוֹ
  choice: amezikwa
  rationale: Hutoa kwa Kiswahili hali ya mtu aliyekwisha kuzikwa katika kaburi hilo.
- source_word: אֵצֶל
  choice: kando ya
  rationale: Huonyesha ukaribu wa mahali kwa lugha ya kawaida na yenye hadhi.
- source_word: עַצְמֹתָיו ... עַצְמֹתָי
  choice: mifupa yake ... mifupa yangu
  rationale: Inahifadhi taswira halisi ya mifupa katika Kiebrania badala ya kuipanua kuwa ‘mabaki.’
- source_word: הַנִּיחוּ
  choice: iwekeni
  rationale: Ni amri ya moja kwa moja kwa wanawe na inasikika kwa kawaida inapohusu mifupa iliyowekwa kaburini.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inahifadhi ‘mtu wa Mungu’ na ‘mifupa’ kama zilivyo katika chanzo, huku ikitumia mpangilio wa sentensi unaosomeka kwa kawaida.
