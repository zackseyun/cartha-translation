  yaml_path: translation/ot/1_kings/013/027.yaml
  text: Then he spoke to his sons[a], saying, “Saddle the donkey for me.” So they saddled it.
translation:
  language: sw
  text: Kisha akawaambia wanawe, “Nitandikieni punda.” Basi wakamtandika.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר אֶל בָּנָיו לֵאמֹר
  choice: Kisha akawaambia wanawe
  rationale: Kauli hii inaendeleza simulizi na kutambulisha maneno ya moja kwa moja. ‘Akawaambia’ ni Kiswahili cha asili kinachowasilisha דבר pamoja na לֵאמֹר bila urudiaji usio wa lazima; ‘wanawe’ humaanisha wana wake wa kiume katika muktadha huu.
- source_word: חִבְשׁוּ לִי
  choice: Nitandikieni
  rationale: חבשׁ inapotumiwa kuhusu punda humaanisha kumwekea matandiko ya kupandia. Kiambishi ‘-ni’ katika ‘nitandikieni’ kinahifadhi maana ya לִי, yaani tendo lifanywe kwa ajili yake.
- source_word: אֶת הַחֲמוֹר
  choice: punda
  rationale: חֲמוֹר ni neno la kawaida kwa punda. Ingawa Kiebrania kina kibainishi, Kiswahili hakihitaji neno tofauti la kuonyesha umaalumu hapa kwa sababu punda huyo anatambulika katika muktadha.
- source_word: וַיַּחֲבֹשׁוּ
  choice: Basi wakamtandikia
  rationale: ‘Basi’ huendeleza matokeo ya amri katika simulizi. Kitenzi kilekile kimetafsiriwa kwa mzizi uleule, na kiambishi ‘-m-’ humrejelea punda bila kulazimika kurudia nomino.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘nitandikieni punda’ ni wa kawaida na unaeleweka, huku ukihifadhi kwa ufupi wazo la kumwekea punda matandiko kwa ajili ya msemaji.
