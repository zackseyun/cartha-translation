base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/006.yaml
  text: Then the king answered and said to the man of God[a], “Please entreat the favor of Yahweh your God, and pray for me, that my hand may be restored to me.” So the man of God entreated the favor of Yahweh, and the king’s hand was restored to him and became as it was before.
translation:
  language: sw
  text: Ndipo mfalme akamjibu mtu wa Mungu, akasema, “Tafadhali, umsihi Yahwe, Mungu wako,[a] na uniombee, ili mkono wangu unirudie.” Basi mtu wa Mungu akamsihi Yahwe, na mkono wa mfalme ukamrudia, ukawa kama ulivyokuwa hapo awali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tafuta kibali cha Yahwe, Mungu wako.” Nahau ya Kiebrania ni, kwa neno kwa neno, “sihi uso wa Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַל ... אֶת־פְּנֵי יְהוָה / וַיְחַל ... אֶת־פְּנֵי יְהוָה
  choice: tafuta kibali cha Yahwe / akatafuta kibali cha Yahwe
  rationale: Nahau hii ina maana ya kuomba au kutafuta kibali cha mtu. Tafsiri hii ni ya asili katika Kiswahili na haiingizi wazo lenye nguvu zaidi la kumtuliza Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kulitamka badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Inadumisha kauli ya mfalme inayomtaja Yahwe kuwa Mungu wa mtu wa Mungu, bila kuibadili iwe “Mungu wetu.”
- source_word: וְהִתְפַּלֵּל בַּעֲדִי
  choice: uniombee
  rationale: Kitenzi pamoja na kihusishi kinaonyesha sala inayotolewa kwa niaba ya mwingine; “uniombee” ni wazi na ya kawaida katika Kiswahili.
- source_word: וְתָשֹׁב יָדִי אֵלָי / וַתָּשָׁב יַד־הַמֶּלֶךְ אֵלָיו
  choice: mkono wangu urudishwe katika hali yake / mkono wa mfalme ukarudishwa katika hali yake
  rationale: Huwasilisha kurudia hali ya awali kwa Kiswahili kinachoeleweka, huku ikidumisha ulinganifu kati ya ombi na kutimizwa kwake.
- source_word: וַתְּהִי כְּבָרִאשֹׁנָה
  choice: ukawa kama ulivyokuwa hapo awali
  rationale: Hueleza wazi kwamba mkono ulirudia hali yake ya zamani.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Inahifadhi cheo cha Kiebrania badala ya kukibadili kwa tafsiri ya kifafanuzi kama “nabii.”
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: akamjibu ... akasema
  rationale: Inahifadhi jozi ya vitenzi vya simulizi katika muundo wa Kiswahili unaosikika kwa kawaida.
theological_decisions:
- issue: Mfalme anamwita Yahwe “Mungu wako”
  choice: Mungu wako
  alternative: Mungu wetu
  rationale: Kiebrania kinatumia nafsi ya pili umoja. Tafsiri haipaswi kuingiza ushirika wa kiagano ambao mfalme hakuutaja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa simulizi na cheo “mtu wa Mungu” vimehifadhiwa, huku nahau za Kiebrania zikitolewa kwa Kiswahili cha asili.
