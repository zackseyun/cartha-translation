  - severity: medium
    issue: “Mkono wangu urudishwe katika hali yake” haifuati kwa karibu mwelekeo wa “mkono wangu unirudie.”
    rationale: Kiebrania kwanza husema mkono umrudia mfalme, kisha huongeza kwamba ukawa kama hapo mwanzo. “Unirudie / ukamrudia” huhifadhi mpangilio huo na kuepuka kufifisha kauli ya mwisho kwa kurudia hali ya awali mapema.
