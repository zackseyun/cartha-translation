  terminology: “Yahwe,” “Mungu wako,” na “mtu wa Mungu” zinafaa na zinapaswa kubaki. Koma zinazozunguka “Mungu wako” zinaweka wazi kuwa ni maelezo ya Yahwe, wala si sehemu isiyotenganishwa ya nomino “kibali.”
