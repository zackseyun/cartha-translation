  source_fidelity: 'Msingi wa tafsiri unafuata Kiebrania kwa uaminifu: cheo “mtu wa Mungu,” tofauti katika “Yahwe, Mungu wako,” ombi la kuombea mfalme, na kurejeshwa kwa mkono vimehifadhiwa. Hata hivyo, “urudishwe katika hali yake” huelekeza zaidi kwenye hali ya mkono kuliko usemi wa Kiebrania “mkono wangu unirudie”; hali ya awali inaelezwa mahsusi katika kauli inayofuata.'
