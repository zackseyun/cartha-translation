    rationale: “Msihi Yahwe akuonyeshe kibali” ni ufafanuzi unaoongeza tendo la Yahwe kuonyesha kibali. Ni bora kutoa mbadala unaolingana moja kwa moja na “umsihi Yahwe” na kutaja maana ya nahau bila kuifanya tafsiri ya neno kwa neno ionekane kama Kiswahili cha kawaida.
