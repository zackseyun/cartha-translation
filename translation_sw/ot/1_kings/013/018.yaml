  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ גַּם אֲנִ֣י נָבִיא֮ כָּמוֹ/ךָ֒ וּ/מַלְאָ֡ךְ דִּבֶּ֣ר אֵלַ/י֩ בִּ/דְבַ֨ר יְהוָ֜ה לֵ/אמֹ֗ר הֲשִׁבֵ֤/הוּ אִתְּ/ךָ֙ אֶל בֵּיתֶ֔/ךָ וְ/יֹ֥אכַל לֶ֖חֶם וְ/יֵ֣שְׁתְּ מָ֑יִם כִּחֵ֖שׁ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/018.yaml
  text: And he said to him[a], “I also am a prophet like you, and an angel spoke to me by the word of Yahweh, saying, ‘Bring him back with you to your house, that he may eat bread and drink water.’” But he lied to him.
translation:
  language: sw
  text: Naye akamwambia, “Mimi pia ni nabii kama wewe. Malaika[a] alinena nami kwa neno la Yahweh, akisema, ‘Mrudishe pamoja nawe nyumbani kwako, ili ale mkate na anywe maji.’” Lakini alimwambia uongo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe.” Neno la Kiebrania linaweza kumaanisha malaika au mjumbe.
    reason: Neno מַלְאָךְ lina maana zote mbili, na maandishi yenyewe hayatumii neno tofauti linaloondoa kabisa uwezekano wa maana ya ‘mjumbe.’
lexical_decisions:
- source_word: נָבִיא
  choice: nabii
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mtu anayesema ujumbe wa Mungu.
- source_word: מַלְאָךְ
  choice: malaika
  rationale: Katika muktadha huu, dai la ujumbe uliotolewa kwa neno la Yahweh linaelekea kumaanisha mjumbe wa mbinguni; maana nyingine ya ‘mjumbe’ imehifadhiwa katika tanbihi.
- source_word: דִּבֶּר אֵלַי
  choice: alinena nami
  rationale: Inawasilisha mawasiliano ya moja kwa moja kwa lugha ya heshima na ya kawaida katika simulizi la kibiblia.
- source_word: בִּדְבַר יְהוָה
  choice: kwa neno la Yahweh
  rationale: Inahifadhi muundo wa kinabii na uwezekano wa ב kuonyesha njia au msingi wa ujumbe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limehifadhiwa badala ya kubadilishwa kuwa cheo.
- source_word: הֲשִׁבֵהוּ
  choice: Mrudishe
  rationale: Kauli ya Hifili ya שוב ina maana ya kumsababisha mtu arudi.
- source_word: אִתְּךָ אֶל־בֵּיתֶךָ
  choice: pamoja nawe nyumbani kwako
  rationale: Inahifadhi wazo la kuandamana na mahali anakoelekea, kwa Kiswahili kinachoeleweka.
- source_word: וְיֹאכַל לֶחֶם
  choice: ili ale mkate
  rationale: Inaonyesha kusudi linalofuata amri na kuhifadhi usemi halisi wa ‘kula mkate.’
- source_word: וְיֵשְׁתְּ מָיִם
  choice: na anywe maji
  rationale: Umbo la kitenzi limewasilishwa kama kusudi linalolingana na ‘ale.’
- source_word: כִּחֵשׁ לוֹ
  choice: Lakini alimwambia uongo
  rationale: Huu ni usemi wa asili wa Kiswahili unaoonyesha wazi kwamba madai yake kwa yule mtu hayakuwa ya kweli; ‘Lakini’ huonyesha ugeuzi wa msimulizi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la agano, hivyo limetoholewa kama ‘Yahweh’ badala ya kufichwa nyuma ya cheo.
- issue: Utambulisho wa מַלְאָךְ
  choice: malaika
  alternative: mjumbe
  rationale: Muktadha unaunga mkono mjumbe wa mbinguni, lakini neno la Kiebrania lenyewe linaweza pia kumaanisha mjumbe wa kibinadamu; utata huo umehifadhiwa kwa tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa sasa. ‘Alinena nami’ hudumisha uzito wa madai ya kinabii bila kuingiza istilahi ya dhehebu.
