  to: Baada ya jambo hili, Yeroboamu hakukengeuka kutoka katika njia yake mbaya, bali akafanya tena makuhani wa mahali pa juu kutoka miongoni mwa watu wote. Yeyote aliyependa, alimweka katika ukuhani[a], naye akawa mmoja wa makuhani wa mahali pa juu.
  rationale: Marekebisho yanahifadhi taswira ya Kiebrania ya kugeuka kutoka katika njia mbaya, yanaondoa urudufu usio wa kawaida katika sentensi ya uteuzi wa makuhani, na yanafafanua idiomu ya “kujaza mkono” bila kudokeza kimakosa kwamba mkono wa Yeroboamu mwenyewe ndio uliojazwa. Maana pana ya מִקְצוֹת הָעָם imehifadhiwa kwa “kutoka miongoni mwa watu wote,” sambamba na mkondo wa ukaguzi wa Kiingereza.
