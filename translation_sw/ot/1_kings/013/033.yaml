source:
  edition: WLC
  text: אַחַר֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹֽא שָׁ֥ב יָרָבְעָ֖ם מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וַ֠/יָּשָׁב וַ/יַּ֜עַשׂ מִ/קְצ֤וֹת הָ/עָם֙ כֹּהֲנֵ֣י בָמ֔וֹת הֶֽ/חָפֵץ֙ יְמַלֵּ֣א אֶת יָד֔/וֹ וִ/יהִ֖י כֹּהֲנֵ֥י בָמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/033.yaml
  text: After this event[a], Jeroboam did not turn from his evil way, but again made priests of high places from among all the people. Whoever desired it, he ordained him, and he became one of the priests of the high places.
translation:
  language: sw
  text: Baada ya jambo hili, Yeroboamu hakukengeuka kutoka katika njia yake mbaya, bali akafanya tena makuhani wa mahali pa juu kutoka miongoni mwa watu wote. Yeyote aliyependa, alimweka katika ukuhani[a], naye akawa mmoja wa makuhani wa mahali pa juu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “alimjaza mkono,” usemi wa Kiebrania unaomaanisha kumweka mtu katika huduma ya ukuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדָּבָר הַזֶּה
  choice: Baada ya jambo hili
  rationale: דָּבָר hapa hurejelea jambo lililotokea katika simulizi. “Jambo hili” ni tafsiri ya kawaida na yenye upana unaofaa kuliko kuibana kuwa “tukio” pekee.
- source_word: לֹא שָׁב ... מִדַּרְכּוֹ הָרָעָה
  choice: hakuiacha njia yake mbaya
  rationale: Kiebrania kina taswira ya kutorudi au kutogeuka kutoka katika njia mbaya. Kiswahili “hakuiacha njia yake mbaya” hudumisha taswira ya njia na kueleza maana kwa kawaida bila kutumia moja kwa moja istilahi ya kiteolojia “kutubu.”
- source_word: וַיָּשָׁב וַיַּעַשׂ
  choice: bali akafanya tena
  rationale: שׁוּב ikiandamana na kitenzi kinachofuata huonyesha kurudia tendo; “akafanya tena” ni Kiswahili cha kawaida kinachowasilisha hali hiyo.
- source_word: מִקְצוֹת הָעָם
  choice: kutoka miongoni mwa watu wote
  rationale: Usemi huu mgumu unaonyesha kwamba makuhani walichaguliwa kwa upana kutoka kwa watu, bila mipaka inayostahili. Tafsiri hii huepuka usemi usioeleweka wa moja kwa moja, “kutoka miisho ya watu.”
- source_word: כֹּהֲנֵי בָמוֹת
  choice: makuhani wa mahali pa juu
  rationale: בָמוֹת ni wingi wa maeneo ya ibada yaliyoinuliwa au madhabahu za mahali pa juu. Kiswahili hutumia kwa kawaida “mahali pa juu” kama jina la aina hii ya maeneo.
- source_word: הֶחָפֵץ
  choice: Yeyote aliyetaka
  rationale: Kishirikishi cha umoja chenye kiambishi bainishi kinatumika kwa maana ya jumla, yaani mtu yeyote aliyetamani wadhifa huo.
- source_word: יְמַלֵּא אֶת יָדוֹ
  choice: alimweka rasmi
  rationale: Usemi halisi wa “kujaza mkono” humaanisha kumwingiza au kumweka mtu katika huduma ya ukuhani. “Alimweka rasmi” ni wazi kwa msomaji wa sasa, huku tanbihi ikihifadhi usemi wa Kiebrania.
- source_word: וִיהִי כֹּהֲנֵי בָמוֹת
  choice: naye akawa mmoja wa makuhani wa mahali pa juu
  rationale: Kitenzi cha umoja pamoja na kiarifu cha wingi huonyesha kuingia katika kundi hilo; “mmoja wa makuhani” huwasilisha maana hiyo kwa Kiswahili sanifu.
theological_decisions:
- issue: Iwapo שׁוּב itafsiriwe kwa istilahi ya kidini “kutubu”
  choice: hakuiacha njia yake mbaya
  alternative: hakutubu na kuacha njia yake mbaya
  rationale: Ingawa muktadha unahusu mabadiliko ya kimaadili, Kiebrania kinatumia taswira ya kugeuka au kurudi kutoka katika njia. Tafsiri iliyochaguliwa haiingizi istilahi pana zaidi kuliko ilivyo katika matini.
- issue: Jinsi ya kutafsiri usemi wa kuwekwa katika ukuhani יְמַלֵּא אֶת יָדוֹ
  choice: alimweka rasmi
  alternative: alimweka wakfu; alijaza mkono wake
  rationale: Usemi huo humaanisha kumwingiza mtu katika huduma ya ukuhani. Tafsiri kuu inaeleza kazi ya tendo hilo kwa uwazi, na tanbihi inaonyesha umbo halisi la Kiebrania bila kulifanya kuwa Kiswahili kisicho cha kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. Neno “bali” linaonyesha wazi utofauti kati ya kutokuacha njia mbaya na kurudia tendo la kuwaweka makuhani.
