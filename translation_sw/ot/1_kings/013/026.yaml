source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע הַ/נָּבִיא֮ אֲשֶׁ֣ר הֱשִׁיב֣/וֹ מִן הַ/דֶּרֶךְ֒ וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָ/אֱלֹהִ֣ים ה֔וּא אֲשֶׁ֥ר מָרָ֖ה אֶת פִּ֣י יְהוָ֑ה וַ/יִּתְּנֵ֨/הוּ יְהוָ֜ה לָ/אַרְיֵ֗ה וַֽ/יִּשְׁבְּרֵ֨/הוּ֙ וַ/יְמִתֵ֔/הוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֶּר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/026.yaml
  text: When the prophet who had brought him back from the way heard it[a], he said, “It is the man of God who rebelled against the word of Yahweh; therefore Yahweh gave him to the lion, and it mauled him and killed him, according to the word of Yahweh that he spoke to him.”
translation:
  language: sw
  text: Nabii aliyekuwa amemrudisha kutoka njiani aliposikia hayo, alisema, “Ni yule mtu wa Mungu aliyeasi amri ya Yahweh[a]. Kwa hiyo, Yahweh alimkabidhi kwa simba, naye akamrarua na kumuua, sawasawa na neno ambalo Yahweh alikuwa amemwambia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyelikaidi neno la Yahweh.” Kiebrania husema kihalisi “aliyeasi dhidi ya kinywa cha Yahweh.”
    reason: Huhifadhi maana mbadala na taswira halisi ya usemi wa Kiebrania מָרָה אֶת־פִּי יְהוָה kwa Kiswahili cha kisarufi.
lexical_decisions:
- source_word: הֱשִׁיבוֹ מִן הַדֶּרֶךְ
  choice: aliyekuwa amemrudisha kutoka njiani
  rationale: Muundo wa kisababishi wa שׁוב unaonyesha kwamba nabii huyo alimfanya mtu wa Mungu arudi kutoka katika njia aliyokuwa akisafiria. ‘Kutoka njiani’ ni Kiswahili cha kawaida na kinaendeleza wazo la njia katika simulizi.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ni jina la cheo linalotumiwa katika simulizi kwa mjumbe wa Mungu; tafsiri hii hudumisha mwendelezo na matumizi ya kawaida ya kibiblia.
- source_word: מָרָה אֶת־פִּי יְהוָה
  choice: aliyeiasi amri ya Yahweh
  rationale: מָרָה humaanisha kuasi au kukaidi. Ingawa Kiebrania husema kihalisi ‘kinywa cha Yahweh,’ katika muktadha huu usemi huo unamaanisha amri aliyoinena. Tafsiri kuu ni ya kawaida kwa Kiswahili, huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limetoholewa badala ya kubadilishwa na cheo.
- source_word: וַיִּתְּנֵהוּ ... לָאַרְיֵה
  choice: Yahweh alimkabidhi kwa simba
  rationale: נתן + ל hapa ina maana ya kumtia mtu katika mamlaka ya simba au kumtoa kwake. ‘Alimkabidhi kwa simba’ huwasilisha maana hiyo kwa uwazi.
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: akamrarua
  rationale: שׁבר humaanisha kuvunja au kuponda, lakini simba akiwa mtendaji, ‘akamrarua’ huonyesha shambulio la kikatili kwa Kiswahili cha kawaida bila tafsiri ngumu ya neno kwa neno.
- source_word: וַיְמִתֵהוּ
  choice: na kumuua
  rationale: Hifili ya מות humaanisha kusababisha afe; ‘kumuua’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר לוֹ
  choice: sawasawa na neno ambalo Yahweh alikuwa amemwambia
  rationale: Kifungu kinaonyesha kutimia kwa neno la Yahweh lililokuwa limenenwa kwa mtu wa Mungu. Wakati timilifu ‘alikuwa amemwambia’ unaweka wazi kwamba neno hilo lilitangulia tukio hili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja. ‘Yahweh’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Maana ya usemi פִּי יְהוָה
  choice: amri ya Yahweh
  alternative: neno la Yahweh; kinywa cha Yahweh
  rationale: ‘Kinywa cha Yahweh’ ni umbo halisi la Kiebrania, lakini hapa humaanisha amri iliyotamkwa. ‘Amri’ inaeleweka kawaida katika muktadha, na tanbihi huhifadhi umbo halisi pamoja na mbadala mpana.
- issue: Yahweh kumkabidhi mtu wa Mungu kwa simba
  choice: Yahweh alimkabidhi kwa simba
  alternative: Yahweh alimtoa kwa simba
  rationale: Tafsiri inadumisha dai la wazi la simulizi kwamba tukio hilo lilitokea chini ya hukumu ya Yahweh, bila kulilegeza wala kuongeza maelezo ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Aliposikia hayo’ hurejelea habari za yaliyotokea katika muktadha uliotangulia; ‘akamrarua’ ni ya asili zaidi kuliko ‘akamvunja’ simba akiwa mtendaji.
