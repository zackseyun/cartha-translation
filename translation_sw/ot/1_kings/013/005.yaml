  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/מִּזְבֵּ֣חַ נִקְרָ֔ע וַ/יִּשָּׁפֵ֥ךְ הַ/דֶּ֖שֶׁן מִן הַ/מִּזְבֵּ֑חַ כַּ/מּוֹפֵ֗ת אֲשֶׁ֥ר נָתַ֛ן אִ֥ישׁ הָ/אֱלֹהִ֖ים בִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/005.yaml
  text: And the altar was torn apart[a], and the ashes were poured out from the altar, according to the sign that the man of God had given by the word of Yahweh.
translation:
  language: sw
  text: Madhabahu ikapasuka, na majivu yakamwagika kutoka madhabahuni, kulingana na ishara[a] ambayo mtu wa Mungu alikuwa ametoa kwa neno la Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama ishara” au “kulingana na ajabu au dalili.” Neno la Kiebrania מוֹפֵת linaweza kumaanisha ishara, ajabu, au dalili.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa madhabahu ya kutolea dhabihu; muktadha tayari unaonyesha matumizi yake ya ibada.
- source_word: נִקְרָע
  choice: ikapasuka
  rationale: Kitenzi קרע kinaonyesha kupasuka au kugawanyika. ‘Ikapasuka’ ni ya asili katika Kiswahili kwa madhabahu iliyotengana ghafla, huku ikihifadhi uzito wa tukio bila kutaja mtendaji ambaye Kiebrania hakumtaji.
- source_word: וַיִּשָּׁפֵךְ
  choice: yakamwagika
  rationale: שׁפך humaanisha kumwaga au kumwagika. Umbo hili la Kiswahili linafaa kwa majivu yaliyotoka madhabahuni bila kuongeza mtendaji.
- source_word: הַדֶּשֶׁן
  choice: majivu
  rationale: Katika muktadha wa madhabahu, דֶּשֶׁן ni majivu au mabaki yenye mafuta ya dhabihu. ‘Majivu’ ni tafsiri wazi na ya kawaida bila maelezo ya kiufundi yasiyohitajika.
- source_word: מִן הַמִּזְבֵּחַ
  choice: kutoka madhabahuni
  rationale: Hii inaeleza kwa kawaida mahali majivu yalipotoka na kuwakilisha moja kwa moja מן.
- source_word: כַּמּוֹפֵת
  choice: kulingana na ishara
  rationale: מוֹפֵת inaweza kumaanisha ishara, ajabu, au dalili ya tukio lijalo; hapa כְּ inaonyesha kuwa tukio lilitokea sawasawa na ishara iliyotolewa.
- source_word: אֲשֶׁר נָתַן
  choice: ambayo ... alikuwa ametoa
  rationale: נתן ni ‘kutoa,’ na wakati timilifu ‘alikuwa ametoa’ unaonyesha kwa kawaida kuwa ishara hiyo ilitangulia kutimia kwake.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hii inahifadhi cheo cha Kiebrania bila kukifasiri kwa kulibadili kuwa ‘nabii,’ ingawa mtu huyo anafanya kazi ya kinabii.
- source_word: בִּדְבַר יְהוָה
  choice: kwa neno la Yahweh
  rationale: Hii inahifadhi usemi wa Kiebrania na haiufinyangi דבר kuwa ‘amri’ pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Uhusiano wa ishara na tukio
  choice: kulingana na ishara
  alternative: kama ishara; kulingana na ajabu/dalili
  rationale: Tafsiri hii inaonyesha kwamba kupasuka kwa madhabahu na kumwagika kwa majivu kulitokea kwa kupatana na ishara iliyotangazwa, huku tanbihi ikihifadhi upana wa maana ya מוֹפֵת.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘Ikapasuka’ na ‘yakamwagika’ huendeleza mfululizo wa matukio kwa njia ya asili; ‘mtu wa Mungu’ huhifadhi cheo cha chanzo.
