base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/034.yaml
  text: And this matter became sin for the house of Yarovam[b][a], to cut it off and to destroy it from the face of the ground.
translation:
  language: sw
  text: Jambo hili[a] likawa dhambi kwa nyumba ya Yeroboamu, kiasi cha kuikomesha na kuiangamiza kutoka juu ya uso wa ardhi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kitu hiki.” Neno la Kiebrania דָּבָר linaweza kumaanisha jambo, tukio, au kitu kwa upana.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kutoka juu ya uso wa ardhi”; hii ni nahau inayomaanisha kuondolewa kabisa nchini au duniani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: likawa
  rationale: 'Kitenzi hiki kinaonyesha matokeo ya jambo lililotangulia: jambo hilo likaja kuwa dhambi kwa nyumba ya Yeroboamu.'
- source_word: בַּדָּבָר הַזֶּה
  choice: Jambo hili
  rationale: Neno דָּבָר hapa linaelekeza kwa upana kwenye jambo au mwenendo uliosimuliwa, si lazima kwenye neno lililosemwa.
- source_word: לְחַטַּאת
  choice: dhambi
  rationale: Muundo wa Kiebrania unaonyesha kwamba jambo hilo likawa dhambi au chanzo cha hukumu; tafsiri fupi “dhambi” inadumisha upana huo.
- source_word: בֵּית יָרָבְעָם
  choice: nyumba ya Yeroboamu
  rationale: “Nyumba” inadumisha nahau ya Kiebrania inayoweza kumaanisha familia, ukoo, au nasaba ya kifalme bila kuibana kwa maana moja.
- source_word: וּלְהַכְחִיד
  choice: kuiondoa
  rationale: Kitenzi hiki katika Hifili humaanisha kusababisha kitu kitoweke au kiondolewe. “Kuiondoa” ni wazi na kinatofautishwa na kitenzi kinachofuata.
- source_word: וּלְהַשְׁמִיד
  choice: kuiangamiza
  rationale: “Kuiangamiza” linawasilisha nguvu ya שׁמד na kuhifadhi jozi ya vitenzi vya hukumu.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: kutoka juu ya uso wa ardhi
  rationale: Tafsiri hii inadumisha taswira na uzito wa nahau ya Kiebrania, ambayo humaanisha kuondolewa kabisa katika nchi au duniani.
theological_decisions:
- issue: Kirejelewa cha viambishi katika “kuiondoa na kuiangamiza”
  choice: Viambishi vinarejelea nyumba ya Yeroboamu, yaani familia au nasaba yake.
  alternative: Vitenzi vinaweza kueleweka kuwa vinarejelea kwa ujumla jambo hilo la dhambi.
  rationale: Kisintaksia, “nyumba ya Yeroboamu” ndicho kirejelewa cha karibu na chenye maana inayolingana zaidi na muktadha wa hukumu juu ya nasaba. Kiambishi “-i-” kinaweka wazi kirejelewa kilichodokezwa bila kuongeza dai jipya.
- issue: Uhusiano wa kishazi cha mwisho na dhambi
  choice: “Hata” linaacha wazi wazo la matokeo yanayoelekea kwenye kuondolewa kwa nyumba hiyo.
  alternative: Kishazi kinaweza kutafsiriwa kwa uwazi zaidi kuwa kusudi, kwa mfano “ili kuiondoa.”
  rationale: Kiambishi לְ cha Kiebrania kinaweza kuonyesha kusudi au matokeo. “Hata” kinadumisha mvutano huo badala ya kuamua kabisa upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Nyumba ya Yeroboamu” imehifadhiwa kama nahau ya kifamilia au kinasaba; “nasaba” haijaingizwa moja kwa moja ili kutofunga maana. Alama zote za tanbihi zimewekwa katika matini kuu.
