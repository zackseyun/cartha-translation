  yaml_path: translation/ot/1_kings/013/023.yaml
  text: And it happened[a], after he had eaten bread and after he had drunk, that he saddled the donkey for him, for the prophet whom he had brought back.
translation:
  language: sw
  text: Ikawa, baada ya kula chakula na kunywa, akamfungia punda yule nabii aliyemrudisha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyemfanya arudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni kiashiria cha kawaida cha masimulizi kinachoendeleza tukio linalofuata bila kutumia lugha ya kizamani.
- source_word: אַחֲרֵי אָכְלוֹ לֶחֶם
  choice: baada ya yeye kula chakula
  rationale: Muundo wa wakati umehifadhiwa; לֶחֶם hapa inaweza kumaanisha mkate au chakula kwa upana, na “chakula” ni Kiswahili cha kawaida katika muktadha wa kula mlo.
- source_word: וְאַחֲרֵי שְׁתוֹתוֹ
  choice: na baada ya kunywa
  rationale: Kitenzi hakina kitu kilichotajwa; tafsiri haisemi alikunywa maji au divai.
- source_word: וַיַּחֲבָשׁ
  choice: akamtandikia
  rationale: חבש katika muktadha wa mnyama humaanisha kumwekea matandiko ya kupandia; “kumtandikia punda” ni usemi wa Kiswahili unaofaa.
- source_word: לוֹ
  choice: kwa ajili yake
  rationale: Huwasilisha kwamba punda alitandikwa ili mtu huyo amtumie, huku ikihifadhi kiwakilishi cha Kiebrania.
- source_word: הַחֲמוֹר
  choice: punda
  rationale: Hili ndilo neno la kawaida na la sasa la Kiswahili kwa mnyama huyo.
- source_word: לַנָּבִיא
  choice: kwa ajili ya nabii
  rationale: Kiebrania kinasema wazi “nabii,” si “mtu wa Mungu”; urudiaji wa “kwa ajili ya” unafuata ufafanuzi wa sentensi ya chanzo.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: ambaye alikuwa amemrudisha
  rationale: Hifili ya שוב ina maana ya kumfanya mtu arudi au kumrudisha; “amemrudisha” ni ya kawaida na inafaa muktadha.
