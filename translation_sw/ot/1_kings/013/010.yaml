lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Basi akaenda
  rationale: Mfuatano wa waw pamoja na kitenzi unaendeleza simulizi; “Basi akaenda” ni Kiswahili cha kawaida kinachoonyesha hatua iliyofuata.
- source_word: בְּדֶרֶךְ אַחֵר
  choice: kwa njia nyingine
  rationale: דֶּרֶךְ hapa humaanisha njia au barabara; usemi huu unadumisha tofauti na njia aliyotumia alipokuja.
- source_word: וְלֹא שָׁב
  choice: wala hakurudi
  rationale: שׁוּב katika muktadha huu ni kurudi; “wala” huunganisha kwa kawaida tendo hili hasi na sentensi iliyotangulia.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָהּ
  choice: kwa njia ile aliyotumia kuja
  rationale: Kifungu hususaisha njia ya awali; “aliyotumia kuja” huwasilisha kwa uwazi kiwakilishi cha Kiebrania kinachorejelea דֶּרֶךְ bila kufanya Kiswahili kuwa kizito.
- source_word: אֶל בֵּית אֵל
  choice: Betheli
  rationale: בֵּית אֵל ni jina la mahali; umbo la Kiswahili “Betheli” linatumika kwa kawaida. Katika muundo wa Kiswahili, “kuja Betheli” halihitaji kihusishi tofauti ili kuonyesha mahali alikokuwa ameelekea.
