  text: And their father said to them, “Which way did he go?” For his sons had seen the way that the man of God, who came from Judah, had gone.
translation:
  language: sw
  text: Baba yao akawaambia, “Alipitia njia gani?” Kwa maana wanawe walikuwa wameiona njia ambayo mtu wa Mungu aliyekuwa ametoka Yuda aliipitia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: akawauliza
  rationale: Ingawa kitenzi kwa msingi ni ‘akanena/akasema nao,’ hapa kinaanzisha swali la moja kwa moja; ‘akawauliza’ ni Kiswahili cha kawaida kinachowasilisha kazi yake katika muktadha.
- source_word: אֲבִיהֶם
  choice: Baba yao
  rationale: Kiambishi cha Kiebrania ni cha wingi, ‘yao,’ kikirejelea wale wana waliotajwa katika muktadha.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: kwa njia gani
  rationale: Usemi huu unauliza ni njia ipi aliyotumia, si mahali alipo tu; ‘kwa njia gani’ ni wazi na wa kawaida katika Kiswahili.
- source_word: הָלָךְ
  choice: alikwenda / aliyopitia
  rationale: Katika swali ‘alikwenda’ hufuata maana ya msingi ya kwenda; katika maelezo ya njia, ‘aliyopitia’ ni usemi wa asili zaidi wa Kiswahili bila kubadili maana.
- source_word: וַיִּרְאוּ
  choice: walikuwa wameiona
  rationale: Kauli timilifu iliyopita inaonyesha kwa kawaida kwamba wana walikuwa wameiona njia kabla baba yao hajauliza; pia inafaa na nguvu ya maelezo ya kiunganishi.
- source_word: בָנָיו
  choice: wanawe
  rationale: Kiambishi ni cha umoja, ‘wake,’ kikirejelea baba huyo; ‘wanawe’ ni umbo la Kiswahili lililo wazi na la kawaida.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Huhifadhi jina la Kiebrania bila kulifasiri kwa namna nyembamba zaidi kuwa ‘nabii.’
- source_word: מִיהוּדָה
  choice: aliyetoka Yuda
  rationale: Kihusishi kinaonyesha mahali alikotoka; ‘aliyetoka Yuda’ ni Kiswahili cha kawaida na sahihi.
