base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/003.yaml
  text: 'And on that day he gave a sign[a], saying, “This is the sign that Yahweh has spoken: behold, the altar will be torn apart[b], and the ashes that are on it will be poured out.”'
translation:
  language: sw
  text: 'Siku hiyo akatoa ishara[a], akisema, “Hii ndiyo ishara ambayo Yahweh amesema: Tazama, madhabahu itapasuka, nayo majivu[b] yaliyo juu yake yatamwagika.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ajabu” au “ishara ya ajabu” kwa neno “ishara” (Kiebrania מוֹפֵת).
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “majivu” linaweza kurejelea hasa majivu yenye mafuta au mabaki ya dhabihu yaliyo juu ya madhabahu.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַן בַּיּוֹם הַהוּא
  choice: Siku hiyo akatoa
  rationale: Muundo huu wa Kiswahili ni wa kawaida katika simulizi na unaonyesha kwamba siku hiyo mtu wa Mungu alitoa ishara ya kuthibitisha ujumbe wake.
- source_word: מוֹפֵת
  choice: ishara
  rationale: Neno hili linaweza kumaanisha ishara, ajabu, au dalili ya kinabii. Katika muktadha huu ni uthibitisho wa mara moja wa neno la kinabii, hivyo “ishara” linafaa zaidi bila kuzidisha upande wa kimuujiza.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huu ni utangulizi wa kawaida na wa asili wa maneno yaliyonukuliwa moja kwa moja.
- source_word: זֶה הַמּוֹפֵת
  choice: Hii ndiyo ishara
  rationale: “Ndiyo” linahifadhi msisitizo wa kiashiria cha Kiebrania na kurudia “ishara” kunadumisha ulinganifu wa מוֹפֵת ndani ya mstari.
- source_word: דִּבֶּר יְהוָה
  choice: Yahweh amesema
  rationale: Wakati timilifu wa Kiswahili unaonyesha neno ambalo tayari limetamkwa na ambalo ishara inayotajwa italithibitisha.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linahifadhi nguvu ya kuvuta fikira na uzito wa tangazo la kinabii, huku likibaki wazi kwa msomaji wa kawaida.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mahali pa kutolea dhabihu.
- source_word: נִקְרָע
  choice: itapasuka
  rationale: Kauli tendwa ya Kiebrania inaeleza madhabahu kugawanyika au kuraruka. Kwa kitu kigumu kama madhabahu, “itapasuka” ni ya asili na inaonyesha tukio linalotabiriwa.
- source_word: וְנִשְׁפַּךְ
  choice: yatamwagika
  rationale: Kitenzi kina maana ya kumwagwa au kumiminika. “Yatamwagika” ni usemi wa asili kwa majivu yatakayoanguka kutoka madhabahuni.
- source_word: הַדֶּשֶׁן
  choice: majivu
  rationale: Katika mazingira ya dhabihu neno hili linaweza kumaanisha hasa masalio yenye mafuta ya dhabihu zilizoteketezwa. “Majivu” ni tafsiri iliyo wazi, na maana mahususi imehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר עָלָיו
  choice: yaliyo juu yake
  rationale: Kishazi hiki kinaonyesha wazi kwamba majivu yako juu ya madhabahu; kiwakilishi “yake” kinarejelea madhabahu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה. “Yahweh” huhifadhi jina hilo badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Tazama” inadumisha uzito wa tangazo la kinabii, na “madhabahu itapasuka” ni ya asili zaidi kuliko taswira ya kitu hicho “kuraruliwa.” Alama ya tanbihi [b] imewekwa baada ya “majivu,” ambako maelezo yake yanahusika moja kwa moja.
