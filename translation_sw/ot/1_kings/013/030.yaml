  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi na hadhi inayofaa maandiko. “Maiti” ni wazi kuliko “mwili” katika kutaja mwili uliokufa; “kumwombolezea” hubeba maana ya maombolezo ya marehemu. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
