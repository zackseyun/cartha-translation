base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/030.yaml
  text: And he laid his corpse in his own tomb[a], and they mourned over him, saying, “Alas[b], my brother!”
translation:
  language: sw
  text: Akaiweka maiti yake katika kaburi lake mwenyewe, nao wakamwombolezea[a], wakisema, “Ole, ndugu yangu!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamlilia kwa maombolezo.” Kitenzi cha Kiebrania hueleza kumwombolezea marehemu, mara nyingi kwa kilio rasmi.
    reason: lexical_alternative
  - marker: b
    text: Huenda “ndugu yangu” ni kauli ya maombolezo inayoonyesha ukaribu au mshikamano, wala si lazima iwe taarifa kwamba walikuwa ndugu wa damu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּנַּח
  choice: Akaiweka
  rationale: Hifili ya נוח hapa ina maana ya kuweka au kulaza kitu mahali. “Akaiweka” ni ya kawaida katika Kiswahili na inafaa katika muktadha wa maziko.
- source_word: נִבְלָתוֹ
  choice: maiti yake
  rationale: נְבֵלָה humaanisha mwili uliokufa. “Maiti yake” ni wazi, yenye heshima, na huhifadhi maana hiyo bila ukali usio wa lazima.
- source_word: בְּקִבְרוֹ
  choice: katika kaburi lake mwenyewe
  rationale: קֶבֶר inaweza kumaanisha kaburi au pango/chumba cha kuzikia. “Kaburi” ni neno la kawaida la Kiswahili, na “lake mwenyewe” huonyesha kuwa kiambishi cha umilikaji kinarejelea kaburi la nabii mzee aliyemzika.
- source_word: וַיִּסְפְּדוּ
  choice: wakamwombolezea
  rationale: ספד hueleza kumlilia au kumwombolezea marehemu, mara nyingi kwa maombolezo rasmi. “Wakamwombolezea” huwasilisha tendo hilo kwa lugha ya sasa na yenye hadhi.
- source_word: עָלָיו
  choice: -mwombolezea
  rationale: Katika Kiswahili, yule anayeliliwa huonyeshwa kiasili kwa kiambishi cha yambwa katika kitenzi “kumwombolezea,” badala ya kutafsiri עַל neno kwa neno.
- source_word: הוֹי
  choice: Ole
  rationale: הוֹי ni kihisishi cha huzuni katika maombolezo. “Ole” huhifadhi sauti ya kilio kifupi na kizito katika muktadha huu, bila kuifanya kuwa tamko la hukumu.
- source_word: אָחִי
  choice: ndugu yangu
  rationale: אָח maana yake ya msingi ni “ndugu wa kiume,” lakini katika kilio hiki ni kauli ya ukaribu na mshikamano. “Ndugu yangu” huhifadhi lugha ya kifamilia huku ikibaki ya kawaida katika Kiswahili.
