translation:
  language: sw
  text: Ndipo mfalme akamwambia mtu wa Mungu, “Njoo nami nyumbani kwangu, ule chakula,[a] nami nitakupa zawadi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ujitie nguvu” au “upate nafuu”; kitenzi cha Kiebrania kinaweza kumaanisha kujitia nguvu au kupata nafuu, mara nyingi kwa kula chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Ndipo ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” pamoja na “akamwambia” ni Kiswahili cha kawaida kinachoonyesha mfuatano na anayeelekezewa maneno.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye hali ya uainisho; katika Kiswahili muktadha huonyesha kuwa ni mfalme huyo.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Inahifadhi msemo wa Kiebrania bila kuufasiri moja kwa moja kuwa “nabii,” ingawa mhusika anatenda kazi ya kinabii.
- source_word: בֹּאָה
  choice: Njoo
  rationale: Amri hii yenye he ya mwisho ina mwaliko wa kawaida; “Njoo” ni ya asili bila kuongeza kwa lazima neno la heshima lisilo wazi.
- source_word: אִתִּי הַבַּיְתָה
  choice: nyumbani pamoja nami
  rationale: Kiambishi cha mwelekeo katika הַבַּיְתָה kinaonyesha kwenda nyumbani/kwenye nyumba; mpangilio huu ni wa kawaida katika Kiswahili.
- source_word: וּסְעָדָה
  choice: ule chakula
  rationale: סעד humaanisha kujitia nguvu au kujisitiri, mara nyingi kwa kula. Katika mwaliko huu, “ule chakula” huwasilisha maana ya mlo kwa uwazi huku tanbihi ikihifadhi upana wa kitenzi.
- source_word: וְאֶתְּנָה לְךָ
  choice: nami nitakupa
  rationale: Huwasilisha kwa kawaida ahadi au toleo la mfalme la kumpa kitu.
- source_word: מַתָּת
  choice: zawadi
  rationale: “Zawadi” ni neno lisiloegemea upande wa malipo; “thawabu” lingeweza kuongeza dhana ya ujira isiyo wazi katika chanzo.
