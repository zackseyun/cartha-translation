translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Mtu wa Mungu” imehifadhiwa kama msemo muhimu wa chanzo, na maana pana ya וּסְעָדָה imeelezwa katika tanbihi.
