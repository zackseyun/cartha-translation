  text: וַ/יִּקְרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בִּ/דְבַ֣ר יְהוָ֔ה וַ/יֹּ֨אמֶר֙ מִזְבֵּ֣חַ מִזְבֵּ֔חַ כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנֵּֽה בֵ֞ן נוֹלָ֤ד לְ/בֵית דָּוִד֙ יֹאשִׁיָּ֣הוּ שְׁמ֔/וֹ וְ/זָבַ֣ח עָלֶ֗י/ךָ אֶת כֹּהֲנֵ֤י הַ/בָּמוֹת֙ הַ/מַּקְטִרִ֣ים עָלֶ֔י/ךָ וְ/עַצְמ֥וֹת אָדָ֖ם יִשְׂרְפ֥וּ עָלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/002.yaml
  text: 'And he cried out against the altar by the word of Yahweh and said[a], “Altar, altar, thus says Yahweh: Behold, a son will be born to the house of David, Josiah by name, and he will sacrifice on you the priests of the high places who burn incense on you[c][b], and human bones will be burned on you.”'
translation:
  language: sw
  text: 'Kwa neno la Yahweh, akatangaza dhidi ya madhabahu na kusema[a], “Ee madhabahu, ee madhabahu! Yahweh asema hivi: Tazama, mwana atazaliwa katika nyumba ya Daudi; jina lake litakuwa Yosia. Atawatoa makuhani wa mahali pa juu kuwa dhabihu juu yako[b], hao wanaofukiza uvumba juu yako[c], na mifupa ya wanadamu[d] itachomwa juu yako.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa agizo la Yahweh” au “kulingana na neno la Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Au, “atawachinja juu yako.” Kitenzi cha Kiebrania kina maana ya kuchinja kwa ajili ya dhabihu, jambo linalosisitiza kunajisiwa kwa madhabahu.
    reason: lexical_alternative
  - marker: c
    text: Au, “hao wanaofukiza sadaka juu yako.” Kitenzi cha Kiebrania kinaweza kuhusisha uvumba au sadaka nyingine zinazoteketezwa.
    reason: lexical_alternative
  - marker: d
    text: Kiebrania ni “mifupa ya אדם”; hapa אדם linamaanisha wanadamu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא עַל הַמִּזְבֵּחַ
  choice: akatangaza dhidi ya madhabahu
  rationale: Kitenzi קרא pamoja na עַל hapa kinaonyesha tangazo la kinabii lenye nguvu lililoelekezwa dhidi ya madhabahu. “Akatangaza dhidi ya” ni la kawaida na linaweka wazi mwelekeo wa hukumu.
- source_word: בִּדְבַר יְהוָה
  choice: Kwa neno la Yahweh
  rationale: Kirai kinaweza kuonyesha mamlaka, chanzo, au agizo la ujumbe wa kinabii. “Kwa neno la Yahweh” huhifadhi upana huo bila kuamua zaidi ya Kiebrania.
- source_word: מִזְבֵּחַ מִזְבֵּחַ
  choice: Ee madhabahu, ee madhabahu
  rationale: Kurudia kwa mwito kumehifadhiwa; “Ee” hufanya usemi wa moja kwa moja kwa kitu kilichopewa sifa ya kusikiliza uwe wa asili na wenye uzito katika Kiswahili.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Hili ni tamko la kawaida la mjumbe wa kinabii. Muundo huu ni sahihi, wa heshima, na wa kawaida katika Kiswahili.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huelekeza usikivu kwenye tangazo zito la kinabii; “Tazama” huhifadhi nguvu hiyo.
- source_word: בֵן נוֹלָד לְבֵית דָּוִד
  choice: mwana atazaliwa katika nyumba ya Daudi
  rationale: Ingawa נוֹלָד ni umbo la kushirikisha la kutendwa, katika unabii huu linaelekeza kwenye tukio la baadaye. “Nyumba ya Daudi” huhifadhi maana ya ukoo wa kifalme na pia taswira ya Kiebrania.
- source_word: יֹאשִׁיָּהוּ שְׁמוֹ
  choice: jina lake Yosia
  rationale: Huu ni usemi mfupi na wa asili wa Kiswahili unaohifadhi utambulisho mahususi uliotolewa katika unabii.
- source_word: וְזָבַח עָלֶיךָ
  choice: Juu yako atawatoa dhabihu
  rationale: זבח lina sauti ya ibada na linaweza kumaanisha kuchinja kwa ajili ya dhabihu. “Atawatoa dhabihu” huhifadhi kejeli ya kutisha ya makuhani wenyewe kutendewa kama dhabihu juu ya madhabahu.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: makuhani wa mahali pa juu pa ibada
  rationale: במות ni maeneo ya ibada yaliyoinuka au vituo vya kienyeji vya ibada. Kuongeza “pa ibada” huzuia msomaji wa sasa kuelewa kuwa ni mahali palipoinuka tu.
- source_word: הַמַּקְטִרִים עָלֶיךָ
  choice: wanaofukiza uvumba juu yako
  rationale: Katika Hifili, קטר mara nyingi hurejelea kufanya moshi wa sadaka upae, hasa kwa kufukiza uvumba. Tafsiri kuu ni wazi, huku tanbihi ikihifadhi uwezekano mpana zaidi.
- source_word: וְעַצְמוֹת אָדָם
  choice: mifupa ya wanadamu
  rationale: אָדָם limetumiwa kwa maana ya jumla ya binadamu, si mwanamume mmoja wala jina la Adamu. “Wanadamu” huwasilisha maana hiyo kwa usahihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano, Tetragramatoni, moja kwa moja. “Yahweh” huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Maana ya זבח wakati makuhani ndio watendewa tendo hilo
  choice: atawatoa dhabihu
  alternative: atawachinja
  rationale: Tafsiri iliyochaguliwa huhifadhi sauti ya ibada na kuvunjiwa heshima kwa madhabahu. “Atawachinja” ni tafsiri halali lakini hupunguza kwa kiasi fulani kejeli ya kisadaka.
- issue: Maana ya אָדָם katika עצמות אדם
  choice: wanadamu
  alternative: mtu; mwanadamu
  rationale: Hapa neno ni la kijumla na linaeleza aina ya mifupa, si jinsia ya mtu fulani. Wingi wa kijumla ni wa asili katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kinabii lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya mwito na taswira ya madhabahu inayosemeshwa yamehifadhiwa. “Mahali pa juu pa ibada” limetumiwa badala ya “mahali pa juu” peke yake kwa uwazi wa maana ya kitamaduni.
