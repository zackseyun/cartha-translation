base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/022.yaml
  text: but you came back and ate bread and drank water in the place about which he said to you[a], ‘Do not eat bread, and do not drink water’—your corpse shall not come to the tomb of your fathers.
translation:
  language: sw
  text: Lakini ulirudi, ukala mkate na ukanywa maji mahali pale ambako alikuambia, ‘Usile mkate wala usinywe maji’—maiti yako haitafika kwenye kaburi la baba zako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maiti yako haitaingia katika kaburi la baba zako.” Kiebrania kinasema kihalisi, “haitafika kwenye kaburi la baba zako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: ulirudi
  rationale: Kitenzi שוב katika mfululizo wa masimulizi kinamaanisha kurudi; hapa nabii anamwambia mtu wa Mungu moja kwa moja.
- source_word: וַתֹּאכַל לֶחֶם
  choice: ukala mkate
  rationale: Neno halisi ‘mkate’ limehifadhiwa badala ya kujumlisha kuwa ‘chakula,’ ili kurudia kwa usahihi katazo la awali.
- source_word: וַתֵּשְׁתְּ מַיִם
  choice: na kunywa maji
  rationale: Tafsiri ya moja kwa moja inayohifadhi maneno yanayorudiwa katika katazo.
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: mahali pale ambapo alikuambia
  rationale: Kiswahili cha kawaida na wazi kinachounganisha mahali na katazo lililotolewa kuhusu mahali hapo.
- source_word: אַל תֹּאכַל לֶחֶם וְאַל תֵּשְׁתְּ מָיִם
  choice: ‘Usile mkate wala usinywe maji’
  rationale: Muundo wa katazo la moja kwa moja na ‘wala’ unahifadhi marudio na nguvu ya maneno ya Kiebrania.
- source_word: נִבְלָתְךָ
  choice: maiti yako
  rationale: ‘Maiti’ ni neno la Kiswahili lililo wazi na lenye heshima kwa mwili wa mtu aliyekufa, huku likihifadhi ukali wa hukumu.
- source_word: לֹא תָבוֹא נִבְלָתְךָ אֶל קֶבֶר אֲבֹתֶיךָ
  choice: maiti yako haitafika kwenye kaburi la baba zako
  rationale: Inahifadhi taswira ya Kiebrania ya maiti ‘kufika’ kaburini bila kuongeza kauli tendwa isiyosemwa wazi katika chanzo.
- source_word: אֲבֹתֶיךָ
  choice: baba zako
  rationale: Inahifadhi wingi wa kiume na wazo la ukoo wa upande wa baba pamoja na mahali pa maziko ya familia.
theological_decisions:
- issue: Asili ya tamko la hukumu
  choice: Tamko halisi kwamba maiti ya mtu wa Mungu haitafika kwenye kaburi la baba zake
  alternative: Tamko la mfano kwa upana kuhusu kuaibishwa baada ya kifo
  rationale: Kiebrania kinakazia maiti kutofika kwenye kaburi la baba zake; tafsiri inadumisha maana hiyo halisi bila kuongeza athari za kitheolojia ambazo mstari hauzitaji wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Mahali pale ambapo’ hutoa mtiririko wa asili; ‘maiti’ huepuka ukali usiofaa wa ‘mzoga.’ Alama [a] imewekwa baada ya kifungu kinachofafanuliwa.
