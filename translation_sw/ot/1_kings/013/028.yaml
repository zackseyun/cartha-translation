base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/028.yaml
  text: He went and found his corpse thrown on the road[a], with the donkey and the lion standing beside the corpse. The lion had not eaten the corpse[b], nor had it torn apart the donkey.
translation:
  language: sw
  text: Akaenda, akakuta maiti yake ikiwa imetupwa barabarani,[a] huku punda na simba wamesimama kando ya maiti hiyo. Simba hakuwa ameila maiti hiyo, wala hakumrarua punda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwili wake” au “mzoga wake.” Neno la Kiebrania נְבֵלָה humaanisha maiti au mzoga, na ni neno kali linalosisitiza hakika ya kifo.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, kwa neno kwa neno, “wala hakumvunja punda”; katika muktadha huu maana yake ni kwamba simba hakumrarua wala kumponda punda.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָתוֹ / הַנְּבֵלָה
  choice: mwili wake / mwili huo
  rationale: Neno נְבֵלָה linamaanisha mwili uliokufa au mzoga. Kwa mtu, “mwili” ni Kiswahili cha kawaida na chenye heshima; tanbihi inadumisha ukali wa neno la Kiebrania.
- source_word: מֻשְׁלֶכֶת
  choice: umelala umetupwa
  rationale: Kitenzi hiki ni hali ya kutendwa kutoka שׁלך, “kutupa.” “Umelala umetupwa” ni ya asili kwa Kiswahili na bado inaonyesha kwamba mwili ulikuwa umetupwa chini, si kwamba ulikuwa umelala tu.
- source_word: בַּדֶּרֶךְ
  choice: barabarani
  rationale: Hapa דֶּרֶךְ ni barabara au njia yenyewe; “barabarani” ni usemi wa kawaida na sahihi.
- source_word: עֹמְדִים אֵצֶל
  choice: wamesimama kando ya
  rationale: Huhifadhi picha ya punda na simba wakiwa bado karibu kabisa na mwili.
- source_word: לֹא אָכַל
  choice: hakuwa ameula
  rationale: אָכַל ni kitenzi cha kawaida “kula”; hali timilifu inaonyesha jambo ambalo mzee alilikuta halijatendeka.
- source_word: שָׁבַר אֶת הַחֲמוֹר
  choice: hakumrarua punda
  rationale: שׁבר kimsingi ni “kuvunja,” lakini kuhusu simba na punda muktadha unaelekea kumaanisha kuponda au kurarua. “Kumrarua” ni Kiswahili cha kawaida kinachowasilisha maana hiyo bila kupunguza ukali wa picha.
- source_word: וַיֵּלֶךְ וַיִּמְצָא
  choice: Akaenda, akaukuta
  rationale: Vitenzi vinavyofuatana vya simulizi vimetafsiriwa kwa viambishi vya mfululizo “aka-,” jambo la asili katika masimulizi ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “aka-” unadumisha mtiririko wa simulizi. “Mwili” umetumiwa katika maandishi makuu kwa kuwa ni wa kawaida kwa marejeo ya mtu, huku tanbihi ikihifadhi ukali na mbadala wa נְבֵלָה.
