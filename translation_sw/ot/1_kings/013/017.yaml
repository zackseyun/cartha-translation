  text: 'For a word came to me by the word of the LORD: ‘You shall not eat bread, and you shall not drink water there; you shall not return by going on the way by which you went.’'
translation:
  language: sw
  text: Kwa maana niliambiwa kwa neno la BWANA, ‘Usile mkate wala usinywe maji huko; wala usirudi kwa kupita njia ile uliyopita.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָבָר אֵלַי בִּדְבַר יְהוָה
  choice: niliambiwa kwa neno la BWANA
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba agizo lilimfikia kupitia neno la YHWH, huku ukihifadhi kurudiwa kwa wazo la ‘neno’ bila tungo nzito ya ‘neno lilikuja kwangu kwa neno’.
- source_word: לֹא תֹאכַל לֶחֶם
  choice: Usile mkate
  rationale: Tafsiri ya moja kwa moja ya katazo; ‘mkate’ huhifadhi neno לֶחֶם bila kulipanua kimuktadha kuwa chakula kwa ujumla.
- source_word: וְלֹא תִשְׁתֶּה שָׁם מָיִם
  choice: wala usinywe maji huko
  rationale: ‘Wala’ huunganisha katazo la pili kwa kawaida, na ‘huko’ huhifadhi שָׁם.
- source_word: לֹא תָשׁוּב לָלֶכֶת בַּדֶּרֶךְ אֲשֶׁר הָלַכְתָּ בָּהּ
  choice: wala usirudi kwa kupitia njia ile uliyopita
  rationale: Huhifadhi wazo la kutorudi kwa kwenda kupitia njia ileile, kwa Kiswahili kinachoeleweka na kisichoondoa msisitizo wa kitenzi cha kwenda.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa ‘BWANA’ kwa herufi kubwa.
theological_decisions:
- issue: Chanzo na mamlaka ya agizo
  choice: kwa neno la BWANA
  alternative: kwa amri ya BWANA
  rationale: ‘Neno’ huhifadhi דְבַר kwa ukaribu na halibadili usemi huo kuwa istilahi iliyofasiriwa zaidi ya ‘amri’.
translation_notes:
