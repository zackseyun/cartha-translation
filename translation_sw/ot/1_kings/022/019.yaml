base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/019.yaml
  text: 'Then he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing by him[b], on his right and on his left.”'
translation:
  language: sw
  text: 'Ndipo akasema, “Kwa hiyo, sikia neno la Yahwe: Nilimwona Yahwe ameketi juu ya kiti chake cha enzi, na jeshi lote la mbinguni[a] limesimama kando yake[b], upande wake wa kulia na wa kushoto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kundi lote la mbinguni” au “majeshi yote ya mbinguni.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “juu yake.” Katika muktadha huu huenda maana yake ni kusimama karibu naye wakimhudumia, kama inavyofafanuliwa na maneno “upande wake wa kulia na wa kushoto.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho au matokeo yanayotokana na mazungumzo yaliyotangulia, huku ikidumisha uzito wa kauli ya kinabii.
- source_word: שְׁמַע
  choice: lisikie
  rationale: 'Ni amri ya umoja inayoelekezwa kwa msikilizaji mmoja; kiambishi cha ngeli kinarejelea ‘neno’ na kutoa Kiswahili cha asili: ‘lisikie neno.’'
- source_word: דְּבַר יְהוָה
  choice: neno la Yahwe
  rationale: Hudumisha fomula ya kawaida ya kinabii na maana pana ya דָּבָר bila kuibana kuwa ‘ujumbe’ pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa Tetragramatoni badala ya kulibadilisha kuwa cheo.
- source_word: רָאִיתִי
  choice: Nilimwona
  rationale: Wakati uliopita unafaa kwa taarifa ya Mika kuhusu maono aliyoyaona; kiambishi -mw- kinamrejelea Yahwe kama mtendewa.
- source_word: יֹשֵׁב עַל כִּסְאוֹ
  choice: ameketi juu ya kiti chake cha enzi
  rationale: Huwasilisha kwa uwazi hali endelevu ya kuketi katika mazingira ya kifalme bila kuongeza tafsiri zaidi ya maandishi.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: jeshi lote la mbinguni
  rationale: Neno צָבָא lina maana ya jeshi au kundi lililopangwa; tafsiri hii huhifadhi taswira ya kundi la mbinguni bila kulibainisha kuwa malaika pekee.
- source_word: עֹמֵד
  choice: limesimama
  rationale: Kitenzi cha umoja kinakubaliana kwa kawaida na nomino ya mkusanyiko ‘jeshi’ na kudumisha taswira hai ya maono.
- source_word: עָלָיו
  choice: kando yake
  rationale: Katika mandhari ya chumba cha enzi, maana inayofaa ni kusimama karibu naye katika huduma, kama inavyofafanuliwa na pande za kulia na kushoto; tanbihi inadumisha maana halisi inayowezekana ya ‘juu yake.’
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: upande wake wa kulia na wa kushoto
  rationale: Huhifadhi ulinganifu wa nafasi katika Kiebrania kwa Kiswahili cha kawaida na kinachoeleweka.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה katika maono ya chumba cha enzi
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa צְבָא הַשָּׁמַיִם katika baraza la mbinguni
  choice: jeshi lote la mbinguni
  alternative: malaika wote wa mbinguni
  rationale: Kiebrania hakilitambulishi kundi hili kuwa malaika pekee. Tafsiri iliyochaguliwa huhifadhi upana wa usemi na mvutano wa kiteolojia wa mandhari ya baraza la mbinguni.
- issue: Maana ya עָלָיו katika uhusiano na kiti cha enzi
  choice: kando yake
  alternative: juu yake
  rationale: Muktadha wa kusimama upande wa kulia na wa kushoto unaonyesha wahudumu walio karibu na kiti cha enzi, lakini tanbihi inahifadhi maana ya moja kwa moja ya kihusishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kinabii lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kiti cha enzi’ ni usemi wa kawaida wa kibiblia; ‘jeshi la mbinguni’ limehifadhiwa ili kutoingiza utambulisho maalumu ambao Kiebrania hakitaji.
