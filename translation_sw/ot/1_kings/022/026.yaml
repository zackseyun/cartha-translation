base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/026.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city, and to Joash the king’s son.”
translation:
  language: sw
  text: Ndipo mfalme wa Israeli akasema, “Mchukue Mikaya na umrudishe kwa Amoni, mkuu wa mji[a], na kwa Yoashi mwana wa mfalme.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtawala wa mji,” “kamanda wa mji,” au “afisa mkuu wa mji.” Cheo cha Kiebrania kinaweza kumaanisha kiongozi mkuu wa kiraia au wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida, kama waw-consecutive ya Kiebrania.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Huhifadhi cheo kilichotumiwa katika Kiebrania badala ya kuongeza jina la Ahabu.
- source_word: קַח
  choice: Mchukue
  rationale: Ni amri ya nafsi ya pili umoja; ‘mchukue’ hudumisha umoja huo bila kuongeza wazo la kumkamata kwa nguvu.
- source_word: מִיכָיְהוּ
  choice: Mikaya
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: וַהֲשִׁיבֵהוּ
  choice: na umrudishe
  rationale: Hiphil ya שוב ina maana ya kumsababisha arudi au kumrudisha; tafsiri hii pia hudumisha amri ya umoja.
- source_word: אָמֹן
  choice: Amoni
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: שַׂר הָעִיר
  choice: mkuu wa mji
  rationale: שַׂר ni cheo kipana kinachoweza kumaanisha kiongozi wa kiraia, afisa mkuu, au kamanda; ‘mkuu wa mji’ huhifadhi upana huo bila kuamua jukumu mahsusi.
- source_word: יוֹאָשׁ
  choice: Yoashi
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: בֶּן הַמֶּלֶךְ
  choice: mwana wa mfalme
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya muundo wa Kiebrania bila kuongeza cheo cha ‘mwana-mfalme.’
