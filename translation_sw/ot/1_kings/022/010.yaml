  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָ֨ל הַ/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/010.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, at the threshing floor at the entrance of the gate of Samaria, and all the prophets were prophesying before them.
translation:
  language: sw
  text: Mfalme wa Israeli na Yehoshafati mfalme wa Yuda walikuwa wameketi, kila mmoja kwenye kiti chake cha enzi, wakiwa wamevaa mavazi[a], katika uwanja wa kupuria nafaka kwenye ingilio la lango la Samaria; nao manabii wote walikuwa wakitoa unabii mbele yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda mavazi rasmi ya kifalme yakakusudiwa kutokana na mazingira, lakini Kiebrania kinasema tu “mavazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: Mfalme wa Israeli
  rationale: Kiunganishi ו hakihitaji kuonyeshwa kwa neno la wakati kama “Basi”; mwanzo huu ni wa asili katika simulizi la Kiswahili na hauongezi maana isiyokuwapo.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: na Yehoshafati mfalme wa Yuda
  rationale: Jina na cheo chake vimehifadhiwa katika muundo wa ufafanuzi ulio karibu na Kiebrania.
- source_word: יֹשְׁבִים
  choice: walikuwa wameketi
  rationale: Kauli ya kushiriki inaonyesha hali inayoendelea katika mandhari; “walikuwa wameketi” huiwasilisha kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: kila mmoja kwenye kiti chake cha enzi
  rationale: אִישׁ imetumiwa kwa maana ya mgawanyo, “kila mmoja,” na כִּסֵּא katika mazingira haya ya kifalme ni “kiti cha enzi.”
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: wakiwa wamevaa mavazi
  rationale: Tafsiri hii huhifadhi maana ya wazi ya Kiebrania bila kuongeza kwamba mavazi hayo yalikuwa ya kifalme, ingawa mazingira yanaweza kudokeza hivyo.
- source_word: בְּגֹרֶן
  choice: katika uwanja wa kupuria nafaka
  rationale: גֹּרֶן ni eneo tambarare la kupuria nafaka; kifungu hiki kinaeleweka kwa wasomaji wa Kiswahili kuliko “uwanja wa kupuria” peke yake.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: kwenye ingilio la lango la Samaria
  rationale: Muundo huu huhifadhi uhusiano wa maneno “ingilio,” “lango,” na “Samaria” bila kuubadili kuwa maelezo mapana ya mahali.
- source_word: וְכָל הַנְּבִיאִים
  choice: nao manabii wote
  rationale: “Manabii wote” huhifadhi maana ya jumla ya כָל; “nao” huunganisha kishazi kwa Kiswahili cha asili.
- source_word: מִתְנַבְּאִים
  choice: walikuwa wakitoa unabii
  rationale: Muundo unaoendelea huakisi kitendo kinachoendelea cha kitenzi cha Kiebrania; “kutoa unabii” ni usemi wa kawaida na usioamua mapema uhalali wa ujumbe wao.
- source_word: לִפְנֵיהֶם
  choice: mbele yao
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili, ikionyesha kwamba manabii walitoa unabii mbele ya wafalme hao.
theological_decisions:
- issue: Hadhi ya unabii wa manabii
  choice: walikuwa wakitoa unabii
  alternative: walikuwa wakijifanya manabii
  rationale: Kiebrania kinaeleza tendo lao bila kulihukumu moja kwa moja katika mstari huu. Tafsiri haipaswi kuamua mapema kwamba walikuwa wakijifanya tu, hata kama muktadha mpana unatathmini ujumbe wao.
- issue: Aina ya mavazi
  choice: mavazi
  alternative: mavazi ya kifalme
  rationale: Kiebrania hakina kivumishi kinachomaanisha “ya kifalme.” Mazingira ya wafalme walioketi kwenye viti vya enzi yanaweza kudokeza mavazi rasmi, lakini hilo limeachwa kama uwezekano badala ya kuingizwa katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa urahisi. “Kiti cha enzi,” “uwanja wa kupuria nafaka,” na “kutoa unabii” ni misemo ya kawaida ya kibiblia isiyo ya kizamani. Alama ya tanbihi imewekwa baada ya “mavazi,” mahali panapohusiana moja kwa moja na hoja ya tanbihi.
