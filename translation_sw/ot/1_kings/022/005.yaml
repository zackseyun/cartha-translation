base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/005.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: sw
  text: Kisha Yehoshafati akamwambia mfalme wa Israeli, “Tafadhali, leo utafute neno la Yahweh[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umtafute Yahweh upate neno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” pamoja na kitenzi cha usimulizi ni Kiswahili cha kawaida na huonyesha mfuatano.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina la mtu limetoholewa kwa tahajia inayotambulika katika Kiswahili.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: akamwambia mfalme wa Israeli
  rationale: Muundo wa Kiswahili wenye kiambishi cha mtendewa unaonyesha wazi kuwa maneno yanaelekezwa kwa mfalme, huku cheo “mfalme wa Israeli” kikihifadhiwa.
- source_word: דְּרָשׁ
  choice: tafuta
  rationale: Katika muktadha huu kitenzi kina maana ya kutafuta mwongozo au ufunuo wa Mungu. “Tafuta” huhifadhi maana pana ya msingi bila kuufanya usemi kuwa wa kitaalamu kupita kiasi.
- source_word: נָא
  choice: Tafadhali
  rationale: Chembe hii huonyesha ombi la heshima; “Tafadhali” ni ya sasa, ya kawaida, na yenye adabu.
- source_word: כַיּוֹם
  choice: leo
  rationale: Neno hili linasisitiza wakati wa sasa au siku hii; “leo” huhifadhi nguvu yake ya wakati kwa ufupi.
- source_word: אֶת דְּבַר יְהוָה
  choice: neno kutoka kwa Yahweh
  rationale: Katika muundo wenye דרש, kinachotafutwa ni ujumbe wa Mungu. “Neno kutoka kwa Yahweh” ni Kiswahili cha asili na hudumisha “neno” bila kulifasiri zaidi kuwa “mapenzi” au “shauri.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa Tetragramatoni limetafsiriwa kwa kulitamka kama jina binafsi badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu moja kwa moja. “Yahweh” hulihifadhi kama jina bila kulibadilisha kuwa cheo; “Yehova” ni namna nyingine ya kimapokeo.
- issue: Maana ya kutafuta דְּבַר יְהוָה
  choice: neno kutoka kwa Yahweh
  alternative: neno la Yahweh
  rationale: Muktadha unahusu kuomba ujumbe au mwongozo wa Mungu kabla ya hatua ya kifalme. “Kutoka kwa” huweka wazi chanzo bila kuamua mapema kama neno hilo ni unabii, shauri, au amri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Ombi limewekwa kwa lugha ya heshima na ya sasa; hakuna alama ya tanbihi inayohitajika kwa kuwa mbadala wa kileksika umeelezwa katika maamuzi ya tafsiri.
