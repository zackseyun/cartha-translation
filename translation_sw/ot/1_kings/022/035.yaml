base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/035.yaml
  text: And the battle intensified that day[a], and the king remained standing in the chariot facing Aram, and he died in the evening[c][b]; and the blood from the wound flowed into the bottom of the chariot.
translation:
  language: sw
  text: Vita vikazidi kuwa vikali siku hiyo[a]. Mfalme akaendelea kushikiliwa akiwa amesimama ndani ya gari la vita[b], huku akiikabili Aramu. Akafa jioni, na damu iliyotoka kwenye jeraha ikatiririka na kuingia katika sehemu ya chini ya gari hilo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Vita vikaongezeka”; kihalisi zaidi, “vita vikapanda siku hiyo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Mfalme akawa amesimama ndani ya gari la vita.” Umbo la Kiebrania huenda likamaanisha kwamba alisimamishwa au alisaidiwa aendelee kuwa wima.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “katika kifua/mapaja ya gari,” yaani sehemu yake ya ndani au ya chini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה הַמִּלְחָמָה
  choice: Vita vikazidi kuwa vikali
  rationale: Kitenzi עלה, kihalisi ‘kupanda’, kinapotumiwa kuhusu vita kinaonyesha mapigano kuongezeka au kuwa makali zaidi. Tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: מָעֳמָד
  choice: akaendelea kushikiliwa akiwa amesimama
  rationale: Umbo hili linaweza kuonyesha hali ya kusimamishwa au kudumishwa akiwa amesimama, si tu kwamba mfalme alisimama kwa nguvu zake mwenyewe. Kauli hii inahifadhi maana hiyo bila kueleza njia iliyotumiwa.
- source_word: בַּמֶּרְכָּבָה
  choice: ndani ya gari la vita
  rationale: ‘Gari la vita’ hueleza kwa uwazi aina ya מרכבה katika muktadha huu, na ‘ndani ya’ huonyesha mahali mfalme alipokuwa.
- source_word: נֹכַח אֲרָם
  choice: akiikabili Aramu
  rationale: נֹכַח huonyesha kuwa mkabala na au kuelekea upande fulani. Jina la kale ‘Aramu’ limehifadhiwa badala ya kutumia jina la kisasa la kisiasa.
- source_word: וַיָּמָת בָּעֶרֶב
  choice: Akafa jioni
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kishazi cha wakati.
- source_word: וַיִּצֶק
  choice: ikatiririka
  rationale: Ingawa יצק mara nyingi humaanisha ‘kumimina’, kuhusu damu inayotoka jerahani ‘kutiririka’ ni Kiswahili cha kawaida na huhifadhi picha ya mwendo wa kiowevu.
- source_word: דַּם הַמַּכָּה
  choice: damu kutoka katika jeraha lake
  rationale: Muundo wa Kiebrania unaeleweka kiasili kama damu iliyotoka kwenye jeraha. Kiwakilishi ‘lake’ kinaweka wazi kuwa ni jeraha la mfalme bila kubadili mhusika.
- source_word: חֵיק הָרָכֶב
  choice: sehemu ya chini ya gari hilo
  rationale: חֵיק kihalisi ni ‘kifua’ au ‘mapaja’, lakini hapa ni sitiari ya sehemu ya ndani au ya chini ya gari ambako damu ilikusanyika.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa sasa na unaoeleweka kwa wasomaji wa kawaida. ‘Gari la vita’ limetumiwa badala ya neno la kiufundi lisilo la kawaida, huku ‘Aramu’ likihifadhi jina la kihistoria.
