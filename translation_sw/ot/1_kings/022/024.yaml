base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/024.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek and said[a], “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: sw
  text: Ndipo Sedekia mwana wa Kenaana akamkaribia Mikaya, akampiga shavuni, akasema[a], “Roho wa Yahwe alipitia njia gani akitoka kwangu ili kunena nawe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni kwa njia gani Roho wa Yahwe alitoka kwangu ili kunena nawe?”
    reason: Mfuatano אֵי זֶה עָבַר unaweza kutolewa kwa msisitizo wa ‘njia aliyopita’ au kwa msisitizo wa kuondoka kwake kutoka kwa Sedekia.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: akamkaribia
  rationale: Kitenzi נגשׁ kinaonyesha kumsogelea mtu; “akamkaribia” ni cha kawaida na kinahifadhi mwendo wa kimwili pamoja na hali ya makabiliano.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Sedekia mwana wa Kenaana
  rationale: Majina yamenukuliwa kwa tahajia inayofaa Kiswahili, na muundo wa patronimia umehifadhiwa kwa “mwana wa.”
- source_word: וַיַּכֶּה ... עַל הַלֶּחִי
  choice: akampiga shavuni
  rationale: נכה ni kitenzi kipana cha kupiga, na לֶחִי hapa kwa kawaida ni shavu. Tafsiri hii haibainishi bila lazima kama lilikuwa kofi au aina nyingine ya pigo.
- source_word: אֵי זֶה
  choice: njia gani
  rationale: Nahau hii inauliza njia ambayo Roho alidaiwa kupitia; “njia gani” huhifadhi kejeli ya swali kuliko “wapi” pekee.
- source_word: עָבַר
  choice: alipitia
  rationale: עבר humaanisha kupita au kuvuka. “Alipitia” huendana kiasili na swali la njia huku ikihifadhi wazo la kuondoka kwa msemaji.
- source_word: רוּחַ יְהוָה
  choice: Roho wa Yahwe
  rationale: Katika mzozo huu wa kinabii, kifungu kinamtaja Roho wa Mungu; “Roho” inaonyesha maana hiyo ya kibinafsi na ya kimungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: מֵאִתִּי
  choice: kutoka kwangu
  rationale: Kirai hiki huonyesha chanzo au mahali pa kuondokea kwa uwazi.
- source_word: לְדַבֵּר אֹתָךְ
  choice: ili aseme nawe
  rationale: Muundo wa Kiebrania una maana ya Roho kusema na Mikaya; “asema nawe” ni Kiswahili cha kawaida na huhifadhi mwelekeo wa usemi.
theological_decisions:
- issue: Maana na uwasilishaji wa רוּחַ יְהוָה
  choice: Roho wa Yahwe
  alternative: roho ya Yahwe
  rationale: Muktadha wa unabii unaelekeza kwa Roho wa Mungu, si upepo au mwelekeo wa ndani. Tafsiri hii huhifadhi nguvu ya madai ya kejeli ya Sedekia bila kuamua kama madai yake mwenyewe yalikuwa ya kweli.
- issue: Kejeli katika swali la Sedekia
  choice: Roho wa Yahwe alipitia njia gani kutoka kwangu ili aseme nawe?
  alternative: Roho wa Yahwe alitoka kwangu kwenda upande gani ili aseme nawe?
  rationale: Tafsiri iliyochaguliwa huhifadhi taswira ya njia katika אֵי זֶה עָבַר na pia mvutano wa madai yanayoshindana kuhusu mamlaka ya kinabii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi umetolewa kwa vitenzi vya mfululizo vya “aka-”. “Akampiga shavuni” huepuka kuongeza maelezo yasiyo hakika kuhusu aina ya pigo, huku swali likihifadhi sauti ya dhihaka na makabiliano.
