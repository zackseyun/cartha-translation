base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/031.yaml
  text: The king of Aram had commanded the thirty-two chariot commanders who belonged to him[a], saying, “Do not fight with either small or great[c][b], but only with the king of Israel alone.”
translation:
  language: sw
  text: Mfalme wa Aramu[b] alikuwa amewaamuru makamanda thelathini na wawili wa magari yake ya vita, akisema, “Msipigane na mtu yeyote, mdogo wala mkubwa,[a] isipokuwa na mfalme wa Israeli peke yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mdogo wala mkubwa.” Hii ni nahau inayomaanisha watu wa cheo au hadhi yoyote.
    reason: lexical_alternative
  - marker: b
    text: “Aramu” ni jina la mahali katika Kiebrania; kwa mapokeo limetafsiriwa “Siria.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: Mfalme wa Aramu
  rationale: Kiunganishi ו hakihitaji kutafsiriwa kwa lazima mwanzoni mwa sentensi katika masimulizi ya Kiswahili. Jina אֲרָם limetoholewa kuwa “Aramu” badala ya kutumia jina la jadi “Siria.”
- source_word: צִוָּה
  choice: alikuwa amewaamuru
  rationale: Kitenzi hiki kinamaanisha kutoa amri. Muundo “alikuwa amewaamuru” unaonyesha kwamba amri ilitolewa kabla ya tukio la mapigano linalosimuliwa.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: makamanda ... wa magari yake ya vita
  rationale: שָׂרֵי ni maafisa au makamanda, na הָרֶכֶב hapa ni kikosi cha magari ya vita. Kivumishi “yake” kinawakilisha אֲשֶׁר לוֹ kwa Kiswahili cha kawaida bila kudai kwamba watu hao walikuwa mali yake.
- source_word: שְׁלֹשִׁים וּשְׁנַיִם
  choice: thelathini na wawili
  rationale: Hii ni tafsiri ya moja kwa moja ya idadi hiyo, ikipatana kisarufi na “makamanda.”
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi fomula ya Kiebrania ya kutanguliza maneno yaliyonukuliwa kwa mtindo wa Kiswahili unaoeleweka.
- source_word: לֹא תִּלָּחֲמוּ אֶת קָטֹן וְאֶת גָּדוֹל
  choice: Msipigane na mtu yeyote, mdogo wala mkubwa
  rationale: “Msipigane” huonyesha katazo la moja kwa moja. Nyongeza ya “mtu yeyote” huweka wazi kwamba jozi “mdogo wala mkubwa” ni nahau inayohusu watu wa hadhi yoyote, si ukubwa wa mwili au umri.
- source_word: כִּי אִם
  choice: isipokuwa
  rationale: Muundo huu unaweka tofauti yenye nguvu na kumtenga mlengwa mmoja pekee.
- source_word: אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: na mfalme wa Israeli peke yake
  rationale: “Peke yake” huhifadhi msisitizo wa לְבַדּוֹ kwamba mfalme wa Israeli ndiye aliyelengwa, huku “kupigana na” ikiwa ni Kiswahili cha kawaida katika muktadha huu.
