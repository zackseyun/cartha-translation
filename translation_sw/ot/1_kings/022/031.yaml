translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Magari ya vita” limetumiwa kwa chariots, na “makamanda” linaweka wazi jukumu la kijeshi. Mpangilio wa maneno umefanywa wa kawaida katika Kiswahili huku ukihifadhi upekee wa shabaha katika amri.
