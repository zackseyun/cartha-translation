base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/034.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to his charioteer, “Turn your hand and take me out of the camp[d][c][b], for I am wounded.”
translation:
  language: sw
  text: Lakini mtu mmoja akavuta upinde wake bila kulenga[a], akampiga mfalme wa Israeli kati ya sehemu zilizounganishwa za silaha zake na dirii[b]. Ndipo mfalme akamwambia mwendesha gari lake la vita, “Geuza gari[c], uniondoe kambini, kwa maana nimejeruhiwa[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza pia kumaanisha “kwa unyoofu wake,” “bila kukusudia,” au “bila kulenga”; hapa yaelekea mpiga upinde hakulenga shabaha mahsusi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “kati ya hadebaqimu na hashiriani.” Yaelekea maneno hayo yanataja sehemu mbili za silaha, labda zikiwa na nafasi kati yake, lakini maana kamili ya istilahi hizo za silaha haijulikani kwa hakika.
    reason: cultural_note
  - marker: c
    text: Kiebrania ni “Geuza mkono wako,” nahau inayohusu kuligeuza au kuliongoza gari la vita.
    reason: lexical_alternative
  - marker: d
    text: Kitenzi cha Kiebrania kinaweza kumaanisha “kuwa mgonjwa” au “kujeruhiwa”; katika muktadha huu kinamaanisha kujeruhiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Lakini mtu mmoja
  rationale: Kiunganishi kinaonyesha mgeuko wa simulizi dhidi ya hatua za mfalme za kujificha katika muktadha uliotangulia; אִישׁ ni mtu asiyepewa jina.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: akavuta upinde wake
  rationale: Hii ni nahau ya kuvuta upinde ili kufyatua mshale; Kiswahili hiki ni cha kawaida na hakiongezi matokeo kabla ya kitenzi kinachofuata.
- source_word: לְתֻמּוֹ
  choice: bila kulenga shabaha fulani
  rationale: Katika muktadha wa vita, neno hili linaonyesha kwamba mpiga upinde hakumlenga mtu huyu mahsusi. Tafsiri hii huhifadhi kinaya cha mshale usiolengwa kumpiga mfalme, huku tanbihi ikitaja uwezekano wa maana nyingine.
- source_word: וַיַּכֶּה
  choice: akampiga
  rationale: נכה humaanisha kupiga; jeraha linasemwa wazi baadaye, kwa hiyo halitangulizwi hapa.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: kwenye mwanya kati ya vipande vya deraya na dirii ya kifuani
  rationale: Maneno ya Kiebrania ni istilahi za silaha zisizo na uhakika kamili. 'Mwanya' huonyesha mahali dhaifu kati ya sehemu mbili, 'vipande vya deraya' huakisi vitu vilivyounganishwa, na 'dirii ya kifuani' hutoa maana inayoeleweka ya silaha ya mwili.
- source_word: לְרַכָּבוֹ
  choice: mwendesha gari lake la vita
  rationale: Neno hili humtaja mtu aliyekuwa akiliongoza gari la vita, si gari lenyewe.
- source_word: הֲפֹךְ יָדְךָ
  choice: Geuza gari
  rationale: Kiebrania halisi ni 'geuza mkono wako,' nahau inayomhimiza mwendesha gari kuligeuza au kuliongoza mbali; Kiswahili cha maana ni wazi zaidi katika mazungumzo.
- source_word: וְהוֹצִיאֵנִי מִן הַמַּחֲנֶה
  choice: uniondoe vitani
  rationale: מַחֲנֶה inaweza kumaanisha kambi, jeshi, au kikosi kilichopangwa. Kwa kuwa tukio linaendelea katika mapigano, 'vitani' huwasilisha kusudi la amri kwa Kiswahili cha kawaida.
- source_word: כִּי הָחֳלֵיתִי
  choice: kwa maana nimejeruhiwa
  rationale: Kitenzi kinaweza kumaanisha kuwa mgonjwa au dhaifu, lakini baada ya kupigwa na mshale hapa humaanisha kujeruhiwa. Hakiongezwi 'vibaya' kwa sababu kiwango hicho hakitajwi wazi.
