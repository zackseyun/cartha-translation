- from: Lakini mtu mmoja akavuta upinde wake bila kulenga shabaha fulani[a], akampiga mfalme wa Israeli kwenye mwanya kati ya vipande vya deraya na dirii ya kifuani[b]. Ndipo mfalme akamwambia mwendesha gari lake la vita, “Geuza gari[c], uniondoe vitani, kwa maana nimejeruhiwa[d].”
  to: Lakini mtu mmoja akavuta upinde wake bila kulenga[a], akampiga mfalme wa Israeli kati ya sehemu zilizounganishwa za silaha zake na dirii[b]. Ndipo mfalme akamwambia mwendesha gari lake la vita, “Geuza gari[c], uniondoe kambini, kwa maana nimejeruhiwa[d].”
