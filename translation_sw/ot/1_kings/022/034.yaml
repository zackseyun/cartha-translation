    rationale: Chanzo kinasema atolewe “kutoka katika kambi” (au hosti ya kijeshi), si kwa njia ya moja kwa moja “vitani.” “Uniondoe kambini” huhifadhi maana ya msingi na bado inaeleweka katika muktadha wa mapigano.
  - severity: low
    issue: “kwenye mwanya kati ya vipande vya deraya na dirii ya kifuani”
    rationale: Hii hufanya “mwan ya” kuwa sehemu ya tafsiri kuu na hutumia istilahi mbili za silaha kwa namna isiyo laini. Kiebrania hutaja sehemu mbili za silaha zenye utambulisho wa kiufundi usio hakika; tanbihi inapaswa kubeba ufafanuzi huo.
  - severity: low
    issue: Tafsiri ya tanbihi a inajumuisha “bila kujua”
    rationale: “Bila kujua” inaweza kuelekeza kwenye hali ya maarifa ambayo haijaelezwa wazi. “Kwa unyoofu wake”/“bila kukusudia” na “bila kulenga” hufunika vyema uwezekano wa kisemantiki bila kupanua maana.
