base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/004.yaml
  text: And he said to Jehoshaphat[a], “Will you go with me to battle at Ramoth-gilead?” And Jehoshaphat said to the king of Israel, “I am as you are, my people as your people, my horses as your horses.”
translation:
  language: sw
  text: Akamwambia Yehoshafati, “Je, utaenda pamoja nami vitani huko Ramoth-gileadi?” Yehoshafati akamwambia mfalme wa Israeli, “Mimi ni kama wewe; watu wangu ni kama watu wako, na farasi wangu ni kama farasi wako.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa muundo wa karibu zaidi na Kiebrania: “Kama mimi, kama wewe; kama watu wangu, kama watu wako; kama farasi wangu, kama farasi wako.” Huu ni usemi mfupi usio na vitenzi unaoonyesha mshikamano na ushirika.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ אִתִּי
  choice: Je, utaenda pamoja nami
  rationale: Kiambishi cha swali pamoja na kitenzi cha mwendo kinauliza moja kwa moja kuhusu kwenda; ‘pamoja nami’ linaonyesha kuandamana bila kuongeza wazo lisilokuwamo katika Kiebrania.
- source_word: לַמִּלְחָמָה
  choice: vitani
  rationale: Katika muktadha wa kwenda kupigana, ‘vitani’ ni usemi wa kawaida na wenye hadhi katika Kiswahili, unaohifadhi maana ya kushiriki vita.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth-gileadi
  rationale: Jina la mahali limetoholewa kwa namna inayotambulika katika mapokeo ya Kiswahili huku sehemu zake mbili zikiendelea kuonekana.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Huu ni uwasilishaji wa moja kwa moja na wa kawaida wa muundo wa Kiebrania.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Mimi ni kama wewe
  rationale: Kiswahili kinahitaji kiunganishi ‘ni’ ili sentensi iwe ya kawaida; usemi huu unaonyesha mshikamano na utayari wa kuungana bila kufafanua zaidi kiwango chake.
- source_word: כְּעַמִּי כְעַמֶּךָ
  choice: watu wangu ni kama watu wako
  rationale: Ulinganisho umehifadhiwa, huku ‘ni’ ikiongezwa kwa ufasaha wa Kiswahili.
- source_word: כְּסוּסַי כְּסוּסֶיךָ
  choice: farasi wangu ni kama farasi wako
  rationale: Neno halisi ‘farasi’ limehifadhiwa badala ya kulifasiri kuwa ‘jeshi la wapanda farasi’ au ‘nguvu za kijeshi,’ ingawa msaada wa kijeshi unaashiriwa na muktadha.
theological_decisions:
- issue: Kiwango cha ahadi ya Yehoshafati
  choice: 'Usemi wa mshikamano umeachwa katika ulinganisho wake mfupi: ‘Mimi ni kama wewe…’'
  alternative: Kufafanua kuwa Yehoshafati anaweka kabisa watu na jeshi lake chini ya mamlaka ya mfalme wa Israeli.
  rationale: Kiebrania kinaonyesha mshikamano na ushirika, lakini hakielezi kwa undani masharti au mipaka ya ahadi hiyo; tafsiri haipaswi kuongeza maelezo hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa urahisi. ‘Akamwambia’ linaendeleza mtiririko wa simulizi, na ‘Je’ linaweka swali wazi. Alama ya tanbihi imewekwa baada ya usemi unaofafanuliwa, si baada ya jina Yehoshafati.
