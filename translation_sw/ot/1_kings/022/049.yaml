base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/049.yaml
  text: Jehoshaphat made ships of Tarshish to go to Ophir for gold[a], but they did not go[b], because the ships were wrecked at Ezion-geber.
translation:
  language: sw
  text: Yehoshafati alitengeneza meli za Tarshishi[a] ili ziende Ofiri kwa ajili ya dhahabu, lakini hazikuenda[b], kwa sababu meli hizo zilivunjika huko Esion-geberi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “meli za aina ya Tarshishi”; huenda maneno haya yanamaanisha aina ya meli kubwa za safari za baharini, wala si lazima meli zilizotoka Tarshishi.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “haikuenda” (umoja); hapa umoja huo unaonekana kurejelea meli zote kama kundi moja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עשר
  choice: alitengeneza
  rationale: Maandishi ya konsonanti yana עשר, lakini katika muktadha yanaeleweka kuwa kitenzi chenye maana ya ‘kutengeneza’ au ‘kuandaa’; Yehoshafati ndiye mtenda na meli ndizo kitu kilichotengenezwa.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: meli za Tarshishi
  rationale: 'Huhifadhi muundo wa Kiebrania na utata wake: huenda ni meli zilizohusishwa na Tarshishi au aina ya meli kubwa za safari za baharini. ‘Meli’ ni neno la kawaida na la sasa katika Kiswahili.'
- source_word: לָלֶכֶת אוֹפִירָה
  choice: ili ziende Ofiri
  rationale: Kitenzi kisicho na kikomo pamoja na kiishio kinachoonyesha mwelekeo kwenye ‘Ofiri’ kinaonyesha kusudi na mahali zilipokusudiwa kwenda.
- source_word: לַזָּהָב
  choice: kuchukua dhahabu
  rationale: Kihusishi ל kinaonyesha lengo la safari; ‘kuchukua dhahabu’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kudai kwa undani zaidi jinsi dhahabu hiyo ingepatikana.
- source_word: וְלֹא הָלָךְ
  choice: lakini hazikuenda
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umoja, muktadha unarejelea meli au kundi la meli kwa pamoja. Wingi ni wa kawaida katika Kiswahili na huepuka kudokeza kwamba Yehoshafati mwenyewe ndiye ambaye hakwenda.
- source_word: נשברה
  choice: zilivunjika
  rationale: Nifali ya שבר ina maana ya kuvunjwa au kuvunjika. Kuhusu meli, ‘zilivunjika’ ni sahihi na inaeleza kwamba zilipata maangamizi kabla ya safari.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: huko Esion-geberi
  rationale: Kihusishi ב kinaonyesha mahali tukio lilipotokea. Jina la mahali limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili.
