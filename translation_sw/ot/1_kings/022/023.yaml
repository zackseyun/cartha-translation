source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/023.yaml
  text: And now[a], behold, Yahweh has put a lying spirit in the mouth of all these prophets of yours[b], and Yahweh has spoken disaster against you.
translation:
  language: sw
  text: Na sasa, tazama, Yahwe ameweka roho ya uongo[a] kinywani mwa manabii wako hawa wote, naye Yahwe amenena maafa dhidi yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho ya udanganyifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Yahwe amenena mabaya dhidi yako.” Neno la Kiebrania linaweza kumaanisha mabaya, msiba, au maafa katika muktadha wa hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi pamoja na mpito wa wakati unaoendeleza hoja mara moja.
- source_word: הִנֵּה
  choice: tazama
  rationale: Ni mwito wa kusikiliza kwa makini wenye uzito wa kinabii, lakini bado ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: נָתַן
  choice: ameweka
  rationale: Katika muundo huu wa ‘roho’ kuwekwa ‘kinywani,’ neno hili linaeleza tendo la moja kwa moja bila kulilegeza kuwa kuruhusu tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu badala ya kulibadili kuwa cheo.
- source_word: רוּחַ שֶׁקֶר
  choice: roho ya uongo
  rationale: Huhifadhi maana ya roho yenye sifa au kazi ya kudanganya; ‘roho ya udanganyifu’ pia inawezekana.
- source_word: בְּפִי
  choice: kinywani mwa
  rationale: Huhifadhi taswira ya Kiebrania ya usemi kuwekwa kinywani; umoja hutumika kwa namna ya kugawa kwa kila mmoja katika kundi la manabii.
- source_word: כָּל נְבִיאֶיךָ אֵלֶּה
  choice: manabii wako hawa wote
  rationale: Huhifadhi umilikishi wa nafsi ya pili, msisitizo wa ‘hawa,’ na ujumla wa ‘wote’ kwa mpangilio wa asili wa Kiswahili.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: ametangaza maafa dhidi yako
  rationale: ‘Ametangaza’ huwasilisha usemi wa hukumu, na ‘maafa’ huonyesha madhara ya hukumu yanayokusudiwa hapa bila kufanya רָעָה limaanishe lazima uovu wa kimaadili.
theological_decisions:
- issue: Tendo la Yahwe kuhusiana na roho ya uongo
  choice: Yahwe ameweka roho ya uongo
  alternative: Yahwe ameruhusu roho ya uongo
  rationale: Kitenzi נָתַן kinaeleza tendo la moja kwa moja. Tafsiri hailigeuzi kuwa ruhusa tu, hivyo inadumisha mvutano wa kitheolojia uliomo katika matini.
- issue: Maana ya רָעָה katika tangazo la hukumu
  choice: maafa
  alternative: mabaya
  rationale: Katika muktadha huu neno linamaanisha madhara au msiba wa hukumu. ‘Maafa’ huhifadhi nguvu ya tangazo bila kudai kwamba Yahwe anatenda uovu wa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Tazama’ huhifadhi uzito wa usemi wa kinabii; ‘kinywani mwa’ huhifadhi taswira ya chanzo huku sentensi nzima ikibaki ya asili katika Kiswahili.
