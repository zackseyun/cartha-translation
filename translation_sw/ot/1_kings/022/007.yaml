base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/007.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh, that we may inquire of him?”
translation:
  language: sw
  text: Lakini Yehoshafati akasema[a], “Je, hapa hakuna nabii mwingine wa Yahwe, ili tumwulize?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Je, hapa hakuna nabii wa Yahwe ambaye bado yupo, ili tumwulize?”
    reason: Neno עוֹד linaweza kumaanisha nabii mwingine wa ziada au nabii ambaye bado anapatikana.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini ... akasema
  rationale: Kiunganishi hiki kinaendeleza simulizi, lakini katika muktadha jibu la Yehoshafati linatofautiana na kutegemea manabii waliotangulia; kwa hiyo “Lakini” huonyesha uhusiano wa mazungumzo kwa Kiswahili cha kawaida.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina limetoholewa kwa umbo linalotambulika na kutumiwa kwa kawaida katika Kiswahili cha Biblia.
- source_word: הַאֵין
  choice: Je, ... hakuna
  rationale: Muundo huu huhifadhi swali hasi linalotafuta uthibitisho bila kulifanya kuwa la mazungumzo mno.
- source_word: פֹּה
  choice: hapa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kielezi cha mahali.
- source_word: נָבִיא
  choice: nabii
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mtu anayesema kwa niaba ya Mungu.
- source_word: לַיהוָה
  choice: wa Yahwe
  rationale: “Wa” huonyesha uhusiano wa nabii na Yahwe—nabii anayemwakilisha na kusema kwa niaba yake—bila kuongeza maelezo yasiyomo wazi katika mstari.
- source_word: עוֹד
  choice: tena
  rationale: Katika muktadha neno hili linaashiria kwamba anatafutwa nabii wa ziada au ambaye bado anapatikana. “Tena” huhifadhi kwa kiasi kikubwa uwezekano huo wa maana mbili.
- source_word: וְנִדְרְשָׁה
  choice: ili tumwulize
  rationale: Kitenzi cha kundi la kwanza wingi chenye maana ya kusudi au nia kimetafsiriwa kwa “ili,” na “tumwulize” ni Kiswahili cha asili kwa kutafuta jibu kwa nabii.
- source_word: מֵאוֹתוֹ
  choice: tumwulize
  rationale: Kihalisi ni kutafuta au kuuliza kutoka kwake. Kiambishi “-mw-” kinaonyesha kwamba nabii ndiye anayeulizwa, huku muktadha ukibainisha kuwa jibu la kimungu linatafutwa kupitia huduma yake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nani anayeulizwa katika usemi מֵאֹתוֹ
  choice: nabii anaulizwa ili kupata jibu la Mungu
  alternative: kuuliza kupitia kwake
  rationale: Kiswahili “tumwulize” kinafuata kisarufi rejeo la kiwakilishi kwa nabii. Hata hivyo, hakifuti jukumu lake la kuwa mpatanishi wa ujumbe wa Yahwe, ambalo linaeleweka kutokana na “nabii wa Yahwe.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Swali limewekwa kwa mpangilio wa asili wa Kiswahili, na utata wa עוֹד umehifadhiwa katika maandishi pamoja na tanbihi.
