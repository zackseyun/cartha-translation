base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/038.yaml
  text: And they washed the chariot at the pool of Samaria[a], and the dogs licked up his blood, and the prostitutes washed there, according to the word of Yahweh that he had spoken.
translation:
  language: sw
  text: Kisha gari likaoshwa kwenye bwawa la Samaria, mbwa wakalamba damu yake, na makahaba wakaoga humo[a], sawasawa na neno la Yahwe alilolinena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makahaba wakaosha humo” au “makahaba wakajiosha humo.” Kitenzi cha Kiebrania hakitaji yambwa wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁטֹף אֶת־הָרֶכֶב
  choice: gari likaoshwa
  rationale: Kitenzi cha Kiebrania ni umoja wa nafsi ya tatu lakini mtendaji hatajwi. Kauli ya kutendwa ya Kiswahili huonyesha kwa kawaida kwamba gari lilioshwa bila kubuni mtendaji fulani.
- source_word: עַל בְּרֵכַת שֹׁמְרוֹן
  choice: kwenye bwawa la Samaria
  rationale: עַל hapa huonyesha mahali pa tendo. “Kwenye” ni ya kawaida na haiashirii kwamba gari lilikuwa juu ya uso wa bwawa.
- source_word: וַיָּלֹקּוּ הַכְּלָבִים אֶת־דָּמוֹ
  choice: mbwa wakairamba damu yake
  rationale: “Kuramba” huwasilisha tendo la mbwa kwa usahihi; kiambishi -i- kinarejelea damu iliyotajwa bila kuongeza maana isiyokuwapo.
- source_word: וְהַזֹּנוֹת
  choice: na makahaba
  rationale: “Makahaba” ni neno la sasa, linaloeleweka, na linalolingana na maana ya זוֹנוֹת bila kutumia msamiati wa kizamani.
- source_word: רָחָצוּ
  choice: wakaosha humo
  rationale: Kitenzi kinaweza kumaanisha kuosha au kuoga, lakini Kiebrania hakitaji yambwa. Muundo huu unaacha yambwa bila kutajwa na “humo” huendeleza mahali palipotajwa katika sentensi.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֵּר
  choice: sawasawa na neno la Yahwe alilokuwa amesema
  rationale: Huhifadhi muundo wa kutimia kwa neno la kinabii na kutumia wakati uliopita unaotangulia ili kuonyesha kwamba Yahwe alikuwa amesema neno hilo kabla.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Hili ni jina la agano lililoandikwa moja kwa moja katika maandishi ya Kiebrania; “Yahwe” hulitaja kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וְהַזֹּנוֹת רָחָצוּ
  choice: na makahaba wakaosha humo
  alternative: na makahaba wakaoga humo / walijiosha humo
  rationale: Kifungu cha Kiebrania kinawataja makahaba kuwa kiima lakini hakitaji yambwa ya kitenzi. Tafsiri kuu haiongezi yambwa wala kulazimisha maana ya kujiosha; tanbihi inaonyesha uwezekano wa maana ya kuoga au kujiosha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kauli ya kutendwa mwanzoni ni ya kawaida kwa mtendaji asiyejulikana; kifungu cha mwisho kimeachwa kwa kiasi fulani katika utata wake wa asili.
