  text: And it happened[a], when the commanders of the chariots saw that he was not the king of Israel, they turned back from pursuing him.
translation:
  language: sw
  text: Ikawa, makamanda wa magari ya vita walipoona kwamba yeye hakuwa mfalme wa Israeli, wakageuka, wakaacha kumfuata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wakageuka kutoka kumfuata”; huu ni usemi wa Kiebrania unaomaanisha kwamba waliacha kumfuata au kumwandama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya masimulizi inayoendeleza tukio linalofuata, huku ikihifadhi kwa ufupi kazi ya wayyiqtol ya היה.
- source_word: כִּרְאוֹת
  choice: walipoona
  rationale: Kitenzi-jina kilichotanguliwa na כ kinaonyesha wakati; “walipoona” ni Kiswahili cha kawaida na huonyesha wazi uhusiano huo wa wakati.
- source_word: שָׂרֵי הָרֶכֶב
  choice: makamanda wa magari ya vita
  rationale: שָׂרֵי ni viongozi wa kijeshi, na הָרֶכֶב hapa inarejelea magari ya vita au kikosi chake. Chaguo hili ni wazi kwa msomaji wa sasa.
- source_word: כִּי לֹא מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: kwamba yeye hakuwa mfalme wa Israeli
  rationale: Kishazi hiki kinaeleza walichotambua; kiwakilishi הוּא ni cha kiume, umoja, kikimrejelea mtu waliyekuwa wakimfuatilia.
- source_word: וַיָּשׁוּבוּ
  choice: wakaacha
  rationale: Katika muundo וַיָּשׁוּבוּ מֵאַחֲרָיו, wazo la kurudi au kugeuka linaonyesha kusitisha tendo la kumfuata. “Wakaacha” huwasilisha matokeo hayo kwa Kiswahili cha kawaida.
- source_word: מֵאַחֲרָיו
  choice: kumfuatilia
  rationale: Kihalisi ni “kutoka nyuma yake/baada yake,” lakini katika muktadha wa kijeshi ni nahau ya kuacha kumfuata au kumwandama.
