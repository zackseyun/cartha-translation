  text: And Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide.”
translation:
  language: sw
  text: Mikaya akasema, “Tazama, utaona siku hiyo utakapoingia katika chumba cha ndani[a] ili kujificha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “chumba ndani ya chumba”; pia inaweza kumaanisha “kutoka chumba kimoja hadi kingine.” Usemi huo unaonyesha kuingia ndani zaidi ili kujificha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מִיכָיְהוּ
  choice: Mikaya akasema
  rationale: Muundo wa simulizi wa Kiswahili unaendeleza tukio kwa kawaida, huku jina likifuata tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: הִנְּךָ רֹאֶה
  choice: Tazama, utaona
  rationale: “Tazama” huvuta fikira za msikilizaji, na hali ya wakati ujao inaonyeshwa na rejeo la “siku hiyo.”
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Huu ndio usemi wa kawaida na wa asili wa Kiswahili kwa rejeo hili la wakati.
- source_word: אֲשֶׁר תָּבֹא
  choice: utakapoingia
  rationale: Kitenzi בוא hapa kinaonyesha kuingia mahali, na kiambishi “-kapo-” kinaunganisha tendo hilo na wakati wa kuona.
- source_word: חֶדֶר בְּחֶדֶר
  choice: katika chumba cha ndani
  rationale: Usemi wa Kiebrania unarudia neno “chumba” na unaonyesha kurudi ndani zaidi. Tafsiri hii ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi uwezekano wa kuelewa mwendo kutoka chumba kimoja hadi kingine.
- source_word: לְהֵחָבֵה
  choice: ili kujificha
  rationale: Inaonyesha kusudi la kuingia, na umbo la kujirejelea linaelezwa wazi na “kujificha.”
