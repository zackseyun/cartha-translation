source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דֶ֤רֶךְ אָבִי/ו֙ וּ/בְ/דֶ֣רֶךְ אִמּ֔/וֹ וּ/בְ/דֶ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/053.yaml
  text: And he did what was evil in the eyes of Yahweh and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: sw
  text: Naye akafanya yaliyo maovu machoni pa Yahweh, akaenenda katika njia ya baba yake, na katika njia ya mama yake, na katika njia ya Yeroboamu mwana wa Nebati, aliyesababisha Israeli kutenda dhambi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: akafanya yaliyo maovu
  rationale: Muundo huu wa kawaida una maana ya kufanya mambo yaliyo maovu; tafsiri hii ni ya asili katika Kiswahili na inadumisha tathmini ya kimaadili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Inahifadhi sitiari ya Kiebrania ya tathmini inayofanywa na Yahweh bila kuibadili kuwa maelezo ya kufasiri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: akaenenda katika njia ya
  rationale: Huhifadhi sitiari ya mwenendo wa maisha na urudiaji wa neno 'njia' katika chanzo, huku 'akaenenda' ikiwa lugha yenye hadhi inayofahamika.
- source_word: אָבִיו ... אִמּוֹ
  choice: baba yake ... mama yake
  rationale: Inadumisha wazi marejeo yote mawili ya kifamilia na msisitizo wake katika chanzo.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia, na uhusiano wa mwana na baba umehifadhiwa.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: aliyesababisha Israeli kutenda dhambi
  rationale: Huhifadhi nguvu ya kisababishi ya kitenzi cha Kiebrania kwa uwazi bila kuilegeza kuwa 'aliyeongoza'.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kina jina binafsi la agano; 'Yahweh' hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Kauli ya tathmini ya maadili
  choice: akafanya yaliyo maovu machoni pa Yahweh
  alternative: akafanya mabaya mbele za Yahweh
  rationale: Utoaji uliochaguliwa huhifadhi sitiari ya 'machoni pa' na wingi wa dhana katika 'yaliyo maovu' bila kuongeza maelezo ya kiteolojia.
- issue: Wajibu wa Yeroboamu katika dhambi ya Israeli
  choice: aliyesababisha Israeli kutenda dhambi
  alternative: aliyeiongoza Israeli katika dhambi
  rationale: Kisababishi cha kitenzi הֶחֱטִיא kimehifadhiwa moja kwa moja; tafsiri mbadala ingesisitiza uongozi kuliko usababisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Akaenenda' limetumiwa ili kuhifadhi sitiari ya kutembea katika njia ya mwenendo; sentensi inadumisha urudiaji wa 'katika njia ya' unaosisitizwa na Kiebrania.
