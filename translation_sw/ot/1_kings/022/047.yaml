  yaml_path: translation/ot/1_kings/022/047.yaml
  text: And he removed from the land the rest of the cult prostitutes who remained in the days of Asa his father[a].
translation:
  language: sw
  text: Akawaondoa nchini makahaba wa ibada waliobaki katika siku za Asa, baba yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makahaba wa kiume wa ibada,” au “wahudumu wa kiume wa ibada.” Neno la Kiebrania קָדֵשׁ ni nomino ya kiume; katika muktadha huu linahusishwa na ibada iliyokatazwa, ingawa maelezo kamili ya utendaji unaorejelewa yanajadiliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: makahaba wengine ... waliokuwa wamebaki
  rationale: יֶתֶר hueleza sehemu iliyosalia. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha kundi lililobaki bila kutumia tafsiri ngumu kama ‘masalia ya’.
- source_word: הַקָּדֵשׁ
  choice: makahaba ... wa ibada
  rationale: Katika muktadha huu קָדֵשׁ humaanisha wanaume waliohusishwa na vitendo vya kingono katika ibada haramu, si ‘mtakatifu’ kwa maana ya kawaida. ‘Makahaba wa ibada’ huwasilisha vipengele vya ukahaba na ibada, huku jinsia ya neno la Kiebrania ikifafanuliwa katika tanbihi.
- source_word: אֲשֶׁר נִשְׁאַר
  choice: waliokuwa wamebaki
  rationale: Hii hutambulisha watu waliokuwa bado nchini kutoka kipindi cha awali na kuhifadhi hali ya matokeo ya kitenzi נִשְׁאַר.
- source_word: בִּימֵי אָסָא אָבִיו
  choice: tangu siku za Asa baba yake
  rationale: Ingawa בִּימֵי kwa karibu ni ‘katika siku za,’ muktadha unaonyesha kuwa watu hao walikuwa wamebaki kutoka wakati wa Asa. ‘Tangu siku za’ huwasilisha uhusiano huo wa wakati kwa Kiswahili cha kawaida.
- source_word: בִּעֵר
  choice: Akawaondoa
  rationale: Katika muundo huu בער humaanisha kuondoa au kutokomeza kutoka nchini. ‘Akawaondoa’ huepuka kudai kwamba walichomwa au kuuawa, jambo ambalo andiko halielezi.
- source_word: מִן הָאָרֶץ
  choice: nchini
  rationale: הָאָרֶץ hapa ni eneo la ufalme, si dunia nzima. ‘Nchini’ ni tafsiri ya asili na wazi ya kuondolewa kutoka katika nchi hiyo.
theological_decisions:
- issue: Tafsiri ya קָדֵשׁ katika muktadha wenye uzito wa kimaadili na kitamaduni
  choice: makahaba wa ibada
  alternative: makahaba wa kiume wa ibada; watendaji wa ibada
  rationale: Tafsiri iliyochaguliwa inaonyesha uhusiano wa watu hawa na vitendo vya kingono katika ibada haramu bila kuingiza istilahi ya kimapokeo isiyo sahihi. Kwa kuwa neno la Kiebrania ni la kiume, jambo hilo linahifadhiwa katika tanbihi badala ya kufanya sentensi kuu iwe nzito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka, huku istilahi ‘wa ibada’ ikitofautisha maana hii na ukahaba usiohusishwa na ibada.
