base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/021.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him[b], ‘By what means?’
translation:
  language: sw
  text: Ndipo yule roho[a] akajitokeza, akasimama mbele ya Yahwe, akasema, “Mimi nitamshawishi[b].” Yahwe akamwambia, “Kwa njia gani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “roho mmoja.” Kiebrania kina “roho yule,” ambacho yaelekea kinamrejelea kiumbe fulani wa kiroho katika baraza la mbinguni, si lazima Roho Mtakatifu.
    reason: alternative_reading
  - marker: b
    text: Au “nitamrubuni” au “nitamdanganya.” Kitenzi kinaweza kumaanisha kushawishi, kurubuni, au kudanganya; njia yenyewe inaelezwa katika mstari unaofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: yule roho
  rationale: Nomino ina kibainishi na katika tukio hili inamtaja kiumbe fulani wa kiroho katika baraza la mbinguni. ‘Yule roho’ hudumisha urejeo maalumu bila kudokeza lazima kwamba ni Roho Mtakatifu.
- source_word: וַיֵּצֵא
  choice: akajitokeza
  rationale: Katika mazingira ya baraza, kitenzi kinaonyesha kwamba roho alitoka miongoni mwa waliokuwapo na kwenda mbele kutoa pendekezo; ‘akajitokeza’ ni Kiswahili cha asili kinachowasilisha tendo hilo.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: akasimama mbele za
  rationale: Huhifadhi picha rasmi ya kusimama katika uwepo wa mwenye mamlaka, kwa usemi wa Kiswahili unaoeleweka na wenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama ‘BWANA,’ hivyo kuhifadhi jina binafsi katika maandishi ya Kiebrania.
- source_word: אֲפַתֶּנּוּ
  choice: nitamshawishi
  rationale: פתה katika piel inaweza kumaanisha kushawishi, kuvuta kwa hila, au kudanganya. ‘Kumshawishi’ huhifadhi upana wa kitendo cha kumvuta Ahabu achukue hatua, huku namna kamili ikifafanuliwa katika mstari unaofuata.
- source_word: בַּמָּה
  choice: Kwa njia gani?
  rationale: Swali linataka kujua namna au njia ambayo roho atatumia; usemi huu ni wa kawaida, wazi, na unafaa mazungumzo rasmi ya baraza.
theological_decisions:
- issue: Utambulisho wa הָרוּחַ katika baraza la mbinguni
  choice: Kiumbe fulani wa kiroho, kilichotafsiriwa ‘yule roho,’ si lazima Roho Mtakatifu
  alternative: ‘Roho’ kwa maana ya Roho Mtakatifu, au ‘roho mmoja’ kwa maana isiyo maalumu
  rationale: Kibainishi cha Kiebrania na muktadha vinaonyesha mshiriki maalumu wa jeshi la mbinguni anayejitokeza. Herufi ndogo na ‘yule’ huepuka kumtambulisha moja kwa moja kuwa Roho Mtakatifu, huku zikihifadhi umaalumu wa rejeo.
- issue: Nguvu ya kimaadili na kimaana ya אֲפַתֶּנּוּ
  choice: ‘nitamshawishi,’ bila kuamua mapema kwamba tendo lenyewe ni udanganyifu
  alternative: ‘nitamdanganya’ au ‘nitamvuta kwa hila’
  rationale: Kitenzi kina wigo wa kushawishi, kurubuni, au kudanganya. Mstari unaofuata ndio unaoeleza mbinu, hivyo tafsiri hii inahifadhi mvutano na kutoweka kwa maana moja tu mapema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akajitokeza’ na ‘mbele za Yahwe’ vinadumisha mazingira ya baraza la kifalme; ‘yule roho’ huepuka mkanganyiko na Roho Mtakatifu bila kupoteza kibainishi cha Kiebrania.
