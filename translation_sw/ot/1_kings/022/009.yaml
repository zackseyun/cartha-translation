  text: Then the king of Israel called one officer and said[a], “Bring Micaiah son of Imlah quickly.”
translation:
  language: sw
  text: Ndipo mfalme wa Israeli akamwita afisa mmoja[a], akasema, “Mlete Mikaya mwana wa Imla haraka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania saris linaweza kumaanisha “towashi” au, kwa maana pana zaidi, “afisa wa ikulu.” Hapa maana pana ya afisa inaelekea kufaa zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Katika muktadha huu קרא humaanisha kumwita mtu ili apewe agizo; “akamwita” ni ya kawaida na inafaa katika simulizi.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Huu ni muundo wa kawaida unaomtambulisha msemaji, na umetafsiriwa moja kwa moja.
- source_word: אֶל סָרִיס אֶחָד
  choice: afisa mmoja
  rationale: סָרִיס inaweza kumaanisha towashi au afisa wa kifalme. Hapa kazi yake katika utawala wa mfalme ndiyo inayosisitizwa, hivyo “afisa” ni wazi na ya asili; maana nyingine imehifadhiwa katika tanbihi.
- source_word: מַהֲרָה
  choice: Mlete haraka
  rationale: Neno hili linaonyesha uharaka. Kwa kuwa Kiebrania hakitaji wazi kitenzi “leta,” Kiswahili cha kawaida hukiongeza ili kueleza kikamilifu amri ya mfalme.
- source_word: מִיכָיְהוּ
  choice: Mikaya
  rationale: Jina limetolewa kwa umbo linalotumika kwa kawaida katika tafsiri za Kiswahili.
- source_word: בֶן יִמְלָה
  choice: mwana wa Imla
  rationale: Muundo wa nasaba umetafsiriwa kwa njia ya moja kwa moja na ya kawaida katika Kiswahili.
