base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/016.yaml
  text: Then the king said to him[a], “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: sw
  text: Ndipo mfalme akamwambia[a], “Ni mara ngapi ninapaswa kukuapisha kwamba usiniambie lolote isipokuwa ukweli kwa jina la Yahwe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni mara ngapi nikulazimishe kuapa…?” Kitenzi cha Kiebrania kinamaanisha kumsababisha mtu aape au kumweka chini ya kiapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uamilifu wa dhahiri imetafsiriwa kama cheo kilicho katika Kiebrania bila kuweka jina la mtu.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: Ni mara ngapi
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha swali la kukerwa kuhusu jambo linalorudiwa.
- source_word: מַשְׁבִּעֶךָ
  choice: ninapaswa kukuapisha
  rationale: Hiphil ya שׁבע humaanisha kumsababisha mtu aape au kumweka chini ya kiapo; “kukuapisha” huhifadhi maana hiyo kwa ufupi na uwazi.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: kwamba usiniambie lolote isipokuwa ukweli
  rationale: Muundo hasi pamoja na רַק umehifadhiwa kwa kauli ya asili ya Kiswahili inayoonyesha kwamba ukweli pekee ndio uruhusiwa.
- source_word: בְּשֵׁם יְהוָה
  choice: kwa jina la Yahwe
  rationale: Kirai kinaonyesha kusema chini ya mamlaka au kwa kuliitia jina la Mungu; jina la agano limetoholewa kuwa “Yahwe” kwa Kiswahili.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kulibadili kuwa cheo, huku likiwa na tahajia inayofaa Kiswahili.
- issue: Nguvu ya kiapo katika מַשְׁבִּעֶךָ
  choice: kukuapisha
  alternative: kukuweka chini ya kiapo
  rationale: “Kukuapisha” huhifadhi tendo la mfalme la kumtaka Mikaya aape bila kuongeza maelezo ya kiteolojia yasiyomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la kukerwa umehifadhiwa, na lugha ya kiapo imetolewa kwa neno la kawaida “kuapisha.”
