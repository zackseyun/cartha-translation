  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרֹשׁ֩ אֶת יְהוָ֨ה מֵ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/ו כִּ֠י לֹֽא יִתְנַבֵּ֨א עָלַ֥/י טוֹב֙ כִּ֣י אִם רָ֔ע מִיכָ֖יְהוּ בֶּן יִמְלָ֑ה וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/008.yaml
  text: 'And the king of Israel said to Jehoshaphat[a], “There is still one more man through whom to inquire of Yahweh, but I hate him, because he does not prophesy good concerning me, but only evil: Micaiah son of Imlah.” And Jehoshaphat said, “Let not the king say so.”'
translation:
  language: sw
  text: 'Mfalme wa Israeli akamwambia Yehoshafati, “Bado kuna mtu mwingine mmoja ambaye tunaweza kumwuliza Yahwe[a] kupitia kwake, lakini ninamchukia, kwa sababu hatabiri mema kunihusu, bali mabaya tu: Mikaya mwana wa Imla.” Yehoshafati akasema, “Mfalme asiseme hivyo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye tunaweza kumtafuta Yahwe kupitia kwake.”
    reason: “Kumtafuta” ni mbadala halali wa “kumwuliza” kwa דָּרַשׁ katika muktadha huu; “kupitia kwake” huhifadhi kuwa ulizo au utafutaji wa Yahwe unafanywa kwa njia ya mtu huyo.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la agano lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo; “Yahwe” ni umbo la kawaida na linalosomeka kwa Kiswahili.
- source_word: עוֹד אִישׁ אֶחָד
  choice: Bado yupo mtu mmoja
  rationale: “Bado” linaonyesha maana ya kuendelea au kuwapo kwa mtu mwingine, huku “mtu mmoja” likihifadhi umoja wa אִישׁ אֶחָד kwa Kiswahili cha kawaida.
- source_word: לִדְרֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: ambaye kupitia kwake tunaweza kumwuliza Yahwe
  rationale: Katika muktadha wa kinabii, דָּרַשׁ ni kutafuta jibu au mwongozo kutoka kwa Mungu, na מֵאֹתוֹ linaonyesha kuwa nabii ndiye njia ya kufanya ulizo hilo.
- source_word: שְׂנֵאתִיו
  choice: ninamchukia
  rationale: Kauli hii inaeleza msimamo wa sasa na uliothibitika wa mfalme; wakati wa sasa wa Kiswahili unawasilisha jambo hilo kwa uwazi.
- source_word: לֹא יִתְנַבֵּא עָלַי טוֹב כִּי אִם רָע
  choice: hatabiri mema kunihusu, bali mabaya tu
  rationale: “Hatabiri” linatunza tendo la kinabii; “kunihusu” linaonyesha maana ya עָלַי, na “bali mabaya tu” linahifadhi nguvu ya כִּי אִם bila kuamua kimya kimya kama רָע ni uovu wa kimaadili au maafa.
- source_word: מִיכָיְהוּ בֶּן־יִמְלָה
  choice: Mikaya mwana wa Imla
  rationale: Majina yametolewa kwa maumbo yanayotumika kwa kawaida katika Kiswahili, na uhusiano wa nasaba umehifadhiwa moja kwa moja.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: Mfalme asiseme hivyo
  rationale: Muundo wa nafsi ya tatu unatunza katazo lenye heshima na sauti ya kimahakama ya jibu la Yehoshafati.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni, hivyo jina binafsi “Yahwe” linahifadhi marejeo ya agano bila kulibadilisha kuwa cheo.
- issue: Maana pana ya רָע katika malalamiko ya mfalme
  choice: mabaya
  alternative: maafa
  rationale: “Mabaya” linahifadhi upana wa neno la Kiebrania na mtazamo wa mfalme, bila kulazimisha tafsiri kuwa unabii wa maafa pekee au uovu wa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi wa mfalme ni wa moja kwa moja na wa kawaida, huku jibu la Yehoshafati likitunza heshima ya mazingira ya kifalme.
