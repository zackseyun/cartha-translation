  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I come in peace.’'
translation:
  language: sw
  text: 'na useme, “Mfalme asema hivi: ‘Mtieni mtu huyu gerezani, mpeeni mkate wa dhiki na maji ya dhiki[a] mpaka nitakapokuja kwa amani.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkate wa shida” na “maji ya shida”; inaelekea usemi huu unamaanisha mgao mkali au mchache wa wafungwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Mfalme asema hivi
  rationale: Inahifadhi mtindo rasmi wa ujumbe wa kifalme huku ikiwa Kiswahili cha kawaida na chenye hadhi.
- source_word: שִׂימוּ אֶת זֶה
  choice: Mtieni mtu huyu
  rationale: Kiwakilishi cha kuonyesha kinamrejelea Mikaya; ‘mtu huyu’ kinaeleweka kwa kawaida bila kuongeza maana mpya.
- source_word: בֵּית הַכֶּלֶא
  choice: gerezani
  rationale: Ni tafsiri ya asili na wazi ya ‘nyumba ya kifungo’ katika Kiswahili cha sasa.
- source_word: וְהַאֲכִילֻהוּ
  choice: mkampe chakula
  rationale: Kitenzi cha Kiebrania ni kausativi ya ‘kula’; usemi huu unasikika kwa kawaida na unaunganika vizuri na mgao unaofuata.
- source_word: לֶחֶם לַחַץ
  choice: chakula cha shida
  rationale: ‘Chakula’ hapa huwakilisha mkate kama riziki au mgao wa kula; ‘cha shida’ kinahifadhi ukali na kutokamilika kwa maana ya לַחַץ bila kuamua ikiwa ni mateso au mgao mchache.
- source_word: וּמַיִם לַחַץ
  choice: maji ya shida
  rationale: Inadumisha usambamba wa Kiebrania na usemi uliotangulia, huku tanbihi ikieleza maana inayowezekana ya mgao mkali au mchache.
- source_word: עַד בֹּאִי בְשָׁלוֹם
  choice: mpaka nitakaporudi salama
  rationale: Katika muktadha, בואי ni kurudi kwa mfalme kutoka vitani, na בְשָׁלוֹם humaanisha kurudi akiwa salama; tafsiri hii ni ya asili na bado inadumisha kejeli ya kisimulizi.
theological_decisions:
- issue: Maana ya בְשָׁלוֹם katika kauli ya Ahabu
  choice: salama
  alternative: kwa amani
  rationale: ‘Salama’ huwasilisha uwezekano mkuu wa kurudi bila kujeruhiwa, bila kuibadili kuwa madai ya ushindi; kejeli ya ahadi yake dhidi ya unabii wa Mikaya inabaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kauli ya kifalme imetolewa kwa mtindo rasmi lakini unaoeleweka kwa wasomaji wa kawaida. Usambamba wa ‘chakula cha shida na maji ya shida’ umehifadhiwa na kufafanuliwa kwa tanbihi.
