  text: And Jehoshaphat made peace with the king of Israel[a].
translation:
  language: sw
  text: Naye Yehoshafati akafanya amani na mfalme wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yehoshafati alikuwa na amani na mfalme wa Israeli.” Kitenzi cha Kiebrania kinaweza kueleweka kuwa kufanya amani au kuwa katika hali ya amani; matini kuu inapendelea maana ya kufanya amani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/יַּשְׁלֵם
  choice: akafanya amani
  rationale: Kitenzi שׁלם katika Hifili chenye waw mfululizo hapa kinaonyesha kuanzisha au kufikia uhusiano wa amani. “Akafanya amani” ni Kiswahili cha kawaida kinachohifadhi maana ya tukio, bila kukiondoa kabisa uwezekano wa hali ya kuwa na amani.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: עִם
  choice: na
  rationale: Kihusishi hiki kinaonyesha upande mwingine ambaye Yehoshafati alifanya naye amani; “na” ni usemi wa kawaida katika Kiswahili.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Muundo wa hali ya kuambatana umetafsiriwa moja kwa moja na kwa kawaida, ukimaanisha mfalme wa ufalme wa kaskazini aliyekuwa akitawala wakati huo.
