base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/014.yaml
  text: And Micaiah said[a], “As Yahweh lives, whatever Yahweh says to me, that I will speak.”
translation:
  language: sw
  text: Mikaya akasema, “Kama Yahwe aishivyo,[a] chochote ambacho Yahwe ataniambia, hicho ndicho nitakachosema.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kama Yahwe aishivyo” ni kauli ya kiapo yenye uzito; kwa maana halisi, “Yahwe yu hai.”
    reason: Kauli ya Kiebrania ni fomula ya kiapo ambayo tafsiri ya neno kwa neno inaweza isionyeshe wazi kazi yake kwa msomaji wa kisasa.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Muundo wa masimulizi wa wayyiqtol unaendeleza tukio na kutambulisha maneno ya moja kwa moja; ‘akasema’ ni wa kawaida na wa asili katika Kiswahili.
- source_word: מִיכָיְהוּ
  choice: Mikaya
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: חַי יְהוָה
  choice: Kama Yahwe aishivyo
  rationale: Hii ni kauli ya kawaida ya kiapo katika Kiebrania. Tafsiri hii inahifadhi uzito wa kiapo na inasikika kwa heshima katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: כִּי אֵת אֲשֶׁר
  choice: chochote ambacho
  rationale: Muunganiko huu unaanzisha jambo lote litakalosemwa na Yahwe; ‘chochote ambacho’ ni Kiswahili cha asili kinachohifadhi maana ya upeo usio na kizuizi.
- source_word: יֹאמַר ... אֵלַי
  choice: atakachoniambia
  rationale: Kauli isiyotimilika hapa inaelekea wakati ujao, na kiambishi cha Kiswahili kinaonyesha kwa kawaida kwamba maneno yataelekezwa kwa Mikaya.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: hicho ndicho nitakachosema
  rationale: Kiwakilishi rejelezi אֹתוֹ kimehifadhiwa kwa msisitizo wa ‘hicho ndicho,’ huku אֲדַבֵּר ikitafsiriwa kwa kitenzi cha kawaida ‘kusema.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania inatumia moja kwa moja Tetragramatoni יהוה. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza fasiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Rudufu ya jina ‘Yahwe’ na msisitizo wa ‘hicho ndicho’ zimehifadhiwa kwa sababu zinaonyesha uzito wa ahadi ya kinabii katika matini ya Kiebrania.
