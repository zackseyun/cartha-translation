base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/046.yaml
  text: The rest of the acts of Jehoshaphat[a], and his might that he showed, and how he fought—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: sw
  text: Matendo mengine ya Yehoshafati, na ushujaa wake aliouonyesha[a] na jinsi alivyopigana, je, hayakuandikwa katika Kitabu cha Mambo ya Nyakati ya Wafalme wa Yuda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na matendo yake makuu.” Kiebrania huunganisha “ushujaa wake” na “alioufanya,” nahau inayomaanisha uwezo au ushujaa ulioonyeshwa kwa matendo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Matendo mengine ya
  rationale: Katika muhtasari huu wa kifalme, יֶתֶר ni mambo yaliyobaki au mengine, na דִּבְרֵי humaanisha matendo au mambo ya utawala, si maneno pekee.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: pamoja na ushujaa wake aliouonyesha
  rationale: גְּבוּרָה linaweza kumaanisha nguvu, ushujaa, au matendo makuu. Muundo wa Kiebrania, kihalisi 'ushujaa wake alioufanya,' unaeleza uwezo uliojitokeza kwa matendo; 'aliouonyesha' ni Kiswahili cha asili kinachohifadhi maana hiyo.
- source_word: וַאֲשֶׁר נִלְחָם
  choice: na jinsi alivyopigana
  rationale: Nifali נִלְחָם humaanisha kupigana au kufanya vita. 'Jinsi alivyopigana' huhifadhi kishazi husishi bila kuongeza nomino 'vita' isiyosemwa wazi.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: Huhifadhi swali la balagha la Kiebrania katika Kiswahili cha kawaida; kiwakilishi cha ngeli kinaelekeza kwenye matendo na mambo yaliyotajwa.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: katika Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda
  rationale: Hili ni jina la kumbukumbu za kifalme. 'Mambo ya Nyakati' ni tafsiri iliyo wazi na iliyozoeleka, na לְ inaonyesha kumbukumbu zinazowahusu wafalme wa Yuda.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi cha kihistoria lakini kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha na uwezekano wa גְּבוּרָה kumaanisha ushujaa au matendo makuu vimehifadhiwa.
