base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/015.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should we refrain?” And he said to him, “Go up and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: sw
  text: Basi akaja kwa mfalme[a], naye mfalme akamwambia, “Mikaya, je, twende Ramothi-gileadi kupigana, au tuache?” Akamjibu, “Panda, ukafanikiwe; Yahweh atauitia mikononi mwa mfalme.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda jibu la Mikaya lilikuwa la kejeli kulingana na muktadha; lakini Kiebrania chenyewe hakionyeshi kejeli hiyo waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: Basi akaja
  rationale: Wayyiqtol inaendeleza mfululizo wa matukio; “Basi” inaleta mwendelezo wa kawaida wa simulizi kwa Kiswahili.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uamilifu wa uhakika imetafsiriwa kwa kawaida; kurudiwa kwake kunadumisha mazingira rasmi ya kifalme.
- source_word: מִיכָיְהוּ
  choice: Mikaya
  rationale: Hili ni umbo la jina linalotambulika na wasomaji wa Biblia ya Kiswahili.
- source_word: הֲנֵלֵךְ
  choice: je, twende
  rationale: Kauli ya kuuliza ya nafsi ya kwanza wingi inaomba ushauri kuhusu hatua inayopaswa kuchukuliwa.
- source_word: רָמֹת גִּלְעָד
  choice: Ramothi-gileadi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likihifadhi utambulisho wake.
- source_word: לַמִּלְחָמָה
  choice: kupigana
  rationale: Kihusishi pamoja na nomino huonyesha kusudi la kwenda; “kupigana” ni usemi wa asili na wazi katika muktadha wa kijeshi.
- source_word: אִם נֶחְדָּל
  choice: au tuache
  rationale: Kishazi kinatoa njia mbadala ya kutokwenda vitani; “tuache” ni fupi, ya sasa, na inaacha kitendo kinachorejelewa kieleweke kutokana na muktadha.
- source_word: עֲלֵה
  choice: Panda uende
  rationale: Kitenzi עלה kimsingi humaanisha kwenda juu na hapa kinaashiria mwendo wa kijeshi; tafsiri hii inadumisha picha hiyo bila kukifanya kimaanishe moja kwa moja “shambulia.”
- source_word: וְהַצְלַח
  choice: ukafanikiwe
  rationale: Hifili ya צלח inaeleza kufanikiwa katika jambo linalofanywa. Umbo hili linafuata kwa asili amri iliyotangulia.
- source_word: וְנָתַן יְהוָה
  choice: Yahweh atauitia
  rationale: Kauli timilifu inayofuata amri inaweza kueleza matokeo ya baadaye yanayohakikishwa; wakati ujao unafikisha maana hiyo kwa Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa namna ya kulitamka badala ya kubadilishwa na cheo.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: mikononi mwa mfalme
  rationale: Nahau ya Kiebrania ya kukabidhi katika mkono wa mtu inaonyesha kuweka chini ya mamlaka yake; “mikononi mwa” ni nahau ya Kiswahili inayohifadhi picha na maana hiyo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia Tetragramatoni yenyewe; “Yahweh” huhifadhi jina hilo binafsi badala ya kulibadilisha na cheo.
- issue: Toni ya jibu la kwanza la Mikaya
  choice: Maneno yametafsiriwa moja kwa moja bila kuongeza alama ya kejeli katika matini kuu
  alternative: Kuongeza maneno au alama zinazoonyesha wazi kejeli
  rationale: Ingawa muktadha mpana unaonyesha kwamba huenda Mikaya alisema kwa kejeli, Kiebrania cha mstari huu hakiwekei toni hiyo alama ya wazi. Tanbihi inaeleza uwezekano huo bila kuondoa utata wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ni wa kawaida na unaoeleweka; nahau za Kiebrania zimehifadhiwa pale zinapobaki wazi kwa msomaji wa Kiswahili.
