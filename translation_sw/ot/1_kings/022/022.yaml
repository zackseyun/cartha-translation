base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/022.yaml
  text: And he said[a], ‘I will go out and be a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also prevail[b]. Go out and do so.’
translation:
  language: sw
  text: Akasema, “Nitatoka, nami nitakuwa roho ya uongo[a] katika vinywa vya manabii wake wote.” Akasema, “Utamshawishi[b], na pia utafanikiwa. Toka, ukafanye hivyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “roho inayosema uongo.”
    reason: lexical_alternative
  - marker: b
    text: Au “utamdanganya” au “utamvuta.” Kitenzi cha Kiebrania kinaweza kumaanisha kushawishi, kuvuta, au kudanganya kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: Nitatoka
  rationale: Kitenzi cha wakati ujao katika nafsi ya kwanza kinaonyesha hatua ambayo roho anakusudia kuchukua; ‘nitatoka’ ni ya kawaida na inadumisha mwangwi wa amri ‘Toka’ baadaye katika mstari.
- source_word: וְהָיִיתִי
  choice: na kuwa
  rationale: Katika muktadha huu roho anapendekeza kuchukua jukumu fulani; ‘kuwa’ ni Kiswahili cha kawaida kuliko tafsiri nzito ya ‘nitakuwa’ baada ya ‘nitatoka,’ bila kupoteza maana.
- source_word: רוּחַ שֶׁקֶר
  choice: roho ya uongo
  rationale: Kirai hiki humtambulisha roho kwa uongo au udanganyifu. ‘Roho ya uongo’ ni cha asili na chenye heshima katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa ‘roho inayosema uongo.’
- source_word: בְּפִי כָּל נְבִיאָיו
  choice: katika vinywa vya manabii wake wote
  rationale: Inadumisha taswira ya Kiebrania ya uongo kuwamo kinywani na kutoka katika usemi wa manabii, huku wingi ‘vinywa’ ukiwa wazi na wa kawaida kwa Kiswahili.
- source_word: תְּפַתֶּה
  choice: Utamshawishi
  rationale: Piel ya פתה inaweza kuonyesha kushawishi, kuvuta kwa hila, au kudanganya. ‘Utamshawishi’ hudumisha wazo la kumvuta Ahabu kwenye hatua fulani bila kufunga maana yote katika udanganyifu pekee.
- source_word: וְגַם תּוּכָל
  choice: na pia utafanikiwa
  rationale: יכל hapa haisemi uwezo wa kinadharia tu, bali matokeo yenye mafanikio ya mpango uliopendekezwa. ‘Utafanikiwa’ huwasilisha matokeo hayo kwa Kiswahili cha sasa.
- source_word: צֵא וַעֲשֵׂה כֵן
  choice: Toka, ukafanye hivyo
  rationale: ‘Toka’ inadumisha kitenzi kilekile cha mwanzo wa pendekezo, na ‘ukafanye hivyo’ ni amri ya kawaida inayorejelea mpango ulioelezwa.
theological_decisions:
- issue: Ruhusa au agizo la Mungu katika tukio linalohusisha udanganyifu
  choice: 'Mazungumzo yametafsiriwa moja kwa moja: roho anajitolea kuwa ‘roho ya uongo,’ kisha anaambiwa atamshawishi, atafanikiwa, na afanye hivyo.'
  alternative: Kulainisha usemi ili uonekane kuwa ruhusa tu, bila kipengele cha kuagizwa.
  rationale: Vitenzi vya Kiebrania ni vya moja kwa moja. Tafsiri haipaswi kuondoa mvutano wa kiteolojia kuhusu enzi ya Mungu na utendaji wa wakala wa pili ambao simulizi lenyewe linauacha wazi.
- issue: Upana wa maana ya פתה
  choice: Utamshawishi
  alternative: Utamdanganya; utamvuta kwa hila
  rationale: Neno linaweza kumaanisha kushawishi, kuhadaa, au kudanganya kulingana na muktadha. Tafsiri kuu imechagua neno pana kiasi, na tanbihi inaonyesha uwezekano mwingine bila kutatua kimabavu utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa mazungumzo na marudio ya ‘akasema’ na ‘toka’ yamedumishwa; taswira ya ‘vinywa vya manabii’ imehifadhiwa badala ya kubadilishwa kuwa maelezo ya kawaida zaidi.
