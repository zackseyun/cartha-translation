base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/030.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself and went into the battle.
translation:
  language: sw
  text: Ndipo mfalme wa Israeli akamwambia Yehoshafati, “Mimi nitabadilisha mwonekano wangu nisitambulike[a], kisha nitaingia vitani; lakini wewe vaa mavazi yako.” Basi mfalme wa Israeli akabadilisha mwonekano wake asitambulike, akaingia vitani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza pia kueleweka kama amri, “Badilisha mwonekano wako usitambulike, uingie vitani.” Hata hivyo, maneno yanayofuata, “mfalme wa Israeli akabadilisha mwonekano wake asitambulike,” yanaunga mkono maana, “Mimi nitabadilisha mwonekano wangu nisitambulike, kisha nitaingia vitani.”
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: Mimi nitajibadilisha nisijulikane
  rationale: Umbo la Kiebrania linaweza kueleweka kama amri ya nafsi ya pili, lakini muktadha unaonyesha kwamba mfalme anaeleza mpango wake mwenyewe; sentensi inayofuata inathibitisha kuwa yeye ndiye aliyejibadilisha. Kauli hii ya Kiswahili inaeleza kwa kawaida kusudi la kujificha bila kudokeza mabadiliko halisi ya sura.
- source_word: וָבֹא
  choice: na kuingia
  rationale: Inaendeleza kusudi la mfalme la kuingia katika mapigano. Muundo wa kitenzi-jina ni wa kawaida baada ya “nitajibadilisha” katika Kiswahili.
- source_word: בַמִּלְחָמָה
  choice: vitani
  rationale: “Vitani” ni usemi wa kawaida na wenye hadhi kwa kuingia katika mazingira ya mapigano.
- source_word: וְאַתָּה
  choice: lakini wewe
  rationale: Kiwakilishi kinaonyesha tofauti dhahiri kati ya kujificha kwa mfalme wa Israeli na mavazi ya Yehoshafati.
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: vaa mavazi yako ya kifalme
  rationale: Neno בְּגָדִים kimsingi humaanisha mavazi, lakini katika muktadha huu tofauti inayokusudiwa ni kati ya kujificha na kuvaa mavazi yanayotambulisha mfalme. “Ya kifalme” huweka maana hiyo wazi.
- source_word: וַיִּתְחַפֵּשׂ
  choice: akajibadilisha asijulikane
  rationale: Tafsiri hii inaonyesha tendo la kujificha kwa kubadili mwonekano au mavazi, na inarudia kwa makusudi wazo lililotajwa katika mpango wake.
- source_word: וַיָּבֹא בַּמִּלְחָמָה
  choice: akaingia vitani
  rationale: Ni mwendelezo wa kawaida wa simulizi na huhifadhi tendo la kuingia katika mapigano.
