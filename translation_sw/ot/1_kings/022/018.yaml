base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/018.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: sw
  text: Ndipo mfalme wa Israeli akamwambia Yehoshafati, “Je, sikukuambia kwamba hatatabiri mema kunihusu, ila mabaya tu[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ila maafa tu.” Kiebrania kinasema kihalisi “mema ... ila mabaya tu,” kikitumia utofautishaji mkali ambao hapa unaweza kumaanisha unabii usiofaa au unaotangaza maafa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu unaendeleza simulizi kwa mfuatano wa kawaida wa Kiswahili na pia unaonyesha kuwa maneno yanaelekezwa kwa Yehoshafati.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Hili ni tafsiri ya moja kwa moja ya muundo wa umilikaji; jina ‘Ahabu’ halijaongezwa kwa kuwa halipo katika mstari huu.
- source_word: אֶל יְהוֹשָׁפָט
  choice: akamwambia Yehoshafati
  rationale: Kihusishi kinaonyesha anayeelekezewa maneno. Jina peke yake limetumiwa bila kuongeza cheo kisichotajwa hapa.
- source_word: הֲלוֹא אָמַרְתִּי אֵלֶיךָ
  choice: Je, sikukuambia
  rationale: Swali hili la balagha linatarajia kukubaliwa na linaendeleza sauti ya mfalme ya kukemea au kujitetea.
- source_word: לֹא יִתְנַבֵּא
  choice: hatatabiri
  rationale: Wakati ujao katika Kiswahili unafaa kwa kauli iliyoripotiwa baada ya ‘sikukuambia’ na unaonyesha matarajio ya mfalme kuhusu tabia ya nabii.
- source_word: עָלַי
  choice: kunihusu
  rationale: Katika muktadha wa usemi wa kinabii, neno hili lina maana ya ‘kuhusu’ au ‘juu ya’; ‘kunihusu’ ni Kiswahili cha sasa na cha asili.
- source_word: טוֹב
  choice: mema
  rationale: Wingi wa kidhahania ‘mema’ unaonyesha jambo au habari njema bila kuongeza nomino isiyokuwapo katika Kiebrania.
- source_word: כִּי אִם
  choice: ila ... tu
  rationale: 'Muundo huu unaonyesha utofautishaji wa pekee baada ya ukanushaji: si mema, bali mabaya peke yake.'
- source_word: רָע
  choice: mabaya
  rationale: ‘Mabaya’ huhifadhi jozi ya wazi ya kinyume ‘mema ... mabaya’ katika Kiebrania. Katika muktadha inaweza kumaanisha matokeo mabaya au maafa, jambo linalofafanuliwa katika tanbihi.
theological_decisions:
- issue: Maana ya רָע katika malalamiko kuhusu unabii
  choice: mabaya
  alternative: maafa
  rationale: ‘Mabaya’ huhifadhi mvutano na ulinganifu wa maneno ya Kiebrania טוֹב na רָע bila kuamua kimya kimya kwamba neno hilo linamaanisha maafa pekee. Kwa kuwa hapa linaweza kumaanisha ujumbe usiofaa au wa maafa kuhusu mfalme, maana hiyo ya kimuktadha imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa urahisi. Muundo wa swali la balagha na tofauti ya ‘mema ... mabaya’ umehifadhiwa. Alama ya tanbihi imewekwa baada ya neno linalohusika, ‘mabaya tu,’ badala ya baada ya jina Yehoshafati.
