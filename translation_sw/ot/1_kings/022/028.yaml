base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/028.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” And he said, “Hear[b], all you peoples!”
translation:
  language: sw
  text: Mikaya akasema, “Ikiwa kweli utarudi salama, basi Yahweh hakunena kupitia kwangu.” Naye akasema, “Sikieni, enyi watu wote!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia neno la wingi linalomaanisha “watu” au “makundi ya watu”; huu ni mwito wa hadharani unaoelekezwa kwa watu wote kwa upana.
    reason: cultural_note
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Mikaya
  rationale: Umbo la kawaida la Kiswahili la jina hili la Kiebrania, linalofaa katika muktadha wa Biblia.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: Ikiwa kweli utarudi
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi huongeza msisitizo; ‘kweli’ huuhifadhi kwa Kiswahili cha kawaida.
- source_word: בְּשָׁלוֹם
  choice: salama
  rationale: Katika muktadha huu neno linamaanisha kurudi bila kudhurika; ‘salama’ ni la asili zaidi kuliko kutafsiri nahau hiyo neno kwa neno.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: Yahweh hakunena kupitia kwangu
  rationale: Kihusishi בִּי kinaonyesha kwamba nabii ni chombo ambacho Yahweh amenena kupitia kwake; ‘kupitia kwangu’ huwasilisha maana hiyo wazi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina la agano lililoandikwa moja kwa moja katika matini ya Kiebrania.
- source_word: שִׁמְעוּ
  choice: Sikieni
  rationale: Amri ya wingi inayowaita wasikilizaji watoe usikivu, huku ikidumisha sauti ya tangazo la kinabii.
- source_word: עַמִּים כֻּלָּם
  choice: enyi mataifa yote
  rationale: עַמִּים ni wingi na hapa ni mwito wa moja kwa moja; ‘enyi mataifa yote’ huhifadhi upana wa hadhira na wingi huo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina Tetragramatoni moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Msemaji wa kishazi cha mwisho ויאמר
  choice: Mikaya anaendelea kuwa msemaji
  alternative: Kukichukulia kama kauli ya mhariri au ya msemaji mwingine
  rationale: Usomaji wa moja kwa moja wa simulizi unaendeleza mhusika yuleyule, Mikaya, bila kubuni mabadiliko ya msemaji yasiyoelezwa na matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Hakunena’ hudumisha uzito wa kauli ya kinabii bila kuwa cha kizamani kupita kiasi; ‘salama’ huwasilisha maana ya nahau kwa uwazi. Alama [a] imewekwa baada ya mwito unaohitaji ufafanuzi.
