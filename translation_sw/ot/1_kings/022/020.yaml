base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/020.yaml
  text: And Yahweh said[a], “Who will entice Ahab, so that he may go up and fall at Ramoth-gilead?” And this one said one thing, and that one said another.
translation:
  language: sw
  text: Yahwe akasema[a], “Ni nani atakayemshawishi Ahabu, ili apande na kuanguka huko Ramoth-gileadi?” Huyu akasema hivi, na yule akasema vile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atamdanganya”; kitenzi hiki kinaweza pia kumaanisha “kumshawishi,” kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo, kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: יְפַתֶּה
  choice: atakayemshawishi
  rationale: Kitenzi hiki kinaweza kumaanisha kushawishi, kuvuta, au kudanganya. “Kumshawishi” kinadumisha upana wa maana bila kuamua wazi kuwa ni udanganyifu; tanbihi inaonyesha uwezekano huo wa kimuktadha.
- source_word: וְיַעַל
  choice: ili apande
  rationale: Muundo huu unaonyesha kusudi au matokeo yaliyokusudiwa, na “ili” ni wa kawaida na wazi katika Kiswahili.
- source_word: וְיִפֹּל
  choice: na kuanguka
  rationale: Tafsiri ya msingi ya נפל imehifadhiwa; katika muktadha wa vita inaashiria kushindwa au kufa bila kuyaingiza wazi katika matini.
- source_word: בְּרָמֹת גִּלְעָד
  choice: huko Ramoth-gileadi
  rationale: Jina la mahali limetoholewa, huku “huko” likionyesha mahali pa tukio kwa Kiswahili cha kawaida.
- source_word: זֶה בְּכֹה וְזֶה אֹמֵר בְּכֹה
  choice: Huyu akasema hivi, na yule akasema vile
  rationale: Usemi huu unahifadhi viwakilishi vya kuonyesha na tofauti kati ya mapendekezo ya wasemaji bila kuongeza yaliyomo.
theological_decisions:
- issue: Kuhusika kwa Mungu katika kuanguka kwa Ahabu
  choice: Kauli ya moja kwa moja kwamba Yahwe anauliza ni nani atakayemshawishi Ahabu imehifadhiwa.
  alternative: Kulainisha kauli kwa kusema ni nani atakayemwelekeza au kumshawishi kwa namna isiyo na hila.
  rationale: Kiebrania kinamwonyesha Yahwe akianzisha swali katika baraza la mbinguni. Tafsiri inadumisha mvutano wa kiteolojia na taswira ya hukumu bila kuifafanua kwa msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ahabu” na “Ramoth-gileadi” zimetumiwa kama maumbo ya majina yanayosomeka kwa urahisi katika Kiswahili; sentensi ya mwisho imewekwa kwa mtindo mfupi unaoakisi muundo wa Kiebrania.
