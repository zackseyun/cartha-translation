base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/051.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoram his son became king in his place.
translation:
  language: sw
  text: Yehoshafati akalala pamoja na baba zake[a], akazikwa pamoja na baba zake katika Mji wa Daudi, baba yake[b]. Kisha Yehoramu mwanawe akawa mfalme mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “akalala pamoja na baba zake” ni kauli ya kawaida inayomaanisha kwamba alikufa.
    reason: lexical_alternative
  - marker: b
    text: Neno “baba” hapa ni lugha ya kiukoo ya Kiebrania; linaweza pia kumaanisha babu au mmoja wa mababu zake.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Katika kauli ya kawaida ya taarifa za kifo cha wafalme, kitenzi hiki pamoja na ‘baba zake’ ni nahau ya kufa. ‘Akalala’ huhifadhi taswira na mtindo wa Kiebrania, huku tanbihi ikifafanua maana.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Hii ni kauli ya kawaida ya ukoo wa kifalme. ‘Baba zake’ inalingana kwa karibu na Kiebrania na hapa inawahusu waliomtangulia katika ukoo.
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Umbo la kutendwa la Kiebrania linatafsiriwa kwa kawaida kuwa ‘akazikwa,’ bila kuongeza wazo maalumu la kaburi la aina fulani.
- source_word: בְּעִיר דָּוִד
  choice: katika Mji wa Daudi
  rationale: Hili ni jina la mahali; matumizi ya herufi kubwa katika ‘Mji’ yanaonyesha kuwa ni jina maalumu na yanaakisi vizuri muundo wa Kiebrania.
- source_word: אָבִיו
  choice: baba yake
  rationale: Neno la Kiebrania linaweza kumaanisha baba wa moja kwa moja au babu/mzazi wa zamani. Tafsiri ya karibu ‘baba yake’ imehifadhiwa, na maana yake pana ya kiukoo imeelezwa katika tanbihi.
- source_word: וַיִּמְלֹךְ
  choice: akawa mfalme
  rationale: Katika muktadha wa urithi wa ufalme, kitenzi kinaonyesha kuingia madarakani, si muda wote wa kutawala.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Kauli hii huonyesha kwamba Yehoramu alimrithi Yehoshafati katika cheo cha mfalme.
