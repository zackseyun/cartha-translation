base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/052.yaml
  text: Ahaziah son of Ahab became king over Israel in Samaria in the seventeenth year of Jehoshaphat king of Judah, and he reigned over Israel two years.
translation:
  language: sw
  text: Ahazia mwana wa Ahabu alianza kutawala Israeli huko Samaria, katika mwaka wa kumi na saba wa utawala wa Yehoshafati mfalme wa Yuda; naye akatawala Israeli kwa miaka miwili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: alianza kutawala
  rationale: Katika taarifa hii ya kupanda kiti cha enzi, kitenzi kinaonyesha mwanzo wa utawala wa Ahazia. Kiswahili hiki ni cha kawaida na huepuka maana inayoweza kueleweka kana kwamba ndipo alipofanywa kuwa mfalme ndani ya Samaria.
- source_word: עַל יִשְׂרָאֵל
  choice: Israeli
  rationale: Pamoja na kitenzi 'kutawala', Kiswahili cha kawaida hutumia yambwa moja kwa moja badala ya muundo mzito wa 'kutawala juu ya Israeli'.
- source_word: בְּשֹׁמְרוֹן
  choice: akiwa Samaria
  rationale: Kihusishi kinaonyesha mahali pa makao ya kifalme ambako Ahazia alitawala; 'akiwa Samaria' huwasilisha uhusiano huo kwa uwazi katika Kiswahili.
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה לִיהוֹשָׁפָט
  choice: katika mwaka wa kumi na saba wa utawala wa Yehoshafati
  rationale: Huu ni mtindo wa kuhesabu mwaka wa utawala wa mfalme mwingine. Neno 'utawala' limeongezwa kwa uwazi wa maana iliyomo katika fomula ya Kiebrania.
- source_word: וַיִּמְלֹךְ
  choice: naye akatawala
  rationale: Baada ya taarifa ya kuanza kutawala, kitenzi hiki kinaeleza muda wa utawala wake na kudumisha mtiririko wa simulizi.
- source_word: שְׁנָתָיִם
  choice: kwa miaka miwili
  rationale: Umbo la uwili linamaanisha miaka miwili; 'kwa' huonyesha muda kwa Kiswahili cha kawaida.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: Ahazia mwana wa Ahabu
  rationale: Majina yametoholewa kwa maumbo yaliyozoeleka katika Kiswahili, na uhusiano wa kifamilia wa muundo wa Kiebrania umehifadhiwa.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Cheo hiki kinamtambulisha Yehoshafati kwa usahihi na kwa mtindo wa kawaida wa Kiswahili.
