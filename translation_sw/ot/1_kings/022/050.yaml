base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/050.yaml
  text: Then Ahaziah son of Ahab said to Jehoshaphat[b][a], “Let my servants go with your servants in the ships,” but Jehoshaphat was not willing.
translation:
  language: sw
  text: Ndipo Ahazia mwana wa Ahabu akamwambia Yehoshafati, “Watumishi wangu waende pamoja na watumishi wako katika meli,” lakini Yehoshafati hakukubali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lakini Yehoshafati hakuwa tayari.” Kiebrania kinasema kihalisi zaidi kwamba “hakuwa tayari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Kiashirio cha mfuatano wa matukio; “Ndipo” kinaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: אָמַר ... אֶל
  choice: akamwambia
  rationale: Muundo wa Kiswahili unaunganisha kitenzi cha kusema na yule anayeambiwa kwa njia ya asili.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: Ahazia mwana wa Ahabu
  rationale: Majina yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili, na בֶן imetafsiriwa “mwana wa.”
- source_word: יֵלְכוּ
  choice: waende
  rationale: Kauli tegemezi hapa inaonyesha pendekezo au ombi, ambalo “waende” hulitoa kwa kawaida katika usemi wa moja kwa moja.
- source_word: עֲבָדַי ... עֲבָדֶיךָ
  choice: watumishi wangu ... watumishi wako
  rationale: “Watumishi” huhifadhi ulinganifu na maana pana ya עֶבֶד bila kudai kwamba walikuwa watumwa au maofisa pekee.
- source_word: עִם
  choice: pamoja na
  rationale: Hutoa maana ya ushirika iliyo katika kihusishi cha Kiebrania.
- source_word: בָּאֳנִיּוֹת
  choice: katika meli
  rationale: “Meli” ni tafsiri ya kawaida ya אֳנִיּוֹת; “katika” hufuata kihusishi cha Kiebrania na linafaa kwa safari ya majini.
- source_word: וְלֹא אָבָה
  choice: lakini ... hakukubali
  rationale: אָבָה katika ukanushi humaanisha kutokuwa tayari au kutokubali; “hakukubali” ni ya asili na haiongezi maelezo ya sababu.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Umbo la jina lililozoeleka katika tafsiri za Kiswahili.
