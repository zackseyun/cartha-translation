  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa sasa. Taswira ya Kiebrania ‘kwa kinywa kimoja’ imehifadhiwa katika matini na kufafanuliwa katika tanbihi.
