base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/013.yaml
  text: And the messenger who had gone to summon Micaiah spoke to him[a], saying, “Look now, the words of the prophets are with one mouth favorable to the king. Please let your word be like the word of one of them, and speak favorably.”
translation:
  language: sw
  text: Yule mjumbe aliyekwenda kumwita Mikaya akamwambia, “Tazama sasa, maneno ya manabii kwa kinywa kimoja[a] ni mazuri kwa mfalme. Tafadhali, neno lako na liwe kama neno la mmoja wao, nawe useme mema.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kwa kinywa kimoja,” yaani, “kwa sauti moja” au “kwa kauli moja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: mjumbe
  rationale: Katika muktadha huu ni mtu aliyetumwa kumwita Mikaya, si kiumbe wa mbinguni; ‘mjumbe’ ni tafsiri ya kawaida na sahihi.
- source_word: לִקְרֹא
  choice: kumwita
  rationale: Kitenzi kina maana ya kuita; hapa kinahusu kuitwa kwa Mikaya aje mbele ya mfalme. ‘Kumwita’ ni ya asili katika Kiswahili na haiingizi wazo la mwaliko wa hiari.
- source_word: הִנֵּה נָא
  choice: Tazama basi
  rationale: ‘Tazama’ huvuta fikira, na ‘basi’ husaidia kuonyesha sauti ya ombi na ushawishi bila kuwa ya kizamani kupita kiasi.
- source_word: דִּבְרֵי הַנְּבִיאִים
  choice: maneno ya manabii
  rationale: Huhifadhi muundo na maana ya msingi ya Kiebrania bila kuyafafanua mapema kuwa unabii rasmi au ujumbe mmoja.
- source_word: פֶּה אֶחָד
  choice: kwa kinywa kimoja
  rationale: Huhifadhi taswira halisi ya Kiebrania; maana yake ya kimethali inaelezwa katika tanbihi.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: yanampendeza mfalme
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba maneno hayo ni mazuri au yenye kumpendelea mfalme, bila kudai kwamba ni ya kweli.
- source_word: יְהִי נָא דבריך
  choice: Tafadhali, neno lako na liwe
  rationale: Huhifadhi umoja wa ‘neno’ kama ujumbe wa Mikaya na pia nguvu ya ombi iliyomo katika נָא.
- source_word: כִּדְבַר אַחַד מֵהֶם
  choice: kama neno la mmoja wao
  rationale: Hufuata umoja wa muundo wa Kiebrania na kuonyesha shinikizo la Mikaya kufuata mfano wa nabii yeyote kati yao.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: nawe useme yanayompendeza mfalme
  rationale: Kiswahili hiki ni cha asili na huonyesha kwamba mjumbe anamtaka Mikaya atoe ujumbe wenye kumpendelea mfalme; ‘mfalme’ imerudiwa kwa uwazi ingawa inaeleweka kutoka kishazi kilichotangulia.
