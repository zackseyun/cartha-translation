review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the human messenger, Micaiah, the collective force of 'one mouth,' and the messenger's pressure for a favorable utterance. However, 'yanampendeza mfalme' can mean that the prophets' words please the king, whereas the Hebrew טוב אל המלך more directly describes their speech as favorable/good in relation to the king. The final repetition 'yanayompendeza mfalme' similarly narrows the wording beyond the Hebrew's concise 'speak good.'
  naturalness: The draft is generally clear Standard East African Swahili. 'Tazama sasa' is a more natural equivalent for the attention-getting yet persuasive הִנֵּה נָא than 'Tazama basi' in this context. The revised wording is smoother while retaining the biblical narrative register.
  terminology: Mjumbe, kumwita, manabii, and Mikaya are appropriate. 'Kwa kinywa kimoja' properly preserves the Hebrew image, with a useful explanatory footnote. 'Ni mazuri kwa mfalme' and 'useme mema' retain the source's semantic breadth without turning it specifically into speech that merely pleases the king.
  issues:
  - severity: medium
    issue: The wording 'yanampendeza mfalme' / 'yanayompendeza mfalme' can shift the sense to speech that pleases the king.
    rationale: The Hebrew says the prophets' words are טוב אל המלך and asks Micaiah to 'speak good'; it calls for a favorable message but does not explicitly state that the king is pleased by it. The revised wording preserves this breadth.
  - severity: low
    issue: '''Tazama basi'' is less direct than the source''s attention-getting appeal.'
    rationale: '''Tazama sasa'' idiomatically conveys both הִנֵּה (''look/behold'') and נא (''now/please'') in contemporary formal Swahili.'
  revised_text: Yule mjumbe aliyekwenda kumwita Mikaya akamwambia, “Tazama sasa, maneno ya manabii kwa kinywa kimoja[a] ni mazuri kwa mfalme. Tafadhali, neno lako na liwe kama neno la mmoja wao, nawe useme mema.”
