revisions:
- from: Yule mjumbe aliyekuwa amekwenda kumwita Mikaya akamwambia, “Tazama basi, maneno ya manabii kwa kinywa kimoja[a] yanampendeza mfalme. Tafadhali, neno lako na liwe kama neno la mmoja wao, nawe useme yanayompendeza mfalme.”
  to: Yule mjumbe aliyekwenda kumwita Mikaya akamwambia, “Tazama sasa, maneno ya manabii kwa kinywa kimoja[a] ni mazuri kwa mfalme. Tafadhali, neno lako na liwe kama neno la mmoja wao, nawe useme mema.”
  rationale: The revision removes an avoidable semantic narrowing from 'please the king' to the source's broader favorable/good-for-the-king language, while preserving the concise final imperative and the Hebrew idiom with its footnote.
