source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפֹצִ֣ים אֶל הֶ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/017.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: sw
  text: Naye akasema, “Niliwaona Waisraeli wote wametawanyika milimani, kama kondoo wasio na mchungaji. Naye Yahwe akasema, ‘Hawa hawana bwana[a]; kila mtu na arudi nyumbani kwake kwa amani.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hawa hawana mabwana.” Neno la Kiebrania lina umbo la wingi; katika muktadha huu linamaanisha kwamba Israeli hawana mkuu anayewatawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפֹצִים
  choice: wametawanyika
  rationale: Kitenzi hiki kinaonyesha kutawanywa au kusambaa huku na huku. ‘Wametawanyika’ ni Kiswahili cha kawaida na kinadumisha picha ya jeshi lililotawanywa baada ya kumpoteza kiongozi wake.
- source_word: אֶל הֶהָרִים
  choice: milimani
  rationale: Ingawa אֶל mara nyingi humaanisha kuelekea mahali, hapa pamoja na wazo la kutawanyika inaeleza mahali walipoonekana katika maono. ‘Milimani’ ni usemi wa asili wa Kiswahili.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: kama kondoo wasio na mchungaji
  rationale: Tafsiri hii inadumisha moja kwa moja tashbihi ya kibiblia na nguvu ya usemi wa Kiebrania unaoonyesha kutokuwapo kwa mchungaji.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֲדֹנִים
  choice: bwana
  rationale: Neno la Kiebrania lina umbo la wingi na maana ya mabwana au wenye mamlaka. Katika muktadha huu linamrejelea mkuu anayetawala jeshi, hasa mfalme; ‘bwana’ linabaki karibu na maana ya msingi bila kuongeza tafsiri pana kama ‘kiongozi’.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: kila mtu na arudi nyumbani kwake
  rationale: Kauli ‘na arudi’ inaonyesha nguvu ya agizo au ruhusa katika usemi wa Mungu. ‘Kila mtu’ linawakilisha matumizi ya kugawanya ya אִישׁ kwa Kiswahili cha kawaida.
- source_word: בְּשָׁלוֹם
  choice: kwa amani
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaodumisha maana ya amani, usalama, na pia kinaya cha jeshi kuondoka baada ya kushindwa.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu, si cheo; kwa hiyo jina hilo limehifadhiwa kwa umbo linalofaa Kiswahili.
- issue: Idadi na maana ya אֲדֹנִים
  choice: Hawa hawana bwana
  alternative: Hawa hawana mabwana
  rationale: Ingawa umbo la Kiebrania ni la wingi, muktadha unaelekea kwa kutokuwapo kwa mkuu mmoja wa jeshi, yaani mfalme. Tanbihi inahifadhi uwezekano wa kusoma wingi bila kuuficha.
- issue: Usemi wa kugawanya אִישׁ
  choice: kila mtu
  alternative: kila mmoja
  rationale: Katika Kiswahili, ‘kila mtu’ ni usemi wa kawaida unaowakilisha mtu mmoja mmoja katika kundi bila kubadili upeo wa agizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa maono na tashbihi ya mchungaji umehifadhiwa, huku sintaksia ikifanywa kuwa ya kawaida katika Kiswahili.
