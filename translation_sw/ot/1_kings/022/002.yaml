translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi, wa heshima, na unaoeleweka kwa msomaji wa kawaida. Jina “Yehoshafati” na majina ya maeneo “Yuda” na “Israeli” yanafuata maumbo yaliyozoeleka katika Biblia za Kiswahili.
