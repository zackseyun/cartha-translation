  text: In the third year[a], Jehoshaphat king of Judah went down to the king of Israel.
translation:
  language: sw
  text: Katika mwaka wa tatu, Yehoshafati, mfalme wa Yuda, alishuka[a] kwenda kwa mfalme wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliteremka.” Kitenzi cha Kiebrania kihalisi ni “alishuka” na huenda kinaonyesha tofauti ya miinuko ya maeneo hayo, si kusafiri tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Katika
  rationale: Hapa muundo huu unaanzisha taarifa ya wakati katika simulizi. Kiswahili cha kawaida huunganisha maana yake moja kwa moja na kirai cha wakati badala ya kutafsiri kwa namna nzito, “Ikawa kwamba.”
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: mwaka wa tatu
  rationale: Tafsiri hii inahifadhi maana ya wakati na namba ya mpangilio iliyo katika Kiebrania.
- source_word: וַיֵּרֶד
  choice: alishuka
  rationale: Kitenzi ירד humaanisha kushuka. “Alishuka” kinahifadhi mwelekeo au tofauti ya miinuko bila kufanya Kiswahili kisiwe cha kawaida.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina limetolewa kwa umbo lililozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Kirai hiki kinamtambulisha Yehoshafati kwa cheo chake; koma za uambatano zinaifanya sentensi iwe wazi na ya kawaida kwa Kiswahili.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: kwenda kwa mfalme wa Israeli
  rationale: אֶל inaonyesha mwendo kuelekea kwa mtu. “Kwenda kwa” ni wazi katika Kiswahili na huepuka kuongeza wazo lisilosemwa, kama vile kwenda kumtembelea au kumwona.
