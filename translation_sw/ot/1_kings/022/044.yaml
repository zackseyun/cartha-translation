base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/044.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: sw
  text: Lakini maeneo ya juu[a] hayakuondolewa; watu waliendelea kutoa dhabihu na kufukiza uvumba katika maeneo hayo ya juu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maeneo ya ibada.” Neno la Kiebrania linamaanisha maeneo ya ibada ya mahali, ambayo mara nyingi yalikuwa kwenye miinuko; kwa kawaida hutafsiriwa “maeneo ya juu.”
    reason: lexical_alternative
  - marker: b
    text: Aya haisemi kama dhabihu hizi zilitolewa kwa BWANA katika maeneo yasiyoruhusiwa au zilikuwa sehemu ya ibada pana zaidi ya sanamu.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Huonyesha tofauti na tathmini nzuri iliyotangulia, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: הַבָּמוֹת
  choice: mahali pa juu
  rationale: Ni istilahi ya kawaida ya kibiblia kwa maeneo ya kienyeji ya ibada, mara nyingi yaliyokuwa kwenye miinuko; haiyafafanui moja kwa moja kuwa madhabahu ya sanamu.
- source_word: לֹא סָרוּ
  choice: hapakuondolewa
  rationale: Ingawa kitenzi cha Kiebrania kwa umbo la nje ni 'hapakuondoka,' katika muktadha huu maana yake ni kwamba maeneo hayo ya ibada hayakuondolewa.
- source_word: עוֹד
  choice: waliendelea
  rationale: Huonyesha kwamba desturi hiyo iliendelea licha ya mabadiliko yaliyotajwa katika muktadha.
- source_word: הָעָם
  choice: watu
  rationale: Tafsiri ya moja kwa moja ya rejeo la pamoja kwa wananchi.
- source_word: מְזַבְּחִים
  choice: kutoa dhabihu
  rationale: Umbo la kishirikishi huonyesha tendo la kawaida lililoendelea; muundo 'waliendelea kutoa' huwasilisha hali hiyo kwa Kiswahili cha asili.
- source_word: וּמְקַטְּרִים
  choice: na kufukiza uvumba
  rationale: Katika muktadha wa ibada, kitenzi hiki kwa kawaida hurejelea kufukiza uvumba au kutoa kitu kwa moshi; hapa usemi wa ibada unaunga mkono 'kufukiza uvumba.'
- source_word: בַּבָּמוֹת
  choice: katika mahali hapo pa juu
  rationale: Hurudia eneo la ibada; 'katika' ni ya asili kwa Kiswahili, na 'hapo' huonyesha kurejelea maeneo yaliyotajwa tayari.
theological_decisions:
- issue: Aina na mlengwa wa ibada katika mahali pa juu
  choice: Aya imetafsiriwa kwa maelezo tu bila kutaja kwamba dhabihu hizo zilitolewa kwa BWANA au kwa miungu mingine.
  alternative: Kufafanua kuwa watu walimwabudu BWANA katika maeneo yasiyoruhusiwa, au kuwa walifanya ibada ya sanamu.
  rationale: Kiebrania kinasema tu kwamba watu walitoa dhabihu na kufukiza uvumba katika mahali pa juu. Kinakosoa kuendelea kwa maeneo hayo lakini hakimtaji wazi mlengwa wa ibada hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'waliendelea kutoa ... na kufukiza' huhifadhi maana ya vitendo vya kawaida vilivyoendelea bila kutumia Kiswahili kizito. Alama zote za tanbihi zimewekwa katika matini kuu.
