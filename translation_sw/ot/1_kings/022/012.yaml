  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כָל הַ/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/012.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: sw
  text: Na manabii wote walikuwa wakitabiri vivyo hivyo, wakisema, “Panda uende Ramoth-gileadi ukafanikiwe[a], naye Yahwe ataiweka Ramoth-gileadi mikononi mwa mfalme.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukastawi.”
    reason: Neno צלח linaweza kumaanisha kufanikiwa au kustawi; katika muktadha huu wa kijeshi, “ukafanikiwe” ndilo chaguo la kawaida zaidi.
lexical_decisions:
- source_word: וְ/כָל הַ/נְּבִאִים
  choice: Na manabii wote
  rationale: Huhifadhi kiunganishi, maana ya ujumla ya כָּל, na nomino yenye uainisho kwa Kiswahili cha kawaida.
- source_word: נִבְּאִים
  choice: walikuwa wakitabiri
  rationale: Umbo la participle linaonyesha tendo lililokuwa likiendelea wakati huo; muundo huu wa Kiswahili unaonyesha hali hiyo kwa kawaida.
- source_word: כֵּן
  choice: vivyo hivyo
  rationale: Neno hili linaeleza namna moja iliyofuatwa na manabii wote, bila kuongeza tafsiri kuhusu ukweli wa ujumbe wao.
- source_word: עֲלֵה
  choice: Panda uende
  rationale: עלה kimsingi ni kupanda au kwenda juu. Kauli hii huhifadhi taswira hiyo huku ikionyesha wazi mwendo kuelekea mahali palipotajwa; muktadha wa kijeshi unabaki kudokezwa badala ya kuingizwa moja kwa moja kama ‘shambulia.’
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth-gileadi
  rationale: Ni uhawilishaji unaotambulika wa jina la mahali, ukipewa umbo linalotamkika kwa kawaida katika Kiswahili.
- source_word: וְ/הַצְלַח
  choice: ukafanikiwe
  rationale: Hiphil ya צלח hapa inaeleza kupata mafanikio. Muundo wa kutegemea baada ya agizo la kwanza ni wa asili katika Kiswahili na hudumisha nguvu ya himizo.
- source_word: וְ/נָתַן
  choice: naye ... atautia
  rationale: Kauli hii inatoa uhakikisho wa matokeo yajayo. ‘Naye’ huhifadhi uratibu wa Kiebrania, na wakati ujao unafaa katika hotuba hii ya kinabii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limehawilishwa badala ya kubadilishwa kuwa cheo.
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  choice: mkononi mwa mfalme
  rationale: Huhifadhi nahau ya Kiebrania ya kukabidhi kitu chini ya mamlaka au udhibiti wa mtu. Umoja wa ‘mkono’ umehifadhiwa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina la Mungu, si cheo; ‘Yahwe’ hulihifadhi kama jina binafsi.
- issue: Kitu kinachowekwa mkononi mwa mfalme
  choice: mji huo
  alternative: ushindi
  rationale: Kiebrania hakitaji yambwa wazi, lakini muktadha unaelekeza kwa Ramoth-gileadi. ‘Mji huo’ hufanya sentensi iwe ya kawaida katika Kiswahili bila kugeuza yambwa kuwa ‘ushindi,’ ambayo ingekuwa tafsiri pana zaidi ya muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa tendo linaloendelea umehifadhiwa, na muktadha wa kijeshi haujaongezwa kwa kutumia kitenzi kama ‘shambulia.’
