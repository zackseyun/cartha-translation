base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/043.yaml
  text: He walked in all the ways of Asa his father[a]; he did not turn aside from them[b], doing what was right in the eyes of Yahweh.
translation:
  language: sw
  text: Aliifuata njia yote ya Asa, baba yake[a]; hakuiacha[b], akifanya yaliyo sawa machoni pa Yahwe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alienda katika njia yote ya Asa, baba yake.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina kiwakilishi cha umoja kinachorejelea “njia.” Pia inaweza kutafsiriwa, “hakugeuka kando nayo.”
    reason: lexical_alternative
  - marker: c
    text: “Machoni pa Yahwe” ni nahau ya Kiebrania yenye maana ya “kwa mtazamo wa Yahwe” au “mbele za Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Alifuata
  rationale: Kitenzi הלך kimsingi ni ‘kwenda/kutembea,’ lakini katika kauli hii ya kutathmini mwenendo wa mfalme kinamaanisha kufuata mtindo wa maisha; ‘alifuata’ ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: בְּכָל דֶּרֶךְ
  choice: njia yote
  rationale: Nomino דֶּרֶךְ iko katika umoja na hapa ni taswira ya mwenendo au mtindo wa maisha. ‘Njia yote’ huhifadhi umoja na taswira ya chanzo.
- source_word: אָסָא אָבִיו
  choice: Asa baba yake
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unaonyesha wazi uhusiano wa kifamilia.
- source_word: לֹא סָר מִמֶּנּוּ
  choice: hakuiacha
  rationale: סור ni kugeuka kando au kuondoka. ‘Hakuiacha’ ni ya asili katika Kiswahili, na kiambishi cha umoja ‘-i-’ kinarejelea ‘njia.’
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: akifanya yaliyo sawa
  rationale: Kauli hii huonyesha tendo linaloendana na tathmini ya maadili; ‘yaliyo sawa’ ni wazi na ya kawaida bila kuongeza maana isiyomo.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi taswira ya nahau ya Kiebrania ya kutathminiwa na Mungu huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa Kiswahili ‘Yahwe’ badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Kauli ya kutathmini mwenendo wa mfalme
  choice: Mstari unasema kwamba Yehoshafati alifuata mwenendo wa Asa baba yake na kufanya yaliyo sawa kwa tathmini ya Yahwe.
  alternative: Kutoa sifa ya jumla zaidi kuhusu uaminifu wake kama mfalme.
  rationale: Tafsiri inadumisha kauli ya chanzo kuhusu mwenendo na tathmini ya Yahwe bila kuongeza madai ya kitheolojia ambayo hayajasemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku taswira ya ‘njia’ na ‘machoni pa Yahwe’ ikihifadhiwa.
