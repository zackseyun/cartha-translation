lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Wakakaa
  rationale: Kitenzi ישׁב kwa msingi humaanisha ‘kukaa,’ na hapa pamoja na kipindi cha miaka mitatu kinaeleza hali iliyoendelea; ‘wakakaa’ ni ya asili katika simulizi la Kiswahili na haiongezi wahusika wasiotajwa.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: miaka mitatu
  rationale: Hiki ni kirai cha muda kinachoonyesha urefu wa kipindi.
- source_word: אֵין מִלְחָמָה
  choice: bila vita
  rationale: Huwakilisha kwa ufupi na kawaida kauli ya Kiebrania ‘hakuna vita’ baada ya kitenzi kinachoonyesha kuendelea kwa hali.
- source_word: בֵּין ... וּבֵין
  choice: kati ya ... na ...
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kuonyesha uhusiano kati ya pande mbili.
- source_word: אֲרָם
  choice: Aramu
  rationale: Jina la Kiebrania linahifadhiwa badala ya kubadilishwa kuwa jina la baadaye la kijiografia, Siria.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ndilo umbo sanifu la jina hili katika Kiswahili.
