lexical_decisions:
- source_word: וַיַּעַל
  choice: wakapanda kwenda
  rationale: Kitenzi עלה humaanisha kupanda au kwenda juu. Usemi “wakapanda kwenda” unahifadhi mwelekeo wa Kiebrania bila kuongeza wazi wazo la kuandamana kivita, ingawa muktadha ni wa vita. Kitenzi cha umoja katika Kiebrania kinafuatiwa na wahusika wawili, lakini Kiswahili sanifu hutumia upatanisho wa wingi.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Chanzo kinatumia cheo badala ya jina binafsi la Ahabu; tafsiri inahifadhi mtindo huo wa simulizi.
- source_word: וִיהוֹשָׁפָט
  choice: na Yehoshafati
  rationale: Jina limetoholewa kwa umbo linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Cheo hiki kinafuata jina la Yehoshafati kama kibainishi, sambamba na muundo wa chanzo.
- source_word: רָמֹת גִּלְעָד
  choice: Ramothi-gileadi
  rationale: Jina la mahali limetoholewa kwa namna inayosomeka kwa Kiswahili, huku kistari kikihifadhi dhana ya jina ambatani.
