  text: And Jehoshaphat son of Asa became king over Judah in the fourth year of Ahab king of Israel.
translation:
  language: sw
  text: Naye Yehoshafati mwana wa Asa alianza kutawala Yuda katika mwaka wa nne wa utawala wa Ahabu, mfalme wa Israeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִ/יהֽוֹשָׁפָט
  choice: Naye Yehoshafati
  rationale: Kiunganishi ו kinahifadhiwa kwa “Naye” ili kuunganisha taarifa hii na simulizi lililotangulia; jina limetoholewa kwa umbo linalotambulika katika Kiswahili.
- source_word: בֶּן אָסָא
  choice: mwana wa Asa
  rationale: Hili ni tamko la kawaida na la moja kwa moja la ukoo katika Kiswahili.
- source_word: מָלַךְ עַל יְהוּדָה
  choice: alianza kutawala Yuda
  rationale: Kitenzi hapa kinaashiria kuingia katika ufalme; “alianza kutawala” kinaonyesha mwanzo wa utawala, huku Yuda ikiwa eneo au taifa alilolitawala.
- source_word: בִּ/שְׁנַת אַרְבַּע
  choice: katika mwaka wa nne
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa tarehe inayohesabiwa kwa miaka ya utawala wa mfalme.
- source_word: לְ/אַחְאָב
  choice: wa utawala wa Ahabu
  rationale: Katika kanuni hii ya kutaja tarehe, לְ inaonyesha kuwa mwaka huo unahesabiwa ndani ya utawala wa Ahabu; neno “utawala” limewekwa wazi ili Kiswahili kisomeke kwa kawaida na bila utata usiokusudiwa.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Cheo hiki kinamtambulisha Ahabu kwa njia ya kawaida na iliyo wazi katika Kiswahili.
