  text: And Ahab slept with his fathers[a], and Ahaziah his son became king in his place.
translation:
  language: sw
  text: Ahabu akalala pamoja na baba zake[a], na Ahazia mwanawe akawa mfalme mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, usemi “alilala pamoja na baba zake” ni fomula ya kawaida katika taarifa za kifalme, inayomaanisha kwamba alikufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Inahifadhi sitiari ya Kiebrania ya kulala inayotumiwa katika taarifa rasmi ya kifo cha mfalme, badala ya kuibadili moja kwa moja kuwa “akafa.”
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Inafuata kwa karibu fomula ya kifalme ya Kiebrania na kuhifadhi ladha yake ya ukoo; tanbihi inaeleza kwamba hapa ni nahau ya kifo.
- source_word: וַיִּמְלֹךְ
  choice: akawa mfalme
  rationale: Inaonyesha kuingia kwa Ahazia katika ufalme wakati wa urithi wa kiti cha enzi, si tu kuendelea kutawala.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba mwana alichukua nafasi ileile ya kifalme.
- source_word: אַחְאָב
  choice: Ahabu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אֲחַזְיָהוּ
  choice: Ahazia
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Inahifadhi wazi uhusiano wa mwana na baba ulio muhimu katika taarifa ya urithi wa kifalme.
