  source_fidelity: 'Rasimu inaeleza kwa usahihi tangazo la kambini wakati wa machweo. Hata hivyo, «arudi» imeongezwa mara mbili ingawa Kiebrania kina kauli ya fomula isiyo na kitenzi wazi: “kila mtu [aende] ...”. Kuacha kitenzi hicho bila kulijaza huhifadhi ufupi na nguvu ya kauli ya asili. «Ukasikika kote kambini» ni ya kueleweka, lakini «ulienea kambini» huakisi vizuri zaidi וַיַּעֲבֹר (“ilipita/ilienea”).'
  naturalness: «Mwito ulienea kambini» ni Kiswahili sanifu na cha kawaida kwa tangazo linalosambaa miongoni mwa watu. Kauli “Kila mtu mjini kwake, na kila mtu katika nchi yake!” ni fupi, yenye nguvu, na ya asili kama tangazo la kuwaachisha wanajeshi.
