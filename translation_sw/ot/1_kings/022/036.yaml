  text: And a cry passed through the camp at sunset[a], saying, “Each man to his city[b], and each man to his land!”
translation:
  language: sw
  text: Jua lilipotua, mwito ulienea kambini[a], ukisema, “Kila mtu mjini kwake, na kila mtu katika nchi yake!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kilio,” “kelele,” au “tangazo.” Neno la Kiebrania רִנָּה mara nyingi humaanisha kilio kikubwa au mwito unaosikika mbali; hapa linahusu tangazo lililoenea katika kambi yote.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kwa neno kwa neno: “Kila mtu mjini kwake, na kila mtu katika nchi yake.” Huu ni usemi wa kuwaaga wanajeshi baada ya vita.'
