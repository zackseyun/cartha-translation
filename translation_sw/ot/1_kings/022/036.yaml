lexical_decisions:
- source_word: וַיַּעֲבֹר הָרִנָּה בַּמַּחֲנֶה
  choice: mwito ukasikika kote kambini
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba mwito mkubwa ulienea katika kambi yote. Neno רִנָּה hapa ni kilio au mwito wa kutangaza, si lazima shangwe.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: Jua lilipokuwa likitua
  rationale: Hii ni nahau ya Kiebrania inayomaanisha wakati wa machweo; tafsiri hii ni wazi na ya asili katika Kiswahili huku ikihifadhi hali ya wakati.
- source_word: לֵאמֹר
  choice: ukisema
  rationale: Inatambulisha moja kwa moja yaliyomo katika mwito.
- source_word: אִישׁ ... וְאִישׁ
  choice: Kila mtu ... na kila mtu
  rationale: Katika Kiswahili, 'kila mtu' ni usemi wa kawaida wa mgawanyo unaolingana na urudiaji wa אִישׁ. Muktadha wa vita unaonyesha waliolengwa ni wapiganaji, bila kulazimisha neno lisilo la kawaida 'kila mwanamume' katika amri hii.
- source_word: אֶל עִירוֹ
  choice: arudi mjini kwake
  rationale: Neno עִיר ni mji; kitenzi 'arudi' kinaeleza kwa kawaida nguvu ya mwito wa kuwaacha waende, ingawa katika Kiebrania kitenzi hicho hakijaandikwa wazi.
- source_word: וְאִישׁ אֶל אַרְצוֹ
  choice: na kila mtu arudi katika nchi yake
  rationale: Neno אֶרֶץ linaweza kumaanisha nchi, eneo, au ardhi ya nyumbani. 'Nchi yake' huhifadhi upana wake na usambamba na 'mjini kwake'.
