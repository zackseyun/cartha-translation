  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִיאִים֮ כְּ/אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הַ/אֵלֵ֞ךְ עַל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן אֲדֹנָ֖/י בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/006.yaml
  text: Then the king of Israel gathered the prophets[a], about four hundred men, and said to them, “Should I go against Ramoth-gilead for battle, or should I refrain?” And they said, “Go up, and the Lord will give it into the hand of the king.”
translation:
  language: sw
  text: Ndipo mfalme wa Israeli akawakusanya manabii, karibu watu mia nne, akawaambia, “Je, niende kupigana vita dhidi ya Ramothi-Gileadi, au nijizuie?” Wakamjibu, “Nenda ukapigane, na Bwana[a] ataitia mikononi mwa mfalme.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nenda ukapigane, na bwana wangu ataitia mikononi mwa mfalme.” Neno la Kiebrania אֲדֹנָי linaweza katika baadhi ya miktadha kumaanisha “bwana wangu,” ingawa hapa yaelekea zaidi kuwa cheo cha Mungu, “Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: akawakusanya
  rationale: Kitenzi hiki cha Kiebrania kinaonyesha kuwaleta watu pamoja; “akawakusanya” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: הַנְּבִיאִים
  choice: manabii
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa watu wanaotajwa kwa wingi kama נביאים.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: karibu watu mia nne
  rationale: Kiambishi כְּ kinaonyesha makadirio, hivyo “karibu” kinahifadhi maana ya idadi isiyoelezwa kuwa kamili kabisa.
- source_word: הַאֵלֵךְ
  choice: Je, niende
  rationale: Swali hili la nafsi ya kwanza linaonyesha kutafakari na kuomba ushauri; “Je, niende” ni la asili katika Kiswahili.
- source_word: עַל רָמֹת גִּלְעָד לַמִּלְחָמָה
  choice: kupigana dhidi ya Ramothi-gileadi
  rationale: Kirai kinaeleza hatua ya kijeshi inayoelekezwa dhidi ya Ramothi-gileadi. Tafsiri hii ni wazi bila kuongeza maelezo yasiyokuwapo.
- source_word: אִם אֶחְדָּל
  choice: au nijizuie
  rationale: חדל hapa ni kuacha au kujiepusha na hatua iliyopendekezwa; “nijizuie” huhifadhi nguvu ya swali la uamuzi.
- source_word: עֲלֵה
  choice: Panda
  rationale: עלה ni nahau ya kawaida ya kijeshi yenye maana ya kwenda juu au kusonga kwenda vitani. “Panda” huhifadhi taswira ya Kiebrania na bado inaeleweka katika muktadha.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Umbo la maandishi linaelekea kuwa cheo cha Mungu hapa, si jina la agano YHWH. Kwa hiyo “Bwana” limetumiwa, huku uwezekano wa “bwana wangu” ukihifadhiwa katika tanbihi.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: mikononi mwa mfalme
  rationale: Hii ni nahau ya kutiwa chini ya mamlaka ya mtu. “Mikononi mwa mfalme” huhifadhi picha ya mkono iliyo katika Kiebrania na ni ya kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya אֲדֹנָי katika jibu la manabii
  choice: Bwana
  alternative: bwana wangu
  rationale: Katika muktadha wa tamko la kinabii, neno hili linaelekea zaidi kuwa cheo cha Mungu. Hata hivyo, kwa kuwa umbo hilo linaweza katika mazingira fulani kumaanisha “bwana wangu,” uwezekano huo haujafutwa bali umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisasa, wenye heshima na unaosomeka kwa urahisi. Nahau ya kijeshi “Panda” na taswira ya kutiwa “mikononi” zimehifadhiwa ili kudumisha ladha ya matini ya Kiebrania bila kufanya sentensi kuwa ngumu.
