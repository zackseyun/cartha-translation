translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa swali la balagha umehifadhiwa. Viashiria vya tanbihi vimewekwa baada ya vifungu vinavyofafanuliwa.
