base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/039.yaml
  text: The rest of the acts of Ahab[a], and all that he did, and the ivory house that he built[b], and all the cities that he built—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: sw
  text: Matendo mengine ya Ahabu, na yote aliyofanya, na nyumba ya pembe za ndovu aliyojenga[a], na miji yote aliyojenga—je, hayakuandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “nyumba ya ndovu.” Inaelekea kwamba hii ilikuwa nyumba ya kifalme iliyopambwa kwa pembe za ndovu, si jengo lililotengenezwa lote kwa pembe za ndovu.
    reason: lexical_alternative
  - marker: b
    text: “Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli” ni kumbukumbu ya kifalme iliyotumiwa kama chanzo katika kitabu cha Wafalme; si lazima kiwe kitabu cha Biblia cha Mambo ya Nyakati.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אַחְאָב
  choice: Matendo mengine ya Ahabu
  rationale: Katika muhtasari wa utawala wa mfalme, דִּבְרֵי humaanisha matendo au mambo yake yaliyorekodiwa, si maneno yake tu; וְיֶתֶר huonyesha yaliyobaki katika simulizi.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: na yote aliyofanya
  rationale: Tafsiri pana na ya moja kwa moja ya עָשָׂה bila kudokeza mafanikio zaidi ya yaliyomo katika Kiebrania.
- source_word: וּבֵית הַשֵּׁן
  choice: na nyumba ya pembe za ndovu
  rationale: Huhifadhi neno la kawaida בֵּית, ‘nyumba,’ bila kulifasiri moja kwa moja kuwa jumba la kifalme; katika Kiswahili ‘pembe za ndovu’ ndiyo istilahi ya kawaida ya ivory.
- source_word: וְכָל הֶעָרִים אֲשֶׁר בָּנָה
  choice: na miji yote aliyojenga
  rationale: עָרִים kwa kawaida ni ‘miji’; tafsiri hii haiongezi dhana ya kwamba yote ilikuwa miji yenye ngome.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: Swali la balagha linatarajia jibu la ndiyo. Ngeli ya ‘matendo/mambo’ inahitaji upatanisho wa ‘hayakuandikwa’ katika Kiswahili cha kawaida.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli
  rationale: ‘Katika kitabu’ ni Kiswahili asilia kwa jambo lililoandikwa kwenye hati; ‘Mambo ya Nyakati’ huwasilisha jina la kumbukumbu za kihistoria, huku tanbihi ikizuia kukichanganya moja kwa moja na kitabu cha Biblia chenye jina hilo.
