base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/054.yaml
  text: He served Baal and bowed down to him[a], and he provoked Yahweh, the God of Israel, just as his father had done.
translation:
  language: sw
  text: Alimtumikia Baali na kumsujudia[a], naye akamkasirisha Yahwe, Mungu wa Israeli, sawasawa na yote aliyofanya baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumwabudu”; kitenzi cha Kiebrania humaanisha kihalisi kuinama au kujitandaza kifudifudi mbele ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: Alimtumikia
  rationale: Kitenzi עבד kimsingi humaanisha ‘kutumikia’; katika muktadha huu kinamaanisha huduma ya ibada kwa Baali, huku kitenzi kinachofuata kikitaja tendo halisi la kusujudu.
- source_word: הַבַּעַל
  choice: Baali
  rationale: ‘Baali’ ni umbo la kawaida la Kiswahili la jina la mungu huyu; kibainishi cha Kiebrania hakihitaji kutafsiriwa kando katika Kiswahili.
- source_word: וַיִּשְׁתַּחֲוֶה לוֹ
  choice: na kumsujudia
  rationale: Kitenzi שׁחה hueleza kuinama au kujilaza mbele ya mtu au mungu. ‘Kumsujudia’ huhifadhi tendo hilo halisi na maana yake ya kiibada bila kulichanganya na ‘kumtumikia.’
- source_word: וַיַּכְעֵס
  choice: akamkasirisha
  rationale: Hifili ya כעס ina maana ya kumsababisha mwingine akasirike; ‘akamkasirisha’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kisababishi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: ‘Yahwe’ huhifadhi jina binafsi la Mungu lililoandikwa kwa herufi יהוה, badala ya kulibadilisha kuwa cheo kama ‘BWANA.’
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania, ikimtambulisha Yahwe kuwa Mungu wa Israeli.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אָבִיו
  choice: kama vile baba yake alivyokuwa amefanya
  rationale: Kauli hii huhifadhi ulinganisho wa Kiebrania kwa Kiswahili cha kawaida; wakati timilifu unaonyesha kwamba matendo ya baba yake yalitangulia.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Mstari unalitaja jina la Mungu wa Israeli kwa kulinganisha naye Baali. ‘Yahwe’ huhifadhi jina hilo binafsi na utofauti uliomo katika maandishi.
- issue: Maana ya וַיִּשְׁתַּחֲוֶה לוֹ
  choice: kumsujudia
  alternative: kumwabudu
  rationale: ‘Kumsujudia’ huhifadhi picha halisi ya kuinama au kujilaza, huku muktadha ukionyesha wazi kuwa ni tendo la ibada. Tanbihi inataja tafsiri pana inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku ‘kumsujudia’ ukihifadhi picha halisi ya Kiebrania na tanbihi ikifafanua maana yake ya kiibada.
