base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/003.yaml
  text: And the king of Israel said to his servants[a], “Do you know that Ramoth-gilead belongs to us[b], yet we are doing nothing to take it from the hand of the king of Aram?”
translation:
  language: sw
  text: Mfalme wa Israeli akawaambia watumishi wake, “Je, mnajua kwamba Ramoth-gileadi ni yetu, na bado hatufanyi lolote[a] kuichukua kutoka mkononi mwa mfalme wa Aramu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “tunanyamaza badala ya kuichukua.” Nahau hiyo inaonyesha kutokuchukua hatua kunakostahili kulaumiwa.
    reason: lexical_alternative
  - marker: b
    text: Aramu ni jina la Kiebrania ambalo mara nyingi limetafsiriwa “Siria” katika tafsiri za zamani.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Neno hili linaweza kumaanisha watumishi au maafisa wa kifalme. “Watumishi wake” linahifadhi upana wa maana ya Kiebrania bila kubainisha cheo kisichotajwa.
- source_word: הַיְדַעְתֶּם
  choice: Je, mnajua
  rationale: Hili ni swali la balagha linalowakumbusha wasikilizaji jambo wanalolijua; Kiebrania hakina ukanushi wa wazi.
- source_word: כִּי לָנוּ רָמֹת גִּלְעָד
  choice: kwamba Ramoth-gileadi ni yetu
  rationale: Kirai לָנוּ kinaonyesha umiliki au dai la eneo. “Ni yetu” ni Kiswahili cha kawaida na kinahifadhi dai hilo bila kuongeza maelezo.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth-gileadi
  rationale: Jina la mahali limetoholewa kwa namna inayotambulika katika matumizi ya Biblia ya Kiswahili, huku muundo wa jina ambatani ukihifadhiwa.
- source_word: מַחְשִׁים
  choice: hatufanyi lolote
  rationale: Kitenzi kihalisi huhusiana na kunyamaza, lakini hapa kinamaanisha kutokuchukua hatua inayotarajiwa. Tafsiri hii inaleta maana ya uzembe wa kulaumiwa kwa Kiswahili cha sasa.
- source_word: מִקַּחַת אֹתָהּ
  choice: kuichukua
  rationale: Kitenzi kinaeleza hatua ambayo haijachukuliwa. Kiambishi “-i-” kinarejelea Ramoth-gileadi kama mahali.
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Nahau ya Kiebrania inaonyesha kuwa eneo hilo liko chini ya mamlaka au udhibiti wa mfalme wa Aramu. Muundo wa “mkononi mwa” unaeleweka katika Kiswahili na kuhifadhi taswira ya chanzo.
- source_word: אֲרָם
  choice: Aramu
  rationale: Jina la kale “Aramu” limetoholewa badala ya kubadilishwa kuwa jina la baadaye la kisiasa “Siria”.
