  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ אַ֣ךְ מֶֽלֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֻ֥רוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֖ק יְהוֹשָׁפָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/032.yaml
  text: And it happened[a], when the commanders of the chariots saw Jehoshaphat, that they said, “Surely he is the king of Israel.” So they turned aside against him to fight[b], but Jehoshaphat cried out.
translation:
  language: sw
  text: Ikawa, majemadari wa magari ya vita walipomwona Yehoshafati, wakasema, “Hakika huyu ndiye mfalme wa Israeli.” Basi wakageuka kumwelekea ili wapigane naye[a], lakini Yehoshafati akapiga kelele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakamgeukia ili kumshambulia.” Kitenzi cha Kiebrania kinaweza kumaanisha kugeuka kuelekea au dhidi ya mtu ili kuingia vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Inahifadhi utangulizi wa kisimulizi wa Kiebrania kwa lugha fupi, ya kawaida na yenye hadhi.
- source_word: כִּרְאוֹת
  choice: walipomwona
  rationale: Muundo wenye כִּי hapa una maana ya wakati; tafsiri hii inaonyesha kwa kawaida kwamba walichukua hatua baada ya kumwona.
- source_word: שָׂרֵי הָרֶכֶב
  choice: majemadari wa magari ya vita
  rationale: שָׂרֵי ni viongozi wa kijeshi, na הָרֶכֶב hapa ni magari ya kijeshi au kikosi chake; ‘magari ya vita’ huepuka maana ya magari ya kawaida ya kisasa.
- source_word: אַךְ
  choice: Hakika
  rationale: Hapa neno hilo linaonyesha uhakika wa majemadari katika kumtambua mtu, si maana ya ‘tu’ au kizuizi.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: huyu ndiye mfalme wa Israeli
  rationale: Ni utambulisho wa mtu aliyekuwa mbele yao; ‘huyu ndiye’ ni Kiswahili cha kawaida na kinadumisha rejeo la kiwakilishi cha kiume katika Kiebrania bila kuongeza habari.
- source_word: וַיָּסֻרוּ עָלָיו
  choice: wakageuka wakamwelekea
  rationale: סור pamoja na עַל inaweza kueleza kugeuka kuelekea au dhidi ya mtu. Kauli hii inahifadhi mwendo wa kuelekea kwake, huku kusudi la uadui likiwekwa wazi na kifungu kinachofuata.
- source_word: לְהִלָּחֵם
  choice: ili wapigane naye
  rationale: Neno hilo lina maana ya kuingia vitani au kupigana; ‘wapigane naye’ linataja kwa kawaida mhusika waliyemwelekea bila kulazimisha maana finyu ya ‘kumshambulia’.
- source_word: וַיִּזְעַק
  choice: akapiga kelele
  rationale: זעק ni kutoa kilio kikubwa, mara nyingi katika dhiki. Tafsiri hii inaonyesha sauti na dharura bila kubuni maneno aliyosema.
