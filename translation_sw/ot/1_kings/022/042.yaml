  text: יְהוֹשָׁפָ֗ט בֶּן שְׁלֹשִׁ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ בְּ/מָלְכ֔/וֹ וְ/עֶשְׂרִ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲזוּבָ֖ה בַּת שִׁלְחִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/042.yaml
  text: Jehoshaphat was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: sw
  text: Yehoshafati alikuwa na umri wa miaka thelathini na mitano alipoanza kutawala, naye alitawala miaka ishirini na mitano huko Yerusalemu. Mama yake aliitwa Azuba, binti ya Shilhi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia, bila kutafsiri maana ya jina.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: alikuwa na umri wa miaka thelathini na mitano
  rationale: Nahau ya Kiebrania, kihalisi ‘mwana wa miaka thelathini na mitano,’ imetolewa kwa Kiswahili cha kawaida kinachoeleza umri.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu unaonyesha wakati wa kuanza kwa utawala; tafsiri hii ni wazi na ya asili katika taarifa ya kifalme.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: miaka ishirini na mitano
  rationale: Huu ni muda wa utawala uliotajwa moja kwa moja.
- source_word: מָלַךְ
  choice: alitawala
  rationale: Kitenzi hiki katika taarifa za kifalme humaanisha kutawala kama mfalme.
- source_word: בִּירוּשָׁלָם
  choice: huko Yerusalemu
  rationale: Kihusishi cha mahali na jina la mji vimetolewa kwa Kiswahili cha kawaida; ‘huko’ kinaonyesha mahali pa utawala.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Hii ni njia ya asili ya Kiswahili ya kusema ‘jina la mama yake lilikuwa,’ huku taarifa ileile ikihifadhiwa.
- source_word: עֲזוּבָה
  choice: Azuba
  rationale: Jina la mtu limetoholewa, si kutafsiriwa.
- source_word: בַּת שִׁלְחִי
  choice: binti ya Shilhi
  rationale: Muundo wa ukoo umetafsiriwa moja kwa moja, na jina Shilhi limetoholewa.
