lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Ni Qal wayyiqtol ya מות, inayoonyesha tukio la kufa katika mfululizo wa masimulizi; “akafa” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye hali ya uainisho inamrejelea mfalme anayejulikana katika muktadha, yaani Ahabu; kubaki na “mfalme” kunafuata wording ya Kiebrania bila kuingiza jina lake ndani ya aya.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: wakamleta Samaria
  rationale: Kitenzi kwa umbo ni nafsi ya tatu umoja tendaji, “akaja Samaria,” lakini baada ya kifo maana ya kimuktadha ni kwamba mwili wa mfalme ulifikishwa Samaria. Kiswahili cha kawaida hueleza maana hiyo kwa “wakamleta Samaria,” huku tanbihi ikihifadhi umbo halisi na utata wa Kiebrania.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Hili ndilo jina la mahali lililozoeleka katika Kiswahili cha Biblia.
- source_word: וַיִּקְבְּרוּ
  choice: wakamzika
  rationale: Ni nafsi ya tatu wingi yenye watendaji wasiotajwa; “wakamzika” huhifadhi mtendaji wa wingi usioainishwa na mfuatano wa masimulizi.
- source_word: אֶת הַמֶּלֶךְ
  choice: mfalme
  rationale: Kiebrania kinarudia nomino “mfalme” kama yambwa. Kurudia “mfalme” badala ya kutumia kiwakilishi pekee kunahifadhi msisitizo na uwazi wa matini.
- source_word: בְּשֹׁמְרוֹן
  choice: huko Samaria
  rationale: Kihusishi ב kinaonyesha mahali pa maziko. “Huko Samaria” ni usemi wa asili unaoepuka kurudia kwa ukavu huku ukibaki wazi kuwa maziko yalifanyika Samaria.
