base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/011.yaml
  text: 'Then Zedekiah son of Chenaanah made for himself horns of iron and said, “Thus says the LORD: With these you will gore Aram until you have finished them off.”'
translation:
  language: sw
  text: 'Kisha Sedekia mwana wa Kenaana akajitengenezea pembe za chuma, akasema, “BWANA asema hivi: Kwa pembe hizi utawapiga kwa pembe Waaramu mpaka utakapowaangamiza.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַרְנֵי בַרְזֶל
  choice: pembe za chuma
  rationale: Tafsiri ya moja kwa moja inayohifadhi kifaa cha ishara alichotengeneza Sedekia.
- source_word: תְּנַגַּח
  choice: utawapiga ... kwa pembe
  rationale: Kitenzi kinamaanisha kupiga au kushambulia kwa pembe; usemi huu unahifadhi picha halisi huku ukiwa wazi kwa msomaji wa Kiswahili.
- source_word: אֲרָם
  choice: Waaramu
  rationale: Katika muktadha huu jina la nchi linawakilisha watu wake, na kiambishi cha wingi katika כַּלֹּתָם kinaunga mkono kutaja Waaramu kama kundi la watu.
- source_word: עַד כַּלֹּתָם
  choice: mpaka uwaangamize kabisa
  rationale: Kirai kinaonyesha kuwakomesha au kuwaondoa wote; ‘kabisa’ huwasilisha ukamilifu wa tendo bila kuongeza maelezo ya kimadhehebu.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika Biblia za Kiswahili ya kuwakilisha jina la Mungu kwa herufi kubwa.
theological_decisions:
- issue: Kauli ya kinabii ya Sedekia
  choice: 'Imehifadhiwa kama dai la moja kwa moja: “BWANA asema hivi”'
  alternative: Kuongeza kwamba huu ulikuwa unabii wa uongo
  rationale: Mstari wenyewe unaripoti dai lake bila kulitathmini ndani ya sentensi; tathmini hiyo hutolewa na muktadha mpana na haipaswi kuingizwa hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi na hadhi ya maandiko. ‘Akajitengenezea’ huwasilisha לּוֹ kwa lugha ya kawaida; ‘Waaramu’ hufanya marejeo ya wingi mwishoni mwa sentensi yawe ya asili.
