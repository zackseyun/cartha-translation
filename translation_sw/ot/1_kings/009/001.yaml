base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/001.yaml
  text: And it happened[a], when Solomon had finished building the house of Yahweh and the king’s house, and all that Solomon desired to make,
translation:
  language: sw
  text: Ikawa, Sulemani alipomaliza kujenga nyumba ya Yahweh, nyumba ya mfalme, na kila alichotamani Sulemani kufanya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tamaa yote ya Sulemani,” au “kila mradi ambao Sulemani alitamani kuufanya.”
    reason: חֵשֶׁק inaweza kutaja tamaa yenyewe au kitu/mradi unaotamaniwa; kishazi cha Kiebrania kinaruhusu namna hizi za kueleza maana.
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni fomula ya usimulizi inayoanzisha hatua mpya; “Ikawa” huiwakilisha kwa lugha ya Biblia iliyo wazi bila kuongeza maana.
- source_word: כְּכַלּוֹת
  choice: alipomaliza
  rationale: כְּ pamoja na kitenzi-jina huonyesha wakati; “alipomaliza” ni Kiswahili cha kawaida na huonyesha kuwa kazi hizo zilikuwa zimekamilika.
- source_word: לִבְנוֹת
  choice: kujenga
  rationale: Baada ya “alipomaliza,” kitenzi-jina “kujenga” hutoa muundo wa asili wa Kiswahili.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: “Nyumba” huhifadhi picha halisi na mlingano na nyumba ya mfalme; jina la agano יְהוָה limetafsiriwa “Yahweh.”
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Huhifadhi usemi halisi na mlingano wa kimuundo na “nyumba ya Yahweh”; “ikulu” ingekuwa tafsiri ya kimuktadha iliyo bainifu zaidi.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה
  choice: kila kitu alichotamani
  rationale: חֵשֶׁק inaweza kumaanisha tamaa au kitu kinachotamaniwa; usemi huu wa Kiswahili ni wa kawaida na unafaa pamoja na kishazi kinachofuata.
- source_word: חָפֵץ
  choice: alichotamani
  rationale: Kitenzi hiki huonyesha kutaka, kutamani, au kupendezwa; “kutamani” huhifadhi mwingiliano wake wa maana na חֵשֶׁק.
- source_word: לַעֲשׂוֹת
  choice: kufanya
  rationale: עשה ni pana, “kufanya/kutengeneza”; “kufanya” huepuka kubainisha kuwa vyote vilikuwa miradi ya ujenzi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usimulizi wa Biblia lakini kinachoeleweka kwa msomaji wa kawaida. “Ikawa” huhifadhi mpito wa kisimulizi; “nyumba” huhifadhi mlingano wa Kiebrania kati ya nyumba ya Yahweh na nyumba ya mfalme.
