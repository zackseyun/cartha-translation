translation:
  language: sw
  text: Wakafika Ofiri, wakachukua kutoka huko talanta mia nne na ishirini za dhahabu, wakazileta kwa Mfalme Sulemani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Wakaenda
  rationale: Ingawa kitenzi בוא kwa msingi kinaweza kumaanisha ‘kuja’ au ‘kufika,’ katika mfululizo huu wa simulizi unaoeleza safari kuelekea Ofiri, ‘wakaenda’ ni Kiswahili cha kawaida na cha asili.
- source_word: אוֹפִירָה
  choice: Ofiri
  rationale: Jina la mahali lina kiambishi cha Kiebrania cha kuelekea mahali; maana hiyo imewasilishwa na muundo ‘wakaenda Ofiri.’
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: wakachukua kutoka huko
  rationale: Tafsiri hii inadumisha maana ya kawaida ya לקח na kihusishi cha wazi מן, kinachoonyesha mahali dhahabu ilikotolewa.
- source_word: זָהָב
  choice: dhahabu
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa metali inayotajwa.
- source_word: אַרְבַּע מֵאוֹת וְעֶשְׂרִים כִּכָּר
  choice: talanta mia nne na ishirini
  rationale: Idadi kamili imehifadhiwa, na ככר limetafsiriwa kwa jina la kipimo cha uzito cha kale, ‘talanta,’ bila kukibadili kuwa kipimo cha kisasa kisicho na uhakika.
- source_word: וַיָּבִאוּ
  choice: wakamletea
  rationale: Hifili ya בוא ina maana ya ‘kuleta’; umbo lenye yambwa ‘-m-’ linatoa Kiswahili cha asili kwa kuonyesha kwamba dhahabu ililetwa kwa Sulemani.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: Mfalme Sulemani
  rationale: Kiswahili kwa kawaida huweka cheo kabla ya jina, huku maana ya kuelekezwa kwake ikionyeshwa katika ‘wakamletea.’
