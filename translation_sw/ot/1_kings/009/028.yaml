translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa urahisi. Viunganishi vya mfululizo ‘waka-’ vinadumisha mwendo wa masimulizi ya Kiebrania. Hakuna tanbihi iliyowekwa kwa kuwa tofauti ya ‘kuja/kwenda’ haisababishi upotevu muhimu katika Kiswahili hiki cha muktadha.
