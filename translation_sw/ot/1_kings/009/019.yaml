translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi na wa kawaida huku ukihifadhi orodha ya Kiebrania, tofauti kati ya magari ya vita na wapanda farasi, pamoja na msisitizo wa hamu ya Sulemani.
