base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/019.yaml
  text: also all the storage cities that belonged to Solomon[a], the chariot cities, the horsemen's cities, and whatever Solomon desired to build in Jerusalem, in Lebanon[c][b], and in all the land of his dominion.
translation:
  language: sw
  text: Pia miji yote ya maghala[a] iliyokuwa ya Sulemani, miji ya magari ya vita, miji ya wapanda farasi[b], na chochote ambacho Sulemani alitamani[c] kujenga katika Yerusalemu, Lebanoni, na katika nchi yote iliyokuwa chini ya utawala wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miji ya kuhifadhia akiba” au “miji ya akiba.” Kiebrania kinarejelea miji iliyotengwa kwa ajili ya kuhifadhi akiba au mahitaji.
    reason: lexical_alternative
  - marker: b
    text: Au “miji ya askari wapanda farasi.” Neno la Kiebrania linarejelea hasa wapanda farasi, si farasi kwa ujumla.
    reason: lexical_alternative
  - marker: c
    text: Kwa neno halisi, “tamaa ya Sulemani ambayo aliitamani”; huu ni usemi wa Kiebrania unaosisitiza mambo ambayo Sulemani alitamani sana kuyajenga.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: miji ya maghala
  rationale: Kirai hiki kinamaanisha miji iliyotengwa kwa ajili ya kuhifadhi akiba au mahitaji. “Miji ya maghala” ni Kiswahili cha sasa na kinaonyesha kazi yake ya kiutawala.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: iliyokuwa ya Sulemani
  rationale: Muundo wa Kiebrania unaweza kuonyesha umiliki au kutengewa; tafsiri hii fupi inadumisha maana hiyo bila kuibana zaidi.
- source_word: עָרֵי הָרֶכֶב
  choice: miji ya magari ya vita
  rationale: רֶכֶב hapa inarejelea magari ya vita na miundombinu au vikosi vyake, si magari ya kawaida.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: miji ya wapanda farasi
  rationale: פָּרָשִׁים inamaanisha hasa wapanda farasi au askari wapanda farasi, wala si farasi peke yao.
- source_word: חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: chochote ambacho Sulemani alitamani
  rationale: Kiebrania kinatumia nomino na kitenzi vya mzizi mmoja kwa msisitizo. Kiswahili hiki ni cha kawaida, kinahifadhi upana wa usemi, na “alitamani” kinadokeza uzito wa nia hiyo.
- source_word: לִבְנוֹת
  choice: kujenga
  rationale: Hii ndiyo maana ya kawaida ya kitenzi בנה katika muktadha wa miradi ya kifalme.
- source_word: בִּירוּשָׁלִַם וּבַלְּבָנוֹן
  choice: huko Yerusalemu, Lebanoni
  rationale: Haya ni maelezo ya mahali. Lebanoni inaeleweka kama eneo la shughuli za ujenzi, si lazima kama rejeo la mbao za mierezi.
- source_word: בְּכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: katika nchi yote iliyokuwa chini ya utawala wake
  rationale: Tafsiri hii ya kawaida inaunganisha maana ya nchi au eneo na mamlaka ya kifalme inayotajwa na מֶמְשָׁלָה.
