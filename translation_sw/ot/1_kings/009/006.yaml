source:
  edition: WLC
  text: אִם שׁ֨וֹב תְּשֻׁב֜וּ/ן אַתֶּ֤ם וּ/בְנֵי/כֶם֙ מֵֽ/אַחֲרַ֔/י וְ/לֹ֤א תִשְׁמְרוּ֙ מִצְוֺתַ֣/י חֻקֹּתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/006.yaml
  text: But if you or your sons turn away from following me[a], and do not keep my commandments and my statutes that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: sw
  text: Lakini ikiwa ninyi na wana wenu mtaacha kabisa kunifuata[a], na hamtazishika amri zangu na sheria zangu nilizoweka mbele yenu, na mkaenda kuitumikia miungu mingine na kuzisujudia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wewe au wanao mtaacha kunifuata.” Kiebrania kinamtaja Solomoni pamoja na wanawe, na onyo linaweza kueleweka kuwa linamhusu yeye au wazao wake wa kifalme.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: ikiwa
  rationale: Hutambulisha sharti. Neno “Lakini” linaonyesha utofauti wa wazo hili na ahadi iliyotangulia, ingawa אִם lenyewe humaanisha “ikiwa.”
- source_word: שׁוֹב תְּשֻׁבוּן
  choice: mtaacha kabisa
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unasisitiza tendo. Pamoja na מֵאַחֲרַי, hapa unaeleza kuacha kumfuata BWANA, si kutubu au kurudi kwake.
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: ninyi na wana wenu
  rationale: Huhifadhi kiunganishi cha Kiebrania na upeo wa kifalme unaomhusu Solomoni pamoja na wazao wake wa kiume. Maana ya sharti inaweza pia kueleweka kuwa onyo kwa Solomoni au kwa wanawe, jambo linaloelezwa katika tanbihi.
- source_word: מֵאַחֲרַי
  choice: kunifuata
  rationale: Ni nahau ya agano inayomaanisha kuendelea kumtii na kumfuata BWANA; katika muktadha huu imeunganishwa na “mtaacha kabisa.”
- source_word: וְלֹא תִשְׁמְרוּ
  choice: wala msizishike
  rationale: שׁמר linapotumiwa kuhusu amri humaanisha kuzitii au kuzishika. “Kushika” ni usemi wa kawaida na wenye hadhi katika muktadha wa agano.
- source_word: מִצְוֺתַי חֻקֹּתַי
  choice: amri zangu na sheria zangu
  rationale: Maneno mawili tofauti ya kisheria yamehifadhiwa. “Amri” huwakilisha מִצְוֹת, na “sheria” huwakilisha חֻקּוֹת kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: nilizoweka mbele yenu
  rationale: נתן pamoja na לִפְנֵי ni nahau ya kuweka au kuwasilisha jambo mbele ya mtu, si kutoa tu.
- source_word: וַהֲלַכְתֶּם
  choice: bali mkaenda
  rationale: הלך hapa huanzisha matendo yanayofuata ya uasi. “Mkaenda” ni ya asili katika Kiswahili na huhifadhi hatua hiyo bila kuitafsiri kihalisi kuwa kutembea.
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: kuitumikia miungu mingine
  rationale: עבד ni kutumikia; tafsiri hii hulitofautisha tendo hilo na kusujudu kunakotajwa baadaye.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: na kuisujudia
  rationale: Kitenzi kinaeleza kuinama au kujilaza mbele ya mwingine. “Kuisujudia” huhifadhi picha halisi ya ibada ya sanamu na rejeo la miungu kama ngeli moja ya Kiswahili.
theological_decisions:
- issue: Upeo wa kifalme wa onyo
  choice: 'Onyo linamtaja Solomoni pamoja na wanawe: “ninyi na wana wenu.”'
  alternative: “Wewe au wanao,” likionyesha wazi kwamba sharti linaweza kutimia kwa Solomoni au kwa ukoo wake.
  rationale: Kiebrania kina kiunganishi “na” na kinawataja “wana,” jambo linalofaa muktadha wa nasaba ya kifalme. Tafsiri kuu huhifadhi muundo huo, huku tanbihi ikieleza namna ya kulielewa onyo hilo kwa kila kizazi cha ukoo wa Solomoni bila kufuta mvutano uliopo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Wana wenu” imetumiwa badala ya “watoto wenu” ili kuhifadhi maana ya wana wa kiume katika muktadha wa nasaba ya kifalme. Sentensi inaendelea hadi mstari unaofuata, kwa hiyo imeachwa na koma.
