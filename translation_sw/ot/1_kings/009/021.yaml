base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/021.yaml
  text: their children who were left after them in the land[a], whom the sons of Israel had not been able to devote to destruction—Solomon conscripted them for forced labor, to this day.
translation:
  language: sw
  text: watoto wao waliobaki baada yao katika nchi, ambao Waisraeli hawakuweza kuwaweka wakfu kwa maangamizi[a]—Sulemani aliwatumikisha kwa kazi ya kulazimishwa hadi leo hii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kutafsiriwa “kuwaweka wakfu kwa maangamizi”; pia “kuwaweka chini ya marufuku” au “kuwaangamiza kabisa.” Kitenzi hiki hurejelea kuwaweka watu au vitu chini ya חרם (heremu), yaani wakfu usioweza kubatilishwa kwa ajili ya hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵיהֶם
  choice: watoto wao
  rationale: Wingi wa בֵּן unaweza kumaanisha wana au watoto/wazao kwa upana. “Watoto wao” ni ya kawaida katika Kiswahili na haifanyi rejeo lihusu wanaume pekee.
- source_word: נֹתְרוּ אַחֲרֵיהֶם
  choice: waliobaki baada yao
  rationale: Inadumisha maana ya kizazi kilichosalia baada ya watu waliotangulia na kufuata kwa karibu uhusiano wa wakati katika Kiebrania.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: Katika muktadha huu אֶרֶץ inarejelea nchi yenyewe, yaani eneo la Kanaani/Israeli, si taifa kwa maana ya kisiasa ya kisasa.
- source_word: לֹא יָכְלוּ ... לְהַחֲרִימָם
  choice: hawakuwa wameweza kuwaweka wakfu waangamizwe
  rationale: 'Kauli hii inadumisha pande zote mbili za חרם: kuwekwa wakfu bila kubatilishwa na kuangamizwa chini ya hukumu. “Kuwaangamiza kabisa” pekee ingefuta maana ya kuwekwa wakfu.'
- source_word: וַיַּעֲלֵם
  choice: aliwaandikisha
  rationale: Hiphil ya עלה pamoja na לְמַס inaonyesha tendo la kiutawala la kuwateua au kuwaingiza katika kundi la watu waliotozwa kazi; “aliwaandikisha” ni ya kawaida na inaeleweka.
- source_word: לְמַס עֹבֵד
  choice: kufanya kazi ya kulazimishwa
  rationale: מַס עֹבֵד humaanisha tozo ya utumishi au kazi ya lazima. Tafsiri hii ni wazi bila kudai kwa lazima hadhi maalumu ya kisheria ya utumwa.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hadi leo hii
  rationale: Ni namna ya kawaida na ya moja kwa moja ya kuwasilisha fomula hii ya wakati.
theological_decisions:
- issue: Maana ya החרים katika muktadha wa ushindi na hukumu
  choice: kuwaweka wakfu waangamizwe
  alternative: kuwaangamiza kabisa; kuwaweka chini ya marufuku
  rationale: Tafsiri iliyochaguliwa inahifadhi mvutano uliomo katika neno la Kiebrania kati ya kuwekwa wakfu kwa Mungu na kuangamizwa chini ya hukumu, bila kulifanya tendo hilo kuwa mauaji ya kijeshi tu au kutumia istilahi isiyoeleweka kwa urahisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefuata sentensi ya Kiebrania kwa ukaribu, lakini umetumia “Waisraeli” badala ya “wana wa Israeli” kwa ufasaha wa kawaida. Alama ya tanbihi imewekwa baada ya kirai kinachotafsiri החרים, ambako maelezo yake yanahusika moja kwa moja.
