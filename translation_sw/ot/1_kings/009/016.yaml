  to: Farao, mfalme wa Misri, alikuwa amekwenda kuishambulia Gezeri, akauteka na akauchoma kwa moto. Aliwaua Wakanaani waliokuwa wakiishi mjini humo, kisha akampa binti yake, mke wa Sulemani, mji huo kuwa zawadi ya ndoa.[a]
