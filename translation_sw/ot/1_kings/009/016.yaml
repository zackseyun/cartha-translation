base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/016.yaml
  text: Pharaoh king of Egypt had gone up and captured Gezer and burned it with fire[a], and he killed the Canaanites who lived in the city, and gave it as a dowry to his daughter, Solomon’s wife.
translation:
  language: sw
  text: Farao, mfalme wa Misri, alikuwa amekwenda kuishambulia Gezeri, akauteka na akauchoma kwa moto. Aliwaua Wakanaani waliokuwa wakiishi mjini humo, kisha akampa binti yake, mke wa Sulemani, mji huo kuwa zawadi ya ndoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zawadi ya kumuaga.” Neno la Kiebrania linamaanisha zawadi inayohusiana na kuondoka kwa binti wakati wa ndoa; maana yake mahsusi ya kijamii haijulikani kwa hakika, na wakati mwingine hutafsiriwa “mahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: alikuwa amepanda
  rationale: Kitenzi hiki huhifadhi taswira ya Kiebrania ya kupanda kuelekea eneo hilo katika safari ya kijeshi; wakati uliotangulia unaonyesha kwamba tukio hili linaeleza historia ya Gezeri kabla ya shughuli zinazotajwa katika muktadha.
- source_word: וַיִּלְכֹּד
  choice: kuuteka
  rationale: Katika muktadha wa vita, לכד humaanisha kuuteka mji; kiambishi cha ngeli kinaelekeza kwa mji wa Gezeri.
- source_word: וַיִּשְׂרְפָהּ בָּאֵשׁ
  choice: akauteketeza kwa moto
  rationale: Neno ‘kuteketeza’ linaonyesha kuharibiwa kwa mji kwa kuuchoma, na ‘kwa moto’ linahifadhi kirai cha wazi cha Kiebrania.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Ingawa umbo la Kiebrania ni la umoja, limetumiwa kwa maana ya pamoja kuhusu wakazi Wakanaani wa mji.
- source_word: הַיֹּשֵׁב בָּעִיר
  choice: waliokuwa wakiishi mjini humo
  rationale: Hii ni tafsiri ya kawaida ya kirai cha kisifa kinachowatambulisha Wakanaani kuwa wakazi wa mji huo.
- source_word: הָרָג
  choice: kuwaua
  rationale: Ni tafsiri ya moja kwa moja na isiyoongeza maelezo kwa kitenzi הרג.
- source_word: וַיִּתְּנָהּ
  choice: akampa ... mji huo
  rationale: Kiwakilishi cha kike katika Kiebrania kinarejelea Gezeri; kurudia ‘mji huo’ huweka rejeo wazi na la kawaida katika Kiswahili.
- source_word: שִׁלֻּחִים
  choice: kuwa zawadi ya ndoa
  rationale: Neno hili hapa linataja zawadi inayohusiana na ndoa. ‘Zawadi ya ndoa’ ni wazi bila kulazimisha maana maalumu ya ‘mahari,’ ambayo katika matumizi ya kawaida ya Kiswahili mara nyingi hutoka kwa bwana harusi kwenda kwa familia ya bibi harusi.
- source_word: לְבִתּוֹ אֵשֶׁת שְׁלֹמֹה
  choice: binti yake, mke wa Sulemani
  rationale: Kirai hiki kinamtambulisha binti wa Farao kuwa mke wa Sulemani na kuhifadhi uhusiano huo kwa mpangilio wa kawaida wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Gezeri’ limetanguliwa na ‘mji wa’ ili viambishi vya ngeli na rejeo la kiwakilishi viwe wazi. Alama ya tanbihi imewekwa baada ya kirai kinachoeleza שִׁלֻּחִים.
