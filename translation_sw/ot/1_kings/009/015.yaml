- from: Hii ndiyo habari ya kazi ya lazima[a] ambayo Mfalme Sulemani aliitisha ili kujenga nyumba ya Yahwe, nyumba yake mwenyewe, Milo[b], ukuta wa Yerusalemu, Hasori, Megido na Gezeri.
  to: Hii ndiyo taarifa kuhusu kazi ya kulazimishwa[a] ambayo Mfalme Sulemani aliyoamuru ili kujenga nyumba ya Yahwe, nyumba yake mwenyewe, Milo[b], ukuta wa Yerusalemu, Hasori, Megido na Gezeri.
  rationale: Revision clarifies that the levy was compulsory labor, not simply necessary work, and makes the explanatory opening and royal action more direct in natural Standard East African Swahili. It retains the source’s ambiguity about the precise nature of Milo and preserves both footnote anchors at their relevant terms.
