review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that Solomon imposed compulsory labor for the listed building works, retains the purpose clause, and preserves the Hebrew place-name sequence. However, "kazi ya lazima" can readily mean work that is necessary rather than labor compelled by the state; "kazi ya kulazimishwa" is more precise for מַס in this context.
  naturalness: The sentence is generally clear and idiomatic. Replacing "habari ya" with "taarifa kuhusu" improves the relation between the explanatory formula and the labor levy, while "iliyoamuru" states the royal imposition naturally and directly.
  terminology: '"Yahwe," "nyumba," "Milo," "ukuta wa Yerusalemu," and the established Swahili forms Hasori, Megido, and Gezeri are appropriate. The footnote’s proposed alternative "kazi ya shokoa" is not suitably transparent for contemporary Standard East African Swahili and should be replaced with an explanatory note about compulsory state labor.'
  issues:
  - severity: medium
    issue: '"kazi ya lazima" is semantically ambiguous.'
    rationale: It may denote necessary work, not necessarily work imposed compulsorily. The Hebrew מַס here denotes a labor levy/corvée rather than merely work that had to be done.
  - severity: low
    issue: Footnote a uses the opaque expression "kazi ya shokoa."
    rationale: This is not clear contemporary standard usage for many readers and does not serve well as a lexical alternative. A concise explanation of compulsory state labor is clearer.
  - severity: low
    issue: '"habari ya" and "aliitisha" are somewhat less exact than needed.'
    rationale: '"Taarifa kuhusu" better introduces the explanatory statement, and "aliyoamuru" directly expresses the king’s imposition of the labor levy.'
  revised_text: Hii ndiyo taarifa kuhusu kazi ya kulazimishwa[a] ambayo Mfalme Sulemani aliyoamuru ili kujenga nyumba ya Yahwe, nyumba yake mwenyewe, Milo[b], ukuta wa Yerusalemu, Hasori, Megido na Gezeri.
  revised_footnotes:
