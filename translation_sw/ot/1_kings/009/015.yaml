  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/זֶ֨ה דְבַר הַ/מַּ֜ס אֲשֶֽׁר הֶעֱלָ֣ה הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה לִ/בְנוֹת֩ אֶת בֵּ֨ית יְהוָ֤ה וְ/אֶת בֵּית/וֹ֙ וְ/אֶת הַ/מִּלּ֔וֹא וְ/אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/אֶת חָצֹ֥ר וְ/אֶת מְגִדּ֖וֹ וְ/אֶת גָּֽזֶר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/015.yaml
  text: This is the account of the forced labor that King Solomon levied to build the house of Yahweh[a], his own house, the Millo, the wall of Jerusalem, Hazor, Megiddo[b], and Gezer.
translation:
  language: sw
  text: Hii ndiyo taarifa kuhusu kazi ya kulazimishwa[a] ambayo Mfalme Sulemani aliyoamuru ili kujenga nyumba ya Yahwe, nyumba yake mwenyewe, Milo[b], ukuta wa Yerusalemu, Hasori, Megido na Gezeri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kazi ya serikali ambayo watu walilazimishwa kufanya, badala ya kodi ya fedha.
    reason: lexical_alternative
  - marker: b
    text: Huenda “Milo” lilikuwa jina la ngome au eneo la matuta/ujazo huko Yerusalemu; neno la Kiebrania linaweza kumaanisha “ujazo.”
    reason: cultural_note
lexical_decisions:
- source_word: דְבַר
  choice: habari
  rationale: Katika kirai hiki neno hilo linatanguliza maelezo kuhusu kazi ya lazima. “Habari” ni Kiswahili cha kawaida na chenye hadhi, bila kulifanya neno hilo kuwa kumbukumbu rasmi zaidi ya inavyodai Kiebrania.
- source_word: הַמַּס
  choice: kazi ya lazima
  rationale: Katika muktadha wa miradi ya ujenzi ya kifalme, neno hili linamaanisha kazi ya watu iliyoamriwa na serikali, si kodi ya fedha.
- source_word: הֶעֱלָה
  choice: aliitisha
  rationale: Hifili ya עלה hapa ina maana ya kuweka au kuitisha sharti la kazi. “Aliitisha” linaonyesha hatua ya kifalme ya kuwakusanya watu kwa kazi bila kuongeza wazo la kodi ya fedha.
- source_word: לִבְנוֹת
  choice: ili kujenga
  rationale: Kitenzi-jina cha Kiebrania kinaonyesha kusudi la kuitishwa kwa kazi hiyo.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi taswira ya moja kwa moja ya Kiebrania, na “Yahwe” huwakilisha jina la agano יהוה badala ya kulibadilisha kuwa cheo.
- source_word: בֵּיתוֹ
  choice: nyumba yake mwenyewe
  rationale: Kauli hii huhifadhi tofauti kati ya nyumba ya Yahwe na nyumba ya Sulemani; katika muktadha nyumba ya Sulemani ni jumba lake la kifalme.
- source_word: הַמִּלּוֹא
  choice: Milo
  rationale: Hili ni jina au istilahi maalumu ya sehemu ya ujenzi huko Yerusalemu. Kulitohoa huepuka kudai kwa uhakika kwamba lilikuwa tuta, ujazo, au matuta.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: ukuta wa Yerusalemu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha Kiebrania.
- source_word: חָצֹר / מְגִדּוֹ / גָּזֶר
  choice: Hasori / Megido / Gezeri
  rationale: Majina haya yametoholewa kwa tahajia na matamshi yanayofaa Kiswahili cha Afrika Mashariki.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina יהוה. “Yahwe” hulihifadhi kama jina binafsi la Mungu bila kulibadilisha kuwa cheo, huku “Yehova” likiwa umbo la kimapokeo lililotokana na mchanganyiko wa konsonanti na irabu za usomaji.
- issue: Maana ya בֵּית יְהוָה
  choice: nyumba ya Yahwe
  alternative: hekalu la Yahwe
  rationale: “Nyumba” hufuata neno la Kiebrania kwa karibu na kuhifadhi maana zake za kifasihi na kiteolojia; “hekalu” ni ufafanuzi sahihi wa kimuktadha lakini ni mahususi zaidi kuliko neno la chanzo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wazi na wenye hadhi. Sentensi imehifadhi orodha na uhusiano wa kusudi wa Kiebrania. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja: [a] baada ya “kazi ya lazima” na [b] baada ya “Milo.”'
