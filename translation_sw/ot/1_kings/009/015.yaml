    reason: lexical_alternative
  - marker: b
    text: Huenda “Milo” lilikuwa jina la ngome au eneo la matuta/ujazo huko Yerusalemu; neno la Kiebrania linaweza kumaanisha “ujazo.”
    reason: cultural_note
  revision_rationale: Revision clarifies that the levy was compulsory labor, not simply necessary work, and makes the explanatory opening and royal action more direct in natural Standard East African Swahili. It retains the source’s ambiguity about the precise nature of Milo and preserves both footnote anchors at their relevant terms.
