  terminology: “Yahwe,” “sala,” “dua,” “nyumba hii,” na “jina langu” zinafaa. “Nimeiweka wakfu” ni istilahi ya Kiswahili iliyo wazi zaidi kwa kuwekwa rasmi kwa matumizi matakatifu kuliko “Nimeitakasa,” ambayo inaweza kudokeza usafishaji.
