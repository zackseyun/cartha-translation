  source_fidelity: 'Tafsiri inafuata kwa uaminifu maana na mpangilio wa Kiebrania: sala na dua, kutakasa/kuweka wakfu nyumba, kuweka jina humo milele, na taswira ya macho na moyo vimedumishwa. Hata hivyo, kitenzi cha pili cha ombi kinaweza kuonyesha wazi zaidi kusihi kwa unyenyekevu, na upatanisho wa kisarufi wa sentensi ya mwisho unahitaji kurekebishwa.'
