base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/003.yaml
  text: And Yahweh said to him[a], “I have heard your prayer and your plea for favor that you made before me. I have consecrated this house that you built, to put my name there forever[c][b], and my eyes and my heart will be there all the days.”
translation:
  language: sw
  text: Yahwe akamwambia, “Nimesikia sala yako na dua yako[a] uliyonisihi mbele zangu. Nimeiweka wakfu nyumba hii[b] uliyoijenga, ili kuliweka jina langu humo milele. Macho yangu na moyo wangu yatakuwa humo siku zote.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kusihi kwako”; neno la Kiebrania linamaanisha ombi la unyenyekevu la kutaka fadhili.
    reason: lexical_alternative
  - marker: b
    text: Yaani, hekalu alilojenga Solomoni; Kiebrania kinasema “nyumba hii.”
    reason: cultural_note
  - marker: c
    text: Usemi “macho yangu na moyo wangu” ni lugha ya kibinadamu inayoonyesha uangalizi na kujali kwa Yahwe daima.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la Mungu lililo katika Kiebrania badala ya kulibadili kuwa cheo; umbo hili linafaa matamshi na tahajia ya Kiswahili.
- source_word: תְּפִלָּתְךָ
  choice: sala yako
  rationale: Ni Kiswahili cha kawaida na chenye heshima kwa תפלה katika muktadha wa ombi linaloelekezwa kwa Mungu.
- source_word: תְּחִנָּתְךָ
  choice: dua yako
  rationale: Linatofautisha תחנה na תפלה na kuonyesha ombi la unyenyekevu la kutaka fadhili, bila kurudia tu neno ‘sala.’
- source_word: לְפָנַי
  choice: mbele zangu
  rationale: Linahifadhi nahau ya Kiebrania kwa lugha ya asili na inayoeleweka katika Kiswahili.
- source_word: הִקְדַּשְׁתִּי
  choice: Nimeitakasa
  rationale: Linaonyesha kuiweka nyumba kando kuwa takatifu kwa matumizi ya Mungu na linadumisha nguvu ya kidini ya kitenzi.
- source_word: הַבַּיִת הַזֶּה
  choice: nyumba hii
  rationale: Kiebrania kinasema ‘nyumba’; neno hili linatunza taswira ya hekalu kuwa nyumba ya jina la Yahwe.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: ili kuliweka jina langu humo
  rationale: Linahifadhi nahau ya agano inayohusu kuliweka jina la Mungu mahali hapo bila kuipanua kuwa kauli kwamba Mungu mwenyewe amefungiwa mahali hapo.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya usemi wa Kiebrania wa kudumu.
- source_word: עֵינַי וְלִבִּי
  choice: Macho yangu na moyo wangu
  rationale: Inahifadhi taswira halisi ya kibinadamu inayotumiwa kueleza uangalizi na kujali kwa Mungu.
- source_word: כָּל הַיָּמִים
  choice: siku zote
  rationale: Ni nahau ya Kiswahili inayohifadhi umbo thabiti la Kiebrania badala ya kulifanya kuwa kielezi kisicho na taswira.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu Mungu katika ‘macho yangu na moyo wangu’
  choice: Kudumisha taswira hiyo moja kwa moja
  alternative: Kufafanua kuwa ‘uangalizi wangu na kujali kwangu kutakuwa humo’
  rationale: Kiebrania kinatumia kwa makusudi lugha ya mwili kueleza uangalizi na kujali kwa Yahwe; kuiacha wazi kunatunza uzito na mvutano wa kiteolojia wa maandishi.
- issue: Maana ya ‘kuliweka jina langu humo milele’
  choice: Kudumisha nahau ya jina la Mungu katika hekalu
  alternative: Kutafsiri ‘kukaa humo milele’ au ‘kuabudiwa humo milele’
  rationale: Andiko linasema kwamba Yahwe anaweka jina lake humo. Tafsiri haipaswi kubadili nahau hiyo kuwa ufafanuzi mpana wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni wa kawaida kwa wasomaji wengi, huku nahau kuu za Kiebrania—‘nyumba hii,’ ‘kuliweka jina langu humo,’ na ‘macho yangu na moyo wangu’—zikihifadhiwa.
