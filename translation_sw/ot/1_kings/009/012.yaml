  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Nahau ya Kiebrania imetolewa kwa Kiswahili cha kawaida katika matini, na maana yake halisi imehifadhiwa katika tanbihi.
