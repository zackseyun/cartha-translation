base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/012.yaml
  text: So Hiram went out from Tyre to see the cities that Solomon had given him[a], but they were not pleasing in his eyes.
translation:
  language: sw
  text: Basi Hiramu akatoka Tiro kwenda kuiona miji ambayo Sulemani alikuwa amempa, lakini haikumpendeza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “haikuwa sawa machoni pake,” yaani, haikumpendeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi יצא katika simulizi kinaonyesha kutoka au kuondoka; “akatoka” huhifadhi maana ya mwelekeo bila kuongeza sababu ya safari.
- source_word: מִצֹּר
  choice: Tiro
  rationale: Kihusishi מן huonyesha mahali pa kuanzia. Katika Kiswahili, “akatoka Tiro” ni usemi wa kawaida na sahihi.
- source_word: לִרְאוֹת
  choice: kwenda kuyaona
  rationale: ראה kimsingi ni “kuona.” “Kwenda kuyaona” ni Kiswahili cha kawaida kinachoonyesha kusudi la kutoka bila kuongeza wazo mahsusi la ukaguzi.
- source_word: הֶעָרִים
  choice: miji
  rationale: עיר inaweza kumaanisha mji mkubwa au mdogo; “miji” ndiyo tafsiri pana na ya kawaida katika muktadha huu.
- source_word: אֲשֶׁר נָתַן לוֹ שְׁלֹמֹה
  choice: ambayo Sulemani alikuwa amempa
  rationale: Muundo huu unabainisha miji, na “alikuwa amempa” huonyesha kwa kawaida kwamba utoaji ulitangulia safari ya Hiramu.
- source_word: וְלֹא יָשְׁרוּ בְּעֵינָיו
  choice: lakini haikumpendeza
  rationale: Nahau ישר בעיני hapa inaonyesha kwamba miji haikukubalika au haikumpendeza Hiramu. Tafsiri hii ni ya asili katika Kiswahili, huku tanbihi ikihifadhi picha halisi ya Kiebrania.
