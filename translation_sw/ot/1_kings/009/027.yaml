  text: Hiramu akawatuma watumishi wake, watu wa meli walioijua bahari, katika ile meli pamoja na watumishi wa Solomoni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֳנִי
  choice: katika ile meli
  rationale: Kihusishi בְּ hapa kinaonyesha watumishi walitumwa wakiwa ndani ya meli; nomino ni umoja na ina kiambishi cha ujuzi.
- source_word: אַנְשֵׁי אֳנִיּוֹת
  choice: watu wa melini
  rationale: Kirai hiki kinamaanisha watu wenye uzoefu wa kazi za melini, si tu watu waliokuwamo melini; tafsiri hii ni ya kawaida na inahifadhi taswira ya Kiebrania.
- source_word: יֹדְעֵי הַיָּם
  choice: walioijua bahari
  rationale: Huhifadhi kitenzi 'kujua' na maana ya kuwa na ujuzi au uzoefu wa bahari bila kuibana kuwa taaluma fulani.
- source_word: עִם עַבְדֵי שְׁלֹמֹה
  choice: pamoja na watumishi wa Solomoni
  rationale: Huwasilisha moja kwa moja ushirika wao na watumishi wa Solomoni katika safari hiyo.
