  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ יִהְיֶ֣ה עֶלְי֔וֹן כָּל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֣ם וְ/שָׁרָ֑ק וְ/אָמְר֗וּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/008.yaml
  text: And this house will become a ruin[a]. Everyone who passes by it will be appalled and will whistle, and they will say[b], ‘Why has Yahweh done thus to this land and to this house?’
translation:
  language: sw
  text: Na nyumba hii itakuwa magofu[a]. Kila mtu atakayepita karibu nayo atashangaa kwa hofu na kupiga mluzi[b], na kusema, “Kwa nini Yahwe ameitendea nchi hii na nyumba hii hivi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nyumba hii itakuwa juu/iliyoinuliwa.” Katika muktadha, wengi huelewa maana kuwa itakuwa magofu au kitu cha kutisha; linganisha 2 Mambo ya Nyakati 7:21.'
    reason: textual_variant
  - marker: b
    text: Au “kuzomea.” Kitenzi cha Kiebrania kinamaanisha kutoa sauti kali kwa mshangao au dhihaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: Na nyumba hii
  rationale: Neno בַּיִת kwa msingi ni ‘nyumba’; hapa linamaanisha hekalu, lakini ‘nyumba’ linahifadhi marudio na taswira ya Kiebrania huku muktadha ukibainisha kinachorejelewa.
- source_word: יִהְיֶה עֶלְיוֹן
  choice: itakuwa magofu
  rationale: Maandishi ya Kimasora kwa uso wake yanasema ‘itakuwa juu/iliyoinuliwa,’ lakini katika muktadha wa hukumu maana hiyo ni ngumu. Sambamba ya 2 Mambo ya Nyakati 7:21 na muktadha zinaunga mkono hali ya kuharibiwa; utata wa maandishi umehifadhiwa katika tanbihi.
- source_word: כָּל עֹבֵר עָלָיו
  choice: Kila mtu atakayepita karibu nayo
  rationale: Hii ni nahau ya wapita-njia. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi maana ya kila mmoja.
- source_word: יִשֹּׁם
  choice: atashtuka
  rationale: Kitenzi kinaonyesha mshtuko mkubwa unaotokana na kuona uharibifu. ‘Atashtuka’ ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: וְשָׁרָק
  choice: na kupiga mluzi
  rationale: Kitenzi kinamaanisha kutoa sauti kali kama mluzi kwa mshangao au dhihaka. Tanbihi inaeleza uwezekano wa sauti ya kuzomea.
- source_word: וְאָמְרוּ
  choice: nao watasema
  rationale: Wingi wenye mtendaji asiyeainishwa umetafsiriwa kwa njia ya kawaida inayowaunganisha na wapita-njia waliotajwa.
- source_word: עַל מֶה
  choice: Kwa nini
  rationale: Kirai kinauliza sababu ya hukumu; ‘Kwa nini’ ndilo sawia la moja kwa moja na la kawaida.
- source_word: עָשָׂה ... כָּכָה
  choice: ameifanyia hivi
  rationale: Muundo huu unauliza kwa nini Yahwe ametenda kwa namna inayoonekana katika hali ya nchi na nyumba. Kauli ya wakati timilifu inafaa kwa matokeo yanayoonekana.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo; umbo ‘Yahwe’ linafuata tahajia ya kawaida ya Kiswahili.
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: nchi hii na nyumba hii
  rationale: אֶרֶץ hapa ni nchi, si dunia kwa ujumla; ‘nyumba’ huhifadhi neno la Kiebrania na marudio yake.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja. Kulitafsiri ‘Yahwe’ huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Maana ya עֶלְיוֹן katika muktadha wa hukumu
  choice: itakuwa magofu
  alternative: itakuwa juu/iliyoinuliwa
  rationale: Usomaji wa moja kwa moja wa Kimasora una mvutano na muktadha wa maangamizi. Tafsiri kuu inatoa maana inayoeleweka kutokana na muktadha na sambamba ya 2 Mambo ya Nyakati 7:21, huku tanbihi ikihifadhi wazi usomaji halisi na tatizo lake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Nyumba’ limehifadhiwa badala ya ‘hekalu’ ili kudumisha taswira na marudio ya Kiebrania. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya maneno yanayohusika.
