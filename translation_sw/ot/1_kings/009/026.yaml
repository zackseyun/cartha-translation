  text: וָ/אֳנִ֡י עָשָׂה֩ הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה בְּ/עֶצְיֽוֹן גֶּ֨בֶר אֲשֶׁ֧ר אֶת אֵל֛וֹת עַל שְׂפַ֥ת יַם ס֖וּף בְּ/אֶ֥רֶץ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/026.yaml
  text: King Solomon also built a fleet of ships at Ezion-geber[a], which is beside Eloth on the shore of the Red Sea, in the land of Edom.
translation:
  language: sw
  text: Mfalme Sulemani pia alijenga kundi la meli huko Esion-geberi, karibu na Elothi, kwenye ufuo wa Bahari ya Shamu[a], katika nchi ya Edomu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Bahari ya Matete”; kwa kawaida hutafsiriwa “Bahari ya Shamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֳנִי
  choice: pia ... kundi la meli
  rationale: Nomino אֳנִי inaweza kumaanisha chombo au mkusanyiko wa meli. Katika muktadha huu wa shughuli za baharini, “kundi la meli” linaeleza maana ya pamoja kwa Kiswahili cha kawaida; וָ־ imewakilishwa kwa “pia” ili kuunganisha sentensi na simulizi lililotangulia.
- source_word: עָשָׂה
  choice: alijenga
  rationale: Ingawa kitenzi hiki kwa msingi humaanisha “alifanya/alitengeneza,” kinapotumiwa kuhusu meli humaanisha kuzijenga.
- source_word: בְּעֶצְיוֹן גֶּבֶר
  choice: huko Esion-geberi
  rationale: Kiambishi בְּ hapa kinaonyesha mahali. “Huko” ni cha asili katika Kiswahili kwa bandari au eneo maalumu, na jina la mahali limetoholewa kwa tahajia inayosomeka kwa Waswahili.
- source_word: אֲשֶׁר אֶת אֵלוֹת
  choice: karibu na Elothi
  rationale: Muundo huu unaonyesha ukaribu wa kijiografia. “Karibu na” ni wa asili na huepuka kudai kwa nguvu zaidi kwamba maeneo hayo yalipakana moja kwa moja.
- source_word: עַל שְׂפַת יַם סוּף
  choice: kwenye ufuo wa Bahari ya Shamu[a]
  rationale: שְׂפַת ni ukingo au ufuo. “Bahari ya Shamu” ni jina la jadi na linalotambulika katika Kiswahili kwa eneo hili, huku maana ya karibu zaidi ya Kiebrania ikihifadhiwa katika tanbihi.
- source_word: בְּאֶרֶץ אֱדֹום
  choice: katika nchi ya Edomu
  rationale: Tafsiri hii inadumisha neno “nchi” na msisitizo wa kijiografia wa maandishi ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina ya mahali yametoholewa kuwa Esion-geberi, Elothi, na Edomu. Tanbihi imewekwa baada ya “Bahari ya Shamu,” neno ambalo tanbihi inalifafanua.
