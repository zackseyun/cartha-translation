  text: And Hiram sent to the king one hundred and twenty talents of gold[a][b].
translation:
  language: sw
  text: Hiramu akamtumia mfalme talanta mia moja na ishirini za dhahabu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talanta ilikuwa kipimo kikubwa cha uzito; maneno haya yanamaanisha kiasi cha dhahabu chenye uzito wa talanta mia moja na ishirini.
    reason: cultural_note
  - marker: b
    text: Au, “kwa Mfalme Sulemani”; Kiebrania kinasema tu “kwa mfalme.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akamtumia
  rationale: Muundo wa simulizi unaendeleza tukio kwa wakati uliopita; “akamtumia” ni Kiswahili cha kawaida kinachoonyesha kwamba Hiramu alituma kitu kwa mfalme.
- source_word: חִירָם
  choice: Hiramu
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili, na linaakisi jina la Kiebrania.
- source_word: לַמֶּלֶךְ
  choice: mfalme
  rationale: Kiebrania kinasema kihalisi “kwa mfalme”; kiambishi cha mtendewa katika “akamtumia” kinawasilisha uhusiano huo kwa Kiswahili cha asili bila kuongeza jina la Sulemani.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: mia moja na ishirini
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya idadi hiyo katika Kiswahili sanifu.
- source_word: כִּכַּר
  choice: talanta
  rationale: “Talanta” ni istilahi iliyozoeleka katika Biblia ya Kiswahili kwa kipimo hiki kikubwa cha uzito cha kale; umbo lake halibadiliki baada ya idadi.
- source_word: זָהָב
  choice: dhahabu
  rationale: Neno hilo humaanisha dhahabu, na hapa linafafanua kitu kilichopimwa kwa talanta.
