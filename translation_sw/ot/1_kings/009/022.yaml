  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מִ/בְּנֵי֙ יִשְׂרָאֵ֔ל לֹֽא נָתַ֥ן שְׁלֹמֹ֖ה עָ֑בֶד כִּי הֵ֞ם אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/עֲבָדָי/ו֙ וְ/שָׂרָ֣י/ו וְ/שָׁלִשָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/022.yaml
  text: But from the sons of Israel Solomon made no servants[a], for they were the men of war, his servants, his commanders, his officers, and the commanders of his chariots and his horsemen.
translation:
  language: sw
  text: Lakini miongoni mwa wana wa Israeli, Sulemani hakumweka yeyote kuwa mtumwa, kwa maana wao walikuwa wanaume wa vita, watumishi wake, makamanda wake, maofisa wake[a], na makamanda wa magari yake ya vita na wapanda farasi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wasaidizi wake wa kijeshi.” Neno la Kiebrania huenda lilitaja kundi maalumu la maafisa wa juu wa kijeshi au maafisa wa magari ya vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשְׂרָאֵל
  choice: Lakini miongoni mwa wana wa Israeli
  rationale: Kiunganishi na kihusishi vinaonyesha utofautishaji na watu wasio Waisraeli waliotajwa katika mstari uliotangulia; ‘wana wa Israeli’ huhifadhi namna ya usemi wa Kiebrania.
- source_word: לֹא נָתַן ... עָבֶד
  choice: Sulemani hakumweka yeyote kuwa mtumwa
  rationale: Usemi huu unaonyesha kwamba Sulemani hakumpa Mwisraeli hadhi ya utumwa. ‘Hakumweka yeyote’ huwasilisha kwa Kiswahili cha kawaida nomino ya umoja yenye maana ya kijumla.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: wanaume wa vita
  rationale: Huhifadhi wazi umbo la kiume la Kiebrania na maana ya watu waliokuwa na jukumu la kijeshi, bila kulifanya kuwa lisilo na jinsia.
- source_word: וַעֲבָדָיו
  choice: watumishi wake
  rationale: Katika orodha ya watu wa kifalme, neno hili pana linaweza kumaanisha watumishi au maafisa wa mfalme; ‘watumishi’ huhifadhi upana wake na kulitofautisha na utumwa uliotajwa awali kwa muktadha.
- source_word: וְשָׂרָיו
  choice: makamanda wake
  rationale: Katika muktadha huu wa kijeshi na kiutawala, שׂר linafaa kueleweka kama viongozi au makamanda.
- source_word: וְשָׁלִשָׁיו
  choice: maofisa wake
  rationale: Rejeleo kamili la cheo hiki cha kale halina uhakika; ‘maofisa’ ni tafsiri wazi isiyodai umahususi usiothibitishwa.
- source_word: וְשָׂרֵי רִכְבּוֹ
  choice: makamanda wa magari yake ya vita
  rationale: Huwasilisha viongozi wa kikosi cha magari ya vita kwa Kiswahili cha kawaida na sahihi.
- source_word: וּפָרָשָׁיו
  choice: wapanda farasi wake
  rationale: Ni tafsiri ya moja kwa moja ya wanajeshi waliopanda farasi, bila kutumia istilahi yenye ladha ya kijeshi ya baadaye.
theological_decisions:
- issue: Hadhi ya kijamii inayodokezwa na עָבֶד
  choice: hakumweka yeyote kuwa mtumwa
  alternative: hakumweka yeyote kuwa mtumishi
  rationale: Muktadha wa kazi ya kulazimishwa kwa watu wasio Waisraeli unahitaji kutoficha hadhi ya utumwa; ‘mtumishi’ ingekuwa dhaifu mno hapa.
- issue: Usemi wa kiume katika אַנְשֵׁי הַמִּלְחָמָה
  choice: wanaume wa vita
  alternative: wapiganaji
  rationale: Tafsiri iliyochaguliwa huhifadhi jinsia iliyotajwa na chanzo katika maelezo ya majukumu ya kijeshi ya Israeli ya kale.
- issue: Maana ya וַעֲבָדָיו ndani ya orodha ya maafisa wa mfalme
  choice: watumishi wake
  alternative: watumwa wake
  rationale: Ingawa ni neno lilelile la msingi kama עָבֶד, hapa kiambishi cha umilikaji na orodha ya vyeo vya kifalme vinaunga mkono maana ya watumishi wa mfalme; kutafsiri ‘watumwa wake’ kungefunga bila sababu utata wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha na utofautishaji wa mstari uliotangulia umehifadhiwa; istilahi ya cheo kisicho na uhakika imefafanuliwa katika tanbihi.
