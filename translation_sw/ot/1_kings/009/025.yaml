  text: וְ/הֶעֱלָ֣ה שְׁלֹמֹ֡ה שָׁלֹשׁ֩ פְּעָמִ֨ים בַּ/שָּׁנָ֜ה עֹל֣וֹת וּ/שְׁלָמִ֗ים עַל הַ/מִּזְבֵּ֨חַ֙ אֲשֶׁ֣ר בָּנָ֣ה לַ/יהוָ֔ה וְ/הַקְטֵ֣יר אִתּ֔/וֹ אֲשֶׁ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שִׁלַּ֖ם אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/025.yaml
  text: And Solomon offered up burnt offerings and peace offerings on the altar that he had built for Yahweh three times a year[a], and he burned incense with it before Yahweh[b]. Thus he completed the house.
translation:
  language: sw
  text: Sulemani alitoa sadaka za kuteketezwa na sadaka za amani juu ya madhabahu aliyokuwa amemjengea Yahwe mara tatu kwa mwaka. Akafukiza uvumba pamoja nayo mbele ya Yahwe.[a] Hivyo akaikamilisha nyumba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akafanya sadaka zitoe moshi pamoja nayo.” Kitenzi cha Kiebrania kinaweza kumaanisha kwa upana zaidi kuchoma sadaka ili zitoe moshi, si kufukiza uvumba tu.
    reason: lexical_alternative
  - marker: b
    text: Yaani, hekalu; Kiebrania kinasema “nyumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: alitoa
  rationale: Katika muktadha wa dhabihu, umbo la Hiphil la עלה humaanisha kutoa dhabihu. Kiswahili cha kawaida hutumia ‘kutoa’ pamoja na aina ya sadaka inayofuata.
- source_word: עֹלוֹת
  choice: sadaka za kuteketezwa
  rationale: Ni neno la ibada linalotaja dhabihu zilizoteketezwa juu ya madhabahu; tafsiri hii ni ya kawaida na inaeleweka katika Kiswahili cha Biblia.
- source_word: שְׁלָמִים
  choice: sadaka za amani
  rationale: Neno hili hutaja dhabihu za ushirika, ustawi, au amani. ‘Sadaka za amani’ ni tafsiri inayotambulika bila kufunga maana katika wazo moja tu.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: mara tatu kwa mwaka
  rationale: Ni Kiswahili cha kawaida na sahihi kwa usemi huu wa wakati.
- source_word: עַל הַמִּזְבֵּחַ אֲשֶׁר בָּנָה לַיהוָה
  choice: juu ya madhabahu aliyokuwa amemjengea Yahwe
  rationale: Huhifadhi madhabahu kama mahali pa dhabihu na huonyesha kwamba ujenzi wake ulitangulia matendo yanayosimuliwa.
- source_word: וְהַקְטֵיר
  choice: akafukiza uvumba
  rationale: Kitenzi kinaweza kumaanisha kufukiza uvumba au, kwa upana zaidi, kufanya dhabihu itoe moshi. Tafsiri kuu inatumia maana inayofaa kwa mazingira ya hekalu, huku tanbihi ikihifadhi maana pana.
- source_word: אִתּוֹ
  choice: juu yake
  rationale: Kiwakilishi kinaelekezwa kwa madhabahu kwa namna ya kawaida katika Kiswahili. Muundo wa Kiebrania ni mgumu, hivyo tafsiri haiongezi mhusika mwingine.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Hutoa kwa ufupi mahali pa tendo la ibada mbele za Yahwe bila kulazimisha uchanganuzi mmoja wa uhusiano wa kishazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa umbo linalotumika kwa kawaida katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וְשִׁלַּם אֶת הַבָּיִת
  choice: Hivyo akaikamilisha nyumba
  rationale: Piel ya שלם inaweza kumaanisha kukamilisha au kumaliza. ‘Nyumba’ huhifadhi neno la Kiebrania, ambalo katika muktadha linarejelea hekalu.
theological_decisions:
- issue: Ikiwa Sulemani mwenyewe alitekeleza matendo ya kikuhani au aliagiza yatekelezwe
  choice: Matendo yanaelezwa kuwa ya Sulemani kwa mtindo wa muhtasari wa kifalme bila kufafanua kama aliyafanya kwa mikono yake mwenyewe.
  alternative: Kusema wazi kwamba Sulemani mwenyewe alifanya ibada hizo, au kwamba makuhani walizifanya kwa agizo lake.
  rationale: Vitenzi vya Kiebrania vinamhusisha Sulemani moja kwa moja, lakini mtindo huo unaweza pia kueleza udhamini au mamlaka ya mfalme. Tafsiri huhifadhi mvutano huo bila kuingiza hitimisho la kimadhehebu.
- issue: Maana mahsusi ya וְהַקְטֵיר
  choice: Maandishi makuu yanasema ‘akafukiza uvumba,’ na tanbihi inahifadhi maana pana ya kufanya sadaka itoe moshi.
  alternative: ‘Akafanya sadaka itoe moshi.’
  rationale: Kitenzi hutumiwa kwa uvumba na pia kwa kuchoma sehemu za dhabihu. Muktadha unaunga mkono uvumba, lakini Kiebrania hakiondoi maana pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. ‘Yahwe,’ ‘madhabahu,’ na majina ya sadaka huhifadhi msamiati wa ibada; tanbihi zinaeleza utata wa Kiebrania bila kulemea maandishi makuu.
