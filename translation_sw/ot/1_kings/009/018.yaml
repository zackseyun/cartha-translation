lexical_decisions:
- source_word: וְ/אֶת
  choice: na
  rationale: Kiambishi וְ kinaunganisha mahali hapa na orodha iliyotangulia; אֵת ni alama ya yambwa mahsusi na kwa kawaida haitafsiriwi katika Kiswahili.
- source_word: בַּעֲלָת
  choice: Baalathi
  rationale: Ni jina la mahali; limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili bila kutafsiri maana ya jina.
- source_word: וְ/אֶת
  choice: na
  rationale: Kama katika tukio la kwanza, וְ limetafsiriwa kwa “na,” huku alama ya yambwa אֵת ikiachwa bila neno maalumu la Kiswahili.
- source_word: תמר
  choice: Tamari
  rationale: Maandishi ya Kiebrania ya kifungu hiki yana תמר (Tamar); umbo la Kiswahili “Tamari” limetumiwa katika matini, huku tofauti ya “Tadmori” katika 2 Mambo ya Nyakati 8:4 ikihifadhiwa katika tanbihi.
- source_word: בַּ/מִּדְבָּר
  choice: jangwani
  rationale: מִדְבָּר humaanisha eneo la nyika au jangwa; “jangwani” ni usemi wa kawaida na wa asili katika Kiswahili kwa maelezo haya ya kijiografia.
- source_word: בָּ/אָֽרֶץ
  choice: katika nchi
  rationale: אֶרֶץ hapa inaelekea kutaja nchi au eneo kwa maana pana. “Katika nchi” huhifadhi ujumla huo bila kubainisha eneo ambalo Kiebrania hakilitaji wazi.
