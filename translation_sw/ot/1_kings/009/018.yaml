translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi, wenye heshima, unaofaa orodha ya majina ya mahali. Kianzio “na” kimehifadhiwa kwa sababu mstari huu unaendeleza orodha kutoka mstari uliotangulia. Alama ya tanbihi imewekwa moja kwa moja baada ya “Tamari,” neno linalohusika na tofauti ya maandishi.
