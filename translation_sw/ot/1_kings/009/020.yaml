base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/020.yaml
  text: All the people who remained of the Amorites[a], the Hittites, the Perizzites, the Hivites, and the Jebusites, who were not of the sons of Israel—
translation:
  language: sw
  text: Watu wote waliobaki wa Waamori, Wahiti, Waperizi, Wahivi na Wayebusi, ambao hawakuwa miongoni mwa wana wa Israeli[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “hawakuwa Waisraeli.” Kiebrania: “hawakuwa miongoni mwa wana wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעָם
  choice: Watu wote
  rationale: Kiswahili hutanguliza nomino kabla ya kiashiria cha ujumla; tafsiri hii inaonyesha maana ya kundi lote.
- source_word: הַנּוֹתָר
  choice: waliobaki
  rationale: Kauli ya uhusiano inaonyesha kwa kawaida hali ya watu walioachwa au waliosalia.
- source_word: מִן הָאֱמֹרִי הַחִתִּי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: wa Waamori, Wahiti, Waperizi, Wahivi na Wayebusi
  rationale: Kiunganishi מִן kinaonyesha watu waliobaki kutoka katika makundi haya; matumizi ya 'wa' ni mafupi na ya kawaida kwa orodha ya mataifa katika Kiswahili.
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: ambao hawakuwa miongoni mwa wana wa Israeli
  rationale: Tafsiri hii inahifadhi neno la Kiebrania 'wana' na kuonyesha kuwa watu hao hawakutokana na kundi la Israeli. Kistari kirefu kinahifadhi sentensi isiyokamilika inayoendelea katika mstari unaofuata.
theological_decisions:
- issue: Usemi wa agano wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Neno 'wana' linaonyesha wazi umbo la Kiebrania bila kuamua kwamba usemi huo unawahusu wanaume pekee; tanbihi inatoa tafsiri ya kawaida zaidi ya kimuktadha.
translation_notes:
  register: Lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa Afrika Mashariki. Majina ya mataifa yanafuata maumbo yaliyozoeleka katika Kiswahili cha Biblia. Kistari kirefu mwisho kinaonyesha kuwa wazo linaendelea katika mstari wa 21.
