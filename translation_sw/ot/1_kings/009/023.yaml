  source_fidelity: Muundo wa Kiebrania unaonyesha “wakuu wa maafisa/waliowekwa” na kisha unawahusisha maafisa hao na kazi ya Sulemani. Rasimu inakaribia maana hiyo, lakini “walioteuliwa kusimamia kazi kwa ajili ya Sulemani” huifanya kazi ya usimamizi ionekane kama sehemu ya uteuzi wenyewe na “kwa ajili ya” ni pana kidogo. “Waliowekwa juu ya kazi ya Sulemani” huhifadhi muundo na uhusiano wa asili kwa ukaribu zaidi.
  naturalness: Kiswahili cha rasimu kinaeleweka, lakini sentensi mbili zenye “Walikuwa” baada ya utambulisho wa “Hawa” zinavunja muundo wa idadi na kitenzi kishiriki katika maandishi ya Kiebrania. Sentensi moja yenye koloni ni ya asili na wazi zaidi.
