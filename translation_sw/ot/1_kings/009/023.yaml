  text: 'These were the chief officers of the deputies who were over the work for Solomon: five hundred and fifty[b][a], ruling over the people who were doing the work.'
translation:
  language: sw
  text: 'Hawa ndio wakuu wa maafisa waliowekwa juu ya kazi ya Sulemani: mia tano na hamsini, waliowatawala[b] watu waliokuwa wakifanya kazi hiyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Au “walisimamia”; kitenzi cha Kiebrania kinaweza kumaanisha kutawala, kuwa na mamlaka, au kusimamia.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: wakuu
  rationale: Neno hili humaanisha viongozi au maafisa wenye cheo; “wakuu” linafaa katika muktadha huu wa usimamizi bila kutoa maana ya kijeshi.
- source_word: הַנִּצָּבִים
  choice: maafisa walioteuliwa
  rationale: Umbo hili la kitenzi נצב linadokeza watu waliowekwa au kuteuliwa rasmi kuwa maafisa. Tafsiri hii inaonyesha hadhi yao ya kiutawala huku tanbihi ikihifadhi uwezekano wa “wasimamizi.”
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  choice: kusimamia kazi
  rationale: Ingawa kirai hicho kihalisi ni “waliokuwa juu ya kazi,” katika Kiswahili cha kawaida “kusimamia kazi” huwasilisha wazi jukumu lao.
- source_word: לִשְׁלֹמֹה
  choice: kwa ajili ya Sulemani
  rationale: Kihusishi ל hapa kinaonyesha kwamba kazi hiyo ilifanywa katika utumishi au kwa manufaa ya Sulemani.
- source_word: חֲמִשִּׁים וַחֲמֵשׁ מֵאוֹת
  choice: mia tano na hamsini
  rationale: Hii ndiyo namna ya kawaida ya kutaja idadi 550 kwa Kiswahili.
- source_word: הָרֹדִים
  choice: walikuwa na mamlaka juu ya
  rationale: Kitenzi רדה kina maana ya kutawala, kuwa na mamlaka, au kuwa na usimamizi juu ya wengine. Chaguo hili linahifadhi uzito wa mamlaka kuliko neno laini zaidi “kusimamia.”
- source_word: בָּעָם
  choice: watu
  rationale: Nomino hii ni “watu”; kishazi kinachofuata kinabainisha kwamba hao ndio waliokuwa wakifanya kazi, hivyo hakuna haja ya kuibana mapema kuwa “wafanyakazi.”
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: waliokuwa wakifanya kazi hiyo
  rationale: Tafsiri hii ni ya moja kwa moja, ya asili kwa Kiswahili, na inaonyesha kwamba watu hao walishiriki katika kazi iliyotajwa.
