id: 1KI.9.9
reference: 1 Kings 9:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֗ם אֲשֶׁ֨ר הוֹצִ֣יא אֶת אֲבֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨קוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים ו/ישתחו לָ/הֶ֖ם וַ/יַּעַבְדֻ֑/ם עַל כֵּ֗ן הֵבִ֤יא יְהוָה֙ עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/009.yaml
  text: And they will say[a], ‘Because they abandoned Yahweh their God, who brought their fathers out of the land of Egypt, and they held fast to other gods and bowed down to them and served them[c][b], therefore Yahweh brought all this disaster on them.’
translation:
  language: sw
  text: Nao watasema, “Ni kwa sababu walimwacha Yahwe Mungu wao, aliyewatoa baba zao[a] katika nchi ya Misri; wakashikamana na miungu mingine, wakazisujudia na kuzitumikia. Ndiyo maana Yahwe aliwaletea maafa haya yote[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mababu zao.” Kiebrania kinasema kihalisi “baba zao.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “uovu huu wote”; hapa neno hilo linamaanisha maafa au janga lililoletwa katika hukumu, si uovu wa kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Nao watasema
  rationale: Katika muktadha huu kauli hiyo ni jibu ambalo watu watatoa baada ya kuona uharibifu uliotajwa katika mstari uliotangulia; wakati ujao ni wa kawaida na wazi katika Kiswahili.
- source_word: עַל אֲשֶׁר
  choice: Ni kwa sababu
  rationale: Kirai hiki kinaanzisha sababu ya hukumu; tafsiri hii ni ya asili katika Kiswahili na inahifadhi uhusiano wa kisababishi.
- source_word: עָזְבוּ
  choice: walimwacha
  rationale: Kitenzi hiki kinaonyesha kumwacha Yahwe na kuvunja uaminifu wa agano; ‘walimwacha’ ni wazi na hakina mtindo wa kizamani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika Tetragramatoni limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיהֶם
  choice: Mungu wao
  rationale: Ingawa umbo la Kiebrania lina sura ya wingi, hapa linamtaja Yahwe mmoja, Mungu wa Israeli.
- source_word: הוֹצִיא אֶת אֲבֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: aliyewatoa baba zao katika nchi ya Misri
  rationale: Inahifadhi kwa karibu kauli ya kutoka Misri na neno la Kiebrania linalomaanisha kihalisi ‘baba zao’.
- source_word: וַיַּחֲזִקוּ בֵּאלֹהִים אֲחֵרִים
  choice: wakashikamana na miungu mingine
  rationale: ‘Kushikamana na’ huonyesha kujifungamanisha kwa makusudi na kudumu, bila kupunguza maana kuwa kushika kwa mikono tu.
- source_word: וישתחו לָהֶם
  choice: wakaisujudia
  rationale: Kitenzi cha Kiebrania hutaja kuinama au kusujudu; uchaguzi huu unahifadhi tendo halisi lenye maana ya ibada.
- source_word: וַיַּעַבְדֻם
  choice: na kuitumikia
  rationale: ‘Kuitumikia’ hudumisha tofauti ya kileksia na kusujudu na hapa ina maana ya huduma ya kidini kwa miungu hiyo.
- source_word: עַל כֵּן
  choice: Ndiyo maana
  rationale: Hutambulisha matokeo ya uasi wao kwa njia ya kawaida lakini yenye hadhi katika Kiswahili.
- source_word: הֵבִיא ... אֵת כָּל הָרָעָה הַזֹּאת
  choice: aliwaletea maafa haya yote
  rationale: Katika muktadha huu רָעָה ni janga au maafa ya hukumu, si uovu wa kimaadili.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אֲבֹתָם
  choice: baba zao
  alternative: mababu zao
  rationale: ‘Baba zao’ hufuata umbo halisi la Kiebrania na kuacha wazi wigo wake wa kizazi; tanbihi inatoa tafsiri pana ya kimuktadha.
- issue: Maana ya רָעָה katika hukumu
  choice: maafa
  alternative: uovu
  rationale: Hapa neno hilo linataja madhara au janga ambalo Yahwe alileta kama hukumu, wala si kwamba Yahwe alitenda uovu wa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umewekwa wazi kwa wasomaji wa kawaida, huku mfuatano wa kuambatana na miungu mingine, kuisujudia, na kuitumikia ukihifadhiwa.
