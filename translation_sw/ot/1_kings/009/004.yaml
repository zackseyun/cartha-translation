  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa sharti wa Kiebrania: msisitizo kwa Sulemani, kuenenda mbele za Mungu, mfano wa Daudi, uadilifu wa moyo na unyoofu, kutenda yote yaliyoamriwa, na kushika masharti pamoja na hukumu. Koma ya mwisho inafaa, kwa kuwa sentensi ya sharti inaendelea katika aya inayofuata.'
  naturalness: Kiswahili ni sanifu, cha asili, na kina hadhi inayofaa kwa maandishi ya kibiblia. “Utaenenda mbele zangu” huhifadhi nahau ya msingi bila kuifanya isieleweke; “kwa moyo mkamilifu na kwa unyoofu” ni mtiririko wa kawaida.
  terminology: “Moyo mkamilifu” huwasilisha תָם לֵבָב kwa uangalifu, na tanbihi inaeleza kuwa maana si dai la kutokuwa na dhambi. “Masharti” na “hukumu” hudumisha tofauti ya istilahi kati ya חֻקִּים na מִשְׁפָּטִים bila kulazimisha tafsiri ya kimadhehebu. Tanbihi b inatoa mbadala unaokubalika wa kimsamiati.
