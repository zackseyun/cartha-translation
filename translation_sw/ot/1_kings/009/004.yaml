id: 1KI.9.4
reference: 1 Kings 9:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֨ר הָלַ֜ךְ דָּוִ֤ד אָבִ֨י/ךָ֙ בְּ/תָם לֵבָ֣ב וּ/בְ/יֹ֔שֶׁר לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/004.yaml
  text: And as for you[a], if you walk before me as David your father walked, with integrity of heart and with uprightness, doing according to all that I have commanded you, and if you keep my statutes and my judgments[b],
translation:
  language: sw
  text: Nawe, ikiwa utaenenda mbele zangu kama Daudi baba yako alivyoenenda, kwa moyo mkamilifu[a] na kwa unyoofu, ukitenda sawasawa na yote niliyokuamuru, na kuyashika masharti yangu na hukumu zangu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa moyo usiogawanyika.” Neno la Kiebrania linasisitiza ukamilifu na uadilifu wa moyo, si lazima kutokuwa na dhambi kabisa.
    reason: lexical_alternative
  - marker: b
    text: Au, “maagizo yangu na maamuzi yangu ya haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Nawe
  rationale: Huonyesha kuhamia kwa msisitizo mdogo kwa Sulemani katika hotuba ya moja kwa moja, bila uzito usio wa lazima.
- source_word: אִם
  choice: ikiwa
  rationale: Hutanguliza sharti moja kwa moja na kwa lugha ya kawaida yenye hadhi.
- source_word: תֵּלֵךְ לְפָנַי
  choice: utaenenda mbele zangu
  rationale: Huhifadhi taswira ya Kiebrania ya mwenendo wa maisha mbele za Mungu, badala ya kuifafanua kupita kiasi.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִד אָבִיךָ
  choice: kama Daudi baba yako alivyoenenda
  rationale: Huhifadhi ulinganisho na Daudi pamoja na urudiaji wa kitenzi cha kutembea kama sitiari ya mwenendo.
- source_word: בְּתָם לֵבָב
  choice: kwa moyo mkamilifu
  rationale: Neno תָּם linaonyesha moyo kamili, thabiti, na usiogawanyika katika uaminifu; tanbihi inazuia lisieleweke kuwa kutokuwa na dhambi kabisa.
- source_word: וּבְיֹשֶׁר
  choice: na kwa unyoofu
  rationale: Huwasilisha wazo la unyofu wa kimaadili kwa Kiswahili cha kawaida, chenye hadhi.
- source_word: לַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: ukitenda sawasawa na yote niliyokuamuru
  rationale: Huunganisha mwenendo na utiifu wa vitendo, huku ikihifadhi nguvu ya maana ya kufanya kulingana na yote yaliyoamriwa.
- source_word: חֻקַּי
  choice: masharti yangu
  rationale: Huonyesha matakwa yaliyowekwa na Mungu na kuyatofautisha na hukumu zinazofuata.
- source_word: וּמִשְׁפָּטַי
  choice: na hukumu zangu
  rationale: Huhifadhi maana ya kisheria ya מִשְׁפָּטִים na tofauti yake na חֻקִּים.
- source_word: תִּשְׁמֹר
  choice: kuyashika
  rationale: Katika muktadha wa agano, kitenzi hiki humaanisha kuyatii au kuyazingatia kwa uaminifu; 'kuyashika' ni kifupi na kinaeleweka.
theological_decisions:
- issue: Jinsi mfano wa Daudi unavyoelezwa
  choice: Daudi anaelezwa kuwa alitembea kwa moyo mkamilifu na kwa unyoofu, bila kudai kwamba hakuwahi kutenda dhambi.
  alternative: Kutafsiri kwa namna inayoweza kumaanisha moyo usio na lawama yoyote au ukamilifu usio na dhambi.
  rationale: Aya inamweka Daudi kuwa mfano wa uaminifu wa moyo katika agano. תָּם huelekeza kwenye ukamilifu au uadilifu wa moyo, lakini haiondoi mvutano unaotokana na simulizi la makosa yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Utaenenda' limetumiwa kuhifadhi sitiari ya Kiebrania ya kutembea kama mwenendo wa maisha; sentensi inaishia kwa koma kwa sababu sharti linaendelea katika mstari unaofuata.
