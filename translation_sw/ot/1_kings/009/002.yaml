  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֵּרָ֧א יְהוָ֛ה אֶל שְׁלֹמֹ֖ה שֵׁנִ֑ית כַּ/אֲשֶׁ֛ר נִרְאָ֥ה אֵלָ֖י/ו בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/002.yaml
  text: Then Yahweh appeared to Solomon a second time[a], as he had appeared to him at Gibeon.
translation:
  language: sw
  text: Ndipo Yahweh akamtokea Sulemani mara ya pili[a], kama alivyomtokea huko Gibeoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tena”; Kiebrania kihalisi, “mara ya pili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: akamtokea
  rationale: Nifali ya ראה hapa inaonyesha Yahweh kujidhihirisha kwa Sulemani. ‘Akamtokea’ ni kauli ya kawaida na yenye heshima katika Kiswahili kwa muktadha huu wa Mungu kuonekana.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limehifadhiwa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: שֵׁנִית
  choice: mara ya pili
  rationale: Usemi huu unaonyesha wazi kwamba hili lilikuwa tukio la pili, si kurudiwa kusikoainishwa tu.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: ‘Kama’ linaingiza kwa kawaida ulinganisho na jinsi Yahweh alivyomtokea Sulemani hapo awali.
- source_word: נִרְאָה
  choice: alivyomtokea
  rationale: Nifali ya ראה inarudiwa na kurejelea tukio la awali; muundo wa ‘alivyomtokea’ unaonyesha kwa asili ya Kiswahili kwamba tukio hilo lilitangulia.
- source_word: אֵלָיו
  choice: -mtokea
  rationale: Kiambishi cha mtendewa ‘-m-’ katika ‘alivyomtokea’ kinawasilisha maana ya kumtokea yeye bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: בְּגִבְעוֹן
  choice: huko Gibeoni
  rationale: ‘Huko’ linaonyesha mahali pa tukio la awali, na ‘Gibeoni’ ni umbo la kawaida la jina hilo katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja. ‘Yahweh’ linahifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. ‘Ndipo’ linaendeleza simulizi kwa asili, na muundo sambamba ‘akamtokea ... kama alivyomtokea’ unahifadhi urudiaji wa kitenzi katika Kiebrania.
