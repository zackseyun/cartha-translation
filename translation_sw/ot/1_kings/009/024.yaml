base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/024.yaml
  text: But Pharaoh’s daughter went up from the City of David to her house that he had built for her[a]; then he built the Millo.
translation:
  language: sw
  text: Lakini binti Farao alipanda kutoka katika Mji wa Daudi kwenda kwenye nyumba yake ambayo Sulemani alikuwa amemjengea; ndipo Sulemani akajenga Milo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “matuta” au “jazio la udongo”; neno la Kiebrania Milo huenda linamaanisha ngome au muundo wa udongo wa kutegemeza, kama vile tuta.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Katika muktadha huu neno hilo linaonyesha mpito au utofautishaji na simulizi inayozunguka, hivyo “Lakini” ni ya asili na inaeleweka.
- source_word: בַּת פַּרְעֹה
  choice: binti Farao
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha wazi uhusiano wake na Farao bila kuongeza tafsiri nyingine.
- source_word: עָלְתָה
  choice: alipanda
  rationale: Neno hili huhifadhi wazo la kwenda juu, ambalo huenda linahusiana na mwinuko wa mahali.
- source_word: מֵעִיר דָּוִד
  choice: kutoka katika Mji wa Daudi
  rationale: Jina la mahali limehifadhiwa, na kihusishi kinaonyesha mahali alikotoka.
- source_word: אֶל בֵּיתָהּ
  choice: kwenda kwenye nyumba yake
  rationale: “Nyumba” huhifadhi maana ya msingi ya בַּיִת; “ikulu” ingekuwa tafsiri yenye ufafanuzi zaidi kuliko maandishi yenyewe.
- source_word: אֲשֶׁר בָּנָה לָהּ
  choice: ambayo Sulemani alikuwa amemjengea
  rationale: Kiswahili cha wakati uliotangulia kinaweka wazi kuwa ujenzi ulitangulia kuhama kwake. Jina “Sulemani” limetumiwa badala ya kiwakilishi kisicho wazi katika Kiswahili, kwa kuwa ndiye mhusika wa muktadha.
- source_word: אָז
  choice: ndipo
  rationale: Huonyesha mfuatano wa matukio kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: בָּנָה
  choice: akajenga
  rationale: Huwasilisha tendo rahisi linalofuata katika simulizi bila kuongeza wazo la kuanza kujenga.
- source_word: הַמִּלּוֹא
  choice: Milo
  rationale: Hili ni neno la kiufundi au jina la jengo/eneo ambalo maana yake kamili ya kimuundo haijulikani kwa hakika; kulinakili kwa sauti huepuka kuamua kimya kimya kati ya tafsiri zinazowezekana.
