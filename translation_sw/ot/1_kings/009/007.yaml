source:
  edition: WLC
  text: וְ/הִכְרַתִּ֣י אֶת יִשְׂרָאֵ֗ל מֵ/עַ֨ל פְּנֵ֤י הָ/אֲדָמָה֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֨יִת֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אֲשַׁלַּ֖ח מֵ/עַ֣ל פָּנָ֑/י וְ/הָיָ֧ה יִשְׂרָאֵ֛ל לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/007.yaml
  text: then I will cut off Israel from the face of the land that I have given them[a], and the house that I have consecrated for my name I will cast out from before my face[d][c][b], and Israel will become a proverb and a taunt among all peoples.
translation:
  language: sw
  text: Ndipo nitawaondoa Israeli kutoka katika nchi niliyowapa, na nyumba[a] niliyoiweka wakfu kwa jina langu[b] nitaiondoa kutoka mbele zangu[c]. Israeli watakuwa methali na dhihaka miongoni mwa mataifa yote[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “hekalu.” Kiebrania: “nyumba.”'
    reason: lexical_alternative
  - marker: b
    text: “Kwa jina langu” ni nahau ya Kiebrania kuhusu kitu kilichowekwa wakfu ili kibebe na kuliheshimu jina la Mungu.
    reason: cultural_note
  - marker: c
    text: Au, “nitaituma mbali na uwepo wangu.”
    reason: lexical_alternative
  - marker: d
    text: Au, “usemi wa mfano na usemi wa dhihaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: nitawaondoa
  rationale: Kitenzi כרת katika Hiphil hapa kina maana ya kuondoa au kukatilia mbali. “Nitawaondoa” kinaonyesha hukumu ya kufukuzwa bila kudai kwamba Israeli wataangamizwa kabisa.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: katika nchi
  rationale: Ingawa Kiebrania kina taswira halisi ya “kutoka juu ya uso wa nchi,” Kiswahili cha kawaida hutumia “katika nchi.” Muktadha unaonyesha nchi waliyopewa Israeli, si dunia yote.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Neno la Kiebrania ni “nyumba,” ingawa hapa linarejelea hekalu. Kulihifadhi kunaendeleza dhamira ya kitabu kuhusu nyumba ya jina la Mungu; ufafanuzi umetolewa katika tanbihi.
- source_word: הִקְדַּשְׁתִּי
  choice: niliyoiweka wakfu
  rationale: קדשׁ katika Hiphil humaanisha kutenga kitu kiwe kitakatifu. “Kuweka wakfu” ni usemi wa sasa na unaoeleweka kwa jengo lililotengwa kwa ibada ya Mungu.
- source_word: לִשְׁמִי
  choice: kwa jina langu
  rationale: Tafsiri hii inahifadhi nahau muhimu ya Kiebrania kuhusu nyumba iliyowekwa wakfu kwa jina la Mungu badala ya kuifafanua ndani ya matini.
- source_word: אֲשַׁלַּח מֵעַל פָּנָי
  choice: nitaiondoa mbele zangu
  rationale: שׁלח inaweza kumaanisha kupeleka au kuondoa, na kifungu kinachofuata kinaonyesha kukataliwa kutoka mbele za Mungu. Tafsiri hii ni ya asili kwa Kiswahili huku ikihifadhi taswira ya mahali pa Mungu.
- source_word: וְהָיָה יִשְׂרָאֵל
  choice: Israeli watakuwa
  rationale: Kiebrania husema kwamba Israeli “itakuwa,” lakini Kiswahili hutumia upatanisho wa kisemantiki wa wingi watu wa Israeli wanapokusudiwa. Jina “Israeli” limehifadhiwa.
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  choice: methali na kitu cha kudhihakiwa
  rationale: מָשָׁל ni methali au usemi unaotumiwa kama mfano, huku שְׁנִינָה likiongeza wazo la dhihaka. Maneno haya mawili yanahifadhi tofauti hiyo bila kuyarudia kwa maana moja.
- source_word: בְּכָל הָעַמִּים
  choice: miongoni mwa watu wa mataifa yote
  rationale: עַמִּים ni makundi ya watu au mataifa. Usemi huu wa Kiswahili unaeleza maana hiyo kwa urahisi bila kuhusisha tu mataifa ya kisiasa ya kisasa.
theological_decisions:
- issue: Lugha ya hukumu ya agano bila kuzidisha maana kuwa maangamizi kamili
  choice: nitawaondoa watu wa Israeli katika nchi
  alternative: nitawaangamiza Israeli kutoka katika nchi
  rationale: Tishio linahusu hukumu kali na kuondolewa katika nchi kwa sababu ya kutokuwa waaminifu kwa agano. “Nitawaondoa” halifanyi dai la ziada kwamba watu wote wataangamizwa kabisa.
- issue: Kutafsiri הַבַּיִת kuwa “nyumba” au “hekalu”
  choice: nyumba
  alternative: hekalu
  rationale: Matini ya Kiebrania inasema “nyumba.” Neno hilo linahifadhi dhamira ya nyumba iliyowekwa wakfu kwa jina la Mungu, huku tanbihi ikibainisha kwamba hapa ni hekalu.
- issue: Maana ya nyumba kuwekwa wakfu “kwa jina langu”
  choice: kuhifadhi nahau “kwa jina langu” katika matini
  alternative: kuifafanua kuwa “ili ibebe na kuliheshimu jina langu”
  rationale: Nahau hiyo ni muhimu katika teolojia ya kitabu cha Wafalme. Tafsiri haibainishi zaidi namna ya uwepo wa Mungu kuliko inavyofanya matini yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira kuu za Kiebrania—“nyumba,” “jina langu,” na kuwa “methali”—zimehifadhiwa; nahau zisizo za kawaida sana katika Kiswahili zimewasilishwa kwa ulinganifu bora na kufafanuliwa katika tanbihi.
