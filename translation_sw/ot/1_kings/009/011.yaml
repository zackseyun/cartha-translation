source:
  edition: WLC
  text: חִירָ֣ם מֶֽלֶךְ צֹ֠ר נִשָּׂ֨א אֶת שְׁלֹמֹ֜ה בַּ/עֲצֵי֩ אֲרָזִ֨ים וּ/בַ/עֲצֵ֧י בְרוֹשִׁ֛ים וּ/בַ/זָּהָ֖ב לְ/כָל חֶפְצ֑/וֹ אָ֡ז יִתֵּן֩ הַ/מֶּ֨לֶךְ שְׁלֹמֹ֤ה לְ/חִירָם֙ עֶשְׂרִ֣ים עִ֔יר בְּ/אֶ֖רֶץ הַ/גָּלִֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/011.yaml
  text: Hiram king of Tyre had supplied Solomon with cedar timber[a], cypress timber, and gold, according to all his desire; then King Solomon gave Hiram twenty cities in the land of Galilee.
translation:
  language: sw
  text: Hiramu, mfalme wa Tiro, alikuwa amempatia Sulemani mbao za mierezi, mbao za miberoshi[a], na dhahabu, kadiri ya yote aliyotaka Sulemani. Ndipo Mfalme Sulemani akampa Hiramu miji ishirini katika nchi ya Galilaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbao za mreteni,” “mbao za mfiri,” au mbao za mti mwingine wa jamii ya misonobari; haijulikani kwa uhakika neno la Kiebrania berosh linamaanisha aina gani ya mti.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשָּׂא
  choice: alikuwa amempatia
  rationale: Ingawa kitenzi נָשָׂא kwa kawaida humaanisha ‘kuinua, kubeba,’ muundo wake hapa, ukiwa na mtu kama yambwa na vifaa vilivyoanzishwa kwa ב, unaonyesha kumpa au kumwandalia Sulemani mahitaji hayo. Wakati timilifu ‘alikuwa amempatia’ unaweka tendo hili kama usuli wa tendo kuu linalofuata.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: mbao za mierezi
  rationale: עֵץ pamoja na jina la aina ya mti hapa inarejelea mbao za ujenzi, si miti iliyo hai. ‘Mbao za mierezi’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: mbao za miberoshi
  rationale: בְּרוֹשׁ ni jina la mti ambalo aina yake kamili haijulikani kwa uhakika. ‘Miberoshi’ ni tafsiri inayotumika kwa kawaida; uwezekano mwingine umeonyeshwa katika tanbihi.
- source_word: וּבַזָּהָב
  choice: na dhahabu
  rationale: Hili ni neno la kawaida la nyenzo, na limetafsiriwa moja kwa moja bila kulipanua.
- source_word: לְכָל חֶפְצוֹ
  choice: kadiri ya yote aliyotaka
  rationale: חֵפֶץ huonyesha tamaa, matakwa, au jambo linalompendeza mtu. Kauli hii ya asili na wazi inaonyesha kwamba vifaa vilitolewa kwa kadiri ya matakwa yote ya Sulemani.
- source_word: אָז
  choice: ndipo
  rationale: Kiunganishi hiki kinaonyesha wakati na mfuatano wa matukio, kikihusianisha ugavi wa Hiramu na zawadi ya Sulemani.
- source_word: יִתֵּן
  choice: akampa
  rationale: Ingawa umbo la Kiebrania ni imperfect, baada ya אָז linafanya kazi kama tendo la wakati uliopita katika simulizi. ‘Akampa’ linaonyesha mfuatano huo kwa Kiswahili cha asili.
- source_word: עֶשְׂרִים עִיר
  choice: miji ishirini
  rationale: עִיר linaweza kumaanisha mji mkubwa au mdogo; ‘miji’ ni tafsiri ya kawaida inayofaa muktadha wa maeneo yaliyotolewa kwa mfalme mwingine.
- source_word: בְּאֶרֶץ הַגָּלִיל
  choice: katika nchi ya Galilaya
  rationale: אֶרֶץ linaweza kumaanisha nchi au eneo. ‘Nchi ya Galilaya’ linafuata kwa uwazi muundo wa Kiebrania bila kuufinyanga zaidi.
- source_word: חִירָם ... שְׁלֹמֹה ... צֹר ... הַגָּלִיל
  choice: Hiramu ... Sulemani ... Tiro ... Galilaya
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili sanifu cha Biblia na Afrika Mashariki.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima, na unaoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya ‘miberoshi,’ neno linalohusika na kutokuwa na uhakika wa kileksika.
