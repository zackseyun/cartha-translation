  naturalness: “Ni miji ya namna gani hii uliyompa, ndugu yangu?” is natural, modern Standard East African Swahili. “Akaziita nchi ya Kabuli” naturally preserves the Hebrew plural object (“them,” referring to the cities) with the singular designation “land of Cabul.”
  terminology: “Kabuli” is an appropriate Swahili transliteration of כָּבוּל. “Nchi ya Kabuli” accurately renders אֶרֶץ כָּבוּל. The footnote appropriately preserves the uncertain, potentially disparaging wordplay without asserting it as the meaning.
