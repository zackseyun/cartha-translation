  yaml_path: translation/ot/1_kings/009/013.yaml
  text: And he said[a], “What are these cities that you have given me, my brother?” So he called them the land of Cabul to this day.
translation:
  language: sw
  text: Akasema, “Ni miji ya namna gani hii uliyonipa, ndugu yangu?” Basi akaziita nchi ya Kabuli[a] mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda Kabuli ni jina la mahali, lakini neno la Kiebrania linaweza pia kudokeza kwa mchezo wa maneno wa dharau, labda kitu kama “kisichofaa kitu” au “kilichofungwa au kuwekewa mipaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הֶעָרִים הָאֵלֶּה
  choice: Ni miji ya namna gani hii
  rationale: Swali hili linaonyesha malalamiko kuhusu sifa ya miji, si kuomba tu itambulishwe. Kauli hii ya Kiswahili ni ya kawaida na inadumisha mshangao na kutoridhika kwa Hiramu.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: uliyonipa
  rationale: Kitenzi cha Kiebrania kinaonyesha tendo lililokamilika; muundo huu ni wa asili katika Kiswahili na unaonyesha kuwa miji hiyo tayari ilikuwa imetolewa kwake.
- source_word: אָחִי
  choice: ndugu yangu
  rationale: Inahifadhi kiambishi cha umilikaji na lugha ya uhusiano iliyotumiwa katika mawasiliano ya kifalme bila kuibadili kuwa cheo maalumu.
- source_word: וַיִּקְרָא לָהֶם
  choice: akaiita nchi hiyo
  rationale: Kitenzi קרא pamoja na ל kinaweza kumaanisha kuita au kupatia jina. Kwa kuwa kinachofuata ni אֶרֶץ katika umoja, Kiswahili cha asili hutumia ‘akaiita nchi hiyo’ badala ya kurejelea miji kwa wingi kwa jina la nchi.
- source_word: אֶרֶץ כָּבוּל
  choice: nchi hiyo Kabuli
  rationale: אֶרֶץ ni ‘nchi’ au ‘eneo,’ na כָּבוּל inaonekana kutumika kama jina la mahali. ‘Kabuli’ ni unukuzi unaofaa katika mwandiko wa Kiswahili; maana ya dharau inayowezekana inawekwa katika tanbihi badala ya kuingizwa katika matini.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowasilisha mtazamo wa msimulizi kwamba jina hilo liliendelea kutumiwa hadi wakati wake.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali ‘Ni miji ya namna gani hii’ linaonyesha kutoridhika bila kuongeza tafsiri ya dharau katika matini kuu. Muundo ‘nayo inaitwa hivyo’ umeongeza rejeo lililo wazi kwa Kiswahili huku ukidumisha maana ya kwamba jina hilo liliendelea mpaka wakati wa msimulizi.
