    rationale: The Hebrew says literally that he called “them” (the cities) “the land of Cabul,” followed by the temporal formula. Rendering this as “Akaziita nchi ya Kabuli mpaka leo” is both idiomatic and closer to the source, while retaining the potentially unusual collective designation.
