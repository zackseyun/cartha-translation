base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/010.yaml
  text: And it happened at the end of twenty years[b][a], in which Solomon had built the two houses—the house of Yahweh and the king's house—
translation:
  language: sw
  text: Ikawa, mwishoni mwa kipindi cha miaka ishirini ambacho Sulemani alikuwa amezijenga nyumba hizo mbili[b]—nyumba ya Yahwe na nyumba ya mfalme—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya miaka ishirini.” Nahau ya Kiebrania inaonyesha kufika mwisho wa kipindi cha miaka ishirini.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “nyumba hizo mbili,” yaani nyumba ya Yahwe na nyumba ya mfalme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutambulisha hatua mpya katika simulizi kwa mtindo wa kawaida wa Kibiblia, bila kutumia lugha nzito au ya kizamani.
- source_word: מִקְצֵה עֶשְׂרִים שָׁנָה
  choice: miaka ishirini ilipokwisha
  rationale: Nahau hii inaelekeza kwenye wakati ambapo kipindi cha miaka ishirini kilikuwa kimekamilika. Muundo huu ni wa asili katika Kiswahili na huhifadhi maana hiyo ya wakati.
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: Sulemani alikuwa amezijenga
  rationale: Muundo wa wakati uliopita timilifu unaonyesha kwamba kufikia mwisho wa kipindi hicho kazi ya kujenga ilikuwa imefanyika, huku sentensi ikiendelea katika mstari unaofuata.
- source_word: שְׁנֵי הַבָּתִּים
  choice: nyumba hizo mbili
  rationale: Neno בַּיִת linamaanisha kihalisi ‘nyumba.’ ‘Hizo’ huunganisha kwa kawaida nyumba hizo na maelezo yanayofuata yanayozitambulisha.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Huhifadhi taswira halisi ya ‘nyumba’ na jina binafsi la Mungu lililo katika maandishi ya Kiebrania, badala ya kulibadili kuwa cheo au kufafanua nyumba hiyo moja kwa moja kuwa hekalu.
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Huhifadhi ulinganifu wa Kiebrania kati ya nyumba ya Yahwe na nyumba ya mfalme; ‘ikulu’ ingekuwa ufafanuzi wa kimuktadha zaidi kuliko maneno ya chanzo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la Mungu YHWH moja kwa moja. ‘Yahwe’ ni umbo la kawaida la Kiswahili linalowasilisha jina hilo badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya simulizi ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Ikawa’ hudumisha mpito wa kisimulizi, na ‘nyumba’ hudumisha ulinganifu wa chanzo. Alama ya mwisho ya mkato mrefu imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
