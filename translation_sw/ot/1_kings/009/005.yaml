base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/005.yaml
  text: then I will establish the throne of your kingdom over Israel forever, just as I spoke concerning David your father, saying, ‘A man of yours will not be cut off from the throne of Israel.’
translation:
  language: sw
  text: ndipo nitauimarisha kiti cha ufalme wako juu ya Israeli milele, kama nilivyomwambia Daudi, baba yako, nikisema, ‘Hutakosa mtu wako atakayeketi kwenye kiti cha enzi cha Israeli.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: ndipo nitauimarisha
  rationale: Kitenzi hiki humaanisha kusimamisha au kufanya kitu kidumu; ‘nitauimarisha’ ni Kiswahili cha kawaida kinachoonyesha uthabiti wa ufalme.
- source_word: כִּסֵּא מַמְלַכְתְּךָ
  choice: kiti cha ufalme wako
  rationale: Muundo huu unatofautisha kiti cha ufalme wa Sulemani na ‘kiti cha enzi cha Israeli’ mwishoni, huku ukihifadhi sitiari ya mamlaka ya kifalme.
- source_word: לְעֹלָם
  choice: milele
  rationale: Huhifadhi kwa uwazi upeo wa muda wa ahadi bila kuupunguza.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: Hutakosa kamwe mtu
  rationale: Nahau ya Kiebrania, kihalisi ‘hatakatiliwa mbali kwako mtu,’ humaanisha kwamba uzao wa kifalme hautakoma; tafsiri hii ni ya asili na inaeleweka katika Kiswahili.
- source_word: מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: wa kuketi kwenye kiti cha enzi cha Israeli
  rationale: Ingawa kihalisi ni ‘kutoka juu ya kiti cha Israeli,’ maana ya nahau ni kutokosekana kwa mzao anayetawala; ‘kuketi kwenye’ huwasilisha kazi ya kiti cha enzi kwa Kiswahili sanifu.
theological_decisions:
- issue: Upeo wa ahadi ya nasaba ya Daudi
  choice: Kudumisha ‘milele’ bila maelezo ya kimadhehebu
  alternative: Kufafanua moja kwa moja jinsi ahadi hiyo inavyotimizwa kiteolojia
  rationale: Mstari wenyewe unaweka ahadi ndani ya muktadha wa masharti yaliyotangulia; tafsiri haipaswi kutatua kimya kimya mvutano huo wa kiteolojia.
- issue: Taswira ya kutokatiliwa mbali kwa mtu wa nasaba
  choice: ‘Hutakosa kamwe mtu wa kuketi’
  alternative: ‘Mtu wako hatakatiliwa mbali kutoka juu ya kiti’
  rationale: Chaguo hili linatoa maana ya nahau kwa Kiswahili cha sasa bila kuingiza fundisho kuhusu mrithi fulani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa msomaji wa kawaida. Muundo wa ahadi na nukuu ya moja kwa moja umehifadhiwa; hakuna istilahi ya kimadhehebu iliyoingizwa.
