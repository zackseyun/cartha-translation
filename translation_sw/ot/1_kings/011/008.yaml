  text: And so he did for all his foreign wives[a], who were burning incense and sacrificing to their gods.
translation:
  language: sw
  text: Ndivyo alivyowafanyia wake zake wote wa kigeni[a], ambao walikuwa wakifukiza uvumba na kutoa dhabihu kwa miungu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Vivyo hivyo aliwafanyia wake zake wote wa kigeni.” Kiebrania hakitaji wazi tendo hilo hapa, bali hurejelea jambo lililosemwa katika mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: Ndivyo
  rationale: Huendeleza tendo lililotajwa katika mstari uliotangulia kwa Kiswahili cha kawaida, bila kulifafanua upya hapa.
- source_word: עָשָׂה
  choice: alivyowafanyia
  rationale: Kitenzi עשה ni kipana, ‘kufanya/kutenda.’ Muundo huu pamoja na לְכָל unatoa maana ya kwamba Sulemani aliwafanyia wake hao jambo lilelile, huku tendo lenyewe likibaki kutegemea muktadha uliotangulia.
- source_word: לְכָל נָשָׁיו הַנָּכְרִיּוֹת
  choice: wake zake wote wa kigeni
  rationale: לְ inaeleza walengwa wa tendo; נָשָׁיו humaanisha wake zake katika muktadha huu, na הַנָּכְרִיּוֹת huwaeleza kuwa wa kigeni.
- source_word: מַקְטִירוֹת
  choice: walikuwa wakifukiza uvumba
  rationale: Kirai hiki cha kitenzi cha kike wingi kinapatana na ‘wake’ na kinaonyesha shughuli ya ibada iliyokuwa ikiendelea; katika muktadha wa ibada קטר hurejelea kufukiza uvumba au sadaka ya moshi.
- source_word: וּמְזַבְּחוֹת
  choice: na kutoa dhabihu
  rationale: זבח hueleza tendo la kutoa dhabihu. Muundo wa ‘walikuwa waki-’ kutoka kitenzi cha kwanza unatawala pia tendo hili na kuhifadhi uhusiano wa vitenzi shiriki viwili.
- source_word: לֵאלֹהֵיהֶן
  choice: kwa miungu yao
  rationale: Umbo la wingi lenye kiambishi cha kike wingi linarejelea miungu iliyoabudiwa na wake hao; ‘kwa’ ni ya kawaida kwa mwelekeo wa ibada au sadaka.
theological_decisions:
- issue: Watendaji wa מַקְטִירוֹת וּמְזַבְּחוֹת
  choice: Wake wa kigeni ndio waliokuwa wakifukiza uvumba na kutoa dhabihu.
  alternative: Vitenzi vinaweza kueleweka kwa upana kuwa vinaeleza shughuli za ibada zilizohusishwa na mahali pa juu Sulemani alikowajengea.
  rationale: Vitenzi shiriki vya kike wingi vinapatana moja kwa moja na ‘wake zake wa kigeni.’ Tafsiri haimhamishii Sulemani matendo hayo wala kuyafanya yatendwe na mahali pa ibada.
- issue: Tendo lisilotajwa wazi baada ya עָשָׂה
  choice: 'Tendo linaachwa litokane na mstari uliotangulia: ‘Ndivyo alivyowafanyia.’'
  alternative: Alijenga mahali pa juu kwa ajili ya wake zake wote wa kigeni.
  rationale: Kiebrania hakitaji hapa kitu kilichofanywa bali hutegemea muktadha. Tafsiri inahifadhi udokezi huo badala ya kuongeza maneno ya mstari uliotangulia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ndivyo alivyowafanyia’ ni cha asili katika muktadha na huhifadhi utegemezi wa mstari uliotangulia. Muundo ‘walikuwa wakifukiza ... na kutoa ...’ unahifadhi hali ya shughuli inayoendelea bila kuwa mzito.
