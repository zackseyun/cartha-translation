  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu mfuatano wa simulizi: wakati huo, Yeroboamu anatoka Yerusalemu, Ahiya nabii wa Shilo anamkuta njiani, mmoja wao akiwa amejifunika vazi jipya, na wote wawili wakiwa peke yao uwandani. “Akamkuta” huhifadhi maana ya מצא bila kudai mkutano uliopangwa. Kiwakilishi katika “Naye” kinaacha marejeo ya וְהוּא bila kulazimisha utambulisho ambao sentensi ya Kiebrania haitaji kwa jina tena.'
