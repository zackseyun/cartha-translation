id: 1KI.11.29
reference: 1 Kings 11:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔יא וְ/יָֽרָבְעָ֖ם יָצָ֣א מִ/ירוּשָׁלִָ֑ם וַ/יִּמְצָ֣א אֹת֡/וֹ אֲחִיָּה֩ הַ/שִּׁילֹנִ֨י הַ/נָּבִ֜יא בַּ/דֶּ֗רֶךְ וְ/ה֤וּא מִתְכַּסֶּה֙ בְּ/שַׂלְמָ֣ה חֲדָשָׁ֔ה וּ/שְׁנֵי/הֶ֥ם לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/029.yaml
  text: And at that time[a], when Jeroboam went out from Jerusalem, Ahijah the Shilonite, the prophet, found him on the road. Now he had wrapped himself in a new cloak, and the two of them were alone in the open field.
translation:
  language: sw
  text: Ikawa wakati huo, Yeroboamu alipotoka Yerusalemu, nabii Ahiya wa Shilo akamkuta njiani. Naye alikuwa amejifunika kwa vazi jipya, na hao wawili walikuwa peke yao uwandani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shambani.”
    reason: Neno la Kiebrania שָׂדֶה linaweza kumaanisha uwanja, eneo la wazi, au shamba.
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִיא
  choice: Ikawa wakati huo
  rationale: Inahifadhi fomula ya Kiebrania ya kuanzisha tukio na wakati wake kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יָצָא מִירוּשָׁלָם
  choice: alipotoka Yerusalemu
  rationale: Kitenzi יָצָא kina maana ya kutoka; muundo huu pia unaunganisha kishazi cha wakati kwa ufasaha.
- source_word: וַיִּמְצָא אֹתוֹ
  choice: akamkuta
  rationale: מצא hapa ni ‘kupata/kumkuta’; ‘akamkuta’ linafaa kwa kukutana na mtu aliyekuwa njiani bila kuifanya maana kuwa ya kukutana kwa makusudi.
- source_word: אֲחִיָּה הַשִּׁילֹנִי הַנָּבִיא
  choice: nabii Ahiya wa Shilo
  rationale: ‘Wa Shilo’ ni namna ya asili ya Kiswahili ya kueleza jina la mahali, huku cheo ‘nabii’ kikihifadhi utambulisho wa Kiebrania.
- source_word: בַּדֶּרֶךְ
  choice: njiani
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya mahali walipokutana.
- source_word: וְהוּא מִתְכַּסֶּה
  choice: Naye alikuwa amejifunika
  rationale: Inawakilisha hali inayoendelea kama usuli wa tukio na kuhifadhi umbo la kujirejelea la kitenzi. Kiwakilishi hakibadilishwi kuwa jina, hivyo utata wa marejeo unabaki.
- source_word: בְּשַׂלְמָה חֲדָשָׁה
  choice: kwa vazi jipya
  rationale: שַׂלְמָה ni vazi, hasa vazi la nje; ‘vazi’ ni neno la kawaida na linafaa pia kwa kitendo cha kulirarua katika muktadha unaofuata.
- source_word: וּשְׁנֵיהֶם לְבַדָּם
  choice: hao wawili walikuwa peke yao
  rationale: Inahifadhi mkazo kwamba hapakuwa na mtu mwingine pamoja nao.
- source_word: בַּשָּׂדֶה
  choice: uwandani
  rationale: שָׂדֶה inaweza kumaanisha shamba au eneo la wazi nje ya makazi; ‘uwandani’ linaonyesha mazingira ya nje bila kudai kwamba lilikuwa shamba lililolimwa.
theological_decisions:
- issue: Mhusika anayerejelewa na וְהוּא (‘naye’)
  choice: Kuhifadhi kiwakilishi ‘Naye’
  alternative: Kumtaja Ahiya au Yeroboamu moja kwa moja
  rationale: Kiebrania kinaweza kueleweka kuwa kinamrejelea Ahiya, lakini hakimtaji tena kwa jina. Kutumia kiwakilishi kunahifadhi utata huo badala ya kuutatua kimyakimya; jambo hili halipaswi kufanywa hitimisho la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kama Yeroboamu, Ahiya, Shilo, na Yerusalemu. Sentensi imehifadhi mtiririko wa simulizi wa Kiebrania bila kuwa nzito kupita kiasi.
