base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/009.yaml
  text: And Yahweh became angry with Solomon, because his heart had turned away from Yahweh, the God of Israel, who had appeared to him twice.
translation:
  language: sw
  text: Yahwe akamkasirikia Sulemani, kwa sababu moyo wake ulikuwa umegeuka kutoka kwa Yahwe, Mungu wa Israeli, ambaye alikuwa amemtokea mara mbili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַנַּף
  choice: akamkasirikia
  rationale: Kitenzi hiki kinaonyesha hasira ya Yahwe iliyoelekezwa kwa Sulemani. ‘Akamkasirikia’ ni Kiswahili cha kawaida na chenye heshima, bila kupunguza wala kuzidisha nguvu ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili ‘Yahwe,’ badala ya kulibadilisha kuwa cheo.
- source_word: בִּשְׁלֹמֹה
  choice: Sulemani
  rationale: Kiambishi ב pamoja na kitenzi cha hasira kinaonyesha mlengwa wa hasira; muundo wa Kiswahili ‘akamkasirikia Sulemani’ unawasilisha maana hiyo kwa kawaida.
- source_word: כִּי
  choice: kwa sababu
  rationale: Neno hili linaanzisha sababu ya Yahwe kumkasirikia Sulemani.
- source_word: נָטָה לְבָבוֹ
  choice: moyo wake ulikuwa umegeuka
  rationale: Hifadhi taswira ya moyo kugeuka, huku wakati timilifu ‘ulikuwa umegeuka’ ukionyesha kwamba kugeuka kulitangulia hasira inayosimuliwa.
- source_word: מֵעִם
  choice: na kumwacha
  rationale: Mֵעִם hapa huonyesha kujitenga na Yahwe. ‘Kumwacha’ hufanya mwelekeo huo wa kuondoka uwe wazi katika Kiswahili cha kawaida.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa umilikaji, ikihifadhi utambulisho wa Yahwe katika uhusiano wake na Israeli.
- source_word: הַנִּרְאָה אֵלָיו
  choice: aliyekuwa amemtokea
  rationale: Kirai cha Kiebrania kinamrejelea Yahwe kama yule aliyemtokea Sulemani. Muundo huu wa Kiswahili huonyesha wazi kwamba matukio hayo yalitangulia.
- source_word: פַּעֲמָיִם
  choice: mara mbili
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kutafsiri umbo la Kiebrania linalomaanisha ‘twice.’
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu, si cheo. ‘Yahwe’ hulihifadhi kwa unukuzi wa Kiswahili bila kulibadilisha kuwa ‘BWANA.’
- issue: Lugha inayohusisha hasira na Mungu
  choice: akamkasirikia
  alternative: alikuwa na hasira dhidi ya
  rationale: Tafsiri inahifadhi kauli ya moja kwa moja kwamba Yahwe alimkasirikia Sulemani, bila kuilegeza kuwa kutoridhika tu wala kuifanya kuwa kali kupita chanzo.
- issue: Maana ya moyo kugeuka kutoka kwa Yahwe
  choice: moyo wake ulikuwa umegeuka na kumwacha Yahwe
  alternative: moyo wake ulikuwa umeondoka kwa Yahwe
  rationale: Muundo uliochaguliwa huhifadhi ‘moyo’ kama kitovu cha uaminifu na huonyesha kujitenga na Yahwe, bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhi taswira ya moyo na jina ‘Yahwe,’ huku miundo ya Kiebrania ikitolewa kwa Kiswahili cha asili.
