  text: יַ֣עַן אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַ/יִּֽשְׁתַּחֲווּ֮ לְ/עַשְׁתֹּרֶת֮ אֱלֹהֵ֣י צִֽדֹנִין֒ לִ/כְמוֹשׁ֙ אֱלֹהֵ֣י מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם אֱלֹהֵ֣י בְנֵֽי עַמּ֑וֹן וְ/לֹֽא הָלְכ֣וּ בִ/דְרָכַ֗/י לַ/עֲשׂ֨וֹת הַ/יָּשָׁ֧ר בְּ/עֵינַ֛/י וְ/חֻקֹּתַ֥/י וּ/מִשְׁפָּטַ֖/י כְּ/דָוִ֥ד אָבִֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/033.yaml
  text: because they have forsaken me and bowed down to Ashtoreth[a], the god of the Sidonians, to Chemosh, the god of Moab, and to Milcom, the god of the Ammonites, and have not walked in my ways, to do what is right in my eyes and my statutes and my judgments[d][c][b], like David his father.
translation:
  language: sw
  text: kwa sababu wameniacha[a] na kujisujudu mbele ya Ashtorethi[b], mungu wa Wasidoni, mbele ya Kemoshi, mungu wa Moabu, na mbele ya Milkomu[c], mungu wa Waamoni, wala hawakutembea katika njia zangu ili kutenda yaliyo sawa machoni pangu na kutii masharti yangu na hukumu zangu, kama Daudi baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kiebrania yaliyoandikwa yanaweza kusomeka “wameacha,” lakini usomaji wa kimapokeo wa pembeni ni “wameniacha.”
    reason: textual_variant
  - marker: b
    text: Ashtorethi alikuwa mungu wa kike wa Wasidoni. Kirai cha Kiebrania kinasema kihalisi “mungu wa Wasidoni.”
    reason: lexical_alternative
  - marker: c
    text: Jina la Kiebrania hapa ni Milkom; “Milkomu” ni utohozi wa Kiswahili. Wengine hulihusianisha jina hili na Moleki.
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: kwa sababu
  rationale: Inaonyesha sababu ya kugawanywa kwa ufalme kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: עֲזָבוּנִי
  choice: wameniacha
  rationale: Kitenzi kinaonyesha kumwacha Mungu kwa kuvunja uaminifu wa agano; wakati timilifu unaonyesha tendo lenye matokeo yanayoendelea.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: kujisujudu mbele ya
  rationale: Inahifadhi tendo halisi la kuinama au kujilaza katika ibada bila kulifupisha kuwa ‘kuabudu’ pekee.
- source_word: לְעַשְׁתֹּרֶת
  choice: Ashtorethi
  rationale: Jina la Kiebrania limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: אֱלֹהֵי צִדֹנִין
  choice: mungu wa Wasidoni
  rationale: Inafuata muundo wa Kiebrania kwa karibu; neno la Kiswahili ‘mungu’ lenye herufi ndogo halilazimishi jinsia waziwazi.
- source_word: לִכְמוֹשׁ
  choice: Kemoshi
  rationale: Jina limetoholewa kwa mfumo wa sauti unaofaa Kiswahili.
- source_word: וּלְמִלְכֹּם
  choice: Milkomu
  rationale: Maandishi ya Kiebrania hapa yana jina Milkomu, si Moleki; uhusiano unaodhaniwa kati ya majina hayo umewekwa katika tanbihi.
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: mungu wa Waamoni
  rationale: ‘Wana wa Amoni’ ni jina la kikabila; ‘Waamoni’ ni Kiswahili cha kawaida chenye maana ileile.
- source_word: וְלֹא הָלְכוּ בִדְרָכַי
  choice: Hawakutembea katika njia zangu
  rationale: Inahifadhi sitiari ya Kiebrania kuhusu mwenendo wa maisha na uaminifu kwa Mungu.
- source_word: לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: kwa kutenda yaliyo sawa machoni pangu
  rationale: Inahifadhi mtazamo wa Mungu kama kipimo cha yaliyo sawa huku ikiunganisha kishazi kwa Kiswahili cha asili.
- source_word: וְחֻקֹּתַי וּמִשְׁפָּטַי
  choice: na kushika masharti yangu na hukumu zangu
  rationale: ‘Kushika’ hukamilisha kwa Kiswahili cha kawaida wazo la kutenda masharti na hukumu, ingawa Kiebrania hutumia kitenzi kimoja kutawala vipashio vyote.
theological_decisions:
- issue: Jinsia ya Ashtorethi katika kirai אֱלֹהֵי צִדֹנִין
  choice: mungu wa Wasidoni
  alternative: mungu wa kike wa Wasidoni
  rationale: Maandishi ya Kiebrania yana kirai ambacho kwa umbo lake ni ‘mungu wa Wasidoni,’ ingawa Ashtorethi anajulikana kuwa mungu wa kike. Tafsiri kuu haibadilishi kimya kimya namna ya chanzo; maelezo yanawekwa katika tanbihi.
- issue: Utambulisho wa מִלְכֹּם
  choice: Milkomu
  alternative: Moleki
  rationale: Maandishi ya Kimasora yanasoma Milkomu hapa. Uhusiano na Moleki ni wa kimapokeo na haupaswi kuchukua nafasi ya jina lililo katika maandishi.
- issue: Uhusiano wa ‘baba yake’ katika כְּדָוִד אָבִיו
  choice: Daudi baba yake
  alternative: Daudi babu yake wa ukoo
  rationale: Kiwakilishi cha umoja kinarejelea Sulemani katika muktadha; Daudi alikuwa baba yake wa moja kwa moja. Hakuna msingi wa kubadili kuwa babu wa ukoo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Majina ya miungu yameandikwa kwa tahajia zinazoweza kutamkwa kwa urahisi; ‘mungu’ limeandikwa kwa herufi ndogo kwa miungu ya mataifa. Mgawanyo kuwa sentensi mbili unapunguza msongamano bila kubadili uhusiano wa sababu.
