  text: Naye Sulemani alitawala katika Yerusalemu juu ya Israeli yote kwa miaka arobaini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/יָּמִים אֲשֶׁר
  choice: Naye ... kwa miaka
  rationale: Muundo wa Kiebrania, kihalisi ‘na siku ambazo,’ ni nahau ya kueleza muda wa utawala. Kiswahili cha kawaida hutumia ‘kwa miaka,’ huku ‘Naye’ kikihifadhi kiunganishi cha simulizi.
- source_word: מָלַךְ
  choice: alitawala
  rationale: Kitenzi hiki katika muktadha huu humaanisha kutenda kama mfalme; ‘alitawala’ ni cha kawaida na kinaeleweka wazi katika muhtasari wa utawala.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: בִ/ירוּשָׁלִַם
  choice: huko Yerusalemu
  rationale: Kiambishi ב ni cha mahali; ‘huko Yerusalemu’ ni usemi wa asili katika Kiswahili na huonyesha mahali pa utawala.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: juu ya Israeli yote
  rationale: ‘Juu ya’ huhifadhi maana ya mamlaka ya kifalme, na ‘Israeli yote’ hudumisha rejeo la taifa kwa ujumla.
- source_word: אַרְבָּעִים שָׁנָה
  choice: miaka arobaini
  rationale: Hili ni tamko la moja kwa moja la muda wa utawala.
