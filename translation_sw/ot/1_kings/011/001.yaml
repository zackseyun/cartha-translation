  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה אָהַ֞ב נָשִׁ֧ים נָכְרִיּ֛וֹת רַבּ֖וֹת וְ/אֶת בַּת פַּרְעֹ֑ה מוֹאֲבִיּ֤וֹת עַמֳּנִיּוֹת֙ אֲדֹ֣מִיֹּ֔ת צֵדְנִיֹּ֖ת חִתִּיֹּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/001.yaml
  text: 'King Solomon loved many foreign women[a], including Pharaoh’s daughter: Moabite, Ammonite, Edomite, Sidonian, and Hittite women.'
translation:
  language: sw
  text: Mfalme Sulemani aliwapenda wanawake wengi wa kigeni[a], pamoja na binti ya Farao—wanawake Wamoabu, Waamoni, Waedomu, Wasidoni na Wahiti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wake wengi wa kigeni.” Kiebrania kinasema “wanawake wengi wa kigeni”; muktadha unaonyesha kwamba hawa walikuwa wanawake ambao Sulemani aliwaoa au aliwachukua kuwa masuria.
    reason: Mbadala wa kimsamiati unaoeleza maana maalumu inayowezekana kutokana na muktadha.
lexical_decisions:
- source_word: וְהַמֶּלֶךְ שְׁלֹמֹה
  choice: Mfalme Sulemani
  rationale: Kiunganishi וְ kinaendeleza simulizi, lakini Kiswahili hakihitaji neno la ziada mwanzoni mwa sentensi. Jina na cheo vinatafsiriwa kwa mtiririko wa kawaida wa Kiswahili.
- source_word: אָהַב
  choice: aliwapenda
  rationale: Kitenzi אָהַב kwa kawaida humaanisha ‘kupenda.’ Kiambishi cha yambwa -wa- kinaelekeza tendo kwa wanawake waliotajwa.
- source_word: נָשִׁים נָכְרִיּוֹת רַבּוֹת
  choice: wanawake wengi wa kigeni
  rationale: Tafsiri hii inadumisha maana ya moja kwa moja ya ‘wanawake,’ ‘wa kigeni,’ na ‘wengi,’ bila kuibana נָשִׁים kuwa ‘wake’ katika matini kuu.
- source_word: וְאֶת בַּת פַּרְעֹה
  choice: pamoja na binti ya Farao
  rationale: ‘Pamoja na’ huonyesha nyongeza na humhesabu binti ya Farao miongoni mwa wanawake ambao Sulemani aliwapenda, bila kuongeza maelezo yasiyokuwamo katika chanzo.
- source_word: מוֹאֲבִיּוֹת עַמֳּנִיּוֹת אֲדֹמִיֹּת צֵדְנִיֹּת חִתִּיֹּת
  choice: wanawake Wamoabu, Waamoni, Waedomu, Wasidoni na Wahiti
  rationale: Majina haya yanadumisha utambulisho mahususi wa makabila au mataifa katika chanzo; ‘Wasidoni’ hasa huhifadhi rejeo kwa Sidoni badala ya kulipanua kuwa Wafoinike wote.
theological_decisions:
- issue: Kutafsiri נָשִׁים kuwa ‘wanawake’ au ‘wake’
  choice: wanawake
  alternative: wake
  rationale: Neno la Kiebrania linasema ‘wanawake.’ Ingawa muktadha unaonyesha uhusiano wa ndoa au usuria, matini kuu haipaswi kuongeza ubainifu huo zaidi ya chanzo.
- issue: Ikiwa binti ya Farao amejumuishwa miongoni mwa wanawake wa kigeni au ametengwa kama kundi tofauti
  choice: amejumuishwa kwa usemi wa nyongeza ‘pamoja na’
  alternative: kumweka kama kundi tofauti kabisa
  rationale: Muundo wa sentensi unamtaja kwa nyongeza baada ya ‘wanawake wengi wa kigeni.’ Tafsiri inahifadhi uhusiano huo bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Aliwapenda’ ni cha kawaida na cha moja kwa moja; majina ya mataifa yametolewa katika maumbo yanayotambulika kwa wasomaji wa Kiswahili.
