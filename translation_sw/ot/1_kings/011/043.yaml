lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: akalala na baba zake
  rationale: Huhifadhi nahau ya kawaida ya Kiebrania inayomaanisha kufa na kuungana na waliotangulia, badala ya kuifupisha kuwa ‘akafa.’
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Hutoa maana ya kauli tendwa ya Kiebrania kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: katika Mji wa Daudi baba yake
  rationale: Hutaja mahali pa maziko na kudumisha msisitizo wa nasaba uliomo katika kirai ‘baba yake.’
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika taarifa ya urithi wa kifalme, ‘akatawala’ ni Kiswahili cha kawaida kinachoonyesha kuwa alichukua utawala wa kifalme.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Huhifadhi maana ya kurithi au kuchukua nafasi ya mtawala aliyetangulia, si kufuata tu kwa wakati.
