  text: Basi Sulemani akalala na baba zake[a], akazikwa katika Mji wa Daudi, baba yake. Naye Rehoboamu mwanawe akatawala badala yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “akalala na baba zake,” ni msemo wa kawaida unaomaanisha kwamba alikufa na kuungana na waliomtangulia.
