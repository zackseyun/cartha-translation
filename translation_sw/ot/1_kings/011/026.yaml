base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/026.yaml
  text: Jeroboam son of Nebat[a], an Ephraimite from Zeredah—his mother's name was Zeruah, a widow—was a servant of Solomon[c][b], and he raised his hand against the king.
translation:
  language: sw
  text: Naye Yeroboamu mwana wa Nebati, Mwefraimu[a] kutoka Sereda—jina la mama yake lilikuwa Serua, mwanamke mjane—alikuwa mtumishi wa Sulemani, naye akainua mkono dhidi ya mfalme.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwefratha”; lakini hapa maana inayowezekana zaidi ni “Mwefraimu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akamwasi mfalme.” Kiebrania ni “akainua mkono dhidi ya mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: Mwefraimu
  rationale: Katika muktadha wa Wafalme, neno hili linaelekea kutaja mtu wa kabila la Efraimu, si mtu wa Efratha; mbadala wa kimaandishi umehifadhiwa katika tanbihi.
- source_word: הַצְּרֵדָה
  choice: Sereda
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida na inayoeleweka katika Kiswahili.
- source_word: צְרוּעָה
  choice: Serua
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa.
- source_word: אִשָּׁה אַלְמָנָה
  choice: mwanamke mjane
  rationale: Tafsiri hii inahifadhi vipengele vyote viwili vya Kiebrania, ‘mwanamke’ na ‘mjane,’ kwa Kiswahili cha kawaida na chenye heshima.
- source_word: עֶבֶד
  choice: mtumishi
  rationale: Neno linaweza kumaanisha mtumwa au mtumishi; hapa muktadha wa utumishi katika utawala wa Sulemani unaunga mkono ‘mtumishi’ bila kuamua zaidi kuhusu hadhi yake.
- source_word: וַיָּרֶם יָד בַּמֶּלֶךְ
  choice: akainua mkono dhidi ya mfalme
  rationale: Tafsiri inahifadhi sitiari ya Kiebrania na mvutano wake; maana ya uasi imeelezwa kama mbadala katika tanbihi.
- source_word: וְ
  choice: Naye
  rationale: Kiunganishi cha mwanzo kimewasilishwa kama mwendelezo wa simulizi, bila kuingiza kielezi cha wakati kisichopo katika chanzo.
theological_decisions: []
