  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kwa maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili.
