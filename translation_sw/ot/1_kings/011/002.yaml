base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/002.yaml
  text: from the nations about which Yahweh had said to the sons of Israel[a], “You shall not go in among them, and they shall not come in among you; surely they will turn your heart after their gods”—to these Solomon clung in love.
translation:
  language: sw
  text: kutoka kwa mataifa ambayo Yahweh alikuwa amewaambia wana wa Israeli[a], “Msiingie kati yao, wala wao wasiingie kati yenu; kwa hakika wataigeuza mioyo yenu ifuate miungu yao.” Kwa hao Solomoni alishikamana nao kwa upendo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa uwazi zaidi kulingana na muktadha: “Msioane nao, wala wao wasioane nanyi.” Kiebrania kinasema kwa maana ya moja kwa moja zaidi: “Msiingie kati yao, wala wao wasiingie kati yenu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַגּוֹיִם
  choice: kutoka kwa mataifa
  rationale: Neno גּוֹיִם humaanisha mataifa au jamii za watu; “mataifa” linafaa kwa watu wa kigeni wanaotajwa katika muktadha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja kama Yahweh.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi nahau ya Kiebrania na umbo lake la kiume la wingi kwa Kiswahili cha kawaida cha Biblia.
- source_word: לֹא תָבֹאוּ בָהֶם ... וְהֵם לֹא יָבֹאוּ בָכֶם
  choice: Msiingie kati yao, wala wao wasiingie kati yenu
  rationale: Huhifadhi usemi mpana wa Kiebrania na ulinganifu wa vipashio viwili bila kuufanya moja kwa moja kuwa amri ya kutooana; maana hiyo ya kimuktadha inaelezwa katika tanbihi.
- source_word: אָכֵן
  choice: kwa hakika
  rationale: Huonyesha msisitizo na uhakika wa onyo.
- source_word: יַטּוּ אֶת לְבַבְכֶם
  choice: wataigeuza mioyo yenu
  rationale: Kitenzi kina maana ya kugeuza au kuelekeza; “kuigeuza mioyo” huhifadhi sitiari ya chanzo huku upatanisho wa Kiswahili ukirejelea mioyo kama kitu cha pamoja cha kundi.
- source_word: אַחֲרֵי אֱלֹהֵיהֶם
  choice: ifuate miungu yao
  rationale: Hutoa kwa Kiswahili cha kawaida nahau ya Kiebrania ya kwenda “nyuma ya” miungu, yaani kuifuata kwa ibada.
- source_word: בָּהֶם דָּבַק שְׁלֹמֹה לְאַהֲבָה
  choice: Lakini Solomoni alishikamana nao kwa upendo
  rationale: “Alishikamana” huhifadhi nguvu ya דבק, na “kwa upendo” huhifadhi wazo la אַהֲבָה. “Lakini” huonyesha kwa kawaida tofauti kati ya onyo na tendo la Solomoni.
theological_decisions:
- issue: Iwapo amri itafsiriwe wazi kuwa inakataza kuoana
  choice: Usemi mpana “msiingie kati yao ... wasiingie kati yenu” umehifadhiwa katika matini kuu.
  alternative: “Msioane nao, wala wao wasioane nanyi.”
  rationale: Muktadha unahusu ndoa, lakini Kiebrania cha mstari huu kinatumia usemi mpana zaidi. Tanbihi hufafanua maana ya kimuktadha bila kuondoa upeo wa maneno ya chanzo.
- issue: Umoja wa “moyo” katika Kiebrania ukielekezwa kwa kundi
  choice: mioyo yenu
  alternative: moyo wenu
  rationale: Kiswahili cha asili hutumia wingi kwa mioyo ya watu wengi, ingawa Kiebrania kina nomino ya umoja yenye kiambishi cha nafsi ya pili wingi; hakuna tofauti ya kiteolojia inayokusudiwa.
- issue: Kiunganishi kabla ya tendo la Solomoni
  choice: Lakini
  alternative: bila kiunganishi, au “Nao”
  rationale: 'Kiebrania kina mpangilio wa msisitizo unaorejelea waliotajwa: “kwao Solomoni alishikamana.” “Lakini” huwasilisha mvutano wa kimuktadha kati ya onyo la Yahweh na ukaidi wa Solomoni bila kuongeza sababu mpya.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeendeleza muundo wa mstari unaotangulia, kwa kuwa mstari wa Kiebrania unaanza katikati ya maelezo kuhusu wanawake wa mataifa hayo. Alama ya tanbihi [a] imewekwa baada ya “wana wa Israeli” kama katika safu ya mashauriano.
