base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/032.yaml
  text: But one tribe will remain his[a], for the sake of my servant David and for the sake of Jerusalem, the city that I have chosen from all the tribes of Israel.
translation:
  language: sw
  text: Lakini kabila moja litabaki kuwa lake[a], kwa ajili ya mtumishi wangu Daudi na kwa ajili ya Yerusalemu, mji ambao nimeuchagua kutoka katika makabila yote ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kabila moja.” Mara nyingi hili hueleweka kuwa Benyamini imeunganishwa na Yuda, hasa kwa sababu ya mahali Yerusalemu ilipo, lakini maandishi yenyewe yanasema “kabila moja.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֵּׁבֶט הָאֶחָד
  choice: Lakini kabila moja
  rationale: שֵׁבֶט hapa ni kabila, si fimbo au fimbo ya kifalme. Kiunganishi וְ kimetafsiriwa kwa maana ya upinzani kutokana na mgawanyo wa ufalme katika muktadha uliotangulia.
- source_word: יִהְיֶה לּוֹ
  choice: litabaki kuwa lake
  rationale: Nahau ya Kiebrania yenye maana halisi ya ‘litakuwa lake’ inaonyesha umiliki unaoendelea baada ya sehemu nyingine ya ufalme kuondolewa; ‘litabaki kuwa lake’ huweka wazi nguvu ya muktadha bila kuongeza wazo geni.
- source_word: לְמַעַן
  choice: kwa ajili ya
  rationale: Kirai hiki huonyesha kusudi au sababu inayotokana na kumjali Daudi na Yerusalemu; ‘kwa ajili ya’ ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: עַבְדִּי דָוִד
  choice: mtumishi wangu Daudi
  rationale: Hili ni jina la heshima la kifalme na la agano; ‘mtumishi’ linafaa zaidi katika muktadha huu kuliko neno linalosisitiza hali ya utumwa.
- source_word: יְרוּשָׁלִַם הָעִיר
  choice: Yerusalemu, mji
  rationale: Muundo wa kiambatisho umehifadhiwa kwa koma ili sentensi iwe wazi na ya kawaida katika Kiswahili.
- source_word: אֲשֶׁר בָּחַרְתִּי בָהּ
  choice: ambao nimeuchagua
  rationale: Kitenzi timilifu kinaonyesha tendo la Mungu la kuchagua lililokamilika na lenye matokeo yanayoendelea. Kiambishi cha ngeli katika ‘nimeuchagua’ kinarejelea mji kwa kawaida.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: kutoka katika makabila yote ya Israeli
  rationale: מִן pamoja na בחר huonyesha uteuzi kutoka katika kundi kubwa; tafsiri hii inahifadhi uhusiano huo waziwazi.
theological_decisions:
- issue: Mvutano wa kihesabu kati ya ‘kabila moja’ hapa na vifungu au hesabu zinazoonyesha Yuda na Benyamini pamoja chini ya Rehoboamu
  choice: 'Kutafsiri maandishi ya Kiebrania kama yalivyo: ‘kabila moja’'
  alternative: Kufasiri ‘kabila moja’ kuwa usemi unaojumuisha Benyamini ndani ya Yuda/Yerusalemu, au kuoanisha tafsiri kwa kusema ‘ufalme mmoja’ au ‘makabila mawili’
  rationale: Maandishi ya Kiebrania yanasema wazi ‘kabila moja.’ Tafsiri inapaswa kuhifadhi usemi huo na mvutano wake badala ya kuutatua kimyakimya; maelezo ya kihistoria au ya kifasiri yanafaa kuwekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya kawaida na yenye hadhi. Muundo unafuata Kiebrania kwa ukaribu huku ukitumia nahau asilia ya Kiswahili na kuhifadhi mvutano wa ‘kabila moja.’
