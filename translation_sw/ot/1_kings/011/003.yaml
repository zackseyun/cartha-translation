  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִי ל֣/וֹ נָשִׁ֗ים שָׂרוֹת֙ שְׁבַ֣ע מֵא֔וֹת וּ/פִֽלַגְשִׁ֖ים שְׁלֹ֣שׁ מֵא֑וֹת וַ/יַּטּ֥וּ נָשָׁ֖י/ו אֶת לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/003.yaml
  text: He had seven hundred wives[a], princesses, and three hundred concubines; and his wives turned away his heart.
translation:
  language: sw
  text: Alikuwa na wake mia saba wa kifalme[a] na masuria mia tatu; wake zake wakaugeuza moyo wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, wake wenye vyeo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Alikuwa na
  rationale: Muundo היה + ל unaonyesha umiliki; “alikuwa na” ni usemi wa kawaida na wa asili katika Kiswahili.
- source_word: נָשִׁים
  choice: wake
  rationale: Katika muktadha huu wa ndoa za kifalme, neno hili linamaanisha wake, si wanawake kwa ujumla.
- source_word: שָׂרוֹת
  choice: wa kifalme
  rationale: Neno hili linaonyesha wanawake wenye hadhi ya juu, hasa mabinti au wanawake wa nyumba za watawala. “Wake wa kifalme” ni usemi wa asili unaohifadhi hadhi yao bila kudai kwa lazima kwamba wote walikuwa mabinti wa wafalme.
- source_word: שְׁבַע מֵאוֹת
  choice: mia saba
  rationale: Hii ni tafsiri ya moja kwa moja ya idadi.
- source_word: וּפִלַגְשִׁים
  choice: na masuria
  rationale: “Masuria” ni neno la kawaida la Kiswahili kwa wanawake waliokuwa na uhusiano wa ndoa au kingono uliotambuliwa lakini wenye hadhi ya chini kuliko wake.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: mia tatu
  rationale: Hii ni tafsiri ya moja kwa moja ya idadi.
- source_word: וַיַּטּוּ
  choice: wakaugeuza
  rationale: Kitenzi נטה hapa kinaonyesha kubadili mwelekeo wa uaminifu na ibada ya Sulemani. “Wakaugeuza” kinahifadhi taswira ya moyo kugeuzwa bila kuongeza wazi wazo la kupotoshwa.
- source_word: נָשָׁיו
  choice: wake zake
  rationale: Hawa ndio wake waliotajwa katika sehemu ya kwanza ya aya, na kurudia nomino kunafuata msisitizo wa Kiebrania.
- source_word: אֶת לִבּוֹ
  choice: moyo wake
  rationale: “Moyo” huhifadhi taswira ya Kiebrania inayohusisha nia, mawazo, mapenzi na uaminifu wa ndani, wala si hisia pekee.
theological_decisions:
- issue: Maana ya “moyo wake” katika muktadha
  choice: Kuhifadhi neno “moyo” likimaanisha nafsi ya ndani ya Sulemani, pamoja na nia, maamuzi na uaminifu wake.
  alternative: Kulieleza moja kwa moja kuwa wake zake walimwondoa katika uaminifu kwa Mungu.
  rationale: Aya yenyewe inatumia taswira pana ya moyo, huku muktadha unaofuata ukifafanua mwelekeo wake wa kidini. Tafsiri haipaswi kutangulia ufafanuzi huo wala kupunguza moyo kuwa hisia tu.
- issue: Nguvu ya kitenzi וַיַּטּוּ
  choice: wakaugeuza moyo wake
  alternative: wakaupotosha moyo wake / wakauondoa moyo wake
  rationale: “Wakaugeuza” huhifadhi maana ya mwelekeo bila kuingiza hukumu kali zaidi kuliko ilivyo katika kitenzi chenyewe; muktadha ndio unaonyesha kwamba mwelekeo huo ulikuwa wa kumwondoa katika uaminifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya moja kwa moja; “masuria” ni istilahi ya kibiblia inayoeleweka kwa uhusiano wa hadhi ya chini kuliko wake. Alama ya tanbihi [a] imewekwa mara baada ya kirai kinachohusika.
