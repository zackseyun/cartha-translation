  text: וַ/יַּ֧עַשׂ שְׁלֹמֹ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹ֥א מִלֵּ֛א אַחֲרֵ֥י יְהוָ֖ה כְּ/דָוִ֥ד אָבִֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/006.yaml
  text: So Solomon did what was evil in the eyes of Yahweh[a], and he did not fully follow Yahweh, as David his father had done.
translation:
  language: sw
  text: Basi Sulemani akafanya yaliyo maovu machoni pa Yahweh, wala hakumfuata Yahweh kwa ukamilifu[a] kama Daudi baba yake alivyofanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakumfuata Yahweh kikamilifu,” au “hakujitoa kabisa kwa Yahweh.” Nahau ya Kiebrania inaonyesha uaminifu au utiifu usiokamilika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi hiki cha kawaida kinaeleza mwenendo wa Sulemani; “akafanya” ni cha asili katika kishazi “akafanya yaliyo maovu.”
- source_word: הָרַע
  choice: yaliyo maovu
  rationale: Kivumishi chenye kibainishi kimetumiwa kama nomino, yaani “uovu” au “mambo yaliyo maovu”; tafsiri hii inaonyesha wazi hukumu ya kimaadili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Hii inahifadhi sitiari ya Kiebrania inayomaanisha kwamba tendo hilo lilikuwa ovu kwa tathmini ya Yahweh, huku ikibaki wazi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika herufi nne za Kiebrania limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: מִלֵּא אַחֲרֵי
  choice: kumfuata ... kwa ukamilifu
  rationale: Nahau hii inaeleza kumfuata kwa utimilifu au kwa uaminifu wote. Kauli hii inahifadhi wazo la ufuasi usiokamilika bila kulifasiri kuwa hisia za ndani pekee.
- source_word: כְּדָוִד אָבִיו
  choice: kama Daudi baba yake alivyofanya
  rationale: Kitenzi kinachoeleweka kutokana na muktadha kimewekwa wazi ili ulinganisho uwe wa kawaida na wenye kueleweka katika Kiswahili.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina la agano lenyewe. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Kiwango cha kushindwa kwa Sulemani katika מִלֵּא אַחֲרֵי יְהוָה
  choice: hakumfuata Yahweh kwa ukamilifu
  alternative: hakujitoa kabisa kwa Yahweh; hakumfuata Yahweh kikamilifu
  rationale: Nahau inasisitiza kwamba ufuasi wake haukuwa kamili. Tafsiri hii haiingizi katika kishazi hiki hitimisho lenye nguvu zaidi kuhusu uasi kamili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “machoni pa” umehifadhi sitiari ya Kiebrania, na “kwa ukamilifu” huwasilisha nahau bila ukakasi mkubwa.
