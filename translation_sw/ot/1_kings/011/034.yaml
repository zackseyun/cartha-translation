base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/034.yaml
  text: But I will not take the whole kingdom out of his hand, because I will make him ruler all the days of his life, for the sake of David my servant, whom I chose, who kept my commandments and my statutes.
translation:
  language: sw
  text: Lakini sitauondoa ufalme wote kutoka mkononi mwake, kwa maana nitamweka awe mtawala siku zote za maisha yake, kwa ajili ya Daudi mtumishi wangu, ambaye nilimchagua, naye alizishika amri zangu na sheria zangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשִׂיא
  choice: mtawala
  rationale: Neno hili humaanisha mkuu au kiongozi mwenye mamlaka. Katika muktadha huu, “mtawala” ni la kawaida na linaonyesha mamlaka ya Sulemani bila kulazimisha cheo mahususi kisicho wazi katika neno la Kiebrania.
- source_word: מִצְוֺתַי
  choice: amri zangu
  rationale: Huwakilisha maagizo yenye mamlaka ya Mungu kwa lugha ya kawaida na sahihi.
- source_word: חֻקֹּתָי
  choice: sheria zangu
  rationale: Hutofautisha masharti yaliyowekwa na Mungu na “amri,” huku likibaki neno linaloeleweka kwa wasomaji wa kawaida.
- source_word: מִיָּדוֹ
  choice: mkononi mwake
  rationale: Nahau ya Kiebrania imehifadhiwa kwa sababu inaeleweka katika Kiswahili kama kumwondolea mtu mamlaka au milki.
theological_decisions:
- issue: Kauli kwamba Daudi alizishika amri na sheria za Mungu
  choice: imehifadhiwa bila kuongeza sifa kama “kwa ujumla” au “kwa ukamilifu”
  alternative: kuifafanua kwa maneno yanayopunguza au kuhitimisha kiwango cha utii wa Daudi
  rationale: Andiko lenyewe linatoa tathmini hii bila ufafanuzi huo; tafsiri haipaswi kusuluhisha kimya kimya mvutano unaoweza kuonekana kwa kuilinganisha na simulizi nyingine kuhusu Daudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. Mpangilio umewekwa wa asili kadiri unavyosikika kwa ufasaha katika Kiswahili.
