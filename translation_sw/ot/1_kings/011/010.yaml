base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/010.yaml
  text: and had commanded him concerning this matter[a], not to go after other gods, but he did not keep what Yahweh had commanded.
translation:
  language: sw
  text: na alikuwa amemwamuru kuhusu jambo hili, asifuate miungu mingine[a], lakini hakutii alichoamuru Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, “kufuata miungu mingine” ni nahau ya kawaida ya agano inayomaanisha kugeukia na kuabudu miungu mingine.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: na alikuwa amemwamuru
  rationale: Waw pamoja na kitenzi timilifu inaeleza tendo lililotangulia katika muktadha; wakati uliopita timilifu wa Kiswahili unaonyesha hilo kwa kawaida.
- source_word: אֵלָיו
  choice: amemwamuru
  rationale: Kiambishi cha yambwa -mw- huwasilisha kwa Kiswahili maana ya kumwamuru yeye bila muundo mzito wa neno kwa neno.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: kuhusu jambo hili
  rationale: דבר hapa ni suala lililotajwa, hivyo “jambo” ni la kawaida na sahihi kuliko kulifanya kuwa “neno” tu.
- source_word: לְבִלְתִּי לֶכֶת
  choice: asifuate
  rationale: Muundo huu unaonyesha katazo. Katika nahau inayofuata, “asifuate” ni Kiswahili cha kawaida kinachobeba maana ya kutokwenda nyuma ya miungu hiyo.
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Pamoja na “asifuate,” uchaguzi huu unahifadhi nahau ya agano ya kuelekea na kuabudu miungu mingine.
- source_word: וְלֹא שָׁמַר
  choice: Lakini hakutii
  rationale: Waw inaonyesha utofautishaji na amri iliyotangulia. שמר katika muktadha wa amri humaanisha kuishika kwa kuitii; “hakutii” ni ya asili na wazi kwa wasomaji wa sasa.
- source_word: אֵת אֲשֶׁר צִוָּה יְהוָה
  choice: alichoamuru Yahweh
  rationale: Kifungu hiki kinataja yaliyomo katika amri ya Mungu bila kuongeza nomino isiyokuwapo katika Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limewasilishwa kama “Yahweh,” badala ya kulibadili kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu la herufi nne; “Yahweh” huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Maana ya “kufuata miungu mingine”
  choice: asifuate miungu mingine
  alternative: asiende nyuma ya miungu mingine
  rationale: “Kufuata” huhifadhi wazo la nahau ya Kiebrania kwa Kiswahili cha kawaida bila kuifafanua ndani ya mstari kana kwamba ni mwendo wa kimwili pekee; tanbihi inaeleza maana yake ya kiagano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Nukta mbili zinaonyesha kwamba katazo linalofuata ndilo jambo aliloamriwa; sentensi ya pili huweka wazi utofautishaji wa kutotii.
