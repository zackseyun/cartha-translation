base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/014.yaml
  text: Then Yahweh raised up an adversary against Solomon[a], Hadad the Edomite; he was of the royal line in Edom.
translation:
  language: sw
  text: Ndipo Yahwe akamwinulia Sulemani mpinzani[a], Hadadi Mwedomu; alitokana na uzao wa mfalme huko Edomu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: satan; hapa maana yake ni “mpinzani” au “mpingaji,” si jina maalumu Shetani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: akamwinulia
  rationale: Hifili ya קום inaonyesha Yahwe alisababisha mpinzani ainuke dhidi ya Sulemani. ‘Akamwinulia’ ni Kiswahili cha asili kinachohifadhi tendo la Mungu bila kudokeza uteuzi rasmi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa uhamishaji wa moja kwa moja badala ya kubadilishwa na cheo kama ‘BWANA’.
- source_word: שָׂטָן
  choice: mpinzani
  rationale: Hapa ni nomino ya kawaida inayomaanisha mtu anayepinga au anayekuwa adui, si jina maalumu Shetani.
- source_word: לִשְׁלֹמֹה
  choice: Sulemani
  rationale: Pamoja na ‘akamwinulia ... mpinzani,’ kiambishi cha yambwa katika ‘akamwinulia Sulemani’ kinaonyesha kwamba mpinzani huyo aliinuliwa dhidi ya Sulemani.
- source_word: הֲדַד הָאֲדֹמִי
  choice: Hadadi Mwedomu
  rationale: ‘Hadadi’ ni umbo la jina linalofaa katika Kiswahili, na ‘Mwedomu’ humtambulisha kwa taifa lake kwa njia fupi na ya kawaida.
- source_word: מִזֶּרַע הַמֶּלֶךְ
  choice: wa ukoo wa kifalme
  rationale: Neno kwa neno ni ‘kutoka katika uzao wa mfalme’; msemo huu unawasilisha asili ya kifalme kwa Kiswahili cha sasa huku ukihifadhi wazo la nasaba.
- source_word: הוּא בֶּאֱדוֹם
  choice: huko Edomu
  rationale: Kirai hiki kinaunganisha ukoo huo wa kifalme na Edomu. ‘Huko’ huwasilisha kwa kawaida rejeo la mahali bila kulazimisha maana ya kwamba Hadadi mwenyewe alikuwa Edomu wakati huo.
theological_decisions:
- issue: Maana ya שָׂטָן katika aya hii
  choice: nomino ya kawaida ‘mpinzani’
  alternative: jina maalumu ‘Shetani’
  rationale: Muktadha na sintaksia zinamtambulisha Hadadi kuwa mpinzani wa kibinadamu aliyeinuliwa dhidi ya Sulemani. Tafsiri ‘mpinzani’ haileti katika aya dhana ya baadaye ya jina maalumu ambayo Kiebrania hapa hailazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘akamwinulia Sulemani mpinzani’ ni wa asili na huweka wazi tendo la Yahwe na uelekeo wa upinzani. Nusu ya pili imeachwa na kiasi cha ufafanuzi ili kutohitimisha kupita kiasi uhusiano wa kisintaksia wa ‘huko Edomu.’
