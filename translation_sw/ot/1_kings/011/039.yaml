base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/039.yaml
  text: And I will afflict the offspring of David because of this[a], but not forever.
translation:
  language: sw
  text: Nami nitawatesa wazao wa Daudi kwa sababu ya jambo hili, lakini si siku zote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yaani, si milele. Kiebrania: “si siku zote.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאעַנֶּה
  choice: nitawatesa
  rationale: Kitenzi ענה katika kauli ya Piel hapa kinaeleza kusababisha mateso au dhiki katika muktadha wa hukumu. “Nitawatesa” ni wazi na chenye uzito unaofaa, bila kukifasiri kuwa unyenyekezaji wa ndani pekee.
- source_word: זֶרַע דָּוִד
  choice: wazao wa Daudi
  rationale: זֶרַע ni nomino ya pamoja inayorejelea uzao wa Daudi. “Wazao” ni Kiswahili cha kawaida na cha heshima, na hapa kinawakilisha kwa uwazi ukoo unaotokana naye.
- source_word: לְמַעַן זֹאת
  choice: kwa sababu ya jambo hili
  rationale: Kirai hiki kinaonyesha sababu ya hukumu na kurejelea yaliyotangulia. “Kwa sababu ya jambo hili” ni cha asili katika Kiswahili na kinaweka rejeo hilo wazi bila kulifafanua zaidi.
- source_word: אַךְ
  choice: lakini
  rationale: 'Hapa אַךְ inaweka mpaka unaopingana na hukumu iliyotajwa: mateso yatakuwapo, lakini muda wake una kikomo. “Lakini” huwasilisha ulinganisho huo kwa kawaida.'
- source_word: לֹא כָל הַיָּמִים
  choice: si siku zote
  rationale: Hii inafuata taswira halisi ya Kiebrania, “si siku zote,” huku maana ya nahau—“si milele”—ikielezwa katika tanbihi.
theological_decisions:
- issue: Muda wa hukumu juu ya uzao wa Daudi
  choice: Hukumu ni halisi lakini haitadumu siku zote.
  alternative: Kirai kinaweza kutafsiriwa kinahau kuwa “si milele.”
  rationale: Kiebrania kinaweka wazi kikomo cha muda wa mateso. Tafsiri inadumisha mvutano kati ya hukumu ya kweli na kutokuwa kwake ya kudumu, bila kuongeza maelezo ya kimafundisho ambayo mstari wenyewe hauyasemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Wazao” na “si siku zote” huhifadhi kwa kadiri inayowezekana umbo la pamoja na taswira ya Kiebrania, huku tanbihi ikitoa maana ya kinahau.
