id: 1KI.11.31
reference: 1 Kings 11:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לְ/יָֽרָבְעָ֔ם קַח לְ/ךָ֖ עֲשָׂרָ֣ה קְרָעִ֑ים כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י קֹרֵ֤עַ אֶת הַ/מַּמְלָכָה֙ מִ/יַּ֣ד שְׁלֹמֹ֔ה וְ/נָתַתִּ֣י לְ/ךָ֔ אֵ֖ת עֲשָׂרָ֥ה הַ/שְּׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/031.yaml
  text: 'And he said to Jeroboam[a], “Take for yourself ten pieces, for this is what Yahweh, the God of Israel, says: ‘Look, I am tearing the kingdom out of the hand of Solomon, and I will give you ten tribes.’”'
translation:
  language: sw
  text: 'Akamwambia Yeroboamu, “Jichukulie vipande kumi[a], kwa maana hivi ndivyo asemavyo Yahweh, Mungu wa Israeli: ‘Tazama, ninaurarua ufalme kutoka mkononi mwa Sulemani, nami nitakupa makabila kumi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vipande vilivyoraruliwa.” Nomino ya Kiebrania inamaanisha vipande vilivyotokana na kuraruliwa, ikihusisha maneno haya na tendo la ishara la Ahiya la kurarua vazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: Jichukulie
  rationale: Kitenzi hiki kinawasilisha amri ya ‘chukua’ pamoja na maana binafsi ya לְךָ (‘kwa ajili yako mwenyewe’) kwa Kiswahili cha kawaida.
- source_word: קְרָעִים
  choice: vipande
  rationale: Nomino inayotokana na mzizi ‘rarua’ inarejelea vipande vilivyotokana na kuraruliwa kwa vazi; ‘vipande’ ni ya kawaida zaidi kuliko ‘mipasuko’ katika muktadha huu.
- source_word: כִּי כֹה אָמַר
  choice: kwa maana hivi ndivyo asemavyo
  rationale: Inahifadhi fomula ya kinabii na uhusiano wa sababu unaoletwa na כִּי, kwa lugha ya Kiswahili iliyo wazi na yenye hadhi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika herufi nne za Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hili ni muundo wa kawaida na wa asili wa Kiswahili kwa kifungu cha Kiebrania kinachomtambulisha Yahweh kwa uhusiano wake na Israeli.
- source_word: הִנְנִי
  choice: Tazama, nina-
  rationale: ‘Tazama’ huvuta fikira kwa uzito bila kutumia lugha isiyoeleweka, huku nafsi ya kwanza ikiunganishwa na kitenzi kinachofuata.
- source_word: קֹרֵעַ
  choice: ninaurarua
  rationale: Kauli endelevu inaonyesha tendo la kinabii kana kwamba linafanyika sasa; ‘rarua’ pia inadumisha uhusiano na kuraruliwa kwa vazi.
- source_word: הַמַּמְלָכָה
  choice: ufalme
  rationale: Ni neno la kawaida la Kiswahili kwa eneo au utawala wa mfalme katika muktadha huu.
- source_word: מִיַּד שְׁלֹמֹה
  choice: kutoka mkononi mwa Sulemani
  rationale: Inahifadhi taswira ya Kiebrania ya kuondoa kitu katika mamlaka au milki ya mtu.
- source_word: וְנָתַתִּי לְךָ
  choice: nami nitakupa
  rationale: Inawasilisha kwa kawaida ahadi ya wakati ujao na mpokeaji wa nafsi ya pili.
- source_word: עֲשָׂרָה הַשְּׁבָטִים
  choice: makabila kumi
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unarejelea makabila kumi yatakayopewa Yeroboamu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi יְהוָה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Taswira ya kuraruliwa kwa ufalme
  choice: ninaurarua ufalme
  alternative: ninauondoa ufalme
  rationale: ‘Ninaurarua’ inadumisha uhusiano wa makusudi kati ya tamko la Mungu na tendo la ishara la Ahiya la kurarua vazi, bila kufuta nguvu ya sitiari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Hivi ndivyo asemavyo’ na ‘Tazama’ vinadumisha uzito wa usemi wa kinabii bila kuifanya aya kuwa ya kizamani kupita kiasi. Alama ya tanbihi imewekwa baada ya ‘vipande kumi,’ ambako ufafanuzi wake wa kileksia unahusika moja kwa moja.
