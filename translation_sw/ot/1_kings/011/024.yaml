base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/024.yaml
  text: He gathered men to himself and became commander of a band when David killed them. They went to Damascus[a], settled there, and reigned in Damascus.
translation:
  language: sw
  text: Akajikusanyia wanaume, akawa mkuu wa kikosi wakati Daudi alipowaua. Wakaenda Damasko[a], wakakaa huko, wakatawala Damasko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kina vitenzi vya wingi katika nusu yote ya mwisho ya mstari: “wakaenda … wakakaa … wakatawala.” Tafsiri nyingine hulainisha kuwa umoja (“aka-”) kwa sababu muktadha unamlenga Rezoni.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ עָלָיו אֲנָשִׁים
  choice: Akajikusanyia wanaume
  rationale: Kitenzi קבץ pamoja na עָלָיו kinaonyesha kwamba aliwakusanya watu wamzunguke au wajiunge naye. “Akajikusanyia” ni usemi wa kawaida wa Kiswahili unaohifadhi wazo la kujipatia wafuasi, huku “wanaume” ikidumisha jinsia ya nomino ya Kiebrania katika muktadha wa kijeshi.
- source_word: שַׂר גְּדוּד
  choice: mkuu wa kikundi
  rationale: שַׂר ni mkuu au kiongozi, na גְּדוּד ni kikundi au kikosi. “Kikundi” ni neno lisiloingiza dhana ya uvamizi ambayo haijaelezwa wazi katika mstari huu.
- source_word: בַּהֲרֹג דָּוִד אֹתָם
  choice: wakati Daudi alipowaua
  rationale: 'בְּ pamoja na kitenzi-jina huonyesha wakati: “wakati/alipo.” Kiwakilishi cha wingi אֹתָם kimehifadhiwa kwa “-wa-” bila kufafanua kimakusudi kinawarejelea nani hasa.'
- source_word: וַיֵּלְכוּ דַמֶּשֶׂק
  choice: Wakaenda Damasko
  rationale: Huhifadhi mwendo kuelekea Damasko na wingi wa kitenzi cha Kiebrania.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: wakakaa huko
  rationale: ישב inaweza kumaanisha kukaa, kuishi, au kufanya makao. “Wakakaa huko” ni ya kawaida na haiongezi zaidi ya maandishi.
- source_word: וַיִּמְלְכוּ בְּדַמָּשֶׂק
  choice: wakatawala huko Damasko
  rationale: מלך humaanisha kutawala au kuwa mfalme. “Wakatawala” hudumisha kitenzi cha wingi bila kulazimisha tafsiri kwamba kila mmoja wao alikuwa mfalme.
theological_decisions:
- issue: Vitenzi vya wingi katika sehemu ya mwisho ingawa simulizi pana humlenga Rezoni
  choice: 'Kudumisha wingi: “Wakaenda … wakakaa … wakatawala”'
  alternative: 'Kulainisha kuwa umoja: “Akaenda … akakaa … akatawala”'
  rationale: Maandishi ya Kiebrania yana vitenzi vya wingi katika vifungu vyote vitatu. Kudumisha wingi huhifadhi mvutano wa kisintaksia na hakutatui kimafasiri jambo ambalo maandishi yenyewe yameliacha wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa simulizi wenye “aka-/waka-” umetumiwa ili kuonyesha mfuatano wa matukio. Jina la mahali limetolewa kama “Damasko,” matumizi yaliyozoeleka katika Kiswahili cha Biblia.
