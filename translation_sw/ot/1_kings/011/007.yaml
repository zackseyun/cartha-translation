base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/007.yaml
  text: Then Solomon built a high place for Chemosh[a], the abomination of Moab, on the mountain that is opposite Jerusalem, and for Molech, the abomination of the Ammonites.
translation:
  language: sw
  text: Ndipo Sulemani akajenga mahali pa juu kwa ajili ya Kemoshi, chukizo la Moabu, kwenye mlima ulio mkabala na Yerusalemu, na kwa ajili ya Moleki[a], chukizo la Waamoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Milkomu” badala ya “Moleki.” Katika mapokeo, umbo la Kiebrania hapa husomwa “Moleki,” lakini wengine hulihusianisha na Milkomu, mungu wa Waamoni.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Huonyesha tukio linalofuata katika mfululizo wa simulizi kwa Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: יִבְנֶה
  choice: akamjengea
  rationale: Ingawa kitenzi ni cha hali isiyotimilika kimaumbo, baada ya אָז katika simulizi kinaeleza tendo la wakati uliopita. Kiambishi cha mtendewa kinaonyesha kwamba mahali hapo paliwekwa wakfu kwa huyo mungu.
- source_word: בָּמָה
  choice: mahali pa juu
  rationale: Ni istilahi inayotambulika kwa eneo la ibada, mara nyingi lililokuwa sehemu iliyoinuka; inahifadhi maana ya kiibada bila kuifafanua kupita kiasi.
- source_word: לִכְמוֹשׁ
  choice: Kemoshi
  rationale: Jina limetoholewa kwa mfumo wa sauti unaosomeka kwa Kiswahili; kihusishi cha Kiebrania kimewakilishwa na muundo wa kitenzi ‘akamjengea’.
- source_word: שִׁקֻּץ מוֹאָב
  choice: chukizo la Moabu
  rationale: ‘Chukizo’ huhifadhi hukumu kali ya kidini na kimaadili iliyomo katika שִׁקֻּץ bila kuongeza neno ‘mungu,’ ambalo halipo wazi katika kirai hiki.
- source_word: בָּהָר אֲשֶׁר עַל־פְּנֵי יְרוּשָׁלִָם
  choice: kwenye mlima ulio mkabala na Yerusalemu
  rationale: ‘Mkabala na’ huhifadhi maana ya anga ya kuwa mbele ya au kuelekeana na Yerusalemu bila kuingiza utambulisho mahususi wa kijiografia.
- source_word: וּלְמֹלֶךְ
  choice: na pia akamjengea Moleki[a]
  rationale: Usomaji wa Kimasora hapa ni ‘Moleki.’ Kurudia kitenzi kwa Kiswahili huweka wazi ulinganifu wa maeneo mawili ya ibada, huku usomaji mbadala ukihifadhiwa katika tanbihi.
- source_word: שִׁקֻּץ בְּנֵי עַמּוֹן
  choice: chukizo la Waamoni
  rationale: ‘Waamoni’ ni namna ya kawaida ya Kiswahili ya kutaja watu wa Amoni, na ‘chukizo’ huhifadhi ulinganifu na kirai kinachomhusu Kemoshi.
theological_decisions:
- issue: Jina la dharau kwa miungu ya kigeni
  choice: Kutafsiri שִׁקֻּץ kuwa ‘chukizo’ katika sehemu zote mbili
  alternative: kitu cha kuchukiza; mungu wa kuchukiza
  rationale: Neno la Kiebrania lenyewe linatoa hukumu kali juu ya miungu au ibada hizo. ‘Chukizo’ huhifadhi nguvu hiyo bila kuipunguza wala kuongeza ufafanuzi usiotajwa moja kwa moja.
- issue: Utambulisho wa מֹלֶךְ
  choice: Moleki katika matini kuu
  alternative: Milkomu
  rationale: Irabu za Matini ya Kimasora zinaunga mkono ‘Moleki,’ lakini baadhi huhusianisha umbo hili na Milkomu katika vifungu vinavyohusiana. Tofauti hiyo haijaamuliwa kimya kimya bali imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo ‘akamjengea’ ni wa kawaida na unaonyesha kusudi la kuweka mahali pa ibada kwa kila mungu. Alama ya tanbihi imewekwa baada ya ‘Moleki,’ ambako usomaji mbadala unahusika moja kwa moja.
