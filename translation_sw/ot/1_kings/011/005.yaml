base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/005.yaml
  text: Solomon went after Ashtoreth[a], the god of the Sidonians, and after Milcom[c][b], the abomination of the Ammonites.
translation:
  language: sw
  text: Solomoni akamfuata Ashtorethi[a], mungu wa kike wa Wasidoni[b], na Milkomu[c], chukizo la Waamoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Astarte,” umbo la jina hili linalojulikana zaidi.
    reason: lexical_alternative
  - marker: b
    text: Kwa uhalisi, Kiebrania kinaweza kutafsiriwa “mungu wa Wasidoni” au “miungu ya Wasidoni”; hapa rejeo ni Ashtorethi, mungu wa kike.
    reason: lexical_alternative
  - marker: c
    text: Wengine huhusianisha Milkomu na Moleki, lakini matini ya Kiebrania hapa inasoma “Milkomu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ ... אַחֲרֵי
  choice: akaifuata
  rationale: Nahau hii inaonyesha kumfuata kwa utii au ibada, si kwenda tu kimwili. “Akaifuata” huhifadhi picha ya Kiebrania bila kuongeza wazi neno “akaabudu.”
- source_word: עַשְׁתֹּרֶת
  choice: Ashtorethi
  rationale: Jina limetoholewa kwa mwandiko na matamshi ya kawaida ya Kiswahili huku likifuata umbo la Kiebrania katika aya hii.
- source_word: אֱלֹהֵי צִדֹנִים
  choice: mungu wa kike wa Wasidoni
  rationale: Ingawa אֱלֹהֵי kwa umbo ni wingi wa hali ya kuambatana, hapa inamtambulisha Ashtorethi, mungu mmoja wa kike aliyeabudiwa na Wasidoni. Kiswahili kinahitaji kuonyesha jinsia ili rejeo lieleweke kwa kawaida; tanbihi huhifadhi umbo halisi la Kiebrania.
- source_word: מִלְכֹּם
  choice: Milkomu
  rationale: Matini ya Kiebrania hapa inasoma Milkomu, si Moleki; jina limetoholewa kwa muundo wa Kiswahili.
- source_word: שִׁקֻּץ עַמֹּנִים
  choice: chukizo la Waamoni
  rationale: “Chukizo” ni neno lenye uzito linaloonyesha kitu kinachodharauliwa kidini na kimaadili, hapa likimtaja mungu wa Waamoni.
theological_decisions:
- issue: Iwapo kutaja wazi kwamba tendo la Solomoni lilikuwa ibada ya sanamu
  choice: Kuhifadhi nahau kwa “akaifuata” bila kupanua kuwa “akaabudu.”
  alternative: Solomoni akamwabudu
  rationale: Muktadha unaonyesha uasi wa ibada, lakini aya yenyewe hutumia nahau ya “kwenda baada ya/kufuata.” Tafsiri hii huhifadhi mvutano huo bila kuongeza zaidi ya matini.
- issue: Jinsia katika אֱלֹהֵי צִדֹנִים
  choice: mungu wa kike wa Wasidoni
  alternative: mungu wa Wasidoni / miungu ya Wasidoni
  rationale: Ashtorethi ni jina la mungu wa kike mmoja, hivyo tafsiri ya apposition kwa umoja na jinsia ya rejeo ni ya kawaida na wazi katika Kiswahili; tanbihi inataja umbo la Kiebrania.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Majina yametoholewa kwa namna inayosomeka kwa urahisi: Ashtorethi na Milkomu. “Chukizo” huhifadhi ukali wa tathmini ya matini bila kuongeza neno “sanamu,” ambalo halipo wazi katika kishazi hiki.'
