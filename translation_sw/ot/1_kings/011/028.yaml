base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/028.yaml
  text: The man Jeroboam was a mighty man of valor[a], and Solomon saw that the young man was industrious[b], so he appointed him over all the labor force of the house of Joseph.
translation:
  language: sw
  text: Yeroboamu alikuwa mtu hodari[a]. Sulemani alipoona kwamba kijana huyo alikuwa mchapakazi, akamweka asimamie kazi zote za kulazimishwa za nyumba ya Yosefu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu mwenye uwezo mkubwa” au “mtu shujaa.” Usemi wa Kiebrania unaweza kumaanisha nguvu, ushujaa, au uwezo mashuhuri.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya Yosefu” inamaanisha makabila yaliyotokana na Yosefu, hasa Efraimu na Manase.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאִישׁ יָרָבְעָם
  choice: Yeroboamu
  rationale: Kiswahili cha kawaida hakihitaji kurudia kihalisi ‘mtu Yeroboamu’ katika utambulisho huu. Kuanzisha kwa jina kunatoa simulizi la kawaida huku mhusika yuleyule akibaki wazi.
- source_word: גִּבּוֹר חָיִל
  choice: mtu hodari
  rationale: Usemi huu unaweza kumaanisha nguvu, ushujaa, uwezo, au ustadi mashuhuri. Katika muktadha wa uwezo wa Yeroboamu kufanya kazi na kusimamia wengine, ‘mtu hodari’ huhifadhi upana huo bila kuufanya kuwa wa kijeshi tu.
- source_word: וַיַּרְא
  choice: alipoona
  rationale: ראה ni ‘kuona’; muundo wa ‘alipoona ... akamweka’ unaonyesha kwa Kiswahili uhusiano wa mfuatano na sababu uliomo katika simulizi bila kuongeza wazo jipya.
- source_word: הַנַּעַר
  choice: kijana huyo
  rationale: נַעַר hapa humrejelea mtu mzima mwenye uwezo wa kupewa wajibu, hivyo ‘kijana’ inafaa kuliko ‘mvulana’; ‘huyo’ huunganisha rejeo na Yeroboamu aliyetajwa.
- source_word: כִּי עֹשֵׂה מְלָאכָה הוּא
  choice: kwamba kijana huyo alikuwa mchapakazi
  rationale: Kihalisi ni kwamba alikuwa mtu anayefanya kazi. ‘Mchapakazi’ hutoa kwa lugha ya sasa maana ya bidii au uwezo wa kufanya kazi ambayo inaeleza uteuzi wake.
- source_word: וַיַּפְקֵד אֹתוֹ
  choice: akamweka asimamie
  rationale: Hifili ya פקד hapa ni kumteua au kumweka juu ya jambo. ‘Akamweka asimamie’ huonyesha wazi wajibu wa kiutawala.
- source_word: לְכָל סֵבֶל
  choice: kazi zote za kulazimishwa
  rationale: סֵבֶל hurejelea kazi nzito ya kubeba mizigo au utumishi wa kazi uliotozwa na mfalme. ‘Kazi za kulazimishwa’ huwasilisha maana ya corvée kwa uwazi katika Kiswahili cha sasa.
- source_word: בֵּית יוֹסֵף
  choice: nyumba ya Yosefu
  rationale: Huu ni usemi wa kikabila unaowahusu wazao wa Yosefu. Tafsiri ya moja kwa moja ‘nyumba ya Yosefu’ huhifadhi taswira ya Kiebrania, huku tanbihi ikifafanua rejeo lake.
