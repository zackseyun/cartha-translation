base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/022.yaml
  text: Then Pharaoh said to him[a], “But what do you lack with me, that you are seeking to go to your own land?” And he said, “Nothing, but please let me go.”
translation:
  language: sw
  text: Ndipo Farao akamwambia, “Lakini umepungukiwa na nini ukiwa pamoja nami, hata unataka kwenda katika nchi yako?” Naye akasema, “Sijapungukiwa na chochote; lakini tafadhali, niruhusu niende[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kuachilia, utaniachilia” — muundo wa kusisitiza unaotumia kitenzi cha infinitive absolute pamoja na kitenzi kilichonyambuliwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי (ya kwanza)
  choice: Lakini
  rationale: Katika muktadha huu neno hilo linaanzisha swali la Farao kwa nguvu ya kupinga kwa upole ombi la Hadadi; “Lakini” ni ya kawaida katika mazungumzo ya Kiswahili.
- source_word: מָה אַתָּה חָסֵר עִמִּי
  choice: umepungukiwa na nini ukiwa pamoja nami
  rationale: חָסֵר hueleza kupungukiwa au kuwa na uhitaji, na עִמִּי huhifadhi wazo la kuwa pamoja na Farao bila kulibadili kuwa tu kile ambacho Farao angempa.
- source_word: וְהִנְּךָ מְבַקֵּשׁ
  choice: hata unataka
  rationale: הִנֵּה hapa huvuta fikira kwenye hali iliyo mbele ya msemaji, huku מְבַקֵּשׁ ikieleza kutaka au kutafuta kufanya jambo. “Hata unataka” huunganisha swali kwa Kiswahili cha kawaida bila kuongeza wakati usiotajwa wazi.
- source_word: לָלֶכֶת אֶל אַרְצֶךָ
  choice: kwenda katika nchi yako
  rationale: Tafsiri hii huhifadhi kitenzi “kwenda” na umilikaji wa “nchi yako”; haiongezi wazo la “kurudi,” ingawa muktadha unaweza kulidokeza.
- source_word: לֹא
  choice: Sijapungukiwa na chochote
  rationale: Jibu la Kiebrania ni “Sivyo/Hapana” kwa ufupi. Kiswahili hiki kinaweka wazi maana iliyodokezwa na swali, ya kwamba Hadadi hakupungukiwa na kitu.
- source_word: כִּי (ya pili)
  choice: lakini
  rationale: Neno hilo linaingiza kusudi halisi la jibu la Hadadi kwa kulinganisha na kauli kwamba hajapungukiwa na chochote.
- source_word: שַׁלֵּחַ תְּשַׁלְּחֵנִי
  choice: tafadhali, niruhusu niende
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi kamili unasisitiza ombi la kuachiliwa. Kiswahili hiki huwasilisha ombi hilo kwa nguvu na kwa kawaida, huku tanbihi ikieleza muundo wa asili.
