  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mazungumzo yamewekwa kwa mtiririko wa asili, huku maana ya maneno ya Kiebrania na msisitizo wa ombi la mwisho vikihifadhiwa.
