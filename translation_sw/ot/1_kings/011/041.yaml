base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/041.yaml
  text: The rest of the acts of Solomon[a], and all that he did, and his wisdom—are they not written in the Book of the Acts of Solomon?
translation:
  language: sw
  text: Matendo mengine ya Sulemani[a], na yote aliyoyafanya, na hekima yake—je, hayo yote hayajaandikwa katika Kitabu cha Matendo ya Sulemani?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kitabu cha Mambo ya Nyakati za Sulemani.” Jina hilo la Kiebrania kihalisi lina maneno “maneno/mambo ya Sulemani,” usemi unaoweza kumaanisha kumbukumbu ya matendo yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שְׁלֹמֹה
  choice: Matendo mengine ya Sulemani
  rationale: Katika muhtasari wa utawala wa mfalme, דִּבְרֵי humaanisha kwa upana mambo au matendo yaliyoandikwa kumhusu. “Matendo mengine” ni Kiswahili cha kawaida na hudumisha maana ya sehemu iliyobaki ya simulizi.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: pamoja na yote aliyoyafanya
  rationale: Hutafsiri kishazi hiki kwa njia ya moja kwa moja bila kuipa עשה maana finyu kuliko ilivyo; “pamoja na” huunganisha vipengele kwa Kiswahili cha asili.
- source_word: וְחָכְמָתוֹ
  choice: na hekima yake
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha umilikaji, ikidumisha hekima ya Sulemani kama jambo tofauti linalotajwa.
- source_word: הֲלוֹא הֵם כְּתֻבִים
  choice: je, hayajaandikwa
  rationale: Huhifadhi swali la balagha linalotarajia jibu la kukubali. Upatanisho wa ngeli unarejelea “matendo” na mambo yaliyotajwa.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל ni “juu ya” kwa maana halisi, katika muktadha wa kumbukumbu zilizoandikwa Kiswahili cha kawaida husema “katika kitabu.”
- source_word: סֵפֶר דִּבְרֵי שְׁלֹמֹה
  choice: Kitabu cha Matendo ya Sulemani
  rationale: Hutambua usemi huu kama jina la hati iliyohifadhi habari za utawala wa Sulemani. “Matendo” huonyesha maana ya kimuktadha ya דִּבְרֵי, huku tanbihi ikihifadhi tafsiri mbadala.
