translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa swali la balagha umehifadhiwa, na hakuna kiashiria cha wakati kama “Basi” au “Sasa” kilichoongezwa mwanzoni.
