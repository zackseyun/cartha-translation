base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/023.yaml
  text: And God raised up for him an adversary[a], Rezon son of Eliada, who had fled from Hadadezer king of Zobah, his master.
translation:
  language: sw
  text: Mungu akamwinulia adui[a], Rezoni mwana wa Eliada, ambaye alikuwa amemkimbia Hadadezeri, mfalme wa Soba, bwana wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: satan; hapa ni nomino ya kawaida yenye maana ya “adui” au “mpinzani,” si jina maalumu Shetani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: akamwinulia
  rationale: Hifili ya קום inaonyesha Mungu alimsababisha mpinzani ajitokeze dhidi yake; “akamwinulia” ni ya asili katika Kiswahili na huhifadhi wazo hilo.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno hilo linamtaja Mungu wa Israeli.
- source_word: לוֹ
  choice: -m- katika “akamwinulia”
  rationale: Kiambishi cha yambwa huonyesha kwamba adui huyo aliinuliwa kuhusiana na Sulemani, yaani dhidi yake, bila kulazimisha ufafanuzi zaidi.
- source_word: שָׂטָן
  choice: adui
  rationale: Hapa ni nomino ya kawaida inayomaanisha adui au mpinzani wa kisiasa, wala si jina maalumu Shetani.
- source_word: רְזוֹן
  choice: Rezoni
  rationale: Jina limetoholewa kwa namna ya kawaida na inayoeleweka katika Kiswahili.
- source_word: בֶּן אֶלְיָדָע
  choice: mwana wa Eliada
  rationale: Muundo wa ukoo umetafsiriwa moja kwa moja.
- source_word: אֲשֶׁר בָּרַח
  choice: ambaye alikuwa amemkimbia
  rationale: Wakati timilifu uliopita unaonyesha kuwa kukimbia kulitokea kabla ya Mungu kumwinua awe adui.
- source_word: מֵאֵת הֲדַדְעֶזֶר
  choice: amemkimbia ... Hadadezeri
  rationale: Kitenzi “kumkimbia” huwasilisha kwa kawaida kujitenga na mtu huyo.
- source_word: מֶלֶךְ צוֹבָה
  choice: mfalme wa Soba
  rationale: Muundo wa Kiebrania umetafsiriwa moja kwa moja, huku jina la mahali likitoholewa.
- source_word: אֲדֹנָיו
  choice: bwana wake
  rationale: Katika muktadha wa kisiasa neno hili huonyesha mwenye mamlaka juu yake; “bwana wake” ni la kawaida na hudumisha maana hiyo bila kulifanya kuwa jina la Mungu.
theological_decisions:
- issue: Maana ya שָׂטָן katika muktadha
  choice: nomino ya kawaida “adui”
  alternative: jina maalumu “Shetani”
  rationale: Mhusika anayetajwa ni Rezoni, mwanadamu aliyekuwa mpinzani wa kisiasa. Kutumia jina “Shetani” kungeingiza dai la kidini ambalo mstari huu hausemi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa wa asili zaidi kwa Kiswahili kwa kuweka “bwana wake” kabla ya jina Hadadezeri, huku uhusiano wote wa Kiebrania ukihifadhiwa.
