  text: וְ/לִ/בְנ֖/וֹ אֶתֵּ֣ן שֵֽׁבֶט אֶחָ֑ד לְמַ֣עַן הֱיֽוֹת נִ֣יר לְ/דָֽוִיד עַ֠בְדִּ/י כָּֽל הַ/יָּמִ֤ים לְ/פָנַ/י֙ בִּ/יר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי לִ֔/י לָ/שׂ֥וּם שְׁמִ֖/י שָֽׁם־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/036.yaml
  text: But to his son I will give one tribe[a], so that David my servant may always have a lamp before me in Jerusalem, the city that I have chosen for myself to put my name there.
translation:
  language: sw
  text: Lakini mwanawe nitampa kabila moja, ili Daudi, mtumishi wangu, awe na taa[a] sikuzote mbele yangu huko Yerusalemu, mji niliojichagulia ili kuweka jina langu humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nuru.” Katika Kiebrania, “taa” ni sitiari ya kuendelea kwa ukoo wa Daudi au kudumu kwa uwepo wake wa kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט אֶחָד
  choice: kabila moja
  rationale: Katika muktadha wa kugawanywa kwa ufalme, שֵׁבֶט humaanisha kitengo cha kikabila na kisiasa, si fimbo ya kifalme.
- source_word: לְמַעַן הֱיוֹת
  choice: ili ... awe na
  rationale: Muundo huu unaonyesha kusudi; usemi huu ni wa kawaida katika Kiswahili na unadumisha maana hiyo.
- source_word: נִיר
  choice: taa
  rationale: Neno hili ni sitiari ya kuendelea kwa ukoo wa Daudi au kudumu kwa uwepo wake wa kifalme. “Taa” inadumisha picha halisi ya Kiebrania kuliko kuifafanua moja kwa moja.
- source_word: לְדָוִיד עַבְדִּי
  choice: Daudi mtumishi wangu
  rationale: Mpangilio huu unafuata kwa karibu Kiebrania na ni wa asili katika Kiswahili chenye hadhi.
- source_word: כָּל הַיָּמִים
  choice: sikuzote
  rationale: Hii ni nahau inayoonyesha mwendelezo wa daima; “sikuzote” ni wazi na ya kawaida.
- source_word: לְפָנַי
  choice: mbele yangu
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania na wazo la kuwa katika uwepo au machoni pa Mungu.
- source_word: בָּחַרְתִּי לִי
  choice: niliojichagulia
  rationale: Umbo la kujirejelea linahifadhi maana ya לִי, yaani Mungu aliuchagua mji huo kwa ajili yake mwenyewe.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: ili niliweke jina langu humo
  rationale: Huu ni usemi muhimu wa agano na hekalu; umetunzwa bila kuugeuza kuwa maelezo kuhusu uwepo au ibada.
- source_word: וְלִבְנוֹ
  choice: Lakini mwanawe
  rationale: Kiunganishi kina maana ya utofautishaji katika muktadha wa kugawanywa kwa ufalme, hivyo “Lakini” kinaonyesha uhusiano huo vizuri.
theological_decisions:
- issue: Sitiari ya nasaba katika נִיר
  choice: “taa” kama sitiari ya kuendelea kwa ukoo au uwepo wa kifalme wa Daudi mbele za Mungu
  alternative: “nuru” kama sitiari ya jumla zaidi
  rationale: Aya inazungumzia kuhifadhi mwendelezo wa nyumba ya Daudi huko Yerusalemu. Kutumia “taa” kunadumisha mvutano na picha ya kitheolojia bila kuifafanua kupita kiasi katika matini kuu.
- issue: Teolojia ya hekalu katika usemi “kuliweka jina langu humo”
  choice: Kudumisha nahau ya “jina”
  alternative: “kuuthibitisha uwepo wangu humo” au “kuabudiwa humo”
  rationale: Kiebrania kinatumia fomula muhimu ya “jina.” Tafsiri haipaswi kuibadilisha kimya kimya kuwa maelezo mapana zaidi ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwanawe” na “niliojichagulia” ni maumbo mafupi yaliyo ya asili; nahau za kibiblia “mbele yangu” na “kuliweka jina langu” zimedumishwa kwa uwazi.
