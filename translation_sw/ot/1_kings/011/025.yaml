  text: וַ/יְהִ֨י שָׂטָ֤ן לְ/יִשְׂרָאֵל֙ כָּל יְמֵ֣י שְׁלֹמֹ֔ה וְ/אֶת הָ/רָעָ֖ה אֲשֶׁ֣ר הֲדָ֑ד וַ/יָּ֨קָץ֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּמְלֹ֖ךְ עַל אֲרָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/025.yaml
  text: And he was an adversary to Israel all the days of Solomon[a], along with the harm that Hadad caused. And he loathed Israel and reigned over Aram.
translation:
  language: sw
  text: Naye alikuwa adui wa Israeli siku zote za Solomoni,[a] pamoja na madhara aliyosababisha Hadadi. Akaichukia sana Israeli, akatawala Aramu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zaidi ya taabu aliyoleta Hadadi.” Kirai cha Kiebrania kimefupishwa; huenda kikamaanisha kwamba adui huyu alitokea na kuongeza taabu juu ya madhara yaliyosababishwa na Hadadi.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂטָן
  choice: adui
  rationale: Katika simulizi hili neno linamtaja mpinzani wa kibinadamu na wa kisiasa, si Shetani kama jina maalumu.
- source_word: לְיִשְׂרָאֵל
  choice: wa Israeli
  rationale: Muundo wa kawaida wa Kiswahili ‘adui wa Israeli’ unaonyesha wazi kuwa Israeli ndiyo iliyopingwa.
- source_word: כָּל יְמֵי שְׁלֹמֹה
  choice: siku zote za Solomoni
  rationale: Huu ni usemi wa wakati unaodokeza kipindi chote cha maisha au utawala wa Solomoni na unafuata kwa karibu umbo la Kiebrania.
- source_word: וְאֶת הָרָעָה אֲשֶׁר הֲדָד
  choice: pamoja na madhara aliyosababisha Hadadi
  rationale: Kirai cha Kiebrania kimefupishwa na hakina kitenzi wazi. ‘Pamoja na’ kinaonyesha maana inayowezekana ya kuongeza, nayo ‘madhara’ inaeleza taabu iliyotokana na uhasama badala ya uovu wa kimaadili.
- source_word: רָעָה
  choice: madhara
  rationale: Katika muktadha huu neno linaelekea kumaanisha madhara au taabu iliyoletwa juu ya Israeli, si uovu wa kimaadili kwa ujumla.
- source_word: וַיָּקָץ בְּיִשְׂרָאֵל
  choice: Akaichukia sana Israeli
  rationale: Kitenzi kinaonyesha chuki kali au kinyaa dhidi ya Israeli. ‘Akaichukia sana’ ni cha asili na chenye nguvu katika Kiswahili cha sasa.
- source_word: וַיִּמְלֹךְ עַל אֲרָם
  choice: akatawala Aramu
  rationale: ‘Akatawala’ huwasilisha utawala wa kifalme katika mfuatano wa simulizi, na ‘Aramu’ huhifadhi jina la kale badala ya kulibadili kuwa Siria.
theological_decisions:
- issue: Iwapo שָׂטָן litafsiriwe kama jina maalumu ‘Shetani’
  choice: adui wa kibinadamu
  alternative: Shetani
  rationale: Muktadha unahusu wapinzani wa kisiasa wa Solomoni. Hapa neno ni nomino ya kawaida, hivyo kulitafsiri kama ‘Shetani’ kungeingiza maana ya baadaye isiyokusudiwa katika kifungu hiki.
- issue: Jinsi ya kuelewa kirai kilichofupishwa וְאֶת הָרָעָה אֲשֶׁר הֲדָד
  choice: adui huyu aliongeza madhara juu ya yale yaliyohusishwa na Hadadi
  alternative: kirai hicho kinaweza kuhusishwa kwa namna nyingine na uadui katika siku za Solomoni
  rationale: Kiebrania hakina kitenzi wazi baada ya ‘Hadadi.’ Tafsiri kuu inatoa maana inayowezekana na inayoeleweka, huku tanbihi ikihifadhi ugumu na uwezekano mwingine wa kisintaksia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Jina ‘Aramu’ limehifadhiwa kama jina la kale, na ‘Hadadi’ na ‘Solomoni’ yametumiwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
