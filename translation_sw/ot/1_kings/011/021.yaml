    issue: “mababu zake” is used for Hebrew אֲבֹתָיו.
    rationale: Although it can be understood broadly as ancestors, in modern Swahili it commonly denotes grandparents. “Baba zake” is closer to the Hebrew wording and is the conventional form in the biblical death formula; the footnote should explain its idiomatic sense.
