  verdict: revise
  source_fidelity: The draft accurately conveys the report received by Hadad, David’s death idiom, Joab’s death and office, and Hadad’s request to Pharaoh. However, “mababu zake” can naturally mean his grandfathers in contemporary Swahili and is less direct than the Hebrew “his fathers” and the established royal-obituary expression.
  naturalness: The sentence is fluent Standard East African Swahili. “Niruhusu niondoke ili niende katika nchi yangu” is natural and appropriately polite in context.
  terminology: “Hadadi,” “Daudi,” “Yoabu,” “Farao,” and “mkuu wa jeshi” are appropriate. Replacing “mababu zake” with “baba zake” better preserves the Hebrew idiom while the footnote prevents a misleading literal reading.
  issues:
