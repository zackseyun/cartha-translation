base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/021.yaml
  text: When Hadad heard in Egypt that David had lain down with his fathers and that Joab[a], the commander of the army, was dead, Hadad said to Pharaoh, “Send me away[b], so that I may go to my own land.”
translation:
  language: sw
  text: Hadadi aliposikia akiwa Misri kwamba Daudi alikuwa amelala pamoja na baba zake[a], na kwamba Yoabu, mkuu wa jeshi, alikuwa amekufa, akamwambia Farao, “Niruhusu niondoke ili niende katika nchi yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “alikuwa amelala pamoja na baba zake,” msemo wa kawaida unaomaanisha kwamba alikuwa amekufa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: aliposikia
  rationale: Kitenzi hiki kwa kawaida humaanisha “kusikia”; katika simulizi hili kinahusu kupata habari. “Aliposikia” pia huunganisha sentensi kwa ufasaha bila kuongeza neno lisilokuwapo katika chanzo.
- source_word: שָׁכַב ... עִם אֲבֹתָיו
  choice: alikuwa amelala pamoja na mababu zake
  rationale: Ufasiri huu unahifadhi taswira ya msemo wa Kiebrania kuhusu kifo. “Mababu zake” huonyesha hapa waliomtangulia katika ukoo, si baba yake wa moja kwa moja pekee.
- source_word: מֵת
  choice: alikuwa amekufa
  rationale: Huwasilisha hali iliyotokana na kifo na inafaa katika taarifa ambayo Hadadi alikuwa ameisikia.
- source_word: שַׂר הַצָּבָא
  choice: mkuu wa jeshi
  rationale: Ni istilahi ya kawaida na inayoeleweka kwa cheo cha kiongozi mkuu wa jeshi.
- source_word: שַׁלְּחֵנִי
  choice: Niruhusu niondoke
  rationale: Katika muktadha wa Hadadi akizungumza na Farao, ombi hili linamaanisha aachiliwe au apewe ruhusa ya kuondoka katika makao ya kifalme.
- source_word: וְאֵלֵךְ
  choice: ili niende
  rationale: Huonyesha kusudi au matokeo yanayotamaniwa baada ya ombi la kuondoka.
- source_word: אַרְצִי
  choice: nchi yangu
  rationale: Hutoa maana ya msingi ya אֶרֶץ pamoja na kiambishi cha umilikaji bila kuongeza maelezo yasiyohitajika.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi inayofaa simulizi la kifalme. Msemo wa Kiebrania kuhusu kifo umehifadhiwa katika matini na kufafanuliwa kwa tanbihi; hakuna kiunganishi cha mwanzo kama “Basi” kilichoongezwa.
