  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfuatano na maana ya Kiebrania: Sulemani alikusudia/kutafuta kumuua Yeroboamu; Yeroboamu akaondoka, akakimbilia Misri kwa Shishaki, na akakaa huko mpaka Sulemani alipokufa. ‘Akatafuta kumuua’ haidai kwamba mauaji yalifanikiwa, na ‘akakaa Misri’ huwasilisha hali ya kuendelea iliyomo katika וַיְהִי בְמִצְרַיִם pamoja na mpaka wa wakati unaofuata.'
