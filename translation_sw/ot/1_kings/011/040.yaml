  terminology: Majina ‘Sulemani,’ ‘Yeroboamu,’ ‘Misri,’ na ‘Shishaki’ ni ya kawaida katika Kiswahili cha Biblia. ‘Mfalme wa Misri’ na ‘kumuua’ ni sahihi kwa muktadha na haziongezi tafsiri ya kiteolojia.
