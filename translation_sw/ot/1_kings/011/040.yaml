source:
  edition: WLC
  text: וַ/יְבַקֵּ֥שׁ שְׁלֹמֹ֖ה לְ/הָמִ֣ית אֶת יָרָבְעָ֑ם וַ/יָּ֣קָם יָרָבְעָ֗ם וַ/יִּבְרַ֤ח מִצְרַ֨יִם֙ אֶל שִׁישַׁ֣ק מֶֽלֶךְ מִצְרַ֔יִם וַ/יְהִ֥י בְ/מִצְרַ֖יִם עַד מ֥וֹת שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/040.yaml
  text: Then Solomon sought to put Jeroboam to death[a], but Jeroboam arose and fled to Egypt, to Shishak king of Egypt[b], and he was in Egypt until the death of Solomon.
translation:
  language: sw
  text: Basi, Sulemani akatafuta kumuua Yeroboamu[a], lakini Yeroboamu akaondoka na kukimbilia Misri, kwa Shishaki mfalme wa Misri, akakaa Misri mpaka Sulemani alipokufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akajaribu kumuua Yeroboamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: akatafuta
  rationale: Huhifadhi nahau ya Kiebrania ya ‘kutafuta’ huku muktadha ukionyesha nia na jitihada za kumuua, bila kudokeza kwamba alifanikiwa.
- source_word: לְהָמִית
  choice: kumuua
  rationale: Hiphil ya מות ina maana ya kusababisha afe; ‘kumuua’ ni Kiswahili cha kawaida, wazi, na chenye uzito unaofaa katika muktadha huu.
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: Katika simulizi, קום mara nyingi huanzisha hatua ya uamuzi. ‘Akaondoka’ ni ya asili zaidi kwa Kiswahili kuliko tafsiri halisi ‘akasimama,’ na inaunganika vizuri na kukimbia.
- source_word: וַיִּבְרַח
  choice: akakimbilia
  rationale: ברח huonyesha kukimbia hatari; ‘akakimbilia Misri’ huwasilisha tendo la kukimbia pamoja na mahali alikoelekea.
- source_word: מִצְרַיִם ... אֶל שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: Misri, kwa Shishaki mfalme wa Misri
  rationale: Hurudia ‘Misri’ kama ilivyo katika Kiebrania na kutofautisha nchi aliyokimbilia na mtawala aliyemwendea.
- source_word: וַיְהִי בְמִצְרַיִם
  choice: akakaa Misri
  rationale: Ingawa kwa umbo ni ‘alikuwa Misri,’ katika Kiswahili ‘akakaa Misri’ huonyesha kwa kawaida hali iliyoendelea hadi wakati uliotajwa.
- source_word: עַד מוֹת שְׁלֹמֹה
  choice: mpaka Sulemani alipokufa
  rationale: Hutoa kwa Kiswahili cha asili maana ya kirai nomino ‘mpaka kifo cha Sulemani’ bila kubadili uhusiano wa wakati.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi ya simulizi. Muundo wa vitenzi vinavyofuatana kwa ‘aka-’ huhifadhi mwendo wa simulizi la Kiebrania. Jina שִׁישַׁק limetoholewa kuwa ‘Shishaki.’
