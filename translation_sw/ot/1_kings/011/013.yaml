base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/013.yaml
  text: Yet I will not tear away the whole kingdom; I will give one tribe to your son[a], for the sake of David my servant and for the sake of Jerusalem, which I have chosen.
translation:
  language: sw
  text: Lakini[a] sitaurarua ufalme wote; nitampa mwanao kabila moja kwa ajili ya Daudi mtumishi wangu, na kwa ajili ya mji wa Yerusalemu niliouchagua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: Ila, sitaurarua ufalme wote.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Hapa neno hili linaweka mpaka kwa hukumu iliyotangulia. “Lakini” linaonyesha kwa kawaida na kwa uwazi nguvu hiyo ya upinzani katika Kiswahili.
- source_word: כָּל הַמַּמְלָכָה
  choice: ufalme wote
  rationale: Huhifadhi wazo la eneo lote la kifalme ambalo lingeweza kuondolewa.
- source_word: אֶקְרָע
  choice: sitaurarua
  rationale: Kitenzi קָרַע kwa msingi humaanisha kurarua. Tafsiri hii inadumisha taswira kali ya kuugawa na kuuondoa ufalme.
- source_word: שֵׁבֶט אֶחָד
  choice: kabila moja
  rationale: Katika muktadha wa kugawanywa kwa ufalme, שֵׁבֶט humaanisha kundi la kikabila la Israeli, si fimbo au rajamu.
- source_word: אֶתֵּן לִבְנֶךָ
  choice: nitampa mwanao
  rationale: Ni usemi wa moja kwa moja na wa kawaida unaowasilisha tendo la baadaye la kumpa mwana wa Sulemani.
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: kwa ajili ya Daudi mtumishi wangu
  rationale: “Kwa ajili ya” huonyesha kwamba Mungu anamjali Daudi bila kufafanua kupita kiasi namna ya kiteolojia ya uhusiano huo.
- source_word: וּלְמַעַן יְרוּשָׁלַם
  choice: na kwa ajili ya Yerusalemu
  rationale: Kurudia “kwa ajili ya” kunahifadhi usambamba na msisitizo wa Kiebrania.
- source_word: אֲשֶׁר בָּחָרְתִּי
  choice: ambao nimeuchagua
  rationale: Kauli hii huonyesha uchaguzi uliofanywa na Mungu ambao bado una umuhimu katika wakati wa tamko hili; upatanisho wa kisarufi unarejelea mji wa Yerusalemu.
theological_decisions:
- issue: Sababu ya kuhifadhi kabila moja
  choice: Aya inaeleza kwamba sehemu ya ufalme itahifadhiwa kwa ajili ya Daudi mtumishi wa Mungu na kwa ajili ya Yerusalemu aliyoichagua Mungu.
  alternative: Kuhifadhiwa huko kunatokana na agano la Daudi pekee, au kunahusu hasa hekalu na mji kuliko Daudi.
  rationale: 'Kiebrania kinatoa sababu mbili zinazolingana: kwa ajili ya Daudi na kwa ajili ya Yerusalemu. Tafsiri inazihifadhi zote bila kuunganisha moja ndani ya nyingine au kuongeza mfumo wa kimadhehebu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Taswira ya “kurarua” imehifadhiwa, na urudiaji wa “kwa ajili ya” unaakisi muundo wa Kiebrania.
