language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם תִּשְׁמַע֮ אֶת כָּל אֲשֶׁ֣ר אֲצַוֶּ/ךָ֒ וְ/הָלַכְתָּ֣ בִ/דְרָכַ֗/י וְ/עָשִׂ֨יתָ הַ/יָּשָׁ֤ר בְּ/עֵינַ/י֙ לִ/שְׁמ֤וֹר חֻקּוֹתַ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר עָשָׂ֖ה דָּוִ֣ד עַבְדִּ֑/י וְ/הָיִ֣יתִי עִמָּ֗/ךְ וּ/בָנִ֨יתִי לְ/ךָ֤ בַֽיִת נֶאֱמָן֙ כַּ/אֲשֶׁ֣ר בָּנִ֣יתִי לְ/דָוִ֔ד וְ/נָתַתִּ֥י לְ/ךָ֖ אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/038.yaml
  text: And it shall be[a], if you listen to all that I command you, and walk in my ways, and do what is right in my eyes by keeping my statutes and my commandments, as David my servant did, then I will be with you and build for you a faithful house, just as I built for David, and I will give Israel to you.
translation:
  language: sw
  text: Ikiwa utasikiliza yote nitakayokuamuru, ukaenda katika njia zangu, na ukatenda yaliyo sawa machoni pangu kwa kuzishika sheria zangu na amri zangu, kama Daudi mtumishi wangu alivyofanya, basi nitakuwa pamoja nawe, nami nitakujengea nyumba ya kudumu[a], kama nilivyomjengea Daudi; nami nitakupa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyumba thabiti,” “nyumba ya hakika,” au “nyumba aminifu”; hapa “nyumba” inamaanisha ukoo wa kifalme unaodumu.
    reason: Neno נֶאֱמָן linaweza kuonyesha uthabiti, uaminifu, uhakika, au udumifu; tanbihi pia hufafanua maana ya kisitiari ya “nyumba” katika muktadha huu.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: utasikiliza
  rationale: Kitenzi hiki kinaweza kumaanisha kusikia, kusikiliza, au kutii. “Utasikiliza” kinadumisha taswira ya kusikia huku vifungu vinavyofuata vikifafanua utiifu unaokusudiwa.
- source_word: אֲצַוֶּךָ
  choice: nitakayokuamuru
  rationale: Kauli ya Kiebrania inaelekea wakati wa sasa au ujao katika sharti hili; muundo huu wa Kiswahili ni wa kawaida na unahifadhi nguvu ya agizo la Mungu.
- source_word: וְהָלַכְתָּ בִדְרָכַי
  choice: ukaenda katika njia zangu
  rationale: Hii inadumisha sitiari ya agano ya ‘kwenda katika njia’ badala ya kuibadili kuwa maelezo yasiyo na sitiari.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: yaliyo sawa machoni pangu
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania inayosisitiza tathmini ya Mungu kuhusu yaliyo sawa.
- source_word: לִשְׁמֹר
  choice: kwa kuzishika
  rationale: Kiswahili hiki kinaonyesha wazi kwamba kushika sheria na amri ndiyo namna ya kutenda yaliyo sawa.
- source_word: חֻקּוֹתַי
  choice: sheria zangu
  rationale: “Sheria” ni neno linaloeleweka kwa urahisi katika muktadha wa masharti ya agano, bila kupoteza uzito wa kisheria.
- source_word: מִצְוֺתַי
  choice: amri zangu
  rationale: “Amri” hutofautisha jina hili na kitenzi “nitakayokuamuru” huku ikidumisha sajili ya agano.
- source_word: עַבְדִּי
  choice: mtumishi wangu
  rationale: Katika muktadha huu neno hilo ni cheo cha heshima kwa Daudi kama anayemtumikia Mungu, si msisitizo juu ya hali ya utumwa.
- source_word: בַיִת נֶאֱמָן
  choice: nyumba ya kudumu
  rationale: “Nyumba” hapa ni ukoo wa kifalme, na נֶאֱמָן huonyesha uthabiti, uhakika, na udumifu. “Nyumba ya kudumu” huwasilisha maana hiyo kwa Kiswahili cha kawaida huku ikihifadhi sitiari ya nyumba.
- source_word: וְנָתַתִּי לְךָ אֶת יִשְׂרָאֵל
  choice: nitakupa Israeli
  rationale: Muundo huu wa Kiswahili ni wa moja kwa moja na unaonyesha kwamba Israeli ndiye anayetolewa na Mungu.
theological_decisions:
- issue: Maana ya “nyumba” katika ahadi
  choice: Nyumba inamaanisha ukoo wa kifalme, huku neno “nyumba” likidumishwa katika matini.
  alternative: Jengo halisi au jumba la kifalme.
  rationale: Muktadha wa urithi wa kifalme na ulinganisho na nyumba aliyomjengea Daudi unaelekeza kwa nasaba ya kudumu, si jengo tu. Tanbihi inafafanua maana bila kuondoa sitiari ya kibiblia.
- issue: Nguvu ya sharti katika ahadi
  choice: Ahadi halisi yenye sharti, inayotegemea utiifu wa Yeroboamu.
  alternative: Ahadi isiyo na sharti.
  rationale: Neno אִם na mfululizo wa masharti ya utiifu huifanya ahadi hii kuwa ya wazi kwamba ina sharti; tafsiri haipunguzi wala kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Muundo mrefu wa Kiebrania umegawanywa katika sentensi mbili kwa usomaji wa kawaida, huku sharti, sitiari za agano, na mfuatano wa ahadi vikidumishwa.
