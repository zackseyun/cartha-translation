  text: וְ/אֹתְ/ךָ֣ אֶקַּ֔ח וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/הָיִ֥יתָ מֶּ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/037.yaml
  text: And I will take you[a], and you shall reign over all that your soul desires, and you shall be king over Israel.
translation:
  language: sw
  text: Nami nitakuchukua, nawe utatawala juu ya yote ambayo nafsi yako inatamani[a], nawe utakuwa mfalme juu ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “yote unayotamani”; kihalisi, “yote ambayo nafsi yako inatamani.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶקַּח
  choice: nitakuchukua
  rationale: Kitenzi לקח kwa kawaida humaanisha ‘chukua.’ Katika muktadha huu kinadokeza kumweka Yeroboamu katika nafasi aliyopewa na Mungu, lakini ‘nitakuchukua’ kinahifadhi nguvu halisi ya kitenzi bila kukifasiri moja kwa moja kuwa ‘nitakuteua.’
- source_word: וּמָלַכְתָּ
  choice: utatawala
  rationale: Kitenzi מלך kinaeleza kutenda kazi ya kifalme, yaani kutawala, wala si kuanza tu kuwa mfalme.
- source_word: בְּכֹל אֲשֶׁר
  choice: juu ya yote ambayo
  rationale: Pamoja na kitenzi cha kutawala, בְּ hapa huonyesha eneo au upeo wa mamlaka. ‘Juu ya yote ambayo’ huwasilisha uhusiano huo kwa Kiswahili kinachoeleweka.
- source_word: תְּאַוֶּה נַפְשֶׁךָ
  choice: nafsi yako inatamani
  rationale: Hii inahifadhi taswira ya Kiebrania, ambayo kihalisi inasema kwamba ‘nafsi yako inatamani,’ bila kuibadili kimafafanuzi kuwa ‘moyo wako’ au ‘wewe.’
- source_word: וְהָיִיתָ מֶּלֶךְ
  choice: utakuwa mfalme
  rationale: Muundo wa היה pamoja na nomino unaonyesha hali au cheo kitakachopatikana; ‘utakuwa mfalme’ ni tangazo la kawaida na la wazi kwa Kiswahili.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: עַל katika muktadha wa ufalme huonyesha mamlaka juu ya watu au taifa, hivyo ‘juu ya Israeli’ huhifadhi maana hiyo.
theological_decisions:
- issue: Usemi wa kianthropolojia נֶפֶשׁ
  choice: nafsi yako inatamani
  alternative: unatamani; moyo wako unatamani
  rationale: Aya haitoi fundisho maalumu kuhusu sehemu za mwanadamu, lakini inatumia נֶפֶשׁ. Kutumia ‘nafsi’ kunahifadhi usemi wa chanzo na mvutano wake bila kuuingiza katika mfumo fulani wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nitakuchukua’ limechaguliwa badala ya ‘nitakutwaa,’ ambalo linaweza kusikika la kale, na badala ya ‘nitakuteua,’ ambalo lingeongeza ufafanuzi usio wazi moja kwa moja katika kitenzi cha Kiebrania.
