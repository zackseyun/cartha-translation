translation:
  language: sw
  text: Lakini nitauondoa ufalme kutoka mkononi mwa mwanawe[a], nami nitakupa makabila kumi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka mkononi mwa mwanawe,” nahau inayomaanisha kuuondoa utawala au umiliki kutoka katika mamlaka ya mwanawe.'
    reason: cultural_note
  - marker: b
    text: 'Kiebrania, kwa muundo wake: “nami nitakupa ... makabila kumi.” Kirai hicho hubainisha kwamba kile kinachotolewa ni makabila kumi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Lakini nitauondoa
  rationale: Kitenzi cha Kiebrania kina maana ya ‘nitachukua’; katika muktadha huu kuchukua ufalme kutoka kwa mtawala ni kuuondoa katika mamlaka yake. ‘Lakini’ linaonyesha utofauti na kauli iliyotangulia.
- source_word: הַמְּלוּכָה
  choice: ufalme
  rationale: Neno hili linarejelea utawala wa kifalme au eneo linalotawaliwa; ‘ufalme’ ni tafsiri ya kawaida na ya asili katika muktadha huu.
- source_word: מִיַּד בְּנוֹ
  choice: mikononi mwa mwanawe
  rationale: Nahau ya Kiebrania ‘kutoka mkononi mwa’ inaonyesha kuondoa kitu katika mamlaka au udhibiti wa mtu. Wingi ‘mikononi’ ni namna ya kawaida ya kuiwasilisha picha hiyo kwa Kiswahili.
- source_word: וּנְתַתִּיהָ לְּךָ
  choice: na kukupa wewe
  rationale: Kiambishi cha kitu kinarejelea ufalme. ‘Wewe’ kimewekwa wazi kwa msisitizo unaolingana na kiwakilishi cha Kiebrania.
- source_word: אֵת עֲשֶׂרֶת הַשְּׁבָטִים
  choice: yaani, yale makabila kumi
  rationale: 'Kirai hiki kinafafanua kile kitakachotolewa: makabila kumi. ‘Yaani’ huonyesha uhusiano huo wa ufafanuzi kwa Kiswahili cha asili bila kudokeza kwamba ni kitu kingine tofauti na ufalme unaotajwa.'
