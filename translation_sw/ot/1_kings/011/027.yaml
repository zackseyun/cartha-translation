base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/027.yaml
  text: 'And this was the reason why he raised his hand against the king: Solomon had built the Millo and closed up the breach of the city of David his father[a][b].'
translation:
  language: sw
  text: 'Na hii ndiyo sababu iliyomfanya ainue mkono dhidi ya mfalme[a]: Sulemani alijenga Milo[b] na kuziba mwanya katika Mji wa Daudi, baba yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufafanua zaidi, “amwasi mfalme.” Nahau ya Kiebrania kwa tafsiri halisi ni “aliinua mkono dhidi ya mfalme.”
    reason: alternative_reading
  - marker: b
    text: “Milo” huenda ni jina la ngome au muundo wa matuta yaliyojazwa udongo huko Yerusalemu.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: sababu
  rationale: Ingawa neno hili kimsingi linaweza kumaanisha ‘jambo,’ hapa linaanzisha maelezo ya kitendo cha Yeroboamu; ‘sababu’ huwasilisha kazi hiyo kwa Kiswahili cha kawaida.
- source_word: הֵרִים יָד
  choice: amwinulie ... mkono
  rationale: Huhifadhi picha ya nahau ya Kiebrania, ‘kuinua mkono dhidi ya,’ bila kuifasiri moja kwa moja kuwa uasi; maana ya nahau imefafanuliwa katika tanbihi.
- source_word: בַּמֶּלֶךְ
  choice: mfalme
  rationale: Kihusishi katika muktadha huu humtaja mfalme kuwa mlengwa wa kitendo cha uhasama. Jina la Sulemani linafuata katika kishazi kinachofuata, kama katika Kiebrania.
- source_word: הַמִּלּוֹא
  choice: Milo
  rationale: Ni jina au istilahi mahususi ya muundo wa ujenzi huko Yerusalemu, na maana yake halisi haijulikani kwa uhakika; kwa hiyo limetoholewa badala ya kutafsiriwa kwa neno lenye uhakika usiostahili.
- source_word: סָגַר
  choice: kuziba
  rationale: Kitenzi humaanisha kufunga au kuziba; ‘kuziba’ ni cha kawaida na hudumisha taswira ya kufunga mwanya.
- source_word: פֶּרֶץ
  choice: mwanya
  rationale: Hurejelea sehemu iliyo wazi au iliyobomoka katika kinga za mji. ‘Mwanya’ ni wazi kwa wasomaji wa kawaida bila kuongeza neno ‘ukuta,’ ambalo halipo wazi katika maandishi.
- source_word: עִיר דָּוִד
  choice: Mji wa Daudi
  rationale: Hili ni jina la kawaida la ngome au eneo la Yerusalemu lililohusishwa na Daudi.
- source_word: אָבִיו
  choice: baba yake
  rationale: Humtaja Daudi kuwa baba ya Sulemani; koma husaidia kuondoa utata wa kisarufi katika Kiswahili.
theological_decisions:
- issue: Maana ya nahau הֵרִים יָד
  choice: Nahau imehifadhiwa katika matini kuu kama ‘amwinulie mfalme mkono.’
  alternative: ‘aliasi dhidi ya mfalme’
  rationale: Tafsiri ya ‘aliasi’ inaeleza maana inayokusudiwa lakini huondoa picha ya Kiebrania. Matini kuu inahifadhi picha hiyo, huku tanbihi ikitoa maana ya kiufafanuzi bila kulazimisha ufafanuzi ndani ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa kawaida kwa msomaji wa leo, huku nahau ya Kiebrania na kutokuwa na uhakika kuhusu Milo vikihifadhiwa kwa msaada wa tanbihi.
