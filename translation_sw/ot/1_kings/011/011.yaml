  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לִ/שְׁלֹמֹ֗ה יַ֚עַן אֲשֶׁ֣ר הָֽיְתָה זֹּ֣את עִמָּ֔/ךְ וְ/לֹ֤א שָׁמַ֨רְתָּ֙ בְּרִיתִ֣/י וְ/חֻקֹּתַ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי עָלֶ֑י/ךָ קָרֹ֨עַ אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מֵֽ/עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/הָ לְ/עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/011.yaml
  text: So Yahweh said to Solomon[a], “Because this has been with you, and you have not kept my covenant and my statutes that I commanded you, I will surely tear the kingdom away from you and give it to your servant.”
translation:
  language: sw
  text: Basi Yahwe akamwambia Sulemani, “Kwa kuwa jambo hili limekuwa pamoja nawe,[a] nawe hukushika agano langu wala masharti yangu niliyokuamuru, hakika nitaararua ufalme kutoka kwako na nitaupa mtumishi wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “Kwa kuwa jambo hili limekuwa pamoja nawe.” Kauli hii ya Kiebrania ni ya nahau; inaweza kurejelea mwenendo au hali iliyomkaa Sulemani.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa Kiswahili badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: יַעַן אֲשֶׁר
  choice: Kwa kuwa
  rationale: Kifungu hiki kinaonyesha sababu ya hukumu kwa lugha ya kawaida na yenye heshima.
- source_word: הָיְתָה זֹּאת עִמָּךְ
  choice: hivi ndivyo ulivyotenda
  rationale: Nahau ya Kiebrania ni yenye kubana na inaelekeza kwenye hali au mwenendo wa Sulemani uliotajwa katika muktadha; tafsiri hii inaeleweka kwa Kiswahili huku tanbihi ikihifadhi umbo la karibu zaidi na Kiebrania.
- source_word: שָׁמַרְתָּ
  choice: hukushika
  rationale: ‘Kushika’ hutumika kwa kawaida kuhusu kutii na kudumisha agano au maagizo.
- source_word: בְּרִיתִי
  choice: agano langu
  rationale: ‘Agano’ linahifadhi uzito wa kisheria na wa uhusiano wa neno la Kiebrania.
- source_word: חֻקֹּתַי
  choice: masharti yangu
  rationale: ‘Masharti’ yanaeleza kanuni zilizowekwa na Mungu bila kuyachanganya kabisa na neno la jumla ‘amri’.
- source_word: צִוִּיתִי עָלֶיךָ
  choice: niliyokuamuru
  rationale: Hii ni sentensi asilia ya Kiswahili yenye kuhifadhi nguvu ya agizo la Mungu.
- source_word: קָרֹעַ אֶקְרַע
  choice: hakika nitaurarua
  rationale: ‘Hakika’ linaonyesha msisitizo wa muundo wa Kiebrania, na ‘nitaurarua’ linahifadhi taswira ya kurarua.
- source_word: הַמַּמְלָכָה מֵעָלֶיךָ
  choice: ufalme na kuuondoa kwako
  rationale: Kauli hii inafanya taswira ya kurarua na maana ya kuondolewa kwa ufalme zieleweke kwa Kiswahili.
- source_word: לְעַבְדֶּךָ
  choice: mtumishi wako
  rationale: Katika muktadha huu neno linamtaja aliye chini ya mfalme, hivyo ‘mtumishi’ linafaa kuliko neno lenye maana mahsusi ya utumwa.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya nahau הָיְתָה זֹּאת עִמָּךְ
  choice: hivi ndivyo ulivyotenda
  alternative: jambo hili limekuwa pamoja nawe; hii imekuwa hali yako
  rationale: Muktadha unahusu mwenendo wa Sulemani uliosababisha hukumu. Tafsiri kuu inaweka maana hiyo kwa Kiswahili cha kawaida, na tanbihi inaonyesha ubayana mdogo uliomo katika muundo wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umefanywa kuwa wa kawaida kwa wasomaji wa leo, huku taswira ya ‘kurarua’ na msisitizo wa hukumu vikihifadhiwa.
