base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/019.yaml
  text: Hadad found great favor in Pharaoh’s eyes[a], and he gave him as a wife the sister of his own wife[b], the sister of Tahpenes the queen mother.
translation:
  language: sw
  text: Hadadi alipata kibali kikubwa sana machoni pa Farao, naye Farao akampa dada ya mke wa Farao[a] kuwa mke wa Hadadi, yaani dada wa Tahpenesi, yule mwanamke mkuu wa kifalme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiwakilishi katika Kiebrania cha “mke wake” kinaelekea kumrejelea Farao; uwezekano mdogo ni kwamba kinamrejelea Hadadi.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “mwanamke mkuu.” Hiki ni cheo cha mwanamke wa hadhi ya juu katika jumba la kifalme; kinaweza kumaanisha malkia, mama malkia, au mwanamke mkuu wa kifalme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינֵי ... מְאֹד
  choice: alipata kibali kikubwa sana machoni pa
  rationale: Inahifadhi nahau ya Kiebrania ya ‘kupata kibali machoni pa’ huku מְאֹד ikitolewa kwa ‘kikubwa sana’ katika Kiswahili cha kawaida.
- source_word: פַרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo cha mfalme wa Misri.
- source_word: וַיִּתֶּן לוֹ אִשָּׁה
  choice: akampa ... awe mke wake
  rationale: Muundo huu unaonyesha kwamba mwanamke alitolewa kwa Hadadi katika ndoa; tafsiri hii ni ya asili katika Kiswahili bila kuongeza maelezo yasiyokuwapo.
- source_word: אֶת אֲחוֹת אִשְׁתּוֹ
  choice: dada wa mke wake mwenyewe
  rationale: Inafuata uhusiano wa kifamilia uliotajwa wazi katika Kiebrania. Katika muktadha, kiwakilishi kinaelekea kumrejelea Farao, lakini tanbihi inahifadhi uwezekano mwingine wa kisarufi.
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: dada wa Tahpenesi
  rationale: Kirai hiki kinamtambulisha huyo mwanamke kuwa dada wa Tahpenesi.
- source_word: הַגְּבִירָה
  choice: yule mwanamke mkuu wa kifalme
  rationale: Neno hili ni cheo cha mwanamke mwenye hadhi ya juu katika jumba la kifalme. Tafsiri hii haibani maana kuwa lazima ‘mama malkia,’ jambo ambalo halijawekwa wazi katika mazingira haya ya Misri.
theological_decisions:
- issue: Kirejelewa cha kiwakilishi katika ‘dada wa mke wake’
  choice: 'Kiwakilishi kinaeleweka kumrejelea Farao: Farao alimpa Hadadi dada wa mke wa Farao.'
  alternative: 'Kiwakilishi kinaweza kueleweka kumrejelea Hadadi: Farao alimpa Hadadi dada wa mke wa Hadadi.'
  rationale: Mtiririko wa simulizi na kirai kinachofuata, ‘dada wa Tahpenesi,’ vinaunga mkono Farao kuwa kirejelewa, lakini muundo wa Kiebrania unaweza kubaki na utata fulani.
- issue: Maana ya הַגְּבִירָה
  choice: yule mwanamke mkuu wa kifalme
  alternative: mama malkia; malkia; bibi mkuu
  rationale: Cheo hicho humaanisha mwanamke mashuhuri wa kifalme na katika sehemu nyingine huweza kumaanisha mama malkia. Hata hivyo, hapa Tahpenesi ametajwa katika uhusiano na mke wa Farao, kwa hiyo tafsiri pana inalinda maana ya msingi bila kumwekea wadhifa maalumu usio hakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Machoni pa’ huhifadhi nahau ya chanzo kwa namna inayoeleweka, na ‘mwanamke mkuu wa kifalme’ huhifadhi kutokuwa na uhakika kuhusu wadhifa kamili wa Tahpenesi.
