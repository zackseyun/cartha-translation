  text: Then Ahijah took hold of the new cloak that was on him and tore it into twelve pieces[a].
translation:
  language: sw
  text: Ndipo Ahia akalishika lile vazi jipya alilokuwa amevaa[a], akalirarua vipande kumi na viwili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lililokuwa juu yake.” Kiebrania husema kihalisi, “lililokuwa juu yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: akalishika
  rationale: Kitenzi hiki kinaonyesha tendo la kulikamata au kulishika vazi. “Akalishika” ni Kiswahili cha kawaida na hakiongezi wazo la nguvu au ukatili lisilolazimishwa na muktadha.
- source_word: שַׂלְמָה
  choice: vazi
  rationale: Neno hili linamaanisha vazi, hasa vazi la nje. “Vazi” ni neno la kawaida, lenye hadhi, na halibainishi aina ya vazi kuliko ushahidi wa Kiebrania unavyoruhusu.
- source_word: הַחֲדָשָׁה
  choice: jipya
  rationale: Huhifadhi moja kwa moja sifa ya kwamba vazi lilikuwa jipya, jambo muhimu katika tendo hili la ishara.
- source_word: אֲשֶׁר עָלָיו
  choice: lililokuwa juu yake
  rationale: Hii inafuata usemi wa Kiebrania kwa ukaribu na kuhifadhi utata wa kiwakilishi kuhusu ni nani aliyekuwa na vazi hilo, bila kuamua kimya kimya kwamba alikuwa amelivaa.
- source_word: וַיִּקְרָעֶהָ
  choice: akalirarua
  rationale: “Ak alirarua” (akalirarua) huwakilisha tendo la kulipasua vazi kwa kulirarua na pia huonyesha kiambishi cha yambwa cha Kiebrania.
- source_word: שְׁנֵים עָשָׂר קְרָעִים
  choice: vipande kumi na viwili
  rationale: Usemi huu unaeleza matokeo ya kurarua kuwa vipande kumi na viwili; tafsiri hii ni ya kawaida na huhifadhi idadi pamoja na nguvu ya ishara.
theological_decisions:
- issue: Mhusika anayerejelewa na kiwakilishi katika אֲשֶׁר עָלָיו
  choice: lililokuwa juu yake
  alternative: alilokuwa amelivaa
  rationale: Kiwakilishi cha Kiebrania kinaweza kurejelea Ahiya au, kwa mujibu wa muktadha mpana, Yeroboamu. Tafsiri kuu haimtaji mhusika kwa jina wala kuamua kwamba vazi lilikuwa limevaliwa, hivyo inalinda utata wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa kawaida, wenye hadhi na unaoeleweka. Muundo wa “akalishika ... akalirarua” unaendeleza mfululizo wa matendo ya simulizi. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
