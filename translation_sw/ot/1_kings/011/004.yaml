base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/004.yaml
  text: And when Solomon was old[a], his wives turned his heart after other gods, and his heart was not fully devoted to Yahweh his God, like the heart of David his father.
translation:
  language: sw
  text: Ikawa, Sulemani alipokuwa mzee, wake zake waliuelekeza moyo wake kufuata miungu mingine; moyo wake haukuwa mkamilifu kwa Yahwe Mungu wake[a], kama moyo wa Daudi baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuwa amejitoa kikamilifu kwa Yahwe Mungu wake.” Kiebrania kinasema kihalisi kwamba moyo wake haukuwa “mzima” pamoja na Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת זִקְנַת שְׁלֹמֹה
  choice: Sulemani alipozeeka
  rationale: Huwasilisha maana ya wakati wa uzee wa Sulemani kwa Kiswahili cha kawaida na cha sasa, bila uzito usio wa lazima wa tafsiri ya neno kwa neno.
- source_word: נָשָׁיו
  choice: wake zake
  rationale: Ni wingi wenye kiambishi cha umilikaji, unaorejelea wazi wake wa Sulemani.
- source_word: הִטּוּ אֶת־לְבָבוֹ
  choice: waliugeuza moyo wake
  rationale: Huhifadhi taswira ya Kiebrania ya kusababisha moyo ugeuke, bila kuongeza moja kwa moja wazo lenye nguvu zaidi la ‘kupotosha.’
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: kufuata miungu mingine
  rationale: ‘Kufuata’ huwasilisha kwa kawaida maana ya אַחֲרֵי katika muktadha wa uaminifu wa kidini na kuacha kumfuata Yahwe.
- source_word: לְבָבוֹ
  choice: moyo wake
  rationale: ‘Moyo’ huhifadhi nahau ya kibiblia inayojumuisha nia, fikra, maamuzi na uaminifu wa ndani.
- source_word: שָׁלֵם
  choice: kamili
  rationale: ‘Kamili’ hudumisha wazo la moyo usiogawanyika na uaminifu kamili, huku tanbihi ikitoa ufafanuzi wa maana halisi ‘mzima.’
- source_word: עִם יְהוָה אֱלֹהָיו
  choice: kwa Yahwe Mungu wake
  rationale: ‘Kwa’ ni Kiswahili cha kawaida kinachoonyesha mwelekeo wa uaminifu wa moyo kwa Yahwe; ‘Yahwe’ huhifadhi jina la Mungu katika maandishi ya Kiebrania.
- source_word: כִּלְבַב דָּוִיד אָבִיו
  choice: kama ulivyokuwa moyo wa Daudi baba yake
  rationale: Huhifadhi ulinganisho wa moja kwa moja kati ya moyo wa Sulemani na moyo wa Daudi, badala ya kuulinganisha tu utu wao kwa jumla.
theological_decisions:
- issue: Maana ya שָׁלֵם kuhusu moyo wa Sulemani
  choice: moyo wake haukuwa kamili kwa Yahwe Mungu wake
  alternative: hakuwa amejitoa kikamilifu kwa Yahwe Mungu wake; moyo wake haukuwa mzima pamoja na Yahwe
  rationale: Uteuzi huu huhifadhi taswira ya moyo na wazo la uaminifu usiogawanyika bila kuufanya mstari utoe dai pana kuliko maandishi yenyewe. Tanbihi inaonyesha maana halisi na tafsiri ya kimawazo.
- issue: Kutajwa kwa אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  alternative: miungu ya kigeni
  rationale: Kiebrania kinasema ‘miungu mingine,’ si lazima ‘miungu ya kigeni’; tafsiri ya moja kwa moja huepuka kugeuza suala la ibada ya sanamu kuwa suala la asili ya kitaifa pekee.
- issue: Uwasilishaji wa יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: ‘Yahwe’ huhifadhi jina binafsi la Mungu lililo katika maandishi ya chanzo badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi, huku marudio ya ‘moyo’ yakihifadhiwa kwa sababu ni muhimu katika muundo na maana ya Kiebrania.
