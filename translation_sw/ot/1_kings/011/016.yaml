  text: For Joab and all Israel had remained there six months[b][a], until he had cut off every male in Edom.
translation:
  language: sw
  text: Kwa maana Yoabu na Israeli wote[a] walikaa huko kwa miezi sita, mpaka Yoabu alipowaangamiza[b] watu wote wa kiume katika Edomu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda “Israeli wote” hapa inamaanisha jeshi la Israeli lililokuwa pamoja na Yoabu, si lazima kila mtu katika taifa lote.
    reason: cultural_note
  - marker: b
    text: Au “aliwakata mbali” au “aliwaondoa kabisa.” Kitenzi cha Kiebrania maana yake halisi ni “kukata”; hapa ni nahau ya kuwaondoa watu wote wanaotajwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza maelezo yanayotoa sababu au usuli wa kauli iliyotangulia.
- source_word: שֵׁשֶׁת חֳדָשִׁים
  choice: kwa miezi sita
  rationale: Muundo huu wa Kiswahili huonyesha muda kwa kawaida na kwa uwazi.
- source_word: יָשַׁב
  choice: walikaa
  rationale: Katika muktadha huu wa kijeshi, kitenzi kinaonyesha kuendelea kuwapo mahali hapo, si lazima kufanya makao ya kudumu.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi cha mahali kinarejelea eneo lililotajwa katika muktadha uliotangulia.
- source_word: יוֹאָב
  choice: Yoabu
  rationale: Tahajia ya kawaida ya jina hili katika Kiswahili cha Biblia.
- source_word: וְכָל יִשְׂרָאֵל
  choice: na Israeli wote
  rationale: Inahifadhi usemi wa pamoja wa Kiebrania, huku tanbihi ikieleza kuwa huenda unamaanisha jeshi la Israeli lililokuwa pamoja na Yoabu.
- source_word: עַד
  choice: mpaka
  rationale: Inaonyesha kikomo cha muda cha kukaa kwao huko.
- source_word: הִכְרִית
  choice: alipokuwa amemwangamiza
  rationale: Hifili ya כרת hapa ina maana ya kuondoa au kuangamiza; tafsiri hii ni ya kawaida katika Kiswahili, huku tanbihi ikihifadhi taswira halisi ya ‘kukatilia mbali.’
- source_word: כָּל זָכָר
  choice: kila mwanamume
  rationale: זָכָר humaanisha mwenye jinsia ya kiume; katika habari hii ya vita, ‘kila mwanamume’ ni ya asili katika Kiswahili bila kubadili kuwa usemi wa jumla wa watu.
- source_word: בֶּאֱדוֹם
  choice: katika Edomu
  rationale: Kiambishi ב־ ni cha mahali hapa, kikionyesha kwamba tendo lilifanyika ndani ya Edomu.
