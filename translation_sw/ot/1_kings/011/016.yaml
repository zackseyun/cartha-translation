    reason: cultural_note
  - marker: b
    text: Au “aliwakata mbali” au “aliwaondoa kabisa.” Kitenzi cha Kiebrania maana yake halisi ni “kukata”; hapa ni nahau ya kuwaondoa watu wote wanaotajwa.
    reason: lexical_alternative
  revision_rationale: The revision corrects agreement and makes Yoabu, the singular agent indicated by the Hebrew verb, explicit. It uses an inclusive expression for 'every male' and updates the footnote so that its alternatives correspond naturally to the revised wording while preserving the Hebrew idiom's severity.
