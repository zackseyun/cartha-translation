base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/012.yaml
  text: Nevertheless[a], in your days I will not do it, for the sake of David your father[b]; from the hand of your son I will tear it away.
translation:
  language: sw
  text: Hata hivyo, katika siku zako sitafanya hivyo[a], kwa ajili ya Daudi baba yako; nitaupasua kutoka mkononi mwa mwanao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, ufalme uliotangazwa katika mstari uliotangulia.
    reason: cross_reference
  - marker: b
    text: Au, “kutoka katika mkono wa mwanao.” Nahau ya Kiebrania kwa maana halisi ni “kutoka mkononi mwa mwanao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Hapa neno hili linaweka zuio lenye maana ya kupinga au kurekebisha hukumu iliyotangulia; “Lakini” ni ya kawaida na ya asili katika Kiswahili.
- source_word: בְּיָמֶיךָ
  choice: katika siku zako
  rationale: Inahifadhi tamathali ya Kiebrania inayoeleweka kama wakati wa maisha au utawala wa Sulemani.
- source_word: לֹא אֶעֱשֶׂנָּה
  choice: sitafanya hivyo
  rationale: Kiambishi cha kike kinarejelea tendo lililotangazwa kabla la kuupasua ufalme; “hivyo” huhifadhi rejeo hilo bila kulifanya wazi kupita chanzo.
- source_word: לְמַעַן דָּוִד אָבִיךָ
  choice: kwa ajili ya Daudi baba yako
  rationale: “Kwa ajili ya” huonyesha kuwa hatua hiyo imeahirishwa kwa kumjali Daudi, bila kuifanya kuwa sababu ya kawaida tu.
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Inahifadhi nahau hai ya Kiebrania ya kuondoa kitu katika mamlaka au milki ya mtu.
- source_word: בִּנְךָ
  choice: mwanao
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya neno la uhusiano wa kifamilia.
- source_word: אֶקְרָעֶנָּה
  choice: nitaupasua
  rationale: Kitenzi kina maana ya kupasua au kurarua; kiambishi “u” kinarejelea ufalme unaotajwa katika muktadha uliotangulia.
theological_decisions:
- issue: Hali ya hukumu iliyoahirishwa juu ya Sulemani
  choice: Hukumu ya kuupasua ufalme haitatekelezwa wakati wa siku za Sulemani, bali ufalme utaondolewa katika mamlaka ya mwanawe.
  alternative: “Sitafanya hivyo wakati wa maisha yako ... nitaupasua kutoka mkononi mwa mwanao.”
  rationale: Kiebrania huacha kitu kinachorejelewa na “hivyo” na “nitaupasua” kieleweke kutokana na muktadha uliotangulia. Tafsiri inadumisha utegemezi huo wa muktadha na pia sababu iliyotolewa ya kumjali Daudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “katika siku zako” na nahau “kutoka mkononi mwa” zimehifadhiwa kwa sababu ni wazi na zinabeba taswira ya chanzo.
