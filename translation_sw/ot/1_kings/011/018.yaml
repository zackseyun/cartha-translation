base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/018.yaml
  text: They arose from Midian and came to Paran[a], and they took men with them from Paran, and they came to Egypt, to Pharaoh king of Egypt, and he gave him a house and assigned him food, and gave him land.
translation:
  language: sw
  text: Wakaondoka Midiani, wakafika Parani. Wakachukua wanaume kutoka Parani waandamane nao, kisha wakaenda Misri kwa Farao, mfalme wa Misri. Farao akampa nyumba, akaamuru apewe chakula[a], na akampa ardhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, kwa tafsiri ya neno kwa neno, “na mkate alimwambia”; maana inaelekea kuwa Farao aliamuru au alipanga apewe chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ מִמִּדְיָן
  choice: Wakaondoka Midiani
  rationale: Katika simulizi la safari, קום hutumiwa kwa maana ya kuondoka au kuanza safari. Kiswahili cha ‘wakaondoka’ ni cha kawaida na kinaonyesha mwendo kutoka Midiani.
- source_word: פָּארָן
  choice: Parani
  rationale: Jina la mahali limetoholewa kwa namna inayopatana na matumizi ya kawaida ya majina ya kibiblia katika Kiswahili.
- source_word: וַיִּקְחוּ אֲנָשִׁים עִמָּם מִפָּארָן
  choice: Wakachukua wanaume kutoka Parani waandamane nao
  rationale: אֲנָשִׁים hapa ni ‘wanaume.’ Neno ‘waandamane nao’ linaeleza kwa Kiswahili cha kawaida kwamba waliwaongeza katika kundi lao bila kubadili maana ya msingi.
- source_word: מִצְרַיִם
  choice: Misri
  rationale: Hili ndilo jina la kawaida la nchi hiyo katika Kiswahili.
- source_word: אֶל פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: kwa Farao, mfalme wa Misri
  rationale: Muundo huu unahifadhi cheo na ufafanuzi wa Kiebrania kwa Kiswahili cha asili.
- source_word: וַיִּתֶּן לוֹ בַיִת
  choice: Farao akampa nyumba
  rationale: Kutaja Farao tena kunaondoa utata wa kiwakilishi katika Kiswahili; בַּיִת imetafsiriwa moja kwa moja kuwa ‘nyumba.’
- source_word: וְלֶחֶם אָמַר לוֹ
  choice: akaamuru apewe chakula[a]
  rationale: Kifungu hicho ni kigumu kikitafsiriwa neno kwa neno, ‘na mkate alimwambia.’ Katika muktadha kinaelekea kumaanisha Farao aliagiza au alipanga apewe mahitaji ya chakula. ‘Chakula’ linaonyesha maana pana ya לֶחֶם kama riziki, si mkate tu.
- source_word: וְאֶרֶץ נָתַן לוֹ
  choice: na akampa ardhi
  rationale: אֶרֶץ hapa inaelekea kuwa eneo au mali ya ardhi aliyopewa, wala si taifa zima.
