base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/015.yaml
  text: And it happened[a], when David was in Edom, when Joab the commander of the army had gone up to bury the slain[b], that he struck down every male in Edom—
translation:
  language: sw
  text: Ikawa[a], Daudi alipokuwa katika Edomu[b], Yoabu, mkuu wa jeshi, alipopanda kuwazika waliouawa, akaua kila mwanamume katika Edomu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Basi ikawa.” Kiebrania kinatumia fomula ya kawaida ya masimulizi kutanguliza maelezo ya mazingira.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, kwa tafsiri ya karibu, husema, “Daudi alipokuwa [pamoja na] Edomu.” Katika muktadha huu usemi huo unahusu kuwapo kwa Daudi katika Edomu au shughuli yake ya kijeshi kuhusiana na Edomu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya masimulizi inayotanguliza maelezo ya mazingira; “Ikawa” huihifadhi kwa lugha ya Kiswahili yenye hadhi na iliyozoeleka katika simulizi za Biblia.
- source_word: בִּהְיוֹת דָּוִד אֶת אֱדוֹם
  choice: Daudi alipokuwa huko Edomu
  rationale: Muundo wa ב pamoja na kitenzi-jina cha היה ni kishazi cha wakati. אֶת אֱדוֹם si usemi wa kawaida wa kuandamana hapa; katika muktadha wa kijeshi unaelekea kumaanisha kuwapo kwa Daudi huko Edomu au shughuli yake dhidi ya Edomu. “Huko Edomu” ni ya asili bila kuamua zaidi ya maandishi.
- source_word: בַּעֲלוֹת יוֹאָב
  choice: Yoabu ... alipopanda
  rationale: Kitenzi-jina chenye ב kinaeleza wakati. “Alipopanda” huonyesha tendo lililotokea katika simulizi la wakati uliopita bila kulifanya kuwa tata.
- source_word: שַׂר הַצָּבָא
  choice: mkuu wa jeshi
  rationale: Ni cheo rasmi cha kijeshi; “mkuu wa jeshi” ni Kiswahili sanifu, cha sasa, na kinachoeleweka kwa urahisi.
- source_word: לְקַבֵּר
  choice: kwenda kuwazika
  rationale: ל inaonyesha kusudi la kupanda kwake. “Kwenda kuwazika” ni mtiririko wa kawaida wa Kiswahili na hudumisha kusudi hilo.
- source_word: הַחֲלָלִים
  choice: waliouawa
  rationale: Neno hilo humaanisha waliouawa, hasa vitani. “Waliouawa” huhifadhi maana ya kifo cha vurugu kuliko “wafu” kwa ujumla.
- source_word: וַיַּךְ
  choice: akaua
  rationale: Katika muktadha huu נכה ina maana ya kupiga hadi kuua. “Akaua” huwasilisha wazi matokeo ya kifo bila kutumia lugha ya kizamani; kiima kinachoendelea kwa kawaida ni Yoabu.
- source_word: כָּל זָכָר
  choice: kila mwanamume
  rationale: זָכָר hutaja jinsia ya kiume. “Kila mwanamume” hudumisha upeo mkali wa kauli hiyo kuliko usemi wa jumla kama “watu wote.”
- source_word: בֶּאֱדוֹם
  choice: katika Edomu
  rationale: ב hapa ni ya mahali. “Katika Edomu” huacha upeo kama ulivyo katika Kiebrania bila kuongeza wazo la “kote.”
theological_decisions:
- issue: Kuwasilisha taarifa ya ukatili wa kijeshi bila kuipunguza wala kuipanua
  choice: Kudumisha kauli ya moja kwa moja kwamba kila mwanamume katika Edomu aliuawa
  alternative: Kutafsiri kwa upole kuwa “aliwashinda Waedomu,” au kuongeza katika matini kwamba ulikuwa uangamizaji kamili
  rationale: Aya inaripoti ukatili mkubwa wa kijeshi. Tafsiri inapaswa kuhifadhi uzito wa Kiebrania bila tasfida, lakini pia bila kuongeza ufafanuzi usiotajwa na aya yenyewe.
- issue: Kiima cha וַיַּךְ
  choice: Kukiacha kitenzi kifuate kiima cha karibu, Yoabu, kwa kutumia “akaua”
  alternative: Kumtaja Daudi waziwazi kuwa ndiye aliyeua
  rationale: Kiebrania hakirudii jina la kiima katika kitenzi hiki. Mtiririko wa kisarufi unamwelekeza msomaji kwa Yoabu, lakini kutaja jina lake tena kungeondoa kabisa uwezekano wa mvutano wa kisintaksia uliopo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi ya kimaandiko bila kuwa cha kizamani. Alama ya mwisho ya mkato mrefu imehifadhiwa kwa sababu sentensi inaendelea katika aya inayofuata.
