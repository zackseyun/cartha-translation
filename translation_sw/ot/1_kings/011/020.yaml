base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/020.yaml
  text: And the sister of Tahpenes bore him Genubath his son[a], and Tahpenes weaned him within Pharaoh’s house[b]; and Genubath was in Pharaoh’s house among the sons of Pharaoh.
translation:
  language: sw
  text: Naye dada ya Tahpenesi akamzalia Hadadi mwana, Genubathi[a]. Tahpenesi akamwachisha kunyonya ndani ya nyumba ya Farao[b], na Genubathi akawa katika nyumba ya Farao miongoni mwa wana wa Farao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa mpangilio wa maneno wa Kiebrania, sentensi inaweza pia kusemwa, “Dada ya Tahpenesi alimzalia Hadadi mwana, Genubathi.” Maana haibadiliki.
    reason: lexical_alternative
  - marker: b
    text: “Akamwachisha kunyonya” hurejelea hatua ambayo mtoto huacha kunyonya maziwa.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶד לּוֹ
  choice: akamzalia
  rationale: Muundo wa ילד pamoja na לּוֹ unaonyesha kwamba dada yake Tahpenesi alimzalia Hadadi mtoto; ‘akamzalia’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: dada yake Tahpenesi
  rationale: Huu ni uhusiano wa wazi wa umilikaji; ‘dada yake Tahpenesi’ ni wa asili na unaeleweka kwa urahisi.
- source_word: גְּנֻבַת
  choice: Genubathi
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Kiambishi cha Kiebrania kinamtambulisha Genubathi kuwa mwana wa Hadadi; ‘mwanawe’ huhifadhi uhusiano huo waziwazi.
- source_word: וַתִּגְמְלֵהוּ
  choice: akamwachisha kunyonya
  rationale: Katika muktadha huu גמל humaanisha kumfikisha mtoto hatua ya kuacha kunyonya; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: בְּתוֹךְ בֵּית פַּרְעֹה
  choice: ndani ya nyumba ya Farao
  rationale: Usemi huu huhifadhi taswira ya mahali na pia unaweza kujumuisha kaya au makao ya kifalme.
- source_word: וַיְהִי
  choice: akaishi
  rationale: Katika muhtasari huu wa masimulizi, kitenzi kinaonyesha kuwapo au kukaa kwa Genubathi katika nyumba ya Farao; ‘akaishi’ hutoa maana hiyo kwa Kiswahili cha asili bila kudai zaidi ya muktadha.
- source_word: בֵּית פַּרְעֹה
  choice: nyumba ya Farao
  rationale: ‘Nyumba’ huhifadhi upana wa neno la Kiebrania, ambalo linaweza kumaanisha makao ya kifalme au kaya.
- source_word: בְּתוֹךְ בְּנֵי פַרְעֹה
  choice: pamoja na wana wa Farao
  rationale: בני ni ‘wana’; ‘pamoja na’ huwasilisha kwa kawaida kwamba Genubathi alikuwapo miongoni mwao.
