base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/017.yaml
  text: Hadad fled to Egypt[a], he and some Edomite men from among his father's servants with him[b]; and Hadad was a young boy.
translation:
  language: sw
  text: Hadadi akakimbilia Misri[a], yeye pamoja na baadhi ya wanaume Waedomu waliokuwa miongoni mwa watumishi wa baba yake; naye Hadadi alikuwa mvulana mdogo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya neno kwa neno zaidi, “kuja Misri.” Mara nyingi Kiebrania hutumia “kuja” mahali ambapo Kiswahili husema “kwenda” au hutaja tu mahali pa kuelekea.
    reason: lexical_alternative
  - marker: b
    text: Au “mvulana mchanga sana.” Kirai cha Kiebrania kinakazia kwamba Hadadi alikuwa bado na umri mdogo sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: akakimbilia
  rationale: Kitenzi ברח katika qal humaanisha kukimbia au kutoroka. ‘Akakimbilia’ kinaonyesha kwa kawaida kwamba Hadadi alikimbia ili kupata usalama mahali palipotajwa.
- source_word: אֲדַד
  choice: Hadadi
  rationale: Jina la mtu limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili.
- source_word: הוּא וַאֲנָשִׁים אֲדֹמִיִּים
  choice: akiwa pamoja na baadhi ya wanaume Waedomu
  rationale: Kiwakilishi cha msisitizo na kundi lililoandamana naye vimeunganishwa kwa sentensi ya kawaida ya Kiswahili. ‘Baadhi ya’ linaonyesha kuwa kundi halijatajwa kuwa Waedomu wote.
- source_word: מֵעַבְדֵי אָבִיו
  choice: waliokuwa miongoni mwa watumishi wa baba yake
  rationale: ‘Miongoni mwa’ linaakisi maana ya sehemu ya kundi iliyo katika מִן, huku ‘watumishi’ likihifadhi maana pana ya עֶבֶד katika nyumba ya kifalme.
- source_word: אִתּוֹ
  choice: pamoja na
  rationale: Kirai hiki kinaonyesha kwamba wanaume hao waliandamana na Hadadi.
- source_word: לָבוֹא מִצְרָיִם
  choice: Misri
  rationale: Baada ya ‘akakimbilia,’ Kiswahili hutaja mahali pa kwenda moja kwa moja; maana ya kufika au kwenda Misri imehifadhiwa bila tafsiri ngumu ya neno kwa neno.
- source_word: נַעַר קָטָן
  choice: mvulana mdogo
  rationale: נַעַר humaanisha mvulana au kijana, na קָטָן inasisitiza umri wake mdogo. ‘Mvulana mdogo’ ni ya kawaida na inahifadhi msisitizo huo.
