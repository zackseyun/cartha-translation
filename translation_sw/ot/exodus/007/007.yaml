  text: Moses was eighty years old[a], and Aaron was eighty-three years old, when they spoke to Pharaoh.
translation:
  language: sw
  text: Musa alikuwa na umri wa miaka themanini, na Haruni alikuwa na umri wa miaka themanini na mitatu waliposema na Farao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן ... שָׁנָה
  choice: alikuwa na umri wa miaka ...
  rationale: Nahau ya Kiebrania kwa umri hutumia kihalisi ‘mwana wa miaka ...’; Kiswahili sanifu hueleza umri kwa kawaida kwa ‘alikuwa na umri wa miaka ...’.
- source_word: שְׁמֹנִים שָׁנָה
  choice: miaka themanini
  rationale: Hii ndiyo namna ya kawaida na wazi ya kutaja umri wa miaka themanini katika Kiswahili.
- source_word: שָׁלֹשׁ וּשְׁמֹנִים שָׁנָה
  choice: miaka themanini na mitatu
  rationale: Kiebrania kina mpangilio ‘mitatu na themanini’; Kiswahili cha sasa hutumia kwa kawaida ‘themanini na mitatu’.
- source_word: בְּדַבְּרָם
  choice: waliposema
  rationale: 'Kiambishi ב pamoja na kitenzi-jina na kiambishi cha nafsi kina maana ya wakati hapa: ‘waliposema’.'
- source_word: אֶל
  choice: na
  rationale: Katika Kiswahili, ‘sema na mtu’ ni usemi wa kawaida wa kueleza maneno yaliyoelekezwa kwa mtu; ‘kwa’ pia ingewezekana lakini si ya asili sana katika sentensi hii.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo hiki cha kifalme.
- source_word: וּ
  choice: na
  rationale: Waw inaunganisha Musa na Haruni ndani ya taarifa moja; Kiswahili hutumia ‘na’ kwa uhusiano huu bila kuhitaji kiunganishi cha mwanzo.
