base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/011.yaml
  text: Then Pharaoh also called for the wise men and the sorcerers[a], and they too, the magicians of Egypt, did the same by their enchantments.
translation:
  language: sw
  text: Ndipo Farao pia akawaita wenye hekima na wachawi, nao pia wataalamu wa uchawi wa Misri wakafanya vivyo hivyo kwa uchawi wao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mbinu zao za siri.” Neno la Kiebrania linaweza kumaanisha sanaa za kifumbo au uchawi; maana yake mahususi hapa si hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: Katika muktadha huu קרא ina maana ya kuwaita watu waje mbele yake; ‘akawaita’ ni ya kawaida na inaonyesha tendo la Farao la kuwaagiza waje.
- source_word: גַּם
  choice: pia
  rationale: Neno hili linaonyesha kwamba Farao naye alichukua hatua kwa kuitikia ishara iliyotangulia.
- source_word: חֲכָמִים
  choice: wenye hekima
  rationale: Hurejelea wataalamu au watu wasomi wa ikulu; ‘wenye hekima’ ni tafsiri wazi na inayotambulika bila kuongeza cheo kisichotajwa.
- source_word: מְכַשְּׁפִים
  choice: wachawi
  rationale: Neno hili humaanisha watendaji wa uchawi na linatofautishwa na חַרְטֻמִּים inayofuata.
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: wakafanya vivyo hivyo
  rationale: Muungano wa עשה na כֵּן unaeleza kwamba waliiga tendo lililotangulia; ‘wakafanya vivyo hivyo’ ni Kiswahili cha asili.
- source_word: גַם הֵם
  choice: nao pia
  rationale: Huhifadhi msisitizo kwamba wataalamu wa Farao nao waliiga ishara hiyo.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: waganga wa Misri
  rationale: Katika simulizi hili neno hurejelea wataalamu wa kidini na kimila wa ikulu ya Misri. ‘Waganga wa Misri’ linawatofautisha na ‘wachawi’ waliotajwa awali na linaeleweka katika Kiswahili cha Afrika Mashariki, ingawa maana mahususi ya cheo hicho cha Kimisri si hakika.
- source_word: בְּלַהֲטֵיהֶם
  choice: kwa uchawi wao
  rationale: Kirai kinaonyesha njia waliyoitumia kuiga ishara. ‘Kwa uchawi wao’ ni cha kawaida na huhifadhi wazo la mbinu za kifumbo bila kueleza zilifanya kazi kwa namna gani.
theological_decisions:
- issue: Asili ya uwezo wa wataalamu wa Misri
  choice: Kusema tu kwamba walifanya vivyo hivyo ‘kwa uchawi wao’
  alternative: Kueleza kuwa ilikuwa nguvu halisi ya pepo au ujanja na udanganyifu tu
  rationale: Kiebrania kinaeleza tendo na njia iliyodaiwa kutumiwa, lakini hakifafanui kama lilikuwa tukio la nguvu zisizo za kawaida, udanganyifu, au aina nyingine ya ufundi. Tafsiri haipaswi kuamua jambo ambalo mstari huu hauamui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Muundo ‘nao pia, waganga wa Misri’ umehifadhi ufafanuzi wa kundi hilo na msisitizo wa Kiebrania. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
