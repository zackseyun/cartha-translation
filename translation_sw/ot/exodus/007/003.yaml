  yaml_path: translation/ot/exodus/007/003.yaml
  text: But I will harden Pharaoh’s heart[a], and I will multiply my signs and my wonders in the land of Egypt.
translation:
  language: sw
  text: Lakini mimi nitaufanya moyo wa Farao kuwa mgumu[a], nami nitazidisha ishara zangu na maajabu yangu katika nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitaufanya moyo wa Farao kuwa mkaidi.” Kitenzi cha Kiebrania kinaonyesha moja kwa moja tendo la kusababisha moyo wake uwe mgumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi kilichotajwa wazi kinaonyesha mkazo au utofautishaji katika muktadha; “Lakini mimi” ni ya asili katika Kiswahili na huhifadhi nguvu hiyo.
- source_word: אַקְשֶׁה
  choice: nitaufanya ... kuwa mgumu
  rationale: Hiphil ya קשׁה ina maana ya kusababisha kuwa mgumu. Muundo huu wa Kiswahili unaonyesha wazi tendo la kusababisha bila kuligeuza kuwa ruhusa tu.
- source_word: לֵב פַּרְעֹה
  choice: moyo wa Farao
  rationale: Huu ni muundo wa kawaida wa umilikaji katika Kiswahili. “Moyo” huhifadhi taswira ya Kiebrania inayoweza kujumuisha nia na fikira za ndani.
- source_word: וְהִרְבֵּיתִי
  choice: nami nitazidisha
  rationale: Kitenzi katika mfuatano huu kina maana ya wakati ujao. “Nitazidisha” ni cha kawaida na hudumisha wazo la kufanya ishara na maajabu yawe mengi.
- source_word: אֹתֹתַי
  choice: ishara zangu
  rationale: אוֹת kwa kawaida ni ishara; neno hili linaeleweka na huhifadhi maana ya matendo yanayoonyesha nguvu na ujumbe wa Mungu.
- source_word: מוֹפְתַי
  choice: maajabu yangu
  rationale: מוֹפֵת inaweza kuwa ajabu au ishara ya ajabu. “Maajabu” huambatana kwa kawaida na “ishara” na hakubani maana kuwa dalili ya kinabii pekee.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Tafsiri hii inadumisha neno la Kiebrania “nchi” huku ikibaki ya asili na yenye hadhi katika Kiswahili.
theological_decisions:
- issue: Tendo la Mungu katika kuufanya moyo wa Farao kuwa mgumu
  choice: nitaufanya moyo wa Farao kuwa mgumu
  alternative: nitauruhusu moyo wa Farao uwe mgumu
  rationale: Hiphil ya Kiebrania inaeleza moja kwa moja kwamba Mungu ndiye anayesababisha ugumu huo. Tafsiri hailegezi jambo hili kuwa ruhusa tu, hivyo inadumisha mvutano wa kitheolojia wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Taswira ya “moyo” imehifadhiwa, na uhusiano wa moja kwa moja wa kisababishi haujafichwa.
