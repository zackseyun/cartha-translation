base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/010.yaml
  text: So Moses and Aaron went in to Pharaoh[a], and they did so, just as Yahweh had commanded. Then Aaron threw down his staff before Pharaoh and before his servants, and it became a serpent.
translation:
  language: sw
  text: Basi Musa na Aroni wakaingia kwa Farao, wakafanya kama Yahwe alivyowaamuru. Kisha Aroni akaitupa fimbo yake mbele ya Farao na mbele ya watumishi wake, nayo ikawa nyoka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania tannin linaweza pia kumaanisha kiumbe kama joka au mnyama mkubwa wa kutambaa; hapa huenda linamaanisha nyoka katika ishara iliyofanywa mbele ya Farao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: wakaingia kwa Farao
  rationale: Kitenzi cha umoja kinachotangulia kiima ambatani ‘Musa na Aroni’ kinafanya kazi kwa maana ya pamoja. ‘Wakaingia kwa Farao’ huonyesha kwenda mahali Farao alipokuwapo kwa Kiswahili cha kawaida.
- source_word: וַיַּעַשׂוּ כֵן
  choice: wakafanya kama ...
  rationale: Kirai hiki cha Kiebrania humaanisha kutekeleza agizo; muundo huu ni wa asili katika Kiswahili na unaunganishwa na kishazi kinachofuata.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: kama ... alivyokuwa ameamuru
  rationale: Huonyesha kwamba walitenda sawasawa na agizo lililotolewa kabla ya tukio hili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu linahifadhiwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּשְׁלֵךְ
  choice: akaitupa ... chini
  rationale: Huwasilisha tendo la kuitupa fimbo chini waziwazi katika ishara hiyo.
- source_word: מַטֵּהוּ
  choice: fimbo yake
  rationale: ‘Fimbo’ ni neno la sasa na la kawaida kwa kifaa alichobeba Aroni.
- source_word: לִפְנֵי ... וְלִפְנֵי
  choice: mbele ya ... na mbele ya
  rationale: Urudiaji umehifadhiwa ili kudumisha mkazo wa Kiebrania kwamba ishara ilifanywa hadharani mbele ya pande zote mbili.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Huhifadhi maana ya msingi ya neno huku ikifaa pia kwa watu waliomhudumia Farao katika mazingira ya kifalme.
- source_word: וַיְהִי לְתַנִּין
  choice: nayo ikawa nyoka mkubwa
  rationale: תַנִּין lina wigo mpana kuliko neno la kawaida la ‘nyoka’ na linaweza kumaanisha mnyama mkubwa wa kutambaa au kiumbe kama joka. ‘Nyoka mkubwa’ linafaa kwa ishara hii bila kufuta kabisa uzito huo wa kileksika.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia Tetragramatoni kama jina binafsi; umbo la kawaida la Kiswahili ‘Yahwe’ linahifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Uwasilishaji wa תַנִּין
  choice: nyoka mkubwa
  alternative: joka au mnyama mkubwa wa kutambaa
  rationale: Katika muktadha wa fimbo ya Aroni ishara inaeleweka vizuri kama nyoka, lakini kivumishi ‘mkubwa’ na tanbihi huhifadhi wigo mpana na mvutano wa neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa kawaida, urudiaji wa ‘mbele ya’ umehifadhiwa, na jina ‘Yahwe’ limetumiwa kwa umbo linalotambulika katika Kiswahili.
