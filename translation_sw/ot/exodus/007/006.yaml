  text: So Moses and Aaron did just as Yahweh had commanded them[a]; so they did.
translation:
  language: sw
  text: Basi Musa na Haruni wakafanya kama vile Yahwe alivyowaamuru[a]; ndivyo walivyofanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: wakafanya
  rationale: Kitenzi עשה kina maana pana ya ‘kufanya/kuunda’; katika muktadha wa kutii amri, ‘wakafanya’ ni cha kawaida na kinadumisha urudiaji wa kitenzi mwishoni mwa aya.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Musa na Aroni
  rationale: Majina ya kawaida katika matumizi ya Biblia ya Kiswahili, yakiwa yameunganishwa kwa ‘na’ kama katika Kiebrania.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Huonyesha ulinganifu kati ya amri na tendo lao; ‘kama vile’ ni ya asili na inaonyesha kuwa walitenda kulingana na walivyoagizwa.
- source_word: צִוָּה
  choice: alivyowaamuru
  rationale: צוה humaanisha kutoa amri. Muundo huu unaonyesha kwamba Yahwe aliwaamuru Musa na Aroni kabla ya wao kutenda.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uhawilishaji wa jina la Mungu YHWH unaotumika badala ya kulibadili kuwa cheo kama ‘BWANA’.
- source_word: אֹתָם
  choice: -wa-
  rationale: Kiambishi cha yambwa katika ‘aliwaamuru’ kinawarejelea Musa na Aroni kwa Kiswahili cha kawaida.
- source_word: כֵּן עָשׂוּ
  choice: ndivyo walivyofanya
  rationale: Huhifadhi msisitizo na urudiaji wa Kiebrania huku ikisikika kwa ufasaha katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina maalumu la Mungu, YHWH. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadili kuwa cheo, huku tanbihi ikitaja desturi nyingine ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unahifadhi urudiaji wa Kiebrania kwa msisitizo bila kuwa mzito au usio wa kawaida.
