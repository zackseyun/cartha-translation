  text: וְ/אָמַרְתָּ֣ אֵלָ֗י/ו יְהוָ֞ה אֱלֹהֵ֤י הָ/עִבְרִים֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יַֽעַבְדֻ֖/נִי בַּ/מִּדְבָּ֑ר וְ/הִנֵּ֥ה לֹא שָׁמַ֖עְתָּ עַד כֹּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/016.yaml
  text: 'And you shall say to him[a], ‘Yahweh, the God of the Hebrews, has sent me to you, saying: Let my people go, so that they may serve me in the wilderness. But behold, until now you have not listened.’'
translation:
  language: sw
  text: Utamwambia, “Yahweh, Mungu wa Waebrania, amenituma kwako akisema, ‘Waache watu wangu waende, ili wanitumikie[a] jangwani.’ Lakini tazama, mpaka sasa hujasikiliza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waniabudu jangwani.” Kitenzi cha Kiebrania kinaweza kumaanisha kutumikia kwa ujumla au kuabudu kwa maana ya kidini.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Mungu wa Waebrania
  rationale: Muundo huu unamtambulisha Yahweh kwa uhusiano wake na Waebrania; “Waebrania” linahifadhi jina la kikabila עִבְרִים badala ya kulainisha kuwa “Waisraeli.”
- source_word: שְׁלָחַנִי
  choice: amenituma
  rationale: Kauli hii inaonyesha kutumwa kulikokamilika ambako bado kuna umuhimu wakati wa ujumbe.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Waache watu wangu waende
  rationale: Amri hii inadai waachiliwe waende; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: וְיַעַבְדֻנִי
  choice: ili wanitumikie
  rationale: Kitenzi kinaonyesha kusudi na kinaweza kumaanisha huduma kwa ujumla, pamoja na ibada; “wanitumikie” kinahifadhi upana huo.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: Neno מִדְבָּר humaanisha eneo la nyika au jangwa; “jangwani” ni tafsiri ya kawaida na ya asili katika muktadha huu.
- source_word: וְהִנֵּה
  choice: Lakini tazama
  rationale: הִנֵּה huvuta fikira kwenye hali iliyopo, huku muktadha ukionyesha tofauti kati ya agizo na kutolisikiliza kwa Farao.
- source_word: לֹא שָׁמַעְתָּ
  choice: hujasikiliza
  rationale: שׁמע inaweza kumaanisha kusikia, kusikiliza, au kutii. “Hujasikiliza” huhifadhi maana bila kuifafanua kupita kiasi kuwa kutotii.
- source_word: עַד כֹּה
  choice: mpaka sasa
  rationale: Huu ni usemi wa wakati unaomaanisha hadi wakati huu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini inatumia jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וְיַעַבְדֻנִי katika dai la Kutoka
  choice: wanitumikie
  alternative: waniabudu
  rationale: עבד inaweza kumaanisha huduma kwa upana, ikijumuisha ibada. Tafsiri kuu inahifadhi upana huo, na maana ya ibada imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya “wanitumikie,” neno ambalo tanbihi inalifafanua.
