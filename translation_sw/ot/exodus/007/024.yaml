  text: And all the Egyptians dug around the Nile for water to drink[a], because they could not drink from the water of the Nile.
translation:
  language: sw
  text: Wamisri wote wakachimba kandokando ya Mto Naili[a] ili kupata maji ya kunywa, kwa sababu hawakuweza kunywa maji ya Mto Naili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mto” (ye’or); katika Kitabu cha Kutoka neno hili humaanisha hasa Mto Naili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: wakachimba
  rationale: Kitenzi חפר humaanisha kuchimba. Tafsiri hii ni ya moja kwa moja na haiongezi wazo la visima, ambalo halitajwi wazi katika Kiebrania.
- source_word: כָל מִצְרַיִם
  choice: Wamisri wote
  rationale: Ingawa muundo wa Kiebrania unaweza kutafsiriwa kihalisi kuwa ‘Misri yote,’ katika muktadha unawahusu watu wa Misri kwa ujumla.
- source_word: סְבִיבֹת הַיְאֹר
  choice: kuzunguka Mto Naili
  rationale: סְבִיבֹת inaonyesha eneo linalouzunguka mto; ‘kuzunguka’ ni Kiswahili cha kawaida na wazi.
- source_word: הַיְאֹר
  choice: Mto Naili
  rationale: Katika simulizi la Kutoka, יְאֹר humrejelea hasa Naili. Kutaja ‘Mto Naili’ humwezesha msomaji wa kisasa kutambua mto unaokusudiwa.
- source_word: מַיִם לִשְׁתּוֹת
  choice: ili wapate maji ya kunywa
  rationale: Muundo huu unaonyesha kusudi la kuchimba. ‘Ili wapate’ huifanya sentensi iwe ya asili katika Kiswahili bila kudai kwamba Kiebrania kimetaja visima.
- source_word: כִּי לֹא יָכְלוּ
  choice: kwa sababu hawakuweza
  rationale: כִּי hapa inatoa sababu ya kuchimba; ‘kwa sababu’ hudhihirisha uhusiano huo wazi.
- source_word: לִשְׁתֹּת מִמֵּימֵי הַיְאֹר
  choice: kunywa maji ya Mto Naili
  rationale: Kihusishi מִן kinaweza kuonyesha chanzo, lakini katika Kiswahili ‘kunywa maji ya Mto Naili’ ni wazi na cha kawaida, huku kikihifadhi maana kwamba maji hayo yalitoka Naili.
