base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/017.yaml
  text: 'Thus says Yahweh: By this you will know that I am Yahweh: behold[a], I am striking the water that is in the Nile with the staff that is in my hand, and it will be turned to blood.'
translation:
  language: sw
  text: 'Yahweh asema hivi: “Kwa hili utajua kwamba mimi ni Yahweh: Tazama, ninayapiga maji yaliyo katika Mto Nile kwa fimbo iliyo mkononi mwangu, nayo yatageuka kuwa damu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Huhifadhi kauli rasmi ya mjumbe wa kinabii kwa Kiswahili cha kawaida na chenye hadhi, huku jina la Mungu likiwekwa wazi.
- source_word: בְּזֹאת תֵּדַע
  choice: Kwa jambo hili utajua
  rationale: Kiambishi בְּ kina maana ya chombo au njia hapa; pigo hili ndilo litakalomwezesha Farao kujua.
- source_word: כִּי אֲנִי יְהוָה
  choice: kwamba mimi ni Yahweh
  rationale: Huhifadhi msisitizo wa kiwakilishi אָנִי na kujitambulisha kwa Mungu kwa jina lake mwenyewe.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni alama ya kuvuta fikira na kutangaza kwa uzito; “Tazama” ni ya sasa, yenye hadhi, na inaeleweka kwa urahisi.
- source_word: אָנֹכִי מַכֶּה
  choice: ninayapiga
  rationale: Kitenzi kishirikishi pamoja na kiwakilishi hutoa tendo linalokaribia na kuwasilishwa kwa uhai; wakati wa sasa wa Kiswahili unahifadhi athari hiyo.
- source_word: בַּמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: kwa fimbo iliyo mkononi mwangu
  rationale: “Fimbo” ni neno la kawaida na sahihi kwa מַטֶּה katika muktadha huu; kishazi cha uhusiano kinahifadhi msisitizo wa chombo kilicho mkononi.
- source_word: עַל הַמַּיִם אֲשֶׁר בַּיְאֹר
  choice: maji yaliyo katika Mto Nile
  rationale: “Maji” huhifadhi wingi wa Kiebrania, na יְאֹר katika simulizi hili humaanisha hasa Mto Nile.
- source_word: וְנֶהֶפְכוּ לְדָם
  choice: nayo yatageuka kuwa damu
  rationale: Huhifadhi upatanisho wa wingi wa “maji” na lugha ya mabadiliko ya hali bila kulazimisha kisababishi ambacho umbo la Kiebrania halisemi wazi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia Tetragramatoni kama jina binafsi la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Nani anayetekeleza tendo la kupiga
  choice: Kauli ya moja kwa moja ya Mungu, “ninayapiga,” huku fimbo ikiwa mkononi mwa msemaji
  alternative: Musa ndiye anayepiga kwa niaba ya Mungu
  rationale: Sarufi ya mstari huu inamweka msemaji wa kimungu katika nafsi ya kwanza. Tafsiri haiondoi mvutano wa kisimulizi unaotokana na Mungu kusema kuwa fimbo iko mkononi mwake ingawa Musa ndiye mjumbe anayeshughulika na Farao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja bila kuwa mgumu; wingi wa “maji” umehifadhiwa kwa kuwa ni wa kawaida katika Kiswahili, hivyo hakuna tanbihi inayohitajika.
