  text: And seven days were fulfilled after Yahweh struck the Nile[a][b].
translation:
  language: sw
  text: Siku saba zikakamilika baada ya Yahwe kuupiga Mto Nile[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Siku saba zikapita baada ya Yahwe kuupiga Mto Nile.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mto”; katika muktadha huu humaanisha Nile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵא
  choice: zikatimia
  rationale: Kitenzi hiki katika Nifali kinaonyesha kwamba kipindi kilifikia ukamilifu wake. “Zikatimia” huhifadhi maana hiyo kwa Kiswahili cha kawaida; “zikapita” ni tafsiri ya kimazoea zaidi.
- source_word: שִׁבְעַת יָמִים
  choice: siku saba
  rationale: Ni muundo wa kawaida wa namba na nomino unaotaja kipindi cha siku saba.
- source_word: אַחֲרֵי
  choice: baada ya
  rationale: Ni kihusishi cha wakati kinachoonyesha kwamba jambo moja lilifuata jingine.
- source_word: הַכּוֹת
  choice: kuupiga
  rationale: Jina-kitenzi la נכה baada ya אַחֲרֵי lina maana ya “baada ya kupiga.” Muundo wa Kiswahili “baada ya Yahwe kuupiga” ni wa asili na hudumisha tendo lenye nguvu katika muktadha wa pigo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: הַיְאֹר
  choice: Mto Nile
  rationale: Katika muktadha wa Kutoka, neno hili linarejelea hasa Nile. “Mto Nile” humtambulisha wazi kwa msomaji wa Kiswahili, ingawa Kiebrania kinaweza kutafsiriwa kwa ujumla kuwa “mto.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandiko ya Kiebrania yanatumia jina binafsi la Mungu hapa. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “zikatimia siku saba” unahifadhi taswira ya kipindi kufikia ukamilifu wake bila kuwa wa kizamani.
