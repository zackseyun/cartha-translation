    issue: Mpangilio wa "akaitupa chini fimbo yake" hauna unyofu wa kisarufi na kimtindo.
    rationale: Kuweka yambwa wazi kabla ya kiambishi cha yambwa katika kitenzi kunaweza kusikika kusitasita. "Akatupa fimbo yake chini" ni ya asili zaidi.
  - severity: low
    issue: Tanbihi ina hitilafu ya upatanisho katika "kiumbe mwenye umbo."
    rationale: Kwa ngeli ya KI-VI, umbo linalofaa ni "kiumbe chenye umbo"; hata hivyo tanbihi inaweza kurahisishwa ili iwe sahihi na wazi.
  revised_text: Kila mmoja akatupa fimbo yake chini,[a] nazo zikawa nyoka; lakini fimbo ya Aroni ikazimeza fimbo zao.
