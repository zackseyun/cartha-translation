translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “Kila mmoja ... yake” unahifadhi maana ya kugawa tendo kwa kila mtu, na “lakini” inaonyesha wazi tofauti kati ya ishara zao na ushindi wa fimbo ya Aroni.
