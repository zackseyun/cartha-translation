  text: And each man threw down his staff[a], and they became serpents; but Aaron’s staff swallowed up their staffs.
translation:
  language: sw
  text: Kila mmoja akatupa fimbo yake chini,[a] nazo zikawa nyoka; lakini fimbo ya Aroni ikazimeza fimbo zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “majoka” au “viumbe wakubwa wa kutambaa.” Neno la Kiebrania tannin linaweza kurejelea kiumbe wa aina ya nyoka kwa maana pana zaidi kuliko neno la kawaida la “nyoka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלִיכוּ
  choice: akaitupa chini
  rationale: Kitenzi שׁלך hapa kinaeleza kutupa kitu chini; usemi huu ni wa kawaida katika Kiswahili na unaonyesha tendo la kuelekeza fimbo chini.
- source_word: אִישׁ
  choice: Kila mmoja
  rationale: אִישׁ imetumiwa kwa maana ya kugawa tendo kwa watu mmoja mmoja. “Kila mmoja” ni Kiswahili cha kawaida na hakiongezi utambulisho usiotajwa wazi katika mstari huu.
- source_word: מַטֵּהוּ / מַטֵּה / מַטֹּתָם
  choice: fimbo yake / fimbo / fimbo zao
  rationale: מַטֶּה inaweza kuwa fimbo au gongo. “Fimbo” inafaa kwa kifaa kinachobebwa katika simulizi na huhifadhi tofauti za umoja na wingi kwa njia ya kisarufi ya Kiswahili.
- source_word: וַיִּהְיוּ
  choice: zikawa
  rationale: היה hapa inaonyesha badiliko au matokeo. “Zikawa” ni tafsiri fupi na ya asili inayowasilisha badiliko hilo.
- source_word: לְתַנִּינִם
  choice: viumbe kama nyoka
  rationale: תַּנִּין ina maana pana kuliko neno la kawaida la Kiebrania kwa nyoka, na inaweza kumaanisha kiumbe mkubwa wa kutambaa, joka, au kiumbe wa majini kulingana na muktadha. “Viumbe kama nyoka” huhifadhi sura ya kinyoka bila kuifanya maana iwe finyu kupita kiasi.
- source_word: וַיִּבְלַע
  choice: ikazimeza
  rationale: בלע humaanisha kumeza au kuteketeza kwa kumeza. “Ikazimeza” ni ya asili katika simulizi na inaonyesha kwamba fimbo ya Aroni ilizimeza fimbo nyingi.
- source_word: אֶת
  choice: '[alama ya yambwa tendwa haitafsiriwi moja kwa moja]'
  rationale: אֶת ni alama ya yambwa tendwa maalumu katika Kiebrania; kazi yake imewasilishwa na mpangilio na viambishi vya Kiswahili.
