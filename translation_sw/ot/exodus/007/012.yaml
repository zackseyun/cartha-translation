  source_fidelity: Rasimu huhifadhi vizuri mtawanyo wa tendo ("kila mmoja"), umoja/wingi wa fimbo, na tendo la fimbo ya Aroni kumeza fimbo zao. Hata hivyo, "viumbe kama nyoka" huongeza ulinganisho wa "kama" ambao haupo katika Kiebrania. Katika muktadha huu, "nyoka" ni tafsiri ya moja kwa moja na ya kawaida ya תַּנִּינִם, huku upana wa neno ukihifadhiwa katika tanbihi.
  naturalness: '"Kila mmoja akaitupa chini fimbo yake" si mpangilio wa kawaida zaidi wa Kiswahili, kwa kuwa kiambishi -i- katika "akaitupa" hutangulia nomino inayodaiwa kuwa yambwa. "Kila mmoja akatupa fimbo yake chini" ni fasaha, wazi, na hudumisha mtiririko wa simulizi.'
  terminology: '"Fimbo," "Aroni," na "kumeza" vinafaa na ni vya kawaida katika Kiswahili Sanifu cha Afrika Mashariki. "Nyoka" inafaa kama tafsiri kuu ya kimuktadha; tanbihi itaje kwa tahadhari mbadala wa kileksia kama "majoka" au "viumbe wakubwa wa kutambaa," bila kudai utambulisho mahsusi wa mnyama.'
  issues:
