base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/004.yaml
  text: Pharaoh will not listen to you[a], and I will lay my hand on Egypt and bring out my hosts—my people[c][b], the sons of Israel—from the land of Egypt with great judgments.
translation:
  language: sw
  text: Farao hatawasikiliza, nami nitaweka mkono wangu juu ya Misri na kuyatoa majeshi yangu—watu wangu, wana wa Israeli[a]—kutoka nchi ya Misri kwa hukumu kuu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kwa maana halisi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa matendo makuu ya hukumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע אֲלֵכֶם
  choice: hatawasikiliza
  rationale: Kitenzi שׁמע pamoja na אֶל hapa kina maana ya kusikiliza au kutii kwa kuzingatia. “Hatawasikiliza” ni Kiswahili cha kawaida na hakifanyi maana kuwa ‘kutii’ moja kwa moja.
- source_word: וְנָתַתִּי אֶת יָדִי בְּמִצְרַיִם
  choice: nitaweka mkono wangu juu ya Misri
  rationale: Huhifadhi taswira ya Kiebrania ya Mungu kuweka mkono wake juu ya Misri kwa tendo la hukumu, bila kuingiza kitenzi ‘kunyoosha’ ambacho hakipo katika mstari huu.
- source_word: צִבְאֹתַי
  choice: majeshi yangu
  rationale: צָבָא huonyesha vikosi au makundi yaliyopangwa, mara nyingi kwa uhusiano wa kijeshi. “Majeshi yangu” ni neno la asili na linaloeleweka katika Kiswahili, na linadumisha taswira ya watu wa Mungu kama makundi yaliyo chini ya mamlaka yake.
- source_word: עַמִּי בְנֵי יִשְׂרָאֵל
  choice: watu wangu, wana wa Israeli
  rationale: Muundo wa ufafanuzi unaodondosha ‘watu wangu’ kisha kuwatambulisha kama ‘wana wa Israeli’ umehifadhiwa; pia ‘wana’ huakisi בְנֵי kwa karibu.
- source_word: בִּשְׁפָטִים גְּדֹלִים
  choice: kwa hukumu kuu
  rationale: Neno שְׁפָטִים linamaanisha matendo ya hukumu ya Mungu dhidi ya Misri. “Kwa hukumu kuu” huhifadhi wingi wa kimaanishi katika matumizi ya Kiswahili, ambako ‘hukumu’ mara nyingi halibadiliki kwa umbo katika umoja na wingi.
theological_decisions:
- issue: Kuwataja Israeli kwa צִבְאֹתַי
  choice: majeshi yangu
  alternative: vikosi vyangu
  rationale: “Majeshi” huhifadhi nguvu ya taswira ya kijeshi na ya makundi yaliyopangwa bila kudai kwamba Israeli tayari walikuwa jeshi la kawaida; neno linalofuata, ‘watu wangu,’ linafafanua utambulisho wao.
- issue: Uwasilishaji wa בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” huhifadhi lugha ya ukoo na muundo wa chanzo, huku tanbihi ikitoa usemi mfupi na wa kawaida zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha mfuatano wa matendo katika Kiebrania na viambatisho vya ufafanuzi bila kufanya lugha kuwa nzito kupita kiasi.
