translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kisha’ kinaendeleza mfululizo wa simulizi; sentensi inaishia kwa koma kwa sababu mstari huu unatambulisha hotuba ya moja kwa moja inayofuata.
