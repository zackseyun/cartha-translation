translation:
  language: sw
  text: Vyura watapanda juu yako[a], juu ya watu wako, na juu ya watumishi wako wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, katika kifungu “juu ya watu wako,” “miongoni mwa watu wako.” Kihusishi kilekile cha Kiebrania kimetumiwa katika vifungu vyote vitatu, lakini muktadha unaonyesha vyura wakimfikia Farao na walio wake kama pigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָה
  choice: watakupanda wewe
  rationale: Muundo wa kitenzi עָלָה pamoja na בְּ unaonyesha vyura wakipanda juu ya Farao na kumfikia kama pigo. Kiwakilishi “wewe” kimeongezwa baada ya kiambishi cha yambwa kwa msisitizo unaolingana na Kiebrania.
- source_word: וּבְעַמְּךָ
  choice: watu wako
  rationale: Katika orodha hii, Kiswahili cha kawaida kinaweza kuendeleza wazo la kitenzi “kupanda” bila kurudia kiambishi cha mahali; maana ni kwamba vyura watawapanda au watawafikia watu wa Farao. Tafsiri “miongoni mwa watu wako” pia inawezekana.
- source_word: וּבְכָל עֲבָדֶיךָ
  choice: watumishi wako wote
  rationale: עֶבֶד inaweza kumaanisha mtumishi, mtumwa, au afisa wa kifalme. “Watumishi” ni pana na ya asili katika muktadha wa kuhutubiwa kwa Farao bila kuamua hadhi yao mahususi.
- source_word: יַעֲלוּ
  choice: watakupanda
  rationale: עָלָה humaanisha kupanda au kwenda juu. Katika pigo hili, “kupanda” huhifadhi taswira ya vyura wakitoka majini na kupanda juu ya watu.
- source_word: הַצְפַרְדְּעִים
  choice: Vyura
  rationale: Kiswahili hakihitaji kibainishi tofauti kinacholingana na הַ; nomino “Vyura” katika muktadha huu inarejelea kundi maalumu la vyura wa pigo lililotangazwa.
