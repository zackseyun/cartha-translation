translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. “Watakupanda wewe” ni wazi na hai, ingawa si usemi wa kawaida sana; umechaguliwa ili kuhifadhi mwendo wa kupanda katika עָלָה na nguvu ya pigo. Tanbihi inadumisha uwezekano wa maana nyingine wa kihusishi בְּ.
