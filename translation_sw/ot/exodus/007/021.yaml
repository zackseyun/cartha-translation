  text: וְ/הַ/דָּגָ֨ה אֲשֶׁר בַּ/יְאֹ֥ר מֵ֨תָה֙ וַ/יִּבְאַ֣שׁ הַ/יְאֹ֔ר וְ/לֹא יָכְל֣וּ מִצְרַ֔יִם לִ/שְׁתּ֥וֹת מַ֖יִם מִן הַ/יְאֹ֑ר וַ/יְהִ֥י הַ/דָּ֖ם בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/021.yaml
  text: And the fish in the Nile died[a], and the Nile stank, so that the Egyptians could not drink water from the Nile. And there was blood throughout all the land of Egypt.
translation:
  language: sw
  text: Samaki waliokuwa katika Mto Nile wakafa, nao Mto Nile ukanuka, hata Wamisri hawakuweza kunywa maji ya Mto Nile. Damu ikawa katika nchi yote ya Misri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּגָה
  choice: Samaki
  rationale: Nomino hii ya Kiebrania inawarejelea samaki kwa ujumla. Kiswahili ‘samaki’ huwasilisha vizuri maana hiyo ya kijumla bila kuongeza wazo la viumbe wengine wa majini.
- source_word: יְאֹר
  choice: Mto Nile
  rationale: Ingawa neno hili linaweza kumaanisha ‘mto,’ katika muktadha wa Kutoka linarejelea hasa Nile. ‘Mto Nile’ ni wazi na ya kawaida katika Kiswahili.
- source_word: מֵתָה
  choice: wakafa
  rationale: Kitenzi cha wakati uliopita kinaendeleza mfuatano wa simulizi kwa lugha ya kawaida na yenye nguvu.
- source_word: וַיִּבְאַשׁ
  choice: ukanuka
  rationale: Kitenzi kinaonyesha kutoa harufu mbaya. ‘Ukanuka’ ni tafsiri ya moja kwa moja, ya kawaida, na yenye uzito unaofaa simulizi la pigo.
- source_word: וְלֹא יָכְלוּ
  choice: hawakuweza
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza kutokuwa na uwezo.
- source_word: לִשְׁתּוֹת מַיִם מִן הַיְאֹר
  choice: kunywa maji ya Mto Nile
  rationale: Inahifadhi kutajwa wazi kwa tendo la kunywa na maji, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: וַיְהִי הַדָּם
  choice: Damu ikawa
  rationale: Muundo huu unafuata mfuatano wa simulizi na kuhifadhi usemi wa Kiebrania wa kuwapo kwa damu bila kufafanua zaidi hali yake.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: katika nchi yote ya Misri
  rationale: Huwasilisha kwa uwazi ukubwa wa eneo lililoathiriwa na ni usemi wa kawaida wa Kiswahili.
theological_decisions: []
