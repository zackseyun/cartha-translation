base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/028.yaml
  text: The Nile will swarm with frogs[a], and they will come up and enter your house, your bedroom, and your bed, and the houses of your servants and your people, and your ovens and your kneading bowls.
translation:
  language: sw
  text: Mto Nile utajaa vyura; watapanda kutoka mtoni na kuingia nyumbani mwako, katika chumba chako cha kulala, na juu ya kitanda chako, na katika nyumba za watumishi wako, miongoni mwa watu wako, na katika tanuru zako na vyombo vyako vya kukandia unga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mabakuli yako ya kukandia unga” au “hori zako za kukandia unga.” Neno la Kiebrania מִשְׁאֲרוֹת linaweza kurejelea vyombo vya kukandia donge, lakini aina na umbo lake hususa si hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרַץ
  choice: utajaa
  rationale: Kitenzi שׁרץ kinaonyesha wingi mkubwa wa viumbe vidogo vinavyoenea. “Utajaa” ni Kiswahili cha kawaida kinachowasilisha picha ya mto kuwa na vyura tele bila kutumia usemi usio wa asili.
- source_word: הַיְאֹר
  choice: Mto Nile
  rationale: Katika mazingira ya Misri, יְאֹר humaanisha hasa Mto Nile, si mto wowote.
- source_word: צְפַרְדְּעִים
  choice: vyura
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa nomino hii ya wingi.
- source_word: וְעָלוּ
  choice: Watapanda kutoka mtoni
  rationale: עלה hapa inaeleza vyura kutoka chini, yaani mtoni, na kupanda kwenda nchi kavu. Kirai “kutoka mtoni” kinaweka wazi mwelekeo uliodokezwa na muktadha.
- source_word: וּבָאוּ
  choice: kuingia
  rationale: בוא pamoja na vihusishi vinavyofuata ina maana ya kuingia katika maeneo yaliyotajwa.
- source_word: בְּבֵיתֶךָ
  choice: nyumbani mwako
  rationale: Inarejelea makao halisi ya Farao; “nyumbani mwako” ni ya asili zaidi katika Kiswahili kuliko tafsiri inayoweza kumaanisha jamaa au ukoo.
- source_word: וּבַחֲדַר מִשְׁכָּבְךָ
  choice: katika chumba chako cha kulala
  rationale: Ni tafsiri wazi ya kirai halisi “chumba cha kulala kwako,” kwa lugha ya sasa.
- source_word: וְעַל מִטָּתֶךָ
  choice: juu ya kitanda chako
  rationale: Inahifadhi wazi kihusishi עַל, “juu ya,” na hivyo kusisitiza uvamizi wa vyura hata kitandani.
- source_word: וּבְבֵית עֲבָדֶיךָ
  choice: katika nyumba za watumishi wako
  rationale: Ingawa “nyumba” iko katika umoja kwenye Kiebrania, inaweza kutumiwa kwa maana gawanyo pamoja na “watumishi” ya wingi; Kiswahili cha wingi kinaeleza maana hiyo kwa kawaida.
- source_word: וּבְעַמֶּךָ
  choice: miongoni mwa watu wako
  rationale: Kwa kuwa watu si mahali pa kuingiwa kwa kawaida katika Kiswahili, “miongoni mwa” huhifadhi maana ya vyura kuenea kwa watu wa Farao.
- source_word: וּבְתַנּוּרֶיךָ
  choice: katika tanuru zako
  rationale: תנור ni tanuru za nyumbani za kuokea; “tanuru” ni neno sahihi na linaloeleweka.
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  choice: vyombo vyako vya kukandia unga
  rationale: Neno hili linataja vyombo vya kuandalia au kukandia donge, lakini umbo lake halijaainishwa kabisa. “Vyombo vya kukandia unga” ni wazi na hakilazimishi chaguo kati ya mabakuli na hori.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa kwa kiasi ili orodha ndefu ibaki wazi. Kurudiwa kwa “kuingia” na “wataingia” kunatunza mwendo wa vyura katika maeneo mbalimbali, huku “watakuwa miongoni mwa watu wako” kikiepuka Kiswahili kisicho cha asili cha ‘kuingia watu.’ Alama ya tanbihi imewekwa baada ya neno linalohusika, yaani vyombo vya kukandia unga.
