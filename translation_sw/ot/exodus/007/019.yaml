  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֣ר אֶֽל אַהֲרֹ֡ן קַ֣ח מַטְּ/ךָ֣ וּ/נְטֵֽה יָדְ/ךָ֩ עַל מֵימֵ֨י מִצְרַ֜יִם עַֽל נַהֲרֹתָ֣/ם עַל יְאֹרֵי/הֶ֣ם וְ/עַל אַגְמֵי/הֶ֗ם וְ/עַ֛ל כָּל מִקְוֵ֥ה מֵימֵי/הֶ֖ם וְ/יִֽהְיוּ דָ֑ם וְ/הָ֤יָה דָם֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם וּ/בָ/עֵצִ֖ים וּ/בָ/אֲבָנִֽים־־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/019.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Take your staff and stretch out your hand over the waters of Egypt—over their rivers, over their Nile canals, over their ponds, and over every collection of their waters—that they may become blood. And there will be blood throughout all the land of Egypt[b], even in wooden and stone vessels.’”
translation:
  language: sw
  text: Kisha Yahwe akamwambia Musa, “Mwambie Haruni, ‘Chukua fimbo yako, unyooshe mkono wako juu ya maji ya Misri—juu ya mito yao, mifereji yao ya Nile, madimbwi yao, na kila mahali maji yao yalipokusanyika—ili maji hayo yageuke kuwa damu. Damu itakuwa katika nchi yote ya Misri, hata katika vyombo vya mbao na vya mawe[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “na katika mbao na katika mawe.” Huenda maneno hayo yanamaanisha vyombo vilivyotengenezwa kwa mbao na mawe.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna inayosomeka kwa kawaida katika Kiswahili badala ya kubadilishwa na cheo.
- source_word: מַטְּךָ
  choice: fimbo yako
  rationale: “Fimbo” ni neno la kawaida na la heshima kwa מַטֶּה katika simulizi hili.
- source_word: וּנְטֵה יָדְךָ
  choice: unyooshe mkono wako
  rationale: Huhifadhi tamathali ya Kiebrania na ni usemi wa asili katika Kiswahili.
- source_word: נַהֲרֹתָם
  choice: mito yao
  rationale: Neno נָהָר lina maana pana ya mto au kijito; “mito” linafaa katika orodha hii.
- source_word: יְאֹרֵיהֶם
  choice: mifereji yao ya Nile
  rationale: יְאֹר katika mazingira ya Misri huhusishwa hasa na Nile na njia zake za maji; tafsiri hii pia huitofautisha na נַהֲרוֹת.
- source_word: אַגְמֵיהֶם
  choice: madimbwi yao
  rationale: אָגַם inaweza kumaanisha maji yaliyotuama, dimbwi, au eneo lenye majimaji; “madimbwi” ni wazi bila kubainisha kupita kiasi.
- source_word: כָּל מִקְוֵה מֵימֵיהֶם
  choice: kila mahali maji yao yalipokusanyika
  rationale: מִקְוֶה ni mkusanyiko au mahali pa kukusanyika maji. Muundo huu ni wa kawaida zaidi katika Kiswahili kuliko nomino dhahania “mkusanyiko wa maji.”
- source_word: וְיִהְיוּ דָם
  choice: ili maji hayo yageuke kuwa damu
  rationale: Hutoa wazi matokeo yaliyokusudiwa baada ya amri huku kiwakilishi kikifafanuliwa kwa Kiswahili ili kuondoa utata wa kisarufi usiokusudiwa.
- source_word: וּבָעֵצִים וּבָאֲבָנִים
  choice: hata katika vyombo vya mbao na vya mawe
  rationale: Muktadha wa maji unaunga mkono kuelewa majina ya vifaa kama kibadala cha vyombo vilivyotengenezwa kwa vifaa hivyo; udondoshaji wa Kiebrania umeonyeshwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Huhifadhi jina binafsi katika matini badala ya kulibadilisha na cheo, bila kuingiza fundisho la dhehebu.
- issue: Maana ya וּבָעֵצִים וּבָאֲבָנִים
  choice: vyombo vya mbao na vya mawe
  alternative: kwa neno kwa neno, “katika mbao na katika mawe”
  rationale: Kwa kuwa kifungu kinazungumzia maji katika nchi yote, vifaa hivyo vinaeleweka kwa kawaida kuwa vyombo vya kuhifadhia maji. Hata hivyo, kwa sababu neno “vyombo” halijaandikwa wazi katika Kiebrania, usomaji wa karibu zaidi na maneno halisi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Orodha ndefu imehifadhiwa kwa vistari ili kuonyesha upeo wa aina zote za maji; “kila mahali maji yao yalipokusanyika” limetumiwa kwa ufasaha wa kisasa.
