base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/009.yaml
  text: When Pharaoh speaks to you[a], saying, ‘Produce a sign for yourselves,’ then you shall say to Aaron, ‘Take your staff and throw it down before Pharaoh; let it become a serpent.’
translation:
  language: sw
  text: Farao atakapowaambia, “Tupeni ishara,” ndipo utamwambia Aroni, “Chukua fimbo yako, uitupe mbele ya Farao; iwe nyoka.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “joka.” Neno la Kiebrania tannin linaweza kumaanisha nyoka, kiumbe wa majini, au kiumbe kama joka, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: atakaposema
  rationale: Katika muktadha huu כִּי inaanzisha hali ya wakati inayotarajiwa; muundo wa Kiswahili wenye -takapo- unaonyesha kwa kawaida ‘wakati atakapo-’ bila kuifanya sababu.
- source_word: יְדַבֵּר אֲלֵכֶם
  choice: atakaposema nanyi
  rationale: Kitenzi kisichotimilika katika kishazi hiki cha wakati kinaelekea kwenye tukio lijalo. ‘Kusema nanyi’ ni Kiswahili cha kawaida na kinadumisha wingi wa kiwakilishi אֲלֵכֶם.
- source_word: מוֹפֵת
  choice: ishara
  rationale: מוֹפֵת ni ishara ya ajabu au tukio lenye kuonyesha uthibitisho. ‘Ishara’ ni neno wazi na pana linalofaa ombi la Farao.
- source_word: תְּנוּ לָכֶם
  choice: Jionyesheni
  rationale: Kwa neno ni ‘jipeni,’ lakini hapa ni dai la kutoa au kuonyesha ishara kama uthibitisho. ‘Jionyesheni ishara’ ni tamko la kawaida linalohifadhi kwa kiasi maana ya לָכֶם ya ‘kwa ajili yenu wenyewe’.
- source_word: וְאָמַרְתָּ אֶל־אַהֲרֹן
  choice: ndipo utamwambia Aroni
  rationale: ‘Ndipo’ linaonyesha hatua inayofuata katika maagizo, huku umoja wa ‘utamwambia’ ukihifadhi mabadiliko kutoka ‘nanyi’ ya wingi hadi anayeambiwa binafsi.
- source_word: מַטְּךָ
  choice: fimbo yako
  rationale: מַטֶּה humaanisha fimbo au gongo; ‘fimbo’ ni neno la kawaida, la sasa, na linafaa kitu kinachobebwa na Aroni.
- source_word: וְהַשְׁלֵךְ
  choice: uitupe chini
  rationale: Kitenzi kina maana ya kutupa. ‘Uitupе chini’ kinaeleza tendo la kuitupa fimbo ardhini kwa Kiswahili cha kawaida.
- source_word: לִפְנֵי פַרְעֹה
  choice: mbele ya Farao
  rationale: Hili linadumisha maana ya kutenda katika uwepo wa Farao kwa usemi mfupi na wa asili.
- source_word: יְהִי
  choice: na iwe
  rationale: Muundo huu unadumisha nguvu ya jussive, yaani matokeo yanayoamriwa au kukusudiwa, badala ya kuugeuza moja kwa moja kuwa taarifa ya wakati ujao.
- source_word: תַנִּין
  choice: kiumbe kama nyoka
  rationale: תַנִּין lina wigo mpana kuliko neno la kawaida la ‘nyoka’ na linaweza kumaanisha nyoka mkubwa, kiumbe wa majini, au kiumbe kama joka. ‘Kiumbe kama nyoka’ kinafaa ishara hii na hakifuti kabisa upana wa neno la Kiebrania.
theological_decisions:
- issue: Tafsiri ya תַנִּין katika simulizi la ishara ya fimbo
  choice: kiumbe kama nyoka
  alternative: nyoka; joka; kiumbe mkubwa wa majini
  rationale: Muktadha wa fimbo iliyobadilika mbele ya Farao unaelekeza kwenye kiumbe wa mfano wa nyoka, lakini תַנִּין lina maana pana na si sawa tu na נָחָשׁ. Tafsiri kuu inaonyesha umbo la nyoka huku tanbihi ikihifadhi uwezekano mpana wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa wakati ‘atakaposema’ na kiunganishi ‘ndipo’ hufanya mlolongo wa maagizo uwe wa asili; wingi katika ‘nanyi/jionyesheni’ na umoja katika ‘utamwambia’ umehifadhiwa.
