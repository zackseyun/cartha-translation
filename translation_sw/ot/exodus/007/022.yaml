base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/022.yaml
  text: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
translation:
  language: sw
  text: Lakini wachawi wa Misri wakafanya vivyo hivyo kwa uchawi wao wa siri[a]. Moyo wa Farao ukawa mgumu[b], naye hakuwasikiliza, kama Yahweh alivyosema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ulozi wao” au “kwa sanaa zao za kichawi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Moyo wa Farao ulizidi kuwa mgumu.” Kiebrania hakitaji wazi ni nani aliyeufanya moyo wake kuwa mgumu katika aya hii.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: wakafanya vivyo hivyo
  rationale: Usemi huu unarejelea wazi tendo lililotangulia; “wakafanya vivyo hivyo” ni Kiswahili cha kawaida na huhifadhi uhusiano huo.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: wachawi wa Misri
  rationale: Katika muktadha huu neno linawataja wataalamu wa ibada na uchawi wa Farao walioiga ishara; “wachawi” linaeleweka kwa urahisi bila kuongeza cheo kisichotajwa.
- source_word: בְּלָטֵיהֶם
  choice: kwa ufundi wao wa siri
  rationale: Huhifadhi maana ya njia iliyotumiwa pamoja na wazo la matendo ya kichawi yaliyofichika, bila kubainisha mno namna yake.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: Moyo wa Farao ukawa mgumu
  rationale: Kitenzi hapa hakimtaji wazi mtendaji wa kuufanya moyo kuwa mgumu. Muundo huu wa hali/tokeo huhifadhi kutotajwa kwa mtendaji na ni wa asili katika Kiswahili.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: naye hakuwasikiliza
  rationale: “Kusikiliza” hapa hubeba maana ya kutii au kuzingatia. Kiwakilishi kinawarejelea Musa na Haruni kulingana na muktadha.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: kama Yahweh alivyokuwa amesema
  rationale: Hurejelea kauli ya Yahweh iliyotangulia na kuonyesha utangulizi wake katika simulizi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo, kulingana na kanuni ya mradi.
theological_decisions:
- issue: Mtendaji katika kuufanya moyo wa Farao kuwa mgumu
  choice: Moyo wa Farao ukawa mgumu
  alternative: Moyo wa Farao ulifanywa kuwa mgumu; Farao akaufanya moyo wake kuwa mgumu
  rationale: Kiebrania cha aya hii hakisemi wazi ikiwa Mungu, Farao mwenyewe, au mwingine ndiye mtendaji. Tafsiri ya hali/tokeo huhifadhi mvutano huo wa kitheolojia badala ya kuutatua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimewekwa kwa mtiririko wa kawaida wa simulizi; “ufundi wao wa siri” hudokeza uchawi bila kutumia lugha ya kimadhehebu, na “ukawa mgumu” huepuka kumtaja mtendaji ambaye chanzo hakimtaji.
