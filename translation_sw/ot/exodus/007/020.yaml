  text: וַ/יַּֽעֲשׂוּ כֵן֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֗ה וַ/יָּ֤רֶם בַּ/מַּטֶּה֙ וַ/יַּ֤ךְ אֶת הַ/מַּ֨יִם֙ אֲשֶׁ֣ר בַּ/יְאֹ֔ר לְ/עֵינֵ֣י פַרְעֹ֔ה וּ/לְ/עֵינֵ֖י עֲבָדָ֑י/ו וַ/יֵּהָֽפְכ֛וּ כָּל הַ/מַּ֥יִם אֲשֶׁר בַּ/יְאֹ֖ר לְ/דָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/020.yaml
  text: So Moses and Aaron did so[a], just as Yahweh had commanded. And he raised the staff and struck the water that was in the Nile before Pharaoh's eyes and before the eyes of his servants, and all the water that was in the Nile was turned to blood.
translation:
  language: sw
  text: Kwa hiyo Mose na Aroni wakafanya hivyo, kama vile Yahwe alivyoamuru. Kisha akainua fimbo na kuyapiga maji yaliyokuwa katika Mto Nile[a] mbele ya macho ya Farao na mbele ya macho ya watumishi wake, na maji yote yaliyokuwa katika Mto Nile yakageuka kuwa damu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania: “mto”; katika kitabu cha Kutoka neno hili kwa kawaida humaanisha hasa Mto Nile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: wakafanya hivyo
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba Mose na Aroni walitekeleza agizo lililotangulia.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: kama vile ... alivyokuwa amewaamuru
  rationale: “Kama vile” huhifadhi nguvu ya ulinganisho, na wakati uliopita unaonyesha kwamba amri ilitangulia utekelezaji wake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina la agano la Mungu kwa umbo linalolingana na tahajia na matamshi ya kawaida ya Kiswahili.
- source_word: וַיָּרֶם
  choice: akainua
  rationale: Kitenzi cha umoja kinahifadhiwa bila kumtaja mhusika, kwa kuwa Kiebrania hakutaji wazi katika kishazi hiki kama ni Mose au Aroni.
- source_word: בַּמַּטֶּה
  choice: fimbo
  rationale: “Fimbo” ni neno la kawaida na linaloeleweka kwa מַטֶּה katika muktadha huu.
- source_word: וַיַּךְ אֶת־הַמַּיִם
  choice: kuyapiga maji
  rationale: Hutoa maana ya moja kwa moja ya נכה, yaani kupiga, kwa Kiswahili cha kawaida.
- source_word: הַיְאֹר
  choice: Mto Nile
  rationale: Katika simulizi la Kutoka, יְאֹר humaanisha hasa Nile; “Mto Nile” humtambulisha wazi msomaji wa Kiswahili huku tanbihi ikihifadhi maana ya msingi ya neno.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: mbele ya macho ya Farao na ya watumishi wake
  rationale: Huhifadhi taswira ya “macho” na msisitizo kwamba tendo hilo lilifanywa hadharani mbele yao.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Hili ndilo neno pana na la moja kwa moja; maandishi hayabainishi vyeo vyao kuwa maafisa au wahudumu wa aina fulani.
- source_word: וַיֵּהָפְכוּ ... לְדָם
  choice: yakageuka kuwa damu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha badiliko la matokeo bila kuongeza ufafanuzi usiomo katika maandishi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, na umbo hili linaendana na mfumo wa sauti wa Kiswahili.
- issue: Mhusika wa kitenzi cha umoja וַיָּרֶם
  choice: 'Kuacha mhusika bila kutajwa: “akainua”'
  alternative: Aroni akainua; Mose akainua
  rationale: Ingawa muktadha wa karibu unaweza kuelekeza kwa Aroni, Kiebrania chenyewe kinatumia kitenzi cha umoja bila nomino ya mhusika. Kiswahili kinaweza kuhifadhi hali hiyo bila kuamua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa kawaida na wazi; taswira ya “mbele ya macho” imehifadhiwa kwa ajili ya msisitizo wa ushuhuda wa wazi. Kiashiria [a] kimewekwa baada ya “Mto Nile,” ambako tanbihi yake inahusika.
