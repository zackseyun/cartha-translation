  terminology: “Mose,” “Aroni,” “Yahwe,” “fimbo,” “Mto Nile,” “Farao,” na “watumishi wake” zinafaa kwa Kiswahili Sanifu cha Afrika Mashariki. “Yahwe” ni uwasilishaji unaokubalika wa יהוה katika Kiswahili. Tanbihi ya Nile inaakisi thamani ya msingi ya יְאֹר bila kuficha referenti yake katika muktadha wa Kutoka.
