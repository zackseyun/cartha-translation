  - severity: low
    issue: Urudiaji wa “mbele ya macho” haukuwekwa wazi kikamilifu
    rationale: Kiebrania hurudia לְעֵינֵי kwa Farao na kwa watumishi wake. Kurudia “mbele ya macho” katika Kiswahili huhifadhi msisitizo wa ushuhuda wa wazi.
