  source_fidelity: 'Maana ya msingi imehifadhiwa vizuri: utekelezaji wa agizo, kuinua fimbo, kupigwa kwa maji ya Nile hadharani, na kugeuka kwa maji kuwa damu. Hata hivyo, “alivyokuwa amewaamuru” huleta dhana ya tendo endelevu (“had been commanding”) ambayo haiko katika kitenzi kamili cha Kiebrania. Pia urudiaji wa usemi “mbele ya macho” unastahili kuhifadhiwa wazi zaidi.'
