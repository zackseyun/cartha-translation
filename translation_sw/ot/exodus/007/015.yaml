  text: לֵ֣ךְ אֶל פַּרְעֹ֞ה בַּ/בֹּ֗קֶר הִנֵּה֙ יֹצֵ֣א הַ/מַּ֔יְמָ/ה וְ/נִצַּבְתָּ֥ לִ/קְרָאת֖/וֹ עַל שְׂפַ֣ת הַ/יְאֹ֑ר וְ/הַ/מַּטֶּ֛ה אֲשֶׁר נֶהְפַּ֥ךְ לְ/נָחָ֖שׁ תִּקַּ֥ח בְּ/יָדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/015.yaml
  text: Go to Pharaoh in the morning[a]. Look, he is going out to the water, and you shall stand to meet him on the bank of the Nile[b], and you shall take in your hand the staff that was turned into a serpent.
translation:
  language: sw
  text: Nenda kwa Farao asubuhi. Tazama, anatoka kwenda majini; nawe simama ili kukutana naye ukingoni mwa Mto Naili[a]. Uichukue mkononi mwako ile fimbo iliyogeuka kuwa nyoka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mto.” Neno la Kiebrania יְאֹר katika kitabu cha Kutoka kwa kawaida humaanisha hasa Mto Naili.
    reason: lexical_alternative
  - marker: b
    text: Au “joka.” Neno la Kiebrania נָחָשׁ humaanisha nyoka; hapa limetafsiriwa kwa neno la kawaida la Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ אֶל פַּרְעֹה
  choice: Nenda kwa Farao
  rationale: Amri ya moja kwa moja; “nenda kwa” ni Kiswahili cha kawaida kinachoonyesha kumwendea mtu.
- source_word: בַּבֹּקֶר
  choice: asubuhi
  rationale: Huwakilisha kirai cha wakati kwa ufupi na kwa lugha ya kawaida.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huhifadhi nguvu ya neno la kuvuta fikira bila kutumia mtindo wa kizamani.
- source_word: יֹצֵא הַמַּיְמָה
  choice: atakuwa akitoka kwenda majini
  rationale: Kirai hiki huhifadhi hali ya tendo inayoonyeshwa na kishirikishi na mwelekeo wa kwenda kwenye maji; wakati ujao unafaa kwa maelekezo kuhusu tukio la asubuhi inayofuata.
- source_word: וְנִצַּבְתָּ לִקְרָאתוֹ
  choice: nawe simama ili kukutana naye
  rationale: Nifali ina maana ya kujiweka mahali au kusimama; “ili kukutana naye” huonyesha kusudi bila kuongeza dhana ya mapambano.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: ukingoni mwa Naili
  rationale: שׂפה ni ukingo, na יאור katika mazingira ya Kutoka humaanisha hasa Mto Naili.
- source_word: וְהַמַּטֶּה
  choice: ile fimbo
  rationale: “Fimbo” ni neno la sasa na la kawaida kwa kitu anachobeba Musa; kiashiria “ile” huunganisha na fimbo iliyotajwa awali.
- source_word: אֲשֶׁר נֶהְפַּךְ לְנָחָשׁ
  choice: iliyogeuka kuwa nyoka
  rationale: “Iliyogeuka” huwasilisha badiliko la hali kwa kawaida; נָחָשׁ ni neno la kawaida la nyoka.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: Uichukue mkononi mwako
  rationale: Huhifadhi nguvu ya amri ya mfuatano na pia usemi halisi wa Kiebrania “mkononi mwako.”
theological_decisions:
- issue: Maana ya יְאֹר
  choice: Naili
  alternative: mto
  rationale: Katika simulizi la Kutoka, neno hili humrejelea hasa Mto Naili. Jina mahususi huweka wazi mazingira ya kihistoria bila kuongeza tafsiri ya kidhehebu.
- issue: Maana ya נָחָשׁ
  choice: nyoka
  alternative: joka
  rationale: “Nyoka” ndilo neno la kawaida na pana la Kiswahili linalolingana na נָחָשׁ; “joka” linaweza kudokeza kiumbe mkubwa au wa ajabu kuliko maandishi yanavyolazimisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa amri umehifadhiwa, lakini sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
