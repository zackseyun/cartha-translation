    rationale: “Atakuwa akitoka” can be understood as ‘he will be in the process of coming out,’ whereas יֹצֵא is a participle whose contextual future reference need not be marked with this heavier construction. “Anatoka kwenda majini” is more idiomatic and preserves the participial vividness without over-specifying aspect.
