  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רְאֵ֛ה נְתַתִּ֥י/ךָ אֱלֹהִ֖ים לְ/פַרְעֹ֑ה וְ/אַהֲרֹ֥ן אָחִ֖י/ךָ יִהְיֶ֥ה נְבִיאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/001.yaml
  text: Then Yahweh said to Moses[a], “See, I have made you God to Pharaoh, and Aaron your brother will be your prophet.”
translation:
  language: sw
  text: Ndipo Yahwe akamwambia Musa, “Tazama, nimekufanya kuwa Mungu kwa Farao[a], na Aroni ndugu yako atakuwa nabii wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Musa amewekwa katika nafasi ya kumwakilisha Mungu mbele ya Farao, naye Aroni akiwa nabii wake. Kiebrania kinasema moja kwa moja, “nimekufanya kuwa Mungu kwa Farao.”
    reason: Kufafanua kauli halisi yenye mvutano kuhusu jukumu la Musa bila kuongeza neno “kama” katika maandishi makuu.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha asili na kuhifadhi nguvu ya waw-consecutive.
- source_word: רְאֵה
  choice: Tazama
  rationale: Ni amri inayomtaka Musa azingatie kauli inayofuata; “Tazama” ni fupi, yenye heshima, na inafaa katika usemi wa moja kwa moja.
- source_word: נְתַתִּיךָ
  choice: nimekufanya kuwa
  rationale: Ingawa maana ya msingi ya kitenzi ni “kutoa/kuweka,” kijalizo אֱלֹהִים kinaonyesha hali au jukumu alilopewa Musa; “nimekufanya kuwa” huwasilisha matokeo hayo kwa Kiswahili wazi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kiebrania hakitumii kiashiria cha ulinganisho kama “kama.” Tafsiri ya moja kwa moja “Mungu” huhifadhi kauli yenye nguvu na mvutano wake, huku tanbihi ikifafanua kwamba hapa Musa anawakilisha mamlaka ya Mungu mbele ya Farao.
- source_word: לְפַרְעֹה
  choice: kwa Farao
  rationale: Kihusishi לְ kinaonyesha uhusiano wa Musa na Farao katika jukumu hili; “kwa Farao” ni kifupi na huakisi muundo wa chanzo bila kuufanya kuwa wa mahali pekee.
- source_word: נְבִיאֶךָ
  choice: nabii wako
  rationale: נָבִיא ni neno la kawaida la Kiebrania kwa “nabii.” Kulihifadhi kunaonyesha ulinganifu uliokusudiwa kati ya Musa na Aroni bila kulipunguza kuwa “msemaji” tu.
- source_word: יִהְיֶה
  choice: atakuwa
  rationale: Huwasilisha kwa kawaida maana ya wakati ujao katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri Musa akiwa אֱלֹהִים kuhusiana na Farao
  choice: Mungu
  alternative: kama Mungu
  rationale: Chanzo kinasema moja kwa moja kwamba Musa amefanywa “Mungu kwa Farao,” bila neno la ulinganisho. Tafsiri hii haiamui kimya kimya mvutano wa kiteolojia kwa kuongeza “kama”; muktadha wa Aroni kuwa “nabii” wa Musa, pamoja na tanbihi, unaonyesha jukumu la uwakilishi na mamlaka badala ya kudai kwamba Musa ni Mungu kwa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ndipo ... akamwambia” huendeleza simulizi kwa ulaini; “Tazama” na “nabii” huhifadhi uzito wa usemi wa kibiblia bila kuwa wa kizamani. Alama ya tanbihi imewekwa baada ya kishazi kinachofafanuliwa.
