  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/026.yaml
  text: 'And Yahweh said to Moses[a], “Go in to Pharaoh and say to him, ‘Thus says Yahweh: Let my people go, so that they may serve me.’”'
translation:
  language: sw
  text: 'Yahweh akamwambia Musa, “Nenda kwa Farao, ukamwambie, ‘Yahweh asema hivi: Waache watu wangu waende, ili wanitumikie[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waniabudu.” Kitenzi cha Kiebrania kinaweza kumaanisha kumtolea Mungu utumishi, kutia ndani ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja ili kuhifadhi jina binafsi la agano badala ya kulibadili kuwa cheo.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo huu unaendeleza simulizi; kiambishi “aka-” ni cha kawaida na cha asili katika usimulizi wa Kiswahili.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Nenda kwa Farao
  rationale: בוא inaweza kumaanisha kuja, kwenda, au kuingia kulingana na mtazamo. Hapa amri inamtuma Musa afike mbele ya Farao; “Nenda kwa Farao” ni ya asili na haiamui zaidi ya maandishi kuhusu namna ya kuingia kwake.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: ukamwambie
  rationale: Inaendeleza amri ya kwanza kwa kusudi la Musa kufikisha ujumbe moja kwa moja kwa Farao.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Huhifadhi fomula rasmi na yenye mamlaka ya mjumbe wa Mungu kwa Kiswahili cha sasa.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Waache watu wangu waende
  rationale: Hii ni idiomu ya kudai kuachiliwa kwa watu, si kuwatuma tu mahali fulani.
- source_word: עַמִּי
  choice: watu wangu
  rationale: Huhifadhi kiambishi cha nafsi ya kwanza na dai la Yahweh juu ya watu hao.
- source_word: וְיַעַבְדֻנִי
  choice: ili wanitumikie
  rationale: Muundo unaonyesha kusudi la kuachiliwa kwao. Kitenzi עבד kina maana pana ya kumtumikia Mungu, inayoweza kujumuisha kumwabudu, hivyo “wanitumikie” huhifadhi upana wake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina la agano badala ya kulibadili kuwa cheo.
- issue: Maana ya וְיַעַבְדֻנִי kuhusu kusudi la kuachiliwa kwa Israeli
  choice: wanitumikie
  alternative: waniabudu
  rationale: עבד ikielekezwa kwa Mungu inaweza kujumuisha ibada, lakini maana yake ni pana kuliko ibada pekee. “Wanitumikie” huhifadhi upana huo na mvutano wa watu kuondolewa katika utumishi wa Farao ili wamtumikie Yahweh.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akamwambia,” “ukamwambie,” na “asema hivi” hudumisha mwendo wa simulizi na uzito wa ujumbe bila kutumia mtindo mgumu au wa kizamani.
