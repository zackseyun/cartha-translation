  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. “Mto huo” huepuka urudiaji mzito bila kupoteza rejeleo, na “utatoa uvundo” huwasilisha wazi hali ya harufu mbaya.
