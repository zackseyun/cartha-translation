base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/018.yaml
  text: And the fish that are in the Nile will die[a], and the Nile will stink[b], and the Egyptians will be unable to drink water from the Nile.
translation:
  language: sw
  text: Na samaki walio katika Mto Nile[a] watakufa, mto huo utatoa uvundo, nao Wamisri watashindwa[b] kunywa maji kutoka katika Mto Nile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mto”; katika muktadha huu ni Mto Nile.'
    reason: lexical_alternative
  - marker: b
    text: Au, “watachoka wakijaribu kunywa.” Kitenzi cha Kiebrania kinaweza kumaanisha kuchoka au kulemewa hata mtu asiweze kuendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: samaki
  rationale: Nomino ya Kiebrania ni ya umoja yenye maana ya mkusanyiko; “samaki” ni usemi wa kawaida wa Kiswahili unaowajumuisha samaki wote waliomo mtoni.
- source_word: יְאֹר
  choice: Mto Nile
  rationale: Ingawa neno lenyewe linaweza kumaanisha “mto,” katika muktadha wa Kutoka linarejelea hasa Mto Nile. Kutaja “Mto Nile” kunamwezesha msomaji kutambua mahali panaporejelewa.
- source_word: תָּמוּת
  choice: watakufa
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi מות katika muktadha huu; upatanisho wa wingi unafuata matumizi ya kawaida ya “samaki” katika Kiswahili.
- source_word: וּבָאַשׁ
  choice: utatoa uvundo
  rationale: Kitenzi באש kinaonyesha kuwa kitu kinakuwa na harufu mbaya. “Utatoa uvundo” ni wazi, cha asili, na chenye nguvu inayolingana na Kiebrania.
- source_word: וְנִלְאוּ
  choice: watashindwa
  rationale: Katika kauli ya Nifali, לאה inaweza kueleza kuchoka au kulemewa hata mtu asiweze kuendelea. “Watashindwa” linafikisha matokeo ya kutoweza, huku tanbihi ikihifadhi dhana ya kuchoka.
- source_word: לִשְׁתּוֹת מַיִם
  choice: kunywa maji
  rationale: Inahifadhi kitenzi na yambwa vilivyotajwa wazi katika Kiebrania.
- source_word: מִן הַיְאֹר
  choice: kutoka katika Mto Nile
  rationale: Hii ni tafsiri ya kawaida na sahihi ya kihusishi מִן pamoja na jina la mto katika muktadha huu.
theological_decisions: []
