base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/002.yaml
  text: You shall speak all that I command you[a], and Aaron your brother shall speak to Pharaoh, that he may send the sons of Israel out from his land.
translation:
  language: sw
  text: Wewe utanena yote nitakayokuamuru, na ndugu yako Aroni atanena na Farao, ili awaache wana wa Israeli waondoke kutoka katika nchi yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְדַבֵּר
  choice: utanena
  rationale: Kauli hii ina nguvu ya agizo katika muktadha wa kumtuma Musa; “utanena” ni ya hadhi na inaendana na kitenzi sambamba kinachomhusu Aroni.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  choice: yote nitakayokuamuru
  rationale: Huhifadhi ukamilifu wa כָּל na hali ya maagizo ambayo Mungu atampa Musa katika utume huu; wakati ujao ni wa kawaida na wazi katika Kiswahili.
- source_word: אַהֲרֹן אָחִיךָ
  choice: ndugu yako Aroni
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unahifadhi wazi uhusiano wa kifamilia.
- source_word: יְדַבֵּר אֶל־פַּרְעֹה
  choice: atanena na Farao
  rationale: Katika Kiswahili, “kunena na” humaanisha kuelekeza maneno kwa mtu bila kufafanua kupita kiasi yaliyomo katika hotuba.
- source_word: וְשִׁלַּח
  choice: ili awaache ... waondoke
  rationale: Muundo huu unaonyesha kusudi au matokeo yaliyokusudiwa bila kudai kwamba matokeo hayo yatatimia mara moja; pia unatoa kwa asili maana ya kumruhusu mtu aondoke.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hufuata taswira halisi ya Kiebrania, “wana wa Israeli,” badala ya kuisawazisha kabisa kuwa “Waisraeli”; hapa ni jina la ukoo linalolihusu taifa.
- source_word: מֵאַרְצוֹ
  choice: waondoke katika nchi yake
  rationale: Kitenzi “waondoke” pamoja na “katika nchi yake” huonyesha kwa kawaida mwendo wa kutoka katika eneo la Farao.
theological_decisions:
- issue: Uhusiano wa וְשִׁלַּח na hotuba ya Aroni
  choice: ili awaache ... waondoke
  alternative: naye atawaacha ... waondoke
  rationale: Tafsiri iliyochaguliwa huhifadhi uwezekano wa kusudi au matokeo yaliyokusudiwa, badala ya kuifanya kauli kuwa ahadi isiyo na masharti kwamba Farao atawaruhusu waondoke mara moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kunena” limetumiwa kwa ulinganifu wa vitenzi viwili na kwa sauti ya kifungu cha agizo; “awaache ... waondoke” ni ya asili kuliko tafsiri neno kwa neno. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
