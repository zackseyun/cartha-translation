  text: וְ/יָדְע֤וּ מִצְרַ֨יִם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּ/נְטֹתִ֥/י אֶת יָדִ֖/י עַל מִצְרָ֑יִם וְ/הוֹצֵאתִ֥י אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/תּוֹכָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/005.yaml
  text: And the Egyptians will know that I am Yahweh when I stretch out my hand against Egypt and bring the sons of Israel out from among them[a][b].
translation:
  language: sw
  text: Nao Wamisri watajua kwamba mimi ni Yahweh[a], nitakapounyosha mkono wangu dhidi ya Misri na kuwatoa Waisraeli kutoka miongoni mwao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina la Mungu katika Kiebrania ni YHWH; hapa limetafsiriwa “Yahweh.” Kijadi, tafsiri nyingi hulitafsiri “BWANA.”
    reason: alternative_reading
  - marker: b
    text: Kwa maneno halisi, Kiebrania kinasema “wana wa Israeli”; yaani, Waisraeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Nao ... watajua
  rationale: Katika muktadha huu wa unabii, kitenzi kinaeleza jambo la wakati ujao. “Watajua” huhifadhi maana ya kutambua kupitia matendo yatakayofuata, huku “Nao” ikiendeleza mtiririko wa simulizi.
- source_word: מִצְרַיִם
  choice: Wamisri / Misri
  rationale: Katika sehemu ya kwanza neno linarejelea watu, kwa hiyo limetafsiriwa “Wamisri”; baada ya עַל linarejelea nchi au taifa linalolengwa na hukumu, kwa hiyo limetafsiriwa “Misri.”
- source_word: כִּי
  choice: kwamba
  rationale: Hapa linaanzisha maudhui ya jambo ambalo Wamisri watajua.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limewasilishwa kwa namna ya kunukuu sauti yake badala ya kubadilishwa na cheo.
- source_word: בִּנְטֹתִי
  choice: nitakapounyosha
  rationale: ב pamoja na kitenzi-jina huonyesha wakati hapa. Muundo wa Kiswahili wa -takapo- unaonyesha kwa kawaida “wakati nitakaponyosha.”
- source_word: יָדִי
  choice: mkono wangu
  rationale: Taswira halisi ya mkono imehifadhiwa badala ya kufasiriwa moja kwa moja kuwa “nguvu.”
- source_word: עַל מִצְרָיִם
  choice: dhidi ya Misri
  rationale: Katika muktadha wa hukumu, עַל inaonyesha tendo linaloelekezwa kwa uhasama dhidi ya Misri.
- source_word: וְהוֹצֵאתִי
  choice: na kuwatoa
  rationale: 'Muundo huu huhifadhi maana sababishi ya Hifili: Yahweh ndiye anayewafanya watoke. Kitenzi kimeunganishwa na kishazi cha wakati kinachotangulia.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa kwa umbo la moja kwa moja Kiebrania kinasema “wana wa Israeli,” katika matumizi haya msemo unalitaja taifa lote. “Waisraeli” ni Kiswahili cha kawaida, wazi, na hakidokezi kimakosa kwamba wanaume pekee ndio wanaotolewa; umbo halisi limeelezwa katika tanbihi.
- source_word: מִתּוֹכָם
  choice: kutoka miongoni mwao
  rationale: Huhifadhi wazo la kuwatoa Waisraeli kutoka katikati ya Wamisri.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko linatumia Tetragramatoni kama jina la Mungu. “Yahweh” huhifadhi jina hilo, huku tanbihi ikieleza desturi nyingine ya kulitafsiri kwa cheo.
- issue: Maana ya בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  alternative: wana wa Israeli
  rationale: Msemo wa kifamilia wa Kiebrania unaweza kutafsiriwa kwa umbo lake la moja kwa moja, lakini hapa unarejelea watu wa Israeli kwa jumla. “Waisraeli” huwasilisha maana hiyo kwa Kiswahili cha sasa bila kuondoa umbo la asili, ambalo limetolewa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Taswira ya “kunyosha mkono” na uhusiano wa wakati katika sentensi ya Kiebrania vimehifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
