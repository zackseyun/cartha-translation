lexical_decisions:
- source_word: וַיִּפֶן
  choice: akageuka
  rationale: Kitenzi פנה kinaonyesha kugeuka au kuondoka; “akageuka” huhifadhi mwendo wa simulizi bila kuongeza mwelekeo usiotajwa wazi.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki cha kifalme katika Kiswahili cha Biblia.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: akaingia nyumbani mwake
  rationale: בוא pamoja na אֶל huonyesha mwendo kuelekea au kuingia mahali; “akaingia nyumbani mwake” ni ya asili katika Kiswahili na inaonyesha kuingia katika makao yake.
- source_word: וְלֹא שָׁת לִבּוֹ
  choice: wala ... hakulitia moyoni
  rationale: Nahau hii ina maana ya kuweka jambo moyoni au kulipa uzito na uangalifu. “Hakulitia moyoni” huhifadhi taswira ya moyo na ni nahau ya kawaida ya Kiswahili.
- source_word: גַּם לָזֹאת
  choice: hata hili
  rationale: גַּם hapa ina nguvu ya “hata,” na זֹאת hurejelea tukio au ishara hii; “hata hili” huonyesha kwamba jambo hili pia halikumgusa Farao.
