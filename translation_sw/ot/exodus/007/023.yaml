  yaml_path: translation/ot/exodus/007/023.yaml
  text: Pharaoh turned and went into his house[a], and he did not take even this to heart.
translation:
  language: sw
  text: Farao akageuka, akaingia nyumbani mwake, wala hata hili hakulitia moyoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala hata hili hakulizingatia.”
