  text: But if you refuse to let them go[a], behold, I will strike all your territory with frogs.
translation:
  language: sw
  text: Lakini ukikataa kuwaacha waende, tazama, mimi nitapiga[a] eneo lako lote kwa vyura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na ukikataa kuwaacha waende ... mimi ninakaribia kupiga nchi yako yote kwa vyura.” Kishiriki cha Kiebrania kinaweza kutafsiriwa kuwa tendo lililo karibu (“ninakaribia kupiga”) au wakati ujao wa kawaida (“nitapiga”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini uki-
  rationale: Kiunganishi pamoja na sharti kinaonyesha hali inayopingana na agizo lililotangulia; “lakini uki-” ni ya kawaida na huhifadhi nguvu hiyo.
- source_word: מָאֵן
  choice: kukataa
  rationale: Kitenzi kinaonyesha kukataa kwa hiari, si kushindwa tu; “kukataa” huhifadhi maana ya ukaidi.
- source_word: לְשַׁלֵּחַ
  choice: kuwaacha waende
  rationale: Katika muktadha wa Kutoka, usemi huu unamaanisha kuwafungulia Waisraeli waondoke; “kuwaacha waende” ni Kiswahili cha kawaida.
- source_word: הִנֵּה
  choice: tazama
  rationale: Neno hili huvuta fikira kwa uzito kwenye hukumu inayotangazwa; “tazama” huhifadhi mtindo wa juu na wa onyo.
- source_word: אָנֹכִי
  choice: ni-
  rationale: Kiwakilishi huru cha Kiebrania kinakazia msemaji; katika Kiswahili nafsi hiyo inaonyeshwa kiasili katika kitenzi, huku muktadha wa “tazama” ukisaidia kubeba mkazo.
- source_word: נֹגֵף
  choice: nitapiga
  rationale: Kishiriki pamoja na הִנֵּה kinaweza kueleza tendo lililo karibu au wakati ujao; “nitapiga” ni tangazo la kawaida la hukumu na haliongezi kiwango cha ukaribu kisicholazimishwa na muundo.
- source_word: כָּל גְּבוּלְךָ
  choice: eneo lako lote
  rationale: גְּבוּל hapa ni eneo lote chini ya mamlaka ya Farao, si mstari wa mpaka pekee; “eneo lako lote” huwasilisha wigo huo wazi.
- source_word: בַּצְפַרְדְּעִים
  choice: kwa vyura
  rationale: Herufi ב inaonyesha chombo au njia ya pigo; “kwa vyura” huonyesha kwamba vyura ndio watakaotumiwa kulipiga eneo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tazama” hudumisha uzito wa onyo la kifalme bila kutumia lugha ya kizamani kupita kiasi. Alama ya tanbihi imewekwa baada ya sentensi kwa sababu tanbihi inahusu mbadala wa muundo na wa kishiriki katika sehemu nzima ya tamko.
