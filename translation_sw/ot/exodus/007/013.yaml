  text: וַ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/013.yaml
  text: But Pharaoh's heart was hardened[a], and he did not listen to them, just as Yahweh had spoken.
translation:
  language: sw
  text: Lakini moyo wa Farao ukawa mgumu[a], naye hakuwasikiliza, kama vile Yahwe alivyokuwa amesema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moyo wa Farao ukawa imara.” Kitenzi cha Kiebrania kina maana halisi ya kuwa na nguvu au kuwa imara, na hapa kinamaanisha kuwa mgumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: ukawa mgumu
  rationale: Kitenzi חזק hapa kinaeleza moyo kuwa imara au mgumu. Kiswahili hiki ni cha kawaida na hakimtaji mtu aliyesababisha hali hiyo, sawasawa na muundo wa Kiebrania.
- source_word: לֵב
  choice: moyo
  rationale: Neno la kawaida la Kiswahili kwa לֵב; hapa linawakilisha nia, fikra, na utashi wa ndani.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Umbo la kawaida la Kiswahili la cheo cha mfalme wa Misri.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: naye hakuwasikiliza
  rationale: שׁמע pamoja na אֶל humaanisha kumsikiliza au kumtii mtu. 'Hakuwasikiliza' ni wazi na ya asili katika Kiswahili cha sasa.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Huonyesha ulinganifu kati ya tukio hili na yale yaliyokuwa yamesemwa hapo awali.
- source_word: דִּבֶּר
  choice: alivyokuwa amesema
  rationale: Muundo huu wa Kiswahili huonyesha kwamba kauli ya Yahwe ilitangulia kutimia kwake katika simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kwa cheo kama 'BWANA'.
theological_decisions:
- issue: Aliyesababisha moyo wa Farao kuwa mgumu
  choice: Moyo wa Farao ukawa mgumu
  alternative: Moyo wa Farao ulifanywa mgumu; Farao aliufanya moyo wake kuwa mgumu
  rationale: Kitenzi cha Kiebrania hapa hakimtaji wazi mtendaji aliyesababisha ugumu huo. Tafsiri hii huhifadhi hali na mvutano wa simulizi bila kumtaja Mungu au Farao kama mtendaji wa moja kwa moja katika aya hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Ukawa mgumu' ni usemi wa kawaida unaohifadhi kutotajwa kwa mtendaji katika Kiebrania; 'naye' hudumisha mtiririko wa kisimulizi.
