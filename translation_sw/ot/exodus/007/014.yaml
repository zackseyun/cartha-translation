  yaml_path: translation/ot/exodus/007/014.yaml
  text: Then Yahweh said to Moses[a], “Pharaoh’s heart is heavy; he refuses to let the people go.”
translation:
  language: sw
  text: Kisha Yahweh akamwambia Musa, “Moyo wa Farao ni mzito[a]; anakataa kuwaacha watu waende.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Moyo wa Farao ni mgumu.” Kwa Kiebrania ni “mzito,” taswira ya ukaidi au kutokubali kuitikia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa wayyiqtol unaendeleza mfululizo wa simulizi; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika Kiebrania.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: כָּבֵד
  choice: ni mzito
  rationale: Kivumishi hiki maana yake ya moja kwa moja ni “mzito.” Taswira hiyo imehifadhiwa ili kutofuta tofauti ya msamiati katika habari za moyo wa Farao.
- source_word: לֵב פַּרְעֹה
  choice: Moyo wa Farao
  rationale: Muundo wa uhusiano wa nomino umetafsiriwa kwa njia ya kawaida ya Kiswahili bila kuongeza maana.
- source_word: מֵאֵן
  choice: anakataa
  rationale: Umbo hili linaonyesha hali au msimamo unaoendelea wa kukataa; wakati wa sasa wa Kiswahili unaeleza hilo kwa ufasaha.
- source_word: לְשַׁלַּח
  choice: kuwaacha ... waende
  rationale: Katika muktadha huu kitenzi kinahusu Farao kuwaruhusu watu waondoke; usemi huu ni wa kawaida na sahihi katika Kiswahili.
- source_word: הָעָם
  choice: watu
  rationale: Kiebrania kinasema tu “watu”; utambulisho wao kama Israeli unaeleweka katika muktadha lakini haujaongezwa katika aya.
theological_decisions:
- issue: Kueleza hali ya Farao bila kuondoa mvutano wa taswira za kuufanya moyo kuwa mgumu
  choice: Moyo wa Farao ni mzito
  alternative: Moyo wa Farao ni mgumu
  rationale: Kiebrania hapa kinatumia כָּבֵד, “mzito,” si neno linalomaanisha moja kwa moja “mgumu.” Kuhifadhi taswira ya uzito kunaheshimu tofauti ya msamiati na hakusawazishi kimya-kimya vifungu vinavyohusu moyo wa Farao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka, huku taswira halisi ya Kiebrania “moyo ... ni mzito” ikihifadhiwa. Hakuna tanbihi iliyoongezwa kwa sababu mbadala “moyo ni mgumu” ungehitaji alama katika matini kuu, na tafsiri kuu yenyewe tayari inalinda tofauti muhimu ya kileksika.
