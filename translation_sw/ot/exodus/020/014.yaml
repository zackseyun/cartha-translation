lexical_decisions:
- source_word: לֹא
  choice: usi-
  rationale: Kikanushi לֹא pamoja na kitenzi cha nafsi ya pili huunda katazo; katika Kiswahili sanifu, kiambishi hasi cha amri “usi-” hutoa kwa kawaida nguvu ya “usifanye.”
- source_word: תִּנְאָף
  choice: -zini
  rationale: Kitenzi נאף katika qal humaanisha kufanya uzinzi, hasa kuvunja uaminifu wa ndoa. Kitenzi cha Kiswahili “kuzini” ni kifupi, cha kawaida, na sahihi katika muktadha wa sheria.
theological_decisions:
- issue: Mtindo wa katazo katika Amri Kumi
  choice: Usizini.
  alternative: Usifanye uzinzi.
  rationale: Muundo “usi-” pamoja na kitenzi hudumisha nguvu ya moja kwa moja na ya kudumu ya katazo la Kiebrania, huku ukisikika kwa kawaida na kwa uzito katika Kiswahili.
- issue: Upeo wa umbo la kiume, umoja, nafsi ya pili
  choice: Umbo la Kiswahili “usi-” lisiloonyesha jinsia
  alternative: Maneno yanayomwelekeza mwanamume waziwazi
  rationale: Ingawa umbo la Kiebrania ni la kiume umoja, katazo linamwelekea mshiriki wa agano kwa namna ya uwakilishi. Kiswahili hakionyeshi jinsia katika umbo hili, hivyo hakiongezi wala kupunguza upeo wa amri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; kauli fupi, yenye heshima na uzito wa kisheria. “Usizini” ni ya sasa na inaeleweka kwa wasomaji wa kawaida.
