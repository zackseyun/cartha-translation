  yaml_path: translation/ot/exodus/020/023.yaml
  text: You shall not make gods of silver alongside me[a], nor shall you make for yourselves gods of gold.
translation:
  language: sw
  text: Msitengeneze miungu ya fedha kando yangu[a], wala msijifanyie miungu ya dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja nami.” Kiebrania kinasema moja kwa moja “pamoja nami”; “kando yangu” ni tafsiri ya kimuktadha inayosisitiza katazo la miungu pinzani.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲשׂוּן / תַעֲשׂוּ
  choice: msijifanyie
  rationale: Kitenzi עשה hapa kinahusu kutengeneza vitu vya ibada. Muundo wa kujirejelea “msijifanyie” ni wa kawaida katika Kiswahili na, pamoja na muktadha, unaonyesha kuwa watu hawapaswi kujitengenezea miungu hiyo.
- source_word: אִתִּי
  choice: iwe pamoja nami
  rationale: אִתִּי maana yake ya moja kwa moja ni “pamoja nami.” Kuongeza “iwe” kunafanya uhusiano wa kisarufi uwe wazi na wa kawaida katika Kiswahili bila kuingiza kwa lazima maana ya kifasiri ya “kando yangu.”
- source_word: אֱלֹהֵי כֶסֶף
  choice: miungu ya fedha
  rationale: Hili linafuata kwa karibu mnyororo wa nomino wa Kiebrania na kueleweka kiasili kuwa miungu iliyotengenezwa kwa fedha.
- source_word: וֵאלֹהֵי זָהָב
  choice: wala msijifanyie miungu ya dhahabu
  rationale: “Wala” na kurudiwa kwa kitenzi huhifadhi katazo la pili lenye ulinganifu, huku “miungu ya dhahabu” ikifuata muundo wa Kiebrania.
- source_word: לָכֶם
  choice: msijifanyie
  rationale: Kiambishi cha kujirejelea “-ji-” pamoja na kiambishi cha wingi “-ie” kinawasilisha kwa Kiswahili maana ya “kwa ajili yenu wenyewe.”
- source_word: לֹא ... לֹא
  choice: msi- ... wala msi-
  rationale: Muundo huu unahifadhi makatazo mawili yaliyorudiwa na unafaa kwa lugha ya amri ya agano.
theological_decisions:
- issue: Iwapo אִתִּי itafsiriwe kwa namna ya kifasiri zaidi ili kusisitiza ibada ya pekee
  choice: pamoja nami
  alternative: kando yangu
  rationale: Kihusishi cha Kiebrania kinasema moja kwa moja “pamoja nami.” Ingawa muktadha unakataza miungu pinzani, “kando yangu” huongeza ufafanuzi ambao haujalazimishwa na neno lenyewe; tanbihi inalinda uwezekano huo wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya agano lakini kinachoeleweka kwa urahisi. Wingi wa nafsi ya pili umeonyeshwa kwa “msi-,” na ulinganifu wa makatazo mawili umehifadhiwa.
