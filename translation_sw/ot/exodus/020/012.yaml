review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the imperative to honor both parents, the purpose/result clause, the land as that which Yahweh is giving, and the divine name. However, “siku zako zipate kuwa nyingi” shifts the Hebrew idiom from days being prolonged/long to days being numerous. “Ndefu” better preserves יאריכון while retaining the idiom.
  naturalness: “Waheshimu baba yako na mama yako” and the remainder of the verse are clear, modern Standard East African Swahili. “Siku zako ziwe ndefu” is both idiomatic enough in elevated biblical register and closer to the source than “zipate kuwa nyingi.”
  terminology: “Yahwe, Mungu wako” appropriately retains the personal divine name and is natural Swahili usage. “Nchi” suitably represents הארץ/האדמה in this covenantal context without adding “ya ahadi.”
  issues:
  - severity: medium
    issue: “Siku zako zipate kuwa nyingi” does not accurately convey the Hebrew verb יאריכון.
    rationale: The expression means that the addressee’s days will be long or prolonged. Calling the days “many” can instead suggest a large number of days and weakens the source idiom. “Siku zako ziwe ndefu” preserves the image and intended sense.
  revised_text: Waheshimu baba yako na mama yako, ili siku zako ziwe ndefu[b] katika nchi[a] ambayo Yahwe, Mungu wako, anakupa.
  revised_footnotes:
  - marker: b
    text: Maneno “siku zako ziwe ndefu” ni msemo wa Kiebrania unaomaanisha kuishi muda mrefu.
    reason: cultural_note
  - marker: a
    text: Au “juu ya nchi.” Kihusishi cha Kiebrania kwa maana ya moja kwa moja ni “juu ya,” lakini Kiswahili cha kawaida katika muktadha huu hutumia “katika nchi.”
    reason: lexical_alternative
  revision_rationale: Nimebadili “zipate kuwa nyingi” kuwa “ziwe ndefu” ili kutafsiri kwa uaminifu zaidi tamathali ya Kiebrania ya siku kurefushwa. Marekebisho haya hayabadili maana ya ahadi, bali yanahifadhi taswira yake ya asili. Alama za maelezo ya chini na maudhui yake zimehifadhiwa na kusawazishwa na matini iliyorekebishwa.
