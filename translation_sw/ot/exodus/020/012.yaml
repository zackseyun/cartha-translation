  text: כַּבֵּ֥ד אֶת אָבִ֖י/ךָ וְ/אֶת אִמֶּ֑/ךָ לְמַ֨עַן֙ יַאֲרִכ֣וּ/ן יָמֶ֔י/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/012.yaml
  text: Honor your father and your mother[b][a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: sw
  text: Waheshimu baba yako na mama yako, ili siku zako ziwe ndefu[b] katika nchi[a] ambayo Yahwe, Mungu wako, anakupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Maneno “siku zako ziwe ndefu” ni msemo wa Kiebrania unaomaanisha kuishi muda mrefu.
    reason: cultural_note
  - marker: a
    text: Au “juu ya nchi.” Kihusishi cha Kiebrania kwa maana ya moja kwa moja ni “juu ya,” lakini Kiswahili cha kawaida katika muktadha huu hutumia “katika nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד
  choice: Waheshimu
  rationale: Amri ya Piel ya כבד inataka wazazi watambuliwe kuwa wenye uzito na wanaostahili heshima. “Waheshimu” ni Kiswahili cha kawaida chenye nguvu ya kimaadili kuliko maneno yanayoonyesha adabu ya nje tu.
- source_word: אָבִיךָ וְאֶת אִמֶּךָ
  choice: baba yako na mama yako
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya majina haya yenye viambishi vya nafsi ya pili umoja.
- source_word: לְמַעַן
  choice: ili
  rationale: Neno hili huonyesha kusudi au matokeo; “ili” linaunganisha amri na ahadi kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: יַאֲרִכוּן יָמֶיךָ
  choice: siku zako zipate kuwa nyingi
  rationale: Inahifadhi tamathali ya Kiebrania ya “siku” badala ya kuibadili moja kwa moja kuwa “maisha,” huku ikieleweka kama ahadi ya kuishi muda mrefu.
- source_word: עַל הָאֲדָמָה
  choice: katika nchi
  rationale: Katika muktadha huu אֲדָמָה ni nchi anayowapa Israeli, si udongo tu. “Katika nchi” ni Kiswahili cha kawaida, ingawa עַל kwa maana ya moja kwa moja ni “juu ya.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Tafsiri ya kawaida ya nomino yenye kiambishi cha nafsi ya pili umoja, ikionyesha uhusiano wa agano katika usemi wa moja kwa moja.
- source_word: נֹתֵן לָךְ
  choice: anakupa
  rationale: Umbo la participio linaonyesha tendo linaloendelea au lililo karibu kutimizwa; wakati wa sasa wa Kiswahili unafaa katika mazingira ya Sinai kabla nchi haijamilikiwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maana ya הָאֲדָמָה katika ahadi
  choice: nchi
  alternative: ardhi; dunia; udongo
  rationale: Kifungu “ambayo ... anakupa” na mazingira ya agano vinaonyesha nchi wanayopewa Israeli. Tafsiri haiongezi neno “ya ahadi,” ambalo halipo wazi katika mstari.
- issue: Uhusiano kati ya amri na maisha marefu
  choice: ili siku zako zipate kuwa nyingi
  alternative: nawe utaishi maisha marefu
  rationale: Tafsiri inadumisha muundo wa kusudi au matokeo wa לְמַעַן pamoja na tamathali ya “siku,” bila kufafanua zaidi namna ahadi hiyo inavyotimizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama amri ya agano; “Waheshimu” ni wa kawaida na wenye uzito, na “zipate kuwa nyingi” huhifadhi ladha ya msemo wa Kiebrania bila kuwa ngumu kueleweka.
