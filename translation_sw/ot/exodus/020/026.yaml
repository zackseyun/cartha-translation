  yaml_path: translation/ot/exodus/020/026.yaml
  text: And you shall not go up by steps to my altar[a], so that your nakedness may not be exposed on it.
translation:
  language: sw
  text: Wala usipande kwa ngazi kwenda kwenye madhabahu yangu, ili uchi wako usifunuliwe juu yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲלֶה
  choice: usipande
  rationale: Kitenzi עלה humaanisha kupanda au kwenda juu; pamoja na לֹא hapa kinatoa katazo la moja kwa moja.
- source_word: בְמַעֲלֹת
  choice: kwa ngazi
  rationale: מַעֲלוֹת humaanisha vipandio au ngazi; “kwa ngazi” ni Kiswahili cha kawaida kinachoonyesha njia ya kupandia.
- source_word: מִזְבְּחִי
  choice: madhabahu yangu
  rationale: Ni tafsiri ya kawaida ya מִזְבֵּחַ pamoja na kiambishi cha nafsi ya kwanza umoja.
- source_word: אֲשֶׁר לֹא
  choice: ili ... usi-
  rationale: Katika muktadha huu kishazi kinaonyesha kusudi au matokeo yanayozuiwa; “ili ... usi-” huwasilisha maana hiyo kwa Kiswahili cha sasa.
- source_word: תִּגָּלֶה
  choice: usifunuliwe
  rationale: Nifali ya גלה ina maana ya kufunuliwa au kuwekwa wazi; umbo la kutendwa linahifadhiwa.
- source_word: עֶרְוָתְךָ
  choice: uchi wako
  rationale: עֶרְוָה hapa hurejelea uchi wenye maana ya staha ya mwili; “uchi wako” ni wazi bila kubainisha zaidi ya maandishi.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kiwakilishi kinarejelea madhabahu; “juu yake” huhifadhi uhusiano wa kimaeneo wa עַל.
theological_decisions:
- issue: Sababu ya kukataza ngazi za kupandia madhabahuni
  choice: Sababu iliyotajwa wazi ni kuzuia uchi wa mwabudu kufunuliwa juu ya madhabahu.
  alternative: Katazo hilo linaashiria unyenyekevu mbele za Mungu, au linahusu hasa mavazi ya makuhani.
  rationale: Maandishi ya Kiebrania yanataja wazi kufunuliwa kwa uchi; tafsiri haiongezi maana ya kiishara wala haibainishi mavazi ambayo hayakutajwa katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wala” linaunganisha katazo hili na maagizo yaliyotangulia; “kwenda kwenye” huweka wazi kwamba ngazi hizo ni njia ya kufikia madhabahu bila kubadili maana ya msingi.
