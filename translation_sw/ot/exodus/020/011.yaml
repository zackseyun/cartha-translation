id: EXO.20.11
reference: Exodus 20:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֣י שֵֽׁשֶׁת יָמִים֩ עָשָׂ֨ה יְהוָ֜ה אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ אֶת הַ/יָּם֙ וְ/אֶת כָּל אֲשֶׁר בָּ֔/ם וַ/יָּ֖נַח בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י עַל כֵּ֗ן בֵּרַ֧ךְ יְהוָ֛ה אֶת י֥וֹם הַ/שַּׁבָּ֖ת וַֽ/יְקַדְּשֵֽׁ/הוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
translation:
  language: sw
  text: Kwa maana kwa siku sita Yahwe alifanya mbingu na dunia, bahari na vyote vilivyomo, kisha akapumzika[a] siku ya saba. Kwa hiyo Yahwe aliibariki siku ya Sabato na kuitakasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaacha kufanya kazi.” Kitenzi cha Kiebrania kinaweza kusisitiza kupumzika baada ya kazi au kuacha kufanya kazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kinaanzisha sababu ya amri ya Sabato iliyotangulia na kudumisha uhusiano wake wa kimantiki.
- source_word: שֵׁשֶׁת יָמִים
  choice: kwa siku sita
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kipindi ambacho kazi ya uumbaji ilifanywa.
- source_word: עָשָׂה
  choice: alifanya
  rationale: Kitenzi hiki kina maana pana ya kufanya au kutengeneza; “alifanya” ni cha asili katika orodha hii ya kazi ya uumbaji bila kuongeza maelezo yasiyomo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu linalowakilishwa na herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: mbingu na dunia
  rationale: Jozi hii ya kiuumbaji inarejelea maeneo yote ya juu na ya chini; “dunia” hapa si nchi fulani.
- source_word: הַיָּם
  choice: bahari
  rationale: Umoja wa Kiebrania umehifadhiwa kwa neno la kawaida la Kiswahili.
- source_word: כָּל אֲשֶׁר בָּם
  choice: vyote vilivyomo
  rationale: Kauli hii inajumuisha kwa ujumla kila kilichomo katika mbingu, dunia na bahari.
- source_word: וַיָּנַח
  choice: kisha akapumzika
  rationale: “Akapumzika” huwasilisha maana ya msingi katika muktadha wa Sabato, huku tanbihi ikihifadhi uwezekano wa kusisitiza kuacha kazi.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na mpangilio wa uumbaji.
- source_word: בֵּרַךְ
  choice: aliibariki
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa tendo la Mungu la kuipa siku baraka.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: na kuitakasa
  rationale: Linadumisha wazo la Mungu kuitenga siku hiyo kuwa takatifu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maelezo ya tendo la Mungu siku ya saba
  choice: akapumzika
  alternative: akaacha kufanya kazi
  rationale: Kitenzi נוח kinaweza kueleza kupumzika au kukoma baada ya kazi. Tafsiri kuu inafuata matumizi ya kawaida katika muktadha wa Sabato, na tanbihi inadumisha maana mbadala bila kudokeza kwamba Mungu alichoka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi unafuata hoja ya Kiebrania bila kuwa mgumu, na neno “Sabato” limetumiwa kama istilahi ya kawaida ya kibiblia.
