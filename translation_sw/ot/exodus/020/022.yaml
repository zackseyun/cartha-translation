  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כֹּ֥ה תֹאמַ֖ר אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל אַתֶּ֣ם רְאִיתֶ֔ם כִּ֚י מִן הַ/שָּׁמַ֔יִם דִּבַּ֖רְתִּי עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/022.yaml
  text: 'Then Yahweh said to Moses[c][b][a], “Thus you shall say to the sons of Israel: You yourselves have seen that I have spoken to you from heaven.”'
translation:
  language: sw
  text: 'Kisha Yahweh akamwambia Musa, “Hivi ndivyo utakavyowaambia wana wa Israeli[a]: Ninyi wenyewe mmeona kwamba nimezungumza nanyi[b] kutoka mbinguni[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli” au “watoto wa Israeli.” Kiebrania kinasema kihalisi “wana wa Israeli,” jina linalotumiwa kwa watu wa Israeli kwa pamoja.
    reason: lexical_alternative
  - marker: b
    text: Au, “nimewaambia.” Kiebrania kinasema kwa ukaribu zaidi “nimezungumza pamoja nanyi,” kikisisitiza kukutana nao moja kwa moja.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kina umbo la wingi, “kutoka katika mbingu”; Kiswahili kwa kawaida husema “kutoka mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linahifadhi jina la agano lililoandikwa moja kwa moja katika maandishi ya Kiebrania, badala ya kulibadili kuwa cheo.
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo huu unaendeleza simulizi kwa mpangilio wa matukio na unasikika kwa kawaida katika Kiswahili.
- source_word: כֹּה תֹאמַר
  choice: Hivi ndivyo utakavyowaambia
  rationale: Ni fomula ya mjumbe inayotoa agizo la kuwasilisha maneno yanayofuata; tafsiri hii ni ya asili na yenye hadhi katika Kiswahili cha sasa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inafuata kwa karibu maana halisi ya ‘wana wa Israeli’ huku ikitambulika kama jina la pamoja la watu wa Israeli.
- source_word: אַתֶּם
  choice: Ninyi wenyewe
  rationale: Kiwakilishi huru cha Kiebrania kina mkazo; ‘ninyi wenyewe’ huonyesha wazi kwamba wao ndio mashahidi wa tukio hilo.
- source_word: רְאִיתֶם
  choice: mmeona
  rationale: Kauli timilifu ya Kiswahili inaonyesha tukio lililotokea ambalo ushahidi wake bado una umuhimu katika wakati wa usemi.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha maudhui ya yale waliyoona, si sababu.
- source_word: מִן הַשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: Hii ndiyo nahau ya kawaida ya Kiswahili kwa chanzo cha kimbingu, ingawa nomino ya Kiebrania ina umbo la wingi.
- source_word: דִּבַּרְתִּי עִמָּכֶם
  choice: nimezungumza nanyi
  rationale: ‘Nanyi’ linaakisi kihusishi עִם, ‘pamoja na/na,’ na kuhifadhi wazo la kukutana moja kwa moja; ‘nimezungumza’ ni Kiswahili cha asili kuliko ‘nimesema nanyi.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu YHWH
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina יהוה moja kwa moja. Kulitaja ‘Yahweh’ kunahifadhi jina hilo la agano bila kulibadili kuwa cheo.
- issue: Jina la pamoja בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli au watu wa Israeli
  rationale: Tafsiri hii inadumisha muundo halisi wa Kiebrania huku matumizi yake ya pamoja kwa taifa zima yakielezwa katika tanbihi.
- issue: Maana ya דִּבַּרְתִּי עִמָּכֶם
  choice: nimezungumza nanyi
  alternative: nimewaambia au nimesema nanyi
  rationale: Kihusishi עִם kwa kawaida ni ‘na/pamoja na’; uchaguzi huu unahifadhi msisitizo wa mawasiliano ya moja kwa moja bila kudai kwamba yalikuwa mazungumzo ya pande mbili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa mjumbe umewekwa kwa lugha ya asili, huku mkazo wa ‘ninyi wenyewe,’ jina la Mungu, na uhusiano wa moja kwa moja katika ‘nanyi’ vikihifadhiwa.
