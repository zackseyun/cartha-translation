base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/005.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me[d][c][b],
translation:
  language: sw
  text: Usivisujudie wala kuvitumikia[a], kwa maana mimi, Yahweh Mungu wako, ni Mungu mwenye wivu, ninayewapatiliza watoto maovu ya baba zao[c], hata kizazi cha tatu na cha nne cha wale wanaonichukia[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuviinamia”; kitenzi cha Kiebrania hueleza kuinama au kujilaza chini kwa heshima. “Kuvitumikia” hapa pia kunaweza kumaanisha kuvitolea ibada.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “ninayewapatiliza watoto maovu ya baba zao.” Maneno haya yanahifadhi nahau ya Kiebrania; linganisha Kumbukumbu la Torati 24:16 na Ezekieli 18 kuhusu wajibu wa kila mtu.'
    reason: cross_reference
  - marker: d
    text: Au “hadi kizazi cha tatu na cha nne cha wale wanaonichukia.”
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: kuvisujudia
  rationale: Kitenzi hiki hueleza tendo la kuinama au kujilaza chini kwa heshima. “Kuvisujudia” ni cha kawaida katika Kiswahili cha Biblia na huhifadhi tendo halisi bila kukifanya tu kuwa neno la jumla “kuabudu.”
- source_word: תָעָבְדֵם
  choice: kuvitumikia
  rationale: עבד kimsingi ni “kutumikia”; katika muktadha wa sanamu, ni huduma ya kidini au ibada. Tafsiri hii pia hudumisha tofauti na tendo la kusujudu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya muundo wenye kiambishi cha nafsi ya pili umoja.
- source_word: אֵל קַנָּא
  choice: Mungu mwenye wivu
  rationale: Katika agano, קַנָּא huonyesha dai halali la Mungu la uaminifu wa pekee na kutokubali ibada ya washindani. “Mwenye wivu” huhifadhi mvutano huo kuliko “mwenye juhudi.”
- source_word: פֹּקֵד
  choice: ninayeleta ... juu ya
  rationale: פֹּקֵד huonyesha Mungu akishughulikia kwa tendo na hukumu. “Kuleta ... juu ya” huhifadhi kwa kiasi kikubwa nahau ya Kiebrania bila kuibana moja kwa moja kuwa “kuadhibu.”
- source_word: עֲוֺן
  choice: uovu
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au matokeo ya hatia. “Uovu” ni neno la kawaida lenye uzito wa kimaadili huku likiacha upana wa maana wazi.
- source_word: אָבֹת
  choice: baba
  rationale: Kiebrania ni wingi wa kiume na fomula hii inawataja baba; haijabadilishwa kuwa “wazazi.”
- source_word: בָּנִים
  choice: watoto
  rationale: Ingawa neno linaweza kumaanisha wana, katika onyo hili la vizazi “watoto” huwasilisha wazao bila kudokeza wanaume pekee.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: hata kizazi cha tatu na cha nne
  rationale: Namba hizi zinawakilisha vizazi kwa udondoshaji. Kutaja “kizazi” hufanya maana ieleweke kwa Kiswahili cha kawaida.
- source_word: לְשֹׂנְאָי
  choice: cha wale wanaonichukia
  rationale: Kishazi hiki kinaunganishwa kiasili na vizazi vinavyotangulia na huhifadhi nguvu ya uhusiano wa kumchukia Mungu.
theological_decisions:
- issue: Jinsi ya kutafsiri wivu wa Mungu
  choice: Mungu mwenye wivu
  alternative: Mungu mwenye juhudi
  rationale: Muktadha ni uaminifu wa kiagano na marufuku ya ibada ya sanamu. “Mwenye wivu” huhifadhi dai halali la Mungu la ibada ya pekee bila kulainisha mvutano wa kifungu.
- issue: Jinsi ya kueleza hukumu inayohusu vizazi
  choice: ninayeleta uovu wa baba juu ya watoto, hata kizazi cha tatu na cha nne cha wale wanaonichukia
  alternative: ninayewaadhibu watoto kwa ajili ya dhambi za baba hadi kizazi cha tatu na cha nne cha wale wanaonichukia
  rationale: Tafsiri iliyochaguliwa huhifadhi nahau na utata wa Kiebrania bila kuamua kimya kimya kwamba פֹּקֵד ni “kuadhibu” pekee au kueleza utaratibu wa kuwajibika zaidi ya maandishi yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Umoja wa anayeambiwa umehifadhiwa katika “Mungu wako,” huku viambishi vya vitu vingi vikirejelea sanamu za muktadha. Nahau ya hukumu ya vizazi imehifadhiwa badala ya kufafanuliwa kupita kiasi.
