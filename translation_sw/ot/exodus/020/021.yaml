  yaml_path: translation/ot/exodus/020/021.yaml
  text: The people stood at a distance[a], and Moses approached the thick darkness where God was.
translation:
  language: sw
  text: Watu wakasimama kwa mbali, naye Musa akakaribia lile giza nene[a] ambako Mungu alikuwapo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wingu jeusi” au “utusitusi.” Neno la Kiebrania linaweza kumaanisha giza zito linalohusishwa na kujidhihirisha kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: wakasimama
  rationale: Kauli hii inasimulia tendo au hali iliyofuata; “wakasimama” ni Kiswahili cha kawaida na chenye ufupi unaofaa.
- source_word: הָעָם
  choice: watu
  rationale: Nomino yenye kibainishi inawarejelea watu waliokusanyika ambao tayari wametajwa; hakuna haja ya kuongeza “wa Israeli.”
- source_word: מֵרָחֹק
  choice: kwa mbali
  rationale: Kirai hiki huonyesha umbali wa mahali na ni cha kawaida katika Kiswahili sanifu.
- source_word: נִגַּשׁ
  choice: akakaribia
  rationale: Kitenzi kina maana ya kuja karibu au kukaribia; “akakaribia” ni wazi na hakiongezi wazo lisilokuwapo katika Kiebrania.
- source_word: הָעֲרָפֶל
  choice: lile giza nene
  rationale: Neno hili humaanisha giza zito au hali ya utusitusi inayohusishwa na kujidhihirisha kwa Mungu. “Giza nene” huhifadhi picha halisi na uzito wake; “lile” huakisi kibainishi cha Kiebrania kwa njia ya kawaida katika muktadha huu.
- source_word: אֲשֶׁר שָׁם הָאֱלֹהִים
  choice: ambako Mungu alikuwapo
  rationale: Kirai hiki hutambulisha mahali pa uwepo wa Mungu. “Ambako Mungu alikuwapo” ni cha asili katika Kiswahili na kinawakilisha שָׁם bila kurudia “huko.”
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno hilo linamtaja Mungu wa Israeli, kwa hiyo umoja “Mungu” ndio tafsiri inayofaa.
theological_decisions:
- issue: Kudhihirishwa kwa Mungu ndani ya giza
  choice: Kutafsiri עֲרָפֶל kwa picha halisi kama “giza nene.”
  alternative: wingu jeusi; utusitusi
  rationale: Mstari unadumisha mvutano wa uwepo mtakatifu wa Mungu kuhusishwa na hali ya kutoweza kuona na kutokaribika. Tafsiri haipaswi kuufanya kuwa maelezo ya hali ya hewa tu wala kuufafanua kupita maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi “wakasimama ... akakaribia” ni wa kawaida, huku “giza nene” likihifadhi picha na uzito wa maandishi ya Kiebrania.
