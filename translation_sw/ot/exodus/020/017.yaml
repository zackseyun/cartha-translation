base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/017.yaml
  text: You shall not covet your neighbor’s house; you shall not covet your neighbor’s wife[a], or his male servant, or his female servant, or his ox, or his donkey, or anything that belongs to your neighbor.
translation:
  language: sw
  text: Usitamani nyumba[a] ya jirani yako; usitamani mke wa jirani yako, wala mtumwa wake wa kiume, wala mtumwa wake wa kike, wala ng’ombe wake, wala punda wake, wala kitu chochote kilicho cha jirani yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kaya ya jirani yako.” Neno la Kiebrania linalotafsiriwa “nyumba” linaweza pia kumaanisha kaya, ingawa hapa “nyumba” inafaa kwa kuwa orodha inayofuata inataja mke, watumwa, na wanyama kando.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: usitamani
  rationale: Katika amri hii, kitenzi חמד kinaonyesha tamaa isiyofaa ya kutaka kilicho cha mwingine. “Usitamani” ni Kiswahili cha kawaida chenye uzito wa kimaadili, bila kuongeza maana ya kuchukua kwa nguvu ambayo haijasemwa wazi.
- source_word: בֵּית רֵעֶךָ
  choice: nyumba ya jirani yako
  rationale: בַּיִת inaweza kumaanisha nyumba au kaya, lakini orodha inayofuata inamtaja mke, watumwa na wanyama kando; hivyo “nyumba” inafaa zaidi katika muundo huu.
- source_word: רֵעֶךָ
  choice: jirani yako
  rationale: רֵעַ hapa humaanisha mtu mwingine katika jamii. “Jirani yako” ni usemi wa kawaida na wenye kufahamika katika muktadha wa maadili kati ya watu.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: mke wa jirani yako
  rationale: Kirai hiki cha Kiebrania humaanisha moja kwa moja mke wa jirani, na tafsiri hii huhifadhi uhusiano huo wazi.
- source_word: עַבְדּוֹ
  choice: mtumwa wake wa kiume
  rationale: עֶבֶד katika orodha hii ya kisheria inaonyesha hadhi ya utumwa, na “wa kiume” huitofautisha na neno la kike linalofuata.
- source_word: אֲמָתוֹ
  choice: mtumwa wake wa kike
  rationale: אָמָה humaanisha mtumwa au mtumishi wa kike. Katika ulinganifu na עֶבֶד na muktadha huu wa kisheria, “mtumwa wake wa kike” hudhihirisha hadhi na jinsia.
- source_word: שׁוֹרוֹ
  choice: ng’ombe wake
  rationale: שׁוֹר humaanisha mnyama wa jamii ya ng’ombe, mara nyingi ng’ombe wa kazi. “Ng’ombe” ni neno la kawaida na la asili katika Kiswahili bila kulazimisha jinsia au hali ya kuhasiwa isiyo wazi hapa.
- source_word: חֲמֹרוֹ
  choice: punda wake
  rationale: “Punda” ni kisawe cha moja kwa moja na cha kawaida cha חֲמוֹר.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: wala kitu chochote kilicho cha jirani yako
  rationale: Kirai hiki ni hitimisho jumuishi linalohusu kila kitu kinachomilikiwa na jirani; muundo huu ni wa asili katika Kiswahili na huhifadhi nguvu ya umilikaji.
- source_word: לֹא ... לֹא
  choice: usitamani ... usitamani
  rationale: Kurudiwa kwa katazo kumehifadhiwa ili kuonyesha msisitizo na muundo wa Kiebrania.
theological_decisions:
- issue: Iwapo בֵּית katika kishazi cha kwanza itafsiriwe “nyumba” au “kaya”
  choice: nyumba
  alternative: kaya
  rationale: Ingawa בַּיִת inaweza kumaanisha kaya, aya hiyo kisha humtaja mke, watumwa na wanyama mmoja mmoja. “Nyumba” huepuka uradidi na kufuata mfululizo unaoonekana wa aya.
- issue: Uwasilishaji wa istilahi za utumwa katika sheria ya agano
  choice: mtumwa wa kiume / mtumwa wa kike
  alternative: mtumishi wa kiume / mtumishi wa kike
  rationale: Katika orodha hii ya kisheria, maneno עֶבֶד na אָמָה yanaonyesha wazi hadhi ya watu walio katika utumwa. “Mtumwa” haiufichi hali hiyo ya kijamii, huku viambishi vya jinsia vikihifadhi tofauti ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Katazo limetolewa kwa umoja kama katika Kiebrania. Muundo wa “wala” umehifadhi mfululizo wa orodha kwa usomaji wa kawaida. Hakuna tanbihi iliyowekwa kwa sababu maana mbadala ya “kaya” haionekani kuhitajika katika matini ya Kiswahili ya aya hii.
