base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/002.yaml
  text: I am Yahweh your God[a], who brought you out from the land of Egypt[b], from the house of servants.
translation:
  language: sw
  text: Mimi ni Yahwe[a], Mungu wako, niliyokutoa katika nchi ya Misri, katika nyumba ya watumwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni YHWH, jina ambalo kwa mapokeo limetafsiriwa “BWANA”; pia hutoholewa “Yahwe.”
    reason: alternative_reading
  - marker: b
    text: Kwa lugha ya kawaida zaidi, “katika nyumba ya utumwa.” Kiebrania ni, kihalisi, “katika nyumba ya watumwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Mimi ni
  rationale: Kiwakilishi huru cha nafsi ya kwanza kina mkazo katika Kiebrania. “Mimi ni” ni Kiswahili cha kawaida kinachohifadhi utambulisho huu wenye uzito.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo kama “BWANA”; tanbihi inaeleza mapokeo mengine.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ingawa umbo la אֱלֹהִים lina sura ya wingi, hapa linamtaja Mungu wa Israeli kwa umoja, pamoja na kiambishi cha nafsi ya pili umoja.
- source_word: אֲשֶׁר הוֹצֵאתִיךָ
  choice: niliyekutoa
  rationale: Umbo la Hifili la יצא humaanisha kusababisha mtu atoke, yaani kumtoa. Kiambishi “-liye-” kinaunganisha kwa kawaida na msemaji wa nafsi ya kwanza katika Kiswahili.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: “Katika” baada ya kitenzi “kutoa” huonyesha mahali alikotolewa mtu kwa Kiswahili cha kawaida, huku “nchi ya Misri” ikihifadhi muundo wa kijiografia wa Kiebrania.
- source_word: מִבֵּית עֲבָדִים
  choice: kutoka katika nyumba ya watumwa
  rationale: “Nyumba ya watumwa” inahifadhi taswira halisi ya Kiebrania yenye nomino ya wingi עֲבָדִים. “Kutoka katika” huweka wazi chanzo na kufanya kirai kisomeke kwa kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina la pekee YHWH, si cheo. Kulitaja “Yahwe” kunahifadhi tabia yake kama jina huku tanbihi ikitambua desturi nyingine za kulitafsiri.
- issue: Maana ya עֲבָדִים katika kifungo cha Misri
  choice: watumwa
  alternative: watumishi; utumwa
  rationale: Muktadha ni wa kifungo na kazi ya kulazimishwa, kwa hiyo “watumwa” linaonyesha hali ya kufungwa kwa usahihi kuliko “watumishi.” Taswira halisi haibadilishwi kimya kimya kuwa nomino dhahania “utumwa.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mimi ni” huhifadhi mkazo wa utambulisho bila kutumia mtindo wa kizamani; “nyumba ya watumwa” huhifadhi taswira thabiti ya chanzo huku tanbihi ikitoa maana ya kimuktadha.
