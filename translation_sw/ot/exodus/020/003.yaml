  text: You shall have no other gods before me[a].
translation:
  language: sw
  text: Usiwe na miungu mingine mbele yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kando yangu” au “katika uwepo wangu.” Kiebrania kinasema kihalisi “mbele ya uso wangu.”
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Usiwe na
  rationale: Muundo wa Kiebrania una maana halisi ya ‘haitakuwa kwako,’ lakini katika Kiswahili cha kawaida huonyesha umilikaji kwa njia ya ‘usiwe na,’ huku nguvu ya katazo na nafsi ya pili umoja vikihifadhiwa.
- source_word: אֱלֹהִים
  choice: miungu
  rationale: Nomino ya wingi, ikiambatana na ‘mingine,’ inarejelea miungu inayoshindana na Mungu; ‘miungu’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: אֲחֵרִים
  choice: mingine
  rationale: Kivumishi hiki humaanisha ‘mingine’ au ‘mwingine’; umbo la wingi ‘miungu mingine’ linafuata sarufi na maana ya chanzo bila kuongeza wazo la ‘kigeni.’
- source_word: עַל פָּנָי
  choice: mbele yangu
  rationale: Hii ndiyo tafsiri ya karibu na nahau ya Kiebrania, ambayo kihalisi husema ‘mbele ya uso wangu.’ Inahifadhi uwezekano wa maana ya kuwapo mbele za Mungu na wa kutokuwa na miungu mingine pamoja naye.
theological_decisions:
- issue: Maana ya עַל פָּנָי katika amri ya kwanza
  choice: mbele yangu
  alternative: isipokuwa mimi / mbele zangu
  rationale: Nahau ya Kiebrania inaweza kusisitiza kuwapo katika uwepo wa Mungu na, katika muktadha wa agano, kutengwa kwa miungu mingine. Maandishi makuu yanabaki karibu na picha ya chanzo, na tanbihi huhifadhi maana mbadala bila kuamua kimya-kimya mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. ‘Usiwe na’ ni muundo wa kawaida wa katazo kwa nafsi ya pili umoja; ‘mbele yangu’ huhifadhi nahau na utata halisi wa chanzo.
