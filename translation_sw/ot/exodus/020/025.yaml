id: EXO.20.25
reference: Exodus 20:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִם מִזְבַּ֤ח אֲבָנִים֙ תַּֽעֲשֶׂה לִּ֔/י לֹֽא תִבְנֶ֥ה אֶתְ/הֶ֖ן גָּזִ֑ית כִּ֧י חַרְבְּ/ךָ֛ הֵנַ֥פְתָּ עָלֶ֖י/הָ וַ/תְּחַֽלְלֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/025.yaml
  text: And if you make for me an altar of stones[a], you shall not build it of cut stones; for if you wield your sword on it[b], you will profane it.
translation:
  language: sw
  text: Na ukinitengenezea madhabahu ya mawe, usiijenge kwa mawe yaliyochongwa[a]; kwa maana ukiinua upanga wako juu yake[b], utaitia unajisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mawe yaliyokatwa au kufanyiwa kazi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “upanga wako”; katika muktadha huenda neno hilo linamaanisha chombo cha chuma kilichotumiwa kuyafanyia kazi mawe.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Na uki-
  rationale: Muundo huu huhifadhi kiunganishi pamoja na sharti, na unasikika kwa kawaida katika Kiswahili.
- source_word: מִזְבַּח אֲבָנִים
  choice: madhabahu ya mawe
  rationale: Hufuata wazi muundo wa Kiebrania na ni usemi wa kawaida wa Kiswahili.
- source_word: תַּעֲשֶׂה לִּי
  choice: ukinitengenezea
  rationale: Kauli ya kutendea inaonyesha kwamba madhabahu inatengenezwa kwa ajili ya msemaji bila kuongeza maana nyingine.
- source_word: לֹא תִבְנֶה אֶתְהֶן גָּזִית
  choice: usiijenge kwa mawe yaliyochongwa
  rationale: Amri hasi imetolewa kwa Kiswahili cha kawaida. Ingawa kiwakilishi cha Kiebrania ni cha wingi na kinarejelea mawe, Kiswahili huonyesha wazo hilo kwa kawaida kwa kusema madhabahu isijengwe kwa mawe yaliyofanyiwa kazi.
- source_word: חַרְבְּךָ
  choice: upanga wako
  rationale: Neno la Kiebrania kwa kawaida ni ‘upanga.’ Maana ya chombo cha chuma katika muktadha imeelezwa katika tanbihi badala ya kubadili neno kuu.
- source_word: הֵנַפְתָּ עָלֶיהָ
  choice: ukiinua ... juu yake
  rationale: Huhifadhi picha halisi ya kuinua au kutumia upanga juu ya mawe, huku tanbihi ikifafanua maana inayowezekana katika muktadha.
- source_word: וַתְּחַלְלֶהָ
  choice: utaitia unajisi
  rationale: Usemi huu unahifadhi wazo la kidini la kuondoa utakatifu au kunajisi kitu kilichowekwa wakfu, bila kulipunguza kuwa suala la uzuri au ufundi tu.
theological_decisions:
- issue: Sababu na hali ya kutiwa unajisi kwa madhabahu
  choice: Kutumia upanga au chombo cha chuma juu ya mawe kunaitia madhabahu unajisi katika maana ya ibada.
  alternative: Katazo linaweza kuhusishwa hasa na silaha na vurugu, au na kudumisha urahisi wa madhabahu.
  rationale: Kitenzi חלל kina maana inayohusu unajisi au kuvunja utakatifu. Hata hivyo, mstari hauelezi zaidi kwa nini tendo hilo lina matokeo hayo, kwa hiyo tafsiri haiongezi sababu ya kiteolojia ambayo haijasemwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Madhabahu’ na ‘kutia unajisi’ huhifadhi msamiati wa ibada kwa namna inayoeleweka, huku muundo wa sentensi ukiendelea kuwa wa kawaida kwa wasomaji wa leo.
