base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/010.yaml
  text: but the seventh day is a Sabbath to Yahweh your God[a]; you shall not do any work—you, or your son, or your daughter, your male servant, or your female servant, or your livestock[c][b], or the sojourner within your gates.
translation:
  language: sw
  text: Lakini[a] siku ya saba ni Sabato kwa Yahwe, Mungu wako. Usifanye kazi yoyote—wewe, wala mwanao, wala binti yako, wala mtumwa wako wa kiume, wala mtumwa wako wa kike[b], wala mifugo yako, wala mgeni wako mkazi[c] aliye ndani ya malango yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Na siku ya saba.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa kwa njia zote mbili; “lakini” huonyesha utofauti na siku sita za kufanya kazi katika mstari uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina maneno yanayomaanisha moja kwa moja “mtumwa wako wa kiume ... mtumwa wako wa kike.” Baadhi ya tafsiri hutumia “mtumishi” na “mjakazi.”
    reason: lexical_alternative
  - marker: c
    text: Au “mgeni mkazi.” Neno la Kiebrania ger humaanisha mtu asiye mzawa anayeishi miongoni mwa Waisraeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹם הַשְּׁבִיעִי
  choice: Lakini siku ya saba
  rationale: Kiunganishi וְ kinaweza kumaanisha “na,” lakini “lakini” huonyesha kwa kawaida zaidi utofauti kati ya siku sita za kufanya kazi katika mstari uliotangulia na siku ya saba.
- source_word: שַׁבָּת
  choice: Sabato
  rationale: Neno la mkopo “Sabato” limezoeleka katika Kiswahili na huhifadhi istilahi mahsusi badala ya kuifafanua tu kuwa siku ya kupumzika.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kwa ajili ya Yahwe Mungu wako
  rationale: Kihusishi לְ hapa huonyesha uhusiano au kuwekwa kwa siku hiyo kwa Yahwe; “kwa ajili ya” ni Kiswahili cha kawaida kinachohifadhi wazo hilo.
- source_word: יהוה
  choice: Yahwe
  rationale: Jina la agano lililoandikwa kwa herufi יהוה limetolewa kama jina binafsi “Yahwe,” bila kulibadili kuwa cheo.
- source_word: לֹא תַעֲשֶׂה כָל מְלָאכָה
  choice: Usifanye kazi yoyote
  rationale: Muundo wa katazo umetolewa kwa amri ya moja kwa moja ya Kiswahili, huku “yoyote” ikihifadhi nguvu pana ya כָל.
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: mtumwa wako wa kiume, wala mtumwa wako wa kike
  rationale: Maneno haya mawili, yakiwa jozi katika orodha ya watu wa nyumbani, yanaonyesha hadhi ya utumwa; tafsiri hii haisitiri hali hiyo ya kijamii.
- source_word: וּבְהֶמְתֶּךָ
  choice: mifugo yako
  rationale: בְּהֵמָה hapa ni jina la pamoja kwa wanyama wanaofugwa, hivyo “mifugo” ni sahihi na ya kawaida.
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: mgeni mkazi aliye malangoni mwako
  rationale: גֵּר humaanisha mtu asiye mzawa anayeishi miongoni mwa Israeli. “Malangoni mwako” huhifadhi nahau ya eneo lililo chini ya mamlaka ya mji au jamii.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Wigo wa katazo la kufanya kazi siku ya Sabato
  choice: Orodha imewahusisha wazi watoto, watumwa wa kiume na wa kike, mifugo na mgeni mkazi
  alternative: Kutumia neno pana kama “watu wa nyumbani”
  rationale: Kutaja kila kundi huhifadhi wigo kamili wa sheria na mvutano wa kihistoria wa makundi ya kijamii yaliyomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa sheria ya agano lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “si wewe, wala ...” unasisitiza kuwa katazo linamhusu mwenye nyumba pamoja na kila kundi lililotajwa. “Malangoni mwako” ni nahau ya kibiblia inayoashiria eneo la mji au jamii iliyo chini ya mamlaka yake.
