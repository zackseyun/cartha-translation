lexical_decisions:
- source_word: זָכוֹר
  choice: Ikumbuke
  rationale: Ni amri ya nafsi ya pili umoja inayodai kukumbuka kwa makusudi; kiambishi -i- kinarejelea siku ya Sabato inayofuata.
- source_word: אֶת
  choice: '[alama ya yambwa mahsusi, haijatafsiriwa kwa neno tofauti]'
  rationale: Hutambulisha yambwa mahsusi katika Kiebrania, lakini haina neno la lazima linalolingana nayo katika Kiswahili.
- source_word: יוֹם
  choice: siku
  rationale: Hii ndiyo maana ya kawaida na ya moja kwa moja ya יוֹם.
- source_word: הַשַּׁבָּת
  choice: ya Sabato
  rationale: Inarejelea siku maalumu ya mapumziko iliyotambuliwa katika agano; “Sabato” ni istilahi ya kibiblia iliyozoeleka katika Kiswahili.
- source_word: לְקַדְּשׁוֹ
  choice: na kuitenga kuwa takatifu
  rationale: 'Muundo huu unaonyesha kusudi au matokeo: siku ikumbukwe kwa kuitendea kama takatifu, yaani kuitenga kwa ajili ya Mungu. Tafsiri hii ni ya asili katika Kiswahili na huhifadhi wazo la utakatifu.'
theological_decisions:
- issue: Jinsi ya kutafsiri lugha ya קדשׁ katika amri kuhusu Sabato
  choice: na kuitenga kuwa takatifu
  alternative: ili kuitakasa; na kuidumisha kuwa takatifu
  rationale: Kiebrania kinaweza kumaanisha kuifanya au kuitendea siku kuwa takatifu, yaani kuiweka kando kwa kusudi takatifu. Chaguo hili huhifadhi uzito wa kitheolojia bila kupunguza amri kuwa kuadhimisha desturi tu, huku tanbihi ikihifadhi namna nyingine halali za kueleza maana hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Ikumbuke” huhifadhi nguvu ya amri ya Kiebrania; “Sabato” huhifadhi istilahi ya kibiblia iliyozoeleka.
