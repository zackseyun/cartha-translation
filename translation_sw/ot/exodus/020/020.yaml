base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/020.yaml
  text: And Moses said to the people[a], “Do not fear, for God has come to test you, and so that the fear of him may be before you[c][b], so that you may not sin.”
translation:
  language: sw
  text: Musa akawaambia watu, “Msiwe na hofu,[a] kwa maana Mungu amekuja kuwajaribu, ili hofu yake[b] iwe mbele yenu,[c] ili msitende dhambi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msiogope.” Kiebrania kinatumia mzizi uleule wa neno la hofu baadaye katika mstari huu (“hofu yake”), na hivyo kuleta utofauti wa makusudi kati ya hofu ya kutishika na kumcha Mungu ipasavyo.
    reason: lexical_alternative
  - marker: b
    text: Au, “uchaji kwake.” Neno la Kiebrania linaweza kumaanisha hofu au uchaji wenye heshima.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “juu ya nyuso zenu”; ni nahau ya jambo linalowekwa mbele ya mtu au linalodumu katika ufahamu wake.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: Msiogope
  rationale: Kitenzi ירא kinaweza kumaanisha kuogopa, kuwa na hofu, au kumcha kwa heshima kulingana na muktadha. Hapa uchaguzi huu unadumisha mzizi uleule wa maana unaotokea tena katika יִרְאָתוֹ, na hivyo kuhifadhi utofauti wa makusudi kati ya hofu ya kutishika na kumcha Mungu ipasavyo.
- source_word: לְבַעֲבוּר נַסּוֹת אֶתְכֶם
  choice: kuwajaribu
  rationale: נסה humaanisha kujaribu au kupima ili kuthibitisha. ‘Kuwajaribu’ ni Kiswahili cha kawaida na hakiongezi wazo la kuwashawishi kutenda uovu.
- source_word: בָּא הָאֱלֹהִים
  choice: Mungu amekuja
  rationale: Kauli timilifu inaonyesha kuja kwa Mungu ambako umuhimu wake unaendelea katika tukio la Sinai; ‘amekuja’ huwasilisha hilo kwa kawaida.
- source_word: יִרְאָתוֹ
  choice: kumcha yeye
  rationale: Nomino יִרְאָה inaweza kueleza hofu au uchaji wenye heshima. ‘Kumcha yeye’ ni usemi wa asili wa Kiswahili unaohifadhi uhusiano wa kileksia na ‘Msiogope’ bila kuamua kimya kimya kuwa maana ni heshima pekee au woga pekee.
- source_word: עַל־פְּנֵיכֶם
  choice: kuwe mbele yenu daima
  rationale: Kihalisi ni ‘juu ya nyuso zenu’; ni nahau ya jambo lililo mbele ya mtu au linalodumu katika ufahamu wake. ‘Kuwe mbele yenu daima’ huonyesha maana hiyo kwa Kiswahili kinachoeleweka.
- source_word: לְבִלְתִּי תֶחֱטָאוּ
  choice: kusudi msitende dhambi
  rationale: Muundo huu unaonyesha kusudi hasi. Tafsiri hii ni ya kawaida na inahifadhi wazi nguvu ya kusudi.
theological_decisions:
- issue: Mvutano kati ya katazo la kuogopa na kusudi la kumcha Mungu
  choice: 'Kutumia maneno ya mzizi mmoja wa Kiswahili: ‘Msiogope’ na ‘kumcha yeye’'
  alternative: ‘Msiwe na hofu’ na ‘heshima kwake’
  rationale: Kiebrania kinatumia mzizi mmoja katika sehemu zote mbili, kikitofautisha bila kufafanua moja kwa moja hofu ya kutishika na uchaji unaofaa. Tafsiri inadumisha mvutano huo badala ya kuutatua kiteolojia.
- issue: Asili ya kujaribiwa na Mungu
  choice: ‘kuwajaribu’ bila maelezo ya ziada ya kimaadili
  alternative: ‘kuwapima’ au ‘kuwathibitisha’
  rationale: Mstari unaonyesha jaribio lenye kusudi la kuwazuia wasitende dhambi; hauonyeshi ushawishi wa kutenda uovu. Neno la jumla ‘kujaribu’ linahifadhi maana bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Akawaambia’ hufuata mtiririko wa simulizi; ‘Msiogope’ na ‘kumcha’ huhifadhi mchezo na mvutano wa mzizi wa Kiebrania kwa namna ya asili katika Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
