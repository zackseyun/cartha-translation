lexical_decisions:
- source_word: לֹא
  choice: usi-
  rationale: Kikanushi cha Kiebrania לֹא pamoja na kitenzi cha nafsi ya pili huunda katazo la moja kwa moja. Katika Kiswahili, kiambishi hasi cha hali ya kutegemea “usi-” ndicho kinachotoa katazo hili kwa njia ya kawaida na yenye uzito.
- source_word: תִּגְנֹב
  choice: ibe
  rationale: Hii ni Qal imperfect nafsi ya pili umoja wa kiume ya גנב. Maana pana na ya kawaida hapa ni “kuiba.” Ingawa katika baadhi ya miktadha kitenzi hiki kinaweza kumaanisha kumwiba mtu, yaani kumteka nyara, mstari huu hautaji kitu kinachoibwa; kwa hiyo katazo la jumla “usiibe” linahifadhi ufupi na upana wa Kiebrania.
theological_decisions:
- issue: Namna ya kutoa katazo la Amri Kumi
  choice: Usiibe.
  alternative: Hutaiba.
  rationale: Muundo wa Kiebrania לֹא pamoja na imperfect ni katazo la moja kwa moja katika sheria ya agano. “Usiibe” ni Kiswahili sanifu, cha sasa, na chenye nguvu ya amri. “Hutaiba” linaweza kuhifadhi zaidi umbo la tamko la wakati ujao, lakini katika Kiswahili linaweza kusikika kama utabiri badala ya katazo.
translation_notes:
  register: Tafsiri ni fupi, yenye hadhi, na ya kawaida katika Kiswahili sanifu cha Afrika Mashariki. Inahifadhi mtindo mkato wa Amri Kumi bila kuongeza kitu kinachoibwa au kuifanya ihusu utekaji nyara pekee.
