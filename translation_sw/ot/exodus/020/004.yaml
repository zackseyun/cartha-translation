  text: לֹֽ֣א תַֽעֲשֶׂ֨ה לְ/ךָ֥ פֶ֨סֶל֙ וְ/כָל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/004.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[c][b], or in the waters under the earth.
translation:
  language: sw
  text: Usijitengenezee sanamu iliyochongwa[a], wala mfano wowote[b] wa chochote kilicho mbinguni juu, kilicho duniani chini, au kilicho majini chini ya dunia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanamu ya kuchongwa.” Neno la Kiebrania linamaanisha hasa sanamu inayotengenezwa kwa kuchongwa; “sanamu ya kuabudiwa” ingeongeza ufafanuzi.
    reason: lexical_alternative
  - marker: b
    text: Au, “umbo lolote” au “uwakilishi wowote.”
    reason: lexical_alternative
  - marker: c
    text: 'Mstari unaeleza maeneo ya uumbaji kwa lugha ya kikosmolojia ya nyakati za kale: mbingu zilizo juu, dunia iliyo chini, na maji yaliyo chini ya dunia.'
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: Usijitengenezee
  rationale: Kitenzi cha kukataza pamoja na kiwakilishi cha mhusika kinatolewa kwa katazo la moja kwa moja; umbo la kujirejelea linaonyesha maana ya ‘kwa ajili yako mwenyewe’ kwa Kiswahili cha kawaida.
- source_word: פֶסֶל
  choice: sanamu iliyochongwa
  rationale: Neno hili linataja hasa mfano uliotengenezwa kwa kuchongwa. Tafsiri hii ni sahihi zaidi kuliko ‘sanamu ya kuabudiwa,’ ambayo ingeongeza maana ya kimuktadha isiyotajwa wazi katika mstari huu.
- source_word: וְכָל תְּמוּנָה
  choice: wala mfano wowote
  rationale: תְּמוּנָה linaweza kumaanisha umbo, mfano, au uwakilishi. ‘Mfano wowote’ ni lugha ya sasa inayoeleweka na inadumisha upana wa neno la Kiebrania.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: wa chochote kilicho mbinguni juu
  rationale: Kirai hiki kinaonyesha kile kinachowakilishwa na mfano. ‘Mbinguni juu’ kinadumisha mpangilio wa mahali na lugha ya kikosmolojia ya maandishi.
- source_word: וַאֲשֶׁר בָּאָרֶץ מִתָּחַת
  choice: au duniani chini
  rationale: ‘Duniani’ ni tafsiri ya kawaida ya mahali kwa בָּאָרֶץ, na ‘chini’ inadumisha utofautishaji na ‘juu.’
- source_word: וַאֲשֶׁר בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: au majini chini ya dunia
  rationale: Tafsiri hii inadumisha taswira ya anga, dunia, na maji yaliyo chini ya dunia bila kuifafanua upya kwa mtazamo wa kisasa.
- source_word: וְ
  choice: wala / au
  rationale: Viunganishi vinavyorudiwa vinaunganisha vipengele vya orodha ya mambo yaliyokatazwa. ‘Wala’ baada ya katazo na ‘au’ katika orodha ni Kiswahili cha asili na huhifadhi uhusiano huo.
theological_decisions:
- issue: Upeo wa katazo la kutengeneza sanamu au mifano
  choice: Mstari umetafsiriwa kama katazo la kutengeneza sanamu iliyochongwa au mfano wa chochote katika viumbe, bila kuongeza ‘kwa kuabudiwa’ wala kudai wazi kuwa sanaa yote imekatazwa.
  alternative: Kutafsiri kuwa ni katazo la sanamu za kuabudiwa pekee, au kuwa ni katazo lisilo na mipaka dhidi ya uwakilishi wote wa kuonekana.
  rationale: Kiebrania kinataja sanamu iliyochongwa na mfano wowote kisha kinaorodhesha maeneo ya uumbaji. Muktadha wa kusujudu na kutumikia unakuja katika mstari unaofuata; kwa hiyo haujaongezwa hapa, na mvutano wa maana katika maandishi umehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa moja kwa moja, na unaoeleweka kwa wasomaji wa sasa. ‘Usijitengenezee’ ni la kawaida na linaonyesha לְךָ bila kuwa nzito; ‘mbinguni juu,’ ‘duniani chini,’ na ‘majini chini ya dunia’ vinahifadhi mpangilio wa kishairi na kikosmolojia wa Kiebrania.
