base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/007.yaml
  text: You shall not bear the name of Yahweh your God falsely[a], for Yahweh will not leave unpunished the one who bears his name falsely.
translation:
  language: sw
  text: Usibebe jina la Yahweh Mungu wako kwa ubatili[a], kwa maana Yahweh hatamwacha bila adhabu mtu anayebeba jina lake kwa ubatili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tafsiri za jadi husema, “Usilitaje bure jina la BWANA, Mungu wako.” Kiebrania kinasema kihalisi zaidi “kubeba/kuchukua jina ... kwa ubatili.” Hii inaweza kuhusisha kiapo cha uongo, kutumia jina hilo bila maana, au kumwakilisha Mungu kwa njia isiyofaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: ulibebe / anayelibeba
  rationale: Kitenzi נשא humaanisha kuinua, kubeba, au kuchukua. “Kulibeba jina” huhifadhi taswira halisi na marudio ya kitenzi katika sehemu zote mbili za mstari, huku kikiruhusu maana pana ya kujitambulisha au kujiwakilisha kwa jina hilo.
- source_word: שֵׁם
  choice: jina
  rationale: Ni tafsiri ya moja kwa moja; hapa “jina” linahusisha utambulisho, sifa, na mamlaka ya Mungu, si matamshi pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi usemi wa moja kwa moja wa nafsi ya pili umoja na uhusiano wa agano.
- source_word: לַשָּׁוְא
  choice: kwa ubatili
  rationale: שָׁוְא inaweza kumaanisha ubatili, utupu, udanganyifu, au jambo lisilo na thamani. “Kwa ubatili” huhifadhi upana huo na marudio ya kirai katika pande zote mbili za mstari.
- source_word: כִּי
  choice: kwa maana
  rationale: Huonyesha sababu au msingi wa katazo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יְנַקֶּה (נקה)
  choice: hatamwacha bila adhabu
  rationale: 'Huwasilisha wazi nguvu ya kimahakama ya kitenzi: Yahweh hatamhesabu mtu huyo kuwa hana hatia wala kumwacha bila matokeo ya kosa.'
- source_word: אֲשֶׁר
  choice: mtu anaye-
  rationale: Hurejelea mtu yeyote anayefanya jambo linalokatazwa, kwa mtindo wa asili wa Kiswahili.
- source_word: שְׁמוֹ
  choice: jina lake
  rationale: Huhifadhi wazi kiambishi cha nafsi ya tatu kinachorejelea jina la Yahweh.
theological_decisions:
- issue: Upeo wa katazo kuhusu jina la Mungu
  choice: Katazo pana dhidi ya kulibeba jina la Yahweh kwa ubatili, uongo, au namna isiyo na thamani
  alternative: Kulielewa kuwa katazo la viapo vya uongo pekee, au la kutamka jina kwa kukufuru pekee
  rationale: Muungano wa נשא (“kubeba”) na שֵׁם (“jina”) pamoja na שָׁוְא (“ubatili/utupu/uongo”) unaruhusu maana pana kuliko aina moja tu ya usemi. Tafsiri haifungi maana katika kiapo cha uongo au matamshi machafu pekee.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: “Yahweh” huhifadhi jina binafsi lililofunuliwa katika maandishi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kulibeba jina” limehifadhiwa kwa sababu linaakisi taswira ya Kiebrania na linaweza kueleweka pia kama kuwa mwakilishi wa jina hilo. “Kwa ubatili” ni pana kuliko “kwa uongo” pekee; tanbihi inafafanua upeo wake.
