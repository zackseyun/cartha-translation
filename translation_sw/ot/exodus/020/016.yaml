lexical_decisions:
- source_word: לֹא
  choice: usi-
  rationale: Kiambishi cha ukanushi katika hali ya kukataza kinaonyesha amri hasi ya moja kwa moja.
- source_word: תַעֲנֶה
  choice: usitoe ushahidi
  rationale: Katika muktadha wa kisheria, kitenzi ענה kinaweza kumaanisha kujibu au kutoa ushahidi; hapa maana ya kutoa ushahidi ndiyo inayofaa zaidi kwa sababu ya kirai עֵד שָׁקֶר.
- source_word: בְרֵעֲךָ
  choice: dhidi ya jirani yako
  rationale: רֵעַ humaanisha jirani au mtu mwenzako. Katika muktadha huu wa kisheria, ב inaonyesha mtu anayeathiriwa na ushahidi huo, hivyo “dhidi ya” ni ya asili na wazi.
- source_word: עֵד
  choice: ushahidi
  rationale: Ingawa neno hili linaweza kumaanisha shahidi, katika muundo huu linahusu ushahidi unaotolewa; Kiswahili cha sasa hueleza wazo hilo kwa kawaida kwa kusema “kutoa ushahidi.”
- source_word: שָׁקֶר
  choice: wa uongo
  rationale: שָׁקֶר huonyesha uongo au udanganyifu; “wa uongo” ni usemi wa kawaida na wenye uzito unaofaa katika mazingira ya kisheria.
