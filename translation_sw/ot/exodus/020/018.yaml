base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/018.yaml
  text: All the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
translation:
  language: sw
  text: Watu wote walikuwa wakiona[c] ngurumo[a], miali ya moto[b], sauti ya baragumu, na mlima ukifuka moshi. Watu walipoona hayo, wakatetemeka, wakasimama mbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi “sauti” au “sauti mbalimbali”; katika muktadha huu huenda ni ngurumo.
    reason: lexical_alternative
  - marker: b
    text: Au “mienge”; hapa neno hilo huenda linamaanisha miali ya moto iliyo kama umeme.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema watu walikuwa “wakiona” matukio yanayojumuisha sauti, na hivyo kuhifadhi tabia ya tukio inayohusisha hisi mbalimbali.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים
  choice: walikuwa wakiona
  rationale: Huhifadhi hali endelevu ya kitenzi kishirikishi na taswira ya Kiebrania inayochanganya milango ya fahamu.
- source_word: הַקּוֹלֹת
  choice: ngurumo
  rationale: Ingawa maana ya moja kwa moja ni ‘sauti’ au ‘sauti mbalimbali,’ katika tukio la Sinai wingi huu unaeleweka kwa kawaida kuwa ngurumo.
- source_word: הַלַּפִּידִם
  choice: miali ya moto
  rationale: Neno linaweza kumaanisha ‘mienge,’ lakini hapa linaonyesha miali yenye kung’aa kama umeme; tafsiri hii huhifadhi picha ya moto bila kuibana kuwa umeme pekee.
- source_word: קוֹל הַשֹּׁפָר
  choice: sauti ya baragumu
  rationale: ‘Baragumu’ ni neno la kawaida la Kiswahili kwa chombo hiki cha pembe, na muundo huu unaakisi kirai cha Kiebrania.
- source_word: הָהָר עָשֵׁן
  choice: mlima ukifuka moshi
  rationale: Ni usemi wa asili na wenye uhai unaowasilisha mlima ukiwa katika hali ya kutoa moshi.
- source_word: וַיַּרְא הָעָם
  choice: Watu walipoona hayo
  rationale: ‘Hayo’ hurejelea kwa pamoja matukio yaliyotajwa, huku ‘walipoona’ ikiunganisha kuyaona na mwitikio wao.
- source_word: וַיָּנֻעוּ
  choice: walitetemeka
  rationale: Huwasilisha kutikisika kwa hofu kwa Kiswahili cha kawaida.
- source_word: וַיַּעַמְדוּ מֵרָחֹק
  choice: kusimama mbali
  rationale: Hutoa moja kwa moja wazo la kujiondoa na kubaki katika umbali.
- source_word: וְכָל הָעָם
  choice: Watu wote
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayowahusu watu wa Israeli waliokusanyika.
theological_decisions:
- issue: Lugha ya hisi inayosema watu waliona mambo yanayosikika
  choice: Kudumisha usemi ‘walikuwa wakiona ngurumo’
  alternative: ‘Walisikia ngurumo’ au ‘walitambua matukio hayo’
  rationale: Kiebrania kinatumia kwa makusudi kitenzi cha kuona pamoja na sauti, kikionyesha ukubwa wa tukio la ufunuo; tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umegawanywa katika sentensi mbili kwa usomaji wa kawaida, bila kuondoa urudiaji wa ‘watu’ wala mchanganyiko wa hisi uliomo katika Kiebrania.
