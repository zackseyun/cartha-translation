  text: And they said to Moses[a], “You speak with us, and we will listen; but let not God speak with us, lest we die.”
translation:
  language: sw
  text: Wakamwambia Musa, “Wewe sema nasi, nasi tutasikiliza[a]; lakini Mungu asiseme nasi, tusije tukafa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tutasikia.” Kitenzi cha Kiebrania kinaweza kumaanisha kusikia, kusikiliza kwa makini, au kusikia kwa kuitikia kwa utiifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: Wakamwambia Mose
  rationale: Wayyiqtol inaendeleza simulizi, na muundo wa Kiswahili wa kumwambia mtu ni wa asili na unawakilisha אֶל kwa usahihi katika muktadha huu.
- source_word: דַּבֵּר אַתָּה עִמָּנוּ
  choice: Wewe sema nasi
  rationale: Kiwakilishi cha wazi אַתָּה kinasisitiza kwamba Mose ndiye aseme, si Mungu; “nasi” huhifadhi maana ya msingi ya עִם na uzito wa ombi.
- source_word: וְנִשְׁמָעָה
  choice: nasi tutasikiliza
  rationale: Umbo hili lina nguvu ya hiari au mwitikio baada ya amri. “Tutasikiliza” ni la kawaida na linaweza kudokeza kusikia kwa makini na kuitikia.
- source_word: וְאַל־יְדַבֵּר עִמָּנוּ אֱלֹהִים
  choice: lakini Mungu asiseme nasi
  rationale: אַל pamoja na kitenzi kisichotimilika huonyesha katazo au ombi lenye nguvu; “lakini” huweka wazi utofautishaji na ombi lililotangulia.
- source_word: פֶּן־נָמוּת
  choice: tusije tukafa
  rationale: Huu ni usemi wa asili wa Kiswahili unaoonyesha matokeo yanayoogopwa bila kuyafanya kuwa hakika.
theological_decisions:
- issue: Rejeleo na idadi ya אֱלֹהִים
  choice: Mungu katika umoja
  alternative: miungu
  rationale: Muktadha wa Sinai na kitenzi cha umoja vinaonyesha Mungu wa Israeli; tafsiri ya wingi haifai hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Wewe sema nasi” huhifadhi msisitizo wa Kiebrania; “tusije tukafa” huwasilisha kwa kawaida hofu iliyoletwa na פֶּן.
