lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Siku sita
  rationale: Muundo huu wa Kiebrania unaonyesha kipindi cha wakati moja kwa moja. Kiswahili sanifu hutumia kwa kawaida “Siku sita” bila kuongeza kihusishi.
- source_word: תַּעֲבֹד
  choice: utafanya kazi
  rationale: Kitenzi עבד katika muktadha huu humaanisha kufanya kazi au kuhudumu. “Utafanya kazi” ni kauli ya kawaida na yenye nguvu ya maagizo katika Kiswahili.
- source_word: וְעָשִׂיתָ
  choice: na kutenda
  rationale: Kitenzi עשה kina maana pana ya kufanya au kutenda. “Kutenda” hapa huepuka urudiaji usio wa lazima wa “kufanya” huku kikihifadhi tofauti ya kitenzi cha pili katika Kiebrania.
- source_word: כָּל
  choice: zote
  rationale: כָּל humaanisha yote au kila; “zote” inapatana kisarufi na “kazi zako.”
- source_word: מְלַאכְתֶּךָ
  choice: kazi zako
  rationale: מְלָאכָה huashiria kazi, shughuli, au jukumu. Wingi wa kawaida wa Kiswahili “kazi zako” unawasilisha maana ya jumla ya shughuli zote za mhusika.
theological_decisions:
- issue: Nguvu ya maagizo ya kitenzi kisichotimilika katika sheria ya Sabato
  choice: utafanya kazi
  alternative: unaweza kufanya kazi; inakupasa kufanya kazi
  rationale: Katika Amri Kumi, umbo hili ni agizo la agano, si utabiri wala ruhusa tu. Wakati ujao wa Kiswahili unaweza kubeba sauti hiyo ya amri kwa njia ya asili na yenye hadhi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inadumisha sauti ya kisheria ya amri na mfuatano wa vitenzi viwili vya Kiebrania bila kuwa nzito.
