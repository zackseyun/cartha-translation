  text: וְ/עֹ֥שֶׂה חֶ֖סֶד לַ/אֲלָפִ֑ים לְ/אֹהֲבַ֖/י וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/006.yaml
  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: sw
  text: lakini naonyesha upendo wa kudumu kwa maelfu[a], kwa wale wanaonipenda na kuzishika amri zangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa vizazi elfu moja” (linganisha Kumbukumbu la Torati 5:10); Kiebrania hapa kinasema tu “kwa maelfu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: lakini naonyesha
  rationale: Kiunganishi וְ katika muktadha huu kinaendeleza tofauti na hukumu iliyotajwa katika mstari uliotangulia; “lakini” huiweka wazi tofauti hiyo, huku “naonyesha” ikitoa maana ya kitendo endelevu cha עשה pamoja na חֶסֶד kwa Kiswahili cha kawaida.
- source_word: חֶסֶד
  choice: upendo wa kudumu
  rationale: חֶסֶד humaanisha upendo wenye uaminifu na fadhili katika uhusiano wa agano. “Upendo wa kudumu” ni wa kueleweka na huhifadhi wazo la uthabiti bila kuufupisha kuwa rehema peke yake.
- source_word: לַאֲלָפִים
  choice: kwa maelfu
  rationale: Kiebrania kinasema kihalisi “kwa maelfu” bila kutaja wazi “vizazi.” Tafsiri hii huhifadhi ufupi na uwezekano wa maana mbalimbali wa maandishi ya chanzo.
- source_word: לְאֹהֲבַי
  choice: kwa wale wanaonipenda
  rationale: Umbo la kisifa lenye kiambishi cha nafsi ya kwanza linatolewa kwa kishazi cha uhusiano kinachosikika kwa kawaida katika Kiswahili na kuonyesha uaminifu wa kimahusiano unaoendelea.
- source_word: וּלְשֹׁמְרֵי
  choice: na kuzishika
  rationale: שׁמר pamoja na amri ina maana ya kuzitii au kuzifuata. “Kuzishika” ni usemi wa kawaida wa kibiblia na wa sasa unaodumisha wazo la kuzitunza na kuzitii.
- source_word: מִצְוֺתָי
  choice: amri zangu
  rationale: “Amri” ni tafsiri ya kawaida na yenye hadhi ya מִצְוָה katika muktadha wa sheria ya agano; kiambishi “zangu” huhifadhi nafsi ya kwanza ya Kiebrania.
theological_decisions:
- issue: Upeo wa לַאֲלָפִים
  choice: kwa maelfu
  alternative: kwa vizazi elfu moja
  rationale: Mstari huu wa Kiebrania hauna neno linalomaanisha “vizazi.” Maandishi makuu hayaliongezi, lakini tanbihi inahifadhi ufafanuzi wa kivizazi unaowezekana kwa kuzingatia Kumbukumbu la Torati 5:10 na tofauti kati ya hukumu yenye mpaka na upendo mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; tanbihi huhifadhi utata halisi wa “maelfu” bila kuingiza neno “vizazi” katika maandishi makuu.
