  text: מִזְבַּ֣ח אֲדָמָה֮ תַּעֲשֶׂה לִּ/י֒ וְ/זָבַחְתָּ֣ עָלָ֗י/ו אֶת עֹלֹתֶ֨י/ךָ֙ וְ/אֶת שְׁלָמֶ֔י/ךָ אֶת צֹֽאנְ/ךָ֖ וְ/אֶת בְּקָרֶ֑/ךָ בְּ/כָל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אַזְכִּ֣יר אֶת שְׁמִ֔/י אָב֥וֹא אֵלֶ֖י/ךָ וּ/בֵרַכְתִּֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/024.yaml
  text: You shall make for me an altar of earth[a], and on it you shall sacrifice your burnt offerings and your peace offerings, your flock and your herd. In every place where I cause my name to be remembered, I will come to you and bless you.
translation:
  language: sw
  text: Utanitengenezea madhabahu ya udongo, na juu yake utatoa sadaka zako za kuteketezwa na sadaka zako za amani—mifugo yako midogo na ng’ombe wako. Kila mahali nitakapofanya jina langu likumbukwe[a], nitakujia na kukubariki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitakapolitangaza jina langu,” “nitakapofanya jina langu litajwe,” au “nitakapoliandika jina langu.” Kitenzi cha Kiebrania kina hali ya kusababisha (“kufanya likumbukwe/litajwe”); maana yake kamili inaweza kujumuisha kulitangaza, kuliweka kuwa kumbukumbu, au kulifanya litajwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח אֲדָמָה
  choice: madhabahu ya udongo
  rationale: Muundo huu unaonyesha madhabahu iliyotengenezwa kwa udongo; tafsiri hii ni halisi, wazi, na ya kawaida katika Kiswahili.
- source_word: תַּעֲשֶׂה לִּי
  choice: Utanitengenezea
  rationale: Kauli ya wakati ujao katika muktadha wa agizo imewasilishwa kama wajibu, huku kiambishi cha mtendewa kikihifadhi maana ya ‘kwa ajili yangu.’
- source_word: וְזָבַחְתָּ עָלָיו
  choice: na juu yake utatoa sadaka
  rationale: Katika muktadha wa ibada, זבח humaanisha kutoa dhabihu au sadaka. ‘Juu yake’ huweka wazi kuwa matoleo hayo yanatolewa madhabahuni.
- source_word: עֹלֹתֶיךָ
  choice: sadaka zako za kuteketezwa
  rationale: Hili ndilo neno linaloeleweka kwa sadaka zilizoteketezwa kabisa madhabahuni.
- source_word: שְׁלָמֶיךָ
  choice: sadaka zako za amani
  rationale: ‘Sadaka za amani’ huhifadhi uhusiano wa neno la Kiebrania na amani, ukamilifu, na hali njema bila kulifupisha kuwa ushirika pekee.
- source_word: אֶת צֹאנְךָ וְאֶת בְּקָרֶךָ
  choice: kondoo na mbuzi wako pamoja na ng’ombe wako
  rationale: צאן ni kundi la mifugo midogo, linaloweza kujumuisha kondoo na mbuzi, na בקר ni ng’ombe. Kutaja aina hizi ni wazi na sahihi kwa msomaji wa Kiswahili.
- source_word: בְּכָל הַמָּקוֹם
  choice: Katika kila mahali
  rationale: Huhifadhi maana ya ugawaji ya ‘kila mahali’ bila kupunguza upana wa kauli.
- source_word: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: nitakapofanya jina langu likumbukwe
  rationale: Huhifadhi hali ya kusababisha ya kitenzi cha Kiebrania na pia mamlaka ya Mungu katika kufanya jina lake likumbukwe, bila kuamua kuwa ni kutangaza, kuandika, au kulitaja tu.
- source_word: אָבֹא אֵלֶיךָ
  choice: nitakujia
  rationale: Ni Kiswahili cha asili kinachoonyesha kuja kwa Mungu kwa yule anayezungumziwa.
- source_word: וּבֵרַכְתִּיךָ
  choice: na kukubariki
  rationale: Muundo huu unaungana kwa urahisi na ‘nitakujia’ huku ukihifadhi nafsi ya kwanza kama mtendaji na nafsi ya pili kama mtendewa.
theological_decisions:
- issue: Maana ya tendo la Mungu katika אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: nitakapofanya jina langu likumbukwe
  alternative: nitakapolitangaza jina langu; nitakapoliandika jina langu; nitakapofanya jina langu litajwe
  rationale: Tafsiri iliyochaguliwa inadumisha hali ya kusababisha katika Kiebrania na mvutano kuhusu namna Mungu anavyofanya jina lake liwepo katika kumbukumbu na ibada, bila kufungamanisha mstari na utaratibu mmoja tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Istilahi za ibada ‘madhabahu,’ ‘sadaka za kuteketezwa,’ na ‘sadaka za amani’ zimetumiwa kwa uthabiti. Alama ya tanbihi imewekwa baada ya kishazi inachokifafanua, si baada ya ‘udongo.’
