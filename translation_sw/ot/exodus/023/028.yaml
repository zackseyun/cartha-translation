base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/028.yaml
  text: And I will send the hornet ahead of you[a], and it will drive out the Hivite, the Canaanite, and the Hittite from before you.
translation:
  language: sw
  text: Nitatuma mavu wakutangulie[a], nayo yatawafukuza Wahivi, Wakanaani, na Wahiti kutoka mbele yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda “mavu” ni taswira ya hofu au njia nyingine ya shinikizo la Mungu inayotumwa mbele ya Israeli; neno la Kiebrania kwa kawaida humaanisha mavu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: Nitatuma
  rationale: Kitenzi cha nafsi ya kwanza umoja, katika muktadha wa ahadi ya Mungu, kinaelezwa kwa wakati ujao. Kiswahili hakihitaji kiunganishi cha mwanzo hapa ili kudumisha mtiririko wa kawaida.
- source_word: הַצִּרְעָה
  choice: mavu
  rationale: Neno la Kiebrania kwa kawaida humaanisha mdudu anayeuma wa jamii ya nyigu au mavu. Uwingi wa Kiswahili “mavu” unatumiwa kwa maana ya kundi, bila kuhamisha tafsiri ya kitamathali kwenye matini kuu.
- source_word: לְפָנֶיךָ
  choice: mbele yako
  rationale: Huhifadhi taswira ya mahali na pia wazo la kutangulia kwa kitendo dhidi ya mataifa hayo.
- source_word: וְגֵרְשָׁה
  choice: nayo yatawafukuza
  rationale: Kitenzi גרשׁ humaanisha kufukuza au kuondoa kwa nguvu. Kiwakilishi na upatanisho wa wingi vinapatana kwa kawaida na “mavu” katika Kiswahili.
- source_word: הַחִוִּי
  choice: Wahivi
  rationale: Jina la kawaida la Kiswahili la kundi hili la watu; wingi unaonyesha kuwa jina la umoja la Kiebrania linawakilisha taifa zima.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Jina la kawaida la Kiswahili kwa watu wa Kanaani, limetolewa katika wingi wa kijamii.
- source_word: הַחִתִּי
  choice: Wahiti
  rationale: Jina la kawaida la Kiswahili la kundi hili la watu, likihifadhi sifa ya jina maalumu.
- source_word: מִלְּפָנֶיךָ
  choice: mbele yako
  rationale: Katika muundo wa Kiswahili, “yatawafukuza ... mbele yako” huwasilisha kwa kawaida kuondolewa kwao kutoka njia au uwepo wa Israeli, bila kutumia usemi mzito usio wa kawaida.
theological_decisions:
- issue: Ikiwa הַצִּרְעָה litafsiriwe kihalisi au kitamathali
  choice: Matini kuu imetumia maana ya kawaida ya kileksia, “mavu.”
  alternative: Inaweza kueleweka kuwa taswira ya hofu, taharuki, au njia nyingine ya shinikizo la Mungu.
  rationale: Maana ya kawaida ya neno la Kiebrania ni mdudu anayeuma. Tafsiri ya kitamathali haidaiwi wazi na mstari, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi badala ya kuamuliwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya makundi ya watu yametolewa kwa wingi wa kawaida wa Kiswahili. Usemi umerudia “mbele yako” ili kuhifadhi mwangwi wa vifungu viwili vya Kiebrania.
