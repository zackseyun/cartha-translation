- from: Mazao ya kwanza kabisa ya kwanza kutoka katika ardhi yako utayaleta katika nyumba ya Yahwe, Mungu wako.[a] Usimchemshe mwana-mbuzi katika maziwa ya mama yake.[b]
  to: Sehemu ya kwanza ya malimbuko ya ardhi yako utayaleta katika nyumba ya Yahwe, Mungu wako.[a] Usimchemshe mwana wa mbuzi katika maziwa ya mama yake.[b]
  rationale: The revision replaces an unnatural repetition with an idiomatic construct phrase that retains the source’s sense of the first portion of the firstfruits. It retains the draft’s accurate legal register, literal final prohibition, divine name rendering, and footnote anchor placement, while making footnote a a genuine alternative for “ardhi.”
  reviewer_model: gpt-5.6-terra
