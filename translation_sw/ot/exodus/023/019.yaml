base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/019.yaml
  text: The first of the firstfruits of your ground you shall bring into the house of Yahweh your God[b][a]. You shall not boil a young goat in its mother’s milk.
translation:
  language: sw
  text: Sehemu ya kwanza ya malimbuko ya ardhi yako utayaleta katika nyumba ya Yahwe, Mungu wako.[a] Usimchemshe mwana wa mbuzi katika maziwa ya mama yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sehemu ya kwanza ya malimbuko ya nchi yako.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mwana wa mbuzi,” yaani, mbuzi mchanga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: mazao ya kwanza kabisa ya kwanza
  rationale: Muundo huu unahifadhi msisitizo wa Kiebrania wa sehemu ya kwanza ya mazao ya kwanza, bila kuufasiri kimya-kimya kuwa 'bora zaidi'.
- source_word: אַדְמָתְךָ
  choice: ardhi yako
  rationale: Neno 'ardhi' linaonyesha udongo au eneo linalolimwa na linafaa kwa muktadha wa mazao, bila kulipanua kuwa nchi au taifa.
- source_word: תָּבִיא
  choice: utayaleta
  rationale: Wakati ujao wa Kiswahili hapa una nguvu ya agizo la sheria katika muktadha, huku kiambishi cha yambwa kikirejelea mazao.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: nyumba ya Yahwe, Mungu wako
  rationale: ‘Nyumba’ huhifadhi upana wa neno la Kiebrania kwa mahali patakatifu bila kulifanya hekalu la baadaye; jina la agano limetafsiriwa moja kwa moja kuwa Yahwe.
- source_word: לֹא תְבַשֵּׁל
  choice: usimchemshe
  rationale: Kitenzi hiki kinaeleza kuchemsha au kupika kwa maji; 'chemsha' ni sahihi zaidi kuliko 'pika' katika kishazi hiki.
- source_word: גְּדִי
  choice: mwana-mbuzi
  rationale: Hili ndilo maana ya kawaida ya neno katika muktadha huu, na ni wazi kwa msomaji wa Kiswahili kuliko istilahi isiyo maalumu ya mnyama mchanga.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: katika maziwa ya mama yake
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi taswira na uhusiano uliotajwa katika Kiebrania.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; 'Yahwe' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya katazo la kumchemsha mwana-mbuzi katika maziwa ya mama yake
  choice: Kuhifadhi katazo halisi bila kuongeza sababu yake
  alternative: Kulifafanua kuwa desturi ya Wakanaani, ukatili, au sheria ya kutenganisha vyakula
  rationale: Kiebrania kinatoa katazo lakini hakielezi sababu yake; tafsiri haipaswi kuamua jambo ambalo mstari wenyewe huliacha wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo usio wa kawaida kidogo ‘mazao ya kwanza kabisa ya kwanza’ umehifadhiwa ili kuonyesha msisitizo halisi wa רֵאשִׁית בִּכּוּרֵי; tanbihi inatoa usemi mwepesi zaidi.
