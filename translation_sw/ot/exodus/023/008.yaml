base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/008.yaml
  text: And you shall not take a bribe[b][a], for a bribe blinds the clear-sighted and twists the words of the righteous.
translation:
  language: sw
  text: Usipokee rushwa, kwa maana rushwa huwapofusha wenye kuona wazi[a] na huyapotosha maneno ya wenye haki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wenye utambuzi.” Kiebrania huhifadhi taswira ya kuona huku kikidokeza uwezo wa kutoa uamuzi mzuri.
    reason: lexical_alternative
  - marker: b
    text: “Maneno ya wenye haki” yanaweza pia kueleweka katika maana ya kisheria kuwa “kauli” au “shauri” la wale walio upande wa haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: rushwa
  rationale: Neno hili humaanisha malipo yanayotolewa ili kupotosha uamuzi; “rushwa” ndilo neno la kawaida, wazi, na lenye uzito wa kisheria na kimaadili katika Kiswahili.
- source_word: לֹא תִקָּח
  choice: usipokee
  rationale: Kauli hii ya sheria ni katazo kwa nafsi ya pili umoja. “Usipokee” ni ya asili katika Kiswahili na huonyesha si kuchukua tu bali kukubali rushwa.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya katazo na kudumisha mtiririko wenye hadhi wa lugha ya sheria.
- source_word: יְעַוֵּר
  choice: huwapofusha
  rationale: Huhifadhi taswira ya kusababisha upofu na maana yake ya kimfano ya kuharibu uwezo wa kutoa hukumu.
- source_word: פִּקְחִים
  choice: wenye kuona wazi
  rationale: Huhifadhi taswira ya Kiebrania ya kuona huku ikidokeza utambuzi na uamuzi mzuri; “wenye utambuzi” ni tafsiri inayowezekana lakini inaondoa taswira hiyo.
- source_word: וִיסַלֵּף
  choice: kupotosha
  rationale: Kitenzi hiki huonyesha kupinda au kugeuza kilicho sawa; “kupotosha” ni cha kawaida na kinafaa kwa maneno, ushahidi, au shauri la kisheria.
- source_word: דִּבְרֵי
  choice: maneno ya
  rationale: Neno la Kiebrania linaweza kumaanisha maneno, kauli, au mambo ya shauri. “Maneno ya” hudumisha upana wake bila kuifunga maana katika tafsiri moja ya kisheria.
- source_word: צַדִּיקִים
  choice: wenye haki
  rationale: Kauli hii inaweza kurejelea watu waadilifu au wale walio upande wa haki katika shauri. “Wenye haki” huhifadhi mwangwi wa kimaadili na wa kisheria.
theological_decisions:
- issue: Maana ya צַדִּיקִים katika muktadha wa hukumu
  choice: wenye haki
  alternative: walio na haki katika shauri
  rationale: Tafsiri iliyochaguliwa haifungi neno katika maana ya kisheria pekee, bali huhifadhi uwezekano wa maana ya maadili pia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Katazo limetolewa kwa umoja kama katika Kiebrania. Taswira ya upofu imehifadhiwa, na maelezo ya chini yanatunza maana mbadala za kimahakama bila kuzitia moja kwa moja katika matini.
