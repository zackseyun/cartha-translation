base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/016.yaml
  text: and the Feast of Harvest[a], the firstfruits of your labors, of what you sow in the field; and the Feast of Ingathering at the end of the year[c][b], when you gather in your labors from the field.
translation:
  language: sw
  text: na Sikukuu ya Mavuno[a], malimbuko ya mazao ya kazi zako, ya yale unayopanda shambani; na Sikukuu ya Kukusanya Mazao[c] mwishoni mwa mwaka[b], utakapokusanya mazao ya kazi zako kutoka shambani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Sherehe” badala ya “Sikukuu” katika sehemu zote mbili ambapo neno חַג limetumika.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “wakati mwaka unapotoka.”
    reason: lexical_alternative
  - marker: c
    text: “Kukusanya Mazao” hurejelea sikukuu inayoadhimisha kukusanywa kwa mazao kutoka shambani.
    reason: cultural_note
lexical_decisions:
- source_word: חַג
  choice: Sikukuu
  rationale: Neno hili linaonyesha sherehe maalumu ya kidini, yenye furaha na kwa kawaida iliyohusisha hija. “Sikukuu” ni neno la kawaida, lenye heshima, na linalofaa katika majina yote mawili.
- source_word: הַקָּצִיר
  choice: Mavuno
  rationale: Nomino hii inaweza kumaanisha kuvuna au mavuno. “Mavuno” ni ya asili zaidi katika jina la sikukuu na hudumisha muktadha wa kilimo.
- source_word: בִּכּוּרֵי
  choice: malimbuko
  rationale: “Malimbuko” ni istilahi ya kawaida ya kibiblia kwa sehemu ya kwanza ya mazao, yenye maana ya kilimo na ya utoaji kwa Mungu.
- source_word: מַעֲשֶׂיךָ
  choice: kazi zako / mazao ya kazi zako
  rationale: Kimsingi ni “kazi zako.” Mara ya kwanza tafsiri hiyo imedumishwa moja kwa moja; mara ya pili “mazao ya kazi zako” huweka wazi kile kinachokusanywa kutoka shambani bila kuondoa uhusiano wake na kazi ya mtu.
- source_word: אֲשֶׁר תִּזְרַע בַּשָּׂדֶה
  choice: ya yale unayopanda shambani
  rationale: Kauli hii ya uhusiano inaeleza chanzo cha malimbuko na inadumisha usemi wa moja kwa moja wa nafsi ya pili kwa Kiswahili cha asili.
- source_word: הָאָסִף
  choice: Kukusanya Mazao
  rationale: Nomino hii hutaja ukusanyaji wa mazao na, hapa, jina la sikukuu inayoadhimisha ukusanyaji huo. Kuongeza “Mazao” kunafanya maana iwe wazi kwa msomaji wa kawaida.
- source_word: בְּצֵאת הַשָּׁנָה
  choice: mwishoni mwa mwaka
  rationale: Kihalisi ni “wakati wa kutoka kwa mwaka,” lakini maana ya kawaida ya muda ni mwisho wa mwaka. Tafsiri hii ni wazi na ya asili.
- source_word: בְּאָסְפְּךָ
  choice: utakapokusanya
  rationale: Muundo wa kitenzi-jina pamoja na kihusishi una maana ya wakati hapa; “utakapokusanya” huiwasilisha kwa Kiswahili cha kawaida.
- source_word: מִן הַשָּׂדֶה
  choice: kutoka shambani
  rationale: Hii inadumisha kwa kawaida maana ya chanzo cha mahali katika Kiebrania.
