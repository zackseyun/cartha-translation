lexical_decisions:
- source_word: וְ/שֵׁשׁ שָׁנִים
  choice: Kwa miaka sita
  rationale: Kiunganishi pamoja na kipindi cha wakati kimetafsiriwa kwa Kiswahili cha kawaida kama kirai cha muda kinachoonyesha muda wa agizo.
- source_word: תִּזְרַע
  choice: utaipanda
  rationale: Kauli ya imperfect nafsi ya pili umoja ina nguvu ya agizo katika muktadha huu wa sheria; 'utaipanda' ni ya asili na inaonyesha kupanda mbegu katika ardhi.
- source_word: אַרְצֶךָ
  choice: ardhi yako
  rationale: Hapa אֶרֶץ ni ardhi ya mtu inayolimwa, si dunia kwa ujumla.
- source_word: וְאָסַפְתָּ
  choice: na kukusanya
  rationale: אָסַף humaanisha kukusanya; uchaguzi huu unadumisha upana wa neno la Kiebrania bila kulifinyanga kuwa tendo maalumu zaidi.
- source_word: תְּבוּאָתָהּ
  choice: mazao yake
  rationale: תְּבוּאָה hurejelea kile kinachozalishwa na ardhi. 'Mazao' ni neno la kawaida na pana katika Kiswahili, na 'yake' inarejelea ardhi.
