  yaml_path: translation/ot/exodus/023/023.yaml
  text: For my angel will go before you and bring you to the Amorites[a], the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites[b], and I will wipe them out.
translation:
  language: sw
  text: Kwa maana malaika wangu[a] atakutangulia na kukuleta kwa Waamori, Wahiti, Waperizi, Wakanaani, Wahivi na Wayebusi; nami nitawaangamiza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wangu.” Neno la Kiebrania מַלְאָךְ linaweza kumaanisha mjumbe wa kibinadamu au wa mbinguni; hapa “malaika” linafaa katika muktadha wa uongozi wa Mungu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kina kiambishi cha yambwa cha umoja, yaani “nitamwangamiza” au “nitakiangamiza,” lakini kinawarejelea kwa pamoja watu waliotajwa. Kiswahili kimetumia wingi: “nitawaangamiza.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza sababu au ufafanuzi wa ahadi na agizo lililotangulia kwa Kiswahili cha kawaida na chenye heshima.
- source_word: יֵלֵךְ ... לְפָנֶיךָ
  choice: atatangulia mbele yako
  rationale: Kitenzi cha hali isiyotimilika kina maana ya wakati ujao katika ahadi hii; msemo huu unaonyesha kutangulia na kuongoza.
- source_word: מַלְאָכִי
  choice: malaika wangu
  rationale: מַלְאָךְ inaweza kumaanisha mjumbe wa kibinadamu au wa mbinguni. Katika muktadha wa uongozi wa Mungu, 'malaika' linafaa, huku tanbihi ikihifadhi uwezekano wa 'mjumbe.'
- source_word: וֶהֱבִיאֲךָ
  choice: na kukuleta
  rationale: Hifili ya בוא ina maana ya kusababisha mtu aje, yaani kumleta; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: הָאֱמֹרִי ... וְהַיְבוּסִי
  choice: Waamori, Wahiti, Waperizi, Wakanaani, Wahivi na Wayebusi
  rationale: Majina ya makabila yametolewa katika maumbo ya kawaida ya Kiswahili; nomino za Kiebrania ziko katika umoja wa kijamii lakini zinarejelea makundi ya watu.
- source_word: וְהִכְחַדְתִּיו
  choice: nami nitawaangamiza
  rationale: Hifili ya כחד ina wazo la kusababisha kutoweka au kuharibu kabisa. Kiambishi cha Kiebrania ni cha umoja wa kijamii, lakini Kiswahili hutumia 'wa-' kwa kawaida kurejelea mataifa yote yaliyotajwa.
theological_decisions:
- issue: Utambulisho na asili ya מַלְאָכִי
  choice: malaika wangu
  alternative: mjumbe wangu; udhihirisho wa BWANA; Mwana kabla ya kufanyika mwili
  rationale: Aya yenyewe humtaja tu kama malaika au mjumbe wa Mungu. Tafsiri haimtambulishi zaidi ya ushahidi wa maandishi, hivyo haiamui fasiri za kiteolojia za baadaye.
- issue: Idadi ya yambwa katika וְהִכְחַדְתִּיו
  choice: nitawaangamiza
  alternative: nitamwangamiza/nitakiangamiza, kwa umoja wa kijamii
  rationale: Kiambishi cha Kiebrania ni cha umoja, lakini kinayachukulia kwa pamoja makundi ya watu yaliyotajwa. Wingi wa Kiswahili unawasilisha maana hiyo kwa ufasaha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unadumisha maana ya ahadi, orodha ya makabila, na utata wa neno 'malaika/mjumbe' bila kuingiza msimamo wa dhehebu.
