  source_fidelity: Mwanzo wa aya unafuata Kiebrania vizuri kwa kutofautisha kusujudia, kutumikia, na kufanya kama wao. Hata hivyo, 'sanamu zao' katika amri ya kwanza ya uharibifu ni ufafanuzi mwembamba usio katika neno la Kiebrania. Kiambishi cha kiume cha wingi kinafuata 'miungu yao' kisarufi, ingawa katika muktadha kinaweza kueleweka kwa njia ya kimetonimia kuhusu vitu au alama zao za ibada. Tafsiri iliyorekebishwa huhifadhi usemi huo bila kutaja sanamu mahsusi.
  naturalness: Matumizi ya 'usiitumikie' hayakubaliani na 'miungu yao' ya wingi; 'usizitumikie' ni sahihi. 'Usifanye kama matendo yao' ni ya moja kwa moja na ya kawaida zaidi kuliko 'usifuate matendo yao' kwa muundo wa Kiebrania. 'Kuvunja-vunja' ni ya asili, lakini muundo wa amri unakuwa wazi zaidi kwa vitenzi vilivyokamilika sambamba.
  terminology: '''Miungu,'' ''kusujudia,'' na ''kutumikia'' zinafaa na hudumisha tofauti za vitenzi vya Kiebrania. ''Nguzo zao za ibada'' ni tafsiri salama ya מַצֵּבֹתֵיהֶם; tanbihi ya ''mawe ... yaliyosimamishwa'' inafaa.'
