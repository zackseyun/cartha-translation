source:
  edition: WLC
  text: לֹֽא תִשְׁתַּחֲוֶ֤ה לֵ/אלֹֽהֵי/הֶם֙ וְ/לֹ֣א תָֽעָבְדֵ֔/ם וְ/לֹ֥א תַעֲשֶׂ֖ה כְּ/מַֽעֲשֵׂי/הֶ֑ם כִּ֤י הָרֵס֙ תְּהָ֣רְסֵ֔/ם וְ/שַׁבֵּ֥ר תְּשַׁבֵּ֖ר מַצֵּבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/024.yaml
  text: You shall not bow down to their gods[a], nor serve them, nor do according to their deeds; rather, you shall surely tear them down and surely shatter their pillars.
translation:
  language: sw
  text: Usivisujudie miungu yao, wala usizitumikie, wala usifanye kama matendo yao. Badala yake, utazibomoa kabisa, na utazivunja-vunja kabisa nguzo zao za ibada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawe yao matakatifu yaliyosimamishwa.” Neno la Kiebrania linamaanisha mawe au nguzo zilizosimamishwa kwa kusudi la ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: kuvisujudia
  rationale: Kitenzi kinaonyesha tendo halisi la kuinama au kujitupa chini kwa heshima. ‘Kuvisujudia’ huhifadhi tendo hilo katika muktadha wa ibada bila kulifanya tu kuwa neno la jumla ‘kuabudu.’
- source_word: לֵאלֹהֵיהֶם
  choice: miungu yao
  rationale: Kihusishi ל baada ya kitenzi cha kusujudu kinaeleweka kwa kawaida katika Kiswahili kupitia muundo ‘kuisujudia miungu yao.’ ‘Miungu’ inaonyesha miungu ya mataifa, si Mungu wa Israeli.
- source_word: תָעָבְדֵם
  choice: usiitumikie
  rationale: עבד ina maana ya kutumikia na katika muktadha huu inahusisha huduma ya kidini. ‘Kuitumikia’ huhifadhi maana yake pana na kuitofautisha na tendo la kusujudu.
- source_word: תַעֲשֶׂה כְּמַעֲשֵׂיהֶם
  choice: usifuate matendo yao
  rationale: Kwa neno ni ‘usifanye sawasawa na matendo yao.’ ‘Usifuate matendo yao’ ni Kiswahili cha kawaida kinachoeleza kuiga desturi na matendo yao, hasa ya kidini.
- source_word: כִּי
  choice: Badala yake
  rationale: Hapa כִּי inaleta tofauti kali kati ya mambo yaliyokatazwa na hatua iliyoamriwa; ‘Badala yake’ huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: הָרֵס תְּהָרְסֵם
  choice: lazima ubomoe kabisa sanamu zao
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichopigwa huongeza mkazo. ‘Lazima ... kabisa’ huonyesha amri yenye nguvu. Neno ‘sanamu’ linaweka wazi kuwa kinachobomolewa ni vitu vya ibada vinavyowakilisha miungu, si miungu yenyewe kama viumbe vinavyoweza kubomolewa.
- source_word: וְשַׁבֵּר תְּשַׁבֵּר
  choice: na kuvunjavunja kabisa
  rationale: Muundo huu pia unasisitiza tendo. ‘Kuvunjavunja kabisa’ unafaa kwa uharibifu wa mawe au nguzo za ibada na huhifadhi mkazo.
- source_word: מַצֵּבֹתֵיהֶם
  choice: nguzo zao za ibada
  rationale: מַצֵּבָה ni jiwe lililosimamishwa au nguzo yenye matumizi ya kidini. ‘Nguzo za ibada’ ni wazi na ya asili kwa msomaji wa kisasa; tanbihi huhifadhi mbadala halisi zaidi.
theological_decisions:
- issue: Aina ya matendo yaliyokatazwa kuelekea miungu ya kigeni
  choice: Kutofautisha kati ya kuisujudia na kuitumikia miungu hiyo
  alternative: Kutafsiri vitenzi vyote kwa lugha ya jumla ya kuabudu
  rationale: Kiebrania kinatumia vitenzi viwili tofauti. Kuvihifadhi huonyesha kwamba heshima ya nje na utumishi wa kidini unaoendelea vyote vimekatazwa.
- issue: Kinacholengwa na amri za kubomoa
  choice: Sanamu na vifaa vingine vya ibada vya mataifa
  alternative: Kuchukulia kiambishi cha ‘kuwabomoa’ kuwa kinarejelea miungu yenyewe kwa maana ya mfano
  rationale: Mstari unaelekea kutoka kwa miungu na matendo ya waabudu wake hadi kwa vitu vinavyoonekana vya ibada, hasa nguzo. ‘Sanamu zao’ huepuka kudokeza kuwa miungu yenyewe inabomolewa kihalisi huku ikihifadhi mashambulizi makali dhidi ya ibada ya sanamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida. Mkazo wa miundo miwili ya Kiebrania umeonyeshwa kwa ‘lazima’ na ‘kabisa,’ huku vitenzi vya kusujudu na kutumikia vikibaki tofauti.
