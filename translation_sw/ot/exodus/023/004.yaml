base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/004.yaml
  text: If you come upon your enemy’s ox or his donkey going astray[a], you must surely return it to him.
translation:
  language: sw
  text: Ukikuta ng’ombe wa adui yako au punda wake amepotea njia[a], lazima umrudishe kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anatangatanga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ukikuta
  rationale: Katika sheria hii כִּי inaanzisha sharti la tukio; muundo wa Kiswahili wenye ki- katika ‘ukikuta’ unaeleza kwa kawaida maana ya ‘ikiwa/wakati unapokuta’ bila kulazimisha tofauti ambayo muktadha hauamui kabisa.
- source_word: תִפְגַּע
  choice: kuta
  rationale: פגע hapa ni kukutana na kitu bila kukitafuta; ‘kuta’ ni ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: שׁוֹר humaanisha mnyama wa jamii ya ng’ombe katika mazingira ya kilimo. ‘Ng’ombe’ ni neno la kawaida na linaloeleweka, bila kubainisha jinsia au hali ya kuhasiwa ambayo aya haitilii mkazo.
- source_word: אֹיִבְךָ
  choice: wa adui yako
  rationale: Neno אֹיֵב ni ‘adui’; tafsiri hii inadumisha wazi mvutano wa kimaadili wa kumtendea mema adui.
- source_word: חֲמֹרוֹ
  choice: punda wake
  rationale: חֲמוֹר ni neno la kawaida kwa punda, na kiwakilishi cha umilikaji kinamrejelea adui.
- source_word: תֹּעֶה
  choice: amepotea njia
  rationale: Kitenzi תעה kinaeleza kupotoka au kutanga mbali na njia inayofaa. ‘Amepotea njia’ ni Kiswahili cha kawaida kinachoonyesha hali ya mnyama bila kudai kuwa hawezi kupatikana.
- source_word: הָשֵׁב תְּשִׁיבֶנּוּ
  choice: lazima umrudishe
  rationale: Muundo wa infinitivi kamili pamoja na kitenzi kilichopigwa huimarisha wajibu. ‘Lazima umrudishe’ huwasilisha amri na msisitizo wake kwa Kiswahili cha asili.
- source_word: לוֹ
  choice: kwake
  rationale: Kiwakilishi kinamrejelea adui mwenye mnyama; ‘kwake’ kinadumisha rejeo hilo moja kwa moja bila kuongeza neno ‘mwenyewe’ au ‘mwenye mnyama.’
theological_decisions:
- issue: Wajibu wa kimaadili kwa adui
  choice: Kudumisha neno ‘adui’ na amri ya kumrudishia mnyama wake.
  alternative: Kulainisha uhusiano kwa kutumia ‘jirani’ au ‘anayekuchukia.’
  rationale: Kiebrania kinasema wazi ‘adui yako.’ Tafsiri haiondoi mvutano wa kutenda haki na rehema kwa mpinzani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Ukikuta’ ni wa kawaida katika masharti ya kisheria, na ‘lazima’ huonyesha nguvu ya amri ya Kiebrania bila lugha nzito isiyo ya asili.
