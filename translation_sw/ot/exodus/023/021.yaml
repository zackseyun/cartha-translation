base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/021.yaml
  text: Be on your guard before him[a], and listen to his voice. Do not rebel against him, for he will not pardon your transgression, because my name is within him.
translation:
  language: sw
  text: Jihadhari mbele yake, na uisikilize sauti yake. Usimwasi, kwa maana hatawasamehe kosa lenu, kwa sababu jina langu liko ndani yake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jina langu limo ndani yake,” au “jina langu liko juu yake”; kwa tafsiri yenye ufafanuzi zaidi, “anabeba jina langu.” Usemi huu unaonyesha mamlaka ya Mungu aliyokabidhiwa, lakini aya haielezi wazi asili halisi ya mhusika huyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר מִפָּנָיו
  choice: Jihadhari mbele yake
  rationale: Kauli ya amri inaonya mtu awe mwangalifu akiwa mbele yake. Tafsiri hii huhifadhi uzito wa onyo na maana ya kimahusiano ya מִפָּנָיו bila kuifanya kuwa hofu tu.
- source_word: וּשְׁמַע בְּקֹלוֹ
  choice: na uisikilize sauti yake
  rationale: Muundo wa Kiebrania unaweza kumaanisha kusikiliza kwa kutii. Maneno haya yanahifadhi taswira ya ‘sauti’ huku muktadha ukidokeza wajibu wa kutii.
- source_word: אַל תַּמֵּר בּוֹ
  choice: Usimwasi
  rationale: Kitenzi מרה huonyesha uasi au ukaidi dhidi ya mamlaka. ‘Usimwasi’ ni Kiswahili cha kawaida, chenye nguvu, na kinafaa kwa onyo hili la agano.
- source_word: לֹא יִשָּׂא לְפִשְׁעֲכֶם
  choice: hatawasamehe makosa yenu
  rationale: נשא pamoja na neno la kosa inaweza kumaanisha kuondoa au kusamehe kosa. ‘Hatawasamehe’ huwasilisha maana hiyo ya msamaha wazi; ‘makosa yenu’ hudumisha umoja wa mkusanyiko wa Kiebrania kwa mtindo wa kawaida wa Kiswahili.
- source_word: שְׁמִי בְּקִרְבּוֹ
  choice: jina langu limo ndani yake
  rationale: ‘Limo ndani yake’ hufuata kwa karibu maana ya בְּקִרְבּוֹ, yaani ‘ndani yake/katikati yake,’ na huepuka kufafanua kupita kiasi jinsi jina la Mungu linavyohusiana na mjumbe huyo.
theological_decisions:
- issue: Asili ya mjumbe na maana ya ‘jina langu limo ndani yake’
  choice: Kuhifadhi kauli yenyewe bila kuamua asili halisi ya mjumbe huyo.
  alternative: Kusema wazi kwamba mjumbe anabeba mamlaka ya Mungu, au kwamba yeye ni udhihirisho wa moja kwa moja wa uwepo wa BWANA.
  rationale: Aya inamhusisha mjumbe huyo na jina na mamlaka ya Mungu kwa namna nzito, lakini haifafanui moja kwa moja asili yake. Tafsiri hiyo huhifadhi mvutano huu wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Usimwasi’ ni fupi na ya kawaida; ‘jina langu limo ndani yake’ huhifadhi usemi mzito na wenye utata wa kimakusudi wa Kiebrania.
