  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ/דְּבַר שֶׁ֖קֶר תִּרְחָ֑ק וְ/נָקִ֤י וְ/צַדִּיק֙ אַֽל תַּהֲרֹ֔ג כִּ֥י לֹא אַצְדִּ֖יק רָשָֽׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/007.yaml
  text: Keep far from a false matter[a], and do not kill the innocent and the righteous[b], for I will not justify the wicked.
translation:
  language: sw
  text: Jiepushe kabisa na jambo la uongo,[a] wala usimuue mtu asiye na hatia na aliye mwadilifu, kwa maana sitamtangaza mwovu kuwa mwadilifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shauri la uongo,” “shtaka la uongo,” au “uongo.” Neno la Kiebrania lililotafsiriwa “jambo” ni pana, na linaweza kujumuisha ushahidi wa uongo au kesi yenye udanganyifu.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa maana sitamwachilia mwenye hatia.” Kitenzi cha Kiebrania ni cha kimahakama na kinaweza kumaanisha “kumtangaza kuwa mwadilifu,” “kumhesabia haki,” au “kumwachilia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/דְּבַר שֶׁקֶר
  choice: na jambo la uongo
  rationale: דָּבָר ni neno pana linaloweza kumaanisha neno, jambo, shauri, au kesi. Katika muktadha huu wa kisheria, “jambo la uongo” huhifadhi upana huo bila kulibana kuwa shtaka pekee.
- source_word: תִּרְחָק
  choice: Jiepushe kabisa
  rationale: Kitenzi hiki kinaagiza mtu akae mbali na jambo hilo. “Jiepushe kabisa” ni Kiswahili cha kawaida kinachoonyesha kujitenga nalo kwa makusudi.
- source_word: וְ/נָקִי
  choice: mtu asiye na hatia
  rationale: נָקִי humaanisha asiye na hatia au asiye na kosa; usemi huu unaeleweka wazi katika muktadha wa hukumu.
- source_word: וְ/צַדִּיק
  choice: aliye mwadilifu
  rationale: צַדִּיק humaanisha mwenye haki au mwadilifu. “Aliye mwadilifu” huhifadhi maana ya kimaadili na ya kisheria pamoja na uhusiano wake na mzizi צדק.
- source_word: אַל תַּהֲרֹג
  choice: wala usimuue
  rationale: הרג ni kitenzi cha jumla cha kuua. Tafsiri hii haiongezi dhana maalumu ya nia kama ingefanywa na neno linalomaanisha kuua kwa jinai pekee.
- source_word: לֹא אַצְדִּיק
  choice: sitamtangaza ... kuwa mwadilifu
  rationale: 'Hiphil ya צדק hapa ni ya kimahakama: kumtangaza mtu kuwa mwenye haki au kumwachilia kwa kutokuwa na hatia. “Kumtangaza kuwa mwadilifu” huhifadhi uhusiano wa kileksia na צַדִּיק katika kishazi kilichotangulia.'
- source_word: רָשָׁע
  choice: mwovu
  rationale: רָשָׁע inaweza kumaanisha mwovu au mwenye hatia katika mazingira ya kimaadili na kisheria. “Mwovu” huhifadhi maana yake pana, huku maana ya “mwenye hatia” ikitajwa katika tanbihi.
theological_decisions:
- issue: Maana ya kimahakama ya kauli ya Mungu
  choice: kwa maana sitamtangaza mwovu kuwa mwadilifu
  alternative: kwa maana sitamwachilia mwenye hatia
  rationale: Kauli hiyo inaweka msingi wa amri katika tabia ya Mungu kama hakimu. Tafsiri iliyochaguliwa huhifadhi maana ya tamko la kimahakama na pia mwangwi wa mzizi mmoja kati ya צַדִּיק na אַצְדִּיק; tafsiri mbadala ya kimahakama imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Jiepushe kabisa” hutoa nguvu ya agizo kwa njia ya asili; “jambo la uongo” huhifadhi upana wa Kiebrania; na “sitamtangaza ... kuwa mwadilifu” huhifadhi mvutano wa kimahakama na uhusiano wa maneno ya mzizi צדק.
