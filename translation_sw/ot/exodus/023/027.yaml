  yaml_path: translation/ot/exodus/023/027.yaml
  text: I will send my terror ahead of you[a], and I will throw into confusion all the people among whom you come[c][b], and I will make all your enemies turn their backs to you.
translation:
  language: sw
  text: Nitatuma utisho wangu mbele yako[a], nami nitawavuruga[b] watu wote ambao utaingia miongoni mwao, nami nitawafanya adui zako wote wakugeuzie kisogo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hofu yangu kuu” au “woga wangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nitawatia katika taharuki” au “nitawachanganya.”
    reason: lexical_alternative
  - marker: c
    text: Kwa neno kwa neno, “nitawapa adui zako wote kwako wakiwa kisogo/shingo.” Huu ni msemo wa Kiebrania unaomaanisha kwamba watageuka na kukukimbia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵימָתִי
  choice: utisho wangu
  rationale: Neno אֵימָה linaonyesha utisho, hofu kuu, au woga unaosababisha taharuki. “Utisho wangu” linahifadhi kiambishi cha umilikaji na wazo la utisho unaotumwa na Mungu.
- source_word: אֲשַׁלַּח לְפָנֶיךָ
  choice: nitatuma ... mbele yako
  rationale: Muundo huu unaonyesha kutuma kitu kitangulie mbele ya mtu; tafsiri hii ni ya kawaida na inahifadhi mwelekeo wa Kiebrania.
- source_word: וְהַמֹּתִי
  choice: nitawavuruga
  rationale: Kitenzi המם hapa kina maana ya kusababisha vurugu, taharuki, au kuchanganyikiwa. “Nitawavuruga” kinahifadhi tendo la moja kwa moja la Mungu bila kuongeza kwa lazima wazo la kushindwa vitani.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Ingawa עָם ni umoja katika Kiebrania, hapa linatumika kwa maana ya mkusanyiko wa watu watakaokabiliwa.
- source_word: אֲשֶׁר תָּבֹא בָהֶם
  choice: utakaoingia kati yao
  rationale: Kihusishi ב kinaonyesha kuingia miongoni mwao. “Kati yao” kinahifadhi maana hiyo bila kuingiza maana ya “dhidi yao.”
- source_word: וְנָתַתִּי ... אֵלֶיךָ עֹרֶף
  choice: kuwafanya ... wakugeuzie kisogo
  rationale: Huu ni msemo wa Kiebrania unaoonyesha maadui kugeuka na kukimbia. “Kugeuzia kisogo” linahifadhi picha ya asili na linaeleweka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Utendaji wa Mungu katika kusababisha hofu na ushindi wa kivita
  choice: 'Kauli zimewekwa katika nafsi ya kwanza, Mungu akiwa mtendaji wa moja kwa moja: “Nitatuma,” “nitawavuruga,” na “kuwafanya.”'
  alternative: Kutumia kauli zisizo za moja kwa moja ambazo zingepunguza dhima ya Mungu katika matendo hayo.
  rationale: Vitenzi vya Kiebrania vinamtaja Mungu moja kwa moja kuwa mtendaji. Tafsiri hailainishi wala kupanua dai hilo la kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Kugeuzia kisogo” ni msemo wa kawaida unaohifadhi picha ya Kiebrania; alama zote za tanbihi zimewekwa kwenye vifungu vinavyohusika.
