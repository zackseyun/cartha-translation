  verdict: revise
  source_fidelity: The draft accurately conveys the frequency, annual setting, festal observance, and direction to God. However, the Hebrew verb תָּחֹג is second-person masculine singular, whereas “mtaniadhimishia” is second-person plural in Swahili.
  naturalness: “Mara tatu kwa mwaka utaniadhimishia sikukuu” is natural, clear Standard East African Swahili and retains the legal address and source order well.
  terminology: “Kuadhimisha sikukuu” appropriately renders חגג in this legal-festal context. The indirect-object form “-ni-...-ia” suitably represents “to/for me.” The footnote correctly preserves the literal lexical sense and explains the idiom.
  issues:
  - severity: medium
    issue: Person-number mismatch in “mtaniadhimishia.”
    rationale: The prefix m- addresses more than one person, but תָּחֹג is singular (“you,” addressed to Moses/Israel as a singular legal addressee). It should be “utaniadhimishia.”
  - severity: low
    issue: Footnote wording is slightly awkward.
    rationale: “Mara tatu za sikukuu za hija” can be read as modifying the festivals rather than identifying the three annual pilgrimage-festival occasions. “Nyakati tatu za sikukuu za hija katika mwaka” is clearer.
