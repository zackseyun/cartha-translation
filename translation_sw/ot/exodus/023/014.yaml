  text: Three times in the year you shall keep a feast to me[a].
translation:
  language: sw
  text: Mara tatu kwa mwaka utaniadhimishia sikukuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “miguu mitatu.” Nahau hii ya Kiebrania hurejelea nyakati tatu za sikukuu za hija katika mwaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ רְגָלִים
  choice: Mara tatu
  rationale: Ingawa רְגָלִים kwa kawaida humaanisha ‘miguu,’ katika nahau hii maneno hayo yanaonyesha mara au vipindi vitatu vya sikukuu za hija kwa mwaka. ‘Mara tatu’ ni Kiswahili cha kawaida na sahihi katika muktadha.
- source_word: תָּחֹג
  choice: mtaniadhimishia sikukuu
  rationale: Kitenzi חגג humaanisha kuadhimisha au kusherehekea sikukuu. Muundo huu unahifadhi wazo la ibada ya sikukuu na pia unaunganisha kwa kawaida kiambishi cha nafsi ya pili umoja na לִי.
- source_word: לִי
  choice: -ni- ... -ia
  rationale: לִי huonyesha kwamba sikukuu hiyo inaelekezwa kwa Mungu. Kiswahili ‘mtaniadhimishia’ kinatoa maana ya ‘mtaniadhimishia mimi’ kwa njia ya asili bila kuongeza msisitizo usio katika Kiebrania.
- source_word: בַּשָּׁנָה
  choice: kwa mwaka
  rationale: ‘Kwa mwaka’ ni usemi wa kawaida wa Kiswahili unaoonyesha marudio ndani ya kila mwaka, huku ukibaki karibu na maana ya Kiebrania ‘katika mwaka.’
theological_decisions: []
translation_notes:
  register: Lugha ni ya kawaida, yenye heshima na inayofaa sheria ya agano. ‘Kuadhimisha sikukuu’ ni wazi kwa wasomaji wa kisasa; ‘mtaniadhimishia’ huhifadhi usemi wa Mungu kwa mtu mmoja katika Kiebrania.
