base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/005.yaml
  text: If you see the donkey of one who hates you lying down under its load[a], and would refrain from helping him[b], you must surely help with him.
translation:
  language: sw
  text: Ukimwona punda wa mtu anayekuchukia amelala chini ya mzigo wake, nawe ukataka kujizuia kumsaidia[b], ni lazima umsaidie pamoja naye[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pamoja na punda huyo,” yaani umsaidie punda huyo kwa mzigo wake. Kiwakilishi cha Kiebrania cha mwisho kinaweza kumrejelea mwenye punda au punda mwenyewe.
    reason: alternative_reading
  - marker: b
    text: Kitenzi cha Kiebrania kwa kawaida humaanisha “kuacha” au “kutelekeza.” Katika muktadha huu, muundo huu unaeleweka kuwa wa kujizuia kutoa msaada; amri inayofuata husisitiza kwamba msaada unapaswa kutolewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Uki-
  rationale: Katika sheria hii כִּי inaanzisha hali ya sharti; kiambishi cha masharti “uki-” ni cha kawaida na cha asili katika Kiswahili.
- source_word: תִרְאֶה
  choice: -mwona
  rationale: Huhifadhi maana ya moja kwa moja ya ראה, “kuona,” bila kuongeza wazo la kukutana naye kwa bahati.
- source_word: חֲמוֹר
  choice: punda
  rationale: Ni neno la kawaida na wazi la Kiswahili kwa mnyama huyu.
- source_word: שֹׂנַאֲךָ
  choice: mtu anayekuchukia
  rationale: Huhifadhi nguvu ya kihusishi cha Kiebrania, yaani mtu anayekuchukia, badala ya kupanua maana kuwa “adui yako.”
- source_word: רֹבֵץ
  choice: amelala
  rationale: Hutoa picha ya mnyama aliye chini akiwa amejilaza; muktadha unaonyesha kuwa mzigo ndio unaomlemea bila kulazimisha neno “ameanguka.”
- source_word: תַּחַת מַשָּׂאוֹ
  choice: chini ya mzigo wake
  rationale: Ni Kiswahili cha kawaida kinachoonyesha punda akiwa chini ya mzigo anaoubeba.
- source_word: וְחָדַלְתָּ מֵעֲזֹב לוֹ
  choice: nawe ukataka kujizuia kumsaidia
  rationale: Muundo ni mgumu; tafsiri hii huonyesha uwezekano au mwelekeo wa kutotoa msaada, bila kuufanya kuwa taarifa tambarare kwamba tayari amekataa.
- source_word: עָזֹב תַּעֲזֹב
  choice: ni lazima umsaidie
  rationale: Jina-jitenzi pamoja na kitenzi husisitiza amri. Katika muktadha huu עזב ina maana ya kusaidia badala ya maana yake ya kawaida, “kuacha.”
- source_word: עִמּוֹ
  choice: pamoja naye
  rationale: Kiwakilishi cha kiume cha umoja kinaeleweka kwa urahisi kumrejelea mwenye punda; hivyo msaada unatolewa kwa kushirikiana naye. Utata wa uwezekano wa kumrejelea punda umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Mrejelewa wa kiwakilishi cha mwisho עִמּוֹ
  choice: pamoja naye, yaani mwenye punda anayekuchukia
  alternative: pamoja na punda huyo / kumsaidia punda huyo kwa mzigo wake
  rationale: Kisarufi, kiwakilishi cha kiume cha umoja kinaweza kumrejelea mwenye punda au punda. Msisitizo wa kimaadili wa sheria unaunga mkono ushirikiano na mwenye mnyama, lakini uwezekano mwingine ni wa kweli na umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ya masharti imetolewa kwa “Ukimwona,” huku msisitizo wa amri ukionyeshwa kwa “ni lazima.” Alama zote za tanbihi zimewekwa katika matini kuu.
