  yaml_path: translation/ot/exodus/023/022.yaml
  text: But if you carefully obey his voice and do all that I speak[b][a], then I will be an enemy to your enemies and an adversary to your adversaries.
translation:
  language: sw
  text: Lakini ukiitii sauti yake kwa makini[a] na ukafanya yote nitakayosema[b], basi nitakuwa adui wa adui zako, na nitakuwa mpinzani wa wapinzani wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukiitii sauti yake hakika.” Kiebrania hutumia kitenzi kisoukomo pamoja na kitenzi chenye nafsi ili kukazia tendo.
    reason: lexical_alternative
  - marker: b
    text: Mstari unabadilika kutoka “sauti yake” kwenda “nitakayosema,” na hivyo kuhifadhi uhusiano wa karibu kati ya mjumbe na BWANA katika muktadha huu.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי אִם
  choice: Lakini uki-
  rationale: Muundo huu unaanzisha sharti lenye utofautishaji na onyo lililotangulia; “Lakini uki-” ni wa kawaida na wazi katika Kiswahili.
- source_word: שָׁמֹעַ תִּשְׁמַע
  choice: ukiisikiliza ... kwa makini
  rationale: Kitenzi kisoukomo pamoja na kitenzi chenye nafsi hukazia tendo. “Kusikiliza kwa makini” huhifadhi wazo la kusikia kwa uangalifu na, katika muktadha, kuitikia kwa utii bila kulifanya neno hilo kuwa “kutii” pekee.
- source_word: בְּקֹלוֹ
  choice: sauti yake
  rationale: Huhifadhi usemi wa Kiebrania na rejeo la moja kwa moja kwa mjumbe aliyetajwa katika muktadha.
- source_word: וְעָשִׂיתָ כֹּל אֲשֶׁר אֲדַבֵּר
  choice: na kufanya yote nitakayosema
  rationale: Huhifadhi mabadiliko kutoka “sauti yake” kwenda kwa BWANA anayesema kwa nafsi ya kwanza, huku Kiswahili kikiwa cha kawaida.
- source_word: וְאָיַבְתִּי אֶת אֹיְבֶיךָ
  choice: nitakuwa adui wa adui zako
  rationale: Huhifadhi urudiaji wa mzizi na uhusiano wa uadui ulio wazi katika Kiebrania.
- source_word: וְצַרְתִּי אֶת צֹרְרֶיךָ
  choice: na mpinzani wa wale wanaokupinga
  rationale: Huhifadhi ulinganifu na kishazi kilichotangulia pamoja na uhusiano wa kimzizi kati ya kitenzi na jina, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Mabadiliko ya rejeo kati ya “sauti yake” na “nitakayosema”
  choice: Kuhifadhi mabadiliko kutoka sauti ya mjumbe kwenda kwa BWANA anayesema kwa nafsi ya kwanza.
  alternative: Kusawazisha vifungu vyote ili vimrejelee mjumbe pekee au BWANA pekee.
  rationale: Maandishi yenyewe yanaweka uhusiano wa karibu kati ya sauti ya mjumbe na usemi wa BWANA; tafsiri haipaswi kuondoa mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ukiisikiliza ... kwa makini” ni cha kawaida kuliko tafsiri ya neno kwa neno, huku tanbihi ikihifadhi mkazo wa muundo wa Kiebrania. “Mpinzani wa wale wanaokupinga” hudumisha tofauti na ulinganifu wa jozi ya pili.
