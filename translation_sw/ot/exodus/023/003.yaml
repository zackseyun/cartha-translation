  yaml_path: translation/ot/exodus/023/003.yaml
  text: And you shall not show partiality to a poor man in his lawsuit[a].
translation:
  language: sw
  text: Wala usimpendelee maskini katika kesi yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usimheshimu maskini katika shauri lake.” Kitenzi cha Kiebrania kinaweza kumaanisha kihalisi “heshimu,” lakini katika muktadha huu wa mahakama kinahusu kumpa mtu upendeleo.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָל
  choice: maskini
  rationale: Neno hili humaanisha mtu maskini, mnyonge, au aliye dhaifu kijamii au kiuchumi. Katika muktadha huu wa kesi ya mtu mmoja, “maskini” ni la kawaida na wazi katika Kiswahili.
- source_word: תֶהְדַּר
  choice: usimpendelee
  rationale: Ingawa kitenzi hiki kinaweza kumaanisha kihalisi “kumheshimu,” katika muktadha wa mahakama kinamaanisha kumpa mtu upendeleo usio wa haki.
- source_word: בְּרִיבוֹ
  choice: katika kesi yake
  rationale: רִיב linaweza kumaanisha ugomvi, shauri, au kesi. Muktadha wa sheria za hukumu unaunga mkono “kesi,” nayo kiambishi cha nafsi ya tatu umoja kimewakilishwa na “yake.”
- source_word: וְ
  choice: Wala
  rationale: Kiunganishi kinaendeleza mfululizo wa makatazo. “Wala” ni cha asili katika Kiswahili baada ya katazo lililotangulia na hakiongezi tofauti isiyokuwamo.
- source_word: לֹא
  choice: usi-
  rationale: לֹא pamoja na kitenzi kisichotimilika hutoa katazo; katika Kiswahili, umbo la kukataza “usimpendelee” hulifikisha kwa kawaida.
theological_decisions:
- issue: Kuwajali maskini bila kuwapendelea katika hukumu
  choice: Aya inakataza kumpendelea maskini katika kesi yake.
  alternative: Aya inaamuru maskini aheshimiwe kwa ujumla.
  rationale: Muktadha wa kisheria na maneno “katika kesi yake” yanaonyesha kuwa amri inahusu kutopendelea katika kutoa haki, wala haikatai kuwahurumia maskini kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. “Usimpendelee” linaweka wazi maana ya kimahakama huku tanbihi ikihifadhi tafsiri ya karibu zaidi na umbo la Kiebrania.
