id: EXO.23.12
reference: Exodus 23:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲשֶׂ֣ה מַעֲשֶׂ֔י/ךָ וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת לְמַ֣עַן יָנ֗וּחַ שֽׁוֹרְ/ךָ֙ וַ/חֲמֹרֶ֔/ךָ וְ/יִנָּפֵ֥שׁ בֶּן אֲמָתְ/ךָ֖ וְ/הַ/גֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/012.yaml
  text: For six days you shall do your work[a], but on the seventh day you shall cease, so that your ox and your donkey may rest[c][b], and the son of your female servant and the sojourner may be refreshed.
translation:
  language: sw
  text: Kwa siku sita utafanya kazi zako, lakini siku ya saba utaacha kufanya kazi[a], ili ng’ombe wako na punda wako wapumzike, na mwana wa mtumishi wako wa kike pamoja na mgeni mkazi[b] wapate nafuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utakoma” au “utapumzika”; kitenzi cha Kiebrania kimsingi humaanisha kuacha au kukoma.
    reason: lexical_alternative
  - marker: b
    text: “Mgeni mkazi” ni mtu wa kigeni anayeishi miongoni mwa Waisraeli chini ya utaratibu wao wa kijamii na kisheria. “Mtumishi wa kike” katika kifungu hiki linaweza pia kumaanisha mtumwa wa kike.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Kwa siku sita
  rationale: Kirai hiki kinaonyesha muda ambao kazi hufanywa; “kwa siku sita” ni Kiswahili cha kawaida na huhifadhi muda uliowekwa.
- source_word: תַּעֲשֶׂה מַעֲשֶׂיךָ
  choice: utafanya kazi zako
  rationale: Kauli ya kisheria ina nguvu ya agizo, na “kazi zako” inahusu shughuli kwa upana bila kuziwekea mipaka ya kazi za mikono pekee.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: lakini siku ya saba
  rationale: Kiunganishi kinaendeleza sentensi huku kikionyesha tofauti kati ya siku sita za kazi na siku ya saba.
- source_word: תִּשְׁבֹּת
  choice: utaacha kufanya kazi
  rationale: Kitenzi שׁבת kimsingi humaanisha kuacha au kukoma. Kirai hiki ni cha kawaida katika Kiswahili na kinaonyesha wazi kukoma kwa kazi.
- source_word: יָנוּחַ
  choice: wapumzike
  rationale: Kitenzi נוח hapa kinaonyesha kupata pumziko; umoja wa Kiebrania una viima viwili, ilhali Kiswahili hutumia upatanisho wa wingi kwa ng’ombe na punda.
- source_word: שׁוֹרְךָ וַחֲמֹרֶךָ
  choice: ng’ombe wako na punda wako
  rationale: שׁוֹר ni mnyama wa jamii ya ng’ombe anayetumiwa kwa kazi. “Ng’ombe” ni neno la kawaida na linaloeleweka katika Kiswahili cha Afrika Mashariki, na “punda” ni tafsiri ya moja kwa moja ya חמור.
- source_word: וְיִנָּפֵשׁ
  choice: wapate kuburudika
  rationale: Nifali ya נפשׁ ina wazo la kuvuta pumzi tena, kurejeshwa nguvu, au kuburudika baada ya kazi. “Wapate kuburudika” huwasilisha kusudi la kibinadamu la pumziko bila kuondoa wazo la kurejeshwa nguvu.
- source_word: בֶּן אֲמָתְךָ
  choice: mwana wa mjakazi wako
  rationale: Huhifadhi muundo wa Kiebrania na uhusiano wa mtoto huyo na mwanamke aliye katika hali ya utumishi ndani ya nyumba.
- source_word: הַגֵּר
  choice: mgeni mkazi
  rationale: גר si mgeni anayepita tu, bali mtu wa kigeni anayeishi miongoni mwa Israeli chini ya utaratibu wake wa kijamii na kisheria.
theological_decisions:
- issue: Maana ya שׁבת katika sheria ya siku ya saba
  choice: utaacha kufanya kazi
  alternative: utapumzika
  rationale: Maana ya msingi ni kukoma au kuacha. Tafsiri hii huhifadhi mkazo wa agizo la kusitisha kazi, huku vishazi vinavyofuata vikieleza pumziko na kuburudika kunakotokana na kusitishwa huko.
- issue: Hadhi ya kijamii inayowakilishwa na גר
  choice: mgeni mkazi
  alternative: mgeni
  rationale: “Mgeni mkazi” huonyesha kwamba huyu ni mtu wa kigeni anayeishi kwa kudumu au kwa muda mrefu miongoni mwa Israeli, si msafiri wa kawaida tu; hivyo rehema ya siku ya saba inamfikia pia mtu huyo aliye nje ya ukoo wa asili.
- issue: Hadhi ya אמה
  choice: mjakazi
  alternative: mtumwa wa kike
  rationale: אמה linaweza kutaja mtumishi wa kike au mtumwa wa kike. “Mjakazi” ni neno la Kiswahili linalosomeka kwa urahisi huku tanbihi ikihifadhi hali pana na ngumu ya kijamii inayoweza kuhusishwa na neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kwa msomaji wa kawaida lakini inadumisha mtindo wa agizo la kisheria. “Mgeni mkazi” huepuka utata wa “mgeni” peke yake, na “utaacha kufanya kazi” huwasilisha maana ya msingi ya שׁבת kwa uwazi.
