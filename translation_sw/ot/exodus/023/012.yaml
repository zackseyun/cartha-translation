review_pass:
  verdict: revise
  source_fidelity: The rendering correctly preserves the six-day/seventh-day contrast, cessation of work, rest for the ox and donkey, and refreshment for the female servant’s son and the resident foreigner. However, “kuburudika” commonly suggests enjoying oneself or being entertained in current Swahili and is less precise for וְיִנָּפֵשׁ, which denotes recovering strength or getting relief.
  naturalness: The sentence is clear and uses an appropriate legal-register future. “Wapate nafuu” is more idiomatic in this context than “wapate kuburudika.”
  terminology: “Mgeni mkazi” appropriately represents גר as a resident foreigner. “Mjakazi” is understandable but can understate the servile status denoted by אמה; “mtumishi wako wa kike” is a suitably neutral, explicit rendering, with a note acknowledging the possible sense “mtumwa wa kike.”
  issues:
  - severity: medium
    issue: “wapate kuburudika” for וְיִנָּפֵשׁ
    rationale: In modern Standard East African Swahili, kuburudika can connote recreation or entertainment. The Hebrew here concerns being refreshed/recovering strength after labor. “wapate nafuu” conveys this without introducing that connotation.
  - severity: low
    issue: “mjakazi” may obscure the social-status range of אמה
    rationale: The term can mean a female servant but often has the stronger sense of female slave. Replacing it with “mtumishi wako wa kike” is clear in the text, while the footnote preserves the historical lexical range.
  revised_text: Kwa siku sita utafanya kazi zako, lakini siku ya saba utaacha kufanya kazi[a], ili ng’ombe wako na punda wako wapumzike, na mwana wa mtumishi wako wa kike pamoja na mgeni mkazi[b] wapate nafuu.
