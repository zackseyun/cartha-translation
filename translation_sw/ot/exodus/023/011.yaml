base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/011.yaml
  text: But in the seventh year you shall let it rest and leave it alone[a], so that the poor of your people may eat; and what they leave, the wild animals of the field may eat[b]. You shall do the same with your vineyard and your olive grove.
translation:
  language: sw
  text: Lakini katika mwaka wa saba utaiacha ipumzike na kuiacha bila kulimwa[a], ili maskini miongoni mwa watu wako wapate kula; na kile kitakachobaki baada ya wao kula, wanyama wa porini watakula[b]. Utafanya vivyo hivyo kwa shamba lako la mizabibu na shamba lako la mizeituni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utaiachilia na kuiacha”; vitenzi vya Kiebrania vinakazia kusitisha kilimo cha kawaida na kuiacha ardhi bila kulimwa katika mwaka wa saba.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mnyama wa shambani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁבִיעִת
  choice: Lakini mwaka wa saba
  rationale: Kiunganishi kinaonyesha tofauti na miaka sita iliyotajwa katika mstari uliotangulia; usemi huu ni wa asili katika Kiswahili na unadumisha maana ya mwaka wa saba.
- source_word: תִּשְׁמְטֶנָּה
  choice: utaiache ipumzike
  rationale: Kitenzi שׁמט hapa kinamaanisha kuiachilia ardhi isiendelee kulimwa kama kawaida. Kiwakilishi cha kitu kinarejelea ardhi iliyotajwa katika mstari uliotangulia.
- source_word: וּנְטַשְׁתָּהּ
  choice: na kuiacha bila kulimwa
  rationale: נטשׁ humaanisha kuacha au kutenga. Katika sheria hii ya kilimo, tafsiri hii inaeleza kusitisha ulimaji bila kudokeza kuitelekeza kabisa au milele.
- source_word: אֶבְיֹנֵי עַמֶּךָ
  choice: maskini miongoni mwa watu wako
  rationale: אביון humaanisha maskini au mhitaji; usemi huu unaweka wazi kwamba ni maskini walio katika jumuiya ya watu wanaozungumziwa.
- source_word: וְיִתְרָם
  choice: watakachosaza
  rationale: Nomino yenye kiambishi cha nafsi ya tatu wingi inamaanisha kile kitakachobaki baada ya maskini kula.
- source_word: תֹּאכַל חַיַּת הַשָּׂדֶה
  choice: wanyama wa porini watakula
  rationale: חית השדה ni usemi wa kawaida kwa wanyama wa mwituni au porini; mpangilio huu ni wa asili katika Kiswahili.
- source_word: כֵּן תַּעֲשֶׂה
  choice: Utafanya vivyo hivyo
  rationale: Unadumisha nguvu ya agizo la kisheria na kuonyesha kwamba kanuni hiyo hiyo inatumika kwa mazao yanayofuata.
- source_word: לְכַרְמְךָ
  choice: kwa shamba lako la mizabibu
  rationale: כרם ni shamba la mizabibu; kihusishi 'kwa' kinafaa baada ya 'utafanya vivyo hivyo.'
- source_word: לְזֵיתֶךָ
  choice: shamba lako la mizeituni
  rationale: זית hapa ni umoja wenye maana ya kijumla, unaorejelea miti ya mizeituni iliyopandwa kama zao, sambamba na shamba la mizabibu.
