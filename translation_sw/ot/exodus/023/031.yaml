id: EXO.23.31
reference: Exodus 23:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/שַׁתִּ֣י אֶת גְּבֻלְ/ךָ֗ מִ/יַּם סוּף֙ וְ/עַד יָ֣ם פְּלִשְׁתִּ֔ים וּ/מִ/מִּדְבָּ֖ר עַד הַ/נָּהָ֑ר כִּ֣י אֶתֵּ֣ן בְּ/יֶדְ/כֶ֗ם אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/גֵרַשְׁתָּ֖/מוֹ מִ/פָּנֶֽי/ךָ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/031.yaml
  text: And I will set your border from the Red Sea to the Sea of the Philistines[a], and from the wilderness to the River; for I will give the inhabitants of the land into your hand[b], and you will drive them out from before you.
translation:
  language: sw
  text: Nami nitaweka mpaka wako kuanzia Bahari ya Shamu[a] mpaka Bahari ya Wafilisti, na kuanzia nyika mpaka ule Mto[b]; kwa maana nitawatia wakazi wa nchi mikononi mwenu, nawe utawafukuza watoke mbele yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Bahari ya Matete.”'
    reason: lexical_alternative
  - marker: b
    text: Yaani, Mto Frati.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁתִּי
  choice: Nami nitaweka
  rationale: Kitenzi hiki katika muktadha wa ahadi ya Mungu kina maana ya wakati ujao; “nitaweka” ni ya kawaida na hudumisha wazo la kuweka mpaka.
- source_word: גְּבֻלְךָ
  choice: mpaka wako
  rationale: Neno גְּבוּל hapa linamaanisha mpaka wa kijiografia, si eneo kwa maana pana.
- source_word: מִיַּם סוּף
  choice: kuanzia Bahari ya Shamu[a]
  rationale: “Bahari ya Shamu” ni jina linalotambulika kwa urahisi katika Kiswahili; maana ya karibu zaidi ya maneno ya Kiebrania imeonyeshwa katika tanbihi.
- source_word: יָם פְּלִשְׁתִּים
  choice: Bahari ya Wafilisti
  rationale: Tafsiri hii hudumisha jina la kijiografia la Kiebrania badala ya kulibadilisha moja kwa moja kuwa Bahari ya Mediterania.
- source_word: וּמִמִּדְבָּר
  choice: na kuanzia nyika
  rationale: “Nyika” huwasilisha eneo kame lisilokaliwa sana bila kulazimisha maana ya jangwa la mchanga.
- source_word: הַנָּהָר
  choice: ule Mto[b]
  rationale: Kiebrania kinasema kihalisi “ule Mto”; tanbihi inamtambulisha kuwa Frati.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu inayounga mkono ahadi iliyotangulia.
- source_word: אֶתֵּן בְּיֶדְכֶם
  choice: nitawatia ... mikononi mwenu
  rationale: Hudumisha sitiari ya Kiebrania ya kumtia mtu mikononi mwa mwingine, yaani chini ya mamlaka yake, na pia huhifadhi wingi wa kiwakilishi katika בְּיֶדְכֶם.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: wakazi wa nchi hiyo
  rationale: Hii ni tafsiri ya kawaida na wazi ya wale wanaokaa katika nchi inayozungumziwa.
- source_word: וְגֵרַשְׁתָּמוֹ
  choice: nawe utawafukuza watoke
  rationale: “Kuwafukuza watoke” hutoa kwa uwazi maana ya kuwatoa kwa nguvu katika eneo hilo na huhifadhi umoja wa kitenzi cha Kiebrania.
- source_word: מִפָּנֶיךָ
  choice: mbele yako
  rationale: Hudumisha taswira ya Kiebrania ya kuwaondoa kutoka mbele ya mhusika anayesemeshwa.
theological_decisions:
- issue: Jina la kijiografia יַם סוּף
  choice: Bahari ya Shamu
  alternative: Bahari ya Matete
  rationale: Hili hasa ni suala la kileksia na kijiografia. Jina linalotambulika zaidi limetumiwa katika matini, huku tafsiri ya karibu zaidi ya Kiebrania ikihifadhiwa katika tanbihi.
- issue: Kubadilika kwa idadi ya anayesemeshwa
  choice: mpaka wako ... mikononi mwenu ... nawe utawafukuza ... mbele yako
  alternative: Kusawazisha viwakilishi vyote kuwa vya umoja au vya wingi
  rationale: Kiebrania hubadilika kutoka umoja katika גְּבֻלְךָ hadi wingi katika בְּיֶדְכֶם, kisha kurudi umoja katika וְגֵרַשְׁתָּמוֹ na מִפָּנֶיךָ. Tafsiri imehifadhi mvutano huo wa kisarufi badala ya kuusawazisha kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina “Bahari ya Wafilisti” na “ule Mto” yamehifadhi umbo la matini ya Kiebrania; tanbihi zinafafanua pale panapohitajika. Kubadilika kwa umoja na wingi katika anayesemeshwa kumehifadhiwa kwa makusudi.
