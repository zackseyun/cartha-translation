lexical_decisions:
- source_word: לֹא
  choice: usi-
  rationale: Kiambishi cha kukanusha katika ‘usifanye’ kinaonyesha katazo la moja kwa moja kwa nafsi ya pili umoja, sawasawa na Kiebrania.
- source_word: תִכְרֹת
  choice: ufanye
  rationale: Kitenzi כרת pamoja na בְּרִית ni nahau ya kufanya agano; Kiswahili cha kawaida husema ‘kufanya agano,’ si ‘kukata agano.’
- source_word: לָהֶם
  choice: nao
  rationale: Katika muktadha wa kufanya agano, ל inaonyesha wahusika ambao agano linafanywa nao; ‘nao’ ni ya asili na wazi katika Kiswahili.
- source_word: וְלֵאלֹהֵיהֶם
  choice: wala na miungu yao
  rationale: ו kimsingi ni ‘na,’ lakini katika sentensi hasi ‘wala’ huwasilisha kwa kawaida kwamba katazo linawahusu wao na pia miungu yao, bila kuondoa thamani ya kiunganishi cha Kiebrania.
- source_word: בְּרִית
  choice: agano
  rationale: ‘Agano’ ndilo neno sanifu la kibiblia kwa בְּרִית na linahifadhi uzito wake wa uhusiano na wajibu kuliko ‘mkataba’ au ‘makubaliano.’
theological_decisions:
- issue: Nahau כרת ברית
  choice: ufanye agano
  alternative: ukate agano
  rationale: Tafsiri ya nahau kwa Kiswahili cha kawaida inalinda maana ya kisheria na kiuhusiano bila kutumia usemi mgumu usio wa kawaida.
- issue: Nguvu ya ו kabla ya ‘miungu yao’
  choice: wala na miungu yao
  alternative: na miungu yao
  rationale: ‘Wala’ ni kiunganishi cha kawaida cha Kiswahili katika katazo chenye vitu viwili; kinatoa maana ya ‘si nao, wala si na miungu yao,’ huku tanbihi ikihifadhi umbo rasmi la ‘na.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Usifanye agano’ ni katazo la moja kwa moja na linaloeleweka; ‘nao’ huepuka urudiaji mzito, na ‘wala’ huonyesha kwa uwazi upeo wa katazo.
