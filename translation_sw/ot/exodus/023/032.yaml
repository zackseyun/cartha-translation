  text: You shall make no covenant with them or with their gods[a][b].
translation:
  language: sw
  text: Usifanye agano nao wala na miungu yao.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa maana halisi, “usikate agano.”
    reason: lexical_alternative
  - marker: b
    text: Au, kwa kufuata umbo la Kiebrania kwa karibu zaidi, “na miungu yao.”
