source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֣ת יָמִים֩ תֹּאכַ֨ל מַצּ֜וֹת כַּֽ/אֲשֶׁ֣ר צִוִּיתִ֗/ךָ לְ/מוֹעֵד֙ חֹ֣דֶשׁ הָֽ/אָבִ֔יב כִּי ב֖/וֹ יָצָ֣אתָ מִ/מִּצְרָ֑יִם וְ/לֹא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/015.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib, for in it you came out from Egypt[b]. And no one shall appear before me empty-handed.
translation:
  language: sw
  text: Utaadhimisha Sikukuu ya Mikate Isiyotiwa Chachu. Kwa siku saba utakula mikate isiyotiwa chachu, kama nilivyokuamuru, kwa wakati uliowekwa katika mwezi wa Abibu, kwa maana katika mwezi huo ulitoka Misri. Wala wasitokee mbele yangu[a] mikono mitupu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mbele ya uso wangu,” nahau yenye maana ya “mbele yangu” au “katika uwepo wangu.”'
    reason: lexical_alternative
  - marker: b
    text: Au “Wala mtu yeyote asitokee mbele yangu mikono mitupu.” Kiebrania kinabadilika hapa kutoka kumsemesha mtu mmoja katika nafsi ya pili hadi kutumia kitenzi cha nafsi ya tatu wingi.
    reason: alternative_reading
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: Sikukuu ya Mikate Isiyotiwa Chachu
  rationale: חַג ni sikukuu, mara nyingi yenye wazo la kuhiji, na מַצּוֹת ni mikate isiyotiwa chachu. Usemi huu ni wazi na una heshima katika Kiswahili cha sasa.
- source_word: תִּשְׁמֹר
  choice: utaadhimisha
  rationale: Katika muktadha wa ibada na sheria, שׁמר humaanisha kushika au kuadhimisha agizo. “Utaadhimisha” ni ya kawaida kwa sikukuu na inadumisha nguvu ya amri.
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: Kwa siku saba utakula mikate isiyotiwa chachu
  rationale: Inahifadhi muda wa siku saba na tendo lililoamriwa kwa lugha ya kawaida ya Kiswahili.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: kama nilivyokuamuru
  rationale: Inadumisha ulinganisho wa כַּאֲשֶׁר na sauti ya Mungu anayesema moja kwa moja.
- source_word: לְמוֹעֵד
  choice: kwa wakati uliowekwa
  rationale: מוֹעֵד hapa ni wakati maalumu wa kalenda ulioteuliwa kwa maadhimisho.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: mwezi wa Abibu
  rationale: אָבִיב inatumika hapa kama jina la mwezi; “Abibu” ni umbo la Kiswahili linalotambulika na linahifadhi kazi yake kama alama ya wakati.
- source_word: כִּי בוֹ יָצָאתָ מִמִּצְרָיִם
  choice: kwa maana katika mwezi huo ulitoka Misri
  rationale: Kiambishi בוֹ kwa kawaida kinarejelea mwezi uliotajwa. Kutaja “mwezi huo” huondoa utata wa kisarufi bila kuongeza maana mpya.
- source_word: וְלֹא יֵרָאוּ פָנַי
  choice: Wala watu wasionekane mbele yangu
  rationale: Nifali ya ראה katika nahau hii humaanisha kujitokeza mbele ya Mungu. “Watu wasionekane” inadumisha kwa kiasi mabadiliko ya Kiebrania kutoka nafsi ya pili umoja kwenda kitenzi cha wingi.
- source_word: רֵיקָם
  choice: mikono mitupu
  rationale: Hii ni nahau ya asili ya Kiswahili kwa kuja bila kitu; katika muktadha huu inadokeza zawadi au sadaka bila kuainisha aina yake.
theological_decisions:
- issue: Nahau ya kurejelea kuwapo mbele za Mungu
  choice: mbele yangu
  alternative: mbele ya uso wangu
  rationale: Kiebrania kinasema kihalisi “uso wangu,” lakini nahau hiyo humaanisha kujitokeza mbele za Mungu. “Mbele yangu” ni ya asili na inadumisha usemi wa Mungu katika nafsi ya kwanza.
- issue: Mabadiliko ya nafsi katika kishazi cha mwisho
  choice: Wala watu wasionekane
  alternative: Wala mtu yeyote asionekane
  rationale: Kitenzi cha Kiebrania ni cha nafsi ya tatu wingi baada ya maagizo ya nafsi ya pili umoja. Tafsiri kuu inadumisha wingi huo; tanbihi inaeleza mabadiliko na kutaja tafsiri ya umoja isiyo maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Sikukuu,” “kuadhimisha,” na “mikono mitupu” ni misemo inayoeleweka kwa wasomaji wa kawaida; mpangilio wa kishazi cha mwisho unahifadhi mabadiliko halisi ya kisarufi ya Kiebrania bila kuufanya mstari kuwa mgumu kupita kiasi.
