base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/029.yaml
  text: I will not drive them out from before you in one year[b][a], lest the land become desolate and the wild animals of the field become too numerous against you.
translation:
  language: sw
  text: Sitawafukuza watu hao[a] kutoka mbele yako katika mwaka mmoja, ili nchi isije ikawa ukiwa na wanyama wa porini[b] wakakuzidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina kiambishi cha yambwa cha umoja, ambacho huenda kinawarejelea kwa pamoja wakazi au adui.
    reason: lexical_alternative
  - marker: b
    text: Au “wanyama wa mwituni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגָרְשֶׁנּוּ
  choice: Sitawafukuza watu hao
  rationale: Kitenzi גרש humaanisha kufukuza au kuondoa kwa nguvu. Ingawa kiambishi cha yambwa katika Kiebrania ni cha umoja, katika muktadha kinawarejelea kwa pamoja wakazi au maadui waliotajwa; wingi unaeleweka kwa urahisi katika Kiswahili, huku tanbihi ikihifadhi umbo la asili.
- source_word: מִפָּנֶיךָ
  choice: kutoka mbele yako
  rationale: Huhifadhi taswira ya mahali na ya kukabiliana iliyomo katika nahau ya Kiebrania, bila kuibadili kuwa dhana ya jumla ya kuwapo.
- source_word: בְּשָׁנָה אֶחָת
  choice: katika mwaka mmoja
  rationale: Ni tafsiri ya moja kwa moja ya kirai cha wakati na haiongezi mkazo usiotajwa wazi.
- source_word: פֶּן
  choice: ili ... isije
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha kusudi au matokeo hasi yanayoepukwa.
- source_word: תִּהְיֶה הָאָרֶץ שְׁמָמָה
  choice: nchi isije ikawa ukiwa
  rationale: שְׁמָמָה huonyesha hali ya kuachwa tupu au kuharibiwa; 'kuwa ukiwa' ni usemi wa asili na wenye hadhi katika Kiswahili.
- source_word: וְרַבָּה
  choice: wakazidi kuwa wengi
  rationale: רבה humaanisha kuongezeka au kuwa wengi; 'wakazidi kuwa wengi' huwasilisha ongezeko lenye madhara katika muktadha.
- source_word: עָלֶיךָ
  choice: na kuwa hatari kwako
  rationale: Kihusishi על hapa kinaonyesha athari mbaya inayomkabili msikilizaji. Kiswahili cha moja kwa moja 'juu yako' kingekuwa kisicho wazi, hivyo tishio la muktadha limeelezwa kwa lugha ya kawaida.
- source_word: חַיַּת הַשָּׂדֶה
  choice: wanyama wa porini
  rationale: Kirai hiki kinarejelea wanyama wa nchi kavu wasiofugwa. 'Wanyama wa porini' ni lugha ya sasa, wazi na ya kawaida katika Afrika Mashariki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Umoja wa mtu anayesemeshwa umehifadhiwa katika “yako” na “kwako.”
