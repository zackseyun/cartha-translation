  text: You shall not spread a false report[b][a]. Do not join hands with a wicked man to be a malicious witness.
translation:
  language: sw
  text: Usieneze habari ya uongo.[a] Usiungane na mtu mwovu ili uwe shahidi wa dhuluma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usibebe habari ya uongo.” Kwa maana halisi, kitenzi cha Kiebrania ni “kuinua/kubeba,” lakini hapa kinahusu kupitisha au kueneza habari.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “usiweke mkono wako pamoja na mtu mwovu ili uwe shahidi wa dhuluma.” Kauli “kuweka mkono pamoja na” ni nahau ya kushirikiana, na “shahidi wa dhuluma” pia inaweza kueleweka kuwa shahidi mwenye nia mbaya au asiye wa haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: usieneze
  rationale: Ingawa kitenzi נָשָׂא kimsingi humaanisha kuinua, kubeba, au kuchukua, kinapotumiwa pamoja na שֵׁמַע kinaweza kumaanisha kueneza habari iliyosikiwa. “Usieneze” ni ya kawaida na inaeleza wazi kitendo kilichokatazwa.
- source_word: שֵׁמַע שָׁוְא
  choice: habari ya uongo
  rationale: שֵׁמַע ni habari au jambo lililosikiwa, na שָׁוְא hapa hudokeza uongo, ubatili, au kutokuwa na msingi. “Habari ya uongo” ni Kiswahili cha kawaida kinachofaa muktadha wa kisheria.
- source_word: תָּשֶׁת יָדְךָ עִם
  choice: usiungane na
  rationale: Nahau hii kwa neno halisi ni “usiweke mkono wako pamoja na.” “Usiungane na” huwasilisha kwa kawaida maana ya kushirikiana au kujipanga upande mmoja na mtu mwingine.
- source_word: רָשָׁע
  choice: mtu mwovu
  rationale: Neno hili linaweza kumaanisha mtu mwovu au mwenye hatia. “Mtu mwovu” huhifadhi maana ya kimaadili na kisheria bila kuongeza maelezo yasiyokuwamo katika chanzo.
- source_word: לִהְיוֹת עֵד חָמָס
  choice: ili uwe shahidi wa udhalimu
  rationale: עֵד ni shahidi, na חָמָס inaweza kumaanisha ukatili, jeuri, uovu, au dhuluma. “Shahidi wa udhalimu” huhifadhi uzito na upana wa neno la Kiebrania katika muktadha wa haki kuliko kulifanya tu “shahidi wa uongo.”
- source_word: לֹא / אַל
  choice: usi-
  rationale: Miundo yote miwili ya Kiebrania inatoa makatazo. Kiambishi cha Kiswahili “usi-” ni njia ya kawaida, wazi, na yenye nguvu ya kuyatoa.
theological_decisions:
- issue: Maana ya עֵד חָמָס katika muktadha wa ushahidi
  choice: shahidi wa udhalimu
  alternative: shahidi mwenye nia mbaya; shahidi asiye wa haki; shahidi wa uongo
  rationale: Neno חָמָס lina nguvu pana kuliko uongo pekee na linaweza kuhusisha jeuri, dhuluma, au kosa linaloiharibu haki. Tafsiri iliyochaguliwa haifungi kwa lazima iwapo shahidi mwenyewe ni mkatili au ushahidi wake unatenda udhalimu.
- issue: Maumbo ya kiume ya umoja katika agizo la kisheria
  choice: 'kutumia umoja wa kawaida wa Kiswahili: “mtu mwovu” na “uwe”'
  alternative: kutaja “mwanamume mwovu”
  rationale: Kiebrania kina maumbo ya kiume ya umoja, lakini katika Kiswahili “mtu” na umoja wa nafsi ya pili huwasilisha kwa kawaida agizo kwa mtu mmoja bila kudai kwamba jinsia ndiyo hoja ya sheria. Kutumia “mwanamume” kungeongeza mkazo wa kijinsia usio lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa sheria. Maneno ni ya kawaida kwa msomaji wa leo; “udhalimu” limehifadhiwa kwa sababu huonyesha uzito wa חָמָס na linaeleweka katika muktadha wa kupotosha haki.
