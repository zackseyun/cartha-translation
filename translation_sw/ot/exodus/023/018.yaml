base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/018.yaml
  text: You shall not sacrifice the blood of my sacrifice with anything leavened[b][a], and the fat of my feast shall not remain until morning.
translation:
  language: sw
  text: Usitoe damu ya dhabihu yangu pamoja na chochote chenye chachu[a], wala mafuta ya sikukuu yangu yasibaki mpaka asubuhi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na chachu” au “juu ya chachu.” Kihusishi cha Kiebrania kwa maana ya msingi ni “juu ya,” lakini hapa huenda kinakataza kutoa dhabihu kwa kuihusisha na kitu chenye chachu.
    reason: lexical_alternative
  - marker: b
    text: “Sikukuu” pia inaweza kutafsiriwa “sherehe”; neno la Kiebrania humaanisha maadhimisho matakatifu ya kidini.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִזְבַּח
  choice: Usitoe ... dhabihu
  rationale: Kitenzi katika katazo la kisheria la nafsi ya pili umoja kimetafsiriwa kwa katazo la moja kwa moja la Kiswahili; muundo huu unahifadhi maana ya ibada ya kutoa dhabihu.
- source_word: עַל חָמֵץ
  choice: pamoja na chochote chenye chachu
  rationale: Ingawa עַל kwa msingi ni ‘juu ya,’ katika muktadha huu inaonyesha kuhusishwa kwa dhabihu na kitu chenye chachu. Tafsiri hii ni wazi kwa Kiswahili bila kuficha uwezekano wa tafsiri halisi, ambao umewekwa katika tanbihi.
- source_word: דַּם זִבְחִי
  choice: damu ya dhabihu yangu
  rationale: Muundo wa umilikishi na kiambishi cha nafsi ya kwanza umehifadhiwa moja kwa moja; neno ‘damu’ halijaachwa wala kubadilishwa kuwa dhabihu kwa ujumla.
- source_word: וְלֹא יָלִין
  choice: wala ... yasibaki
  rationale: לין hapa humaanisha kukaa usiku au kubaki hadi wakati unaofuata. Pamoja na ‘mpaka asubuhi,’ ‘yasibaki’ ni Kiswahili cha kawaida kisicho na urudiaji usiohitajika.
- source_word: חֵלֶב
  choice: mafuta
  rationale: Neno la Kiebrania linataja mafuta, hasa mafuta ya dhabihu; tafsiri ya moja kwa moja inalinda taswira ya ibada.
- source_word: חַגִּי
  choice: sikukuu yangu
  rationale: חַג ni sherehe takatifu ya kidini, mara nyingi sikukuu ya hija. ‘Sikukuu’ ni neno la kawaida na lenye heshima katika Kiswahili, huku ‘sherehe’ ikitajwa kama mbadala katika tanbihi.
- source_word: עַד בֹּקֶר
  choice: mpaka asubuhi
  rationale: Ni usemi wa kawaida wa wakati katika Kiswahili na unalingana moja kwa moja na chanzo.
theological_decisions:
- issue: Rejeo la viambishi vya nafsi ya kwanza katika ‘dhabihu yangu’ na ‘sikukuu yangu’
  choice: 'Kuhifadhi usemi wa Mungu katika nafsi ya kwanza: ‘dhabihu yangu’ na ‘sikukuu yangu.’'
  alternative: ‘dhabihu inayotolewa kwangu’ na ‘sikukuu ya BWANA’
  rationale: Viambishi vya Kiebrania viko wazi. Kuvipanua kungeingiza ufafanuzi ambao haujasemwa moja kwa moja, hivyo umilikishi na mvutano wake wa kiagano umehifadhiwa.
- issue: Uhusiano wa dhabihu na chachu katika עַל חָמֵץ
  choice: ‘pamoja na chochote chenye chachu’ katika matini, na maana halisi kuwekwa katika tanbihi.
  alternative: ‘juu ya chachu’ au ‘pamoja na chachu’
  rationale: Kihusishi kina utata wa kileksika. Matini kuu inatoa maana inayoeleweka katika muktadha wa dhabihu, lakini tanbihi inahifadhi usemi halisi ili kutoondoa kabisa uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria wa moja kwa moja na hadhi inayofaa maandiko. ‘Chochote chenye chachu’ ni cha kawaida na wazi kuliko tafsiri ya neno kwa neno ‘juu ya chachu.’ Upatanisho wa ‘mafuta ... yasibaki’ umefuata matumizi ya wingi wa kisarufi ya nomino ‘mafuta.’
