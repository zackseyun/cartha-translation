id: EXO.23.25
reference: Exodus 23:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/עֲבַדְתֶּ֗ם אֵ֚ת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/בֵרַ֥ךְ אֶֽת לַחְמְ/ךָ֖ וְ/אֶת מֵימֶ֑י/ךָ וַ/הֲסִרֹתִ֥י מַחֲלָ֖ה מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/025.yaml
  text: You shall serve Yahweh your God[a], and he will bless your bread and your water[b], and I will remove sickness from your midst.
translation:
  language: sw
  text: Mtamtumikia Yahwe Mungu wenu, naye atabariki mkate[a] wenu na maji yenu, nami nitaondoa ugonjwa[b] miongoni mwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “mkate” linaweza pia kumaanisha chakula au riziki kwa upana zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au “maradhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: Mtamtumikia
  rationale: Kitenzi עבד katika muktadha huu wa agano kina maana pana ya kumtumikia Mungu, inayojumuisha ibada; “mtamtumikia” huhifadhi upana huo na pia wingi wa nafsi ya pili katika Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Katika uhusiano huu na Yahwe, אֱלֹהִים humaanisha Mungu mmoja, na kiambishi cha umilikaji kinaonyesha uhusiano wake wa agano na Israeli.
- source_word: וּבֵרַךְ
  choice: naye atabariki
  rationale: Kauli hii inaeleza matokeo au ahadi ya wakati ujao; “naye” humtaja Yahwe kwa kawaida kuwa ndiye mtendaji anayeeleweka.
- source_word: לַחְמְךָ
  choice: mkate wenu
  rationale: לֶחֶם kimsingi ni mkate, ingawa inaweza kuwakilisha chakula au riziki kwa upana zaidi. Neno halisi limehifadhiwa na uwezekano mpana umeelezwa katika tanbihi.
- source_word: מֵימֶיךָ
  choice: maji yenu
  rationale: מַיִם ni neno la maji lenye umbo la wingi; “maji yenu” ni usemi wa kawaida wa Kiswahili na huambatana na mkate kama mahitaji ya msingi.
- source_word: וַהֲסִרֹתִי
  choice: nami nitaondoa
  rationale: Hifili ya סור ina maana ya kuondoa au kutwaa; “nitaondoa” ni wazi na huhifadhi badiliko la nafsi kutoka “yeye” kwenda “mimi” lililo katika Kiebrania.
- source_word: מַחֲלָה
  choice: ugonjwa
  rationale: Neno hili linaweza kumaanisha ugonjwa, maradhi, au hali ya kuugua; “ugonjwa” ni la kawaida, pana, na lisilo la kitaalamu kupita kiasi.
- source_word: מִקִּרְבֶּךָ
  choice: miongoni mwenu
  rationale: Usemi huu una maana ya kutoka katikati ya jumuiya. “Miongoni mwenu” huhifadhi maana ya kijamii na ya agano bila kuufanya kuwa ugonjwa wa ndani ya mwili wa mtu mmoja tu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova au BWANA
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo.
- issue: Mabadiliko kutoka wingi kwenda umoja katika viambishi vya nafsi ya pili
  choice: 'Kutumia wingi kwa Kiswahili katika mstari wote: “wenu … yenu … mwenu”'
  alternative: 'Kufuata umbo la Kiebrania neno kwa neno: “wenu … wako … yako … mwako”'
  rationale: Kiebrania huanza kwa kitenzi cha wingi kisha hutumia viambishi vya umoja kumsemesha Israeli kama jumuiya moja. Kiswahili kikibadili ghafla kutoka wingi kwenda umoja kinaweza kudokeza bila msingi kwamba msemaji amemgeukia mtu tofauti; wingi huhifadhi rejeo la pamoja kwa Israeli kwa lugha ya kawaida.
- issue: Badiliko la mtendaji kutoka nafsi ya tatu kwenda nafsi ya kwanza
  choice: 'Kulihifadhi: “naye atabariki … nami nitaondoa”'
  alternative: Kusawazisha kuwa “naye atabariki … na kuondoa”
  rationale: Kiebrania kina badiliko halisi kutoka “atabariki” kwenda “nitaondoa.” Rasimu imelihifadhi bila kulitatua kimyakimya, huku muktadha ukiendelea kumtambulisha Yahwe kuwa msemaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa sentensi huhifadhi mfuatano wa amri na ahadi, pamoja na badiliko la “yeye” kwenda “mimi,” huku wingi ukitumiwa kwa uthabiti ili kuonyesha kwamba Israeli nzima ndiyo inayosemeshwa.
