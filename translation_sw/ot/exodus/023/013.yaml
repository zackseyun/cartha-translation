base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/013.yaml
  text: In all that I have said to you[a], be careful[b]; and the name of other gods you shall not mention—it shall not be heard on your lips.
translation:
  language: sw
  text: Katika yote niliyowaambia, jihadharini; wala msilitaje[a] jina la miungu mingine; lisiskike kinywani mwako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msiliite jina la miungu mingine.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “juu ya kinywa chako.” Hapa matini hubadilika kutoka “ninyi” katika sehemu ya kwanza ya aya hadi “wewe” katika umoja.
    reason: textual_feature
lexical_decisions:
- source_word: וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם
  choice: Kuhusu yote niliyowaambia
  rationale: Kirai hiki kinaonyesha upeo mpana wa agizo na kurejelea maagizo yaliyotangulia. ‘Kuhusu yote’ ni Kiswahili cha kawaida kinachohifadhi maana ya ‘kwa habari ya kila jambo’ bila kuongeza ufafanuzi.
- source_word: תִּשָּׁמֵרוּ
  choice: jihadharini
  rationale: Niphal ya שׁמר hapa ina maana ya kujilinda au kuwa mwangalifu. ‘Jihadharini’ huhifadhi nguvu ya agizo na wazo la kujitunza.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Tafsiri ya moja kwa moja inayorejelea miungu mingine tofauti na Mungu wa Israeli bila kutoa uamuzi wa ziada kuhusu hali yake.
- source_word: לֹא תַזְכִּירוּ
  choice: msilitaje
  rationale: Hiphil ya זכר inaweza kumaanisha kutaja, kukumbusha, au kuliitia jina. ‘Msilitaje’ huhifadhi maana pana ya msingi; uwezekano wa maana finyu zaidi ya ‘kuliitia’ umewekwa katika tanbihi.
- source_word: לֹא יִשָּׁמַע עַל פִּיךָ
  choice: lisikike kinywani mwako
  rationale: Tafsiri hii huhifadhi muundo wa katazo na taswira halisi ya jina kusikika ‘juu ya kinywa,’ kwa Kiswahili cha kawaida ‘kinywani.’ Umoja wa ‘mwako’ umehifadhiwa kama ulivyo katika Kiebrania.
theological_decisions:
- issue: Upeo wa katazo kuhusu jina la miungu mingine
  choice: Katazo limetafsiriwa kwa maana pana ya kutaja jina.
  alternative: ‘Msiliitie jina la miungu mingine,’ kwa maana ya kuliomba au kulitumia katika ibada.
  rationale: Kitenzi זכר katika Hiphil kinaweza kueleweka kama kutaja au kuliitia jina. Aya yenyewe haibainishi wazi kama inakataza kila kutamka au hasa matumizi ya kiibada, kwa hiyo matini kuu haijafunga maana hiyo kwa tafsiri finyu.
- issue: Mabadiliko kutoka wingi kwenda umoja katika nafsi ya pili
  choice: Wingi umehifadhiwa katika ‘niliyowaambia,’ ‘jihadharini,’ na ‘msilitaje,’ kisha umoja katika ‘kinywani mwako.’
  alternative: 'Kusawazisha sentensi yote iwe katika wingi: ‘vinywani mwenu.’'
  rationale: Matini ya Kiebrania hubadilika kutoka viambishi vya wingi hadi עַל־פִּיךָ yenye umoja. Kuhifadhi badiliko hilo huepuka kusahihisha kimya kimya mvutano wa kisarufi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wazi, na wa kisheria bila kuwa wa kizamani. ‘Jihadharini’ na ‘msilitaje’ ni maneno ya kawaida yanayofaa agizo rasmi. Umoja usiotarajiwa katika mwisho wa aya umehifadhiwa kwa uaminifu kwa WLC na kufafanuliwa katika tanbihi.
