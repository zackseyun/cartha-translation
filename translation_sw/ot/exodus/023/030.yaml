base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/030.yaml
  text: Little by little I will drive them out from before you[b][a], until you become fruitful and take possession of the land.
translation:
  language: sw
  text: Kidogo kidogo nitawafukuza kutoka mbele yako[a], mpaka utakapoongezeka na kuimiliki nchi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “nitamfukuza”; umoja huo huenda unarejelea kwa ujumla wakaaji au mataifa ya nchi.
    reason: lexical_alternative
  - marker: b
    text: Au “kuirithi nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מְעַט
  choice: Kidogo kidogo
  rationale: Urudiaji wa neno מְעַט unaonyesha tendo linalofanyika hatua kwa hatua; “kidogo kidogo” huhifadhi urudiaji huo na ni Kiswahili cha kawaida.
- source_word: אֲגָרְשֶׁנּוּ
  choice: nitawafukuza
  rationale: Kitenzi גרשׁ humaanisha kufukuza au kuondoa kwa nguvu. Ingawa kiambishi cha Kiebrania ni cha umoja wa kiume, kinarejelea kwa maana ya jumla wakaaji au mataifa yaliyotajwa katika muktadha; wingi ni wa asili na wazi zaidi katika Kiswahili.
- source_word: מִפָּנֶיךָ
  choice: kutoka mbele yako
  rationale: Huhifadhi kwa njia inayoeleweka nahau ya Kiebrania yenye maana ya kuwaondoa wasiwe tena mbele au katika uwepo wa Israeli.
- source_word: עַד אֲשֶׁר
  choice: mpaka
  rationale: Muungano huu unaonyesha kikomo au hatua inayotarajiwa kabla ya tendo la taratibu kukamilika.
- source_word: תִּפְרֶה
  choice: utakapoongezeka
  rationale: פרה inaweza kumaanisha kuzaa sana au kuongezeka. Katika muktadha huu inahusu Israeli kuongezeka kwa idadi ili iweze kuikalia nchi; “utakapoongezeka” huwasilisha maana hiyo kwa uwazi.
- source_word: וְנָחַלְתָּ
  choice: na kuimiliki
  rationale: נחל katika muktadha huu ni kupokea na kushika nchi kuwa milki. “Kuimiliki” ni wazi katika Kiswahili, huku uwezekano wa “kuirithi” ukihifadhiwa katika tanbihi.
- source_word: אֶת־הָאָרֶץ
  choice: nchi
  rationale: הָאָרֶץ inarejelea nchi iliyoahidiwa katika muktadha; “nchi” ni tafsiri ya kawaida na ya moja kwa moja.
theological_decisions:
- issue: Kiambishi cha umoja chenye rejeleo la kijumla katika ahadi ya kuwafukuza wakaaji
  choice: Kutumia wingi “nitawafukuza” katika matini na kueleza umoja wa Kiebrania katika tanbihi.
  alternative: “Nitamfukuza,” ili kuonyesha moja kwa moja umoja wa kisarufi wa Kiebrania.
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya tatu, umoja wa kiume, lakini katika muktadha kinawakilisha kwa ujumla wakaaji au mataifa ya nchi. Wingi huepuka dhana potovu ya mtu mmoja bila kuficha umbo la chanzo, ambalo limeelezwa katika tanbihi.
- issue: Maana ya נחל kuhusu nchi
  choice: “Kuimiliki nchi” katika matini.
  alternative: “Kuirithi nchi.”
  rationale: Kitenzi kinaweza kuonyesha kupokea nchi kama urithi au kuichukua iwe milki. Muktadha unasisitiza kuingia na kuikalia nchi, kwa hiyo “kuimiliki” ni wazi; “kuirithi” imeonyeshwa kama tafsiri nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida na unaoeleweka. Urudiaji “kidogo kidogo” umehifadhiwa kwa sababu ni wa asili katika Kiswahili na unaakisi msisitizo wa chanzo. Viambishi vya nafsi ya pili vya umoja vinahifadhi jinsi Mungu anavyosema na Israeli kama jumuiya moja.
