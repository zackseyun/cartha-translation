  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶל פְּנֵ֖י הָ/אָדֹ֥ן יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/017.yaml
  text: Three times in the year every male among you shall appear before the Lord Yahweh[a].
translation:
  language: sw
  text: Mara tatu kwa mwaka, kila mwanamume miongoni mwenu ataonekana mbele za Bwana Yahwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mbele za Bwana Yahwe.” Hapa “Bwana” ni cheo, na “Yahwe” ni jina la Mungu.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: Mara tatu
  rationale: Hutoa kwa ufupi na kwa Kiswahili cha kawaida maana ya idadi ya nyakati au matukio.
- source_word: בַּשָּׁנָה
  choice: kwa mwaka
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba jambo hili linatokea mara tatu ndani ya mzunguko wa kila mwaka.
- source_word: יֵרָאֶה
  choice: ataonekana
  rationale: Niphal ya ראה inaweza kumaanisha ‘kuonekana’ au, katika muktadha huu, ‘kufika na kuonekana mbele ya’ mwenye mamlaka. ‘Ataonekana’ huhifadhi umbo na kiasi fulani cha utata wa Kiebrania huku ikieleweka kwa Kiswahili.
- source_word: כָּל זְכוּרְךָ
  choice: kila mwanamume miongoni mwenu
  rationale: Huhifadhi rejeo mahususi kwa watu wa kiume na kueleza kwa Kiswahili cha kawaida maana ya washiriki wa kiume katika jumuiya inayoambiwa.
- source_word: אֶל פְּנֵי
  choice: mbele za
  rationale: Ni msemo wa Kiswahili unaofaa kwa maana ya kufika au kuwapo mbele ya mtu.
- source_word: הָאָדֹן
  choice: Bwana
  rationale: Hapa אָדוֹן ni cheo cha Mungu; ‘Bwana’ ndiyo tafsiri ya kawaida, yenye heshima na iliyo wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo, hivyo kutofautisha יְהוָה na הָאָדֹן.
theological_decisions:
- issue: Uwasilishaji wa הָאָדֹן יְהוָה, yaani cheo cha Mungu kikifuatiwa na jina lake
  choice: Bwana Yahwe
  alternative: Bwana MUNGU
  rationale: ‘Bwana Yahwe’ huhifadhi tofauti iliyopo katika Kiebrania kati ya cheo הָאָדֹן na jina binafsi יְהוָה bila kuvifanya vyote kuwa vyeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka lakini huhifadhi mtindo wa kisheria wa aya na utofauti kati ya cheo cha Mungu na jina lake.
