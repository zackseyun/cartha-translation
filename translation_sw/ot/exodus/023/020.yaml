base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
translation:
  language: sw
  text: Tazama, ninamtuma malaika[a] mbele yako ili akulinde njiani na akulete mahali nilipopatayarisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe.” Neno la Kiebrania מַלְאָךְ linaweza kumaanisha mjumbe wa kibinadamu au mjumbe wa kimalaika; hapa “malaika” linafaa zaidi katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linahifadhi kazi ya chembe ya Kiebrania ya kuvuta fikira kwa uzito, kwa Kiswahili cha sasa na chenye hadhi.
- source_word: אָנֹכִי שֹׁלֵחַ
  choice: ninamtuma
  rationale: Muundo huu unaonyesha tendo la Mungu linaloendelea au lililo karibu kutendeka; kiambishi cha nafsi kinaonyesha wazi ‘mimi’ bila kuongeza msisitizo kupita kiasi.
- source_word: מַלְאָךְ
  choice: malaika
  rationale: Neno la Kiebrania linaweza kumaanisha mjumbe wa kibinadamu au wa mbinguni; katika muktadha huu kazi ya ulinzi na uongozi inaelekea zaidi kwa malaika, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: לְפָנֶיךָ
  choice: mbele yako
  rationale: Ni usemi wa kawaida unaohifadhi maana ya kwenda kwa kutangulia.
- source_word: לִשְׁמָרְךָ בַּדָּרֶךְ
  choice: akulinde njiani
  rationale: ‘Kulinda’ linaonyesha wazi ulinzi, na ‘njiani’ linaeleza safari au njia bila kudokeza kizuizi.
- source_word: וְלַהֲבִיאֲךָ
  choice: na kukuleta
  rationale: Hifili ya בוא ina maana ya kusababisha kuja, yaani kuleta; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: הַמָּקוֹם אֲשֶׁר הֲכִנֹתִי
  choice: mahali nilipopatayarisha
  rationale: ‘Mahali’ ni tafsiri ya kawaida ya מָקוֹם, na ‘nilipopatayarisha’ huhifadhi maana ya mahali palipowekwa tayari na Mungu.
theological_decisions:
- issue: Utambulisho wa מַלְאָךְ katika muktadha huu
  choice: Kutafsiri ‘malaika’ bila kufafanua katika matini kuu kama ni kiumbe wa kimalaika aliyeumbwa au udhihirisho maalumu wa BWANA.
  alternative: mjumbe wa kibinadamu; au Malaika wa BWANA kama mjumbe wa kipekee mwenye hali ya kimungu
  rationale: Aya yenyewe inamtaja tu kama מַלְאָךְ. Muktadha mpana unaibua maswali kuhusu hadhi yake, kwa hiyo tafsiri haipaswi kuamua utambulisho wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Umoja wa nafsi ya pili umehifadhiwa kwa ‘yako,’ ‘akulinde,’ na ‘kukuleta.’
