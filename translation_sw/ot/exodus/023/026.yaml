  text: There shall not be one miscarrying or barren in your land[b][a]; I will fill up the number of your days.
translation:
  language: sw
  text: Katika nchi yako hakutakuwa na mwanamke ambaye mimba yake huharibika[a] wala mwanamke tasa; nami nitaitimiza idadi ya siku zako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyefiwa na mtoto.” Neno la Kiebrania linaweza kumaanisha kwa upana zaidi kunyimwa mtoto, lakini hapa, likiwa pamoja na “tasa,” yaelekea linahusu kuharibika kwa mimba au kupoteza mtoto wakati wa kujifungua.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kwa karibu zaidi: “nitajaza idadi ya siku zako,” yaani, nitaufikisha muda wako wa kuishi kwenye kiwango chake kamili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁכֵּלָה
  choice: mwanamke mwenye kuharibikiwa na mimba
  rationale: Umbo hili la kike, likiwa sambamba na עֲקָרָה na katika muktadha wa baraka ya uzazi, linaelekea kumaanisha mwanamke anayepoteza mimba au mtoto wakati wa kujifungua. Usemi huu ni wa kawaida na haudokezi kwamba mwanamke mwenyewe amesababisha mimba iharibike.
- source_word: עֲקָרָה
  choice: mwanamke aliye tasa
  rationale: “Tasa” ni neno sanifu, fupi, na linaloeleweka kwa kutoweza kuzaa; umbo la kike la Kiebrania limewekwa wazi kwa “mwanamke.”
- source_word: בְּאַרְצֶךָ
  choice: katika nchi yako
  rationale: אֶרֶץ hapa ni nchi ambayo Israeli angekaa, si dunia kwa ujumla. “Nchi yako” huhifadhi pia nafsi ya pili ya umoja ya Kiebrania.
- source_word: אֶת מִסְפַּר יָמֶיךָ
  choice: idadi ya siku zako
  rationale: Huu ni uhamisho wa karibu wa nahau ya Kiebrania inayomaanisha muda wa maisha uliopangiwa, bila kuibadili moja kwa moja kuwa maelezo “muda wako wa kuishi.”
- source_word: אֲמַלֵּא
  choice: nitaitimiza
  rationale: Kitenzi מלא humaanisha kujaza au kufanya kitu kiwe kamili. Kwa Kiswahili, “nitaitimiza idadi” huwasilisha kwa kawaida wazo la kuifikisha hesabu ya siku kwenye kiwango chake kamili.
- source_word: לֹא תִהְיֶה
  choice: hakutakuwa na
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowasilisha sentensi ya uwepo iliyokanushwa katika Kiebrania.
theological_decisions:
- issue: Upeo wa ahadi ya uzazi na maisha marefu
  choice: Mstari umetafsiriwa kama ahadi ya baraka ya agano katika nchi, ikihusisha kutoharibika kwa mimba, kutokuwapo kwa utasa, na kutimia kwa muda wa maisha.
  alternative: Kuifanya kuwa ahadi ya kila wakati kwamba kila mwamini binafsi hatapoteza mimba, hatakuwa tasa, wala hatakufa mapema.
  rationale: Muktadha wa karibu ni ahadi za agano kwa Israeli kuhusu maisha katika nchi. Tafsiri haiongezi dai la jumla lisilotajwa wazi katika mstari.
- issue: Maana ya מְשַׁכֵּלָה
  choice: Kupoteza mimba au mtoto katika uzazi kumewekwa katika matini, huku maana pana ya kufiwa ikiwekwa katika tanbihi.
  alternative: Kutafsiri kwa maana pana tu ya “aliyefiwa.”
  rationale: Kuunganishwa kwake na “tasa” katika muktadha wa uzazi kunaunga mkono maana maalumu, lakini mzizi wa Kiebrania unaweza kuwa na maana pana zaidi; tanbihi huhifadhi utata huo halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. “Mwenye kuharibikiwa na mimba” limechaguliwa badala ya usemi unaoweza kudokeza utoaji wa mimba wa kukusudia; “nitaitimiza idadi ya siku zako” huhifadhi nahau ya kuhesabu siku huku ikisomeka kwa kawaida.
