  yaml_path: translation/ot/exodus/023/006.yaml
  text: You shall not pervert the justice due to your poor person in his dispute[a].
translation:
  language: sw
  text: Usipotoshe haki ya maskini wako katika kesi yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usimnyime maskini wako haki katika shauri lake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: Usi-
  rationale: Kikanushi cha amri ya mtu wa pili umoja kinaonyesha katazo moja kwa moja na kwa kawaida katika Kiswahili.
- source_word: תַטֶּה
  choice: potoshe
  rationale: Hifili ya נטה hapa ina maana ya kugeuza au kupinda hukumu kwa njia isiyo ya haki; “potosha” hubeba maana ya kuharibu haki katika muktadha wa mahakama.
- source_word: מִשְׁפַּט
  choice: haki
  rationale: Katika muktadha huu wa kisheria, neno linamaanisha haki au uamuzi wa haki unaomstahili mhusika, si hukumu kwa maana ya adhabu tu.
- source_word: אֶבְיֹנְךָ
  choice: maskini wako
  rationale: “Maskini” humaanisha mtu asiye na mali au mwenye uhitaji. Kiambishi cha umilikaji cha mtu wa pili umoja kimehifadhiwa kwa “wako”; Kiswahili hakilazimishi kuongeza jinsia hapa.
- source_word: בְּרִיבוֹ
  choice: katika kesi yake
  rationale: רִיב inaweza kumaanisha mgogoro, shauri, au kesi. “Kesi” huweka wazi mazingira ya kisheria, huku kiambishi cha mtu wa tatu umoja kikihifadhiwa kwa “yake” bila kulazimisha jinsia.
theological_decisions:
- issue: Ikiwa katazo linahusu upendeleo dhidi ya maskini badala ya upendeleo kwao
  choice: Katazo ni la kumpokonya maskini haki anayostahili katika kesi yake.
  alternative: Usimnyime maskini haki katika shauri lake.
  rationale: Muundo wa Kiebrania unaweka מִשְׁפַּט kuwa kitu kinachopotoshwa na unamtaja maskini kama mhusika wa kesi. Tafsiri inadumisha lengo la haki mahakamani bila kugeuza mstari kuwa kauli pana isiyo na muktadha wa kisheria.
translation_notes:
  register: Lugha ni ya sasa, yenye heshima, na ya moja kwa moja. “Usipotoshe haki” inadumisha taswira ya kisheria ya maandishi ya Kiebrania; tanbihi inatoa ufasiri wa kawaida zaidi wa maana hiyo. Alama ya tanbihi imewekwa katika matini kuu.
