base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/033.yaml
  text: They must not dwell in your land[a], lest they cause you to sin against me; for if you serve their gods[c][b], it will surely become a snare to you.
translation:
  language: sw
  text: Wasikae katika nchi yako, wasije wakakufanya unitendee dhambi.[a] Kwa maana, ukiutumikia miungu yao,[b] jambo hilo litakuwa mtego kwako.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasije wakakusababishia unitendee dhambi” au “wasije wakakuongoza katika kunitendea dhambi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa maana utaitumikia miungu yao.” Kiunganishi cha Kiebrania kinaweza kueleweka kuwa kinatoa sababu, na kishazi hiki kinaweza kusomwa kama matokeo yanayotarajiwa badala ya sharti tu.
    reason: alternative_reading
  - marker: c
    text: “Mtego” hutafsiri neno la Kiebrania moqesh, yaani kifaa cha kunasia, linalotumiwa hapa kimajazi kwa kitu kinachoongoza kwenye kuanguka au kumwacha Mungu.
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ
  choice: wakae
  rationale: Kitenzi ישׁב kinaweza kumaanisha kukaa, kuishi, au kufanya makao. Katika muktadha wa watu kuendelea kuwapo katika nchi, “wakae” ni ya kawaida na haiongezi wazo la makazi ya kudumu lisilosemwa wazi.
- source_word: בְּאַרְצְךָ
  choice: katika nchi yako
  rationale: אֶרֶץ hapa ni eneo la nchi aliyopewa Israeli; “nchi yako” ni tafsiri ya kawaida na huhifadhi muktadha wa eneo.
- source_word: פֶּן
  choice: wasije
  rationale: פֶּן huanzisha matokeo yasiyotakiwa ambayo onyo linakusudia kuyazuia. Muundo wa Kiswahili “wasije waka-” huwasilisha nguvu hiyo kwa kawaida.
- source_word: יַחֲטִיאוּ אֹתְךָ לִי
  choice: wakakusababisha unitendee dhambi
  rationale: 'Hiphil ya חטא ni ya kusababisha: kuwafanya wengine watende dhambi. “Unitendee dhambi” huonyesha kwamba kosa hilo linaelekezwa dhidi ya Mungu, kama inavyodokezwa na לִי.'
- source_word: תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: ukiitumikia miungu yao
  rationale: עבד pamoja na miungu humaanisha kuitumikia au kuiabudu. “Kuitumikia” huhifadhi lugha ya utii na uaminifu wa kidini; umoja wa kitenzi unafuatana na nomino “miungu” kama kundi.
- source_word: אֱלֹהֵיהֶם
  choice: miungu yao
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya wingi na inafaa katika onyo dhidi ya ibada ya miungu ya mataifa hayo.
- source_word: יִהְיֶה לְךָ לְמוֹקֵשׁ
  choice: jambo hilo litakuwa mtego kwako
  rationale: מוֹקֵשׁ ni mtego unaotumiwa kimajazi kwa kile kinacholeta kuanguka au maangamizi. “Jambo hilo” huonyesha kwa kawaida kwamba kitendo cha kuitumikia miungu yao ndicho kinachokuwa mtego, huku sitiari ikihifadhiwa.
theological_decisions:
- issue: Aina ya dhambi inayoongelewa katika onyo
  choice: Onyo linaelekezwa hasa kwa kutokuwa waaminifu kwa Mungu kwa kuitumikia miungu mingine.
  alternative: Onyo la jumla kuhusu kupotoshwa kimaadili na wakaaji wa mataifa mengine.
  rationale: Kishazi kinachotaja kuitumikia miungu yao kinafafanua dhambi inayolengwa. Tafsiri haipanui onyo hili kuwa dai la jumla kuhusu ukabila au utamaduni.
- issue: Uhusiano wa kishazi תַעֲבֹד אֶת אֱלֹהֵיהֶם na onyo
  choice: 'Kimewasilishwa kama hali: “ukiitumikia miungu yao.”'
  alternative: 'Kinaweza kueleweka kama matokeo yanayotarajiwa: “kwa maana utaitumikia miungu yao.”'
  rationale: כִּי inaweza kutambulisha sababu au kusomwa kwa maana ya hali katika mfuatano huu. Tafsiri kuu inatumia hali kwa Kiswahili cha kawaida, na tanbihi inahifadhi uwezekano wa usomaji wa sababu/matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “wasije waka-” umechaguliwa badala ya “ili wasije” kwa ufupi wa kawaida. Alama za tanbihi zimewekwa baada ya maneno au vishazi vinavyohusika moja kwa moja.
