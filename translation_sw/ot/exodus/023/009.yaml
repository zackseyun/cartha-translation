base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/009.yaml
  text: You shall not oppress a sojourner[a], and you yourselves know the soul of the sojourner[b], because you were sojourners in the land of Egypt.
translation:
  language: sw
  text: Usimwonee mgeni[a]; nanyi mnajua maisha ya mgeni[b], kwa maana ninyi wenyewe mlikuwa wageni katika nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkaaji mgeni” au “mtu wa kigeni.” Neno la Kiebrania ger humaanisha mtu asiye mzawa anayeishi miongoni mwa watu wengine, mara nyingi akiwa katika hali dhaifu kijamii.
    reason: lexical_alternative
  - marker: b
    text: Kwa maneno halisi, “mnajua nafsi ya mgeni”; ni nahau inayoonyesha kwamba mnajua kwa uzoefu maisha au hali ya mgeni.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: mgeni
  rationale: Katika sheria hii, neno hili humaanisha mtu asiye mzawa anayeishi miongoni mwa watu wengine, mara nyingi akiwa katika hali dhaifu kijamii. “Mgeni” ni neno la kawaida na lenye hadhi katika Kiswahili; tanbihi inafafanua kuwa si msafiri wa muda mfupi tu.
- source_word: תִלְחָץ
  choice: usimwonee
  rationale: Kitenzi hiki kinaonyesha kumkandamiza au kumtendea mtu isivyo haki kwa kutumia nguvu au nafasi. “Kumwonea” ni kauli ya asili katika Kiswahili na hubeba uzito wa kijamii na kimaadili wa muktadha huu.
- source_word: וְאַתֶּם יְדַעְתֶּם
  choice: nanyi mnajua
  rationale: Kiwakilishi kilicho wazi katika Kiebrania kinasisitiza uzoefu wa Waisraeli wenyewe. “Nanyi” huhifadhi msisitizo huo kwa mtiririko wa kawaida wa Kiswahili.
- source_word: נֶפֶשׁ הַגֵּר
  choice: hali ya mgeni
  rationale: Katika nahau hii, נֶפֶשׁ haimaanishi tu nafsi kama sehemu tofauti ya mwanadamu, bali maisha ya ndani na hali anayopitia mtu. “Hali ya mgeni” huwasilisha maarifa yatokanayo na uzoefu bila kuingiza dhana ya mgawanyo wa mwili na roho.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya amri. “Kwa maana” kinafaa katika lugha ya kisheria yenye hadhi na kinaonyesha uhusiano wa kisababishi.
- source_word: גֵרִים הֱיִיתֶם
  choice: mlikuwa wageni
  rationale: Kurudia mzizi uleule wa “mgeni” huhifadhi uhusiano wa kimakusudi kati ya mtu anayelindwa na uzoefu wa Waisraeli nchini Misri.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Tafsiri hii hufuata muundo wa Kiebrania na kuhifadhi mwangwi rasmi wa ukumbusho huo.
theological_decisions:
- issue: Maana ya גֵר katika sheria ya agano
  choice: mgeni
  alternative: mkaaji mgeni; mtu wa kigeni
  rationale: Hoja ya aya inategemea uzoefu wa Israeli kama watu wasio wazawa walioishi Misri. “Mgeni” huhifadhi upana wa kundi la kijamii bila kulifanya suala la kabila pekee, huku tanbihi ikizuia lisieleweke kama mgeni wa kutembelea tu.
- issue: Nahau נֶפֶשׁ הַגֵּר
  choice: hali ya mgeni
  alternative: nafsi ya mgeni; maisha ya mgeni; jinsi mgeni anavyojisikia
  rationale: Kiebrania kinaacha usemi wenye upana unaohusu maisha ya ndani na hali halisi ya mgeni. “Hali” ni ya asili katika Kiswahili na haibani maana kuwa hisia pekee wala kuingiza dhana maalumu kuhusu nafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama sheria ya Kiebrania. “Usimwonee” ni wa asili zaidi kuliko “usimkandamize” hapa, na “hali ya mgeni” huleta maana ya nahau kwa uwazi huku tanbihi ikihifadhi umbo lake halisi.
