  yaml_path: translation/ot/exodus/023/002.yaml
  text: You shall not follow the many to do evil[a], and you shall not testify in a dispute so as to turn aside after the many, to pervert justice.
translation:
  language: sw
  text: Usifuate wengi kutenda maovu, wala usitoe ushahidi katika shauri kwa kuunga mkono wengi ili kupotosha haki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala usijibu katika shauri kwa kuegemea upande wa wengi, ili kupindisha hukumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִהְיֶה אַחֲרֵי רַבִּים
  choice: ufuate wengi
  rationale: Muundo wa kuwa nyuma ya wengi una maana ya kuwafuata au kujiunga nao; tafsiri hii ni ya kawaida na inadumisha onyo dhidi ya kushawishiwa na wengi.
- source_word: לְרָעֹת
  choice: kutenda maovu
  rationale: Kihusishi ל pamoja na umbo hili huonyesha kusudi au matokeo; “kutenda maovu” inadumisha uzito wa kimaadili wa neno la Kiebrania.
- source_word: תַעֲנֶה
  choice: utoe ushahidi
  rationale: Katika muktadha wa kisheria, ענה hurejelea kusema kama shahidi; “kutoa ushahidi” huweka wazi mazingira ya kesi kwa Kiswahili cha kawaida.
- source_word: עַל רִיב
  choice: katika kesi
  rationale: רִיב inaweza kumaanisha mgogoro au shauri la kisheria. “Katika kesi” inafaa muktadha wa ushahidi na upotoshaji wa haki.
- source_word: לִנְטֹת
  choice: kwa kupotoka
  rationale: נטה humaanisha kuelekea upande fulani au kupotoka. Hapa inaonyesha kuacha yaliyo sawa kwa sababu ya kuwafuata wengi.
- source_word: אַחֲרֵי רַבִּים
  choice: kuwafuata wengi
  rationale: Kurudia “wengi” kunadumisha msisitizo wa Kiebrania kuhusu shinikizo la watu wengi bila kulazimisha dhana rasmi ya kura ya wengi.
- source_word: לְהַטֹּת
  choice: ili kupotosha haki
  rationale: Katika mazingira ya kisheria, umbo la kusababisha la נטה lina maana ya kugeuza au kupotosha hukumu. “Haki” ni yambwa inayoeleweka kutokana na muktadha.
theological_decisions:
- issue: Nguvu ya kisheria na kimaadili ya kishazi cha mwisho
  choice: ili kupotosha haki
  alternative: ili kugeuza hukumu
  rationale: Kiebrania hakitaji yambwa waziwazi, lakini muktadha wa ushahidi na kesi unaonyesha kupindishwa kwa haki au hukumu. Kutaja “haki” kunafafanua bila kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Wengi” limetumiwa badala ya “wengi walio upande mmoja” au “kundi kubwa” ili kuhifadhi urudiaji na upana wa רַבִּים; tanbihi inadumisha uwezekano wa kutafsiri תַעֲנֶה kama “kujibu” na לְהַטֹּת kama “kugeuza hukumu.”
