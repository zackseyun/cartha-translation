base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/013.yaml
  text: He went out the next day[a], and behold, two Hebrew men were fighting. And he said to the wicked one[b], “Why are you striking your companion?”
translation:
  language: sw
  text: Akatoka siku iliyofuata, na tazama, wanaume wawili Waebrania walikuwa wakipigana. Akamwambia yule mkosaji[a], “Kwa nini unampiga mwenzako[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yule mwovu” au “yule aliyekuwa na kosa.”
    reason: lexical_alternative
  - marker: b
    text: Au “mwenzi wako” au “jirani yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi cha Qal wayyiqtol kinaendeleza simulizi kwa tendo rahisi la kutoka; mhusika, Musa, anaeleweka kutokana na muktadha uliotangulia.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Siku iliyofuata
  rationale: Kihalisi ni ‘siku ya pili,’ lakini katika mfululizo huu wa simulizi humaanisha siku iliyofuata; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Neno hilo linawasilisha jambo lililoonekana ghafla au kwa msisitizo. ‘Na tazama’ linahifadhi nguvu hiyo ya kisimulizi bila kuifuta.
- source_word: שְׁנֵי אֲנָשִׁים עִבְרִים
  choice: wanaume wawili Waebrania
  rationale: Tafsiri hii inadumisha idadi, jinsia ya nomino, na utambulisho wa kikabila uliotajwa wazi katika Kiebrania.
- source_word: נִצִּים
  choice: walikuwa wakipigana
  rationale: Kivumishi-tendo cha Niphal kinaonyesha pambano lililokuwa likiendelea; swali linalofuata kuhusu kumpiga mwingine linathibitisha kuwa ugomvi huo ulikuwa wa kimwili.
- source_word: לָרָשָׁע
  choice: yule aliyekuwa na kosa
  rationale: Katika ugomvi huu, רָשָׁע humtaja aliyekuwa upande wa makosa au mkosaji. Usemi huu unahifadhi hukumu ya kimaadili ya hali hiyo bila kulazimisha kwamba unaeleza tabia yake yote ya maisha.
- source_word: לָמָּה תַכֶּה
  choice: Kwa nini unampiga
  rationale: Kitenzi kisichotimilika katika swali hili kinaeleweka kama tendo linaloendelea wakati huo; ‘unampiga’ ni Kiswahili cha asili na cha moja kwa moja.
- source_word: רֵעֶךָ
  choice: mwenzako
  rationale: רֵעַ inaweza kumaanisha mwenzi, mwenzake, jirani, au mtu wa jamii moja. ‘Mwenzako’ linafaa kwa Mwebrania mmoja anayemtendea Mwebrania mwenzake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. ‘Na tazama’ kimedumishwa ili kuhifadhi msisitizo wa וְהִנֵּה; miundo mingine imewekwa kwa mpangilio wa kawaida wa Kiswahili. Alama za tanbihi zimeunganishwa na maneno yanayohusika, kwa kuwa alama katika safu ya Kiingereza zilionekana kutolingana na maelezo yake.
