base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/007.yaml
  text: Then his sister said to Pharaoh’s daughter[a], “Shall I go and call a nursing woman from the Hebrew women for you, so that she may nurse the child for you?”
translation:
  language: sw
  text: Ndipo dada yake akamwambia binti ya Farao, “Niende nikakuitie mwanamke anayenyonyesha kutoka miongoni mwa wanawake Waebrania, ili akunyonyeshee mtoto?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Ndipo” na kitenzi cha masimulizi huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: אֲחֹתוֹ
  choice: dada yake
  rationale: Kiambishi cha nafsi ya tatu umoja wa kiume kinamrejelea mtoto; tafsiri hii inaacha rejeleo hilo likieleweka kutokana na muktadha kama katika Kiebrania.
- source_word: בַּת פַּרְעֹה
  choice: binti ya Farao
  rationale: Muundo wa construct chain umetafsiriwa kwa umilikaji wa kawaida wa Kiswahili.
- source_word: הַאֵלֵךְ וְקָרָאתִי
  choice: Niende nikakuitie
  rationale: Swali lenye imperfect ya nafsi ya kwanza linatoa pendekezo la heshima. Muundo wa “niende nika-” unaonyesha kwenda kwa kusudi la kumwita mtu, bila kuongeza wazo la lazima la kumleta.
- source_word: אִשָּׁה מֵינֶקֶת
  choice: mwanamke anayenyonyesha
  rationale: Hii inawakilisha kwa uwazi mwanamke mwenye uwezo wa kumnyonyesha mtoto, bila kutumia neno linaloweza kueleweka kwa upana kama “mlezi.”
- source_word: מִן הָעִבְרִיֹּת
  choice: kutoka miongoni mwa wanawake Waebrania
  rationale: Kihusishi kinaonyesha uteuzi kutoka ndani ya kundi la wanawake Waebrania.
- source_word: וְתֵינִק לָךְ
  choice: ili akunyonyeshee
  rationale: Hiphil ya ינק hapa ni kumnyonyesha mtoto. Muundo wa “ili” unaonyesha kusudi la pendekezo, na kiambishi cha kutendea kinahifadhi maana ya לָךְ, ‘kwa ajili yako.’
- source_word: הַיָּלֶד
  choice: mtoto
  rationale: Neno linaweza kumaanisha mtoto au mvulana; “mtoto” linafaa kwa mtoto mchanga katika tukio hili bila kubainisha zaidi kuliko neno lenyewe.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Maandiko. Maneno “mwanamke anayenyonyesha” yamechaguliwa kwa uwazi wa kisasa; hakuna tanbihi inayohitajika kwa kuwa maana ya mlezi anayemnyonyesha mtoto imeelezwa moja kwa moja.
