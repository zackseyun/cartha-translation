base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/010.yaml
  text: When the child grew[a], she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, for she said[b], “I drew him out of the water.”
translation:
  language: sw
  text: Mtoto alipokua, mama yake akampeleka kwa binti Farao, naye akawa mwana wake.[a] Binti Farao akampa jina Musa,[b] akisema, “Kwa sababu nilimtoa majini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawa mwana kwake” au “akawa kama mwana kwake.” Kiebrania hakielezi taratibu za kisheria za kuasili.
    reason: lexical_alternative
  - marker: b
    text: Katika Kiebrania, jina Moshe (Musa) linafanana kwa sauti na neno linalomaanisha “nilimtoa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִגְדַּל
  choice: alipokua
  rationale: Kitenzi גדל hapa kinaonyesha mtoto kukua kwa umri. Muundo wa “alipokua” unaunganisha kwa kawaida hatua hii na tukio linalofuata.
- source_word: הַיֶּלֶד
  choice: Mtoto
  rationale: יֶלֶד inaweza kumaanisha mtoto au mvulana; “mtoto” inadumisha maana pana na muktadha wa utoto wake.
- source_word: וַתְּבִאֵהוּ
  choice: mama yake akampeleka
  rationale: Hifili ya בוא humaanisha “kuleta/kupeleka.” “Mama yake” huweka wazi mtendaji anayeeleweka kutoka muktadha uliotangulia, bila kubadili tendo lenyewe.
- source_word: לְבַת פַּרְעֹה
  choice: kwa binti Farao
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi uhusiano wa umilikaji katika muundo wa Kiebrania.
- source_word: וַיְהִי לָהּ לְבֵן
  choice: naye akawa mwana wake
  rationale: Usemi huu unaonyesha kwamba mtoto alipata hadhi halisi ya kuwa mwana wa binti Farao, bila kuongeza maelezo kuhusu taratibu rasmi za kuasili.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: akampa jina
  rationale: Hii ni tafsiri ya kawaida na ya asili ya fomula ya Kiebrania ya kumpa mtu jina.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ni umbo la kawaida la jina hili katika Biblia na matumizi ya Kiswahili.
- source_word: כִּי
  choice: Kwa sababu
  rationale: Neno hili linaanzisha sababu iliyotolewa na binti Farao kwa kumpa mtoto jina hilo.
- source_word: מִן הַמַּיִם
  choice: majini
  rationale: Kiswahili “majini” huwasilisha kwa kawaida wazo la kutoka ndani ya maji katika muktadha wa kuokolewa.
- source_word: מְשִׁיתִהוּ
  choice: nilimtoa
  rationale: Kitenzi משה hapa ni kumtoa mtu kutoka majini. “Nilimtoa” ni cha asili na sahihi katika Kiswahili, ingawa mchezo wa sauti wa Kiebrania unahitaji kuelezwa katika tanbihi.
theological_decisions:
- issue: Hali ya uhusiano katika וַיְהִי לָהּ לְבֵן
  choice: “akawa mwana wake,” ikionyesha hadhi ya kimwana kwa binti Farao
  alternative: “akawa kama mwana kwake,” jambo ambalo lingeweza kumaanisha uhusiano wa kufanana tu na ule wa mama na mwana
  rationale: Kiebrania kinasema kwamba akawa mwana kwake, lakini hakielezi utaratibu wowote rasmi wa kisheria. Tafsiri inahifadhi dai lenye nguvu la simulizi bila kuingiza maelezo yasiyosemwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. “Mama yake” limetajwa ili kuepusha utata wa kiima katika Kiswahili; utambulisho huo unatokana na muktadha wa karibu. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyofafanuliwa.
