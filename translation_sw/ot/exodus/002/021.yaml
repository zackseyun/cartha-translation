translation:
  language: sw
  text: Musa akakubali kuishi na mtu huyo[a], naye akampa Musa binti yake Sipora[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Musa akawa tayari kuishi na mtu huyo.” Kitenzi cha Kiebrania kinaweza kueleza kuwa tayari, kukubali, au kuridhika.
    reason: lexical_alternative
  - marker: b
    text: Yaani, alimpa Sipora awe mke wa Musa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: akakubali
  rationale: Kitenzi יאל hapa kinaonyesha kukubali au kuwa tayari kufanya jambo. “Akakubali” ni Kiswahili cha kawaida kinacholingana vizuri na kitenzi-jina kinachofuata, huku maana mbadala ikihifadhiwa katika tanbihi.
- source_word: לָשֶׁבֶת
  choice: kuishi
  rationale: Ingawa ישב kimsingi yaweza kumaanisha kuketi, katika muktadha huu inamaanisha kukaa mahali kama makazi; “kuishi” ni ya asili na wazi kwa msomaji wa leo.
- source_word: הָאִישׁ
  choice: mtu huyo
  rationale: Kiebrania kinasema kihalisi “huyo mtu/mwanamume.” “Mtu huyo” hurejelea kwa kawaida mtu aliyetajwa katika muktadha bila kuingiza jina lisilomo katika mstari huu.
- source_word: וַיִּתֵּן
  choice: akampa
  rationale: נתן maana yake ya moja kwa moja ni “kutoa/kumpa.” Muundo wa Kiswahili “akampa Musa” huhifadhi maana hiyo bila kuongeza wazi “kuwa mke,” jambo ambalo muktadha unadokeza.
- source_word: צִפֹּרָה
  choice: Sipora
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: בִּתּוֹ
  choice: binti yake
  rationale: Kiambishi cha umilikaji humrejelea mtendaji wa tendo la kutoa; “binti yake” ni tafsiri ya moja kwa moja.
- source_word: לְמֹשֶׁה
  choice: Musa
  rationale: Herufi לְ humtambulisha mpokeaji. Katika muundo wa kitenzi “akampa,” Kiswahili huonyesha mpokeaji kwa yambwa “Musa” bila kuhitaji kihusishi “kwa.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mpangilio wa “akampa Musa binti yake” umebadilishwa kuwa “akampa Musa binti yake Sipora” kwa mtiririko wa kawaida, huku tanbihi ya ndoa ikiwekwa baada ya jina linalohusika.
