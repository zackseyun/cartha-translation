  yaml_path: translation/ot/exodus/002/008.yaml
  text: Pharaoh’s daughter said to her, “Go.” So the young woman went and called the child’s mother.
translation:
  language: sw
  text: Binti ya Farao akamwambia, “Nenda.” Basi yule msichana akaenda akamwita mama wa mtoto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: Binti ya Farao
  rationale: Muundo huu wa umilikaji ni wa kawaida katika Kiswahili na unaakisi moja kwa moja kirai cha Kiebrania kinachomaanisha binti wa Farao.
- source_word: לֵכִי
  choice: Nenda
  rationale: Ni amri fupi kwa nafsi ya kike umoja; “Nenda” huhifadhi ufupi na nguvu ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: הָעַלְמָה
  choice: yule msichana
  rationale: עַלְמָה humaanisha mwanamke kijana au msichana wa umri wa kuolewa. Katika muktadha huu, “msichana” ni neno la kawaida na linalofaa kwa dada ya Musa, huku “yule” likimtambulisha kama aliyekwisha tajwa.
- source_word: וַתִּקְרָא אֶת אֵם הַיָּלֶד
  choice: akamwita mama wa mtoto
  rationale: קרא pamoja na yambwa inaweza kumaanisha kuita au kumwita mtu aje. “Akamwita” ni ya asili katika Kiswahili na huhifadhi usimulizi wa moja kwa moja.
- source_word: הַיָּלֶד
  choice: mtoto
  rationale: יֶלֶד inaweza kuwa mtoto au mvulana; hapa inamhusu Musa akiwa mchanga, hivyo “mtoto” ni sahihi bila kuongeza ubainishaji usiotajwa katika kishazi.
