language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ֠/יֹּאמֶר מִ֣י שָֽׂמְ/ךָ֞ לְ/אִ֨ישׁ שַׂ֤ר וְ/שֹׁפֵט֙ עָלֵ֔י/נוּ הַ/לְ/הָרְגֵ֨/נִי֙ אַתָּ֣ה אֹמֵ֔ר כַּ/אֲשֶׁ֥ר הָרַ֖גְתָּ אֶת הַ/מִּצְרִ֑י וַ/יִּירָ֤א מֹשֶׁה֙ וַ/יֹּאמַ֔ר אָכֵ֖ן נוֹדַ֥ע הַ/דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/014.yaml
  text: But he said[a], “Who made you a ruler and a judge over us? Are you saying, ‘Will you kill me as you killed the Egyptian?’” Then Moses was afraid and said, “Surely the matter has become known.”
translation:
  language: sw
  text: Lakini yule mtu akasema, “Ni nani aliyekuweka kuwa mtawala na mwamuzi juu yetu? Je, unasema[a], ‘Utaniua kama ulivyomuua yule Mmisri?’” Ndipo Musa akaogopa na kusema, “Hakika jambo hili limejulikana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, unakusudia kuniua kama ulivyomuua yule Mmisri?”
    reason: Muundo wa Kiebrania unaweza kueleweka ama kama swali kuhusu anachosema Musa ama kama swali kuhusu kusudi lake.
lexical_decisions:
- source_word: מִי שָׂמְךָ
  choice: Ni nani aliyekuweka
  rationale: Swali hili linapinga mamlaka ya Musa. ‘Aliyekuweka’ linaakisi maana ya שׂים ya kuweka au kuteua mtu katika nafasi fulani.
- source_word: לְאִישׁ שַׂר וְשֹׁפֵט
  choice: kuwa mtawala na mwamuzi
  rationale: Katika Kiswahili cha kawaida, אִישׁ hapa hufanya kazi ndani ya usemi wa kumtaja mtu mwenye nafasi; kuitafsiri kando kuwa ‘mtu’ kungefanya sentensi iwe nzito. ‘Mtawala na mwamuzi’ huhifadhi majukumu mawili ya mamlaka na kutoa hukumu.
- source_word: עָלֵינוּ
  choice: juu yetu
  rationale: Kihusishi kinaonyesha mamlaka inayodaiwa juu ya wasemaji, si tendo linalofanywa kwa faida yao.
- source_word: הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: Je, unasema, ‘Utaniua ...?’
  rationale: Tafsiri hii inadumisha kitenzi אֹמֵר, ‘unasema,’ na hali ya swali, huku ikitoa Kiswahili cha asili. Muundo wa Kiebrania pia unaweza kueleweka kama kuuliza kusudi, jambo linalowekwa katika tanbihi.
- source_word: כַּאֲשֶׁר הָרַגְתָּ אֶת־הַמִּצְרִי
  choice: kama ulivyomuua yule Mmisri
  rationale: ‘Kama’ linaonyesha ulinganisho wa moja kwa moja na tendo la awali. ‘Yule Mmisri’ humrejelea Mmisri maalumu aliyetajwa katika simulizi.
- source_word: וַיִּירָא מֹשֶׁה
  choice: Ndipo Musa akaogopa
  rationale: Muundo wa masimulizi wa Kiswahili unaonyesha mwendelezo wa tukio na mwitikio wa Musa kwa habari hiyo.
- source_word: אָכֵן
  choice: Hakika
  rationale: Neno hili linaonyesha uthibitisho na utambuzi wa Musa kwamba alichofanya kimefahamika.
- source_word: נוֹדַע הַדָּבָר
  choice: jambo hili limejulikana
  rationale: Kauli hii inaonyesha kwamba jambo hilo limekuja kujulikana; ‘jambo hili’ ni rejeo la kawaida la Kiswahili kwa tukio linalozungumziwa.
theological_decisions:
- issue: Usemi wa kiume לְאִישׁ katika changamoto ya mamlaka
  choice: kuwa mtawala na mwamuzi
  alternative: kuwa mtu, mtawala na mwamuzi
  rationale: אִישׁ ni nomino ya kiume, lakini hapa imefungamana kwa uhusiano wa apposition na majukumu yanayofuata. Katika Kiswahili, kuongeza ‘mtu’ hakungeongeza taarifa kuhusu mhusika na kungefanya changamoto isikike isiyo ya asili; ‘mtawala na mwamuzi’ huhifadhi maudhui ya msingi bila kubadili jinsia ya mhusika.
- issue: Maana ya הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: Je, unasema, ‘Utaniua ...?’
  alternative: Je, unakusudia kuniua ...?
  rationale: Muundo huo unaweza kusisitiza kusema au kusudia. Matini kuu inadumisha אֹמֵר kwa ‘unasema,’ huku tanbihi ikihifadhi usomaji wa kusudi bila kuamua kimya kimya kati ya uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa Maandiko. ‘Yule mtu’ huweka wazi kwamba msemaji ni mmoja wa wale wanaume wa mstari uliotangulia bila kuongeza jina lisilokuwapo katika chanzo.
