  text: וַ/יְהִ֣י בַּ/יָּמִ֣ים הָ/הֵ֗ם וַ/יִּגְדַּ֤ל מֹשֶׁה֙ וַ/יֵּצֵ֣א אֶל אֶחָ֔י/ו וַ/יַּ֖רְא בְּ/סִבְלֹתָ֑/ם וַ/יַּרְא֙ אִ֣ישׁ מִצְרִ֔י מַכֶּ֥ה אִישׁ עִבְרִ֖י מֵ/אֶחָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/011.yaml
  text: It happened in those days[a], when Moses had grown up, that he went out to his brothers and saw their burdens. And he saw an Egyptian man striking a Hebrew man, one of his brothers.
translation:
  language: sw
  text: Ikawa katika siku zile, Musa alipokwisha kukua, akatoka kwenda kwa ndugu zake[a], akaona mizigo yao. Akamwona Mmisri akimpiga Mwebrania, mmoja wa ndugu zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa zake” au “watu wake” badala ya “ndugu zake” / “mmoja wa ndugu zake.” Kiebrania kinatumia lugha ya kifamilia kuonyesha jinsi Musa alivyojitambulisha na Waebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: Ikawa katika siku zile
  rationale: Inahifadhi kauli ya Kiebrania ya kuendeleza simulizi kwa Kiswahili cha kawaida na chenye hadhi, bila kuongeza neno linalomaanisha ‘sasa’ ambalo halipo wazi katika chanzo.
- source_word: וַיִּגְדַּל
  choice: alipokuwa amekua
  rationale: Katika muktadha huu kitenzi kinaonyesha kuwa Musa alikuwa amefikia utu uzima, si kwamba alikuwa amepata ukuu au hadhi.
- source_word: אֶל אֶחָיו
  choice: kwa ndugu zake
  rationale: Tafsiri hii inahifadhi lugha halisi ya kifamilia na mshikamano wa Musa na Waebrania; ‘jamaa zake’ au ‘watu wake’ ni tafsiri mbadala zinazowezekana.
- source_word: בְּסִבְלֹתָם
  choice: mizigo yao
  rationale: Neno hilo humaanisha mizigo au kubeba mizigo na katika muktadha linadokeza kazi ya kulazimishwa; ‘mizigo yao’ huhifadhi maana halisi bila kuifafanua kupita kiasi.
- source_word: אִישׁ מִצְרִי
  choice: Mmisri
  rationale: Kiswahili hutumia nomino ya utaifa kwa mtu kwa njia ya kawaida, hivyo si lazima kuongeza ‘mwanaume’ ili kuwakilisha אִישׁ.
- source_word: מַכֶּה
  choice: akimpiga
  rationale: Muundo huu unaonyesha tendo la kushambulia lililokuwa likiendelea Musa alipoliona, bila kuamua kwa lazima kiwango cha ukali kinachoweza kudokezwa na ‘akimcharaza’ au ‘akimponda.’
- source_word: אִישׁ עִבְרִי
  choice: Mwebrania
  rationale: Ni namna ya kawaida na sahihi ya Kiswahili ya kumtaja mtu wa Waebrania; neno ‘mwanaume’ linaeleweka kutokana na ngeli ya nomino.
- source_word: מֵאֶחָיו
  choice: mmoja wa ndugu zake
  rationale: Inahifadhi uhusiano wa kileksia na ‘ndugu zake’ iliyotangulia na kusisitiza kwamba Mwebrania huyo alikuwa mmoja wa watu wa Musa mwenyewe.
theological_decisions:
- issue: Tafsiri ya lugha ya undugu אֶחָיו / מֵאֶחָיו
  choice: ndugu zake / mmoja wa ndugu zake
  alternative: jamaa zake / watu wake
  rationale: ‘Ndugu’ huhifadhi taswira ya kifamilia ya Kiebrania na mshikamano wa Musa na Waebrania, huku tanbihi ikionyesha kwamba maana inaweza kuwa pana kuliko ndugu wa kuzaliwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa ‘Ikawa katika siku zile’ unadumisha mwendo wa kisimulizi wa Kiebrania. Alama ya tanbihi imewekwa baada ya ‘ndugu zake,’ ambako maelezo yake ya kileksia yanahusika moja kwa moja.
