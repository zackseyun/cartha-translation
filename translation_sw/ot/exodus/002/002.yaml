base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/002.yaml
  text: The woman became pregnant and gave birth to a son. When she saw that he was good[a], she hid him for three months.
translation:
  language: sw
  text: Mwanamke huyo akapata mimba, akazaa mwana. Alipoona kwamba mtoto huyo alikuwa mzuri[a], akamficha kwa miezi mitatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwema.” Kiebrania kinasema “mzuri,” neno ambalo katika muktadha linaweza pia kumaanisha mwema, wa kupendeza, au mwenye sura nzuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: akapata mimba
  rationale: Kitenzi הרה humaanisha kushika au kupata mimba. ‘Akapata mimba’ ni Kiswahili cha kawaida na kinaendeleza mfuatano wa simulizi.
- source_word: הָאִשָּׁה
  choice: mwanamke huyo
  rationale: Kiebrania kinasema wazi ‘mwanamke’; ‘huyo’ huunganisha rejeo hili kwa kawaida na muktadha bila kuongeza neno ‘mke’ lisilomo katika aya.
- source_word: וַתֵּלֶד בֵּן
  choice: akazaa mwana
  rationale: Huu ni usemi wa kawaida wa Kiebrania kuhusu kuzaa. ‘Akazaa mwana’ ni wa moja kwa moja, wa heshima, na wa asili katika simulizi la Kiswahili.
- source_word: וַתֵּרֶא אֹתוֹ כִּי טוֹב הוּא
  choice: Alipoona kwamba mtoto huyo alikuwa mwema
  rationale: Muundo huu unaeleza jinsi mama alivyomtambua mtoto. ‘Alipoona kwamba’ huwasilisha vizuri mtiririko wa simulizi, na ‘mtoto huyo’ huondoa utata wa kiwakilishi bila kubadili rejeo.
- source_word: טוֹב
  choice: mwema
  rationale: טוֹב ina maana pana ya kuwa mwema, mzuri, wa kupendeza, au bora. ‘Mwema’ huhifadhi maana ya msingi ya ‘good’ na mwangwi unaowezekana wa lugha ya Mwanzo, huku maana ya sura nzuri ikiwekwa katika tanbihi.
- source_word: וַתִּצְפְּנֵהוּ
  choice: akamficha
  rationale: צפן humaanisha kuficha au kusitiri. ‘Akamficha’ ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: שְׁלֹשָׁה יְרָחִים
  choice: kwa miezi mitatu
  rationale: יֶרַח ni mwezi, kihistoria ukihusishwa na mzunguko wa mwezi angani. ‘Kwa miezi mitatu’ huwasilisha muda huo kwa Kiswahili cha kawaida bila ufafanuzi usiohitajika.
theological_decisions:
- issue: Maelezo ya mtoto kwa neno טוֹב
  choice: mwema
  alternative: mzuri / mwenye sura nzuri
  rationale: Maana ya msingi ya טוֹב ni ‘mwema’ au ‘mzuri,’ na inaweza pia kumaanisha mwenye kupendeza au mwenye sura nzuri katika muktadha. ‘Mwema’ hudumisha upana wa neno na mwangwi unaowezekana wa Mwanzo bila kulazimisha hukumu ya urembo; tafsiri ya ‘mwenye sura nzuri’ imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Viunganishi vya ‘aka-’ vinadumisha mwendo wa simulizi. Tanbihi huhifadhi upana wa טוֹב bila kuufanya mwili wa aya kuwa mzito.
