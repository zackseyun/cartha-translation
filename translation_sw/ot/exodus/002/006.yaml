  text: She opened it and saw him[a], the child, and behold, a boy was crying. She had compassion on him and said[c][b], “This is one of the Hebrews’ children.”
translation:
  language: sw
  text: Akaifungua, akamwona—yule mtoto[a]—na tazama, mvulana alikuwa akilia[b]. Akamhurumia[c], akasema, “Huyu ni mmoja wa watoto wa Waebrania.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia kwanza kiambishi cha umoja wa kiume katika “akamwona” kabla ya kumtaja wazi kuwa “mtoto.”
    reason: lexical_alternative
  - marker: b
    text: “Tazama” linatafsiri chembe ya Kiebrania inayovuta fikira kwa msisitizo kwenye jambo aliloliona.
    reason: lexical_alternative
  - marker: c
    text: Au “akamwonea huruma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: Akaifungua
  rationale: Kitenzi ni ‘akafungua’; kiambishi cha kitu -i- kinaelekezwa na muktadha kwa kile kikapu/sanduku, bila kukitaja upya.
- source_word: וַתִּרְאֵהוּ אֶת־הַיֶּלֶד
  choice: akamwona—yule mtoto—
  rationale: Kiambishi cha umoja wa kiume katika ‘akamwona’ kinahifadhiwa, na kirai kinachofuata ‘yule mtoto’ kinatolewa kama ufafanuzi wa kiambatanisho.
- source_word: הַיֶּלֶד
  choice: mtoto
  rationale: Neno hili ni la jumla kwa mtoto na halibani umri zaidi ya chanzo.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi chembe ya mazungumzo inayovuta fikira kwa nguvu kwenye jambo aliloliona.
- source_word: נַעַר
  choice: mvulana
  rationale: Katika muktadha huu humtaja mtoto wa kiume; ‘mvulana’ huhifadhi jinsia bila kudokeza lazima kwamba ni kijana mkubwa.
- source_word: בֹּכֶה
  choice: alikuwa akilia
  rationale: Muundo endelevu unaonyesha kitendo kilichokuwa kikiendelea wakati alipomwona.
- source_word: וַתַּחְמֹל עָלָיו
  choice: Akamhurumia
  rationale: ‘Kumhurumia’ hutoa maana ya kusikia huruma kwa mtu bila kutanguliza tendo la kumwokoa.
- source_word: מִיַּלְדֵי הָעִבְרִים
  choice: mmoja wa watoto wa Waebrania
  rationale: Muundo wa מן ni wa sehemu ya kundi; tafsiri hii ni ya kawaida na huhifadhi uhusiano wa mtoto na watu wa Kiebrania.
- source_word: הָעִבְרִים
  choice: Waebrania
  rationale: Hili ni jina la kikabila la kawaida katika Kiswahili cha Biblia.
- source_word: זֶה
  choice: Huyu ni
  rationale: Kiwakilishi kionyeshi kinamwelekeza mtoto aliye mbele yake na kinatolewa kwa Kiswahili cha kawaida.
