translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi wa ‘aka-’ umetumiwa kwa mfuatano wa matendo; ‘na tazama’ limehifadhiwa ili kuonyesha msisitizo wa chanzo. Mistari mirefu inaweka ‘yule mtoto’ kama ufafanuzi wa ‘akamwona’ bila kufuta mpangilio usio wa kawaida wa Kiebrania.
