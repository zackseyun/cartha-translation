  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfuatano na maana ya Kiebrania: kufungua chombo, kumwona mtoto, chembe ya msisitizo, mtoto wa kiume akilia, huruma, na utambulisho wake kuwa miongoni mwa watoto wa Waebrania. Utoaji wa “akamwona—yule mtoto—” unahifadhi kwa njia ya Kiswahili kiambishi cha kiume kinachotangulia utambulisho wazi wa mtoto.'
  naturalness: Kiswahili ni cha kawaida na kina hadhi ya masimulizi ya kibiblia. Hata hivyo, “Akamhurumia na kusema” si mfuatano ulio wazi na wa asili sawa na vitenzi vya simulizi vya chanzo; “Akamhurumia, akasema” ni sahihi zaidi. Maelezo ya tanbihi b pia yana usemi usio wa kawaida (“kwa uhai kwenye jambo”).
  terminology: “Waebrania,” “mtoto,” “mvulana,” na “huruma” zinafaa katika Kiswahili Sanifu cha Afrika Mashariki na haziongezi tafsiri ya kiteolojia. “Tazama” ni utoaji unaofaa wa וְהִנֵּה.
