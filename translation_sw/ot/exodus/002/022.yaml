  yaml_path: translation/ot/exodus/002/022.yaml
  text: She gave birth to a son[a], and he called his name Gershom, for he said[b], “I have been a sojourner in a foreign land.”
translation:
  language: sw
  text: Akamzaa mwana wa kiume, naye akamwita Gershomu,[a] kwa maana alisema, “Nimekuwa mgeni katika nchi ya kigeni.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Gershomu linasikika kama maneno ya Kiebrania yanayohusiana na usemi “mgeni huko,” kulingana na maelezo ya Musa kuhusu jina hilo.
    reason: lexical_alternative
  - marker: b
    text: Au, “Nilikuwa mgeni katika nchi ya kigeni.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּלֶד בֵּן
  choice: Akamzaa mwana wa kiume
  rationale: Kitenzi ילד hapa kina maana ya kuzaa, na בֵּן ni mwana wa kiume. Usemi huu ni wa kawaida na unaweka wazi jinsia ya mtoto.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: naye akamwita jina lake
  rationale: Inahifadhi kwa ukaribu fomula ya Kiebrania ya ‘kuliita jina lake’ na uhusiano wake na maelezo ya jina yanayofuata.
- source_word: גֵּרְשֹׁם
  choice: Gershomu
  rationale: Jina limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili huku likibaki karibu na matamshi ya Kiebrania.
- source_word: כִּי אָמַר
  choice: kwa maana alisema
  rationale: כִּי inaanzisha sababu au maelezo ya jina; ‘kwa maana’ huwasilisha kazi hiyo kwa lugha yenye hadhi na iliyo ya asili.
- source_word: גֵּר
  choice: mgeni
  rationale: גֵּר humaanisha mtu asiye mwenyeji anayeishi miongoni mwa watu wengine. ‘Mgeni’ ni neno la kawaida la Kiswahili na linafaa kwa kujieleza kwa Musa.
- source_word: הָיִיתִי
  choice: Nimekuwa
  rationale: Kauli timilifu inaweza kutaja hali iliyofikia wakati wa kumpa mtoto jina; ‘nimekuwa’ huhifadhi uwezekano wa hali kuendelea hadi wakati huo.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: katika nchi ya kigeni
  rationale: נָכְרִיָּה humaanisha isiyo ya mtu au ya kigeni. Tafsiri hii ni wazi na inahifadhi mwangwi wa ‘mgeni’ na ‘ya kigeni’.
