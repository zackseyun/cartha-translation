base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/003.yaml
  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
translation:
  language: sw
  text: Lakini aliposhindwa kumficha tena, akachukua kikapu cha mafunjo kwa ajili yake, akakipaka lami na zifti. Kisha akamweka mtoto ndani yake na kukiweka katikati ya matete kando ya Mto Nile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצְּפִינוֹ
  choice: kuendelea kumficha
  rationale: Kitenzi katika muundo wa Hifili pamoja na kiambishi cha nafsi ya tatu ya kiume humaanisha kumficha; pamoja na עוֹד, Kiswahili cha kawaida kinahitaji wazo la kuendelea.
- source_word: תֵּבַת גֹּמֶא
  choice: kikapu cha mafunjo
  rationale: תֵּבָה ni chombo au sanduku, na katika muktadha huu ni chombo kidogo cha mtoto; גֹּמֶא ni mmea wa mafunjo. 'Kikapu cha mafunjo' ni sahihi na kinaeleweka kwa urahisi, huku dokezo likihifadhi mwangwi wa safina ya Nuhu.
- source_word: וַתַּחְמְרָה בַחֵמָר
  choice: akakipaka lami
  rationale: Kitenzi kinaeleza kupaka au kufunika, na חֵמָר ni bitumeni/lami. 'Kupaka lami' ni usemi wa asili na unaofahamika katika Kiswahili.
- source_word: וּבַזָּפֶת
  choice: na utomvu
  rationale: זֶפֶת ni nyenzo ya kunata ya kuziba maji, yaani pitch. 'Utomvu' huitofautisha na חֵמָר bila kutumia neno lilelile mara mbili.
- source_word: הַיֶּלֶד
  choice: mtoto
  rationale: יֶלֶד humaanisha mtoto au mvulana; 'mtoto' huhifadhi upana wa neno na inafaa kwa muktadha wa mtoto mchanga.
- source_word: בַּסּוּף
  choice: katikati ya matete
  rationale: סוּף hurejelea matete au mimea ya majini; 'katikati ya matete' huonyesha kuwekwa ndani ya mimea hiyo.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: kando ya Mto Nile
  rationale: Katika muktadha wa Misri, יְאֹר ni Nile. 'Kando ya Mto Nile' ni Kiswahili cha kawaida kinachoonyesha ukingo wa mto.
- source_word: לֹא יָכְלָה עוֹד
  choice: aliposhindwa kuendelea
  rationale: Muunganiko huu huonyesha kwamba hakuweza kufanya jambo hilo tena; tafsiri hii ni ya asili na hudumisha kikomo cha uwezo wake.
- source_word: לּוֹ
  choice: akamtengenezea
  rationale: Dativi 'kwa ajili yake' imejumuishwa katika kiambishi -e- cha kitenzi, ambacho kwa kawaida huonyesha tendo kufanywa kwa manufaa ya mtoto.
theological_decisions:
- issue: Mwangwi wa תֵּבָה kati ya Musa na Nuhu
  choice: Neno kuu limetafsiriwa 'kikapu,' na uhusiano wa kifasihi umeelezwa katika tanbihi.
  alternative: Kutumia 'safina' katika matini kuu.
  rationale: '''Kikapu'' hufaa zaidi kwa ukubwa na matumizi ya chombo hiki katika Kiswahili cha sasa, lakini tanbihi huhifadhi kwa uwazi mwangwi muhimu wa wokovu kupitia maji bila kuufanya kuwa tafsiri pekee ya neno.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa vitenzi vya -ka- hudumisha mwendo wa simulizi. 'Mafunjo' ni mahususi kuliko 'matete' kwa nyenzo ya kikapu, huku 'matete' yakifaa kwa mimea ya ukingoni.
