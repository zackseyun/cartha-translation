base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/009.yaml
  text: Then Pharaoh’s daughter said to her[a], “Take this child and nurse him for me, and I will give you your wages.” So the woman took the child and nursed him.
translation:
  language: sw
  text: Ndipo binti Farao akamwambia, “Mchukue mtoto huyu, umnyonyeshe kwa ajili yangu, nami nitakupa ujira wako.” Basi yule mwanamke akamchukua mtoto na kumnyonyesha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: binti Farao
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi uhusiano wa ukoo unaoonyeshwa na mnyororo wa maneno katika Kiebrania.
- source_word: הֵילִיכִי
  choice: Mchukue
  rationale: Amri ya hifili ya הלך hapa inatumika kwa maana ya kumchukua au kumpeleka mtoto; “Mchukue” ni ya asili katika muktadha huu.
- source_word: הַיֶּלֶד הַזֶּה
  choice: mtoto huyu
  rationale: יֶלֶד ni neno la jumla kwa mtoto au mvulana; “mtoto huyu” haliongezi umahususi usiotajwa katika kifungu.
- source_word: וְהֵינִקִהוּ לִי
  choice: uninyonyeshee
  rationale: Kitenzi kinamaanisha kumnyonyesha mtoto, na kiambishi cha utendea kinaeleza kwa ufupi na kwa kawaida kwamba tendo hilo lifanywe kwa niaba ya binti Farao.
- source_word: וַאֲנִי אֶתֵּן אֶת שְׂכָרֵךְ
  choice: nami nitakupa ujira wako
  rationale: שָׂכָר humaanisha ujira au malipo ya kazi; tafsiri hii inafuata kwa karibu maneno ya Kiebrania huku ikiwa ya kawaida na yenye hadhi.
- source_word: הָאִשָּׁה
  choice: yule mwanamke
  rationale: Kiebrania kinasema “mwanamke,” si “mama yake”; “yule” humrejelea mwanamke aliyekwisha tajwa bila kuingiza utambulisho mahususi zaidi katika mstari huu.
- source_word: וַתְּנִיקֵהוּ
  choice: na kumnyonyesha
  rationale: Tafsiri hii inarudia kwa uthabiti maana ileile ya kunyonyesha iliyo katika agizo lililotangulia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “uninyonyeshee” ni wa kawaida, unaeleweka, na unahifadhi maana ya kumhudumia msemaji kwa kumnyonyesha mtoto kwa niaba yake.
