  text: וַ/יְהִי֩ בַ/יָּמִ֨ים הָֽ/רַבִּ֜ים הָ/הֵ֗ם וַ/יָּ֨מָת֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יֵּאָנְח֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מִן הָ/עֲבֹדָ֖ה וַ/יִּזְעָ֑קוּ וַ/תַּ֧עַל שַׁוְעָתָ֛/ם אֶל הָ/אֱלֹהִ֖ים מִן הָ/עֲבֹדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/023.yaml
  text: It happened in those many days that the king of Egypt died[a], and the sons of Israel groaned because of the slavery and cried out[c][b], and their cry for help went up to God because of the slavery.
translation:
  language: sw
  text: Ikawa kwamba katika kipindi hicho kirefu[a] mfalme wa Misri alikufa. Wana wa Israeli[b] wakaugua kwa sababu ya utumwa[c] wakalia kwa sauti. Kilio chao cha kuomba msaada kikapanda mpaka kwa Mungu kwa sababu ya utumwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika siku zile nyingi”; kwa tafsiri yenye ufafanuzi zaidi, “baada ya muda mrefu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana wa Israeli”; usemi huu unawahusu watu wa Israeli kwa pamoja.'
    reason: lexical_alternative
  - marker: c
    text: Au, “kazi ya kulazimishwa” au “kifungo”; neno la Kiebrania hapa linamaanisha kazi ya ukandamizaji iliyofanywa katika hali ya utumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa kwamba
  rationale: Huwasilisha hatua mpya katika simulizi bila kutumia mtindo wa kizamani usio wa lazima.
- source_word: בַיָּמִים הָרַבִּים הָהֵם
  choice: katika kipindi kile kirefu
  rationale: Huhifadhi wazo la muda mrefu unaorejelewa, huku ikiwa Kiswahili cha kawaida kuliko tafsiri sisisi ya ‘katika siku zile nyingi.’
- source_word: וַיָּמָת מֶלֶךְ מִצְרַיִם
  choice: mfalme wa Misri alikufa
  rationale: Ni taarifa ya moja kwa moja inayohifadhi mhusika na tukio.
- source_word: וַיֵּאָנְחוּ
  choice: wakaugua
  rationale: Kitenzi hiki huonyesha sauti ya uchungu na dhiki iliyosababishwa na ukandamizaji.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi muundo wa Kiebrania, ingawa usemi huo unawahusu watu wa Israeli kwa pamoja.
- source_word: מִן הָעֲבֹדָה
  choice: kwa sababu ya utumwa
  rationale: Katika muktadha huu neno linamaanisha kazi ya kulazimishwa chini ya ukandamizaji, si kazi ya kawaida; ‘utumwa’ huwasilisha hali hiyo kwa uwazi.
- source_word: וַיִּזְעָקוּ
  choice: na kulia kwa sauti
  rationale: Huonyesha kilio kikali kinachotokana na dhiki, bila kuongeza mlengwa ambaye hatamkwi katika kishazi cha Kiebrania.
- source_word: וַתַּעַל שַׁוְעָתָם
  choice: Kilio chao cha kuomba msaada kikapanda
  rationale: Huhifadhi maana ya kilio cha kutaka msaada pamoja na taswira ya kupanda.
- source_word: אֶל הָאֱלֹהִים
  choice: kwa Mungu
  rationale: Ni Kiswahili cha kawaida kinachowasilisha mlengwa wa kilio bila kuongeza ufafanuzi wa kiteolojia.
- source_word: מִן הָעֲבֹדָה (second occurrence)
  choice: kwa sababu ya utumwa
  rationale: Kurudia maneno yale yale huhifadhi msisitizo na muundo unaoizunguka aya.
theological_decisions:
- issue: Maana ya עֲבֹדָה katika ukandamizaji wa Israeli
  choice: utumwa
  alternative: kazi; kazi ya kulazimishwa; kifungo
  rationale: Muktadha unaonyesha kazi ya kulazimishwa chini ya utawala dhalimu. ‘Utumwa’ haudhoofishi ukali wa hali hiyo, wala hauongezi dai la kimadhehebu.
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Chaguo hili huhifadhi namna ya usemi wa Kiebrania, huku tanbihi ikieleza kwamba unawahusu watu wa Israeli kwa pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. Marudio ya ‘kwa sababu ya utumwa’ yamehifadhiwa kwa ajili ya msisitizo wa Kiebrania.
