translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na heshima. Viambishi vya mfululizo ‘aka-’ vinahifadhi mwendo wa matukio. ‘Akaishi’ huepuka kudokeza kudumu kwa makazi kuliko chanzo kinavyosema, huku tanbihi [b] ikihifadhi urudiaji wenye maana nyingi wa ישׁב.
