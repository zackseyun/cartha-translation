  text: וַ/יִּשְׁמַ֤ע פַּרְעֹה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וַ/יְבַקֵּ֖שׁ לַ/הֲרֹ֣ג אֶת מֹשֶׁ֑ה וַ/יִּבְרַ֤ח מֹשֶׁה֙ מִ/פְּנֵ֣י פַרְעֹ֔ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ מִדְיָ֖ן וַ/יֵּ֥שֶׁב עַֽל הַ/בְּאֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/015.yaml
  text: When Pharaoh heard this matter[a], he sought to kill Moses. But Moses fled from Pharaoh and stayed in the land of Midian[b], and he sat down by the well.
translation:
  language: sw
  text: Farao aliposikia habari ya jambo hilo[a], alitaka kumuua Musa. Lakini Musa akamkimbia Farao, akaishi katika nchi ya Midiani[b], akaketi kando ya kisima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliposikia jambo hilo,” au “alipopata habari za tukio hilo.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinatumia kitenzi kilekile mara mbili: kwanza kwa maana ya kuishi au kukaa Midiani, kisha kwa maana halisi ya kuketi kando ya kisima.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: aliposikia habari ya
  rationale: Kitenzi שׁמע kimsingi ni ‘kusikia’; katika muktadha huu Farao alipata taarifa kuhusu tukio hilo. ‘Kusikia habari ya’ ni Kiswahili cha kawaida kinachohifadhi wazo hilo bila kulifafanua kupita kiasi.
- source_word: הַדָּבָר הַזֶּה
  choice: jambo hilo
  rationale: דבר hapa hurejelea tukio lililotangulia la Musa kumuua Mmisri. ‘Jambo hilo’ ni la kawaida na linaacha upana wa neno la Kiebrania.
- source_word: וַיְבַקֵּשׁ לַהֲרֹג
  choice: alitaka kumuua
  rationale: בקש pamoja na kitenzi-jina huonyesha kutaka, kutafuta nafasi, au kujaribu kutenda jambo. ‘Alitaka kumuua’ ni ya asili katika Kiswahili na haiamui kimya kimya kama jaribio la mauaji lilianza.
- source_word: וַיִּבְרַח ... מִפְּנֵי
  choice: akamkimbia
  rationale: Muundo huu unaeleza kukimbia ili kuondoka mbele ya mtu au kumwepa. ‘Akamkimbia Farao’ ni usemi mfupi na wa kawaida wa Kiswahili unaoonyesha Musa alitoroka kutoka kwake.
- source_word: וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן
  choice: akaishi katika nchi ya Midiani
  rationale: ישׁב inaweza kumaanisha kukaa, kuishi, au kufanya makao. Katika matumizi ya kwanza inaonyesha Musa kukaa Midiani, bila kulazimisha wazo la makazi ya kudumu.
- source_word: וַיֵּשֶׁב עַל הַבְּאֵר
  choice: akaketi kando ya kisima
  rationale: Katika matumizi ya pili ישׁב ina maana halisi ya kuketi. עַל hapa inawakilishwa kwa kawaida na ‘kando ya’ badala ya tafsiri ya kijuujuu ‘juu ya’.
- source_word: הַבְּאֵר
  choice: kisima
  rationale: Nomino ni dhahiri katika Kiebrania, lakini Kiswahili kwa kawaida hakina kibainishi sawa na ‘the’; muktadha unatosha kulitambulisha.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki katika Kiswahili cha Biblia.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: מִדְיָן
  choice: Midiani
  rationale: Hili ni umbo la kawaida la jina la mahali hapa katika Kiswahili cha Biblia.
