  yaml_path: translation/ot/exodus/002/001.yaml
  text: A man from the house of Levi went and took a daughter of Levi as his wife[a].
translation:
  language: sw
  text: Mwanamume mmoja wa nyumba ya Lawi akaenda akamchukua binti wa Lawi kuwa mke wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanamke Mlawi.” Kiebrania kinasema kihalisi “binti wa Lawi,” yaani, mwanamke wa uzao wa Lawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Kitenzi הלך hapa kwa kawaida humaanisha ‘kwenda’; ‘akaenda’ kinahifadhi mfuatano wa matendo katika simulizi bila kuongeza kiashiria cha wakati kisichokuwapo.
- source_word: אִישׁ
  choice: mwanamume mmoja
  rationale: Neno hili humtaja mtu wa kiume ambaye bado hajatajwa kwa jina. ‘Mwanamume mmoja’ ni Kiswahili cha kawaida na hakitangulizi mapema wazo la kuwa tayari ni mume.
- source_word: מִבֵּית לֵוִי
  choice: wa nyumba ya Lawi
  rationale: Huhifadhi picha ya Kiebrania ya ‘nyumba’ kama ukoo au nasaba na pia uhusiano wa kinasaba na Lawi.
- source_word: וַיִּקַּח
  choice: akamchukua ... kuwa mke wake
  rationale: לקח maana yake ya msingi ni ‘chukua,’ lakini katika muktadha huu ina maana ya kumchukua mwanamke katika ndoa. Kirai ‘kuwa mke wake’ kinaweka wazi maana hiyo katika Kiswahili bila kupoteza msingi wa neno.
- source_word: אֶת
  choice: '[alama ya yambwa mahususi, haitafsiriwi moja kwa moja]'
  rationale: אֶת ni alama ya kisarufi ya yambwa mahususi katika Kiebrania; haina neno huru linalolingana nayo katika Kiswahili.
- source_word: בַּת לֵוִי
  choice: binti wa Lawi
  rationale: Huhifadhi usemi halisi wa kinasaba ‘binti wa Lawi,’ unaomaanisha mwanamke wa uzao wa Lawi; tafsiri iliyo wazi zaidi imetolewa katika tanbihi.
