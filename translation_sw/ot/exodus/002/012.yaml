translation:
  language: sw
  text: Akatazama huku na huku, na alipoona kwamba hapakuwa na mtu, akampiga Mmisri, akamficha mchangani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן כֹּה וָכֹה
  choice: Akatazama huku na huku
  rationale: Ingawa פנה kimsingi ni ‘geuka,’ katika muundo huu pamoja na כֹּה וָכֹה inaeleza kutazama pande mbalimbali. ‘Akatazama huku na huku’ ni Kiswahili cha kawaida kinachohifadhi taswira hiyo.
- source_word: וַיַּרְא כִּי אֵין אִישׁ
  choice: alipoona kwamba hapakuwa na mtu
  rationale: אִישׁ ni ‘mtu/mwanamume,’ lakini katika muktadha huu usemi unaeleza kutokuwapo kwa mtu yeyote. ‘Hapakuwa na mtu’ ni wa asili na hauwekei jinsia maana ambayo si lazima hapa.
- source_word: וַיַּךְ
  choice: akampiga ... mpaka akafa
  rationale: נכה humaanisha ‘piga,’ na muktadha unaonyesha wazi kuwa pigo lilisababisha kifo. Usemi huu huhifadhi tendo la kupiga na pia matokeo yake ya kuua bila kutumia kitenzi cha moja kwa moja ‘kuua’ badala ya kitenzi cha Kiebrania.
- source_word: הַמִּצְרִי
  choice: Mmisri
  rationale: Ni jina la moja kwa moja la utaifa lenye maana ya ‘yule Mmisri’; katika Kiswahili, ‘Mmisri’ hutosha kwa kawaida katika muktadha huu.
- source_word: וַיִּטְמְנֵהוּ
  choice: akamficha
  rationale: טמן ni ‘ficha’ au ‘sitiri.’ ‘Akamficha’ huhifadhi maana ya msingi, huku mahali panapotajwa pakionyesha namna alivyoficha mwili.
- source_word: בַּחוֹל
  choice: mchangani
  rationale: חוֹל ni ‘mchanga.’ ‘Mchangani’ ni namna ya kawaida ya Kiswahili ya kueleza kufichwa ndani au chini ya mchanga.
