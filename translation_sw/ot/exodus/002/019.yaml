lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: Wakasema
  rationale: Kitenzi cha wingi wa kike kinawarejelea binti; Kiswahili hakitofautishi jinsia katika umbo hili. Kiunganishi cha simulizi kimehifadhiwa kwa kiambishi wa-.
- source_word: אִישׁ מִצְרִי
  choice: Mwanamume Mmisri
  rationale: Huhifadhi vipengele vyote viwili vya Kiebrania, ‘mwanamume’ na ‘Mmisri,’ kwa lugha ya kawaida na wazi.
- source_word: הִצִּילָנוּ מִיַּד
  choice: alituokoa kutoka mikononi mwa
  rationale: ‘Alituokoa’ linafaa kwa kuondolewa katika hatari ya kimwili; ‘mikononi mwa’ huhifadhi taswira ya mkono inayomaanisha mamlaka au nguvu.
- source_word: הָרֹעִים
  choice: wachungaji
  rationale: Ni tafsiri ya moja kwa moja ya watu waliokuwa wakichunga mifugo.
- source_word: וְגַם
  choice: Zaidi ya hayo
  rationale: Huonyesha kwamba mwanamume huyo alifanya jambo jingine lililozidi tendo la kuwaokoa.
- source_word: דָּלֹה דָלָה לָנוּ
  choice: alituchotea maji mwenyewe
  rationale: Muundo wa Kiebrania wa kitenzi-jina pamoja na kitenzi kilichokamilika unasisitiza tendo; ‘mwenyewe’ huwasilisha msisitizo kwamba yeye binafsi aliwachotea maji.
- source_word: וַיַּשְׁקְ אֶת־הַצֹּאן
  choice: na kulinywesha kundi
  rationale: ‘Kulinywesha’ hueleza kumpa mifugo maji, na ‘kundi’ huhifadhi maana ya jumla ya צאן bila kuamua kuwa ni kondoo tu au mbuzi tu.
