  yaml_path: translation/ot/exodus/002/024.yaml
  text: God heard their groaning[a], and God remembered his covenant with Abraham, with Isaac[b], and with Jacob.
translation:
  language: sw
  text: Mungu akasikia kuugua kwao[a], naye Mungu akakumbuka agano lake na Abrahamu, Isaka, na Yakobo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kilio chao cha uchungu.” Nomino ya Kiebrania inaweza kumaanisha kilio au kuugua kunakotokana na kukandamizwa.
    reason: lexical_alternative
  - marker: b
    text: “Akakumbuka” ni lugha ya agano. Haimaanishi kwamba Mungu alikuwa amesahau, bali kwamba alilizingatia agano lake kwa uaminifu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: akasikia
  rationale: Kitenzi שׁמע hapa kinaeleza Mungu kupokea kilio cha Waisraeli; “akasikia” ni cha kawaida na hakiongezi wazo la kusikiliza kwa muda mrefu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la neno la Kiebrania ni la wingi kisarufi, hapa linaambatana na vitenzi vya umoja na linamtaja Mungu mmoja.
- source_word: נַאֲקָתָם
  choice: kuugua kwao
  rationale: Neno hili hueleza kuugua au kilio cha uchungu kinachosababishwa na mateso. “Kuugua kwao” ni lugha ya asili ya Kiswahili na inadokeza taabu inayoendelea bila kulifanya kuwa ombolezo rasmi.
- source_word: וַיִּזְכֹּר
  choice: akalikumbuka
  rationale: Tafsiri hii inahifadhi maana ya moja kwa moja ya “kukumbuka” na haitangulizi katika maandishi makuu tafsiri ya hatua ambayo ingetokana na kukumbuka huko.
- source_word: בְּרִיתוֹ
  choice: agano lake
  rationale: “Agano” ndilo neno la kawaida la Kiswahili kwa בְּרִית, na “lake” kinahifadhi kiambishi cha umilikaji kinachomrejelea Mungu.
- source_word: אֶת אַבְרָהָם אֶת יִצְחָק וְאֶת יַעֲקֹב
  choice: na Abrahamu, na Isaka, na Yakobo
  rationale: “Na” huonyesha uhusiano wa agano na mababu hao. Kurudia “na” kunahifadhi kiasi cha msisitizo na mdundo wa Kiebrania bila kuongeza maneno kama “alilofanya.”
theological_decisions:
- issue: Lugha inayomwelezea Mungu kuwa “alikumbuka”
  choice: Kuhifadhi “akalikumbuka” katika maandishi makuu
  alternative: Mungu akalizingatia agano lake / Mungu akachukua hatua kwa sababu ya agano lake
  rationale: Kiebrania kinatumia lugha ya kawaida ya agano yenye kumwelezea Mungu kwa namna ya kibinadamu. “Kukumbuka” hapa huelekea kwenye uaminifu na hatua ya kiagano, lakini kutafsiri moja kwa moja kuwa “alichukua hatua” kungeondoa mvutano uliopo katika maandishi na kufafanua badala ya kutafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mfuatano wa “akasikia … kisha … akalikumbuka” unaweka wazi maendeleo ya simulizi, huku kurudiwa kwa “Mungu” na “na” kukihifadhi msisitizo wa maandishi ya Kiebrania.
