  yaml_path: translation/ot/exodus/002/018.yaml
  text: When they came to Reuel their father[a], he said, “Why have you come back so quickly today?”
translation:
  language: sw
  text: Walipofika kwa Reueli baba yao, akasema, “Kwa nini mmerudi haraka hivi leo?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Kwa nini mmeharakisha kuja leo?” Kiebrania kinatumia kitenzi “kuharakisha” pamoja na “kuja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: Walipofika
  rationale: Kitenzi hiki ni cha nafsi ya tatu, wingi wa kike, na kinawahusu wale binti. Muundo wa “Walipofika” unaunganisha matukio kwa Kiswahili cha kawaida huku ukihifadhi mtiririko wa simulizi.
- source_word: אֶל
  choice: kwa
  rationale: Katika muktadha wa kumwendea mtu, “kwa” ni kihusishi cha kawaida na cha asili katika Kiswahili.
- source_word: רְעוּאֵל
  choice: Reueli
  rationale: Jina limetoholewa moja kwa moja kutoka katika umbo la Kiebrania kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: אֲבִיהֶן
  choice: baba yao
  rationale: Nomino “baba” pamoja na kiambishi cha nafsi ya tatu wingi wa kike inaeleza wazi uhusiano wa binti hao na Reueli.
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Hili ni neno la kawaida la kuanzisha usemi katika simulizi; “akasema” huhifadhi mfuatano wa tukio bila kuongeza mhusika au namna ya kusema.
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Hili ndilo swali la kawaida la Kiswahili linalotaka sababu.
- source_word: מִהַרְתֶּן
  choice: mmerudi haraka hivi
  rationale: Kitenzi cha Kiebrania kina maana ya kufanya jambo kwa haraka. Pamoja na בֹּא na muktadha wa kurudi kutoka kisimani, tafsiri hii ni ya asili na inaonyesha mshangao juu ya kasi yao.
- source_word: בֹּא
  choice: mmerudi
  rationale: Ingawa maana ya msingi ni “kuja,” hapa binti wanakuja tena kwa baba yao; “mmerudi” huwasilisha hali hiyo kwa Kiswahili cha kawaida bila kubadili maana.
- source_word: הַיּוֹם
  choice: leo
  rationale: Umbo lenye maana ya “siku hii” hutumika kimazoea kumaanisha “leo.”
