  text: Then the shepherds came and drove them away[a], but Moses stood up and saved them, and watered their flock.
translation:
  language: sw
  text: Ndipo wachungaji wakaja na kuwafukuza. Musa akasimama, akawaokoa[a], na akalinywesha kundi lao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawakomboa.” Kitenzi cha Kiebrania kinaweza kumaanisha kuokoa au kukomboa; hapa humaanisha Musa aliwaokoa wanawake hao dhidi ya wachungaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Ndipo ... wakaja
  rationale: Muundo wa wayyiqtol unaendeleza mfululizo wa simulizi; “Ndipo” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: הָרֹעִים
  choice: wachungaji
  rationale: Kitenzi-shirikishi cha רעה kimetumiwa kama nomino kwa watu wanaochunga mifugo; “wachungaji” ni tafsiri ya kawaida na inafaa katika muktadha wa kundi kunyweshwa.
- source_word: וַיְגָרְשׁוּם
  choice: kuwafukuza
  rationale: גרש hapa huonyesha kuwaondoa wanawake hao kwa nguvu au uhasama; “kuwafukuza” huhifadhi maana hiyo kwa lugha ya asili.
- source_word: וַיָּקָם
  choice: akasimama
  rationale: קום hapa inaonyesha Musa aliinuka na kuchukua hatua; “akasimama” huhifadhi picha ya maandishi ya Kiebrania na ni ya kawaida katika Kiswahili.
- source_word: וַיּוֹשִׁעָן
  choice: akawaokoa
  rationale: Hifili ya ישׁע ina maana ya kuokoa au kukomboa; “akawaokoa” huhifadhi uzito wa kitenzi bila kukidhoofisha kuwa msaada wa kawaida tu.
- source_word: וַיַּשְׁקְ
  choice: akalinywesha
  rationale: שקה humaanisha kumpa mtu au mnyama maji; “akalinywesha” ni usemi mfupi na wa kawaida kwa kumpa maji mifugo.
- source_word: צֹאנָם
  choice: kundi lao
  rationale: צאן ni nomino ya jumla kwa mifugo midogo, hasa kondoo na mbuzi; “kundi lao” huhifadhi maana ya kijumla bila kutaja aina moja pekee.
