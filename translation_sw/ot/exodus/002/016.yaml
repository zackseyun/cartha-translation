base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/016.yaml
  text: The priest of Midian had seven daughters[b][a], and they came and drew water and filled the troughs to water their father's flock.
translation:
  language: sw
  text: Kuhani wa Midiani[a] alikuwa na binti saba. Binti hao walikuja, wakachota maji[b], wakajaza mabirika ili kunywesha kundi la baba yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuhani mmoja wa Midiani.” Kiebrania kinaweza kumtaja kuhani fulani anayejulikana au kuhani mmoja tu aliyehusishwa na Midiani.
    reason: lexical_alternative
  - marker: b
    text: “Wakachota maji” hapa ni kuyachota maji kutoka kisimani.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְכֹהֵן מִדְיָן
  choice: Kuhani wa Midiani
  rationale: כֹהֵן ni “kuhani,” na uhusiano na מִדְיָן unaelezwa kwa kawaida kama “wa Midiani.” Kiswahili hakihitaji kuongeza kiunganishi cha wakati kama “Basi” hapa; mwanzo huu unatambulisha mhusika mpya bila kuingiza wazo lisilosemwa wazi katika Kiebrania.
- source_word: שֶׁבַע בָּנוֹת
  choice: alikuwa na binti saba
  rationale: Kishazi cha Kiebrania chenye maana halisi ya “kwa kuhani ... [walikuwapo] binti saba” ni muundo wa kuonyesha umiliki; “alikuwa na binti saba” ni Kiswahili cha asili.
- source_word: וַתָּבֹאנָה
  choice: Binti hao walikuja
  rationale: Kitenzi בוא kina maana ya kuja. Kurudia nomino kwa “Binti hao” huweka wazi mhusika katika Kiswahili baada ya sentensi ya kwanza.
- source_word: וַתִּדְלֶנָה
  choice: wakachota maji
  rationale: דלה hapa ni kuchota au kuteka maji kutoka kisimani. “Kuchota maji” ni usemi wa kawaida na unaoeleweka kwa wasomaji wengi.
- source_word: וַתְּמַלֶּאנָה אֶת הָרְהָטִים
  choice: wakajaza hori
  rationale: רְהָטִים ni vyombo au mifereji ya kunyweshea wanyama. “Hori” ni neno fupi na sahihi kwa chombo hicho; umbo la umoja wa kijumla linafaa katika Kiswahili ingawa Kiebrania ni wingi.
- source_word: לְהַשְׁקֹות
  choice: ili kunywesha
  rationale: Hifili ya שקה humaanisha kuwafanya wanyama wanywe; “kunywesha” ni kitenzi cha moja kwa moja na cha kawaida.
- source_word: צֹאן אֲבִיהֶן
  choice: kundi la mifugo la baba yao
  rationale: צֹאן ni jina la kijumla la mifugo midogo, hasa kondoo na mbuzi. “Kundi la mifugo” huhifadhi maana ya kijumla bila kulazimisha kwamba kundi lilikuwa la aina moja tu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa “walikuja, wakachota, wakajaza” unaakisi mwendo wa simulizi ya Kiebrania huku ukisomeka kwa kawaida. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
