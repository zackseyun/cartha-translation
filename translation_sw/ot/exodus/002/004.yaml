  text: And his sister stood at a distance[b][a], to know what would be done to him.
translation:
  language: sw
  text: Naye dada yake akasimama kwa mbali, ili ajue ni nini ambacho kingefanywa kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ili apate kujua ni nini kingemtokea.” Kiebrania kwa maana ya karibu zaidi kinasema “ili ajue ni nini ambacho kingefanywa kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּתַצַּב
  choice: akasimama
  rationale: Kitenzi cha Kiebrania kinaonyesha kuchukua au kudumisha mahali pa kusimama. “Akasimama” ni Kiswahili cha kawaida na huhifadhi maana bila kuongeza wazo lisilo lazima.
- source_word: אֲחֹתוֹ
  choice: dada yake
  rationale: Muundo huu una maana ya moja kwa moja ya “dada yake”; katika Kiswahili “dada” ni neno la kawaida na la asili kwa ndugu wa kike.
- source_word: מֵרָחֹק
  choice: kwa mbali
  rationale: Kirai hiki huonyesha umbali wa mahali. “Kwa mbali” ni usemi wa kawaida wa Kiswahili unaolingana na “akiwa mbali” au “kutoka mbali.”
- source_word: לְדֵעָה
  choice: ili ajue
  rationale: Kitenzi-jina chenye ל kinaonyesha kusudi. “Ili ajue” huhifadhi kwa karibu maana ya Kiebrania, ingawa katika muktadha kinaweza kumaanisha “ili apate kujua.”
- source_word: מַה
  choice: ni nini ambacho
  rationale: Kiwakilishi hiki cha kuuliza kinaanzisha jambo alilotaka kujua. Muundo “ni nini ambacho” unaruhusu kauli tendwa inayofuata ibaki wazi na ya asili.
- source_word: יֵּעָשֶׂה
  choice: kingefanywa
  rationale: Hii ni Niphal imperfect ya עשה, hivyo tafsiri ya kauli tendwa “kingefanywa” huhifadhi umbo la chanzo badala ya kuligeuza moja kwa moja kuwa “kingemtokea.”
- source_word: לוֹ
  choice: kwake
  rationale: ל pamoja na kauli tendwa ya עשה inaweza kueleweka kuwa jambo linalofanywa kwake au kwa ajili yake. “Kwake” huhifadhi kwa kiasi fulani upana huo wa maana kuliko “juu yake,” huku ikibaki ya kawaida katika Kiswahili.
