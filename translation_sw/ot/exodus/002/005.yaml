base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/005.yaml
  text: Then Pharaoh’s daughter went down to bathe at the Nile[a], while her young women were walking along the bank of the Nile. She saw the basket in the midst of the reeds[c][b], and she sent her servant girl and took it.
translation:
  language: sw
  text: Kisha binti ya Farao akashuka kwenda kuoga katika Mto Naili, huku wasichana wake wakitembea kando ya mto. Akaona kikapu[a] katikati ya matete, akamtuma mjakazi wake akichukue.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “kikapu” ndilo linalotumiwa pia kuhusu “safina” ya Nuhu katika Mwanzo 6–9.
    reason: cross_reference
  - marker: b
    text: 'Kiebrania: “mjakazi wake”; katika tafsiri za jadi, wengine hutafsiri “mkono wake.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: akashuka
  rationale: Kitenzi ירד kina maana ya kushuka; “akashuka” ni cha kawaida na kinahifadhi mwelekeo wa tendo.
- source_word: בַּת פַּרְעֹה
  choice: binti ya Farao
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha wazi uhusiano wa kifamilia, huku Farao ikihifadhiwa kama cheo.
- source_word: לִרְחֹץ
  choice: kwenda kuoga
  rationale: Katika muktadha wa kushuka mtoni, רחץ inaeleweka kwa kawaida kuwa kuoga; “kwenda” huunganisha kusudi hilo kwa ufasaha.
- source_word: עַל הַיְאֹר
  choice: katika Mto Naili
  rationale: עַל imetumika hapa kwa maana ya mahali. “Katika Mto Naili” huonyesha kwamba alienda kuoga majini bila kudokeza kuwa alikuwa juu ya uso wa mto.
- source_word: וְנַעֲרֹתֶיהָ
  choice: wasichana wake
  rationale: נַעֲרוֹת humaanisha wasichana au wanawake vijana. “Wasichana wake” huhifadhi jinsia na umri bila kutumia lugha ya kizamani; muktadha unaonyesha walikuwa waandamani wake.
- source_word: הֹלְכֹת
  choice: wakitembea
  rationale: Kauli shirikishi ya Kiebrania inaonyesha tendo la nyuma lililokuwa likiendelea; “huku ... wakitembea” huwasilisha hali hiyo.
- source_word: עַל יַד הַיְאֹר
  choice: kando ya mto
  rationale: Nahau עַל יַד ina maana ya kando au pembeni mwa kitu. Hapa “kando ya mto” ni ya asili na wazi.
- source_word: הַתֵּבָה
  choice: kikapu
  rationale: Katika kisa hiki תֵּבָה ni chombo kidogo cha kumweka mtoto. “Kikapu” kinaeleweka mara moja, huku uhusiano wa neno hilo na safina ya Nuhu ukihifadhiwa katika tanbihi.
- source_word: בְּתוֹךְ הַסּוּף
  choice: katikati ya matete
  rationale: בְּתוֹךְ huonyesha kuwa kilikuwa ndani au miongoni mwa matete; “katikati ya matete” hufuata picha ya Kiebrania kwa lugha ya kawaida.
- source_word: וַתִּשְׁלַח אֶת אֲמָתָהּ
  choice: akamtuma mjakazi wake
  rationale: שלח kwa kawaida ni “kutuma,” na אֲמָתָהּ kwa vokali za WLC ni “mjakazi wake.” Muundo huu unafaa kisarufi na kimuktadha.
- source_word: וַתִּקָּחֶהָ
  choice: akakichukua
  rationale: Kiambishi cha kike katika Kiebrania kinarejelea תֵּבָה. Kiswahili hutumia ngeli ya ki- kwa “kikapu,” hivyo “akakichukua” huonyesha rejeo hilo wazi.
theological_decisions:
- issue: Tafsiri ya תֵּבָה katika simulizi la Musa
  choice: kikapu
  alternative: safina
  rationale: Neno lilelile la Kiebrania linatumika kuhusu safina ya Nuhu, lakini hapa linataja chombo kidogo kilichowekwa mateteni. “Kikapu” huwasilisha kitu kinachokusudiwa katika muktadha, na tanbihi huhifadhi mwangwi wa kifasihi wa Mwanzo 6–9.
- issue: Utambulisho wa אֲמָתָהּ
  choice: mjakazi wake
  alternative: mkono wake
  rationale: Vokali za maandishi ya WLC na muundo wenye שלח zinaunga mkono maana ya “mjakazi wake.” Usomaji wa jadi wa “mkono wake” ni muhimu lakini haupaswi kuchukua nafasi ya usomaji wa msingi; umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa masimulizi umehifadhiwa kwa viambishi vya -ka-, huku “huku ... wakitembea” ikionyesha tendo la nyuma linaloendelea. “Mto Naili” umetajwa kikamilifu mara ya kwanza na kisha “mto” ili kuepuka urudiaji usio wa lazima. Tanbihi zimepangwa mahali zinapohusika moja kwa moja.
