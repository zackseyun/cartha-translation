  text: And he said to his daughters, “Then where is he? Why is it that you left the man? Call him, so that he may eat bread.”
translation:
  language: sw
  text: Akawaambia binti zake, “Basi, yuko wapi? Kwa nini mmemwacha mtu huyo? Mwiteni aje ale chakula.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: Basi, yuko wapi?
  rationale: Kiunganishi na swali vimetafsiriwa kwa Kiswahili cha kawaida kinachoonyesha mwendelezo na mshangao wa msemaji bila kuongeza maana isiyokuwamo.
- source_word: הָאִישׁ
  choice: mtu huyo
  rationale: Katika muktadha huu neno humrejelea mwanamume aliyetajwa na mabinti; “mtu huyo” ni ya asili na hudumisha rejeo hilo.
- source_word: קִרְאֶן לוֹ
  choice: Mwiteni
  rationale: Amri ya wingi wa kike imeelekezwa kwa mabinti; Kiswahili hakionyeshi jinsia katika umbo la amri.
- source_word: וְיֹאכַל לָחֶם
  choice: aje ale chakula
  rationale: “Kula mkate” ni nahau ya Kiebrania inayoweza kumaanisha kula chakula; “aje ale chakula” huwasilisha kusudi la mwaliko kwa Kiswahili cha kawaida.
