base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/013.yaml
  text: And every firstborn of a donkey you shall redeem with a lamb; and if you do not redeem it[a], then you shall break its neck. And every firstborn of man among your sons you shall redeem.
translation:
  language: sw
  text: Kila mzaliwa wa kwanza wa punda utamkomboa kwa kondoo au mbuzi[a]; na usipomkomboa, utamvunja shingo. Na kila mzaliwa wa kwanza wa binadamu miongoni mwa wanao utamkomboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania שֶׂה humaanisha mnyama wa kundi dogo, mara nyingi kondoo au mbuzi; halina ulazima wa kumaanisha mnyama mchanga.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר חֲמֹר
  choice: mzaliwa wa kwanza wa punda
  rationale: Ingawa פֶּטֶר kihalisi ni anayefungua tumbo la uzazi, katika sheria hii ‘mzaliwa wa kwanza wa punda’ ni Kiswahili cha kawaida na sahihi.
- source_word: תִּפְדֶּה
  choice: utamkomboa
  rationale: Kitenzi פדה kinaonyesha ukombozi kwa mbadala au malipo; ‘komboa’ huhifadhi maana ya kisheria na kiibada.
- source_word: בְשֶׂה
  choice: kwa kondoo au mbuzi mchanga
  rationale: שֶׂה ni mnyama mmoja wa kundi la kondoo au mbuzi, na si lazima kondoo pekee; tafsiri hii inaweka wazi upana wa neno la Kiebrania.
- source_word: וַעֲרַפְתּוֹ
  choice: utamvunja shingo
  rationale: ערף humaanisha kuvunja shingo, si kumchinja kwa njia ya kawaida.
- source_word: בְּכוֹר אָדָם
  choice: mzaliwa wa kwanza wa kiume
  rationale: Katika muktadha huu אָדָם hutofautisha binadamu na mnyama, huku בְּכוֹר na ‘wanao’ zikielekeza kwa mwana wa kiume wa kwanza; Kiswahili hiki ni cha kawaida na hakidokezi mtu mzima.
- source_word: בְבָנֶיךָ
  choice: miongoni mwa wanao
  rationale: Kiebrania kinasema wazi ‘wana wako’; ‘wanao’ huhifadhi umahususi huo wa kijinsia.
theological_decisions:
- issue: Maana ya אָדָם katika בְּכוֹר אָדָם
  choice: mzaliwa wa kwanza wa kiume
  alternative: mzaliwa wa kwanza wa binadamu
  rationale: אָדָם hapa huonyesha kwamba anayezungumziwa ni binadamu, si mnyama. Kwa kuwa kifungu kinataja ‘wanao,’ tafsiri ya kiume inaakisi walengwa wa sheria bila kutumia ‘mtu,’ ambalo linaweza kusikika kama mtu mzima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri ya kisheria umehifadhiwa kwa vitenzi vya wakati ujao. Viwakilishi vya ngeli ya viumbe hai vimetumiwa kwa punda kwa mtiririko wa kawaida wa Kiswahili.
