base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/016.yaml
  text: And it shall be as a sign on your hand and as frontlets between your eyes[b][a], for with a strong hand Yahweh brought us out from Egypt.
translation:
  language: sw
  text: Nayo itakuwa ishara juu ya mkono wako, na tepe[a] kati ya macho yako[b], kwa maana Yahweh alitutoa kutoka Misri kwa mkono wenye nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vifungo”; kwa mapokeo, “filakteria.” Neno la Kiebrania ni adimu na yaelekea linamaanisha kitu kinachovaliwa kwenye paji la uso kama ukumbusho.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kati ya macho yako,” usemi ambao mara nyingi hueleweka kuwa “kwenye paji la uso wako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Nayo itakuwa
  rationale: Muundo huu una maana ya wakati ujao au matokeo yanayoendelea katika muktadha wa maagizo; “Nayo itakuwa” ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: לְאוֹת
  choice: ishara
  rationale: אוֹת humaanisha ishara au alama; “ishara” huhifadhi upana wa maana bila kuongeza ufafanuzi.
- source_word: עַל יָדְכָה
  choice: mkononi mwako
  rationale: Kiebrania hutaja mkono, si mkono wa juu; tafsiri hii huhifadhi picha halisi ya chanzo.
- source_word: וּלְטוֹטָפֹת
  choice: kama tepe za paji la uso
  rationale: טוֹטָפֹת ni neno adimu linaloelekea kumaanisha kitu kinachovaliwa mbele ya kichwa. “Tepe za paji la uso” hutoa picha inayoeleweka bila kuingiza moja kwa moja desturi ya baadaye ya filakteria.
- source_word: בֵּין עֵינֶיךָ
  choice: katikati ya macho yako
  rationale: Tafsiri ya karibu huhifadhi taswira ya Kiebrania; maana ya “kwenye paji la uso” imewekwa katika tanbihi kama ufafanuzi unaowezekana.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inatoa sababu ya ishara hiyo; “kwa maana” huunganisha vifungu kwa uwazi.
- source_word: בְּחֹזֶק יָד
  choice: kwa mkono wenye nguvu
  rationale: Usemi huu unaonyesha tendo la Mungu lenye nguvu huku ukihifadhi picha ya “mkono” na “nguvu” iliyo katika Kiebrania.
- source_word: הוֹצִיאָנוּ
  choice: alitutoa
  rationale: Hifili ya יצא humaanisha kusababisha kutoka; “alitutoa” ni fupi, asilia, na sahihi katika muktadha wa kutoka Misri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limewasilishwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: מִמִּצְרַיִם
  choice: Misri
  rationale: Kitenzi “alitutoa” tayari kina wazo la kutoka mahali, hivyo “Misri” ni Kiswahili asilia na huwasilisha maana kamili ya muundo wa Kiebrania.
theological_decisions:
- issue: Iwapo lugha ya mkono na macho itafsiriwe moja kwa moja au ifafanuliwe kuwa vitu maalumu vya ibada ya baadaye
  choice: 'Kuhifadhi picha halisi katika andiko kuu: “mkononi mwako” na “tepe za paji la uso katikati ya macho yako”'
  alternative: Kutumia “filakteria” au kuifanya kuwa ukumbusho wa kitamathali pekee
  rationale: Kiebrania hakitaji wazi desturi hiyo ya baadaye wala hakiamui ikiwa agizo ni halisi, la mfano, au yote mawili. Tafsiri hii huhifadhi uwazi huo wa kiufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. Taswira ya Kiebrania imehifadhiwa, huku maneno adimu na maana ya nahau yakifafanuliwa katika tanbihi.
