base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/006.yaml
  text: For seven days you shall eat unleavened bread[b][a], and on the seventh day there shall be a feast to Yahweh.
translation:
  language: sw
  text: Kwa siku saba utakula mikate isiyotiwa chachu, na siku ya saba kutakuwa na sikukuu[b] kwa ajili ya Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH; kwa kawaida hutafsiriwa “BWANA.”'
    reason: alternative_reading
  - marker: b
    text: Au, “sherehe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Kwa siku saba
  rationale: Kirai hiki kinaonyesha muda; “kwa siku saba” ni Kiswahili cha kawaida na kinaweka wazi maana ya kipindi hicho.
- source_word: תֹּאכַל
  choice: utakula
  rationale: Kitenzi hiki ni qal imperfect nafsi ya pili umoja wa kiume; katika muktadha huu wa maagizo kina nguvu ya agizo, ambayo wakati ujao wa Kiswahili unawasilisha kwa kawaida bila kulifanya kuwa kali kupita kiasi.
- source_word: מַצֹּת
  choice: mikate isiyotiwa chachu
  rationale: Neno hili linamaanisha mikate iliyoandaliwa bila chachu katika muktadha wa Pasaka; tafsiri hii ni wazi kwa wasomaji wa Kiswahili na inadumisha wingi wa neno la Kiebrania.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: na siku ya saba
  rationale: Waw limetafsiriwa kwa kiunganishi cha kawaida “na,” huku kirai kinachofuata kikionyesha wakati.
- source_word: חַג
  choice: sikukuu
  rationale: Neno hili hutaja sikukuu ya kidini yenye sherehe; “sikukuu” ni neno la kawaida, lenye heshima, na linalofaa katika muktadha huu.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahwe
  rationale: Kiambishi ל hapa kinaonyesha kwamba sikukuu imeelekezwa au kuwekwa wakfu kwa Yahwe; “kwa ajili ya” ni Kiswahili cha asili kinachoonyesha uhusiano huo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni YHWH. “Yahwe” linahifadhi jina la agano badala ya kulibadili kuwa cheo, huku tanbihi ikieleza umbo la Kiebrania.
- issue: Muundo usio na kitenzi חַג לַיהוָה
  choice: kutakuwa na sikukuu kwa ajili ya Yahwe
  alternative: ni sikukuu ya Yahwe
  rationale: Kiebrania hakina kitenzi kilichoandikwa wazi. “Kutakuwa na” hufanya sentensi iwe ya kawaida kwa Kiswahili bila kuondoa maana ya kwamba siku hiyo imekusudiwa kuwa sikukuu kwa Yahwe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa agizo umehifadhiwa kwa kutumia wakati ujao, na jina Yahwe limetumika kwa uwazi.
