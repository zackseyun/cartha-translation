  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo na maana ya Kiebrania: kipindi cha siku saba, agizo la kula mikate isiyotiwa chachu, na sikukuu katika siku ya saba inayomhusu Yahwe. Kauli “kutakuwa na” huweka kwa kawaida katika Kiswahili kiarifu cha Kiebrania kisicho na kitenzi wazi, bila kuongeza maana ya kiteolojia.'
