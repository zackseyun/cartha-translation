  text: The pillar of cloud by day and the pillar of fire by night did not depart from before the people[a].
translation:
  language: sw
  text: Nguzo ya wingu wakati wa mchana haikuondoka mbele ya watu, wala nguzo ya moto wakati wa usiku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haikusogea mbali kutoka mbele ya watu.” Kitenzi cha Kiebrania kinakazia kwamba nguzo zilizowaongoza ziliendelea kuwapo daima.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִישׁ
  choice: haikuondoka
  rationale: Kitenzi מן מוּשׁ kinaonyesha kuondoka au kusogea mbali; ‘haikuondoka’ ni Kiswahili cha kawaida kinachodumisha maana ya kwamba nguzo hizo ziliendelea kuwapo.
- source_word: עַמּוּד
  choice: nguzo
  rationale: ‘Nguzo’ ni neno la kawaida na wazi kwa kitu chenye umbo la safu iliyosimama.
- source_word: הֶעָנָן
  choice: wingu
  rationale: Ni tafsiri ya moja kwa moja ya עָנָן, huku muundo ‘nguzo ya wingu’ ukibeba uainisho wa Kiebrania kwa njia ya kawaida ya Kiswahili.
- source_word: יוֹמָם
  choice: wakati wa mchana
  rationale: Kielezi hiki cha wakati kinatofautisha mchana na usiku; usemi huu ni wa kawaida na wazi katika Kiswahili cha kisasa.
- source_word: וְעַמּוּד הָאֵשׁ
  choice: na nguzo ya moto
  rationale: Inahifadhi usambamba wa Kiebrania na taswira halisi ya moto.
- source_word: לָיְלָה
  choice: wakati wa usiku
  rationale: Ni usemi wa kawaida wa wakati unaowiana na ‘wakati wa mchana.’
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Pamoja na ‘haikuondoka,’ usemi huu unahifadhi mahali pa nguzo hizo upande wa mbele wa watu bila kuongeza ufafanuzi.
- source_word: הָעָם
  choice: watu
  rationale: Nomino hii ya umoja yenye maana ya mkusanyiko inarejelea Israeli kama jumuiya; ‘watu’ ni tafsiri ya kawaida katika muktadha huu.
