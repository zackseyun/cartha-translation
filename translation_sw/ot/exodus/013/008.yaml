  language: en
  yaml_path: translation/ot/exodus/013/008.yaml
  text: And you shall tell your son on that day[a], saying, ‘It is because of this that Yahweh acted for me when I came out of Egypt.’
translation:
  language: sw
  text: Nawe utamweleza mwana wako siku hiyo[a], ukisema, “Ni kwa sababu ya hili kwamba Yahweh alinifanyia haya nilipotoka Misri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahweh alinifanyia haya nilipotoka Misri kwa sababu ya hili.” Kiebrania kinaweza kueleweka kwa kuhusisha “hili” ama na sababu ya maadhimisho haya, ama moja kwa moja na yale aliyomfanyia Yahweh msemaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגַּדְתָּ
  choice: Nawe utamweleza
  rationale: Hifili ya נגד humaanisha kueleza, kutangaza, au kujulisha. “Utamweleza” ni Kiswahili cha kawaida na huonyesha maelezo yanayoelekezwa kwa mwana.
- source_word: לְבִנְךָ
  choice: mwana wako
  rationale: ל huonyesha anayepokea maelezo; “mwana wako” huhifadhi umoja na jinsia ya kiume ya Kiebrania.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni usemi wa wakati unaohifadhi msisitizo wa kiashiria kwa Kiswahili cha kawaida.
- source_word: לֵאמֹר
  choice: ukisema
  rationale: Jina-kitenzi hili hutanguliza yaliyomo katika maneno yanayofuata; “ukisema” ni la asili na huhifadhi muundo huo.
- source_word: בַּעֲבוּר זֶה
  choice: Ni kwa sababu ya jambo hili
  rationale: בַּעֲבוּר huonyesha sababu au msingi. “Jambo hili” huacha kiashiria זֶה kiwe wazi bila kukifungamanisha kabisa na tendo moja maalumu.
- source_word: עָשָׂה יְהוָה לִי
  choice: Yahweh alinitendea hivyo
  rationale: עשה ni pana, yaani kufanya au kutenda. “Alinitendea hivyo” ni ya kawaida kwa Kiswahili na huepuka kuongeza kitu mahsusi kisichotajwa wazi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limewasilishwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: בְּצֵאתִי מִמִּצְרָיִם
  choice: nilipotoka Misri
  rationale: ב pamoja na jina-kitenzi huonyesha wakati; tafsiri hii huhifadhi nafsi ya kwanza umoja na ni ya kawaida kwa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko lina jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Neno la kifamilia בֵּן katika agizo la agano
  choice: mwana wako
  alternative: mtoto wako
  rationale: Kiebrania ni umoja wa kiume; “mwana wako” huhifadhi taarifa hiyo ya kisarufi na kimuktadha.
- issue: Uhusiano wa זֶה na tendo la Yahweh
  choice: Maandishi makuu yanahifadhi “kwa sababu ya jambo hili,” huku dokezo likitaja uwezekano mwingine
  alternative: Yahweh alinifanyia jambo hili nilipotoka Misri
  rationale: Muundo wa Kiebrania unaweza kuunganisha “hili” na sababu ya maadhimisho au moja kwa moja na alichofanya Yahweh; utata huo haupaswi kuondolewa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa wa asili kwa Kiswahili huku nafsi ya kwanza, jina la Mungu, na utata halisi wa בַּעֲבוּר זֶה עָשָׂה vikihifadhiwa.
