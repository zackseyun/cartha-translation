base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/002.yaml
  text: Consecrate to me every firstborn[a], the first to open every womb among the sons of Israel, among man and among beast; it is mine.
translation:
  language: sw
  text: “Weka wakfu kwa ajili yangu kila mzaliwa wa kwanza, kila afunguaye tumbo miongoni mwa wana wa Israeli, wa binadamu[a] na wa wanyama; huyo ni wangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wa mwanadamu.” Neno la Kiebrania ni umoja wa jumla unaowahusu wanadamu kwa ujumla, likiwatofautisha na wanyama.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַדֶּשׁ לִי
  choice: Niwekee wakfu
  rationale: Kauli ya amri inataka mzaliwa wa kwanza atengwe kwa ajili ya Mungu kuwa mtakatifu. “Niwekee wakfu” ni Kiswahili cha kawaida chenye uzito wa kidini na pia kinaonyesha uelekeo wa לִי, “kwa ajili yangu.”
- source_word: כָל בְּכוֹר
  choice: kila mzaliwa wa kwanza
  rationale: Tafsiri hii inafuata maana ya “kila mzaliwa wa kwanza” bila kuongeza “wa kiume,” kwa kuwa neno hilo halipo wazi katika mstari huu wa Kiebrania.
- source_word: פֶּטֶר כָּל רֶחֶם
  choice: kila anayefungua tumbo la uzazi
  rationale: Hii inadumisha picha halisi ya Kiebrania ya yule anayetoka kwanza tumboni, huku ikieleweka kwa msomaji wa Kiswahili.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: miongoni mwa wana wa Israeli
  rationale: Inahifadhi umbo la chanzo, “wana wa Israeli,” badala ya kulisawazisha kuwa “Waisraeli.”
- source_word: בָּאָדָם
  choice: kwa mwanadamu
  rationale: אָדָם ni nomino ya umoja yenye maana ya jumla hapa, ikiwakilisha jamii ya wanadamu katika utofautishaji na wanyama.
- source_word: וּבַבְּהֵמָה
  choice: na kwa mnyama
  rationale: “Mnyama” huhifadhi umoja wenye maana ya jamii katika Kiebrania na ni pana kuliko “mifugo,” ingawa katika muktadha huu huenda wanyama wa kufugwa ndio wanaolengwa hasa.
- source_word: לִי הוּא
  choice: huyo ni wangu
  rationale: Kauli hii fupi inadumisha dai la Mungu la umiliki; “huyo” humrejelea kila mzaliwa wa kwanza mmoja mmoja.
theological_decisions:
- issue: Matumizi ya אָדָם kwa maana ya jamii ya wanadamu ikilinganishwa na בְּהֵמָה
  choice: mwanadamu
  alternative: binadamu
  rationale: Umoja wa jumla katika Kiebrania umehifadhiwa kwa “mwanadamu,” bila kuufanya useme mwanaume pekee. “Binadamu” limetolewa katika tanbihi kama namna mbadala ya kuonyesha maana ya jamii nzima ya wanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Niwekee wakfu” huepuka istilahi nzito isiyo ya lazima lakini huhifadhi maana ya kutengwa kwa ajili ya Mungu. Muundo wa picha “kufungua tumbo la uzazi” umeachwa ili kudumisha sitiari ya chanzo.
