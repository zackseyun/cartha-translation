revisions:
- from: '“Niwekee wakfu kila mzaliwa wa kwanza, yaani, kila anayefungua tumbo la uzazi miongoni mwa wana wa Israeli, kwa mwanadamu[a] na kwa mnyama; huyo ni wangu.”


    [a] Au, “kwa binadamu.” Neno la Kiebrania linalomaanisha “mwanadamu” limetumiwa hapa kwa maana ya wanadamu kwa ujumla, likiwatofautisha na wanyama.'
  to: “Weka wakfu kwa ajili yangu kila mzaliwa wa kwanza, kila afunguaye tumbo miongoni mwa wana wa Israeli, wa binadamu[a] na wa wanyama; huyo ni wangu.”
  rationale: 'The revision preserves the Hebrew syntax and scope while using idiomatic Kiswahili: the firstborn are those opening the womb among Israel, whether human or animal. It retains “wana wa Israeli” as a close rendering of בְּנֵי יִשְׂרָאֵל, avoids adding “wa kiume,” and keeps the final singular demonstrative for the individually conceived firstborn.'
  reviewer_model: gpt-5.6-terra
