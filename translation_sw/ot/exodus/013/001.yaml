  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: sw
  text: Kisha Yahwe[a] akamwambia Musa, akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; katika baadhi ya tafsiri jina hili pia limetolewa kuwa “Yehova.”'
