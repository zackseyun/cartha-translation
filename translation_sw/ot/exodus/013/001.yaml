lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akamwambia
  rationale: Muundo wa waw-consecutive unaendeleza simulizi, hivyo “Kisha” unaonyesha mfuatano wa matukio. Kitenzi דבר pamoja na אֶל kimetafsiriwa kwa Kiswahili cha kawaida kama “akamwambia,” badala ya usemi usio wa kawaida “akasema kwa.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa konsonanti YHWH limetoholewa kama “Yahwe,” hivyo kuhifadhi jina binafsi badala ya kulibadili kuwa cheo.
- source_word: אֶל־מֹשֶׁה
  choice: Musa
  rationale: Kiambishi cha mtendewa katika “akamwambia” kinawakilisha אֶל, na jina מֹשֶׁה limetolewa kwa umbo lake la kawaida la Kiswahili, “Musa.”
- source_word: לֵאמֹר
  choice: akisema
  rationale: Neno hili linatanguliza maneno ya moja kwa moja yanayofuata. “Akisema” linahifadhi fomula ya Kiebrania bila kuiondoa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la herufi nne YHWH. “Yahwe” linahifadhi jina hilo na ni utohozi unaokubalika wa matamshi yake; tanbihi inataja umbo jingine linalotumiwa katika baadhi ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. “Akamwambia” ni ya kawaida na wazi; “akisema” limehifadhiwa kwa sababu aya hii ni fomula ya utangulizi wa maneno yanayofuata.
