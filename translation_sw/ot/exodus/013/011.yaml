  yaml_path: translation/ot/exodus/013/011.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], as he swore to you and to your fathers, and gives it to you[b],
translation:
  language: sw
  text: Na Yahweh atakapokuingiza[a] katika nchi ya Wakanaani, kama alivyowaapia wewe na mababu zako[b], na kukupa nchi hiyo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, Kiebrania husema, “Na itakuwa kwamba.” Tafsiri imetoa nahau hiyo kwa kishazi cha wakati, “Yahweh atakapokuingiza.”
    reason: lexical_alternative
  - marker: b
    text: Au, “baba zako”; Kiebrania kwa maana halisi ni “baba zako,” lakini katika muktadha huu linaweza kurejelea mababu au wahenga wa ukoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Na wakati
  rationale: Kirai hiki kinaanzisha hali ya wakati ujao. “Na wakati” ni Kiswahili cha kawaida kinachohifadhi maana ya wakati bila kutumia muundo mzito wa neno kwa neno.
- source_word: יְבִיאֲךָ
  choice: atakapokuingiza
  rationale: Hifili ya בוא ina maana ya kusababisha mtu aingie, yaani “kuingiza.” Umbo la wakati ujao lenye -kapo- linafaa katika sentensi ya wakati inayotazamia tukio la baadaye.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa uhamishaji wa sauti badala ya kubadilishwa kuwa cheo.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  choice: katika nchi ya Wakanaani
  rationale: Pamoja na kitenzi “kuingiza,” “katika” huonyesha mwendo wa kuingia ndani. Nomino ya Kiebrania iko katika umoja wa kijumla lakini humaanisha watu wa Kanaani, hivyo “Wakanaani” ni ya kawaida na sahihi.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לְךָ
  choice: kama alivyokuapia wewe
  rationale: “Kama” huhifadhi ulinganisho na kiapo kilichotangulia. “Alivyokuapia” huonyesha kwamba aliapa kwa manufaa au kwa ahadi kwa mhusika; “wewe” husisitiza kiwakilishi kilichomo katika chanzo.
- source_word: וְלַאֲבֹתֶיךָ
  choice: na mababu zako
  rationale: Ingawa neno la msingi ni “baba,” katika muktadha wa ahadi ya vizazi humaanisha waliotangulia katika ukoo. “Mababu zako” ni Kiswahili cha kawaida; maana halisi imeainishwa katika tanbihi.
- source_word: וּנְתָנָהּ לָךְ
  choice: na kukupa nchi hiyo
  rationale: Kiambishi cha kike cha umoja kinarejelea “nchi” katika Kiebrania. Kurudia “nchi hiyo” huondoa utata ambao kiwakilishi cha Kiswahili kingeweza kuleta na kuendeleza hali ya wakati ujao inayotawaliwa na “atakapokuingiza.”
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la agano יהוה moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Walioitwa אֲבֹתֶיךָ
  choice: mababu zako
  alternative: baba zako
  rationale: Katika muktadha huu neno linawarejelea watangulizi wa ukoo waliopokea ahadi, bila kuzuia maana halisi ya “baba”; tanbihi huhifadhi uwazi huo wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Sentensi imeachwa na koma mwishoni kwa sababu mstari huu unaendelea kisarufi katika mstari unaofuata. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
