  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֣ר מַה זֹּ֑את וְ/אָמַרְתָּ֣ אֵלָ֔י/ו בְּ/חֹ֣זֶק יָ֗ד הוֹצִיאָ֧/נוּ יְהוָ֛ה מִ/מִּצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/014.yaml
  text: And when your son asks you in time to come, saying, ‘What is this?’ then you shall say to him, ‘By a mighty hand the LORD brought us out from Egypt, from the house of servants.’
translation:
  language: sw
  text: Na wakati mwanao atakapokuuliza baadaye, akisema, “Hii ni nini?” utamwambia, “Kwa mkono wenye nguvu, BWANA[a] alitutoa Misri, kutoka nyumba ya utumwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH, jina binafsi la Mungu.'
    reason: Kubainisha jina lililo katika maandishi ya Kiebrania huku tafsiri kuu ikitumia namna ya Kiswahili iliyozoeleka.
lexical_decisions:
- source_word: מָחָר (maḥar)
  choice: baadaye
  rationale: Ingawa neno hili kwa kawaida humaanisha ‘kesho,’ hapa linarejelea wakati ujao kwa upana, mtoto atakapouliza.
- source_word: בְּחֹזֶק יָד (beḥozeq yad)
  choice: kwa mkono wenye nguvu
  rationale: Huhifadhi taswira ya Kiebrania ya nguvu ya Mungu inayotenda ukombozi na ni kauli inayoeleweka kwa Kiswahili.
- source_word: מִבֵּית עֲבָדִים (mibbet ʿavadim)
  choice: kutoka nyumba ya utumwa
  rationale: ‘Nyumba’ ni taswira ya chanzo, huku ‘utumwa’ ikieleza hali ya Israeli nchini Misri bila kuibana kwa maana ya jengo halisi.
- source_word: מַה זֹּאת (mah zot)
  choice: Hii ni nini?
  rationale: Tafsiri ya moja kwa moja inayohifadhi upeo wa swali la Kiebrania bila kulifafanua kimuktadha zaidi ya chanzo.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: BWANA[a]
  alternative: Yahwe
  rationale: ‘BWANA’ ni namna iliyozoeleka na yenye hadhi katika Biblia za Kiswahili; tanbihi inabainisha kwamba maandishi ya Kiebrania yana jina binafsi la Mungu.
- issue: Taswira ya mkono wa Mungu
  choice: kwa mkono wenye nguvu
  alternative: kwa nguvu kuu
  rationale: Taswira ya ‘mkono’ imehifadhiwa kwa sababu ni sehemu muhimu ya lugha ya ukombozi katika simulizi la Kutoka, bila kudai umbo la kimwili la Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kisimulizi. ‘Mwanao’ na ‘utamwambia’ huhifadhi maelekezo ya moja kwa moja kwa mzazi mmoja; ‘alitutoa’ humhusisha msemaji na jamii iliyokombolewa.
