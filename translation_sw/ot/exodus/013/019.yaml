  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת עַצְמ֥וֹת יוֹסֵ֖ף עִמּ֑/וֹ כִּי֩ הַשְׁבֵּ֨עַ הִשְׁבִּ֜יעַ אֶת בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִיתֶ֧ם אֶת עַצְמֹתַ֛/י מִ/זֶּ֖ה אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/019.yaml
  text: And Moses took Joseph’s bones with him[a], because Joseph had made the sons of Israel solemnly swear, saying, “God will surely attend to you, and you shall bring up my bones from here with you.”
translation:
  language: sw
  text: Musa akachukua mifupa ya Yosefu pamoja naye, kwa sababu Yosefu alikuwa amewaapisha wana wa Israeli kwa dhati, akisema, “Mungu hakika atawatembelea[a], nanyi mtachukua mifupa yangu kutoka hapa pamoja nanyi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu hakika atawajilia.” Nahau hii ya Kiebrania inaweza kumaanisha Mungu kuchukua hatua ya makusudi kwa ajili ya watu wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akaichukua
  rationale: Kitenzi cha kawaida cha masimulizi לקח kimetafsiriwa kwa ‘chukua’; kiambishi cha ngeli ‘-i-’ kinarejelea ‘mifupa.’
- source_word: עַצְמוֹת / עַצְמֹתַי
  choice: mifupa / mifupa yangu
  rationale: Tafsiri halisi inalinda taswira dhahiri ya Kiebrania; ‘mabaki’ ingeongeza ufafanuzi usio lazima.
- source_word: עִמּוֹ / אִתְּכֶם
  choice: pamoja naye / pamoja nanyi
  rationale: Maneno haya yanaonyesha kuandamana; kurudiwa kwa wazo hilo kumehifadhiwa kama katika chanzo.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: alikuwa amewaapisha ... kwa dhati
  rationale: Muundo wa kisababishi pamoja na jina-kitenzi la kusisitiza unaonyesha kuwa Yosefu aliwataka waape kwa uzito; ‘kwa dhati’ huhifadhi msisitizo bila kufanya sentensi kuwa nzito.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi tamathali ya kifamilia na umbo la kiume la Kiebrania, huku ikiwa wazi katika Kiswahili sanifu.
- source_word: פָּקֹד יִפְקֹד
  choice: hakika ... atawajilia
  rationale: ‘Hakika’ huwasilisha msisitizo wa muundo wa Kiebrania, na ‘kuwajilia’ huhifadhi maana pana ya Mungu kuja kuwashughulikia watu wake kwa tendo la makusudi.
- source_word: וְהַעֲלִיתֶם
  choice: nanyi mtaipandisha
  rationale: Huhifadhi maana ya kisababishi na mwelekeo wa kupanda kutoka Misri, pamoja na nguvu ya wajibu wa kiapo katika muktadha.
- source_word: מִזֶּה
  choice: kutoka hapa
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya usemi unaoelekeza mahali walipokuwa.
theological_decisions:
- issue: Maana ya פָּקֹד יִפְקֹד אֱלֹהִים אֶתְכֶם
  choice: Hakika Mungu atawajilia
  alternative: Hakika Mungu atawaangalia; Hakika Mungu atawatembelea
  rationale: ‘Atawajilia’ huhifadhi kwa kiasi fulani upana wa nahau ya Kiebrania—kuja, kuwakumbuka au kuingilia hali yao kwa ajili yao—bila kubainisha kupita kiasi namna ya tendo la Mungu. Tanbihi inaeleza maana ya kimuktadha.
- issue: Utambulisho wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: ‘Wana wa Israeli’ huhifadhi lugha ya kifamilia ya chanzo na inarejelea kwa pamoja wazao wa Israeli bila kugeuza usemi kuwa jina la kitaifa pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi ‘aka-’ umetumiwa kwa ufasaha, huku urudiaji na mwelekeo wa ‘kupandisha’ vikihifadhiwa kutoka Kiebrania.
