  to: Musa akachukua mifupa ya Yosefu pamoja naye, kwa sababu Yosefu alikuwa amewaapisha wana wa Israeli kwa dhati, akisema, “Mungu hakika atawatembelea[a], nanyi mtachukua mifupa yangu kutoka hapa pamoja nanyi.”
