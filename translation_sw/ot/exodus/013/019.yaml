review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Moses taking Joseph’s literal bones, the emphatic oath imposed on the sons of Israel, and the repeated accompaniment. The quoted promise should retain the Hebrew idiom of divine visitation/intervention without using an unclear Swahili form.
  naturalness: “Mungu atawajilia” is possible in elevated biblical diction but is not the clearest contemporary Standard East African Swahili expression. “Mungu hakika atawatembelea” is idiomatic, faithful to the Hebrew visitation idiom, and its broader contextual sense can be supplied in the footnote. “Mtaipandisha mifupa yangu” is grammatically possible but less natural for transporting bones out of Egypt; “mtachukua mifupa yangu kutoka hapa pamoja nanyi” is clear, though it does not explicitly reproduce the upward directional nuance.
  terminology: “Mifupa,” “wana wa Israeli,” and “aliwaapisha ... kwa dhati” are suitable and preserve the source’s concrete and familial language. The divine-visitation footnote needs more natural phrasing.
  issues:
  - severity: medium
    issue: The main-text verb “atawajilia” is unclear/marked in modern standard usage.
    rationale: For פָּקֹד יִפְקֹד, “atawatembelea” directly reflects the Hebrew idiom and is natural in biblical Swahili; the note can explain that this is a decisive intervention, not merely a social visit.
  - severity: low
    issue: The footnote phrase “kuingilia hali yao kwa uamuzi” is unnatural Swahili.
    rationale: “Kuchukua hatua ya makusudi kwa ajili ya watu wake” communicates decisive divine action naturally and without over-specifying it.
  - severity: low
    issue: “Mtaipandisha mifupa yangu” is less idiomatic in this transport context.
    rationale: “Mtachukua mifupa yangu kutoka hapa pamoja nanyi” naturally conveys the commanded removal. The surrounding Exodus context supplies the movement out of Egypt; a footnote could preserve the ‘bring up’ nuance, but none is necessary for this brief verse.
  revised_text: Musa akachukua mifupa ya Yosefu pamoja naye, kwa sababu Yosefu alikuwa amewaapisha wana wa Israeli kwa dhati, akisema, “Mungu hakika atawatembelea[a], nanyi mtachukua mifupa yangu kutoka hapa pamoja nanyi.”
