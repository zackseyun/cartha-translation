  yaml_path: translation/ot/exodus/013/004.yaml
  text: Today you are going out[a], in the month of Abib.
translation:
  language: sw
  text: Leo mnatoka, katika mwezi wa Abibu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abibu ni jina la mwezi; neno hilo linahusishwa na hatua ya nafaka kukomaa wakati wa masika.
    reason: cultural_note
lexical_decisions:
- source_word: הַיּוֹם
  choice: Leo
  rationale: Nomino yenye kiambishi bainishi imetumika kielezi kuonyesha siku ya sasa ya tukio la kutoka; “Leo” ni ya kawaida na huhifadhi uharaka wa hotuba.
- source_word: אַתֶּם
  choice: mna-
  rationale: Kiambishi cha nafsi ya pili wingi katika “mnatoka” kinawakilisha wazi Israeli waliozungumziwa bila kuongeza kiwakilishi kisicho cha lazima.
- source_word: יֹצְאִים
  choice: mnatoka
  rationale: Kauli ya Qal katika umbo la participle ya wingi huonyesha tendo linaloendelea au lililo karibu kutokea; wakati wa sasa wa Kiswahili unafaa katika muktadha huu na huhifadhi mwelekeo wa kutoka.
- source_word: בְּחֹדֶשׁ
  choice: katika mwezi wa
  rationale: Muundo huu unaonyesha wakati wa kalenda kwa Kiswahili cha kawaida na chenye heshima.
- source_word: הָאָבִיב
  choice: Abibu
  rationale: Jina la mwezi limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa ufafanuzi kama “masika” au “masuke mabichi.”
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, fasaha na kinachoeleweka kwa urahisi. Mpangilio mfupi unahifadhi msisitizo wa “Leo” na rejeo la kalenda; alama ya tanbihi imewekwa baada ya jina linalofafanuliwa.
