id: EXO.13.15
reference: Exodus 13:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי הִקְשָׁ֣ה פַרְעֹה֮ לְ/שַׁלְּחֵ/נוּ֒ וַ/יַּהֲרֹ֨ג יְהֹוָ֤ה כָּל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בְּכֹ֥ר אָדָ֖ם וְ/עַד בְּכ֣וֹר בְּהֵמָ֑ה עַל כֵּן֩ אֲנִ֨י זֹבֵ֜חַ לַֽ/יהוָ֗ה כָּל פֶּ֤טֶר רֶ֨חֶם֙ הַ/זְּכָרִ֔ים וְ/כָל בְּכ֥וֹר בָּנַ֖/י אֶפְדֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/015.yaml
  text: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
translation:
  language: sw
  text: Ikawa Farao alipokataa kwa ukaidi kuturuhusu tuondoke, Yahweh aliwaua wazaliwa wote wa kwanza katika nchi ya Misri, kuanzia mzaliwa wa kwanza wa binadamu hadi mzaliwa wa kwanza wa mifugo.[a] Kwa hiyo ninamtolea Yahweh dhabihu kila mzaliwa wa kwanza wa kiume afunguaye tumbo la uzazi, lakini kila mzaliwa wa kwanza wa wana wangu ninamkomboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuanzia mzaliwa wa kwanza wa watu hadi mzaliwa wa kwanza wa wanyama.”
    reason: Njia nyingine ya kutafsiri אָדָם na בְּהֵמָה kwa Kiswahili cha kawaida huku tofauti kati ya wanadamu na wanyama ikibaki.
lexical_decisions:
- source_word: הִקְשָׁה ... לְשַׁלְּחֵנוּ
  choice: alipokataa kwa ukaidi kuturuhusu tuondoke
  rationale: Muundo huu unaonyesha upinzani wa ukaidi wa Farao katika muktadha wa kuwakataa Waisraeli waondoke; ni Kiswahili cha kawaida kuliko tafsiri ya neno kwa neno ya ‘alifanya kuwa vigumu.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano limehifadhiwa kama jina maalumu badala ya kubadilishwa kuwa cheo.
- source_word: בְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Hili ndilo neno la kawaida na sahihi kwa yule aliyezaliwa kwanza; umoja au wingi umetumika kulingana na sarufi ya sentensi.
- source_word: מִבְּכֹר אָדָם וְעַד בְּכוֹר בְּהֵמָה
  choice: kuanzia mzaliwa wa kwanza wa binadamu hadi mzaliwa wa kwanza wa mifugo
  rationale: אָדָם hapa humaanisha wanadamu kwa ujumla kwa kulinganishwa na בְּהֵמָה; ‘mifugo’ inaonyesha wanyama wa kufugwa katika mazingira haya.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Inaonyesha uhusiano wa sababu na matokeo kati ya kuuawa kwa wazaliwa wa kwanza na desturi ya kutoa dhabihu au kukomboa.
- source_word: זֹבֵחַ
  choice: ninamtolea ... dhabihu
  rationale: Kitenzi kinahusu kutoa kwa kuchinja kama dhabihu; muundo huu ni wa asili na unaweka wazi kwamba Yahweh ndiye anayetolewa dhabihu.
- source_word: פֶּטֶר רֶחֶם הַזְּכָרִים
  choice: kila mzaliwa wa kwanza wa kiume anayefungua tumbo la uzazi
  rationale: Inahifadhi nahau ya Kiebrania ya mtoto wa kwanza kutoka tumboni na pia sharti la kuwa wa kiume, kwa Kiswahili kinachoeleweka.
- source_word: בָּנַי
  choice: wana wangu
  rationale: Kiebrania kinataja wana wa kiume mahsusi, si watoto kwa ujumla.
- source_word: אֶפְדֶּה
  choice: ninamkomboa
  rationale: Katika muktadha wa sheria na ibada, פדה humaanisha kumwachilia kwa mbadala au malipo; ‘komboa’ huhifadhi maana hiyo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko linatumia Tetragramatoni kama jina la Mungu; ‘Yahweh’ hulihifadhi kama jina badala ya cheo.
- issue: Maana ya אָדָם ikilinganishwa na בְּהֵמָה
  choice: binadamu
  alternative: watu
  rationale: Neno linawahusu wanadamu wote katika utofautishaji na wanyama, bila kumaanisha wanaume pekee.
- issue: Uhusiano kati ya dhabihu ya wazaliwa wa kwanza wa kiume na ukombozi wa wana
  choice: kuhifadhi tofauti iliyo wazi katika maandishi
  alternative: kuongeza wazi kwamba dhabihu hiyo ni ya wanyama
  rationale: Muktadha unaonyesha kwamba wana wanakombolewa, lakini kishazi cha kwanza hakitaji ‘wanyama’ moja kwa moja; tafsiri haiongezi ufafanuzi huo ndani ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi na sheria za ibada lakini kinachoeleweka kwa wasomaji wa kawaida. Kiashiria [a] kimewekwa baada ya maneno yanayohusika moja kwa moja na tanbihi.
