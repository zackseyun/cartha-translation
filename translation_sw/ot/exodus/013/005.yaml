  text: וְ/הָיָ֣ה כִֽי יְבִֽיאֲ/ךָ֣ יְהוָ֡ה אֶל אֶ֣רֶץ הַֽ֠/כְּנַעֲנִי וְ/הַ/חִתִּ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֗י אֲשֶׁ֨ר נִשְׁבַּ֤ע לַ/אֲבֹתֶ֨י/ךָ֙ לָ֣/תֶת לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ וְ/עָבַדְתָּ֛ אֶת הָ/עֲבֹדָ֥ה הַ/זֹּ֖את בַּ/חֹ֥דֶשׁ הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/005.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], the Hittites, the Amorites, the Hivites, and the Jebusites, which he swore to your fathers to give you, a land flowing with milk and honey, you shall perform this service in this month.
translation:
  language: sw
  text: Yahwe atakapokuingiza katika nchi ya Wakanaani, Wahiti, Waamori, Wahivi na Wayebusi, ambayo aliwaapia mababu zako kwamba atakupa—nchi inayotiririka kwa maziwa na asali—utaitenda ibada hii[a] katika mwezi huu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tendo hili la ibada” au “maadhimisho haya.” Neno la Kiebrania linaweza kumaanisha tendo lililoagizwa la kumwabudu Mungu au la kumtumikia.
    reason: Neno עֲבֹדָה lina wigo wa maana unaojumuisha huduma, ibada, tendo la ibada au maadhimisho yaliyoamriwa.
lexical_decisions:
- source_word: וְהָיָה כִי
  choice: atakapo-
  rationale: Muundo huu unaanzisha tukio la wakati ujao; kiambishi cha wakati “atakapo-” kinatoa maana ya “wakati atakapo” kwa Kiswahili cha kawaida bila kuongeza maneno mazito.
- source_word: יְבִיאֲךָ
  choice: atakapokuingiza
  rationale: Hifili ya בוא humaanisha kumleta mtu au kumsababisha aingie. “Kukuingiza” inaonyesha wazi mwendo wa kuingia katika nchi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetoholewa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי וְהַחִתִּי וְהָאֱמֹרִי וְהַחִוִּי וְהַיְבוּסִי
  choice: katika nchi ya Wakanaani, Wahiti, Waamori, Wahivi na Wayebusi
  rationale: Majina ya makabila yametolewa kwa wingi kwa mujibu wa matumizi ya kawaida ya Kiswahili, huku “katika” ikionyesha kuingia ndani ya nchi hiyo.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: ambayo aliwaapia mababu zako kwamba atakupa
  rationale: Kauli hii inadumisha uhusiano wa kishazi na “nchi,” lugha ya kiapo, na ahadi ya kumpa msikilizaji nchi hiyo.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: nchi inayotiririka maziwa na asali
  rationale: Hii inahifadhi taswira ya Kiebrania ya nchi yenye wingi na rutuba.
- source_word: וְעָבַדְתָּ אֶת הָעֲבֹדָה הַזֹּאת
  choice: utaifanya ibada hii
  rationale: Katika muktadha huu, עבד pamoja na עֲבֹדָה humaanisha kutekeleza tendo lililoamriwa la kumwabudu Mungu. “Kuifanya ibada” ni ya asili na inaeleweka, bila kuifanya kuwa aina maalumu zaidi ya sherehe kuliko maandishi yanavyosema.
- source_word: בַּחֹדֶשׁ הַזֶּה
  choice: katika mwezi huu
  rationale: Tafsiri ya moja kwa moja ya kirai cha wakati, ikidumisha rejeo la mwezi uliowekwa kwa ibada hiyo.
theological_decisions:
- issue: Utoaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahwe” linahifadhi kazi hiyo ya jina la agano.
- issue: Maana ya kiibada ya עֲבֹדָה
  choice: ibada hii
  alternative: tendo hili la ibada; maadhimisho haya
  rationale: “Ibada” inawasilisha huduma au tendo la kumwabudu Mungu linaloamriwa hapa, lakini tanbihi inadumisha upana wa neno la Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mstari mrefu wa Kiebrania umegawanywa kwa vistari virefu ili kirai kinachoeleza nchi kisomeke wazi. Alama [a] imewekwa baada ya “ibada hii,” ambako tanbihi yake inahusika.
