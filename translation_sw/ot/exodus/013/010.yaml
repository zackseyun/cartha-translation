  text: Nawe utashika agizo hili kwa wakati wake uliowekwa, mwaka baada ya mwaka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka siku hadi siku,” nahau ambayo katika muktadha huu mara nyingi hueleweka kuwa “mwaka baada ya mwaka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Nawe utaishika
  rationale: Katika muktadha wa sheria na ibada, שׁמר humaanisha kushika au kuzingatia agizo. “Utaishika” ni Kiswahili cha kawaida chenye uzito wa wajibu na mwendelezo.
- source_word: הַחֻקָּה הַזֹּאת
  choice: sheria hii
  rationale: חֻקָּה ni agizo au kanuni iliyowekwa. “Sheria hii” ni ya kawaida, yenye heshima, na inaeleweka kwa wasomaji wengi bila ladha maalumu ya kimadhehebu.
- source_word: לְמוֹעֲדָהּ
  choice: kwa wakati wake uliowekwa
  rationale: מוֹעֵד hueleza wakati au majira yaliyowekwa. Kiambishi cha umilikaji kimehifadhiwa kwa “wake,” kikirejelea wakati uliowekwa kwa ajili ya maadhimisho hayo.
- source_word: מִיָּמִים יָמִימָה
  choice: mwaka baada ya mwaka
  rationale: Ingawa kwa kufuata maneno ni “kutoka siku hadi siku,” hapa ni nahau ya kurudiwa kila mwaka. Tafsiri ya maana ni ya asili katika Kiswahili, huku usemi halisi ukihifadhiwa katika tanbihi.
