base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/007.yaml
  text: Unleavened bread shall be eaten throughout the seven days[a], and no leaven shall be seen with you[b], and no yeast shall be seen with you within all your territory.
translation:
  language: sw
  text: Kwa siku zote saba, mikate isiyotiwa chachu italiwa. Kitu chochote kilichochachushwa[a] kisionekane kwako[b], wala chachu isionekane kwako katika mipaka yako yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitu chochote kilichotiwa chachu.” Neno la Kiebrania חָמֵץ humaanisha kitu kilichochachushwa, ilhali שְׂאֹר katika kishazi kinachofuata humaanisha hasa chachu yenyewe.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kisionekane kwako.” Katika muktadha huu, maneno hayo yanaonyesha kwamba kitu kilichochachushwa hakipaswi kubaki katika milki au eneo lako wakati wa siku hizo saba.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: Hurejelea mikate iliyoandaliwa bila chachu katika muktadha wa Pasaka; usemi huu ni wazi na unahifadhi maana ya kidini bila kutumia neno la kigeni.
- source_word: יֵאָכֵל
  choice: italiwa
  rationale: Kauli ya Niphal ina maana ya kutendwa. Wakati ujao wa Kiswahili unafaa katika agizo hili bila kuongeza nguvu ya amri isiyoelezwa moja kwa moja na umbo la Kiebrania.
- source_word: אֵת שִׁבְעַת הַיָּמִים
  choice: kwa siku zote saba
  rationale: Kishamirisho cha muda kinaonyesha kipindi kizima; neno 'zote' linaweka wazi kuwa tendo linaendelea katika muda wote wa siku saba.
- source_word: חָמֵץ
  choice: kitu chochote kilichotiwa chachu
  rationale: Neno hili linaweza kumaanisha kwa upana kitu kilichochachushwa au kutiwa chachu, tofauti na שְׂאֹר, ambayo ni chachu yenyewe. Tafsiri hii inadumisha utofauti huo.
- source_word: יֵרָאֶה לְךָ
  choice: kisionekane kwako / isionekane kwako
  rationale: Huhifadhi kauli ya kutendwa ya 'kuonekana' pamoja na kiambishi kinachomaanisha kihalisi 'kwako,' bila kuifupisha kimya kimya kuwa kumiliki pekee.
- source_word: שְׂאֹר
  choice: chachu
  rationale: Hurejelea kichachushio chenyewe, tofauti na kitu kilichotiwa chachu katika kishazi kilichotangulia; 'chachu' ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: בְּכָל גְּבֻלֶךָ
  choice: katika eneo lako lote
  rationale: Usemi huu unaonyesha eneo lote lililo ndani ya mipaka ya mhusika. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi upeo kamili wa katazo.
theological_decisions:
- issue: Uhusiano kati ya חָמֵץ na שְׂאֹר
  choice: Kutofautisha 'kitu chochote kilichotiwa chachu' na 'chachu'
  alternative: Kutafsiri maneno yote mawili kuwa 'chachu'
  rationale: Kiebrania kinaweka maneno mawili yanayohusiana lakini yasiyolingana kabisa; tafsiri iliyochaguliwa inadumisha tofauti kati ya bidhaa iliyochachushwa na kichachushio chenyewe bila kujenga fundisho la ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Muundo wa kurudiarudia wa Kiebrania umehifadhiwa, pamoja na tofauti ya kile kilichotiwa chachu na chachu yenyewe.
