  verdict: revise
  source_fidelity: Rasimu inawasilisha vizuri wazo kuu la kuwekwa wakfu kwa Yahwe na umiliki wa Yahwe juu ya wazaliwa wa kwanza wa kiume wa mifugo. Hata hivyo, “anayefungua tumbo la uzazi” ni tafsiri ya karibu sana ya nahau ambayo haisikiki kwa kawaida katika Kiswahili, na “tumbo la uzazi” ni urudufu usio wa lazima. Pia, muundo wa nukta mkato unaacha ‘madume’ kama ufafanuzi wa nyuma badala ya kuyafanya madume yarekebishe wazi ‘wazaliwa wa kwanza’ kama ilivyo katika Kiebrania.
  naturalness: “Utamweka wakfu” ni Kiswahili sanifu na cha asili zaidi kwa muktadha wa kisheria-wa-ibada kuliko “utamtenga kwa ajili ya.” “Kila mzaliwa wa kwanza wa kiume wa mifugo uliyo nayo” huweka wazi kwa mtiririko wa kawaida kwamba sharti la kiume linawahusu wazaliwa wa kwanza wa mifugo.
  terminology: “Yahwe” ni sahihi kwa יהוה kwa uamuzi wa mradi. “Kuweka wakfu” hudumisha maana ya kuhamisha/kutenga kwa ajili ya Yahwe bila kuamua kwamba tendo hilo lenyewe ni dhabihu. “Mzaliwa wa kwanza” ni istilahi ya Kiswahili iliyo wazi; maana ya nahau ya kifasihi ya ‘afunguaye tumbo’ imehifadhiwa katika tanbihi.
