  yaml_path: translation/ot/exodus/013/012.yaml
  text: you shall set apart to Yahweh every one that opens the womb[b][a], and every male firstborn of the livestock that you have belongs to Yahweh.
translation:
  language: sw
  text: utamweka wakfu kwa Yahwe kila mzaliwa wa kwanza[a], na kila mzaliwa wa kwanza wa kiume wa mifugo[b] uliyo nayo ni wa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kila afunguaye tumbo,” yaani, kila mzaliwa wa kwanza.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hurejelea uzao wa kwanza wa mnyama wa kufugwa; usemi “wa kiume” unaonyesha kwamba madume wa wazaliwa hao wa kwanza ndio walio wa Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: utamtenga kwa ajili ya
  rationale: Hifili ya עבר kwa msingi humaanisha kusababisha kitu kipite au kukihamisha; katika muktadha huu wa ibada inaonyesha kukitenga na kukiweka kwa ajili ya Yahwe. Tafsiri hii huepuka kudokeza moja kwa moja kwamba kila mzaliwa alitolewa dhabihu.
- source_word: פֶּטֶר רֶחֶם
  choice: kila anayefungua tumbo la uzazi
  rationale: Inahifadhi kwa njia inayoeleweka tamathali ya Kiebrania, ‘afunguaye tumbo la uzazi,’ badala ya kuifupisha tu kuwa ‘mzaliwa wa kwanza.’
- source_word: לַיהוָה
  choice: kwa ajili ya Yahwe / ni ya Yahwe
  rationale: Kihusishi ל huonyesha kuwekwa wakfu au kuwa mali ya Yahwe; miundo hii miwili ni ya asili katika Kiswahili kulingana na nafasi yake katika sentensi.
- source_word: פֶּטֶר שֶׁגֶר בְּהֵמָה
  choice: kila mzaliwa wa kwanza wa mifugo
  rationale: שֶׁגֶר hurejelea uzao wa mnyama, na kirai kizima hurejelea mnyama wa kwanza kuzaliwa katika mifugo. ‘Mifugo’ linafaa kwa בְּהֵמָה katika muktadha huu.
- source_word: אֲשֶׁר יִהְיֶה לְךָ
  choice: utakayokuwa nayo
  rationale: Huwasilisha kwa kawaida umiliki unaoonyeshwa na kirai cha Kiebrania, huku ikidumisha mtazamo wa wakati ujao wa agizo.
- source_word: הַזְּכָרִים
  choice: madume
  rationale: Nomino ya wingi yenye kibainishi hutaja kwa mkazo wale wa kiume miongoni mwa wazaliwa wa mifugo.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia moja kwa moja jina la agano יהוה. ‘Yahwe’ hulitambulisha kama jina binafsi bila kulibadili kuwa cheo.
- issue: Maana ya kuwekwa kwa ajili ya Yahwe
  choice: utamtenga kwa ajili ya Yahwe
  alternative: utamtolea Yahwe; utampitisha kwa Yahwe
  rationale: Huhifadhi maana ya kuwekwa wakfu au kuhamishwa kuwa mali ya Yahwe bila kuamua kimbele kwamba kila aliyehusika angechinjwa kama dhabihu; mistari inayofuata hutofautisha namna ya kutenda kwa aina mbalimbali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ‘anayefungua tumbo la uzazi’ umehifadhi taswira ya kisheria ya Kiebrania, na nusu ya pili imetenganishwa kwa nukta mkato ili kauli ‘madume ni ya Yahwe’ ibaki na mkazo na uwazi wake.
