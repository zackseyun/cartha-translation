base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/009.yaml
  text: And it shall be for you as a sign on your hand and as a memorial between your eyes[a], so that the law of Yahweh may be in your mouth[c][b]; for with a strong hand Yahweh brought you out of Egypt.
translation:
  language: sw
  text: Nayo itakuwa kwako ishara juu ya mkono wako na ukumbusho kati ya macho yako[a], ili sheria[b] ya Yahweh iwe kinywani mwako; kwa maana kwa mkono wa nguvu[c] Yahweh alikutoa Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au maneno “kati ya macho yako” yanaweza kueleweka kama “juu ya paji la uso wako”; hapa maneno ya Kiebrania yametafsiriwa kihalisi.
    reason: lexical_alternative
  - marker: b
    text: Au “mafundisho ya Yahweh.” Neno la Kiebrania torah linaweza kumaanisha “sheria” au “mafundisho,” kutegemea muktadha.
    reason: lexical_alternative
  - marker: c
    text: Au “kwa mkono mkuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Nayo itakuwa
  rationale: Muundo huu una maana ya wakati ujao katika muktadha wa maagizo; “itakuwa” ni wa kawaida na huhifadhi nguvu ya usemi wa Kiebrania.
- source_word: לְאוֹת
  choice: ishara
  rationale: אוֹת humaanisha ishara, alama, au dalili; “ishara” huhifadhi upana wa maana bila kulazimisha iwe kitu halisi kinachovaliwa.
- source_word: עַל יָדְךָ
  choice: juu ya mkono wako
  rationale: Huhifadhi picha halisi ya Kiebrania bila kuibadili kuwa “juu ya mkono wa mbele” au kuihusisha waziwazi na desturi ya baadaye.
- source_word: וּלְזִכָּרוֹן
  choice: na kumbukumbu
  rationale: זִכָּרוֹן ni kitu cha kukumbusha au ukumbusho; “kumbukumbu” ni nomino yenye uzito wa ukumbusho wa tendo la ukombozi.
- source_word: בֵּין עֵינֶיךָ
  choice: kati ya macho yako
  rationale: Hii ndiyo tafsiri ya karibu ya maneno ya Kiebrania na huhifadhi uwezekano wa maana halisi au ya kiistiari.
- source_word: לְמַעַן
  choice: ili
  rationale: Huonyesha kusudi kwa Kiswahili cha kawaida na kifupi.
- source_word: תּוֹרַת יְהוָה
  choice: sheria ya Yahweh
  rationale: תּוֹרָה inaweza kumaanisha sheria au mafundisho. Katika muktadha huu wa agano, “sheria” inafaa, huku maana nyingine ikitajwa katika tanbihi.
- source_word: בְּפִיךָ
  choice: kinywani mwako
  rationale: Huhifadhi sitiari halisi inayodokeza kutamka, kukariri, au kuwa tayari kuisema.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu au msingi wa kusudi lililotangulia.
- source_word: בְּיָד חֲזָקָה
  choice: kwa mkono wenye nguvu
  rationale: Ni tafsiri ya karibu na חֲזָקָה na huhifadhi picha ya mkono kama ishara ya nguvu ya ukombozi.
- source_word: הוֹצִאֲךָ
  choice: alikutoa
  rationale: Hifili ya יצא humaanisha kusababisha kutoka au kutoa; “alikutoa” ni ya asili na sahihi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Iwapo lugha ya mkono na macho itafsiriwe moja kwa moja au ielezwe kwa desturi ya baadaye ya tefillin
  choice: 'Kuhifadhi picha halisi: “ishara juu ya mkono wako” na “kumbukumbu kati ya macho yako.”'
  alternative: Kutafsiri “juu ya paji la uso wako” au kutaja wazi vifungo vya tefillin.
  rationale: Andiko lenyewe halitaji kifaa cha ibada cha baadaye wala halisemi kuwa lugha hii ni ya kiistiari tu; tafsiri halisi huhifadhi uwazi huo wa kitafsiri.
- issue: Maana ya תּוֹרָה katika kifungu hiki
  choice: sheria
  alternative: mafundisho
  rationale: Maana zote mbili zinawezekana. “Sheria” ina uzito unaofaa katika muktadha wa agano, lakini “mafundisho” imehifadhiwa kama uwezekano wa kileksia katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira halisi ya Kiebrania imehifadhiwa, na viunganishi vimewekwa kwa mtiririko wa asili wa Kiswahili.
