  text: They set out from Succoth and camped at Etham, on the edge of the wilderness.
translation:
  language: sw
  text: Wakaondoka Sukothi, wakapiga kambi Ethamu, ukingoni mwa nyika.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Kitenzi נסע katika mfululizo wa masimulizi kinaonyesha kuvunja kambi na kuanza safari; “wakaondoka” ni Kiswahili cha kawaida na huwasilisha tendo hilo kwa uwazi.
- source_word: מִסֻּכֹּת
  choice: Sukothi
  rationale: Jina la mahali סֻכֹּת limetoholewa kwa mwandiko unaosomeka kwa Kiswahili; kiambishi מִן kimewasilishwa ndani ya maana ya “wakaondoka Sukothi.”
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה humaanisha kuweka au kupiga kambi; usemi “kupiga kambi” ni wa asili na unaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: בְאֵתָם
  choice: Ethamu
  rationale: Jina la mahali אֵתָם limetoholewa kama “Ethamu”; kiambishi בְ kinaeleweka kutokana na muundo “wakapiga kambi Ethamu.”
- source_word: בִּקְצֵה
  choice: ukingoni mwa
  rationale: קָצֶה huonyesha mwisho, mpaka, au ukingo. “Ukingoni mwa” linafaa kwa muktadha huu wa kijiografia bila kuamua kwamba ni mpaka rasmi.
- source_word: הַמִּדְבָּר
  choice: nyika
  rationale: מִדְבָּר ni eneo lisilokaliwa au lenye ukame, si lazima jangwa la mchanga. “Nyika” huhifadhi upana huo wa maana kwa Kiswahili.
