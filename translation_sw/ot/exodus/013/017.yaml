base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/017.yaml
  text: When Pharaoh let the people go[a], God did not lead them by the way of the land of the Philistines, though it was near; for God said[b], “Lest the people change their minds when they see war and return to Egypt.”
translation:
  language: sw
  text: Farao alipowaruhusu watu waondoke, Mungu hakuwaongoza kwa njia ya nchi ya Wafilisti, ingawa ilikuwa karibu[a], kwa maana Mungu alisema, “Watu wasije wakabadilisha nia yao watakapoona vita, wakarudi Misri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ilikuwa karibu.” Kiunganishi cha Kiebrania kinaweza kueleweka kwa maana ya sababu; maandishi makuu yanakitafsiri kwa maana ya “ingawa” kwa kuzingatia mtiririko wa muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלַּח
  choice: Farao alipowaacha watu waondoke
  rationale: Muundo wa ב pamoja na kitenzi-jina unaonyesha wakati. Kauli hii ya Kiswahili inaeleza kwa kawaida kwamba Farao aliwaruhusu watu waondoke, huku ikihifadhi mwangwi wa dai la mara kwa mara la Kutoka.
- source_word: נָחָם
  choice: hakuwaongoza
  rationale: Kitenzi נחה humaanisha kuongoza au kuelekeza; “kuwaongoza” ni cha kawaida na kinafaa katika muktadha wa njia ya safari.
- source_word: דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  choice: kwa njia inayopita katika nchi ya Wafilisti
  rationale: Hii inawasilisha דֶּרֶךְ kama njia na muundo wa kijiografia kama njia iliyopita katika nchi ya watu walioitwa Wafilisti, bila kutumia jina la baadaye la eneo pekee.
- source_word: כִּי קָרוֹב הוּא
  choice: ingawa ilikuwa karibu
  rationale: כִּי inaweza kuwa ya kisababishi au ya kukubali jambo linalotofautiana na lililotarajiwa. Maandishi makuu yanatumia maana ya kukubali kwa mtiririko wa kawaida, na uwezekano wa kisababishi umehifadhiwa katika tanbihi.
- source_word: פֶּן
  choice: Watu wasije
  rationale: Muundo wa “wasije” unaonyesha hofu au kusudi hasi linalobebwa na פֶּן, kwa Kiswahili cha sasa na cha kawaida.
- source_word: יִנָּחֵם
  choice: wakabadili nia zao
  rationale: Nifali ya נחם hapa inaonyesha kubadili nia au azimio mbele ya vita, wala si lazima toba ya kimaadili.
- source_word: בִּרְאֹתָם מִלְחָמָה
  choice: watakapoona vita
  rationale: ב pamoja na kitenzi-jina inaonyesha hali ya wakati, na מִלְחָמָה ni vita au mapigano; “vita” huhifadhi maana pana.
- source_word: וְשָׁבוּ מִצְרָיְמָה
  choice: na kurudi Misri
  rationale: שׁוב ni kurudi, na kiishio kinachoonyesha mwelekeo katika מִצְרָיְמָה kinawasilishwa kwa uelekeo wa kurudi Misri.
- source_word: וַיְהִי
  choice: Farao alipowaacha
  rationale: וַיְהִי huendeleza simulizi na kuingiza hali ya wakati. Kiswahili hakihitaji neno tofauti kama “basi” hapa; mwanzo wa kishazi cha wakati unatoa mwendelezo wa kawaida bila kuongeza alama ya mazungumzo isiyo ya lazima.
theological_decisions:
- issue: Sababu ya Mungu kuepuka njia ya nchi ya Wafilisti
  choice: Aya inasema Mungu alichagua njia hiyo kwa kuzingatia uwezekano wa watu kuogopa vita, kubadili nia, na kurudi Misri.
  alternative: Kuchukulia sababu hiyo kuwa dhana ya msimulizi tu, au kudokeza kwamba Mungu alibadili mpango wake baada ya kushangazwa.
  rationale: Kishazi “Mungu alisema” kinaitoa sababu moja kwa moja ndani ya simulizi. Tafsiri inaihifadhi bila kuongeza madai ya kimafundisho kuhusu ujuzi au majaliwa ya Mungu yasiyosemwa wazi katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa “wasije” umechaguliwa badala ya kauli nzito zaidi ya kifasihi; “njia inayopita katika nchi” inaweka wazi uhusiano wa kijiografia bila kupoteza maana ya chanzo.
