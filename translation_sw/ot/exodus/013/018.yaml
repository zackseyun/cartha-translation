base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/018.yaml
  text: So God led the people around by the way of the wilderness to the Sea of Reeds[b][a], and the sons of Israel went up from the land of Egypt armed.
translation:
  language: sw
  text: Mungu akawazungusha watu kwa njia ya jangwani kuelekea Bahari ya Matete[a]. Wana wa Israeli walipanda kutoka nchi ya Misri wakiwa wamejiandaa kwa vita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bahari ya Shamu.” Kwa maana halisi, jina la Kiebrania ni “Bahari ya Matete.”
    reason: alternative_reading
  - marker: b
    text: Maana ya neno la Kiebrania haijulikani kwa hakika; linaweza pia kumaanisha “wakiwa na silaha,” “wakiwa katika mpangilio wa vita,” au, kwa ujumla, “wakiwa katika safu zilizopangwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: akawapitisha ... kwa njia ya kuzunguka
  rationale: Hifili ya סבב inaonyesha kwamba Mungu aliwapeleka watu kwa njia isiyo ya moja kwa moja; usemi huu unahifadhi utendaji wa Mungu na wazo la kuzunguka.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: kupitia jangwani
  rationale: דֶּרֶךְ hapa hutaja njia waliyoifuata. Kiswahili hiki ni cha kawaida na kinaonyesha kwamba njia yao ilipitia eneo la jangwani.
- source_word: יַם סוּף
  choice: Bahari ya Matete
  rationale: סוּף humaanisha matete au mimea kama matete. Tafsiri hii inatanguliza maana ya Kiebrania huku jina la kimapokeo likihifadhiwa katika tanbihi.
- source_word: וַחֲמֻשִׁים
  choice: wakiwa wamejiandaa kwa vita
  rationale: Neno hili halina maana iliyo hakika kabisa, lakini huenda linaonyesha kuwa walikuwa na silaha au walikuwa katika mpangilio wenye utayari wa vita. Tafsiri hii haitilii mkazo silaha pekee.
- source_word: עָלוּ
  choice: walipanda
  rationale: Inahifadhi maana ya msingi ya עלה, ‘kupanda,’ katika simulizi la kutoka Misri.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Inawakilisha kwa uwazi muundo wa Kiebrania wa kiume katika usemi wa pamoja, kwa lugha ya Kiswahili yenye hadhi ya kibiblia.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: kutoka nchi ya Misri
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi cha Kiebrania.
theological_decisions:
- issue: Jina יַם סוּף
  choice: Bahari ya Matete
  alternative: Bahari ya Shamu
  rationale: Maana ya kileksika ya Kiebrania imepewa nafasi katika matini, huku jina lililozoeleka katika mapokeo ya tafsiri likitajwa bila kulazimisha utambulisho wa kijiografia.
- issue: Maana ya וַחֲמֻשִׁים
  choice: wakiwa wamejiandaa kwa vita
  alternative: wakiwa na silaha; wakiwa katika safu zilizopangwa
  rationale: Neno la Kiebrania lina utata wa kweli. Matini inatoa maana inayowezekana ya utayari wa kivita, na tanbihi inahifadhi tafsiri nyingine zinazowezekana.
- issue: Muundo בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Tafsiri hii inadumisha muundo wa kiume wa chanzo bila kukana kwamba usemi huo unawahusu watu wa Israeli kwa pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili kwa usomaji wa kawaida. ‘Wana wa Israeli’ na ‘walipanda’ zinatunza uwazi wa muundo wa chanzo, huku tanbihi zikihifadhi utata wa kileksika.
