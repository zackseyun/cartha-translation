base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/021.yaml
  text: And Yahweh was going before them by day in a pillar of cloud to lead them on the way[a], and by night in a pillar of fire to give them light, so that they could travel by day and by night.
translation:
  language: sw
  text: Yahweh alikuwa akienda mbele yao wakati wa mchana katika nguzo ya wingu ili kuwaongoza njiani, na wakati wa usiku katika nguzo ya moto ili kuwapa nuru, wapate kusafiri mchana na usiku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa namna ya kulitamka kama jina binafsi, badala ya kulibadili kuwa cheo; tahajia “Yahwe” ni ya kawaida na ya asili katika Kiswahili.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: alikuwa akitangulia mbele yao
  rationale: Muundo wa kitenzi kishirikishi unaonyesha tendo lililoendelea; “alikuwa akitangulia” huhifadhi hali hiyo na maana ya kuwepo mbele yao akiwaongoza.
- source_word: יוֹמָם
  choice: wakati wa mchana
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kipindi cha mchana na unaendana na ulinganifu wa “wakati wa usiku”.
- source_word: בְּעַמּוּד עָנָן
  choice: katika nguzo ya wingu
  rationale: “Katika” huhifadhi uwezekano kwamba Yahwe alijidhihirisha ndani ya umbo hilo linaloonekana; “nguzo ya wingu” huhifadhi picha halisi ya Kiebrania.
- source_word: לַנְחֹתָם הַדֶּרֶךְ
  choice: ili kuwaongoza njiani
  rationale: Kitenzi נחה kina maana ya kuongoza au kuelekeza, na “njiani” ni Kiswahili cha asili kwa muktadha wa safari.
- source_word: בְּעַמּוּד אֵשׁ
  choice: katika nguzo ya moto
  rationale: Huhifadhi muundo sambamba na “katika nguzo ya wingu” pamoja na taswira halisi ya maandishi.
- source_word: לְהָאִיר לָהֶם
  choice: ili kuwaangazia
  rationale: Hifili ya אור hapa inaonyesha kusababisha nuru; “kuwaangazia” ni wazi na hufikisha kusudi la nguzo ya moto.
- source_word: לָלֶכֶת יוֹמָם וָלָיְלָה
  choice: waweze kusafiri mchana na usiku
  rationale: Infinitivu inaonyesha kusudi au matokeo. “Kusafiri” inafaa kwa mwendo wa taifa katika safari, huku “mchana na usiku” ikihifadhi msisitizo wa Kiebrania.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano, si cheo. “Yahwe” hulihifadhi kama jina bila kuingiza tafsiri ya kimadhehebu; “BWANA” ni desturi iliyoenea lakini huficha tofauti kati ya jina hilo na neno la kawaida la ‘Bwana’.
- issue: Uhusiano wa Yahwe na nguzo
  choice: katika nguzo
  alternative: kwa nguzo
  rationale: Kihusishi בְּ kinaweza kueleweka kwa zaidi ya namna moja. “Katika” kinaakisi kwa karibu taswira ya Yahwe akienda mbele yao katika nguzo, bila kufafanua kimafundisho asili halisi ya udhihirisho huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo sambamba wa mchana/usiku na nguzo ya wingu/nguzo ya moto umehifadhiwa. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi iliyohitajika katika rasimu hii.
