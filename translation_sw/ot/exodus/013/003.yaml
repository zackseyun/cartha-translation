  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָ/עָ֗ם זָכ֞וֹר אֶת הַ/יּ֤וֹם הַ/זֶּה֙ אֲשֶׁ֨ר יְצָאתֶ֤ם מִ/מִּצְרַ֨יִם֙ מִ/בֵּ֣ית עֲבָדִ֔ים כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִ֧יא יְהֹוָ֛ה אֶתְ/כֶ֖ם מִ/זֶּ֑ה וְ/לֹ֥א יֵאָכֵ֖ל חָמֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/003.yaml
  text: Then Moses said to the people[a], “Remember this day in which you came out from Egypt, from the house of slavery, because Yahweh brought you out from there by a strong hand[c][b]; and no leavened bread shall be eaten.”
translation:
  language: sw
  text: Kisha Musa akawaambia watu, “Ikumbukeni siku hii ambayo mlitoka Misri, kutoka nyumba ya watumwa[a], kwa sababu Yahweh aliwatoa humo kwa mkono wenye nguvu[b]; na chochote chenye chachu kisiliwe[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya nahau, “kutoka mahali pa utumwa.” Kiebrania ni, kihalisi, “kutoka nyumba ya watumwa.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa mkono wenye uwezo mkuu.”
    reason: lexical_alternative
  - marker: c
    text: Au “mkate wenye chachu usiliwe.” Neno la Kiebrania linaweza kumaanisha kwa upana kitu kilichotiwa chachu.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: Ikumbukeni
  rationale: Ni amri ya umoja katika Kiebrania inayowaelekea watu kama kundi moja; Kiswahili cha kawaida hutumia wingi linapozungumza na kundi.
- source_word: מִבֵּית עֲבָדִים
  choice: kutoka nyumba ya watumwa
  rationale: Inahifadhi picha halisi ya Kiebrania, ‘nyumba ya watumwa,’ huku ikieleweka kuwa Misri ilikuwa mahali pa utumwa.
- source_word: בְּחֹזֶק יָד
  choice: kwa mkono wenye nguvu
  rationale: Inahifadhi sitiari ya mkono na kueleza tendo la Yahweh lenye uwezo; ‘mkono wenye uwezo mkuu’ pia linawezekana.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ni unukuzi wa jina la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadili kuwa cheo.
- source_word: הוֹצִיא ... אֶתְכֶם
  choice: aliwatoa
  rationale: Kauli sababishi ya יצא humaanisha kuwatoa au kuwaleta nje; ‘aliwatoa’ ni ya kawaida na sahihi katika Kiswahili.
- source_word: מִזֶּה
  choice: humo
  rationale: Kielezi hiki kinarejelea mahali palipotajwa, yaani Misri au nyumba ya watumwa; ‘humo’ ni fupi na ya kawaida.
- source_word: וְלֹא יֵאָכֵל חָמֵץ
  choice: na chochote chenye chachu kisiliwe
  rationale: Inahifadhi katazo katika hali ya kutendwa na upana wa חָמֵץ, ambalo linaweza kumaanisha kitu au chakula kilichotiwa chachu, si mkate pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu. Kulihifadhi kama jina huepuka kulibadili kimya kimya kuwa cheo.
- issue: Maana ya עֲבָדִים katika kauli ya kutoka Misri
  choice: watumwa
  alternative: watumishi; utumwa
  rationale: Muktadha unahusu hali halisi ya Waisraeli kufanywa watumwa; ‘watumwa’ haisitiri hali hiyo, ingawa kishazi chote ni nahau ya mahali pa utumwa.
- issue: Upana wa חָמֵץ
  choice: chochote chenye chachu
  alternative: mkate wenye chachu
  rationale: Nomino ya Kiebrania inaweza kurejelea kwa upana kitu kilichochachushwa. Tafsiri kuu haiibani kuwa mkate pekee, huku uwezekano huo ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Wingi katika “Ikumbukeni” unafuata matumizi ya kawaida ya Kiswahili kwa kundi, ingawa amri ya Kiebrania ni ya umoja kwa sababu watu wanachukuliwa kama jumuiya moja. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
