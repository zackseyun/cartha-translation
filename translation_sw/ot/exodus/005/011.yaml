  text: You yourselves[a], go and get straw for yourselves wherever you can find it[b], for nothing of your work will be reduced.
translation:
  language: sw
  text: Ninyi wenyewe, nendeni mkajitafutie majani makavu popote mtakapoyapata[a], kwa maana kazi yenu haitapunguzwa hata kidogo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kiebrania: “kutoka mahali popote mtakapoyapata.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kihalisi zaidi: “kwa maana hakuna chochote kinachopunguzwa katika kazi yenu.” Kiunganishi kinaweza pia kutafsiriwa “kwa sababu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתֶּם
  choice: Ninyi wenyewe
  rationale: Kiwakilishi huru cha wingi kimetangulizwa ili kusisitiza kwamba wao wenyewe ndio wanaopaswa kutekeleza amri.
- source_word: לְכוּ
  choice: nendeni
  rationale: Ni amri ya wingi ya kitenzi ‘kwenda’; ‘nendeni’ ni ya kawaida na yenye heshima katika Kiswahili sanifu.
- source_word: קְחוּ לָכֶם
  choice: mkajitafutie
  rationale: Katika muktadha huu, kitenzi cha ‘kuchukua’ pamoja na לָכֶם kinaeleza kujipatia kitu kwa juhudi zao wenyewe. ‘Mkajitafutie’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kudai kwamba majani tayari yako mahali fulani pa kuchukuliwa.
- source_word: תֶּבֶן
  choice: majani makavu
  rationale: Katika muktadha wa kutengeneza matofali, neno hili linamaanisha straw iliyotumiwa katika matofali; ‘majani makavu’ ni wazi kwa wasomaji wa Kiswahili cha Afrika Mashariki.
- source_word: מֵאֲשֶׁר תִּמְצָאוּ
  choice: popote mtakapoyapata
  rationale: Huhifadhi wazo la kuyapata kutoka mahali popote panapowezekana, huku Kiswahili kikieleza rejeo la majani kwa upatanisho wa kisarufi.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa kiunganishi kinaweza kueleweka kwa msingi kama cha sababu au ufafanuzi. ‘Kwa maana’ huhifadhi uhusiano huo, ingawa katika muktadha kauli nzima pia ina mguso wa utofautishaji.
- source_word: אֵין נִגְרָע
  choice: haitapunguzwa
  rationale: Muundo hasi wa kitenzi katika hali ya kutendwa unaonyesha kwamba hakuna upunguzaji utakaofanywa. Wakati ujao unafaa katika muktadha wa agizo.
- source_word: מֵעֲבֹדַתְכֶם דָּבָר
  choice: kazi yenu ... hata kidogo
  rationale: עֲבֹדָה hapa ni kazi iliyowekwa juu yao, na דָּבָר katika muundo hasi husisitiza kwamba hakuna sehemu yoyote itakayopunguzwa. ‘Hata kidogo’ hutoa mkazo huo kwa kawaida.
