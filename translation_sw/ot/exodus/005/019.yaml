  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wasimamizi” linaepuka istilahi ya kiufundi isiyo ya lazima, na “Waisraeli” ni la kawaida zaidi kuliko “wana wa Israeli.” Hakuna tanbihi iliyohitajika kwa sababu nahau ya mwisho imewasilishwa wazi katika matini.
