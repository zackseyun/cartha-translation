  text: Then the officers of the sons of Israel saw that they were in trouble when it was said[a], “You must not reduce the number of your bricks[b], the daily quota each day.”
translation:
  language: sw
  text: Ndipo wasimamizi wa Waisraeli wakaona kwamba walikuwa taabani walipoambiwa, “Msipunguze idadi ya matofali yenu, yaani kiwango kinachotakiwa kila siku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: wakaona
  rationale: Huhifadhi maana ya msingi ya ראה, huku muktadha ukidokeza pia kutambua hali yao.
- source_word: שֹׁטְרֵי
  choice: wasimamizi
  rationale: Hawa ni Waisraeli waliokuwa na wajibu wa usimamizi chini ya mamlaka ya Misri; neno hili ni pana na la kawaida kuliko tafsiri finyu zaidi kama “wak foremani”.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ni Kiswahili cha kawaida na sahihi kwa kundi linaloitwa kihalisi “wana wa Israeli”; hapa muundo wa Kiswahili hauhitaji tafsiri ya neno kwa neno.
- source_word: אֹתָם בְּרָע
  choice: kwamba walikuwa taabani
  rationale: Kirai kinaeleza hali mbaya au yenye madhara, si uovu wa kimaadili. “Taabani” ni cha asili na kinafaa katika muktadha.
- source_word: לֵאמֹר
  choice: walipoambiwa
  rationale: Hutambulisha yaliyosemwa na pia huonyesha kwamba amri hiyo ndiyo iliyowadhihirishia hali yao ngumu.
- source_word: לֹא תִגְרְעוּ
  choice: Msipunguze
  rationale: Huwasilisha kwa uwazi katazo la kupunguza kiasi kilichotakiwa.
- source_word: מִלִּבְנֵיכֶם
  choice: idadi ya matofali yenu
  rationale: Hutoa maana ya matofali yanayodaiwa kwao bila kuongeza wazo lisilokuwapo katika nomino yenyewe.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: timizeni kiwango cha kila siku siku kwa siku
  rationale: Kirai cha Kiebrania humaanisha kiasi kilichowekwa kwa kila siku. Tafsiri hii huhifadhi msisitizo wa kila siku na kufanya amri ieleweke kwa Kiswahili cha kawaida.
