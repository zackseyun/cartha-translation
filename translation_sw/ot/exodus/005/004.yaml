  text: But the king of Egypt said to them[a], “Why, Moses and Aaron[b], are you causing the people to neglect their work? Go to your burdens.”
translation:
  language: sw
  text: Lakini mfalme wa Misri akawaambia, “Kwa nini, Musa na Haruni, mnawafanya watu waache kazi zao[a]? Nendeni kwenye mizigo yenu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnawakengeusha watu kutoka katika kazi zao?”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwenye kazi zenu za kulazimishwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Lakini ... akawaambia
  rationale: Muundo wa masimulizi unaendeleza tukio, huku “Lakini” ukionyesha jibu la kupinga ombi lililotangulia; “akawaambia” huwasilisha kwa kawaida maana ya kusema kwao.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: mfalme wa Misri
  rationale: Huu ni uwasilishaji wa kawaida na wazi wa muundo wa Kiebrania.
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Inahifadhi swali la moja kwa moja kwa Kiswahili cha kawaida.
- source_word: תַּפְרִיעוּ אֶת הָעָם מִמַּעֲשָׂיו
  choice: mnawazuia watu kufanya kazi zao
  rationale: Kitenzi katika kausativi hapa kinaonyesha kuwafanya watu wakome au wakatizwe katika kazi; kauli hii ni ya kawaida kwa Kiswahili na inahifadhi shutuma ya mfalme. Wingi wa “zao” unafuata matumizi ya kawaida kwa nomino ya mkusanyiko “watu.”
- source_word: לְכוּ
  choice: Nendeni
  rationale: Inahifadhi amri ya moja kwa moja kwa wingi.
- source_word: לְסִבְלֹתֵיכֶם
  choice: kwenye mizigo yenu
  rationale: “Mizigo” inadumisha taswira halisi ya kubeba mizigo pamoja na wazo la wajibu mzito wa kazi, bila kufafanua zaidi ya Kiebrania.
