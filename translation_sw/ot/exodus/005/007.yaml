translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Majani makavu’ limetumiwa kwa תבן ili kuepuka utata wa ‘nyasi’ na kueleza kwa kawaida mabaki makavu yaliyotumiwa kutengeneza matofali. Amri imewasilishwa kwa wingi kulingana na waangalizi wanaoambiwa wasitishe utoaji huo.
