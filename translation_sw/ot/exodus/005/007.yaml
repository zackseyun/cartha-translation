  text: You shall no longer give straw to the people for making bricks as before[a]; let them go and gather straw for themselves.
translation:
  language: sw
  text: “Msiendelee kuwapa watu majani makavu ya kutengenezea matofali kama hapo awali[a]. Waende wakajikusanyie majani makavu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kama jana na juzi,” nahau inayomaanisha “kama hapo awali” au “zamani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאסִפוּן
  choice: Msiendelee
  rationale: Kitenzi יסף katika kausativi pamoja na kikanushi kinaonyesha kukomesha desturi iliyokuwa ikiendelea; ‘msiendelee’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: לָתֵת
  choice: kuwapa
  rationale: נתן kwa kawaida ni ‘kutoa/kupa’; hapa kiambishi cha yambwa kinawataja watu wanaopewa.
- source_word: תֶּבֶן
  choice: majani makavu
  rationale: תבן ni mabaki makavu ya mimea yaliyotumiwa katika utengenezaji wa matofali; ‘majani makavu’ ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
- source_word: לָעָם
  choice: watu
  rationale: עם humaanisha ‘watu’; tafsiri hii haibadili neno kuwa ‘wafanyakazi’ ingawa muktadha unawahusu wafanyakazi Waisraeli.
- source_word: לִלְבֹּן הַלְּבֵנִים
  choice: ya kutengenezea matofali
  rationale: Muundo wa kitenzi-jina pamoja na yambwa unaonyesha kusudi; usemi huu ni wa asili katika Kiswahili.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: kama hapo awali
  rationale: Hii ni nahau ya wakati inayomaanisha kama ilivyokuwa zamani; maana halisi imehifadhiwa katika tanbihi.
- source_word: הֵם יֵלְכוּ
  choice: Waende
  rationale: Kiwakilishi huru pamoja na kitenzi kisichotimilika kina nguvu ya amri katika muktadha huu; ‘waende’ huiwasilisha moja kwa moja.
- source_word: וְקֹשְׁשׁוּ
  choice: wakajikusanyie
  rationale: קשש humaanisha kukusanya vitu vilivyotawanyika; muundo wa ‘waka-’ unaunganisha kwenda na tendo linalofuata, huku ‘ji-’ ikisisitiza kwamba wafanye wenyewe.
- source_word: לָהֶם
  choice: wenyewe
  rationale: Kiwakilishi hiki kinaonyesha kuwa wanapaswa kukusanya kwa ajili yao wenyewe badala ya kupewa na wengine.
