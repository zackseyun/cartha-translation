  text: וַ/יֹּ֣אמְר֔וּ אֱלֹהֵ֥י הָ/עִבְרִ֖ים נִקְרָ֣א עָלֵ֑י/נוּ נֵ֣לֲכָה נָּ֡א דֶּרֶךְ֩ שְׁלֹ֨שֶׁת יָמִ֜ים בַּ/מִּדְבָּ֗ר וְ/נִזְבְּחָה֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ פֶּ֨ן יִפְגָּעֵ֔/נוּ בַּ/דֶּ֖בֶר א֥וֹ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/003.yaml
  text: And they said[a], “The God of the Hebrews has met with us. Please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God, lest he strike us with plague or with the sword.”
translation:
  language: sw
  text: Nao wakasema[a], “Mungu wa Waebrania amekutana nasi. Tafadhali, turuhusu tuende safari ya siku tatu kwenda nyikani, ili tumtolee Yahweh Mungu wetu dhabihu, asije akatupiga kwa tauni au kwa upanga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ametuita.” Kiebrania kinaweza kumaanisha kwamba Mungu amekutana nasi au ametuita.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Mungu wa Waebrania
  rationale: Inahifadhi kishazi cha Kiebrania na jina la kijamii/kikabila ‘Waebrania’ badala ya kulainisha kuwa ‘Waisraeli.’
- source_word: נִקְרָא עָלֵינוּ
  choice: amekutana nasi
  rationale: Nifali ya קרא pamoja na עַל inaweza kumaanisha kukutana na mtu au kumjia; ‘amekutana nasi’ ni Kiswahili cha kawaida kinachofaa muktadha wa kukutana na Mungu.
- source_word: נֵלֲכָה נָּא
  choice: Tafadhali turuhusu twende
  rationale: Huwasilisha ombi lenye azma la kohortativi pamoja na nguvu ya kusihi ya נָא katika Kiswahili cha kawaida.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: mwendo wa siku tatu
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha muda au umbali wa safari bila kudai kwamba watakaa huko siku tatu.
- source_word: בַּמִּדְבָּר
  choice: kuingia nyikani
  rationale: ‘Nyikani’ hufaa eneo lisilokaliwa au la malisho kuliko ‘jangwani,’ ambalo linaweza kudokeza hasa jangwa la mchanga.
- source_word: וְנִזְבְּחָה
  choice: ili tumtolee ... dhabihu
  rationale: Kohortativi inayofuata ombi inaonyesha kusudi; ‘ili’ hufanya uhusiano huo kuwa wazi na wa kawaida katika Kiswahili.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Linahifadhi jina la agano lililoandikwa kwa Tetragramatoni badala ya kulibadilisha kuwa cheo.
- source_word: פֶּן יִפְגָּעֵנוּ
  choice: la sivyo, anaweza kutupiga
  rationale: ‘La sivyo’ huwasilisha onyo la פֶּן kwa Kiswahili cha sasa, huku ‘kutupiga’ ikionyesha hatua ya adhabu ya Mungu bila kulazimisha maana isiyo na uhakika.
- source_word: בַּדֶּבֶר א֥וֹ בֶחָרֶב
  choice: kwa tauni au kwa upanga
  rationale: ‘Tauni’ ni neno linaloeleweka kwa ugonjwa mkuu wa kuambukiza, na ‘kwa’ huhifadhi matumizi ya ala katika vipashio vyote viwili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Andiko linatumia jina lenye herufi nne moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi la agano bila kuingiza badala ya kicheo.
- issue: Mhusika wa kitendo katika יִפְגָּעֵנוּ
  choice: anaweza kutupiga
  alternative: asije akatupiga
  rationale: Kiebrania hakirudii nomino ya mhusika, lakini muktadha unaelekeza kwa Yahweh. ‘Anaweza’ huhifadhi hali ya onyo na huepuka kufanya tukio hilo lionekane la lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nyikani,’ ‘dhabihu,’ na ‘tauni’ ni maneno ya kibiblia yanayoeleweka; muundo wa sentensi umewekwa wa kawaida kwa wasomaji wa leo.
