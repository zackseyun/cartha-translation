  yaml_path: translation/ot/exodus/005/017.yaml
  text: But he said[a], “You are idle, idle! That is why you say, ‘Let us go and sacrifice to Yahweh.’”
translation:
  language: sw
  text: Lakini akasema, “Ninyi ni wavivu, wavivu! Ndiyo maana mnasema, ‘Twende tukamtolee Yahweh dhabihu.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini akasema
  rationale: Kiunganishi cha simulizi kinaendeleza jibu la Farao, huku muktadha ukipa kauli hii nguvu ya kupinga malalamiko yaliyotangulia; ‘Lakini’ ni ya asili katika Kiswahili.
- source_word: נִרְפִּים אַתֶּם נִרְפִּים
  choice: Ninyi ni wavivu, wavivu!
  rationale: ‘Wavivu’ linaonyesha shtaka la kutofanya kazi kwa bidii. Urudiaji wa Kiebrania umehifadhiwa ili kuonyesha msisitizo na ukali wa kauli ya Farao.
- source_word: עַל כֵּן
  choice: Ndiyo maana
  rationale: Kirai hiki kinaonyesha hitimisho la kisababishi ambalo Farao anadai kulitoa kutokana na shtaka lake; ‘Ndiyo maana’ ni Kiswahili cha kawaida na wazi.
- source_word: אֹמְרִים
  choice: mnasema
  rationale: Kivumishi-tendo cha Kiebrania kinatumika kama kitenzi cha wakati wa sasa kwa nafsi ya pili wingi.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: Twende tukamtolee ... dhabihu
  rationale: Vitenzi viwili vya cohortative vinaonyesha pendekezo la pamoja. ‘Twende tukamtolee’ huhifadhi msukumo huo na uhusiano wa kwenda kwa kusudi la kutoa dhabihu.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetafsiriwa kwa ‘Yahweh’; kiambishi cha yambwa katika ‘tukamtolee’ kinaonyesha kwamba dhabihu inatolewa kwake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini inatumia moja kwa moja Tetragramatoni, jina la agano. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza upendeleo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji ‘wavivu, wavivu’ umeachwa kwa makusudi ili kuhifadhi msisitizo wa Kiebrania; hakuna tanbihi inayohitajika kwa kuwa maana hiyo inaonekana wazi katika matini.
