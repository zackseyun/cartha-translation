  text: And the Israelite foremen[a], whom Pharaoh’s taskmasters had set over them, were beaten, saying, “Why have you not finished your quota of brickmaking as before, both yesterday and today?”
translation:
  language: sw
  text: Nao wasimamizi wa Waisraeli, ambao wasimamizi wa kazi wa Farao walikuwa wamewaweka wawasimamie Waisraeli, walipigwa, huku wasimamizi wa kazi wa Farao wakisema, “Kwa nini hamjakamilisha kiwango chenu cha kutengeneza matofali kama hapo awali, siku zote mbili, jana na leo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּכּוּ
  choice: wakapigwa
  rationale: Kitenzi cha kutendwa cha נכה kinaonyesha adhabu ya kimwili bila kubainisha namna ya kupiga.
- source_word: שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל
  choice: wasimamizi wa Waisraeli
  rationale: Katika muktadha huu hawa ni Waisraeli waliowekwa kusimamia kazi ya wenzao; ‘wasimamizi’ ni neno la sasa na linaloeleweka bila kuwafanya maafisa wa serikali.
- source_word: נֹגְשֵׂי פַרְעֹה
  choice: wasimamizi wa kazi wa Farao
  rationale: Neno linawahusu waliolazimisha na kusimamia kazi ya kulazimishwa; tafsiri hii inaonyesha jukumu lao katika muktadha huku ikiepuka neno la kizamani.
- source_word: לֹא כִלִּיתֶם חָקְכֶם
  choice: hamjakamilisha kiwango chenu
  rationale: כלה huonyesha kufikisha kazi mwisho, na חֹק hapa ni kiasi kilichowekwa au kiwango cha lazima.
- source_word: לִלְבֹּן
  choice: cha kutengeneza matofali
  rationale: Infinitivu ya לבן inarejelea tendo la kutengeneza matofali, si matofali pekee kama bidhaa.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: kama hapo awali
  rationale: Huu ni usemi wa Kiebrania unaomaanisha kama zamani au kama ilivyokuwa hapo kabla; maana hiyo imetolewa kwa Kiswahili cha kawaida.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: jana na leo pia
  rationale: Muundo גַּם...גַּם unasisitiza siku zote mbili; Kiswahili hiki ni cha asili na kinahifadhi msisitizo huo.
