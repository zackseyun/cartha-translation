base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/022.yaml
  text: Then Moses returned to Yahweh and said[a], “Lord, why have you brought harm on this people? Why then did you send me?”
translation:
  language: sw
  text: Ndipo Musa akarudi kwa Yahweh na kusema, “Bwana, kwa nini umewaletea watu hawa madhara? Kwa nini basi ulinituma?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi שוב hapa kina maana ya kurudi; ‘akarudi’ ni Kiswahili cha kawaida na kinaendeleza masimulizi kwa kawaida.
- source_word: אֶל יְהוָה
  choice: kwa Yahweh
  rationale: אֶל inaonyesha anayeelekezewa tendo, na jina la agano יהוה limehifadhiwa kama ‘Yahweh’.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Ni namna ya heshima ya kumwita Mungu moja kwa moja; ‘Bwana’ ni ya kawaida, yenye heshima, na tofauti yake na jina Yahweh inaonekana.
- source_word: לָמָה
  choice: kwa nini
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kiulizi hiki katika Kiswahili.
- source_word: הֲרֵעֹתָה
  choice: umewaletea ... madhara
  rationale: Hiphili ya רעע inaeleza kusababisha mabaya au madhara. Usemi huu huhifadhi nguvu ya kisababishi bila kulazimisha maana ya kwamba Mungu ametenda uovu wa kimaadili.
- source_word: לָעָם הַזֶּה
  choice: watu hawa
  rationale: עָם ni jamii ya Israeli kwa ujumla; ‘watu hawa’ ni tafsiri ya kawaida na sahihi.
- source_word: לָמָּה זֶּה
  choice: kwa nini basi
  rationale: Neno זֶה linaongeza msisitizo katika usemi huu wa Kiebrania; ‘basi’ huwasilisha msisitizo huo kwa Kiswahili cha asili.
- source_word: שְׁלַחְתָּנִי
  choice: ulinituma
  rationale: Muundo wa qatal nafsi ya pili umoja wa kiume pamoja na kiambishi cha nafsi ya kwanza una maana ya ‘ulinituma’; wakati uliopita unafaa katika swali hili la balagha.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Andiko linatumia jina maalumu la agano יהוה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya הֲרֵעֹתָה kuhusu tendo la Mungu
  choice: umewaletea ... madhara
  alternative: umewatendea ... uovu
  rationale: Tafsiri iliyochaguliwa inadumisha uzito wa malalamiko ya Musa na nguvu ya kisababishi, lakini haiamui kwamba neno hilo linamshtaki Mungu kwa uovu wa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inahifadhi ukali wa swali la Musa bila kuwa ngumu au ya kizamani.
