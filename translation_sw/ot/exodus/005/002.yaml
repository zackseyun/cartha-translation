base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/002.yaml
  text: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
translation:
  language: sw
  text: Farao akasema, “Yahwe[a] ni nani hata niitii sauti yake na kuwaacha Israeli waende? Simjui Yahwe, tena sitawaacha Israeli waende.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa mapokeo hutafsiriwa “BWANA.” Umbo jingine ni “Yehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili kwa cheo cha mfalme wa Misri.
- source_word: מִי
  choice: ni nani
  rationale: Kiulizi hiki kinauliza utambulisho, huku katika muktadha kikibeba changamoto ya dharau ya Farao.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha jina binafsi la Mungu, YHWH, badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ
  choice: hata niisikilize sauti yake
  rationale: Neno שׁמע likifuatwa na בְּקוֹל linaweza kumaanisha kusikiliza kwa kutii. Usemi huu wa Kiswahili huhifadhi taswira ya “sauti” na pia huruhusu maana ya kutii katika muktadha.
- source_word: לְשַׁלַּח
  choice: kuwaacha Israeli waende
  rationale: Huu ni usemi wa kawaida na wa asili wa Kiswahili kwa kuwaruhusu watu walioshikiliwa waondoke.
- source_word: יָדַעְתִּי
  choice: Simjui
  rationale: Kauli hii inaeleza msimamo wa sasa wa Farao kwamba hamjui Yahwe, bila kuondoa uwezekano wa maana ya kutomtambua mamlaka yake.
- source_word: וְגַם
  choice: tena
  rationale: “Tena” huongeza kwa mkazo uamuzi wa Farao baada ya kusema kwamba hamjui Yahwe.
- source_word: אֲשַׁלֵּחַ
  choice: sitawaacha ... waende
  rationale: Huwasilisha azimio la Farao la kutowaruhusu Israeli waondoke na hudumisha ulinganifu na usemi wa awali.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ni umbo sanifu la Kiswahili la jina la watu au taifa la Israeli.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la herufi nne YHWH. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo; tanbihi inataja mapokeo na umbo jingine linalotumiwa.
- issue: Maana ya Farao kusema לֹא יָדַעְתִּי אֶת־יְהוָה
  choice: Simjui Yahwe
  alternative: Simtambui Yahwe
  rationale: “Simjui” hufuata maana ya msingi ya ידע na huhifadhi mvutano kati ya kutokuwa na ujuzi na kukataa kutambua mamlaka ya Yahwe, badala ya kuamua kimya kimya upande mmoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa wasomaji wa leo, huku “niisikilize sauti yake” ukihifadhi kiasi cha nahau ya Kiebrania na maana yake ya kutii.
