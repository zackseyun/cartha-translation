base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/008.yaml
  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
translation:
  language: sw
  text: Na kiwango kilekile cha matofali walichokuwa wakitengeneza jana na juzi[a] mtawawekea; msikipunguze hata kidogo, kwa maana wao ni wavivu. Ndiyo maana wanalia kwa sauti, wakisema, ‘Twende tukamtolee Mungu wetu dhabihu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya kimuktadha, “kama zamani” au “kama hapo awali.” Kiebrania kinasema kihalisi, “jana na juzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתְכֹּנֶת
  choice: kiwango
  rationale: Katika muktadha wa kazi ya kulazimishwa, neno hili ni kiasi maalumu kinachotakiwa kuzalishwa. ‘Kiwango’ ni Kiswahili cha kawaida na kinaendana na amri ya kutokipunguza.
- source_word: הַלְּבֵנִים
  choice: matofali
  rationale: Ni nomino halisi inayorejelea matofali yaliyokuwa yakitengenezwa.
- source_word: תְּמוֹל שִׁלְשֹׁם
  choice: jana na juzi
  rationale: Huhifadhi jozi ya vielezi vya Kiebrania kwa msemo wa asili na wa kawaida katika Kiswahili; hapa pia inaweza kumaanisha kwa upana ‘hapo awali’ au ‘kama zamani,’ jambo linalowekwa katika tanbihi.
- source_word: תָּשִׂימוּ עֲלֵיהֶם
  choice: mtawapa
  rationale: Katika muktadha huu, kuweka kiwango juu ya wafanyakazi ni kuwapa au kuwabebesha sharti hilo. Pamoja na ‘kiwango kilekile,’ ‘mtawapa’ huwasilisha amri hiyo kwa Kiswahili cha kawaida.
- source_word: לֹא תִגְרְעוּ מִמֶּנּוּ
  choice: Msikipunguze hata kidogo
  rationale: Kitenzi kina maana ya kupunguza au kutoa sehemu; ‘hata kidogo’ huonyesha kuwa hakuna sehemu yoyote ya kiwango inayopaswa kupunguzwa.
- source_word: נִרְפִּים
  choice: wavivu
  rationale: Hili ndilo shtaka la Farao kwamba hawafanyi kazi kwa bidii. ‘Wavivu’ ni neno la kawaida la Kiswahili, huku muktadha ukionyesha kuwa ni hukumu yake dhidi yao.
- source_word: צֹעֲקִים
  choice: wanapiga kelele
  rationale: Huwasilisha sauti kubwa na yenye msisitizo ya kilio au mwito unaofuatiwa na usemi wa moja kwa moja.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: Twende tukamtolee ... dhabihu
  rationale: Miundo ya nafsi ya kwanza wingi huonyesha mwito au azimio. Mfululizo wa ‘Twende tuka-’ ni wa asili katika Kiswahili na unahifadhi kusudi la kwenda kutoa dhabihu.
- source_word: לֵאלֹהֵינוּ
  choice: Mungu wetu
  rationale: Hutaja kwa urahisi mpokeaji wa dhabihu; kiambishi cha yambwa katika ‘tukamtolee’ huwasilisha kihusishi cha Kiebrania.
