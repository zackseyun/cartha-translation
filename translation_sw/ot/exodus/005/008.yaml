  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Usemi ‘jana na juzi’ umehifadhiwa kwa sababu ni wa asili katika Kiswahili na unaakisi muundo wa Kiebrania; tanbihi inatunza uwezekano wa maana pana ya wakati uliopita.
