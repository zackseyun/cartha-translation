  text: Wakakutana na Musa na Aroni[a], waliokuwa wamesimama ili kukutana nao walipotoka kwa Farao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakakumbana na Musa na Aroni”; katika miktadha mingine kitenzi hiki kinaweza kuwa na maana ya “wakakabiliana na,” lakini matini kuu inahifadhi maana pana zaidi, “wakakutana na.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגְּעוּ
  choice: Wakakutana na
  rationale: Kitenzi פגע hapa kina maana pana ya kukutana au kufumbana na mtu; muktadha una mvutano, lakini kitenzi chenyewe hakilazimishi maana ya kukabiliana kwa uhasama.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Musa na Aroni
  rationale: Alama za Kiebrania za yambwa hazitafsiriwi moja kwa moja; majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili.
- source_word: נִצָּבִים
  choice: waliokuwa wamesimama
  rationale: Kauli shirikishi inaonyesha hali iliyoendelea ya kusimama au kuwa wamechukua nafasi; usemi huu ni wa kawaida na unaonyesha kwamba walikuwa wakingoja.
- source_word: לִקְרָאתָם
  choice: kuwalaki
  rationale: Neno hili hueleza kuwa mbele au kuelekea watu ili kukutana nao. ‘Kuwalaki’ ni la asili katika Kiswahili na haliongezi uhasama usiolazimishwa na chanzo.
- source_word: בְּצֵאתָם
  choice: walipotoka
  rationale: Muundo huu unaonyesha wakati wa tukio; ‘walipotoka’ huwasilisha kwa uwazi uhusiano huo wa wakati.
- source_word: מֵאֵת פַּרְעֹה
  choice: kwa Farao
  rationale: מֵאֵת huonyesha kuondoka mbele ya mtu au mahali alipo. Katika Kiswahili, ‘kutoka kwa Farao’ ni usemi mfupi na wa kawaida unaohifadhi maana hiyo.
