base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/021.yaml
  text: And they said to them[a], “May Yahweh look on you and judge, because you have made us stink in the sight of Pharaoh and in the sight of his servants, putting a sword in their hand to kill us.”
translation:
  language: sw
  text: Nao wakawaambia, “Yahwe awaangalie na awahukumu, kwa sababu mmetufanya tuchukize[a] machoni pa Farao na machoni pa watumishi wake; mmetia upanga mikononi mwao ili watuue.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mmeifanya harufu yetu inuke vibaya,” yaani, “mmetufanya tuchukize” au “mmetufanya tuonekane wenye kuchukiza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵהֶם
  choice: Nao wakawaambia
  rationale: Inadumisha mtiririko wa masimulizi na kiwakilishi cha Kiebrania bila kuongeza majina ya Musa na Aroni yaliyotajwa katika muktadha.
- source_word: יֵרֶא יְהוָה עֲלֵיכֶם וְיִשְׁפֹּט
  choice: Yahwe na awaangalie na kuwahukumu
  rationale: Vitenzi vya hali ya kutakia hapa vinaeleza ombi la hukumu dhidi yao. ‘Awaangalie’ lina maana ya Mungu kuwaona na kuyatilia maanani matendo yao, huku ‘kuwahukumu’ likihifadhi upana wa kitenzi cha Kiebrania.
- source_word: הִבְאַשְׁתֶּם אֶת רֵיחֵנוּ
  choice: mmetufanya kuwa chukizo
  rationale: Nahau hiyo kwa halisi inahusu kuifanya harufu yao inuke vibaya, yaani kuwafanya wachukize au waonekane waovu. Tafsiri hii ni ya kawaida katika Kiswahili huku tanbihi ikihifadhi taswira halisi.
- source_word: בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עֲבָדָיו
  choice: machoni pa Farao na machoni pa watumishi wake
  rationale: Inahifadhi urudiaji na nahau ya Kiebrania ‘machoni pa,’ ambayo inaeleweka katika Kiswahili na kuonyesha jinsi walivyoonekana au kutathminiwa.
- source_word: לָתֵת חֶרֶב בְּיָדָם לְהָרְגֵנוּ
  choice: mmewatia upanga mkononi ili watuue
  rationale: Inahifadhi ‘upanga’ katika umoja wa kijumla na taswira ya kuwapa njia au nafasi ya kuwaua; ‘ili watuue’ linaeleza matokeo au kusudi linalodokezwa na vitenzi-jina vya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Nguvu ya kauli יֵרֶא ... וְיִשְׁפֹּט
  choice: na awaangalie na kuwahukumu
  alternative: atawaangalia na kuwahukumu
  rationale: Miundo hii ina nguvu ya kutakia au kuomba, si utabiri wa kawaida; tafsiri inahifadhi wito wao wa kwamba Yahwe aamue dhidi ya Musa na Aroni bila kueleza mapema matokeo ya hukumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘machoni pa’ umehifadhiwa kwa kuwa ni nahau inayoeleweka, lakini nahau ya harufu imetafsiriwa kwa maana yake katika maandishi na taswira yake halisi ikawekwa katika tanbihi.
