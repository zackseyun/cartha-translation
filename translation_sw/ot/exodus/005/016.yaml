base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/016.yaml
  text: No straw is given to your servants[a], yet they say to us, ‘Make bricks!’ And behold, your servants are being beaten, but the fault is with your own people.
translation:
  language: sw
  text: Majani hayapewi watumishi wako, lakini wanatuambia, ‘Tengenezeni matofali!’ Na tazama, watumishi wako wanapigwa, lakini kosa ni la watu wako mwenyewe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “na watu wako wametenda dhambi.” Kishazi cha Kiebrania ni kifupi na kinaweza kutafsiriwa hivyo moja kwa moja, lakini katika muktadha huenda kinamaanisha kwamba watu wa Farao ndio wenye kosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּבֶן
  choice: majani
  rationale: Katika muktadha wa kutengeneza matofali, neno hili linamaanisha majani makavu yaliyotumiwa pamoja na udongo; ‘majani’ ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: אֵין נִתָּן
  choice: hayapewi
  rationale: Muundo wa Kiebrania unaonyesha kuwa nyenzo hiyo haisambazwi kwa watumishi; wakati wa sasa wa kutendwa unaeleza hali inayoendelea.
- source_word: לַעֲבָדֶיךָ / עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Wasimamizi Waisraeli wanamsemesha Farao kwa lugha ya heshima na kujishusha; ‘watumishi’ huhifadhi mahusiano hayo bila kulazimisha maana finyu ya watumwa kama mali.
- source_word: לְבֵנִים
  choice: matofali
  rationale: Hiki ndicho kitu kinachotakiwa kutengenezwa, na wingi wa Kiswahili unaendana na uzalishaji unaodaiwa.
- source_word: אֹמְרִים לָנוּ עֲשׂוּ
  choice: wanatuambia, ‘Tengenezeni matofali!’
  rationale: Inahifadhi usemi wa moja kwa moja na amri ya wingi; kurudia ‘matofali’ kunafanya amri iwe wazi katika Kiswahili.
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: ‘Tazama’ huhifadhi nguvu ya mwito wa kuzingatia dhuluma iliyo wazi huku ikidumisha hadhi ya lugha ya Biblia.
- source_word: מֻכִּים
  choice: wanapigwa
  rationale: Kauli ya kutendwa katika wakati wa sasa inaonyesha mateso yanayoendelea.
- source_word: וְחָטָאת עַמֶּךָ
  choice: lakini kosa ni la watu wako mwenyewe
  rationale: Kishazi cha Kiebrania ni kifupi na kina utata wa kisintaksia. Katika hoja ya mstari huu, tafsiri hii inaeleza kwamba lawama iko kwa watu wa Farao, si kwa wafanyakazi Waisraeli, huku tanbihi ikihifadhi tafsiri rasmi zaidi.
theological_decisions:
- issue: Utambulisho wa mwenye kosa katika וְחָטָאת עַמֶּךָ
  choice: lakini kosa ni la watu wako mwenyewe
  alternative: na watu wako wametenda dhambi
  rationale: Muktadha unaunga mkono shtaka kwamba watu wa Farao ndio wenye lawama, lakini Kiebrania kinaweza kutafsiriwa rasmi zaidi kuwa watu wake wametenda dhambi; utata huo umehifadhiwa katika tanbihi bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Watumishi wako’ huhifadhi lugha ya heshima mbele ya mfalme; ‘Na tazama’ huhifadhi msisitizo wa Kiebrania. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
