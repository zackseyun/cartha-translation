base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/015.yaml
  text: Then the officers of the sons of Israel came and cried out to Pharaoh[a], saying[c][b], “Why do you do this to your servants?”
translation:
  language: sw
  text: Ndipo wasimamizi wa Waisraeli[a] wakaja na kumlilia Farao, wakisema, “Kwa nini unawatendea hivi watumishi wako[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “watumwa wako.” Neno la Kiebrania linaweza kumaanisha watumishi au watumwa kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: wakaja
  rationale: Kitenzi hiki kinaendeleza simulizi na maana yake ya msingi ni ‘wakaja’; muundo wa ‘Ndipo ... wakaja’ unaonyesha mfuatano wa matukio kwa Kiswahili cha kawaida.
- source_word: שֹׁטְרֵי
  choice: wasimamizi
  rationale: Katika muktadha huu ni Waisraeli waliowekwa kusimamia kazi chini ya mamlaka ya Wamisri. ‘Wasimamizi’ linaonyesha wajibu wao bila kuwafanya maafisa wa cheo cha juu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa maneno ya Kiebrania ni ‘wana wa Israeli,’ hapa ni jina la kikabila linalowahusu Waisraeli kwa ujumla. ‘Waisraeli’ ni Kiswahili cha asili na cha kawaida; maana halisi imehifadhiwa katika tanbihi.
- source_word: וַיִּצְעֲקוּ
  choice: kumlilia
  rationale: Kitenzi kinaonyesha kilio au ombi la dharura, si mazungumzo ya kawaida. ‘Kumlilia’ linafaa kwa malalamiko yao ya moja kwa moja kwa Farao.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Ni utangulizi wa kawaida wa maneno yanayonukuliwa na unaakisi muundo wa Kiebrania kwa Kiswahili fasaha.
- source_word: תַעֲשֶׂה כֹה
  choice: unawatendea hivi
  rationale: Kihalisi ni ‘unafanya hivi kwa’; ‘unawatendea hivi’ ni usemi wa kawaida wa Kiswahili unaohifadhi wazo la namna Farao anavyowafanyia.
- source_word: לַעֲבָדֶיךָ
  choice: watumishi wako
  rationale: עבד inaweza kumaanisha mtumishi au mtumwa. Katika ombi lao kwa mfalme, ‘watumishi wako’ linahifadhi lugha ya heshima wanayotumia kujitaja, huku uwezekano wa ‘watumwa’ ukielezwa katika tanbihi.
theological_decisions:
- issue: Hadhi inayodokezwa na עבד
  choice: watumishi wako
  alternative: watumwa wako
  rationale: Muktadha wa kazi ya kulazimishwa unaweza kuunga mkono ‘watumwa,’ lakini namna wanavyomwomba Farao pia ni lugha ya unyenyekevu ya walio chini ya mfalme. Tafsiri kuu haifungi utata huu; tanbihi inatoa maana nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Wasimamizi’ linafaa kwa viongozi wa kazi wa Kiisraeli, na ‘kumlilia Farao’ linabeba uzito wa kilio chao cha dharura. Alama zote za tanbihi zimewekwa mara baada ya maneno yanayohusika.
