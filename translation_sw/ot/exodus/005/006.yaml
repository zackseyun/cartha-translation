lexical_decisions:
- source_word: וַיְצַו
  choice: akawaamuru
  rationale: Kauli ya kusimulia inaendeleza tukio kwa wakati uliopita na kudumisha mamlaka ya agizo la Farao.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo cha mfalme wa Misri.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni tafsiri ya moja kwa moja ya kirai cha wakati; katika muktadha kinaweza pia kusisitiza kuwa ilikuwa siku iyo hiyo.
- source_word: הַנֹּגְשִׂים בָּעָם
  choice: wasimamizi wa kazi wa watu
  rationale: Katika muktadha wa kazi ya kulazimishwa, neno linawataja waliowasukuma watu na kuwadai kazi. Tafsiri hii inaonyesha jukumu lao bila kutumia neno lisilo la kawaida.
- source_word: שֹׁטְרָיו
  choice: maafisa wao
  rationale: Kiwakilishi cha Kiebrania kinaweza kurejelea wasimamizi walio karibu katika muundo wa sentensi, hivyo 'wao' kinahifadhi uwezekano huo; maafisa hawa walikuwa watendaji wa chini katika mfumo wa kazi.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hiki ni kiunganishi cha kawaida cha Kiebrania kinachoanzisha maneno ya moja kwa moja yanayofuata.
