  - marker: c
    text: 'Kiebrania kinatumia kitenzi-jina pamoja na kitenzi kilekile kilichonyambuliwa—kwa maana ya moja kwa moja, “kuokoa, hujawaokoa”—ili kutilia mkazo ukanushaji: “hujawaokoa hata kidogo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאָז
  choice: Kwa maana tangu
  rationale: מֵאָז inaonyesha wakati unaoanzia tukio lililotajwa, yaani ‘tangu wakati huo’; kiunganishi וּ kimetafsiriwa ‘Kwa maana’ kwa kuwa Musa anaeleza msingi wa malalamiko yake.
- source_word: בָּאתִי אֶל־פַּרְעֹה
  choice: nilipomwendea Farao
  rationale: בוא pamoja na אֶל hapa inaeleza kwenda na kufika kwa Farao. ‘Nilipomwendea’ ni Kiswahili cha asili kinachohifadhi mwelekeo na kusudi la tendo.
- source_word: לְדַבֵּר בִּשְׁמֶךָ
  choice: kusema kwa jina lako
  rationale: Kirai hiki kinaonyesha kwamba Musa alisema akiwa mwakilishi wa Mungu na kwa mamlaka yake; ‘kwa jina lako’ huhifadhi taswira na uzito wa lugha ya Kiebrania.
- source_word: הֵרַע לָעָם הַזֶּה
  choice: amewatendea mabaya watu hawa
  rationale: Hiphil ya רעע inaweza kumaanisha kutenda mabaya, kudhuru, au kufanya hali iwe mbaya zaidi. Tafsiri hii inadumisha uzito wa kimaadili pamoja na madhara kwa watu.
- source_word: וְהַצֵּל לֹא הִצַּלְתָּ
  choice: nawe hukuwaokoa kamwe
  rationale: Kitenzi-jina halisi kinachofuatana na kitenzi kilichonyambuliwa kinatilia mkazo ukanushaji. ‘Kamwe’ huwasilisha mkazo wa ‘hukuwakoa hata kidogo’ kwa Kiswahili cha kawaida.
- source_word: אֶת־עַמֶּךָ
  choice: watu wako
  rationale: Hili ni shamirisho la moja kwa moja lenye nomino עַם na kiambishi cha nafsi ya pili; ‘watu wako’ ni tafsiri sahili na ya moja kwa moja.
theological_decisions:
- issue: Ukali wa malalamiko ya Musa kwamba Mungu hajawaokoa watu wake
  choice: nawe hukuwaokoa kamwe watu wako
  alternative: nawe hukuwaokoa hata kidogo watu wako
  rationale: Muundo wa Kiebrania unatilia mkazo ukanushaji na unaacha malalamiko ya Musa yakiwa makali. ‘Kamwe’ huhifadhi ukali huo bila kuuficha au kuufanya madai ya mafundisho yaliyo nje ya muktadha.
- issue: Maana ya kusema בִּשְׁמֶךָ
  choice: kwa jina lako
  alternative: kwa mamlaka yako
  rationale: Tafsiri ya karibu ‘kwa jina lako’ inaeleweka katika Kiswahili na inadumisha maana pana ya uwakilishi na mamlaka bila kuibana kuwa ufafanuzi mmoja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. ‘Nilipomwendea’ ni ya kawaida kuliko tafsiri ngumu ya neno kwa neno, huku ‘kwa jina lako,’ ‘mabaya,’ na ‘kamwe’ zikihifadhi uzito na mvutano wa malalamiko ya Musa.
