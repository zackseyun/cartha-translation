  text: For since I came to Pharaoh to speak in your name[a], he has done evil to this people[c][b], and you have certainly not delivered your people.
translation:
  language: sw
  text: Kwa maana tangu nilipomwendea Farao kusema kwa jina lako[a], amewatendea watu hawa mabaya[b], nawe hujawaokoa hata kidogo watu wako[c].
