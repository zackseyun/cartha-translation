  text: תִּכְבַּ֧ד הָ/עֲבֹדָ֛ה עַל הָ/אֲנָשִׁ֖ים וְ/יַעֲשׂוּ בָ֑/הּ וְ/אַל יִשְׁע֖וּ בְּ/דִבְרֵי שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/009.yaml
  text: Let the work be heavy on the men[a], so that they may labor at it and not pay attention to lying words.
translation:
  language: sw
  text: Kazi na iwe nzito juu ya wanaume hao, nao waifanye; wala wasitilie maanani[a] maneno ya uongo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasiyajali” au “wasiyazingatie.” Kitenzi cha Kiebrania kinaweza kumaanisha “kutilia maanani,” “kujali,” au “kuzingatia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְבַּד
  choice: na iwe nzito
  rationale: Kitenzi cha Qal chenye עֲבֹדָה kama kiima kinadumisha taswira ya kazi kuwa mzigo mzito; muundo huu pia unaonyesha agizo la Farao kwa Kiswahili cha kawaida.
- source_word: הָעֲבֹדָה
  choice: kazi
  rationale: Neno hili linaweza kumaanisha kazi, utumishi, au shughuli; katika muktadha wa kutengeneza matofali kwa kulazimishwa, “kazi” ni wazi na la kawaida.
- source_word: עַל
  choice: juu ya
  rationale: Hifadhi taswira ya mzigo wa kazi uliowekwa juu ya wanaume hao.
- source_word: הָאֲנָשִׁים
  choice: wanaume hao
  rationale: Nomino ya Kiebrania hapa inawaelekezea wanaume waliokuwa wakifanya kazi ya kulazimishwa; “hao” huunganisha rejeo hilo na muktadha.
- source_word: וְיַעֲשׂוּ בָהּ
  choice: nao waifanye
  rationale: Kiwakilishi cha kike kinarejelea “kazi.” Tafsiri hii ni ya moja kwa moja, ya asili, na inadumisha nguvu ya agizo.
- source_word: וְאַל יִשְׁעוּ
  choice: wala wasitilie maanani
  rationale: Kitenzi שעה kinaweza kumaanisha kutazama, kujali, au kuzingatia. “Kutilia maanani” kinaeleza kwa kawaida kukazia fikira au kuyapa uzito maneno fulani bila kufunga kabisa wigo wa maana.
- source_word: בְּדִבְרֵי שָׁקֶר
  choice: maneno ya uongo
  rationale: דְּבָרִים hapa ni maneno au kauli, na שֶׁקֶר ni uongo au udanganyifu. Muundo huu unahifadhi jinsi Farao alivyoyapuuza madai ya Musa na Haruni kuwa ya uongo.
