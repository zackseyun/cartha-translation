  yaml_path: translation/ot/exodus/005/013.yaml
  text: And the taskmasters kept pressing them[a], saying, “Finish your work, each day’s matter in its day, just as when there was straw.”
translation:
  language: sw
  text: Nao wasimamizi wa kazi walikuwa wakiwashinikiza, wakisema, “Malizeni kazi zenu—kiasi cha kazi cha kila siku, siku kwa siku[a]—kama ilivyokuwa wakati majani makavu yalipokuwapo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo la siku katika siku yake.” Nahau ya Kiebrania kwa halisi husema “jambo la siku katika siku yake,” ikirejelea kiasi cha kazi kilichotakiwa kila siku.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגְשִׂים
  choice: wasimamizi wa kazi
  rationale: Katika muktadha wa kazi ya kulazimishwa, neno hili linawataja maafisa waliodai kazi na kiwango kilichowekwa. ‘Wasimamizi wa kazi’ ni la kawaida na lenye kueleweka, huku shinikizo lao likibainishwa na kitenzi kinachofuata.
- source_word: אָצִים
  choice: wakaendelea kuwashinikiza
  rationale: Umbo la kitenzi linaonyesha hatua endelevu ya kuharakisha kwa nguvu; ‘wakaendelea kuwashinikiza’ huhifadhi hali hiyo ya kudumu na ya kulazimisha.
- source_word: כַּלּוּ
  choice: Malizeni
  rationale: Ni amri ya kukamilisha kazi iliyodaiwa; ‘Malizeni’ ni ya moja kwa moja na ya asili katika Kiswahili.
- source_word: מַעֲשֵׂיכֶם
  choice: kazi yenu
  rationale: Hurejelea kazi waliyopewa Waisraeli, hasa utengenezaji wa matofali; ‘kazi yenu’ huhifadhi upana wa neno la Kiebrania.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: kiasi cha kila siku katika siku yake
  rationale: Nahau ya Kiebrania kwa halisi ni ‘jambo la siku katika siku yake,’ lakini katika muktadha inaelekea kumaanisha kiasi cha kazi kinachodaiwa kila siku. Tafsiri hii inabaki karibu na muundo wa asili huku ikieleweka kwa msomaji.
- source_word: כַּאֲשֶׁר
  choice: kama ilivyokuwa
  rationale: Huanzisha ulinganisho na hali ya awali na kuonyesha kuwa dai la kazi halikupunguzwa.
- source_word: בִּהְיוֹת הַתֶּבֶן
  choice: wakati majani makavu yalipokuwapo
  rationale: Muundo huu unaonyesha hali ya awali ambapo nyasi/majani ya kuchanganyia matofali yalikuwapo. ‘Majani makavu’ ni usemi wa kawaida wa Kiswahili kwa nyenzo hii katika muktadha.
