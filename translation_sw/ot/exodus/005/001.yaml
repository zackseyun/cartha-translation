  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אַחַ֗ר בָּ֚אוּ מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן וַ/יֹּאמְר֖וּ אֶל פַּרְעֹ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יָחֹ֥גּוּ לִ֖/י בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/001.yaml
  text: 'Afterward Moses and Aaron went in and said to Pharaoh[a], “Thus says Yahweh, the God of Israel: Let my people go[b], so that they may hold a feast to me in the wilderness.”'
translation:
  language: sw
  text: 'Baadaye Musa na Haruni wakaingia mbele ya Farao, wakamwambia, “Hivi ndivyo asemavyo Yahweh[a], Mungu wa Israeli: ‘Waache watu wangu waende, ili wanifanyie sikukuu[b] jangwani.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH,” jina binafsi la Mungu; pia hutoholewa “Yahwe.”'
    reason: alternative_reading
  - marker: b
    text: Au “ili waniadhimishie sikukuu” au “ili wanifanyie sherehe ya sikukuu”; kitenzi cha Kiebrania kinamaanisha kuadhimisha sikukuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Baadaye
  rationale: Ni kiashiria cha wakati kinachoendeleza mfululizo wa simulizi bila kutaja muda hususa uliopita.
- source_word: בָּאוּ
  choice: wakaingia mbele ya Farao
  rationale: Kitenzi kwa msingi wake ni ‘walikuja/waliingia’; katika muktadha huu kinaonyesha kuingia mbele ya mtawala ili kuzungumza naye.
- source_word: וַיֹּאמְרוּ אֶל־פַּרְעֹה
  choice: wakamwambia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya fomula ya kisimulizi ya kusema na mtu aliyetajwa.
- source_word: כֹּה אָמַר
  choice: Hivi ndivyo asemavyo
  rationale: Inahifadhi fomula rasmi na yenye mamlaka ya mjumbe anayewasilisha maneno ya Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Inawakilisha wazi muundo wa Kiebrania unaomtambulisha Yahwe kuwa Mungu wa Israeli.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Waache watu wangu waende
  rationale: Amri inamtaka Farao awaruhusu Israeli waondoke; usemi huu ni wa kawaida na una nguvu ya amri katika Kiswahili.
- source_word: וְיָחֹגּוּ לִי
  choice: ili waniadhimishie sikukuu
  rationale: Kitenzi חגם/חגג hapa kinahusu kuadhimisha sikukuu, si ibada kwa maana pana tu; kiambishi ‘-ni-’ kinahifadhi maana ya ‘kwa ajili yangu/kwangu’.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: Neno linamaanisha eneo la nyika au jangwa; ‘jangwani’ ni la kawaida na linafaa mazingira ya simulizi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kusudi la kuondoka kwa watu
  choice: ili waniadhimishie sikukuu
  alternative: ili waniabudu
  rationale: Kitenzi cha Kiebrania kinataja hasa kuadhimisha sikukuu; tafsiri pana ‘waniabudu’ ingepoteza wazo hilo mahususi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Fomula “Hivi ndivyo asemavyo” inadumisha uzito rasmi wa ujumbe, huku sentensi nyingine zikibaki wazi kwa msomaji wa kawaida.
