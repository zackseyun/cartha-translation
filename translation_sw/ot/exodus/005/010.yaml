base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/010.yaml
  text: 'So the taskmasters of the people and their officers went out and said to the people[a], “Thus says Pharaoh: I am not giving you straw.”'
translation:
  language: sw
  text: 'Basi wasimamizi wa kazi za kulazimishwa za watu na maafisa wao wakatoka, wakawaambia watu, “Farao anasema hivi: ‘Siwapi majani.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹגְשֵׂי
  choice: wasimamizi wa kazi za kulazimishwa
  rationale: Katika muktadha wa Kutoka, neno hili linawataja waliolazimisha watu kutimiza kiwango cha kazi. Tafsiri hii inaonyesha usimamizi wenye shuruti bila kuongeza moja kwa moja neno ‘watumwa’ lisilotajwa katika aya.
- source_word: שֹׁטְרָיו
  choice: maafisa wao
  rationale: Kiambishi cha nafsi kinaeleweka kuwarejelea watu; ‘maafisa wao’ kinahifadhi maana pana ya watendaji wa chini kutoka miongoni mwa watu bila kubana maana kuwa ‘wanyapara.’
- source_word: וַיֵּצְאוּ
  choice: wakatoka
  rationale: Hii ni tafsiri ya kawaida ya kitenzi cha kwenda au kutoka, na inafaa kwa mwendo wa masimulizi kutoka mbele ya Farao kwenda kwa watu.
- source_word: הָעָם
  choice: watu
  rationale: Nomino ya pamoja inarejelea watu wa Israeli waliokuwa wakifanya kazi.
- source_word: לֵאמֹר
  choice: wakawaambia
  rationale: Badala ya muundo halisi ‘wakisema,’ Kiswahili cha kawaida hutumia kitenzi cha kusema kinachotambulisha maneno yaliyonukuliwa.
- source_word: כֹּה אָמַר
  choice: anasema hivi
  rationale: Huu ni mtindo wa mjumbe wa kuwasilisha tangazo rasmi; wakati wa sasa unahifadhi nguvu ya agizo linalotangazwa.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki katika Kiswahili.
- source_word: אֵינֶנִּי נֹתֵן
  choice: Siwapi
  rationale: Muundo huu unaonyesha kukataa kwa sasa kutoa kitu hicho; ‘Siwapi’ ni wa asili katika Kiswahili na unahifadhi nguvu ya tangazo la mara moja.
- source_word: תֶּבֶן
  choice: majani
  rationale: Katika muktadha wa kutengeneza matofali, neno hili ni malighafi ya mimea iliyokatwa na kukaushwa; ‘majani’ ni neno linaloeleweka kwa urahisi katika Kiswahili cha Afrika Mashariki.
