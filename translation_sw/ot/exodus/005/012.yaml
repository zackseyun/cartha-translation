  text: Basi watu wakatawanyika katika nchi yote ya Misri ili kukusanya mabua makavu badala ya majani makavu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kukusanya majani makavu badala ya mabua makavu.” Maana mahususi ya קַשׁ na תֶּבֶן, maneno mawili ya mabaki makavu ya mimea, hutofautishwa kwa njia mbalimbali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: wakatawanyika
  rationale: Kitenzi פוץ katika mfululizo wa simulizi kinaonyesha watu kusambaa eneo pana kwa sababu ya agizo la Farao. “Wakatawanyika” ni usemi wa kawaida wa Kiswahili unaohifadhi hali hiyo bila kulazimisha kauli tendwa.
- source_word: הָעָם
  choice: watu
  rationale: עַם hapa ni jamii ya Waisraeli waliotumikishwa kwa pamoja; “watu” ni tafsiri ya kawaida, yenye hadhi, isiyoongeza maelezo yasiyokuwapo katika Kiebrania.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: katika nchi yote ya Misri
  rationale: Usemi huu unaonyesha kusambaa kote katika eneo la Misri. “Katika nchi yote ya Misri” ni wa asili katika Kiswahili na huhifadhi maana ya בְּכָל.
- source_word: לְקֹשֵׁשׁ
  choice: ili kukusanya
  rationale: קשש humaanisha kuokota au kukusanya vipande vidogo vilivyotawanyika. “Ili kukusanya” huonyesha wazi kusudi la kutawanyika kwao.
- source_word: קַשׁ
  choice: mabua makavu
  rationale: קַשׁ ni masalia makavu ya mashina au mabua shambani. Kwa kuwa תֶּבֶן limetumiwa pia katika kishazi hiki, “mabua makavu” hudumisha tofauti inayowezekana kati ya masalia waliyokusanya na majani yaliyotolewa kwa kawaida.
- source_word: לַתֶּבֶן
  choice: badala ya majani
  rationale: 'ל inaweza kuonyesha matumizi au ubadala: mabua yaliyokusanywa yangetumiwa mahali pa תֶּבֶן katika kutengeneza matofali. “Badala ya majani” huweka wazi uhusiano huo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano mwingine wa kileksika.'
