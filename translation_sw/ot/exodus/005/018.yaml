    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huonyesha mpito wenye mkazo unaoanzisha amri ya mwisho ya Farao; ni usemi wa kawaida na wenye nguvu katika Kiswahili.
- source_word: לְכוּ
  choice: nendeni
  rationale: Ni amri ya wingi ya kitenzi ‘kwenda,’ na hapa ina nguvu ya kuwaamuru waondoke waende kazini.
- source_word: עִבְדוּ
  choice: mkafanye kazi
  rationale: Katika muktadha huu מדובר kazi ya kulazimishwa, si huduma ya ibada; ‘mkafanye kazi’ huunganika kwa kawaida na ‘nendeni.’
- source_word: וְתֶבֶן
  choice: Lakini ... majani
  rationale: 'Kiunganishi kina maana ya utofautishaji katika muktadha: wanapaswa kufanya kazi ingawa nyenzo hiyo haitatolewa. ‘Majani’ ni neno linaloeleweka kwa mabaki ya mimea yaliyotumiwa kutengeneza matofali.'
- source_word: יִנָּתֵן לָכֶם
  choice: hamtapewa
  rationale: Huhifadhi hali ya kutendwa na ukanushi wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: תֹכֶן
  choice: idadi iliyowekwa
  rationale: Neno hilo linaonyesha kiasi kilichopimwa au kilichowekwa ambacho wafanyakazi walitakiwa kutimiza; katika muktadha wa matofali, ‘idadi iliyowekwa’ ni wazi na sahihi.
- source_word: לְבֵנִים
  choice: ya matofali
  rationale: Huhifadhi uhusiano wa kirai kati ya kiasi kinachotakiwa na matofali.
- source_word: תִּתֵּנּוּ
  choice: lazima mtoe
  rationale: Ingawa kwa muundo ni ‘mtatoa,’ katika muktadha ni wajibu wa kutoa uzalishaji uliodaiwa; ‘lazima mtoe’ huonyesha nguvu ya amri bila kuongeza wazo lisilokuwapo.
