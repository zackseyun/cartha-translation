  text: וְ/הִקְטַרְתָּ֤ אֶת כָּל הָ/אַ֨יִל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֥ה ה֖וּא לַֽ/יהוָ֑ה רֵ֣יחַ נִיח֔וֹחַ אִשֶּׁ֥ה לַ/יהוָ֖ה הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/018.yaml
  text: And you shall burn the whole ram on the altar[a]. It is a burnt offering to Yahweh, a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: sw
  text: Nawe utamteketeza kondoo-dume huyo mzima juu ya madhabahu. Hiyo ni sadaka ya kuteketezwa kwa Yahweh, yenye harufu ya kupendeza[a]; ni sadaka inayotolewa kwa moto kwa Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “harufu ya kutuliza.” Hii ni kauli ya kawaida ya Kiebrania kuhusu sadaka inayokubalika kwa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia istilahi maalumu ya dhabihu, אִשֶּׁה, ambayo pia imetafsiriwa “sadaka ya moto”; katika baadhi ya tafsiri hueleweka kama sadaka ya chakula inayotolewa kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטַרְתָּ
  choice: Nawe utamteketeza
  rationale: Hifili ya קטר katika muktadha wa dhabihu humaanisha kuifanya sadaka ipae kama moshi kutoka madhabahuni. “Kuteketeza” ni Kiswahili cha kawaida kinachoeleza kuchomwa kwa sadaka, huku muktadha wa madhabahu ukihifadhi maana ya kiibada.
- source_word: כָּל הָאַיִל
  choice: kondoo-dume huyo mzima
  rationale: כָּל inasisitiza kwamba mnyama mzima anatolewa, na אַיִל ni kondoo-dume hasa, si kondoo kwa ujumla.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Ingawa umbo la Kiebrania linaelekeza upande wa madhabahu, kitendo cha kuchoma sadaka hutendeka juu yake; hii ndiyo kauli ya asili katika Kiswahili.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hii ni istilahi iliyo wazi na inayotambulika kwa sadaka inayochomwa yote madhabahuni; haifichi tabia ya sadaka hiyo.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Herufi ל inaonyesha kwamba sadaka imeelekezwa na kuwekwa wakfu kwa Yahweh. “Kwa Yahweh” ni Kiswahili cha kawaida katika muktadha huu.
- source_word: רֵיחַ נִיחוֹחַ
  choice: yenye harufu ya kupendeza
  rationale: Ni fomula ya kudumu ya lugha ya dhabihu inayoonyesha sadaka inayokubalika. Kauli hii ni ya kawaida katika Kiswahili na haiongezi maelezo yasiyokuwapo katika Kiebrania.
- source_word: אִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Istilahi hii ya dhabihu huhusishwa na sadaka inayochomwa kwa moto. Tafsiri hii ni wazi, inafaa muktadha wa kondoo-dume anayeteketezwa, na inaepuka kuifanya bila shaka kuwa “sadaka ya chakula,” jambo ambalo si wazi katika neno lenyewe.
- source_word: הוּא
  choice: Hiyo ni / ni
  rationale: Kiwakilishi hiki kinatambulisha sadaka kwa njia ya kiarifu katika sehemu zote mbili. Kiswahili hutumia “Hiyo ni” mwanzoni na kinaweza kuacha kiwakilishi katika kishazi kinachofuata bila kupoteza msisitizo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Andiko la Kiebrania linatumia jina la agano יהוה. “Yahweh” hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Maana ya fomula רֵיחַ נִיחוֹחַ
  choice: yenye harufu ya kupendeza
  alternative: yenye harufu ya kutuliza
  rationale: Tafsiri iliyochaguliwa inaonyesha kukubalika kwa sadaka bila kuamua kwamba harufu hiyo inamtuliza Mungu kutoka katika hasira; tanbihi inahifadhi uwezekano wa tafsiri ya karibu zaidi na neno la Kiebrania.
- issue: Ufafanuzi wa אִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  alternative: sadaka ya chakula
  rationale: Katika muktadha huu sadaka nzima inachomwa madhabahuni. Tafsiri ya moto inafuata matumizi ya kiibada bila kuingiza dhana ya chakula kama maana pekee ya istilahi hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Kondoo-dume,” “madhabahu,” na “sadaka ya kuteketezwa” ni istilahi zilizo wazi katika muktadha wa ibada. Alama za tanbihi zimewekwa mara tu baada ya kauli zinazohusika.
