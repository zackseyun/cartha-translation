base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/025.yaml
  text: Then you shall take them from their hands and burn them on the altar[a], on top of the burnt offering, as a pleasing aroma before Yahweh. It is an offering made by fire to Yahweh.
translation:
  language: sw
  text: Kisha utavichukua kutoka mikononi mwao na kuviteketeza juu ya madhabahu, juu ya sadaka ya kuteketezwa, ili iwe harufu ya kupendeza mbele za Yahweh. Hiyo ni sadaka inayotolewa kwa moto[a] kwa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, «sadaka ya moto kwa Yahweh»; yaani, «sadaka kwa Yahweh inayotolewa kwa moto.»
    reason: Mbadala wa kileksikografia wa אִשֶּׁה; neno hili ni istilahi ya dhabihu inayohusishwa na utoaji kwa moto.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kisha utavichukua
  rationale: Muundo wa maelekezo unaonyesha hatua inayofuata na una nguvu ya amri; “kisha” huonyesha mfuatano wa ibada kwa Kiswahili cha kawaida.
- source_word: אֹתָם מִיָּדָם
  choice: kutoka mikononi mwao
  rationale: Hudumisha taswira halisi ya kuvichukua vile vitu vya sadaka kutoka mikononi mwa makuhani.
- source_word: וְהִקְטַרְתָּ
  choice: kuviteketeza
  rationale: Katika muktadha wa dhabihu, Hifili ya קטר humaanisha kuteketeza sadaka juu ya madhabahu ili ipae kama moshi; “kuviteketeza” ni wazi na ya kawaida katika istilahi za kibiblia za Kiswahili.
- source_word: הַמִּזְבֵּחָה עַל הָעֹלָה
  choice: juu ya madhabahu, juu ya sadaka ya kuteketezwa
  rationale: Hutofautisha mahali pa tendo, yaani madhabahuni, na kuwekwa kwa sehemu hizo juu ya sadaka ya kuteketezwa iliyokuwapo.
- source_word: לְרֵיחַ נִיחוֹחַ
  choice: viwe harufu ya kumpendeza
  rationale: Huhifadhi sitiari ya harufu na maana ya kukubalika au kumpendeza Mungu, bila kuifanya kuwa maelezo ya harufu nzuri tu.
- source_word: לִפְנֵי יְהוָה
  choice: Yahweh
  rationale: Katika kishazi cha Kiswahili “harufu ya kumpendeza Yahweh,” wazo la kuwa mbele zake linaelezwa kwa namna ya asili kupitia uhusiano wa kumpendeza; jina la agano יְהוָה limetafsiriwa “Yahweh.”
- source_word: אִשֶּׁה הוּא לַיהוָה
  choice: Hiyo ni sadaka inayotolewa kwa moto kwa Yahweh
  rationale: אִשֶּׁה ni istilahi ya dhabihu inayohusishwa na utoaji kwa moto. Tafsiri hii huepuka kuingiza dhana ya “chakula” ambayo si wazi katika neno lenyewe hapa, huku ikihifadhi kujitolea kwake kwa Yahweh.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maana ya istilahi ya dhabihu אִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  alternative: sadaka ya chakula kwa Yahweh
  rationale: Uhusiano wa neno hili na moto ndio unaofaa zaidi katika muktadha huu, hasa baada ya amri ya kuteketeza juu ya madhabahu. Taswira ya chakula ipo katika mfumo mpana wa kikuhani, lakini si lazima iingizwe katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Viwakilishi vya ngeli ya vitu (“utavichukua,” “kuviteketeza,” “viwe”) vinarejelea sehemu za sadaka zilizotajwa katika muktadha uliotangulia. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi iliyohitajika katika rasimu hii.
