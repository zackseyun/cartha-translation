revisions:
- from: Na ikiwa sehemu yoyote ya nyama ya sadaka ya kuwekwa wakfu[a], au mkate wowote, itabaki mpaka asubuhi, basi utateketeza kwa moto kile kilichobaki. Haitaliwa, kwa sababu ni takatifu.
  to: Na ikiwa nyama yoyote ya sadaka ya kuwekwa wakfu[a], au mkate wowote, utakaosalia hadi asubuhi, utateketeza kilichosalia kwa moto. Hakitaliwa, kwa sababu ni takatifu.
  rationale: Marekebisho yanaondoa “sehemu yoyote,” ambayo huweka kikomo kisichosemwa na matini, na kuboresha mlingano wa kisarufi kwa kutumia “utakaosalia.” “Hakitaliwa” hurejelea kwa kawaida “kilichosalia” na huhifadhi sauti ya kutendwa ya katazo la Kiebrania. Istilahi kuu ya kiibada imehifadhiwa, na tanbihi inaeleza maana ya הַמִּלֻּאִים kwa Kiswahili cha kisasa na cha asili.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:05:56Z'
