base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/034.yaml
  text: And if any of the flesh of the ordination offering or any of the bread is left until the morning[a], then you shall burn what is left with fire. It shall not be eaten, because it is holy.
translation:
  language: sw
  text: Na ikiwa nyama yoyote ya sadaka ya kuwekwa wakfu[a], au mkate wowote, utakaosalia hadi asubuhi, utateketeza kilichosalia kwa moto. Hakitaliwa, kwa sababu ni takatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linarejelea ibada ya kuwaweka makuhani rasmi katika huduma.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּתֵר
  choice: itabaki
  rationale: Nifali ya יתר ina maana ya kitu kubaki; “itabaki” ni ya kawaida na huhifadhi hali ya kutendwa inayodokezwa na muundo wa Kiebrania.
- source_word: בְּשַׂר
  choice: nyama
  rationale: Katika muktadha wa dhabihu, “nyama” ni tafsiri ya kawaida na iliyo wazi ya בָּשָׂר katika Kiswahili cha sasa.
- source_word: הַמִּלֻּאִים
  choice: sadaka ya kuwekwa wakfu
  rationale: Katika muktadha huu wa kikuhani, neno hili linahusu ibada ya kuwaweka makuhani rasmi katika huduma. “Sadaka” inaongezwa kutokana na muktadha wa nyama ya dhabihu.
- source_word: לֶּחֶם
  choice: mkate
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: עַד הַבֹּקֶר
  choice: mpaka asubuhi
  rationale: Huhifadhi mpaka wa wakati unaoelezwa na עַד.
- source_word: וְשָׂרַפְתָּ
  choice: basi utateketeza
  rationale: “Basi” huonyesha kwa kawaida matokeo ya sharti lililoanzishwa na “ikiwa,” huku “utateketeza” ikihifadhi agizo la kuchoma kabisa.
- source_word: הַנּוֹתָר
  choice: kile kilichobaki
  rationale: Kirai hiki hutafsiri partisipu iliyotumika kama nomino na kuhusisha mabaki yote yaliyotajwa.
- source_word: בָּאֵשׁ
  choice: kwa moto
  rationale: Huhifadhi maana ya moto kuwa chombo cha kuteketeza.
- source_word: לֹא יֵאָכֵל
  choice: Haitaliwa
  rationale: Muundo wa kutendwa huhifadhiwa, pamoja na nguvu ya katazo katika lugha ya kisheria.
- source_word: קֹדֶשׁ
  choice: takatifu
  rationale: “Takatifu” ni istilahi ya kawaida ya Kibiblia na huhifadhi uzito wa kiibada na kitheolojia wa קֹדֶשׁ.
theological_decisions:
- issue: Tafsiri ya istilahi ya kiibada הַמִּלֻּאִים katika muktadha wa kuwaweka makuhani rasmi
  choice: sadaka ya kuwekwa wakfu
  alternative: sadaka ya kuwaweka rasmi katika ukuhani
  rationale: Neno la Kiebrania linahusu ibada ya kuingizwa rasmi katika huduma ya kikuhani. “Kuwekwa wakfu” ni fupi na ya kawaida katika Kiswahili cha Kibiblia, huku tanbihi ikifafanua maana yake maalumu bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya sheria za kiibada lakini kinachoeleweka kwa msomaji wa kawaida. Alama ya tanbihi imewekwa mara baada ya istilahi inayofafanuliwa.
