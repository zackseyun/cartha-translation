  terminology: “Sadaka ya kuwekwa wakfu,” “mkate,” “kuteketeza kwa moto,” na “takatifu” zinafaa kwa muktadha wa kiibada. Tanbihi imerekebishwa ili ifafanue istilahi ya Kiebrania kwa ufasaha zaidi bila kuongeza tafsiri ya kimadhehebu.
