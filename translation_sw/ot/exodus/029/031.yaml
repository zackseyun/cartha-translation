translation:
  language: sw
  text: “Kisha utamchukua kondoo dume wa kuwekwa wakfu[a], na utaichemsha nyama yake mahali patakatifu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kondoo dume wa kuwekwa rasmi katika ukuhani.” Neno la Kiebrania linahusu ibada ya kuwaingiza makuhani katika huduma yao.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika Patakatifu,” ingawa Kiebrania husema kwa maneno halisi zaidi, “mahali patakatifu.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיל
  choice: kondoo dume
  rationale: Hili ndilo neno la kawaida na wazi la Kiswahili kwa mnyama wa dhabihu anayekusudiwa hapa.
- source_word: הַמִּלֻּאִים
  choice: wa kuwekwa wakfu
  rationale: Katika muktadha huu neno linahusu ibada ya kuwaingiza makuhani rasmi katika huduma. ‘Kuwekwa wakfu’ ni lugha ya asili ya Kiswahili inayoeleza tendo hilo bila kutafsiri kijuujuu nahau ya Kiebrania ya ‘kujaza mikono.’
- source_word: תִּקָּח
  choice: utamchukua
  rationale: Wakati ujao katika mfululizo wa maagizo unahifadhi nguvu ya agizo na mpangilio wake; kiambishi cha ngeli ya kiumbe hai kinafaa kwa kondoo dume.
- source_word: וּבִשַּׁלְתָּ
  choice: na kuchemsha
  rationale: Kitenzi cha Kiebrania hapa huelekeza hasa kupika kwa kuchemsha, si kupika kwa maana pana.
- source_word: בְּשָׂרוֹ
  choice: nyama yake
  rationale: ‘Nyama’ ni tafsiri ya kawaida na ya kueleweka ya בשר katika muktadha wa mnyama wa dhabihu; ‘mwili’ hapa ungeweza kupotosha maana.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: mahali patakatifu
  rationale: Kirai cha Kiebrania hakina kibainishi kinacholazimisha maana ya chumba maalumu kiitwacho Patakatifu; tafsiri hii inadumisha upeo wake wa jumla.
theological_decisions:
- issue: Maana ya istilahi ya kiibada הַמִּלֻּאִים katika kuwekwa kwa makuhani
  choice: kondoo dume wa kuwekwa wakfu
  alternative: kondoo dume wa kuwekwa rasmi katika ukuhani
  rationale: ‘Kuwekwa wakfu’ huwasilisha kujitenga kwa ajili ya huduma takatifu na, katika muktadha huu, tendo la kuwaingiza makuhani katika wajibu wao. Tanbihi inaeleza upekee wa ibada hiyo bila kuingiza msimamo wa dhehebu.
- issue: Iwapo בְּמָקוֹם קָדֹשׁ ni mahali patakatifu kwa jumla au chumba maalumu cha Patakatifu
  choice: mahali patakatifu
  alternative: katika Patakatifu
  rationale: Muundo wa Kiebrania haubainishi kwa lazima chumba maalumu cha hema la kukutania. Tafsiri ya jumla inazuia kuongeza umahususi ambao haujalazimishwa na matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kisha’ huunganisha agizo hili na mfululizo wa maagizo yaliyotangulia; ‘kuchemsha’ huhifadhi umahususi wa kitendo. Alama zote za tanbihi zimewekwa katika matini kuu.
