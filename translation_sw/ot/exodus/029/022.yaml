    rationale: יֹתֶרֶת הַכָּבֵד hurejelea kiambatisho au sehemu ya ini, ingawa utambulisho wake mahususi haukubaliwi kwa kauli moja. “Kiambatisho cha ini” ni fupi, ya kawaida zaidi, na haiamui kwa kupita kiasi.
