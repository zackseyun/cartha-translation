  to: Kisha utatwaa kutoka kwa kondoo dume huyo mafuta, mkia wenye mafuta, mafuta yanayofunika viungo vya ndani, kiambatisho cha ini[a], figo zote mbili pamoja na mafuta yaliyo juu ya figo hizo, na paja la kulia, kwa maana huyo ni kondoo dume wa kuwekwa wakfu[b].
  rationale: Marekebisho yanaweka wazi kwamba mafuta yanayokusudiwa ni yale yaliyo juu ya figo zote mbili, kulingana na wingi wa Kiebrania. Pia yanatumia “kiambatisho cha ini” kwa istilahi yenye utata wa anatomia na kuongeza tanbihi inayohifadhi tafsiri mbadala. Tanbihi ya kuwekwa wakfu imehamishwa hadi alama yake sahihi baada ya kirai kinachohusika.
