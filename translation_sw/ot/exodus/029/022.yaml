base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/022.yaml
  text: And you shall take from the ram the fat[a], and the fat tail, and the fat that covers the entrails, and the lobe of the liver, and the two kidneys, and the fat that is on them, and the right thigh, for it is a ram of ordination.
translation:
  language: sw
  text: Kisha utatwaa kutoka kwa kondoo dume huyo mafuta, mkia wenye mafuta, mafuta yanayofunika viungo vya ndani, kiambatisho cha ini[a], figo zote mbili pamoja na mafuta yaliyo juu ya figo hizo, na paja la kulia, kwa maana huyo ni kondoo dume wa kuwekwa wakfu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ya ini” au “tundu la ini.” Utambulisho sahihi wa sehemu hii ya anatomia haukubaliwi kwa kauli moja.
    reason: lexical_alternative
  - marker: b
    text: Yaani, kondoo dume aliyetumiwa katika ibada ya kuwaingiza makuhani rasmi katika huduma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kisha utatwaa
  rationale: Katika mfululizo wa maagizo, waw pamoja na kitenzi cha wakati timilifu hutoa hatua inayofuata; ‘Kisha utatwaa’ ni ya kawaida na huhifadhi mtiririko wa utaratibu.
- source_word: חֵלֶב
  choice: mafuta
  rationale: Katika muktadha wa dhabihu, neno hili linamaanisha sehemu za mafuta ya mnyama zilizotengwa kwa ajili ya kutolewa.
- source_word: אַלְיָה
  choice: mkia wenye mafuta
  rationale: Neno linataja mkia mnono wa kondoo, si mkia kwa ujumla; usemi huu huhifadhi umahususi wa sehemu hiyo ya mwili.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: yanayofunika viungo vya ndani
  rationale: Kirai kinaeleza mafuta yanayofunika viungo vya ndani; tafsiri hii ni wazi na ya kawaida kwa Kiswahili cha sasa.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: sehemu inayoshikamana na ini
  rationale: Utambulisho kamili wa sehemu hii ya mwili unabishaniwa. Tafsiri hii huepuka kuamua kwamba ni ‘tundu’ au ‘kiambatisho’ fulani huku ikidumisha uhusiano wake na ini.
- source_word: כְּלָיֹת
  choice: figo
  rationale: Neno linamaanisha figo moja kwa moja katika muktadha huu wa anatomia.
- source_word: שׁוֹק הַיָּמִין
  choice: paja la kulia
  rationale: שׁוֹק hutaja sehemu ya mguu au paja inayotengwa katika dhabihu; ‘paja’ ni neno mahususi na linaloeleweka katika Kiswahili.
- source_word: אֵיל מִלֻּאִים
  choice: kondoo dume wa kuwekwa wakfu
  rationale: Kirai kinamtaja kondoo dume anayetumiwa katika ibada ya kuwaingiza makuhani rasmi katika huduma. ‘Kuwekwa wakfu’ ni ya kawaida, yenye hadhi, na haileti lazima miundo ya baadaye ya kidhehebu.
theological_decisions:
- issue: Istilahi ya kuwaingiza makuhani katika huduma katika אֵיל מִלֻּאִים
  choice: kondoo dume wa kuwekwa wakfu
  alternative: kondoo dume wa kuingizwa rasmi katika huduma
  rationale: Muktadha ni ibada ya kuwaweka Haruni na wanawe katika huduma ya ukuhani. ‘Kuwekwa wakfu’ huwasilisha uteuzi na utenganisho kwa huduma bila kuhusisha kwa lazima taratibu za madhehebu ya baadaye; tanbihi inafafanua maana ya kiibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ya kiutaratibu imehifadhiwa, huku istilahi za anatomia zikitolewa kwa uwazi bila kuficha kutokuwa na uhakika kuhusu יֹתֶרֶת הַכָּבֵד.
