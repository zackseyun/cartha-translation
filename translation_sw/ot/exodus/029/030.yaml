  text: שִׁבְעַ֣ת יָמִ֗ים יִלְבָּשָׁ֧/ם הַ/כֹּהֵ֛ן תַּחְתָּ֖י/ו מִ/בָּנָ֑י/ו אֲשֶׁ֥ר יָבֹ֛א אֶל אֹ֥הֶל מוֹעֵ֖ד לְ/שָׁרֵ֥ת בַּ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/030.yaml
  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
translation:
  language: sw
  text: Kwa siku saba, kuhani atakayechukua nafasi yake kutoka miongoni mwa wanawe atayavaa[a], atakapoingia katika Hema la Kukutania ili kuhudumu mahali patakatifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atajivika.” Kitenzi cha Kiebrania kinaweza kumaanisha kujivika mavazi au kuyavaa.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika patakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Kwa siku saba
  rationale: Huwasilisha kwa Kiswahili sanifu kipindi ambacho mavazi hayo yatavaliwa.
- source_word: יִלְבָּשָׁם
  choice: atayavaa
  rationale: Kitenzi לבש kinaweza kumaanisha kuvaa kwa kitendo cha kujivika au kuwa na mavazi mwilini; “atayavaa” ni cha asili na huhifadhi uwezekano huo katika Kiswahili.
- source_word: הַכֹּהֵן תַּחְתָּיו
  choice: kuhani atakayechukua nafasi yake
  rationale: Tafsiri hii inaonyesha mrithi wa cheo cha ukuhani badala ya mahali pa kimwili tu.
- source_word: מִבָּנָיו
  choice: kutoka miongoni mwa wanawe
  rationale: 'Huhifadhi maana ya sehemu ya kundi: mrithi huyo ni mmoja wa wanawe.'
- source_word: אֲשֶׁר יָבֹא
  choice: atakapoingia
  rationale: Katika muktadha huu kishazi cha Kiebrania kinaeleweka kwa urahisi kama hali ya wakati inayohusishwa na kuingia kwa ajili ya huduma.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Ni istilahi ya kawaida na inayoeleweka kwa hema maalumu ambako kukutana kulifanyika.
- source_word: לְשָׁרֵת
  choice: ili kuhudumu
  rationale: “Kuhudumu” huonyesha utumishi rasmi wa kikuhani katika mazingira matakatifu.
- source_word: בַּקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Huhifadhi rejeo halisi la eneo takatifu, huku “katika patakatifu” likibaki chaguo linalowezekana.
theological_decisions:
- issue: Lugha ya urithi wa ukuhani
  choice: kuhani atakayechukua nafasi yake kutoka miongoni mwa wanawe
  alternative: kuhani aliye badala yake, mmoja wa wanawe
  rationale: Maneno haya yanaonyesha urithi ndani ya ukoo wa kikuhani bila kuingiza madai ya baadaye ya kimadhehebu.
- issue: Mahali pa ibada panapoonyeshwa na בַּקֹּדֶשׁ
  choice: mahali patakatifu
  alternative: katika patakatifu
  rationale: Tafsiri kuu inaeleweka kwa wasomaji wa kawaida na bado inaonyesha eneo maalumu la huduma ndani ya hema; tanbihi huhifadhi tafsiri fupi inayowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa msomaji wa kawaida, huku istilahi za kikuhani na za mahali pa ibada zikihifadhiwa kwa usahihi.
