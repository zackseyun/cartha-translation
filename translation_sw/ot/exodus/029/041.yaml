base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/041.yaml
  text: And you shall offer the second lamb at twilight[a]; you shall offer for it its grain offering and its drink offering, as in the morning, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: sw
  text: Mwana-kondoo wa pili utamtoa wakati wa machweo[a]; utamtoa pamoja na sadaka ya nafaka kama ya asubuhi na sadaka yake ya kinywaji. Iwe harufu ya kupendeza, sadaka ya moto[b] kwa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kati ya jioni mbili,” nahau inayoweza kumaanisha alasiri kuelekea jioni au wakati wa machweo.
    reason: lexical_alternative
  - marker: b
    text: Maana ya neno la Kiebrania si hakika; pia hutafsiriwa “sadaka ya chakula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: mwana-kondoo wa pili
  rationale: כֶּבֶשׂ humaanisha mwana-kondoo au kondoo mchanga wa kutolewa dhabihu; “wa pili” huhifadhi mpangilio unaofuata sadaka ya asubuhi.
- source_word: תַּעֲשֶׂה
  choice: utamtoa / utamtolea
  rationale: Ingawa kitenzi עשה kwa kawaida ni “kufanya,” katika muktadha wa dhabihu Kiswahili cha kawaida hutumia “kutoa sadaka”; muundo huu pia unaonyesha kwamba sadaka zinatolewa kwa ajili ya mwana-kondoo.
- source_word: בֵּין הָעַרְבָּיִם
  choice: wakati wa machweo
  rationale: Hii ni nahau yenye maana halisi “kati ya jioni mbili,” ikirejelea kipindi cha alasiri kuelekea jioni au machweo; tanbihi huhifadhi umbo la Kiebrania.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: sadaka yake ya nafaka ... kama ulivyofanya asubuhi
  rationale: מִנְחָה katika sheria za dhabihu ni sadaka ya nafaka. Kauli ya kulinganisha na asubuhi imewekwa kwa Kiswahili kinachoeleweka bila kupoteza ulinganifu huo.
- source_word: וּכְנִסְכָּהּ
  choice: sadaka yake ya kinywaji
  rationale: נֶסֶךְ ni sadaka ya kioevu inayomiminwa; “sadaka ya kinywaji” ni wazi na ya kawaida kuliko istilahi ya kitaalamu “libationi.”
- source_word: לְרֵיחַ נִיחֹחַ
  choice: iwe harufu ya kupendeza
  rationale: Huhifadhi sitiari ya fomula ya dhabihu, inayoonyesha sadaka inayokubalika, bila kuifafanua kupita kiasi.
- source_word: אִשֶּׁה
  choice: sadaka inayoteketezwa kwa moto
  rationale: Neno hili la ibada linahusishwa na sadaka itolewayo kwa moto. Tafsiri hii ni wazi na huhifadhi kipengele cha moto badala ya kukichukua kuwa “chakula” pekee.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kuwa “Yahwe,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Chanzo kinatumia jina maalumu la Mungu. “Yahwe” hulihifadhi kama jina na huepuka kulibadilisha kuwa cheo.
- issue: Maana ya אִשֶּׁה
  choice: sadaka inayoteketezwa kwa moto
  alternative: sadaka ya chakula
  rationale: Etimolojia na matumizi ya neno hili yamejadiliwa; hapa tafsiri ya jadi inayohusisha moto imewekwa katika matini, huku kutokuwepo kwa neno la kawaida la “chakula” katika Kiebrania kukizuia kisiletwe bila maelezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umerahisishwa kwa usomaji wa kawaida huku msamiati wa ibada—sadaka ya nafaka, sadaka ya kinywaji, na sadaka inayoteketezwa kwa moto—ukihifadhiwa.
