lexical_decisions:
- source_word: שָׁחַטְתָּ
  choice: utamchinja
  rationale: Kitenzi hiki humaanisha kuchinja mnyama; wakati ujao wa Kiswahili unaonyesha agizo linalopaswa kutekelezwa.
- source_word: הָאָיִל
  choice: huyo kondoo dume
  rationale: אָיִל hapa ni kondoo dume anayejulikana katika muktadha; 'huyo' huakisi kibainishi cha Kiebrania kwa njia ya asili.
- source_word: וְזָרַקְתָּ
  choice: na kuirusha
  rationale: זָרַק maana yake ya msingi ni kurusha; uteuzi huu unahifadhi kitendo halisi bila kukibadili kuwa istilahi maalumu zaidi kama 'kunyunyiza'.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: pande zote kwenye madhabahu
  rationale: Kirai kinaonyesha damu ikiwekwa dhidi ya/kwenye madhabahu kuizunguka; Kiswahili hiki ni cha kawaida na kinahifadhi wazo la kuzunguka pande zake zote.
