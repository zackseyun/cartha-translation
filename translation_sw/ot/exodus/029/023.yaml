base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/023.yaml
  text: and one loaf of bread[a], one cake of bread with oil, and one wafer, from the basket of unleavened bread that is before Yahweh.
translation:
  language: sw
  text: na mkate mmoja wa duara, keki moja ya mkate wa mafuta, na kaki moja, kutoka katika kikapu cha mikate isiyotiwa chachu kilicho mbele ya Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; jina hili pia huandikwa “Yehova.”'
    reason: Hufafanua konsonanti za jina la Mungu katika maandishi ya Kiebrania na kutaja tahajia nyingine inayojulikana.
lexical_decisions:
- source_word: כִּכַּר לֶחֶם
  choice: mkate mmoja
  rationale: כִּכָּר hapa ni kipande kizima cha mkate, huenda cha mviringo. Kiswahili cha kawaida ‘mkate mmoja’ ni cha asili na hakiongezi umbo ambalo halijaelezwa wazi katika muktadha huu.
- source_word: אַחַת / אֶחָד
  choice: mmoja / moja
  rationale: Idadi ‘moja’ imerudiwa kwa kila aina ya mkate ili kuhifadhi usahihi wa maagizo ya ibada.
- source_word: חַלַּת לֶחֶם שֶׁמֶן
  choice: andazi moja la mkate wenye mafuta
  rationale: חַלָּה ni aina ya mkate au keki, tofauti na כִּכָּר iliyotangulia. ‘Andazi’ ni neno lililozoeleka katika lugha ya Biblia kwa umbo hili la mkate; ‘wenye mafuta’ huhifadhi uhusiano wa maneno bila kuamua kimyakimya ikiwa mafuta yalichanganywa ndani au yalipakwa.
- source_word: רָקִיק
  choice: mkate mmoja mwembamba
  rationale: רָקִיק ni mkate mwembamba. Tafsiri hii inaeleweka kwa wasomaji wa sasa kuliko mkopo ‘kaki’ na inaonyesha sifa kuu ya chakula hicho.
- source_word: מִסַּל הַמַּצּוֹת
  choice: kutoka katika kikapu cha mikate isiyotiwa chachu
  rationale: מִן huonyesha chanzo, סַל ni kikapu, na מַצּוֹת ni mikate isiyotiwa chachu. Wingi ‘mikate’ unafaa kwa vitu kadhaa vilivyomo kikapuni.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: kilicho mbele za Yahwe
  rationale: ‘Mbele za’ huhifadhi maana ya mahali au uwepo wa ibada iliyo katika לִפְנֵי, badala ya kuongeza kitenzi kama ‘kilichowekwa.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti YHWH limetoholewa kwa tahajia ya kawaida ya Kiswahili ‘Yahwe,’ badala ya kubadilishwa na cheo ‘BWANA.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi יְהוָה, si cheo אֲדֹנָי. ‘Yahwe’ hulihifadhi kama jina huku tanbihi ikionyesha msingi wake wa Kiebrania na tahajia nyingine inayotumiwa.
- issue: Uhusiano wa mafuta na mkate katika לֶחֶם שֶׁמֶן
  choice: mkate wenye mafuta
  alternative: mkate uliochanganywa na mafuta; mkate uliopakwa mafuta
  rationale: Mfuatano wa Kiebrania unaonyesha mkate unaohusishwa na mafuta lakini katika mstari huu pekee hauelezi wazi namna mafuta yalivyotumiwa. ‘Wenye mafuta’ huhifadhi uwezekano huo bila kuamua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha na marudio ya ‘mmoja/moja’ yamehifadhiwa kwa usahihi wa maagizo ya ibada. Alama ya tanbihi [a] imewekwa baada ya ‘Yahwe,’ neno linalohusika moja kwa moja na tanbihi.
