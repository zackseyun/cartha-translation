base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/046.yaml
  text: And they shall know that I am Yahweh their God[a], who brought them out from the land of Egypt so that I might dwell among them[b]. I am Yahweh their God.
translation:
  language: sw
  text: Nao watajua kwamba mimi ni Yahweh, Mungu wao, niliyewatoa katika nchi ya Misri ili nikae katikati yao[a]. Mimi ni Yahweh, Mungu wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwao.” Kiebrania kwa maana ya moja kwa moja ni “katikati yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Nao watajua
  rationale: Muundo huu unaonyesha matokeo ya baadaye ya ahadi na maagizo yaliyotangulia. “Nao watajua” ni Kiswahili cha kawaida na huhifadhi uhusiano na muktadha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja badala ya kubadilishwa kuwa cheo, hivyo linahifadhiwa kama “Yahwe.”
- source_word: אֱלֹהֵיהֶם
  choice: Mungu wao
  rationale: Ingawa אֱלֹהִים ina umbo la wingi, hapa inamtaja Mungu mmoja wa Israeli, kama inavyoonyeshwa na jina Yahwe na muktadha wa agano.
- source_word: הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: niliyewatoa katika nchi ya Misri
  rationale: Kauli ya nafsi ya kwanza imehifadhiwa, na “kuwatoa katika nchi” ni usemi wa asili unaoonyesha walikotolewa.
- source_word: לְשָׁכְנִי
  choice: ili nikae
  rationale: 'Kiambishi לְ kwenye kitenzi-jina kinaonyesha kusudi: Mungu aliwatoa Misri kwa kusudi la kukaa kati yao.'
- source_word: בְתוֹכָם
  choice: katikati yao
  rationale: Tafsiri hii inakaribia maana halisi ya usemi wa Kiebrania na inaeleweka kwa urahisi katika Kiswahili cha sasa.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahwe” ni unukuzi unaolenga kuwakilisha jina hilo bila kulibadilisha kuwa “Bwana.”
- issue: Maana ya kusudi katika לְשָׁכְנִי
  choice: ili nikae katikati yao
  alternative: nikakae katikati yao
  rationale: Tafsiri yenye “ili” inaweka wazi nguvu ya kusudi iliyopo katika muundo wa Kiebrania bila kuongeza hitimisho la kiteolojia lisilokuwamo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Marudio ya kauli ya agano mwishoni yamehifadhiwa.
