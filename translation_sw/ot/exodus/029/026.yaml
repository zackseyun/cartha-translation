base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/026.yaml
  text: Then you shall take the breast from the ram of ordination that is for Aaron[a], and you shall wave it as a wave offering before Yahweh; and it shall be your portion.
translation:
  language: sw
  text: Kisha utatwaa kidari cha kondoo dume wa kuwekwa wakfu, wa Aroni[a], nawe utakipunga kama sadaka ya kupunga mbele za Yahweh; nacho kitakuwa fungu lako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wa kuwekwa katika ukuhani.” Neno hili la kiibada la Kiebrania humaanisha kondoo dume aliyetumiwa katika ibada ya kumweka Aroni katika ukuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָזֶה
  choice: kidari
  rationale: Katika sheria za dhabihu, neno hili linamaanisha sehemu ya mbele ya kifua cha mnyama; “kidari” ni istilahi ya kawaida ya kibiblia kwa sehemu hii ya sadaka.
- source_word: אֵיל
  choice: kondoo dume
  rationale: Hii ndiyo tafsiri ya asili na mahususi ya אַיִל katika muktadha wa dhabihu.
- source_word: הַמִּלֻּאִים
  choice: wa kuwekwa wakfu
  rationale: Ni istilahi ya kiibada kwa tendo la kumweka Aroni katika huduma ya ukuhani. “Kuwekwa wakfu” ni wazi na yenye hadhi, bila kuingiza miundo ya baadaye ya madhehebu.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: aliye kwa ajili ya Aroni
  rationale: Inahifadhi uhusiano wa kondoo huyo na Aroni bila kuufanya kwa lazima kuwa umiliki wake.
- source_word: וְהֵנַפְתָּ אֹתוֹ תְּנוּפָה
  choice: utakipunga kama sadaka ya kupunga
  rationale: Inahifadhi uradidi wa kitenzi na nomino katika usemi maalumu wa ibada huku ikieleweka kwa msomaji wa kawaida.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: “Mbele za” ni usemi wa kawaida wa Kiswahili katika muktadha wa ibada na huonyesha tendo kufanywa katika uwepo wa Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Inawakilisha moja kwa moja jina la agano lililoandikwa katika Kiebrania badala ya kulibadili kuwa cheo.
- source_word: וְהָיָה לְךָ לְמָנָה
  choice: nacho kitakuwa fungu lako
  rationale: מָנָה ni sehemu iliyogawiwa; “fungu lako” ni tafsiri fupi, ya asili, na inayofaa muktadha wa mgao wa kikuhani.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi יהוה; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya istilahi ya kiibada הַמִּלֻּאִים
  choice: kuwekwa wakfu
  alternative: kuwekwa katika ukuhani
  rationale: Muktadha unahusu kumwingiza Aroni katika huduma ya ukuhani. Tafsiri kuu ni ya asili kwa Kiswahili, huku tanbihi ikieleza maana mahususi ya ibada hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maagizo umehifadhiwa kwa vitenzi vya wakati ujao; istilahi za sadaka zimewekwa wazi bila kurahisisha mno lugha ya kiibada.
