base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/044.yaml
  text: And I will consecrate the tent of meeting and the altar[b][a]; and I will consecrate Aaron and his sons to serve me as priests.
translation:
  language: sw
  text: Nitatakasa[a] Hema la Kukutania na madhabahu; nami nitawatakasa Aroni na wanawe ili wanitumikie kama makuhani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitaliweka wakfu” au “nitalifanya kuwa takatifu.” Ndivyo pia kwa kitenzi “nitawatakasa” baadaye katika mstari huu.
    reason: lexical_alternative
  - marker: b
    text: Kwa halisi, Kiebrania husema, “kufanya huduma ya kikuhani kwa ajili yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי / אֲקַדֵּשׁ
  choice: nitalitakasa / nitawatakasa
  rationale: Kitenzi קדשׁ katika piel humaanisha kutenga kuwa kitakatifu au kuweka wakfu kwa matumizi matakatifu. “Takasa” ni neno la kawaida na lenye heshima katika muktadha huu, huku urudiaji wake ukihifadhiwa katika vifungu vyote viwili.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni jina linaloeleweka kwa mahali pa kukutana palipopangwa kati ya Mungu na watu wake; muundo huu pia ni wa kawaida katika Kiswahili cha Biblia.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Ni istilahi ya kawaida ya Kiswahili kwa mahali pa kutolea dhabihu.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Kiebrania kinataja wana wa kiume wa Aroni, si watoto wake kwa ujumla; “wanawe” huhifadhi maana hiyo.
- source_word: לְכַהֵן לִי
  choice: ili wanitumikie kama makuhani
  rationale: Kitenzi כהן kinaeleza kufanya huduma ya kikuhani, na kiambishi “ni-” katika “wanitumikie” huhifadhi wazo la huduma inayotolewa kwa Mungu.
theological_decisions:
- issue: Lugha ya utakaso katika ibada
  choice: takasa
  alternative: weka wakfu / fanya kuwa kitakatifu
  rationale: Muktadha unahusu kutengwa kwa hema, madhabahu, na makuhani kwa matumizi na huduma takatifu. “Takasa” huwasilisha maana hiyo bila kuongeza mafundisho yasiyo katika maandishi.
- issue: Rejeo la kijinsia la ukuhani
  choice: wanawe
  alternative: watoto wake
  rationale: Maandishi ya Kiebrania yanataja wana wa kiume wa Aroni hasa; tafsiri haipaswi kulifanya rejeo hilo kuwa la jumla.
- issue: Asili ya huduma ya Aroni na wanawe
  choice: wanitumikie kama makuhani
  alternative: wafanye kazi ya ukuhani kwa ajili yangu
  rationale: 'Chaguo hili ni la asili katika Kiswahili na huhifadhi yote mawili: wajibu wa kikuhani na ukweli kwamba huduma hiyo inaelekezwa kwa Mungu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hema la Kukutania” na “madhabahu” ni istilahi zinazotambulika kwa urahisi. Muundo wa sentensi umefanywa wa asili bila kuondoa urudiaji wa kitenzi קדשׁ.
