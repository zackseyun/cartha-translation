base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/039.yaml
  text: You shall offer the one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: sw
  text: Mwana-kondoo mmoja utamtoa kama sadaka asubuhi, na mwana-kondoo wa pili utamtoa kama sadaka kati ya jioni mbili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kati ya jioni mbili,” usemi wa jadi ambao mara nyingi hueleweka kuwa “wakati wa machweo” au kipindi kati ya alasiri na kutua kwa jua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּבֶשׂ
  choice: mwana-kondoo
  rationale: Katika maagizo ya dhabihu, neno hili humaanisha kondoo mchanga anayefaa kutolewa kama sadaka; “mwana-kondoo” ni tafsiri ya kawaida na bayana.
- source_word: הָאֶחָד
  choice: mmoja
  rationale: Huhifadhi maana ya msingi ya Kiebrania, “mmoja,” huku ulinganifu wake na “wa pili” ukionyesha mfuatano.
- source_word: תַּעֲשֶׂה
  choice: utamtoa kama sadaka
  rationale: Ingawa kitenzi kwa kawaida humaanisha “kufanya,” katika muktadha huu wa ibada humaanisha kutekeleza tendo la kutoa dhabihu. Tafsiri hii ni ya asili na inaweka wazi tendo linalokusudiwa bila kusema kwamba ni kuchinja pekee.
- source_word: בַבֹּקֶר
  choice: asubuhi
  rationale: Hii ndiyo njia ya kawaida na ya asili ya kueleza wakati huo katika Kiswahili.
- source_word: הַשֵּׁנִי
  choice: wa pili
  rationale: Hutoa moja kwa moja maana ya nambari ya mpangilio na kudumisha mfuatano wa sadaka hizo mbili.
- source_word: בֵּין הָעַרְבָּיִם
  choice: kati ya jioni mbili
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania, ambao maana yake kamili ya wakati imejadiliwa, badala ya kuufanya kimya kimya kuwa wakati mmoja maalumu.
