base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/003.yaml
  text: You shall put them into one basket[a], and you shall bring them near in the basket[b], along with the bull and the two rams.
translation:
  language: sw
  text: Utaweka vitu hivyo katika kikapu kimoja[a], kisha utavileta karibu vikiwa ndani ya kikapu[b], pamoja na fahali na kondoo dume wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya kikapu kimoja.” Kihusishi cha Kiebrania kwa kawaida humaanisha “juu ya,” lakini katika muktadha huu wa kuweka vitu kwenye chombo, maana ni kwamba vinawekwa katika kikapu kimoja.
    reason: lexical_alternative
  - marker: b
    text: Au, “utaviwasilisha” au “utavitoa kuwa dhabihu.” Kitenzi cha Kiebrania ni istilahi ya kawaida ya dhabihu yenye maana ya msingi ya “kuleta karibu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Utaweka
  rationale: Kitenzi נתן kinaweza kumaanisha ‘kutoa,’ ‘kuweka,’ au ‘kutia.’ Katika maagizo haya ya kuweka vyakula kwenye chombo, ‘utaweka’ ni Kiswahili cha kawaida na kinachofaa.
- source_word: אוֹתָם
  choice: vitu hivyo / utavileta
  rationale: Kiwakilishi hiki kinarejelea mikate na maandazi yaliyotajwa katika mstari uliotangulia. ‘Vitu hivyo’ huweka rejeo hilo wazi kwa Kiswahili bila kurudia orodha yote.
- source_word: עַל סַל אֶחָד
  choice: katika kikapu kimoja
  rationale: Ingawa עַל kwa kawaida ni ‘juu ya,’ pamoja na kitenzi cha kuweka na nomino ya chombo, maana ya muktadha ni kuweka vitu ndani ya kikapu kimoja.
- source_word: וְהִקְרַבְתָּ
  choice: kisha utavileta karibu
  rationale: הקריב ni istilahi ya ibada yenye maana ya ‘kuleta karibu,’ ‘kuwasilisha,’ au ‘kutoa.’ Tafsiri hii huhifadhi picha ya msingi na kutoamua mapema hatua maalumu ya dhabihu.
- source_word: בַּסָּל
  choice: vikiwa ndani ya kikapu
  rationale: בַּסָּל inaonyesha kwamba vitu hivyo vinaletwa vikiwa ndani ya kikapu. Muundo huu ni wazi na wa kawaida kwa Kiswahili.
- source_word: וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  choice: pamoja na fahali na wale kondoo dume wawili
  rationale: Viashiria vya yambwa vilivyorudiwa vinaunganisha fahali na kondoo dume wawili kama vitu vingine vinavyoletwa karibu. ‘Pamoja na’ huonyesha uhusiano huo kwa uwazi.
- source_word: הַפָּר
  choice: fahali
  rationale: פַּר hapa humaanisha fahali; hakuna ulazima wa kuongeza ‘mchanga’ katika matini kuu.
- source_word: שְׁנֵי הָאֵילִם
  choice: wale kondoo dume wawili
  rationale: Muundo huu ni nambari mbili pamoja na nomino bayana. ‘Wale’ hurejelea kondoo dume wawili waliokwisha kutajwa katika muktadha.
theological_decisions:
- issue: Maana ya istilahi ya dhabihu הקריב
  choice: kuleta karibu
  alternative: kuwasilisha; kutoa kuwa dhabihu
  rationale: ‘Kuleta karibu’ huhifadhi maana ya msingi ya Kiebrania na mvutano wa istilahi ya kiibada, bila kuifanya kwa lazima iwe hatua kamili ya kutoa dhabihu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kondoo dume’ limetumiwa badala ya msamiati usioenea; ‘vikiwa ndani ya kikapu’ huondoa utata wa uhusiano wa kikapu huku tanbihi zikihifadhi mbadala za Kiebrania.
