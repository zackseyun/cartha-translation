  text: וּ/פַ֨ר חַטָּ֜את תַּעֲשֶׂ֤ה לַ/יּוֹם֙ עַל הַ/כִּפֻּרִ֔ים וְ/חִטֵּאתָ֙ עַל הַ/מִּזְבֵּ֔חַ בְּ/כַפֶּרְ/ךָ֖ עָלָ֑י/ו וּ/מָֽשַׁחְתָּ֥ אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/036.yaml
  text: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
translation:
  language: sw
  text: Nawe kila siku utamtoa fahali kuwa sadaka ya dhambi kwa ajili ya upatanisho.[a] Utaitakasa madhabahu unapofanya upatanisho kwa ajili yake, kisha utaipaka mafuta ili kuiweka wakfu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha “dhambi,” au katika muktadha wa dhabihu, sadaka inayotumika kutakasa kutokana na dhambi au unajisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַר
  choice: fahali
  rationale: Neno hili humaanisha fahali; umri mdogo haujaainishwa wazi katika muktadha huu.
- source_word: חַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika muktadha wa dhabihu, neno hili linataja sadaka inayohusiana na dhambi na utakaso. Usemi huu unaeleweka kwa urahisi, huku maana mbadala ya sadaka ya utakaso ikihifadhiwa katika tanbihi.
- source_word: לַיּוֹם
  choice: kila siku
  rationale: Muktadha wa ibada inayorudiwa unaonyesha tendo linalofanywa siku baada ya siku.
- source_word: עַל הַכִּפֻּרִים
  choice: kwa ajili ya upatanisho
  rationale: Wingi wa Kiebrania unahusu taratibu za upatanisho au utakaso; Kiswahili cha kawaida hutumia vizuri nomino ya umoja hapa.
- source_word: וְחִטֵּאתָ
  choice: utaitakasa
  rationale: Katika matumizi ya kiibada, kitenzi hiki humaanisha kuondoa unajisi wa kiibada katika kitu kitakatifu; hakimaanishi kwamba madhabahu yenyewe ilitenda dhambi.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa madhabahu katika muktadha wa Maskani.
- source_word: בְּכַפֶּרְךָ עָלָיו
  choice: unapofanya upatanisho kwa ajili yake
  rationale: Kiambishi ב pamoja na kitenzi-jina kinaweza kuwa cha wakati au cha njia. Tafsiri ya wakati ni ya asili hapa, na kiwakilishi kinaelekezwa kwa madhabahu.
- source_word: וּמָשַׁחְתָּ
  choice: utaipaka mafuta
  rationale: Katika Kiswahili cha kawaida, kupaka mafuta hueleza wazi tendo la kiibada la kutiwa mafuta bila kupoteza maana yake.
- source_word: לְקַדְּשׁוֹ
  choice: ili kuiweka wakfu
  rationale: Kitenzi hiki hapa humaanisha kuitenga madhabahu iwe takatifu kwa matumizi ya ibada.
theological_decisions:
- issue: Kutafsiri lugha ya utakaso na upatanisho wa kiibada bila kuingiza mafundisho ya baadaye
  choice: Kutumia “sadaka ya dhambi,” “itakasa,” na “kufanya upatanisho” katika maana ya ibada ya Maskani
  alternative: Kutumia “sadaka ya utakaso” na kueleza tendo hilo kama kuondoa unajisi
  rationale: Aya inahusu kuwekwa wakfu kwa madhabahu kwa njia ya ibada za dhabihu. Tafsiri inadumisha makundi ya maana ya Kiebrania na kuweka wazi kwamba madhabahu inatakaswa kiibada, si kusamehewa kosa la kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Kuiweka wakfu” imetumiwa badala ya istilahi nzito zaidi, na “kuipaka mafuta” linaeleza kwa uwazi tendo la kutiwa mafuta.
