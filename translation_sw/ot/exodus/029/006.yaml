  text: Na utaweka kilemba kichwani mwake, na utaweka taji takatifu[a] juu ya kilemba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “taji takatifu” linaweza kutafsiriwa “pambo takatifu la kichwani.” Neno la Kiebrania nezer linaweza kumaanisha taji au pambo la kichwani linalohusishwa na kuwekwa wakfu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Nawe utaweka
  rationale: Kitenzi שׂים humaanisha kuweka au kutia. Katika mfululizo huu wa maagizo, wakati ujao wa Kiswahili unaonyesha tendo linalopaswa kufanywa, huku kiunganishi kikihifadhiwa kwa “Nawe.”
- source_word: הַמִּצְנֶפֶת
  choice: kilemba
  rationale: מִצְנֶפֶת ni kitambaa maalumu cha kichwani cha kuhani. “Kilemba” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa kuliko istilahi za kale za kikanisa.
- source_word: עַל רֹאשׁוֹ
  choice: kichwani mwake
  rationale: Huu ni usemi wa asili wa Kiswahili unaoonyesha kwa uwazi mahali kilemba kinapowekwa.
- source_word: וְנָתַתָּ
  choice: kisha utaweka
  rationale: נתן hapa ina maana ya kuweka kitu mahali. “Kisha” linaonyesha hatua inayofuata ya utaratibu wa kumvika kuhani bila kubadili maana ya mfuatano wa Kiebrania.
- source_word: אֵת
  choice: '[halijatafsiriwa kivyake]'
  rationale: Ni kiashiria cha yambwa mahsusi katika Kiebrania na halina neno la moja kwa moja linalohitajika katika Kiswahili.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: taji takatifu[a]
  rationale: נֵזֶר inaweza kumaanisha taji au pambo la kichwani linaloashiria kuwekwa wakfu. “Taji takatifu” ni wazi na la asili kwa msomaji wa Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana ya pambo maalumu la kitambaa cha kichwani.
- source_word: עַל הַמִּצְנָפֶת
  choice: juu ya kilemba
  rationale: Kirai hiki kinaonyesha kwamba taji au pambo hilo linawekwa kwenye kilemba chenyewe; “juu ya” ni usemi wazi wa Kiswahili katika muktadha huu.
