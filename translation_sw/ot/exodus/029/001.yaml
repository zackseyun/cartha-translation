base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/001.yaml
  text: 'And this is the thing that you shall do for them to consecrate them to serve as priests for me: take one bull from the herd and two unblemished rams[a][b].'
translation:
  language: sw
  text: 'Na jambo hili ndilo utakalowafanyia ili kuwaweka wakfu kwa ajili ya kunitumikia kama makuhani: chukua fahali mmoja kutoka kundini na kondoo dume wawili wasio na kasoro[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fahali mmoja mchanga.” Kiebrania kinasema kihalisi, “fahali mmoja, mwana wa kundi la ng’ombe,” usemi unaomaanisha mnyama wa jamii ya ng’ombe kutoka kundini.
    reason: lexical_alternative
  - marker: b
    text: Au, “wasio na dosari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: jambo hili
  rationale: Katika muktadha huu wa maagizo ya ibada, דָּבָר hurejelea jambo au utaratibu unaofuata; “jambo hili” ni la kawaida na lenye heshima bila kufafanua zaidi ya Kiebrania.
- source_word: תַּעֲשֶׂה לָהֶם
  choice: utakalowafanyia
  rationale: Kauli ya wakati usiotimilika ina nguvu ya agizo, na kiambishi לָהֶם kinaonyesha kuwa tendo hilo linafanywa kwa ajili yao au juu yao.
- source_word: לְקַדֵּשׁ אֹתָם
  choice: ili kuwaweka wakfu
  rationale: Katika muktadha wa ukuhani, קדשׁ humaanisha kuwatenga kwa huduma takatifu; “kuwaweka wakfu” ni Kiswahili cha kawaida cha ibada.
- source_word: לְכַהֵן לִי
  choice: wanitumikie kama makuhani
  rationale: Kitenzi כהן kinaonyesha kutenda kazi ya ukuhani; tafsiri hii huhifadhi jukumu hilo pamoja na mwelekeo wa huduma kwa Mungu.
- source_word: לְקַח
  choice: chukua
  rationale: Ni amri ya moja kwa moja ya kuchukua wanyama wanaohitajika.
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: fahali mmoja kutoka kundini
  rationale: פַּר ni fahali, na בֶּן בָּקָר ni usemi unaomtambulisha kama mnyama wa jamii ya ng’ombe kutoka kundini; umri mdogo unawezekana lakini si lazima uwe katika matini kuu.
- source_word: אֵילִם שְׁנַיִם
  choice: kondoo dume wawili
  rationale: אֵיל humaanisha kondoo dume, na idadi ya wawili imetajwa wazi.
- source_word: תְּמִימִם
  choice: wasio na kasoro
  rationale: Katika muktadha wa dhabihu, neno hili hueleza wanyama wasiokuwa na kilema au dosari inayowafanya wasifae kutolewa.
theological_decisions:
- issue: Lugha ya kazi ya ukuhani
  choice: wanitumikie kama makuhani
  alternative: wanifanyie kazi ya ukuhani
  rationale: Chaguo hili linaonyesha wazi kwamba wanatenda katika cheo cha ukuhani kwa ajili ya Mungu, bila kuingiza dhana za baadaye za taasisi za kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa agizo umehifadhiwa, huku istilahi za ibada zikitolewa kwa maneno yanayoeleweka kwa wasomaji wa kawaida.
