  text: And I will dwell among the sons of Israel[c][b][a], and I will be their God.
translation:
  language: sw
  text: Nami nitakaa kati ya wana wa Israeli,[a][b] nami nitakuwa Mungu wao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katikati ya wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana wa Israeli”; kwa kawaida pia hutafsiriwa “watoto wa Israeli.”'
