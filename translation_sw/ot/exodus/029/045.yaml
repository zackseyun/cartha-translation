    text: Au “nitakuwa Mungu kwao.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: Nami nitakaa
  rationale: Kitenzi שׁכן kina maana ya kukaa au kufanya makao mahali. “Nitakaa” ni Kiswahili cha kawaida na chenye heshima, nacho kinadumisha wazo la uwepo wa Mungu bila kuongeza tafsiri ya “maskani.”
- source_word: בְּתוֹךְ
  choice: kati ya
  rationale: בְּתוֹךְ ikitumiwa kuhusu kundi la watu huonyesha kuwapo ndani ya jamii hiyo. “Kati ya” ni usemi wa asili wa Kiswahili na pia unaweza kubeba maana ya “katikati ya.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Kiebrania kinasema kihalisi “wana wa Israeli.” Tafsiri hii inadumisha nahau ya kifamilia na umbo la kiume la matini chanzi; “Waisraeli” ni laini zaidi lakini huondoa nahau hiyo.
- source_word: וְהָיִיתִי
  choice: nami nitakuwa
  rationale: היה hapa inaeleza uhusiano wa agano, si lazima mabadiliko ya hali. “Nitakuwa” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: לָהֶם
  choice: wao
  rationale: Ingawa muundo wa Kiebrania ni kihalisi “kwao,” Kiswahili cha kawaida katika kauli hii ya agano ni “Mungu wao,” kinachohifadhi nguvu ya uhusiano.
- source_word: לֵאלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu, msemaji wa kimungu anaahidi uhusiano na Israeli; kwa hiyo אֱלֹהִים ni “Mungu,” wala si “mungu” asiyeainishwa.
theological_decisions:
- issue: Uwasilishaji wa kauli ya agano
  choice: nitakuwa Mungu wao
  alternative: nitakuwa Mungu kwao
  rationale: “Nitakuwa Mungu wao” ni Kiswahili cha asili kinachohifadhi maana ya uhusiano wa agano. Tanbihi inadumisha muundo mbadala wa karibu zaidi na Kiebrania.
- issue: Usemi wa kijinsia kuhusu kundi la watu
  choice: wana wa Israeli
  alternative: watoto wa Israeli; Waisraeli
  rationale: Matini chanzi inatumia umbo la kiume la wingi “wana wa.” Tafsiri kuu inalihifadhi bila kulipanua kimafundisho, huku tanbihi ikionyesha usemi mwingine wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nami” huunganisha sentensi kwa ulaini, “nitakaa kati ya” ni ya kawaida bila kupoteza uzito wa uwepo wa Mungu, na alama zote za tanbihi zimewekwa kwenye matini kuu karibu na vifungu vinavyohusika.
