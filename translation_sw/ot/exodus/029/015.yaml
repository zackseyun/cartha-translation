    text: 'Kiebrania: “kondoo dume yule mmoja,” likimtambulisha kondoo huyu tofauti na kondoo mwingine katika ibada ya kuwaweka wakfu; baadhi ya tafsiri husema “kondoo dume wa kwanza.”'
