lexical_decisions:
- source_word: וְ/אֶת
  choice: Kisha
  rationale: Kiunganishi pamoja na kiashiria cha yambwa kinaanzisha hatua inayofuata katika mfululizo wa maagizo; “Kisha” ni Kiswahili cha kawaida kinachoonyesha mwendelezo huo.
- source_word: הָ/אַיִל
  choice: kondoo dume
  rationale: אַיִל humaanisha kondoo dume, neno sahihi na linaloeleweka katika muktadha wa dhabihu.
- source_word: הָ/אֶחָד
  choice: yule mmoja
  rationale: Kiebrania kinasema kihalisi “kondoo dume yule mmoja,” kikimtambulisha huyu tofauti na kondoo mwingine katika ibada; tafsiri hii haiibadili kimyakimya kuwa namba ya mpangilio “wa kwanza.”
- source_word: תִּקָּח
  choice: utamtwaa
  rationale: Kitenzi ni nafsi ya pili umoja wa kiume katika muktadha wa agizo kwa Musa. “Utamtwaa” huhifadhi uzito wa maagizo na huambatana kwa kawaida na yambwa hai.
- source_word: וְ/סָמְכוּ
  choice: wataweka
  rationale: Katika sheria za dhabihu, סמך hueleza tendo la kiibada la kuweka au kuegemeza mikono juu ya mnyama. “Wataweka mikono” ni wazi na ya asili bila kuongeza maelezo ya kiteolojia.
- source_word: אַהֲרֹן וּ/בָנָי/ו
  choice: Aroni na wanawe
  rationale: בנים hapa ni wana wa kiume wa Aroni wanaowekwa wakfu kwa ukuhani; “wanawe” ni sahihi na fasaha.
- source_word: אֶת יְדֵי/הֶם
  choice: mikono yao
  rationale: Wingi wa Kiebrania umehifadhiwa, na kauli hii ni ya kawaida katika Kiswahili.
- source_word: עַל רֹאשׁ
  choice: juu ya kichwa cha
  rationale: Kirai hiki kinaonyesha mahali kwa uwazi; “juu ya kichwa cha” ni tafsiri ya kawaida na sahihi.
- source_word: הָ/אָיִל
  choice: kondoo huyo
  rationale: Nomino inayorudiwa imetafsiriwa kwa “kondoo huyo” ili kurejelea wazi mnyama yuleyule bila Kiswahili kuwa kizito; jinsia tayari imebainishwa katika kutajwa kwa kwanza.
theological_decisions:
- issue: Istilahi ya kuweka mikono katika ibada ya dhabihu
  choice: wataweka mikono yao juu ya kichwa cha kondoo huyo
  alternative: wataegemeza mikono yao juu ya kichwa cha kondoo huyo
  rationale: Kitenzi cha Kiebrania kinaweza kudokeza kuegemeza au kushinikiza, lakini hapa kinataja tendo maalumu la kiibada. “Kuweka mikono” hulieleza kwa kawaida bila kuingiza madai kuhusu maana yake ya kiteolojia ambayo aya yenyewe haitamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kutwaa” hudumisha toni ya maagizo ya kiibada; “yule mmoja” pamoja na tanbihi huhifadhi upekee na utata halisi wa הָאֶחָד.
