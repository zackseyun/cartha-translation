base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/042.yaml
  text: It shall be a regular burnt offering throughout your generations at the entrance of the tent of meeting before Yahweh[a], where I will meet with you[b], to speak to you there.
translation:
  language: sw
  text: Sadaka hii ya kuteketezwa itatolewa kwa ukawaida[a] katika vizazi vyenu vyote, kwenye mlango wa Hema la Kukutania mbele ya Yahweh, mahali ambapo nitakutana nanyi[b] ili niseme nawe huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “daima” au “kwa kuendelea.”
    reason: Neno תָּמִיד linaweza kusisitiza mwendelezo au udumishaji wa utoaji wa sadaka hii.
  - marker: b
    text: Kiebrania kinatumia wingi katika “nanyi,” kisha umoja katika “nawe,” huenda likitofautisha watu kwa ujumla na Musa hasa.
    reason: Kuhifadhi na kufafanua mabadiliko halisi ya idadi katika viwakilishi vya Kiebrania.
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: sadaka hii ya kuteketezwa itatolewa kwa ukawaida
  rationale: עֹלָה ni sadaka inayoteketezwa kabisa, na תָּמִיד hapa inaonyesha utoaji wake wa mara kwa mara kulingana na utaratibu uliowekwa. Muundo huu ni wa kawaida katika Kiswahili na haudokezi kwamba tendo la kuteketeza haliishi kamwe.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Usemi huu unaonyesha kwamba agizo hilo linaendelea kuwahusu vizazi vinavyofuatana.
- source_word: פֶּתַח
  choice: kwenye mlango
  rationale: Neno hili linamaanisha sehemu ya kuingilia au uwazi wa kuingilia; “kwenye mlango” ni usemi wa asili wa mahali katika Kiswahili.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni jina la hema ambako Yahweh hukutana na watu wake au mwakilishi wao. “Hema la kukutania” linaonyesha kazi hiyo kwa Kiswahili kinachoeleweka.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: לִפְנֵי katika muktadha huu ina maana ya kuwa mbele au katika uwepo wa Yahweh; “mbele za” ni usemi wa kawaida wa Kiswahili.
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  choice: mahali ambapo nitakutana nanyi
  rationale: Niphal ya יעד ina maana ya kukutana kwa miadi. “Mahali ambapo” inawakilisha אֲשֶׁר pamoja na שָׁמָּה bila kurudia “huko” kwa namna isiyo ya asili.
- source_word: לְדַבֵּר אֵלֶיךָ שָׁם
  choice: ili niseme nawe huko
  rationale: Infinitivu inaonyesha kusudi la kukutana huko. “Nawe” ni umoja, kama אֵלֶיךָ, na hivyo inahifadhi tofauti na “nanyi” ya awali.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova au BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano יהוה. “Yahweh” linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Mabadiliko ya idadi katika viwakilishi
  choice: “nanyi” kwa wingi, kisha “nawe” kwa umoja
  alternative: Kufanya viwakilishi vyote viwe vya wingi au vyote viwe vya umoja
  rationale: Kiebrania kinabadilika kutoka לָכֶם, wingi, hadi אֵלֶיךָ, umoja. Tafsiri inahifadhi mabadiliko hayo, ambayo huenda yanatofautisha jumuiya pana na Musa anayesemeshwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Hema la kukutania” na “sadaka ya kuteketezwa” ni istilahi wazi za muktadha wa ibada. Muundo umehifadhi tofauti ya wingi na umoja bila kuifanya sentensi kuwa nzito.
