base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/005.yaml
  text: Then you shall take the garments and clothe Aaron with the tunic[a], the robe of the ephod, the ephod, and the breastpiece[b], and you shall skillfully fasten it on him with the woven band of the ephod.
translation:
  language: sw
  text: Kisha utayachukua mavazi hayo na kumvika Haruni kanzu, joho la efodi, efodi, na kifaa cha kifuani[a]; nawe utaifunga mwilini mwake[b] kwa ukanda uliosukwa wa efodi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mara nyingi neno la Kiebrania limetafsiriwa “bamba la kifuani.” Hata hivyo, lina maana pana zaidi ya kifaa kilichovaliwa kifuani; kwa hiyo hapa limetafsiriwa “kifaa cha kifuani.”
    reason: lexical_alternative
  - marker: b
    text: Au “utamkaza nayo.” Kitenzi cha Kiebrania ni adimu na huenda kikasisitiza kuifunga au kuikaza efodi mwilini mwa Haruni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ אֶת־הַבְּגָדִים
  choice: Kisha utayachukua mavazi hayo
  rationale: Waw pamoja na kitenzi cha wakati timilifu katika mfululizo wa maagizo inaonyesha hatua inayofuata; “Kisha” ni ya kawaida katika Kiswahili. “Mavazi hayo” huonyesha kuwa ni mavazi yaliyotajwa tayari bila kuingiza istilahi ya baadaye ya kikanisa.
- source_word: וְהִלְבַּשְׁתָּ אֶת־אַהֲרֹן
  choice: na kumvika Haruni
  rationale: Hiphil ya לבש ina maana ya kumsababisha mtu avae; “kumvika” huwasilisha maana hiyo kwa ufupi na kwa kawaida.
- source_word: הַכֻּתֹּנֶת
  choice: kanzu
  rationale: כֻּתֹּנֶת ni vazi la msingi lililovaliwa karibu na mwili. “Kanzu” ni neno la Kiswahili linaloeleweka kwa vazi refu la aina hii, ingawa halidai kufanana kabisa na kanzu ya kisasa.
- source_word: מְעִיל הָאֵפֹד
  choice: joho la efodi
  rationale: Muundo wa Kiebrania unataja joho linalohusishwa na efodi; tafsiri hii inabaki karibu na muundo huo bila kuongeza waziwazi kuwa lilivaliwa chini yake.
- source_word: הָאֵפֹד
  choice: efodi
  rationale: אֵפֹד ni jina maalumu la vazi au kifaa cha kikuhani lisilo na kisawe kamili cha Kiswahili; umbo la kutoholewa huepuka maelezo yanayoweza kupotosha.
- source_word: הַחֹשֶׁן
  choice: kifaa cha kifuani
  rationale: חֹשֶׁן hurejelea kitu maalumu kilichovaliwa kifuani na kuunganishwa na efodi. “Kifaa cha kifuani” ni pana kuliko “bamba la kifuani,” ambalo lingeweza kudokeza silaha, na kuliko “kifuko,” ambalo lingeamua umbo lake kwa nguvu zaidi.
- source_word: וְאָפַדְתָּ לוֹ
  choice: nawe utaifunga mwilini mwake
  rationale: Kitenzi אפד ni adimu na kinahusiana na kuivika au kuikaza efodi. “Utaifunga mwilini mwake” huonyesha kitendo cha kuiweka salama kwa Haruni huku tanbihi ikihifadhi uwezekano wa “kumkaza kwa hiyo.” Kiwakilishi “i” kinarejelea efodi.
- source_word: בְּחֵשֶׁב הָאֵפֹד
  choice: kwa ukanda uliosukwa wa efodi
  rationale: חֵשֶׁב hapa ni ukanda uliotengenezwa kwa kazi ya ustadi na unaohusiana na efodi. “Ukanda uliosukwa” ni halisi, unaeleweka, na hauongezi mapambo yasiyotajwa moja kwa moja.
