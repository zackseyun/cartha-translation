base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/013.yaml
  text: Then you shall take all the fat that covers the entrails[a], the lobe on the liver, the two kidneys, and the fat that is on them, and you shall burn them on the altar.
translation:
  language: sw
  text: Kisha utachukua mafuta yote yanayofunika viungo vya ndani, sehemu iliyoshikamana na ini[a], figo zote mbili, pamoja na mafuta yaliyo juu ya figo hizo, nawe utaviteketeza juu ya madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kipande cha ini.” Neno la Kiebrania linataja sehemu fulani inayohusiana na ini, lakini utambulisho wake kamili wa kianatomia hauna uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kisha utachukua
  rationale: Muundo wa kitenzi katika mfululizo wa maagizo una nguvu ya amri ya utaratibu; wakati ujao wa Kiswahili ni wa asili katika mtindo huu wa sheria na maagizo.
- source_word: כָּל הַחֵלֶב
  choice: mafuta yote
  rationale: חֵלֶב hapa ni sehemu za mafuta za mnyama wa dhabihu; “mafuta” ni neno wazi na la kawaida katika Kiswahili.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: yanayofunika viungo vya ndani
  rationale: קֶרֶב katika muktadha huu hurejelea sehemu au viungo vilivyo ndani ya tumbo la mnyama. Usemi huu ni wa kueleweka na hauzuii maana kwenye utumbo pekee.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: sehemu iliyoshikamana na ini[a]
  rationale: Neno יוֹתֶרֶת ni istilahi tata ya anatomia kuhusu sehemu inayohusiana na ini. Tafsiri hii huhifadhi uhusiano huo bila kudai kwa uhakika kwamba ni tundu fulani la ini.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: figo zote mbili
  rationale: Ni rejeo la moja kwa moja kwa figo mbili; “zote mbili” ni Kiswahili cha asili katika orodha hii.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: mafuta yaliyo juu yake
  rationale: Kiwakilishi cha Kiebrania kinarejelea figo; kwa Kiswahili, “yake” baada ya nomino ya pamoja “figo” ni ya asili na hufuata kwa karibu maana ya “juu ya hizo.”
- source_word: וְהִקְטַרְתָּ
  choice: nawe utaviteketeza
  rationale: Hiphil ya קטר katika muktadha wa dhabihu humaanisha kuchoma sehemu hizi juu ya madhabahu ili ziwe moshi. “Kuteketeza” huonyesha uchomaji kamili wa dhabihu kwa lugha ya sasa na yenye heshima.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: He ya mwelekeo huonyesha kuwekwa au kuchomwa kuelekea juu ya madhabahu; “juu ya madhabahu” ni usemi wa kawaida wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa maagizo ya ibada ulio wazi, wa sasa, na wenye heshima. Istilahi tata ya anatomia imewasilishwa kwa upana unaohifadhi kutokuwa na uhakika kwa Kiebrania.
