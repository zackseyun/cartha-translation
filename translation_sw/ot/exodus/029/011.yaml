  text: You shall slaughter the bull before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: sw
  text: Kisha utamchinja fahali huyo mbele ya Yahwe, mlangoni mwa Hema la Kukutania.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa mapokeo hutafsiriwa “BWANA.” Toleo jingine la jina hili ni “Yehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: Nawe utamchinja
  rationale: Kitenzi cha Kiebrania katika mfululizo wa maagizo kina nguvu ya agizo la wakati ujao. ‘Kumchinja’ linafaa kwa muktadha wa dhabihu kuliko ‘kumuua’.
- source_word: הַפָּר
  choice: huyo fahali
  rationale: פַּר humaanisha fahali, hasa katika muktadha wa dhabihu; kiashiria ‘huyo’ kinaunganisha mnyama huyu na yule aliyetajwa katika maagizo yaliyotangulia.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: ‘Mbele za’ ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kuwa mbele au katika uwepo wa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: פֶּתַח
  choice: kwenye ingilio
  rationale: Neno hilo hutaja nafasi ya kuingilia au mlango; ‘kwenye ingilio’ linaeleza mahali pa tendo kwa Kiswahili cha kawaida.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni jina linaloeleweka na lililozoeleka kwa hema takatifu ambako Mungu alikutana na watu wake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikitaja mapokeo na njia nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa agizo umehifadhiwa, na istilahi za ibada zimetolewa kwa lugha iliyo wazi.
