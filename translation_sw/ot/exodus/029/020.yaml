translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ya maagizo ya ibada imedumishwa kwa mtiririko wa hatua kwa hatua. Alama zote za tanbihi zimewekwa katika matini kuu; tanbihi [a] inafuata nomino ya mnyama kama katika safu ya ushauri, ingawa maelezo yake yanahusu neno la sikio, na [b] imewekwa baada ya tendo la damu kwenye madhabahu ambalo tanbihi hiyo inalifafanua.
