base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/020.yaml
  text: Then you shall slaughter the ram[a], and take some of its blood and put it on the lobe of Aaron’s right ear, and on the lobe of the right ear of his sons, and on the thumb of their right hand, and on the big toe of their right foot[b]; and you shall throw the blood against the altar all around.
translation:
  language: sw
  text: Kisha utamchinja huyo kondoo dume, uchukue sehemu ya damu yake na kuipaka kwenye ndewe ya sikio[a] la kulia la Aroni, kwenye ndewe ya sikio la kulia la wanawe, kwenye kidole gumba cha mkono wao wa kulia, na kwenye kidole kikubwa cha mguu wao wa kulia; kisha utairusha damu kwenye pande zote za madhabahu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ncha ya sikio la kulia la Aroni ... ncha ya sikio la kulia la wanawe.” Neno la Kiebrania linaweza kumaanisha sehemu ya mwisho ya sikio kwa ujumla zaidi, ingawa huenda “ndewe” ndiyo maana inayokusudiwa katika muktadha huu wa ibada.
    reason: lexical_alternative
  - marker: b
    text: Au “uitupie damu kwenye pande zote za madhabahu.” Kitenzi cha Kiebrania kinaonyesha damu ikiwekwa kwa nguvu katika ibada, wala si kunyunyizwa kwa upole.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: chinja
  rationale: Katika muktadha wa dhabihu, “chinja” ni sahihi na ya kawaida kuliko neno la jumla “ua.”
- source_word: אַיִל
  choice: kondoo dume
  rationale: Ni tafsiri ya kawaida na iliyo wazi kwa mnyama wa kiume anayetolewa kama dhabihu.
- source_word: מִדָּמוֹ
  choice: sehemu ya damu yake
  rationale: Kihusishi מִן hapa kinaonyesha kuchukua kiasi fulani cha damu kwa ajili ya kuipaka.
- source_word: תְּנוּךְ אֹזֶן
  choice: ndewe ya sikio
  rationale: “Ndewe” ni neno sanifu la Kiswahili kwa sehemu ya chini laini ya sikio na linafaa zaidi katika muktadha huu wa ibada, huku uwezekano wa maana pana zaidi ukitajwa katika tanbihi.
- source_word: הַיְמָנִית
  choice: la kulia / wa kulia
  rationale: Vivumishi hivi vinaonyesha wazi upande wa kulia wa sikio, mkono na mguu.
- source_word: בֹּהֶן יָד
  choice: kidole gumba cha mkono
  rationale: Hutaja hasa kidole gumba; kutaja “cha mkono” kunadumisha uwazi na ulinganifu wa kifungu.
- source_word: בֹּהֶן רֶגֶל
  choice: kidole kikubwa cha mguu
  rationale: Hutaja kidole kikubwa cha mguu kwa Kiswahili cha kawaida na kilicho wazi.
- source_word: זָרַק
  choice: rusha ... kwenye
  rationale: Kitenzi kinaashiria matumizi ya damu kwa nguvu katika ibada, si kunyunyiza kwa upole.
- source_word: סָבִיב
  choice: pande zote
  rationale: Inaonyesha kwamba damu inawekwa kuizunguka madhabahu, katika pande zake zote.
- source_word: וְ
  choice: Kisha / na
  rationale: Muunganiko unaorudiwa unaendeleza hatua za utaratibu; “Kisha” na viunganishi vingine vya kawaida hutoa mtiririko wa asili wa Kiswahili.
