base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/035.yaml
  text: And you shall do thus for Aaron and for his sons[a], according to all that I have commanded you. Seven days you shall ordain them.
translation:
  language: sw
  text: Nawe utawafanyia hivi Aroni na wanawe, sawasawa na yote niliyokuamuru. Kwa siku saba utawaweka rasmi katika ukuhani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “utaujaza mkono wao,” nahau ya Kiebrania inayomaanisha kuwaweka rasmi katika huduma ya ukuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utawafanyia
  rationale: Katika mfululizo wa maagizo, umbo hili lina nguvu ya agizo linalohusu kitakachofanywa; kiambishi -wa- pamoja na -ia kinaonyesha kuwa tendo linafanywa kwa ajili ya Aroni na wanawe.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Aroni na wanawe
  rationale: Muundo wa 'utawafanyia' tayari unawakilisha ל ya wahusika wanaofanyiwa ibada hiyo, hivyo Kiswahili hakihitaji kurudia 'kwa ajili ya'.
- source_word: כָּכָה
  choice: hivi
  rationale: Neno hili linarejelea namna ya ibada iliyoelezwa kabla; 'hivi' ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִי אֹתָכָה
  choice: sawasawa na yote niliyokuamuru
  rationale: '''Sawasawa na'' huonyesha kufuata kikamilifu maagizo yote yaliyotangulia, huku ''yote'' ikihifadhi maana pana ya כְּכֹל.'
- source_word: שִׁבְעַת יָמִים
  choice: Kwa siku saba
  rationale: Hiki ni kish accusative cha muda; 'kwa siku saba' kinaonyesha kwa kawaida kwamba tendo la kuwaweka rasmi linaendelea katika kipindi hicho.
- source_word: תְּמַלֵּא יָדָם
  choice: utawaweka rasmi katika ukuhani
  rationale: Nahau hii, kwa maana halisi 'utaijaza mikono yao,' humaanisha kuwaweka au kuwaingiza rasmi katika huduma ya kikuhani. Tafsiri hii inaeleweka bila kuhusisha taratibu za dhehebu fulani.
theological_decisions:
- issue: Uwasilishaji wa nahau ya kikuhani מלא יד
  choice: utawaweka rasmi katika ukuhani
  alternative: utaijaza mikono yao; utawaweka wakfu; utawaingiza rasmi
  rationale: Muktadha unahusu kupewa rasmi huduma ya ukuhani, si tendo la kawaida la kujaza mikono. 'Kuwaweka rasmi katika ukuhani' huwasilisha maana ya cheo na huduma bila kuingiza dhana maalumu ya dhehebu; maana halisi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Aroni' na 'wanawe' ni maumbo ya kawaida ya kibiblia yanayoeleweka; sentensi imeepuka lugha ya kidhehebu.
