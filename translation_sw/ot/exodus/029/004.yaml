base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/004.yaml
  text: You shall bring Aaron and his sons near to the entrance of the tent of meeting[a], and you shall wash them with water.
translation:
  language: sw
  text: Utawaleta Aroni na wanawe kwenye ingilio la Hema la Kukutania[a], nawe utawaosha kwa maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utawasilisha Aroni na wanawe.” Kitenzi cha Kiebrania kinaweza kuwa na maana rasmi ya kiibada ya kumwasilisha mtu kwa ajili ya tendo la ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיב
  choice: utawaleta ... karibu
  rationale: Hifili ya קרב humaanisha kuleta karibu au kuwasilisha. Kauli hii inadumisha maana ya kukaribia mahali patakatifu katika tendo la kuwekwa wakfu, huku ikiwa Kiswahili cha kawaida.
- source_word: אֶל
  choice: na
  rationale: Katika muundo “karibu na,” kihusishi hiki kwa kawaida huonyesha kuelekea mahali panapolengwa.
- source_word: פֶּתַח
  choice: ingilio
  rationale: Neno hili humaanisha uwazi au mahali pa kuingilia, bila kudokeza lazima kuwa kulikuwa na mlango wenye bawaba.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni jina linaloeleweka kwa mahali palipowekwa kwa ajili ya kukutana, na linadumisha hadhi yake katika ibada.
- source_word: וְרָחַצְתָּ
  choice: nawe utawaosha
  rationale: Kitenzi רחץ humaanisha kuosha au kuoga. Muundo huu unawasilisha hatua inayofuata katika maagizo.
- source_word: בַּמָּיִם
  choice: kwa maji
  rationale: Kihusishi kinaonyesha chombo au njia ya kuosha; “kwa maji” ni Kiswahili cha asili na wazi hapa.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Katika muktadha huu neno linawahusu wana wa kiume wa Aroni wanaowekwa wakfu kuwa makuhani.
theological_decisions:
- issue: Maana ya kiibada ya קרב katika muktadha wa kuwekwa wakfu kwa makuhani
  choice: Utawaleta Aroni na wanawe karibu
  alternative: Utawasilisha Aroni na wanawe
  rationale: “Kuleta karibu” inadumisha picha ya kukaribia patakatifu na maana ya tendo la kiibada bila kufasiri kupita kiasi. “Kuwasilisha” pia inawezekana, lakini ni ya kifasiri zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye hadhi. “Hema la Kukutania” limetumiwa kama jina la mahali maalumu; tanbihi inahifadhi maana mbadala ya kiibada ya תַּקְרִיב.
