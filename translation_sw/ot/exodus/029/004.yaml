review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the persons, the tent designation, and washing with water. However, “karibu na ingilio” normally means “near the entrance” and can leave the movement short of the specified destination. The Hebrew אֶל־פֶּתַח directs Aaron and his sons to the entrance.
  naturalness: The wording is generally clear and dignified Standard East African Swahili. “Kwenye ingilio la Hema la Kukutania” is more direct and natural for the destination than “karibu na ingilio.”
  terminology: “Aroni,” “wanawe,” “Hema la Kukutania,” and “kwa maji” are suitable and consistent with biblical Swahili usage. The footnote appropriately preserves “kuwasilisha” as a possible formal/cultic alternative without forcing that nuance into the main text.
  issues:
  - severity: low
    issue: “karibu na ingilio” weakens the directional force of אֶל־פֶּתַח.
    rationale: In ordinary Swahili it denotes proximity (“near the entrance”), whereas the Hebrew commands bringing them to the entrance. Replacing it with “kwenye ingilio” preserves the destination without adding an interpretive spatial detail.
  revised_text: Utawaleta Aroni na wanawe kwenye ingilio la Hema la Kukutania[a], nawe utawaosha kwa maji.
  revised_footnotes:
  - marker: a
    text: Au, “utawasilisha Aroni na wanawe.” Kitenzi cha Kiebrania kinaweza kuwa na maana rasmi ya kiibada ya kumwasilisha mtu kwa ajili ya tendo la ibada.
    reason: lexical_alternative
  revision_rationale: 'The revision changes only the spatial expression: “kwenye ingilio” renders the movement toward the entrance more faithfully than “karibu na ingilio.” The established cultic terminology and the lexical-alternative footnote are retained.'
