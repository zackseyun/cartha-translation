  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֣ הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/024.yaml
  text: You shall put all of it on the palms of Aaron and on the palms of his sons[a], and you shall wave them as a wave offering before Yahweh.
translation:
  language: sw
  text: Utaweka vitu hivyo vyote juu ya viganja vya Aroni na juu ya viganja vya wanawe[a], na utavipunga mbele za Yahwe kuwa sadaka ya kupunga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “juu ya viganja vya Aroni na juu ya viganja vya wanawe.” Tafsiri nyingine hutumia neno pana zaidi “mikono,” lakini neno la Kiebrania linamaanisha hasa viganja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Utaweka
  rationale: Katika mfululizo huu wa maagizo, Qal perfect yenye kiunganishi ina nguvu ya amri; wakati ujao wa Kiswahili hutumika kwa kawaida katika maagizo ya namna hii.
- source_word: הַכֹּל
  choice: vitu hivyo vyote
  rationale: Inarejelea sehemu mbalimbali zilizokusanywa katika muktadha uliotangulia; usemi huu unaweka wazi wingi unaodokezwa na kiwakilishi cha baadaye אֹתָם.
- source_word: עַל כַּפֵּי
  choice: juu ya viganja vya mikono ya
  rationale: כַּף hapa ni kiganja cha mkono, si mkono kwa maana pana; tafsiri hii inahifadhi picha halisi ya sehemu za sadaka kuwekwa viganjani.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: בָנָיו
  choice: wanawe
  rationale: Katika muktadha wa kuwekwa wakfu kwa ukuhani, neno hili linawahusu wana wa kiume wa Aroni.
- source_word: וְהֵנַפְתָּ
  choice: kisha utavipunga
  rationale: Hiphil ya נוף katika ibada za dhabihu huonyesha tendo la kiibada la kupunga au kuwasilisha; 'kupunga' huhifadhi tendo lenyewe kwa uwazi.
- source_word: אֹתָם
  choice: utavipunga
  rationale: Kiwakilishi cha wingi kinarejelea vitu au sehemu kadhaa; kiambishi '-vi-' kinakubaliana na 'vitu hivyo vyote'.
- source_word: תְּנוּפָה
  choice: kuwa sadaka ya kupunga
  rationale: Nomino hii hutaja aina au matokeo ya tendo la kiibada; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha Biblia.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: '''Mbele za'' huwasilisha maana ya kufanya tendo hilo katika uwepo wa Mungu, na jina la agano יְהוָה limetoholewa kuwa ''Yahwe''.'
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni; 'Yahwe' huhifadhi jina la agano badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. 'Viganja vya mikono' limetumiwa kwa usahihi na uwazi, huku 'sadaka ya kupunga' ikihifadhi istilahi ya kiibada.
