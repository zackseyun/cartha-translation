review_pass:
  verdict: revise
  source_fidelity: Draft correctly conveys the command to place the collected portions on Aaron’s and his sons’ palms and to wave them before Yahweh as a wave offering. The plural object is retained appropriately. The proposed revision removes unnecessary redundancy in the expression for ‘palms.’
  naturalness: “Viganja vya mikono” is understandable but redundant in standard modern Swahili, since kiganja already means the palm of a hand. “Kisha” is not required by the Hebrew conjunction and slightly adds a sequential nuance; simple “na” better follows the source while remaining natural.
  terminology: “Aroni,” “wanawe,” “Yahwe,” and “sadaka ya kupunga” are suitable standard East African Swahili biblical terminology. “Mbele za Yahwe” appropriately renders the ritual phrase ‘before Yahweh.’
  issues:
  - severity: low
    issue: Redundant expression “viganja vya mikono.”
    rationale: Kiganja inherently denotes the palm; “viganja vya Aroni” is both idiomatic and sufficiently specific for כַּפֵּי.
  - severity: low
    issue: “Kisha” adds an explicit ‘then’ nuance.
    rationale: The Hebrew simply coordinates the instructions with waw. “Na” preserves the connection without adding emphasis not required by the source.
  revised_text: Utaweka vitu hivyo vyote juu ya viganja vya Aroni na juu ya viganja vya wanawe[a], na utavipunga mbele za Yahwe kuwa sadaka ya kupunga.
