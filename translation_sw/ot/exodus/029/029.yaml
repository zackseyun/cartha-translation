  yaml_path: translation/ot/exodus/029/029.yaml
  text: And the holy garments that are Aaron’s shall belong to his sons after him[a], for anointing in them and for ordaining them in them.
translation:
  language: sw
  text: Na mavazi matakatifu ya Haruni yatakuwa ya wanawe baada yake, ili watiwe mafuta na kuwekwa rasmi katika ukuhani wakiwa wameyavaa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, Kiebrania husema, “kujaza mikono yao,” nahau ya kikuhani inayomaanisha kuwaweka au kuwasimika rasmi katika wadhifa huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: mavazi matakatifu
  rationale: Neno בגד humaanisha vazi au nguo, na הַקֹּדֶשׁ hapa huonyesha kwamba mavazi hayo yametengwa kwa matumizi matakatifu ya kikuhani.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: ya Haruni
  rationale: Kihusishi לְ hapa huonyesha kuwa mavazi hayo ni ya Haruni au yamekusudiwa kwake; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  choice: yatakuwa ya wanawe baada yake
  rationale: Kauli hii inaonyesha kwamba baada ya Haruni mavazi hayo yatawafuata wanawe katika huduma ya kikuhani, huku muundo wa Kiebrania ukihifadhiwa kwa njia ya asili.
- source_word: לְמָשְׁחָה בָהֶם
  choice: ili watiwe mafuta wakiwa wameyavaa
  rationale: בָהֶם inaonyesha kwamba kutiwa mafuta kunafanyika wakiwa ndani ya mavazi hayo, yaani wameyavaa, wala si kwamba mavazi ndiyo chombo cha kuwatia mafuta.
- source_word: וּלְמַלֵּא בָם אֶת יָדָם
  choice: na kuwekwa rasmi katika ukuhani wakiwa wameyavaa
  rationale: מלא את־ידם ni nahau ya kiibada inayomaanisha kuwaweka au kuwaingiza rasmi katika wadhifa wa kikuhani. Tafsiri hii huwasilisha maana kwa Kiswahili cha kawaida, na taswira halisi ya Kiebrania imeelezwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya nahau ya kikuhani מלא את־ידם
  choice: kuwekwa rasmi katika ukuhani
  alternative: kujaziwa mikono yao
  rationale: Tafsiri ya neno kwa neno, ‘kujaziwa mikono,’ haieleweki kwa urahisi katika Kiswahili na inaweza kupotosha. Maana ya muktadha ni kusimikwa au kuwekwa rasmi katika huduma ya ukuhani; tanbihi huhifadhi nahau ya asili bila kuingiza maana ya dhehebu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “wakiwa wameyavaa” umetumiwa mara mbili ili kubainisha kwamba kutiwa mafuta na kuwekwa rasmi vyote hufanyika wakiwa wamevaa mavazi hayo.
