base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/033.yaml
  text: They shall eat those things by which atonement was made[a], to ordain them and to consecrate them; but an outsider shall not eat them[c][b], because they are holy.
translation:
  language: sw
  text: Nao watakula vitu vile vilivyotumiwa kufanya upatanisho[a], ili kuwaweka rasmi[b] na kuwaweka wakfu; lakini mtu asiyeidhinishwa[c] hatakula vitu hivyo, kwa sababu ni vitakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambavyo kwa njia yake upatanisho ulifanywa.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “kujaza mkono wao,” nahau ya Kiebrania inayomaanisha kuwaweka rasmi katika huduma ya ukuhani.
    reason: lexical_alternative
  - marker: c
    text: Hapa humaanisha mtu ambaye hakuruhusiwa kushiriki katika ibada ya kikuhani, si lazima mgeni wa kabila au taifa.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָכְלוּ
  choice: Nao watakula
  rationale: Kauli hii inaendeleza maagizo ya ibada na ina nguvu ya kimwelekezo; “watakula” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: אֹתָם
  choice: vitu vile
  rationale: Kiwakilishi kinarejelea sehemu za dhabihu zilizotajwa katika muktadha uliotangulia; “vitu vile” hufanya rejeleo lieleweke bila kulifafanua kupita kiasi.
- source_word: אֲשֶׁר כֻּפַּר בָּהֶם
  choice: ambavyo kwa hivyo upatanisho ulifanywa
  rationale: בָּהֶם inaonyesha njia au chombo kilichotumiwa katika kufanya upatanisho. Muundo huu hauongezi waziwazi ‘kwa ajili yao,’ jambo ambalo halipo katika kishazi hiki cha Kiebrania.
- source_word: לְמַלֵּא אֶת יָדָם
  choice: ili kuwaweka rasmi kuwa makuhani
  rationale: Nahau halisi ‘kujaza mkono wao’ humaanisha kuwaingiza au kuwaweka rasmi katika huduma ya ukuhani; tafsiri hii hutoa maana ya muktadha bila kuingiza mfumo wa dhehebu fulani.
- source_word: לְקַדֵּשׁ אֹתָם
  choice: na kuwaweka wakfu
  rationale: Katika muktadha wa kikuhani, mzizi קדשׁ unamaanisha kuwatenga kwa ajili ya huduma takatifu; “kuwaweka wakfu” ni usemi wa asili na unaoeleweka.
- source_word: וְזָר
  choice: lakini mtu asiyehusika na ukuhani
  rationale: זָר hapa si lazima iwe mgeni wa kabila au taifa, bali mtu aliye nje ya kundi lililoruhusiwa kushiriki katika ibada ya kikuhani.
- source_word: לֹא יֹאכַל
  choice: hatakula vitu hivyo
  rationale: Ni katazo la moja kwa moja; kurudia ‘vitu hivyo’ huweka wazi yambwa linalodokezwa.
- source_word: כִּי קֹדֶשׁ הֵם
  choice: kwa sababu ni vitakatifu
  rationale: Kishazi kinatoa sababu ya katazo, na “vitakatifu” huhifadhi uzito wa lugha ya ibada.
theological_decisions:
- issue: Maana ya כּפר katika muktadha wa dhabihu
  choice: upatanisho ulifanywa
  alternative: maondoleo ya hatia yalifanywa
  rationale: “Upatanisho” ni neno linaloeleweka na lenye upana wa kutosha kuhifadhi uzito wa neno la Kiebrania; mbadala unaweza kulifanya liwe na maana finyu zaidi ya kuondoa hatia.
- issue: Nahau ya kikuhani מִלֵּא יָד
  choice: kuwaweka rasmi kuwa makuhani
  alternative: kujaza mkono wao; kuwaingiza katika ukuhani
  rationale: Nahau hiyo inaashiria kuwekwa rasmi katika huduma ya ukuhani, si tendo la kawaida la kujaza mikono. Ufafanuzi wa kazi huepuka tafsiri ya neno kwa neno isiyoeleweka na pia huepuka istilahi ya dhehebu maalumu.
- issue: Walengwa wa upatanisho katika אֲשֶׁר כֻּפַּר בָּהֶם
  choice: kutotaja wazi ‘kwa ajili yao’ katika matini kuu
  alternative: ambavyo kwa hivyo upatanisho ulifanywa kwa ajili yao
  rationale: Kiebrania hutaja vitu hivyo kama njia au chombo cha kufanya upatanisho, lakini kishazi hiki hakitaji walengwa kwa kiwakilishi tofauti. Tanbihi huhifadhi uwezekano unaotokana na muktadha bila kuufanya kuwa wazi zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Istilahi za ibada zimehifadhiwa bila kutumia lugha mahsusi ya dhehebu; tanbihi zinaeleza nahau na utata wa chanzo.
