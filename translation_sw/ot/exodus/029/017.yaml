translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Amri za Kiebrania ziko katika nafsi ya pili umoja, lakini zimetafsiriwa kwa maumbo ya heshima/wingi ('mkatakate,' 'muoshe,' 'mviweke') yanayofaa katika mtindo wa maagizo kwa Musa bila kutumia 'wewe' mara kwa mara.
