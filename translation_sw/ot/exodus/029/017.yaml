translation:
  language: sw
  text: Kisha utamkata kondoo dume huyo vipande vipande, na utaosha matumbo yake na miguu yake; kisha utaviweka juu ya vipande vyake na juu ya kichwa chake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאַיִל
  choice: huyo kondoo dume
  rationale: Katika muktadha wa dhabihu, אַיִל ni kondoo dume; kiwakilishi 'huyo' kinarejelea mnyama aliyetajwa tayari.
- source_word: תְּנַתֵּחַ לִנְתָחָיו
  choice: mkatakate ... vipande vipande
  rationale: Kauli hii inaeleza kumkata mnyama katika vipande kwa maandalizi ya dhabihu; usemi huu ni wa kawaida na wazi kwa Kiswahili cha sasa.
- source_word: קִרְבּוֹ
  choice: matumbo yake
  rationale: Katika maagizo ya dhabihu, neno hili linahusu sehemu za ndani za mnyama. 'Matumbo' ni neno la kawaida linaloeleweka, ingawa linaweza kujumuisha viungo vya ndani kwa upana katika muktadha huu.
- source_word: כְרָעָיו
  choice: miguu yake
  rationale: כְּרָעַיִם hurejelea miguu, hasa sehemu za chini; 'miguu' ni tafsiri ya kawaida na isiyo ya kitaalamu kupita kiasi.
- source_word: וְנָתַתָּ עַל
  choice: halafu mviweke juu ya
  rationale: עַל kwa msingi humaanisha 'juu ya'; tafsiri hii inadumisha taswira ya kupanga sehemu zilizooshwa juu ya vipande na kichwa bila kubadili kuwa 'pamoja na'.
- source_word: רֹאשׁוֹ
  choice: kichwa chake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya neno la anatomia רֹאשׁ.
- source_word: וְ
  choice: Kisha / halafu
  rationale: Viunganishi vinaonyesha mfululizo wa hatua za utaratibu; 'Kisha' na 'halafu' vinafanya mpangilio huo uwe wazi katika Kiswahili.
