    reason: lexical_alternative
  - marker: c
    text: Au, “kila siku, daima.” Kishazi hiki kinaonyesha sadaka ya kila siku inayoendelea kutolewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה אֲשֶׁר
  choice: Na hivi ndivyo
  rationale: Huhifadhi kiunganishi וְ na kutambulisha agizo linalofuata kwa Kiswahili cha kawaida bila kuongeza wazo la wakati kama ‘sasa’.
- source_word: תַּעֲשֶׂה
  choice: utakavyotoa
  rationale: Kitenzi עשה kwa msingi ni ‘fanya/tengeneza,’ lakini katika muktadha huu wa madhabahu na wanyama wa dhabihu, ‘kutoa’ huwasilisha tendo la kutoa dhabihu kwa ufasaha.
- source_word: עַל הַמִּזְבֵּחַ
  choice: juu ya madhabahu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kishazi cha mahali katika muktadha wa dhabihu.
- source_word: כְּבָשִׂים
  choice: wana-kondoo
  rationale: Neno hili humaanisha kondoo wachanga; umri wao unaelezwa wazi na kishazi kinachofuata.
- source_word: בְּנֵי שָׁנָה
  choice: wenye umri wa mwaka mmoja
  rationale: Ni Kiswahili cha asili kinachowasilisha nahau ya Kiebrania ‘wana wa mwaka’ bila kuiga muundo wake usio wa kawaida.
- source_word: שְׁנַיִם לַיּוֹם תָּמִיד
  choice: wawili ... kila siku daima
  rationale: Huhifadhi idadi, ugawaji wa kila siku, na wazo la utoaji wa kawaida unaoendelea.
theological_decisions:
- issue: Maana ya תָּמִיד katika ibada
  choice: daima
  alternative: kwa ukawaida kila siku
  rationale: ‘Daima’ huhifadhi mvutano kati ya mwendelezo na urudiaji wa kawaida; tanbihi inafafanua kuwa hapa ni sadaka ya kila siku inayoendelea, si lazima tendo lisilokatizwa kila wakati.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Muundo ni wa ulinganifu bora: unafuata Kiebrania kwa karibu lakini unatumia nahau ya asili ya Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.'
