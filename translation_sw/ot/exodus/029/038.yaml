  text: 'Na hivi ndivyo utakavyotoa juu ya madhabahu: wana-kondoo wawili wenye umri wa mwaka mmoja kila siku, daima[a][b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utakavyofanya juu ya madhabahu.” Kitenzi cha Kiebrania kwa kawaida humaanisha “kufanya” au “kutengeneza,” lakini hapa kinahusu kutoa dhabihu.
