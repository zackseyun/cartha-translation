  yaml_path: translation/ot/exodus/029/007.yaml
  text: Then you shall take the anointing oil and pour it on his head and anoint him.
translation:
  language: sw
  text: Kisha utachukua mafuta ya upako, utayamimina juu ya kichwa chake na utamtia mafuta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kisha utachukua
  rationale: Kitenzi cha maagizo chenye kiunganishi kinaendeleza mfuatano wa ibada; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida, na wakati ujao hudumisha nguvu ya agizo.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: mafuta ya upako
  rationale: Muundo huu unamaanisha mafuta yaliyotengwa kwa tendo la kupaka kwa ajili ya kuweka wakfu; “mafuta ya upako” ni usemi wa asili na wenye heshima katika Kiswahili.
- source_word: וְיָצַקְתָּ
  choice: utayamimina
  rationale: יצק hapa ni kumimina. Kiambishi “-ya-” kinarejelea mafuta na kuweka wazi kwamba mafuta ndiyo yanayomiminwa.
- source_word: עַל רֹאשׁוֹ
  choice: juu ya kichwa chake
  rationale: Tafsiri hii inahifadhi kwa usahihi mahali pa kumiminia mafuta na ni ya kawaida katika Kiswahili sanifu.
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  choice: na kumtia mafuta
  rationale: משׁח ni tendo la kumpaka au kumtia mtu mafuta kwa kusudi la kuwekwa wakfu. “Kumtia mafuta” ni usemi wa kawaida unaotofautisha tendo hilo na nomino maalumu “mafuta ya upako” bila kuondoa maana ya kiibada.
theological_decisions:
- issue: Mfuatano wa kumimina mafuta na kumtia mafuta
  choice: 'Matendo yote mawili yametajwa tofauti: “utayamimina ... na kumtia mafuta.”'
  alternative: Kuyafanya kuwa wazo moja, kama “utamtia mafuta kwa kuyamimina juu ya kichwa chake.”
  rationale: 'Kiebrania kina vitenzi viwili vilivyounganishwa: kumimina na kutia mafuta. Kuvihifadhi vyote kunadumisha tendo la kimwili na tendo lake la kuweka wakfu bila kulifanya moja kuwa maelezo tu ya jingine.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mtiririko wa maagizo ya ibada na huepuka msamiati wa dhehebu fulani.
