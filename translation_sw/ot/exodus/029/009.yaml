base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/009.yaml
  text: You shall fasten sashes on them[a], on Aaron and on his sons, and you shall bind caps on them. The priesthood shall belong to them as a permanent statute. So you shall ordain Aaron and his sons.
translation:
  language: sw
  text: Utawafunga Haruni na wanawe mishipi viunoni, na kuwavika kofia. Ukuhani utakuwa wao kwa sheria ya kudumu. Hivyo utawaweka rasmi Haruni na wanawe katika ukuhani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “utaujaza mkono wa Haruni na mkono wa wanawe,” nahau ya Kiebrania yenye maana ya kuwaweka rasmi katika huduma ya ukuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגַרְתָּ ... אַבְנֵט
  choice: utawafunga mishipi viunoni
  rationale: Kitenzi חגר pamoja na אַבְנֵט kinaeleza kufunga mshipi kiunoni. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi tendo la kuvalisha vazi hilo.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Haruni na wanawe
  rationale: Kirai hiki kinafafanua wazi wale wanaorejelewa na kiwakilishi cha wingi.
- source_word: חָבַשְׁתָּ לָהֶם מִגְבָּעֹת
  choice: kuwavika kofia
  rationale: מִגְבָּעוֹת ni vifuniko vya kichwa vya makuhani, tofauti na kilemba cha kuhani mkuu katika miktadha mingine. 'Kuwavika kofia' ni Kiswahili cha asili, ingawa kitenzi cha Kiebrania kina wazo la kufunga au kuzungushia kichwani.
- source_word: וְהָיְתָה לָהֶם כְּהֻנָּה
  choice: Ukuhani utakuwa wao
  rationale: Muundo huu unahifadhi wazo la kwamba ukuhani umepewa au umewekwa kuwa wa Haruni na wanawe, bila kuubadili kuwa maelezo tu kwamba wao ni makuhani.
- source_word: לְחֻקַּת עוֹלָם
  choice: kwa agizo la kudumu
  rationale: חֻקָּה ni agizo lililowekwa, na עוֹלָם hapa huonyesha hali ya kuendelea kudumu katika mfumo wa agano. 'La kudumu' halilazimishi hitimisho la kifalsafa kuhusu kutokuwa na mwisho kabisa.
- source_word: וּמִלֵּאתָ יַד
  choice: utawaweka rasmi ... katika ukuhani
  rationale: Kirai halisi 'kujaza mkono' ni nahau ya kiufundi ya kuwaingiza au kuwaweka katika huduma ya ukuhani. 'Kuwaweka rasmi katika ukuhani' kinaeleza kazi yake kwa uwazi, huku tafsiri halisi ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Muda unaoonyeshwa na לְחֻקַּת עוֹלָם
  choice: kwa agizo la kudumu
  alternative: kwa agizo la milele
  rationale: Tafsiri iliyochaguliwa inaonyesha uhalali unaoendelea wa ukuhani katika utaratibu wa agano la Israeli bila kuamua kimbele swali la kitheolojia kuhusu umilele usio na kikomo.
- issue: Nahau ya kuwaingiza makuhani katika wadhifa, וּמִלֵּאתָ יַד
  choice: utawaweka rasmi Haruni na wanawe katika ukuhani
  alternative: utaujaza mkono wa Haruni na mikono ya wanawe
  rationale: Tafsiri kuu inaeleweka kwa msomaji wa kawaida na kueleza kazi ya tendo hilo. Tanbihi inahifadhi sura halisi ya nahau ya Kiebrania ili maana yake ya kiibada ibaki wazi na ikaguliwe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. 'Mishipi viunoni' na 'kofia' ni maneno ya sasa yasiyo ya kizamani; sentensi zinadumisha uzito wa kifungu cha sheria na ibada.
