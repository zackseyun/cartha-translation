  text: וְ/הָיָה֩ לְ/אַהֲרֹ֨ן וּ/לְ/בָנָ֜י/ו לְ/חָק עוֹלָ֗ם מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֥י תְרוּמָ֖ה ה֑וּא וּ/תְרוּמָ֞ה יִהְיֶ֨ה מֵ/אֵ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִ/זִּבְחֵ֣י שַׁלְמֵי/הֶ֔ם תְּרוּמָתָ֖/ם לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/028.yaml
  text: It shall belong to Aaron and to his sons as a permanent statute from the Israelites[a], for it is a contribution; it shall be a contribution from the Israelites, from the sacrifices of their peace offerings, their contribution to Yahweh.
translation:
  language: sw
  text: Nayo itakuwa ya Haruni na wanawe kuwa haki ya kudumu kutoka kwa Waisraeli, kwa maana ni mchango uliotengwa; nayo itakuwa mchango uliotengwa kutoka kwa Waisraeli, kutoka katika dhabihu za sadaka zao za amani[a]—mchango wao kwa BWANA.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za ustawi.” Neno la Kiebrania linaweza kudokeza ukamilifu, ustawi, na amani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Nayo itakuwa ya
  rationale: Kitenzi hiki ni ‘itakuwa’ kihalisi, lakini katika muktadha wa mgao wa kikuhani kinaonyesha umiliki; ‘itakuwa ya’ huleta maana hiyo wazi kwa Kiswahili cha kawaida.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Haruni na wanawe
  rationale: Kiambishi לְ hapa kinaonyesha mwenye kunufaika au kumiliki; muundo ‘ya Haruni na wanawe’ ni wa asili na wazi.
- source_word: לְחָק עוֹלָם
  choice: kama agizo la kudumu
  rationale: חָק ni agizo au sheria iliyowekwa, na עוֹלָם katika muktadha huu wa ibada huonyesha udumu, bila kulazimisha dhana ya milele isiyo na mwisho.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: kutoka kwa Waisraeli
  rationale: Hii ni tafsiri ya kawaida na ya asili ya בְּנֵי יִשְׂרָאֵל katika Kiswahili cha sasa.
- source_word: כִּי
  choice: kwa maana
  rationale: Neno hili linaanzisha sababu ya agizo lililotangulia.
- source_word: תְרוּמָה
  choice: mchango uliotengwa
  rationale: תְרוּמָה ni sehemu iliyotengwa na kutolewa kwa Mungu. ‘Mchango uliotengwa’ huepuka istilahi ya kizamani, huku ikibainisha kwamba si mchango wa kawaida.
- source_word: וּתְרוּמָה יִהְיֶה
  choice: itakuwa mchango uliotengwa
  rationale: Marudio ya chanzo yamehifadhiwa kwa sababu yanasisitiza hadhi ya sehemu hiyo katika ibada.
- source_word: מִזִּבְחֵי שַׁלְמֵיהֶם
  choice: kutoka katika dhabihu za sadaka zao za amani
  rationale: Muundo huu unaonyesha זֶבַח (‘dhabihu’) na istilahi שְׁלָמִים (‘sadaka za amani’) bila kufuta mnyororo wa nomino wa Kiebrania.
- source_word: תְּרוּמָתָם
  choice: mchango wao
  rationale: Kiambishi cha umilikaji kinaonyesha kuwa huo ndio mchango unaotolewa na Waisraeli; ‘mchango’ hudumisha ulinganifu wa istilahi katika mstari.
- source_word: לַיהוָה
  choice: kwa BWANA
  rationale: Jina la agano יהוה limetafsiriwa kwa desturi ya heshima kama ‘BWANA’; לְ hapa inaonyesha kwamba mchango umeelekezwa kwake.
theological_decisions:
- issue: Tafsiri ya jina יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ hufuata desturi pana ya tafsiri za Biblia za Kiswahili na desturi ya heshima ya Kiyahudi, bila kuingiza matamshi yenye ubishi katika matini kuu.
- issue: Maana ya istilahi שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za ustawi
  rationale: Istilahi ya Kiebrania inaweza kuhusisha amani, ukamilifu, ustawi na ushirika. ‘Sadaka za amani’ huhifadhi jina la ibada linalotambulika, huku tanbihi ikionyesha upana wake wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. Marudio ya istilahi ya ibada yamehifadhiwa, na ‘mchango uliotengwa’ imetumiwa ili kutofautisha תְרוּמָה na mchango wa kawaida.
