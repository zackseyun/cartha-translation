review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the priestly allotment, the Israelites as its source, the repeated designation תְּרוּמָה, and its relation to the LORD. However, “agizo la kudumu kutoka kwa Waisraeli” can imply that the Israelites issue the regulation, whereas לְחָק עוֹלָם מֵאֵת בְּנֵי יִשְׂרָאֵל denotes an enduring prescribed due/right received from them. The revision makes this legal-allotment sense explicit.
  naturalness: The register is clear Standard East African Swahili. The revised “haki ya kudumu ... kutoka kwa Waisraeli” is more idiomatic and contextually precise than a statute ‘from’ the Israelites. The cultic repetition is retained.
  terminology: Haruni, Waisraeli, BWANA, mchango uliotengwa, and sadaka za amani are suitable and consistent. The footnote is adjusted to state the lexical range without suggesting that restored relationship is necessarily entailed in every occurrence.
  issues:
  - severity: medium
    issue: “kama agizo la kudumu kutoka kwa Waisraeli” misattaches “kutoka kwa Waisraeli.”
    rationale: In the Hebrew, the phrase identifies the Israelites as those from whom the perpetual priestly due comes; it does not naturally identify them as the source of the statute/agizo.
  - severity: low
    issue: The footnote’s “uhusiano uliorejeshwa” is more specific than the lexical sense requires.
    rationale: שְׁלָמִים is associated with wholeness, well-being, and peace; restored relationship may occur in context but should not be presented as intrinsic here.
  revised_text: Nayo itakuwa ya Haruni na wanawe kuwa haki ya kudumu kutoka kwa Waisraeli, kwa maana ni mchango uliotengwa; nayo itakuwa mchango uliotengwa kutoka kwa Waisraeli, kutoka katika dhabihu za sadaka zao za amani[a]—mchango wao kwa BWANA.
  revised_footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za ustawi.” Neno la Kiebrania linaweza kudokeza ukamilifu, ustawi, na amani.
    reason: lexical_alternative
  revision_rationale: “Haki ya kudumu” conveys חָק in this cultic context as an established perpetual due or entitlement, and “kutoka kwa Waisraeli” now modifies that due as in the Hebrew. The remaining wording retains the source’s repetition and cultic terminology. The footnote preserves viable alternatives while avoiding an overly specific theological implication.
