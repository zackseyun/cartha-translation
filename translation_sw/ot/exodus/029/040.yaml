  yaml_path: translation/ot/exodus/029/040.yaml
  text: and a tenth of fine flour mixed with a quarter of a hin of beaten oil[a], and a drink offering of a quarter of a hin of wine[c][b], for the one lamb.
translation:
  language: sw
  text: pamoja na sehemu moja ya kumi ya efa ya unga laini, uliochanganywa na robo ya hini ya mafuta ya zeituni yaliyopatikana kwa kuponda[a], na sadaka ya kinywaji ya robo ya hini ya divai, kwa ajili ya mwana-kondoo yule mmoja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mafuta yaliyopatikana kwa kuponda au kupiga zeituni; pia yaweza kutafsiriwa “mafuta ya zeituni yaliyokamuliwa.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa ajili ya mwana-kondoo mmoja”; katika muktadha huenda ikimaanisha mwana-kondoo wa kwanza kati ya wale wawili waliotolewa kila siku.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עִשָּׂרֹן
  choice: sehemu moja ya kumi ya efa
  rationale: Katika muktadha wa sadaka, עִשָּׂרוֹן ni kipimo cha sehemu moja ya kumi ya efa. Kutaja efa huifanya maana ya kipimo ieleweke kwa msomaji wa kawaida bila kubadili thamani yake.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Neno hili humaanisha unga uliosagwa vizuri uliotumiwa kwa sadaka; 'unga laini' ni Kiswahili cha kawaida na wazi.
- source_word: בָּל֨וּל בְּ/שֶׁ֤מֶן
  choice: uliochanganywa na ... mafuta
  rationale: Kirai kinaonyesha unga uliochanganywa na mafuta; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: כָּתִית
  choice: mafuta ya zeituni yaliyotengenezwa kwa kupondwa
  rationale: כָּתִית hufafanua mafuta yaliyopatikana kwa kuponda au kupiga zeituni. Ufafanuzi huu ni wazi zaidi kuliko tafsiri ya neno moja isiyo ya kawaida.
- source_word: רֶ֣בַע הַ/הִ֔ין
  choice: robo ya hini
  rationale: Huhifadhi kwa usahihi sehemu na kipimo cha kale bila kukibadili kuwa kipimo cha kisasa.
- source_word: וְ/נֵ֕סֶךְ
  choice: na sadaka ya kinywaji
  rationale: Hili ni neno la kiibada kwa sadaka ya divai iliyomiminwa; 'sadaka ya kinywaji' linaeleweka na kuhifadhi matumizi yake ya kiufundi.
- source_word: רְבִעִ֥ית הַ/הִ֖ין יָ֑יִן
  choice: robo ya hini ya divai
  rationale: Tafsiri hii hudumisha kipimo kilekile na maana ya kawaida ya יַיִן.
- source_word: לַ/כֶּ֖בֶשׂ הָ/אֶחָֽד
  choice: kwa ajili ya mwana-kondoo huyo mmoja
  rationale: Kiwakilishi 'huyo' kinawakilisha urejeo maalumu wa kiarifu cha Kiebrania, huku 'mmoja' kikihifadhi namba bila kuamua wazi kuwa maana yake ni 'wa kwanza'.
theological_decisions:
- issue: Iwapo הָאֶחָד humaanisha 'huyo mmoja' au 'wa kwanza'
  choice: mwana-kondoo huyo mmoja
  alternative: mwana-kondoo wa kwanza
  rationale: Kiebrania kina kiarifu pamoja na namba 'mmoja'. Muktadha unaweza kuelekeza kwa wa kwanza kati ya wana-kondoo wawili wa kila siku, lakini hilo halijasemwa moja kwa moja katika kirai hiki; tafsiri kuu inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Vipimo vya kale 'efa' na 'hini' vimehifadhiwa; 'efa' imewekwa wazi katika matini kwa sababu עִשָּׂרוֹן ni kipimo maalumu cha sehemu moja ya kumi ya efa katika muktadha huu.
