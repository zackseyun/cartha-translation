base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/014.yaml
  text: But the flesh of the bull[a], and its hide, and its dung, you shall burn with fire outside the camp; it is a sin offering.
translation:
  language: sw
  text: Lakini nyama ya huyo fahali[a], ngozi yake na kinyesi chake utaviteketeza kwa moto nje ya kambi; ni dhabihu ya dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhabihu ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha “dhambi” au dhabihu inayotolewa kuhusiana na dhambi. Katika muktadha huu wa ibada, wengi hutafsiri “dhabihu ya dhambi,” lakini wengine hupendelea “dhabihu ya utakaso” ili kusisitiza kazi ya ibada hiyo ya kutakasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר הַפָּר
  choice: nyama ya huyo fahali
  rationale: “Nyama” ni neno la kawaida na sahihi kwa mwili wa mnyama katika muktadha huu; “huyo fahali” humrejelea fahali aliyetajwa katika maagizo yaliyotangulia bila kuongeza wazo la umri ambalo halilazimishwi na פַּר.
- source_word: עֹרוֹ
  choice: ngozi yake
  rationale: “Ngozi” ndilo neno la kawaida la Kiswahili kwa ngozi ya mnyama na linafaa katika maelezo ya mzoga.
- source_word: פִּרְשׁוֹ
  choice: kinyesi chake
  rationale: פֶּרֶשׁ humaanisha kinyesi au samadi, si matumbo au sehemu nyingine za ndani; tafsiri hii haipunguzi maana ya neno.
- source_word: תִּשְׂרֹף
  choice: utaviteketeza
  rationale: Kauli ya wakati ujao katika Kiswahili inaweza kutoa nguvu ya agizo katika sheria; kiambishi “-vi-” kinarejelea kwa pamoja nyama, ngozi na kinyesi. “Teketeza” huonyesha kuchoma kabisa.
- source_word: בָּאֵשׁ
  choice: kwa moto
  rationale: Beth hapa ina maana ya chombo au njia inayotumiwa; “kwa moto” ni Kiswahili cha asili.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Hii ni tafsiri wazi na ya kawaida ya eneo lililo nje ya mipaka ya kambi.
- source_word: חַטָּאת
  choice: dhabihu ya dhambi
  rationale: Katika muktadha wa ibada neno hili linamaanisha dhabihu inayohusiana na dhambi; “dhabihu ya dhambi” inatambulika kwa urahisi, huku maana mbadala ya utakaso ikihifadhiwa katika tanbihi.
- source_word: הוּא
  choice: ni
  rationale: Kishazi “ni dhabihu ya dhambi” kinatambulisha wazi aina ya dhabihu kwa Kiswahili cha kawaida.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: nyama ..., ngozi yake na kinyesi chake
  rationale: Orodha yote imehifadhiwa kwa uratibu wa kawaida wa Kiswahili bila kufanya sentensi kuwa nzito isivyo lazima.
theological_decisions:
- issue: Maana ya חַטָּאת katika sheria za dhabihu
  choice: dhabihu ya dhambi
  alternative: dhabihu ya utakaso
  rationale: Muktadha wa moja kwa moja unaonyesha kuwa neno linataja dhabihu, si dhambi kama dhana pekee. Tafsiri kuu inahifadhi uhusiano wake wa kileksia na dhambi, na tanbihi inatunza uwezekano wa kusisitiza kazi ya ibada ya kutakasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; msamiati wa kiibada umehifadhiwa bila kuingiza ufafanuzi wa kimadhehebu.
