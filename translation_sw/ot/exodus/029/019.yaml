  text: Then you shall take the second ram, and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: sw
  text: Kisha utamchukua kondoo dume wa pili, na Aroni na wanawe wataweka mikono yao juu ya kichwa cha huyo kondoo dume.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kisha utamchukua
  rationale: Kitenzi hiki katika mfululizo wa maagizo kina nguvu ya amri. “Kisha” kinaonyesha hatua inayofuata katika utaratibu, na kiambishi cha ngeli katika “utamchukua” kinamrejelea kondoo dume aliye hai.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: kondoo dume wa pili
  rationale: אַיִל ni kondoo dume, na הַשֵּׁנִי ni namba ya mpangilio “wa pili,” si tu “mwingine.”
- source_word: וְסָמַךְ
  choice: wataweka
  rationale: Katika muktadha wa dhabihu, סמך hueleza tendo la kiibada la kuweka au kuegemeza mikono juu ya mnyama. “Wataweka” ni Kiswahili cha kawaida na wazi hapa bila kuongeza maana ya ishara hiyo.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aroni na wanawe
  rationale: בָנָיו inawataja wana wa kiume wa Aroni wanaowekwa wakfu kwa ukuhani; “wanawe” ni sahihi na ya asili.
- source_word: אֶת יְדֵיהֶם
  choice: mikono yao
  rationale: Kiebrania kina wingi, “mikono yao,” unaolingana na wahusika wengi.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: juu ya kichwa cha huyo kondoo dume
  rationale: Hii huhifadhi uhusiano wa nafasi ulio wazi katika Kiebrania. “Huyo” humrejelea kwa kawaida kondoo dume wa pili aliyetajwa tayari.
theological_decisions:
- issue: Kueleza tendo la kuwekewa mikono bila kuingiza ufafanuzi wa baadaye wa kitheolojia
  choice: wataweka mikono yao juu ya kichwa cha huyo kondoo dume
  alternative: wataegemeza mikono yao juu ya kichwa cha huyo kondoo dume
  rationale: Aya inaeleza tendo lenyewe lakini haifafanui ishara yake. Tafsiri haiongezi madai kuhusu uhamisho wa hatia, kujitambulisha na dhabihu, au kuwekwa wakfu zaidi ya yale yaliyosemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo unadumisha mfululizo wa maagizo ya ibada bila kuwa mzito au wa kimadhehebu.
