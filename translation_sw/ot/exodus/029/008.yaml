  text: Kisha uwalete wanawe mbele[a], na uwavike kanzu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwasilishe wanawe.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwaleta watu mbele kwa ajili ya kuwasilishwa katika ibada.
