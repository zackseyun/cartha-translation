lexical_decisions:
- source_word: וְאֶת
  choice: Nawe
  rationale: Kiunganishi kinaendeleza mfululizo wa maagizo, huku kiambishi cha yambwa hakitafsiriwi moja kwa moja katika Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Nomino hii inawataja wana wa kiume wa Haruni katika muktadha wa kuwekwa wakfu kuwa makuhani.
- source_word: תַּקְרִיב
  choice: utawaleta ... karibu
  rationale: Hifili ya קרב ina maana ya kuwaleta karibu au kuwasogeza mbele, hasa kwa ajili ya tendo la kiibada; uchaguzi huu huhifadhi taswira hiyo.
- source_word: וְהִלְבַּשְׁתָּם
  choice: na kuwavika
  rationale: Kitenzi hiki humaanisha kuwavisha mavazi; “kuwavika” ni usemi wa kawaida, mfupi na wenye heshima katika Kiswahili.
- source_word: כֻּתֳּנֹת
  choice: kanzu
  rationale: Neno hili hutaja vazi la mwilini lenye umbo la shati refu; “kanzu” ni neno linaloeleweka vizuri katika Kiswahili, bila kulifanya kuwa joho au koti.
