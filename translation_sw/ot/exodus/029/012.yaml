base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/012.yaml
  text: And you shall take some of the blood of the bull and put it on the horns of the altar with your finger[c][b][a], and you shall pour out all the blood at the base of the altar.
translation:
  language: sw
  text: Kisha utachukua baadhi ya damu ya ng'ombe dume[a] na kuitia juu ya pembe za madhabahu[b] kwa kidole chako, halafu utamimina damu yote kwenye msingi wa madhabahu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “kutoka katika damu ya ng''ombe dume”; hapa maana yake ni kuchukua kiasi fulani cha damu.'
    reason: lexical_alternative
  - marker: b
    text: “Pembe” zilikuwa sehemu zilizochomoza kama pembe kwenye kona za madhabahu.
    reason: cultural_note
  - marker: c
    text: Au, “kuelekea kwenye msingi wa madhabahu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kisha utatwaa
  rationale: Kitenzi cha Kiebrania katika mfuatano wa maagizo kina nguvu ya amri ya kiutaratibu; “Kisha utatwaa” ni Kiswahili cha kawaida kinachoonyesha hatua inayofuata.
- source_word: מִדַּם הַפָּר
  choice: sehemu ya damu ya huyo ng'ombe
  rationale: 'Kihusishi מִן kina maana ya kugawa hapa: ni kiasi fulani cha damu kinachotwaliwa. “Huyo ng''ombe” humrejelea ng''ombe aliyetajwa katika muktadha.'
- source_word: וְנָתַתָּה
  choice: na kuipaka
  rationale: Ingawa נתן kwa upana ni “kuweka/kutoa,” katika tendo hili la kutumia kidole kuweka damu juu ya pembe za madhabahu, “kuipaka” hutoa maana ya kitendo kwa uwazi bila kuongeza ufafanuzi wa kiteolojia.
- source_word: עַל קַרְנֹת הַמִּזְבֵּחַ
  choice: kwenye pembe za madhabahu
  rationale: “Pembe” huhifadhi taswira halisi ya קַרְנוֹת, yaani sehemu zilizochomoza kama pembe kwenye kona za madhabahu.
- source_word: בְּאֶצְבָּעֶךָ
  choice: kwa kidole chako
  rationale: Kihusishi בְּ ni cha kifaa; tafsiri hii huhifadhi njia mahsusi ya kutekeleza ibada.
- source_word: וְאֶת כָּל הַדָּם תִּשְׁפֹּךְ
  choice: halafu utamimina damu yote iliyobaki
  rationale: שׁפך ni “kumimina.” Kwa kuwa sehemu ya damu tayari imetwaliwa na kupakwa, “iliyobaki” huwasilisha maana inayodokezwa na mfuatano, ingawa neno hilo halijaandikwa wazi katika Kiebrania.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: kwenye msingi wa madhabahu
  rationale: יְסוֹד humaanisha msingi au sehemu ya chini inayotegemeza madhabahu; “kwenye” huhifadhi uwezekano wa kuelewa אֶל kama kuelekea au kwenye sehemu hiyo.
theological_decisions:
- issue: Umahususi wa istilahi za ibada za madhabahu
  choice: Kuhifadhi “pembe” na “msingi” kama sifa halisi za madhabahu
  alternative: kona za madhabahu; chini ya madhabahu
  rationale: Aya inaeleza utaratibu mahsusi wa kuwekwa wakfu. Istilahi halisi huhifadhi sura ya ibada na uzito wake bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Madhabahu” ni istilahi ya kawaida ya kibiblia; muundo wa sentensi unaonyesha wazi mfuatano wa maagizo ya ibada.
