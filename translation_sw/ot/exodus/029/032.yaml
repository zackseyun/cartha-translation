revisions:
- from: Haruni na wanawe wataila nyama ya kondoo dume na mkate ulio kikapuni, kwenye ingilio la Hema la Kukutania.
  to: Kwenye ingilio la Hema la Kukutania, Haruni na wanawe wataila nyama ya kondoo dume na mkate ulio katika kikapu.
  rationale: The revision corrects the Swahili locative construction and clarifies the scope of “kwenye ingilio la Hema la Kukutania,” while retaining all source-text elements and the formal ritual-instruction register.
  reviewer_model: gpt-5.6-terra
