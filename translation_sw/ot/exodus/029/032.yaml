review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the directive/future force of וְאָכַל, the specific referent “Aaron and his sons,” the ram’s edible flesh, the bread in the basket, and the location at the entrance of the tent of meeting. No disputed source-text issue requires a note.
  naturalness: “Ulio kikapuni” is not idiomatic Standard East African Swahili in this construction. “Ulio katika kikapu” is grammatical and clear. Moving the locative phrase to the front makes it unambiguous that the eating takes place at the entrance, rather than suggesting that the basket is located there.
  terminology: “Haruni,” “wanawe,” “nyama ya kondoo dume,” and “Hema la Kukutania” are suitable biblical-register terminology. “Nyama” appropriately conveys בשר in this food/sacrificial context.
  issues:
  - severity: medium
    issue: 'Unidiomatic locative expression: “mkate ulio kikapuni.”'
    rationale: With a relative clause describing the bread’s location, Standard Swahili naturally uses “ulio katika kikapu” (or “uliyo ndani ya kikapu”).
  - severity: low
    issue: The final locative phrase may attach ambiguously to the immediately preceding basket/bread phrase.
    rationale: The Hebrew locative specifies where Aaron and his sons are to eat. Fronting it in Swahili preserves this relation clearly.
  revised_text: Kwenye ingilio la Hema la Kukutania, Haruni na wanawe wataila nyama ya kondoo dume na mkate ulio katika kikapu.
