base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/032.yaml
  text: Aaron and his sons shall eat the flesh of the ram and the bread that is in the basket at the entrance of the tent of meeting[a].
translation:
  language: sw
  text: Kwenye ingilio la Hema la Kukutania, Haruni na wanawe wataila nyama ya kondoo dume na mkate ulio katika kikapu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אָכַל
  choice: wataila
  rationale: Katika muktadha huu wa maagizo ya ibada, kitenzi hiki kina nguvu ya jambo lililoagizwa kufanywa, si simulizi la wakati uliopita.
- source_word: אַהֲרֹן
  choice: Haruni
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: וּ/בָנָי/ו
  choice: na wanawe
  rationale: Neno la Kiebrania linawahusu wana wa kiume wa Haruni wanaoshiriki ibada ya kuwekwa wakfu kuwa makuhani.
- source_word: בְּשַׂר הָ/אַיִל
  choice: nyama ya kondoo dume
  rationale: Ingawa בשר kimsingi ni mwili/nyama, katika muktadha wa dhabihu linamaanisha nyama inayoliwa; אַיִל ni kondoo dume.
- source_word: הַ/לֶּחֶם
  choice: mkate
  rationale: לחם hapa ni mkate kwa maana ya jumla, kulingana na vyakula vya mkate vilivyotajwa katika muktadha uliotangulia.
- source_word: אֲשֶׁר בַּ/סָּל
  choice: ulio kikapuni
  rationale: Kirai hiki kinamtambulisha mkate kwa mahali ulipo, yaani ndani ya kikapu cha ibada.
- source_word: פֶּתַח
  choice: kwenye ingilio la
  rationale: פתח humaanisha sehemu ya kuingilia au ufunguzi; 'kwenye ingilio la' ni Kiswahili cha kawaida chenye maana ya mahali.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Ni istilahi ya kibiblia iliyozoeleka kwa hema maalumu ambako Mungu alikutana na watu wake.
theological_decisions:
- issue: Lugha inayowataja wanaume katika ukuhani
  choice: na wanawe
  alternative: na watoto wake
  rationale: Muktadha unawahusu wana wa kiume wa Haruni waliowekwa kuwa makuhani, si watoto wake wote kwa ujumla.
- issue: Nguvu ya kitenzi katika agizo la ibada
  choice: wataila
  alternative: waliila; lazima waile
  rationale: Wakati ujao wa Kiswahili hapa unaweza kubeba agizo rasmi la ibada bila kulifanya kuwa simulizi la wakati uliopita wala kuongeza neno la lazima lisilo wazi katika muundo wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. 'Nyama' ni ya asili zaidi kuliko 'mwili' katika muktadha wa chakula cha dhabihu; kwa hiyo hakuna tanbihi inayohitajika. Herufi kubwa katika 'Hema la Kukutania' zinaonyesha jina maalumu la mahali pa ibada.
