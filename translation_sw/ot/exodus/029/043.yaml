  text: Hapo nitakutana na wana wa Israeli[a], na hapo patatakaswa kwa utukufu wangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kinasema “wana wa Israeli,” usemi wa kawaida wa agano unaomaanisha watu wa Israeli.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hakitaji wazi kiima cha “patatakaswa.” Kinaweza kurejelea eneo la patakatifu kwa ujumla, au hasa hema la kukutania au madhabahu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנֹעַדְתִּי
  choice: nitakutana na
  rationale: Kitenzi יעד katika Niphal, katika muktadha wa hema la kukutania, kinaonyesha kukutana kwa wakati na mahali palipopangwa. “Nitakutana na” ni Kiswahili cha kawaida kinachohifadhi wazo la mkutano wa Mungu na watu wake.
- source_word: שָׁמָּה
  choice: hapo
  rationale: Kielezi hiki cha mahali kinarejelea eneo la patakatifu lililotajwa katika muktadha. “Hapo” ni cha asili na sahihi kwa rejeo hilo.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: na wana wa Israeli
  rationale: Kihusishi ל pamoja na יעד kinaeleweka kwa maana ya kukutana “na.” “Wana wa Israeli” huhifadhi tamko la Kiebrania na maana yake ya kiagano, huku tanbihi ikitoa “Waisraeli” kama usemi wa kawaida zaidi.
- source_word: וְנִקְדַּשׁ
  choice: patatakaswa
  rationale: 'Niphal ya קדש ni ya hali tendwa: kufanywa patakatifu. Kiswahili “patatakaswa” huhifadhi hali hiyo ya kutendwa na kuelekeza kwa ujumla kwenye eneo linalozungumziwa bila kutaja moja kwa moja hema au madhabahu.'
- source_word: בִּכְבֹדִי
  choice: kwa utukufu wangu
  rationale: Kihusishi ב hapa kinaweza kuonyesha chombo au sababu; “kwa utukufu wangu” huonyesha kwamba utukufu wa Mungu ndio unaofanya mahali hapo kuwa patakatifu.
theological_decisions:
- issue: Kiima kisichotajwa cha וְנִקְדַּשׁ
  choice: mahali hapo patatakaswa
  alternative: hema la kukutania litatakaswa; madhabahu itatakaswa; yeye atatakaswa
  rationale: Kitenzi cha Kiebrania hakitaji kiima waziwazi. Muktadha unahusu eneo na vitu vya patakatifu. “Mahali hapo” ni usemi mpana unaoacha wazi kama kinachokusudiwa hasa ni hema la kukutania, madhabahu, au eneo la patakatifu kwa ujumla; tanbihi inaeleza utata huo.
- issue: Maana ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Tamko la Kiebrania ni la kawaida kwa jumuiya yote ya agano. Tafsiri kuu inalihifadhi kwa uwazi, na tanbihi inaonyesha kisawe cha kawaida cha Kiswahili bila kulifanya lihusu wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa urahisi. “Patatakaswa” huhifadhi hali tendwa ya Kiebrania; “wana wa Israeli” huhifadhi usemi wa asili huku tanbihi ikifafanua maana yake ya kijumuiya.
