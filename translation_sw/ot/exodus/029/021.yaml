source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ מִן הַ/דָּ֨ם אֲשֶׁ֥ר עַֽל הַ/מִּזְבֵּחַ֮ וּ/מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָה֒ וְ/הִזֵּיתָ֤ עַֽל אַהֲרֹן֙ וְ/עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וְ/קָדַ֥שׁ הוּא֙ וּ/בְגָדָ֔י/ו וּ/בָנָ֛י/ו וּ/בִגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/021.yaml
  text: Then you shall take some of the blood that is on the altar and some of the anointing oil[a], and sprinkle it on Aaron and on his garments and on his sons and on the garments of his sons with him; and he and his garments shall be holy, and his sons and the garments of his sons with him.
translation:
  language: sw
  text: Kisha utachukua sehemu ya damu iliyo juu ya madhabahu na sehemu ya mafuta ya upako, nawe utazinyunyiza juu ya Haruni, juu ya mavazi yake, juu ya wanawe, na juu ya mavazi ya wanawe pamoja naye. Naye, mavazi yake, wanawe, na mavazi ya wanawe pamoja naye watakuwa watakatifu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wawekwe wakfu.” Kiebrania kinasema kihalisi, “watakuwa watakatifu,” kikionyesha hali ya utakatifu inayotokana na tendo hili la kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַחְתָּ
  choice: utachukua
  rationale: Muundo wa kitenzi katika mfululizo wa maagizo una nguvu ya agizo linalofuata; wakati ujao wa Kiswahili huwasilisha maana hiyo kwa kawaida.
- source_word: מִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: sehemu ya damu iliyo juu ya madhabahu
  rationale: מִן hapa huonyesha kiasi kinachotwaliwa kutoka katika damu, hivyo ‘sehemu ya’ ni wazi na ya asili; kishazi cha uhusiano kinahifadhiwa.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: mafuta ya upako
  rationale: Hili ni neno la kawaida na linaloeleweka kwa mafuta yaliyotumiwa katika ibada ya kupaka.
- source_word: הִזֵּיתָ
  choice: utamnyunyizia
  rationale: Katika muktadha wa ibada, kitenzi hiki humaanisha kunyunyiza kimiminika juu ya mtu au kitu. Kiambishi cha yambwa kinamrejelea Haruni, huku vitu vingine vikifuatishwa kwa ‘na.’
- source_word: בְּגָדָיו / בִּגְדֵי בָנָיו
  choice: mavazi yake / mavazi ya wanawe
  rationale: ‘Mavazi’ ni neno la jumla linalofaa muktadha wa kikuhani bila kuingiza istilahi za baadaye za kidini.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Kiebrania kinataja wana wa kiume wa Haruni katika muktadha wa ukuhani; ‘wanawe’ huhifadhi umahususi huo.
- source_word: אִתּוֹ
  choice: walio pamoja naye
  rationale: Kauli hii inaonyesha kuwa wana wa Haruni wanashiriki hali hiyo pamoja naye, na ni ya kawaida katika Kiswahili sanifu.
- source_word: וְקָדַשׁ
  choice: atakuwa mtakatifu
  rationale: Kitenzi kinaeleza hali inayotokana na tendo la kunyunyiza. ‘Atakuwa mtakatifu’ huhifadhi moja kwa moja dhana ya msingi ya קדשׁ bila kuibana kuwa istilahi ya kiufundi pekee.
theological_decisions:
- issue: Namna ya kutafsiri matokeo ya utakaso wa kiibada
  choice: atakuwa mtakatifu
  alternative: atawekwa wakfu
  rationale: Tafsiri iliyochaguliwa huhifadhi kategoria ya maandiko yenyewe ya utakatifu. Mbadala unawezekana katika muktadha huu, lakini unaeleza zaidi tendo la kuweka wakfu kuliko hali ya utakatifu inayotajwa na Kiebrania.
- issue: Uhusiano wa hali ya utakatifu na Haruni, mavazi yake, wanawe na mavazi yao
  choice: Naye atakuwa mtakatifu, pamoja na mavazi yake, wanawe na mavazi ya wanawe
  alternative: Yeye, mavazi yake, wanawe na mavazi yao watakuwa watakatifu
  rationale: Kiebrania kina kitenzi cha umoja kinachomrejelea Haruni na kisha kuorodhesha wengine pamoja naye. Muundo wa Kiswahili uliotumiwa huhifadhi umoja huo huku ukionyesha kuwa hali inayotajwa inawahusu wote walioorodheshwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Madhabahu,’ ‘mafuta ya upako,’ na ‘mtakatifu’ ni istilahi zilizozoeleka katika muktadha wa kibiblia. Urudiaji wa ‘mavazi’ na ‘wanawe’ umehifadhiwa kwa sababu ni sehemu ya msisitizo na mpangilio wa Kiebrania.
