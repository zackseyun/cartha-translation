  to: Kisha utachukua sehemu ya damu iliyo juu ya madhabahu na sehemu ya mafuta ya upako, nawe utazinyunyiza juu ya Haruni, juu ya mavazi yake, juu ya wanawe, na juu ya mavazi ya wanawe pamoja naye. Naye, mavazi yake, wanawe, na mavazi ya wanawe pamoja naye watakuwa watakatifu[a].
  rationale: Marekebisho yanaondoa utata wa kisarufi katika tendo la kunyunyiza kwa kutumia “juu ya” kama ilivyo katika עַל ya Kiebrania, na yanaweka wazi kwamba athari ya ibada inawahusu wote waliotajwa. Tanbihi imerekebishwa ili ilingane na kiima cha pamoja katika Kiswahili, huku ikihifadhi kwamba Kiebrania hutumia lugha ya kuwa watakatifu.
