  verdict: revise
  source_fidelity: 'Rasimu inafuata kwa karibu vipengele vya msingi vya Kiebrania: kiasi cha damu iliyo madhabahuni, mafuta ya upako, Haruni, mavazi, wana, na matokeo ya utakatifu. Hata hivyo, “utamnyunyizia Haruni” hubadili uhusiano wa kisarufi wa הִזֵּיתָ עַל: inaelekea kumaanisha kumnyunyizia/kumnyunyizia kwa niaba ya Haruni, badala ya kunyunyiza juu yake. Pia kiima cha umoja katika “Naye atakuwa mtakatifu” kinaweza kuwafanya waliobaki waonekane kama nyongeza tu, ilhali orodha yote inahusika na hali hiyo.'
