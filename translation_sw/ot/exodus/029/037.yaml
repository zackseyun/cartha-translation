base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/037.yaml
  text: For seven days you shall make atonement for the altar and consecrate it[a], and the altar shall be most holy. Whatever touches the altar shall become holy.
translation:
  language: sw
  text: Kwa siku saba utafanya upatanisho kwa ajili ya madhabahu na kuiweka wakfu; nayo madhabahu itakuwa takatifu sana. Chochote kinachogusa madhabahu kitakuwa kitakatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kila anayegusa madhabahu atakuwa mtakatifu.” Kiebrania kinaweza kueleweka kuwa utakatifu unatolewa kwa kugusa madhabahu, au kuwa ni kilicho kitakatifu tu kinachopaswa kuigusa.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּכַפֵּר
  choice: utafanya upatanisho
  rationale: Katika muktadha wa ibada ya kikuhani, kitenzi hiki kinaeleza kufanya tendo la upatanisho au utakaso wa kiibada. “Kufanya upatanisho” ni usemi unaoeleweka bila kufafanua kupita kiasi namna tendo hilo linavyofanya kazi.
- source_word: עַל הַמִּזְבֵּחַ
  choice: kwa ajili ya madhabahu
  rationale: Pamoja na kitenzi כפר, kihusishi עַל humtaja anayefanyiwa au kitu kinachofanyiwa upatanisho. “Kwa ajili ya madhabahu” linaonyesha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: na kuitakasa
  rationale: “Kuitakasa” linafaa katika maagizo ya ibada na linaonyesha kuiweka madhabahu wakfu kuwa takatifu.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: takatifu sana
  rationale: Muundo huu wa Kiebrania huonyesha kiwango cha juu kabisa cha utakatifu. “Takatifu sana” ni wa kawaida na wazi katika Kiswahili.
- source_word: כָּל הַנֹּגֵעַ
  choice: chochote kinachogusa
  rationale: Kirai cha Kiebrania kinaweza kumaanisha mtu au kitu chochote kinachogusa. “Chochote kinachogusa” huhifadhi upana huo kadiri inavyowezekana katika Kiswahili, huku uwezekano wa kurejelea watu ukitajwa katika tanbihi.
- source_word: יִקְדָּשׁ
  choice: kitakuwa kitakatifu
  rationale: Kitenzi kinaweza kueleza hali ya kuwa takatifu inayotokana na kugusa madhabahu. Tafsiri hii haitumii “kutakaswa,” ambalo lingeweza kusisitiza tendo rasmi la kuwekwa wakfu kuliko lilivyo katika Kiebrania.
theological_decisions:
- issue: Maana ya utakatifu unaohusishwa na kugusa madhabahu
  choice: Kinachogusa madhabahu kinakuwa kitakatifu kwa kugusana nayo.
  alternative: Ni mtu au kitu kilicho kitakatifu tu kinachoruhusiwa kugusa madhabahu; au kila mtu anayeigusa atakuwa mtakatifu.
  rationale: Maana ya moja kwa moja ya יִקְדָּשׁ baada ya “chochote kinachogusa madhabahu” inaweza kueleweka kuwa mgusaji au kitu kinachogusa kinakuwa kitakatifu. Hata hivyo, Kiebrania pia kimeeleweka kama sharti la kwamba ni kilicho kitakatifu pekee kinachopaswa kuigusa. Tanbihi inalihifadhi jambo hili lisitatuliwe kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Istilahi “madhabahu,” “upatanisho,” na “takatifu” zimehifadhiwa kwa sababu ni za msingi katika muktadha wa ibada na zinatumika kwa upana katika Kiswahili cha Biblia.
