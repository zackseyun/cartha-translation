base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/027.yaml
  text: And you shall consecrate the breast of the wave offering and the thigh of the contribution[a], which was waved and which was raised, from the ram of ordination[b], from what was Aaron's and from what was his sons'.
translation:
  language: sw
  text: Nawe utakitakasa kifua cha sadaka ya kutikiswa na paja la toleo lililoinuliwa[a], ambacho kilitikiswa na ambacho kiliinuliwa, kutoka katika kondoo dume wa ibada ya kuwaweka makuhani wakfu[b], kutoka katika kilichokuwa cha Aroni na kutoka katika kilichokuwa cha wanawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “paja la toleo la kuinuliwa”; kwa mapokeo huitwa pia “sadaka ya kuinuliwa.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kondoo dume wa mijazo,” nahau ya kondoo dume aliyetumiwa katika ibada ya kuwaweka makuhani wakfu.'
    reason: cultural_note
lexical_decisions:
- source_word: קִדַּשְׁתָּ
  choice: utaitakasa
  rationale: Piel ya קדשׁ humaanisha kutenga kitu kuwa kitakatifu; “utaitakasa” ni lugha ya kawaida yenye uzito unaofaa katika muktadha wa ibada.
- source_word: חֲזֵה
  choice: sehemu ya kidari
  rationale: Neno hili hutaja sehemu ya mbele ya kifua cha mnyama katika sheria za dhabihu; “sehemu ya kidari” huepuka kueleweka kama kifua cha binadamu.
- source_word: תְּנוּפָה
  choice: sadaka ya kutikiswa
  rationale: Huhifadhi tendo halisi la kiibada linalohusiana na kitenzi נוף katika mstari huu.
- source_word: שׁוֹק
  choice: paja
  rationale: Hutaja sehemu ya juu ya mguu wa nyuma wa mnyama, hivyo ni sahihi zaidi kuliko “mguu” kwa ujumla.
- source_word: תְּרוּמָה
  choice: toleo lililoinuliwa
  rationale: Huonyesha kitu kilichotengwa na kuinuliwa kama toleo, huku ikihifadhi uhusiano na kitenzi הוּרָם.
- source_word: הוּנַף
  choice: vilivyotikiswa
  rationale: Hophal ya נוף; tafsiri inahifadhi tendo la ibada na uhusiano wake na “sadaka ya kutikiswa.”
- source_word: הוּרָם
  choice: kuinuliwa
  rationale: Hophal ya רום; “kuinuliwa” huhifadhi tendo halisi na uhusiano wake na תְּרוּמָה.
- source_word: אֵיל הַמִּלֻּאִים
  choice: kondoo dume wa kuwekwa wakfu
  rationale: Ni nahau ya kondoo dume aliyetumiwa katika ibada ya kuwaingiza makuhani rasmi katika huduma.
- source_word: מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  choice: sehemu iliyokuwa ya Aroni na sehemu iliyokuwa ya wanawe
  rationale: Huonyesha mgawanyo wa sehemu zilizohusishwa na Aroni na wanawe bila kuficha muundo wa umilikaji wa Kiebrania.
theological_decisions:
- issue: Utafsiri wa istilahi za kiufundi za dhabihu
  choice: 'Kuhifadhi lugha halisi ya matendo ya ibada: “sadaka ya kutikiswa,” “toleo lililoinuliwa,” “vilivyotikiswa,” na “kuinuliwa.”'
  alternative: Kutumia maneno ya jumla kama “sadaka ya kuwasilishwa” au “sehemu maalumu.”
  rationale: Mstari huu ni agizo la ibada ya kikuhani, na Kiebrania huunganisha kwa makusudi nomino na vitenzi vya matendo hayo. Kuyahifadhi huepuka kufifisha utaratibu wa ibada au kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kidari” imetumiwa kwa sehemu ya kifua cha mnyama; “kuwekwa wakfu” ni wazi kwa wasomaji wa kawaida na inafaa kwa muktadha wa kuingizwa katika huduma ya kikuhani.
