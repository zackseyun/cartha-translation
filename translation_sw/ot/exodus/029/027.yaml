  source_fidelity: 'Rasimu inafuata maana ya Kiebrania kwa ujumla na huhifadhi istilahi za ibada. Hata hivyo, “yaani” huongeza uhusiano wa ufafanuzi usio katika matini, na “vilivyotikiswa na kuinuliwa” hufanya sehemu zote mbili zionekane kana kwamba kila moja ilifanyiwa matendo yote mawili. Kiebrania hutenganisha kwa vifungu viwili vya umoja: kile kilichotikiswa na kile kilichoinuliwa.'
