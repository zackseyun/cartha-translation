lexical_decisions:
- source_word: לֶחֶם מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: Usemi huu unamaanisha mkate usio na chachu; wingi wa Kiswahili unafaa katika orodha ya vitu vya ibada.
- source_word: חַלֹּת מַצֹּת
  choice: mikate midogo isiyotiwa chachu
  rationale: חַלָּה hapa ni aina ya mkate au donge lililookwa. 'Mikate midogo' huitofautisha na mikate ya jumla na ile myembamba inayofuata bila kulazimisha umbo lisilotajwa wazi.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: iliyochanganywa na mafuta
  rationale: Kitenzi בלל kinaonyesha kuchanganya viambato; tafsiri hii ni ya kawaida na inaeleza njia ya utayarishaji.
- source_word: רְקִיקֵי מַצּוֹת
  choice: mikate myembamba isiyotiwa chachu
  rationale: רָקִיק ni mkate mwembamba; usemi huu ni wazi kwa wasomaji wa Kiswahili na unadumisha tofauti na חַלּוֹת.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: iliyopakwa mafuta
  rationale: Ingawa משׁח kwa kawaida humaanisha 'kutia mafuta', katika utayarishaji wa mikate maana ya kupaka mafuta ndiyo ya kawaida na iliyo wazi zaidi.
- source_word: סֹלֶת חִטִּים
  choice: unga laini wa ngano
  rationale: סֹלֶת ni unga laini, na חִטִּים hutaja nafaka kuwa ngano.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: vitengeneze
  rationale: Amri hii ya moja kwa moja inawasilisha nguvu ya maagizo ya ibada kwa Kiswahili cha asili.
