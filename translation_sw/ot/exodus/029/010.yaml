base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/010.yaml
  text: You shall bring the bull before the tent of meeting[a], and Aaron and his sons shall lay their hands on the head of the bull.
translation:
  language: sw
  text: Utamleta[a] fahali huyo mbele ya Hema la Kukutania, kisha Aroni na wanawe wataweka mikono yao juu ya kichwa cha fahali huyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utamwasilisha” au “utamleta karibu” fahali huyo mbele ya Hema la Kukutania.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Utamleta
  rationale: Hifili ya קרב katika muktadha wa dhabihu humaanisha kuleta karibu au kuwasilisha. “Utamleta” ni ya kawaida na wazi, huku kirai kinachofuata kikihifadhi mwelekeo wa tendo hilo.
- source_word: הַפָּר
  choice: huyo fahali
  rationale: פַּר humaanisha fahali, mara nyingi fahali mchanga katika matumizi ya dhabihu. “Fahali” ni neno la kawaida na sahihi; “huyo” humrejelea mnyama aliyetajwa katika muktadha wa karibu.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Kirai hiki huonyesha mahali palipo mbele ya kitu au katika uwepo wake. “Mbele ya” ni tafsiri ya asili na inayofaa mazingira ya ibada.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni jina la mahali patakatifu ambapo Mungu hukutana na watu wake. “Hema la kukutania” ni istilahi iliyoeleweka katika Kiswahili cha Biblia na huhifadhi maana ya kusudi la hema hilo.
- source_word: וְסָמַךְ
  choice: wataweka
  rationale: סמך pamoja na mikono juu ya kichwa cha mnyama wa dhabihu hueleza tendo rasmi la kuweka au kuegemeza mikono. “Wataweka” ni wazi na haliongezi tafsiri ya maana ya kiishara.
- source_word: יְדֵיהֶם
  choice: mikono yao
  rationale: Kiebrania kina wingi, kwa hiyo tafsiri inadumisha “mikono yao” bila kuibadili kuwa umoja.
- source_word: עַל רֹאשׁ הַפָּר
  choice: juu ya kichwa cha huyo fahali
  rationale: Tafsiri hii huhifadhi tendo halisi na uhusiano wa mahali unaoonyeshwa na Kiebrania.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aroni na wanawe
  rationale: בנים hapa ni wana wa kiume wa Aroni wanaowekwa wakfu kwa huduma ya ukuhani; “wanawe” ni sahihi kimuktadha.
theological_decisions:
- issue: Kuweka mikono juu ya mnyama wa dhabihu
  choice: wataweka mikono yao juu ya kichwa cha huyo fahali
  alternative: wataegemeza mikono yao juu ya kichwa cha huyo fahali
  rationale: Aya inaeleza tendo la ibada lakini haifafanui maana yake ya kitheolojia. Tafsiri inadumisha tendo hilo bila kuingiza wazo lisilotajwa wazi, kama kuhamishwa kwa hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri ya wakati ujao umedumishwa, na istilahi za ibada hazijapanuliwa kwa mafundisho yasiyotajwa katika aya.
