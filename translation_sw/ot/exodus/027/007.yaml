  text: Its poles shall be put into the rings[b][a], and the poles shall be on the two sides of the altar when it is carried.
translation:
  language: sw
  text: Miti yake ya kubebea itaingizwa katika pete[a], nayo miti hiyo itakuwa kwenye pande mbili[b] za madhabahu wakati wa kuibeba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “italetwa katika pete.” Kitenzi cha Kiebrania kiko katika hali ya kutendwa, na hapa kinaeleza kuwekwa kwa miti hiyo kwa ajili ya kubeba madhabahu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania “pande” (צַלְעֹת); neno hili, kulingana na muktadha, linaweza pia kumaanisha vipande vya pembeni au ubavu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּבָא
  choice: itaingizwa
  rationale: Hifadhia hali ya kutendwa ya Hophal na kwa Kiswahili cha kawaida inaeleza wazi kuingizwa kwa miti katika pete.
- source_word: בַדָּיו / הַבַּדִּים
  choice: miti yake ya kubebea / miti hiyo
  rationale: בַּד hapa ni miti ya kusafirishia vyombo vitakatifu; “miti ya kubebea” ni wazi na ya kisasa, kisha “miti hiyo” huepuka urudiaji mzito.
- source_word: בַּטַּבָּעֹת
  choice: katika pete
  rationale: ב inaonyesha mahali pa kuingiza; “katika pete” ni usemi wa kawaida na hauongezi wazo lisilotajwa la kupitisha hadi upande mwingine.
- source_word: וְהָיוּ
  choice: itakuwa
  rationale: Inaendeleza agizo na kueleza mahali miti hiyo itakapokuwa baada ya kuingizwa.
- source_word: עַל שְׁתֵּי צַלְעֹת
  choice: kwenye pande mbili
  rationale: צלעות inaweza kumaanisha pande, ubavu, au vipande vya pembeni; “pande mbili” ni ya kawaida na huhifadhi upana wa maana.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Neno la kawaida la Kiswahili kwa מזבח katika muktadha wa ibada.
- source_word: בִּשְׂאֵת אֹתוֹ
  choice: wakati wa kuibeba
  rationale: Infinitivu pamoja na ב inaonyesha hali au wakati wa tendo; muundo huu ni wa asili na haumtambui mbebaji ambaye Kiebrania hakumtaji.
