  text: וְ/כֵ֨ן לִ/פְאַ֤ת צָפוֹן֙ בָּ/אֹ֔רֶךְ קְלָעִ֖ים מֵ֣אָה אֹ֑רֶךְ ו/עמד/ו עֶשְׂרִ֗ים וְ/אַדְנֵי/הֶ֤ם עֶשְׂרִים֙ נְחֹ֔שֶׁת וָוֵ֧י הָֽ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/011.yaml
  text: 'And likewise for the north side in length: hangings a hundred cubits long[a], its twenty pillars and their twenty bronze bases[b], and the hooks of the pillars and their bands shall be silver.'
translation:
  language: sw
  text: Vivyo hivyo, upande wa kaskazini, kwa urefu wake, utakuwa na mapazia yenye urefu wa dhiraa mia moja[a], nguzo zake ishirini na vitako vyake ishirini vya shaba. Kulabu za nguzo na mikanda yake[b] zitakuwa za fedha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema tu ‘mia moja kwa urefu’; neno ‘dhiraa’ limeongezwa kutokana na vipimo vya maskani vilivyo katika muktadha wa karibu.
    reason: cultural_note
  - marker: b
    text: Au ‘vipande vyake vya kuunganisha’; neno la Kiebrania linamaanisha vipande vinavyohusishwa na nguzo, ambavyo huenda vilizizunguka au kuziunganisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: Vivyo hivyo
  rationale: Inaonyesha kwamba vipimo na mpangilio wa upande wa kaskazini vinafanana na vile vya upande uliotajwa kabla.
- source_word: לִפְאַת צָפוֹן
  choice: upande wa kaskazini
  rationale: פֵּאָה hapa ni upande au ukingo wa ua; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: בָּאֹרֶךְ
  choice: kwa urefu wake
  rationale: Inahifadhi wazo la kipimo cha upande huo kwa kufuata mwelekeo wa urefu.
- source_word: קְלָעִים
  choice: mapazia
  rationale: Katika muktadha wa ua wa maskani, neno hili linamaanisha vitambaa vilivyotundikwa na kuunda uzio; ‘mapazia’ ni neno la kawaida na linaloeleweka.
- source_word: מֵאָה אֹרֶךְ
  choice: yenye urefu wa dhiraa mia moja
  rationale: Kiebrania kinasema kihalisi ‘mia moja kwa urefu’; kipimo cha dhiraa kinaeleweka kutokana na vipimo vya karibu katika muktadha na kinatajwa wazi ili Kiswahili kieleweke.
- source_word: וְעַמֻּדָיו עֶשְׂרִים
  choice: nguzo zake ishirini
  rationale: Inadumisha muundo wa orodha ya Kiebrania na kiambishi kinachorejelea mpangilio wa upande huo.
- source_word: וְאַדְנֵיהֶם עֶשְׂרִים נְחֹשֶׁת
  choice: vikalio vyake ishirini vya shaba
  rationale: אֶדֶן ni kalio au tundu la chini linaloshikilia nguzo. ‘Vikalio’ linaeleza kazi hiyo bila kutumia neno la kiufundi lisiloeleweka; ‘shaba’ ni jina la kawaida la nyenzo hii katika Kiswahili cha Biblia.
- source_word: וָוֵי הָעַמֻּדִים
  choice: kulabu za nguzo
  rationale: וָוִים ni kulabu au vigingi vilivyowekwa kwenye nguzo; ‘kulabu’ linafaa zaidi kwa vifaa vya kutundikia mapazia.
- source_word: וַחֲשֻׁקֵיהֶם
  choice: mikanda yake
  rationale: Neno hili linahusu vipande vinavyozunguka au kuunganisha nguzo. ‘Mikanda’ ni la kawaida na linabaki pana bila kuamua kwa uhakika umbo au kazi yake.
- source_word: כָּסֶף
  choice: fedha
  rationale: Ni jina la moja kwa moja la nyenzo iliyotajwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ya kwanza imetumia ‘utakuwa na’ ili kufanya muundo usio na kitenzi wa Kiebrania ueleweke kwa msomaji wa kawaida, huku orodha na vipimo vikihifadhiwa. Alama za tanbihi zimewekwa kwenye ‘dhiraa mia moja’ na ‘mikanda yake’ ili zilingane na maelezo husika.
