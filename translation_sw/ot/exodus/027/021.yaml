base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/021.yaml
  text: In the tent of meeting[a], outside the veil that is before the testimony, Aaron and his sons shall arrange it before Yahweh from evening until morning[c][b]. It shall be a perpetual statute throughout their generations from the Israelites.
translation:
  language: sw
  text: Katika hema la kukutania, nje ya pazia[a] lililo mbele ya Ushuhuda[b], Aroni na wanawe wataipanga taa hiyo[c] mbele ya Yahwe, tangu jioni hadi asubuhi. Hii itakuwa sheria ya kudumu kwa Waisraeli katika vizazi vyao vyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nje ya kitambaa cha kutenga.” Hili ni pazia lililotenga sehemu ya ndani kabisa ya hema.
    reason: lexical_alternative
  - marker: b
    text: “Ushuhuda” huenda unamaanisha vibao vya agano vilivyowekwa ndani ya sanduku; kwa hiyo pazia lilikuwa mbele ya sanduku hilo.
    reason: cultural_note
  - marker: c
    text: Kiebrania hutumia kiwakilishi cha umoja, “hiyo,” kinachorejelea taa iliyotajwa katika aya iliyotangulia. Kitenzi kinaweza pia kutafsiriwa “wataiiweka kwa utaratibu” au “wataiitayarisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika hema la kukutania
  rationale: Ni istilahi ya kawaida na inayoeleweka kwa hema takatifu ambako Yahwe alikutana na watu wake.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: nje ya pazia
  rationale: פָּרֹכֶת ni pazia la ndani lililotenga Patakatifu Zaidi; ‘pazia’ ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: אֲשֶׁר עַל הָעֵדֻת
  choice: lililo mbele ya Ushuhuda
  rationale: עַל hapa inaeleza mahali pa pazia kuhusiana na Ushuhuda. ‘Mbele ya’ inafaa kwa mpangilio wa hema, huku ‘Ushuhuda’ ikihifadhi istilahi ya Kiebrania bila kuifafanua ndani ya aya.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: wataitengeneza taa hiyo
  rationale: ערך humaanisha kupanga au kuweka tayari. Katika muktadha, kiwakilishi cha umoja kinarejelea taa ya aya iliyotangulia; ‘kuitengeneza’ hapa ni kuitayarisha na kuihudumia ili iwake ipasavyo.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: tangu jioni hadi asubuhi
  rationale: Huwasilisha wazi kipindi chote cha huduma ya taa wakati wa usiku.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi nahau ya ibada na jina la agano יְהוָה kwa umbo la ‘Yahwe’.
- source_word: חֻקַּת עוֹלָם
  choice: sheria ya kudumu
  rationale: Huhifadhi nguvu ya kisheria na mwendelezo unaokusudiwa na עוֹלָם bila kulazimisha maana ya kifalsafa ya kutokuwa na mwisho kabisa.
- source_word: לְדֹרֹתָם מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: katika vizazi vyao vyote, inayowapasa Waisraeli
  rationale: Kiswahili hiki cha kawaida huonyesha kwamba agizo hilo ni wajibu unaowahusu Waisraeli katika vizazi vinavyofuatana, badala ya tafsiri isiyo ya kawaida ‘kutoka kwa Waisraeli.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חֻקַּת עוֹלָם katika sheria ya ibada
  choice: sheria ya kudumu
  alternative: sheria ya milele
  rationale: ‘Ya kudumu’ huonyesha uendelevu wa agizo katika vizazi bila kuamua zaidi ya nahau ya kisheria ya Kiebrania.
- issue: Rejeleo la הָעֵדֻת
  choice: Ushuhuda
  alternative: mbao za Ushuhuda
  rationale: Maandishi yenyewe yanasema ‘Ushuhuda.’ Tafsiri kuu inahifadhi istilahi hiyo, huku tanbihi ikieleza rejeleo lake linalowezekana kwa mbao za agano ndani ya sanduku.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Istilahi za ibada zimehifadhiwa bila kuwa nzito kupita kiasi; sentensi ya mwisho imepangwa kwa Kiswahili cha kawaida ili kuonyesha wajibu wa Waisraeli.
