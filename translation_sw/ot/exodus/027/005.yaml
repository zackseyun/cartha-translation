  text: And you shall put it under the ledge of the altar from below[b][a], and the net shall extend to halfway up the altar.
translation:
  language: sw
  text: Nawe utauweka chini ya ukingo wa madhabahu, kutoka chini,[a] na wavu huo utaenea hadi katikati ya madhabahu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chini ya fremu ya madhabahu, kutoka chini.” Neno la Kiebrania linalotafsiriwa “ukingo” huenda likamaanisha ukingo, fremu, au sehemu iliyojitokeza ya madhabahu.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “na wavu utakuwa hadi nusu ya madhabahu”; yaani, utaenea hadi katikati ya madhabahu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Nawe utauweka
  rationale: Kitenzi נתן katika agizo hili kina maana ya kuweka; umbo la wakati ujao linabeba nguvu ya maagizo, na kiambishi -u- kinarejelea wavu wa shaba uliotajwa katika mstari uliotangulia.
- source_word: תַּחַת
  choice: chini ya
  rationale: Huwasilisha kwa kawaida uhusiano wa mahali palipo chini ya kitu kingine.
- source_word: כַּרְכֹּב
  choice: ukingo
  rationale: Neno hili adimu linaonyesha sehemu iliyojitokeza kama ukingo au kisahani katika muundo wa madhabahu; “ukingo” ni wazi na halifanyi maelezo ya kimuundo kuwa mahususi kupita ushahidi.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa מזבח katika maagizo ya maskani.
- source_word: מִלְּמָטָּה
  choice: upande wa chini
  rationale: Huhifadhi maelezo ya nafasi ya sehemu ya chini bila kudai kwa uhakika zaidi namna halisi ya kuifunga.
- source_word: הָרֶשֶׁת
  choice: wavu huo
  rationale: רשת ni muundo wa kimatundu kama wavu; “huo” huonyesha kuwa ni wavu uliotajwa tayari.
- source_word: עַד חֲצִי הַמִּזְבֵּחַ
  choice: mpaka katikati ya madhabahu
  rationale: Tafsiri hii inafuata kwa karibu kikomo kinachoelezwa na Kiebrania, bila kuongeza waziwazi mwelekeo wa kwenda juu ambao unatokana na muktadha.
