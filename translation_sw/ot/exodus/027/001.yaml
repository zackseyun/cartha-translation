base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/001.yaml
  text: You shall make the altar of acacia wood[a], five cubits long and five cubits wide; the altar shall be square, and its height shall be three cubits.
translation:
  language: sw
  text: “Nawe utaitengeneza madhabahu kwa mbao za mshita, urefu wake dhiraa tano na upana wake dhiraa tano. Madhabahu hiyo itakuwa mraba, na kimo chake kitakuwa dhiraa tatu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utaitengeneza
  rationale: Katika muktadha wa maagizo, kitenzi hiki chenye kiunganishi kina nguvu ya amri. ‘Nawe utaitengeneza’ huhifadhi mwendelezo wa maagizo na kueleza agizo hilo kwa Kiswahili cha kawaida.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: ‘Madhabahu’ ndilo neno la kawaida na lenye hadhi katika Kiswahili kwa mahali au jengo la kutolea dhabihu.
- source_word: עֲצֵי שִׁטִּים
  choice: kwa mbao za mshita
  rationale: Kirai hiki kinaonyesha nyenzo iliyotumiwa. ‘Mbao za mshita’ ni tafsiri ya kawaida ya aina hii ya mbao na kinaeleweka kwa wasomaji wa Kiswahili.
- source_word: חָמֵשׁ אַמּוֹת אֹרֶךְ
  choice: urefu wake dhiraa tano
  rationale: Muundo huu huwasilisha kipimo cha urefu kwa Kiswahili cha kawaida huku ukihifadhi kipimo cha kale cha dhiraa.
- source_word: וְחָמֵשׁ אַמּוֹת רֹחַב
  choice: na upana wake dhiraa tano
  rationale: Tafsiri hii inaendeleza usambamba wa vipimo vya urefu na upana kwa uwazi.
- source_word: רָבוּעַ יִהְיֶה
  choice: itakuwa mraba
  rationale: רָבוּעַ hueleza umbo lenye pande nne sawa; ‘mraba’ ni neno la sasa, wazi na sahihi.
- source_word: וְשָׁלֹשׁ אַמּוֹת קֹמָתוֹ
  choice: na kimo chake kitakuwa dhiraa tatu
  rationale: ‘Kimo chake’ huhifadhi maana ya nomino קֹמָה pamoja na kiambishi chake cha umilikaji, na sentensi inasomeka kwa kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Neno ‘dhiraa’ limehifadhiwa kama kipimo cha kale kinachotumika kwa kawaida katika tafsiri za Biblia. Tanbihi ya Kiingereza haikuhamishwa kwa sababu mahali pa alama yake hakulingani na maelezo yake, na neno la Kiebrania רָבוּעַ linatafsirika wazi kuwa ‘mraba’ bila kuhitaji tanbihi.
