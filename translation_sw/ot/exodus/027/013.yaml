  text: Na upana wa ua upande wa mashariki[a], kuelekea maawio ya jua, utakuwa dhiraa hamsini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na upana wa ua kwa upande wa mashariki, kuelekea mashariki, utakuwa dhiraa hamsini.”
    reason: Njia nyingine ya kuonyesha uradidi wa maneno mawili ya mwelekeo katika Kiebrania.
lexical_decisions:
- source_word: וְרֹחַב
  choice: Na upana
  rationale: רֹחַב humaanisha upana. Kiunganishi וְ kimetafsiriwa “Na” ili kudumisha mtiririko wa maelezo yanayofuatana kuhusu ua.
- source_word: הֶחָצֵר
  choice: wa ua
  rationale: חָצֵר hapa ni eneo la nje lililozungushiwa la maskani; “ua” ni neno la kawaida na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: לִפְאַת קֵדְמָה
  choice: upande wa mashariki
  rationale: פֵאָה inaweza kumaanisha upande au ukingo, na קֵדְמָה hapa inaonyesha upande wa mashariki. Muundo huu ni wa asili katika Kiswahili.
- source_word: מִזְרָחָה
  choice: kuelekea macheo ya jua
  rationale: Neno hili linahusiana na mahali jua linapochomoza. Tafsiri hii huhifadhi msisitizo wa pili wa mwelekeo katika Kiebrania bila kurudia tu “mashariki.”
- source_word: חֲמִשִּׁים אַמָּה
  choice: dhiraa hamsini
  rationale: אַمָּה ni kipimo cha urefu kinachoitwa dhiraa; kipimo cha asili kimehifadhiwa badala ya kubadilishwa kuwa vipimo vya kisasa.
