  - marker: b
    text: Au “shaba nyekundu.” Neno la Kiebrania linaweza kumaanisha shaba au aloi yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ הֶחָצֵר
  choice: Urefu wa ua
  rationale: “Ua” ni neno la kawaida na linaloeleweka kwa eneo lililozungushiwa hema la kukutania; “urefu” huhifadhi maana ya kipimo cha jengo.
- source_word: מֵאָה בָאַמָּה
  choice: dhiraa mia moja
  rationale: Kipimo cha kale kinahifadhiwa kwa ulinganifu na maandiko mengine ya hema; mpangilio huu ni wa asili katika Kiswahili.
- source_word: וְרֹחַב חֲמִשִּׁים בַּחֲמִשִּׁים
  choice: upana wake dhiraa hamsini[a]
  rationale: Maana ya kipimo cha upana inatolewa kwa Kiswahili cha kawaida, huku usemi usio wa kawaida wa Kiebrania “hamsini kwa hamsini” ukihifadhiwa katika tanbihi.
- source_word: וְקֹמָה חָמֵשׁ אַמּוֹת
  choice: na kimo chake dhiraa tano
  rationale: “Kimo” hueleza kipimo cha wima cha mapazia ya ua kwa uwazi.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: kitani safi iliyosokotwa
  rationale: Huhifadhi aina ya kitambaa na utengenezaji wake kwa lugha ya sasa na yenye staha.
- source_word: וְאַדְנֵיהֶם
  choice: vikalio vyake
  rationale: Neno linarejelea sehemu za chini za chuma zilizoshikilia nguzo; “vikalio” ni wazi zaidi kwa msomaji wa kawaida kuliko istilahi ya kiufundi “makalio.”
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: “Shaba” ni tafsiri ya kawaida ya Kiswahili katika orodha za vifaa vya hema, ingawa neno la Kiebrania linaweza pia kurejelea shaba nyekundu au aloi yake.
