  text: The length of the court shall be a hundred cubits[a], and the width fifty cubits, and the height five cubits, of finely twisted linen[b], with their bases of bronze.
translation:
  language: sw
  text: Urefu wa ua utakuwa dhiraa mia moja, upana wake dhiraa hamsini[a], na kimo chake dhiraa tano, cha kitani safi iliyosokotwa; na vitako vyake vya shaba[b].
  philosophy: optimal-equivalence
