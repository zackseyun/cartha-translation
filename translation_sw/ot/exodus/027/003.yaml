base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/003.yaml
  text: You shall make its pots for removing its ashes[a], and its shovels, and its basins, and its forks, and its firepans[b]; you shall make all its utensils of bronze.
translation:
  language: sw
  text: Utengeneze vyungu vyake vya kuondolea majivu yake[a], na makoleo yake, mabeseni yake, uma zake, na vyombo vyake vya kubebea makaa ya moto; vyombo vyake vyote uvitengeneze kwa shaba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa neno kwa neno, “kuondoa majivu yake yenye mafuta”; usemi huu unahusu kuondoa majivu yaliyotokana na sadaka zilizoteketezwa juu ya madhabahu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha shaba nyekundu au shaba ya mchanganyiko, yaani bronzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Utengeneze
  rationale: Kauli ya maelekezo katika muktadha huu; umbo hili la Kiswahili linaonyesha agizo kwa njia ya kawaida na yenye heshima.
- source_word: סִּירֹתָיו
  choice: vyungu vyake
  rationale: Neno hilo linamaanisha vyombo au vyungu; kazi yake inaelezwa na maneno yanayofuata, hivyo maana ya majivu haijaingizwa ndani ya nomino.
- source_word: לְדַשְּׁנוֹ
  choice: vya kuondolea majivu yake
  rationale: Katika muktadha wa madhabahu, kitenzi kinahusu kuondoa majivu yaliyotokana na sadaka; tafsiri hii inaeleweka bila kupoteza kazi ya vyungu hivyo.
- source_word: יָעָיו
  choice: sepetu zake
  rationale: Ni vifaa vya kuchotea au kuondolea majivu na makaa; 'sepetu' ni neno la kawaida la Kiswahili kwa kifaa hicho.
- source_word: מִזְרְקֹתָיו
  choice: mabeseni yake
  rationale: Ni vyombo vya kushikilia au kunyunyizia vimiminika, hasa damu ya sadaka; 'mabeseni' linafaa katika muktadha wa ibada.
- source_word: מִזְלְגֹתָיו
  choice: uma zake
  rationale: Neno linataja vifaa vyenye umbo la uma; tafsiri hii ni wazi na haiongezi dhana ya nyama ambayo haikutajwa wazi hapa.
- source_word: מַחְתֹּתָיו
  choice: vyombo vyake vya kubebea makaa
  rationale: Neno linaweza kutaja chetezo au chombo cha kubebea makaa ya moto; tafsiri ya kifafanuzi inaeleza matumizi yake kwa Kiswahili cha sasa.
- source_word: לְכָל־כֵּלָיו
  choice: vyombo vyake vyote
  rationale: כְּלִי ni neno pana kwa vyombo na vifaa; 'vyombo' linakusanya kwa kawaida vitu vyote vilivyoorodheshwa.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Katika Kiswahili 'shaba' ndilo neno la kawaida katika muktadha huu, ingawa neno la Kiebrania linaweza kumaanisha shaba nyekundu au aloi ya shaba.
