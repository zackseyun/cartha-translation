- from: Utengeneze vyungu vyake vya kuondolea majivu yake[a], na sepetu zake, mabeseni yake, uma zake, na vyombo vyake vya kubebea makaa; vyombo vyake vyote uvitengeneze kwa shaba[b].
  to: Utengeneze vyungu vyake vya kuondolea majivu yake[a], na makoleo yake, mabeseni yake, uma zake, na vyombo vyake vya kubebea makaa ya moto; vyombo vyake vyote uvitengeneze kwa shaba[b].
  rationale: Marekebisho yanabadilisha tu kifaa kisicho sahihi, “sepetu,” kuwa “makoleo,” na kuboresha dokezo za msamiati. Maana, mpangilio, na utata wa נְחֹשֶׁת vimehifadhiwa.
  reviewer_model: gpt-5.6-terra
