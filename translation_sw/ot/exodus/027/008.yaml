  text: You shall make it hollow[a], with boards; as it was shown to you on the mountain, so shall they make it.
translation:
  language: sw
  text: Utaifanya kwa mbao, iwe tupu ndani[a]. Kama ulivyoonyeshwa mlimani, ndivyo watakavyoifanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yenye nafasi tupu ndani, iliyotengenezwa kwa mbao.” Kiebrania kinaieleza madhabahu kuwa muundo wa mbao usiojazwa ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוּב
  choice: yenye uvungu ndani
  rationale: Kivumishi hiki kinaonyesha kwamba madhabahu si kitu kigumu kilichojazwa, bali ina nafasi tupu ndani; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: לֻחֹת
  choice: kwa mbao
  rationale: Nomino ya wingi humaanisha mbao au mapande ya mbao yaliyotumiwa kuunda madhabahu; 'kwa mbao' huonyesha nyenzo na namna ya ujenzi.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: Utaifanya
  rationale: Huhifadhi agizo lililoelekezwa kwa Musa katika nafsi ya pili umoja wa kiume.
- source_word: כַּאֲשֶׁר
  choice: Kama
  rationale: Huanzisha ulinganisho kati ya mfano ulioonyeshwa na utekelezaji wake.
- source_word: הֶרְאָה אֹתְךָ
  choice: ulivyoonyeshwa
  rationale: Huhifadhi kauli tendwa ya Kiebrania na haimtaji wazi mtendaji ambaye maandishi yamemwacha bila kutajwa.
- source_word: בָּהָר
  choice: mlimani
  rationale: Ni usemi wa kawaida wa Kiswahili kwa mahali ambapo Musa alionyeshwa mfano huo.
- source_word: כֵּן יַעֲשׂוּ
  choice: ndivyo watakavyoifanya
  rationale: Huhifadhi muundo wa ulinganisho na kitenzi cha wingi, kinachowarejelea watakaotekeleza ujenzi.
