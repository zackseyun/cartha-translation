  terminology: “Mbao” appropriately renders לֻחֹת in this construction. “Tupu ndani” is preferable to “yenye uvungu ndani” for a hollow altar structure. The passive “ulivyoonyeshwa” and plural “watakavyoifanya” should be retained.
