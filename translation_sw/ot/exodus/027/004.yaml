  text: You shall make for it a grating[a], a network of bronze[b], and on the network you shall make four bronze rings at its four corners.
translation:
  language: sw
  text: Nawe utaitengenezea kimia cha shaba, kilichotengenezwa kwa mtindo wa wavu; nawe utatengeneza pete nne za shaba juu ya kimia hicho, katika pembe zake nne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika miisho yake minne.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְבָּר
  choice: wavu
  rationale: Neno hili linataja kitu chenye matundu kinachohusiana na madhabahu. “Wavu” ni neno la kawaida na linaeleweka katika Kiswahili cha sasa.
- source_word: מַעֲשֵׂה רֶשֶׁת
  choice: uliosukwa kama wavu
  rationale: Kirai hiki kihalisi ni “kazi ya wavu.” Tafsiri hii inaonyesha muundo wa kimatundu na kuhifadhi uhusiano wa kimsamiati na רֶשֶׁת katika kishazi kinachofuata.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: “Shaba” ndilo neno la kawaida katika tafsiri za Kiswahili kwa metali hii katika vifaa vya hema takatifu; neno la Kiebrania linaweza kumaanisha shaba au aloi yake.
- source_word: עַל הָרֶשֶׁת
  choice: kwenye wavu huo
  rationale: עַל hapa huonyesha mahali pete zitakapowekwa. “Kwenye” ni ya asili katika Kiswahili, na “wavu huo” huhifadhi marudio ya רֶשֶׁת.
- source_word: טַבְּעֹת
  choice: pete
  rationale: Neno hilo hutaja pete za kuunganishia au kupitishia vifaa katika maagizo ya hema takatifu.
- source_word: קְצוֹתָיו
  choice: pembe zake nne
  rationale: קָצֶה humaanisha mwisho au ukingo wa nje. Kwa wavu wenye pande nne, “pembe” ni usemi wazi wa Kiswahili, huku tanbihi ikihifadhi uwezekano wa “miisho.”
- source_word: לּוֹ
  choice: utaitengenezea
  rationale: Kiambishi “-i-” kinarejelea madhabahu na “-tengenezea” huwasilisha maana ya kutengeneza kitu kwa ajili yake.
- source_word: וְעָשִׂיתָ
  choice: Nawe utaitengenezea / nawe utaweka
  rationale: Muundo wa wakati ujao unaendeleza mfululizo wa maagizo. “Nawe uta-” ni wa heshima, wa kawaida, na huhifadhi kiunganishi cha Kiebrania.
