  text: Kwa upande wa pili kutakuwa na mapazia ya dhiraa kumi na tano[a], nguzo zake tatu, na vitako vyake vitatu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “dhiraa” halipo katika mstari huu wa Kiebrania, lakini linaeleweka kutokana na kifungu sambamba katika mstari wa 14.
    reason: implied_unit
  - marker: b
