    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/כָּתֵף
  choice: Kwa upande
  rationale: Ingawa כָּתֵף kwa msingi humaanisha ‘bega’, katika maelezo ya usanifu wa ua wa Maskani humaanisha upande au ubavu. ‘Kwa upande’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: הַ/שֵּׁנִית
  choice: wa pili
  rationale: Hili ndilo maana ya moja kwa moja ya namba ya mpangilio ya Kiebrania; muktadha unaonyesha upande unaolingana na ule uliotajwa kabla.
- source_word: חְמֵשׁ עֶשְׂרֵה
  choice: urefu wa dhiraa kumi na tano
  rationale: Kifungu hiki kwa maneno kinataja ‘kumi na tano’ bila kitengo, lakini muundo sambamba wa mstari uliotangulia unaonyesha kuwa ni kipimo cha dhiraa, si idadi ya mapazia. ‘Urefu wa’ huzuia kisomo kisicho sahihi kwamba kulikuwa na mapazia kumi na tano tofauti.
- source_word: קְלָעִים
  choice: mapazia
  rationale: Katika muktadha wa ua wa Maskani, neno hili linamaanisha vitambaa vilivyosokotwa vilivyotundikwa ili kuuzingira ua. ‘Mapazia’ ni neno la kawaida na linaloeleweka kwa vitambaa hivyo.
- source_word: עַמֻּדֵי/הֶם
  choice: nguzo zake tatu
  rationale: עַמּוּד ni nguzo inayotegemeza mapazia. Kiambishi cha umilikaji cha Kiebrania kimewakilishwa kwa ‘zake’.
- source_word: וְ/אַדְנֵי/הֶם
  choice: na misingi yake mitatu
  rationale: אֶדֶן hapa ni sehemu ya chini ambayo nguzo hukalia au huingizwa. ‘Misingi’ ni wazi kwa wasomaji wengi, huku ‘vishikio’ kikibaki kuwa tafsiri mbadala ya kiufundi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Muundo wa sentensi unaendeleza maelezo ya ujenzi kutoka mstari uliotangulia, kama ilivyo katika Kiebrania. ‘Yenye urefu wa’ imeongezwa kwa uwazi ili kuonyesha kwamba kumi na tano ni kipimo, si idadi ya mapazia.
