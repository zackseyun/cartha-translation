lexical_decisions:
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: dhiraa kumi na tano
  rationale: Kirai hiki kinataja kipimo cha urefu cha dhiraa kumi na tano; “dhiraa” ni istilahi ya kawaida ya kipimo hiki cha kale.
- source_word: קְלָעִים
  choice: mapazia
  rationale: Katika muktadha wa ua wa Maskani, neno hili linamaanisha vitambaa vilivyotundikwa ili kuuzungushia ua.
- source_word: לַכָּתֵף
  choice: kwa upande mmoja
  rationale: Ingawa maana ya msingi ni “bega,” katika maelezo haya ya ujenzi neno hilo linataja ubavu au upande mmoja wa nafasi ya lango; mstari unaofuata unataja upande unaolingana nao.
- source_word: עַמֻּדֵיהֶם
  choice: nguzo zake tatu
  rationale: “Nguzo” ni neno la asili na linaloeleweka kwa עַמּוּד katika maelezo ya ujenzi wa Maskani. Kiwakilishi cha umoja kinarejelea upande huo kwa mtindo wa kawaida wa Kiswahili.
- source_word: אַדְנֵיהֶם
  choice: misingi yake mitatu
  rationale: Neno hili linataja sehemu za chini zilizotegemeza nguzo. “Misingi” ni Kiswahili cha sasa kinachoeleweka kwa urahisi, huku tanbihi ikifafanua maana mahususi ya vikalio vyenye matundu.
