  text: You shall make poles for the altar[a], poles of acacia wood, and you shall overlay them with bronze.
translation:
  language: sw
  text: Utaitengenezea madhabahu fito za kubebea, fito za mti wa mshita, nawe utazifunika kwa shaba ya bati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shaba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Utaitengenezea
  rationale: Qal timilifu nafsi ya pili umoja pamoja na kiunganishi, katika muktadha wa maagizo, ina nguvu ya amri. Muundo huu wa Kiswahili unaonyesha kwamba miti hiyo itengenezwe kwa ajili ya madhabahu.
- source_word: בַדִּים / בַּדֵּי
  choice: miti ya kubebea
  rationale: Nomino hii inataja fito zinazotumiwa kubebea vyombo vya hema la kukutania. ‘Miti ya kubebea’ ni wazi kwa msomaji wa kawaida na haitoi dhana ya boriti za kuimarishia jengo.
- source_word: לַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Kihusishi cha Kiebrania kimejumuishwa katika kitenzi ‘utaitengenezea,’ hivyo maana ya ‘kwa ajili ya madhabahu’ imehifadhiwa bila kuongeza utambulisho usiotajwa hapa.
- source_word: עֲצֵי שִׁטִּים
  choice: mbao za mshita
  rationale: Hili ni jina la nyenzo. ‘Mbao za mshita’ ni usemi wa kawaida wa Kiswahili na huwasilisha utambulisho unaokubalika wa mti huo.
- source_word: וְצִפִּיתָ
  choice: nawe utaifunika
  rationale: Katika muktadha wa vyombo vya hema, Piel ya צפה humaanisha kufunika kitu kwa tabaka la chuma. ‘Kuifunika’ ni ya asili katika Kiswahili na huhifadhi maana hiyo ya ufundi bila kubainisha mbinu ya kisasa.
- source_word: אֹתָם
  choice: -i- katika ‘utaifunika’
  rationale: Kiwakilishi kinarejelea miti ya kubebea. Kiswahili sanifu hutumia kiambishi cha yambwa cha ngeli ya miti ndani ya kitenzi.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Neno la Kiebrania linaweza kumaanisha shaba au aloi ya shaba. ‘Shaba’ ni neno la kawaida la Kiswahili linalofaa katika muktadha huu, huku uwezekano wa ‘shaba nyeusi’ ukihifadhiwa katika tanbihi.
