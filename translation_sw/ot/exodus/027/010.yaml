translation:
  language: sw
  text: pamoja na nguzo zake ishirini na vitako ishirini vya shaba vya nguzo hizo[a]. Kulabu za nguzo hizo na mikanda ya nguzo hizo[b] zitakuwa za fedha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “soketi” badala ya “vitako vya nguzo.”
    reason: lexical_alternative
  - marker: b
    text: Maana kamili ya neno la Kiebrania lililotafsiriwa “mikanda” haijulikani kwa uhakika; huenda lilimaanisha vipande vya kuunganisha au vilivyozunguka nguzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדָיו
  choice: nguzo zake ishirini
  rationale: עַמּוּד ni nguzo; kiambishi cha nafsi ya tatu umoja kinarejelea upande au pazia lililotajwa katika mstari uliotangulia.
- source_word: אַדְנֵיהֶם
  choice: vitako vyake ishirini
  rationale: Katika muktadha wa Maskani, אֶדֶן ni kitako au tundu la msingi linaloshikilia nguzo. “Vitako” ni neno la kawaida na linaeleweka katika Kiswahili.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Neno hili laweza kumaanisha shaba au aloi yake; “shaba” ndilo neno la kawaida la Kiswahili katika maelezo ya vifaa vya Maskani.
- source_word: וָוֵי
  choice: kulabu
  rationale: וָו kwa kawaida hurejelea kulabu zilizotumika katika muundo wa Maskani.
- source_word: חֲשֻׁקֵיהֶם
  choice: mikanda yake
  rationale: Kitu hasa kinachotajwa na neno hili la usanifu hakijulikani kwa uhakika. “Mikanda” huhifadhi maana ya vipande vilivyozunguka au kuunganishwa na nguzo bila kubainisha mno.
- source_word: כָּסֶף
  choice: fedha
  rationale: Ni jina la moja kwa moja la metali ya fedha.
- source_word: וְ
  choice: pamoja na / na
  rationale: Kiunganishi cha mwanzo kinaendeleza sentensi ya mstari uliotangulia; “pamoja na” huleta mwendelezo wa kawaida, na viunganishi vingine vinaakisiwa kwa uratibu wa sentensi.
