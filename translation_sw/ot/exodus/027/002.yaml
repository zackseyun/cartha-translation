  text: And you shall make its horns on its four corners[a]; its horns shall be of one piece with it[b], and you shall overlay it with bronze.
translation:
  language: sw
  text: Utazitengeneza pembe zake kwenye kona zake nne. Pembe hizo zitakuwa sehemu moja nayo,[a] nawe utaifunika kwa bronzi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “pembe zake zitatokana nayo”; yaani, ziundwe zikiwa sehemu moja na madhabahu, wala zisiunganishwe baadaye kama vipande tofauti.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania nechoshet linaweza kumaanisha bronzi au shaba; “bronzi” ndilo chaguo linalowezekana zaidi katika muktadha huu wa ujenzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Utaitengenezea
  rationale: Kitenzi hiki katika mfululizo wa maagizo kina nguvu ya amri. Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba pembe zitafanywa kuwa sehemu ya madhabahu.
- source_word: קַרְנֹתָיו
  choice: pembe
  rationale: קֶרֶן humaanisha kihalisi ‘pembe’ na hapa hurejelea sehemu zilizochomoza kama pembe kwenye madhabahu.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: katika kona zake nne
  rationale: עַל inaweza kumaanisha ‘juu ya’ au ‘kwenye’; ‘katika kona zake nne’ ni usemi wa kawaida wa Kiswahili kwa mahali pembe hizo zilipowekwa.
- source_word: מִמֶּנּוּ תִּהְיֶיןָ קַרְנֹתָיו
  choice: Pembe hizo zitakuwa sehemu moja nayo
  rationale: Kihalisi ni ‘pembe zake zitatokana nayo.’ Katika muktadha wa ujenzi, maana ni kwamba pembe hizo ziundwe pamoja na madhabahu, wala zisiunganishwe baadaye kama vipande tofauti.
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: nawe utaifunika
  rationale: צפה katika kauli ya Piel humaanisha kufunika kitu kwa tabaka la nyenzo nyingine. ‘Utaifunika’ ni ya kawaida na inaeleweka katika maagizo haya.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: נְחֹשֶׁת inaweza kutaja shaba ya bronzi au shaba nyekundu. ‘Shaba’ ni neno la kawaida katika Kiswahili kwa metali inayotajwa katika muktadha huu, huku tanbihi ikihifadhi uwezekano wa maana nyingine.
