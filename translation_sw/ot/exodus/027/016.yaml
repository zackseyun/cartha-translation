  to: Kwa lango la ua kutakuwa na pazia[a] lenye urefu wa dhiraa ishirini[b], lililotengenezwa kwa nyuzi za buluu, zambarau na nyekundu, na kitani safi iliyosokotwa, kwa kazi ya mtarizi; lenye nguzo zake nne na vikalio vyake vinne[c].
