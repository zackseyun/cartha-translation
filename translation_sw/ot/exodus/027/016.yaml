base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/016.yaml
  text: And for the gate of the courtyard there shall be a screen twenty cubits long[a], of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer[c][b], with their four pillars and their four bases.
translation:
  language: sw
  text: Kwa lango la ua kutakuwa na pazia[a] lenye urefu wa dhiraa ishirini[b], lililotengenezwa kwa nyuzi za buluu, zambarau na nyekundu, na kitani safi iliyosokotwa, kwa kazi ya mtarizi; lenye nguzo zake nne na vikalio vyake vinne[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitambaa cha kufunika ingilio.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “dhiraa ishirini”; maneno “lenye urefu wa” yameongezwa ili kufafanua kipimo.'
    reason: lexical_alternative
  - marker: c
    text: Au, “vitako vyake vinne” au “soketi zake nne.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשַׁעַר הֶחָצֵר
  choice: Kwa lango la ua
  rationale: שַׁעַר ni lango au ingilio, na חָצֵר ni ua uliozungushiwa. Muundo huu ni wa kawaida na wazi katika Kiswahili huku ukihifadhi uhusiano wa usanifu.
- source_word: מָסָךְ
  choice: pazia
  rationale: Katika muktadha wa Maskani, neno hili linamaanisha kitambaa kinachofunika ingilio, si mlango mgumu. “Pazia” ni neno la kawaida na linaloeleweka.
- source_word: עֶשְׂרִים אַמָּה
  choice: lenye urefu wa dhiraa ishirini
  rationale: Kiebrania kinasema kihalisi “dhiraa ishirini.” Maneno “lenye urefu wa” yanafafanua kipimo kinachokusudiwa katika maelekezo haya ya ujenzi.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: nyuzi za rangi ya buluu, zambarau na nyekundu
  rationale: Maneno haya yanataja malighafi za nguo zilizotiwa rangi. “Nyuzi” huweka wazi muktadha wa ufumaji bila kubadili orodha ya rangi.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: kitani safi kilichosokotwa
  rationale: שֵׁשׁ ni kitani safi, na מָשְׁזָר hueleza nyuzi zilizosokotwa pamoja. Tafsiri hii ni ya asili na sahihi katika Kiswahili.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: kazi ya mtarizi
  rationale: Kirai hiki kinamaanisha kazi ya fundi wa tarizi au kazi ya mapambo ya rangi katika nguo. “Kazi ya mtarizi” huhifadhi muundo unaomtaja fundi.
- source_word: עַמֻּדֵיהֶם אַרְבָּעָה
  choice: nguzo zake nne
  rationale: Kiambishi cha nafsi ya tatu wingi katika Kiebrania kinahifadhiwa kwa “zake,” kikirejelea mpangilio wa pazia la lango.
- source_word: וְאַדְנֵיהֶם אַרְבָּעָה
  choice: vikalio vyake vinne
  rationale: אֶדֶן ni kalio au tundu la msingi linaloshikilia nguzo. “Vikalio” ni wazi zaidi kuliko “misingi” na hudumisha kazi yake ya kushikilia nguzo; kiambishi milikishi pia kimehifadhiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. “Mtarizi” na “vikalio” huhifadhi msamiati wa ufundi wa nguo na ujenzi, huku tanbihi zikitoa mbadala pale ambapo neno la Kiebrania linaweza kutafsiriwa kwa namna zaidi ya moja.
