  text: And for the width of the court on the west side[a], there shall be hangings of fifty cubits[b], with ten pillars and ten bases.
translation:
  language: sw
  text: Na kuhusu upana wa ua upande wa magharibi[a], kutakuwa na mapazia ya dhiraa hamsini, pamoja na nguzo zake kumi na vitako vyake kumi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni ‘upande wa bahari,’ nahau ya kawaida inayomaanisha upande wa magharibi.
    reason: lexical_alternative
  - marker: b
    text: Au ‘misingi yake’ badala ya ‘vitako vyake.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רֹחַב הֶֽ/חָצֵר֙
  choice: Na kuhusu upana wa ua
  rationale: רֹחַב ni ‘upana,’ na muundo huu unaanzisha maelezo ya upande mwingine wa ua. ‘Na kuhusu’ ni Kiswahili cha kawaida kinachobaki karibu na mtindo wa maagizo ya Kiebrania.
- source_word: לִ/פְאַת יָ֔ם
  choice: upande wa magharibi
  rationale: יָם maana yake ya msingi ni ‘bahari,’ lakini hapa ni nahau ya mwelekeo inayomaanisha magharibi; ‘upande wa magharibi’ huwasilisha maana wazi.
- source_word: קְלָעִ֖ים
  choice: mapazia
  rationale: Katika muktadha wa ua wa Maskani, neno hili linataja vitambaa vilivyotundikwa na kuunda uzio wa ua. ‘Mapazia’ ni neno la kawaida na linaloeleweka, bila kuongeza maelezo yasiyokuwapo.
- source_word: חֲמִשִּׁ֣ים אַמָּ֑ה
  choice: yenye urefu wa dhiraa hamsini
  rationale: Kipimo kinahusu mapazia katika upande huu. Kuongeza ‘urefu wa’ kunafanya uhusiano wa kipimo uwe wazi katika Kiswahili bila kubadili maana.
- source_word: עַמֻּדֵי/הֶ֣ם עֲשָׂרָ֔ה
  choice: nguzo zake kumi
  rationale: Kiambishi cha wingi cha nafsi ya tatu kinarejelea mpangilio wa mapazia; ‘zake’ kinahifadhi uhusiano huo huku Kiswahili kikibaki cha asili.
- source_word: וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָֽה
  choice: na vikalio vyake kumi
  rationale: אֶדֶן ni msingi au tundu la kushikilia nguzo katika maelezo ya Maskani. ‘Vikalio’ huonyesha sehemu ambazo nguzo hukalia na ni wazi kuliko neno pana ‘misingi’ katika muktadha huu.
