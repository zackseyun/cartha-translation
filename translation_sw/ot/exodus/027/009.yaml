base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/009.yaml
  text: And you shall make the court of the tabernacle. For the south side[a], southward, there shall be hangings for the court of finely twisted linen, a hundred cubits long for one side.
translation:
  language: sw
  text: “Nawe utautengeneza ua wa Maskani. Kwa upande wa kusini, kuelekea kusini, kutakuwa na vitambaa[a] vya ua vya kitani bora kilichosokotwa, vya urefu wa dhiraa mia moja kwa upande mmoja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mapazia.” Neno la Kiebrania linamaanisha paneli za kitambaa zilizounda mpaka wa ua.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר
  choice: ua
  rationale: Katika muktadha wa Maskani, neno hili linamaanisha eneo la wazi lililozungushiwa mpaka; ‘ua’ ni la kawaida na linaeleweka katika Kiswahili.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: Jina hili lililoandikwa kwa herufi kubwa linadumisha maana ya hema takatifu ambalo Mungu alikaa kati ya Israeli, bila kulichanganya na makazi ya kawaida.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: Upande wa kusini, kuelekea kusini
  rationale: Hifadhi ya usemi maradufu wa Kiebrania inasisitiza mwelekeo wa kusini badala ya kuufupisha kuwa kivumishi kimoja.
- source_word: קְלָעִים
  choice: vitambaa
  rationale: Ni paneli za kitambaa zilizoning’inizwa na kuunda mpaka wa ua. ‘Vitambaa’ ni neno la asili na wazi; tanbihi inafafanua kazi yake ya kiusanifu.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: kitani bora kilichosokotwa
  rationale: Tafsiri hii inadumisha aina bora ya kitani na namna kilivyotengenezwa kwa kusokotwa.
- source_word: מֵאָה בָאַמָּה
  choice: dhiraa mia moja
  rationale: Kipimo cha kale kimehifadhiwa badala ya kubadilishwa kuwa kipimo cha kisasa.
- source_word: אֹרֶךְ
  choice: vyenye urefu wa
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unaunganisha kipimo moja kwa moja na vitambaa.
- source_word: לַפֵּאָה הָאֶחָת
  choice: kwa upande huo mmoja
  rationale: Hurejelea upande mmoja maalumu wa mpaka wa ua, yaani upande wa kusini unaozungumziwa.
