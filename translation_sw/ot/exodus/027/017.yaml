  text: All the pillars around the courtyard shall be banded with silver[c][b][a], with their hooks of silver and their bases of bronze.
translation:
  language: sw
  text: Nguzo zote zinazolizunguka ua zitafungwa kwa mikanda ya fedha,[a] kulabu zake zitakuwa za fedha, na vitako vyake[b] vitakuwa vya shaba.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zitaunganishwa kwa fito za fedha.” Neno la Kiebrania linarejelea mikanda au kazi ya kuunganisha ya fedha kwenye nguzo.
    reason: lexical_alternative
  - marker: b
    text: Au “soketi zake.” Neno hili hurejelea besi za chuma ambamo nguzo ziliwekwa.
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania linaweza pia kurejelea shaba yenyewe au aloi ya shaba, kama vile bronzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עַמּוּדֵי
  choice: Nguzo zote
  rationale: Muundo huu unajumuisha nguzo zote za ua; “nguzo” ni neno la kawaida na linalofaa kwa mihimili hii iliyosimama.
- source_word: הֶחָצֵר סָבִיב
  choice: kuzunguka ua
  rationale: Hueleza nguzo zilizokuwa pande zote za eneo la nje lililozungushiwa pazia; “ua” ni fasiri ya kawaida na wazi katika muktadha huu.
- source_word: מְחֻשָּׁקִים כֶּסֶף
  choice: zitafungwa kwa mikanda ya fedha
  rationale: Kitenzi kinaashiria kufungwa au kuunganishwa kwa kazi ya fedha, huenda mikanda au fito; uchaguzi huu ni wazi huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: וָוֵיהֶם
  choice: kulabu zake
  rationale: Neno hili kwa kawaida humaanisha kulabu katika maelezo ya maskani, yaani vifaa vya kutundikia mapazia.
- source_word: אַדְנֵיהֶם
  choice: vitako vyake
  rationale: Hurejelea sehemu za chini za chuma ambamo nguzo zilikitwa; “vitako” ni neno linaloeleweka, na “vishikio vya chini” limewekwa kama uwezekano katika tanbihi.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Neno la Kiebrania linaweza kumaanisha shaba au aloi yake; “shaba” ni neno la kawaida la Kiswahili, huku upana wa maana ukielezwa katika tanbihi.
