  yaml_path: translation/ot/exodus/027/019.yaml
  text: All the utensils of the tabernacle for all its service[a], and all its pegs, and all the pegs of the courtyard, shall be bronze.
translation:
  language: sw
  text: Vyombo vyote vya Maskani kwa ajili ya huduma yake yote, vigingi vyake vyote, na vigingi vyote vya ua vitakuwa vya shaba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shaba nyekundu” au “shaba ya aloi”; neno la Kiebrania נְחֹשֶׁת linaweza kutaja kwa upana metali yenye msingi wa shaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי
  choice: vyombo
  rationale: Ni neno pana kwa vifaa au vitu vinavyotumiwa; “vyombo” ni la kawaida na halikomei kwenye samani pekee.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: Katika muktadha huu ni makao matakatifu yanayohamishika; “Maskani” ni istilahi iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בְּכֹל עֲבֹדָתוֹ
  choice: kwa ajili ya huduma yake yote
  rationale: Kirai hiki kinaonyesha matumizi ya vyombo katika shughuli zote za huduma ya Maskani, huku “kwa ajili ya” kikitoa kusudi kwa Kiswahili cha kawaida.
- source_word: יְתֵדֹתָיו
  choice: vigingi vyake
  rationale: יָתֵד ni kigingi kinachotumiwa kuimarisha au kufunga muundo; “vigingi” ni tafsiri fupi na ya asili.
- source_word: יִתְדֹת הֶחָצֵר
  choice: vigingi vyote vya ua
  rationale: חָצֵר hapa ni eneo lililozungushiwa Maskani; “ua” ni neno la kawaida katika muktadha huu.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Neno la Kiebrania linaweza kumaanisha shaba tupu au metali ya aloi yenye msingi wa shaba; “shaba” ni neno la Kiswahili linaloeleweka kwa upana, huku tanbihi ikihifadhi uwezekano wa maana hizo.
