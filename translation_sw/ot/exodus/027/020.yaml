  yaml_path: translation/ot/exodus/027/020.yaml
  text: And you shall command the sons of Israel that they bring to you pure beaten olive oil for the light[c][b][a], to cause a lamp to burn continually.
translation:
  language: sw
  text: Nawe utawaamuru wana wa Israeli wakuletee mafuta safi ya zeituni zilizopondwa kwa ajili ya mwanga, ili taa iwake daima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika maagizo ya maskani, “daima” linaweza kumaanisha kwamba taa ilipaswa kutunzwa ikiwaka kwa ukawaida na kwa kuendelea, si lazima kwamba isizimike kamwe hata kwa muda mfupi. Linganisha Kutoka 27:21 na Walawi 24:2–4.
    reason: cross_reference
lexical_decisions:
- source_word: וְאַתָּה
  choice: Nawe
  rationale: Inaendeleza usemi huku ikisisitiza kwamba Musa ndiye anayeambiwa moja kwa moja, bila kuongeza maneno yasiyokuwapo katika Kiebrania.
- source_word: תְּצַוֶּה
  choice: utawaamuru
  rationale: Hifadhi nguvu ya agizo la kisheria la kitenzi צוה kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hifadhi kwa karibu usemi wa kifamilia wa Kiebrania, ambao hapa ni jina la kawaida la jumuiya ya agano.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: wakuletee
  rationale: Katika muktadha huu wa kutoa mahitaji, לקח pamoja na אֶל ina maana ya kupata na kuleta kwa Musa; 'wakuletee' ni ya asili katika Kiswahili.
- source_word: שֶׁמֶן זַיִת זָךְ
  choice: mafuta safi ya zeituni
  rationale: Huonyesha mafuta yatokanayo na zeituni na sifa yake ya kuwa safi au yasiyo na uchafu.
- source_word: כָּתִית
  choice: zilizopondwa
  rationale: Neno linaeleza kutolewa kwa mafuta kwa kuponda zeituni; muundo huu unaondoa mkanganyiko kwamba mafuta yenyewe ndiyo yanayopondwa.
- source_word: לַמָּאוֹר
  choice: kwa ajili ya mwanga
  rationale: Hifadhi umbo la nomino na kutaja kusudi bila kuingiza kinara cha taa ambacho hakijatajwa wazi katika kifungu hiki.
- source_word: לְהַעֲלֹת נֵר
  choice: ili taa iwake
  rationale: Hutoa kwa Kiswahili cha asili nahau ya Kiebrania ya 'kuinua/kufanya taa ipande,' yaani kuiwasha na kuidumisha ikiwaka.
- source_word: תָּמִיד
  choice: daima
  rationale: Ni neno fupi na la kawaida linaloweza kumaanisha kuendelea au kufanywa kwa ukawaida katika ibada; tanbihi inalinda upeo huo wa maana.
theological_decisions:
- issue: Usemi wa agano wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Usemi rasmi wa kifamilia umehifadhiwa bila kudai kwamba wanawake wametengwa; katika muktadha ni jina la kawaida la jumuiya yote ya Israeli.
- issue: Upeo wa תָּמִיד katika huduma ya maskani
  choice: daima
  alternative: kwa ukawaida; bila kukoma
  rationale: Maana ya Kiebrania inaweza kuonyesha utunzaji endelevu wa kawaida, si lazima mwako usiokatika hata dakika moja; tanbihi huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inafuata kwa karibu muundo wa Kiebrania lakini hutumia nahau ya asili ya Kiswahili; 'zeituni zilizopondwa' huepuka maana isiyo ya asili ya mafuta kupigwa au kupondwa.
