base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/023.yaml
  text: So Moses stretched out his staff toward the sky[a], and Yahweh sent thunder and hail, and fire came down to the earth. And Yahweh rained hail on the land of Egypt.
translation:
  language: sw
  text: Basi Musa akaunyoosha fimbo yake kuelekea angani, Yahweh akatuma ngurumo na mvua ya mawe, na moto[a] ukashuka hadi ardhini. Yahweh akanyesha mvua ya mawe juu ya nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moto ukaelekea ardhini”; huenda “moto” katika muktadha huu unamaanisha umeme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: akaunyoosha
  rationale: Kitenzi נָטָה hapa kinaeleza tendo la kunyoosha au kuelekeza fimbo; “akaunyoosha” ni Kiswahili cha kawaida na chenye kueleweka.
- source_word: מַטֵּהוּ
  choice: fimbo yake
  rationale: מַטֶּה ni fimbo inayotumiwa na Musa; “fimbo” ni neno la kawaida lisilo la kizamani.
- source_word: עַל הַשָּׁמַיִם
  choice: kuelekea angani
  rationale: Katika muktadha huu עַל ina maana ya mwelekeo wa juu; “kuelekea angani” huonyesha wazi kitendo cha kuinua fimbo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limewasilishwa kama jina binafsi, si kubadilishwa kuwa cheo.
- source_word: נָתַן קֹלֹת וּבָרָד
  choice: akatuma ngurumo na mvua ya mawe
  rationale: Ingawa נָתַן kwa msingi ni “alitoa,” katika muktadha wa dhoruba “akatuma” ni ya asili; קֹלֹת hurejelea ngurumo hapa.
- source_word: בָּרָד
  choice: mvua ya mawe
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa hail, na linafaa katika simulizi la pigo.
- source_word: וַתִּהֲלַךְ אֵשׁ אָרְצָה
  choice: moto ukashuka mpaka ardhini
  rationale: Kiebrania kwa karibu ni “moto ukaenda kuelekea ardhini.” Tafsiri hii huhifadhi taswira ya moto na mwelekeo wake kwa Kiswahili cha asili bila kuibadili moja kwa moja kuwa umeme.
- source_word: וַיַּמְטֵר
  choice: akanyesha
  rationale: Umbo la kisababishi la מָטַר lina maana ya kunyesha au kufanya inyeshe; “akanyesha” ni fupi na ya kawaida.
- source_word: אֶרֶץ מִצְרָיִם
  choice: nchi ya Misri
  rationale: Huhifadhi rejeo kamili la Kiebrania kwa eneo la nchi ya Misri.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la agano יהוה; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa אֵשׁ katika dhoruba
  choice: moto
  alternative: umeme
  rationale: Ingawa katika muktadha moto huenda ukamaanisha umeme, neno lenyewe ni “moto.” Maandishi makuu yanahifadhi taswira hiyo, na tanbihi inaeleza maana inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi umetiririshwa kwa viunganishi vya “aka-,” huku marudio ya jina Yahweh yakihifadhiwa kama yalivyo katika Kiebrania.
