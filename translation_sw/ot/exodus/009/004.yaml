id: EXO.9.4
reference: Exodus 9:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִפְלָ֣ה יְהוָ֔ה בֵּ֚ין מִקְנֵ֣ה יִשְׂרָאֵ֔ל וּ/בֵ֖ין מִקְנֵ֣ה מִצְרָ֑יִם וְ/לֹ֥א יָמ֛וּת מִ/כָּל לִ/בְנֵ֥י יִשְׂרָאֵ֖ל דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/004.yaml
  text: But Yahweh will make a distinction between the livestock of Israel and the livestock of Egypt[a], so that nothing belonging to the sons of Israel will die.
translation:
  language: sw
  text: Lakini Yahwe atatofautisha kati ya mifugo ya Israeli na mifugo ya Misri; hakuna hata mnyama mmoja wa wana wa Israeli[a] atakayekufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Waisraeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָה
  choice: atatofautisha
  rationale: Hifili ya פלא inaonyesha kwamba Yahwe ataweka tofauti dhahiri kati ya makundi hayo mawili; “atatofautisha” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: בֵּין ... וּבֵין
  choice: kati ya ... na ...
  rationale: Hili ndilo umbo la kawaida la Kiswahili la kuonyesha tofauti kati ya pande mbili.
- source_word: מִקְנֵה
  choice: mifugo
  rationale: Neno hili linahusu kwa upana wanyama wanaofugwa, si ng’ombe pekee.
- source_word: מִצְרַיִם
  choice: Misri
  rationale: Kirai cha Kiebrania kinamaanisha “mifugo ya Misri,” likitumia jina la taifa kwa maana ya nchi au watu wake kwa ujumla.
- source_word: וְלֹא יָמוּת מִכָּל ... דָּבָר
  choice: hakuna hata mnyama mmoja ... atakayekufa
  rationale: Katika muktadha, usemi hasi wenye דָּבָר unasisitiza kwamba hakuna hata mmoja kati ya mifugo ya Israeli atakayekufa. “Mnyama” huweka rejeleo wazi kwa Kiswahili bila kubadili maana.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wa wana wa Israeli
  rationale: Huhifadhi usemi wa kifamilia na kitaifa wa Kiebrania huku ukionyesha kwamba mifugo hiyo ni mali yao.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה; kulitoholesha kama “Yahwe” huhifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” huhifadhi umbo la kifamilia la usemi wa Kiebrania. Mbadala wa kawaida zaidi umeonyeshwa katika tanbihi.
- issue: Uhusiano wa kishazi hasi na tendo la kutofautisha
  choice: kishazi huru baada ya nuktamkato
  alternative: ili ... asife; hivi kwamba ... hatakufa
  rationale: Kiunganishi וְ kinaweza kueleza mwendelezo au matokeo bila kuainisha wazi uhusiano wa kimantiki. Nuktamkato huhifadhi mvutano huo badala ya kulazimisha maana ya kusudi au matokeo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mifugo” ni pana na ya kawaida; “hakuna hata mnyama mmoja” ni ya asili zaidi kuliko tafsiri sisisi ya “hakuna kitu” katika muktadha huu.
