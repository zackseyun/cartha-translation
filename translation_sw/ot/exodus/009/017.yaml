  text: Je, bado unajikweza dhidi ya watu wangu kwa kutowaacha waende?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unajivuna juu ya watu wangu” au “unajiinua dhidi ya watu wangu.”
