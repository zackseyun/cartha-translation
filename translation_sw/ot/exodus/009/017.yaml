lexical_decisions:
- source_word: עוֹדְךָ
  choice: Je, bado
  rationale: Huonyesha hali inayoendelea katika swali la moja kwa moja kwa Farao; muundo huu ni wa kawaida katika Kiswahili.
- source_word: מִסְתּוֹלֵל
  choice: unajiinua
  rationale: Huhifadhi maana ya kujitukuza au kujikweza kwa kiburi pamoja na nguvu ya kujirejelea ya kitenzi.
- source_word: בְּעַמִּי
  choice: dhidi ya watu wangu
  rationale: Kiambishi ב hapa kinaeleza msimamo wa uadui au kujifanya mkuu juu yao; “dhidi ya” huwasilisha uadui huo kwa uwazi.
- source_word: לְבִלְתִּי
  choice: kwa kuto-
  rationale: Huanzisha kishazi hasi kinachoonyesha namna ambavyo Farao anajiinua; katika sentensi kamili, “kwa kutowaacha” ni Kiswahili cha asili.
- source_word: שַׁלְּחָם
  choice: kuwaacha waende
  rationale: Katika simulizi la mapigo, kitenzi hiki humaanisha kuwaruhusu Waisraeli waondoke kutoka utumwani.
theological_decisions:
- issue: Kauli ya Mungu ya umiliki katika “watu wangu”
  choice: Kuhifadhi “watu wangu” kama ilivyo katika usemi wa moja kwa moja wa YHWH
  alternative: “watu” au “Israeli”
  rationale: Kiambishi cha nafsi ya kwanza ni muhimu kwa mada ya agano na kinaonyesha kwamba upinzani wa Farao dhidi ya Israeli ni upinzani dhidi ya Mungu mwenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Unajiinua” huhifadhi picha ya Kiebrania na maana ya kiburi bila kutumia istilahi nzito; alama ya swali huhifadhi nguvu ya swali la kukemea katika muktadha.
