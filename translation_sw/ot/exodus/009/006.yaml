id: EXO.9.6
reference: Exodus 9:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֕מָת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּ/מִ/מִּקְנֵ֥ה בְנֵֽי יִשְׂרָאֵ֖ל לֹא מֵ֥ת אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/006.yaml
  text: And Yahweh did this thing the next day[a], and all the livestock of Egypt died; but from the livestock of the sons of Israel, not one died.
translation:
  language: sw
  text: Yahwe akafanya jambo hilo siku iliyofuata, na mifugo yote ya Wamisri ikafa; lakini katika mifugo ya wana wa Israeli[a], hakuna hata mmoja aliyekufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Waisraeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּעַשׂ ... אֶת הַדָּבָר הַזֶּה
  choice: akafanya jambo hilo
  rationale: Huhifadhi maana ya kawaida ya kitenzi עשה pamoja na nomino דבר kwa Kiswahili cha asili na kinachoeleweka.
- source_word: מִמָּחֳרָת
  choice: siku iliyofuata
  rationale: Hueleza kwa kawaida kwamba tukio lilitokea siku ya baadaye inayofuata.
- source_word: כֹּל מִקְנֵה מִצְרָיִם
  choice: mifugo yote ya Wamisri
  rationale: מִקְנֶה inahusu mifugo kwa upana, si ng’ombe pekee; ‘ya Wamisri’ ni uhusiano wa kawaida zaidi katika Kiswahili kuliko ‘ya Misri’ inapomaanisha mali ya watu.
- source_word: וּמִמִּקְנֵה בְנֵי יִשְׂרָאֵל
  choice: lakini katika mifugo ya wana wa Israeli
  rationale: ‘Katika’ huakisi מן yenye maana ya kutoka miongoni mwa kundi, huku ‘lakini’ ikionyesha utofauti wa wazi na kilichowapata Wamisri.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu muundo wa Kiebrania, ingawa hapa ni jina la pamoja la watu wa Israeli.
- source_word: לֹא מֵת אֶחָד
  choice: hakuna hata mmoja aliyekufa
  rationale: ‘Hata mmoja’ huwasilisha mkazo wa ukanushaji pamoja na numeral אֶחָד na humrejelea mnyama mmoja kati ya mifugo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko lina jina binafsi la Mungu, si cheo; ‘Yahwe’ hulihifadhi kwa unukuzi unaofaa Kiswahili.
- issue: Maana ya pamoja ya בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Tafsiri kuu huhifadhi umbo la Kiebrania, huku tanbihi ikitoa jina la kawaida la kikabila bila kudokeza kwamba wanaume pekee ndio wanaokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika, ‘wana wa Israeli,’ badala ya baada ya rejeo la wakati.
