review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders soot, kiln, Pharaoh, Moses’ upward throwing action, and the human-and-animal scope. However, “Yakawa majipu” makes the soot grammatically become boils, whereas the Hebrew וַיְהִי introduces the occurrence of the affliction. An impersonal construction more faithfully represents the Hebrew.
  naturalness: The Swahili is generally clear and suitably formal. “Kukawa na majipu ... kwa watu na wanyama” is more idiomatic for an outbreak affecting living beings than “yakawa ... juu ya watu na wanyama.”
  terminology: “Masizi,” “tanuru,” “Farao,” “majipu,” and “malengelenge” are appropriate Standard East African Swahili choices. The collective sense of אדם and בהמה is naturally conveyed by “watu na wanyama.”
  issues:
  - severity: medium
    issue: “Yakawa majipu” assigns the becoming to the previously mentioned masizi.
    rationale: Hebrew וַיְהִי שְׁחִין introduces the resulting presence/outbreak of boils; it does not explicitly state that the soot itself transformed into boils. Using “kukawa na” preserves this construction without adding a material transformation.
  - severity: low
    issue: “juu ya watu na wanyama” is overly literal in this medical context.
    rationale: For a skin affliction affecting people and animals, “kwa watu na wanyama” is more natural Swahili while retaining the distributive scope of the Hebrew preposition.
  revised_text: Basi wakachukua masizi kutoka katika tanuru, wakasimama mbele ya Farao, naye Musa akayarusha kuelekea angani. Kukawa na majipu yenye malengelenge yakitokea kwa watu na wanyama.[a]
  revised_footnotes:
  - marker: a
    text: Kiebrania hutumia umoja wa pamoja, kihalisi, “kwa mwanadamu na kwa mnyama.”
    reason: lexical_alternative
  revision_rationale: The revision avoids implying that the soot itself became boils and uses idiomatic Swahili for an affliction occurring among humans and animals. The footnote is adjusted so its literal gloss corresponds to the revised natural rendering of the Hebrew preposition in this context.
