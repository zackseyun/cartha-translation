revisions:
- from: Basi wakachukua masizi kutoka katika tanuru, wakasimama mbele ya Farao, naye Musa akayarusha kuelekea angani. Yakawa majipu yenye malengelenge, yakitokea juu ya watu na wanyama.[a]
  to: Basi wakachukua masizi kutoka katika tanuru, wakasimama mbele ya Farao, naye Musa akayarusha kuelekea angani. Kukawa na majipu yenye malengelenge yakitokea kwa watu na wanyama.[a]
  rationale: The revision avoids implying that the soot itself became boils and uses idiomatic Swahili for an affliction occurring among humans and animals. The footnote is adjusted so its literal gloss corresponds to the revised natural rendering of the Hebrew preposition in this context.
