  text: וַ/יִּקְח֞וּ אֶת פִּ֣יחַ הַ/כִּבְשָׁ֗ן וַ/יַּֽעַמְדוּ֙ לִ/פְנֵ֣י פַרְעֹ֔ה וַ/יִּזְרֹ֥ק אֹת֛/וֹ מֹשֶׁ֖ה הַ/שָּׁמָ֑יְמָ/ה וַ/יְהִ֗י שְׁחִין֙ אֲבַעְבֻּעֹ֔ת פֹּרֵ֕חַ בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/010.yaml
  text: So they took soot from the kiln and stood before Pharaoh[a], and Moses threw it toward the sky[b], and it became boils with blisters breaking out on man and on beast.
translation:
  language: sw
  text: Basi wakachukua masizi kutoka katika tanuru, wakasimama mbele ya Farao, naye Musa akayarusha kuelekea angani. Kukawa na majipu yenye malengelenge yakitokea kwa watu na wanyama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia umoja wa pamoja, kihalisi, “kwa mwanadamu na kwa mnyama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיחַ
  choice: masizi
  rationale: Neno hili linamaanisha unga mwembamba mweusi unaotokana na mwako; “masizi” ni sahihi zaidi kuliko “majivu” kwa muktadha huu.
- source_word: הַכִּבְשָׁן
  choice: tanuru
  rationale: כִּבְשָׁן ni tanuru au joko kubwa la kuchomea; “tanuru” ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: לִפְנֵי פַרְעֹה
  choice: mbele ya Farao
  rationale: Nahau hii inaonyesha kusimama katika uwepo wa Farao; tafsiri hii ni ya asili na fupi.
- source_word: הַשָּׁמָיְמָה
  choice: kuelekea angani
  rationale: Kiambishi cha mwelekeo kinaonyesha kurusha juu; “angani” huhifadhi maana ya kimwili bila kuongeza maana ya kitheolojia.
- source_word: שְׁחִין אֲבַעְבֻּעֹת
  choice: majipu yenye malengelenge
  rationale: Kirai kinaeleza majipu au vidonda vya kuvimba vilivyo na malengelenge; tafsiri hii huhifadhi vipengele vyote viwili.
- source_word: פֹּרֵחַ
  choice: yakitokea
  rationale: Kitenzi kishirikishi kinaonyesha upele au majipu yakichipuka na kuenea; “yakitokea” ni wazi na ya kawaida katika maelezo ya ugonjwa wa ngozi.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: juu ya watu na wanyama
  rationale: Majina ya umoja katika Kiebrania yametumiwa kwa maana ya jamii nzima; wingi wa Kiswahili huwasilisha maana hiyo kwa kawaida bila kudokeza wanaume pekee au mnyama mmoja.
theological_decisions:
- issue: Maana ya pamoja ya אָדָם ikilinganishwa na בְּהֵמָה
  choice: watu na wanyama
  alternative: mwanadamu na mnyama
  rationale: Katika muktadha huu, maneno ya umoja yana maana ya pamoja. Wingi wa Kiswahili ni wa kawaida zaidi na unaonyesha wazi kwamba pigo liliwapata wanadamu na wanyama kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umehifadhiwa, huku umoja wa pamoja wa Kiebrania ukitafsiriwa kwa wingi wa kawaida wa Kiswahili.
