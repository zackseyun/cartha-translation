  text: And Yahweh set a time[a], saying, “Tomorrow Yahweh will do this thing in the land.”
translation:
  language: sw
  text: Yahwe akaweka wakati[a], akisema, “Kesho Yahwe atafanya jambo hili katika nchi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati maalumu” au “wakati uliowekwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: akaweka
  rationale: Kitenzi שׂוּם hapa kina maana ya kuweka au kuainisha jambo; “akaweka wakati” ni usemi wa kawaida unaodumisha urahisi wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: מוֹעֵד
  choice: wakati
  rationale: מוֹעֵד inaweza kumaanisha wakati uliowekwa au muda maalumu. “Wakati” ni wazi katika simulizi, huku neno “Kesho” likiufafanua.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huu ni uwasilishaji wa kawaida na wa asili wa kish infinitivu cha Kiebrania kinachoanzisha maneno ya moja kwa moja.
- source_word: מָחָר
  choice: Kesho
  rationale: Kielezi hiki hutaja moja kwa moja wakati ambapo tendo litatimia.
- source_word: יַעֲשֶׂה
  choice: atafanya
  rationale: עשה ni kitenzi kipana cha kufanya; “atafanya” hudumisha urahisi wa chanzo bila kuongeza ufafanuzi.
- source_word: הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: דָּבָר hapa hurejelea tendo au tukio lililotangazwa. “Jambo hili” ni Kiswahili cha kawaida na huacha upana wa maana wa neno hilo.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: אֶרֶץ katika muktadha ni nchi ya Misri, lakini tafsiri haiongezi “Misri” kwa kuwa haijatajwa wazi katika mstari huu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina binafsi badala ya kuliwakilisha kwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni rahisi na wa kisimulizi; tanbihi huhifadhi upeo wa maana wa מוֹעֵד.
