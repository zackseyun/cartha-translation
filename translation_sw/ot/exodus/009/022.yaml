base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/022.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky[b], so that hail may come over all the land of Egypt—on man and on beast and on every plant of the field in the land of Egypt.”
translation:
  language: sw
  text: Kisha Yahwe akamwambia Musa, “Nyosha mkono wako kuelekea angani[a], ili mvua ya mawe inyeshe katika nchi yote ya Misri—juu ya wanadamu[b], juu ya mifugo, na juu ya kila mmea wa shambani katika nchi ya Misri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuelekea mbinguni.” Neno la Kiebrania linaweza kumaanisha “anga” au “mbingu,” lakini hapa linarejelea anga linaloonekana ambako mvua ya mawe inatoka.
    reason: lexical_alternative
  - marker: b
    text: “Wanadamu” hapa linamaanisha binadamu kwa ujumla, tofauti na mifugo.
    reason: lexical_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Limetumika umbo la kawaida la Kiswahili la jina la agano la Mungu, badala ya kulibadili kuwa cheo kama “BWANA.”
- source_word: נְטֵה אֶת יָדְךָ
  choice: Nyosha mkono wako
  rationale: Huwasilisha moja kwa moja amri ya kunyoosha mkono na ni usemi wa kawaida wa Kiswahili.
- source_word: עַל הַשָּׁמַיִם
  choice: kuelekea angani
  rationale: Muktadha ni wa mwelekeo na hali ya hewa; “angani” hueleweka kwa kawaida kuwa anga linaloonekana ambako mvua ya mawe inatoka.
- source_word: וִיהִי בָרָד
  choice: ili mvua ya mawe inyeshe
  rationale: Huhifadhi uhusiano wa kusudi au matokeo baada ya amri, huku ikieleza tukio la mvua ya mawe kwa Kiswahili cha kawaida.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: katika nchi yote ya Misri
  rationale: Huhifadhi maana ya eneo lote na upeo kamili wa pigo.
- source_word: הָאָדָם
  choice: wanadamu
  rationale: Neno hili hapa linawarejelea binadamu kwa ujumla, likitofautishwa na wanyama; wingi wa Kiswahili huwasilisha maana hiyo ya kijumla kwa uwazi.
- source_word: הַבְּהֵמָה
  choice: wanyama
  rationale: Ni neno pana na la kawaida linalofaa kwa wanyama wanaotajwa katika muktadha wa pigo, bila kulifanya kuwa finyu kuliko Kiebrania.
- source_word: כָּל עֵשֶׂב הַשָּׂדֶה
  choice: kila mmea wa shambani
  rationale: “Mmea” ni pana vya kutosha kujumuisha mimea na mazao yanayoweza kuharibiwa, na “wa shambani” huhifadhi uhusiano wa kifungu cha Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Jina binafsi limehifadhiwa badala ya kubadilishwa kuwa cheo; “Yahwe” ni umbo linalotambulika katika Kiswahili sanifu.
- issue: Maana ya kijumla ya הָאָדָם
  choice: wanadamu
  alternative: mtu; watu
  rationale: Ingawa Kiebrania kina umbo la umoja lenye maana wakilishi, “wanadamu” huonyesha kwa usahihi kwamba pigo linawahusu binadamu kwa ujumla na hudumisha utofauti wao na wanyama.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umehifadhi marudio ya mwisho ya “katika nchi ya Misri” kwa ajili ya msisitizo na upeo kama katika Kiebrania; alama za tanbihi zimewekwa kwenye maneno yanayofafanuliwa.
