base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/003.yaml
  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
translation:
  language: sw
  text: Tazama, mkono wa Yahwe utakuwa juu ya mifugo yako iliyoko kondeni—farasi, punda, ngamia, ng’ombe, kondoo na mbuzi; kutakuwa na tauni[a] kali sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ugonjwa wa kuambukiza wenye kuua”; neno la Kiebrania hapa linamaanisha mlipuko hatari wa ugonjwa unaoathiri mifugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linadumisha msisitizo na uharaka wa tangazo la Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יַד יְהוָה
  choice: mkono wa Yahwe
  rationale: Linahifadhi tamathali ya Kiebrania inayowakilisha nguvu na hukumu ya Mungu badala ya kuibadili kuwa tendo lisilo na picha hiyo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha jina la agano lililoandikwa kwa herufi nne za Kiebrania na kufuata tahajia iliyozoeleka katika Kiswahili.
- source_word: הוֹיָה
  choice: utakuwa
  rationale: Katika muktadha huu umbo hilo linatangaza jambo linalokaribia kutokea; wakati ujao unatoa maana ya utabiri bila kuongeza kitenzi kisichokuwamo katika chanzo.
- source_word: בְּמִקְנְךָ
  choice: juu ya mifugo yako
  rationale: Mִקְנֶה ni neno pana kwa wanyama wanaofugwa, na ‘juu ya’ linahifadhi kwa kiasi kikubwa muundo wa Kiebrania wa mkono wa hukumu kuwa juu yao.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: iliyo kondeni
  rationale: Linabainisha mifugo iliyokuwa nje kondeni na ni usemi mfupi, wa asili katika Kiswahili.
- source_word: בַּסּוּסִים בַּחֲמֹרִים בַּגְּמַלִּים בַּבָּקָר וּבַצֹּאן
  choice: juu ya farasi, punda, ngamia, ng’ombe, kondoo na mbuzi
  rationale: Linahifadhi orodha ya wanyama. צֹאן ni kundi la wanyama wadogo wa kufugwa linaloweza kujumuisha kondoo na mbuzi, hivyo wote wametajwa ili kuepuka kulibana kwa kondoo pekee.
- source_word: דֶּבֶר
  choice: tauni
  rationale: Neno hili humaanisha mlipuko hatari wa ugonjwa; ‘tauni’ ni neno fupi na linaloeleweka, huku tanbihi ikifafanua kuwa hapa unaathiri mifugo.
- source_word: כָּבֵד מְאֹד
  choice: kali sana
  rationale: Hutoa kwa Kiswahili maana ya uzito mkubwa wa pigo hilo bila kutafsiri kisifa כָּבֵד kwa namna ngumu ya neno kwa neno.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja jina la agano יְהוָה; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Tamathali ya ‘mkono wa Yahwe’
  choice: Kuhifadhi tamathali hiyo
  alternative: Yahwe atapiga
  rationale: Kuhifadhi ‘mkono’ kunadumisha picha ya nguvu na hukumu ya Mungu iliyopo katika Kiebrania bila kuamua maana yake kwa kufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘mkono wa Yahwe utakuwa juu ya’ umehifadhiwa makusudi kwa sababu ni tamathali muhimu ya chanzo, ingawa una ladha ya kibiblia. ‘Kondoo na mbuzi’ hufafanua upana wa jina la pamoja צֹאן.
