base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/008.yaml
  text: Then Yahweh said to Moses and to Aaron[a], “Take for yourselves handfuls of soot from a furnace[c][b], and let Moses throw it toward the sky before Pharaoh’s eyes.”
translation:
  language: sw
  text: Kisha Yahweh akawaambia Musa na Aroni, “Jichukulieni konzi za masizi kutoka katika tanuru, kisha Musa ayarushe kuelekea angani mbele ya macho ya Farao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limeandikwa moja kwa moja kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Kitenzi אמר humaanisha kusema; umbo la Kiswahili linaonyesha kwamba Yahweh aliwaambia watu wawili, Musa na Aroni.
- source_word: קְחוּ לָכֶם
  choice: Jichukulieni
  rationale: Amri ni ya wingi, na לָכֶם ina maana ya kujichukulia; “Jichukulieni” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: מְלֹא חָפְנֵיכֶם
  choice: konzi zilizojaa
  rationale: Kirai hiki hueleza kiasi kinachojaza mikono au viganja; “konzi zilizojaa” ni wazi na huhifadhi wazo la ujazo.
- source_word: פִּיחַ
  choice: masizi
  rationale: Neno hili linamaanisha hasa unga mwembamba mweusi unaobaki baada ya mwako, yaani masizi, wala si majivu kwa ujumla.
- source_word: כִּבְשָׁן
  choice: tanuru
  rationale: Neno linaweza kumaanisha tanuru au joko la kuchomea; “tanuru” ni neno pana na la kawaida lisilobainisha matumizi yasiyotajwa.
- source_word: וּזְרָקוֹ
  choice: kisha Musa ayarushe
  rationale: Baada ya amri ya wingi, kitenzi kinamtaja Musa peke yake kuwa mtendaji. Ngeli ya “masizi” inahitaji kiwakilishi cha “ya-” katika Kiswahili.
- source_word: הַשָּׁמַיְמָה
  choice: kuelekea angani
  rationale: Kiishio cha mwelekeo kinaonyesha kutupa juu kuelekea anga; tafsiri hii inaeleza tendo la kimwili bila kulipa neno maana ya kitheolojia isiyolazimika.
- source_word: לְעֵינֵי פַרְעֹה
  choice: mbele ya macho ya Farao
  rationale: Tafsiri hii huhifadhi taswira halisi ya nahau ya Kiebrania na kusisitiza kwamba tendo lifanyike Farao akiona.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya הַשָּׁמַיְמָה katika tendo la kutupa
  choice: kuelekea angani
  alternative: kuelekea mbinguni
  rationale: Katika muktadha huu neno linaeleza mwelekeo wa tendo la kimwili. “Angani” hudumisha maana hiyo, huku tanbihi ikihifadhi uwezekano wa tafsiri “mbinguni.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo “mbele ya macho ya Farao” umehifadhiwa kwa makusudi ili kuendeleza taswira yenye nguvu ya Kiebrania.
