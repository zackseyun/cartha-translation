base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/030.yaml
  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
translation:
  language: sw
  text: Lakini wewe na watumishi wako, najua kwamba bado[a] hamjamcha Yahwe[b] Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hata sasa hamjamcha,” au “kabla ya kumcha Yahwe Mungu.” Neno la Kiebrania linaweza kuonyesha jambo linalotangulia jingine (“kabla”) au, katika muktadha huu, maana ya “bado.”
    reason: lexical_alternative
  - marker: b
    text: “Yahwe” linawakilisha jina la Mungu la Kiebrania YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  choice: Lakini wewe
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha utofautishaji na kauli iliyotangulia; “Lakini wewe” ni ya asili na inadumisha mkazo huo.
- source_word: וַעֲבָדֶיךָ
  choice: na watumishi wako
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa. Katika muktadha wa jumba la Farao, “watumishi” linawajumuisha wahudumu na maafisa wake bila kulazimisha maana ya utumwa wa mali.
- source_word: יָדַעְתִּי
  choice: najua
  rationale: Kauli hii inaeleza ufahamu wa Musa wa wakati huo au tathmini yake thabiti; wakati wa sasa ni wa asili katika Kiswahili.
- source_word: כִּי
  choice: kwamba
  rationale: Neno hili linaanzisha maudhui ya jambo ambalo Musa analijua.
- source_word: טֶרֶם
  choice: bado
  rationale: Pamoja na kitenzi kinachofuata, neno hili linaeleweka kwa kawaida kuwa hali hiyo haijatokea mpaka wakati huu. Tanbihi inadumisha uwezekano wa maana ya “kabla.”
- source_word: תִּירְאוּן
  choice: hamjamcha
  rationale: Kitenzi ירא kinaweza kuhusisha hofu, kicho, au heshima yenye woga. “Kumcha” ni usemi wa kawaida kuhusu Mungu na hauifanyi maana kuwa hofu tupu wala heshima tupu.
- source_word: מִפְּנֵי
  choice: -mcha
  rationale: Katika muundo huu wa Kiebrania, מִפְּנֵי huunda usemi wa kumwogopa au kumcha mtu. Kiswahili huwasilisha uhusiano huo kiasili kwa kiambishi cha yambwa katika “hamjamcha.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja kama “Yahwe” badala ya kubadilishwa na cheo.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Neno hili linafuata jina la Mungu na kuunda jina kamili “Yahwe Mungu.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu YHWH moja kwa moja. “Yahwe” linadumisha jina hilo badala ya kulibadilisha na cheo.
- issue: Maana ya ירא inapomhusu Mungu
  choice: kumcha
  alternative: kumwogopa; kumheshimu kwa kicho
  rationale: “Kumcha” linadumisha mvutano wa maana kati ya hofu, kicho, na heshima bila kuifafanua kuwa hofu tupu au heshima tupu.
- issue: Nuansi ya muda katika טֶרֶם
  choice: bado hamjamcha
  alternative: kabla hamjamcha / kabla ya kumcha
  rationale: Katika muktadha, maana ya kawaida ni kwamba Farao na watumishi wake hawajafikia hali ya kumcha Mungu mpaka wakati huo. Tanbihi inahifadhi uwezekano wa tafsiri ya “kabla.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. “Watumishi” linafaa kwa mazingira ya ikulu, na “kumcha” linadumisha uzito wa kidini pamoja na upana wa maana ya kitenzi cha Kiebrania.
