  yaml_path: translation/ot/exodus/009/007.yaml
  text: Pharaoh sent[a], and behold, not even one of Israel’s livestock had died. But Pharaoh’s heart was heavy[b], and he did not let the people go.
translation:
  language: sw
  text: Farao akatuma, na tazama, hakufa hata mnyama mmoja katika mifugo ya Waisraeli. Lakini moyo wa Farao ukawa mzito[a], naye hakuwaruhusu watu hao waende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “moyo wa Farao ukawa mzito”; usemi unaomaanisha kuwa mgumu au mkaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma watu wachunguze
  rationale: Kitenzi שׁלח humaanisha kihalisi ‘kutuma’; katika muktadha huu kitu kilichotumwa hakitajwi, lakini kusudi ni kuthibitisha hali ya mifugo. Kiswahili huhitaji kijalizo cha asili zaidi, hivyo ‘watu wachunguze’ kinaweka wazi maana inayodokezwa bila kudai kwamba maandishi yanawataja wajumbe.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Hִנֵּה huvuta fikira kwenye jambo lililogunduliwa. ‘Na tazama’ huhifadhi msisitizo na uhai wa usimulizi kwa lugha yenye hadhi.
- source_word: לֹא מֵת מִמִּקְנֵה יִשְׂרָאֵל עַד אֶחָד
  choice: katika mifugo ya Waisraeli hakuna hata mmoja aliyekuwa amekufa
  rationale: עַד אֶחָד katika kauli hasi husisitiza kwamba hakufa hata mnyama mmoja. ‘Alikuwa amekufa’ huonyesha matokeo yaliyothibitishwa baada ya uchunguzi.
- source_word: מִקְנֶה
  choice: mifugo
  rationale: Neno hili linahusu kwa upana wanyama wanaofugwa, si ng’ombe peke yao.
- source_word: וַיִּכְבַּד לֵב פַּרְעֹה
  choice: moyo wa Farao ukawa mzito
  rationale: Tafsiri hii inafuata moja kwa moja sitiari ya Kiebrania, ambapo moyo ndio kiima na hakuna mtendaji wa nje anayetajwa. Tanbihi inaeleza maana ya ukaidi.
- source_word: וְלֹא שִׁלַּח אֶת הָעָם
  choice: naye hakuwaruhusu watu waondoke
  rationale: Katika simulizi la Kutoka, שׁלח ikiwa na watu kama yambwa humaanisha kuwaacha au kuwaruhusu waende.
theological_decisions:
- issue: Mtendaji katika kuwa mzito kwa moyo wa Farao
  choice: moyo wa Farao ukawa mzito
  alternative: moyo wa Farao ukafanywa mgumu / Farao akaufanya moyo wake kuwa mgumu
  rationale: Kifungu cha Kiebrania kinamtaja moyo wa Farao kuwa kiima cha ‘kuwa mzito’ bila kutaja mtendaji wa nje. Tafsiri ya moja kwa moja huhifadhi mvutano kuhusu uwajibikaji wa Farao na utendaji wa Mungu badala ya kuamua suala hilo kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Na tazama’ hudumisha uhai wa usimulizi; ‘ukawa mzito’ huhifadhi sitiari na utata halisi wa Kiebrania, huku tanbihi ikifafanua maana yake.
