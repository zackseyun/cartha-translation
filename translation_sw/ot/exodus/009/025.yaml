  to: Mvua ya mawe ikapiga, katika nchi yote ya Misri, kila kilichokuwa shambani, kuanzia watu[a] hadi wanyama. Mvua ya mawe ikapiga kila mmea wa shambani na ikavunja kila mti wa shambani.
