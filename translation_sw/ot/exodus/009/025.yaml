base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/025.yaml
  text: And the hail struck throughout all the land of Egypt everything that was in the field[a], from man to beast. The hail struck every plant of the field, and shattered every tree of the field.
translation:
  language: sw
  text: Mvua ya mawe ikapiga, katika nchi yote ya Misri, kila kilichokuwa shambani, kuanzia watu[a] hadi wanyama. Mvua ya mawe ikapiga kila mmea wa shambani na ikavunja kila mti wa shambani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanadamu.”
    reason: Mbadala wa “watu” kwa אָדָם katika usemi wa kuonyesha upeo kutoka kwa binadamu hadi wanyama.
lexical_decisions:
- source_word: וַיַּךְ / הִכָּה
  choice: ikapiga
  rationale: Kitenzi נכה kina maana ya kupiga au kuangamiza kwa pigo; “ikapiga” ni cha kawaida, chenye nguvu, na kinadumisha urudiaji wa Kiebrania.
- source_word: הַבָּרָד
  choice: mvua ya mawe
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa tukio hili la hali ya hewa; limerudiwa kama katika chanzo ili kuhifadhi msisitizo.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: katika nchi yote ya Misri
  rationale: Linaonyesha kwamba pigo lilienea kote katika eneo la Misri kwa Kiswahili cha kawaida.
- source_word: אֵת כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: kila kitu kilichokuwa shambani
  rationale: Linalinda upeo mpana wa כָּל אֲשֶׁר na mazingira ya eneo la wazi la kilimo.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: kuanzia watu mpaka wanyama
  rationale: Ni usemi unaojumuisha viumbe hai wote waliokuwa shambani, kutoka binadamu hadi wanyama; “watu” ni ya asili na jumuishi katika Kiswahili bila kupunguza maana ya אָדָם.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: kila mmea wa shambani
  rationale: עֵשֶׂב inaweza kumaanisha majani, mimea, au uoto; “mmea” ni wazi na linafaa katika muktadha wa uharibifu wa mimea ya shambani.
- source_word: עֵץ הַשָּׂדֶה
  choice: kila mti wa shambani
  rationale: Tafsiri ya moja kwa moja inayohifadhi urudiaji wa kirai “wa shambani.”
- source_word: שִׁבֵּר
  choice: kuvunja
  rationale: Piel ya שבר inaonyesha kuvunjwa kwa nguvu; “kuvunja” ni ya kawaida na huonyesha uharibifu wa miti bila kudokeza kwamba kila mti ulisagwasagwa kabisa.
theological_decisions:
- issue: Maana ya אָדָם katika usemi wa kuonyesha upeo wa viumbe hai
  choice: watu
  alternative: mwanadamu
  rationale: Katika מֵאָדָם וְעַד בְּהֵמָה, אָדָם humaanisha wanadamu kwa ujumla, si mwanaume wa jinsia ya kiume pekee. “Watu” huwasilisha maana hiyo kwa Kiswahili cha kawaida na kuhifadhi utofautishaji kati ya binadamu na wanyama.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi “ikapiga” umechaguliwa ili kuendana na mtiririko wa simulizi la Biblia. Urudiaji wa “mvua ya mawe,” “kila,” na “shambani” umehifadhiwa kwa sababu ni sehemu ya msisitizo wa Kiebrania.
