    issue: Uwekaji wa kirai cha mahali katika sentensi ya kwanza una utata mdogo.
    rationale: Katika “kila kitu kilichokuwa shambani katika nchi yote ya Misri,” kirai “katika nchi yote ya Misri” kinaweza kusomwa kama kirekebishi cha “kilichokuwa shambani.” Kiebrania hukifanya kirai hiki kieleze upeo wa tendo la mvua ya mawe.
  - severity: medium
    issue: Tanbihi [a] haijafungwa kwenye neno linalohitaji mbadala na maelezo yake hayatoi mbadala wa maana.
    rationale: Tanbihi ya Kiingereza inahusu אָדָם katika usemi “kutoka mtu hadi mnyama.” Tanbihi ya rasimu iko baada ya “Misri” na hutoa tu mpangilio mwingine wa sentensi bila tofauti ya kileksia. Iwekwe baada ya “watu” na ieleze “wanadamu” kama mbadala.
  revised_text: Mvua ya mawe ikapiga, katika nchi yote ya Misri, kila kilichokuwa shambani, kuanzia watu[a] hadi wanyama. Mvua ya mawe ikapiga kila mmea wa shambani na ikavunja kila mti wa shambani.
