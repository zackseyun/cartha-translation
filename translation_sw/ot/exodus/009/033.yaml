base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/033.yaml
  text: So Moses went out from Pharaoh[a], out of the city, and spread out his hands to Yahweh; and the thunder and the hail ceased[b], and rain was no longer poured down on the earth.
translation:
  language: sw
  text: Basi Musa akatoka kwa Farao, akatoka nje ya mji, akanyoosha mikono yake kuelekea Yahwe. Ndipo ngurumo[a] na mvua ya mawe vikakoma, na mvua haikumwagika tena juu ya nchi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “sauti”; katika muktadha huu wa dhoruba, maana yake ni ngurumo.'
    reason: lexical_alternative
  - marker: b
    text: Au, “mvua haikumwagika ardhini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מֹשֶׁה מֵעִם פַּרְעֹה אֶת הָעִיר
  choice: Musa akaondoka kwa Farao, akatoka nje ya mji
  rationale: Kirai מֵעִם kinaonyesha kuondoka mbele ya Farao, na אֶת הָעִיר katika muktadha huu kinaeleza kutoka mjini. Kiswahili kinahitaji kutenganisha mwendo huo katika vitenzi viwili ili maana iwe wazi na ya kawaida.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: akainyoosha mikono yake
  rationale: Nahau hii inaeleza ishara ya kusali kwa kunyoosha au kutandaza viganja. ‘Kuinyoosha mikono’ ni ya asili katika Kiswahili na inadumisha taswira ya mwili.
- source_word: אֶל יְהוָה
  choice: kwa Yahwe
  rationale: אֶל inaonyesha mwelekeo wa kitendo cha sala, na jina la agano יְהוָה limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: הַקֹּלוֹת
  choice: ngurumo
  rationale: Ingawa neno hilo kwa msingi humaanisha ‘sauti,’ katika muktadha wa dhoruba linarejelea ngurumo.
- source_word: וְהַבָּרָד
  choice: mvua ya mawe
  rationale: Hili ndilo neno la kawaida na linaloeleweka katika Kiswahili kwa בָּרָד.
- source_word: וַיַּחְדְּלוּ
  choice: vikakoma
  rationale: Kitenzi חדל kinaonyesha kwamba matukio hayo yalisimama; ‘vikakoma’ kinafaa kwa usimulizi wenye hadhi.
- source_word: וּמָטָר לֹא נִתַּךְ
  choice: na mvua haikumwagika tena
  rationale: Nifali ya נתך huonyesha kumwagwa. Neno ‘tena’ linaeleza kwa kawaida kwamba kunyesha kulikoma katika mfululizo wa simulizi bila kubadili wazo la msingi la ukanushaji.
- source_word: אָרְצָה
  choice: juu ya nchi
  rationale: Umbo lenye mwelekeo lina maana ya kuelekea chini, ardhini au kwenye nchi. ‘Juu ya nchi’ linadumisha upana wa neno אֶרֶץ, huku ‘ardhini’ likibaki tafsiri mbadala inayowezekana.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa usimulizi wa Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa baada ya maneno yanayohusika, si baada ya ‘Farao’ au ‘vikakoma,’ kwa kuwa maelezo hayo yanahusu ‘ngurumo’ na ‘nchi.’
