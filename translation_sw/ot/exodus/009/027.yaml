base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/027.yaml
  text: Then Pharaoh sent and called for Moses and Aaron[a], and said to them, “I have sinned this time. Yahweh is in the right[b], and I and my people are the wicked ones.”
translation:
  language: sw
  text: Ndipo Farao akatuma kuwaita Musa na Aroni, akawaambia, “Wakati huu nimetenda dhambi. Yahweh ndiye mwenye haki,[a] nami na watu wangu ndio waovu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahweh ndiye aliye sahihi,” au, “Yahweh ni mwadilifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nami na watu wangu ndio wenye hatia,” au, “ndio tuliokosea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא לְ
  choice: akatuma watu wawaite
  rationale: Kiswahili cha kawaida huhitaji kutaja kwa ujumla wale waliotumwa; usemi huu unahifadhi mfuatano wa kutuma na kuita bila kudokeza kwamba Farao mwenyewe aliwaendea.
- source_word: חָטָאתִי הַפָּעַם
  choice: Wakati huu nimetenda dhambi
  rationale: Hutoa kwa uwazi ungamo la Farao kuhusu kosa la tukio hili, huku hali timilifu ikionyesha tendo lililofanywa na kukiriwa sasa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa katika Kiebrania badala ya kulibadili kuwa cheo.
- source_word: הַצַּדִּיק
  choice: ndiye mwenye haki
  rationale: Katika muktadha huu wa hukumu na ungamo, usemi huu huhifadhi maana ya kuwa mwenye haki na kuwa upande ulio sahihi.
- source_word: הָרְשָׁעִים
  choice: ndio waovu
  rationale: Huhifadhi wingi na uzito wa kimaadili wa neno la Kiebrania, badala ya kulifanya kuwa kukosea tu.
- source_word: וַאֲנִי וְעַמִּי
  choice: nami na watu wangu
  rationale: Hufuata mpangilio wa Kiebrania na kuweka wazi kwamba Farao anajihusisha mwenyewe katika ungamo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Matini ina jina la Mungu moja kwa moja; kulinakili kama Yahwe huhifadhi tofauti kati ya jina na cheo.
- issue: Nguvu ya ungamo הַצַּדִּיק
  choice: ndiye mwenye haki
  alternative: yuko sahihi / ni mwadilifu
  rationale: Chaguo hili hudumisha maana ya kimaadili na kimahakama bila kuifanya kauli kuwa tofauti pana zaidi ya muktadha.
- issue: Maana ya הָרְשָׁעִים
  choice: ndio waovu
  alternative: ndio wenye hatia / ndio tuliokosea
  rationale: Neno linaweza kueleweka kimahakama kuwa wenye hatia, lakini hapa tafsiri kuu inahifadhi uzito wake wa kimaadili na ulinganifu wake na 'mwenye haki'.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku tofauti ya kimahakama na kimaadili kati ya mwenye haki na waovu ikihifadhiwa.
