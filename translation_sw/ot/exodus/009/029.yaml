  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מֹשֶׁ֔ה כְּ/צֵאתִ/י֙ אֶת הָ/עִ֔יר אֶפְרֹ֥שׂ אֶת כַּפַּ֖/י אֶל יְהוָ֑ה הַ/קֹּל֣וֹת יֶחְדָּל֗וּ/ן וְ/הַ/בָּרָד֙ לֹ֣א יִֽהְיֶה ע֔וֹד לְמַ֣עַן תֵּדַ֔ע כִּ֥י לַ/יהוָ֖ה הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/029.yaml
  text: Moses said to him[a], “As soon as I have gone out of the city, I will spread out my hands to Yahweh; the thunder will cease, and the hail will be no more[b], so that you may know that the earth belongs to Yahweh.”
translation:
  language: sw
  text: Musa akamwambia, “Mara tu nitakapotoka mjini, nitanyoosha mikono yangu kwa Yahwe. Ngurumo[a] zitakoma, na mvua ya mawe haitakuwapo tena, ili ujue kwamba dunia[b] ni mali ya Yahwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “sauti”; katika muktadha huu wa dhoruba, neno hilo linamaanisha ngurumo.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwamba nchi ni mali ya Yahwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: כְּצֵאתִי אֶת־הָעִיר
  choice: Mara tu nitakapotoka mjini
  rationale: Muundo wa כְּ pamoja na kitenzi-jina na kiambishi cha nafsi ya kwanza unaonyesha wakati wa kutoka kwa Musa; “mara tu” huwasilisha kwa Kiswahili cha kawaida kwamba kitendo kinachofuata kitaanza baada ya yeye kutoka mjini.
- source_word: אֶפְרֹשׂ אֶת־כַּפַּי
  choice: nitanyoosha mikono yangu
  rationale: פרשׂ pamoja na כף huonyesha kunyoosha au kutandaza mikono katika sala. “Kunyoosha mikono” ni usemi wa asili wa Kiswahili unaohifadhi ishara hiyo ya kimwili.
- source_word: יְהוָה / לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: הַקֹּלוֹת
  choice: ngurumo
  rationale: Ingawa neno hili kwa kawaida humaanisha “sauti,” katika muktadha wa dhoruba ya mvua ya mawe linarejelea ngurumo.
- source_word: יֶחְדָּלוּן
  choice: zitakoma
  rationale: חדל humaanisha kukoma au kuacha; “zitakoma” ni fupi, wazi, na inafaa kwa ngurumo.
- source_word: וְהַבָּרָד לֹא יִהְיֶה עוֹד
  choice: na mvua ya mawe haitakuwapo tena
  rationale: Tafsiri hii inahifadhi kauli ya Kiebrania kwamba mvua ya mawe haitakuwapo tena bila kuongeza maelezo kuhusu namna itakavyokoma.
- source_word: לְמַעַן תֵּדַע
  choice: ili ujue
  rationale: למען huanzisha kusudi; “ili ujue” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: כִּי לַיהוָה הָאָרֶץ
  choice: kwamba dunia ni mali ya Yahwe
  rationale: Herufi ל inaonyesha umiliki, na הָאָרֶץ inaweza kumaanisha dunia au nchi. “Dunia” inafaa kwa dai pana la enzi ya Yahwe, huku maana ya “nchi” ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu la herufi nne; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa הָאָרֶץ
  choice: dunia
  alternative: nchi
  rationale: Katika pambano na Farao, kauli hii inaweza kueleweka kama tangazo pana la mamlaka ya Yahwe juu ya dunia yote. Hata hivyo, maana ya “nchi” pia inawezekana kileksia na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi fupi baada ya “Yahwe” husaidia usomaji wa moja kwa moja, na istilahi “mvua ya mawe” ni ya kawaida kuliko tafsiri halisi isiyoeleweka ya ‘mawe ya barafu.’
