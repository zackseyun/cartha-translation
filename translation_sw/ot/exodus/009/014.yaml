  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֣י בַּ/פַּ֣עַם הַ/זֹּ֗את אֲנִ֨י שֹׁלֵ֜חַ אֶת כָּל מַגֵּפֹתַ/י֙ אֶֽל לִבְּ/ךָ֔ וּ/בַ/עֲבָדֶ֖י/ךָ וּ/בְ/עַמֶּ֑/ךָ בַּ/עֲב֣וּר תֵּדַ֔ע כִּ֛י אֵ֥ין כָּמֹ֖/נִי בְּ/כָל הָ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/014.yaml
  text: For this time I am sending all my plagues against your heart[a], and against your servants and your people[b], so that you may know that there is none like me in all the earth.
translation:
  language: sw
  text: Kwa maana wakati huu ninayatuma mapigo yangu yote dhidi ya moyo wako[a], na dhidi ya watumishi wako na watu wako, ili ujue kwamba hakuna aliye kama mimi duniani kote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “moyoni mwako.” Usemi wa Kiebrania unaweza kumaanisha kwamba mapigo yanalengwa kwa Farao mwenyewe, kwenye kiini cha nafsi yake.
    reason: lexical_alternative
  - marker: b
    text: Au “katika nchi yote,” ikiwa neno hili linaeleweka kwa upeo wa eneo hilo. Hapa limetafsiriwa “duniani kote” kwa sababu kauli hii inasisitiza kwamba hakuna anayelingana na BWANA popote ulimwenguni.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha kauli hii na sababu iliyotolewa katika muktadha uliotangulia, kwa lugha ya kawaida na yenye hadhi.
- source_word: בַּפַּעַם הַזֹּאת
  choice: wakati huu
  rationale: Ni usemi wa wakati unaoonyesha tukio au awamu hii ya sasa.
- source_word: שֹׁלֵחַ
  choice: ninayatuma
  rationale: Huhifadhi nguvu ya hali endelevu au tendo lililo karibu kutendeka inayowasilishwa na participle ya Kiebrania.
- source_word: כָּל מַגֵּפֹתַי
  choice: mapigo yangu yote
  rationale: Neno מַגֵּפָה linaweza kumaanisha pigo, tauni, au adhabu inayopiga; “mapigo” linafaa katika simulizi hili na halibani maana kwa magonjwa pekee.
- source_word: אֶל לִבְּךָ
  choice: dhidi ya moyo wako
  rationale: Huhifadhi taswira ya Kiebrania kwamba mapigo yanaelekezwa kwa moyo wa Farao, yaani kiini cha nafsi yake, badala ya kuirahisisha kuwa “dhidi yako” tu.
- source_word: וּבַעֲבָדֶיךָ
  choice: na dhidi ya watumishi wako
  rationale: “Watumishi” linafaa kwa maofisa au walio chini ya Farao katika muktadha huu kuliko “watumwa.”
- source_word: וּבְעַמֶּךָ
  choice: na watu wako
  rationale: Nguvu ya kihusishi “dhidi ya” inaendelea katika kirai hiki; “watu wako” ni Wamisri walio chini ya Farao.
- source_word: בַּעֲבוּר
  choice: ili
  rationale: Huonyesha kusudi kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: תֵּדַע
  choice: ujue
  rationale: Baada ya kiashiria cha kusudi, umbo hili linaonyesha matokeo yaliyokusudiwa bila kulifanya kuwa taarifa ya wakati ujao tu.
- source_word: אֵין כָּמֹנִי
  choice: hakuna aliye kama mimi
  rationale: Huwasilisha kwa kawaida dai la Kiebrania kwamba hakuna anayelingana na BWANA.
- source_word: בְּכָל הָאָרֶץ
  choice: duniani kote
  rationale: Ingawa אֶרֶץ pia linaweza kumaanisha “nchi,” hapa muktadha wa kutolinganishwa kwa Mungu unaelekea kwenye upeo wa ulimwengu mzima.
theological_decisions:
- issue: Upeo wa kutolinganishwa kwa Mungu
  choice: 'Upeo wa ulimwengu mzima: “duniani kote”'
  alternative: 'Upeo wa eneo moja: “katika nchi yote”'
  rationale: Simulizi linatangaza upekee wa BWANA zaidi ya Misri pekee, bila kuongeza kauli za kimafundisho zisizomo katika mstari.
- issue: Maana ya “dhidi ya moyo wako”
  choice: Kudumisha taswira ya mapigo yanayoelekezwa dhidi ya moyo au kiini cha Farao
  alternative: Kufafanua moja kwa moja kuwa “dhidi yako mwenyewe”
  rationale: Kiebrania kinataja moyo waziwazi. Kuudumisha kunahifadhi mvutano wa simulizi kuhusu moyo wa Farao bila kuamua kimyakimya maana yake yote.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unalenga ulinganifu bora: unadumisha taswira isiyo ya kawaida ya “moyo” na dai lenye uzito la upekee wa Mungu, huku sentensi ikibaki wazi kwa msomaji wa kawaida.'
