base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/020.yaml
  text: Whoever among Pharaoh’s servants feared the word of Yahweh hurried his servants and his livestock into the houses[a][b].
translation:
  language: sw
  text: Yeyote miongoni mwa watumishi wa Farao aliyeliogopa neno la Yahweh aliwafanya watumishi wake na mifugo yake wakimbilie ndani ya nyumba[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yule miongoni mwa watumishi wa Farao aliyeliogopa neno la Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “alisababisha wakimbie”; yaani, aliwaingiza upesi mahali pa kujisitiri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּרֵא
  choice: Yeyote ... aliyeliogopa
  rationale: 'Kihusishi pamoja na umbo la kitenzi kishirikishi hutaja mtu katika kundi: ‘yeyote aliyekuwa akiogopa/aliyeogopa.’ Kiswahili hiki kinaonyesha kwamba ni baadhi ya watumishi wa Farao.'
- source_word: דְּבַר יְהוָה
  choice: neno la Yahweh
  rationale: דבר ni ‘neno’ au ‘ujumbe’; ‘neno la Yahweh’ huhifadhi nahau ya kibiblia bila kulibana kuwa ‘onyo’ pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: מֵעַבְדֵי פַּרְעֹה
  choice: miongoni mwa watumishi wa Farao
  rationale: מִן lina maana ya sehemu ya kundi hapa; ‘miongoni mwa’ ni Kiswahili cha kawaida na sahihi.
- source_word: הֵנִיס
  choice: aliwahimiza ... waingie
  rationale: Hifili ya נוס humaanisha ‘kusababisha wakimbie/waondoke haraka.’ Katika muktadha huu, mhusika aliwaingiza watu na wanyama haraka mahali pa kujisitiri; ‘aliwahimiza ... waingie’ huhifadhi uharaka bila kudai kwamba walikimbia kwa hofu.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: עבד inaweza kuwa mtumwa au mtumishi. Hapa inataja watu walio chini ya mkuu wa Kimisri, na ‘watumishi’ ni pana na ya kawaida bila kuamua hadhi yao kwa namna isiyolazimishwa na muktadha.
- source_word: מִקְנֵהוּ
  choice: mifugo yake
  rationale: מִקְנֶה ni wanyama wanaofugwa kwa ujumla, si ng’ombe pekee.
- source_word: אֶל הַבָּתִּים
  choice: waingie ndani ya nyumba
  rationale: Kirai kinaonyesha mwendo kuelekea ndani ya majengo ya kujisitiri, na wingi wa ‘nyumba’ umehifadhiwa.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יְהוָה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Aliwahimiza ... waingie’ ni usemi wa kawaida unaowasilisha uharaka wa kitendo; tanbihi huhifadhi taswira halisi zaidi ya Kiebrania. Viashiria vyote vya tanbihi vimewekwa katika matini kuu.
