base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/035.yaml
  text: So Pharaoh’s heart was hardened[a], and he did not let the sons of Israel go[c][b], just as Yahweh had spoken through Moses.
translation:
  language: sw
  text: Basi moyo wa Farao ukawa mgumu[a], naye hakuwaruhusu wana wa Israeli[b] waondoke, kama vile Yahwe alivyosema kupitia Musa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moyo wa Farao ukazidi kuwa mgumu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwa na nguvu au kuwa imara; hapa kinaonyesha ugumu wa ukaidi.
    reason: alternative_reading
  - marker: b
    text: Au, “Waisraeli”; Kiebrania kihalisi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kwa mkono wa Musa,” nahau yenye maana ya “kupitia Musa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: ukawa mgumu
  rationale: Kitenzi חזק kina wazo la kuwa imara au kuwa na nguvu; katika muktadha huu kinaonyesha moyo kuwa mgumu kwa ukaidi. ‘Ukawa mgumu’ ni Kiswahili cha kawaida na hakiongezi wazi mtendaji aliyesababisha hali hiyo.
- source_word: לֵב פַּרְעֹה
  choice: moyo wa Farao
  rationale: Huhifadhi taswira ya Kiebrania ya moyo kama kitovu cha nia na msimamo wa ndani.
- source_word: שִׁלַּח
  choice: hakuwaruhusu ... waondoke
  rationale: Katika simulizi la Kutoka, kitenzi hiki humaanisha Farao kuwaruhusu watu wa Israeli kuondoka. Muundo huu ni wa asili katika Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi usemi wa Kiebrania ‘wana wa Israeli’; hapa unamaanisha wazao au watu wa Israeli kwa pamoja.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Huonyesha ulinganifu kati ya tukio hilo na neno la Mungu lililotangulia.
- source_word: דִּבֶּר יְהוָה
  choice: Yahwe alivyokuwa amesema
  rationale: Wakati uliotumika unaonyesha kuwa kauli ya Yahwe ilitangulia kutimia kwake katika tukio hili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: בְּיַד מֹשֶׁה
  choice: kupitia Musa
  rationale: Usemi wa Kiebrania ‘kwa mkono wa Musa’ ni nahau ya uwakala; ‘kupitia Musa’ huwasilisha maana hiyo wazi na kwa Kiswahili cha sasa.
theological_decisions:
- issue: Uwakala katika kufanywa kwa moyo kuwa mgumu
  choice: moyo wa Farao ukawa mgumu
  alternative: moyo wa Farao ulifanywa mgumu; Farao aliufanya moyo wake kuwa mgumu
  rationale: Muundo wa Kiebrania unasema moyo ulikuwa au ukawa imara, bila kumtaja moja kwa moja katika kifungu hiki Mungu au Farao kuwa ndiye aliyesababisha hali hiyo. Tafsiri hii inadumisha mvutano huo badala ya kuamua sababu kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka, huku ‘wana wa Israeli’ ikidumisha uwazi kwa muundo wa chanzo na tanbihi ikitoa usemi wa kawaida zaidi ‘Waisraeli.’
