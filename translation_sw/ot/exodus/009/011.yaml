  yaml_path: translation/ot/exodus/009/011.yaml
  text: And the magicians were not able to stand before Moses because of the boils[a], for the boils were on the magicians and on all the Egyptians.
translation:
  language: sw
  text: Nao waganga hawakuweza kusimama mbele ya Mose kwa sababu ya majipu, kwa maana majipu yaliwapata waganga na watu wote wa Misri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “na katika Misri yote.” Muktadha unaonyesha kwamba majipu yaliwapata watu kote Misri.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: waganga
  rationale: Katika simulizi la Kutoka, neno hili linawataja wataalamu wa Farao wa mambo ya uchawi na desturi za kidini. “Waganga” ni neno la kawaida la Kiswahili katika muktadha huu, bila kuwafanya waonekane kuwa matabibu wa kawaida.
- source_word: לַעֲמֹד לִפְנֵי מֹשֶׁה
  choice: kusimama mbele ya Mose
  rationale: Huhifadhi kwa njia ya kawaida nahau ya Kiebrania, ambayo hapa humaanisha kuwa mbele yake au kujitokeza mbele yake.
- source_word: מִפְּנֵי הַשְּׁחִין
  choice: kwa sababu ya majipu
  rationale: מִפְּנֵי inaonyesha sababu hapa, na שְׁחִין ni ugonjwa wa ngozi wenye majipu au vidonda vilivyovimba. Wingi “majipu” huwasilisha maana yake ya jumla na yenye kugawanyika kwa waathiriwa wengi.
- source_word: הַשְּׁחִין
  choice: majipu
  rationale: Neno limerudiwa kwa uthabiti; ingawa nomino ya Kiebrania iko katika umoja wa kijumla, Kiswahili hutumia wingi kwa hali hii ya majipu mengi.
- source_word: בַּחֲרְטֻמִּם
  choice: yaliwapata waganga
  rationale: Tafsiri ya kimatumizi inaonyesha kuwa majipu yalikuwa katika miili ya waganga, badala ya kutumia muundo usio wa kawaida wa “yalikuwa juu yao.”
- source_word: וּבְכָל מִצְרַיִם
  choice: na watu katika Misri yote
  rationale: Kiebrania kinasema kihalisi “na katika Misri yote.” Mlingano na waganga pamoja na muktadha wa pigo unaashiria watu walioathiriwa kote nchini, lakini tanbihi huhifadhi usemi halisi na upeo wake wenye kiasi cha utata.
