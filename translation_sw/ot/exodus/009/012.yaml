  text: וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/012.yaml
  text: But Yahweh hardened Pharaoh's heart[a], and he did not listen to them, just as Yahweh had spoken to Moses.
translation:
  language: sw
  text: Lakini Yahwe aliufanya moyo wa Farao kuwa mgumu[a], naye hakuwasikiliza, kama vile Yahwe alivyokuwa amemwambia Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliufanya moyo wa Farao kuwa imara,” au “aliutia nguvu moyo wa Farao.” Kitenzi cha Kiebrania kwa maana halisi zaidi ni “kufanya kuwa na nguvu au imara,” lakini hapa kinarejelea ukaidi wa Farao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: aliufanya ... kuwa mgumu
  rationale: Kitenzi חזק humaanisha kwa msingi kufanya kuwa na nguvu au imara; kinapotumiwa kuhusu moyo wa Farao katika muktadha huu kinaonyesha ukaidi wake. Usemi huu wa Kiswahili ni wa kawaida na unadumisha tendo la moja kwa moja la Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama Yahwe badala ya kubadilishwa na cheo, hivyo kudumisha jina binafsi katika matini chanzo.
- source_word: לֵב פַּרְעֹה
  choice: moyo wa Farao
  rationale: Muundo wa umilikaji umetafsiriwa kwa Kiswahili cha kawaida. Neno 'moyo' limehifadhiwa bila kulipanua kuwa nia au tabia.
- source_word: שָׁמַע אֲלֵהֶם
  choice: hakuwasikiliza
  rationale: שׁמע pamoja na אֶל hapa ni kusikiliza au kutii kwa makini. 'Hakuwasikiliza' ni ya asili na haiongezi kwa uwazi wazo maalumu la kutii.
- source_word: אֲלֵהֶם
  choice: -wa-
  rationale: Kiambishi cha yambwa cha wingi kinahifadhi kiwakilishi cha Kiebrania bila kuwataja wazi Musa na Aroni.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: kama vile Yahwe alivyokuwa amemwambia Musa
  rationale: Kauli hii inaonyesha kutimia kwa neno la Yahwe lililotangulia. Wakati uliotumika unaonyesha kwamba kusema huko kulitokea kabla ya tukio linalosimuliwa.
theological_decisions:
- issue: Utendaji wa Mungu katika kuufanya moyo wa Farao kuwa mgumu
  choice: Yahwe aliufanya moyo wa Farao kuwa mgumu
  alternative: Yahwe aliufanya moyo wa Farao kuwa imara / aliutia nguvu moyo wa Farao
  rationale: Kiebrania kinamtaja Yahwe moja kwa moja kuwa mtendaji na moyo wa Farao kuwa yambwa. Tafsiri hailegezi jambo hilo kuwa ruhusa tu, huku tanbihi ikihifadhi maana za msingi za kufanya imara au kutia nguvu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mstari umebaki karibu na Kiebrania bila kuwa mgumu kusoma.
