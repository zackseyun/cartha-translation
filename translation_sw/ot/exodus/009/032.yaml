  text: But the wheat and the spelt were not struck down[b][a], because they were late-ripening.
translation:
  language: sw
  text: Lakini ngano na ngano aina ya emmeri[a] hazikupigwa, kwa sababu zilikuwa za kuchelewa kukomaa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “ngano aina ya emmeri” huenda linamaanisha spelta au nafaka nyingine inayofanana nayo.
    reason: cultural_note
  - marker: b
    text: Au, “kwa maana hukomaa baadaye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחִטָּה
  choice: Lakini ngano
  rationale: חִטָּה ni ngano. Kiunganishi וְ kimetafsiriwa ‘Lakini’ ili kuonyesha tofauti na mazao yaliyoharibiwa katika mstari uliotangulia.
- source_word: וְהַכֻּסֶּמֶת
  choice: na ngano aina ya emmeri
  rationale: כֻּסֶּמֶת ni nafaka inayotambulishwa kwa kawaida kuwa spelta au emmeri. ‘Ngano aina ya emmeri’ ni maelezo yanayoeleweka kwa msomaji wa Kiswahili huku yakidumisha kutokuwa na uhakika wa utambulisho wake kamili.
- source_word: לֹא נֻכּוּ
  choice: hazikupigwa
  rationale: Kauli tendwa ya נכה inaonyesha kwamba mazao haya hayakupigwa na mvua ya mawe. ‘Hazikupigwa’ huhifadhi picha halisi na muktadha wa pigo.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי hapa inatanguliza sababu iliyofanya mazao hayo yasiathiriwe.
- source_word: אֲפִילֹת הֵנָּה
  choice: zilikuwa zinachelewa kukomaa
  rationale: Kirai hiki kinaelekea kueleza kwamba mimea hiyo ilikuwa katika hatua ya nyuma ya ukuaji au ilikomaa baadaye; tafsiri hii inaweka wazi maana ya kilimo bila kutumia tafsiri halisi isiyoeleweka kama ‘zilikuwa nyeusi.’
