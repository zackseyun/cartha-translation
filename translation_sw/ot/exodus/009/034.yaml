base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/034.yaml
  text: But when Pharaoh saw that the rain and the hail and the thunder had ceased[a], he continued to sin and hardened his heart, he and his servants.
translation:
  language: sw
  text: Lakini Farao alipoona kwamba mvua, mvua ya mawe na ngurumo[a] zimekoma, alizidi kutenda dhambi, naye akaufanya moyo wake kuwa mgumu, yeye pamoja na watumishi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “sauti”; katika muktadha huu wa dhoruba, neno hilo linamaanisha ngurumo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipoona
  rationale: ראה katika simulizi kwa kawaida ni ‘kuona’; muundo wa ‘alipoona kwamba’ unaonyesha kwa kawaida utambuzi wa hali bila kuongeza tafsiri.
- source_word: כִּי
  choice: kwamba
  rationale: כִּי hapa inaanzisha yaliyoonwa na Farao; maana ya wakati imewasilishwa na ‘alipoona.’
- source_word: חָדַל
  choice: vilikuwa vimekoma
  rationale: חדל humaanisha kukoma. Wingi unapatana na orodha ya mvua, mvua ya mawe na ngurumo, na wakati timilifu unaonyesha kuwa vilikoma kabla ya mwitikio wa Farao.
- source_word: הַמָּטָר
  choice: mvua
  rationale: Hili ni neno la kawaida na la moja kwa moja kwa מטר.
- source_word: הַבָּרָד
  choice: mvua ya mawe
  rationale: Hii ndiyo tafsiri ya kawaida ya ברד na inaeleweka wazi katika Kiswahili cha Afrika Mashariki.
- source_word: הַקֹּלֹת
  choice: ngurumo
  rationale: Ingawa קֹלוֹת kihalisi ni ‘sauti,’ katika muktadha huu wa dhoruba inarejelea ngurumo; tanbihi inahifadhi umbo la Kiebrania.
- source_word: וַיֹּסֶף לַחֲטֹא
  choice: alizidi kutenda dhambi
  rationale: Muundo יסף pamoja na kitenzi-jina huonyesha kuendelea au kufanya tena. ‘Alizidi kutenda dhambi’ huhifadhi hali ya kuendelea na kuongezeka kwa kosa bila kuwa tafsiri ngumu ya neno kwa neno.
- source_word: וַיַּכְבֵּד לִבּוֹ
  choice: akaufanya moyo wake kuwa mgumu
  rationale: כבד kihalisi huhusiana na uzito, lakini hapa ni nahau ya moyo kuwa mgumu au mkaidi. Kauli hii pia huhifadhi wazi kwamba Farao ndiye mtendaji katika aya hii.
- source_word: הוּא וַעֲבָדָיו
  choice: yeye na watumishi wake
  rationale: עבדים katika simulizi la kifalme inaweza kumaanisha watumishi au maafisa wa ikulu. ‘Watumishi’ huhifadhi upana wa neno, huku ‘yeye’ ikidumisha msisitizo wa הוּא.
- source_word: וַ
  choice: Lakini
  rationale: Waw ya mwanzo inaendeleza simulizi; ‘Lakini’ huonyesha tofauti na toba ya Farao iliyoonekana katika muktadha wa karibu.
theological_decisions:
- issue: Mtendaji na upeo wa kuufanya moyo kuwa mgumu
  choice: Aya inasema Farao aliufanya moyo wake mwenyewe kuwa mgumu, kisha inaongeza ‘yeye na watumishi wake.’
  alternative: Kirai cha mwisho kinaweza kueleweka kuwa kinawahusisha Farao na watumishi wake kwa ujumla katika tendo la kufanya mioyo yao kuwa migumu, ingawa nomino ‘moyo wake’ ni ya umoja.
  rationale: Kiebrania kinamtaja Farao wazi kuwa mtendaji na kinatumia ‘moyo wake’ katika umoja, halafu kinaongeza kirai chenye utata wa kisintaksia ‘yeye na watumishi wake.’ Tafsiri inadumisha mvutano huo bila kuamua zaidi suala pana la utendaji wa Mungu na mwanadamu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mvua ya mawe’ ni wazi kuliko istilahi adimu; ‘akaufanya moyo wake kuwa mgumu’ huhifadhi utendaji wa kisarufi na nahau ya moyo bila kuingiza msimamo wa kimadhehebu.
