base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/015.yaml
  text: For by now I could have stretched out my hand and struck you and your people with pestilence[a], and you would have been cut off from the earth.
translation:
  language: sw
  text: Kwa maana kufikia sasa ningeweza kuunyosha mkono wangu na kukupiga wewe na watu wako kwa tauni[a], nawe ungefutiliwa mbali kutoka duniani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata maumbo ya Kiebrania kwa ukaribu zaidi, “Kwa maana sasa nimeunyosha mkono wangu, nikakupiga wewe na watu wako kwa tauni, nawe ukafutiliwa mbali kutoka duniani.” Vitenzi vya Kiebrania vina maumbo ya wakati uliopita, lakini muktadha unaunga mkono sana maana ya jambo ambalo lingeweza kutokea lakini halikutokea.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inafafanua sababu ya maneno yaliyotangulia.
- source_word: עַתָּה
  choice: kufikia sasa
  rationale: Katika kauli hii ya jambo ambalo lingeweza kutokea lakini halikutokea, maneno haya yanaonyesha kuwa tendo hilo lingeweza kuwa limekwisha kutendeka kufikia wakati huo.
- source_word: שָׁלַחְתִּי אֶת־יָדִי
  choice: ningaliweza kuunyosha mkono wangu
  rationale: Kirai hiki ni nahau ya hatua au hukumu ya Mungu. Ingawa kitenzi cha Kiebrania kina umbo la wakati uliopita, muktadha unakipa maana ya tendo ambalo lingeweza kutokea.
- source_word: וָאַךְ
  choice: na kukupiga
  rationale: Kitenzi נכה katika muktadha wa hukumu na mapigo kinatafsiriwa kwa kawaida na kwa nguvu kama ‘kupiga’.
- source_word: אֹתְךָ וְאֶת־עַמְּךָ
  choice: wewe na watu wako
  rationale: Ni tafsiri ya moja kwa moja ya walengwa wote wawili wa hukumu.
- source_word: בַּדָּבֶר
  choice: kwa tauni
  rationale: דֶּבֶר humaanisha ugonjwa hatari wa kuambukiza au tauni katika miktadha ya hukumu; ‘tauni’ ni sahihi na haitatanishi neno hili na mfululizo mzima wa mapigo.
- source_word: וַתִּכָּחֵד
  choice: ungaliondolewa
  rationale: Nifali ya כחד hubeba wazo la kufutiliwa mbali au kutoweshwa. ‘Ungaliondolewa’ huhifadhi maana ya kutendwa na pia maana ya jambo lisilotokea.
- source_word: מִן־הָאָרֶץ
  choice: duniani
  rationale: Hapa אֶרֶץ inaelekea kumaanisha dunia kwa upana, si nchi ya Misri pekee; ‘duniani’ ni usemi wa kawaida wa Kiswahili katika kirai hiki.
theological_decisions:
- issue: Maana ya kauli isiyotimia katika mfuatano wa vitenzi
  choice: 'Kutafsiri kama jambo ambalo Mungu angaliweza kulifanya lakini hakulifanya: ‘ningaliweza ... nawe ungali...’'
  alternative: 'Kutafsiri rasmi zaidi kwa wakati uliopita: ‘sasa nimeunyosha mkono wangu ... nawe ukaondolewa...’'
  rationale: Muktadha wa karibu unatofautisha jambo ambalo Mungu angeweza kufanya na kusudi la kumwacha Farao hai ili nguvu zake zionekane (mst. 15–16). Tafsiri ya wakati uliopita pekee ingepingana kwa dhahiri na ukweli kwamba Farao bado yuko hai na anazungumziwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Maumbo ‘ningaliweza’ na ‘ungaliondolewa’ yanatumika kudhihirisha kwa uwazi hali isiyotimia bila kuondoa tanbihi kuhusu umbo rasmi la Kiebrania.
