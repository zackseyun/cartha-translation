  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֣ה לְ/אָבָ֔ק עַ֖ל כָּל אֶ֣רֶץ מִצְרָ֑יִם וְ/הָיָ֨ה עַל הָ/אָדָ֜ם וְ/עַל הַ/בְּהֵמָ֗ה לִ/שְׁחִ֥ין פֹּרֵ֛חַ אֲבַעְבֻּעֹ֖ת בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/009.yaml
  text: And it will become fine dust over all the land of Egypt[b][a], and it will become boils breaking out with blisters on man and on beast throughout all the land of Egypt.
translation:
  language: sw
  text: Hayo yatakuwa vumbi laini juu ya nchi yote ya Misri; nayo yatakuwa majipu yanayozuka yenye malengelenge juu ya wanadamu[a] na wanyama katika nchi yote ya Misri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu.” Neno la Kiebrania hapa linamaanisha wanadamu kwa ujumla, likiwatofautisha na wanyama.
    reason: lexical_alternative
  - marker: b
    text: Kirai cha Kiebrania kinataja majipu, kitendo cha kuzuka, na malengelenge.
    reason: source_clarity
lexical_decisions:
- source_word: וְהָיָה לְאָבָק
  choice: Nayo yatakuwa vumbi laini
  rationale: Kitenzi היה kinaonyesha badiliko la hali, huku אָבָק likimaanisha vumbi au unga mwembamba. Kiambishi cha ngeli katika “y yatakuwa” kinarejelea majivu ya mstari uliotangulia.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: juu ya nchi yote ya Misri
  rationale: עַל hapa linaonyesha vumbi likienea juu ya eneo lote la Misri.
- source_word: עַל הָאָדָם וְעַל הַבְּהֵמָה
  choice: juu ya wanadamu na wanyama
  rationale: אָדָם limetumiwa kwa maana ya wanadamu kwa ujumla, kinyume na בְּהֵמָה, jina la mkusanyiko kwa wanyama. Wingi ni wa asili zaidi katika Kiswahili.
- source_word: לִשְׁחִין פֹּרֵחַ אֲבַעְבֻּעֹת
  choice: majipu yanayozuka yakiwa na malengelenge
  rationale: 'Tafsiri hii inawakilisha vipengele vyote vitatu: שְׁחִין kama majipu, פֹּרֵחַ kama kuzuka, na אֲבַעְבֻּעֹת kama malengelenge, bila kuvifupisha kuwa ugonjwa mmoja tu.'
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: katika nchi yote ya Misri
  rationale: Kirai kinachorudiwa kinasisitiza kwamba pigo litaenea katika eneo lote la Misri.
theological_decisions:
- issue: Maana ya jumla ya אָדָם katika utofautishaji wa binadamu na wanyama
  choice: wanadamu
  alternative: mtu
  rationale: “Wanadamu” linaonyesha wazi kwamba neno hilo linawahusu watu wote kwa ujumla, huku likihifadhi utofautishaji wa Kiebrania kati ya binadamu na wanyama.
- issue: Uhusiano wa שְׁחִין, פֹּרֵחַ, na אֲבַעְבֻּעֹת
  choice: majipu yanayozuka yakiwa na malengelenge
  alternative: majipu yenye malengelenge
  rationale: Uchaguzi huu hauondoi taswira ya פֹּרֵחַ ya hali ya ngozi inayozuka, wala nomino אֲבַעְבֻּעֹת inayotaja malengelenge.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi marudio na ukubwa wa eneo unaosisitizwa katika Kiebrania.
