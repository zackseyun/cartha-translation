  verdict: revise
  source_fidelity: 'The draft retains the twofold result of the scattered ashes: fine dust over Egypt and boils erupting with blisters on humans and animals. However, the singular second predicate ("nalo litakuwa majipu") creates a grammatical and referential mismatch with the plural antecedent, the ashes, and the plural predicate "majipu."'
  naturalness: '"Majipu yanayozuka yakiwa na malengelenge" is understandable but somewhat cumbersome. "Majipu yanayozuka yenye malengelenge" is more compact and natural while retaining the eruptive participle and the blisters.'
  terminology: '"Vumbi laini," "wanadamu," "wanyama," "majipu," and "malengelenge" are appropriate Standard East African Swahili equivalents. The generic sense of האדם is correctly represented by "wanadamu."'
  issues:
