    issue: Pronoun and agreement mismatch in "nalo litakuwa majipu."
    rationale: The preceding subject is the ashes from the prior verse, reflected by plural "yatakuwa" in the first clause. The singular "nalo" instead points to "vumbi," yet "litakuwa majipu" pairs a singular subject with a plural predicate and obscures the source's continuing result sequence.
  - severity: low
    issue: The skin-affliction phrase is unnecessarily heavy.
    rationale: The draft's wording is intelligible, but a more idiomatic construction can preserve all three Hebrew elements—boils, eruption, and blisters—without adding or omitting meaning.
  revised_text: Hayo yatakuwa vumbi laini juu ya nchi yote ya Misri; nayo yatakuwa majipu yanayozuka yenye malengelenge juu ya wanadamu[a] na wanyama katika nchi yote ya Misri.[b]
