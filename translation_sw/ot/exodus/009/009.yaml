revisions:
- from: Nayo yatakuwa vumbi laini juu ya nchi yote ya Misri; nalo litakuwa majipu yanayozuka yakiwa na malengelenge juu ya wanadamu[a] na wanyama katika nchi yote ya Misri.[b]
  to: Hayo yatakuwa vumbi laini juu ya nchi yote ya Misri; nayo yatakuwa majipu yanayozuka yenye malengelenge juu ya wanadamu[a] na wanyama katika nchi yote ya Misri.[b]
  rationale: The revision makes both result clauses agree with the plural antecedent supplied by the preceding verse (the ashes), while retaining the Hebrew's repeated "will become." It also smooths the rendering of לִשְׁחִין פֹּרֵחַ אֲבַעְבֻּעֹת without collapsing the distinct ideas of boils, eruption, and blisters.
