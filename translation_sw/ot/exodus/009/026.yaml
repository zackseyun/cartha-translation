  text: Katika nchi ya Gosheni tu, ambako wana wa Israeli[a] walikuwa, hakukuwa na mvua ya mawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
