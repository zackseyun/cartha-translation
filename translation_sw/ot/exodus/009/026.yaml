lexical_decisions:
- source_word: רַק
  choice: tu
  rationale: Kiambishi ‘tu’ kinaonyesha uzuiaji na upekee wa eneo hilo kwa Kiswahili cha kawaida.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: katika nchi ya Gosheni
  rationale: Huhifadhi maana ya eneo lililoitwa Gosheni na muundo wa kihusishi wa Kiebrania.
- source_word: אֲשֶׁר שָׁם
  choice: ambako
  rationale: Ni usemi wa mahali ulio wa asili katika Kiswahili na unawakilisha kiunganishi pamoja na kielezi cha mahali.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu usemi wa kifamilia wa Kiebrania, huku ukibaki wa kueleweka katika Kiswahili.
- source_word: לֹא הָיָה
  choice: hakukuwa na
  rationale: Huwasilisha kwa kawaida hali ya kutokuwapo inayosemwa na kitenzi היה kilichokanushwa.
- source_word: בָּרָד
  choice: mvua ya mawe
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa tukio la hali ya hewa la mvua ya mawe.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Kiebrania kinasema kihalisi ‘wana wa Israeli.’ Tafsiri kuu inadumisha taswira hiyo ya kifamilia bila kuibadili kuwa jina la taifa, na tanbihi inaonyesha mbadala wa kimaanawi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio ‘Ni ... tu’ unatanguliza msisitizo wa רַק kwa njia ya asili.
