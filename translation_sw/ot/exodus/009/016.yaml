base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/016.yaml
  text: 'But for this purpose I have let you stand: to show you my power[a], and so that my name may be proclaimed in all the earth.'
translation:
  language: sw
  text: 'Lakini nimekuacha uendelee kuwapo kwa kusudi hili: ili nikuonyeshe nguvu zangu,[a] na ili jina langu litangazwe katika dunia yote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimekusimamisha.” Kiebrania kinaweza kueleweka kuwa Mungu alimfanya Farao asimame au aendelee kuwapo; katika muktadha huenda maana ni kwamba Mungu alimhifadhi badala ya kumwangamiza mara moja.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוּלָם
  choice: Lakini
  rationale: Inaonyesha utofautishaji wenye nguvu na kauli iliyotangulia, kwa lugha ya kawaida na yenye heshima.
- source_word: בַּעֲבוּר זֹאת
  choice: kwa kusudi hili
  rationale: Kifungu hiki kinaonyesha kusudi la Mungu, si sababu ya tukio pekee.
- source_word: הֶעֱמַדְתִּיךָ
  choice: nimekuacha uendelee kusimama
  rationale: Hifili ya עמד inaweza kumaanisha kumfanya mtu aendelee kuwapo au kusimama. Katika muktadha, Farao ameendelea kuwa hai badala ya kuangamizwa mara moja; usemi huu pia unahifadhi taswira ya Kiebrania.
- source_word: בַּעֲבוּר הַרְאֹתְךָ
  choice: ili nikuonyeshe
  rationale: Inaeleza kusudi kwa njia ya moja kwa moja na ya asili katika Kiswahili.
- source_word: כֹּחִי
  choice: nguvu zangu
  rationale: כח hapa ni uwezo au nguvu za Mungu zinazoonyeshwa katika mapigo; wingi wa Kiswahili 'nguvu zangu' ni usemi wa kawaida.
- source_word: וּלְמַעַן
  choice: na ili
  rationale: Inaunganisha wazi kusudi la pili na kusudi la kwanza.
- source_word: סַפֵּר
  choice: litangazwe
  rationale: Pieli ya ספר humaanisha kusimulia au kutangaza. Kauli tendwa inahifadhi kutotajwa kwa mtendaji katika Kiebrania.
- source_word: שְׁמִי
  choice: jina langu
  rationale: Inahifadhi usemi wa Kiebrania, ambao unajumuisha sifa na utambulisho wa Mungu uliofunuliwa.
- source_word: בְּכָל הָאָרֶץ
  choice: katika dunia yote
  rationale: Katika muktadha huu usemi una upeo mpana wa ulimwengu, si eneo la nchi moja tu.
theological_decisions:
- issue: Maana ya הֶעֱמַדְתִּיךָ kuhusiana na Farao
  choice: Mungu amemwacha Farao aendelee kusimama, yaani aendelee kuwa hai, kwa kusudi lake.
  alternative: Mungu alimwinua Farao na kumweka katika cheo chake kwa kusudi hili.
  rationale: Muktadha wa karibu unatofautisha kile ambacho Mungu angeweza kufanya—kumwangamiza Farao—na ukweli kwamba bado anaendelea kusimama. Tafsiri inatanguliza maana ya kuhifadhi au kuruhusu aendelee kuwapo bila kuondoa uwezekano wa maana pana ya kumfanya asimame.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa makusudi mawili na taswira ya ‘kusimama’ vimehifadhiwa bila kuamua kupita kiasi utata wa Kiebrania.
