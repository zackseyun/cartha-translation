  text: Behold[a], about this time tomorrow I will rain down very heavy hail[b], such as has never been in Egypt from the day it was founded until now.
translation:
  language: sw
  text: Tazama, wakati kama huu kesho[a], nitanyesha mvua ya mawe nzito sana, ambayo mfano wake haujawahi kuwapo nchini Misri tangu siku nchi hiyo ilipoanzishwa[b] mpaka sasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati huu kesho.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tangu siku nchi hiyo ilipowekwa imara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Tazama
  rationale: Neno hili linatanguliza tangazo zito la Mungu na kusisitiza jambo linalokaribia kutendeka. “Tazama” ni la heshima, linaeleweka, na linahifadhi uzito wa tamko.
- source_word: מַמְטִיר
  choice: nitanyesha
  rationale: Hifili ya מטר inaonyesha usababishaji; Mungu mwenyewe ndiye atakayesababisha mvua ya mawe inyeshe. “Nitanyesha” huhifadhi uwakala huo wa moja kwa moja kwa Kiswahili cha kawaida.
- source_word: כָּעֵת מָחָר
  choice: karibu na wakati huu kesho
  rationale: Kiambishi כ kinaweza kuonyesha ulinganisho au ukadiriaji. Tafsiri hii inaonyesha kwamba ni takribani wakati kama huu siku inayofuata bila kuondoa uwezekano wa kuelewa wakati hususa.
- source_word: בָּרָד
  choice: mvua ya mawe
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa tukio hili la hali ya hewa.
- source_word: כָּבֵד מְאֹד
  choice: nzito sana
  rationale: כָּבֵד humaanisha “nzito,” na מְאֹד hutilia nguvu kiwango chake. Usemi huu unahifadhi taswira ya Kiebrania huku ukieleweka kuwa mvua ya mawe yenye ukali mkubwa.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: ambayo haijawahi kutokea
  rationale: Kishazi hiki kinalinganisha mvua ijayo na matukio yote yaliyotangulia. Tafsiri hii ni ya asili katika Kiswahili na huhifadhi dai kwamba tukio kama hilo halijawahi kuwapo.
- source_word: בְּמִצְרַיִם
  choice: nchini Misri
  rationale: “Nchini Misri” ni usemi wa kawaida wa mahali na huonyesha wazi kwamba ulinganisho unahusu nchi ya Misri.
- source_word: לְמִן הַיּוֹם הִוָּסְדָה
  choice: tangu siku nchi hiyo ilipoanzishwa
  rationale: Umbo la Nifali linaonyesha Misri kuanzishwa au kuwekwa imara. Kutaja “nchi hiyo” huweka wazi kwamba kiwakilishi kinarejelea Misri.
- source_word: וְעַד עָתָּה
  choice: mpaka sasa
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha kipindi kinachoanzia kuanzishwa kwa Misri hadi wakati wa tangazo.
theological_decisions:
- issue: Uwakala wa Mungu katika kutangaza pigo
  choice: “nitanyesha” linamhusisha Mungu moja kwa moja na kusababisha mvua ya mawe
  alternative: Tafsiri isiyo ya moja kwa moja kama “mvua ya mawe itanyesha”
  rationale: Kitenzi cha Hifili chenye nafsi ya kwanza kinamtaja Mungu wazi kuwa mtendaji. Tafsiri haipaswi kulifanya tukio hili lionekane kuwa la kiasili tu au lisilo na mtendaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Tazama” hudumisha uzito wa tangazo la Mungu, na “mvua ya mawe nzito sana” huhifadhi taswira halisi ya Kiebrania.
