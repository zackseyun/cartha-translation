base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/024.yaml
  text: There was hail[a], and fire flashing within the hail, very severe—such as had never been in all the land of Egypt since it became a nation.
translation:
  language: sw
  text: Kukawa na mvua ya mawe, na moto ukimeta[a] katikati ya mvua hiyo ya mawe; mvua hiyo ya mawe ilikuwa kali sana, kiasi kwamba mfano wake haukuwa umewahi kutokea katika nchi yote ya Misri tangu Misri ilipofanyika taifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na moto ukiwaka katikati ya mvua ya mawe.” Kiebrania kinatumia neno halisi “moto”; katika muktadha wa dhoruba, huenda likamaanisha miale ya umeme ndani ya dhoruba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Kukawa na
  rationale: Muundo huu wa masimulizi unatambulisha tukio kwa Kiswahili cha kawaida huku ukihifadhi maana ya kutokea au kuwapo.
- source_word: בָּרָד
  choice: mvua ya mawe
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa tukio hili la hali ya hewa.
- source_word: וְאֵשׁ
  choice: na moto
  rationale: Neno la Kiebrania linamaanisha kihalisi ‘moto.’ Ingawa katika dhoruba huenda likarejelea miale inayofanana na umeme, taswira halisi ya matini imehifadhiwa.
- source_word: מִתְלַקַּחַת
  choice: ukimeta
  rationale: Kitenzi hiki katika muktadha huu huonyesha moto unaowaka au kutokea kwa miale yenye mwendo; ‘ukimeta’ ni cha asili na chenye taswira wazi katika Kiswahili.
- source_word: בְּתוֹךְ הַבָּרָד
  choice: katikati ya mvua hiyo ya mawe
  rationale: Huhifadhi wazo la moto kuonekana ndani au katikati ya mvua ya mawe.
- source_word: כָּבֵד מְאֹד
  choice: Ilikuwa kali sana
  rationale: Ingawa כבד humaanisha kihalisi ‘nzito,’ kuhusu mvua ya mawe Kiswahili hutumia ‘kali sana’ kueleza uzito wa tukio kwa njia ya kawaida.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: mvua ya mawe ya namna hiyo haikuwa imewahi kutokea
  rationale: Hueleza wazi kwamba tukio hilo halikuwa na mfano wa awali, huku likitaja tena ‘mvua ya mawe’ ili kuepuka kiwakilishi kisichoeleweka.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: katika nchi yote ya Misri
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya usemi wa eneo lote la Misri.
- source_word: מֵאָז הָיְתָה לְגוֹי
  choice: tangu iwe taifa
  rationale: Huhifadhi rejeo la kihistoria la Misri kuwa taifa; ‘iwe’ inarejelea Misri kama nchi bila kulazimisha tafsiri ya ‘watu.’
