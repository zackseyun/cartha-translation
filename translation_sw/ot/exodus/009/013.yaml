base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/013.yaml
  text: 'Then Yahweh said to Moses[a], “Rise early in the morning and present yourself before Pharaoh, and say to him, ‘Thus says Yahweh, the God of the Hebrews: Let my people go, so that they may serve me.’”'
translation:
  language: sw
  text: 'Kisha Yahweh akamwambia Musa, “Amka asubuhi na mapema, ukasimame mbele ya Farao, umwambie, ‘Yahweh, Mungu wa Waebrania, asema hivi: Waache watu wangu waende ili wanitumikie.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili waniabudu.” Kitenzi cha Kiebrania kinaweza kumaanisha kumtumikia Mungu, kutia ndani kumwabudu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: Amka asubuhi na mapema
  rationale: Kauli hii ya Kiebrania inaamuru kuamka mapema; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וְהִתְיַצֵּב לִפְנֵי
  choice: ukasimame mbele ya
  rationale: Kitenzi kina maana ya kwenda na kuchukua nafasi mbele ya mtu; ‘ukasimame mbele ya’ ni asilia na kinahifadhi picha hiyo.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Huhifadhi fomula rasmi ya mjumbe wa kinabii kwa Kiswahili cha sasa.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Mungu wa Waebrania
  rationale: Ni tafsiri ya moja kwa moja ya muundo wa umilikaji wa Kiebrania.
- source_word: שַׁלַּח אֶת עַמִּי
  choice: Waache watu wangu waende
  rationale: Katika muktadha huu, שׁלח ni amri ya kuwaruhusu watu waondoke; usemi huu ni wazi na wa kawaida.
- source_word: וְיַעַבְדֻנִי
  choice: ili wanitumikie
  rationale: Kiunganishi pamoja na kitenzi kinaonyesha kusudi. ‘Kunitumikia’ huhifadhi maana pana ya עבד, inayoweza kujumuisha ibada bila kuishia katika ibada pekee.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu, si cheo; ‘Yahweh’ hulihifadhi kama jina binafsi.
- issue: Maana ya וְיַעַבְדֻנִי
  choice: ili wanitumikie
  alternative: ili waniabudu
  rationale: Kitenzi עבד kinaweza kumaanisha utumishi kwa Mungu unaojumuisha ibada. ‘Wanitumikie’ huhifadhi upana huo na mvutano wa kimuktadha kati ya utumwa kwa Farao na utumishi kwa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Usemi ‘asema hivi’ unadumisha mtindo rasmi wa ujumbe, na ‘wanitumikie’ huhifadhi maana pana ya neno la Kiebrania.
