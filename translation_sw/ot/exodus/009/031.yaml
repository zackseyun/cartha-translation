lexical_decisions:
- source_word: הַפִּשְׁתָּה
  choice: kitani
  rationale: Neno hili humaanisha mmea wa kitani unaotumiwa kutengeneza nguo ya kitani. Katika muktadha huu wa mazao, “kitani” ni tafsiri ya moja kwa moja na inayoeleweka.
- source_word: הַשְּׂעֹרָה
  choice: shayiri
  rationale: Hili ndilo jina la kawaida la zao hili katika Kiswahili Sanifu.
- source_word: נֻכָּתָה
  choice: vilipigwa
  rationale: Kauli tendwa hii kutoka נכה inaonyesha kwamba mazao yalipigwa na mvua ya mawe; “vilipigwa” inadumisha picha hiyo bila kuongeza kwa uhakika kwamba yaliharibiwa kabisa.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי hapa inatanguliza sababu ya mazao hayo kuathiriwa.
- source_word: אָבִיב
  choice: ilikuwa imetoa masuke
  rationale: אָבִיב inaeleza nafaka ambayo masuke yake yamekwisha kutokea na iko katika hatua ya kukomaa. Tafsiri hii inadumisha picha halisi ya ukuaji wa shayiri.
- source_word: גִּבְעֹל
  choice: ilikuwa imefunga vitumba vya maua
  rationale: גִּבְעֹל inaashiria hatua ya ukuaji wa kitani ambapo vitumba au maua yamejitokeza. “Imefunga vitumba vya maua” huhifadhi maana ya kuwa katika hatua ya kuchanua bila kudai kwa uhakika kwamba maua yalikuwa yamechanua kabisa.
