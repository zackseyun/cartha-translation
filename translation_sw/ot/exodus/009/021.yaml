  yaml_path: translation/ot/exodus/009/021.yaml
  text: But whoever did not pay attention to the word of Yahweh left his servants and his livestock in the field[a].
translation:
  language: sw
  text: Lakini yeyote ambaye hakuliweka neno la Yahweh moyoni[a] aliwaacha watumishi wake na mifugo yake shambani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “hakulizingatia neno la Yahweh,” yaani, hakulichukua kwa uzito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Lakini yeyote ambaye
  rationale: Waw pamoja na kiwakilishi cha uhusiano huonyesha kundi linalotofautiana na waliotii katika mstari uliotangulia; usemi huu ni wa kawaida na huhifadhi maana isiyoainisha mtu mmoja.
- source_word: לֹא שָׂם לִבּוֹ אֶל
  choice: hakulitia moyoni
  rationale: Nahau hii kihalisi inahusu kuweka jambo moyoni, yaani kulizingatia na kulichukua kwa uzito. Kiswahili hiki huhifadhi picha ya Kiebrania na maana yake ya kutotii onyo kwa kulipuuza.
- source_word: דְּבַר יְהוָה
  choice: neno la Yahweh
  rationale: דָּבָר hapa ni onyo lililotamkwa na Yahweh; “neno” huhifadhi usemi wa kibiblia bila kuzuia maana ya ujumbe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa tetragramatoni limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּעֲזֹב
  choice: aliwaacha
  rationale: Kitenzi kinaeleza kitendo halisi cha kuwaacha watu na wanyama wabaki nje; “aliwaacha” ni cha kawaida na hakiongezi wazo la kuwatelekeza kabisa.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: עֶבֶד inaweza kumaanisha mtumwa au mtumishi. Katika muktadha huu mkazo uko kwa watu wa nyumbani walioachwa shambani, hivyo “watumishi” huhifadhi upana wa neno bila kuamua hadhi yao zaidi ya ushahidi.
- source_word: מִקְנֵהוּ
  choice: mifugo yake
  rationale: Neno hili ni la jumla kwa wanyama wanaofugwa; “mifugo” ni sawa na ya asili katika Kiswahili cha sasa.
- source_word: בַּשָּׂדֶה
  choice: shambani
  rationale: Hii ni tafsiri ya moja kwa moja ya mahali, huku muktadha ukionyesha kwamba walibaki nje wakikabili mvua ya mawe.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi יְהוָה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kutolielekeza moyo kwenye neno la Yahweh
  choice: hakulitia moyoni
  alternative: hakulisikiliza kwa makini / hakulizingatia
  rationale: Chaguo hili huhifadhi taswira ya nahau ya Kiebrania pamoja na maana yake ya kutolichukua onyo kwa uzito, bila kupunguza jambo hilo kuwa kusikia tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau “kulitia moyoni” inaeleweka kwa urahisi na wakati huohuo huhifadhi taswira ya Kiebrania. Alama ya tanbihi imewekwa mara tu baada ya kirai kinachofafanuliwa.
