base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/028.yaml
  text: Pray to Yahweh[a], for there has been enough of God's thunder and hail. Then I will let you go, and you will stay no longer.
translation:
  language: sw
  text: Mwombeni Yahwe, kwa kuwa ngurumo za Mungu[a] na mvua ya mawe zimetosha. Kisha nitawaacha mwende, wala hamtabaki tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya moja kwa moja, “sauti za Mungu.” Hapa “sauti” zinamaanisha ngurumo katika dhoruba.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעְתִּירוּ
  choice: Mwombeni
  rationale: Kitenzi hiki cha agizo, katika muktadha huu, kinamaanisha kumwomba Mungu kwa dhati. “Mwombeni” ni Kiswahili cha kawaida na kinaonyesha kuwa agizo limeelekezwa kwa watu zaidi ya mmoja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna inayotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo kama “Bwana.”
- source_word: וְרַב מִהְיֹת
  choice: zimetosha
  rationale: Nahau ya Kiebrania inaonyesha kwamba yaliyotokea tayari yanatosha au yamezidi. “Zimetosha” ni ya asili na inafaa kwa wingi wa ngurumo na mvua ya mawe.
- source_word: קֹלֹת אֱלֹהִים
  choice: ngurumo za Mungu
  rationale: Ingawa קֹלֹת kwa maana ya moja kwa moja ni “sauti,” muktadha wa dhoruba na mvua ya mawe unaonyesha ngurumo. Kirai “za Mungu” kinahifadhi chanzo au uhusiano wa kimungu bila kufafanua zaidi ya maandishi.
- source_word: וּבָרָד
  choice: na mvua ya mawe
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mvua inayonyesha vipande vya barafu.
- source_word: וַאֲשַׁלְּחָה אֶתְכֶם
  choice: Nami nitawaacha mwende
  rationale: Katika simulizi la Kutoka, שלח ikiwa na watu kama yambwa ina maana ya kuwaachilia waende. Muundo huu ni wa kawaida katika Kiswahili.
- source_word: וְלֹא תֹסִפוּן לַעֲמֹד
  choice: wala hamtakaa tena
  rationale: Nahau “hamtaongeza kusimama/kubaki” inamaanisha kutokendelea kukaa au kubaki. Tafsiri hii ni fupi na ya asili huku ikihifadhi ahadi ya Farao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: “Yahwe” linahifadhi jina binafsi lililo katika maandishi ya Kiebrania na ni tahajia ya kawaida ya Kiswahili.
- issue: Maana ya קֹלֹת אֱלֹהִים
  choice: ngurumo za Mungu
  alternative: sauti za Mungu
  rationale: Maana halisi ya “sauti” imehifadhiwa katika tanbihi, lakini muktadha wa dhoruba unaonyesha kuwa sauti hizo ni ngurumo. Hii inaepuka tafsiri ngumu bila kuondoa uhusiano wake na Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Alama ya tanbihi imewekwa baada ya kirai kinachoelezwa.
