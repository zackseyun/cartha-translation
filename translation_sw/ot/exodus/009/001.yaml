  source_fidelity: 'Tafsiri inafuata kwa uaminifu vipengele vya msingi vya Kiebrania: agizo la Musa kumwendea Farao, fomula ya ujumbe wa YHWH, utambulisho “Mungu wa Waebrania,” agizo la kuwaachia watu, na kusudi la wao kumtumikia YHWH. “Nenda kwa Farao” ni uhamishaji wa kawaida na sahihi wa בֹּא אֶל־פַּרְעֹה katika muktadha huu.'
  naturalness: Kiswahili ni sanifu, wazi, na kina hadhi inayofaa kwa tangazo la kinabii/kifalme. “Waache watu wangu waende” ni amri ya kawaida na sahihi, ambapo wa- ni kiambishi cha yambwa (“watu wangu”), si lazima wingi wa anayesemeshwa.
  terminology: “YHWH” huwakilisha tetragramatoni kwa uthabiti, na “Mungu wa Waebrania” ni sahihi. “Wanitumikie” huhifadhi maana pana ya עבד, ikijumuisha huduma ya kidini bila kulazimisha tafsiri finyu ya ibada pekee.
