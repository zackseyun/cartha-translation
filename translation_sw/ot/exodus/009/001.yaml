  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/דִבַּרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/001.yaml
  text: 'Then the LORD said to Moses, "Go in to Pharaoh and say to him, ''Thus says the LORD, the God of the Hebrews: Let my people go, so that they may serve me.''"'
translation:
  language: sw
  text: 'Kisha YHWH akamwambia Musa, “Nenda kwa Farao, umwambie, ‘YHWH, Mungu wa Waebrania, asema hivi: Waache watu wangu waende ili wanitumikie.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Nenda kwa Farao
  rationale: Ingawa בּוֹא kwa kawaida ni ‘kuja/kuingia’, katika muktadha huu ni agizo la kumwendea Farao; ‘nenda kwa Farao’ ni Kiswahili cha kawaida na huhifadhi kusudi la usemi.
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: umwambie
  rationale: Huwasilisha kwa kawaida maana ya ‘useme naye/umwambie’ bila kuongeza maudhui.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Ni fomula ya kawaida ya kutambulisha ujumbe wenye mamlaka; wakati uliokamilika wa Kiebrania katika fomula hii una nguvu ya usemi wa sasa.
- source_word: יְהוָה
  choice: YHWH
  rationale: Huhifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Waache watu wangu waende
  rationale: Hutoa maana ya pi‘el שׁלח katika muktadha wa kuachiliwa waende, kwa Kiswahili cha asili.
- source_word: וְיַעַבְדֻנִי
  choice: ili wanitumikie
  rationale: עבד inaweza kumaanisha kutumikia na pia kuabudu; ‘wanitumikie’ huhifadhi upana huo wa msingi bila kuufungia katika tendo la ibada pekee.
theological_decisions:
- issue: Uwasilishaji wa tetragramatoni יְהוָה
  choice: YHWH
  alternative: BWANA
  rationale: Maandishi chanzi yana jina binafsi la Mungu; ‘YHWH’ hulitofautisha na cheo אֲדֹנָי na huepuka kuficha tofauti hiyo.
- issue: Maana ya וְיַעַבְדֻנִי
  choice: ili wanitumikie
  alternative: ili waniabudu
  rationale: ‘Kutumikia’ huhifadhi utata wa kimakusudi wa עבד, ambao katika muktadha wa kidini unaweza kujumuisha ibada bila kupunguzwa kuwa ‘kuabudu’ pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ujumbe wa kifalme/kinabii umehifadhiwa kwa ‘asema hivi’, huku sentensi ikibaki wazi kwa msomaji wa kawaida.
