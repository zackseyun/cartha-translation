  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁלַ֤ח הָעֵז֙ אֶֽת מִקְנְ/ךָ֔ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר לְ/ךָ֖ בַּ/שָּׂדֶ֑ה כָּל הָ/אָדָ֨ם וְ/הַ/בְּהֵמָ֜ה אֲשֶֽׁר יִמָּצֵ֣א בַ/שָּׂדֶ֗ה וְ/לֹ֤א יֵֽאָסֵף֙ הַ/בַּ֔יְתָ/ה וְ/יָרַ֧ד עֲלֵ/הֶ֛ם הַ/בָּרָ֖ד וָ/מֵֽתוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/019.yaml
  text: So now[a], send word and bring your livestock and everything you have in the field to safety. Every man and beast that is found in the field and is not gathered into the house—the hail will come down on them[b], and they will die.
translation:
  language: sw
  text: Basi sasa[a], tuma watu wakakusanye mifugo yako na kila kitu ulicho nacho shambani. Kila mtu[b] na kila mnyama watakaopatikana shambani na wasioingizwa ndani ya nyumba—mvua ya mawe itawaangukia, nao watakufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na sasa.” Amri inayofuata inataka hatua ichukuliwe mara moja ili mali iwekwe salama.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania אָדָם (adam) hapa linamaanisha mwanadamu yeyote, yaani watu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Inaonyesha kiunganishi cha matokeo pamoja na mpito wa mara moja unaodai hatua ichukuliwe.
- source_word: שְׁלַח הָעֵז
  choice: tuma watu wakaweke salama
  rationale: 'Muundo huu una amri mbili zinazotaka hatua ya haraka: kutuma na kupeleka mali mahali salama. Kutaja ‘watu’ kwa udokezi kunafanya amri iwe ya kawaida katika Kiswahili bila kubadili mhusika anayetoa agizo.'
- source_word: מִקְנְךָ
  choice: mifugo yako
  rationale: Neno hili humaanisha wanyama wa kufugwa wanaomilikiwa; ‘mifugo’ ni sawa ya kawaida na pana.
- source_word: וְאֵת כָּל אֲשֶׁר לְךָ בַּשָּׂדֶה
  choice: na kila kitu ulicho nacho shambani
  rationale: Inahifadhi upana wa mali yote iliyoko nje bila kuibana kwa aina fulani.
- source_word: כָּל הָאָדָם
  choice: Kila mtu
  rationale: אָדָם hapa ni nomino ya jumla inayowahusu wanadamu; ‘kila mtu’ huhifadhi maana ya kugawa mmoja mmoja kwa Kiswahili cha kawaida.
- source_word: וְהַבְּהֵמָה
  choice: na kila mnyama
  rationale: בְּהֵמָה ni neno pana kwa mnyama, hasa mnyama wa kufugwa. Kurudia ‘kila’ kunafanya uhusiano wa mgawanyo uwe wazi katika Kiswahili.
- source_word: אֲשֶׁר יִמָּצֵא בַשָּׂדֶה
  choice: atakayepatikana shambani
  rationale: Huhifadhi hali tendwa ya kitenzi cha Kiebrania na eneo la tukio.
- source_word: וְלֹא יֵאָסֵף הַבַּיְתָה
  choice: na ambaye hataingizwa ndani ya nyumba
  rationale: 'Kitenzi cha hali tendwa na kiishio kinachoonyesha mwelekeo vinaelezwa kwa Kiswahili cha kawaida: kuingizwa ndani mahali pa kujisitiri.'
- source_word: וְיָרַד עֲלֵהֶם הַבָּרָד
  choice: mvua ya mawe itawanyeshea
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi wazo la mvua ya mawe kushuka juu yao.
- source_word: וָמֵתוּ
  choice: nao watakufa
  rationale: Inaonyesha wazi matokeo ya baadaye na kuendeleza kiunganishi cha Kiebrania.
theological_decisions:
- issue: Maana ya אָדָם katika onyo la jumla
  choice: Kila mtu
  alternative: Kila mwanadamu
  rationale: Hapa אָדָם haimtaji mwanamume mmoja wala jinsia ya kiume pekee, bali kila binadamu aliye shambani. ‘Kila mtu’ ni ya asili na haiondoi maana hiyo ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Shambani’ limetumiwa kwa eneo la wazi nje ya nyumba, na ‘mvua ya mawe’ ni istilahi ya kawaida ya hail.
