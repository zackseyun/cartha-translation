  naturalness: Kiswahili ni cha kawaida kwa jumla. Marekebisho ya upatanisho wa wingi katika ‘kila mtu na kila mnyama watakaopatikana ... wasioingizwa’ yanaondoa utata wa kisarufi ambao ungeweza kufanya vitenzi virejee kwa mnyama pekee.
