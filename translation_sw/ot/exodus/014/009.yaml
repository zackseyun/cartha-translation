base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/009.yaml
  text: The Egyptians pursued them and overtook them as they were camped by the sea—all Pharaoh’s horses and chariots[a], his horsemen, and his army—by Pi-hahiroth, before Baal-zephon.
translation:
  language: sw
  text: Wamisri wakawafuatia na kuwafikia walipokuwa wamepiga kambi kando ya bahari—farasi wote na magari yote ya vita ya Farao, wapanda farasi wake, na jeshi lake—karibu na Pi-Hahirothi, mbele ya Baal-Sefoni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkabala na Baal-Sefoni.” Kirai cha Kiebrania kinaweza kueleza mahali palipo mkabala na alama ya eneo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: wakawafuatia
  rationale: Kitenzi רדף hapa kina maana ya kuwafuatia watu kwa nia ya kuwakamata; “wakawafuatia” ni cha kawaida na kinafaa katika muktadha wa kijeshi.
- source_word: מִצְרַיִם
  choice: Wamisri
  rationale: Ingawa neno linaweza kutaja nchi ya Misri, kitenzi cha wingi na muktadha vinaonyesha watu au majeshi ya Misri.
- source_word: וַיַּשִּׂיגוּ
  choice: kuwafikia
  rationale: נשׂג hapa ni kuwafikia waliokuwa mbele baada ya kuwafuatia; “kuwafikia” ni Kiswahili cha asili na hakiongezi wazo la kuwakamata ambalo halijasemwa wazi.
- source_word: חֹנִים
  choice: walipokuwa wamepiga kambi
  rationale: Kauli ya hali inaeleza walivyokuwa Waisraeli wakati Wamisri walipowafikia.
- source_word: עַל הַיָּם
  choice: kando ya bahari
  rationale: עַל ina maana ya mahali hapa; “kando ya bahari” inaeleza ukaribu bila kuashiria kuwa walikuwa juu ya maji.
- source_word: כָּל סוּס רֶכֶב פַּרְעֹה
  choice: farasi wote wa magari ya vita ya Farao
  rationale: Muundo wa Kiebrania ni mfupi na wa kijeshi, ukihusianisha farasi na magari ya vita ya Farao. Tafsiri hii huhifadhi uhusiano huo bila kuongeza kwa uhakika orodha tofauti ya farasi na magari.
- source_word: וּפָרָשָׁיו
  choice: wapanda farasi wake
  rationale: פָּרָשִׁים humaanisha askari waliopanda farasi; “wapanda farasi” ni wazi na ya kawaida kuliko istilahi ya kitaalamu ya kikosi cha farasi.
- source_word: וְחֵילוֹ
  choice: na jeshi lake
  rationale: חַיִל katika muktadha huu ni nguvu au jeshi la kijeshi; “jeshi” ndiyo tafsiri iliyo wazi zaidi.
- source_word: עַל פִּי הַחִירֹת
  choice: karibu na Pi-Hahirothi
  rationale: Kirai hiki kinataja mahali walipokuwa kwa uhusiano na jina la eneo; “karibu na” ni usemi wa kawaida wa mahali.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: mbele ya Baal-Sefoni
  rationale: לִפְנֵי katika matumizi ya mahali inaweza kumaanisha mbele ya au mkabala na. “Mbele ya” huhifadhi usemi mkuu bila kufuta uwezekano mwingine.
