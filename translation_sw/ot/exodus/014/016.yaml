id: EXO.14.16
reference: Exodus 14:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אַתָּ֞ה הָרֵ֣ם אֶֽת מַטְּ/ךָ֗ וּ/נְטֵ֧ה אֶת יָדְ/ךָ֛ עַל הַ/יָּ֖ם וּ/בְקָעֵ֑/הוּ וְ/יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/016.yaml
  text: But as for you[a], lift up your staff and stretch out your hand over the sea and split it, so that the sons of Israel may go through the midst of the sea on dry ground.
translation:
  language: sw
  text: Lakini wewe, inua fimbo yako, unyooshe mkono wako juu ya bahari na uipasue, ili wana wa Israeli[a] wapite katikati ya bahari juu ya nchi kavu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Lakini wewe
  rationale: Kiunganishi pamoja na kiwakilishi huru kinamweka Musa katika mkazo wa kulinganisha na agizo lililotangulia kwa watu; “Lakini wewe” huonyesha utofauti huo kwa Kiswahili cha kawaida.
- source_word: הָרֵם אֶת מַטְּךָ
  choice: inua fimbo yako
  rationale: Kitenzi cha amri kinamaanisha kuinua, na מַטֶּה katika simulizi la Musa ni fimbo.
- source_word: וּנְטֵה אֶת יָדְךָ עַל הַיָּם
  choice: unyooshe mkono wako juu ya bahari
  rationale: “Kunyoosha mkono” ni usemi wa kawaida wa Kiswahili kwa tendo hili; “juu ya bahari” huhifadhi uhusiano wa kieneo wa עַל bila kuufanya tu kuwa kuelekea baharini.
- source_word: וּבְקָעֵהוּ
  choice: na uipasue
  rationale: בקע hueleza kupasua au kutenganisha kwa nguvu. “Uipasue” ni wazi, hai, na inaendana na kiambishi cha kitu kinachorejelea bahari.
- source_word: וְיָבֹאוּ
  choice: ili ... wapite
  rationale: Katika mfuatano huu wa amri, umbo hili linaonyesha matokeo au kusudi. Kwa muktadha wa kuvuka bahari, “ili ... wapite” ni Kiswahili cha asili na huhifadhi wazo la kwenda katikati yake.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania “wana wa Israeli,” huku ikiwa lugha inayoeleweka katika Kiswahili cha Biblia.
- source_word: בְּתוֹךְ הַיָּם
  choice: katikati ya bahari
  rationale: בְּתוֹךְ huonyesha sehemu ya ndani au ya kati; “katikati ya bahari” huhifadhi taswira hiyo ya mahali.
- source_word: בַּיַּבָּשָׁה
  choice: juu ya nchi kavu
  rationale: Nomino hii inatofautisha sehemu kavu na maji ya bahari; “juu ya nchi kavu” ni usemi wa kawaida na huonyesha hali ya njia waliyopita.
theological_decisions:
- issue: Namna ya kutafsiri בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Kiebrania kina muundo halisi “wana wa Israeli.” Tafsiri kuu inauhifadhi bila kudai kwamba kundi lililokusudiwa lilikuwa wanaume pekee; tanbihi inaonyesha mbadala wa kawaida unaorejelea taifa lote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia amri za moja kwa moja na msamiati wa kawaida, huku ikihifadhi mkazo kwa Musa, taswira ya bahari kupasuliwa, na muundo wa Kiebrania “wana wa Israeli.”
