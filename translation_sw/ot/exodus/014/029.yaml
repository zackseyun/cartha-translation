  yaml_path: translation/ot/exodus/014/029.yaml
  text: But the sons of Israel walked on dry ground through the midst of the sea[b][a], and the waters were a wall to them on their right and on their left.
translation:
  language: sw
  text: Lakini Waisraeli walitembea juu ya nchi kavu katikati ya bahari,[a] na maji yalikuwa ukuta kwao[b] upande wa kulia na upande wa kushoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “Nao wana wa Israeli walitembea juu ya nchi kavu katikati ya bahari.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “maji yalikuwa ukuta kwao”; wengine huelewa maana kuwa “kama ukuta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: Lakini Waisraeli
  rationale: Kiunganishi kimetafsiriwa “Lakini” ili kuonyesha tofauti kati ya kuokoka kwa Israeli na kuangamia kwa Wamisri katika muktadha. Ingawa ביטוי hii kwa umbo ni “wana wa Israeli,” “Waisraeli” ndiyo namna ya kawaida na wazi ya Kiswahili ya kutaja taifa lote bila kudokeza wanaume pekee.
- source_word: הָלְכוּ
  choice: walitembea
  rationale: Kitenzi הלך humaanisha kwenda au kutembea; “walitembea” kinadumisha taswira ya watu wakisonga kwa miguu.
- source_word: בַ/יַּבָּשָׁה
  choice: juu ya nchi kavu
  rationale: יבשה ni nchi au ardhi kavu. Usemi huu unaonyesha wazi kwamba sakafu ya bahari ilikuwa kavu.
- source_word: בְּ/תוֹךְ הַ/יָּם
  choice: katikati ya bahari
  rationale: בתוך huonyesha kuwa walikuwa ndani, katikati ya bahari; Kiswahili hiki ni cha kawaida na kinahifadhi taswira ya mahali.
- source_word: וְ/הַ/מַּיִם
  choice: na maji
  rationale: מים ni neno la wingi kwa umbo la Kiebrania, lakini “maji” ndilo jina la kawaida la ngeli ya wingi katika Kiswahili.
- source_word: לָ/הֶם חֹמָה
  choice: yalikuwa ukuta kwao
  rationale: Tafsiri hii inadumisha tamko la moja kwa moja kwamba maji yalikuwa ukuta kwao, bila kuongeza kihisishi cha ulinganisho “kama.”
- source_word: מִ/ימִינָ/ם וּ/מִ/שְּׂמֹאלָ/ם
  choice: upande wao wa kulia na upande wao wa kushoto
  rationale: Muundo sawia wa pande mbili umehifadhiwa kwa Kiswahili wazi na chenye hadhi.
theological_decisions:
- issue: Namna ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  alternative: wana wa Israeli
  rationale: Katika muktadha huu ביטוי ya Kiebrania ni jina la taifa lote. “Waisraeli” huwasilisha maana hiyo kwa Kiswahili cha sasa bila kupoteza utambulisho wao wa kitaifa; tafsiri ya kimuundo zaidi imehifadhiwa katika tanbihi.
- issue: Iwapo חֹמָה itafsiriwe moja kwa moja au kama ulinganisho
  choice: ukuta
  alternative: kama ukuta
  rationale: Kiebrania hakina chembe ya wazi ya ulinganisho. Kwa hiyo matini kuu inadumisha tamko lenye nguvu “ukuta,” huku uwezekano wa kulielewa kama ulinganisho ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mpangilio na usawaziko wa Kiebrania, huku “Waisraeli” ikitumika kama jina la kawaida la taifa lote. Alama zote za tanbihi zimewekwa katika matini kuu karibu na vifungu vinavyohusika.
