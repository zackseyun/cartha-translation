id: EXO.14.30
reference: Exodus 14:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יּ֨וֹשַׁע יְהוָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא אֶת יִשְׂרָאֵ֖ל מִ/יַּ֣ד מִצְרָ֑יִם וַ/יַּ֤רְא יִשְׂרָאֵל֙ אֶת מִצְרַ֔יִם מֵ֖ת עַל שְׂפַ֥ת הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/030.yaml
  text: So Yahweh saved Israel that day from the hand of Egypt[b][a], and Israel saw the Egyptians dead on the seashore.
translation:
  language: sw
  text: Basi siku hiyo Yahweh aliwaokoa Waisraeli kutoka mkononi mwa Misri,[a] nao Waisraeli wakawaona Wamisri wakiwa wamekufa ufukweni mwa bahari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka mkono wa Misri,” nahau yenye maana ya kuokolewa kutoka katika mamlaka ya Misri.'
    reason: cultural_note
  - marker: b
    text: Au “kwenye ukingo wa bahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: aliwaokoa
  rationale: Hifili ya ישׁע inaonyesha tendo la Yahweh la kuwaokoa watu wake katika hatari. “Aliwaokoa” ni Kiswahili cha kawaida na huhifadhi uzito wa ukombozi wa Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Hii ni tafsiri ya asili na iliyo wazi ya kirai cha wakati.
- source_word: מִיַּד מִצְרָיִם
  choice: kutoka mkononi mwa Misri
  rationale: Tafsiri hii huhifadhi sitiari ya Kiebrania ya “mkono,” inayomaanisha mamlaka au udhibiti wa Misri; tanbihi inaeleza nahau hiyo.
- source_word: מִצְרַיִם / מִצְרָיִם
  choice: Misri / Wamisri
  rationale: Katika kishazi cha kwanza jina hilo linamaanisha taifa na mamlaka yake; katika cha pili linamaanisha watu wa Misri ambao maiti zao zilionekana.
- source_word: וַיַּרְא
  choice: wakawaona
  rationale: Kitenzi ראה humaanisha kuona katika simulizi; upatanisho wa wingi unaeleza Israeli kama watu.
- source_word: מֵת
  choice: wakiwa wamekufa
  rationale: Kivumishi cha Kiebrania kina maana ya pamoja hapa. Kiswahili hiki kinaonyesha hali yao bila kuongeza maelezo yasiyokuwapo katika matini.
- source_word: עַל שְׂפַת הַיָּם
  choice: ufukweni mwa bahari
  rationale: Kirai hiki kihalisi ni kwenye “mdomo” au ukingo wa bahari; “ufukweni mwa bahari” ni cha asili na kinaonyesha mahali kwa usahihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ina jina binafsi la Mungu, יהוה. Kulitohowa kama “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Waisraeli” limetumiwa kwa maana ya watu wanaowakilishwa na jina la pamoja “Israeli,” ili sentensi iwe ya asili kwa wasomaji wa kawaida. Sitiari ya “mkono wa Misri” imehifadhiwa na kufafanuliwa katika tanbihi.
