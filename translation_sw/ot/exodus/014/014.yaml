  text: Yahweh will fight for you[a], and you must be silent.
translation:
  language: sw
  text: Yahwe atawapigania, nanyi mtanyamaza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nanyi nyamazeni” au “nanyi mkae kimya.” Kitenzi cha Kiebrania kinaweza kusomwa kama taarifa ya kwamba mtanyamaza au, katika muktadha huu, kama agizo la kukaa kimya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja badala ya kubadilishwa kuwa cheo, hivyo linahifadhi jina la agano katika maandishi ya Kiebrania.
- source_word: יִלָּחֵם
  choice: atawapigania
  rationale: Kauli ya Niphal isiyotimilika inaeleza tendo lijalo la Yahwe kupigana kwa niaba ya Waisraeli; ‘atawapigania’ ni usemi wa kawaida na wazi wa Kiswahili.
- source_word: לָכֶם
  choice: -wa- katika ‘atawapigania’
  rationale: Kiambishi hiki kinawasilisha maana ya ‘kwa ajili yenu/kwa niaba yenu’ kwa njia ya asili katika kitenzi cha Kiswahili.
- source_word: וְאַתֶּם
  choice: nanyi
  rationale: ‘Nanyi’ huhifadhi uratibu wa Kiebrania na wakati huohuo huonyesha utofauti kati ya tendo la Yahwe na hali ya watu.
- source_word: תַּחֲרִישׁוּן
  choice: mtanyamaza
  rationale: Kitenzi kisichotimilika kinaweza kusomwa kama taarifa ya wakati ujao au agizo katika muktadha huu. ‘Mtanyamaza’ huhifadhi kwanza umbo la wakati ujao na utata huo wa kweli.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia Tetragramatoni kama jina binafsi; ‘Yahwe’ ni unukuzi unaokaribia ushahidi wa kimatamshi bila kulibadilisha kuwa cheo.
- issue: Nguvu ya kimatumizi ya תַּחֲרִישׁוּן
  choice: mtanyamaza
  alternative: nyamazeni / mnapaswa kunyamaza
  rationale: Ingawa muktadha unaweza kuipa kauli hii nguvu ya agizo, umbo lenyewe ni kitenzi kisichotimilika cha nafsi ya pili wingi. Tafsiri kuu inahifadhi uwezekano wa taarifa, na tanbihi inaonyesha uwezekano wa agizo bila kuufuta utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. ‘Atawapigania’ ni ya asili kuliko muundo mzito ‘atapigana kwa ajili yenu’; ‘mtanyamaza’ huhifadhi ufupi na mvutano wa maandishi ya Kiebrania.
