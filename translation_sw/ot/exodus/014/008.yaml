  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְחַזֵּ֣ק יְהֹוָ֗ה אֶת לֵ֤ב פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יִּרְדֹּ֕ף אַחֲרֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יֹצְאִ֖ים בְּ/יָ֥ד רָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/008.yaml
  text: And Yahweh hardened the heart of Pharaoh king of Egypt[a], and he pursued the sons of Israel[b], while the sons of Israel were going out with a high hand.
translation:
  language: sw
  text: BWANA akaufanya moyo wa Farao, mfalme wa Misri, kuwa mgumu[a], naye akawafuatilia Waisraeli, huku Waisraeli wakitoka kwa mkono ulioinuliwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akautia nguvu moyo wa Farao” au “akaufanya moyo wake kuwa imara.” Kitenzi cha Kiebrania humaanisha kihalisi “kutia nguvu/kufanya imara,” ingawa katika simulizi hili mara nyingi hueleweka kuwa “kufanya mgumu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa mkono ulio juu”; nahau hiyo inaweza kumaanisha “kwa ujasiri” au “kwa ushindi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: BWANA
  rationale: Hufuata desturi ya Kiswahili ya kuwakilisha jina la agano YHWH kwa herufi kubwa, bila kuingiza matamshi yasiyo na uhakika katika matini kuu.
- source_word: וַיְחַזֵּק ... אֶת לֵב
  choice: akaufanya moyo ... kuwa mgumu
  rationale: חזק humaanisha kufanya imara au kutia nguvu, lakini katika kauli hii inayojirudia kuhusu Farao ina maana ya kuufanya moyo uwe mgumu; tanbihi inadumisha maana ya msingi ya neno.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Farao, mfalme wa Misri
  rationale: Ni Kiswahili cha kawaida na cha wazi kinachodumisha utambulisho wote wa Farao.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: akawafuatilia
  rationale: Huwasilisha tendo la kuwafuata kwa nia ya kuwakamata katika muktadha wa kijeshi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa kwa neno moja ni 'wana wa Israeli,' hapa msemo huo hutaja jamii ya Israeli kwa ujumla; 'Waisraeli' ni sahihi, jumuishi, na ya kawaida katika Kiswahili. Kurudiwa kwake kumedumishwa.
- source_word: יֹצְאִים
  choice: wakitoka
  rationale: Muundo wa hali ya kuendelea unaonyesha kwamba walikuwa katika tendo la kutoka Farao alipowafuatilia.
- source_word: בְּיָד רָמָה
  choice: kwa mkono ulioinuliwa
  rationale: Huhifadhi taswira halisi ya nahau ya Kiebrania badala ya kuifasiri moja kwa moja kuwa 'kwa ujasiri' au 'kwa ushindi.'
theological_decisions:
- issue: Tendo la Mungu katika kuufanya moyo wa Farao kuwa mgumu
  choice: BWANA akaufanya moyo wa Farao ... kuwa mgumu
  alternative: BWANA akautia nguvu moyo wa Farao
  rationale: Matini ya Kiebrania inamhusisha BWANA moja kwa moja na tendo hilo. Tafsiri haipunguzi mvutano huo wa kiteolojia, huku tanbihi ikihifadhi uwezekano wa kileksika wa 'kutia nguvu/kufanya imara.'
- issue: Maana ya בְּיָד רָמָה
  choice: kwa mkono ulioinuliwa
  alternative: kwa ujasiri / kwa ushindi
  rationale: Taswira ya chanzo imedumishwa katika matini kuu, kwa kuwa nahau inaweza kuonyesha ujasiri, hali ya wazi, au ushindi bila kulazimisha maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha urudiaji wa 'Waisraeli' kutoka chanzo na taswira halisi ya mkono ulioinuliwa, huku tanbihi zikieleza mibadala bila kuondoa utata wa asili.
