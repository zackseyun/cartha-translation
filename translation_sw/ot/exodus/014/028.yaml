  text: וַ/יָּשֻׁ֣בוּ הַ/מַּ֗יִם וַ/יְכַסּ֤וּ אֶת הָ/רֶ֨כֶב֙ וְ/אֶת הַ/פָּ֣רָשִׁ֔ים לְ/כֹל֙ חֵ֣יל פַּרְעֹ֔ה הַ/בָּאִ֥ים אַחֲרֵי/הֶ֖ם בַּ/יָּ֑ם לֹֽא נִשְׁאַ֥ר בָּ/הֶ֖ם עַד אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/028.yaml
  text: And the waters returned and covered the chariots and the horsemen[a], all the army of Pharaoh that had gone after them into the sea; not one of them remained.
translation:
  language: sw
  text: Maji yakarudi na kufunika magari ya vita na wapanda farasi[a]—jeshi lote la Farao lililokuwa limeingia baharini likiwafuata. Hakuna hata mmoja wao aliyebaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kikosi cha wapanda farasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּיִם
  choice: Maji yakarudi
  rationale: Kitenzi שוב hapa kinaonyesha maji kurudia hali au mahali pake baada ya kugawanyika; usemi huu ni wa kawaida na unadumisha mwendo wa simulizi.
- source_word: וַיְכַסּוּ
  choice: kufunika
  rationale: Hii ndiyo maana ya moja kwa moja ya כסה, bila kuongeza kwa tafsiri wazo la kuangamiza ambalo muktadha tayari unadokeza.
- source_word: הָרֶכֶב
  choice: magari ya vita
  rationale: רכב hapa inarejelea magari ya kijeshi kwa maana ya pamoja; 'magari ya vita' ni wazi na ya kawaida katika Kiswahili.
- source_word: הַפָּרָשִׁים
  choice: wapanda farasi
  rationale: Neno פָּרָשִׁים linaweza kumaanisha wapiganaji waliopanda farasi au kikosi chao; 'wapanda farasi' ni tafsiri ya moja kwa moja na inayoeleweka.
- source_word: לְכֹל חֵיל פַּרְעֹה
  choice: jeshi lote la Farao
  rationale: חֵיל katika muktadha huu ni jeshi au kikosi cha kijeshi, na לְכֹל inasisitiza ujumla wake.
- source_word: הַבָּאִים אַחֲרֵיהֶם בַּיָּם
  choice: lililokuwa limeingia baharini likiwafuata
  rationale: Tafsiri hii inaonyesha kwamba jeshi hilo liliingia baharini katika harakati ya kuwafuata Waisraeli, huku ikifaa kwa mfuatano wa matukio katika simulizi.
- source_word: לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  choice: Hakuna hata mmoja wao aliyebaki
  rationale: Usemi huu wa Kiswahili unahifadhi msisitizo wa Kiebrania kwamba hakuna hata mtu mmoja wa kundi lililotajwa aliyesalia.
theological_decisions:
- issue: Upeo wa kuangamia kwa jeshi la Farao
  choice: Kauli ya kutobaki hata mmoja inahusu jeshi lote la Farao lililoingia baharini likiwafuata Waisraeli.
  alternative: Kuichukulia kauli hiyo kuwa inahusu kila askari Mmisri mahali pote.
  rationale: Muundo wa Kiebrania unaunganisha kauli ya mwisho na kikosi maalumu kilichoingia baharini katika kuwafuatia; tafsiri inadumisha ujumla wenye msisitizo ndani ya mpaka huo bila kuupanua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya simulizi la Biblia. Alama [a] imewekwa mara tu baada ya istilahi inayohusika; dashibodi ndefu inaonyesha kwamba 'jeshi lote la Farao' linafafanua magari ya vita na wapanda farasi waliotajwa.
