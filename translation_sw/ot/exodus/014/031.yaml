  text: וַ/יַּ֨רְא יִשְׂרָאֵ֜ל אֶת הַ/יָּ֣ד הַ/גְּדֹלָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ בְּ/מִצְרַ֔יִם וַ/יִּֽירְא֥וּ הָ/עָ֖ם אֶת יְהוָ֑ה וַ/יַּֽאֲמִ֨ינוּ֙ בַּֽ/יהוָ֔ה וּ/בְ/מֹשֶׁ֖ה עַבְדּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/031.yaml
  text: Israel saw the great hand that Yahweh had done against Egypt[a], and the people feared Yahweh[b], and they believed in Yahweh and in Moses his servant.
translation:
  language: sw
  text: Israeli waliona mkono mkuu ambao Yahweh aliutumia dhidi ya Misri[a]. Watu wakamwogopa Yahweh, wakamwamini Yahweh na Musa, mtumishi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkono wenye nguvu”; yaani, nguvu kuu. Kiebrania kinasema kihalisi “mkono mkuu.” Maneno ya mwisho yanaweza pia kutafsiriwa “alioutenda katika Misri” au “alioutenda dhidi ya Misri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יִשְׂרָאֵל
  choice: Israeli waliona
  rationale: Ingawa 'Israeli' ni jina la jumla la umoja katika Kiebrania, kitenzi cha wingi ni cha kawaida na cha asili katika Kiswahili kinaporejelea watu wote.
- source_word: הַיָּד הַגְּדֹלָה
  choice: mkono mkuu
  rationale: Huhifadhi taswira halisi ya Kiebrania ya mkono kama ishara ya nguvu na motifu inayojirudia katika Kutoka; 'mkuu' huakisi גָּדוֹל.
- source_word: אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם
  choice: ambao Yahweh aliutumia dhidi ya Misri
  rationale: Kiswahili hakiwezi kusema kwa ufasaha 'mkono ambao alifanya dhidi ya Misri.' 'Aliutumia' huunganisha mkono na tendo, huku 'dhidi ya Misri' ikionyesha mwelekeo wa hukumu katika muktadha; uwezekano wa 'katika Misri' umewekwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa Tetragramatoni badala ya kulibadilisha kuwa cheo.
- source_word: וַיִּירְאוּ הָעָם אֶת יְהוָה
  choice: Watu wakamwogopa Yahweh
  rationale: ‘Kumwogopa’ huhifadhi maana ya msingi ya ירא na kuacha woga, kicho, na heshima viendelee kuwa ndani ya upana wa neno.
- source_word: וַיַּאֲמִינוּ בַּיהוָה
  choice: wakamwamini Yahweh
  rationale: Katika Kiswahili, 'kumwamini mtu' ni muundo wa kawaida unaobeba maana ya kuamini na kutumaini; hauhitaji kihusishi 'katika.'
- source_word: וּבְמֹשֶׁה עַבְדּוֹ
  choice: na Musa mtumishi wake
  rationale: Huhifadhi ulinganifu wa imani iliyoelekezwa kwa Yahweh na kwa Musa, huku 'mtumishi wake' ikiweka wazi nafasi ya Musa chini ya Yahweh.
theological_decisions:
- issue: Asili ya mwitikio wa Israeli kwa Musa
  choice: Walimsadiki na kumtumaini Yahweh, na pia Musa katika nafasi yake kama mtumishi wa Yahweh.
  alternative: Walimsadiki Yahweh na Musa kama taarifa zao tu, au walimtumaini Musa bila kuhusisha wito wake wa kimungu.
  rationale: Muundo uleule wa אמן + בְ unatumiwa kwa Yahweh na Musa. Tafsiri inadumisha ulinganifu huo bila kuwaweka sawa, kwa kuwa Musa anatambulishwa wazi kuwa mtumishi wa Yahweh.
- issue: Maana ya kumwogopa Yahweh
  choice: Kitenzi kimetafsiriwa kwa maana pana ya 'kumwogopa,' inayoweza kujumuisha hofu, kicho, na heshima.
  alternative: ‘Walistaajabishwa na Yahweh’ au ‘walimheshimu Yahweh.’
  rationale: Neno la jumla 'kumwogopa' halipunguzi mvutano wa kitheolojia uliomo katika ירא baada ya ukombozi na hukumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Viunganishi vya usimulizi 'wakamwogopa, wakamwamini' vinaakisi mfululizo wa Kiebrania kwa mtiririko wa kawaida. Jina 'Israeli' limetumiwa kwa watu kwa ujumla, na upatanisho wa wingi umechaguliwa kwa uasilia wa Kiswahili.
