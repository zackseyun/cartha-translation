base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/022.yaml
  text: And the sons of Israel went into the midst of the sea on the dry ground[a], and the waters were a wall to them on their right and on their left.
translation:
  language: sw
  text: Wana wa Israeli[a] wakaingia katikati ya bahari, katika nchi kavu; nayo maji yakawa ukuta kwao upande wa kulia na upande wa kushoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanaisraeli.” Kiebrania ni “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: wakaingia
  rationale: Katika muktadha huu, בוא inaonyesha kuingia mahali; “wakaingia” ni ya asili katika simulizi la Kiswahili na huhifadhi mwelekeo huo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wanaisraeli
  rationale: Ingawa maana ya neno kwa neno ni “wana wa Israeli,” hapa msemo huo unalitaja taifa lote. “Wanaisraeli” ni wa kawaida, sahihi, na haudokezi kwamba wanaume pekee ndio walioingia.
- source_word: בְּתוֹךְ הַיָּם
  choice: katikati ya bahari
  rationale: Huhifadhi maana ya kuwa ndani au katikati ya bahari bila kuongeza wazo la “kupitia,” ambalo halijasemwa wazi katika kirai hiki.
- source_word: בַּיַּבָּשָׁה
  choice: juu ya nchi kavu
  rationale: יַבָּשָׁה hutofautisha sehemu kavu na maji; “nchi kavu” ni msemo wa kawaida wa Kiswahili unaoonyesha njia kavu chini ya miguu yao.
- source_word: וְהַמַּיִם
  choice: nayo maji
  rationale: “Maji” ni nomino ya wingi katika Kiswahili na huhifadhi taswira ya maandishi ya Kiebrania; “nayo” huunganisha kishazi kwa mtiririko wa asili.
- source_word: חֹמָה
  choice: ukuta
  rationale: Neno hilo linamaanisha ukuta moja kwa moja. Hakuna kiashiria cha wazi cha tashbihi katika Kiebrania, hivyo halikutafsiriwa “kama ukuta.”
- source_word: מִימִינָם
  choice: upande wao wa kulia
  rationale: Hutoa kwa uwazi nafasi ya maji upande wa kulia wa Wanaisraeli.
- source_word: וּמִשְּׂמֹאלָם
  choice: na upande wao wa kushoto
  rationale: Huhifadhi ulinganifu wa kirai kinachotangulia na kueleza wazi upande wa pili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi ya simulizi. “Wanaisraeli” limetumiwa badala ya tafsiri ya neno kwa neno “wana wa Israeli” kwa kuwa msemo wa Kiebrania hapa unalihusu taifa lote; hivyo hakuna tanbihi inayohitajika. Muundo unahifadhi dai thabiti kwamba maji yalikuwa ukuta, bila kulilegeza kuwa tashbihi.
