base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/004.yaml
  text: And I will harden Pharaoh’s heart[a], and he will pursue them; and I will get glory over Pharaoh and over all his army[b], and the Egyptians will know that I am Yahweh.” And they did so.
translation:
  language: sw
  text: Nami nitaufanya moyo wa Farao uwe mgumu[a], naye atawafuatilia. Nitatukuzwa kwa Farao na kwa jeshi lake lote[b], nao Wamisri watajua kwamba mimi ni Yahwe.” Nao wakafanya hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitauimarisha moyo wa Farao.” Kitenzi cha Kiebrania kinaweza kumaanisha “kufanya uwe imara”; katika simulizi hili uimara huo unaonekana kama ukaidi, ndiyo maana limetafsiriwa “uwe mgumu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nitajipatia utukufu juu ya Farao na juu ya jeshi lake lote.” Usemi wa Kiebrania unaonyesha kwamba Yahwe atapata heshima au utukufu kuhusiana na Farao na jeshi lake katika yatakayofuata.
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי
  choice: nitaufanya ... kuwa mgumu
  rationale: Hifili ya חזק humtaja Yahwe moja kwa moja kuwa mtendaji. Katika muktadha huu uthabiti wa moyo wa Farao unajidhihirisha kama ukaidi; kwa hiyo ‘kuwa mgumu’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuibadili kuwa ruhusa tu.
- source_word: לֵב
  choice: moyo
  rationale: ‘Moyo’ huhifadhi taswira ya Kiebrania ya kitovu cha nia na fikra, na ni nahau inayoeleweka katika Kiswahili.
- source_word: וְרָדַף אַחֲרֵיהֶם
  choice: naye atawafuatilia
  rationale: Kitenzi רדף pamoja na אחרי kina maana ya kuwafuatilia au kuwakimbiza; ‘atawafuatilia’ kinafaa kwa msako wa kijeshi na ni cha kawaida.
- source_word: וְאִכָּבְדָה בְּפַרְעֹה
  choice: Nitajipatia utukufu juu ya Farao
  rationale: Kauli hii inahifadhi wazo la Yahwe kupata heshima au utukufu kuhusiana na Farao katika hukumu inayofuata. ‘Juu ya’ huonyesha mwelekeo wa ushindi bila kueleza zaidi ya andiko.
- source_word: וּבְכָל חֵילוֹ
  choice: na juu ya jeshi lake lote
  rationale: חַיִל hapa ni nguvu za kijeshi za Farao; ‘jeshi’ ndilo neno la wazi na la sasa.
- source_word: וְיָדְעוּ מִצְרַיִם
  choice: nao Wamisri watajua
  rationale: Kitenzi cha wingi pamoja na jina Misri kinarejelea watu wa Misri; ‘Wamisri’ ni usemi wa kawaida wa Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa namna inayokaribia matamshi ya tetragramatoni badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Nao wakafanya hivyo
  rationale: Ni tamati ya simulizi inayosema kwa ufupi kwamba walitekeleza agizo lililotangulia.
theological_decisions:
- issue: Tendo la Mungu katika kuufanya moyo wa Farao kuwa mgumu
  choice: nitaufanya moyo wa Farao kuwa mgumu
  alternative: nitauruhusu moyo wa Farao uwe mgumu
  rationale: Umbo la nafsi ya kwanza la Hifili linamtaja Yahwe kama mtendaji. Tafsiri hailegezi kisababishi hicho kuwa ruhusa tu, wala haiongezi maelezo ya kimadhehebu.
- issue: Maana ya כבד katika muktadha wa hukumu
  choice: Nitajipatia utukufu juu ya Farao
  alternative: nitatukuzwa kupitia Farao
  rationale: Chaguo kuu linaonyesha heshima ya Yahwe itakayodhihirika katika kushughulika kwake na Farao na jeshi lake, huku tanbihi ikihifadhi uwezekano wa kuelewa muundo huo kama kutukuzwa kupitia kwao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Viunganishi ‘nami,’ ‘naye,’ na ‘nao’ vinadumisha mtiririko wa Kiebrania bila kufanya sentensi kuwa nzito.
