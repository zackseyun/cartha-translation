  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנְ/נִ֤י מְחַזֵּק֙ אֶת לֵ֣ב מִצְרַ֔יִם וְ/יָבֹ֖אוּ אַחֲרֵי/הֶ֑ם וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/017.yaml
  text: And I—behold[a], I am hardening the hearts of the Egyptians so that they will go in after them, and I will get glory over Pharaoh and over all his army[b], over his chariots and over his horsemen.
translation:
  language: sw
  text: Nami, tazama, mimi ninaifanya mioyo ya Wamisri[b] kuwa migumu, ili waingie wakiwafuata; nami nitajipatia utukufu juu ya Farao na jeshi lake lote, juu ya magari yake ya vita na wapanda-farasi wake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Kiebrania: “moyo wa Wamisri”; neno “moyo” limetumiwa kwa maana ya pamoja.'
    reason: Kufafanua tofauti ya idadi kati ya muundo wa Kiebrania na Kiswahili cha kawaida.
  - marker: c
    text: Au, “nitatukuzwa kupitia Farao na jeshi lake lote, magari yake ya vita na wapanda-farasi wake.”
    reason: Muundo wa כבד pamoja na ב unaweza kueleweka kuwa Mungu anapata utukufu juu ya Farao au kupitia kwake.
lexical_decisions:
- source_word: הִנְנִי
  choice: tazama—ninaifanya
  rationale: Kirai hiki kinasisitiza nafsi ya msemaji na hatua yake iliyo karibu au inayoendelea. “Tazama” kinadumisha msisitizo huo kwa lugha ya heshima inayofahamika.
- source_word: מְחַזֵּק אֶת לֵב מִצְרַיִם
  choice: ninaifanya mioyo ya Wamisri kuwa migumu
  rationale: Kauli hii inaonyesha tendo la Mungu moja kwa moja na hali inayoendelea au iliyo karibu. Wingi “mioyo” ni wa kawaida katika Kiswahili, ingawa Kiebrania kimetumia “moyo” kwa maana ya jumla.
- source_word: וְיָבֹאוּ אַחֲרֵיהֶם
  choice: ili waingie kuwafuata
  rationale: Katika muktadha, Wamisri wataingia baada ya Waisraeli na kuwafuatilia. “Ili” linaonyesha uhusiano wa matokeo au kusudi unaoeleweka katika simulizi, huku “waingie” likidumisha tendo la kuingia.
- source_word: וְאִכָּבְדָה בְּפַרְעֹה
  choice: nami nitajipatia utukufu juu ya Farao
  rationale: Muundo huu unaeleza Mungu kupata au kudhihirisha utukufu kwa ushindi na hukumu inayomhusu Farao. “Juu ya” linadumisha wazo la ushindi bila kuondoa uwezekano wa kuelewa Farao kuwa njia ambayo utukufu huo unaonekana.
- source_word: חֵילוֹ
  choice: jeshi lake lote
  rationale: Katika muktadha wa kijeshi, חַיִל humaanisha jeshi au nguvu za kijeshi; “jeshi” ni neno la sasa na wazi.
- source_word: רִכְבּוֹ
  choice: magari yake ya vita
  rationale: Nomino ya umoja inaweza kutumiwa kwa mkusanyiko wa magari ya vita. Wingi wa Kiswahili unawasilisha maana hiyo kwa kawaida.
- source_word: פָרָשָׁיו
  choice: wapanda-farasi wake
  rationale: Neno hili linataja askari wanaopanda farasi; tafsiri hii ni halisi, wazi, na inafaa picha ya kijeshi.
theological_decisions:
- issue: Tendo la Mungu katika kuifanya mioyo ya Wamisri kuwa migumu
  choice: ninaifanya mioyo ya Wamisri kuwa migumu
  alternative: ninaruhusu mioyo yao iwe migumu
  rationale: Kiebrania kinamhusisha Mungu moja kwa moja na tendo hili. Tafsiri hailegezi kauli kuwa ruhusa tu, bali inadumisha mvutano wa kiteolojia kati ya enzi ya Mungu na wajibu wa wanadamu.
- issue: Utukufu wa Mungu kupitia hukumu ya Farao
  choice: nitajipatia utukufu juu ya Farao
  alternative: nitatukuzwa kupitia Farao
  rationale: Chaguo kuu linaonyesha utukufu wa Mungu unaodhihirishwa katika ushindi wake juu ya Farao. Chaguo jingine linawezekana kisarufi, hivyo limetajwa katika tanbihi bila kulazimisha maana moja pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unadumisha msisitizo wa Kiebrania bila kuwa wa kizamani; maneno ya kijeshi ni ya wazi na ya sasa.
