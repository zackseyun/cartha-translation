lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: מַה תִּצְעַק אֵלָי
  choice: Kwa nini unanililia?
  rationale: Swali la Kiswahili linaonyesha maana ya kilio cha kuomba msaada na nguvu ya kauli ya moja kwa moja.
- source_word: דַּבֵּר אֶל
  choice: Waambie
  rationale: Katika muktadha huu, kitenzi cha kusema kwa watu ili watende jambo fulani kinatolewa kwa kawaida kama ‘waambie’ bila kukiongezea nguvu ya ‘waamuru’.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu muundo wa Kiebrania na jina la jadi la jumuiya ya agano.
- source_word: וְיִסָּעוּ
  choice: waondoke
  rationale: נסע hapa inaashiria kuanza safari au kusonga kutoka mahali walipo; ‘waondoke’ ni wazi na ya kawaida katika muktadha huu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: ‘Yahwe’ huhifadhi jina binafsi la Mungu lililo katika maandishi badala ya kulibadilisha kuwa cheo.
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Chaguo kuu linafuata kwa karibu umbo la Kiebrania bila kuzuia maana ya kijumuiya; Kiswahili cha kawaida ‘Waisraeli’ kinawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Kiambishi cha yambwa katika ‘akamwambia’ na ‘unanililia’ kinaweka uhusiano wa wahusika wazi bila kuongeza maelezo yasiyokuwapo katika chanzo.
