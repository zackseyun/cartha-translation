  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הֲ/לֹא זֶ֣ה הַ/דָּבָ֗ר אֲשֶׁר֩ דִּבַּ֨רְנוּ אֵלֶ֤י/ךָ בְ/מִצְרַ֨יִם֙ לֵ/אמֹ֔ר חֲדַ֥ל מִמֶּ֖/נּוּ וְ/נַֽעַבְדָ֣ה אֶת מִצְרָ֑יִם כִּ֣י ט֥וֹב לָ֨/נוּ֙ עֲבֹ֣ד אֶת מִצְרַ֔יִם מִ/מֻּתֵ֖/נוּ בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/012.yaml
  text: Is this not the word that we spoke to you in Egypt, saying, ‘Leave us alone so that we may serve the Egyptians’? For it would have been better for us to serve the Egyptians than to die in the wilderness.
translation:
  language: sw
  text: Je, hili silo jambo tulilokuambia huko Misri, tukisema, ‘Tuache, ili tuwatumikie Wamisri’? Kwa maana ingekuwa afadhali kwetu kuwatumikia Wamisri kuliko kufa jangwani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: jambo
  rationale: Katika muktadha huu neno hili linarejelea yale waliyomwambia Musa, si lazima ‘neno’ moja mahususi; ‘jambo’ ni Kiswahili cha kawaida na huhifadhi maana ya kauli hiyo.
- source_word: חֲדַל מִמֶּנּוּ
  choice: Tuache
  rationale: Usemi huu una maana ya kuacha kuwashughulikia au kuwaingilia; ‘Tuache’ ni wa moja kwa moja na wa asili katika Kiswahili.
- source_word: וְנַעַבְדָה אֶת מִצְרָיִם
  choice: ili tuwatumikie Wamisri
  rationale: Kiunganishi kinaweza kueleza kusudi au matokeo yanayotazamiwa. ‘Ili’ huonyesha wazi ombi lao la kuachwa waendelee kuwatumikia Wamisri. ‘Misri’ hapa kimetonimia humaanisha Wamisri.
- source_word: כִּי טוֹב לָנוּ עֲבֹד
  choice: Kwa maana ingekuwa afadhali kwetu kuwatumikia
  rationale: Muundo wa Kiebrania ni halisi ‘ni bora kwetu kutumikia,’ lakini katika hali hii ya kulinganisha maisha ya zamani na kifo kinachowakabili, hali ya masharti ‘ingekuwa afadhali’ ni ya asili na huwasilisha nguvu ya hoja yao.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: ‘Jangwani’ ni tafsiri ya kawaida na ya moja kwa moja ya eneo lisilolimwa linalokusudiwa hapa.
theological_decisions:
- issue: Kauli kuhusu ubora wa utumwa dhidi ya kifo
  choice: ingekuwa afadhali kwetu
  alternative: ni afadhali kwetu
  rationale: Hali ya masharti inaonyesha tathmini ya Waisraeli kuhusu njia ambayo, kwa maoni yao, ingekuwa bora kuliko kufa sasa; haibadili kauli kuwa hukumu ya msimulizi au fundisho kuhusu utumwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la lawama umehifadhiwa, huku sentensi ikisomeka kwa urahisi kwa wasomaji wa kawaida.
