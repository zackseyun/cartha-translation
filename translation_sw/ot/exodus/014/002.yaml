translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Waisraeli’ limetumiwa katika matini kwa uelewekevu wa kawaida, huku usemi halisi wa kifamilia ukihifadhiwa katika tanbihi. Tahajia za majina zimetoholewa kulingana na sauti za Kiswahili.
