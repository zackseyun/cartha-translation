  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/יָשֻׁ֗בוּ וְ/יַחֲנוּ֙ לִ/פְנֵי֙ פִּ֣י הַחִירֹ֔ת בֵּ֥ין מִגְדֹּ֖ל וּ/בֵ֣ין הַ/יָּ֑ם לִ/פְנֵי֙ בַּ֣עַל צְפֹ֔ן נִכְח֥/וֹ תַחֲנ֖וּ עַל הַ/יָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/002.yaml
  text: Speak to the sons of Israel[a], that they turn back and camp before Pi-hahiroth, between Migdol and the sea. Before Baal-zephon, opposite it[c][b], you shall camp by the sea.
translation:
  language: sw
  text: Waambie Waisraeli[a] warudi na kupiga kambi mbele ya Pi-Hahirothi, kati ya Migdoli na bahari. Mbele ya Baal-Sefoni, mkabala nayo[c], mtapiga kambi kando ya bahari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Pi-Hahirothi, Migdoli na Baal-Sefoni ni majina ya mahali; kwa hiyo yametoholewa badala ya kutafsiriwa.
    reason: cultural_note
  - marker: c
    text: Au, “ikiielekea.” Kiwakilishi katika “mkabala nayo” huenda zaidi hurejelea Baal-Sefoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל בְּנֵי יִשְׂרָאֵל
  choice: Waambie Waisraeli
  rationale: Kauli hii inawasilisha kwa Kiswahili cha kawaida amri ya moja kwa moja kwa Musa. Ingawa בְּנֵי יִשְׂרָאֵל kihalisi ni ‘wana wa Israeli,’ ‘Waisraeli’ ni jina la kawaida na linalojumuisha jumuiya yote; maana halisi imewekwa katika tanbihi.
- source_word: וְיָשֻׁבוּ
  choice: warudi
  rationale: Kitenzi hiki katika muktadha kina nguvu ya agizo na kinaonyesha kubadili mwelekeo au kurudi nyuma. Muundo ‘Waambie ... warudi’ ni wa asili katika Kiswahili.
- source_word: וְיַחֲנוּ
  choice: na kupiga kambi
  rationale: ‘Kupiga kambi’ ni usemi wa kawaida wa Kiswahili kwa חנה na unaendana na muktadha wa safari.
- source_word: לִפְנֵי פִּי הַחִירֹת
  choice: mbele ya Pi-Hahirothi
  rationale: לִפְנֵי imetafsiriwa kwa uhusiano wa mahali ‘mbele ya’; jina la mahali limetoholewa badala ya kutafsiriwa kietimolojia.
- source_word: בֵּין מִגְדֹּל וּבֵין הַיָּם
  choice: kati ya Migdoli na bahari
  rationale: Muundo wa Kiebrania unaonyesha mipaka miwili ya eneo; ‘bahari’ haitaji herufi kubwa kama jina rasmi.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: Mbele ya Baal-Sefoni
  rationale: Uhusiano wa mahali wa לִפְנֵי umehifadhiwa, na jina la mahali limetoholewa.
- source_word: נִכְחוֹ
  choice: mkabala nayo
  rationale: נֹכַח pamoja na kiambishi cha nafsi ya tatu umoja huonyesha mahali panapokabiliana na kitu. ‘Nayo’ kwa kawaida humrejelea Baal-Sefoni kama mahali, bila kufuta uwezekano wa maana ‘ikiielekea.’
- source_word: תַחֲנוּ
  choice: mtapiga kambi
  rationale: Imperfecti ya nafsi ya pili wingi ina nguvu ya agizo hapa; wakati ujao wa Kiswahili unaweza kutoa agizo lenye mamlaka katika muktadha huu.
- source_word: עַל הַיָּם
  choice: kando ya bahari
  rationale: עַל hapa inaonyesha ukaribu na ufuo, si kuwa juu ya maji; ‘kando ya bahari’ ni tafsiri ya asili na sahihi.
