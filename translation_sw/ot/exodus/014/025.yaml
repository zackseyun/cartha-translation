base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/025.yaml
  text: And he removed the wheels from his chariots, and drove them with difficulty. And Egypt said, “Let me flee from before Israel, for the LORD is fighting for them against Egypt.”
translation:
  language: sw
  text: Akaondoa magurudumu ya magari yake ya vita[a], akaliendesha kwa shida[b]. Misri ikasema, “Na nitoroke mbele ya Israeli, kwa maana YHWH anawapigania dhidi ya Misri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “magari yake”; kiwakilishi cha umoja huenda kinarejelea Misri kama taifa.'
    reason: Kueleza kiwakilishi cha umoja kinachohusishwa na “magari” ya wingi.
  - marker: b
    text: Kiebrania ina “akaliendesha” kwa kiambishi cha yambwa cha umoja, ingawa imetanguliwa na “magari” ya wingi; huenda umoja huo hurejelea gari kama dhana ya jumla.
    reason: Kuhifadhi na kueleza umoja wa kiambishi cha Kiebrania bila kuamua kwa uhakika rejeo lake.
lexical_decisions:
- source_word: וַיָּסַר
  choice: Akaondoa
  rationale: Kitenzi hiki kwa kawaida humaanisha kuondoa au kuondosha; tafsiri haiongezi namna hasa magurudumu yalivyoondolewa.
- source_word: מַרְכְּבֹתָיו
  choice: magari yake ya vita
  rationale: Singular possessive ya Kiebrania imehifadhiwa kama ‘yake,’ ingawa kiwakilishi kinaweza kurejelea Misri kama umoja wa kijamii; מֶרְכָּבָה hapa ni gari la vita.
- source_word: וַיְנַהֲגֵהוּ בִּכְבֵדֻת
  choice: akayaendesha kwa shida
  rationale: בִּכְבֵדֻת huonyesha uzito au ugumu; ‘kwa shida’ ni Kiswahili cha kawaida kinachowasilisha mwendo mgumu bila kufafanua zaidi.
- source_word: מִצְרַיִם
  choice: Wamisri
  rationale: Ingawa umbo la chanzo ni ‘Misri,’ hapa taifa linazungumza na linatajwa tena kama upande unaopigwa; Kiswahili hutumia ‘Wamisri’ kwa watu wa taifa hilo.
- source_word: אָנ֨וּסָה
  choice: Na nikimbie
  rationale: Umbo la cohortative ni nafsi ya kwanza umoja, hivyo ‘na nikimbie’ huhifadhi umoja usio wa kawaida badala ya kuusawazisha kuwa wingi.
- source_word: יְהוָה
  choice: YHWH
  rationale: Jina la Mungu lenye herufi nne limewasilishwa kwa uwazi bila kudai matamshi yasiyo hakika.
theological_decisions:
- issue: Mhusika anayeyaondoa magurudumu
  choice: 'Kitenzi kimeachwa katika nafsi ya tatu umoja: ‘Akaondoa.’'
  alternative: ‘YHWH akaondoa’ au ‘magurudumu yakaondolewa.’
  rationale: Muktadha wa mstari uliotangulia humwezesha msomaji kumtambua YHWH, lakini chanzo hakirudii jina hilo katika kishazi hiki; tafsiri haiongezi wala kugeuza kuwa kauli tendwa.
- issue: Umoja wa Misri katika usemi
  choice: ‘Na nikimbie’
  alternative: ‘Na tukimbie.’
  rationale: Chanzo kina cohortative ya nafsi ya kwanza umoja huku ‘Misri’ ikiwa mhusika wa pamoja; mvutano huo wa kisarufi umehifadhiwa na kufafanuliwa kwa tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Magari ya vita’ ni wazi kuliko ‘magari’ pekee katika muktadha huu; ‘kwa shida’ ni usemi wa kawaida na sahihi. Alama zote za tanbihi zimewekwa katika matini kuu.
