  text: And they said to Moses[a], “Was it because there were no graves in Egypt that you took us away to die in the wilderness? What is this you have done to us by bringing us out of Egypt?”
translation:
  language: sw
  text: Nao wakamwambia Musa, “Je, ni kwa sababu hakukuwa na makaburi Misri[a] kwamba umetuchukua ili tufe nyikani? Ni nini hiki ulichotutendea kwa kututoa Misri?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Je, ni kwa kukosekana kwa makaburi Misri kwamba umetuchukua ili tufe nyikani?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: Nao wakamwambia Musa
  rationale: Muundo huu ni wa kawaida katika masimulizi ya Kiswahili; kiambishi “-mw-” kinaonyesha kwamba maneno yalielekezwa kwa Musa.
- source_word: הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם
  choice: Je, ni kwa sababu hapakuwa na makaburi huko Misri
  rationale: Unahifadhi swali la kejeli la Kiebrania kwa Kiswahili cha kawaida bila kulifanya kuwa kauli ya moja kwa moja.
- source_word: לְקַחְתָּנוּ
  choice: umetuchukua
  rationale: Kitenzi “kuchukua” kinaakisi לקח na kukitofautisha na הוציא, kinachotafsiriwa “kutoa” baadaye katika mstari.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: ili tufe nyikani
  rationale: “Ili tufe” huonyesha kusudi au matokeo yanayodaiwa, na “nyikani” huonyesha eneo lisilolimwa la מִדְבָּר bila kulibana kuwa jangwa la mchanga pekee.
- source_word: מַה־זֹּאת עָשִׂיתָ לָּנוּ
  choice: Ni jambo gani hili ulilotutendea
  rationale: Huhifadhi umbo la mshangao na swali la lawama lililo katika Kiebrania, badala ya kuligeuza kimya kimya kuwa “Kwa nini umefanya hivi?”
- source_word: לְהוֹצִיאָנוּ מִמִּצְרָיִם
  choice: kwa kututoa Misri
  rationale: “Kwa kututoa” huunganisha kishazi na tendo wanalolalamikia na kudumisha maana ya הוציא, yaani kutoa au kuongoza nje.
