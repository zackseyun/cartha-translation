  text: וַ/יִּסַּ֞ע מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים הַ/הֹלֵךְ֙ לִ/פְנֵי֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֵּ֖לֶךְ מֵ/אַחֲרֵי/הֶ֑ם וַ/יִּסַּ֞ע עַמּ֤וּד הֶֽ/עָנָן֙ מִ/פְּנֵי/הֶ֔ם וַ/יַּֽעֲמֹ֖ד מֵ/אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/019.yaml
  text: Then the angel of God[a], who had been going before the camp of Israel, moved and went behind them; and the pillar of cloud moved from before them and stood behind them.
translation:
  language: sw
  text: Kisha malaika wa Mungu[a], aliyekuwa akienda mbele ya kambi ya Israeli, akaondoka na kwenda nyuma yao; nayo nguzo ya wingu ikaondoka kutoka mbele yao na kusimama nyuma yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wa Mungu.” Neno la Kiebrania linaweza kumaanisha “malaika” au “mjumbe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: akaondoka
  rationale: Kitenzi נסע kinaweza kumaanisha kuondoka au kuanza safari. Hapa kinaeleza kubadili mahali kutoka mbele kwenda nyuma; “akaondoka” ni ya asili katika Kiswahili na haidokezi safari mpya.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: malaika wa Mungu
  rationale: מַלְאָךְ inaweza kumaanisha malaika au mjumbe. Katika muktadha huu “malaika wa Mungu” ni usemi unaoeleweka na uliozoeleka, huku tanbihi ikihifadhi uwezekano wa maana ya “mjumbe.”
- source_word: הַהֹלֵךְ
  choice: aliyekuwa akienda
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea kabla ya hatua inayofuata; “aliyekuwa akienda” huhifadhi hali hiyo ya kuendelea.
- source_word: לִפְנֵי מַחֲנֵה יִשְׂרָאֵל
  choice: mbele ya kambi ya Israeli
  rationale: Hii ni kauli wazi ya mahali na huhifadhi uhusiano wa maneno ya Kiebrania bila kufanya Kiswahili kuwa kizito.
- source_word: וַיֵּלֶךְ מֵאַחֲרֵיהֶם
  choice: akaenda nyuma yao
  rationale: מֵאַחֲרֵי hapa inaonyesha nafasi ya nyuma, si kuwafuata kwa maana ya kuwakimbiza.
- source_word: עַמּוּד הֶעָנָן
  choice: nguzo ya wingu
  rationale: Tafsiri hii huhifadhi picha halisi ya nguzo inayohusishwa na wingu na ni usemi wa kawaida wa kibiblia katika Kiswahili.
- source_word: מִפְּנֵיהֶם
  choice: mbele yao
  rationale: Katika Kiswahili, “ikaondoka mbele yao” huwasilisha kwa kawaida maana ya kutoka mahali palipokuwa mbele yao; kuongeza “kutoka” kungeleta uradidi baada ya kitenzi “ikaondoka.”
- source_word: וַיַּעֲמֹד
  choice: kusimama
  rationale: עמד kwa kawaida humaanisha kusimama; hapa inaonyesha nguzo kuchukua nafasi thabiti nyuma yao bila kuongeza wazo la kujipanga kivita.
theological_decisions:
- issue: Utambulisho na asili ya מַלְאַךְ הָאֱלֹהִים
  choice: “malaika wa Mungu,” bila kufafanua kama ni malaika aliyeumbwa, udhihirisho wa Mungu, au udhihirisho wa Kristo kabla ya kufanyika mwili
  alternative: “mjumbe wa Mungu” au tafsiri inayomtambulisha wazi kuwa udhihirisho wa Mungu
  rationale: Kifungu kinamtaja mhusika lakini hakifafanui asili yake. Tafsiri hii huhifadhi mvutano wa kiteolojia na kuacha utambulisho wake kamili katika kiwango cha ufasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi wenye “aka-” na “ika-” unaendeleza simulizi kwa njia ya asili. Kiashiria [a] kimewekwa mara baada ya “Mungu.”
