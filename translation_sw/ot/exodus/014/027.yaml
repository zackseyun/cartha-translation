base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/027.yaml
  text: So Moses stretched out his hand over the sea[a], and toward morning the sea returned to its usual place, while the Egyptians were fleeing toward it[b]. And Yahweh threw the Egyptians into the midst of the sea.
translation:
  language: sw
  text: Basi Musa akaunyosha mkono wake juu ya bahari, na asubuhi ilipokaribia, bahari ikarudia hali yake ya kawaida[a]. Wamisri walikuwa wakikimbia kuielekea, naye Yahwe akawatupa[b] katikati ya bahari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguvu zake za kawaida” au “hali yake ya awali.” Usemi wa Kiebrania unaonyesha kwamba bahari ilirudia hali yake thabiti ya kawaida.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kihalisi humaanisha “kung’uta” au “kutikisa ili kitu kidondoke”; ni taswira hai ya Yahwe kuwatupa Wamisri baharini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: akaunyosha
  rationale: Kitenzi נטה pamoja na ‘mkono’ humaanisha kuunyosha au kuuelekeza; ‘akaunyosha’ ni Kiswahili cha kawaida kinachohifadhi tendo la kimwili.
- source_word: הַיָּם
  choice: bahari
  rationale: Hili ni neno la kawaida la Kiebrania kwa ‘bahari’; mstari huu pekee haulazimishi kulitafsiri kama jina maalumu.
- source_word: וַיָּשָׁב הַיָּם
  choice: bahari ikarudia
  rationale: שׁוב hapa inaonyesha kurudi katika hali iliyokuwapo awali.
- source_word: לִפְנוֹת בֹּקֶר
  choice: asubuhi ilipokaribia
  rationale: Nahau hii inaonyesha kuwadia au kuanza kwa asubuhi; tafsiri hii ni ya kawaida na huhifadhi maana ya wakati.
- source_word: לְאֵיתָנוֹ
  choice: hali yake ya kawaida
  rationale: אֵיתָן inaweza kumaanisha uimara, nguvu ya kudumu, au hali thabiti. Katika muktadha huu inaonyesha bahari kurudia hali yake ya kudumu baada ya kugawanyika, huku tanbihi ikihifadhi uwezekano wa ‘nguvu zake za kawaida.’
- source_word: נָסִים לִקְרָאתוֹ
  choice: walikuwa wakikimbia kuielekea
  rationale: Umbo la kitenzi linaonyesha tendo linaloendelea, na לִקְרָאתוֹ kihalisi ni ‘kuielekea/kwenda kuikabili.’ Tafsiri hii huhifadhi mwelekeo wenye kutatanisha bila kuufafanua kupita kiasi.
- source_word: וַיְנַעֵר
  choice: akawatupa
  rationale: נער kihalisi hutoa picha ya kukung’uta au kutikisa kitu kitoke. ‘Akawatupa’ ni Kiswahili cha asili kinachoeleza matokeo ya kitendo, huku tanbihi ikihifadhi picha halisi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa na cheo.
- source_word: בְּתוֹךְ הַיָּם
  choice: katikati ya bahari
  rationale: תּוֹךְ huonyesha sehemu ya ndani au katikati; hapa muktadha wa kitenzi unaonyesha Wamisri kutupwa humo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida; urudiaji wa ‘bahari’ umehifadhiwa, na utata wa Wamisri kukimbia kuielekea umeachwa kama ulivyo katika Kiebrania.
