base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/003.yaml
  text: For Pharaoh will say of the sons of Israel[a], ‘They are confused in the land[c][b]; the wilderness has shut them in.’
translation:
  language: sw
  text: Kwa maana Farao atasema kuhusu wana wa Israeli, “Wamechanganyikiwa katika nchi; nyika imewafungia ndani.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַר
  choice: Kwa maana ... atasema
  rationale: Katika muktadha huu, waw pamoja na qatal hutazamia itikio la Farao litakalofuata; “Kwa maana” huonyesha vizuri uhusiano wa maelezo na mstari uliotangulia.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kuhusu wana wa Israeli
  rationale: ל pamoja na אָמַר hapa inaweza kuonyesha wale wanaozungumziwa. “Wana wa Israeli” huhifadhi nahau ya Kiebrania bila kuibadili kuwa jina la jumla.
- source_word: נְבֻכִים
  choice: wamechanganyikiwa
  rationale: Kivumishi-tendo hiki kinaonyesha hali ya kutatizika, kupoteza mwelekeo, au kunaswa. “Wamechanganyikiwa” ni ya asili na haiongezi waziwazi wazo la kutangatanga ambalo halijasemwa moja kwa moja.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: Huhifadhi maana pana ya אֶרֶץ bila kuamua ikiwa inamaanisha Misri hasa au eneo la karibu.
- source_word: סָגַר עֲלֵיהֶם
  choice: imewafungia ndani
  rationale: Nahau hii inaonyesha kuwa wamezuiliwa au kuzingirwa wasiwe na njia ya kutoka.
- source_word: הַמִּדְבָּר
  choice: nyika
  rationale: מִדְבָּר ni eneo kame lisilolimwa, si lazima jangwa la mchanga; “nyika” ni neno la Kiswahili linalofaa katika mazingira haya.
