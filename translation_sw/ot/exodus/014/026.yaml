base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/026.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the sea, so that the waters may return over the Egyptians, over their chariots, and over their horsemen.”
translation:
  language: sw
  text: Kisha Yahweh akamwambia Musa, “Nyoosha mkono wako juu ya bahari, ili maji yarudi juu ya Wamisri, juu ya magari yao ya vita, na juu ya wapanda-farasi wao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida huku ukihifadhi nguvu ya waw-consecutive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: נְטֵה אֶת־יָדְךָ
  choice: Nyoosha mkono wako
  rationale: Hii ni amri ya kuuelekeza na kuupanua mkono; “nyoosha” ni ya asili na wazi katika muktadha huu.
- source_word: עַל־הַיָּם
  choice: juu ya bahari
  rationale: עַל hapa inaonyesha mkono kunyooshwa juu ya bahari, bila kulazimisha maana ya kugusa maji.
- source_word: וְיָשֻׁבוּ הַמַּיִם
  choice: ili maji yawarudie
  rationale: Kitenzi baada ya amri kinaweza kuonyesha matokeo yaliyokusudiwa; “ili” huwasilisha uhusiano huo kwa Kiswahili cha kawaida, huku usomaji wa wakati ujao ukiwekwa katika tanbihi.
- source_word: עַל מִצְרַיִם
  choice: yawarudie Wamisri
  rationale: Katika Kiswahili, “maji yawarudie” hueleza kwa asili maji kurudi juu yao, bila kuongeza wazo la shambulio lisilo wazi katika kihusishi.
- source_word: עַל רִכְבּוֹ
  choice: magari yao ya vita
  rationale: רֶכֶב hapa ni magari ya vita; kiambishi cha umoja kinamhusu Misri kama jamii, hivyo umilikaji wa wingi ni wa asili kwa Kiswahili.
- source_word: וְעַל פָּרָשָׁיו
  choice: na wapanda-farasi wao
  rationale: פָּרָשָׁיו inarejelea watu waliopanda farasi; “wapanda-farasi” ni tafsiri ya moja kwa moja kuliko istilahi ya kijeshi ya kiufundi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi; “Yahweh” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya וְיָשֻׁבוּ baada ya amri
  choice: ili maji yawarudie
  alternative: na maji yatawarudia
  rationale: Muktadha unaruhusu kitenzi kueleza matokeo yaliyokusudiwa ya tendo la Musa, lakini uwezekano wa kukitafsiri kama wakati ujao rahisi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Magari ya vita” hufafanua chariots kwa msomaji wa kawaida, na “wapanda-farasi” hudumisha picha halisi ya maandishi.
