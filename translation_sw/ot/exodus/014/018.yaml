  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/יָדְע֥וּ מִצְרַ֖יִם כִּי אֲנִ֣י יְהוָ֑ה בְּ/הִכָּבְדִ֣/י בְּ/פַרְעֹ֔ה בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/018.yaml
  text: And the Egyptians will know that I am Yahweh[a], when I gain glory through Pharaoh, through his chariots[b], and through his horsemen.
translation:
  language: sw
  text: Ndipo Wamisri watakapojua kwamba mimi ni Yahwe[a], nitakapotukuzwa kupitia Farao, magari yake ya vita, na wapanda farasi wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina la Kiebrania יהוה (YHWH) limetafsiriwa hapa “Yahwe”; katika tafsiri nyingi huandikwa “BWANA.”
    reason: alternative_reading
  - marker: b
    text: Au, “nitakapojipatia utukufu juu ya Farao, magari yake ya vita, na wapanda farasi wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Ndipo ... watakapojua
  rationale: Katika mfululizo huu wa kinabii na kisimulizi, kitenzi kinaeleza matokeo yajayo. “Ndipo” linaonyesha wazi kwamba utambuzi wa Wamisri utatokana na tukio linalofuata.
- source_word: מִצְרַיִם
  choice: Wamisri
  rationale: Ingawa neno linaweza kumaanisha nchi ya Misri au watu wake, hapa ni watu ndio watakaomjua Yahwe.
- source_word: כִּי אֲנִי יְהוָה
  choice: kwamba mimi ni Yahwe
  rationale: Hii inadumisha kauli ya kujitambulisha na kulitaja jina la Mungu lililoandikwa katika Kiebrania.
- source_word: בְּהִכָּבְדִי
  choice: nitakapotukuzwa
  rationale: Muundo wa Niphal unaeleza Yahwe kutukuzwa au kudhihirishwa kuwa mwenye utukufu; “nitakapo-” linaonyesha maana ya wakati ya בְּ pamoja na kitenzi-jina.
- source_word: בְּפַרְעֹה
  choice: kupitia Farao
  rationale: Kihusishi בְּ hapa kinaweza kuonyesha njia au mazingira ambamo utukufu wa Yahwe utaonekana. “Kupitia” ni Kiswahili cha kawaida na hakimaanishi kwamba Farao anamwabudu Mungu kwa hiari.
- source_word: בְּרִכְבּוֹ
  choice: magari yake ya vita
  rationale: רֶכֶב linaweza kutaja magari ya vita kwa ujumla; tafsiri hii ni wazi kwa msomaji wa sasa.
- source_word: וּבְפָרָשָׁיו
  choice: na wapanda farasi wake
  rationale: פָּרָשִׁים ni wapanda farasi wa kijeshi; usemi huu unadumisha uhusiano wao na magari ya vita.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo; tanbihi inataja desturi nyingine ya tafsiri.
- issue: Maana ya בְּהִכָּבְדִי pamoja na בְּ inayorudiwa
  choice: nitakapotukuzwa kupitia
  alternative: nitakapojipatia utukufu juu ya
  rationale: Muundo wa Kiebrania unaweza kusisitiza Mungu kutukuzwa kupitia kuanguka kwa jeshi la Farao au kujipatia utukufu juu yake. Maandishi makuu yanadumisha kauli tendwa ya Niphal, huku tanbihi ikihifadhi uwezekano mwingine bila kuamua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Magari ya vita” ni wazi kuliko istilahi ya kitaalamu kama “magari ya farasi,” na “wapanda farasi” ni usemi unaoeleweka kwa kawaida. Muundo wa sentensi unahifadhi uhusiano wa sababu na matokeo wa Kiebrania.
