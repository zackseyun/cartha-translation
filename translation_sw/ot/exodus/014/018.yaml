  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfuatano na maana ya Kiebrania: Wamisri ndio watakaotambua utambulisho wa Yahwe, na kutukuzwa kwake kunahusishwa na Farao, magari yake ya vita, na wapanda farasi wake. Kauli tendwa “nitakapotukuzwa” huakisi vizuri Niphal בְּהִכָּבְדִי, bila kulazimisha maana moja finyu ya kihusishi בְּ.'
