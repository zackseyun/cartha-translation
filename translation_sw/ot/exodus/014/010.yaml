base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/010.yaml
  text: As Pharaoh drew near[a], the sons of Israel lifted up their eyes, and behold, the Egyptians were marching after them; and they were very afraid[b], and the sons of Israel cried out to Yahweh.
translation:
  language: sw
  text: Farao alipokaribia, wana wa Israeli[a] wakainua macho yao, na kumbe Wamisri[b] walikuwa wakiwafuata. Wakaogopa sana, na wana wa Israeli wakamlilia Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli”; Kiebrania kihalisi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “Misri”; jina hilo linawakilisha Wamisri au jeshi la Misri lililokuwa likiwafuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְרִיב
  choice: alipokaribia
  rationale: 'Hifili ya קרב hapa ina maana isiyo ya kusababisha: Farao mwenyewe alikaribia. Muundo huu ni wa kawaida katika Kiswahili na unadumisha mvutano wa simulizi.'
- source_word: וַיִּשְׂאוּ ... אֶת עֵינֵיהֶם
  choice: wakainua macho yao
  rationale: Inahifadhi nahau ya Kiebrania ya kuinua macho ili kutazama, huku ikibaki wazi na yenye kueleweka kwa msomaji wa Kiswahili.
- source_word: וְהִנֵּה
  choice: na kumbe
  rationale: ‘Kumbe’ huonyesha ugunduzi wa ghafula na mshangao katika simulizi la Kiswahili, hivyo inadumisha nguvu ya kihotuba ya וְהִנֵּה kwa lugha ya sasa.
- source_word: מִצְרַיִם
  choice: Wamisri
  rationale: Ingawa umbo la Kiebrania ni jina ‘Misri,’ hapa linatumika kwa maana ya pamoja likimaanisha jeshi au watu wa Misri waliokuwa wakifuata. ‘Wamisri’ ni tafsiri ya asili na iliyo wazi katika Kiswahili; maana halisi imeonyeshwa katika tanbihi.
- source_word: נֹסֵעַ אַחֲרֵיהֶם
  choice: walikuwa wakisonga nyuma yao
  rationale: ‘Wakisonga’ huonyesha mwendo unaoendelea wa kikosi, bila kuingiza kwa lazima kitenzi chenye matokeo zaidi cha ‘kuwafukuza.’ ‘Nyuma yao’ inawakilisha אַחֲרֵיהֶם.
- source_word: וַיִּירְאוּ מְאֹד
  choice: wakaogopa sana
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi kiwango kikubwa cha hofu kinachoonyeshwa na מְאֹד.
- source_word: וַיִּצְעֲקוּ ... אֶל
  choice: wakamlilia
  rationale: ‘Kumlilia’ huwasilisha kilio cha dhiki kinachoelekezwa kwa Mungu, na kiambishi ‘-m-’ kinaonyesha wazi anayeliliwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa kwa tahajia inayolingana na mfumo wa sauti na tahajia ya Kiswahili, badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inafuata kwa karibu usemi wa Kiebrania ‘wana wa Israeli’ na kuhifadhi matumizi yake ya kitaifa na ya pamoja. ‘Waisraeli’ limetolewa kama njia nyingine ya asili zaidi katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu, si cheo. ‘Yahwe’ hulihifadhi jina hilo kwa tahajia ya kawaida ya Kiswahili bila kulibadilisha kuwa ‘BWANA.’
- issue: Usemi wa pamoja wenye jinsia בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Kiebrania kinasema kihalisi ‘wana wa Israeli,’ usemi wa kitaifa unaotumika kwa kundi lote. Tafsiri kuu inahifadhi umbo hilo, huku tanbihi ikitaja ‘Waisraeli’ kama tafsiri nyingine ya kawaida.
- issue: Matumizi ya מִצְרַיִם kwa jeshi linalofuatilia
  choice: Wamisri
  alternative: Misri
  rationale: Jina la nchi linatumika kimajazi kwa watu au jeshi lake. Kiswahili cha kawaida huhitaji ‘Wamisri’ katika sentensi hii; tanbihi inahifadhi taarifa kwamba Kiebrania kina ‘Misri.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kumbe’ limetumiwa kuleta ugunduzi wa ghafula kwa njia ya asili, huku ‘wakainua macho yao’ ikidumisha ladha ya nahau ya chanzo. Sentensi imegawanywa ili simulizi lisomeke kwa urahisi bila kupoteza mfuatano wa vitendo vya Kiebrania.
