translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. “Magari ya vita” limetumiwa badala ya istilahi adimu zaidi ili maana ieleweke kwa urahisi. Alama ya tanbihi imewekwa baada ya kirai kinachohusu maofisa kwa sababu hapo ndipo sintaksia na istilahi ya Kiebrania vina utata.
