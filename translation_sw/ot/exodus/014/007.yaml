translation:
  language: sw
  text: Akachukua magari ya vita mia sita yaliyochaguliwa, na magari yote ya vita ya Misri, pamoja na maofisa juu ya magari hayo yote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na wasaidizi wa kijeshi wenye cheo juu ya magari hayo yote.” Neno la Kiebrania linaweza kumaanisha maofisa wa magari ya vita, makamanda, au wasaidizi wa kijeshi wenye cheo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Akachukua
  rationale: Muundo wa wayyiqtol unaendeleza mfululizo wa simulizi; kiambishi “Aka-” kinaonyesha tendo linalofuata kwa Kiswahili cha kawaida.
- source_word: שֵׁשׁ מֵאוֹת
  choice: mia sita
  rationale: Hii ni tafsiri ya moja kwa moja ya idadi.
- source_word: רֶכֶב
  choice: magari ya vita
  rationale: Katika muktadha huu neno linamaanisha magari ya kukokotwa yaliyotumiwa vitani; “magari ya vita” ni wazi na ya asili kwa wasomaji wa Kiswahili.
- source_word: בָּחוּר
  choice: yaliyochaguliwa
  rationale: Kivumishi hiki huonyesha yaliyochaguliwa kwa kusudi maalumu, yaani kikosi teule, bila kuongeza wazo lisilo wazi la ubora.
- source_word: וְכֹל רֶכֶב מִצְרָיִם
  choice: pamoja na magari yote ya vita ya Misri
  rationale: Kirai kinaonyesha jeshi lote la magari ya Misri lililoongezwa kwa yale mia sita yaliyochaguliwa.
- source_word: וְשָׁלִשִׁם
  choice: maofisa
  rationale: Hili ni neno la kijeshi linaloweza kumaanisha maofisa, makamanda wa magari ya vita, au wasaidizi wa kijeshi wenye cheo. “Maofisa” hudumisha maana pana katika matini.
- source_word: עַל כֻּלּוֹ
  choice: juu ya yote
  rationale: Ingawa kiambishi cha Kiebrania ni cha umoja wa kijumla, kirai kinaeleza maofisa waliowekwa juu ya kikosi chote cha magari.
