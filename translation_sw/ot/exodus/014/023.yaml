  text: The Egyptians pursued and went in after them into the midst of the sea—all Pharaoh’s horses[a], his chariots[b], and his horsemen.
translation:
  language: sw
  text: Wamisri wakawafuatilia, wakaingia baada yao ndani ya bahari—farasi wote wa Farao[a], magari yake ya vita, na wapanda-farasi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania hutumia “farasi” katika umoja kwa maana ya kundi: “farasi wote wa Farao.” Tafsiri imetumia wingi wa kawaida katika Kiswahili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: wakawafuatilia
  rationale: Kitenzi רדף kina maana ya kufuatilia au kufukuza; “wakawafuatilia” ni cha kawaida na kinafaa katika simulizi la kijeshi.
- source_word: מִצְרַיִם
  choice: Wamisri
  rationale: Ingawa neno linaweza kutaja nchi ya Misri au watu wake, kitenzi cha wingi na muktadha vinaonyesha watu, yaani jeshi la Misri.
- source_word: וַיָּבֹאוּ אַחֲרֵיהֶם
  choice: wakaingia baada yao
  rationale: בוא ni kitenzi kipana cha mwendo, na אַחֲרֵיהֶם huonyesha kuwafuata; kauli hii inahifadhi mfuatano wa kuingia kwao nyuma ya Waisraeli.
- source_word: כֹּל סוּס פַּרְעֹה
  choice: farasi wote wa Farao
  rationale: סוּס ni umoja unaotumiwa kwa maana ya kundi baada ya כֹּל; Kiswahili cha kawaida hutumia wingi “farasi wote.”
- source_word: רִכְבּוֹ
  choice: magari yake ya vita
  rationale: רכב hapa hutaja magari ya kukokotwa yaliyotumiwa vitani au kikosi chake; “magari ya vita” ni wazi kwa msomaji wa sasa.
- source_word: וּפָרָשָׁיו
  choice: na wapanda-farasi wake
  rationale: פָּרָשִׁים hutaja wapanda-farasi au askari wa farasi; chaguo hili linahifadhi picha halisi ya orodha ya kijeshi.
- source_word: אֶל תּוֹךְ הַיָּם
  choice: mpaka katikati ya bahari
  rationale: תּוֹךְ husisitiza sehemu ya ndani, si kuingia baharini tu; “mpaka katikati ya bahari” ni ya asili na huhifadhi msisitizo huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi wenye viunganishi vya mfuatano umehifadhiwa bila kufanya sentensi kuwa nzito. “Magari ya vita” limetumiwa badala ya “magari” pekee ili maana ya kijeshi iwe wazi.
