lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akasema
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Kisha” huonyesha hatua inayofuata, na “akasema” ni Kiswahili cha kawaida kwa דבר katika utangulizi wa usemi.
- source_word: יְהֹוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetolewa kwa umbo la Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo.
- source_word: אֶל
  choice: na
  rationale: Katika Kiswahili, “akasema na Musa” ni njia ya asili ya kuonyesha mtu aliyeelekezewa usemi; “kwa Musa” pia yawezekana lakini si ya kawaida sana katika muundo huu.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia na matumizi ya Kiswahili.
- source_word: לֵּאמֹר
  choice: akisema
  rationale: Huhifadhi fomula ya Kiebrania inayotanguliza maudhui ya usemi, ambayo yanafuata katika mstari unaofuata.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina lenyewe la Mungu, si cheo. “Yahwe” hulihifadhi kwa umbo linalotumika kwa kawaida katika Kiswahili, huku tanbihi ikionyesha konsonanti za Kiebrania na namna nyingine ya kulitaja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “akisema” umehifadhiwa kwa sababu mstari huu ni utangulizi wa moja kwa moja wa maneno yanayofuata.
