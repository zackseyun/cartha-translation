base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/021.yaml
  text: Then Moses stretched out his hand over the sea[a], and Yahweh drove the sea back by a strong east wind all night and made the sea dry land[d][c][b], and the waters were split.
translation:
  language: sw
  text: Kisha Musa akaunyosha mkono wake juu ya bahari, naye Yahwe akaifanya bahari irudi nyuma[a] kwa upepo mkali wa mashariki usiku kucha. Akaifanya bahari kuwa nchi kavu[b], na maji yakapasuliwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaiondoa bahari.” Kitenzi cha Kiebrania kiko katika umbo la kisababishi.
    reason: lexical_alternative
  - marker: b
    text: Au, “akaigeuza bahari kuwa ardhi kavu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “maji yakagawanyika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: akaunyosha
  rationale: Kitenzi נטה kinapotumiwa pamoja na ‘mkono’ humaanisha kuunyosha; ‘akaunyosha’ ni Kiswahili cha kawaida na kinahifadhi tendo la kimwili.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Huhifadhi nomino ya umoja na umilikaji ulio wazi katika Kiebrania.
- source_word: עַל הַיָּם
  choice: juu ya bahari
  rationale: עַל hapa inaeleza mahali au mwelekeo wa mkono ulionyoshwa; ‘juu ya bahari’ ni ya kawaida katika muktadha huu bila kulazimisha maana ya kugusa bahari.
- source_word: וַיּוֹלֶךְ יְהוָה אֶת הַיָּם
  choice: Yahwe akairudisha bahari
  rationale: Umbo la kisababishi la הלך linaonyesha kwamba Yahwe aliifanya bahari iondoke au irudi. ‘Akairudisha bahari’ linaeleza athari kwa Kiswahili cha kawaida bila kuongeza maelezo ya utaratibu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limewasilishwa kama jina binafsi ‘Yahwe’, badala ya kubadilishwa kuwa cheo.
- source_word: בְּרוּחַ קָדִים עַזָּה
  choice: kwa upepo mkali wa mashariki
  rationale: רוּחַ hapa ni ‘upepo’ kwa sababu umeelezwa kuwa wa mashariki na ndio njia iliyotumiwa; עַזָּה limetafsiriwa kwa kawaida kuwa ‘mkali’.
- source_word: כָּל הַלַּיְלָה
  choice: usiku kucha
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi muda wote unaokusudiwa na Kiebrania.
- source_word: וַיָּשֶׂם אֶת הַיָּם לֶחָרָבָה
  choice: akaifanya bahari kuwa nchi kavu
  rationale: חָרָבָה ni nchi au ardhi kavu. Tafsiri hii inahifadhi bahari kama shamirisho la kitenzi na matokeo yake kuwa nchi kavu.
- source_word: וַיִּבָּקְעוּ הַמָּיִם
  choice: maji yakapasuliwa
  rationale: Umbo la Niphal la בקע lina maana ya kupasuliwa au kugawanyika. ‘Yakapasuliwa’ linahifadhi umbo la kutendwa na taswira halisi ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo kama ‘Bwana’; ‘Yehova’ ni matamshi mengine ya kimapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa simulizi, wa heshima na unaoeleweka kwa msomaji wa kawaida. Viunganishi na mfuatano wa vitenzi huhifadhi mwendo wa simulizi la Kiebrania, huku sentensi mbili zikitumiwa ili tafsiri isomeke kwa urahisi.
