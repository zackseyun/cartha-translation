lexical_decisions:
- source_word: וַיֶּאְסֹר
  choice: akaifunga farasi kwenye gari lake
  rationale: Kitenzi אסר kimsingi humaanisha ‘kufunga’; katika muktadha wa gari la vita kinamaanisha kufunga farasi kwenye gari ili liwe tayari kuondoka. Usemi huu ni wa kawaida na unaonyesha tendo lenyewe.
- source_word: רִכְבּוֹ
  choice: gari lake
  rationale: Nomino ya umoja yenye kiambishi cha nafsi inaelekea kumaanisha gari la Farao mwenyewe, si magari yake yote ya vita.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: עַם kwa kawaida humaanisha ‘watu.’ Hapa huenda ni kikosi kilichoandamana na Farao, lakini matini haisemi wazi ‘jeshi lake,’ hivyo tafsiri inadumisha upana wa maana ya Kiebrania.
- source_word: לָקַח עִמּוֹ
  choice: akawachukua ... pamoja naye
  rationale: Hii inatoa kwa Kiswahili cha kawaida maana ya moja kwa moja ya ‘aliwachukua pamoja naye.’
