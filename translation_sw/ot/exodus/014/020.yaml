  text: וַ/יָּבֹ֞א בֵּ֣ין מַחֲנֵ֣ה מִצְרַ֗יִם וּ/בֵין֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יְהִ֤י הֶֽ/עָנָן֙ וְ/הַ/חֹ֔שֶׁךְ וַ/יָּ֖אֶר אֶת הַ/לָּ֑יְלָה וְ/לֹא קָרַ֥ב זֶ֛ה אֶל זֶ֖ה כָּל הַ/לָּֽיְלָה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/020.yaml
  text: And it came between the camp of Egypt and the camp of Israel[a], and there was the cloud and the darkness, yet it lit up the night; and the one did not come near the other all night.
translation:
  language: sw
  text: Ikaja[a] kati ya kambi ya Misri na kambi ya Israeli. Kukawa na wingu na giza, lakini ikauangaza usiku[b]; wala kambi moja haikukaribia nyingine usiku kucha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaja,” ikiwa kitenzi kinamrejelea malaika wa Mungu badala ya nguzo iliyotajwa katika mstari uliotangulia. Kiebrania kina kitenzi cha umoja na hakitaji tena mhusika kwa jina.
    reason: preserve_referential_ambiguity
  - marker: b
    text: Au, “kukawa na wingu na giza, lakini likatoa mwanga wakati wa usiku.” Kiebrania ni kifupi, na matoleo ya kale pamoja na tafsiri mbalimbali hutofautiana kuhusu jinsi giza na mwanga vilivyohusiana na kambi hizo mbili.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ikaja
  rationale: Kitenzi kinaeleza mwendo wa kile kilichotajwa katika muktadha uliotangulia. Kiambishi cha ngeli ya I kinaweza kueleweka kwa kurejelea nguzo, lakini nomino haijaongezwa katika matini ili kuepuka kufunga kabisa uwezekano wa kurejelea malaika wa Mungu.
- source_word: בֵּין ... וּבֵין
  choice: kati ya ... na ...
  rationale: Hii ndiyo njia ya kawaida na ya asili ya Kiswahili ya kuonyesha mahali baina ya pande mbili.
- source_word: מַחֲנֵה מִצְרַיִם ... מַחֲנֵה יִשְׂרָאֵל
  choice: kambi ya Misri ... kambi ya Israeli
  rationale: Inahifadhi muundo wa Kiebrania wa 'kambi ya' pamoja na majina Misri na Israeli bila kuyabadilisha kuwa 'Wamisri' na 'Waisraeli'.
- source_word: וַיְהִי הֶעָנָן וְהַחֹשֶׁךְ
  choice: Kukawa na wingu na giza
  rationale: Muundo wa kuwepo ni wa asili katika Kiswahili na unahifadhi uunganishaji mfupi wa wingu na giza katika Kiebrania.
- source_word: וַיָּאֶר אֶת־הַלָּיְלָה
  choice: lakini ikaangaza usiku
  rationale: Kitenzi אור hapa kina maana ya kutoa mwanga au kuangaza. 'Lakini' huonyesha utofauti unaodokezwa kati ya giza na kuangazwa, huku 'usiku' ukibaki kile kinachoangazwa.
- source_word: וְלֹא קָרַב זֶה אֶל־זֶה
  choice: wala kambi moja haikukaribia nyingine
  rationale: Nahau ya Kiebrania yenye maana ya pande mbili kutokaribiana imefafanuliwa kwa kawaida kama kambi moja na nyingine.
- source_word: כָּל־הַלָּיְלָה
  choice: usiku kucha
  rationale: Ni usemi wa kawaida wa Kiswahili unaomaanisha muda wote wa usiku.
theological_decisions:
- issue: Kirejelewa cha vitenzi vya umoja katika mstari
  choice: Kutumia “ikaja” na “ikaangaza” bila kutaja tena nomino katika matini kuu
  alternative: Kutaja wazi “nguzo” au kutumia “akaja” kwa kumrejelea malaika wa Mungu
  rationale: Muktadha uliotangulia unataja malaika wa Mungu na nguzo ya wingu. Kiebrania kinaacha nafasi ya kuhusisha kitendo na udhihirisho huo bila kulazimisha utambulisho mmoja; Kiswahili kinahitaji upatanisho wa ngeli, kwa hiyo matini inafuata kwa karibu nguzo iliyotajwa katika muktadha huku tanbihi ikihifadhi uwezekano mwingine.
- issue: Uhusiano wa wingu, giza, na mwanga kwa kambi mbili
  choice: Kuwasilisha wingu na giza kisha utofauti wa kuangaza usiku
  alternative: Kueleza kwamba upande mmoja ulikuwa na giza na upande mwingine ulikuwa na mwanga
  rationale: Kiebrania ni kifupi na kinaweza kufasiriwa kwa zaidi ya namna moja. Matini kuu haiongezi mgawanyo wa wazi kati ya kambi, ambao haujasemwa moja kwa moja katika maandishi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. “Usiku kucha” ni wa sasa na wa kawaida bila kupunguza uzito wa matini. Muundo mfupi wa Kiebrania umehifadhiwa kadiri sarufi ya Kiswahili inavyoruhusu.
