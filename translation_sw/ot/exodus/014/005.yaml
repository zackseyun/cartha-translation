  text: וַ/יֻּגַּד֙ לְ/מֶ֣לֶךְ מִצְרַ֔יִם כִּ֥י בָרַ֖ח הָ/עָ֑ם וַ֠/יֵּהָפֵךְ לְבַ֨ב פַּרְעֹ֤ה וַ/עֲבָדָי/ו֙ אֶל הָ/עָ֔ם וַ/יֹּֽאמרוּ֙ מַה זֹּ֣את עָשִׂ֔ינוּ כִּֽי שִׁלַּ֥חְנוּ אֶת יִשְׂרָאֵ֖ל מֵ/עָבְדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/005.yaml
  text: It was reported to the king of Egypt that the people had fled[a], and the heart of Pharaoh and his servants was turned against the people, and they said, “What is this we have done[b], that we have let Israel go from serving us?”
translation:
  language: sw
  text: Mfalme wa Misri akaambiwa kwamba watu walikuwa wamekimbia, na moyo wa Farao na watumishi wake ukabadilika dhidi ya watu hao[a]. Wakasema, “Tumefanya nini hivi, kuwaacha Waisraeli waende wasitutumikie tena[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moyo wa Farao na watumishi wake ukawageukia watu hao,” au “nia ya Farao na watumishi wake ikabadilika kuelekea watu hao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuwaachilia Waisraeli kutoka katika utumishi wetu,” au “kutoka kuwa watumwa wetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְמֶלֶךְ מִצְרַיִם
  choice: Mfalme wa Misri akaambiwa
  rationale: Kauli tendwa ya Kiebrania inaacha mtoa habari bila kutajwa; Kiswahili hiki kinadumisha mtindo huo kwa njia ya kawaida.
- source_word: כִּי בָרַח הָעָם
  choice: kwamba watu walikuwa wamekimbia
  rationale: Kitenzi ברח humaanisha kukimbia au kutoroka; wakati uliotumika unaonyesha kwamba tukio hilo lilikuwa limetokea kabla ya taarifa kufikishwa.
- source_word: וַיֵּהָפֵךְ לְבַב פַּרְעֹה וַעֲבָדָיו אֶל הָעָם
  choice: ndipo moyo wa Farao na watumishi wake ukabadilika kuhusu watu hao
  rationale: Neno 'moyo' linahifadhi taswira ya לְבַב kama kitovu cha fikira na nia. 'Kuhusu' hudumisha uwezekano wa kuelewa אֶל kama mwelekeo wa mtazamo, huku muktadha ukionyesha kuwa badiliko hilo lilikuwa la uhasama.
- source_word: מַה זֹּאת עָשִׂינוּ
  choice: Tumefanya nini hivi
  rationale: Kauli hii ya kawaida ya Kiswahili inawasilisha mshangao na majuto ya swali la Kiebrania lenye kiulizi pamoja na kiashiria.
- source_word: כִּי שִׁלַּחְנוּ אֶת יִשְׂרָאֵל מֵעָבְדֵנוּ
  choice: kuwaacha Waisraeli waende wasitutumikie tena
  rationale: שׁלח hapa ni kuwaacha waende au kuwaachilia, na מֵעָבְדֵנוּ inaeleza kukoma kwao kuwatumikia Wamisri. 'Wasitutumikie tena' ni Kiswahili cha kawaida bila kuongeza moja kwa moja neno 'watumwa'.
theological_decisions:
- issue: Maana ya kiantropolojia ya לְבַב
  choice: moyo
  alternative: nia au mawazo
  rationale: Neno 'moyo' linahifadhi sitiari ya Kiebrania na upana wake wa fikira, mapenzi na nia bila kuipunguza kuwa dhana moja ya kisaikolojia.
- issue: Mwelekeo wa badiliko katika אֶל הָעָם
  choice: kuhusu watu hao
  alternative: dhidi ya watu hao
  rationale: Muktadha unaonyesha uhasama, lakini kihusishi chenyewe kinaweza kueleza mwelekeo kuelekea au kuhusu watu. Tafsiri kuu hailazimishi maana ya 'dhidi ya,' na tanbihi inaibainisha.
- issue: Hali ya Israeli katika מֵעָבְדֵנוּ
  choice: wasitutumikie tena
  alternative: waache kuwa watumwa wetu
  rationale: Muktadha mpana unaonyesha utumwa wa kulazimishwa, lakini kifungu hiki chenyewe kinazungumzia kutumikia. Tafsiri inabaki karibu na maneno ya chanzo bila kuficha maana inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Waisraeli' limetumiwa kwa maana ya watu wa Israeli ili sentensi iwe ya kawaida; muundo wa umoja 'moyo ... ukabadilika' unafuata sitiari na sarufi ya chanzo.
