  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּשְׁקֵ֤ף יְהוָה֙ אֶל מַחֲנֵ֣ה מִצְרַ֔יִם בְּ/עַמּ֥וּד אֵ֖שׁ וְ/עָנָ֑ן וַ/יָּ֕הָם אֵ֖ת מַחֲנֵ֥ה מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/024.yaml
  text: And in the morning watch[a], Yahweh looked down on the camp of the Egyptians through the pillar of fire and cloud[b], and threw the camp of the Egyptians into confusion.
translation:
  language: sw
  text: Ikawa, katika zamu ya alfajiri, Yahwe akaitazama chini kambi ya Wamisri kutoka katika nguzo ya moto na wingu[a], akaitia kambi ya Wamisri katika mchafuko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia nguzo ya moto na wingu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akaifanya kambi ya Wamisri ipatwe na hofu na taharuki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: wakati wa zamu ya alfajiri
  rationale: Kirai hiki kinataja zamu ya mwisho ya ulinzi wa usiku, wakati alfajiri inapokaribia; tafsiri hii inadumisha umahususi wa wakati kwa Kiswahili cha kawaida.
- source_word: וַיַּשְׁקֵף
  choice: akalitazama
  rationale: Kitenzi kinaonyesha kutazama kutoka mahali pa juu au kutoka ndani kuelekea walengwa. Muktadha wa nguzo unaonyesha mahali alikotazamia Yahwe bila kulazimisha neno lisilo la kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa namna inayotamkika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: מַחֲנֵה מִצְרַיִם
  choice: jeshi la Wamisri
  rationale: Ingawa מַחֲנֶה kimsingi ni kambi, hapa kwa metonimia linawahusu wanajeshi wa Misri waliokuwa kambini; ‘jeshi la Wamisri’ ni wazi na la kawaida katika Kiswahili, huku wazo la kambi likibaki katika muktadha.
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  choice: kutoka ndani ya nguzo ya moto na wingu
  rationale: בְּ inaweza kueleza mahali au njia. ‘Kutoka ndani ya’ inalingana na taswira ya Yahwe kutazama akiwa katika nguzo, huku uwezekano wa ‘kupitia’ ukihifadhiwa katika tanbihi.
- source_word: וַיָּהָם
  choice: akalitia ... katika vurugu
  rationale: Kitenzi cha kusababisha kina maana ya kuleta mchafuko, taharuki, au vurugu. ‘Kulitia katika vurugu’ huhifadhi nguvu ya kisababishi bila kudai kwamba jeshi lilikuwa tayari limeshindwa kabisa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, na lina umbo linalofaa matamshi ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Zamu ya alfajiri’ huepuka maelezo marefu, na ‘vurugu’ huhifadhi upana wa maana ya הום.
