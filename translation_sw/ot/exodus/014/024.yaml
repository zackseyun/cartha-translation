  naturalness: “Katika zamu ya alfajiri” ni fupi na ya kawaida zaidi kuliko “wakati wa zamu ya alfajiri.” “Kuleta ... mchafuko” ni usemi wa asili unaowasilisha vyema athari ya kitenzi cha kisababishi.
  terminology: “Yahwe” huhifadhi jina la binafsi יהוה kwa umbo linalosomeka kwa Kiswahili. “Nguzo ya moto na wingu” na “kambi ya Wamisri” ni sahihi na za kiwango cha kisimulizi.
