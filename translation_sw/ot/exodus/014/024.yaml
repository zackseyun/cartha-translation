  to: Ikawa, katika zamu ya alfajiri, Yahwe akaitazama chini kambi ya Wamisri kutoka katika nguzo ya moto na wingu[a], akaitia kambi ya Wamisri katika mchafuko[b].
  rationale: Tafsiri imerekebishwa ili iakisi kwa karibu zaidi “kambi” (מַחֲנֶה), mwelekeo wa kutazama wa וַיַּשְׁקֵף, na nguvu ya kisababishi ya וַיָּהָם. “Kutoka katika” hudumisha usomaji wa mahali unaowezekana wa בְּ, huku “kupitia” ikihifadhiwa katika tanbihi kama mbadala. Tanbihi zimewekwa kwenye kauli zinazohusika.
