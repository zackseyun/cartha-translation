base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/013.yaml
  text: And Moses said to the people, “Do not fear. Stand firm, and see the salvation of the LORD, which he will accomplish for you today; for the Egyptians whom you see today, you will never see again forever.”
translation:
  language: sw
  text: Musa akawaambia watu, “Msiogope. Simameni imara, mkauone wokovu wa BWANA atakaowatendea leo; kwa maana hao Wamisri mnaowaona leo, hamtawaona tena kamwe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: Msiogope
  rationale: Amri ya kukataza hofu imetafsiriwa moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: הִתְיַצְבוּ
  choice: Simameni imara
  rationale: Kitenzi kina maana ya kujiweka au kusimama mahali kwa uthabiti; tafsiri hii inaonyesha kutokimbia na kudumu bila kuongeza wazo lisilokuwamo.
- source_word: יְשׁוּעַת יְהוָה
  choice: wokovu wa BWANA
  rationale: יְשׁוּעָה hapa ni tendo la Mungu la kuwaokoa hatarini. Jina la agano יהוה limewakilishwa kwa desturi ya herufi kubwa ‘BWANA’.
- source_word: יַעֲשֶׂה לָכֶם
  choice: atakaowatendea
  rationale: Muundo huu unadumisha wazo la jambo ambalo BWANA atafanya kwa ajili yao, kwa mtiririko wa asili wa Kiswahili.
- source_word: לֹא תֹסִיפוּ לִרְאֹתָם עוֹד עַד עוֹלָם
  choice: hamtawaona tena kamwe
  rationale: Nahau ya Kiebrania ya kutoendelea kuwaona tena hadi milele imewasilishwa kwa Kiswahili cha kawaida chenye mkazo uleule wa mwisho kabisa.
theological_decisions:
- issue: Mhusika wa wokovu
  choice: wokovu wa BWANA atakaowatendea leo
  alternative: wokovu ambao BWANA atawawezesha kuupata leo
  rationale: Chanzo kinamweka BWANA mwenyewe kuwa mtendaji; hakisemi kwamba watu watajipatia wokovu kwa msaada wake.
- issue: Upeo wa ‘kamwe’
  choice: hao Wamisri mnaowaona leo, hamtawaona tena kamwe
  alternative: hamtawaona tena kwa njia hii
  rationale: Tafsiri inadumisha kauli pana na yenye mkazo ya עַד עוֹלָם bila kuibana kwa ufafanuzi wa kitheolojia au kihistoria ambao haujatamkwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa msomaji wa kawaida huku ikihifadhi urudiaji wa ‘leo’ na msisitizo wa mwisho wa maandishi ya Kiebrania.
