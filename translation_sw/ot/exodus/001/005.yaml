translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imedumisha taswira ya mwili katika nahau ya Kiebrania, lakini imetumia ‘kiuno’ katika matini kuu kwa uelewekevu wa kawaida; maana halisi zaidi ‘paja’ imewekwa katika tanbihi.
