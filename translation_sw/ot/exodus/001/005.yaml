  yaml_path: translation/ot/exodus/001/005.yaml
  text: And all the persons who came from Jacob’s loins were seventy persons[a], and Joseph was already in Egypt.
translation:
  language: sw
  text: Watu wote waliotoka katika kiuno cha Yakobo walikuwa sabini[a], naye Yosefu alikuwa tayari Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa maana halisi, “waliotoka katika paja la Yakobo.” Hii ni nahau inayomaanisha wazao wake wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כָּל נֶפֶשׁ ... שִׁבְעִים נָפֶשׁ
  choice: Watu wote ... walikuwa sabini
  rationale: Katika muktadha huu נֶפֶשׁ ni neno la kuhesabia watu, si rejeo la kiufundi kwa ‘nafsi.’ Muundo huu unawasilisha kwa Kiswahili cha kawaida jumla ya watu sabini huku ukihifadhi nguvu ya כָּל.
- source_word: יֹצְאֵי יֶרֶךְ יַעֲקֹב
  choice: waliotoka katika kiuno cha Yakobo
  rationale: Huhifadhi taswira halisi ya nahau ya Kiebrania, ambayo inawataja wazao wa moja kwa moja wa Yakobo. ‘Kiuno’ ni cha asili na chenye heshima zaidi katika Kiswahili kuliko tafsiri ya moja kwa moja ‘paja,’ huku tanbihi ikifafanua nahau hiyo.
- source_word: שִׁבְעִים
  choice: sabini
  rationale: Ni tafsiri ya moja kwa moja ya idadi ya Kiebrania.
- source_word: וְיוֹסֵף
  choice: naye Yosefu
  rationale: ‘Naye’ huunganisha kauli ya ziada kwa kawaida katika simulizi la Kiswahili na kudumisha kiunganishi cha Kiebrania bila kumwingiza Yosefu kisiri katika kirai cha hesabu.
- source_word: הָיָה בְמִצְרָיִם
  choice: alikuwa tayari Misri
  rationale: ‘Tayari’ huonyesha kwamba Yosefu alikuwapo Misri kabla ya wakati unaosimuliwa. Kiswahili hakihitaji ‘katika’ mbele ya jina la nchi katika matumizi haya.
