base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/019.yaml
  text: The midwives said to Pharaoh[a], “Because the Hebrew women are not like the Egyptian women, for they are vigorous; before the midwife comes to them, they have given birth.”
translation:
  language: sw
  text: Wakunga wakamwambia Farao, “Wanawake Waebrania si kama wanawake Wamisri, kwa maana wao ni wenye nguvu[a]; kabla mkunga hajafika kwao, tayari wamejifungua.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wachangamfu” au “wenye afya na nguvu.” Neno la Kiebrania linaweza kusisitiza uimara na wepesi wao katika kujifungua. Wengine hulielewa kwa maana ya moja kwa moja zaidi kuwa “kama wanyama,” lakini maana hiyo si wazi kabisa hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: wakamwambia
  rationale: Kitenzi cha masimulizi cha kusema, pamoja na אֶל־פַּרְעֹה, kinatafsiriwa kwa Kiswahili cha kawaida kama ‘wakamwambia Farao’.
- source_word: הַמְיַלְּדֹת
  choice: wakunga
  rationale: Hili ni jina la kawaida la Kiswahili kwa wanawake wanaosaidia katika kujifungua, na linafaa katika muktadha huu.
- source_word: אֶל־פַּרְעֹה
  choice: Farao
  rationale: אֶל huonyesha anayeelekezewa maneno; ‘Farao’ ndiyo namna iliyozoeleka ya jina hili katika Kiswahili.
- source_word: כִּי לֹא כַנָּשִׁים הַמִּצְרִיֹּת הָעִבְרִיֹּת
  choice: Wanawake Waebrania si kama wanawake Wamisri
  rationale: Muundo huu unahifadhi ulinganisho na tofauti iliyosisitizwa, huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: חָיוֹת
  choice: wenye nguvu
  rationale: Katika muktadha, neno linaweza kueleza uchangamfu, uimara, au wepesi wa kujifungua. ‘Wenye nguvu’ ni wazi na lenye heshima bila kulazimisha maana ya ‘kama wanyama’.
- source_word: בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת
  choice: kabla mkunga hajawafikia
  rationale: בטרם huonyesha tendo linalotangulia jingine; umoja wa ‘mkunga’ umetumiwa kwa maana ya jumla.
- source_word: וְיָלָדוּ
  choice: huwa tayari wamejifungua
  rationale: Kauli inaeleza kwamba kujifungua huwa kumekamilika kabla ya kufika kwa mkunga; ‘tayari wamejifungua’ huonyesha wazi mpangilio huo wa matukio.
