  text: These are the names of the sons of Israel who came to Egypt with Jacob[a], each man with his household.
translation:
  language: sw
  text: Haya ndiyo majina ya wana wa Israeli waliokuja Misri pamoja na Yakobo, kila mmoja akiwa na kaya yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na haya ndiyo majina.” Kiebrania kinaanza kwa kiunganishi kinachounganisha kitabu cha Kutoka na simulizi lililotangulia katika Mwanzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Haya ndiyo
  rationale: Kiunganishi וְ kinaunganisha simulizi hili na lililotangulia, lakini Kiswahili cha kawaida hakihitaji kuanza kwa “Na” hapa. “Haya ndiyo” hutambulisha orodha kwa njia ya asili na yenye heshima.
- source_word: שְׁמוֹת
  choice: majina
  rationale: Tafsiri ya moja kwa moja inayodumisha pia uhusiano na jina la Kiebrania la kitabu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: “Wana” huonyesha kwa usahihi wana wa kiume wanaotajwa hapa, badala ya maana pana ya watoto au wazao.
- source_word: הַבָּאִים
  choice: waliokuja
  rationale: Ingawa ni umbo la participle, hapa hutambulisha kundi kwa kurejelea tukio la wakati uliopita; kishazi rejeshi ni cha asili katika Kiswahili.
- source_word: מִצְרָיְמָה
  choice: Misri
  rationale: Kiambishi elekezi cha Kiebrania kinaonyesha mwendo kuelekea Misri; katika Kiswahili kitenzi “kuja” pamoja na jina la mahali hutoa maana hiyo kwa kawaida bila kihusishi cha ziada.
- source_word: אֵת יַעֲקֹב
  choice: pamoja na Yakobo
  rationale: אֵת hapa huonyesha ushirika, si alama ya yambwa; “pamoja na” huwasilisha maana hiyo wazi.
- source_word: אִישׁ וּ/בֵית/וֹ
  choice: kila mmoja akiwa na watu wa nyumba yake
  rationale: אִישׁ ina maana ya mgawanyo, yaani kila mmoja wao, na בַּיִת hapa ni jamaa au kaya, si jengo pekee. “Watu wa nyumba yake” ni usemi unaoeleweka na unaodumisha picha ya nyumba.
- source_word: בָּאוּ
  choice: imewakilishwa ndani ya “waliokuja”
  rationale: Kiebrania hurudia wazo la kuja mwishoni mwa sentensi baada ya kishazi cha mgawanyo. Kulirudia kama “walikuja” kungekuwa kizito katika Kiswahili; kishazi “waliokuja” kinawakilisha tendo lote bila kupoteza maana ya kisemantiki.
