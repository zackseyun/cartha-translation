- from: Njooni, tuwatendee kwa hila[a], wasije wakaongezeka; na vita vikitokea, wao pia wanaweza kujiunga na adui zetu, wakapigana nasi, kisha wakaondoka nchini[b].
  to: Haya, tuwatendee kwa hila[a], wasije wakaongezeka; na vita vikitokea, wao pia watajiunga na adui zetu, watapigana nasi, na watatoka nchini[b].
  rationale: The revision uses an idiomatic deliberative opening, renders the conditional consequences as expected future actions rather than mere ability, and removes an unnecessarily explicit sequential connective. The notes now accurately represent the lexical alternative for the policy verb and preserve the literal wording of the final Hebrew clause without over-interpreting it.
