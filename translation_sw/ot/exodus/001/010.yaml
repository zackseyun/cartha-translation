base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/010.yaml
  text: Come[a], let us deal shrewdly with them, lest they multiply, and if war breaks out[c][b], they too may join our enemies and fight against us and go up out of the land.
translation:
  language: sw
  text: Haya, tuwatendee kwa hila[a], wasije wakaongezeka; na vita vikitokea, wao pia watajiunga na adui zetu, watapigana nasi, na watatoka nchini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tuwatendee kwa hekima” au “kwa busara.” Neno la Kiebrania linaweza kumaanisha kutenda kwa hekima au kwa ujanja; hapa muktadha unaonyesha mpango wa hila wa kisiasa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “watapanda kutoka katika nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Njooni
  rationale: Kiingizi cha kuhimiza hatua ya pamoja; “Njooni” ni cha kawaida na huhifadhi wito wa kuchukua hatua mara moja.
- source_word: נִתְחַכְּמָה
  choice: tuwatendee kwa hila
  rationale: Katika muktadha huu kitenzi kinaonyesha kupanga kwa ujanja wa kisiasa dhidi ya tishio linalodhaniwa, si hekima yenye sifa njema.
- source_word: לוֹ
  choice: tuwatendee
  rationale: Kiwakilishi cha Kiebrania ni umoja lakini kinarejelea Israeli kama jamii; Kiswahili hutumia ngeli ya watu kwa maana ya wengi.
- source_word: פֶּן יִרְבֶּה
  choice: wasije wakaongezeka
  rationale: Muundo huu wa Kiswahili unaonyesha matokeo yanayohofiwa na yanayotakiwa kuzuiwa; wingi unafaa kwa watu wa Israeli kama kundi.
- source_word: וְהָיָה כִּי תִקְרֶאנָה מִלְחָמָה
  choice: na vita vikitokea
  rationale: Huhifadhi hali ya uwezekano na ni usemi wa asili wa Kiswahili kuhusu kuanza kwa vita.
- source_word: וְנוֹסַף גַּם הוּא עַל שֹׂנְאֵינוּ
  choice: wao pia wanaweza kujiunga na adui zetu
  rationale: Kitenzi pamoja na kihusishi chake humaanisha kujiongeza au kujiunga na upande fulani; “wanaweza” huonyesha tukio linalohofiwa bila kulifanya kuwa hakika.
- source_word: וְנִלְחַם בָּנוּ
  choice: wakapigana nasi
  rationale: Ni usemi wazi na wa kawaida unaoonyesha mapambano dhidi ya Wamisri.
- source_word: וְעָלָה מִן הָאָרֶץ
  choice: kisha wakaondoka nchini
  rationale: “Wakaondoka nchini” hutoa maana ya kutoka katika nchi kwa Kiswahili cha kawaida; picha halisi ya “kupanda kutoka” imeelezwa katika tanbihi kwa sababu inaweza pia kuhifadhiwa kwa tafsiri ya karibu zaidi.
theological_decisions:
- issue: Maana ya וְעָלָה מִן הָאָרֶץ
  choice: wakaondoka nchini
  alternative: wakapanda kutoka nchini
  rationale: Kitenzi kina maana halisi ya “kupanda,” lakini katika muktadha huu kishazi kinaweza kumaanisha kuondoka nchini. Tafsiri kuu ni ya kawaida bila kuficha umbo halisi, ambalo limehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mfululizo wa hofu za Farao na rejeo la Israeli kama jamii ya watu wengi. “Adui” limetumika katika umbo lisilobadilika la wingi linaloamuliwa na “zetu.”
