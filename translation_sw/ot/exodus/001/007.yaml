  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל פָּר֧וּ וַֽ/יִּשְׁרְצ֛וּ וַ/יִּרְבּ֥וּ וַ/יַּֽעַצְמ֖וּ בִּ/מְאֹ֣ד מְאֹ֑ד וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ אֹתָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/007.yaml
  text: But the sons of Israel were fruitful and swarmed and multiplied and became exceedingly strong[b][a], so that the land was filled with them.
translation:
  language: sw
  text: Lakini[a] wana wa Israeli walizaa sana, wakaongezeka kwa wingi[b], wakazidi kuwa wengi, wakawa na nguvu mno; nchi ikajaa nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na wana wa Israeli”; kiunganishi cha Kiebrania kinaweza kutafsiriwa tu “na,” lakini “lakini” kinaonyesha tofauti na mstari uliotangulia.
    reason: alternative_reading
  - marker: b
    text: Kitenzi cha Kiebrania huleta picha ya viumbe wanaojaa au kusongamana kwa wingi sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Lakini wana wa Israeli
  rationale: Neno kwa neno ni ‘wana wa Israeli,’ usemi wa Kiebrania unaowasilisha watu kama ukoo wa Israeli. ‘Lakini’ linaonyesha tofauti na kifo cha kizazi kilichotajwa katika mstari uliotangulia, ingawa kiunganishi kinaweza pia kutafsiriwa ‘Na.’
- source_word: פָּרוּ
  choice: walizaa sana
  rationale: Kitenzi פרה huonyesha kuzaa na kuwa na uzao mwingi. ‘Walizaa sana’ ni Kiswahili cha kawaida kinachohifadhi wazo la uzaaji na mwangwi unaowezekana wa lugha ya baraka katika Mwanzo.
- source_word: וַיִּשְׁרְצוּ
  choice: wakaongezeka kwa wingi
  rationale: Kitenzi שׁרץ huleta picha ya kusongamana au kujaa kwa viumbe vingi. Kwa watu, ‘wakaongezeka kwa wingi’ huwasilisha ongezeko hilo kubwa kwa lugha ya asili bila kuwafananisha moja kwa moja na wadudu.
- source_word: וַיִּרְבּוּ
  choice: wakazidi kuwa wengi
  rationale: Kitenzi רבה kinamaanisha kuwa wengi au kuongezeka. Chaguo hili linahifadhi hatua nyingine katika mlolongo wa msisitizo wa Kiebrania.
- source_word: וַיַּעַצְמוּ
  choice: kuwa na nguvu
  rationale: Kitenzi עצם hapa kimsingi huonyesha kuwa hodari au wenye nguvu. Muktadha unaweza kuhusisha nguvu inayotokana na idadi, lakini tafsiri haibadilishi maana kuwa wingi pekee.
- source_word: בִּמְאֹד מְאֹד
  choice: nyingi mno
  rationale: Kurudiwa kwa מְאֹד ni msisitizo mkali. ‘Nyingi mno’ pamoja na ‘nguvu’ ni usemi wa kawaida wa Kiswahili unaohifadhi kiwango hicho cha msisitizo.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֹתָם
  choice: nchi ikajaa wao
  rationale: Muundo wa Kiebrania unaifanya nchi kuwa kiima kilichojazwa nao. ‘Nchi’ inafaa kuliko ‘dunia’ kwa kuwa hapa ni eneo walimoishi; kiunganishi ‘ika-’ kinadumisha mfuatano wa matokeo bila kuongeza uhusiano wa kisababishi usio wazi kabisa.
theological_decisions:
- issue: Mwangwi unaowezekana wa lugha ya uumbaji na baraka katika Mwanzo
  choice: Kuhifadhi lugha ya kuzaa na kuongezeka bila kueleza mwangwi huo ndani ya mstari
  alternative: Kuongeza maneno ya ufafanuzi yanayotaja baraka au agizo la uumbaji
  rationale: Msamiati wa Kiebrania huenda ukarejelea lugha ya awali ya baraka, lakini tafsiri inapaswa kuruhusu mwangwi huo usikike kupitia uchaguzi wa maneno bila kuongeza dai ambalo mstari wenyewe hautamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mlolongo wa vitenzi umehifadhiwa ili kuonyesha mrundikano na msisitizo wa asili. Usemi ‘wana wa Israeli’ umeachwa kama jina la kifamilia na kitaifa la Kiebrania; tanbihi zote zimewekewa alama katika matini kuu.
