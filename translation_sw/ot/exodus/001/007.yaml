    reason: alternative_reading
  - marker: b
    text: Kitenzi cha Kiebrania huleta picha ya viumbe wanaojaa au kusongamana kwa wingi sana.
    reason: lexical_alternative
  revision_rationale: Correction is needed for the Swahili object construction in the final clause and for transparent placement of both existing footnote anchors. No theological or interpretive expansion has been introduced; the Hebrew's cumulative wording and emphasis are retained.
