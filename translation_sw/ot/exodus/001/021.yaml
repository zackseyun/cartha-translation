  yaml_path: translation/ot/exodus/001/021.yaml
  text: And because the midwives feared God[a], he made households for them.
translation:
  language: sw
  text: Kwa kuwa wakunga walimcha Mungu, akawafanyia nyumba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa maana ya karibu zaidi: “akawafanyia nyumba.” Hapa “nyumba” huenda ikamaanisha kaya au familia alizowaanzishia, wala si majengo ya kuishi tu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Ikawa, kwa sababu
  rationale: Muundo huu unaonyesha hali na uhusiano wa sababu. “Ikawa, kwa sababu” unadumisha ladha ya simulizi ya Kiebrania huku ukiwa wazi katika Kiswahili.
- source_word: יָרְאוּ
  choice: walimcha
  rationale: Kitenzi ירא katika muktadha wa Mungu hubeba maana ya hofu yenye heshima. “Kumcha Mungu” ni usemi wa kawaida na wenye uzito wa kibiblia katika Kiswahili.
- source_word: הַמְיַלְּדֹת
  choice: wakunga
  rationale: Hili ni jina linalowarejelea wanawake waliotajwa tayari ambao waliwasaidia wajawazito kujifungua. “Wakunga” ni neno la kawaida la Kiswahili sanifu.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Ingawa nomino ya Kiebrania ina kibainishi, hapa inamrejelea Mungu kwa namna ya kawaida; “Mungu” ndiyo tafsiri ya asili katika Kiswahili.
- source_word: וַיַּעַשׂ
  choice: akawajengea
  rationale: עשה kwa msingi ni ‘kufanya,’ lakini pamoja na בָּתִּים inaweza kueleza kuanzishwa kwa nyumba au familia. “Akawajengea” inadumisha sitiari ya kujenga na kuruhusu yambwa ‘familia’ kueleza maana inayowezekana.
- source_word: לָהֶם
  choice: wa-
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya tatu wingi na kinawarejelea wakunga. Kiswahili hutumia ngeli ya watu, hivyo “wa-” ni rejeo la wazi na la asili.
- source_word: בָּתִּים
  choice: familia
  rationale: Neno hili kihalisi ni ‘nyumba,’ lakini katika muktadha linaweza kumaanisha kaya, familia, au ukoo ulioimarishwa. “Familia” huwasilisha maana inayowezekana ya baraka ya Mungu bila kuelekeza msomaji kwanza kwenye majengo; maana halisi imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya Mungu kuwafanyia wakunga ‘nyumba’
  choice: Mungu aliwajengea au aliwaimarishia familia.
  alternative: Mungu aliwajengea nyumba za kuishi.
  rationale: Kirai cha Kiebrania עשה ... בתים kinaweza kumaanisha kuanzisha kaya au familia, si lazima kujenga majengo. Muktadha unaelekea kwenye baraka ya Mungu kwa wakunga, lakini tanbihi inadumisha maana halisi na utata uliopo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. Usemi “kumcha Mungu” umehifadhiwa kwa sababu ni wa asili katika Kiswahili na hubeba wazo la hofu yenye heshima.
