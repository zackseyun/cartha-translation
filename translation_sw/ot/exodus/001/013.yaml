  text: Wamisri wakawalazimisha wana wa Israeli[a] kufanya kazi kwa ukatili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli,” au kwa usemi wa jadi, “watoto wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “bila huruma” au “kwa ukali.” Neno la Kiebrania linaonyesha ukali wa kukandamiza katika kazi ya kulazimishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִדוּ
  choice: wakawalazimisha ... kufanya kazi
  rationale: Hifili ya עבד ina maana ya kusababisha au kulazimisha watu watumikie/wafanye kazi. Kauli hii inaonyesha nguvu ya kisababishi na hali ya kazi ya kulazimishwa bila kutegemea neno pana zaidi ‘kuwafanya watumwa’.
- source_word: מִצְרַיִם
  choice: Wamisri
  rationale: Katika muktadha huu neno linawataja watu wa Misri wanaotenda, si nchi yenyewe.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi muundo wa kifamilia na maana ya jamii nzima iliyo katika Kiebrania; katika matumizi haya ‘wana’ ni jina la ukoo/jamii, si watoto wadogo pekee.
- source_word: בְּפָרֶךְ
  choice: kwa ukatili
  rationale: Neno linaonyesha namna kali, isiyo na huruma na yenye kuponda katika kazi ya kulazimishwa. ‘Kwa ukatili’ ni Kiswahili cha sasa na cha kawaida kinachobeba uzito huo.
theological_decisions:
- issue: Jina la kijamii/agano בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: ‘Wana wa Israeli’ huhifadhi dhana ya ukoo na jamii inayotokana na Israeli, bila kuifuta na kutumia tu jina la kabila; tanbihi inaonyesha mbadala wa kawaida zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kuwalazimisha kufanya kazi’ ni ya asili zaidi kuliko tafsiri ya neno kwa neno ya ‘kuwafanya watumikie,’ huku ‘wana wa Israeli’ ikihifadhi mwangwi wa kifamilia wa chanzo.
