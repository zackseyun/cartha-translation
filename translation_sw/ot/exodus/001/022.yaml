base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/022.yaml
  text: Then Pharaoh commanded all his people[a], saying, “Every son who is born you must throw into the Nile[c][b], but every daughter you must let live.”
translation:
  language: sw
  text: Ndipo Farao akawaamuru watu wake wote, akisema, “Kila mwana wa kiume[a] atakayezaliwa mtamtupa katika Mto Naili[b], lakini[c] kila binti mtamwacha hai.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila mtoto wa kiume.” Neno la Kiebrania kwa maana halisi ni “mwana,” lakini hapa linamaanisha mtoto wa kiume.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mtoni.” Katika kitabu cha Kutoka, neno hili kwa kawaida humaanisha Mto Naili.'
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “na.” Hapa limetafsiriwa “lakini” ili kuonyesha tofauti kati ya maagizo hayo mawili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: akawaamuru
  rationale: Kitenzi צוה humaanisha kutoa amri. “Akawaamuru” kinaonyesha amri ya kifalme na kinaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki cha kifalme katika Kiswahili cha Biblia.
- source_word: לְכָל עַמּוֹ
  choice: watu wake wote
  rationale: עַם kwa kawaida ni “watu.” Tafsiri hii inaacha upeo wake mpana bila kuongeza wazo la “raia” au “taifa” lisilotajwa moja kwa moja.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huu ni utangulizi wa kawaida wa maneno yaliyonukuliwa na unasikika kwa asili katika simulizi la Kiswahili.
- source_word: כָּל הַבֵּן הַיִּלּוֹד
  choice: Kila mwana wa kiume atakayezaliwa
  rationale: בֵּן ni “mwana,” lakini katika muktadha huu humaanisha mtoto wa kiume. Kirai hiki kinahifadhi wazo la kuzaliwa lililo katika umbo la Kiebrania bila kutumia lugha nzito.
- source_word: הַיְאֹרָה
  choice: katika Mto Naili
  rationale: יְאֹר kimsingi ni “mto,” lakini katika kitabu cha Kutoka humrejelea hasa Naili. Jina maalumu linamwezesha msomaji wa sasa kutambua mahali panapokusudiwa.
- source_word: תַּשְׁלִיכֻהוּ
  choice: mtamtupa
  rationale: Umbo hili linawaelekea watu wengi na lina kiambishi cha yambwa cha umoja wa kiume. “Mtamtupa” huhifadhi yote mawili na nguvu ya amri.
- source_word: וְכָל הַבַּת
  choice: lakini kila binti
  rationale: וְ maana yake ya msingi ni “na,” lakini hapa inaunganisha maagizo yanayotofautiana. “Lakini” huonyesha tofauti hiyo kwa Kiswahili cha asili, huku “binti” ikifuata בַּת.
- source_word: תְּחַיּוּן
  choice: mtamwacha hai
  rationale: Pieli ya חיה hapa ni kumruhusu mtu aishi au kumweka hai. “Mtamwacha hai” ni wazi na inaonyesha tofauti na kuwaua wana wa kiume.
theological_decisions:
- issue: Upeo wa maneno “kila mwana wa kiume”
  choice: Kutotaja wazi kwamba ni mwana wa Kiebrania
  alternative: “Kila mwana wa kiume wa Waebrania”
  rationale: Muktadha mpana unaelekeza kwa watoto wa Waebrania, lakini mstari huu wenyewe hauna kirai “wa Waebrania.” Tafsiri haipaswi kuongeza ufafanuzi huo ndani ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa heshima lakini wa sasa na unaoeleweka kwa urahisi. “Ndipo” linaendeleza tukio kutoka mstari uliotangulia, na maumbo “mtamtupa” na “mtamwacha” yanahifadhi kwamba amri inatolewa kwa watu wengi kuhusu kila mtoto mmoja mmoja.
