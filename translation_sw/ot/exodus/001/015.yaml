  yaml_path: translation/ot/exodus/001/015.yaml
  text: Then the king of Egypt said to the Hebrew midwives[a], one of whom was named Shiphrah and the other Puah,
translation:
  language: sw
  text: Ndipo mfalme wa Misri akawaambia wakunga Waebrania[a], mmoja wao aliitwa Shifra na mwingine Pua,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakunga wa wanawake Waebrania.” Kirai cha Kiebrania kinaweza kumaanisha kwamba wakunga wenyewe walikuwa Waebrania, au kwamba waliwahudumia wanawake Waebrania.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akawaambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano kwa Kiswahili cha sasa, huku “akawaambia” ikiwakilisha tendo la kusema lililoelekezwa kwa wakunga.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: mfalme wa Misri
  rationale: Huu ni uwasilishaji wa kawaida wa muundo wa Kiebrania, bila kuingiza jina la cheo “Farao,” ambalo halipo katika mstari huu.
- source_word: לַמְיַלְּדֹת
  choice: wakunga
  rationale: Neno hili linamaanisha wanawake wanaosaidia katika kujifungua; “wakunga” ni istilahi ya kawaida na inayoeleweka katika Kiswahili.
- source_word: הָעִבְרִיֹּת
  choice: Waebrania
  rationale: Limesomwa kama kivumishi kinachowatambulisha wakunga kuwa Waebrania. Hata hivyo, muundo unaweza pia kumaanisha wakunga waliowahudumia wanawake Waebrania, hivyo maana hiyo imehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית ...
  choice: mmoja wao aliitwa ... na mwingine ...
  rationale: Huu ni usemi wa asili wa Kiswahili unaohifadhi utambulisho wa kila mmoja kati ya wale wawili.
- source_word: שִׁפְרָה
  choice: Shifra
  rationale: Jina limenukuliwa kwa mwandiko unaofaa fonolojia na tahajia ya Kiswahili.
- source_word: פּוּעָה
  choice: Pua
  rationale: Jina limenukuliwa moja kwa moja kwa tahajia ya Kiswahili; vokali zote hutamkwa.
