translation:
  language: sw
  text: Basi Mungu akawatendea wakunga mema, nao watu wakaongezeka na wakawa na nguvu sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּיטֶב
  choice: akawatendea mema
  rationale: Hifili ya יטב pamoja na ל inaonyesha kumfanyia mtu mema au kumtendea vizuri. Kauli hii ni ya asili katika Kiswahili na haiongezi wazo mahususi la kubariki ambalo kitenzi chenyewe halitaji wazi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno hili linamtaja Mungu, na kitenzi cha Kiebrania kimetumika katika umoja.
- source_word: לַמְיַלְּדֹת
  choice: wakunga
  rationale: Kiambishi ל kinaonyesha walionufaika na tendo la Mungu; katika Kiswahili uhusiano huo tayari unaonyeshwa kwa muundo wa kitenzi ‘akawatendea mema.’
- source_word: וַיִּרֶב
  choice: wakaongezeka
  rationale: Kitenzi רבה hapa kinaeleza kuongezeka kwa idadi ya watu.
- source_word: הָעָם
  choice: watu
  rationale: Tafsiri hii inahifadhi usemi wa jumla wa Kiebrania bila kuongeza ‘wa Israeli,’ kwa kuwa wanaorejelewa wanaeleweka katika muktadha.
- source_word: וַיַּעַצְמוּ
  choice: kuwa na nguvu
  rationale: עצם hapa inaonyesha kukua katika nguvu au kuwa wenye nguvu; usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa.
- source_word: מְאֹד
  choice: sana
  rationale: מְאֹד ni neno la kusisitiza kiwango, na ‘sana’ ni kisawe cha kawaida na cha asili katika Kiswahili.
theological_decisions:
- issue: Ikiwa tendo la Mungu litafsiriwe kuwa aliwabariki wakunga au, kwa namna isiyoainisha zaidi, aliwatendea mema
  choice: akawatendea mema wakunga
  alternative: akawabariki wakunga; akawa mwema kwa wakunga
  rationale: Kitenzi יטב kinaonyesha kuwatendea mema, lakini hakibainishi namna ya fadhili hiyo. Tafsiri isiyoipanua maana inalinda wording ya chanzo na kuacha mstari wa 21 ueleze tendo lililofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. ‘Basi’ linaendeleza simulizi bila kulazimisha uhusiano wa kisababishi ulio mkali kuliko kiunganishi cha Kiebrania.
