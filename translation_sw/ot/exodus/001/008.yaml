  text: A new king arose over Egypt[b][a], who did not know Yosef.
translation:
  language: sw
  text: Kisha mfalme mpya[a] aliingia madarakani kutawala Misri, ambaye hakumjua Yosefu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfalme mwingine.” Kivumishi cha Kiebrania kwa maana ya moja kwa moja ni “mpya,” lakini wengine hukielewa kuwa kinadokeza nasaba au utawala tofauti.
    reason: lexical_alternative
  - marker: b
