lexical_decisions:
- source_word: וַיָּקָם
  choice: akatawala
  rationale: Ingawa kitenzi קום kwa msingi ni ‘kuinuka’, kinapotumiwa kuhusu mfalme kinaweza kueleza kuingia madarakani au kuanza kutawala. ‘Akatawala’ ni Kiswahili cha kawaida na cha wazi katika muktadha huu, huku kiunganishi cha simulizi katika וַ־ kikibebwa na ‘aka-’.
- source_word: מֶלֶךְ
  choice: mfalme
  rationale: Neno hili humaanisha mfalme moja kwa moja.
- source_word: חָדָשׁ
  choice: mpya
  rationale: Hii ndiyo maana ya moja kwa moja ya kivumishi; haikulazimishi tafsiri ya mabadiliko ya nasaba au utawala.
- source_word: עַל מִצְרָיִם
  choice: juu ya Misri
  rationale: עַל pamoja na mtawala huonyesha mamlaka juu ya nchi. ‘Juu ya Misri’ huhifadhi wazo hilo kuliko ‘huko Misri’.
- source_word: אֲשֶׁר לֹא יָדַע
  choice: naye hakumjua
  rationale: יָדַע kwa kawaida ni ‘kujua’. Kiswahili hiki huhifadhi uwezekano wa maana ya kutomfahamu na pia kutomtambua au kutomjali, bila kuamua kimya-kimya maana moja.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: ‘Yosefu’ ni umbo la Kiswahili lililozoeleka na linalowakilisha jina la Kiebrania יוֹסֵף kwa uwazi.
theological_decisions:
- issue: Iwapo mstari udokeze mabadiliko ya nasaba au uhasama wa kisiasa katika ‘mfalme mpya’ na ‘hakumjua Yosefu’
  choice: Kubaki na maneno ya moja kwa moja ‘mfalme mpya ... hakumjua Yosefu’
  alternative: ‘mfalme mwingine/nasaba nyingine ... hakumtambua Yosefu’
  rationale: Kiebrania kinasema tu kwamba mfalme mpya alianza kutawala na hakumjua Yosefu. Mabadiliko ya nasaba au kupuuza kwa makusudi yanawezekana, lakini hayakulazimishwi na mstari; kwa hiyo utata huo umehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetolewa kwa ‘aka-’. Alama za tanbihi zimewekwa baada ya vipashio vinavyohusika, kwa mpangilio wa kawaida [a], [b].
