lexical_decisions:
- source_word: וַיָּמָת
  choice: Kisha ... akafa
  rationale: Waw-consecutive pamoja na kitenzi מות inaendeleza simulizi kwa tukio lililopita; “Kisha ... akafa” ni Kiswahili cha kawaida kinachohifadhi mfuatano huo.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Jina la mtu limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: וְכָל אֶחָיו
  choice: pamoja na ndugu zake wote
  rationale: אֶחָיו hapa inawahusu ndugu wa kiume wa Yosefu; “ndugu zake wote” ni ya kawaida katika Kiswahili, na “pamoja na” huunganisha kwa uwazi vifo vyao bila kudokeza kuwa walikufa wakati mmoja.
- source_word: וְכֹל הַדּוֹר הַהוּא
  choice: na kizazi kile chote
  rationale: כֹּל ina maana ya ujumla, na הַדּוֹר הַהוּא ni watu wa kizazi kile; “kizazi kile chote” huhifadhi msisitizo wa kujumuisha wote.
