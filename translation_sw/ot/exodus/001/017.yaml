base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/017.yaml
  text: But the midwives feared God[a], and did not do as the king of Egypt had told them; rather, they let the children live.
translation:
  language: sw
  text: Lakini wakunga walimcha Mungu, wala hawakufanya kama mfalme wa Misri alivyowaambia; badala yake, waliwaacha watoto waishi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waliwahifadhi watoto hai.”
    reason: Neno וַתְּחַיֶּיןָ linaweza kueleweka kuwa waliwaacha waishi au waliwahifadhi hai.
lexical_decisions:
- source_word: וַתִּירֶאןָ
  choice: walimcha
  rationale: Kitenzi ירא hapa kinaonyesha hofu yenye uchaji kwa Mungu. Usemi wa kawaida wa kibiblia wa Kiswahili, ‘kumcha Mungu,’ huhifadhi maana zote mbili bila kuupunguza kuwa heshima tu.
- source_word: הַמְיַלְּדֹת
  choice: wakunga
  rationale: Umbo hili la kishirikishi kutoka ילד linataja wanawake waliowasaidia wajawazito kujifungua. ‘Wakunga’ ni neno sahihi na la kawaida katika Kiswahili sanifu.
- source_word: אֶת הָאֱלֹהִים
  choice: Mungu
  rationale: Katika kishazi hiki neno hilo linamtaja Mungu kama mlengwa wa uchaji wa wakunga. Kiswahili cha kawaida hakihitaji kuakisi kibainishi cha Kiebrania kwa kuongeza neno jingine.
- source_word: וְלֹא עָשׂוּ
  choice: wala hawakufanya
  rationale: Tafsiri hii inafuata kwa karibu kitenzi עשׂה kilichokanushwa; ‘wala’ huunganisha kwa kawaida tendo hili na kishazi kilichotangulia.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶן
  choice: kama ... alivyowaambia
  rationale: Ingawa דבר kwa msingi ni ‘kunena/kusema,’ katika muktadha wa agizo ‘alivyowaambia’ ni Kiswahili cha asili kinachowasilisha nguvu ya maneno ya mfalme bila kuongeza ufafanuzi.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: mfalme wa Misri
  rationale: Hii ni tafsiri ya kawaida na wazi ya muundo wa Kiebrania unaomaanisha mfalme anayetawala Misri.
- source_word: וַתְּחַיֶּיןָ
  choice: waliwaacha ... waishi
  rationale: Piel ya חיה hapa ina maana ya kusababisha waishi au kutowaua. ‘Waliwaacha ... waishi’ huonyesha kwa kawaida tofauti na agizo la kuwaua, huku tanbihi ikihifadhi maana mbadala ya kuwafanya waendelee kuwa hai.
- source_word: הַיְלָדִים
  choice: watoto
  rationale: Neno יְלָדִים lenyewe ni pana kuliko ‘wavulana,’ ingawa muktadha uliotangulia unaonyesha kuwa watoto wa kiume ndio wanaokusudiwa. ‘Watoto’ huhifadhi upana wa neno la mstari huu.
theological_decisions:
- issue: Tafsiri ya אֱלֹהִים katika usemi wa kumcha Mungu
  choice: Mungu
  alternative: huyo Mungu
  rationale: Muktadha humtaja Mungu wa kweli kama mlengwa wa uchaji wa wakunga. ‘Mungu’ ni usemi wa kawaida wa Kiswahili na hauongezi ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unabaki karibu na Kiebrania lakini unasomeka kwa urahisi; ‘kumcha Mungu’ huhifadhi nahau ya kibiblia, na ‘watoto’ hudumisha upana halisi wa nomino huku muktadha ukibainisha wanaolengwa.
