  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya ‘maisha kuwa machungu’ imehifadhiwa; muundo mzito wa Kiebrania umelainishwa bila kupunguza nguvu ya uonevu.
