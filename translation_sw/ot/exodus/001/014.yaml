base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/014.yaml
  text: And they made their lives bitter with hard labor in mortar and bricks and in every kind of field work—all their labor that they imposed on them with harshness[a].
translation:
  language: sw
  text: Nao wakayafanya maisha yao kuwa machungu kwa kazi ngumu ya udongo na matofali, na kwa kila aina ya kazi ya shambani—kazi yao yote waliyowalazimisha kufanya kwa ukatili[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila huruma.” Neno la Kiebrania linaonyesha uonevu mkali wenye kuvunja nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרְרוּ
  choice: wakayafanya maisha yao kuwa machungu
  rationale: Inahifadhi sitiari ya Kiebrania inayotokana na מרר, badala ya kuibadili kuwa maelezo tambarare kama ‘wakayafanya yawe ya taabu.’
- source_word: חַיֵּיהֶם
  choice: maisha yao
  rationale: Huwakilisha kwa kawaida wingi wa Kiebrania na ujumla wa hali yao ya kuishi.
- source_word: בַּעֲבֹדָה קָשָׁה
  choice: kwa kazi ngumu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kazi yenye uzito na hali ya uonevu bila kuongeza maana isiyokuwapo.
- source_word: בְּחֹמֶר וּבִלְבֵנִים
  choice: ya kutengeneza chokaa na matofali
  rationale: Muktadha ni kazi ya ujenzi; ‘chokaa na matofali’ huonyesha vifaa vilivyotajwa, huku ‘kutengeneza’ ikifanya uhusiano na kazi uwe wazi na wa kawaida kwa Kiswahili.
- source_word: וּבְכָל עֲבֹדָה בַּשָּׂדֶה
  choice: na kwa kila aina ya kazi ya shambani
  rationale: Huwasilisha wigo mpana wa כָל עֲבֹדָה kwa Kiswahili cha kawaida.
- source_word: אֵת כָּל עֲבֹדָתָם אֲשֶׁר עָבְדוּ בָהֶם
  choice: kazi yao yote waliyowalazimisha kufanya
  rationale: Muundo wa Kiebrania ni wa kurudia na mzito; tafsiri hii inaonyesha kwamba Wamisri waliwatumikisha Waisraeli bila kudumisha urudiaji usio wa kawaida katika Kiswahili.
- source_word: בְּפָרֶךְ
  choice: kwa ukatili
  rationale: Neno פָרֶךְ huonyesha ukali wa uonevu wenye kuvunja nguvu; ‘kwa ukatili’ ni la asili na lenye uzito unaofaa katika Kiswahili.
