  text: וַ/יֹּ֖אמֶר אֶל עַמּ֑/וֹ הִנֵּ֗ה עַ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל רַ֥ב וְ/עָצ֖וּם מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/009.yaml
  text: And he said to his people[a], “Look, the people of the sons of Israel are more numerous and stronger than we are.”
translation:
  language: sw
  text: Akawaambia watu wake, “Tazameni, watu wa wana wa Israeli ni wengi na wenye nguvu kuliko sisi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל עַמּוֹ
  choice: Akawaambia watu wake
  rationale: Muundo wa masimulizi wa וַיֹּאמֶר unaendeleza tukio; katika Kiswahili, kitenzi ‘akawaambia’ huonyesha kwa kawaida kuwa alisema maneno hayo kwa watu wake, bila kubadili maana.
- source_word: הִנֵּה
  choice: Tazameni
  rationale: Neno hili linavuta usikivu wa wasikilizaji. ‘Tazameni’ ni la sasa, lenye hadhi, na linafaa kwa hotuba iliyoelekezwa kwa watu wengi.
- source_word: עַם בְּנֵי יִשְׂרָאֵל
  choice: watu wa wana wa Israeli
  rationale: Utoaji huu unahifadhi muundo wa Kiebrania na jina la kifamilia-kikabila ‘wana wa Israeli,’ badala ya kulirahisisha kuwa ‘Waisraeli.’
- source_word: רַב
  choice: ni wengi
  rationale: Katika muktadha huu רַב inaeleza wingi wa idadi. Kilinganishi מִמֶּנּוּ mwishoni mwa kishazi hufanya ‘kuliko sisi’ ihusiane na sifa zote mbili.
- source_word: וְעָצוּם
  choice: na wenye nguvu
  rationale: עָצוּם inaweza kumaanisha kuwa hodari, mwenye nguvu, au mwenye uwezo mkubwa. ‘Wenye nguvu’ ni tafsiri ya asili isiyoongeza wazo la kijeshi lisilotajwa wazi.
- source_word: מִמֶּנּוּ
  choice: kuliko sisi
  rationale: 'Kiambishi cha nafsi ya kwanza wingi pamoja na מן kinaonyesha ulinganisho: ‘kuliko sisi.’'
