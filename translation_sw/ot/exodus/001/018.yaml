translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi “Basi ... akawaita ... akawauliza” ni mwepesi kueleweka, huku usemi wa moja kwa moja na shutuma ya mfalme vikihifadhiwa.
