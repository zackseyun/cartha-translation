  text: So the king of Egypt called for the midwives and said to them[a], “Why have you done this thing and let the children live?”
translation:
  language: sw
  text: Basi mfalme wa Misri akawaita wakunga, akawaambia, “Kwa nini mmefanya jambo hili na kuwaacha watoto[a] waishi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wa kiume.” Neno la Kiebrania linaweza kumaanisha watoto kwa ujumla; katika muktadha huu linawarejelea watoto wa kiume.
    reason: contextual_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: קרא ikifuatwa na ל kwa watu humaanisha kuwaita au kuwaagiza waje. Katika Kiswahili, “akawaita” ni ya kawaida na inaonyesha kwamba wakunga waliitwa mbele ya mfalme.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: mfalme wa Misri
  rationale: Huu ni uhusiano wa nomino mbili unaotafsiriwa kwa kawaida na kwa uwazi kama “mfalme wa Misri.”
- source_word: לַמְיַלְּדֹת
  choice: wakunga
  rationale: Nomino hii inawataja wanawake waliowasaidia wajawazito kujifungua; “wakunga” ni neno sahihi na linaloeleweka katika Kiswahili sanifu.
- source_word: וַיֹּאמֶר לָהֶן
  choice: akawauliza
  rationale: Ingawa אמר kimsingi ni “alisema,” hapa maneno yanayofuata ni swali. “Akawauliza” ni Kiswahili cha asili kinachowasilisha kwa usahihi tendo la kusema kwao bila kuongeza uzito wa kiufafanuzi.
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Ni kiulizi cha sababu; “Kwa nini” ndilo tamko la kawaida na fupi katika Kiswahili.
- source_word: עֲשִׂיתֶן
  choice: mmefanya
  rationale: Kitenzi ni nafsi ya pili wingi wa kike. Kiswahili hakionyeshi jinsia hapa, lakini “mmefanya” kinahifadhi nafsi ya pili wingi na kinafaa katika swali hili.
- source_word: הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: דבר hapa ni tendo au jambo. “Jambo hili” ni la kawaida zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno “kitu hiki,” huku likidumisha maana.
- source_word: וַתְּחַיֶּיןָ
  choice: kuwaacha ... waishi
  rationale: Umbo la חיה linaweza kumaanisha kusababisha waishi, kuwahifadhi hai, au kuwaacha waishi. Katika shutuma ya mfalme, “kuwaacha ... waishi” ni ya asili na huhifadhi wigo wa maana wa muktadha.
- source_word: הַיְלָדִים
  choice: watoto wa kiume
  rationale: Ingawa יְלָדִים inaweza kumaanisha watoto kwa upana, muktadha wa karibu (aya 16–17) unawahusu watoto wa kiume ambao mfalme alikuwa ameamuru wauawe. “Watoto wa kiume” huweka wazi rejeo hilo la kimuktadha.
