base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
translation:
  language: sw
  text: Lakini kadiri walivyowatesa[a], ndivyo walivyozidi kuongezeka, na ndivyo walivyozidi kuenea; nao wakawa na hofu kwa sababu ya Waisraeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina kiwakilishi cha umoja, “yeye,” kwa kuwa Israeli anatajwa hapa kama jumuiya moja.
    reason: lexical_alternative
  - marker: b
    text: Au “wakawachukia” au “wakawa na kinyaa kwa sababu ya Waisraeli.” Neno la Kiebrania linaweza kuonyesha hofu, chuki, au kinyaa. Kwa Kiebrania, “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר ... כֵּן ... וְכֵן
  choice: Lakini kadiri ... ndivyo walivyozidi ... na ...
  rationale: 'Muundo huu unaonyesha uwiano unaoongezeka: kadiri mateso yalivyoongezeka, ndivyo idadi na kuenea kwao kulivyoongezeka. “Lakini” huonyesha tofauti na kusudi la watesaji katika muktadha.'
- source_word: יְעַנּוּ
  choice: walivyowatesa
  rationale: Kitenzi ענה katika Piel humaanisha kutesa au kuonea; “kutesa” ni wazi, cha kawaida, na kinafaa kwa kazi ngumu iliyolazimishwa katika muktadha.
- source_word: אֹתוֹ
  choice: -wa- (wao)
  rationale: Kiwakilishi cha Kiebrania ni cha umoja lakini humrejelea Israeli kama jumuiya moja. Kiswahili cha kawaida hutumia wingi kwa Waisraeli.
- source_word: יִרְבֶּה
  choice: walivyozidi kuongezeka
  rationale: רבה hapa huhusu kuongezeka kwa idadi ya watu. “Kuzidi kuongezeka” pia hudumisha nguvu ya muundo wa uwiano.
- source_word: יִפְרֹץ
  choice: kuenea
  rationale: פרץ inaweza kueleza kuvunja mipaka, kusambaa, au kupanuka kwa nguvu. “Kuenea” ni Kiswahili cha kawaida kinachoonyesha upanuzi wa watu katika eneo.
- source_word: וַיָּקֻצוּ מִפְּנֵי
  choice: wakawaogopa sana
  rationale: קוץ pamoja na מִפְּנֵי inaweza kueleza hofu kali au chuki/kinyaa mbele ya uwepo wa Waisraeli. “Kuogopa sana” inafaa kwa muktadha wa hofu kuhusu kuongezeka kwao, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa kwa umbo halisi ni “wana wa Israeli,” msemo huu ni jina la kikabila linalowarejelea watu wa Israeli kwa jumla. “Waisraeli” ni wa asili na unaeleweka vyema katika Kiswahili cha sasa.
theological_decisions:
- issue: Umoja wa kisarufi unaomwakilisha Israeli kama jumuiya
  choice: Kutumia viwakilishi na vitenzi vya wingi kwa Waisraeli
  alternative: 'Kutumia umoja: “walivyomtesa ... alivyozidi”'
  rationale: Kiebrania humchukulia Israeli kama mtu mmoja wa kijumuiya, lakini marejeo yake ni kwa watu wengi. Wingi ni Kiswahili cha kawaida bila kubadili maana ya kijumuiya; umbo la chanzo linaelezwa katika tanbihi.
- issue: 'Maana ya קוץ: hofu au chuki/kinyaa'
  choice: wakawaogopa sana
  alternative: wakawachukia sana / wakawa na kinyaa kwa sababu yao
  rationale: Muktadha wa sera ya Misri na kuongezeka kwa Waisraeli unaunga mkono hofu kali, lakini kitenzi kinaweza pia kuonyesha chuki au kinyaa. Uwezekano huo hauondolewi, bali umewekwa katika tanbihi.
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  alternative: wana wa Israeli
  rationale: Huu ni msemo wa kikabila unaowahusu watu wote wa Israeli, si wana wa kiume pekee. Tafsiri “Waisraeli” huepuka maana finyu isiyokusudiwa, huku umbo halisi likitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “kadiri ... ndivyo ...” huwasilisha uwiano wa Kiebrania kwa ufasaha. “Waisraeli” ni wazi zaidi kwa wasomaji wa kawaida kuliko tafsiri halisi “wana wa Israeli.”
