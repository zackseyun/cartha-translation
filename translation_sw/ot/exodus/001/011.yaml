base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/011.yaml
  text: 'So they set taskmasters over him to afflict him with their burdens[c][b][a], and he built storage cities for Pharaoh: Pithom and Rameses.'
translation:
  language: sw
  text: 'Kwa hiyo wakaweka juu yake wasimamizi wa kazi za kulazimishwa ili wamtese kwa mizigo yao; naye akajenga[a] miji ya kuhifadhia akiba[b] kwa ajili ya Farao: Pitomu na Ramesesi.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “juu yao,” “wawatesa,” na “wakajenga”; Kiebrania kinatumia maumbo ya umoja kumtaja Israeli kwa maana ya taifa zima.
    reason: alternative_reading
  - marker: b
    text: Au “miji ya maghala.”
    reason: lexical_alternative
  - marker: c
    text: Ramesesi pia linaweza kuandikwa “Raamesesi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: wakaweka
  rationale: Kitenzi hiki kinawasilisha kwa uwazi tendo la kuwaweka maafisa juu ya Israeli, huku muktadha ukionyesha kuwa waliwekwa rasmi kusimamia kazi.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kiambishi cha Kiebrania ni umoja wa kiume na kinamtaja Israeli kwa umoja wa kijumla; Kiswahili kinaweza kuhifadhi mtindo huo kwa kawaida.
- source_word: שָׂרֵי מִסִּים
  choice: wasimamizi wa kazi za kulazimishwa
  rationale: Kirai hiki kinamaanisha maafisa wenye mamlaka juu ya kazi ya shuruti; tafsiri hii ni wazi kwa msomaji wa sasa kuliko neno linaloweza kueleweka kuwa linahusu kodi ya fedha pekee.
- source_word: לְמַעַן עַנֹּתוֹ
  choice: ili wamtesе
  rationale: Kitenzi ענה katika piel hapa kina maana ya kutesa au kukandamiza. “Wamtesе” huhifadhi ukali wa tendo na umoja wa kijumla wa Israeli.
- source_word: בְּסִבְלֹתָם
  choice: kwa mizigo yao
  rationale: Huhifadhi kwa kifupi uwezekano wa kuelewa סִבְלֹת kuwa mizigo halisi au majukumu mazito ya kazi ya shuruti, bila kulazimisha maana moja.
- source_word: וַיִּבֶן
  choice: akamjengea
  rationale: Kitenzi cha Kiebrania ni umoja wa kiume; “akamjengea” huhifadhi Israeli kama mhusika wa kijumla na pia huonyesha kwamba miji hiyo ilijengwa kwa manufaa ya Farao.
- source_word: עָרֵי מִסְכְּנוֹת
  choice: miji ya kuhifadhia akiba
  rationale: Hutoa kwa Kiswahili cha sasa maana ya miji iliyotumika kuhifadhi akiba au mahitaji, bila kuibana kuwa maghala ya nafaka pekee.
- source_word: לְפַרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo cha mfalme wa Misri; muundo “akamjengea Farao” unawakilisha לְ kwa kawaida.
- source_word: פִּתֹם
  choice: Pitomu
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: רַעַמְסֵס
  choice: Ramesesi
  rationale: Jina la mahali limetoholewa kwa umbo linalosomeka kwa urahisi katika Kiswahili; tahajia ya karibu zaidi na konsonanti za Kiebrania imetajwa katika tanbihi.
theological_decisions:
- issue: Israeli anatajwa kwa maumbo ya umoja ingawa ni taifa zima
  choice: 'Kuhifadhi umoja: “juu yake,” “wamtesе,” na “akamjengea”'
  alternative: 'Kutumia wingi: “juu yao,” “wawatesе,” na “wakamjengea”'
  rationale: Maandishi ya Kiebrania yana maumbo ya umoja yanayomwakilisha Israeli kwa ujumla. Kuyahifadhi kunadumisha sifa halisi ya usemi wa chanzo bila kuzuia msomaji kuelewa kuwa taifa zima ndilo linalokusudiwa; tanbihi inafafanua uwezekano wa wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa umoja wa kijumla umehifadhiwa kwa uaminifu kwa Kiebrania, huku tanbihi ikitoa usomaji wa wingi ulio wa kawaida zaidi katika Kiswahili.
