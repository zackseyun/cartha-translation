  yaml_path: translation/ot/exodus/001/016.yaml
  text: And he said[a], “When you help the Hebrew women give birth and see them on the birthstool, if it is a son, then you shall put him to death; but if it is a daughter, then she shall live.”
translation:
  language: sw
  text: Naye akasema, “Mnapowasaidia wanawake Waebrania kujifungua, na mkiwaona kwenye kiti cha kujifungulia[a], ikiwa ni mwana, muueni; lakini ikiwa ni binti, mwacheni aishi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “juu ya mawe mawili,” yaelekea kikirejelea kiti au sehemu ya kujifungulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַלֶּדְכֶן
  choice: mnapowasaidia ... kujifungua
  rationale: Kitenzi cha Kiebrania katika muktadha huu kinaeleza kuwasaidia wanawake wakati wa kujifungua; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: הָעִבְרִיּוֹת
  choice: wanawake Waebrania
  rationale: Ni nomino/kivumishi cha kike katika wingi kinachomaanisha wanawake wa Kiebrania.
- source_word: וּרְאִיתֶן
  choice: na kuwaona
  rationale: Huhifadhi agizo linalofuatana la kuwaangalia wanawake wakati wa kujifungua, huku kiwakilishi cha yambwa kikifanya Kiswahili kiwe cha asili.
- source_word: עַל הָאָבְנָיִם
  choice: juu ya kiti cha kujifungulia
  rationale: Ingawa kihalisi ni ‘juu ya mawe mawili,’ katika muktadha wa uzazi inaelekea kutaja kiti au sehemu ya kujifungulia; maana ya kimuktadha imewekwa katika matini na maana halisi katika tanbihi.
- source_word: אִם בֵּן הוּא
  choice: ikiwa ni mwana
  rationale: ‘Mwana’ hudumisha ulinganifu wa mwana/binti na uzito wa agizo kuliko ‘mvulana.’
- source_word: וַהֲמִתֶּן אֹתוֹ
  choice: muueni
  rationale: Hii ni amri ya nafsi ya pili wingi wa kike yenye maana ya kumfanya afe au kumuua; ‘muueni’ ni ya moja kwa moja na ya asili katika Kiswahili.
- source_word: וְאִם בַּת הִיא
  choice: lakini ikiwa ni binti
  rationale: ‘Lakini’ huonyesha utofauti wa matokeo, na ‘binti’ hudumisha jozi ya mwana/binti.
- source_word: וָחָיָה
  choice: mwacheni aishi
  rationale: Katika muktadha wa amri, kitenzi kina maana ya kumwacha mtoto wa kike hai; usemi huu unaonyesha wazi nguvu ya kuruhusu bila kubadili maana.
