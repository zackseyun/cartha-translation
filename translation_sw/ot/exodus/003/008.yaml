  text: וָ/אֵרֵ֞ד לְ/הַצִּיל֣/וֹ מִ/יַּ֣ד מִצְרַ֗יִם וּֽ/לְ/הַעֲלֹת/וֹ֮ מִן הָ/אָ֣רֶץ הַ/הִוא֒ אֶל אֶ֤רֶץ טוֹבָה֙ וּ/רְחָבָ֔ה אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֶל מְק֤וֹם הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/008.yaml
  text: And I have come down to deliver him from the hand of Egypt and to bring him up from that land to a good and broad land[a], to a land flowing with milk and honey, to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite[c][b], and the Jebusite.
translation:
  language: sw
  text: Nami nimeshuka ili nimwokoe[b] kutoka mkononi mwa Misri[a] na kumpandisha kutoka nchi ile hadi nchi nzuri na pana[c], nchi inayotiririka maziwa na asali, hadi mahali pa Wakanaani, Wahiti, Waamori, Waperizi, Wahivi na Wayebusi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kutoka mkononi mwa Misri”; ni nahau inayomaanisha kutoka katika mamlaka au udhibiti wa Misri.
    reason: lexical_alternative
  - marker: b
    text: Katika Kiebrania, “nimwokoe” na “kumpandisha” vina umoja, vikimrejelea Israeli kama watu mmoja kwa pamoja.
    reason: lexical_alternative
  - marker: c
    text: Au, “nchi nzuri na yenye nafasi tele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֵד
  choice: nimeshuka
  rationale: Wakati timilifu huonyesha tendo la Mungu lililo la sasa na thabiti katika muktadha, huku ukihifadhi taswira ya kushuka.
- source_word: לְהַצִּילוֹ
  choice: ili nimwokoe
  rationale: Kitenzi hiki kina maana ya kumwondoa au kumkomboa mtu kutoka hatarini; ‘nimwokoe’ ni Kiswahili cha kawaida na chenye maana halisi ya uokoaji hapa.
- source_word: מִיַּד מִצְרַיִם
  choice: kutoka mkononi mwa Misri
  rationale: Nahau ya Kiebrania imehifadhiwa; ‘mkono’ huwakilisha mamlaka au udhibiti wa Misri.
- source_word: וּלְהַעֲלֹתוֹ
  choice: na kumpandisha
  rationale: Huhifadhi mwelekeo wa kwenda juu uliomo katika kitenzi cha Kiebrania na kiambishi cha umoja kinachomrejelea Israeli kwa ujumla.
- source_word: אֶל אֶרֶץ טוֹבָה וּרְחָבָה
  choice: mpaka nchi nzuri na pana
  rationale: ‘Pana’ ni neno la sasa na la kawaida linalowasilisha upana na nafasi bila kuongeza ufafanuzi usiotajwa.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: nchi inayotiririka maziwa na asali
  rationale: Huhifadhi taswira ya wingi na ustawi iliyo katika kishiriki cha Kiebrania.
- source_word: אֶל מְקוֹם
  choice: mpaka mahali pa
  rationale: Ni tafsiri ya karibu ya ‘mahali’ na haibadilishi neno hilo kuwa ‘nchi’ au ‘eneo’.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: Mkanaani, Mhiti, Mwamori, Mperizi, Mhivi na Myebusi
  rationale: Majina ya umoja yamehifadhiwa kama majina ya pamoja ya kila taifa, kulingana na muundo wa Kiebrania.
theological_decisions:
- issue: Mwendo wa Mungu unaoelezwa kwa lugha ya kibinadamu
  choice: Kuhifadhi ‘nimeshuka’
  alternative: Kufafanua kuwa ‘nimeingilia kati’ au ‘nimeamua kutenda’
  rationale: Kiebrania kinatumia taswira halisi ya kushuka; kuihifadhi huzuia kufifisha mvutano na uhai wa simulizi.
- issue: Viwakilishi vya umoja vinavyomrejelea Israeli kama jamii
  choice: Kutumia ‘nimwokoe’ na ‘kumpandisha’
  alternative: Kutumia wingi ‘niwaokoe’ na ‘kuwapandisha’
  rationale: Viambishi vya Kiebrania ni vya umoja na vinamwakilisha Israeli kama watu mmoja kwa pamoja; tafsiri inahifadhi mtazamo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa msomaji wa kawaida, huku taswira za Kiebrania—kushuka, mkono wa Misri, kupandisha, na nchi inayotiririka—zikihifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
