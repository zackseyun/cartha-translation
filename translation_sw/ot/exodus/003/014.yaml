base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/014.yaml
  text: 'And God said to Moses[a], “I AM WHO I AM.” And he said[b], “Thus you shall say to the sons of Israel: ‘I AM has sent me to you.’”'
translation:
  language: sw
  text: 'Mungu akamwambia Mose, “MIMI NIKO AMBAYE NIKO.”[a] Kisha akasema, “Waambie hivi wana wa Israeli: ‘MIMI NIKO’ amenituma kwenu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “MIMI NITAKUWA NITAKAYEKUWA,” au “MIMI NITAKUWA AMBAYE NITAKUWA.” Kitenzi cha Kiebrania hapa kinaweza kueleza wakati ujao pamoja na maana ya sasa.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu, umbo la Kiebrania ambalo kimuundo ni wingi linamtaja kwa maana ya umoja Mungu wa Israeli; kwa hiyo “Mungu” ni tafsiri ya kawaida na sahihi.
- source_word: אֶהְיֶה
  choice: MIMI NIKO
  rationale: Ni Qal imperfect nafsi ya kwanza umoja ya היה, na inaweza kuwa na maana ya sasa au ya wakati ujao. Hapa inatumika kama kujitambulisha kwa Mungu na kisha kama jina la kumtaja aliyetuma Mose; “MIMI NIKO” huhifadhi dhima hiyo ya kujitambulisha, huku maana ya wakati ujao ikihifadhiwa katika tanbihi.
- source_word: אֲשֶׁר
  choice: ambaye
  rationale: Katika kauli ya Mungu inayojirejelea kibinafsi, “ambaye” ni ya asili katika Kiswahili na hudumisha urejeo wa nafsi bila kulazimisha maana moja kupita kiasi.
- source_word: כֹּה
  choice: hivi
  rationale: Neno hili huanzisha maneno yanayopaswa kuripotiwa. “Waambie hivi” ni Kiswahili cha sasa, cha asili, na chenye nguvu ya agizo.
- source_word: תֹאמַר
  choice: waambie
  rationale: Imperfect ya nafsi ya pili ya kiume umoja ina nguvu ya agizo kwa Mose. Kwa sababu walengwa ni wengi, “waambie” huwasilisha agizo hilo kwa ufasaha.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: “Wana” huhifadhi kwa ukaribu taswira ya בְּנֵי, yaani wana/wa uzao wa Israeli, kuliko neno la jumla “Waisraeli.”
- source_word: שְׁלָחַנִי
  choice: amenituma
  rationale: Kitenzi timilifu chenye kiambishi cha nafsi ya kwanza huonyesha tendo lililotimizwa lenye umuhimu wa sasa; “amenituma” ni tafsiri ya asili ya Kiswahili.
- source_word: וַיֹּאמֶר
  choice: akamwambia / akasema
  rationale: Waw-consecutive husogeza simulizi mbele. Miundo “akamwambia” na “akasema” ni ya kawaida katika masimulizi ya Kiswahili na huhifadhi mfuatano wa matendo.
theological_decisions:
- issue: Tafsiri ya kujitambulisha kwa Mungu אֶהְיֶה אֲשֶׁר אֶהְיֶה
  choice: MIMI NIKO AMBAYE NIKO
  alternative: MIMI NITAKUWA NITAKAYEKUWA; MIMI NITAKUWA AMBAYE NITAKUWA
  rationale: Imperfect ya Kiebrania inaweza kuwa na maana ya sasa na pia ya wakati ujao. Matini kuu hutumia kauli ya sasa kwa sababu kirai kinatumika kama kujitambulisha na אֶהְיֶה inarudiwa kama jina la mtumaji. Tanbihi huhifadhi kwa wazi uwezekano halisi wa maana ya wakati ujao.
- issue: Matumizi ya herufi kubwa katika jina la kujitambulisha
  choice: MIMI NIKO
  alternative: Mimi niko; Mimi nitakuwa
  rationale: Herufi kubwa zinaonyesha kwa msomaji kwamba kauli hiyo inafanya kazi hapa kama kujitambulisha rasmi kwa Mungu na kisha kama jina linalorudiwa. Huu ni uamuzi wa uchapaji wa Kiswahili, si dai kwamba Kiebrania kina umbo tofauti la herufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na uzito wa kauli ya Mungu. “Wana wa Israeli” inadumisha ukaribu na muundo wa Kiebrania. Kiashiria [a] kimewekwa mara baada ya “Mose” kulingana na safu ya mashauriano, ingawa tanbihi yenyewe inafafanua kauli inayofuata.
