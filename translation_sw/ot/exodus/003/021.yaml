  yaml_path: translation/ot/exodus/003/021.yaml
  text: And I will give this people favor in the sight of the Egyptians[a], and when you go[b], you will not go empty-handed.
translation:
  language: sw
  text: Nami nitawajalia watu hawa kibali[a] machoni pa Wamisri; na mtakapoondoka, hamtaondoka mikono mitupu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Nitawafanya watu hawa wakubalike mbele ya Wamisri.”
    reason: lexical_alternative
  - marker: b
    text: Au “hamtaondoka bila kitu.” Nahau hiyo hueleza kuondoka bila mali au vitu vya matumizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Nami nitawafanya
  rationale: Muundo huu, pamoja na חֵן na בְּעֵינֵי, unawasilisha kwa Kiswahili cha kawaida wazo la Mungu kusababisha watu hawa wakubaliwe na Wamisri, bila kuifanya חֵן kuwa kitu halisi kinachotolewa.
- source_word: חֵן
  choice: wawapende
  rationale: Katika muktadha huu חֵן ni kukubaliwa au kuonekana kwa fadhili mbele ya wengine. 'Wawapende' ni usemi wa kawaida unaoonyesha nia njema, bila maana nzito ya kiteolojia inayoweza kuambatana na 'neema.'
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: Hurejelea Israeli kwa pamoja. Kiswahili cha kawaida hutumia 'watu hawa' badala ya muundo usio wa kawaida 'watu huyu.'
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: Wamisri wawapende
  rationale: Nahau ya Kiebrania ni kihalisi 'machoni pa Wamisri' na inaeleza jinsi wanavyoonekana au kukubaliwa nao. Tafsiri hii inaleta maana hiyo kwa Kiswahili cha asili; tanbihi inahifadhi picha ya asili.
- source_word: וְהָיָה כִּי
  choice: na mtakapoondoka
  rationale: Ni fomula ya kuanzisha hali ya baadaye. 'Na mtakapo-' ni ya asili na fupi katika Kiswahili.
- source_word: תֵלֵכוּן / תֵלְכוּ
  choice: mtakapoondoka / hamtaondoka
  rationale: הלך kimsingi ni 'kwenda,' lakini hapa muktadha ni kutoka Misri. 'Kuondoka' huweka wazi maana ya kimuktadha bila kuongeza maelezo yasiyokuwapo.
- source_word: רֵיקָם
  choice: mikono mitupu
  rationale: Hii ni nahau ya Kiswahili inayoeleza kuondoka bila mali, bidhaa, au mahitaji; inalingana na nguvu ya רֵיקָם katika muktadha.
