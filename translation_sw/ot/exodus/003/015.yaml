source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ע֨וֹד אֱלֹהִ֜ים אֶל מֹשֶׁ֗ה כֹּֽה תֹאמַר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ יְהוָ֞ה אֱלֹהֵ֣י אֲבֹתֵי/כֶ֗ם אֱלֹהֵ֨י אַבְרָהָ֜ם אֱלֹהֵ֥י יִצְחָ֛ק וֵ/אלֹהֵ֥י יַעֲקֹ֖ב שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם זֶה שְּׁמִ֣/י לְ/עֹלָ֔ם וְ/זֶ֥ה זִכְרִ֖/י לְ/דֹ֥ר דֹּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/015.yaml
  text: 'God also said to Moses[a], “Thus you shall say to the sons of Israel: Yahweh, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever[b], and this is my memorial from generation to generation.”'
translation:
  language: sw
  text: 'Mungu akaendelea kumwambia Musa, “Waambie hivi wana wa Israeli: ‘Yahwe[a], Mungu wa baba zenu, Mungu wa Abrahamu, Mungu wa Isaka, na Mungu wa Yakobo, amenituma kwenu.’ Hili ndilo jina langu milele, na hii ndiyo kumbukumbu yangu kizazi baada ya kizazi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH, jina la Mungu; mara nyingi jina hili hutafsiriwa kwa cheo “BWANA,” na pia limeandikwa “Yehova.”'
    reason: Maelezo ya jina la Mungu na mapokeo mbadala ya kulitaja.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo kama “BWANA.” Umbo “Yahwe” linafuata tahajia na matamshi ya kawaida ya Kiswahili huku likiwakilisha YHWH.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: “Wana” huhifadhi lugha ya ukoo ya Kiebrania kwa namna ya asili na yenye hadhi katika Kiswahili, bila kuifanya kuwa neno la kisiasa tu kama “Waisraeli.”
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Mungu wa baba zenu
  rationale: Tafsiri hii huhifadhi neno la Kiebrania linalosema “baba” na mwendelezo wake wa agano, badala ya kulipanua kimya kimya kuwa “mababu.”
- source_word: שְׁלָחַנִי
  choice: amenituma
  rationale: 'Kauli hii huonyesha tendo lililokamilika ambalo matokeo yake yanaendelea: Musa yuko mbele yao akiwa ametumwa na Mungu.'
- source_word: זֶה שְּׁמִי לְעֹלָם
  choice: Hili ndilo jina langu milele
  rationale: “Milele” ni tafsiri ya kawaida na wazi ya לְעֹלָם katika muktadha huu wa kudumu kwa jina la agano.
- source_word: זִכְרִי
  choice: hivi ndivyo nitakavyokumbukwa
  rationale: Kauli hii ya Kiswahili huwasilisha maana ya kitu au jina linalodumisha ukumbusho, huku tanbihi ikihifadhi tafsiri ya nomino iliyo karibu zaidi na muundo wa Kiebrania.
- source_word: לְדֹר דֹּר
  choice: kizazi baada ya kizazi
  rationale: Nahau hii ya Kiswahili huonyesha mwendelezo katika vizazi vinavyofuatana na kuhifadhi urudiaji wa usemi wa Kiebrania.
- source_word: כֹּה תֹאמַר
  choice: Waambie hivi
  rationale: Ni agizo la moja kwa moja, la kawaida na lenye hadhi katika Kiswahili; linaanzisha maneno ambayo Musa anapaswa kuwaambia watu.
- source_word: עוֹד
  choice: akaendelea kumwambia
  rationale: Katika muktadha huu neno linaonyesha kuendelea kwa hotuba ya Mungu, si kurudia tu jambo lilelile.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu, YHWH. Kulihifadhi kama “Yahwe” huonyesha wazi kwamba Mungu anajitambulisha kwa jina, si kwa cheo pekee.
- issue: Kuhifadhi maneno ya ukoo yenye umbo la kiume
  choice: wana wa Israeli / baba zenu
  alternative: Waisraeli / mababu zenu
  rationale: Maneno haya hufuata kwa karibu lugha ya ukoo katika Kiebrania. Katika Kiswahili yanaeleweka kwa kawaida kama maelezo ya jamii na watangulizi wake bila kuongeza maana isiyosemwa.
- issue: Maana ya זִכְרִי katika ulinganifu na “jina langu”
  choice: hivi ndivyo nitakavyokumbukwa
  alternative: hii ndiyo kumbukumbu yangu; hili ndilo jina ambalo nitakumbukwa kwalo
  rationale: Neno linaweza kumaanisha ukumbusho, kumbukumbu, au jina ambalo kwa hilo Mungu anakumbukwa. Tafsiri kuu ni ya asili katika Kiswahili, na tanbihi huhifadhi upana wa maana bila kuamua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa kawaida na wenye hadhi. “Mungu akaendelea kumwambia” huonyesha mwendelezo wa hotuba kwa ufasaha. “Wana wa Israeli” na “baba zenu” huhifadhi taswira ya ukoo ya chanzo. Jina “Yahwe” limeandikwa kwa tahajia inayopatana na Kiswahili, na maana pana ya זִכְרִי imehifadhiwa kwa tanbihi.
