  yaml_path: translation/ot/exodus/003/020.yaml
  text: And I will stretch out my hand and strike Egypt with all my wonders that I will do in its midst[b][a]; and after that he will send you out.
translation:
  language: sw
  text: Nami nitaunyosha mkono wangu[a] na kuipiga Misri kwa maajabu yangu yote nitakayoyafanya katikati yake; baada ya hayo atawatuma mwondoke[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “nitautuma mkono wangu.” Nahau ya Kiebrania humaanisha kuunyosha mkono ili kutenda au kutumia nguvu.
    reason: lexical_alternative
  - marker: b
    text: Au “atawaacha mwondoke.” Kiebrania kwa maana ya karibu zaidi husema “atawatuma [mwondoke].”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי אֶת־יָדִי
  choice: nitaunyosha mkono wangu
  rationale: Kitenzi שׁלח kwa msingi humaanisha ‘kutuma,’ lakini katika nahau hii mkono unanyooshwa ili kutenda au kuonyesha nguvu. Tafsiri hii inadumisha taswira ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: וְהִכֵּיתִי
  choice: na kuipiga
  rationale: נכה humaanisha kupiga; umbo ‘kuipiga Misri’ linadumisha taifa/nchi kama yambwa bila kufafanua kupita kiasi aina au matokeo ya mapigo.
- source_word: מִצְרַיִם
  choice: Misri
  rationale: Jina hili linarejelea Misri kama nchi au taifa kwa ujumla, si Wamisri mmoja mmoja pekee.
- source_word: בְּכֹל נִפְלְאֹתַי
  choice: kwa maajabu yangu yote
  rationale: נפלאות ni matendo ya ajabu yanayoamsha mshangao. ‘Maajabu’ ni neno la sasa, lenye hadhi, na haliongezi ufafanuzi usiokuwapo katika chanzo.
- source_word: אֲשֶׁר אֶעֱשֶׂה
  choice: nitakayoyafanya
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kishazi husishi pamoja na kitenzi עשה, ‘kufanya.’
- source_word: בְּקִרְבּוֹ
  choice: katikati yake
  rationale: Kiambishi cha umoja kinamrejelea Misri kama nchi au taifa la pamoja. ‘Katikati yake’ kinahifadhi umoja huo na wazo la matendo kufanyika ndani ya Misri.
- source_word: וְאַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Maneno haya yanaonyesha mfuatano wa wakati kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יְשַׁלַּח אֶתְכֶם
  choice: atawaacha mwondoke
  rationale: Katika muktadha huu שׁלח inaweza kueleza kuwaachilia watu waende. Kiswahili hiki ni cha asili na kinadumisha maana ya kupewa ruhusa ya kuondoka; dokezo linaonyesha tafsiri iliyo karibu zaidi na wazo la kuwatuma waondoke.
theological_decisions:
- issue: Lugha inayomwelezea Mungu kwa taswira ya mwili
  choice: Kudumisha taswira ‘nitaunyosha mkono wangu’
  alternative: Nitaitumia nguvu yangu
  rationale: Kiebrania kinatumia taswira halisi ya mkono kueleza tendo la Mungu. Kuidumisha kunaheshimu usemi wa chanzo bila kuugeuza kuwa maelezo ya kiteolojia.
- issue: Maana ya kuachiliwa kwa Israeli
  choice: atawaacha mwondoke
  alternative: atawatoa / atawafukuza
  rationale: Kitenzi שׁלח kinaweza kumaanisha kutuma, kuondoa, au kuacha waende. Muktadha unaunga mkono kuachiliwa, lakini dokezo linahifadhi uwezekano wa msisitizo wa kuwatuma waondoke.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kuipiga Misri’ na ‘katikati yake’ unadumisha Misri kama umoja wa kitaifa; taswira ya mkono na urudiaji wa wazo la שׁלח vimehifadhiwa kadiri Kiswahili cha kawaida kinavyoruhusu.
