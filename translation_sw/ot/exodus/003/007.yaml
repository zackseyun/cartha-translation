  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה רָאֹ֥ה רָאִ֛יתִי אֶת עֳנִ֥י עַמִּ֖/י אֲשֶׁ֣ר בְּ/מִצְרָ֑יִם וְ/אֶת צַעֲקָתָ֤/ם שָׁמַ֨עְתִּי֙ מִ/פְּנֵ֣י נֹֽגְשָׂ֔י/ו כִּ֥י יָדַ֖עְתִּי אֶת מַכְאֹבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/007.yaml
  text: Then Yahweh said[a], “I have surely seen the affliction of my people who are in Egypt, and I have heard their cry because of their oppressors[c][b], for I know their sufferings.”
translation:
  language: sw
  text: Kisha Yahweh akasema, “Hakika nimeyaona mateso ya watu wangu walioko Misri, nami nimekisikia kilio chao kwa sababu ya wale wanaowatesa[a], kwa maana ninayajua maumivu yao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa sababu ya wasimamizi wao wa kazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi ili kuhifadhi jina binafsi la agano badala ya kulibadilisha kuwa cheo.
- source_word: רָאֹה רָאִיתִי
  choice: Hakika nimeyaona
  rationale: Muundo wa kitenzi-jina kisicho kikomo pamoja na kitenzi kamili unasisitiza tendo la kuona; “hakika” huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: עֳנִי
  choice: mateso
  rationale: Neno hili linaeleza hali ya dhiki na kunyanyaswa; “mateso” ni la kawaida na linatoshea mazingira ya utumwa Misri.
- source_word: עַמִּי אֲשֶׁר בְּמִצְרָיִם
  choice: watu wangu walioko Misri
  rationale: Huhifadhi uhusiano wa kishazi cha asili na kuleta sentensi ya Kiswahili iliyo wazi.
- source_word: צַעֲקָתָם
  choice: kilio chao
  rationale: Hueleza kilio kinachotokana na dhiki bila kuongeza wazo mahususi la dua au ombi.
- source_word: מִפְּנֵי נֹגְשָׂיו
  choice: kwa sababu ya wale wanaowatesa
  rationale: מִפְּנֵי ina maana ya kisababishi hapa, na נֹגְשִׂים ni watu wanaosukuma au kulazimisha wengine kufanya kazi; tafsiri hii ni wazi bila kuibana maana kuwa wasimamizi wa kazi pekee.
- source_word: כִּי
  choice: kwa maana
  rationale: Huonyesha msingi au ufafanuzi wa kauli iliyotangulia.
- source_word: יָדַעְתִּי
  choice: ninayajua
  rationale: Ingawa umbo la Kiebrania ni timilifu, hapa linaonyesha ufahamu wa sasa na wa karibu, si taarifa ya mbali tu.
- source_word: מַכְאֹבָיו
  choice: maumivu yao
  rationale: Huhifadhi kwa karibu wazo la maumivu au huzuni nyingi, huku likiwa neno la asili katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu YHWH
  choice: Yahweh
  alternative: Yehova au BWANA
  rationale: Unukuzi wa “Yahweh” huhifadhi jina binafsi la Mungu katika maandishi badala ya kulibadilisha kuwa cheo au kutumia umbo jingine la kihistoria.
- issue: Lugha ya kibinadamu kuhusu Mungu kujua mateso
  choice: ninayajua maumivu yao
  alternative: ninafahamu maumivu yao
  rationale: “Ninayajua” huhifadhi ukaribu na nguvu ya יָדַעְתִּי bila kuifanya kauli kuwa ufahamu wa kiakili ulio mbali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Msisitizo wa Kiebrania umeonyeshwa kwa “Hakika,” na sentensi imehifadhi uhusiano wa sababu na ufahamu wa karibu wa Mungu.
