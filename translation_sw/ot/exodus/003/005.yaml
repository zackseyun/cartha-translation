base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/005.yaml
  text: Then he said[a], “Do not come near here. Remove your sandals from your feet[b], because the place where you are standing is holy ground.”
translation:
  language: sw
  text: Kisha akasema, “Usikaribie hapa.[a] Vua viatu vyako miguuni mwako, kwa sababu mahali unaposimama ni ardhi takatifu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usikaribie huku.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “ardhi ya utakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha akasema
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha akasema” ni Kiswahili cha sasa na huhifadhi mfuatano wa tendo.
- source_word: אַל תִּקְרַב הֲלֹם
  choice: Usikaribie hapa
  rationale: Kitenzi pamoja na kikanushi kinaonyesha katazo, na הֲלֹם huelekeza mahali alipo msemaji. Kauli hii ni ya kawaida na wazi kwa Kiswahili.
- source_word: שַׁל
  choice: Vua
  rationale: Katika muktadha wa viatu, “vua” ni kitenzi cha asili zaidi katika Kiswahili kuliko “ondoa,” huku kikitoa maana ya kuvitoa kutoka miguuni.
- source_word: נְעָלֶיךָ
  choice: viatu vyako
  rationale: Neno la Kiebrania linamaanisha viatu vya mguuni, mara nyingi viatu vya wazi katika mazingira ya kale. “Viatu” ni neno la kawaida na lenye hadhi katika Kiswahili, bila kulazimisha umbo maalumu lisilotajwa wazi.
- source_word: מֵעַל רַגְלֶיךָ
  choice: miguuni mwako
  rationale: Kirai kinaonyesha kwamba viatu viondolewe kutoka juu ya miguu. “Miguuni mwako” huhifadhi rejeo hilo bila kufanya sentensi kuwa nzito.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inaanzisha sababu ya amri; “kwa sababu” huonyesha uhusiano huo wazi.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עוֹמֵד עָלָיו
  choice: mahali unaposimama
  rationale: Kiswahili huwasilisha kwa kawaida kishazi hiki kwa “mahali unaposimama”; maana ya kusimama juu ya mahali hapo inabaki wazi bila kiwakilishi kizito.
- source_word: אַדְמַת קֹדֶשׁ
  choice: ardhi takatifu
  rationale: Hili ni tumizi la kawaida na sahihi la muundo halisi “ardhi ya utakatifu,” likihifadhi dai kwamba ardhi hiyo ni takatifu.
- source_word: הוּא
  choice: ni
  rationale: Kiwakilishi hiki kinafanya kazi ya kuunganisha kiima na kiarifu; Kiswahili cha kawaida hutumia “ni” katika sentensi hii.
theological_decisions:
- issue: Asili ya utakatifu wa mahali hapo
  choice: Kutaja tu kwamba mahali anaposimama ni ardhi takatifu
  alternative: Kuongeza kwamba ardhi ni takatifu kwa sababu ya uwepo wa Mungu
  rationale: Aya inaitaja ardhi kuwa takatifu lakini haielezi moja kwa moja namna utakatifu huo unavyotokea. Tafsiri haiongezi ufafanuzi wa kitheolojia ambao haujatamkwa katika aya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Vua viatu vyako miguuni mwako” huhifadhi maelezo ya chanzo huku kikibaki rahisi kueleweka; “ardhi takatifu” ni kauli ya kawaida isiyopoteza uzito wa kidini.
