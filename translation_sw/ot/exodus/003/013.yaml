base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/013.yaml
  text: Then Moses said to God, “Look, when I come to the sons of Israel and say to them, ‘The God of your fathers has sent me to you,’ and they say to me, ‘What is his name?’ what shall I say to them?”
translation:
  language: sw
  text: Kisha Musa akamwambia Mungu, “Tazama, nitakapowaendea Waisraeli na kuwaambia, ‘Mungu wa baba zenu amenituma kwenu,’ nao wakiniambia, ‘Jina lake ni nani?’ nitawaambia nini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Hili ndilo neno la kawaida na la asili katika Kiswahili kwa maana ya ‘wana wa Israeli’ kama jamii, bila kufanya sentensi kuwa nzito.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Limehifadhi alama ya kuvuta fikira katika ombi la Musa, huku likidumisha mtindo wenye heshima.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: Mungu wa baba zenu
  rationale: Linafuata kwa karibu muundo wa Kiebrania na kuhifadhi maana ya mababu wao bila kuongeza ufafanuzi.
- source_word: מַה שְּׁמוֹ
  choice: Jina lake ni nani?
  rationale: Katika Kiswahili, kuuliza ‘jina ni nani?’ ni usemi wa kawaida kwa kutaka utambulisho wa jina, na kunasa kusudi la swali la Kiebrania.
theological_decisions:
- issue: Maana ya swali kuhusu jina la Mungu
  choice: Jina lake ni nani?
  alternative: Anaitwa nani?
  rationale: Muundo uliochaguliwa huhifadhi wazi neno ‘jina’ kama lilivyo katika Kiebrania na hauelezi mapema umuhimu wake wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi ni wa kawaida kwa wasomaji wengi, lakini ‘Tazama’ huhifadhi uzito wa simulizi la kibiblia.
