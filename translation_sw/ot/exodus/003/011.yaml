  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ֣/אֱלֹהִ֔ים מִ֣י אָנֹ֔כִי כִּ֥י אֵלֵ֖ךְ אֶל פַּרְעֹ֑ה וְ/כִ֥י אוֹצִ֛יא אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/011.yaml
  text: But Moses said to God[a], “Who am I that I should go to Pharaoh and that I should bring the sons of Israel out of Egypt?”
translation:
  language: sw
  text: Lakini Musa akamwambia Mungu, “Mimi ni nani hata niende kwa Farao na hata niwatoe wana wa Israeli[a] kutoka Misri?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli”; kimapokeo, “watoto wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Katika masimulizi ya Kiebrania, wayyiqtol ya אמר inaendeleza tukio; “akamwambia” ni ya kawaida na inaonyesha kuwa maneno yanaelekezwa kwa Mungu.
- source_word: אֶל הָאֱלֹהִים
  choice: Mungu
  rationale: Ingawa אֱלֹהִים ina kibainishi katika Kiebrania, Kiswahili cha kawaida humrejelea Mungu wa kweli kwa “Mungu,” bila kuongeza kibainishi.
- source_word: מִי אָנֹכִי
  choice: Mimi ni nani
  rationale: Huhifadhi swali la moja kwa moja la Musa na hisia yake ya kutostahili bila kulifafanua kupita maandishi.
- source_word: כִּי אֵלֵךְ
  choice: hata niende
  rationale: כִּי hapa huanzisha jambo linalotafakariwa baada ya “Mimi ni nani”; “hata niende” ni Kiswahili asilia katika swali hili la balagha.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo cha mfalme wa Misri.
- source_word: וְכִי אוֹצִיא
  choice: na hata niwatoe
  rationale: Huhifadhi ulinganifu wa pingamizi mbili za Musa. Umbo la kusababisha la יצא linamaanisha “kuwatoa,” yaani kusababisha watoke.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi taswira ya kifamilia na ya ukoo katika Kiebrania. Katika muktadha huu “wana” humaanisha wazao, si watoto wadogo tu.
- source_word: מִמִּצְרַיִם
  choice: kutoka Misri
  rationale: Kihusishi מִן pamoja na kitenzi cha kuwatoa kinaonyesha kuondolewa ndani ya Misri na kupelekwa nje yake.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: “Wana wa Israeli” hudumisha lugha ya ukoo ya chanzo bila kuifanya itaje watoto wadogo pekee. “Waisraeli” ni mbadala laini zaidi wa kijumla, lakini haionyeshi moja kwa moja taswira hiyo ya kifamilia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Urudiaji wa “hata” umetumiwa kudumisha muundo sambamba wa pingamizi mbili za Musa. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, “wana wa Israeli.”
