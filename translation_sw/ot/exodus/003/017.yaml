base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/017.yaml
  text: And I have said[a], ‘I will bring you up out of the affliction of Egypt to the land of the Canaanites, the Hittites, the Amorites, the Perizzites, the Hivites[b], and the Jebusites—to a land flowing with milk and honey.’
translation:
  language: sw
  text: Nami nimesema[a], ‘Nitawapandisha kutoka katika dhiki waliyopata Misri[b] hadi nchi ya Wakanaani, Wahiti, Waamori, Waperizi, Wahivi na Wayebusi—hadi nchi inayotiririka kwa maziwa na asali.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nami nilisema, ‘Nitawapandisha ...’” Kitenzi cha Kiebrania kina umbo la wakati uliopita; matini kuu inaonyesha kwamba tamko hilo bado lina umuhimu katika muktadha huu.
    reason: alternative_reading
  - marker: b
    text: “Dhiki waliyopata Misri” pia inaweza kutafsiriwa “mateso ya Misri,” “ukandamizaji huko Misri,” au “dhiki ya Misri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Nami nimesema
  rationale: Kitenzi cha Kiebrania kina umbo la wakati uliopita, lakini katika muktadha huu tamilifu ya Kiswahili inaonyesha tamko la Mungu lililotolewa na ambalo bado lina umuhimu wa sasa.
- source_word: אַעֲלֶה
  choice: Nitawapandisha
  rationale: Hifili ya עלה humaanisha ‘kusababisha kupanda’ au ‘kuwapandisha.’ Tafsiri hii inadumisha taswira ya kupanda iliyomo katika Kiebrania, ingawa ‘nitawatoa’ ingekuwa ya kawaida zaidi katika Kiswahili.
- source_word: מֵעֳנִי מִצְרַיִם
  choice: kutoka katika mateso ya Misri
  rationale: עֳנִי inaweza kumaanisha mateso, dhiki au ukandamizaji. Usemi huu unabaki karibu na muundo wa Kiebrania huku ukieleweka katika Kiswahili.
- source_word: אֶל אֶרֶץ
  choice: hadi nchi
  rationale: אֶל huonyesha mwendo kuelekea mahali fulani. ‘Hadi nchi’ huwasilisha mwisho wa safari kwa Kiswahili cha kawaida.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: Wakanaani, Wahiti, Waamori, Waperizi, Wahivi na Wayebusi
  rationale: Majina hayo yako katika umoja wa kimofolojia katika Kiebrania lakini yanataja makabila au jamii; maumbo ya wingi ndiyo ya kawaida na wazi katika Kiswahili.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: nchi inayotiririka maziwa na asali
  rationale: Tafsiri hii inadumisha sitiari ya Kiebrania ya nchi yenye rutuba na wingi badala ya kuifafanua kwa maneno yasiyomo katika matini.
theological_decisions:
- issue: Wakati na dhima ya tamko la ahadi ya Mungu
  choice: Nami nimesema, ‘Nitawapandisha ...’
  alternative: Nami nilisema, ‘Nitawapandisha ...’
  rationale: ‘Nimesema’ inadumisha asili ya tamko lililotolewa tayari na pia umuhimu wake unaoendelea katika hotuba hii, bila kuongeza madai ya kiteolojia yasiyotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo ‘nchi inayotiririka maziwa na asali’ umehifadhiwa kama sitiari ya kimatini; majina ya jamii yametolewa kwa maumbo ya kawaida ya Kiswahili.
