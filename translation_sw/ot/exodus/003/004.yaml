base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/004.yaml
  text: When Yahweh saw that he had turned aside to look[a], God called to him from the midst of the bush and said, “Moses, Moses!” And he said[c][b], “Here I am.”
translation:
  language: sw
  text: Yahwe alipoona kwamba Musa alikuwa amegeuka kando ili atazame, Mungu akamwita kutoka katikati ya kichaka[a], akisema, “Musa, Musa!” Musa akasema, “Mimi hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “kichaka” huenda likamaanisha hasa kichaka cha miiba.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa umbo la kawaida la Kiswahili badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: וַיַּרְא
  choice: alipoona
  rationale: Kitenzi ראה kina maana ya kawaida ya kuona; muundo wa “alipoona” unaunganisha kwa asili tendo hilo na mwito uliofuata.
- source_word: כִּי
  choice: kwamba
  rationale: 'Hapa כִּי inaanzisha yaliyoonwa na Yahwe: kwamba Mose alikuwa amegeuka.'
- source_word: סָר לִרְאוֹת
  choice: alikuwa amegeuka ili atazame
  rationale: סוּר inaonyesha kugeuka au kwenda kando, na לִרְאוֹת inaonyesha kusudi. “Ili atazame” ni Kiswahili cha asili katika muktadha huu.
- source_word: וַיִּקְרָא אֵלָיו
  choice: akamwita
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa kumwita mtu kwa sauti; unahifadhi mwelekeo wa mwito bila kuongeza maelezo yasiyokuwapo.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Tafsiri hii inahifadhi tofauti iliyomo katika mstari kati ya jina יְהוָה na jina la kawaida אֱלֹהִים.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: kutoka katikati ya kichaka
  rationale: “Kutoka katikati ya” linahifadhi taswira ya mahali iliyo katika Kiebrania; סְנֶה limetafsiriwa kwa neno linaloeleweka kwa urahisi “kichaka.”
- source_word: מֹשֶׁה מֹשֶׁה
  choice: Mose, Mose!
  rationale: Kurudiwa kwa jina kumehifadhiwa kwa kuwa kunaonyesha mwito wa moja kwa moja na wa binafsi.
- source_word: הִנֵּנִי
  choice: Mimi hapa
  rationale: Ni jibu la kawaida la Kiswahili linaloonyesha kuwapo na utayari bila kulipanua kuwa tamko la utii.
theological_decisions:
- issue: Kutofautisha יְהוָה na אֱלֹהִים katika mstari mmoja
  choice: יְהוָה limetafsiriwa “Yahwe,” na אֱלֹהִים limetafsiriwa “Mungu.”
  alternative: Kutafsiri yote mawili kuwa “Mungu,” au kutumia “BWANA” badala ya jina Yahwe.
  rationale: Kiebrania kinatumia majina hayo mawili kwa ukaribu; kuyatofautisha kunafanya maandishi chanzo yaonekane wazi bila kuyasawazisha kimakusudi.
- issue: Mhusika wa kitenzi cha mwisho וַיֹּאמֶר
  choice: Jina “Mose” limerudiwa katika “Mose akajibu.”
  alternative: Kutumia “naye akasema,” kama ilivyo kwa kiwakilishi kisicho wazi katika Kiebrania.
  rationale: Katika Kiswahili, kurudia jina kunazuia mkanganyiko kuhusu kama anayejibu ni Mungu au Mose, bila kubadili maana ya simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi takatifu. Muundo umewekwa wa kawaida kwa wasomaji wa leo, huku tofauti ya majina ya Mungu, marudio ya jina la Mose, na taswira ya mwito kutoka katikati ya kichaka vikihifadhiwa.
