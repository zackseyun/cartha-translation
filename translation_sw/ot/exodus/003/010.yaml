  text: וְ/עַתָּ֣ה לְכָ֔/ה וְ/אֶֽשְׁלָחֲ/ךָ֖ אֶל פַּרְעֹ֑ה וְ/הוֹצֵ֛א אֶת עַמִּ֥/י בְנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/010.yaml
  text: And now[a], come, and I will send you to Pharaoh, and bring my people, the sons of Israel, out of Egypt.
translation:
  language: sw
  text: Basi, nenda; nitakutuma kwa Farao, nawe uwatoe watu wangu, wana wa Israeli, kutoka Misri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Inaonyesha badiliko la hatua katika mazungumzo na kuhifadhi nguvu ya kiunganishi pamoja na maana ya wakati.
- source_word: לְכָה
  choice: nenda
  rationale: Amri ya הלך katika muktadha huu inamtuma Musa aondoke kwenda kwa Farao; Kiswahili ‘nenda’ kinaonyesha wazi mwelekeo wa utume.
- source_word: וְאֶשְׁלָחֲךָ
  choice: nitakutuma
  rationale: Huhifadhi kauli ya Mungu ya kumtuma Musa moja kwa moja bila kuongeza maana ya kusudi isiyo wazi katika Kiebrania.
- source_word: אֶל־פַּרְעֹה
  choice: kwa Farao
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuelekezwa kwa mtu, huku jina au cheo Farao likihifadhiwa.
- source_word: וְהוֹצֵא
  choice: nawe uwatoe
  rationale: Hiphil ya יצא ina maana ya kusababisha watoke; ‘uwatoe’ ni ya asili na huhifadhi maana hiyo ya kisababishi.
- source_word: עַמִּי
  choice: watu wangu
  rationale: Huhifadhi moja kwa moja lugha nzito ya uhusiano na umiliki wa agano.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi umbo la kifamilia na utambulisho wa ukoo katika Kiebrania; katika matumizi haya ‘wana’ linaweza kutaja wazao au jamii yote ya Israeli.
- source_word: מִמִּצְרָיִם
  choice: kutoka Misri
  rationale: Pamoja na ‘uwatoe,’ huu ni usemi wa kawaida wa Kiswahili unaoonyesha kuondolewa ndani ya nchi ya Misri.
theological_decisions:
- issue: Tafsiri ya jina la watu wa agano בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: ‘Wana wa Israeli’ huhifadhi picha ya ukoo na uhusiano na babu Israeli bila kuifanya kuwa ya kidhehebu. ‘Waisraeli’ ni fasaha zaidi lakini hupunguza umbo la kifamilia la chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umewekwa wa kawaida kwa wasomaji wa leo huku marudio na uzito wa agizo la Mungu vikihifadhiwa.
