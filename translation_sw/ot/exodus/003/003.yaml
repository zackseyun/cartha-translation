  yaml_path: translation/ot/exodus/003/003.yaml
  text: Then Moses said[a], “Let me turn aside and see this great sight, why the bush is not burned up.”
translation:
  language: sw
  text: Ndipo Musa akasema, “Nitageuka kando nione jambo hili kuu la ajabu, kwa nini kichaka hiki hakiteketei[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa nini kichaka hiki hakiungui,” au “kwa nini kichaka hiki hakiteketei kwa moto.”
    reason: Kitenzi cha Kiebrania kwa msingi humaanisha kuwaka au kuungua; katika muktadha huu kinaweza kueleweka kuwa kutoungua mpaka kuisha.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Kiunganishi cha usimulizi kinaendeleza mfululizo wa matukio; “ndipo” ni cha kawaida katika Kiswahili na kinaonyesha hatua inayofuata.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: אָסֻרָה נָּא
  choice: Ngoja nigeuke niende
  rationale: Kauli ya hiari pamoja na נָא inaonyesha azimio au kujihimiza kwa upole. “Ngoja” hulieleza hilo kwa Kiswahili cha kawaida, na “nigeuke niende” huonyesha kuondoka katika njia yake ili kukaribia.
- source_word: וְאֶרְאֶה
  choice: nikaone
  rationale: Kitenzi ראה hapa kinamaanisha kutazama au kuchunguza kwa macho; “nikaone” kinaunganisha kwa kawaida kusudi hilo na kitendo cha kugeuka na kwenda.
- source_word: הַמַּרְאֶה הַגָּדֹל הַזֶּה
  choice: mandhari hii ya ajabu
  rationale: מַרְאֶה ni kitu kinachoonekana. “Mandhari” huepuka kuifanya kwa lazima kuwa maono ya kinabii, huku “ya ajabu” ikiwasilisha ukubwa na mshangao wa jambo hilo kwa Kiswahili cha sasa.
- source_word: מַדּוּעַ
  choice: kwa nini
  rationale: Hii ndiyo njia ya kawaida ya kuuliza sababu katika Kiswahili.
- source_word: לֹא יִבְעַר
  choice: hakiteketei
  rationale: בער humaanisha kuwaka au kuungua. Katika muktadha huu kichaka tayari kinaonekana kuwaka, hivyo “hakiteketei” linaonyesha kwamba moto haukimalizi bila kuondoa kabisa upana wa maana ya kitenzi.
- source_word: הַסְּנֶה
  choice: kichaka
  rationale: סְנֶה ni kichaka, huenda chenye miiba, lakini matini hii haitaji ulazima wa kukibainisha kuwa kichaka cha miiba.
theological_decisions:
- issue: Namna ya kueleza kichaka kilichokuwa motoni
  choice: kwa nini kichaka hiki hakiteketei
  alternative: kwa nini kichaka hiki hakiungui; kwa nini kichaka hiki hakimalizwi na moto
  rationale: Kiebrania kinatumia kitenzi cha kuungua au kuwaka, si kitenzi cha moja kwa moja cha ‘kula’ au ‘kumaliza.’ Hata hivyo, muktadha unaonyesha kwamba ajabu ni kichaka kuwaka bila kuisha. Tafsiri kuu inalinda mshangao huo, na tanbihi inahifadhi uwezekano wa tafsiri iliyo karibu zaidi na kitenzi chenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imetumia usemi wa kawaida “Ngoja” bila kupunguza uzito wa usimulizi; “mandhari” huepuka dhana ya lazima ya maono ya kinabii.
