base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/002.yaml
  text: Then the angel of Yahweh appeared to him in a flame of fire from the midst of the bush. He looked[a], and behold, the bush was burning with fire, but the bush was not consumed.
translation:
  language: sw
  text: Ndipo malaika wa Yahweh[a] akamtokea katika mwali wa moto kutoka katikati ya kichaka. Musa akaona, na tazama, kichaka kilikuwa kikiwaka moto, lakini kichaka hakikuteketea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe wa Yahweh.” Neno la Kiebrania linaweza kumaanisha “malaika” au “mjumbe.”
    reason: Mbadala wa kileksika unaohifadhi upana wa maana ya מַלְאָךְ.
lexical_decisions:
- source_word: וַיֵּרָא
  choice: akamtokea
  rationale: Kauli ya Nifali ya ראה hapa inaeleza kujidhihirisha au kuonekana kwa mtu; “akamtokea” ni Kiswahili cha kawaida katika simulizi la ufunuo na pia kinaonyesha wazi anayepokea tukio.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: מַלְאַךְ inaweza kumaanisha “malaika” au “mjumbe.” Katika tukio hili la ajabu la kujidhihirisha kwa Mungu, “malaika” ndiyo maana ya asili zaidi, huku tanbihi ikihifadhi uwezekano wa “mjumbe.” Jina יהוה limetoholewa kuwa “Yahweh.”
- source_word: בְּלַבַּת אֵשׁ
  choice: katika mwali wa moto
  rationale: Neno לַבַּת linamaanisha mwali; tafsiri hii inahifadhi taswira ya Kiebrania bila kuifanya kuwa maelezo mapana yasiyokuwapo katika chanzo.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: kutoka katikati ya kichaka
  rationale: מִתּוֹךְ huonyesha kutoka ndani au katikati ya kitu. “Kichaka” ni neno la kawaida na linaloeleweka kwa סְנֶה katika muktadha huu.
- source_word: וַיַּרְא
  choice: Akaangalia
  rationale: Ingawa kitenzi kinaweza kutafsiriwa moja kwa moja “akaona,” hapa kinatanguliza kile Musa alichogundua; “akaangalia” linaeleza kwa kawaida kuelekeza macho kwake bila kuongeza tendo jipya.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: “Na tazama” linahifadhi nguvu ya הִנֵּה ya kuvuta fikira kwenye jambo la kushangaza, katika sajili ya simulizi yenye hadhi.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: kilikuwa kinawaka moto
  rationale: Umbo la sifa tendaji linaonyesha tendo linaloendelea; “kilikuwa kinawaka moto” ni la asili na linahifadhi kutajwa kwa moto.
- source_word: אֵינֶנּוּ אֻכָּל
  choice: hakikuteketea
  rationale: Kauli tendwa ya אכל hapa humaanisha kuangamizwa au kumalizwa na moto. “Hakikuteketea” ni fupi, wazi, na linahifadhi fumbo la kichaka kuwaka bila kuungua kabisa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מַלְאַךְ katika tukio la kujidhihirisha kwa Mungu
  choice: malaika
  alternative: mjumbe
  rationale: Neno la Kiebrania linaweza kutaja mjumbe wa kibinadamu au wa mbinguni. Muktadha wa moto kichakani unaunga mkono “malaika,” lakini tanbihi inahifadhi maana mbadala bila kumtambulisha malaika huyo kwa namna ya kiteolojia ambayo mstari wenyewe hauifafanui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa sasa lakini hadhi inayofaa simulizi la Biblia. Marudio ya “kichaka” yamehifadhiwa ili kufuata msisitizo wa Kiebrania; “na tazama” limetumiwa kama kiashiria cha mshangao wa kisimulizi.
