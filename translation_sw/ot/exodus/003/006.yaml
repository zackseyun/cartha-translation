  yaml_path: translation/ot/exodus/003/006.yaml
  text: Then he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, because he was afraid to look at God.
translation:
  language: sw
  text: Kisha akasema, “Mimi ni Mungu wa baba yako, Mungu wa Abrahamu, Mungu wa Isaka, na Mungu wa Yakobo.” Musa akaficha uso wake, kwa sababu aliogopa kumtazama Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha akasema
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha akasema” ni mtiririko wa kawaida wa Kiswahili na huhifadhi mfuatano.
- source_word: אָנֹכִי
  choice: Mimi ni
  rationale: Kiwakilishi huru kina mkazo; “Mimi ni” huhifadhi mkazo huo na kukamilisha kishazi cha utambulisho kwa Kiswahili cha kawaida.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: Mungu wa baba yako
  rationale: Huhifadhi umoja wa “baba” na muundo wa moja kwa moja wa utambulisho wa agano.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: Mungu wa Abrahamu, Mungu wa Isaka, na Mungu wa Yakobo
  rationale: Kurudia “Mungu wa” kunafuata marudio ya Kiebrania na kuhifadhi uzito wake wa kisemantiki na wa kiagano.
- source_word: וַיַּסְתֵּר
  choice: akaficha
  rationale: Hiphil ina maana ya kuficha au kusitiri; “akaficha” ni ya kawaida na inafaa kwa tendo la uso.
- source_word: פָּנָיו
  choice: uso wake
  rationale: Maana halisi ya uso inafaa kwa tendo la Musa la kuepusha macho yake.
- source_word: כִּי יָרֵא
  choice: kwa sababu aliogopa
  rationale: Huhifadhi uhusiano wa kisababishi wa כִּי na hali ya hofu inayoelezwa na יָרֵא.
- source_word: מֵהַבִּיט
  choice: kumtazama
  rationale: Baada ya kitenzi cha kuogopa, Kiswahili hutumia kwa kawaida kitenzi-jina; “kutazama” hudokeza kuelekeza macho kwa makusudi, kama kitenzi cha chanzo.
- source_word: אֶל הָאֱלֹהִים
  choice: Mungu
  rationale: Kiambishi cha yambwa katika “kumtazama” kinatoa kwa kawaida maana ya kumwangalia Mungu; muktadha humtambulisha wazi kuwa Mungu wa mababu.
theological_decisions:
- issue: Ufasiri wa אֱלֹהִים katika kujitambulisha kwa Mungu na ufunuo wa kichaka
  choice: Mungu
  alternative: kiumbe cha kimungu
  rationale: Muktadha humtambulisha msemaji wazi kuwa Mungu wa mababu; “Mungu” huhifadhi rejeleo hilo bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Marudio ya utambulisho wa Mungu kwa mababu
  choice: Mungu wa Abrahamu, Mungu wa Isaka, na Mungu wa Yakobo
  alternative: Mungu wa Abrahamu, Isaka na Yakobo
  rationale: Marudio ya “Mungu wa” yaliyomo katika Kiebrania yamehifadhiwa kwa sababu yana uzito wa balagha na wa kiagano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina “Abrahamu,” “Isaka,” na “Yakobo” yanafuata maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili. Hakuna tanbihi inayohitajika kwa aya hii.
