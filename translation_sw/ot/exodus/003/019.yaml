  text: But I know that the king of Egypt will not let you go[a], except by a strong hand.
translation:
  language: sw
  text: Lakini mimi najua kwamba mfalme wa Misri hatawaruhusu mwende[a] isipokuwa kwa mkono wa nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfalme wa Misri hatawaruhusu mwende, hata kwa mkono wa nguvu”; au, “isipokuwa kwa mkono hodari.” Kishazi cha Kiebrania kimefupishwa na kinaweza kusisitiza kwamba ni nguvu kubwa sana tu itakayomfanya Farao awaache waende.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha mkazo na utofautishaji; “Lakini mimi” huleta nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: יָדַעְתִּי
  choice: najua
  rationale: Kauli timilifu ya Kiebrania hapa inaeleza ujuzi wa Mungu ulio thabiti na wa sasa; “najua” ni ya asili katika muktadha huu.
- source_word: כִּי
  choice: kwamba
  rationale: Hutambulisha maudhui ya kile kinachojulikana.
- source_word: לֹא יִתֵּן אֶתְכֶם ... לַהֲלֹךְ
  choice: hatawaruhusu mwende
  rationale: Kitenzi נתן pamoja na hali-jina hapa ni nahau yenye maana ya kutoa ruhusa; “hatawaruhusu mwende” ni wazi na huonyesha kwamba wanaoambiwa ni wengi.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: mfalme wa Misri
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania.
- source_word: וְלֹא בְּיָד חֲזָקָה
  choice: isipokuwa kwa mkono wenye nguvu
  rationale: Hudumisha taswira muhimu ya “mkono” na ufupi wa kishazi cha Kiebrania, huku “isipokuwa” ikiwasilisha usomaji unaoungwa mkono na muktadha wa mstari unaofuata.
theological_decisions:
- issue: Maana ya kishazi kilichofupishwa וְלֹא בְּיָד חֲזָקָה
  choice: Farao hatawaacha waende isipokuwa kwa mkono wenye nguvu.
  alternative: Farao hatawaacha waende, hata kwa mkono wenye nguvu.
  rationale: Kiebrania kimefupisha kisarufi uhusiano wa kishazi hiki na kinachotangulia. Muktadha wa mstari wa 20 unaunga mkono maana kwamba nguvu kubwa ndiyo itakayomfanya Farao akubali, lakini usomaji mwingine halali umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mkono wenye nguvu” umehifadhiwa ili kuendeleza taswira kuu ya kitabu cha Kutoka bila kuongeza maelezo ndani ya mstari.
