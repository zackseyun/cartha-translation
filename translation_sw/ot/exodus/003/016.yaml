base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/016.yaml
  text: 'Go and gather the elders of Israel[a], and say to them, ‘Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me[b], saying: “I have surely attended to you and to what has been done to you in Egypt.”’'
translation:
  language: sw
  text: 'Nenda ukawakusanye wazee wa Israeli, uwaambie, ‘Yahweh, Mungu wa baba zenu[a]—Mungu wa Abrahamu, Isaka na Yakobo—amenitokea na kusema: “Hakika nimewajali[b] ninyi na yale mliyotendewa Misri.”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “baba zenu”; maneno yanayofuata yanawataja kuwa Abrahamu, Isaka na Yakobo.
    reason: lexical_clarification
  - marker: b
    text: Au, “Hakika nimewajia.” Kiebrania kinarudia mzizi wa kitenzi ili kukisisitiza; hapa kinaweza kumaanisha uangalifu wa Mungu wenye kusudi unaoongoza kwenye kuingilia kati, si ziara ya kawaida tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְאָסַפְתָּ
  choice: Nenda ukawakusanye
  rationale: Amri na kitenzi kinachofuata vimetafsiriwa kwa muundo wa kawaida wa Kiswahili unaohifadhi agizo la moja kwa moja na kusudi la kuwakutanisha viongozi.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: wazee wa Israeli
  rationale: Hili ni jina la kawaida la viongozi wa kijamii wa Israeli, si maelezo tu ya umri wao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limehifadhiwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Mungu wa baba zenu
  rationale: Neno la Kiebrania ni la kiume na muktadha unalitaja wazi kundi la mababu wakuu—Abrahamu, Isaka na Yakobo.
- source_word: נִרְאָה אֵלַי
  choice: amenitokea
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa kujidhihirisha kwa Mungu kwa mtu; huepuka tafsiri ngumu ya ‘alionekana nami.’
- source_word: פָּקֹד פָּקַדְתִּי
  choice: Hakika nimewajali
  rationale: Muundo wa Kiebrania unasisitiza kitenzi. ‘Nimewajali’ huonyesha kuwa Mungu amewaelekezea uangalifu wenye kusudi na unaoelekea kwenye hatua, si kwamba amewaona tu.
- source_word: וְאֶת הֶעָשׂוּי לָכֶם
  choice: na nimeona yale mliyotendewa
  rationale: Kiswahili huhitaji uhusiano wa kitenzi uwe wazi; ‘nimeona’ inaendeleza wazo la uangalifu wa Mungu, huku ‘mliyotendewa’ ikihifadhi hali ya kutotajwa kwa waliowatendea.
- source_word: בְּמִצְרָיִם
  choice: nchini Misri
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha mahali ambako Israeli walitendewa hayo.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la agano. ‘Yahweh’ hulihifadhi kama jina na halibadilishi kuwa cheo.
- issue: Maana ya פקד katika kauli iliyosisitizwa
  choice: Hakika nimewajali
  alternative: Hakika nimewajia; Hakika nimewaangalia
  rationale: Kitenzi kinaweza kumaanisha kuwatembelea au kuwaelekezea uangalifu kwa kusudi la kuchukua hatua. Tafsiri kuu inaonyesha kujali kwa vitendo bila kuifanya ziara ya kijamii, huku tanbihi ikihifadhi uwezekano wa ‘kuwajia.’
- issue: Utambulisho wa ‘baba zenu’
  choice: Mungu wa baba zenu
  alternative: Mungu wa mababu zenu
  rationale: Kutajwa mara moja kwa Abrahamu, Isaka na Yakobo kunaonyesha kuwa usemi huu una mwelekeo maalumu kwa baba wa ukoo wa agano; tanbihi inafafanua hilo bila kupanua matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa hotuba ya moja kwa moja na utambulisho wa Mungu umehifadhiwa, huku sentensi ikipangwa kwa mtiririko wa asili wa Kiswahili.
