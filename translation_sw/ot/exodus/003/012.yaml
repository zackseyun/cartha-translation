base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/012.yaml
  text: 'And he said[a], “Certainly I will be with you, and this will be the sign for you that I have sent you: when you bring the people out of Egypt, you will serve God on this mountain.”'
translation:
  language: sw
  text: 'Akasema, “Hakika nitakuwa pamoja nawe, na hii ndiyo ishara kwako kwamba mimi ndiye niliyekutuma: utakapowatoa watu Misri, mtamtumikia Mungu[a] juu ya mlima huu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtamwabudu Mungu.” Kitenzi cha Kiebrania kinaweza kumaanisha “kutumikia” na, kinapotumiwa kumhusu Mungu, “kuabudu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אֶהְיֶה עִמָּךְ
  choice: Hakika nitakuwa pamoja nawe
  rationale: כִּי ina nguvu ya uhakikisho katika jibu hili, nayo אֶהְיֶה inaelekea wakati ujao na kuahidi kuwapo kwa Mungu pamoja na Musa.
- source_word: וְזֶה לְּךָ הָאוֹת
  choice: na hii ndiyo itakayokuwa ishara kwako
  rationale: Muundo wa Kiswahili unaonyesha kuwa ishara hiyo ni ya wakati ujao, kama inavyofafanuliwa na tukio la kumtumikia Mungu baada ya kutoka Misri.
- source_word: כִּי אָנֹכִי שְׁלַחְתִּיךָ
  choice: kwamba mimi nimekutuma
  rationale: Kiwakilishi אָנֹכִי kina msisitizo; neno “mimi” linauonyesha bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: בְּהוֹצִיאֲךָ אֶת־הָעָם מִמִּצְרַיִם
  choice: utakapowatoa watu Misri
  rationale: 'בְּ pamoja na kitenzi-jina na kiambishi cha nafsi ya pili hutumika kwa maana ya wakati: Musa ndiye anayewaongoza watu watoke Misri.'
- source_word: תַּעַבְדוּן אֶת־הָאֱלֹהִים
  choice: mtamtumikia Mungu
  rationale: עבד inaweza kumaanisha kutumikia na, inapomhusu Mungu, kuabudu. “Mtamtumikia” huhifadhi upana huo wa maana; umbo la wingi linawahusu Musa pamoja na watu.
- source_word: עַל הָהָר הַזֶּה
  choice: juu ya mlima huu
  rationale: “Juu ya” huhifadhi maana ya kawaida ya עַל na mahali halisi panapotajwa katika simulizi.
theological_decisions:
- issue: Asili ya “ishara” iliyoahidiwa
  choice: Ishara inaelekezwa kwenye tukio la baadaye la Israeli kumtumikia au kumwabudu Mungu katika mlima huu baada ya kutoka Misri.
  alternative: Ishara ni ahadi ya sasa ya Mungu kuwa pamoja na Musa, au inajumuisha ahadi hiyo na utimilifu wa baadaye.
  rationale: Mtiririko wa sentensi unaunganisha ishara kwa kawaida zaidi na kishazi kinachofuata, lakini tafsiri haiongezi ufafanuzi unaofuta mvutano wa kuwa ishara hiyo itatimia baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. “Mtamtumikia” huhifadhi utofauti kati ya Musa anayewatoa watu (umoja) na jumuiya nzima itakayomtumikia Mungu (wingi).
