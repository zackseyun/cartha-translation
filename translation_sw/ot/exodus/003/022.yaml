base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/022.yaml
  text: Each woman shall ask from her neighbor and from the woman staying in her house articles of silver and articles of gold[a], and clothing; and you shall put them on your sons and on your daughters[c][b]. So you will plunder Egypt.
translation:
  language: sw
  text: Kila mwanamke ataomba[a] vitu vya fedha, vitu vya dhahabu na mavazi kutoka kwa jirani yake na kutoka kwa mwanamke mkaaji katika nyumba yake[b]. Nanyi mtawavisha vitu hivyo wana wenu na binti zenu. Hivyo mtaipora Misri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ataomba apewe.” Tafsiri ya jadi “atakopa” si lazima hapa, kwa kuwa kitenzi cha Kiebrania kimsingi humaanisha “kuomba” au “kutaka upewe.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa mwanamke mgeni au mkaaji wa muda katika nyumba yake.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mtaivua Misri mali zake” au “mtainyang’anya Misri mali zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלָה
  choice: ataomba
  rationale: Kitenzi שׁאל kimsingi humaanisha kuomba au kutaka upewe kitu; hakidokezi lazima kwamba vitu hivyo vitakopwa na kurudishwa.
- source_word: אִשָּׁה
  choice: Kila mwanamke
  rationale: Umoja usio bainifu umetumiwa kwa maana ya kugawa kwa kila mmoja; Kiswahili cha kawaida huwasilisha maana hiyo wazi kwa ‘kila mwanamke.’
- source_word: מִשְּׁכֶנְתָּהּ
  choice: kutoka kwa jirani yake
  rationale: Nomino ya Kiebrania ni ya kike na katika muktadha inamtaja jirani mwanamke, lakini ‘jirani yake’ ni Kiswahili cha asili kwa kuwa jinsia tayari inaeleweka kutokana na sentensi.
- source_word: וּמִגָּרַת בֵּיתָהּ
  choice: kutoka kwa mwanamke anayeishi nyumbani mwake
  rationale: Umbo la kitenzi kutoka גור humaanisha mwanamke anayekaa au kuishi hapo, huenda kwa muda au akiwa mgeni; tafsiri hii ni wazi bila kufunga maana kwenye hali moja tu ya ukaaji.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: vitu vya fedha, vitu vya dhahabu
  rationale: כְּלִי ni neno pana linaloweza kumaanisha chombo au kitu cha aina mbalimbali; ‘vitu’ huepuka kuvibainisha isivyohitajika kuwa vyombo au vito.
- source_word: וּשְׂמָלֹת
  choice: mavazi
  rationale: Neno hili lina maana ya jumla ya nguo au mavazi, na ‘mavazi’ ni la sasa, pana na lenye heshima.
- source_word: וְשַׂמְתֶּם עַל
  choice: mtawavisha vitu hivyo
  rationale: Kiebrania kinasema kuviweka vitu hivyo juu ya watoto. Katika Kiswahili, ‘kuwavisha vitu hivyo’ huwasilisha kwa kawaida kitendo cha kuwavalisha mavazi na kuwawekea vitu vya thamani.
- source_word: בְּנֵיכֶם ... בְּנֹתֵיכֶם
  choice: wana wenu na binti zenu
  rationale: Kiebrania kinataja wazi wana wa kiume na mabinti, kwa hiyo makundi yote mawili yamehifadhiwa badala ya kujumlishwa kuwa ‘watoto.’
- source_word: וְנִצַּלְתֶּם אֶת מִצְרָיִם
  choice: Hivyo mtaipora Misri
  rationale: Katika piel, נצל hapa hubeba maana yenye nguvu ya kupora, kuvua au kunyang’anya mali; ‘mtaipora’ ni wazi na ya kawaida bila kuipunguza nguvu ya kauli.
theological_decisions:
- issue: Uwezekano wa kupunguza uzito wa kimaadili na kiteolojia wa Waisraeli kuchukua mali ya Wamisri
  choice: Hivyo mtaipora Misri
  alternative: Hivyo mtaivua Misri mali zake
  rationale: Kiebrania hakisemi kwamba vitu hivyo vilikopwa kwa sharti la kurudishwa, bali kinaonyesha kugeuzwa kwa hali ya ukandamizaji kwa tendo lenye nguvu la kuipokonya Misri mali. Tafsiri haiingizi udanganyifu wa kukopa wala hailainishi נצל.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa orodha umefanywa wa asili katika Kiswahili huku mahusiano yote ya Kiebrania yakihifadhiwa. ‘Fedha’ hapa ni metali ya silver, ikilinganishwa moja kwa moja na dhahabu.
