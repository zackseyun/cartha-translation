id: EXO.3.1
reference: Exodus 3:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מֹשֶׁ֗ה הָיָ֥ה רֹעֶ֛ה אֶת צֹ֛אן יִתְר֥וֹ חֹתְנ֖/וֹ כֹּהֵ֣ן מִדְיָ֑ן וַ/יִּנְהַ֤ג אֶת הַ/צֹּאן֙ אַחַ֣ר הַ/מִּדְבָּ֔ר וַ/יָּבֹ֛א אֶל הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽבָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/001.yaml
  text: Moses was shepherding the flock of Jethro his father-in-law[a], the priest of Midian. He led the flock beyond the wilderness and came to the mountain of God, Horeb.
translation:
  language: sw
  text: Musa alikuwa akilichunga kundi la Yethro, mkwe wake, kuhani wa Midiani. Akaliongoza kundi hadi upande wa pili wa nyika[a], akafika kwenye mlima wa Mungu, Horebu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyuma ya nyika.”
    reason: Kirai אַחַר הַמִּדְבָּר kinaweza kueleweka kwa namna ya mahali kuwa “upande wa pili wa nyika” au, kwa kufuata umbo lake kwa karibu zaidi, “nyuma ya nyika.”
lexical_decisions:
- source_word: וּ/מֹשֶׁה
  choice: Musa
  rationale: Kiunganishi kinaanzisha tukio jipya; Kiswahili hakihitaji kuongeza neno la wakati kama “sasa,” kwa hiyo jina linaanza sentensi kwa kawaida.
- source_word: הָיָה רֹעֶה
  choice: alikuwa akilichunga
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati uliopita; “alikuwa akilichunga” ni wa kawaida na huhifadhi hali hiyo.
- source_word: צֹאן
  choice: kundi
  rationale: Neno la Kiebrania linamaanisha mifugo midogo kwa pamoja, mara nyingi kondoo na mbuzi; “kundi” ni tafsiri ya kawaida isiyolazimisha aina moja tu.
- source_word: יִתְרוֹ
  choice: Yethro
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: חֹתְנוֹ
  choice: mkwe wake
  rationale: “Mkwe wake” ni usemi wa asili wa Kiswahili kwa uhusiano wa kindoa unaotajwa hapa, bila kuongeza maelezo yasiyo katika kirai chenyewe.
- source_word: כֹּהֵן מִדְיָן
  choice: kuhani wa Midiani
  rationale: Tafsiri hii inaonyesha uhusiano wa moja kwa moja wa muundo wa Kiebrania na kumtambulisha Yethro.
- source_word: וַיִּנְהַג
  choice: Akaliongoza
  rationale: Kitenzi kinaweza kumaanisha kuendesha au kuongoza kundi; “akaliongoza” ni cha kawaida na hakiongezi dhana ya ukali.
- source_word: אַחַר הַמִּדְבָּר
  choice: hadi upande wa pili wa nyika
  rationale: Katika muktadha huu wa mahali, kirai kinaelekea kumaanisha upande wa mbali au ng’ambo ya nyika; tafsiri hii ni wazi huku mbadala wa karibu ukiwekwa katika tanbihi.
- source_word: וַיָּבֹא
  choice: akafika
  rationale: Katika simulizi ya safari, “akafika” huwasilisha kwa kawaida kuwasili kunakoonyeshwa na kitenzi.
- source_word: הַר הָאֱלֹהִים
  choice: mlima wa Mungu
  rationale: Tafsiri ya moja kwa moja huhifadhi uwezekano kwamba jina hili ni la kutazamia mbele, la kurejea nyuma, au tayari lilikuwa linajulikana.
- source_word: חֹרֵבָה
  choice: Horebu
  rationale: Kiishio cha mahali katika Kiebrania kinaonyesha mwendo kuelekea Horebu; katika Kiswahili, maana hiyo tayari inabebwa na “akafika kwenye mlima,” huku Horebu ikitaja mlima huo.
theological_decisions:
- issue: Ikiwa הַר הָאֱלֹהִים itafsiriwe kana kwamba mlima ulikuwa tayari mtakatifu au ulitambuliwa hivyo baadaye
  choice: mlima wa Mungu
  alternative: mlima mtakatifu
  rationale: “Mlima wa Mungu” hufuata Kiebrania bila kuamua ikiwa jina hilo ni la kutazamia mbele, la kurejea nyuma, au jina lililokuwa tayari linatumika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi na hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Mfuatano “akaliongoza … akafika” unaonyesha maendeleo ya simulizi kwa njia ya asili.
