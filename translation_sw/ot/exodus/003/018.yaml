  text: וְ/שָׁמְע֖וּ לְ/קֹלֶ֑/ךָ וּ/בָאתָ֡ אַתָּה֩ וְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל אֶל מֶ֣לֶךְ מִצְרַ֗יִם וַ/אֲמַרְתֶּ֤ם אֵלָי/ו֙ יְהוָ֞ה אֱלֹהֵ֤י הָֽ/עִבְרִיִּים֙ נִקְרָ֣ה עָלֵ֔י/נוּ וְ/עַתָּ֗ה נֵֽלֲכָה נָּ֞א דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בַּ/מִּדְבָּ֔ר וְ/נִזְבְּחָ֖ה לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/018.yaml
  text: And they will listen to your voice[a], and you and the elders of Israel will go to the king of Egypt and say to him, ‘Yahweh, the God of the Hebrews, has met with us. And now, please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God.’
translation:
  language: sw
  text: Nao wataisikiliza sauti yako. Kisha wewe pamoja na wazee wa Israeli mtakwenda kwa mfalme wa Misri na kumwambia, ‘Yahweh, Mungu wa Waebrania, amekutana nasi.[a] Na sasa, tafadhali, turuhusu kwenda safari ya siku tatu jangwani, ili tumtolee Yahweh Mungu wetu dhabihu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ametujia.” Kifungu cha Kiebrania kinaweza kuonyesha kwamba Yahweh amewafikia au amekutana nao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ לְקֹלֶךָ
  choice: wataisikiliza sauti yako
  rationale: Kitenzi שׁמע kinaweza kumaanisha kusikia, kusikiliza, au kutii. ‘Wataisikiliza sauti yako’ kinahifadhi nahau ya Kiebrania na kudokeza kupokea ujumbe kwa kuitikia bila kutafsiri moja kwa moja kuwa utii.
- source_word: וּבָאתָ אַתָּה וְזִקְנֵי יִשְׂרָאֵל
  choice: wewe pamoja na wazee wa Israeli mtakwenda
  rationale: Ingawa kitenzi cha Kiebrania kina umoja kabla ya kiima kilichopanuliwa, Kiswahili cha kawaida hutumia wingi kwa Musa na wazee kwa pamoja. ‘Mtakwenda’ linafaa kwa mwendo kuelekea kwa mfalme wa Misri.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: mfalme wa Misri
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa umilikaji wa Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limewasilishwa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי הָעִבְרִיִּים
  choice: Mungu wa Waebrania
  rationale: Linahifadhi wazi jina la kikabila lililotumiwa katika matini chanzo.
- source_word: נִקְרָה עָלֵינוּ
  choice: amekutana nasi
  rationale: Nifali ya קרא pamoja na עַל hapa huonyesha kukutana au kufikiwa katika tukio la kimungu. ‘Amekutana nasi’ ni ya kawaida na haiongezi kwa lazima wazo maalumu la kuitwa.
- source_word: וְעַתָּה נֵלֲכָה נָּא
  choice: Basi sasa, tafadhali turuhusu twende
  rationale: Kohortativi pamoja na נָא inaonyesha ombi la heshima kwa mfalme. ‘Turuhusu twende’ huweka wazi kwamba kibali chake kinaombwa.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: safari ya siku tatu
  rationale: Ni usemi wa Kiebrania unaoeleza muda au umbali wa safari; Kiswahili hiki ni cha kawaida na sahihi.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: Katika muktadha wa kitenzi cha mwendo, ‘jangwani’ huonyesha mahali wanapoelekea bila kuifanya lazima iwe jangwa la mchanga pekee.
- source_word: וְנִזְבְּחָה לַיהוָה אֱלֹהֵינוּ
  choice: ili tumtolee Yahweh Mungu wetu dhabihu
  rationale: Kohortativi ya pili inaeleza kusudi la safari. Muundo ‘kumtolea ... dhabihu’ ni Kiswahili cha asili na huhifadhi Yahweh kuwa mpokeaji wa dhabihu.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini inatumia jina la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya נִקְרָה עָלֵינוּ katika lugha ya kukutana na Mungu
  choice: amekutana nasi
  alternative: ametujia; ametufikia; ametuita
  rationale: Chaguo hili huhifadhi wazo pana la tukio la kukutana na Mungu bila kulazimisha maana finyu ya mwito au kutokea kwa namna maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau ya ‘kuisikiliza sauti’ imehifadhiwa kwa sababu inaeleweka na kubeba maana ya kusikia kwa kuitikia. Alama ya tanbihi imewekwa baada ya kifungu kinachohusika, yaani ‘amekutana nasi.’
