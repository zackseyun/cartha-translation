base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/009.yaml
  text: And now[a], behold, the cry of the sons of Israel has come to me[b], and I have also seen the oppression with which the Egyptians are oppressing them.
translation:
  language: sw
  text: Na sasa[a], tazama, kilio cha wana wa Israeli kimenifikia[b], nami nimeuona pia ukandamizaji ambao Wamisri wanawafanyia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wa Israeli” au “Waisraeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kilio cha wana wa Israeli kimekuja kwangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi na alama ya wakati, huku ikifanya mpito wa mazungumzo uwe wa kawaida katika Kiswahili.
- source_word: הִנֵּה
  choice: tazama
  rationale: Ni neno la kuvuta usikivu; “tazama” lina hadhi na linaeleweka katika Kiswahili cha sasa.
- source_word: צַעֲקַת
  choice: kilio
  rationale: Linaonyesha kilio kinachotokana na dhiki; “kilio” ni cha moja kwa moja na cha kawaida.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi nahau ya kifamilia ya Kiebrania na umbo lake la kiume bila kuibadili kuwa jina la kitaifa pekee.
- source_word: בָּאָה אֵלַי
  choice: kimenifikia
  rationale: Ni Kiswahili cha kawaida kwa wazo la kilio ‘kuja kwangu’; pia kinadumisha maana kwamba kilio kimemfikia Mungu.
- source_word: וְגַם
  choice: nami ... pia
  rationale: Inahifadhi maana ya nyongeza na msisitizo kwa mtiririko wa kawaida wa Kiswahili.
- source_word: רָאִיתִי
  choice: nimeuona
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililotimia lenye umuhimu wa sasa katika muktadha.
- source_word: הַלַּחַץ
  choice: ukandamizaji
  rationale: Linafaa kwa shinikizo la kijamii na la kulazimisha ambalo Wamisri waliwatendea Israeli.
- source_word: מִצְרַיִם
  choice: Wamisri
  rationale: Ingawa umbo hilo ni jina ‘Misri,’ hapa linafanya kazi kwa maana ya watu wa Misri, na kitenzi kishirikishi cha wingi kinaunga mkono tafsiri hii.
- source_word: לֹחֲצִים
  choice: wanawakandamiza
  rationale: Umbo la kishirikishi linaonyesha tendo linaloendelea; kitenzi hiki pia kinahifadhi uhusiano wa kimzizi na nomino ‘ukandamizaji.’
- source_word: אֹתָם
  choice: wa-
  rationale: Kiambishi cha yambwa katika “wanawakandamiza” kinawarejelea wana wa Israeli.
theological_decisions:
- issue: Mtajo wa kiagano wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: “Wana wa Israeli” inahifadhi nahau ya kifamilia na umbo la kiume la chanzo bila kudokeza kuwa wanaume pekee ndio waliokusudiwa.
- issue: Nguvu ya usemi הִנֵּה
  choice: tazama
  alternative: angalia; naam
  rationale: “Tazama” inadumisha mwito wa usikivu kwa lugha yenye hadhi lakini inayoeleweka, bila kuondoa msisitizo wa chanzo.
- issue: Misri kama jina la mahali linalowakilisha watu
  choice: Wamisri
  alternative: Misri
  rationale: Muktadha na kitenzi cha wingi vinaelekeza kwa watu wanaotekeleza ukandamizaji; “Wamisri” huweka jambo hilo wazi bila kuongeza fundisho la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “ukandamizaji ambao ... wanawakandamiza nao” kwa makusudi unahifadhi uradidi wa kimzizi uliopo katika Kiebrania, ingawa ni mzito kidogo kuliko usemi wa kawaida.
