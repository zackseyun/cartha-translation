base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/036.yaml
  text: And Yahweh gave the people favor in the eyes of the Egyptians[a], so that they let them have what they asked; and they plundered Egypt.
translation:
  language: sw
  text: BWANA akawajalia watu hao kibali machoni pa Wamisri, hata Wamisri wakawapa walichowaomba[a]; watu hao wakaipora Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya kimapokeo zaidi, “Wamisri wakawakopesha.” Kitenzi cha Kiebrania hapa kinaweza kueleweka ama kuwa “kuwakopesha” au kuwa “kuwapa walichoomba.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַֽיהוָה
  choice: BWANA
  rationale: Jina la agano יהוה limetafsiriwa kwa namna ya heshima iliyozoeleka katika Biblia za Kiswahili, kwa herufi kubwa ili kulitofautisha na cheo cha kawaida ‘Bwana’.
- source_word: נָתַן אֶת־חֵן
  choice: akawajalia ... kibali
  rationale: Muundo huu unaonyesha kwamba BWANA aliwapa watu hali ya kukubaliwa na kutendewa kwa nia njema; ‘akawajalia kibali’ ni Kiswahili cha sasa, cha heshima, kinachohifadhi tendo la Mungu.
- source_word: בְּעֵינֵי מִצְרַיִם
  choice: machoni pa Wamisri
  rationale: Huhifadhi tamathali ya Kiebrania ‘machoni pa’ kwa namna inayoeleweka katika Kiswahili, huku מִצְרַיִם ikirejelea Wamisri kama watu katika kishazi hiki.
- source_word: וַיַּשְׁאִלוּם
  choice: nao wakawapa walichowaomba
  rationale: Katika muktadha huu Hifili ya שאל inaonyesha Wamisri kuitikia maombi ya Waisraeli kwa kuwapa vitu walivyoomba. Tafsiri hii ni ya kawaida zaidi kuliko kudokeza mkopo wa kawaida, lakini uwezekano wa maana ‘wakawakopesha’ umehifadhiwa katika tanbihi.
- source_word: וַיְנַצְּלוּ אֶת־מִצְרָיִם
  choice: Hivyo wakaipora Misri
  rationale: Pieli ya נצל hapa ina nguvu ya kuvua mali au kupora. ‘Wakaipora Misri’ ni fupi, wazi, na huhifadhi Misri kama kitu cha pamoja kilichoporwa.
theological_decisions:
- issue: Iwapo וַיַּשְׁאִלוּם itafsiriwe kama kukopesha au kama kutoa kilichoombwa
  choice: nao wakawapa walichowaomba
  alternative: nao wakawakopesha
  rationale: Kitenzi kinaweza kueleweka kwa mapokeo kama kukopesha, lakini muktadha unasisitiza kwamba Wamisri waliitikia maombi yao na kwamba Misri iliporwa, si kwamba ulifanyika mkopo wa kawaida wenye matarajio dhahiri ya kulipwa. Tanbihi inahifadhi uwezekano halisi wa kileksia bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Watu hao’ hufanya rejeleo la הָעָם liwe wazi bila kuongeza utambulisho usiotajwa moja kwa moja katika mstari. Kiunganishi ‘Hivyo’ kinaonyesha matokeo ya tendo lililotangulia.
