  yaml_path: translation/ot/exodus/012/002.yaml
  text: This month shall be for you the beginning of months[a]; it shall be the first month of the year for you.
translation:
  language: sw
  text: “Mwezi huu utakuwa mwanzo wa miezi kwenu; utakuwa mwezi wa kwanza wa mwaka kwenu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  choice: Mwezi huu
  rationale: Katika muktadha huu wa kuweka kalenda, חֹדֶשׁ humaanisha mwezi wa kalenda. Kiswahili ‘mwezi huu’ ni cha kawaida na pia kinaweza kuhusiana kiasili na mzunguko wa mwezi angani bila kuhitaji tanbihi.
- source_word: לָכֶם
  choice: kwenu
  rationale: Kiambishi hiki kinaonyesha jambo linalowekwa kwa habari ya Waisraeli. ‘Kwenu’ ni usemi wa asili wa Kiswahili unaodumisha rejeo hilo.
- source_word: רֹאשׁ חֳדָשִׁים
  choice: mwanzo wa miezi
  rationale: Ingawa רֹאשׁ kimsingi ni ‘kichwa,’ katika mpangilio wa wakati humaanisha mwanzo au nafasi ya kwanza. ‘Mwanzo wa miezi’ hudumisha muundo na maana ya Kiebrania kwa lugha ya kawaida.
- source_word: רִאשׁוֹן
  choice: mwezi wa kwanza
  rationale: Neno hili linaonyesha wazi nafasi ya kwanza katika mpangilio. Kurudia ‘mwezi’ kunafanya sentensi iwe wazi na ya asili katika Kiswahili.
- source_word: הוּא
  choice: utakuwa
  rationale: Kiwakilishi hicho huunganisha kiarifu na ‘mwezi huu.’ Wakati ujao hapa unafaa kwa nguvu ya agizo linaloweka utaratibu wa kalenda.
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: wa mwaka
  rationale: Kirai hiki kinaonyesha kwamba mwezi huo ni wa kwanza katika miezi ya mwaka. ‘Wa mwaka’ ni kifupi, wazi, na cha kawaida katika Kiswahili.
theological_decisions:
- issue: Nguvu ya kishazi cha Kiebrania kisicho na kitenzi katika muktadha wa sheria
  choice: 'Kutumia wakati ujao wenye nguvu ya kuanzisha utaratibu: ‘utakuwa’'
  alternative: 'Kutumia wakati wa sasa: ‘ni’'
  rationale: Kiebrania hakina kitenzi kilicho wazi hapa, lakini muktadha ni agizo la Mungu linaloweka kalenda ya Israeli. ‘Utakuwa’ huonyesha tendo hilo la kuanzisha utaratibu bila kuongeza fundisho la kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa urahisi. Hakuna tanbihi iliyohitajika kwa sababu ‘mwezi’ katika Kiswahili linaweza kutaja mwezi angani na pia kipindi cha kalenda, huku muktadha ukibainisha maana inayokusudiwa.
