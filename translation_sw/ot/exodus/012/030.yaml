  text: וַ/יָּ֨קָם פַּרְעֹ֜ה לַ֗יְלָה ה֤וּא וְ/כָל עֲבָדָי/ו֙ וְ/כָל מִצְרַ֔יִם וַ/תְּהִ֛י צְעָקָ֥ה גְדֹלָ֖ה בְּ/מִצְרָ֑יִם כִּֽי אֵ֣ין בַּ֔יִת אֲשֶׁ֥ר אֵֽין שָׁ֖ם מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/030.yaml
  text: And Pharaoh rose in the night[a], he and all his servants and all Egypt, and there was a great cry in Egypt[b], for there was no house where there was not someone dead.
translation:
  language: sw
  text: Farao akaamka usiku huo, yeye pamoja na watumishi wake wote na Wamisri wote.[a] Kukawa na kilio kikubwa nchini Misri, kwa maana hapakuwa na nyumba ambayo ndani yake hakukuwa na mtu aliyekufa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia jina “Misri” kwa maana ya pamoja, likiwataja watu wa Misri.
    reason: cultural_note
  - marker: b
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kiebrania: “hapakuwa na nyumba ambayo ndani yake hakukuwa na mtu mfu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaamka
  rationale: Qal wayyiqtol ya קום inaeleza tendo la simulizi lililotokea; “akaamka” ni Kiswahili cha kawaida na kinafaa kwa tukio la usiku.
- source_word: לַיְלָה הוּא
  choice: usiku huo
  rationale: Kirai hiki kinataja wakati maalumu; “usiku huo” ni cha asili katika simulizi la Kiswahili na huhifadhi rejeo la usiku unaozungumziwa.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika mazingira ya jumba la kifalme, עֶבֶד inaweza kutaja watumishi au maafisa wa Farao bila kulazimisha maana ya utumwa kama jambo linalosisitizwa hapa.
- source_word: וְכָל מִצְרַיִם
  choice: Wamisri wote
  rationale: Jina la nchi limetumiwa kimajazi kuwataja watu wake. Kiswahili cha kawaida hutumia “Wamisri wote” kwa uwazi huku kikihifadhi upeo wa jumla.
- source_word: צְעָקָה גְדֹלָה
  choice: kilio kikubwa
  rationale: צְעָקָה ni kilio au mayowe ya dhiki; “kilio kikubwa” hudumisha nguvu ya hisia na kivumishi גְדֹלָה kwa lugha ya kawaida na yenye hadhi.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי hapa huanzisha sababu ya kilio kikubwa; “kwa maana” huonyesha uhusiano huo wa kisababishi katika mtindo wa simulizi.
- source_word: אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת
  choice: hapakuwa na nyumba ambayo ndani yake hakukuwa na mtu aliyekufa
  rationale: Tafsiri hii huhifadhi muundo wa Kiebrania wenye ukanushi unaorudiwa na neno halisi “nyumba,” huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: מֵת
  choice: mtu aliyekufa
  rationale: Umbo hili linatumika kama nomino kumaanisha mtu mfu; “mtu aliyekufa” ni wazi na la asili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ukanushi unaorudiwa umehifadhiwa ili kuonyesha msisitizo wa Kiebrania. Alama za tanbihi zimewekwa katika matini kuu na kuhusishwa na maelezo yanayofaa.
