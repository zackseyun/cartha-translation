base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/046.yaml
  text: It shall be eaten in one house; you shall not take any of the meat outside the house[a], and you shall not break a bone of it.
translation:
  language: sw
  text: Italiwa katika nyumba moja[a]; msitoe nyama yoyote nje ya nyumba hiyo, wala msivunje mfupa wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kaya moja.” Neno la Kiebrania linaweza kumaanisha nyumba yenyewe au watu wa kaya waliokusanyika humo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַיִת אֶחָד
  choice: katika nyumba moja
  rationale: בַּיִת inaweza kumaanisha jengo la nyumba au watu wa nyumba hiyo. Muktadha wa kutotoa nyama nje unaunga mkono maana halisi ya mahali, “nyumba,” huku dokezo la kaya likihifadhiwa katika tanbihi.
- source_word: יֵאָכֵל
  choice: italiwa
  rationale: Kauli tendwa ya wakati ujao huhifadhi muundo wa Kiebrania na nguvu ya agizo katika Kiswahili cha kawaida.
- source_word: לֹא תוֹצִיא
  choice: msitoe
  rationale: Kitenzi hiki ni katazo linaloelekezwa kwa wingi na humaanisha kusababisha kitu kitoke; “msitoe” ni usemi wa kawaida na sahihi.
- source_word: מִן הַבָּשָׂר
  choice: nyama yoyote
  rationale: Katika muktadha wa chakula, בָּשָׂר hutafsiriwa kwa kawaida kuwa “nyama”; “yoyote” huonyesha maana ya sehemu katika katazo—hakuna sehemu ya nyama itakayotolewa.
- source_word: מִן הַבַּיִת ... חוּצָה
  choice: nje ya nyumba hiyo
  rationale: Mchanganyiko huu unaonyesha mwendo kutoka ndani hadi nje. “Nje ya nyumba hiyo” ni wa asili katika Kiswahili na huweka wazi nyumba iliyotajwa tayari.
- source_word: וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  choice: wala msivunje mfupa wake
  rationale: 'Umoja “mfupa” una maana ya kugawa: hakuna hata mfupa mmoja uvunjwe. “Wake” hurejelea mnyama wa Pasaka bila kuingiza nomino mahususi ambayo haikutajwa katika aya yenyewe.'
theological_decisions:
- issue: Kirejelewa cha kiwakilishi בוֹ mwishoni mwa aya
  choice: mnyama wa Pasaka kwa ujumla (“mfupa wake”)
  alternative: mwana-kondoo hasa
  rationale: Kiwakilishi cha Kiebrania ni cha kiume, umoja, na kinarejelea mnyama wa Pasaka anayezungumziwa. “Wake” huhifadhi kirejelewa hicho bila kuongeza umahususi ambao aya yenyewe hauelezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa agizo umehifadhiwa kwa “italiwa” na “msitoe/msivunje”; “wala” linaunganisha makatazo mawili kwa mtiririko wa kawaida.
