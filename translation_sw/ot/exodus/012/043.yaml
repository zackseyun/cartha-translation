base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/043.yaml
  text: 'And Yahweh said to Moses and Aaron[a], “This is the statute of the Passover: no foreigner may eat of it.”'
translation:
  language: sw
  text: 'Yahwe akawaambia Musa na Haruni, “Hii ndiyo sheria ya Pasaka: mgeni yeyote asile Pasaka hiyo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina binafsi la Mungu katika umbo linalotumika kwa kawaida katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: וַיֹּאמֶר ... אֶל מֹשֶׁה וְאַהֲרֹן
  choice: akawaambia Musa na Haruni
  rationale: Ingawa Kiebrania hutumia kitenzi cha umoja, Kiswahili cha kawaida hutumia ‘-ambia’ kwa walengwa; ‘akawaambia’ ni simulizi la asili na la wazi.
- source_word: חֻקַּת
  choice: sheria
  rationale: Neno hili linaonyesha agizo lililowekwa; ‘sheria’ ni la kawaida, lenye hadhi, na linafaa katika muktadha huu wa kisheria.
- source_word: הַפָּסַח
  choice: Pasaka
  rationale: Linahifadhi upana wa neno la Kiebrania, ambalo linaweza kumaanisha maadhimisho au dhabihu/chakula chake kulingana na muktadha.
- source_word: כָּל בֶּן נֵכָר לֹא יֹאכַל
  choice: Mgeni yeyote asile
  rationale: Muundo huu wa Kiswahili unaeleza katazo kwa kawaida bila kufuata kwa ugumu muundo wa Kiebrania wa ‘kila ... si’.
- source_word: בֶּן נֵכָר
  choice: mgeni
  rationale: Ni nahau yenye maana halisi ya ‘mwana wa ugeni’; katika muktadha humaanisha mtu wa kigeni, bila kuongeza sifa ambayo mstari huu hauitaji waziwazi.
- source_word: בּוֹ
  choice: chakula hicho
  rationale: Kiwakilishi cha Kiebrania kinarejelea Pasaka kama kitu kinacholiwa. ‘Chakula hicho’ hufanya rejeo hilo lieleweke katika Kiswahili bila kulifafanua kuwa aina maalumu ya dhabihu.
theological_decisions:
- issue: Utambulisho wa wanaozuiwa kula Pasaka
  choice: ‘Mgeni’ bila kuongeza ‘asiyetahiriwa’ au maelezo mengine katika matini kuu
  alternative: ‘Mgeni aliye nje ya jumuiya ya agano’
  rationale: Kirai chenyewe kinasema ‘mwana wa ugeni.’ Muktadha unaofuata hufafanua mipaka zaidi, lakini mstari huu haupaswi kupanuliwa kwa kuingiza ufafanuzi huo ndani ya matini.
- issue: Maana ya ‘Pasaka’ katika rejeo la kitu kinacholiwa
  choice: Kutafsiri בּוֹ kwa ‘chakula hicho’ huku ‘Pasaka’ ikibaki pana
  alternative: ‘asile hiyo’ au ‘asile dhabihu hiyo ya Pasaka’
  rationale: Muktadha wa kula unaonyesha mlo/chakula cha Pasaka, lakini neno הַפָּסַח lenyewe halipaswi kufinywa kimakusudi kuwa dhabihu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ina mtiririko wa kawaida wa simulizi na sauti ya kisheria iliyo wazi; tanbihi huhifadhi nahau halisi ya Kiebrania.
