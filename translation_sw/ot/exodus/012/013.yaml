base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/013.yaml
  text: And the blood shall be a sign for you on the houses where you are[a]. When I see the blood, I will pass over you[b], and no plague will be among you to destroy, when I strike the land of Egypt.
translation:
  language: sw
  text: Nayo damu itakuwa ishara kwa ajili yenu juu ya nyumba mlizomo. Nitakapoiona damu, nitawapita[a], wala pigo la kuwaangamiza halitawapata[b], nitakapoipiga nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitawaacha salama” au “nitawalinda.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wala pigo halitakuwa miongoni mwenu kwa ajili ya mwangamizaji,” ikiwa neno hilo linaeleweka kama nomino inayomtaja mtendaji.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הַדָּם לָכֶם לְאֹת
  choice: Nayo damu itakuwa ishara kwa ajili yenu
  rationale: Muundo wa wakati ujao unaendeleza ahadi katika maagizo haya; “kwa ajili yenu” linaonyesha kuwa ishara hiyo inawahusu na ni kwa manufaa yao.
- source_word: עַל הַבָּתִּים אֲשֶׁר אַתֶּם שָׁם
  choice: juu ya nyumba mlimo
  rationale: “Juu ya” linadumisha maana ya mahali damu ilipowekwa, na “mlimo” ni Kiswahili cha kawaida na kifupi kwa nyumba ambamo walikuwamo.
- source_word: וְרָאִיתִי אֶת־הַדָּם
  choice: Nitakapoiona damu
  rationale: Ingawa kishazi kimeunganishwa kwa uratibu katika Kiebrania, hapa kina kazi ya wakati; tafsiri hii huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: וּפָסַחְתִּי עֲלֵכֶם
  choice: nitawapita
  rationale: Linahifadhi wazo la kupita na uhusiano wa kileksia na Pasaka bila kuamua kimya-kimya kuwa maana pekee ni kuwaacha salama au kuwalinda.
- source_word: וְלֹא יִהְיֶה בָכֶם נֶגֶף
  choice: wala pigo halitakuwa miongoni mwenu
  rationale: “Pigo” linafaa kwa נֶגֶף katika muktadha wa hukumu ya Misri, na “miongoni mwenu” linaakisi בָכֶם bila kuligeuza kuwa tu tukio juu ya mtu mmoja.
- source_word: לְמַשְׁחִית
  choice: ili kuangamiza
  rationale: Tafsiri ya kitenzi cha kusudi au matokeo inadumisha uwezekano wa kisarufi bila kuingiza kwa lazima mwangamizaji binafsi.
- source_word: בְּהַכֹּתִי בְּאֶרֶץ מִצְרָיִם
  choice: nitakapoipiga nchi ya Misri
  rationale: Kitenzi-jina chenye בְּ kina maana ya wakati; “nitakapoipiga” ni cha asili na huweka Mungu kama mtendaji kama ilivyo katika chanzo.
theological_decisions:
- issue: Maana ya וּפָסַחְתִּי עֲלֵכֶם katika kuanzishwa kwa Pasaka
  choice: nitawapita
  alternative: nitawaacha salama; nitawalinda
  rationale: Matini kuu inadumisha taswira ya kupita na uhusiano wake na Pasaka, huku tanbihi ikihifadhi maana zinazowezekana za kuwaokoa au kuwalinda.
- issue: Ikiwa לְמַשְׁחִית inaonyesha tendo la kuangamiza au mwangamizaji binafsi
  choice: ili kuangamiza
  alternative: kwa ajili ya mwangamizaji
  rationale: Umbo la Kiebrania linaweza kueleweka kwa kusudi/matokeo au kama nomino inayomtaja mtendaji. Matini kuu haiongezi ubainishaji wa mtendaji ambao mstari haulazimishi, na tanbihi huhifadhi usomaji mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Mlimo” na “nitakapoiona” ni miundo ya kawaida; “nitawapita” huhifadhi taswira kuu bila kutumia usemi mzito au wa kimadhehebu.
