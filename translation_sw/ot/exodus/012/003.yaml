  text: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
translation:
  language: sw
  text: '“Waambieni kusanyiko lote la Israeli: ‘Katika siku ya kumi ya mwezi huu, kila mwanamume ajichukulie mwana-kondoo[a] kwa nyumba ya baba yake, mwana-kondoo mmoja kwa kila kaya.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania שֶׂה linaweza kumaanisha mnyama mchanga wa kundi, awe kondoo au mbuzi. Hapa limetafsiriwa “mwana-kondoo” kulingana na muktadha wa Pasaka na matumizi yaliyozoeleka.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Semeni
  rationale: Amri ya wingi inaagiza Musa na Haruni walihutubie kusanyiko; ‘Semeni’ ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: kusanyiko lote la Israeli
  rationale: עֵדָה humaanisha jumuiya iliyokusanyika; ‘kusanyiko lote’ huhifadhi maana ya watu wa Israeli kama kundi la pamoja.
- source_word: בֶּעָשֹׂר לַחֹדֶשׁ הַזֶּה
  choice: Siku ya kumi ya mwezi huu
  rationale: Neno ‘siku’ limewekwa wazi kwa Kiswahili cha kawaida ingawa Kiebrania husema kihalisi ‘katika ya kumi ya mwezi huu.’
- source_word: וְיִקְחוּ לָהֶם
  choice: ajichukulie
  rationale: Muundo wa kitenzi una nguvu ya agizo katika muktadha huu; umoja unaendana na אִישׁ ya kugawa wajibu kwa kila mmoja.
- source_word: אִישׁ
  choice: kila mwanamume
  rationale: Huhifadhi umbo la kiume la neno la Kiebrania na maana yake ya kugawa agizo kwa kila mkuu wa kaya.
- source_word: שֶׂה
  choice: mwana-kondoo
  rationale: Ni usemi unaoeleweka na uliozoeleka katika simulizi la Pasaka; tanbihi huhifadhi ukweli kwamba neno la Kiebrania linaweza kumaanisha mnyama mchanga wa kondoo au mbuzi.
- source_word: לְבֵית אָבֹת
  choice: kwa ajili ya jamaa ya ukoo wa baba zake
  rationale: Huwakilisha kitengo cha kifamilia kinachofuatwa kwa upande wa baba bila kutumia tafsiri ya moja kwa moja ‘nyumba ya baba’ ambayo inaweza kueleweka kama jengo.
- source_word: שֶׂה לַבָּיִת
  choice: mwana-kondoo mmoja kwa kila kaya
  rationale: בַּיִת hapa ni watu wa nyumbani, si jengo; ‘kaya’ ni neno la asili na wazi kwa kitengo hicho.
