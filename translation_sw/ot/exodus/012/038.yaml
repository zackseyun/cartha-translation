translation:
  language: sw
  text: Pia, umati mkubwa wa watu wa aina mbalimbali[a] ulipanda pamoja nao, na kondoo na mbuzi, na ng’ombe—mifugo mingi sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kundi kubwa lililochanganyika” au “umati mchanganyiko.” Kauli ya Kiebrania עֵרֶב רַב inaeleza kundi lenye watu wa aina mbalimbali walioandamana na Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  choice: Pia
  rationale: Neno hili linaonyesha kwamba habari nyingine inaongezwa kwenye simulizi lililotangulia; “pia” ni fupi na ya kawaida katika Kiswahili.
- source_word: עֵרֶב רַב
  choice: umati mkubwa wa watu wa aina mbalimbali
  rationale: Kauli hii inaeleza kundi kubwa lenye watu wa asili au aina mbalimbali bila kutaja makabila yao kwa uhakika. “Umati mkubwa” pia huhifadhi wazo la ukubwa katika רַב.
- source_word: עָלָה
  choice: ulipanda
  rationale: Kitenzi hiki huhifadhi taswira ya Kiebrania ya kwenda juu katika safari ya kutoka Misri, huku kikipatana na nomino ya pamoja “umati.”
- source_word: אִתָּם
  choice: pamoja nao
  rationale: Hii inaonyesha moja kwa moja kwamba umati huo uliandamana na Waisraeli waliotajwa katika muktadha.
- source_word: וְ/צֹאן וּ/בָקָר
  choice: pamoja na makundi ya kondoo na mbuzi na makundi ya ng’ombe
  rationale: צֹאן ni mifugo midogo kwa ujumla, hasa kondoo na mbuzi, na בָקָר ni ng’ombe. Kutaja makundi kunawasilisha maana ya majina haya ya jumla kwa Kiswahili cha kawaida.
- source_word: מִקְנֶה
  choice: mifugo
  rationale: Ni neno la jumla kwa wanyama wanaofugwa, hivyo “mifugo” linatunza upana wa maana bila kuibana kwa aina moja ya mnyama.
- source_word: כָּבֵד מְאֹד
  choice: mingi sana
  rationale: Ingawa כָּבֵד kimsingi humaanisha “nzito,” hapa pamoja na “mifugo” inaeleza wingi mkubwa; “mingi sana” ni usemi wa asili unaowasilisha maana hiyo na msisitizo wa מְאֹד.
