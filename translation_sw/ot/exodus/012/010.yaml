  text: וְ/לֹא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר וְ/הַ/נֹּתָ֥ר מִמֶּ֛/נּוּ עַד בֹּ֖קֶר בָּ/אֵ֥שׁ תִּשְׂרֹֽפוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/010.yaml
  text: You shall not leave any of it until morning[a], and what remains of it until morning you shall burn with fire.
translation:
  language: sw
  text: Msibakize chochote mpaka asubuhi; na chochote kitakachobaki mpaka asubuhi, mkiteketeze kwa moto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תוֹתִירוּ
  choice: msibakize
  rationale: Hifili ya יתר hapa ina maana ya kuacha kitu kibaki. “Msibakize” ni agizo hasi la kawaida na la moja kwa moja katika Kiswahili.
- source_word: מִמֶּנּוּ
  choice: chochote
  rationale: Ingawa kihalisi ni “kutoka kwake/katika hicho,” pamoja na ukanushaji maana yake ya kimuktadha ni kutobakiza sehemu yoyote; “chochote” huwasilisha hilo kwa Kiswahili cha asili.
- source_word: עַד בֹּקֶר
  choice: mpaka asubuhi
  rationale: Kirai hiki huweka mpaka wa wakati; “mpaka asubuhi” ni wazi na cha kawaida bila kuongeza ufafanuzi usio katika Kiebrania.
- source_word: הַנֹּתָר
  choice: chochote kitakachobaki
  rationale: Kauli shirikishi ya Nifali inarejelea kitu kitakachokuwa kimebaki. Chaguo hili ni la asili katika Kiswahili na linahifadhi maana ya mabaki yoyote.
- source_word: בָּאֵשׁ
  choice: kwa moto
  rationale: Herufi ב hapa huonyesha njia au chombo cha kuteketeza; “kwa moto” ni usemi wa kawaida wa Kiswahili.
- source_word: תִּשְׂרֹפוּ
  choice: mkiteketeze
  rationale: Kauli isiyotimilika katika muktadha huu wa maagizo ina nguvu ya amri. “Mkiteketeze” huonyesha kuchoma kabisa na kudumisha uzito wa agizo.
theological_decisions:
- issue: Asili ya agizo kuhusu nyama ya Pasaka iliyobaki
  choice: Katazo la moja kwa moja likifuatiwa na agizo la lazima la kuteketeza mabaki
  alternative: Maelekezo ya kiutendaji tu yasiyo na nguvu ya sheria
  rationale: Muundo wa Kiebrania unatoa kwanza katazo, kisha unaagiza hatua inayopaswa kuchukuliwa ikiwa chochote kimebaki. Tafsiri inadumisha maagizo yote mawili bila kuongeza maana ya kiishara ambayo mstari hautaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Wingi wa nafsi ya pili umehifadhiwa katika “msibakize” na “mkiteketeze.” Hakuna tanbihi iliyoongezwa kwa sababu tofauti ya “what is left over” tayari imewasilishwa wazi katika matini.
