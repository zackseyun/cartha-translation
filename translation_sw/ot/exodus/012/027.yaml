base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/027.yaml
  text: you shall say[a], ‘It is the Passover sacrifice to Yahweh[c][b], who passed over the houses of the sons of Israel in Egypt when he struck Egypt and delivered our houses.’ And the people bowed down and worshiped.
translation:
  language: sw
  text: Nanyi mtasema, “Hii ni dhabihu ya Pasaka kwa Yahwe, aliyepita juu ya nyumba za wana wa Israeli huko Misri[a] alipowapiga Wamisri, naye akaziokoa nyumba zetu.” Ndipo watu wakainama, wakasujudu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi kilichotafsiriwa “aliyepita juu” kina mzizi uleule wa Kiebrania unaohusiana na “Pasaka”; kinaweza pia kuwa na maana ya kuepusha au kulinda.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח פֶּסַח
  choice: dhabihu ya Pasaka
  rationale: Muundo huu unaonyesha dhabihu inayohusiana na Pasaka; tafsiri hii ni ya kawaida na inahifadhi maana ya ibada ya kutoa dhabihu.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi ל hapa kinaonyesha kwamba dhabihu imetolewa kwa Yahwe.
- source_word: פָּסַח
  choice: alipita juu
  rationale: Inahifadhi uhusiano wa mzizi mmoja na jina ‘Pasaka’; tanbihi inaeleza pia maana inayowezekana ya kusaza au kulinda.
- source_word: בָּתֵּי בְנֵי יִשְׂרָאֵל
  choice: nyumba za wana wa Israeli
  rationale: Inahifadhi usemi wa kifamilia na wa agano wa Kiebrania bila kuufanya kuwa ‘Waisraeli’ tu.
- source_word: בְּנָגְפּוֹ אֶת מִצְרַיִם
  choice: alipowapiga Wamisri
  rationale: Kitenzi kinamaanisha kupiga au kuleta pigo; ‘Wamisri’ hapa ni Kiswahili cha kawaida kwa Misri ikichukuliwa kama watu wake.
- source_word: הִצִּיל
  choice: akaziokoa
  rationale: Kitenzi נצל kina maana ya kuokoa au kukomboa kutoka hatarini; ‘kuokoa’ ni sahihi na ya kawaida katika muktadha huu.
- source_word: וַיִּקֹּד ... וַיִּשְׁתַּחֲווּ
  choice: wakainama na kuabudu
  rationale: Inatofautisha kitendo cha kuinama kwa heshima na tendo la kuabudu, huku ikihifadhi mfululizo wa vitenzi viwili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano יהוה; ‘Yahwe’ hulitambulisha kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya פָּסַח
  choice: alipita juu
  alternative: alizisaza; alizilinda
  rationale: Tafsiri kuu inahifadhi uhusiano wa wazi na ‘Pasaka,’ huku tanbihi ikihifadhi uwezekano wa maana ya kusaza au kulinda.
- issue: Usemi בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: ‘Wana wa Israeli’ inafuata usemi wa kifamilia wa chanzo na inabaki wazi katika Kiswahili cha kibiblia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Nanyi mtasema’ huhifadhi wingi wa nafsi ya pili; ‘lakini’ huonyesha kwa kawaida utofauti uliomo kati ya kuipiga Misri na kuziokoa nyumba za Israeli.
