  text: They shall eat the meat that night[a], roasted over the fire[b]; with unleavened bread and bitter herbs they shall eat it.
translation:
  language: sw
  text: Nao wataila nyama hiyo usiku huo[a], iliyochomwa kwa moto[b]; wataila hiyo pamoja na mikate isiyotiwa chachu na mboga chungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usiku huu.” Kiebrania kinasema kihalisi “katika/kwenye usiku huu,” kikirejelea usiku mahususi wa mlo wa Pasaka.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “iliyookwa kwa moto,” yaani “iliyochomwa kwa moto.” Mkazo ni kwamba nyama ipikwe kwa kuchomwa kwa moto, si kwa njia nyingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכְלוּ
  choice: Nao wataila
  rationale: Kitenzi katika muktadha huu wa maagizo kina nguvu ya agizo linalohusu kitakachofanywa. “Wataila” ni Kiswahili cha kawaida na chenye hadhi, nacho pamoja na muktadha huwasilisha wajibu huo.
- source_word: הַבָּשָׂר
  choice: nyama hiyo
  rationale: Katika muktadha wa chakula, בָּשָׂר humaanisha nyama. Kionyeshi “hiyo” husaidia kuonyesha nyama ya mnyama aliyetajwa katika muktadha.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: usiku huo
  rationale: Kirai kinarejelea usiku mahususi wa mlo huu. “Usiku huo” ni usemi wa kawaida wa Kiswahili, ingawa Kiebrania kinaweza kutafsiriwa kihalisi zaidi kuwa “usiku huu.”
- source_word: צְלִי אֵשׁ
  choice: ikiwa imeokwa kwa moto
  rationale: Kirai kinaeleza nyama iliyopikwa kwa kuokwa kwa moto, tofauti na kuchemshwa katika mstari unaofuata. “Kuokwa kwa moto” huhifadhi njia ya upikaji na kutaja moto waziwazi.
- source_word: וּמַצּוֹת
  choice: pamoja na mikate isiyotiwa chachu
  rationale: מַצּוֹת ni mikate isiyo na chachu. Wingi “mikate” unaakisi umbo la Kiebrania, na “isiyotiwa chachu” ni usemi wazi wa Kiswahili.
- source_word: עַל
  choice: pamoja na
  rationale: Katika muktadha huu wa mlo, עַל huonyesha vitu vinavyoliwa kwa pamoja, si lazima nafasi ya kitu kuwa juu ya kingine.
- source_word: מְרֹרִים
  choice: mboga chungu
  rationale: Nomino hii ya wingi inamaanisha vitu vya mimea vyenye uchungu vinavyoliwa katika mlo. “Mboga chungu” ni usemi wa kawaida na mpana bila kubainisha mmea usiotajwa.
- source_word: יֹאכְלֻהוּ
  choice: wataila
  rationale: Kitenzi cha mwisho chenye kiambishi cha yambwa kinarudia na kusisitiza agizo la kuila nyama. Tafsiri inahifadhi marudio hayo.
