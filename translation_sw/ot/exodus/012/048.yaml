id: EXO.12.48
reference: Exodus 12:48
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/ךָ֜ גֵּ֗ר וְ/עָ֣שָׂה פֶסַח֮ לַ/יהוָה֒ הִמּ֧וֹל ל֣/וֹ כָל זָכָ֗ר וְ/אָז֙ יִקְרַ֣ב לַ/עֲשֹׂת֔/וֹ וְ/הָיָ֖ה כְּ/אֶזְרַ֣ח הָ/אָ֑רֶץ וְ/כָל עָרֵ֖ל לֹֽא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/048.yaml
  text: If a sojourner resides with you and keeps the Passover to Yahweh[a], every male belonging to him must be circumcised; then he may come near to keep it, and he shall be like a native of the land[c][b]. But no uncircumcised person may eat of it.
translation:
  language: sw
  text: Ikiwa mgeni anayeishi kati yenu[a] anaiadhimisha Pasaka kwa Yahwe[b], wote wa jinsia ya kiume walio wake lazima watahiriwe. Ndipo atakapoweza kukaribia na kuiadhimisha, naye atakuwa kama mzaliwa wa nchi. Lakini mtu yeyote ambaye hajatahiriwa hataruhusiwa kuila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mtu asiye mzawa ambaye anaishi miongoni mwa Israeli, si mgeni wa kupita tu.
    reason: lexical_alternative
  - marker: b
    text: Yahwe ni jina la Mungu linalowakilishwa na herufi za Kiebrania YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: גֵּר / יָגוּר אִתְּךָ
  choice: mgeni anayeishi kati yenu
  rationale: גֵּר ni mtu asiye mzawa ambaye amekaa miongoni mwa jamii, si msafiri wa kupita tu. Kauli hii ni ya asili katika Kiswahili na inaonyesha makazi yake miongoni mwa Israeli.
- source_word: וְעָשָׂה פֶסַח
  choice: anataka kuiadhimisha Pasaka
  rationale: Kitenzi עשה kwa kawaida ni ‘kufanya,’ lakini hapa kinamaanisha kutekeleza ibada ya Pasaka. Katika sentensi ya masharti, ‘anataka kuiadhimisha’ huonyesha hali inayotarajiwa kabla ya sharti la tohara bila kudai kwamba tayari ameiadhimisha.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi ל kinaonyesha kwamba adhimisho linaelekezwa au kuwekwa wakfu kwa Yahwe; ‘kwa Yahwe’ ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: הִמּוֹל לוֹ כָל זָכָר
  choice: lazima watu wake wote wa kiume watahiriwe
  rationale: Muundo huu una nguvu ya amri au sharti. ‘Watu wake wote wa kiume’ huonyesha wale walio wa nyumba au kundi lake bila kuufanya msemo kuwa mgumu.
- source_word: וְאָז יִקְרַב לַעֲשֹׂתוֹ
  choice: ndipo atakapoweza kukaribia na kuiadhimisha
  rationale: קרב hapa si mwendo wa mahali tu, bali ruhusa ya kushiriki baada ya kutimiza sharti. ‘Atakapoweza’ huwasilisha ustahili au ruhusa hiyo.
- source_word: כְּאֶזְרַח הָאָרֶץ
  choice: kama mzaliwa wa nchi
  rationale: אֶזְרַח humaanisha mwenyeji au mzawa wa nchi/jamii. ‘Mzaliwa wa nchi’ huhifadhi ulinganisho wa hadhi ya kijamii na kisheria.
- source_word: וְכָל עָרֵל לֹא יֹאכַל בּוֹ
  choice: mtu yeyote ambaye hajatahiriwa hataruhusiwa kuila
  rationale: Negesho linaonyesha marufuku au kutostahili kushiriki. ‘Hataruhusiwa’ huwasilisha maana hiyo, na ‘kuila’ humrejelea mnyama/chakula cha Pasaka katika muktadha.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Ushiriki wa mgeni katika Pasaka
  choice: Mgeni anaweza kushiriki baada ya watu wake wote wa kiume kutahiriwa, kisha anahesabiwa kama mzaliwa wa nchi kwa jambo hili.
  alternative: Kulieleza kama katazo la kikabila lisilo na uwezekano wa kuingizwa, au kama kuondolewa kwa mipaka yote ya agano.
  rationale: Kiebrania kinashikilia pamoja uwezekano wa mgeni kuingizwa na sharti la tohara. Tafsiri haipanui jambo hilo kwa makundi ya kiteolojia ya baadaye.
- issue: Nguvu ya וְעָשָׂה katika sentensi ya masharti
  choice: anataka kuiadhimisha
  alternative: anaiadhimisha; ataadhimisha
  rationale: Kwa kuwa tohara inatakiwa kabla ya kukaribia na kuadhimisha, Kiswahili cha matarajio huepuka kudokeza kwamba Pasaka tayari imeadhimishwa. Hata hivyo, nia hiyo haijaelezwa kwa kitenzi tofauti katika Kiebrania, hivyo uhusiano huu umehifadhiwa kama uamuzi wa ulinganifu bora.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa msomaji wa kawaida. ‘Kuadhimisha Pasaka’ ni usemi wa kawaida wa ibada, huku ‘kukaribia’ ikihifadhi lugha ya ruhusa ya kushiriki iliyo katika chanzo.
