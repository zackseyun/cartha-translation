base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/017.yaml
  text: And you shall keep the Feast of Unleavened Bread[a], because on this very day I brought your hosts out from the land of Egypt[c][b]. And you shall keep this day throughout your generations as a permanent statute.
translation:
  language: sw
  text: Mtaadhimisha Sikukuu ya Mikate Isiyotiwa Chachu[a], kwa sababu siku hii hasa niliyatoa makundi yenu[b] kutoka nchi ya Misri. Mtaadhimisha siku hii katika vizazi vyenu vyote, kuwa agizo la kudumu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema kihalisi “mikate” au “vitu visivyotiwa chachu”; usemi huo unaweza kumaanisha mikate yenyewe au, kwa upanuzi, sikukuu inayohusiana nayo.
    reason: lexical_alternative
  - marker: b
    text: Au “majeshi yenu,” “vikosi vyenu,” au “makundi yenu yaliyopangwa.” Neno la Kiebrania linawaonyesha Waisraeli kama umati uliopangwa unaotoka Misri.
    reason: lexical_alternative
  - marker: c
    text: Au “agizo la milele” au “sheria ya kudumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: mtaadhimisha / mtaishika
  rationale: Kitenzi שׁמר kina maana ya kutunza, kushika au kuadhimisha. Kwa sikukuu, “mtaadhimisha” ni Kiswahili cha kawaida; kwa siku iliyoamriwa, “mtaishika” huhifadhi wazo la utiifu kwa agizo.
- source_word: הַמַּצּוֹת
  choice: Sikukuu ya Mikate Isiyotiwa Chachu
  rationale: Kiebrania husema kihalisi “mikate/vitu visivyotiwa chachu,” lakini katika muktadha huu usemi huo unamaanisha pia maadhimisho ya sikukuu. Tafsiri hii ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi maana halisi na uwezekano wake wa kileksika.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: siku hii hii
  rationale: Urudiaji wa “hii” unatoa mkazo wa wakati hususa unaobebwa na עֶצֶם katika usemi huu.
- source_word: הוֹצֵאתִי
  choice: niliyatoa
  rationale: Hifili ya יצא humaanisha kusababisha kutoka au kutoa. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha kuwa Mungu ndiye aliyewatoa.
- source_word: צִבְאוֹתֵיכֶם
  choice: makundi yenu
  rationale: צָבָא inaweza kumaanisha jeshi, kundi lililopangwa, au kikosi. “Makundi yenu” huepuka kudokeza kwamba Waisraeli wote walikuwa wanajeshi, lakini hudumisha wazo la watu waliotoka kwa mpangilio.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Pamoja na kitenzi “kutoa,” “katika” huonyesha kwa kawaida mahali walikotolewa; maana ya mwendo wa kutoka imo tayari katika kitenzi.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Huu ni usemi wa agano unaoonyesha kwamba maadhimisho yataendelea kizazi baada ya kizazi.
- source_word: חֻקַּת עוֹלָם
  choice: agizo la kudumu
  rationale: חֻקָּה ni agizo au sheria iliyowekwa, na עוֹלָם hapa huonyesha mwendelezo wa kudumu. “Agizo la kudumu” ni wazi na lenye hadhi bila kulazimisha maana ya kifalsafa iliyo pana kuliko nahau.
theological_decisions:
- issue: Ikiwa הַמַּצּוֹת itafsiriwe kuwa chakula chenyewe au sikukuu
  choice: Sikukuu ya Mikate Isiyotiwa Chachu
  alternative: mikate isiyotiwa chachu
  rationale: Muktadha wa “kuadhimisha” na “kuishika siku hii” unaonyesha maadhimisho ya sikukuu, lakini Kiebrania hakitaji neno “sikukuu” waziwazi. Tanbihi huhifadhi mvutano huo wa maana.
- issue: Upeo wa חֻקַּת עוֹלָם
  choice: agizo la kudumu
  alternative: agizo la milele
  rationale: Tafsiri iliyochaguliwa inaeleza wajibu endelevu wa agano bila kuamua kimya kimya mjadala wa kitheolojia kuhusu upeo wa neno עוֹלָם katika kila muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mtaadhimisha” ni asili kwa sikukuu, huku “mtaishika” katika sentensi ya pili ikihifadhi lugha ya utiifu kwa siku iliyoamriwa. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
