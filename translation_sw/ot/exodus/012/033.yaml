  yaml_path: translation/ot/exodus/012/033.yaml
  text: And the Egyptians urged the people on[a], hurrying to send them out of the land, for they said, “We are all dead men.”
translation:
  language: sw
  text: Wamisri wakawashinikiza watu[a], wakiharakisha kuwatoa nchini, kwa maana walisema, “Sisi sote tunakufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wamisri wakawashinikiza watu waondoke nchini upesi.” Kiebrania hutumia vitenzi-jina viwili vinavyofuatana kuonyesha haraka ya kuwaondoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּחֱזַק מִצְרַיִם עַל־הָעָם
  choice: Wamisri wakawashinikiza watu
  rationale: Kitenzi חזק pamoja na עַל hapa kinaonyesha kuwasukuma au kuwabana watu kwa nguvu ili wachukue hatua. ‘Wakawashinikiza’ ni Kiswahili cha kawaida kinachoonyesha msukumo huo mkali bila kudokeza matumizi ya nguvu za kimwili pekee.
- source_word: מִצְרַיִם
  choice: Wamisri
  rationale: Jina la nchi linatumika kwa maana ya pamoja likiwakilisha wakazi wake; ‘Wamisri’ huiweka wazi kwa Kiswahili.
- source_word: הָעָם
  choice: watu
  rationale: Katika muktadha hawa ni watu wa Israeli. ‘Watu’ linadumisha namna ya jumla ya Kiebrania bila kuongeza ufafanuzi usio katika mstari.
- source_word: לְמַהֵר לְשַׁלְּחָם
  choice: waondoke ... upesi
  rationale: 'Vitenzi-jina viwili vinavyofuatana vinaeleza kusudi lenye haraka: Wamisri waliwashinikiza ili kuwaondoa mara moja. Kiswahili ‘waondoke ... upesi’ huwasilisha kufukuzwa kwao kwa lugha ya kawaida, huku tanbihi ikihifadhi muundo mbadala.'
- source_word: מִן־הָאָרֶץ
  choice: nchini
  rationale: Maana ni kuondoka katika nchi inayozungumziwa, yaani Misri. ‘Nchini’ ni fupi na ya asili katika Kiswahili; muktadha unabainisha nchi hiyo.
- source_word: כִּי אָמְרוּ
  choice: kwa maana walisema
  rationale: כִּי inatoa sababu ya uharaka wa Wamisri, na ‘kwa maana’ inadumisha uhusiano huo wazi katika masimulizi.
- source_word: כֻּלָּנוּ מֵתִים
  choice: Sisi sote tutakufa
  rationale: Kauli ya Kiebrania, kihalisi ‘sisi sote wafu/tunakufa,’ katika muktadha ni kilio kwamba mauti itawapata wote. ‘Tutakufa’ ni kauli ya kawaida ya Kiswahili inayoonyesha hatari waliyoiona kuwa karibu bila kudai kwamba waliokuwa wakisema tayari walikuwa wamekufa.
theological_decisions:
- issue: 'Hali ya מֵתִים: tayari wamekufa, wanaendelea kufa, au wako karibu kufa'
  choice: Sisi sote tutakufa
  alternative: Sisi sote tunakufa / Sisi sote ni watu waliokufa
  rationale: Umbo la kishiriki linaweza kuonyesha hali inayoendelea au inayokaribia. Muktadha wa wazungumzaji walio hai unapendelea kauli ya hofu ya mauti inayowakabili wote. Tafsiri haibadili kauli hii kuwa tamko la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya masimulizi. ‘Wakawashinikiza’ huonyesha shinikizo kali; ‘waondoke nchini upesi’ ni rahisi kueleweka. Alama ya tanbihi [a] imewekwa katika matini kuu.
