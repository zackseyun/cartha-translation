  yaml_path: translation/ot/exodus/012/044.yaml
  text: But every man's servant[a], bought with silver—when you have circumcised him[b], then he may eat of it.
translation:
  language: sw
  text: Lakini kila mtumwa wa mtu—aliyenunuliwa kwa fedha[a]—ukishamtahiri[b], ndipo anaweza kuila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mtumwa aliyepatikana kwa kununuliwa kwa fedha.
    reason: lexical_alternative
  - marker: b
    text: Yaani, anaruhusiwa kushiriki mlo wa Pasaka baada tu ya kutahiriwa.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כָל
  choice: Lakini kila
  rationale: Kiunganishi וְ kinaunganisha sheria hii na katazo lililotangulia, huku כָּל ikiwa na maana ya mgawanyo, ‘kila.’ ‘Lakini’ huonyesha utofauti huo kwa Kiswahili cha kawaida.
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Katika muktadha huu wa kisheria, mtu huyo amenunuliwa na yuko chini ya umiliki; ‘mtumwa’ huonyesha hali hiyo bila kuipunguza kuwa utumishi wa hiari.
- source_word: אִישׁ
  choice: wa mtu
  rationale: Huhifadhi umbo la umoja na kumtambulisha mwenye mtumwa bila kuongeza dhana pana zaidi kama ‘mkuu wa nyumba.’
- source_word: מִקְנַת כָּסֶף
  choice: aliyenunuliwa kwa fedha
  rationale: Hutoa maana ya ununuzi kwa fedha kwa Kiswahili cha asili, huku ‘fedha’ ikihifadhi picha ya כָּסֶף na pia kueleweka kama malipo.
- source_word: וּ/מַלְתָּה אֹתוֹ
  choice: ukishamtahiri
  rationale: Muundo huu huonyesha tendo la tohara kama sharti linalotangulia ruhusa ya kula, na huhifadhi anwani ya nafsi ya pili umoja.
- source_word: אָז
  choice: ndipo
  rationale: ‘Ndipo’ huonyesha wazi matokeo yanayofuata baada ya sharti la tohara kutimizwa.
- source_word: יֹאכַל בּוֹ
  choice: anaweza kuila
  rationale: Kauli hii inaeleza ruhusa ya kushiriki kwa kula Pasaka, si unabii tu wa tendo la baadaye; kiwakilishi ‘-i-’ kinarejelea Pasaka/chakula chake katika muktadha.
theological_decisions:
- issue: Istilahi ya utumwa katika muktadha wa kisheria wa agano
  choice: mtumwa
  alternative: mtumishi
  rationale: Kutajwa kwa kununuliwa kwa fedha hufanya hali ya kuwa chini ya umiliki kuwa sehemu kuu ya maana. ‘Mtumwa’ huepuka kuficha uhalisi wa kijamii wa maandishi.
- issue: Umbo la אִישׁ
  choice: wa mtu
  alternative: wa mwenye nyumba
  rationale: ‘Wa mtu’ hudumisha umoja wa neno la Kiebrania bila kuongeza tafsiri ya kuwa lazima ni mkuu wa nyumba.
- issue: Nguvu ya יֹאכַל katika sheria hii
  choice: anaweza kuila
  alternative: ataila
  rationale: Muktadha unaweka masharti ya nani anayeruhusiwa kula Pasaka; hivyo maana ya ruhusa inafaa kuliko wakati ujao wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ukishamtahiri, ndipo’ ni muundo wa kawaida unaoweka wazi mpangilio wa sharti na matokeo; ‘mtumwa’ hutumiwa kwa uaminifu kwa hali ya mtu aliyenunuliwa.
