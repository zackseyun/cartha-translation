  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקְרָא֩ לְ/מֹשֶׁ֨ה וּֽ/לְ/אַהֲרֹ֜ן לַ֗יְלָה וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִ/תּ֣וֹךְ עַמִּ֔/י גַּם אַתֶּ֖ם גַּם בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/לְכ֛וּ עִבְד֥וּ אֶת יְהוָ֖ה כְּ/דַבֶּרְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/031.yaml
  text: Then he called for Moses and Aaron by night and said[a], “Rise up, go out from among my people, both you and the sons of Israel, and go, serve Yahweh[b], as you have said.”
translation:
  language: sw
  text: Usiku[a] akawaita Musa na Haruni, akawaambia, “Inukeni, tokeni miongoni mwa watu wangu, ninyi pamoja na Waisraeli[b]. Nendeni mkamtumikie Yahwe, kama mlivyosema.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa usiku.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “wana wa Israeli.”
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: Katika muktadha huu kitenzi kinaonyesha kwamba Farao aliwaita Musa na Haruni kwa haraka. “Akawaita” ni Kiswahili cha kawaida na hakiongezi namna ambayo wito huo ulifikishwa.
- source_word: לַיְלָה
  choice: usiku
  rationale: Nomino hii imetumiwa kueleza wakati wa tendo. “Usiku” ni tafsiri fupi na ya moja kwa moja.
- source_word: קוּמוּ
  choice: Inukeni
  rationale: Amri hii inaonyesha uharaka na inadumisha maana ya msingi ya kuinuka bila kutumia lugha ya mazungumzo mno.
- source_word: צְּאוּ מִתּוֹךְ עַמִּי
  choice: tokeni miongoni mwa watu wangu
  rationale: “Tokeni” inadumisha mwendo wa kutoka, na “miongoni mwa watu wangu” inaonyesha kuondolewa kutoka katikati ya watu wa Misri.
- source_word: גַּם אַתֶּם גַּם בְּנֵי יִשְׂרָאֵל
  choice: ninyi pamoja na Waisraeli
  rationale: Muundo huu wa Kiswahili unadumisha msisitizo unaowajumuisha Musa na Haruni pamoja na taifa lote, huku ukisomeka kwa kawaida. Tanbihi inahifadhi nahau ya kifamilia ya Kiebrania.
- source_word: וּלְכוּ עִבְדוּ
  choice: Nendeni mkamtumikie
  rationale: Mfuatano huu unahifadhi amri ya kwenda na kusudi la kumtumikia Mungu. “Kumtumikia” ni pana kuliko “kumwabudu” pekee na hivyo inadumisha wigo wa עבד.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni umbo linalolingana na tahajia ya Kiswahili la jina binafsi la Mungu katika Tetragramatoni, badala ya kulibadilisha kuwa cheo.
- source_word: כְּדַבֶּרְכֶם
  choice: kama mlivyosema
  rationale: Tafsiri hii inaonyesha kukubali ombi ambalo Musa na Haruni walikuwa wametoa, na wingi wa nafsi unadumishwa.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, na umbo hili linafuata tahajia ya Kiswahili.
- issue: Wigo wa maana ya עבד inapomhusu Mungu
  choice: mkamtumikie
  alternative: mkamwabudu
  rationale: Kitenzi kinaweza kuhusisha ibada, lakini pia kina maana pana ya huduma kwa Mungu. “Mkamtumikie” hakifungi maana katika tendo la ibada pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mfuatano wa amri umehifadhiwa ili kuonyesha uharaka wa kauli ya Farao; nahau nzito ya Kiebrania imewekwa katika tanbihi badala ya kuifanya sentensi kuu isisikike ya kawaida.
