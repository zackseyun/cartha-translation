base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/016.yaml
  text: On the first day there shall be a holy assembly for you[a], and on the seventh day a holy assembly. No work shall be done on them[c][b], except what every person must eat—that alone may be prepared for you.
translation:
  language: sw
  text: Siku ya kwanza mtakuwa na kusanyiko takatifu[a], na siku ya saba mtakuwa na kusanyiko takatifu. Kazi yoyote isifanywe siku hizo, isipokuwa chakula cha kuliwa na kila mtu[b]; hicho peke yake ndicho kinachoweza kufanywa kwa ajili yenu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkutano mtakatifu.” Kirai cha Kiebrania kinamaanisha kusanyiko lililoitishwa kwa kusudi takatifu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kwa kila nefeshi,” yaani, kwa kila mtu; hapa hakimaanishi hasa “roho” kwa maana ya kisasa.
    reason: lexical_alternative
  - marker: c
    text: Tafsiri ya karibu zaidi ni “hicho peke yake kifanywe kwa ajili yenu.” Muktadha unaonyesha kuwa jambo linaloruhusiwa ni kufanya maandalizi ya chakula cha kuliwa siku hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  choice: kusanyiko takatifu
  rationale: Kirai hiki kinaonyesha mkutano ulioitishwa kwa kusudi takatifu. “Kusanyiko takatifu” ni Kiswahili cha sasa, cha heshima, na kinaeleweka kwa urahisi bila kutumia istilahi ya kizamani.
- source_word: יִהְיֶה לָכֶם
  choice: mtakuwa na
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida maana ya kuwapo kwa kusanyiko kwa ajili ya waambiwa, bila kufanya sentensi iwe ngumu au isiyo ya kawaida.
- source_word: כָּל מְלָאכָה לֹא יֵעָשֶׂה בָהֶם
  choice: Kazi yoyote isifanywe siku hizo
  rationale: “Kazi yoyote” linaonyesha upeo wa כָּל, na “isifanywe” linahifadhi muundo wa kutendwa wa Kiebrania. “Siku hizo” linaweka wazi kuwa kiambishi kinarejelea siku ya kwanza na ya saba.
- source_word: אַךְ
  choice: isipokuwa
  rationale: Katika muktadha huu neno hilo linaanzisha jambo pekee lisilohusishwa katika katazo la kufanya kazi.
- source_word: אֲשֶׁר יֵאָכֵל לְכָל נֶפֶשׁ
  choice: chakula cha kila mtu
  rationale: Muktadha unaonyesha kuwa kinachoweza kutayarishwa ni chakula kitakacholiwa. נֶפֶשׁ hapa humaanisha mtu binafsi, si “roho” kwa maana ya kisasa.
- source_word: הוּא לְבַדּוֹ
  choice: hicho peke yake
  rationale: Maneno haya yanahifadhi msisitizo wa Kiebrania kwamba utayarishaji wa chakula ndio jambo pekee lililoruhusiwa.
- source_word: יֵעָשֶׂה לָכֶם
  choice: ndicho kinachoweza kuandaliwa kwa ajili yenu
  rationale: Kitenzi cha jumla “kufanywa” kinahusu utayarishaji wa chakula katika muktadha huu. “Kwa ajili yenu” linaakisi לָכֶם, na “kinachoweza” linaonyesha ruhusa inayodokezwa na hali ya sheria.
