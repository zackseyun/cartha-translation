base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/051.yaml
  text: And on that very day[b][a], Yahweh brought the sons of Israel out from the land of Egypt according to their divisions.
translation:
  language: sw
  text: Ikawa kwamba siku hiyo hiyo, Yahweh aliwatoa wana wa Israeli katika nchi ya Misri kwa makundi yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa vikosi vyao” au “kwa majeshi yao.” Neno la Kiebrania linaweza kumaanisha makundi yaliyopangwa au vikosi; linaonyesha kwamba walitoka kwa mpangilio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Muundo huu unaendeleza simulizi na kuanzisha taarifa ya wakati kwa Kiswahili cha kibiblia kilicho wazi bila kutumia maneno ya kizamani kupita kiasi.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: siku iyo hiyo
  rationale: Kirai hiki kinadumisha msisitizo wa Kiebrania kwamba jambo lilitokea katika siku ileile mahususi.
- source_word: הוֹצִיא
  choice: akawatoa
  rationale: Hifili ya יצא ina maana ya kusababisha watoke; 'akawatoa' ni ya kawaida na inadumisha maana hiyo ya kisababishi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa tetragramatoni linawakilishwa kama jina binafsi, si kubadilishwa kuwa cheo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: '''Wana wa Israeli'' linahifadhi usemi wa kifamilia na wa kijumuiya wa Kiebrania, huku likiwa la asili katika Kiswahili.'
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Pamoja na kitenzi 'akawatoa,' kihusishi 'katika' kinaeleza mahali walikotolewa na kuhifadhi nomino 'nchi' iliyopo katika chanzo.
- source_word: עַל צִבְאֹתָם
  choice: kwa vikosi vyao
  rationale: צְבָאוֹת hapa yaweza kumaanisha makundi yaliyopangwa au majeshi; 'vikosi' linadumisha wazo la makundi yenye utaratibu bila kulazimisha kwamba yalikuwa majeshi ya mapigano.
theological_decisions:
- issue: Uwakilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu; 'Yahweh' linadumisha tofauti kati ya jina hilo na cheo.
- issue: Usemi wa kijumuiya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli au watoto wa Israeli
  rationale: '''Wana wa Israeli'' linahifadhi picha ya ukoo wa pamoja iliyomo katika Kiebrania; katika muktadha huu linataja jamii nzima, si wanaume pekee.'
- issue: Maana ya עַל צִבְאֹתָם
  choice: kwa vikosi vyao
  alternative: kwa makundi yao au kwa majeshi yao
  rationale: Neno la Kiebrania linaweza kuonyesha vikosi, majeshi, au makundi yaliyopangwa. Tafsiri kuu inadumisha wazo la mpangilio, na tanbihi inaonyesha upana wake wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi 'Ikawa ... akawatoa' unafaa muktadha wa Biblia bila kuwa mzito; tanbihi pekee imewekwa baada ya kirai kinachohusika.
