base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/037.yaml
  text: And the sons of Israel journeyed from Rameses to Succoth[a], about six hundred thousand men on foot[d][c][b], besides children.
translation:
  language: sw
  text: Wanaisraeli[a] wakaondoka[b] kutoka Ramesesi kwenda Sukothi. Wanaume waliokuwa wakisafiri kwa miguu walikuwa takriban laki sita[c], bila kuhesabu watoto[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wana wa Israeli.” Kiebrania husema hivyo kwa maana halisi.
    reason: lexical_alternative
  - marker: b
    text: Au “wakaanza safari.” Kitenzi cha Kiebrania kinaweza kumaanisha kung'oa kambi na kuanza safari.
    reason: lexical_alternative
  - marker: c
    text: Maneno haya yanahesabu takriban wanaume laki sita waliokuwa wakisafiri kwa miguu; watoto hawakujumuishwa katika hesabu hiyo.
    reason: cultural_note
  - marker: d
    text: Au “watoto wadogo.” Neno la Kiebrania טַף hurejelea watoto au watoto wadogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: wakaondoka
  rationale: Kitenzi נסע katika muktadha wa safari huonyesha kung'oa kambi na kuanza safari. “Wakaondoka” ni Kiswahili cha kawaida na huendeleza simulizi kwa ufasaha.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wanaisraeli
  rationale: Ingawa maana ya neno kwa neno ni “wana wa Israeli,” hapa usemi huo unalitaja taifa la Israeli. “Wanaisraeli” ni wa asili zaidi katika Kiswahili cha sasa bila kubadili rejeleo.
- source_word: מֵרַעְמְסֵס
  choice: kutoka Ramesesi
  rationale: Kiambishi מִן kinaonyesha mahali walikotoka; “Ramesesi” ni umbo la jina linalofaa matamshi na tahajia ya Kiswahili.
- source_word: סֻכֹּתָה
  choice: kwenda Sukothi
  rationale: Herufi ya mwelekeo ־ָה katika jina la mahali inaonyesha mwendo kuelekea huko; “kwenda” huwasilisha maana hiyo wazi.
- source_word: כְּשֵׁשׁ מֵאוֹת אֶלֶף
  choice: wapata ... laki sita
  rationale: Kiambishi כְּ־ hapa kinaonyesha ukadiriaji. “Wapata” huhifadhi kutokuwa kamili kwa hesabu, na “laki sita” ni namna ya kawaida ya kutaja 600,000 kwa Kiswahili.
- source_word: רַגְלִי הַגְּבָרִים
  choice: wanaume ... waliokuwa wakisafiri kwa miguu
  rationale: רַגְלִי huwatambulisha wanaosafiri kwa miguu, na הַגְּבָרִים ni wanaume. Muundo huu wa Kiswahili unaweka wazi kwamba hesabu ni ya wanaume hao.
- source_word: לְבַד מִטָּף
  choice: bila kuhesabu watoto
  rationale: Usemi לְבַד מִן unaonyesha kutengwa katika hesabu, na טַף hurejelea watoto au wadogo wanaotegemezwa. Tafsiri hii ni wazi na ya kawaida bila kupanua maana kuwa wategemezi wote.
