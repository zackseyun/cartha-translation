translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili hesabu kubwa isomeke kwa urahisi. “Wanaisraeli” limetumiwa katika matini kwa uasilia, huku umbo halisi “wana wa Israeli” likihifadhiwa katika tanbihi. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
