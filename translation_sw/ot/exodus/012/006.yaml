  yaml_path: translation/ot/exodus/012/006.yaml
  text: And it shall be kept by you until the fourteenth day of this month[a], and the whole assembly of the congregation of Israel shall slaughter it between the evenings.
translation:
  language: sw
  text: Mtamhifadhi mpaka siku ya kumi na nne ya mwezi huu; kisha kusanyiko lote la jumuiya ya Israeli litamchinja kati ya jioni mbili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kati ya jioni mbili,” nahau ambayo kwa kawaida hueleweka kuwa kipindi cha karibu na machweo, yaani jioni yenye mwanga hafifu.'
    reason: Nahau ya Kiebrania ina tafsiri mbalimbali za wakati; tanbihi inaeleza maana yake inayotumiwa kwa kawaida bila kufuta utata wa asili.
lexical_decisions:
- source_word: וְהָיָה לָכֶם לְמִשְׁמֶרֶת
  choice: Nanyi mtamweka chini ya uangalizi wenu
  rationale: Kirai hiki kinaonyesha kuwa mnyama aliyeteuliwa alipaswa kuhifadhiwa kwa uangalifu. Muundo wa kutenda ni wa asili katika Kiswahili na unaweka wazi wajibu wa Waisraeli.
- source_word: עַד אַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: mpaka siku ya kumi na nne ya mwezi huu
  rationale: Huu ni usemi wa kawaida na wazi wa tarehe katika Kiswahili.
- source_word: וְשָׁחֲטוּ אֹתוֹ
  choice: litamchinja
  rationale: Kitenzi 'chinja' kinafaa kwa kuua mnyama kwa kusudi la chakula au ibada; kiambishi cha ngeli ya viumbe hai kinamrejelea mnyama aliyetajwa katika muktadha.
- source_word: כֹּל קְהַל עֲדַת יִשְׂרָאֵל
  choice: kusanyiko lote la jumuiya ya Israeli
  rationale: Tafsiri hii inadumisha maneno mawili ya pamoja katika Kiebrania badala ya kuyafanya kuwa neno moja, huku ikibaki ya kawaida na yenye heshima kwa Kiswahili.
- source_word: בֵּין הָעַרְבָּיִם
  choice: kati ya machweo mawili
  rationale: Hii inadumisha kwa karibu nahau ya Kiebrania na kutokuweka kwa lazima tafsiri moja ya wakati wake unaobishaniwa.
theological_decisions:
- issue: Mhusika wa pamoja katika amri ya kuchinja
  choice: kusanyiko lote la jumuiya ya Israeli litamchinja
  alternative: kila nyumba itamchinja mnyama wake
  rationale: Kiebrania kinataja Israeli kwa lugha ya umoja wa kijumuiya. Tafsiri inadumisha mtazamo huo wa pamoja bila kuubadili kuwa maelezo ya utekelezaji wa kila nyumba.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Chini ya uangalizi wenu' ni wazi kwa wasomaji wa kawaida, huku 'kusanyiko lote la jumuiya' likidumisha uzito wa usemi wa pamoja wa Kiebrania.
