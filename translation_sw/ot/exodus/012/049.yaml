translation:
  language: sw
  text: Sheria moja itawahusu mzawa na mgeni anayeishi miongoni mwenu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Agizo moja litawahusu mzawa na mgeni mkazi aliye miongoni mwenu.”
    reason: Neno תּוֹרָה linaweza kutafsiriwa pia “agizo,” na גֵּר linaweza kufafanuliwa kama “mgeni mkazi.”
lexical_decisions:
- source_word: תּוֹרָה
  choice: sheria
  rationale: Katika muktadha huu wa masharti ya Pasaka, neno hili linamaanisha kanuni ya lazima; “sheria” ni wazi na la kawaida katika Kiswahili cha kisheria.
- source_word: אַחַת
  choice: moja
  rationale: “Moja” linahifadhi msisitizo wa Kiebrania kwamba kiwango kilekile cha sheria kinawahusu wote.
- source_word: יִהְיֶה
  choice: itakuwa kwa
  rationale: Muundo huu unafuata kwa karibu Kiebrania huku ukiendelea kueleweka kwa kawaida kama sheria inayowahusu makundi yote mawili.
- source_word: אֶזְרָח
  choice: mzawa
  rationale: “Mzawa” humtaja mtu wa jamii hiyo kwa asili bila kuingiza dhana ya kisasa ya uraia wa kisiasa.
- source_word: גֵּר
  choice: mgeni
  rationale: Katika muktadha huu ni mtu asiye mzawa anayekaa ndani ya jamii; kishazi kinachofuata kinaweka wazi kuwa si mgeni wa muda mfupi.
- source_word: הַגָּר
  choice: anayeishi
  rationale: Kishazi hiki kinaonyesha kwamba mgeni huyo anakaa miongoni mwa watu, kwa Kiswahili cha sasa na kilicho wazi.
- source_word: בְּתוֹכְכֶם
  choice: kati yenu
  rationale: Ni usemi wa kawaida na sahihi kwa maana ya kuwa ndani ya jamii yao.
