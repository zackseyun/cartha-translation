lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika tafsiri za Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa “BWANA,” huku herufi kubwa zikilitofautisha na cheo cha kawaida.
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Kitenzi cha umoja cha kusema pamoja na walengwa wawili kinaelezwa kwa Kiswahili cha kawaida kama “akawaambia”; kiunganishi wa- kinaendelezwa kwa “aka-” bila kuongeza neno la muda lisilokuwapo.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya mahali ambapo usemi ulitolewa.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hudumisha fomula ya Kiebrania inayotambulisha maneno yanayofuata, ingawa Kiswahili kingeweza kuiacha kwa ajili ya ulaini.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” ni desturi pana na yenye kueleweka katika Biblia za Kiswahili; herufi kubwa zinaonyesha kwamba hapa ni jina la agano, bila kulazimisha matamshi yaliyoundwa upya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko na kinachoeleweka kwa msomaji wa kawaida. Muundo “Mose na Aroni” ni wa asili zaidi kuliko kurudia “kwa,” huku ukihifadhi walengwa wote wawili.
