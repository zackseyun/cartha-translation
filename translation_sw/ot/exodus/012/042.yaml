  text: לֵ֣יל שִׁמֻּרִ֥ים הוּא֙ לַֽ/יהוָ֔ה לְ/הוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם הֽוּא הַ/לַּ֤יְלָה הַ/זֶּה֙ לַֽ/יהוָ֔ה שִׁמֻּרִ֛ים לְ/כָל בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/דֹרֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/042.yaml
  text: It was a night of vigil for Yahweh[a], to bring them out from the land of Egypt; this same night is a vigil for Yahweh for all the children of Israel throughout their generations.
translation:
  language: sw
  text: Ulikuwa usiku wa kukesha kwa Yahwe[a], ili awatoe kutoka nchi ya Misri; usiku huohuo ni usiku wa kukesha kwa Yahwe kwa wana wote wa Israeli katika vizazi vyao vyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usiku wa kuwa macho,” “usiku wa uangalizi,” au “usiku wa maadhimisho.” Neno la Kiebrania שִׁמֻּרִים lina wazo la kukesha, kulinda au kutunza, na huenda pia likadokeza maadhimisho ya ukumbusho.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵיל שִׁמֻּרִים
  choice: usiku wa kukesha
  rationale: Muundo wa neno tegemezi לֵיל pamoja na שִׁמֻּרִים unaeleza usiku wenye sifa ya kuwa macho, kulinda, au kuadhimisha. ‘Usiku wa kukesha’ ni wa kawaida katika Kiswahili na unahifadhi maana ya msingi bila kuufanya kuwa ibada tu.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahwe
  rationale: Kihusishi ל kinaonyesha uhusiano au kuwekwa wakfu; ‘kwa ajili ya’ kinaeleza kwamba usiku huo unamhusu Yahwe na umewekwa kwake.
- source_word: לְהוֹצִיאָם
  choice: ili awatoe
  rationale: Kitenzi-jina chenye ל kinaweza kuonyesha kusudi au matokeo. ‘Ili awatoe’ ni cha asili katika Kiswahili na kinaweka Yahwe kama mtendaji anayeeleweka kutokana na kishazi kilichotangulia.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Kiswahili hutumia ‘kutoa katika’ kwa maana ya kuondoa kutoka mahali, huku kikihifadhi neno אֶרֶץ, ‘nchi.’
- source_word: הוּא הַלַּיְלָה הַזֶּה
  choice: usiku huohuo
  rationale: Umbo hili linasisitiza utambulisho wa usiku uliotajwa; ‘huohuo’ huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: לְכָל בְּנֵי יִשְׂרָאֵל
  choice: kwa wana wote wa Israeli
  rationale: ‘Wana wa Israeli’ huhifadhi taswira ya kifamilia ya בְּנֵי יִשְׂרָאֵל kuliko ‘Waisraeli,’ na mpangilio huu wa maneno ni wa asili zaidi katika Kiswahili.
- source_word: לְדֹרֹתָם
  choice: katika vizazi vyao vyote
  rationale: Huwasilisha mwendelezo wa jambo hili katika vizazi vinavyofuatana bila kuongeza wazo lisilotajwa wazi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana pana ya שִׁמֻּרִים
  choice: kukesha
  alternative: kulinda; kuadhimisha
  rationale: ‘Kukesha’ huhifadhi wazo la kuwa macho na pia linaweza kueleweka kama mkesha wa tukio takatifu. Tanbihi inadumisha uwezekano wa maana ya uangalizi au maadhimisho bila kuamua upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa ‘usiku’ na ‘kwa ajili ya Yahwe’ umehifadhiwa kwa sababu ni sehemu ya msisitizo wa maandishi ya Kiebrania.
