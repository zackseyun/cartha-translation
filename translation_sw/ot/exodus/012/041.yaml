  text: וַ/יְהִ֗י מִ/קֵּץ֙ שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יְהִ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה יָֽצְא֛וּ כָּל צִבְא֥וֹת יְהוָ֖ה מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/041.yaml
  text: And at the end of four hundred and thirty years[a], on that very day, all the hosts of Yahweh went out from the land of Egypt.
translation:
  language: sw
  text: Ikawa, mwishoni mwa miaka mia nne na thelathini, siku hiyo hiyo hasa, vikosi[a] vyote vya Yahwe vilitoka kutoka nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “majeshi.” Neno la Kiebrania linaweza kumaanisha vikosi, makundi yaliyopangwa, au majeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: baada ya
  rationale: Katika muktadha huu, מִקֵּץ inaonyesha kufika kwa mwisho wa kipindi. ‘Baada ya’ ni Kiswahili cha kawaida kinachoonyesha kwamba miaka 430 ilikuwa imetimia.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: miaka mia nne na thelathini
  rationale: Mpangilio wa idadi umewekwa kwa namna ya kawaida ya Kiswahili huku jumla ya miaka 430 ikihifadhiwa.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: siku ileile
  rationale: Nahau hii inasisitiza kwamba tukio lilitokea katika siku hiyo hasa. ‘Siku ileile’ ni ya asili na hudumisha msisitizo huo.
- source_word: יָצְאוּ
  choice: vilitoka
  rationale: יצא hapa ina maana ya kutoka mahali; kitenzi kimepatana kisarufi na ‘vikosi.’
- source_word: צִבְאוֹת
  choice: vikosi
  rationale: צָבָא inaweza kumaanisha jeshi au kundi lililopangwa. ‘Vikosi’ huhifadhi wazo la makundi yaliyopangwa bila kudai wazi kwamba Waisraeli walikuwa wakipigana.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kuwa ‘Yahwe’ badala ya kubadilishwa na cheo.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Tafsiri hii inahifadhi neno אֶרֶץ (‘nchi’) na kuonyesha walikotoka.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu, si cheo; kwa hiyo jina hilo limehifadhiwa kwa matamshi ya Kiswahili.
- issue: Maana ya צִבְאוֹת יְהוָה
  choice: vikosi vyote vya Yahwe
  alternative: majeshi yote ya Yahwe
  rationale: ‘Vikosi’ hudumisha maana ya makundi yaliyopangwa na pia kivuli cha kijeshi, bila kutatua kimabavu iwapo hapa yanaitwa majeshi kwa maana kamili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ikawa’ inadumisha mtindo wa simulizi wa וַיְהִי; sentensi iliyobaki imeundwa kwa urahisi wa kusomeka kwa wasomaji wa kawaida.
