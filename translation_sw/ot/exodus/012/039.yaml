base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/039.yaml
  text: 'They baked the dough they had brought out of Egypt into unleavened cakes, since it had not become leavened: they had been driven out of Egypt and could not delay, and had not prepared provisions for themselves.'
translation:
  language: sw
  text: Wakaoka donge la unga walioutoa Misri kuwa mikate isiyo na chachu, kwa sababu halikuwa limechacha. Walikuwa wamefukuzwa kutoka Misri, nao hawakuweza kukawia; wala hawakuwa wamejiandalia mahitaji ya safari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאפוּ
  choice: Wakaoka
  rationale: Kitenzi cha masimulizi kinaendeleza mfululizo wa matukio; “wakaoka” ni cha kawaida na sahihi kwa kuoka mkate.
- source_word: הַבָּצֵק
  choice: unga
  rationale: Katika muktadha huu ni unga uliokwisha kukandwa. Kiswahili cha kawaida kinaweza kuutaja kwa ufupi kama “unga,” huku kitendo cha kuoka kikionyesha kuwa ni donge la unga, si unga mkavu.
- source_word: אֲשֶׁר הוֹצִיאוּ מִמִּצְרַיִם
  choice: walioutoa Misri
  rationale: Hii inahifadhi kishazi cha uhusiano kinachoutambulisha unga na kueleza kwamba walitoka nao Misri.
- source_word: עֻגֹת מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: עֻגֹת ni mikate yenye umbo la mviringo au mikate midogo, na מַצּוֹת inaonyesha kuwa haikuwa na chachu. “Mikate” ni ya kawaida zaidi kuliko tafsiri inayoweza kueleweka kama keki tamu.
- source_word: כִּי לֹא חָמֵץ
  choice: kwa sababu unga huo haukuwa umechacha
  rationale: Kitenzi חָמֵץ kinaeleza unga kuingia katika hali ya kuchacha; “haukuwa umechacha” huhifadhi nguvu hiyo ya kitenzi bila kuifanya tu kuwa taarifa kuhusu kiungo.
- source_word: כִּי גֹרְשׁוּ מִמִּצְרַיִם
  choice: Walikuwa wamefukuzwa kutoka Misri
  rationale: Umbo tendwa linaonyesha kuondolewa kwa nguvu, si kuondoka kwa hiari.
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  choice: nao hawakuweza kukawia
  rationale: “Kukawia” ni Kiswahili cha sasa kinachoonyesha kwamba hawakuwa na nafasi ya kuchelewa au kubaki zaidi.
- source_word: צֵדָה
  choice: chakula cha safari
  rationale: Neno hili hurejelea mahitaji au chakula kinachoandaliwa kwa safari; “chakula cha safari” ni wazi kwa msomaji wa kawaida katika muktadha huu.
- source_word: לָהֶם
  choice: wamejiandalia
  rationale: Umbo la kujirejelea linaonyesha kwamba maandalizi hayo yangekuwa kwa matumizi yao wenyewe.
