  yaml_path: translation/ot/exodus/012/028.yaml
  text: Then the sons of Israel went and did so; just as Yahweh had commanded Moses and Aaron[a], so they did.
translation:
  language: sw
  text: Kisha wana wa Israeli wakaenda, wakafanya hivyo; kama vile Yahwe alivyowaamuru Musa na Haruni, ndivyo walivyofanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: wakaenda
  rationale: Kitenzi הלך katika wayyiqtol kinaendeleza simulizi; “wakaenda” ni cha kawaida na hakiongezi lengo lisilotajwa wazi.
- source_word: וַיַּעֲשׂוּ
  choice: na kufanya hivyo
  rationale: עשה hapa hurejelea maagizo yaliyotangulia; “kufanya hivyo” huhifadhi urejeleo huo bila kufafanua zaidi ya maandishi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania, yaani “sons of Israel,” kwa Kiswahili cha heshima na kinachoeleweka.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Huonyesha ulinganifu wa karibu kati ya amri na utekelezaji.
- source_word: צִוָּה
  choice: alivyowaamuru
  rationale: Muundo huu wa Kiswahili huonyesha kwa kawaida kwamba amri ilitangulia utekelezaji, bila kulazimisha njeo isiyo ya lazima.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo; tahajia “Yahwe” inafuata maumbo ya kawaida ya Kiswahili.
- source_word: אֶת מֹשֶׁה וְאַהֲרֹן
  choice: Musa na Haruni
  rationale: Kiashirio cha yambwa אֶת kinawaonyesha Musa na Haruni kuwa waliopokea amri; hakuna msingi wa kuongeza “kupitia.”
- source_word: כֵּן עָשׂוּ
  choice: ndivyo walivyofanya
  rationale: Huhifadhi kifungu cha marudio kinachosisitiza utii wao kamili na kutoa hitimisho la kawaida kwa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la agano; kulitohowa huhifadhi tofauti yake na cheo “Bwana.”
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi mkuu huhifadhi taswira ya kifamilia na umbo la kiume la chanzo; “Waisraeli” ni fasiri ya kiidioma lakini isiyo wazi kwa muundo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha sasa. Marudio ya “kufanya hivyo ... ndivyo walivyofanya” yamehifadhiwa kwa kuwa ni msisitizo wa makusudi katika Kiebrania, si uradidi wa kuondolewa.
