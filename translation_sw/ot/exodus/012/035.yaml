base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/035.yaml
  text: And the sons of Israel did according to the word of Moses[a], and they asked the Egyptians for articles of silver and articles of gold and clothing.
translation:
  language: sw
  text: Wanaisraeli wakafanya kama Musa alivyosema; waliwaomba Wamisri vitu vya fedha, vitu vya dhahabu, na mavazi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Matoleo ya zamani ya Kiingereza mara nyingi yalitafsiri “walikopa,” lakini kitenzi cha Kiebrania hapa kwa kawaida humaanisha “kuomba” au “kuomba upewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Wanaisraeli
  rationale: Hili ndilo neno la kawaida na la asili katika Kiswahili kwa maana ya pamoja ya ‘wana wa Israeli,’ bila kudokeza kwamba walikuwa watoto tu.
- source_word: עָשׂוּ כִּדְבַר מֹשֶׁה
  choice: wakafanya kama Musa alivyosema
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi maana ya kutenda kulingana na neno la Musa bila kuongeza kwamba lilikuwa amri rasmi.
- source_word: וַיִּשְׁאֲלוּ
  choice: waliwaomba
  rationale: Kitenzi cha Kiebrania kimsingi humaanisha kuomba au kutaka upewe; ‘walikopa’ kingeongeza maana ambayo kitenzi chenyewe hakilazimishi.
- source_word: מִמִּצְרַיִם
  choice: Wamisri
  rationale: Ingawa umbo la Kiebrania ni ‘kutoka Misri,’ muktadha unaonyesha watu wa Misri ambao waliombwa vitu; ‘Wamisri’ ni wazi na asili katika Kiswahili.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: vitu vya fedha, vitu vya dhahabu
  rationale: כְּלִי ni neno pana linaloweza kumaanisha vifaa, vyombo, au vitu. ‘Vitu’ huepuka kulibana kuwa vyombo vya matumizi fulani.
- source_word: וּשְׂמָלֹת
  choice: mavazi
  rationale: Neno hili lina maana pana ya nguo au mavazi; ‘mavazi’ ni la sasa, lenye heshima, na halibani aina ya nguo.
theological_decisions:
- issue: Maana yenye uzito wa kimaadili ya וַיִּשְׁאֲלוּ katika simulizi la kutoka Misri
  choice: waliwaomba
  alternative: walikopa kutoka kwao
  rationale: Tafsiri kuu inahifadhi maana ya msingi ya kitenzi bila kuingiza wazo la mkopo na wajibu wa kurudisha. Maelezo ya baadaye kwamba Wamisri walinyang’anywa mali ni matokeo ya simulizi, si maana ya lazima ya kitenzi hiki pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wanaisraeli’ ni asili zaidi kuliko ‘wana wa Israeli,’ na ‘vitu’ huhifadhi upana wa neno la Kiebrania כְּלִי. Alama ya tanbihi imewekwa baada ya sentensi kwa kuwa inafafanua kitenzi ‘waliwaomba.’
