base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/011.yaml
  text: 'And this is how you shall eat it: with your waist belted[a], your sandals on your feet, and your staff in your hand. You shall eat it in haste[b]; it is the Passover of Yahweh.'
translation:
  language: sw
  text: 'Hivi ndivyo mtakavyokula: viuno vyenu vimefungwa kwa mikanda, sandali zenu miguuni mwenu, na fimbo zenu mikononi mwenu. Mtakula kwa haraka; ni Pasaka ya Yahwe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni Pasaka kwa ajili ya Yahwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָכָה
  choice: Hivi ndivyo
  rationale: Kauli hii inatanguliza namna iliyoagizwa ya kula mlo huo kwa Kiswahili cha kawaida na chenye nguvu ya maelekezo.
- source_word: תֹּאכְלוּ / וַאֲכַלְתֶּם
  choice: mtakavyokula / Mtakula
  rationale: Wakati ujao katika muktadha huu wa sheria unaonyesha agizo; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: מָתְנֵיכֶם חֲגֻרִים
  choice: viuno vyenu vikiwa vimefungwa
  rationale: Inahifadhi picha halisi ya mavazi yaliyofungwa kiunoni ili mtu awe tayari kuondoka, bila kutumia maelezo marefu katika matini kuu.
- source_word: נַעֲלֵיכֶם בְּרַגְלֵיכֶם
  choice: sandali zenu miguuni
  rationale: Sandali zinaendana na aina ya viatu katika mazingira ya kale na sentensi hii inaeleweka kwa urahisi.
- source_word: וּמַקֶּלְכֶם בְּיֶדְכֶם
  choice: na fimbo zenu mikononi
  rationale: Wingi wa Kiswahili unaonyesha kwa kawaida kwamba kila mmoja ana fimbo yake mkononi, kama ilivyo katika agizo la Kiebrania.
- source_word: בְּחִפָּזוֹן
  choice: kwa haraka
  rationale: Inawasilisha dharura na utayari wa kuondoka mara moja kwa lugha ya sasa na ya kawaida.
- source_word: פֶּסַח
  choice: Pasaka
  rationale: Hili ndilo neno lililozoeleka katika Kiswahili kwa jina la sherehe na mlo huu.
- source_word: הוּא לַיהוָה
  choice: ni Pasaka ya Yahwe
  rationale: Muundo huu unaonyesha kwamba Pasaka hiyo ni ya Yahwe, huku tanbihi ikihifadhi uwezekano wa kuelewa לַ kuwa inaelekeza Pasaka hiyo kwa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano lililo katika matini ya Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Matini ina jina binafsi la Mungu; ‘Yahwe’ hulihifadhi bila kulibadilisha kuwa cheo, huku ikitumia tahajia ya Kiswahili.
- issue: Uhusiano unaoonyeshwa na לַ katika פֶּסַח הוּא לַיהוָה
  choice: Pasaka ya Yahwe
  alternative: Pasaka kwa ajili ya Yahwe
  rationale: ‘Ya Yahwe’ ni Kiswahili cha kawaida kinachoonyesha kuwa Pasaka hii ni yake au imeteuliwa kuwa yake; tanbihi inahifadhi maana ya uwekaji wakfu au uelekeo inayoweza kuonyeshwa na kihusishi hicho.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ni mfupi na wa moja kwa moja ili kudumisha uzito wa agizo na hali ya dharura. Viwakilishi vya wingi vinawakilisha mgawanyo wa kawaida: kila mtu ana sandali na fimbo yake.'
