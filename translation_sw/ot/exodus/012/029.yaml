id: EXO.12.29
reference: Exodus 12:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַֽ/יהוָה֮ הִכָּ֣ה כָל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכֹ֤ר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שְּׁבִ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/בּ֑וֹר וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/029.yaml
  text: And at midnight Yahweh struck down every firstborn in the land of Egypt[a], from the firstborn of Pharaoh, who sat on his throne, to the firstborn of the captive who was in the prison pit, and every firstborn of the livestock.
translation:
  language: sw
  text: Ikawa usiku wa manane, Yahweh akawapiga wazaliwa wote wa kwanza katika nchi ya Misri, kuanzia mzaliwa wa kwanza wa Farao, aliyeketi kwenye kiti chake cha enzi, hadi mzaliwa wa kwanza wa mateka aliyekuwa katika shimo la kufungia[a], pamoja na kila mzaliwa wa kwanza wa mifugo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mzaliwa wa kwanza wa mfungwa aliyekuwa gerezani.”
    reason: Neno שְׁבִי linaweza kueleweka kuwa mateka au mfungwa, na בֵּית הַבּוֹר ni mahali pa kifungo, kihalisi “nyumba ya shimo.”
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Katika simulizi, muundo huu unaendeleza mfululizo wa matukio; “Ikawa” ni wa asili na wenye hadhi bila kutumia lugha ya kizamani.
- source_word: בַּחֲצִי הַלַּיְלָה
  choice: usiku wa manane
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kueleza katikati ya usiku.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi wa Kiswahili badala ya kubadilishwa na cheo.
- source_word: הִכָּה
  choice: akawaua
  rationale: Kitenzi kwa msingi wake ni “kupiga,” lakini katika muktadha huu pigo hilo liliua; uchaguzi huu unaweka wazi matokeo yaliyokusudiwa.
- source_word: כָל בְּכוֹר
  choice: wazaliwa wote wa kwanza
  rationale: Kauli hii huonyesha jumla ya wazaliwa wa kwanza waliopatwa na pigo na inasikika kwa kawaida katika Kiswahili.
- source_word: מִבְּכֹר ... עַד בְּכוֹר
  choice: kuanzia mzaliwa wa kwanza ... hadi mzaliwa wa kwanza
  rationale: Muundo wa “kuanzia ... hadi ...” unahifadhi wigo unaoonyeshwa na maneno ya Kiebrania.
- source_word: הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: aliyeketi kwenye kiti chake cha enzi
  rationale: Kirai hiki kinaeleza hadhi ya kifalme ya Farao; koma zinaweka wazi kwamba anayeketi ni Farao.
- source_word: בְּכוֹר הַשְּׁבִי
  choice: mzaliwa wa kwanza wa mateka
  rationale: שְׁבִי humaanisha mtu aliyetekwa; “mateka” huhifadhi maana hiyo pana kuliko “mfungwa.”
- source_word: אֲשֶׁר בְּבֵית הַבּוֹר
  choice: aliyekuwa katika shimo la gereza
  rationale: Tafsiri hii inahifadhi picha halisi ya בּוֹר, “shimo,” na pia maana yake katika mazingira ya kifungo.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: pamoja na kila mzaliwa wa kwanza wa mifugo
  rationale: בְּהֵמָה hapa inahusu kwa upana wanyama wanaofugwa, si ng’ombe peke yao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kitenzi הִכָּה katika pigo la wazaliwa wa kwanza
  choice: akawaua
  alternative: akawapiga
  rationale: Ingawa maana ya msingi ni “kupiga,” muktadha wa pigo hili unaonyesha wazi kuwa pigo lilisababisha kifo. Tafsiri hii haifichi matokeo hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. Muundo wa kijamii kutoka Farao hadi mateka umehifadhiwa, pamoja na picha ya shimo la gereza.
