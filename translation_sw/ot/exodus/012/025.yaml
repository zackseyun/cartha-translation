  text: And when you come into the land that Yahweh will give you[a], just as he promised[b], you shall keep this service.
translation:
  language: sw
  text: Na mtakapoingia katika nchi ambayo Yahwe atawapa, kama alivyoahidi[a], mtashika ibada hii[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama alivyosema.” Kiebrania ni kihalisi “kama alivyonena,” lakini katika muktadha huu maneno hayo yanahusu ahadi yake ya awali.
    reason: lexical_alternative
  - marker: b
    text: Au, “huduma hii ya ibada” au “utaratibu huu wa ibada.” Neno la Kiebrania hapa linamaanisha huduma ya kiibada ya Pasaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Na mtakapoingia
  rationale: Kauli hii ya Kiebrania huanzisha hali ya wakati ujao. Muundo wa Kiswahili wenye kiambishi -takapo- unaonyesha kwa kawaida maana ya ‘wakati mtakapo-’ bila kunakili nahau ya Kiebrania neno kwa neno.
- source_word: תָבֹאוּ אֶל הָאָרֶץ
  choice: mtakapoingia katika nchi
  rationale: Kitenzi בוא kinaweza kumaanisha kuja au kuingia; pamoja na אֶל הָאָרֶץ, ‘kuingia katika nchi’ ni Kiswahili cha kawaida na sahihi.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לָכֶם
  choice: ambayo Yahwe atawapa
  rationale: Umbo la kitenzi linaelekea wakati ujao katika muktadha huu, nalo jina la agano יְהוָה limeandikwa ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: kama alivyoahidi
  rationale: Ingawa דִּבֵּר kimsingi ni ‘alisema/alinena,’ katika muktadha huu neno la awali la Yahwe ni ahadi kuhusu nchi; ‘alivyoahidi’ huwasilisha nguvu hiyo kwa Kiswahili cha kawaida huku tanbihi ikihifadhi tafsiri halisi zaidi.
- source_word: וּשְׁמַרְתֶּם
  choice: mtaadhimisha
  rationale: שׁמר pamoja na jambo la kiibada humaanisha kulishika au kuliadhimisha. ‘Mtaadhimisha’ ni ya kawaida kwa maadhimisho ya Pasaka na huhifadhi wajibu unaoelekezwa kwa wakati ujao.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: ibada hii
  rationale: עֲבֹדָה hapa si kazi ya kawaida bali huduma au tendo la kiibada la Pasaka. ‘Ibada hii’ ni fupi, yenye heshima, na inaeleweka kwa wasomaji wa sasa.
theological_decisions:
- issue: Uandishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano lenyewe. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya כַּאֲשֶׁר דִּבֵּר
  choice: kama alivyoahidi
  alternative: kama alivyosema
  rationale: Muktadha wa kupewa nchi unaifanya kauli ya awali kuwa na nguvu ya ahadi. Hata hivyo, kwa kuwa kitenzi chenyewe ni ‘kunena/kusema,’ uwezekano huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inatumia muundo wa kawaida ‘mtakapoingia,’ inalihifadhi jina ‘Yahwe,’ na inaeleza tendo la Pasaka kama ‘ibada’ bila kuingiza istilahi ya dhehebu fulani.
