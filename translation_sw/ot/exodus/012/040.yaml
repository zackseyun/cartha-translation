lexical_decisions:
- source_word: מוֹשַׁב
  choice: kukaa
  rationale: Nomino hii hueleza hali au kipindi cha kuishi mahali fulani. “Kukaa” ni ya kawaida na inaeleweka, huku ikidumisha umbo la nomino katika Kiebrania.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hufuata kwa karibu usemi wa Kiebrania “wana wa Israeli” na kuhifadhi jina la jadi la agano badala ya kulisawazisha kuwa “Waisraeli.”
- source_word: אֲשֶׁר יָשְׁבוּ
  choice: ambao waliishi
  rationale: Kishazi rejeshi katika Kiebrania kinawahusu wana wa Israeli. “Waliishi” ni tafsiri ya kawaida ya ישׁב katika muktadha huu na huepuka urudiaji usio wa asili wa “kukaa ... walikaa.”
- source_word: בְּמִצְרָיִם
  choice: Misri
  rationale: Ni usemi wa mahali unaotafsiriwa kwa kawaida kama “Misri”; katika Kiswahili sanifu jina hili linaweza kutumiwa bila “katika.”
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: miaka mia nne na thelathini
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi jumla ya miaka 430 iliyotajwa katika Kiebrania.
theological_decisions:
- issue: Je, miaka 430 inahusu kukaa Misri pekee au pia kukaa Kanaani?
  choice: 'Matini kuu inafuata WLC/Masoretiki: wana wa Israeli waliishi Misri kwa kipindi kilichotajwa cha miaka 430.'
  alternative: Baadhi ya mashahidi wa kale huongeza mababu na Kanaani, hivyo kuifanya miaka 430 ihusu kipindi kipana zaidi cha kukaa ugenini.
  rationale: Chanzo kilichotolewa kinasema wazi “Misri.” Tofauti ya kale ina athari kwa mpangilio wa nyakati, kwa hiyo imehifadhiwa katika tanbihi bila kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi unafuata Kiebrania kwa ukaribu bila kuwa mgumu kupita kiasi; alama ya tanbihi imewekwa baada ya “wana wa Israeli” kama katika safu ya mashauriano.
