  text: You shall not eat anything leavened[b][a]; in all your dwellings you shall eat unleavened bread.
translation:
  language: sw
  text: Msile kitu chochote kilichochachushwa[a]; katika makao yenu yote[b] mtakula mikate isiyotiwa chachu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msile kitu chochote kilichotiwa chachu.” Neno la Kiebrania lina maana pana kuliko mkate pekee na linahusu kitu chochote kilichochachushwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika makazi yenu yote,” yaani, kila mahali mnapoishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַחְמֶצֶת
  choice: kitu chochote kilichochachushwa
  rationale: Katika katazo hili, כָּל pamoja na מַחְמֶצֶת ina maana pana ya kutokula kitu chochote kilichochachushwa; tafsiri hii haifungi maana katika mkate peke yake.
- source_word: לֹא תֹאכֵלוּ
  choice: msile
  rationale: Hii ni njia ya kawaida, wazi, na yenye uzito wa kutoa katazo katika Kiswahili, huku ikielekezwa kwa wingi kama ilivyo katika Kiebrania.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: katika makao yenu yote
  rationale: מוֹשָׁב inaweza kumaanisha mahali pa kuishi au makazi; ‘makao yenu yote’ huhifadhi upeo wa kila mahali ambapo watu wanaishi.
- source_word: תֹּאכְלוּ
  choice: mtakula
  rationale: Wakati ujao wa Kiswahili hapa unaweza kubeba nguvu ya agizo la kisheria na kudumisha muundo sambamba na katazo la kwanza.
- source_word: מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: Neno hili humaanisha mikate iliyotengenezwa bila chachu; tafsiri hii ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
