  text: And all the sons of Israel did as Yahweh had commanded Moses and Aaron[b][a]; so they did.
translation:
  language: sw
  text: Wana wote wa Israeli walifanya kama Yahwe alivyowaamuru Mose na Aroni; ndivyo walivyofanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: walifanya
  rationale: Kitenzi עשה hapa kina maana ya kutenda au kufanya kwa kutii maagizo; “walifanya” ni Kiswahili cha kawaida na pia huhifadhi urudiaji wa kitenzi mwishoni.
- source_word: כָּל
  choice: wote
  rationale: כָּל pamoja na kirai kinachofuata huonyesha ujumla wa kundi lote; “wote” linaendana kisarufi na “wana.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Wana wote wa Israeli
  rationale: Kirai hiki ni “wana wa Israeli” kwa muundo wake. Tafsiri hiyo inahifadhi lugha ya kifamilia ya Kiebrania bila kuibadili kuwa jina la kikabila tu; neno “wote” limewekwa baada ya “wana” kwa mtiririko wa kawaida wa Kiswahili.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: Neno hili huonyesha kwamba tendo lao lililingana na agizo walilopewa; “kama” ni fupi, wazi, na la kawaida.
- source_word: צִוָּה
  choice: alivyokuwa amewaamuru
  rationale: Kauli hii inaonyesha kuwa amri ilitangulia utekelezaji. Kiambishi cha yambwa “-wa-” kinawaonyesha Mose na Aroni kuwa ndio walioamriwa moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetoholewa kuwa “Yahwe,” namna inayotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo “BWANA.”
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Mose na Aroni
  rationale: Viashiria vya yambwa wa moja kwa moja vinaonyesha kuwa Mose na Aroni ndio walioamriwa; haviongezi maana ya kihusishi kama “kupitia.”
- source_word: כֵּן
  choice: ndivyo
  rationale: “Ndivyo” hurejelea na kusisitiza kwamba walifanya sawasawa na agizo.
- source_word: עָשׂוּ
  choice: walivyofanya
  rationale: Urudiaji wa עשה umehifadhiwa ili kudumisha msisitizo wa Kiebrania juu ya utii wao.
theological_decisions:
- issue: Uwasilishaji wa jina la agano יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku likifuata tahajia iliyozoeleka katika Kiswahili.
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Kiebrania kina usemi wa kifamilia “wana wa Israeli.” Main text inauhifadhi badala ya kuufanya moja kwa moja kuwa jina la taifa, bila kudai kwamba kundi linalokusudiwa linahusu wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kifamilia wa Kiebrania na urudiaji wa kitenzi umehifadhiwa; hakuna tanbihi iliyohitajika.
