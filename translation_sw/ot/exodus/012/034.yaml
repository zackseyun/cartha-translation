  yaml_path: translation/ot/exodus/012/034.yaml
  text: So the people carried their dough before it was leavened[a], with their kneading bowls bound up in their cloaks on their shoulders.
translation:
  language: sw
  text: Basi watu wakabeba unga wao uliokandwa kabla haujachachuka, vyombo vyao vya kukandia[a] vikiwa vimefungwa katika nguo zao juu ya mabega yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mabakuli yao ya kukandia.” Neno la Kiebrania linamaanisha vyombo vilivyotumiwa kuandaa unga uliokandwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: wakabeba
  rationale: Kitenzi נשׂא hapa kinaeleza kubeba vitu wakati wa kuondoka; ‘wakabeba’ ni Kiswahili cha kawaida na kinaendana na muktadha wa safari.
- source_word: הָעָם
  choice: watu
  rationale: עָם inarejelea Waisraeli kwa ujumla; ‘watu’ ni tafsiri ya wazi na ya kawaida katika simulizi.
- source_word: בְּצֵקוֹ
  choice: unga wao uliokandwa
  rationale: בָּצֵק ni unga uliochanganywa na kukandwa, si unga mkavu tu. Kiambishi cha Kiebrania ni cha umoja kwa sababu ya nomino ya pamoja ‘watu,’ lakini Kiswahili hutumia ‘wao’ kwa maana hii ya pamoja.
- source_word: טֶרֶם יֶחְמָץ
  choice: kabla haujachachuka
  rationale: Kauli hii inaonyesha kwamba unga uliokandwa ulikuwa bado haujapitia mchakato wa kuchachuka. ‘Haujachachuka’ ni ya asili na inaeleweka katika Kiswahili cha sasa.
- source_word: מִשְׁאֲרֹתָם
  choice: vyombo vyao vya kukandia
  rationale: Nomino hii inamaanisha vyombo vilivyotumiwa kuandaa au kukandia unga. ‘Vyombo vya kukandia’ huhifadhi upana wa neno la Kiebrania bila kulazimisha umbo maalumu la chombo.
- source_word: צְרֻרֹת
  choice: vilikuwa vimefungwa
  rationale: Kauli tendwa ya צרר inaonyesha vitu vilivyofungwa au kuunganishwa kuwa vifurushi kwa ajili ya kubebwa.
- source_word: בְּשִׂמְלֹתָם
  choice: ndani ya mavazi yao
  rationale: שִׂמְלָה ni vazi, mara nyingi vazi la nje. ‘Mavazi yao’ ni ya kawaida na huhifadhi wazo la kutumia nguo kufungia vyombo.
- source_word: עַל שִׁכְמָם
  choice: mabegani mwao
  rationale: Kirai hiki kinaonyesha mahali vifurushi vilipobebwa. Wingi unafaa kwa ‘watu’ kama kundi.
