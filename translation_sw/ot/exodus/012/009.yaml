  text: אַל תֹּאכְל֤וּ מִמֶּ֨/נּוּ֙ נָ֔א וּ/בָשֵׁ֥ל מְבֻשָּׁ֖ל בַּ/מָּ֑יִם כִּ֣י אִם צְלִי אֵ֔שׁ רֹאשׁ֥/וֹ עַל כְּרָעָ֖י/ו וְ/עַל קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/009.yaml
  text: Do not eat any of it raw or boiled in water[a], but only roasted over the fire, with its head, its legs, and its inner parts.
translation:
  language: sw
  text: Msile nyama yake ikiwa mbichi wala ikiwa imechemshwa majini, bali ikiwa imeokwa motoni tu, pamoja na kichwa chake, miguu yake na sehemu zake za ndani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָא
  choice: ikiwa mbichi
  rationale: Katika muktadha wa kupika nyama, neno hili linamaanisha nyama isiyopikwa; ‘ikiwa mbichi’ ni Kiswahili cha kawaida na wazi.
- source_word: וּבָשֵׁל מְבֻשָּׁל בַּמָּיִם
  choice: wala ikiwa imechemshwa majini
  rationale: Muundo wa Kiebrania unasisitiza kupikwa kwa maji, yaani kuchemshwa; tafsiri hii ni ya kawaida na inadumisha njia mahsusi ya upishi inayokatazwa.
- source_word: כִּי אִם
  choice: bali ... tu
  rationale: 'Muundo huu unaonyesha tofauti yenye upekee: si kwa njia zilizotajwa, bali kwa njia hii pekee.'
- source_word: צְלִי אֵשׁ
  choice: ikiwa imeokwa motoni
  rationale: Kirai kinamaanisha nyama iliyopikwa kwa moto kwa kuokwa; ‘imeokwa motoni’ ni usemi wa asili unaotofautisha njia hii na kuchemsha.
- source_word: רֹאשׁוֹ עַל־כְּרָעָיו וְעַל־קִרְבּוֹ
  choice: pamoja na kichwa chake, miguu yake na sehemu zake za ndani
  rationale: עַל inayorudiwa hapa ina maana ya kuambatanisha sehemu hizo. Tafsiri hii inadokeza mnyama kuokwa pamoja na sehemu zote zilizoorodheshwa bila kuongeza kwa wazi neno ‘mzima.’
- source_word: מִמֶּנּוּ
  choice: nyama yake
  rationale: Kihusishi hiki kina maana ya sehemu ya kitu kilichotajwa. Kwa kuwa muktadha ni ulaji wa mwana-kondoo au mbuzi, ‘nyama yake’ ni ya kawaida katika Kiswahili na huepuka usemi mgumu ‘chochote kutoka kwake.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Sehemu zake za ndani’ limetumiwa badala ya neno kali zaidi ‘matumbo,’ huku maana ya קֶרֶב ikihifadhiwa. Hakuna tanbihi inayohitajika kwa aya hii.
