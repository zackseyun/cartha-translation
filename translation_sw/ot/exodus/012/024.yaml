  text: Nanyi mtalishika jambo hili kama sheria kwako na kwa wana wako wa kiume milele[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitu hiki” au “neno hili.” Neno la Kiebrania linaweza kumaanisha kwa upana jambo, kitu, au neno lililosemwa.
    reason: lexical_alternative
  - marker: b
