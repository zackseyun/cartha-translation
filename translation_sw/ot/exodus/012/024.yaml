    issue: “Wanao” does not explicitly mean “your sons.”
    rationale: In Standard East African Swahili, “wanao” normally denotes one’s children generally. Since the Hebrew specifically has “your sons,” the main text should say “wana wako wa kiume.”
  - severity: low
