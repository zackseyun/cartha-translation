lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Nanyi mtalishika
  rationale: Kitenzi שׁמר katika muktadha wa sheria na agano humaanisha kushika au kutii kwa uaminifu. “Mtalishika” ni Kiswahili cha kawaida na huhifadhi wazo la wajibu unaoendelea.
- source_word: הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: דָּבָר inaweza kumaanisha jambo, kitu, au neno. “Jambo hili” lina upana unaofaa na katika muktadha hurejelea maadhimisho yaliyoagizwa hapo awali bila kuyafafanua kupita kiasi.
- source_word: לְחָק
  choice: kuwa agizo
  rationale: חֹק ni jambo lililowekwa au kuamriwa, hasa katika mazingira ya kisheria au ya agano. “Agizo” ni la kawaida, lenye heshima, na linaonyesha mamlaka ya kile kilichowekwa.
- source_word: לְךָ וּלְבָנֶיךָ
  choice: kwako na kwa wanao
  rationale: Kiebrania kinasema moja kwa moja “kwako na kwa wana wako.” “Wanao” huhifadhi umbo hilo bila kulipanua kimya kimya kuwa watoto au wazao.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Muungano עַד עוֹלָם unaonyesha muda unaoendelea au wa kudumu. “Milele” ni tafsiri fupi na ya kawaida katika Kiswahili cha Biblia.
theological_decisions:
- issue: Upeo wa lugha ya urithi wa agano katika “wanao”
  choice: Kuhifadhi “wanao” katika matini kuu
  alternative: watoto wako; wazao wako
  rationale: Kiebrania kinataja “wana” waziwazi. Tafsiri kuu inadumisha umbo la chanzo, huku tanbihi ikionyesha maana pana inayowezekana katika mfululizo wa vizazi bila kuifanya kuwa tafsiri pekee.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa nafsi umehifadhiwa: kitenzi ni wingi (“mtalishika”), kisha “kwako/wanao” ni umoja kama ilivyo katika Kiebrania, ambapo jamii nzima inaelekezwa na wajibu unatumika kwa kila mmoja.'
