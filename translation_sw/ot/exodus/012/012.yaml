base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/012.yaml
  text: For I will pass through the land of Egypt on this night[a], and I will strike every firstborn in the land of Egypt, from man to beast; and against all the gods of Egypt I will execute judgments[c][b]. I am Yahweh.
translation:
  language: sw
  text: Kwa maana usiku huu nitapita katika nchi ya Misri[a], nami nitapiga kila mzaliwa wa kwanza katika nchi ya Misri, kuanzia mwanadamu mpaka mnyama[b]. Nitatekeleza hukumu dhidi ya miungu yote ya Misri. Mimi ni Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitapitia.” Kitenzi hapa kinamaanisha kupitia nchi, si “kupita” kwa maana ya kuwaacha watu fulani wasiangamizwe.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa neno halisi: “kutoka kwa mwanadamu mpaka kwa mnyama.”'
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: YHWH; kwa desturi hutafsiriwa “BWANA.” Pia huandikwa “Yehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַרְתִּי
  choice: nitapita katika
  rationale: Kitenzi עבר pamoja na בְּאֶרֶץ kinaonyesha kupita ndani au kupitia nchi; hapa hakimaanishi ‘kupita bila kuumiza’ au kuacha nyumba salama.
- source_word: בְאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Neno אֶרֶץ limedumishwa ili kuonyesha wazi eneo lote ambalo tendo hilo litatokea.
- source_word: בַלַּיְלָה הַזֶּה
  choice: usiku huu
  rationale: Hii ni tafsiri ya kawaida na ya asili ya Kiswahili inayodumisha msisitizo wa kiashiria הַזֶּה.
- source_word: וְהִכֵּיתִי
  choice: nitampiga
  rationale: Kitenzi נכה humaanisha kupiga; muktadha unaonyesha matokeo ya kifo bila kulazimisha maana hiyo ndani ya kitenzi chenyewe.
- source_word: כָּל בְּכוֹר
  choice: kila mzaliwa wa kwanza
  rationale: Hii inawakilisha tungo ya umoja yenye maana ya ujumla. Jinsia ya kiume haijaongezwa kwa sababu haikutajwa wazi katika Kiebrania.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: kuanzia mwanadamu mpaka mnyama
  rationale: Tungo hii inaonyesha upeo unaojumuisha wanadamu na wanyama; ‘mwanadamu’ huepuka kueleweka kana kwamba wanaume pekee ndio wanaokusudiwa.
- source_word: וּבְכָל אֱלֹהֵי מִצְרַיִם
  choice: dhidi ya miungu yote ya Misri
  rationale: Kihusishi katika muktadha huu huonyesha hukumu inayoelekezwa kwa uhasama dhidi ya miungu ya Misri. Neno ‘miungu’ linadumisha dai la wazi la maandishi bila kulibadili kuwa ‘sanamu’ au ‘watawala.’
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: nitatekeleza hukumu
  rationale: Tafsiri hii inadumisha uzito wa kimahakama wa nahau hiyo na ni Kiswahili cha sasa kinachoeleweka.
- source_word: אֲנִי יְהוָה
  choice: Mimi ni Yahwe
  rationale: Jina la agano יהוה limetolewa kama jina binafsi ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יהוה. ‘Yahwe’ hudumisha jina la agano, huku tanbihi ikitaja desturi nyingine ya kulitafsiri.
- issue: Hadhi ya אֱלֹהֵי מִצְרַיִם
  choice: miungu ya Misri
  alternative: sanamu za Misri; watawala wa Misri
  rationale: Kiebrania kinasema wazi ‘miungu ya Misri.’ Tafsiri haiondoi au kutatua kimya kimya mvutano wa kitheolojia kwa kuigeuza kuwa sanamu au watawala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishazi cha wakati umefanywa wa asili kwa Kiswahili bila kupoteza msisitizo wa ‘usiku huu.’
