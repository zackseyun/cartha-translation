lexical_decisions:
- source_word: תּוֹשָׁב
  choice: mgeni mkazi
  rationale: Neno hili humaanisha mtu asiye mwenyeji ambaye anaishi miongoni mwa jamii bila kuhesabiwa kuwa mshiriki kamili wa agano. “Mgeni mkazi” linaonyesha kwa ufupi hali yake ya kuwa mkaaji na pia mtu wa nje.
- source_word: שָׂכִיר
  choice: mfanyakazi wa kuajiriwa
  rationale: Neno hili humtaja mtu anayefanya kazi kwa ujira. Usemi huu ni wa sasa, unaeleweka kwa urahisi, na haudokezi kwamba lazima awe mtumwa.
- source_word: לֹא יֹאכַל
  choice: hatakula
  rationale: Katika sheria, kitenzi kisichotimilika kilichokanushwa kina nguvu ya katazo. “Hatakula” huhifadhi mtindo mfupi na wa kisheria wa Kiebrania.
- source_word: בּוֹ
  choice: hataila
  rationale: Kiambishi cha yambwa “-i-” katika “hataila” kinawakilisha kiwakilishi cha Kiebrania na kuelekeza kwenye chakula au mnyama wa Pasaka aliyetajwa katika muktadha. Kiswahili hakihitaji kuiga kihusishi cha Kiebrania ili kuonyesha kushiriki chakula hicho.
theological_decisions:
- issue: Kirejeleo cha kiwakilishi בּוֹ katika sheria ya Pasaka
  choice: Kiwakilishi kimehifadhiwa katika “hataila,” kikirejelea Pasaka iliyo katika muktadha.
  alternative: Kutaja wazi “chakula cha Pasaka” au, kwa maana finyu zaidi, “mwana-kondoo wa Pasaka.”
  rationale: Kiebrania hakilitaji tena jina la kitu kinacholiwa. Kutumia kiwakilishi huhifadhi ufupi na kiwango cha kutobainisha cha matini, huku tanbihi ikifafanua kirejeleo kinachotokana na muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi, wenye heshima na wa kisheria. Muundo “hataila” ni wa kawaida na huepuka tafsiri ngumu ya neno kwa neno ya kihusishi cha Kiebrania.
