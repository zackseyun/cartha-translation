source:
  edition: WLC
  text: וְ/עָבַ֣ר יְהוָה֮ לִ/נְגֹּ֣ף אֶת מִצְרַיִם֒ וְ/רָאָ֤ה אֶת הַ/דָּם֙ עַל הַ/מַּשְׁק֔וֹף וְ/עַ֖ל שְׁתֵּ֣י הַ/מְּזוּזֹ֑ת וּ/פָסַ֤ח יְהוָה֙ עַל הַ/פֶּ֔תַח וְ/לֹ֤א יִתֵּן֙ הַ/מַּשְׁחִ֔ית לָ/בֹ֥א אֶל בָּתֵּי/כֶ֖ם לִ/נְגֹּֽף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/023.yaml
  text: For Yahweh will pass through to strike Egypt[a], and when he sees the blood on the lintel and on the two doorposts[b], Yahweh will pass over the doorway and will not allow the destroyer to enter your houses to strike.
translation:
  language: sw
  text: Kwa maana Yahweh atapita katika nchi ya Misri ili kuipiga. Atakapoiona damu kwenye kizingiti cha juu na kwenye miimo miwili ya mlango, Yahweh ataupita juu ya mlango huo[a], naye hatamruhusu mharibu[b] kuingia katika nyumba zenu ili kupiga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atauhifadhi” au “ataulinda.” Kitenzi cha Kiebrania ndicho kinachohusishwa na Pasaka.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hakimtambulishi “mharibu” zaidi; baadhi huona kuwa ni mtendaji wa hukumu wa kimalaika.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo, hivyo kudumisha jina binafsi la Kiebrania.
- source_word: וְעָבַר
  choice: atapita katikati ya Misri
  rationale: Kitenzi עבר hapa kinaonyesha mwendo kupitia nchi kwa kusudi la kuipiga; tafsiri hii pia inakitofautisha na פסח baadaye katika aya.
- source_word: לִנְגֹּף
  choice: ili kuipiga / ili kupiga
  rationale: נגף linaonyesha kupiga kwa hukumu yenye mauti. 'Kupiga' ni neno la sasa, wazi, na hudumisha uzito wa tendo bila kutumia lugha ya kizamani.
- source_word: הַמַּשְׁקוֹף
  choice: kizingiti cha juu
  rationale: Neno hili linaeleweka kwa wasomaji wa kawaida kama sehemu ya juu iliyolala ya fremu ya mlango, na linaepuka istilahi adimu ya kiufundi.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: miimo miwili ya mlango
  rationale: Hizi ni nguzo mbili wima za pembeni mwa mlango; 'miimo miwili ya mlango' ni sahihi na ya kawaida katika Kiswahili.
- source_word: וּפָסַח
  choice: atalipita
  rationale: Tafsiri hii inadumisha picha ya kupita na uhusiano wa kitenzi פסח na Pasaka, bila kuamua kimya kimya kati ya maana zinazowezekana za kuacha, kusalimisha, au kulinda.
- source_word: עַל הַפֶּתַח
  choice: ingilio
  rationale: פתח hapa ni nafasi au njia ya kuingilia nyumbani, si lazima bamba la mlango; 'ingilio' huitofautisha na fremu iliyotajwa tayari.
- source_word: וְלֹא יִתֵּן
  choice: hatamruhusu
  rationale: נתן pamoja na kitenzi-jina hapa ni nahau yenye maana ya kuruhusu; Kiswahili cha kawaida huhitaji kiambishi cha mtendwa kwa sababu mharibu ametajwa.
- source_word: הַמַּשְׁחִית
  choice: mharibu
  rationale: Neno linamtaja mtendaji wa uharibifu bila kueleza utambulisho wake. 'Mharibu' ni la moja kwa moja na haliongezi kwamba ni malaika.
theological_decisions:
- issue: Uhusiano kati ya Yahweh na “mharibu”
  choice: Yahweh na mharibu wametajwa kwa namna tofauti, huku Yahweh akimzuia mharibu asiingie nyumbani.
  alternative: Kumchukulia mharibu kuwa namna nyingine tu ya kumtaja Yahweh, au kuongeza “malaika mharibu.”
  rationale: Kiebrania kinawatofautisha kisarufi katika kishazi hiki lakini hakifafanui utambulisho wa mharibu. Tafsiri inadumisha utofauti na mvutano huo bila kuongeza maelezo.
- issue: Maana ya פסח katika aya hii
  choice: atalipita
  alternative: atalisalimisha; atalilinda
  rationale: Kitenzi hiki ni cha msingi katika simulizi la Pasaka. 'Atalipita' hudumisha picha na uhusiano wa kimatamshi, huku tanbihi ikionyesha maana mbadala zinazowezekana na muktadha wenyewe ukieleza matokeo ya ulinzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa mara mbili ili iwe rahisi kusoma bila kuvunja mfuatano wa matendo. Jina Yahweh limehifadhiwa, istilahi za fremu ya mlango zimewekwa wazi, na utambulisho wa mharibu haujafafanuliwa kupita maandishi ya Kiebrania.
