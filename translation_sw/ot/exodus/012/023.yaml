  terminology: “Yahweh,” “kizingiti cha juu,” “miimo miwili ya mlango,” na “mharibu” ni chaguo zinazofaa. “Mharibu” haimlazimishi kuwa malaika, kama ilivyo katika Kiebrania. Tanbihi ya mharibu inaendelea kuhifadhi kutotajwa kwa utambulisho wake.
