revisions:
- from: Siku hii itakuwa kwenu siku ya ukumbusho, nanyi mtaiadhimisha kuwa sikukuu kwa Yahweh. Katika vizazi vyenu vyote mtaiadhimisha kuwa agizo la kudumu.[a]
  to: Siku hii itakuwa kwenu ukumbusho; nanyi mtaiadhimisha kama sikukuu kwa Yahweh. Katika vizazi vyenu vyote mtaiadhimisha kama sheria ya kudumu.[a]
  rationale: Marekebisho ni ya mtindo na istilahi pekee. Yameondoa urudiaji usiohitajika, yamebadili "kuwa" kuwa "kama" kwa Kiswahili cha asili, na yameweka "sheria" kama tafsiri iliyo wazi ya חֻקָּה. Maana, jina Yahweh, marudio ya kuadhimisha, na kiambishi cha tanbihi vimehifadhiwa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:57:52Z'
