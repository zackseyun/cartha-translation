  text: וְ/הָיָה֩ הַ/יּ֨וֹם הַ/זֶּ֤ה לָ/כֶם֙ לְ/זִכָּר֔וֹן וְ/חַגֹּתֶ֥ם אֹת֖/וֹ חַ֣ג לַֽ/יהוָ֑ה לְ/דֹרֹ֣תֵי/כֶ֔ם חֻקַּ֥ת עוֹלָ֖ם תְּחָגֻּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/014.yaml
  text: And this day shall be for you as a memorial[a], and you shall celebrate it as a feast to Yahweh; throughout your generations, you shall celebrate it as a permanent statute.
translation:
  language: sw
  text: Siku hii itakuwa kwenu ukumbusho; nanyi mtaiadhimisha kama sikukuu kwa Yahweh. Katika vizazi vyenu vyote mtaiadhimisha kama sheria ya kudumu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sheria ya milele” au “sheria ya daima.” Kauli ya Kiebrania חֻקַּת עוֹלָם mara nyingi humaanisha sheria inayodumu na kuendelea kutekelezwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הַיּוֹם הַזֶּה לָכֶם
  choice: Siku hii itakuwa kwenu
  rationale: Muundo huu huhifadhi nguvu ya wakati ujao ya וְהָיָה pamoja na uhusiano unaoonyeshwa na לָכֶם, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: לְזִכָּרוֹן
  choice: siku ya ukumbusho
  rationale: זִכָּרוֹן humaanisha ukumbusho au kumbukumbu; kurudia 'siku' katika Kiswahili kunafanya sentensi iwe wazi na ya asili bila kubadili maana.
- source_word: וְחַגֹּתֶם אֹתוֹ חַג
  choice: mtaiadhimisha kuwa sikukuu
  rationale: Kitenzi חגג na nomino חַג zinahusu kuadhimisha sikukuu. Tafsiri hii huhifadhi kitendo na hali ya siku hiyo kama sikukuu kwa lugha ya sasa.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Kihusishi ל־ hapa kinaonyesha kwamba sikukuu inaelekezwa kwa Yahweh na ni kwa heshima yake; 'kwa Yahweh' ni Kiswahili cha asili.
- source_word: לְדֹרֹתֵיכֶם
  choice: Katika vizazi vyenu vyote
  rationale: Kauli hii huonyesha uendelevu wa maadhimisho kizazi baada ya kizazi.
- source_word: חֻקַּת עוֹלָם
  choice: agizo la kudumu
  rationale: חֻקָּה ni agizo au kanuni iliyowekwa, na עוֹלָם hapa huonyesha uendelevu usio na kikomo kilichotajwa katika sheria ya agano.
- source_word: תְּחָגֻּהוּ
  choice: mtaiadhimisha
  rationale: Kitenzi kinachorudiwa kinasisitiza wajibu wa kuendelea kuiadhimisha; neno lilelile la Kiswahili hudumisha marudio hayo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano יהוה moja kwa moja; 'Yahweh' hulitambulisha kama jina badala ya kulibadili kuwa cheo.
- issue: Nguvu ya חֻקַּת עוֹלָם katika sheria ya agano
  choice: agizo la kudumu
  alternative: agizo la milele; amri ya daima
  rationale: '''La kudumu'' huhifadhi wazo la wajibu unaoendelea katika vizazi vya Israeli bila kulazimisha kauli ya kifalsafa kuhusu kutokuwa na mwisho kabisa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. 'Kuadhimisha' limetumiwa kwa uthabiti ili kuhifadhi marudio ya mzizi חגג, na alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
