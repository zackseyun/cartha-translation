    issue: Imperative coordination is unidiomatic
    rationale: “Chagueni na kujitwalieni” mixes a finite imperative with an infinitive-form verb. Replacing it with “Chagueni na jichukulieni” supplies two coordinated plural imperatives and retains the reflexive force of לָכֶם.
