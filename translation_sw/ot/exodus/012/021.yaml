review_pass:
  verdict: revise
  source_fidelity: Draught accurately conveys Moses' summons, the elders of Israel, the two imperatives, the family-group qualification, slaughter, and the metonymic use of 'the Passover' for its sacrificial animal. 'Chagueni' is a permissible contextual interpretation of מִשְׁכוּ, provided the more concrete 'draw/pull out' sense remains noted. The added sequential 'kisha' is not materially misleading.
  naturalness: 'The coordinated form “Chagueni na kujitwalieni” is grammatically awkward in standard modern Swahili: after the finite plural imperative “Chagueni,” the parallel imperative should be “jichukulieni” (or “jitwalieni”), not the infinitive-style form “kujitwalieni.” “Jichukulieni” is the more ordinary modern expression.'
  terminology: “Wazee wa Israeli,” “wanyama wa kundi,” “jamaa zenu,” and “mnyama wa Pasaka” are appropriate and preserve the source's breadth. “Mnyama wa Pasaka” properly avoids restricting צֹאן/הַפָּסַח to a lamb, since the immediate legal context allows either sheep or goats.
  issues:
