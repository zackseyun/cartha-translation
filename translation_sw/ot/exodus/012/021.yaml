  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/כָל זִקְנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם מִֽשְׁכ֗וּ וּ/קְח֨וּ לָ/כֶ֥ם צֹ֛אן לְ/מִשְׁפְּחֹתֵי/כֶ֖ם וְ/שַׁחֲט֥וּ הַ/פָּֽסַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/021.yaml
  text: Then Moses called for all the elders of Israel and said to them[a], “Draw out and take for yourselves sheep according to your families[c][b], and slaughter the Passover lamb.”
translation:
  language: sw
  text: Kisha Musa akawaita wazee wote wa Israeli, akawaambia, “Chagueni[a] na jichukulieni wanyama wa kundi[b] kulingana na jamaa zenu, kisha mchinjeni mnyama wa Pasaka[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Toeni kundini.” Kitenzi cha Kiebrania kina maana ya kuvuta au kutoa, na hapa huenda kinamaanisha kumtoa mnyama katika kundi.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha mifugo midogo ya kundi, yaani kondoo au mbuzi, si wana-kondoo pekee.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema kihalisi “Pasaka”; hapa maana yake ni mnyama au sadaka ya Pasaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: Katika muktadha huu, kitenzi kinaonyesha kuwa Musa aliwaita wazee waje kupokea maagizo; “akawaita” ni wazi na ya kawaida katika Kiswahili.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: wazee wote wa Israeli
  rationale: Hili ni neno la kawaida kwa viongozi au wawakilishi waliotambuliwa wa Israeli, huku כָל ikiwakilishwa na “wote.”
- source_word: מִשְׁכוּ
  choice: Chagueni
  rationale: Maana ya msingi ni kuvuta au kutoa; katika muktadha huu tendo linalokusudiwa ni kumtoa mnyama kundini. “Chagueni” ni Kiswahili cha kawaida, na maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: וּקְחוּ לָכֶם
  choice: na kujitwalieni
  rationale: Huhifadhi amri ya pili na pia nguvu ya kujirejelea ya לָכֶם, yaani kuwachukua wanyama kwa matumizi ya jamaa zao wenyewe.
- source_word: צֹאן
  choice: wanyama wa kundi
  rationale: Neno hili la Kiebrania ni pana kuliko “wana-kondoo” na linaweza kujumuisha kondoo au mbuzi; tafsiri hii haibani aina ya mnyama kinyume na Kutoka 12:5.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: kulingana na jamaa zenu
  rationale: Inaonyesha ugawaji kwa vikundi vya kifamilia au kijamaa bila kulazimisha maana nyembamba ya kaya moja.
- source_word: וְשַׁחֲטוּ
  choice: kisha mchinjeni
  rationale: “Kuchinja” ndilo neno sahihi na la kawaida kwa kumuua mnyama, hasa katika mazingira ya sadaka.
- source_word: הַפָּסַח
  choice: mnyama wa Pasaka
  rationale: Kihalisi ni “Pasaka,” lakini hapa jina hilo linamtaja mnyama wa sadaka ya Pasaka kwa njia ya metonimia. “Mnyama” huepuka kuifanya sadaka hiyo kuwa mwana-kondoo pekee.
theological_decisions:
- issue: Kinachorejelewa na הַפָּסַח
  choice: mnyama wa Pasaka
  alternative: Pasaka; sadaka ya Pasaka; mwana-kondoo wa Pasaka
  rationale: Katika amri ya kuchinja, “Pasaka” inamrejelea mnyama wa sadaka. Kutaja “mnyama” hufanya maana ieleweke kwa Kiswahili bila kuondoa uwezekano wa kondoo au mbuzi unaotajwa katika Kutoka 12:5.
- issue: Upana wa צֹאן
  choice: wanyama wa kundi
  alternative: kondoo; wana-kondoo; mifugo midogo
  rationale: צֹאן linaweza kumaanisha kondoo na mbuzi kwa ujumla. Chaguo hili linahifadhi upana huo na haliongezi sharti la kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Jamaa” limetumiwa kwa kikundi cha kifamilia, na “wanyama wa kundi” kuhifadhi upana wa neno la Kiebrania. Alama zote za tanbihi zimewekwa mara moja mahali zinapohusika.
