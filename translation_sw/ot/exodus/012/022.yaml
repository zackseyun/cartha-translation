  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֞ם אֲגֻדַּ֣ת אֵז֗וֹב וּ/טְבַלְתֶּם֮ בַּ/דָּ֣ם אֲשֶׁר בַּ/סַּף֒ וְ/הִגַּעְתֶּ֤ם אֶל הַ/מַּשְׁקוֹף֙ וְ/אֶל שְׁתֵּ֣י הַ/מְּזוּזֹ֔ת מִן הַ/דָּ֖ם אֲשֶׁ֣ר בַּ/סָּ֑ף וְ/אַתֶּ֗ם לֹ֥א תֵצְא֛וּ אִ֥ישׁ מִ/פֶּֽתַח בֵּית֖/וֹ עַד בֹּֽקֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/022.yaml
  text: And you shall take a bunch of hyssop and dip it in the blood that is in the basin[a], and touch the lintel and the two doorposts with some of the blood that is in the basin. And none of you shall go out from the entrance of his house until morning.
translation:
  language: sw
  text: Nanyi mtachukua kitita cha hisopo na kukichovya katika damu iliyo kwenye beseni[a]. Kisha mtazigusa sehemu ya juu ya mlango na miimo yake miwili kwa baadhi ya damu iliyo kwenye beseni. Wala mtu yeyote miongoni mwenu asitoke mlangoni mwa nyumba yake mpaka asubuhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kizingiti.” Neno la Kiebrania saph linaweza kuwa na maana hiyo. Hapa “beseni” limependekezwa kwa sababu damu inasemekana kuwa ndani yake na hisopo inachovywa humo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגֻדַּת אֵזוֹב
  choice: kitita cha hisopo
  rationale: “Kitita” huonyesha fungu lililokusanywa au kufungwa pamoja, huku “hisopo” ikihifadhi jina la kawaida la mmea wa ibada ingawa utambulisho wake kamili wa kibotania una mjadala.
- source_word: וּטְבַלְתֶּם בַּדָּם
  choice: kukichovya katika damu
  rationale: Kitenzi טבל kinaeleza kuingiza kitu katika kimiminika; “kukichovya katika damu” ni Kiswahili cha kawaida na kinabaki karibu na muundo wa Kiebrania.
- source_word: הַסַּף
  choice: beseni
  rationale: Katika muktadha huu damu imo ndani ya kitu hicho na hisopo inachovywa ndani yake, jambo linalounga mkono maana ya chombo. Maana mbadala ya “kizingiti” imehifadhiwa katika tanbihi.
- source_word: וְהִגַּעְתֶּם
  choice: mtazigusa
  rationale: Hifili ya נגע hapa ina maana ya kusababisha damu igusane na sehemu za mlango. “Kuzigusa” huhifadhi tendo halisi bila kuongeza wazo la kupaka au kupiga.
- source_word: הַמַּשְׁקוֹף
  choice: sehemu ya juu ya mlango
  rationale: Hii ni sehemu ya mlalo iliyo juu ya mlango. Kauli hii ni wazi kwa wasomaji wa kawaida kuliko istilahi ya kiufundi pekee.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: miimo yake miwili
  rationale: מְזוּזוֹת ni nguzo mbili zilizo wima pembeni mwa mlango; “miimo yake miwili” ni usemi sahihi na wa kawaida katika Kiswahili.
- source_word: מִן הַדָּם
  choice: kwa baadhi ya damu
  rationale: מִן hapa huonyesha kwamba kiasi cha damu kutoka kwenye beseni kinatumika kugusa sehemu za mlango.
- source_word: לֹא תֵצְאוּ אִישׁ
  choice: Mtu yeyote miongoni mwenu asitoke
  rationale: אִישׁ ina nguvu ya kugawa katazo kwa kila mtu mmoja mmoja. Kauli hii huwasilisha katazo hilo kwa Kiswahili cha kawaida.
- source_word: מִפֶּתַח בֵּיתוֹ
  choice: nje ya mlango wa nyumba yake
  rationale: פֶּתַח ni uwazi au ingilio la nyumba; “mlango wa nyumba yake” ni usemi wa kawaida, na “yake” huhifadhi umoja wa mgawanyo wa Kiebrania.
- source_word: עַד בֹּקֶר
  choice: mpaka asubuhi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mpaka wa wakati unaotajwa.
theological_decisions:
- issue: Usemi wa mgawanyo wenye umoja אִישׁ ... בֵּיתוֹ
  choice: Mtu yeyote miongoni mwenu asitoke nje ya mlango wa nyumba yake
  alternative: Mtu yeyote miongoni mwenu asitoke nje ya milango ya nyumba zenu
  rationale: Umoja wa “mtu yeyote ... nyumba yake” huhifadhi matumizi ya mgawanyo ya Kiebrania. Katika Kiswahili, “yake” halazimishi jinsia ya kiume, na amri inawahusu wote waliomo katika kundi.
- issue: Maana ya הַסַּף katika mstari huu
  choice: beseni
  alternative: kizingiti
  rationale: Sintaksia ya karibu inasema damu imo ndani ya הַסַּף na hisopo inachovywa humo, hivyo maana ya chombo ina uwezekano mkubwa zaidi. Hata hivyo, maana ya “kizingiti” ni mbadala halisi wa kileksika na imeonyeshwa katika tanbihi badala ya kuondolewa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa mara tatu ili maagizo ya mfululizo yawe wazi. “Hisopo” imehifadhiwa kama jina la kimapokeo la mmea, “miimo” kama neno la kawaida la sehemu wima za mlango, na tanbihi inalinda utata wa הַסַּף.
