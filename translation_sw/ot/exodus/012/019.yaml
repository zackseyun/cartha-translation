  text: שִׁבְעַ֣ת יָמִ֔ים שְׂאֹ֕ר לֹ֥א יִמָּצֵ֖א בְּ/בָתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל מַחְמֶ֗צֶת וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל בַּ/גֵּ֖ר וּ/בְ/אֶזְרַ֥ח הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/019.yaml
  text: For seven days no leaven is to be found in your houses[a], for whoever eats anything leavened, that person shall be cut off from the congregation of Israel[c][b], whether a sojourner or a native of the land.
translation:
  language: sw
  text: Kwa siku saba, chachu isipatikane katika nyumba zenu, kwa maana yeyote atakayekula kitu chochote kilichotiwa chachu, mtu huyo atakatiliwa mbali[a] na jumuiya[c] ya Israeli, awe mgeni anayeishi kati yenu[b] au mzawa wa nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu huyo atakatiliwa mbali.” Nahau ya Kiebrania inaweza kumaanisha kufukuzwa, kifo, au hukumu ya Mungu, kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “mgeni mkazi.” Yaani, mgeni asiye mzawa anayeishi miongoni mwa Israeli.
    reason: lexical_alternative
  - marker: c
    text: Au, “kusanyiko” au “jamii” ya Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Kwa siku saba
  rationale: Kirai hiki kinaonyesha muda; tafsiri hii ni ya kawaida na sahihi katika Kiswahili.
- source_word: שְׂאֹר
  choice: chachu
  rationale: Neno hili humaanisha kitu kinachochachusha, si vyakula vyote vilivyotiwa chachu.
- source_word: לֹא יִמָּצֵא
  choice: isionekane
  rationale: Muundo huu unaonyesha katazo la kuwepo kwa chachu nyumbani, huku ukifuata taswira ya Kiebrania ya ‘kupatikana’.
- source_word: בְּבָתֵּיכֶם
  choice: katika nyumba zenu
  rationale: Inahifadhi wingi wa ‘nyumba’ na maana ya makao ya watu wa Israeli.
- source_word: כָּל אֹכֵל
  choice: yeyote atakayekula
  rationale: Muundo wenye כָּל na kitenzi-jina una maana ya jumla inayomhusu kila mtu.
- source_word: מַחְמֶצֶת
  choice: kitu chochote kilichotiwa chachu
  rationale: Neno hili lina maana pana kuliko mkate pekee na linahusu chakula kilichochachushwa.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: mtu huyo atakatiliwa mbali
  rationale: נפש hapa ni mtu binafsi. ‘Atakatiliwa mbali’ huhifadhi nahau ya adhabu ya agano bila kuamua kama ni kufukuzwa, kuuawa, au hukumu ya Mungu.
- source_word: מֵעֲדַת יִשְׂרָאֵל
  choice: na jumuiya ya Israeli
  rationale: עֵדָה ni kusanyiko au jamii ya Israeli; ‘jumuiya’ ni ya asili na yenye maana pana katika Kiswahili cha sasa.
- source_word: בַּגֵּר
  choice: mgeni anayeishi kati yenu
  rationale: גֵּר ni mtu asiye mzawa anayekaa miongoni mwa Israeli, si msafiri wa muda mfupi.
- source_word: וּבְאֶזְרַח הָאָרֶץ
  choice: mzawa wa nchi
  rationale: Inahifadhi utofauti kati ya mgeni mkazi na mtu aliyezaliwa katika nchi bila kuingiza dhana ya kisasa ya uraia.
theological_decisions:
- issue: Maana ya adhabu ya agano inayosemwa kwa וְנִכְרְתָה
  choice: mtu huyo atakatiliwa mbali
  alternative: mtu huyo atauawa; mtu huyo ataondolewa katika jumuiya
  rationale: Nahau ya Kiebrania ina nguvu ya adhabu ya agano, lakini namna kamili ya adhabu haijaainishwa hapa. Tafsiri inahifadhi utata huo badala ya kuutatua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Chachu’ na ‘kilichotiwa chachu’ zimetofautishwa ili kuhifadhi tofauti kati ya שְׂאֹר na מַחְמֶצֶת.
