  variant: Standard East African Swahili
source:
  edition: WLC
  text: גַּם צֹאנְ/כֶ֨ם גַּם בְּקַרְ/כֶ֥ם קְח֛וּ כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם וָ/לֵ֑כוּ וּ/בֵֽרַכְתֶּ֖ם גַּם אֹתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/032.yaml
  text: Take both your flocks and your herds[a], just as you have said, and go—and bless me also.
translation:
  language: sw
  text: Chukueni makundi yenu ya kondoo na mbuzi, na makundi yenu ya ng’ombe, kama mlivyosema, ondokeni; na mnibariki pia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnibariki hata mimi.” Maneno ya Farao yanaweza kusisitiza kwamba yeye pia anaomba baraka wakati Waisraeli wanapoondoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם צֹאנְכֶם גַּם בְּקַרְכֶם
  choice: makundi yenu ya kondoo na mbuzi, na makundi yenu ya ng’ombe
  rationale: Muundo wa גַּם ... גַּם unasisitiza aina zote mbili za mifugo. צֹאן ni mifugo midogo, hasa kondoo na mbuzi, na בָּקָר ni ng’ombe au mifugo mikubwa. Kutaja wanyama kunaleta maana wazi na ya kawaida kwa Kiswahili.
- source_word: קְחוּ
  choice: Chukueni
  rationale: Ni amri ya wingi ya לקח; hapa Farao anawaagiza waende na mifugo yao.
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם
  choice: kama mlivyosema
  rationale: Inarejelea madai yao ya awali na kuhifadhi maana ya kulinganisha bila kuongeza ufafanuzi.
- source_word: וָלֵכוּ
  choice: mwondoke
  rationale: Ingawa הלך kimsingi ni ‘kwenda,’ katika muktadha huu ni amri ya kuondoka; ‘mwondoke’ ni ya asili na ya moja kwa moja.
- source_word: וּבֵרַכְתֶּם
  choice: mnibariki
  rationale: Piel ya ברך hapa ina maana ya ‘kubariki.’ Tafsiri rahisi haibainishi njia au aina ya baraka ambayo Farao aliomba.
- source_word: גַּם אֹתִי
  choice: pia ... mimi
  rationale: גַּם inaongeza Farao mwenyewe kwa wale wanaohusishwa na baraka; ‘pia’ huhifadhi maana hiyo, huku ‘mimi’ ikibeba mkazo unaowezekana.
theological_decisions:
- issue: Aina ya ombi la Farao la kubarikiwa
  choice: Kulitoa kama ombi la moja kwa moja la baraka bila kufafanua namna au chanzo chake.
  alternative: Kulieleza kuwa ombi la maombezi kwa Mungu wa Israeli, au kuwa salamu tu ya kuagana yenye heri.
  rationale: Kitenzi ברך kiko wazi, lakini mstari hauelezi ikiwa Farao anaomba fadhili za Mungu kupitia Musa na Haruni au maneno ya kawaida ya heri. Tafsiri inahifadhi mvutano huo.
- issue: Mkazo wa גַּם אֹתִי
  choice: ‘pia mnibariki mimi’
  alternative: ‘mnibariki hata mimi’
  rationale: גַּם inaweza kumaanisha nyongeza ya kawaida (‘pia’) au kusisitiza hali isiyotarajiwa (‘hata’). Maandishi makuu yanatumia ‘pia,’ na tanbihi inahifadhi uwezekano wa mkazo zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Makundi ya kondoo na mbuzi’ na ‘makundi ya ng’ombe’ yanafafanua aina mbili za mifugo kwa lugha ya sasa; sentensi fupi za amri zinahifadhi dharura ya kauli ya Farao.
