translation:
  language: sw
  text: Na itakuwa kwamba wana wenu watakapowaambia, “Ibada hii ina maana gani kwenu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Na itakuwa ... watakapowaambia
  rationale: Muundo huu wa Kiebrania huleta hali ya baadaye inayotarajiwa. Kiswahili cha sasa hutumia kwa kawaida muundo wa ‘itakuwa ... watakapo-’, huku kikihifadhi uzito wa kauli ya Kiebrania.
- source_word: יֹאמְרוּ אֲלֵיכֶם
  choice: watakapowaambia
  rationale: אמר ni ‘sema’, si kimsingi ‘uliza’. Kwa Kiswahili, ‘waambie’ ni uwasilishaji wa kawaida wa kusema jambo kwa mtu, na sentensi yenyewe inaonyesha kwamba jambo linalosemwa ni swali.
- source_word: בְּנֵיכֶם
  choice: wana wenu
  rationale: Nomino ya Kiebrania ni wingi wa kiume, ‘wana’. Chaguo hili linahifadhi umahususi huo badala ya kupanua kuwa ‘watoto’.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: ibada hii
  rationale: עֲבֹדָה inaweza kumaanisha kazi au utumishi, na hapa inaonyesha tendo la kidini lililoagizwa katika muktadha wa Pasaka. ‘Ibada’ ni ya kawaida na inafaa kimuktadha bila kuifanya kuwa ‘desturi’ tu.
- source_word: מָה ... לָכֶם
  choice: ina maana gani kwenu?
  rationale: Neno kwa neno ni ‘ni nini ... kwenu?’ Katika Kiswahili, ‘ina maana gani kwenu?’ huwasilisha kwa uwazi na kawaida swali kuhusu umuhimu wa ibada kwa jamii inayozungumziwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. ‘Wana wenu’ limetumiwa kuhifadhi wingi wa kiume wa המקור, na ‘ibada’ kueleza huduma ya kidini katika muktadha huu.
