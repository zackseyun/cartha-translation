translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Tafsiri inafuata muundo wa Kiebrania kwa karibu lakini hutumia ‘watu wa nyumba’ badala ya ‘nyumba’ ili maana ya kaya iwe wazi. Kiwakilishi ‘yeye’ kimehifadhiwa ili kutoingiza wazi cheo kama ‘mwenye nyumba,’ ambacho hakijatajwa moja kwa moja katika maandishi.
