  verdict: revise
  source_fidelity: 'Rasimu inafuata kwa uaminifu maana ya kifungu: kaya isiyotosha kwa שֶׂה inashirikiana na jirani wa karibu, kwa hesabu ya watu na ulaji wa kila mmoja. Hata hivyo, mpangilio wa mwisho, “Mtahesabu kwa ajili ya mwana-kondoo kila mtu,” hauweki wazi kwamba kila mtu ndiye anayehesabiwa/kukadiriwa kuhusiana na mwana-kondoo.'
  naturalness: Kiswahili kwa ujumla ni sanifu na cha heshima. “Watu wa nyumba” linaeleweka, lakini “watu wa nyumbani” ni la kawaida zaidi kwa kaya. Sentensi ya mwisho inahitaji mpangilio wa kawaida zaidi wa Kiswahili.
  terminology: “Mwana-kondoo” linaweza kubaki katika matini kwa muktadha wa Pasaka, mradi tanbihi ihifadhi upana wa שֶׂה (kondoo au mbuzi). Tanbihi ya sasa ina usemi usio sahihi kidogo, “mnyama mmoja wa kundi dogo”; “mnyama wa mifugo wadogo” ni sahihi na ya asili zaidi.
  issues:
