base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/004.yaml
  text: And if the household is too small for a lamb[a], then he and his nearest neighbor shall take one according to the number of persons; each man according to what he can eat[b], you shall count for the lamb.
translation:
  language: sw
  text: Na ikiwa watu wa nyumbani ni wachache mno kwa mwana-kondoo mmoja[a], yeye pamoja na jirani yake aliye karibu zaidi na nyumba yake watachukua mmoja kulingana na idadi ya watu. Kila mtu mtamhesabu kwa ajili ya mwana-kondoo, kwa kadiri ya anachoweza kula.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania שֶׂה linaweza kumaanisha mnyama wa mifugo wadogo, yaani kondoo au mbuzi; hapa limetafsiriwa “mwana-kondoo” kwa mujibu wa muktadha wa Pasaka.
    reason: lexical_alternative
  - marker: b
    text: Au, “kila mtu mtamkadiria kwa ajili ya mwana-kondoo, kwa kadiri ya anachoweza kula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְעַט הַבַּיִת מִהְיֹת מִשֶּׂה
  choice: watu wa nyumba ni wachache mno kwa mwana-kondoo mmoja
  rationale: הַבַּיִת hapa ni watu wa nyumba, si jengo. Muundo huu unadumisha wazo la kuwa wachache au kutotosha kwa mnyama mmoja bila kuongeza wazi kwamba lazima wammalize.
- source_word: שֶׂה
  choice: mwana-kondoo mmoja
  rationale: Katika muktadha wa Pasaka, ‘mwana-kondoo’ ni usemi wa kawaida na unaoeleweka mara moja; hata hivyo, neno la Kiebrania linaweza kumaanisha mnyama mmoja wa kundi dogo, awe kondoo au mbuzi, jambo linalobainishwa katika tanbihi.
- source_word: וְלָקַח הוּא וּשְׁכֵנוֹ הַקָּרֹב אֶל־בֵּיתוֹ
  choice: yeye pamoja na jirani yake aliye karibu zaidi na nyumba yake watachukua mmoja
  rationale: Tafsiri inadumisha kiwakilishi cha kiume cha umoja kilicho katika Kiebrania na uhusiano na jirani wa karibu na nyumba yake; ‘mmoja’ huweka wazi kitu kinachodokezwa na muktadha.
- source_word: בְּמִכְסַת נְפָשֹׁת
  choice: kulingana na idadi ya watu
  rationale: נְפָשֹׁת hapa humaanisha watu, na מִכְסָה huhusu hesabu au idadi iliyowekwa; hivyo tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: kila mtu kulingana na kiasi anachoweza kula
  rationale: אִישׁ limetumika kwa maana ya kugawa kwa kila mmoja, na nahau לְפִי אָכְלוֹ inahusu ulaji au kiasi cha chakula cha mtu.
- source_word: תָּכֹסּוּ עַל־הַשֶּׂה
  choice: mtahesabu kwa ajili ya mwana-kondoo
  rationale: Kitenzi kinaelekeza kuhesabu au kukadiria washiriki kuhusiana na mnyama huyo. ‘Mtahesabu kwa ajili ya’ hudumisha wazo la hesabu bila kulifafanua kupita maandishi.
