  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Nao watachukua’ huhifadhi mtiririko wa maagizo; ‘miimo’ na ‘kizingiti cha juu’ hutoa maelezo sahihi ya sehemu za mlango bila lugha ya kitaalamu kupita kiasi.
