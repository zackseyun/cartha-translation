  text: And they shall take some of the blood and put it on the two doorposts and on the lintel of the houses in which they eat it[a].
translation:
  language: sw
  text: Nao watachukua baadhi ya damu na kuitia juu ya miimo miwili ya milango na juu ya kizingiti cha juu cha nyumba ambamo wataila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambamo wanaila.” Kitenzi cha Kiebrania kinaweza kueleweka kwa maana ya sasa katika maagizo haya, au kwa mwelekeo wa wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Nao watachukua
  rationale: Katika mfuatano huu wa maagizo, umbo hili lina nguvu ya maelekezo yenye mwelekeo wa wakati ujao; wakati ujao wa Kiswahili unasikika kwa kawaida na kudumisha sauti ya agizo.
- source_word: מִן הַדָּם
  choice: sehemu ya damu
  rationale: Kihusishi מִן kimetumiwa kwa maana ya sehemu ya kitu, hivyo si damu yote inayochukuliwa.
- source_word: וְנָתְנוּ
  choice: na kuipaka
  rationale: Ingawa נתן kwa msingi ni ‘kuweka/kutoa,’ katika muktadha wa damu kuwekwa juu ya sehemu za mlango, ‘kuipaka’ ni Kiswahili cha kawaida na thabiti bila kubainisha chombo au mbinu.
- source_word: עַל שְׁתֵּי הַמְּזוּזֹת
  choice: kwenye miimo miwili ya mlango
  rationale: מְזוּזוֹת ni nguzo mbili zilizosimama wima pembeni mwa uwazi wa mlango; ‘miimo ya mlango’ ni istilahi sahihi na inayoeleweka.
- source_word: וְעַל הַמַּשְׁקוֹף
  choice: na kwenye kizingiti cha juu
  rationale: מַשְׁקוֹף ni sehemu ya juu ya mlango iliyo mlalo. ‘Kizingiti cha juu’ huepuka kuchanganya na kizingiti cha chini na ni wazi kwa msomaji wa kawaida.
- source_word: עַל הַבָּתִּים
  choice: cha nyumba
  rationale: Kirai hiki kinazitambulisha nyumba ambazo sehemu zake za milango zitapakwa damu; uhusiano wa Kiswahili unaelezwa kiasili kwa ‘cha nyumba’ badala ya kurudia ‘juu ya nyumba.’
- source_word: אֲשֶׁר יֹאכְלוּ אֹתוֹ בָהֶם
  choice: watakamoila
  rationale: Kiwakilishi husishi kinaonyesha nyumba kuwa mahali pa kuila, na umbo la wakati ujao linafaa katika muktadha huu wa maagizo.
theological_decisions: []
