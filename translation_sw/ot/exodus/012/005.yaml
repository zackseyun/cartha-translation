    text: Kiebrania שֶׂה linaweza kumaanisha kwa upana mnyama mdogo wa kundi, likijumuisha mwana-kondoo au mwana-mbuzi; sehemu inayofuata inaeleza wazi kwamba anaweza kuchukuliwa miongoni mwa kondoo au mbuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה
  choice: mnyama wa kundi
  rationale: Neno hili linaweza kumaanisha mwana-kondoo au mwana-mbuzi. Tafsiri pana inaepuka kumfanya kuwa kondoo pekee, kwa kuwa kishazi kinachofuata kinaruhusu achukuliwe kutoka kwa kondoo au mbuzi.
- source_word: תָמִים
  choice: asiye na dosari
  rationale: Katika muktadha wa dhabihu, neno hili humaanisha mnyama asiye na kasoro ya kimwili; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: זָכָר
  choice: dume
  rationale: Hili ndilo neno sahihi na la kawaida la kutaja jinsia ya mnyama.
- source_word: בֶּן שָׁנָה
  choice: wa mwaka mmoja
  rationale: Huwakilisha kwa kawaida nahau ya Kiebrania inayotaja umri wa mnyama.
- source_word: יִהְיֶה לָכֶם
  choice: atakuwa
  rationale: Hueleza sifa inayotakiwa ya mnyama bila kulazimisha kiwakilishi cha manufaa לָכֶם katika Kiswahili.
- source_word: מִן הַכְּבָשִׂים וּמִן הָעִזִּים
  choice: kutoka kwa kondoo au kwa mbuzi
  rationale: Makundi mawili ya mifugo ndiyo vyanzo vinavyoruhusiwa; “au” huonyesha kwamba mnyama anaweza kutoka katika mojawapo ya makundi hayo.
- source_word: תִּקָּחוּ
  choice: mtamchukua
  rationale: Muundo wa nafsi ya pili wingi una nguvu ya maagizo katika muktadha. Kiambishi cha yambwa -m- hurejelea mnyama mmoja aliyetajwa.
