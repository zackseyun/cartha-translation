  text: כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יַעֲשׂ֥וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/047.yaml
  text: All the congregation of Israel shall do it[a].
translation:
  language: sw
  text: Kusanyiko lote la Israeli litafanya hivyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jumuiya yote ya Israeli itaadhimisha jambo hilo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: lote
  rationale: Kivumishi hiki pamoja na nomino ya umoja ya kijumla kinaonyesha kusanyiko zima bila kumtenga mtu mmoja mmoja kuwa mhusika mkuu.
- source_word: עֲדַת
  choice: Kusanyiko
  rationale: Neno עֵדָה humaanisha jumuiya iliyokusanyika; “kusanyiko” ni Kiswahili cha kawaida na chenye hadhi kinachofaa muktadha wa Pasaka.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa limetolewa kwa umbo la kawaida katika Kiswahili.
- source_word: יַעֲשׂוּ
  choice: litafanya
  rationale: Kitenzi עשה kina maana pana ya kufanya au kutekeleza. “Litafanya” kinadumisha maana hiyo ya msingi bila kufafanua zaidi rejeleo lake.
- source_word: אֹתוֹ
  choice: hivyo
  rationale: Kiwakilishi hiki kinarejelea jambo lililotajwa katika muktadha. “Hivyo” ni cha asili zaidi katika Kiswahili kuliko “litafanya hilo,” huku kikiepuka kulibainisha kuwa ibada au mwana-kondoo pekee.
theological_decisions:
- issue: Mhusika wa kijumla katika amri ya Pasaka
  choice: “Kusanyiko lote la Israeli” linawaelekeza watu wa agano kwa pamoja.
  alternative: Kila Mwisraeli mmoja mmoja lazima afanye hivyo.
  rationale: Nomino ya kijumla pamoja na jina la taifa inaonyesha jumuiya nzima kama mwili mmoja; haikulazimishi tafsiri inayosisitiza kila mtu binafsi kuliko Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imedumisha usemi wa kijumla na kutobainishwa kikamilifu kwa rejeleo la אֹתוֹ; tanbihi inaonyesha uwezekano wa maana ya kuadhimisha Pasaka.
