base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/018.yaml
  text: In the first month[a], on the fourteenth day of the month at evening, you shall eat unleavened bread, until the twenty-first day of the month at evening.
translation:
  language: sw
  text: Katika mwezi wa kwanza, siku ya kumi na nne ya mwezi huo, jioni[a], mtakula mikate isiyotiwa chachu mpaka siku ya ishirini na moja ya mwezi huo, jioni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa jioni.” Ndivyo ilivyo katika sehemu zote mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרִאשֹׁן
  choice: Katika mwezi wa kwanza
  rationale: Kiebrania kinasema kihalisi ‘katika wa kwanza,’ lakini muktadha wa tarehe na neno חֹדֶשׁ linalofuata unaonyesha kwamba mwezi ndio unaokusudiwa. Kiswahili kinahitaji kutaja ‘mwezi’ ili maana iwe wazi na ya kawaida.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: siku ya kumi na nne
  rationale: Huu ni mtindo wa Kiebrania wa kutaja tarehe kwa namba; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: לַחֹדֶשׁ
  choice: ya mwezi huo
  rationale: Katika fomula ya tarehe, חֹדֶשׁ humaanisha ‘mwezi,’ si hasa ‘mwandamo.’ ‘Huo’ huonyesha kwa kawaida kwamba ni mwezi uliotajwa tayari.
- source_word: בָּעֶרֶב / בָּעָרֶב
  choice: jioni
  rationale: Neno hili linaweka mpaka wa wakati mwanzoni na mwishoni mwa kipindi. ‘Jioni’ ni tafsiri fupi na ya kawaida, bila kulibana neno hilo kuwa dakika maalumu ya machweo.
- source_word: תֹּאכְלוּ
  choice: mtakula
  rationale: Kauli ya wakati ujao katika Kiswahili inaweza kubeba nguvu ya agizo katika muktadha huu wa sheria, huku ikiakisi umbo la Kiebrania bila kuongeza kitenzi kama ‘lazima.’
- source_word: מַצֹּת
  choice: mikate isiyotiwa chachu
  rationale: Wingi ‘mikate’ unaakisi umbo la wingi la Kiebrania, na ‘isiyotiwa chachu’ ni maelezo ya kawaida yanayoeleweka kuliko kunukuu neno la kigeni.
- source_word: עַד
  choice: mpaka
  rationale: Neno hili linaonyesha mpaka wa mwisho wa kipindi kilichoamriwa.
- source_word: יוֹם הָאֶחָד וְעֶשְׂרִים
  choice: siku ya ishirini na moja
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kutaja tarehe ya ishirini na moja na inawasilisha sawasawa usemi wa Kiebrania.
