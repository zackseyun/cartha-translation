  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: שִׁבְעַ֤ת יָמִים֙ מַצּ֣וֹת תֹּאכֵ֔לוּ אַ֚ךְ בַּ/יּ֣וֹם הָ/רִאשׁ֔וֹן תַּשְׁבִּ֥יתוּ שְּׂאֹ֖ר מִ/בָּתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל חָמֵ֗ץ וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מִ/יִּשְׂרָאֵ֔ל מִ/יּ֥וֹם הָ/רִאשֹׁ֖ן עַד י֥וֹם הַ/שְּׁבִעִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
translation:
  language: sw
  text: Kwa siku saba mtakula mikate isiyotiwa chachu. Lakini siku ya kwanza mtaondoa chachu katika nyumba zenu[a], kwa maana yeyote anayekula kitu chochote kilichotiwa chachu, mtu huyo atakatiliwa mbali na Israeli[b], tangu siku ya kwanza hadi siku ya saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtaifanya chachu ikome kuwapo katika nyumba zenu.” Kiebrania kihalisi ni “mtasababisha chachu ikome.”
    reason: lexical_alternative
  - marker: b
    text: “Atakatiliwa mbali” ni msemo wa kisheria wa Kiebrania. Huenda ukamaanisha kufukuzwa katika jumuiya, kifo, au hukumu ya Mungu; mstari huu hautaji namna hasa.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: Nomino hii inamaanisha mikate iliyotengenezwa bila chachu. Tafsiri hii ni ya kawaida katika Kiswahili na inaeleweka wazi katika muktadha wa Pasaka.
- source_word: אַךְ
  choice: Lakini
  rationale: Hapa neno hili linaonyesha mpito wenye mkazo kutoka amri ya jumla ya siku saba kwenda sharti maalumu la siku ya kwanza.
- source_word: תַּשְׁבִּיתוּ
  choice: mtaondoa
  rationale: Hifili ya שׁבת humaanisha kusababisha chachu ikome kuwapo katika nyumba. ‘Mtaondoa’ linaeleza kwa kawaida hatua inayotakiwa bila kuamua kwamba lazima iharibiwe.
- source_word: שְּׂאֹר
  choice: chachu
  rationale: Neno hili linataja kitu kinachosababisha unga kuchacha. ‘Chachu’ ni neno la kawaida na linalofaa katika lugha ya ibada ya kibiblia.
- source_word: חָמֵץ
  choice: kitu chochote kilichotiwa chachu
  rationale: Neno hili linaweza kumaanisha kwa upana kitu kilichochachushwa, si mkate pekee; tafsiri hii inalinda upana huo.
- source_word: וְנִכְרְתָה
  choice: atakatiliwa mbali
  rationale: Huu ni msemo wa kisheria na wa agano. Tafsiri ya kimfumo inalinda uzito wake bila kuamua kama adhabu ni kufukuzwa, kifo, au hukumu ya Mungu.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: mtu huyo
  rationale: Katika kauli za kisheria נֶפֶשׁ humaanisha mtu binafsi. ‘Mtu huyo’ ni Kiswahili cha kawaida bila kuingiza maana finyu ya ‘roho.’
- source_word: מִיִּשְׂרָאֵל
  choice: na Israeli
  rationale: Katika msemo ‘atakatiliwa mbali na Israeli,’ ‘Israeli’ linamaanisha jamii ya agano; muundo huu ni mfupi na unaeleweka.
- source_word: מִיּוֹם הָרִאשֹׁן עַד יוֹם הַשְּׁבִעִי
  choice: tangu siku ya kwanza hadi siku ya saba
  rationale: Tafsiri hii inafuata mpangilio wa Kiebrania na kueleza kipindi ambacho kula kilichotiwa chachu kunahusishwa na adhabu hiyo.
theological_decisions:
- issue: Maana ya adhabu וְנִכְרְתָה (‘atakatiliwa mbali’)
  choice: Kudumisha msemo wa kisheria ‘atakatiliwa mbali’ bila kutaja namna mahususi ya adhabu.
  alternative: ‘ataondolewa katika jumuiya,’ ‘atauawa,’ au ‘ataondolewa kwa hukumu ya Mungu’
  rationale: Kiebrania kina uzito wa kiagano na kimahakama, lakini mstari huu hautaji kama kutengwa huko ni kufukuzwa, kifo, au hukumu ya moja kwa moja ya Mungu. Tafsiri inalinda mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ni rahisi kwa wasomaji wa kawaida huku ikihifadhi istilahi ya kibiblia ‘chachu’ na msemo wenye uzito wa kisheria ‘atakatiliwa mbali.’ Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusu kuondoa chachu, ambacho ndicho tanbihi hiyo inachofafanua.
