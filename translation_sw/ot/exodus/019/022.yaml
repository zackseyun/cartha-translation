base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/022.yaml
  text: And even the priests who come near to Yahweh must consecrate themselves[b][a], lest Yahweh break out against them.
translation:
  language: sw
  text: Hata makuhani wanaomkaribia Yahweh[a] lazima wajitakase, la sivyo Yahweh atawashambulia kwa ghafula.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanaomwendea Yahweh” au “wanaosogea karibu na Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Au “Yahweh atatokea dhidi yao kwa nguvu.” Kiebrania kinaonyesha kutokea kwa ghafla kwa hukumu ya Yahweh dhidi yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Hata
  rationale: 'Inaonyesha msisitizo wa nyongeza: makuhani pia wanahusika katika onyo hili.'
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wahudumu wa kikuhani katika muktadha wa ibada.
- source_word: הַנִּגָּשִׁים אֶל יְהוָה
  choice: wanaomkaribia Yahweh
  rationale: Linahifadhi maana ya kumkaribia Mungu kwa huduma au kuingia mbele zake bila kufafanua kupita kiasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linahifadhi jina la agano lililoandikwa wazi katika maandishi ya Kiebrania.
- source_word: יִתְקַדָּשׁוּ
  choice: lazima wajitakase
  rationale: Muundo wa Kiebrania una maana ya kujitenga au kujiandaa kuwa watakatifu; 'wajitakase' ni wa asili na unaeleweka katika Kiswahili cha sasa.
- source_word: פֶּן
  choice: la sivyo
  rationale: Linaonyesha onyo na tokeo hasi kwa Kiswahili cha kawaida na wazi.
- source_word: יִפְרֹץ בָּהֶם
  choice: atawashambulia kwa ghafula
  rationale: Kitenzi פרץ kinaonyesha mlipuko wa ghafla wa hukumu dhidi yao; tafsiri hii inawasilisha nguvu na uhasama wa kitendo kwa lugha ya asili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano; 'Yahweh' hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Asili ya onyo katika יִפְרֹץ בָּהֶם יְהוָה
  choice: Yahweh atawashambulia kwa ghafula
  alternative: Yahweh atawajia kwa nguvu
  rationale: Muktadha wa mipaka ya Sinai unaonyesha hukumu hatari dhidi yao. Tafsiri haiongezi namna mahususi ya adhabu ambayo haikutajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa wa asili bila kupoteza msisitizo, maana ya kikuhani, au picha ya hukumu ya ghafla.
