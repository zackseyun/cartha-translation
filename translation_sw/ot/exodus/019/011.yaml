base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/011.yaml
  text: and let them be ready for the third day[a], because on the third day Yahweh will come down in the sight of all the people on Mount Sinai.
translation:
  language: sw
  text: Nao wawe tayari kwa siku ya tatu, kwa sababu siku ya tatu Yahweh atashuka juu ya Mlima Sinai mbele ya macho ya watu wote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “machoni pa watu wote.”'
    reason: Njia mbadala ya kutafsiri לְעֵינֵי kwa Kiswahili cha kiidioma zaidi.
lexical_decisions:
- source_word: וְהָיוּ
  choice: Nao wawe
  rationale: Katika muktadha wa maagizo, umbo hili lina nguvu ya agizo; “wawe” ni la kawaida na lenye heshima katika Kiswahili.
- source_word: נְכֹנִים
  choice: tayari
  rationale: Neno hili linaonyesha kuwa wamejiandaa kwa tukio linalokuja; “tayari” ni wazi na la asili.
- source_word: לַיּוֹם הַשְּׁלִישִׁי
  choice: kwa ajili ya siku ya tatu
  rationale: Herufi ל inaelekeza maandalizi kwenye siku iliyowekwa; tafsiri hii huhifadhi wazo la kuwa tayari kwa tukio la siku hiyo bila kulifanya tu kuwa tarehe ya mwisho.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa neno hili linatoa sababu ya agizo lililotangulia.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: siku ya tatu
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kutaja wakati; kihusishi “katika” hakihitajiki.
- source_word: יֵרֵד
  choice: atashuka
  rationale: Huhifadhi taswira ya Yahweh kushuka kuelekea mlimani na kwa watu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: לְעֵינֵי
  choice: mbele ya macho ya
  rationale: Huhifadhi taswira halisi ya Kiebrania ya jambo kutokea mbele ya macho, huku likieleweka kwa wasomaji wa Kiswahili.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: Huwakilisha kusanyiko lote kwa Kiswahili cha kawaida.
- source_word: עַל הַר סִינָי
  choice: juu ya Mlima Sinai
  rationale: Kwa kuandamana na kitenzi “atashuka,” עַל huonyesha mlima kuwa mahali ambapo Yahweh atashukia.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Namna watu watakavyoshuhudia kushuka kwa Yahweh
  choice: mbele ya macho ya watu wote
  alternative: watu wote wakiona
  rationale: Kauli kuu huhifadhi taswira halisi ya לְעֵינֵי bila kufafanua zaidi namna ya udhihirisho; tanbihi hutoa usemi wa Kiswahili ulio wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umehifadhi urudiaji wa “siku ya tatu” na taswira ya Yahweh kushuka juu ya Mlima Sinai.
