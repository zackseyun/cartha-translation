base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/021.yaml
  text: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
translation:
  language: sw
  text: Yahweh akamwambia Musa, “Shuka, uwaonye watu, wasije wakapenya kuelekea kwa Yahweh ili kumtazama[a], na wengi wao wakaanguka[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumwona.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuona” au “kutazama”; hapa kinahusu kujaribu kutazama kuelekea kwa Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “na wengi kutoka miongoni mwao wakaanguka.” Katika muktadha huu, “kuanguka” huenda kukamaanisha kufa, lakini Kiebrania hakisemi hivyo wazi zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limehifadhiwa kama jina binafsi, badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: רֵד
  choice: Shuka
  rationale: Amri ya kitenzi ירד inaeleza mwendo wa kutoka juu kwenda chini; ‘Shuka’ ni fupi na ya kawaida katika Kiswahili.
- source_word: הָעֵד
  choice: uwaonye
  rationale: Hifili ya עוד hapa ina maana ya kutoa onyo zito. Umbo hili linaonyesha kwamba Musa awaonye watu wote.
- source_word: בָּעָם
  choice: watu
  rationale: עם hapa inarejelea jumuiya ya Israeli kwa pamoja; ‘watu’ ni tafsiri ya kawaida na ya asili.
- source_word: פֶּן
  choice: wasije
  rationale: פֶּן huanzisha onyo kuhusu jambo linalopaswa kuzuiwa. ‘Wasije’ huwasilisha kusudi au tokeo hasi kwa Kiswahili cha kawaida.
- source_word: יֶהֶרְסוּ
  choice: wakapenya
  rationale: Katika muktadha wa mpaka uliowekwa kuzunguka mlima, kitenzi hiki kinaonyesha kuvunja au kuvuka kizuizi kwa nguvu. ‘Kupenya’ linaeleza kuvuka mpaka uliokatazwa bila kuongeza maelezo yasiyotajwa.
- source_word: אֶל יְהוָה
  choice: kumwelekea Yahweh
  rationale: Kihusishi אֶל kinaonyesha mwendo kuelekea uwepo wa Yahweh; ‘kumwelekea’ huhifadhi mwelekeo huo.
- source_word: לִרְאוֹת
  choice: ili wamwone
  rationale: Kitenzi ראה kinaweza kumaanisha kuona au kutazama. ‘Ili wamwone’ huhifadhi maana yake ya msingi na kusudi la jaribio lao, huku tanbihi ikitaja uwezekano wa ‘kumtazama.’
- source_word: וְנָפַל
  choice: wakaanguka
  rationale: נפל maana yake ya moja kwa moja ni ‘kuanguka.’ Katika muktadha huu huenda ikaashiria kufa kwa hukumu, lakini tafsiri haifanyi jambo hilo kuwa wazi kuliko Kiebrania.
- source_word: מִמֶּנּוּ רָב
  choice: wengi wao
  rationale: Kirai hiki kinaonyesha idadi kubwa kutoka miongoni mwa kundi; ‘wengi wao’ ni cha asili na wazi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa kimadhehebu.
- issue: Maana ya ‘wakaanguka’ katika onyo la hukumu
  choice: Kuhifadhi ‘wakaanguka’ bila kusema wazi ‘wakafa’
  alternative: wengi wao wakafa
  rationale: Muktadha unaweza kuashiria kifo, lakini kitenzi cha Kiebrania נפל kinasema ‘kuanguka.’ Tafsiri inahifadhi mvutano huo badala ya kuufafanua kupita chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa onyo ‘wasije … wakaanguka’ ni wa kawaida, na alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
