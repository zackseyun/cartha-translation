base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/024.yaml
  text: And Yahweh said to him[a], “Go down, and come up—you and Aaron with you. But the priests and the people must not break through to come up to Yahweh, lest he break out against them.”
translation:
  language: sw
  text: Yahwe akamwambia, “Nenda ukashuke, kisha panda, wewe pamoja na Aroni. Lakini makuhani na watu wasipenye kwa nguvu ili wapande kumkaribia Yahwe, asije akawavamia.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasijilazimishe kupenya ... asije akawazukia.” Kiebrania kinatumia taswira zinazohusiana za kupenya kwa nguvu kwa watu na Yahwe kuzuka dhidi yao katika hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo la Kiswahili linalotambulika, badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: לֶךְ רֵד
  choice: Nenda chini
  rationale: Jozi ya amri ina maana ya kuondoka na kushuka; ‘Nenda chini’ ni ya asili katika Kiswahili na inaendeleza mwelekeo wa mwendo.
- source_word: וְעָלִיתָ
  choice: kisha panda tena
  rationale: Katika mfululizo huu wa maagizo, kitenzi kina nguvu ya amri kuhusu kurudi mlimani; ‘tena’ huweka wazi mwendo unaofuata bila kuubadili.
- source_word: אַתָּה וְאַהֲרֹן עִמָּךְ
  choice: wewe pamoja na Aroni
  rationale: Huhifadhi msisitizo wa kiwakilishi ‘wewe’ na wazo la Aroni kuandamana naye.
- source_word: הַכֹּהֲנִים וְהָעָם
  choice: makuhani na watu
  rationale: Maneno ya kawaida na ya moja kwa moja kwa makundi haya mawili.
- source_word: אַל יֶהֶרְסוּ לַעֲלֹת אֶל יְהוָה
  choice: wasivunje mpaka ili kupanda kumkaribia Yahwe
  rationale: ‘Wasivunje mpaka’ huonyesha kuvuka kwa nguvu mpaka uliowekwa, huku ‘kumkaribia’ ikieleza maana ya kupanda kuelekea uwepo wa Yahwe.
- source_word: פֶּן יִפְרָץ בָּם
  choice: asije akawashambulia kwa nguvu
  rationale: Hutoa picha ya ghafla ya hukumu ya Mungu, huku tanbihi ikihifadhi sitiari na mwangwi wa kuvunja/kufurumuka uliomo katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Huhifadhi jina binafsi katika matini badala ya kulibadilisha kuwa cheo, bila kudai uhakika kamili kuhusu matamshi yake ya kale.
- issue: Mhusika wa kitenzi יִפְרָץ
  choice: Yahwe ndiye anayewashambulia kwa nguvu
  alternative: hukumu isiyotajwa moja kwa moja ndiyo inayowapata
  rationale: Muktadha na kitenzi cha umoja vinaelekeza kwa Yahwe aliyetajwa kabla, lakini tafsiri haiongezi maelezo kuhusu namna ya hukumu hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa moja kwa moja, huku taswira ya kupanda mlima, kuvunja mpaka, na hukumu ya ghafla ikihifadhiwa katika matini na tanbihi.
