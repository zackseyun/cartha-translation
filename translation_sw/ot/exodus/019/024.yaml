    issue: Neno “tena” limeongezwa katika “panda tena.”
    rationale: וְעָלִיתָ inaagiza kupanda, lakini haisemi wazi “tena”; muktadha unaweza kudokeza kurudi, lakini tafsiri ya usawa-bora isiongeze dokezo hilo katika matini.
  - severity: medium
    issue: “Mpaka” katika “wasivunje mpaka” haipo wazi katika Kiebrania.
    rationale: הרס inaeleza kuvunja/kupenya kwa nguvu ili kupanda; mpaka unaweza kudhaniwa kutokana na muktadha, lakini ni salama kuacha kitu hicho bila kutajwa.
  - severity: medium
    issue: “Kuwashambulia kwa nguvu” ni tafsiri finyu na ya kijeshi kwa יִפְרָץ בָּם.
    rationale: Kitenzi kina taswira ya Yahwe kuzuka au kuwavamia kwa ghafla katika hukumu, na kinaitikia kisemantiki jaribio lao la kupenya. “Kuwavamia” huhifadhi ghafla hiyo bila kuongeza “kwa nguvu.”
