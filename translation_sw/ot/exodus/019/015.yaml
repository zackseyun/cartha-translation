  text: And he said to the people[a], “Be ready for three days; do not go near a woman.”
translation:
  language: sw
  text: Akawaambia watu, “Jiandaeni kwa siku tatu; msimkaribie mwanamke.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “msimkaribie mwanamke”; katika muktadha huu ni usemi wa staha unaomaanisha kujiepusha na mahusiano ya kingono wakati wa maandalizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־הָעָם
  choice: Akawaambia watu
  rationale: Kauli hii inaendeleza simulizi na kutambulisha maneno ya Musa kwa watu; ‘akawaambia’ ni Kiswahili cha kawaida na cha asili kwa kusema kwa kundi.
- source_word: הֱיוּ נְכֹנִים
  choice: Jiandaeni
  rationale: Muundo huu unawahimiza watu wawe tayari au wamejiandaa; ‘jiandaeni’ linaonyesha kwa kawaida maandalizi yanayotakiwa katika muktadha huu.
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: kwa siku tatu
  rationale: Kirai hiki kwa kawaida kinaonyesha kipindi cha siku tatu cha maandalizi, bila kukibadili kiwe ‘kwa ajili ya siku ya tatu.’
- source_word: אַל־תִּגְּשׁוּ
  choice: msimkaribie
  rationale: Kitenzi נגשׁ humaanisha kukaribia au kwenda karibu; hapa amri hasi imetafsiriwa kwa namna ya moja kwa moja na ya kawaida.
- source_word: אֶל־אִשָּׁה
  choice: mwanamke
  rationale: Kiebrania kinasema kihalisi ‘mwanamke.’ Tafsiri kuu inadumisha sitiari ya staha ya chanzo badala ya kueleza wazi tendo linalokusudiwa.
theological_decisions:
- issue: Iwapo marufuku ya mahusiano ya kingono wakati wa kujitayarisha ielezwe wazi
  choice: 'Kudumisha usemi wa staha wa Kiebrania katika maandishi makuu: ‘msimkaribie mwanamke’'
  alternative: msifanye ngono na mwanamke; msiwaendee wake zenu
  rationale: Chanzo kinatumia usemi wa staha badala ya kitenzi cha wazi cha ngono. Kuuhifadhi kunadumisha namna ya usemi na mvutano wa maandishi, huku tanbihi ikifafanua maana yake katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akawaambia’ hufanya simulizi lisomeke kwa kawaida, na ‘jiandaeni’ ni wazi kwa wasomaji wa kawaida. Usemi wa staha wa chanzo umehifadhiwa na kufafanuliwa katika tanbihi.
