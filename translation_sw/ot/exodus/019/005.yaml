  text: וְ/עַתָּ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמְעוּ֙ בְּ/קֹלִ֔/י וּ/שְׁמַרְתֶּ֖ם אֶת בְּרִיתִ֑/י וִ/הְיִ֨יתֶם לִ֤/י סְגֻלָּה֙ מִ/כָּל הָ֣/עַמִּ֔ים כִּי לִ֖/י כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/005.yaml
  text: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
translation:
  language: sw
  text: Na sasa, ikiwa kweli mtaisikiliza sauti yangu[a] na kulishika agano langu, mtakuwa mali yangu ya thamani miongoni mwa mataifa yote[b], kwa maana dunia yote ni yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa mtasikiliza sauti yangu kwa utii.” Usemi wa Kiebrania unasema kihalisi, “ikiwa kusikiliza mtasikiliza,” yaani, kusikiliza kwa makini na kwa utii.
    reason: lexical_alternative
  - marker: b
    text: Au, “milki yangu maalumu.” Yaani, miongoni mwa mataifa yote; kishazi kinachofuata kinafafanua kwamba dunia yote bado ni mali ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi וְ pamoja na kielezi cha wakati עַתָּה, na kuonyesha mwendelezo kutoka muktadha uliotangulia.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ בְּקֹלִי
  choice: ikiwa kweli mtaisikiliza sauti yangu
  rationale: Muundo wa kitenzi-jina kamili pamoja na kitenzi kisichokamilika unasisitiza tendo. ‘Kweli’ huonyesha msisitizo huo, huku ‘mtaisikiliza sauti yangu’ ikihifadhi taswira halisi ya Kiebrania na maana yake ya kusikia kwa utii.
- source_word: וּשְׁמַרְתֶּם אֶת־בְּרִיתִי
  choice: na kulishika agano langu
  rationale: ‘Kulishika’ ni usemi wa kawaida na wenye hadhi kwa kutunza au kuzingatia agano kwa uaminifu.
- source_word: וִהְיִיתֶם לִי סְגֻלָּה
  choice: mtakuwa hazina yangu ya pekee
  rationale: סְגֻלָּה humaanisha mali yenye thamani iliyo milki maalumu ya mwenyewe; ‘hazina yangu ya pekee’ huwasilisha thamani na umiliki bila kudokeza kuwa mataifa mengine si mali ya Mungu.
- source_word: מִכָּל הָעַמִּים
  choice: kati ya mataifa yote
  rationale: Katika muktadha huu מִן inaonyesha uteuzi kutoka miongoni mwa makundi yote. ‘Kati ya’ ni Kiswahili cha kawaida kinachoepuka maana ya ubora wa daraja (‘juu ya’).
- source_word: כִּי לִי כָּל־הָאָרֶץ
  choice: kwa maana dunia yote ni yangu
  rationale: כִּי inatoa msingi wa kauli iliyotangulia. הָאָרֶץ hapa ina upeo wa ulimwengu mzima kwa sababu inahusishwa na mataifa yote.
theological_decisions:
- issue: Iwapo שמע itafsiriwe ‘sikiliza’ au ‘tii’ katika muktadha wa agano
  choice: mtaisikiliza sauti yangu
  alternative: mtaitii sauti yangu; mtanitii
  rationale: Usemi wa Kiebrania unajumuisha kusikia kunakoleta utii, lakini unatanguliza taswira ya kusikiliza. Tafsiri hii huihifadhi, huku ‘kulishika agano langu’ ikieleza wazi upande wa utii.
- issue: Jinsi ya kueleza hadhi ya Israeli kama סְגֻלָּה bila kuzidisha upekee wake
  choice: hazina yangu ya pekee kati ya mataifa yote
  alternative: mali yangu ya pekee kuliko mataifa yote; milki yangu maalumu miongoni mwa mataifa yote
  rationale: Kauli inathibitisha nafasi ya pekee ya Israeli katika agano, na kishazi kinachofuata kinathibitisha kuwa dunia yote ni ya Mungu. ‘Kati ya’ huhifadhi mvutano huo bila kuingiza mfumo wa kiteolojia wa baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Agano,’ ‘hazina,’ na ‘mataifa’ ni maneno yanayoeleweka kwa wasomaji wa kawaida huku yakihifadhi uzito wa lugha ya agano. Alama zote za tanbihi zimewekwa katika matini kuu.
