base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/007.yaml
  text: So Moses came and called for the elders of the people[b][a], and set before them all these words that Yahweh had commanded him.
translation:
  language: sw
  text: Basi Musa akaja, akawaita wazee wa watu[a], akayaweka mbele yao maneno haya yote[b] ambayo Yahwe alikuwa amemwamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawaita wazee wa watu waje.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mambo haya yote.” Neno la Kiebrania linaweza kumaanisha maneno au mambo; hapa “maneno” yametumiwa kwa sababu Musa anawasilisha ujumbe wa Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Kitenzi בוא kinaweza kumaanisha kuja au kwenda kulingana na mtazamo; hapa Musa anarudi kutoka kwa Yahwe kwenda kwa watu, na “akaja” linafuata mtazamo wa simulizi.
- source_word: וַיִּקְרָא לְזִקְנֵי הָעָם
  choice: akawaita wazee wa watu
  rationale: קרא pamoja na ל inaweza kumaanisha kuwaita au kuwaita waje. “Akawaita” ni Kiswahili cha kawaida na hakiongezi ukali unaoweza kudokezwa na “akawaamuru wakusanyike.”
- source_word: זִקְנֵי הָעָם
  choice: wazee wa watu
  rationale: זִקְנֵי humaanisha wazee waliotambuliwa kuwa wawakilishi wa jumuiya; “wazee” huhifadhi maana hiyo ya kijamii na kiuongozi bila kuibadili kuwa “viongozi” kwa ujumla.
- source_word: וַיָּשֶׂם לִפְנֵיהֶם
  choice: na kuweka mbele yao
  rationale: Nahau ya Kiebrania ina maana halisi ya kuweka mbele yao. Kiswahili hiki kinahifadhi picha ya kuwasilisha ujumbe kwao, huku muundo wa “akaja, akawaita ... na kuweka” ukitumia mfululizo wa vitenzi kwa namna ya kawaida.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya yote
  rationale: דְּבָרִים inaweza kumaanisha maneno, mambo, au vitu. Muktadha ni Musa kuwasilisha ujumbe wa Mungu, hivyo “maneno” linafaa zaidi huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: אֲשֶׁר צִוָּהוּ יְהוָה
  choice: ambayo Yahwe alikuwa amemwamuru
  rationale: “Alikuwa amemwamuru” huonyesha kwamba agizo la Yahwe lilitangulia hatua ya Musa kulifikisha kwa wazee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limeandikwa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Aya inatumia Tetragramatoni yenyewe. “Yahwe” huhifadhi jina la agano bila kulibadilisha kuwa cheo, huku “Yehova” likiwa umbo la kimapokeo lililotokana na uchanganyaji wa konsonanti na irabu za usomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wa sasa na wenye heshima. Muundo wa Kiebrania “kuweka mbele yao” umehifadhiwa kwa kuwa unaeleweka katika muktadha wa kuwasilisha ujumbe.
