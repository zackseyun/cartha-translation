base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/002.yaml
  text: They set out from Rephidim and came to the wilderness of Sinai[a], and they camped in the wilderness. There Israel camped before the mountain.
translation:
  language: sw
  text: Wakaondoka Refidimu, wakafika katika nyika ya Sinai, wakapiga kambi nyikani. Huko Israeli wakapiga kambi mbele ya mlima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkabala na mlima.” Kihusishi cha Kiebrania kinaweza kumaanisha kuwa mahali panapokabili au palipo mbele ya kitu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Wakaondoka
  rationale: Katika simulizi la safari, נסע humaanisha kuvunja kambi na kuanza safari; “wakaondoka” ni Kiswahili cha kawaida kinachoendeleza mwendo wa simulizi.
- source_word: מֵרְפִידִים
  choice: Refidimu
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili; kiambishi מ־ kimewakilishwa na maana ya kuondoka mahali hapo.
- source_word: וַיָּבֹאוּ
  choice: wakafika
  rationale: בוא inaweza kumaanisha kuja, kuingia, au kufika. Katika mfuatano wa safari, “wakafika” huonyesha kwa kawaida kufikiwa kwa mahali palipokusudiwa.
- source_word: מִדְבַּר סִינַי
  choice: nyika ya Sinai
  rationale: מִדְבָּר ni eneo kame lisilokaliwa sana, si lazima jangwa la mchanga; “nyika” inadumisha upana huo wa maana.
- source_word: וַיַּחֲנוּ בַּמִּדְבָּר
  choice: wakapiga kambi nyikani
  rationale: חנה ni kupiga kambi. Urudiaji wa מִדְבָּר umehifadhiwa, huku “nyikani” likiwa umbo la asili la Kiswahili.
- source_word: וַיִּחַן שָׁם יִשְׂרָאֵל
  choice: Huko Israeli wakapiga kambi
  rationale: שָׁם imetangulizwa kama “Huko” ili kuhifadhi msisitizo wa mahali. “Israeli” imehifadhiwa kama jina la pamoja la watu; upatanisho wa wingi ni wa kawaida kwa Kiswahili unapowarejelea watu hao, ingawa Kiebrania hutumia kitenzi cha umoja.
- source_word: נֶגֶד הָהָר
  choice: mbele ya mlima
  rationale: נֶגֶד huonyesha mahali panapokabili, mbele, au mkabala na kitu. “Mbele ya mlima” ni ya asili na haibani uhusiano huo wa kijiografia kupita kiasi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye staha. Urudiaji wa “nyika” na “kupiga kambi” umehifadhiwa kwa sababu ni sehemu ya muundo wa aya ya Kiebrania.
