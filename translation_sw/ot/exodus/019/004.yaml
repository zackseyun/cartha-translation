  text: אַתֶּ֣ם רְאִיתֶ֔ם אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/מִצְרָ֑יִם וָ/אֶשָּׂ֤א אֶתְ/כֶם֙ עַל כַּנְפֵ֣י נְשָׁרִ֔ים וָ/אָבִ֥א אֶתְ/כֶ֖ם אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/004.yaml
  text: You yourselves have seen what I did to Egypt[c][b][a], and how I carried you on eagles’ wings and brought you to myself.
translation:
  language: sw
  text: Ninyi wenyewe mmeona yale niliyoitendea Misri, na jinsi nilivyowabeba juu ya mabawa ya tai[a][b] na kuwaleta kwangu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya mbawa za tai.” Hii ni sitiari hai ya ulinzi na ukombozi wenye nguvu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “tai” linaweza pia kumaanisha kwa upana ndege wakubwa wawindaji.
    reason: lexical_alternative
  - marker: c
    text: Au, “kuwaleta hadi kwangu.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַתֶּם
  choice: Ninyi wenyewe
  rationale: Kiwakilishi huru kinasisitiza kwamba Waisraeli wenyewe walikuwa mashahidi wa matendo ya Mungu.
- source_word: רְאִיתֶם
  choice: mmeona
  rationale: Kauli hii inaeleza jambo lililokamilika ambalo umuhimu wake unaendelea katika wakati wa hotuba.
- source_word: אֲשֶׁר עָשִׂיתִי לְמִצְרָיִם
  choice: yale niliyoitendea Misri
  rationale: Huhifadhi Misri kama taifa au jamii inayokusudiwa, na kuonyesha kwamba ilikuwa kitu kilichoathiriwa na matendo ya Mungu, si mnufaika wake.
- source_word: וָאֶשָּׂא אֶתְכֶם
  choice: nilivyowabeba
  rationale: Kitenzi נשׂא hapa kina maana ya kubeba; tafsiri hii ni ya kawaida na inafaa picha ya ulinzi na ukombozi.
- source_word: עַל כַּנְפֵי נְשָׁרִים
  choice: juu ya mabawa ya tai
  rationale: Huhifadhi sitiari hai ya Kiebrania kuhusu ukombozi wenye nguvu, ulinzi na wepesi. Neno tai linafaa katika muktadha, ingawa neno la Kiebrania linaweza kutumiwa kwa upana zaidi.
- source_word: וָאָבִא אֶתְכֶם אֵלָי
  choice: na kuwaleta kwangu
  rationale: Ni tafsiri ya asili ya אֵלָי na inadumisha mwelekeo wa ukombozi kuelekea kwa Mungu bila kuongeza maelezo yasiyomo katika Kiebrania.
theological_decisions:
- issue: Nguvu ya uhusiano katika ukombozi wa Mungu
  choice: kuwaleta kwangu
  alternative: kuwaleta hadi kwangu
  rationale: Maneno yanaonyesha kwamba lengo la kutoka Misri halikuwa kuokolewa tu bali kuletwa kwa Mungu. Tafsiri haifafanui zaidi aina ya uhusiano kuliko maandishi ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ninyi wenyewe” huhifadhi msisitizo wa Kiebrania; “mmeona” huonyesha tukio lililokamilika lenye umuhimu wa sasa. Mpangilio wa alama za tanbihi umewekwa karibu na maneno yanayohusika.
