  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מֹשֶׁ֥ה עָלָ֖ה אֶל הָ/אֱלֹהִ֑ים וַ/יִּקְרָ֨א אֵלָ֤י/ו יְהוָה֙ מִן הָ/הָ֣ר לֵ/אמֹ֔ר כֹּ֤ה תֹאמַר֙ לְ/בֵ֣ית יַעֲקֹ֔ב וְ/תַגֵּ֖יד לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/003.yaml
  text: And Moses went up to God[a], and Yahweh called to him from the mountain, saying, “Thus you shall say to the house of Jacob, and tell the sons of Israel:”
translation:
  language: sw
  text: Musa akapanda kwenda kwa Mungu, naye Yahwe akamwita kutoka mlimani, akisema, “Hivi ndivyo utakavyoiambia nyumba ya Yakobo, na kuwaeleza wana wa Israeli[a]:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wa Israeli” au “watu wa Israeli.” Kiebrania kinasema kihalisi “wana wa Israeli,” usemi wa kiume unaowakilisha kundi lote.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: akapanda kwenda
  rationale: Kitenzi kinaonyesha mwendo wa kuelekea juu; usemi huu ni wa kawaida katika Kiswahili na unahifadhi maana ya mahali.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Ingawa nomino ya Kiebrania ina kibainishi, hapa inamtaja Mungu wa Israeli; Kiswahili cha kawaida hakihitaji muundo unaolingana na ‘the God.’
- source_word: וַיִּקְרָא אֵלָיו
  choice: akamwita
  rationale: Muundo huu unaonyesha kwamba Yahwe alimwita Musa; ‘akamwita’ ni wa kawaida na wazi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: מִן הָהָר
  choice: kutoka mlimani
  rationale: הַר hapa ni mlima unaotajwa katika muktadha, yaani Sinai; ‘mlimani’ ni umbo la asili la Kiswahili baada ya ‘kutoka.’
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kiswahili hiki kinatambulisha maneno ya moja kwa moja kwa uwazi.
- source_word: כֹּה תֹאמַר
  choice: Hivi ndivyo utakavyoiambia
  rationale: Muundo huu unahifadhi fomula rasmi ya ujumbe wa Mungu huku ukisomeka kwa kawaida katika Kiswahili cha sasa.
- source_word: לְבֵית יַעֲקֹב
  choice: nyumba ya Yakobo
  rationale: Tafsiri hii inahifadhi taswira ya agano na maana ya pamoja ya ukoo au jumuiya ya Yakobo.
- source_word: וְתַגֵּיד
  choice: na kuwaeleza
  rationale: Hifili ya נגד ina maana ya kutangaza au kujulisha; ‘kuwaeleza’ ni wazi na inatofautisha kwa kiasi kitenzi hiki na ‘kuiambia’ kilicho katika mstari sambamba.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: ‘Wana wa Israeli’ ni usemi wa kibiblia unaoeleweka katika Kiswahili na unahifadhi muundo wa Kiebrania, huku tanbihi ikifafanua kwamba ni usemi wa pamoja.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova au BWANA
  rationale: Andiko la Kiebrania linatumia jina la agano lenyewe; ‘Yahwe’ linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Usemi wa kiume wa pamoja לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: watoto wa Israeli au watu wa Israeli
  rationale: ‘Wana’ linadumisha umbo la Kiebrania bila kulazimisha maana kwamba wanaume pekee ndio wanaokusudiwa; tanbihi inahifadhi na kueleza mvutano huo wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa sentensi na urudiaji wa ‘nyumba ya Yakobo’ na ‘wana wa Israeli’ umehifadhi usambamba wa Kiebrania bila kufanya lugha kuwa ngumu.
