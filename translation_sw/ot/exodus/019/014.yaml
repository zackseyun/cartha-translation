  text: וַ/יֵּ֧רֶד מֹשֶׁ֛ה מִן הָ/הָ֖ר אֶל הָ/עָ֑ם וַ/יְקַדֵּשׁ֙ אֶת הָ/עָ֔ם וַֽ/יְכַבְּס֖וּ שִׂמְלֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/014.yaml
  text: So Moses went down from the mountain to the people[a], and he consecrated the people, and they washed their garments.
translation:
  language: sw
  text: Basi Musa akashuka kutoka mlimani kwenda kwa watu; akawatakasa[a] watu, nao wakafua mavazi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawaweka watu wakfu,” au “akawatenga watu wawe watakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: Kitenzi ירד kinaonyesha mwendo wa kuelekea chini; “akashuka” ni tafsiri ya kawaida na ya moja kwa moja katika muktadha huu.
- source_word: מִן הָהָר
  choice: kutoka mlimani
  rationale: הַר hapa ni Mlima Sinai unaotajwa katika muktadha; “kutoka mlimani” ni usemi wa asili wa Kiswahili unaoonyesha mahali Musa alikotoka.
- source_word: אֶל הָעָם
  choice: akawaendea watu
  rationale: עָם maana yake ya kawaida ni “watu.” Muundo huu unaonyesha Musa alielekea walikokuwa watu bila kuongeza wazo la kusanyiko rasmi.
- source_word: וַיְקַדֵּשׁ
  choice: akawatakasa
  rationale: Katika kauli ya piel, קדשׁ hapa inahusu kuwaandaa watu kiibada kwa ajili ya kukutana na Mungu. “Akawatakasa” ni neno la kawaida la kibiblia linalobeba wazo la kuwekwa katika hali takatifu, huku tanbihi ikihifadhi maana mbadala ya kuwekwa wakfu au kutengwa.
- source_word: הָעָם
  choice: watu
  rationale: Kurudiwa kwa “watu” kunahifadhi msisitizo na muundo wa Kiebrania kwa uwazi.
- source_word: וַיְכַבְּסוּ
  choice: wakafua
  rationale: כבס hutumiwa hasa kwa kuosha nguo; “kufua” ndilo neno sahihi na la kawaida la Kiswahili katika muktadha huu.
- source_word: שִׂמְלֹתָם
  choice: mavazi yao
  rationale: שִׂמְלָה humaanisha nguo au vazi. “Mavazi” yanafaa kwa mazingira yenye uzito wa maandalizi ya kiibada bila kuwa ya kizamani.
theological_decisions:
- issue: Lugha ya utakatifu wa kiibada katika maandalizi ya udhihirisho wa Mungu huko Sinai
  choice: akawatakasa watu
  alternative: akawaweka watu wakfu; akawatenga watu wawe watakatifu
  rationale: Muktadha unaeleza maandalizi ya watu kwa ajili ya kukutana na Mungu, si lazima mabadiliko ya kimaadili ya ndani. “Akawatakasa” hudumisha lugha ya utakatifu ya neno la Kiebrania, na tanbihi inaonyesha wazi uwezekano wa kuelewa tendo hilo kama kuwaweka wakfu au kuwatenga kwa kusudi takatifu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wakafua mavazi yao” ni usemi wa kawaida na sahihi zaidi kuliko tafsiri ya jumla ya kuosha. Sentensi mbili zimetumiwa ili kuepuka mfululizo mzito wa viunganishi huku mtiririko wa matendo ya Kiebrania ukihifadhiwa.
