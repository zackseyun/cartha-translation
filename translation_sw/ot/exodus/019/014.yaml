  terminology: '"Akawatakasa" is an acceptable established biblical rendering of וַיְקַדֵּשׁ in this ritual context. The footnote appropriately preserves the closely related senses of consecrating and setting apart, without reducing the act to moral cleansing. "Wakafua mavazi yao" correctly reflects washing garments.'
