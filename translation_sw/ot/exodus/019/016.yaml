base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/016.yaml
  text: And it happened on the third day[a], when morning came, that there were thunders and lightnings, and a heavy cloud on the mountain, and the sound of a trumpet, very loud[c][b]; and all the people who were in the camp trembled.
translation:
  language: sw
  text: Ikawa siku ya tatu, kulipopambazuka, kukawa na ngurumo[a] na radi, na wingu zito juu ya mlima, na sauti kubwa sana[c] ya baragumu[b]; nao watu wote waliokuwa kambini wakatetemeka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sauti.” Neno la Kiebrania linaweza kumaanisha sauti; lakini hapa, kwa kuwa limetajwa pamoja na radi, yaelekea linamaanisha ngurumo.
    reason: lexical_alternative
  - marker: b
    text: Au “pembe ya kondoo-dume.” Shofari ni baragumu la pembe, ambalo kwa kawaida hutengenezwa kwa pembe ya mnyama.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “yenye nguvu sana”; katika muktadha huu maneno hayo yanaeleza ukubwa wa sauti ya baragumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni mwanzo wa tukio katika simulizi; “Ikawa” huhifadhi mtiririko wa Kiebrania kwa Kiswahili cha kibiblia kinachoeleweka bila kutumia usemi mrefu usio wa lazima.
- source_word: בַיּוֹם הַשְּׁלִישִׁי
  choice: siku ya tatu
  rationale: Ni kirai cha wakati kilicho wazi na cha kawaida katika Kiswahili.
- source_word: בִּהְיֹת הַבֹּקֶר
  choice: kulipopambazuka
  rationale: Muundo huu una maana ya wakati, yaani asubuhi ilipowadia; “kulipopambazuka” ni wa asili na wenye hadhi katika Kiswahili.
- source_word: קֹלֹת
  choice: ngurumo
  rationale: Ingawa neno linaweza kumaanisha sauti au sauti za viumbe, likiwa sambamba na radi katika muktadha huu linaelekea kumaanisha ngurumo za radi.
- source_word: וּבְרָקִים
  choice: radi
  rationale: Katika Kiswahili sanifu, “radi” inaweza kutaja mng’ao au tukio la radi; sambamba na “ngurumo” hapa inaeleweka kama mimweko ya radi.
- source_word: עָנָן כָּבֵד
  choice: wingu zito
  rationale: Huhifadhi maana ya msingi ya kivumishi כָּבֵד na kuonyesha uzito au msongamano wa wingu.
- source_word: עַל הָהָר
  choice: juu ya mlima
  rationale: עַל hapa inaweza kumaanisha juu ya au kwenye; “juu ya mlima” ni ya kawaida na haidai kwa lazima kwamba wingu liligusa uso wa mlima.
- source_word: קֹל שֹׁפָר
  choice: sauti ... ya baragumu
  rationale: Kirai kinataja sauti inayosikika ya שֹׁפָר. “Baragumu” ni neno la Kiswahili linalofikika kwa ala hii, huku tanbihi ikieleza asili yake ya pembe.
- source_word: חָזָק מְאֹד
  choice: kubwa sana
  rationale: Kivumishi kina maana ya ‘yenye nguvu sana’; kinapotumiwa kwa sauti, “kubwa sana” ni Kiswahili cha kawaida kinachoeleza ukali wa sauti bila kupoteza maana ya muktadha.
- source_word: וַיֶּחֱרַד
  choice: wakatetemeka
  rationale: Kitenzi huonyesha kutetemeka kwa hofu au mshtuko; “wakatetemeka” huhifadhi jambo la kimwili na la kihisia bila kulifasiri kupita kiasi.
- source_word: כָּל הָעָם אֲשֶׁר בַּמַּחֲנֶה
  choice: watu wote waliokuwa kambini
  rationale: Huwakilisha kishazi rejeshi cha Kiebrania kwa Kiswahili cha kawaida na sahihi.
theological_decisions:
- issue: Taswira ya kujidhihirisha kwa Mungu katika Sinai
  choice: Matukio yametafsiriwa kama yanavyoelezwa kwa hisi, bila kuongeza maelezo ya kiteolojia yasiyosemwa wazi.
  alternative: Kutafsiri קֹלֹת kuwa “sauti” ili kudokeza sauti za mbinguni.
  rationale: Muktadha unaunga mkono “ngurumo” kwa sababu neno limeambatanishwa na radi, lakini upana halisi wa maana ya Kiebrania umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Ikawa” unadumisha mtiririko wa simulizi la Kiebrania; msamiati mwingine umewekwa wa kawaida na unaoeleweka kwa wasomaji wengi.
