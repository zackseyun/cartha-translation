base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/018.yaml
  text: Mount Sinai was all in smoke because Yahweh had descended on it in fire[a], and its smoke went up like the smoke of a furnace, and the whole mountain trembled greatly.
translation:
  language: sw
  text: Mlima Sinai wote ulifunikwa na moshi, kwa sababu Yahweh alikuwa ameshuka juu yake katika moto. Moshi wa mlima ukapanda kama moshi wa tanuru[a], nao mlima wote ukatetemeka sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tanuru ya kufyatulia.”
    reason: Neno כִּבְשָׁן linaweza kumaanisha tanuru au tanuru ya kufyatulia. Alama imewekwa baada ya “tanuru,” neno ambalo tanbihi inalifafanua.
lexical_decisions:
- source_word: וְהַר סִינַי
  choice: Mlima Sinai
  rationale: Jina la mahali limetafsiriwa moja kwa moja. Kiunganishi וְ hakihitaji neno tofauti mwanzoni mwa sentensi ya Kiswahili, kwa kuwa uhusiano wa kisimulizi unaeleweka katika muktadha.
- source_word: עָשַׁן כֻּלּוֹ
  choice: wote ulifunikwa na moshi
  rationale: Kauli hii inaonyesha kwamba mlima mzima ulikuwa katika moshi. Tafsiri hii ni ya kawaida kwa Kiswahili na inahifadhi wazo la moshi kuenea katika mlima wote.
- source_word: מִפְּנֵי אֲשֶׁר
  choice: kwa sababu
  rationale: Kirai hiki kinatoa sababu ya mlima kufunikwa na moshi.
- source_word: יָרַד עָלָיו יְהוָה
  choice: Yahweh alikuwa ameshuka juu yake
  rationale: Muundo wa wakati uliotangulia unaonyesha kwamba kushuka kwa Yahweh ndiko kulikosababisha moshi; עָלָיו inarejelea mlima.
- source_word: בָּאֵשׁ
  choice: katika moto
  rationale: Huhifadhi namna au mazingira ya kushuka kwa Yahweh bila kufafanua zaidi ya chanzo.
- source_word: וַיַּעַל עֲשָׁנוֹ
  choice: Moshi wake ukapanda
  rationale: Kiwakilishi cha kiume katika Kiebrania kinarejelea mlima, hivyo ‘wake’ ni moshi wa mlima; ‘ukapanda’ huhifadhi mwendo wa kuelekea juu.
- source_word: כְּעֶשֶׁן הַכִּבְשָׁן
  choice: kama moshi wa tanuru
  rationale: כִּבְשָׁן inaweza kuwa tanuru au joko la kuchomea. ‘Tanuru’ ni neno linaloeleweka na linafaa kwa picha ya moshi mzito; maana nyingine imehifadhiwa katika tanbihi.
- source_word: וַיֶּחֱרַד כָּל הָהָר מְאֹד
  choice: nao mlima wote ukatetemeka sana
  rationale: ‘Ukatetemeka’ huonyesha mtikisiko mkubwa wa mlima, na ‘sana’ huhifadhi msisitizo wa מְאֹד.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu mwenyewe, si cheo. ‘Yahweh’ ni unukuzi wa kawaida unaohifadhi jina hilo bila kulibadilisha kuwa ‘Bwana.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi unaoeleweka na hadhi inayofaa maandiko. ‘Ulifunikwa na moshi’ ni ya asili zaidi kuliko tafsiri ya neno kwa neno kama ‘ulifuka wote,’ huku ‘ukatetemeka sana’ ikihifadhi nguvu ya kauli ya Kiebrania.
