base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/023.yaml
  text: And Moses said to Yahweh[a], “The people cannot go up to Mount Sinai, because you yourself warned us, saying[b], ‘Set bounds around the mountain and consecrate it.’”
translation:
  language: sw
  text: Musa akamwambia Yahwe, “Watu hawawezi kupanda Mlima Sinai, kwa sababu wewe mwenyewe ulituonya[a] ukisema, ‘Weka mpaka kuuzunguka mlima na uutakase.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ulitupa agizo zito” au “ulitupa ushuhuda.” Kitenzi cha Kiebrania kinaweza kumaanisha kutoa onyo rasmi au ushuhuda.
    reason: lexical_alternative
  - marker: b
    text: Au “Weka mpaka kwa ajili ya mlima na uufanye kuwa mtakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna inayotamkika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: לֹא יוּכַל הָעָם
  choice: Watu hawawezi
  rationale: Kitenzi יכל hapa kinaonyesha kutoweza, si kukosa ruhusa tu. Kiswahili hutumia upatanisho wa wingi kwa nomino ya pamoja ‘watu.’
- source_word: לַעֲלֹת אֶל הַר סִינָי
  choice: kupanda Mlima Sinai
  rationale: ‘Kupanda’ huhifadhi maana ya kuelekea juu na ni usemi wa kawaida wa Kiswahili kwa kupanda mlima.
- source_word: אַתָּה
  choice: wewe mwenyewe
  rationale: Kiwakilishi kilichotajwa wazi katika Kiebrania kina mkazo; ‘wewe mwenyewe’ huuhifadhi bila kuwa kizito.
- source_word: הַעֵדֹתָה בָּנוּ
  choice: ulituonya
  rationale: Katika muktadha huu, Hifili ya עוד ina maana ya kutoa onyo au agizo zito. ‘Ulituonya’ ni ya asili na inafaa kwa katazo la kuvuka mpaka.
- source_word: הַגְבֵּל אֶת הָהָר
  choice: Weka mpaka kuuzunguka mlima
  rationale: Amri inaelekeza kuweka kikomo au mpaka kwa mlima; tafsiri hii inaonyesha kwamba mpaka huo unazuia watu wasiukaribie.
- source_word: וְקִדַּשְׁתּוֹ
  choice: na uutakase
  rationale: Pieli ya קדשׁ ina maana ya kutenga kuwa mtakatifu. ‘Uutakase’ huhifadhi maana ya kidini kwa lugha fupi na yenye hadhi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo, huku likifuata umbo linalotumika kwa kawaida katika Kiswahili.
- issue: Maana ya הַעֵדֹתָה בָּנוּ
  choice: ulituonya
  alternative: ulitupa agizo zito / ulishuhudia kwetu
  rationale: Muktadha wa mpaka wa Sinai unaunga mkono maana ya onyo zito, lakini tanbihi huhifadhi wigo wa kitenzi unaoweza kuhusisha ushuhuda au agizo rasmi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo wa mazungumzo ya moja kwa moja na mkazo wa ‘wewe mwenyewe’ umehifadhiwa.
