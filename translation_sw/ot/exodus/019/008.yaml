base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/008.yaml
  text: And all the people answered together and said[a], “All that Yahweh has spoken we will do.” Then Moses brought back the words of the people to Yahweh.
translation:
  language: sw
  text: Watu wote wakajibu kwa pamoja, wakasema, “Yote ambayo Yahwe amesema tutayatenda.” Kisha Musa akayarudisha maneno ya watu kwa Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Musa akamweleza Yahwe maneno ya watu.”
    reason: Kitenzi וַיָּשֶׁב kinaweza kumaanisha kurudisha au kuripoti/kueleza ujumbe.
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: wakajibu
  rationale: Katika muktadha huu wa mazungumzo, ענה humaanisha kujibu kwa maneno; tafsiri hii pia inaunganika moja kwa moja na kauli inayofuata.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: Huhifadhi maana ya kundi lote kwa Kiswahili cha kawaida na cha asili.
- source_word: יַחְדָּו
  choice: kwa pamoja
  rationale: Huonyesha kwamba watu walitoa jibu la pamoja bila kulazimisha maana maalumu zaidi ya kusema kwa sauti moja.
- source_word: כֹּל אֲשֶׁר דִּבֶּר
  choice: Yote ambayo ... amesema
  rationale: Huwakilisha kwa kawaida jumla ya mambo ambayo Yahwe alikuwa amesema hadi wakati huo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: נַעֲשֶׂה
  choice: tutayatenda
  rationale: Kitenzi עשה ni ‘kutenda/kufanya.’ ‘Tutayatenda’ huhifadhi maana hiyo na kurejelea mambo yote yaliyosemwa bila kuongeza moja kwa moja dhana ya ‘kutii.’
- source_word: וַיָּשֶׁב
  choice: akayarudisha
  rationale: Hifili ya שוב inaweza kuonyesha kurudisha au kupeleka taarifa tena. ‘Akayarudisha’ huhifadhi taswira ya kurejesha maneno, huku tanbihi ikionyesha maana mbadala ya kuripoti.
- source_word: דִּבְרֵי הָעָם
  choice: maneno ya watu
  rationale: Ni tafsiri ya karibu ya muundo wa Kiebrania na huhifadhi nomino halisi ‘maneno’ badala ya kuibadili kuwa ‘jibu.’
- source_word: אֶל יְהוָה
  choice: kwa Yahwe
  rationale: Kihusishi אֶל hapa kinaonyesha anayeelekezewa maneno; ‘kwa Yahwe’ ni usemi wa kawaida wa Kiswahili katika muundo huu.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano lenyewe. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kutumia cheo au umbo jingine la kimapokeo.
- issue: Iwapo נַעֲשֶׂה itafsiriwe kwa lugha ya utiifu
  choice: tutayatenda
  alternative: tutatii
  rationale: Ingawa muktadha unahusu utiifu, kitenzi cha Kiebrania kinasema moja kwa moja ‘tutafanya/tutatenda.’ Tafsiri iliyochaguliwa huepuka kuongeza ufafanuzi ulio wazi zaidi kuliko maandishi.
- issue: Maana ya וַיָּשֶׁב kuhusu maneno ya watu
  choice: akayarudisha maneno ya watu
  alternative: akampaikanisha/akamweleza Yahwe maneno ya watu
  rationale: Umbo la kitenzi linaweza kuhifadhi taswira ya kurudisha au kuwa na maana ya kuripoti. Maandishi makuu yanahifadhi taswira hiyo, na tanbihi inaweka wazi maana nyingine inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa simulizi la kawaida; ‘kwa pamoja’ ni rahisi kueleweka, na ‘tutayatenda’ huhifadhi usahihi wa kitenzi bila kuingiza ufafanuzi wa ziada.
