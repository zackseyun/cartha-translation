  text: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
translation:
  language: sw
  text: Mkono wowote usimguse[a], kwa maana hakika atapigwa mawe au atapigwa mishale[b]. Awe mnyama au mtu, hataishi. Pembe ya kondoo-dume itakapopigwa kwa muda mrefu[c], ndipo wataruhusiwa kupanda mlimani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mkono wowote usikiguse,” ikiwa kiwakilishi hicho kinaeleweka kwa maana pana zaidi. Maana ni kwamba mkosaji asiguswe moja kwa moja, bali auawe akiwa mbali.
    reason: alternative_reading
  - marker: b
    text: Au, “atatobolewa kabisa.” Kitenzi cha Kiebrania kinaweza kumaanisha kupigwa kwa mshale, yaelekea kwa mishale katika muktadha huu.
    reason: lexical_alternative
  - marker: c
    text: Kwa Kiebrania, “pembe ya kondoo-dume inapovutwa”; yaelekea maana yake ni mlio mrefu wa pembe hiyo.
    reason: cultural_note
lexical_decisions:
- source_word: תִגַּע בּוֹ יָד
  choice: Mkono wowote usimguse
  rationale: Inahifadhi mtindo wa sheria usiotaja mtendaji moja kwa moja na inachukulia kiambishi cha kiume cha umoja kuwa kinamrejelea mkosaji, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: סָקוֹל יִסָּקֵל
  choice: hakika atauawa kwa kupigwa mawe
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichopinda unasisitiza uhakika wa adhabu; Kiswahili hiki pia kinaweka wazi kwamba kupigwa mawe ni njia ya kumuua.
- source_word: יָרֹה יִיָּרֶה
  choice: kwa kupigwa mshale
  rationale: Katika muktadha huu ירה inaelekea kumaanisha kupiga kwa kombora, yaelekea mshale; tanbihi inahifadhi maana pana ya kuchomwa.
- source_word: אִם בְּהֵמָה אִם אִישׁ
  choice: Awe mnyama au mtu
  rationale: Huwasilisha kwa ufupi na kwa Kiswahili cha kawaida kwamba hukumu hiyo inahusu kila mojawapo ya makundi hayo.
- source_word: לֹא יִחְיֶה
  choice: hataachwa hai
  rationale: Hutoa nguvu ya kisheria ya tamko hilo kwa Kiswahili cha sasa bila kulazimisha kiwakilishi cha kijinsia baada ya kutajwa kwa mnyama au mtu.
- source_word: בִּמְשֹׁךְ הַיֹּבֵל
  choice: Baragumu ya pembe ya kondoo-dume itakapopigwa kwa sauti ndefu
  rationale: יוֹבֵל hapa inaeleweka kama pembe ya kondoo-dume au sauti yake, na משׁך huonyesha kuendelezwa kwa mlio.
- source_word: הֵמָּה יַעֲלוּ בָהָר
  choice: ndipo watakapoweza kupanda mlimani
  rationale: Katika muktadha wa mpaka uliowekwa, mlio mrefu unaashiria ruhusa ya kupanda; 'watakapoweza' huonyesha kuondolewa kwa katazo bila kufanya ruhusa hiyo kuwa amri.
theological_decisions:
- issue: Kirejelewa cha kiambishi cha kiume cha umoja katika בּוֹ
  choice: Kinamrejelea mkosaji aliyegusa au kuvuka mpaka wa mlima.
  alternative: Kinaweza kurejelea kwa upana zaidi kile kilichotiwa mwiko kwa kugusana, hivyo kutafsiriwa 'usiuguse.'
  rationale: Muktadha wa karibu unazungumzia mtu au mnyama anayevuka mpaka na kuuawa bila kuguswa moja kwa moja; hata hivyo, utata halisi wa kirejelewa umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifungu cha sheria lakini kinachoeleweka kwa wasomaji wa kawaida. 'Baragumu ya pembe ya kondoo-dume' huepuka kuchanganya chombo hiki na tarumbeta ya kisasa, huku 'mlimani' ikifuata matumizi ya kawaida ya Kiswahili.
