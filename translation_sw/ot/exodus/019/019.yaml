  text: And the sound of the trumpet kept growing stronger and stronger[a]; Moses would speak[b], and God would answer him with a voice.
translation:
  language: sw
  text: Sauti ya tarumbeta iliendelea kuwa na nguvu zaidi na zaidi[a]. Musa alikuwa akisema, naye Mungu alikuwa akimjibu kwa sauti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ilizidi kusikika kwa nguvu zaidi na zaidi.” Kiebrania hueleza kihalisi kwamba sauti ya tarumbeta ilikuwa “ikiendelea na kuwa na nguvu sana.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa ngurumo,” au “kwa sauti iliyosikika.” Kiebrania kinasema “kwa sauti.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ikazidi
  rationale: Kiunganishi cha kisimulizi kinaunganishwa kwa ufasaha na tendo linaloendelea la sauti kuongezeka, badala ya tafsiri ngumu ya neno kwa neno kama ‘ikawa.’
- source_word: קוֹל הַשּׁוֹפָר
  choice: Sauti ya tarumbeta
  rationale: קוֹל hapa ni ‘sauti’ kwa sababu inaeleza mlio wa שׁוֹפָר; ‘tarumbeta’ ni neno la kawaida na linaloeleweka kwa ala ya pembe iliyopulizwa.
- source_word: הוֹלֵךְ וְחָזֵק מְאֹד
  choice: ikazidi kuwa na nguvu sana
  rationale: Muundo huu unaonyesha ongezeko linaloendelea. Tafsiri hii inadumisha picha pana ya sauti kuzidi nguvu bila kuibana kuwa ukubwa wa sauti pekee.
- source_word: מֹשֶׁה יְדַבֵּר
  choice: Musa alikuwa akisema
  rationale: Kauli isiyotimilika inaonyesha tendo lililokuwa likiendelea au kujirudia katika tukio hilo; ‘alikuwa akisema’ ni Kiswahili cha kawaida kinachohifadhi hali hiyo.
- source_word: יַעֲנֶנּוּ
  choice: alikuwa akimjibu
  rationale: Kauli isiyotimilika inalingana na tendo la Musa na kuonyesha jibu lililokuwa likitolewa au kujirudia.
- source_word: בְּקוֹל
  choice: kwa sauti
  rationale: Hii huhifadhi upana wa maana ya Kiebrania ‘kwa/katika sauti’ bila kuamua kuwa ilikuwa ngurumo.
theological_decisions:
- issue: Asili ya jibu la Mungu huko Sinai
  choice: Mungu alikuwa akimjibu ‘kwa sauti’
  alternative: Mungu alikuwa akimjibu kwa ngurumo; Mungu alikuwa akimjibu kwa kusikika
  rationale: בְּקוֹל inaweza kurejelea sauti kwa upana, lakini mstari wenyewe hautaji ngurumo waziwazi. ‘Kwa sauti’ huhifadhi maneno na mvutano wa kifasiri wa chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Miundo ya ‘alikuwa aki-’ imetumiwa kuonyesha matendo yanayoendelea au kujirudia; ‘tarumbeta’ imechaguliwa kwa uelewekaji wa kawaida.
