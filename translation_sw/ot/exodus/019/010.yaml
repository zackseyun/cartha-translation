base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/010.yaml
  text: Then Yahweh said to Moses[a], “Go to the people and consecrate them today and tomorrow, and let them wash their garments.”
translation:
  language: sw
  text: Ndipo Yahweh akamwambia Musa, “Nenda kwa watu, uwaweke wakfu[a] leo na kesho, nao wafue mavazi yao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uwatakase” au “uwatenge wawe watakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limehifadhiwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida na kuonyesha kwamba Yahweh alimwambia Musa.
- source_word: לֵךְ אֶל הָעָם
  choice: Nenda kwa watu
  rationale: Ni amri ya moja kwa moja, na עָם hapa ni jumuiya ya Israeli.
- source_word: וְקִדַּשְׁתָּם
  choice: uwaweke wakfu
  rationale: Kauli hii inaonyesha kuwatenga na kuwaandaa watu kwa kusudi takatifu, hasa kwa ajili ya kukutana na Mungu; ‘kuweka wakfu’ huhifadhi maana hiyo ya kiibada bila kuifanya kuwa badiliko la ndani pekee.
- source_word: הַיּוֹם וּמָחָר
  choice: leo na kesho
  rationale: Huu ni usemi wa moja kwa moja unaotaja kipindi cha maandalizi cha siku hizo mbili.
- source_word: וְכִבְּסוּ שִׂמְלֹתָם
  choice: nao wafue mavazi yao
  rationale: Kitenzi cha wingi kinawahusu watu, na ‘kufua mavazi’ ni usemi wa asili wa Kiswahili unaofaa kwa usafishaji wa nguo.
theological_decisions:
- issue: Lugha ya maandalizi matakatifu katika קדשׁ
  choice: uwaweke wakfu
  alternative: uwatakase; uwatenge wawe watakatifu
  rationale: Muktadha ni maandalizi ya kiibada ya watu kwa ajili ya kukutana na Yahweh huko Sinai. Tafsiri hii huhifadhi wazo la kutengwa kwa kusudi takatifu bila kudai kwamba kinachozungumziwa ni utakaso wa ndani pekee.
- issue: Kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Mavazi’ linafaa kwa uzito wa tukio kuliko ‘nguo,’ na ‘nao wafue’ huonyesha wazi kwamba watu wenyewe ndio wanaopaswa kufua.
