  yaml_path: translation/ot/exodus/019/012.yaml
  text: And you shall set bounds for the people all around[a], saying, ‘Be careful not to go up on the mountain or touch its edge. Whoever touches the mountain shall surely be put to death.’
translation:
  language: sw
  text: Nawe uwawekee watu mipaka kila upande, ukisema, “Jihadharini msipande mlimani wala msiguse ukingo wake. Yeyote atakayegusa mlima hakika atauawa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִגְבַּלְתָּ אֶת־הָעָם סָבִיב
  choice: uwawekee watu mipaka kuuzunguka mlima
  rationale: Hifili ya גבל ina maana ya kuweka mpaka au kikomo. Ingawa neno 'mlima' halirudiwi moja kwa moja katika kishazi hiki, muktadha unalifanya kuwa rejeo la eneo linalozungushiwa mipaka; kulitamka huleta Kiswahili cha kawaida bila kubadili maana.
- source_word: לֵאמֹר
  choice: ukisema
  rationale: Infinitivi hii inaanzisha yaliyomo katika agizo; 'ukisema' ni utangulizi wa moja kwa moja na wa asili katika Kiswahili.
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Jihadharini
  rationale: Muundo huu wa kinahau unawaonya watu wajilinde au wawe waangalifu. 'Jihadharini' huhifadhi nguvu ya agizo na onyo.
- source_word: עֲלוֹת בָּהָר
  choice: msipande mlimani
  rationale: עלה pamoja na בָּהָר inaonyesha kupanda au kwenda juu kwenye mlima. Baada ya onyo, Kiswahili hutumia kwa kawaida muundo hasi 'msipande'.
- source_word: וּנְגֹעַ בְּקָצֵהוּ
  choice: wala kugusa ukingo wake
  rationale: נגע ni 'kugusa' na קצהו ni ncha, ukingo, au sehemu ya mwisho yake. 'Ukingo wake' huhifadhi taswira ya mpaka wa mlima.
- source_word: כָּל־הַנֹּגֵעַ בָּהָר
  choice: Yeyote atakayegusa mlima
  rationale: Muundo huu ni wa jumla na unamhusu kila mtu mmoja mmoja; 'yeyote atakayegusa' ni Kiswahili cha kawaida chenye nguvu hiyo.
- source_word: מוֹת יוּמָת
  choice: hakika atauawa
  rationale: Infinitivi kamili pamoja na kitenzi tendwa husisitiza uhakika wa kifo. 'Hakika' huonyesha msisitizo, na 'atauawa' huhifadhi hali ya kutendwa, inayolingana pia na utekelezaji unaofafanuliwa katika mstari unaofuata.
theological_decisions:
- issue: Je, מוֹת יוּמָת inaeleza kufa tu au kuuawa kwa hukumu?
  choice: hakika atauawa
  alternative: hakika atakufa
  rationale: Muundo wa Kiebrania ni wa hali ya kutendwa, na mstari unaofuata unaeleza kuuawa kunakotekelezwa na wengine. Tafsiri iliyochaguliwa huhifadhi hali hiyo bila kuongeza utambulisho wa mtekelezaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Agizo limetolewa kwa lugha wazi; 'mlimani' na 'ukingo wake' huhifadhi taswira ya eneo takatifu lenye mpaka, huku 'hakika atauawa' ikihifadhi msisitizo na hali ya kutendwa ya Kiebrania.
