base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/020.yaml
  text: And Yahweh came down on Mount Sinai[a], to the top of the mountain. Then Yahweh called Moses to the top of the mountain[b], and Moses went up.
translation:
  language: sw
  text: Yahweh akashuka juu ya Mlima Sinai, mpaka kilele cha mlima. Kisha Yahweh akamwita Musa kwenda kileleni mwa mlima, naye Musa akapanda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: Kitenzi ירד humaanisha kushuka. “Akashuka” ni cha kawaida katika Kiswahili na kinahifadhi mwendo unaoelekezwa chini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: הַר סִינַי
  choice: Mlima Sinai
  rationale: Hili ndilo umbo la kawaida na la asili la jina hili la mahali katika Kiswahili.
- source_word: אֶל רֹאשׁ הָהָר
  choice: mpaka kileleni mwa mlima / aje kileleni mwa mlima
  rationale: רֹאשׁ maana yake ya msingi ni “kichwa,” lakini hapa ni kilele cha mlima. Katika kishazi cha kwanza “mpaka” huonyesha kikomo cha kushuka; katika wito kwa Musa “aje” huweka wazi mwelekeo unaodokezwa na muktadha bila kubadili mahali panapolengwa.
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: קרא hapa ni kumwita mtu. Kiambishi cha yambwa “-mw-” huonyesha kwa kawaida kwamba Musa ndiye aliyeitwa.
- source_word: לְמֹשֶׁה
  choice: Musa
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: וַיַּעַל
  choice: akapanda
  rationale: עלה humaanisha kwenda juu au kupanda; “akapanda” ni fupi, ya kawaida, na inatofautiana vizuri na “akashuka.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandiko ya Kiebrania yanatumia moja kwa moja jina la Mungu יהוה. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo; “Yehova” ni umbo jingine la mapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mtindo wa simulizi umehifadhiwa kwa vitenzi vinavyofuatana vya wakati uliopita.
