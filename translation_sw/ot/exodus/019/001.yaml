  variant: Standard East African Swahili
source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁלִישִׁ֔י לְ/צֵ֥את בְּנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֣רֶץ מִצְרָ֑יִם בַּ/יּ֣וֹם הַ/זֶּ֔ה בָּ֖אוּ מִדְבַּ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/001.yaml
  text: In the third month after the sons of Israel had gone out from the land of Egypt[b][a], on this very day they came to the wilderness of Sinai.
translation:
  language: sw
  text: Katika mwezi wa tatu baada ya wana wa Israeli kutoka katika nchi ya Misri, siku hii hii[a] walifika katika nyika ya Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “siku hii.” Usemi huo unaweza kusisitiza siku hususa waliyofika: “siku hii hii.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: Katika mwezi wa tatu
  rationale: חֹדֶשׁ katika taarifa hii ya wakati humaanisha mwezi; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: לְצֵאת
  choice: baada ya ... kutoka
  rationale: Muundo wa kitenzi-jina pamoja na לְ unaonyesha wakati unaohesabiwa kuanzia tukio la kutoka; Kiswahili cha asili hutumia 'baada ya ... kutoka'.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi usemi wa Kiebrania 'wana wa Israeli,' ambao hapa ni jina la kawaida la taifa la agano.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Kitenzi 'kutoka' huandamana kwa kawaida na 'katika' katika Kiswahili, huku 'nchi' ikihifadhi neno אֶרֶץ.
- source_word: בַּיּוֹם הַזֶּה
  choice: siku hii hii
  rationale: Huhifadhi kiashiria 'hii' na msisitizo unaowezekana wa usemi wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: בָּאוּ
  choice: walifika
  rationale: Katika muktadha wa kufika mahali baada ya safari, 'walifika' huwasilisha maana ya בוא kwa Kiswahili cha asili kuliko 'walikuja,' bila kuongeza wazo lisilokuwapo.
- source_word: מִדְבַּר סִינָי
  choice: nyika ya Sinai
  rationale: '''Nyika'' hueleza eneo lisilokaliwa sana la מִדְבָּר bila kulazimisha maana ya jangwa kavu, na huhifadhi uhusiano wa majina.'
theological_decisions:
- issue: Tafsiri ya jina la taifa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watoto wa Israeli
  rationale: Usemi wa moja kwa moja huhifadhi jina la taifa kama lilivyo katika Kiebrania. 'Waisraeli' ni fasaha lakini huficha muundo wa chanzo; 'watoto' unaweza kudokeza umri mdogo katika Kiswahili cha sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. 'Wana wa Israeli' huhifadhi uwazi wa chanzo; 'nyika' huepuka kubainisha kupita kiasi kwamba eneo hilo lilikuwa jangwa kavu.
