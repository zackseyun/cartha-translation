  source_fidelity: 'Tafsiri inafuata vipashio vyote vya Kiebrania kwa uaminifu: tarehe ya “mwezi wa tatu,” rejeo la kutoka nchi ya Misri, jina “wana wa Israeli,” kiashiria cha wakati “siku hii hii,” na kufika kwenye nyika ya Sinai. “Baada ya ... kutoka” ni ufasiri unaokubalika wa לְצֵאת katika muktadha huu wa kihistoria.'
