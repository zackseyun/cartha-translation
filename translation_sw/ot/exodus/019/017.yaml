  text: וַ/יּוֹצֵ֨א מֹשֶׁ֧ה אֶת הָ/עָ֛ם לִ/קְרַ֥את הָֽ/אֱלֹהִ֖ים מִן הַֽ/מַּחֲנֶ֑ה וַ/יִּֽתְיַצְּב֖וּ בְּ/תַחְתִּ֥ית הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/017.yaml
  text: Then Moses brought the people out of the camp to meet God[a], and they took their stand at the foot of the mountain.
translation:
  language: sw
  text: Kisha Musa akawatoa watu kambini ili wakutane na Mungu, nao wakasimama kwenye sehemu ya chini ya mlima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye kitako cha mlima.” Usemi wa Kiebrania unarejelea sehemu ya chini ya mlima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: akawatoa
  rationale: Hifili ya יצא ina maana ya kusababisha kutoka; “akawatoa” huhifadhi maana hiyo ya kisababishi bila kuongeza wazo lisilotajwa la kuwaongoza.
- source_word: לִקְרַאת
  choice: ili wakutane na
  rationale: Kirai hiki huonyesha mwendo unaolenga kukutana; “ili wakutane na” ni Kiswahili cha kawaida na huonyesha kusudi la kutoka kambini.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Ingawa nomino ya Kiebrania ina kibainishi, hapa inamtaja Mungu mmoja anayejulikana katika simulizi; “Mungu” ndiyo namna ya kawaida na sahihi katika Kiswahili.
- source_word: מִן הַמַּחֲנֶה
  choice: kambini
  rationale: Pamoja na kitenzi “akawatoa,” “kambini” huonyesha kwa kawaida mahali walipotolewa bila kurudia maana ya kutoka.
- source_word: וַיִּתְיַצְּבוּ
  choice: wakasimama
  rationale: Kitenzi kinaweza kudokeza kuchukua mahali pa kusimama kwa makusudi. “Wakasimama” ni cha kawaida na hakiongezi wazo la kujipanga kwa namna fulani ambalo halijaelezwa wazi.
- source_word: בְּתַחְתִּית
  choice: kwenye sehemu ya chini ya
  rationale: Katika muktadha wa mlima, neno hili linamaanisha sehemu ya chini au kitako cha mlima. Tafsiri hii ni wazi na haidokezi bila sababu kwamba watu walikuwa moja kwa moja chini ya mlima.
- source_word: הָהָר
  choice: mlima
  rationale: Katika muktadha wa Sinai, הַר ni “mlima,” na mlima maalumu unaotajwa tayari unaeleweka kutokana na muktadha.
theological_decisions:
- issue: Tafsiri ya הָאֱלֹהִים katika kujidhihirisha kwa Mungu huko Sinai
  choice: Mungu
  alternative: yule Mungu
  rationale: “Mungu” ni Kiswahili cha kawaida kwa Mungu wa Israeli anayelengwa hapa. Kuongeza “yule” kungefanya usemi uwe na msisitizo au utofautishaji ambao si lazima katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia mtiririko wa simulizi wa “aka-” na lugha inayoeleweka kwa wasomaji wa kawaida; tanbihi imewekwa baada ya kirai inachokifafanua.
