id: EXO.19.6
reference: Exodus 19:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אַתֶּ֧ם תִּהְיוּ לִ֛/י מַמְלֶ֥כֶת כֹּהֲנִ֖ים וְ/ג֣וֹי קָד֑וֹשׁ אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר אֶל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/006.yaml
  text: And you shall be to me a kingdom of priests and a holy nation[b][a]. These are the words that you shall speak to the sons of Israel.
translation:
  language: sw
  text: Nanyi mtakuwa kwangu ufalme wa makuhani[a] na taifa takatifu. Haya ndiyo maneno utakayowaambia wana wa Israeli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ufalme wa kikuhani.” Usemi wa Kiebrania unaweza kumaanisha ufalme unaoundwa na makuhani au ufalme wenye tabia ya kikuhani. Linganisha 1 Petro 2:9, ambako kuna usemi unaohusiana, “ukuhani wa kifalme.”
    reason: lexical_alternative
  - marker: b
    text: “Wana wa Israeli” ni usemi wa Kiebrania unaomaanisha watu wa Israeli kwa ujumla, si wanaume pekee.
    reason: cultural_note
lexical_decisions:
- source_word: תִּהְיוּ
  choice: mtakuwa
  rationale: Kauli ya wakati ujao inaonyesha hali au matokeo ya agano kwa uzito, bila kuigeuza waziwazi kuwa amri.
- source_word: לִי
  choice: kwangu
  rationale: Inahifadhi uhusiano wa taifa hilo na Mungu pamoja na wazo la kuwa mali yake, bila kuongeza neno la umilikaji lisilo wazi katika muundo wa Kiebrania.
- source_word: מַמְלֶכֶת כֹּהֲנִים
  choice: ufalme wa makuhani
  rationale: Huu ndio uhamishaji wa moja kwa moja wa muundo wa nomino tegemezi; unadumisha neno ‘ufalme’ na pia utata wa iwapo ni ufalme unaoundwa na makuhani au wenye tabia ya kikuhani.
- source_word: גּוֹי קָדוֹשׁ
  choice: taifa takatifu
  rationale: Ni usemi wa kawaida na wenye hadhi unaohifadhi maana ya agano na uzito wa kitheolojia wa utakatifu.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Haya ndiyo maneno
  rationale: Katika muktadha wa maagizo kuhusu hotuba, דְּבָרִים humaanisha maneno; muundo huu ni wa kawaida katika Kiswahili.
- source_word: תְּדַבֵּר אֶל
  choice: utakayowaambia
  rationale: Kiswahili cha kawaida hutumia ‘kuwaambia’ kwa kusema maneno kwa watu fulani; maana ya agizo kwa Musa inadumishwa bila lugha ngumu ya tafsiri ya neno kwa neno.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi taswira ya kifamilia ya usemi wa Kiebrania. Tanbihi inafafanua kwamba katika muktadha huu unalihusu taifa lote, si wanaume peke yao.
theological_decisions:
- issue: Utambulisho wa pamoja wa Israeli katika wito wa agano
  choice: ufalme wa makuhani
  alternative: ufalme wa kikuhani
  rationale: Tafsiri hii inafuata muundo wa Kiebrania na kuacha wazi iwapo ufalme huo unaelezwa kuwa wa makuhani au kuwa na tabia ya kikuhani; haiingizi moja kwa moja usemi wa baadaye wa 1 Petro 2:9.
- issue: Jina la kifamilia lenye umbo la kiume kwa watu wa agano
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Chaguo hili linahifadhi umbo la kifamilia la המקור huku tanbihi ikieleza rejeo lake la kijamii kwa taifa zima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Nanyi’ huhifadhi msisitizo wa kiwakilishi cha Kiebrania; sentensi ya pili imetolewa kwa mtiririko wa kawaida wa Kiswahili.
source_grounding:
  english_pob_role: consult_only
