  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י בָּ֣א אֵלֶי/ךָ֮ בְּ/עַ֣ב הֶֽ/עָנָן֒ בַּ/עֲב֞וּר יִשְׁמַ֤ע הָ/עָם֙ בְּ/דַבְּרִ֣/י עִמָּ֔/ךְ וְ/גַם בְּ/ךָ֖ יַאֲמִ֣ינוּ לְ/עוֹלָ֑ם וַ/יַּגֵּ֥ד מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/009.yaml
  text: And Yahweh said to Moses[a], “Behold, I am coming to you in a thick cloud, so that the people may hear when I speak with you, and may also believe in you forever.” Then Moses told Yahweh the words of the people.
translation:
  language: sw
  text: Yahweh akamwambia Musa, “Tazama, ninakuja kwako katika wingu zito, ili watu wasikie ninaposema nawe, na pia wakuamini[a] milele.” Kisha Musa akamwambia Yahweh maneno ya watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakutumaini.” Kiebrania kinaweza kuonyesha kuwa watu watakuwa na imani kwa Musa akiwa msemaji wa Mungu aliyethibitishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linahifadhi nguvu ya kuvuta fikira na uzito wa usemi wa moja kwa moja kwa Kiswahili cha sasa.
- source_word: בָּא
  choice: ninakuja
  rationale: Umbo la kitenzi linaonyesha tendo lililo karibu kutokea kwa uhai wa wakati wa sasa.
- source_word: בְּעַב הֶעָנָן
  choice: katika wingu zito
  rationale: Ni usemi wa kawaida unaowasilisha picha ya wingu nene au lenye msongamano.
- source_word: בַּעֲבוּר
  choice: ili
  rationale: Hapa neno linaanzisha kusudi la kuja kwa Yahweh katika wingu.
- source_word: בְּדַבְּרִי עִמָּךְ
  choice: ninaposema nawe
  rationale: Linatoa maana ya wakati na kudumisha dhana ya Yahweh kusema pamoja na Musa.
- source_word: וְגַם בְּךָ יַאֲמִינוּ
  choice: na pia wakuamini
  rationale: Kiswahili hiki kinaweza kumaanisha kukubali maneno ya Musa na kumtumaini akiwa msemaji aliyethibitishwa na Mungu, bila kudokeza ibada kwake.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Linawasilisha muda unaoendelea bila kikomo kwa lugha fupi na ya kawaida.
- source_word: וַיַּגֵּד
  choice: akamweleza
  rationale: Linaendeleza simulizi na kueleza tendo la Musa kuripoti ujumbe kwa Yahweh.
- source_word: דִּבְרֵי הָעָם
  choice: maneno ya watu
  rationale: Linadumisha neno la msingi 'maneno' bila kulifafanua kupita kiasi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ina jina binafsi la Mungu, hivyo limetoholewa badala ya kubadilishwa na cheo kama ‘Bwana.’
- issue: Maana ya בְּךָ יַאֲמִינוּ kuhusu Musa
  choice: wakuamini
  alternative: wakutumaini
  rationale: Usemi unahusu watu kumkubali Musa kuwa msemaji wa Mungu mwenye uthibitisho. ‘Wakuamini’ huhifadhi uwezekano wa kuamini maneno yake au kumtumaini bila kuufanya usemi uwe dai la kumwabudu Musa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa simulizi wa ‘aka-’ umetumiwa kuendeleza matukio, huku usemi wa Mungu ukidumisha uzito wake.
