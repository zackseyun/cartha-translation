translation:
  language: sw
  text: 'Na matawi sita yalitoka[a] pande zake: matawi matatu ya kinara cha taa kutoka upande wake mmoja, na matawi matatu ya kinara cha taa kutoka upande wake wa pili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yakichomoza kutoka pande zake”; umbo la kitenzi cha Kiebrania linayaonyesha matawi sita yakitokea kuelekea nje ya kinara cha taa.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: matawi
  rationale: Katika muktadha wa kinara cha taa, neno hili linamaanisha sehemu zinazochomoza kama matawi, si matete halisi; “matawi” ni la kawaida na linaendeleza taswira ya Kiebrania.
- source_word: יֹצְאִים
  choice: yalitoka
  rationale: Kitenzi hiki kinaeleza matawi yakitokea au kuchomoza nje ya kinara. Wakati uliopita unafaa simulizi la utengenezaji, huku tanbihi ikihifadhi maana ya hali ya kuchomoza.
- source_word: מִצִּדֶּיהָ / מִצִּדָּהּ
  choice: katika pande zake / kutoka upande wake
  rationale: צד humaanisha upande. Tafsiri hii inahifadhi mtiririko kutoka wingi “pande zake” hadi ufafanuzi wa kila upande.
- source_word: מְנֹרָה
  choice: kinara cha taa
  rationale: Hili ni jina la kawaida la kifaa cha kushikilia taa katika hema takatifu; tafsiri inaeleweka kwa wasomaji wa Kiswahili kuliko kutumia neno la kuazima “menora.”
- source_word: הָאֶחָד
  choice: upande wake mmoja
  rationale: Huhifadhi uhusiano wa umilikaji na mgawanyo wa upande mmoja dhidi ya wa pili.
- source_word: הַשֵּׁנִי
  choice: upande wake wa pili
  rationale: “Wa pili” hufuata maana ya moja kwa moja ya Kiebrania na kudumisha ulinganifu wa pande mbili; “upande mwingine” pia ungewezekana kwa Kiswahili cha kawaida.
