  text: Pete hizo zilikuwa kando ya ukingo, zikiwa vishikio vya fito za kuibebea meza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֻמַּת הַמִּסְגֶּרֶת
  choice: kando ya ukingo
  rationale: לְעֻמַּת inaweza kuonyesha ukaribu au nafasi inayolingana na kitu; katika muktadha huu, “kando ya” ni ya asili na inaafikiana na mahali pa pete karibu na ukingo wa meza. הַמִּסְגֶּרֶת ni ukingo au fremu inayozunguka meza.
- source_word: בָּתִּים לַבַּדִּים
  choice: vishikio vya miti
  rationale: בָּתִּים kwa maana halisi ni ‘nyumba’ au ‘mahali pa kuingizia’; hapa ni sehemu zinazoshikilia miti. “Vishikio” huwasilisha kazi hiyo kwa Kiswahili cha kawaida.
- source_word: לָשֵׂאת אֶת־הַשֻּׁלְחָן
  choice: ya kulibebea meza
  rationale: 'Infinitivu לָשֵׂאת inaonyesha kusudi la miti: kuitumia kubeba meza. Kiambishi “-li-” kinarejelea kundi la nomino ‘meza’ katika Kiswahili sanifu.'
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na sentensi nyepesi kueleweka. ‘Miti’ imetumiwa badala ya ‘fito’ kwa uwazi wa kawaida, huku ‘ukingo’ ukiepuka neno la mkopo ‘fremu’.
