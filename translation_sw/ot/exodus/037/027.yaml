  text: And he made for it two rings of gold under its rim[a], on its two side frames, on its two sides[b], as holders for poles with which to carry it.
translation:
  language: sw
  text: Naye akaitengenezea pete mbili za dhahabu chini ya ukingo wake[a], kwenye vipande vyake viwili vya pembeni, kwenye pande zake mbili[b], kuwa vishikio vya miti ya kuibebea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chini ya pambo lake la ukingoni.” Neno la Kiebrania זֵר linamaanisha mpaka au ukingo wa mapambo uliozunguka sehemu ya juu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinarudia semi mbili zinazohusiana: “kwenye vipande vyake viwili vya pembeni, kwenye pande zake mbili.” Tafsiri imehifadhi zote mbili badala ya kuziunganisha kuwa usemi mmoja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁתֵּי טַבְּעֹת זָהָב
  choice: Naye ... pete mbili za dhahabu
  rationale: Kiunganishi kinaendeleza simulizi, na טַבְּעֹת hapa ni pete za chuma zilizowekwa kwenye samani takatifu kwa ajili ya kubebea.
- source_word: עָשָׂה ל֣/וֹ
  choice: akaitengenezea
  rationale: Kiambishi kinarejelea madhabahu katika muktadha; muundo huu wa Kiswahili unaonyesha kwamba pete zilitengenezwa kwa ajili yake.
- source_word: מִ/תַּ֣חַת לְ/זֵר֗/וֹ
  choice: chini ya ukingo wake
  rationale: זֵר katika maelezo ya vifaa vya hema takatifu ni mpaka au pambo linalozunguka sehemu ya juu; ‘ukingo’ ni wazi na wa kawaida.
- source_word: עַ֚ל שְׁתֵּ֣י צַלְעֹתָ֔י/ו
  choice: kwenye vipande vyake viwili vya pembeni
  rationale: צלע inaweza kumaanisha ubavu, upande, au kipande cha pembeni. Hapa inaelekea kutaja sehemu za kimuundo, huku ikitofautishwa na neno la kawaida la ‘pande’ linalofuata.
- source_word: עַ֖ל שְׁנֵ֣י צִדָּ֑י/ו
  choice: kwenye pande zake mbili
  rationale: צד ni neno la kawaida la upande. Kurudia kishazi hiki kunahifadhi msisitizo na muundo wa Kiebrania.
- source_word: לְ/בָתִּ֣ים לְ/בַדִּ֔ים
  choice: kuwa mahali pa kuingiza miti
  rationale: Ingawa בָּתִּים kwa kawaida ni ‘nyumba,’ hapa humaanisha nafasi au vishikio vinavyopokea miti. Usemi huu ni wa asili na unaeleweka kwa urahisi katika Kiswahili.
- source_word: לָ/שֵׂ֥את אֹת֖/וֹ בָּ/הֶֽם
  choice: ya kuibebea
  rationale: Kitenzi-jina kinaonyesha kusudi, na kiambishi cha Kiswahili kinaweka wazi kwamba madhabahu ingebebwa kwa miti hiyo.
