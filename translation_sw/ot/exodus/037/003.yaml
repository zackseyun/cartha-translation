translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Muundo wa sentensi ni wa kawaida kwa msomaji wa kisasa, huku tendo la kusubu na utata wa פַּעֲמֹתָיו vikihifadhiwa.
