translation:
  language: sw
  text: 'Akaisubu pete nne za dhahabu kwa ajili yake, kwenye miguu yake minne[a]: pete mbili upande mmoja na pete mbili upande mwingine.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye pembe zake nne” au “kwenye vitegemezo vyake vinne”; neno la Kiebrania linaweza kumaanisha miguu au sehemu za chini zinazotegemeza kitu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Akaitengenezea ... kwa kuzisubu
  rationale: Katika muktadha wa kutengeneza vitu vya chuma, יצק humaanisha kutengeneza kwa kumimina madini yaliyoyeyushwa katika kalibu. Kiswahili ‘kwa kuzisubu’ kinaeleza tendo hilo kwa usahihi na kwa lugha ya kawaida.
- source_word: לוֹ
  choice: -itengenezea
  rationale: Kiambishi ‘-i-’ kinarejelea sanduku lililotajwa katika muktadha, na ‘-tengenezea’ huwasilisha maana ya kumtengenezea/kukitengenezea kitu.
- source_word: טַבְּעֹת זָהָב
  choice: pete nne za dhahabu
  rationale: ‘Pete za dhahabu’ ni mpangilio wa kawaida wa Kiswahili na huhifadhi maana ya muundo wa Kiebrania.
- source_word: פַּעֲמֹתָיו
  choice: miguu yake minne
  rationale: Nomino hii inaweza kumaanisha miguu au sehemu za chini zinazotegemeza kitu. ‘Miguu’ ndiyo tafsiri ya moja kwa moja na inafaa kwa samani hii, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: צַלְעוֹ
  choice: upande
  rationale: Katika maelezo ya vitu, צלע humaanisha upande; ‘upande’ ni neno la kawaida na lililo wazi katika Kiswahili.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: upande mmoja ... upande mwingine
  rationale: Kiebrania kinasema kihalisi ‘upande mmoja ... upande wa pili.’ Muundo huu wa Kiswahili ni wa asili na unaonyesha wazi kuwa pete mbili zilikuwa kila upande.
