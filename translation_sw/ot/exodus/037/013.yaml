translation:
  language: sw
  text: Akaitengenezea pete nne za dhahabu kwa kuzisubu, akaziweka pete hizo kwenye pembe nne za miguu yake minne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye pembe zake nne, penye miguu yake minne.”
    reason: Muundo wa Kiebrania unaweza kueleweka kuwa pembe hizo zilikuwa za miguu minne au zilikuwa penye miguu hiyo.
lexical_decisions:
- source_word: וַיִּצֹק
  choice: akaitengenezea ... kwa kuzisubu
  rationale: Kitenzi ‘kusubu’ kinaonyesha utengenezaji wa pete kwa kumimina metali iliyoyeyushwa, si kumimina kwa maana ya kawaida.
- source_word: לוֹ
  choice: akaitengenezea
  rationale: Kiambishi ‘-i-’ kinarejelea meza iliyotajwa katika muktadha na ‘-ea’ kinaonyesha kuwa pete zilitengenezwa kwa ajili yake.
- source_word: טַבְּעֹת
  choice: pete
  rationale: ‘Pete’ ni neno la kawaida na linalofaa kwa vitanzi vya metali ambavyo miti ya kubebea iliingizwa ndani yake.
- source_word: זָהָב
  choice: dhahabu
  rationale: Hili ni jina la moja kwa moja la metali iliyotajwa.
- source_word: וַיִּתֵּן
  choice: akaziweka
  rationale: ‘Kuweka’ linaeleza kwa lugha ya kawaida tendo la kuzipachika au kuziweka pete mahali pake.
- source_word: עַל אַרְבַּע הַפֵּאֹת
  choice: juu ya pembe zake nne
  rationale: ‘Pembe’ linafaa kwa ncha nne za meza, na ‘juu ya’ linadumisha uhusiano wa mahali unaoonyeshwa na עַל.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: penye miguu yake minne
  rationale: Tafsiri hii inaonyesha mahali pembe zilipohusiana na miguu minne ya meza bila kuamua kwa nguvu kwamba pembe hizo zilikuwa sehemu ya miguu.
