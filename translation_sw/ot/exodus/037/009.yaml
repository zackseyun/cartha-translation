base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/009.yaml
  text: The cherubim had their wings spread upward[a], overshadowing the mercy seat with their wings, and their faces were toward one another; the faces of the cherubim were toward the mercy seat.
translation:
  language: sw
  text: Makerubi walikuwa wametandaza mabawa yao kuelekea juu, wakikisitiri kiti cha rehema[a] kwa mabawa yao. Nyuso zao zilielekeana; nyuso za makerubi zilielekea kiti cha rehema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uhalisi zaidi, “kifuniko” au “kifuniko cha upatanisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: Makerubi
  rationale: Neno lililohamishwa kutoka Kiebrania na lililozoeleka katika Kiswahili cha Biblia kwa viumbe hawa wa mbinguni; linahifadhi wingi wa neno la chanzo.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: walikuwa wametandaza mabawa yao kuelekea juu
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha hali ya mabawa yaliyonyoshwa na mwelekeo wake kwenda juu.
- source_word: סֹכְכִים
  choice: wakikisitiri
  rationale: Kitenzi kinaeleza kufunika au kukinga kutoka juu; ‘kusitiri’ linafaa kwa picha ya mabawa yaliyotanda juu ya kifuniko bila kudai kwamba kilifichwa kabisa.
- source_word: הַכַּפֹּרֶת
  choice: kiti cha rehema
  rationale: Ni istilahi iliyozoeleka katika Kiswahili cha Biblia kwa kifuniko maalumu cha sanduku. Maana halisi zaidi ya ‘kifuniko’ imewekwa katika tanbihi ili kudumisha uwazi wa kileksia.
- source_word: בְּכַנְפֵיהֶם
  choice: kwa mabawa yao
  rationale: 'Herufi ב inaonyesha chombo au njia iliyotumiwa: makerubi walikisitiri kiti hicho kwa kutumia mabawa yao.'
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: Nyuso zao zilielekeana
  rationale: Hii ni tafsiri ya asili ya nahau ya Kiebrania ‘kila mmoja kumwelekea mwenzake,’ ikihifadhi uelekeano wa pande mbili.
- source_word: אֶל הַכַּפֹּרֶת הָיוּ פְּנֵי הַכְּרֻבִים
  choice: nyuso za makerubi zilielekea kiti cha rehema
  rationale: Inadumisha msisitizo wa Kiebrania juu ya nyuso na kurudia wazi kitu ambacho walikielekea.
theological_decisions:
- issue: Tafsiri ya הַכַּפֹּרֶת katika muktadha wa hema takatifu
  choice: kiti cha rehema
  alternative: kifuniko; kifuniko cha upatanisho
  rationale: ‘Kiti cha rehema’ ni istilahi ya kimapokeo inayoeleweka kwa kifuniko maalumu cha sanduku, lakini neno la Kiebrania linaweza kutafsiriwa kihalisi zaidi kuwa ‘kifuniko.’ Tanbihi inahifadhi uwezekano huo bila kulazimisha ufafanuzi mmoja wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya ‘kiti cha rehema,’ ambako mbadala wake wa kileksia unahusika.
