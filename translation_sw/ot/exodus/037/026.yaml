  text: וַ/יְצַ֨ף אֹת֜/וֹ זָהָ֣ב טָה֗וֹר אֶת גַּגּ֧/וֹ וְ/אֶת קִירֹתָ֛י/ו סָבִ֖יב וְ/אֶת קַרְנֹתָ֑י/ו וַ/יַּ֥עַשׂ ל֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/026.yaml
  text: He overlaid it with pure gold—its top[a], its sides all around, and its horns—and he made for it a gold molding all around.
translation:
  language: sw
  text: Akaifunika kwa dhahabu safi—sehemu yake ya juu, kuta zake pande zote, na pembe zake—kisha akaitengenezea ukingo wa dhahabu kuizunguka pande zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taji ya dhahabu kuizunguka pande zote.” Neno la Kiebrania linamaanisha ukingo au utepe wa mapambo uliozunguka kifaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: akaifunika
  rationale: Katika muktadha wa utengenezaji wa vifaa vya hema, kitenzi hiki kinaonyesha kufunika kitu cha mbao kwa tabaka la chuma. ‘Akaifunika’ ni lugha ya kawaida na inaeleweka bila kuongeza ufafanuzi usiotajwa moja kwa moja.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Hili ndilo neno la kawaida la Kiswahili linaloonyesha ubora na usafi wa dhahabu.
- source_word: גַּגּוֹ
  choice: sehemu yake ya juu
  rationale: Ingawa neno la Kiebrania mara nyingi humaanisha ‘paa,’ hapa linarejelea uso wa juu wa kifaa kidogo, si paa la jengo.
- source_word: קִירֹתָיו
  choice: kuta zake
  rationale: ‘Kuta’ huhifadhi picha halisi ya nyuso zake zilizosimama na ni neno linaloeleweka katika maelezo ya kifaa hiki.
- source_word: סָבִיב
  choice: pande zote / kuizunguka pande zote
  rationale: Kauli hizi za kawaida zinaonyesha wazi kwamba kufunikwa au ukingo kulienea kuzunguka kitu chote.
- source_word: קַרְנֹתָיו
  choice: pembe zake
  rationale: ‘Pembe’ huhifadhi istilahi ya vifaa vya madhabahu na umbo la sehemu zilizochomoza kwenye kona zake.
- source_word: זֵר
  choice: ukingo
  rationale: Neno hili linamaanisha mpaka au utepe wa mapambo unaozunguka kifaa. ‘Ukingo’ ni wa asili na wazi kwa wasomaji wa Kiswahili; tafsiri ya jadi ‘taji’ imehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Maandiko. Viambishi vya ngeli vinalirejelea kifaa kilichotajwa katika muktadha uliotangulia. Alama ya tanbihi imewekwa baada ya kirai kinachotafsiri זֵר, kwa kuwa hiyo ndiyo tofauti ya kileksika inayofafanuliwa.
