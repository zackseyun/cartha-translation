revisions:
- from: Vikombe vitatu vilivyotengenezwa kwa mfano wa maua ya mlozi vilikuwa kwenye tawi moja[a], pamoja na fundo na ua; na vikombe vitatu vilivyotengenezwa kwa mfano wa maua ya mlozi vilikuwa kwenye tawi jingine, pamoja na fundo na ua[b]. Ndivyo ilivyokuwa kwa matawi yote sita yaliyotoka kwenye kinara cha taa.
  to: Kila tawi lilikuwa na vikombe vitatu vilivyoundwa kama maua ya mlozi[a], pamoja na kinundu[b] na ua; ndivyo ilivyokuwa kwa matawi yote sita yaliyotoka kwenye kinara cha taa.
  rationale: Marekebisho yanaondoa nyongeza ya “jingine,” yanaweka wazi usambazaji wa mpangilio kwa kila tawi kama sentensi ya mwisho inavyothibitisha, na yanatumia msamiati wa Kiswahili ulio wazi zaidi kwa maumbo ya mapambo. Maana na marudio ya msingi ya maandishi ya Kiebrania yamehifadhiwa.
