base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/019.yaml
  text: Three almond-blossom-shaped cups were on the one branch[a], with bulb and flower; and three almond-blossom-shaped cups were on one branch, with bulb and flower[b]. So it was for the six branches coming out from the lampstand.
translation:
  language: sw
  text: Kila tawi lilikuwa na vikombe vitatu vilivyoundwa kama maua ya mlozi[a], pamoja na kinundu[b] na ua; ndivyo ilivyokuwa kwa matawi yote sita yaliyotoka kwenye kinara cha taa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vikombe vitatu vya mfano wa maua ya mlozi.”
    reason: lexical_alternative
  - marker: b
    text: “Kinundu” kinaweza pia kutafsiriwa “fundo,” likimaanisha pambo la mviringo kwenye kinara cha taa.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: vikombe
  rationale: Neno hili linaeleza mapambo yenye umbo la kikombe kwenye kinara; “vikombe” ni la kawaida na linaeleweka bila kutumia istilahi ya kitaalamu.
- source_word: מְשֻׁקָּדִים
  choice: vilivyotengenezwa kwa mfano wa maua ya mlozi
  rationale: Katika maelezo ya kinara, neno hili linaonyesha mapambo yaliyoigwa kutokana na maua ya mlozi; tafsiri hii inaweka wazi taswira ya mimea.
- source_word: קָנֶה
  choice: tawi
  rationale: Katika muktadha wa kinara, neno hili linamaanisha mkono unaochomoza kutoka sehemu yake ya kati; “tawi” huhifadhi taswira hiyo kwa Kiswahili cha kawaida.
- source_word: כַּפְתֹּר
  choice: fundo
  rationale: Neno hili linataja pambo la mviringo au lililovimba. “Fundo” linafaa kwa umbo hilo huku uwezekano wa “kinundu” ukibainishwa katika tanbihi.
- source_word: פֶרַח
  choice: ua
  rationale: Neno hili linamaanisha pambo la ua; “ua” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: כֵּן
  choice: Ndivyo ilivyokuwa
  rationale: Kauli hii inajumlisha kwamba mpangilio uliotajwa ulirudiwa kwa matawi yote sita.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: yaliyotoka kwenye kinara cha taa
  rationale: Inahifadhi picha ya matawi yakichomoza kutoka katika kinara huku ikitumia Kiswahili cha kawaida.
- source_word: מְנֹרָה
  choice: kinara cha taa
  rationale: Jina la kifaa limetafsiriwa badala ya kunukuliwa ili maana yake ieleweke mara moja.
