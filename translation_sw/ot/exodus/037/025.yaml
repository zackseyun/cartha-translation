  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הַ/קְּטֹ֖רֶת עֲצֵ֣י שִׁטִּ֑ים אַמָּ֣ה אָרְכּ/וֹ֩ וְ/אַמָּ֨ה רָחְבּ֜/וֹ רָב֗וּעַ וְ/אַמָּתַ֨יִם֙ קֹֽמָת֔/וֹ מִמֶּ֖/נּוּ הָי֥וּ קַרְנֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/025.yaml
  text: He made the altar of incense of acacia wood. Its length was one cubit[a], and its width one cubit—it was square—and its height was two cubits. Its horns were of one piece with it.
translation:
  language: sw
  text: Akatengeneza madhabahu ya kufukizia uvumba kwa mbao za mshita. Urefu wake ulikuwa dhiraa moja, na upana wake dhiraa moja—ulikuwa mraba—na kimo chake kilikuwa dhiraa mbili. Pembe zake zilikuwa za kipande kimoja na madhabahu hiyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Kitenzi cha masimulizi kinaonyesha tendo la wakati uliopita na mwendelezo wa simulizi; Kiswahili cha kawaida kinaweza kuonyesha mwendelezo huo kwa kiambishi “ka-” bila kuongeza “na” mwanzoni.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: madhabahu ya kufukizia uvumba
  rationale: Muundo huu unaeleza madhabahu iliyotumiwa kufukizia uvumba. Tafsiri hii ni ya asili na wazi katika Kiswahili huku ikihifadhi kazi yake ya ibada.
- source_word: עֲצֵי שִׁטִּים
  choice: kwa mbao za mshita
  rationale: “Mshita” ni jina linalotambulika katika Kiswahili kwa aina ya mti unaoitwa acacia; “mbao” inaonyesha wazi nyenzo ya kutengenezea.
- source_word: אַמָּה
  choice: dhiraa
  rationale: Inahifadhi kipimo cha kale badala ya kukibadili kuwa kipimo cha kisasa na hivyo kuepuka usahihi wa kukadiria usiokuwamo katika matini.
- source_word: אָרְכּוֹ ... רָחְבּוֹ
  choice: Urefu wake ... upana wake
  rationale: Viambishi vya umilikaji vinarejelea madhabahu; muundo huu ni wa kawaida na wazi katika kueleza vipimo kwa Kiswahili.
- source_word: רָבוּעַ
  choice: ulikuwa mraba
  rationale: Kivumishi hiki kinaeleza umbo la madhabahu; kishazi kamili ni cha asili katika Kiswahili na kinadumisha maana.
- source_word: וְאַמָּתַיִם קֹמָתוֹ
  choice: na kimo chake kilikuwa dhiraa mbili
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi taarifa kamili ya kipimo.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: Pembe zake zilikuwa kitu kimoja nayo
  rationale: Kirai kinaonyesha kwamba pembe hizo zilitokana na madhabahu yenyewe na hazikuunganishwa baadaye; usemi huu unaeleza ujenzi huo kwa Kiswahili kinachoeleweka.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Uvumba,” “madhabahu,” “dhiraa,” na “pembe” huhifadhi msamiati wa ibada na vipimo vya kale unaoeleweka kwa wasomaji wa Biblia. Hakuna tanbihi iliyowekwa kwa sababu tanbihi ya Kiingereza kuhusu “the incense altar” ni mbadala wa kimtindo usiohitajika katika Kiswahili.
