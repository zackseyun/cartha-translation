  text: Akatengeneza fito za mti wa mshita, akazifunika kwa dhahabu, kwa ajili ya kuibeba meza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Kitenzi hiki kinaendeleza mfuatano wa matendo katika simulizi; kiambishi “aka-” huwasilisha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: הַבַּדִּים
  choice: miti ya kubebea
  rationale: Neno hili linamaanisha fito au miti iliyotumiwa kubebea samani takatifu. “Miti ya kubebea” ni wazi na ya kawaida katika muktadha huu.
- source_word: עֲצֵי שִׁטִּים
  choice: kwa mbao za mshita
  rationale: Kirai hiki hutaja nyenzo iliyotumiwa; “mbao za mshita” ni tafsiri ya kawaida na inayoeleweka ya aina hii ya mbao.
- source_word: וַיְצַף אֹתָם זָהָב
  choice: akaifunika kwa dhahabu
  rationale: Katika muktadha wa ufundi, צפה humaanisha kufunika kitu kwa tabaka la metali. Kiwakilishi cha Kiswahili kinarejelea kwa pamoja nomino ya ngeli ya miti.
- source_word: לָשֵׂאת
  choice: ili kubebea
  rationale: Kitenzi-jina hiki huonyesha kusudi la miti hiyo; “ili kubebea” huwasilisha wazi kazi yake.
- source_word: הַשֻּׁלְחָן
  choice: meza
  rationale: Hii ni tafsiri ya moja kwa moja ya שֻׁלְחָן. Muktadha unaonyesha kuwa ni meza ya maskani, lakini chanzo chenyewe kinasema tu “meza.”
