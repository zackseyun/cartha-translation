translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mfuatano wa Kiebrania bila kuwa ngumu; hakuna tanbihi iliyowekwa kwa sababu ‘ukingo’ huwasilisha זֵר kwa uwazi katika muktadha huu, na tanbihi ya Kiingereza yenye alama [a] inaonekana kutolingana na mahali ilipowekwa katika matini yake.
