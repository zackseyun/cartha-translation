  text: Akaifunika kwa dhahabu safi, akaitengenezea ukingo wa dhahabu[a] pande zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ukanda wa mapambo wa dhahabu; kijadi, “taji” la dhahabu.
    reason: Mbadala wa kileksia kwa זֵר; tanbihi imewekwa kwenye “ukingo,” neno linalohusika.
lexical_decisions:
- source_word: וַיְצַף
  choice: akaifunika
  rationale: Katika muktadha wa kutengeneza samani za Maskani, kitenzi hiki humaanisha kufunika kitu kwa tabaka la metali. ‘Akaifunika’ ni Kiswahili cha kawaida na wazi; dhahabu inayotajwa inaonyesha kuwa si kufunika kwa kawaida bali kwa dhahabu.
- source_word: אֹתוֹ
  choice: -i-
  rationale: Kiwakilishi cha yambwa kinarejelea meza ya mstari uliotangulia; kwa kuwa ‘meza’ iko katika ngeli ya I-ZI, kiambishi ‘-i-’ kinafaa.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya dhahabu yenye usafi wa hali ya juu.
- source_word: וַיַּעַשׂ לוֹ
  choice: akaitengenezea
  rationale: Kauli ya kutendea ‘-tengenezea’ inahifadhi maana ya לֹו, yaani alitengeneza ukingo kwa ajili ya meza hiyo.
- source_word: זֵר
  choice: ukingo
  rationale: Katika muktadha huu neno linaashiria sehemu iliyoinuka au pambo linalozunguka meza. ‘Ukingo’ ni neno la kawaida linaloeleweka na halileti picha isiyofaa ya taji la kuvaliwa.
- source_word: זָהָב
  choice: dhahabu
  rationale: Jina la nyenzo limetafsiriwa moja kwa moja.
- source_word: סָבִיב
  choice: kuizunguka pande zote
  rationale: Usemi huu unaonyesha kwamba ukingo uliizunguka meza kwa ukamilifu.
