  text: He made the mercy seat of pure gold; its length was two and a half cubits[a], and its width a cubit and a half.
translation:
  language: sw
  text: Akatengeneza kifuniko cha upatanisho[a] cha dhahabu safi; urefu wake ulikuwa dhiraa mbili na nusu, na upana wake dhiraa moja na nusu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiti cha rehema.” Neno la Kiebrania linataja kifuniko cha dhahabu cha sanduku na linahusishwa na upatanisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Kitenzi hiki kinaendeleza mfululizo wa masimulizi ya wakati uliopita; “akatengeneza” ni ya kawaida na hudumisha mwendelezo huo.
- source_word: כַּפֹּרֶת
  choice: kifuniko cha upatanisho
  rationale: Neno hili linataja kifuniko cha dhahabu cha sanduku, ambacho kilihusishwa hasa na tendo la upatanisho. Tafsiri hii inaeleza umbo na kazi yake ya ibada bila kuficha uhusiano wake wa kitheolojia.
- source_word: זָהָב טָהוֹר
  choice: kwa dhahabu safi
  rationale: Hueleza kwa Kiswahili cha kawaida kitu kilichotumiwa kukitengeneza.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dhiraa mbili na nusu
  rationale: Hudumisha kipimo cha kale na idadi ya Kiebrania kwa mtindo wa kawaida wa Kiswahili.
- source_word: אָרְכָּהּ
  choice: urefu wake ulikuwa
  rationale: Kiwakilishi kinarejelea kifuniko; “ulikuwa” hukamilisha kishazi cha kipimo kwa Kiswahili cha kawaida.
- source_word: וְאַמָּה וָחֵצִי
  choice: na ... dhiraa moja na nusu
  rationale: Ni usemi wa kawaida wa Kiswahili unaowakilisha kwa usahihi dhiraa moja pamoja na nusu.
- source_word: רָחְבָּהּ
  choice: upana wake
  rationale: Ni neno la kawaida na wazi la kutaja kipimo kutoka upande mmoja hadi mwingine.
theological_decisions:
- issue: Tafsiri ya כַּפֹּרֶת katika muktadha wa ibada
  choice: kifuniko cha upatanisho
  alternative: kiti cha rehema
  rationale: Neno la Kiebrania linataja kifuniko cha sanduku na pia lina uhusiano wa wazi na upatanisho. “Kifuniko cha upatanisho” hudumisha mambo hayo yote mawili; tafsiri ya jadi “kiti cha rehema” imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Dhiraa” imehifadhiwa kama kipimo cha kale cha kibiblia.
