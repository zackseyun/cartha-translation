  text: one cherub from one end on this side[a], and one cherub from one end on that side; from the mercy seat he made the cherubim on its two ends.
translation:
  language: sw
  text: Kerubi mmoja kwenye ncha hii, na kerubi mmoja kwenye ncha ile; aliwafanya kerubi hao kutoka katika kifuniko cha upatanisho[a], kwenye ncha zake mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kifuniko,” au “kiti cha rehema”; Kiebrania kapporet, yaani kifuniko cha dhahabu cha Sanduku la Agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרוּב
  choice: kerubi
  rationale: Neno hili linahifadhi jina la kiumbe maalumu chenye mabawa kilichohusishwa na uwepo wa Mungu na Sanduku la Agano, bila kukifafanua kwa njia ya kubahatisha.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: kwenye ncha moja upande huu ... kwenye ncha nyingine upande ule
  rationale: Tafsiri hii inaonyesha wazi ncha mbili zilizoelekeana na inasikika kwa kawaida katika Kiswahili.
- source_word: הַכַּפֹּרֶת
  choice: kifuniko cha upatanisho
  rationale: Hili ni neno maalumu kwa kifuniko cha dhahabu cha Sanduku la Agano, chenye umuhimu wa kiibada unaohusiana na upatanisho. Tafsiri hii inaonyesha kwamba ni kifuniko na pia inadumisha maana yake ya kiibada.
- source_word: עָשָׂה
  choice: alizifanya
  rationale: Kitenzi cha kawaida 'kufanya' kinatosha hapa; kiambishi cha ngeli kinaelekezwa kwa kerubi hao wawili.
- source_word: מִשְּׁנֵי קְצוֹתָיו
  choice: kwenye ncha zake mbili
  rationale: Kirai kinaonyesha mahali kerubi hao walipokuwa kuhusiana na kifuniko, huku 'kutokana na kifuniko' kikihifadhi wazo kwamba walifanywa wakiwa sehemu yake.
theological_decisions:
- issue: Tafsiri ya הַכַּפֹּרֶת katika muktadha wa Sanduku la Agano
  choice: kifuniko cha upatanisho
  alternative: kifuniko; kiti cha rehema
  rationale: Neno la Kiebrania linamaanisha kifuniko cha Sanduku chenye kazi ya kiibada. 'Kifuniko cha upatanisho' kinadumisha kwa pamoja kitu halisi na uhusiano wake na upatanisho, huku tanbihi ikihifadhi tafsiri nyingine zinazowezekana bila kulazimisha ufafanuzi mmoja wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umegawanywa katika sentensi mbili ili kuepuka uzito wa kisintaksia, bila kupoteza uhusiano wa kerubi hao na kifuniko.
