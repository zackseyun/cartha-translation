  text: He overlaid it with pure gold[a], inside and outside, and made for it a surrounding border of gold.
translation:
  language: sw
  text: Akaipandisha dhahabu safi ndani na nje, akaitengenezea ukingo wa dhahabu kuizunguka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukingo wa mapambo wa dhahabu unaoizunguka” au “moldingi wa dhahabu kuizunguka.” Neno la Kiebrania זֵר linamaanisha ukingo wa mapambo unaozunguka kitu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַפֵּהוּ
  choice: Akaifunika
  rationale: Kauli ya piel ya צפה hapa inaonyesha kufunika kitu kwa tabaka la metali. “Akaifunika kwa dhahabu” ni Kiswahili cha kawaida na wazi katika muktadha wa ufundi.
- source_word: זָהָב טָהוֹר
  choice: kwa dhahabu safi
  rationale: Kirai hiki humaanisha dhahabu isiyo na uchafu; “dhahabu safi” ni tafsiri ya kawaida na inayoeleweka.
- source_word: מִבַּיִת וּמִחוּץ
  choice: ndani na nje
  rationale: Maneno haya yanatofautisha sehemu ya ndani na ya nje kwa ufupi na kwa Kiswahili cha asili.
- source_word: וַיַּעַשׂ לוֹ
  choice: na akaifanyia
  rationale: Kiambishi cha mtendewa katika “akaifanyia” kinahifadhi maana ya לֹו, yaani alitengeneza ukingo kwa ajili ya sanduku.
- source_word: זֵר זָהָב
  choice: ukingo wa dhahabu
  rationale: זֵר katika samani za maskani ni ukingo wa mapambo unaozunguka kitu. “Ukingo” ni neno la kawaida lisiloingiza wazo la taji la kifalme.
- source_word: סָבִיב
  choice: kuizunguka
  rationale: Usemi huu unaonyesha kwamba ukingo uliizunguka pande zote.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. Muundo wa vitenzi mfululizo unaendeleza simulizi la ufundi, huku “akaifanyia” ikihifadhi uhusiano wa kisarufi wa Kiebrania.
