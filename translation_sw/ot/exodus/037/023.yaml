  text: He made its seven lamps[a], its tongs[b], and its firepans of pure gold.
translation:
  language: sw
  text: Akatengeneza taa zake saba, makoleo yake[a], na vyombo vyake vya kuwekea makaa[b] kwa dhahabu safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vikata tambi.” Neno la Kiebrania linamaanisha zana iliyotumiwa kushughulikia tambi za taa.
    reason: lexical_alternative
  - marker: b
    text: Au, “sinia zake” au “vyetezo vyake.” Katika muktadha huu, neno la Kiebrania huenda linamaanisha vyombo vidogo vinavyohusiana na utunzaji wa taa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Kitenzi cha masimulizi kutoka עשה kimetafsiriwa kwa wakati uliopita unaoendeleza mtiririko wa simulizi; kiunganishi וַ־ kimewakilishwa kwa umbo la Kiswahili 'aka-'.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: taa zake saba
  rationale: נֵרֹת ni taa, na kiambishi cha nafsi ya tatu kike umoja kinarejelea kinara cha taa kilichotajwa katika muktadha. Mpangilio wa nomino kisha idadi ni wa kawaida katika Kiswahili.
- source_word: מַלְקָחֶיהָ
  choice: koleo zake
  rationale: Neno hili hutaja zana ya kushika au kurekebisha tambi za taa. 'Koleo' ni tafsiri pana na inayoeleweka bila kufafanua kazi yake kupita ushahidi wa Kiebrania.
- source_word: מַחְתֹּתֶיהָ
  choice: vyombo vyake vya kuwekea makaa
  rationale: מַחְתּוֹת ni vyombo vidogo vya kupokea au kubebea makaa au mabaki yanayohusiana na taa. Tafsiri hii inadumisha maana halisi kuliko 'sinia' huku ikiepuka kudokeza bila lazima kwamba ni vyetezo.
- source_word: זָהָב טָהוֹר
  choice: kwa dhahabu safi
  rationale: Kirai hiki kinaeleza nyenzo iliyotumiwa kutengeneza taa na vifaa vyake; 'kwa dhahabu safi' ni Kiswahili cha kawaida katika muktadha wa utengenezaji.
