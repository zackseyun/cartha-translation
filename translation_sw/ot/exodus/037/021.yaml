translation:
  language: sw
  text: Na kinundu chini ya matawi mawili yaliyotoka humo, na kinundu chini ya matawi mawili yaliyotoka humo, na kinundu chini ya matawi mawili yaliyotoka humo—kwa matawi yale sita yaliyotoka humo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: fundo
  rationale: Katika maelezo ya kinara, neno hili linataja pambo la mviringo. “Fundo” ni neno la kawaida la Kiswahili linaloweza kueleza umbo hilo bila kulifanya kuwa sehemu ya usanifu.
- source_word: תַּחַת
  choice: chini ya
  rationale: Huonyesha mahali pa fundo palipokuwa chini ya kila jozi ya matawi.
- source_word: שְׁנֵי הַקָּנִים
  choice: jozi ya matawi
  rationale: Ingawa muundo wa Kiebrania ni “matawi mawili,” “jozi ya matawi” huonyesha kwa uwazi mpangilio wa matawi mawili mawili katika Kiswahili cha kawaida.
- source_word: מִמֶּנָּה
  choice: yaliyotoka ndani yake
  rationale: Kiwakilishi cha kike cha umoja kinarejelea kinara; tafsiri hii huhifadhi kiwakilishi badala ya kurudia nomino.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: hivyo kwa yale matawi sita
  rationale: Kishazi hiki kinajumlisha mafundo matatu yaliyowekwa chini ya jozi tatu, yaani matawi yote sita.
- source_word: הַיֹּצְאִים מִמֶּנָּה
  choice: yaliyotoka ndani yake
  rationale: Hueleza matawi yakichomoza kutoka katika sehemu kuu ya kinara kwa lugha ya asili na inayoeleweka.
