base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/017.yaml
  text: He made the lampstand of pure gold[a]. He made the lampstand of hammered work; its base and its shaft, its cups, its buds[b], and its blossoms were of one piece with it.
translation:
  language: sw
  text: Alitengeneza kinara cha taa cha dhahabu safi. Alitengeneza kinara hicho kwa kukifua[a]; kitako chake na shina lake, vikombe vyake, matumba yake[b], na maua yake vyote vilikuwa kitu kimoja nacho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kilifanyizwa kwa kufua dhahabu kwa nyundo.
    reason: lexical_alternative
  - marker: b
    text: Au, “vifundo vyake.” Neno la Kiebrania linamaanisha mapambo yaliyojitokeza; “matumba” yametumiwa kwa sababu umbo la kinara linafanana na mmea.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרָה
  choice: kinara cha taa
  rationale: Neno hili linamaanisha kinara chenye matawi kinachoshikilia taa, wala si taa moja tu.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Katika maelezo ya vifaa, kivumishi טָהוֹר huonyesha usafi wa madini; ‘dhahabu safi’ ni Kiswahili cha kawaida na sahihi.
- source_word: מִקְשָׁה
  choice: kwa kufua
  rationale: Neno hili linaeleza utengenezaji wa chuma kwa kukipiga kwa nyundo ili umbo lote litokane na kipande kimoja.
- source_word: יְרֵכָהּ
  choice: tako lake
  rationale: Ingawa maana ya msingi inaweza kuwa ‘paja’ au ‘ubavu,’ hapa neno linataja sehemu ya chini inayokitegemeza kinara.
- source_word: קָנָהּ
  choice: shina lake
  rationale: Umoja hapa unataja sehemu kuu ya katikati; ‘shina’ pia linaendana na taswira ya mmea katika mapambo ya kinara.
- source_word: גְּבִיעֶיהָ
  choice: vikombe vyake
  rationale: Neno linataja mapambo yenye umbo la kikombe.
- source_word: כַּפְתֹּרֶיהָ
  choice: matumba yake
  rationale: Neno linataja mapambo yaliyojitokeza kama vifundo; ‘matumba’ yanahifadhi taswira ya mmea inayodhihirishwa na maua.
- source_word: פְרָחֶיהָ
  choice: maua yake
  rationale: Hili ni neno la kawaida na la moja kwa moja kwa mapambo yenye umbo la maua.
- source_word: מִמֶּנָּה הָיוּ
  choice: vilikuwa kitu kimoja nacho
  rationale: Kauli hii inaonyesha kwamba sehemu hizo ziliungana kabisa na kinara na hazikuwa vipande vilivyobandikwa baadaye.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Alitengeneza ... Alikitengeneza
  rationale: Kurudiwa kwa kitenzi עשה kumehifadhiwa huku kiwakilishi cha yambwa kikifanya sentensi ya pili iwe ya kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo unaorudia ‘alitengeneza’ umehifadhi mkazo wa Kiebrania, na istilahi za mapambo zimechaguliwa ili kudumisha taswira ya mmea bila kuficha uwezekano wa maana nyingine.
