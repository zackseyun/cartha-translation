  yaml_path: translation/ot/exodus/037/024.yaml
  text: He made it and all its utensils from a talent of pure gold[a].
translation:
  language: sw
  text: Aliitengeneza pamoja na vyombo vyake vyote[a] kwa talanta moja ya dhahabu safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vifaa vyake vyote” au “zana zake zote.” Neno la Kiebrania כֵּלִים lina maana pana ya vitu au vifaa vinavyohusiana na kinara cha taa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: talanta moja
  rationale: Katika muktadha wa ujenzi wa maskani, neno hili linamaanisha kipimo cha uzito kinachoitwa talanta. Neno “moja” linaonyesha umoja wa kipimo hicho.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Hii ni tafsiri ya kawaida na ya asili kwa dhahabu isiyo na uchafu, inayofaa katika muktadha wa utengenezaji.
- source_word: עָשָׂה
  choice: Aliitengeneza
  rationale: Kitenzi עשה kina maana pana ya kufanya au kutengeneza; hapa “kutengeneza” kinaeleza kwa kawaida kazi ya fundi. Kiambishi “-i-” kinarejelea kinara cha taa kilichotajwa katika muktadha uliotangulia.
- source_word: אֹתָהּ
  choice: -i- katika “Aliitengeneza”
  rationale: Kiwakilishi cha Kiebrania cha umoja wa kike kinarejelea kinara cha taa. Katika Kiswahili, rejeo hilo linaonyeshwa kiasili kwa kiambishi cha yambwa kinachopatana na nomino “kinara”.
- source_word: וְאֵת כָּל כֵּלֶיהָ
  choice: pamoja na vyombo vyake vyote
  rationale: כֵּלִים ni neno pana kwa vifaa, vyombo, au zana zinazohusiana na kitu. “Vyombo vyake vyote” ni usemi wa kawaida unaohifadhi upana wa maana; “pamoja na” huunganisha kwa uwazi kinara na vifaa vyake kama vitu vilivyotengenezwa kwa kiasi hicho cha dhahabu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio wa sentensi umefanywa wa kawaida katika Kiswahili huku ukihifadhi kwamba talanta moja ya dhahabu safi ilitumika kutengeneza kinara pamoja na vyombo vyake vyote.
