  text: וַ/יַּ֥עַשׂ אֶת הַ/שֻּׁלְחָ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֤יִם אָרְכּ/וֹ֙ וְ/אַמָּ֣ה רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/010.yaml
  text: He made the table of acacia wood; its length was two cubits[a], its width one cubit, and its height one and a half cubits.
translation:
  language: sw
  text: Akatengeneza meza kwa mbao za mshita. Urefu wake ulikuwa dhiraa mbili, upana wake dhiraa moja, na kimo chake dhiraa moja na nusu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Kitenzi עשה katika mfululizo wa simulizi kinaeleza tendo lililokamilika. “Akatengeneza” ni Kiswahili cha kawaida na kinafaa kwa kutengeneza chombo.
- source_word: הַשֻּׁלְחָן
  choice: meza
  rationale: Nomino hii humaanisha meza; umaalumu wake unaeleweka katika muktadha bila kuhitaji neno la ziada.
- source_word: עֲצֵי שִׁטִּים
  choice: mbao za mshita
  rationale: Kirai hiki kinataja nyenzo iliyotokana na mti wa mshita. “Mbao za mshita” ni wazi, cha asili, na kinaendana na muktadha wa ujenzi.
- source_word: אַמָּתַיִם
  choice: dhiraa mbili
  rationale: אַמָּה ni kipimo cha kale cha urefu, yaani dhiraa. Kuhifadhi kipimo hicho huepuka kutoa thamani ya kisasa isiyo hakika.
- source_word: אָרְכּוֹ
  choice: urefu wake
  rationale: Nomino yenye kiambishi cha nafsi ya tatu ya kiume inarejelea urefu wa meza.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: upana wake dhiraa moja
  rationale: Kirai hiki kinatoa kipimo cha upana. Kitenzi “ulikuwa” kutoka sehemu ya kwanza kinaeleweka pia hapa.
- source_word: וְאַמָּה וָחֵצִי
  choice: dhiraa moja na nusu
  rationale: Hii inahifadhi kwa usahihi thamani ya dhiraa moja na nusu kwa mpangilio wa kawaida wa Kiswahili.
- source_word: קֹמָתוֹ
  choice: kimo chake
  rationale: Katika maelezo ya kitu, קוֹמָה ni kipimo cha kwenda juu. “Kimo” ni neno la kawaida na linaloeleweka katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Sentensi mbili zimetumiwa ili maelezo ya utengenezaji na vipimo yasomeke kwa urahisi. Tanbihi ya Kiingereza haikuhifadhiwa kwa sababu dai lake (“dhiraa moja na nusu”) halilingani na neno אַמָּתַיִם (“dhiraa mbili”) lilipo alama hiyo; dhiraa moja na nusu katika Kiebrania ni kipimo cha kimo.
