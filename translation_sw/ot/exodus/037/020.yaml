translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mwisho wa sentensi umeachwa kuwa wa kiambatisho kwa kufuata msongamano wa Kiebrania, huku tanbihi ikitoa usomaji ulio wazi zaidi kwa “pamoja na.”
