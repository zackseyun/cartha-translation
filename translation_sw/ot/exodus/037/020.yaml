  text: And on the lampstand were four cups shaped like almond blossoms[a], its buds and its flowers.
translation:
  language: sw
  text: Na kwenye kinara cha taa palikuwa na vikombe vinne vyenye umbo la maua ya mlozi,[a] pamoja na vifundo vyake na maua yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vikombe vinne vya umbo la mlozi, pamoja na vifundo vyake na maua yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: Na kwenye kinara cha taa palikuwa na
  rationale: Kiunganishi na kihusishi vinaonyesha mahali. “Kwenye kinara cha taa” ni Kiswahili cha kawaida na kinaonyesha kuwa mapambo hayo yalikuwa sehemu ya kinara, si ndani yake.
- source_word: אַרְבָּעָה
  choice: vinne
  rationale: Ni namba ya kawaida inayopatana kisarufi na “vikombe.”
- source_word: גְבִעִים
  choice: vikombe
  rationale: Neno hilo linamaanisha mapambo yenye umbo la kikombe; “vikombe” ni sahihi na linaeleweka kwa urahisi katika maelezo ya kinara.
- source_word: מְשֻׁקָּדִים
  choice: vyenye umbo la maua ya mlozi
  rationale: Umbo la kisarufi linaeleza vikombe vilivyotengenezwa kwa mfano wa maua ya mlozi. Tafsiri hii inawasilisha wazi picha ya mapambo huku ikihifadhi uhusiano na mlozi.
- source_word: כַּפְתֹּרֶיהָ
  choice: vifundo vyake
  rationale: Katika maelezo ya kinara, neno hili linataja mapambo yaliyojitokeza kama vifundo. “Vifundo” huhifadhi umbo halisi bila kulazimisha maana ya machipukizi.
- source_word: וּפְרָחֶיהָ
  choice: na maua yake
  rationale: Neno linamaanisha maua au machanua; “maua” ni la kawaida, wazi, na linadumisha taswira ya mmea.
