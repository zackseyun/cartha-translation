  yaml_path: translation/ot/exodus/037/022.yaml
  text: Their buds and their branches were of one piece with it[c][b][a]; all of it was one hammered work of pure gold.
translation:
  language: sw
  text: Vifundo vyake na matawi yake yalitokana nacho; chote kilikuwa kazi moja iliyofuliwa kwa nyundo ya dhahabu safi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: mafundo yake
  rationale: Neno hilo linamaanisha mapambo ya mviringo katika kinara cha taa. “Mafundo” ni lugha ya kawaida na huhifadhi umbo la pambo bila kulazimisha taswira mahsusi ya kichipukizi.
- source_word: וּקְנֹתָם
  choice: na matawi yake
  rationale: Katika muktadha wa kinara cha taa, קָנֶה humaanisha mikono inayotokeza kama matawi; “matawi” ni tafsiri ya kawaida na inayoeleweka.
- source_word: מִמֶּנָּה הָיוּ
  choice: yalikuwa kitu kimoja nayo
  rationale: Kiebrania ni kihalisi “yalitokana nayo,” kikionyesha kuwa mapambo na matawi hayakuunganishwa baadaye bali yalitengenezwa pamoja na kinara kama kitu kimoja.
- source_word: כֻּלָּהּ
  choice: yote
  rationale: Kiwakilishi cha kike cha umoja kinarejelea kinara chote; Kiswahili hutumia “yote” kwa upatanisho na “kinara” kinachoeleweka katika muktadha.
- source_word: מִקְשָׁה אַחַת
  choice: kazi moja iliyofuliwa kwa nyundo
  rationale: מִקְשָׁה huonyesha kazi ya chuma iliyotengenezwa kwa kufuliwa au kupigwa kwa nyundo, na אַחַת husisitiza umoja wake.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Hii ni tafsiri sanifu na ya moja kwa moja ya maelezo ya nyenzo.
theological_decisions: []
