  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi inahifadhi msisitizo wa Kiebrania kwamba kinara na sehemu zake zilikuwa kazi moja iliyofuliwa, bila kuongeza maelezo ya kimadhehebu.
