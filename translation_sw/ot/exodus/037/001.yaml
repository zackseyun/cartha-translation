  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ בְּצַלְאֵ֛ל אֶת הָ/אָרֹ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/001.yaml
  text: Bezalel made the ark of acacia wood. Its length was two and a half cubits[a], its width one and a half cubits, and its height one and a half cubits.
translation:
  language: sw
  text: Bezaleli alitengeneza sanduku[a] kwa mbao za mshita. Urefu wake ulikuwa dhiraa mbili na nusu, upana wake dhiraa moja na nusu, na kimo chake dhiraa moja na nusu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Sanduku la Agano. Neno la Kiebrania linaweza kumaanisha sanduku kwa ujumla, lakini hapa linataja sanduku takatifu la maskani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: alitengeneza
  rationale: Kitenzi עשה ni neno la kawaida lenye maana ya kufanya au kutengeneza. Katika muktadha wa kutengeneza kitu, “alitengeneza” ni Kiswahili cha kawaida na hakiongezi wazo lisilokuwamo katika Kiebrania.
- source_word: בְּצַלְאֵל
  choice: Bezaleli
  rationale: Jina limetoholewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: הָאָרֹן
  choice: sanduku
  rationale: אָרוֹן linaweza kumaanisha sanduku au kisanduku; katika muktadha huu ni sanduku takatifu la maskani. “Sanduku” ni neno la asili na wazi katika Kiswahili, huku tanbihi ikieleza uwezekano wa kulitaja kama Sanduku la Agano.
- source_word: עֲצֵי שִׁטִּים
  choice: kwa mbao za mshita
  rationale: Muundo wa Kiebrania unataja nyenzo, yaani mbao za mti wa mshita. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dhiraa mbili na nusu
  rationale: Kipimo cha kale אַמָּה kimehifadhiwa kama “dhiraa” badala ya kubadilishwa kuwa kipimo cha kisasa; idadi imetolewa kwa mpangilio wa kawaida wa Kiswahili.
- source_word: אָרְכּוֹ
  choice: urefu wake
  rationale: Neno ארך pamoja na kiambishi cha nafsi linamaanisha urefu wa sanduku; “urefu wake” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וְאַמָּה וָחֵצִי
  choice: dhiraa moja na nusu
  rationale: Tafsiri hii huhifadhi kipimo cha kale na kutoa kiasi hicho kwa Kiswahili cha kawaida.
- source_word: רָחְבּוֹ
  choice: upana wake
  rationale: רחב hapa ni kipimo cha upande wa upana; “upana” ni neno la kawaida la Kiswahili.
- source_word: קֹמָתוֹ
  choice: kimo chake
  rationale: קומה hapa linamaanisha kipimo cha kwenda juu cha kitu. “Kimo chake” ni cha asili na sahihi katika Kiswahili.
theological_decisions:
- issue: Utambulisho wa הָאָרֹן kama sanduku maalumu la ibada
  choice: sanduku
  alternative: Sanduku la Agano
  rationale: Kiebrania cha aya hii kinasema tu “sanduku,” ingawa muktadha unatambulisha chombo hicho kitakatifu. Kutumia “sanduku” katika matini hakiongezi maneno yasiyokuwamo, na tanbihi hutoa jina la kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Vipimo vya kale vimehifadhiwa, na sentensi zimepangwa kwa mtiririko wa kawaida wa Kiswahili.
