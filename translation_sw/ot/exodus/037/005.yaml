translation:
  language: sw
  text: Akaingiza fito hizo katika pete zilizokuwa kwenye pande za sanduku, ili kulibeba sanduku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Akaingiza
  rationale: Ingawa kitenzi בוא kwa kawaida humaanisha ‘kuja/kuleta,’ hapa kinahusu kuweka miti ndani ya pete; ‘akaingiza’ linaeleza tendo hilo kwa Kiswahili cha kawaida na kwa usahihi.
- source_word: הַבַּדִּים
  choice: miti hiyo
  rationale: בַּדִּים ni fito au miti mirefu iliyotumiwa kubebea samani takatifu. ‘Miti’ ni neno la kawaida katika muktadha huu, na ‘hiyo’ hudumisha urejeo wa kitu kilichotajwa katika aya iliyotangulia.
- source_word: בַּטַּבָּעֹת
  choice: katika pete
  rationale: Kihusishi ב hapa huonyesha kwamba miti iliingizwa ndani ya pete; ‘katika pete’ ni usemi wa asili katika Kiswahili.
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: zilizokuwa kwenye pande za sanduku
  rationale: צלעות inaweza kumaanisha pande au sehemu za pembeni. ‘Pande’ ni tafsiri ya kawaida na sahihi katika maelezo ya ujenzi wa sanduku; kishazi ‘zilizokuwa’ kinaweka wazi kwamba pete ndizo zilikuwa pembeni bila kubadili maana.
- source_word: הָאָרֹן
  choice: sanduku
  rationale: אָרוֹן hapa ni sanduku takatifu la hema. ‘Sanduku’ ni neno la Kiswahili linaloeleweka na linalofaa kwa kifaa hiki; muktadha hutofautisha sanduku hili na sanduku la kawaida.
- source_word: לָשֵׂאת
  choice: ili kulibeba
  rationale: Kitenzi-jina cha נשא kinaonyesha kusudi. ‘Ili kulibeba’ kinaeleza wazi kwamba miti hiyo iliwekwa kwa kusudi la kubeba sanduku.
