  text: He made for it a frame a handbreadth wide all around[b][a], and he made a gold molding around its frame.
translation:
  language: sw
  text: Akaifanyia ukingo[a] wa upana wa kiganja kuizunguka pande zote, naye akatengeneza utepe wa dhahabu[b] kuzunguka ukingo huo pande zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fremu” au “mpaka” badala ya “ukingo.”
    reason: lexical_alternative
  - marker: b
    text: Kwa desturi, “taji la dhahabu”; hapa “utepe wa dhahabu” unaonyesha pambo la ukingo lililozunguka ukingo huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: ukingo
  rationale: Neno hili linaonyesha sehemu ya pembeni iliyozunguka meza. “Ukingo” ni Kiswahili cha kawaida na chenye kueleweka, huku tanbihi ikihifadhi uwezekano wa maana ya fremu au mpaka.
- source_word: טֹפַח
  choice: upana wa kiganja
  rationale: Ni kipimo kinacholingana na upana wa kiganja; kutaja “upana” kunaweka wazi uhusiano wa kipimo kwa Kiswahili cha kawaida.
- source_word: סָבִיב
  choice: kuizunguka pande zote
  rationale: Kauli hii inaonyesha kwamba ukingo na utepe vilizunguka kifaa hicho kwa pande zake zote.
- source_word: זֵר
  choice: utepe
  rationale: Katika maelezo ya vyombo vya hema takatifu, neno hili linaweza kumaanisha ukingo ulioinuka au pambo linalozunguka. “Utepe wa dhahabu” unaeleza kwa kawaida sehemu hiyo ya mapambo bila kuleta picha potovu ya taji la mfalme.
- source_word: זָהָב
  choice: dhahabu
  rationale: Imetafsiriwa kama nyenzo iliyotumiwa kutengeneza utepe.
- source_word: לְמִסְגַּרְתּוֹ
  choice: ukingo wake
  rationale: Kiambishi cha umilikaji kimehifadhiwa, na kitenzi “akautengenezea” kinaonyesha kuwa utepe huo ulihusiana na ukingo uliotajwa.
