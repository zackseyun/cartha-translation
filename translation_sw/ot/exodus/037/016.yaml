base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/016.yaml
  text: 'He made the utensils that were on the table: its plates[a], its cups, its pitchers, and its bowls with which the drink offering was poured out, of pure gold.'
translation:
  language: sw
  text: 'Akatengeneza vyombo vilivyokuwa juu ya meza: sahani zake[a], vikombe vyake, mitungi yake, na mabakuli yake ambayo sadaka ya kinywaji ilimiminwa kwa hayo, kwa dhahabu safi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “masahani yake, vibakuli vyake vidogo, vyombo vyake vya kumiminia, na mabakuli yake.” Majina kadhaa ya vyombo katika mstari huu ni adimu au hutegemea muktadha, kwa hiyo tafsiri zake kamili ni za kukadiria.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: vyombo
  rationale: Neno hili ni pana na humaanisha vifaa au vyombo; “vyombo” ni la kawaida na linafaa katika muktadha wa meza.
- source_word: אֲשֶׁר עַל הַשֻּׁלְחָן
  choice: vilivyokuwa juu ya meza
  rationale: Huhifadhi maana ya moja kwa moja ya Kiebrania, “vilivyokuwa juu ya meza,” bila kuongeza kazi ambayo haikutajwa wazi.
- source_word: קְעָרֹתָיו
  choice: sahani zake
  rationale: קְעָרָה humaanisha sahani au chombo kipana; “sahani” ni neno la sasa na linaloeleweka kwa urahisi.
- source_word: כַּפֹּתָיו
  choice: vikombe vyake
  rationale: Katika muktadha huu neno linataja vyombo vidogo; “vikombe” linaeleza aina hiyo ya chombo kwa lugha ya kawaida, ingawa utambulisho wake kamili hauna uhakika.
- source_word: מְנַקִּיֹּתָיו
  choice: mitungi yake
  rationale: Hili ni neno adimu linaloelekea kutaja vyombo vya kuhifadhia au kumiminia; “mitungi” ni la asili na halitumii istilahi ya kizamani.
- source_word: הַקְּשָׂוֹת
  choice: mabakuli yake
  rationale: Katika orodha hii neno linataja vyombo vingine vinavyohusishwa na kumimina sadaka ya kinywaji; “mabakuli” ni tafsiri inayoeleweka, huku tanbihi ikihifadhi kutokuwa na uhakika wa istilahi hizi.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: ambayo kwayo sadaka ya kinywaji ilimiminwa
  rationale: Muundo wa kutendwa wa נסך umehifadhiwa kwa “ilimiminwa”; “sadaka ya kinywaji” inaweka wazi maana ya kiibada inayodokezwa na kitenzi.
- source_word: זָהָב טָהוֹר
  choice: vyote kwa dhahabu safi
  rationale: Kauli hii inaonyesha kuwa vyombo vyote vilivyotajwa vilitengenezwa kwa dhahabu safi; “vyote” huondoa utata wa uhusiano wake katika Kiswahili.
