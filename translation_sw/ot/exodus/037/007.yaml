  yaml_path: translation/ot/exodus/037/007.yaml
  text: He made two cherubim of gold; he made them of hammered work[a], from the two ends of the mercy seat.
translation:
  language: sw
  text: Akatengeneza makerubi wawili wa dhahabu; akawatengeneza kwa kazi ya kufuliwa kwa nyundo, kutoka kwenye ncha mbili za kifuniko cha upatanisho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kifuniko cha rehema.” Neno la Kiebrania linamaanisha kifuniko cha Sanduku la Agano, kinachohusishwa na upatanisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Kitenzi chenye waw ya masimulizi kinaendeleza mfuatano wa matendo. “Akatengeneza” ni ya kawaida katika simulizi la Kiswahili na huhifadhi mtiririko huo.
- source_word: שְׁנֵי כְרֻבִים
  choice: makerubi wawili
  rationale: “Makerubi” ni wingi unaoeleweka wa “kerubi” katika Kiswahili na huhifadhi jina maalumu la viumbe hawa katika maelezo ya maskani.
- source_word: זָהָב
  choice: wa dhahabu
  rationale: Kirai hiki kinaonyesha nyenzo walizotengenezwa makerubi.
- source_word: מִקְשָׁה
  choice: kwa kazi ya kufua kwa nyundo
  rationale: Neno hili humaanisha kazi ya metali iliyoumbwa kwa kupigwa au kufuliwa kwa nyundo. Tafsiri hii huhifadhi njia ya utengenezaji bila kuongeza moja kwa moja wazo la “kipande kimoja,” ambalo ni hitimisho la kimuktadha.
- source_word: עָשָׂה אֹתָם
  choice: akawatengeneza
  rationale: Kurudiwa kwa kitenzi “kutengeneza” kunadumishwa ili kuonyesha msisitizo wa Kiebrania kuhusu namna walivyotengenezwa.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: kutoka kwenye ncha mbili
  rationale: Kihusishi מִן kinaonyesha chanzo au mahali ambako makerubi walitokezwa, yaani ncha mbili za kifuniko.
- source_word: הַכַּפֹּרֶת
  choice: kifuniko cha upatanisho
  rationale: Neno hili hutaja kifuniko cha Sanduku la Agano kinachohusishwa na upatanisho. Tafsiri ya maelezo ni wazi zaidi katika Kiswahili cha sasa kuliko kuiga moja kwa moja istilahi ya jadi ya Kiingereza “mercy seat.”
theological_decisions:
- issue: Tafsiri ya הַכַּפֹּרֶת katika muktadha wa maskani
  choice: kifuniko cha upatanisho
  alternative: kifuniko cha rehema; kifuniko
  rationale: Hiki ni kifuniko cha Sanduku la Agano chenye uhusiano wa kiibada na upatanisho. “Kifuniko cha upatanisho” huonyesha kitu chenyewe na uhusiano wake bila kukifanya kiti halisi wala kuamua zaidi ya ushahidi wa neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Muundo unadumisha urudiaji wa kitenzi katika Kiebrania na unaeleza mbinu ya kufua metali kwa lugha inayoeleweka kwa wasomaji wa kawaida.
