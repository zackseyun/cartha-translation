  text: Akatengeneza mafuta matakatifu ya upako na uvumba safi wenye harufu nzuri[a], kazi ya mchanganyaji wa manukato[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uvumba wa viungo vya kunukia” au “uvumba uliotiwa viungo vya kunukia.” Kiebrania kinarejelea uvumba uliotengenezwa kwa vitu vya kunukia.
    reason: lexical_alternative
  - marker: b
    text: Au “kazi ya mtengenezaji wa manukato” au “uliochanganywa na mchanganyaji wa manukato.” Kiebrania kinakazia utayarishaji uliofanywa na fundi mtaalamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Kauli ya wayyiqtol ya עשה inaendeleza simulizi kwa tendo lililokamilika; “akatengeneza” ni ya kawaida na inafaa kwa vitu vilivyotayarishwa kwa ustadi.
- source_word: שֶׁמֶן הַמִּשְׁחָה קֹדֶשׁ
  choice: mafuta matakatifu ya kutiwa wakfu
  rationale: Kirai hiki kinamaanisha mafuta ya upako yaliyotengwa kwa matumizi matakatifu. “Ya kutiwa wakfu” huonyesha kusudi la upako kwa Kiswahili cha kawaida bila kupoteza sifa ya utakatifu.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: uvumba ... wenye harufu nzuri
  rationale: Kiebrania kinarejelea uvumba uliotengenezwa kwa vitu vya kunukia; tafsiri hii ni ya asili katika Kiswahili na huhifadhi maana ya harufu nzuri.
- source_word: טָהוֹר
  choice: safi
  rationale: Katika muktadha wa ibada na utengenezaji wa uvumba, טָהוֹר huonyesha usafi; “safi” ndiyo tafsiri ya moja kwa moja na ya kawaida.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: kazi ya mtengenezaji stadi wa manukato
  rationale: Kirai nomino huhifadhi wazo la kazi iliyofanywa na mtaalamu wa kuchanganya vitu vya kunukia; “stadi” huweka wazi ustadi unaodokezwa na jina la fundi.
