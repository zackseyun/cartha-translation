  yaml_path: translation/ot/exodus/037/028.yaml
  text: He made the poles of acacia wood and overlaid them with gold.
translation:
  language: sw
  text: Akazitengeneza zile fito kwa mbao za mshita, akazifunika kwa dhahabu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akazitengeneza
  rationale: Qal wayyiqtol ya עשה inaendeleza simulizi kwa tendo la wakati uliopita. Kiambishi -zi- kinarejelea fito kwa njia ya kawaida katika Kiswahili.
- source_word: הַבַּדִּים
  choice: zile fito
  rationale: Katika muktadha wa vyombo vya maskani, בַּדִּים ni fito za kubebea. 'Fito' ni neno la kawaida na wazi; 'zile' hudumisha uainisho wa kifungu cha Kiebrania na kurejelea fito zinazojulikana katika muktadha.
- source_word: עֲצֵי שִׁטִּים
  choice: kwa mbao za mshita
  rationale: Kifungu unganifu humaanisha mbao zitokanazo na mti wa mshita. 'Mbao za mshita' ni Kiswahili cha kawaida kwa nyenzo hiyo, na 'kwa' huonyesha nyenzo zilizotumiwa kutengeneza fito.
- source_word: וַיְצַף
  choice: akazifunika
  rationale: צפה katika ufundi wa maskani humaanisha kufunika kitu kwa tabaka la nyenzo nyingine. 'Akazifunika' ni ya asili na inaeleweka kwa wasomaji wa kawaida, bila kudokeza mbinu maalumu isiyotajwa.
- source_word: אֹתָם
  choice: -zi-
  rationale: Kiwakilishi cha yambwa kinachorejelea fito kinawakilishwa kiasili na kiambishi cha ngeli -zi- katika 'akazifunika'.
- source_word: זָהָב
  choice: kwa dhahabu
  rationale: Dhahabu ndiyo nyenzo iliyotumika kuzifunika fito; Kiswahili cha kawaida hutumia 'kwa dhahabu' kueleza nyenzo ya kufunikia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa vitenzi mfululizo wenye 'aka-' umehifadhi mwendelezo wa simulizi wa Kiebrania. Hakuna tanbihi inayohitajika.
