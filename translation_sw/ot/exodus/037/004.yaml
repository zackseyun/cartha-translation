  text: Akatengeneza fito za mbao za mshita, akazifunika kwa dhahabu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Qal wayyiqtol ya עשה inaendeleza simulizi kwa maana ya ‘akatengeneza’; umoja wa mtenda unaendana na muktadha unaomtaja Bezaleli.
- source_word: בַּדֵּי
  choice: miti ya kubebea
  rationale: בַּדִּים katika muktadha wa vifaa vya maskani ni miti iliyotumiwa kubebea kifaa kitakatifu; tafsiri hii ni wazi kwa msomaji wa sasa kuliko ‘miti’ peke yake.
- source_word: עֲצֵי שִׁטִּים
  choice: ya mbao za mshita
  rationale: Mnyororo wa nomino unaonyesha nyenzo iliyotokana na miti ya mshita; ‘mbao za mshita’ ni Kiswahili cha kawaida na kinachotambulika katika muktadha wa Biblia.
- source_word: וַיְצַף
  choice: akaifunika
  rationale: צפה katika kazi ya ufundi humaanisha kufunika au kupaka uso kwa tabaka la nyenzo; ‘akaifunika’ ni ya kawaida na huepuka maana ya kupaka rangi.
- source_word: אֹתָם
  choice: akaifunika
  rationale: Kiwakilishi cha wingi kinarejelea miti ya kubebea; katika Kiswahili ‘miti’ iko katika ngeli ya 3/4 na kiambishi cha yambwa ‘-i-’ huwakilisha wingi huo.
- source_word: זָהָב
  choice: kwa dhahabu
  rationale: Dhahabu ndiyo nyenzo ya kufunikia; kihusishi ‘kwa’ kinaeleza nyenzo kwa Kiswahili cha kawaida.
