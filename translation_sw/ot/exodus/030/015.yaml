base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/015.yaml
  text: The rich shall not give more[a], and the poor shall not give less, than the half-shekel, when giving the contribution to Yahweh to make atonement for your lives.
translation:
  language: sw
  text: Tajiri asitoe zaidi ya nusu shekeli, wala maskini asitoe pungufu ya nusu shekeli, mnapotoa mchango kwa Yahwe ili kufanya upatanisho kwa ajili ya uhai wenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi zenu” au “ninyi wenyewe.” Neno la Kiebrania nefesh linaweza kumaanisha nafsi, mtu, uhai, au maisha. Katika muktadha huu wa malipo ya sensa, yaelekea linamaanisha uhai au watu waliohesabiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָשִׁיר
  choice: tajiri
  rationale: Kivumishi chenye kiambishi bainishi kinawakilisha kundi la watu; “tajiri” ni usemi wa kawaida unaolingana na “maskini.”
- source_word: יַרְבֶּה
  choice: asitoe zaidi
  rationale: Katika muktadha wa malipo yaliyowekwa, kitenzi kinamaanisha kutotoa kiasi kinachozidi kilichoagizwa.
- source_word: הַדַּל
  choice: maskini
  rationale: Neno linamtaja mtu mwenye uwezo mdogo wa kiuchumi na linadumisha utofautishaji na tajiri.
- source_word: יַמְעִיט
  choice: asitoe pungufu
  rationale: Usemi huu unalingana kwa ulinganifu na “asitoe zaidi” na unaeleza wazi kutopunguza kiasi kilichowekwa.
- source_word: מִמַּחֲצִית הַשָּׁקֶל
  choice: ya nusu shekeli
  rationale: Katika muundo hasi wa kulinganisha, Kiswahili cha kawaida huunganisha “zaidi” na “pungufu” na kiasi maalumu cha nusu shekeli.
- source_word: תְּרוּמַת יְהוָה
  choice: mchango kwa Yahwe
  rationale: “Mchango” unafaa kwa malipo haya ya sensa kuliko neno linaloweza kueleweka hasa kuwa dhabihu; “kwa Yahwe” linaonyesha anayepokea au anayestahili mchango.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: לְכַפֵּר
  choice: ili kufanya upatanisho
  rationale: Usemi huu unahifadhi uzito wa lugha ya ibada bila kulazimisha nadharia mahususi ya jinsi upatanisho unavyofanya kazi.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: kwa ajili ya maisha yenu
  rationale: Katika muktadha wa malipo ya sensa, נֶפֶשׁ inaelekea kumaanisha uhai au watu wenyewe, si lazima nafsi isiyo ya kimwili.
- source_word: לָתֵת
  choice: wakati wa kutoa
  rationale: 'Infinitivo inaeleza mazingira ya tendo: kiasi hiki kinatakiwa wakati mchango unapotolewa.'
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Unukuzi unahifadhi jina binafsi lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Maana ya נֶפֶשׁ katika muktadha wa upatanisho
  choice: kwa ajili ya maisha yenu
  alternative: kwa ajili ya nafsi zenu; kwa ajili yenu wenyewe
  rationale: Muktadha wa sensa na fedha ya fidia unaelekeza kwa uhai au watu wanaohesabiwa, bila kutoa dai maalumu kuhusu muundo wa mwanadamu.
- issue: Uwasilishaji wa כפר
  choice: kufanya upatanisho
  alternative: kufunika dhambi; kutoa fidia
  rationale: “Kufanya upatanisho” ni lugha ya ibada iliyo wazi na pana, inayohifadhi mvutano wa kiteolojia bila kuchagua nadharia finyu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wenye hadhi. Ulinganifu wa “asitoe zaidi ... asitoe pungufu” unadumisha muundo sawia wa Kiebrania.
