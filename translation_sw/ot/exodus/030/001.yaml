translation:
  language: sw
  text: “Nawe utatengeneza madhabahu ya kufukizia uvumba[a]; utaitengeneza kwa mbao za mshita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa ufupi zaidi, “madhabahu ya uvumba.” Kiebrania kinasema kwa maana ya moja kwa moja zaidi, “madhabahu ya kufukizia uvumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utatengeneza
  rationale: Kitenzi cha nafsi ya pili umoja wa kiume pamoja na kiunganishi kinaendeleza mfululizo wa maagizo. ‘Nawe utatengeneza’ huhifadhi mtiririko huo na uzito wa agizo kwa Kiswahili cha kawaida.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na lenye heshima katika Kiswahili kwa mahali au kifaa cha kutolea sadaka; hapa linatambulisha kifaa kipya cha ibada.
- source_word: מִקְטַר קְטֹרֶת
  choice: ya kufukizia uvumba
  rationale: Kirai hiki kinaonyesha kusudi la madhabahu, yaani kufukiza uvumba. Tafsiri hii ni ya asili katika Kiswahili na haikibani kirai cha Kiebrania kuwa jina tu.
- source_word: עֲצֵי שִׁטִּים
  choice: mbao za mshita
  rationale: Kirai cha Kiebrania kinamaanisha mbao zinazotokana na miti ya mshita. ‘Mbao za mshita’ ni usemi wazi na wa kawaida katika Kiswahili.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: utaitengeneza
  rationale: Kitenzi hiki kinaendeleza agizo huku kiirejelea madhabahu. Kurudia ‘utaitengeneza’ kunahifadhi urudiaji wa makusudi katika Kiebrania kabla ya kutaja nyenzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa maagizo ulio wazi, wa sasa na wenye heshima. ‘Uvumba’ na ‘mshita’ ni maneno yanayoeleweka katika muktadha wa kibiblia; muundo unabaki karibu na urudiaji wa Kiebrania bila kuwa mzito.
