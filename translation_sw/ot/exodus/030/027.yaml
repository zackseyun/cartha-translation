  text: na meza na vyombo vyake vyote, na kinara cha taa na vyombo vyake, na madhabahu ya uvumba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: meza
  rationale: Nomino ya Kiebrania hapa ni ‘meza’ tu; muktadha unaonyesha kuwa ni meza takatifu ya Maskani bila kuongeza maelezo yasiyokuwamo katika mstari huu.
- source_word: כָּל כֵּלָיו
  choice: vyombo vyake vyote
  rationale: כְּלִי ni neno pana linaloweza kumaanisha vyombo au vifaa. ‘Vyombo’ ni la kawaida na linafaa kwa vitu vilivyotumiwa pamoja na meza ya Maskani.
- source_word: הַמְּנֹרָה
  choice: kinara cha taa
  rationale: Tafsiri hii inaeleza wazi kazi ya מְנוֹרָה kwa Kiswahili cha kawaida badala ya kunukuu tu neno la Kiebrania.
- source_word: כֵּלֶיהָ
  choice: vyombo vyake
  rationale: Kiambishi cha umilikaji cha kike kinarejelea kinara cha taa; ‘vyombo vyake’ kinahifadhi uhusiano huo kwa lugha ya kawaida.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: madhabahu ya uvumba
  rationale: Muundo huu wa Kiebrania unamaanisha madhabahu inayohusiana na uvumba; ‘madhabahu ya uvumba’ ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Muundo wa orodha unaendelezwa kwa viunganishi kama katika Kiebrania. Tanbihi ya Kiingereza iliyoambatanishwa na ‘utensils’ haipatani na nafasi yake wala ushahidi wa Kiebrania; tofauti ya ‘incense altar’ ni ya mtindo tu na haihitaji tanbihi katika Kiswahili.
