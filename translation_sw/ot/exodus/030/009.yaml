base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/009.yaml
  text: You shall not offer unauthorized incense on it[a], or a burnt offering, or a grain offering; and you shall not pour out a drink offering on it.
translation:
  language: sw
  text: Msifukize juu yake uvumba usioidhinishwa[a], wala msitoe sadaka ya kuteketezwa au sadaka ya nafaka; wala msimimine juu yake sadaka ya kinywaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uvumba mgeni” au “uvumba wa ajabu.” Kivumishi cha Kiebrania kinaweza kumaanisha kitu kilicho nje ya yale yaliyoruhusiwa au kuagizwa katika muktadha huu wa ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲלוּ
  choice: msifukize
  rationale: Ingawa kitenzi kwa msingi kina maana ya ‘kupandisha,’ katika muktadha huu kinamaanisha kutoa uvumba madhabahuni. ‘Kufukiza’ ni Kiswahili cha kawaida na sahihi kwa kitendo cha kuchoma uvumba ili moshi wake upande.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kiwakilishi kinarejelea madhabahu ya kufukizia uvumba iliyotajwa katika muktadha; ‘juu yake’ huhifadhi uhusiano wa mahali.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Neno hili linamaanisha uvumba; kitenzi ‘kufukiza’ tayari kinaonyesha matumizi yake ya kiibada.
- source_word: זָרָה
  choice: usioidhinishwa
  rationale: Katika muktadha wa kanuni za ibada, kivumishi hiki kinaonyesha uvumba ulio nje ya yale yaliyoagizwa au kuruhusiwa. ‘Usioidhinishwa’ ni wazi zaidi kwa msomaji wa sasa kuliko ‘mgeni’ au ‘wa ajabu.’
- source_word: וְעֹלָה
  choice: wala kutoa sadaka ya kuteketezwa
  rationale: Katika orodha ya mambo yaliyokatazwa, waw ya Kiebrania inawasilishwa kwa ‘wala’; עֹלָה ni istilahi ya sadaka inayoteketezwa kabisa madhabahuni.
- source_word: וּמִנְחָה
  choice: au sadaka ya nafaka
  rationale: Katika sheria za dhabihu, מִנְחָה humaanisha kwa kawaida sadaka inayotokana na nafaka. ‘Sadaka ya nafaka’ ni sahihi na inaeleweka.
- source_word: וְנֵסֶךְ
  choice: sadaka ya kinywaji
  rationale: Neno hili linataja sadaka ya kimiminiko inayomiminwa; istilahi hii ni wazi na ya kawaida katika Kiswahili cha Biblia.
- source_word: תִסְּכוּ
  choice: msimimine
  rationale: Kitenzi hiki kinamaanisha kumimina kimiminiko kama sadaka; ‘msimimine’ huonyesha tendo hilo moja kwa moja.
theological_decisions:
- issue: Hadhi ya kiibada ya זָרָה inapofafanua uvumba
  choice: uvumba usioidhinishwa
  alternative: uvumba mgeni; uvumba wa ajabu
  rationale: Mstari huu unaweka mipaka ya ibada inayofaa kwenye madhabahu ya uvumba. Tafsiri ‘usioidhinishwa’ inaonyesha jambo lisiloagizwa au kuruhusiwa bila kudokeza kwamba tatizo lake ni asili ya kigeni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kufukiza uvumba’ limetumiwa badala ya tafsiri sisisi ya ‘kupandisha’ ili kueleza kitendo cha kiibada kwa njia ya kawaida; istilahi za sadaka zimewekwa wazi kwa wasomaji wa kawaida.
