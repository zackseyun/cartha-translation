lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akazungumza
  rationale: Wayyiqtol inaendeleza simulizi; kiambishi “aka-” huwasilisha mwendelezo huo kwa Kiswahili cha kawaida, na “zungumza” hutofautisha kitenzi hiki na fomula inayofuata ya לֵאמֹר.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa jina la Mungu YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: אֶל
  choice: na
  rationale: Katika Kiswahili, “kuzungumza na” ndiyo kauli ya kawaida kwa kueleza mtu anayeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵּאמֹר
  choice: akisema
  rationale: Hudumisha fomula ya Kiebrania inayotanguliza maneno ya moja kwa moja katika mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la Mungu YHWH moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku likitumia tahajia ya kawaida ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Muundo “akazungumza ... akisema” umehifadhi fomula ya masimulizi na utangulizi wa usemi wa Kiebrania bila kuwa wa kizamani.
