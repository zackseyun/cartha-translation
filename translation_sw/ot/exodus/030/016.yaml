  text: וְ/לָקַחְתָּ֞ אֶת כֶּ֣סֶף הַ/כִּפֻּרִ֗ים מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/נָתַתָּ֣ אֹת֔/וֹ עַל עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֤ל לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/016.yaml
  text: You shall take the atonement money from the sons of Israel and give it for the service of the tent of meeting[a], and it shall be for the sons of Israel as a memorial before Yahweh[b], to make atonement for your lives.
translation:
  language: sw
  text: Utachukua fedha ya upatanisho kutoka kwa wana wa Israeli[a] na kuitoa kwa ajili ya huduma ya Hema ya Kukutania. Fedha hiyo itakuwa ukumbusho kwa wana wa Israeli mbele za Yahweh, ili kufanya upatanisho kwa ajili ya maisha yenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka kwa Waisraeli” au “kutoka kwa watoto wa Israeli.” Kiebrania kinasema “kutoka kwa wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “kwa ajili ya nafsi zenu”; hapa maana yake ni “kwa ajili ya maisha yenu” au “kwa ajili yenu wenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף הַכִּפֻּרִים
  choice: fedha ya upatanisho
  rationale: כֶּסֶף humaanisha fedha au pesa, na hapa ni malipo ya sensa yaliyotajwa katika mistari iliyotangulia. הַכִּפֻּרִים linatokana na כפר na lina maana ya upatanisho; usemi huu unadumisha maana ya ibada kwa Kiswahili kinachoeleweka.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: kutoka kwa wana wa Israeli
  rationale: Hili linafuata kwa uwazi umbo la Kiebrania ‘wana wa Israeli,’ ambalo hapa linawataja watu wa agano kwa jumla.
- source_word: עַל עֲבֹדַת אֹהֶל מוֹעֵד
  choice: kwa ajili ya huduma ya Hema la Kukutania
  rationale: עַל linaonyesha kusudi au matumizi ya fedha, עֲבֹדָה ni huduma/kazi, na אֹהֶל מוֹעֵד ni jina la kawaida la mahali pa kukutania katika ibada.
- source_word: וְהָיָה ... לְזִכָּרוֹן
  choice: Fedha hiyo itakuwa ... ukumbusho
  rationale: Kumtaja tena ‘fedha hiyo’ badala ya kiwakilishi pekee kunatoa Kiswahili cha asili huku זִכָּרוֹן likitafsiriwa kwa maana yake ya ukumbusho mbele za Mungu.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huu ni usemi wa kiibada unaomaanisha katika uwepo wa Mungu; jina la agano יְהוָה limetolewa kama Yahwe.
- source_word: לְכַפֵּר
  choice: kufanya upatanisho
  rationale: Kitenzi cha כפר katika muktadha huu wa kikuhani kinaeleza tendo la kufanya upatanisho; tafsiri hii ni wazi na inahifadhi istilahi ya kiibada.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: kwa ajili ya maisha yenu
  rationale: נֶפֶשׁ hapa linarejelea maisha au watu wenyewe katika muktadha wa malipo ya fidia/upatanisho, si ‘roho’ kama sehemu inayotenganishwa na mwili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Jina la watu wa agano בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli au watoto wa Israeli
  rationale: Kiebrania kina umbo la kiume la wingi ‘wana wa Israeli,’ likiwakilisha watu wa agano kwa jumla; tafsiri hii inalifanya umbo hilo lionekane bila kuzuia maana yake ya kijumuiya.
- issue: Maana ya upatanisho kwa נַפְשֹׁתֵיכֶם
  choice: kwa ajili ya maisha yenu
  alternative: kwa ajili ya nafsi zenu au kwa ajili yenu wenyewe
  rationale: Muktadha wa fedha ya sensa unaelekeza kwenye uhai wa watu wenyewe. ‘Maisha’ huepuka kuingiza bila msingi dhana ya mgawanyo wa mwili na roho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; istilahi za kiibada ‘upatanisho,’ ‘Hema la Kukutania,’ na ‘ukumbusho’ zimehifadhiwa bila kuongeza maelezo ya kimadhehebu.
