base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/014.yaml
  text: Everyone who passes over to those who are counted[a], from twenty years old and upward, shall give Yahweh’s contribution.
translation:
  language: sw
  text: Kila anayepita miongoni mwa waliohesabiwa[a], kuanzia umri wa miaka ishirini na kuendelea, atatoa mchango kwa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayepita kwa waliohesabiwa.” Nahau ya Kiebrania inasema kihalisi kwamba mtu “anapita” kuhusiana na waliohesabiwa; huenda ikirejelea utaratibu wa sensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Kila
  rationale: Katika muktadha huu כֹּל inatawala kishiriki kinachofuata na ina maana ya kila mtu mmoja mmoja; “Kila anayepita” ni Kiswahili cha kawaida na sahihi.
- source_word: הָעֹבֵר
  choice: anayepita kuingia
  rationale: Kitenzi עבר kinahifadhi taswira ya kupita au kuvuka. Neno “kuingia” linaonyesha kwa kawaida uhusiano na kundi la waliohesabiwa bila kufuta taswira ya utaratibu wa sensa.
- source_word: עַל הַפְּקֻדִים
  choice: miongoni mwa waliohesabiwa
  rationale: פְּקֻדִים hapa ni watu waliohesabiwa au kuandikishwa katika sensa. “Miongoni mwa” linaonyesha kuingizwa katika kundi hilo, huku tanbihi ikihifadhi ugumu wa nahau ya Kiebrania.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: kuanzia umri wa miaka ishirini na kuendelea
  rationale: Hii ni fomula ya kiwango cha chini cha umri; tafsiri hii ni ya sasa, wazi, na yenye hadhi katika Kiswahili.
- source_word: יִתֵּן
  choice: atatoa
  rationale: Kauli ya wakati ujao katika muktadha huu wa kisheria ina nguvu ya agizo; “atatoa” inafaa mtindo wa sheria za agano bila kuwa nzito au ya kizamani.
- source_word: תְּרוּמַת
  choice: mchango
  rationale: תְּרוּמָה ni kitu kinachotengwa na kutolewa. Katika muktadha wa malipo yanayohusiana na sensa, “mchango” ni sahihi kuliko neno lenye maana finyu zaidi ya sadaka ya ibada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Kiwango cha kufafanua nahau ya sensa
  choice: anayepita kuingia miongoni mwa waliohesabiwa
  alternative: anayehesabiwa pamoja nao
  rationale: Chaguo hili linahifadhi taswira halisi ya “kupita” na wakati huohuo linafanya maana ya kujiunga na kundi la sensa ieleweke. Halibadili nahau yote kuwa kauli ya moja kwa moja ya kuhesabiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi, na yenye hadhi ya agizo la kisheria. Taswira ya Kiebrania ya “kupita” imehifadhiwa, na tanbihi inaonyesha tafsiri nyingine inayowezekana.
