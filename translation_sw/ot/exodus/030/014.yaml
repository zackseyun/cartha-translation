  verdict: revise
  source_fidelity: The age threshold, legal force, contribution terminology, and divine name are accurately conveyed. However, "kuingia" adds an explicit sense of entering that the Hebrew participial idiom does not state; the source retains the more concrete but syntactically difficult image of passing in relation to those enrolled.
  naturalness: The text is fluent Standard East African Swahili and has an appropriate formal legal register. Removing "kuingia" yields a more source-sensitive rendering without making the sentence unnatural.
  terminology: '"waliohesabiwa," "mchango," and "Yahweh" are suitable choices. "Mchango kwa Yahweh" naturally communicates a contribution designated for Yahweh and avoids the misleading implication that Yahweh is the giver.'
  issues:
  - severity: low
    issue: The main text adds "kuingia" (entering).
    rationale: Although enrollment is likely the procedural sense of the Hebrew idiom, the verb עבר itself means passing/crossing. The added verb resolves the idiom more fully than the source and is best omitted while retaining the explanatory footnote.
  - severity: low
    issue: The footnote’s alternative "kati ya walioorodheshwa" is less closely aligned with the main lexical choice and does not clearly present the prepositional ambiguity.
    rationale: A footnote identifying "kwa waliohesabiwa" as an alternative better reflects the difficult relation expressed by עבר על and retains "waliohesabiwa" for פְּקֻדִים.
  revised_text: Kila anayepita miongoni mwa waliohesabiwa[a], kuanzia umri wa miaka ishirini na kuendelea, atatoa mchango kwa Yahweh.
