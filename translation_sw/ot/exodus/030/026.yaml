  yaml_path: translation/ot/exodus/030/026.yaml
  text: With it you shall anoint the tent of meeting and the ark of the testimony[a].
translation:
  language: sw
  text: Kwa mafuta hayo utapaka hema la kukutania na sanduku la ushuhuda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kimapokeo zaidi, “sanduku la agano”; hapa Kiebrania kinasema “ushuhuda.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: utapaka
  rationale: Katika mfuatano huu wa maagizo, kitenzi hiki kina maana ya agizo linalohusu tendo lijalo. “Utapaka” ni usemi wa kawaida wa Kiswahili kwa kupaka mafuta ya kuweka wakfu, huku mafuta yakitajwa wazi mwanzoni mwa sentensi.
- source_word: בּוֹ
  choice: Kwa mafuta hayo
  rationale: Kiwakilishi kinarejelea mafuta ya upako yaliyotajwa katika muktadha uliotangulia. Kutaja “mafuta hayo” huweka wazi maana ya chombo bila kuingiza wazo lisilokuwamo katika muktadha.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya jina la hema takatifu lililokuwa mahali pa kukutana.
- source_word: אֲרוֹן
  choice: sanduku
  rationale: “Sanduku” ni neno la kawaida na linaloeleweka kwa chombo hiki kitakatifu; muktadha hulitofautisha na sanduku la kawaida.
- source_word: הָעֵדֻת
  choice: ushuhuda
  rationale: Neno la Kiebrania linamaanisha “ushuhuda” katika kirai hiki. Tafsiri hii huhifadhi uchaguzi halisi wa neno la chanzo bila kuubadili kuwa “agano.”
theological_decisions:
- issue: Tafsiri ya אֲרוֹן הָעֵדֻת
  choice: sanduku la ushuhuda
  alternative: sanduku la agano
  rationale: Maandishi ya Kiebrania katika aya hii yanasema “ushuhuda,” si “agano.” Tafsiri iliyo katika matini kuu inafuata neno la chanzo, huku istilahi ya mapokeo ikiwekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku istilahi muhimu ya Kiebrania “ushuhuda” ikihifadhiwa na tofauti ya kimapokeo kufafanuliwa katika tanbihi.
