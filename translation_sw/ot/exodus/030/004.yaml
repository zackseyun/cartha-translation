base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/004.yaml
  text: And you shall make two gold rings for it under its molding[a]; on its two side panels you shall make them, on its two sides[c][b], and they shall be holders for poles with which to carry it.
translation:
  language: sw
  text: Nawe utaitengenezea pete mbili za dhahabu chini ya ukingo wake[a]. Utazitengeneza kwenye sehemu zake mbili za pembeni, kwenye pande zake mbili[b]. Pete hizo zitakuwa vishikio vya miti ya kuibebea[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chini ya pambo la ukingo wake”; neno la Kiebrania זֵר humaanisha ukingo wa mapambo unaozunguka madhabahu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema, “kwenye sehemu zake mbili za pembeni ... kwenye pande zake mbili,” maelezo yanayorudia wazo ili kusisitiza kuwekwa kwa pete pande zote mbili.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “zitakuwa nyumba za miti,” yaani, nafasi au vishikio vya kuingizia miti ya kubebea.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: pete mbili za dhahabu
  rationale: ‘Pete’ ni neno la kawaida na sahihi kwa viungio hivi vya duara, huku ‘za dhahabu’ ikihifadhi wazi nyenzo yake.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: chini ya ukingo wake
  rationale: זֵר ni ukingo wa mapambo unaozunguka madhabahu. ‘Ukingo’ ni neno la asili na linaloeleweka kwa urahisi; tanbihi inadumisha uwezekano wa ‘pambo la ukingo.’
- source_word: צַלְעֹתָיו
  choice: sehemu zake mbili za pembeni
  rationale: צֵלָע hapa huonyesha upande au muundo wa pembeni wa kifaa. Tafsiri hii huepuka ‘mbavu,’ ambayo ingesikika isiyo ya kawaida kwa madhabahu, bila kudai kwa uhakika kuwa ni mbao maalumu.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: kwenye pande zake zote mbili
  rationale: Inahifadhi msisitizo wa Kiebrania kwamba pete ziliwekwa pande zote mbili, huku ‘yaani’ ikifanya urudiaji huo usomeke kwa kawaida.
- source_word: וְהָיָה לְבָתִּים לְבַדִּים
  choice: Pete hizo zitakuwa vishikio vya miti
  rationale: בָּתִּים, kihalisi ‘nyumba,’ ni tamathali kwa nafasi au vishikio vinavyopokea miti. ‘Vishikio’ hueleza kazi yake wazi katika Kiswahili cha sasa.
- source_word: בַדִּים
  choice: miti
  rationale: Katika vifaa vya hema la kukutania, בַּדִּים ni miti mirefu ya kubebea. ‘Miti’ ni istilahi ya kawaida ya kibiblia na inaeleweka hapa kwa kuongezewa ‘ya kuibebea.’
- source_word: לָשֵׂאת אֹתוֹ בָּהֵמָּה
  choice: ya kuibebea
  rationale: Muundo huu unaonyesha kusudi na pia kwamba miti ndiyo chombo cha kubebea madhabahu. Kiswahili ‘ya kuibebea’ huwasilisha maana zote mbili kwa ufupi.
- source_word: תַּעֲשֶׂה ... תַּעֲשֶׂה
  choice: utaitengenezea ... Utazitengeneza
  rationale: Wakati ujao wenye nguvu ya agizo unafaa kwa maagizo haya, na kurudia kitenzi kunahifadhi mpangilio na msisitizo wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi urudiaji wa maagizo ya Kiebrania bila kuwa mzito; ‘yaani’ inaonyesha kwamba kishazi cha pili kinafafanua na kusisitiza uwekaji wa pande mbili. Viashiria vyote vya tanbihi vimewekwa katika matini kuu.
