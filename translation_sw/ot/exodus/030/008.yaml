base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/008.yaml
  text: And when Aaron sets up the lamps at twilight[a], he shall burn it, a regular incense[b], before Yahweh throughout your generations.
translation:
  language: sw
  text: Na Haruni anapoziandaa taa wakati wa machweo[a], atafukiza uvumba wa daima[b] mbele za Yahwe katika vizazi vyenu vyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno halisi, “katikati ya jioni mbili,” nahau inayorejelea kipindi cha machweo au jioni.
    reason: lexical_alternative
  - marker: b
    text: Au “uvumba wa kawaida.” Neno la Kiebrania linaweza kusisitiza utoaji wa mara kwa mara kwa utaratibu au kudumu kwa sadaka hii iliyoagizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲלֹת
  choice: Na ... anapoyaandaa
  rationale: Muundo wa kihusishi pamoja na kitenzi-jina unaanzisha kishazi cha wakati. Hifili ya עלה kuhusiana na taa inaweza kumaanisha kuwasha mwali au kuziandaa taa ziendelee kuwaka; “anapoyaandaa” huhifadhi maana ya kitendo cha kiibada bila kuifungia katika kuwasha pekee.
- source_word: הַנֵּרֹת
  choice: taa
  rationale: נֵרֹת ni neno la kawaida kwa taa katika muktadha wa vifaa vya Maskani.
- source_word: בֵּין הָעַרְבַּיִם
  choice: wakati wa machweo
  rationale: Nahau hii, ambayo kwa neno moja moja ni “katikati ya jioni mbili,” hurejelea kipindi cha jioni au machweo. Kiswahili hiki ni wazi na cha kawaida, huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: יַקְטִירֶנָּה
  choice: ataufukiza
  rationale: Hifili ya קטר katika muktadha wa uvumba humaanisha kuuteketeza ili utoe moshi kama sadaka. “Kufukiza uvumba” ni usemi wa asili wa Kiswahili; kiambishi cha yambwa -u- kinarejelea uvumba.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Nomino hii humaanisha uvumba; dhana ya sadaka inaelezwa na kitenzi cha kuufukiza.
- source_word: תָּמִיד
  choice: wa kawaida
  rationale: תָּמִיד hapa husisitiza utaratibu unaorudiwa na kuendelea, si lazima tendo lisilokoma kila dakika. “Wa kawaida” huonyesha desturi iliyowekwa; uwezekano wa “wa daima” umetajwa katika tanbihi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי huonyesha uwepo mbele za Mungu katika eneo la ibada, na יְהוָה imetafsiriwa kwa jina lake “Yahwe.”
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Nahau hii huonyesha mwendelezo wa agizo katika vizazi vinavyofuatana vya Israeli.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יְהוָה. “Yahwe” huhifadhi jina binafsi la agano badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Kufukiza uvumba” ni usemi wa asili wa kiibada; “wakati wa machweo” ni wazi zaidi kuliko tafsiri sisisi ya nahau ya Kiebrania.
