  yaml_path: translation/ot/exodus/030/002.yaml
  text: Its length shall be a cubit[a], and its width a cubit; it shall be square, and its height shall be two cubits[b]. Its horns shall be of one piece with it.
translation:
  language: sw
  text: Urefu wake utakuwa dhiraa moja, na upana wake dhiraa moja; itakuwa ya mraba[a], na kimo chake kitakuwa dhiraa mbili. Pembe zake zitakuwa za kipande kimoja nayo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania hapa linamaanisha kitu chenye umbo la mraba; tafsiri za zamani wakati mwingine hutumia usemi “yenye pande nne sawa.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “kutoka kwake”; yaani, pembe hizo zilipaswa kutengenezwa kama sehemu ya madhabahu yenyewe, si kuunganishwa nazo kama vipande tofauti.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַמָּה / אַמָּתַיִם
  choice: dhiraa moja / dhiraa mbili
  rationale: “Dhiraa” ni istilahi ya kawaida ya Kiswahili kwa kipimo hiki cha kale. Kipimo cha asili kimehifadhiwa badala ya kukibadili kuwa vipimo vya kisasa na hivyo kudokeza usahihi usiokuwapo.
- source_word: אָרְכּוֹ
  choice: urefu wake
  rationale: Nomino yenye kiambishi cha nafsi ya tatu umoja wa kiume inarejelea madhabahu inayozungumziwa katika muktadha.
- source_word: רָחְבּוֹ
  choice: upana wake
  rationale: “Upana” ni neno la kawaida na wazi katika maelezo ya vipimo.
- source_word: רָבוּעַ
  choice: mraba
  rationale: Kivumishi hiki kinaeleza umbo lenye pande nne sawa; “mraba” ni tafsiri ya sasa na inayoeleweka kwa urahisi.
- source_word: יִהְיֶה
  choice: utakuwa
  rationale: Kauli ya wakati usiotimilika hapa inaonyesha agizo au maelekezo ya jinsi madhabahu inavyopaswa kutengenezwa.
- source_word: קֹמָתוֹ
  choice: kimo chake
  rationale: Katika muktadha wa vipimo vya kitu kilichojengwa, “kimo” ni tafsiri ya kawaida na ya asili.
- source_word: מִמֶּנּוּ
  choice: kitu kimoja nayo
  rationale: Kwa maana halisi ni “kutoka kwake,” lakini katika muktadha wa ufundi inaonyesha kuwa pembe ni sehemu ya madhabahu yenyewe, si vipande vilivyoongezwa baadaye.
- source_word: קַרְנֹתָיו
  choice: pembe zake
  rationale: “Pembe” huhifadhi taswira ya sehemu zinazochomoza kwenye pembe za madhabahu na uhusiano wake na matumizi ya neno hilo kwingine katika Maandiko.
