base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/018.yaml
  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
translation:
  language: sw
  text: Utengeneze beseni[a] la shaba[c], pamoja na kitako chake[b] cha shaba, kwa ajili ya kunawia. Uliweke kati ya Hema la Kukutania na madhabahu, kisha utie maji humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “birika la kunawia”; hapa ni chombo kikubwa cha maji kwa ajili ya kunawia.
    reason: lexical_alternative
  - marker: b
    text: Au “msingi wake” au “kiegemeo chake.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania linaweza kumaanisha shaba nyekundu au aloi ya shaba, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיּוֹר
  choice: birika
  rationale: Ni chombo kikubwa cha kuwekea maji kwa ajili ya kunawia katika patakatifu. ‘Birika’ ni neno la kawaida na linaloeleweka katika Kiswahili cha Biblia.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Neno la Kiebrania linaweza kumaanisha shaba nyekundu au aloi yake; ‘shaba’ huhifadhi upana huo wa maana katika Kiswahili bila kulazimisha aina mahususi ya aloi.
- source_word: כַּן
  choice: tako
  rationale: Hurejelea sehemu inayokishikilia au kukitegemeza chombo. ‘Tako’ linafaa kwa msingi wa chombo, ingawa ‘msingi’ pia linawezekana.
- source_word: לְרָחְצָה
  choice: kwa ajili ya kunawia
  rationale: Infinitivu inaonyesha kusudi. ‘Kunawia’ ni ya asili katika muktadha wa kuosha mikono au miguu na haiingizi mtendwa ambaye hajatajwa katika mstari huu.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Ni tafsiri sanifu na ya heshima ya jina la hema ambako Mungu alikutana na watu wake.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Ni tafsiri ya moja kwa moja na iliyozoeleka kwa madhabahu ya dhabihu katika muktadha huu.
- source_word: שָׁמָּה
  choice: humo
  rationale: Kiebrania kinasema ‘huko/humo.’ Katika Kiswahili, ‘humo’ ni ya asili na huonyesha mahali pa kutia maji bila kufafanua kupita kiasi.
- source_word: מַיִם
  choice: maji
  rationale: Ni tafsiri ya moja kwa moja ya nomino hii inayotumiwa kama jina la kitu kisichohesabika.
- source_word: וְעָשִׂיתָ ... וְנָתַתָּ ... וְנָתַתָּ
  choice: Utengeneze ... Uliweke ... utie
  rationale: Katika maagizo haya, maumbo hayo yana nguvu ya amri. Tegemezi ya ‘u-’ huwasilisha agizo kwa Kiswahili cha sasa na chenye heshima bila kufanya sentensi kuwa nzito.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Muundo wa maagizo umewekwa wazi na kwa mtiririko wa kawaida. Neno ‘shaba’ limeachwa bila tanbihi kwa sababu katika Kiswahili linaweza kutumika kwa upana unaofaa kwa נְחֹשֶׁת; tanbihi zimehifadhiwa kwa istilahi ambazo msomaji anaweza kuhitaji mbadala wa moja kwa moja.
