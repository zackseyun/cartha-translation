  text: Na utatengeneza miti ya kubebea kwa mbao za mshita, na utazifunika kwa dhahabu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utatengeneza
  rationale: Katika mfululizo huu wa maagizo, kitenzi hiki kina nguvu ya amri. Muundo wa wakati ujao katika Kiswahili unaendeleza mfululizo wa maagizo kwa lugha ya kawaida na yenye heshima.
- source_word: הַבַּדִּים
  choice: miti ya kubebea
  rationale: Katika muktadha wa vifaa vitakatifu, neno hili linamaanisha miti mirefu iliyotumiwa kuvibeba. Kauli hii ni wazi zaidi kwa msomaji wa sasa kuliko 'miti' peke yake.
- source_word: עֲצֵי שִׁטִּים
  choice: kwa mbao za mshita
  rationale: Kirai hiki kinataja nyenzo iliyotokana na mti wa mshita. 'Mbao za mshita' ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: וְצִפִּיתָ
  choice: kisha utaifunika
  rationale: Katika kazi ya ufundi, kitenzi hiki humaanisha kufunika uso wa kitu kwa nyenzo nyingine. 'Kisha' huonyesha hatua inayofuata katika agizo.
- source_word: אֹתָם
  choice: utaifunika
  rationale: Kiwakilishi cha Kiebrania kinarejelea miti ya kubebea. Kiswahili hutumia ngeli ya m-ti kwa 'miti,' hivyo kiambishi cha yambwa ni '-i-'.
- source_word: זָהָב
  choice: kwa dhahabu
  rationale: Kirai hiki kinaonyesha nyenzo iliyotumiwa kuifunika miti; 'kwa dhahabu' ni usemi wa asili katika Kiswahili.
