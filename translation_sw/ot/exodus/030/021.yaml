base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/021.yaml
  text: They shall wash their hands and their feet[a], so that they may not die. This shall be a permanent statute for them[b], for him and for his offspring throughout their generations.
translation:
  language: sw
  text: Wataosha mikono yao na miguu yao, ili wasife. Hii itakuwa sheria ya kudumu[a] kwao, kwake[b] na kwa uzao wake katika vizazi vyao vyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sheria ya milele” au “sheria ya daima.” Usemi wa Kiebrania חָק עוֹלָם ni kauli ya kawaida ya kisheria kuhusu agizo linalodumu.
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha wa karibu, “kwake” anamrejelea Haruni.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: Wataosha
  rationale: Katika muktadha huu wa sheria, kitenzi hiki kina nguvu ya agizo linaloendelea; wakati ujao wa Kiswahili unasomeka kwa kawaida na kuhifadhi maana hiyo.
- source_word: יְדֵיהֶם וְרַגְלֵיהֶם
  choice: mikono yao na miguu yao
  rationale: Tafsiri ya moja kwa moja inayohifadhi sehemu zote mbili za mwili zinazotakiwa kuoshwa katika ibada.
- source_word: וְלֹא יָמֻתוּ
  choice: ili wasife
  rationale: Muundo huu unaonyesha kusudi au matokeo yanayohusiana na kutii agizo, huku ukidumisha onyo la kifo.
- source_word: חָק עוֹלָם
  choice: sheria ya kudumu
  rationale: Neno 'sheria' linafaa kwa agizo rasmi la ibada, na 'ya kudumu' linaonyesha mwendelezo wa agizo bila kulazimisha maana ya kifalsafa ya kutokuwa na mwisho.
- source_word: לָהֶם
  choice: kwao
  rationale: Inahifadhi kiwakilishi cha wingi cha Kiebrania kinachowarejelea Haruni na wanawe katika muktadha.
- source_word: לּוֹ
  choice: kwake yeye
  rationale: Inahifadhi badiliko la Kiebrania kutoka wingi kwenda umoja na haibadilishi kiwakilishi kuwa jina moja kwa moja.
- source_word: וּלְזַרְעוֹ
  choice: na kwa uzao wake
  rationale: '''Uzao'' huhifadhi maana ya pamoja ya זֶרַע, yaani watu watakaotokana naye.'
- source_word: לְדֹרֹתָם
  choice: katika vizazi vyao
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuendelea kwa agizo katika vizazi vinavyofuatana.
theological_decisions:
- issue: Muda unaoonyeshwa na חָק עוֹלָם
  choice: sheria ya kudumu
  alternative: sheria ya milele; sheria ya daima
  rationale: Usemi wa Kiebrania ni kauli ya kisheria kuhusu agizo linalodumu. 'Ya kudumu' huhifadhi uzito wake bila kuamua kimbele mjadala wa kitheolojia kuhusu upeo wake nje ya mfumo wa ibada unaozungumziwa.
- issue: Mhusika wa kiwakilishi cha umoja לּוֹ
  choice: kwake yeye, pamoja na tanbihi kwamba muktadha unamwelekeza Haruni
  alternative: kwa Haruni
  rationale: Maandishi ya Kiebrania yana kiwakilishi, si jina. Kukihifadhi katika matini kuu kunadumisha umbo na mvutano wa kisarufi, huku tanbihi ikifafanua rejeo la karibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umewekwa karibu na Kiebrania, hasa katika badiliko kutoka 'kwao' kwenda 'kwake yeye,' ili kutoficha tofauti ya viwakilishi.
