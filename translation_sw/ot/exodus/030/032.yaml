base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/032.yaml
  text: It shall not be poured on human flesh[a], and in its composition you shall not make any like it. It is holy; it shall be holy to you.
translation:
  language: sw
  text: Mafuta haya yasimwagwe juu ya mwili wa mwanadamu[a], wala msitengeneze mafuta mengine yenye mchanganyiko kama wake. Ni takatifu; nayo yatakuwa matakatifu kwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya nyama ya binadamu.” Neno la Kiebrania linalotafsiriwa “mwanadamu” linawahusu wanadamu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִיסָךְ
  choice: Isimwagwe
  rationale: Kitenzi cha Kiebrania katika hali ya kutendwa kinaeleza kumiminwa au kuwekwa kwa mafuta. “Isimwagwe” huhifadhi tendo halisi bila kulipanua kuwa cheo cha kiibada.
- source_word: עַל בְּשַׂר אָדָם
  choice: juu ya mwili wa mwanadamu
  rationale: בָּשָׂר ni ‘nyama/mwili,’ na אָדָם hapa humaanisha binadamu kwa ujumla. Kiswahili cha kawaida hutumia ‘mwili wa mwanadamu’ kwa maana hii kwa uwazi na heshima.
- source_word: וּבְמַתְכֻּנְתּוֹ
  choice: kwa mchanganyiko wake
  rationale: מַתְכֹּנֶת huhusu uwiano au muundo uliopimwa wa viungo; “mchanganyiko wake” ni Kiswahili cha kawaida kinachoeleza utungaji huo.
- source_word: לֹא תַעֲשׂוּ כָּמֹהוּ
  choice: msitengeneze nyingine kama hiyo
  rationale: Kauli hii inakataza kutengeneza mafuta mengine yanayofanana na mchanganyiko huo mtakatifu.
- source_word: קֹדֶשׁ הוּא
  choice: Ni takatifu
  rationale: “Takatifu” huhifadhi istilahi kuu ya kibiblia ya קֹדֶשׁ.
- source_word: קֹדֶשׁ יִהְיֶה לָכֶם
  choice: nayo itakuwa takatifu kwenu
  rationale: Tafsiri hii huhifadhi uhusiano unaoonyeshwa na לָכֶם na nguvu ya kauli kwamba mafuta hayo yatambuliwe kuwa yametengwa kwa utakatifu.
theological_decisions:
- issue: Maana ya אָדָם inapotumiwa kwa binadamu kwa ujumla
  choice: mwanadamu
  alternative: binadamu yeyote
  rationale: אָדָם hapa si jina la mtu fulani wala rejeo kwa wanaume pekee; “mwanadamu” huhifadhi umoja wa kisarufi na maana jumuishi bila kuingiza tofauti ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Mwili” limetumiwa katika matini kuu badala ya “nyama” kwa uasilia, huku maana halisi zaidi ikihifadhiwa katika tanbihi.
