translation:
  language: sw
  text: Nawe utawatia mafuta Aroni na wanawe, na kuwaweka wakfu ili wanitumikie kama makuhani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְשָׁח
  choice: utamtia mafuta
  rationale: Kitenzi משׁח hapa kinamaanisha kumpaka au kumtia mafuta ya kuwekwa rasmi kwa huduma takatifu. Kiswahili cha Biblia na cha kawaida hutumia kwa ufasaha ‘kutia mafuta’ katika muktadha huu.
- source_word: וְקִדַּשְׁתָּ
  choice: na kuwaweka wakfu
  rationale: Piel ya קדשׁ ina maana ya kuwatenga kwa matumizi matakatifu. ‘Kuwaweka wakfu’ ni Kiswahili cha sasa, chenye heshima, na kinafaa kwa kuwekwa katika ukuhani.
- source_word: לְכַהֵן
  choice: ili wanitumikie kama makuhani
  rationale: Kitenzi כהן kinamaanisha kutenda kazi ya ukuhani. ‘Kunitumikia kama makuhani’ huonyesha kwa wazi huduma yao ya kikuhani na kusudi la kuwekwa wakfu.
- source_word: לִי
  choice: wani­tumikie
  rationale: Kiambishi cha nafsi katika ‘wanitumikie’ kinahifadhi mwelekeo wa huduma kwa Mungu unaoonyeshwa na לִי, kwa Kiswahili cha asili na kisicho kizito.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linataja wana wa kiume wa Aroni katika muktadha wa ukoo wa kikuhani; ‘wanawe’ hudumisha umahususi huo.
- source_word: וְאֶת ... וְאֶת
  choice: Aroni na wanawe
  rationale: Viashiria vya yambwa vinavyorudiwa vinaunganisha Aroni na wanawe kama waathiriwa wa tendo moja; Kiswahili hakihitaji kuvionyesha kando.
theological_decisions:
- issue: Muktadha wa ibada wa קדשׁ na כהן
  choice: kuwaweka wakfu ili wanitumikie kama makuhani
  alternative: kuwatakasa ili wanihudumie katika ukuhani
  rationale: Usemi uliochaguliwa huhifadhi muktadha rasmi wa kuingizwa katika huduma ya ukuhani bila kuingiza dhana za madhehebu au ofisi za baadaye.
- issue: Uwasilishaji wa jinsia katika בָּנָיו
  choice: wanawe
  alternative: watoto wake
  rationale: Chanzo kinarejelea hasa wana wa kiume wa Aroni katika ukoo wa kikuhani; tafsiri isiyobainisha jinsia ingepunguza umahususi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ‘utamtia mafuta’ unafikika kwa msomaji wa kawaida huku ukihifadhi maana ya kiibada; ‘kuwaweka wakfu’ huepuka istilahi nzito kupita kiasi. Yiqtol na qatal ya mfululizo zimewasilishwa kama maagizo ya baadaye katika muktadha wa taratibu.
