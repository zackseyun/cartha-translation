  yaml_path: translation/ot/exodus/030/033.yaml
  text: Whoever compounds any like it[a], or puts any of it on a stranger[b], shall be cut off from his people.
translation:
  language: sw
  text: Mtu yeyote atakayetengeneza mafuta ya namna hiyo, au atakayempaka mtu asiyeidhinishwa[a] baadhi yake, atatengwa na watu wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mgeni,” “mtu wa nje,” au “mtu ambaye si kuhani.” Katika muktadha huu, neno la Kiebrania zar mara nyingi humaanisha mtu asiye na ruhusa ya kupakwa mafuta haya matakatifu.
    reason: lexical_alternative
  - marker: b
    text: “Atatengwa na watu wake” ni kifungu cha kisheria cha agano; hapa andiko halibainishi namna hasa adhabu hiyo itakavyotekelezwa.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Mtu yeyote atakaye-
  rationale: Kirai hiki kina nguvu ya jumla katika sheria; ‘mtu yeyote’ ni Kiswahili cha kawaida na kinahifadhi maana hiyo bila kuifanya amri ihusu wanaume pekee.
- source_word: יִרְקַח
  choice: atatengeneza mafuta
  rationale: Kitenzi רקח humaanisha kuchanganya au kutengeneza kwa ustadi kitu chenye manukato. Kwa kuwa muktadha unahusu mafuta matakatifu ya upako, ‘atatengeneza mafuta’ ni wazi na ya kawaida kuliko istilahi nzito ya kiufundi.
- source_word: כָּמֹהוּ
  choice: mengine kama hayo
  rationale: Kirai hiki kinarejelea mafuta ya upako yaliyotajwa kabla na kukataza kutengeneza mafuta ya aina hiyo; ‘kama hayo’ kinahifadhi wazo la kufanana bila kudai lazima nakala kamili.
- source_word: וַאֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: au atakayempaka ... baadhi yake
  rationale: Katika muktadha wa mafuta, נתן על ina maana ya kuweka au kupaka juu ya mtu. ‘Atakayempaka ... baadhi yake’ ni usemi wa asili wa Kiswahili na unaonyesha kuwa kinachowekwa ni sehemu ya mafuta hayo.
- source_word: עַל זָר
  choice: mtu asiyeidhinishwa
  rationale: Katika sheria hii ya ibada, זָר ni mtu asiye na ruhusa ya kupakwa mafuta haya matakatifu, si lazima mgeni wa kabila au taifa jingine. Tafsiri hii inaweka wazi mpaka wa matumizi matakatifu.
- source_word: וְנִכְרַת
  choice: atatengwa
  rationale: Hiki ni kifungu cha kisheria cha agano kinachoeleza kuondolewa miongoni mwa jumuiya. ‘Atatengwa’ kinahifadhi matokeo bila kuamua kama adhabu hiyo ni kuuawa, kufukuzwa, au hatua ya Mungu.
- source_word: מֵעַמָּיו
  choice: na watu wake
  rationale: Kiswahili ‘kutengwa na watu wake’ hutoa kwa kawaida maana ya kuondolewa katika jumuiya ya watu wake na kuakisi moja kwa moja מֵעַמָּיו.
theological_decisions:
- issue: Maana ya זָר katika sheria ya kikuhani
  choice: mtu asiyeidhinishwa
  alternative: mgeni; mtu wa nje; mtu asiye kuhani
  rationale: Muktadha unahusu ruhusa ya kupokea mafuta matakatifu, wala si utambulisho wa kikabila. ‘Mtu asiyeidhinishwa’ huepuka kupotosha maana kuwa ni mgeni wa taifa jingine, huku tanbihi ikitaja tafsiri halisi zinazowezekana.
- issue: Nguvu ya adhabu וְנִכְרַת מֵעַמָּיו
  choice: atatengwa na watu wake
  alternative: ataondolewa miongoni mwa watu wake; atauawa
  rationale: Kiebrania kinatumia fomula ya agano bila kubainisha hapa namna adhabu inavyotekelezwa. Tafsiri haipaswi kuamua kimyakimya kuwa ni kifo au kufukuzwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa wakati ujao unaonyesha nguvu ya masharti ya sheria. ‘Mafuta’ yameongezwa kutokana na muktadha wa karibu ili rejeo la ‘kama hayo’ lisikike kwa kawaida katika Kiswahili.
