language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֣י תִשָּׂ֞א אֶת רֹ֥אשׁ בְּנֵֽי יִשְׂרָאֵ֘ל לִ/פְקֻדֵי/הֶם֒ וְ/נָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛/וֹ לַ/יהוָ֖ה בִּ/פְקֹ֣ד אֹתָ֑/ם וְ/לֹא יִהְיֶ֥ה בָ/הֶ֛ם נֶ֖גֶף בִּ/פְקֹ֥ד אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/012.yaml
  text: When you take a census of the sons of Israel according to those numbered among them[a], then each man shall give to Yahweh a ransom for his life when you number them[c][b], so that there will be no plague among them when you number them.
translation:
  language: sw
  text: Utakapowahesabu wana wa Israeli kulingana na walioandikishwa miongoni mwao[a], kila mwanamume atamtolea Yahweh fidia ya uhai wake[b] unapowahesabu, ili kusiwe na pigo miongoni mwao unapowahesabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “utakapoinua kichwa cha wana wa Israeli,” nahau inayomaanisha kuwahesabu katika sensa.
    reason: lexical_alternative
  - marker: b
    text: Au, “fidia kwa ajili yake mwenyewe.” Neno la Kiebrania nefesh mara nyingi humaanisha uhai au mtu mwenyewe, si “roho” pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Utakapo-
  rationale: 'Katika agizo hili la kisheria, kiunganishi hiki kinaweka hali ya wakati unaotarajiwa: sensa itakapofanywa.'
- source_word: תִשָּׂא אֶת רֹאשׁ
  choice: utakapowahesabu
  rationale: Hii ni nahau ambayo kihalisi ni ‘kuinua kichwa,’ lakini hapa humaanisha kuhesabu watu katika sensa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi usemi wa kifamilia na umbo la kiume la Kiebrania; ‘Waisraeli’ pia lingewezekana.
- source_word: לִפְקֻדֵיהֶם
  choice: kulingana na walioandikishwa miongoni mwao
  rationale: Mzizi פקד hapa una maana ya kuhesabu na kuingiza watu katika orodha rasmi.
- source_word: וְנָתְנוּ אִישׁ
  choice: kila mwanamume atampa
  rationale: אִישׁ ina nguvu ya kugawa wajibu kwa kila mwanamume mmoja mmoja katika kundi linalohesabiwa.
- source_word: כֹּפֶר
  choice: fidia
  rationale: Neno hili humaanisha malipo yanayotolewa kwa ajili ya kuokoa uhai au kuzuia hukumu; ‘fidia’ ni neno la kawaida na linalofaa katika Kiswahili.
- source_word: נַפְשׁוֹ
  choice: kwa ajili ya uhai wake
  rationale: נפש hapa hurejelea uhai au nafsi ya mtu mwenyewe, si lazima ‘roho’ kama kitu kisicho na mwili.
- source_word: לַיהוָה
  choice: atampa Yahwe
  rationale: Kihusishi kinaonyesha anayepokea au anayelengwa na malipo, na jina la agano יהוה limetoholewa kuwa ‘Yahwe.’
- source_word: נֶגֶף
  choice: pigo
  rationale: Neno hili linaweza kumaanisha pigo la maangamizi au tauni. ‘Pigo’ huhifadhi upana huo wa maana bila kulibana kuwa ugonjwa pekee.
- source_word: וְלֹא יִהְיֶה בָהֶם נֶגֶף
  choice: ili kusiwe na pigo miongoni mwao
  rationale: ‘Ili’ huwasilisha kwa Kiswahili uhusiano wa kusudi au matokeo kati ya fidia na kuepushwa kwa pigo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya נַפְשׁוֹ katika kanuni ya fidia
  choice: kwa ajili ya uhai wake
  alternative: kwa ajili yake mwenyewe; kwa ajili ya nafsi yake
  rationale: Muktadha unahusu kuhifadhi uhai wa mtu anayehesabiwa. Tafsiri hii haingizi dhana ya baadaye kwamba נפש hapa lazima iwe roho isiyo na mwili.
- issue: Umbo la kijinsia katika בְּנֵי יִשְׂרָאֵל na אִישׁ
  choice: wana wa Israeli ... kila mwanamume
  alternative: Waisraeli ... kila mtu
  rationale: Tafsiri inahifadhi maumbo ya kiume yaliyopo katika chanzo na wajibu wa kila mwanamume anayehesabiwa, bila kuyageuza kimya kimya kuwa lugha isiyoonyesha jinsia.
- issue: Uhusiano kati ya malipo na pigo
  choice: ili kusiwe na pigo
  alternative: na hakutakuwa na pigo
  rationale: Muundo unaweza kueleweka kama kusudi au matokeo. ‘Ili’ huonyesha uhusiano huo bila kufafanua zaidi namna fidia inavyofanya kazi kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya ‘unapowahesabu’ yamehifadhiwa kwa sababu yanarudia msisitizo wa maandishi ya Kiebrania; ‘walioandikishwa’ huhifadhi dhana ya orodha rasmi ya sensa.
