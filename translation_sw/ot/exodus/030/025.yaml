  text: And you shall make it a holy anointing oil[a], a perfume blended by the work of a perfumer; it shall be a holy anointing oil.
translation:
  language: sw
  text: Nawe utatengeneza mafuta matakatifu ya upako[a], mchanganyiko wa manukato uliotengenezwa kwa ustadi wa mtengenezaji wa manukato; yatakuwa mafuta matakatifu ya upako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafuta ya upako matakatifu”; Kiebrania hukazia maandalizi ya vitu vya kunukia yaliyochanganywa kwa ustadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utaifanya
  rationale: Kitenzi cha Qal katika muktadha huu wa maagizo kina nguvu ya amri. Muundo wa wakati ujao katika Kiswahili unadumisha sajili rasmi ya maagizo, huku kiambishi cha kitu kikirejelea mchanganyiko uliotajwa katika mstari uliotangulia.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: mafuta matakatifu ya kutia wakfu
  rationale: Muundo huu unahifadhi maana ya mafuta yaliyotengwa kwa matumizi matakatifu ya upako. ‘Kutia wakfu’ hapa huonyesha kusudi la upako bila kudokeza dhehebu fulani.
- source_word: רֹקַח מִרְקַחַת
  choice: mchanganyiko wenye harufu nzuri
  rationale: 'Maneno yanayohusiana yanasisitiza maandalizi ya vitu vya kunukia vilivyochanganywa kwa ustadi. Kiswahili hiki ni cha kawaida na kinaeleza sifa zote mbili: kuchanganywa na kuwa na harufu nzuri.'
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: uliotengenezwa kwa ustadi wa mtengenezaji wa manukato
  rationale: Kirai kihalisi ni ‘kazi ya mchanganyaji/mtengenezaji wa manukato.’ Tafsiri hii inaonyesha kuwa ni kazi ya fundi stadi wa kuchanganya vitu vya kunukia.
- source_word: יִהְיֶה
  choice: yatakuwa
  rationale: Kauli hii inaeleza hali ya mwisho ya mafuta baada ya kutayarishwa, na wingi wa kisarufi unapatana na nomino ‘mafuta’ katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maagizo ya ibada lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya ‘mafuta matakatifu ya kutia wakfu’ yamehifadhiwa kwa kuwa yapo katika Kiebrania na yanasisitiza utambulisho na kusudi la mafuta hayo.
