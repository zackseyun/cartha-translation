base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/029.yaml
  text: You shall consecrate them[a], and they shall be most holy. Whatever touches them shall become holy.
translation:
  language: sw
  text: Utaviweka wakfu, navyo vitakuwa vitakatifu sana. Mtu yeyote au kitu chochote kitakachovigusa kitakuwa kitakatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na Kiebrania, “atakuwa au kitakuwa kitakatifu” au “atawekwa au kitawekwa wakfu.” Kiebrania kinaweza kumaanisha kuingia katika hali ya utakatifu kwa kuvigusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  choice: Utaviweka wakfu
  rationale: Kitenzi קדשׁ katika Piel hapa humaanisha kutenga kwa matumizi matakatifu; “kuweka wakfu” ni Kiswahili cha sasa, cha heshima, na kinafaa katika muktadha wa ibada.
- source_word: אֹתָם
  choice: vi-
  rationale: Kiwakilishi kinarejelea vifaa na vitu vya hema vilivyotajwa katika muktadha; ngeli ya vi- inawakilisha kwa kawaida vitu hivyo kwa Kiswahili.
- source_word: וְהָיוּ
  choice: navyo vitakuwa
  rationale: Muundo huu unaonyesha hali itakayotokana na kuwekwa wakfu, huku “navyo” ikiunganisha sentensi kwa njia ya kawaida.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: vitakatifu sana
  rationale: Huu ni muundo wa Kiebrania wa kiwango cha juu zaidi cha utakatifu. “Vitakatifu sana” ni wa kawaida na huepuka maana ya mahali inayoweza kudokezwa na “patakatifu pa patakatifu.”
- source_word: כָּל הַנֹּגֵעַ
  choice: Chochote kitakachovigusa
  rationale: Kirai hiki ni cha jumla na kinaweza kumhusu mtu au kitu. “Chochote” huhifadhi upana huo, ingawa Kiswahili hutumia ngeli ya kitu katika muundo huu.
- source_word: בָּהֶם
  choice: -vi-
  rationale: Kiwakilishi kinarejelea vitu vilivyowekwa wakfu vilivyotangulia.
- source_word: יִקְדָּשׁ
  choice: kitakuwa kitakatifu
  rationale: Qal imperfect ya קדשׁ inaweza kueleza hali inayopatikana kwa kugusa. Tafsiri hii huhifadhi usemi mfupi wa Kiebrania bila kuamua zaidi namna au matokeo ya utakatifu huo.
theological_decisions:
- issue: Maana ya utakatifu unaopatikana kwa kugusa
  choice: Kugusa vitu hivyo kunafanya mgusaji awe mtakatifu, bila kufafanua kama hali hiyo ni ya manufaa, ya hatari, au ina masharti ya kiibada.
  alternative: Kugusa kunamweka mgusaji wakfu kwa maana chanya pekee, au kunamweka katika eneo lenye masharti na hatari ya utakatifu.
  rationale: Kiebrania kinasema tu יִקְדָּשׁ. Tafsiri huhifadhi mvutano huo wa kiteolojia badala ya kuingiza ufafanuzi kutoka mfumo mpana wa taratibu za ibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kuweka wakfu” limetumiwa kwa tendo la kutenga kwa matumizi matakatifu; “vitakatifu sana” linaonyesha superlative ya Kiebrania kwa lugha inayoeleweka kwa urahisi.
