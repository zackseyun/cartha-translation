- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Kitenzi דבר katika fomula ya simulizi kinaonyesha hatua mpya ya hotuba; “akasema na” ni Kiswahili cha sasa kinachodumisha wazo la Mungu kuzungumza na Musa.
- source_word: יְהוָה
