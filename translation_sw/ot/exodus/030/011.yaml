  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa na cheo, hivyo kudumisha jina binafsi lililo katika matini ya Kiebrania.
- source_word: אֶל
  choice: na
  rationale: Baada ya “akasema,” kihusishi אֶל kinatafsiriwa kwa kawaida kuwa “na” katika muundo wa Kiswahili “kusema na mtu.”
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ndilo umbo la kawaida la jina מֹשֶׁה katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Neno hili linatanguliza yaliyomo katika hotuba ya moja kwa moja; “akisema” linadumisha fomula ya Kiebrania na kuunganisha mstari huu na maneno yanayofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo, huku tanbihi ikieleza mapokeo mengine ya kulitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “akisema” umehifadhiwa kwa sababu mstari huu ni fomula ya utangulizi wa hotuba inayoendelea katika mstari unaofuata.
