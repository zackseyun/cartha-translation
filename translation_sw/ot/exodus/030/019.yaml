  yaml_path: translation/ot/exodus/030/019.yaml
  text: Aaron and his sons shall wash their hands and their feet from it[a].
translation:
  language: sw
  text: Haruni na wanawe wataosha mikono yao na miguu yao kwa maji kutoka humo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kutoka humo,” yaani kutoka katika birika lililotajwa katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: wataosha
  rationale: Katika muktadha huu wa maagizo, umbo hili lina nguvu ya kuelekeza tendo linalopaswa kufanywa; “wataosha” linadumisha sauti ya kisheria kwa Kiswahili cha kawaida.
- source_word: אַהֲרֹן
  choice: Haruni
  rationale: Hili ndilo umbo la kawaida la jina hili katika mapokeo ya Biblia ya Kiswahili.
- source_word: וּבָנָיו
  choice: na wanawe
  rationale: Katika muktadha wa huduma ya ukuhani, neno hili linawahusu wana wa kiume wa Haruni, si watoto wake kwa ujumla.
- source_word: מִמֶּנּוּ
  choice: kwa maji kutoka humo
  rationale: Kihalisi ni “kutoka humo,” likirejelea birika lililotajwa katika muktadha. Kiswahili huhitaji kubainisha chombo cha kuoshea ili maana iwe wazi na ya kawaida; “maji” yametolewa wazi kwa kuzingatia muktadha.
- source_word: אֶת יְדֵיהֶם
  choice: mikono yao
  rationale: Hiki ni kirai cha moja kwa moja kinachotaja sehemu ya mwili inayopaswa kuoshwa.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: na miguu yao
  rationale: Hiki kinaunganisha sehemu ya pili ya mwili inayopaswa kuoshwa.
theological_decisions:
- issue: Rejeleo la kikuhani linalobainisha jinsia
  choice: na wanawe
  alternative: na watoto wake
  rationale: Aya inamhusu Haruni pamoja na wanawe wa kiume wanaohudumu katika ukuhani; tafsiri haipanui rejeleo hilo kuwa watoto wote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wataosha” limetumiwa kwa sauti ya agizo; “kwa maji kutoka humo” ni wazi na ya asili zaidi kuliko “kutoka humo” peke yake, huku tanbihi ikihifadhi muundo wa karibu zaidi na Kiebrania.
