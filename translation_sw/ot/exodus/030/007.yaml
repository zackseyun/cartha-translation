  yaml_path: translation/ot/exodus/030/007.yaml
  text: Aaron shall burn fragrant incense on it morning by morning[a]; when he tends the lamps[b], he shall burn it.
translation:
  language: sw
  text: Haruni atafukiza juu yake uvumba wa manukato kila asubuhi[a]; anapozihudumia taa[b], ataufukiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asubuhi baada ya asubuhi.” Kurudiwa kwa neno hilo katika Kiebrania kunasisitiza desturi ya kawaida ya kila siku.
    reason: lexical_alternative
  - marker: b
    text: Au, “anapopunguza tambi za taa.” Kitenzi cha Kiebrania kinaweza kumaanisha kwa namna mahususi zaidi kuziweka taa katika hali inayofaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: atafukiza
  rationale: Katika muktadha wa ibada, Hiphil ya קטר humaanisha kuufanya uvumba utoe moshi juu ya madhabahu. “Kufukiza” ni neno la kawaida na sahihi kwa tendo hilo katika Kiswahili.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kiwakilishi kinarejelea madhabahu ya uvumba iliyotajwa katika muktadha uliotangulia na kinahifadhi maana ya mahali.
- source_word: קְטֹרֶת סַמִּים
  choice: uvumba wa manukato
  rationale: Kְטֹרֶת ni uvumba, na סַמִּים hueleza viungo vyenye harufu nzuri vilivyotumiwa kuutengeneza. Kauli hii ni ya asili katika Kiswahili na haiongezi maelezo yasiyokuwamo.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: kila asubuhi
  rationale: Kurudiwa kwa “asubuhi” katika Kiebrania kunaonyesha desturi ya kila siku. “Kila asubuhi” huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku umbo la karibu zaidi na marudio likiwekwa katika tanbihi.
- source_word: בְּהֵיטִיבוֹ
  choice: anapozihudumia
  rationale: Hiphil ya יטב hapa inahusu kuziweka taa katika hali nzuri na tayari kutumika. “Kuzihudumia” ni pana vya kutosha kujumuisha kupunguza tambi na kuzipanga bila kubainisha kitendo kimoja pekee.
- source_word: הַנֵּרֹת
  choice: taa
  rationale: Hizi ni taa za mahali patakatifu zinazojulikana tayari kutokana na muktadha; “taa” linatosha bila nyongeza.
- source_word: יַקְטִירֶנָּה
  choice: ataufukiza
  rationale: Kiambishi cha yambwa cha ngeli ya u- kinarejelea “uvumba” na kuhifadhi urejeo wa kiwakilishi cha Kiebrania bila kurudia nomino.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kufukiza uvumba” na “uvumba wa manukato” ni misemo inayoeleweka katika muktadha wa ibada; “kuzihudumia taa” huhifadhi upana wa tendo la Kiebrania.
