    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹאָם
  choice: Wanapoingia
  rationale: Muundo wa ב pamoja na kitenzi-jina na kiambishi cha nafsi una maana ya wakati; ‘wanapoingia’ ni Kiswahili cha asili na huonyesha kuingia ndani ya hema.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni jina la mahali patakatifu ambapo Yahweh hukutana na watu wake; ‘hema la kukutania’ ni tafsiri iliyo wazi na ya kawaida katika Kiswahili cha Biblia.
- source_word: יִרְחֲצוּ מַיִם
  choice: watajiosha kwa maji
  rationale: Kitenzi רחץ pamoja na מַיִם kinaonyesha kuosha kwa maji; umbo la kujirejelea linaweka wazi kwamba makuhani wenyewe wanapaswa kuosha miili yao.
- source_word: וְלֹא יָמֻתוּ
  choice: ili wasife
  rationale: Ingawa kwa umbo ni kishazi kilichounganishwa, katika muktadha kinaeleza kusudi au tokeo la kuosha na kuhifadhi uzito wa onyo la kifo.
- source_word: בְגִשְׁתָּם אֶל־הַמִּזְבֵּחַ
  choice: wanapoukaribia madhabahu
  rationale: נגשׁ humaanisha kusogea au kukaribia, hasa katika huduma ya ibada; ‘kuikaribia madhabahu’ huhifadhi maana ya kimwili na ya kiibada.
- source_word: לְשָׁרֵת
  choice: ili kuhudumu
  rationale: Katika muktadha wa ukuhani, ‘kuhudumu’ huonyesha utumishi rasmi wa mahali patakatifu kuliko neno pana ‘kutumikia.’
- source_word: לְהַקְטִיר
  choice: kwa kuteketeza
  rationale: Hifili ya קטר huonyesha kufanya sadaka ipae kwa moshi kutoka madhabahuni; ‘kuteketeza’ ni ya kawaida na inafaa muktadha wa dhabihu.
- source_word: אִשֶּׁה
  choice: sadaka ya kuteketezwa kwa moto
  rationale: Neno hili hurejelea sadaka inayotolewa kwa moto. Tafsiri hii huepuka kuamua kwamba maana yake lazima iwe ‘sadaka ya chakula,’ huku ikiweka wazi namna ya kuitoa.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Kihusishi ל kinaonyesha anayepokea sadaka, na jina la agano יהוה limetolewa moja kwa moja kama ‘Yahweh.’
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja; ‘Yahweh’ huhifadhi jina la agano bila kulibadilisha kuwa cheo.
- issue: Kishazi cha adhabu וְלֹא יָמֻתוּ
  choice: ili wasife
  alternative: na hawatakufa / wasije wakafa
  rationale: Tafsiri hii inaeleza uhusiano wa kusudi au tokeo unaodokezwa na muktadha, bila kupunguza onyo halisi la kifo.
- issue: Maana ya אִשֶּׁה
  choice: sadaka ya kuteketezwa kwa moto
  alternative: sadaka ya chakula / sadaka ya moto
  rationale: Asili na upeo kamili wa istilahi hii ya dhabihu vina mjadala. Tafsiri iliyochaguliwa hushikamana na namna ya kuitoa kwa moto na haingizi kwa lazima wazo la chakula.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa msomaji wa kawaida. Alama ya koma mwishoni imehifadhiwa kwa kuwa sentensi inaendelea katika mstari unaofuata.
