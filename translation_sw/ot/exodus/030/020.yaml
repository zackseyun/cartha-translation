  text: When they enter the tent of meeting[a], they shall wash with water, so that they may not die; or when they come near the altar to minister, to burn a food offering to Yahweh[b],
translation:
  language: sw
  text: Wanapoingia katika hema la kukutania, watajinawa kwa maji ili wasife[a]; au wanapoikaribia madhabahu ili kuhudumu, kwa kuteketeza sadaka ya moto kwa Yahweh[b],
  philosophy: optimal-equivalence
  footnotes:
