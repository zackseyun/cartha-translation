base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/003.yaml
  text: You shall overlay it with pure gold—its top[a], its walls all around, and its horns—and you shall make for it a gold molding all around.
translation:
  language: sw
  text: Utaifunika kwa dhahabu safi—sehemu yake ya juu, kuta zake pande zote, na pembe zake—na utaitengenezea ukingo[a] wa dhahabu kuizunguka pande zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taji ya dhahabu.” Neno la Kiebrania zer linaweza kumaanisha ukingo, mpaka wa mapambo, au kitu kama taji kinachozunguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: utaifunika kwa
  rationale: Kitenzi צפה pamoja na nyenzo kinaonyesha kuweka tabaka la dhahabu juu ya kitu. ‘Kuifunika kwa dhahabu’ ni Kiswahili cha kawaida kinachoeleweka katika muktadha wa utengenezaji.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Hili ni tamko la kawaida na la moja kwa moja kwa dhahabu isiyo na mchanganyiko au uchafu.
- source_word: גַּגּוֹ
  choice: sehemu yake ya juu
  rationale: Ingawa גג mara nyingi humaanisha paa, hapa inarejelea uso wa juu wa madhabahu ndogo; ‘sehemu yake ya juu’ ni wazi na ya asili zaidi.
- source_word: קִירֹתָיו
  choice: kuta zake
  rationale: Tafsiri hii inadumisha taswira halisi ya קִירוֹת huku ikibaki wazi kwamba ni nyuso zilizosimama za madhabahu.
- source_word: סָבִיב
  choice: pande zote / kuizunguka pande zote
  rationale: Maneno haya yanawasilisha wazo la kuzunguka kitu kikamilifu na pia yanahifadhi kurudiwa kwa neno hilo katika Kiebrania.
- source_word: קַרְנֹתָיו
  choice: pembe zake
  rationale: ‘Pembe’ ndilo neno la kawaida la Kiswahili kwa sehemu zilizochomoza kama pembe kwenye madhabahu, na linahifadhi istilahi ya kiibada bila kuifafanua kupita kiasi.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: na utaitengenezea
  rationale: Muundo huu wa Kiswahili unawakilisha kwa ufupi maana ya kutengeneza kitu kwa ajili ya madhabahu.
- source_word: זֵר זָהָב
  choice: ukingo wa dhahabu
  rationale: זֵר hapa ni ukingo wa mapambo unaozunguka samani takatifu. ‘Ukingo’ unaeleza umbo la kitu bila kulazimisha taswira ya kifalme ya ‘taji.’
theological_decisions:
- issue: Istilahi za samani za ibada
  choice: Kutumia ‘pembe’ kwa קַרְנֹתָיו na ‘ukingo’ kwa זֵר.
  alternative: Kutumia ‘taji’ kwa זֵר.
  rationale: Aya inaeleza muundo wa madhabahu, si kutoa dai la moja kwa moja kuhusu ufalme. ‘Pembe’ inadumisha kipengele halisi cha madhabahu, na ‘ukingo’ inaeleza kwa urahisi sehemu iliyozunguka madhabahu. Maana mbadala ya ‘taji’ imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa sentensi unafuata mfululizo wa Kiebrania huku ukitumia ‘sehemu yake ya juu’ na ‘utaitengenezea’ kwa ufasaha wa kawaida.
