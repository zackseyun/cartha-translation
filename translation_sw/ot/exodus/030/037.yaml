base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/037.yaml
  text: And the incense that you make according to its composition[a], you shall not make for yourselves[b]; it shall be holy to you for Yahweh.
translation:
  language: sw
  text: Na uvumba utakaoutengeneza kwa kadiri ya mchanganyiko wake[a], msijitengenezee[b]. Utakuwa mtakatifu kwako, kwa ajili ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa fomula yake” au “kwa uwiano wake.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, mchanganyiko huu mtakatifu wa uvumba haukupaswa kutengenezwa tena kwa matumizi ya kawaida ya mtu binafsi.
    reason: cultural_note
lexical_decisions:
- source_word: הַקְּטֹרֶת
  choice: uvumba
  rationale: “Uvumba” ni neno la kawaida na lenye hadhi kwa dutu inayofukizwa, na hapa linarejelea mchanganyiko mtakatifu ulioelezwa katika muktadha wa karibu.
- source_word: אֲשֶׁר תַּעֲשֶׂה
  choice: utakaoutengeneza
  rationale: Huhifadhi kishazi rejeshi na umoja wa kitenzi cha Kiebrania, huku likisomeka kwa kawaida katika Kiswahili cha sasa.
- source_word: בְּמַתְכֻּנְתָּהּ
  choice: kwa mchanganyiko wake
  rationale: Neno מַתְכֹּנֶת hapa linaweza kumaanisha muundo, fomula, au uwiano uliowekwa wa viungo. “Mchanganyiko wake” ni ya kawaida na haileti dhana ya kisayansi kupita kiasi; tanbihi huhifadhi maana nyingine zinazowezekana.
- source_word: לֹא תַעֲשׂוּ לָכֶם
  choice: msijitengenezee kwa ajili yenu wenyewe
  rationale: Huhifadhi katazo la wingi na maana ya kujitengenezea uvumba huo kwa matumizi au milki binafsi, bila kulifanya jambo hilo kuwa maalumu zaidi kuliko chanzo.
- source_word: קֹדֶשׁ
  choice: mtakatifu
  rationale: Hili ndilo neno la kawaida la kibiblia kwa hadhi ya kuwa wakfu au kutengwa kwa Mungu. Chanzo hakisemi “mtakatifu sana” katika mstari huu.
- source_word: תִּהְיֶה לְךָ
  choice: utakuwa mtakatifu kwako
  rationale: 'Huhifadhi umoja wa kitenzi kinachorejelea uvumba na nguvu ya uhusiano ya לְךָ: anayesemeshwa anapaswa kuuhesabu kuwa mtakatifu.'
- source_word: לַיהוָה
  choice: kwa ajili ya Yahweh
  rationale: Kihusishi kinaonyesha kuwekwa wakfu au kuwa mali ya Yahweh. “Kwa ajili ya Yahweh” linafaa kwa maana hiyo, na jina la agano יהוה limetolewa kama “Yahweh.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה. “Yahweh” huhifadhi jina hilo badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu fulani.
- issue: Hadhi ya uvumba
  choice: utakuwa mtakatifu kwako kwa ajili ya Yahweh
  alternative: utakuwa mali takatifu ya Yahweh
  rationale: 'Tafsiri iliyochaguliwa huhifadhi mvutano na uhusiano wa sentensi ya Kiebrania: uvumba ni mtakatifu kwa anayesemeshwa na umewekwa kwa ajili ya Yahweh. Mbadala ungeweza kufanya dhana ya umiliki kuwa wazi zaidi kuliko maandishi yenyewe.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mabadiliko ya chanzo kutoka umoja (“utakaoutengeneza,” “kwako”) kwenda wingi (“msijitengenezee”) yamehifadhiwa kadiri sarufi ya Kiswahili inavyoruhusu. Alama zote za tanbihi zimewekwa katika matini kuu.
