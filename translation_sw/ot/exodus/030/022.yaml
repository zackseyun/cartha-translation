lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akasema
  rationale: Kitenzi דבר katika fomula ya usemi wa Mungu kinaonyesha hatua mpya katika simulizi. Kiswahili cha kawaida hutumia “akasema” kwa usemi unaoelekezwa kwa mtu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja badala ya kubadilishwa na cheo “BWANA.”
- source_word: אֶל
  choice: na
  rationale: Katika muundo wa Kiswahili “kusema na mtu,” kihusishi hiki humtambulisha anayeelekezewa maneno kwa njia ya kawaida na iliyo wazi.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Jina-kitenzi hili hutanguliza yaliyomo katika usemi. Kwa kuwa maneno yenyewe yanaanza katika mstari unaofuata, nukta mbili huwasilisha kazi hiyo kwa Kiswahili cha sasa bila fomula nzito ya “akisema.”
- source_word: וַ
  choice: Kisha
  rationale: Kiambishi hiki kinaendeleza mfuatano wa simulizi; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha na cheo, huku tanbihi ikieleza desturi nyingine ya kulitafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo mfupi unahifadhi fomula ya utangulizi wa usemi, huku nukta mbili zikionyesha kwamba ujumbe unaanza katika mstari unaofuata.
