base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/035.yaml
  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
translation:
  language: sw
  text: Nawe utautengeneza kuwa uvumba[a], mchanganyiko wa manukato uliotengenezwa kwa ustadi wa mtengenezaji wa manukato, uliotiwa chumvi[b], safi, na mtakatifu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mchanganyiko wa vitu vyenye harufu nzuri.” Kiebrania kinakazia maandalizi yenye harufu yaliyotengenezwa kwa kuchanganywa kwa uangalifu.
    reason: lexical_alternative
  - marker: b
    text: Au “uliochanganywa na chumvi.”
    reason: lexical_alternative
  - marker: c
    text: Au “uliowekwa wakfu.” Kiebrania kinasema “mtakatifu,” si “mtakatifu sana” katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utautengeneza
  rationale: Katika muktadha wa maagizo, kitenzi hiki chenye kiunganishi kina nguvu ya amri. Muundo huu unahifadhi mtindo wa kisheria na wa maagizo kwa Kiswahili cha kawaida.
- source_word: אֹתָהּ
  choice: -u-
  rationale: Kiwakilishi cha yambwa kinarejelea mchanganyiko wa viungo uliotajwa katika mstari uliotangulia; ngeli ya uvumba/mchanganyiko inaonyeshwa kiasili ndani ya kitenzi.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Neno hili humaanisha mchanganyiko wa vitu vyenye harufu nzuri unaoteketezwa; “uvumba” ndilo neno sanifu na sahihi katika muktadha huu.
- source_word: רֹקַח
  choice: mchanganyiko wa manukato
  rationale: Neno linakazia maandalizi ya vitu vya harufu vilivyochanganywa kwa uangalifu. Tafsiri hii ni wazi na ya asili bila kupunguza wazo la mchanganyiko uliotengenezwa kwa ustadi.
- source_word: מַעֲשֵׂה רוֹקֵחַ
  choice: uliotengenezwa kwa ustadi wa mtengenezaji wa manukato
  rationale: Kihalisi ni kazi ya mchanganyaji au mtengenezaji wa manukato. Uamuzi huu unahifadhi wazo la ufundi maalumu huku ukisomeka kwa urahisi.
- source_word: מְמֻלָּח
  choice: uliotiwa chumvi
  rationale: Umbo la kutendwa la mzizi unaohusiana na chumvi linaelekea kumaanisha kutiwa au kuchanganywa na chumvi. Tafsiri hii inahifadhi maana halisi bila kuamua zaidi namna ya uchanganyaji.
- source_word: טָהוֹר
  choice: safi
  rationale: Katika muktadha wa ibada na kitu kilichoandaliwa, “safi” huwasilisha usafi wa kimada na wa kiibada kwa Kiswahili cha sasa.
- source_word: קֹדֶשׁ
  choice: mtakatifu
  rationale: Neno linaonyesha kwamba uvumba umetengwa kwa matumizi matakatifu. “Mtakatifu” ni tafsiri ya moja kwa moja; mstari huu hausemi “mtakatifu sana.”
theological_decisions:
- issue: Hadhi ya kiibada ya uvumba
  choice: mtakatifu
  alternative: uliowekwa wakfu; mtakatifu sana
  rationale: Kiebrania kinasema tu “takatifu” bila muundo wa kiwango cha juu. Tafsiri haiongezi hadhi ya “mtakatifu sana” ambayo mstari huu hauitaji waziwazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi unafuata orodha ya sifa za Kiebrania huku viunganishi vikisaidia usomaji wa asili.
