  yaml_path: translation/ot/exodus/030/038.yaml
  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
translation:
  language: sw
  text: Yeyote atakayetengeneza uvumba kama huo ili kunusa harufu yake[a] atatengwa na watu wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili kufurahia harufu yake.” Kauli ya Kiebrania inaonyesha kutengeneza uvumba huo kwa ajili ya kuunusa au kufurahia harufu yake mwenyewe.
    reason: lexical_alternative
  - marker: b
    text: “Atatengwa na watu wake” ni kauli ya kawaida ya kisheria. Kulingana na muktadha, inaweza kumaanisha kifo, kufukuzwa katika jamii, au kuondolewa kwa hukumu ya Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Yeyote
  rationale: Katika sheria hii, neno la Kiebrania linalomaanisha kihalisi ‘mtu/mwanamume’ linatumika kwa maana ya jumla; ‘yeyote’ ni ya asili na huhifadhi muundo wa sharti.
- source_word: יַעֲשֶׂה
  choice: atakayetengeneza
  rationale: Kitenzi עשה kina maana pana ya kufanya au kutengeneza; hapa kinahusu kuandaa mchanganyiko wa uvumba.
- source_word: כָמֹהָ
  choice: uvumba kama huo
  rationale: Kinarejelea uvumba mtakatifu wa mistari iliyotangulia na kuonyesha mchanganyiko unaofanana nao bila kuamua ikiwa lazima ufanane kwa kila jambo.
- source_word: לְהָרִיחַ בָּהּ
  choice: ili kunusa harufu yake
  rationale: Hueleza kusudi la kutengeneza uvumba huo kwa ajili ya kuunusa binafsi; Kiswahili hiki ni wazi na cha kawaida huku kidokezo kikihifadhi wazo linalowezekana la kufurahia harufu.
- source_word: וְנִכְרַת
  choice: atatengwa
  rationale: Neno hili ni kauli ya kawaida ya kisheria kuhusu kuondolewa kwa uzito kutoka katika jamii. ‘Atatengwa’ huhifadhi maana ya kuondolewa bila kubainisha njia ya adhabu.
- source_word: מֵעַמָּיו
  choice: na watu wake
  rationale: Muundo ‘kutengwa na watu wake’ ni Kiswahili cha asili kinachoonyesha kuondolewa kutoka kwa jamii au watu ambao mtu huyo ni sehemu yao.
theological_decisions:
- issue: Maana ya adhabu ya וְנִכְרַת מֵעַמָּיו
  choice: atatengwa na watu wake
  alternative: atauawa / atafukuzwa kutoka katika jamii / ataondolewa kwa hukumu ya Mungu
  rationale: Kauli ya Kiebrania ni nzito lakini haibainishi kila mara namna ya kuondolewa. Tafsiri haipaswi kuamua ikiwa ni kifo, kufukuzwa, au hukumu ya moja kwa moja ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Uvumba’ imeongezwa kwa uwazi kutokana na muktadha wa karibu; ‘atatengwa na watu wake’ huhifadhi uzito na utata wa kauli ya kisheria ya Kiebrania.
