base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/036.yaml
  text: And you shall grind some of it very fine[a], and put some of it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy for you.
translation:
  language: sw
  text: Utasaga baadhi yake mpaka iwe laini sana, nawe utaweka baadhi yake mbele ya Ushuhuda katika hema la kukutania, mahali nitakapokutana nawe. Uvumba huo utakuwa mtakatifu kabisa kwenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “takatifu kuliko vyote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַקְתָּ מִמֶּנָּה הָדֵק
  choice: Utasaga sehemu yake mpaka iwe unga laini sana
  rationale: Kitenzi שׁחק kinaonyesha kuponda au kusaga uvumba uwe unga; מִמֶּנָּה ina maana ya sehemu ya mchanganyiko, na הָדֵק inasisitiza ulaini mkubwa wa unga huo.
- source_word: וְנָתַתָּה מִמֶּנָּה
  choice: kisha utaweka sehemu yake
  rationale: נתן hapa ni kuweka katika mahali pa ibada, huku usemi wa sehemu ukihifadhi maana ya kwamba si mchanganyiko wote unaowekwa hapo.
- source_word: לִפְנֵי הָעֵדֻת
  choice: mbele ya Ushuhuda
  rationale: Tafsiri hii inahifadhi istilahi ya ibada iliyo katika Kiebrania bila kuibainisha kwa ziada kuwa sanduku au mbao za agano.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika hema la kukutania
  rationale: Huu ni usemi wa kawaida na unaoeleweka kwa mahali maalumu ambapo Mungu alikutana na watu wake.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: mahali nitakapokutana nawe
  rationale: Niphal ya יעד hapa inaeleza mkutano uliowekwa; umoja wa 'nawe' unahifadhi anayeambiwa moja kwa moja.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: mtakatifu kabisa
  rationale: Huu ni muundo wa Kiebrania unaoonyesha kiwango cha juu kabisa cha utakatifu; Kiswahili hiki ni cha kawaida na chenye hadhi.
- source_word: תִּהְיֶה לָכֶם
  choice: Utakuwa ... kwenu
  rationale: Usemi huu unahifadhi hali ya uvumba kuhusiana na jamii bila kuongeza wazo la umiliki lisilotajwa wazi.
theological_decisions:
- issue: Kinachorejelewa na neno הָעֵדֻת ('Ushuhuda')
  choice: Kuhifadhi 'Ushuhuda' katika matini kuu
  alternative: sanduku la Ushuhuda; mbao za agano
  rationale: Kiebrania kinataja Ushuhuda wenyewe, wala hakitaji wazi sanduku au mbao; tafsiri haipaswi kubana maana kuliko chanzo.
- issue: Namna ya kutafsiri kiwango cha juu cha utakatifu katika קֹדֶשׁ קָדָשִׁים
  choice: mtakatifu kabisa
  alternative: takatifu pa patakatifu
  rationale: Tafsiri kuu inawasilisha maana ya kiwango cha juu kwa Kiswahili cha kawaida, huku tafsiri ya karibu zaidi na muundo wa Kiebrania ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Neno la kiibada “Ushuhuda” limeandikwa kwa herufi kubwa ili kuonyesha matumizi yake maalumu katika muktadha huu. Alama ya tanbihi imewekwa baada ya kirai cha utakatifu ambacho tanbihi inakifafanua.
