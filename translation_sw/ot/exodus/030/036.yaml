  to: Utasaga baadhi yake mpaka iwe laini sana, nawe utaweka baadhi yake mbele ya Ushuhuda katika hema la kukutania, mahali nitakapokutana nawe. Uvumba huo utakuwa mtakatifu kabisa kwenu.[a]
  rationale: Marekebisho yanaweka rejea ya “uvumba” wazi katika kauli ya mwisho, yanatumia “baadhi yake” kwa maana ya partitive iliyo ya kawaida zaidi, na yanarekebisha tanbihi ili iwasilishe nguvu ya superlative ya קֹדֶשׁ קָדָשִׁים kwa Kiswahili cha asili. Hakuna tafsiri ya kiteolojia iliyoongezwa; “Ushuhuda” imehifadhiwa bila kuibainisha kuwa sanduku au mbao.
