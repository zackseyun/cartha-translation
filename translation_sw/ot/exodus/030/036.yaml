  terminology: “Hema la kukutania” na “Ushuhuda” ni istilahi zinazofaa. “Mtakatifu kabisa” huwasilisha vizuri קֹדֶשׁ קָדָשִׁים kwa uvumba; tanbihi inapaswa kutoa mbadala wa karibu unaosomeka kwa Kiswahili bila kuugeuza kuwa jina la chumba kitakatifu.
