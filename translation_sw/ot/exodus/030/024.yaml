  text: and cassia[a], five hundred shekels by the sanctuary shekel, and a hin of olive oil.
translation:
  language: sw
  text: na kasia[a], shekeli mia tano kwa shekeli ya patakatifu, na hini moja[b] ya mafuta ya zeituni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kasía ni aina ya gome lenye harufu nzuri, linalotumiwa kama kiungo cha manukato.
    reason: lexical_note
  - marker: b
    text: Hini ilikuwa kipimo cha kale cha ujazo; wengi hukadiria kuwa ilikuwa karibu lita 3.5 hadi 4.
    reason: cultural_note
lexical_decisions:
- source_word: קִדָּה
  choice: mdalasini
  rationale: Neno hili linamaanisha kasia, yaani gome lenye harufu nzuri linalotumika kutengeneza manukato. “Mdalasini” ni jina la kawaida na linaloeleweka kwa urahisi katika Kiswahili, huku tanbihi ikibainisha kwa usahihi zaidi aina inayokusudiwa.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: mia tano
  rationale: Hii ni tafsiri ya moja kwa moja ya idadi inayotaja uzito wa kiungo hicho.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai hiki kinaonyesha kiwango rasmi cha uzito kilichotumiwa kupimia. “Kwa kipimo cha” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kudokeza kuwa shekeli hapa ni sarafu tu.
- source_word: שֶׁמֶן זַיִת
  choice: mafuta ya zeituni
  rationale: Hii ndiyo namna ya kawaida na ya asili katika Kiswahili ya kutaja mafuta yanayotokana na zeituni.
- source_word: הִין
  choice: hini moja
  rationale: Jina la kipimo cha kale limehifadhiwa badala ya kubadilishwa kuwa makadirio ya kisasa; tanbihi inaeleza ujazo wake unaokadiriwa.
- source_word: וְ
  choice: na
  rationale: Kiunganishi kimehifadhiwa kwa sababu mstari huu unaendelea na orodha ya viungo kutoka mstari uliotangulia.
