base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/013.yaml
  text: 'This is what everyone who passes over to those who are numbered shall give: half a shekel according to the sanctuary shekel (the shekel is twenty gerahs)[a], half a shekel as an offering to Yahweh.'
translation:
  language: sw
  text: 'Kila anayehesabiwa miongoni mwa walioandikishwa atatoa hivi: nusu shekeli kwa kipimo cha shekeli ya patakatifu (shekeli moja ni gera ishirini), nusu shekeli kama sadaka kwa Yahweh.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila apitaye kati ya waliohesabiwa”; huu ni msemo wa Kiebrania unaotumiwa katika muktadha wa sensa, ukimaanisha mtu anayeingia katika hesabu rasmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה יִתְּנוּ
  choice: Hiki ndicho atakachotoa
  rationale: Muundo huu wa Kiswahili unaendeleza nguvu ya kielekezi זֶה na maana ya agizo la kisheria katika יִתְּנוּ kwa lugha ya kawaida na yenye heshima.
- source_word: כָּל הָעֹבֵר עַל הַפְּקֻדִים
  choice: kila anayehesabiwa miongoni mwa walioandikishwa
  rationale: Huu ni msemo wa muktadha wa sensa. Tafsiri hii inawasilisha maana ya kuingia katika hesabu rasmi bila kutumia tafsiri halisi isiyoeleweka vizuri kwa Kiswahili.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: nusu shekeli
  rationale: Ni uwasilishaji mfupi na wa kawaida wa kiasi cha fedha kilichotajwa.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: בְּ hapa inaonyesha kiwango cha kupimia. Neno 'kipimo' linafafanua kazi ya shekeli hii kama kiwango rasmi, huku 'mahali patakatifu' likihifadhi uhusiano wa הַקֹּדֶשׁ na patakatifu.
- source_word: עֶשְׂרִים גֵּרָה הַשֶּׁקֶל
  choice: shekeli moja ni gera ishirini
  rationale: Kauli hii ya mabano inaeleza thamani ya kipimo kwa Kiswahili cha moja kwa moja, huku jina la kipimo gera likihifadhiwa.
- source_word: תְּרוּמָה לַיהוָה
  choice: iwe sadaka kwa Yahweh
  rationale: תְּרוּמָה hapa ni kitu kilichotengwa na kutolewa kwa Mungu. 'Sadaka' ni neno linaloeleweka na linafaa katika muktadha wa ibada; 'iwe' huonyesha kazi ya nusu shekeli hiyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limewasilishwa kama jina binafsi, badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; 'Yahweh' hulihifadhi kama jina binafsi bila kulibadili kuwa cheo.
- issue: Maana ya תְּרוּמָה katika muktadha huu
  choice: sadaka kwa Yahweh
  alternative: mchango kwa Yahweh
  rationale: '''Sadaka'' huhifadhi mwelekeo wa kiibada wa kitu kilichotengwa kwa Mungu, ingawa neno hilo pia lina maana pana ya mchango.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Istilahi za kale za vipimo, 'shekeli' na 'gera', zimehifadhiwa; ufafanuzi wa kipimo uliomo katika mstari umeachwa kwenye mabano.
