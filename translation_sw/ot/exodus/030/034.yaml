  text: 'Then Yahweh said to Moses[a], “Take for yourself spices: stacte and onycha and galbanum, spices, and pure frankincense; they shall be in equal parts.”'
translation:
  language: sw
  text: 'Kisha Yahwe akamwambia Musa, “Jichukulie vitu vya kunukia: natafi, shekeleti[a], kelbena, vitu vya kunukia, na ubani safi. Viwe kwa sehemu zilizo sawa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho kamili wa natafi na shekeleti haujulikani; maneno ya Kiebrania yanaonekana kutaja viambato mahususi vyenye harufu vilivyotumiwa kutengeneza uvumba.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kwa umbo la kawaida la Kiswahili badala ya kubadilishwa na cheo.
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo huu unaendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: קַח לְךָ
  choice: Jichukulie
  rationale: Huhifadhi maana ya amri pamoja na kiwakilishi cha kujirejelea kilicho katika לְךָ.
- source_word: סַמִּים
  choice: vitu vya kunukia
  rationale: Ni neno pana kwa viambato vyenye harufu nzuri vinavyotumiwa kutengeneza uvumba; tafsiri hii ni wazi na ya kawaida kuliko neno linaloweza kueleweka kuwa viungo vya chakula pekee.
- source_word: נָטָף
  choice: natafi
  rationale: Utambulisho kamili wa kiambato hiki haujulikani; umbo lililotoholewa kutoka Kiebrania huepuka kukipa utambulisho wa mimea usio na uhakika.
- source_word: שְׁחֵלֶת
  choice: shekeleti
  rationale: Dutu inayokusudiwa haijulikani kwa uhakika; jina limetoholewa ili kutodai utambulisho mahususi usiothibitishwa.
- source_word: חֶלְבְּנָה
  choice: kelbena
  rationale: Ni jina lililotoholewa la utomvu wenye harufu unaojulikana pia kama galbanamu; umbo hili linafuata neno la Kiebrania kwa karibu.
- source_word: לְבֹנָה זַכָּה
  choice: ubani safi
  rationale: ‘Ubani’ ni neno la kawaida la Kiswahili kwa frankincense, na ‘safi’ huhifadhi sifa ya זַכָּה.
- source_word: בַּד בְּבַד יִהְיֶה
  choice: Kila kimoja kiwe kwa kiasi sawa
  rationale: Huwasilisha kwa uwazi maana ya viambato kuwa katika vipimo au sehemu zilizo sawa.
