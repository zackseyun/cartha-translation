base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/023.yaml
  text: 'And you[a], take for yourself the finest spices: five hundred shekels of flowing myrrh, and half as much—two hundred fifty—of fragrant cinnamon, and two hundred fifty of fragrant cane[b],'
translation:
  language: sw
  text: '“Nawe, chukua kwa ajili yako manukato bora: shekeli mia tano za manemane inayotiririka[a], na nusu ya kiasi hicho—shekeli mia mbili na hamsini—ya mdalasini wenye harufu nzuri, na shekeli mia mbili na hamsini za mwanzi wenye harufu nzuri[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “manemane safi.” Usemi wa Kiebrania huenda unamaanisha manemane inayotiririka kwa uhuru katika hali yake ya asili.
    reason: lexical_alternative
  - marker: b
    text: Kwa mapokeo, “mdalasini mtamu” na “mwanzi mtamu.” Kwa maana pana zaidi, Kiebrania hurejelea mdalasini na mwanzi wenye harufu nzuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂמִים רֹאשׁ
  choice: manukato bora kabisa
  rationale: בְּשָׂמִים ni vitu vyenye harufu nzuri, na רֹאשׁ hapa humaanisha vilivyo bora au vya kwanza kwa ubora. ‘Manukato bora kabisa’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuvifanya kuwa vikolezo vya chakula pekee.
- source_word: מָר דְּרוֹר
  choice: manemane inayotiririka
  rationale: מָר ni manemane, naye דְּרוֹר huenda anaonyesha hali yake ya asili ya kutiririka kwa uhuru. Tafsiri hii ni wazi, huku ‘manemane safi’ ikiwekwa katika tanbihi kama uwezekano mwingine.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: shekeli mia tano
  rationale: Ingawa mstari huu unataja idadi tu, kipimo cha shekeli kinaeleweka kutokana na orodha na kinawekwa wazi katika mstari unaofuata. Kukitaja kunazuia utata kuhusu kiasi.
- source_word: קִנְּמָן בֶּשֶׂם
  choice: mdalasini wenye harufu nzuri
  rationale: קִנְּמָן ni mdalasini, na בֶּשֶׂם husisitiza harufu yake nzuri. Hii ni wazi zaidi kuliko ‘mdalasini mtamu,’ ambayo inaweza kueleweka kuwa inahusu ladha.
- source_word: מַחֲצִיתוֹ
  choice: nusu ya kiasi hicho
  rationale: Kiambishi kinarejelea kiasi cha shekeli mia tano kilichotangulia. Usemi huu unaonyesha wazi kwamba kiasi kinachofuata ni nusu yake.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: shekeli mia mbili na hamsini
  rationale: Hii ndiyo thamani kamili ya nusu iliyotajwa. ‘Shekeli’ imerudiwa kwa uwazi wa kipimo katika Kiswahili.
- source_word: קְנֵה בֹשֶׂם
  choice: mwanzi wenye harufu nzuri
  rationale: קָנֶה ni mwanzi au tete, na בֹשֶׂם huonyesha kuwa una harufu nzuri. ‘Mwanzi’ ni neno linaloeleweka kwa urahisi na halibainishi mmea kwa usahihi unaozidi ule wa Kiebrania.
