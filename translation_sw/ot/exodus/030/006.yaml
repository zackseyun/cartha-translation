base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/006.yaml
  text: And you shall place it before the veil that is before the ark of the testimony[a], before the mercy seat that is over the testimony[b], where I will meet with you.
translation:
  language: sw
  text: Nawe utaiweka mbele ya pazia lililo mbele ya sanduku la Ushuhuda, mbele ya kifuniko cha upatanisho[a] kilicho juu ya Ushuhuda[b], mahali nitakapokutana nawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiti cha rehema.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema “sanduku la Ushuhuda” na “Ushuhuda”; tafsiri nyingine hutumia “sanduku la agano,” lakini neno lililotumiwa hapa ni “Ushuhuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה אֹתוֹ
  choice: Nawe utaiweka
  rationale: Kitenzi נתן kina maana pana ya kutoa, kuweka, au kupanga; hapa maagizo yanahusu kuiweka madhabahu mahali maalumu. Kiambishi -i- kinarejelea madhabahu iliyotajwa katika muktadha uliotangulia.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Tafsiri hii inahifadhi maana ya mahali na marudio ya kirai hicho katika mstari.
- source_word: הַפָּרֹכֶת
  choice: pazia
  rationale: Neno hili linamaanisha pazia la ndani la Maskani; ‘pazia’ ni Kiswahili cha kawaida, cha heshima, na kinachoeleweka.
- source_word: אֲרֹן הָעֵדֻת
  choice: sanduku la Ushuhuda
  rationale: Kiebrania kinasema moja kwa moja ‘Ushuhuda,’ si ‘agano.’ Herufi kubwa inaonyesha kwamba ni jina la vibao vya ushuhuda vilivyowekwa sandukuni.
- source_word: הַכַּפֹּרֶת
  choice: kifuniko cha upatanisho
  rationale: כפרת ni kifuniko cha dhahabu juu ya sanduku na kinahusiana na tendo la upatanisho. Tafsiri hii ni wazi kwa msomaji wa sasa kuliko istilahi isiyoeleweka kirahisi kama ‘kiti cha rehema,’ bila kukifanya kifuniko hicho kuwa kiti halisi.
- source_word: הָעֵדֻת
  choice: Ushuhuda
  rationale: Imetafsiriwa kwa uthabiti kama ‘Ushuhuda,’ ikirejelea vibao vya ushuhuda, badala ya kuibadili kuwa ‘agano.’
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: mahali nitakapokutana nawe
  rationale: Nifali ya יעד hapa inaonyesha mkutano uliowekwa. ‘Mahali’ inawakilisha אשר pamoja na שמה kwa Kiswahili cha kawaida na fasaha.
theological_decisions:
- issue: Tafsiri ya istilahi ya ibada הַכַּפֹּרֶת
  choice: kifuniko cha upatanisho
  alternative: kiti cha rehema
  rationale: Chaguo kuu linabainisha kuwa kitu hicho ni kifuniko cha sanduku na kuhifadhi uhusiano wake wa kileksia na upatanisho, bila kulazimisha picha ya kiti. Tafsiri ya jadi imehifadhiwa katika tanbihi.
- issue: Tafsiri ya עֵדוּת katika jina la sanduku
  choice: Ushuhuda
  alternative: agano
  rationale: Mstari una neno ‘Ushuhuda’ mara mbili. Kutumia ‘agano’ kungeingiza neno tofauti la Kiebrania na kufifisha marudio ya maandishi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unahifadhi marudio ya ‘mbele ya’ na ‘Ushuhuda’ katika Kiebrania. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
