  text: and the altar of burnt offering with all its utensils[a], and the basin with its stand.
translation:
  language: sw
  text: na madhabahu ya sadaka ya kuteketezwa pamoja na vyombo vyake vyote, na birika pamoja na kitako chake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: madhabahu ya sadaka ya kuteketezwa
  rationale: מִזְבַּח ni ‘madhabahu,’ na הָעֹלָה ni sadaka inayoteketezwa kabisa. Usemi huu huhifadhi istilahi ya ibada kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: כָּל כֵּלָיו
  choice: vyombo vyake vyote
  rationale: כְּלִי inaweza kumaanisha chombo, kifaa, au zana. ‘Vyombo’ ni neno pana na la kawaida katika muktadha wa vifaa vya madhabahu; kiambishi ‘vyake’ kinarejelea madhabahu.
- source_word: הַכִּיֹּר
  choice: birika
  rationale: כִּיּוֹר hapa ni chombo cha kuoshea kilichotumika katika huduma ya patakatifu. ‘Birika’ ni istilahi inayotambulika katika Kiswahili cha Biblia na inaeleza chombo hicho kwa ufupi.
- source_word: כַּנּוֹ
  choice: kinara chake
  rationale: כֵּן hapa ni tegemezo au kitu ambacho birika lilikalia. ‘Kinara’ kinaeleza tegemezo hilo kwa lugha ya asili na inayoeleweka; ‘msingi’ pia ungewezekana.
- source_word: וְאֶת
  choice: na … pamoja na
  rationale: וְ huunganisha vitu katika orodha, huku אֶת ikiwa alama ya yambwa isiyotafsiriwa moja kwa moja. ‘Na’ na ‘pamoja na’ huleta uratibu wa asili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendeleza orodha ya mstari uliotangulia; kwa hiyo umeanza kwa herufi ndogo. Hakuna tanbihi iliyoongezwa kwa kuwa tofauti kati ya ‘kinara’ na ‘msingi’ si lazima kwa uelewa wa mstari huu.
