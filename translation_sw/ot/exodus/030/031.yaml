- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Ni usemi wa kawaida unaodumisha wazo la mwendelezo katika vizazi vinavyofuatana.
theological_decisions:
- issue: Maana ya לִי (‘kwangu/kwa ajili yangu’) katika usemi kuhusu mafuta
  choice: kunitia mafuta
  alternative: mafuta matakatifu ya upako kwa ajili yangu
  rationale: Muktadha wa maagizo ya mafuta matakatifu unaelekeza matumizi yake kuwa ya Mungu; tafsiri hii ni ya asili kwa Kiswahili lakini haidai kwamba Mungu anapakwa mafuta kimwili, kwa kuwa inaweza kueleweka kuwa upako uliofanywa kwa ajili yake.
