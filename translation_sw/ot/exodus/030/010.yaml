  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כִפֶּ֤ר אַהֲרֹן֙ עַל קַרְנֹתָ֔י/ו אַחַ֖ת בַּ/שָּׁנָ֑ה מִ/דַּ֞ם חַטַּ֣את הַ/כִּפֻּרִ֗ים אַחַ֤ת בַּ/שָּׁנָה֙ יְכַפֵּ֤ר עָלָי/ו֙ לְ/דֹרֹ֣תֵי/כֶ֔ם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/010.yaml
  text: Aaron shall make atonement on its horns once a year[a]. With the blood of the sin offering of atonement he shall make atonement for it once a year throughout your generations. It is most holy to Yahweh.
translation:
  language: sw
  text: Haruni atafanya upatanisho juu ya pembe zake mara moja kwa mwaka. Kwa damu ya sadaka ya dhambi ya upatanisho[a], atafanya upatanisho juu yake mara moja kwa mwaka katika vizazi vyenu vyote. Ni takatifu sana kwa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya dhambi kwa ajili ya upatanisho.” Kiebrania, kwa tafsiri ya karibu, ni “kutoka katika damu ya sadaka ya dhambi ya mapatanisho.”
    reason: Muundo wa Kiebrania הַכִּפֻּרִים ni wa wingi na unaweza kueleweka kama unaoeleza sadaka au kusudi lake; tanbihi huhifadhi tofauti hiyo ya kileksia, pamoja na kihusishi מִן katika מִדַּם.
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: atafanya upatanisho
  rationale: Katika muktadha wa kikuhani, כפר hurejelea kutekeleza ibada ya upatanisho; usemi huu wa kawaida unahifadhi maana ya ibada bila kuibana kuwa kufunika tu.
- source_word: קַרְנֹתָיו
  choice: pembe zake
  rationale: Kiambishi kinarejelea madhabahu ya uvumba iliyotajwa katika muktadha; Kiswahili hutumia umilikishi wa ngeli ya madhabahu.
- source_word: אַחַת בַּשָּׁנָה
  choice: mara moja kwa mwaka
  rationale: Huu ni usemi wa kawaida na wazi wa Kiswahili unaoonyesha marudio ya ibada kila mwaka.
- source_word: מִדַּם
  choice: kwa damu
  rationale: Ingawa מִן kimsingi inaweza kumaanisha ‘kutoka’, hapa inaonyesha damu inayotumiwa katika tendo la ibada; ‘kwa damu’ ni ya asili katika Kiswahili.
- source_word: חַטַּאת
  choice: sadaka ya dhambi
  rationale: Katika muktadha huu neno linataja sadaka ya ibada, si dhambi kama dhana pekee.
- source_word: הַכִּפֻּרִים
  choice: ya upatanisho
  rationale: Wingi wa Kiebrania una kazi ya kiibada katika kirai hiki; umoja wa dhana katika Kiswahili ni wa asili zaidi, huku tanbihi ikihifadhi muundo halisi na uwezekano wa tafsiri nyingine.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Usemi huu unaonyesha kwamba agizo linaendelea kutumika katika vizazi vinavyofuatana.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: takatifu sana
  rationale: Muundo wa Kiebrania ni wa kiwango cha juu kabisa cha utakatifu; tafsiri hii haichanganywi na jina la patakatifu pa ndani.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi kinaonyesha uhusiano au kuwekwa wakfu, na jina la agano limetolewa wazi kama Yahwe kulingana na safu ya mashauriano iliyotolewa.
theological_decisions:
- issue: Maana ya כפר katika ibada ya madhabahu
  choice: kufanya upatanisho juu ya/kwa ajili ya madhabahu
  alternative: kuitakasa madhabahu
  rationale: Kitenzi kinaweza kuhusisha utakaso wa kiibada, lakini ‘kufanya upatanisho’ huhifadhi istilahi pana ya Kiebrania na mvutano wake wa kiteolojia bila kuamua kimya-kimya kwamba maana yake ni utakaso pekee.
- issue: Utoaji wa יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Nakala ya mashauriano ya Kiingereza iliyowasilishwa hutumia ‘Yahweh’; ‘Yahwe’ ni umbo la kawaida la Kiswahili linalotambulisha jina la agano badala ya kulibadili kuwa cheo.
- issue: Kirejeleo cha viwakilishi katika עָלָיו na הוּא
  choice: madhabahu (kwa ajili yake; ni takatifu sana)
  alternative: ibada au sadaka
  rationale: Muktadha wa karibu na umoja wa kiume wa Kiebrania vinaelekeza kwenye madhabahu ya uvumba; Kiswahili kinaweza kudumisha rejeleo hilo kwa kiwakilishi cha ngeli husika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Istilahi za ibada ‘madhabahu’, ‘sadaka ya dhambi’, na ‘upatanisho’ zimetumiwa kwa uthabiti; sentensi zimewekwa wazi bila kufafanua kupita kiasi maana ya ibada.
