base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/017.yaml
  text: It is a sign forever between me and the sons of Israel[a], for in six days Yahweh made the heavens and the earth[c][b], and on the seventh day he ceased and was refreshed.
translation:
  language: sw
  text: Ni ishara ya milele kati yangu na wana wa Israeli[a], kwa maana kwa siku sita Yahwe alifanya mbingu na dunia, na siku ya saba alikoma[b] akaburudika[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “alipumzika”; kitenzi cha Kiebrania kimsingi humaanisha kukoma au kuacha.
    reason: lexical_alternative
  - marker: c
    text: Au “akapata burudisho” au “akapumua”; Kiebrania kinatumia lugha hai ya kibinadamu kumhusu Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּינִי וּבֵין
  choice: kati yangu na
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha uhusiano kati ya pande mbili bila kurudia kihusishi cha Kiebrania.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Unahifadhi picha ya kifamilia ya Kiebrania na umbo lake la kiume; ‘Waisraeli’ ni mbadala wa Kiswahili ulio mwepesi zaidi.
- source_word: אוֹת
  choice: ishara
  rationale: Ni neno la kawaida kwa alama yenye maana ya agano au uhusiano unaodumu.
- source_word: לְעֹלָם
  choice: milele
  rationale: Linatoa kwa lugha ya kawaida wazo la muda unaoendelea bila kuingiza maneno yasiyopatikana katika mstari huu.
- source_word: כִּי
  choice: kwa maana
  rationale: Linatambulisha sababu au msingi unaoeleza kwa nini Sabato ni ishara.
- source_word: שֵׁשֶׁת יָמִים
  choice: kwa siku sita
  rationale: Ni usemi wa asili wa Kiswahili kwa kipindi ambacho kazi ya uumbaji ilifanywa.
- source_word: עָשָׂה
  choice: alifanya
  rationale: Linawakilisha kitenzi cha kawaida cha Kiebrania cha kufanya au kutengeneza katika muktadha wa uumbaji.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni umbo la kawaida la Kiswahili la jina la Mungu YHWH, likilitaja jina lenyewe badala ya kulibadili kuwa cheo.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: mbingu na dunia
  rationale: Ni jozi ya kawaida ya Kiswahili inayowakilisha ujumla wa ulimwengu ulioumbwa na kuhifadhi wingi wa ‘mbingu’.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: na siku ya saba
  rationale: Inaendeleza mfuatano wa sentensi bila kuingiza maana ya upinzani ambayo si lazima katika kiunganishi cha Kiebrania.
- source_word: שָׁבַת
  choice: alikoma
  rationale: Maana ya msingi ni kuacha au kukoma; neno hili halidokezi moja kwa moja kwamba Mungu alikuwa amechoka.
- source_word: וַיִּנָּפַשׁ
  choice: akaburudika
  rationale: Ni usemi wa asili unaohifadhi picha hai ya kupata burudisho bila kuifuta lugha ya kibinadamu inayotumiwa kumhusu Mungu.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu Mungu katika maelezo ya Sabato
  choice: alikoma akaburudika
  alternative: alipumzika na kupata nguvu mpya
  rationale: Tafsiri inahifadhi tofauti kati ya kukoma kwa kazi na kuburudika, pamoja na mvutano wa lugha ya kibinadamu inayotumiwa kumhusu Mungu, bila kuibadili kuwa kauli ya kinadharia.
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Chaguo hili linahifadhi wazi usemi wa kifamilia wa chanzo; tanbihi inatoa namna ya kawaida zaidi bila kuuficha usemi wa Kiebrania.
- issue: Tafsiri ya jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Jina binafsi la Kiebrania limetolewa kama jina badala ya kubadilishwa kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umehifadhi ufupi na mfuatano wa Kiebrania; tanbihi zinaonyesha mbadala muhimu bila kuondoa utata au lugha ya kibinadamu ya chanzo.
