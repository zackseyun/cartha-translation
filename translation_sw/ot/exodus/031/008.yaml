translation:
  language: sw
  text: na meza pamoja na vyombo vyake, na kinara safi cha taa[a] pamoja na vyombo vyake vyote, na madhabahu ya kufukizia uvumba[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “menora.” Neno la Kiebrania humaanisha kinara cha taa cha patakatifu. “Safi” linaweza kurejelea usafi wa kiibada na huenda pia likagusia kutengenezwa kwake kwa dhahabu safi katika maelezo mengine.
