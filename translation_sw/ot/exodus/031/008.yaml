lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: meza
  rationale: Neno hili kwa kawaida humaanisha meza. Muktadha unatambulisha kuwa ni meza ya patakatifu, lakini mstari huu hautoi jina lake kamili.
- source_word: כֵּלָיו
  choice: vyombo vyake
  rationale: כְּלִי ni neno pana kwa vyombo au vifaa; “vyombo” ni la kawaida na linafaa kwa vitu vilivyotumiwa katika huduma ya patakatifu.
- source_word: הַמְּנֹרָה
  choice: kinara cha taa
  rationale: מְנוֹרָה humaanisha kinara cha kuweka taa; tafsiri ya nomino hii ya kawaida ni wazi zaidi kuliko kuitohotoa kama “menora.”
- source_word: הַטְּהֹרָה
  choice: safi
  rationale: טָהוֹר inaweza kumaanisha safi au takatifu kiibada. “Safi” huhifadhi maana ya moja kwa moja na mwangwi unaowezekana wa dhahabu safi katika maelezo yanayohusiana.
- source_word: כָּל כֵּלֶיהָ
  choice: vyombo vyake vyote
  rationale: “Vyote” huhifadhi wazo la ujumla katika כָּל, na “vyombo” hurejelea vifaa vinavyohusiana na kinara.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: madhabahu ya kufukizia uvumba
  rationale: Muundo huu humaanisha madhabahu inayotumiwa kwa uvumba. Usemi huu ni wa asili katika Kiswahili na unaeleza kazi yake bila kupanua maana.
- source_word: וְאֶת
  choice: na
  rationale: Kiashiria cha yambwa אֵת hakitafsiriwi moja kwa moja; kiunganishi וְ kinawakilishwa na “na” ili kudumisha muundo wa orodha.
theological_decisions:
- issue: Maana ya הַטְּהֹרָה kuhusu kinara
  choice: safi
  alternative: kilichotengenezwa kwa dhahabu safi
  rationale: Kiebrania kinasema tu “safi”; ingawa muktadha unaweza kugusia dhahabu safi, tafsiri kuu haiongezi wazi nyenzo ambayo haikutajwa katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa orodha na urudiaji wa “na” vimedumishwa; sentensi inaendelea kutoka na kwenda kwenye mistari inayozunguka.
