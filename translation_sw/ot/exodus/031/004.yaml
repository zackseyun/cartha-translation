lexical_decisions:
- source_word: לַחְשֹׁב
  choice: kubuni
  rationale: Katika muktadha wa ufundi, kitenzi hiki kinaonyesha kupanga kwa ustadi na kwa ubunifu, si kufikiri tu.
- source_word: מַחֲשָׁבֹת
  choice: miundo
  rationale: Hapa neno hilo linamaanisha mipango au michoro inayobuniwa kwa ajili ya kazi ya kisanii.
- source_word: לַעֲשׂוֹת
  choice: kutengeneza vitu
  rationale: Katika mfululizo huu, neno linaeleza utekelezaji wa kazi kwa kutumia metali zilizotajwa; tafsiri hii ni ya kawaida na wazi kwa Kiswahili.
- source_word: בַּזָּהָב
  choice: kwa dhahabu
  rationale: Kihusishi kinaonyesha nyenzo inayotumiwa katika kazi; ‘kwa’ ni cha kawaida katika Kiswahili.
- source_word: וּבַכֶּסֶף
  choice: fedha
  rationale: Neno linarejelea metali ya fedha, na linaendeleza orodha ya vifaa kwa mtindo wa kawaida wa Kiswahili.
- source_word: וּבַנְּחֹשֶׁת
  choice: shaba
  rationale: Neno la Kiebrania linaweza kumaanisha copper au bronze. ‘Shaba’ huhifadhi upana huo kwa Kiswahili kwa kiasi fulani, huku tanbihi ikifafanua uwezekano wa maana.
