source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ יֵעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֧ת שַׁבָּת֛וֹן קֹ֖דֶשׁ לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֧ה מְלָאכָ֛ה בְּ/י֥וֹם הַ/שַּׁבָּ֖ת מ֥וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/015.yaml
  text: Work may be done for six days[a], but on the seventh day there is a Sabbath of complete rest, holy to Yahweh. Whoever does work on the Sabbath day shall surely be put to death.
translation:
  language: sw
  text: Kazi inaweza kufanywa kwa siku sita, lakini siku ya saba ni Sabato ya pumziko kamili[a], takatifu kwa Yahwe. Yeyote afanyaye kazi siku ya Sabato hakika atauawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sabato, pumziko kuu.” Kirai cha Kiebrania kinasisitiza wazo la kuacha kazi na kupumzika.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה מְלָאכָה
  choice: Kazi inaweza kufanywa
  rationale: Kauli ya kutendwa ya kitenzi עשה pamoja na מְלָאכָה inaelezwa wazi kwa muundo wa Kiswahili wa kutendwa. Neno “inaweza” linafaa katika muktadha huu wa sheria bila kuifanya kauli kuwa unabii wa wakati ujao.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: lakini siku ya saba
  rationale: Ingawa ו inaweza kumaanisha “na,” hapa “lakini” inaonyesha kwa kawaida tofauti iliyokusudiwa kati ya siku sita za kazi na siku ya saba.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: Sabato ya pumziko kamili
  rationale: Kirai hiki kinasisitiza kusitishwa kabisa kwa kazi. Tafsiri hii inahifadhi jina “Sabato” na nguvu ya neno שַׁבָּתוֹן kwa Kiswahili kinachoeleweka.
- source_word: קֹדֶשׁ לַיהוָה
  choice: takatifu kwa Yahwe
  rationale: קֹדֶשׁ huonyesha hali ya utakatifu, na ל huonyesha kuelekezwa au kuwekwa kwa ajili ya Yahwe. Muundo huu ni mfupi na unafuata maana ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa na cheo, hivyo kuhifadhi jina la Mungu lililotajwa katika matini.
- source_word: כָּל הָעֹשֶׂה מְלָאכָה
  choice: Yeyote afanyaye kazi
  rationale: Muundo wa participio pamoja na כָּל unaweka kundi la kisheria linalomhusu kila mtu anayetenda jambo hilo. “Yeyote afanyaye” ni Kiswahili cha kawaida chenye nguvu hiyo ya kijumla.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: siku ya Sabato
  rationale: Tafsiri hii inahifadhi wazi neno יוֹם, “siku,” na bado ni ya kawaida katika Kiswahili.
- source_word: מוֹת יוּמָת
  choice: hakika atauawa
  rationale: Infinitivo kamili pamoja na umbo la kutendwa la kitenzi husisitiza adhabu ya kifo. “Hakika” huhifadhi msisitizo, na “atauawa” huhifadhi kauli ya kutendwa badala ya kusema tu kwamba mtu huyo atakufa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Matini inatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina binafsi la agano bila kulibadilisha kuwa cheo.
- issue: Nguvu ya istilahi ya Sabato katika שַׁבַּת שַׁבָּתוֹן
  choice: Sabato ya pumziko kamili
  alternative: Sabato, pumziko kuu
  rationale: Kirai cha Kiebrania kinasisitiza pumziko au kusitishwa kwa kazi kwa ukamilifu. Tafsiri iliyochaguliwa inahifadhi msisitizo huo bila kuingiza mafundisho ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa moja kwa moja, na unaoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria na msisitizo wa adhabu umehifadhiwa bila kuongeza maelezo ya kimadhehebu.
