  source_fidelity: 'Tafsiri inafuata kwa usahihi muundo na maana ya Kiebrania: siku sita za kazi, siku ya saba kama Sabato ya pumziko kamili iliyowekwa wakfu kwa Yahwe, na adhabu ya kisheria iliyo katika kauli ya kutendwa. “Hakika atauawa” huhifadhi msisitizo na kauli ya kutendwa ya מוֹת יוּמָת. Uamuzi wa “inaweza kufanywa” unaendana na audit trail ya Kiingereza (“may be done”) na unawezekana katika muktadha wa maagizo ya sheria.'
  naturalness: Kiswahili ni sanifu, cha asili, na kina rejesta inayofaa kwa sheria ya kibiblia. “Sabato ya pumziko kamili” na “Yeyote afanyaye kazi siku ya Sabato” ni misemo iliyo wazi na yenye mtiririko mzuri.
  terminology: “Yahwe” ni toleo la Kiswahili linalokubalika la jina יהוה na linadumisha uamuzi wa audit trail wa kutumia jina badala ya cheo. “Sabato,” “takatifu kwa Yahwe,” na “pumziko kamili” zinawakilisha istilahi kuu bila kuongeza tafsiri ya kimadhehebu. Kidokezo [a] kimefungwa ipasavyo kwenye “pumziko kamili” na hueleza msisitizo wa kirai cha Kiebrania.
