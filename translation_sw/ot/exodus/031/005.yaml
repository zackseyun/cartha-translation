lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: katika kuchonga
  rationale: Nomino hii hueleza ufundi au kazi stadi. Katika muktadha wa mawe na mbao, “kuchonga” ni usemi wa kawaida na halisi unaofaa kwa nyenzo zote mbili.
- source_word: אֶבֶן
  choice: mawe
  rationale: Hili ndilo neno la kawaida la “jiwe/mawe.” Muktadha unaweza kuhusisha vito, lakini maandishi yenyewe hayabainishi hivyo.
- source_word: לְמַלֹּאת
  choice: ya kupachikwa
  rationale: Katika muktadha wa ufundi, neno hili linaelekea kumaanisha kuyaandaa mawe ili yawekwe au yapachikwe katika sehemu iliyotengenezwa kwa ajili yake; tafsiri hii ni ya kawaida kuliko “kujaza.”
- source_word: עֵץ
  choice: mbao
  rationale: “Mbao” ni neno la kawaida katika Kiswahili kwa miti iliyotayarishwa ili ichongwe au itumiwe kutengeneza vitu.
- source_word: לַעֲשׂוֹת
  choice: ili kufanya
  rationale: Kitenzi hiki kina maana pana ya kufanya; hapa kinaendeleza wazo la uwezo wa kutekeleza kazi mbalimbali.
- source_word: בְּכָל מְלָאכָה
  choice: kila aina ya kazi
  rationale: Huhifadhi upana wa usemi wa Kiebrania huku muktadha ukionyesha kwamba zinazokusudiwa ni kazi za ufundi.
