  text: וַ/אֲנִ֞י הִנֵּ֧ה נָתַ֣תִּי אִתּ֗/וֹ אֵ֣ת אָהֳלִיאָ֞ב בֶּן אֲחִֽיסָמָךְ֙ לְ/מַטֵּה דָ֔ן וּ/בְ/לֵ֥ב כָּל חֲכַם לֵ֖ב נָתַ֣תִּי חָכְמָ֑ה וְ/עָשׂ֕וּ אֵ֖ת כָּל אֲשֶׁ֥ר צִוִּיתִֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/006.yaml
  text: And behold[a], I have appointed with him Oholiab son of Ahisamach, of the tribe of Dan; and in the heart of everyone wise of heart I have put wisdom[b], that they may make all that I have commanded you.
translation:
  language: sw
  text: Nami, tazama, nimemteua Oholiabu mwana wa Ahisamaki, wa kabila la Dani, awe pamoja naye; na katika moyo wa kila mtu mwenye moyo wa hekima nimetia hekima[a], ili watengeneze yote niliyokuamuru[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mwenye moyo wa hekima”; hii ni nahau inayomaanisha mtu aliyepewa hekima au ustadi.
    reason: cultural_note
  - marker: b
    text: Au, kwa mtindo wa karibu zaidi na muundo wa Kiebrania, “na watatengeneza yote niliyokuamuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: Nami, tazama
  rationale: “Nami” huhifadhi kiwakilishi huru chenye mkazo pamoja na kiunganishi, na “tazama” huhifadhi nguvu ya הִנֵּה ya kuvuta fikira kwa lugha ya heshima inayoeleweka.
- source_word: נָתַתִּי אִתּוֹ
  choice: nimemweka pamoja naye
  rationale: Ingawa נָתַן kimsingi ni ‘kutoa/kuweka,’ hapa inamaanisha kumweka au kumteua Oholiabu afanye kazi pamoja na Bezaleli; “pamoja naye” huhifadhi אִתּוֹ.
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: Oholiabu mwana wa Ahisamaki
  rationale: Majina yamenukuliwa kwa umbo linalofaa Kiswahili, na uhusiano wa ukoo wa בֶּן umeonyeshwa moja kwa moja.
- source_word: לְמַטֵּה דָן
  choice: wa kabila la Dani
  rationale: מַטֶּה hapa hueleza ushirika wa kikabila; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וּבְלֵב כָּל חֲכַם לֵב
  choice: Nami nimetia hekima katika moyo wa kila mwenye moyo wa hekima
  rationale: Tafsiri inahifadhi kurudiwa kwa לֵב na mtazamo wa Kiebrania kwamba moyo ni kitovu cha ufahamu na ustadi, huku tanbihi ikifafanua nahau hiyo.
- source_word: נָתַתִּי חָכְמָה
  choice: nimetia hekima
  rationale: “Nimetia” huhifadhi sitiari ya Mungu kuweka hekima ndani yao; “hekima” inadumisha upana wa חָכְמָה, ambao katika muktadha huu unajumuisha ustadi wa ufundi.
- source_word: וְעָשׂוּ
  choice: ili watengeneze
  rationale: “Ili” huonyesha kwa kawaida kusudi au matokeo ya Mungu kuwapa hekima, bila kufuta uwezekano wa kusoma kiunganishi kwa namna ya moja kwa moja zaidi.
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתִךָ
  choice: yote niliyokuamuru
  rationale: Huwasilisha kikamilifu wazo la jumla la ‘yote’ na agizo ambalo tayari Mungu alimpa Musa.
theological_decisions:
- issue: Maana ya nahau חֲכַם לֵב katika muktadha wa ufundi
  choice: mwenye moyo wa hekima / hekima
  alternative: stadi / ustadi
  rationale: Muktadha unahusu mafundi, lakini kuhifadhi “moyo” na “hekima” hudumisha wazo la Kiebrania kwamba ustadi wa vitendo ni hekima iliyotolewa na Mungu, badala ya kuupunguza kuwa uwezo wa kiufundi tu.
- issue: Nguvu ya וְעָשׂוּ baada ya kutolewa kwa hekima
  choice: ili watengeneze
  alternative: na watatengeneza
  rationale: “Ili” huonyesha uhusiano wa kusudi au matokeo kati ya Mungu kutia hekima na wao kutekeleza alichoamuru. Tanbihi huhifadhi usomaji rasmi zaidi wa kiunganishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Nami, tazama” ni wa kiwango cha juu kidogo lakini unaeleweka na huhifadhi mkazo wa chanzo. Majina yameandikwa Oholiabu, Ahisamaki, na Dani kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
