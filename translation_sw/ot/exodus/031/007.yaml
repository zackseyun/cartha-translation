  text: hema ya kukutania[a], sanduku la Ushuhuda[b], kifuniko cha upatanisho kilicho juu yake[c], na vyombo vyote vya hema hilo—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hema la mkutano.”
    reason: lexical_alternative
  - marker: b
