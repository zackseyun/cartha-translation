    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Ni tafsiri ya kawaida na ya asili kwa Kiswahili ya hema ambamo Mungu hukutana na Israeli; inadumisha wazo la kukutana bila kulifanya tu kuwa hema la mikutano ya watu.
- source_word: הָאָרֹן לָעֵדֻת
  choice: sanduku la Ushuhuda
  rationale: Muundo huu ni wa asili kwa Kiswahili na unaonyesha uhusiano wa sanduku na Ushuhuda, yaani maandishi yaliyowekwa ndani yake. Herufi ל inaweza pia kueleweka kuwa ya kusudi, jambo linalohifadhiwa katika tanbihi.
- source_word: הַכַּפֹּרֶת
  choice: kifuniko cha upatanisho
  rationale: Neno linataja kifuniko cha dhahabu juu ya sanduku na lina uhusiano na ibada ya kufanya upatanisho. Tafsiri hii inaonyesha kwamba ni kifuniko halisi huku ikihifadhi maana yake ya ibada.
- source_word: אֲשֶׁר עָלָיו
  choice: kilicho juu yake
  rationale: Kiwakilishi cha kiume cha Kiebrania kinarejelea sanduku; Kiswahili hutumia ngeli ya nomino kifuniko katika kishazi hiki. 'Juu yake' hudumisha maana ya mahali bila kuongeza ufafanuzi.
- source_word: כָּל כְּלֵי הָאֹהֶל
  choice: vyombo vyote vya hema hilo
  rationale: כְּלִים ni neno pana kwa vitu au vifaa vinavyotumika. 'Vyombo' ni istilahi ya kawaida katika muktadha wa patakatifu na haipunguzi maana kuwa zana za aina moja tu.
theological_decisions:
- issue: Tafsiri ya כַּפֹּרֶת katika muktadha wa patakatifu
  choice: kifuniko cha upatanisho
  alternative: kiti cha rehema
  rationale: Kifungu kinataja kifuniko halisi cha sanduku, huku neno lenyewe likihusishwa na upatanisho. 'Kifuniko cha upatanisho' huwasilisha yote mawili bila kuingiza maelezo ya kimadhehebu; tafsiri ya jadi 'kiti cha rehema' imehifadhiwa katika tanbihi.
- issue: Uhusiano katika הָאָרֹן לָעֵדֻת
  choice: sanduku la Ushuhuda
  alternative: sanduku kwa ajili ya Ushuhuda
  rationale: Herufi ל inaweza kuonyesha uhusiano au kusudi. Matini kuu inatumia Kiswahili cha kawaida, na tanbihi huhifadhi uwezekano wa kusudi bila kuamua zaidi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Herufi kubwa katika “Ushuhuda” inaonyesha vibao vya ushuhuda kama kitu maalumu katika muktadha huu. Mstari umeachwa kama sehemu ya orodha inayoendelea, kwa kutumia kistari mwishoni kama katika muktadha uliotolewa.
