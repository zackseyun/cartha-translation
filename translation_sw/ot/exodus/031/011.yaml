  text: and the anointing oil[a], and the fragrant incense for the holy place. They shall make them according to all that I have commanded you.
translation:
  language: sw
  text: na mafuta ya upako, na uvumba[a] wenye harufu nzuri kwa ajili ya mahali patakatifu. Watafanya vitu hivyo kulingana na yote niliyokuamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uvumba wa viungo kwa ajili ya mahali patakatifu.”
    reason: mbadala_wa_kileksia
lexical_decisions:
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: mafuta ya upako
  rationale: Ni muundo wa kawaida na wa asili katika Kiswahili unaoonyesha mafuta yanayotumiwa kupaka kwa kusudi la kuweka wakfu, bila kuongeza neno ambalo halipo wazi katika kirai hiki.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: uvumba wenye harufu nzuri
  rationale: Kirai hiki kinaeleza uvumba uliotengenezwa kwa viungo vyenye harufu; tafsiri hii ni ya kawaida na inaeleweka kwa urahisi huku ikihifadhi maana ya msingi.
- source_word: לַקֹּדֶשׁ
  choice: kwa ajili ya mahali patakatifu
  rationale: Tafsiri hii inaakisi kwa karibu 'kwa ajili ya patakatifu' na inafaa katika muktadha wa maskani, bila kulazimisha iwapo msisitizo ni mahali au matumizi matakatifu.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִךָ
  choice: kulingana na yote niliyokuamuru
  rationale: Inahifadhi nguvu jumuishi ya כְּכֹל na maelekezo ya Mungu yanayoelekezwa moja kwa moja kwa Musa.
- source_word: יַעֲשׂוּ
  choice: Watafanya vitu hivyo
  rationale: Kitenzi cha wingi kinawarejelea mafundi waliotajwa katika muktadha; 'vitu hivyo' huweka wazi yambwa iliyodokezwa na kukusanya vitu vilivyoorodheshwa.
