lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akamwambia
  rationale: Muundo wa waw-consecutive unaendeleza simulizi. ‘Kisha’ huonyesha mfuatano kwa Kiswahili cha sasa, na ‘akamwambia’ huwasilisha kwa kawaida kwamba Yahwe alizungumza na Musa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: אֶל
  choice: -mwambia
  rationale: Kihusishi hiki kinaonyesha anayeelekezewa maneno; katika Kiswahili maana hiyo imejumuishwa kiasili katika kitenzi ‘akamwambia’.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Jina limetolewa kwa umbo la Kiswahili linalotambulika na kutumika kwa kawaida.
- source_word: לֵאמֹר
  choice: akamwambia
  rationale: Kitenzi-jina hiki hutanguliza ujumbe unaofuata. Kiswahili cha kawaida hakihitaji tafsiri tofauti kama ‘akisema’ baada ya ‘akamwambia’; maana yake imewasilishwa katika kitenzi na koma inayotanguliza maneno yatakayofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina YHWH moja kwa moja. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo; tanbihi inataja desturi nyingine bila kuingiza msimamo wa dhehebu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘akamwambia Musa’ ni wa kawaida zaidi kuliko ‘alizungumza na Musa, akisema,’ huku ukiendeleza simulizi na kutanguliza kauli inayofuata.
