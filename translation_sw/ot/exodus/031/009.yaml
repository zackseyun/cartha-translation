base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/009.yaml
  text: and the altar of burnt offering[a], with all its utensils, and the basin with its stand,
translation:
  language: sw
  text: na madhabahu ya sadaka ya kuteketezwa, na vyombo vyake vyote, na birika[a] na kitako chake,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “birika la kuoshea pamoja na msingi wake.”
    reason: alternative lexical rendering
lexical_decisions:
- source_word: מִזְבַּח
  choice: madhabahu
  rationale: Neno la kawaida na lenye heshima katika Kiswahili kwa mahali pa kutolea dhabihu; kirai kinachofuata kinaeleza matumizi yake.
- source_word: הָעֹלָה
  choice: ya sadaka ya kuteketezwa
  rationale: Katika muundo huu linataja sadaka inayoteketezwa madhabahuni; tafsiri hii ni wazi na ya kawaida katika muktadha wa ibada.
- source_word: כָּל
  choice: vyote
  rationale: Huonyesha jumla ya vyombo vinavyohusika, na upatanisho wa kisarufi unafuata nomino ya wingi 'vyombo'.
- source_word: כֵּלָיו
  choice: vyombo vyake
  rationale: Katika muktadha wa hema la kukutania, neno hili linahusu vifaa au vyombo vilivyotumiwa pamoja na madhabahu; 'vyombo' ni la kawaida na pana vya kutosha.
- source_word: הַכִּיּוֹר
  choice: birika
  rationale: Hurejelea chombo cha kuoshea katika ua wa hema; 'birika' ni istilahi inayoeleweka katika Kiswahili cha kibiblia na huonyesha chombo hicho.
- source_word: כַּנּוֹ
  choice: kinara chake
  rationale: Hurejelea kitu kilicholishikilia birika; 'kinara' huwasilisha wazo la sehemu ya kutegemezea au kusimamishia chombo.
- source_word: וְאֶת
  choice: na
  rationale: Katika orodha hii kiunganishi pamoja na alama ya yambwa huwasilishwa kwa kawaida kwa 'na' katika Kiswahili.
