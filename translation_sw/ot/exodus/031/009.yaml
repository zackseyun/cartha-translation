translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa orodha unaoendelea kutoka mistari inayozunguka. Lugha ni ya sasa na yenye heshima; koma ya mwisho inaonyesha kuwa sentensi inaendelea.
