base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/018.yaml
  text: And when he finished speaking with him on Mount Sinai[a], he gave Moses the two tablets of the testimony, tablets of stone, written with the finger of God.
translation:
  language: sw
  text: Mungu alipomaliza kusema na Musa juu ya Mlima Sinai, alimpa Musa vibao viwili vya ushuhuda, vibao vya mawe, vilivyoandikwa kwa kidole cha Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vilivyoandikwa na kidole cha Mungu.” Kihusishi cha Kiebrania kinaonyesha chombo cha kuandikia na huhifadhi taswira kwamba Mungu mwenyewe ndiye aliyeandika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: alimpa
  rationale: Kitenzi hiki kinaendeleza simulizi kwa wakati uliopita. Muundo wa Kiswahili unadokeza mtiririko huo kwa kawaida bila kulazimisha kiunganishi ‘na’ mwanzoni.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: alipomaliza kusema
  rationale: Muundo wa Kiebrania unaonyesha wakati ambapo tendo la kusema lilikuwa limekamilika; ‘alipomaliza kusema’ ni wa kawaida na sahihi katika Kiswahili.
- source_word: אִתּוֹ
  choice: na Musa
  rationale: Kiwakilishi kinamrejelea Musa kulingana na muktadha. Kutaja jina lake huondoa utata usio wa msingi katika Kiswahili.
- source_word: בְּהַר סִינַי
  choice: juu ya Mlima Sinai
  rationale: Hueleza mahali pa tukio mlimani kwa Kiswahili cha kawaida.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: mabamba mawili ya ushuhuda
  rationale: ‘Mabamba’ yanaonyesha vibao au vipande bapa vilivyotumika kuandikia bila kudokeza kuwa vilikuwa vya mbao; ‘ushuhuda’ huhifadhi maana ya עֵדוּת na uzito wake wa agano.
- source_word: לֻחֹת אֶבֶן
  choice: mabamba ya mawe
  rationale: Kirai hiki kinataja nyenzo ya mabamba na kuhifadhi urudiaji wa maelezo katika Kiebrania.
- source_word: כְּתֻבִים
  choice: yaliyoandikwa
  rationale: Huhifadhi hali tendwa ya kitenzi כתב na maana yake ya msingi bila kuongeza ufafanuzi.
- source_word: בְּאֶצְבַּע אֱלֹהִים
  choice: kwa kidole cha Mungu
  rationale: ‘Kwa’ huonyesha chombo au njia, huku ‘kidole cha Mungu’ kikihifadhi taswira halisi na msisitizo wa Kiebrania juu ya uandishi wa moja kwa moja wa Mungu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno hilo linamtaja Mungu wa Israeli kwa maana ya umoja.
theological_decisions:
- issue: Usemi wa kimwili kuhusu uandishi wa Mungu
  choice: kwa kidole cha Mungu
  alternative: kwa uwezo wa Mungu
  rationale: Tafsiri inadumisha taswira ya Kiebrania badala ya kuibadili kuwa maelezo ya kiitikadi. Hivyo msisitizo juu ya Mungu mwenyewe kuyaandika unabaki bila kufafanua namna ya tendo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mabamba’ yametumiwa badala ya ‘mbao’ ili kuepuka wazo lisilo sahihi kwamba vitu hivyo vilitengenezwa kwa mti. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja.
