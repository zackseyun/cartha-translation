lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: mavazi yaliyofumwa kwa ustadi
  rationale: בִּגְדֵי ni “mavazi,” huku הַשְּׂרָד ikiwa neno gumu ambalo huenda likasisitiza ufumaji au utengenezaji wa pekee. Tafsiri hii ni ya kawaida na inaeleweka, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: mavazi matakatifu
  rationale: Hii inaakisi moja kwa moja maana ya “mavazi ya utakatifu/matakatifu” kwa Kiswahili cha kawaida na chenye heshima.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: ya kuhani Aroni
  rationale: לְ hapa huonyesha kwamba mavazi hayo yametengewa Aroni; mpangilio “kuhani Aroni” ni wa asili katika Kiswahili na huhifadhi cheo chake.
- source_word: בִּגְדֵי בָנָיו
  choice: mavazi ya wanawe
  rationale: Huhifadhi uhusiano wa umilikaji na rejeo la wazi kwa wana wa Aroni.
- source_word: לְכַהֵן
  choice: kwa ajili ya kutumika kama makuhani
  rationale: Kitenzi כהן humaanisha kutekeleza huduma au wadhifa wa ukuhani. Kauli hii inaeleza kusudi bila kuingiza maana ya kimadhehebu.
- source_word: וְאֵת / וְאֶת
  choice: na
  rationale: Kiashiria cha yambwa אֵת hakitafsiriwi moja kwa moja; וְ limetafsiriwa “na” ili kuhifadhi muundo wa orodha unaoendelea kutoka mstari uliotangulia.
