base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/016.yaml
  text: So the sons of Israel shall keep the Sabbath[c][b][a], to observe the Sabbath throughout their generations as an everlasting covenant.
translation:
  language: sw
  text: Wana wa Israeli[a] wataishika Sabato, ili waiadhimishe Sabato[b] katika vizazi vyao vyote, kama agano la kudumu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania kinasema kihalisi “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kuifanya Sabato”; yaani, kuishika au kuiadhimisha.
    reason: lexical_alternative
  - marker: c
    text: Au “agano la milele” au “agano lisilokoma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Basi ... wataishika
  rationale: Kitenzi שׁמר kina maana ya kushika, kutunza, au kuadhimisha. “Wataishika” hudumisha uzito wa wajibu wa agano, huku “Basi” ikiunganisha sentensi kwa Kiswahili cha kawaida.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili linafuata kwa karibu usemi wa kifamilia wa Kiebrania, “wana wa Israeli,” bila kuufanya kuwa jina la kikabila tu. Katika muktadha huu usemi huo unawahusu watu wa agano kwa ujumla.
- source_word: הַשַּׁבָּת
  choice: Sabato
  rationale: “Sabato” ni neno la kawaida la Kiswahili kwa taasisi na siku takatifu inayotajwa hapa.
- source_word: לַעֲשׂוֹת אֶת הַשַּׁבָּת
  choice: wakiadhimisha Sabato
  rationale: Kiebrania kinasema kihalisi “kuifanya Sabato.” “Kuadhimisha Sabato” huwasilisha maana ya nahau hiyo kwa Kiswahili cha asili na huepuka kurudia “kuishika” bila kupoteza uhusiano wa mawazo.
- source_word: לְדֹרֹתָם
  choice: katika vizazi vyao vyote
  rationale: Usemi huu unaonyesha mwendelezo wa wajibu huo katika vizazi vinavyofuatana.
- source_word: בְּרִית עוֹלָם
  choice: agano la kudumu
  rationale: בְּרִית ni “agano,” na עוֹלָם hapa huonyesha muda unaoendelea au usiokoma. “La kudumu” huhifadhi uzito huo bila kulazimisha maana moja tu ya muda.
theological_decisions:
- issue: Jina la watu wa agano בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Tafsiri inadumisha muundo wa kifamilia wa Kiebrania huku ikitambua kuwa usemi huo unawakilisha jumuiya nzima ya watu wa Israeli.
- issue: Muda unaoonyeshwa na בְּרִית עוֹלָם
  choice: agano la kudumu
  alternative: agano la milele; agano lisilokoma
  rationale: “La kudumu” huhifadhi nguvu ya agano na wigo wa maana wa עוֹלָם bila kuingiza hitimisho la kiteolojia lisilotamkwa wazi katika mstari huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Wana wa Israeli” huhifadhi taswira ya kifamilia ya chanzo; “wakiadhimisha” hufanya nahau ya Kiebrania iwe ya kawaida katika Kiswahili.
