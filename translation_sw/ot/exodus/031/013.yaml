  text: וְ/אַתָּ֞ה דַּבֵּ֨ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אַ֥ךְ אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ כִּי֩ א֨וֹת הִ֜וא בֵּינִ֤/י וּ/בֵֽינֵי/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
translation:
  language: sw
  text: 'Nawe, waambie wana wa Israeli[b] hivi: “Hakika[a] mtazishika Sabato zangu, kwa maana ni ishara kati yangu nanyi kwa vizazi vyenu vyote, ili mjue kwamba mimi ni Yahwe ninayewatakasa[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Lakini.” Neno la Kiebrania linaweza kuonyesha kizuizi au msisitizo mkubwa.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “wana wa Israeli”; huu ni utambulisho wa kawaida wa agano kwa watu wa Israeli.
    reason: lexical_alternative
  - marker: c
    text: Au “ninayewafanya kuwa watakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Nawe
  rationale: Kiwakilishi kilichotangulizwa kinadumisha msisitizo na badiliko la mazungumzo kuelekea kwa Musa bila kuongeza ufafanuzi usio katika maandishi.
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: waambie wana wa Israeli hivi
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kuwasilisha amri na fomula ya kuanzisha maneno yanayonukuliwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi usemi wa kifamilia wa Kiebrania na maana yake ya jumuiya ya agano; tanbihi inaeleza maana hiyo.
- source_word: אַךְ
  choice: Hakika
  rationale: Inawasilisha msisitizo mkubwa wa chembe hii bila kufunga maana yake kwa dhana ya upekee pekee; uwezekano wa maana ya kizuizi umehifadhiwa katika tanbihi.
- source_word: שַׁבְּתֹתַי
  choice: Sabato zangu
  rationale: Kiambishi cha upatanisho “zangu” kinaonyesha wazi wingi wa Kiebrania na kuhifadhi jina lililozoeleka la siku hizi za agano.
- source_word: תִּשְׁמֹרוּ
  choice: mtazishika
  rationale: Kitenzi “kushika” ni cha kawaida katika lugha ya amri za agano na kinaweza kujumuisha maana ya kutunza na kuadhimisha.
- source_word: אוֹת
  choice: ishara
  rationale: “Ishara” ni neno la kawaida na sahihi kwa alama yenye kazi ya agano.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: kati yangu nanyi
  rationale: Inadhihirisha wingi wa wanaoambiwa kwa Kiswahili cha asili.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu
  rationale: Inahifadhi wazo la kuendelea kwa ishara hiyo miongoni mwa vizazi vinavyofuatana.
- source_word: לָדַעַת
  choice: ili mjue
  rationale: Inaonyesha kwa uwazi uhusiano wa kusudi unaobebwa na muundo wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika Tetragramatoni limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: מְקַדִּשְׁכֶם
  choice: ninayewatakasa
  rationale: “Kutakasa” huhifadhi kwa ufupi maana ya kumweka mtu wakfu au kumfanya mtakatifu, huku maana mbadala ikitajwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מְקַדִּשְׁכֶם
  choice: ninayewatakasa
  alternative: ninayewafanya kuwa watakatifu
  rationale: “Ninayewatakasa” ni ya kifupi na ya asili katika lugha ya Biblia, lakini haiondoi wazo la kuwafanya watu kuwa watakatifu; tanbihi inalihifadhi wazi.
- issue: Utambulisho wa jumuiya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Usemi wa kifamilia wa Kiebrania umehifadhiwa bila kuzuia maana yake ya kijumuiya, ambayo imefafanuliwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umefanywa wa asili kwa Kiswahili huku msisitizo wa “Nawe,” wingi wa Sabato, lugha ya ishara ya agano, na mvutano wa maana katika אַךְ na מְקַדִּשְׁכֶם vikihifadhiwa.
