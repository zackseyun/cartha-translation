  yaml_path: translation/ot/exodus/031/003.yaml
  text: And I have filled him with the Spirit of God[a], with wisdom, with understanding, with knowledge, and with every kind of craftsmanship,
translation:
  language: sw
  text: Nami nimemjaza Roho wa Mungu[a], kwa hekima, kwa ufahamu, kwa maarifa, na kwa kila aina ya ufundi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “roho ya Mungu” au “roho ya kimungu.” Kirai cha Kiebrania kinaweza kueleweka kwa maana ya jumla zaidi, lakini hapa huenda kinamrejelea Roho wa Mungu mwenyewe anayempa uwezo.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲמַלֵּא
  choice: Nami nimemjaza
  rationale: Kitenzi מלא humaanisha ‘kujaza.’ Muundo huu unaonyesha tendo la Mungu lililotimizwa ambalo matokeo yake yanaendelea; ‘nimemjaza’ ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: אֹתוֹ
  choice: -m- katika ‘nimemjaza’
  rationale: Kiwakilishi cha yambwa kinamrejelea Bezaleli katika muktadha wa karibu na kwa kawaida kinaunganishwa ndani ya kitenzi cha Kiswahili.
- source_word: רוּחַ אֱלֹהִים
  choice: Roho wa Mungu
  rationale: Kirai hiki cha Kiebrania kinaweza kumaanisha Roho wa Mungu au, kwa ujumla zaidi, roho ya kimungu. Katika muktadha huu wa Mungu kumwezesha Bezaleli kwa kazi takatifu, ‘Roho wa Mungu’ ndiyo tafsiri inayofaa zaidi, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: בְּחָכְמָה
  choice: hekima
  rationale: Kihusishi ב kinaonyesha kipawa au uwezo unaoambatana na kujazwa. Katika Kiswahili, orodha ya moja kwa moja baada ya ‘nimemjaza’ ni ya asili na huepuka kurudia ‘kwa’ bila kupoteza maana.
- source_word: וּבִתְבוּנָה
  choice: ufahamu
  rationale: תבונה humaanisha ufahamu, utambuzi, au uelewa. ‘Ufahamu’ ni neno la kawaida linalotofautiana vizuri na hekima na ujuzi.
- source_word: וּבְדַעַת
  choice: ujuzi
  rationale: דעת humaanisha maarifa au ujuzi. Hapa ‘ujuzi’ linafaa kwa muktadha wa uwezo wa kazi, ingawa haliondoi maana pana ya kujua.
- source_word: וּבְכָל מְלָאכָה
  choice: ustadi wa kila aina
  rationale: מלאכה linaweza kumaanisha kazi au ufundi. Kwa kuwa muktadha unaelekea kwenye utengenezaji wenye ustadi wa maskani, ‘ustadi wa kila aina’ ni wa asili na unaeleza uwezo wa kufanya aina zote za ufundi unaohitajika.
theological_decisions:
- issue: Iwapo רוּחַ אֱלֹהִים itafsiriwe kama Roho wa Mungu mwenyewe au kwa maana ya jumla kama roho ya kimungu
  choice: Roho wa Mungu
  alternative: roho ya Mungu; roho ya kimungu
  rationale: Muktadha unaeleza uwezeshaji wa moja kwa moja kutoka kwa Mungu kwa ajili ya huduma takatifu. Herufi kubwa zinaonyesha usomaji huu unaowezekana zaidi bila kuingiza ufafanuzi wa baadaye kuliko maandishi yenyewe; tanbihi inahifadhi utata wa kirai cha Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘Nami nimemjaza’ huhifadhi kiunganishi cha Kiebrania na matokeo ya sasa ya tendo lililotimizwa. Orodha imewekwa kwa mtiririko wa kawaida wa Kiswahili; alama [a] imewekwa mara tu baada ya kirai kinachofafanuliwa.
