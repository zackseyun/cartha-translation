base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/014.yaml
  text: You shall keep the Sabbath[a], because it is holy to you. Whoever profanes it shall surely be put to death, for whoever does work on it[b], that person shall be cut off from among his people.
translation:
  language: sw
  text: Mtaishika Sabato, kwa maana ni takatifu kwenu. Yeyote anayeinajisi hakika atauawa; kwa maana yeyote afanyaye kazi siku hiyo, mtu huyo atakatiliwa mbali kutoka miongoni mwa watu wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli ya Kiebrania “atakatiliwa mbali kutoka miongoni mwa watu wake” ni fomula ya kisheria; hapa haitaji namna hasa ambayo hukumu hiyo itatekelezwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: mtaishika
  rationale: Kitenzi שׁמר hapa kina maana ya kushika au kuadhimisha agizo. “Mtaishika” huhifadhi muundo wa kisheria wa Kiebrania na ni Kiswahili cha kawaida katika muktadha wa agano.
- source_word: הַשַּׁבָּת
  choice: Sabato
  rationale: “Sabato” ni istilahi iliyozoeleka kwa siku au taasisi ya mapumziko inayotajwa hapa.
- source_word: קֹדֶשׁ הִוא לָכֶם
  choice: ni takatifu kwenu
  rationale: Tafsiri hii huhifadhi utakatifu wa Sabato pamoja na maana ya לָכֶם, yaani kuwa takatifu kwao au katika uhusiano wao nayo.
- source_word: מְחַלְלֶיהָ
  choice: yeyote anayeinajisi
  rationale: Mzizi חלל katika piel humaanisha kunajisi au kuvunja utakatifu wa kitu. “Anayeinajisi” ni wazi na huhifadhi nguvu ya kisheria ya kishiriki hiki.
- source_word: מוֹת יוּמָת
  choice: lazima auawe
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi cha kusababisha katika hali tendwa unasisitiza hukumu ya kuuawa. “Lazima auawe” huonyesha uhakika na wajibu wa adhabu hiyo bila kudokeza kwamba mtu huyo atakufa tu kwa namna isiyotajwa.
- source_word: כָּל הָעֹשֶׂה בָהּ מְלָאכָה
  choice: yeyote anayefanya kazi siku hiyo
  rationale: מְלָאכָה ni kazi au shughuli ya kikazi. Kiwakilishi בָהּ kinarejelea Sabato; “siku hiyo” ni marejeo ya asili na yaliyo wazi katika Kiswahili.
- source_word: וְנִכְרְתָה
  choice: atakatiliwa mbali
  rationale: כרת katika niphal ni fomula ya kisheria yenye maana ya kukatiliwa mbali. Tafsiri hii huhifadhi sitiari ya asili bila kubainisha njia ya hukumu.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: mtu huyo
  rationale: נֶפֶשׁ hapa humaanisha mhusika au mtu anayewajibika kisheria, si sehemu isiyo ya kimwili iitwayo nafsi.
- source_word: מִקֶּרֶב עַמֶּיהָ
  choice: na watu wake
  rationale: Kirai hiki kinaonyesha kuondolewa kutoka miongoni mwa jumuiya yake. “Na watu wake” ni Kiswahili cha asili baada ya “atakatiliwa mbali” na hakifungi jinsia ya mhusika.
theological_decisions:
- issue: Maana ya fomula ya adhabu וְנִכְרְתָה ... מִקֶּרֶב עַמֶּיהָ
  choice: Kuhifadhi usemi “atakatiliwa mbali na watu wake” bila kutaja utaratibu wa adhabu.
  alternative: Ataondolewa katika jumuiya; ataangamizwa kwa hukumu ya Mungu.
  rationale: Mstari huu hautaji wazi kama fomula hiyo inamaanisha kufukuzwa, kifo, kutokuwa na uzao, au hukumu ya moja kwa moja ya Mungu. Tafsiri inapaswa kuhifadhi utata huo.
- issue: Maana ya נֶפֶשׁ katika sheria hii
  choice: mtu
  alternative: nafsi
  rationale: Katika muktadha huu neno linamtaja mkosaji mwenyewe. “Mtu” huepuka kuingiza fundisho kuhusu sehemu isiyo ya kimwili ambalo mstari haulengi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria na ya kiagano lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umewekwa wa moja kwa moja, na utata wa fomula ya adhabu umehifadhiwa katika matini na kufafanuliwa kwa tanbihi.
