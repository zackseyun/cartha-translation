  text: וּ/מֵ֣ת כָּל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכ֤וֹר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שִּׁפְחָ֔ה אֲשֶׁ֖ר אַחַ֣ר הָ/רֵחָ֑יִם וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/005.yaml
  text: And every firstborn in the land of Egypt will die[a], from the firstborn of Pharaoh, who sits on his throne, to the firstborn of the servant woman who is behind the millstones, and every firstborn of the livestock.
translation:
  language: sw
  text: Na kila mzaliwa wa kwanza katika nchi ya Misri atakufa, kuanzia mzaliwa wa kwanza wa Farao anayeketi juu ya kiti chake cha enzi mpaka mzaliwa wa kwanza wa mwanamke mtumwa[a] aliye nyuma ya mawe ya kusagia, na kila mzaliwa wa kwanza wa mifugo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kijakazi” au “mtumwa wa kike.” Neno la Kiebrania humaanisha mwanamke mwenye hadhi ya utumwa; kirai “aliye nyuma ya mawe ya kusagia” huonyesha kazi ya kusaga iliyohusishwa na hadhi ya chini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵת
  choice: Na ... atakufa
  rationale: Kauli timilifu ya Kiebrania katika tangazo la kinabii inaeleza kwa uhakika tukio lijalo; wakati ujao wa Kiswahili unafaa katika muktadha huu.
- source_word: כָּל
  choice: kila
  rationale: Pamoja na nomino ya umoja “mzaliwa wa kwanza,” “kila” huonyesha maana ya kugawa kwa mmoja mmoja kwa Kiswahili cha kawaida.
- source_word: בְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Huhifadhi maana ya neno la Kiebrania bila kulifasiri kimyakimya kuwa mwana wa kiume, na linaweza kutumiwa pia kwa wazaliwa wa kwanza wa mifugo.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Hufuata kwa uwazi na kwa lugha ya heshima kirai cha kijiografia cha chanzo.
- source_word: מִבְּכוֹר ... עַד בְּכוֹר
  choice: kuanzia mzaliwa wa kwanza ... mpaka mzaliwa wa kwanza
  rationale: Muundo huu unaonyesha upeo mzima wa kijamii, kutoka nyumba ya kifalme hadi mfanyakazi mwenye hadhi ya chini.
- source_word: פַּרְעֹה הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: Farao, aketiye katika kiti chake cha enzi
  rationale: Kirai cha hali endelevu kinamtambulisha Farao katika mamlaka yake ya kifalme; “aketiye” ni cha heshima na bado kinaeleweka.
- source_word: הַשִּׁפְחָה
  choice: kijakazi
  rationale: Neno hili la Kiswahili huonyesha mwanamke aliye katika hali ya utumishi wa kulazimishwa au umiliki, huku tanbihi ikifafanua wazi uwezekano wa “mwanamke mtumwa” ili hadhi hiyo isifichwe.
- source_word: אַחַר הָרֵחָיִם
  choice: aliye nyuma ya mawe ya kusagia
  rationale: Huhifadhi taswira halisi ya mahali pa kazi ya kusaga nafaka na tofauti ya hadhi inayokusudiwa katika mstari.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: na kila mzaliwa wa kwanza wa mifugo
  rationale: “Mifugo” huwakilisha kwa usahihi wanyama wanaofugwa kwa ujumla, si ng’ombe pekee.
theological_decisions:
- issue: Uwasilishaji wa hadhi ya kijamii katika שִׁפְחָה
  choice: kijakazi, kwa tanbihi “mwanamke mtumwa”
  alternative: mtumishi wa kike
  rationale: Mstari unasisitiza kufikiwa kwa watu wote, kutoka Farao hadi mwanamke anayefanya kazi ya kusaga akiwa na hadhi ya chini. “Mtumishi wa kike” pekee huenda ukapunguza uzito wa hali ya utumwa; tanbihi huhifadhi maana hiyo bila kufanya sentensi kuu kuwa nzito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Kiti cha enzi” huhifadhi taswira ya kifalme, na “mawe ya kusagia” huhifadhi picha halisi ya chanzo.
