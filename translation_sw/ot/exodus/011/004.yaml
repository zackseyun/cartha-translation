base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/004.yaml
  text: 'Then Moses said[a], “Thus says Yahweh: About midnight I will go out into the midst of Egypt.”'
translation:
  language: sw
  text: 'Kisha Musa akasema, “Yahweh asema hivi: Karibu saa sita usiku[a], mimi nitatoka niingie katikati ya Misri.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Saa sita usiku.” Kiambishi cha Kiebrania kilicho mbele ya neno linalomaanisha usiku wa manane kinaweza kuonyesha makadirio; kwa hiyo, “Karibu saa sita usiku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akasema
  rationale: Muundo wa waw-consecutive unaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha sasa na cha kawaida.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Ni usemi wa kawaida wa mjumbe wa kinabii. Wakati uliopo katika Kiswahili unafaa kwa fomula hii ya kunukuu ujumbe wa Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: כַּחֲצֹת הַלַּיְלָה
  choice: Karibu saa sita usiku
  rationale: Kiambishi כְּ־ kinaweza kuonyesha makadirio; “karibu” huhifadhi maana ya muda usioelezwa kwa usahihi kamili. “Saa sita usiku” ni namna ya kawaida ya kusema midnight katika Kiswahili cha Afrika Mashariki.
- source_word: אֲנִי
  choice: mimi
  rationale: Kiwakilishi kilicho wazi katika Kiebrania kimehifadhiwa ili kuonyesha msisitizo wa msemaji.
- source_word: יוֹצֵא
  choice: nitatoka
  rationale: Kitenzi-jina hiki kina maana ya tendo linalokaribia kutokea; wakati ujao unaeleza wazi tangazo hilo.
- source_word: בְּתוֹךְ
  choice: kwenda katikati ya
  rationale: Kauli hii inaonyesha mwendo kuelekea ndani ya eneo la Misri. “Kwenda katikati ya” huepuka kueleweka kana kwamba Mungu anatoka Misri kabisa.
- source_word: מִצְרָיִם
  choice: Misri
  rationale: Hili ndilo jina la kawaida la nchi hiyo katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova au BWANA
  rationale: Andiko linatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Nuansi ya wakati katika כַּחֲצֹת הַלַּיְלָה
  choice: Karibu saa sita usiku
  alternative: Saa sita usiku
  rationale: כְּ־ inaweza kuwa ya makadirio. Neno “karibu” halifanyi wakati huo kuwa sahihi kabisa kuliko Kiebrania kinavyodokeza.
- issue: Mwelekeo wa tendo katika יוֹצֵא בְּתוֹךְ מִצְרָיִם
  choice: nitatoka kwenda katikati ya Misri
  alternative: nitatoka katikati ya Misri; nitapita katikati ya Misri
  rationale: Chaguo hili huhifadhi kitenzi cha kutoka pamoja na mwendo kuelekea ndani ya Misri, bila kudokeza kimakosa kwamba Mungu anaondoka kutoka Misri wala kuongeza wazi maana ya “kupita” ambayo haijasemwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Usemi “saa sita usiku” umetumiwa badala ya “usiku wa manane” kwa kuwa ni wa kawaida na sahihi katika mfumo wa saa wa Kiswahili. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja.
