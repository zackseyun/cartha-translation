  text: וּ/לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל לֹ֤א יֶֽחֱרַץ כֶּ֨לֶב֙ לְשֹׁנ֔/וֹ לְ/מֵ/אִ֖ישׁ וְ/עַד בְּהֵמָ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ/ן אֲשֶׁר֙ יַפְלֶ֣ה יְהוָ֔ה בֵּ֥ין מִצְרַ֖יִם וּ/בֵ֥ין יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/007.yaml
  text: But against any of the sons of Israel[a], not a dog will sharpen its tongue, from man to beast, so that you may know that Yahweh makes a distinction between Egypt and Israel.
translation:
  language: sw
  text: Lakini dhidi ya Waisraeli wote, mbwa hata mmoja hatanoa ulimi wake dhidi ya mtu wala mnyama, ili mpate kujua kwamba Yahweh hufanya tofauti kati ya Misri na Israeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְכֹל בְּנֵי יִשְׂרָאֵל
  choice: Lakini kwa Waisraeli wote
  rationale: Kiunganishi kinaonyesha tofauti na yatakayowapata Wamisri katika mstari uliotangulia. 'Waisraeli wote' ni Kiswahili cha kawaida kinachowakilisha kwa usahihi usemi wa Kiebrania 'wana wa Israeli' bila kuufanya kuwa mzito.
- source_word: לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ
  choice: hakuna hata mbwa atakayenoa ulimi wake
  rationale: Tafsiri hii inahifadhi taswira halisi na yenye nguvu ya Kiebrania. Alama ya chini inaeleza maana ya kimsemo, yaani kwamba hakuna mbwa atakayewabwekea au kuwatishia.
- source_word: לְמֵאִישׁ וְעַד בְּהֵמָה
  choice: dhidi ya mtu wala mnyama
  rationale: Usemi huu unaonyesha upeo kamili unaohusisha wanadamu na wanyama. 'Dhidi ya' inaunganisha kirai hicho kwa kawaida na kitendo cha mbwa katika Kiswahili.
- source_word: לְמַעַן תֵּדְעוּן
  choice: ili mpate kujua
  rationale: Hii ni tafsiri ya kawaida ya kishazi cha kusudi, na inadumisha wingi wa nafsi ya pili katika kitenzi cha Kiebrania.
- source_word: יַפְלֶה
  choice: anaweka tofauti
  rationale: Katika muktadha huu, kitenzi kinamaanisha kutenganisha au kubainisha makundi mawili, si hasa kufanya jambo la ajabu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: בֵּין מִצְרַיִם וּבֵין יִשְׂרָאֵל
  choice: kati ya Misri na Israeli
  rationale: Majina ya mataifa yamedumishwa kama yalivyo katika Kiebrania, yakihifadhi utofautishaji wa kihistoria kati yao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja jina la Mungu, si cheo. 'Yahweh' hudumisha jina hilo kwa unukuzi unaokubalika wa kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya Kiebrania imehifadhiwa katika matini kuu, huku maana yake ya kimsemo ikifafanuliwa katika tanbihi.
