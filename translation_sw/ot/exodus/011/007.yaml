- from: Lakini kwa Waisraeli wote, hakuna hata mbwa atakayenoa ulimi wake[a], dhidi ya mtu wala mnyama, ili mpate kujua kwamba Yahweh anaweka tofauti kati ya Misri na Israeli.
  to: Lakini dhidi ya Waisraeli wote, mbwa hata mmoja hatanoa ulimi wake dhidi ya mtu wala mnyama, ili mpate kujua kwamba Yahweh hufanya tofauti kati ya Misri na Israeli.
  rationale: The revision clarifies that the dog's action is not directed against Israel while retaining the literal Hebrew image of a dog sharpening its tongue. It also replaces a mild calque with idiomatic Swahili for Yahweh's distinction. The lexical-alternative footnote remains anchored to 'hatanoa ulimi wake' and explains the idiomatic reading without treating it as the only possible sense.
