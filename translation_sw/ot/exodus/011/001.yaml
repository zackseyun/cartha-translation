  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה ע֣וֹד נֶ֤גַע אֶחָד֙ אָבִ֤יא עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם אַֽחֲרֵי כֵ֕ן יְשַׁלַּ֥ח אֶתְ/כֶ֖ם מִ/זֶּ֑ה כְּ/שַׁ֨לְּח֔/וֹ כָּלָ֕ה גָּרֵ֛שׁ יְגָרֵ֥שׁ אֶתְ/כֶ֖ם מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/001.yaml
  text: Then Yahweh said to Moses[a], “One more plague I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away[b], he will surely drive you out completely from here.”
translation:
  language: sw
  text: Kisha Yahweh akamwambia Musa, “Nitaleta pigo[a] moja zaidi juu ya Farao na juu ya Misri. Baada ya hayo atawaacha waondoke hapa. Atakapowaacha waondoke, atawafukuza kabisa[b] kutoka hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tauni,” “dhiki,” au “pigo.” Neno la Kiebrania linaweza kumaanisha pigo au mateso yanayoletwa.
    reason: lexical_alternative
  - marker: b
    text: Usemi wa Kiebrania una mkazo; kihalisi, “kufukuza atawafukuza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw inayosogeza simulizi mbele imetafsiriwa kwa ‘Kisha,’ huku ‘akamwambia’ ikiwa njia ya kawaida na ya heshima ya kuendeleza masimulizi kwa Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lenye herufi nne limeandikwa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: עוֹד נֶגַע אֶחָד
  choice: pigo moja zaidi
  rationale: ‘Moja zaidi’ linaonyesha maana ya nyongeza ya עוֹד, na ‘pigo’ linaakisi upana wa נֶגַע bila kulifanya lazima liwe ugonjwa wa kuambukiza.
- source_word: אָבִיא עַל פַּרְעֹה וְעַל מִצְרַיִם
  choice: Nitaleta ... juu ya Farao na juu ya Misri
  rationale: Muundo huu unahifadhi hatua ya hukumu inayoletwa na kurudiwa kwa kihusishi עַל katika sentensi ya Kiebrania.
- source_word: אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Ni kiunganishi cha wakati cha kawaida kinachohifadhi mfuatano wa matukio.
- source_word: יְשַׁלַּח אֶתְכֶם מִזֶּה
  choice: atawaacha mwondoke hapa
  rationale: Katika muktadha huu שׁלח ina maana ya kuwaruhusu waondoke au kuwaondosha; ‘atawaacha mwondoke’ ni Kiswahili cha kawaida na kinatofautishwa na tendo kali zaidi la kuwafukuza katika kishazi kinachofuata.
- source_word: כְּשַׁלְּחוֹ
  choice: Atakapowaacha mwondoke
  rationale: Kiambishi כְּ־ kimetolewa kwa maana ya wakati, ‘atakapo-,’ na kurudiwa kwa wazo la kuondoka kunadumisha uhusiano na kishazi kilichotangulia.
- source_word: כָּלָה גָּרֵשׁ יְגָרֵשׁ
  choice: hakika atawafukuza kabisa
  rationale: ‘Hakika’ linaonyesha mkazo wa infinitivu kamili pamoja na kitenzi, na ‘kabisa’ linaonyesha ukamilifu unaoletwa na כָּלָה.
- source_word: מִזֶּה
  choice: kutoka hapa
  rationale: Hii ni tafsiri ya kawaida ya rejeo la mahali walipo, yaani Misri.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. ‘Yahweh’ linahifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Pigo’ limechaguliwa badala ya ‘tauni’ ili lisidokeze ugonjwa wa kuambukiza tu. Tofauti kati ya kuachwa waondoke na kufukuzwa imehifadhiwa.
