base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/008.yaml
  text: Then all these servants of yours will come down to me and bow down to me[a], saying, ‘Go out[b], you and all the people who are at your feet,’ and after that I will go out.” And he went out from Pharaoh in burning anger.
translation:
  language: sw
  text: Ndipo watumishi wako hawa wote watashuka kuja kwangu na kunisujudia, wakisema, ‘Ondoka, wewe pamoja na watu wote wanaokufuata.’ Baada ya hayo nitaondoka.” Kisha Musa akatoka mbele ya Farao akiwa amewaka kwa hasira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: watashuka kuja kwangu
  rationale: Kitenzi ירד kina maana ya kushuka; kuongeza “kuja kwangu” kunahifadhi mwelekeo unaotazamwa kutoka kwa Musa na ni Kiswahili cha kawaida.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: עבד inaweza kumaanisha watumishi au maofisa wa kifalme; “watumishi wako” huhifadhi upana wa neno na hali ya kumwambia Farao moja kwa moja.
- source_word: וְהִשְׁתַּחֲוּוּ לִי
  choice: kunisujudia
  rationale: Kitenzi kinaonyesha kuinama au kujilaza mbele ya mtu kwa heshima; “kunisujudia” kinaonyesha tendo hilo bila kulifanya lazima kuwa ibada.
- source_word: צֵא אַתָּה
  choice: Ondoka, wewe
  rationale: “Ondoka” huwasilisha amri ya kutoka mahali hapo, huku “wewe” ikihifadhi msisitizo wa kiwakilishi אַתָּה.
- source_word: וְכָל הָעָם אֲשֶׁר בְּרַגְלֶיךָ
  choice: pamoja na watu wote wanaokufuata
  rationale: Kwa neno halisi ni watu “walio miguuni pako,” nahau inayowataja wanaoandamana na mtu au kumfuata; tafsiri hii hutoa maana wazi kwa msomaji wa sasa.
- source_word: וְאַחֲרֵי כֵן אֵצֵא
  choice: Baada ya hayo nitaondoka
  rationale: Huhifadhi mfuatano wa wakati na wazo la Musa kutoka baada ya watu wa Farao kuja kwake.
- source_word: וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: Kisha Musa akaondoka mbele ya Farao
  rationale: Musa ndiye mhusika anayeeleweka katika simulizi; kutaja jina lake huondoa utata wa kiwakilishi kwa Kiswahili, na “mbele ya Farao” huwakilisha מֵעִם katika mazingira ya kukutana ana kwa ana.
- source_word: בָּחֳרִי אָף
  choice: akiwa amewaka hasira
  rationale: Nahau ya Kiebrania huonyesha joto kali la hasira; msemo huu ni wa asili katika Kiswahili na huhifadhi nguvu ya taswira hiyo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi sauti kali ya Musa na taswira ya kushuka, kusujudu, kuondoka, na hasira inayowaka bila kuongeza ufafanuzi wa kimadhehebu.
