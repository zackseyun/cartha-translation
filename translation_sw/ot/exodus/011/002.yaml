review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the directive to request silver and gold articles and appropriately avoids making return of the items explicit. However, "watu wote" adds “all,” which is absent from הָעָם, and the opening construction is syntactically awkward. The singular distributive requests are otherwise retained appropriately.
  naturalness: '"Sema sasa watu wote wakisikia" is not natural Standard East African Swahili. "Sema sasa watu wasikie" is clear, idiomatic, and conveys the public-audible force of the Hebrew idiom without adding the idea that every individual is included.'
  terminology: '"Kuomba" and "vitu vya fedha ... vya dhahabu" are suitably broad and accurate. "Mwanamume/mwanamke mwenzake" preserves the paired masculine and feminine referents. The footnote’s alternative "aazime" should be normalized as "akopeshe" only if meaning lend, which is not intended; "aazime" is acceptable as the traditional lexical alternative for borrow, but the quoted form should agree with the subjunctive wording of the verse: "aazime."'
  issues:
  - severity: medium
    issue: “watu wote” adds an unexpressed universal.
    rationale: הָעָם means “the people”; it does not contain כֹּל (“all/every”).
  - severity: medium
    issue: The opening clause is awkward and does not cleanly express the hearing idiom.
    rationale: “Sema sasa watu wote wakisikia” lacks a natural connective structure. “Sema sasa watu wasikie” communicates that the people are to hear the speech publicly.
