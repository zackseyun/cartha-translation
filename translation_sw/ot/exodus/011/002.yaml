  rationale: Removed the unsupported “wote” and recast the hearing idiom in natural Swahili. Reordered the shared requested objects after the first parallel clause; in Swahili this makes clear that both men and women are to request the same kinds of articles, while preserving the source’s parallelism and scope. The footnote retains the traditional alternative without asserting a return obligation.
