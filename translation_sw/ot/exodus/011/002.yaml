base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/002.yaml
  text: Speak now in the hearing of the people[a], and let each man ask from his neighbor, and each woman from her neighbor, for articles of silver and articles of gold.
translation:
  language: sw
  text: 'Sema sasa watu wasikie: Kila mwanamume amwombe[a] mwanamume mwenzake vitu vya fedha na vitu vya dhahabu, na kila mwanamke amwombe mwanamke mwenzake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aazime.” Kitenzi cha Kiebrania kinamaanisha “kuomba” au “kutaka apewe,” wala chenyewe hakisemi kwamba vitu hivyo vilipaswa kurudishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֶּר נָא
  choice: Sema sasa
  rationale: Kauli ya amri imewasilishwa moja kwa moja; “sasa” linaonyesha msisitizo au uharaka wa נָא bila kufanya amri ya Mungu isikike kama ombi la heshima.
- source_word: בְּאָזְנֵי הָעָם
  choice: watu wote wakisikia
  rationale: Hii ni tafsiri ya asili ya nahau ya Kiebrania “masikioni mwa watu,” ikihifadhi maana ya kusema kwa kusikika wazi bila kutumia kalika ngumu ya Kiswahili.
- source_word: וְיִשְׁאֲלוּ
  choice: amwombe
  rationale: Kitenzi שאל humaanisha kuomba au kutaka apewe; hakitaji chenyewe kuwa vitu vitarudishwa. Hali ya utegemezi ya Kiswahili baada ya maagizo inadumisha nguvu ya amri ya jussive.
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  choice: kila mwanamume ... mwanamume mwenzake
  rationale: “Kila mwanamume” inadumisha maana ya mgawanyo ya nomino ya umoja, nayo “mwanamume mwenzake” inaonyesha jinsia na wazo pana la mtu wa karibu au jirani.
- source_word: וְאִשָּׁה מֵאֵת רְעוּתָהּ
  choice: na kila mwanamke ... mwanamke mwenzake
  rationale: Muundo sambamba unadumisha umoja wa mgawanyo na umbo la kike la neno la Kiebrania.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: vitu vya fedha na vitu vya dhahabu
  rationale: כְּלִי ni neno pana kwa kitu, chombo, au kifaa. “Vitu” huepuka kubainisha bila msingi kwamba vilikuwa vyombo vya matumizi au mapambo pekee.
theological_decisions:
- issue: Maana ya שאל katika habari ya Waisraeli kupokea vitu vya thamani kutoka kwa Wamisri
  choice: kuomba
  alternative: kuazima
  rationale: Kitenzi cha Kiebrania chenyewe kinamaanisha kuomba au kutaka apewe, wala hakisemi kwamba vitu vilipaswa kurudishwa. Tafsiri ya jadi “kuazima” imehifadhiwa katika tanbihi kwa sababu huathiri namna tukio linavyoeleweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “watu wote wakisikia” unatoa nahau ya Kiebrania kwa lugha ya kawaida, huku jozi “mwanamume mwenzake / mwanamke mwenzake” ikihifadhi ulinganifu wa kijinsia wa chanzo.
