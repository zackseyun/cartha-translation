  text: וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת חֵ֥ן הָ/עָ֖ם בְּ/עֵינֵ֣י מִצְרָ֑יִם גַּ֣ם הָ/אִ֣ישׁ מֹשֶׁ֗ה גָּד֤וֹל מְאֹד֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/עֵינֵ֥י עַבְדֵֽי פַרְעֹ֖ה וּ/בְ/עֵינֵ֥י הָ/עָֽם־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/003.yaml
  text: And Yahweh gave the people favor in the sight of the Egyptians[a]. Moreover, the man Moses was very great in the land of Egypt[d][c][b], in the sight of Pharaoh’s servants and in the sight of the people.
translation:
  language: sw
  text: Yahwe akawajalia watu hao kibali mbele ya Wamisri.[a] Zaidi ya hayo, Musa alikuwa mtu mkuu sana katika nchi ya Misri, mbele ya watumishi wa Farao[c] na mbele ya watu.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “machoni pa Wamisri.”
    reason: lexical_alternative
  - marker: c
    text: Au, “maofisa wa Farao”; Kiebrania kwa neno kwa neno ni “watumishi wa Farao.”
    reason: lexical_alternative
  - marker: d
    text: Inaelekea kwamba “watu” hapa ni umma mpana wa Misri, tofauti na watumishi wa Farao, lakini Kiebrania hakisemi hivyo wazi.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu lililoandikwa katika Kiebrania badala ya kulibadilisha kuwa cheo kama “BWANA.” Tahajia “Yahwe” ni ya kawaida na inayosomeka kwa urahisi katika Kiswahili.
- source_word: וַיִּתֵּן ... חֵן
  choice: akawajalia ... kibali
  rationale: Kirai hiki kinaeleza kwamba Yahwe aliwawezesha watu kupata mtazamo mwema kutoka kwa Wamisri. “Akawajalia ... kibali” ni Kiswahili cha kawaida huku kikihifadhi wazo la Mungu kutoa kibali.
- source_word: הָעָם
  choice: watu hao
  rationale: Kiebrania kinasema “watu,” ambao katika muktadha ni watu wa Israeli. “Hao” huunganisha rejeo hili na muktadha bila kuongeza jina “Waisraeli” lisilotajwa wazi katika mstari.
- source_word: בְּעֵינֵי מִצְרַיִם
  choice: mbele ya Wamisri
  rationale: Hii ni tafsiri ya kawaida ya nahau ya Kiebrania “machoni pa Wamisri,” ikimaanisha kwa mtazamo au makadirio yao.
- source_word: גַּם
  choice: Zaidi ya hayo
  rationale: Inaonyesha kwamba taarifa kuhusu Musa inaongezwa kwa taarifa iliyotangulia, huku ikihifadhi msisitizo wa kiunganishi cha Kiebrania.
- source_word: הָאִישׁ מֹשֶׁה
  choice: mtu huyo Musa
  rationale: Inahifadhi neno la Kiebrania “mtu” na msisitizo wake kabla ya jina Musa, ingawa mpangilio huo ni wenye alama maalumu katika Kiswahili pia.
- source_word: גָּדוֹל מְאֹד
  choice: mkuu sana
  rationale: Inahifadhi upana wa maana ya Kiebrania kuhusu ukuu, hadhi, au umuhimu wa Musa bila kuifupisha kuwa sifa moja tu kama “aliheshimiwa.”
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Inafuata kirai kamili cha Kiebrania badala ya kukifupisha kuwa “Misri.”
- source_word: בְּעֵינֵי עַבְדֵי פַרְעֹה
  choice: mbele ya watumishi wa Farao
  rationale: “Watumishi” ni maana ya moja kwa moja ya עֲבָדִים, huku muktadha wa kifalme ukiruhusu pia maana ya maofisa.
- source_word: וּבְעֵינֵי הָעָם
  choice: na mbele ya watu
  rationale: Inahifadhi neno la jumla “watu” na kutatua kwa lazima iwapo linamaanisha Wamisri wote au umma wa kawaida tofauti na watumishi wa Farao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: “Yahwe” linawasilisha jina binafsi lililo katika matini ya Kiebrania bila kulibadilisha kuwa cheo, wala kuingiza dai la kimadhehebu.
- issue: Asili ya ukuu wa Musa nchini Misri
  choice: alikuwa mkuu sana
  alternative: aliheshimiwa sana au alikuwa mashuhuri sana
  rationale: Matini haisemi wazi kama ukuu huo ulikuwa hasa heshima, umaarufu, mamlaka, au hadhi. Tafsiri pana inalinda mvutano na upana huo wa maana.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa ulinganifu bora: nahau zisizo za kawaida zimetolewa kwa Kiswahili kinachoeleweka, lakini maneno yenye uzito au utata kama “mtu huyo Musa,” “mkuu sana,” na “watu” yamehifadhiwa bila kufasiriwa kupita kiasi.'
