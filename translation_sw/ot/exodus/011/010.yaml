  text: וּ/מֹשֶׁ֣ה וְ/אַהֲרֹ֗ן עָשׂ֛וּ אֶת כָּל הַ/מֹּפְתִ֥ים הָ/אֵ֖לֶּה לִ/פְנֵ֣י פַרְעֹ֑ה וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹֽא שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/010.yaml
  text: And Moses and Aaron did all these signs before Pharaoh[a], and Yahweh hardened Pharaoh’s heart[c][b], and he did not let the sons of Israel go out from his land.
translation:
  language: sw
  text: Musa na Aroni walifanya ishara[a] hizi zote mbele ya Farao, na Yahwe akaufanya moyo wa Farao kuwa mgumu[b], na Farao hakuwaruhusu wana wa Israeli[c] watoke katika nchi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maajabu haya yote.” Neno la Kiebrania linaweza kumaanisha ishara za kimiujiza au maajabu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Yahwe akautia nguvu moyo wa Farao” au “akaufanya moyo wa Farao kuwa thabiti.”
    reason: lexical_alternative
  - marker: c
    text: Au, “Waisraeli” au “watoto wa Israeli.” Kiebrania kihalisi ni “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Musa na Aroni
  rationale: Majina haya yametolewa kwa maumbo yake ya kawaida katika Kiswahili sanifu.
- source_word: עָשׂוּ
  choice: walifanya
  rationale: Kitenzi עשה kina maana pana ya kufanya; “walifanya” ni tafsiri ya moja kwa moja na ya kawaida pamoja na “ishara.”
- source_word: כָּל הַמֹּפְתִים הָאֵלֶּה
  choice: ishara hizi zote
  rationale: מוֹפֵת inaweza kumaanisha ishara ya kimiujiza au tendo la ajabu; “ishara” inadumisha kusudi la matendo hayo la kuonyesha uwezo wa Mungu mbele ya Farao.
- source_word: לִפְנֵי פַרְעֹה
  choice: mbele ya Farao
  rationale: Ni usemi wa asili wa Kiswahili unaolingana moja kwa moja na maana ya uwepo au ukabiliano katika לִפְנֵי.
- source_word: וַיְחַזֵּק
  choice: akaufanya ... kuwa mgumu
  rationale: Katika mfululizo wa simulizi kuhusu moyo wa Farao, usemi huu unaonyesha kuimarishwa kwa ukaidi wake. Tanbihi inadumisha picha halisi zaidi ya kuutia nguvu au kuufanya thabiti.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa na cheo.
- source_word: לֵב פַּרְעֹה
  choice: moyo wa Farao
  rationale: Hili ni umbo la kawaida la Kiswahili la kuonyesha uhusiano wa umilikaji katika muundo wa Kiebrania.
- source_word: שִׁלַּח
  choice: hakuwaruhusu ... waondoke
  rationale: Katika muktadha wa kutoka Misri, kitenzi hiki kinamaanisha kutowapa ruhusa waondoke; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inadumisha kwa karibu umbo halisi la Kiebrania, huku tanbihi ikitoa maana yake ya pamoja, “Waisraeli.”
- source_word: מֵאַרְצוֹ
  choice: katika nchi yake
  rationale: Muundo “waondoke katika nchi yake” unaonyesha mwendo wa kutoka mahali na ni wa kawaida katika Kiswahili.
theological_decisions:
- issue: Tendo la Yahwe juu ya moyo wa Farao
  choice: Yahwe akaufanya moyo wa Farao kuwa mgumu
  alternative: Yahwe akautia nguvu moyo wa Farao; Yahwe akaufanya moyo wa Farao kuwa thabiti
  rationale: Tafsiri kuu inaonyesha wazi ukaidi uliothibitishwa katika muktadha, bila kupunguza mvutano wa kifundisho kati ya tendo la Mungu na wajibu wa Farao. Tanbihi inahifadhi uwezekano wa picha ya msingi ya חזק.
- issue: Maana ya pamoja ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Usemi halisi wa Kiebrania umehifadhiwa katika matini, lakini tanbihi inaeleza kuwa unawahusu watu wa Israeli kwa pamoja.
- issue: Kiima cha שִׁלַּח
  choice: Farao hakuwaruhusu
  alternative: naye hakuwaruhusu
  rationale: Kiebrania kina kiima kilichodokezwa, ambacho katika muktadha ni Farao. Kurudia “Farao” katika Kiswahili huepuka kumfanya msomaji adhani kimakosa kwamba kiwakilishi kinamrejelea Yahwe, kiima kilicho karibu zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Viunganishi vya Kiebrania vimehifadhiwa kwa “na”; sentensi imegawanywa baada ya kishazi cha kwanza ili kuboresha usomaji bila kubadili mtiririko wa habari.
