  yaml_path: translation/ot/exodus/011/006.yaml
  text: And there will be a great cry throughout all the land of Egypt[a], such as has never happened before, nor will ever happen again.
translation:
  language: sw
  text: Na kutakuwa na kilio kikubwa katika nchi yote ya Misri[a], ambacho hakijawahi kutokea wala hakitatokea tena kamwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mayowe makubwa” au “maombolezo makubwa.” Neno la Kiebrania צְעָקָה linaweza kumaanisha kilio kikubwa cha dhiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Ndipo kutakuwa na
  rationale: Muundo huu unatoa nguvu ya tangazo la wakati ujao katika muktadha huu na unaunganisha aya kwa kawaida na yaliyotangulia.
- source_word: צְעָקָה
  choice: kilio
  rationale: Neno hili linaweza kumaanisha kilio kikubwa cha dhiki; “kilio” ni la kawaida na lenye hadhi katika Kiswahili, huku tanbihi ikihifadhi maana mbadala.
- source_word: גְדֹלָה
  choice: kikubwa
  rationale: Huhifadhi kwa karibu ukubwa unaosisitizwa na kivumishi cha Kiebrania bila kuibana maana kuwa sauti kubwa pekee.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: katika nchi yote ya Misri
  rationale: Huwasilisha wazi kwamba kilio kitaenea katika eneo lote la Misri kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה
  choice: ambacho hakijawahi kutokea
  rationale: Kitenzi היה hapa kinaeleza tukio kutokea; usemi huu ni wa asili na huhifadhi ulinganisho na matukio yote yaliyotangulia.
- source_word: וְכָמֹהוּ לֹא תֹסִף
  choice: wala hakitatokea tena kamwe
  rationale: Baada ya ukanushi, יסף hubeba maana ya kutofanyika tena; “kamwe” huonyesha nguvu kamili ya kauli hiyo.
