base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/009.yaml
  text: And Yahweh said to Moses[a], “Pharaoh will not listen to you[c][b], so that my wonders may be multiplied in the land of Egypt.”
translation:
  language: sw
  text: Yahwe akamwambia Musa[c], “Farao hatawasikiliza ninyi[a], ili maajabu yangu yazidi kuwa mengi[b] katika nchi ya Misri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatawasikia ninyi” au “hatawatii ninyi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ishara zangu.” Neno la Kiebrania linaweza kumaanisha maajabu, ishara, au matukio ya kustaajabisha.
    reason: lexical_alternative
  - marker: c
    text: Baadhi ya tafsiri husema, “Yahwe alikuwa amemwambia Musa,” ili kuhusianisha kauli hii na masimulizi yaliyotangulia; lakini umbo la kitenzi cha Kiebrania hapa ni wakati wa kawaida wa simulizi.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna inayotumika kwa kawaida katika Kiswahili, badala ya kulibadilisha kuwa cheo kama ‘BWANA’.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Wayyiqtol ni umbo la kawaida la kusogeza simulizi mbele; ‘akamwambia’ ni la asili katika masimulizi ya Kiswahili na halilazimishi maana ya wakati uliotangulia.
- source_word: לֹא יִשְׁמַע אֲלֵיכֶם
  choice: hatawasikiliza ninyi
  rationale: Kitenzi שׁמע pamoja na אֶל hapa kina maana ya kusikiliza au kutii. ‘Hatawasikiliza’ huhifadhi maana hiyo bila kuifupisha kuwa ‘hatawatii’; wingi wa kiambishi cha Kiebrania umeonyeshwa wazi kwa ‘ninyi,’ ukimhusu Mose pamoja na Haruni.
- source_word: לְמַעַן
  choice: ili
  rationale: ‘Ili’ huwasilisha kwa Kiswahili cha kawaida nguvu ya kusudi ya kiunganishi hiki, huku uhusiano wa matokeo ukiendelea kueleweka katika muktadha.
- source_word: רְבוֹת
  choice: yazidi kuwa mengi
  rationale: Infinitivu ya רבה inaonyesha kuongezeka kwa idadi. Usemi huu ni wa asili zaidi katika Kiswahili kuliko tafsiri ya kimofolojia kama ‘yazidishwe,’ na huhifadhi wazo la maajabu kuwa mengi.
- source_word: מוֹפְתַי
  choice: maajabu yangu
  rationale: מוֹפֵת inaweza kumaanisha ajabu, ishara, au tukio la kustaajabisha. ‘Maajabu’ linafaa katika simulizi la mapigo na kuonyesha matendo ya kushangaza bila kuongeza neno ‘miujiza’ lisilokuwapo moja kwa moja.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Tafsiri hii huhifadhi neno אֶרֶץ (‘nchi’) na bado ni Kiswahili cha kawaida.
theological_decisions:
- issue: Kusudi la Mungu katika Farao kukataa kusikiliza
  choice: ‘ili maajabu yangu yazidi kuwa mengi’
  alternative: ‘na matokeo yake maajabu yangu yatazidi kuwa mengi’
  rationale: לְמַעַן kwa kawaida huonyesha kusudi. Tafsiri inahifadhi mvutano wa kifungu kati ya kukataa kwa Farao na kusudi la Mungu bila kuingiza maelezo ya ziada kuhusu kuufanya moyo kuwa mgumu.
- issue: Wakati wa kauli ya Yahwe kwa Mose
  choice: ‘Yahwe akamwambia Mose’
  alternative: ‘Yahwe alikuwa amemwambia Mose’
  rationale: Umbo la Kiebrania ni wakati wa kawaida wa simulizi. Ingawa wakati uliotangulia unaweza kutumiwa ili kulainisha mpangilio wa muktadha, hauhitajiki na umbo lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akamwambia’ linafaa kwa mtiririko wa simulizi; ‘hatawasikiliza ninyi’ huweka wazi kwamba kiambishi cha Kiebrania ni cha wingi. Alama zote za tanbihi zimewekwa katika matini kuu.
