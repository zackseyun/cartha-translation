review_pass:
  verdict: revise
  source_fidelity: Draft accurately represents the imperative to the assembly, the source of the contribution, its dedication to Yahwe, the voluntary disposition of the giver, and the list of metals. “Shaba” is an acceptable broad Kiswahili equivalent for נְחֹשֶׁת in this ancient-material context.
  naturalness: The wording is generally clear and standard. However, “moyo wake uko tayari” more naturally means that a person’s heart is ready, rather than expressing the Hebrew idiom of willing or generous voluntary disposition. “Mwenye moyo wa hiari” is idiomatic, concise, and preserves the heart-language.
  terminology: “Sadaka” appropriately renders תְּרוּמָה here as a sacred contribution without requiring a technical sacrificial sense. “Yahwe” consistently preserves the divine name. “Dhahabu, fedha na shaba” is natural modern Standard East African Swahili.
  issues:
  - severity: low
    issue: “moyo wake uko tayari” is weaker than the Hebrew voluntary-disposition idiom.
    rationale: נְדִיב לִבּוֹ characterizes the giver as willing/generous of heart. “Mwenye moyo wa hiari” conveys this more directly and naturally in Kiswahili.
