base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/005.yaml
  text: 'Take from among you an offering for Yahweh[a]. Everyone whose heart is willing shall bring it—Yahweh’s offering: gold, silver[b], and bronze.'
translation:
  language: sw
  text: 'Chukueni kutoka miongoni mwenu sadaka kwa ajili ya Yahwe. Kila mtu mwenye moyo wa hiari ailete—sadaka ya Yahwe: dhahabu, fedha na shaba.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְחוּ
  choice: Chukueni
  rationale: Kauli ya amri kwa wingi ya לקח inaagiza kusanyiko lichukue sadaka; “Chukueni” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: מֵאִתְּכֶם
  choice: kutoka miongoni mwenu
  rationale: Kirai kinaonyesha chanzo ndani ya jumuiya, si tu kutoka kwa mtu mmoja mmoja.
- source_word: תְּרוּמָה
  choice: sadaka
  rationale: Katika muktadha wa vifaa vya Maskani, neno linamaanisha mchango uliotengwa kwa matumizi matakatifu; “sadaka” ni neno la kawaida na pana bila kuingiza wazo maalumu la sadaka ya kuteketezwa.
- source_word: לַיהוָה / יְהוָה
  choice: kwa ajili ya Yahwe / ya Yahwe
  rationale: Jina la agano יהוה limehifadhiwa kama “Yahwe”; ל־ inaonyesha sadaka hiyo imewekwa wakfu kwa ajili yake.
- source_word: כֹּל נְדִיב לִבּוֹ
  choice: Kila mtu ambaye moyo wake uko tayari
  rationale: Tafsiri hii huhifadhi lugha ya “moyo” na kueleza kwa Kiswahili cha kawaida utayari wa hiari wa ndani.
- source_word: יְבִיאֶהָ
  choice: ailete
  rationale: Kiwakilishi cha yambwa kinarejelea sadaka; umbo hili linaonyesha hatua inayotarajiwa bila kuifanya sadaka ya hiari ionekane ya kulazimishwa.
- source_word: אֵת תְּרוּמַת יְהוָה
  choice: sadaka ya Yahwe
  rationale: Kirai hiki kinarudia na kufafanua sadaka iliyotajwa, huku muundo wa uamilifu ukitafsiriwa kwa kawaida katika Kiswahili.
- source_word: זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: dhahabu, fedha na shaba
  rationale: Haya ndiyo majina ya kawaida ya metali hizo katika Kiswahili; “shaba” huweza kutaja metali ya נחשת katika muktadha huu wa vifaa vya kale.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Hiari ya mtoaji dhidi ya lugha ya amri
  choice: Amri inatolewa kwa jumuiya kukusanya, lakini kuleta kunatokana na moyo ulio tayari
  alternative: Kueleza kwamba kila mtu analazimika kutoa
  rationale: כֹּל נְדִיב לִבּוֹ huweka wazi hali ya ndani ya hiari; tafsiri haipaswi kuondoa mvutano kati ya amri ya kukusanya na utoaji wa hiari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inahifadhi urudiaji wa “sadaka” na lugha ya moyo ya Kiebrania. Alama ya mkato mrefu inaonyesha kwamba maneno yanayofuata yanafafanua sadaka hiyo.
