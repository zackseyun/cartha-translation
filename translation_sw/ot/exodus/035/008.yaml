  text: mafuta kwa ajili ya mwanga, na manukato kwa ajili ya mafuta ya upako na kwa ajili ya uvumba wa manukato,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁמֶן
  choice: mafuta
  rationale: Nomino hii humaanisha mafuta kwa upana; ingawa katika muktadha huu huenda ni mafuta ya zeituni, Kiebrania hakilitaji hilo waziwazi.
- source_word: לַמָּאוֹר
  choice: kwa ajili ya mwanga
  rationale: Tafsiri hii inahifadhi muundo wa nomino wa Kiebrania na kueleza kusudi la mafuta katika hema takatifu bila kuongeza neno 'taa' ambalo halipo wazi katika kifungu hiki.
- source_word: בְשָׂמִים
  choice: manukato
  rationale: Neno hili linataja vitu vyenye harufu nzuri vilivyotumiwa katika maandalizi matakatifu; 'manukato' ni la kawaida na pana katika Kiswahili.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: mafuta ya kutiwa wakfu
  rationale: Katika muktadha wa ibada, kupaka mafuta huku ni tendo la kumweka mtu au kitu wakfu; usemi huu ni wa asili na unaeleweka kwa msomaji wa kawaida.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Katika muktadha wa hema takatifu, neno hili linamaanisha uvumba unaofukizwa, si kitu chochote kinachoteketezwa.
- source_word: הַסַּמִּים
  choice: wenye harufu nzuri
  rationale: Muundo wa Kiebrania unaweza kutafsiriwa kihalisi kama 'uvumba wa manukato'; usemi huu wa Kiswahili unawasilisha sifa ya kunukia kwa lugha ya kawaida.
