lexical_decisions:
- source_word: עֹרֹת
  choice: ngozi
  rationale: Neno hili linamaanisha ngozi za wanyama zinazotumiwa kama nyenzo; “ngozi” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: אֵילִם
  choice: kondoo dume
  rationale: Nomino hii humaanisha kondoo dume; usemi huu ni wazi na wa kawaida kwa wasomaji wa Kiswahili.
- source_word: מְאָדָּמִים
  choice: zilizotiwa rangi nyekundu
  rationale: Umbo hili linaonyesha kuwa ngozi hizo zilifanywa kuwa nyekundu; tafsiri hii inaeleza kwa Kiswahili cha kawaida namna zilivyotayarishwa.
- source_word: עֹרֹת תְּחָשִׁים
  choice: ngozi za tahashi[a]
  rationale: Utambulisho wa תְּחַשׁ haujulikani kwa hakika. Kutumia jina lililotoholewa “tahashi” huepuka kutaja kwa uhakika mnyama asiyejulikana, huku tanbihi ikieleza uwezekano mbalimbali.
- source_word: עֲצֵי שִׂטִּים
  choice: mbao za mshita
  rationale: Kirai hiki kinarejelea mbao za mti wa mshita zilizotolewa kama nyenzo; “mbao za mshita” ni tafsiri ya asili na inayoeleweka katika muktadha wa ujenzi.
