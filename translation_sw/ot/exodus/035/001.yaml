base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/001.yaml
  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
translation:
  language: sw
  text: Kisha Musa akakusanya kusanyiko lote la wana wa Israeli[b], akawaambia, “Haya ndiyo mambo[a] ambayo Yahweh ameamuru yafanywe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maneno” au “masuala.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana wa Israeli,” jina la agano la watu wa Israeli; hapa linarejelea jumuiya nzima, si wanaume peke yao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: akakusanya
  rationale: Hifili ya קהל inaonyesha Musa aliwakutanisha watu wawe kusanyiko moja; ‘akakusanya’ ni Kiswahili cha kawaida na chenye maana hiyo ya kisababishi.
- source_word: כָּל עֲדַת
  choice: kusanyiko lote
  rationale: עֵדָה hapa ni jumuiya ya Israeli iliyokusanyika kama mwili mmoja; ‘kusanyiko lote’ huhifadhi maana ya pamoja na kurudia כָּל kwa uwazi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inafuata umbo la Kiebrania kwa karibu na kuhifadhi jina la agano la watu wa Israeli, huku muktadha ukionyesha kuwa ni jumuiya nzima.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Haya ndiyo mambo
  rationale: דְּבָרִים inaweza kumaanisha maneno, mambo, au maagizo; ‘mambo’ inafaa kwa matendo yaliyoamriwa yanayofuata bila kufuta upana wa neno.
- source_word: צִוָּה יְהוָה
  choice: Yahweh ameamuru
  rationale: Kauli timilifu ya Kiswahili inaonyesha amri iliyotolewa tayari na ambayo bado ina nguvu; jina la Mungu linatolewa kama ‘Yahweh.’
- source_word: לַעֲשֹׂת אֹתָם
  choice: yafanywe
  rationale: Muundo huu wa kutendwa ni wa asili baada ya ‘ameamuru’ na unaonyesha kwamba mambo hayo yanapaswa kutekelezwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה, si cheo tu; ‘Yahweh’ hulihifadhi kama jina binafsi bila kulibadili kuwa cheo.
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל kwa kuzingatia jinsia na maana ya pamoja
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: ‘Wana wa Israeli’ hufuata umbo la kiume la Kiebrania na jina lake la agano, lakini tanbihi inaweka wazi kwamba hapa linarejelea jumuiya nzima, si wanaume peke yao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kusanyiko’ huhifadhi maana ya mwili wa watu waliokutanika; ‘yafanywe’ ni muundo wa asili wa Kiswahili. Alama za tanbihi zimewekwa karibu na vipengele vinavyofafanuliwa.
