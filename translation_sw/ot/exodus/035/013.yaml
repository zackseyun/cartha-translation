  text: the table[a], and its poles, and all its utensils, and the bread of the Presence,
translation:
  language: sw
  text: meza, miti yake ya kuibebea, vyombo vyake vyote, na mikate ya uwepo[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya kimapokeo, “mikate ya wonyesho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: meza
  rationale: Nomino hii hutaja meza ya ibada bila kueleza kazi yake ndani ya neno lenyewe; kirai kinachofuata kuhusu mikate ya uwepo kinaweka muktadha wazi.
- source_word: בַּדָּיו
  choice: miti yake ya kuibebea
  rationale: Katika muktadha wa hema la kukutania, בַּדִּים ni miti iliyotumiwa kubebea samani takatifu. Ufafanuzi huu ni wa kawaida na wazi kwa msomaji wa Kiswahili.
- source_word: כָּל כֵּלָיו
  choice: vyombo vyake vyote
  rationale: כְּלִי ni neno pana linaloweza kumaanisha vyombo au vifaa. Kwa huduma ya mezani, 'vyombo' ni Kiswahili cha kawaida na hakibani maana kupita kiasi.
- source_word: לֶחֶם הַפָּנִים
  choice: mikate ya uwepo
  rationale: Kirai hiki kwa halisi ni 'mkate wa uso/uwepo.' 'Mikate ya uwepo' huhifadhi usemi wa kiibada wa Kiebrania kwa lugha inayoeleweka; wingi unafaa kwa mikate iliyowekwa mezani.
theological_decisions:
- issue: Uwepo unaorejelewa katika לֶחֶם הַפָּנִים
  choice: mikate ya uwepo
  alternative: mikate iliyowekwa mbele za BWANA
  rationale: Matini ya Kiebrania haisemi wazi jina la BWANA katika kirai hiki. Tafsiri iliyochaguliwa huhifadhi ufupi na uwezekano wa maana wa usemi wa asili bila kuingiza ufafanuzi wa kitheolojia ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa orodha umehifadhiwa, huku 'miti yake ya kuibebea' ikitumiwa badala ya neno lisiloeleweka kwa urahisi. Alama [a] imewekwa mara moja katika matini kuu.
