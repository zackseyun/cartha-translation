source:
  edition: WLC
  text: וַ/יָּבֹ֥אוּ הָ/אֲנָשִׁ֖ים עַל הַ/נָּשִׁ֑ים כֹּ֣ל נְדִ֣יב לֵ֗ב הֵ֠בִיאוּ חָ֣ח וָ/נֶ֜זֶם וְ/טַבַּ֤עַת וְ/כוּמָז֙ כָּל כְּלִ֣י זָהָ֔ב וְ/כָל אִ֕ישׁ אֲשֶׁ֥ר הֵנִ֛יף תְּנוּפַ֥ת זָהָ֖ב לַ/יהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/022.yaml
  text: So the men came with the women[a]. Everyone whose heart was willing brought brooches, earrings, rings, and ornaments—all kinds of gold jewelry[b]. And every man who presented a wave offering of gold to Yahweh did so.
translation:
  language: sw
  text: Basi wanaume wakaja pamoja na wanawake[a]. Kila mtu mwenye moyo wa hiari alileta vibano, vipuli, pete, na mapambo—mapambo ya dhahabu ya kila aina[b]. Na kila mwanamume aliyemtolea Yahwe dhahabu kama sadaka ya kutikiswa alifanya hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kifungu cha Kiebrania kinachosema kihalisi “wanaume juu ya/pamoja na wanawake” ni cha kiidioma; huenda kinamaanisha kwamba wanaume walikuja pamoja na wanawake, au kwamba walikuja pia, kwa kuongezea wanawake.
    reason: alternative_reading
  - marker: b
    text: Maana kamili za baadhi ya majina ya mapambo hapa hazijulikani kwa uhakika. “Vibano” vinaweza kuwa vifungo au pete; “vipuli” vinaweza pia kuwa pete za puani; na “mapambo” huenda yakawa aina maalumu ya kishaufu au kikuku cha mkononi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Basi ... wakaja
  rationale: Kiunganishi chenye umbo la mfululizo kinaendeleza simulizi; “Basi” kinaonyesha mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: הָאֲנָשִׁים עַל הַנָּשִׁים
  choice: wanaume wakaja pamoja na wanawake
  rationale: Hapa עַל inaonekana kutumiwa kiidioma kumaanisha kuja pamoja na, au kuongezeka kwa, wanawake; tafsiri hii haisemi kimakosa kwamba wanaume walikuwa juu yao.
- source_word: כֹּל נְדִיב לֵב
  choice: Kila mtu ambaye moyo wake ulikuwa tayari
  rationale: Maneno haya yanaeleza utayari wa ndani na ukarimu wa hiari, huku yakihifadhi taswira ya Kiebrania ya moyo.
- source_word: חָח
  choice: vibano
  rationale: Neno hilo linaweza kutaja pambo la kufungia, kibano, au aina fulani ya pete; “vibano” linafaa katika orodha ya vito bila kudai uhakika usiokuwapo.
- source_word: נֶזֶם
  choice: vipuli
  rationale: Neno hili linaweza kutaja pete ya sikio au ya pua. “Vipuli” ni chaguo la kawaida katika orodha ya mapambo, na uwezekano mwingine umewekwa katika tanbihi.
- source_word: טַבַּעַת
  choice: pete
  rationale: “Pete” ni tafsiri pana na sahihi; haitilii mkazo usiothibitishwa kwamba kila pete ilikuwa pete ya muhuri.
- source_word: כוּמָז
  choice: mapambo
  rationale: Neno hili adimu halijulikani kwa uhakika; neno pana “mapambo” huepuka usahihi wa bandia.
- source_word: כָּל כְּלִי זָהָב
  choice: kila aina ya vito vya dhahabu
  rationale: Katika muktadha wa orodha ya mapambo, kifungu hiki kinarejelea kwa kawaida vitu mbalimbali vya dhahabu vilivyovaliwa kama vito.
- source_word: וְכָל אִישׁ
  choice: Na kila mwanamume
  rationale: אִישׁ ni nomino ya kiume katika umoja; tafsiri inahifadhi upekee huo bila kuufanya usemi kuwa wa kijumla usio na jinsia.
- source_word: הֵנִיף תְּנוּפַת זָהָב
  choice: aliyemtolea ... dhahabu kuwa sadaka ya kutikiswa
  rationale: Kitenzi na nomino yake ni usemi wa kiibada wa kuwasilisha sadaka kwa kuitikisa au kuiinua; “sadaka ya kutikiswa” huhifadhi upekee huo wa ibada.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Lugha yenye jinsia katika וְכָל אִישׁ
  choice: kila mwanamume
  alternative: kila mtu
  rationale: Chanzo kinatumia אִישׁ, “mwanamume,” katika umoja; tafsiri inalinda maana hiyo ya wazi huku ushiriki wa wanawake ukiwa tayari umetajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa msomaji wa leo, lakini taswira ya “moyo,” jina Yahwe, na istilahi ya kiibada “sadaka ya kutikiswa” zimehifadhiwa. Tanbihi zinaonyesha wazi kutokuwa na uhakika kwa kiidioma na kimsamiati.
