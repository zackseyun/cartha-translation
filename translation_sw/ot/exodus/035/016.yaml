  text: the altar of burnt offering[a], and the bronze grating that belongs to it, its poles, and all its utensils[b], the basin and its stand—
translation:
  language: sw
  text: madhabahu ya sadaka ya kuteketezwa, wavu wa shaba unaohusiana nayo, fito zake, na vyombo vyake vyote; beseni na kitako chake—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: madhabahu ya sadaka ya kuteketezwa
  rationale: Muundo huu unaitaja madhabahu inayohusishwa na sadaka inayoteketezwa kabisa; ni lugha ya kawaida na yenye heshima katika Kiswahili cha Biblia.
- source_word: מִכְבַּר הַנְּחֹשֶׁת אֲשֶׁר לוֹ
  choice: wavu wake wa shaba
  rationale: מִכְבָּר ni wavu au kimiani cha metali, na אֲשֶׁר לוֹ huonyesha kuwa ni sehemu inayohusiana na madhabahu. Kiwakilishi 'wake' kinawasilisha uhusiano huo kwa ufupi bila kubainisha mahali ambapo Kiebrania hakubainishi.
- source_word: בַּדָּיו
  choice: fito zake
  rationale: Neno hili linamaanisha fito zilizotumiwa kubebea vifaa vya maskani; 'fito' ni neno la sasa na linaloeleweka.
- source_word: כָּל כֵּלָיו
  choice: vyombo vyake vyote
  rationale: כֵּלִים ni neno pana kwa vifaa au vyombo vinavyohusiana na madhabahu; 'vyombo' ni la kawaida na linafaa katika muktadha huu.
- source_word: הַכִּיֹּר
  choice: beseni
  rationale: Ni chombo cha kuoshea katika ua wa maskani; 'beseni' linaeleweka vizuri kuliko istilahi za kale.
- source_word: כַּנּוֹ
  choice: tako lake
  rationale: כֵּן hapa ni sehemu ya chini inayotegemeza beseni. 'Tako' linadumisha maana ya msingi au tegemeo la chombo bila kuongeza maelezo yasiyokuwamo.
