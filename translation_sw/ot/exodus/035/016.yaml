review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the altar, its associated bronze grating, poles, utensils, and basin. However, “tako lake” does not mean a basin’s base/stand in standard modern Swahili; it normally denotes buttocks. The Hebrew כַּנּוֹ requires “kitako chake” (or “msingi wake”), with “kitako chake” directly expressing the supporting base.
  naturalness: The list structure and continuing dash are natural for this context. “Wavu wake wa shaba” is understandable, but “wavu wa shaba unaohusiana nayo” more clearly preserves the Hebrew association without allowing “wake” to attach ambiguously to the immediately preceding noun or implying an overly specific physical arrangement.
  terminology: “Madhabahu ya sadaka ya kuteketezwa,” “fito,” “vyombo,” and “beseni” are suitable standard East African Swahili terms in a dignified biblical register. “Kitako” is the appropriate term for the basin’s stand/base; the unprefixed “tako” must be corrected.
  issues:
  - severity: high
    issue: “tako lake” is used for כַּנּוֹ.
    rationale: In standard Swahili, “tako” ordinarily means ‘buttocks,’ not the base or stand of a vessel. This is both semantically inaccurate and registers inappropriately. “Kitako chake” denotes the base/footing.
  - severity: low
    issue: The relationship of the bronze grating to the altar could be clearer.
    rationale: The Hebrew says the bronze grating is associated with/belongs to the altar. Recasting this as “wavu wa shaba unaohusiana nayo” retains that relation without over-specifying its placement.
  revised_text: madhabahu ya sadaka ya kuteketezwa, wavu wa shaba unaohusiana nayo, fito zake, na vyombo vyake vyote; beseni na kitako chake—
  revised_footnotes: []
  revision_rationale: The revision corrects the false and inappropriate rendering of the basin’s base while retaining the source sequence, the altar’s association with the bronze grating, and the verse’s unfinished-list punctuation. No footnote is needed because the Swahili wording does not introduce a material lexical ambiguity requiring explanation.
