  text: na mawe ya shohamu[a], na mawe ya kupachikwa, kwa ajili ya efodi na kwa ajili ya kifuko cha kifuani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania שֹׁהַם (shoham) kwa mapokeo hutafsiriwa “onikisi,” lakini utambulisho sahihi wa jiwe hili hauna uhakika; huenda lilikuwa berili, au jiwe la shohamu lisilotambulika kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: mawe ya shohamu
  rationale: Utambulisho kamili wa jiwe hili la thamani hauna uhakika. Kutumia jina lililotoholewa “shohamu” huhifadhi neno la Kiebrania bila kulifungamanisha kwa uhakika na madini fulani; tanbihi inataja tafsiri ya kimapokeo.
- source_word: אַבְנֵי מִלֻּאִים
  choice: mawe ya kutiwa katika mahali pake
  rationale: Neno מִלֻּאִים hapa linahusu mawe yaliyokusudiwa kuwekwa au kupachikwa katika vazi la kikuhani. Usemi huu ni wa kawaida na unaeleza kazi yake bila kuamua mbinu mahsusi ya uyakinishaji.
- source_word: לָאֵפֹד
  choice: kwa ajili ya efodi
  rationale: אֵפֹד ni istilahi mahsusi ya vazi la kikuhani; “efodi” huhifadhi upekee wa neno hilo badala ya kulibadili kuwa maelezo yenye tafsiri pana.
- source_word: וְלַחֹשֶׁן
  choice: na kifuko cha kifuani
  rationale: חֹשֶׁן ni sehemu ya vazi la kuhani mkuu iliyovaliwa kifuani na iliyobeba mawe. “Kifuko cha kifuani” huepuka wazo la silaha linaloweza kuletwa na “bamba la kifuani” na linafaa kwa matumizi yake ya kiibada.
