  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִתְדֹת
  choice: vigingi
  rationale: Neno hili linamaanisha vigingi vya kufungia na kuimarisha Maskani na pazia za ua. “Vigingi” ni neno la kawaida na sahihi katika Kiswahili cha sasa.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: Katika Kutoka, מִשְׁכָּן ni makao matakatifu ya Mungu yaliyobebeka. “Maskani” huhifadhi maana hiyo maalumu na inafaa katika orodha hii ya vifaa.
- source_word: הֶחָצֵר
  choice: ua
  rationale: Katika muktadha wa Maskani, חָצֵר ni eneo la nje lililozungushiwa pazia. “Ua” ni tafsiri fupi na ya kawaida.
- source_word: מֵיתְרֵיהֶם
  choice: kamba zao
  rationale: Neno hili linarejelea kamba zilizotumiwa pamoja na vigingi kuimarisha miundo hiyo. Kiambishi cha wingi katika “zao” kinahifadhi marejeo ya Kiebrania kwa Maskani na ua kwa pamoja.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: vigingi ... vigingi ... na kamba
  rationale: Viashiria vya yambwa havitafsiriwi moja kwa moja katika Kiswahili, lakini muundo wa orodha na urudiaji wa “vigingi” umehifadhiwa.
