translation:
  language: sw
  text: Na kila mwenye ustadi miongoni mwenu aje na kutengeneza yote ambayo Yahwe ameamuru:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi Kiebrania ni “mwenye hekima ya moyo,” nahau inayomaanisha mtu mwenye ustadi au umahiri, hasa katika kazi za mikono.
    reason: lexical_alternative
  - marker: b
    text: Au “wote wenye ustadi miongoni mwenu.” Kiebrania kina umbo la umoja wa kiume kisarufi, lakini linatumika kwa maana ya kugawa kwa kila mmoja.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל
  choice: Na kila
  rationale: וְ inaunganisha mstari huu na maagizo yaliyotangulia, na כָל ikifuatwa na nomino ya umoja ina maana ya kugawa kwa kila mmoja.
- source_word: חֲכַם לֵב
  choice: mwenye ustadi
  rationale: Kirai hiki kwa maana halisi ni ‘mwenye hekima ya moyo,’ lakini katika muktadha wa kutengeneza Maskani kinamaanisha mtu mwenye ujuzi na umahiri wa kazi za mikono.
- source_word: בָּכֶם
  choice: miongoni mwenu
  rationale: Kihusishi ב pamoja na kiambishi cha nafsi ya pili wingi kinaonyesha mtu aliye ndani ya jumuiya hiyo.
- source_word: יָבֹאוּ
  choice: aje
  rationale: Kitenzi cha hali isiyotimilika hapa kina nguvu ya agizo au mwaliko. Kiswahili hutumia umoja kulingana na kiima cha kugawa ‘kila mwenye ustadi.’
- source_word: וְיַעֲשׂוּ
  choice: na kutengeneza
  rationale: Ingawa עָשָׂה inaweza kumaanisha ‘kufanya,’ muktadha wa ujenzi na utengenezaji wa vifaa vya Maskani unapendelea ‘kutengeneza.’ Muundo ‘aje na kutengeneza’ ni wa kawaida na wenye nguvu ya maelekezo katika Kiswahili.
- source_word: אֵת כָּל אֲשֶׁר
  choice: yote ambayo
  rationale: Kirai hiki kinajumuisha kwa ujumla vitu vyote vinavyoorodheshwa baada yake.
- source_word: צִוָּה יְהוָה
  choice: Yahwe ameamuru
  rationale: Kauli timilifu inaonyesha kuwa amri ilitolewa kabla ya kazi hiyo; ‘ameamuru’ hudumisha uhusiano huo wa wakati, na יְהוָה imetafsiriwa kwa jina la agano ‘Yahwe.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Upeo wa kijinsia wa חֲכַם לֵב
  choice: mwenye ustadi
  alternative: mwanamume mwenye ustadi
  rationale: Ingawa umbo la Kiebrania ni umoja wa kiume kisarufi, lina nguvu ya kugawa na linaweza kumrejelea kila aliye na ustadi katika jumuiya. Kiswahili ‘mwenye’ hakiongezi jinsia ambayo muktadha hauisisitizi, huku tanbihi ikihifadhi maelezo ya umbo la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Mwenye ustadi’ ni ya asili kuliko tafsiri sisisi ‘mwenye hekima ya moyo,’ huku tanbihi ikihifadhi taswira ya Kiebrania. Alama ya nukta mbili imehifadhiwa kwa sababu mstari huu unaanzisha orodha inayofuata.
