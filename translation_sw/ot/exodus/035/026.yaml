  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “wenye ustadi” ili kuwasilisha maana ya ufundi ya חָכְמָה kwa namna ya asili bila kuongeza wazo la hekima ya kinadharia.
