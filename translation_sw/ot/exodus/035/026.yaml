translation:
  language: sw
  text: Na wanawake wote ambao mioyo yao iliwachochea walisokota manyoya ya mbuzi kwa ustadi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mbuzi”; katika Kiebrania neno “manyoya” limeachwa lieleweke, likirejelea manyoya ya mbuzi yaliyotumiwa kusokota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנָּשִׁים
  choice: Na wanawake wote
  rationale: כָּל pamoja na nomino ya wingi ina maana ya ujumla; “wanawake wote” ni Kiswahili cha kawaida na sahihi.
- source_word: אֲשֶׁר נָשָׂא לִבָּן אֹתָנָה
  choice: ambao mioyo yao iliwasukuma
  rationale: Nahau ya Kiebrania, kihalisi moyo ‘uliwainua,’ inaonyesha msukumo au utayari wa ndani. “Mioyo yao iliwasukuma” huhifadhi picha ya moyo na kueleza maana yake kwa Kiswahili cha sasa.
- source_word: בְּחָכְמָה
  choice: wenye ustadi
  rationale: Katika muktadha wa kutengeneza vitu, חָכְמָה ni uwezo wa kiufundi zaidi kuliko hekima ya jumla. Mpangilio huu pia huepuka usemi usio wa kawaida kwamba mioyo iliwasukuma ‘kwa ustadi.’
- source_word: טָווּ
  choice: walisokota
  rationale: Kitenzi hiki kinamaanisha kusokota nyuzi kutokana na malighafi ya nguo; “walisokota” ni istilahi ya kawaida ya Kiswahili.
- source_word: אֶת הָעִזִּים
  choice: manyoya ya mbuzi
  rationale: Kihalisi ni “mbuzi,” lakini katika muktadha wa nguo kuna neno lililoachwa likieleweka, yaani manyoya ya mbuzi yaliyosokotwa. Kulieleza wazi huzuia dhana potovu kwamba wanawake waliwasokota wanyama wenyewe.
theological_decisions: []
