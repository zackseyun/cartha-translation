  text: Maskani, hema lake na kifuniko chake; vifungo vyake, mbao zake[a], mataruma yake, nguzo zake na vitako vyake[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fremu zake,” ikiwa neno hilo linaeleweka kuwa linamaanisha muundo wa fremu badala ya mbao imara.
