lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: Katika muktadha wa patakatifu, neno hili linataja makao matakatifu ya YHWH miongoni mwa Israeli. “Maskani” ni istilahi ya kawaida ya kibiblia kwa jengo hilo na pia inadumisha dhana ya kukaa.
- source_word: אָהֳלוֹ
  choice: hema lake
  rationale: Neno אָהֶל humaanisha “hema”; kiambishi kinarejelea Maskani, na “lake” ni upatanisho wa kawaida wa Kiswahili kwa nomino hiyo.
- source_word: מִכְסֵהוּ
  choice: kifuniko chake
  rationale: Tafsiri hii inaonyesha tabaka la kufunika na kulinda bila kubainisha nyenzo ambayo Kiebrania hakuitaji hapa.
- source_word: קְרָסָיו
  choice: vifungo vyake
  rationale: Vipande hivi viliunganisha mapazia au vifuniko. “Vifungo” kinaeleza kazi yake kwa lugha ya kawaida bila kulazimisha umbo mahususi la kisasa.
- source_word: קְרָשָׁיו
  choice: mbao zake
  rationale: קֶרֶשׁ kwa kawaida hutaja mbao au maplanga ya ujenzi wa Maskani; “mbao” ni ya asili na inaeleweka, huku uwezekano wa “fremu” ukihifadhiwa katika tanbihi.
- source_word: בְּרִיחָיו
  choice: mataruma yake
  rationale: Neno hili hutaja vipande virefu vya mlalo vilivyoshikilia mbao pamoja. “Mataruma” linafaa kwa sehemu hizo za kuunganisha katika ujenzi.
- source_word: עַמֻּדָיו
  choice: nguzo zake
  rationale: עַמּוּד ni tegemezo lililosimama; “nguzo” ni neno la kawaida na lenye hadhi katika Kiswahili cha usanifu.
- source_word: אֲדָנָיו
  choice: vikalio vyake
  rationale: Katika ujenzi wa Maskani, hivi ni sehemu za chini ambamo nguzo au mbao zilikalishwa. “Vikalio” kinadumisha kazi hiyo, huku “matako” yakitajwa kama istilahi nyingine ya kiufundi katika tanbihi.
