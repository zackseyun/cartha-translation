lexical_decisions:
- source_word: וְ/לַ/חְשֹׁב מַחַשָׁבֹת
  choice: na kubuni miundo
  rationale: Kitenzi חׁשב na nomino ya mzizi huohuo hapa zinahusu kupanga na kubuni kwa ustadi wa kisanii. “Kubuni miundo” ni Kiswahili cha kawaida kinachowasilisha wazo la ubunifu wa fundi, ingawa hakirudii mzizi mmoja kama Kiebrania.
- source_word: לַ/עֲשֹׂת
  choice: ya kutengeneza
  rationale: Katika muktadha wa ufundi wa metali, עשה humaanisha kutengeneza au kutekeleza kazi. Muundo “miundo ya kutengeneza” unaonyesha uhusiano wa kusudi kati ya kubuni na utekelezaji bila kuufanya kuwa finyu kupita kiasi.
- source_word: בַּ/זָּהָב
  choice: kwa dhahabu
  rationale: Kihusishi ב hapa huonyesha nyenzo inayotumiwa katika kazi ya ufundi; “kwa dhahabu” ni usemi wa asili katika Kiswahili.
- source_word: וּ/בַ/כֶּסֶף
  choice: fedha
  rationale: כֶּסֶף katika orodha hii ya metali ni fedha kama madini, si pesa. Kihusishi “kwa” kilichotangulia kinatawala vipengele vyote vya orodha.
- source_word: וּ/בַ/נְּחֹשֶׁת
  choice: na shaba
  rationale: נְחֹשֶׁת ni metali ambayo inaweza kueleweka kuwa shaba nyekundu au aloi yake, shaba nyeusi. Neno la Kiswahili “shaba” linafaa katika muktadha huu, huku tanbihi ikihifadhi kutokuwa na uhakika kwa aina hususa ya metali.
