  edition: WLC
  text: וּ/לְ/הוֹרֹ֖ת נָתַ֣ן בְּ/לִבּ֑/וֹ ה֕וּא וְ/אָֽהֳלִיאָ֥ב בֶּן אֲחִיסָמָ֖ךְ לְ/מַטֵּה דָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/034.yaml
  text: And he has put in his heart the ability to teach[a], both he and Oholiab son of Ahisamach, of the tribe of Dan.
translation:
  language: sw
  text: Naye amewajalia yeye na Oholiabu mwana wa Ahisamaki, wa kabila la Dani, uwezo wa kufundisha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwezo wa kuelekeza.” Neno la Kiebrania linaweza kumaanisha kufundisha kwa maana pana, kutia ndani kutoa maelekezo kuhusu kazi za ufundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: uwezo wa kufundisha
  rationale: Kitenzi cha Kiebrania katika muundo huu humaanisha “kufundisha” au “kuelekeza.” Kutaja “uwezo” kwa Kiswahili huonyesha kwa kawaida kwamba Mungu aliweka ndani yao kipawa cha kuwafundisha wengine, bila kupunguza maana pana ya kutoa maelekezo katika kazi ya ufundi.
- source_word: נָתַן בְּלִבּוֹ
  choice: amewajalia ... uwezo
  rationale: Nahau ya Kiebrania, kihalisi “ameweka moyoni mwake,” inaonyesha kipawa au msukumo wa ndani. “Amewajalia ... uwezo” ni Kiswahili cha kawaida na chenye heshima kinachowasilisha maana hiyo katika muktadha huu.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi hiki kimetajwa wazi katika Kiebrania na kinahifadhiwa ili kumhusisha kwa msisitizo mhusika wa aya iliyotangulia pamoja na Oholiabu.
- source_word: וְאָהֳלִיאָב
  choice: na Oholiabu
  rationale: Jina limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: בֶּן אֲחִיסָמָךְ
  choice: mwana wa Ahisamaki
  rationale: Huu ni usemi wa moja kwa moja wa uhusiano wa ukoo, kwa mtindo wa kawaida wa Biblia ya Kiswahili.
- source_word: לְמַטֵּה דָן
  choice: wa kabila la Dani
  rationale: Kihusishi hapa kinaonyesha uhusiano wa kikabila; “wa kabila la Dani” ni sahihi na ni Kiswahili cha kawaida.
