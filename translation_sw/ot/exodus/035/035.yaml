base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
translation:
  language: sw
  text: Amewajaza hekima ya moyo[b] ili wafanye kila aina ya kazi ya fundi wa kuchonga[a], mbuni wa michoro, mshonaji wa mapambo kwa nyuzi za buluu, zambarau na nyekundu, na kwa kitani safi, na ya mfumaji—watu wanaofanya kila aina ya kazi na kubuni miundo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa maana pana zaidi, “fundi stadi.” Neno la Kiebrania linaweza kumaanisha fundi wa aina mbalimbali, lakini hapa yaelekea linataja aina fulani ya kazi ya maskani.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hekima ya moyo,” nahau ya Kiebrania inayomaanisha ustadi, utambuzi na uwezo unaotoka ndani ya mtu.
    reason: cultural_note
  - marker: c
    text: Au, “kubuni mipango ya kisanaa.” Kiebrania hapa kinatumia maneno yenye mzizi mmoja ili kusisitiza ubunifu wao.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא אֹתָם
  choice: Amewajaza
  rationale: Kauli ya kutenda katika hali timilifu inaeleza jambo ambalo Mungu amewafanyia watu hao; Kiswahili cha wakati timilifu kinawakilisha vizuri tendo hilo.
- source_word: חָכְמַת לֵב
  choice: hekima ya moyo
  rationale: Tafsiri hii huhifadhi nahau ya Kiebrania inayojumuisha ustadi, utambuzi na uwezo wa ndani, badala ya kuifupisha kuwa “ustadi” pekee.
- source_word: לַעֲשׂוֹת כָּל מְלֶאכֶת
  choice: ili wafanye kila aina ya kazi
  rationale: Neno עשה ni pana, na מלאכה hapa ni kazi au ufundi wenye ustadi; usemi huu ni wa kawaida katika Kiswahili na huhifadhi maana jumuishi ya כל.
- source_word: חָרָשׁ
  choice: fundi wa kuchonga
  rationale: Katika muktadha wa ujenzi wa maskani, neno hili linaelekea kumaanisha fundi anayechonga, ingawa kwa upana linaweza kumaanisha fundi stadi wa aina nyingine.
- source_word: חֹשֵׁב
  choice: mbuni wa michoro
  rationale: Katika muktadha wa ufundi, kitenzi חשב huhusu kubuni au kupanga michoro ya kisanaa.
- source_word: רֹקֵם
  choice: mshonaji wa mapambo
  rationale: Hutaja mtu anayefanya kazi ya urembeshaji wa vitambaa kwa nyuzi; usemi huu unaeleweka kwa wasomaji wengi kuliko istilahi maalumu pekee.
- source_word: תְּכֵלֶת וְאַרְגָּמָן בְּתוֹלַעַת הַשָּׁנִי
  choice: nyuzi za buluu, zambarau na nyekundu
  rationale: Majina hayo yanataja vifaa vilivyotiwa rangi vya thamani. “Nyuzi” huweka wazi muktadha wa kazi ya kitambaa bila kudai kwa uhakika zaidi aina kamili ya kila nyenzo.
- source_word: שֵׁשׁ
  choice: kitani safi
  rationale: Katika vifungu vya maskani, שש hutaja kitani bora au laini; “kitani safi” ni usemi wa kawaida wa kibiblia katika Kiswahili.
- source_word: אֹרֵג
  choice: mfumaji
  rationale: Ni jina la kawaida na la moja kwa moja la mtu anayefuma.
- source_word: עֹשֵׂי כָּל מְלָאכָה וְחֹשְׁבֵי מַחֲשָׁבֹת
  choice: watu wanaofanya kila aina ya kazi na kubuni miundo
  rationale: Huhifadhi muhtasari wa washiriki wawili katika Kiebrania na uhusiano wa kimaana kati ya חשב na מחשבות, huku ikitoa Kiswahili cha asili.
