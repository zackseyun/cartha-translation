  text: And the leaders brought the onyx stones and the stones for setting[b][a], for the ephod and for the breastpiece.
translation:
  language: sw
  text: Nao viongozi wakaleta vito vya shohamu[a] na vito vya kupachika katika vishikio, kwa ajili ya efodi na pambo la kifuani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “vito vya oniksi.” Utambulisho kamili wa jiwe la Kiebrania shohamu hauna uhakika; “oniksi” ndiyo tafsiri ya jadi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kifuko cha kifuani.” Neno la Kiebrania linamaanisha kifaa cha kikuhani kilichovaliwa kifuani, wala si kinga ya kivita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּשִׂאִם
  choice: Nao viongozi
  rationale: נְשִׂיאִם hapa ni viongozi au wakuu wa jumuiya; “viongozi” ni Kiswahili cha sasa kilicho wazi bila kudokeza ufalme.
- source_word: הֵבִיאוּ
  choice: wakaleta
  rationale: Hifili ya בוא ina maana ya kuleta; umbo la simulizi “wakaleta” linaendeleza mtiririko wa taarifa.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: vito vya shohamu
  rationale: Utambulisho kamili wa jiwe שֹׁהַם hauna uhakika. Kutumia “shohamu” kunahifadhi neno la Kiebrania badala ya kudai kwa uhakika kuwa ni shohamu aina ya oniksi; maelezo ya chini yanatoa tafsiri ya jadi.
- source_word: אַבְנֵי הַמִּלֻּאִים
  choice: vito vya kutiwa kwenye vifuko vyake
  rationale: מִלֻּאִים katika muktadha wa vito huelekea kumaanisha kutiwa au kupachikwa katika mahali palipotengezwa; usemi huu unaeleza kazi yake kwa Kiswahili cha kawaida.
- source_word: לָאֵפֹד
  choice: kwa ajili ya efodi
  rationale: Efodi ni vazi maalumu la kikuhani lisilo na kisawe sahihi cha Kiswahili, hivyo jina lililohamishwa linafaa.
- source_word: וְלַחֹשֶׁן
  choice: na kifuko cha kifuani
  rationale: חֹשֶׁן ni pambo au kifuko cha kikuhani kilichovaliwa kifuani, si ngao ya mwili; “kifuko cha kifuani” huepuka maana ya silaha.
