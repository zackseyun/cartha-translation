base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/017.yaml
  text: the hangings of the court[a], its pillars and its bases[c][b], and the screen for the gate of the court—
translation:
  language: sw
  text: mapazia ya ua[a], nguzo zake na vitako vyake[b], na pazia la lango la ua—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vitambaa vya ua.”
    reason: lexical_alternative
  - marker: b
    text: Au “misingi yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: mapazia
  rationale: Neno hili linamaanisha vipande vya kitambaa vilivyozunguka na kutengeneza uzio wa ua wa Maskani. “Mapazia” ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: חָצֵר
  choice: ua
  rationale: Linamaanisha eneo la nje lililozungushiwa uzio wa Maskani. “Ua” ni tafsiri fupi, ya kawaida, na inayofaa katika muktadha huu.
- source_word: עַמֻּדָיו
  choice: nguzo zake
  rationale: Linarejelea mihimili iliyosimama na kushikilia mapazia ya ua. “Nguzo” linafaa kwa lugha ya ujenzi wa mahali patakatifu.
- source_word: אֲדָנֶיהָ
  choice: vitako vyake
  rationale: Linamaanisha sehemu za chini zilizotegemeza nguzo. “Vitako” linaonyesha kwa usahihi vifaa ambamo nguzo zilisimamishwa, huku “misingi” likiwa badala inayowezekana.
- source_word: מָסַךְ
  choice: pazia
  rationale: Katika muktadha wa Maskani, neno hili linamaanisha kitambaa kilichofunika au kuziba sehemu ya kuingilia. “Pazia” ni la asili katika Kiswahili na kazi yake inaelezwa na kirai kinachofuata.
- source_word: שַׁעַר
  choice: lango
  rationale: Linarejelea sehemu ya kuingilia katika uzio wa ua. “Lango” ni tafsiri ya moja kwa moja na ya kawaida.
