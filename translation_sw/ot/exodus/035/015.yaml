  source_fidelity: 'Tafsiri inafuata kwa uaminifu orodha ya nomino katika Kiebrania: madhabahu ya uvumba pamoja na miti yake, mafuta ya kupaka/kuweka wakfu, uvumba wa manukato, na pazia la mlango wa Maskani. Hakuna kipengele cha maana kilichoachwa au kuongezwa.'
