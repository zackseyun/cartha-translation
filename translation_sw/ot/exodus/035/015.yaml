  text: the altar of incense and its poles[a], and the anointing oil, and the fragrant incense, and the screen for the entrance to the tabernacle[c][b];
translation:
  language: sw
  text: madhabahu ya uvumba na miti yake ya kubebea, mafuta ya kutia wakfu, uvumba wenye harufu nzuri, na pazia la mlango wa Maskani;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: madhabahu ya uvumba
  rationale: Muundo wa nomino mbili unaonyesha madhabahu inayohusishwa na uvumba; tafsiri hii ni ya asili na inaweka wazi matumizi yake ya ibada.
- source_word: בַּדָּיו
  choice: miti yake ya kubebea
  rationale: Katika muktadha wa Maskani, neno hili humaanisha miti iliyotumiwa kubebea vyombo vitakatifu. Kutaja kusudi lake huondoa utata kwa msomaji wa kawaida.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: mafuta ya kutia wakfu
  rationale: Katika muktadha huu kupaka mafuta ni tendo la ibada la kuweka mtu au kitu wakfu; usemi huu wa Kiswahili unaeleza maana hiyo kwa kawaida.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: uvumba wenye harufu nzuri
  rationale: הַסַּמִּים hurejelea viungo au vitu vya kunukia vilivyotumiwa kutengeneza uvumba; tafsiri hii huwasilisha sifa yake bila kuongeza maelezo yasiyo katika mstari.
- source_word: מָסַךְ הַפֶּתַח
  choice: pazia la mlango
  rationale: מָסָךְ ni kitambaa kilichoning'inizwa kufunika sehemu ya kuingilia. 'Pazia' ni neno la sasa na la kawaida la Kiswahili katika muktadha huu.
- source_word: לְפֶתַח הַמִּשְׁכָּן
  choice: la mlango wa Maskani
  rationale: לְ hapa huonyesha uhusiano na matumizi ya pazia kwa sehemu ya kuingilia Maskani; muundo huu ni wa asili katika Kiswahili.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: Neno hili linahifadhi dhana ya mahali pa Mungu kukaa na ni istilahi fupi, yenye heshima, inayofaa kwa jengo hili maalumu katika Kutoka.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mstari huu ni sehemu ya orodha, kwa hiyo umehifadhiwa kama kishazi na kuhitimishwa kwa nuktamkato. Viunganishi vimerahisishwa ili orodha isikike kwa kawaida bila kupoteza vipengele vya Kiebrania.
