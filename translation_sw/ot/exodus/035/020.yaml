  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “likaondoka” unafuata ngeli ya nomino ya pamoja “kusanyiko,” ingawa kitenzi cha Kiebrania ni cha wingi kwa kuwarejelea watu wa kusanyiko hilo.
