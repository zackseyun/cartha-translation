  text: Then all the congregation of the sons of Israel went out from before Moses[a][b].
translation:
  language: sw
  text: Kisha kusanyiko lote la wana wa Israeli[a][b] likaondoka kutoka mbele ya Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkutano” badala ya “kusanyiko.”
    reason: lexical_alternative
  - marker: b
    text: Au “Waisraeli.” Kiebrania kinasema kihalisi “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Kisha ... likaondoka
  rationale: Kitenzi cha wayyiqtol kinaendeleza simulizi. “Kisha” kinaonyesha mfuatano wa matukio, na “likaondoka” linatoa maana ya kutoka mahali alipokuwa Musa kwa Kiswahili cha kawaida.
- source_word: כָּל
  choice: lote
  rationale: Neno hili linasisitiza kwamba kusanyiko zima lilihusika; upatanisho wa ngeli unahitaji “lote” pamoja na “kusanyiko.”
- source_word: עֲדַת
  choice: kusanyiko
  rationale: עֵדָה humaanisha jumuiya ya Israeli iliyokusanyika. “Kusanyiko” linahifadhi maana hiyo ya pamoja kwa lugha ya sasa na yenye hadhi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili linafuata kwa karibu muundo wa Kiebrania, unaosema kihalisi “wana wa Israeli,” huku katika muktadha likiwa jina la watu waliotokana na Israeli.
- source_word: מִלִּפְנֵי
  choice: mbele ya
  rationale: Nahau ya Kiebrania ina maana ya kuondoka kutoka mbele au uweponi mwa mtu. Pamoja na “likaondoka,” “mbele ya Musa” ni fupi na inaeleweka bila kuongeza maelezo yasiyokuwamo katika matini.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina מֹשֶׁה katika Kiswahili.
