base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/023.yaml
  text: And every man with whom blue yarn[a], purple yarn, scarlet yarn, fine linen, goats’ hair, ram skins dyed red, and tahash skins were found brought them.
translation:
  language: sw
  text: Na kila mtu aliyekuwa na uzi wa rangi ya buluu, uzi wa zambarau, uzi mwekundu, kitani bora, manyoya ya mbuzi, ngozi za kondoo dume zilizotiwa rangi nyekundu, na ngozi za tahashi[a], alileta vitu hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maana ya neno la Kiebrania tahashi haijulikani kwa hakika. Tafsiri zilizopendekezwa ni pamoja na “ngozi bora,” “ngozi za pomboo,” au “ngozi za nguva.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אִישׁ
  choice: Na kila mtu
  rationale: Ingawa אִישׁ ni nomino ya kiume katika umoja, hapa imetumiwa kwa maana ya kugawa mmoja mmoja. “Kila mtu” ni Kiswahili cha kawaida na cha heshima kinachowasilisha maana hiyo bila kulazimisha neno lisilo la asili katika muktadha huu.
- source_word: אֲשֶׁר נִמְצָא אִתּוֹ
  choice: aliyekuwa na
  rationale: Kiebrania kinasema kwa karibu zaidi kwamba vitu hivyo ‘vilipatikana pamoja naye.’ Kiswahili “aliyekuwa na” kinawasilisha umiliki kwa kawaida bila kubadili maana.
- source_word: תְּכֵלֶת
  choice: uzi wa rangi ya buluu
  rationale: Katika muktadha wa maskani neno hili linaashiria malighafi ya nguo iliyotiwa rangi ya buluu. “Uzi” huweka wazi matumizi yake ya ufumaji.
- source_word: אַרְגָּמָן
  choice: uzi wa zambarau
  rationale: Neno linaashiria malighafi ya nguo yenye rangi ya zambarau; uchaguzi huu unaendana na vitu vingine vya ufumaji katika orodha.
- source_word: תוֹלַעַת שָׁנִי
  choice: uzi mwekundu
  rationale: Kirai hiki kinaashiria nyuzi au malighafi iliyotiwa rangi nyekundu angavu. “Uzi mwekundu” ni wazi na wa kawaida bila kudai kivuli maalumu cha rangi kuliko ushahidi unavyoruhusu.
- source_word: שֵׁשׁ
  choice: kitani bora
  rationale: Katika maandiko ya kikuhani neno hili humaanisha kitani cha hali ya juu. “Bora” huwasilisha ubora wake na kuepuka uwezekano wa kuelewa “safi” kama kisicho na uchafu tu.
- source_word: עִזִּים
  choice: manyoya ya mbuzi
  rationale: Maana ya neno lenyewe ni ‘mbuzi,’ lakini katika orodha hii linarejelea manyoya yao yaliyotumiwa kutengeneza vifuniko, si wanyama walio hai.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: ngozi za kondoo dume zilizotiwa rangi nyekundu
  rationale: Tafsiri hii huonyesha wazi kwamba ngozi ndizo zilizotibiwa au kutiwa rangi nyekundu na huhifadhi maana ya kivumishi cha Kiebrania.
- source_word: עֹרֹת תְּחָשִׁים
  choice: ngozi za tahashi
  rationale: Utambulisho wa תְּחָשׁ hauna uhakika. Kutumia “tahashi” kwa unukuzi huepuka kuchagua mnyama au aina ya ngozi kwa kubahatisha; tanbihi inaeleza hali hiyo.
- source_word: הֵבִיאוּ
  choice: alileta vitu hivyo
  rationale: Kitenzi cha Kiebrania ni cha wingi kwa sababu kinawajumlisha watu waliotajwa mmoja mmoja. Kiswahili hutumia umoja kwa kawaida baada ya “kila mtu”; “vitu hivyo” huweka wazi yambwa iliyodokezwa.
