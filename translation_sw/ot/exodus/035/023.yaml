translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa orodha umerahisishwa kwa kiasi ili usomeke kwa kawaida, huku aina zote za malighafi zikihifadhiwa. Alama ya tanbihi imewekwa baada ya “tahashi,” neno ambalo tanbihi inalifafanua.
