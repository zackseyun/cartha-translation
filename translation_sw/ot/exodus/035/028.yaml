  text: na manukato, na mafuta ya kuwashia taa, na kwa ajili ya mafuta ya upako, na kwa ajili ya uvumba wa manukato.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֹּשֶׂם
  choice: manukato
  rationale: Neno hili humaanisha vitu vyenye harufu nzuri, viungo vya kunukia, au zeri. Katika orodha hii ya vifaa vya Maskani, “manukato” ni neno la kawaida na pana linalofaa bila kulifanya kuwa aina maalumu ya zeri.
- source_word: הַשָּׁמֶן
  choice: mafuta
  rationale: Kiebrania kinataja mafuta bila kubainisha kwamba ni mafuta ya zeituni; kwa hiyo tafsiri haiongezi aina ambayo haikutajwa.
- source_word: לְמָאוֹר
  choice: ya kuwashia taa
  rationale: Kirai kinaonyesha matumizi ya mafuta kwa kutoa mwanga. Kiswahili cha “kuwashia taa” ni cha asili katika muktadha wa Maskani, ingawa nomino ya Kiebrania yenyewe inaweza kumaanisha mwanga au kitu kinachotoa mwanga.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: mafuta ya upako
  rationale: Hili ndilo kirai cha kawaida na kinachoeleweka kwa mafuta matakatifu yaliyotumiwa kupaka.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: uvumba wa manukato
  rationale: 'Tafsiri hii inaweka wazi nomino zote mbili: uvumba na vitu vya kunukia vilivyoutengeneza.'
- source_word: לְ ... וְלִ
  choice: na ya kutengeneza ... na
  rationale: Vihusishi hivi vinaonyesha makusudi au matumizi ya vitu vilivyoletwa. “Ya kutengeneza” huleta uhusiano huo kwa Kiswahili cha asili bila kudai kwamba mafuta yale yale yalitumiwa moja kwa moja kwa kila kusudi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Mstari unaendelea kisarufi kutoka aya iliyotangulia, kwa hiyo unaanza kwa “na.” Muundo wa orodha na viunganishi vinavyorudiwa umehifadhiwa kwa kadiri inavyosikika kwa kawaida.
