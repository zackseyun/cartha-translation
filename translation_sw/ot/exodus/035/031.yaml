  text: and he filled him with the Spirit of God[a], with wisdom, with understanding, and with knowledge[b], and with every kind of craftsmanship.
translation:
  language: sw
  text: akamjaza Roho wa Mungu[a], kwa hekima, ufahamu, maarifa, na katika kila aina ya ufundi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho wa Mungu,” au “roho ya kimungu.” Kirai cha Kiebrania kinaweza kueleweka kwa maana ya jumla zaidi, lakini hapa huenda kinamaanisha Roho wa Mungu mwenyewe anayemwezesha.
    reason: alternative_reading
  - marker: b
    text: Au, “katika kazi yote,” au “katika kila ufundi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֹתוֹ
  choice: akamjaza
  rationale: Kitenzi cha usimulizi cha Kiebrania pamoja na kiwakilishi cha mtendewa kimetafsiriwa kwa muundo wa kawaida wa Kiswahili. Mtendaji, Mungu, anaeleweka kutokana na mstari uliotangulia, na anayejazwa ni Bezaleli.
- source_word: רוּחַ אֱלֹהִים
  choice: Roho wa Mungu
  rationale: Katika muktadha huu wa kuwezeshwa na Mungu kwa ajili ya kazi ya maskani, kirai hiki kinaelekea kumaanisha Roho wa Mungu mwenyewe. Herufi kubwa inaonyesha usomaji huo, huku tanbihi ikihifadhi uwezekano mpana wa kirai cha Kiebrania.
- source_word: בְּחָכְמָה
  choice: hekima
  rationale: חָכְמָה ni hekima, hapa ikiwa uwezo wa kufanya kazi kwa ustadi uliopewa na Mungu.
- source_word: בִּתְבוּנָה
  choice: ufahamu
  rationale: תְבוּנָה humaanisha ufahamu au utambuzi. 'Ufahamu' ni neno la kawaida na huhifadhi utofauti wake na hekima na maarifa.
- source_word: וּבְדַעַת
  choice: maarifa
  rationale: דַּעַת kimsingi ni maarifa. Tafsiri hii haipunguzi maana yake kuwa ustadi wa kiufundi tu.
- source_word: וּבְכָל מְלָאכָה
  choice: ustadi wa kila aina
  rationale: Katika muktadha wa kutengeneza maskani, מְלָאכָה inahusu kazi au ufundi. 'Ustadi wa kila aina' ni Kiswahili cha asili kinachoonyesha uwezo katika kila aina ya kazi ya ufundi; tanbihi huhifadhi mbadala zilizo karibu zaidi na umbo la Kiebrania.
theological_decisions:
- issue: Iwapo רוּחַ אֱלֹהִים itafsiriwe kibinafsi kama Roho wa Mungu au kwa maana ya jumla kama roho ya Mungu/roho ya kimungu
  choice: Roho wa Mungu
  alternative: roho ya Mungu; roho ya kimungu
  rationale: Muktadha wa karibu unaeleza Mungu akimwezesha Bezaleli kwa huduma takatifu, hivyo 'Roho wa Mungu' ndiyo maana inayowezekana zaidi. Hata hivyo, kirai cha Kiebrania hakina kibainishi na kinaweza kueleweka kwa upana zaidi, kwa hiyo uwezekano huo umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'akamjaza ... akampa ...' unaepuka orodha nzito ya 'kwa' na kueleza kwa kawaida kwamba hekima, ufahamu, maarifa na ustadi ndiyo vipawa vilivyotokana na kujazwa Roho. Alama zote za tanbihi zimewekwa katika matini kuu.
