  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/004.yaml
  text: Then Moses said to all the congregation of the sons of Israel[a], “This is the thing that Yahweh has commanded[c][b], saying,”
translation:
  language: sw
  text: 'Kisha Musa akaliambia kusanyiko lote la wana wa Israeli[a], “Hili ndilo neno ambalo Yahweh ameamuru, akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jumuiya yote ya wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha Musa akaliambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” linaonyesha mfuatano kwa Kiswahili cha kawaida, na kiambishi -li- kinarejelea kusanyiko.
- source_word: עֲדַת
  choice: kusanyiko
  rationale: Neno hili humaanisha jumuiya iliyokusanyika ya Israeli; “kusanyiko” linahifadhi maana ya kundi lililokusanywa bila kulifanya kuwa taasisi ya kidini ya kisasa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania wa wingi wa kiume na utambulisho wao wa ukoo, huku likiwa neno la asili katika Kiswahili.
- source_word: זֶה הַדָּבָר
  choice: Hili ndilo neno
  rationale: דָּבָר linaweza kumaanisha neno, jambo, au kitu. Katika fomula hii ya kutangaza amri ya Mungu, “neno” linahifadhi nguvu ya usemi wa chanzo; uwezekano wa “jambo” umeonyeshwa katika tanbihi.
- source_word: צִוָּה
  choice: ameamuru
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika ambalo amri yake bado ina umuhimu katika muktadha huu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika maandishi limeandikwa kwa namna ya kutamkwa badala ya kubadilishwa na cheo.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Linadumisha fomula ya Kiebrania inayotambulisha yaliyomo katika amri, ambayo yanafuata katika mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; “Yahweh” linahifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Usemi wa kijinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: “Wana wa Israeli” huhifadhi umbo la wingi wa kiume la chanzo na pia ni usemi unaoeleweka kwa wasomaji wa Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kutangaza amri umehifadhiwa kwa kuwa mstari unaishia kabla ya maudhui ya amri katika mstari unaofuata. Alama ya nukta mbili baada ya “akisema” inaonyesha mwendelezo huo.
