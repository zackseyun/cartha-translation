  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבֹ֕אוּ כָּל אִ֖ישׁ אֲשֶׁר נְשָׂא֣/וֹ לִבּ֑/וֹ וְ/כֹ֡ל אֲשֶׁר֩ נָדְבָ֨ה רוּח֜/וֹ אֹת֗/וֹ הֵ֠בִיאוּ אֶת תְּרוּמַ֨ת יְהוָ֜ה לִ/מְלֶ֨אכֶת אֹ֤הֶל מוֹעֵד֙ וּ/לְ/כָל עֲבֹ֣דָת֔/וֹ וּ/לְ/בִגְדֵ֖י הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/021.yaml
  text: And everyone came whose heart stirred him[a], and everyone whose spirit moved him willingly brought Yahweh’s contribution for the work of the tent of meeting, for all its service[b], and for the holy garments.
translation:
  language: sw
  text: Wakaja wote ambao moyo wao uliwachochea[a], na wote ambao roho yao iliwafanya wawe tayari; wakaleta mchango kwa Yahweh[b] kwa kazi ya hema la kukutania, kwa huduma yake yote, na kwa mavazi matakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya neno kwa neno, “ambao moyo wake ulimwinua.” Kiebrania kinatumia nahau ya msukumo wa ndani.
    reason: lexical_alternative
  - marker: b
    text: Au, “mchango wa Yahweh” au “sadaka kwa Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kisha wakaja
  rationale: בוא ni ‘kuja’; ‘wakaja’ inadumisha simulizi bila kuongeza wazo la kujitokeza ambalo halijaelezwa wazi.
- source_word: כָּל אִישׁ
  choice: wote
  rationale: Ingawa kifungu ni ‘kila mtu/mwanamume,’ hapa kina maana ya kila mmoja miongoni mwa watoaji; ‘wote’ ni ya kawaida na jumuishi katika Kiswahili.
- source_word: אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: ambao mioyo yao iliwasukuma
  rationale: Nahau ya Kiebrania ni kwa uhalisia ‘moyo wake ulimwinua.’ ‘Mioyo yao iliwasukuma’ inawasilisha msukumo wa ndani kwa Kiswahili cha asili huku tanbihi ikihifadhi taswira halisi.
- source_word: וְכֹל אֲשֶׁר נָדְבָה רוּחוֹ אֹתוֹ
  choice: na wote ambao roho zao ziliwahimiza kwa hiari
  rationale: נדב katika muundo huu huonyesha utayari wa hiari au moyo wa ukarimu; tafsiri hii inahifadhi msukumo wa ndani pamoja na kutolazimishwa.
- source_word: הֵבִיאוּ
  choice: wakaleta
  rationale: ‘Kuleta’ ni maana ya moja kwa moja na inafaa tendo halisi la kuwasilisha vitu vilivyotolewa.
- source_word: תְּרוּמַת יְהוָה
  choice: mchango kwa ajili ya Yahweh
  rationale: תְּרוּמָה ni mchango au sadaka iliyotengwa. Muundo wa Kiebrania unaweza kueleweka kuwa mchango wa Yahweh au uliotolewa kwa ajili yake; Kiswahili hiki kinaweka wazi mwelekeo wa utoaji bila kudai umiliki kutoka kwake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa konsonanti YHWH linawakilishwa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa na cheo.
- source_word: לִמְלֶאכֶת אֹהֶל מוֹעֵד
  choice: kwa kazi ya hema la kukutania
  rationale: מְלָאכָה ni kazi au shughuli, na אֹהֶל מוֹעֵד ni jina la hema ambako mkutano uliowekwa hufanyika.
- source_word: וּלְכָל עֲבֹדָתוֹ
  choice: kwa huduma yake yote
  rationale: עֲבֹדָה linaweza kuwa kazi au huduma; katika muktadha wa hema, ‘huduma’ hujumuisha kazi na shughuli zake za ibada.
- source_word: וּלְבִגְדֵי הַקֹּדֶשׁ
  choice: na kwa mavazi matakatifu
  rationale: Haya ni mavazi yaliyotengwa kwa matumizi matakatifu, hasa mavazi ya kikuhani; ‘mavazi matakatifu’ ni wazi na yenye heshima.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, YHWH. ‘Yahweh’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa kisarufi katika תְּרוּמַת יְהוָה
  choice: mchango kwa ajili ya Yahweh
  alternative: mchango wa Yahweh
  rationale: Muundo unaweza kuonyesha kitu kilichowekwa kwa Yahweh au kinachomhusu. Katika muktadha wa watu kuleta mali, ‘kwa ajili ya Yahweh’ huepuka maana isiyokusudiwa kwamba mchango unatoka kwake; tanbihi inahifadhi mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Wingi umetumiwa kwa ulinganifu wa kawaida wa Kiswahili. ‘Hema la kukutania’ ni istilahi inayoeleweka, na sentensi imedumisha utofauti kati ya msukumo wa moyo na utayari wa roho.
