  text: and the lampstand for the light[a], and its utensils, and its lamps, and the oil for the light,
translation:
  language: sw
  text: na kinara cha taa kwa ajili ya nuru[a], na vyombo vyake, na taa zake, na mafuta kwa ajili ya nuru,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “kinara cha taa cha nuru” na “mafuta ya nuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת הַמָּאוֹר
  choice: kinara cha taa kwa ajili ya nuru
  rationale: מְנוֹרָה ni kinara chenye taa za maskani, na הַמָּאוֹר humaanisha nuru au kutoa nuru. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha uhusiano wa maneno ya Kiebrania bila kukifanya kinara chenyewe kiwe nuru.
- source_word: כֵּלֶיהָ
  choice: vyombo vyake
  rationale: כְּלִי ni neno pana linaloweza kumaanisha vyombo, vifaa, au zana. Katika orodha ya vifaa vya maskani, “vyombo vyake” ni ya asili na haibainishi matumizi yasiyotajwa.
- source_word: נֵרֹתֶיהָ
  choice: taa zake
  rationale: נֵרֹתֶיהָ hurejelea taa moja moja zilizokuwa kwenye kinara; “taa zake” ni wazi na sahihi katika muktadha huu.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: mafuta kwa ajili ya nuru
  rationale: Kirai hiki kihalisi kina uhusiano wa “mafuta ya nuru/utoaji nuru.” “Kwa ajili ya nuru” kinaeleza kusudi kwa Kiswahili cha kawaida na kudumisha kurudiwa kwa מָאוֹר.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֵת
  choice: na ... na ... na ... na
  rationale: Kurudia “na” kunahifadhi muundo na mdundo wa orodha ya Kiebrania.
