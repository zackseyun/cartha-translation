  text: Msiwashe moto katika makao yenu yote siku ya Sabato.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְבַעֲרוּ
  choice: msiwashe
  rationale: Kitenzi בער katika kauli ya Piel hapa humaanisha kuwasha au kukoleza moto. “Msiwashe” ni usemi wa kawaida na sahihi wa Kiswahili kwa tendo la kuanzisha moto.
- source_word: אֵשׁ
  choice: moto
  rationale: Nomino hii inamaanisha moto; Kiswahili hakihitaji kibainishi kisicho dhahiri kama ilivyo katika Kiingereza.
- source_word: בְּכֹל
  choice: katika ... yoyote
  rationale: 'Muundo huu unaonyesha maana ya mgawanyo: katazo linahusu kila mojawapo ya makao yao. “Yoyote” huwasilisha maana hiyo kwa Kiswahili cha kawaida.'
- source_word: מֹשְׁבֹתֵיכֶם
  choice: makao yenu
  rationale: מוֹשָׁב inaweza kumaanisha mahali pa kukaa au makazi. “Makao yenu” huhifadhi upana wa neno hilo kuliko “nyumbani kwenu” na haisukumii maana kuelekea vijiji au miji pekee.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: siku ya Sabato
  rationale: Tafsiri hii huhifadhi kutajwa wazi kwa “siku” na hutumia jina la kawaida la Kiswahili “Sabato.”
theological_decisions:
- issue: Upeo wa katazo la Sabato kuhusu moto
  choice: Kutoa amri ya moja kwa moja ya kutowasha moto bila kuipanua zaidi ya maneno ya aya.
  alternative: Kutafsiri kwa upana kuwa ni marufuku kutumia au kudumisha moto wa aina yoyote, au kuhusisha kila kazi inayotumia joto.
  rationale: Kiebrania kinakataza hasa kuwasha moto katika makao yao siku ya Sabato. Tafsiri haipaswi kuingiza maelezo ya baadaye kuhusu matumizi mengine ya moto ambayo hayajasemwa wazi katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa katazo “Msiwashe” unaeleweka kwa wasomaji wa kawaida; “makao” hudumisha uzito na upana wa מֹשְׁבֹת bila kuwa wa kizamani kupita kiasi.
