  text: and blue[a], and purple, and scarlet yarn, and fine linen, and goats’ hair,
translation:
  language: sw
  text: na nyuzi za rangi ya buluu, na za rangi ya zambarau, na za rangi nyekundu, na kitani laini, na manyoya ya mbuzi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְכֵלֶת
  choice: nyuzi za rangi ya buluu
  rationale: Neno hili linamaanisha kitambaa au nyuzi zilizotiwa rangi ya buluu au buluu-zambarau. Katika orodha hii ya vifaa vya hema takatifu, “nyuzi za rangi ya buluu” huonyesha wazi rangi na aina ya kitu kilichotolewa.
- source_word: אַרְגָּמָן
  choice: za rangi ya zambarau
  rationale: Neno hili linarejelea kitu cha kusokotwa au kitambaa kilichotiwa rangi ya zambarau. “Za” inaendeleza nomino “nyuzi” kutoka kipashio kilichotangulia na hivyo kudumisha orodha kwa Kiswahili cha kawaida.
- source_word: תוֹלַעַת שָׁנִי
  choice: za rangi nyekundu
  rationale: Kirai hiki kinarejelea nyenzo iliyotiwa rangi nyekundu iliyotokana na mdudu. Katika muktadha huu, “nyuzi za rangi nyekundu” ni tafsiri ya asili na inayoeleweka; nomino “nyuzi” imeachwa kudokezwa baada ya kutajwa mwanzoni.
- source_word: שֵׁשׁ
  choice: kitani safi
  rationale: Katika miktadha ya hema takatifu, neno hili humaanisha kitani bora au laini. “Kitani safi” ni usemi wa Kiswahili unaotambulika kwa kitani cha ubora wa juu.
- source_word: עִזִּים
  choice: singa za mbuzi
  rationale: Kiebrania kinasema kihalisi “mbuzi,” lakini katika orodha ya vifaa kinamaanisha singa za mbuzi zilizotumiwa kutengeneza vifuniko. Kutaja singa huzuia dhana potovu kwamba mbuzi walio hai walikusudiwa.
- source_word: וְ
  choice: na
  rationale: Kiunganishi kimerudiwa kwa kila kipashio katika Kiebrania. Kurudia “na” kunahifadhi mtindo huo wa orodha na kunasikika kwa kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inadumisha muundo wa orodha wenye viunganishi vinavyorudiwa. “Nyuzi” imewekwa wazi mwanzoni na kudokezwa katika rangi mbili zinazofuata ili kuepuka urudiaji mzito bila kupoteza maana.
