  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kifuniko cha upatanisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֹן
  choice: sanduku
  rationale: Katika muktadha wa hema takatifu, neno hili linataja sanduku takatifu la agano; “sanduku” ni la kawaida na linaeleweka katika Kiswahili.
- source_word: בַּדָּיו
  choice: miti yake ya kulibebea
  rationale: Hizi ni fito au miti iliyotumiwa kubeba sanduku; kirai hiki kinaeleza kazi yake kwa Kiswahili cha kawaida bila kutumia neno la kizamani.
- source_word: הַכַּפֹּרֶת
  choice: kiti cha rehema
  rationale: Hili ni jina la kitamaduni la kifuniko cha dhahabu cha sanduku katika muktadha wa ibada. Kwa kuwa neno la Kiebrania pia linaweza kueleweka kama kifuniko chenye uhusiano na upatanisho, maana hiyo imehifadhiwa katika tanbihi.
- source_word: פָּרֹכֶת
  choice: pazia
  rationale: Neno hili linataja pazia la ndani lililotenganisha sehemu za hema; “pazia” ni neno la asili na linaloeleweka katika Kiswahili cha sasa.
- source_word: הַמָּסָךְ
  choice: kizuizi
  rationale: Neno hili lina maana ya kitu cha kuning’inizwa kinachofunika au kuzuia. “Pazia la kizuizi” linahifadhi nomino zote mbili katika muundo wa Kiebrania bila kuongeza kusudi lisilotajwa wazi.
- source_word: אֶת / וְאֶת
  choice: '[viashiria vya yambwa tendwa havikutafsiriwa moja kwa moja]'
  rationale: Viashiria hivi vya Kiebrania havina neno sawia katika Kiswahili; uratibu wake umeonyeshwa kwa koma na kiunganishi “na”.
theological_decisions:
- issue: Tafsiri ya הַכַּפֹּרֶת katika muktadha wa ibada ya hema takatifu
  choice: kiti cha rehema
  alternative: kifuniko cha upatanisho
  rationale: “Kiti cha rehema” huhifadhi istilahi ya ibada inayotambulika, ilhali “kifuniko cha upatanisho” huonyesha kwa uwazi zaidi kwamba kitu hiki ni kifuniko na kwamba kinahusiana na upatanisho. Tanbihi inahifadhi uwezekano huo bila kuamua kimya-kimya mjadala wa kileksika na kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha na koma ya mwisho umehifadhiwa kwa sababu mstari huu ni sehemu ya sentensi inayoendelea. Alama ya tanbihi imewekwa baada ya “kiti cha rehema,” ambako mbadala wake unahusika.
