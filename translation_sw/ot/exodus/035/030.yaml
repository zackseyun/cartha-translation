  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל רְא֛וּ קָרָ֥א יְהוָ֖ה בְּ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/030.yaml
  text: Then Moses said to the sons of Israel[a], “See, Yahweh has called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.”
translation:
  language: sw
  text: Kisha Musa akawaambia wana wa Israeli[a], “Tazameni, Yahweh amemwita kwa jina Besaleli mwana wa Uri, mwana wa Huri, wa kabila la Yuda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֶל
  choice: Kisha Musa akawaambia
  rationale: Muundo huu wa kawaida wa Kiswahili unaendeleza simulizi kwa maana ya waw-consecutive na kuonyesha wazi kwamba Musa alisema maneno hayo kwao.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Unahifadhi taswira ya ukoo iliyo katika Kiebrania huku ukiendelea kueleweka katika Kiswahili sanifu; maelezo ya chini yanataja tafsiri ya kawaida zaidi ya kikabila.
- source_word: רְאוּ
  choice: Tazameni
  rationale: Ni amri ya wingi inayovuta usikivu wa wasikilizaji kwa jambo linalofuata, bila kutumia lugha ya kizamani.
- source_word: קָרָא ... בְּשֵׁם
  choice: amemwita kwa jina
  rationale: Inahifadhi nahau ya Kiebrania inayosisitiza uteuzi binafsi na mahususi wa Besaleli.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania linatolewa kama jina binafsi, wala halibadilishwi kuwa cheo.
- source_word: בְּצַלְאֵל
  choice: Besaleli
  rationale: Hili ni umbo la jina linaloeleweka na kutamkika kwa kawaida katika Kiswahili.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: mwana wa Uri, mwana wa Huri
  rationale: Kurudiwa kwa “mwana wa” kunahifadhi kwa uwazi mfuatano wa nasaba wa Kiebrania.
- source_word: לְמַטֵּה יְהוּדָה
  choice: wa kabila la Yuda
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha kwamba Besaleli alikuwa wa kabila la Yuda.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja; “Yahweh” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Usemi wa kijinsia na kiukoo בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli au watoto wa Israeli
  rationale: Kiebrania kina usemi wa kiume wa wingi wenye maana ya jumuiya ya kikabila. Tafsiri kuu inahifadhi usemi wa kiukoo, huku tanbihi ikibainisha tafsiri mbadala za kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Tazameni” hudumisha amri ya wingi; majina yametolewa kwa maumbo yanayofaa matamshi ya Kiswahili.
