  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo na maana ya Kiebrania: Musa anasema kwa wana wa Israeli; amri ya wingi רְאוּ imetolewa kwa “Tazameni”; na nahau קָרָא ... בְּשֵׁם imehifadhiwa kwa “amemwita kwa jina.” Nasaba na utambulisho wa kikabila wa Besaleli vimetolewa kikamilifu.'
