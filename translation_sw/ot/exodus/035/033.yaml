  text: katika kukata mawe kwa ajili ya kuyatia katika vishikio, na katika kuchonga mbao, ili kufanya kila aina ya kazi ya ustadi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila aina ya kazi iliyobuniwa” au “kila aina ya kazi ya kisanaa.” Neno la Kiebrania lina wazo la kazi inayofanywa kwa mpango, ubunifu, au ustadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: katika kuchonga
  rationale: Nomino hii huonyesha ufundi wa kuvifanyia kazi vitu. “Kuchonga” ni ya asili kwa mawe na mbao na pia huhifadhi urudiaji wa neno lilelile la Kiebrania.
- source_word: אֶבֶן
  choice: mawe
  rationale: Ingawa Kiebrania kina umoja, hapa neno linataja mawe kama nyenzo kwa maana ya jumla; wingi ni wa kawaida katika Kiswahili.
- source_word: לְמַלֹּאת
  choice: ya kuwekwa kwenye vipambo
  rationale: Katika muktadha wa mafundi wa Maskani, kitenzi kinahusu kuyaweka mawe ndani ya sehemu zilizotengenezwa kuyapokea. Kauli hii inaeleza kusudi bila kutumia maana pana ya “kujaza.”
- source_word: עֵץ
  choice: mbao
  rationale: Hapa עֵץ ni nyenzo ya kazi, si mti ulio hai. “Mbao” ni usemi wa kawaida wa Kiswahili katika muktadha wa useremala na uchongaji.
- source_word: לַעֲשׂוֹת
  choice: ili kufanya
  rationale: Kitenzi עשה ni kipana; “kufanya” kinaendana kwa asili na kirai kinachofuata kuhusu kazi.
- source_word: בְּכָל מְלֶאכֶת
  choice: kila aina ya kazi
  rationale: Kirai hiki kinaonyesha wigo mzima wa kazi za ufundi; tafsiri hii ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: מַחֲשָׁבֶת
  choice: ya ustadi
  rationale: Neno linaweza kueleza kazi iliyopangwa, iliyobuniwa, au ya kisanaa. “Ya ustadi” hutoa maana kuu kwa lugha ya kawaida, huku tanbihi ikihifadhi uwezekano mwingine.
