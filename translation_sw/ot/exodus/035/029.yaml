base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/029.yaml
  text: Every man and woman whose heart moved them to bring something for all the work that Yahweh had commanded to be done through Moses—the children of Israel brought a freewill offering to Yahweh[a][b][c].
translation:
  language: sw
  text: Kila mwanamume na mwanamke ambaye moyo wake ulimsukuma kuleta kitu kwa ajili ya kazi yote ambayo Yahweh alikuwa ameamuru ifanywe kupitia Musa, Waisraeli hao walileta sadaka ya hiari kwa Yahweh[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye moyo wake ulimchochea” au “ambaye moyo wake ulimfanya awe tayari.” Nahau ya Kiebrania huonyesha utayari au msukumo wa ndani.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa mkono wa Musa,” nahau yenye maana ya “kupitia Musa” au Musa akiwa mpatanishi.
    reason: lexical_alternative
  - marker: c
    text: Au, “wana wa Israeli.” Usemi huo wa Kiebrania humaanisha Waisraeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: Kila mwanamume na mwanamke
  rationale: Hutaja wazi washiriki wa kiume na wa kike na kuhifadhi maana ya ugawaji ya כָּל kwa Kiswahili cha kawaida.
- source_word: נָדַב לִבָּם אֹתָם
  choice: ambaye moyo wake ulimchochea
  rationale: Nahau hii huonyesha utayari au msukumo wa ndani; ‘moyo wake ulimchochea’ ni ya asili na haiashirii kulazimishwa.
- source_word: לְהָבִיא
  choice: kuleta kitu
  rationale: Kitenzi chenyewe ni ‘kuleta’; ‘kitu’ kinaweka wazi yambwa linaloeleweka kutokana na muktadha wa michango bila kuongeza wazo jipya.
- source_word: לְכָל הַמְּלָאכָה
  choice: kwa ajili ya kazi yote
  rationale: מְלָאכָה hapa ni kazi yote ya kutengeneza maskani na vyombo vyake; ‘kazi’ ndilo neno pana na la kawaida.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשׂוֹת בְּיַד מֹשֶׁה
  choice: ambayo Yahweh alikuwa ameamuru ifanywe kupitia Musa
  rationale: ‘Kupitia Musa’ huwasilisha nahau בְּיַד, yaani Musa akiwa wakala au mpatanishi wa agizo, huku ‘ifanywe’ ikihifadhi muundo usiotaja mtendaji moja kwa moja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu linalowakilishwa na Tetragramatoni badala ya kulibadilisha kuwa cheo.
- source_word: הֵבִיאוּ בְנֵי יִשְׂרָאֵל
  choice: Waisraeli walimletea
  rationale: בְנֵי יִשְׂרָאֵל ni jina la kawaida la taifa; ‘Waisraeli’ ni Kiswahili cha sasa na cha wazi. Kiambishi ‘-m-’ kinaonyesha kwamba sadaka ililetwa kwa Yahweh.
- source_word: נְדָבָה
  choice: sadaka ya hiari
  rationale: Huonyesha sadaka iliyotolewa kwa utashi, si kwa kulazimishwa, kwa lugha inayotambulika katika muktadha wa ibada.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja Tetragramatoni; ‘Yahweh’ huhifadhi jina la agano badala ya kuweka cheo mahali pake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inahifadhi urudiaji wa Yahweh na mvutano mdogo wa kisarufi wa sentensi ya Kiebrania, huku kistari kirefu kikionyesha kurejea kwa kiima cha jumla ‘Waisraeli’. Viashiria vyote vya tanbihi vimewekwa katika matini.
