base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/002.yaml
  text: Work may be done for six days[a], but on the seventh day there shall be for you a holy Sabbath, a complete rest to Yahweh[b]. Whoever does work on it shall surely be put to death.
translation:
  language: sw
  text: Kwa siku sita kazi ifanywe, lakini siku ya saba itakuwa takatifu kwenu—Sabato ya pumziko kamili[a] kwa Yahwe.[b] Yeyote atakayefanya kazi siku hiyo atauawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sabato ya pumziko kuu.” Kauli ya Kiebrania “Sabato, pumziko la Sabato” inasisitiza kuacha kazi kabisa.
    reason: lexical_alternative
  - marker: b
    text: Kauli “kwa Yahwe” inaweza pia kueleweka “ya Yahwe,” “kwa ajili ya Yahwe,” au “iliyowekwa wakfu kwa Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה
  choice: inaweza kufanywa
  rationale: Nifali ya עשה ina umbo la kutendwa na hapa inatoa agizo la kisheria bila kumtaja mtendaji. “Inaweza kufanywa” ni Kiswahili cha kawaida kinachohifadhi maana ya kuruhusiwa bila kuigeuza kuwa amri ya kufanya kazi.
- source_word: מְלָאכָה
  choice: kazi
  rationale: Katika sheria za Sabato, neno hili humaanisha kazi au shughuli ya kawaida ya kufanya; “kazi” ni wazi na ya kawaida katika Kiswahili.
- source_word: קֹדֶשׁ
  choice: siku takatifu
  rationale: Nomino hii inaonyesha kwamba siku hiyo imetengwa kuwa takatifu. Kuongeza “siku” kunafanya sentensi iwe ya kawaida katika Kiswahili, huku rejeo lake likiwa wazi kutokana na “siku ya saba.”
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: Sabato ya pumziko kamili
  rationale: Urudiaji wa maneno yanayohusiana na Sabato unasisitiza kuacha kazi kabisa. “Pumziko kamili” huwasilisha mkazo huo kwa Kiswahili cha sasa.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi ל kinaweza kuonyesha kuelekezwa, kuwekwa wakfu, au kuwa kwa ajili ya Yahwe. “Kwa Yahwe” ni kifupi na hakifungi maana katika uwezekano mmoja tu.
- source_word: כָּל הָעֹשֶׂה
  choice: Yeyote atakayefanya
  rationale: Muundo huu unaweka kesi ya jumla ya kisheria inayomhusu kila mtu anayefanya tendo hilo.
- source_word: בּוֹ
  choice: siku hiyo
  rationale: Kiwakilishi kinarejelea siku ya Sabato. “Siku hiyo” ni wazi na ya kawaida zaidi kuliko tafsiri ya neno kwa neno “ndani yake.”
- source_word: יוּמָת
  choice: atauawa
  rationale: Hofali ya מות ni kauli tendwa yenye maana ya kuua kama adhabu. “Atauawa” huhifadhi kauli tendwa na uthabiti wa hukumu bila kuongeza neno la kusisitiza ambalo halipo katika mstari huu.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi na ni umbo linalosomeka kwa kawaida katika Kiswahili.
- issue: Uhusiano wa Sabato na Yahwe katika לַיהוָה
  choice: kwa Yahwe
  alternative: ya Yahwe; iliyowekwa wakfu kwa Yahwe
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha kuwa Sabato imeelekezwa kwa Yahwe, ni kwa ajili yake, au ni yake. Tafsiri kuu imeacha upana huo badala ya kuchagua ufafanuzi mmoja wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa sheria ya kidini lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imehifadhi utofauti kati ya siku sita za kazi na utakatifu wa siku ya saba; adhabu imeelezwa kwa kauli tendwa kama ilivyo katika Kiebrania.
