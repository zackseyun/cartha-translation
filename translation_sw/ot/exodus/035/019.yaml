  text: the finely woven garments for ministering in the sanctuary[a], the holy garments for Aaron the priest[b], and the garments of his sons for serving as priests.
translation:
  language: sw
  text: mavazi yaliyofumwa kwa ustadi[a] kwa ajili ya kuhudumu mahali patakatifu, mavazi matakatifu kwa ajili ya Haruni, kuhani, na mavazi ya wanawe ili watumikie kama makuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mavazi ya huduma”; maana kamili ya neno la Kiebrania si hakika, na huenda likamaanisha mavazi maalumu yaliyofumwa kwa ajili ya huduma.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  choice: mavazi
  rationale: Neno hili kwa msingi humaanisha nguo au mavazi; “mavazi” ni la kawaida, lenye heshima, na linafaa kwa mavazi ya kikuhani.
- source_word: הַשְּׂרָד
  choice: yaliyofumwa kwa ustadi
  rationale: Katika muktadha wa hema la kukutania, neno hili linaelekea kueleza kazi maalumu ya ufumaji, ingawa maana yake kamili si hakika; uwezekano wa “mavazi ya huduma” umehifadhiwa katika tanbihi.
- source_word: לְשָׁרֵת
  choice: kwa ajili ya kuhudumu
  rationale: Kitenzi hiki humaanisha kutoa huduma, hasa huduma takatifu katika muktadha huu.
- source_word: בַּקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Hapa קֹדֶשׁ inaelekea kumaanisha eneo takatifu la hema, si hali ya utakatifu kwa dhana tu.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: mavazi matakatifu
  rationale: Hili linawakilisha moja kwa moja muundo wenye maana ya mavazi yaliyotengwa kwa matumizi matakatifu.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: ya Haruni kuhani
  rationale: Muundo huu unamtambulisha Haruni kwa cheo chake; Kiswahili hiki ni cha asili na hakiongezi istilahi za baadaye za kidini.
- source_word: בִּגְדֵי בָנָיו
  choice: mavazi ya wanawe
  rationale: Tafsiri hii inafuata kwa uwazi uhusiano wa umilikaji katika Kiebrania.
- source_word: לְכַהֵן
  choice: ili wafanye kazi ya ukuhani
  rationale: Kitenzi hiki humaanisha kutenda kazi kama kuhani; usemi huu unahifadhi maana yake ya kitendo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uhusiano kati ya בִּגְדֵי הַשְּׂרָד na בִּגְדֵי הַקֹּדֶשׁ
  choice: 'Vifungu hivyo vimetafsiriwa kama vipengele viwili tofauti katika orodha: mavazi yaliyofumwa kwa ustadi kwa huduma mahali patakatifu, kisha mavazi matakatifu ya Haruni na ya wanawe.'
  alternative: Kukichukulia kifungu cha kwanza kuwa maelezo mengine ya mavazi yale yale ya kikuhani.
  rationale: Kurudiwa kwa kiashiria cha yambwa אֶת kunaunga mkono usomaji wa vipengele tofauti, ingawa matumizi yake matakatifu yanaweza kuingiliana. Tafsiri haivifanyi kuwa kitu kimoja bila ulazima wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa msomaji wa kawaida. “Mahali patakatifu” na “kazi ya ukuhani” huepuka lugha nzito isiyo ya lazima huku zikihifadhi mazingira ya ibada.
