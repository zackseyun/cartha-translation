  variant: Standard East African Swahili
source:
  edition: WLC
  text: כָּל מֵרִ֗ים תְּר֤וּמַת כֶּ֨סֶף֙ וּ/נְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה וְ/כֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜/וֹ עֲצֵ֥י שִׁטִּ֛ים לְ/כָל מְלֶ֥אכֶת הָ/עֲבֹדָ֖ה הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/024.yaml
  text: Everyone who offered a contribution of silver or bronze brought Yahweh’s contribution[b][a], and everyone with whom acacia wood was found for any work of the service brought it.
translation:
  language: sw
  text: Kila mtu aliyetoa mchango wa fedha au shaba[a] alileta mchango wa Yahwe, na kila mtu aliyekuwa na mbao za mshita[b] kwa ajili ya kazi yoyote ya huduma alizileta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mchango wa fedha na shaba.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa “na,” lakini maana katika muktadha ni kwamba kila mtu alileta mchango wa metali aliyokuwa nayo.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kihalisi: “kila mtu ambaye mbao za mshita zilipatikana pamoja naye,” yaani, kila mtu aliyekuwa nazo tayari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מֵרִים
  choice: Kila mtu aliyetoa
  rationale: Kitenzi רוּם pamoja na תְּרוּמָה ni nahau ya kutoa au kuwasilisha mchango; Kiswahili hiki ni cha kawaida na huhifadhi maana ya tendo hilo.
- source_word: תְּרוּמַת כֶּסֶף וּנְחֹשֶׁת
  choice: mchango wa fedha au shaba
  rationale: תְּרוּמָה ni mchango uliotengwa kwa matumizi matakatifu. נְחֹשֶׁת inaweza kumaanisha shaba au bronzi; 'shaba' ni neno la Kiswahili linaloeleweka zaidi katika muktadha huu. 'Au' huonyesha kwamba kila mtu alileta metali aliyokuwa nayo, huku tanbihi ikihifadhi uwezekano wa kutafsiri kiunganishi kuwa 'na'.
- source_word: הֵבִיאוּ אֵת תְּרוּמַת יְהוָה
  choice: alileta mchango wa Yahwe
  rationale: Muundo wa umilikaji תְּרוּמַת יְהוָה unaeleweka kwa kawaida kuwa mchango wa Yahwe, yaani uliotengwa kwa ajili yake; umoja wa Kiswahili unapatana na 'kila mtu'.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetafsiriwa moja kwa moja kwa umbo la Kiswahili 'Yahwe', badala ya kulibadilisha kuwa cheo.
- source_word: וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  choice: na kila mtu aliyekuwa na
  rationale: Kiebrania halisi ni 'ambaye kilipatikana pamoja naye'; hii ni nahau ya kuwa na kitu au kukipata tayari. Kiswahili cha kawaida huwasilisha maana hiyo kwa 'aliyekuwa na', huku tanbihi ikitaja muundo halisi.
- source_word: עֲצֵי שִׁטִּים
  choice: mbao za mshita
  rationale: Hili ni jina la kawaida na linaloeleweka la mbao za acacia katika Kiswahili cha Afrika Mashariki.
- source_word: לְכָל מְלֶאכֶת הָעֲבֹדָה
  choice: kwa ajili ya kazi yoyote ya huduma
  rationale: '''Kazi'' huhifadhi מְלָאכָה na ''huduma'' huhifadhi עֲבֹדָה bila kuongeza wazi ''Maskani'', ambalo linadokezwa tu na muktadha. ''Yoyote'' huwasilisha matumizi ya distributive ya כָּל.'
- source_word: הֵבִיאוּ
  choice: alizileta
  rationale: Kiambishi cha ngeli 'zi' kinarejelea 'mbao', na umoja 'ali-' unafuata kirai 'kila mtu' kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Aya inatumia Tetragramatoni moja kwa moja. 'Yahwe' huhifadhi jina la agano badala ya kulibadilisha kuwa cheo, na ni tahajia ya kawaida ya Kiswahili.
- issue: Uhusiano katika תְּרוּמַת יְהוָה
  choice: mchango wa Yahwe
  alternative: mchango kwa Yahwe
  rationale: Muundo wa Kiebrania ni wa umilikaji na unaweza kuonyesha mchango unaomhusu, uliotengwa kwa ajili yake, au unaomilikiwa naye. 'Wa Yahwe' huhifadhi upana huo kuliko kuufanya kwa lazima kuwa mwelekeo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi hudumisha urudiaji wa 'kila mtu ... alileta' wa Kiebrania, huku nahau ya umilikaji ikitolewa kwa Kiswahili cha kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
