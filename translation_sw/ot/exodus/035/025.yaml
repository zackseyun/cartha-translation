base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/025.yaml
  text: 'And every woman wise of heart spun with her hands[a], and they brought what they had spun: the blue, the purple, the scarlet yarn[b], and the fine linen.'
translation:
  language: sw
  text: 'Kila mwanamke mwenye hekima moyoni[a] alisokota kwa mikono yake, nao wakaleta walichokuwa wamesokota: nyuzi za buluu, za zambarau, na za rangi nyekundu[b], pamoja na kitani safi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mwenye hekima wa moyo”; ni nahau inayomaanisha ustadi wa vitendo unaotokana na hekima ya ndani.
    reason: lexical_alternative
  - marker: b
    text: Au, “buluu, zambarau, nyekundu, na kitani safi”; Kiebrania kinaorodhesha vifaa hivyo baada ya kusema “walichokuwa wamesokota.”
    reason: alternative_reading
lexical_decisions:
- source_word: חַכְמַת לֵב
  choice: mwenye moyo wa hekima
  rationale: Huhifadhi sitiari ya Kiebrania inayounganisha hekima ya ndani na ustadi wa vitendo, huku ikibaki wazi kwa msomaji wa Kiswahili.
- source_word: בְּיָדֶיהָ
  choice: kwa mikono yake
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba kazi ya kusokota ilifanywa kwa mikono yake mwenyewe.
- source_word: טָווּ
  choice: alisokota
  rationale: Kitenzi hiki kwa usahihi hueleza tendo la kusokota nyuzi, na umoja unalingana na kirai cha kwanza ‘kila mwanamke.’
- source_word: וַיָּבִיאוּ
  choice: nao wakaleta
  rationale: Huhifadhi badiliko la Kiebrania kutoka umoja wa kugawa ‘kila mwanamke’ kwenda wingi unaowarejelea wanawake kwa pamoja.
- source_word: מַטְוֶה
  choice: walichokuwa wamesokota
  rationale: Hutoa maana ya kitu au nyuzi zilizokuwa zimesokotwa na kuandaa orodha inayofuata kwa Kiswahili cha asili.
- source_word: תְּכֵלֶת
  choice: nyuzi za buluu
  rationale: Katika muktadha wa Hema la Kukutania neno hili hurejelea malighafi ya nguo iliyotiwa rangi ya buluu; ‘nyuzi’ huweka wazi muktadha wa kusokota.
- source_word: אַרְגָּמָן
  choice: nyuzi za zambarau
  rationale: ‘Zambarau’ ni neno la kawaida la Kiswahili kwa rangi hii ya thamani katika vitambaa vya Hema la Kukutania.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: nyuzi za rangi nyekundu
  rationale: Huwasilisha kwa uwazi nyenzo iliyotiwa rangi nyekundu bila kuingiza katika matini kuu maelezo ya kihistoria kuhusu chanzo cha rangi hiyo.
- source_word: שֵׁשׁ
  choice: kitani safi
  rationale: Huhifadhi maana ya kitani bora au laini kinachotumiwa katika maandalizi ya Hema la Kukutania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. ‘Moyo wa hekima’ umehifadhiwa ili kuonyesha taswira ya Kiebrania; tanbihi inafafanua maana yake ya ustadi. Orodha imetolewa kwa namna ya asili katika Kiswahili bila kufuta muundo wa nyenzo mbalimbali.
