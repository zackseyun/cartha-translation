  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הַשְׁכֵּ֤ם בַּ/בֹּ֨קֶר֙ וְ/הִתְיַצֵּב֙ לִ/פְנֵ֣י פַרְעֹ֔ה הִנֵּ֖ה יוֹצֵ֣א הַ/מָּ֑יְמָ/ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/016.yaml
  text: 'Then the LORD said to Moses, “Rise early in the morning and station yourself before Pharaoh. Look, he is going out to the water, and you shall say to him, ‘Thus says the LORD: Let my people go, so that they may serve me.’”'
translation:
  language: sw
  text: 'Kisha BWANA akamwambia Mose, “Amka asubuhi na mapema, ukasimame mbele ya Farao. Tazama, anaenda majini. Umwambie, ‘BWANA asema hivi: Waache watu wangu waende, ili wanitumikie.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: Amka asubuhi na mapema
  rationale: Huonyesha agizo la kuamka mapema bila kufanya Kiswahili kiwe kigumu.
- source_word: וְהִתְיַצֵּב לִפְנֵי פַרְעֹה
  choice: ukasimame mbele ya Farao
  rationale: Huhifadhi maana ya kujipanga au kuchukua nafasi mbele yake kwa lugha ya kawaida.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huhifadhi kishazi cha kuvuta fikira kilicho katika Kiebrania.
- source_word: יוֹצֵא הַמָּיְמָה
  choice: anaenda majini
  rationale: Huwakilisha mwelekeo wa kwenda kwenye maji; Kiebrania hakitaji kusudi lake.
- source_word: וְיַעַבְדֻנִי
  choice: ili wanitumikie
  rationale: Kitenzi עבד hapa kinaweza kumaanisha kumtumikia au kumwabudu Mungu; ‘wanitumikie’ huhifadhi upana huo katika muktadha wa Kutoka.
theological_decisions:
- issue: Jina la agano יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni namna iliyozoeleka na yenye hadhi katika Biblia za Kiswahili, huku herufi kubwa zikionyesha kwamba chanzo kina jina la Mungu יהוה.
- issue: Maana ya עבד katika dai la kuwaachilia watu
  choice: wanitumikie
  alternative: waniabudu
  rationale: ‘Wanitumikie’ haifungi maana kwenye tendo la ibada pekee na hudumisha mvutano wa kimakusudi kati ya utumwa kwa Farao na utumishi kwa BWANA.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa msomaji wa kawaida, huku mpangilio wa amri, kishazi cha kuvuta fikira, na usemi wa wajumbe vikihifadhiwa.
