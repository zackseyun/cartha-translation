  text: וַ/יַּעֲשׂוּ כֵ֨ן הַ/חַרְטֻמִּ֧ים בְּ/לָטֵי/הֶ֛ם לְ/הוֹצִ֥יא אֶת הַ/כִּנִּ֖ים וְ/לֹ֣א יָכֹ֑לוּ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/014.yaml
  text: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
translation:
  language: sw
  text: Nao wachawi wakafanya vivyo hivyo kwa ufundi wao wa siri ili kutokeza chawa wadogo[a], lakini hawakuweza. Chawa hao wadogo walikuwa juu ya watu na wanyama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbu wadogo.” Aina hasa ya mdudu anayerejelewa na neno la Kiebrania haina uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: wachawi
  rationale: Neno hili linawarejelea wataalamu wa ibada na uchawi katika ikulu ya Farao. “Wachawi” ni neno la kawaida na linaloeleweka bila kubainisha kupita kiasi mbinu zao.
- source_word: בְּלָטֵיהֶם
  choice: kwa ufundi wao wa siri
  rationale: Kirai hiki kinaonyesha mbinu za siri au za kichawi; tafsiri hii inahifadhi wazo la mbinu zilizofichika kwa Kiswahili cha kawaida.
- source_word: לְהוֹצִיא
  choice: ili kutokeza
  rationale: Katika muktadha huu kitenzi kinamaanisha kujaribu kuzalisha au kutokeza wadudu hao, si kuwatoa kutoka mahali fulani tu.
- source_word: הַכִּנִּים / הַכִּנָּם
  choice: chawa wadogo
  rationale: Utambulisho kamili wa mdudu huyu wa Kiebrania hauna uhakika. “Chawa wadogo” ni tafsiri inayoeleweka, huku “mbu wadogo” ikihifadhiwa katika tanbihi kama uwezekano mwingine.
- source_word: וְלֹא יָכֹלוּ
  choice: lakini hawakuweza
  rationale: Hii inaeleza moja kwa moja kutoweza kwao na ni ya asili katika Kiswahili.
- source_word: בָּאָדָם
  choice: juu ya watu
  rationale: Ingawa Kiebrania kina nomino ya umoja yenye maana ya kijumla, “watu” huwasilisha kwa kawaida kwamba wanadamu kwa ujumla walipatwa na wadudu hao.
- source_word: וּבַבְּהֵמָה
  choice: na wanyama
  rationale: Nomino ya Kiebrania ni ya kijumla. “Wanyama” ni ya asili katika Kiswahili na haifungi maana kwa mifugo pekee.
theological_decisions:
- issue: Tafsiri ya אָדָם ikiwa na maana ya kijumla
  choice: watu
  alternative: mwanadamu
  rationale: Hapa אָדָם humaanisha wanadamu kwa ujumla, si mwanamume mmoja. “Watu” ni Kiswahili cha kawaida na hudumisha utofautishaji kati ya wanadamu na wanyama bila kuingiza jinsia isiyokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Sentensi mbili zimetumiwa kwa mtiririko wa kawaida, bila kuondoa uhusiano wa matukio katika Kiebrania.
