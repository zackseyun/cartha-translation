base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/011.yaml
  text: But when Pharaoh saw that there was relief[a], he hardened his heart and did not listen to them, just as Yahweh had said.
translation:
  language: sw
  text: Lakini Farao alipoona kwamba kulikuwa na nafuu[a], akaufanya moyo wake mgumu, na hakuwasikiliza, kama Yahwe alivyosema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulikuwa na muda wa kupumua.” Neno la Kiebrania linaweza kumaanisha nafuu, kupungua kwa shinikizo, au nafasi ya kupumua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipoona
  rationale: Hudumisha maana ya msingi ya kuona huku katika muktadha ikidokeza kutambua kwamba hali ilikuwa imebadilika.
- source_word: כִּי הָיְתָה הָרְוָחָה
  choice: kwamba kumekuwa na nafuu
  rationale: Neno הָרְוָחָה linaonyesha kupungua kwa shinikizo, afueni, au muda wa kupumua; ‘nafuu’ ni ya kawaida na inafaa muktadha wa pigo.
- source_word: וְהַכְבֵּד אֶת לִבּוֹ
  choice: aliufanya moyo wake kuwa mgumu
  rationale: Kauli ya Kiebrania ni ya kisababishi na Farao ndiye mhusika; tafsiri hii huhifadhi uwakala wake na sitiari ya moyo bila kuifanya kuwa hali ya kutendwa.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: wala hakuwasikiliza
  rationale: שׁמע pamoja na אֶל hapa ni kusikiliza au kutii kwa kuzingatia; ‘hakuwasikiliza’ ni ya moja kwa moja bila kuongeza maana mahususi ya kutii.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: kama vile Yahwe alivyokuwa amesema
  rationale: Kifungu kinaonyesha kutimia kwa neno la Mungu lililotangulia; ‘alivyokuwa amesema’ huonyesha utangulizi huo katika simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu linatolewa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwakala katika kuufanya moyo wa Farao kuwa mgumu
  choice: Farao mwenyewe ndiye anayeufanya moyo wake kuwa mgumu katika mstari huu.
  alternative: Moyo wake ukawa mgumu, au Mungu akaufanya kuwa mgumu kwa kudokezwa.
  rationale: Kiebrania kinatumia umbo tendeshi la kisababishi likiwa na Farao kama mhusika. Hii huhifadhi mvutano wa simulizi pana la Kutoka, ambalo katika sehemu nyingine pia humtaja Mungu akiufanya moyo wa Farao kuwa mgumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Aliufanya moyo wake kuwa mgumu’ limetumiwa badala ya ‘aliufanya moyo wake kuwa mzito’ ili maana ya ukaidi ieleweke, huku muundo tendeshi na uwakala wa Farao vikihifadhiwa.
