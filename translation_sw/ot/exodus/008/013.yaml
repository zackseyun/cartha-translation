  source_fidelity: 'Tafsiri inafuata kwa uaminifu mlolongo wa simulizi la Kiebrania: utekelezaji wa agizo, Haruni kunyosha mkono wake akiwa pamoja na fimbo, kupiga mavumbi, chawa kuwajaa wanadamu na wanyama, na mavumbi yote kuwa chawa katika Misri yote. “Wakawajaa” ni ufafanuzi wa asili wa Kiswahili wa wadudu kuwepo juu ya/katika watu na wanyama, bila kuongeza athari mahususi.'
