id: EXO.8.13
reference: Exodus 8:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵ֗ן וַ/יֵּט֩ אַהֲרֹ֨ן אֶת יָד֤/וֹ בְ/מַטֵּ֨/הוּ֙ וַ/יַּךְ֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה כָּל עֲפַ֥ר הָ/אָ֛רֶץ הָיָ֥ה כִנִּ֖ים בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/013.yaml
  text: And they did so[a]. Aaron stretched out his hand with his staff and struck the dust of the earth, and the gnats came upon man and beast[b]. All the dust of the earth became gnats throughout all the land of Egypt.
translation:
  language: sw
  text: Nao wakafanya hivyo. Haruni akaunyosha mkono wake pamoja na fimbo yake, akayapiga mavumbi ya ardhi, nao chawa[a] wakawajaa wanadamu[b] na wanyama. Mavumbi yote ya ardhi yakawa chawa katika nchi yote ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wadudu wadogo wanaoruka.” Utambulisho kamili wa neno la Kiebrania כִּנִּים hauna uhakika.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania hapa linamaanisha wanadamu kwa ujumla.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Nao wakafanya hivyo
  rationale: Ni kauli ya kawaida ya simulizi inayoonyesha kwamba walitekeleza agizo lililotangulia; Kiswahili hiki ni cha asili na kinabaki karibu na Kiebrania.
- source_word: וַיֵּט אַהֲרֹן אֶת יָדוֹ בְמַטֵּהוּ
  choice: Haruni akaunyosha mkono wake pamoja na fimbo yake
  rationale: Kitenzi נטה pamoja na 'mkono' kina maana ya kuunyosha. 'Pamoja na fimbo yake' kinahifadhi uhusiano wa Kiebrania bila kuamua kupita kiasi kama fimbo ilikuwa tu chombo au kitu kilichoandamana na mkono.
- source_word: וַיַּךְ אֶת עֲפַר הָאָרֶץ
  choice: akayapiga mavumbi ya ardhi
  rationale: נכה hapa ni 'kupiga,' na עֲפַר ni mavumbi au udongo laini. 'Mavumbi ya ardhi' yanahifadhi taswira na urudiaji wa kifungu hicho.
- source_word: הַכִּנָּם / כִנִּים
  choice: chawa
  rationale: Utambulisho kamili wa mdudu anayetajwa na neno hili la Kiebrania hauna uhakika. 'Chawa' ni tafsiri ya kimapokeo na ya kawaida katika Kiswahili; uwezekano wa wadudu wadogo wanaoruka umewekwa katika tanbihi.
- source_word: וַתְּהִי הַכִּנָּם בָּאָדָם וּבַבְּהֵמָה
  choice: nao chawa wakawajaa wanadamu na wanyama
  rationale: Kiebrania kinasema kwa hali ya moja kwa moja kwamba hao wadudu walikuwapo juu au ndani ya wanadamu na wanyama. 'Wakawajaa' ni Kiswahili cha asili kinachoeleza uvamizi huo bila kuongeza namna mahususi ya madhara.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: wanadamu na wanyama
  rationale: אָדָם limetumiwa kwa maana ya kijumla ya binadamu, si mwanamume mmoja. בְּהֵמָה linarejelea wanyama, hasa wanyama wa kufugwa, lakini neno la jumla linafaa katika muktadha huu.
- source_word: כָּל עֲפַר הָאָרֶץ הָיָה כִנִּים
  choice: Mavumbi yote ya ardhi yakawa chawa
  rationale: Tafsiri hii inadumisha nguvu ya כָּל ('yote'), urudiaji wa 'mavumbi ya ardhi,' na maana ya matokeo ya הָיָה ('yakawa').
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: katika nchi yote ya Misri
  rationale: Hii inaonyesha wazi kwamba tukio hilo lilienea katika eneo lote la Misri na ni mtindo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Maana ya kijumla ya אָדָם
  choice: wanadamu
  alternative: mtu
  rationale: Katika mlinganisho na wanyama, אָדָם linawakilisha jamii yote ya binadamu. 'Wanadamu' linaonyesha maana hiyo ya kijumla kwa usahihi bila kulifanya neno lihusu wanaume pekee.
- issue: Hali ya badiliko katika הָיָה כִנִּים
  choice: yakawa chawa
  alternative: yalizaa chawa
  rationale: Kiebrania kinasema kwamba mavumbi 'yakawa' chawa, bila kueleza utaratibu wa tukio. Tafsiri haiongezi wazo la kuzalisha ambalo halijasemwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vitenzi vya mfululizo umehifadhi mwendo wa simulizi, huku sintaksia isiyo ya asili ya Kiebrania ikitolewa kwa Kiswahili fasaha.
