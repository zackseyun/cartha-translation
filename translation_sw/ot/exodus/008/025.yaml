  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤א מֵֽ/עִמָּ/ךְ֙ וְ/הַעְתַּרְתִּ֣י אֶל יְהוָ֔ה וְ/סָ֣ר הֶ/עָרֹ֗ב מִ/פַּרְעֹ֛ה מֵ/עֲבָדָ֥י/ו וּ/מֵ/עַמּ֖/וֹ מָחָ֑ר רַ֗ק אַל יֹסֵ֤ף פַּרְעֹה֙ הָתֵ֔ל לְ/בִלְתִּי֙ שַׁלַּ֣ח אֶת הָ/עָ֔ם לִ/זְבֹּ֖חַ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
translation:
  language: sw
  text: Musa akasema, “Tazama, natoka kwako, nami nitamsihi Yahwe. Kesho kundi la wadudu[a] litaondoka kutoka kwa Farao, kutoka kwa watumishi wake, na kutoka kwa watu wake. Ila Farao asiendelee kutenda kwa hila kwa kutowaacha watu waende kumtolea Yahwe dhabihu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania עָרֹב huenda linamaanisha hasa kundi la mainzi au wadudu wengine wanaokusanyika kwa wingi; aina kamili haijulikani kwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huhifadhi nguvu ya neno la kuvuta fikira kwa Kiswahili cha sasa chenye hadhi.
- source_word: יוֹצֵא מֵעִמָּךְ
  choice: ninaondoka mbele yako
  rationale: Huonyesha kuondoka kwa Musa kutoka mbele ya Farao bila kuongeza wazo lisilokuwapo katika Kiebrania.
- source_word: וְהַעְתַּרְתִּי אֶל יְהוָה
  choice: nami nitamsihi Yahwe
  rationale: Kitenzi עתר hapa kinaonyesha ombi la dhati au maombezi, si sala kwa maana ya jumla tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina la agano lililoandikwa moja kwa moja katika matini ya Kiebrania.
- source_word: וְסָר
  choice: litaondoka
  rationale: Hutoa kwa njia ya kawaida maana ya kuondoka au kuondolewa kwa kundi hilo.
- source_word: הֶעָרֹב
  choice: kundi la wadudu
  rationale: Huhifadhi maana pana ya kundi la viumbe wadogo wanaosonga kwa wingi bila kulitambulisha kwa uhakika kuwa mainzi.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: kwa Farao, kwa watumishi wake na kwa watu wake
  rationale: Kurudiwa kwa kihusishi ‘kwa’ kunaakisi msisitizo na upeo wa Kiebrania.
- source_word: מָחָר
  choice: Kesho
  rationale: Ni tafsiri ya moja kwa moja ya kielezi cha wakati.
- source_word: רַק
  choice: Ila
  rationale: Hutanguliza sharti au onyo la Musa kwa mtiririko wa kawaida wa Kiswahili.
- source_word: אַל יֹסֵף ... הָתֵל
  choice: asiendelee kufanya hila
  rationale: Huhifadhi wazo la kurudia au kuendelea na udanganyifu wenye dharau bila kulifupisha kuwa mzaha usio na udanganyifu.
- source_word: לְבִלְתִּי שַׁלַּח
  choice: kwa kutowaruhusu watu waende
  rationale: 'Hueleza namna hila ya Farao inavyojitokeza: kutowapa watu ruhusa ya kuondoka.'
- source_word: לִזְבֹּחַ
  choice: kumtolea Yahwe dhabihu
  rationale: Huhifadhi maana mahususi ya ibada kwa kutoa dhabihu, badala ya kuitafsiri kwa neno pana ‘kuabudu’.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini inatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho mahususi wa עָרֹב
  choice: kundi la wadudu
  alternative: kundi la mainzi au kundi la viumbe wa aina mbalimbali
  rationale: Aina kamili ya viumbe haijulikani kwa hakika, kwa hiyo tafsiri haifungi maana kwa ‘mainzi’ pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimepangwa kwa mtiririko wa kawaida huku marudio muhimu ya Kiebrania, onyo la Musa, na kutokuwa na uhakika kuhusu עָרֹב vikihifadhiwa.
