lexical_decisions:
- source_word: וַיִּצְבְּרוּ
  choice: Wakawakusanya pamoja
  rationale: Kitenzi צבר kinaonyesha kukusanya vitu vingi pamoja na kuvifanya marundo; usemi huu ni wa kawaida katika Kiswahili na unaeleza tendo hilo wazi.
- source_word: אֹתָם
  choice: -wa-
  rationale: Kiwakilishi hiki cha yambwa kinawarejelea vyura waliotajwa katika muktadha wa karibu.
- source_word: חֳמָרִם חֳמָרִם
  choice: katika chungu baada ya chungu
  rationale: Kurudiwa kwa nomino ya Kiebrania kunasisitiza mgawanyo katika malundo mengi. 'Chungu baada ya chungu' huhifadhi msisitizo huo kwa Kiswahili kinachoeleweka.
- source_word: וַתִּבְאַשׁ
  choice: ikanuka
  rationale: Kitenzi באש humaanisha kutoa harufu mbaya; 'ikanuka' ni tafsiri ya moja kwa moja, yenye nguvu, na ya kawaida.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika simulizi la mapigo, אֶרֶץ hapa ni nchi au eneo lililoathiriwa, si dunia nzima.
