  text: Wakayakusanya pamoja, marundo kwa marundo[a], nayo nchi ikanuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika marundo mengi”; Kiebrania hurudia nomino hiyo ili kusisitiza.
