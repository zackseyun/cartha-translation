base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/006.yaml
  text: He said[a], “Tomorrow.” And he said, “According to your word, so that you may know that there is no one like Yahweh our God.”
translation:
  language: sw
  text: Akasema[a], “Kesho.” Naye akasema, “Kama ulivyosema, ili ujue kwamba hakuna aliye kama Yahweh, Mungu wetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema tu “akasema.” Muktadha unaonyesha kuwa msemaji wa kwanza ni Farao, na wa pili ni Musa.
    reason: clarification
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema / Naye akasema
  rationale: Kitenzi cha masimulizi kutoka אמר kimetafsiriwa kwa wakati uliopita. Kiunganishi kimehifadhiwa katika tukio la pili ili kuonyesha mfuatano wa majibu, huku Kiswahili cha asili kikitumiwa.
- source_word: לְמָחָר
  choice: Kesho
  rationale: Ni jibu fupi la moja kwa moja linalotaja wakati, kama lilivyo katika Kiebrania.
- source_word: כִּדְבָרְךָ
  choice: kama ulivyosema
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya nahau ya Kiebrania, ‘kulingana na neno lako,’ bila kupoteza kukubaliwa kwa wakati uliotajwa.
- source_word: לְמַעַן תֵּדַע
  choice: ili ujue
  rationale: לְמַעַן huanzisha kusudi, na תֵּדַע ni nafsi ya pili umoja wa kiume inayomlenga Farao.
- source_word: אֵין כַּיהוָה
  choice: hakuna aliye kama Yahwe
  rationale: אֵין ni ukanushaji wa kuwapo, na כ ni kiambishi cha ulinganisho. ‘Hakuna aliye kama’ ni Kiswahili cha kawaida na huhifadhi dai la kipekee la mstari.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Ingawa אֱלֹהִים ina umbo la wingi, hapa inamtaja kwa umoja Mungu wa Israeli pamoja na kiambishi cha nafsi ya kwanza wingi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja tetragramatoni יהוה. ‘Yahwe’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo; ‘Yehova’ hutegemea muunganiko wa baadaye wa konsonanti na alama za vokali.
- issue: Utambulisho wa wazungumzaji wawili
  choice: 'Viwakilishi visivyotaja majina: “Akasema … Naye akasema”'
  alternative: “Farao akasema … Musa akasema”
  rationale: Kiebrania chenyewe kinarudia וַיֹּאמֶר bila kutaja majina katika mstari huu. Muktadha unaonyesha kuwa wa kwanza ni Farao na wa pili ni Musa, lakini kutoweka majina kunahifadhi namna ya chanzo na kuepuka kuongeza majina ndani ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Kama ulivyosema” limechaguliwa badala ya tafsiri ngumu zaidi “kulingana na neno lako.” Muundo wa mazungumzo na kutotajwa kwa majina ya wazungumzaji umehifadhiwa.
