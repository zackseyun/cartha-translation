base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/022.yaml
  text: But Moses said[a], “It would not be right to do so, because we would sacrifice to Yahweh our God what is detestable to the Egyptians. If we sacrifice what is detestable to the Egyptians before their eyes, will they not stone us?”
translation:
  language: sw
  text: Lakini Musa akasema, “Haifai kufanya hivyo, kwa maana tutamtolea Yahweh, Mungu wetu, dhabihu ambayo ni chukizo kwa Wamisri.[a] Tukimtolea mbele ya macho yao dhabihu ambayo ni chukizo kwa Wamisri, je, hawatatupiga mawe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na Kiebrania, “chukizo la Misri.” Huenda msemo huu unamaanisha kitu ambacho Wamisri walikiona kuwa cha kuchukiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: haifai
  rationale: Neno hili hapa linaonyesha jambo lisilo sahihi au lisilofaa kufanywa; “haifai” ni la kawaida na lenye hadhi katika Kiswahili.
- source_word: לַעֲשׂוֹת כֵּן
  choice: kufanya hivyo
  rationale: Hii ni tafsiri ya kawaida ya nahau ya Kiebrania inayorejelea pendekezo lililotangulia.
- source_word: תּוֹעֲבַת מִצְרַיִם
  choice: chukizo kwa Wamisri
  rationale: Muundo wa Kiebrania unaweza kutafsiriwa kihalisi “chukizo la Misri,” lakini muktadha unaelekeza hasa kwenye kitu ambacho Wamisri walikiona kuwa cha kuchukiza. Tanbihi inadumisha umbo na utata wa asili.
- source_word: נִזְבַּח
  choice: tutakachomtolea ... kuwa dhabihu / tukitoa ... kuwa dhabihu
  rationale: Ingawa kitenzi ni cha hali isiyotimilika, hapa kinaeleza tendo linalokusudiwa au linalodhaniwa chini ya pendekezo la Farao.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Jina la agano יהוה limetolewa wazi kuwa “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Inahifadhi wazi uhusiano wa kimilikishi na utambulisho wa Mungu wa Israeli.
- source_word: הֵן
  choice: tuki-
  rationale: Katika muktadha huu הֵן linaanzisha hali ya kudhaniwa; muundo wa Kiswahili wenye “tuki-” unawasilisha sharti hilo kwa ufasaha.
- source_word: לְעֵינֵיהֶם
  choice: mbele ya macho yao
  rationale: Inahifadhi taswira dhahiri ya tendo kufanywa waziwazi huku Wamisri wakitazama.
- source_word: יִסְקְלֻנוּ
  choice: hawatatupiga mawe?
  rationale: Kitenzi kinamaanisha kushambulia au kuua kwa mawe; swali la balagha lenye ukanushi limehifadhiwa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la Mungu la herufi nne moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya תּוֹעֲבַת מִצְרַיִם
  choice: kile ambacho ni chukizo kwa Wamisri
  alternative: chukizo la Misri
  rationale: Muktadha unaonyesha kwamba dhabihu ya Waisraeli ingewakasirisha Wamisri. Tafsiri kuu inaeleza maana hiyo, huku tanbihi ikihifadhi tafsiri ya karibu zaidi na muundo wenye utata wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. Muundo “mbele ya macho yao” umehifadhiwa kwa ajili ya nguvu ya taswira ya asili.
