lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Nami nitaweka
  rationale: Kitenzi שׂים kina maana ya kuweka; katika Kiswahili, ‘kuweka tofauti kati ya’ ni usemi wa kawaida unaohifadhi picha ya Kiebrania.
- source_word: פְדֻת
  choice: tofauti
  rationale: Ingawa nomino hii inaweza kumaanisha ukombozi au wokovu, katika muundo ‘kati ya watu wangu na watu wako’ inaonyesha tendo la Mungu la kuwatofautisha makundi hayo.
- source_word: בֵּין ... וּבֵין
  choice: kati ya ... na ...
  rationale: Huu ndio ulinganifu wa kawaida wa Kiswahili kwa muundo unaotenganisha au kutofautisha pande mbili.
- source_word: עַמִּי
  choice: watu wangu
  rationale: Muundo wa moja kwa moja wa umilikaji, unaowarejelea watu wa Mungu, yaani Israeli.
- source_word: עַמֶּךָ
  choice: watu wako
  rationale: Muundo wa moja kwa moja wa umilikaji unaowaelekezea watu wa Farao, yaani Wamisri.
- source_word: לְמָחָר
  choice: Kesho
  rationale: Kielezi cha wakati kimetangulizwa kama katika Kiebrania na kinasikika kwa kawaida katika Kiswahili.
- source_word: יִהְיֶה
  choice: itatokea
  rationale: Ikiwa ‘ishara hii’ ndiyo kiima, ‘itatokea’ hutoa kwa Kiswahili cha kawaida maana ya tukio la wakati ujao lililotangazwa.
- source_word: הָאֹת הַזֶּה
  choice: ishara hii
  rationale: אוֹת humaanisha ishara inayotolewa na Mungu au tendo linalothibitisha jambo; ‘ishara’ ni tafsiri wazi na ya kawaida.
theological_decisions:
- issue: Iwapo פְדֻת itafsiriwe kwa maana yake ya ukombozi au kwa maana ya kimuktadha ya kutofautisha
  choice: Katika matini kuu imetafsiriwa ‘tofauti’.
  alternative: ukombozi au wokovu
  rationale: Muktadha unaeleza jinsi Mungu atakavyowatendea Israeli na Misri kwa namna tofauti. Hata hivyo, neno hilo linaweza kuwa na maana ya tendo la Mungu la kukomboa; maana hiyo imehifadhiwa katika tanbihi bila kuifanya matini kuu isieleweke.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo ‘kuweka tofauti kati ya’ unadumisha ukaribu na Kiebrania bila kuwa mgumu.
