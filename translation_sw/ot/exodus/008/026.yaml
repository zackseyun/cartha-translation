  yaml_path: translation/ot/exodus/008/026.yaml
  text: So Moses went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: sw
  text: Basi Musa akatoka kwa Farao, akamsihi Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamwomba Yahwe kwa dhati.” Kitenzi cha Kiebrania kina maana ya kusihi au kuomba kwa bidii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akaondoka
  rationale: Qal wayyiqtol ya יצא inaonyesha kuondoka kimwili na kuendeleza mfuatano wa simulizi; “akaondoka” ni ya kawaida na wazi katika Kiswahili.
- source_word: מֵעִם
  choice: mbele ya
  rationale: מֵעִם hapa inaashiria kujitenga na uwepo au ushirika wa Farao. “Akaondoka mbele ya Farao” huhifadhi wazo la kuondoka kutoka alikokuwapo Farao kwa Kiswahili cha asili.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki cha kifalme katika Kiswahili cha Biblia na matumizi ya kisasa.
- source_word: וַיֶּעְתַּר
  choice: akamsihi kwa bidii
  rationale: Kitenzi עתר kinaonyesha ombi la dhati na lenye mkazo, si tendo la jumla tu la kusali. “Akamsihi kwa bidii” huwasilisha nguvu ya kusihi na pia humtaja wazi anayeelekezewa ombi.
- source_word: אֶל
  choice: -m-
  rationale: Kihusishi אֶל, ‘kwa/kuelekea,’ kimewasilishwa kiasili kwa kiambishi yambwa katika “akamsihi,” kikimtambulisha Yahwe kuwa ndiye aliyeombwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kama “Yahwe,” badala ya kubadilishwa na cheo, ili kuhifadhi jina la kibinafsi lililo katika maandishi ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja. “Yahwe” huhifadhi jina la agano bila kulibadilisha kuwa cheo, huku likifuata tahajia inayosomeka kwa Kiswahili.
- issue: Nguvu ya tendo katika וַיֶּעְתַּר
  choice: akamsihi Yahwe kwa bidii
  alternative: akamwomba Yahwe
  rationale: “Kuomba” peke yake kunaweza kusikika kwa upana kuliko kitenzi cha Kiebrania. “Kusihi kwa bidii” huhifadhi uzito wa ombi la dhati bila kuongeza maelezo ya kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kisimulizi na unaeleweka kwa wasomaji wa kawaida; “mbele ya Farao” huhifadhi kwa ufupi wazo la kuondoka kutoka katika uwepo wake.
