  yaml_path: translation/ot/exodus/008/028.yaml
  text: But Pharaoh hardened his heart this time also[a], and did not let the people go.
translation:
  language: sw
  text: Lakini Farao akaufanya moyo wake kuwa mgumu wakati huu pia[a], wala hakuwaruhusu watu waende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “akaufanya moyo wake kuwa mzito.” Nahau hii ina maana kwamba Farao alikuwa mkaidi au asiyeitika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְבֵּד
  choice: akaufanya ... kuwa mgumu
  rationale: Kitenzi hiki kinatokana na wazo la uzito na hapa Farao ndiye mtendaji. Katika nahau inayohusu moyo, kinaonyesha kujifanya mkaidi au asiyeitikia; tafsiri hii ni ya kawaida kwa Kiswahili huku ikihifadhi uwajibikaji wa Farao.
- source_word: לִבּוֹ
  choice: moyo wake
  rationale: Tafsiri ya moja kwa moja inafaa; katika matumizi ya Kiebrania moyo unahusishwa na nia na msimamo wa mtu.
- source_word: גַּם בַּפַּעַם הַזֹּאת
  choice: hata wakati huu
  rationale: Kirai hiki kinaonyesha kuwa Farao alirudia tendo hilo katika tukio hili pia. ‘Hata wakati huu’ ni Kiswahili cha asili kinachobeba msisitizo wa nyongeza.
- source_word: וְלֹא
  choice: wala haku-
  rationale: ‘Wala’ huendeleza simulizi kwa kukanusha tendo lililofuata na husikika kwa kawaida baada ya kauli hasi kwa maana inayodokezwa katika muktadha.
- source_word: שִׁלַּח
  choice: hakuwaacha ... waende
  rationale: Katika muktadha wa Kutoka, kitenzi hiki humaanisha kuwapa watu ruhusa au uhuru wa kwenda. Usemi huu ni wa kawaida na unaeleweka kwa urahisi.
- source_word: הָעָם
  choice: watu
  rationale: Nomino hii ya pamoja inawarejelea watu wa Israeli wanaotajwa tayari katika muktadha.
- source_word: וַ
  choice: Lakini
  rationale: Ingawa kiunganishi hiki mara nyingi huendeleza simulizi kwa ‘na,’ hapa ‘lakini’ kinaonyesha kwa kawaida mwitikio wa Farao uliokuwa kinyume na matarajio baada ya nafuu, bila kubadili maana kuu.
theological_decisions:
- issue: Mtendaji katika kuufanya moyo wa Farao kuwa mgumu
  choice: Farao mwenyewe akaufanya moyo wake kuwa mgumu
  alternative: Moyo wa Farao ukawa mgumu
  rationale: Muundo wa Kiebrania unamtaja Farao waziwazi kuwa mtendaji. Tafsiri inadumisha uwajibikaji wake na pia haiondoi mvutano wa simulizi pana la Kutoka, ambalo mahali pengine humtaja Mungu kuwa ndiye anayeufanya moyo wa Farao kuwa mgumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘akaufanya moyo wake kuwa mgumu’ ni wazi kwa wasomaji wa kawaida na huhifadhi Farao kama mtendaji; tanbihi inadumisha picha halisi ya Kiebrania ya moyo kuwa mzito.
