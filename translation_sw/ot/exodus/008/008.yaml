  text: וַ/יֵּצֵ֥א מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יִּצְעַ֤ק מֹשֶׁה֙ אֶל יְהוָ֔ה עַל דְּבַ֥ר הַֽ/צְפַרְדְּעִ֖ים אֲשֶׁר שָׂ֥ם לְ/פַרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/008.yaml
  text: So Moses and Aaron went out from Pharaoh[a], and Moses cried out to Yahweh concerning the frogs that he had set upon Pharaoh.
translation:
  language: sw
  text: Basi Musa na Aroni wakaondoka kutoka mbele ya Farao, naye Musa akamlilia Yahwe kuhusu vyura aliokuwa amewaleta juu ya Farao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliokuwa amewaweka juu ya Farao.” Kitenzi cha Kiebrania kwa maana halisi ni “kuweka”; katika muktadha wa pigo hili, “kuleta juu ya” huonyesha maana yake kwa Kiswahili cha kawaida.
    reason: Mbadala wa kileksika unaohifadhi maana halisi zaidi ya שׂים na uhusiano wa לְפַרְעֹה.
lexical_decisions:
- source_word: וַיֵּצֵא ... מֵעִם פַּרְעֹה
  choice: wakaondoka kutoka mbele ya Farao
  rationale: Kitenzi יצא pamoja na מֵעִם kinaonyesha kuondoka mahali alipo Farao. Tafsiri hii inaweka wazi kwamba waliondoka mbele yake, si kwamba walitoka naye.
- source_word: וַיִּצְעַק ... אֶל יְהוָה
  choice: akamlilia Yahwe
  rationale: צעק huonyesha kilio au ombi lenye nguvu. ‘Akamlilia’ ni Kiswahili cha asili kinachohifadhi uzito huo kuliko ‘akamwomba’ pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika maandishi ya Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: עַל דְּבַר
  choice: kuhusu
  rationale: Nahau hii hapa ina maana ya ‘kwa habari ya’ au ‘kuhusiana na’; ‘kuhusu’ ni sahihi na ya kawaida katika Kiswahili cha sasa.
- source_word: הַצְפַרְדְּעִים
  choice: vyura
  rationale: Ni nomino ya wingi inayowarejelea wanyama wa pigo hili.
- source_word: אֲשֶׁר שָׂם לְפַרְעֹה
  choice: ambao alikuwa amemletea Farao
  rationale: שׂים maana yake ya msingi ni ‘kuweka,’ lakini katika muktadha wa pigo ‘kumletea Farao’ huwasilisha kwa Kiswahili cha kawaida kwamba vyura waliletwa juu yake. Kiima kisichotajwa wazi katika Kiebrania pia hakijatajwa kwa jina katika tafsiri.
theological_decisions:
- issue: Uwakilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Kiima cha שָׂם (‘aliweka/alileta’)
  choice: Kiima kimeachwa katika nafsi ya tatu bila kutajwa kwa jina
  alternative: Yahwe alikuwa amemletea Farao
  rationale: Muktadha unaelekeza kwa Yahwe, lakini Kiebrania chenyewe kina kiwakilishi cha nafsi ya tatu tu. Muundo wa Kiswahili unahifadhi hali hiyo bila kuondoa kabisa utata wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi wenye ‘Basi’ na vitenzi vya mfululizo umehifadhi mwendo wa simulizi la Kiebrania.
