base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/004.yaml
  text: Then Pharaoh called for Moses and Aaron and said[a], “Pray to Yahweh, that he may remove the frogs from me and from my people, and I will let the people go[b], so that they may sacrifice to Yahweh.”
translation:
  language: sw
  text: Ndipo Farao akawaita Musa na Aroni, akasema, “Mmsihini Yahweh[a] awaondoe vyura kwangu na kwa watu wangu. Nami nitawaacha waende[b] ili wamtolee Yahweh dhabihu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Mmsihini Yahweh.” Kitenzi kinaweza kumaanisha kusihi au kuomba kwa dhati, si kusali kwa kawaida tu.'
    reason: lexical_alternative
  - marker: b
    text: Au, “na wamtolee Yahweh dhabihu.” Kiebrania kinaweza kueleweka kama kuunganisha tu matendo hayo, ingawa hapa huenda kinaonyesha kusudi la Farao kuwaacha watu waende.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... לְמֹשֶׁה וּלְאַהֲרֹן
  choice: akawaita Musa na Aroni
  rationale: Katika muundo huu, קרא pamoja na לְ humaanisha kuwaita watu waje; Kiswahili ‘akawaita’ ni cha asili na kinafaa katika muktadha.
- source_word: הַעְתִּירוּ
  choice: Mwombeni ... kwa bidii
  rationale: Hiphil ya עתר katika muktadha wa sala ina maana ya kuomba kwa kusisitiza au kusihi; ‘kwa bidii’ huhifadhi uzito huo kwa lugha inayoeleweka.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa kwa namna ya ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: וְיָסֵר הַצְפַרְדְּעִים
  choice: ili awaondoe vyura
  rationale: Hiphil ya סור humaanisha kuondoa, na umbo la kitenzi baada ya ombi linaonyesha matokeo yaliyokusudiwa ya sala.
- source_word: מִמֶּנִּי וּמֵעַמִּי
  choice: kwangu na kwa watu wangu
  rationale: Huhifadhi kutajwa tofauti kwa Farao mwenyewe na watu wake kwa Kiswahili cha kawaida.
- source_word: וַאֲשַׁלְּחָה אֶת־הָעָם
  choice: Nami nitawaacha watu waende
  rationale: Cohortative inaonyesha kusudi au ahadi ya Farao; ‘kuwaacha ... waende’ huhifadhi msemo unaojirudia katika simulizi la Kutoka.
- source_word: וְיִזְבְּחוּ
  choice: ili ... wamtolee ... dhabihu
  rationale: Kitenzi זבח kinahusu kutoa dhabihu; ‘ili’ huonyesha kusudi linalowezekana katika mfuatano huu, huku usomaji wa uratibu rahisi ukitajwa katika tanbihi.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu la herufi nne; ‘Yahweh’ hulihifadhi kama jina badala ya cheo.
- issue: Nguvu ya kishazi cha mwisho וְיִזְבְּחוּ
  choice: 'kusudi: ‘ili wamtolee Yahweh dhabihu’'
  alternative: 'uratibu rahisi: ‘na wamtolee Yahweh dhabihu’'
  rationale: Kitenzi kinachofuata ahadi ya Farao kinaweza kueleza kusudi la kuwaacha watu waende, lakini Kiebrania pia huruhusu uratibu rahisi; utata huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa wasomaji wa kawaida, huku uzito wa הַעְתִּירוּ na uwezekano wa maana mbili katika וְיִזְבְּחוּ vikihifadhiwa kwa tanbihi.
