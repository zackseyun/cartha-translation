  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִפְלֵיתִי֩ בַ/יּ֨וֹם הַ/ה֜וּא אֶת אֶ֣רֶץ גֹּ֗שֶׁן אֲשֶׁ֤ר עַמִּ/י֙ עֹמֵ֣ד עָלֶ֔י/הָ לְ/בִלְתִּ֥י הֱיֽוֹת שָׁ֖ם עָרֹ֑ב לְמַ֣עַן תֵּדַ֔ע כִּ֛י אֲנִ֥י יְהוָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
translation:
  language: sw
  text: Lakini siku hiyo nitatenga nchi ya Gosheni, ambako watu wangu wanaishi, ili kundi la wadudu lisiwepo huko[a], kusudi ujue kwamba mimi ni Yahweh katikati ya nchi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kundi la mainzi” au “makundi ya wadudu.” Neno la Kiebrania עָרֹב linaweza kumaanisha kundi kubwa la wadudu bila kutaja aina yao kwa uhakika.
    reason: lexical_alternative
  - marker: b
    text: Au “katikati ya dunia.” Neno la Kiebrania linaweza kueleweka kwa maana pana zaidi, ingawa katika muktadha huu huenda linamaanisha nchi ya Misri.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  choice: nitatenga
  rationale: Hifili ya פלא hapa ina maana ya kufanya tofauti au kuitendea sehemu fulani kwa namna ya pekee. “Nitatenga” ni ya asili katika Kiswahili na inaonyesha kwamba Gosheni italindwa na kutofautishwa na maeneo mengine.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: nchi ya Gosheni
  rationale: אֶרֶץ hapa ni eneo au nchi; “nchi ya Gosheni” ni tafsiri ya moja kwa moja na inayoeleweka.
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  choice: ambako watu wangu wanaishi
  rationale: Ingawa עֹמֵד kwa msingi ni “kusimama,” katika muundo huu inaonyesha kukaa au kuishi mahali. Tafsiri hii huwasilisha maana ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: לְבִלְתִּי הֱיוֹת שָׁם
  choice: ili ... lisiwepo huko
  rationale: 'Muundo huu unaonyesha kusudi au matokeo: tauni hiyo haitakuwapo Gosheni.'
- source_word: עָרֹב
  choice: kundi la wadudu
  rationale: Jina kamili la viumbe wanaokusudiwa halina uhakika. “Kundi la wadudu” huhifadhi upana wa neno la Kiebrania bila kulifanya kuwa mainzi pekee.
- source_word: לְמַעַן תֵּדַע
  choice: kusudi ujue
  rationale: Huhifadhi wazi maana ya kusudi, na kitenzi cha umoja kinamwelekea Farao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: katikati ya nchi
  rationale: בְּקֶרֶב huonyesha kuwa ndani au katikati. “Nchi” inafaa zaidi katika muktadha wa Misri, huku uwezekano mpana wa “dunia” ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Andiko linatumia jina binafsi la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa בְּקֶרֶב הָאָרֶץ
  choice: katikati ya nchi
  alternative: katikati ya dunia
  rationale: Katika simulizi la mapigo, “nchi” inaelekea kumaanisha nchi ya Misri; hata hivyo, neno la Kiebrania linaweza kuwa na maana pana zaidi, ambayo imeonyeshwa katika tanbihi.
- issue: Utambulisho wa עָרֹב
  choice: kundi la wadudu
  alternative: kundi la mainzi
  rationale: Aina hususa ya viumbe haijulikani kwa uhakika. Tafsiri kuu haifungi maana kwa mainzi pekee, na uwezekano huo umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi mantiki ya kusudi ya Kiebrania bila kuwa mgumu kupita kiasi.
