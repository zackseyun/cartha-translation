base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/020.yaml
  text: And Yahweh did so[a], and a heavy swarm came into Pharaoh’s house and into his servants’ houses, and throughout all the land of Egypt the land was ruined because of the swarm.
translation:
  language: sw
  text: Yahwe akafanya hivyo; kundi kubwa la wadudu[a] likaingia katika nyumba ya Farao, katika nyumba za watumishi wake, na katika nchi yote ya Misri. Nchi ikaharibiwa kwa sababu ya kundi hilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania halitaji kwa uhakika aina ya wadudu; kwa mapokeo limeeleweka kuwa kundi la mainzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la Mungu lililoandikwa katika Kiebrania badala ya kulibadili kuwa cheo; tahajia hii ni ya kawaida na ya kueleweka katika Kiswahili.
- source_word: וַיַּעַשׂ ... כֵּן
  choice: akafanya hivyo
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba Yahwe alitekeleza jambo lililotangulia kutangazwa.
- source_word: עָרֹב כָּבֵד
  choice: kundi kubwa sana la wadudu
  rationale: עָרֹב ni nomino ya mkusanyiko ambayo aina yake mahususi haijulikani kwa uhakika; כָּבֵד hapa inaonyesha ukubwa au wingi mkubwa. Kiswahili cha moja kwa moja ‘kundi zito’ si cha kawaida katika muktadha huu.
- source_word: בֵּיתָה פַרְעֹה
  choice: likaingia katika nyumba ya Farao
  rationale: Kiambishi cha mwelekeo kwenye ‘nyumba’ kinaonyesha kuingia ndani; ‘nyumba’ linahifadhi neno la Kiebrania bila kulifasiri kwa lazima kuwa ‘ikulu.’
- source_word: וּבֵית עֲבָדָיו
  choice: na katika nyumba za watumishi wake
  rationale: 'Umoja ‘nyumba’ pamoja na wingi ‘watumishi’ unaeleweka kwa maana ya kugawanya: nyumba mbalimbali za watumishi. ‘Watumishi’ halipunguzi maana pana ya עֲבָדִים kuwa maofisa pekee.'
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: Katika nchi yote ya Misri
  rationale: Linaonyesha kwamba athari ilienea kotekote nchini Misri.
- source_word: תִּשָּׁחֵת הָאָרֶץ
  choice: nchi ikaharibiwa
  rationale: Kauli ya kutendwa ya שׁחת inaonyesha nchi kupatwa na uharibifu; tafsiri hii ni nzito bila kudai kwamba nchi iliangamizwa kabisa.
- source_word: מִפְּנֵי הֶעָרֹב
  choice: kwa sababu ya kundi hilo
  rationale: Katika muktadha huu מִפְּנֵי inaonyesha kisababishi, na ‘kwa sababu ya’ ni Kiswahili cha asili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina la agano moja kwa moja. ‘Yahwe’ huhifadhi jina hilo badala ya kuweka cheo, huku ‘Yehova’ ikiwa matamshi mbadala ya kimapokeo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kundi kubwa sana’ limetumiwa badala ya ‘kundi zito’ ili kutoa maana ya כָּבֵד kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi kutokuwa na uhakika kuhusu aina ya עָרֹב.
