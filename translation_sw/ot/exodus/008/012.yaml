  yaml_path: translation/ot/exodus/008/012.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your staff and strike the dust of the earth, and it will become gnats throughout all the land of Egypt.’”
translation:
  language: sw
  text: Ndipo Yahwe akamwambia Musa, “Mwambie Aroni, ‘Nyosha fimbo yako na upige vumbi la ardhi, nalo litageuka kuwa chawa[a] katika nchi yote ya Misri.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbu wadogo”; neno la Kiebrania linamaanisha wadudu wadogo wanaouma au kuwasha, lakini aina kamili haijulikani kwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano la Mungu kwa namna ya uhawilishaji inayotumika kwa kawaida katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu wa Kiswahili unaendeleza mfuatano wa simulizi na kuonyesha kwamba maneno yanamwelekea Musa.
- source_word: אֱמֹר אֶל אַהֲרֹן
  choice: Mwambie Aroni
  rationale: Ni njia ya kawaida na fupi ya Kiswahili ya kutoa amri ya kupeleka ujumbe kwa mtu mwingine.
- source_word: נְטֵה אֶת מַטְּךָ
  choice: Nyosha fimbo yako
  rationale: ‘Nyosha’ huwasilisha tendo la kuelekeza au kunyoosha fimbo; ‘fimbo’ ni neno la kisasa na linaloeleweka kwa מַטֶּה katika muktadha huu.
- source_word: וְהַךְ אֶת עֲפַר הָאָרֶץ
  choice: ulipige vumbi la ardhi
  rationale: Linadumisha amri ya kupiga na taswira halisi ya vumbi la ardhi bila kuipanua.
- source_word: וְהָיָה לְכִנִּם
  choice: nalo litakuwa chawa
  rationale: Kitenzi kinaonyesha matokeo ya vumbi kubadilika na kuwa wadudu; ‘chawa’ ni tafsiri ya jadi inayowezekana, huku kutokuwa na uhakika kuhusu aina kamili kukibainishwa katika tanbihi.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: katika nchi yote ya Misri
  rationale: Huwasilisha kwa uwazi kwamba athari itaenea katika eneo lote la Misri.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Aya inatumia jina la Mungu moja kwa moja; uhawilishaji hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. Muundo wa vumbi kama nomino ya wingi usiohesabika umehifadhiwa kwa ‘vumbi la ardhi,’ na tanbihi imewekwa moja kwa moja baada ya ‘chawa,’ ambako utata wa kileksika unatokea.
