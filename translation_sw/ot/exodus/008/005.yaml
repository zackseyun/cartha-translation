base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/005.yaml
  text: 'And Moses said to Pharaoh[a], “Have this honor over me: when shall I plead for you, for your servants, and for your people, to cut off the frogs from you and from your houses? Only in the Nile shall they remain.”'
translation:
  language: sw
  text: 'Musa akamwambia Farao, “Jipatie heshima juu yangu[a]: nikuombee lini wewe, watumishi wako na watu wako, kwa ajili ya kuwaondoa vyura kutoka kwako na katika nyumba zako? Watabaki katika Mto Nile tu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufafanua maana ya muktadha, “Chagua wakati.” Nahau ya Kiebrania ni ngumu; Musa anamwalika Farao achague wakati ambapo Musa atamwombea.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְפָּאֵר עָלַי
  choice: Jipe heshima hii juu yangu
  rationale: Nahau hii ya Kiebrania ni ngumu na ina wazo la kujipatia heshima au fahari juu ya mwingine. Tafsiri hii inadumisha taswira yake badala ya kuifafanua moja kwa moja kuwa agizo la kutaja wakati; maana ya kimuktadha imeelezwa katika tanbihi.
- source_word: לְמָתַי
  choice: nikuombee lini
  rationale: Neno hili linamruhusu Farao achague wakati ambapo Musa atamwombea. Muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אַעְתִּיר
  choice: nikuombee
  rationale: Kitenzi hiki humaanisha kusihi kwa bidii, hasa kumwelekea Mungu. ‘Nikuombee’ kinaonyesha Musa akimsihi Mungu kwa ajili ya Farao bila kutumia istilahi nzito ya kitaalamu.
- source_word: לְךָ וְלַעֲבָדֶיךָ וּלְעַמְּךָ
  choice: wewe, watumishi wako na watu wako
  rationale: Makundi yote matatu yamedumishwa wazi kama walengwa wa maombi ya Musa.
- source_word: לְהַכְרִית
  choice: ili kuwaondoa kabisa
  rationale: Ingawa maana ya msingi ni ‘kukata mbali,’ katika muktadha huu kusudi ni kuwaondoa vyura kabisa kutoka kwa watu na nyumba zao. ‘Kuondoa kabisa’ ni Kiswahili cha asili kinachodumisha nguvu ya tendo hilo.
- source_word: הַצֲפַרְדְּעִים
  choice: vyura
  rationale: Hii ndiyo maana ya moja kwa moja ya neno la Kiebrania.
- source_word: מִמְּךָ וּמִבָּתֶּיךָ
  choice: kutoka kwako na nyumba zako
  rationale: Tafsiri inadumisha tofauti kati ya Farao mwenyewe na nyumba zake.
- source_word: רַק
  choice: tu
  rationale: ‘Tu’ linaonyesha kwamba Mto Nile ndio mahali pekee ambapo vyura watabaki.
- source_word: בַּיְאֹר
  choice: katika Mto Nile
  rationale: Katika simulizi la Kutoka, יְאֹר humaanisha hasa Mto Nile, si mto wowote.
- source_word: תִּשָּׁאַרְנָה
  choice: Watabaki
  rationale: Kitenzi kinaonyesha kwamba vyura wataendelea kuwapo katika Nile baada ya kuondolewa kwingineko.
