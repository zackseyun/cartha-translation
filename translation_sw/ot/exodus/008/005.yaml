  terminology: «Musa», «Farao», «watumishi», «vyura», na «Mto Nile» ni sahihi kwa Kiswahili Sanifu cha Afrika Mashariki. «Nikuombee» ni tafsiri ya kawaida na inayofaa ya maombezi/dua kwa niaba ya wengine.
