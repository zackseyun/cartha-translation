  text: כִּ֣י אִם אֵינְ/ךָ֮ מְשַׁלֵּ֣חַ אֶת עַמִּ/י֒ הִנְ/נִי֩ מַשְׁלִ֨יחַ בְּ/ךָ֜ וּ/בַ/עֲבָדֶ֧י/ךָ וּֽ/בְ/עַמְּ/ךָ֛ וּ/בְ/בָתֶּ֖י/ךָ אֶת הֶ/עָרֹ֑ב וּ/מָ֨לְא֜וּ בָּתֵּ֤י מִצְרַ֨יִם֙ אֶת הֶ֣/עָרֹ֔ב וְ/גַ֥ם הָ/אֲדָמָ֖ה אֲשֶׁר הֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/017.yaml
  text: For if you do not let my people go[a], behold, I am sending the swarm upon you, upon your servants, upon your people, and into your houses. The houses of Egypt will be filled with the swarm[b], and also the ground on which they are.
translation:
  language: sw
  text: Kwa maana usipowaacha watu wangu waende, tazama, nitatuma kundi la viumbe[a] juu yako, juu ya watumishi wako, juu ya watu wako, na ndani ya nyumba zako. Nyumba za Wamisri zitajaa kundi hilo la viumbe, na pia ardhi[b] waliyo juu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mainzi.” Neno la Kiebrania עָרֹב huenda linamaanisha kundi la viumbe, ambalo kwa mapokeo limeeleweka kuwa mainzi; tafsiri ya jumla inadumisha kutokuwa na uhakika kuhusu aina yao.
    reason: lexical_alternative
  - marker: b
    text: Au, “nchi” au “udongo.” Neno la Kiebrania אֲדָמָה linaweza kumaanisha ardhi, nchi, au udongo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Kwa maana usipo-
  rationale: Muundo huu unaendeleza onyo lililotangulia na kuanzisha sharti hasi kwa Kiswahili cha kawaida.
- source_word: אֵינְךָ מְשַׁלֵּחַ אֶת עַמִּי
  choice: usipowaacha watu wangu waende
  rationale: Hii ni kauli ya kawaida na sahihi ya Kiswahili kwa maana ya kuwaruhusu au kuwaachilia watu waondoke.
- source_word: הִנְנִי מַשְׁלִיחַ
  choice: tazama, nitatuma
  rationale: “Tazama” inadumisha uzito wa fomula ya tangazo, na wakati ujao unaonyesha tendo lililo karibu na hakika katika muktadha huu.
- source_word: הֶעָרֹב
  choice: kundi la wadudu
  rationale: Neno la Kiebrania ni la jumla na utambulisho kamili wa viumbe hao hauna uhakika; “kundi la wadudu” ni la asili kwa Kiswahili bila kuwataja moja kwa moja kuwa mainzi.
- source_word: בְּךָ ... וּבַעֲבָדֶיךָ וּבְעַמְּךָ
  choice: juu yako, juu ya watumishi wako, juu ya watu wako
  rationale: Kurudia “juu ya” kunahifadhi mkazo na mfululizo wa onyo la Kiebrania.
- source_word: וּבְבָתֶּיךָ
  choice: na ndani ya nyumba zako
  rationale: “Ndani ya” hutoa kwa kawaida wazo la kundi kuingia nyumba, ambalo linathibitishwa na sentensi inayofuata.
- source_word: וּמָלְאוּ בָּתֵּי מִצְרַיִם
  choice: Nyumba za Misri zitajaa
  rationale: Hii ni tungo ya asili ya Kiswahili inayohifadhi matokeo yaliyoelezwa na Kiebrania.
- source_word: וְגַם הָאֲדָמָה
  choice: pamoja na ardhi
  rationale: “Ardhi” inaweza kumaanisha eneo au uso wa nchi; tanbihi inadumisha uwezekano wa “udongo.”
- source_word: אֲשֶׁר הֵם עָלֶיהָ
  choice: walipo
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha mahali walipo bila kuongeza kwamba walikuwa wamesimama.
