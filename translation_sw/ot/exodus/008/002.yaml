translation:
  language: sw
  text: Basi Aroni akaunyoosha mkono wake juu ya maji ya Misri, vyura[a] wakapanda na kuifunika nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia nomino “chura” katika umoja, ambayo huenda ikimaanisha mkusanyiko; ndiyo sababu imetafsiriwa “vyura.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: akaunyoosha
  rationale: Kitenzi נטה katika muktadha huu kinaonyesha kunyoosha mkono kama ishara ya tendo lenye mamlaka; “akaunyoosha” ni Kiswahili cha kawaida na sahihi.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Kiebrania kinataja mkono waziwazi, hivyo taswira halisi inadumishwa bila kuibadili kuwa “mkono wa juu” au “mkono wote.”
- source_word: עַל
  choice: juu ya
  rationale: Huwasilisha kwa kawaida uhusiano wa kimahali wa mkono ulionyoshwa kuelekea na juu ya maji.
- source_word: מֵימֵי מִצְרַיִם
  choice: maji ya Misri
  rationale: Muundo wa wingi wa Kiebrania unarejelea kwa ujumla maji au maeneo ya maji ya Misri; “maji ya Misri” ni usemi wa asili katika Kiswahili.
- source_word: וַתַּעַל
  choice: wakatoka
  rationale: Katika muktadha huu עלה inaeleza vyura wakitoka majini na kuingia nchi kavu; “wakatoka” huwasilisha mwendo huo kwa Kiswahili cha kawaida.
- source_word: הַצְּפַרְדֵּעַ
  choice: vyura
  rationale: Ingawa nomino ya Kiebrania iko katika umoja wenye kibainishi, inaelekea kutumiwa kwa maana ya mkusanyiko; Kiswahili kwa kawaida hutumia wingi “vyura.”
- source_word: וַתְּכַס
  choice: kuifunika
  rationale: Kitenzi כסה kina maana ya kufunika; uchaguzi huu ni wa moja kwa moja na hauongezi taswira isiyokuwamo katika chanzo.
- source_word: אֶרֶץ מִצְרַיִם
  choice: nchi ya Misri
  rationale: אֶרֶץ hapa ni eneo au nchi ya Misri, si dunia nzima; “nchi ya Misri” ni tafsiri ya kawaida na iliyo wazi.
