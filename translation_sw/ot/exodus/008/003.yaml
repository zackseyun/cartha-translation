base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/003.yaml
  text: And the magicians did the same by their secret arts[a], and they brought up the frogs over the land of Egypt.
translation:
  language: sw
  text: Nao wachawi wakafanya vivyo hivyo kwa sanaa zao za siri[a], wakafanya vyura wapande juu ya nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uchawi wao” au “kwa sanaa zao za kichawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: wakafanya vivyo hivyo
  rationale: Muundo wa עשה pamoja na כֵן unaonyesha kwamba walitenda kwa namna ileile kama tendo lililotangulia; “wakafanya vivyo hivyo” ni Kiswahili cha kawaida na huhifadhi nguvu hiyo ya ulinganisho.
- source_word: הַחֲרְטֻמִּים
  choice: wachawi
  rationale: Katika muktadha wa Kutoka, neno hili linawahusu wataalamu wa ikulu ya Farao waliotumia mbinu za kichawi au za siri; “wachawi” ni neno wazi na linaloeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: בְּלָטֵיהֶם
  choice: kwa ufundi wao wa siri
  rationale: Neno hili linaashiria matendo ya kichawi yaliyofichika au ya siri. Tafsiri hii inaonyesha njia waliyotumia bila kubainisha zaidi ya inavyosema Kiebrania.
- source_word: וַיַּעֲלוּ
  choice: wakawaleta
  rationale: Hifili ya עלה ina maana ya kusababisha wapande au watokee. “Wakawaleta” huhifadhi maana ya kusababisha, ingawa Kiswahili hakihitaji kueleza mwelekeo wa kupanda kwa namna isiyo ya kawaida.
- source_word: אֶת הַצְפַרְדְּעִים
  choice: vyura
  rationale: Ni nomino ya wingi yenye kiambishi cha uhusika wa moja kwa moja; kiambishi cha Kiswahili “-wa-” katika “wakawaleta” kinarejelea vyura hao mahususi.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: juu ya nchi ya Misri
  rationale: “Juu ya” huakisi עַל na kueleza kwamba vyura waliletwa katika eneo la nchi ya Misri.
theological_decisions:
- issue: Asili ya tendo la wachawi
  choice: Kueleza moja kwa moja kwamba wachawi nao waliwaleta vyura
  alternative: Kusema kwamba walionekana tu kuiga tendo hilo au kwamba lilikuwa hila
  rationale: Simulizi la Kiebrania linaripoti tendo hilo bila kulipunguza kuwa mwonekano au udanganyifu. Tafsiri haipaswi kuingiza maelezo ya kiasili au ya kipolemiki yasiyokuwamo katika maandishi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa msomaji wa kawaida. Muundo ni wa usawa bora: unahifadhi maana ya kisababishi, ulinganisho, na kutokubainishwa kwa asili ya tendo la wachawi.'
