base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/015.yaml
  text: Then the magicians said to Pharaoh[a], “This is the finger of God.” But Pharaoh’s heart was hardened, and he did not listen to them[c][b], just as Yahweh had spoken.
translation:
  language: sw
  text: Ndipo waganga wa uchawi wakamwambia Farao, “Hiki ni kidole cha Mungu[a].” Lakini moyo wa Farao ukawa mgumu[b], naye hakuwasikiliza, kama Yahwe[c] alivyosema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kidole cha Mungu”; ni msemo unaoonyesha nguvu za Mungu zikitenda moja kwa moja.
    reason: cultural_note
  - marker: b
    text: Au “moyo wa Farao ukawa imara.” Kiebrania hakitaji waziwazi ni nani aliyeufanya moyo wake kuwa mgumu katika kishazi hiki.
    reason: lexical_alternative
  - marker: c
    text: Kwa Kiebrania, YHWH, jina la Mungu; hapa limetafsiriwa “Yahwe.” Kwa kawaida hutafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: waganga wa uchawi
  rationale: Neno hili linawataja wataalamu wa kidini na uchawi wa Farao. “Waganga wa uchawi” linaeleweka katika Kiswahili cha sasa na haliongezi bila msingi kwamba walikuwa na cheo maalumu cha ikulu.
- source_word: אֶצְבַּע אֱלֹהִים הִוא
  choice: Hiki ni kidole cha Mungu
  rationale: Muundo huu unahifadhi tamathali halisi ya Kiebrania, inayodokeza nguvu za Mungu zikifanya kazi moja kwa moja. “Hiki” kinakubaliana kisarufi na “kidole” katika Kiswahili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa אֱלֹהִים linaweza kuwa na matumizi mengine kulingana na muktadha, hapa rejeo la umoja kwa Mungu ndilo linalofaa zaidi katika simulizi.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: moyo wa Farao ukawa mgumu
  rationale: Tafsiri hii inaonyesha hali ya ukaidi iliyotokea bila kumtaja Mungu wala Farao kuwa mtendaji wa kuufanya moyo kuwa mgumu, kwa kuwa kishazi cha Kiebrania hakitaji mtendaji waziwazi.
- source_word: שָׁמַע אֲלֵהֶם
  choice: hakuwasikiliza
  rationale: Katika muundo huu, שׁמע pamoja na אֶל humaanisha kusikiliza au kutii. “Hakuwasikiliza” ni lugha ya kawaida na wazi, huku ikiruhusu maana ya kutoyazingatia maneno yao.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: kama Yahwe alivyokuwa amesema
  rationale: Kauli hii inarejelea jambo ambalo Yahwe alikuwa amelitangaza kabla ya tukio hili; wakati uliopita wa “alivyokuwa amesema” unaonyesha uhusiano huo wa kisimulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo kama “BWANA.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu, YHWH. “Yahwe” linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Mtendaji katika kufanywa mgumu kwa moyo wa Farao
  choice: moyo wa Farao ukawa mgumu
  alternative: moyo wa Farao ulifanywa mgumu; Farao aliufanya moyo wake kuwa mgumu
  rationale: Kishazi hiki hakimtaji waziwazi mtendaji. Tafsiri iliyochaguliwa inalinda utata na mvutano wa kiteolojia wa andiko bila kuamua jambo ambalo aya yenyewe haijasema.
- issue: Maana ya “kidole cha Mungu”
  choice: kuhifadhi tamathali “kidole cha Mungu” katika matini
  alternative: hii ni nguvu ya Mungu
  rationale: Maneno ya waganga yanatambua utendaji wa moja kwa moja wa Mungu, lakini kubadili tamathali kuwa “nguvu” pekee kungepunguza picha halisi ya Kiebrania. Ufafanuzi umetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. “Waganga wa uchawi” linafafanua wahusika bila kutumia neno la kizamani, na tamathali “kidole cha Mungu” imehifadhiwa kwa sababu ni muhimu kwa sauti na maana ya aya.
