base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/027.yaml
  text: And Yahweh did according to Moses' word[a], and removed the swarm from Pharaoh, from his servants, and from his people; not one remained.
translation:
  language: sw
  text: Yahweh akafanya kama Musa alivyosema, akaondoa lile kundi la wadudu[a] kutoka kwa Farao, kutoka kwa watumishi wake, na kutoka kwa watu wake; hakubaki hata mmoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makundi ya nzi.” Neno la Kiebrania עָרֹב linamaanisha pigo la viumbe waliokusanyika kwa wingi, lakini lenyewe halibainishi aina yao hasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja ili kuhifadhi jina la agano lililo katika Kiebrania, badala ya kulibadili kuwa cheo.
- source_word: וַיַּעַשׂ ... כִּדְבַר מֹשֶׁה
  choice: akafanya kama Musa alivyosema
  rationale: Hii ni tafsiri ya Kiswahili iliyo ya kawaida na yenye maana sawa na msemo wa Kiebrania ‘akafanya kulingana na neno la Musa’.
- source_word: וַיָּסַר
  choice: akaondoa
  rationale: Katika kausativi ya Kiebrania, kitenzi hiki humaanisha kuondoa au kutwaa; ‘akaondoa’ kinafaa kwa kuondolewa kwa pigo.
- source_word: הֶעָרֹב
  choice: lile kundi la wadudu
  rationale: Neno linataja kundi la viumbe wanaoruka au kutambaa kwa wingi katika pigo hilo, lakini halibainishi aina yao; ‘wadudu’ linaepuka kuwataja mahsusi kuwa nzi.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: kutoka kwa Farao, kwa watumishi wake, na kwa watu wake
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba kundi hilo liliondolewa kutoka kwa kila upande uliotajwa, bila urudiaji mzito usio wa lazima.
- source_word: לֹא נִשְׁאַר אֶחָד
  choice: hakubaki hata mmoja
  rationale: ‘Hata mmoja’ huhifadhi msisitizo wa neno la umoja אֶחָד na ni msemo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania ina jina maalumu la Mungu, si cheo; ‘Yahweh’ hulihifadhi wazi bila kuingiza mapokeo ya kulibadili kuwa cheo.
- issue: Utambulisho wa הֶעָרֹב
  choice: kundi la wadudu
  alternative: makundi ya nzi
  rationale: Aina kamili ya viumbe haijabainishwa na neno la Kiebrania lenyewe. Tafsiri kuu haipaswi kutatua kwa uhakika jambo ambalo chanzo kinaliacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kama Musa alivyosema’ ni cha asili zaidi kuliko ‘kulingana na neno la Musa,’ huku ‘hakubaki hata mmoja’ kikihifadhi msisitizo wa Kiebrania.
