base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/023.yaml
  text: We will go a three days' journey into the wilderness and sacrifice to Yahweh our God[b][a], just as he tells us.
translation:
  language: sw
  text: Tutakwenda mwendo wa siku tatu nyikani, na tutamtolea Yahweh Mungu wetu dhabihu, kama atakavyotuambia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama anavyotuambia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: mwendo wa siku tatu
  rationale: Kirai hiki huonyesha umbali au safari inayochukua siku tatu. ‘Mwendo wa siku tatu’ ni Kiswahili cha kawaida kinachohifadhi nahau ya Kiebrania.
- source_word: נֵלֵךְ
  choice: tutasafiri
  rationale: Qal imperfect nafsi ya kwanza wingi ina maana ya wakati ujao katika ombi hili; ‘tutasafiri’ huunganika kwa kawaida na ‘mwendo wa siku tatu.’
- source_word: בַּמִּדְבָּר
  choice: kuingia nyikani
  rationale: מִדְבָּר ni eneo la nyika lisilokaliwa sana, si lazima jangwa la mchanga. ‘Kuingia’ huonyesha mwelekeo unaodokezwa na kitenzi cha kwenda.
- source_word: וְזָבַחְנוּ
  choice: na tutamtolea ... dhabihu
  rationale: זבח hurejelea kutoa dhabihu kwa kuchinja. Muundo huu ni wa asili katika Kiswahili na unahifadhi maana ya ibada na mlengwa wa tendo.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetafsiriwa kwa kulinakili kama ‘Yahweh,’ badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Nomino yenye kiambishi cha nafsi ya kwanza wingi imetafsiriwa moja kwa moja, ikihifadhi utambulisho wa agano.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: כַּאֲשֶׁר huonyesha kufuata au kupatana na maagizo; ‘kama’ ni wazi na ya kawaida hapa.
- source_word: יֹאמַר אֵלֵינוּ
  choice: atakavyotuambia
  rationale: 'Imperfect inaweza kueleweka kwa mwelekeo wa wakati ujao: dhabihu itatolewa kulingana na yale ambayo Mungu atawaambia. Uwezekano wa maana ya sasa umehifadhiwa katika tanbihi.'
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni yenyewe. ‘Yahweh’ hulihifadhi kama jina binafsi la agano bila kulibadili kuwa cheo.
- issue: Wakati wa יֹאמַר
  choice: atakavyotuambia
  alternative: anavyotuambia
  rationale: Umbo la imperfect linaweza kuelekeza kwa maagizo yatakayotolewa, lakini pia linaweza kusomwa kwa maana ya sasa au ya kawaida; utata huo umeonyeshwa kwa tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nyikani’ huepuka kudhania jangwa la mchanga, na ‘mwendo wa siku tatu’ huhifadhi nahau ya kipimo cha safari.
