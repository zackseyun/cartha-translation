  text: Ndipo Farao akawaita Musa na Aroni, akasema, “Nendeni mkamtolee Mungu wenu dhabihu katika nchi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “humu nchini,” yaani, ndani ya Misri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: Katika muktadha huu קרא humaanisha kuwaita waje kwake; ‘akawaita’ ni Kiswahili cha kawaida na kinaonyesha kuwa Musa na Aroni ndio walioitwa.
- source_word: פַרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo cha mfalme wa Misri.
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Muundo huu wa usimulizi unaendeleza mfululizo wa matendo kwa njia ya kawaida katika Kiswahili.
- source_word: לְכוּ
  choice: Nendeni
  rationale: Ni amri ya wingi inayowaelekea Musa na Aroni na inalingana moja kwa moja na maana ya הלך hapa.
- source_word: זִבְחוּ
  choice: mkamtolee ... dhabihu
  rationale: Kitenzi זבח kinahusu kutoa dhabihu katika ibada; muundo huu wa Kiswahili ni wa asili na unaweka wazi tendo pamoja na anayepokea dhabihu.
- source_word: לֵאלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Kiambishi ל־ kinaonyesha anayelengwa au kupokea dhabihu; ‘kumtolea Mungu wenu dhabihu’ huwasilisha uhusiano huo kwa Kiswahili fasaha.
- source_word: בָּאָרֶץ
  choice: humu nchini
  rationale: Kifungu hiki ni ‘katika nchi’ kwa maana halisi, lakini muktadha unaonyesha nchi walimokuwamo, yaani Misri. ‘Humu nchini’ huhifadhi rejeo la nchi bila kuingiza jina ‘Misri’ moja kwa moja katika matini.
