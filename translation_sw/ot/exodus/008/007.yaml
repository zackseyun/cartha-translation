base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/007.yaml
  text: And the frogs will depart from you[a], and from your houses, and from your servants, and from your people; only in the Nile will they remain.
translation:
  language: sw
  text: Vyura wataondoka kwako, na kutoka katika nyumba zako, na kutoka kwa watumishi wako, na kutoka kwa watu wako; katika Mto Nile tu watabaki[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtoni.” Neno la Kiebrania יְאֹר linaweza kumaanisha “mto,” lakini katika kitabu cha Kutoka kwa kawaida humaanisha hasa Mto Nile.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרוּ
  choice: wataondoka
  rationale: Kitenzi סוּר hapa kinaeleza vyura kuondoka au kwenda mbali wakati pigo linapoondolewa; ‘wataondoka’ ni Kiswahili cha kawaida na hakidai kwamba wataangamizwa moja kwa moja.
- source_word: הַצְפַרְדְּעִים
  choice: Vyura
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi yenye uainishaji, ikirejelea vyura wa pigo hilo.
- source_word: מִמְּךָ
  choice: kwako
  rationale: Kihusishi מן pamoja na kiambishi cha nafsi ya pili umoja wa kiume huonyesha kuondoka kwa Farao au mahali alipo; ‘kwako’ ni usemi wa kawaida wa Kiswahili.
- source_word: וּמִבָּתֶּיךָ
  choice: kwenye nyumba zako
  rationale: Wingi wa Kiebrania umehifadhiwa kwa ‘nyumba zako’; ‘kwenye’ huonyesha kwa kawaida mahali ambako vyura wataondoka.
- source_word: וּמֵעֲבָדֶיךָ
  choice: kwa watumishi wako
  rationale: עֶבֶד inaweza kumaanisha mtumishi, mtumwa au ofisa. Katika muktadha huu ‘watumishi’ ni pana na ya asili bila kubainisha isivyohitajika hadhi yao ya kisheria au cheo rasmi.
- source_word: וּמֵעַמֶּךָ
  choice: kwa watu wako
  rationale: עַם humaanisha watu wa Farao kwa upana; ‘watu wako’ ni tafsiri wazi na ya kawaida.
- source_word: רַק
  choice: tu
  rationale: רַק huweka kikomo au ubaguzi. ‘Tu’ linaonyesha kwamba mahali pekee watakapobaki ni katika Nile.
- source_word: בַּיְאֹר
  choice: katika Mto Nile
  rationale: יְאֹר linaweza kumaanisha mto, lakini katika kitabu cha Kutoka kwa kawaida humaanisha hasa Mto Nile. Jina hilo linatoa uwazi unaolingana na muktadha.
- source_word: תִּשָּׁאַרְנָה
  choice: watabaki
  rationale: Nifali ya שׁאר hapa ina maana ya kubaki au kuachwa; ‘watabaki’ ni ya kawaida na huhifadhi maana bila kuongeza mhusika anayewaacha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Marudio ya viambishi vya mahali yamepunguzwa kiasi kwa ufasaha, huku maeneo yote na wingi wa ‘nyumba’ yakihifadhiwa. Alama ya tanbihi imewekwa baada ya ‘Mto Nile,’ ambako hoja yake ya kileksika inahusika.
