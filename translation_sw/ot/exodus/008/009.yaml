base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/009.yaml
  text: And the LORD did according to the word of Moses, and the frogs died out of the houses, out of the courtyards, and out of the fields.
translation:
  language: sw
  text: BWANA akafanya sawasawa na neno la Musa; vyura wakafa kutoka katika nyumba, kutoka katika nyua, na kutoka katika mashamba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Limetafsiriwa kwa desturi ya Kiswahili ya kuwakilisha jina la agano la Mungu kwa herufi kubwa.
- source_word: כִּדְבַר מֹשֶׁה
  choice: kama Musa alivyosema
  rationale: Huwasilisha maana ya nahau ya Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: הַצְפַרְדְּעִים
  choice: vyura
  rationale: Ni neno la kawaida na sahihi la Kiswahili kwa wanyama wanaotajwa.
- source_word: הַחֲצֵרֹת
  choice: nyua
  rationale: Katika muktadha huu hurejelea maeneo ya wazi yaliyo karibu na nyumba; 'nyua' ni tafsiri fupi na ya asili.
- source_word: מִן ... מִן ... וּמִן
  choice: katika ... katika ... na katika
  rationale: Ingawa kihusishi kinaweza kuwa 'kutoka', pamoja na kitenzi 'wakafa' kinaonyesha mahali walipofia; Kiswahili cha asili hutumia 'katika'.
theological_decisions:
- issue: Uwakilishi wa jina יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: BWANA hufuata desturi pana ya tafsiri za Biblia za Kiswahili bila kuingiza msimamo wa kimadhehebu; herufi kubwa hutofautisha jina hili na cheo cha kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Sentensi mbili zimetumiwa ili mtiririko uwe wa kawaida bila kupoteza uhusiano wa matendo katika Kiebrania.
