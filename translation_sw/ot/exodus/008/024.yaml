  text: וַ/יֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְ/כֶם֙ וּ/זְבַחְתֶּ֞ם לַ/יהוָ֤ה אֱלֹֽהֵי/כֶם֙ בַּ/מִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא תַרְחִ֖יקוּ לָ/לֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/024.yaml
  text: Then Pharaoh said, “I will let you go, so that you may sacrifice to Yahweh your God in the wilderness. Only, you must not go very far away. Plead for me.”
translation:
  language: sw
  text: Ndipo Farao akasema, “Mimi nitawaacha mwende, ili mmtolee Yahwe Mungu wenu dhabihu nyikani. Lakini msiende mbali sana. Niombeeni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Waw ya usimulizi inaendeleza mfuatano wa matukio; ‘Ndipo’ ni ya kawaida na inaonyesha hatua inayofuata.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki katika Kiswahili cha Biblia.
- source_word: אָנֹכִי אֲשַׁלַּח אֶתְכֶם
  choice: Mimi nitawaacha mwende
  rationale: Katika mazungumzo haya, שׁלח humaanisha kuruhusu watu waondoke. Kiwakilishi אָנֹכִי kimetolewa wazi kwa ‘Mimi’ ili kuhifadhi msisitizo wa Kiebrania.
- source_word: וּזְבַחְתֶּם
  choice: ili mmtolee ... dhabihu
  rationale: Muunganiko huu unaonyesha kusudi la kuwaruhusu waende; Kiswahili hiki ni cha asili na huhifadhi maana ya kutoa dhabihu kwa Mungu.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יְהוָה limetoholewa moja kwa moja kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ni tafsiri ya moja kwa moja ya muundo wa umilikaji, ikimtambulisha Mungu wa Israeli.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: ‘Nyikani’ hueleza eneo lisilokaliwa na lisilolimwa bila kulifanya lazima kuwa jangwa kavu.
- source_word: רַק
  choice: Lakini
  rationale: Hapa neno hilo linaanzisha sharti linaloweka mpaka kwa ruhusa ya Farao; ‘Lakini’ ni ya asili katika Kiswahili.
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  choice: msiende mbali sana
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi huongeza nguvu ya katazo; ‘mbali sana’ huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: הַעְתִּירוּ בַּעֲדִי
  choice: Niombeeni
  rationale: עתר katika Hifili humaanisha kusihi au kuomba kwa bidii kwa ajili ya mwingine. ‘Niombeeni’ ni fupi, wazi, na huhifadhi wazo la maombezi kwa niaba ya Farao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia Tetragramatoni moja kwa moja. ‘Yahwe’ huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo; ‘Yehova’ hutegemea muundo wa matamshi wa baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Kauli ya Farao imewekwa katika mtiririko wa kawaida wa simulizi; msisitizo wa אָנֹכִי umehifadhiwa kwa ‘Mimi’. Hakuna tanbihi zinazohitajika.
source_grounding:
  english_pob_role: consult_only
