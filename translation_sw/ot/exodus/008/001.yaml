  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹ֣ר אֶֽל אַהֲרֹ֗ן נְטֵ֤ה אֶת יָדְ/ךָ֙ בְּ/מַטֶּ֔/ךָ עַל הַ֨/נְּהָרֹ֔ת עַל הַ/יְאֹרִ֖ים וְ/עַל הָ/אֲגַמִּ֑ים וְ/הַ֥עַל אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/001.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your hand with your staff over the rivers, over the canals, and over the pools, and bring up the frogs over the land of Egypt.’”
translation:
  language: sw
  text: Kisha Yahweh akamwambia Mose, “Mwambie Aroni, ‘Nyosha mkono wako, ukiwa umeshika fimbo yako, juu ya mito, juu ya mifereji[a], na juu ya madimbwi, uwapandishe vyura juu ya nchi ya Misri.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikondo ya Naili”; neno la Kiebrania mara nyingi hurejelea njia za maji za Naili katika Misri.
    reason: Mbadala wa kileksika unaonyesha maana mahsusi ya kimuktadha bila kuiondoa tafsiri fupi ya maandishi makuu.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Limedumisha jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, kwa tahajia ya kawaida na inayoeleweka katika Kiswahili.
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa usimulizi unaendeleza mfululizo wa matukio; “kisha” pamoja na kitenzi cha usimulizi ni Kiswahili cha asili.
- source_word: אֱמֹר
  choice: Mwambie
  rationale: Amri hii inamtaka Mose ampelekee Aroni maneno yanayofuata; “mwambie” ni ya moja kwa moja na ya kawaida.
- source_word: נְטֵה אֶת־יָדְךָ בְּמַטֶּךָ
  choice: Nyosha mkono wako pamoja na fimbo yako
  rationale: Inahifadhi tendo la kunyoosha mkono na kutaja fimbo kama chombo kinachotumika, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: הַנְּהָרֹת
  choice: mito
  rationale: Ni maana ya kawaida ya neno hili na inadumisha utofauti wake na aina mbili za maji zinazofuata.
- source_word: הַיְאֹרִים
  choice: mifereji
  rationale: Katika muktadha wa Misri, wingi huu unaelekea kumaanisha njia au mikondo ya maji inayohusiana na Naili; “mifereji” huitofautisha na mito na madimbwi.
- source_word: הָאֲגַמִּים
  choice: madimbwi
  rationale: Neno hili hurejelea maji yaliyokusanyika kama vidimbwi au mabwawa madogo; “madimbwi” ni neno la sasa na linaloeleweka.
- source_word: וְהַעַל אֶת־הַצְפַרְדְּעִים
  choice: uwapandishe vyura
  rationale: Kitenzi cha Kiebrania ni cha kusababisha kupanda; umbo la Kiswahili “uwapandishe” linadumisha maana hiyo ya kisababishi.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: juu ya nchi ya Misri
  rationale: Inahifadhi kihusishi kilichorudiwa katika chanzo bila kuongeza wazo la “kote” ambalo halijaelezwa wazi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, si cheo. “Yahwe” linadumisha jina hilo bila kulibadilisha kuwa cheo, huku “Yehova” likiwa umbo mbadala la kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Biblia. Orodha ya mito, mifereji, na madimbwi imedumishwa, pamoja na mfululizo wa amri katika usemi wa moja kwa moja.
