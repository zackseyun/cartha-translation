translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na hadhi inayofaa maandiko. Alama ya tanbihi imewekwa baada ya “ngozi bora,” ambako neno la Kiebrania lisilo na maana hakika linatafsiriwa.
