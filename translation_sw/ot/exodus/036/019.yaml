translation:
  language: sw
  text: Akatengeneza kifuniko cha hema kwa ngozi za kondoo dume zilizotiwa rangi nyekundu, na kifuniko cha ngozi za tahashi juu yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maana ya neno la Kiebrania תְּחָשִׁים haijulikani kwa uhakika. Huenda likamaanisha ngozi za ng’ombe wa baharini, pomboo, dugong, au, katika tafsiri ya jadi, beji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Kitenzi עשה katika mfuatano wa simulizi kinaeleza tendo lililofanywa; “akatengeneza” ni Kiswahili cha kawaida na kinafaa kwa utengenezaji wa kifuniko.
- source_word: מִכְסֶה לָאֹהֶל
  choice: kifuniko cha hema
  rationale: מִכְסֶה ni kifuniko, na אֹהֶל ni hema. Muundo huu ni wa asili katika Kiswahili na hauingizi neno la kiufafanuzi lisilokuwamo katika Kiebrania.
- source_word: עֹרֹת אֵלִים מְאָדָּמִים
  choice: kwa ngozi za kondoo dume zilizotiwa rangi nyekundu
  rationale: Kirai kinataja ngozi za kondoo dume zilizofanywa nyekundu; tafsiri hii inaonyesha wazi kuwa ngozi hizo zilitiwa rangi.
- source_word: וּמִכְסֵה
  choice: na juu yake akaweka kifuniko
  rationale: Kiebrania kinataja kifuniko kingine bila kutumia neno “cha pili.” Kitenzi “akaweka” kimeelezwa kwa kufuata sarufi ya kawaida ya Kiswahili na uhusiano wa מִלְמָעְלָה.
- source_word: עֹרֹת תְּחָשִׁים
  choice: ngozi bora
  rationale: Maana kamili ya תְּחָשִׁים haijulikani. “Ngozi bora” huepuka kutaja kwa uhakika mnyama ambaye utambulisho wake hauna uhakika, huku maelezo ya chini yakihifadhi uwezekano mbalimbali.
- source_word: מִלְמָעְלָה
  choice: juu yake
  rationale: Kirai hiki kinaonyesha kwamba kifuniko hicho kilikuwa tabaka la juu. “Juu yake” ni cha asili katika Kiswahili na kinaonyesha uhusiano wa mahali bila kuongeza maelezo yasiyohitajika.
