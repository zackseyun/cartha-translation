  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקְח֞וּ מִ/לִּ/פְנֵ֣י מֹשֶׁ֗ה אֵ֤ת כָּל הַ/תְּרוּמָה֙ אֲשֶׁ֨ר הֵבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לִ/מְלֶ֛אכֶת עֲבֹדַ֥ת הַ/קֹּ֖דֶשׁ לַ/עֲשֹׂ֣ת אֹתָ֑/הּ וְ֠/הֵם הֵבִ֨יאוּ אֵלָ֥י/ו ע֛וֹד נְדָבָ֖ה בַּ/בֹּ֥קֶר בַּ/בֹּֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/003.yaml
  text: And they took from before Moses all the contribution that the sons of Israel had brought for the work of the service of the sanctuary[a], to do it[c][b]. But they still kept bringing to him freewill offerings morning after morning.
translation:
  language: sw
  text: Nao wakachukua kutoka kwa Musa[a] mchango wote ambao Waisraeli[b] walikuwa wameuleta kwa ajili ya kazi ya huduma ya mahali patakatifu, ili kuifanya kazi hiyo. Nao waliendelea kumletea matoleo ya hiari asubuhi baada ya asubuhi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka mbele ya Musa,” yaani, kutoka mahali alipokuwapo Musa au kutoka chini ya usimamizi wake.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
  - marker: c
    text: Au, “kila asubuhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: wakachukua
  rationale: Kitenzi לקח kimsingi humaanisha ‘chukua’; hapa mafundi wanachukua vifaa vilivyokuwa mbele ya Musa au chini ya usimamizi wake.
- source_word: מִלִּפְנֵי מֹשֶׁה
  choice: kutoka kwa Musa
  rationale: Hii ni Kiswahili cha kawaida kinachoonyesha kwamba vitu vilitolewa kutoka mahali au usimamizi wa Musa; taswira halisi ya ‘kutoka mbele ya Musa’ imehifadhiwa katika tanbihi.
- source_word: הַתְּרוּמָה
  choice: mchango
  rationale: Neno hili linamaanisha kitu kilichotengwa na kutolewa kwa matumizi matakatifu; ‘mchango’ linafaa kwa vifaa vilivyotolewa kwa ujenzi kuliko lugha ya dhabihu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Hili ndilo jina la kawaida na la asili katika Kiswahili kwa jamii nzima ya Israeli; umbo halisi ‘wana wa Israeli’ limetajwa katika tanbihi.
- source_word: לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: kwa ajili ya kazi ya huduma ya mahali patakatifu
  rationale: Tafsiri hii inadumisha mlolongo wa nomino ‘kazi,’ ‘huduma,’ na ‘mahali patakatifu’ bila kuufanya usemi usieleweke katika Kiswahili.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: ili kuifanya kazi hiyo
  rationale: Kitenzi עשה kinaweza kuwa ‘fanya’ au ‘tengeneza.’ Kutaja ‘kazi hiyo’ kunaweka wazi rejeo la kiambishi cha kike bila kubadili maana kuwa ujenzi wa kitu fulani pekee.
- source_word: וְהֵם הֵבִיאוּ
  choice: Nao waliendelea kumletea
  rationale: Kiunganishi וְ kimetafsiriwa kwa ‘Nao,’ huku muktadha na kiwakilishi huru הֵם vikionyesha tendo lililoendelea; hakuna nguvu ya lazima ya upinzani inayohitaji ‘lakini.’
- source_word: נְדָבָה
  choice: matoleo ya hiari
  rationale: נדבה ni zawadi inayotolewa kwa hiari. Wingi wa Kiswahili unaendana kwa kawaida na tendo la kuleta mara kwa mara.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: asubuhi baada ya asubuhi
  rationale: Urudiaji wa Kiebrania unaonyesha kitendo kilichotokea tena na tena; usemi huu wa Kiswahili unadumisha msisitizo huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa ‘kazi ya huduma ya mahali patakatifu’ umeachwa ukiwa rasmi kiasi ili kuhifadhi msongamano wa nomino za Kiebrania, huku sehemu nyingine zikitolewa kwa Kiswahili cha asili.
