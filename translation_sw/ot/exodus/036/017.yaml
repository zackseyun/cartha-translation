base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/017.yaml
  text: He made fifty loops on the edge of the outer curtain in the first set[a], and he made fifty loops on the edge of the curtain of the second set.
translation:
  language: sw
  text: Alifanya vitanzi hamsini kwenye ukingo wa pazia la mwisho katika fungu la kwanza[a], naye akafanya vitanzi hamsini kwenye ukingo wa pazia la fungu la pili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pa kuunganishia,” au “katika sehemu ya kwanza iliyounganishwa”; neno la Kiebrania linarejelea fungu la mapazia lililounganishwa au mahali pa kuyaunganisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: vitanzi
  rationale: Neno hili humaanisha vitanzi vya kitambaa vilivyotumiwa kuunganisha mapazia. Aya hii haisemi kwamba vilikuwa vya rangi ya buluu, kwa hiyo maelezo hayo hayajaongezwa.
- source_word: שְׂפַת
  choice: ukingo
  rationale: Katika muktadha wa kitambaa, neno hili linamaanisha ukingo wa pazia; ‘ukingo’ ni Kiswahili cha kawaida na wazi.
- source_word: יְרִיעָה
  choice: pazia
  rationale: Katika maelezo ya Maskani, neno hili linataja vipande vikubwa vya kitambaa; ‘pazia’ linaeleweka kwa urahisi katika muktadha huu.
- source_word: הַקִּיצֹנָה
  choice: la mwisho
  rationale: Kivumishi hiki kinaonyesha pazia lililokuwa kwenye mwisho wa fungu. ‘La mwisho’ linaeleza nafasi hiyo bila kudokeza kwa lazima kwamba lilikuwa upande wa nje wa Maskani.
- source_word: בַּמַּחְבָּרֶת
  choice: katika fungu la kwanza
  rationale: Neno מַחְבָּרֶת hurejelea kitu kilichounganishwa au fungu la mapazia. ‘La kwanza’ linaeleweka kutokana na kutajwa kwa fungu la pili katika kishazi kinachofuata, lakini utata wa neno umehifadhiwa katika tanbihi.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: la fungu la pili
  rationale: Kirai hiki hutofautisha pazia la upande au fungu la pili lililounganishwa na la kwanza. Tafsiri hii ni fupi na inafuata ulinganifu wa vifungu viwili.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Alifanya ... naye akafanya
  rationale: Kurudiwa kwa kitenzi עשה kumehifadhiwa ili kuonyesha muundo sambamba wa Kiebrania.
