  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עָשָׂה֩ בְצַלְאֵ֨ל וְ/אָהֳלִיאָ֜ב וְ/כֹ֣ל אִ֣ישׁ חֲכַם לֵ֗ב אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה חָכְמָ֤ה וּ/תְבוּנָה֙ בָּ/הֵ֔מָּה לָ/דַ֣עַת לַ/עֲשֹׂ֔ת אֶֽת כָּל מְלֶ֖אכֶת עֲבֹדַ֣ת הַ/קֹּ֑דֶשׁ לְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/001.yaml
  text: And Bezalel and Oholiab[a], and every skillful man in whom Yahweh has put wisdom and understanding to know how to do all the work for the service of the sanctuary[c][b], shall do according to all that Yahweh has commanded.
translation:
  language: sw
  text: Nao Besaleli, Oholiabu, na kila mwanamume mwenye ustadi[a], ambao Yahwe ameweka hekima na ufahamu ndani yao[b], ili wajue jinsi ya kufanya kazi yote ya utumishi wa mahali patakatifu[c], watafanya kulingana na yote ambayo Yahwe ameamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kila mwanamume mwenye hekima ya moyo”; katika muktadha huu kirai hicho humaanisha kila fundi mwenye ustadi.
    reason: lexical_alternative
  - marker: b
    text: Au, “ambao Yahwe amewapa hekima na ufahamu.” Kiebrania kinasema kihalisi “ndani yao,” kikirejelea kwa pamoja Besaleli, Oholiabu, na kila mwanamume mwenye ustadi.
    reason: lexical_alternative
  - marker: c
    text: Au, “kazi yote ya utumishi mtakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: watafanya
  rationale: Katika muktadha huu, kitenzi hiki kinaeleza matokeo au agizo linalohusu wakati ujao. Wingi wa Kiswahili unapatana kwa kawaida na wahusika waliotajwa kwa pamoja.
- source_word: בְצַלְאֵל וְאָהֳלִיאָב
  choice: Besaleli, Oholiabu
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika Kiswahili huku yakifuata kwa karibu matamshi ya Kiebrania.
- source_word: וְכֹל אִישׁ חֲכַם לֵב
  choice: na kila mwanamume mwenye ustadi
  rationale: Kirai cha Kiebrania ni ‘kila mwanamume mwenye hekima ya moyo.’ Katika muktadha wa ufundi, ‘mwenye ustadi’ huwasilisha maana yake kwa Kiswahili cha kawaida, huku ‘mwanamume’ ikihifadhi jinsia ya אִישׁ.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה וּתְבוּנָה בָהֵמָּה
  choice: ambaye Yahwe ameweka hekima na ufahamu ndani yao
  rationale: ‘Ndani yao’ huhifadhi umbo la wingi la Kiebrania, ambalo linawarejelea Besaleli, Oholiabu, na mafundi wote kwa pamoja. ‘Ameweka’ linaakisi נתן katika nahau hii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: לָדַעַת לַעֲשֹׂת
  choice: ili wajue jinsi ya kufanya
  rationale: Hueleza maarifa ya kiutendaji na uwezo unaokusudiwa na vitenzi-jina vya Kiebrania.
- source_word: כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: kazi yote ya utumishi wa mahali patakatifu
  rationale: Huhifadhi vipengele vya ‘kazi,’ ‘utumishi,’ na ‘mahali patakatifu’ kwa usemi wa Kiswahili unaoeleweka.
- source_word: לְכֹל אֲשֶׁר צִוָּה יְהוָה
  choice: kulingana na yote ambayo Yahwe ameamuru
  rationale: 'Kiambishi לְ hapa kinaeleweka kuwa cha upatanifu: kazi ifanywe sawasawa na agizo la Yahwe.'
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Lugha ya kijinsia katika אִישׁ חֲכַם לֵב
  choice: kila mwanamume mwenye ustadi
  alternative: kila mtu mwenye ustadi au kila fundi stadi
  rationale: אִישׁ ni nomino ya kiume katika umoja. Tafsiri inahifadhi hilo bila kukataa kwamba kirai hicho kinaweza kuwakilisha kundi la mafundi katika muktadha.
- issue: Uhusiano wa umoja na wingi katika kishazi cha jamaa
  choice: ambaye ... ndani yao
  alternative: ambao Yahwe amewapa
  rationale: Kiebrania kina kishazi cha jamaa kinachofuata ‘kila mwanamume,’ lakini kiwakilishi ‘ndani yao’ ni cha wingi na kinawarejelea wote waliotajwa. Tafsiri inalinda mvutano huo wa kisarufi badala ya kuusawazisha kabisa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Nao’ linaendeleza mtiririko wa maagizo yaliyotangulia. Muundo usio wa kawaida kidogo wa ‘ambaye ... ndani yao’ umeachwa kwa makusudi ili kuhifadhi uhusiano wa umoja na wingi uliomo katika Kiebrania; tanbihi inaufafanua.
