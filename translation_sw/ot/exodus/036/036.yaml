  - marker: b
    text: Au “vikalio vinne vya fedha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי
  choice: nguzo
  rationale: Neno hili linamaanisha mihimili iliyosimama inayotegemeza jengo; “nguzo” ni neno la kawaida na sahihi katika muktadha wa Maskani.
- source_word: שִׁטִּים
  choice: mti wa mshita
  rationale: Linataja mbao za aina ya acacia zilizotumiwa katika ujenzi wa Maskani; “mti wa mshita” ni istilahi inayoeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: וַיְצַפֵּם
  choice: akazifunika kwa dhahabu
  rationale: Kitenzi kinaeleza kuwekea kitu tabaka la chuma; usemi huu ni wa asili na unaonyesha kwamba nguzo zilifunikwa kwa dhahabu, si kwamba zilitengenezwa kwa dhahabu tupu.
- source_word: וָוֵיהֶם
  choice: kulabu zake
  rationale: Katika maelezo ya Maskani, neno hili linaelekea kutaja vifaa vya kuning’inizia au kuunganisha vilivyokuwa kwenye nguzo.
- source_word: אַדְנֵי
  choice: vitako
  rationale: Hivi ni vipande vya msingi ambamo nguzo zilikitwa. “Vitako” linaeleza kazi yake kwa ufupi; “vikalio” pia lingewezekana.
- source_word: כָסֶף
  choice: fedha
  rationale: Ni jina la kawaida la metali iliyotumiwa kutengeneza vitako.
- source_word: לָהּ
  choice: kwa ajili yake
  rationale: Kiwakilishi cha kike cha umoja kinarejelea pazia lililotajwa katika mstari uliotangulia. Tafsiri inahifadhi kiwakilishi badala ya kurudia nomino ndani ya mstari.
- source_word: וַיִּצֹק
  choice: akazimiminia
  rationale: Katika muktadha wa kutengeneza vitu vya metali, kitenzi kinamaanisha kuunda kwa kumimina metali iliyoyeyushwa; umbo hili linafaa kwa vitako vya nguzo.
