  text: He made for it four pillars of acacia wood and overlaid them with gold[a]; their hooks were of gold[b]; and he cast for them four silver bases.
translation:
  language: sw
  text: Kwa ajili yake[a] akatengeneza nguzo nne za mti wa mshita, akazifunika kwa dhahabu. Kulabu za nguzo hizo zilikuwa za dhahabu, naye akawamiminia vitako vinne vya fedha.[b]
  philosophy: optimal-equivalence
