  text: And he made two boards for the corners of the tabernacle at the rear[a].
translation:
  language: sw
  text: Naye akatengeneza mbao mbili kwa ajili ya pembe za Maskani, kwenye pande zake mbili za nyuma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya vipande vya pembe vya Maskani, kwenye pande zake mbili za nyuma.” Maneno ya Kiebrania yanaweza kurejelea pembe au ncha za nyuma za muundo, au mbao maalumu za pembe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: Naye ... mbili
  rationale: Kiunganishi kinaendeleza mfululizo wa simulizi, na umbo la idadi linataja wazi mbao mbili.
- source_word: קְרָשִׁים
  choice: mbao
  rationale: Katika maelezo ya ujenzi wa Maskani, neno hili linamaanisha mbao za muundo; “mbao” ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: עָשָׂה
  choice: akatengeneza
  rationale: Kitenzi kina maana ya kawaida ya kufanya au kutengeneza; hapa “akatengeneza” kinafaa kwa kazi ya ujenzi.
- source_word: לִ/מְקֻצְעֹת
  choice: kwa ajili ya pembe
  rationale: Neno linaweza kuelekeza kwenye mahali pa pembe au vipande maalumu vya pembe; tafsiri hii inatoa maana kuu bila kufuta uwezekano mwingine.
- source_word: הַ/מִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi inayotambulika katika muktadha wa mahali patakatifu pa Israeli na pia inadumisha wazo la mahali pa kukaa.
- source_word: בַּ/יַּרְכָתָיִם
  choice: upande wa nyuma
  rationale: Umbo la Kiebrania linaashiria ncha au pande mbili za nyuma za jengo; Kiswahili hiki ni cha kawaida, huku maelezo ya chini yakihifadhi uwezekano wa kusisitiza pande hizo mbili.
