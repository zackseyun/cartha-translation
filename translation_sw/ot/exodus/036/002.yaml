  terminology: Majina Bezaleli na Oholiabu yanafuata matumizi yaliyozoeleka katika Kiswahili. “Yahweh” huhifadhi jina la kimungu la יהוה. “Moyo” na “hekima” vinadumisha taswira na upeo wa istilahi ya Kiebrania; tanbihi hufafanua kwamba hekima hapa yahusisha ustadi.
