    rationale: Kubadili kuwa “kuja kwenye kazi hiyo ili kuifanya” kunahifadhi kwa uwazi zaidi mfuatano wa kuja kwenye kazi na kuifanya, bila kufanya Kiswahili kiwe kizito.
