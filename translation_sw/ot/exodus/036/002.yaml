base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/002.yaml
  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
translation:
  language: sw
  text: Ndipo Musa akawaita Bezaleli, Oholiabu, na kila mtu mwenye moyo wa hekima[a] ambaye Yahweh alikuwa amemtia hekima moyoni mwake—kila mtu ambaye moyo wake ulimchochea[b] kuja kwenye kazi hiyo ili kuifanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mwenye moyo wa hekima”; hapa ni nahau inayomaanisha mtu aliyejaliwa hekima au ustadi.'
    reason: lexical_alternative
  - marker: b
    text: Au “ambaye moyo wake ulimsukuma” au “ambaye moyo wake ulimwinua”; nahau ya Kiebrania inaonyesha utayari au msukumo wa ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: קרא אֶל katika muktadha huu ni kuwaita watu waje kufanya kazi; “akawaita” ni ya kawaida na hudumisha mfuatano wa simulizi.
- source_word: בְּצַלְאֵל וְאֶל אָהֳלִיאָב
  choice: Bezaleli, Oholiabu
  rationale: Majina yamenukuliwa kwa maumbo yanayoeleweka na yaliyozoeleka katika Kiswahili.
- source_word: כָּל אִישׁ חֲכַם לֵב
  choice: kila mtu mwenye moyo wa hekima
  rationale: Usemi huu unahifadhi taswira ya Kiebrania ya moyo kuwa kitovu cha hekima na ustadi; tanbihi inaeleza maana yake katika muktadha wa ufundi.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה בְּלִבּוֹ
  choice: ambaye Yahweh alikuwa ametia hekima moyoni mwake
  rationale: Huhifadhi dhana ya hekima kama kipawa cha Mungu na lugha ya “moyoni” ya matini chanzo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limenukuliwa badala ya kubadilishwa kuwa cheo.
- source_word: כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: kila mtu ambaye moyo wake ulimchochea
  rationale: “Ulimchochea” huwasilisha msukumo wa ndani na utayari unaoonyeshwa na nahau ya Kiebrania bila kuondoa taswira ya moyo.
- source_word: לְקָרְבָה אֶל הַמְּלָאכָה לַעֲשֹׂת אֹתָהּ
  choice: kuja kuifanya kazi hiyo
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inabeba wazo la kukaribia au kujiunga na kazi kwa kusudi la kuifanya.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina la agano יהוה; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Chanzo cha hekima na ustadi
  choice: Yahweh alikuwa ametia hekima moyoni mwa kila mmoja
  alternative: walikuwa tu mafundi wenye ustadi
  rationale: Kifungu kinahusisha wazi hekima yao na kitendo cha Yahweh; tafsiri haipaswi kufifisha dai hilo la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unahifadhi taswira za Kiebrania za moyo huku tanbihi zikifafanua maana ya nahau. Kistari kirefu kinabainisha kwamba kishazi cha pili kinafafanua kundi lililoitwa.
