  source_fidelity: 'Maana kuu imehifadhiwa: Musa anawaita Bezaleli, Oholiabu, na wote wenye hekima ambao Yahweh amewapa hekima moyoni, yaani wale waliosukumwa kwa hiari kuja kufanya kazi hiyo. Hata hivyo, wakati wa kitenzi katika kishazi cha Yahweh unahitaji kurekebishwa ili ulingane vyema na tendo lililotangulia katika simulizi, na tanbihi b ina mbadala wenye hitilafu ya kisarufi.'
