  to: Ndipo Musa akawaita Bezaleli, Oholiabu, na kila mtu mwenye moyo wa hekima[a] ambaye Yahweh alikuwa amemtia hekima moyoni mwake—kila mtu ambaye moyo wake ulimchochea[b] kuja kwenye kazi hiyo ili kuifanya.
