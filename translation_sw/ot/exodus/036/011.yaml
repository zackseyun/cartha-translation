base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/011.yaml
  text: He made loops of blue yarn on the edge of the first curtain at the end of the first set joined together[a]; likewise he made them on the edge of the outermost curtain in the second set joined together.
translation:
  language: sw
  text: Akatengeneza vitanzi vya uzi wa buluu kwenye ukingo wa pazia moja, lililokuwa kwenye mwisho wa muunganisho wa kwanza[a]; akafanya vivyo hivyo kwenye ukingo wa pazia la mwisho katika muunganisho wa pili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pa kuunganishia” au “kwenye kiungio.” Neno la Kiebrania linaweza kutaja mahali au mpangilio ambapo mapazia yaliunganishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: vitanzi
  rationale: Neno hili linamaanisha vitanzi vya kitambaa vilivyotumiwa kuunganisha mapazia; “vitanzi” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: תְּכֵלֶת
  choice: uzi wa buluu
  rationale: Katika maelezo ya Maskani, neno hili linataja nyenzo ya kitambaa iliyotiwa rangi ya buluu, si rangi kwa ujumla tu.
- source_word: שְׂפַת
  choice: ukingo
  rationale: Katika muktadha huu linamaanisha mpaka wa pazia ambako vitanzi viliwekwa.
- source_word: הַיְרִיעָה
  choice: pazia
  rationale: Neno hili linataja kila pazia au kipande cha kifuniko cha Maskani; “pazia” linaeleweka kwa urahisi na linafaa katika muktadha.
- source_word: הָאֶחָת
  choice: la kwanza
  rationale: Ingawa kwa umbo ni “moja,” hapa linatumika kwa maana ya mpangilio likitofautishwa na seti ya pili baadaye katika mstari.
- source_word: מִקָּצָה
  choice: mwisho wa
  rationale: Kirai hiki kinaonyesha sehemu ya mwisho ya pazia au seti ambako muunganisho ulifanyika.
- source_word: בַּמַּחְבָּרֶת
  choice: katika seti iliyounganishwa
  rationale: Neno linaweza kutaja muunganisho wenyewe au mpangilio wa mapazia yaliyounganishwa; tafsiri hii inaeleza kwa Kiswahili cha kawaida kundi lililounganishwa bila kuficha utata kabisa.
- source_word: כֵּן עָשָׂה
  choice: akafanya vivyo hivyo
  rationale: Kirai hiki kinaonyesha kwamba tendo lilelile lilirudiwa kwenye ukingo wa seti nyingine.
- source_word: הַקִּיצוֹנָה
  choice: la mwisho
  rationale: Kivumishi hiki kinataja pazia lililokuwa kwenye ncha ya seti; “la mwisho” ni cha kawaida na wazi katika Kiswahili.
- source_word: הַשֵּׁנִית
  choice: ya pili
  rationale: Linatambulisha wazi seti ya pili kwa kuitofautisha na ile ya kwanza.
