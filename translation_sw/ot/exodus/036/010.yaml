translation:
  language: sw
  text: Aliunganisha mapazia matano, kila moja na lingine; na mapazia matano mengine[a] akayaunganisha, kila moja na lingine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “na mapazia matano” katika kishazi cha pili; neno “mengine” limeongezwa ili kufafanua kwamba kundi la pili la mapazia matano linakusudiwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר / חִבַּר
  choice: aliunganisha
  rationale: Kitenzi חבר humaanisha kuunganisha au kuweka vitu pamoja. “Aliunganisha” ni Kiswahili cha kawaida na hakibainishi kupita kiasi mbinu ya kuviambatanisha.
- source_word: יְרִיעֹת
  choice: mapazia
  rationale: Katika muktadha wa Maskani, neno hili linarejelea vitambaa vikubwa vya kufunika; “mapazia” ni tafsiri ya kawaida, inayoeleweka, na inayofaa hapa.
- source_word: חֲמֵשׁ
  choice: matano
  rationale: Hii ni tafsiri ya moja kwa moja ya idadi, ikipatana kisarufi na “mapazia”.
- source_word: אַחַת אֶל אֶחָת
  choice: moja na lingine
  rationale: Usemi huu unaonyesha kila pazia likiunganishwa na jingine katika kila kundi. “Moja na lingine” ni wa asili katika Kiswahili na unahifadhi muundo wa Kiebrania.
- source_word: וְחָמֵשׁ יְרִיעֹת
  choice: na mapazia matano
  rationale: Kiebrania kinasema kwa uhalisi “na mapazia matano” bila neno linalomaanisha “mengine.” Tafsiri inahifadhi usemi huo, huku tanbihi ikifafanua kuwa ni kundi la pili.
