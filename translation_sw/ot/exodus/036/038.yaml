translation:
  language: sw
  text: na nguzo zake tano pamoja na kulabu zake; naye akafunika kwa dhahabu vilele vya nguzo hizo na mikanda yake, na vitako vyake vitano vilikuwa vya shaba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: nguzo zake tano
  rationale: עַמּוּד humaanisha nguzo wima; kiambishi cha umoja kimerejelea pazia la mwingilio lililotajwa katika muktadha.
- source_word: וָוֵיהֶם
  choice: kulabu zake
  rationale: Katika maelezo ya Maskani, וָו ni kulabu zilizowekwa kwenye nguzo kwa ajili ya kutundikia pazia.
- source_word: וְצִפָּה
  choice: akafunika ... kwa dhahabu
  rationale: צפה hapa ni kufunika uso wa kitu kwa tabaka la metali; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: רָאשֵׁיהֶם
  choice: vilele vyake
  rationale: Neno hilo ni 'vichwa vyake' kihalisi, lakini katika nguzo humaanisha sehemu zake za juu; 'vilele' linaepuka kubainisha kwamba zilikuwa kapitoli za usanifu.
- source_word: חֲשֻׁקֵיהֶם
  choice: mikanda yake
  rationale: Neno hili adimu linaelekea kumaanisha vipande vya kuzungushia au vya kuunganisha nguzo; 'mikanda' huhifadhi kutobainika kwa umbo lake kamili.
- source_word: אַדְנֵיהֶם
  choice: vitako vyake vitano
  rationale: אֶדֶן ni tako au tundu la msingi lililoshikilia nguzo; 'vitako' ni neno la kawaida katika maelezo ya ujenzi wa Maskani.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Katika Kiswahili cha Biblia, 'shaba' ni tafsiri ya kawaida ya נְחֹשֶׁת katika vyombo na ujenzi wa Maskani, bila kudai kwa uhakika aina kamili ya aloi ya kale.
