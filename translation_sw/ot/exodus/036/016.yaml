  text: Akaunganisha mapazia matano katika kundi moja[a], na mapazia sita katika kundi jingine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kando” au “kwa mafungu tofauti”; maana ni kwamba mapazia matano yaliunganishwa kama kundi moja, na yale sita kama kundi jingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר
  choice: Akaunganisha
  rationale: Kitenzi חָבַר humaanisha kuunganisha au kushikanisha. ‘Akaunganisha’ ni Kiswahili cha kawaida na hakibainishi kupita kiasi mbinu iliyotumiwa.
- source_word: הַיְרִיעֹת
  choice: mapazia
  rationale: Katika muktadha wa Maskani, יְרִיעָה ni vipande vikubwa vya kitambaa vilivyotumika kuunda kifuniko; ‘mapazia’ ni neno linaloeleweka na kufaa katika muktadha huu.
- source_word: לְבָד
  choice: kuwa kundi moja ... kuwa kundi jingine
  rationale: Neno לְבָד linaonyesha kuwa mapazia hayo yaliwekwa katika makundi mawili tofauti. Tafsiri hii ya kimuktadha inaeleza wazi kwamba matano yaliunganishwa pamoja na sita pia yaliunganishwa pamoja, bila kuchanganywa na yale matano.
- source_word: חֲמֵשׁ
  choice: matano
  rationale: Ni idadi ya moja kwa moja, ikipatana kisarufi na ‘mapazia’.
- source_word: שֵׁשׁ
  choice: sita
  rationale: Ni idadi ya moja kwa moja.
- source_word: אֶת ... וְאֶת
  choice: muundo wa yambwa mbili zilizounganishwa kwa ‘na’
  rationale: Viashiria vya yambwa havitafsiriwi moja kwa moja katika Kiswahili; muundo wake umehifadhiwa kwa kutaja makundi yote mawili kwa urari.
