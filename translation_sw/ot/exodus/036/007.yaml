  text: And the material was sufficient for all the work to do it[a], and there was more than enough.
translation:
  language: sw
  text: Vifaa vilitosha kwa kazi yote iliyopaswa kufanywa, na hata vilizidi mahitaji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kulikuwa na vilivyobaki.” Kitenzi cha Kiebrania kinaweza kusisitiza ziada iliyobaki baada ya mahitaji ya kazi kutimizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּלָאכָה
  choice: Vifaa
  rationale: Ingawa מְלָאכָה kwa kawaida humaanisha kazi, hapa muktadha wa vitu vilivyoletwa kwa ajili ya ujenzi unaelekeza kwenye vifaa; Kiswahili ‘vifaa’ hutaja rejeo hilo kwa kawaida.
- source_word: הָיְתָה דַיָּם
  choice: vilitosha
  rationale: דַּי hueleza utoshelevu, na kiambishi chake kinarejelea vifaa vilivyoletwa; ‘vilitosha’ ni usemi wa kawaida na wazi.
- source_word: לְכָל הַמְּלָאכָה
  choice: kwa kazi yote
  rationale: Katika matumizi haya ya pili, מְלָאכָה ni kazi nzima iliyotakiwa kufanywa.
- source_word: לַעֲשׂוֹת אֹתָהּ
  choice: iliyopaswa kufanywa
  rationale: Huwasilisha kusudi la vifaa kwa Kiswahili cha kawaida bila kurudia kwa namna nzito ‘kuifanya kazi hiyo.’
- source_word: וְהוֹתֵר
  choice: navyo vilibaki hata ziada
  rationale: Hiphil ya יתר huonyesha kwamba kulikuwa na kilichozidi au kubaki baada ya mahitaji kutimizwa; tafsiri hii inahifadhi wazo la ziada iliyobaki.
