  yaml_path: translation/ot/exodus/036/027.yaml
  text: And for the rear of the tabernacle[a], westward, he made six frames.
translation:
  language: sw
  text: Kwa sehemu ya nyuma ya Maskani[a], upande wa magharibi, alitengeneza viunzi sita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbao.” Neno la Kiebrania linaweza kumaanisha mbao au viunzi vya jengo; “viunzi” limetumiwa hapa kwa sababu huenda linaonyesha vizuri zaidi muundo wa Maskani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: Kwa sehemu ya nyuma ya
  rationale: Kirai hiki kinaonyesha sehemu ya mwisho au ya nyuma ya jengo. Kiswahili cha kawaida hutumia umoja ‘sehemu ya nyuma’ kwa maana hii ya usanifu; kiunganishi cha Kiebrania hakihitaji kutafsiriwa kwa ‘na’ hapa ili sentensi iwe ya asili.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: ‘Maskani’ ni istilahi iliyozoeleka katika Kiswahili cha Biblia kwa jengo takatifu linaloelezwa katika Kutoka, na hapa imeandikwa kwa herufi kubwa kama jina la jengo hilo mahususi.
- source_word: יָמָּה
  choice: upande wa magharibi
  rationale: Neno hilo lina maana halisi ya kuelekea baharini, lakini katika mwelekeo wa Kiebrania linamaanisha magharibi. ‘Upande wa magharibi’ ni wazi na wa kawaida katika maelezo ya jengo.
- source_word: עָשָׂה
  choice: alitengeneza
  rationale: Kitenzi עשה ni ‘kufanya/kutengeneza.’ ‘Alitengeneza’ kinafaa kwa utengenezaji wa sehemu za jengo na kinadumisha mtindo rahisi wa simulizi.
- source_word: שִׁשָּׁה
  choice: sita
  rationale: Ni tafsiri ya moja kwa moja ya idadi hiyo.
- source_word: קְרָשִׁים
  choice: viunzi
  rationale: Neno hili linataja vipande vya wima vya muundo wa Maskani. ‘Viunzi’ linaonyesha kazi yake ya kimuundo bila kulazimisha picha ya mbao bapa tu; maana mbadala ya ‘mbao’ imehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umewekwa wa asili kwa Kiswahili huku mwelekeo wa magharibi na utata wa neno la vipande vya kimuundo vikihifadhiwa.
