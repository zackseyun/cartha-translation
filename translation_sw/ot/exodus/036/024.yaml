base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/024.yaml
  text: And he made forty silver bases under the twenty frames, two bases under the one frame for its two tenons, and two bases under the other frame for its two tenons.
translation:
  language: sw
  text: 'Naye akatengeneza vitako arobaini vya fedha chini ya zile fremu ishirini: vitako viwili chini ya fremu moja kwa ajili ya ndimi zake mbili, na vitako viwili chini ya fremu nyingine kwa ajili ya ndimi zake mbili.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: vitako vya fedha
  rationale: Neno אַדְנֵי hapa linamaanisha sehemu za msingi zenye matundu zilizowekwa chini ya fremu; “vitako” ni neno la kawaida na linalofaa katika muktadha huu wa ujenzi.
- source_word: הַקְּרָשִׁים
  choice: fremu
  rationale: Katika maelezo ya Maskani, קְרָשִׁים ni vipande vya muundo vilivyosimama; “fremu” linaeleza kazi yake kwa Kiswahili cha sasa bila kulazimisha maana nyembamba ya mbao tambarare.
- source_word: יְדֹתָיו
  choice: ndimi zake
  rationale: Neno יָדוֹת kwa maana halisi ni “mikono,” lakini hapa ni vip突出 vya kuunganisha vilivyoingia katika vitako; “ndimi” ni istilahi inayoeleweka kwa umbo na kazi yake.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: fremu moja ... fremu nyingine
  rationale: Ingawa Kiebrania kinarudia “moja,” Kiswahili cha kawaida hutofautisha kwa uwazi fremu ya kwanza na inayofuata bila kubadili idadi au mpangilio.
theological_decisions: []
