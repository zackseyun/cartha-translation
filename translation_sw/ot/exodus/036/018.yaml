  text: Akatengeneza vifungo hamsini vya shaba ili kulifanya hema[a] liwe kitu kimoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maskani,” kwa kuwa hapa “hema” linarejelea muundo wa maskani.
