lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Wayyiqtol ya עשה inaendeleza simulizi kwa tendo la wakati uliopita; “akatengeneza” ni ya kawaida na inaonyesha utengenezaji wa vifaa.
- source_word: קַרְסֵי
  choice: vifungo
  rationale: Neno hili linamaanisha vifaa vya kuunganisha sehemu za mapazia; “vifungo” ni wazi na la sasa kuliko istilahi nadra au “kulabu,” ambayo inaweza kudokeza umbo lisilothibitishwa.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Katika Kiswahili cha kawaida, “shaba” ndilo neno linalotumiwa kwa metali hii katika muktadha wa vifaa vya hema; linaweza kurejelea shaba au aloi yake kulingana na matumizi ya kale.
- source_word: חֲמִשִּׁים
  choice: hamsini
  rationale: Ni tafsiri ya moja kwa moja ya idadi.
- source_word: לְחַבֵּר
  choice: ili kuunganisha
  rationale: Infinitivu yenye לְ inaonyesha kusudi; “ili kuunganisha” ni ya asili na sahihi.
- source_word: אֶת הָאֹהֶל
  choice: hema
  rationale: אֹהֶל maana yake ya msingi ni “hema”; katika muktadha huu ni hema la kukutania, yaani maskani.
- source_word: לִהְיוֹת אֶחָד
  choice: liwe kitu kimoja
  rationale: Kauli hii inaonyesha matokeo au kusudi la kuunganisha sehemu zake kuwa jumla moja; upatanisho wa “liwe” unafuata nomino “hema” katika Kiswahili.
