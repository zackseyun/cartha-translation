  yaml_path: translation/ot/exodus/036/023.yaml
  text: 'He made the frames for the tabernacle: twenty frames for the south side[a], toward the south.'
translation:
  language: sw
  text: 'Akavitengeneza viunzi vya Maskani: viunzi ishirini kwa upande wa kusini[a], kuelekea kusini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbao ishirini kwa upande wa kusini.” Kiebrania kinatumia usemi uliorudiwa kuhusu kusini (“kusini, kuelekea kusini”) ili kusisitiza au kubainisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akavitengeneza
  rationale: Kitenzi cha masimulizi kinaonyesha tendo lililofuatana na yaliyotangulia; ‘akavitengeneza’ ni cha asili katika Kiswahili na kiambishi ‘-vi-’ kinarejelea viunzi.
- source_word: הַקְּרָשִׁים
  choice: viunzi
  rationale: Katika ujenzi wa Maskani, neno hili linarejelea sehemu wima za muundo. ‘Viunzi’ linaonyesha kazi yake ya kimuundo; ‘mbao’ limehifadhiwa kama tafsiri mbadala katika tanbihi.
- source_word: לַמִּשְׁכָּן
  choice: vya Maskani
  rationale: ‘Maskani’ ni istilahi iliyozoeleka katika Kiswahili kwa jengo takatifu linaloelezwa katika Kutoka.
- source_word: עֶשְׂרִים קְרָשִׁים
  choice: viunzi ishirini
  rationale: Tafsiri hii inadumisha idadi na kurudiwa kwa nomino kama ilivyo katika mtindo wa orodha wa Kiebrania.
- source_word: לִפְאַת
  choice: kwa upande
  rationale: Katika muktadha huu wa ujenzi, פֵּאָה linamaanisha upande wa jengo.
- source_word: נֶגֶב
  choice: kusini
  rationale: Hapa neno hilo linatumika kama mwelekeo, si kama jina maalumu la eneo la Negebu.
- source_word: תֵּימָנָה
  choice: kuelekea kusini
  rationale: Kirai hiki kinahifadhi msisitizo au ubainishaji wa pili wa mwelekeo wa kusini bila kuufuta uradidi wa Kiebrania.
