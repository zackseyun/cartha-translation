  text: And he made the boards for the tabernacle of acacia wood[a], standing upright.
translation:
  language: sw
  text: Naye akazitengeneza mbao za Maskani kwa mti wa mshita, zikiwa zimesimama wima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbao za Maskani, za mti wa mshita, zilizosimama.”
    reason: Mpangilio wa maneno ya Kiebrania unaweza kuruhusu “za mti wa mshita” na “zilizosimama” kueleweka kama maelezo yanayofuata moja kwa moja “mbao.”
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Naye akazitengeneza
  rationale: Kitenzi cha wayyiqtol kinaendeleza simulizi kwa tendo lililopita; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili, huku kiambishi -zi- kikirejelea mbao.
- source_word: הַקְּרָשִׁים
  choice: mbao
  rationale: Katika muktadha wa Maskani, neno hili humaanisha mbao au paneli za muundo. “Mbao” ni neno la kawaida na linaloeleweka, bila kulazimisha kwa undani kama zilikuwa fremu au mapande mazito.
- source_word: לַמִּשְׁכָּן
  choice: za Maskani
  rationale: Ingawa kihusishi cha Kiebrania kwa msingi ni “kwa ajili ya,” Kiswahili cha kawaida hutaja kwa urahisi sehemu hizi kama “mbao za Maskani.” “Maskani” linadumisha istilahi ya makao matakatifu katika kitabu cha Kutoka.
- source_word: עֲצֵי שִׁטִּים
  choice: kwa miti ya mshita
  rationale: Kirai cha Kiebrania kinataja nyenzo ya mshita. “Kwa miti ya mshita” ni Kiswahili cha asili kinachoonyesha kwamba mbao zilitengenezwa kutokana na miti hiyo.
- source_word: עֹמְדִים
  choice: zikiwa zimesimama wima
  rationale: Kivumishi-shirikishi kinaeleza mkao wa mbao. “Zimesimama wima” huwasilisha wazi maana ya usanifu bila kuongeza taarifa nyingine.
