translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini kinachoeleweka kwa urahisi. “Kisitiri” limetumiwa kama istilahi ya kitambaa cha mwingilioni, huku mbadala wa kawaida zaidi “pazia” ukielezwa katika tanbihi.
