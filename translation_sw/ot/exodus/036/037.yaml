base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/037.yaml
  text: And he made a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: sw
  text: Akafanya pazia[a] la mlango wa hema kwa nyuzi za buluu, zambarau, nyekundu ya skarlati, na kitani safi kilichosokotwa—kazi ya mtarizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kisitiri.” Neno la Kiebrania linamaanisha kitambaa kinachoning’inizwa kwenye mlango au mwingilio, tofauti na pazia la ndani (פָּרֹכֶת).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akafanya
  rationale: Waw-consecutive inaendeleza simulizi; “Akafanya” ni ya asili katika Kiswahili na inadumisha mfuatano wa matendo.
- source_word: מָסָךְ
  choice: kisitiri
  rationale: Neno hili linamaanisha kitambaa cha kuning’inizwa kwenye mwingilio. “Kisitiri” kinadumisha kazi yake ya kufunika au kuzuia mwonekano na kusaidia kukitofautisha na pazia la ndani (פָּרֹכֶת).
- source_word: לְפֶתַח הָאֹהֶל
  choice: cha mwingilio wa hema
  rationale: “Mwingilio” huonyesha uwazi wa kuingilia, na “hema” hutafsiri nomino ya kawaida אֹהֶל bila kuipanua kuwa “Maskani.”
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: nyuzi za buluu, zambarau na nyekundu
  rationale: Maneno haya yanataja vifaa vya nguo vilivyotiwa rangi. Kutaja “nyuzi” kwa pamoja kunafanya maana ya kimuktadha iwe wazi bila kurudia neno hilo kwa kila rangi.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: pamoja na kitani safi kilichosokotwa
  rationale: “Kitani safi” huonyesha ubora wa שֵׁשׁ, na “kilichosokotwa” huhifadhi maelezo ya מָשְׁזָר kuhusu utengenezaji wake.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: ilikuwa kazi ya mtarizi
  rationale: Kauli hii huhifadhi wazo la ufundi maalumu wa kutarizi na kuwasilisha kwa Kiswahili cha kawaida muundo wa Kiebrania unaomaanisha kazi ya fundi huyo.
