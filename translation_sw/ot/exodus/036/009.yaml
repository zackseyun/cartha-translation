  text: The length of each curtain was twenty-eight cubits[a], and the width of each curtain was four cubits[b]; all the curtains had one measurement.
translation:
  language: sw
  text: Kila pazia lilikuwa na urefu wa dhiraa ishirini na nane[a] na upana wa dhiraa nne; mapazia yote yalikuwa na kipimo kilekile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
