lexical_decisions:
- source_word: אֹרֶךְ
  choice: urefu
  rationale: Nomino ya kawaida ya Kiswahili kwa kipimo cha upande mrefu wa kitu.
- source_word: יְרִיעָה
  choice: pazia
  rationale: Katika muktadha wa Maskani, neno hili linamaanisha kipande kikubwa cha kitambaa; “pazia” ni neno la kawaida na linaloeleweka.
- source_word: הָאַחַת / הָאֶחָת
  choice: kila
  rationale: Ingawa kihalisi ni “moja,” hapa limetumiwa kwa maana ya kugawa, yaani vipimo vya kila pazia.
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: ishirini na nane
  rationale: Mpangilio wa kawaida wa namba katika Kiswahili cha sasa.
- source_word: אַמָּה
  choice: dhiraa
  rationale: Huhifadhi kipimo cha kale badala ya kukibadili moja kwa moja kuwa kipimo cha kisasa.
- source_word: רֹחַב
  choice: upana
  rationale: Neno la kawaida la kipimo kinacholingana na urefu.
- source_word: אַרְבַּע
  choice: nne
  rationale: Tafsiri ya moja kwa moja ya namba hiyo, ikipatana kisarufi na “dhiraa.”
- source_word: מִדָּה אַחַת
  choice: vipimo sawa
  rationale: Kihalisi ni “kipimo kimoja”; katika muktadha unaotaja urefu na upana, “vipimo sawa” huwasilisha kwa Kiswahili cha kawaida kwamba mapazia yote yalikuwa na ukubwa uleule.
- source_word: לְכָל הַיְרִיעֹת
  choice: mapazia yote
  rationale: Huwasilisha kwa kawaida wigo unaojumuisha kila pazia.
