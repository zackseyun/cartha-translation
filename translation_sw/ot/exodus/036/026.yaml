  text: 'na vitako vyake arobaini vya fedha: vitako viwili chini ya ubao mmoja[a], na vitako viwili chini ya ubao mmoja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitako viwili chini ya fremu moja, na vitako viwili chini ya fremu moja.” Kiebrania hurudia “ubao/fremu mmoja” katika vifungu vyote viwili; tafsiri nyingine husema “ubao mwingine” katika kifungu cha pili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: na ... arobaini
  rationale: Kiunganishi kinaendeleza orodha ya ujenzi, na idadi imetafsiriwa moja kwa moja.
- source_word: אַדְנֵי/הֶם
  choice: tako zake
  rationale: Katika ujenzi wa Maskani, neno hili linamaanisha tako lenye tundu linalotegemeza ubao; “tako” ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: כָּסֶף
  choice: za fedha
  rationale: Nomino hii inaonyesha nyenzo zilizotumiwa kutengeneza tako.
- source_word: שְׁנֵי אֲדָנִים
  choice: tako mbili
  rationale: Kauli imetafsiriwa kwa uthabiti kulingana na matumizi ya awali ya אֲדָנִים.
- source_word: תַּחַת
  choice: chini ya
  rationale: Kihusishi kinaonyesha mahali pa tako hizo kuhusiana na ubao.
- source_word: הַ/קֶּרֶשׁ
  choice: ubao
  rationale: קֶרֶשׁ ni sehemu wima ya kimuundo ya Maskani; “ubao” ni tafsiri ya kawaida na wazi, bila kudokeza muundo mpana ambao huenda haukusudiwi.
- source_word: הָ/אֶחָד
  choice: mmoja
  rationale: Kiebrania hurudia kihalisi “ule mmoja” katika vifungu vyote viwili. Kiswahili cha kawaida kinaweza kusema “ubao mmoja” huku marudio yakihifadhiwa.
