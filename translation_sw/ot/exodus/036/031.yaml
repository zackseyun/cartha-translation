translation:
  language: sw
  text: Akatengeneza makomeo matano ya mti wa mshita kwa ajili ya mbao za upande mmoja wa Maskani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fremu” badala ya “mbao”; hizi ni sehemu za ujenzi zilizosimama wima katika Maskani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Kitenzi hiki kinaendeleza mfululizo wa matendo katika simulizi; “akatengeneza” ni Kiswahili cha kawaida na kinaonyesha tendo linalofuata.
- source_word: בְּרִיחֵי
  choice: mataruma
  rationale: Katika ujenzi wa Maskani, neno hili linamaanisha vipande virefu vya mlalo vilivyoshikilia mbao wima pamoja; “mataruma” linaonyesha kazi hiyo ya kimuundo.
- source_word: עֲצֵי שִׁטִּים
  choice: ya mti wa mshita
  rationale: Huu ni mti unaotajwa kama nyenzo ya ujenzi; “mti wa mshita” ni istilahi iliyozoeleka katika Kiswahili cha Biblia.
- source_word: חֲמִשָּׁה
  choice: matano
  rationale: Ni idadi ya kawaida inayopatana kisarufi na nomino “mataruma.”
- source_word: לְקַרְשֵׁי
  choice: kwa ajili ya mbao za
  rationale: Neno la Kiebrania linataja vipande vya ujenzi vilivyosimama wima. “Mbao” ni neno wazi na la kawaida, huku “fremu” likibaki tafsiri mbadala inayowezekana.
- source_word: צֶלַע
  choice: upande
  rationale: Katika muktadha wa jengo, maana ni upande wa muundo, si ubavu wa mwili.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi ya Kiswahili iliyozoeleka kwa hema takatifu la kukutania katika kitabu cha Kutoka.
- source_word: הָאֶחָת
  choice: mmoja
  rationale: Kivumishi hiki kinabainisha upande mmoja wa Maskani bila kuufanya lazima kuwa upande wa kwanza.
