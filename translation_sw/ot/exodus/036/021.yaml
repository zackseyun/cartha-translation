  text: The length of each frame was ten cubits[a], and the width of each frame was a cubit and a half.
translation:
  language: sw
  text: Urefu wa kila ubao[a] ulikuwa dhiraa kumi, na upana wa kila ubao ulikuwa dhiraa moja na nusu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “boriti”; neno la Kiebrania קֶרֶשׁ linataja vipande vya mbao vilivyounda muundo wa maskani.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶשֶׂר אַמֹּת
  choice: dhiraa kumi
  rationale: Kirai hiki hutaja kipimo moja kwa moja. ‘Dhiraa’ huhifadhi kipimo cha kale bila kukibadili kuwa kipimo cha kisasa.
- source_word: אֹרֶךְ
  choice: urefu
  rationale: Nomino hii hutaja ukubwa wa kitu kutoka upande mmoja hadi mwingine kwa urefu; ‘urefu’ ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: הַקָּרֶשׁ
  choice: ubao
  rationale: Katika muktadha wa maskani, neno hili hutaja vipande vya mbao vya kujengea muundo. ‘Ubao’ ni wazi na wa kawaida, huku uwezekano wa ‘boriti’ ukibainishwa katika tanbihi.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: dhiraa moja na nusu
  rationale: Hii huwasilisha kwa Kiswahili cha kawaida nahau ya Kiebrania yenye maana ya dhiraa moja na nusu.
- source_word: רֹחַב
  choice: upana
  rationale: ‘Upana’ ni neno la kawaida la Kiswahili kwa ukubwa wa kitu kutoka upande mmoja hadi mwingine kwa mapana.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: kila ubao
  rationale: Kihalisi ni ‘ubao mmoja,’ lakini katika muktadha huu wa vipimo maana yake ni ya kugawa kwa kila kipande; ‘kila ubao’ huwasilisha maana hiyo kwa kawaida bila kudokeza mpangilio.
