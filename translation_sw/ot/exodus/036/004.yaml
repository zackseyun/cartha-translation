  text: Then all the skilled men who were doing all the work of the sanctuary came[a], each from the work that he was doing,
translation:
  language: sw
  text: Ndipo watu wote wenye ustadi waliokuwa wakifanya kazi yote ya mahali patakatifu wakaja, kila mmoja kutoka katika kazi aliyokuwa akiifanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: wakaja
  rationale: Wayyiqtol ya בוא inaendeleza simulizi kwa tukio linalofuata; “wakaja” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: כָּל הַחֲכָמִים
  choice: watu wote wenye ustadi
  rationale: Katika muktadha huu חֲכָמִים ni watu waliopewa ujuzi wa kazi ya kujenga maskani, si wenye hekima ya kiakili tu. “Watu wenye ustadi” huwasilisha maana hiyo kwa lugha ya sasa bila kuwabana kuwa mafundi wa aina moja.
- source_word: הָעֹשִׂים
  choice: waliokuwa wakifanya
  rationale: Kivumishi-tendo cha Kiebrania kinaonyesha shughuli iliyokuwa ikiendelea; muundo huu wa Kiswahili huhifadhi hali hiyo.
- source_word: אֵת כָּל מְלֶאכֶת הַקֹּדֶשׁ
  choice: kazi yote ya mahali patakatifu
  rationale: מְלֶאכֶת humaanisha kazi au shughuli ya ufundi, nayo הַקֹּדֶשׁ hapa inarejelea mahali patakatifu katika muktadha wa maskani. Tafsiri hii ni wazi na inaacha neno la muktadha liseme bila kuongeza ufafanuzi usiotajwa.
- source_word: אִישׁ אִישׁ
  choice: kila mmoja
  rationale: Urudiaji huu ni usemi wa ugawaji unaomaanisha kila mtu mmoja mmoja. “Kila mmoja” ni wa asili katika Kiswahili na huhifadhi nguvu hiyo.
- source_word: מִמְּלַאכְתּוֹ
  choice: kutoka katika kazi
  rationale: Kihusishi מן kinaonyesha kuondoka walikokuwa wakifanya kazi; kishazi kinachofuata kinafafanua kwamba kazi hiyo ilikuwa ya kila mmoja.
- source_word: אֲשֶׁר הֵמָּה עֹשִׂים
  choice: aliyokuwa akiifanya
  rationale: Ingawa הֵמָּה ni wingi, אִישׁ אִישׁ ina maana ya ugawaji. Umoja wa Kiswahili baada ya “kila mmoja” unaonyesha kwa kawaida kwamba kila mtu aliacha kazi yake mwenyewe.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha mwendelezo wa simulizi, hali endelevu ya kazi, na maana ya ugawaji ya אִישׁ אִישׁ. Hakuna tanbihi iliyohitajika kwa sababu muundo wa Kiebrania unawakilishwa kwa uwazi na “kila mmoja ... aliyokuwa akiifanya.”
