  text: וַ/יְצַ֣ו מֹשֶׁ֗ה וַ/יַּעֲבִ֨ירוּ ק֥וֹל בַּֽ/מַּחֲנֶה֮ לֵ/אמֹר֒ אִ֣ישׁ וְ/אִשָּׁ֗ה אַל יַעֲשׂוּ ע֛וֹד מְלָאכָ֖ה לִ/תְרוּמַ֣ת הַ/קֹּ֑דֶשׁ וַ/יִּכָּלֵ֥א הָ/עָ֖ם מֵ/הָבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/006.yaml
  text: So Moses commanded[a], and they sent a proclamation through the camp, saying[b], “Let neither man nor woman do any more work for the contribution of the sanctuary.” So the people were restrained from bringing more.
translation:
  language: sw
  text: Basi Musa akaamuru, nao wakaeneza tangazo kambini[a], wakisema, “Mwanamume wala mwanamke asifanye tena kazi kwa ajili ya mchango wa mahali patakatifu[b].” Hivyo watu wakazuiwa kuleta zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wakaipitisha sauti”; yaani, walifanya tangazo lisambazwe kambini.
    reason: lexical_alternative
  - marker: b
    text: Pia inaweza kutafsiriwa “mchango mtakatifu” au “sadaka kwa ajili ya mahali patakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: akaamuru
  rationale: Kitenzi צוה kinaonyesha agizo lenye mamlaka; “akaamuru” kinahifadhi uzito huo katika masimulizi.
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: wakaeneza tangazo
  rationale: Nahau hii, kihalisi “wakaipitisha sauti,” inaeleza kusambazwa kwa tangazo la hadharani. “Wakaeneza tangazo” ni ya asili kwa Kiswahili na inadumisha wazo la tangazo kupitishwa miongoni mwa watu.
- source_word: בַּמַּחֲנֶה
  choice: kambini
  rationale: Kiambishi ב־ kwa kawaida humaanisha “katika”; pamoja na “wakaeneza tangazo,” “kambini” linaeleza kwa kawaida eneo lote ambamo tangazo lilisambazwa.
- source_word: אִישׁ וְאִשָּׁה
  choice: mwanamume wala mwanamke yeyote
  rationale: Muundo huu unawataja wazi wanaume na wanawake; “wala ... yeyote” unaendana na katazo na kuwasilisha maana ya kutomhusisha mtu wa aina yoyote.
- source_word: אַל יַעֲשׂוּ עוֹד מְלָאכָה
  choice: asifanye tena kazi
  rationale: מלאכה inaweza kumaanisha kazi au ufundi. Tafsiri hii ni pana vya kutosha kujumuisha utengenezaji wa vitu na maandalizi mengine ya mchango.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: kwa ajili ya mchango wa mahali patakatifu
  rationale: תרומה ni mchango uliotengwa, na הקֹדשׁ katika muktadha huu inaweza kuelekeza kwenye mahali patakatifu. Tafsiri hii inadumisha uhusiano kati ya kazi na mchango wa patakatifu bila kuubana kupita kiasi.
- source_word: וַיִּכָּלֵא
  choice: wakazuiwa
  rationale: Niphal ya כלא ina maana ya kuzuiwa au kukomeshwa. “Wakazuiwa” huhifadhi hali tendwa bila kudokeza kwamba watu hawakuwa tayari kutoa.
- source_word: מֵהָבִיא
  choice: kuleta zaidi
  rationale: מן pamoja na kitenzi-jina huonyesha kuzuiwa kufanya jambo; “zaidi” linaweka wazi kutokana na muktadha kwamba walipaswa kuacha kuleta michango mingine.
theological_decisions:
- issue: Maana ya לִתְרוּמַת הַקֹּדֶשׁ
  choice: mchango wa mahali patakatifu
  alternative: mchango mtakatifu; sadaka kwa ajili ya mahali patakatifu
  rationale: Muundo wa Kiebrania unaweza kueleweka kwa zaidi ya namna moja. Matini kuu inafuata uhusiano wa kimuktadha na patakatifu, huku tanbihi ikihifadhi uwezekano wa kuelewa mchango wenyewe kuwa mtakatifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Wakaeneza tangazo” ni usemi wa kawaida unaohifadhi dhana ya Kiebrania ya tangazo kusambazwa. Muundo “mwanamume wala mwanamke yeyote” ni wa asili katika katazo na unadumisha utajaji wa jinsia zote.
