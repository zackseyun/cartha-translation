  text: 'There were eight frames[a], with their silver bases, sixteen bases: two bases under one frame[b], and two bases under each frame.'
translation:
  language: sw
  text: 'Mbao zilikuwa nane[a], na vitako vyake vya fedha vilikuwa kumi na sita[b]: vitako viwili chini ya kila ubao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viunzi”; neno la Kiebrania linataja vipande vya wima vya muundo wa maskani.
    reason: lexical_alternative
  - marker: b
    text: Au “soketi” badala ya “vitako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Kulikuwa na
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kuwepo katika orodha ya maelezo; kiunganishi cha Kiebrania kinaingizwa kwa mtiririko wa sentensi.
- source_word: קְרָשִׁים / הַקֶּרֶשׁ
  choice: viunzi / kiunzi
  rationale: Neno la Kiebrania humaanisha vipande vya wima vya muundo wa maskani. “Viunzi” huonyesha kazi yake ya kimuundo, huku “mbao” likibaki chaguo halali la kileksika.
- source_word: אַדְנֵיהֶם / אֲדָנִים
  choice: vishikio
  rationale: Katika ujenzi wa maskani, neno hili hutaja sehemu za fedha zilizoshikilia na kutegemeza viunzi. “Vishikio” ni wazi katika Kiswahili cha sasa; “vitako” ni chaguo la karibu zaidi na maana ya msingi au soketi.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Ni jina la moja kwa moja la nyenzo iliyotumiwa kutengeneza vishikio.
- source_word: שִׁשָּׁה עָשָׂר
  choice: kumi na sita
  rationale: Ni tafsiri ya kawaida ya idadi hiyo.
- source_word: שְׁנֵי אֲדָנִים שְׁנֵי אֲדָנִים
  choice: vishikio viwili viwili
  rationale: 'Marudio ya Kiebrania yana nguvu ya ugawaji: kila kiunzi kilikuwa na vishikio viwili. Kiswahili hutumia kwa kawaida muundo wa kurudia idadi, “viwili viwili,” kuwasilisha maana hiyo.'
- source_word: תַּחַת
  choice: chini ya
  rationale: Ni tafsiri ya kawaida ya uhusiano wa mahali katika maelezo haya ya ujenzi.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: kila kiunzi
  rationale: Umoja wenye kibainishi na namba umetumiwa kwa maana ya ugawaji katika muktadha huu; “kila kiunzi” huwasilisha wazi maana hiyo bila kudokeza kwamba kiunzi kimoja tu kinahusika.
