base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/032.yaml
  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the tabernacle at the far rear on the west.
translation:
  language: sw
  text: na makomeo matano kwa mbao za upande wa pili wa Maskani, na makomeo matano kwa mbao za Maskani upande wa nyuma kabisa, kuelekea magharibi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְרִיחִם
  choice: mataruma
  rationale: Katika ujenzi wa Maskani, neno hili linamaanisha vipande virefu vya mlalo vilivyoshikilia mbao pamoja; “mataruma” ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: קַרְשֵׁי
  choice: mbao
  rationale: Neno hili linataja vipande vya mbao vya kimuundo vya Maskani. “Mbao” ni la kawaida na halilazimishi tafsiri ya usanifu kuwa fremu au mbao pana.
- source_word: צֶלַע הַמִּשְׁכָּן הַשֵּׁנִית
  choice: upande wa pili wa Maskani
  rationale: Tafsiri hii inahifadhi maana ya msingi ya צֶלַע, “upande,” na הַשֵּׁנִית, “wa pili,” huku ikiwa ya asili katika Kiswahili.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi fupi na yenye hadhi kwa jengo takatifu linalotajwa katika Kutoka, na pia huhifadhi uhusiano wa neno la Kiebrania na wazo la kukaa.
- source_word: לַיַּרְכָתַיִם
  choice: upande wake wa nyuma kabisa
  rationale: יַרְכָתַיִם huonyesha sehemu ya nyuma au ya mbali kabisa; “nyuma kabisa” huhifadhi nguvu hiyo ya kimaeneo kuliko kusema “nyuma” pekee.
- source_word: יָמָּה
  choice: magharibi
  rationale: Katika muktadha wa mwelekeo wa jengo, neno hili linamaanisha upande wa magharibi, ingawa kiasili linahusiana na upande wa bahari.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: na ... matano ... na ... matano
  rationale: Kurudiwa kwa kiunganishi na idadi kunahifadhi mtindo wa orodha wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha na urudiaji wa kifungu cha Kiebrania umehifadhiwa bila kufanya sentensi kuwa nzito. Hakuna tanbihi iliyohitajika; chaguo la “nyuma kabisa, magharibi” linaweka wazi maana ya maneno mawili tofauti ya chanzo bila kuyachanganya.
