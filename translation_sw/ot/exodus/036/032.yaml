    issue: ‘mataruma’ for בְּרִיחִים
    rationale: This term is not as standard or readily recognizable in this biblical construction context as ‘makomeo’; it risks suggesting a different kind of building timber rather than the bars that bind the boards.
  - severity: low
    issue: Awkward rear/west locative wording
    rationale: ‘upande wake wa nyuma kabisa, magharibi’ is less natural than a phrase that directly attaches both spatial qualifications to the tabernacle’s boards.
