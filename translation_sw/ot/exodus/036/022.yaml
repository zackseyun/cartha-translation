base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/022.yaml
  text: Two tenons for each board[a], joined one to another[b]; thus he made all the boards of the tabernacle.
translation:
  language: sw
  text: Ndimi mbili kwa kila ubao[a], zikiwa zimeunganishwa moja na nyingine[b]; ndivyo alivyotengeneza mbao zote za Maskani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mikono miwili”; hapa neno “mikono” limetumiwa kwa njia ya mfano kumaanisha ndimi, yaani sehemu zinazochomoza kwenye kila ubao ili kuunda maungio.'
    reason: lexical_alternative
  - marker: b
    text: Au “moja ikielekeana na nyingine,” ikikazia kwamba ndimi hizo mbili zilipangwa kwa ulinganifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי יָדֹת
  choice: ndimi mbili
  rationale: Ingawa יָדֹת kwa kawaida humaanisha ‘mikono,’ hapa ni istilahi ya ujenzi kwa sehemu mbili zinazochomoza kwenye kila ubao ili ziunganishwe na sehemu nyingine. ‘Ndimi’ ni neno la kawaida katika maungio ya mbao na linaeleweka kuliko istilahi ya kigeni.
- source_word: קֶּרֶשׁ
  choice: ubao
  rationale: Neno hili linataja kila kipande cha mbao kilichokuwa sehemu ya muundo wa Maskani; ‘ubao’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: מְשֻׁלָּבֹת
  choice: zikiwa zimeunganishwa
  rationale: Kauli hii inaonyesha kuwa ndimi hizo zilipangwa kwa uhusiano unaolingana. Tafsiri hii inaweka wazi hali ya maungio bila kudai kwa uhakika namna yake ya kijiometria.
- source_word: אַחַת אֶל אֶחָת
  choice: moja na nyingine
  rationale: Msemo huu unaonyesha ulinganifu wa ndimi hizo mbili. ‘Moja na nyingine’ huhifadhi uhusiano huo huku tanbihi ikitaja uwezekano wa maana ya kuelekeana.
- source_word: כֵּן עָשָׂה
  choice: ndivyo alivyotengeneza
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kwamba alitumia utaratibu huohuo kwa mbao zote.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: ‘Maskani’ ni istilahi iliyozoeleka katika Kiswahili cha Biblia kwa hema takatifu la Israeli, na hapa imeandikwa kwa herufi kubwa kama jina la jengo hilo maalumu.
