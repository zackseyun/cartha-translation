  text: He overlaid the frames with gold[a], and made their rings of gold as holders for the bars[b], and overlaid the bars with gold.
translation:
  language: sw
  text: Akazifunika mbao kwa dhahabu[a], akatengeneza pete zake za dhahabu ziwe vishikio vya makomeo[b], naye akayafunika makomeo kwa dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fremu.” Neno la Kiebrania linamaanisha mbao zilizosimama zilizounda muundo wa maskani.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “nyumba za makomeo,” yaani sehemu za kupokea au kushikilia makomeo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: fremu
  rationale: Katika muktadha wa maskani, neno hili linataja sehemu za mbao zilizosimama na kuunda muundo wake. “Fremu” linaeleza kazi yake ya kimuundo; “mbao” pia linawezekana na limewekwa katika tanbihi.
- source_word: צִפָּה / וַיְצַף
  choice: alizifunika / akayafunika
  rationale: Kitenzi kinamaanisha kuweka tabaka la nyenzo juu ya kitu. “Kufunika kwa dhahabu” ni Kiswahili cha kawaida na wazi kwa matukio yote mawili.
- source_word: זָהָב
  choice: dhahabu
  rationale: Ni jina la moja kwa moja la nyenzo; limerudiwa mara tatu kama lilivyo katika Kiebrania ili kuhifadhi msisitizo wa matini.
- source_word: טַבְּעֹתָם
  choice: pete zake
  rationale: טַבַּעַת humaanisha pete; kiambishi cha nafsi ya tatu wingi kinarejelea fremu, na Kiswahili hutumia “zake” kupatana na nomino hiyo.
- source_word: עָשָׂה
  choice: akatengeneza
  rationale: Kitenzi cha kawaida cha kufanya au kutengeneza; hapa “akatengeneza” kinaeleza wazi utengenezaji wa pete.
- source_word: בָּתִּים
  choice: vishikio
  rationale: Maana ya neno kwa neno ni “nyumba,” lakini hapa ni siti au sehemu za kupokea na kushikilia mataruma. “Vishikio” huwasilisha kazi hiyo kwa Kiswahili cha kawaida.
- source_word: לַבְּרִיחִם
  choice: vya mataruma
  rationale: בְּרִיחִים ni mataruma ya mlalo yaliyotumika kuunganisha sehemu za muundo wa maskani. “Mataruma” ni neno mahususi na linaloeleweka katika muktadha wa ujenzi.
