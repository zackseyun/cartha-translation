base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/029.yaml
  text: They were paired at the bottom[a], and together they were complete up to its top, to the one ring. Thus he did for both of them[c][b], for the two corners.
translation:
  language: sw
  text: Zilikuwa zimeoana kutoka chini[a], na pamoja zilikuwa kamili[b] hadi juu yake, kufikia pete ile moja. Ndivyo alivyowafanyia zote mbili, kwa pembe hizo mbili[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ziliendana” au “zilikuwa pacha” kutoka chini; Kiebrania kinakazia kwamba vipande hivyo viwili vililingana kimuundo.
    reason: lexical_alternative
  - marker: b
    text: Au, “zilikuwa nzima.” Maana ya ujenzi haiko wazi kabisa; huenda ikimaanisha kwamba kila kimoja kilikamilishwa au kuunganishwa kikamilifu kutoka chini hadi juu.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa mbao mbili za pembeni.” Kiebrania husema kihalisi “kwa pembe hizo mbili,” yaelekea kikirejelea mbao au fremu za pembezoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹאֲמִם
  choice: zilioanishwa
  rationale: Kitenzi hiki kinaonyesha kwamba vipande hivyo viwili vililingana na kuunda jozi. “Zilioanishwa” ni Kiswahili cha kawaida kinachowasilisha uhusiano huo wa kimuundo bila kuongeza ufafanuzi usiomo katika Kiebrania.
- source_word: מִלְּמַטָּה
  choice: chini
  rationale: Kirai hiki kinaonyesha sehemu ya chini ambako uoanishaji huo ulionekana au ulianzia. “Chini” ni fupi, wazi, na inafaa maelezo ya ujenzi.
- source_word: יַחְדָּו
  choice: kwa pamoja
  rationale: Huhifadhi msisitizo wa Kiebrania kwamba vipande hivyo vilifikia hali iliyoelezwa vikiwa pamoja.
- source_word: תַמִּים
  choice: kamili
  rationale: Neno hili lina maana ya kuwa kamili au timilifu. Tafsiri haibadilishi moja kwa moja kuwa “ziliunganishwa,” kwa kuwa hilo lingetatua maana ya kimuundo ambayo maandishi yanaiacha kwa kiasi fulani wazi.
- source_word: אֶל רֹאשׁוֹ
  choice: mpaka juu yake
  rationale: “Mpaka” huhifadhi mwelekeo na ukomo unaoonyeshwa na אֶל, kutoka sehemu ya chini hadi sehemu ya juu. Kiwakilishi cha umoja katika “yake” pia kinaakisi umbo la Kiebrania.
- source_word: הַטַּבַּעַת הָאֶחָת
  choice: pete ile moja
  rationale: 'Huhifadhi msisitizo wa neno lenye kibainishi pamoja na hesabu: si “pete ya kwanza,” bali “pete ile moja.”'
- source_word: כֵּן עָשָׂה
  choice: Ndivyo alivyofanya
  rationale: Ni usemi wa kawaida na wenye hadhi unaowasilisha muhtasari wa namna kazi hiyo ilivyotekelezwa.
- source_word: לִשְׁנֵיהֶם
  choice: kwa zote mbili
  rationale: Hurejelea vipande viwili vinavyohusika huku ikihifadhi rejeo la Kiebrania bila kuvipa jina lisilotajwa moja kwa moja hapa.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: kwa pembe hizo mbili
  rationale: Huhifadhi maana ya msingi ya מִקְצֹעֹת kama pembe, huku uwezekano wa kuelewa neno hilo kama vipande vya pembeni ukielezwa katika tanbihi.
