  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘Upau’ na ‘mbao’ ni maneno ya kawaida ya ujenzi; tanbihi zinahifadhi uwezekano wa ‘wa kati’ na utata wa kitenzi cha Kiebrania.
