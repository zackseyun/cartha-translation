translation:
  language: sw
  text: Akatengeneza upau wa katikati ili upite katikati ya mbao, kutoka ncha moja hadi nyingine.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upau wa kati ... kutoka ncha moja hadi nyingine.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kilichotafsiriwa “upite” kinaweza pia kueleweka hapa kuwa “uenee” au “uende” katikati ya mbao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Qal wayyiqtol ya עשה inaendeleza simulizi kwa tendo rahisi la wakati uliopita; ‘akatengeneza’ ni ya kawaida na ya asili katika Kiswahili.
- source_word: הַבְּרִיחַ
  choice: upau
  rationale: בְּרִיחַ hapa ni sehemu ndefu ya kuunganisha na kushikilia mbao; ‘upau’ ni wazi bila kuleta maana ya kufuli.
- source_word: הַתִּיכֹן
  choice: wa katikati
  rationale: Kivumishi hiki huonyesha kitu kilicho katikati au cha kati; ‘wa katikati’ huhifadhi maana ya nafasi.
- source_word: לִבְרֹחַ
  choice: ili upite
  rationale: Katika muktadha huu wa ujenzi, kitenzi kinaeleza upau kupita au kuenea ndani ya mbao, si tendo la kukimbia.
- source_word: בְּתוֹךְ
  choice: katikati ya
  rationale: Neno hili huonyesha ndani au katikati ya kitu; hapa linaeleza mahali upau unapopita.
- source_word: הַקְּרָשִׁים
  choice: mbao
  rationale: קֶרֶשׁ katika maelezo ya Maskani hurejelea vipande vya muundo vinavyoweza kuitwa mbao au fremu; ‘mbao’ ni neno la kawaida na linaloeleweka.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: kutoka ncha moja hadi nyingine
  rationale: Usemi huu unaonyesha kuenea katika urefu wote; tafsiri hii ni ya asili na wazi katika Kiswahili.
