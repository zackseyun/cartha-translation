  yaml_path: translation/ot/exodus/036/012.yaml
  text: He made fifty loops on the one curtain[a], and he made fifty loops on the edge of the curtain that was in the second set[b]; the loops corresponded to one another.
translation:
  language: sw
  text: Alitengeneza vitanzi hamsini kwenye pazia moja, naye akatengeneza vitanzi hamsini kwenye ukingo wa pazia lililokuwa katika muunganiko wa pili[a]; vitanzi hivyo vilikabiliana, kimoja na kingine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika kundi la pili la mapazia yaliyounganishwa.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “vitanzi vilikuwa vikikabiliana, kimoja kuelekea kingine.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: vitanzi
  rationale: Neno hili linamaanisha vitanzi vya kitambaa vilivyotumiwa kuunganisha mapazia; “vitanzi” ni sahihi na halichanganyiki na vifungo vya chuma vinavyotajwa kwingine.
- source_word: יְרִיעָה
  choice: pazia
  rationale: Katika muktadha wa maskani, neno hili linamaanisha kipande kikubwa cha kitambaa kilichotumika kama pazia.
- source_word: בִּקְצֵה
  choice: kwenye ukingo wa
  rationale: Hapa קָצֶה ni mpaka au ukingo wa pazia ambako vitanzi viliwekwa ili kuyaunganisha mapazia.
- source_word: מַחְבֶּרֶת
  choice: fungu
  rationale: Neno hilo linarejelea kundi la mapazia yaliyounganishwa kuwa sehemu moja; “fungu” ni la kawaida na linaeleweka katika Kiswahili.
- source_word: הַשֵּׁנִית
  choice: la pili
  rationale: Kivumishi hiki ni cha mpangilio na kinataja fungu la pili, si tu fungu jingine.
- source_word: מַקְבִּילֹת
  choice: vilikabiliana
  rationale: Kitenzi hiki kinaonyesha kwamba vitanzi vilikuwa vimepangiliwa vikielekeana ili viweze kuunganishwa.
- source_word: אַחַת אֶל אֶחָת
  choice: kimoja na kingine
  rationale: Nahau hii inasisitiza ulinganifu wa kila kitanzi na kile kilichokuwa upande wa pili.
- source_word: עָשָׂה
  choice: alitengeneza
  rationale: Katika maelezo ya ujenzi, “alitengeneza” ni tafsiri ya kawaida na iliyo wazi ya tendo la kutengeneza vitu hivyo.
