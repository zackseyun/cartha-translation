base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/008.yaml
  text: And every skillful man among those doing the work made the tabernacle with ten curtains of finely twisted linen[a], and blue, and purple, and scarlet yarn; he made them with cherubim[b], the work of a skillful designer.
translation:
  language: sw
  text: Mafundi wote stadi[a] miongoni mwa wale waliokuwa wakifanya kazi waliitengeneza Maskani kwa mapazia kumi ya kitani bora kilichosokotwa, nyuzi za buluu, za zambarau, na za nyekundu; aliyafanya yakiwa na makerubi, kwa ustadi wa mbunifu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “wenye hekima ya moyo,” nahau inayomaanisha mafundi wenye ustadi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinamalizia kwa kitenzi cha umoja, “aliyafanya,” ingawa aya inaanza kwa kitenzi na kiima cha wingi; tafsiri nyingine husema “waliyafanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: fundi stadi
  rationale: Kihalisi ni “mwenye hekima ya moyo,” lakini katika muktadha huu ni nahau ya ustadi wa ufundi. “Fundi stadi” ni Kiswahili cha kawaida na huonyesha kazi yake wazi.
- source_word: בְּעֹשֵׂי הַמְּלָאכָה
  choice: miongoni mwa wale waliofanya kazi
  rationale: Muundo huu humweka kila fundi ndani ya kundi la watu waliokuwa wakifanya kazi hiyo.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi yenye hadhi inayofaa kwa makao matakatifu yanayozungumziwa katika Kutoka, na huitofautisha na hema la kawaida.
- source_word: יְרִיעֹת
  choice: mapazia
  rationale: Katika ujenzi wa Maskani, neno hili humaanisha vipande vikubwa vya kitambaa vilivyotumika kama vifuniko au mapazia.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: kitani bora kilichosokotwa
  rationale: Huhifadhi aina ya kitambaa, ubora wake, na maelezo kwamba nyuzi zake zilisokotwa.
- source_word: תְכֵלֶת
  choice: nyuzi za buluu
  rationale: Neno linarejelea kitambaa au nyuzi zilizotiwa rangi ya buluu; “nyuzi” huweka wazi muktadha wa ufumaji.
- source_word: אַרְגָּמָן
  choice: zambarau
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa rangi ya kifahari inayokusudiwa hapa.
- source_word: תוֹלַעַת שָׁנִי
  choice: nyekundu
  rationale: Kirai hiki kinamaanisha nyenzo iliyotiwa rangi nyekundu angavu. “Nyekundu” ni ya kawaida na inaeleweka kwa urahisi katika Kiswahili.
- source_word: כְּרֻבִים
  choice: makerubi
  rationale: “Makerubi” ni umbo la kibiblia lililozoeleka katika Kiswahili kwa viumbe hawa wanaohusishwa na uwepo mtakatifu.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: kazi ya mbunifu stadi
  rationale: Kirai hiki kinaonyesha kazi iliyobuniwa na kutekelezwa kwa ustadi wa kisanii, si urembeshaji wa kawaida tu.
- source_word: עָשָׂה אֹתָם
  choice: aliyafanya
  rationale: Kitenzi cha mwisho ni cha umoja katika Kiebrania, hivyo umoja umehifadhiwa badala ya kusawazishwa na kitenzi cha wingi mwanzoni mwa aya.
theological_decisions:
- issue: Jinsi ya kutafsiri חֲכַם לֵב katika muktadha wa mafundi
  choice: fundi stadi
  alternative: mtu mwenye hekima ya moyo
  rationale: Maana ya kimuktadha ni ustadi wa ufundi. Kiswahili hakihitaji kuingiza jinsia ya kiume ili kuonyesha umoja wa kisarufi, na “fundi stadi” huhifadhi umoja bila kufanya dai lisilo la lazima kuhusu jinsia.
- issue: Kuhifadhi kitenzi cha umoja mwishoni mwa aya
  choice: aliyafanya
  alternative: waliyafanya
  rationale: Ingawa aya inaanza kwa kitenzi cha wingi, maandishi ya Kiebrania yana kitenzi cha umoja mwishoni. Tofauti hiyo imehifadhiwa katika tafsiri na kuelezwa kwa tanbihi badala ya kuondolewa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi mpito wa Kiebrania kutoka wingi hadi umoja. “Maskani” na “makerubi” zimetumiwa kama istilahi rasmi za muktadha wa patakatifu; maelezo ya nguo na rangi yamewekwa kwa lugha inayoeleweka kwa msomaji wa kawaida.
