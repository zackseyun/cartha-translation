  text: For the second side of the tabernacle[a], on the north side, he made twenty boards.
translation:
  language: sw
  text: Kwa upande wa pili wa Maskani, upande wa kaskazini, alitengeneza mbao[a] ishirini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viunzi.” Neno la Kiebrania linaweza kumaanisha mbao za muundo au viunzi, na umbo kamili la vipande vya Maskani linajadiliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְצֶלַע
  choice: Kwa upande
  rationale: צֶלַע katika maelezo ya ujenzi wa Maskani humaanisha upande, si ubavu wa mwili; muundo huu pia unawakilisha kwa kawaida viambishi vya Kiebrania vya kuunganisha na kuelekeza.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: Hili ni neno lililozoeleka katika Kiswahili cha Biblia kwa mahali patakatifu pa Israeli jangwani, na linadumisha dhana ya mahali pa kukaa.
- source_word: הַשֵּׁנִית
  choice: wa pili
  rationale: Kivumishi hiki kinaonyesha upande wa pili katika mfuatano, kwa hiyo 'wa pili' ni sahihi zaidi kuliko 'mwingine'.
- source_word: לִפְאַת צָפוֹן
  choice: upande wa kaskazini
  rationale: Kirai hiki kinaonyesha upande au mwelekeo wa kaskazini kwa lugha ya kawaida na iliyo wazi.
- source_word: עָשָׂה
  choice: alitengeneza
  rationale: עשה ni kitenzi kipana cha kufanya au kutengeneza; katika taarifa hii ya ujenzi, 'alitengeneza' ni ya asili na sahihi.
- source_word: עֶשְׂרִים
  choice: ishirini
  rationale: Ni tafsiri ya moja kwa moja ya idadi hiyo.
- source_word: קְרָשִׁים
  choice: mbao
  rationale: Neno hili humaanisha vipande vya miundo ya Maskani. 'Mbao' ni neno linaloeleweka kwa urahisi, huku uwezekano wa 'viunzi' ukihifadhiwa katika tanbihi kwa sababu umbo kamili la vipande hivyo linajadiliwa.
