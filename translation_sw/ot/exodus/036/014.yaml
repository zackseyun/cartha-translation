translation:
  language: sw
  text: Akatengeneza mapazia ya singa za mbuzi[a] kwa ajili ya hema juu ya Maskani; akatengeneza mapazia kumi na moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa ufupi, “mapazia ya mbuzi”; yaelekea ni mapazia yaliyofumwa kwa singa za mbuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשָׂה
  choice: akatengeneza
  rationale: Kitenzi עשה humaanisha ‘kufanya’ au ‘kutengeneza.’ Katika muktadha wa utengenezaji wa Maskani, ‘akatengeneza’ ni cha kawaida na sahihi; kurudiwa kwake kunahifadhi msisitizo wa Kiebrania.
- source_word: יְרִיעֹת
  choice: mapazia
  rationale: Katika vifungu vya Maskani, יְרִיעָה ni vipande vikubwa vya kitambaa vilivyotumika kufunika muundo; ‘mapazia’ ni neno la kawaida na linaloeleweka.
- source_word: עִזִּים
  choice: ya singa za mbuzi
  rationale: Kiebrania kinasema kwa ufupi ‘ya mbuzi,’ lakini katika muktadha huu kinarejelea kwa uwezekano mkubwa kitambaa kilichofumwa kwa singa za mbuzi, si ngozi za mbuzi. Tanbihi inahifadhi ufupi na uwezekano wa maana ya chanzo.
- source_word: לְאֹהֶל
  choice: kuwa hema
  rationale: 'Kiambishi ל־ hapa kinaonyesha kazi au matokeo: mapazia hayo yalifanya kazi ya hema au kifuniko cha hema. ‘Kuwa hema’ ni Kiswahili cha asili kinachoonyesha dhima hiyo.'
- source_word: עַל
  choice: juu ya
  rationale: עַל huonyesha kuwa tabaka hili la mapazia lilikuwa juu ya muundo wa Maskani.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: ‘Maskani’ ni istilahi ya Kiswahili iliyozoeleka kwa מִשְׁכָּן, jengo takatifu linalobebeka; pia inalitofautisha na hema lililokuwa kifuniko chake.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: kumi na moja
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya idadi ya Kiebrania.
- source_word: אֹתָם
  choice: imewakilishwa ndani ya ‘mapazia kumi na moja’
  rationale: Kiwakilishi hiki kinarejelea mapazia. Kiswahili cha kawaida hakihitaji kuongeza ‘hayo’ baada ya ‘akatengeneza mapazia kumi na moja,’ kwa kuwa yambwa tayari imetajwa wazi.
