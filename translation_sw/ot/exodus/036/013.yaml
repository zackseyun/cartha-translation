  yaml_path: translation/ot/exodus/036/013.yaml
  text: And he made fifty gold clasps[a], and joined the curtains to one another with the clasps, so that the tabernacle became one.
translation:
  language: sw
  text: Akatengeneza vifungo hamsini vya dhahabu, akayaunganisha mapazia, moja na jingine, kwa vifungo hivyo, nayo maskani ikawa kitu kimoja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nayo maskani ilikuwa moja.” Kiebrania kinaweza kutafsiriwa hivyo kwa kufuata muundo wake kwa karibu zaidi; “ikawa kitu kimoja” huonyesha wazi matokeo ya kuunganishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Kitenzi עשה humaanisha kufanya au kutengeneza; “akatengeneza” kinaeleza kwa kawaida utengenezaji wa vifaa hivi.
- source_word: חֲמִשִּׁים
  choice: hamsini
  rationale: Hii ni tafsiri ya moja kwa moja ya namba ya msingi.
- source_word: קַרְסֵי זָהָב
  choice: vifungo vya dhahabu
  rationale: קֶרֶס hapa ni kifaa cha kuunganisha mapazia. “Vifungo” kinaonyesha kazi yake bila kudai kwamba umbo lake lilikuwa la kulabu.
- source_word: וַיְחַבֵּר
  choice: akayaunganisha
  rationale: חבר humaanisha kuunganisha au kushikanisha; kiambishi “-ya-” kinarejelea mapazia kwa Kiswahili cha kawaida.
- source_word: אֶת הַיְרִעֹת
  choice: mapazia
  rationale: יְרִיעוֹת ni vipande vikubwa vya kitambaa vya kufunika maskani; “mapazia” ni neno linaloeleweka na lililozoeleka katika muktadha huu.
- source_word: אַחַת אֶל אַחַת
  choice: moja na jingine
  rationale: Usemi huu unaonyesha mapazia kuunganishwa kila moja na jingine; tafsiri hii huhifadhi umoja wa kike unaolingana na “mapazia” na ni ya kawaida katika Kiswahili.
- source_word: בַּקְּרָסִים
  choice: kwa vifungo hivyo
  rationale: Kihusishi ב־ kinaonyesha chombo kilichotumiwa kuunganisha; “hivyo” kinaonyesha kwamba ni vile vifungo vilivyotajwa tayari.
- source_word: וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: nayo maskani ikawa kitu kimoja
  rationale: Kauli hii inaonyesha matokeo ya kuunganishwa kwa mapazia. “Ikawa kitu kimoja” ni Kiswahili cha asili kinachosisitiza kuwa muundo mzima uliungana bila kuongeza wazo la umoja wa kitheolojia.
- source_word: הַמִּשְׁכָּן
  choice: maskani
  rationale: מִשְׁכָּן ni makao matakatifu ya kubebeka yaliyoelezwa katika Kutoka. “Maskani” ni neno fupi, lenye hadhi, na lililozoeleka katika Kiswahili cha Biblia.
