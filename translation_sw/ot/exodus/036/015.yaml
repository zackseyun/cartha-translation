  text: The length of each curtain was thirty cubits, and four cubits was the width of each curtain; the eleven curtains had one measure.
translation:
  language: sw
  text: Urefu wa kila pazia ulikuwa dhiraa thelathini, na upana wa kila pazia ulikuwa dhiraa nne; mapazia yote kumi na moja yalikuwa na kipimo kimoja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְרִיעָה
  choice: pazia
  rationale: Katika muktadha wa Hema la Kukutania, neno hili humaanisha kipande kikubwa cha kitambaa kilichotumika kulifunika hema; “pazia” ni neno la kawaida na linaloeleweka katika Kiswahili cha Biblia.
- source_word: אַמָּה
  choice: dhiraa
  rationale: Huhifadhi kipimo cha kale cha urefu badala ya kukibadili kuwa kipimo cha kisasa bila uhakika usiohitajika.
- source_word: מִדָּה אַחַת
  choice: kipimo kimoja
  rationale: Ni ulinganifu wa moja kwa moja unaohifadhi kauli ya Kiebrania kwamba mapazia yote yalikuwa ya vipimo sawa.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: kumi na moja
  rationale: Hii ndiyo idadi iliyotajwa katika Kiebrania, ikirejelea mapazia yote.
