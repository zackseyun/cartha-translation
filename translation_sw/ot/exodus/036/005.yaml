translation:
  language: sw
  text: Wakamwambia Musa, “Watu wanaleta zaidi ya kiasi kinachohitajika kwa ajili ya kazi ambayo Yahweh aliamuru ifanywe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה לֵּאמֹר
  choice: Wakamwambia Musa
  rationale: Muundo wa kawaida wa masimulizi unaoanzisha usemi wa moja kwa moja. Kiswahili hakihitaji kurudia neno la Kiebrania lenye maana ya ‘wakisema’ hapa.
- source_word: מַרְבִּים ... לְהָבִיא מִדֵּי
  choice: wanaleta vitu vingi kuliko vinavyohitajika
  rationale: Muungano huu unaonyesha tendo linaloendelea na ziada inayopita kiasi kinachotosha; ‘kuliko vinavyohitajika’ hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: הָעָם
  choice: Watu
  rationale: Ni rejeo la pamoja kwa watu wa Israeli; ‘watu’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: הָעֲבֹדָה לַמְּלָאכָה
  choice: kwa ajili ya kazi
  rationale: Maneno haya mawili yanahusiana kwa karibu na kazi ya kutengeneza maskani. Kuyakusanya kuwa ‘kazi’ huepuka usemi mzito usio wa kawaida huku muktadha ukihifadhi maana ya jukumu la ujenzi.
- source_word: אֲשֶׁר צִוָּה יְהוָה
  choice: ambayo Yahweh aliamuru
  rationale: Kishazi hiki kinaitambulisha kazi kuwa ile iliyoagizwa na Mungu; jina la agano יהוה limetoholewa kuwa ‘Yahweh’.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: ifanywe
  rationale: Kauli ya kutendwa ni ya asili katika Kiswahili na inaweka mkazo juu ya kazi iliyoamriwa badala ya mtendaji fulani.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu יהוה moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Vitu’ imeongezwa kwa uwazi wa kisarufi ili kutaja michango inayotajwa katika muktadha; haibadili aina ya michango. Sentensi inadumisha msisitizo wa Kiebrania kwamba watu walikuwa wakileta zaidi ya kiasi kilichohitajika.
