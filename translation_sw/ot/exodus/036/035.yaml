base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/035.yaml
  text: And he made the curtain of blue[a], purple, and scarlet yarn, and fine twisted linen; he made it with cherubim[c][b], the work of a skillful designer.
translation:
  language: sw
  text: Akatengeneza pazia[a] la nyuzi za buluu, zambarau, na nyekundu angavu[b], pamoja na kitani safi kilichosokotwa. Alilitengeneza likiwa na makerubi, kwa ufundi wa msanii stadi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utaji.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia kirai kinachomaanisha nyenzo au uzi uliotiwa rangi nyekundu angavu; “nyekundu iliyokolea” pia inawezekana.
    reason: lexical_alternative
  - marker: c
    text: Au “kazi ya msanii stadi” au “kazi ya tarizi.” Kiebrania kinarejelea ufundi wa kisanaa wenye michoro iliyopangwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: pazia
  rationale: Neno hili linamaanisha pazia la ndani lililotenganisha sehemu za Maskani. “Pazia” ni neno la kawaida, la sasa na linalofaa katika muktadha huu; uwezekano wa “utaji” umehifadhiwa katika tanbihi.
- source_word: תְּכֵלֶת
  choice: nyuzi za buluu
  rationale: Neno linataja kitu kilichotiwa rangi ya buluu katika orodha ya vitambaa. Kutaja “nyuzi” kunafanya maana ya nyenzo iwe wazi kwa Kiswahili.
- source_word: אַרְגָּמָן
  choice: zambarau
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa rangi ya kifahari inayotajwa hapa; “nyuzi za” inaeleweka kutoka mwanzo wa orodha.
- source_word: תוֹלַעַת שָׁנִי
  choice: nyekundu
  rationale: Kirai kinamaanisha nyenzo au uzi uliotiwa rangi nyekundu angavu. “Nyekundu” ni ya kawaida na wazi; uwezekano wa “nyekundu iliyokolea” umeonyeshwa katika tanbihi.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: kitani safi kilichosokotwa
  rationale: Tafsiri hii huhifadhi maana za kitani bora na hali yake ya kusokotwa, kwa mpangilio wa kawaida wa Kiswahili.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: kwa ufundi wa fundi stadi
  rationale: Kirai kinaonyesha kazi ya kisanaa yenye michoro iliyopangwa kwa ustadi. Tafsiri hii ni ya kawaida na haiamui bila lazima ikiwa mbinu ilikuwa kufuma au kutarizi.
- source_word: כְּרֻבִים
  choice: makerubi
  rationale: “Makerubi” ni wingi unaotambulika katika lugha ya Biblia ya Kiswahili kwa viumbe hawa wa mbinguni.
- source_word: עָשָׂה אֹתָהּ כְּרֻבִים
  choice: alilitengeneza likiwa na makerubi
  rationale: Muundo unaonyesha kwamba maumbo ya makerubi yaliingizwa katika mapambo ya pazia, bila kulazimisha mbinu hususa ya utengenezaji.
