translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Waisraeli’ limetumiwa kwa maana ya watu wa Israeli, na ‘nyika’ huepuka kudokeza bila msingi kwamba eneo hilo lilikuwa jangwa la mchanga tu.
