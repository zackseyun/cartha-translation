base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/022.yaml
  text: Then Moses led Israel on from the Sea of Reeds[a], and they went out into the wilderness of Shur. They went three days in the wilderness and found no water.
translation:
  language: sw
  text: Kisha Musa akawaongoza Waisraeli kutoka Bahari ya Matete[a], nao wakatoka, wakaenda katika nyika ya Shuri. Wakasafiri siku tatu katika nyika, lakini hawakupata maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa mapokeo hutafsiriwa “Bahari ya Shamu”; Kiebrania ni “Bahari ya Matete.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסַּע
  choice: akawaongoza Waisraeli waondoke
  rationale: Kauli ya Hifili ina maana ya kusababisha waondoke au waendelee na safari. Tafsiri hii ni ya kawaida kwa Kiswahili na inadumisha maana hiyo ya kusababisha bila kuwa ngumu.
- source_word: מִיַּם סוּף
  choice: kutoka Bahari ya Matete
  rationale: Jina la Kiebrania linamaanisha kihalisi ‘Bahari ya Matete.’ Tafsiri ya kimapokeo ‘Bahari ya Shamu’ imewekwa katika tanbihi.
- source_word: מִדְבַּר שׁוּר
  choice: nyika ya Shuri
  rationale: מִדְבָּר humaanisha eneo la nyika au jangwa, si lazima jangwa la mchanga. ‘Nyika’ ni neno la asili na pana katika Kiswahili cha Afrika Mashariki.
- source_word: וַיֵּצְאוּ
  choice: wakaingia
  rationale: Ingawa kitenzi cha Kiebrania kimsingi ni ‘wakatoka,’ mwelekeo unaotajwa ni kuelekea nyika; ‘wakaingia katika nyika’ ni Kiswahili cha kawaida kinachoeleza mwendo huo bila kubadili tukio.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: siku tatu
  rationale: Hiki ni kishamirisho cha muda; Kiswahili hutumia kwa kawaida ‘wakasafiri siku tatu’ bila kuongeza kihusishi.
- source_word: בַּמִּדְבָּר
  choice: katika nyika
  rationale: Huhifadhi maana ya kawaida ya kihusishi ב (‘katika’) na ya מִדְבָּר (‘nyika’).
- source_word: לֹא מָצְאוּ מָיִם
  choice: bila kupata maji
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha moja kwa moja kwamba katika safari hiyo hawakupata maji.
