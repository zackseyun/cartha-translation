  text: וּ/בְ/רֹ֥ב גְּאוֹנְ/ךָ֖ תַּהֲרֹ֣ס קָמֶ֑י/ךָ תְּשַׁלַּח֙ חֲרֹ֣נְ/ךָ֔ יֹאכְלֵ֖/מוֹ כַּ/קַּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/007.yaml
  text: And in the greatness of your majesty you overthrow those who rise up against you[a]; you send out your burning anger[b]; it consumes them like stubble.
translation:
  language: sw
  text: Na kwa ukuu wa enzi yako unawaangusha wale wanaokuinukia; unaituma hasira yako kali[a], nayo inawateketeza kama mabua makavu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ghadhabu yako inayowaka.” Kiebrania kinatumia usemi unaoonyesha hasira inayowaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹב גְּאוֹנְךָ
  choice: Na kwa ukuu wa enzi yako
  rationale: ב inaweza kuonyesha njia au hali, na רֹב huonyesha wingi au ukubwa. “Kwa ukuu wa enzi yako” ni Kiswahili cha kawaida kinachohifadhi maana ya nguvu kuu na fahari ya kifalme ya גָּאוֹן.
- source_word: תַּהֲרֹס
  choice: unawaangusha
  rationale: Ingawa הרס mara nyingi humaanisha kubomoa, hapa kiima kinatenda dhidi ya watu; “kuwaangusha” huwasilisha kwa kawaida tendo la kuwashinda na kuwaondoa wenye kuinuka dhidi ya Mungu.
- source_word: קָמֶיךָ
  choice: wale wanaokuinukia
  rationale: Tafsiri hii huhifadhi nguvu ya kitenzi cha participio kutoka קום, badala ya kuifupisha kuwa nomino kama “adui zako.”
- source_word: תְּשַׁלַּח
  choice: unaituma
  rationale: שׁלח kimsingi ni “kutuma.” Kiwakilishi “-i-” kinaelekea kwa hasira na kuhifadhi muundo wa sentensi ya Kiebrania.
- source_word: חֲרֹנְךָ
  choice: hasira yako kali
  rationale: חָרוֹן ni hasira inayowaka au ghadhabu. “Hasira kali” ni ya asili na yenye hadhi katika Kiswahili, huku tanbihi ikihifadhi taswira halisi ya kuwaka.
- source_word: יֹאכְלֵמוֹ
  choice: nayo inawateketeza
  rationale: Kitenzi cha umoja kinarejelea hasira ya Mungu. “Kutekeza” kinafaa kwa taswira ya kitu kikavu kinacholiwa na moto bila kulazimisha kutaja moto ambao hauko wazi katika maandishi.
- source_word: כַּקַּשׁ
  choice: kama mabua makavu
  rationale: קַשׁ ni mabua au masalia makavu ya nafaka baada ya mavuno. “Mabua makavu” huifanya taswira ya kuteketea haraka ieleweke kwa msomaji wa kawaida.
theological_decisions:
- issue: Lugha ya hukumu ya Mungu
  choice: unaituma hasira yako kali, nayo inawateketeza kama mabua makavu
  alternative: unaiachilia ghadhabu yako, nayo inawala kama makapi
  rationale: Tafsiri inadumisha kauli ya moja kwa moja kwamba hukumu hii inatoka kwa Mungu na kuhifadhi ukali wa ushairi bila kuupunguza wala kuongeza ufafanuzi wa kimafundisho.
- issue: Mungu kuzungumziwa moja kwa moja kwa nafsi ya pili
  choice: enzi yako ... wanaokuinukia ... hasira yako
  alternative: enzi ya BWANA ... wanaomwinukia ... hasira yake
  rationale: Wimbo unamwelekea Mungu moja kwa moja; nafsi ya pili huhifadhi tabia yake ya ibada na ungamo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Ukuu wa enzi” huhifadhi fahari na ukuu wa Mungu; “mabua makavu” ni wazi zaidi kuliko “makapi” kwa קַשׁ. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
