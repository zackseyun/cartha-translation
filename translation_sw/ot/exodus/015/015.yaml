base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/015.yaml
  text: Then the chiefs of Edom were terrified[a]; trembling seized the leaders of Moab; all the inhabitants of Canaan melted away.
translation:
  language: sw
  text: Ndipo machifu wa Edomu wakaingiwa na hofu; kutetemeka kukawashika viongozi wa Moabu[a]; wakazi wote wa Kanaani wakayeyuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wenye nguvu wa Moabu.” Kwa maana halisi, usemi wa Kiebrania ni “wenye nguvu” au “kondoo waume wa Moabu”; hapa unarejelea watu mashuhuri au viongozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Kielezi hiki kinaonyesha matokeo yaliyofuata tendo la wokovu lililotangulia; “Ndipo” ni la kawaida na linafaa katika ushairi wa simulizi.
- source_word: נִבְהֲלוּ
  choice: wakaingiwa na hofu
  rationale: Nifali ya בהל huonyesha kushtuka, kufadhaika, au kuogopa sana. Usemi huu wa Kiswahili unaonyesha hali ya hofu bila kupunguza uzito wa wimbo.
- source_word: אַלּוּפֵי אֱדוֹם
  choice: machifu wa Edomu
  rationale: אַלּוּף inaweza kumaanisha chifu au kiongozi wa ukoo. “Machifu” huhifadhi maana ya viongozi bila kuwafanya wafalme au wakuu wa kifalme.
- source_word: אֵילֵי מוֹאָב
  choice: viongozi wa Moabu
  rationale: Neno hili linahusiana na nguvu na linaweza kumaanisha wenye nguvu au watu mashuhuri. Katika usambamba huu wa viongozi wa mataifa, “viongozi” huwasilisha maana ya kijamii na kisiasa kwa uwazi; maana ya karibu zaidi na umbo la Kiebrania imewekwa katika tanbihi.
- source_word: יֹאחֲזֵמוֹ רָעַד
  choice: tetemeko likawashika
  rationale: Kitenzi אחז pamoja na רָעַד huonyesha kutetemeka kukiwakamata watu. Tafsiri hii huhifadhi uhuishaji na taswira yenye nguvu ya Kiebrania.
- source_word: נָמֹגוּ
  choice: wakayeyuka
  rationale: מוג katika muktadha wa hofu humaanisha kuyeyuka au kupoteza moyo. “Wakayeyuka” huhifadhi sitiari ya ushairi badala ya kuifafanua moja kwa moja.
- source_word: כֹּל יֹשְׁבֵי כְנָעַן
  choice: wakazi wote wa Kanaani
  rationale: Hii ni tafsiri ya kawaida na wazi ya muundo wa Kiebrania, huku ikihifadhi maana ya jumla ya watu wote waliokaa katika nchi hiyo.
theological_decisions:
- issue: Sitiari ya kuyeyuka kwa sababu ya hofu
  choice: wakayeyuka
  alternative: wakapoteza moyo
  rationale: Sitiari ya asili imehifadhiwa ili kutofafanua kimakusudi namna mahususi ambayo hofu yao ilijidhihirisha.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na lugha yenye heshima lakini inayoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka ya Biblia ya Kiswahili: Edomu, Moabu, na Kanaani.'
