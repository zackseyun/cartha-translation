base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/011.yaml
  text: Who is like you among the gods, O LORD? Who is like you, majestic in holiness, feared in praises, doing wonders?
translation:
  language: sw
  text: Ni nani aliye kama wewe miongoni mwa miungu, Ee BWANA? Ni nani aliye kama wewe, mtukufu katika utakatifu, wa kuogopwa katika sifa, atendaye maajabu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֵלִם
  choice: miongoni mwa miungu
  rationale: Nomino אֵלִם ni wingi na hapa ina maana ya viumbe au mamlaka zinazoitwa miungu; tafsiri ya moja kwa moja inadumisha dai la kulinganisha bila kulifanya tamko la kimadhehebu.
- source_word: יְהוָה
  choice: BWANA
  rationale: Jina la agano limewakilishwa kwa desturi ya Kiswahili ya herufi kubwa, BWANA, sambamba na safu ya mashauriano ya POB.
- source_word: נֶאְדָּר בַּקֹּדֶשׁ
  choice: mwenye utukufu mkuu katika utakatifu
  rationale: נֶאְדָּר huonyesha ukuu wenye fahari au utukufu; kirai hiki cha asili kinaeleweka na chenye heshima katika Kiswahili.
- source_word: נוֹרָא תְהִלֹּת
  choice: mwenye kuogopwa katika sifa
  rationale: נוֹרָא ni 'mwenye kuogopwa/kustaajabisha'; muundo usio wa kawaida umehifadhiwa badala ya kufafanuliwa kuwa 'anayestahili sifa' au maana nyingine.
- source_word: עֹשֵׂה פֶלֶא
  choice: atendaye maajabu
  rationale: Huwasilisha kishiriki cha tendo endelevu na neno la ajabu la kimungu kwa Kiswahili cha kibiblia kinachoeleweka.
theological_decisions:
- issue: Kauli 'miongoni mwa miungu'
  choice: Imehifadhiwa kama ulinganisho wa wazi na 'miungu'.
  alternative: miongoni mwa wenye nguvu / viumbe wa mbinguni
  rationale: Maandishi ya Kiebrania yanatumia אֵלִם; kuyabadilisha kuwa kundi lililofafanuliwa zaidi kungeondoa utata halisi wa kishairi na kiteolojia.
- issue: Maana ya נוֹרָא תְהִלֹּת
  choice: mwenye kuogopwa katika sifa
  alternative: wa kutisha katika matendo ya kusifiwa / mwenye kuogopwa na wanaokusifu
  rationale: Muunganiko wa maneno una mvutano wa kisemantiki; tafsiri iliyochaguliwa inafuata ushahidi wa chanzo na safu ya POB bila kuamua kimya kimya uhusiano sahihi wa maneno hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya swali la balagha yamehifadhiwa.
