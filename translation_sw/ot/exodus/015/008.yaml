  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בְ/ר֤וּחַ אַפֶּ֨י/ךָ֙ נֶ֣עֶרְמוּ מַ֔יִם נִצְּב֥וּ כְמוֹ נֵ֖ד נֹזְלִ֑ים קָֽפְא֥וּ תְהֹמֹ֖ת בְּ/לֶב יָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/008.yaml
  text: At the blast of your nostrils the waters piled up[a]; the flowing waters stood like a heap[d][c][b]; the depths congealed in the heart of the sea.
translation:
  language: sw
  text: Kwa mvumo uliotoka katika matundu ya pua yako[a], maji yalirundikana; maji yatiririkayo yalisimama kama lundo[b]; vilindi viliganda[c] moyoni mwa bahari[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa pumzi kutoka katika matundu ya pua yako.” Neno la Kiebrania linaweza kumaanisha upepo au pumzi.
    reason: lexical_alternative
  - marker: b
    text: “Kama lundo” linafuata nomino ya Kiebrania; tafsiri nyingine husema “kama ukuta” kwa kuzingatia taswira ya kuvuka bahari katika vifungu vinavyohusiana.
    reason: lexical_alternative
  - marker: c
    text: Au, “vilishikana na kuwa vizito.” Kitenzi cha Kiebrania kinaweza kueleza kuganda au kuwa nzito.
    reason: lexical_alternative
  - marker: d
    text: Kihalisi, “katika moyo wa bahari,” yaani, katikati ya bahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרוּחַ אַפֶּיךָ
  choice: Kwa mvumo uliotoka katika matundu ya pua yako
  rationale: רוּחַ inaweza kumaanisha upepo au pumzi; pamoja na אַפֶּיךָ inaleta picha ya nguvu inayotoka puani. “Mvumo” unaonyesha nguvu hiyo bila kuondoa taswira halisi ya kishairi ya matundu ya pua.
- source_word: נֶעֶרְמוּ מַיִם
  choice: maji yalirundikana
  rationale: Kitenzi נֶעֶרְמוּ kinaeleza maji kukusanyika na kuwa kama rundo. “Yalirundikana” ni Kiswahili cha kawaida na chenye nguvu.
- source_word: נִצְּבוּ ... נֹזְלִים
  choice: maji yatiririkayo yalisimama
  rationale: נֹזְלִים ni umbo linaloonyesha maji yanayotiririka, huku נִצְּבוּ ikisema yalisimama. Tafsiri hii inadumisha mvutano wa kishairi kati ya kutiririka na kusimama.
- source_word: כְמוֹ נֵד
  choice: kama lundo
  rationale: נֵד humaanisha hasa rundo au kitu kilichokusanywa kwa kurundikwa. “Lundo” linafuata neno la Kiebrania badala ya kuingiza taswira ya “ukuta” kutoka vifungu vinavyohusiana.
- source_word: קָפְאוּ תְהֹמֹת
  choice: vilindi viliganda
  rationale: קָפְאוּ inaweza kueleza kuwa nzito, kuganda, au kushikana. “Viliganda” ni wazi na kinadumisha picha ya kishairi bila kulazimisha maelezo ya kisayansi kuhusu barafu.
- source_word: בְּלֶב יָם
  choice: moyoni mwa bahari
  rationale: Hii inafuata sitiari halisi ya Kiebrania, “katika moyo wa bahari,” huku ikiwa usemi wa kishairi unaoeleweka katika Kiswahili.
theological_decisions:
- issue: Taswira ya Mungu yenye viungo vya kibinadamu katika Wimbo wa Bahari
  choice: Kudumisha taswira ya mvumo unaotoka katika matundu ya pua ya Mungu
  alternative: Kutafsiri kwa dhana isiyo halisi, kama “kwa hasira yako”
  rationale: Kiebrania kinatumia taswira ya kimwili kuonyesha nguvu ya tendo la Mungu. Kuidumisha kunaheshimu ushairi wa maandiko na hakufichi taswira hiyo kwa sababu za kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mistari mitatu na taswira za maji, lundo, kuganda, na moyo wa bahari zimedumishwa.
