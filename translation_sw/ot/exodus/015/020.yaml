base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/020.yaml
  text: Then Miriam the prophetess[a], Aaron’s sister, took the tambourine in her hand, and all the women went out after her with tambourines and dancing.
translation:
  language: sw
  text: Kisha Miriamu, nabii mwanamke, dada ya Haruni, akachukua tari mkononi mwake; na wanawake wote wakatoka wakimfuata, wakiwa na matari na wakicheza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na dansi.” Nomino ya Kiebrania inaweza kumaanisha tendo la kucheza au dansi mbalimbali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: akachukua
  rationale: Muundo wa kitenzi unaendeleza simulizi kwa tukio linalofuata; kiambishi ‘-ka-’ kinaonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: מִרְיָם
  choice: Miriamu
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: הַנְּבִיאָה
  choice: nabii wa kike
  rationale: Nomino ya Kiebrania imetiwa alama wazi kuwa ya jinsia ya kike; tafsiri hii inalihifadhi jambo hilo kwa lugha ya sasa.
- source_word: אֲחוֹת אַהֲרֹן
  choice: dada yake Haruni
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi utambulisho mahsusi wa Miriamu kama dada ya Haruni.
- source_word: הַתֹּף
  choice: tari
  rationale: תֹף ni ala ndogo ya kugongwa kwa mkono, hasa ngoma ya fremu; ‘tari’ ndiyo istilahi fupi na iliyozoeleka katika Kiswahili.
- source_word: בְּיָדָהּ
  choice: mkononi mwake
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kishazi kinachoonyesha mahali ala iliposhikwa.
- source_word: וַתֵּצֶאןָ
  choice: wakatoka
  rationale: Kitenzi יצא humaanisha kutoka; ‘-ka-’ pia kinaendeleza mfuatano wa simulizi.
- source_word: כָל הַנָּשִׁים
  choice: wanawake wote
  rationale: Inahifadhi kwa uwazi wingi, ujumla, na jinsia inayotajwa katika Kiebrania.
- source_word: אַחֲרֶיהָ
  choice: wakimfuata
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kwenda nyuma yake au baada yake katika msafara.
- source_word: בְּתֻפִּים
  choice: wakiwa na matari
  rationale: Wingi wa תֹף umetafsiriwa kwa uthabiti kama ‘matari’; muundo huu unaonyesha kwamba walikuwa wamebeba au kutumia ala hizo.
- source_word: וּבִמְחֹלֹת
  choice: na wakicheza
  rationale: מְחֹלֹת hurejelea kucheza kwa shangwe; umbo la kitenzi ni la asili zaidi katika Kiswahili huku tanbihi ikihifadhi uwezekano wa kulielewa kama matukio au aina za dansi.
theological_decisions:
- issue: Cheo cha Miriamu kama nabii wa kike
  choice: nabii wa kike
  alternative: nabii
  rationale: Kiebrania kinatumia nomino yenye umbo mahsusi la kike. Tafsiri hailifichi wala kuongeza maelezo kuhusu namna alivyotekeleza huduma hiyo.
- issue: Utambulisho wa Miriamu kwa uhusiano wa kifamilia
  choice: dada yake Haruni
  alternative: dada yao Haruni na Musa
  rationale: Ingawa Miriamu pia anajulikana kuwa dada ya Musa, mstari huu unamtaja Haruni peke yake; tafsiri haiongezi jina lisilokuwamo hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Tari’ limetumiwa kwa ala ya kugongwa kwa mkono, na ‘wakicheza’ kwa usemi wa kawaida wa shangwe ya pamoja. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika nayo.
