base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/017.yaml
  text: You will bring them in and plant them on the mountain of your inheritance— the place[a], Yahweh, that you made for your dwelling, the sanctuary, Lord[c][b], that your hands established.
translation:
  language: sw
  text: Utawaingiza na kuwapanda[a] kwenye mlima wa urithi wako[b]—mahali ulipotengeneza kwa ajili ya makao yako, Ee Yahwe; mahali patakatifu, Ee Bwana,[c] ambayo mikono yako imeisimamisha imara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na kuwaweka imara.” Kitenzi cha Kiebrania kwa maana halisi ni “kuwapanda,” kikidumisha taswira ya kuwakalisha kwa usalama na uthabiti.
    reason: lexical_alternative
  - marker: b
    text: Kauli “mlima wa urithi wako” inaweza kurejelea kwa upana nchi ambayo Mungu anawapa watu wake, au kwa namna maalumu zaidi mlima wa mahali patakatifu pa Mungu.
    reason: alternative_reading
  - marker: c
    text: Kiebrania kina jina la Mungu “Yahwe” na pia cheo “Bwana” katika mstari huu.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבִאֵמוֹ
  choice: Utawaingiza
  rationale: Hifili ya בוא pamoja na kiambishi cha nafsi ya tatu wingi inaonyesha kuwasababisha waingie mahali fulani. “Utawaingiza” ni ya kawaida katika Kiswahili na inadumisha maana hiyo.
- source_word: וְתִטָּעֵמוֹ
  choice: na kuwapanda
  rationale: נטע maana yake ya msingi ni “kupanda.” Hapa ni taswira ya kuwafanya watu wakae kwa uthabiti, lakini tafsiri inadumisha picha halisi ya kishairi badala ya kuibadili moja kwa moja kuwa “kuwaweka.”
- source_word: בְּהַר נַחֲלָתְךָ
  choice: kwenye mlima wa urithi wako
  rationale: “Kwenye” ni ya kawaida kwa mahali juu au katika eneo la mlima, huku “mlima wa urithi wako” ikidumisha uhusiano wa Kiebrania bila kuamua ikiwa mlima wenyewe au eneo pana ndilo linalokusudiwa.
- source_word: מָכוֹן לְשִׁבְתְּךָ
  choice: mahali ... kuwa makao yako
  rationale: מָכוֹן inaweza kumaanisha mahali palipowekwa au palipoandaliwa. Kauli hii ya Kiswahili ni wazi na ya kawaida, na inaonyesha mahali palilokusudiwa kuwa makao ya Mungu.
- source_word: פָּעַלְתָּ
  choice: ulipopatengeneza
  rationale: פעל ni kitenzi kipana cha kufanya au kutengeneza. “Ulipopatengeneza” kinafaa katika muktadha wa mahali palipoandaliwa bila kuongeza wazo lisilokuwapo wazi katika matini.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa kama “Yahwe” badala ya kubadilishwa na cheo, hivyo kutofautisha jina hilo na אֲדֹנָי inayofuata.
- source_word: מִקְּדָשׁ
  choice: mahali patakatifu
  rationale: מקדש ni mahali patakatifu au patakatifu pa ibada. “Mahali patakatifu” ni lugha ya sasa, inayoeleweka kwa urahisi, na inadumisha maana ya msingi.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: אֲדֹנָי hapa hutumika kama cheo cha Mungu. “Bwana” ni kilinganishi cha kawaida cha Kiswahili na kinadumisha tofauti na jina “Yahwe.”
- source_word: כּוֹנְנוּ יָדֶיךָ
  choice: palipoimarishwa na mikono yako
  rationale: Umbo la כון lina maana ya kuweka imara au kuanzisha kwa uthabiti. “Palipoimarishwa na mikono yako” linadumisha taswira ya mikono ya Mungu na wazo la msingi thabiti.
theological_decisions:
- issue: Kutafsiri יְהוָה na אֲדֹנָי katika mstari mmoja
  choice: יְהוָה imetafsiriwa “Yahwe,” na אֲדֹנָי imetafsiriwa “Bwana.”
  alternative: Kutafsiri yote mawili “Bwana.”
  rationale: Matini ya Kiebrania ina jina binafsi la Mungu na pia cheo. Kutumia “Yahwe” na “Bwana” kunadumisha tofauti hiyo bila kuongeza maneno.
- issue: Kirejelewa cha “mlima wa urithi wako” na “mahali patakatifu”
  choice: Taswira ya Kiebrania imedumishwa bila kutaja wazi Kanaani, Sayuni, au Hekalu.
  alternative: Kufafanua mlima kuwa Sayuni/Hekalu au nchi yote ya Kanaani.
  rationale: Ushairi unaweza kuelekeza kwa upana kwenye nchi ambayo Israeli itakaa na kwa namna maalumu zaidi kwenye mahali pa patakatifu pa Mungu. Tafsiri haifungi maana katika kirejelewa kimoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Alama ya em dash na semikoli zinadumisha mistari sambamba ya ushairi bila kufanya sentensi kuwa nzito; viingizi “Ee Yahwe” na “Ee Bwana” vinaonyesha usemi wa moja kwa moja kwa Mungu.
