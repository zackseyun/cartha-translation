review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal Hebrew imagery: bringing the people in, planting them, the mountain of God''s inheritance, the dwelling-place, and the sanctuary established by God''s hands. However, the wording for the prepared dwelling-place is grammatically awkward, and the final passive construction weakens the Hebrew''s explicit active statement that God''s hands established it.'
  naturalness: Most of the verse is clear and appropriately elevated. “mahali ulipopatengeneza kuwa makao yako” is not idiomatic Standard East African Swahili; “mahali ulipotengeneza kwa ajili ya makao yako” is natural and retains the intended sense. The revised final relative clause is also more direct.
  terminology: “Yahwe” and “Bwana” appropriately distinguish יהוה from אדני. “Mahali patakatifu” is a suitable rendering of מקדש. The retained metaphor “kuwapanda” is appropriately poetic.
  issues:
  - severity: medium
    issue: Awkward construction for מָכוֹן לְשִׁבְתְּךָ פָּעַלְתָּ
    rationale: “mahali ulipopatengeneza kuwa makao yako” uses an unnecessary object/locative element and does not naturally express that the place was made for God's dwelling. “mahali ulipotengeneza kwa ajili ya makao yako” is idiomatic and faithful.
  - severity: low
    issue: Final clause is passive although Hebrew explicitly has God's hands as subject
    rationale: “palipoimarishwa na mikono yako” communicates the core meaning, but “ambayo mikono yako imeisimamisha imara” more closely preserves the active construction and anthropomorphic imagery.
  revised_text: Utawaingiza na kuwapanda[a] kwenye mlima wa urithi wako[b]—mahali ulipotengeneza kwa ajili ya makao yako, Ee Yahwe; mahali patakatifu, Ee Bwana,[c] ambayo mikono yako imeisimamisha imara.
