- from: Utawaingiza na kuwapanda[a] kwenye mlima wa urithi wako[b]—mahali ulipopatengeneza kuwa makao yako, Ee Yahwe; mahali patakatifu, Ee Bwana,[c] palipoimarishwa na mikono yako.
