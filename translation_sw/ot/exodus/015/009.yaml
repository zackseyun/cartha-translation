    text: Kihalisi, “nafsi yangu itajazwa nao,” yaani, “nitakuwa nimepata nilichotaka kwao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mkono wangu utawaangamiza” au “utawafukuza.”
    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural expression for satisfied desire with “nitatosheka nao,” which preserves the Hebrew image of the enemy having its fill of the Israelites. It also removes the added phrase “milki yao” and uses “utawamiliki” for the core possessive/dispossessing sense of the final verb; the footnote retains the contextually plausible alternatives ‘destroy’ and ‘drive out.’
