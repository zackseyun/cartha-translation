  yaml_path: translation/ot/exodus/015/009.yaml
  text: The enemy said[a], ‘I will pursue, I will overtake, I will divide the spoil; my desire will be satisfied on them. I will draw my sword[b]; my hand will dispossess them.’
translation:
  language: sw
  text: Adui alisema, “Nitawafuatilia, nitawafikia, nitagawa nyara; nitatosheka nao.[a] Nitauchomoa upanga wangu; mkono wangu utawamiliki.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “nafsi yangu itajazwa nao,” yaani, “nitakuwa nimepata nilichotaka kwao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mkono wangu utawaangamiza” au “utawafukuza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: alisema
  rationale: Wakati uliopita unafaa katika simulizi la wimbo na unatambulisha majivuno ya adui.
- source_word: אוֹיֵב
  choice: Adui
  rationale: Nomino ya umoja inamwakilisha adui anayewafuatilia Waisraeli, yaani Misri, kwa maana ya kijumla.
- source_word: אֶרְדֹּף
  choice: Nitawafuatilia
  rationale: Hali isiyotimilika hapa inaonyesha azma ya tendo la baadaye; kiambishi cha yambwa kinaweka wazi kwamba adui anawafuatilia watu waliotajwa katika muktadha.
- source_word: אַשִּׂיג
  choice: nitawafikia
  rationale: Kitenzi kina maana ya kumfikia mtu anayefuatiliwa; ‘kuwafikia’ ni Kiswahili cha kawaida na kinahifadhi taswira ya msako.
- source_word: אֲחַלֵּק שָׁלָל
  choice: nitagawa nyara
  rationale: Huu ni usemi wa kawaida kuhusu kugawana mali iliyotekwa vitani; ‘nyara’ ni neno la sasa na lenye hadhi.
- source_word: תִּמְלָאֵמוֹ נַפְשִׁי
  choice: nitajitosheleza kwao
  rationale: Kihalisi ni ‘nafsi yangu itajazwa nao.’ Katika muktadha נֶפֶשׁ inaonyesha hamu au tamaa; uundaji huu unaeleza majivuno ya adui bila kuyafanya kuwa fundisho la kiufundi kuhusu nafsi.
- source_word: אָרִיק חַרְבִּי
  choice: Nitauchomoa upanga wangu
  rationale: Hapa ריק pamoja na ‘upanga’ ni nahau ya kuutoa upanga alani; ‘kuuchomoa’ ni wazi na ya kawaida katika Kiswahili.
- source_word: תּוֹרִישֵׁמוֹ יָדִי
  choice: mkono wangu utawaondolea milki yao
  rationale: Hifili ya ירשׁ kwa kawaida huhusu kumnyang’anya mtu milki au kumfukuza ili kuchukua nafasi yake. Tafsiri hii inadumisha wazo hilo, huku tanbihi ikionyesha maana nyingine zinazowezekana katika muktadha huu wa kijeshi.
