  text: עָזִּ֤/י וְ/זִמְרָת֙ יָ֔הּ וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָ֑ה זֶ֤ה אֵלִ/י֙ וְ/אַנְוֵ֔/הוּ אֱלֹהֵ֥י אָבִ֖/י וַ/אֲרֹמְמֶֽ/נְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/002.yaml
  text: Yah is my strength and song[a], and he has become my salvation. This is my God, and I will praise him; my father's God, and I will exalt him.
translation:
  language: sw
  text: Yah ni nguvu zangu na wimbo wangu, naye amekuwa wokovu wangu. Huyu ndiye Mungu wangu, nami nitamsifu[a]; Mungu wa baba yangu, nami nitamtukuza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitamwandalia makao.” Kitenzi cha Kiebrania hapa ni kigumu, na huenda kikawa na maana ya kumwandalia makao au kumpamba/kumtukuza.
    reason: alternative_reading
lexical_decisions:
- source_word: עָזִּי
  choice: nguvu zangu
  rationale: Nomino עֹז ina maana ya nguvu au uwezo; “nguvu zangu” ni usemi wa kawaida wa Kiswahili na unadumisha picha ya kishairi.
- source_word: וְזִמְרָת יָהּ
  choice: na wimbo wangu; Yah
  rationale: זִמְרָה hapa linafaa kueleweka kama wimbo wa sifa katika utenzi wa ushindi. יָהּ ni jina la Mungu lililofupishwa, hivyo limetoholewa kuwa “Yah” badala ya kusawazishwa na “BWANA.”
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: naye amekuwa wokovu wangu
  rationale: Muundo היה + ל unaonyesha kuwa au kuwa kitu kwa mtu; wakati timilifu “amekuwa” unahifadhi maana ya matokeo ya ukombozi uliotendeka.
- source_word: זֶה אֵלִי
  choice: Huyu ndiye Mungu wangu
  rationale: “Huyu ndiye” linatoa utambulisho wenye mkazo wa demonstrativi זֶה kwa Kiswahili cha kawaida.
- source_word: וְאַנְוֵהוּ
  choice: nami nitamsifu
  rationale: Kitenzi hiki kina utata. Maana ya kumsifu au kumtukuza inafaa usambamba wa kishairi na “nitamtukuza,” huku maana mbadala ya kumwandalia makao ikihifadhiwa katika tanbihi.
- source_word: אֱלֹהֵי אָבִי
  choice: Mungu wa baba yangu
  rationale: Hili linawakilisha moja kwa moja muundo wa uhusiano wa Kiebrania na rejeo lake la kifamilia.
- source_word: וַאֲרֹמְמֶנְהוּ
  choice: nami nitamtukuza
  rationale: רומם humaanisha kuinua au kutukuza; “nitamtukuza” ni ya asili katika lugha ya ibada na inadumisha hadhi ya kishairi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יָהּ
  choice: Yah
  alternative: BWANA
  rationale: Maandishi yanatumia umbo lililofupishwa יָהּ, si tetragramatoni יהוה; “Yah” linahifadhi tofauti hiyo na nguvu ya kishairi.
- issue: Tafsiri ya וְאַנְוֵהוּ
  choice: nitamsifu
  alternative: nitamwandalia makao
  rationale: Usomaji wa “nitamsifu” unaafikiana na muktadha wa ibada na usambamba wa “nitamtukuza,” lakini utata wa kileksika hauondolewi na usomaji wa makao umewekwa tanbihini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa ibada lakini kinachoeleweka kwa wasomaji wa kawaida. Jina “Yah” limehifadhiwa kama umbo fupi la jina la Mungu; alama ya tanbihi [a] imewekwa mara baada ya neno linalohusika.
