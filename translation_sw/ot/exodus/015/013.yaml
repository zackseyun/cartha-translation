  yaml_path: translation/ot/exodus/015/013.yaml
  text: In your steadfast love you have led the people whom you redeemed[b][a]; in your strength you have guided them to your holy dwelling.
translation:
  language: sw
  text: 'Kwa upendo wako wa kudumu umewaongoza watu hawa uliowakomboa[a]; kwa nguvu zako umewaongoza kwenye makao yako matakatifu.[b]


    [a] Au, “watu uliowakomboa.”


    [b] “Makao yako matakatifu” yanaweza kumaanisha kwa upana mahali pa uwepo mtakatifu wa Mungu; yanaweza kueleweka kuwa Sinai, nchi ya ahadi, au Sayuni/hekalu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu uliowakomboa.”
    reason: Tafsiri kuu huhifadhi nguvu ya kiashiria katika עַם זוּ, “watu hawa”; mbadala huiwasilisha kama “watu” bila kiashiria hicho, sawa na chaguo la kawaida la Kiingereza.
  - marker: b
    text: “Makao yako matakatifu” yanaweza kumaanisha kwa upana mahali pa uwepo mtakatifu wa Mungu; yanaweza kueleweka kuwa Sinai, nchi ya ahadi, au Sayuni/hekalu.
    reason: Tanbihi inadumisha kutokuwa dhahiri kwa mahali panaporejelewa badala ya kuamua tafsiri moja.
lexical_decisions:
- source_word: נָחִיתָ
  choice: umewaongoza
  rationale: Kitenzi hiki humaanisha kuongoza au kuelekeza. “Umewaongoza” ni Kiswahili cha kawaida kinachofaa muktadha wa Mungu kuwaongoza watu wake baada ya kutoka Misri.
- source_word: בְחַסְדְּךָ
  choice: kwa upendo wako wa kudumu
  rationale: חֶסֶד hujumuisha upendo, rehema na uaminifu wa kudumu. Kauli hii ni ya kawaida na yenye heshima, huku ikidumisha wazo la uthabiti wa upendo huo.
- source_word: עַם זוּ
  choice: watu hawa
  rationale: זוּ lina nguvu ya kuashiria “hawa/hii.” Tafsiri kuu inaihifadhi wazi badala ya kuimeza katika uhusishi wa kawaida.
- source_word: גָּאָלְתָּ
  choice: uliowakomboa
  rationale: “Kukomboa” huhifadhi maana ya kuwaokoa au kuwanunua watu watoke katika kifungo, pamoja na uzito wa neno hili katika simulizi la kutoka Misri.
- source_word: נֵהַלְתָּ
  choice: umewaelekeza
  rationale: Kitenzi hiki huonyesha kuongoza kwa uangalifu. “Umewaelekeza” hukitofautisha na נָחִיתָ bila kuondoa wazo la uongozi.
- source_word: בְעָזְּךָ
  choice: kwa nguvu zako
  rationale: עֹז ni nguvu au uwezo. “Kwa nguvu zako” huonyesha wazi kwamba nguvu za Mungu ndizo njia ya uongozi huo.
- source_word: אֶל
  choice: mpaka
  rationale: Katika muktadha huu אֶל huonyesha kuelekea mahali palipokusudiwa. “Mpaka” ni ya asili katika Kiswahili na inalingana na uelekeo unaoelezwa katika mstari.
- source_word: נְוֵה קָדְשֶׁךָ
  choice: makao yako matakatifu
  rationale: נָוֶה inaweza kuwa makao, mahali pa kukaa, au eneo la malisho. “Makao yako matakatifu” hudokeza mahali pa uwepo wa Mungu bila kulazimisha kuwa ni Sinai, Kanaani au hekalu pekee.
theological_decisions:
- issue: Mahali panaporejelewa na “makao yako matakatifu”
  choice: Kauli pana kuhusu mahali pa uwepo mtakatifu wa Mungu, bila kutaja eneo moja pekee
  alternative: Sinai, nchi ya ahadi, au Sayuni/hekalu
  rationale: Kiebrania hakitambulishi mahali hapo bila utata. Wimbo unaweza kuunganisha kishairi hatua mbalimbali za kazi ya Mungu ya wokovu; kwa hiyo tafsiri haifungi maana kwenye eneo moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi wenye vipande viwili umehifadhiwa; istilahi nzito zisizo za lazima zimeepukwa.
