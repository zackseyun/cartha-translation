lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja kama jina binafsi, badala ya kubadilishwa kuwa cheo kama “BWANA.” Tahajia “Yahwe” ni ya kawaida na inayosomeka kwa Kiswahili.
- source_word: יִמְלֹךְ
  choice: atatawala
  rationale: Kauli ya Kiebrania hapa inaeleweka kwa maana ya wakati ujao katika wimbo unaotangaza ufalme wa Mungu unaodumu. “Atatawala” ni ya asili kwa Kiswahili na inadumisha dhana ya kutawala kama mfalme.
- source_word: לְעֹלָם וָעֶד
  choice: milele na milele
  rationale: Huu ni msemo wa Kiebrania unaosisitiza muda usio na mwisho. Urudiaji huu wa Kiswahili unahifadhi msisitizo na mtindo wa kishairi wa chanzo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni kama jina binafsi la Mungu. “Yahwe” hulihifadhi jina hilo bila kulibadilisha kuwa cheo, huku tanbihi ikitaja desturi na mbadala muhimu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; sentensi fupi, yenye hadhi na mwangwi wa kishairi unaofaa wimbo wa ushindi.
