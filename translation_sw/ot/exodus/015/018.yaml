  text: Yahwe atatawala milele na milele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH.” Kwa desturi hutafsiriwa “BWANA”; mbadala ni “Yehova.”'
