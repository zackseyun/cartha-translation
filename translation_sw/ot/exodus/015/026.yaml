  text: וַ/יֹּאמֶר֩ אִם שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְ/ק֣וֹל יְהוָ֣ה אֱלֹהֶ֗י/ךָ וְ/הַ/יָּשָׁ֤ר בְּ/עֵינָי/ו֙ תַּעֲשֶׂ֔ה וְ/הַֽאֲזַנְתָּ֙ לְ/מִצְוֺתָ֔י/ו וְ/שָׁמַרְתָּ֖ כָּל חֻקָּ֑י/ו כָּֽל הַ/מַּֽחֲלָ֞ה אֲשֶׁר שַׂ֤מְתִּי בְ/מִצְרַ֨יִם֙ לֹא אָשִׂ֣ים עָלֶ֔י/ךָ כִּ֛י אֲנִ֥י יְהוָ֖ה רֹפְאֶֽ/ךָ־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/026.yaml
  text: He said[a], “If you diligently listen to the voice of Yahweh your God, and do what is right in his eyes, and give ear to his commandments, and keep all his statutes, I will put none of the diseases on you that I put on Egypt, for I am Yahweh, your healer.”
translation:
  language: sw
  text: Akasema, “Ikiwa utasikiliza kwa bidii sauti ya Yahwe Mungu wako, na kufanya yaliyo sawa machoni pake, na kusikiliza kwa makini amri zake, na kushika kanuni zake zote, sitakuleta ugonjwa wowote kati ya magonjwa niliyoweka juu ya Misri; kwa maana mimi ni Yahwe, mponyaji wako.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana mimi ni Yahwe anayekuponya.”
    reason: Kishirikishi רֹפְאֶךָ kinaweza kutafsiriwa kwa mtindo wa nomino, “mponyaji wako,” au kwa mtindo wa kitenzi, “anayekuponya.”
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: utaisikiliza kwa bidii
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichokamilishwa unasisitiza tendo la kusikiliza. ‘Kwa bidii’ huhifadhi msisitizo huo pamoja na wazo la kusikiliza kwa uangalifu unaoelekea kwenye utii.
- source_word: לְקוֹל
  choice: sauti ya
  rationale: Neno קוֹל humaanisha ‘sauti’; usemi ‘kusikiliza sauti ya’ unaeleweka katika Kiswahili na huhifadhi picha ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יְהוָה limetoholewa moja kwa moja kuwa ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi usemi wa agano na nafsi ya pili umoja.
- source_word: וְהַיָּשָׁר בְּעֵינָיו
  choice: na kufanya yaliyo sawa machoni pake
  rationale: Huhifadhi nahau ya Kiebrania ‘yaliyo sawa machoni pake’ na maana yake ya kimaadili bila kuibadili kuwa ‘yanayompendeza.’
- source_word: וְהַאֲזַנְתָּ
  choice: na kuyasikiliza kwa makini
  rationale: Hifili ya אזן ina maana ya kuelekeza sikio au kusikiliza kwa makini; kauli hii ni ya asili katika Kiswahili na huitofautisha kwa kiasi na שׁמע iliyotangulia.
- source_word: לְמִצְוֺתָיו
  choice: maagizo yake
  rationale: מִצְוֹת ni amri au maagizo yenye mamlaka. ‘Maagizo’ ni ya kawaida na yenye hadhi katika Kiswahili cha sasa.
- source_word: וְשָׁמַרְתָּ כָּל חֻקָּיו
  choice: na kushika masharti yake yote
  rationale: שׁמר katika muktadha wa sheria ni ‘kushika/kuzingatia,’ na חֻקִּים ni masharti au kanuni zilizowekwa. ‘Kushika masharti’ huhifadhi mtindo wa kiagano kwa Kiswahili kinachoeleweka.
- source_word: כָּל הַמַּחֲלָה
  choice: ugonjwa wowote
  rationale: Umoja wa kijumla wenye כָּל umetafsiriwa kwa njia ya kawaida ya Kiswahili kuwa ‘ugonjwa wowote,’ bila kuufanya ugonjwa mmoja maalumu.
- source_word: אֲשֶׁר שַׂמְתִּי בְמִצְרַיִם ... לֹא אָשִׂים עָלֶיךָ
  choice: sitakutia ugonjwa wowote nilioutia Misri
  rationale: ‘Kutia’ huhifadhi urudiaji wa שׂים (‘kuweka/kutia’) katika sehemu zote mbili na pia muundo wa ahadi yenye sharti.
- source_word: רֹפְאֶךָ
  choice: mponyaji wako
  rationale: Kivumishi-tendaji cha Kiebrania kinaweza kuwa nomino ‘mponyaji wako’ au kauli ‘anayekuponya.’ Matini kuu huhifadhi mtindo wa jina au sifa ya agano, huku tanbihi ikitoa uwezekano wa kitenzi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia jina la agano moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Asili ya ahadi kuhusu ugonjwa
  choice: Ahadi ya agano yenye sharti, inayohusishwa na kusikiliza na kutii
  alternative: Dhamana ya jumla kwamba kila mtu mwaminifu ataponywa kimwili katika kila hali
  rationale: Sentensi yenyewe inaanza na sharti na inarejelea magonjwa yaliyotiwa Misri. Tafsiri haipanui kauli hii kuwa dhamana isiyo na masharti wala kuifanya kuwa ya kiroho tu.
- issue: Maana ya רֹפְאֶךָ
  choice: mponyaji wako
  alternative: anayekuponya
  rationale: Umbo la kishirikishi linaweza kueleweka kama jina linalomtambulisha Yahwe au kama tendo linaloendelea. Matini kuu na tanbihi huhifadhi uwezekano huo bila kuufunga kwa upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nafsi ya pili umoja imedumishwa kote kwa sababu Kiebrania humwelekea Israeli kama umoja. Nahau ‘machoni pake’ imehifadhiwa kwa kuwa inaeleweka na haifichi mtazamo wa kimaadili wa matini.
