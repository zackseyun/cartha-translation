id: EXO.15.1
reference: Exodus 15:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אָ֣ז יָשִֽׁיר מֹשֶׁה֩ וּ/בְנֵ֨י יִשְׂרָאֵ֜ל אֶת הַ/שִּׁירָ֤ה הַ/זֹּאת֙ לַֽ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֵ/אמֹ֑ר אָשִׁ֤ירָה לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: sw
  text: 'Ndipo Musa na wana wa Israeli wakamwimbia Yahweh[a] wimbo huu, wakisema: “Nitamwimbia Yahweh, kwa maana ametukuka sana[b]; farasi na mpandaji wake amewatupa baharini.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH (kwa kawaida hutafsiriwa “BWANA”; pia “Yahweh”).'
    reason: alternative_reading
  - marker: b
    text: Au, “ameshinda kwa utukufu”; Kiebrania kinasisitiza kitenzi kwa kurudia umbo lake.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Ni kiashiria cha wakati kinachoendeleza simulizi baada ya kuvuka bahari; “Ndipo” ni cha kawaida na huhifadhi mfuatano.
- source_word: יָשִׁיר
  choice: wakamwimbia
  rationale: Ingawa kimaumbo ni hali isiyotimilika, baada ya אָז katika simulizi ina maana ya tendo lililopita. Muundo huu pia huonyesha kwamba wimbo unaelekezwa kwa Yahweh.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi usemi wa Kiebrania unaomaanisha wazao wa Israeli, bila kuwalenga watoto kwa umri.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: wimbo huu
  rationale: Tafsiri ya moja kwa moja isiyoongeza maelezo ya kiufafanuzi.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Huwakilisha jina la agano יהוה kama jina maalumu badala ya cheo.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: wakisema
  rationale: Ni utangulizi wa kawaida na wa asili wa maneno yanayonukuliwa katika Kiswahili, bila uradidi usio wa lazima wa “wakasema, wakisema.”
- source_word: אָשִׁירָה
  choice: Nitamwimbia
  rationale: Huhifadhi azimio la nafsi ya kwanza umoja na mabadiliko kutoka kundi linaloimba hadi sauti ya kishairi ya umoja.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutanguliza sababu ya kumwimbia Yahweh kwa lugha ya heshima na ya kawaida.
- source_word: גָאֹה גָּאָה
  choice: ametukuka sana
  rationale: Huhifadhi wazo la kuinuka au kutukuka pamoja na mkazo wa muundo uliorudiwa wa Kiebrania, bila kulazimisha maana ya ushindi pekee.
- source_word: סוּס וְרֹכְבוֹ
  choice: farasi na mpandaji wake
  rationale: Huhifadhi umoja wa kishairi na kiambishi cha umilikaji; nomino za umoja zinaweza kutumiwa kwa maana ya kijumla.
- source_word: רָמָה
  choice: amewatupa
  rationale: Huonyesha tendo la kuwatupa kwa nguvu linaloelekezwa kwa farasi na mpandaji wake; kiambishi cha ngeli ya watu hufuata nomino iliyo karibu “mpandaji” katika Kiswahili cha asili.
- source_word: בַיָּם
  choice: baharini
  rationale: Huonyesha mahali walipotupwa kwa ufupi na kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina maalumu la agano, huku tanbihi ikitaja desturi nyingine ya kulitafsiri.
- issue: Maana ya גָאֹה גָּאָה
  choice: ametukuka sana
  alternative: ameshinda kwa utukufu
  rationale: Mzizi unaweza kueleza kuinuka au kutukuka, na kurudiwa kwa umbo la kitenzi huongeza mkazo. Tafsiri kuu huhifadhi upana huo; mbadala wa ushindi unaendana na muktadha wa bahari lakini ni mahususi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Ndipo” na “kwa maana” hudumisha mfuatano na ladha ya wimbo; “wakisema” huepuka uradidi usio wa asili.
