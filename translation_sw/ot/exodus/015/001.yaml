  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: kiashiria cha wakati, Musa pamoja na wana wa Israeli, wimbo unaoelekezwa kwa Yahweh, sauti ya umoja katika mstari wa wimbo, msisitizo wa גָאֹה גָּאָה, na taswira ya farasi pamoja na mpandaji wake kutupwa baharini. “Ametukuka sana” ni chaguo pana na salama kwa kauli yenye mkazo, bila kuifunga kwa maana ya ushindi pekee.'
  naturalness: Kiswahili ni sanifu, cha asili, na kina hadhi inayofaa wimbo wa kibiblia. “Ndipo,” “wakisema,” na “kwa maana” vinaunganisha simulizi na nukuu kwa ufasaha. “Musa na wana wa Israeli wakamwimbia Yahweh wimbo huu” ni muundo unaokubalika na unaoeleweka.
  terminology: “Yahweh” hutumiwa kwa uthabiti kwa יהוה, kulingana na uamuzi wa mradi. “Wana wa Israeli,” “mpandaji wake,” na “baharini” ni istilahi sahihi na za kawaida. Tanbihi zote mbili zinaendana na alama zake na zinaeleza kwa usahihi jina la Kiebrania na msisitizo wa kitenzi.
