base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/016.yaml
  text: Terror and dread will fall on them[a]; by the greatness of your arm they will be still as a stone, until your people pass by, O Yahweh[c][b], until this people whom you acquired pass by.
translation:
  language: sw
  text: Hofu kuu na woga vitawaangukia; kwa ukuu wa mkono wako watakuwa tuli kama jiwe, mpaka watu wako wapite, Ee Yahweh, mpaka wapite watu hawa uliowajipatia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watakaa kimya” au “hawatasonga,” badala ya “watakuwa tuli.”
    reason: lexical_alternative
  - marker: b
    text: “Uliowajipatia” pia yaweza kutafsiriwa “uliowanunua” au, kwa maana pana ya agano, “uliowafanya kuwa wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפֹּל עֲלֵיהֶם אֵימָתָה וָפַחַד
  choice: Hofu kuu na woga vitawaangukia
  rationale: Muundo huu unahifadhi picha ya hofu na woga kuwaangukia mataifa. “Hofu kuu” na “woga” zinatofautisha nomino mbili zinazokaribiana bila kuondoa msisitizo wa kishairi.
- source_word: בִּגְדֹל זְרוֹעֲךָ
  choice: kwa ukuu wa mkono wako
  rationale: Tafsiri hii inadumisha sitiari ya mkono kama nguvu inayotenda na pia maana ya ב kama njia au msingi.
- source_word: יִדְּמוּ כָּאָבֶן
  choice: watatulia kama jiwe
  rationale: “Watatulia” huhifadhi upana wa kitenzi, ambacho kinaweza kumaanisha kukaa kimya au kutosonga; “kama jiwe” inadumisha tashbihi ya Kiebrania.
- source_word: עַד יַעֲבֹר
  choice: mpaka ... wapite
  rationale: “Wapite” ni usemi wa kawaida wa Kiswahili na hauamui bila lazima ikiwa ni kuvuka mpaka fulani au kupita katika eneo.
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la agano limetolewa kama jina binafsi “Yahwe,” huku “Ee” ikionyesha namna ya kumwita moja kwa moja katika wimbo.
- source_word: עַם זוּ קָנִיתָ
  choice: watu hawa uliowapata kuwa wako
  rationale: Hii inadumisha demonstrativi “hawa” na maana pana ya קנה ya kujipatia au kupata kuwa mali yako, bila kuibana kuwa kununua kwa malipo.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahwe” hulihifadhi moja kwa moja.
- issue: Maana ya קָנִיתָ katika muktadha wa agano
  choice: uliowapata kuwa wako
  alternative: uliowanunua; uliowaumba; uliowafanya kuwa wako
  rationale: Chaguo hili linaonyesha upataji na umilikaji wa kiagano bila kuingiza kwa lazima wazo mahususi la bei ya ununuzi au uumbaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Marudio ya “mpaka ... wapite” yamehifadhiwa kwa sababu ni sehemu ya muundo na msisitizo wa wimbo.
