base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/010.yaml
  text: You blew with your wind; the sea covered them[a]. They sank like lead in mighty waters.
translation:
  language: sw
  text: Ulivuma kwa upepo wako; bahari ikawafunika[a]. Walizama kama risasi katika maji makuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa pumzi yako.” Neno la Kiebrania linaweza kumaanisha “upepo,” “pumzi,” au “roho”; hapa muktadha wa kuvuka bahari unapendelea “upepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁפְתָּ
  choice: Ulivuma
  rationale: Kitenzi hiki humaanisha kuvuma au kupuliza. Katika ushairi huu, “ulivuma” ni usemi wa asili kwa upepo huku ukidumisha picha ya tendo la Mungu juu ya bahari.
- source_word: בְרוּחֲךָ
  choice: kwa upepo wako
  rationale: רוּחַ linaweza kumaanisha upepo, pumzi, au roho. Muktadha wa kuvuka bahari na kitenzi “ulivuma” unapendelea “upepo”; “pumzi” imehifadhiwa katika tanbihi kama uwezekano halisi.
- source_word: כִּסָּמוֹ יָם
  choice: bahari ikawafunika
  rationale: Kitenzi כסה ni “funika,” na kiambishi kinarejelea wingi wa kiume. Tafsiri hii ni ya moja kwa moja na haisisitizi zaidi ya maandishi.
- source_word: צָלֲלוּ
  choice: Walizama
  rationale: Katika muktadha huu, צלל hueleza kushuka na kuzama majini; “walizama” ni Kiswahili cha kawaida na kinapatana na tashbihi inayofuata.
- source_word: כָּעוֹפֶרֶת
  choice: kama risasi
  rationale: עוֹפֶרֶת ni metali ya risasi. Usemi huu unadumisha tashbihi ya uzito na kuzama.
- source_word: בְּמַיִם אַדִּירִים
  choice: katika maji yenye nguvu
  rationale: אַדִּירִים hubeba maana ya nguvu, uweza, au ukuu. “Maji yenye nguvu” ni wazi katika Kiswahili na huhifadhi nguvu ya kivumishi bila kukibadili kuwa “kina,” jambo ambalo si maana yake ya moja kwa moja hapa.
theological_decisions:
- issue: Maana ya רוּחַ katika muktadha wa kishairi wa tendo la Mungu
  choice: upepo
  alternative: pumzi; roho
  rationale: Muktadha wa kushindwa kwa Wamisri baharini na kitenzi cha kuvuma unapendelea upepo au picha ya pumzi, si rejeo la wazi kwa Roho wa Mungu. Matini kuu inatumia “upepo,” huku tanbihi ikihifadhi “pumzi” ili kutatua maana hiyo kwa tahadhari bila kuondoa utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio mfupi wa vishazi na tashbihi ya “kama risasi” huhifadhi nguvu na mwendo wa mstari wa Kiebrania.
