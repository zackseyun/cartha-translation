base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/004.yaml
  text: Pharaoh’s chariots and his army he cast into the sea[a], and the choicest of his officers were sunk in the Sea of Reeds.
translation:
  language: sw
  text: Magari ya vita ya Farao na jeshi lake, alitupa baharini; maafisa wake wateule walizamishwa katika Bahari ya Matete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kijadi hutafsiriwa “Bahari ya Shamu.” Kiebrania kinasema “Bahari ya Matete.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְכְּבֹת
  choice: magari ya vita
  rationale: Neno hili linamaanisha magari ya Farao yaliyotumiwa vitani; “magari ya vita” ni Kiswahili cha sasa kinachoeleweka wazi.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki katika Kiswahili.
- source_word: וְחֵילוֹ
  choice: na jeshi lake
  rationale: Katika muktadha huu חַיִל humaanisha nguvu ya kijeshi, si mali wala uwezo kwa ujumla.
- source_word: יָרָה
  choice: alitupa
  rationale: Kitenzi hiki kina maana ya kutupa au kurusha; “alitupa” kinahifadhi nguvu ya taswira bila kuongeza maelezo yasiyokuwapo.
- source_word: בַיָּם
  choice: baharini
  rationale: Pamoja na “alitupa,” umbo hili linaeleza kwa kawaida mwendo wa kuingia baharini.
- source_word: וּמִבְחַר
  choice: walio bora kabisa
  rationale: Neno hili hueleza walioteuliwa kuwa bora au waliokuwa chaguo la kwanza.
- source_word: שָׁלִשָׁיו
  choice: maafisa wake
  rationale: שָׁלִישׁ humaanisha maafisa wa kijeshi wenye cheo, mara nyingi waliohusishwa na vikosi vya magari; “maafisa” huepuka kubainisha cheo kisichotajwa kwa uhakika.
- source_word: טֻבְּעוּ
  choice: walizamishwa
  rationale: Umbo la Kiebrania ni la kutendwa na hueleza kutiwa chini ya maji; “walizamishwa” linahifadhi hali hiyo kuliko kusema tu kwamba walizama au walikufa maji.
- source_word: בְיַם סוּף
  choice: katika Bahari ya Matete
  rationale: Maana ya moja kwa moja ya יַם סוּף ni “Bahari ya Matete”; tafsiri ya kimapokeo imewekwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya יַם סוּף
  choice: Bahari ya Matete
  alternative: Bahari ya Shamu
  rationale: Kwa kuupa ushahidi wa lugha asili kipaumbele, maandishi makuu yanafuata maana ya moja kwa moja ya Kiebrania, huku jina la kimapokeo likihifadhiwa katika tanbihi kwa ajili ya utambuzi wa msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa maneno unadumisha mkazo wa shairi juu ya magari ya vita na jeshi, bila kumtaja Mungu kwa jina mahali ambapo Kiebrania kina kiima kilichodokezwa tu.
