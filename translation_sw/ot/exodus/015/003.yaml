lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti YHWH limetoholewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA,” ili kuhifadhi jina la kibinafsi lililo katika maandishi ya Kiebrania.
- source_word: אִישׁ מִלְחָמָה
  choice: shujaa wa vita
  rationale: Kirai hiki ni, kwa muundo wa moja kwa moja, “mtu/mwanamume wa vita,” lakini katika muktadha wa wimbo wa ushindi kinamaanisha mpiganaji hodari. “Shujaa wa vita” ni Kiswahili cha kawaida, chenye hadhi, kinachohifadhi taswira ya vita bila kuleta ugumu wa kirai kisicho cha kawaida “mtu wa vita.”
- source_word: מִלְחָמָה
  choice: vita
  rationale: Neno hili hurejelea vita au mapigano; “vita” linafaa katika kirai hiki cha kishairi na katika muktadha wa ushindi juu ya jeshi la Misri.
- source_word: שְׁמוֹ
  choice: ndilo jina lake
  rationale: Kiebrania kina kishazi kisicho na kitenzi, “YHWH jina lake.” “Ndilo jina lake” huingiza kiunganishi kinachohitajika katika Kiswahili na kuhifadhi msisitizo wa jina lililotangulizwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni, si cheo. “Yahwe” huhifadhi jina hilo; tanbihi inataja matoleo mengine yanayotumiwa kwa kawaida bila kuyachanganya na maandishi makuu.
- issue: Iwapo אִישׁ מִלְחָמָה litafsiriwe kwa muundo wa moja kwa moja au kama nahau
  choice: shujaa wa vita
  alternative: mtu wa vita
  rationale: “Shujaa wa vita” hutoa maana ya nahau kwa Kiswahili cha asili huku ikiendeleza taswira ya kishairi ya mpiganaji. Tanbihi huhifadhi muundo wa karibu zaidi na Kiebrania, hivyo mvutano kati ya umbo na maana haujafichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa kishairi na wenye hadhi. “Shujaa wa vita” ni wazi kwa wasomaji wa kawaida, na “ndilo jina lake” huhifadhi msisitizo wa kishazi cha Kiebrania.
