translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi inayofaa matini ya Biblia. ‘Mara’ limetumiwa kama umbo la jina la mahali lililozoeleka katika tafsiri za Kiswahili; tanbihi huhifadhi maelezo ya mchezo wa maneno wa Kiebrania.
