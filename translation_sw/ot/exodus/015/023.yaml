base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/023.yaml
  text: Then they came to Marah[a], but they could not drink the water from Marah because it was bitter. Therefore it was named Marah.
translation:
  language: sw
  text: Kisha wakafika Mara[a], lakini hawakuweza kunywa maji ya Mara kwa sababu yalikuwa machungu. Ndiyo maana mahali hapo pakaitwa Mara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Mara linasikika kama neno la Kiebrania linalomaanisha “machungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kisha wakafika
  rationale: Muundo wa wayyiqtol wa בוא unaendeleza simulizi kwa tukio linalofuata; ‘Kisha wakafika’ ni Kiswahili cha kawaida kinachoonyesha mfuatano huo.
- source_word: מָרָתָה
  choice: Mara
  rationale: Jina la mahali lenye he ya kuelekea linaonyesha mwendo hadi Mara; kitenzi ‘wakafika’ tayari huwasilisha wazo la kufika mahali hapo bila kuhitaji kihusishi.
- source_word: וְלֹא יָכְלוּ
  choice: lakini hawakuweza
  rationale: Kiunganishi hapa kinaonyesha tofauti kati ya kufika na kutoweza kunywa; ‘lakini’ huwasilisha uhusiano huo kwa uwazi na kwa kawaida.
- source_word: לִשְׁתֹּת מַיִם
  choice: kunywa maji
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kishazi hicho katika Kiswahili.
- source_word: מִמָּרָה
  choice: ya Mara
  rationale: מן huonyesha chanzo cha maji. Katika Kiswahili, ‘maji ya Mara’ hueleweka kwa kawaida kuwa maji yaliyopatikana mahali hapo.
- source_word: כִּי מָרִים הֵם
  choice: kwa sababu yalikuwa machungu
  rationale: 'כִּי ina nguvu ya kisababishi. Kivumishi cha Kiebrania kiko katika wingi kwa kupatana na מַיִם; Kiswahili pia hutumia upatanisho wa wingi wa ngeli ya maji: ‘yalikuwa machungu.’'
- source_word: עַל כֵּן
  choice: Ndiyo maana
  rationale: Usemi huu wa kawaida unaonyesha hitimisho linaloeleza sababu ya jina.
- source_word: קָרָא שְׁמָהּ מָרָה
  choice: mahali hapo pakaitwa Mara
  rationale: Kitenzi cha nafsi ya tatu umoja hakina mtendaji aliyetajwa, hivyo ujenzi wa kutendwa unafaa. ‘Mahali hapo’ huweka wazi kinachopewa jina kwa Kiswahili cha kawaida bila kumtambua mtendaji ambaye maandishi hayamtaji.
- source_word: מָרָה / מָרִים
  choice: Mara / machungu
  rationale: Jina la mahali limetoholewa kama ‘Mara,’ huku kivumishi kikitafsiriwa ‘machungu.’ Tanbihi inaeleza mchezo wa maneno ambao hauwezi kuhifadhiwa kikamilifu katika matini kuu ya Kiswahili.
