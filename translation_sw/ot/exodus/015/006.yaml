base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/006.yaml
  text: Your right hand[a], O Yahweh, is majestic in power; your right hand, O Yahweh[c][b], shatters the enemy.
translation:
  language: sw
  text: Mkono wako wa kuume, Ee Yahwe[a], umetukuka kwa nguvu; mkono wako wa kuume, Ee Yahwe, unamponda adui.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH; kwa desturi limetafsiriwa “BWANA.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “unamvunja-vunja adui.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִינְךָ
  choice: mkono wako wa kuume
  rationale: Neno יָמִין lina maana halisi ya mkono au upande wa kuume, na katika wimbo huu linaashiria pia nguvu na tendo la ushindi. Taswira halisi imehifadhiwa.
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe”; kihisishi “Ee” kinaonyesha usemi wa moja kwa moja unaoonekana katika kurudiwa kwa jina hilo.
- source_word: נֶאְדָּרִי
  choice: umetukuka
  rationale: Kitenzi hiki kutoka אדר huonyesha ukuu, fahari au utukufu. “Umetukuka” ni lugha ya kishairi yenye hadhi na inafanya kazi kwa kawaida na kiima “mkono.”
- source_word: בַּכֹּחַ
  choice: kwa nguvu
  rationale: כֹּחַ humaanisha nguvu au uwezo. “Kwa nguvu” huhifadhi uhusiano wa kihusishi bila kupanua maana.
- source_word: תִּרְעַץ
  choice: unamponda
  rationale: רָעַץ humaanisha kuponda, kuvunja-vunja au kuseta. “Unamponda” ni Kiswahili cha sasa kinachoonyesha nguvu na ukamilifu wa ushindi.
- source_word: אוֹיֵב
  choice: adui
  rationale: Nomino ya Kiebrania iko katika umoja na inaweza kumaanisha adui maalumu au adui kwa maana ya jumla. Umoja umehifadhiwa bila kulazimisha ufafanuzi wa ziada.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה, si cheo. “Yahwe” huhifadhi jina hilo, huku tanbihi ikitaja desturi nyingine ya kulitafsiri.
- issue: Taswira ya mkono wa kuume
  choice: mkono wako wa kuume
  alternative: nguvu zako
  rationale: Taswira halisi ya kishairi imehifadhiwa badala ya kufasiriwa moja kwa moja kuwa nguvu, hivyo maana ya nguvu na tendo la ushindi hubaki ndani ya sitiari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wenye hadhi lakini unaoeleweka kwa urahisi. Marudio ya “mkono wako wa kuume, Ee Yahwe” yamehifadhiwa kwa sababu ni sehemu muhimu ya usambamba na msisitizo wa wimbo.
