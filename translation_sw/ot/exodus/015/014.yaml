base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/014.yaml
  text: The peoples heard; they trembled[a]. Anguish seized the inhabitants of Philistia.
translation:
  language: sw
  text: Mataifa yalisikia; yakatetemeka[a]. Uchungu uliwashika wakaaji wa Ufilisti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mataifa yamesikia; yanatetemeka. Kutetemeka kumewashika wakaaji wa Ufilisti.” Ushairi wa Kiebrania unaweza kuwa na maana hai ya sasa au inayotazamia mbele, pamoja na maana rahisi ya wakati uliopita.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: yalisikia
  rationale: Qal timilifu nafsi ya tatu wingi ya שׁמע. Wakati uliopita unafaa mfuatano wa kishairi, huku ngeli ya 'mataifa' ikihitaji upatanisho wa 'ya-'.
- source_word: עַמִּים
  choice: mataifa
  rationale: Wingi wa עם unarejelea makundi ya watu yanayozunguka. 'Mataifa' ni Kiswahili cha kawaida na cha heshima kinachohifadhi wingi bila kulazimisha maana ya kisiasa ya nchi.
- source_word: יִרְגָּזוּ/ן
  choice: yakatetemeka
  rationale: Mzizi רָגַז unaweza kumaanisha kutetemeka, kutikisika, au kufadhaika. 'Yakatetemeka' huonyesha hofu yenye athari ya kimwili; ka- ya masimulizi huendeleza kwa ufasaha tendo baada ya kusikia.
- source_word: חִיל
  choice: uchungu
  rationale: Nomino hii inaweza kumaanisha maumivu makali, kuhangaika kama kwa uchungu wa kuzaa, au kutetemeka. 'Uchungu' huhifadhi dhiki ya mwili na hisia bila kubainisha moja kwa moja taswira ya kujifungua.
- source_word: אָחַז
  choice: uliwashika
  rationale: Qal timilifu ya אחז, 'kushika' au 'kukamata.' Katika Kiswahili, 'uchungu uliwashika' ni usemi wa asili unaodumisha nguvu ya hali iliyowatawala ghafla.
- source_word: יֹשְׁבֵי
  choice: wakaaji wa
  rationale: Kitenzi-partisipio cha ישׁב kimetumiwa kama nomino kwa wakazi. 'Wakaaji wa' ni lugha ya sasa, ya kawaida, na sahihi katika uhusiano huu.
- source_word: פְּלָשֶׁת
  choice: Ufilisti
  rationale: Jina la eneo la Wafilisti, si jina la kundi la watu lenyewe. 'Ufilisti' hutofautisha nchi na 'Wafilisti'.
theological_decisions:
- issue: Mfuatano wa nyakati katika ushairi wa Kiebrania
  choice: Wakati uliopita katika mstari mkuu, pamoja na tanbihi inayotaja uwezekano wa maana hai ya sasa au inayotazamia mbele
  alternative: Mataifa yamesikia; yanatetemeka. Kutetemeka kumewashika wakaaji wa Ufilisti.
  rationale: שָׁמְעוּ na אָחַז ni maumbo timilifu, huku יִרְגָּזוּן ikiwa umbo lisilotimilifu. Wimbo unaweza kusimulia kwa kinabii na kwa uhai matukio yanayoendelea au yajayo. Tafsiri kuu ya wakati uliopita ni ya asili katika simulizi, lakini tanbihi huhifadhi mvutano huo wa kishairi bila kuutatua kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. 'Mataifa' na 'wakaaji' vinaeleweka kwa wasomaji wa kawaida; 'Ufilisti' linatunza tofauti kati ya eneo na watu wake. Alama ya tanbihi [a] imewekwa baada ya 'yakatetemeka'.
