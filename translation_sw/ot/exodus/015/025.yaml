base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/025.yaml
  text: So he cried out to the LORD, and the LORD showed him a tree. He threw it into the water, and the water became sweet. There he made for them a statute and a judgment, and there he tested them.
translation:
  language: sw
  text: Basi Musa akamlilia BWANA, naye BWANA akamwonyesha mti. Musa akautupa ndani ya maji, nayo maji yakawa matamu. Hapo akaweka kwa ajili yao amri na hukumu, na hapo akawajaribu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵץ (ʿēṣ)
  choice: mti
  rationale: Neno hili kwa kawaida humaanisha mti, ingawa katika muktadha linaweza pia kumaanisha kipande cha mti au kuni. Tafsiri ya moja kwa moja “mti” inalinda upana wa maana ya Kiebrania.
- source_word: וַיִּמְתְּקוּ הַמָּיִם (wayyimteqū hammāyim)
  choice: maji yakawa matamu
  rationale: Huhifadhi taswira halisi ya maji kubadilika kutoka uchungu kuwa utamu, bila kufafanua tu kuwa yalifaa kunyweka.
- source_word: חֹק וּמִשְׁפָּט (ḥōq ūmišpāṭ)
  choice: amri na hukumu
  rationale: “Amri” huwakilisha sharti au kanuni iliyowekwa, na “hukumu” huhifadhi neno la pili lenye wigo wa uamuzi, sheria, au utaratibu wa haki.
- source_word: נִסָּהוּ (nissāhū)
  choice: akawajaribu
  rationale: Kiwakilishi cha umoja katika Kiebrania kinaweza kumrejelea Israeli kama jumuiya; Kiswahili cha wingi kinaeleweka kiasili kwa kurejelea watu waliotajwa katika muktadha.
theological_decisions:
- issue: Mtendaji wa vitenzi “akawekea” na “akawajaribu”
  choice: BWANA
  alternative: Musa
  rationale: Kisarufi, kiima kinaweza kuonekana kuwa mhusika wa karibu, Musa, lakini mfuatano wa simulizi na matumizi ya kawaida ya Mungu kuweka amri na kuwajaribu watu yanaelekeza kwa BWANA. Kutaja “BWANA” huondoa utata wa viwakilishi unaoweza kupotosha katika Kiswahili.
- issue: Mlengwa wa amri na hukumu
  choice: akawawekea
  alternative: akamwekea
  rationale: Kiebrania kina kiambishi cha umoja “kwa ajili yake,” ambacho kinaweza kumaanisha Israeli kama umoja wa kijumuiya. Kiswahili hutumia wingi kwa kawaida kwa taifa kama watu katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka. Jina la agano יהוה limetafsiriwa kwa desturi ya “BWANA.” “Basi” linaendeleza uhusiano wa tukio hili na malalamiko yaliyotangulia.
