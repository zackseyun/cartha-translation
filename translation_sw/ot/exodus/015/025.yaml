  verdict: revise
  source_fidelity: Rasimu inatafsiri kwa uaminifu tendo la Musa kumlilia BWANA, BWANA kumwonyesha mti, na mti kutupwa majini hata maji yakawa matamu. Hata hivyo, kutaja BWANA waziwazi kama mtendaji wa kuweka sheria na hukumu na wa kujaribu watu huondoa utata wa kiima uliopo katika Kiebrania (שָׂם ... נִסָּהוּ), ilhali Kiingereza cha POB kinauhifadhi kwa “he.”
  naturalness: Kiswahili ni sanifu, cha asili, na kina mtiririko mzuri. “Maji yakawa matamu” na “mti” ni chaguo wazi na ya kawaida. Muundo wa “Hapo akaweka ... akawajaribu” ni wa kiasili, ingawa kiima chake kinahitaji kubaki bila kutajwa ili lisilazimishe tafsiri moja ya utata wa matini.
  terminology: “BWANA” ni uwasilishaji unaokubalika wa יהוה katika rejista ya Biblia ya Kiswahili. “Amri na hukumu” huwasilisha חֹק וּמִשְׁפָּט kwa ukaribu wa kutosha; “akawawekea” huieleza Israeli kama jumuiya ya watu, ingawa Kiebrania hutumia kiwakilishi cha umoja wa kijumuiya.
  issues:
