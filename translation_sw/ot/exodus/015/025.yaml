    rationale: Kiebrania hakimtaji tena mtendaji katika “hapo akaweka kwa ajili yake sheria na hukumu, na hapo akamjaribu.” Ingawa kumrejelea BWANA kunaungwa mkono na muktadha, kumtaja wazi kunasuluhisha utata ambao matini na audit trail ya Kiingereza huacha wazi. Tafsiri inapaswa kuacha kiima bila kutajwa.
