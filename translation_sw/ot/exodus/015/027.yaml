  yaml_path: translation/ot/exodus/015/027.yaml
  text: Then they came to Elim[a], where there were twelve springs of water and seventy palm trees[c][b], and they camped there by the water.
translation:
  language: sw
  text: Kisha wakafika Elimu[a], ambako palikuwa na chemchemi kumi na mbili za maji na mitende sabini[b]. Wakapiga kambi huko kando ya maji[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nao wakafika Elimu, na huko palikuwa na chemchemi kumi na mbili za maji na mitende sabini.”
    reason: lexical_alternative
  - marker: b
    text: “Mitende” inaweza kutafsiriwa kwa umahususi zaidi kuwa “mitende ya tende.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kando ya hayo maji.” Neno la Kiebrania linalotafsiriwa “maji” lina umbo la wingi, ambalo mara nyingi hutumika kwa maana ya ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kisha wakafika
  rationale: Umbo la wayyiqtol linaendeleza mfululizo wa simulizi. “Kisha wakafika” ni Kiswahili cha kawaida kinachoonyesha tukio lililofuata.
- source_word: אֵילִמָה
  choice: Elimu
  rationale: Jina la mahali limetoholewa kwa Kiswahili; he ya kuelekeza imewakilishwa na kitenzi “wakafika,” ambacho tayari kina maana ya kufika mahali.
- source_word: וְשָׁם
  choice: ambako palikuwa na
  rationale: Maana ya msingi ni “na huko,” lakini “ambako palikuwa na” huunganisha sentensi kwa Kiswahili cha asili huku ikihifadhi maana ya mahali.
- source_word: שְׁתֵּים עֶשְׂרֵה עֵינֹת מַיִם
  choice: chemchemi kumi na mbili za maji
  rationale: עַיִן hapa ni chanzo cha maji, yaani chemchemi. Mpangilio huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וְשִׁבְעִים תְּמָרִים
  choice: na mitende sabini
  rationale: תְּמָרִים ni mitende, huenda hasa mitende ya tende. “Mitende” haiongezi umahususi usiolazimishwa na matini.
- source_word: וַיַּחֲנוּ
  choice: Wakapiga kambi
  rationale: Hii ni tafsiri ya sasa na ya kawaida ya חנה katika muktadha wa wasafiri wanaosimama na kuweka kambi.
- source_word: עַל הַמָּיִם
  choice: kando ya maji
  rationale: עַל katika muktadha huu huonyesha ukaribu na chanzo cha maji, si kuwa juu ya maji. “Kando ya maji” ni usemi wa asili wa Kiswahili.
