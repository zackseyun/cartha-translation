  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa kishairi, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Urudiaji wa wazo la kina umehifadhiwa, huku tofauti ya maneno mawili ya Kiebrania ikionyeshwa kwa ‘vilindi vya maji’ na ‘vilindini.’
