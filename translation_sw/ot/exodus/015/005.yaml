  text: The depths covered them[a]; they went down into the depths like a stone.
translation:
  language: sw
  text: Vilindi vya maji vikawafunika[a]; wakashuka vilindini kama jiwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maji ya kina kirefu yakawafunika; wakazama vilindini kama jiwe.”
    reason: Mbadala huu unaonyesha maana ya תְּהֹמֹת kama maji ya kina kirefu na kutafsiri יָרְדוּ kimuktadha kuwa ‘wakazama.’
lexical_decisions:
- source_word: תְּהֹמֹת
  choice: Vilindi vya maji
  rationale: Wingi wa תְּהוֹם humaanisha maji ya kina kirefu au vilindi. Tafsiri hii ni ya kawaida katika Kiswahili na inaweka wazi picha ya kishairi bila kuingiza dhana za ziada za kikosmolojia.
- source_word: יְכַסְיֻמוּ
  choice: vikawafunika
  rationale: Kitenzi כסה humaanisha ‘kufunika,’ na kiambishi cha nafsi ya tatu wingi kinawarejelea Wamisri. ‘Vikawafunika’ ni tafsiri ya moja kwa moja, huku kiambishi ‘vi-’ kikirejelea vilindi.
- source_word: יָרְדוּ
  choice: wakashuka
  rationale: Qal timilifu ya ירד humaanisha ‘kwenda chini’ au ‘kushuka.’ ‘Wakashuka’ huhifadhi taswira ya kushuka badala ya kufasiri moja kwa moja kuwa walizama.
- source_word: בִמְצוֹלֹת
  choice: vilindini
  rationale: מְצוֹלָה hurejelea sehemu za kina, hasa vilindi vya bahari. ‘Vilindini’ ni Kiswahili cha asili na huwasilisha mwendo wa kwenda ndani au chini kutokana na muktadha wa kitenzi.
- source_word: כְּמוֹ
  choice: kama
  rationale: Hiki ni kiunganishi cha ulinganisho; ‘kama’ ndilo chaguo la kawaida na wazi katika Kiswahili.
- source_word: אָבֶן
  choice: jiwe
  rationale: Nomino hii humaanisha ‘jiwe.’ Kiswahili hakihitaji kibainishi kisicho dhahiri kinacholingana na ‘a’ ya Kiingereza.
theological_decisions: []
