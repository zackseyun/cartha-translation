  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֣י בָא֩ ס֨וּס פַּרְעֹ֜ה בְּ/רִכְבּ֤/וֹ וּ/בְ/פָרָשָׁי/ו֙ בַּ/יָּ֔ם וַ/יָּ֧שֶׁב יְהוָ֛ה עֲלֵ/הֶ֖ם אֶת מֵ֣י הַ/יָּ֑ם וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֥וֹךְ הַ/יָּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/019.yaml
  text: For Pharaoh’s horses went into the sea with his chariots and with his horsemen[a], and Yahweh brought back the waters of the sea over them[b]; but the sons of Israel walked on dry ground through the midst of the sea.
translation:
  language: sw
  text: Kwa maana farasi wa Farao waliingia baharini pamoja na magari yake ya vita na wapanda-farasi wake[a], naye Yahwe akayarudisha maji ya bahari juu yao; lakini[b] Waisraeli walitembea katika nchi kavu katikati ya bahari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa uhalisi kina “farasi wa Farao ... gari lake la vita”; maneno ya umoja yanaweza kutumiwa kwa maana ya kijumla kuhusu farasi na magari ya vita ya Farao.
    reason: lexical_alternative
  - marker: b
    text: Au “na Waisraeli.” Kiunganishi cha Kiebrania ni “na”; “lakini” katika matini kuu huonyesha wazi utofauti uliopo katika muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kishazi hiki kinaeleza msingi wa wimbo uliotangulia; “Kwa maana” kinahifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: בָא
  choice: waliingia
  rationale: Pamoja na בַיָּם, kitenzi kinaonyesha mwendo wa kuingia ndani ya bahari; wingi unapatana na maana ya kijumla ya “farasi.”
- source_word: סוּס פַּרְעֹה
  choice: farasi wa Farao
  rationale: Ingawa סוּס ni umoja kimaumbo, hapa inaweza kuwa nomino ya kijumla inayomaanisha kikosi cha farasi wa Farao; Kiswahili “farasi” hakibadiliki katika umoja na wingi.
- source_word: בְּרִכְבּוֹ
  choice: pamoja na magari yake ya vita
  rationale: רכב ya umoja inaweza kutumiwa kwa maana ya kijumla kuhusu magari ya vita; tafsiri hii ni wazi na ya kawaida katika muktadha wa jeshi.
- source_word: וּבְפָרָשָׁיו
  choice: na wapanda-farasi wake
  rationale: Neno hilo linawahusu wapiganaji waliopanda farasi; “wapanda-farasi” ni sahihi na linaeleweka kwa urahisi.
- source_word: וַיָּשֶׁב יְהוָה
  choice: naye Yahwe akayarudisha
  rationale: Hifili ya שוב ina maana ya kusababisha yarudi; “akayarudisha” huhifadhi tendo na uhusika wa Mungu.
- source_word: עֲלֵהֶם אֶת מֵי הַיָּם
  choice: maji ya bahari juu yao
  rationale: Huhifadhi taswira halisi ya maji yakirudi na kuwafunika.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: lakini Waisraeli
  rationale: Kiunganishi cha Kiebrania ni “na,” lakini hapa kinaonyesha utofauti dhahiri; “Waisraeli” ni Kiswahili cha asili chenye maana ya wana wa Israeli.
- source_word: הָלְכוּ בַיַּבָּשָׁה בְּתוֹךְ הַיָּם
  choice: walitembea katika nchi kavu katikati ya bahari
  rationale: “Walitembea” huhifadhi kitenzi cha kawaida, na “katika nchi kavu katikati ya bahari” huonyesha hali ya sakafu ya bahari na mahali walipopitia.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja Tetragramatoni; “Yahwe” huhifadhi jina la agano bila kulibadilisha kuwa cheo.
- issue: Uhusika wa Mungu katika kurudi kwa maji
  choice: Yahwe akayarudisha maji
  alternative: maji yakarudi
  rationale: Muundo wa kisababishi katika Kiebrania unamtaja Yahwe wazi kuwa ndiye aliyesababisha maji yarudi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Magari ya vita” huepuka utata wa “magari” peke yake; “wapanda-farasi” ni neno wazi kwa mounted warriors. Alama zote za tanbihi zimewekwa katika matini kuu.
