base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/021.yaml
  text: 'And Miriam answered them: “Sing to Yahweh[a], for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: sw
  text: 'Miriamu akawajibu: “Mwimbieni Yahwe, kwa maana ametukuka sana[a]; farasi na mpandaji wake amewatupa baharini.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina usemi wa mkazo, kwa maana ya “ametukuka mno”; pia unaweza kutafsiriwa, “amejidhihirisha kuwa mkuu sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: akawajibu
  rationale: Kitenzi ענה kwa kawaida humaanisha ‘kujibu’ au ‘kuitikia.’ Katika muktadha wa wimbo kinaweza kudokeza uimbaji wa kuitikiana, lakini ‘akawajibu’ huhifadhi maana ya msingi bila kuondoa uwezekano huo.
- source_word: לָהֶם
  choice: wa- katika ‘akawajibu’
  rationale: Kiambishi cha Kiebrania ni wingi wa kiume, ambacho kinaweza kutumiwa kwa kundi kwa ujumla; Kiswahili hakilazimishi kubainisha jinsia hapa.
- source_word: מִרְיָם
  choice: Miriamu
  rationale: Umbo la jina lililozoeleka katika Kiswahili cha Biblia.
- source_word: שִׁירוּ
  choice: Mwimbieni
  rationale: Ni amri ya wingi ya ‘kuimba’; muundo wa Kiswahili ‘mwimbieni Yahwe’ unaonyesha wazi anayeelekezewa wimbo.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kama ‘Yahwe.’
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya mwito wa kuimba na linafaa katika lugha ya kishairi yenye hadhi.
- source_word: גָאֹה גָּאָה
  choice: ametukuka kwa ushindi
  rationale: Muundo wa kitenzi pamoja na kitenzi-jina cha mkazo huimarisha wazo la kutukuka. Katika wimbo wa ushindi, tafsiri hii huunganisha ukuu uliofunuliwa na ushindi bila kutumia urudiaji mgumu wa Kiebrania.
- source_word: סוּס וְרֹכְבוֹ
  choice: farasi na mpanda farasi wake
  rationale: Nomino ya umoja ina matumizi ya kijumla, na kiambishi katika ‘mpanda farasi wake’ humrejelea farasi.
- source_word: רָמָה
  choice: amewatupa
  rationale: Kitenzi humaanisha kutupa au kurusha. Kiambishi cha wingi katika Kiswahili hufuata jozi ya farasi na mpanda farasi, ingawa Kiebrania hutumia kitenzi cha umoja kwa usemi huo wa kijumla.
- source_word: בַיָּם
  choice: baharini
  rationale: Pamoja na kitenzi cha kutupa, ‘baharini’ huonyesha kwa kawaida mahali walipotupwa na matokeo ya mwendo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Aya inatumia moja kwa moja Tetragramatoni יהוה; ‘Yahwe’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya גָאֹה גָּאָה
  choice: ametukuka kwa ushindi
  alternative: ametukuka sana au amejiinua mno
  rationale: Muktadha wa Wimbo wa Bahari unaonyesha ukuu wa Yahwe uliodhihirika katika ushindi. Tafsiri hii huhifadhi wazo la kutukuka bila kuelekeza kauli kwenye dhana hasi ya kujikweza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini wa kawaida na unaoeleweka. ‘Akawajibu’ huhifadhi uwezekano wa mwitikio wa kimuziki; ‘mwimbieni’ ni amri ya wingi. Jina ‘Yahwe’ limetumiwa moja kwa moja.
