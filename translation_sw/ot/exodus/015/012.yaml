  yaml_path: translation/ot/exodus/015/012.yaml
  text: You stretched out your right hand[a]; the earth swallowed them.
translation:
  language: sw
  text: Ulinyoosha mkono wako wa kuume; dunia ikawameza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi ikawameza” au “ardhi ikawameza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָטִיתָ
  choice: Ulinyoosha
  rationale: Kitenzi cha Qal timilifu, nafsi ya pili umoja wa kiume, kinamwelekea Mungu moja kwa moja. “Ulinyoosha” ni Kiswahili cha kawaida kinachohifadhi tendo halisi la kishairi.
- source_word: יְמִינְךָ
  choice: mkono wako wa kuume
  rationale: Maana ya moja kwa moja ni “mkono wako wa kuume.” Ingawa katika ushairi wa Biblia mkono wa kuume huashiria nguvu, taswira halisi imehifadhiwa badala ya kufasiriwa kuwa “nguvu zako.”
- source_word: תִּבְלָעֵמוֹ
  choice: ikawameza
  rationale: Kitenzi בלע humaanisha “kumeza” au “kufunika kabisa.” Kiambishi cha yambwa kinawarejelea adui kwa wingi, na “dunia” ndiyo kiima. “Ikawameza” huhifadhi taswira hai na pia mtiririko wa matendo unaoeleweka kwa Kiswahili.
- source_word: אָרֶץ
  choice: dunia
  rationale: Neno אֶרֶץ linaweza kumaanisha “dunia,” “nchi,” au “ardhi.” Katika picha hii ya kishairi ya maadui kumezwa, “dunia” huhifadhi upana na uzito wa taswira, huku mbadala zikitajwa katika tanbihi.
theological_decisions:
- issue: Lugha ya kumwelezea Mungu kwa viungo vya kibinadamu
  choice: Kuhifadhi usemi halisi “mkono wako wa kuume.”
  alternative: “nguvu zako” au “mkono wako wenye nguvu”
  rationale: Kiebrania kinatumia taswira ya kishairi ya mkono wa kuume wa Mungu. Kuihifadhi hulinda nguvu ya kifasihi na kitheolojia ya mstari bila kuibadili kuwa maelezo ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; “mkono wa kuume” huhifadhi taswira ya chanzo, na “ikawameza” huunganisha tendo hili na tendo lililotangulia kwa mtiririko wa kawaida wa Kiswahili.
