  text: Watu wakalalamika dhidi ya Musa, wakisema, “Tutakunywa nini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: wakamlalamikia
  rationale: Kitenzi hiki katika simulizi za jangwani kinaonyesha malalamiko ya pamoja yaliyoelekezwa dhidi ya kiongozi. ‘Wakamlalamikia’ ni Kiswahili cha kawaida kinachohifadhi maana hasi na ya kijamii.
- source_word: הָעָם
  choice: watu
  rationale: Neno hilo humaanisha ‘watu’; muktadha tayari unabainisha ni watu gani, hivyo hakuna haja ya kuongeza ‘wa Israeli’.
- source_word: עַל
  choice: -m- katika ‘wakamlalamikia’
  rationale: Pamoja na kitenzi cha kulalamika, kihusishi hiki huonyesha mtu ambaye malalamiko yanaelekezwa dhidi yake. Kiswahili huwasilisha uhusiano huo kwa yambwa ndani ya kitenzi.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili sanifu.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Huanzisha usemi wa moja kwa moja na kuhifadhi uhusiano wa kisintaksia kwa njia ya kawaida katika Kiswahili.
- source_word: מַה
  choice: nini
  rationale: Kiwakilishi cha kuuliza kimetafsiriwa moja kwa moja na kwa kawaida.
- source_word: נִּשְׁתֶּה
  choice: tutakunywa
  rationale: Ni kitenzi cha nafsi ya kwanza wingi kinachoeleza swali la haraka kuhusu watakachokunywa. Wakati ujao katika Kiswahili unafikisha vizuri wazo hili bila kuongeza maana ya uwezo.
