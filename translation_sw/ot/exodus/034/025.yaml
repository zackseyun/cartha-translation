base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/025.yaml
  text: You shall not slaughter the blood of my sacrifice with leaven[a], and the sacrifice of the feast of the Passover shall not remain until the morning.
translation:
  language: sw
  text: Usichinje dhabihu yangu ya damu pamoja na chachu[a], wala dhabihu ya sikukuu ya Pasaka isibaki mpaka asubuhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati chachu ipo” au “pamoja na kitu chenye chachu.” Kiebrania hakibainishi kwa ukamilifu jinsi chachu inavyohusiana na kuchinjwa kwa dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁחַט
  choice: usichinje
  rationale: Kitenzi hiki humaanisha kuchinja mnyama, hasa katika muktadha wa dhabihu; “chinja” ni sahihi zaidi kuliko “ua” na hakiongezi tafsiri kuliko ilivyo lazima.
- source_word: עַל חָמֵץ
  choice: pamoja na chachu
  rationale: Kihusishi עַל katika katazo hili la ibada kinaweza kuonyesha kuambatana au kuwepo kwa chachu. “Pamoja na chachu” ni Kiswahili cha kawaida kinachohifadhi upana huo bila kubainisha zaidi taratibu za ibada.
- source_word: דַּם זִבְחִי
  choice: damu ya dhabihu yangu
  rationale: Huhifadhi wazi neno “damu,” taswira ya dhabihu, na kiambishi cha nafsi ya kwanza katika זִבְחִי.
- source_word: יָלִין
  choice: isibaki mpaka asubuhi
  rationale: Katika sheria za dhabihu, kitenzi hiki hueleza kitu kinachobaki usiku hadi asubuhi. Kauli hii ni ya asili na inaonyesha mpaka wa wakati uliotajwa katika Kiebrania.
- source_word: זֶבַח חַג הַפָּסַח
  choice: dhabihu ya sikukuu ya Pasaka
  rationale: 'Tafsiri hii inaweka wazi vipengele vyote vitatu vya mnyororo wa majina: dhabihu, sikukuu, na Pasaka.'
- source_word: הַפָּסַח
  choice: Pasaka
  rationale: “Pasaka” ni istilahi ya kawaida na inayoeleweka katika Kiswahili kwa sikukuu au dhabihu inayotajwa hapa.
theological_decisions:
- issue: Kutafsiri istilahi ya sikukuu ya agano bila kuingiza mafundisho ya baadaye
  choice: Pasaka
  alternative: Pesaki
  rationale: “Pasaka” huwasilisha rejeo la moja kwa moja la ibada ya Israeli katika muktadha huu na ni istilahi iliyozoeleka kwa wasomaji wa Kiswahili, bila kuongeza maana ya kimadhehebu.
- issue: Kudumisha msemo usio wa kawaida kuhusu kuchinja damu
  choice: usichinje damu ya dhabihu yangu
  alternative: usichinje dhabihu yangu
  rationale: Ingawa katika Kiswahili msemo huu si wa kawaida, Kiebrania kinataja “damu” moja kwa moja. Kuihifadhi huepuka kufuta mkazo au mvutano wa lugha ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Amri ya nafsi ya pili umoja imehifadhiwa. Muundo wa dhabihu umewekwa karibu na Kiebrania huku sintaksia ikibaki ya asili kwa Kiswahili.
