source:
  edition: WLC
  text: פֶּן תִּכְרֹ֥ת בְּרִ֖ית לְ/יוֹשֵׁ֣ב הָ/אָ֑רֶץ וְ/זָנ֣וּ אַחֲרֵ֣י אֱלֹֽהֵי/הֶ֗ם וְ/זָבְחוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/קָרָ֣א לְ/ךָ֔ וְ/אָכַלְתָּ֖ מִ/זִּבְחֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/015.yaml
  text: lest you make a covenant with the inhabitants of the land[a], and they prostitute themselves after their gods and sacrifice to their gods[c][b], and one of them invites you and you eat from his sacrifice.
translation:
  language: sw
  text: Usije ukafanya agano na wenyeji wa nchi hiyo, nao wakafanya ukahaba kwa kuifuata miungu yao[a] na wakatoa dhabihu kwa miungu yao, kisha mmoja wao akakualika[b], nawe ukala sehemu ya dhabihu yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakafanya uasherati wakifuata miungu yao.” Kiebrania kinatumia taswira ya ukahaba kueleza kutokuwa waaminifu kwa kuabudu miungu mingine.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “akakuita”; umoja hapa huenda una maana ya “mmoja wao akakualika.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “ukala kutoka katika dhabihu yake,” yaani, chakula kinachotokana na dhabihu aliyotoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Usije ukafanya
  rationale: Muundo huu wa Kiswahili unaonyesha onyo na uwezekano unaopaswa kuepukwa, kama ilivyo kwa פֶּן.
- source_word: תִּכְרֹת בְּרִית
  choice: ukafanya agano
  rationale: Ingawa nahau ya Kiebrania ni kihalisi ‘kukata agano,’ ‘kufanya agano’ ni ya kawaida na wazi katika Kiswahili.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: na wenyeji wa nchi hiyo
  rationale: ‘Wenyeji’ linawakilisha kwa pamoja watu wanaokaa katika nchi; ‘hiyo’ huonyesha nchi inayozungumziwa katika muktadha.
- source_word: וְזָנוּ אַחֲרֵי אֱלֹהֵיהֶם
  choice: nao wakafanya ukahaba kwa kuifuata miungu yao
  rationale: Tafsiri inadumisha taswira kali ya ukahaba inayotumiwa kueleza kutokuwa waaminifu kwa kuabudu miungu mingine, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: וְזָבְחוּ לֵאלֹהֵיהֶם
  choice: na kuitolea miungu yao dhabihu
  rationale: Hii inaeleza kwa ufupi tendo la ibada ya kutoa dhabihu kwa miungu yao.
- source_word: וְקָרָא לְךָ
  choice: kisha mmoja wao akakualika
  rationale: 'Umoja wa kitenzi baada ya wahusika wa wingi unaeleweka kwa maana ya mgawanyo: yeyote mmoja kati yao anaweza kumwalika msikilizaji.'
- source_word: וְאָכַלְתָּ מִזִּבְחוֹ
  choice: nawe ukala sehemu ya dhabihu yake
  rationale: ‘Sehemu ya’ huwasilisha maana ya מִן kwamba chakula kinatokana na dhabihu, bila kubadili dhabihu kuwa ‘karamu’ katika matini kuu.
theological_decisions:
- issue: Ibada ya sanamu inaelezwa kwa taswira ya ukahaba
  choice: Kudumisha taswira kwa maneno ‘wakafanya ukahaba kwa kuifuata miungu yao.’
  alternative: ‘Wakaifuata miungu yao’ au ‘wakakosa uaminifu kwa kuifuata miungu yao.’
  rationale: Kitenzi זנה kimetumiwa kimakusudi kuonyesha uzito wa kutokuwa waaminifu katika uhusiano wa agano; kukiondoa kungepunguza nguvu ya onyo.
- issue: Umoja wa ‘akamwita/akakualika’ baada ya wahusika wa wingi
  choice: ‘Mmoja wao akakualika.’
  alternative: ‘Akakuita’ au ‘wakakualika.’
  rationale: Tafsiri hii inaweka wazi maana inayowezekana sana ya mgawanyo bila kugeuza kitenzi cha Kiebrania kuwa wingi.
- issue: Kula kutokana na dhabihu ya miungu mingine
  choice: ‘Ukala sehemu ya dhabihu yake.’
  alternative: ‘Ukala chakula cha karamu yake ya dhabihu.’
  rationale: Matini kuu inabaki karibu na usemi wa Kiebrania na haifafanui zaidi ya ushahidi wa chanzo, huku tanbihi ikieleza maana ya chakula kinachohusiana na sadaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya ukahaba imehifadhiwa kwa sababu ni muhimu katika chanzo. Muundo wa sentensi unafuata mlolongo wa onyo wa Kiebrania bila kutumia lugha ya kizamani.
