base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/029.yaml
  text: And it happened[a], when Moses came down from Mount Sinai with the two tablets of the testimony in Moses' hand as he came down from the mountain[c][b], that Moses did not know that the skin of his face shone because he had spoken with him.
translation:
  language: sw
  text: Ikawa, Musa aliposhuka kutoka Mlima Sinai, na vibao viwili vya ushuhuda vikiwa mkononi mwa Musa aliposhuka kutoka mlimani, Musa hakujua kwamba ngozi ya uso wake ilikuwa inang'aa[a] kwa sababu alikuwa amesema naye[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ilitoa miale.” Kitenzi cha Kiebrania kinaweza kumaanisha kutoa miale. Tafsiri ya zamani “ilikuwa na pembe” ni uwezekano wa kihistoria, lakini hailingani vizuri na muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Yaani, na BWANA.
    reason: referent_clarification
  - marker: c
    text: 'Maneno “kwa sababu alikuwa amesema naye” yanaweza pia kueleweka kwa maana ya wakati: “aliposema naye.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutambulisha tukio jipya katika simulizi na kuhifadhi mtiririko wa Kiebrania kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: בְּרֶדֶת ... בְּרִדְתּוֹ
  choice: aliposhuka ... aliposhuka
  rationale: Miundo yote miwili inaweka wakati wa tukio. Marudio yamehifadhiwa kwa kuwa yapo katika chanzo na yanaunda fremu ya simulizi.
- source_word: מֵהַר סִינַי
  choice: kutoka Mlima Sinai
  rationale: Hili ndilo umbo la kawaida na la asili la jina hilo la mahali katika Kiswahili.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: vibao viwili vya ushuhuda
  rationale: “Vibao” huonyesha vitu bapa vilivyoandikiwa bila kupendekeza mbao kama nyenzo; “ushuhuda” huhifadhi maana ya kiagano ya עֵדוּת bila kuifafanua kupita kiasi.
- source_word: בְּיַד מֹשֶׁה
  choice: mkononi mwake
  rationale: Huhifadhi taswira halisi na idadi ya umoja ya Kiebrania, huku kirejeshi kikimtaja Musa kwa uwazi katika Kiswahili.
- source_word: לֹא יָדַע
  choice: hakujua
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, ya kitenzi kilichokanushwa.
- source_word: קָרַן
  choice: ilikuwa iking'aa
  rationale: Katika muktadha huu kitenzi kinaonyesha kutoa mwanga au miale. “Ilikuwa iking'aa” ni wazi na ya asili, bila kuleta taswira isiyofaa ya kuwa na pembe.
- source_word: עוֹר פָּנָיו
  choice: ngozi ya uso wake
  rationale: Chanzo kinataja wazi ngozi ya uso, si uso pekee; maelezo hayo yamehifadhiwa.
- source_word: בְּדַבְּרוֹ אִתּוֹ
  choice: kwa sababu alikuwa amesema naye
  rationale: בְּ pamoja na kitenzi-jina inaweza kuwa ya kisababishi au ya wakati. Matini kuu imetumia maana ya kisababishi inayofaa muktadha, huku maana ya wakati ikihifadhiwa katika tanbihi.
- source_word: אִתּוֹ
  choice: naye
  rationale: Kiwakilishi cha chanzo kimehifadhiwa; muktadha unaonyesha kuwa anayelengwa ni BWANA, jambo linalofafanuliwa katika tanbihi.
theological_decisions:
- issue: Maana ya קָרַן kuhusu uso wa Musa
  choice: kung'aa au kutoa miale
  alternative: kuwa na pembe
  rationale: Muktadha unahusu utukufu unaoonekana baada ya Musa kuwa mbele za BWANA. Maana ya kung'aa inalingana na muktadha bila kuingiza mabadiliko ya kimwili yasiyokusudiwa.
- issue: Rejeleo la kiwakilishi katika אִתּוֹ
  choice: kuhifadhi “naye” katika matini kuu
  alternative: kutaja wazi “BWANA” au “Mungu”
  rationale: Kiebrania kinatumia kiwakilishi ingawa muktadha unamtambulisha BWANA. Kuhifadhi kiwakilishi kunafuata umbo la chanzo, na tanbihi huondoa utata kwa msomaji.
- issue: Uhusiano unaoonyeshwa na בְּדַבְּרוֹ
  choice: 'kisababishi: “kwa sababu alikuwa amesema naye”'
  alternative: 'wa wakati: “alipokuwa akisema naye”'
  rationale: Sarufi inaruhusu maana zote mbili. Muktadha unaunga mkono kung'aa kama matokeo ya mazungumzo, lakini maana ya wakati haijaondolewa na imeandikwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kisicho cha kizamani. Marudio ya “aliposhuka” yamehifadhiwa kwa uaminifu kwa muundo wa Kiebrania. “Vibao” limeteuliwa badala ya “mbao” ili kuepuka dhana kwamba nyenzo yake ilikuwa miti.
