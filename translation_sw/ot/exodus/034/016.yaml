  text: and you take some of his daughters for your sons[b][a], and his daughters prostitute themselves after their gods and make your sons prostitute themselves after their gods.
translation:
  language: sw
  text: nawe ukachukua baadhi ya binti zake kwa ajili ya wana wako; kisha binti zake wakafanya uasherati kwa kuifuata miungu yao[a], nao watawafanya wana wako wafanye uasherati kwa kuifuata miungu yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri nyingine: “wakafanya ukahaba kwa kuifuata miungu yao.” Kiebrania kinatumia lugha ya ukahaba kwa njia ya sitiari kueleza kuifuata miungu mingine.'
    reason: lexical_alternative
  - marker: b
    text: Yaani, binti hao wangewashawishi wana wako kuifuata miungu yao na hivyo kuingia katika ibada ya sanamu.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: nawe ukawachukue
  rationale: Kitenzi cha Kiebrania katika mfululizo huu wa onyo kinaonyesha matokeo yanayoweza kufuata. ‘Kuwachukua’ huhifadhi maana ya moja kwa moja; wazo la ndoa linaeleweka kutokana na muktadha bila kuingizwa ndani ya kitenzi.
- source_word: מִבְּנֹתָיו
  choice: baadhi ya binti zake
  rationale: Kihusishi מִן kina maana ya kuchagua kutoka miongoni mwa kundi; ‘baadhi ya’ ni Kiswahili cha kawaida kinachohifadhi wazo hilo.
- source_word: לְבָנֶיךָ
  choice: kwa ajili ya wana wako
  rationale: Huhifadhi uhusiano wa kusudi/manufaa katika mpango wa ndoa na kutaja jinsia kama ilivyo katika chanzo.
- source_word: וְזָנוּ ... אַחֲרֵי אֱלֹהֵיהֶן
  choice: wakaifuata miungu yao kama makahaba
  rationale: זנה ina picha ya ukahaba wa kiibada, huku אַחֲרֵי ikieleza kuifuata miungu. Tafsiri hii huhifadhi picha ya ngono na pia kueleza kwa kawaida tendo la kuigeukia miungu hiyo.
- source_word: וְהִזְנוּ אֶת בָּנֶיךָ
  choice: na kuwafanya wana wako waifuate ... kama makahaba
  rationale: Muundo wa Hiphil ni wa kusababisha; ‘kuwafanya’ huonyesha wazi kwamba binti hao wangewavuta wana wa Israeli katika ukosefu uleule wa uaminifu wa kiibada.
- source_word: אֱלֹהֵיהֶן
  choice: miungu yao
  rationale: Nomino ni ya wingi na kiambishi chake kinawarejelea hao binti.
theological_decisions:
- issue: Kutafsiri זנה katika muktadha wa ibada ya sanamu
  choice: Kuhifadhi sitiari kwa maneno ‘kuifuata miungu yao kama makahaba.’
  alternative: ‘kuabudu sanamu’ au ‘kukosa uaminifu’
  rationale: Kiebrania kinatumia kwa makusudi lugha ya ukahaba kueleza ukosefu wa uaminifu wa kiagano na wa kiibada. Tafsiri haipaswi kuifuta picha hiyo, lakini muundo wa Kiswahili unapaswa pia kuonyesha kwamba kinacholengwa ni kuifuata miungu mingine.
- issue: Lugha yenye kutaja jinsia katika בנותיו / בניך
  choice: ‘binti zake’ na ‘wana wako’
  alternative: ‘watoto wake’ na ‘watoto wako’
  rationale: Chanzo kinataja binti na wana hasa katika muktadha wa ndoa; maneno hayo yanapaswa kubaki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Kama makahaba’ huhifadhi ukali wa sitiari ya Kiebrania bila kutumia neno la zamani au lisiloeleweka. Alama zote za tanbihi zimewekwa katika matini.
