lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Jihadhari
  rationale: Kauli hii ya onyo yenye maana ya kujielekezea tahadhari inawasilishwa kwa Kiswahili cha kawaida na cha moja kwa moja bila kuongeza maneno yasiyo ya lazima.
- source_word: פֶּן
  choice: usije ... lisije
  rationale: Kurudiwa kwa פֶּן kunahifadhiwa kwa miundo ya onyo ya Kiswahili, huku upatanisho wa kisarufi ukifuata mhusika wa kila kishazi.
- source_word: תִּכְרֹת בְּרִית
  choice: ukafanya agano
  rationale: Ingawa Kiebrania kinasema kihalisi ‘kukata agano,’ ‘kufanya agano’ ni nahau ya Kiswahili inayoeleweka na kudumisha maana.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: na wakaaji wa nchi
  rationale: Nomino ya umoja katika Kiebrania ina maana ya kijumla; wingi ‘wakaaji’ unaonyesha wazi kundi linalokusudiwa.
- source_word: אֲשֶׁר אַתָּה בָּא עָלֶיהָ
  choice: unayoingia
  rationale: Kauli hii inaeleza nchi ambayo mhusika anaelekea kuingia; ‘unayoingia’ ni ya asili na yenye maana wazi katika Kiswahili.
- source_word: יִהְיֶה
  choice: likawa
  rationale: Kiambishi cha ngeli ‘li-’ kinarejelea kwa njia ya kawaida agano, ambalo ndilo rejeo la karibu zaidi, huku maana ya kuwa au kugeuka kuwa ikihifadhiwa.
- source_word: לְמוֹקֵשׁ
  choice: mtego
  rationale: ‘Mtego’ ni neno la kawaida linalohifadhi picha ya hatari na kunaswa iliyo katika מוֹקֵשׁ.
- source_word: בְּקִרְבֶּךָ
  choice: katikati yako
  rationale: Tafsiri hii inahifadhi usemi wa mahali katika jamii bila kuugeuza kuwa hali ya ndani ya kisaikolojia.
theological_decisions:
- issue: Rejeo la kitenzi cha mwisho cha umoja na kiarifu chake
  choice: Agano ndilo linaloweza kuwa mtego.
  alternative: Wakaaji wenyewe, au hali kwa ujumla, ndio wanaoweza kuwa mtego.
  rationale: ‘Agano’ ndilo rejeo la karibu zaidi na linaafikiana kisarufi na ‘likawa’; hata hivyo tanbihi inatambua uwezekano mdogo wa kuelewa onyo kwa upana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa onyo uliorudiwa umehifadhiwa kwa ‘usije ... lisije’; lugha ni wazi kwa msomaji wa kawaida bila kupoteza picha ya agano kuwa mtego.
