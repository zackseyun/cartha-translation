  yaml_path: translation/ot/exodus/034/021.yaml
  text: Six days you shall work[a], but on the seventh day you shall cease; in plowing time and in harvest you shall cease.
translation:
  language: sw
  text: Siku sita utafanya kazi,[a] lakini siku ya saba utaacha kufanya kazi; wakati wa kulima na wakati wa mavuno utaacha kufanya kazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utapumzika.” Kitenzi cha Kiebrania kinamaanisha kuacha au kukoma, na kwa upanuzi kupumzika.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Kwa siku sita
  rationale: Muundo huu unaonyesha kwa kawaida na kwa uwazi kipindi cha siku sita katika Kiswahili.
- source_word: תַּעֲבֹד
  choice: utafanya kazi
  rationale: Kauli ya wakati ujao hapa ina nguvu ya agizo la agano; tafsiri hii ni ya kawaida na inadumisha nguvu hiyo.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: lakini siku ya saba
  rationale: Ingawa waw inaweza kuwa 'na,' hapa inaonyesha utofauti kati ya siku sita za kazi na siku ya saba.
- source_word: תִּשְׁבֹּת
  choice: utaacha
  rationale: Kitenzi שׁבת kimsingi humaanisha kuacha au kukoma. 'Utaacha' kinaonyesha kuacha kazi bila kuongeza wazo lisilotajwa wazi la kustarehe.
- source_word: בֶּחָרִישׁ
  choice: wakati wa kulima
  rationale: Nomino חרישׁ inaweza kurejelea shughuli au majira ya kulima; kauli hii ya Kiswahili inadumisha maana ya wakati na muktadha wa kilimo.
- source_word: וּבַקָּצִיר
  choice: na wakati wa mavuno
  rationale: קציר humaanisha mavuno au wakati wa mavuno; tafsiri hii ni wazi na inalingana na kirai kilichotangulia.
- source_word: תִּשְׁבֹּת (second occurrence)
  choice: utaacha
  rationale: Kurudia neno lilelile kunahifadhi msisitizo wa Kiebrania kwamba kuacha kazi kunahitajika hata katika vipindi muhimu vya kilimo.
theological_decisions:
- issue: Tafsiri ya kitenzi שׁבת kinachohusiana na Sabato
  choice: utaacha
  alternative: utapumzika
  rationale: Aya inasisitiza kukoma kwa kazi siku ya saba hata wakati wa kulima na wa mavuno. 'Utaacha' huhifadhi maana ya msingi ya שׁבת bila kuifanya iwe tu hali ya kupata pumziko.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, rahisi kueleweka na yenye hadhi. Marudio ya 'utaacha' yamehifadhiwa kwa ajili ya msisitizo wa maandishi ya Kiebrania.
