  yaml_path: translation/ot/exodus/034/005.yaml
  text: And Yahweh came down in the cloud and stood there with him[a], and proclaimed the name of Yahweh.
translation:
  language: sw
  text: Yahweh akashuka katika wingu, akasimama pale pamoja naye, akatangaza jina la Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaita jina la Yahweh,” au “akatangaza kwa jina la Yahweh.” Katika Kiebrania, kirai hiki kina kihusishi chenye maana ya “katika/kwa” kabla ya “jina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA,” ili kuhifadhi jina la pekee lililo katika Kiebrania.
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: Kitenzi ירד kinaonyesha mwendo wa kushuka; “akashuka” ni cha kawaida na chenye nguvu ya kisimulizi katika Kiswahili.
- source_word: בֶּעָנָן
  choice: ndani ya lile wingu
  rationale: Kiambishi ב hapa kinaeleweka kwa kawaida kuwa cha mahali, na umbo lenye kibainishi hurejelea wingu linalojulikana katika muktadha wa simulizi.
- source_word: וַיִּתְיַצֵּב
  choice: akasimama
  rationale: Hitpaeli ya יצב ina maana ya kusimama au kuchukua nafasi; “akasimama” ni fasaha na haiongezi uzito usio wa lazima.
- source_word: עִמּוֹ
  choice: pamoja naye
  rationale: עם pamoja na kiambishi cha nafsi humaanisha “pamoja naye”; katika muktadha, “yeye” ni Musa.
- source_word: שָׁם
  choice: pale
  rationale: “Pale” huonyesha mahali pa tukio kwa Kiswahili cha kawaida na huhifadhi kazi ya שָׁם.
- source_word: וַיִּקְרָא
  choice: akatangaza
  rationale: קרא inaweza kumaanisha kuita au kutangaza; kwa kuwa mstari unaofuata una maudhui ya tamko, “akatangaza” linafaa katika matini kuu.
- source_word: בְשֵׁם יְהוָה
  choice: jina la Yahweh
  rationale: Baada ya “akatangaza,” Kiswahili cha asili husema “akatangaza jina la Yahweh.” Hata hivyo, בְ־ inaweza pia kuzaa maana ya kuita jina au kutangaza kwa jina hilo, hivyo uwezekano huo umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ina jina la Mungu lenye herufi nne, si cheo. “Yahweh” huhifadhi jina hilo kwa namna inayokaribia ushahidi wa lugha chanzi.
- issue: Kiima na maana ya וַיִּקְרָא
  choice: Yahweh ndiye kiima, naye “akatangaza”
  alternative: Musa ndiye kiima, au kitenzi kitafsiriwe “akaita”
  rationale: 'Mfuatano wa vitenzi katika Kiebrania kwa kawaida unaendeleza Yahweh kuwa kiima: alishuka, akasimama, akatangaza. Mstari unaofuata pia unaonyesha tamko la Mungu mwenyewe; hata hivyo, namna ya kuelewa בְשֵׁם imeachwa wazi katika tanbihi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Mfuatano wa “aka-” huhifadhi mwendo wa kisimulizi, huku “kisha” ukisaidia kuunganisha kishazi cha mwisho kwa uwazi. Kiwakilishi “naye” kinamrejelea Musa kutokana na muktadha.
