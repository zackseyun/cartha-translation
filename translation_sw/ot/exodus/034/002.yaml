base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/002.yaml
  text: And be ready by the morning[b][a], and in the morning come up to Mount Sinai and present yourself there to me on the top of the mountain.
translation:
  language: sw
  text: Uwe tayari ifikapo asubuhi, na asubuhi upande Mlima Sinai, kisha usimame huko mbele yangu, kileleni mwa mlima.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וֶהְיֵה נָכוֹן
  choice: Uwe tayari
  rationale: Kauli hii ni amri ya kujiandaa; “uwe tayari” ni ya kawaida, wazi, na inalingana na maana ya נָכוֹן katika muktadha.
- source_word: לַבֹּקֶר
  choice: ifikapo asubuhi
  rationale: Hutofautisha maandalizi yanayopaswa kukamilika kufikia asubuhi na tendo la kupanda litakalofanyika asubuhi.
- source_word: וְעָלִיתָ בַבֹּקֶר
  choice: na asubuhi upande
  rationale: “Upande” huwasilisha tendo la kwenda juu bila kulazimisha utofauti wa Kiingereza kati ya “come up” na “go up”; “asubuhi” hutaja wakati wa kupanda.
- source_word: אֶל הַר סִינַי
  choice: Mlima Sinai
  rationale: Hili ndilo umbo la kawaida la jina la mahali katika Kiswahili, likihifadhi jina Sinai.
- source_word: וְנִצַּבְתָּ לִי שָׁם
  choice: kisha usimame huko mbele yangu
  rationale: נצב katika Niphal ina maana ya kusimama au kuchukua nafasi; pamoja na לִי, “mbele yangu” huonyesha kwa kawaida kusimama katika uwepo wa msemaji bila kuongeza wazo la kidhehebu.
- source_word: עַל רֹאשׁ הָהָר
  choice: kileleni mwa mlima
  rationale: רֹאשׁ katika matumizi ya kijiografia humaanisha kilele; usemi huu ni wa asili katika Kiswahili na unaonyesha mahali palipo juu kabisa pa mlima.
theological_decisions:
- issue: Mwelekeo wa tendo katika עלה
  choice: upande
  alternative: uje juu / uende juu
  rationale: Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa mwelekeo wa kuja au kwenda. Kitenzi cha Kiswahili “panda” huhifadhi maana kuu ya kwenda juu bila kuamua isivyolazimu mwelekeo huo.
- issue: Maana ya וְנִצַּבְתָּ לִי
  choice: usimame huko mbele yangu
  alternative: ujitokeze huko kwangu
  rationale: Chaguo kuu linabaki karibu na maana halisi ya kusimama huku likionyesha kwamba Musa atasimama katika uwepo wa Mungu; halibadili tendo hilo kuwa ibada au sherehe maalumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Ifikapo asubuhi” na “kileleni mwa mlima” ni misemo ya asili inayohifadhi utofauti wa nyakati na picha ya mahali katika Kiebrania.
