base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/006.yaml
  text: Then Yahweh passed before him and proclaimed[a], “Yahweh, Yahweh, a God compassionate and gracious, slow to anger, and abounding in steadfast love and faithfulness.”
translation:
  language: sw
  text: Kisha Yahweh akapita mbele yake, akatangaza, “Yahweh, Yahweh, Mungu mwenye huruma na neema, si mwepesi wa hasira, naye ni mwingi wa upendo wa kudumu na uaminifu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwingi wa upendo wa kudumu na kweli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo, na marudio yake yamehifadhiwa kama yalivyo katika Kiebrania.
- source_word: וַיַּעֲבֹר
  choice: akapita
  rationale: Katika muktadha huu, kitenzi kinaeleza Yahweh akipita mahali alipokuwa Musa; ‘akapita’ ni Kiswahili cha kawaida na sahihi.
- source_word: עַל פָּנָיו
  choice: mbele yake
  rationale: Hii ndiyo njia ya asili ya Kiswahili ya kueleza uhusiano wa mahali unaomaanisha ‘mbele ya uso wake’.
- source_word: וַיִּקְרָא
  choice: na kutangaza
  rationale: Kitenzi hapa kinaanzisha tamko zito la jina na tabia za Mungu; ‘kutangaza’ linaonyesha zaidi ya kuita tu.
- source_word: אֵל
  choice: Mungu
  rationale: Nomino hii inafuatia jina lililorudiwa na kuanzisha maelezo ya tabia za Yahweh. Kiswahili hakihitaji kibainishi kinacholingana na ‘a’ ya Kiingereza.
- source_word: רַחוּם
  choice: mwenye huruma
  rationale: Kauli hii inaonyesha huruma ya ndani na ni ya kawaida, wazi, na yenye hadhi katika Kiswahili.
- source_word: חַנּוּן
  choice: mwenye neema
  rationale: Neno linaonyesha tabia ya kutoa kibali na wema usiostahiliwa; ‘mwenye neema’ hulitofautisha na רַחוּם.
- source_word: אֶרֶךְ אַפַּיִם
  choice: si mwepesi wa hasira
  rationale: Hii ni tafsiri ya kiidioma ya usemi wa Kiebrania, yaani kutokasirika upesi, bila kuhamisha picha isiyoeleweka ya ‘pua ndefu’.
- source_word: רַב
  choice: amejaa
  rationale: Pamoja na nomino dhahania zinazofuata, neno hili linaonyesha wingi au utele; ‘amejaa’ ni la asili na linaloeleweka vizuri.
- source_word: חֶסֶד
  choice: upendo thabiti
  rationale: Tafsiri hii huhifadhi kwa ufupi wazo la upendo, wema, na ushikamanifu wa kudumu bila kulifungia neno katika maana moja tu ya kimadhehebu.
- source_word: אֱמֶת
  choice: uaminifu
  rationale: Katika jozi hii pamoja na חֶסֶד, neno linaeleza kutegemeka na uthabiti wa tabia ya Mungu; maana mbadala ya ‘kweli’ imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Kurudiwa kwa jina יְהוָה
  choice: Yahweh, Yahweh
  alternative: Yahweh Mungu
  rationale: Kiebrania hurudia jina lenyewe kwa msisitizo. Kurudia huko kumehifadhiwa, bila kuingiza ‘Mungu’ ndani ya mfuatano wa majina kabla ya אֵל.
- issue: Maana ya אֱמֶת katika jozi חֶסֶד וֶאֱמֶת
  choice: uaminifu
  alternative: kweli
  rationale: ‘Uaminifu’ inafaa katika maelezo ya tabia ya Mungu iliyo ya kutegemeka, lakini ‘kweli’ pia ni maana halisi inayowezekana na kwa hiyo imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wazi, na wenye hadhi. Muundo ‘si mwepesi wa hasira’ ni wa kiidioma, huku ‘upendo thabiti’ ukihifadhi uzito wa neno חֶסֶד bila kutumia istilahi ya kimadhehebu.
