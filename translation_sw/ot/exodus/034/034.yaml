reference: Exodus 34:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה לִ/פְנֵ֤י יְהוָה֙ לְ/דַבֵּ֣ר אִתּ֔/וֹ יָסִ֥יר אֶת הַ/מַּסְוֶ֖ה עַד צֵאת֑/וֹ וְ/יָצָ֗א וְ/דִבֶּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת אֲשֶׁ֥ר יְצֻוֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/034.yaml
  text: But whenever Moses went in before Yahweh to speak with him[a], he would remove the veil until he came out; then he would come out and speak to the sons of Israel what he had been commanded.
translation:
  language: sw
  text: Lakini kila mara Musa alipoingia mbele ya Yahwe ili kuzungumza naye, aliondoa utaji mpaka alipotoka. Kisha alitoka, akawaambia wana wa Israeli[a] yale aliyoamriwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watu wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בֹא
  choice: Lakini kila mara ... alipoingia
  rationale: Muundo wa kiunganishi pamoja na ב na kitenzi-jina unaonyesha hali iliyojirudia. “Kila mara ... alipoingia” huwasilisha desturi hiyo, huku “Lakini” ikidumisha utofautishaji mdogo na mstari uliotangulia.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי humaanisha “mbele ya/katika uwepo wa,” na “mbele za” ni usemi wa Kiswahili wenye heshima na unaoeleweka. Jina la agano יְהוָה limetafsiriwa moja kwa moja kuwa “Yahwe.”
- source_word: לְדַבֵּר אִתּוֹ
  choice: ili kuzungumza naye
  rationale: Kitenzi-jina kinaonyesha kusudi, na אִתּוֹ baada ya דבר huonyesha mawasiliano ya kuzungumza pamoja; “kuzungumza naye” ni ya asili kuliko tafsiri ya neno kwa neno.
- source_word: יָסִיר
  choice: aliondoa
  rationale: Ingawa umbo ni la kitenzi kisichotimilika, muktadha wa “kila mara” tayari unaonyesha tendo la mazoea; wakati uliopita katika Kiswahili unasomeka kwa kawaida bila kupoteza hali hiyo.
- source_word: הַמַּסְוֶה
  choice: utaji
  rationale: מַסְוֶה ni kifuniko cha uso alichovaa Musa. “Utaji” ni neno fupi, linalotambulika katika muktadha wa kibiblia, na linafaa kuliko maelezo marefu ndani ya sentensi.
- source_word: עַד צֵאתוֹ
  choice: mpaka alipotoka
  rationale: עַד pamoja na kitenzi-jina huonyesha muda ulioendelea hadi Musa alipotoka; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: וְיָצָא וְדִבֶּר
  choice: Kisha alitoka na kuwaambia
  rationale: Vitenzi vinaendeleza mfuatano wa matendo yaliyojirudia. “Kisha” huonyesha mfuatano, na “kuwaambia ... yale” huwasilisha kwa Kiswahili cha kawaida kitendo cha kuwasilisha ujumbe.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inadumisha kwa karibu usemi wa Kiebrania “wana wa Israeli,” badala ya kuubadili kimya kimya kuwa neno lisiloonyesha muundo wa asili.
- source_word: אֵת אֲשֶׁר יְצֻוֶּה
  choice: yale aliyoamriwa
  rationale: Umbo la kutendwa linaonyesha kwamba Musa alipokea amri kisha akaiwasilisha. “Yale aliyoamriwa” ni fasaha na huhifadhi uhusiano huo bila kuongeza mtendaji ambaye hajatajwa hapa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Usemi wa kijinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Kiebrania kinasema kihalisi “wana wa Israeli.” Tafsiri kuu inadumisha umbo hilo la asili, huku tanbihi ikitoa visawe vya Kiswahili vinavyoweza kurejelea jumuiya nzima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha hali ya matendo yaliyojirudia kwa kutumia “kila mara,” lakini inaepuka urudiaji mzito wa vitenzi visaidizi. “Utaji” limetumiwa kama neno linalojulikana la kifuniko cha uso katika muktadha huu.
