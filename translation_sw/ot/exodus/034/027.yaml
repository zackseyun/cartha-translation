base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/027.yaml
  text: Then Yahweh said to Moses[a], “Write these words for yourself, for according to these words I have made a covenant with you and with Israel.”
translation:
  language: sw
  text: Kisha Yahwe akamwambia Musa, “Jiandikie maneno haya, kwa maana kwa mujibu wa maneno haya nimefanya agano[a] nawe na Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kwa maana halisi, “nimekata agano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limehifadhiwa kama jina binafsi kwa tahajia ya kawaida ya Kiswahili, badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Umbo hili la kisimulizi linaonyesha tendo linalofuata katika simulizi, na ‘akamwambia’ ni Kiswahili cha kawaida kwa kumtambulisha msemaji na anayesemeshwa.
- source_word: כְּתָב לְךָ
  choice: Jiandikie
  rationale: Kitenzi hiki kinahifadhi amri ya kuandika pamoja na wazo la לְךָ, yaani Musa aandike kwa ajili yake mwenyewe, kwa usemi mfupi na wa kawaida wa Kiswahili.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya
  rationale: Katika muktadha wa maagizo ya agano, דְּבָרִים humaanisha ‘maneno’; tafsiri hiyo pia hudumisha urudiaji wa kirai hiki katika aya.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa kiunganishi hiki kinatoa sababu ya amri ya kuandika; ‘kwa maana’ ni cha asili na chenye hadhi katika Kiswahili.
- source_word: עַל פִּי
  choice: kwa mujibu wa
  rationale: Nahau hii inaonyesha kwamba agano linafanywa kwa kufuatana na maneno yaliyotajwa; ‘kwa mujibu wa’ huhifadhi maana hiyo ya kisheria na ya kiagano.
- source_word: כָּרַתִּי ... בְּרִית
  choice: nimefanya agano
  rationale: Ingawa nahau ya Kiebrania kwa neno ni ‘nimekata agano,’ Kiswahili cha kawaida husema ‘kufanya agano.’ Wakati timilifu ‘nimefanya’ unaonyesha tendo lililotimizwa lenye umuhimu wa sasa.
- source_word: אִתְּךָ ... וְאֶת יִשְׂרָאֵל
  choice: nawe na Israeli
  rationale: Muundo huu unawaonyesha Musa na Israeli kuwa wahusika wanaohusishwa katika agano; ‘nawe na Israeli’ ni wa moja kwa moja na wa kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: ‘Yahwe’ huhifadhi jina binafsi la Mungu katika umbo linaloeleweka na linalotumika kwa kawaida katika Kiswahili, bila kulibadilisha kuwa cheo au kuingiza upendeleo wa kimadhehebu.
- issue: Nahau ya agano כָּרַתִּי ... בְּרִית
  choice: nimefanya agano
  alternative: nimekata agano
  rationale: ‘Nimefanya agano’ huwasilisha maana ya nahau kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira halisi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Jiandikie’ huhifadhi kwa ufupi nguvu ya amri na dative ya לְךָ; ‘kwa mujibu wa’ hudumisha sauti ya kisheria ya kifungu bila kuwa ngumu kueleweka.
