base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/001.yaml
  text: Then Yahweh said to Moses[a], “Cut for yourself two stone tablets like the first ones, and I will write on the tablets the words that were on the first tablets[b], which you broke.”
translation:
  language: sw
  text: Kisha Yahweh akamwambia Musa, “Jichongee vibao viwili vya mawe kama vile vya kwanza, nami nitaandika juu ya vibao hivyo maneno yaliyokuwa juu ya vibao vya kwanza, ambavyo ulivivunja.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limeandikwa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Katika usimulizi huu, kitenzi אמר pamoja na mhusika anayeelekezewa kinaelezwa kwa Kiswahili cha kawaida kuwa ‘akamwambia.’
- source_word: פְּסָל לְךָ
  choice: Jichongee
  rationale: Amri inamtaka Mose mwenyewe atengeneze mbao kwa kuchonga mawe; ‘jichongee’ huwasilisha kitendo na dative לְךָ kwa namna ya asili katika Kiswahili.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: mbao mbili za mawe
  rationale: ‘Mbao’ hapa humaanisha vibao bapa vya kuandikia, na ‘za mawe’ huhifadhi wazi nyenzo yake bila kudokeza mbao za miti.
- source_word: כָּרִאשֹׁנִים
  choice: kama zile za kwanza
  rationale: Huhifadhi ulinganisho na mbao za awali kwa Kiswahili cha kawaida.
- source_word: וְכָתַבְתִּי
  choice: nami nitaandika
  rationale: Huonyesha kwa wazi ahadi ya nafsi ya kwanza na muunganiko wa sentensi.
- source_word: עַל הַלֻּחֹת
  choice: juu ya mbao hizo
  rationale: Kihusishi עַל kinaonyesha sehemu ya uso ambako maandishi yatawekwa; ‘hizo’ hurejelea mbao zilizotajwa.
- source_word: הַדְּבָרִים
  choice: maneno
  rationale: Tafsiri ya moja kwa moja ya דְּבָרִים ni ‘maneno’; ‘amri’ ingeongeza ufafanuzi ambao neno lenyewe halisemi hapa.
- source_word: אֲשֶׁר שִׁבַּרְתָּ
  choice: ambazo ulizivunja
  rationale: שׁבר humaanisha kuvunja; kauli hii rahisi huhifadhi lawama ya moja kwa moja kwa Mose bila kuongeza uzito wa ‘kusambaratisha.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano, kwa hiyo limetoholewa kuwa ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Jichongee’ ni wa kawaida na unaonyesha kwamba Mose anatakiwa kuandaa mbao mwenyewe. Hakuna tanbihi inayohitajika katika aya hii.
