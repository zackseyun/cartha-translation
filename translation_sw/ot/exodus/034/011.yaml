base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/011.yaml
  text: Keep what I am commanding you today[a]. Behold, I am driving out before you the Amorites, the Canaanites, the Hittites, the Perizzites, the Hivites[b], and the Jebusites.
translation:
  language: sw
  text: 'Zingatia yale ninayokuamuru leo.[a] Tazama, ninawafukuza kutoka mbele yako[b]: Waamori, Wakanaani, Wahiti, Waperizi, Wahivi na Wayebusi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yashike yale ninayokuamuru leo,” au, “Uwe mwangalifu kuhusu yale ninayokuamuru leo.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kutoka mbele yako”; maana yake ni kuwaondoa kutoka mbele yako au kutoka mahali ulipo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר לְךָ
  choice: Shika
  rationale: Kitenzi שׁמר katika agizo kinaweza kumaanisha kushika, kutunza au kuzingatia. Katika muktadha huu wa maagizo ya agano, “Shika” ni kifupi, cha heshima, na kinadumisha maana ya kutii bila kuongeza maneno yasiyosemwa wazi.
- source_word: אֵת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: yale ninayokuamuru leo
  rationale: Hii inadumisha kishazi rejeshi na nguvu ya wakati wa sasa ya מְצַוְּךָ kwa Kiswahili cha kawaida.
- source_word: הִנְנִי
  choice: Tazama
  rationale: Neno hili linaelekeza fikira kwenye tendo la Mungu linalotangazwa kwa msisitizo; “Tazama” ni la kibiblia lakini bado linaeleweka katika Kiswahili cha sasa.
- source_word: גֹרֵשׁ
  choice: ninawafukuza
  rationale: Kitenzi גרש humaanisha kufukuza au kuondoa kwa nguvu. Muundo wa sasa unahifadhi uhai na uhakika wa tendo lililo karibu kutekelezwa.
- source_word: מִפָּנֶיךָ
  choice: mbele yako
  rationale: Huhifadhi taswira ya Kiebrania ya kuondolewa kutoka mbele ya mtu, huku ikiwa ya kawaida kwa Kiswahili.
- source_word: הָאֱמֹרִי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: Waamori, Wakanaani, Wahiti, Waperizi, Wahivi na Wayebusi
  rationale: Majina ya makabila yaliyo katika umoja wa kijumla kwa Kiebrania yametafsiriwa kwa wingi wa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya agizo שׁמר katika muktadha wa agano
  choice: Shika yale ninayokuamuru leo
  alternative: Jihadhari kuhusu yale ninayokuamuru leo; Zingatia yale ninayokuamuru leo
  rationale: Tafsiri hii inalieleza kama agizo la kuyashika na kuyatii maagizo, si kama onyo pekee. Hata hivyo, tanbihi inadumisha uwezekano wa maana ya kuzingatia au kuwa mwangalifu.
- issue: Nguvu ya tendo la Mungu katika הִנְנִי גֹרֵשׁ
  choice: Tazama, ninawafukuza
  alternative: Tazama, nitawafukuza
  rationale: Muundo wa Kiebrania unaweza kueleza tendo linaloendelea, lililo karibu, au hakika. Wakati wa sasa unadumisha uwasilishaji wake wenye uhai bila kuondoa maana ya wakati ujao iliyo karibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Shika” na “Tazama” zinahifadhi uzito wa agano na msisitizo wa Kiebrania bila kutumia miundo migumu isiyo ya kawaida.
