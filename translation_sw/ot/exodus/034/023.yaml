  yaml_path: translation/ot/exodus/034/023.yaml
  text: Three times in the year all your males shall appear before the Lord Yahweh[b][a], the God of Israel.
translation:
  language: sw
  text: Mara tatu kwa mwaka, wanaume wako wote watajionyesha mbele za Bwana Yahwe[a], Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina cheo “Bwana” (ha’adon) kikifuatiwa na jina la Mungu, YHWH, linalotafsiriwa hapa “Yahwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: Mara tatu
  rationale: Hii ndiyo njia ya kawaida na ya moja kwa moja ya kueleza idadi ya matukio katika Kiswahili.
- source_word: בַּשָּׁנָה
  choice: kwa mwaka
  rationale: Katika muktadha huu, usemi huu unaeleza wajibu unaotimizwa mara tatu ndani ya kila mzunguko wa mwaka.
- source_word: יֵרָאֶה
  choice: wataonekana
  rationale: Nifali ya ראה imehifadhiwa kwa namna iliyo karibu na muundo wa Kiebrania, huku muktadha wa 'mbele za' ukionyesha kujitokeza katika uwepo wa Mungu.
- source_word: כָּל זְכוּרְךָ
  choice: wanaume wako wote
  rationale: זָכוּר inawahusu hasa watu wa jinsia ya kiume waliowajibika kuhudhuria sikukuu; 'wanaume' ni ya asili na wazi kuliko 'waume' katika Kiswahili cha sasa.
- source_word: אֶת פְּנֵי
  choice: mbele za
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya kuwa mbele au katika uwepo wa mtu bila kutafsiri kihalisi 'uso wa.'
- source_word: הָאָדֹן
  choice: Bwana
  rationale: Neno lenye kibainishi hapa ni cheo cha kimungu; 'Bwana' ni tafsiri ya kawaida na yenye heshima.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa Kiswahili 'Yahwe,' badala ya kulibadilisha kuwa cheo kingine.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hii inawasilisha kwa uwazi muundo wa utegemezi unaomtambulisha Yahwe kuwa Mungu wa Israeli.
theological_decisions:
- issue: Kutafsiri jina יְהוָה baada ya cheo הָאָדֹן
  choice: Bwana Yahwe
  alternative: Bwana MUNGU; Bwana Mwenye Enzi Kuu
  rationale: Kiebrania kina cheo na kisha jina la Mungu. 'Bwana Yahwe' huhifadhi tofauti hiyo bila kurudia cheo au kuficha jina.
- issue: Lugha ya wajibu unaowahusu watu wa jinsia ya kiume
  choice: wanaume wako wote
  alternative: watu wako wote; kila mwanamume miongoni mwenu
  rationale: Kiebrania kinataja wazi watu wa jinsia ya kiume, kwa hiyo maana hiyo haijafanywa kuwa isiyoonyesha jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na wa moja kwa moja; 'mbele za' ni usemi wa kawaida wa kibiblia lakini bado unaeleweka kwa wasomaji wa leo.
