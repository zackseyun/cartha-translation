  verdict: revise
  source_fidelity: 'The core sense is retained: Yahweh promises to remove nations, extend Israel’s boundary, and protect the land during the three annual pilgrimages. However, “kuonekana mbele za Yahwe” is an unnatural passive expression in Swahili and does not clearly convey the pilgrimage idiom. “Kujionyesha mbele ya Yahwe” conveys appearing before him while the footnote preserves the literal Hebrew wording.'
  naturalness: The revision uses idiomatic Standard East African Swahili. “Kupanua mipaka yako” avoids the awkward singular object agreement in “kuipanua mipaka yako,” and “mbele ya Yahwe” is the normal construction.
  terminology: “Yahwe,” “mataifa,” “nchi,” and “hija” are suitable. The representative masculine noun is appropriately rendered “mtu,” with the grammatical and cultural detail retained in a note.
  issues:
  - severity: medium
    issue: The phrase “kuonekana mbele za Yahwe” is passive and stylistically unnatural.
    rationale: It can suggest being seen rather than presenting oneself before God. The Hebrew expression is a pilgrimage/worship idiom, so “kujionyesha mbele ya Yahwe” communicates its sense naturally without asserting a direct vision of God.
  - severity: low
    issue: “Kuipanua mipaka yako” has awkward agreement with plural “mipaka.”
    rationale: The source has a singular noun, but plural “mipaka” is idiomatic in Swahili. Using the infinitive “kupanua” removes the agreement problem without affecting meaning.
  - severity: low
    issue: Footnote anchors are all placed at the end of the verse rather than beside their respective referents.
    rationale: Placing each marker after the relevant phrase improves usability and makes the notes’ scope clear.
