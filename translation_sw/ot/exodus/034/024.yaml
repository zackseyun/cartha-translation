  text: כִּֽי אוֹרִ֤ישׁ גּוֹיִם֙ מִ/פָּנֶ֔י/ךָ וְ/הִרְחַבְתִּ֖י אֶת גְּבוּלֶ֑/ךָ וְ/לֹא יַחְמֹ֥ד אִישׁ֙ אֶֽת אַרְצְ/ךָ֔ בַּ/עֲלֹֽתְ/ךָ֗ לֵ/רָאוֹת֙ אֶת פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/024.yaml
  text: For I will drive out nations from before you and enlarge your border[c][b][a], and no man will covet your land when you go up to appear before Yahweh your God three times in the year.
translation:
  language: sw
  text: Kwa maana nitayafukuza mataifa mbele yako na kupanua mipaka yako; wala hakuna mtu[c] atakayeitamani nchi yako wakati unapokwenda juu kujionyesha mbele ya Yahwe Mungu wako[a] mara tatu kwa mwaka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, usemi huu unaweza kutafsiriwa kihalisi, “kuuona uso wa Yahwe Mungu wako”; hapa ni nahau ya kujionyesha mbele zake kwa ibada.
    reason: lexical_alternative
  - marker: b
    text: Au, “mara tatu katika mwaka.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania lililotafsiriwa “mtu” ni la kiume umoja lakini limetumiwa kwa maana wakilishi. Muktadha unahusu wanaume wa Israeli kwenda kwenye sikukuu za hija.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya amri iliyotangulia kuhusu kuhudhuria sikukuu za hija.
- source_word: אוֹרִישׁ גּוֹיִם מִפָּנֶיךָ
  choice: nitayafukuza mataifa mbele yako
  rationale: Hifili ya ירשׁ hapa ina maana ya kuyaondoa mataifa katika nchi; usemi “mbele yako” unahifadhi picha ya Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: וְהִרְחַבְתִּי אֶת־גְּבוּלֶךָ
  choice: na kuipanua mipaka yako
  rationale: Kitenzi kina maana ya kufanya iwe pana, na גְּבוּל hapa ni mipaka ya eneo.
- source_word: וְלֹא יַחְמֹד אִישׁ אֶת־אַרְצְךָ
  choice: wala hakuna mtu atakayeitamani nchi yako
  rationale: חמד ni kutamani kwa tamaa isiyofaa; אִישׁ ni nomino ya kiume umoja inayotumiwa hapa kwa maana wakilishi.
- source_word: בַּעֲלֹתְךָ
  choice: wakati unapokwenda juu
  rationale: עלה katika muktadha wa hija ni kwenda juu kuelekea mahali pa ibada.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: kuonekana mbele za
  rationale: Maandishi ya Kimasoreti yana umbo linaloeleweka kimapokeo kama “kuonekana”; usemi mzima ni nahau ya kufika mbele za Mungu kwa ibada, huku tanbihi ikitaja tafsiri halisi inayowezekana.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kwa tahajia ya kawaida na inayosomeka kwa urahisi katika Kiswahili.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: mara tatu kwa mwaka
  rationale: Ni tafsiri ya kawaida na wazi ya idadi ya mahudhurio katika kipindi cha mwaka.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kina jina binafsi la Mungu, si cheo; “Yahwe” hulihifadhi kwa namna ya kawaida katika Kiswahili.
- issue: Nahau לֵרָאוֹת אֶת־פְּנֵי יְהוָה
  choice: kuonekana mbele za Yahwe
  alternative: kuuona uso wa Yahwe
  rationale: Tafsiri kuu inawasilisha tendo la hija na ibada bila kuamua kwamba mwanadamu anamwona Mungu moja kwa moja; maana halisi inawekwa katika tanbihi.
- issue: Nguvu wakilishi ya אִישׁ
  choice: hakuna mtu
  alternative: hakuna mwanamume
  rationale: Ingawa umbo ni la kiume umoja na muktadha unahusu wanaume wa Israeli wanaohiji, ahadi ya kutotamaniwa kwa nchi inaelezwa kwa kukanusha mtu yeyote; tanbihi inahifadhi maelezo ya kisarufi na kitamaduni.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kwenda juu” huhifadhi lugha ya hija; “mipaka” ni ya asili zaidi kuliko umoja katika Kiswahili. Alama zote za tanbihi zimewekwa katika maandishi makuu.
