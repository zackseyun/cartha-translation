base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/030.yaml
  text: When Aaron and all the sons of Israel saw Moses[a], behold, the skin of his face was radiant, and they were afraid to come near him.
translation:
  language: sw
  text: Haruni na wana wote wa Israeli walimwona Musa; tazama, ngozi ya uso wake ilikuwa iking'aa[a], nao wakaogopa kumkaribia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ilitoa miale.” Kitenzi cha Kiebrania ni adimu na kihistoria pia kilitafsiriwa “ilikuwa na pembe,” ingawa muktadha unaelekea kuonyesha mng’ao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: walipomwona
  rationale: Katika mfululizo huu wa simulizi, ראה humaanisha kuona; muundo wa Kiswahili wa wakati ‘walipomwona’ huunganisha kwa kawaida tendo hili na jambo waliloliona.
- source_word: וְכָל בְּנֵי יִשְׂרָאֵל
  choice: na wana wote wa Israeli
  rationale: ‘Wana wa Israeli’ huhifadhi taswira ya kifamilia ya Kiebrania בְּנֵי יִשְׂרָאֵל na umbo lake la kiume, huku ikiwa Kiswahili kinachoeleweka.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: ‘Tazama’ huhifadhi nguvu ya chembe ya kuamsha uangalifu na mshangao wa simulizi.
- source_word: קָרַן
  choice: ilikuwa inang’aa
  rationale: Kitenzi hiki adimu katika muktadha huu huonyesha kutoa mwanga au miale. ‘Ilikuwa inang’aa’ ni ya kawaida na inaeleza hali inayoonekana bila kudai pembe halisi.
- source_word: עוֹר פָּנָיו
  choice: ngozi ya uso wake
  rationale: Tafsiri hii huhifadhi neno la wazi עוֹר, ‘ngozi,’ badala ya kulifupisha kuwa ‘uso wake’ tu.
- source_word: וַיִּירְאוּ
  choice: nao wakaogopa
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha mwitikio wao wa hofu katika simulizi.
- source_word: מִגֶּשֶׁת אֵלָיו
  choice: kumkaribia
  rationale: Muundo wa Kiebrania unaonyesha kuwa hofu iliwazuia wasimkaribie; ‘wakaogopa kumkaribia’ ni Kiswahili cha kawaida na sahihi.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wote wa Israeli
  alternative: Waisraeli wote; watoto wote wa Israeli
  rationale: ‘Wana wa Israeli’ huhifadhi usemi wa kifamilia na umbo la kiume la chanzo badala ya kuligeuza kimya kuwa jina la taifa lisiloonyesha jinsia.
- issue: Maana ya קָרַן kuhusu uso wa Musa
  choice: ilikuwa inang’aa
  alternative: ilitoa miale; ilikuwa na pembe
  rationale: Muktadha unahusu mng’ao unaoonekana baada ya Musa kukutana na BWANA na hofu ya watu kumkaribia. Maana ya mng’ao inafaa zaidi; tafsiri ya kihistoria ya ‘pembe’ imetajwa katika tanbihi bila kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Tazama’ limetumiwa kuhifadhi msisitizo wa simulizi; ‘wana wa Israeli’ huhifadhi usemi wa kifamilia wa Kiebrania.
