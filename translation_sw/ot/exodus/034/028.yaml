base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/028.yaml
  text: And he was there with Yahweh forty days and forty nights[a]; he ate no bread and drank no water. And he wrote on the tablets the words of the covenant[b], the ten words.
translation:
  language: sw
  text: Musa akawa huko pamoja na Yahwe siku arobaini na usiku arobaini; hakula mkate wala hakunywa maji. Akaandika[a] juu ya vibao maneno ya agano, yaani, yale maneno kumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe akaandika,” kwa kuwa mahali pengine kuandika juu ya vibao kunahusishwa na Yahwe (tazama Kutoka 34:1; Kumbukumbu la Torati 10:4).
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “maneno kumi”; kwa mapokeo, “Amri Kumi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa moja kwa moja kwa namna iliyo ya kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: וַיְהִי שָׁם עִם
  choice: Musa akawa huko pamoja na
  rationale: Kitenzi cha Kiebrania kinaeleza kuwapo kwake huko pamoja na Yahwe. Jina “Musa” limewekwa wazi kwa uelewevu wa Kiswahili kutokana na muktadha wa karibu.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: siku arobaini na usiku arobaini
  rationale: Huhifadhi kwa usahihi muda na urudiaji wa usemi wa Kiebrania.
- source_word: לֶחֶם לֹא אָכַל
  choice: hakula mkate
  rationale: Neno halisi “mkate” limehifadhiwa badala ya kupanuliwa kuwa “chakula,” kwa kuwa Kiebrania kinataja mkate moja kwa moja.
- source_word: וּמַיִם לֹא שָׁתָה
  choice: wala hakunywa maji
  rationale: Tafsiri ya moja kwa moja inayohifadhi ulinganifu na kauli iliyotangulia.
- source_word: וַיִּכְתֹּב
  choice: Akaandika
  rationale: Kitenzi ni nafsi ya tatu, umoja, kiume bila mtenda kutajwa upya. Muendelezo wa kisarufi unaelekea kwa Musa, huku uwezekano wa kumwelewa Yahwe kama mtenda ukihifadhiwa katika tanbihi.
- source_word: עַל הַלֻּחֹת
  choice: juu ya vibao
  rationale: “Vibao” ni neno la kawaida la Kiswahili kwa mabamba ya mawe ya agano katika muktadha huu.
- source_word: דִּבְרֵי הַבְּרִית
  choice: maneno ya agano
  rationale: Huhifadhi uhusiano wa moja kwa moja wa maneno hayo na agano.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: yale maneno kumi
  rationale: Hufuata usemi halisi wa Kiebrania, “maneno kumi,” badala ya kuingiza tafsiri ya kimapokeo “Amri Kumi” katika matini kuu.
theological_decisions:
- issue: Mtenda wa kitenzi “akaandika”
  choice: Matini kuu inaendeleza Musa kama mtenda anayeeleweka kutokana na mfuatano wa kisarufi.
  alternative: Yahwe ndiye aliyeandika.
  rationale: Kiebrania hakitaji mtenda upya, na Musa ndiye mtenda wa karibu katika mfululizo wa vitenzi. Hata hivyo, Kutoka 34:1 na Kumbukumbu la Torati 10:4 zinahusisha uandishi wa vibao na Yahwe; kwa hiyo mvutano huo wa kweli umehifadhiwa katika tanbihi bila kuutatua kimya kimya.
- issue: Tafsiri ya עֲשֶׂרֶת הַדְּבָרִים
  choice: yale maneno kumi
  alternative: Amri Kumi
  rationale: Usemi wa Kiebrania unasema kihalisi “maneno kumi.” Jina la kimapokeo “Amri Kumi” limetolewa katika tanbihi ili kusaidia wasomaji bila kufunika umbo la matini asilia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inasomeka kwa urahisi huku ikihifadhi urudiaji, msamiati halisi wa Kiebrania, na utata wa mtenda wa kitenzi cha mwisho.
