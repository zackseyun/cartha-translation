    issue: ‘unaishi kati yao’ kwa אֲשֶׁר אַתָּה בְּקִרְבּוֹ
    rationale: Kitenzi ‘kuishi’ si sehemu ya Kiebrania. ‘Uko katikati yao’ hutoa maana ya mahali bila kuongeza dhana ya ukaaji.
  - severity: medium
    issue: ‘ninalokutendea’ kwa עֹשֶׂה עִמָּךְ
    rationale: Tafsiri hii huifanya ‘nawe’ kuwa ‘kwako’ na hivyo kuifinyanga maana. ‘Ninachofanya nawe’ huhifadhi kiambishi עִם bila kusisitiza ushirikiano wa kiteolojia usioelezwa.
  - severity: low
    issue: ‘hayajapata kufanywa’ kwa לֹא נִבְרְאוּ
    rationale: Ingawa inaeleweka kimuktadha, ‘kufanywa’ si kitenzi cha chanzo, ambacho ni ‘kuumbwa.’ ‘Hayajawahi kuumbwa’ ni ya asili na hudumisha taswira ya chanzo.
  - severity: low
    issue: ‘linatisha na kustaajabisha’
    rationale: Kiunganishi hiki kinaongeza ufafanuzi wa pili usio wazi katika neno moja נוֹרָא. ‘Ni cha kutisha’ huhifadhi uzito na utata wake kwa uaminifu.
