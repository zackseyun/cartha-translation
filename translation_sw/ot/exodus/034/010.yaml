  text: וַ/יֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כָּֽל עַמְּ/ךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא נִבְרְא֥וּ בְ/כָל הָ/אָ֖רֶץ וּ/בְ/כָל הַ/גּוֹיִ֑ם וְ/רָאָ֣ה כָל הָ֠/עָם אֲשֶׁר אַתָּ֨ה בְ/קִרְבּ֜/וֹ אֶת מַעֲשֵׂ֤ה יְהוָה֙ כִּֽי נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽ/ךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/010.yaml
  text: And he said, “Look, I am making a covenant. Before all your people I will do wonders such as have not been created in all the earth or among any of the nations. And all the people in whose midst you are will see the work of the LORD, for what I am doing with you is awe-inspiring.”
translation:
  language: sw
  text: Akasema, “Tazama, ninafanya agano. Mbele ya watu wako wote nitafanya maajabu ambayo hayajawahi kuumbwa katika dunia yote wala miongoni mwa mataifa yote. Watu wote ambao uko katikati yao wataiona kazi ya BWANA, kwa maana ninachofanya nawe ni cha kutisha.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kihisishi hiki huvuta usikivu kwa tamko zito linalofuata; ‘Tazama’ ni cha heshima na kinachotambulika katika Kiswahili cha Biblia.
- source_word: כֹּרֵת בְּרִית
  choice: ninafanya agano
  rationale: Ingawa kitenzi cha Kiebrania kwa halisi ni ‘kukata’, nahau ya Kiswahili ni ‘kufanya agano’; wakati wa sasa unaakisi umbo la kishiriki katika muktadha.
- source_word: נִפְלָאֹת
  choice: maajabu
  rationale: Hueleza matendo ya ajabu yanayozidi uwezo wa kawaida, bila kuyawekea maana finyu ya kimiujiza.
- source_word: לֹא נִבְרְאוּ
  choice: hayajapata kufanywa
  rationale: Kitenzi kwa halisi ni ‘hayakuumbwa’, lakini hapa kinahusu maajabu kutendwa au kutokezwa; ‘hayajapata kufanywa’ ni Kiswahili cha asili huku kikihifadhi upekee wake.
- source_word: נוֹרָא
  choice: linatisha na kustaajabisha
  rationale: Neno linaweza kuonyesha hofu, utisho, na mshangao wa ibada; jozi hii huhifadhi upana huo kuliko ‘la kutisha’ pekee.
- source_word: עֹשֶׂה עִמָּךְ
  choice: ninalokutendea
  rationale: Kirai kina maana pana ya kile Mungu anachofanya pamoja na au kwa ajili ya Musa; muktadha unaruhusu ‘ninalokutendea’, ingawa ‘ninachofanya pamoja nawe’ ni mbadala wa karibu zaidi kimuundo.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni desturi iliyoenea katika Biblia za Kiswahili na huonyesha jina la agano bila kulazimisha matamshi yenye mjadala; herufi kubwa hulitofautisha na cheo cha kawaida.
- issue: Mhusika anayelengwa na עִמָּךְ
  choice: ninalokutendea
  alternative: ninachofanya pamoja nawe
  rationale: Kiwakilishi ni cha umoja na kinamrejelea Musa, huku matokeo yakihusu Israeli yote. Tafsiri haibadilishi umoja kuwa wingi wala kufafanua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimewekwa wazi kwa msomaji wa kawaida, huku uzito wa tamko la agano na upana wa neno נוֹרָא vikihifadhiwa.
