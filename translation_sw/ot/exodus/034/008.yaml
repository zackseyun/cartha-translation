  text: Moses quickly bowed down to the ground and worshiped[a][b].
translation:
  language: sw
  text: Musa akaharakisha, akainama mpaka chini, akaabudu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alifanya haraka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akajisujudu”; kitenzi cha Kiebrania kinaweza kumaanisha kuinama au kujisujudu kwa heshima katika ibada.
