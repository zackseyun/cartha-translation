lexical_decisions:
- source_word: וַיְמַהֵר
  choice: akafanya haraka
  rationale: Kitenzi hiki huonyesha kutenda kwa hima. ‘Akafanya haraka’ ni Kiswahili cha kawaida kinachosisitiza mwitikio wa Musa wa mara moja bila kuongeza kitendo kisichotajwa.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia na matumizi ya Kiswahili.
- source_word: וַיִּקֹּד
  choice: akainama
  rationale: Kitenzi hiki humaanisha kuinamisha mwili. ‘Akainama’ kinaonyesha tendo la kimwili na hakilichanganyi na tendo linalofuata la kuabudu.
- source_word: אַרְצָה
  choice: mpaka chini
  rationale: Umbo lenye mwelekeo linaonyesha kuinama kuelekea ardhini. ‘Mpaka chini’ ni usemi wa asili wa Kiswahili unaoeleza kina cha kuinama bila kudai wazi kwamba uso uligusa ardhi.
- source_word: וַיִּשְׁתָּחוּ
  choice: kuabudu
  rationale: Kitenzi hiki kinaweza kutaja kujisujudu kwa heshima au kuabudu. Katika muktadha wa mwitikio wa Musa kwa kujifunua kwa BWANA, ‘kuabudu’ hudumisha maana ya ibada, huku kitenzi kilichotangulia kikieleza mkao wa mwili.
theological_decisions:
- issue: Iwapo kitenzi cha mwisho kitafsiriwe kama tendo la kimwili tu au kama ibada
  choice: kuabudu
  alternative: kujisujudu
  rationale: Muktadha unaonyesha mwitikio wa heshima na ibada kwa kujifunua kwa BWANA. Hata hivyo, kwa kuwa neno la Kiebrania linaweza pia kueleza kujisujudu, uwezekano huo umehifadhiwa katika tanbihi badala ya kufutwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa mfululizo wa vitenzi umehifadhi mwendo wa simulizi ya Kiebrania.
