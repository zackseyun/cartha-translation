base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/035.yaml
  text: And the sons of Israel saw Moses’ face[a], that the skin of Moses’ face shone[c][b]; and Moses would put the veil back over his face until he went in to speak with him.
translation:
  language: sw
  text: Wana wa Israeli[a] walikuwa wakiuona uso wa Musa, kwamba ngozi ya uso wa Musa iling’aa[b]; naye Musa alikuwa akiweka tena utaji juu ya uso wake mpaka alipoingia kuzungumza naye[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli”; pia hutafsiriwa kwa kawaida “Waisraeli.”'
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kinamaanisha “kung’aa” au “kutoa miale.” Tafsiri ya jadi “ilikuwa na pembe” ilitokana na kutoelewa neno hilo kwa usahihi.
    reason: lexical_alternative
  - marker: c
    text: “Naye” katika “kuzungumza naye” anamrejelea Bwana, kama inavyoonekana katika muktadha wa karibu.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָאוּ
  choice: walikuwa wakiuona
  rationale: Katika muhtasari huu wa matendo yaliyokuwa yakirudiwa, muundo huu unaonyesha kwamba Waisraeli waliuona uso wa Musa kila alipotokea mbele yao.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania kwa namna iliyo wazi na yenye hadhi katika Kiswahili.
- source_word: פְּנֵי מֹשֶׁה
  choice: uso wa Musa
  rationale: Ni tafsiri ya kawaida ya Kiswahili ya mfuatano huu wa nomino, huku ikidumisha mkazo halisi juu ya uso wa Musa.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linatanguliza jambo waliloliona Waisraeli, yaani kung’aa kwa ngozi ya uso wa Musa, badala ya kutoa sababu.
- source_word: קָרַן
  choice: iling’aa
  rationale: Kitenzi hiki kinaeleza kutoa miale au kung’aa; tafsiri hii ni ya kawaida na huepuka maana isiyo sahihi ya kuwa na pembe.
- source_word: עוֹר פְּנֵי מֹשֶׁה
  choice: ngozi ya uso wa Musa
  rationale: Neno עוֹר linamaanisha hasa ngozi, hivyo tafsiri haifupishi usemi huo kuwa uso tu.
- source_word: וְהֵשִׁיב
  choice: alikuwa akiurudisha
  rationale: Hifili ya שוב hapa ina maana ya kurudisha au kuweka tena; muundo wa mazoea unaonyesha tendo lililorudiwa.
- source_word: הַמַּסְוֶה
  choice: utaji
  rationale: Utaji ni neno linalofaa kwa kifuniko kilichowekwa juu ya uso bila kuleta wazo la kisasa la barakoa.
- source_word: עַל־פָּנָיו
  choice: usoni pake
  rationale: Usemi huu wa asili wa Kiswahili unaonyesha kwamba utaji uliufunika uso wake.
- source_word: עַד בֹּאוֹ
  choice: mpaka alipoingia
  rationale: Hueleza kikomo cha muda wa kuvaa utaji, yaani kuingia kwake mbele za Bwana.
- source_word: לְדַבֵּר אִתּוֹ
  choice: kuzungumza naye
  rationale: Huhifadhi kiwakilishi cha Kiebrania bila kuongeza jina la Mungu katika matini kuu.
theological_decisions:
- issue: Mhusika anayerejelewa na “naye” katika kuzungumza
  choice: Kiwakilishi kimehifadhiwa katika matini kuu, na tanbihi inafafanua kuwa kinamrejelea Bwana.
  alternative: Kutafsiri moja kwa moja “kuzungumza na Bwana.”
  rationale: Kiebrania kina kiwakilishi, ingawa muktadha wa karibu unaonyesha wazi kuwa anayerejelewa ni Bwana; kuhifadhi kiwakilishi huepuka kuongeza jina lisilopo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Miundo “walikuwa wakiuona” na “alikuwa akiurudisha” inaonyesha matendo ya mazoea yaliyokuwa yakirudiwa. “Utaji” ni neno linaloeleweka na linafaa zaidi kuliko “barakoa” katika muktadha huu.
