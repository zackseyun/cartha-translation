  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֨ת יָמִ֜ים תֹּאכַ֤ל מַצּוֹת֙ אֲשֶׁ֣ר צִוִּיתִ֔/ךָ לְ/מוֹעֵ֖ד חֹ֣דֶשׁ הָ/אָבִ֑יב כִּ֚י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֔יב יָצָ֖אתָ מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/018.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib[c][b]; for in the month of Abib you came out from Egypt.
translation:
  language: sw
  text: Utaadhimisha Sikukuu ya Mikate Isiyotiwa Chachu[a]. Kwa siku saba utakula mikate isiyotiwa chachu, kama nilivyokuamuru, kwa wakati uliowekwa katika mwezi wa Abibu[b], kwa sababu katika mwezi wa Abibu ulitoka Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maadhimisho ya Mikate Isiyotiwa Chachu.” Neno la Kiebrania חַג linaweza kumaanisha sikukuu au maadhimisho matakatifu yaliyowekwa.
    reason: lexical_alternative
  - marker: b
    text: Abibu ni mwezi wa majira ya kuchipua unaohusishwa hapa na kutoka kwa Israeli Misri.
    reason: cultural_note
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: Sikukuu ya Mikate Isiyotiwa Chachu
  rationale: חַג ni sikukuu au maadhimisho matakatifu yaliyowekwa, nayo מַצּוֹת ni mikate isiyotiwa chachu. Muundo huu ni wa asili katika Kiswahili na unadumisha uzito wa jina la maadhimisho hayo.
- source_word: תִּשְׁמֹר
  choice: Utaadhimisha
  rationale: Katika muktadha wa sikukuu, שׁמר humaanisha kuishika au kuitunza kwa kuiadhimisha. ‘Utaadhimisha’ ni Kiswahili cha sasa na cha kawaida kuliko ‘utaishika,’ huku kikihifadhi maana ya kutekeleza agizo la ibada.
- source_word: שִׁבְעַת יָמִים
  choice: Kwa siku saba
  rationale: Kirai hiki kinaonyesha muda ambao agizo la kula mikate isiyotiwa chachu linatekelezwa.
- source_word: תֹּאכַל מַצּוֹת
  choice: utakula mikate isiyotiwa chachu
  rationale: Wingi ‘mikate’ unawakilisha מַצּוֹת kwa uwazi; ‘isiyotiwa chachu’ inaeleza mikate ambayo haikuchachushwa bila kutumia msamiati wa kidhehebu.
- source_word: אֲשֶׁר צִוִּיתִךָ
  choice: kama nilivyokuamuru
  rationale: Tafsiri hii ya asili inaonyesha kuwa namna na wakati wa maadhimisho hayo vinategemea amri iliyotolewa.
- source_word: לְמוֹעֵד
  choice: kwa wakati uliowekwa
  rationale: מוֹעֵד hapa ni wakati maalumu ulioteuliwa kwa maadhimisho matakatifu.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: mwezi wa Abibu
  rationale: אָבִיב hapa ni jina la mwezi au utambulisho wake wa kale; ‘Abibu’ ni unukuzi unaofaa mfumo wa sauti wa Kiswahili.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי inaanzisha sababu ya agizo hilo na kuunganisha sikukuu na kutoka Misri.
- source_word: יָצָאתָ מִמִּצְרָיִם
  choice: ulitoka Misri
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza יצא מן, ikihifadhi maana ya kutoka nchini Misri bila kuongeza maelezo yasiyomo.
theological_decisions:
- issue: Hadhi ya חַג הַמַּצּוֹת kama jina la maadhimisho ya agano
  choice: Sikukuu ya Mikate Isiyotiwa Chachu
  alternative: sikukuu ya mikate isiyotiwa chachu
  rationale: Herufi kubwa zinaonyesha matumizi yanayofanana na jina rasmi la maadhimisho yaliyowekwa na Mungu, bila kuingiza dai lolote la baadaye la kidhehebu.
- issue: Nafsi ya pili umoja inayoliambia taifa kwa ujumla
  choice: Kudumisha umoja katika ‘utaadhimisha,’ ‘utakula,’ ‘nilivyokuamuru,’ na ‘ulitoka’
  alternative: Kutumia wingi, kama ‘mtaadhimisha,’ au kuongeza jina ‘Israeli’
  rationale: Kiebrania kinatumia nafsi ya pili ya kiume umoja na kumwambia Israeli kwa mtazamo wa pamoja. Kiswahili kinaweza kudumisha umbo hili kwa uwazi.
- issue: Uhusiano kati ya sikukuu na kutoka Misri
  choice: kwa sababu
  alternative: kwa maana
  rationale: כִּי inaonyesha sababu ya kihistoria ya agizo. ‘Kwa sababu’ huweka uhusiano huo wazi bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha nafsi ya pili umoja ya Kiebrania. ‘Utaadhimisha’ limechaguliwa badala ya ‘utaishika’ ili kuepuka usemi usio wa kawaida, na ‘mikate isiyotiwa chachu’ linaeleza מַצּוֹת kwa uwazi.
