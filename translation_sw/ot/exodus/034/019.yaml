  yaml_path: translation/ot/exodus/034/019.yaml
  text: Every firstborn of the womb is mine[a], and every male firstborn among your livestock[c][b], whether ox or sheep.
translation:
  language: sw
  text: Kila mzaliwa wa kwanza ni wangu[a]; na miongoni mwa mifugo yako, kila mzaliwa wa kwanza wa kiume—wa ng’ombe au wa kondoo—ni wangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kila afunguaye tumbo.”
    reason: lexical_alternative
  - marker: b
    text: Usemi wa Kiebrania hubainisha wazaliwa wa kwanza wa kiume miongoni mwa mifugo; “ni wangu” katika sehemu hii imedokezwa kutoka sehemu ya kwanza ya mstari.
    reason: clarification
lexical_decisions:
- source_word: כָּל פֶּטֶר רֶחֶם
  choice: Kila mzaliwa wa kwanza anayefungua tumbo la uzazi
  rationale: Nahau ya Kiebrania inamaanisha uzao wa kwanza kutoka tumboni. Tafsiri hii inatoa maana hiyo kwa Kiswahili cha kawaida huku ikihifadhi taswira ya ‘kufungua tumbo la uzazi.’
- source_word: לִי
  choice: ni wangu
  rationale: Kirai hiki kinaonyesha dai la umiliki. ‘Ni wangu’ ni kifupi, cha asili, na hakiongezi wazo la kuwekwa wakfu ambalo halijasemwa wazi hapa.
- source_word: מִקְנְךָ
  choice: mifugo yako
  rationale: Neno hili linahusu kwa ujumla wanyama wanaomilikiwa katika makundi; ‘mifugo’ linafaa kwa ng’ombe na kondoo wanaotajwa baadaye.
- source_word: תִּזָּכָר
  choice: wa kiume
  rationale: Katika muktadha huu wa sheria, umbo hili kutoka mzizi unaohusiana na jinsia ya kiume linabainisha kwamba wazaliwa wa kwanza wa mifugo wanaokusudiwa ni madume; halimaanishi ‘kukumbukwa.’
- source_word: פֶּטֶר שׁוֹר וָשֶׂה
  choice: ng’ombe au kondoo
  rationale: Kirai kinabainisha aina za mifugo inayohusika. ‘Ng’ombe au kondoo’ ni wazi na cha kawaida katika Kiswahili, bila kulazimisha umri mahususi wa mnyama ambao Kiebrania hakitaji hapa.
theological_decisions:
- issue: Dai la Mungu juu ya wazaliwa wa kwanza
  choice: Kutaja moja kwa moja kwamba mzaliwa wa kwanza ‘ni wangu’
  alternative: Kusema wazi kwamba amewekwa wakfu au anafaa kutolewa dhabihu
  rationale: Kiebrania kinatoa dai la umiliki lakini hakifafanui hapa matokeo yote ya kiibada. Tafsiri inadumisha dai hilo bila kuingiza maelezo ya kiteolojia kutoka vifungu vingine.
- issue: Kitenzi kinachodokezwa katika sehemu ya pili
  choice: Kurudia ‘ni wangu’ baada ya orodha ya mifugo
  alternative: Kuacha sehemu ya pili bila kitenzi, kama muundo wa Kiebrania
  rationale: Kiebrania kinaweza kubeba dai la ‘ni wangu’ kutoka sehemu ya kwanza hadi ya pili. Kulirudia kwa Kiswahili kunafanya sentensi ikamilike kwa kawaida bila kubadili dai la msingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Taswira ya Kiebrania ya kufungua tumbo la uzazi imehifadhiwa, huku muundo wa sentensi ukifanywa wa asili kwa Kiswahili.
