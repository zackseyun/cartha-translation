  terminology: '''Vibao vya mawe,'' ''Mlima Sinai,'' na ''Yahweh'' vinafaa. Maelezo ya chini a yanahitaji kurekebishwa kwa sababu ''akachonga kwa kulipua'' si mbadala wa kimsamiati unaofaa kwa פסל katika muktadha huu.'
