base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/004.yaml
  text: So he cut two stone tablets like the first ones[a], and Moses rose early in the morning and went up Mount Sinai, just as Yahweh had commanded him[b], and he took the two stone tablets in his hand.
translation:
  language: sw
  text: Basi Musa akachonga vibao viwili vya mawe kama vile vya kwanza[a]. Akaamka asubuhi na mapema, akapanda Mlima Sinai kama Yahweh alivyomwamuru, akavichukua vile vibao viwili vya mawe mkononi mwake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akakata” au “akachonga” vibao viwili vya mawe kama vile vya kwanza.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “katika mkono wake”; umoja unaweza kutumiwa kwa namna ya kinahau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְסֹל
  choice: akachonga
  rationale: Kitenzi פסל hapa kinaeleza kutengeneza vibao kwa kukata na kuunda jiwe. ‘Akachonga’ ni Kiswahili cha kawaida kinachowasilisha kazi hiyo kwa uwazi.
- source_word: לֻחֹת אֲבָנִים
  choice: vibao vya mawe
  rationale: Hili ni neno la kawaida na linaloeleweka kwa vibao vya agano vilivyotengenezwa kwa mawe.
- source_word: כָּרִאשֹׁנִים
  choice: kama vile vya kwanza
  rationale: Muundo huu unaonyesha kufanana na vibao vya awali bila kuongeza maelezo yasiyokuwapo katika Kiebrania.
- source_word: וַיַּשְׁכֵּם ... בַבֹּקֶר
  choice: akaamka asubuhi na mapema
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida nahau ya Kiebrania inayomaanisha kuamka mapema.
- source_word: וַיַּעַל אֶל הַר סִינַי
  choice: akapanda Mlima Sinai
  rationale: ‘Akapanda’ huhifadhi wazi mwendo wa kwenda juu ya mlima na ni usemi wa asili katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu lililoandikwa kwa Tetragramatoni linatoholewa badala ya kubadilishwa kuwa cheo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: kama Yahweh alivyokuwa amemwamuru
  rationale: ‘Kama ... alivyokuwa amemwamuru’ huonyesha kwamba Musa alitenda kulingana na amri iliyotolewa kabla ya tendo hili.
- source_word: וַיִּקַּח בְּיָדוֹ
  choice: naye akavichukua ... mkononi mwake
  rationale: Tafsiri hii huhifadhi umoja wa neno la Kiebrania ‘mkono’ huku ikibaki ya kawaida katika Kiswahili.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: vile vibao viwili vya mawe
  rationale: ‘Vile’ huonyesha kuwa vinarejelewa tena vibao viwili ambavyo tayari vimetajwa katika sentensi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina la agano יְהוָה. ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini wa kawaida. Viunganishi vya mfululizo ‘aka-’ vinafuata mwendo wa masimulizi ya Kiebrania bila kufanya sentensi kuwa nzito.
