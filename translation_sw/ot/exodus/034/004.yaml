  rationale: Marekebisho yanaondoa mbadala usio sahihi wa “kulipua,” yanatumia usemi wa Kiswahili ulio wa kawaida zaidi kwa amri iliyotolewa, na yanaweka Musa wazi kama mtendaji wa mfululizo wa vitendo. Maana, umoja wa “mkono,” jina Yahweh, na viambatisho vya tanbihi vinahifadhiwa.
