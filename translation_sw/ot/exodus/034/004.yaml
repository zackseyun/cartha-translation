  verdict: revise
  source_fidelity: 'Tafsiri inawasilisha kwa usahihi vitendo vya msingi: kutengeneza vibao viwili vya mawe, kuamka mapema, kupanda Mlima Sinai kwa kutii amri ya Yahweh, na kuvichukua vibao mkononi. Hata hivyo, ''alivyokuwa amemwamuru'' si uwasilishaji bora wa wakati wa Kiebrania hapa na inaweza kudokeza tendo la mazoea; ''alivyomwamuru'' ni sahihi na wazi zaidi. Kumtaja Musa tangu mwanzo pia huondoa marejeo yasiyo wazi ya kiima bila kuongeza maana.'
