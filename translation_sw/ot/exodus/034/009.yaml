base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
translation:
  language: sw
  text: Akasema, “Ikiwa sasa nimepata kibali machoni pako, Bwana, tafadhali, Bwana na aende katikati yetu,[a] ingawa sisi ni watu wenye shingo ngumu. Utusamehe uovu wetu na dhambi yetu, nawe utufanye kuwa urithi wako.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aende miongoni mwetu” au “aende pamoja nasi.” Kiebrania kinasema kihalisi “aende katikati yetu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania pia kinaweza kueleweka “utuchukue kuwa urithi wako” au “utufanye kuwa mali yako.”
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן
  choice: kibali
  rationale: Katika nahau 'kupata kibali machoni pa,' neno 'kibali' ni la kawaida na la asili katika Kiswahili, huku likidumisha maana ya kukubaliwa kwa neema bila kuingiza maana maalumu ya baadaye ya kiteolojia.
- source_word: בְּעֵינֶיךָ
  choice: machoni pako
  rationale: Hii ni nahau ya Kiebrania inayoweza kueleweka vizuri kwa Kiswahili na inadumisha taswira ya matini chanzi.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hapa ni cheo cha kumwita anayezungumziwa, si jina la Mungu YHWH. 'Bwana' linafaa katika visa vyote viwili na ni la asili katika sala ya Kiswahili.
- source_word: יֵלֶךְ נָא ... בְּקִרְבֵּנוּ
  choice: tafadhali Bwana aende katikati yetu
  rationale: Muundo huu unadumisha wazo la mwendo na uwepo ndani ya jumuiya, huku 'tafadhali' likiwakilisha chembe ya ombi נָא.
- source_word: קְשֵׁה עֹרֶף
  choice: wenye shingo ngumu
  rationale: Tafsiri hii inadumisha sitiari ya Kiebrania ya ukaidi badala ya kuibadilisha moja kwa moja kuwa 'wakaidi.'
- source_word: עַם
  choice: watu
  rationale: Muktadha unawahusu Waisraeli kama jumuiya ya agano, si hasa taifa kwa maana ya kisiasa.
- source_word: עָוֹן
  choice: uovu
  rationale: '''Uovu'' linadumisha uzito wa kosa la kimaadili na kulitofautisha kwa kiasi na חַטָּאת, bila kutumia neno lisilo la kawaida katika Kiswahili cha sasa.'
- source_word: חַטָּאת
  choice: dhambi
  rationale: Hili ndilo neno la kawaida na la moja kwa moja, linalofaa katika ulinganifu wake na עָוֹן.
- source_word: וּנְחַלְתָּנוּ
  choice: utufanye kuwa urithi wako
  rationale: Kitenzi kinaweza kueleza kuwachukua au kuwaweka watu kuwa urithi/mali ya Mungu. Kauli hii inadumisha lugha ya urithi na uhusiano wa agano kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Maana ya כִּי kabla ya 'watu wenye shingo ngumu'
  choice: ingawa sisi ni watu wenye shingo ngumu
  alternative: kwa maana sisi ni watu wenye shingo ngumu
  rationale: 'Katika muktadha wa ombi, kishazi kinaeleweka kwa nguvu kama concessive: Musa anaomba uwepo na msamaha wa Mungu licha ya ukaidi wa watu. Hata hivyo, כִּי linaweza pia kuwa la kisababishi; mvutano huo umeonyeshwa katika tanbihi.'
- issue: Tafsiri ya אֲדֹנָי katika sala inayoelekezwa kwa YHWH
  choice: Bwana
  alternative: Bwana wangu
  rationale: Matini ina cheo אֲדֹנָי, si jina YHWH. 'Bwana' linaonyesha cheo hicho bila kuingiza jina la agano wala kuongeza kimilikishi kisicholazimika katika Kiswahili.
- issue: Maana ya וּנְחַלְתָּנוּ
  choice: utufanye kuwa urithi wako
  alternative: utuchukue kuwa mali yako
  rationale: Chaguo hili linahifadhi lugha ya urithi na wazo la watu kuwa sehemu ya Mungu katika uhusiano wa agano, bila kufunga kabisa maana pana ya kumiliki au kuwachukua kuwa wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sala ni wa kawaida na unaoeleweka; sitiari ya 'shingo ngumu' na lugha ya 'urithi' zimehifadhiwa kwa sababu ni muhimu katika taswira na teolojia ya kifungu.
