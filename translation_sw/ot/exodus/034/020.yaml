base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/020.yaml
  text: You shall redeem the firstborn of a donkey with a lamb[a]; and if you do not redeem it, then you shall break its neck. You shall redeem every firstborn of your sons[c][b]. And none shall appear before me empty-handed.
translation:
  language: sw
  text: Mzaliwa wa kwanza wa punda utamkomboa kwa kondoo au mbuzi[a]; lakini usipomkomboa, utamvunja shingo. Kila mzaliwa wa kwanza wa wanao utamkomboa. Wala wasije mbele zangu[b] mikono mitupu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania שֶׂה humaanisha mnyama mmoja wa kundi, yaani kondoo au mbuzi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mbele ya uso wangu”; hii ni nahau ya kuja katika uwepo wa Mungu.
    reason: lexical_alternative
  - marker: c
    text: Yaani, bila zawadi au sadaka.
    reason: cultural_note
lexical_decisions:
- source_word: פֶטֶר חֲמוֹר
  choice: mzaliwa wa kwanza wa punda
  rationale: Katika sheria hii פֶטֶר hurejelea mnyama anayefungua tumbo la uzazi kwanza; “mzaliwa wa kwanza” ni tafsiri ya kawaida na iliyo wazi kwa Kiswahili.
- source_word: תִּפְדֶּה
  choice: utamkomboa
  rationale: Kitenzi פדה katika muktadha huu wa sheria ya ibada humaanisha kumwachilia kwa kutoa mbadala au malipo; “kumkomboa” hudumisha maana hiyo.
- source_word: בְשֶׂה
  choice: kwa kondoo au mbuzi
  rationale: שֶׂה inaweza kumaanisha mnyama mmoja wa kundi la kondoo au mbuzi. Kutaja aina zote mbili huepuka kuibana maana kuwa mwana-kondoo pekee.
- source_word: וַעֲרַפְתּוֹ
  choice: utamvunja shingo
  rationale: ערף humaanisha kuvunja shingo, hasa katika tendo la kuua lililoagizwa; tafsiri hii ni sahihi na ya kawaida.
- source_word: כֹּל בְּכוֹר בָּנֶיךָ
  choice: kila mzaliwa wa kwanza wa wana wako
  rationale: Kifungu hiki kinawahusu wazaliwa wa kwanza wa kiume; “wana” huhifadhi ubainifu wa jinsia uliomo katika Kiebrania.
- source_word: יֵרָאוּ פָנַי
  choice: asije mbele zangu
  rationale: Kauli ya Kiebrania, kihalisi “asionekane mbele ya uso wangu,” ni nahau ya kuja katika uwepo wa Mungu kwa ibada. Kiswahili “kuja mbele zangu” ni cha kawaida na huhifadhi usemi wa nafsi ya kwanza.
- source_word: רֵיקָם
  choice: mikono mitupu
  rationale: Katika muktadha wa kuja kuabudu, רֵיקָם humaanisha kuja bila zawadi au sadaka; “mikono mitupu” ni nahau ya asili ya Kiswahili.
theological_decisions:
- issue: Rejeo la Mungu katika nafsi ya kwanza kwenye kishazi cha mwisho
  choice: mbele zangu
  alternative: mbele ya uso wangu
  rationale: Kiebrania hutumia “uso wangu” kama nahau ya uwepo wa Mungu. “Mbele zangu” huhifadhi sauti ya Mungu ya moja kwa moja bila kuongeza dhana nyingine ya kitheolojia.
- issue: Lugha ya kijinsia katika בָּנֶיךָ
  choice: wana wako
  alternative: watoto wako
  rationale: Neno la Kiebrania linawataja wana wa kiume waziwazi; halipaswi kupanuliwa kimya kimya kuwa watoto wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria na kiibada lakini kinachoeleweka kwa wasomaji wa kawaida. Umoja wa “mtu yeyote” umetumiwa kwa ufasaha ili kuwasilisha katazo la jumla la wingi katika Kiebrania. Alama zote za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
