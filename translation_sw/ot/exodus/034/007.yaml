source:
  edition: WLC
  text: נֹצֵ֥ר חֶ֨סֶד֙ לָ/אֲלָפִ֔ים נֹשֵׂ֥א עָוֺ֛ן וָ/פֶ֖שַׁע וְ/חַטָּאָ֑ה וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֣ד עֲוֺ֣ן אָב֗וֹת עַל בָּנִים֙ וְ/עַל בְּנֵ֣י בָנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/007.yaml
  text: keeping steadfast love for thousands[a], forgiving iniquity and transgression and sin, but he will by no means leave unpunished, visiting the iniquity of fathers on children and on children's children[c][b], to the third and to the fourth generation.
translation:
  language: sw
  text: anayehifadhi upendo thabiti kwa maelfu[a], anayesamehe uovu, uasi na dhambi, lakini kwa hakika hatawaacha wenye hatia bila adhabu[b], anayewapatiliza watoto na watoto wa watoto kwa uovu wa baba zao[c], hata kizazi cha tatu na cha nne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa vizazi elfu.” Kiebrania kinasema tu “kwa maelfu,” huenda kikilinganisha kudumu kwa upendo wa Mungu na hukumu inayofika “hata kizazi cha tatu na cha nne.”
    reason: alternative_reading
  - marker: b
    text: Au, “kwa hakika hatawaachilia bila kuwaadhibu” au “kwa hakika hatawahesabu kuwa hawana hatia.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema “baba” na “watoto wa watoto”; “baba” limehifadhiwa kwa sababu chanzo kimetumia neno mahsusi la kiume, ingawa maana inahusu mfululizo wa vizazi.
    reason: cultural_note
lexical_decisions:
- source_word: נֹצֵר
  choice: anayehifadhi
  rationale: Kitenzi hiki kina maana ya kutunza, kulinda au kudumisha. “Anayehifadhi” kinaonyesha tendo endelevu na kinafaa katika tamko hili la tabia ya Mungu.
- source_word: חֶסֶד
  choice: upendo thabiti
  rationale: Neno hili linaunganisha upendo na uaminifu wa kudumu. “Upendo thabiti” ni lugha ya sasa inayoeleweka bila kupoteza uzito wake wa agano.
- source_word: לָאֲלָפִים
  choice: kwa maelfu
  rationale: Kiebrania kinasema tu “kwa maelfu” bila kutaja wazi watu au vizazi; tafsiri hii inahifadhi kutobainishwa huko.
- source_word: נֹשֵׂא
  choice: anayesamehe
  rationale: Ingawa maana ya msingi ni kubeba au kuondoa, pamoja na maneno ya dhambi kitenzi hiki hutumiwa kwa maana ya kusamehe.
- source_word: עָוֺן וָפֶשַׁע וְחַטָּאָה
  choice: uovu, uasi na dhambi
  rationale: 'Maneno matatu yametofautishwa ili kuhifadhi mlundikano wa Kiebrania: upotovu wa maadili, kuvunja uaminifu kwa kuasi, na dhambi kwa maana pana.'
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: lakini kwa hakika hatawaacha wenye hatia bila adhabu
  rationale: Muundo wa Kiebrania unasisitiza kwamba hatawaacha bila kuwaadhibu. “Wenye hatia” ni shamirisho linalodokezwa na kitenzi cha kimahakama na linafanya sentensi iwe ya kawaida kwa Kiswahili.
- source_word: פֹּקֵד
  choice: anayepatiliza
  rationale: Katika muktadha wa hukumu, “kupatiliza” huonyesha kuleta matokeo ya uovu bila kulifanya neno liwe sawa moja kwa moja na “kuadhibu” pekee.
- source_word: עֲוֺן אָבוֹת
  choice: uovu wa baba
  rationale: “Baba” linahifadhi umbo mahsusi la kiume katika chanzo, huku muktadha ukionyesha mfululizo wa vizazi.
- source_word: עַל בָּנִים וְעַל בְּנֵי בָנִים
  choice: kwa watoto wao na kwa watoto wa watoto wao
  rationale: Hii ni lugha ya kawaida ya Kiswahili inayoonyesha uzao unaofuata bila kulazimisha kwamba wanaume pekee ndio wanaokusudiwa.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: hata kizazi cha tatu na cha nne
  rationale: Neno “kizazi” halipo wazi katika Kiebrania lakini linadokezwa na mlolongo wa kifamilia; kuliongeza kunafanya maana iwe wazi kwa Kiswahili.
theological_decisions:
- issue: Mvutano kati ya msamaha wa Mungu na haki yake
  choice: Kuhifadhi kauli kamili ya msamaha pamoja na kauli iliyosisitizwa kwamba wenye hatia hawataachwa bila adhabu.
  alternative: “anayesamehe ... lakini kwa vyovyote hasafishi”
  rationale: Mstari wenyewe unaweka rehema na hukumu pamoja; tafsiri haipunguzi upande wowote wala kueleza kimadhehebu jinsi zinavyohusiana.
- issue: Iwapo “vizazi” liongezwe baada ya “maelfu”
  choice: Kutotaja “vizazi” katika matini kuu.
  alternative: “kwa vizazi elfu” au “kwa maelfu ya vizazi”
  rationale: Tofauti na vifungu vingine vinavyofanana, mstari huu unasema tu “kwa maelfu.” Kutobainisha kinachohesabiwa kunahifadhi upana na utata halisi wa chanzo.
- issue: Uovu wa baba kupatilizwa kwa vizazi vinavyofuata
  choice: Kuhifadhi lugha ya chanzo kuhusu kupatiliza uovu kwa watoto na vizazi vyao.
  alternative: Kufafanua moja kwa moja kuwa watoto huadhibiwa tu wanaporudia uovu huo.
  rationale: Sharti hilo halijasemwa katika mstari huu. Tafsiri inahifadhi mvutano wa matini bila kuuingizia ufafanuzi wa kiteolojia kutoka vifungu vingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa vipashio “anayehifadhi ... anayesamehe ... anayepatiliza” unahifadhi mtiririko wa tamko la Kiebrania. “Kupatiliza” ni neno rasmi linalofaa katika muktadha wa hukumu, huku maelezo ya pambizo yakisaidia pale ambapo tafsiri nyingine zinawezekana.
