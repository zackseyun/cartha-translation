  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
translation:
  language: sw
  text: Badala yake,[a] zibomoeni madhabahu zao, zivunjeni vipande nguzo zao za ibada, na zikateni nguzo zao za Ashera.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana zibomoeni madhabahu zao…” Kiunganishi cha Kiebrania kinaweza kutafsiriwa “kwa maana,” lakini katika muktadha huu kinaweza kueleweka kama kuonyesha jambo la kufanya badala ya lile lililokatazwa kabla yake.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Ashera zao”; au, “Asherimu zao.” Neno hilo linarejelea vitu vya ibada vilivyohusishwa na Ashera.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Badala yake
  rationale: Katika muktadha, kiunganishi hiki kinaonyesha tendo linalotakiwa kinyume na katazo la mstari uliotangulia. Hata hivyo, maana ya ‘kwa maana’ pia inawezekana na imehifadhiwa katika tanbihi.
- source_word: מִזְבְּחֹתָם
  choice: madhabahu zao
  rationale: Hili ni neno la kawaida na wazi la Kiswahili kwa madhabahu za ibada; kiambishi cha nafsi ya tatu wingi kimehifadhiwa kwa ‘zao’.
- source_word: תִּתֹּצוּן
  choice: zibomoeni
  rationale: Kitenzi נתץ humaanisha kubomoa au kuangusha miundo; ‘zibomoeni’ ni amri ya kawaida inayofaa madhabahu.
- source_word: מַצֵּבֹתָם
  choice: nguzo zao za ibada
  rationale: מַצֵּבָה hapa ni jiwe lililosimamishwa kwa matumizi ya kidini. ‘Nguzo za ibada’ huonyesha kazi yake bila kudai umbo maalumu kuliko ushahidi wa Kiebrania.
- source_word: תְּשַׁבֵּרוּן
  choice: zivunjeni vipande
  rationale: Kauli ya Piel ya שׁבר inaonyesha kuvunja kwa nguvu; ‘zivunjeni vipande’ huwasilisha uzito huo kwa Kiswahili cha kawaida.
- source_word: אֲשֵׁרָיו
  choice: nguzo zao za Ashera
  rationale: Neno hili linaelekea kumaanisha vitu vya ibada vilivyohusishwa na Ashera. ‘Nguzo za Ashera’ ni wazi kwa msomaji, huku tanbihi ikihifadhi uwezekano wa tafsiri rasmi zaidi.
- source_word: תִּכְרֹתוּן
  choice: zikateni
  rationale: כרת humaanisha kukata; kwa vitu vya Ashera vinavyodhaniwa kuwa vya mbao, ‘zikateni’ ni ya moja kwa moja na ya asili.
theological_decisions:
- issue: Kinachorejelewa na אֲשֵׁרָיו
  choice: vitu vya ibada vinavyohusishwa na Ashera, vilivyotafsiriwa ‘nguzo zao za Ashera’
  alternative: ‘Asherimu zao’ au sanamu/vitu vya ibada vya Ashera
  rationale: Orodha hii inataja vitu halisi vinavyopaswa kuharibiwa, na kitenzi ‘kukata’ kinaelekea kuonyesha vitu vya mbao. Tafsiri hii inadumisha uhusiano na jina Ashera bila kukifanya kiwe jina la mungu wa kike mwenyewe katika sentensi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Amri za wingi zimetumiwa kwa uthabiti. ‘Nguzo za ibada’ hufafanua matumizi ya mawe yaliyosimamishwa, na ‘nguzo za Ashera’ hutofautishwa kwa kutaja uhusiano wake mahususi wa kiibada.
