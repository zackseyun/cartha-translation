base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/014.yaml
  text: For you shall not bow down to another god[a], for Yahweh, whose name is Jealous[c][b], is a jealous God.
translation:
  language: sw
  text: Kwa maana usimsujudie mungu mwingine[a], kwa sababu Yahwe—Jina lake ni Mwenye Wivu[b]—ni Mungu mwenye wivu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usimwabudu mungu mwingine.” Kitenzi cha Kiebrania humaanisha hasa kuinama au kujitupa chini, mara nyingi kama tendo la ibada.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kwa sababu Yahwe—Mwenye Wivu ndilo jina lake—ni Mungu mwenye wivu.”'
    reason: lexical_alternative
  - marker: c
    text: “Wivu” hapa unaonyesha dai la kipekee la Yahwe la kuabudiwa na watu wa agano lake, wala si husuda yenye dhambi.
    reason: cultural_note
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: usimsujudie
  rationale: Kitenzi hiki humaanisha kuinama au kujitupa chini mbele ya mtu, mara nyingi kama tendo la ibada. ‘Kusujudia’ huhifadhi tendo halisi na maana yake ya ibada katika muktadha.
- source_word: לְאֵל אַחֵר
  choice: mungu mwingine
  rationale: אֵל ni ‘mungu’ na אַחֵר ni ‘mwingine’; tafsiri hii ni ya moja kwa moja bila kuingiza maana finyu ya ‘mungu wa kigeni.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahwe,’ badala ya kubadilishwa na cheo, ili kuhifadhi jina la agano lililo katika maandishi ya Kiebrania.
- source_word: קַנָּא
  choice: Mwenye Wivu / mwenye wivu
  rationale: Neno linaonyesha dai la Yahwe la kuabudiwa peke yake na kutokubali ibada ya miungu mingine. ‘Mwenye Wivu’ katika kauli kuhusu jina, kisha ‘mwenye wivu’ kama sifa, huhifadhi urudiaji wa Kiebrania.
- source_word: שְׁמוֹ
  choice: Jina lake ni
  rationale: Hii inafuata kwa karibu muundo wa Kiebrania na kuonyesha kwamba ‘Mwenye Wivu’ hutumika hapa kama jina au utambulisho.
- source_word: אֵל קַנָּא הוּא
  choice: ni Mungu mwenye wivu
  rationale: Tafsiri hii huhifadhi kauli ya Kiebrania kwamba yeye ni Mungu mwenye wivu na inaunganika kwa kawaida na kishazi kilichotangulia.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Andiko linatumia moja kwa moja jina la Mungu la herufi nne. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya קַנָּא kama jina na sifa ya Mungu
  choice: Mwenye Wivu / mwenye wivu
  alternative: Mwenye Bidii / mwenye bidii
  rationale: ‘Wivu’ huhifadhi msisitizo wa dai la kipekee la Yahwe kwa ibada ya watu wake. Tanbihi inaeleza kwamba hapa si husuda yenye dhambi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Kusujudia’ huhifadhi picha halisi ya tendo la Kiebrania; alama za dash zinaweka wazi kauli ya katikati kuhusu jina bila kuondoa mkazo wake.
