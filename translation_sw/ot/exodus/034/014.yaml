  source_fidelity: 'Tafsiri huhifadhi vipengele vya msingi vya Kiebrania: katazo la kusujudu mbele ya mungu mwingine, jina Yahwe, kauli kwamba “Mwenye Wivu” ni jina lake, na urudiaji wa sifa “mwenye wivu.” “Usimsujudie” huonyesha vizuri tendo la kujinama/kusujudu lililomo katika תִשְׁתַּחֲוֶה, bila kulifanya kuwa tafsiri ya kipekee ya “kuabudu.”'
