base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/026.yaml
  text: You shall bring the first of the firstfruits of your ground to the house of Yahweh your God[a]. You shall not boil a young goat in its mother's milk.
translation:
  language: sw
  text: Utaleta malimbuko ya kwanza[a] ya ardhi yako katika nyumba ya Yahwe, Mungu wako. Usimchemshe mwana-mbuzi katika maziwa ya mama yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu bora ya malimbuko ya ardhi yako.”
    reason: רֵאשִׁית linaweza kueleweka kuwa sehemu ya kwanza, na hivyo yenye kuchaguliwa au iliyo bora, katika muktadha wa sadaka.
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: malimbuko ya kwanza
  rationale: Muungano huu unasisitiza mwanzo au sehemu ya kwanza ya mazao ya kwanza. Tafsiri hii inadumisha uradidi na maana ya msingi bila kuamua kimya-kimya kwamba msisitizo ni ubora pekee.
- source_word: אַדְמָתְךָ
  choice: ardhi yako
  rationale: Hapa neno linamaanisha ardhi inayolimwa na kuzaa mazao; “ardhi yako” ni ya kawaida na inaeleweka katika muktadha wa kilimo.
- source_word: תָּבִיא
  choice: utaleta
  rationale: Kauli ya wakati ujao katika sheria ya agano hutumika kama amri; “utaleta” inadumisha mtindo wa kisheria wenye heshima.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: katika nyumba ya Yahwe, Mungu wako
  rationale: “Nyumba” inadumisha בית bila kutumia “hekalu,” neno ambalo lingekuwa mahususi mno kihistoria katika muktadha huu. Jina la Mungu limetoholewa kama “Yahwe.”
- source_word: לֹא תְבַשֵּׁל
  choice: usimpike
  rationale: בשל linaweza kumaanisha kupika au kuchemsha. “Usimpike” ni Kiswahili cha sasa na cha kawaida, huku kikiacha namna mahususi ya upishi ikiwa wazi kama ilivyo katika upana wa kitenzi hicho.
- source_word: גְּדִי
  choice: mwana-mbuzi
  rationale: Hili linataja mbuzi mchanga; “mwana-mbuzi” ni wazi kwa msomaji wa sasa.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: katika maziwa ya mama yake
  rationale: Tafsiri hii inadumisha picha halisi na uhusiano wa umilikaji wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko lina jina binafsi la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya רֵאשִׁית katika רֵאשִׁית בִּכּוּרֵי
  choice: malimbuko ya kwanza
  alternative: sehemu bora ya malimbuko
  rationale: רֵאשִׁית kimsingi huonyesha mwanzo au kilicho cha kwanza, ingawa katika sadaka kinaweza pia kudokeza sehemu bora. Maandishi makuu yanahifadhi maana ya kwanza, na uwezekano wa ubora umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. “Malimbuko” ni istilahi ya kidini iliyozoeleka; “mwana-mbuzi” na “usimpike” ni maneno ya sasa na yaliyo wazi.
