  text: You shall not make cast-metal gods for yourself[a].
translation:
  language: sw
  text: Usijifanyie miungu ya kusubu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miungu ya metali iliyomiminwa” au “miungu ya metali iliyosubu.” Neno la Kiebrania מַסֵּכָה humaanisha kitu, hasa sanamu, kilichotengenezwa kwa kusubu metali.
    reason: Hutoa mbadala wa kimsamiati na kufafanua maana ya neno la Kiebrania bila kuongeza ‘sanamu’ katika matini kuu.
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: miungu
  rationale: Ni umbo la wingi katika hali ya utegemezi; katika muktadha wa katazo la ibada ya sanamu, linarejelea miungu inayotengenezwa.
- source_word: מַסֵּכָה
  choice: ya metali iliyomiminwa
  rationale: Neno hili humaanisha kitu cha metali kilichotengenezwa kwa kuyeyushwa na kumiminwa. Tafsiri hii inaeleweka kwa urahisi na inahifadhi wazo la mchakato na nyenzo bila kuongeza neno ‘sanamu’ katika matini kuu.
- source_word: לֹא תַעֲשֶׂה
  choice: Usijitengenezee
  rationale: Muundo wa kukanusha katika muktadha wa sheria unatoa katazo la moja kwa moja. ‘Usijitengenezee’ ni Kiswahili cha kawaida kinachoonyesha tendo la kutengeneza pamoja na wazo la kufanya kwa ajili yako mwenyewe.
- source_word: לָּךְ
  choice: -ji- katika ‘Usijitengenezee’
  rationale: Kiambishi cha kujirejelea kinaonyesha kwa njia ya asili maana ya ‘kwa ajili yako mwenyewe’ iliyomo katika לָּךְ.
theological_decisions:
- issue: Aina ya vitu vinavyokatazwa
  choice: miungu ya metali iliyomiminwa
  alternative: sanamu zilizoyeyushwa; miungu ya kusubu
  rationale: Kiebrania kinatumia ‘miungu’ pamoja na neno linalohusu kitu cha metali kilichomiminwa. Tafsiri iliyochaguliwa inahifadhi marejeo ya miungu ya uongo na namna ya kuitengeneza, bila kubadili ‘miungu’ kuwa ‘sanamu’ pekee wala kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; amri ni fupi, ya moja kwa moja na yenye hadhi. ‘Iliyomiminwa’ ni ya kawaida zaidi kuliko istilahi ya kiufundi ‘ya kusubu,’ ambayo imehifadhiwa katika tanbihi.
