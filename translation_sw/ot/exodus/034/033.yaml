  text: When Moses finished speaking with them[a], he put a veil over his face.
translation:
  language: sw
  text: Musa alipomaliza kuzungumza nao,[a] aliweka utaji juu ya uso wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipoacha kuzungumza nao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: alipomaliza
  rationale: Kitenzi כלה hapa kinaonyesha kukamilika kwa tendo la kuzungumza; “alipomaliza” ni Kiswahili cha kawaida na kinafaa katika kishazi cha wakati.
- source_word: מִדַּבֵּר
  choice: kuzungumza
  rationale: Muundo wa kitenzi-jina baada ya כלה unaeleza tendo lililokamilika; “kumaliza kuzungumza” ni muundo wa asili katika Kiswahili.
- source_word: אִתָּם
  choice: nao
  rationale: Kihusishi את pamoja na kiambishi cha nafsi kinawakilishwa moja kwa moja kama “nao,” yaani “pamoja nao,” bila kukibadili kuwa “kwao.”
- source_word: וַיִּתֵּן
  choice: akaweka
  rationale: נתן pamoja na על hapa humaanisha kuweka kitu juu ya kingine; “akaweka” ni ya kawaida na huhifadhi mfuatano wa simulizi.
- source_word: עַל פָּנָיו
  choice: juu ya uso wake
  rationale: Tafsiri hii inafuata taswira ya Kiebrania ya kuweka kifuniko juu ya uso na inaeleweka wazi katika Kiswahili.
- source_word: מַסְוֶה
  choice: utaji
  rationale: Katika muktadha huu neno linamaanisha kifuniko cha uso; “utaji” ni neno la Kiswahili linalofaa kwa kitambaa cha kufunika uso.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Kiunganishi “aka-” kinadumisha mfuatano wa matendo katika simulizi, na “nao” kinahifadhi maana ya msingi ya אִתָּם.
