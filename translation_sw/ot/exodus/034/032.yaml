base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/032.yaml
  text: Afterward all the sons of Israel came near[a], and he commanded them all that Yahweh had spoken with him on Mount Sinai.
translation:
  language: sw
  text: Baadaye Waisraeli wote[a] wakakaribia, naye akawaagiza mambo yote ambayo Yahweh alikuwa amenena na Musa juu ya Mlima Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “wana wote wa Israeli”; huu ni usemi wa kitaifa unaomaanisha Waisraeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  choice: Baadaye
  rationale: Huonyesha kwamba tukio hili lilifuata tukio lililotangulia; “Baadaye” ni ya kawaida na wazi katika Kiswahili.
- source_word: נִגְּשׁוּ
  choice: wakakaribia
  rationale: Kitenzi hiki humaanisha kuja karibu au kukaribia. “Wakakaribia” huhifadhi mwendo halisi wa watu kuelekea karibu na Musa.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli wote[a]
  rationale: Ingawa muundo wa Kiebrania ni “wana wote wa Israeli,” hapa ni jina la kitaifa linalowahusu watu wa Israeli kwa jumla. “Waisraeli wote” ni Kiswahili cha asili na huepuka kueleweka kana kwamba ni wana wa kiume tu; tanbihi huhifadhi umbo la Kiebrania.
- source_word: וַיְצַוֵּם
  choice: akawaagiza
  rationale: צוה ina nguvu ya kutoa agizo au amri. “Akawaagiza” ni ya kawaida kwa kuwasilisha maagizo yenye mamlaka bila kuongeza kitenzi kisichokuwapo kama “wafanye.”
- source_word: אֵת כָּל אֲשֶׁר
  choice: mambo yote ambayo
  rationale: Hutambulisha maudhui yote ya maneno yaliyofuata. Kiswahili huhitaji nomino kama “mambo” ili sentensi iwe wazi na ya kawaida.
- source_word: דִּבֶּר יְהוָה אִתּוֹ
  choice: ambayo Yahweh alikuwa amesema naye
  rationale: “Alikuwa amesema” huonyesha kwamba usemi wa Yahweh ulitangulia maagizo ya Musa, na “naye” huhifadhi wazo la Kiebrania la kusema pamoja naye badala ya kulibadili moja kwa moja kuwa “alimwambia.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa herufi יהוה linatolewa kama “Yahweh,” si kubadilishwa kuwa cheo.
- source_word: בְּ/הַר סִינָי
  choice: juu ya Mlima Sinai
  rationale: Hueleza mahali ambapo Yahweh alisema na Musa; “juu ya Mlima Sinai” ni wazi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko lina jina binafsi la Mungu, si cheo; “Yahweh” hulihifadhi kama jina bila kulibadilisha kuwa “BWANA.”
- issue: Maana ya kitaifa ya בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli wote
  alternative: wana wote wa Israeli
  rationale: Katika muktadha huu usemi ni jina la taifa zima. Tafsiri ya neno kwa neno “wana” inaweza kueleweka katika Kiswahili kuwa wanaume pekee, hivyo “Waisraeli” huhifadhi maana ya rejeleo huku tanbihi ikionyesha umbo halisi la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi “wakakaribia ... akawaagiza” unaendeleza mfuatano wa matukio kwa ufasaha.
