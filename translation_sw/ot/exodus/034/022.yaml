  text: And you shall observe for yourself the Feast of Weeks[a], the firstfruits of the wheat harvest, and the Feast of Ingathering at the turn of the year.
translation:
  language: sw
  text: Utaadhimisha Sikukuu ya Majuma, ya malimbuko ya mavuno ya ngano, na Sikukuu ya Kukusanya Mazao wakati wa mzunguko wa mwaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwishoni mwa mwaka.” Kirai cha Kiebrania kinarejelea kihalisi kugeuka au mzunguko wa mwaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג
  choice: Sikukuu
  rationale: Katika muktadha huu neno hili linamaanisha sikukuu ya kidini, hasa mojawapo ya sikukuu zilizowataka watu wakusanyike mbele za Mungu.
- source_word: שָׁבֻעֹת
  choice: Majuma
  rationale: Jina la sikukuu hii kwa Kiebrania linamaanisha moja kwa moja ‘Majuma’; tafsiri hii inalihifadhi jina la asili badala ya kutumia jina la baadaye ‘Pentekoste’.
- source_word: תַּעֲשֶׂה לְךָ
  choice: Utaadhimisha
  rationale: Ingawa maana ya msingi ni ‘utafanya kwa ajili yako,’ katika muktadha wa sikukuu kitenzi hiki humaanisha kuitunza au kuiadhimisha sikukuu. ‘Utaadhimisha’ ni Kiswahili cha kawaida na chenye hadhi kinachoonyesha wajibu huo.
- source_word: בִּכּוּרֵי
  choice: malimbuko
  rationale: Neno hili linataja mazao ya kwanza ya mavuno, hasa yale yaliyotolewa kwa Mungu; ‘malimbuko’ ni istilahi sahihi na iliyozoeleka katika Kiswahili cha kibiblia.
- source_word: קְצִיר חִטִּים
  choice: mavuno ya ngano
  rationale: Muundo huu unamaanisha kuvunwa kwa ngano; ‘mavuno ya ngano’ ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: הָאָסִיף
  choice: Kukusanya Mazao
  rationale: Neno hili linahusu kukusanywa kwa mazao shambani na linafanya kazi hapa kama jina la sikukuu. Kutaja ‘Mazao’ huweka wazi kinachokusanywa bila kubadili maana.
- source_word: תְּקוּפַת הַשָּׁנָה
  choice: mwaka unapokamilisha mzunguko wake
  rationale: Kirai hiki kinahusu kugeuka au kukamilika kwa mzunguko wa mwaka. Tafsiri hii ni ya asili katika Kiswahili na huepuka kudokeza kwamba lazima iwe siku ya mwisho ya mwaka wa kalenda.
