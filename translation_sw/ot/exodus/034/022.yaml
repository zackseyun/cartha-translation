  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya sikukuu yameandikwa kwa herufi kubwa. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, yaani maelezo ya mzunguko wa mwaka.
