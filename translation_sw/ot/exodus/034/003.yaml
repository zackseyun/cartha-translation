  text: And no man shall go up with you[a], and indeed no man shall be seen anywhere on the mountain[b]; even the flock and the herd must not graze in front of that mountain.
translation:
  language: sw
  text: Mtu yeyote asipande pamoja nawe; wala mtu yeyote asionekane[a] popote mlimani. Hata kondoo na ng’ombe wasilishe mbele ya mlima huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asijitokeze.” Umbo la kitenzi cha Kiebrania linaweza kumaanisha “kuonekana” au “kujitokeza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: mtu yeyote
  rationale: Katika marufuku hii nomino ya umoja ina maana ya jumla, hivyo ‘mtu yeyote’ ni Kiswahili cha kawaida kinachowahusu wanadamu wote bila kupoteza nguvu ya katazo.
- source_word: יַעֲלֶה עִמָּךְ
  choice: asipande pamoja nawe
  rationale: Kitenzi עלה kinaeleza kupanda kwenda mlimani; ‘asipande pamoja nawe’ huhifadhi mwelekeo na uandamani.
- source_word: וְגַם
  choice: tena
  rationale: ‘Tena’ huendeleza na kutilia mkazo katazo la pili kwa njia ya kawaida katika Kiswahili.
- source_word: אַל יֵרָא
  choice: asionekane
  rationale: Nifali ya ראה inaweza kumaanisha ‘kuonekana’ au ‘kujitokeza’; ‘asionekane’ huhifadhi maana ya msingi huku tanbihi ikitaja uwezekano mwingine.
- source_word: בְּכָל הָהָר
  choice: popote mlimani
  rationale: Usemi huu unakataza kuwapo katika sehemu yoyote ya eneo lote la mlima; ‘popote mlimani’ ni wazi na wa kawaida.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: kondoo na ng’ombe
  rationale: Jozi hii hutaja mifugo midogo na mikubwa kwa pamoja; majina ya kawaida ‘kondoo na ng’ombe’ yanaeleweka kwa urahisi katika Kiswahili cha Afrika Mashariki.
- source_word: אַל יִרְעוּ
  choice: wasilishe
  rationale: Kwa wanyama, רעה humaanisha kula majani au malisho; ‘wasilishe’ ni katazo fupi na la kawaida.
- source_word: אֶל מוּל
  choice: mbele ya
  rationale: Kirai hiki cha mahali humaanisha upande unaokabili au ulio mbele ya kitu; ‘mbele ya’ huhifadhi uhusiano huo bila kuufafanua kupita kiasi.
- source_word: הָהָר הַהוּא
  choice: mlima huo
  rationale: Kiwakilishi-kionyeshi kinabainisha mlima maalumu uliotajwa; ‘mlima huo’ ni tafsiri ya moja kwa moja na ya kawaida.
