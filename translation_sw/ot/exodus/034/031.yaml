  text: But Moses called to them[a], and Aaron and all the leaders of the congregation returned to him, and Moses spoke to them.
translation:
  language: sw
  text: Lakini Musa akawaita, nao Haruni na viongozi wote wa kusanyiko[a] wakamrudia. Kisha Musa akasema nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakuu wa kusanyiko” au “viongozi wa jumuiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֲלֵהֶם
  choice: Musa akawaita
  rationale: Kitenzi קרא pamoja na אֶל kinaonyesha kuwa Musa aliwaita wale waliokuwa wameogopa kumkaribia. “Akawaita” ni kauli ya kawaida na haiongezi wazo kali la kutoa amri.
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: wakamrudia
  rationale: שׁוב humaanisha kurudi; hapa Haruni na viongozi wanarudi kwa Musa baada ya kujitenga naye. “Wakamrudia” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: הַנְּשִׂאִים
  choice: viongozi
  rationale: נָשִׂיא hapa huonyesha watu wenye nafasi ya uongozi katika jamii, si lazima wana wa kifalme. “Viongozi” ni wazi, ya sasa, na inafaa muktadha.
- source_word: בָּעֵדָה
  choice: wa kusanyiko
  rationale: עֵדָה ni jamii iliyokusanyika ya Israeli. “Kusanyiko” huhifadhi wazo la kundi la watu lililokusanyika, huku “jumuiya” ikiwa tafsiri nyingine inayowezekana.
- source_word: וַיְדַבֵּר מֹשֶׁה אֲלֵהֶם
  choice: Musa akasema nao
  rationale: דבר ni kitenzi cha kawaida cha kusema au kunena. “Akasema nao” ni Kiswahili cha asili na huhifadhi uhusiano unaoonyeshwa na אֶל.
- source_word: וַ
  choice: Lakini / nao / Kisha
  rationale: Viunganishi vya Kiebrania vinaendeleza simulizi. Mwanzoni “Lakini” huonyesha tofauti ndogo na hofu iliyoelezwa katika mstari uliotangulia; “nao” na “Kisha” huendeleza mtiririko kwa Kiswahili cha asili.
