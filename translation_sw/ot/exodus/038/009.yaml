  yaml_path: translation/ot/exodus/038/009.yaml
  text: He made the courtyard. On the south side[a], toward the south, the hangings of the courtyard were of finely twisted linen, a hundred cubits long.
translation:
  language: sw
  text: Alitengeneza ua. Kwa upande wa kusini, kuelekea kusini, vitambaa vya ua vilivyotundikwa[a] vilikuwa vya kitani bora iliyosokotwa, kwa urefu wa dhiraa mia moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mapazia ya ua.”
    reason: Neno קְלָעִים linaweza kutafsiriwa kuwa vitambaa vilivyotundikwa au mapazia katika muktadha huu.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Alitengeneza
  rationale: Kitenzi hiki kinaendeleza mfululizo wa masimulizi na maana yake ya msingi hapa ni kutengeneza; Kiswahili hakihitaji kuongeza kiunganishi ili kuonyesha mfuatano huo.
- source_word: הֶחָצֵר
  choice: ua
  rationale: Katika muktadha wa Maskani, neno hili linamaanisha eneo la nje lililozungushiwa vitambaa. “Ua” ni neno la kawaida na wazi katika Kiswahili cha kisasa.
- source_word: לִפְאַת
  choice: Upande wa
  rationale: Neno hili linaonyesha upande au eneo fulani la ujenzi.
- source_word: נֶגֶב תֵּימָנָה
  choice: kusini, kuelekea kusini
  rationale: Maneno yote mawili yanahusu kusini. Kuyatafsiri yote mawili kunahifadhi msisitizo na ukamilifu wa Kiebrania bila kuyabana kuwa usemi mmoja.
- source_word: קַלְעֵי הֶחָצֵר
  choice: vitambaa vya ua vilivyotundikwa
  rationale: Katika maelezo ya Maskani, neno hili linarejelea vitambaa vilivyotundikwa ili kuunda mpaka wa ua. Tafsiri hii inaeleza kazi yake kwa Kiswahili cha kawaida huku tanbihi ikihifadhi mbadala mfupi.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: kitani safi iliyosokotwa
  rationale: שֵׁשׁ ni kitani bora au safi, na מָשְׁזָר inaonyesha kwamba nyuzi zake zilisokotwa. Usemi huu unahifadhi ubora wa kitambaa na namna kilivyotengenezwa.
- source_word: מֵאָה בָּאַמָּה
  choice: urefu wake dhiraa mia moja
  rationale: Kiebrania kinatoa kipimo cha dhiraa mia moja; kutaja “urefu wake” kunafanya uhusiano wa kipimo uwe wazi na wa kawaida katika Kiswahili.
