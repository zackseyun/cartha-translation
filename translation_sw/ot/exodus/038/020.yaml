lexical_decisions:
- source_word: וְכָל
  choice: Na ... vyote
  rationale: Muundo huu unawakilisha kiunganishi וְ pamoja na maana ya jumla ya כָל kwa nomino ya wingi.
- source_word: הַיְתֵדֹת
  choice: vigingi
  rationale: יָתֵד humaanisha vigingi vinavyotumiwa kuimarisha hema au uzio; “vigingi” ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: לַמִּשְׁכָּן
  choice: vya Maskani
  rationale: Katika muktadha wa Kutoka, מִשְׁכָּן ni mahali patakatifu pa kukaa kwa Mungu; “Maskani” linadumisha maana ya makao na rejeo lake maalumu.
- source_word: וְלֶחָצֵר סָבִיב
  choice: na vya ua ulioizunguka
  rationale: חָצֵר ni ua uliozungushia Maskani, na סָבִיב inaeleza nafasi yake kuizunguka; usemi huu ni wa asili katika Kiswahili na unaweka wazi uhusiano huo wa mahali.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: נְחֹשֶׁת inaweza kutaja shaba au aloi ya shaba kama bronzi. “Shaba” ni neno la kawaida la Kiswahili na linaacha upana wa maana uelezwe katika tanbihi.
