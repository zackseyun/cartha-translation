  text: Na vigingi vyote vya Maskani na vya ua pande zote vilikuwa vya shaba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bronzi.” Neno la Kiebrania נְחֹשֶׁת linaweza kumaanisha shaba au bronzi, kutegemea muktadha.
