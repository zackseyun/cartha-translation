  yaml_path: translation/ot/exodus/038/015.yaml
  text: And for the other side[a], on this side and on that side of the gate of the courtyard, there were hangings of fifteen cubits, their pillars three[b], and their bases three.
translation:
  language: sw
  text: Na kwa upande wa pili[a]—upande huu na upande ule wa lango la ua—kulikuwa na vitambaa vya dhiraa kumi na tano, nguzo zake tatu, na vitako vyake vitatu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kila upande wa lango la ua.”
    reason: lexical_alternative
  - marker: b
    text: Au, “besi zake tatu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכָּתֵף הַשֵּׁנִית
  choice: upande mwingine
  rationale: כָּתֵף kwa maana ya msingi ni ‘bega,’ lakini hapa ni sehemu ya pembeni inayopakana na lango; ‘upande mwingine’ ni Kiswahili cha kawaida kinachofaa muktadha.
- source_word: מִזֶּה וּמִזֶּה
  choice: upande huu na upande ule
  rationale: Huhifadhi kwa uwazi mgawanyo wa mahali katika pande mbili za lango.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: wa lango la ua
  rationale: Huonyesha uhusiano wa sehemu hizo za pembeni na lango la ua bila kulazimisha maana ya lamed kupita ushahidi wa muktadha.
- source_word: קְלָעִים
  choice: vitambaa
  rationale: Katika maelezo ya ua wa maskani neno hili linataja vitambaa vilivyotundikwa na kuunda uzio; ‘vitambaa’ ni wazi na cha kawaida kwa wasomaji wa sasa.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: vya urefu wa dhiraa kumi na tano
  rationale: ‘Dhiraa’ huhifadhi kipimo cha kale; ‘vya urefu wa’ huweka wazi kwa Kiswahili asilia kwamba idadi hiyo ni kipimo cha vitambaa.
- source_word: עַמֻּדֵיהֶם שְׁלֹשָׁה
  choice: nguzo zake tatu
  rationale: ‘Nguzo’ ni tafsiri ya kawaida ya עַמּוּד katika ujenzi; muundo mfupi unadumisha mtindo wa orodha wa Kiebrania.
- source_word: וְאַדְנֵיהֶם שְׁלֹשָׁה
  choice: na vikalio vyake vitatu
  rationale: אֶדֶן ni sehemu ya chini inayoshikilia nguzo; ‘vikalio’ ni lugha inayoeleweka, huku ‘vitako’ kikibaki chaguo linalowezekana.
theological_decisions: []
