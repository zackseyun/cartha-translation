translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa ili orodha ya vifaa na vipimo isomeke kwa urahisi. Neno “ua” limetumiwa kwa courtyard kulingana na matumizi ya kawaida ya kibiblia, na alama zote za tanbihi [a] na [b] zimewekwa katika matini.
