base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/018.yaml
  text: And the screen for the gate of the courtyard was the work of an embroiderer[a], in blue and purple and scarlet yarn, and fine twined linen, twenty cubits long, and five cubits high[c][b], corresponding in width to the hangings of the courtyard.
translation:
  language: sw
  text: Na pazia la lango la ua lilikuwa kazi ya mrembeshaji wa vitambaa,[a] kwa nyuzi za buluu, zambarau na nyekundu, na kitani safi kilichosokotwa; urefu wake ulikuwa dhiraa ishirini, na kimo chake dhiraa tano,[b] kulingana na mapazia ya ua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pazia la mahali pa kuingilia katika ua.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “na kimo, kwa upana, dhiraa tano.” Muundo huu wa vipimo hauna uhakika; huenda ukamaanisha kwamba pazia hili lililingana kwa kimo na mapazia ya ua.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָסַךְ
  choice: pazia
  rationale: Katika muktadha wa ua wa Maskani, neno hili linamaanisha kitambaa kilichoning’inizwa ili kufunika au kutenga mahali pa kuingilia; “pazia” ni Kiswahili cha kawaida na cha asili.
- source_word: שַׁעַר הֶחָצֵר
  choice: lango la ua
  rationale: “Lango” huhifadhi maana ya sehemu ya kuingilia, na “ua” hapa ni eneo lililozungushiwa mapazia kuizunguka Maskani.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: kazi ya mrembeshaji wa vitambaa
  rationale: Huhifadhi wazo la kazi ya fundi stadi aliyefanyiza mapambo ya rangi kwenye kitambaa bila kulazimisha kwamba mbinu yake ilikuwa udarizi kwa sindano pekee.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: nyuzi za buluu, zambarau na nyekundu
  rationale: Majina ya rangi yanawakilisha malighafi za nguo zilizotiwa rangi; “nyuzi” imeongezwa kwa uwazi wa kawaida wa Kiswahili.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: kitani safi kilichosokotwa
  rationale: Huwakilisha kitani bora na nyuzi zake zilizosokotwa, kama katika istilahi za vitambaa vya Maskani.
- source_word: עֶשְׂרִים אַמָּה אֹרֶךְ
  choice: urefu wa dhiraa ishirini
  rationale: Huhifadhi kipimo cha kale “dhiraa” badala ya kukibadili kuwa kipimo cha kisasa.
- source_word: וְקוֹמָה בְרֹחַב חָמֵשׁ אַמּוֹת לְעֻמַּת קַלְעֵי הֶחָצֵר
  choice: kimo cha dhiraa tano, sawa na mapazia ya ua
  rationale: Hutoa maana inayowezekana kwamba pazia la lango lililingana kwa kimo na mapazia mengine ya ua, huku tanbihi ikihifadhi ugumu wa usemi wa Kiebrania.
