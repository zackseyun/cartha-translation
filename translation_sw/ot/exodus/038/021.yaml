  text: אֵ֣לֶּה פְקוּדֵ֤י הַ/מִּשְׁכָּן֙ מִשְׁכַּ֣ן הָ/עֵדֻ֔ת אֲשֶׁ֥ר פֻּקַּ֖ד עַל פִּ֣י מֹשֶׁ֑ה עֲבֹדַת֙ הַ/לְוִיִּ֔ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/021.yaml
  text: These are the records of the tabernacle[a], the tabernacle of the testimony, as they were recorded at the command of Moses[c][b], by the service of the Levites under the direction of Ithamar son of Aaron the priest.
translation:
  language: sw
  text: Hizi ndizo hesabu za Maskani[a], Maskani ya Ushuhuda[b], zilizohesabiwa kwa agizo la Musa, kwa huduma ya Walawi chini ya usimamizi wa Ithamari[c], mwana wa Haruni kuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “orodha ya mali” au “taarifa za hesabu” za Maskani; neno la Kiebrania linamaanisha ukokotoaji rasmi.
    reason: lexical_alternative
  - marker: b
    text: “Ushuhuda” huenda unarejelea ushuhuda wa agano, hasa vibao vya ushuhuda vilivyowekwa ndani ya Sanduku.
    reason: cultural_note
  - marker: c
    text: Kihalisi, “kwa mkono wa Ithamari,” nahau inayoonyesha utendaji au usimamizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: hesabu
  rationale: Nomino hii inarejelea ukokotoaji au taarifa rasmi ya mali na vifaa vya Maskani. “Hesabu” ni ya kawaida katika Kiswahili na inadumisha wazo la uwajibikaji rasmi; maelezo ya chini yanaonyesha maana nyingine zinazowezekana.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: Hili ni jina linalofaa kwa jengo takatifu la kukaliwa na uwepo wa Mungu katika muktadha wa Kutoka. Herufi kubwa inalibainisha kuwa ni Maskani maalumu, si makao ya kawaida.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: Maskani ya Ushuhuda
  rationale: Tafsiri hii inadumisha urudiaji wa kimakusudi na neno עֵדֻת bila kulifasiri moja kwa moja kuwa “Agano”; huenda linarejelea vibao vya ushuhuda vilivyowekwa ndani ya Sanduku.
- source_word: פֻּקַּד
  choice: zilizofanywa
  rationale: Katika muktadha huu kitenzi kinaendeleza wazo la kuhesabu au kukagua rasmi. Pamoja na “hesabu,” usemi “hesabu ... zilizofanywa” ni wa asili na unaepuka urudiaji mzito wa “zilizohesabiwa.”
- source_word: עַל פִּי מֹשֶׁה
  choice: kwa agizo la Musa
  rationale: Nahau hii kwa kawaida humaanisha kwa neno au amri ya mtu. “Kwa agizo la Musa” huwasilisha mamlaka yake kwa Kiswahili cha kawaida.
- source_word: עֲבֹדַת הַלְוִיִּם
  choice: kupitia huduma ya Walawi
  rationale: עֲבֹדָה hapa ni kazi au utumishi waliokabidhiwa Walawi katika Maskani. “Huduma” inadumisha muktadha wa ibada na usimamizi bila kuingiza istilahi za baadaye za kanisa.
- source_word: בְּיַד אִיתָמָר
  choice: chini ya usimamizi wa Ithamari
  rationale: Nahau ya Kiebrania, kihalisi “kwa mkono wa Ithamari,” hapa inaonyesha uangalizi au usimamizi wake juu ya huduma ya Walawi.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Tafsiri ya moja kwa moja ya cheo kinachomtambulisha Aroni; muundo “Aroni kuhani” unafuata uhusiano wa maneno katika Kiebrania.
theological_decisions:
- issue: Maana ya “Ushuhuda” katika מִשְׁכַּן הָעֵדֻת
  choice: Kudumisha “Ushuhuda” katika maandishi makuu
  alternative: “Maskani ya Agano” au “Maskani ya vibao vya Agano”
  rationale: Neno la Kiebrania linaweza kurejelea ushuhuda wa agano, hasa vibao vilivyowekwa katika Sanduku, lakini maandishi hayasemi “agano” wazi hapa. Tafsiri haifungi maana hiyo zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Maskani” na “Ushuhuda” zimeandikwa kwa herufi kubwa kama majina ya vitu maalumu vya ibada. Sentensi inadumisha marudio ya Kiebrania “Maskani, Maskani ya Ushuhuda,” huku ikifanya uhusiano wa kiutawala kati ya Musa, Walawi na Ithamari uwe wazi bila kuongeza fundisho la dhehebu.
