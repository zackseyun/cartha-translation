base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/011.yaml
  text: And for the north side there were a hundred cubits[a], their twenty pillars and their twenty bases of bronze, and the hooks of the pillars and their bands were of silver.
translation:
  language: sw
  text: 'Kwa upande wa kaskazini, dhiraa mia moja: nguzo zake ishirini, na misingi yake ishirini ya shaba; kulabu za nguzo na vifungo vyake[a] vilikuwa vya fedha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikanda yao.” Neno la Kiebrania hurejelea vifaa vya fedha vilivyohusishwa na nguzo; umbo lake hasa halijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹן
  choice: Upande wa kaskazini
  rationale: פאה hapa ni upande wa ua, na צפון huonyesha mwelekeo wa kaskazini. Usemi huu ni wa kawaida na wazi katika Kiswahili sanifu.
- source_word: מֵאָה בָאַמָּה
  choice: ulikuwa na urefu wa dhiraa mia moja
  rationale: Kirai hiki hutoa kipimo cha upande. Kuongeza 'urefu' kunafanya maana iwe wazi katika Kiswahili bila kuongeza taarifa mpya.
- source_word: עַמּוּדֵיהֶם
  choice: nguzo ishirini
  rationale: עַמּוּדִים ni nguzo za kimuundo. Kiswahili hakihitaji kuonyesha kiambishi cha wingi cha Kiebrania kwa namna ileile ili sentensi iwe ya kawaida.
- source_word: אַדְנֵיהֶם
  choice: vitako vyake ishirini
  rationale: אדן katika maelezo ya Maskani ni msingi au tundu la chini linaloshikilia nguzo. 'Vitako' ni neno rahisi la kimuundo kuliko istilahi ya kigeni 'besi'.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: נְחֹשֶׁת ni metali ya rangi ya shaba, ambayo katika muktadha huu kwa kawaida hueleweka kuwa bronzi. 'Shaba' ndiyo istilahi ya kawaida ya kibiblia katika Kiswahili, ingawa inaweza pia kutumiwa kwa copper.
- source_word: וָוֵי הָעַמּוּדִים
  choice: Kulabu za nguzo
  rationale: וָוִים hapa ni kulabu zilizofungwa kwenye nguzo, si vigingi vya hema.
- source_word: חֲשֻׁקֵיהֶם
  choice: mikanda yake
  rationale: Neno hili humaanisha vifaa vya fedha vilivyofunga au kuunganisha nguzo. 'Mikanda' hudumisha wazo la kitu kinachozunguka au kufunga, huku kutokuwa na uhakika kuhusu umbo lake kukielezwa katika tanbihi.
- source_word: כָּסֶף
  choice: fedha
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa metali inayotajwa hapa; linahusu kulabu na mikanda.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi umegawanywa ili orodha ya vipimo na vifaa isomeke kwa kawaida. Alama ya tanbihi imewekwa baada ya neno linalohusika moja kwa moja, 'mikanda yake'.
