lexical_decisions:
- source_word: וְאֶת הָאֶלֶף וּשְׁבַע הַמֵּאוֹת וַחֲמִשָּׁה וְשִׁבְעִים
  choice: Kwa ile fedha iliyobaki, kilo thelathini na nne
  rationale: 'Kirai kinaendeleza hesabu ya fedha ya mstari uliotangulia: shekeli 1,775 zilizobaki. Uzito wa takriban kilo 34 unawasilisha kiasi kwa kipimo kinachoeleweka leo bila kupoteza uhusiano na muktadha; tanbihi huhifadhi hesabu ya shekeli.'
- source_word: עָשָׂה
  choice: alitengeneza
  rationale: Kitenzi cha kawaida na cha asili katika muktadha wa kutengeneza vifaa.
- source_word: וָוִים
  choice: kulabu
  rationale: Katika maelezo ya Maskani, neno hili humaanisha vifaa vya chuma vilivyowekwa kwenye nguzo; “kulabu” ni sahihi na linaeleweka.
- source_word: לָעַמּוּדִים
  choice: kwa ajili ya nguzo
  rationale: “Nguzo” ni neno la kawaida la Kiswahili kwa sehemu hizi za muundo.
- source_word: וְצִפָּה
  choice: akafunika ... kwa fedha
  rationale: Kitenzi katika piel humaanisha kufunika au kupaka kwa metali. Fedha imetajwa wazi na muktadha wa hesabu, hivyo imeelezwa ili Kiswahili kiwe wazi.
- source_word: רָאשֵׁיהֶם
  choice: sehemu zake za juu
  rationale: Tafsiri ya maana ya “vichwa vyake,” ikirejelea sehemu za juu za nguzo bila kutumia istilahi ya kitaalamu kupita kiasi.
- source_word: וְחִשַּׁק אֹתָם
  choice: na kuzitengenezea mikanda
  rationale: Katika muktadha huu kitenzi kinaelekea kumaanisha kuzipatia nguzo mikanda ya kuzunguka au ya kuunganisha; usemi huu ni wazi na huhifadhi maana pana.
