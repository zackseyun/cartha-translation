  text: And with the one thousand seven hundred and seventy-five he made hooks for the pillars[a], overlaid their tops, and made bands for them.
translation:
  language: sw
  text: Kwa shekeli elfu moja mia saba sabini na tano[a], alitengeneza kulabu za nguzo, akafunika vilele vyake, na akazitia mikanda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: shekeli 1,775. Uzito wa shekeli ulitofautiana; kiasi hiki ni takriban kilo 34.'
