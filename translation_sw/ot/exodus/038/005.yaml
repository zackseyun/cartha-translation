translation:
  language: sw
  text: Akatupa pete nne kwenye pembe nne za wavu wa shaba, ziwe vishikio vya miti ya kubebea[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye ncha nne” za wavu wa shaba.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “nyumba” za miti ya kubebea, yaani, vipokezi au viungio vya kuingizia miti hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Akatengeneza kwa kumimina
  rationale: Kitenzi יצק hapa kinahusu kumimina metali iliyoyeyushwa ili kutengeneza kitu. Kauli hii inaeleza wazi tendo hilo kwa Kiswahili cha kawaida.
- source_word: אַרְבַּע טַבָּעֹת
  choice: pete nne
  rationale: טַבָּעֹת ni pete za metali zilizotumika kama viungio vya kubebea.
- source_word: בְּאַרְבַּע הַקְּצָוֺת
  choice: kwenye pembe nne
  rationale: קָצֶה inaweza kumaanisha mwisho, ukingo, au sehemu ya mwisho kabisa; katika muktadha wa wavu huu, 'pembe nne' inaeleza mahali kwa kawaida, huku mbadala ukihifadhiwa katika tanbihi.
- source_word: לְמִכְבַּר הַנְּחֹשֶׁת
  choice: za wavu wa shaba
  rationale: מִכְבָּר ni wavu au kimiani; 'wavu wa shaba' ni usemi wazi na wa kawaida kwa kifaa hiki cha madhabahu.
- source_word: בָּתִּים
  choice: vipokezi
  rationale: Neno hili humaanisha kihalisi 'nyumba,' lakini hapa linarejelea sehemu au viungio vinavyopokea na kushikilia miti.
- source_word: לַבַּדִּים
  choice: vya miti ya kubebea
  rationale: בַּדִּים ni miti iliyotumiwa kubebea vyombo vya maskani; kuongeza 'ya kubebea' huonyesha kazi yake bila utata.
