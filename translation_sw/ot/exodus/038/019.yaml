  yaml_path: translation/ot/exodus/038/019.yaml
  text: Their four pillars and their four bronze bases[a], their hooks of silver[c][b], and the overlay of their tops and their bands of silver.
translation:
  language: sw
  text: Nguzo zake zilikuwa nne, na vitako vyake vinne vilikuwa vya shaba[a]. Kulabu zake zilikuwa za fedha, sehemu zake za juu zilifunikwa kwa fedha[b], na mikanda yake ilikuwa ya fedha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “misingi.” Neno la Kiebrania linamaanisha vipande vya metali vilivyowekwa chini ya nguzo ili kuzitegemeza.
    reason: lexical_alternative
  - marker: b
    text: Au, “kifuniko cha sehemu zake za juu.” Kiebrania kwa maana halisi ni “kifuniko cha vichwa/sehemu zake za juu”; fedha inaelezwa kuwa nyenzo ya kifuniko hicho.
    reason: lexical_alternative
  - marker: c
    text: Umbo kamili la vifaa hivi vya fedha halijulikani kwa hakika; tafsiri nyingine ni “vifungo” au “fito za kuunganisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵיהֶם
  choice: nguzo zake
  rationale: עַמּוּד ni nguzo katika maelezo ya ujenzi wa hema; “nguzo” ni istilahi ya kawaida na inayoeleweka katika Kiswahili.
- source_word: אַדְנֵיהֶם
  choice: misingi yake
  rationale: אֶדֶן hapa ni vipande vya metali vilivyotegemeza nguzo kwa chini. “Misingi” ni tafsiri ya kawaida na ya asili, huku “vitako” ikibaki kuwa mbadala unaokaribia umbo la vifaa hivyo.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: “Shaba” ndiyo istilahi ya kawaida ya Kiswahili kwa metali hii katika maelezo ya vifaa vya hema, bila kulazimisha utofautishaji wa kisasa kati ya copper na bronze.
- source_word: וָוֵיהֶם
  choice: kulabu zake
  rationale: וָו ni vifaa vya kuning’inizia au kuunganisha; “kulabu” inafaa kwa matumizi yake katika nguzo za ua.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Neno hilo linamaanisha metali ya fedha katika sehemu zote mbili za mstari huu.
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: sehemu zake za juu zilifunikwa kwa fedha
  rationale: Kifungu hiki kinaonyesha kifuniko au tabaka la fedha juu ya vichwa vya nguzo. Muundo wa kitenzi ni wa asili zaidi katika Kiswahili huku ukihifadhi maana ya צִפּוּי.
- source_word: חֲשֻׁקֵיהֶם
  choice: mikanda yake
  rationale: Umbo kamili la vifaa hivi halijulikani kwa hakika. “Mikanda” ni tafsiri wazi isiyobainisha kupita kiasi kama vilikuwa fito, pete, au vipande vya kuunganisha.
