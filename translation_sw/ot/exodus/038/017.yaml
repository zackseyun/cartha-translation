base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/017.yaml
  text: The bases for the pillars were bronze[a], and the hooks of the pillars and their bands were silver, and the overlay of their tops was silver[b]; all the pillars of the courtyard were banded with silver.
translation:
  language: sw
  text: Vikalio vya nguzo vilikuwa vya shaba[a]; kulabu za nguzo zilikuwa za fedha, na mikanda yao[b] ilikuwa ya fedha; sehemu za juu za nguzo zilifunikwa kwa fedha. Nguzo zote za ua zilikuwa zimefungwa mikanda ya fedha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matako ya nguzo.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “mikanda” linarejelea vifaa vya fedha vilivyohusishwa na nguzo; umbo lake halisi la kiusanifu halijulikani kwa uhakika.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדָנִים
  choice: vikalio
  rationale: Katika muktadha wa ujenzi wa maskani, neno hili linamaanisha sehemu za chini zinazotegemeza nguzo; “vikalio” ni wazi na halilazimishi picha mahususi kupita ushahidi.
- source_word: עַמֻּדִים
  choice: nguzo
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa vitu wima vya kutegemeza jengo au ua.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: “Shaba” ndilo neno la kawaida katika Kiswahili cha Biblia kwa metali hii; linaweza kurejelea shaba au aloi yake bila kuamua kwa uhakika zaidi ya maandishi.
- source_word: וָוֵי
  choice: kulabu
  rationale: Neno linarejelea vifaa vilivyopinda vya kuning’inizia vilivyounganishwa na nguzo; “kulabu” ni tafsiri ya kawaida na inayoeleweka.
- source_word: חֲשׁוּקֵיהֶם
  choice: mikanda yake
  rationale: Kipengele halisi cha usanifu hakijulikani kwa uhakika; “mikanda” huhifadhi wazo la vitu vinavyozunguka au kufunga nguzo bila kubainisha mno.
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: sehemu za juu za nguzo zilifunikwa
  rationale: Kirai kinaonyesha tabaka la metali juu ya vichwa vya nguzo; muundo wa kitenzi ni wa asili zaidi katika Kiswahili kuliko nomino nzito ya “mfuniko.”
- source_word: מְחֻשָּׁקִים
  choice: zilikuwa zimefungwa mikanda
  rationale: Tafsiri hii huhifadhi uhusiano wa kileksia na חֲשׁוּקֵיהֶם na kueleza hali ya nguzo bila kutumia istilahi adimu.
- source_word: חָצֵר
  choice: ua
  rationale: Katika muktadha wa maskani, “ua” ni neno la kawaida la eneo la nje lililozingirwa.
