base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/024.yaml
  text: All the gold that was used for the work[a], in all the work of the sanctuary—the gold of the wave offering—was twenty-nine talents and seven hundred thirty shekels[b], according to the sanctuary shekel.
translation:
  language: sw
  text: Dhahabu yote iliyotumiwa kwa ajili ya kazi, katika kazi yote ya mahali patakatifu—dhahabu ya sadaka ya kutikiswa[a]—ilikuwa talanta ishirini na tisa na shekeli mia saba thelathini, kwa kiwango cha shekeli ya patakatifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sadaka ya kutikiswa” ni sadaka iliyowasilishwa mbele za BWANA kwa mwendo maalumu wa kiibada.
    reason: cultural_note
  - marker: b
    text: Talanta na shekeli ni vipimo vya kale vya uzani. Hapa hesabu inafuata kiwango cha shekeli ya patakatifu.
    reason: measurement_note
lexical_decisions:
- source_word: הֶעָשׂוּי לַמְּלָאכָה
  choice: iliyotumiwa kwa kazi
  rationale: Kitenzi tendwa hapa kinaeleza dhahabu iliyotumika katika mradi wa kutengeneza maskani; ‘iliyotumiwa’ huepuka kudokeza kwamba dhahabu yenyewe ndiyo iliyotengenezwa.
- source_word: בְּכֹל מְלֶאכֶת הַקֹּדֶשׁ
  choice: kwa kazi yote ya mahali patakatifu
  rationale: Kirai hiki kinajumlisha kazi yote takatifu ya ujenzi na utengenezaji wa maskani. ‘Mahali patakatifu’ ni wazi na cha kawaida katika Kiswahili cha Biblia.
- source_word: זְהַב הַתְּנוּפָה
  choice: dhahabu ya sadaka ya kutikiswa
  rationale: ‘Sadaka ya kutikiswa’ huhifadhi istilahi ya ibada ya Kiebrania na uhusiano wake na tendo la kuiwasilisha sadaka kwa mwendo wa kiibada mbele za BWANA.
- source_word: תֵּשַׁע וְעֶשְׂרִים כִּכָּר
  choice: talanta ishirini na tisa
  rationale: Mpangilio wa nambari umetolewa kwa Kiswahili sanifu cha sasa huku kipimo cha kale ‘talanta’ kikihifadhiwa.
- source_word: וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים שֶׁקֶל
  choice: na shekeli mia saba thelathini
  rationale: Hili ni toleo la moja kwa moja na la kawaida la idadi hiyo katika Kiswahili.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai kinaonyesha kiwango rasmi cha uzani kilichotumiwa; kuongeza ‘kipimo cha’ hufanya kazi ya kihusishi cha Kiebrania iwe wazi katika Kiswahili bila kubadili maana.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mtiririko wa hesabu ya Kiebrania, huku ‘yaani’ ikifafanua kwamba dhahabu ya sadaka ya kutikiswa ndiyo jumla inayotajwa.
