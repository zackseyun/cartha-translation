base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/022.yaml
  text: And Bezalel son of Uri[a], son of Hur, of the tribe of Judah, made all that Yahweh had commanded Moses.
translation:
  language: sw
  text: Naye Besaleli, mwana wa Uri, mwana wa Huri, wa kabila la Yuda, alitengeneza yote ambayo Yahwe[a] alimwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְצַלְאֵל
  choice: Naye Bezaleli
  rationale: Kiunganishi וּ kinahifadhiwa kwa “Naye,” ambacho kinaendeleza simulizi kwa Kiswahili cha kawaida; jina בְצַלְאֵל limetoholewa kuwa “Bezaleli.”
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: mwana wa Uri, mwana wa Huri
  rationale: בֶּן katika mfuatano huu wa nasaba ina maana ya moja kwa moja ya “mwana wa”; majina yametoholewa kwa umbo linalosomeka kwa Kiswahili.
- source_word: לְ/מַטֵּה יְהוּדָה
  choice: wa kabila la Yuda
  rationale: מַטֶּה hapa ni kundi la kikabila, si fimbo; לְ inaonyesha uhusiano au kuwa sehemu ya kabila hilo.
- source_word: עָשָׂה
  choice: alitengeneza
  rationale: Katika muktadha wa kutengeneza maskani na vyombo vyake, “alitengeneza” huwasilisha tendo la ufundi kwa uwazi kuliko “alifanya.”
- source_word: אֵת כָּל אֲשֶׁר
  choice: kila kitu ambacho
  rationale: Usemi huu unaonyesha ujumla wa mambo yaliyoamriwa; “kila kitu ambacho” ni wa asili na wazi katika Kiswahili cha sasa.
- source_word: צִוָּה
  choice: alikuwa amemwamuru
  rationale: Muundo huu unaonyesha kwa kawaida kwamba amri kwa Musa ilitangulia kazi ya Bezaleli, bila kubadili maana ya kitenzi cha Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika matini.
- source_word: אֶת מֹשֶׁה
  choice: Musa
  rationale: אֶת ni kiashiria cha yambwa tendwa na hakitafsiriwi kivyake; katika Kiswahili “alimwamuru Musa” huonyesha uhusiano huo kwa kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania ina jina יהוה lenyewe. “Yahwe” hulihifadhi kama jina binafsi bila kulibadili kuwa cheo; tanbihi inaarifu desturi nyingine ya tafsiri bila kuiingiza katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Naye” huhifadhi mwendelezo wa simulizi; “alitengeneza” linafaa kwa muktadha wa kazi ya ufundi.
