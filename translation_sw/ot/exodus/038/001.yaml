base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/001.yaml
  text: He made the altar of burnt offering of acacia wood[a], five cubits its length and five cubits its width, square, and three cubits its height.
translation:
  language: sw
  text: Akaitengeneza madhabahu ya sadaka ya kuteketezwa kwa mbao za mshita. Urefu wake ulikuwa dhiraa tano, upana wake dhiraa tano—ilikuwa mraba—na kimo chake dhiraa tatu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akaitengeneza
  rationale: Waw-consecutive pamoja na עשה huendeleza masimulizi ya tendo la wakati uliopita. Kiambishi “aka-” kinaunganisha tendo hili kwa kawaida na mfululizo wa masimulizi, na “tengeneza” kinafaa kwa utengenezaji wa madhabahu.
- source_word: מִזְבַּח הָעֹלָה
  choice: madhabahu ya sadaka ya kuteketezwa
  rationale: Kirai hiki kinamaanisha madhabahu inayohusiana na עֹלָה, yaani sadaka inayoteketezwa yote. Tafsiri hii ni wazi na ya kawaida katika Kiswahili cha Biblia.
- source_word: עֲצֵי שִׁטִּים
  choice: mbao za mshita
  rationale: שִׁטִּים hurejelea mti wa akasia. “Mshita” ni jina la Kiswahili linalotambulika kwa akasia, na “mbao za” huwasilisha kwa usahihi nyenzo iliyotumiwa.
- source_word: חָמֵשׁ אַמּוֹת
  choice: dhiraa tano
  rationale: אַמָּה ni kipimo cha dhiraa. Kipimo cha asili kimehifadhiwa badala ya kugeuzwa kuwa vipimo vya kisasa, ili kudumisha uthabiti wa vipimo vya maskani.
- source_word: אָרְכּוֹ
  choice: urefu wake
  rationale: Kiambishi tamati kinarejelea madhabahu; “urefu wake” ni namna ya kawaida na sahihi ya kueleza kipimo hiki.
- source_word: רָחְבּוֹ
  choice: upana wake
  rationale: Katika maelezo ya vipimo, “upana” ni tafsiri ya kawaida ya רֹחַב katika Kiswahili cha sasa.
- source_word: רָבוּעַ
  choice: ilikuwa mraba
  rationale: Kivumishi hiki humaanisha kuwa na pande nne sawa, yaani mraba. Kitenzi kimeongezwa kwa ulaini wa Kiswahili bila kubadili maana.
- source_word: קֹמָתוֹ
  choice: kimo chake
  rationale: Katika muktadha wa jengo au kitu kilichotengenezwa, קוֹמָה humaanisha kipimo cha kwenda juu. “Kimo chake” ni cha asili na hujitofautisha vizuri na urefu wa upande.
