translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili, huku vipimo vya dhiraa na msamiati wa ibada vikihifadhiwa.
