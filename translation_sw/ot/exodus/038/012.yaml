base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/012.yaml
  text: And for the west side there were hangings of fifty cubits[a], with ten of their pillars and ten of their bases; the hooks of the pillars and their bands were silver.
translation:
  language: sw
  text: Na upande wa magharibi kulikuwa na mapazia yenye urefu wa dhiraa hamsini, pamoja na nguzo zake kumi na vitako vyake kumi; kulabu za nguzo, pamoja na mikanda ya nguzo, zilikuwa za fedha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikanda ya nguzo ilikuwa ya fedha.” Neno la Kiebrania la vifaa hivi vya nguzo ni istilahi ya kiufundi, na huenda likamaanisha mikanda, fito, au vipande vya mapambo vya kuunganisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְאַת יָם
  choice: Na upande wa magharibi
  rationale: Ingawa יָם maana yake ya msingi ni ‘bahari,’ katika maelezo haya hutumiwa kuonyesha upande wa magharibi. Kiswahili cha kawaida hutaja mwelekeo huo moja kwa moja.
- source_word: קְלָעִים
  choice: mapazia
  rationale: Katika muktadha wa ua wa Maskani, neno hili linamaanisha vitambaa vilivyotundikwa ili kuuzunguka ua; ‘mapazia’ ni neno la kawaida na linaloeleweka.
- source_word: חֲמִשִּׁים בָּאַמָּה
  choice: yenye urefu wa dhiraa hamsini
  rationale: Kiebrania kinatoa kipimo cha dhiraa hamsini; kutaja ‘urefu’ kwa uwazi kunafanya Kiswahili kiwe cha asili bila kubadili maana.
- source_word: עַמּוּדֵיהֶם עֲשָׂרָה
  choice: pamoja na nguzo zake kumi
  rationale: ‘Nguzo’ linafaa kwa miundo inayoshikilia mapazia, na ‘pamoja na’ huunganisha kwa kawaida orodha fupi ya Kiebrania.
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: na vitako vyake kumi
  rationale: אֶדֶן ni tako au msingi wenye tundu ambamo nguzo ilisimamishwa. ‘Vitako’ ni sahihi katika muktadha huu wa ujenzi.
- source_word: וָוֵי הָעַמֻּדִים
  choice: kulabu za nguzo
  rationale: Neno hili linataja vifaa vya kunasia vilivyowekwa kwenye nguzo; ‘kulabu’ ni tafsiri iliyo wazi na ya kawaida.
- source_word: וַחֲשׁוּקֵיהֶם
  choice: viungio vyake
  rationale: Rejeleo kamili la istilahi hii ya kiufundi halina uhakika; huenda ilikuwa mikanda, fito, au vipande vya kuunganisha. ‘Viungio’ huonyesha kazi inayowezekana bila kudai umbo maalumu.
- source_word: כָּסֶף
  choice: vilikuwa vya fedha
  rationale: Nomino hii inaeleza nyenzo ya kulabu na viungio; Kiswahili huhitaji kiunganishi cha kisarufi ili sentensi iwe wazi.
