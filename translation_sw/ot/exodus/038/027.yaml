base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/027.yaml
  text: 'The hundred talents of silver were for casting the bases of the sanctuary and the bases of the veil: one hundred bases for the hundred talents[b][a], a talent for each base.'
translation:
  language: sw
  text: 'Talanta mia moja za fedha zilitumiwa kutengeneza kwa kumimina metali besi[b] za patakatifu na besi za pazia[a]: besi mia moja kwa talanta mia moja, talanta moja kwa kila besi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pazia” ni pazia la ndani lililotenganisha Mahali Patakatifu na Patakatifu Zaidi.
    reason: cultural_note
  - marker: b
    text: Au, “soketi” badala ya “besi,” yaani sehemu za msingi za metali za maskani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: zilitumiwa
  rationale: Katika muktadha huu wa hesabu, kitenzi kinaonyesha matumizi ya fedha; tafsiri hii ni ya asili katika Kiswahili.
- source_word: מְאַת כִּכַּר הַכֶּסֶף
  choice: hizo talanta mia moja za fedha
  rationale: Kiwakilishi huonyesha kiasi mahususi kilichotajwa katika hesabu, huku kipimo cha kale 'talanta' kikihifadhiwa.
- source_word: לָצֶקֶת
  choice: kutengeneza kwa kuyeyusha
  rationale: Katika kazi ya metali, neno hili linamaanisha kutengeneza kitu kwa kumimina metali iliyoyeyushwa; usemi huu unaeleweka kwa msomaji wa kawaida.
- source_word: אַדְנֵי
  choice: besi
  rationale: Ni sehemu za msingi za metali zilizoshikilia viunzi au nguzo za maskani; 'besi' ni neno la sasa na linaloeleweka.
- source_word: הַקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Hapa neno linarejelea jengo au eneo takatifu la maskani kwa upana, si lazima chumba cha ndani pekee.
- source_word: הַפָּרֹכֶת
  choice: pazia
  rationale: Ni pazia maalumu la ndani lililotenganisha sehemu takatifu na Patakatifu Zaidi.
- source_word: לִמְאַת הַכִּכָּר
  choice: kutokana na talanta mia moja
  rationale: Kihusishi kinaweza kuonyesha uwiano au chanzo cha metali; katika Kiswahili, usemi huu unaonyesha kuwa besi hizo zilitengenezwa kwa kiasi hicho cha fedha.
- source_word: כִּכָּר לָאָדֶן
  choice: talanta moja kwa kila besi
  rationale: 'Hii inaeleza wazi uwiano wa mgawanyo: talanta moja kwa besi moja.'
