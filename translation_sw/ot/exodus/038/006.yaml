  text: He made the poles of acacia wood and overlaid them with bronze[a].
translation:
  language: sw
  text: Akazitengeneza fito za kubebea kwa mbao za mshita, akazifunika kwa shaba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shaba nyekundu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akazitengeneza
  rationale: Qal wayyiqtol ya עשה inaendeleza mfululizo wa simulizi; kiambishi "aka-" huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: הַבַּדִּים
  choice: zile miti za kubebea
  rationale: Katika muktadha wa vifaa vya Maskani, בַּדִּים ni miti iliyotumiwa kubebea chombo; usemi huu ni wazi zaidi kuliko "fito," ambalo linaweza kudokeza nguzo.
- source_word: עֲצֵי שִׁטִּים
  choice: kwa mbao za mshita
  rationale: Kirai cha Kiebrania kinamaanisha mbao zinazotokana na mshita; "mshita" ni jina la kawaida la Kiswahili la acacia.
- source_word: וַיְצַף
  choice: akazifunika
  rationale: צפה katika kazi ya ufundi humaanisha kufunika au kupamba kitu kwa tabaka la chuma; "akazifunika" ni ya kawaida na inaeleweka vizuri.
- source_word: אֹתָם
  choice: -zi-
  rationale: Kiambishi cha yambwa kinarejelea miti ya kubebea na kuhifadhi urejeo wa wingi wa אֹתָם.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: נְחֹשֶׁת inaweza kumaanisha bronze au copper. "Shaba" ni neno la kawaida la Kiswahili lenye upana unaofaa hapa, huku tanbihi ikihifadhi uwezekano wa shaba nyekundu.
