  text: 'a beka per head[a], that is, half a shekel by the sanctuary shekel, for everyone who passed over to those counted[c][b], from twenty years old and upward: 603,550.'
translation:
  language: sw
  text: 'beka moja kwa kila mtu[a], yaani nusu shekeli kwa kipimo cha shekeli ya mahali patakatifu, kwa kila aliyepita kuingia miongoni mwa waliohesabiwa[b], kuanzia mwenye umri wa miaka ishirini na kuendelea: 603,550.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beka moja ilikuwa sawa na nusu shekeli kwa kipimo kilichotumika katika mahali patakatifu. Kihalisi, Kiebrania kinasema “kwa kila fuvu,” nahau inayomaanisha kila mtu aliyehesabiwa.
    reason: cultural_note_and_lexical_alternative
  - marker: b
    text: Au, “kwa kila aliyepita miongoni mwa waliohesabiwa.” Kiebrania kinatumia lugha ya sensa yenye picha ya mtu kupita ili asajiliwe.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּקַע
  choice: beka
  rationale: Ni jina mahususi la kipimo cha uzito; limetoholewa, huku kirai kinachofuata kikieleza thamani yake kuwa nusu shekeli.
- source_word: לַגֻּלְגֹּלֶת
  choice: kwa kila mtu
  rationale: Kihalisi ni ‘kwa fuvu,’ lakini hapa ni nahau ya kuhesabu kila mtu mmoja mmoja; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: nusu shekeli
  rationale: Hutoa moja kwa moja thamani ya beka.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kihusishi kinaonyesha kiwango cha kupimia, na ‘mahali patakatifu’ huhifadhi rejeo la eneo takatifu bila kudokeza jengo fulani lisilotajwa.
- source_word: לְכֹל הָעֹבֵר עַל הַפְּקֻדִים
  choice: kwa kila aliyepita kuingia miongoni mwa waliohesabiwa
  rationale: Huhifadhi picha ya kupita inayotumiwa katika muktadha wa sensa, huku ikieleza kuwa mtu aliingia katika kundi la waliosajiliwa kwa kuhesabiwa.
- source_word: הַפְּקֻדִים
  choice: waliohesabiwa
  rationale: Huwakilisha maana ya watu waliohesabiwa katika sensa kwa Kiswahili cha kawaida.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: kuanzia mwenye umri wa miaka ishirini na kuendelea
  rationale: Ni usemi wa asili wa Kiswahili unaoweka kiwango cha chini cha umri bila kubadili maana.
- source_word: לְשֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 603,550
  rationale: Tarakimu huwasilisha jumla ya Kiebrania kwa uwazi na kwa mtindo unaosomeka kwa urahisi.
