base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/008.yaml
  text: He made the basin of bronze and its stand of bronze from the mirrors of the women who served at the entrance to the tent of meeting[a][b].
translation:
  language: sw
  text: Akatengeneza beseni la shaba na kitako chake cha shaba kutokana na vioo vya wanawake waliokuwa wakihudumu kwenye mlango wa hema la mkutano[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanawake waliokuwa wakikusanyika kwenye mlango wa hema la mkutano.” Kiebrania kinaweza kusisitiza kukusanyika kwa utaratibu pamoja na huduma.
    reason: alternative_reading
  - marker: b
    text: Au, “kutokana na vioo vya metali vilivyong’arishwa.” Vioo vya kale kwa kawaida vilitengenezwa kwa shaba iliyong’arishwa, si kwa kioo kama cha leo.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹר
  choice: beseni
  rationale: Ni chombo kikubwa cha kuoshea kilichotumiwa katika huduma ya hema; “beseni” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: כַּן
  choice: tako
  rationale: Hurejelea sehemu ya chini inayotegemeza beseni. “Tako” linafaa kwa kifaa hiki na ni istilahi inayotumiwa kwa msingi wa chombo.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Neno la Kiebrania linaweza kumaanisha shaba au aloi yake; “shaba” ni tafsiri ya kawaida na inayoeleweka katika muktadha wa vifaa vya hema.
- source_word: בְּמַרְאֹת
  choice: kutokana na vioo
  rationale: 'Kiambishi ב hapa kinaonyesha malighafi au chanzo: beseni na tako lake yalitengenezwa kutokana na vioo.'
- source_word: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: wanawake waliokuwa wakihudumu
  rationale: Mzizi צבא unaweza kueleza kukusanyika kwa utaratibu kwa ajili ya huduma. “Wakihudumu” huonyesha shughuli yenye kusudi bila kudai kwamba walikuwa na wadhifa wa kikuhani.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye mwingilio wa hema la mkutano
  rationale: Huhifadhi maana ya mahali katika usemi wa kawaida na wenye hadhi wa Kiswahili.
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Huhifadhi mwendelezo wa simulizi la Kiebrania na tendo la mhusika wa umoja linalofuata matendo yaliyotangulia.
theological_decisions:
- issue: Utambulisho na jukumu la הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: wanawake waliokuwa wakihudumu kwenye mwingilio wa hema la mkutano
  alternative: wanawake waliokuwa wakikusanyika kwenye mwingilio wa hema la mkutano
  rationale: Kiebrania kinaweza kusisitiza huduma au kukusanyika kwa utaratibu. Tafsiri kuu inaonyesha shughuli yenye kusudi, lakini tanbihi huhifadhi uwezekano wa maana ya kukusanyika bila kuingiza wadhifa rasmi wa kidini ambao mstari hautaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni nyepesi kwa msomaji wa kawaida; “wakihudumu” huhifadhi maana ya shughuli yenye kusudi, huku tanbihi ikibakiza utata wa Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
