  - severity: low
    issue: Tafsiri ya tanbihi b ya “polished metal mirrors” ni “vioo vya chuma vilivyong’arishwa.”
    rationale: “Chuma” linaweza kusomwa mahususi kuwa iron, ilhali maelezo yenyewe yanasema vioo hivyo kwa kawaida vilikuwa vya shaba. “Metali” hudumisha maana pana ya neno bila kuanzisha utata usio wa lazima.
