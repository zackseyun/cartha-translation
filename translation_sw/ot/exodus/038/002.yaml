  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Mapembe” na “pembe” zimetumiwa kwa makusudi kutofautisha sehemu zilizochomoza na kona za madhabahu. Viwakilishi vinarejelea madhabahu iliyotajwa katika muktadha wa karibu.
