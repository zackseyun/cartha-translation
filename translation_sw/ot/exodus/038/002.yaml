  yaml_path: translation/ot/exodus/038/002.yaml
  text: He made its horns on its four corners[a]; its horns were of one piece with it[b], and he overlaid it with bronze.
translation:
  language: sw
  text: Akatengeneza mapembe yake kwenye pembe zake nne; mapembe yake yalikuwa sehemu yake yenyewe,[a] naye akaifunika kwa bronzi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mapembe yake yalitoka humo,” yaani, hayakutengenezwa kando kisha yakaunganishwa nayo.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania neḥoshet linaweza kumaanisha bronzi au shaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Kitenzi עשה katika mfululizo wa masimulizi kinaeleza tendo la kutengeneza; “akatengeneza” ni Kiswahili cha kawaida na huendeleza simulizi kwa ufasaha.
- source_word: קַרְנֹתָיו
  choice: mapembe yake
  rationale: קֶרֶן maana yake ya msingi ni “pembe”; hapa ni sehemu zilizochomoza kama pembe kwenye madhabahu. “Mapembe” huhifadhi taswira halisi na istilahi ya vifaa vya ibada.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: kwenye pembe zake nne
  rationale: Kirai hiki huonyesha mahali mapembe yalipokuwa. “Kwenye pembe zake nne” ni cha kawaida katika Kiswahili na hutofautisha mapembe ya madhabahu na pembe zake za kijiometri.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: mapembe hayo yalikuwa sehemu moja nayo
  rationale: Kihalisi ni “mapembe yake yalitoka kwake.” Katika maelezo ya ujenzi, maana ni kwamba hayakutengenezwa kando na kuunganishwa baadaye, bali yalikuwa sehemu ya kitu chenyewe.
- source_word: וַיְצַף אֹתוֹ
  choice: naye akaifunika
  rationale: צפה katika muktadha huu ni kufunika kitu kwa tabaka la metali. “Akaifunika” ni usemi wa kawaida unaoeleweka bila kuongeza jambo lisilokuwamo.
- source_word: נְחֹשֶׁת
  choice: bronzi
  rationale: נְחֹשֶׁת laweza kutaja bronzi au shaba. “Bronzi” ndilo chaguo la kawaida katika maelezo ya vifaa vya Maskani, huku uwezekano wa “shaba” ukihifadhiwa katika tanbihi.
