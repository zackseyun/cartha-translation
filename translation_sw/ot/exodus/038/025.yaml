  text: And the silver of those counted from the congregation was one hundred talents and one thousand seven hundred seventy-five shekels[b][a], according to the sanctuary shekel.
translation:
  language: sw
  text: Na fedha ya wale waliohesabiwa miongoni mwa kusanyiko ilikuwa talanta mia moja na shekeli elfu moja mia saba sabini na tano, kulingana na shekeli ya mahali patakatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, uzito ulipimwa kwa kufuata kiwango cha shekeli ya mahali patakatifu.
    reason: cultural_note
lexical_decisions:
- source_word: כֶסֶף
  choice: fedha
  rationale: Katika muktadha huu neno linamaanisha metali ya fedha iliyokusanywa, si pesa kwa maana ya jumla.
- source_word: פְּקוּדֵי
  choice: wale waliohesabiwa
  rationale: Kauli hii ya kiutawala inarejelea watu waliosajiliwa au kuhesabiwa; tafsiri hii ni ya kawaida na inadumisha uhusiano na sensa.
- source_word: הָעֵדָה
  choice: kusanyiko
  rationale: Neno hili linarejelea jumuiya ya watu waliokusanyika; “kusanyiko” ni la asili na lenye hadhi katika Kiswahili cha sasa.
- source_word: מְאַת כִּכָּר
  choice: talanta mia moja
  rationale: Inahifadhi kipimo kikubwa cha uzito cha kale badala ya kutoa makadirio yasiyo katika matini.
- source_word: וְאֶלֶף וּשְׁבַע מֵאוֹת וַחֲמִשָּׁה וְשִׁבְעִים שֶׁקֶל
  choice: na shekeli elfu moja mia saba sabini na tano
  rationale: Inawasilisha wazi jumla ya mpangilio wa namba wa Kiebrania, yaani shekeli 1,775.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai kinaonyesha kiwango cha uzito kilichotumiwa; “kwa kipimo cha” huweka maana hiyo wazi bila kudokeza kuwa shekeli yenyewe ilikuwa kitu cha ibada.
