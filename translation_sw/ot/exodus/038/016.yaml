  text: All the hangings of the courtyard all around were of finely twisted linen[a].
translation:
  language: sw
  text: Vitambaa vyote vya ua kuzunguka pande zote vilikuwa vya kitani kilichosokotwa vizuri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mapazia yote ya ua kuzunguka pande zote yalikuwa ya kitani kilichosokotwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: vyote
  rationale: Huonyesha jumla ya vitambaa vya ua; upatanisho wa ngeli katika “vitambaa vyote” ni wa kawaida na huhifadhi maana ya ujumla.
- source_word: קַלְעֵי
  choice: vitambaa
  rationale: Hurejelea vitambaa vilivyotundikwa na kuunda uzio wa ua wa Maskani. “Vitambaa” ni neno la kawaida na halidokezi mapazia ya ndani pekee.
- source_word: הֶחָצֵר
  choice: vya ua
  rationale: Katika muktadha wa Maskani, חָצֵר ni eneo la nje lililozungushiwa uzio; “ua” ni istilahi ya kawaida katika Kiswahili cha Biblia.
- source_word: סָבִיב
  choice: kuzunguka pande zote
  rationale: Hueleza kuwa vitambaa hivyo vilienea katika mzunguko wote wa ua.
- source_word: שֵׁשׁ
  choice: kitani
  rationale: Katika maelezo ya Maskani, neno hili hurejelea kitani kilichotumiwa kutengeneza vitambaa.
- source_word: מָשְׁזָר
  choice: kilichosokotwa vizuri
  rationale: Hueleza uzi uliosokotwa au kusukwa kwa ustadi; kauli hii ni ya asili katika Kiswahili na huhifadhi wazo la ufundi bora bila kuongeza maelezo yasiyo katika chanzo.
