translation:
  language: sw
  text: Nguzo zake zilikuwa ishirini, na matako zake ishirini zilikuwa za shaba; kulabu za nguzo na mikanda yake zilikuwa za fedha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמּוּדֵיהֶם
  choice: nguzo zake
  rationale: עַמּוּדִים ni nguzo za kimuundo. Kiambishi cha wingi katika Kiebrania kinarejelea sehemu au mapazia yaliyotajwa katika muktadha; Kiswahili cha kawaida hutumia umilikaji wa ngeli ya sehemu hiyo, ‘zake.’
- source_word: עֶשְׂרִים
  choice: ishirini
  rationale: Namba ya kuhesabu imetafsiriwa moja kwa moja katika matukio yote mawili.
- source_word: אַדְנֵיהֶם
  choice: tako zake
  rationale: אֶדֶן katika muktadha wa Maskani ni tako linaloshikilia nguzo au ubao. ‘Tako’ ni neno la Kiswahili linaloeleweka kwa msingi wa chini wa kitu cha kusimamishwa.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: נְחֹשֶׁת inaweza kumaanisha shaba au aloi yake; ‘shaba’ ndilo neno la kawaida la Kiswahili katika maelezo ya vifaa vya Maskani bila kudai kwa uhakika muundo wa aloi.
- source_word: וָוֵי
  choice: kulabu
  rationale: וָוִים ni kulabu au viungio vya kushikilia mapazia kwenye nguzo; ‘kulabu’ linaonyesha kazi yake kwa uwazi.
- source_word: הָעַמֻּדִים
  choice: za nguzo
  rationale: Muundo wa Kiebrania unaonyesha kuwa kulabu hizo ni za nguzo.
- source_word: חֲשֻׁקֵיהֶם
  choice: mikanda yake
  rationale: חֲשֻׁקִים inaelekea kumaanisha mikanda au vifaa vya kuunganisha vilivyowekwa kwenye nguzo. ‘Mikanda’ huhifadhi taswira ya kitu kinachozunguka au kufunga bila kutumia istilahi ya kizamani.
- source_word: כָּסֶף
  choice: fedha
  rationale: Neno la kawaida la Kiswahili kwa metali כסף.
