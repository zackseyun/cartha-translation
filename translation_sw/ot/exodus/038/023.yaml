  source_fidelity: Tafsiri inawasilisha kwa uaminifu uhusiano wa Oholiabu na Bezaleli, nasaba yake, kabila lake, na orodha ya stadi zake. “Fundi” kwa חָרָשׁ huhifadhi upana wa neno la Kiebrania, badala ya kulibana na uchongaji/uchoraji maalumu. Orodha ya buluu, zambarau, nyekundu, na kitani safi inalingana na vifaa/rangi za Kiebrania.
