source:
  edition: WLC
  text: וְ/אִתּ֗/וֹ אָהֳלִיאָ֞ב בֶּן אֲחִיסָמָ֛ךְ לְ/מַטֵּה דָ֖ן חָרָ֣שׁ וְ/חֹשֵׁ֑ב וְ/רֹקֵ֗ם בַּ/תְּכֵ֨לֶת֙ וּ/בָֽ/אַרְגָּמָ֔ן וּ/בְ/תוֹלַ֥עַת הַ/שָּׁנִ֖י וּ/בַ/שֵּֽׁשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/023.yaml
  text: And with him was Oholiab son of Ahisamach[a], of the tribe of Dan, an engraver, a designer, and an embroiderer in blue, in purple, in scarlet yarn[b], and in fine linen.
translation:
  language: sw
  text: Pamoja naye alikuwapo Oholiabu mwana wa Ahisamaki[a], wa kabila la Dani. Alikuwa fundi, mbunifu na mtarizi kwa nyuzi za buluu, za zambarau na za rangi nyekundu[b], na kwa kitani safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Aholiabu.” Namna za kuliandika jina hili la Kiebrania hutofautiana.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina usemi unaomaanisha nyenzo ya kitambaa iliyotiwa rangi nyekundu kali; pia inaweza kutafsiriwa “nyekundu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתּוֹ
  choice: Pamoja naye alikuwapo
  rationale: Kirai hiki kinamtambulisha Oholiabu kuwa pamoja na Bezaleli aliyetajwa katika mstari uliotangulia. Kitenzi “alikuwapo” kinawekwa wazi kwa Kiswahili cha kawaida kwa kuwa Kiebrania kina sentensi isiyo na kitenzi kilichoandikwa.
- source_word: אָהֳלִיאָב
  choice: Oholiabu
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili badala ya kutafsiriwa maana yake.
- source_word: בֶּן אֲחִיסָמָךְ
  choice: mwana wa Ahisamaki
  rationale: Muundo wa nasaba umetafsiriwa moja kwa moja na majina yametoholewa kwa Kiswahili.
- source_word: לְמַטֵּה דָן
  choice: wa kabila la Dani
  rationale: Kirai kinabainisha uhusiano wake na kabila la Dani kwa lugha ya kawaida ya Kiswahili.
- source_word: חָרָשׁ
  choice: fundi
  rationale: Neno la Kiebrania lina maana pana ya stadi wa kazi za mikono; “fundi” huepuka kulibana kuwa uchongaji pekee bila ushahidi wa wazi katika mstari huu.
- source_word: וְחֹשֵׁב
  choice: mbunifu
  rationale: Neno hili humaanisha mtu anayebuni kazi au mifumo ya kisanii, hasa katika muktadha wa vitambaa vya Maskani.
- source_word: וְרֹקֵם
  choice: mtarizi
  rationale: Huyu ni fundi anayefanya kazi ya tarizi katika vitambaa; “mtarizi” ni neno sahihi na fupi la Kiswahili.
- source_word: בַּתְּכֵלֶת
  choice: kwa nyuzi za buluu
  rationale: Katika orodha ya vifaa vya Maskani, neno la rangi linarejelea kitu cha kufanyiwa kazi; “nyuzi” huweka wazi muktadha wa vitambaa kwa Kiswahili.
- source_word: וּבָאַרְגָּמָן
  choice: za zambarau
  rationale: Rangi hii inaendelezwa kwa muundo sambamba na “nyuzi za buluu,” bila kurudia neno “nyuzi” isivyo lazima.
- source_word: וּבְתוֹלַעַת הַשָּׁנִי
  choice: za rangi nyekundu
  rationale: Tamko la Kiebrania linahusu nyenzo ya kitambaa iliyotiwa rangi nyekundu kali; tafsiri kuu ni ya kawaida, huku tanbihi ikihifadhi upekee na uwezekano wa tafsiri nyingine.
- source_word: וּבַשֵּׁשׁ
  choice: na kwa kitani safi
  rationale: Katika muktadha wa Maskani שֵׁשׁ ni kitani bora au safi; “kitani safi” ni tafsiri wazi na iliyozoeleka.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ndefu ya Kiebrania imegawanywa mara mbili ili isomeke kwa urahisi bila kubadili uhusiano wa mawazo. Orodha ya rangi imetolewa kwa mtiririko wa kawaida wa Kiswahili, huku viunganishi vya Kiebrania vikiwakilishwa bila marudio mazito.
