base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/003.yaml
  text: 'He made all the utensils of the altar: the pots[a], the shovels, the basins, the forks, and the firepans[b]. He made all its utensils of bronze.'
translation:
  language: sw
  text: 'Akatengeneza vyombo vyote vya madhabahu: vyungu[a], chepeo, mabakuli, uma, na vyombo vya kubebea makaa ya moto. Vyombo vyake vyote akavitengeneza kwa shaba[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda vyungu hivi vilitumiwa kuondolea majivu madhabahuni.
    reason: lexical_alternative
  - marker: b
    text: Au “shaba ya bati.” Neno la Kiebrania linaweza kumaanisha shaba au aloi yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי הַמִּזְבֵּחַ
  choice: vyombo vya madhabahu
  rationale: כְּלִי ni neno pana linaloweza kumaanisha vyombo au vifaa; “vyombo” ni Kiswahili cha kawaida na linafaa kwa orodha hii ya vifaa vya madhabahu.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na lenye hadhi katika Kiswahili kwa מִזְבֵּחַ katika muktadha wa ibada.
- source_word: הַסִּירֹת
  choice: vyungu
  rationale: סִירוֹת kwa kawaida humaanisha vyungu. Muktadha unaonyesha huenda vilitumika kuondolea majivu, lakini kazi hiyo haijatajwa wazi katika Kiebrania, kwa hiyo imewekwa katika tanbihi.
- source_word: הַיָּעִים
  choice: koleo
  rationale: יַע ni kifaa cha kuchotea au kuondolea vitu; “koleo” ni tafsiri ya kawaida na inayoeleweka katika huduma ya madhabahu.
- source_word: הַמִּזְרָקֹת
  choice: mabakuli
  rationale: מִזְרָקוֹת ni vyombo vilivyotumiwa kushughulikia vimiminika katika ibada; “mabakuli” ni neno la asili na linaloeleweka bila kuongeza kazi isiyotajwa katika mstari.
- source_word: הַמִּזְלָגֹת
  choice: uma
  rationale: Neno hili hutaja vifaa vyenye meno kama uma. “Uma” linahifadhi maana hiyo bila kuongeza wazi kuwa vilikuwa vya kushikia nyama.
- source_word: הַמַּחְתֹּת
  choice: vyombo vya kubebea makaa ya moto
  rationale: מַחְתָּה ni chombo cha kuchotea au kubebea makaa yenye moto. Kirai hiki ni wazi katika Kiswahili na huepuka neno “vyetezo,” ambalo lingeweza kudokeza matumizi maalumu ya kufukizia uvumba.
- source_word: כָּל כֵּלָיו
  choice: vyombo vyake vyote
  rationale: Kiambishi cha umilikaji kinarejelea madhabahu; kurudia “vyombo” kunadumisha ulinganifu na sehemu ya kwanza ya mstari.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: נְחֹשֶׁת linaweza kutaja shaba au aloi yake, shaba nyeusi. “Shaba” ni neno la kawaida katika Kiswahili cha Biblia, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Akatengeneza ... akavitengeneza
  rationale: Kurudia kitenzi kunafuata muundo wa Kiebrania, ambao kwanza unaorodhesha vyombo kisha unatoa kauli ya jumla kuhusu vitu vilivyotumiwa kuvitengeneza.
