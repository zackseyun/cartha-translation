  text: And the bronze of the wave offering was seventy talents and 2,400 shekels[a][b].
translation:
  language: sw
  text: Na shaba[a] ya sadaka ya kuinuliwa[b] ilikuwa talanta sabini na shekeli 2,400.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha shaba au bronzi, kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: “Sadaka ya kuinuliwa” ni istilahi ya kiibada kwa kitu kilichowasilishwa mbele za BWANA kwa tendo la kuinua au kupunga; wengine hutafsiri kwa ujumla zaidi kuwa “sadaka iliyowasilishwa” au “mchango.”
    reason: cultural_note
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Neno la Kiebrania linaweza kutaja shaba au bronzi kulingana na muktadha. “Shaba” ni neno la kawaida katika Kiswahili cha Biblia kwa metali iliyotumiwa kutengeneza vifaa vya maskani, huku tanbihi ikihifadhi uwezekano wa maana mahususi zaidi.
- source_word: הַתְּנוּפָה
  choice: sadaka ya kutikiswa
  rationale: Hili ni neno la kiibada kwa kitu kilichowasilishwa mbele za BWANA kwa mwendo wa kukitikisa. Tafsiri hii inahifadhi maana ya kiufundi badala ya kuifanya kuwa “mchango” tu.
- source_word: שִׁבְעִים כִּכָּר
  choice: talanta sabini
  rationale: Talanta ni kipimo kikubwa cha uzito cha kale. Kukihifadhi katika matini kuu kunazuia kuweka kimakosa thamani moja ya kisasa ambapo uzito wake kamili unaweza kutofautiana.
- source_word: וְאַלְפַּיִם וְאַרְבַּע מֵאוֹת שָׁקֶל
  choice: na shekeli 2,400
  rationale: Shekeli hapa ni kipimo cha uzito, si sarafu kwa maana ya lazima. Tarakimu zinafanya jumla hiyo isomeke kwa urahisi.
- source_word: וְּ
  choice: Na
  rationale: Kiunganishi hicho kinaunganisha jumla hii na orodha ya hesabu iliyoitangulia.
