translation:
  language: sw
  text: Kwa upande mmoja kulikuwa na vitambaa vya urefu wa dhiraa kumi na tano; nguzo zake zilikuwa tatu, na vikalio vyake[a] vilikuwa vitatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, soketi zake zilikuwa tatu.
    reason: Mbadala wa kileksia kwa אַדָנִים, neno linaloweza kumaanisha besi au soketi ambamo nguzo zilisimamishwa.
lexical_decisions:
- source_word: קְלָעִים
  choice: vitambaa
  rationale: Katika muktadha wa ua wa Maskani, neno hili linamaanisha vitambaa vilivyotundikwa kuuzunguka ua; “vitambaa” ni lugha ya kawaida na yenye heshima.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: urefu wa dhiraa kumi na tano
  rationale: Kiebrania kinatoa kipimo bila kutaja wazi “urefu”; kuongeza “urefu wa” kunafanya maana ya kipimo iwe wazi kwa Kiswahili bila kubadili taarifa.
- source_word: אֶל הַכָּתֵף
  choice: vya upande mmoja
  rationale: כָּתֵף, kihalisi “bega/upande,” hapa hueleza mojawapo ya pande za eneo la lango; usemi huu ni wa asili katika Kiswahili.
- source_word: עַמּוּדֵיהֶם
  choice: nguzo zake
  rationale: Kiambishi cha wingi katika Kiebrania kinarejelea vitambaa au sehemu iliyotajwa; Kiswahili hutumia upatanisho wa ngeli kwa “vitambaa,” hivyo “zake” ni sahihi.
- source_word: אַדְנֵיהֶם
  choice: vikalio vyake
  rationale: Neno hili linataja sehemu za chini ambamo nguzo zilisimamishwa. “Vikalio” linaeleza kazi yake vizuri katika Kiswahili cha sasa.
