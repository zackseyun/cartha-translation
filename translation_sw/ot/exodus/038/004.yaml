  text: He made for the altar a grating[a], a network of bronze, under its ledge, beneath[c][b], up to its halfway point.
translation:
  language: sw
  text: Akatengeneza kwa ajili ya madhabahu kimia[a] cha shaba, kilichotengenezwa kama wavu, chini ya ukingo wake[b], kutoka chini hadi katikati yake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kimia, kazi ya wavu, cha shaba.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania kuhusu sehemu hii ya madhabahu linaweza pia kutafsiriwa “mshipi,” “kingo iliyochomoza,” au “sehemu inayoizunguka.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kutoka chini hadi nusu yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Wayyiqtol ya עשה inaendeleza simulizi; kitenzi hiki ni cha kawaida na cha heshima katika Kiswahili.
- source_word: לַמִּזְבֵּחַ
  choice: kwa ajili ya madhabahu
  rationale: ל hapa huonyesha kitu ambacho wavu ulitengenezewa, si mahali tu ulipowekwa.
- source_word: מִכְבָּר מַעֲשֵׂה רֶשֶׁת
  choice: wavu
  rationale: Kirai kinaeleza kifaa chenye muundo wa kimiani; 'wavu' ni neno la kawaida linalowasilisha umbo hilo bila urudiaji usio wa asili.
- source_word: נְחֹשֶׁת
  choice: wa shaba
  rationale: Katika muktadha wa vifaa vya maskani, נְחֹשֶׁת kwa kawaida na kwa kufaa hutafsiriwa 'shaba'.
- source_word: תַּחַת כַּרְכֻּבּוֹ
  choice: chini ya ukingo wake
  rationale: תַּחַת ni uhusiano wa nafasi, na כַּרְכֻּבּוֹ ni sehemu inayozunguka au inayochomoza kwenye madhabahu; 'ukingo' ni wazi na wa kawaida.
- source_word: מִלְּמַטָּה עַד חֶצְיוֹ
  choice: kutoka chini hadi katikati yake
  rationale: Huhifadhi maana ya moja kwa moja ya mwanzo wa chini na kikomo chake katikati, bila kuongeza maelezo yasiyo wazi katika Kiebrania.
