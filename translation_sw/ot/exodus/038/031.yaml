translation:
  language: sw
  text: na vitako vya ua pande zote[a], na vitako vya lango la ua, na vigingi vyote vya Maskani[b], na vigingi vyote vya ua pande zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “soketi” badala ya “vitako.”
    reason: lexical_alternative
  - marker: b
    text: Au “vigingi vya kutia hema” badala ya “vigingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי
  choice: vitako
  rationale: Katika muktadha wa ujenzi wa Maskani, neno hili humaanisha vipande vya msingi vilivyoshikilia nguzo au mbao. “Vitako” ni neno la kawaida na thabiti linalodumisha maana hiyo ya kitu cha chini kinachotegemeza.
- source_word: חָצֵר
  choice: ua
  rationale: “Ua” kwa kawaida hueleweka kuwa eneo la nje lililozingirwa, kama eneo takatifu lililoizunguka Maskani.
- source_word: סָבִיב
  choice: uliozunguka
  rationale: Hueleza ua uliokuwa kuzunguka Maskani; tafsiri hii ni ya asili kwa Kiswahili na inahifadhi wazo la kuzunguka pande zote.
- source_word: שַׁעַר
  choice: lango
  rationale: Neno hili linamaanisha njia rasmi ya kuingilia ua, hivyo “lango” ni tafsiri ya moja kwa moja na inayofaa muktadha wa ujenzi.
- source_word: יִתְדֹת
  choice: vigingi
  rationale: Ni vigingi vya kufungia na kuimarisha Maskani na ua wake; “vigingi” ni istilahi ya kawaida ya vifaa vya hema.
- source_word: מִּשְׁכָּן
  choice: Maskani
  rationale: Katika Kutoka, hili ni jina maalumu la hema takatifu ambamo Mungu alikaa kati ya watu wake. Herufi kubwa hudumisha matumizi yake kama jina la mahali hapo maalumu.
- source_word: כָּל
  choice: vyote
  rationale: Hujumuisha kwa ukamilifu vigingi vilivyotajwa na kupatana kisarufi na nomino ya ngeli ya vi-.
- source_word: וְאֵת / וְאֶת
  choice: na
  rationale: Kiunganishi pamoja na kiashiria cha yambwa huendeleza orodha; “na” hudumisha mtindo huo bila kutafsiri kiashiria cha yambwa kama neno tofauti.
