  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha ya Kiebrania umehifadhiwa kwa urudiaji wa “na,” huku msamiati wa ujenzi ukiwekwa wazi kwa msomaji wa kawaida.
