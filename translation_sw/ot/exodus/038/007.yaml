  yaml_path: translation/ot/exodus/038/007.yaml
  text: He put the poles into the rings on the sides of the altar[a], to carry it with them. He made it hollow[b], with boards.
translation:
  language: sw
  text: Akazitia zile fito ndani ya pete zilizokuwa kwenye pande za madhabahu[a], ili kuibeba kwa fito hizo. Aliitengeneza kwa mbao, ikiwa tupu ndani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Akazileta zile fito ndani ya pete.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kihalisi zaidi kuwa “akazileta,” lakini katika muktadha huu kinamaanisha kuziweka fito ndani ya pete.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “tupu ndani, mbao.” Maneno haya mafupi yanaelekea kumaanisha kwamba madhabahu ilijengwa kwa mbao ikiwa tupu ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Akazitia
  rationale: Hifili ya בוא hapa inaeleza kuweka fito ndani ya pete. “Akazitia” ni ya kawaida katika Kiswahili na inaonyesha tendo la kuziweka mahali pake.
- source_word: הַבַּדִּים
  choice: zile fito
  rationale: בַּדִּים katika muktadha wa hema takatifu ni fito za kubebea vyombo vitakatifu. “Fito” ni neno la sasa na linaloeleweka kwa urahisi.
- source_word: בַּטַּבָּעֹת
  choice: ndani ya pete
  rationale: Kihusishi kinaonyesha kuwekwa ndani ya pete; usemi huu unaendana kiasili na kitenzi “akazitia.”
- source_word: עַל צַלְעֹת הַמִּזְבֵּחַ
  choice: zilizokuwa kwenye pande za madhabahu
  rationale: צַלְעֹת humaanisha pande au sehemu za pembeni. Ufafanuzi huu unaonyesha kwamba pete ndizo zilizokuwa kwenye pande za madhabahu bila kuongeza maelezo yasiyomo.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: ili kuibeba kwa fito hizo
  rationale: Kishazi cha kitenzi-jina kinaonyesha kusudi. Kutaja “fito hizo” huondoa utata wa kiwakilishi bila kubadili maana ya Kiebrania.
- source_word: נְבוּב
  choice: yenye uwazi ndani
  rationale: נְבוּב inaeleza kitu kisichojaa ndani. “Yenye uwazi ndani” ni Kiswahili cha kawaida na huepuka dhana ya kwamba madhabahu ilitobolewa baada ya kutengenezwa.
- source_word: לֻחֹת
  choice: kwa mbao
  rationale: Muundo נְבוּב לֻחֹת ni wa mkato. “Kwa mbao” unaonyesha ujenzi wa madhabahu yenye uwazi ndani kwa kutumia mbao, huku tanbihi ikihifadhi umbo halisi lisilo wazi kabisa.
- source_word: עָשָׂה אֹתוֹ
  choice: Aliitengeneza
  rationale: Hii ni tafsiri ya kawaida ya עשה pamoja na kiambishi cha yambwa, na inafaa kwa kazi ya kutengeneza madhabahu.
