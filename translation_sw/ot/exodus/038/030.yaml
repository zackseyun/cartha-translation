base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/030.yaml
  text: With it he made the bases for the entrance of the tent of meeting[a], the bronze altar, the bronze grating for it[b], and all the utensils of the altar.
translation:
  language: sw
  text: Kwa shaba hiyo akatengeneza vitako vya mlango wa hema la mkutano[a], madhabahu ya shaba, wavu wake wa kimiani wa shaba[b], na vyombo vyote vya madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “soketi za mlango wa hema la mkutano.”
    reason: lexical_alternative
  - marker: b
    text: Au “grati yake ya shaba” au “mtandao wake wa shaba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akatengeneza
  rationale: Kitenzi hiki cha kawaida katika masimulizi kinaonyesha kutengeneza vitu; ‘akatengeneza’ ni cha asili na hudumisha mwendelezo wa simulizi.
- source_word: בָּהּ
  choice: Kwa shaba hiyo
  rationale: Kiwakilishi kinarejelea shaba iliyotajwa katika mstari uliotangulia na hapa kina maana ya nyenzo iliyotumiwa.
- source_word: אַדְנֵי
  choice: vitako
  rationale: Katika muktadha wa hema, neno hili humaanisha sehemu za chini za kutegemeza nguzo au mbao; ‘vitako’ ni wazi na la kawaida kuliko istilahi ya kiufundi zaidi.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: mwingilio wa hema la mkutano
  rationale: Huwakilisha kwa kawaida sehemu ya kuingilia au uwazi wa hema bila kuifanya lazima iwe mlango wenye bawaba.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: madhabahu ya shaba
  rationale: Hii ndiyo tafsiri ya kawaida na inayoeleweka ya madhabahu iliyotengenezwa kwa shaba.
- source_word: מִכְבַּר הַנְּחֹשֶׁת אֲשֶׁר לוֹ
  choice: wavu wake wa shaba
  rationale: ‘Wavu’ huonyesha muundo wa kimiani wa kifaa hicho, na ‘wake’ huhifadhi uhusiano wake na madhabahu bila kubainisha mahali kilipowekwa.
- source_word: כָּל כְּלֵי הַמִּזְבֵּחַ
  choice: vyombo vyote vya madhabahu
  rationale: ‘Vyombo’ ni neno pana, la kawaida katika Kiswahili cha Biblia, kwa vifaa na zana zilizotumiwa pamoja na madhabahu.
