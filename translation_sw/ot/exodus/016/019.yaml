lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: 'Muundo wa mfululizo wa kisimulizi unaendeleza tukio; Kiswahili cha kawaida huunganisha kitenzi cha kusema na kiambishi cha watendewa: ‘akawaambia’.'
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: אֲלֵהֶם
  choice: -wa- (katika ‘akawaambia’)
  rationale: Kiambishi hiki huonyesha kwa kawaida na kwa usahihi kwamba Musa alisema kwao.
- source_word: אִישׁ
  choice: mtu yeyote
  rationale: 'Nomino hii ina maana ya mgawanyo katika muktadha huu: katazo linamhusu kila mtu mmoja mmoja, si wanaume pekee.'
- source_word: אַל
  choice: asi-
  rationale: Kiambishi hasi cha hali tegemezi huwasilisha kwa kawaida katazo linaloletwa na אַל.
- source_word: יוֹתֵר
  choice: asiache
  rationale: Katika muktadha wa mana, kitenzi kinamaanisha kuacha sehemu ibaki kwa ajili ya baadaye.
- source_word: מִמֶּנּוּ
  choice: chochote katika hiyo
  rationale: Kiwakilishi kinarejelea mana kwa maana ya mkusanyiko; msemo huu unaonyesha kutobakiza sehemu yoyote.
- source_word: עַד בֹּקֶר
  choice: mpaka asubuhi
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa kikomo hicho cha wakati.
