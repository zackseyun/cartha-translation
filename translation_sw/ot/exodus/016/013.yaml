  text: Ikawa jioni, kware wakaja wakaifunika kambi; na asubuhi kulikuwa na tabaka la umande kuzunguka kambi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Ikawa jioni
  rationale: Muundo huu unaendeleza mfululizo wa simulizi na kutaja wakati; “Ikawa jioni” ni wa asili na wenye hadhi katika simulizi la Kiswahili.
- source_word: וַתַּעַל הַשְּׂלָו
  choice: kware wakaja
  rationale: Kitenzi עלה kina wazo la kuja au kupanda; kwa ndege wanaoifikia kambi, “wakaja” ni Kiswahili cha kawaida bila kuongeza jambo lisiloelezwa na muktadha.
- source_word: וַתְּכַס אֶת־הַמַּחֲנֶה
  choice: na kuifunika kambi
  rationale: כסּה humaanisha kufunika. Kiambishi “-i-” kinarejelea kambi kwa uwazi na muundo unabaki wa kawaida.
- source_word: הָיְתָה שִׁכְבַת הַטַּל
  choice: tabaka la umande lilikuwa
  rationale: שִׁכְבַת hueleza kitu kilichotanda kama tabaka. Mpangilio huu unafuata kiima cha Kiebrania na ni wazi katika Kiswahili.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: kuizunguka kambi
  rationale: Kirai hiki kinaonyesha mahali panapoizunguka kambi; “kuizunguka kambi” ni usemi wa kawaida na sahihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. “Kware” imetumiwa kama nomino ya viumbe wengi, kwa hiyo upatanisho ni wa wingi. Hakuna tanbihi iliyowekwa kwa sababu tofauti ya mpangilio kati ya “tabaka ... lilikuwa” na “kulikuwa na tabaka” haibadili maana kwa kiasi kinachohitaji tanbihi katika Kiswahili.
