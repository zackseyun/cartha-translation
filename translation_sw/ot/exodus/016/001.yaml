  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵֽ/אֵילִ֔ם וַ/יָּבֹ֜אוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ אֶל מִדְבַּר סִ֔ין אֲשֶׁ֥ר בֵּין אֵילִ֖ם וּ/בֵ֣ין סִינָ֑י בַּ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לְ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/001.yaml
  text: They set out from Elim[a], and the whole congregation of the sons of Israel came to the wilderness of Sin, which is between Elim and Sinai[b], on the fifteenth day of the second month after they had gone out from the land of Egypt.
translation:
  language: sw
  text: Wakaondoka Elimu, na kusanyiko lote la Waisraeli likafika katika nyika ya Sini[a], iliyo kati ya Elimu na Sinai, siku ya kumi na tano ya mwezi wa pili baada ya kutoka katika nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sini” hapa ni jina la mahali—nyika ya Sini—wala si neno linalomaanisha dhambi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ מֵאֵילִם
  choice: Wakaondoka Elimu
  rationale: Katika simulizi la safari, נסע humaanisha kuvunja kambi na kuanza safari. “Wakaondoka” ni Kiswahili cha kawaida kinachowasilisha mwendo huo bila kuongeza maelezo yasiyotajwa wazi.
- source_word: וַיָּבֹאוּ
  choice: likafika
  rationale: בוא ni kitenzi cha mwendo; hapa “likafika” linaonyesha mwisho wa hatua ya safari kwa njia ya asili katika Kiswahili.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: kusanyiko lote la Waisraeli
  rationale: עֵדָה ni jumuiya au kusanyiko la watu. “Waisraeli” linawasilisha kwa kawaida jina la kitaifa בְּנֵי יִשְׂרָאֵל, ambalo katika muktadha huu linahusu watu wote, si wanaume pekee.
- source_word: אֶל מִדְבַּר סִין
  choice: katika nyika ya Sini
  rationale: מִדְבָּר ni eneo kame lisilokaliwa sana; “nyika” ni neno la kawaida na lenye hadhi katika Kiswahili cha Biblia. סִין limetoholewa kuwa “Sini” kama jina la mahali.
- source_word: אֲשֶׁר בֵּין אֵילִם וּבֵין סִינָי
  choice: iliyo kati ya Elimu na Sinai
  rationale: Kifungu hiki kinatunza moja kwa moja maelezo ya mahali yaliyomo katika Kiebrania.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשֵּׁנִי
  choice: siku ya kumi na tano ya mwezi wa pili
  rationale: Huu ndio usemi wa kawaida wa tarehe katika Kiswahili na unafuata maana ya muundo wa Kiebrania.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: baada ya kutoka katika nchi ya Misri
  rationale: Muundo wenye לְ unaweka kutoka Misri kuwa rejea ya wakati. “Baada ya kutoka” huwasilisha uhusiano huo wazi, huku “nchi ya Misri” ikihifadhi אֶרֶץ מִצְרַיִם.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya mahali yametoholewa kwa maumbo yaliyozoeleka: Elimu, Sini, Sinai na Misri. “Kusanyiko lote la Waisraeli” ni la asili zaidi kuliko tafsiri ya neno kwa neno “wana wa Israeli” na bado linabeba maana ya jumuiya nzima ya taifa.'
