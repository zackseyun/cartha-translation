  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְ/נִ֨י מַמְטִ֥יר לָ/כֶ֛ם לֶ֖חֶם מִן הַ/שָּׁמָ֑יִם וְ/יָצָ֨א הָ/עָ֤ם וְ/לָֽקְטוּ֙ דְּבַר י֣וֹם בְּ/יוֹמ֔/וֹ לְמַ֧עַן אֲנַסֶּ֛/נּוּ הֲ/יֵלֵ֥ךְ בְּ/תוֹרָתִ֖/י אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/004.yaml
  text: Then Yahweh said to Moses[a], “Behold, I am raining bread from heaven for you, and the people shall go out and gather a day's portion each day, so that I may test them[c][b], whether they will walk in my law or not.”
translation:
  language: sw
  text: Ndipo Yahweh akamwambia Musa, “Tazama, nitawanyeshea mkate kutoka mbinguni. Watu watatoka na kukusanya kiasi cha siku moja kila siku,[a] ili niwajaribu kuona kama watafuata maagizo yangu[b] au la.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “jambo la siku katika siku yake,” yaani, kiasi kinachohitajika kwa siku hiyo kikusanywe siku kwa siku.'
    reason: lexical_alternative
  - marker: b
    text: Au “sheria yangu” au “mafundisho yangu.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano limehifadhiwa kwa umbo linalotambulika katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: הִנְנִי מַמְטִיר
  choice: Tazama, nitawanyeshea
  rationale: הִנְנִי huleta tangazo lenye msisitizo, na kitenzi-shirikishi מַמְטִיר kinaweza kueleza tendo la wakati ujao lililo karibu. ‘Nitawanyeshea’ ni Kiswahili cha kawaida na hudumisha taswira ya mvua.
- source_word: לֶחֶם מִן הַשָּׁמָיִם
  choice: mkate kutoka mbinguni
  rationale: ‘Mkate’ huhifadhi nomino halisi לֶחֶם na umuhimu wake wa baadaye katika Biblia; ‘mbinguni’ linafaa kwa chanzo cha kimungu katika muktadha huu.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: kiasi cha siku hiyo kila siku
  rationale: Nahau hii inaeleza kiasi kinachohitajika kwa siku moja, kikikusanywa siku kwa siku, bila kuiga kwa ugumu ‘jambo la siku katika siku yake.’
- source_word: לְמַעַן אֲנַסֶּנּוּ
  choice: ili niwajaribu
  rationale: Ingawa kiambishi cha Kiebrania ni umoja, kinarejelea הָעָם, nomino ya mkusanyiko; Kiswahili cha kawaida hutumia wingi kwa watu hao.
- source_word: הֲיֵלֵךְ בְּתוֹרָתִי
  choice: kuona kama watafuata maagizo yangu
  rationale: ‘Kufuata’ huwasilisha kwa kawaida sitiari ya Kiebrania ya ‘kutembea katika,’ huku ‘maagizo’ yakihifadhi maana ya תורה kama mwongozo wa Mungu katika muktadha huu wa kabla ya Sinai.
- source_word: אִם לֹא
  choice: au la
  rationale: Hukamilisha swali lisilo la moja kwa moja kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya תּוֹרָה kabla ya kutolewa kwa sheria huko Sinai
  choice: maagizo yangu
  alternative: sheria yangu; mafundisho yangu
  rationale: Katika muktadha wa karibu, Mungu anapima kama watu watafuata maelekezo yake kuhusu kukusanya chakula. ‘Maagizo’ huepuka kudokeza bila lazima mfumo wote wa Sheria ya Sinai, huku ikiendeleza uzito wa mapenzi ya Mungu yaliyofunuliwa. ‘Sheria yangu’ bado ni tafsiri halali na imeonyeshwa katika tanbihi.
- issue: Kusudi la utoaji wa mkate
  choice: ili niwajaribu kuona kama watafuata
  alternative: ili niwajaribu, kama watafuata
  rationale: Muundo unaonyesha kuwa utoaji wa kila siku ni jaribio la mwenendo wa watu, si kishawishi cha kutenda dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi cha Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Tazama’ limetumiwa kwa tangazo la kimungu; sentensi imepangwa kwa mtiririko wa asili bila kuondoa taswira kuu ya Kiebrania.
