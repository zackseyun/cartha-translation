base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/024.yaml
  text: So they left it until morning[a], just as Moses had commanded, and it did not stink, nor were there any worms in it.
translation:
  language: sw
  text: Basi wakaiacha mpaka asubuhi, kama Musa alivyoagiza. Haikunuka, wala hakukuwa na minyoo[a] ndani yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “funza.” Neno la Kiebrania linaweza kumaanisha kwa ujumla viumbe kama minyoo wanaotokea katika kitu kinachooza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחוּ אֹתוֹ
  choice: wakaiacha
  rationale: Katika muktadha wa kutunza mana usiku kucha, kitenzi hiki kina maana ya kuiacha au kuiweka kando. “Wakaiacha” ni Kiswahili cha kawaida na kinadumisha kiwakilishi cha umoja.
- source_word: עַד הַבֹּקֶר
  choice: mpaka asubuhi
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha kikomo cha wakati.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: kama Musa alivyoagiza
  rationale: “Alivyoagiza” huwasilisha amri iliyotangulia bila kuongeza mtendwa ambaye hajaelezwa wazi katika Kiebrania.
- source_word: הִבְאִישׁ
  choice: haikunuka
  rationale: Kitenzi cha Kiebrania humaanisha kunuka au kuwa na uvundo. “Haikunuka” ni tafsiri ya moja kwa moja, wazi na ya kawaida.
- source_word: רִמָּה
  choice: minyoo
  rationale: Nomino hii inaweza kutaja viumbe kama minyoo wanaotokea katika kitu kinachooza; “minyoo” ni pana kuliko “funza” na hivyo haibani maana kupita kiasi.
- source_word: לֹא הָיְתָה בּוֹ
  choice: wala hakukuwa na ... ndani yake
  rationale: Muundo huu wa Kiswahili huonyesha kwa kawaida kwamba kitu hicho hakikuwamo, huku ukiendeleza ukanushi wa kishazi kilichotangulia.
theological_decisions: []
