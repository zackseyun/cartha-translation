base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/005.yaml
  text: And on the sixth day[a], when they prepare what they bring in, it will be twice as much as what they gather day by day.
translation:
  language: sw
  text: Siku ya sita, watakapotayarisha kile watakacholeta, kitakuwa mara mbili[a] ya kile wanachokusanya siku kwa siku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitakuwa sehemu maradufu ya kile wanachokusanya kila siku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Siku ya sita ... kitakuwa
  rationale: Muundo huu unaeleza hali ya baadaye katika maagizo. Kiswahili cha kawaida hakihitaji kurudia kiunganishi cha Kiebrania katika kila kishazi.
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: Siku ya sita
  rationale: Hili ni fungu la moja kwa moja la wakati; ‘ya juma’ haijaelezwa wazi katika Kiebrania.
- source_word: וְהֵכִינוּ
  choice: watakapotayarisha
  rationale: Kauli ya wakati inaunganisha matayarisho na siku ya sita kwa njia ya asili katika Kiswahili, huku ikidumisha mwelekeo wa wakati ujao.
- source_word: אֵת אֲשֶׁר יָבִיאוּ
  choice: kile watakacholeta
  rationale: Kiwakilishi hiki kinarejelea kitu kitakachokusanywa na kuletwa; tafsiri haiongezi mahali ambako hakutajwi katika Kiebrania.
- source_word: וְהָיָה מִשְׁנֶה
  choice: kitakuwa mara mbili
  rationale: מִשְׁנֶה hapa inaonyesha kiasi maradufu. ‘Mara mbili’ ni wazi na ya kawaida katika Kiswahili.
- source_word: עַל אֲשֶׁר
  choice: ya kile
  rationale: Katika muktadha huu עַל inaonyesha ulinganisho wa kiasi; ‘mara mbili ya kile’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: יִלְקְטוּ
  choice: wanachokusanya
  rationale: לקט humaanisha kuokota au kukusanya; ‘kukusanya’ inafaa kwa muktadha wa mana.
- source_word: יוֹם יוֹם
  choice: siku kwa siku
  rationale: Urudiaji wa Kiebrania una maana ya kitendo kinachofanyika kila siku; ‘siku kwa siku’ huhifadhi pia mpigo wa usemi huo.
