  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם ה֚וּא אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה שַׁבָּת֧וֹן שַׁבַּת קֹ֛דֶשׁ לַֽ/יהוָ֖ה מָחָ֑ר אֵ֣ת אֲשֶׁר תֹּאפ֞וּ אֵפ֗וּ וְ/אֵ֤ת אֲשֶֽׁר תְּבַשְּׁלוּ֙ בַּשֵּׁ֔לוּ וְ/אֵת֙ כָּל הָ֣/עֹדֵ֔ף הַנִּ֧יחוּ לָ/כֶ֛ם לְ/מִשְׁמֶ֖רֶת עַד הַ/בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
translation:
  language: sw
  text: 'Akawaambia, “Hili ndilo alilosema Yahwe: Kesho ni pumziko kuu, Sabato takatifu kwa Yahwe.[a] Chochote mtakachooka, kiokeni; na chochote mtakachochemsha, kichemsheni.[b] Yote yatakayobaki, yawekeni akiba kwa ajili yenu mpaka asubuhi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pumziko la Sabato, takatifu kwa Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania hurudia vitenzi kwa msisitizo: “mtakachooka, okeni; na mtakachochemsha, chemsheni.”'
    reason: source_form
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Akawaambia
  rationale: Muundo huu wa kawaida wa masimulizi unaendeleza tukio na kutambulisha maneno ya moja kwa moja kwa Kiswahili cha kawaida.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: Hili ndilo alilosema Yahwe
  rationale: Kauli hii hurejelea jambo lililo mbele yao. Kiswahili cha sasa hutumia 'alilosema' kwa ufasaha bila kupoteza maana ya tamko la Mungu lililotolewa tayari.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetoholewa kwa umbo linaloeleweka na kutamkika kwa kawaida katika Kiswahili.
- source_word: שַׁבָּתוֹן
  choice: pumziko kamili
  rationale: Nomino hii inaonyesha kusitisha kazi kwa namna maalumu na kamili, si kupumzika kwa kawaida tu.
- source_word: שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: Sabato takatifu kwa Yahwe
  rationale: Huhifadhi utakatifu wa siku hiyo na kuelekezwa kwake kwa Yahwe, huku ikibaki katika uhusiano wa ufafanuzi na 'pumziko kamili'.
- source_word: אֵת אֲשֶׁר תֹּאפוּ אֵפוּ
  choice: Mtakachooka, okeni
  rationale: 'Urudiaji wa kitenzi cha Kiebrania umehifadhiwa ili kuonyesha msisitizo: waandae sasa chochote walichokusudia kuoka.'
- source_word: וְאֵת אֲשֶׁר תְּבַשְּׁלוּ בַּשֵּׁלוּ
  choice: na mtakachochemsha, chemsheni
  rationale: Kitenzi בשׁל hapa kinaweza kuwa kupika au kuchemsha; 'chemsha' ni chaguo mahususi linalofaa kwa njia ya utayarishaji inayotofautishwa na kuoka.
- source_word: כָּל הָעֹדֵף
  choice: Kila kitakachobaki
  rationale: Hueleza sehemu yote itakayobaki baada ya maandalizi, kwa lugha ya kawaida na iliyo wazi.
- source_word: הַנִּיחוּ לָכֶם לְמִשְׁמֶרֶת
  choice: kiwekeni kwa ajili yenu, kihifadhiwe
  rationale: Huhifadhi wazo la kukitenga kwa makusudi kwa matumizi yao na kusudi la kukilinda au kukihifadhi.
- source_word: עַד הַבֹּקֶר
  choice: mpaka asubuhi
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha muda wa kuhifadhi bila kuongeza kwamba ni asubuhi inayofuata, ingawa hilo linaeleweka katika muktadha.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la agano YHWH. 'Yahwe' huhifadhi jina hilo badala ya kulibadilisha kwa cheo.
- issue: Uhusiano wa שַׁבָּתוֹן na שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: pumziko kamili, Sabato takatifu kwa Yahwe
  alternative: pumziko la Sabato, takatifu kwa Yahwe
  rationale: Muundo wa Kiebrania unaweza kueleweka kuwa kauli mbili za kiambatisho zinazofafanua siku hiyo. Tafsiri kuu huhifadhi msisitizo wa pumziko kamili na Sabato bila kuzifanya kuwa dhana mbili tofauti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeweka urudiaji wa vitenzi vya Kiebrania kwa sababu unasikika kwa kawaida kama agizo lenye msisitizo katika Kiswahili. Neno 'Sabato' limehifadhiwa kama istilahi inayojulikana, huku 'pumziko kamili' likifafanua uzito wa שַׁבָּתוֹן.
