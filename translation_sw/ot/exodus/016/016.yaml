  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה לִקְט֣וּ מִמֶּ֔/נּוּ אִ֖ישׁ לְ/פִ֣י אָכְל֑/וֹ עֹ֣מֶר לַ/גֻּלְגֹּ֗לֶת מִסְפַּר֙ נַפְשֹׁ֣תֵי/כֶ֔ם אִ֛ישׁ לַ/אֲשֶׁ֥ר בְּ/אָהֳל֖/וֹ תִּקָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/016.yaml
  text: 'This is the word that Yahweh has commanded: ‘Gather from it[a], each man according to his eating; an omer per person, according to the number of your persons. Each man shall take for those who are in his tent.’'
translation:
  language: sw
  text: 'Hili ndilo jambo ambalo Yahwe ameamuru: “Okoteni baadhi yake, kila mtu kwa kadiri ya chakula anachohitaji: omeri moja kwa kila mtu[a], kulingana na idadi ya watu wenu. Kila mtu achukue kwa ajili ya wale walio katika hema lake.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kwa kila kichwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: jambo
  rationale: Katika muundo huu wa kutangaza agizo, דָּבָר hurejelea jambo au agizo linalosemwa. “Jambo” ni la kawaida katika Kiswahili na linaepuka usemi mzito “neno ambalo ... ameamuru.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa namna inayosomeka kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo.
- source_word: לִקְטוּ מִמֶּנּוּ
  choice: Okoteni baadhi yake
  rationale: לקט ni kukusanya au kuokota chakula kilichotapakaa. “Okoteni” linafaa kwa mana iliyo ardhini, na “baadhi yake” linaonyesha kuwa watu wachukue sehemu ya kile kilichotajwa.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: kila mtu kwa kadiri ya chakula anachohitaji
  rationale: Kirai hiki kinamaanisha kiasi kinacholingana na ulaji wa kila mmoja. Tafsiri hii ni ya asili na haidai kwamba kila mtu lazima ale kiasi chote alichoweza kula.
- source_word: עֹמֶר
  choice: omeri
  rationale: Hiki ni kipimo maalumu cha ujazo wa vitu vikavu; kulitohowa jina lake huepuka kukipa thamani ya kisasa isiyo hakika.
- source_word: לַגֻּלְגֹּלֶת
  choice: kwa kila mtu
  rationale: Maana halisi ni “kwa kila kichwa,” lakini hapa kichwa kinatumika katika kuhesabu watu. “Kwa kila mtu” huwasilisha maana hiyo wazi; usemi halisi umewekwa katika tanbihi.
- source_word: מִסְפַּר נַפְשֹׁתֵיכֶם
  choice: kulingana na idadi ya watu wenu
  rationale: נֶפֶשׁ hapa humaanisha mtu binafsi anayehesabiwa, si nafsi isiyo ya mwili. “Watu wenu” ni wazi na ya kawaida.
- source_word: לַאֲשֶׁר בְּאָהֳלוֹ
  choice: kwa ajili ya wale walio katika hema lake
  rationale: Tafsiri hii huhifadhi picha halisi ya watu waliomo katika hema bila kuibadili kimyakimya kuwa dhana pana ya kaya.
- source_word: תִּקָּחוּ
  choice: achukue
  rationale: Ingawa kitenzi cha Kiebrania ni wingi, sentensi inaelekeza agizo kwa kila mtu mmoja mmoja. “Kila mtu achukue” huhifadhi nguvu ya agizo na mgawanyo huo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi יהוה, si cheo אֲדֹנָי. “Yahwe” hulihifadhi kama jina na ni umbo linalosomeka kwa kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa agizo umefanywa wa kawaida kwa msomaji wa leo, huku “omeri,” hema, na jina Yahwe vikihifadhi upekee wa maandishi ya Kiebrania.
