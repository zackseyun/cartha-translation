  yaml_path: translation/ot/exodus/016/025.yaml
  text: And Moses said, “Eat it today, because today is a Sabbath to the LORD; today you will not find it in the field.”
translation:
  language: sw
  text: Musa akasema, “Kuleni hiyo leo, kwa sababu leo ni Sabato kwa BWANA; leo hamtaipata kondeni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִכְלֻהוּ
  choice: Kuleni hiyo
  rationale: Kitenzi ni amri kwa wingi, na kiwakilishi chake kinarejelea mana; ‘hiyo’ ni Kiswahili cha kawaida bila kurudia nomino isiyotajwa katika mstari huu.
- source_word: שַׁבָּת
  choice: Sabato
  rationale: Neno la kawaida la kibiblia katika Kiswahili, likihifadhi maana ya siku ya pumziko.
- source_word: לַיהוָה
  choice: kwa BWANA
  rationale: Kihusishi ל־ kinaonyesha Sabato iliyowekwa kwa ajili ya BWANA; ‘BWANA’ linafuata desturi pana ya kutafsiri jina la Mungu YHWH.
- source_word: בַּשָּׂדֶה
  choice: kondeni
  rationale: Hutoa kwa kawaida maana ya eneo la wazi ambako watu walikwenda kukusanya mana; ni sawa na ‘shambani’ lakini huepuka kudokeza shamba lililolimwa.
theological_decisions:
- issue: Uhusiano wa Sabato na BWANA katika לַיהוָה
  choice: Sabato kwa BWANA
  alternative: Sabato ya BWANA
  rationale: ‘Kwa BWANA’ huhifadhi kwa karibu nguvu ya kihusishi cha Kiebrania bila kuamua zaidi ikiwa ni umiliki, wakfu, au uelekeo.
- issue: Sababu inayotolewa na כִּי
  choice: kwa sababu
  alternative: kwa maana
  rationale: Hapa כִּי inaanzisha sababu ya kula mana iliyohifadhiwa siku hiyo; ‘kwa sababu’ ni ya wazi na ya kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Marudio ya ‘leo’ yamehifadhiwa mara tatu kama yalivyo katika Kiebrania kwa ajili ya msisitizo.
