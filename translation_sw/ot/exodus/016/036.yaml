  text: Omeri ni sehemu moja ya kumi ya efa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Omeri na efa ni vipimo vya kale vya Kiebrania vya vitu vikavu; mstari huu unafafanua kwamba omeri ni sehemu moja ya kumi ya efa.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֹמֶר
  choice: Omeri
  rationale: Ni kipimo cha kale cha Kiebrania cha vitu vikavu; jina limetoholewa badala ya kubadilishwa kwa kipimo cha kisasa kisicho sahihi. Kiswahili cha sentensi ya ufafanuzi hakihitaji kuonyesha wazi kibainishi cha Kiebrania.
- source_word: עֲשִׂרִית
  choice: sehemu moja ya kumi
  rationale: Hueleza uwiano wa moja kwa kumi kwa lugha ya Kiswahili iliyo wazi na ya kawaida.
- source_word: הָאֵיפָה
  choice: ya efa
  rationale: Efa ni kipimo kingine cha kale cha vitu vikavu; jina limetoholewa ili kuhifadhi kipimo chenyewe bila kukadiria thamani ya kisasa.
- source_word: הוּא
  choice: ni
  rationale: Kiwakilishi hiki kinafanya kazi ya kiunganishi katika kishazi nomino; ‘ni’ hutoa ufafanuzi wa moja kwa moja na wa kawaida katika Kiswahili.
- source_word: וְ
  choice: ''
  rationale: Kiunganishi kinaanzisha maelezo ya ufafanuzi. Katika Kiswahili, kukiacha bila neno tofauti kunatoa sentensi ya ufafanuzi iliyo ya kawaida bila kuongeza alama ya wakati isiyokuwamo katika chanzo.
