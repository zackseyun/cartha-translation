source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה מְלֹ֤א הָ/עֹ֨מֶר֙ מִמֶּ֔/נּוּ לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶ֑ם לְמַ֣עַן יִרְא֣וּ אֶת הַ/לֶּ֗חֶם אֲשֶׁ֨ר הֶאֱכַ֤לְתִּי אֶתְ/כֶם֙ בַּ/מִּדְבָּ֔ר בְּ/הוֹצִיאִ֥/י אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/032.yaml
  text: 'And Moses said[a], “This is the thing that Yahweh has commanded: Let a full omer of it be kept throughout your generations, so that they may see the bread with which I fed you in the wilderness, when I brought you out from the land of Egypt.”'
translation:
  language: sw
  text: 'Musa akasema, “Hili ndilo jambo ambalo Yahwe ameamuru: Omeri moja kamili[a] ya mana hii ihifadhiwe katika vizazi vyenu vyote, ili waone mkate niliowalisha nyikani, nilipowatoa katika nchi ya Misri.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ujazo wa omeri,” yaani kipimo kizima cha omeri.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: Musa akasema
  rationale: Muundo wa masimulizi wenye kitenzi cha mfululizo unaendelezwa kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: זֶה הַדָּבָר
  choice: Hili ndilo jambo
  rationale: דָּבָר hapa ni jambo au agizo maalumu; tafsiri hii ni ya asili kuliko ‘hili ndilo neno’ katika muktadha huu.
- source_word: אֲשֶׁר צִוָּה יְהוָה
  choice: ambalo Yahwe ameamuru
  rationale: Wakati timilifu unaonyesha amri iliyotolewa na ambayo bado ina nguvu; jina la agano יְהוָה limetoholewa kama ‘Yahwe’ kwa matamshi ya kawaida ya Kiswahili.
- source_word: מְלֹא הָעֹמֶר מִמֶּנּוּ
  choice: Omeri moja kamili ya mana hii
  rationale: מְלֹא huonyesha kipimo kilichojaa au kamili. Kiwakilishi ‘hiyo’ kinarejelea mana katika muktadha; kukitaja moja kwa moja kunazuia utata usio wa maana kwa msomaji wa Kiswahili huku kitengo cha kale ‘omeri’ kikihifadhiwa.
- source_word: לְמִשְׁמֶרֶת
  choice: ihifadhiwe
  rationale: Nomino hii ina maana ya kitu kinachowekwa au kulindwa kwa ajili ya kuhifadhiwa; muundo wa kitenzi ni wa kawaida zaidi katika Kiswahili.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Huwasilisha kuendelea kwa ushuhuda huo miongoni mwa vizazi vinavyofuatana.
- source_word: לְמַעַן יִרְאוּ
  choice: ili waone
  rationale: Huhifadhi kishazi cha kusudi na kuacha mtendaji aeleweke kutokana na ‘vizazi vyenu,’ kama ilivyo katika Kiebrania.
- source_word: הַלֶּחֶם אֲשֶׁר הֶאֱכַלְתִּי אֶתְכֶם
  choice: mkate niliowalisha
  rationale: לֶחֶם imetafsiriwa kwa maana yake ya moja kwa moja ‘mkate,’ na Hiphil ya אכל kwa kitenzi cha kusababisha kula, ‘kulisha.’
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: ‘Nyikani’ huonyesha eneo lisilokaliwa la מִדְבָּר kwa Kiswahili cha kibiblia kinachoeleweka, bila kulibana kuwa jangwa la mchanga pekee.
- source_word: בְּהוֹצִיאִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: nilipowatoa katika nchi ya Misri
  rationale: Kiambishi ב pamoja na kitenzi-jina huonyesha wakati; ‘nilipowatoa’ ni muundo wa asili wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina la agano moja kwa moja. ‘Yahwe’ huhifadhi jina hilo na ni utohozi wa kawaida na unaosomeka kwa Kiswahili, bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka mtiririko wa masimulizi na lugha ya amri kwa njia inayoeleweka kwa wasomaji wa kawaida; kipimo cha kale ‘omeri’ kimehifadhiwa na kufafanuliwa katika tanbihi.
