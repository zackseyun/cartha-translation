  text: Ikawa siku ya saba, baadhi ya watu wakatoka kukusanya, lakini hawakupata chochote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni namna ya kawaida na yenye hadhi ya kuendeleza simulizi la Kiebrania kwa Kiswahili bila kutumia maelezo marefu.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: siku ya saba
  rationale: Hufuata kirai cha wakati katika Kiebrania bila kuongeza maneno yasiyokuwamo, kama vile “ya juma.”
- source_word: יָצְאוּ
  choice: wakatoka
  rationale: Hueleza mwendo wa kutoka kambini na pia huendeleza mfuatano wa matukio kwa mtindo wa kawaida wa simulizi la Kiswahili.
- source_word: מִן הָעָם
  choice: baadhi ya watu
  rationale: Kirai hiki kina maana ya sehemu ya kundi; tafsiri hii inaonyesha wazi kuwa si watu wote waliotoka.
- source_word: לִלְקֹט
  choice: kwenda kukusanya
  rationale: Kitenzi לקט humaanisha kukusanya au kuokota. “Kukusanya” kinafaa katika muktadha, ambamo mana ndiyo kitu kinachoeleweka kukusanywa.
- source_word: וְלֹא מָצָאוּ
  choice: lakini hawakupata chochote
  rationale: Ingawa kiunganishi ni “na,” muktadha unaonyesha tofauti kati ya kusudi lao na matokeo; “lakini” huwasilisha uhusiano huo kwa Kiswahili cha kawaida. “Chochote” huacha kitu kilichotafutwa kieleweke kutokana na muktadha.
