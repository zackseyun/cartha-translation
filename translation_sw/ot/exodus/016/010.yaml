base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/010.yaml
  text: And it happened[a], as Aaron spoke to the whole congregation of the sons of Israel, that they turned toward the wilderness, and behold[b], the glory of Yahweh appeared in the cloud.
translation:
  language: sw
  text: Ikawa, Haruni alipokuwa akilihutubia kusanyiko lote la wana wa Israeli[a], wakageukia upande wa nyika; na tazama, utukufu wa Yahweh ukaonekana katika wingu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusanyiko lote la Waisraeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya masimulizi inayoanzisha tukio linalofuata; “Ikawa” huhifadhi mtiririko wa Kiebrania kwa lugha ya Kiswahili yenye hadhi.
- source_word: כְּדַבֵּר
  choice: alipokuwa akizungumza
  rationale: Kiambishi כְּ pamoja na kitenzi-jina huonyesha kwamba matukio yalifanyika kwa wakati mmoja; usemi huu unaonyesha kuwa watu waligeuka Haruni akiwa bado anazungumza.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: kusanyiko lote la wana wa Israeli
  rationale: עֵדָה ni jumuiya iliyokusanyika, na בְּנֵי יִשְׂרָאֵל limetafsiriwa kwa uwazi wa kimuundo kuwa “wana wa Israeli,” huku mbadala wa kawaida zaidi ukiwekwa katika tanbihi.
- source_word: וַיִּפְנוּ אֶל הַמִּדְבָּר
  choice: wakageuka kuelekea nyikani
  rationale: פנה pamoja na אֶל huonyesha kugeuka katika mwelekeo wa kitu; “kuelekea” huepuka kudokeza kwamba waliingia nyikani.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Neno hili huvuta fikira kwa ghafla kwenye jambo linalofuata; “tazama” huhifadhi nguvu yake ya balagha na uzito wa simulizi.
- source_word: כְּבוֹד יְהוָה
  choice: utukufu wa Yahwe
  rationale: כָּבוֹד hapa ni utukufu wa Mungu unaodhihirika, na jina la agano יְהוָה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: נִרְאָה
  choice: ukaonekana
  rationale: Nifali ya ראה inaweza kumaanisha “ukaonekana” au “ukadhihirika”; “ukaonekana” ni ya kawaida na pia haiufuti kabisa mvutano huo wa maana.
- source_word: בֶּעָנָן
  choice: katika lile wingu
  rationale: Kihusishi kinaambatana na kibainishi, hivyo wingu ni maalumu na linaelekea kuwa wingu linalojulikana katika simulizi; “lile” huonyesha umaalumu huo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Tafsiri kuu huhifadhi muundo wa kifamilia wa Kiebrania. Kwa kuwa kirai hicho pia hutaja taifa lote, “Waisraeli” limetolewa kama mbadala katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa simulizi “Ikawa” na mwito “tazama” huhifadhi ladha ya maandishi ya Kiebrania bila kutumia lugha nzito isiyo ya lazima.
