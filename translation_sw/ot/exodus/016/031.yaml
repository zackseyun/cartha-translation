lexical_decisions:
- source_word: וַיִּקְרְאוּ בֵית יִשְׂרָאֵל
  choice: Nyumba ya Israeli ikakiita
  rationale: Yahifadhi usemi wa Kiebrania wa kijumuiya ‘nyumba ya Israeli’ na kitenzi cha kukipa kitu jina, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: אֶת־שְׁמוֹ
  choice: chakula hicho
  rationale: Kiebrania kina maana halisi ya ‘jina lake’; katika Kiswahili, ‘kukiiita chakula hicho’ hutoa maana ya tendo la kukipa jina bila utata wa kiwakilishi.
- source_word: מָן
  choice: mana
  rationale: Hili ndilo umbo la jadi la Kiswahili la jina la chakula cha jangwani; tanbihi inaonyesha umbo la Kiebrania man.
- source_word: כְּזֶרַע גַּד לָבָן
  choice: kama mbegu nyeupe ya giligilani
  rationale: גַּד kwa kawaida hutambuliwa kuwa giligilani; mpangilio huu unasomeka kwa kawaida na kudumisha ulinganisho pamoja na sifa ya weupe.
- source_word: וְטַעְמוֹ
  choice: na ladha yake
  rationale: ‘Ladha’ ni neno la kawaida na sahihi kwa טַעַם katika maelezo ya chakula.
- source_word: כְּצַפִּיחִת בִּדְבָשׁ
  choice: kama keki nyembamba zilizotiwa asali
  rationale: צַפִּיחִת huonyesha aina ya keki nyembamba; בִּדְבָשׁ inaeleweka hapa kwa uhusiano wa kiungo, yaani iliyotiwa au iliyotengenezwa kwa asali.
