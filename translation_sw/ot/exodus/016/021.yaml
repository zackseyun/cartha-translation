  text: Nao waliikusanya kila asubuhi, kila mmoja kadiri ya alivyoweza kula; lakini jua lilipopata joto, ikayeyuka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְקְטוּ אֹתוֹ
  choice: Nao waliikusanya
  rationale: Kitenzi לקט humaanisha kukusanya, hasa chakula; kiwakilishi cha yambwa kinadumisha rejeo la kitu kilichotajwa katika muktadha uliotangulia bila kuingiza jina jipya.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: kila asubuhi
  rationale: Urudiaji wa Kiebrania una maana ya tendo la kila siku. Kiswahili cha kawaida hueleza maana hiyo kwa njia ya asili kwa kusema “kila asubuhi” kuliko kurudia “asubuhi kwa asubuhi.”
- source_word: אִישׁ
  choice: kila mmoja
  rationale: 'Ingawa umbo la Kiebrania ni nomino ya kiume katika umoja, limetumiwa hapa kwa maana ya mgawanyo: kila mtu katika kundi. “Kila mmoja” ni ya asili na inadumisha maana hiyo bila kudai kwamba wanaume pekee ndio waliokusanya.'
- source_word: כְּפִי אָכְלוֹ
  choice: kadiri ya alivyoweza kula
  rationale: Nahau hiyo, kwa maana halisi karibu na “kwa kadiri ya kinywa cha kula kwake,” inaonyesha kiasi kinacholingana na uwezo au hitaji la kula. Tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: וְחַם הַשֶּׁמֶשׁ
  choice: lakini jua lilipopata joto
  rationale: 'Kitenzi kinaeleza jua kuwa au kupata joto, na mfuatano wa simulizi unaipa sentensi ndogo thamani ya wakati: jua lilipopata joto.'
- source_word: וְנָמָס
  choice: kikayeyuka
  rationale: מסס hapa humaanisha kuyeyuka. Kiambishi “ki-” kinarejelea kitu kilichokusanywa katika muktadha bila kukitaja moja kwa moja kama ambavyo Kiebrania hakifanyi.
