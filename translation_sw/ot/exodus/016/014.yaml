base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/014.yaml
  text: When the layer of dew had gone up[a], behold, on the surface of the wilderness was a fine, flaky thing, fine as frost on the ground.
translation:
  language: sw
  text: Tabaka la umande lilipopaa, tazama, juu ya uso wa nyika palikuwa na kitu chembamba, chenye chembechembe[a], chembamba kama barafu juu ya ardhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitu chembamba, kama vipande vidogo.” Neno la Kiebrania linalotafsiriwa “chenye chembechembe” ni adimu na maana yake halisi haijulikani kwa uhakika; huenda linaeleza umbile au mwonekano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: lilipoinuka
  rationale: Kitenzi עלה kimsingi humaanisha ‘kupanda/kuinuka.’ Hapa ‘lilipoinuka’ huhifadhi taswira ya Kiebrania bila kufafanua moja kwa moja kuwa umande ulivukiza.
- source_word: שִׁכְבַת הַטָּל
  choice: tabaka la umande
  rationale: שִׁכְבָה ni tabaka au kitu kilichotandaa; ‘tabaka la umande’ ni Kiswahili cha kawaida na hudumisha taswira ya kifuniko kilichotanda.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: הִנֵּה huvuta fikira kwenye jambo linaloonekana ghafla; ‘tazama’ huhifadhi msisitizo na uhai wa usimulizi.
- source_word: עַל פְּנֵי הַמִּדְבָּר
  choice: juu ya uso wa nyika
  rationale: פְּנֵי hapa ni ‘uso,’ na מִדְבָּר ni nyika; usemi huu huhifadhi sitiari ya chanzo huku ukieleweka kwa msomaji wa sasa.
- source_word: דַּק
  choice: chembamba
  rationale: דַּק yaweza kumaanisha chembamba au kidogo sana. ‘Chembamba’ inafaa katika sehemu zote mbili na kuhifadhi urudiaji wa chanzo.
- source_word: מְחֻסְפָּס
  choice: chenye chembechembe
  rationale: Neno hili adimu lina maana isiyo hakika, huenda likieleza umbile au mwonekano. ‘Chenye chembechembe’ hutoa maana inayowezekana bila kukifanya kuwa kitu maalumu kupita ushahidi.
- source_word: דַּק כַּכְּפֹר
  choice: chembamba kama sakafu
  rationale: כְּפֹר ni sakafu, yaani barafu nyembamba inayotokea ardhini. Tafsiri hii huhifadhi ulinganisho na urudiaji wa דַּק.
- source_word: עַל הָאָרֶץ
  choice: juu ya ardhi
  rationale: Katika muktadha huu אֶרֶץ inaelekeza kwenye ardhi iliyo chini; ‘juu ya ardhi’ ni ya kawaida na sahihi.
