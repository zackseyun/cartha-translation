lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni njia ya kawaida na yenye hadhi ya kuendeleza simulizi kwa wayyiqtol ya היה bila kutumia lugha nzito au ya kizamani.
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: siku ya sita
  rationale: Hutoa maana ya kirai cha wakati kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: לָקְטוּ
  choice: walikusanya
  rationale: Katika muktadha wa mana, kitenzi kinamaanisha kukusanya chakula kilichotolewa.
- source_word: לֶחֶם מִשְׁנֶה
  choice: mkate maradufu
  rationale: Hudumisha neno halisi 'mkate' na maana ya kiasi kilicho mara mbili, kwa usemi mfupi na wa asili.
- source_word: שְׁנֵי הָעֹמֶר
  choice: omeri mbili
  rationale: Kipimo cha kale kimetoholewa badala ya kubadilishwa kuwa kipimo cha kisasa kisicho sawa kabisa.
- source_word: לָאֶחָד
  choice: kwa kila mtu
  rationale: Huweka wazi maana gawanyishi ya kirai, yaani kiasi hicho kilikuwa kwa kila mtu mmoja mmoja.
- source_word: כָּל נְשִׂיאֵי הָעֵדָה
  choice: viongozi wote wa kusanyiko
  rationale: Nשיאים ni viongozi wanaotambuliwa, na עֵדָה hapa ni jumuiya iliyokusanyika; 'kusanyiko' ni wazi na halibebi maana ya dhehebu fulani.
- source_word: וַיָּבֹאוּ ... וַיַּגִּידוּ לְמֹשֶׁה
  choice: wakaja wakamweleza Musa
  rationale: 'Huhifadhi mfuatano wa vitendo viwili: walikuja, kisha wakamweleza Musa.'
