  text: And it happened on the sixth day that they gathered twice as much bread[a], two omers for each person, and all the leaders of the congregation came and told Moses.
translation:
  language: sw
  text: Ikawa kwamba siku ya sita walikusanya mkate maradufu, omeri mbili[a] kwa kila mtu, nao viongozi wote wa kusanyiko wakaja wakamweleza Musa.
  philosophy: optimal-equivalence
