  text: So the people rested on the seventh day[a].
translation:
  language: sw
  text: Basi watu wakapumzika siku ya saba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walikoma”; kitenzi hiki kinahusiana na pumziko la Sabato, kwa hiyo “waliishika Sabato” ni tafsiri yenye ufafanuzi ulioongezwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: wakapumzika
  rationale: Kitenzi שׁבת katika qal kina maana ya msingi ya kuacha shughuli au kupumzika. Katika muktadha huu, “wakapumzika” ni Kiswahili cha kawaida kinachowasilisha tendo hilo bila kupanua maana kuwa “wakaishika Sabato.”
- source_word: הָעָם
  choice: watu
  rationale: עָם hapa ni kundi la watu wa Israeli; “watu” ni tafsiri ya kawaida na ya asili katika simulizi hili.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: siku ya saba
  rationale: Muundo huu wa Kiswahili huonyesha kwa kawaida siku maalumu inayotajwa; kihusishi ב hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: וַ
  choice: Basi
  rationale: Waw ya usimulizi inaendeleza simulizi na hapa pia inaonyesha matokeo ya maagizo yaliyotangulia. “Basi” huwasilisha mtiririko huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Iwapo maana ya Sabato ifanywe wazi ndani ya kitenzi
  choice: wakapumzika
  alternative: wakaishika Sabato; wakaacha shughuli
  rationale: Kiebrania kinasema watu waliacha shughuli au walipumzika. Umuhimu wa Sabato unaeleweka kutokana na muktadha na maneno “siku ya saba,” hivyo tafsiri haiongezi kauli ya kiibada ambayo haijawekwa wazi katika kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye hadhi. “Wakapumzika” ni ya asili na hudumisha uhusiano wa muktadha na Sabato bila kufafanua kupita maandishi ya Kiebrania.
