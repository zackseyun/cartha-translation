base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/012.yaml
  text: I have heard the grumblings of the sons of Israel[a]. Speak to them, saying, ‘Between the evenings you shall eat meat, and in the morning you shall be filled with bread[b], and you shall know that I am Yahweh your God.’
translation:
  language: sw
  text: 'Nimesikia manung''uniko ya wana wa Israeli. Waambie hivi: ‘Wakati wa machweo[a] mtakula nyama, na asubuhi mtashiba kwa mkate; nanyi mtajua kwamba mimi ni Yahwe, Mungu wenu.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “kati ya jioni mbili”; ni nahau ya Kiebrania inayorejelea wakati wa machweo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Nimesikia
  rationale: Kauli timilifu ya nafsi ya kwanza inaonyesha kwamba kusikia huko kumetokea na bado ni muhimu katika jibu la Mungu.
- source_word: תְּלוּנֹּת
  choice: manung’uniko
  rationale: Neno hili linaonyesha kulalamika kwa kutoridhika na kurudiwa-rudiwa, si malalamiko ya kawaida tu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania ‘wana wa Israeli’ bila kuufanya kuwa jina la jumla lisiloonyesha umbo la asili.
- source_word: דַּבֵּר אֲלֵהֶם לֵאמֹר
  choice: Sema nao, ukiwaambia
  rationale: Huhifadhi utangulizi wa usemi wa Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בֵּין הָעַרְבַּיִם
  choice: Wakati wa machweo
  rationale: Hutoa maana ya kawaida ya nahau hiyo ya Kiebrania, huku tafsiri yake ya neno kwa neno ikielezwa katika tanbihi.
- source_word: תֹּאכְלוּ בָשָׂר
  choice: mtakula nyama
  rationale: Katika muktadha wa chakula, בָשָׂר ni ‘nyama’; umbo la wakati ujao linafaa kwa ahadi hii.
- source_word: תִּשְׂבְּעוּ לָחֶם
  choice: mtashiba mkate
  rationale: Kitenzi kina maana ya kushiba au kutosheka; ‘mtashiba mkate’ ni cha asili na huhifadhi taswira halisi.
- source_word: וִידַעְתֶּם
  choice: nanyi mtajua
  rationale: Huendeleza mfuatano wa Kiebrania na kuonyesha matokeo ya utoaji wa chakula.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ingawa umbo la neno linaweza kuonekana la wingi, hapa linamtaja Mungu wa Israeli kwa umoja katika uhusiano wa agano.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Chaguo hili huhifadhi umbo la kiume lililo wazi katika Kiebrania, huku ‘Waisraeli’ ikiwa tafsiri laini zaidi lakini isiyoonyesha muundo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Manung’uniko’ huhifadhi uzito wa kutoridhika; ‘wakati wa machweo’ ni wa kueleweka kwa msomaji wa kawaida, na tanbihi huhifadhi nahau ya asili.
