    reason: cross_reference
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Kwa siku sita
  rationale: Muundo huu unaonyesha muda wa siku sita na unasikika kwa kawaida katika Kiswahili cha maagizo.
- source_word: תִּלְקְטֻהוּ
  choice: mtaiokota
  rationale: Kitenzi לקט humaanisha kukusanya au kuokota; kiambishi cha nafsi ya pili wingi na kiambishi cha kitu cha nafsi ya tatu umoja vimehifadhiwa katika ‘mta-i-okota.’
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: lakini siku ya saba
  rationale: Ingawa waw inaweza kutafsiriwa ‘na,’ muktadha unaonyesha ulinganisho wa kupingana kati ya siku sita na siku ya saba; ‘lakini’ huuwasilisha kwa kawaida.
- source_word: שַׁבָּת
  choice: ni Sabato
  rationale: Nomino hii inaitambulisha siku ya saba kwa uhusiano wa maelezo. ‘Sabato’ huhifadhi neno la msingi bila kulipanua kuwa tu ‘siku ya kupumzika.’
- source_word: לֹא יִהְיֶה בּוֹ
  choice: siku hiyo haitakuwapo
  rationale: Kiebrania husema kihalisi ‘haitakuwapo ndani/juu yake.’ ‘Siku hiyo’ huonyesha wazi rejeo la kiwakilishi בּוֹ, huku kitu kisichokuwapo—mana—kikiachwa kueleweka kutokana na muktadha.
theological_decisions:
- issue: Maana ya שַׁבָּת kabla ya utoaji wa sheria huko Sinai
  choice: ni Sabato
  alternative: ni siku ya mapumziko
  rationale: ‘Sabato’ huhifadhi utambulisho wa neno la Kiebrania na uhusiano wake na ‘siku ya saba,’ bila kuingiza ufafanuzi mpana wa kiliturujia wala kupunguza maana yake kuwa mapumziko tu.
- issue: Kitu kisichokuwapo siku ya saba
  choice: Kimeachwa kudokezwa katika matini kuu na kufafanuliwa katika tanbihi kuwa ni mana
  alternative: mana haitakuwapo siku hiyo
  rationale: Kiebrania hakitaji tena mana katika kishazi hiki. Kuacha kiwakilishi cha kitenzi kirejelee muktadha huhifadhi ufupi na udokezo wa chanzo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Mtaiokota’ ni cha kawaida na huonyesha kwa pamoja nafsi ya pili wingi, wakati ujao, na kitu kinachorejelewa. Mpangilio wa tanbihi umefuata maneno yanayofafanuliwa: [a] baada ya ‘lakini,’ [b] baada ya ‘Sabato,’ na [c] baada ya kishazi cha kutokuwapo.'
