base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/026.yaml
  text: For six days you shall gather it[a], but on the seventh day, a Sabbath[c][b], there will be none.
translation:
  language: sw
  text: Kwa siku sita mtaiokota, lakini[a] siku ya saba ni Sabato[b]; haitakuwapo siku hiyo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa kwa urahisi kuwa “na,” ingawa hapa muktadha unaonyesha tofauti.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “siku ya saba, Sabato.”
    reason: lexical_alternative
  - marker: c
