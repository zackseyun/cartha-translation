  text: And the sons of Israel did so[a], and they gathered, some more and some less.
translation:
  language: sw
  text: Wana wa Israeli wakafanya hivyo; wakakusanya, wengine mengi na wengine machache.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa muundo rasmi zaidi, “yule aliyekusanya mengi na yule aliyekusanya machache.”
