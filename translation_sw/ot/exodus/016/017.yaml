lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: wakafanya hivyo
  rationale: Kirai hiki kinarejelea kutekeleza agizo lililotangulia; ‘wakafanya hivyo’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Inahifadhi taswira ya kifamilia ya Kiebrania ‘wana wa Israeli’ badala ya kuibadili kuwa jina la kitaifa pekee.
- source_word: וַיִּלְקְטוּ
  choice: wakakusanya
  rationale: Kitenzi לקט hapa humaanisha kukusanya chakula; ‘wakakusanya’ ni cha asili katika muktadha wa mana.
- source_word: הַמַּרְבֶּה
  choice: huyu nyingi
  rationale: Kinawakilisha kishiriki kilichotumiwa kama nomino, yaani mtu aliyekusanya kiasi kingi, huku kikidumisha ulinganifu na kishiriki kinachofuata.
- source_word: הַמַּמְעִיט
  choice: huyu chache
  rationale: Kinawakilisha mtu aliyekusanya kiasi kidogo na kuhifadhi tofauti ya kimakusudi kati ya kingi na kichache.
