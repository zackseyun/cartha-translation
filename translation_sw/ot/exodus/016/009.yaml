  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן אֱמֹ֗ר אֶֽל כָּל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל קִרְב֖וּ לִ/פְנֵ֣י יְהוָ֑ה כִּ֣י שָׁמַ֔ע אֵ֖ת תְּלֻנֹּתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/009.yaml
  text: Then Moses said to Aaron[a], “Say to all the congregation of the sons of Israel, ‘Come near before Yahweh[b], for he has heard your grumblings.’”
translation:
  language: sw
  text: Kisha Musa akamwambia Haruni, “Liambie kusanyiko lote la Waisraeli, ‘Karibieni mbele za Yahweh, kwa maana amesikia manung’uniko yenu.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa masimulizi unaendeleza tukio kwa mpangilio; “Kisha” ni wa kawaida katika Kiswahili na kiambishi -mw- kinaonyesha kuwa Musa alimwambia Haruni.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: kusanyiko lote la Waisraeli
  rationale: עֵדָה humaanisha jumuiya iliyokusanyika, huku “Waisraeli” ikitoa kwa Kiswahili cha kawaida maana ya nahau ya Kiebrania “wana wa Israeli” bila kuifanya ihusu wanaume pekee.
- source_word: קִרְבוּ
  choice: Karibieni
  rationale: Amri ya wingi inawaita watu wakaribie; “Karibieni” ni ya asili na inaweka wazi tendo la kusogea karibu.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: “Mbele za” huhifadhi maana ya kuwa mbele ya au katika uwepo wa Mungu, na Yahweh huhifadhi jina binafsi la Kiebrania.
- source_word: כִּי שָׁמַע
  choice: kwa maana amesikia
  rationale: כִּי inatoa sababu ya mwito, na hali timilifu “amesikia” huonyesha tendo lililotimia lenye umuhimu kwa hali ya sasa.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: manung’uniko yenu
  rationale: Neno hili linaashiria kulalamika kwa kunung’unika, mara nyingi likiwa na uzito wa ukaidi; “manung’uniko” huhifadhi maana hiyo vizuri kuliko “malalamiko” pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Andiko la Kiebrania linatumia Tetragramatoni kama jina binafsi; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kusanyiko lote la Waisraeli” ni wazi kwa wasomaji wa kawaida, na “mbele za Yahweh” huhifadhi mtindo wa kibiblia bila kuwa wa kizamani kupita kiasi.
