  yaml_path: translation/ot/exodus/016/034.yaml
  text: As Yahweh commanded Moses[a], so Aaron placed it before the testimony for safekeeping.
translation:
  language: sw
  text: Kama Yahwe alivyomwamuru Musa, ndivyo Aroni alivyokiweka mbele ya Ushuhuda[a] ili kihifadhiwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele ya ushuhuda wa agano.” Neno la Kiebrania “ushuhuda” ni istilahi maalumu inayotumiwa kuhusu hema takatifu; linaweza kumaanisha hasa vibao vya agano au kile kinachohusishwa navyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Kama ... ndivyo
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida na kwa wazi kwamba Aroni alitenda sawasawa na alivyoamriwa Musa.
- source_word: צִוָּה
  choice: alivyomwamuru
  rationale: Kitenzi “kuamuru” kinadumisha mamlaka ya agizo la Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa jina la agano la Mungu lililoandikwa moja kwa moja katika Kiebrania.
- source_word: אֶל מֹשֶׁה
  choice: Musa
  rationale: Katika Kiswahili, mtendewa huunganishwa kwa kawaida katika kitenzi “alimwamuru Musa,” bila kuhitaji kihusishi tofauti.
- source_word: וַיַּנִּיחֵהוּ
  choice: Aroni alivyokiweka
  rationale: “Kukiweka” ni usemi wa kawaida wa kuweka kitu mahali palipokusudiwa; kiambishi cha kitu kinarejelea kile kilichowekwa katika muktadha uliotangulia.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Linahifadhi maana ya mahali bila kuongeza maelezo ambayo hayamo katika maandishi.
- source_word: הָעֵדֻת
  choice: Ushuhuda
  rationale: Neno hili linahifadhi istilahi maalumu ya hema takatifu na halilazimishi uamuzi kwamba linamaanisha mbao za agano pekee au kitu kinachohusiana nazo.
- source_word: לְמִשְׁמָרֶת
  choice: ili kihifadhiwe
  rationale: Linaeleza kusudi la kuwekwa kwa kitu hicho kwa Kiswahili cha kawaida bila kuongeza wazo la ukumbusho lisilotajwa wazi hapa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina יהוה moja kwa moja; “Yahwe” linadumisha rejeo la jina la agano badala ya kulibadili kuwa cheo.
- issue: Maana ya istilahi הָעֵדֻת
  choice: Ushuhuda
  alternative: ushuhuda wa agano
  rationale: “Ushuhuda” linadumisha upana na mvutano wa istilahi ya kiibada ya Kiebrania, ambayo inaweza kumaanisha hasa mbao za agano au kile kinachohusishwa nazo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “Kama ... ndivyo ...” unatoa ulinganifu wa asili, na herufi kubwa katika “Ushuhuda” inaashiria matumizi yake kama istilahi maalumu ya kiibada bila kuifafanua kupita kiasi.
