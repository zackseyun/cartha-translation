base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/033.yaml
  text: And Moses said to Aaron[a], “Take one jar, and put an omerful of manna in it, and place it before Yahweh, to be kept throughout your generations.”
translation:
  language: sw
  text: Musa akamwambia Aroni, “Chukua chombo kimoja[a], utie ndani yake omeri moja kamili ya mana, kisha uweke mbele ya Yahweh ili ihifadhiwe kwa vizazi vyenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtungi”; neno la Kiebrania linamaanisha chombo cha kuhifadhia.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנְצֶנֶת
  choice: chombo
  rationale: Nomino hii hutaja chombo cha kuhifadhia bila kubainisha kwa hakika umbo au nyenzo yake. “Chombo” ni Kiswahili cha kawaida na huhifadhi upana huo wa maana.
- source_word: מְלֹא הָעֹמֶר
  choice: kiasi cha kuijaza omeri
  rationale: מְלֹא huonyesha ujazo kamili, na עֹמֶר ni kipimo cha vitu vikavu. Usemi huu ni wa asili kwa Kiswahili na huhifadhi wazo la omeri iliyojaa.
- source_word: מָן
  choice: mana
  rationale: Hili ndilo umbo la jina hili lililozoeleka katika Kiswahili cha Biblia.
- source_word: וְתֶן שָׁמָּה
  choice: utie ndani yake
  rationale: Ingawa שָׁמָּה kihalisi ni “humo/huko,” muktadha unaonyesha wazi kuwa mana itiwe ndani ya chombo kilichotajwa; tafsiri hii ni wazi na ya kawaida.
- source_word: וְהַנַּח אֹתוֹ
  choice: kisha ukiweke
  rationale: Kitenzi kina maana ya kuweka au kutua kitu mahali. Kiwakilishi kinaweza kurejelea chombo chenye mana, hivyo umoja umehifadhiwa.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: “Mbele za” huwasilisha maana ya kuwa mbele au katika uwepo wa, huku jina la Mungu likitafsiriwa moja kwa moja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: לְמִשְׁמֶרֶת
  choice: ili kihifadhiwe
  rationale: Nomino hii huonyesha kusudi la kutunza au kuhifadhi; muundo huu wa Kiswahili unaeleza kusudi hilo kwa uwazi.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Usemi huu unaonyesha uhifadhi unaoendelea katika vizazi vinavyofuatana.
- source_word: קַח ... אַחַת
  choice: Chukua chombo kimoja
  rationale: Namba “kimoja” huhifadhi msisitizo wa kuchukua chombo kimoja.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Kitu kinachowekwa na kuhifadhiwa mbele za Yahweh
  choice: Kiwakilishi cha umoja kinarejelea chombo chenye mana
  alternative: Kukitaja wazi kuwa ni chombo au mana
  rationale: Kiebrania kinatumia kiwakilishi cha umoja bila kutaja tena nomino. Tafsiri inadumisha muundo huo bila kulazimisha ufafanuzi usiotolewa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Omeri” imehifadhiwa kama jina la kipimo cha kale, huku “kiasi cha kuijaza” kikifafanua kuwa ni ujazo kamili.
