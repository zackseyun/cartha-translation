base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/035.yaml
  text: And the sons of Israel ate the manna forty years[a], until they came to an inhabited land[c][b]; they ate the manna until they came to the border of the land of Canaan.
translation:
  language: sw
  text: Waisraeli walikula mana kwa miaka arobaini[a], mpaka walipofika katika nchi inayokaliwa na watu[b]; walikula mana mpaka walipofika kwenye mpaka wa nchi ya Kanaani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wana wa Israeli.” Kiebrania kinasema kihalisi “wana wa Israeli,” jina la kawaida la watu wa Israeli katika maandiko ya agano.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika nchi yenye makazi.” Kauli hii inatofautisha jangwa na nchi inayofaa kukaliwa na watu.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwenye ukingo wa nchi ya Kanaani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Hili ni jina la kawaida la agano kwa watu wa Israeli. Ingawa maana ya neno kwa neno ni ‘wana wa Israeli,’ ‘Waisraeli’ ni Kiswahili cha kawaida, sahihi, na kinachowahusisha watu wote; umbo halisi linaelezwa katika tanbihi.
- source_word: אָכְלוּ
  choice: walikula
  rationale: Qal timilifu nafsi ya tatu wingi hapa inatoa muhtasari wa tendo la wakati uliopita; ‘walikula’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: הַמָּן
  choice: mana
  rationale: ‘Mana’ ndilo neno lililozoeleka katika Kiswahili kwa chakula hiki cha jangwani. Kiswahili hakihitaji kibainishi cha pekee kinacholingana na הַ hapa.
- source_word: אַרְבָּעִים שָׁנָה
  choice: kwa miaka arobaini
  rationale: Kirai hiki kinaonyesha muda; ‘kwa miaka arobaini’ ni namna ya asili ya Kiswahili ya kueleza kipindi hicho.
- source_word: עַד בֹּאָם
  choice: mpaka walipofika
  rationale: עַד pamoja na kitenzi-jina chenye kiambishi cha nafsi huweka kikomo cha wakati. ‘Mpaka walipofika’ huhifadhi maana ya ‘kuja/kufika’ bila kuongeza dhana ya kuingia.
- source_word: אֶל אֶרֶץ נוֹשָׁבֶת
  choice: katika nchi yenye watu waliokaa
  rationale: נוֹשָׁבֶת inaeleza nchi iliyokaliwa au yenye makazi, kinyume na jangwa. Kauli hii inaeleweka kwa urahisi katika Kiswahili cha sasa na huhifadhi wazo la nchi inayokaliwa.
- source_word: עַד בֹּאָם אֶל קְצֵה אֶרֶץ כְּנָעַן
  choice: mpaka walipofika kwenye mpaka wa nchi ya Kanaani
  rationale: קְצֵה inaweza kumaanisha ukingo, mwisho, au mpaka. Katika muktadha wa kijiografia, ‘mpaka’ ni chaguo la kawaida na wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Marudio ya ‘walikula mana’ yamehifadhiwa kwa sababu yapo katika Kiebrania. Alama za tanbihi zimewekwa karibu na vipashio vinavyohusika na zimepangwa kwa mfuatano wa a, b, c.
