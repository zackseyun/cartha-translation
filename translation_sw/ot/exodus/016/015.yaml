base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/015.yaml
  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
translation:
  language: sw
  text: Wana wa Israeli walipokiona, wakasema wao kwa wao[a], “Ni nini hiki?”[b] kwa maana hawakujua kilikuwa nini. Musa akawaambia, “Huu ndio mkate ambao Yahweh amewapa ili mle.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, Kiebrania husema, “mtu kwa ndugu yake.” Huu ni usemi unaomaanisha “wao kwa wao.”
    reason: lexical_alternative
  - marker: b
    text: Usemi wa Kiebrania uliotafsiriwa “Ni nini hiki?” kwa mapokeo unahusianishwa na jina “mana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Hufuata muundo wa Kiebrania kwa karibu huku ikiwa kauli ya kawaida na yenye heshima katika Kiswahili.
- source_word: אִישׁ אֶל־אָחִיו
  choice: wakaambiana
  rationale: Usemi huu wa Kiebrania, kwa neno halisi ‘mtu kwa ndugu yake,’ una maana ya kutendeana; ‘wakaambiana’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: מָן הוּא
  choice: Ni nini hiki?
  rationale: Katika muktadha huu מָן ni usemi wa kuuliza, kama inavyothibitishwa na maelezo yanayofuata kwamba hawakujua kilikuwa nini. Tafsiri hii pia huhifadhi nafasi ya kueleza uhusiano wa kimapokeo na jina ‘mana’ katika tanbihi.
- source_word: לֹא יָדְעוּ מַה הוּא
  choice: hawakujua kilikuwa nini
  rationale: Ni uwasilishaji wa moja kwa moja na wa kawaida wa maelezo ya Kiebrania kuhusu kutokijua kitu hicho.
- source_word: הוּא הַלֶּחֶם
  choice: Huo ndio mkate
  rationale: Kauli hii inakitambulisha kitu walichokiona kuwa mkate; ‘huo ndio’ ni Kiswahili cha kawaida kinachodumisha mkazo wa utambulisho.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: לָכֶם לְאָכְלָה
  choice: amewapa ili mle
  rationale: 'Huwasilisha walengwa wa zawadi na kusudi lake kwa Kiswahili cha kawaida: walipewa ili wale.'
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko lina jina la Mungu moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Iwapo מָן litumike kama jina maalumu ‘mana’ katika matini kuu
  choice: 'Kutafsiri kama swali: ‘Ni nini hiki?’'
  alternative: Kutumia ‘mana’ moja kwa moja katika matini kuu
  rationale: Kishazi kinachofuata kinaeleza kwamba hawakujua kitu hicho kilikuwa nini, hivyo hapa usemi huo hufanya kazi kama swali. Kutumia jina ‘mana’ mapema kungeficha mtiririko na mchezo wa maneno wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi umehifadhiwa bila kufanya neno מָן kuwa jina maalumu kabla ya wakati wake.
