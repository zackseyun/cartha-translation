  yaml_path: translation/ot/exodus/016/020.yaml
  text: But they did not listen to Moses[a], and some men left some of it until morning, and it bred worms and stank[b]; and Moses was angry with them.
translation:
  language: sw
  text: Lakini hawakumsikiliza Musa[a], na baadhi ya wanaume wakaacha sehemu yake mpaka asubuhi. Funza wakatokea, nayo ikanuka[b]; Musa akawakasirikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakumtii Musa.” Kiebrania kinaweza kumaanisha kukataa kusikiliza kwa namna inayoonyesha kutotii.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “funza wakatokea ndani yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֶל מֹשֶׁה
  choice: hawakumsikiliza Musa
  rationale: Kitenzi שׁמע pamoja na אֶל kina maana ya kumsikiliza au kumtii mtu. Kiswahili ‘hawakumsikiliza’ kinadumisha maana ya moja kwa moja huku muktadha ukionyesha kutotii.
- source_word: וַיּוֹתִרוּ
  choice: wakaacha sehemu yake
  rationale: Hifili ya יתר humaanisha kuacha sehemu ibaki. Usemi huu ni wa kawaida na unaonyesha kuwa kiasi fulani kilihifadhiwa kinyume na agizo.
- source_word: אֲנָשִׁים
  choice: baadhi ya wanaume
  rationale: Nomino ni ya wingi wa kiume, na hapa inaonyesha kundi lisilobainishwa kutoka miongoni mwao.
- source_word: מִמֶּנּוּ
  choice: sehemu yake
  rationale: Kiwakilishi kinarejelea mana; ‘sehemu yake’ huwasilisha kwa Kiswahili cha kawaida maana ya kuacha kiasi fulani cha mana.
- source_word: עַד בֹּקֶר
  choice: mpaka asubuhi
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kikomo cha wakati kwa usahihi.
- source_word: וַיָּרֻם תּוֹלָעִים
  choice: ikajaa funza
  rationale: Kwa muktadha, רום inaeleza funza kutokea au kuongezeka ndani ya mana. ‘Ikajaa funza’ ni ya asili na yenye picha wazi, huku tanbihi ikihifadhi muundo halisi zaidi.
- source_word: וַיִּבְאַשׁ
  choice: na kunuka
  rationale: Kitenzi kinamaanisha kunuka au kuwa na harufu mbaya. ‘Kunuka’ ni cha moja kwa moja na chenye nguvu inayofaa simulizi.
- source_word: וַיִּקְצֹף עֲלֵהֶם
  choice: Musa akawakasirikia
  rationale: קצף hueleza hasira, na kiambishi katika ‘akawakasirikia’ kinawasilisha kwa ufasaha kwamba hasira hiyo iliwaelekea wao bila kuzidisha kiwango chake.
