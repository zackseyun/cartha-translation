base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/018.yaml
  text: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
translation:
  language: sw
  text: Walipoipima kwa kipimo cha omeri, aliyekusanya kwa wingi hakuwa na ziada, na aliyekusanya kidogo hakukosa chochote[a]; kila mmoja alikusanya kwa kadiri ya alivyoweza kula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyekuwa na vingi hakuwa na ziada, na aliyekuwa na vichache hakukosa chochote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמֹדּוּ בָעֹמֶר
  choice: Walipoipima kwa kipimo cha omeri
  rationale: Muundo wa wakati unaonyesha kuwa matokeo yaliyofuata yalionekana walipopima. ‘Kipimo cha omeri’ kinaweka wazi kwamba omeri ni kipimo cha vitu vikavu bila kukibadili kuwa kipimo cha kisasa.
- source_word: הַמַּרְבֶּה לֹא הֶעְדִּיף
  choice: aliyekusanya kwa wingi hakuwa na ziada
  rationale: Katika muktadha wa kukusanya mana, kiambishi cha kushiriki הַמַּרְבֶּה kinamaanisha aliyekusanya kwa wingi, na הֶעְדִּיף huonyesha kutokuwa na ziada baada ya kupima.
- source_word: וְהַמַּמְעִיט לֹא הֶחְסִיר
  choice: na aliyekusanya kidogo hakupungukiwa
  rationale: Kauli hii inadumisha ulinganifu wa Kiebrania na kueleza kwamba aliyekusanya kiasi kidogo hakukosa kiasi alichohitaji.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: 'Neno hili lina nguvu ya ugawaji hapa: kila mtu mmoja mmoja katika kundi, bila kudokeza kuwa wanaume watu wazima pekee ndio wanaohusika.'
- source_word: לְפִי אָכְלוֹ
  choice: kulingana na kiasi alichoweza kula
  rationale: Nahau halisi ‘kwa kadiri ya kula kwake’ inaeleza kiasi kinachofaa kwa matumizi ya mtu; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: לָקָטוּ
  choice: alikusanya
  rationale: Kitenzi hiki ndicho kinachotumiwa kwa tendo la kukusanya mana, na umoja wa kisarufi unafuatana na ‘kila mmoja.’
theological_decisions:
- issue: Umoja wa kiume wenye maana ya ugawaji katika אִישׁ ... אָכְלוֹ
  choice: kila mmoja ... alichoweza kula
  alternative: kila mtu ... walichoweza kula
  rationale: Kiebrania kinatumia umoja wa kiume kwa maana ya kila mtu mmoja mmoja. Kiswahili ‘kila mmoja’ na umoja wa kisarufi vinahifadhi nguvu hiyo bila kuifanya kauli iwahusu wanaume pekee.
- issue: Je, participles הַמַּרְבֶּה na הַמַּמְעִיט zinaeleza kukusanya au kuwa na kiasi
  choice: aliyekusanya kwa wingi ... aliyekusanya kidogo
  alternative: aliyekuwa na vingi ... aliyekuwa na vichache
  rationale: Maana ya kukusanya inadokezwa wazi na simulizi na kitenzi לָקָטוּ mwishoni, lakini mbadala wa kimuundo wa ‘kuwa na’ umehifadhiwa katika tanbihi ili kutoficha uwezekano wa usemi wa karibu zaidi na umbo la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Omeri’ imehifadhiwa kama jina la kipimo cha kale na kufafanuliwa ndani ya sentensi kama kipimo.
