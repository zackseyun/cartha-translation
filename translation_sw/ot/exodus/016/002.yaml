  text: ו/ילינו כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן בַּ/מִּדְבָּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/002.yaml
  text: And the whole congregation of the sons of Israel grumbled against Moses and against Aaron in the wilderness[a].
translation:
  language: sw
  text: Kusanyiko lote la wana wa Israeli[a] likanung’unika dhidi ya Musa na dhidi ya Aroni jangwani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli”; kwa mapokeo, “watoto wa Israeli.”
    reason: Mbadala hizi zinaonyesha kwamba בְּנֵי יִשְׂרָאֵל ni jina la pamoja la watu wa Israeli, ingawa kwa muundo wa karibu zaidi linaweza kutafsiriwa ‘wana wa Israeli.’
lexical_decisions:
- source_word: וַיִּלּוֹנוּ
  choice: likanung’unika
  rationale: Kitenzi hiki katika muktadha huu kinaonyesha manung’uniko ya pamoja yenye upinzani dhidi ya viongozi. ‘Likanung’unika’ ni Kiswahili cha sasa, cha kawaida, na kinahifadhi maana hasi ya tendo hilo.
- source_word: כָּל עֲדַת
  choice: kusanyiko lote
  rationale: ‘Lote’ linaonyesha ujumla unaosisitizwa na כָּל, na ‘kusanyiko’ linahifadhi wazo la jumuiya ya Israeli kama kundi lililokusanyika.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: ‘Wana wa Israeli’ linafuata kwa karibu muundo wa Kiebrania huku likibaki wazi na lenye hadhi katika Kiswahili. Uwezekano wa kulitafsiri kama jina la jumla la watu umewekwa katika tanbihi.
- source_word: עַל ... וְעַל
  choice: dhidi ya Musa na dhidi ya Aroni
  rationale: Kurudiwa kwa ‘dhidi ya’ kunaakisi kurudiwa kwa עַל na kuonyesha wazi kwamba Musa na Aroni wote wawili walilengwa na manung’uniko hayo.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: ‘Jangwani’ ni usemi wa kawaida wa Kiswahili kwa eneo lisilokaliwa au nyika katika simulizi hili, bila kulazimisha maana ya jangwa la mchanga pekee.
theological_decisions:
- issue: Uwakilishi wa jina la pamoja בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Chanzo kinatumia muundo wa kifamilia unaomaanisha watu wa agano kwa pamoja. Tafsiri kuu inahifadhi taswira hiyo bila kuibadili kimya kimya kuwa jina la kikabila, huku tanbihi ikitoa tafsiri mbadala za kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ‘likanung’unika’ umechaguliwa kuendeleza mfuatano wa matukio.
