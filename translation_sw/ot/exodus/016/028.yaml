  verdict: revise
  source_fidelity: The draft accurately represents the narrative transition, Yahweh's direct address to Moses, the plural audience, the rhetorical 'how long,' and the pairing of commandments with torot. However, 'mtakataa' is future tense, whereas the Hebrew perfect מֵאַנְתֶּם rebukes refusal already displayed and continuing in the present context. 'Mmekataa ... mpaka lini?' gives the natural Swahili rhetorical rebuke without shifting it into a merely future question.
  naturalness: The revised wording is idiomatic Standard East African Swahili and retains an elevated but current scriptural register. 'Kushika amri ... na sheria' is established, understandable biblical usage.
  terminology: Yahweh is retained as specified. 'Amri zangu' and 'sheria zangu' appropriately render מִצְוֺתַי and וְתוֹרֹתָי. The footnote properly preserves 'maagizo yangu' as a valid lexical alternative for torot.
  issues:
  - severity: medium
    issue: The main-text verb 'mtakataa' is future tense.
    rationale: מֵאַנְתֶּם is a second-person masculine plural perfect, expressing their refusal to date in this rebuke. In Swahili, 'Mmekataa ... mpaka lini?' naturally conveys the continuing, reproachful sense; 'Mtakataa' can imply that the refusal lies only in the future.
