base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/028.yaml
  text: Then Yahweh said to Moses[a], “How long will you refuse to keep my commandments and my laws?”
translation:
  language: sw
  text: Ndipo Yahweh akamwambia Musa, “Mmekataa kushika amri zangu na sheria zangu[a] mpaka lini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maagizo yangu.” Neno la Kiebrania torot (wingi wa torah) linaweza kumaanisha maagizo yenye mamlaka pamoja na sheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Mfuatano wa kitenzi unasogeza simulizi mbele; “Ndipo” na umbo la -ka- vinaonyesha kwa njia ya kawaida ya Kiswahili kwamba usemi huu ulifuata tukio lililotangulia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: עַד אָנָה
  choice: mpaka lini
  rationale: Hii ni nahau ya kuuliza muda ambao ukaidi utaendelea; “mpaka lini” ni Kiswahili cha kawaida na chenye nguvu inayofaa katika karipio.
- source_word: מֵאַנְתֶּם
  choice: mtakataa
  rationale: Kitenzi kina maana ya kukataa au kutokuwa tayari. Wingi wa nafsi ya pili umehifadhiwa, na wakati ujao katika swali “mtakataa ... mpaka lini?” unaonyesha ukaidi unaoendelea bila kuufanya kuwa taarifa ya wakati ujao tu.
- source_word: לִשְׁמֹר
  choice: kuzishika
  rationale: Katika muktadha wa amri, שׁמר humaanisha kuzitii au kuzifuata. “Kuzishika” huhifadhi picha ya msingi na ni matumizi yanayoeleweka katika Kiswahili cha Biblia.
- source_word: מִצְוֺתַי
  choice: amri zangu
  rationale: Nomino hii inataja maagizo yenye mamlaka; “amri” ni ya kawaida, wazi, na inafaa sajili ya agano na sheria.
- source_word: וְתוֹרֹתָי
  choice: na sheria zangu
  rationale: Katika usambamba na “amri zangu,” “sheria zangu” huonyesha nguvu ya lazima ya תּוֹרָה. Maana pana ya mafundisho au maagizo imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; “Yahweh” huhifadhi jina hilo la agano badala ya kuliwakilisha kwa cheo.
- issue: Maana ya תּוֹרָה katika wingi wenye kiambishi cha nafsi ya kwanza
  choice: sheria zangu
  alternative: maagizo yangu
  rationale: Muktadha wa karipio na usambamba na “amri” unaunga mkono “sheria,” lakini neno hilo la Kiebrania pia linaweza kumaanisha mafundisho au maagizo yenye mamlaka. Uwezekano huo haujafutwa, bali umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida kwa msomaji wa leo. Mpangilio wa swali umefanywa wa asili katika Kiswahili, huku wingi wa wanaokaripiwa na nguvu ya swali la balagha vikihifadhiwa. Alama ya tanbihi imewekwa baada ya “sheria zangu,” ambako tofauti ya kileksika inahusika.
