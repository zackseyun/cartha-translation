  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ וְ/אַהֲרֹ֔ן אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל עֶ֕רֶב וִֽ/ידַעְתֶּ֕ם כִּ֧י יְהוָ֛ה הוֹצִ֥יא אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/006.yaml
  text: Then Moses and Aaron said to all the sons of Israel[a], “At evening you will know that Yahweh brought you out from the land of Egypt.”
translation:
  language: sw
  text: Kisha Musa na Aroni wakawaambia Waisraeli wote[a], “Jioni mtajua kwamba Yahwe aliwatoa katika nchi ya Misri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni kihalisi “wana wote wa Israeli”; pia inaweza kutafsiriwa “watoto wote wa Israeli.” Usemi huo hapa unamaanisha Waisraeli wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... wakawaambia
  rationale: Waw-consecutive inaendeleza simulizi. “Kisha” huonyesha mfuatano kwa Kiswahili cha sasa; kitenzi cha wingi kinakubaliana kwa kawaida na kiima ambatano “Musa na Aroni,” na kiambishi -wa- kinawakilisha walengwa wa usemi.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Musa na Aroni
  rationale: Majina ya kibiblia yaliyozoeleka katika Kiswahili Sanifu.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli wote[a]
  rationale: Ingawa בְּנֵי יִשְׂרָאֵל ni “wana wa Israeli” kihalisi, “Waisraeli wote” ni usemi wa kawaida na wazi unaorejelea watu wote wa Israeli bila kudokeza kwamba ni wanaume pekee. Tanbihi inahifadhi umbo la Kiebrania.
- source_word: עֶרֶב
  choice: Jioni
  rationale: Nomino hii imetumiwa kwa maana ya wakati. “Jioni” ni fupi, ya kawaida, na haiingizi kwa lazima neno “leo,” ambalo halipo katika Kiebrania.
- source_word: וִידַעְתֶּם
  choice: mtajua
  rationale: Huwasilisha moja kwa moja maana ya wakati ujao ya kitenzi cha nafsi ya pili wingi.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי inaanzisha maudhui ya jambo watakalolijua, hivyo “kwamba” linaonyesha uhusiano huo kwa uwazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu linahifadhiwa kwa unukuzi wa Kiswahili badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: הוֹצִיא אֶתְכֶם
  choice: ndiye aliyewatoa
  rationale: Hifili ya יצא humaanisha “kutoa/kuleta nje.” Muundo “ndiye aliyewatoa” ni wa asili katika Kiswahili na unahifadhi mkazo wa kiwakilishi הוּא, ‘yeye ndiye,’ huku ukirejelea tukio lililokwisha kutokea.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Pamoja na kitenzi “kuwatoa,” kihusishi “katika” huunda usemi wa kawaida “kuwatoa katika nchi ya Misri” na kuhifadhi אֶרֶץ, ‘nchi.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina Tetragramatoni yenyewe. “Yahwe” huhifadhi jina la agano badala ya kulibadilisha na cheo; “Yehova” ni umbo la jadi lakini halikaribii sawa ushahidi wa matamshi ya jina.
- issue: Mkazo wa יְהוָה הוּא
  choice: Yahwe ndiye
  alternative: Yahwe aliwatoa
  rationale: Kiwakilishi הוּא kinachofuata jina kina nguvu ya kutambulisha au kusisitiza. “Ndiye” huhifadhi mkazo kwamba Yahwe ndiye aliyefanya tendo hilo bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imetumia ulinganifu mwafaka: ni ya kawaida kwa wasomaji wa leo huku ikihifadhi jina la Mungu, mkazo wa הוּא, kutajwa kwa “nchi,” na tanbihi kuhusu umbo la Kiebrania בְּנֵי יִשְׂרָאֵל.'
