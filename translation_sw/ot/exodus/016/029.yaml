  text: רְא֗וּ כִּֽי יְהוָה֮ נָתַ֣ן לָ/כֶ֣ם הַ/שַּׁבָּת֒ עַל כֵּ֠ן ה֣וּא נֹתֵ֥ן לָ/כֶ֛ם בַּ/יּ֥וֹם הַ/שִּׁשִּׁ֖י לֶ֣חֶם יוֹמָ֑יִם שְׁב֣וּ אִ֣ישׁ תַּחְתָּ֗י/ו אַל יֵ֥צֵא אִ֛ישׁ מִ/מְּקֹמ֖/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִֽי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/029.yaml
  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
translation:
  language: sw
  text: Tazameni, kwa maana Yahwe amewapa Sabato; kwa hiyo siku ya sita anawapa mkate wa siku mbili. Kila mtu[a] akae mahali pake; mtu yeyote asitoke mahali pake siku ya saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi kina “kila mwanamume” na “mwanamume yeyote”; umbo la kiume limetumiwa kwa kugawa agizo kwa kila mmoja katika jumuiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Angalieni
  rationale: Amri ya wingi ya ראה inaweza kumaanisha kuona au kutambua. “Angalieni” inadumisha mwito wa moja kwa moja bila kufunga maana katika ufahamu wa kiakili pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi unaotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA”.
- source_word: נָתַן לָכֶם הַשַּׁבָּת
  choice: amewapa Sabato
  rationale: Kauli timilifu inaonyesha kwamba Sabato imetolewa kwao; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: עַל כֵּן
  choice: kwa hiyo
  rationale: Kirai hiki kinaonyesha matokeo ya sababu iliyotangulia.
- source_word: לֶחֶם יוֹמָיִם
  choice: mkate wa siku mbili
  rationale: Inahifadhi neno halisi “mkate” na kueleza kwamba kiasi hicho kinatosha kwa siku mbili.
- source_word: שְׁבוּ אִישׁ תַּחְתָּיו
  choice: Kila mtu akae mahali pake
  rationale: ישב hapa ni kukaa au kubaki, na תַּחְתָּיו ni nahau ya kuwa mahali alipo; tafsiri hii ni ya asili katika Kiswahili.
- source_word: אַל יֵצֵא אִישׁ מִמְּקֹמוֹ
  choice: mtu yeyote asitoke mahali pake
  rationale: Muundo wa kukanusha unaonyesha marufuku, huku marudio ya “mahali pake” yakidumisha msisitizo wa Kiebrania.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: siku ya saba
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wakati unaotajwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Lugha ya kiume yenye matumizi ya kugawa kwa kila mmoja katika אִישׁ
  choice: kila mtu / mtu yeyote
  alternative: kila mwanamume / mwanamume yeyote
  rationale: Katika muktadha huu אִישׁ inatumika kwa kila mmoja katika jumuiya. Kiswahili “mtu” huwasilisha matumizi hayo kwa kawaida; tanbihi inadumisha taarifa kwamba Kiebrania kina umbo la kiume.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Sentensi fupi na sambamba zinadumisha muundo wa maelekezo ya Kiebrania.
