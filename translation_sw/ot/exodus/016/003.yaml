  text: וַ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי יִתֵּ֨ן מוּתֵ֤/נוּ בְ/יַד יְהוָה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/שִׁבְתֵּ֨/נוּ֙ עַל סִ֣יר הַ/בָּשָׂ֔ר בְּ/אָכְלֵ֥/נוּ לֶ֖חֶם לָ/שֹׂ֑בַע כִּֽי הוֹצֵאתֶ֤ם אֹתָ֨/נוּ֙ אֶל הַ/מִּדְבָּ֣ר הַ/זֶּ֔ה לְ/הָמִ֛ית אֶת כָּל הַ/קָּהָ֥ל הַ/זֶּ֖ה בָּ/רָעָֽב־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/003.yaml
  text: And the sons of Israel said to them[a], “If only we had died by the hand of Yahweh in the land of Egypt, when we sat by the pots of meat, when we ate bread to the full[c][b]. For you have brought us out into this wilderness to kill this whole assembly with hunger.”
translation:
  language: sw
  text: Wana wa Israeli[a] wakawaambia, “Laiti tungekufa kwa mkono wa Yahweh[b] katika nchi ya Misri, tulipoketi kando ya vyungu vya nyama na kula mkate mpaka tukashiba![c] Kwa maana mmetutoa katika nchi ya Misri na kutuleta katika nyika hii ili kuliua kusanyiko hili lote kwa njaa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “wana wa Israeli,” usemi unaoweza pia kutafsiriwa “Waisraeli.” Hapa unawahusu watu wa Israeli kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: “Kwa mkono wa Yahweh” ni nahau inayomaanisha kufa kwa tendo au uwezo wa Yahweh.
    reason: idiom_clarification
  - marker: c
    text: Neno la Kiebrania lililotafsiriwa “mkate” linaweza, kulingana na muktadha, kumaanisha chakula kwa ujumla.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania huku ukiwa usemi unaoeleweka katika Kiswahili cha kibiblia; hapa unaliwakilisha taifa lote.
- source_word: מִי יִתֵּן מוּתֵנוּ
  choice: Laiti tungekufa
  rationale: מִי יִתֵּן ni nahau ya kutamani, si swali halisi. Muundo wa ‘laiti’ unaonyesha tamanio lisilowezekana kuhusu wakati uliopita kwa Kiswahili cha kawaida.
- source_word: בְיַד יְהוָה
  choice: kwa mkono wa Yahwe
  rationale: Huhifadhi picha ya Kiebrania ya ‘mkono’ kama chombo au utendaji wa Yahwe bila kuifafanua kupita kiasi.
- source_word: בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר
  choice: tulipoketi kando ya vyungu vya nyama
  rationale: Huwasilisha kishazi cha wakati na picha halisi ya vyungu vilivyokuwa na nyama kwa lugha ya asili ya Kiswahili.
- source_word: בְּאָכְלֵנוּ לֶחֶם לָשֹׂבַע
  choice: na kula mkate mpaka tukashiba
  rationale: Huhifadhi ‘mkate’ kwa לֶחֶם na maana ya kushiba kwa לָשֹׂבַע, huku sentensi ikisomeka kwa urahisi.
- source_word: הַמִּדְבָּר הַזֶּה
  choice: nyika hii
  rationale: ‘Nyika’ hufaa kwa eneo kame lisilokaliwa sana na huhifadhi mandhari kuu ya safari ya Kutoka bila kudokeza lazima jangwa la mchanga.
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: kusanyiko hili lote
  rationale: ‘Kusanyiko’ linaonyesha kundi lote lililokusanyika bila kuingiza moja kwa moja maana ya baadaye ya kanisa.
- source_word: בָּרָעָב
  choice: kwa njaa
  rationale: Hutoa kwa ufupi njia au hali ambayo walidai ingewaua—njaa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Usemi wa agano בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  alternative: Waisraeli
  rationale: Uteuzi huu huhifadhi picha ya ukoo iliyo katika chanzo. Katika muktadha huu usemi unawahusu watu wa Israeli kwa ujumla, si wanaume pekee.
- issue: Maana ya ‘kwa mkono wa Yahwe’ katika tamanio lao
  choice: Nahau imehifadhiwa bila kutaja aina mahususi ya kifo
  alternative: Yahwe mwenyewe angetuua
  rationale: Kiebrania kinaweza kueleweka kuwa kufa kwa tendo au uwezo wa Yahwe, lakini hakielezi njia mahususi. Tafsiri haiongezi ufafanuzi ambao chanzo hakitoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa malalamiko umebaki mkali na wa moja kwa moja. ‘Nyika’ na ‘kusanyiko’ zimetumiwa kwa uwazi bila lugha nzito ya kale; jina ‘Yahwe’ limehifadhiwa.
