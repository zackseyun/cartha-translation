lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Kitenzi דבר katika mfuatano wa kisimulizi kinaanzisha tukio jipya la kusema; “akasema” ni Kiswahili cha kawaida na chenye heshima.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limeandikwa kama jina binafsi badala ya kubadilishwa na cheo; “Yahwe” ni umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: אֶל־מֹשֶׁה
  choice: na Musa
  rationale: Katika Kiswahili, “kusema na mtu” humtaja kwa njia ya asili anayeelekezewa maneno, sawa na אֶל katika muktadha huu.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Inahifadhi fomula ya Kiebrania inayotanguliza maneno ya moja kwa moja katika mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi יהוה; kulihifadhi kama “Yahwe” huepuka kulibadilisha kimya kimya kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “akasema ... akisema” umehifadhiwa kwa sababu לֵאמֹר ni fomula inayotanguliza usemi wa moja kwa moja katika mstari unaofuata.
