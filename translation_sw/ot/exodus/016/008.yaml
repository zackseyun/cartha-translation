source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה בְּ/תֵ֣ת יְהוָה֩ לָ/כֶ֨ם בָּ/עֶ֜רֶב בָּשָׂ֣ר לֶ/אֱכֹ֗ל וְ/לֶ֤חֶם בַּ/בֹּ֨קֶר֙ לִ/שְׂבֹּ֔עַ בִּ/שְׁמֹ֤עַ יְהוָה֙ אֶת תְּלֻנֹּ֣תֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם מַלִּינִ֖ם עָלָ֑י/ו וְ/נַ֣חְנוּ מָ֔ה לֹא עָלֵ֥י/נוּ תְלֻנֹּתֵי/כֶ֖ם כִּ֥י עַל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/008.yaml
  text: And Moses said[a], “When Yahweh gives you meat to eat in the evening and bread in the morning to the full, because Yahweh hears your grumblings that you are grumbling against him—what are we? Your grumblings are not against us, but against Yahweh.”
translation:
  language: sw
  text: Musa akasema, “Yahweh atakapowapa nyama ya kula jioni, na mkate asubuhi ili mshibe, kwa kuwa Yahweh anasikia manung’uniko yenu mnayomnung’unikia[a]—sisi ni nini? Manung’uniko yenu si dhidi yetu, bali dhidi ya Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinarudia nomino na kitenzi cha mzizi mmoja: “manung’uniko yenu ... mnayomnung’unikia.” Urudiaji huo unaongeza uzito wa shtaka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתֵת
  choice: atakapowapa
  rationale: Muundo wa ב pamoja na kitenzi-jina unaonyesha hali ya wakati; ‘atakapowapa’ ni Kiswahili cha kawaida kinacholingana na kauli ya Musa kuhusu jambo litakalotokea.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limehifadhiwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: בָּשָׂר לֶאֱכֹל
  choice: nyama mle
  rationale: Katika muktadha wa chakula, בָּשָׂר ni ‘nyama’; muundo huu wa Kiswahili unaonyesha kusudi la kupewa nyama hiyo.
- source_word: לֶחֶם
  choice: mkate
  rationale: Maana halisi ya kawaida ‘mkate’ inadumisha taswira thabiti ya chakula kinachotolewa asubuhi.
- source_word: לִשְׂבֹּעַ
  choice: mpaka mshibe
  rationale: Kitenzi שבע kinaonyesha kushiba; usemi huu ni wa asili na unaeleza kiasi cha kutosheleza.
- source_word: בִּשְׁמֹעַ
  choice: kwa sababu ... amesikia
  rationale: 'Muundo huu una nguvu ya kisababishi katika muktadha: utoaji unahusishwa na Yahweh kuyasikia manung’uniko yao.'
- source_word: תְּלֻנֹּתֵיכֶם / מַלִּינִם
  choice: manung’uniko yenu mnayomnung’unikia
  rationale: Nomino na kitenzi cha mzizi mmoja vimedumishwa ili kuhifadhi msisitizo wa Kiebrania kuhusu malalamiko yao.
- source_word: עָלָיו
  choice: mnayomnung’unikia
  rationale: Kiambishi cha yambwa ‘-m-’ kinaonyesha kwamba manung’uniko hayo yanaelekezwa dhidi yake, si kwamba yanamhusu tu.
- source_word: וְנַחְנוּ מָה
  choice: sisi ni kitu gani?
  rationale: Kiebrania hutumia ‘nini’ badala ya ‘nani,’ kikisisitiza udogo wa Musa na Haruni kama walengwa wa manung’uniko; tafsiri hii inadumisha tofauti hiyo.
- source_word: לֹא עָלֵינוּ תְלֻנֹּתֵיכֶם כִּי עַל יְהוָה
  choice: Manung’uniko yenu si dhidi yetu, bali dhidi ya Yahweh
  rationale: ‘Bali’ huonyesha wazi ulinganifu wa kinyume uliomo katika sentensi ya Kiebrania.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יְהוָה; ‘Yahweh’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Manung’uniko’ linafaa kwa malalamiko ya mara kwa mara katika simulizi la jangwani. Muundo usio wa kawaida kidogo ‘sisi ni kitu gani?’ umehifadhiwa kwa makusudi ili kuakisi מָה (‘nini/kitu gani’) na msisitizo wake juu ya udogo wa Musa na Haruni.
