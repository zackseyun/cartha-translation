    text: 'Kiebrania kinarudia nomino na kitenzi cha mzizi mmoja: “manung’uniko yenu ... mnayomnung’unikia.” Urudiaji huo unaongeza uzito wa shtaka.'
    reason: lexical_alternative
  revision_rationale: Revision makes the aspect of 'hears' correspond more closely to the Hebrew construction, improves idiomatic Swahili for the food phrase and rhetorical question, and retains the source's cognate repetition through both the text and its footnote.
