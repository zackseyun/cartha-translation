  text: וּ/בֹ֗קֶר וּ/רְאִיתֶם֙ אֶת כְּב֣וֹד יְהוָ֔ה בְּ/שָׁמְע֥/וֹ אֶת תְּלֻנֹּתֵי/כֶ֖ם עַל יְהוָ֑ה וְ/נַ֣חְנוּ מָ֔ה כִּ֥י תלונו עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/007.yaml
  text: And in the morning you will see the glory of Yahweh[a], because he has heard your grumblings against Yahweh. And what are we, that you grumble against us?
translation:
  language: sw
  text: Na asubuhi mtauona utukufu wa Yahwe, kwa kuwa ameyasikia[a] manung'uniko yenu dhidi ya Yahwe. Nasi ni nani hata mnung'unike dhidi yetu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakaposikia manung'uniko yenu dhidi ya Yahwe.” Muundo wa Kiebrania unaweza kueleweka kwa maana ya wakati au ya sababu.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֹקֶר
  choice: Na asubuhi
  rationale: Nomino yenye kiunganishi inatumika kama kielezi cha wakati; “Na asubuhi” huhifadhi mtiririko kutoka mstari uliotangulia na ni Kiswahili cha kawaida.
- source_word: וּ/רְאִיתֶם
  choice: mtauona
  rationale: Katika mfululizo huu, kitenzi kina maana ya jambo litakalotokea; “mtauona” pia hulihusisha moja kwa moja neno “utukufu” kama yambwa.
- source_word: כְּבוֹד יְהוָה
  choice: utukufu wa Yahwe
  rationale: כָּבוֹד hapa hudokeza fahari na uwepo wa Mungu unaodhihirishwa; “utukufu wa Yahwe” huhifadhi uzito wa kitheolojia wa kirai hicho.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: בְּ/שָׁמְע/וֹ
  choice: kwa kuwa ameyasikia
  rationale: ב pamoja na kitenzi-jina inaweza kuwa na maana ya sababu au wakati. Katika muktadha huu, maana ya sababu inaeleza kwa nini watu watauona utukufu wa Yahwe; maana ya wakati imehifadhiwa katika tanbihi.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: manung’uniko yenu
  rationale: Neno hili linaonyesha malalamiko ya kutoridhika yenye mwelekeo wa uasi; “manung’uniko” huhifadhi uzito huo na uhusiano wake na kitenzi kinachofuata.
- source_word: עַל יְהוָה
  choice: dhidi ya Yahwe
  rationale: עַל pamoja na lugha ya kunung’unika huonyesha kwamba manung’uniko yanaelekezwa kwa upinzani dhidi ya Yahwe, si kwamba yanamhusu tu.
- source_word: וְנַחְנוּ מָה
  choice: Nasi ni nani
  rationale: Kirai ni swali la balagha linalosisitiza udogo wa Musa na Haruni. “Nasi ni nani” ni cha asili na huhifadhi kiunganishi cha Kiebrania.
- source_word: כִּי תלונו עָלֵינוּ
  choice: hata mnung’unike dhidi yetu
  rationale: כִּי hapa huanzisha matokeo au yaliyomo katika swali la balagha. “Hata” huleta muundo wa kawaida wa Kiswahili na “dhidi yetu” hudumisha ulinganifu na “dhidi ya Yahwe.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina binafsi katika umbo linalotumika kwa kawaida katika Kiswahili.
- issue: Maana ya kisababishi au ya wakati katika בְּשָׁמְעוֹ
  choice: kwa kuwa ameyasikia
  alternative: atakaposikia
  rationale: Muktadha unaweza kueleza kuonekana kwa utukufu wa Yahwe kuwa jibu kwa manung’uniko ya Israeli, hivyo maana ya kisababishi imewekwa katika maandishi. Hata hivyo, muundo wa Kiebrania unaweza pia kueleweka kwa maana ya wakati, na uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Manung’uniko/mnung’unike” hudumisha mshikamano wa msamiati wa Kiebrania, na “Nasi ni nani” huhifadhi swali la balagha bila kulifanya kuwa la kidhehebu.
