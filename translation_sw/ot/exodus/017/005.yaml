base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
translation:
  language: sw
  text: Kisha Yahweh akamwambia Mose, “Pita mbele ya watu, nawe uchukue pamoja nawe baadhi ya wazee wa Israeli. Na fimbo yako, ambayo uliupiga nayo Mto Naili, ichukue mkononi mwako, kisha uende.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi ili kuhifadhi jina binafsi la agano badala ya kulibadilisha kuwa cheo.
- source_word: עֲבֹר לִפְנֵי הָעָם
  choice: Pita mbele ya watu
  rationale: Huhifadhi maana ya msingi ya kupita au kwenda mbele ya kusanyiko bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: וְקַח אִתְּךָ מִזִּקְנֵי יִשְׂרָאֵל
  choice: nawe uchukue pamoja nawe baadhi ya wazee wa Israeli
  rationale: Kiambishi מִן kinaonyesha uteuzi kutoka katika kundi; “baadhi ya” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וּמַטְּךָ
  choice: ile fimbo yako
  rationale: “Fimbo” ni neno la kawaida na lenye hadhi linalofaa chombo cha Mose; “ile” huunganisha kirai hiki na sifa inayofuata.
- source_word: אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר
  choice: ambayo uliupigia Mto Naili
  rationale: בּוֹ ina maana ya kutumia fimbo kama chombo. Katika muktadha wa Kutoka, הַיְאֹר humaanisha Mto Naili; “uliupigia” ni Kiswahili asilia kwa kupiga mto kwa fimbo.
- source_word: קַח בְּיָדְךָ
  choice: ishike mkononi mwako
  rationale: Kitenzi קח kimerudiwa katika chanzo. “Ishike” hudumisha amri hiyo na kueleza kwa kawaida kwamba Mose aichukue fimbo mkononi.
- source_word: וְהָלָכְתָּ
  choice: kisha uende
  rationale: Umbo hili linaendeleza mfululizo wa maagizo kwa nguvu ya amri; “kisha” huonyesha hatua inayofuata kwa Kiswahili fasaha.
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw ya masimulizi huendeleza tukio; “Kisha” pamoja na “akamwambia” huleta mtiririko wa kawaida wa masimulizi ya Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu YHWH
  choice: Yahweh
  alternative: Yehova
  rationale: “Yahweh” ni unukuzi wa jina יהוה na huhifadhi matumizi yake kama jina binafsi bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri umewekwa wazi na wa kawaida; maana ya kuchagua baadhi ya wazee imeelezwa katika matini kwa sababu ndiyo maana ya kimuundo ya מִן hapa. Hakuna tanbihi iliyohitajika.
