lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi עשה hapa kinamaanisha kufanya au kutekeleza alichoagizwa; “akafanya” ni cha asili katika muundo “akafanya kama ...”
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: kama Musa alivyomwambia
  rationale: Muundo huu unaonyesha kuwa Yoshua alitenda kulingana na maagizo ambayo Musa alikuwa amempa; Kiswahili cha simulizi huwasilisha maana hiyo kwa kawaida bila kulazimisha wakati timilifu uliopita.
- source_word: לְהִלָּחֵם
  choice: kupigana
  rationale: Kitenzi cha Kiebrania katika muktadha huu kinamaanisha kupigana au kufanya vita; “kupigana” ni wazi na cha kawaida.
- source_word: בַּעֲמָלֵק
  choice: dhidi ya Amaleki
  rationale: Pamoja na לחם, kihusishi kinaonyesha uhasama. Jina “Amaleki” limehifadhiwa badala ya kulitafsiri moja kwa moja kuwa jina la watu wake.
- source_word: עָלוּ
  choice: wakapanda
  rationale: עלה humaanisha kwenda juu au kupanda; “wakapanda” linafaa kwa mwendo wa kuelekea kileleni.
- source_word: רֹאשׁ הַגִּבְעָה
  choice: kilele cha kilima
  rationale: Kisemi hiki, kihalisi “kichwa cha kilima,” humaanisha sehemu ya juu kabisa; “kilele cha kilima” ni Kiswahili cha asili na chenye hadhi.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Umbo linalotambulika na kutumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: חוּר
  choice: Huri
  rationale: Utohozi wa jina la Kiebrania unaolingana na matumizi ya kawaida ya Kiswahili.
