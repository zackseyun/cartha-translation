  text: So Moses cried out to Yahweh[a], saying, “What shall I do with this people? A little more, and they will stone me!”
translation:
  language: sw
  text: Musa akamwomba Yahwe kwa kilio, akisema, “Nifanye nini na watu hawa? Bado kidogo tu[a], nao watanipiga kwa mawe!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa karibu: “Bado kidogo, nao watanipiga kwa mawe”; maneno haya yanaonyesha kwamba tishio lilikuwa karibu kutokea.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: akamlilia
  rationale: Kitenzi צעק kinaonyesha kilio cha dhiki au cha kuomba msaada, si kuita kwa kawaida tu. ‘Akamlilia’ kinahifadhi uzito na uharaka wa ombi la Musa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Muundo huu wa Kiebrania unatambulisha maneno yanayonukuliwa; ‘akisema’ ni wa kawaida na unaendeleza mtiririko wa simulizi.
- source_word: מָה אֶעֱשֶׂה לָעָם הַזֶּה
  choice: Nifanye nini na watu hawa?
  rationale: Kauli hii inauliza kwa dharura jinsi Musa anavyopaswa kushughulika na watu hao. Kiswahili hiki ni cha asili na hakibainishi zaidi ya maandishi kama tendo hilo ni kwa ajili yao au dhidi yao.
- source_word: עֹד מְעַט
  choice: Bado kidogo tu
  rationale: Maneno haya kwa karibu ni ‘bado kidogo’ na yanaonyesha kuwa hatari iko karibu sana kutokea. Neno ‘tu’ linaonyesha ukaribu huo kwa Kiswahili cha kawaida.
- source_word: וּסְקָלֻנִי
  choice: nao watanipiga kwa mawe
  rationale: Kitenzi סקל humaanisha kushambulia au kuua kwa kupiga mawe. Kauli ya wakati ujao inaonyesha matokeo yanayokaribia baada ya ‘bado kidogo tu’.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina יהוה. ‘Yahwe’ linahifadhi jina hilo badala ya kuliwakilisha kwa cheo, bila kuongeza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya dharura kulingana na kilio cha Musa; ‘watu hawa’ na ‘watanipiga kwa mawe’ vinaeleweka kwa urahisi bila kupunguza nguvu ya maandishi.
