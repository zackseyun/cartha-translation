base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/006.yaml
  text: Behold[a], I will stand before you there on the rock at Horeb, and you shall strike the rock, and water will come out from it, and the people will drink. And Moses did so in the sight of the elders of Israel.
translation:
  language: sw
  text: Tazama[a], nitasimama mbele yako huko, juu ya mwamba huko Horebu. Piga mwamba, nayo maji yatatoka humo, na watu watakunywa. Musa akafanya hivyo mbele ya macho ya wazee wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tazama, ninasimama mbele yako huko, juu ya mwamba huko Horebu.” Kishirikishi cha Kiebrania kinaweza kutafsiriwa kwa wakati uliopo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Tazama
  rationale: Huelekeza usikivu kwa tamko zito la Mungu kwa lugha ya kawaida lakini yenye hadhi.
- source_word: עֹמֵד
  choice: nitasimama
  rationale: Ingawa ni umbo la kitenzi lenye maana ya ‘nikisimama/nimesimama,’ katika muktadha wa maagizo linaweza kueleza tendo la Mungu lililo karibu kutokea.
- source_word: לְפָנֶיךָ
  choice: mbele yako
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayoonyesha mahali Mungu atakapokuwa kuhusiana na Musa.
- source_word: הַצּוּר
  choice: mwamba
  rationale: Neno hili huonyesha mwamba au jabali; ‘mwamba’ ni la kawaida na linaweza kurudiwa kwa uwazi.
- source_word: בְּחֹרֵב
  choice: kule Horebu
  rationale: Huonyesha mahali panapojulikana huku Kiswahili cha ‘kule’ kikilingana kwa kawaida na ‘huko’ iliyotangulia.
- source_word: וְהִכִּיתָ
  choice: Uupige
  rationale: Huwasilisha agizo la kumpiga mwamba kwa nguvu bila kuongeza maelezo yasiyokuwamo.
- source_word: וְיָצְאוּ מִמֶּנּוּ מַיִם
  choice: nayo maji yatatoka ndani yake
  rationale: Hudumisha maana ya maji kutoka kwenye mwamba bila kuongeza taswira ya kutiririka ambayo haijaelezwa wazi katika kitenzi.
- source_word: וְשָׁתָה הָעָם
  choice: na watu watakunywa
  rationale: 'Hudumisha mfuatano wa matokeo: mwamba unapigwa, maji yanatoka, kisha watu wanakunywa.'
- source_word: וַיַּעַשׂ כֵּן
  choice: akafanya hivyo
  rationale: Ni usemi wa kawaida wa Kiswahili unaolingana na muhtasari wa tendo la Musa.
- source_word: לְעֵינֵי
  choice: mbele ya macho ya
  rationale: Hudumisha taswira ya Kiebrania na kusisitiza kuwa wazee walikuwa mashahidi wa tendo hilo.
theological_decisions:
- issue: Wakati wa kishirikishi עֹמֵד katika kujitokeza kwa Mungu
  choice: nitasimama
  alternative: nimesimama
  rationale: Muktadha wa maagizo unaelekea kwenye tendo linalotarajiwa mara moja, lakini tanbihi inahifadhi uwezekano halisi wa tafsiri ya wakati uliopo.
- issue: Uhusiano wa ‘mbele yako’ na ‘juu ya mwamba’
  choice: Mungu atasimama mbele ya Musa, huko juu ya mwamba kule Horebu
  alternative: Mungu atasimama mbele ya Musa huko, karibu na mwamba kule Horebu
  rationale: Muundo wa Kiebrania unaunganisha kwa kawaida kusimama kwa Mungu na kuwa juu ya mwamba; taswira hiyo imehifadhiwa bila maelezo ya kiteolojia yaliyoongezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazama’ huhifadhi uzito wa tamko; ‘mbele ya macho ya’ huhifadhi msisitizo wa ushuhuda wa hadharani.
