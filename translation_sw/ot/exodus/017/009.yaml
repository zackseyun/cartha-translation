  text: וַ/יֹּ֨אמֶר מֹשֶׁ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בְּחַר לָ֣/נוּ אֲנָשִׁ֔ים וְ/צֵ֖א הִלָּחֵ֣ם בַּ/עֲמָלֵ֑ק מָחָ֗ר אָנֹכִ֤י נִצָּב֙ עַל רֹ֣אשׁ הַ/גִּבְעָ֔ה וּ/מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/009.yaml
  text: And Moses said to Joshua[a], “Choose men for us and go out; fight against Amalek. Tomorrow I will stand on the top of the hill[b], with the staff of God in my hand.”
translation:
  language: sw
  text: Musa akamwambia Yoshua, “Tuchagulie wanaume, kisha utoke ukapigane na Waamaleki.[a] Kesho mimi nitasimama kileleni mwa kilima,[b] nikiwa na fimbo ya Mungu mkononi mwangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukapige vita na Waamaleki.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania halisi: “juu ya kichwa cha kilima,” nahau yenye maana ya “kileleni mwa kilima.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa simulizi wenye kiambishi -ka- unaendeleza mfululizo wa matukio kwa njia ya kawaida katika Kiswahili, huku kiambishi cha mtendewa kikionyesha kuwa Yoshua ndiye aliyeambiwa.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ni umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: בְּחַר לָנוּ אֲנָשִׁים
  choice: Tuchagulie wanaume
  rationale: Kitenzi 'tuchagulie' kinawakilisha kwa ufasaha wazo la kuwachagulia 'sisi'; 'wanaume' linahifadhi rejeo la אֲנָשִׁים katika muktadha wa wapiganaji bila kuongeza neno lisilokuwapo kama 'askari'.
- source_word: וְצֵא
  choice: kisha utoke
  rationale: '''Utoke'' linadumisha maana ya msingi ya יצא, yaani kutoka kwenda kukabiliana na adui; ''kisha'' linaunganisha maagizo kwa Kiswahili cha kawaida.'
- source_word: הִלָּחֵם בַּעֲמָלֵק
  choice: ukapigane na Waamaleki
  rationale: '''Kupigana na'' ni usemi wa kawaida wa Kiswahili kwa mapambano dhidi ya adui. ''Waamaleki'' linaeleza Amaleki kama jamii ya watu katika muktadha huu.'
- source_word: מָחָר אָנֹכִי נִצָּב
  choice: Kesho mimi nitasimama
  rationale: '''Kesho'' linaipa hali ya kushiriki נִצָּב maana ya wakati ujao; ''mimi'' linahifadhi msisitizo wa kiwakilishi אָנֹכִי.'
- source_word: עַל רֹאשׁ הַגִּבְעָה
  choice: kileleni mwa kilima
  rationale: Hii ni tafsiri ya kawaida ya nahau ya Kiebrania yenye maana halisi ya 'juu ya kichwa cha kilima'.
- source_word: וּמַטֵּה הָאֱלֹהִים
  choice: nikiwa na fimbo ya Mungu
  rationale: Muundo huu unaunganisha kishazi kisicho na kitenzi na tendo la Musa kusimama, bila kubadili uhusiano wa maneno katika 'fimbo ya Mungu'.
- source_word: בְּיָדִי
  choice: mkononi mwangu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mahali fimbo ilipokuwa.
theological_decisions:
- issue: Tafsiri ya הָאֱלֹהִים katika מַטֵּה הָאֱלֹהִים
  choice: fimbo ya Mungu
  alternative: fimbo ya kimungu
  rationale: '''Fimbo ya Mungu'' linahifadhi muundo wa Kiebrania na rejeo dhahiri kwa Mungu, bila kuifanya kuwa sifa ya jumla ya ukimungu.'
- issue: Rejeo la עֲמָלֵק
  choice: Waamaleki
  alternative: Amaleki
  rationale: Katika muktadha wa vita, jina hili linarejelea kwa kawaida watu wa Amaleki kwa ujumla. Umbo la wingi 'Waamaleki' ni la asili katika Kiswahili, ingawa Kiebrania hutumia jina la pamoja la 'Amaleki'.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa simulizi umetumia -ka- kwa mwendelezo wa kawaida; msisitizo wa 'mimi' na taswira ya fimbo mkononi zimehifadhiwa.
