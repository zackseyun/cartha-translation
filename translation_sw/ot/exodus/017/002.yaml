base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/002.yaml
  text: So the people quarreled with Moses and said[a], “Give us water so that we may drink.” And Moses said to them[b], “Why do you quarrel with me? Why do you test Yahweh?”
translation:
  language: sw
  text: Basi watu wakagombana na Musa, wakasema, “Tupeni maji ili tunywe.” Musa akawaambia, “Kwa nini mnagombana nami? Kwa nini mnamjaribu[b] Yahwe[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH; kwa kawaida hutafsiriwa “BWANA.”'
    reason: alternative_reading
  - marker: b
    text: Au, “mnamtia Yahwe majaribuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶב
  choice: wakagombana
  rationale: Kitenzi ריב kinaonyesha ugomvi au mabishano yenye upinzani. ‘Wakagombana’ ni Kiswahili cha kawaida na chenye nguvu inayofaa katika muktadha huu.
- source_word: הָעָם
  choice: watu
  rationale: Maandishi yanasema tu ‘watu’; hayataji wazi ‘Waisraeli’ katika aya hii, hivyo nyongeza hiyo haijaingizwa.
- source_word: עִם מֹשֶׁה
  choice: na Musa
  rationale: עִם maana yake ya msingi ni ‘na/pamoja na’; katika usemi ‘kugombana na,’ Kiswahili huonyesha upinzani kwa njia ya kawaida bila kuongeza ‘dhidi ya.’
- source_word: תְּנוּ לָנוּ מַיִם
  choice: Tupeni maji
  rationale: Amri תְּנוּ iko katika wingi. ‘Tupeni’ inahifadhi umbo hilo hata ingawa Musa ndiye aliyetajwa wazi katika sentensi.
- source_word: וְנִשְׁתֶּה
  choice: ili tunywe
  rationale: Umbo hili linaonyesha kusudi au matokeo yanayotakiwa baada ya amri; ‘ili tunywe’ ni la asili na wazi.
- source_word: מַה תְּרִיבוּן עִמָּדִי
  choice: Kwa nini mnagombana nami?
  rationale: מַה hapa ni swali la kukemea lenye maana ya ‘kwa nini.’ Kurudia ‘mnagombana’ kunahifadhi uhusiano wa kileksia na ריב mwanzoni mwa aya.
- source_word: מַה תְּנַסּוּן
  choice: Kwa nini mnamjaribu
  rationale: נסה katika piel humaanisha ‘jaribu’ au ‘weka katika majaribu.’ ‘Mnamjaribu’ ni fupi, ya kawaida, na inadumisha uzito wa kitheolojia wa tendo hilo.
- source_word: אֶת יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kama ‘Yahwe,’ badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja. ‘Yahwe’ huhifadhi jina la pekee la Mungu lililo katika chanzo.
- issue: Nguvu ya lugha ya נסה inapomhusu Mungu
  choice: mnamjaribu Yahwe
  alternative: mnamweka Yahwe katika majaribu
  rationale: Tafsiri kuu inahifadhi shtaka kwamba ugomvi wao na Musa ulikuwa kumjaribu Mungu, bila kulainisha au kufafanua zaidi mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi ‘Basi … waka-’ unaendeleza mwendo wa simulizi. ‘Tupeni’ huhifadhi amri ya wingi ya Kiebrania bila kueleza kimyakimya kwa nini wingi umetumiwa ingawa Musa pekee ndiye ametajwa.
