base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/016.yaml
  text: And he said[a], “A hand is upon the throne of Yah; Yahweh will have war with Amalek from generation to generation.”
translation:
  language: sw
  text: Naye akasema[a], “Mkono uko juu ya kiti cha enzi cha Yah; Yahweh atakuwa na vita na Amaleki kizazi baada ya kizazi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania hapa ni kigumu na kimefupishwa; kwa neno kwa neno: “Mkono juu ya kiti cha enzi cha Yah.” Pia kinaweza kueleweka kuwa “mkono dhidi ya kiti cha enzi cha Yah,” au, kwa uwezekano mdogo zaidi, neno כֵּס likichukuliwa kuwa “bendera.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Naye akasema
  rationale: Inaendeleza simulizi kwa njia ya kawaida huku ikiacha mtendaji kuwa ‘yeye,’ kama Kiebrania kisivyolitaja tena jina lake.
- source_word: כִּי
  choice: alama ya kuanza kunukuu moja kwa moja
  rationale: Hapa chembe hii inaleta yaliyosemwa; kuitafsiri wazi kuwa ‘kwa sababu’ au ‘kwa maana’ kungeweza kufasiri kupita kiasi sentensi yenye sintaksia iliyofupishwa na ngumu.
- source_word: יָד
  choice: Mkono
  rationale: Nomino haina kibainishi katika Kiebrania. Kiswahili hakina kibainishi kisicho dhahiri kinacholingana moja kwa moja, hivyo ‘mkono’ huhifadhi kutotajwa kwa mwenye mkono.
- source_word: עַל
  choice: juu ya
  rationale: Hii ndiyo maana ya kawaida ya kihusishi hapa; tafsiri ‘dhidi ya’ inawezekana lakini ni ya kifasiri zaidi na imewekwa katika tanbihi.
- source_word: כֵּס
  choice: kiti cha enzi
  rationale: Umbo hili lisilo la kawaida linaelekea kuwa umbo fupi au lenye tahajia pungufu la neno linalomaanisha ‘kiti cha enzi.’ Maana ‘bendera’ ina uwezekano mdogo zaidi.
- source_word: יָהּ
  choice: Yah
  rationale: Hili ni umbo fupi la jina la Mungu, tofauti na tetragramatoni inayofuata, hivyo limehifadhiwa kama ‘Yah.’
- source_word: מִלְחָמָה לַיהוָה
  choice: Yahweh atakuwa na vita
  rationale: Kishazi cha Kiebrania hakina kitenzi na kinaonyesha kwamba vita hivyo ni vya Yahweh au kwamba yuko vitani. ‘Atakuwa na vita’ huhifadhi muundo wa kinomino na maana ya wakati ujao inayodokezwa na muktadha.
- source_word: בַּעֲמָלֵק
  choice: na Amaleki
  rationale: Kihusishi kinaonyesha uhasama katika muktadha wa vita; katika Kiswahili, ‘kuwa na vita na’ huwasilisha kwa kawaida maana ya kupigana dhidi ya Amaleki.
- source_word: מִדֹּר דֹּר
  choice: kizazi baada ya kizazi
  rationale: Ni usemi wa asili na wazi wa Kiswahili unaoonyesha mwendelezo katika vizazi vinavyofuatana.
theological_decisions:
- issue: Kutafsiri majina ya Mungu יָהּ na יהוה katika mstari mmoja
  choice: יָהּ limetafsiriwa ‘Yah’ na יהוה ‘Yahweh’
  alternative: Kuyatafsiri yote mawili ‘BWANA,’ au kutotofautisha umbo fupi na jina kamili
  rationale: Kiebrania kinatumia kwa makusudi umbo fupi ‘Yah’ kisha tetragramatoni ‘Yahweh’; kuyatofautisha huhifadhi ushahidi wa matini chanzi.
- issue: Kushughulikia kishazi kilichofupishwa כִּי יָד עַל כֵּס יָהּ
  choice: ‘Mkono uko juu ya kiti cha enzi cha Yah’ pamoja na tanbihi ya njia nyingine za kukielewa
  alternative: ‘Mkono uko dhidi ya kiti cha enzi cha Yah’ au ‘Mkono uko juu ya bendera ya Yah’
  rationale: Kishazi hiki ni kigumu na hakimtaji mwenye mkono wala uhusiano kamili wa maneno. Tafsiri kuu huhifadhi maana ya kawaida ya עַל na כֵּס bila kutatua kimyakimya utata wa kitheolojia na kisintaksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa kwa ufupi ili kuakisi ubanifu wa Kiebrania, huku tanbihi ikihifadhi utata halisi. Jina ‘Amaleki’ limetumiwa kwa taifa au babu anayewakilisha watu wake.
