base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/012.yaml
  text: But Moses’ hands were heavy[a], so they took a stone and put it under him, and he sat on it. And Aaron and Hur supported his hands, one on this side and one on that side, so his hands remained steady until the sun set.
translation:
  language: sw
  text: Lakini mikono ya Mose ilikuwa mizito, hivyo wakachukua jiwe, wakaliweka chini yake, naye akalikalia. Aaroni na Huri wakaitegemeza mikono yake, mmoja upande huu na mwingine upande ule; hivyo mikono yake ikabaki imara[a] mpaka jua lilipotua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “thabiti”; nomino ya Kiebrania inaweza pia kuwa na maana ya “uaminifu,” lakini hapa inaelekea kueleza uimara wa mikono ya Mose.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידֵי
  choice: mikono
  rationale: Ni tafsiri ya moja kwa moja ya wingi wa יָד na inadumisha taswira inayorudiwa katika mstari.
- source_word: כְּבֵדִים
  choice: ilikuwa mizito
  rationale: Inahifadhi usemi halisi wa Kiebrania; katika muktadha uzito huo unaonyesha uchovu.
- source_word: וַיִּקְחוּ
  choice: wakachukua
  rationale: Kitenzi ni nafsi ya tatu wingi bila kutaja wazi wahusika; tafsiri haiongezi majina ambayo Kiebrania haijataja hapa.
- source_word: אֶבֶן
  choice: jiwe
  rationale: Hili ndilo neno la kawaida na sahihi kwa אֶבֶן katika muktadha wa kitu kilichotumiwa kama kiti.
- source_word: תַחְתָּיו
  choice: chini yake
  rationale: Inaonyesha kuwa jiwe liliwekwa chini ya Mose, kama sentensi inayofuata inavyofafanua.
- source_word: וַיֵּשֶׁב עָלֶיהָ
  choice: naye akalikalia
  rationale: Ni Kiswahili cha kawaida kinachoeleza wazi kwamba Mose aliketi juu ya jiwe hilo.
- source_word: תָּמְכוּ בְיָדָיו
  choice: wakaishikilia mikono yake
  rationale: Kitenzi kina maana ya kutegemeza au kushikilia; hapa usemi huu unaeleweka kwa kawaida kama msaada wa kimwili.
- source_word: מִזֶּה אֶחָד וּמִזֶּה אֶחָד
  choice: mmoja upande huu na mwingine upande ule
  rationale: Inahifadhi mgawanyo wa wahusika wawili, kila mmoja akiwa upande tofauti.
- source_word: וַיְהִי יָדָיו אֱמוּנָה
  choice: mikono yake ikabaki imara
  rationale: אֱמוּנָה inaweza kueleza uimara, uthabiti, au uaminifu; muktadha wa msaada wa kimwili unapendelea 'imara,' huku tanbihi ikihifadhi upana wa maana.
- source_word: עַד בֹּא הַשָּׁמֶשׁ
  choice: mpaka jua lilipotua
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha kikomo cha wakati kwa usahihi.
theological_decisions:
- issue: Maana ya אֱמוּנָה kuhusu mikono ya Mose
  choice: uimara wa kimwili
  alternative: uthabiti au uaminifu
  rationale: Muktadha wa mikono kuchoka na kushikiliwa na Aaroni na Huri unaelekeza hasa kwenye uimara wa kimwili. Tanbihi huhifadhi uwezekano wa maana pana bila kuingiza dhana ya kitheolojia isiyodaiwa na tukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia viunganishi vya mfululizo kwa mtiririko wa kawaida, huku usemi wa Kiebrania 'mikono ilikuwa mizito' ukihifadhiwa.
