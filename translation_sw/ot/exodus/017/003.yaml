base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/003.yaml
  text: And there the people thirsted for water, and the people grumbled against Moses and said, “Why is this—that you brought us up from Egypt to kill me and my children and my livestock with thirst?”
translation:
  language: sw
  text: Hapo watu wakawa na kiu ya maji, wakamnung’unikia Mose na kusema, “Kwa nini umetutoa Misri ili kuniua mimi, watoto wangu na mifugo yangu kwa kiu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְמָא ... הָעָם לַמַּיִם
  choice: watu waliona kiu kwa kukosa maji
  rationale: Kitenzi צמא kinaonyesha kuona kiu, na לַמַּיִם hapa kinaeleza kukosa au kuhitaji maji. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha maana kamili.
- source_word: וַיָּלֶן ... עַל־מֹשֶׁה
  choice: wakamnung’unikia Mose
  rationale: לון katika muktadha huu ni kunung’unika au kulalamika dhidi ya mtu; “wak amnung’unikia” kwa kawaida huonyesha kwamba Mose ndiye aliyelengwa na malalamiko.
- source_word: לָמָּה זֶּה הֶעֱלִיתָנוּ
  choice: Kwa nini umetupandisha
  rationale: Muundo wa Kiebrania wa swali umewekwa katika Kiswahili cha asili bila kuongeza jibu; הֶעֱלִיתָנוּ ni kausativi, ‘umetupandisha/umetutoa kwenda juu.’
- source_word: מִקְנַי
  choice: mifugo yangu
  rationale: מִקְנֶה humaanisha wanyama wanaofugwa kama mali; “mifugo” ni neno pana na la kawaida.
- source_word: בַּצָּמָא
  choice: kwa kiu
  rationale: Huhifadhi taswira kali ya kufa kwa kiu badala ya kuifanya kwa ujumla kuwa ‘kwa kukosa maji.’
theological_decisions:
- issue: Mabadiliko kutoka wingi katika ‘umetupandisha’ kwenda umoja katika ‘kuniua mimi’ na viambata vya umoja
  choice: Kudumisha ‘umetupandisha’ kisha ‘kuniua mimi, watoto wangu na mifugo yangu’
  alternative: 'Kusawazisha yote kuwa wingi: ‘kutuua sisi, watoto wetu na mifugo yetu’'
  rationale: Maandishi ya Kiebrania hubadilika kwa makusudi kutoka kiwakilishi cha wingi -נוּ kwenda umoja אֹתִי, בָנַי, מִקְנַי. Kutodumisha mabadiliko hayo kungeondoa mvutano halisi wa maandishi.
- issue: Uhusiano wa kusudi katika לְהָמִית
  choice: “Je, ni ili kuniua...”
  alternative: “...kutoka Misri, kuniua...”
  rationale: לְ inaweza kueleza kusudi linalodaiwa. Muundo wa swali unaonyesha shtaka la watu bila kuthibitisha kwamba hilo lilikuwa kusudi la Mose.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Jina “Mose” limetumiwa kwa umbo la kawaida la Kibiblia. Mabadiliko ya nafsi kutoka wingi hadi umoja yamehifadhiwa kwa uaminifu kwa WLC.
