  text: And whenever Moses raised his hand[a], Israel prevailed; and whenever he let down his hand[b], Amalek prevailed.
translation:
  language: sw
  text: Ikawa kwamba kila Musa alipoinua mkono wake[a], Israeli walishinda; na kila alipoushusha mkono wake[b], Waamaleki walishinda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Musa alipoinua mkono wake ... alipoushusha mkono wake.” Kiebrania kinaweza kutafsiriwa kwa “alipo-,” lakini muktadha unaonyesha kwamba jambo hili lilitokea mara kwa mara wakati wa vita; ndiyo maana “kila” limetumiwa.
    reason: lexical_alternative
  - marker: b
    text: “Alipoushusha” hutafsiri kitenzi ambacho pia kinaweza kumaanisha “aliufanya utulie” au “aliuweka chini.” Kutofautishwa kwake na “alipoinua mkono wake” kunaunga mkono maana ya “aliushusha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כַאֲשֶׁר
  choice: Ikawa kila ... alipo-
  rationale: Muundo huu unaanzisha hali iliyojirudia wakati wa vita. Kiswahili cha “kila ... alipo-” kinaonyesha wazi tendo la mara kwa mara, huku “Ikawa” ikidumisha mtiririko wa simulizi.
- source_word: יָרִים
  choice: alipoinua
  rationale: Hifili ya רום humaanisha kuinua. “Aliinua” ni ya kawaida na haiingizi wazo lisilotajwa wazi la kuendelea kuushikilia juu.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: יָד humaanisha “mkono.” Tafsiri hii inadumisha neno la chanzo bila kulibadili kuwa “mkono wote/arm.”
- source_word: וְגָבַר
  choice: walikuwa wakishinda
  rationale: גבר huonyesha kuwa na nguvu zaidi au kupata ushindi. Katika muktadha wa vita, “walikuwa wakishinda” huonyesha hali ya kuwa na nguvu vitani bila kudai kwamba ushindi wa mwisho ulikuwa tayari umepatikana.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hapa jina linawarejelea watu wa Israeli; umbo “Israeli” ni la kawaida katika Kiswahili cha Biblia, na kitenzi cha wingi kinaweka maana hiyo wazi.
- source_word: יָנִיחַ
  choice: alipoushusha
  rationale: Hifili ya נוח inaweza kumaanisha kusababisha kitu kitulie au kukiweka chini. Kwa kuwa inatofautishwa na kuinua mkono, “kuushusha” ndiyo kauli ya asili na iliyo wazi katika Kiswahili.
- source_word: עֲמָלֵק
  choice: Waamaleki
  rationale: Katika muktadha wa jeshi linalopigana, jina hili linawarejelea watu wa Amaleki; “Waamaleki” ni umbo la kawaida la Kiswahili kwa kundi hilo.
