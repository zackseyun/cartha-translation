source:
  edition: WLC
  text: וַ֠/יִּסְעוּ כָּל עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל מִ/מִּדְבַּר סִ֛ין לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ים וְ/אֵ֥ין מַ֖יִם לִ/שְׁתֹּ֥ת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/001.yaml
  text: Then the whole congregation of the sons of Israel set out from the wilderness of Sin by stages[a], according to the command of Yahweh, and camped at Rephidim[b]; but there was no water for the people to drink.
translation:
  language: sw
  text: Kisha kusanyiko lote la Waisraeli likaondoka kutoka nyika ya Sini, hatua kwa hatua[a], kama Yahwe alivyoagiza, likapiga kambi Refidimu; lakini hapakuwa na maji ya kunywa kwa ajili ya watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa vituo vyao vya safari.” Kiebrania kinaonyesha hatua au vituo vilivyofuatana katika safari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: likaondoka
  rationale: Katika muktadha wa safari, נסע humaanisha kuondoa kambi na kuanza safari; “likaondoka” ni ya kawaida na huendeleza simulizi kwa uwazi.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: kusanyiko lote la Waisraeli
  rationale: עֵדָה ni jumuiya iliyokusanyika; “kusanyiko” huhifadhi maana hiyo ya pamoja, na “Waisraeli” ni tafsiri ya asili na jumuishi ya בני ישראל katika Kiswahili cha sasa.
- source_word: מִמִּדְבַּר סִין
  choice: kutoka nyika ya Sini
  rationale: מִדְבָּר ni eneo kame lisilokaliwa sana; “nyika” ni neno la kawaida katika Kiswahili cha Biblia. Sini ni jina la mahali, si neno la kutafsiri kwa maana nyingine.
- source_word: לְמַסְעֵיהֶם
  choice: wakisafiri hatua kwa hatua
  rationale: מַסָּע hapa huelekea kumaanisha hatua au vituo vinavyofuatana vya safari; kifungu hiki kinaeleza maana hiyo kwa Kiswahili cha kawaida bila kudai kuwa safari yote ilitokea mara moja.
- source_word: עַל פִּי יְהוָה
  choice: kama Yahwe alivyoagiza
  rationale: Nahau hiyo ni halisi ‘kwa kinywa cha Yahwe,’ lakini humaanisha kwa amri au maelekezo yake; “kama ... alivyoagiza” ni wazi na ya asili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “Bwana.”
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: חנה humaanisha kuweka au kupiga kambi; “wakapiga kambi” ni usemi wa kawaida wa Kiswahili.
- source_word: בִּרְפִידִים
  choice: huko Refidimu
  rationale: Refidimu ni jina la mahali lililotoholewa; “huko” linafaa kwa eneo la kambi lililotajwa katika simulizi.
- source_word: וְאֵין מַיִם
  choice: lakini hapakuwa na maji
  rationale: Ingawa ו ni ‘na,’ hapa ina nguvu ya kupambanua hali iliyotarajiwa na tatizo lililokuwapo baada ya kufika; “lakini” huiwasilisha kwa kawaida.
- source_word: לִשְׁתֹּת הָעָם
  choice: ya watu kunywa
  rationale: Kiswahili hiki kinaeleza kwa ufupi kuwa maji ya kunywa na watu hayakuwapo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi bila kulibadili kuwa cheo, huku “Yehova” likiwa umbo jingine la kitamaduni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wa kisimulizi na unaoeleweka kwa wasomaji wa kawaida. Alama [a] iko katika matini kuu na inaeleza uwezekano wa maana ya לְמַסְעֵיהֶם.
