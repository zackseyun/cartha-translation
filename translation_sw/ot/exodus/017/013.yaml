base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/013.yaml
  text: And Joshua overcame Amalek and his people with the sword[a].
translation:
  language: sw
  text: Basi Yoshua akawashinda Amaleki na watu wake kwa upanga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “kwa makali ya upanga.” Kiebrania kinasema kihalisi “kwa kinywa cha upanga,” nahau inayomaanisha kushindwa katika mapigano ya silaha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹשׁ
  choice: akawashinda
  rationale: Kitenzi חלש kinaweza kumaanisha kudhoofisha au kushinda kwa nguvu. Katika muktadha huu wa vita, “akawashinda” kinaeleza ushindi wa kijeshi bila kudai kwamba waliangamizwa kabisa.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina limetolewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: עֲמָלֵק
  choice: Amaleki
  rationale: Jina la asili hapa linawakilisha Amaleki kama kiongozi au jeshi lake; umbo la kawaida la Kiswahili limehifadhiwa.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: Neno עַם kwa kawaida ni “watu.” Katika simulizi la vita linawahusu walio chini ya Amaleki, huenda wapiganaji wake, lakini “watu wake” huhifadhi maana pana ya Kiebrania.
- source_word: לְפִי חָרֶב
  choice: kwa upanga
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kushinda au kuua kwa kutumia upanga. “Kwa upanga” ni tafsiri ya Kiswahili iliyo wazi na ya kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Basi” linaendeleza simulizi, huku “akawashinda” likihifadhi matokeo ya ushindi bila kuzidisha maana kuwa maangamizi kamili.
