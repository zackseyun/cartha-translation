id: EXO.17.14
reference: Exodus 17:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה כְּתֹ֨ב זֹ֤את זִכָּרוֹן֙ בַּ/סֵּ֔פֶר וְ/שִׂ֖ים בְּ/אָזְנֵ֣י יְהוֹשֻׁ֑עַ כִּֽי מָחֹ֤ה אֶמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/014.yaml
  text: Then Yahweh said to Moses[a], “Write this as a memorial in the book, and put it in Joshua’s hearing[c][b], for I will surely blot out the remembrance of Amalek from under heaven.”
translation:
  language: sw
  text: Ndipo Yahwe akamwambia Musa, “Andika jambo hili katika kitabu[a] liwe ukumbusho, na ulitie masikioni mwa Yoshua[b], kwa maana nitafuta kabisa[c] kumbukumbu ya Amaleki kutoka chini ya mbingu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika kitabu fulani” au “katika hati ya kukunjwa”; kihalisi Kiebrania kina “katika kile kitabu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ulitie masikioni mwa Yoshua,” yaani, hakikisha Yoshua analisikia au umsomee.
    reason: lexical_alternative
  - marker: c
    text: Usemi wa Kiebrania unaotafsiriwa “nitafuta kabisa” una msisitizo mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limehifadhiwa kama jina binafsi, kwa tahajia inayotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: כְּתֹב
  choice: Andika
  rationale: Hii ni amri ya moja kwa moja na ndiyo maana ya kawaida ya kitenzi כתב.
- source_word: זֹאת זִכָּרוֹן
  choice: jambo hili ... liwe ukumbusho
  rationale: Muundo huu unaonyesha kuwa jambo hilo liandikwe kwa kusudi la kukumbusha; ‘ukumbusho’ ni Kiswahili cha kawaida na huhifadhi nguvu ya זִכָּרוֹן.
- source_word: בַּסֵּפֶר
  choice: katika kitabu
  rationale: ‘Kitabu’ huhifadhi maana ya msingi ya סֵפֶר bila kulazimisha kuwa kilikuwa hati ya kukunjwa; kibainishi cha Kiebrania na uwezekano wa tafsiri nyingine vimeelezwa katika tanbihi.
- source_word: וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  choice: na ulitie masikioni mwa Yoshua
  rationale: Tafsiri hii inadumisha taswira ya nahau ya Kiebrania, ‘tia masikioni,’ huku muktadha ukionyesha kwamba Yoshua anapaswa kuambiwa na kulisikia jambo hilo.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hii ndiyo tahajia ya jina hili inayofaa katika Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inaanzisha sababu au maelezo yanayounga mkono amri iliyotangulia.
- source_word: מָחֹה אֶמְחֶה
  choice: nitafuta kabisa
  rationale: Kielezi ‘kabisa’ kinawasilisha msisitizo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi kamili katika Kiebrania.
- source_word: זֵכֶר עֲמָלֵק
  choice: kumbukumbu ya Amaleki
  rationale: ‘Kumbukumbu’ huhifadhi wazo la kile kinachokumbukwa kuhusu Amaleki na mwangwi wa kimakusudi wa ‘ukumbusho’ uliotajwa mapema katika mstari.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: kutoka chini ya mbingu
  rationale: Hii huhifadhi nahau ya Kiebrania inayoonyesha kuondolewa kabisa katika ulimwengu ulio chini ya mbingu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi yana tetragramatoni יְהוָה. Kutumia ‘Yahwe’ huhifadhi jina binafsi la Mungu badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. Muundo wa masimulizi ‘Ndipo ... akamwambia’ ni wa kawaida katika simulizi za kibiblia. Nahau ya ‘kutia masikioni’ imehifadhiwa kwa sababu inaeleweka kutokana na muktadha na inaelezwa katika tanbihi; msisitizo wa ahadi ya Mungu umeonyeshwa kwa ‘kabisa.’
