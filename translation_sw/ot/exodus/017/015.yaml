  text: And Moses built an altar and called its name[a], “Yahweh Is My Banner.”
translation:
  language: sw
  text: Musa akajenga madhabahu, akaipa jina[a], “Yahwe ni Bendera Yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania: “YHWH bendera yangu,” yaani, “Yahwe ni Bendera Yangu”; pia huweza kutafsiriwa, “BWANA ni Bendera Yangu.” Inaelekea jina hili linamaanisha kwamba Yahwe ndiye bendera au alama ambayo Israeli hukusanyika chini yake na ambayo huashiria ushindi wao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: akajenga
  rationale: Kitenzi בנה katika mfululizo wa masimulizi kina maana ya moja kwa moja ya kujenga; “akajenga” ni Kiswahili cha kawaida na huhifadhi tendo halisi.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: מִזְבֵּחַ ni mahali pa kutoa dhabihu au pa ibada ya ukumbusho; “madhabahu” ndilo neno sanifu la kibiblia na la kawaida katika Kiswahili.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: na kuyaita
  rationale: Nahau ya Kiebrania ni “akaliita jina lake.” Kwa kuwa “madhabahu” hutumiwa katika ngeli ya 6 kwa kawaida, “kuyaita” huwasilisha tendo la kuyapa jina kwa Kiswahili cha asili bila kupoteza maana.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limewasilishwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo “BWANA,” ili kuhifadhi jina binafsi lililo katika matini.
- source_word: נִסִּי
  choice: ni Bendera Yangu
  rationale: נֵס humaanisha bendera, ishara, au alama ya kukusanyikia. Kitenzi “ni” kimeongezwa kwa kawaida katika kishazi kisicho na kitenzi cha Kiebrania, na “Bendera Yangu” huhifadhi sitiari ya kukusanyika na ushindi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה katika jina la ukumbusho la madhabahu
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ina Tetragramatoni moja kwa moja. Kutumia “Yahwe” huhifadhi jina la agano badala ya kulibadilisha kwa cheo, huku tanbihi ikionyesha mbadala wa kimapokeo.
- issue: Maana ya jina יהוה נסי
  choice: “Yahwe ni Bendera Yangu”
  alternative: “Yahwe ni Alama Yangu ya Vita”
  rationale: “Bendera” huhifadhi picha pana ya נֵס kama ishara au bendera ya kukusanyikia, bila kuifanya maana iwe ya kijeshi pekee kuliko inavyodai matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi ni rahisi na wa kawaida; jina la madhabahu limeandikwa kama cheo ili kuonyesha kuwa ni jina rasmi.
