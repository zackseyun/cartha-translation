  yaml_path: translation/ot/exodus/017/008.yaml
  text: Then Amalek came and fought with Israel at Rephidim[a].
translation:
  language: sw
  text: Kisha Amaleki akaja, akapigana na Israeli huko Refidimu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kisha ... akaja
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida, huku “akaja” ikihifadhi maana rahisi ya בוא.
- source_word: עֲמָלֵק
  choice: Amaleki
  rationale: Jina limetoholewa kwa umbo linalotambulika katika Kiswahili. Katika muktadha linawakilisha kwa pamoja watu wa Amaleki, lakini umoja wa jina na wa vitenzi umehifadhiwa.
- source_word: וַיִּלָּחֶם
  choice: akapigana
  rationale: Niphal ya לחם hapa ina maana ya kupigana au kufanya vita; “akapigana” ni usemi wa kawaida na wa moja kwa moja katika simulizi.
- source_word: עִם
  choice: na
  rationale: “Na” ni tafsiri ya kawaida ya עִם na katika kirai “kupigana na” huonyesha wazi kushindana vitani bila kulazimika kubadili kihusishi kuwa “dhidi ya.”
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Umbo la kawaida la Kiswahili kwa jina la watu au taifa la agano.
- source_word: בִּרְפִידִם
  choice: huko Refidimu
  rationale: בְּ inaonyesha mahali. “Huko Refidimu” ni ya asili kwa eneo la tukio na hutofautisha jina la mahali na taifa la Israeli.
