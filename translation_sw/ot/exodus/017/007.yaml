  yaml_path: translation/ot/exodus/017/007.yaml
  text: And he called the name of the place Massah and Meribah[a], because of the quarreling of the sons of Israel and because they tested Yahweh, saying[c][b], “Is Yahweh among us or not?”
translation:
  language: sw
  text: Akaita mahali hapo Masa na Meriba[a], kwa sababu ya ugomvi wa wana wa Israeli[b], na kwa sababu walimjaribu Yahwe kwa kusema, “Je, Yahwe yuko miongoni mwetu[c] au hayuko?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Masa linasikika kama neno la Kiebrania linalomaanisha “kujaribu,” na Meriba kama neno linalomaanisha “ugomvi” au “mabishano.”
    reason: lexical_alternative
  - marker: b
