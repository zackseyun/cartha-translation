lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: Akapa mahali pale jina
  rationale: Huwasilisha tendo la kupaita mahali jina kwa Kiswahili cha asili, huku likidumisha dhana ya wazi ya שֵׁם, ‘jina.’
- source_word: מַסָּה וּמְרִיבָה
  choice: Masa na Meriba
  rationale: Majina ya mahali yamenukuliwa kwa matamshi ya Kiswahili; maana zake zinazohusiana na ‘kujaribu’ na ‘ugomvi’ zimeelezwa katika tanbihi.
- source_word: עַל רִיב
  choice: kwa sababu ya ugomvi
  rationale: עַל inaonyesha sababu ya kupaita mahali, na רִיב hapa ni ugomvi au mabishano.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi muundo wa Kiebrania kwa namna inayoeleweka katika Kiswahili; katika muktadha huu ni jina la kijumla la watu wa Israeli.
- source_word: וְעַל נַסֹּתָם אֶת יְהוָה
  choice: na kwa sababu walimjaribu Yahwe
  rationale: Kitenzi נסה katika piel humaanisha kumjaribu au kumtia katika jaribu; Yahwe ndiye mtendwa wa tendo hilo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limenukuliwa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: לֵאמֹר
  choice: kwa kusema
  rationale: Huanzisha maneno yenyewe ambayo kwayo watu walimjaribu Yahwe.
- source_word: הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן
  choice: Je, Yahwe yuko katikati yetu au hayuko?
  rationale: ‘Katikati yetu’ hufuata maana ya בְּקִרְבֵּנוּ, na ‘au hayuko’ huwasilisha kwa uwazi mkabala wa אִם אָיִן.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina la agano lenyewe, si cheo; kwa hiyo jina limedumishwa bila kuingiza desturi ya kulibadilisha kuwa ‘BWANA.’
- issue: Maana ya בְּנֵי יִשְׂרָאֵל kama jina la kijumla
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: ‘Wana wa Israeli’ hudumisha nahau ya chanzo, lakini tanbihi inaonyesha kwamba hapa inawahusu watu wa Israeli kwa ujumla, bila kuibana maana kwa wana wa kiume pekee.
- issue: Swali kuhusu kuwapo kwa Yahwe בְּקִרְבֵּנוּ
  choice: Yahwe yuko katikati yetu
  alternative: Yahwe yuko miongoni mwetu
  rationale: ‘Katikati yetu’ huhifadhi picha ya kuwapo kwa Mungu ndani ya jumuiya bila kufafanua zaidi aina ya kuwapo huko.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa Kiebrania wa kupaita mahali jina na mvutano wa swali la watu kuhusu kuwapo kwa Yahwe vimedumishwa bila kulainishwa kitheolojia.
