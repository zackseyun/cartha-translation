  text: Kisha Musa, Haruni, Nadabu, Abihu, na wazee sabini wa Israeli wakapanda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה kinaonyesha mwendo wa kwenda juu. “Akapanda” ni Kiswahili cha kawaida na huhifadhi mwelekeo huo bila kuongeza “mlimani,” ambalo linaeleweka kutokana na muktadha lakini halitajwi wazi katika mstari huu.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: וְאַהֲרֹן
  choice: pamoja na Haruni
  rationale: Kiunganishi cha Kiebrania kinaunganisha Haruni na Musa kama waliohusika katika kupanda. “Pamoja na” huleta sentensi ya asili ya Kiswahili bila kubadili uhusiano huo.
- source_word: נָדָב
  choice: Nadabu
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וַאֲבִיהוּא
  choice: Abihu
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וְשִׁבְעִים
  choice: na ... sabini
  rationale: Huhifadhi uratibu wa Kiebrania na idadi kamili ya watu waliotajwa.
- source_word: מִזִּקְנֵי
  choice: wazee sabini wa
  rationale: 'מן hapa ina maana ya sehemu ya kundi: sabini kutoka miongoni mwa wazee. Kiswahili cha kawaida huwasilisha hilo kwa “wazee sabini wa Israeli.”'
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la kawaida la taifa; hapa linawatambulisha wazee kuwa wa Israeli.
