  yaml_path: translation/ot/exodus/024/018.yaml
  text: Moses entered into the midst of the cloud and went up the mountain[a]. And Moses was on the mountain forty days and forty nights.
translation:
  language: sw
  text: Musa akaingia katikati ya lile wingu,[a] akapanda mlimani. Musa alikuwa mlimani siku arobaini na usiku arobaini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndani ya lile wingu” au “katika lile wingu.” Kiebrania kinasisitiza kwamba Musa aliingia ndani ya wingu lenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaingia
  rationale: Kitenzi בוא katika muktadha huu kinaonyesha Musa akiingia ndani ya wingu; “akaingia” ni cha kawaida na huhifadhi mwendo huo.
- source_word: בְּתוֹךְ
  choice: katikati ya
  rationale: תּוֹךְ huelekeza kwenye sehemu ya ndani au kati; “katikati ya” husisitiza kwamba Musa aliingia ndani ya wingu lenyewe.
- source_word: הֶעָנָן
  choice: lile wingu
  rationale: עָנָן ni “wingu,” na kiashiria “lile” hulitambulisha kama wingu lililotajwa tayari katika simulizi bila kuongeza sifa isiyokuwapo katika Kiebrania.
- source_word: וַיַּעַל אֶל הָהָר
  choice: akapanda mlimani
  rationale: עלה pamoja na אֶל הָהָר huonyesha kupanda kuelekea na kuingia katika eneo la mlima; “akapanda mlimani” ni Kiswahili cha asili na hudumisha mwendo wa kuelekea juu.
- source_word: וַיְהִי מֹשֶׁה בָּהָר
  choice: Musa akawa mlimani
  rationale: היה hapa inaeleza hali na mahali pa Musa kwa muda fulani; “akawa” ni ya moja kwa moja na haiongezi maana ya kubaki ambayo haijasemwa wazi.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: siku arobaini mchana na usiku
  rationale: Katika Kiswahili, “siku arobaini mchana na usiku” huwasilisha kwa kawaida muda wa siku arobaini na usiku arobaini bila kurudia namba kwa namna nzito.
theological_decisions:
- issue: Taswira ya wingu inayohusishwa na uwepo wa Mungu
  choice: lile wingu
  alternative: lile wingu zito
  rationale: Kiebrania kina nomino ya kawaida עָנָן yenye kibainishi, bila kivumishi cha “zito.” Tafsiri huhifadhi taswira ya simulizi bila kuipanua kitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini rahisi kueleweka. Muundo wa vitenzi mfululizo “akaingia ... akapanda” unafaa simulizi. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
