id: EXO.24.14
reference: Exodus 24:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶל הַ/זְּקֵנִ֤ים אָמַר֙ שְׁבוּ לָ֣/נוּ בָ/זֶ֔ה עַ֥ד אֲשֶׁר נָשׁ֖וּב אֲלֵי/כֶ֑ם וְ/הִנֵּ֨ה אַהֲרֹ֤ן וְ/חוּר֙ עִמָּ/כֶ֔ם מִי בַ֥עַל דְּבָרִ֖ים יִגַּ֥שׁ אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/014.yaml
  text: And to the elders he said[a], “Wait here for us until we return to you. And look, Aaron and Hur are with you. Whoever has a dispute, let him approach them.”
translation:
  language: sw
  text: Naye akawaambia wazee, “Tungojeeni hapa mpaka tutakaporudi kwenu. Tazama, Aroni na Huri wako pamoja nanyi. Yeyote aliye na mgogoro[a] na awaendee wao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliye na shauri.”
    reason: Nahau ya Kiebrania בַעַל דְּבָרִים inaweza kumaanisha mtu mwenye mgogoro au mwenye shauri la kuamuliwa.
lexical_decisions:
- source_word: הַזְּקֵנִים
  choice: wazee
  rationale: Katika muktadha huu neno hilo linamaanisha wazee wanaotambuliwa kuwa viongozi wa jumuiya, si watu wenye umri mkubwa tu.
- source_word: שְׁבוּ לָנוּ בָזֶה
  choice: Tungojeeni hapa
  rationale: Ingawa kitenzi ישׁב kwa msingi kina maana ya kukaa au kubaki, hapa agizo ni wabaki mahali hapo wakisubiri kurudi kwa Musa na mwenzake; Kiswahili hiki ni cha kawaida na huhifadhi maana hiyo.
- source_word: עַד אֲשֶׁר נָשׁוּב אֲלֵיכֶם
  choice: mpaka tutakaporudi kwenu
  rationale: Huwakilisha moja kwa moja kifungu cha wakati na wazo la kurudi kwao waliko wazee.
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa jambo linalofuata; “Tazama” ni la heshima, linaeleweka, na si la kizamani kupita kiasi.
- source_word: עִמָּכֶם
  choice: wako pamoja nanyi
  rationale: Huhifadhi maana ya uwepo na ushirika unaoonyeshwa na עִם.
- source_word: מִי בַעַל דְּבָרִים
  choice: Yeyote aliye na mgogoro
  rationale: Nahau hii humaanisha mtu mwenye suala la kisheria, dai, au mgogoro. “Aliye na mgogoro” huwasilisha kwa uwazi mazingira ya uamuzi wa mashauri huku tanbihi ikihifadhi uwezekano wa “shauri.”
- source_word: יִגַּשׁ אֲלֵהֶם
  choice: na awaendee wao
  rationale: 'Kauli hii huonyesha nguvu ya agizo au ruhusa ya kijusivu: mhusika anapaswa kwenda kwa Aroni na Huri ili suala lake lishughulikiwe.'
theological_decisions:
- issue: Umoja wa kijumla katika agizo la kisheria
  choice: Yeyote aliye na mgogoro na awaendee wao
  alternative: Wote walio na migogoro wawaendee
  rationale: Kiebrania kina mhusika wa umoja wa kijumla (מִי ... יִגַּשׁ). Kiswahili “yeyote” huhifadhi umoja huo bila kulazimisha jinsia ambayo sarufi ya Kiswahili haiihitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa. “Tazama” hudumisha kishazi cha kuvuta fikira, na majina Aroni na Huri yanafuata maumbo yaliyozoeleka katika Biblia za Kiswahili.
