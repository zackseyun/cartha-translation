base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/004.yaml
  text: And Moses wrote down all the words of Yahweh[a]. He rose early in the morning and built an altar at the foot of the mountain[b], and twelve pillars for the twelve tribes of Israel.
translation:
  language: sw
  text: Musa akaandika maneno yote ya Yahweh. Akaamka mapema asubuhi, akajenga madhabahu mguuni mwa mlima[a], na akasimamisha nguzo kumi na mbili[b] kwa ajili ya makabila kumi na mawili ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “chini ya mlima,” yaani, mguuni au kwenye msingi wa mlima.
    reason: lexical_alternative
  - marker: b
    text: Au, “mawe yaliyosimamishwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: akaandika
  rationale: Kitenzi כתב humaanisha ‘kuandika.’ ‘Akaandika’ ni tafsiri ya moja kwa moja na ya kawaida; muktadha unaonyesha kwamba Musa aliyaweka maneno hayo katika maandishi.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: maneno yote ya Yahweh
  rationale: דִּבְרֵי hapa hurejelea yale yaliyosemwa na Yahweh. ‘Maneno’ huhifadhi maana pana ya Kiebrania bila kuyafafanua kwa namna finyu kuwa amri pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: Akaamka asubuhi na mapema
  rationale: Muundo huu wa Kiebrania unamaanisha kuamka mapema; ‘asubuhi na mapema’ ni usemi wa kawaida wa Kiswahili unaohifadhi msisitizo wa wakati.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: akajenga madhabahu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya בנה pamoja na מזבח.
- source_word: תַּחַת הָהָר
  choice: kwenye sehemu ya chini ya mlima
  rationale: Kihalisi ni ‘chini ya mlima,’ lakini katika muktadha wa mahali usemi huu unaonyesha sehemu ya chini au mwanzo wa mlima. Tafsiri iliyochaguliwa inaeleweka kwa urahisi katika Kiswahili bila kudokeza kwamba madhabahu ilikuwa chini ya ardhi.
- source_word: וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה
  choice: na nguzo kumi na mbili
  rationale: מַצֵּבָה ni kitu kilichosimamishwa, kwa kawaida jiwe au nguzo ya ukumbusho. ‘Nguzo’ ni fupi na ya asili katika sentensi, huku tanbihi ikihifadhi uwezekano wa ‘mawe yaliyosimamishwa.’
- source_word: לִשְׁנֵים עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: kwa ajili ya makabila kumi na mawili ya Israeli
  rationale: Kihusishi ל kinaonyesha uhusiano au uwakilishi wa nguzo hizo kwa makabila. ‘Kwa ajili ya’ huhifadhi uhusiano huo bila kuongeza wazi neno ‘kuwakilisha,’ ambalo halipo moja kwa moja katika matini.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ya Kiebrania hutumia jina la agano יְהוָה moja kwa moja. ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Mfululizo wa vitenzi vya ‘aka-’ unaendeleza simulizi kwa njia ya kawaida. Alama zote za tanbihi zimewekwa mahali zinapohusika na maana yake, bila kufuata mkanganyiko wa alama katika safu ya Kiingereza.
