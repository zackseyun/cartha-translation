  source_fidelity: 'Tafsiri inafuata kwa uaminifu Kiebrania: utukufu wa Yahwe unakaa juu ya Mlima Sinai, wingu linafunika kirejelewa cha umoja wa kiume ambacho kinaweza kuwa mlima au utukufu, muda ni siku sita, na Yahwe anamwita Musa siku ya saba kutoka ndani/katikati ya wingu. Utata wa kiambishi katika וַיְכַסֵּהוּ umehifadhiwa kwa kawaida katika Kiswahili.'
