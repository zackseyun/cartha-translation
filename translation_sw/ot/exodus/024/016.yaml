id: EXO.24.16
reference: Exodus 24:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁכֹּ֤ן כְּבוֹד יְהוָה֙ עַל הַ֣ר סִינַ֔י וַ/יְכַסֵּ֥/הוּ הֶ/עָנָ֖ן שֵׁ֣שֶׁת יָמִ֑ים וַ/יִּקְרָ֧א אֶל מֹשֶׁ֛ה בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י מִ/תּ֥וֹךְ הֶ/עָנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/016.yaml
  text: And the glory of Yahweh settled on Mount Sinai[a], and the cloud covered it for six days[b]. On the seventh day he called to Moses from the midst of the cloud.
translation:
  language: sw
  text: Utukufu wa Yahwe ukakaa juu ya Mlima Sinai, na wingu likaufunika[a] kwa siku sita. Siku ya saba, akamwita Musa kutoka katikati ya wingu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiambishi “-u-” kinaweza kurejelea Mlima Sinai au utukufu wa Yahwe; kwa hiyo, inawezekana pia kuelewa kuwa wingu liliufunika utukufu.
    reason: alternative_reading
  - marker: b
    text: Au, “kutoka ndani ya wingu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: ukakaa
  rationale: Kitenzi שכן kinaonyesha kukaa au kuweka makao mahali. “Ukakaa” ni cha kawaida na chenye hadhi, na kinaonyesha utukufu wa Yahwe ukitulia juu ya mlima bila kutumia lugha ya kizamani.
- source_word: כְּבוֹד יְהוָה
  choice: Utukufu wa Yahwe
  rationale: “Utukufu” ni neno la kawaida la Kiswahili kwa כָּבוֹד katika muktadha wa kudhihirika kwa fahari na uwepo wa Mungu. Muundo wa “wa Yahwe” unawakilisha hali ya uhusiano katika Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia inayosomeka kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: עַל הַר סִינַי
  choice: juu ya Mlima Sinai
  rationale: Hii inahifadhi wazi uhusiano wa mahali unaoonyeshwa na עַל na ni usemi wa kawaida wa Kiswahili.
- source_word: וַיְכַסֵּהוּ
  choice: likaufunika
  rationale: Kiambishi cha yambwa “-u-” kinaweza kurejelea “Mlima Sinai” au “utukufu,” kama vile kiambishi cha Kiebrania kinavyoweza kueleweka kwa njia hizo mbili. Tafsiri kwa hiyo haiamui kimya kimya jambo ambalo matini inaacha wazi.
- source_word: הֶעָנָן
  choice: wingu
  rationale: Nomino hii inarejelea wingu la udhihirisho wa Mungu linalojulikana katika simulizi. Kiswahili hakihitaji kionyeshi cha ziada ili kuwasilisha ufasaha huo hapa.
- source_word: שֵׁשֶׁת יָמִים
  choice: kwa siku sita
  rationale: “Kwa” huwasilisha muda kwa Kiswahili cha kawaida, huku “siku sita” ikifuata maana ya moja kwa moja ya Kiebrania.
- source_word: וַיִּקְרָא אֶל מֹשֶׁה
  choice: akamwita Musa
  rationale: “Kumwita” ni tafsiri pana na ya kawaida ya קרא אל katika muktadha huu; haiingizi wazo la ziada la kuamuru au kutangaza.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Siku ya saba
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi nambari ya mpangilio na mahusiano ya wakati.
- source_word: מִתּוֹךְ הֶעָנָן
  choice: kutoka katikati ya wingu
  rationale: “Katikati” huhifadhi picha ya sauti inayotoka ndani ya wingu, iliyo katika מִתּוֹךְ, kuliko tafsiri isiyo bayana ya “kutoka winguni.”
theological_decisions:
- issue: Mtendaji wa kitenzi “akamwita”
  choice: Kiwakilishi cha nafsi kimeachwa ndani ya umbo la kitenzi, kikieleweka kwa kawaida kuwa Yahwe ndiye aliyemwita Musa.
  alternative: “Utukufu wa Yahwe” unaweza kueleweka kimetonimia kuwa mtendaji.
  rationale: Muktadha mpana wa tukio la Sinai unaonyesha Yahwe ndiye anayesema, lakini kurudia jina lake katika tafsiri kungeweka wazi zaidi ya Kiebrania. Umbo “akamwita” linahifadhi mtiririko na kiwango cha uwazi cha matini.
- issue: Kirejelewa cha kiambishi katika וַיְכַסֵּהוּ
  choice: Mlima Sinai ndio kirejelewa kinachoelekea zaidi, lakini tafsiri ya Kiswahili inadumisha uwezekano wa kurejelea utukufu.
  alternative: Wingu liliufunika utukufu wa Yahwe.
  rationale: Mlima ni kirejelewa kinachofaa katika picha ya simulizi, lakini “mlima” na “utukufu” zote huchukua kiambishi cha yambwa “-u-” katika Kiswahili. Hivyo “likaufunika” huhifadhi kwa kawaida utata halisi wa Kiebrania, ambao umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisasa, wa kawaida na wenye hadhi. Viunganishi vya masimulizi “uka-/lika-/aka-” vinadumisha mwendo wa mfululizo wa vitenzi vya Kiebrania. Tahajia “Yahwe” inafaa mfumo wa sauti wa Kiswahili huku ikihifadhi jina binafsi la Mungu.
