base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/017.yaml
  text: And the appearance of the glory of Yahweh was like a consuming fire on the top of the mountain in the sight of the sons of Israel[a][b].
translation:
  language: sw
  text: Na mwonekano wa utukufu wa Yahwe ulikuwa kama moto unaoteketeza[a] juu ya kilele cha mlima, mbele ya macho ya wana wa Israeli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moto ulao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Waisraeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה
  choice: kuonekana
  rationale: Nomino hii inaeleza sura au hali iliyoonekana. “Kuonekana” ni ya kawaida katika Kiswahili na inadumisha mkazo wa jambo lililoonekana bila kudokeza maono ya kinabii.
- source_word: כְּבוֹד
  choice: utukufu
  rationale: Katika muktadha wa uwepo wa Mungu unaodhihirika, “utukufu” ndiyo tafsiri ya kawaida na inayofaa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: כְּאֵשׁ
  choice: kama moto
  rationale: Kiambishi כְּ kinaonyesha ulinganisho; “kama moto” kinahifadhi tashbihi hiyo waziwazi.
- source_word: אֹכֶלֶת
  choice: uteketezao
  rationale: Kitenzi אכל kwa maana halisi ni kula, lakini kinapotumiwa kuhusu moto hueleza moto unaoteketeza. “Uteketezao” ni Kiswahili cha asili na kinawasilisha nguvu ya moto huo.
- source_word: בְּרֹאשׁ
  choice: juu ya kilele
  rationale: Kirai hiki kinaonyesha sehemu ya juu kabisa ya mlima. “Juu ya kilele” kinaweka wazi mahali moto ulipoonekana.
- source_word: הָהָר
  choice: mlima
  rationale: Katika muktadha huu הַר unarejelea mlima, yaani Sinai.
- source_word: לְעֵינֵי
  choice: mbele ya macho ya
  rationale: Tafsiri hii inadumisha taswira halisi ya macho na maana ya jambo kuonekana waziwazi na watu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: “Wana wa Israeli” linaakisi kwa karibu muundo wa Kiebrania na linatunza jina la agano, huku “Waisraeli” likibaki chaguo la kawaida zaidi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko lina jina la Mungu moja kwa moja. “Yahwe” linahifadhi jina hilo katika umbo linalofaa Kiswahili badala ya kulibadilisha kuwa cheo.
- issue: Maana ya בְּנֵי יִשְׂרָאֵל kama jina la watu wa agano
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Tafsiri kuu inadumisha muundo wa Kiebrania wenye nomino ya kiume ya wingi, bila kuficha kwamba katika muktadha kirai kinawataja watu wa Israeli kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wazi, na unaosomeka kwa urahisi. Muundo wa sentensi unafuata kwa karibu ushahidi wa Kiebrania, lakini umetolewa kwa Kiswahili cha kawaida. “Mbele ya macho ya” kimetumiwa kwa makusudi kuhifadhi msisitizo wa kuona uliopo katika לְעֵינֵי.
