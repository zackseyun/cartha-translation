  terminology: “Utukufu,” “Yahwe,” “kilele cha mlima,” and “wana wa Israeli” are appropriate. The revision preserves “wana wa Israeli” as a close formal representation of בְּנֵי יִשְׂרָאֵל, without claiming that the phrase excludes the wider Israelite people in context.
