  yaml_path: translation/ot/exodus/024/002.yaml
  text: Moses alone shall come near to Yahweh[a], but they shall not come near, and the people shall not go up with him.
translation:
  language: sw
  text: Musa peke yake atamkaribia Yahweh[a]; lakini wao hawatamkaribia, wala watu hawatapanda pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa Yahweh.”'
    reason: Hufafanua kifungu cha Kiebrania אֶל יְהוָה kinachotafsiriwa katika maandishi makuu.
lexical_decisions:
- source_word: וְנִגַּשׁ
  choice: atamkaribia
  rationale: Kitenzi נגשׁ humaanisha kukaribia au kusogea karibu. Wakati ujao katika Kiswahili unaendeleza muundo wa Kiebrania na, katika muktadha huu wa maagizo, una nguvu ya kuelekeza.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: לְבַדּוֹ
  choice: peke yake
  rationale: Huonyesha wazi kwamba Musa, wala si mwingine, ndiye anayepaswa kukaribia.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: Kihusishi אֶל kinaonyesha kuelekea kwa Yahweh; katika Kiswahili, kiambishi cha yambwa katika 'atamkaribia' tayari huwasilisha uhusiano huo kwa njia ya asili.
- source_word: וְהֵם לֹא יִגָּשׁוּ
  choice: lakini wao hawatamkaribia
  rationale: Kiwakilishi kinarejelea kundi lililotajwa katika muktadha uliotangulia. Kurudia 'karibia' kunahifadhi ulinganifu na tofauti kati yao na Musa.
- source_word: וְהָעָם לֹא יַעֲלוּ
  choice: wala watu hawatapanda
  rationale: עלה hapa ni kwenda juu, yaani kupanda mlimani. 'Wala' huonyesha katazo la ziada kwa Kiswahili cha asili.
- source_word: עִמּוֹ
  choice: pamoja naye
  rationale: Hurejelea Musa na kuonyesha kwamba watu hawaruhusiwi kupanda mlimani akiwa pamoja nao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano YHWH. 'Yahweh' hulitambulisha kama jina maalumu bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo unahifadhi marudio ya kitenzi 'karibia,' tofauti kati ya Musa na wengine, na mwendo wa kupanda mlimani.
