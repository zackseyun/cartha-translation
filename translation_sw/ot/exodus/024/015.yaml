  yaml_path: translation/ot/exodus/024/015.yaml
  text: Then Moses went up onto the mountain[a], and the cloud covered the mountain.
translation:
  language: sw
  text: Kisha Musa akapanda mlimani[a], na wingu likaufunika mlima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Musa akapanda kuelekea mlima.” Kiunganishi cha simulizi cha Kiebrania kinaweza kutafsiriwa “na” badala ya “kisha,” na אֶל inaweza kumaanisha “kwenye/kuelekea” au, pamoja na kitenzi “kupanda,” mwendo wa kwenda juu ya mlima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה humaanisha kwenda juu au kupanda. “Akapanda” ni Kiswahili cha kawaida kinachohifadhi mwendo wa kuelekea juu pamoja na mfuatano wa simulizi unaoonyeshwa na וַ.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia na matumizi ya Kiswahili.
- source_word: אֶל
  choice: mlimani
  rationale: Pamoja na kitenzi cha kupanda na nomino “mlima,” kiambishi cha mahali -ni kinaeleza kwa kawaida mwendo wa kuelekea juu ya mlima. Kiebrania kinaweza pia kueleweka kuwa “kwenda kwenye mlima,” jambo lililohifadhiwa katika tanbihi.
- source_word: הָהָר
  choice: mlima
  rationale: הַר kwa kawaida humaanisha mlima au kilima; katika muktadha wa Sinai, “mlima” ndilo chaguo linalofaa.
- source_word: וַיְכַס
  choice: likaufunika
  rationale: כסה humaanisha kufunika. Umbo “likaufunika” linahifadhi maana hiyo na kuendeleza mfuatano wa simulizi.
- source_word: הֶעָנָן
  choice: lile wingu
  rationale: Nomino ni ya wazi na inarejelea wingu lililotajwa katika muktadha. “Lile wingu” ni marejeo ya kawaida na ya asili katika Kiswahili.
- source_word: אֶת
  choice: '[kiashiria cha yambwa tendwa hakitafsiriwi moja kwa moja]'
  rationale: Kiashiria hiki cha Kiebrania hakina neno la moja kwa moja katika Kiswahili; uhusiano wa yambwa unaonyeshwa na sarufi ya “likaufunika mlima.”
- source_word: וַ
  choice: Kisha / na
  rationale: Viambishi vya וַ vinaendeleza simulizi. “Kisha” katika kishazi cha kwanza huonyesha mfuatano, na “na” huunganisha tukio linalofuata bila kulazimisha ufafanuzi zaidi.
theological_decisions:
- issue: Asili au umuhimu wa wingu
  choice: Kutafsiri kwa maelezo tu kama “lile wingu,” bila kuongeza kwamba ni utukufu wa Mungu au wingu la BWANA.
  alternative: “wingu la utukufu” au “wingu la BWANA”
  rationale: Kiebrania katika mstari huu hutaja “wingu” pekee. Ingawa muktadha mpana unalihusianisha na uwepo wa Mungu, tafsiri haiongezi maelezo ya kitheolojia ambayo hayajasemwa wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. “Akapanda mlimani” ni usemi wa asili unaobeba mwendo wa kwenda juu; tanbihi huhifadhi uwezekano halisi wa kisarufi wa “kwenye/kuelekea mlima.”
