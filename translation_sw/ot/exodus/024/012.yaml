source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲלֵ֥ה אֵלַ֛/י הָ/הָ֖רָ/ה וֶ/הְיֵה שָׁ֑ם וְ/אֶתְּנָ֨ה לְ/ךָ֜ אֶת לֻחֹ֣ת הָ/אֶ֗בֶן וְ/הַ/תּוֹרָה֙ וְ/הַ/מִּצְוָ֔ה אֲשֶׁ֥ר כָּתַ֖בְתִּי לְ/הוֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/012.yaml
  text: Then Yahweh said to Moses[a], “Come up to me on the mountain and remain there, and I will give you the stone tablets, and the law and the commandment[b], which I have written for their instruction.”
translation:
  language: sw
  text: Kisha Yahwe akamwambia Musa, “Panda uje kwangu mlimani, ukae huko. Nitakupa mabamba ya mawe, na sheria[a] na amri[b], nilizoandika ili kuwafundisha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafundisho” au “maelekezo.” Neno la Kiebrania torah mara nyingi humaanisha mafundisho au maelekezo, si sheria kwa maana finyu tu.
    reason: lexical_alternative
  - marker: b
    text: Maneno “sheria na amri” yanaweza kueleweka kuwa mafundisho mengine ya agano pamoja na mabamba ya mawe, au kuwa maelezo zaidi ya yaliyoandikwa juu ya mabamba hayo.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: עֲלֵה אֵלַי הָהָרָה
  choice: Panda uje kwangu mlimani
  rationale: Kauli hii inahifadhi wito wa kupanda kuelekea mahali alipo msemaji na inaeleza mahali pa kupandwa kwa Kiswahili cha kawaida.
- source_word: וֶהְיֵה שָׁם
  choice: ukae huko
  rationale: Katika muktadha huu, היה pamoja na שָׁם ina maana ya kuendelea kuwapo mahali hapo; ‘ukae huko’ ni ya asili kuliko tafsiri neno kwa neno ‘uwe huko’.
- source_word: לֻחֹת הָאֶבֶן
  choice: mabamba ya mawe
  rationale: ‘Mabamba’ yanaonyesha vitu bapa vilivyoandikiwa, huku ‘ya mawe’ ikihifadhi wazi nyenzo yake.
- source_word: וְהַתּוֹרָה
  choice: na sheria
  rationale: ‘Sheria’ ni neno linalotambulika katika muktadha wa agano la Sinai; tanbihi inahifadhi maana pana ya torah kama mafundisho au maelekezo.
- source_word: וְהַמִּצְוָה
  choice: na amri
  rationale: Umoja wa nomino ya Kiebrania umehifadhiwa kwa ‘amri’ bila kuigeuza kuwa wingi.
- source_word: אֲשֶׁר כָּתַבְתִּי
  choice: nilizoandika
  rationale: Kitenzi kinaonyesha tendo la Mungu la kuandika lililokamilika. Muundo wa Kiswahili unakiunganisha na vitu vilivyotajwa bila kuamua kwa lazima mipaka halisi ya rejea yake.
- source_word: לְהוֹרֹתָם
  choice: ili kuwafundisha
  rationale: Hiphil ya ירה ina maana ya kufundisha au kuelekeza, na kiambishi cha nafsi ya tatu wingi kinawarejelea watu wa Israeli.
theological_decisions:
- issue: Uhusiano wa ‘sheria na amri’ na mabamba ya mawe
  choice: Kutaja kwa uratibu ‘mabamba ya mawe, na sheria na amri’ bila kuunganisha yote kuwa kifungu kimoja cha ufafanuzi.
  alternative: Kuchukulia ‘sheria na amri’ kuwa maelezo ya mabamba pekee, au kuchukulia vitu vyote vitatu kuwa jina moja la Amri Kumi.
  rationale: Kiebrania kina nomino zilizounganishwa kwa viunganishi na hakiamui wazi kama sheria na amri ni maelezo ya yaliyomo mabambani au mafundisho ya ziada ya agano. Tafsiri na tanbihi zinahifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida, huku uratibu wa nomino na utata wa kifungu cha Kiebrania vikihifadhiwa.
