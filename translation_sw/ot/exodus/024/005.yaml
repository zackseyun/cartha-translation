base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/005.yaml
  text: And he sent the young men of the sons of Israel[b][a], and they offered up burnt offerings and sacrificed peace offerings of bulls to Yahweh.
translation:
  language: sw
  text: Kisha akawatuma vijana wa kiume wa Waisraeli[a], nao wakatoa sadaka za kuteketezwa na wakachinja mafahali kuwa dhabihu za amani kwa Yahwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vijana wa wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “dhabihu za ushirika” au “dhabihu za ustawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akawatuma
  rationale: Kitenzi שׁלח katika simulizi kinaeleza kwa urahisi tendo la Musa la kuwatuma; kiambishi cha kitu “-wa-” kinawarejelea vijana.
- source_word: נַעֲרֵי בְּנֵי יִשְׂרָאֵל
  choice: vijana wa wana wa Israeli
  rationale: “Vijana” ni Kiswahili cha kawaida kwa נַעֲרֵי, huku “wana wa Israeli” kikihifadhi kwa karibu muundo wa kiume wa בְּנֵי יִשְׂרָאֵל; mbadala wa kimazoea zaidi umewekwa katika tanbihi.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: wakatoa sadaka za kuteketezwa
  rationale: Muunganiko עלה + עֹלָה ni nahau ya ibada ya kutoa sadaka inayoteketezwa kabisa; “wakatoa” ni ya kawaida na haiongezi wazo lisilokuwamo.
- source_word: וַיִּזְבְּחוּ
  choice: kumchinjia
  rationale: Katika muktadha wa dhabihu, זבח humaanisha kuchinja kama dhabihu. “Kumchinjia Yahwe” linaonyesha wazi anayelengwa na tendo hilo bila kurudia kitenzi “kutoa.”
- source_word: זְבָחִים שְׁלָמִים
  choice: dhabihu za amani
  rationale: Hili ni jina linalotambulika la aina hii ya dhabihu na linahifadhi uhusiano wa שְׁלָמִים na amani/ukamilifu; maana mbadala ya ushirika au hali njema imeonyeshwa katika tanbihi.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama “Yahwe,” tahajia ya kawaida ya Kiswahili inayowakilisha jina lenyewe badala ya kulibadili kuwa cheo.
- source_word: פָּרִים
  choice: mafahali
  rationale: Neno hili linataja wazi wanyama wa kiume waliotolewa; mpangilio wa Kiswahili unaonyesha kwamba mafahali ndio dhabihu za amani.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina la pekee la Mungu. “Yahwe” hulihifadhi moja kwa moja na ni tahajia ya kawaida ya Kiswahili, bila kuligeuza kuwa cheo.
- issue: Usemi wa kijinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” huhifadhi usemi wa kiume wa maandishi ya Kiebrania, ingawa “Waisraeli” ni Kiswahili cha kimazoea zaidi; mbadala huo umehifadhiwa katika tanbihi.
- issue: Maana ya שְׁלָמִים
  choice: dhabihu za amani
  alternative: dhabihu za ushirika au dhabihu za ustawi
  rationale: Neno la Kiebrania ni jina la aina ya dhabihu lenye upana wa maana unaohusisha amani, hali njema na ushirika. Tafsiri kuu inatumia jina linalotambulika, na tanbihi inalinda upana huo bila kuamua maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili huku istilahi za dhabihu na marejeo ya kiume ya Kiebrania yakihifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
