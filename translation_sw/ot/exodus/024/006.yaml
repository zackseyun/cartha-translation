  text: Moses took half of the blood and put it in basins[a], and half of the blood he threw against the altar.
translation:
  language: sw
  text: Musa akachukua nusu ya damu na kuitia katika mabakuli, na nusu ya damu akairushia madhabahu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaipiga juu ya” au “akainyunyiza juu ya madhabahu.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa njia kadhaa katika muktadha wa dhabihu; hapa kinaweza kumaanisha damu kutupwa kwa nguvu kuelekea madhabahu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Kitenzi לקח katika mfululizo huu wa masimulizi kina maana ya kawaida ya kuchukua; umbo la “aka-” linaendeleza mtiririko wa matendo.
- source_word: חֲצִי הַדָּם
  choice: nusu ya damu
  rationale: Huhifadhi wazi maana ya sehemu ya kiasi chote cha damu.
- source_word: וַיָּשֶׂם
  choice: na kuitia
  rationale: שׂים ni kitenzi cha jumla cha kuweka kitu mahali; “kuitia” ni ya asili kwa kuweka kimiminika ndani ya vyombo.
- source_word: בָּאַגָּנֹת
  choice: katika mabakuli
  rationale: אַגָּנֹת ni vyombo vya kushikilia kimiminika; “mabakuli” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: זָרַק
  choice: akairushia
  rationale: Katika muktadha wa dhabihu, זרק huonyesha damu kutupwa au kurushwa kuelekea kwenye madhabahu, si lazima kunyunyizwa kwa matone madogo.
- source_word: עַל הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Kwa muundo wa Kiswahili “akairushia madhabahu,” madhabahu ndiyo shabaha ambayo damu ilitupwa juu yake; maana ya עַל inawasilishwa bila tungo nzito.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo sanifu la jina מֹשֶׁה katika Kiswahili.
theological_decisions:
- issue: Tendo la kutumia damu katika ibada
  choice: akairushia madhabahu
  alternative: akainyunyiza juu ya madhabahu
  rationale: Tafsiri hii inahifadhi nguvu inayoweza kuonyeshwa na זרק katika ibada ya dhabihu, bila kuongeza ufafanuzi wa kimadhehebu. Tanbihi inadumisha uwezekano wa tafsiri nyingine za kitenzi hicho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi wa “aka-” na msamiati wa kawaida lakini wenye hadhi. “Akairushia” huchaguliwa ili kuhifadhi nguvu ya tendo la ibada, huku tanbihi ikitaja tafsiri mbadala halali.
