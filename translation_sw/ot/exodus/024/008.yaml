base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/008.yaml
  text: Then Moses took the blood and threw it on the people[a], and said, “Behold[b], the blood of the covenant that Yahweh has made with you concerning all these words.”
translation:
  language: sw
  text: Kisha Musa akachukua damu, akairusha juu ya watu[a], akasema, “Tazama, hii ndiyo damu ya agano ambalo Yahwe amefanya nanyi kuhusu maneno haya yote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuinyunyiza juu ya watu.” Kitenzi cha Kiebrania humaanisha kihalisi “kurusha” au “kutupa,” lakini katika mazingira ya dhabihu kinaweza kueleza uwekaji wa damu kwa kuinyunyiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akaichukua
  rationale: Ni tafsiri ya kawaida na ya asili ya לקח katika mfululizo wa simulizi; kiambishi -i- kinarejelea damu iliyotajwa.
- source_word: הַדָּם
  choice: ile damu
  rationale: Kibainishi kinaonyesha damu maalumu ya dhabihu iliyotajwa katika muktadha uliotangulia.
- source_word: וַיִּזְרֹק
  choice: kuirusha
  rationale: זרק kimsingi humaanisha kurusha au kutupa, na katika mazingira ya dhabihu inaweza kueleza kuinyunyiza damu kwa tendo la ibada; tafsiri hii inadumisha nguvu halisi ya kitenzi.
- source_word: עַל הָעָם
  choice: juu ya watu
  rationale: עַל hapa ina maana ya mahali au mwelekeo; ‘juu ya watu’ ni Kiswahili cha moja kwa moja.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta fikira kwa tangazo zito; ‘Tazama’ lina hadhi ya kifasihi lakini bado linaeleweka kwa urahisi.
- source_word: דַם הַבְּרִית
  choice: damu ya agano
  rationale: Muundo huu wa nomino mbili umetafsiriwa moja kwa moja ili kuhifadhi uzito wa kiteolojia na mwangwi wake katika maandiko mengine.
- source_word: כָּרַת ... בְּרִית
  choice: amefanya ... agano
  rationale: Ingawa nahau ya Kiebrania ni ‘kukata agano,’ Kiswahili cha kawaida husema ‘kufanya agano’; maana ya nahau inahifadhiwa bila kuleta usemi usio wa kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: עִמָּכֶם
  choice: nanyi
  rationale: Huwakilisha kwa ufupi na kwa kawaida kihusishi pamoja na kiambishi cha nafsi ya pili wingi.
- source_word: עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: kwa msingi wa maneno haya yote
  rationale: עַל linaunganisha agano na maneno au masharti yaliyotangulia; ‘kwa msingi wa’ linaonyesha uhusiano huo bila kubadili דְּבָרִים kuwa ‘masharti’ pekee.
theological_decisions:
- issue: Nahau ya kufanya agano כָּרַת ... בְּרִית
  choice: amefanya ... agano
  alternative: amekata ... agano
  rationale: ‘Kukata agano’ ni tafsiri halisi ya nahau ya Kiebrania lakini si usemi wa kawaida katika Kiswahili. ‘Kufanya agano’ huwasilisha maana kwa usahihi, huku mazingira ya damu yakihifadhi uhusiano wa agano na dhabihu.
- issue: Utoaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ina jina binafsi la Mungu, hivyo limetoholewa badala ya kubadilishwa kuwa cheo.
- issue: Uhusiano wa עַל כָּל הַדְּבָרִים הָאֵלֶּה na agano
  choice: kwa msingi wa maneno haya yote
  alternative: kuhusu maneno haya yote
  rationale: Katika muktadha, maneno yaliyosemwa ndiyo msingi au masharti ya agano. Tafsiri hii inadumisha neno ‘maneno’ na kuonyesha uhusiano huo bila kuufanya kuwa maelezo ya mada tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa sasa. ‘Tazama’ huhifadhi uzito wa tangazo la agano. Jina ‘Yahwe’ limetumiwa kwa יְהוָה. Muundo umewekwa wazi kwa wasomaji wa kawaida bila kufuta picha halisi ya damu wala uhusiano wa maneno yaliyotangulia na agano.
