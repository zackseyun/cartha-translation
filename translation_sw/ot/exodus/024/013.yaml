  text: So Moses arose with Joshua his attendant[a], and Moses went up to the mountain of God.
translation:
  language: sw
  text: Basi Musa akasimama pamoja na Yoshua, msaidizi wake[a], kisha Musa akapanda kwenda kwenye mlima wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumishi wake.” Neno la Kiebrania linaweza kumaanisha mtu anayemhudumia mwingine kwa karibu; hapa huenda linamtaja Yoshua kuwa msaidizi binafsi wa Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akasimama
  rationale: Kitenzi קום hapa kinaendeleza simulizi kwa maana ya kuinuka au kusimama ili kuchukua hatua; “akasimama” ni cha kawaida na hakiongezi wazo la kuondoka lisilosemwa wazi.
- source_word: וִיהוֹשֻׁעַ
  choice: pamoja na Yoshua
  rationale: Kiunganishi cha Kiebrania hapa kinaunganisha Yoshua na Musa kama walioinuka pamoja; “Yoshua” ni umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: מְשָׁרְתוֹ
  choice: msaidizi wake
  rationale: Neno la mzizi שׁרת humaanisha mtu anayehudumu karibu na mwingine. “Msaidizi wake” linaonyesha kazi ya Yoshua ya kumhudumia Musa bila kudokeza utumwa au cheo cha kidini.
- source_word: וַיַּעַל
  choice: akapanda kwenda
  rationale: עלה hapa huonyesha mwendo wa kwenda juu kuelekea mlimani; usemi huu ni wa asili katika Kiswahili na huhifadhi mwelekeo wa mwendo.
- source_word: הַר הָאֱלֹהִים
  choice: mlima wa Mungu
  rationale: Tafsiri hii inafuata kwa karibu muundo wa Kiebrania na kuhifadhi maana takatifu ya mlima huo bila kuufafanua zaidi ya matini.
theological_decisions:
- issue: Uhusiano wa Musa na Yoshua katika מְשָׁרְתוֹ
  choice: Yoshua anaelezwa kuwa msaidizi wa Musa anayemhudumia kwa karibu.
  alternative: Yoshua mtumishi wake.
  rationale: Neno la Kiebrania linaweza kutafsiriwa kwa maana pana ya mtumishi, lakini katika muktadha huu “msaidizi” huepuka dhana ya utumwa na pia haiingizi maana ya cheo cha kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. “Basi” na viambishi vya mfululizo “aka-” vinaendeleza matukio kwa kawaida; tanbihi huhifadhi uwezekano wa tafsiri mbadala wa מְשָׁרְתוֹ.
