  yaml_path: translation/ot/exodus/024/010.yaml
  text: And they saw the God of Israel[a], and under his feet was something like a pavement of sapphire stone[b], like the very heavens in clearness.
translation:
  language: sw
  text: Nao wakamwona Mungu wa Israeli, na chini ya miguu yake kulikuwa na kitu kama sakafu[b] ya jiwe la yakuti samawi[a], safi kama mbingu zenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda “lapis lazuli”; haijulikani kwa hakika neno la Kiebrania סַפִּיר lilimaanisha jiwe gani katika ulimwengu wa kale.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kama kazi ya sakafu ya yakuti samawi”; taswira yake yaweza kuwa ya uso uliotengenezwa kama wa matofali au vigae chini ya miguu yake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: wakamwona
  rationale: Kitenzi cha Kiebrania kinataja kuona moja kwa moja; ‘wakamwona’ ni simulizi la kawaida na halipunguzi uzito wa dai hilo.
- source_word: אֵת אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo huu unamtambulisha moja kwa moja Mungu anayehusishwa na Israeli.
- source_word: וְתַחַת רַגְלָיו
  choice: na chini ya miguu yake kulikuwa na
  rationale: ‘Chini ya miguu yake’ huhifadhi taswira ya kimwili ya maono; ‘kulikuwa na’ huongezwa kwa ufasaha kwa kuwa kishazi cha Kiebrania hakina kitenzi wazi.
- source_word: כְּמַעֲשֵׂה לִבְנַת
  choice: kitu kama sakafu iliyotengenezwa kwa
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la uso uliotengenezwa kama kazi ya matofali au vigae, bila kudokeza tofali moja tu.
- source_word: הַסַּפִּיר
  choice: jiwe la yakuti samawi
  rationale: ‘Yakuti samawi’ ni jina la kawaida la sapphire katika Kiswahili; ‘jiwe’ huweka wazi kwamba ni madini ya thamani. Utambulisho wa jiwe la kale unabaki na mashaka na unaelezwa katika tanbihi.
- source_word: וּכְעֶצֶם הַשָּׁמַיִם לָטֹהַר
  choice: safi kama mbingu zenyewe
  rationale: ‘Mbingu zenyewe’ huonyesha nguvu ya עֶצֶם, nayo ‘safi’ katika muktadha huu huwasilisha uwazi au uangavu wa kuonekana.
theological_decisions:
- issue: Maono ya Mungu kwa lugha yenye sifa za mwili
  choice: Kuhifadhi kauli ya moja kwa moja ‘wakamwona Mungu wa Israeli’ na maneno ‘chini ya miguu yake.’
  alternative: Waliona udhihirisho wa Mungu wa Israeli; au waliona mahali Mungu wa Israeli aliposimama.
  rationale: Kiebrania kinasema wazi kwamba walimwona Mungu wa Israeli na kinataja kilichokuwa chini ya miguu yake. Tafsiri haiongezi ufafanuzi unaotatua mvutano wa kitheolojia wa kumwona Mungu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa ulinganifu bora: unahifadhi dai la moja kwa moja na taswira ya Kiebrania huku ukiifanya sentensi isomeke kwa kawaida.'
