  yaml_path: translation/ot/exodus/024/011.yaml
  text: But he did not stretch out his hand against the nobles of the sons of Israel; they saw God[a], and they ate and drank.
translation:
  language: sw
  text: Lakini Mungu hakuunyosha mkono wake dhidi ya wakuu wa wana wa Israeli; walimwona Mungu[a], wakala na wakanywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walimtazama Mungu”—kitenzi hiki kinaweza kumaanisha kutazama au kumwona kwa makini.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: dhidi ya
  rationale: Katika nahau שָׁלַח יָד, kihusishi hiki kina mwelekeo wa uhasama; “dhidi ya” huonyesha kwamba Mungu hakuwapiga.
- source_word: אֲצִילֵי
  choice: wakuu
  rationale: Neno hili linawataja watu mashuhuri au viongozi waliochaguliwa katika jamii; “wakuu” ni la kawaida na lenye hadhi katika Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi taswira ya kifamilia ya Kiebrania kwa namna inayoeleweka katika Kiswahili cha Biblia.
- source_word: שָׁלַח יָדוֹ
  choice: hakuunyosha mkono wake
  rationale: Huhifadhi sitiari ya Kiebrania ya kutenda kwa hukumu au vurugu bila kuifasiri moja kwa moja kuwa “kuwapiga.”
- source_word: וַיֶּחֱזוּ
  choice: walimwona
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida; kitenzi kinaweza pia kudokeza kumtazama kwa makini, jambo linalowekwa katika tanbihi.
- source_word: אֶת הָאֱלֹהִים
  choice: Mungu
  rationale: Kirai humrejelea Mungu wa Israeli; Kiswahili cha kawaida hakihitaji kibainishi kinacholingana na makala ya Kiebrania.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: wakala na kunywa
  rationale: Hutoa mfuatano sahili wa vitenzi kwa Kiswahili cha asili huku ikihifadhi hali ya kushangaza ya kula na kunywa baada ya kumwona Mungu.
theological_decisions:
- issue: Kiima cha “hakuunyosha mkono wake”
  choice: Kiima kilichodokezwa ni Mungu.
  alternative: Kuacha kiima bila kubainishwa.
  rationale: Kiebrania hakitaji kiima wazi, lakini muktadha unaonyesha kuwa ni Mungu. Muundo wa Kiswahili wenye “wake” huifanya rejea hiyo iwe wazi bila kuongeza dai jipya.
- issue: Namna ya kutafsiri tukio la kumwona Mungu
  choice: walimwona Mungu
  alternative: waliona udhihirisho wa Mungu; walimtazama Mungu
  rationale: Kiebrania kinasema jambo hilo moja kwa moja. Tafsiri haipaswi kulilegeza ili kuondoa mvutano wa kitheolojia na vifungu vingine vinavyohusu kumwona Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unahifadhi sitiari ya mkono, usemi wa kifamilia “wana wa Israeli,” na kauli ya moja kwa moja kwamba walimwona Mungu.
