  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְסַפֵּ֤ר לָ/עָם֙ אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וְ/אֵ֖ת כָּל הַ/מִּשְׁפָּטִ֑ים וַ/יַּ֨עַן כָּל הָ/עָ֜ם ק֤וֹל אֶחָד֙ וַ/יֹּ֣אמְר֔וּ כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/003.yaml
  text: Then Moses came and told the people all the words of Yahweh and all the ordinances[a], and all the people answered with one voice and said, “All the words that Yahweh has spoken we will do.”
translation:
  language: sw
  text: Kisha Musa akaja, akawaambia watu maneno yote ya Yahwe na hukumu[a] zote. Watu wote wakajibu kwa sauti moja, wakasema, “Maneno yote ambayo Yahwe amesema tutayatenda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maagizo ya kisheria”; neno la Kiebrania mishpatim linamaanisha maamuzi au masharti ya kisheria ya agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kisha Musa akaja
  rationale: Kitenzi בוא kwa kawaida humaanisha ‘kuja’; ‘kisha’ kinaendeleza simulizi kwa Kiswahili cha kawaida huku kikihifadhi nguvu ya waw-consecutive.
- source_word: וַיְסַפֵּר לָעָם
  choice: akawaambia watu
  rationale: ספר katika piel hapa ni kusimulia au kuwaambia. ‘Akawaambia watu’ ni ya asili na wazi katika muktadha wa Musa kuwasilisha yaliyosemwa.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: maneno yote ya Yahwe
  rationale: ‘Maneno’ huhifadhi maana ya דְּבָרִים na uhusiano wake na jibu la watu baadaye katika mstari.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama jina binafsi ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: כָּל הַמִּשְׁפָּטִים
  choice: hukumu zote
  rationale: מִשְׁפָּטִים ni maamuzi au masharti ya kisheria katika muktadha wa agano. ‘Hukumu’ hudumisha uhusiano wa kileksika na kuamua/kutoa hukumu; tanbihi inaeleza maana ya kimuktadha.
- source_word: קוֹל אֶחָד
  choice: kwa sauti moja
  rationale: Hii ni nahau inayomaanisha kwamba watu walijibu kwa umoja; ‘kwa sauti moja’ ni Kiswahili cha kawaida na cha karibu na Kiebrania.
- source_word: נַעֲשֶׂה
  choice: tutayatenda
  rationale: עשה humaanisha ‘kutenda/kufanya.’ ‘Tutayatenda’ huhifadhi kauli ya ahadi bila kuipanua moja kwa moja kuwa ‘tutatii,’ ingawa utiifu unadokezwa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya נַעֲשֶׂה katika jibu la agano
  choice: tutayatenda
  alternative: tutayatii; tutayatekeleza
  rationale: Tafsiri hii hudumisha maana ya moja kwa moja ya ‘tutafanya/tutatenda’ na haiongezi ufafanuzi wa kitheolojia, huku muktadha ukionyesha utiifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa wasomaji wa kawaida, huku marudio ya ‘maneno yote’ na kauli halisi ‘tutayatenda’ yakihifadhiwa.
