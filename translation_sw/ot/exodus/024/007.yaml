base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/007.yaml
  text: Then he took the Book of the Covenant and read it in the hearing of the people[a], and they said, “All that Yahweh has spoken we will do, and we will obey.”
translation:
  language: sw
  text: Kisha akachukua Kitabu cha Agano, akakisoma watu wakisikia, nao wakasema, “Yote ambayo Yahweh amesema tutayatenda, nasi tutasikiliza[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nasi tutatii.” Kitenzi cha Kiebrania kinaweza kumaanisha “kusikia” au “kusikiliza” na, katika muktadha wa agano, “kutii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kisha akachukua
  rationale: Wayyiqtol inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: סֵפֶר הַבְּרִית
  choice: Kitabu cha Agano
  rationale: Huhifadhi picha halisi ya hati iliyoandikwa ya agano na ni usemi wa kawaida wa kibiblia kwa Kiswahili.
- source_word: וַיִּקְרָא בְּאָזְנֵי הָעָם
  choice: na kukisoma masikioni mwa watu
  rationale: Kitenzi קרא pamoja na hati iliyoandikwa humaanisha kusoma; “masikioni mwa watu” huhifadhi nahau ya Kiebrania na kuonyesha usomaji wa hadharani.
- source_word: כֹּל אֲשֶׁר דִּבֶּר יְהוָה
  choice: Yote ambayo Yahwe amesema
  rationale: Huhifadhi maana jumuishi ya כֹּל אֲשֶׁר na kutaja jina la Mungu lililo katika matini.
- source_word: נַעֲשֶׂה
  choice: tutayatenda
  rationale: עשה ni neno pana la kufanya au kutenda; kiambishi “-ya-” hurejelea mambo yote yaliyosemwa bila kulifasiri moja kwa moja kuwa kutii.
- source_word: וְנִשְׁמָע
  choice: nasi tutasikiliza
  rationale: שמע inaweza kumaanisha kusikia, kusikiliza, au katika muktadha wa agano kutii. “Tutasikiliza” huhifadhi maana ya msingi ya kusikia huku tanbihi ikibainisha maana ya kutii.
theological_decisions:
- issue: Maana ya mwitikio wa agano וְנִשְׁמָע
  choice: nasi tutasikiliza
  alternative: nasi tutatii
  rationale: Muktadha wa kusomewa maneno ya agano huifanya maana ya kusikiliza iwe hai, huku matumizi ya kiagano yakihusisha pia kutii. Tafsiri kuu na tanbihi zinahifadhi mvutano huo badala ya kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Kitabu cha Agano” kinaendeleza uzito wa hati maalumu; “masikioni mwa watu” ni nahau inayoeleweka lakini yenye ladha ya kimatini. Jina יהוה limetafsiriwa “Yahwe.”
