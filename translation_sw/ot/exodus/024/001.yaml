base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/001.yaml
  text: Then he said to Moses[a], “Come up to Yahweh, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and bow down from a distance.”
translation:
  language: sw
  text: Kisha akamwambia Musa[a], “Panda kwa Yahwe, wewe na Haruni, Nadabu na Abihu, na watu sabini miongoni mwa wazee wa Israeli; nanyi msujudu kwa mbali.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Panda kwa Yahwe.” Maneno haya yamehifadhiwa ingawa msemaji anaeleweka kuwa Yahwe; tafsiri nyingine huyalainisha kuwa “Panda kwangu” au “Panda mbele za Yahwe.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֶל מֹשֶׁה אָמַר
  choice: Kisha akamwambia Mose
  rationale: Muundo wa Kiebrania ni ‘Na kwa Mose alisema.’ Kiswahili cha kawaida kinahitaji mtendaji anayeeleweka kutokana na muktadha; ‘Kisha’ linaendeleza simulizi bila kulifanya kuwa zito.
- source_word: עֲלֵה
  choice: Panda
  rationale: Amri ya עלה hapa humwagiza Mose kwenda juu kuelekea uwepo wa Mungu; ‘panda’ ni ya kawaida na yenye uwazi katika Kiswahili.
- source_word: אֶל יְהוָה
  choice: kwa Yahwe
  rationale: ‘Kwa’ huonyesha kumkaribia mtu, na jina la agano יְהוָה limetoholewa kuwa ‘Yahwe.’ Kauli isiyo ya kawaida imehifadhiwa badala ya kubadilishwa kuwa ‘kwangu.’
- source_word: אַתָּה וְ/אַהֲרֹן נָדָב וַ/אֲבִיהוּא
  choice: wewe pamoja na Aroni, Nadabu na Abihu
  rationale: ‘Wewe’ huhifadhi kiwakilishi cha msisitizo, huku ‘pamoja na’ ikiwasilisha kwa kawaida orodha ya wale walioitwa kupanda.
- source_word: וְ/שִׁבְעִים מִ/זִּקְנֵי יִשְׂרָאֵל
  choice: na wazee sabini miongoni mwa wazee wa Israeli
  rationale: 'מִן ni ya sehemu: watu sabini walitoka miongoni mwa kundi la wazee wa Israeli. Kurudia ‘wazee’ kunahifadhi maana hiyo wazi.'
- source_word: וְ/הִשְׁתַּחֲוִיתֶם
  choice: nanyi msujudieni
  rationale: Kitenzi kinaonyesha kujishusha au kusujudu kwa heshima. ‘Msujudieni’ huhifadhi tendo la kimwili na mwelekeo wake kwa Yahwe bila kutumia neno pana zaidi ‘mwabudu.’
- source_word: מֵ/רָחֹק
  choice: kwa mbali
  rationale: Kirai hiki huonyesha umbali wa mahali; ‘kwa mbali’ ni Kiswahili cha kawaida na cha sasa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano YHWH. ‘Yahwe’ hulihifadhi kama jina maalumu badala ya kulibadilisha kuwa cheo.
- issue: Kauli isiyo ya kawaida ‘panda kwa Yahwe’ huku msemaji akieleweka kuwa Yahwe
  choice: Kuhifadhi ‘kwa Yahwe’ katika matini kuu
  alternative: Panda kwangu; panda mbele za Yahwe
  rationale: Kiebrania kinasema wazi אֶל יְהוָה. Kubadili kuwa ‘kwangu’ kungesuluhisha kimya kimya mvutano ambao matini chanzi yenyewe haujasuluhisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imewekwa katika mtiririko wa kawaida wa simulizi, huku kauli ya Kiebrania yenye mvutano ikihifadhiwa na kufafanuliwa kwa tanbihi.
