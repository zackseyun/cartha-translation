base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/010.yaml
  text: When all the people saw the pillar of cloud standing at the entrance of the tent[a], all the people rose and worshiped, each man at the entrance of his tent.
translation:
  language: sw
  text: Watu wote walipoiona nguzo ya wingu imesimama mlangoni mwa hema, watu wote walisimama na kuabudu[a], kila mtu mlangoni mwa hema lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuinama” au “kusujudu”; kitenzi cha Kiebrania hurejelea tendo la mwili la heshima na mara nyingi hutumika kumaanisha tendo la ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה כָל הָעָם
  choice: Watu wote walipoiona
  rationale: Muundo wa wakati unaunganisha kuona kwa watu na matendo yaliyofuata; “walipoiona” ni simulizi la asili katika Kiswahili na huhifadhi uhusiano huo wa wakati.
- source_word: עַמּוּד הֶעָנָן
  choice: nguzo ya wingu
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayohifadhi taswira halisi ya ishara inayoonekana.
- source_word: עֹמֵד
  choice: imesimama
  rationale: Kitenzi cha hali kinaeleza mahali nguzo ilipokuwa; “imesimama” huhifadhi taswira ya chanzo.
- source_word: פֶּתַח הָאֹהֶל
  choice: kwenye mwingilio wa hema
  rationale: “Mwingilio” ni neno la sasa na linaloeleweka kwa פתח; “hema” limehifadhiwa bila kuongeza “hema la kukutania,” ambalo halitajwi wazi katika mstari huu.
- source_word: וְקָם
  choice: walisimama
  rationale: Hueleza watu kuinuka na kusimama kwa kuitikia walichokiona; ni wazi na yenye hadhi katika simulizi.
- source_word: וְהִשְׁתַּחֲווּ
  choice: kuabudu
  rationale: Katika muktadha huu tendo la kuinama linaelekezwa kwa uwepo wa Mungu, hivyo “kuabudu” huwasilisha maana yake ya kidini; tendo la kimwili limehifadhiwa katika tanbihi.
- source_word: אִישׁ
  choice: kila mtu
  rationale: Huhifadhi matumizi ya mgawanyo—kila mmoja katika kundi—kwa Kiswahili cha kawaida bila kupoteza maana ya mtu mmoja mmoja.
- source_word: פֶּתַח אָהֳלוֹ
  choice: kwenye mwingilio wa hema lake
  rationale: Huhifadhi urudiaji wa “mwingilio” na taswira ya kila mtu akiwa kwenye hema lake mwenyewe.
theological_decisions:
- issue: Jinsi ya kutafsiri mwitikio wa watu kwa ishara inayoonekana ya uwepo wa Mungu
  choice: kuabudu
  alternative: kuinama au kujitupa kifudifudi
  rationale: Kitenzi cha Kiebrania hutaja tendo la mwili la kuinama kwa heshima, na mara nyingi tendo hilo ni ibada. Muktadha hapa unaonyesha mwitikio kwa uwepo wa BWANA; tafsiri kuu inatoa nguvu ya kidini huku tanbihi ikihifadhi namna halisi ya mwili bila kuondoa utata wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa sentensi unahifadhi urudiaji wa “watu wote” na “mwingilio” uliomo katika Kiebrania. Alama ya tanbihi [a] imewekwa mara tu baada ya neno linalohusika.
