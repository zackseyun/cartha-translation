  text: וְ/הָיָ֗ה כְּ/צֵ֤את מֹשֶׁה֙ אֶל הָ/אֹ֔הֶל יָק֨וּמוּ֙ כָּל הָ/עָ֔ם וְ/נִ֨צְּב֔וּ אִ֖ישׁ פֶּ֣תַח אָהֳל֑/וֹ וְ/הִבִּ֨יטוּ֙ אַחֲרֵ֣י מֹשֶׁ֔ה עַד בֹּא֖/וֹ הָ/אֹֽהֱלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/008.yaml
  text: And whenever Moses went out to the tent[a], all the people would rise and stand, each man at the entrance of his tent[b], and they would watch after Moses until he entered the tent.
translation:
  language: sw
  text: Kila mara Musa alipotoka kwenda kwenye hema[a], watu wote waliinuka na kusimama, kila mwanamume[b] kwenye mlango wa hema lake, nao walimtazama Musa akienda mpaka alipoingia hemani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Hema,” yaani hema la kukutania linalotajwa katika muktadha unaozunguka mstari huu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi ni “kila mwanamume”; umoja wa kiume umetumiwa kwa maana ya kuwataja watu mmoja mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Kila mara
  rationale: Muundo huu pamoja na vitenzi vinavyofuata unaeleza jambo lililokuwa likitokea kwa desturi au mara kwa mara; “Kila mara” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: כְּצֵאת מֹשֶׁה אֶל־הָאֹהֶל
  choice: Musa alipotoka kwenda kwenye hema
  rationale: Kitenzi יצא kinahifadhi wazo la kutoka, na אֶל linaonyesha mwelekeo wa kwenda kwenye hema.
- source_word: הָאֹהֶל
  choice: hema
  rationale: Kiebrania kinasema tu “hema,” ingawa muktadha unaonyesha kuwa ni hema la kukutania lililotajwa katika mistari inayozunguka.
- source_word: יָקוּמוּ וְנִצְּבוּ
  choice: waliinuka na kusimama
  rationale: 'Vitenzi vinaonyesha tendo la kawaida lililorudiwa: watu waliinuka kisha wakasimama mahali pao.'
- source_word: אִישׁ
  choice: kila mwanamume
  rationale: Nomino ya umoja wa kiume imetumiwa kwa maana ya kugawa tendo kwa watu mmoja mmoja; tafsiri inahifadhi umbo hilo bila kulifanya lisilo na jinsia.
- source_word: פֶּתַח אָהֳלוֹ
  choice: kwenye mlango wa hema lake
  rationale: פֶּתַח ni uwazi au mahali pa kuingilia hema; “kwenye mlango” ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: וְהִבִּיטוּ אַחֲרֵי מֹשֶׁה
  choice: walimtazama Musa akienda
  rationale: Usemi huu unaonyesha kumfuata Musa kwa macho alipokuwa akiondoka; “ak(i)enda” huwasilisha maana ya אַחֲרֵי bila kudokeza kwamba walimfuata kwa miguu.
- source_word: עַד־בֹּאוֹ הָאֹהֱלָה
  choice: mpaka alipoingia hemani
  rationale: Kitenzi בוא pamoja na kiambishi cha mwelekeo kwenye “hema” kinaonyesha kuingia ndani ya hema.
theological_decisions: []
