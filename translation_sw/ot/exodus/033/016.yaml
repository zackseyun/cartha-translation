base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/016.yaml
  text: For how then will it be known that I have found favor in your sight[a], I and your people? Is it not by your going with us, so that I and your people are distinguished from every people who are on the face of the earth?
translation:
  language: sw
  text: Basi, itajulikanaje kwamba nimepata kibali machoni pako, mimi pamoja na watu wako? Je, si kwa kwenda kwako pamoja nasi, na hivyo mimi na watu wako tutatofautishwa[a] na kila taifa lililo duniani?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tutatengwa” au “tutawekwa kando.” Kitenzi cha Kiebrania kinaweza kumaanisha kutiwa alama kuwa wa pekee au kutenganishwa na wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמֶּה יִוָּדַע אֵפוֹא
  choice: Basi, itajulikanaje
  rationale: “Basi” linaunganisha hoja hii na mstari uliotangulia, huku “itajulikanaje” likihifadhi hali ya kutendwa ya יִוָּדַע na swali kuhusu njia ambayo jambo hilo litadhihirika.
- source_word: כִּי מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: kwamba nimepata kibali machoni pako
  rationale: “Kupata kibali machoni pa” ni usemi wa Kiswahili unaoeleweka na unaohifadhi taswira na maana ya nahau ya Kiebrania.
- source_word: אֲנִי וְעַמֶּךָ
  choice: mimi pamoja na watu wako
  rationale: Kauli hii ya wazi imehifadhiwa ili kuonyesha kwamba ombi la Musa linamhusu yeye na watu wa Mungu, bila kuficha hali isiyo ya kawaida ya kitenzi cha umoja katika Kiebrania.
- source_word: הֲלוֹא בְּלֶכְתְּךָ עִמָּנוּ
  choice: Je, si kwa wewe kwenda pamoja nasi
  rationale: Muundo wa swali la balagha umehifadhiwa, na kishazi kinaonyesha kwamba uwepo wa Mungu unaoandamana nao ndio njia ambayo kibali chake kitajulikana.
- source_word: וְנִפְלֵינוּ
  choice: na hivyo ... tutatofautishwa
  rationale: Kitenzi cha Kiebrania hapa kinaweza kumaanisha kuwekwa kando au kufanywa tofauti kwa namna ya pekee. “Tutatofautishwa” kinaeleza matokeo hayo bila kuamua kupita kiasi aina ya utengano.
- source_word: מִכָּל הָעָם אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: na kila taifa lililo duniani
  rationale: “Kila taifa” linawasilisha matumizi ya kijumla ya עָם, na “lililo duniani” ni Kiswahili cha kawaida kwa usemi wa Kiebrania “juu ya uso wa nchi/dunia.”
theological_decisions:
- issue: Chanzo cha upekee wa Israeli
  choice: Kwenda kwa Mungu pamoja na watu wake ndiko kunakowatofautisha na mataifa mengine.
  alternative: Kuwatofautisha hasa kwa sheria, nchi, au asili yao ya kikabila.
  rationale: Mstari wenyewe unaunganisha wazi kutofautishwa kwao na Mungu kwenda pamoja nao; tafsiri haiongezi msingi mwingine wa upekee huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha na marudio ya “mimi na watu wako” yamehifadhiwa; alama ya tanbihi imewekwa kwenye neno linalohusika moja kwa moja.
