base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/002.yaml
  text: And I will send an angel before you[a], and I will drive out the Canaanite, the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite.
translation:
  language: sw
  text: Nami nitamtuma malaika mbele yako[a], nami nitawafukuza Wakanaani, Waamori, Wahiti, Waperizi, Wahivi na Wayebusi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe.” Neno la Kiebrania מַלְאָךְ linaweza kumaanisha malaika au mjumbe wa kibinadamu; hapa “malaika” linafaa zaidi katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: Nami nitamtuma
  rationale: Kitenzi cha Kiebrania katika usemi huu wa Mungu kina maana ya wakati ujao. “Nitamtuma” ni Kiswahili cha kawaida na huhifadhi nguvu ya ahadi; “-m-” humrejelea mjumbe mwenye uhai.
- source_word: לְפָנֶיךָ
  choice: mbele yako
  rationale: Ni nahau inayomaanisha kwenda mbele au kutangulia mtu. “Mbele yako” ni fupi, ya asili na yenye hadhi katika Kiswahili.
- source_word: מַלְאָךְ
  choice: malaika
  rationale: Neno la Kiebrania linaweza kumaanisha malaika au mjumbe wa kibinadamu. Katika muktadha huu, “malaika” linafaa zaidi, huku tanbihi ikihifadhi uwezekano wa “mjumbe.” Kiswahili hakina kibainishi kisichodhihirika kinacholingana na ‘a/an,’ hivyo utambulisho wake haujaongezwa.
- source_word: וְגֵרַשְׁתִּי
  choice: nami nitawafukuza
  rationale: Mzizi גרשׁ una maana ya kuwatoa au kuwafukuza wakazi. “Nitawafukuza” ni wazi na wa kawaida; kiambishi cha wingi kinaendana na majina ya makabila yaliyotafsiriwa kwa wingi wa kawaida katika Kiswahili.
- source_word: אֶת
  choice: '[alama ya yambwa tendwa, haitafsiriwi]'
  rationale: Chembe hii hutambulisha yambwa tendwa maalumu katika Kiebrania na haina neno tofauti linalohitajika katika Kiswahili.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Ingawa umbo la Kiebrania ni la umoja wa kijumla, Kiswahili kwa kawaida hutaja watu wa taifa au kabila kwa ngeli ya watu katika wingi.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Umoja wa kijumla wa Kiebrania umetolewa kwa wingi wa kawaida wa Kiswahili ili kutaja kundi la watu kwa uwazi.
- source_word: וְהַחִתִּי
  choice: Wahiti
  rationale: Jina la kabila limetolewa katika wingi wa ngeli ya watu, unaoeleza kwa asili maana ya kijumla ya umbo la Kiebrania.
- source_word: וְהַפְּרִזִּי
  choice: Waperizi
  rationale: Wingi wa Kiswahili ni wa asili zaidi kwa jina la kundi la watu na huhifadhi maana ya kijumla ya Kiebrania.
- source_word: הַחִוִּי
  choice: Wahivi
  rationale: Jina limetolewa kwa wingi wa ngeli ya watu kwa uwazi na ulinganifu katika orodha.
- source_word: וְהַיְבוּסִי
  choice: na Wayebusi
  rationale: Kiunganishi cha mshiriki wa mwisho wa orodha kimehifadhiwa, na jina la watu limetolewa katika wingi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Utambulisho wa מַלְאָךְ katika aya hii
  choice: Kutafsiri kwa ujumla kuwa “malaika,” bila kumtambulisha kuwa Malaika wa BWANA au malaika fulani aliyeumbwa
  alternative: “mjumbe” au “yule malaika”
  rationale: Aya yenyewe haitoi utambulisho mahususi zaidi ya מַלְאָךְ. Kutotumia “yule” huepuka kuingiza utambulisho maalumu usiotajwa, na tanbihi huhifadhi upana wa maana ya neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya makabila yametolewa kwa wingi wa ngeli ya watu, ambao ni wa asili zaidi katika Kiswahili kuliko umoja wa kijumla wa Kiebrania. Urudiaji wa “nami” unadumisha mfuatano na msisitizo wa usemi wa Mungu bila kufanya sentensi kuwa nzito.
