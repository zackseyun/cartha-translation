base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/023.yaml
  text: Then I will remove my hand[a], and you will see my back, but my face shall not be seen.
translation:
  language: sw
  text: Kisha nitaondoa mkono wangu, nawe utaona mgongo wangu[a], lakini uso wangu hautaonekana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upande wangu wa nyuma” au “kile kilicho nyuma yangu.” Neno la Kiebrania linaweza kumaanisha mgongo au upande wa nyuma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: Kisha nitaondoa
  rationale: Kitenzi cha kusababisha kutoka mzizi סור kina maana ya kuondoa au kuondosha; “kisha” kinaendeleza mfuatano wa tendo kutoka mstari uliotangulia.
- source_word: כַּפִּי
  choice: mkono wangu
  rationale: כַּף inaweza kumaanisha kiganja au mkono. “Mkono” ni ya kawaida na inadumisha picha ya Mungu kumfunika Musa katika mstari uliotangulia.
- source_word: וְרָאִיתָ
  choice: nawe utaona
  rationale: Muundo huu katika muktadha wa wakati ujao unaonyesha tendo linalofuata; tafsiri hii inadumisha uhusiano huo wa kimfuatano.
- source_word: אֲחֹרָי
  choice: mgongo wangu
  rationale: Neno hili linaweza kumaanisha mgongo au upande wa nyuma. “Mgongo wangu” ni Kiswahili wazi na cha kawaida, huku tanbihi ikihifadhi upana wa maana.
- source_word: וּפָנַי
  choice: lakini uso wangu
  rationale: Ingawa kiunganishi ni cha kawaida, muktadha unaonyesha ulinganisho wenye utofauti kati ya kile Musa atakachoona na kisichoweza kuonekana.
- source_word: לֹא יֵרָאוּ
  choice: hautaonekana
  rationale: Nifali ya ראה ina maana ya kutendwa, “kuonekana,” si tendo la “kuona.” “Uso” ni umoja katika Kiswahili, hivyo kitenzi kimepatana nao.
theological_decisions:
- issue: Lugha inayomwelezea Mungu kwa viungo vya mwili
  choice: Kuhifadhi maneno halisi “mkono,” “mgongo,” na “uso” katika matini kuu.
  alternative: Kutumia lugha ya dhahania kama “uwepo,” “utukufu unaobaki,” au “kile kilicho nyuma yangu.”
  rationale: Kiebrania chenyewe kinatumia taswira hii. Kuihifadhi kunadumisha mvutano wa kitheolojia kuhusu Mungu kujifunua bila kuingiza ufafanuzi wa kimadhehebu au kuondoa taswira ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa sentensi unahifadhi mfuatano, utofauti wa vifungu, na lugha halisi ya Kiebrania bila kuifanya kuwa ya kifumbo zaidi.
