  yaml_path: translation/ot/exodus/033/014.yaml
  text: And he said[a], “My presence will go, and I will give you rest.”
translation:
  language: sw
  text: Naye akasema, “Uwepo wangu[a] utaenda, nami nitakupa pumziko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “Uso wangu utaenda.” Usemi huu unamaanisha kwamba BWANA mwenyewe atakuwa pamoja naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Naye akasema
  rationale: Muundo wa wayyiqtol unaendeleza simulizi na kuanzisha usemi wa moja kwa moja; ‘Naye akasema’ ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: פָּנַי
  choice: Uwepo wangu
  rationale: Neno hilo kihalisi ni ‘uso wangu,’ lakini hapa ni nahau inayomaanisha uwepo binafsi wa BWANA. ‘Uwepo wangu’ huwasilisha maana hiyo kwa Kiswahili cha asili, huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: יֵלֵכוּ
  choice: utaenda pamoja nawe
  rationale: Kitenzi ‘kwenda’ kinahifadhiwa, na ‘pamoja nawe’ hufanya maana ya kuandamana iwe wazi kwa Kiswahili. Umoja wa kisarufi unalingana na nomino ya Kiswahili ‘uwepo,’ ingawa umbo la Kiebrania linapatana na nomino yenye umbo la wingi פָּנַי.
- source_word: וַהֲנִחֹתִי
  choice: nami nitakupa pumziko
  rationale: Hifili ya נוח ina maana ya kusababisha mtu apumzike au kumpa pumziko. Tafsiri hii ni ya kawaida na inadumisha maana ya kisababishi.
- source_word: לָךְ
  choice: -ku- katika ‘nitakupa’
  rationale: Kiambishi ni cha nafsi ya pili umoja. Kiswahili hukiwakilisha kiasili kwa kiambishi-yambwa ‘-ku-’ katika ‘nitakupa.’
theological_decisions:
- issue: Tafsiri ya usemi wa kibinadamu פָּנַי
  choice: Uwepo wangu
  alternative: Uso wangu; Mimi mwenyewe nitaenda
  rationale: Kiebrania hutumia ‘uso wangu’ kueleza uwepo binafsi wa Mungu. ‘Uwepo wangu’ hudumisha maana ya ahadi ya Mungu kuandamana nao bila kuufanya uwepo huo kuwa wazo lisilo la kibinafsi; maana halisi ya ‘uso’ imehifadhiwa katika tanbihi.
- issue: Mhusika anayelengwa na לָךְ
  choice: pamoja nawe ... nitakupa
  alternative: pamoja nanyi ... nitawapa
  rationale: Kiebrania kina nafsi ya pili umoja, kikimwelekea Musa moja kwa moja. Tafsiri inadumisha umoja huo badala ya kuubadili kuwa wingi unaowarejelea Israeli, ingawa taifa liko katika muktadha mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Pumziko’ limechaguliwa badala ya maelezo marefu ili kudumisha ufupi na mvutano wa ahadi ya Kiebrania. Alama ya tanbihi [a] imewekwa mara tu baada ya ‘Uwepo wangu.’
