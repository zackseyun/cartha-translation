  yaml_path: translation/ot/exodus/033/015.yaml
  text: Then he said to him[a], “If your presence does not go, do not bring us up from here.”
translation:
  language: sw
  text: Ndipo akamwambia, “Ikiwa uwepo wako[a] hauendi, usitupandishe kutoka hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa halisi, “uso wako.” Mara nyingi Kiebrania hutumia “uso” kumaanisha uwepo wa mtu mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Ndipo akamwambia
  rationale: Muundo huu unaendeleza simulizi na kueleza kwa kawaida kwamba alisema maneno hayo kwake.
- source_word: אִם אֵין
  choice: Ikiwa ... hauendi
  rationale: Kisharti pamoja na ukanushi wa Kiebrania kimewasilishwa kwa muundo wa kawaida wa Kiswahili bila kuongeza uhakika ambao haupo katika chanzo.
- source_word: פָּנֶיךָ
  choice: uwepo wako
  rationale: Ingawa neno la Kiebrania kwa halisi ni ‘uso wako,’ hapa ni nahau inayomaanisha kuwapo kwa Mungu mwenyewe. Tanbihi inahifadhi taswira ya asili.
- source_word: הֹלְכִים
  choice: hauendi
  rationale: Kauli ya kuendelea au kuandamana imewasilishwa kwa kitenzi cha wakati wa sasa katika kisharti; upatanisho wa umoja unafuata nomino ya Kiswahili ‘uwepo.’
- source_word: אַל תַּעֲלֵנוּ
  choice: usitupandishe
  rationale: Kitenzi cha Hiphil kina maana ya kusababisha kupanda au kuondoka kwenda juu; ‘usitupandishe’ kinahifadhi maana ya kisababishi na ombi lenye nguvu.
- source_word: מִזֶּה
  choice: kutoka hapa
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha mahali walipokuwa wakati huo.
theological_decisions:
- issue: Maana ya פָּנֶיךָ inapomhusu Mungu
  choice: uwepo wako
  alternative: uso wako
  rationale: Katika muktadha huu Musa anazungumzia Mungu kwenda pamoja na Israeli, si uso wa kimwili tu. ‘Uwepo wako’ huwasilisha maana ya nahau, huku tanbihi ikihifadhi taswira halisi ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Ndipo akamwambia’ kinaendeleza mtiririko wa simulizi; ‘usitupandishe’ kinahifadhi lugha ya safari na maana ya kisababishi ya Kiebrania.
