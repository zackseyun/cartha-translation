  text: וְ/הָיָה֙ בַּ/עֲבֹ֣ר כְּבֹדִ֔/י וְ/שַׂמְתִּ֖י/ךָ בְּ/נִקְרַ֣ת הַ/צּ֑וּר וְ/שַׂכֹּתִ֥י כַפִּ֛/י עָלֶ֖י/ךָ עַד עָבְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/022.yaml
  text: And when my glory passes by[a], I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by.
translation:
  language: sw
  text: Na utukufu wangu utakapopita, nitakuweka katika ufa wa mwamba[a], nami nitakufunika kwa mkono wangu mpaka nitakapopita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika ufa wa mwamba huo.” Kiebrania kinaweza kueleweka kuwa kinarejelea ufa maalumu; Kiswahili “ufa wa mwamba” hakionyeshi tofauti hiyo wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּעֲבֹר
  choice: utakapopita
  rationale: Muundo huu unaanzisha hali ya wakati. Kiswahili huieleza kwa kawaida na kwa usahihi kwa kitenzi cha wakati, “utakapopita,” bila kuongeza kishazi kizito cha “itakuwa kwamba.”
- source_word: כְּבֹדִי
  choice: utukufu wangu
  rationale: Katika muktadha huu wa Mungu kujidhihirisha, כָּבוֹד ni utukufu wake unaodhihirika, si heshima au sifa pekee.
- source_word: וְשַׂמְתִּיךָ
  choice: nitakuweka
  rationale: Huhifadhi maana ya moja kwa moja ya kuweka au kumweka mtu mahali fulani, kwa lugha ya kawaida ya Kiswahili.
- source_word: בְּנִקְרַת הַצּוּר
  choice: katika ufa wa mwamba
  rationale: נִקְרָה ni ufa au mwanya katika mwamba. Kiswahili hakina vibainishi vinavyolingana moja kwa moja na “a/the,” hivyo usemi huu huacha wazi kwa kawaida kama ni ufa fulani au ufa wa aina hiyo.
- source_word: וְשַׂכֹּתִי
  choice: nitakufunika
  rationale: Kitenzi סכך kina maana ya kufunika au kukinga. “Nitakufunika” huhifadhi picha halisi inayofuatiwa na “kwa mkono wangu.”
- source_word: כַפִּי
  choice: mkono wangu
  rationale: Ingawa כַּף inaweza kumaanisha kiganja, “mkono wangu” ni usemi wa asili zaidi katika Kiswahili na huhifadhi lugha ya kimwili ya Kiebrania bila kuibadili kuwa dhana isiyo halisi.
- source_word: עַד עָבְרִי
  choice: mpaka nitakapopita
  rationale: 'Huonyesha kikomo cha tendo la kufunika: kufunikwa kutaendelea hadi Mungu atakapokuwa amepita.'
theological_decisions:
- issue: Lugha inayomwelezea Mungu kwa mfano wa mwili (“mkono wangu”)
  choice: Kudumisha usemi halisi “mkono wangu.”
  alternative: ulinzi wangu; nguvu zangu
  rationale: Kiebrania kinatumia moja kwa moja picha ya mkono. Tafsiri haipaswi kuibadili kuwa maelezo ya kitheolojia ya kidhahania wala kuamua suala la jinsi lugha hiyo inavyopaswa kufasiriwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio wa sentensi ni wa kawaida katika Kiswahili, na picha halisi za “utukufu,” “mwamba,” na “mkono” zimehifadhiwa.
