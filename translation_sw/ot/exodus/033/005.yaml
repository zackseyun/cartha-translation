base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/005.yaml
  text: And Yahweh said to Moses[a], “Say to the sons of Israel, ‘You are a stiff-necked people. In a single moment, if I were to go up in your midst, I would consume you. So now, take off your ornaments from upon you[e][d][c][b], and I will know what I should do with you.’”
translation:
  language: sw
  text: Yahwe akamwambia Musa, “Waambie Waisraeli[a], ‘Ninyi ni watu wenye shingo ngumu. Kama ningepanda katikati yenu kwa kitambo kimoja tu, ningewaangamiza[b]. Basi sasa, vueni mapambo yenu[c], nami nitajua nitakalowatendea[d].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “wana wa Israeli.” Yaani, Waisraeli.'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “ningewamaliza kabisa.” Kiebrania humwelekea Israeli kwa umoja kama taifa moja, ingawa Kiswahili kimetumia wingi.'
    reason: lexical_alternative
  - marker: c
    text: 'Au: “ondoeni vito vyenu” au “ondoleeni mbali vitu vyenu vya kujipamba.”'
    reason: lexical_alternative
  - marker: d
    text: 'Kiebrania: “nami nitajua nitakalokutendea.” Usemi wa “nitajua” umehifadhiwa badala ya kufasiriwa kuwa “nitaamua.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Imetoholewa kama jina binafsi la Mungu badala ya kubadilishwa na cheo; umbo ‘Yahwe’ ni la kawaida na linalosomeka katika Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ni Kiswahili cha kawaida kwa kundi lote la wazao wa Israeli; tanbihi huhifadhi taarifa kwamba Kiebrania kinasema kihalisi ‘wana wa Israeli.’
- source_word: עַם קְשֵׁה עֹרֶף
  choice: watu wenye shingo ngumu
  rationale: Huhifadhi sitiari ya Kiebrania ya ukaidi na uasi badala ya kuifupisha kuwa ‘watu wakaidi.’
- source_word: רֶגַע אֶחָד אֶעֱלֶה בְקִרְבְּךָ
  choice: Kama ningepanda katikati yenu hata kwa muda mfupi tu
  rationale: ‘Kupanda’ huhifadhi kitenzi cha chanzo na ‘katikati yenu’ hudumisha lugha ya uwepo wa agano; ‘hata kwa muda mfupi tu’ huonyesha hatari ya papo hapo bila kulazimisha maana ya sekunde moja.
- source_word: וְכִלִּיתִיךָ
  choice: ningewaangamiza
  rationale: Katika muktadha wa hukumu, kitenzi humaanisha kuwafikisha mwisho kabisa; ‘kuwaangamiza’ ni cha asili na chenye nguvu katika Kiswahili.
- source_word: הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ
  choice: vueni mapambo yenu
  rationale: ‘Mapambo’ ni pana kuliko ‘vito’ na yaweza kujumuisha aina mbalimbali za vitu vya kujipamba; ‘vueni’ huwasilisha kuyaondoa mwilini kwa lugha ya kawaida.
- source_word: וְאֵדְעָה
  choice: nami nitajua
  rationale: Huhifadhi kitenzi ‘kujua’ na usemi wa kibinadamu unaomhusu Mungu, bila kuufafanua kuwa ‘nitaamua.’
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: nitakalowatendea
  rationale: Huhifadhi kutokubainishwa iwapo tendo litakuwa la adhabu au la aina nyingine; ‘kuwatendea’ ni wazi zaidi kuliko kulazimisha ‘kuwaadhibu.’
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu Mungu kujua
  choice: nami nitajua nitakalowatendea
  alternative: ili niamue nitakalowatendea
  rationale: Chanzo hutumia kitenzi ‘kujua.’ Tafsiri hudumisha mvutano wa kitheolojia na wa kimahusiano badala ya kuubadili kuwa uamuzi wa kiakili pekee.
- issue: Viambishi vya umoja vinavyolielekea taifa kwa pamoja
  choice: 'Kutumia wingi wa Kiswahili: yenu, wa-, -watendea'
  alternative: Kutumia umoja kana kwamba anayesemeshwa ni mtu mmoja
  rationale: Kiebrania hulitaja taifa la Israeli kama nafsi moja ya pamoja. Wingi wa Kiswahili huwaelekeza wasikilizaji wote kwa kawaida huku umoja wa kijumuiya ukielezwa katika tanbihi inapohitajika.
- issue: Masharti yanayohusu uwepo wa Yahwe katikati ya Israeli
  choice: Kama ningepanda katikati yenu hata kwa muda mfupi tu
  alternative: Nikipanda katikati yenu kwa muda mmoja
  rationale: Muundo wa kimasharti unaonyesha kwamba uwepo wake katikati yao ungeleta hukumu ya haraka katika hali yao ya ukaidi; hauwasilishi kupanda huko kana kwamba tayari kumetokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka lakini zinahifadhi sitiari ya ‘shingo ngumu,’ jina Yahwe, kitenzi ‘kupanda,’ na lugha ya Mungu ‘kujua.’ Alama zote za tanbihi [a]–[d] zimo katika matini kuu.
