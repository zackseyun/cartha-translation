base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/003.yaml
  text: to a land flowing with milk and honey[a]. For I will not go up in your midst, because you are a stiff-necked people[b], lest I consume you on the way.
translation:
  language: sw
  text: kwenda katika nchi inayotiririka maziwa na asali. Kwa maana sitapanda katikati yenu[a], kwa sababu ninyi ni watu wenye shingo ngumu, nisije nikawaangamiza[b] njiani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miongoni mwenu” au “pamoja nanyi.”
    reason: lexical_alternative
  - marker: b
    text: Au “nikawamaliza kabisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אֶרֶץ
  choice: kwenda katika nchi
  rationale: אֶל huonyesha mwelekeo kuelekea nchi hiyo; kwa kuwa kifungu ni mwendelezo wa sentensi iliyotangulia, kitenzi ‘kwenda’ huleta Kiswahili cha kawaida bila kubadili maana.
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: inayotiririka maziwa na asali
  rationale: Huhifadhi sitiari ya Kiebrania ya nchi yenye wingi na ustawi, kwa lugha inayoeleweka katika Kiswahili cha Biblia.
- source_word: כִּי לֹא אֶעֱלֶה
  choice: Kwa maana sitapanda
  rationale: ‘Kwa maana’ huhifadhi kazi ya כִּי ya kutoa sababu au maelezo, na ‘sitapanda’ huhifadhi kitenzi cha kupanda kuelekea nchi.
- source_word: בְּקִרְבְּךָ
  choice: katikati yenu
  rationale: Huhifadhi wazo lenye nguvu la uwepo wa Mungu ndani ya jamii, si kuandamana nao tu. Wingi umetumiwa kwa Kiswahili cha kawaida kwa sababu Israeli ni jamii inayozungumziwa.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: watu wenye shingo ngumu
  rationale: Huhifadhi sitiari ya asili ya ukaidi badala ya kuifupisha kuwa ‘wakaidi’ pekee.
- source_word: פֶּן
  choice: nisije
  rationale: Muundo huu wa Kiswahili huonyesha matokeo yanayoogopewa au yanayozuiwa, kama פֶּן.
- source_word: אֲכֶלְךָ
  choice: nikawaangamiza
  rationale: Katika Piel, כלה inaweza kumaanisha kumaliza kabisa au kuangamiza. Chaguo hili ni la asili na zito katika Kiswahili bila kubainisha namna fulani ya hukumu.
- source_word: בַּדָּרֶךְ
  choice: njiani
  rationale: Ni tafsiri fupi na ya kawaida ya tukio linaloweza kutokea wakati wa safari.
theological_decisions:
- issue: Kauli kuhusu uwepo wa Mungu
  choice: sitapanda katikati yenu
  alternative: sitapanda pamoja nanyi
  rationale: ‘Katikati yenu’ huhifadhi mvutano wa hatari ya uwepo mtakatifu wa Mungu ndani ya watu waasi, badala ya kuifanya kauli ihusu kuandamana tu.
- issue: Ukali wa hukumu katika אֲכֶלְךָ
  choice: nisije nikawaangamiza
  alternative: nisije nikawamaliza kabisa
  rationale: Chaguo kuu linaonyesha uwezekano wa Israeli kuondolewa kabisa njiani, bila kuingiza namna maalumu ya hukumu ambayo maandishi hayataji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘watu wenye shingo ngumu’ umehifadhi sitiari ya Kiebrania; viwakilishi vya wingi vimetumiwa kwa ufasaha wa Kiswahili kwa Israeli kama jamii.
