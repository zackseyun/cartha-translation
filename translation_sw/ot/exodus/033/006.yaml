lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  choice: wakavua
  rationale: Kitenzi katika muktadha huu humaanisha kuondoa kitu kilichovaliwa mwilini. “Kuvua” ni Kiswahili cha kawaida na chenye staha kwa tendo la kujiondolea mapambo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: “Waisraeli” ni tafsiri ya asili na iliyo wazi katika Kiswahili cha sasa kwa nahau ya Kiebrania “wana wa Israeli,” bila kupoteza rejeleo la taifa.
- source_word: עֶדְיָם
  choice: mapambo yao
  rationale: Neno עֲדִי linaashiria vitu vya kujipamba; “mapambo” ni pana vya kutosha na halibainishi bila msingi kwamba vilikuwa vito pekee.
- source_word: מֵהַר חוֹרֵב
  choice: kuanzia Mlima Horebu na kuendelea
  rationale: Hii inaeleza uwezekano kwamba Mlima Horebu ulikuwa mwanzo wa kipindi ambacho hawakuvaa tena mapambo, huku usomaji wa mahali ukihifadhiwa katika tanbihi.
