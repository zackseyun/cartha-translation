  text: Kwa hiyo Waisraeli wakavua mapambo yao kuanzia Mlima Horebu na kuendelea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli wakavua mapambo yao katika Mlima Horebu.” Kirai cha Kiebrania kinaweza kueleweka kuwa kinataja mahali walipoyavua au mwanzo wa kipindi ambacho hawakuvaa tena mapambo hayo.
