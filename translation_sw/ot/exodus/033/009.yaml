  yaml_path: translation/ot/exodus/033/009.yaml
  text: And whenever Moses entered the tent[a], the pillar of cloud would descend and stand at the entrance of the tent, and he would speak with Moses.
translation:
  language: sw
  text: Kila mara Musa alipoingia hemani, nguzo ya wingu ilikuwa ikishuka na kusimama penye mlango wa hema, naye alikuwa akisema na Musa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kuweka wazi zaidi kishazi cha mwisho: “BWANA alikuwa akisema na Musa.” Kiebrania hakimtaji wazi mtendaji wa kitenzi katika kishazi hiki, ingawa muktadha unaonyesha kuwa ni BWANA.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּבֹא
  choice: Kila mara ... alipoingia
  rationale: Muundo huu unaeleza hali iliyojirudia katika simulizi; “kila mara ... alipoingia” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: הָאֹהֱלָה / הָאֹהֶל
  choice: ndani ya hema / hema
  rationale: Kiebrania kinasema “hema,” si jina kamili “hema la kukutania.” Kiambishi cha mwelekeo katika הָאֹהֱלָה kinaelezwa kwa “ndani ya.”
- source_word: יֵרֵד
  choice: ilishuka
  rationale: Katika muktadha wa tendo la kawaida lililojirudia, wakati uliopita wa Kiswahili unaongozwa na “kila mara” na kwa kawaida unaeleweka kuwa wa mazoea.
- source_word: עַמּוּד הֶעָנָן
  choice: nguzo ya wingu
  rationale: Huhifadhi taswira halisi na mpangilio wa tungo ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: וְעָמַד
  choice: na kusimama
  rationale: Inaendeleza mfuatano wa vitendo vya kawaida baada ya “ilishuka” bila kurudia kiambishi cha wakati isivyo lazima.
- source_word: פֶּתַח הָאֹהֶל
  choice: mlangoni pa hema
  rationale: Ni usemi wa asili wa Kiswahili kwa mahali pa kuingilia hema, huku ukihifadhi picha ya פתח.
- source_word: וְדִבֶּר
  choice: naye alisema
  rationale: Kitenzi cha Kiebrania kina nafsi ya kiume umoja lakini hakitaji wazi mtendaji. “Naye” huhifadhi kutotajwa huko badala ya kuongeza “BWANA” katika maandishi.
- source_word: עִם מֹשֶׁה
  choice: na Musa
  rationale: עם ina maana ya “pamoja na/na”; “alisema na Musa” huhifadhi wazo la mawasiliano ya kibinafsi kuliko “alimwambia Musa.”
theological_decisions:
- issue: Mtendaji asiyeelezwa wazi katika וְדִבֶּר
  choice: Kutumia “naye alisema na Musa,” huku rejeleo likieleweka kutokana na muktadha.
  alternative: Kusema wazi, “BWANA alisema na Musa”; au, kwa uwezekano mdogo, kuifanya nguzo ya wingu kuwa mtendaji.
  rationale: Muktadha unamtambulisha BWANA kuwa ndiye anayesema, lakini kishazi cha Kiebrania hakimwiti kwa jina. Tafsiri kuu inadumisha hali hiyo, na tanbihi inaeleza maana iliyo wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hema” limeachwa bila herufi kubwa wala kuongeza “la kukutania,” kwa kuwa mstari huu unasema tu “hema.” Alama [a] imewekwa baada ya kutajwa kwa hema kama katika safu ya ushauri ya Kiingereza, ingawa maelezo yake yanahusu pia kishazi cha mwisho.
