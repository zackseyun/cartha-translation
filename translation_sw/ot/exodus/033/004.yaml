base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/004.yaml
  text: When the people heard this bad news[a], they mourned[b], and no man put on his ornaments.
translation:
  language: sw
  text: Watu waliposikia habari hii mbaya[a], wakaomboleza, wala hakuna mtu aliyevaa mapambo yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “neno hili baya” au “jambo hili baya.” Kiebrania kimetumia neno lenye maana pana ya “neno/jambo,” lakini hapa linarejelea taarifa iliyotolewa.
    reason: lexical_alternative
  - marker: b
    text: Au “vito vyake” au “vitu vyake vya kujipamba.” Neno la Kiebrania linahusu kwa upana vitu vinavyovaliwa kwa ajili ya kujipamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע הָעָם
  choice: Watu waliposikia
  rationale: Kitenzi cha Kiebrania kiko katika umoja kwa sababu עָם ni nomino ya mkusanyiko, lakini Kiswahili kwa kawaida hutumia upatanisho wa wingi kwa “watu.” Muundo wa “waliposikia” unaunganisha kwa kawaida kusikia taarifa na mwitikio uliofuata.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: habari hii mbaya
  rationale: דָּבָר inaweza kumaanisha neno, jambo, au taarifa. Hapa inarejelea tangazo lililotangulia, hivyo “habari hii mbaya” ni ya asili katika Kiswahili, huku tanbihi ikihifadhi maana ya karibu zaidi ya “neno/jambo hili baya.”
- source_word: וַיִּתְאַבָּלוּ
  choice: wakaomboleza
  rationale: Kitenzi hiki kinaonyesha kuingia katika hali ya maombolezo, si kuhuzunika tu; “wakaomboleza” huhifadhi uzito wa kihisia na desturi inayodokezwa.
- source_word: וְלֹא שָׁתוּ אִישׁ
  choice: wala hakuna mtu aliyevaa
  rationale: 'אִישׁ ina nguvu ya kugawa kwa kila mmoja: hakuna hata mtu mmoja aliyefanya hivyo. “Aliyevaa” ni Kiswahili cha kawaida kwa kuweka mapambo mwilini.'
- source_word: עֶדְיוֹ עָלָיו
  choice: mapambo yake
  rationale: עֲדִי ni neno pana linaloweza kutaja vitu vya kujipamba au vito. “Mapambo” halibani maana kuwa vito pekee, na kiambishi cha umilikaji kinahifadhi maana ya kugawa kwa kila mtu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “wala hakuna mtu” ili kuhifadhi msisitizo wa Kiebrania kwa kila mtu mmoja mmoja, na “mapambo” kama istilahi pana inayoeleweka kwa urahisi.
