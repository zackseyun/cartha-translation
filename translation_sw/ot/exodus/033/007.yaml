base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/007.yaml
  text: Moses would take the tent and pitch it for himself outside the camp[a], far from the camp, and he called it the tent of meeting[b]. And everyone seeking Yahweh would go out to the tent of meeting that was outside the camp.
translation:
  language: sw
  text: Musa alikuwa akilichukua[b] lile hema na kulisimamisha kwa ajili yake nje ya kambi[a], mbali na kambi; naye akaliita Hema la Kukutania. Kila mtu aliyemtafuta Yahwe alikuwa akienda kwenye Hema la Kukutania lililokuwa nje ya kambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hema lile.” Matini haisemi wazi “hema lake,” ingawa huenda ikawa inarejelea hema la Musa mwenyewe au hema maalumu alilotumia kwa kusudi hili.'
    reason: lexical_alternative
  - marker: b
    text: 'Maumbo ya vitenzi vya Kiebrania hapa huenda yanaeleza tendo la desturi au lililorudiwa: Musa alikuwa akilichukua hema, na kila mtu aliyemtafuta Yahwe alikuwa akienda huko.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח
  choice: alikuwa akilichukua
  rationale: Yiqtol katika muktadha huu inaelekea kueleza tendo la kawaida au lililorudiwa, si tukio moja tu la wakati uliopita.
- source_word: הָאֹהֶל
  choice: lile hema
  rationale: Kiebrania kina kibainishi, yaani ‘hema lile.’ Tafsiri haiongezi ‘hema lake,’ kwa kuwa umilikaji haujaelezwa wazi.
- source_word: וְנָטָה לוֹ
  choice: na kulisimika kwa ajili yake
  rationale: נטה ikitumiwa kuhusu hema humaanisha kulisimika; לוֹ imedumishwa kwa ‘kwa ajili yake’ bila kuamua ikiwa lilikuwa hema lake binafsi.
- source_word: הַרְחֵק מִן הַמַּחֲנֶה
  choice: mbali na kambi
  rationale: Kauli hii inasisitiza kuwa hema halikuwa tu nje ya kambi bali lilitengwa kwa umbali.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni neno la kawaida na linaloeleweka kwa mahali pa kukutana palilowekwa; herufi kubwa zinaonyesha jina alilolipa hema hilo katika kifungu.
- source_word: כָּל מְבַקֵּשׁ יְהוָה
  choice: kila mtu aliyemtafuta Yahwe
  rationale: מבקש inaweza kujumuisha kumtafuta Mungu kwa ibada au kwenda kumwuliza; ‘aliyemtafuta’ huhifadhi upana huo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: יֵצֵא
  choice: alikuwa akienda
  rationale: Umbo hili, kama יִקַּח, linaelekea kueleza tendo la kawaida au lililorudiwa.
theological_decisions:
- issue: Utambulisho wa ‘hema lile’
  choice: Kuacha utambulisho wake wazi
  alternative: Kulieleza kuwa ‘hema lake’ Musa au hema maalumu tofauti
  rationale: Matini ina kibainishi lakini haisemi wazi kwamba hema hilo lilikuwa mali ya Musa; tafsiri haipaswi kutatua jambo ambalo chanzo kimeliacha wazi.
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la agano, hivyo unukuzi hulihifadhi badala ya kuweka cheo mahali pake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Miundo ‘alikuwa aki-’ imetumiwa kuonyesha matendo ya kawaida yaliyorudiwa. ‘Hema la Kukutania’ limetumiwa kama jina lililozoeleka; utambulisho wa hema kabla ya kupewa jina umeachwa bila kufafanuliwa kupita chanzo.
