review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the contrastive narrative conjunction, inability rather than prohibition, the concrete anthropomorphic expression “my face,” and the general consequence that no human can see God and live. The second clause’s future form, “atakayeniona,” is understandable but softens the Hebrew imperfect’s general, gnomic statement of incapacity.
  naturalness: “Huwezi kuuona uso wangu” is grammatical, but “Huwezi kuona uso wangu” is more idiomatic and uncluttered in Standard East African Swahili. “Hakuna mwanadamu anayeweza kuniona na kuishi” is a natural general statement and makes the intended incapacity explicit.
  terminology: “Uso wangu” appropriately retains the Hebrew פני rather than interpretively substituting “uwepo wangu.” “Mwanadamu” suitably renders the generic singular האדם. The alternative in footnote a is acceptable, but its wording is made more natural.
  issues:
  - severity: low
    issue: Gnomic force in the explanatory clause
    rationale: “Hakuna mwanadamu atakayeniona na kuishi” can be read as future-oriented. The Hebrew states a timeless general incapacity/consequence; “Hakuna mwanadamu anayeweza kuniona na kuishi” expresses this more clearly.
  - severity: low
    issue: Slightly marked object construction
    rationale: The object-marked infinitive in “kuuona uso wangu” is possible, but “kuona uso wangu” is the more natural unmarked phrasing in this context.
  - severity: low
    issue: Footnote wording
    rationale: “Kiebrania kwa uhalisi ni” is less idiomatic than a direct formulation such as “Kwa Kiebrania, kwa maana halisi,” while retaining the same lexical clarification.
