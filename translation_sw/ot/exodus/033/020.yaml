  yaml_path: translation/ot/exodus/033/020.yaml
  text: But he said[a], “You cannot see my face[b], for man shall not see me and live.”
translation:
  language: sw
  text: Lakini akasema, “Huwezi kuona uso wangu[a], kwa maana hakuna mwanadamu[b] anayeweza kuniona na kuishi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uwepo wangu.” Kwa Kiebrania, kwa maana halisi, “uso wangu.”
    reason: lexical_alternative
  - marker: b
    text: “Mwanadamu” hapa humaanisha binadamu yeyote; kauli hii inawahusu wanadamu wote kwa ujumla.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini akasema
  rationale: Kiunganishi kinaendeleza simulizi, lakini katika muktadha huu pia kinaonyesha tofauti na ombi la Musa katika mstari uliotangulia; “Lakini” huwasilisha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: לֹא תוּכַל
  choice: Huwezi
  rationale: Kitenzi יכל hapa kinahusu uwezo, si ruhusa. “Huwezi” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: לִרְאֹת
  choice: kuuona
  rationale: ראה hapa humaanisha kuona kwa macho. Kiambishi cha yambwa katika “kuuona uso” kinafanya sentensi iwe ya asili kwa Kiswahili.
- source_word: אֶת־פָּנַי
  choice: uso wangu
  rationale: פָּנִים kwa uhalisi ni “uso.” Taswira hiyo halisi imehifadhiwa badala ya kuibadili kimafafanuzi kuwa “uwepo wangu.”
- source_word: כִּי
  choice: kwa maana
  rationale: Neno hili linaanzisha sababu ya kutowezekana huko; “kwa maana” huhifadhi uhusiano wa maelezo kwa lugha yenye hadhi na inayoeleweka.
- source_word: לֹא יִרְאַנִי
  choice: hakuna mwanadamu atakayeniona
  rationale: Kauli hasi ya jumla imewasilishwa kwa muundo wa kawaida wa Kiswahili, “hakuna … atakaye…,” bila kuifanya kuwa katazo la ruhusa.
- source_word: הָאָדָם
  choice: mwanadamu
  rationale: Nomino hii ni umoja unaowakilisha wanadamu wote. “Mwanadamu” huhifadhi umoja huo na pia inaeleweka kuwa ya jumla bila kuhusisha jinsia moja tu.
- source_word: וָחָי
  choice: na kuishi
  rationale: 'Maneno haya yanaonyesha matokeo: mtu hawezi kumwona Mungu kisha akaendelea kuwa hai. “Na kuishi” ni mafupi na yanadumisha muundo wa chanzo.'
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu Mungu katika “uso wangu”
  choice: Kuhifadhi “uso wangu” katika matini kuu
  alternative: uwepo wangu
  rationale: Kiebrania kinatumia taswira halisi ya “uso.” Tafsiri haiiondoi taswira hiyo kwa kuibadili kuwa dhana ya kimafafanuzi; uwezekano wa maana ya “uwepo” umeonyeshwa katika tanbihi.
- issue: Maana ya jumla ya הָאָדָם
  choice: mwanadamu
  alternative: wanadamu; binadamu yeyote
  rationale: Neno la Kiebrania ni umoja lakini linarejelea jamii yote ya wanadamu. “Mwanadamu” huhifadhi umoja wa kisarufi na maana ya jumla, ambayo imefafanuliwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Muundo “hakuna mwanadamu atakayeniona na kuishi” ni wa asili kwa Kiswahili na huhifadhi kauli ya jumla pamoja na matokeo yanayotajwa katika Kiebrania.
