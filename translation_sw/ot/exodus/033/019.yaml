  text: וַ/יֹּ֗אמֶר אֲנִ֨י אַעֲבִ֤יר כָּל טוּבִ/י֙ עַל פָּנֶ֔י/ךָ וְ/קָרָ֧אתִֽי בְ/שֵׁ֛ם יְהוָ֖ה לְ/פָנֶ֑י/ךָ וְ/חַנֹּתִי֙ אֶת אֲשֶׁ֣ר אָחֹ֔ן וְ/רִחַמְתִּ֖י אֶת אֲשֶׁ֥ר אֲרַחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/019.yaml
  text: And he said[a], “I myself will make all my goodness pass before you, and I will proclaim the name of Yahweh before you. And I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.”
translation:
  language: sw
  text: Naye akasema, “Mimi mwenyewe nitapitisha wema wangu wote mbele yako, nami nitalitangaza jina la Yahwe mbele yako. Nitamtendea neema yule nitakayemtendea neema, nami nitamhurumia yule nitakayemhurumia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nami nitamrehemu yule nitakayemrehemu.”
    reason: Njia nyingine halali ya kutafsiri kitenzi cha Kiebrania רִחַם, ambacho kinaweza kumaanisha ‘kumhurumia’ au ‘kumrehemu.’
lexical_decisions:
- source_word: אַעֲבִיר
  choice: nitapitisha
  rationale: Kauli ya kusababisha katika Kiebrania inaonyesha kwamba Mungu atasababisha wema wake upite; ‘nitapitisha’ hudumisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: כָּל טוּבִי
  choice: wema wangu wote
  rationale: Neno hili linaweza kumaanisha wema, uzuri, au ukarimu; hapa ‘wema’ linafaa kwa muktadha wa Mungu kujifunua pamoja na neema na huruma yake.
- source_word: עַל־פָּנֶיךָ
  choice: mbele yako
  rationale: Hii ni tafsiri ya kawaida ya nahau ya mahali, bila kutumia usemi mgumu wa neno kwa neno kama ‘juu ya uso wako.’
- source_word: וְקָרָאתִי בְשֵׁם יְהוָה
  choice: nami nitalitangaza jina la Yahwe
  rationale: Katika muktadha huu, kitenzi kinahusu kutangaza jina na tabia ya Mungu, si kuliitia jina hilo katika sala.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: לְפָנֶיךָ
  choice: mbele yako
  rationale: Usemi huu unadumisha maana halisi ya uwepo na mahali mbele ya Musa.
- source_word: וְחַנֹּתִי אֶת אֲשֶׁר אָחֹן
  choice: Nitamwonyesha neema yeyote nitakayemwonyesha neema
  rationale: Kurudiwa kwa mzizi uleule kumedumishwa ili kuhifadhi msisitizo wa Kiebrania; ‘kuonyesha neema’ ni wazi na yenye hadhi katika Kiswahili.
- source_word: וְרִחַמְתִּי אֶת אֲשֶׁר אֲרַחֵם
  choice: nami nitamhurumia yeyote nitakayemhurumia
  rationale: ‘Kumhurumia’ huwasilisha maana ya kuwa na huruma au kuonyesha rehema, huku marudio ya kimakusudi yakidumishwa.
- source_word: אֲנִי
  choice: Mimi mwenyewe
  rationale: Kiwakilishi kilichotajwa wazi katika Kiebrania kinaongeza msisitizo; ‘Mimi mwenyewe’ huonyesha msisitizo huo bila kuongeza wazo la ‘mimi peke yangu.’
theological_decisions:
- issue: Tamko la Mungu kuhusu neema na huruma yake
  choice: Marudio ya nafsi ya kwanza yamedumishwa bila kuyapunguza au kuyaeleza kwa mfumo fulani wa kiteolojia.
  alternative: Kulieleza kama kanuni ya jumla kuhusu wema wa Mungu, au kutumia maneno yanayoingiza hitimisho la baadaye kuhusu uteuzi na uamuzi wa Mungu.
  rationale: Kiebrania kinasisitiza uhuru wa Mungu katika kuonyesha neema na huruma. Tafsiri inadumisha mvutano huo bila kuamua mabishano ya kiteolojia ambayo kifungu chenyewe hakiyafafanui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Miundo ya marudio imedumishwa kwa sababu ni sehemu muhimu ya msisitizo wa Kiebrania, huku sentensi nyingine zikiwekwa katika mtiririko wa kawaida wa Kiswahili.
