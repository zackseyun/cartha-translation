id: EXO.33.12
reference: Exodus 33:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה רְ֠אֵה אַתָּ֞ה אֹמֵ֤ר אֵלַ/י֙ הַ֚עַל אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַתָּה֙ לֹ֣א הֽוֹדַעְתַּ֔/נִי אֵ֥ת אֲשֶׁר תִּשְׁלַ֖ח עִמִּ֑/י וְ/אַתָּ֤ה אָמַ֨רְתָּ֙ יְדַעְתִּ֣י/ךָֽ בְ/שֵׁ֔ם וְ/גַם מָצָ֥אתָ חֵ֖ן בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/012.yaml
  text: Then Moses said to Yahweh[a], “See, you are saying to me, ‘Bring up this people,’ but you have not made known to me whom you will send with me. Yet you have said, ‘I know you by name[c][b], and you also have found favor in my sight.’”
translation:
  language: sw
  text: Ndipo Musa akamwambia Yahweh[a], “Tazama, wewe unaniambia, ‘Wapandishe watu hawa,’ lakini hujanijulisha ni nani utakayemtuma pamoja nami. Hata hivyo, umesema, ‘Ninakujua kwa jina[b], tena umepata kibali machoni pangu[c].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh ni jina binafsi la Mungu linalowakilishwa kwa konsonanti YHWH katika Kiebrania.
    reason: cultural_note
  - marker: b
    text: Kauli ya Kiebrania “Ninakujua kwa jina” ni nahau inayoonyesha kumjua mtu binafsi na kumkubali.
    reason: cultural_note
  - marker: c
    text: Neno linalotafsiriwa “kibali” linaweza pia kutafsiriwa “neema”; kwa neno moja moja, nahau hiyo ni “umepata kibali machoni pangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo; umbo “Yahweh” linawakilisha tetragramatoni ya Kiebrania.
- source_word: רְאֵה
  choice: Tazama
  rationale: Ni amri inayotumika hapa kama kiashiria cha hotuba kinachoanzisha hoja ya Musa; “Tazama” inadumisha msisitizo wake wa moja kwa moja.
- source_word: הַעַל
  choice: Wapandishe
  rationale: Hifili ya עלה ina maana ya kusababisha wapande au kuwapeleka juu. “Wapandishe” inadumisha maana ya mwelekeo katika safari kutoka Misri.
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: Hiki ndicho Kiswahili cha kawaida na cha asili kwa nomino ya mkusanyiko ya Kiebrania ‘watu hawa,’ huku sauti yenye umbali fulani ikihifadhiwa na kiashiria “hawa.”
- source_word: הוֹדַעְתַּנִי
  choice: hujanijulisha
  rationale: Hifili ya ידע ni ‘kufanya nijue/kufahamisha’; “hujanijulisha” huhifadhi maana hiyo ya kisababishi kwa Kiswahili cha kawaida.
- source_word: אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  choice: ni nani utakayemtuma pamoja nami
  rationale: Kishazi hiki kwa kawaida humrejelea mtu atakayeandamana na Musa. “Pamoja nami” hutafsiri moja kwa moja wazo la uandamani katika עִם.
- source_word: יְדַעְתִּיךָ בְשֵׁם
  choice: Ninakujua kwa jina
  rationale: Nahau imehifadhiwa bila kuipanua kuwa dai la kiteolojia lisilotajwa wazi; inaonyesha ujuzi wa kibinafsi na upendeleo.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: umepata kibali machoni pangu
  rationale: Tafsiri hii huhifadhi picha ya nahau ya Kiebrania na maana ya חֵן kama kibali au neema, huku ikibaki wazi kwa msomaji wa Kiswahili.
- source_word: וְגַם
  choice: tena
  rationale: “Tena” hudumisha maana ya nyongeza katika kauli ya pili bila kufanya sentensi kuwa nzito.
- source_word: וְאַתָּה ... לֹא ... וְאַתָּה אָמַרְתָּ
  choice: lakini ... Hata hivyo, umesema
  rationale: Viunganishi hivi vinaonyesha mvutano wa hoja ya Musa na kurudia kwa msisitizo katika Kiebrania kwa Kiswahili cha asili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kauli “Ninakujua kwa jina”
  choice: Kudumisha nahau ya uhusiano bila kuifafanua kupita maandishi
  alternative: Ninakujua kibinafsi; Nimekuchagua kibinafsi
  rationale: Kiebrania kinaonyesha Mungu kumjua Musa binafsi na kumkubali, lakini hakisemi moja kwa moja katika kishazi hiki kwamba alimchagua. Tafsiri inadumisha uzito na pia mipaka ya kauli hiyo.
- issue: Maana ya חֵן
  choice: kibali
  alternative: neema
  rationale: “Kibali” kinafaa katika nahau ya kupata upendeleo mbele ya mtu na hakiongezi maana maalumu ya kimadhehebu; “neema” bado ni uwezekano halali na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa moja kwa moja na unaosomeka kwa urahisi. Miundo “Wapandishe,” “hujanijulisha,” na “machoni pangu” inadumisha sura muhimu za Kiebrania bila kufanya sentensi iwe ngumu au ya kizamani.
