  to: Kisha Yahwe akamwambia Musa[a], “Ondoka hapa, wewe pamoja na watu uliowapandisha kutoka nchi ya Misri, mwende katika nchi niliyowaapia Abrahamu, Isaka na Yakobo, nikisema, ‘Nitaupa uzao wako[b] nchi hiyo.’”
