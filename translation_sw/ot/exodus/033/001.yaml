review_pass:
  verdict: revise
  source_fidelity: The draft conveys the command, the reference to the people brought up from Egypt, and the oath to Abraham, Isaac, and Jacob faithfully. However, the quoted promise changes the singular collective recipient and the singular giving verb into a plural expression ("Nitawapa wazao wako"). The Hebrew has a collective singular, “to your offspring/seed I will give it.”
  naturalness: The register is clear, standard East African Swahili. “Ondoka hapa ... mwende” appropriately addresses Moses together with the people. “Uliowapandisha kutoka nchi ya Misri” is intelligible and retains the Hebrew verbal echo, though somewhat literal; it does not require alteration.
  terminology: “Yahwe” is an acceptable Swahili-oriented transliteration of YHWH and preserves the divine name rather than substituting a title. The conventional forms Abrahamu, Isaka, and Yakobo are suitable. “Uzao wako” is preferable here because it preserves the Hebrew collective singular יותר closely than “wazao wako.”
  issues:
  - severity: medium
    issue: 'The promise clause uses plural grammar: “Nitawapa wazao wako nchi hiyo.”'
    rationale: אֶתְּנֶנָּה means “I will give it,” and לְזַרְעֲךָ is grammatically singular, though collective in meaning. Swahili can preserve this naturally with “Nitaupa uzao wako nchi hiyo.”
  revised_text: Kisha Yahwe akamwambia Musa[a], “Ondoka hapa, wewe pamoja na watu uliowapandisha kutoka nchi ya Misri, mwende katika nchi niliyowaapia Abrahamu, Isaka na Yakobo, nikisema, ‘Nitaupa uzao wako[b] nchi hiyo.’”
