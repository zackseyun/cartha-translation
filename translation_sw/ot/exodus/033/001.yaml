language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ עֲלֵ֣ה מִ/זֶּ֔ה אַתָּ֣ה וְ/הָ/עָ֔ם אֲשֶׁ֥ר הֶֽעֱלִ֖יתָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל הָ/אָ֗רֶץ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/001.yaml
  text: Then Yahweh said to Moses[a], “Go up from here, you and the people whom you brought up from the land of Egypt, to the land that I swore to Abraham, to Isaac, and to Jacob, saying[b], ‘I will give it to your offspring.’”
translation:
  language: sw
  text: Kisha Yahwe akamwambia Musa[a], “Ondoka hapa, wewe pamoja na watu uliowapandisha kutoka nchi ya Misri, mwende katika nchi niliyowaapia Abrahamu, Isaka na Yakobo, nikisema, ‘Nitaupa uzao wako[b] nchi hiyo.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH; kwa kawaida hutafsiriwa “BWANA.”'
    reason: alternative_reading
  - marker: b
    text: 'Kwa neno moja moja: “uzao wako.” Neno la Kiebrania ni la umoja lakini linaweza kumaanisha wazao kwa ujumla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; ‘Kisha ... akamwambia’ ni Kiswahili cha kawaida katika utangulizi wa usemi wa moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja badala ya kubadilishwa na cheo, huku tahajia ‘Yahwe’ ikifuata matamshi ya kawaida ya Kiswahili.
- source_word: לֵךְ עֲלֵה מִזֶּה
  choice: Ondoka hapa ... mwende
  rationale: Vitenzi viwili vya amri vinaonyesha kuondoka na kusafiri kwenda juu/kuelekea nchi; Kiswahili hugawanya wazo hili kwa kawaida kuwa ‘Ondoka hapa ... mwende’.
- source_word: אֲשֶׁר הֶעֱלִיתָ
  choice: uliowapandisha
  rationale: Hifili ya עלה ina maana ya kuwapandisha au kuwatoa waende juu, na pia inadumisha mwangwi wa עֲלֵה katika amri.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: kutoka nchi ya Misri
  rationale: Huu ni usemi wa moja kwa moja na wa kawaida wa Kiswahili kwa chanzo au mahali walikotoka.
- source_word: נִשְׁבַּעְתִּי
  choice: niliyowaapia
  rationale: Muundo huu unaonyesha wazi kwamba Mungu aliwaapia Abrahamu, Isaka na Yakobo.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abrahamu, Isaka na Yakobo
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili; uhusiano wa ‘kwa’ umeingizwa katika kitenzi ‘niliyowaapia’.
- source_word: לֵאמֹר
  choice: nikisema
  rationale: Inatambulisha yaliyomo katika kiapo bila kuficha muundo wa Kiebrania.
- source_word: לְזַרְעֲךָ
  choice: wazao wako
  rationale: זֶרַע ni nomino ya umoja yenye maana ya kijumla; ‘wazao wako’ huwasilisha maana hiyo kwa Kiswahili cha sasa, ingawa haisawiri umoja wa kisarufi.
- source_word: אֶתְּנֶנָּה
  choice: Nitawapa ... nchi hiyo
  rationale: Kiambishi cha kike cha umoja kinarejelea ‘nchi’; kukitaja tena kama ‘nchi hiyo’ huweka rejeo wazi katika Kiswahili.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, YHWH. ‘Yahwe’ huhifadhi jina hilo kwa tahajia inayofaa Kiswahili badala ya kulibadilisha na cheo.
- issue: Musa kusemwa kuwa ndiye aliyewapandisha watu kutoka Misri
  choice: watu uliowapandisha kutoka nchi ya Misri
  alternative: watu uliowaongoza kutoka nchi ya Misri
  rationale: Tafsiri inadumisha kauli yenye mvutano ya chanzo inayomhusisha Musa moja kwa moja, bila kuibadili ili kumtaja Mungu kama mtendaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa amri umefanywa wa kawaida kwa Kiswahili huku uradidi wa maana ya ‘kupanda’ ukihifadhiwa katika ‘uliowapandisha’. Alama zote za tanbihi [a] na [b] zimo katika matini kuu.
