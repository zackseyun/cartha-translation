  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה גַּ֣ם אֶת הַ/דָּבָ֥ר הַ/זֶּ֛ה אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֶֽעֱשֶׂ֑ה כִּֽי מָצָ֤אתָ חֵן֙ בְּ/עֵינַ֔/י וָ/אֵדָעֲ/ךָ֖ בְּ/שֵֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/017.yaml
  text: And Yahweh said to Moses[a], “I will also do this thing that you have spoken, because you have found favor in my eyes[b], and I know you by name.”
translation:
  language: sw
  text: Yahwe akamwambia Musa, “Nitalifanya pia jambo hili[a] ulilosema, kwa sababu umepata kibali machoni pangu[b], nami ninakujua kwa jina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno hili.” Neno la Kiebrania linaweza kumaanisha jambo, suala, au neno.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “umepata kibali machoni pangu” ni nahau yenye maana ya kukubaliwa na kutazamwa kwa fadhili.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la agano la Mungu lililo katika maandishi ya Kiebrania, kwa tahajia ya kawaida ya Kiswahili.
- source_word: גַּם
  choice: pia
  rationale: Hutoa maana ya nyongeza kwa ombi la Musa lililotangulia.
- source_word: הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: דָּבָר linaweza kumaanisha jambo, neno, au suala; hapa linarejelea ombi ambalo Musa ametoka kulisema.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: ulilosema
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachodumisha uhusiano na maneno aliyosema Musa.
- source_word: אֶעֱשֶׂה
  choice: nitalifanya
  rationale: Kitenzi עשה kina maana ya kufanya, na kiambishi cha yambwa kinarejelea ‘jambo hili.’
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: umepata kibali machoni pangu
  rationale: Linahifadhi taswira ya nahau ya Kiebrania huku ‘kibali’ kikieleza kuwa Musa amepokelewa kwa fadhili.
- source_word: וָאֵדָעֲךָ
  choice: nami ninakujua
  rationale: Huwasilisha ujuzi wa Mungu wa kibinafsi na wa kimahusiano bila kuupunguza kuwa taarifa ya kawaida tu.
- source_word: בְּשֵׁם
  choice: kwa jina
  rationale: Linadumisha wazo la kumjua na kumtambua Musa kibinafsi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu la herufi nne; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘akamwambia’ unafaa kwa usimulizi, huku ‘nami ninakujua kwa jina’ ukihifadhi uzito wa uhusiano wa kibinafsi uliomo katika Kiebrania.
