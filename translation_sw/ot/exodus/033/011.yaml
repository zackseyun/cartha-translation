  text: וְ/דִבֶּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ פָּנִ֣ים אֶל פָּנִ֔ים כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר אִ֖ישׁ אֶל רֵעֵ֑/הוּ וְ/שָׁב֙ אֶל הַֽ/מַּחֲנֶ֔ה וּ/מְשָׁ֨רְת֜/וֹ יְהוֹשֻׁ֤עַ בִּן נוּן֙ נַ֔עַר לֹ֥א יָמִ֖ישׁ מִ/תּ֥וֹךְ הָ/אֹֽהֶל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/011.yaml
  text: And Yahweh would speak to Moses face to face[a], as a man speaks to his friend. Then he would return to the camp, but his attendant Joshua son of Nun, a young man[b], would not depart from the midst of the tent.
translation:
  language: sw
  text: Yahweh alikuwa akizungumza na Musa uso kwa uso[a], kama mtu anavyozungumza na rafiki yake. Kisha Musa alikuwa akirudi kambini, lakini mhudumu wake Yoshua mwana wa Nuni, kijana, hakutoka hemani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moja kwa moja” au “binafsi.” Nahau ya Kiebrania “uso kwa uso” inaeleza mawasiliano ya moja kwa moja yasiyo ya kawaida.
    reason: lexical_alternative
  - marker: b
    text: Yaani, hema la kukutania.
    reason: cross_reference
lexical_decisions:
- source_word: וְדִבֶּר
  choice: alikuwa akizungumza
  rationale: Muundo huu wa Kiswahili unaonyesha tendo la mazoea lililorudiwa katika mazingira ya hema la kukutania, badala ya tukio moja tu la wakati uliopita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa kutafsiri matamshi ya Tetragramatoni, badala ya kulibadilisha kuwa cheo.
- source_word: פָּנִים אֶל פָּנִים
  choice: uso kwa uso
  rationale: Nahau hii ya kawaida inahifadhi picha ya Kiebrania na kueleza mawasiliano ya moja kwa moja na ya karibu bila kuamua kwamba Musa alimwona Mungu kwa macho.
- source_word: כַּאֲשֶׁר יְדַבֵּר אִישׁ אֶל רֵעֵהוּ
  choice: kama mtu anavyozungumza na rafiki yake
  rationale: Hii ni lugha ya kawaida ya Kiswahili inayohifadhi ulinganisho wa mtu anayezungumza kwa ukaribu na rafiki yake.
- source_word: וְשָׁב
  choice: Kisha Musa alikuwa akirudi
  rationale: Jina Musa limerudiwa ili kuondoa utata wa kiwakilishi katika Kiswahili, na hali ya mazoea imehifadhiwa.
- source_word: וּמְשָׁרְתוֹ
  choice: mhudumu wake
  rationale: Mhudumu huonyesha jukumu la Yoshua la kumsaidia Musa bila kudokeza utumwa wa nyumbani.
- source_word: יְהוֹשֻׁעַ בִּן־נוּן
  choice: Yoshua mwana wa Nuni
  rationale: Majina yamewasilishwa kwa maumbo yanayoeleweka katika Kiswahili, na patronimu imehifadhiwa kwa 'mwana wa'.
- source_word: נַעַר
  choice: ambaye alikuwa kijana
  rationale: Neno linaweza kumaanisha kijana au mtumishi mchanga; hapa 'kijana' linaonyesha umri wake wa kulinganishwa bila kurudia maana ya huduma ambayo tayari imo katika 'mhudumu'.
- source_word: לֹא יָמִישׁ
  choice: hakuwa akiondoka
  rationale: Muundo huu unaonyesha kwamba Yoshua kwa kawaida hakujiondoa huko, sambamba na mtiririko wa matendo ya mazoea katika mstari.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: ndani ya hema
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kuwa hakutoka katika sehemu ya ndani ya hema; muktadha unabainisha kuwa ni hema la kukutania.
theological_decisions:
- issue: Lugha inayomweleza Yahweh akizungumza na Musa “uso kwa uso”
  choice: Kuhifadhi nahau “uso kwa uso” kama maelezo ya mkutano wa moja kwa moja na wa karibu
  alternative: Kutafsiri kwa ufafanuzi kuwa “moja kwa moja” au “binafsi”
  rationale: Kiebrania kinaacha mvutano kati ya ukaribu wa mawasiliano haya na mafungu mengine kuhusu kutomwona Mungu. Tafsiri haipaswi kuondoa mvutano huo kwa kuamua kimya-kimya kwamba kauli hii ni ya mfano au ya kuona kwa macho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Miundo ya “alikuwa akizungumza,” “alikuwa akirudi,” na “hakuwa akiondoka” inadumisha hali ya matendo ya mazoea. Alama [b] imewekwa baada ya “hema,” kwa kuwa tanbihi inaeleza hema hilo, si neno “kijana.”
