  yaml_path: translation/ot/exodus/033/018.yaml
  text: Then he said[a], “Please show me your glory.”
translation:
  language: sw
  text: Kisha akasema, “Tafadhali, nionyeshe utukufu wako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Kisha akasema
  rationale: Waw-consecutive inaendeleza simulizi kwa mfuatano. “Kisha akasema” ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo ya mfuatano.
- source_word: הַרְאֵנִי
  choice: nionyeshe
  rationale: Hii ni amri ya Hiphil ya ראה yenye kiambishi cha nafsi ya kwanza umoja, kihalisi “sababisha nione.” “Nionyeshe” huwasilisha maana hiyo ya kusababisha kuona kwa Kiswahili cha asili.
- source_word: נָא
  choice: Tafadhali
  rationale: Chembe נָא huonyesha ombi la kusihi au adabu; “tafadhali” ni sawia ya kisasa na iliyo wazi.
- source_word: אֶת
  choice: '[alama ya yambwa dhahiri, haitafsiriwi]'
  rationale: אֶת ni alama ya yambwa dhahiri katika Kiebrania na haihitaji neno tofauti katika Kiswahili.
- source_word: כְּבֹדֶךָ
  choice: utukufu wako
  rationale: כָּבוֹד inaweza kumaanisha utukufu, heshima, au fahari inayodhihirishwa. Katika ombi hili, “utukufu wako” huhifadhi upana wa maana bila kuufanya kuwa mng'ao wa kuonekana pekee.
theological_decisions:
- issue: Maana ya “utukufu wako” katika ombi la Musa
  choice: utukufu wako
  alternative: fahari yako; udhihirisho kamili wa uwepo wako
  rationale: Kiebrania hakibainishi ikiwa Musa anaomba kuona mng'ao, ukuu wa Mungu, au udhihirisho wa uwepo wake. “Utukufu wako” huhifadhi upana na mvutano huo wa kiteolojia bila kuamua maana moja kwa tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa moja kwa moja na wa asili; hakuna tanbihi iliyoongezwa kwa kuwa tafsiri kuu inabeba maana ya kisababishi na upana wa כָּבוֹד bila kuhitaji alama ya ufafanuzi.
