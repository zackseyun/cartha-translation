base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/013.yaml
  text: Now therefore[a], if I have found favor in your eyes, please make your ways known to me, so that I may know you, in order that I may find favor in your eyes[c][b]. And consider that this nation is your people.
translation:
  language: sw
  text: Sasa basi, ikiwa nimepata kibali machoni pako, tafadhali nijulishe njia zako[a], ili nikujue, kusudi nipate kibali machoni pako. Na uzingatie[b] kwamba taifa hili ni watu wako[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “njia zako,” katika wingi; yaani namna zako za kutenda au mwenendo wako.'
    reason: lexical_note
  - marker: b
    text: Au, “uone.” Hapa maana yake ni kutambua jambo na kulipa uzito.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinatumia maneno yote mawili, “taifa” na “watu wako.”
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sasa basi
  rationale: Huonyesha wakati pamoja na hitimisho linalotokana na mazungumzo yaliyotangulia; ni kauli ya kawaida na yenye hadhi katika Kiswahili.
- source_word: נָא
  choice: tafadhali
  rationale: Huwasilisha ombi la heshima bila kutumia lugha ya kizamani.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: nimepata kibali machoni pako
  rationale: Huhifadhi tamathali ya Kiebrania ‘machoni pako’ na kurudia kwake katika aya, huku ‘kibali’ kikieleza kukubaliwa kwa Musa.
- source_word: הוֹדִעֵנִי
  choice: nijulishe
  rationale: Hifili ya ידע ina maana ya kusababisha mtu ajue; ‘nijulishe’ ni sahihi na ya asili katika Kiswahili.
- source_word: דְּרָכֶךָ
  choice: njia yako
  rationale: Umbo katika maandishi ya WLC ni la umoja, likimaanisha namna au mwenendo wa Mungu katika kutenda.
- source_word: וְאֵדָעֲךָ
  choice: ili nikujue
  rationale: Huhifadhi lengo la ombi na maana ya kibinafsi ya kumjua Mungu, si kupata habari tu.
- source_word: לְמַעַן אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: kusudi nipate kibali machoni pako
  rationale: ‘Kusudi’ huonyesha lengo la לְמַעַן, na kurudiwa kwa msemo wa kibali kunahifadhi msisitizo wa Kiebrania.
- source_word: וּרְאֵה
  choice: Na uzingatie
  rationale: Ingawa kitenzi cha msingi ni ‘ona,’ hapa amri ina maana ya kutambua na kulipa jambo uzito.
- source_word: כִּי עַמְּךָ הַגּוֹי הַזֶּה
  choice: kwamba taifa hili ni watu wako
  rationale: Hutofautisha גּוֹי (‘taifa’) na עַם (‘watu’) na hivyo kuhifadhi lugha ya kitaifa pamoja na uhusiano maalumu na Mungu.
theological_decisions:
- issue: Maana ya agano katika kishazi cha mwisho
  choice: taifa hili ni watu wako
  alternative: watu hawa ni watu wako
  rationale: Kiebrania kinatumia maneno mawili tofauti, גּוֹי na עַם. Kuyatafsiri ‘taifa’ na ‘watu’ huhifadhi mvutano wa lugha ya kitaifa na ya uhusiano wa Mungu na watu wake bila kuongeza dai la kimadhehebu.
- issue: Umoja au wingi wa דְּרָכֶךָ
  choice: njia yako
  alternative: njia zako
  rationale: Maandishi ya WLC yana umbo la umoja דְּרָכֶךָ; kwa hiyo tafsiri inafuata ushahidi wa chanzo badala ya dai la tabaka la Kiingereza kwamba ni wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa sasa na hadhi ya maandiko. Tamathali ‘machoni pako’ na marudio yake yamehifadhiwa kwa uwazi; msamiati wa kimadhehebu umeepukwa.
