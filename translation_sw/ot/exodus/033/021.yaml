  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Jina la agano limetafsiriwa kwa desturi ya Kiswahili ya Biblia kama “BWANA,” kwa herufi kubwa ili kulitofautisha na cheo cha kawaida.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili la kuelekeza fikira lina uzito wa heshima na linafaa katika usemi wa Mungu.
- source_word: מָקוֹם אִתִּי
  choice: pana mahali karibu nami
  rationale: Kirai hiki kinadumisha wazo la mahali palipo katika ukaribu wa Mungu bila kulazimisha maana ya umiliki.
- source_word: וְנִצַּבְתָּ
  choice: nawe utasimama
  rationale: Muundo wa wakati ujao unaendana na agizo au mpango unaofuata katika muktadha.
- source_word: עַל הַצּוּר
  choice: juu ya mwamba
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya mahali Musa atakaposimama.
theological_decisions:
- issue: Maana ya מָקוֹם אִתִּי kuhusu ukaribu na Mungu
  choice: mahali karibu nami
  alternative: mahali pamoja nami / mahali kando yangu
  rationale: “Karibu nami” ni Kiswahili cha kawaida kinachoonyesha ukaribu bila kudai kwamba Mungu amefungiwa mahali fulani au kwamba mahali hapo ni sehemu ya nafsi yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Pana” limetumiwa kwa mtiririko wa asili kuliko “kuna” baada ya “Tazama,” huku “mwamba” likihifadhi taswira halisi ya kifungu.
