  text: And the LORD said to him, “Who has put a mouth on man? Or who makes one mute, or deaf, or sighted, or blind? Is it not I, the LORD?”
translation:
  language: sw
  text: BWANA akamwambia, “Ni nani aliyempa mwanadamu kinywa? Ni nani anayemfanya mtu kuwa bubu, au kiziwi, au mwenye kuona, au kipofu? Je, si mimi, BWANA?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika Biblia za Kiswahili ya kuwakilisha jina la agano kwa BWANA, huku ikidumisha hadhi na utambulisho wa msemaji.
- source_word: שָׂם פֶּה לָאָדָם
  choice: aliyempa mwanadamu kinywa
  rationale: Kiswahili cha asili na wazi; maana halisi ni ‘aliyeweka kinywa kwa mwanadamu,’ yaani aliyemjalia uwezo wa kusema.
- source_word: אִלֵּם
  choice: bubu
  rationale: Neno la kawaida la Kiswahili linalolingana moja kwa moja na hali ya kutoweza kusema katika muktadha huu.
- source_word: חֵרֵשׁ
  choice: kiziwi
  rationale: Huwasilisha kwa usahihi mtu asiyeweza kusikia.
- source_word: פִּקֵּחַ
  choice: mwenye kuona
  rationale: Katika jozi na ‘kipofu,’ neno hili humaanisha mwenye uwezo wa kuona; tafsiri hii huhifadhi ulinganifu wa kifungu bila kuongeza wazo la utambuzi wa kiakili.
- source_word: עִוֵּר
  choice: kipofu
  rationale: Neno la kawaida na sahihi kwa mtu asiyeona.
theological_decisions:
- issue: Kauli ya Mungu kuhusu uwezo na ulemavu wa kibinadamu
  choice: Ni nani anayemfanya mtu kuwa bubu au kiziwi, mwenye kuona au kipofu? Je, si mimi, BWANA?
  alternative: Ni nani anayemruhusu mtu kuwa bubu au kiziwi...
  rationale: Kitenzi יָשׂוּם ni ‘huweka/hufanya,’ si ‘huruhusu.’ Tafsiri inahifadhi dai lenye nguvu la enzi ya Mungu na mvutano wake wa kitheolojia bila kulipunguza au kulifafanua kwa mfumo fulani wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Maswali ya balagha na mpangilio wa jozi katika Kiebrania vimehifadhiwa kwa mtiririko wa asili wa Kiswahili.
