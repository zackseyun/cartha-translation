  text: וַֽ/יַּאֲמֵ֖ן הָ/עָ֑ם וַֽ/יִּשְׁמְע֡וּ כִּֽי פָקַ֨ד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/כִ֤י רָאָה֙ אֶת עָנְיָ֔/ם וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/031.yaml
  text: And the people believed[a]; and when they heard that Yahweh had visited the sons of Israel and that he had seen their affliction[c][b], they bowed down and worshiped.
translation:
  language: sw
  text: Watu wakaamini; waliposikia kwamba Yahweh alikuwa amewatembelea[a] wana wa Israeli[b] na kwamba alikuwa ameyaona mateso yao[c], wakainama na kuabudu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alikuwa amewatia maanani” au “alikuwa amewashughulikia.” Kitenzi cha Kiebrania kinaweza kumaanisha kutembelea, kutia maanani, au kuchukua hatua kwa ajili ya mtu, mara nyingi kikidokeza kuingilia kati kwa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au “Waisraeli.” Kwa maana halisi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: c
    text: Au “taabu yao” au “hali yao ya kudhulumiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: wakaamini
  rationale: Hifili ya אמן hapa inaonyesha kwamba watu waliamini ujumbe na ishara walizoonyeshwa; hakuna kiambishi cha yambwa katika Kiebrania, kwa hiyo hakijaongezwa.
- source_word: הָעָם
  choice: Watu
  rationale: Nomino hii ya umoja yenye maana ya mkusanyiko inatafsiriwa kwa Kiswahili cha kawaida kuwa “watu.”
- source_word: וַיִּשְׁמְעוּ כִּי
  choice: Waliposikia kwamba
  rationale: Muundo huu unatambulisha jambo walilosikia na kuunganisha habari hiyo na mwitikio wao kwa njia ya kawaida katika Kiswahili.
- source_word: פָקַד יְהוָה
  choice: Yahweh alikuwa amewajilia
  rationale: Kitenzi פקד kinaweza kumaanisha kujilia, kuangalia au kushughulikia, mara nyingi kikidokeza kwamba Mungu anaingilia kati. “Amewajilia” kinahifadhi taswira halisi bila kueleza kupita kiasi aina ya hatua aliyochukua.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili linahifadhi usemi wa kifamilia wa Kiebrania, huku “Waisraeli” ikitajwa kama tafsiri nyingine ya kawaida.
- source_word: רָאָה אֶת עָנְיָם
  choice: alikuwa ameyaona mateso yao
  rationale: “Kuyaona” kinahifadhi kitenzi halisi cha Kiebrania, nacho katika muktadha kinadokeza kutambua hali yao kwa kujali. “Mateso” ni neno la sasa na linaloeleweka kwa עָנְיָם.
- source_word: וַיִּקְּדוּ
  choice: wakainama
  rationale: קדד hueleza kuinamisha mwili; “wakainama” ni ya asili na inatofautisha tendo hili na kitenzi kinachofuata.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: na kuabudu
  rationale: Kitenzi hiki huonyesha kusujudu kwa heshima au ibada. Kwa kuwa tayari kuna kitenzi tofauti cha kuinama, “kuabudu” kinaonyesha wazi maana ya kitendo hicho.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko lina jina la agano יְהוָה; “Yahweh” linawakilisha jina hilo moja kwa moja badala ya kulibadili kuwa cheo.
- issue: Kuhifadhi usemi wa kifamilia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Tafsiri kuu inahifadhi umbo la kifamilia la chanzo bila kudai kwamba rejeo linawahusu wanaume pekee; tafsiri ya kawaida zaidi imewekwa katika tanbihi.
- issue: Maana ya kitendo cha פקד
  choice: alikuwa amewajilia
  alternative: alikuwa amewaangalia kwa kujali
  rationale: Kitenzi kinaweza kueleza kuwatilia maanani pamoja na hatua ya Mungu kwa ajili yao. Tafsiri kuu inahifadhi upana huo badala ya kubainisha hatua fulani ambayo mstari hautaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili zinatumika ili mtiririko uwe wazi. Mfuatano “wakainama na kuabudu” unatenganisha ishara ya mwili na maana yake ya ibada bila marudio yasiyo ya lazima.
