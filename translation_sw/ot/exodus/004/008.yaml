  text: And it will be[a], if they do not believe you and do not listen to the voice of the first sign, then they will believe the voice of the latter sign.
translation:
  language: sw
  text: Na itakuwa kwamba, ikiwa hawatakuamini wala kuisikiliza sauti ya ishara ya kwanza, wataiamini sauti ya ishara ya baadaye[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ishara ya mwisho.” Neno la Kiebrania linaweza kumaanisha “ya baadaye” au “ya mwisho”; “ya baadaye” halidokezi kwamba hakuna ishara nyingine ambayo ingeweza kufuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Na itakuwa kwamba
  rationale: Inahifadhi kwa kiasi cha kawaida muundo wa Kiebrania unaoanzisha hali na matokeo ya wakati ujao.
- source_word: יַאֲמִינוּ לָךְ
  choice: hawatakuamini
  rationale: Hifil ya אמן pamoja na ל ina maana ya kumwamini au kumtumaini mtu; hapa inahusu kuukubali ujumbe wa Musa.
- source_word: יִשְׁמְעוּ
  choice: kuisikiliza
  rationale: שׁמע hapa ina wazo la kusikia kwa makini au kuitikia ushahidi, bila kulazimisha maana mahsusi ya kutii.
- source_word: לְקוֹל
  choice: sauti ya
  rationale: Inadumisha taswira ya Kiebrania ya ishara kana kwamba inanena kwa ushahidi wake.
- source_word: הָאֹת
  choice: ishara
  rationale: Ni tafsiri ya kawaida ya אוֹת na haiongezi waziwazi sifa ya kimiujiza ambayo haikutajwa katika neno lenyewe.
- source_word: הָרִאשׁוֹן
  choice: ya kwanza
  rationale: Inawakilisha moja kwa moja maana ya רִאשׁוֹן na kuandaa utofautishaji na ishara inayofuata.
- source_word: וְהֶאֱמִינוּ
  choice: wataiamini
  rationale: Kitenzi hiki ni matokeo ya sharti lililotangulia; mpangilio wa Kiswahili unafanya uhusiano huo uwe wazi bila kuongeza neno lisilo la lazima.
- source_word: הָאַחֲרוֹן
  choice: ya baadaye
  rationale: אַחֲרוֹן inaweza kumaanisha ya baadaye au ya mwisho. 'Ya baadaye' inadumisha utofautishaji bila kudokeza kwamba hakuna ishara nyingine itakayofuata.
