  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya ‘sauti ya ishara’ imehifadhiwa kwa sababu ni muhimu katika usemi wa Kiebrania; kiwakilishi ‘-i-’ katika ‘kuisikiliza’ na ‘wataiamini’ kinarejelea sauti.
