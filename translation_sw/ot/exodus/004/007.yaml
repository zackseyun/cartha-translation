  text: And he said[a], “Put your hand back into your bosom.” So he put his hand back into his bosom, and when he brought it out from his bosom, behold[b], it had returned like his flesh.
translation:
  language: sw
  text: Naye akasema, “Rudisha mkono wako kifuani mwako[a].” Basi akaurudisha mkono wake kifuani mwake, na alipoutoa kifuani mwake, tazama[b], mkono wake ukawa tena kama mwili wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndani ya mkunjo wa vazi lako kifuani.”
    reason: cultural_note
  - marker: b
    text: Yaani, mkono wake ulikuwa umerejea hali yake ya kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב
  choice: Rudisha
  rationale: Kauli ya kuamuru katika Hifili ya שוב ina maana ya kuufanya mkono urudi mahali ulipokuwa; “rudisha” ni ya asili na huhifadhi wazo la kurudi.
- source_word: חֵיק
  choice: kifuani
  rationale: Neno hili linaweza kumaanisha kifua au sehemu ya vazi iliyokunjika kifuani ambako mkono unaweza kutiwa. “Kifuani” ni wazi na ya kawaida; maana ya ukingo wa vazi imeelezwa katika tanbihi.
- source_word: וַיָּשֶׁב
  choice: akaurudisha
  rationale: Kitenzi cha masimulizi kinarudia tendo lililoamriwa na hudumisha ulinganifu wa maneno na “Rudisha.”
- source_word: וַיּוֹצִאָהּ
  choice: alipoutoa
  rationale: Hifili ya יצא humaanisha kusababisha kitu kitoke. Katika Kiswahili, “kuutoa” ni usemi wa kawaida na sahihi kwa tendo hili.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: “Tazama” huvuta usikivu kwa matokeo ya kushangaza na kuhifadhi uzito wa kisimulizi wa chembe ya Kiebrania.
- source_word: שָׁבָה
  choice: ulikuwa umerudi
  rationale: Kitenzi cha umoja wa kike kinarejelea “mkono.” Kauli hii huhifadhi wazo la kurudi badala ya kulifafanua moja kwa moja kuwa kuponywa.
- source_word: כִּבְשָׂרוֹ
  choice: kuwa kama mwili wake
  rationale: Kiambishi כ־ kinaonyesha ulinganisho. Tafsiri hii inabaki karibu na Kiebrania, huku muktadha ukionyesha kwamba mkono ulirudia hali yake ya kawaida.
