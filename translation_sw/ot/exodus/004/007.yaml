translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Maandiko. “Kifuani” limetumiwa badala ya neno la kizamani au lisilo wazi, na “tazama” limehifadhiwa ili kuonyesha mshangao wa matokeo.
