lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha akasema
  rationale: Wayyiqtol inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida bila kuongeza maana nzito ya wakati.
- source_word: הַשְׁלִיכֵהוּ
  choice: Itupe
  rationale: Amri ya umoja yenye kiambishi cha kitu inarejelea fimbo ya mstari uliotangulia; “itupe” ni ya sasa na ya asili kuliko “irushe” katika muktadha huu.
- source_word: אַרְצָה
  choice: chini
  rationale: Nomino yenye he ya mwelekeo humaanisha kuelekea ardhini; “chini” ni usemi wa kawaida wa Kiswahili kwa kutupa kitu ardhini.
- source_word: וַיַּשְׁלִיכֵהוּ
  choice: Basi akaitupa chini
  rationale: “Basi” huonyesha utekelezaji wa amri, huku kiambishi “-i-” kikirejelea fimbo.
- source_word: וַיְהִי לְנָחָשׁ
  choice: nayo ikawa nyoka
  rationale: נָחָשׁ ni nyoka; “nayo ikawa” huhifadhi mabadiliko ya kitu kilichotajwa bila kudokeza aina maalumu ya nyoka.
- source_word: וַיָּנָס
  choice: Musa akaikimbia
  rationale: נוס ina maana ya kukimbia au kutoroka kwa sababu ya hatari; “akaikimbia” ni usemi wa asili unaoonyesha kujiondoa haraka kutoka kwa nyoka.
- source_word: מִפָּנָיו
  choice: akaikimbia
  rationale: Kirai hiki ni halisi “kutoka mbele yake,” lakini hapa ni nahau yenye maana ya kukimbia mbali nayo; kiambishi kinarejelea nyoka kwa uwezekano mkubwa.
