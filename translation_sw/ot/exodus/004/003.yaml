translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetolewa kwa “Kisha” na “Basi,” huku marudio ya “chini” yakihifadhiwa kwa sababu yapo katika Kiebrania. Usemi “akaikimbia” ni mfupi na wa kawaida, na tanbihi huhifadhi umbo halisi pamoja na uwezekano mdogo wa kiwakilishi cha Kiebrania.
