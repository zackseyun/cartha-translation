base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/019.yaml
  text: And Yahweh said to Moses in Midian[a], “Go, return to Egypt, because all the men who were seeking your life are dead.”
translation:
  language: sw
  text: Yahwe akamwambia Musa huko Midiani, “Nenda, urudi Misri, kwa maana wanaume wote waliokuwa wakitafuta kukuua wamekufa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Ni mtindo wa kawaida na wa asili wa simulizi la Kiswahili kwa tendo linalofuatana katika masimulizi.
- source_word: בְּמִדְיָן
  choice: akiwa Midiani
  rationale: Kihusishi cha Kiebrania kinaonyesha mahali; muundo huu wa Kiswahili unaweka wazi kwamba Musa alikuwa Midiani alipoambiwa.
- source_word: לֵךְ שֻׁב
  choice: Nenda, urudi
  rationale: 'Linahifadhi amri zote mbili za Kiebrania: kwenda na kurudi, huku likibaki la kawaida katika Kiswahili.'
- source_word: מִצְרָיִם
  choice: Misri
  rationale: Baada ya kitenzi 'rudi', Kiswahili hakihitaji kihusishi cha kuelekea kabla ya jina la mahali.
- source_word: כִּי
  choice: kwa maana
  rationale: Linaanzisha sababu ya amri kwa lugha ya kawaida lakini yenye hadhi.
- source_word: מֵתוּ
  choice: wamekufa
  rationale: Kauli ya hali timilifu inaonyesha tendo lililokamilika lenye matokeo ya sasa.
- source_word: כָּל הָאֲנָשִׁים
  choice: watu wote
  rationale: Katika muktadha huu אֲנָשִׁים huwarejelea wale waliotafuta kumuua Musa; 'watu wote' ni Kiswahili cha kawaida bila kulazimisha jinsia ambapo si muhimu kwa maana.
- source_word: הַמְבַקְשִׁים אֶת נַפְשֶׁךָ
  choice: waliokuwa wakitafuta kukuua
  rationale: Nahau ya Kiebrania ya 'kutafuta uhai wako' humaanisha kujaribu kumuua mtu; tafsiri hii huwasilisha maana hiyo wazi na kwa kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la agano; 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nahau ya kutafuta nafsi/uhai wa Musa
  choice: kutafuta kukuua
  alternative: kutafuta uhai wako
  rationale: Katika muktadha huu nahau humaanisha kutaka kumuua Musa. Chaguo hili linaeleza kusudi hilo bila kuingiza dhana ya kiroho ya 'nafsi' isiyokusudiwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri mbili 'Nenda, urudi' umehifadhiwa ili kuakisi לֵךְ שֻׁב; hakuna tanbihi inayohitajika kwa kuwa zote zinaonekana katika matini kuu.
