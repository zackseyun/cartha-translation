  text: וַ/יִּֽחַר אַ֨ף יְהוָ֜ה בְּ/מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ הֲ/לֹ֨א אַהֲרֹ֤ן אָחִ֨י/ךָ֙ הַ/לֵּוִ֔י יָדַ֕עְתִּי כִּֽי דַבֵּ֥ר יְדַבֵּ֖ר ה֑וּא וְ/גַ֤ם הִנֵּה הוּא֙ יֹצֵ֣א לִ/קְרָאתֶ֔/ךָ וְ/רָאֲ/ךָ֖ וְ/שָׂמַ֥ח בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/014.yaml
  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
translation:
  language: sw
  text: Ndipo hasira ya Yahweh ikawaka dhidi ya Musa, naye akasema, “Je, hayupo Haruni ndugu yako, Mlawi? Ninajua kwamba anaweza kusema vizuri.[a] Tazama, yeye anatoka kukulaki; atakapokuona, atafurahi moyoni mwake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninajua kwamba yeye husema kwa ufasaha”; kwa tafsiri ya karibu zaidi na muundo wa Kiebrania, “kusema atasema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: hasira ... ikawaka
  rationale: Inahifadhi sitiari ya Kiebrania ya hasira kuwaka huku ikibaki ya asili na kueleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa Tetragramatoni linatoholewa badala ya kubadilishwa kuwa cheo.
- source_word: הֲלֹא
  choice: Je, hayupo
  rationale: Ni swali la balagha linalotarajia jibu la kukubali; muundo huu ni wa kawaida katika Kiswahili.
- source_word: הַלֵּוִי
  choice: Mlawi
  rationale: Ni jina la kawaida la Kiswahili kwa mtu wa kabila la Lawi; hapa halilazimishi maana ya cheo cha kikuhani.
- source_word: יָדַעְתִּי כִּי דַבֵּר יְדַבֵּר הוּא
  choice: Ninajua kwamba anaweza kusema vizuri
  rationale: Infinitivu kamili pamoja na kitenzi kilichotimilika inasisitiza uwezo wa Haruni wa kusema katika muktadha wa pingamizi la Musa; tanbihi inahifadhi uwezekano wa tafsiri iliyo karibu zaidi na umbo la Kiebrania.
- source_word: וְגַם הִנֵּה
  choice: Tazama, hata sasa
  rationale: “Tazama” huvuta fikira kwa taarifa inayofuata, na “hata sasa” huwasilisha nguvu ya nyongeza na hali inayoendelea bila kutumia usemi mgumu.
- source_word: יֹצֵא לִקְרָאתֶךָ
  choice: anatoka kuja kukulaki
  rationale: Inahifadhi hali endelevu ya participio na wazo la kutoka ili kukutana na Musa.
- source_word: וְרָאֲךָ
  choice: atakapokuona
  rationale: Kishazi cha wakati kinaonyesha kwa kawaida kwamba kumwona Musa ndiko kunakotangulia furaha ya Haruni.
- source_word: וְשָׂמַח בְּלִבּוֹ
  choice: atafurahi moyoni mwake
  rationale: Inahifadhi wazi furaha ya ndani iliyoelezwa na neno “moyo” katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la agano; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya הַלֵּוִי kwa Haruni kabla ya kuwekwa kwa ukuhani
  choice: Mlawi
  alternative: kuifafanua kama cheo cha huduma ya kidini
  rationale: Tafsiri inadumisha utambulisho wa kikabila bila kuingiza mapema dhana ya cheo cha kikuhani.
- issue: Nguvu ya דַבֵּר יְדַבֵּר
  choice: anaweza kusema vizuri
  alternative: hakika atasema; husema kwa ufasaha
  rationale: Muktadha unalinganisha uwezo wa Haruni na kusita kwa Musa, lakini muundo unaweza pia kueleweka kama msisitizo wa kusema; tanbihi inaacha utofauti huo wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kukulaki” ni neno la kawaida la kibiblia na la Kiswahili sanifu kwa kwenda kumpokea mtu; sentensi imepangwa upya kidogo ili mtiririko uwe wa asili bila kupoteza msisitizo wa chanzo.
