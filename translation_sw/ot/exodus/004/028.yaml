  yaml_path: translation/ot/exodus/004/028.yaml
  text: Moses told Aaron all the words of Yahweh who had sent him[a], and all the signs that he had commanded him.
translation:
  language: sw
  text: Musa akamweleza Haruni maneno yote ya Yahweh aliyemtuma[a], na ishara zote alizomwamuru azifanye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno yote ya Yahweh ambayo alimtuma nayo.” Kishazi cha Kiebrania kinaweza kuhusishwa kwa karibu na “maneno,” ingawa maana hubaki kwamba Yahweh ndiye aliyemtuma Musa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: akamweleza
  rationale: Hifili ya נגד hapa ina maana ya kumjulisha au kumweleza mtu jambo; “akamweleza” ni Kiswahili cha kawaida kinachofaa mazungumzo haya.
- source_word: דִּבְרֵי יְהוָה
  choice: maneno yote ya Yahweh
  rationale: Neno דָּבָר linaweza kumaanisha neno, jambo, au ujumbe. “Maneno yote” linadumisha wingi wa Kiebrania na wazo la maagizo yaliyosemwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: yaliyohusu kumtuma
  rationale: Kishazi rejeshi cha Kiebrania kinaweza kuhusishwa kwa karibu na “maneno,” yaani maneno ambayo kwayo Yahweh alimtuma Musa. Tafsiri hii inadumisha uwezekano huo bila kupoteza maana kwamba Yahweh ndiye aliyemtuma.
- source_word: הָאֹתֹת
  choice: ishara
  rationale: אוֹת humaanisha ishara, na katika muktadha huu ni ishara zenye nguvu za Mungu; “ishara” ni tafsiri ya moja kwa moja isiyoongeza ufafanuzi usiotajwa.
- source_word: אֲשֶׁר צִוָּהוּ
  choice: alizokuwa amemwamuru
  rationale: Kiebrania kinasema kwa ufupi kwamba aliamriwa kuhusu ishara hizo. Kiswahili hiki huhifadhi ufupi huo bila kuongeza wazi kitenzi “kufanya,” ambacho hakimo katika maandishi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi la agano YHWH; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Kiambishi cha kishazi אֲשֶׁר שְׁלָחוֹ
  choice: Kukihusisha kwa karibu na “maneno” katika matini kuu
  alternative: “Yahweh aliyekuwa amemtuma”
  rationale: Muundo wa Kiebrania unaruhusu kishazi kurejelea “maneno” au kueleweka kuwa Yahweh ndiye aliyemtuma Musa. Matini kuu na tanbihi zinahifadhi utata huo wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha masimulizi, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa karibu na Kiebrania huku utata wa kishazi rejeshi ukihifadhiwa kwa tanbihi.
