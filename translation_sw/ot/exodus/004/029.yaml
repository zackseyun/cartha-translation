  text: Kisha Musa na Haruni wakaenda, wakawakusanya wazee wote wa wana wa Israeli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli,” au kwa mapokeo, “watoto wa Israeli.”
