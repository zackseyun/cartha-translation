lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: wakaenda
  rationale: Kitenzi הלך katika mfululizo wa masimulizi kina maana ya kawaida ya ‘kwenda.’ Ingawa umbo la Kiebrania ni la umoja mbele ya wahusika wawili waliounganishwa, Kiswahili hutumia upatanisho wa wingi kwa njia ya kawaida.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: אַהֲרֹן
  choice: Haruni
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: וַיַּאַסְפוּ
  choice: wakawakusanya
  rationale: אסף hapa humaanisha kuwakusanya watu pamoja. Kiambishi cha yambwa ‘-wa-’ kinaonyesha wazi kwamba waliokusanywa ni watu.
- source_word: אֵת
  choice: '[halijatafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa moja kwa moja kisicho na neno huru linalolingana nacho katika Kiswahili.
- source_word: כָּל
  choice: wote
  rationale: כָּל huonyesha ujumla; ‘wote’ linapatana kisarufi na ‘wazee.’
- source_word: זִקְנֵי
  choice: wazee
  rationale: Katika muktadha huu זקנים ni viongozi wa jamii waliotambuliwa; ‘wazee’ huhifadhi maana ya neno na nafasi yao ya kijamii.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii huhifadhi usemi wa Kiebrania unaoonyesha uhusiano wa kizazi na Israeli/Yakobo, badala ya kuufupisha kuwa jina la kabila pekee.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Usemi wa chanzo unaonyesha utambulisho wa agano unaotokana na ukoo wa Israeli/Yakobo. ‘Wana wa Israeli’ huhifadhi kwa ukaribu zaidi lugha hiyo ya undugu bila kuibadili kuwa jina la taifa pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi ‘wakaenda, wakawakusanya’ ni wa kawaida na unaosomeka vizuri; usemi ‘wana wa Israeli’ umehifadhiwa kwa sababu ya umbo la wazi la Kiebrania, huku mbadala wa kawaida zaidi ukitolewa katika tanbihi.
