  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
translation:
  language: sw
  text: Yeye atasema na watu kwa niaba yako, naye atakuwa kinywa chako[a], nawe utakuwa kama Mungu kwake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, atakuwa msemaji wako. Kiebrania hutumia neno “kinywa” kama sitiari ya msemaji.
    reason: lexical_alternative
  - marker: b
    text: Au, “utakuwa Mungu kwake.” Maana yake ni kwamba Musa atakuwa na jukumu la mamlaka na uwakilishi alilopewa na Mungu katika uhusiano wake na Haruni.
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִבֶּר הוּא לְךָ אֶל־הָעָם
  choice: Yeye atasema na watu kwa niaba yako
  rationale: 'Kitenzi דִבֶּר kinamaanisha ‘atasema,’ na לְךָ hapa huonyesha uwakilishi: Haruni atasema kwa niaba ya Musa. Katika Kiswahili, ‘kusema na watu’ ni usemi wa kawaida na wa wazi.'
- source_word: וְהָיָה הוּא יִהְיֶה לְּךָ לְפֶה
  choice: naye atakuwa kinywa chako
  rationale: Tafsiri hii inadumisha sitiari halisi ya פֶּה, ‘kinywa,’ huku ikieleza kwa Kiswahili cha kawaida kwamba Haruni atakuwa msemaji wa Musa. Marudio ya kitenzi cha Kiebrania hayahitaji kuigwa kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: וְאַתָּה תִּהְיֶה לּוֹ לֵאלֹהִים
  choice: nawe utakuwa kama Mungu kwake
  rationale: ‘Kama Mungu kwake’ huhifadhi uzito wa sitiari na kuonyesha jukumu la Musa la mamlaka na uwakilishi aliopewa na Mungu, bila kudokeza kwamba Musa ni Mungu kwa asili.
theological_decisions:
- issue: Iwapo לֵאלֹהִים isemwe kwa namna inayoweza kumaanisha Musa ni Mungu kihalisi
  choice: kama Mungu kwake
  alternative: Mungu kwake; Mungu kwa ajili yake
  rationale: 'Muktadha unaonyesha jukumu la kiutendaji na la uwakilishi: Musa atapokea maneno ya Mungu na kumpa Haruni. ‘Kama Mungu kwake’ hudumisha sitiari yenye nguvu bila kuondoa tofauti kati ya Mungu na Musa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Sitiari sambamba za ‘kinywa’ na ‘kama Mungu’ zimehifadhiwa, huku ‘kwa niaba yako’ ikifafanua wazi kazi ya Haruni.
