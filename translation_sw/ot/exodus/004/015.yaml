base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/015.yaml
  text: You shall speak to him and put the words in his mouth[a], and I will be with your mouth and with his mouth[b], and I will instruct you what you shall do.
translation:
  language: sw
  text: Utasema naye na utaweka maneno kinywani mwake; nami nitakuwa pamoja na kinywa chako na kinywa chake[a], na nitawafundisha mtakayofanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “nitakuwa pamoja na kinywa chako na pamoja na kinywa chake.”
    reason: lexical_alternative
  - marker: b
    text: “Ninyi” hapa ni wingi; inawahusu Musa na Aroni kwa pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: Utasema naye
  rationale: Muundo huu unatoa agizo lenye maana ya wakati ujao katika muktadha huu. ‘Kusema naye’ ni usemi wa kawaida na wenye heshima unaoakisi דִּבֶּר + אֶל bila kuongeza ujumbe ambao haukutajwa.
- source_word: וְשַׂמְתָּ אֶת־הַדְּבָרִים בְּפִיו
  choice: na utaweka maneno kinywani mwake
  rationale: ‘Kuweka’ huakisi maana ya kawaida ya שׂים, na ‘kinywani mwake’ huhifadhi taswira ya Kiebrania ya kumpa Aroni maneno ya kusema badala ya kuifafanua katika matini kuu.
- source_word: הַדְּבָרִים
  choice: maneno
  rationale: Kiswahili hakina kibainishi mahsusi kinacholingana moja kwa moja na הַ־. Muktadha hufanya ‘maneno’ yaeleweke kuwa yale yaliyotajwa, bila kuongeza kiashiria kama ‘haya’ au ‘hayo.’
- source_word: וְאָנֹכִי אֶהְיֶה עִם־פִּיךָ וְעִם־פִּיהוּ
  choice: nami nitakuwa pamoja na kinywa chako na kinywa chake
  rationale: Tafsiri hii huhifadhi taswira halisi ya ‘kuwa pamoja na kinywa’ na hivyo uwepo na uwezeshaji wa Mungu katika kusema, bila kuibadili moja kwa moja kuwa ‘nitawasaidia kusema.’
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: na nitawafundisha
  rationale: Hiphil ya ירה hapa ina maana ya kufundisha au kuelekeza. Kiambishi ‘-wa-’ kinaonyesha wazi kwamba Mungu anawahutubia Musa na Aroni kwa pamoja.
- source_word: אֵת אֲשֶׁר תַּעֲשׂוּן
  choice: mtakayofanya
  rationale: Kishazi hiki cha uhusiano huwasilisha kwa kawaida maana ya ‘kile mtakachofanya.’ Umbo la ‘mta-’ huhifadhi nafsi ya pili wingi ya Kiebrania.
theological_decisions:
- issue: Taswira ya kibinadamu kuhusu msaada wa Mungu katika kusema
  choice: Kuhifadhi ‘nitakuwa pamoja na kinywa chako na kinywa chake’ katika matini kuu.
  alternative: ‘Nitakusaidia kusema na nitamsaidia yeye kusema.’
  rationale: Kiebrania kinatumia taswira ya kiungo cha mwili kueleza uwepo wa Mungu na uwezeshaji wake wa moja kwa moja. Kuihifadhi huepuka kufifisha taswira au kufunga maana katika ufafanuzi mmoja.
- issue: Wingi wa viwakilishi na vitenzi vya mwisho
  choice: Kutumia ‘nitawafundisha mtakayofanya,’ ikiwahusu Musa na Aroni pamoja.
  alternative: Kutumia umoja kana kwamba maneno hayo yanamhusu Musa peke yake.
  rationale: אֶתְכֶם na תַּעֲשׂוּן ni maumbo ya wingi waziwazi; viambishi vya Kiswahili vinaweza kuonyesha wingi huo moja kwa moja na kwa ufasaha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi taswira ya Kiebrania huku viambishi vya wingi vikifanya marejeo kwa Musa na Aroni yawe wazi. Alama zote za tanbihi zimewekwa katika matini kuu mahali zinapohusika.
