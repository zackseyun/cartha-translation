base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/025.yaml
  text: Then Zipporah took a flint and cut off her son's foreskin and touched his feet with it[a], and she said, “Surely you are a bridegroom of blood to me.”
translation:
  language: sw
  text: Ndipo Sipora akachukua jiwe la gumegume, akakata govi la mwanawe, akaligusa miguuni pake[a], akasema, “Hakika wewe ni bwana arusi wa damu kwangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “miguuni pake.” Neno “miguu” huenda likawa lugha ya staha inayomaanisha sehemu za siri, na kiwakilishi “pake” huenda kikamhusu Musa au mwanawe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: jiwe la gumegume
  rationale: Neno hili humaanisha gumegume au jiwe lililotumiwa kukatia. ‘Jiwe la gumegume’ ni wazi na linafaa katika muktadha wa tohara.
- source_word: עָרְלַת בְּנָהּ
  choice: govi la mwanawe
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya kirai kinachomaanisha govi la mwana wake.
- source_word: וַתַּגַּע
  choice: akaligusa nalo
  rationale: Kitenzi נגע kimsingi humaanisha ‘kugusa.’ Kiwakilishi na ‘nalo’ vinaonyesha kwa kawaida kuwa alitumia govi hilo, bila kubainisha zaidi namna ya tendo.
- source_word: לְרַגְלָיו
  choice: miguuni pake
  rationale: Maana ya wazi ya רגל ni ‘mguu.’ Tafsiri hii huhifadhi pia utata wa kiwakilishi kuhusu mwenye miguu hiyo.
- source_word: כִּי
  choice: Hakika
  rationale: Katika tamko hili כִּי lina nguvu ya kusisitiza; ‘Hakika’ huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: חֲתַן דָּמִים
  choice: bwana-arusi wa damu
  rationale: Ni msemo usio wa kawaida na wenye utata. Tafsiri ya karibu ‘bwana-arusi wa damu’ huhifadhi taswira na mvutano wa Kiebrania bila kuufafanua kimadhehebu.
- source_word: לִי
  choice: kwangu
  rationale: Kiambishi hiki huonyesha uhusiano wa kibinafsi; ‘kwangu’ ni cha asili katika muundo huu wa Kiswahili.
theological_decisions:
- issue: Iwapo ‘miguuni pake’ ni tamathali inayomaanisha sehemu za siri, na iwapo kiwakilishi kinamhusu Musa au mwana wa Sipora
  choice: Kuhifadhi maneno ya wazi ‘miguuni pake’ bila kumtaja mwenye miguu hiyo
  alternative: sehemu zake za siri; miguu/sehemu za siri za Musa; miguu/sehemu za siri za mwanawe
  rationale: Kiebrania kina utata halisi katika sehemu hii. Matini kuu huhifadhi maana ya kawaida na kutobainisha mhusika, huku tanbihi ikieleza uwezekano mkubwa wa kiisimu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia viambishi vya mfululizo ‘aka-’. Msemo mgumu ‘bwana-arusi wa damu’ umehifadhiwa kwa makusudi badala ya kufafanuliwa.
