  text: וַ/יַּ֤עַן מֹשֶׁה֙ וַ/יֹּ֔אמֶר וְ/הֵן֙ לֹֽא יַאֲמִ֣ינוּ לִ֔/י וְ/לֹ֥א יִשְׁמְע֖וּ בְּ/קֹלִ֑/י כִּ֣י יֹֽאמְר֔וּ לֹֽא נִרְאָ֥ה אֵלֶ֖י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/001.yaml
  text: Then Moses answered and said[a], “But behold, they will not believe me, and they will not listen to my voice, for they will say[b], ‘Yahweh has not appeared to you.’”
translation:
  language: sw
  text: Kisha Musa akajibu, akasema, “Lakini tazama, hawataniamini wala hawataisikiliza sauti yangu,[a] kwa maana watasema, ‘Yahweh hakukutokea.’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kuisikiliza sauti yangu”; nahau hii pia inaweza kumaanisha “kunisikiliza,” “kunizingatia,” au “kunitii.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “Yahweh hajakutokea.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֹשֶׁה וַיֹּאמֶר
  choice: Kisha Musa akajibu, akasema
  rationale: Muundo huu unadumisha vitenzi vyote viwili vya simulizi—‘akajibu’ na ‘akasema’—kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: וְהֵן
  choice: Lakini tazama
  rationale: ‘Lakini’ huonyesha pingamizi la Musa katika muktadha, na ‘tazama’ hudumisha dhima ya chembe ya kuvuta fikira bila kuifanya kuwa dhana tu.
- source_word: לֹא יַאֲמִינוּ לִי
  choice: hawataniamini
  rationale: Kauli hii ni ya moja kwa moja na ya kawaida kwa maana ya kutokubali kuwa madai au ujumbe wa Musa ni wa kweli.
- source_word: וְלֹא יִשְׁמְעוּ בְּקֹלִי
  choice: wala hawataisikiliza sauti yangu
  rationale: Inahifadhi nahau ya Kiebrania ‘kusikiliza sauti yangu’ na pia muunganiko hasi wenye nguvu; hapa ‘kutii’ kungeamua maana kwa upana kuliko muktadha unavyolazimu.
- source_word: כִּי יֹאמְרוּ
  choice: kwa maana watasema
  rationale: כִּי linaanzisha sababu ya hofu ya Musa; ‘kwa maana’ linaonyesha uhusiano huo wazi.
- source_word: לֹא נִרְאָה אֵלֶיךָ
  choice: hakukutokea
  rationale: Nifali ya ראה hapa ina maana ya ‘kutokea/kujionyesha.’ Wakati timilifu wa Kiebrania unaweza kutafsiriwa kiasili kwa wakati uliopita katika usemi huu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa tetragramatoni linahifadhiwa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi YHWH moja kwa moja. ‘Yahweh’ hulihifadhi kama jina, huku ‘BWANA’ likiwa badala ya kimapokeo inayotumia cheo.
- issue: Maana ya שׁמע בקול
  choice: kuisikiliza sauti yangu
  alternative: kunitii
  rationale: Nahau inaweza kujumuisha kusikia, kuzingatia, au kutii. Muktadha unahusu kukubaliwa kwa ujumbe wa Musa, hivyo tafsiri ya karibu inaacha upeo huo wa maana bila kuubana kuwa utii pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa simulizi wa kibiblia umehifadhiwa bila kutumia maneno magumu yasiyo ya lazima; jina ‘Yahweh’ limetumiwa kwa uthabiti.
