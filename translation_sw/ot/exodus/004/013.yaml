lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini akasema
  rationale: 'Ingawa muundo huu kwa kawaida huendeleza simulizi kwa maana ya ‘naye akasema,’ hapa muktadha unaonyesha upinzani: Musa anaendelea kusita baada ya majibu ya Mungu.'
- source_word: בִּי
  choice: Tafadhali
  rationale: Katika nahau hii kabla ya kumwita mwenye mamlaka kwa heshima, neno hili ni ombi la unyenyekevu, si usemi halisi wa ‘ndani yangu.’
- source_word: אֲדֹנָי
  choice: Bwana wangu
  rationale: Ni namna ya kumwita Mungu kwa heshima na ina kiambishi cha nafsi ya kwanza umoja. Hapa si jina la Mungu יהוה.
- source_word: שְׁלַח נָא
  choice: tuma
  rationale: Amri שְׁלַח imelegezwa na chembe ya ombi נָא. Kwa kuwa ‘Tafadhali’ tayari imetumika mwanzoni mwa ombi kwa טבעיות ya Kiswahili, kurudia ‘tafadhali’ kungekuwa nzito bila kuongeza maana.
- source_word: בְּיַד
  choice: kwa mkono wa
  rationale: Huhifadhi nahau ya Kiebrania inayoonyesha wakala au njia, na bado inaeleweka katika Kiswahili cha kibiblia cha kawaida.
- source_word: תִּשְׁלָח
  choice: utakayemtuma
  rationale: Huhifadhi urudiaji wa mzizi ‘tuma’ na kutokuwekwa wazi kwa mtu anayekusudiwa, badala ya kuingiza moja kwa moja wazo la ‘mtu mwingine.’
theological_decisions:
- issue: Maana ya ombi la Musa linalokwepa wito
  choice: 'Kudumisha utata wa Kiebrania: ‘tuma kwa mkono wa yeyote utakayemtuma.’'
  alternative: ‘Tafadhali, mtume mtu mwingine.’
  rationale: Muktadha unaonyesha wazi kusita kwa Musa, lakini Kiebrania hakisemi moja kwa moja ‘mtu mwingine.’ Tafsiri kuu inadumisha mvutano huo, huku maana ya kifafanuzi ikiwekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi ‘kwa mkono wa’ umehifadhiwa ili kuonyesha nahau ya Kiebrania na utata wake; tanbihi inatoa maana inayowezekana kutokana na muktadha.
