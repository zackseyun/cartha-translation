  text: Yahwe akamwambia, “Ni nini hicho kilicho mkononi mwako?” Naye akasema, “Fimbo[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “gongo” au “kijiti.” Neno la Kiebrania מַטֶּה linaweza kumaanisha fimbo, gongo, au kijiti kulingana na muktadha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo linalolingana na tahajia na matamshi ya Kiswahili, badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: akamwambia ... akasema
  rationale: Kitenzi אמר kimerudiwa kama katika Kiebrania. Katika sehemu ya kwanza, kiambishi cha mtendewa katika אֵלָיו kimejumuishwa kwa kawaida katika “akamwambia”; sehemu ya pili imetafsiriwa “akasema.”
- source_word: אֵלָיו
  choice: akamwambia
  rationale: Maana ya “kwake” imewasilishwa kwa kiambishi cha mtendewa -mw- katika muundo wa kawaida wa Kiswahili.
- source_word: מַה־זֶּה / מִזֶּה
  choice: Ni nini hiyo
  rationale: Muundo huu unadumisha swali la kutambua kitu pamoja na nguvu ya kiashiria cha Kiebrania, huku ukisomeka kwa kawaida katika mazungumzo ya Kiswahili.
- source_word: בְּיָדֶךָ
  choice: iliyo mkononi mwako
  rationale: Hii inaonyesha wazi kwamba kitu hicho kiko katika mkono wa Musa, kulingana na maana halisi ya kirai cha Kiebrania.
- source_word: מַטֶּה
  choice: Fimbo
  rationale: “Fimbo” ni neno la kawaida na pana la Kiswahili kwa kitu kinachobebwa mkononi kama staff, rod, au stick; linafaa katika muktadha wa fimbo ya Musa bila kuongeza maelezo yasiyokuwapo katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: “Yahwe” linahifadhi jina binafsi la Mungu katika umbo linalokubaliana na matumizi ya Kiswahili, bila kulibadilisha kuwa cheo wala kuingiza msimamo wa dhehebu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa masimulizi “akamwambia ... akasema” unahifadhi urudiaji wa Kiebrania bila kuwa wa kizamani.
