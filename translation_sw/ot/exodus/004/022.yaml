  text: 'Then you shall say to Pharaoh[a], ‘Thus says Yahweh: Israel is my firstborn son.’'
translation:
  language: sw
  text: 'Kisha utamwambia Farao, “Yahweh asema hivi: Israeli ni mwanangu, mzaliwa wangu wa kwanza.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kuunganisha maneno hayo kwa karibu zaidi: “Israeli ni mwana wangu mzaliwa wa kwanza.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָמַרְתָּ
  choice: Kisha utamwambia
  rationale: Kitenzi cha nafsi ya pili ya kiume umoja pamoja na waw kina nguvu ya agizo linalofuata katika muktadha; “Kisha” linaonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: אֶל פַּרְעֹה
  choice: Farao
  rationale: Kiambishi cha yambwa katika “utamwambia” kinawakilisha kihusishi אֶל kwa njia ya kawaida ya Kiswahili, huku jina la cheo Farao likihifadhiwa.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Huu ni mtindo rasmi wa mjumbe unaotambulisha maneno ya Mungu; “asema hivi” ni wa asili na wenye uzito katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Neno hili lina maana ya “mwana wangu”; umbo la Kiswahili “mwanangu” linahifadhi sitiari ya uhusiano wa baba na mwana.
- source_word: בְכֹרִי
  choice: mzaliwa wangu wa kwanza
  rationale: Kauli hii inaeleza hadhi ya mzaliwa wa kwanza bila kuamua kimyakimya ikiwa mkazo ni wakati, haki, au heshima.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina limetolewa kwa tahajia iliyozoeleka katika Kiswahili na hapa linatambulishwa kuwa mwana na mzaliwa wa kwanza wa Yahweh.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Sitiari ya Israeli kuwa mwana
  choice: Israeli ni mwanangu, mzaliwa wangu wa kwanza
  alternative: Israeli ni mwana wangu mzaliwa wa kwanza
  rationale: Muundo uliochaguliwa unafuata kwa karibu mpangilio wa Kiebrania בְּנִי בְכֹרִי na kuhifadhi uwezekano wa msisitizo wa vipashio viwili vinavyowekwa sambamba, bila kuondoa maana ya “mwana mzaliwa wa kwanza.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa agizo na kauli rasmi ya mjumbe umehifadhiwa; mpangilio wa kishazi cha mwisho unafuata Kiebrania kwa karibu, huku tanbihi ikitoa usomaji laini zaidi.
