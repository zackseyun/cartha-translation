  text: And take this staff in your hand[b][a], with which you will perform the signs.
translation:
  language: sw
  text: Na chukua fimbo[a] hii mkononi mwako, ambayo utaitumia kufanya ishara[b] hizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza pia kumaanisha “gongo”; “fimbo” linafaa zaidi katika muktadha wa Musa kama mchungaji.
    reason: lexical_alternative
  - marker: b
    text: Au, “ishara za miujiza.” Kiebrania kinasema tu “ishara,” na muktadha unaonyesha kwamba ni ishara za ajabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Nawe
  rationale: Kiunganishi וְ kinaunganisha agizo hili na maagizo yaliyotangulia; “Nawe” ni ya kawaida katika Kiswahili na hudumisha mwendelezo huo. Alama ya yambwa אֶת haitafsiriwi moja kwa moja.
- source_word: הַמַּטֶּה הַזֶּה
  choice: fimbo hii
  rationale: מַטֶּה inaweza kumaanisha fimbo au gongo. “Fimbo” inafaa katika muktadha wa Musa kama mchungaji na ni neno la kawaida, huku הַזֶּה ikitambulisha fimbo ileile iliyotajwa tayari.
- source_word: תִּקַּח
  choice: chukua
  rationale: Kitenzi hiki cha Qal imperfect, nafsi ya pili umoja wa kiume, kina nguvu ya agizo katika muktadha huu; “chukua” huonyesha agizo hilo kwa Kiswahili cha kawaida.
- source_word: בְּיָדֶךָ
  choice: mkononi mwako
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha Kiebrania kinachoonyesha mahali fimbo itakaposhikwa.
- source_word: אֲשֶׁר ... בּוֹ
  choice: kwa fimbo hiyo
  rationale: Muundo huu unaonyesha kuwa fimbo ndiyo chombo kitakachotumiwa. Kurudia “fimbo hiyo” ni wazi na asilia zaidi katika Kiswahili kuliko muundo mzito wa “ambayo kwa hiyo.”
- source_word: תַּעֲשֶׂה
  choice: utafanya
  rationale: עָשָׂה kimsingi ni “kufanya.” “Utafanya” hudumisha maana pana ya chanzo bila kuongeza wazo lisilotajwa wazi.
- source_word: הָאֹתֹת
  choice: ishara
  rationale: אוֹת ni “ishara,” mara nyingi ishara yenye kuthibitisha ujumbe. “Ishara” huhifadhi usemi wa Kiebrania bila kuongeza kivumishi “za miujiza,” ingawa muktadha unaonyesha hali yake ya ajabu.
theological_decisions:
- issue: Asili ya ishara
  choice: ishara
  alternative: ishara za miujiza
  rationale: Kiebrania kinasema tu “ishara.” Tafsiri kuu haiongezi “za miujiza,” hivyo inaacha muktadha ueleze asili ya ishara hizo.
- issue: Jukumu la fimbo katika ishara
  choice: kwa fimbo hiyo utafanya ishara
  alternative: kwa uwezo wa fimbo hiyo utafanya ishara
  rationale: Kihusishi בּוֹ kinaonyesha matumizi ya fimbo kama chombo, lakini hakisemi kwamba fimbo yenyewe ndiyo chanzo cha nguvu. Tafsiri huepuka kuipa fimbo nguvu ya kujitegemea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa urahisi. Kurudiwa kwa “fimbo hiyo” kunatoa uwazi wa uhusiano wa chombo bila kupotosha maana ya Kiebrania.
