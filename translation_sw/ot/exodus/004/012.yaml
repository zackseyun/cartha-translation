lexical_decisions:
- source_word: וְעַתָּה
  choice: Sasa
  rationale: Ni kiashirio cha wakati na hatua mpya katika mazungumzo; “Sasa” ni cha kawaida na kinahifadhi uzito wa agizo la mara moja.
- source_word: לֵךְ
  choice: nenda
  rationale: Ni amri ya moja kwa moja ya kitenzi הלך; “nenda” ni tafsiri sahihi, wazi, na isiyopanuliwa.
- source_word: וְאָנֹכִי אֶהְיֶה
  choice: nami nitakuwa
  rationale: “Nami” huonyesha uhusiano wa kishazi na pia mkazo wa kiwakilishi huru אָנֹכִי bila kufanya Kiswahili kuwa kizito.
- source_word: עִם פִּיךָ
  choice: pamoja na kinywa chako
  rationale: Inahifadhi taswira halisi ya Kiebrania na mkazo wake juu ya Mungu kuwa pamoja na Musa katika tendo lake la kusema.
- source_word: וְהוֹרֵיתִיךָ
  choice: na nitakufundisha
  rationale: Hifili ya ירה hapa ina maana ya kufundisha au kuelekeza; “nitakufundisha” ni ya asili na inaendana na kishazi kinachofuata.
- source_word: אֲשֶׁר תְּדַבֵּר
  choice: utakayosema
  rationale: Kishazi hiki hutaja maudhui ambayo Mungu atamfundisha Musa. “Utakayosema” ni Kiswahili cha kawaida kinachohifadhi maana ya wakati ujao bila kuongeza kiwango kisicho wazi cha wajibu.
theological_decisions:
- issue: Kauli ya uwepo wa Mungu katika kumtuma Musa
  choice: nitakuwa pamoja na kinywa chako
  alternative: nitakuwa nawe unaposema
  rationale: Tafsiri hii inahifadhi lugha thabiti na ya kimwili ya andiko badala ya kuifafanua tu kuwa msaada wa kusema. Hivyo mkazo unabaki katika uwepo wa Mungu mwenyewe unaomwezesha Musa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Nusu koloni linatenganisha agizo na ahadi huku likihifadhi mtiririko wa sentensi moja; “kinywa chako” limehifadhiwa kwa sababu ni taswira muhimu ya Kiebrania.
