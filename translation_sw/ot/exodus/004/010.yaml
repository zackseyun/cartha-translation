base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/010.yaml
  text: Then Moses said to Yahweh[a], “Please, Lord, I am not a man of words, neither yesterday nor the day before, nor since you have spoken to your servant[b]; for I am heavy of mouth and heavy of tongue.”
translation:
  language: sw
  text: Ndipo Mose akamwambia Yahwe, “Tafadhali, Bwana, mimi si mtu wa maneno[a], wala jana, wala juzi, wala tangu uliposema na mtumishi wako; kwa kuwa mimi ni mzito wa kinywa na mzito wa ulimi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufasiri maana yake, “mimi si msemaji fasaha.” Kiebrania kinasema, “mimi si mtu wa maneno.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mzito wa kinywa na mzito wa ulimi,” sitiari ya ugumu wa kusema; huenda ikamaanisha ukosefu wa ufasaha au tatizo fulani la usemi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatumiwa jina binafsi la Mungu badala ya kulibadilisha kuwa cheo; tahajia “Yahwe” inafuata matumizi ya kawaida ya Kiswahili.
- source_word: בִּי אֲדֹנָי
  choice: Tafadhali, Bwana wangu
  rationale: בִּי ni ombi la heshima, na אֲדֹנָי hapa ni cheo ambacho Mose anatumia kumwambia Mungu moja kwa moja.
- source_word: לֹא אִישׁ דְּבָרִים אָנֹכִי
  choice: mimi si mtu wa maneno
  rationale: Kauli hii inadumisha sitiari ya Kiebrania badala ya kuifasiri moja kwa moja kuwa kutokuwa na ufasaha.
- source_word: גַּם מִתְּמוֹל גַּם מִשִּׁלְשֹׁם
  choice: sikuwa hivyo jana wala juzi
  rationale: Inahifadhi mpangilio wa wakati wa nahau ya Kiebrania kwa Kiswahili cha kawaida na kueleza wazi kuwa hali aliyotaja haikuwa mpya.
- source_word: גַּם מֵאָז דַּבֶּרְךָ אֶל עַבְדֶּךָ
  choice: wala hata tangu ulipoanza kusema na mtumishi wako
  rationale: “Tangu” linaonyesha kipindi kinachoanzia Mungu alipoanza kuzungumza na Mose hadi wakati wa jibu lake.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Katika hotuba hii ni namna ya unyenyekevu ya kujitaja mbele za Mungu, si msisitizo wa hadhi ya utumwa.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Kiunganishi hiki kinatanguliza sababu ambayo Mose anatoa kuhusu kutofaa kwake kusema.
- source_word: כְבַד פֶּה וּכְבַד לָשׁוֹן
  choice: mzito wa kinywa na mzito wa ulimi
  rationale: Tafsiri hii inahifadhi sitiari na ulinganifu wa Kiebrania bila kuamua kama Mose alimaanisha ukosefu wa ufasaha, ugumu wa kusema, au tatizo fulani la usemi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la Mungu lenye herufi nne; kulitaja kama jina binafsi kunadumisha tofauti kati ya יהוה na cheo אֲדֹנָי kinachofuata.
- issue: Kama tatizo la usemi la Mose lifafanuliwe moja kwa moja
  choice: Kudumisha sitiari “mzito wa kinywa na mzito wa ulimi”
  alternative: si fasaha au nina kigugumizi
  rationale: Kiebrania hakibainishi aina hasa ya ugumu huo. Sitiari inaacha wazi ikiwa ni ukosefu wa ufasaha, kutojiamini, au tatizo la kimwili la usemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari za Kiebrania zimedumishwa, huku vistari virefu vikitenganisha maelezo ya muda ili sentensi ibaki wazi.
