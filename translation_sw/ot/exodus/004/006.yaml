base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/006.yaml
  text: Then Yahweh said to him again[a], “Please put your hand into your bosom.” So he put his hand into his bosom, and when he brought it out, behold, his hand was leprous, like snow.
translation:
  language: sw
  text: Kisha Yahwe akamwambia tena, “Tafadhali tia mkono wako kifuani mwa vazi lako.” Basi akautia mkono wake kifuani mwa vazi lake; alipouutoa, tazama, mkono wake ulikuwa na ugonjwa wa ngozi[a], mweupe kama theluji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: tsara''at. Hii ni hali ya ngozi inayotajwa katika Agano la Kale, ambayo huenda isilingane kabisa na ukoma wa kisasa (ugonjwa wa Hansen).'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la agano lililo katika maandishi ya Kiebrania kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: עוֹד
  choice: tena
  rationale: Katika mfululizo huu wa maagizo, neno hili linaonyesha tendo jingine linaloongezwa au kurudiwa.
- source_word: הָבֵא נָא
  choice: Tafadhali ingiza
  rationale: ‘Ingiza’ linaeleza kwa kawaida kitendo cha kupeleka mkono ndani ya vazi, huku ‘tafadhali’ likihifadhi nguvu ya נָא inayolainisha agizo.
- source_word: חֵיק
  choice: ndani ya vazi ... kifuani
  rationale: Neno hilo linamaanisha sehemu ya vazi iliyo kifuani au mkunjo wake ambamo kitu kingeweza kutiwa; tafsiri hii ni wazi kwa msomaji wa sasa.
- source_word: וַיּוֹצִאָהּ
  choice: alipoutoa
  rationale: Kiambishi cha Kiebrania kinarejelea mkono; kishazi cha wakati kinafuata mtiririko wa kawaida wa Kiswahili bila kubadili tukio.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Linahifadhi msisitizo wa ghafla na wa kushangaza unaoelekeza fikira kwenye ishara.
- source_word: מְצֹרַעַת
  choice: ulikuwa umeathiriwa na ugonjwa wa ngozi
  rationale: Huepuka kulinganisha moja kwa moja hali ya kibiblia ya צָרַעַת na ukoma wa kisasa, huku ikibaki wazi kuwa mkono uliathiriwa na hali ya ngozi.
- source_word: כַּשָּׁלֶג
  choice: kama theluji
  rationale: Huhifadhi ulinganisho mfupi wa Kiebrania bila kuongeza wazi maneno ‘mweupe kama,’ ambayo hayapo katika maandishi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu la herufi nne; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Utambulisho wa מְצֹרַעַת
  choice: ugonjwa wa ngozi, pamoja na tanbihi
  alternative: ukoma
  rationale: Neno la kibiblia linaweza kuhusisha hali mbalimbali na halipaswi kutambuliwa bila tahadhari kuwa ugonjwa wa Hansen; tafsiri pana inalinda tofauti hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Usemi ‘ndani ya vazi ... kifuani’ unafafanua חֵיק kwa kawaida bila kutumia neno la kizamani; ‘tazama’ linatunza uzito wa kisimulizi.
