base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/023.yaml
  text: And I said to you, ‘Send out my son so that he may serve me,’ but you refused to send him out. Look, I am about to kill your son, your firstborn.
translation:
  language: sw
  text: Nami nilikuambia, ‘Mwachilie mwanangu aende ili anitumikie,’ lakini ukakataa kumwachilia aende. Tazama, niko karibu kumuua mwanao, mzaliwa wako wa kwanza.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלַּח
  choice: mwachilie ... aende
  rationale: Katika muktadha wa Farao kumzuia Israeli, kauli hii ya Kiswahili huonyesha kwa kawaida na kwa usahihi amri ya kumruhusu aondoke, bila kuifanya kuwa kufukuza.
- source_word: וְיַעַבְדֵנִי
  choice: ili anitumikie
  rationale: Huhifadhi kusudi la tendo na maana pana ya עבד, inayoweza kujumuisha huduma na ibada kwa Mungu.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huhifadhi kiashirio cha msisitizo na kuvuta fikira kilicho katika Kiebrania, kwa sajili yenye hadhi ya kibiblia.
- source_word: הֹרֵג
  choice: nitamuua
  rationale: Kirai cha Kiebrania cha kisababishi chenye participle baada ya אָנֹכִי kinaonyesha hatua iliyo karibu au iliyokusudiwa; wakati ujao wa Kiswahili ni wa kawaida na wa moja kwa moja hapa.
- source_word: בְּכֹרֶךָ
  choice: mzaliwa wako wa kwanza
  rationale: Hutoa maana ya בכור kwa lugha iliyo wazi na ya kawaida, huku ikihifadhi uhusiano wa mwana wa kwanza.
theological_decisions:
- issue: Utambulisho wa ‘mwanangu’
  choice: Kudumisha umoja ‘mwanangu’ bila ufafanuzi wa ziada
  alternative: Kutafsiri wazi kuwa ‘Israeli, mwanangu’
  rationale: Mstari huu wenyewe unasema ‘mwanangu’; rejeo la Israeli limo katika muktadha uliotangulia. Kuongeza jina hapa kungeondoa mshikamano na mkazo wa ulinganifu kati ya mwana wa Mungu na mwana wa Farao.
- issue: Kauli ya Mungu kuhusu kifo cha mzaliwa wa kwanza
  choice: Kauli ya moja kwa moja ‘nitamuua’
  alternative: ‘Niko karibu kumuua’
  rationale: Kiebrania kinaonyesha tishio lililo karibu kwa muundo wa participle, lakini hakina kisaidizi cha wazi kinacholazimisha ‘niko karibu’. Kiswahili cha wakati ujao huhifadhi uhakika wa onyo bila kuongeza maelezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mwachilie ... aende’ ni wazi na cha kawaida katika muktadha wa kuachiliwa kwa waliokuwa wamezuiliwa; marudio yake yanahifadhi muundo wa Kiebrania. Hakuna tanbihi iliyohitajika.
