lexical_decisions:
- source_word: וַיִּרֶף מִמֶּנּוּ
  choice: Basi BWANA akamwacha
  rationale: Kitenzi רפה pamoja na מן hapa kinaonyesha kusitisha tendo la kumdhuru. Kutaja BWANA kunafafanua kiima kinachotokana na mstari wa 24, huku kiwakilishi cha yule aliyeachwa kikibaki bila kutajwa wazi, kama katika Kiebrania.
- source_word: אָז אָמְרָה
  choice: Ndipo Sipora akasema
  rationale: אָז huendeleza mfuatano wa simulizi, na kiima cha kike kinarejelea Sipora katika muktadha wa karibu. Kutaja jina lake hufanya Kiswahili kiwe wazi na cha kawaida.
- source_word: חֲתַן דָּמִים
  choice: bwana-arusi wa damu
  rationale: Hii ni nahau fupi na ngumu. Tafsiri ya karibu na muundo wa Kiebrania inahifadhi utata wake wa kimakusudi badala ya kuamua ikiwa ni kauli ya kuchukizwa, jina la kiibada, au maana nyingine.
- source_word: לִי
  choice: kwangu
  rationale: Ingawa haikuonekana katika maandishi ya WLC yaliyowasilishwa hapa, neno hili ni sehemu ya usomaji wa kawaida wa aya katika WLC/MT na linahifadhi uhusiano unaoelezwa na Sipora bila kuufafanua kupita kiasi.
- source_word: לַמּוּלֹת
  choice: kwa sababu ya tohara
  rationale: Katika muktadha, usemi huu unaunganisha kauli ya Sipora na tendo la tohara lililotangulia. Kiswahili cha umoja ni cha kawaida zaidi, huku umbo adimu la wingi la Kiebrania likielezwa katika tanbihi.
theological_decisions:
- issue: Mrejelewa wa “akamwacha”
  choice: Kiima kimetajwa kuwa BWANA; yule aliyeachwa hajaainishwa kwa jina.
  alternative: Kutafsiri “akamwacha Musa” au kuacha pia kiima kama kiwakilishi.
  rationale: Mstari wa 24 unamtaja BWANA kuwa mtendaji, lakini kiambishi cha Kiebrania hapa hakimtaji yule aliyeachwa kwa jina. Tafsiri hii inatoa kiima kinachohitajika kwa Kiswahili huku ikihifadhi kiwango fulani cha utata wa mrejelewa.
- issue: Maana ya “bwana-arusi wa damu”
  choice: Nahau imetafsiriwa kwa ukaribu bila kufasiri nguvu yake halisi ya kitamaduni au kihisia.
  alternative: Kauli ya kuchukizwa, jina la kiibada linalohusiana na tohara, au kauli inayoelekezwa kwa Musa ama mtoto.
  rationale: Kiebrania kina utata halisi. Kuiacha nahau ikiwa wazi huepuka kuingiza ufafanuzi wa kimadhehebu au hitimisho lisilotolewa na maandishi.
- issue: Sababu inayotolewa na לַמּוּלֹת
  choice: kwa sababu ya tohara
  alternative: kuhusiana na tohara; kwa sababu ya tohara mbalimbali/ibada za tohara
  rationale: Muktadha unaonyesha uhusiano wa kisababishi au ufafanuzi na tendo lililofanywa, lakini wingi wa Kiebrania unaweza pia kuelekeza kwenye taratibu za tohara; jambo hilo limehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi ya maandiko. “Bwana-arusi wa damu” limehifadhiwa kama tamko gumu la Kiebrania. Alama zote za tanbihi zimewekwa katika maandishi.
