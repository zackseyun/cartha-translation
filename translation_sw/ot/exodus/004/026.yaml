  text: Basi BWANA akamwacha[a]. Ndipo Sipora akasema, “Bwana-arusi wa damu,” kwa sababu ya tohara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akamwacha,” yaani, aliacha kumshambulia. BWANA ndiye kiima kinachoeleweka kutokana na mstari wa 24; yule aliyeachwa huenda ni Musa.'
