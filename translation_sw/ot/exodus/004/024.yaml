base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
translation:
  language: sw
  text: Ikawa njiani, mahali pa kulala usiku[b], Yahweh akakutana naye[a] na akataka kumuua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hakimtaji wazi anayerejelewa hapa; huenda ni Musa au, kwa mujibu wa baadhi ya tafsiri, mwanawe.
    reason: alternative_reading
  - marker: b
    text: Au, “mahali pa kupiga kambi usiku”; neno la Kiebrania humaanisha mahali pa kulala, si lazima nyumba ya wageni ya kibiashara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutanguliza tukio jipya katika simulizi kwa mtindo mfupi na wa asili wa Kiswahili, bila kutumia lugha ya kizamani.
- source_word: בַדֶּרֶךְ
  choice: njiani
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi cha mahali.
- source_word: בַמָּלוֹן
  choice: mahali pa kulala usiku
  rationale: מָלוֹן ni mahali pa kukaa au kulala usiku; tafsiri hii haidokezi bila msingi kwamba palikuwa nyumba ya wageni ya kibiashara.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: akakutana naye
  rationale: Huhifadhi maana ya msingi ya פגע na kiambishi cha nafsi ya kiume bila kuongeza wazo la kumkabili; kishazi kinachofuata ndicho kinachoonyesha tishio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: וַיְבַקֵּשׁ
  choice: akataka
  rationale: Katika muundo huu, בקש inaonyesha kutafuta au kutaka kutekeleza jambo. ‘Akataka’ ni ya asili katika Kiswahili na haiongezi dai la wazi kwamba jaribio lilifanyika.
- source_word: הֲמִיתוֹ
  choice: kumuua
  rationale: Hii ni kausativi ya מות yenye kiambishi cha nafsi ya tatu umoja; ‘kumuua’ huwasilisha maana yake kwa uwazi na kwa lugha ya kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina lenyewe la Mungu; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Mhusika anayerejelewa na viambishi vya ‘-hu/-o’
  choice: Kuhifadhi utata kwa kusema ‘naye’ na ‘kumuua’
  alternative: Kumtaja Musa au mwanawe moja kwa moja
  rationale: Kiebrania hakimtaji wazi mhusika huyo katika mstari huu. Kiswahili kinaweza kuhifadhi utata huo bila kuamua kimafundisho kwamba ni Musa au mwanawe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kisimulizi na unaeleweka kwa wasomaji wa kawaida. Alama [b] imewekwa kwenye kirai cha mahali pa kulala, na [a] kwenye kiwakilishi kisichomtaja mhusika wazi, ili kila tanbihi iunganishwe na sehemu inayohusika moja kwa moja.
