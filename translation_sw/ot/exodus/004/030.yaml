base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/030.yaml
  text: Aaron spoke all the words that Yahweh had spoken to Moses[a], and he performed the signs before the eyes of the people.
translation:
  language: sw
  text: Aroni akasema maneno yote ambayo Yahwe alikuwa amemwambia Musa, kisha akafanya ishara hizo mbele ya macho ya watu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele ya watu.”
    reason: Mbadala wa nahau לְעֵינֵי הָעָם; kwa neno kwa neno, “mbele ya macho ya watu.”
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Katika muktadha wa kusimulia ujumbe, kitenzi hiki cha Kiebrania kina maana ya kusema au kunena; “akasema” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: maneno yote
  rationale: Uamuzi huu unahifadhi usemi halisi wa Kiebrania badala ya kuufupisha kuwa “kila kitu.”
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: ambayo Yahwe alikuwa amemwambia Musa
  rationale: Muundo wa wakati uliopita “alikuwa amemwambia” unaonyesha kwa kawaida kwamba Yahwe alikuwa amekwisha kusema na Musa kabla Aroni hajawasilisha ujumbe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kama jina, bila kulibadilisha kuwa cheo kama “BWANA.” Umbo “Yahwe” linafuata tahajia inayotumika kwa kawaida katika Kiswahili.
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi עשה ni kipana, lakini pamoja na “ishara” hapa kinamaanisha kuzifanya au kuzitekeleza; “akafanya” hakiongezi maelezo yasiyotajwa katika chanzo.
- source_word: הָאֹתֹת
  choice: ishara hizo
  rationale: “Ishara” huhifadhi maana ya אותות bila kuongeza moja kwa moja kivumishi “za kimiujiza”; “hizo” hurejelea ishara zilizotajwa katika muktadha uliotangulia.
- source_word: לְעֵינֵי הָעָם
  choice: mbele ya macho ya watu
  rationale: Tafsiri hii inahifadhi taswira ya nahau ya Kiebrania huku ikieleweka katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova au BWANA
  rationale: Chanzo kinatumia Tetragramatoni kama jina binafsi. “Yahwe” hulihifadhi kama jina bila kulibadilisha kuwa cheo.
- issue: Mhusika anayefanya ishara
  choice: Aroni ndiye mhusika wa kitenzi “akafanya” kwa mwendelezo wa kisarufi
  alternative: Musa ndiye aliyefanya ishara
  rationale: Kitenzi cha pili kina kiima cha nafsi ya tatu umoja bila jina jipya kutajwa; kwa mwendelezo wa kawaida wa sentensi, Aroni ndiye kiima kilicho karibu. Hata hivyo, muktadha mpana unawahusisha Musa na Aroni pamoja, hivyo tafsiri haiongezi jina katika kishazi cha pili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na hadhi inayofaa maandiko. “Kisha” huunganisha matendo mawili kwa kawaida bila kuondoa mfuatano wa simulizi. Alama ya tanbihi imewekwa baada ya kirai inachokifafanua.
