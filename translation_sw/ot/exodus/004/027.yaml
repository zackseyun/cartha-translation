base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/027.yaml
  text: And Yahweh said to Aaron[a], “Go into the wilderness to meet Moses.” So he went and met him at the mountain of God and kissed him.
translation:
  language: sw
  text: Yahwe akamwambia Haruni, “Nenda jangwani[a] ukakutane na Musa.” Basi akaenda, akakutana naye kwenye mlima wa Mungu, akambusu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nenda ukakutane na Musa jangwani.” Umbo la Kiebrania linaweza kueleweka kuwa linasisitiza kwenda kuelekea jangwani kama mahali pa kukutana.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kwa cheo kama “BWANA.”
- source_word: לֵךְ
  choice: Nenda
  rationale: Hii ni amri ya kawaida na ya moja kwa moja inayolingana na kitenzi cha Kiebrania.
- source_word: לִקְרַאת מֹשֶׁה
  choice: ukakutane na Musa
  rationale: Muundo wa Kiswahili wenye “uka-” unaonyesha kusudi la kwenda—kwenda ili kukutana na Musa—kwa lugha ya kawaida.
- source_word: הַמִּדְבָּרָה
  choice: jangwani
  rationale: “Jangwani” ni tafsiri ya kawaida na inayoeleweka ya eneo lisilokaliwa; katika muktadha huu pia huonyesha mahali anakoelekea Haruni.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: akakutana naye
  rationale: Hutoa maana ya kukutana na mtu bila kuongeza wazo lisilokuwamo katika chanzo.
- source_word: בְּהַר הָאֱלֹהִים
  choice: kwenye mlima wa Mungu
  rationale: Inahifadhi muundo wa Kiebrania na kutaja mahali pa kukutana kwa Kiswahili cha kawaida.
- source_word: וַיִּשַּׁק לוֹ
  choice: akambusu
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya tendo la kumbusu Musa, bila kuongeza maelezo kuhusu aina ya busu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: “Yahwe” huhifadhi jina binafsi lililo katika maandishi ya Kiebrania badala ya kuliwakilisha kwa cheo; haitoi tafsiri ya ziada ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa simulizi umetumia viambishi vya mfululizo “aka-”; “Basi” huunganisha amri na utekelezaji wake kwa urahisi.
