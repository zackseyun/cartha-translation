language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לֹ֣א יַאֲמִ֡ינוּ גַּם֩ לִ/שְׁנֵ֨י הָ/אֹת֜וֹת הָ/אֵ֗לֶּה וְ/לֹ֤א יִשְׁמְעוּ/ן֙ לְ/קֹלֶ֔/ךָ וְ/לָקַחְתָּ֙ מִ/מֵּימֵ֣י הַ/יְאֹ֔ר וְ/שָׁפַכְתָּ֖ הַ/יַּבָּשָׁ֑ה וְ/הָי֤וּ הַ/מַּ֨יִם֙ אֲשֶׁ֣ר תִּקַּ֣ח מִן הַ/יְאֹ֔ר וְ/הָי֥וּ לְ/דָ֖ם בַּ/יַּבָּֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/009.yaml
  text: And if they do not believe even these two signs and do not listen to your voice[a], then you shall take some of the water of the Nile and pour it on the dry ground[b], and the water that you take from the Nile will become blood on the dry ground.
translation:
  language: sw
  text: Na ikiwa hawataamini hata ishara hizi mbili wala hawatakusikiliza[a], utachota maji kutoka Mto Nile na kuyamimina juu ya ardhi kavu. Maji utakayochota kutoka Mto Nile yatageuka kuwa damu[b] juu ya ardhi kavu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “hawataisikiliza sauti yako”; nahau hii pia inaweza kumaanisha “hawatakutii.”
    reason: lexical_alternative
  - marker: b
    text: Au “yatakuwa damu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Na ikiwa
  rationale: Muundo huu unaanzisha hali ya masharti; “Na ikiwa” ni wa kawaida katika Kiswahili na unadumisha mwendelezo wa simulizi.
- source_word: יַאֲמִינוּ
  choice: hawataamini
  rationale: Katika muktadha huu kitenzi kinahusu kukubali ushahidi unaotolewa na ishara; “kuamini” ndilo neno la moja kwa moja na la kawaida.
- source_word: גַּם לִשְׁנֵי הָאֹתוֹת הָאֵלֶּה
  choice: hata ishara hizi mbili
  rationale: “Hata” linaonyesha uzito unaoongezeka wa גַּם, na maneno haya yanarejelea ishara mbili zilizotolewa kabla.
- source_word: יִשְׁמְעוּן לְקֹלֶךָ
  choice: hawatakusikiliza
  rationale: Nahau ya Kiebrania ina maana ya kumsikiliza au kumtii msemaji. Kiswahili hiki ni cha asili huku tanbihi ikihifadhi taswira halisi ya “sauti yako.”
- source_word: מִמֵּימֵי הַיְאֹר
  choice: utachota maji kutoka Mto Nile
  rationale: מִן inaonyesha kuchukua kiasi kutoka katika maji ya mto. “Mto Nile” humtambulisha wazi יְאֹר katika muktadha wa Kutoka.
- source_word: וְשָׁפַכְתָּ
  choice: kuyamimina
  rationale: “Kumimina” linaeleza kwa usahihi tendo la שפך, na kiambishi cha yambwa kinarejelea maji yaliyotajwa.
- source_word: הַיַּבָּשָׁה / בַּיַּבָּשֶׁת
  choice: ardhi kavu
  rationale: Neno hili linatofautisha nchi au ardhi isiyo na maji na maji ya mto; kurudia maneno yale yale kunahifadhi urudiaji wa Kiebrania.
- source_word: וְהָיוּ ... לְדָם
  choice: yatageuka kuwa damu
  rationale: Muundo היה + לְ unaonyesha badiliko au tokeo. “Yatageuka kuwa damu” ni Kiswahili cha asili kinachoeleza badiliko hilo wazi.
- source_word: דָם
  choice: damu
  rationale: Nomino hiyo inamaanisha damu moja kwa moja, bila kiashiria cha kwamba ni rangi au mwonekano tu.
theological_decisions:
- issue: Asili ya ishara ya maji ya Nile kuwa damu
  choice: yatageuka kuwa damu
  alternative: yataonekana kama damu / yatakuwa mekundu kama damu
  rationale: Kiebrania kinasema moja kwa moja kwamba maji yatakuwa damu, bila kuyapunguza maneno hayo kuwa mabadiliko ya rangi au mwonekano pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili kwa urahisi wa kusoma, huku urudiaji wa “ardhi kavu” na madai ya moja kwa moja kuhusu damu yakihifadhiwa.
