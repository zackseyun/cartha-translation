id: EXO.4.5
reference: Exodus 4:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְמַ֣עַן יַאֲמִ֔ינוּ כִּֽי נִרְאָ֥ה אֵלֶ֛י/ךָ יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֥י יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/005.yaml
  text: so that they may believe that Yahweh[a], the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob[b], has appeared to you.
translation:
  language: sw
  text: ili waamini kwamba Yahwe[a], Mungu wa baba zao, Mungu wa Abrahamu, Mungu wa Isaka, na Mungu wa Yakobo[b], amekutokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa mapokeo hutafsiriwa “BWANA.” Njia nyingine ni “Yehova.”'
    reason: alternative_reading
  - marker: b
    text: Au, “Mungu wa mababu zao.” Kiebrania kwa maana ya moja kwa moja zaidi husema “baba zao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ili
  rationale: Huanzisha kusudi la ishara; “ili” ni ya kawaida na huhifadhi nguvu ya kusudi.
- source_word: יַאֲמִינוּ
  choice: waamini
  rationale: Katika muktadha huu kitenzi kinaonyesha kukubali kuwa ujumbe na dai la Musa ni kweli.
- source_word: כִּי
  choice: kwamba
  rationale: Hutambulisha maudhui ya jambo watakaloliamini, si sababu.
- source_word: נִרְאָה אֵלֶיךָ
  choice: amekutokea
  rationale: Nifali ya ראה hapa humaanisha kujionyesha au kutokea; muundo huu ni wa asili katika Kiswahili na unaonyesha kuwa Mungu alimtokea Musa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni unukuzi wa kawaida wa Kiswahili wa jina la Mungu YHWH, badala ya kulibadilisha kwa cheo.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: Mungu wa baba zao
  rationale: Huhifadhi usemi wa Kiebrania wenye nomino ya kiume na muktadha wa ukoo wa mababu wa agano.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: Mungu wa Abrahamu, Mungu wa Isaka, na Mungu wa Yakobo
  rationale: Kurudia “Mungu wa” huhifadhi msisitizo na mwendo wenye uzito wa matini ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia jina binafsi YHWH. “Yahwe” hulihifadhi kama jina badala ya kuweka cheo mahali pake.
- issue: Maana ya אֲבֹתָם yenye jinsia ya kiume
  choice: baba zao
  alternative: mababu zao
  rationale: “Baba zao” inafuata kwa karibu wingi wa kiume wa chanzo; tanbihi inaonyesha tafsiri pana inayowezekana ya mababu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha marudio ya kimakusudi ya “Mungu wa” na mpangilio wa majina ya mababu bila kuwa nzito kupita kiasi.
