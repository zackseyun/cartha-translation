base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/018.yaml
  text: Then Moses went and returned to Jethro his father-in-law and said to him[a], “Please let me go and return to my brothers who are in Egypt, so that I may see whether they are still alive.” And Jethro said to Moses[b], “Go in peace.”
translation:
  language: sw
  text: Kisha Musa akaenda, akarudi kwa Yethro[a], baba mkwe wake, akamwambia, “Tafadhali, niruhusu niende nirudi kwa ndugu zangu walio Misri, nikaone kama bado wako hai.” Yethro akamwambia Musa, “Nenda kwa amani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina umbo la jina “Yether” katika kutajwa kwa kwanza na “Yethro” katika kutajwa kwa pili; hapa “Yethro” limetumiwa kote kwa kuwa ni mtu yuleyule.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Kisha Musa akaenda
  rationale: Wayyiqtol inaendeleza simulizi; “Kisha” huonyesha mfuatano wa matukio kwa Kiswahili cha kawaida.
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi שׁוב humaanisha kurudi; hapa Musa anarudi kwa mkuu wa nyumba yake huko Midiani.
- source_word: יֶתֶר / יִתְרוֹ
  choice: Yethro
  rationale: Ingawa maandishi yana maumbo mawili ya jina, יֶתֶר na יִתְרוֹ, yanamhusu mtu yuleyule. Umbo linalofahamika zaidi, “Yethro,” limetumiwa katika aya nzima, huku tofauti hiyo ikielezwa katika tanbihi.
- source_word: חֹתְנוֹ
  choice: baba mkwe wake
  rationale: Muktadha unaonyesha wazi kuwa anayezungumziwa ni baba ya mke wa Musa; “baba mkwe” ni tafsiri sahihi na ya kawaida.
- source_word: אֵלֲכָה נָּא
  choice: Tafadhali, niruhusu niende
  rationale: Cohortative pamoja na נָא huonyesha ombi la heshima; Kiswahili hiki kinadumisha unyenyekevu wa Musa kwa baba mkwe wake.
- source_word: וְאָשׁוּבָה
  choice: nirudi
  rationale: Cohortative hii inaendeleza ombi la Musa na kudumisha maana ya msingi ya שׁוב, ‘kurudi.’
- source_word: אַחַי
  choice: ndugu zangu
  rationale: Neno la Kiebrania kwa maana halisi ni ‘ndugu zangu,’ lakini linaweza pia kutaja jamaa au watu wa ukoo kwa upana. “Ndugu zangu” huhifadhi maana na utata huo kwa kawaida katika Kiswahili.
- source_word: וְאֶרְאֶה
  choice: nikaone
  rationale: Muundo huu wa Kiswahili unaonyesha kusudi la Musa la kurudi bila kuwa mzito au wa maelezo kupita kiasi.
- source_word: הַעוֹדָם חַיִּים
  choice: kama bado wako hai
  rationale: Tafsiri hii huhifadhi swali lisilo la moja kwa moja na hali ya kutokuwa na uhakika kuhusu kama wangali hai.
- source_word: לֵךְ לְשָׁלוֹם
  choice: Nenda kwa amani
  rationale: Hii ni namna ya kawaida na yenye heshima ya kuwasilisha kauli ya Kiebrania ya baraka au kuaga kwa amani.
