  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה אֶת אִשְׁתּ֣/וֹ וְ/אֶת בָּנָ֗י/ו וַ/יַּרְכִּבֵ/ם֙ עַֽל הַ/חֲמֹ֔ר וַ/יָּ֖שָׁב אַ֣רְצָ/ה מִצְרָ֑יִם וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/020.yaml
  text: Then Moses took his wife and his sons[a], set them on the donkey, and returned to the land of Egypt[b]. And Moses took the staff of God in his hand.
translation:
  language: sw
  text: Kisha Musa akachukua mke wake na wanawe, akawapandisha juu ya punda[a], akarudi kwenda nchi ya Misri. Musa akachukua fimbo ya Mungu mkononi mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, aliwafanya wapande punda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kisha Musa akamchukua
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na לקח imetafsiriwa kwa maana yake ya moja kwa moja, “chukua.”
- source_word: אִשְׁתּוֹ
  choice: mke wake
  rationale: Ni tafsiri ya kawaida ya אשה pamoja na kiambishi cha nafsi ya tatu umoja wa kiume; hakuna sababu ya kuweka jina Sipora katika aya hii.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Nomino ya Kiebrania ni wingi wa kiume na humaanisha “wanawe,” si neno la jumla “watoto wake.”
- source_word: וַיַּרְכִּבֵם
  choice: akawapandisha juu ya
  rationale: Hiphil ya רכב ina maana ya kusababisha watu wapande au wasafiri juu ya mnyama; “akawapandisha” huhifadhi maana hiyo kwa Kiswahili cha asili.
- source_word: הַחֲמֹר
  choice: punda
  rationale: “Punda” ni neno la kawaida na la sasa. Ingawa Kiebrania lina kibainishi, Kiswahili hakihitaji kutafsiri kibainishi hicho kwa neno tofauti.
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Katika muktadha huu שוב inaonyesha kurudi mahali alikotoka.
- source_word: אַרְצָה מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Kiishio cha mwelekeo katika אַרְצָה kinaonyesha kwenda kwenye nchi ya Misri; “katika nchi ya Misri” ni ya asili na bado huhifadhi neno “nchi.”
- source_word: מַטֵּה הָאֱלֹהִים
  choice: fimbo ya Mungu
  rationale: מַטֶּה inaweza kuwa fimbo au gongo; “fimbo” ni neno la kawaida linalofaa chombo alichobeba Musa na huhifadhi muundo “ya Mungu.”
- source_word: בְּיָדוֹ
  choice: mkononi mwake
  rationale: Tafsiri hii huhifadhi picha halisi ya Musa akiwa ameishika fimbo mkononi.
theological_decisions:
- issue: Maana ya הָאֱלֹהִים katika מַטֵּה הָאֱלֹהִים
  choice: Mungu
  alternative: fimbo ya kimungu
  rationale: Katika muktadha wa agizo na ishara alizopewa Musa, neno hili linamtaja Mungu mwenyewe; “fimbo ya Mungu” ndiyo maana ya wazi bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mfuatano wa vitenzi vya simulizi umetolewa kwa “aka-”. Neno “wanawe” limechaguliwa badala ya “watoto wake” ili kuhifadhi wingi wa kiume wa Kiebrania. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
