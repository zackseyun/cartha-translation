source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ בְּ/לֶכְתְּ/ךָ֙ לָ/שׁ֣וּב מִצְרַ֔יְמָ/ה רְאֵ֗ה כָּל הַ/מֹּֽפְתִים֙ אֲשֶׁר שַׂ֣מְתִּי בְ/יָדֶ֔/ךָ וַ/עֲשִׂיתָ֖/ם לִ/פְנֵ֣י פַרְעֹ֑ה וַ/אֲנִי֙ אֲחַזֵּ֣ק אֶת לִבּ֔/וֹ וְ/לֹ֥א יְשַׁלַּ֖ח אֶת הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/021.yaml
  text: Then Yahweh said to Moses[a], “When you go back to Egypt, see that you do before Pharaoh all the wonders that I have put in your hand. But I will harden his heart[b], and he will not let the people go.”
translation:
  language: sw
  text: Kisha Yahwe akamwambia Musa, “Utakaporudi Misri, hakikisha uyafanye mbele ya Farao maajabu yote[a] niliyoweka mkononi mwako. Lakini mimi nitaufanya moyo wake kuwa mgumu[b], naye hatawaacha watu waende.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ishara” au “miujiza.” Neno la Kiebrania linamaanisha matendo yasiyo ya kawaida yanayoonyesha nguvu ya Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au “nitauimarisha moyo wake” au “nitaufanya moyo wake uwe thabiti.” Kitenzi cha Kiebrania kinaweza kumaanisha kuimarisha; hapa kinaeleza Farao kuthibitishwa katika kukataa kwake kwa ukaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa umbo la Kiswahili linalokubalika la jina la Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: בְּלֶכְתְּךָ לָשׁוּב מִצְרַיְמָה
  choice: Utakaporudi Misri
  rationale: Muundo wa vitenzi-jina na kiambishi cha mwelekeo umeonyeshwa kwa kishazi cha wakati cha Kiswahili, kinachoeleza kurudi kuelekea Misri kwa lugha ya kawaida.
- source_word: רְאֵה
  choice: hakikisha kwamba
  rationale: Amri hii ina maana ya kutia maanani na kuhakikisha jambo linafanywa; tafsiri hii huwasilisha nguvu ya agizo kwa Kiswahili cha kawaida.
- source_word: הַמֹּפְתִים
  choice: maajabu
  rationale: Neno hili humaanisha matendo ya ajabu yanayoonyesha nguvu ya Mungu. “Maajabu” huhifadhi wazo hilo bila kulifanya neno liwe tu istilahi ya “ishara.”
- source_word: שַׂמְתִּי בְיָדֶךָ
  choice: niliyoweka mkononi mwako
  rationale: Taswira ya Kiebrania ya kuweka mkononi imehifadhiwa; hapa inaonyesha kwamba Musa amepewa uwezo na jukumu la kuyafanya.
- source_word: וַעֲשִׂיתָם לִפְנֵי פַרְעֹה
  choice: unafanya mbele ya Farao
  rationale: “Kufanya” ni kilinganishi cha moja kwa moja na cha kawaida, huku “mbele ya Farao” kikihifadhi wazo la kuyatenda katika uwepo wake.
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Ingawa kiunganishi cha Kiebrania mara nyingi ni “na,” hapa muktadha unaonyesha tofauti kati ya tendo la Musa na tendo la Mungu.
- source_word: אֲחַזֵּק אֶת לִבּוֹ
  choice: nitaufanya moyo wake kuwa mgumu
  rationale: Kitenzi cha kusababisha kinaweza kumaanisha kuimarisha au kufanya imara; katika simulizi hili kinaonyesha kuthibitishwa katika ukaidi. Tafsiri hii huhifadhi uzito wa muktadha.
- source_word: וְלֹא יְשַׁלַּח אֶת הָעָם
  choice: naye hatawaacha watu waende
  rationale: Katika muktadha wa Kutoka, usemi huu unamaanisha kukataa kuwaruhusu watu waondoke; huu ni usemi wa asili na wazi kwa Kiswahili.
theological_decisions:
- issue: Mungu kuufanya moyo wa Farao kuwa mgumu
  choice: nitaufanya moyo wake kuwa mgumu
  alternative: nitauimarisha moyo wake; nitaufanya moyo wake uwe thabiti
  rationale: Kitenzi חזק kinaweza kuonyesha kuimarisha au kufanya imara, lakini katika simulizi la Farao uimara huo ni ukaidi wa kukataa. Tafsiri haipunguzi kauli kuhusu tendo la Mungu wala kutatua kimya kimya mvutano kati ya mamlaka ya Mungu na wajibu wa Farao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida na unaoeleweka. Taswira muhimu za Kiebrania, kama “mkononi mwako” na “moyo wake,” zimehifadhiwa bila kuleta ugumu usio wa lazima.
