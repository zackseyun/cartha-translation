base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/004.yaml
  text: Then Yahweh said to Moses[a], “Reach out your hand and take hold of its tail.” So he reached out his hand and took hold of it[b], and it became a staff in his hand.
translation:
  language: sw
  text: Kisha Yahweh akamwambia Musa, “Nyosha mkono wako, na umshike kwa mkia wake[a].” Basi akanyosha mkono wake, akamshika, naye akawa fimbo[b] mkononi mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ushike mkia wake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mkongojo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi unaofaa matamshi na tahajia ya Kiswahili, badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: שְׁלַח יָדְךָ
  choice: Nyosha mkono wako
  rationale: Katika muktadha huu wa tendo la mwili, kauli hii ya kawaida ya Kiswahili inaonyesha kunyoosha mkono ili kufikia kitu.
- source_word: וֶאֱחֹז בִּזְנָבוֹ
  choice: umkamate kwa mkia wake
  rationale: Kitenzi kina maana ya kushika au kukamata, na kihusishi בְּ pamoja na “mkia” kinaonyeshwa kwa kawaida kwa “kwa mkia wake.” Kiambishi cha nafsi chenye uhai kinarejelea nyoka wa mstari uliotangulia.
- source_word: וַיַּחֲזֶק בּוֹ
  choice: akamshika
  rationale: Katika muundo huu, חזק inaonyesha kumshika kwa uthabiti. “Akamshika” ni ya kawaida na inaendeleza rejeleo la nyoka bila kuongeza maelezo yasiyo lazima.
- source_word: וַיְהִי לְמַטֶּה
  choice: akawa fimbo
  rationale: היה pamoja na לְ inaonyesha badiliko la hali; “akawa” linahifadhi mabadiliko hayo. מַטֶּה hapa ni fimbo iliyokuwa mkononi mwa Mose.
- source_word: בְּכַפּוֹ
  choice: mkononi mwake
  rationale: Ingawa כַּף inaweza kutaja kiganja hasa, “mkononi mwake” ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya mahali bila ugumu usio wa lazima.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina na linafuata tahajia inayosomeka kwa kawaida katika Kiswahili; halibadilishwi na cheo “BWANA.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa simulizi, wa sasa, wenye heshima na unaoeleweka kwa msomaji wa kawaida. Mfuatano wa vitenzi umehifadhiwa kwa “akamwambia … akanyosha … akamshika … akawa,” huku rejeleo la nyoka likionyeshwa kwa ngeli ya kiumbe hai.
