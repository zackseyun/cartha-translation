base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/005.yaml
  text: Then Jethro[a], Moses' father-in-law, came to Moses in the wilderness, where he was camped at the mountain of God[b], with his sons and his wife.
translation:
  language: sw
  text: Ndipo Yethro, baba-mkwe wa Musa, akamjia Musa jangwani pamoja na wana wa Musa na mke wa Musa, mahali alipokuwa amepiga kambi kwenye mlima wa Mungu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Yaani, “mlima wa Mungu,” cheo cha mahali kinachohusishwa na Sinai au Horebu.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Ndipo ... akamjia
  rationale: Umbo la wayyiqtol linaendeleza simulizi. “Ndipo” na “akamjia” zinaonyesha mfuatano na mwendo kuelekea kwa Musa kwa Kiswahili cha kawaida.
- source_word: יִתְרוֹ
  choice: Yethro
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: חֹתֵן מֹשֶׁה
  choice: baba mkwe wa Musa
  rationale: Hili linaeleza kwa uwazi uhusiano wa Yethro na Musa; “baba mkwe” ni sahihi zaidi hapa kuliko neno pana “mkwe.”
- source_word: וּבָנָיו וְאִשְׁתּוֹ
  choice: akiwa pamoja na wanawe na mkewe
  rationale: “Pamoja na” linaonyesha kwamba watu hawa waliandamana na Yethro. Viambishi vya umilikaji vya Kiebrania vimehifadhiwa kwa umbo la Kiswahili, huku tanbihi ikieleza utata wa rejeleo lake.
- source_word: אֶל מֹשֶׁה
  choice: akamjia Musa
  rationale: Kihusishi אֶל kinaonyesha mwendo kuelekea kwa Musa; “akamjia Musa” ni usemi wa asili na sahihi katika Kiswahili.
- source_word: אֶל הַמִּדְבָּר
  choice: jangwani
  rationale: Mahali anapofikiwa Musa panaelezwa kwa hali ya mahali; “jangwani” ni fasaha kuliko tafsiri ya neno kwa neno “kwenda jangwani” katika muundo huu.
- source_word: אֲשֶׁר הוּא חֹנֶה שָׁם
  choice: mahali alipokuwa amepiga kambi
  rationale: Kishazi hiki kinabainisha mahali Musa alipokuwapo. “Alipokuwa amepiga kambi” ni lugha ya sasa na yenye hadhi.
- source_word: הַר הָאֱלֹהִים
  choice: mlima wa Mungu
  rationale: Muundo wa Kiebrania umetafsiriwa moja kwa moja bila kuingiza jina Sinai au Horebu ambalo halipo katika mstari huu.
theological_decisions:
- issue: Rejeleo la viambishi katika “wanawe na mkewe”
  choice: Kuhifadhi viambishi vya umilikaji katika maandishi na kueleza katika tanbihi kwamba muktadha unaelekeza kwa Musa
  alternative: Kutaja wazi “wana wa Musa na mke wa Musa,” au kuvihusisha na Yethro
  rationale: Kisarufi viambishi vinaweza kusikika vikimrejelea Yethro, lakini muktadha wa Kutoka 18:2–4 unaonyesha kwamba ni wana wa Musa na mke wa Musa. Tanbihi inalinda utata wa muundo wa asili bila kuuficha.
- issue: Utambulisho wa “mlima wa Mungu”
  choice: Kuhifadhi cheo “mlima wa Mungu”
  alternative: Mlima Sinai; Horebu
  rationale: Mstari wenyewe hautaji Sinai wala Horebu kwa jina, kwa hiyo tafsiri haipaswi kuongeza utambulisho huo katika maandishi makuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa kwa mtiririko wa kawaida wa simulizi; “baba mkwe” huondoa utata wa uhusiano, huku tanbihi ikihifadhi utata halisi wa viambishi vya umilikaji.
