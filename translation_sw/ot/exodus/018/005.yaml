  - severity: low
    issue: Taarifa ya tanbihi a kuhusu uwezekano wa kisarufi inatia uzito kupita kiasi kwa utata ambao Kiswahili cha rasimu kimeuzalisha.
    rationale: Tafsiri ya Kiswahili inaweza kumweka wazi mrejelewa anayokusudiwa kwa sababu muktadha wa aya zilizotangulia unamtambulisha; tanbihi ifafanue kwamba Kiebrania hutumia viambishi vya nafsi ya tatu badala ya kudai usomaji wa Yethro kuwa mbadala sawa.
