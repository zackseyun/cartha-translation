- from: Wawe wakiwahukumu watu wakati wote. Kila jambo kubwa wakuletee, lakini kila jambo dogo walihukumu wao wenyewe.[a] Hivyo ujipunguzie mzigo[b], nao wataubeba pamoja nawe.
  to: Wawahukumu watu kila wakati. Kila jambo kubwa wakuletee, lakini wao wenyewe watoe hukumu juu ya kila jambo dogo.[a] Hivyo ujipunguzie mzigo,[b] nao wataubeba pamoja nawe.
  rationale: Marekebisho yanaboresha ufasaha wa Kiswahili na kuondoa utata wa wakati wa kitenzi, bila kubadili maana ya Kiebrania. Agizo la kuwahukumu watu kila wakati, utofauti wa mambo makubwa na madogo, mkazo kwamba waamuzi hao ndio washughulikie madogo, na taswira ya kugawana mzigo vyote vimehifadhiwa.
