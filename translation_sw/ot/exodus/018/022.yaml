base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/022.yaml
  text: And let them judge the people at all times[a]. Then every great matter they shall bring to you, but every small matter they themselves shall judge. So make it lighter for yourself[b], and they will bear the burden with you.
translation:
  language: sw
  text: Wawahukumu watu kila wakati. Kila jambo kubwa wakuletee, lakini wao wenyewe watoe hukumu juu ya kila jambo dogo.[a] Hivyo ujipunguzie mzigo,[b] nao wataubeba pamoja nawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila kesi kubwa ... kila kesi ndogo.” Kiebrania kinatumia maneno “kubwa” na “dogo” kwa mambo yanayoletwa ili yahukumiwe.
    reason: lexical_alternative
  - marker: b
    text: Neno “mzigo” linadokezwa na kishazi cha mwisho kinachohusu kazi ya kuwahukumu watu, ingawa halitajwi waziwazi katika Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: Wawe wakiwahukumu watu
  rationale: Kauli hii inaendeleza maagizo ya Yethro. Muundo wa “wawe wakiwahukumu” unaonyesha wajibu wa kuhukumu unaoendelea bila kuigeuza kuwa taarifa tu ya wakati ujao.
- source_word: בְּכָל־עֵת
  choice: wakati wote
  rationale: Hii inahifadhi maana ya moja kwa moja ya upatikanaji wa mara kwa mara kwa ajili ya kutoa hukumu.
- source_word: כָּל־הַדָּבָר הַגָּדֹל
  choice: kila jambo kubwa
  rationale: “Jambo” linaweza kumaanisha suala au kesi inayohitaji hukumu, na “kubwa” linadumisha ulinganifu wa Kiebrania na “dogo” bila kuufanya usemi kuwa wa kisheria kupita kiasi.
- source_word: יָבִיאוּ אֵלֶיךָ
  choice: wakuletee
  rationale: 'Hii ni amri ya nafsi ya tatu inayofaa muktadha wa maagizo: mambo makubwa yapelekwe kwa Musa ili ayashughulikie.'
- source_word: כָּל־הַדָּבָר הַקָּטֹן יִשְׁפְּטוּ הֵם
  choice: kila jambo dogo walihukumu wao wenyewe
  rationale: “Dogo” linahifadhi tofauti ya moja kwa moja na “kubwa”; “wao wenyewe” linaonyesha mkazo wa kiwakilishi הֵם kwamba waamuzi hao ndio watakaolishughulikia.
- source_word: וְהָקֵל מֵעָלֶיךָ
  choice: Hivyo ujipunguzie mzigo
  rationale: Kitenzi ni amri ya kusababisha hali ya kuwa nyepesi. Kiswahili hiki kinaendeleza sitiari ya kupunguza kilicho juu ya Musa kwa namna ya kawaida na inayoeleweka.
- source_word: וְנָשְׂאוּ אִתָּךְ
  choice: nao wataubeba pamoja nawe
  rationale: נשא ni “kubeba.” Kiambishi “u-” kinarejelea mzigo unaodokezwa na muktadha, huku “pamoja nawe” kikihifadhi wazo la kushiriki jukumu hilo na Musa.
