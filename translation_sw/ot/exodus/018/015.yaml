translation:
  language: sw
  text: Musa akamwambia baba-mkwe wake, “Kwa sababu watu huja kwangu ili kumtafuta Mungu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumwuliza Mungu” au “kutafuta uamuzi kutoka kwa Mungu.” Nahau ya Kiebrania inaweza kujumuisha wazo la kumwendea Mungu ili kupata mwongozo au hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Kauli ya simulizi ya Kiebrania inaendeleza matukio na kutambulisha jibu la Musa; “akamwambia” ni ya kawaida na pia huonyesha anayeelekezewa maneno.
- source_word: לְחֹתְנוֹ
  choice: mkwe wake
  rationale: Katika muktadha huu חֹתֵן humrejelea Yethro, baba wa mke wa Musa. “Mkwe wake” ni tafsiri ya asili na yenye heshima katika Kiswahili, bila kulazimika kurudia uhusiano huo kwa maelezo marefu.
- source_word: כִּי
  choice: Ni kwa sababu
  rationale: Neno hili linatambulisha sababu ya kitendo cha Musa katika jibu lake kwa swali la Yethro; muundo huu unaonyesha wazi nguvu ya kisababishi katika Kiswahili cha sasa.
- source_word: יָבֹא אֵלַי הָעָם
  choice: watu huja kwangu
  rationale: Kitenzi cha Kiebrania pamoja na אֶל kinaonyesha mwendo kuelekea kwa Musa. “Huja” linafaa kwa tendo linalotokea kwa kawaida katika maelezo haya.
- source_word: לִדְרֹשׁ
  choice: ili kumtafuta
  rationale: דרש ikitumiwa na Mungu inaweza kumaanisha kumtafuta au kumwendea ili kuuliza mwongozo. “Kumtafuta” huhifadhi maana pana ya Kiebrania, huku maana maalumu zaidi ikiwekwa katika tanbihi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitu kinachotafutwa katika maandishi ni Mungu mwenyewe. Tafsiri hii huhifadhi rejeo la wazi la kitheolojia badala ya kulibadili kuwa “mapenzi ya Mungu” au “uamuzi wa Mungu.”
theological_decisions:
- issue: Maana ya nahau לִדְרֹשׁ אֱלֹהִים
  choice: kumtafuta Mungu
  alternative: kumwuliza Mungu; kutafuta uamuzi kutoka kwa Mungu
  rationale: Nahau ya Kiebrania inaweza kumaanisha kumtafuta Mungu kwa upana au kumwendea ili kupata mwongozo au hukumu katika muktadha wa migogoro. Maandishi makuu yanahifadhi upana huo, na tanbihi inaonyesha uwezekano wa maana maalumu zaidi bila kuufanya kuwa ndiyo maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mkwe wake” ni ya kawaida na isiyo nzito; “huja” huonyesha tendo la kawaida. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachohusika.
