  text: Kisha Musa akamruhusu baba-mkwe wake aondoke[a], naye akaenda katika nchi yake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kisha Musa akamwacha baba-mkwe wake aende zake, naye akaenda katika nchi yake.”
