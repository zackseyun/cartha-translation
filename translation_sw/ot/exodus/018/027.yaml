lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: akamruhusu ... aondoke
  rationale: Katika kauli ya Piel ikiwa na mtu kama yambwa, שׁלח humaanisha kumwondoa au kumruhusu mtu aende. Usemi huu ni wa kawaida katika Kiswahili na unaonyesha Musa alimpa ruhusa rasmi ya kuondoka bila kudokeza kufukuzwa.
- source_word: חֹתְנוֹ
  choice: baba mkwe wake
  rationale: Katika muktadha huu חֹתֵן ni Yethro, baba ya mke wa Musa; kwa hiyo “baba mkwe wake” ndiyo maana mahususi na ya wazi.
- source_word: וַיֵּלֶךְ לוֹ
  choice: naye akaenda
  rationale: לוֹ hapa ni sehemu ya usemi wa Kiebrania unaosimulia kuondoka kwake, wala haihitaji kutafsiriwa kwa neno tofauti katika Kiswahili.
- source_word: אֶל אַרְצוֹ
  choice: katika nchi yake mwenyewe
  rationale: אֶרֶץ inaweza kumaanisha nchi au eneo la mtu. “Nchi yake mwenyewe” inaonyesha wazi umilikaji bila kulazimisha dhana ya taifa la kisasa.
