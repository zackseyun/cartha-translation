lexical_decisions:
- source_word: וְאֵת שְׁנֵי בָנֶיהָ
  choice: na wanawe wawili
  rationale: Kiunganishi kinaendeleza orodha ya vitu vilivyochukuliwa katika mstari uliotangulia, na alama ya yambwa אֵת haitafsiriwi kivyake. ‘Wanawe wawili’ ni Kiswahili cha kawaida na huhifadhi rejeo la wana wa kiume.
- source_word: אֲשֶׁר שֵׁם הָאֶחָד
  choice: ambaye mmoja wao aliitwa
  rationale: Muundo huu ni wa asili katika Kiswahili na unaonyesha kwamba mmoja kati ya hao wawili ndiye anayetajwa, bila kudai kuwa alikuwa wa kwanza kwa umri.
- source_word: גֵּרְשֹׁם
  choice: Gershomu
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili huku likibaki kutambulika kama jina la Kiebrania.
- source_word: כִּי אָמַר
  choice: kwa maana alisema
  rationale: כִּי hapa inatoa sababu au ufafanuzi wa jina; ‘kwa maana’ huhifadhi uhusiano huo wa maelezo.
- source_word: גֵּר
  choice: mgeni
  rationale: Neno hili huonyesha mtu anayeishi nje ya nchi au jamii yake, akiwa mkazi asiye mwenyeji. ‘Mgeni’ ni neno la kawaida la Kiswahili na pia hudumisha mwangwi wa maana unaohusishwa na jina Gershomu.
- source_word: הָיִיתִי
  choice: nimekuwa
  rationale: Kauli timilifu ya Kiswahili inafaa kwa tafakari ya Musa kuhusu hali aliyokuwa nayo na ambayo umuhimu wake unaendelea katika maelezo ya jina.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: katika nchi ya kigeni
  rationale: Tafsiri hii ni wazi na ya kawaida, nayo huhifadhi tofauti ya kimakusudi kati ya mtu aliye mgeni na nchi isiyo yake.
