base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/020.yaml
  text: And you shall warn them about the statutes and the laws[b][a], and make known to them the way in which they must walk and the work that they must do.
translation:
  language: sw
  text: Nawe uwaonye kuhusu kanuni na sheria,[a] na uwajulishe njia wanayopaswa kuiendea[b] na kazi wanayopaswa kufanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maelekezo” badala ya “sheria” (Kiebrania torot). Neno hilo linaweza kumaanisha mafundisho kwa upana zaidi, lakini mazingira ya kisheria hapa yanaunga mkono “sheria.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “njia watakayoiendea.” Usemi wa kwenda katika njia unadumishwa ili kuhifadhi sitiari ya Kiebrania kuhusu mwenendo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזְהַרְתָּה
  choice: Nawe uwaonye
  rationale: Hifili ya זהר inaweza kumaanisha kuonya au kuasa kwa tahadhari. Katika muktadha huu wa utoaji hukumu, “uwaonye” inadumisha uzito na wajibu unaohusika.
- source_word: הַחֻקִּים
  choice: masharti
  rationale: חֻקִּים ni maagizo au matakwa yaliyowekwa rasmi. “Masharti” ni Kiswahili cha kawaida kinachotofautisha neno hili na תּוֹרֹת bila kupoteza maana ya kisheria.
- source_word: הַתּוֹרֹת
  choice: sheria
  rationale: Ingawa תּוֹרָה pia huweza kumaanisha mafundisho au maelekezo, wingi wake hapa pamoja na חֻקִּים na katika mazingira ya kisheria unaunga mkono “sheria.”
- source_word: וְהוֹדַעְתָּ
  choice: uwajulishe
  rationale: Hifili ya ידע ina maana ya kusababisha mtu ajue; “uwajulishe” ni usemi wa asili unaohifadhi maana hiyo.
- source_word: הַדֶּרֶךְ
  choice: njia
  rationale: “Njia” inadumisha sitiari ya Kiebrania kuhusu mwenendo au namna ya kuishi.
- source_word: יֵלְכוּ בָהּ
  choice: wanayopaswa kuiendea
  rationale: Usemi huu unaonyesha mwenendo unaotakiwa. “Kuiendea” huhifadhi sitiari ya kwenda katika njia, huku “wanayopaswa” ikionyesha wajibu wa muktadha.
- source_word: הַמַּעֲשֶׂה
  choice: kazi
  rationale: מַעֲשֶׂה hurejelea jambo linalofanywa. “Kazi” hapa ni pana vya kutosha kujumuisha wajibu au tendo linalotakiwa.
- source_word: אֲשֶׁר יַעֲשׂוּן
  choice: wanayopaswa kufanya
  rationale: Kishazi hiki kinaeleza tendo linalotakiwa; “wanayopaswa kufanya” huwasilisha wajibu kwa Kiswahili cha kawaida.
