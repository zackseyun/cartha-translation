translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umewekwa wazi na wa kawaida, huku sitiari ya “njia” na kuifuata ikidumishwa. Alama za tanbihi zimepangwa kulingana na mahali zinapohusika katika matini.
