source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ יִתְרוֹ֒ בָּר֣וּךְ יְהוָ֔ה אֲשֶׁ֨ר הִצִּ֥יל אֶתְ/כֶ֛ם מִ/יַּ֥ד מִצְרַ֖יִם וּ/מִ/יַּ֣ד פַּרְעֹ֑ה אֲשֶׁ֤ר הִצִּיל֙ אֶת הָ/עָ֔ם מִ/תַּ֖חַת יַד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/010.yaml
  text: And Yitro said[a], “Blessed be Yahweh, who delivered you from the hand of the Egyptians and from the hand of Pharaoh[b], who delivered the people from under the hand of the Egyptians.”
translation:
  language: sw
  text: Yitro akasema, “Abarikiwe Yahwe[a], aliyewaokoa ninyi kutoka mkononi mwa Wamisri na mkononi mwa Farao, ambaye aliwaokoa watu kutoka chini ya mkono wa Wamisri[b][c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe amebarikiwa” au “Yahwe abarikiwe.” Kauli hii ya Kiebrania ya baraka na sifa inaweza kutafsiriwa kwa namna zaidi ya moja.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “kutoka mkononi mwa Misri … kutoka chini ya mkono wa Misri.” Huu ni usemi wa kuokolewa kutoka katika nguvu au udhibiti wa ukandamizaji.
    reason: lexical_alternative
  - marker: c
    text: Kirejeshi cha Kiebrania “ambaye” kinaweza kuchunguzwa kisintaksia kwa namna tofauti. Katika muktadha, wengi hukielewa kuwa kinamrejelea Yahwe, ingawa kinakuja baada ya “Farao.”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Muundo wa usimulizi wenye kiambishi -ka- unaonyesha tukio linalofuata kwa kawaida katika Kiswahili, bila kuongeza msisitizo wa wakati usiomo katika Kiebrania.
- source_word: יִתְרוֹ
  choice: Yitro
  rationale: Unukuzi huu unafuata kwa karibu umbo la jina la Kiebrania kuliko umbo la kimapokeo ‘Yethro’.
- source_word: בָּרוּךְ יְהוָה
  choice: Yahwe na abarikiwe
  rationale: Hii ni namna ya asili na yenye heshima ya kuwasilisha kauli ya baraka au sifa, huku tanbihi ikihifadhi uwezekano mwingine wa kuelewa muundo wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna inayokubalika katika tahajia ya Kiswahili badala ya kubadilishwa kuwa cheo ‘BWANA’.
- source_word: הִצִּיל
  choice: aliyewaokoa
  rationale: Kitenzi ‘kuokoa’ kinaeleza kumtoa mtu katika nguvu au hatari ya adui na kinafaa katika muktadha wa kutoka Misri.
- source_word: אֶתְכֶם
  choice: -wa- katika ‘aliyewaokoa’
  rationale: Kiambishi hiki cha yambwa kinaonyesha nafsi ya pili wingi kulingana na anayezungumziwa katika hotuba, bila kuongeza msisitizo wa ‘ninyi’ usiokuwapo wazi katika chanzo.
- source_word: מִיַּד מִצְרַיִם
  choice: kutoka mikononi mwa Wamisri
  rationale: ‘Mikononi mwa’ huhifadhi taswira ya Kiebrania ya kuwa chini ya nguvu au udhibiti; ‘Wamisri’ linaonyesha maana ya pamoja inayofaa hapa.
- source_word: וּמִיַּד פַּרְעֹה
  choice: na mkononi mwa Farao
  rationale: Tafsiri hii huhifadhi sitiari ya mkono na kumtaja Farao kama mwenye mamlaka binafsi.
- source_word: הָעָם
  choice: watu
  rationale: Neno hili linarejelea jamii ya Israeli kwa ujumla; ‘watu’ ni la kawaida na linaloeleweka.
- source_word: מִתַּחַת יַד מִצְרָיִם
  choice: kutoka chini ya mamlaka ya Wamisri
  rationale: Usemi huu unaonyesha hali ya kutiishwa chini ya udhibiti wa Misri. ‘Chini ya mamlaka’ ni Kiswahili cha asili kinachohifadhi wazo la kuwa chini ya nguvu kandamizi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina maalumu la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, na tahajia yake ni ya kawaida katika Kiswahili.
- issue: Maana ya kauli בָּרוּךְ יְהוָה
  choice: Yahwe na abarikiwe
  alternative: Yahwe amebarikiwa
  rationale: Muundo wa Kiebrania unaweza kueleweka kama tamko la sifa au kama kauli ya kumtakia Mungu baraka. Tafsiri kuu inatoa kwa asili nguvu ya kidoksolojia, na tanbihi huhifadhi maana mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Sitiari ya ‘mkono’ imehifadhiwa pale inaposikika kwa kawaida, huku usemi mzito zaidi מִתַּחַת יַד ukitolewa kama ‘chini ya mamlaka’ ili kueleweka wazi bila kupoteza dhana ya kutiishwa.
