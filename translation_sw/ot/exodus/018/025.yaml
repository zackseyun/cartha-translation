  text: וַ/יִּבְחַ֨ר מֹשֶׁ֤ה אַנְשֵׁי חַ֨יִל֙ מִ/כָּל יִשְׂרָאֵ֔ל וַ/יִּתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עַל הָ/עָ֑ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/025.yaml
  text: 'Moses chose capable men from all Israel and appointed them as heads over the people: commanders of thousands[a], commanders of hundreds, commanders of fifties[b], and commanders of tens.'
translation:
  language: sw
  text: 'Musa akachagua wanaume wenye uwezo kutoka katika Israeli yote, akawaweka kuwa viongozi juu ya watu: maofisa wa maelfu, maofisa wa mamia, maofisa wa hamsini, na maofisa wa makumi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: akachagua
  rationale: Kitenzi בחר humaanisha kuchagua; “akachagua” ni simulizi la kawaida na la moja kwa moja katika Kiswahili.
- source_word: אַנְשֵׁי חַיִל
  choice: wanaume wenye uwezo
  rationale: Katika muktadha huu wa uteuzi wa viongozi na waamuzi, חַיִל inaonyesha uwezo, ustadi, na sifa zinazofaa zaidi kuliko ushujaa wa kijeshi.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: kutoka katika Israeli yote
  rationale: Kirai hiki kinaonyesha kwamba waliochaguliwa walitoka katika taifa lote la Israeli.
- source_word: וַיִּתֵּן אֹתָם
  choice: akawaweka
  rationale: Ingawa נתן kimsingi ni “kutoa/kuweka,” hapa ina maana ya kuwaweka rasmi katika madaraka.
- source_word: רָאשִׁים עַל הָעָם
  choice: viongozi juu ya watu
  rationale: רָאשִׁים ni “vichwa” kwa maana ya watu wenye mamlaka; “viongozi” ni Kiswahili cha asili kinachowasilisha sitiari hiyo kwa uwazi, huku עַל ikionyesha mamlaka juu ya watu.
- source_word: שָׂרֵי
  choice: maofisa wa
  rationale: שַׂר hapa humaanisha wenye mamlaka waliowekwa kusimamia vikundi vya ukubwa tofauti. “Maofisa” linafaa kwa muundo huu wa kiutawala bila kulazimisha maana ya kijeshi.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: maelfu, mamia, hamsini, na makumi
  rationale: Maneno ya nambari yamewasilishwa moja kwa moja ili kuhifadhi ngazi za vikundi katika muundo wa utawala.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Maofisa” limetumiwa badala ya “makamanda” kwa sababu muktadha ni wa kiutawala na kimahakama, si lazima wa kijeshi. Hakuna tanbihi iliyohitajika kwa kuwa maana muhimu inaweza kuwasilishwa wazi katika matini.
