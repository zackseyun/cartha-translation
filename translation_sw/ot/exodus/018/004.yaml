base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/004.yaml
  text: And the name of the other was Eliezer[a], for the God of my father was my help, and he delivered me from Pharaoh’s sword.
translation:
  language: sw
  text: Na jina la yule mwingine lilikuwa Eliezeri, kwa maana Mungu wa baba yangu alikuwa msaada wangu, naye akaniokoa kutoka kwa upanga wa Farao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשֵׁם הָאֶחָד
  choice: Na jina la yule mwingine
  rationale: Kiunganishi וְ kinahifadhiwa kwa “Na,” na הָאֶחָד katika muktadha wa mwana aliyetajwa baada ya wa kwanza inaeleweka kiasili kuwa “yule mwingine,” si lazima “wa pili.”
- source_word: אֱלִיעֶזֶר
  choice: Eliezeri
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili; maana yake inayodokezwa, ‘Mungu wangu ni msaada,’ inaungwa mkono na maelezo yanayofuata bila kubadilisha jina kuwa tafsiri.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu au maelezo ya kuitwa kwa jina hilo, na “kwa maana” ni unganishi wa Kiswahili ulio wazi na wenye hadhi.
- source_word: אֱלֹהֵי אָבִי
  choice: Mungu wa baba yangu
  rationale: Huhifadhi kwa karibu muundo wa Kiebrania na marejeo yake kwa Mungu aliyeabudiwa na baba ya Musa.
- source_word: בְּעֶזְרִי
  choice: alikuwa msaada wangu
  rationale: Nomino עֵזֶר pamoja na kiambishi cha nafsi ya kwanza inatafsiriwa “msaada wangu”; “alikuwa” huwasilisha kwa kawaida mtazamo wa nyuma wa maelezo hayo.
- source_word: וַיַּצִּלֵנִי
  choice: naye akaniokoa
  rationale: Kitenzi נצל humaanisha kuokoa au kukomboa kutoka hatarini; “akaniokoa” ni cha sasa, wazi, na kinadumisha mtiririko wa simulizi.
- source_word: מֵחֶרֶב פַּרְעֹה
  choice: kutoka kwa upanga wa Farao
  rationale: Huhifadhi taswira halisi ya ‘upanga wa Farao,’ ambayo inaweza kumaanisha silaha au mamlaka yake ya kuua, bila kuifafanua kupita chanzo.
theological_decisions:
- issue: Kutokuwapo kwa kitenzi cha kusema katika maelezo ya jina
  choice: Hakuna maneno kama “alisema” yaliyoongezwa
  alternative: kwa maana alisema, “Mungu wa baba yangu...”
  rationale: Kiebrania kinaunganisha jina moja kwa moja na sababu yake bila kitenzi cha kusema. Tafsiri inadumisha hali hiyo na kuepuka kuamua kama maneno hayo ni nukuu ya Musa au maelezo ya msimulizi.
- issue: Wakati wa בְּעֶזְרִי
  choice: alikuwa msaada wangu
  alternative: ni msaada wangu
  rationale: Kishazi cha Kiebrania hakina kitenzi kilichoandikwa wazi. Wakati uliopita unafaa muktadha wa kukumbuka kuokolewa kutoka kwa Farao, ingawa umbo lenyewe linaweza kutolewa pia kwa wakati wa sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kawaida lakini chenye hadhi. Sentensi inafuata kwa karibu muundo wa Kiebrania huku ikisomeka kwa urahisi; hakuna alama ya tanbihi kwa kuwa hakuna tanbihi inayohitajika katika rasimu hii.
