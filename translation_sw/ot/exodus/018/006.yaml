lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: Akamwambia Musa
  rationale: Ka- ya usimulizi inaendeleza mfululizo wa matukio kwa Kiswahili cha kawaida, na ‘akamwambia Musa’ huwakilisha kwa asili wazo la kusema kwa Musa.
- source_word: אֲנִי
  choice: Mimi
  rationale: Kiwakilishi huru kimehifadhiwa kwa sababu katika Kiebrania kimetajwa wazi na kinaweka msisitizo kwa msemaji.
- source_word: חֹתֶנְךָ יִתְרוֹ
  choice: Yethro baba mkwe wako
  rationale: Katika muktadha huu חֹתֵן humtaja baba ya mke wa Musa. ‘Baba mkwe’ ni sahihi zaidi kuliko ‘mkwe’ peke yake, ambalo linaweza kumaanisha mahusiano mbalimbali ya ndoa.
- source_word: בָּא אֵלֶיךָ
  choice: ninakuja kwako
  rationale: Umbo la kushiriki בָּא linaonyesha tendo linaloendelea au linalokaribia kutokea; ‘ninakuja’ hulihifadhi bila kuligeuza kuwa tendo lililokamilika.
- source_word: וְאִשְׁתְּךָ
  choice: pamoja na mke wako
  rationale: Ingawa וְ kwa umbo ni kiunganishi, hapa mke ni mmoja wa wanaoandamana na Yethro; ‘pamoja na’ huonyesha uhusiano huo kwa Kiswahili cha asili.
- source_word: וּשְׁנֵי בָנֶיהָ
  choice: na wanawe wawili
  rationale: Kiambishi cha Kiebrania ni nafsi ya tatu, umoja, kike—‘wanawe’—na kinamrejelea mke wa Musa. Hakijabadilishwa kuwa ‘wanao wawili.’
- source_word: עִמָּהּ
  choice: ambao wako pamoja naye
  rationale: Maneno haya yamehifadhiwa kwa kuwa Kiebrania kinasema wazi kwamba wana hao wako pamoja na mama yao; ‘ambao’ hufanya uhusiano huo uwe wazi na wa kawaida kwa Kiswahili.
