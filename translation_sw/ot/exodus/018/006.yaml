  text: He said to Moses[a], “I, Jethro your father-in-law, am coming to you, with your wife and her two sons with her.”
translation:
  language: sw
  text: Akamwambia Musa, “Mimi, Yethro, baba-mkwe wako, ninakuja kwako pamoja na mke wako na wanawe wawili[a], ambao wako pamoja naye.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wanawe wawili,” yaani wana wa mke wa Musa. Tafsiri nyingine husema “wanao wawili,” lakini Andiko la Kimasora lina kiambishi cha umilikaji cha nafsi ya tatu, umoja, kike, kinachomrejelea mke wa Musa.'
