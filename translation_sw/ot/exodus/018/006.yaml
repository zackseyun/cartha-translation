translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Jina יִתְרוֹ limetolewa kama “Yethro,” kwa kufuata tahajia iliyozoeleka katika tafsiri za Biblia za Kiswahili. Muundo wa sentensi umehifadhi msisitizo wa “Mimi” na pia tofauti ya makusudi kati ya “mke wako” na “wanawe wawili.”
