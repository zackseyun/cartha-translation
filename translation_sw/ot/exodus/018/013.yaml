  text: And it happened on the next day that Moses sat to judge the people[a], and the people stood before Moses from morning until evening.
translation:
  language: sw
  text: Siku iliyofuata, Musa akaketi ili awaamulie watu, nao watu wakasimama mbele ya Musa[a] tangu asubuhi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamzunguka Musa.” Kihusishi cha Kiebrania kinaweza pia kueleweka kwa maana ya karibu zaidi na “juu ya” au “kumzunguka”; lakini katika muktadha huu maana yake ni kwamba watu walikuwa wamesimama mbele yake wakisubiri awaamulie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Kesho yake
  rationale: Kirai hiki kinaonyesha siku iliyofuata katika mfululizo wa simulizi. “Kesho yake” ni Kiswahili cha sasa na cha kawaida.
- source_word: וַיֵּשֶׁב
  choice: akaketi
  rationale: Kitenzi hiki kinahifadhi picha halisi ya Musa kuketi katika nafasi ya kutoa hukumu.
- source_word: לִשְׁפֹּט אֶת הָעָם
  choice: ili awaamulie watu
  rationale: Katika muktadha huu שפט ni kusikiliza na kuamua mashauri ya watu. “Awaamulie” huwasilisha kazi hiyo ya kimahakama kwa Kiswahili cha kawaida bila kuacha dhana ya kutoa uamuzi.
- source_word: וַיַּעֲמֹד הָעָם
  choice: watu wakasimama
  rationale: Tafsiri ya moja kwa moja ya עמד inahifadhi mkao wa watu walipokuwa wakisubiri.
- source_word: עַל מֹשֶׁה
  choice: mbele ya Musa
  rationale: Ingawa עַל mara nyingi humaanisha “juu ya,” pamoja na עמד hapa inaeleza watu kusimama mbele ya Musa wakisubiri maamuzi yake. Uwezekano wa maana halisi zaidi umewekwa katika tanbihi.
- source_word: מִן הַבֹּקֶר עַד הָעָרֶב
  choice: tangu asubuhi mpaka jioni
  rationale: Kirai hiki kinaonyesha muda wote wa shughuli hiyo, kuanzia asubuhi hadi jioni, kwa Kiswahili asilia.
