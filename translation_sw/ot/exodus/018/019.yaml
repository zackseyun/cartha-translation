  text: Now listen to my voice[a]; I will advise you, and God be with you. You be for the people before God[c][b], and you shall bring the matters to God.
translation:
  language: sw
  text: Sasa sikiliza sauti yangu; nitakushauri, na Mungu awe pamoja nawe.[a] Wewe uwe mwakilishi wa watu mbele za Mungu,[b] nawe uyapeleke mambo hayo[c] kwa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Umbo la Kiebrania hapa linaonyesha ombi au baraka: “Mungu na awe pamoja nawe.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kwa kufuata maneno ya Kiebrania kwa karibu: “Wewe uwe kwa ajili ya watu mbele za Mungu.” Maana yake ni kwamba Musa awawakilishe watu mbele za Mungu.'
    reason: alternative_reading
  - marker: c
    text: “Mambo hayo” hapa ni mambo au migogoro ya watu iliyohitaji uamuzi.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Sasa
  rationale: Ni kiashiria cha wakati na cha kuendeleza mazungumzo, kikianzisha ushauri unaofuata.
- source_word: שְׁמַע בְּקֹלִי
  choice: sikiliza sauti yangu
  rationale: Huhifadhi nahau ya Kiebrania bila kuifanya amri ya kutii kwa lazima; Kiswahili hiki ni wazi na cha heshima.
- source_word: אִיעָצְךָ
  choice: nitakushauri
  rationale: Kitenzi יעץ humaanisha kutoa shauri; neno hili ni la kawaida na linafaa katika muktadha.
- source_word: וִיהִי אֱלֹהִים עִמָּךְ
  choice: na Mungu awe pamoja nawe
  rationale: Huwasilisha kwa kawaida hali ya ombi au baraka iliyo katika umbo la Kiebrania.
- source_word: הֱיֵה אַתָּה לָעָם
  choice: Wewe uwe mwakilishi wa watu
  rationale: Kiswahili cha moja kwa moja, ‘uwe kwa ajili ya watu,’ kingekuwa kisicho wazi; ‘mwakilishi’ huonyesha jukumu linalokusudiwa katika muktadha bila kuongeza fundisho maalumu.
- source_word: מוּל הָאֱלֹהִים
  choice: mbele za Mungu
  rationale: Ni tafsiri ya kawaida na yenye heshima ya מוּל katika uhusiano huu.
- source_word: וְהֵבֵאתָ
  choice: nawe uyapeleke
  rationale: Hufuatisha agizo la kwanza kwa agizo jingine kwa Kiswahili cha asili.
- source_word: הַדְּבָרִים
  choice: mambo yao
  rationale: דברים ni pana kuliko ‘kesi’; kiwakilishi ‘yao’ kinaonyesha kwa kawaida kuwa ni mambo ya watu yanayowasilishwa, huku tanbihi ikifafanua muktadha wa maamuzi.
- source_word: אֶל הָאֱלֹהִים
  choice: kwa Mungu
  rationale: Hueleza kwa kawaida katika Kiswahili mwelekeo wa kuyawasilisha mambo hayo kwa Mungu.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika simulizi hili
  choice: Mungu
  alternative: Mungu wa kweli
  rationale: Katika muktadha huu neno hilo humrejelea Mungu wa Israeli kwa maana ya umoja; hakuna haja ya kuongeza ‘wa kweli.’
- issue: Kiwango cha ufafanuzi wa jukumu la Musa kati ya watu na Mungu
  choice: uwe mwakilishi wa watu mbele za Mungu
  alternative: uwe kwa ajili ya watu mbele za Mungu
  rationale: Tafsiri mbadala inafuata muundo wa Kiebrania kwa karibu lakini si ya kawaida wala wazi katika Kiswahili. ‘Mwakilishi’ huwasilisha dhima ya sentensi bila kuingiza wazo la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa Kiebrania umehifadhiwa inapowezekana, lakini ‘mwakilishi’ umetumiwa ili kuepuka Kiswahili kisicho cha kawaida. Alama zote za tanbihi zimewekwa baada ya kishazi au neno linalohusika.
