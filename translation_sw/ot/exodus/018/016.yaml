base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/016.yaml
  text: When they have a matter[a], it comes to me, and I judge between a man and his neighbor[c][b], and I make known the statutes of God and his laws.
translation:
  language: sw
  text: Wanapokuwa na jambo[a], jambo hilo huja kwangu, nami huhukumu kati ya mtu na mwenzake[b], na ninawajulisha kanuni za Mungu na sheria zake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shauri.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kati ya mtu na mwenzake”; huu ni usemi wa umoja wenye maana wakilishi.'
    reason: cultural_note
  - marker: c
    text: Au, “maelekezo yake.” Neno la Kiebrania linaweza kumaanisha maelekezo kwa upana zaidi, ingawa hapa limetumiwa katika mazingira ya kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה לָהֶם דָּבָר
  choice: Wanapokuwa na jambo
  rationale: Katika muktadha huu כִּי ina maana ya wakati au kila mara hali hiyo inapotokea, na דָּבָר ni jambo linaloweza kuwa shauri la kisheria. Usemi huu ni wa kawaida na unadumisha upana wa neno la Kiebrania.
- source_word: בָּא אֵלַי
  choice: linanijia
  rationale: Kitenzi cha Kiebrania ni umoja, na kwa kawaida mada yake ni 'jambo'; kwa hiyo tafsiri inadumisha umoja na mwendo wa jambo kuletwa mbele ya Musa.
- source_word: וְשָׁפַטְתִּי
  choice: nami huhukumu
  rationale: Mzizi שׁפט hapa unahusu kutekeleza hukumu katika mgogoro. Hali ya mazoea inayotokana na muktadha imewasilishwa kwa 'huhukumu'.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: kati ya mtu na mwenzake
  rationale: Huu ni usemi wa umoja wenye maana wakilishi. 'Mtu na mwenzake' ni Kiswahili cha kawaida kinachodumisha muundo huo bila kuufanya kuwa mgogoro wa aina maalumu.
- source_word: וְהוֹדַעְתִּי
  choice: na kuwajulisha
  rationale: Hifili ya ידע ina maana ya kusababisha watu wajue. 'Kuwajulisha' ni ya asili katika Kiswahili na inaonyesha walengwa wanaopokea maarifa hayo.
- source_word: חֻקֵּי הָאֱלֹהִים
  choice: masharti ya Mungu
  rationale: חֻקִּים ni maagizo yaliyowekwa au masharti yenye mamlaka. 'Masharti' ni wazi katika mazingira ya maamuzi ya kisheria na yanatofautishwa kwa kiasi na תּוֹרֹתָיו.
- source_word: תּוֹרֹתָיו
  choice: sheria zake
  rationale: Ingawa תּוֹרָה linaweza kumaanisha mafundisho au maelekezo kwa upana, wingi wake hapa sambamba na masharti na katika muktadha wa kuhukumu unaunga mkono 'sheria zake'.
theological_decisions:
- issue: Usemi wa umoja wa kiume katika אִישׁ ... רֵעֵהוּ
  choice: mtu na mwenzake
  alternative: mwanaume na jirani yake
  rationale: Katika kifungu hiki umoja huo ni usemi wakilishi wa wahusika katika shauri. Kiswahili 'mtu na mwenzake' hudumisha umoja na uhusiano wa pande mbili bila kudai kwamba wahusika lazima wawe wanaume.
- issue: Maana ya תּוֹרֹתָיו katika mazingira ya kisheria
  choice: sheria zake
  alternative: maelekezo yake
  rationale: Muktadha wa kuhukumu pamoja na ulinganifu na חֻקֵּי unaonyesha nguvu ya kikanuni, ingawa tanbihi inadumisha maana pana ya 'maelekezo'.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa mazoea umetumiwa kwa sababu Musa anaeleza utaratibu wake wa kawaida. Alama zote za tanbihi zimewekwa mara moja katika matini kuu na kwa mpangilio unaolingana.
