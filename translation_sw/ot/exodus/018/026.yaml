translation:
  language: sw
  text: Nao walikuwa wakiwahukumu watu wakati wote. Kila jambo gumu walikuwa wakimletea Musa[a], lakini kila jambo dogo wao wenyewe walikuwa wakilihukumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila kesi ngumu ... kila kesi ndogo.” Kiebrania kinatofautisha kesi ngumu na kesi ndogo katika muktadha wa hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: waliwahukumu
  rationale: Qal ya שׁפט inaeleza kazi yao ya kawaida ya kutoa hukumu; wakati uliopita unafaa muhtasari huu wa kisimulizi.
- source_word: הָעָם
  choice: watu
  rationale: עם hapa ni jumuiya ya Israeli kwa ujumla; 'watu' ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: בְּכָל עֵת
  choice: nyakati zote
  rationale: Kirai hiki huonyesha kuwa walikuwa tayari kuhukumu kwa ukawaida wakati wowote, si tukio moja tu.
- source_word: הַדָּבָר הַקָּשֶׁה
  choice: kila jambo gumu
  rationale: דבר katika muktadha wa kimahakama ni jambo au kesi ya kuamuliwa; umoja wenye kiainishi unatumiwa kwa maana ya kila jambo la aina hiyo.
- source_word: יְבִיאוּן אֶל מֹשֶׁה
  choice: walimletea Musa
  rationale: Umbo hili linaeleza tendo lililorudiwa kwa desturi; Kiswahili cha wakati uliopita katika muktadha huu kinaweza kubeba maana hiyo ya mazoea.
- source_word: כָל הַדָּבָר הַקָּטֹן
  choice: kila jambo dogo
  rationale: קטן inakinzana moja kwa moja na קשה na kuonyesha mambo madogo au rahisi zaidi; 'jambo dogo' huhifadhi tofauti hiyo ya kileksia.
- source_word: יִשְׁפּוּטוּ הֵם
  choice: walilihukumu wao wenyewe
  rationale: Kiwakilishi huru הם kina mkazo; 'wao wenyewe' huhifadhi msisitizo kwamba waamuzi hao ndio walioamua mambo madogo, si Musa.
