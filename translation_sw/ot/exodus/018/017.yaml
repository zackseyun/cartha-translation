  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Kiambishi cha mfuatano wa simulizi וַ־ pamoja na kitenzi cha kusema na kirai אֵלָיו vinaelezwa kwa kawaida kwa Kiswahili kama “akamwambia,” hivyo kuendeleza simulizi na kuonyesha anayeelekezewa maneno.
- source_word: חֹתֵן מֹשֶׁה
  choice: mkwewe Musa
  rationale: Muundo huu unamaanisha mkwe wa Musa. “Mkwewe Musa” ni usemi wa kawaida wa Kiswahili unaohifadhi uhusiano huo bila kurudia jina la Yethro lisilokuwapo katika mstari huu.
- source_word: לֹא טוֹב
  choice: si jema
  rationale: טוֹב ina maana pana ya kuwa njema, nzuri, au yenye manufaa. “Si jema” huhifadhi tathmini ya moja kwa moja bila kuifafanua kupita kiasi.
- source_word: הַדָּבָר אֲשֶׁר אַתָּה עֹשֶׂה
  choice: Jambo unalofanya
  rationale: “Jambo” huakisi nomino הַדָּבָר, na “unalofanya” huonyesha tendo la Musa linaloendelea kama inavyodokezwa na participle עֹשֶׂה.
