translation:
  language: sw
  text: Basi Musa akasikiliza sauti ya baba mkwe wake, akafanya yote aliyosema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Musa alimtii baba mkwe wake.” Nahau ya Kiebrania inaweza kumaanisha kusikiliza kwa kuitikia kwa utii, kama kishazi kinachofuata kinavyoweka wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: akaisikiliza
  rationale: Kitenzi שׁמע pamoja na לְקוֹל kina maana ya kumsikiliza au kumtii mtu. ‘Akaiskiliza’ kinahifadhi taswira ya kusikia, huku kishazi kinachofuata kikionyesha wazi kwamba Musa alitenda kwa kuitikia.
- source_word: לְקוֹל
  choice: sauti ya
  rationale: קוֹל maana yake ya msingi ni ‘sauti.’ Usemi ‘kuisikiliza sauti ya’ unahifadhi nahau ya Kiebrania na unaeleweka katika Kiswahili, ingawa hapa unadokeza pia kufuata shauri.
- source_word: חֹתְנוֹ
  choice: mkwe wake
  rationale: Katika muktadha huu neno linamtaja Yethro, baba mkwe wa Musa. ‘Mkwe wake’ ni tafsiri fupi na ya kawaida ya uhusiano huo; muktadha mpana humtambulisha wazi.
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: עשה ni kitenzi cha kawaida chenye maana ya ‘kufanya’; tafsiri hii ni ya moja kwa moja na inaendana na kishazi kinachofuata.
- source_word: כֹּל אֲשֶׁר אָמָר
  choice: yote aliyosema
  rationale: Kishazi hiki kinamaanisha moja kwa moja ‘yote aliyosema,’ bila kuongezea maana ya wakati au yambwa ambayo haijaelezwa wazi katika Kiebrania.
