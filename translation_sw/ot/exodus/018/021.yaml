  text: וְ/אַתָּ֣ה תֶחֱזֶ֣ה מִ/כָּל הָ֠/עָם אַנְשֵׁי חַ֜יִל יִרְאֵ֧י אֱלֹהִ֛ים אַנְשֵׁ֥י אֱמֶ֖ת שֹׂ֣נְאֵי בָ֑צַע וְ/שַׂמְתָּ֣ עֲלֵ/הֶ֗ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/021.yaml
  text: But you shall select from all the people able men[a], those who fear God, men of truth, hating dishonest gain; and you shall appoint them over them as chiefs of thousands, chiefs of hundreds, chiefs of fifties[c][b], and chiefs of tens.
translation:
  language: sw
  text: Lakini wewe uchague kutoka miongoni mwa watu wote wanaume wenye uwezo[a], wanaomcha Mungu, wanaume waaminifu[b], wanaochukia faida isiyo ya haki[c]; na uwaweke juu ya watu wawe wakuu wa maelfu, wakuu wa mamia, wakuu wa hamsini, na wakuu wa makumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaume hodari” au “wanaume mashujaa.” Neno la Kiebrania linaweza kumaanisha nguvu, uwezo, ustadi, au ushujaa kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri halisi zaidi, “wanaume wa kweli”; yaani, watu wanaosema kweli na wanaotegemeka.
    reason: lexical_alternative
  - marker: c
    text: Au, “faida ya udanganyifu” au “faida ya dhuluma”; usemi huu unahusu kukataa mapato ya kifisadi au yanayopatikana kwa njia isiyo halali.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶחֱזֶה
  choice: utateua
  rationale: Ingawa kitenzi hiki kimsingi huhusiana na kuona au kutazama, katika muktadha huu kinamaanisha kutambua kwa makini na kuchagua watu wenye sifa zinazotakiwa.
- source_word: אַנְשֵׁי חַיִל
  choice: wanaume wenye uwezo
  rationale: חַיִל inaweza kumaanisha nguvu, ushujaa, ustadi, au uwezo. Katika muktadha huu wa uongozi na utoaji wa hukumu, uwezo ndio maana inayofaa zaidi, huku jinsia ya kiume ya Kiebrania ikihifadhiwa.
- source_word: יִרְאֵי אֱלֹהִים
  choice: wanaomcha Mungu
  rationale: Hii inaeleza kumheshimu Mungu kwa kicho kama sifa ya kimaadili; usemi huu ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: אַנְשֵׁי אֱמֶת
  choice: wanaume waaminifu
  rationale: Ingawa muundo halisi ni ‘wanaume wa kweli/ukweli,’ אֱמֶת hapa inahusu uaminifu, kutegemeka, na kusema kweli. ‘Waaminifu’ ni Kiswahili cha kawaida kinachobeba maana hiyo.
- source_word: שֹׂנְאֵי בָצַע
  choice: wanaochukia faida ya udanganyifu
  rationale: בָצַע hapa ni faida inayopatikana kwa njia isiyo ya haki au ya kifisadi. Tafsiri hii haifungi maana kwenye rushwa pekee.
- source_word: וְשַׂמְתָּ עֲלֵהֶם
  choice: Uwaweke juu ya watu
  rationale: Inahifadhi wazo la kuwapa mamlaka juu ya watu, lakini inaweka wazi kiwakilishi ambacho kingekuwa tata au kisicho cha kawaida katika Kiswahili.
- source_word: שָׂרֵי
  choice: wakuu wa
  rationale: ‘Wakuu’ linafaa kwa viongozi au maofisa wa ngazi mbalimbali bila kuingiza maana ya kijeshi isiyolazimishwa na muktadha.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: maelfu ... mamia ... hamsini ... makumi
  rationale: Hizi ni ngazi za vikundi vya usimamizi; muundo mfupi ‘wakuu wa’ unaakisi moja kwa moja mpangilio wa Kiebrania.
theological_decisions:
- issue: Lugha ya kijinsia katika sifa za viongozi
  choice: wanaume wenye uwezo ... wanaume waaminifu
  alternative: watu wenye uwezo ... watu waaminifu
  rationale: Kiebrania kinatumia miundo ya wazi ya wingi wa kiume. Tafsiri inaihifadhi bila kutoa hitimisho pana la kimafundisho kuliko linalosemwa na mstari.
- issue: Maana ya kumcha Mungu
  choice: wanaomcha Mungu
  alternative: wanaomheshimu Mungu
  rationale: ‘Kumcha Mungu’ huhifadhi uzito na mvutano wa usemi wa chanzo—kicho, heshima, na uwajibikaji wa kimaadili—badala ya kuupunguza kuwa heshima pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa katika sehemu mbili ili isomeke kwa urahisi, huku mfuatano wa sifa na ngazi nne za uongozi ukihifadhiwa. Alama zote za tanbihi [a], [b], na [c] zimewekwa moja kwa moja baada ya maneno yanayohusika.
