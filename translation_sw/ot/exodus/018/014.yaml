  text: וַ/יַּרְא֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵ֛ת כָּל אֲשֶׁר ה֥וּא עֹשֶׂ֖ה לָ/עָ֑ם וַ/יֹּ֗אמֶר מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ אֲשֶׁ֨ר אַתָּ֤ה עֹשֶׂה֙ לָ/עָ֔ם מַדּ֗וּעַ אַתָּ֤ה יוֹשֵׁב֙ לְ/בַדֶּ֔/ךָ וְ/כָל הָ/עָ֛ם נִצָּ֥ב עָלֶ֖י/ךָ מִן בֹּ֥קֶר עַד עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/014.yaml
  text: When Moses's father-in-law saw all that he was doing for the people[a], he said, “What is this thing that you are doing for the people? Why do you sit alone[b], while all the people stand before you from morning until evening?”
translation:
  language: sw
  text: Baba mkwe wa Musa alipoona yote aliyokuwa akifanya kwa ajili ya watu, akasema, “Ni jambo gani hili unalofanya kwa ajili ya watu? Kwa nini umeketi peke yako, huku watu wote wamesimama mbele yako[a] tangu asubuhi mpaka jioni?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “wamesimama juu yako”; hapa kirai hiki humaanisha kusimama mbele ya Musa, yaelekea kwa ajili ya hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  choice: Baba mkwe wa Musa
  rationale: חֹתֵן humaanisha ndugu wa upande wa ndoa; katika muktadha huu ni baba mkwe wa Musa. Kauli hii ni ya kawaida na wazi katika Kiswahili.
- source_word: וַיַּרְא
  choice: alipoona
  rationale: ראה ni kitenzi cha kawaida cha kuona. Muundo wa “alipoona” unaunganisha tendo hili kwa kawaida na kauli iliyofuata.
- source_word: אֵת כָּל אֲשֶׁר הוּא עֹשֶׂה
  choice: yote aliyokuwa akifanya
  rationale: כָּל אֲשֶׁר huonyesha ujumla, na umbo la participle linaonyesha shughuli iliyokuwa ikiendelea.
- source_word: לָעָם
  choice: kwa ajili ya watu
  rationale: ל hapa inaeleweka kuwa Musa alikuwa akitenda kwa manufaa au kwa niaba ya watu, si kwamba alikuwa tu akiwatendea jambo.
- source_word: מָה הַדָּבָר הַזֶּה
  choice: Ni jambo gani hili
  rationale: דָּבָר hapa ni “jambo” au “hali.” “Jambo” ni la kawaida katika Kiswahili na linadumisha swali la Yethro kuhusu utaratibu aliouona.
- source_word: אַתָּה יוֹשֵׁב לְבַדֶּךָ
  choice: umeketi peke yako
  rationale: ישב inaweza kumaanisha kuketi katika kikao cha kutoa hukumu. Tafsiri hii inadumisha maana ya kimwili na ya kiutendaji bila kuiongeza waziwazi katika matini.
- source_word: וְכָל הָעָם נִצָּב עָלֶיךָ
  choice: huku watu wote wamesimama mbele yako
  rationale: נצב ni “kusimama,” na עַל hapa inaonyesha kusimama mbele ya mwenye mamlaka ili kuhudumiwa. “Mbele yako” ni Kiswahili cha asili katika mazingira haya; maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: מִן בֹּקֶר עַד עָרֶב
  choice: tangu asubuhi mpaka jioni
  rationale: Kirai hiki kinaonyesha muda wote kuanzia asubuhi hadi jioni. Huu ni usemi wa kawaida na wazi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inafuata mtiririko wa simulizi la Kiebrania huku ikitumia miundo ya kawaida ya Kiswahili. “Kwa ajili ya watu” inadumishwa katika sehemu zote mbili kwa uthabiti, na istilahi mahsusi ya hukumu haijaingizwa katika matini kwa kuwa haikutajwa wazi katika mstari huu.
