  text: וַ/יְסַפֵּ֤ר מֹשֶׁה֙ לְ/חֹ֣תְנ֔/וֹ אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/פַרְעֹ֣ה וּ/לְ/מִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כָּל הַ/תְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַ/ם בַּ/דֶּ֔רֶךְ וַ/יַּצִּלֵ֖/ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/008.yaml
  text: Moses told his father-in-law all that Yahweh had done to Pharaoh and to Egypt for Israel’s sake[a], all the hardship that had come upon them on the way[b], and how Yahweh had delivered them.
translation:
  language: sw
  text: Musa akamsimulia baba mkwe wake yote ambayo Yahweh alikuwa amewafanyia Farao na Wamisri kwa ajili ya Israeli[a], taabu yote iliyowapata njiani[b], na jinsi Yahweh alivyowaokoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa sababu ya Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “shida yote” au “dhiki yote” iliyowapata safarini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: akamsimulia
  rationale: Kitenzi cha Kiebrania katika piel humaanisha kusimulia au kueleza kwa undani; “akamsimulia” ni cha asili katika Kiswahili na hudumisha wazo la kutoa taarifa ya matukio.
- source_word: חֹתְנוֹ
  choice: mkwe wake
  rationale: Katika muktadha neno hili linamtaja Yethro, baba mkwe wa Musa. “Mkwe wake” ni usemi wa kawaida wa Kiswahili, ingawa hauonyeshi peke yake upande mahususi wa uhusiano.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה יְהוָה לְפַרְעֹה וּלְמִצְרַיִם
  choice: yote ambayo Yahweh alikuwa amemtendea Farao na Misri
  rationale: Muundo huu unaonyesha matendo ya Yahweh yaliyowahusu Farao na Misri. “Aliyokuwa amewatendea” ingekuwa na tatizo la upatanisho kwa kuwa Farao ni mtu na Misri ni nchi; muundo ulioteuliwa ni wa kawaida, huku “Misri” ikieleweka kimuktadha kuwa nchi na watu wake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: עַל אֹדוֹת יִשְׂרָאֵל
  choice: kwa ajili ya Israeli
  rationale: Usemi huu unaweza kuonyesha sababu au jambo linalohusika; “kwa ajili ya Israeli” ni wa asili na unaonyesha kwamba matendo hayo yalifanywa kwa manufaa ya Israeli bila kufuta uwezekano wa maana ya “kwa sababu ya Israeli.”
- source_word: הַתְּלָאָה
  choice: taabu
  rationale: Nomino hii humaanisha shida, taabu, au dhiki inayopatikana katika hali ngumu. “Taabu” ni neno la kawaida, lenye uzito unaofaa, na linaweza kutumiwa kwa maana ya jumla baada ya “yote.”
- source_word: מְצָאָתַם
  choice: iliyowapata
  rationale: Kiebrania husema kihalisi kwamba taabu ‘iliwapata.’ Kiswahili “iliyowapata” ni cha asili na huhifadhi taswira hiyo kwa karibu.
- source_word: בַּדֶּרֶךְ
  choice: njiani
  rationale: Neno hili linahusu safari ya Israeli baada ya kutoka Misri; “njiani” ni fupi, la kawaida, na haliongezi maelezo yasiyokuwapo.
- source_word: וַיַּצִּלֵם
  choice: alivyowaokoa
  rationale: Kitenzi נצל humaanisha kuokoa au kukomboa kutoka hatarini. “Kuwaokoa” ni cha kawaida katika Kiswahili na hapa hurejelea wazi kuondolewa katika hatari, bila kulazimisha maana nyingine ya kiteolojia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo kama “BWANA.”
- issue: Maana ya עַל אֹדוֹת יִשְׂרָאֵל
  choice: kwa ajili ya Israeli
  alternative: kwa sababu ya Israeli
  rationale: Usemi wa Kiebrania unaruhusu wazo la kufanya jambo kwa manufaa ya Israeli au kwa sababu yao. Tafsiri kuu inasomeka kwa kawaida, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa sasa lakini wenye heshima. “Mkwe wake” limetumiwa kwa urahisi wa kawaida; muktadha unaonyesha kwamba ni baba mkwe wa Musa. Alama zote za tanbihi [a] na [b] zimo katika matini kuu.
