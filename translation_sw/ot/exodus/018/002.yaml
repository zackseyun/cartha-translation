base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/002.yaml
  text: Jethro[a], Moses’ father-in-law, took Zipporah, Moses’ wife, after he had sent her away.
translation:
  language: sw
  text: Yethro, baba mkwe wa Musa, akamchukua Sipora, mke wa Musa, baada ya kutumwa kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya Musa kumtuma aende.” Kiebrania kinasema kihalisi “baada ya kutumwa kwake,” bila kumtaja wazi mtendaji.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akamchukua
  rationale: Kitenzi לקח kwa kawaida humaanisha ‘kuchukua.’ ‘Akamchukua’ ni cha moja kwa moja na hakifafanui kupita kiasi ikiwa Yethro alimpokea au alienda naye.
- source_word: חֹתֵן מֹשֶׁה
  choice: baba mkwe wa Musa
  rationale: חֹתֵן hapa humtambulisha Yethro kuwa baba wa mke wa Musa; ‘baba mkwe’ ni lugha ya kawaida na iliyo wazi katika Kiswahili sanifu.
- source_word: צִפֹּרָה
  choice: Sipora
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֵשֶׁת מֹשֶׁה
  choice: mke wa Musa
  rationale: Kirai cha Kiebrania kinamtambulisha Sipora moja kwa moja kuwa mke wa Musa; umbo hili ni la kawaida katika Kiswahili.
- source_word: אַחַר
  choice: baada ya
  rationale: Kiunganishi hiki kinaonyesha mfuatano wa wakati.
- source_word: שִׁלּוּחֶיהָ
  choice: Musa kumrudisha kwao
  rationale: Nomino yenye kiambishi cha nafsi ya kike ina maana halisi ya ‘kuondolewa/kutumwa kwake’ bila kutaja mtendaji. Muktadha unaashiria Musa, na ‘kumrudisha kwao’ huwasilisha kwa Kiswahili cha kawaida kuondoka kwake kwenda kwa baba yake bila kudokeza kwa lazima talaka au kufukuzwa.
theological_decisions:
- issue: Mtendaji asiyetajwa katika שִׁלּוּחֶיהָ (‘kutumwa/kuondolewa kwake’)
  choice: 'Musa ametajwa katika matini kama mtendaji: ‘baada ya Musa kumrudisha kwao.’'
  alternative: ‘baada ya yeye kurudishwa kwao’ au ‘baada ya kuondolewa kwake’
  rationale: Kiebrania hakimtaji mtendaji waziwazi, lakini muktadha humfanya Musa kuwa mtendaji anayeelekea zaidi. Tanbihi huhifadhi uwezekano wa usomaji usiomtaja mtendaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Baba mkwe’ na ‘kumrudisha kwao’ vinaeleweka kwa urahisi; tanbihi inalinda utata halisi wa Kiebrania kuhusu mtendaji.
