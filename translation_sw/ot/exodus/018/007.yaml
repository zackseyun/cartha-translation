base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/007.yaml
  text: Moses went out to meet his father-in-law[a], bowed down, and kissed him. Then each asked the other about his welfare, and they went into the tent.
translation:
  language: sw
  text: Musa akatoka kumlaki baba-mkwe wake, akainama mbele yake, akambusu. Kisha wakaulizana hali zao,[a] wakaingia hemani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “kila mmoja alimuuliza mwenzake kuhusu amani.” Nahau hii ya Kiebrania humaanisha kuuliza kuhusu hali au ustawi wa mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרַאת
  choice: kwenda kumlaki
  rationale: Pamoja na kitenzi ‘akatoka,’ neno hili linaonyesha kutoka kwenda kumpokea mtu anayewasili; ‘kumlaki’ ni Kiswahili cha kawaida na chenye heshima katika muktadha huu.
- source_word: חֹתְנוֹ
  choice: mkwe wake
  rationale: Katika Kutoka 18, neno hili humtaja Yethro kwa uhusiano wake na Musa. Kiswahili ‘mkwe wake’ ni sahihi na cha asili, ingawa hakibainishi jinsia bila muktadha.
- source_word: וַיִּשְׁתַּחוּ
  choice: akainama mbele yake
  rationale: Huhifadhi tendo la kuinama kwa heshima bila kulifasiri kuwa ibada; muktadha ni wa salamu kwa mkwe wake.
- source_word: וַיִּשַּׁק לוֹ
  choice: akambusu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya busu la kusalimiana linalotajwa hapa.
- source_word: וַיִּשְׁאֲלוּ אִישׁ לְרֵעֵהוּ לְשָׁלוֹם
  choice: wakaulizana hali zao
  rationale: Nahau ya Kiebrania ya kuuliza ‘kwa ajili ya amani’ humaanisha kuuliza kuhusu hali au ustawi wa mwingine. ‘Wakaulizana’ huhifadhi maana ya kila mmoja kumuuliza mwenzake.
- source_word: הָאֹהֱלָה
  choice: wakaingia hemani
  rationale: Kiishio cha mwelekeo kinaonyesha mwendo wa kuingia ndani ya hema. Tafsiri haiongezi ‘hema la Musa,’ kwa kuwa Kiebrania hakisemi hivyo wazi.
theological_decisions:
- issue: Maana ya Musa kuinama mbele ya Yethro
  choice: tendo la heshima kwa mtu
  alternative: tendo la ibada
  rationale: Kitenzi hiki kinaweza kutumiwa kuhusu ibada katika miktadha mingine, lakini hapa mlengwa ni mwanadamu na tendo hilo limo katika mfululizo wa salamu. ‘Akainama mbele yake’ huhifadhi tendo lenyewe bila kuingiza dai la kiibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kumlaki’ linafaa kwa kumpokea anayewasili; ‘wakaulizana hali zao’ ni la kawaida na linafikisha nahau ya Kiebrania bila tafsiri ngumu ya neno kwa neno.
