id: EXO.18.1
reference: Exodus 18:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְ/מֹשֶׁ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּ֑/וֹ כִּֽי הוֹצִ֧יא יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/001.yaml
  text: Jethro[a], the priest of Midian, Moses’ father-in-law, heard all that God had done for Moses and for Israel his people, that Yahweh had brought Israel out of Egypt.
translation:
  language: sw
  text: Yethro, kuhani wa Midiani na baba mkwe wa Musa, alisikia yote Mungu aliyowatendea Musa na Israeli, watu wake[a], kwamba Yahwe aliwatoa Israeli kutoka Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Israeli, watu wa Musa.” Kisarufi, kiwakilishi katika “watu wake” kinaweza kumrejelea Musa, ingawa katika muktadha kina uwezekano mkubwa zaidi wa kumrejelea Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: alisikia
  rationale: Waw-consecutive inaendeleza simulizi; Kiswahili cha kawaida hakihitaji kuongeza kiashiria cha wakati kama “basi” au “wakati huo” hapa.
- source_word: כֹהֵן מִדְיָן
  choice: kuhani wa Midiani
  rationale: Muundo huu unamtambulisha Yethro kwa wadhifa wake na uhusiano wake na Midiani.
- source_word: חֹתֵן מֹשֶׁה
  choice: baba mkwe wa Musa
  rationale: Katika muktadha huu neno hili linamtaja baba ya mke wa Musa; “baba mkwe” ni sahihi zaidi kuliko “mkwe” peke yake.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה אֱלֹהִים
  choice: yote ambayo Mungu alikuwa amewatendea
  rationale: “Yote ambayo” huhifadhi maana ya jumla ya כָּל אֲשֶׁר, na wakati timilifu huonyesha matendo yaliyotangulia kusikiwa kwa habari hiyo.
- source_word: לְמֹשֶׁה וּלְיִשְׂרָאֵל
  choice: Musa na Israeli
  rationale: Kiambishi ל kinaonyesha matendo yaliyofanywa kwa ajili au kwa manufaa yao; kitenzi “kuwatendea” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: Kiwakilishi cha nafsi ya tatu ya kiume kimehifadhiwa bila kutaja wazi mwenye watu hao, ili kutofuta uwezekano wa kisarufi uliomo katika Kiebrania.
- source_word: כִּי
  choice: ya kwamba
  rationale: Hapa כִּי kinaanzisha maelezo ya jambo alilosikia Yethro, si sababu pekee.
- source_word: הוֹצִיא
  choice: alikuwa amewatoa
  rationale: Hiphil ya יצא humaanisha kusababisha watoke au kuwatoa; wakati timilifu unaonyesha tukio lililotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: מִמִּצְרָיִם
  choice: kutoka Misri
  rationale: Hii huonyesha mwendo wa kutoka ndani ya nchi ya Misri kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kirejelewa cha kiwakilishi katika עַמּוֹ
  choice: “Israeli, watu wake” linaeleweka kwa uwezekano mkubwa kuwa Israeli ni watu wa Mungu
  alternative: Kisarufi linaweza pia kueleweka kuwa Israeli ni watu wa Musa
  rationale: Mungu ndiye kirejelewa kinachofaa zaidi kimuktadha, na kishazi kinachofuata kinamtaja Yahwe kuwa mkombozi wa Israeli. Hata hivyo, matini kuu haiongezi “wa Mungu,” hivyo utata halisi wa kisarufi umehifadhiwa na kufafanuliwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Baba mkwe” limetumiwa kwa usahihi wa uhusiano, na “Yahwe” huhifadhi jina la Mungu. Muundo wa “Israeli, watu wake” umeachwa wazi kwa kiasi kinachowezekana ili kuhifadhi utata wa Kiebrania.
