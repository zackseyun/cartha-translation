base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/009.yaml
  text: Jethro rejoiced over all the good that Yahweh had done for Israel[b][a], whom he had delivered from the hand of Egypt.
translation:
  language: sw
  text: Yethro akafurahia mema yote ambayo Yahwe alikuwa amewatendea Israeli—taifa ambalo alikuwa ameliokoa kutoka mkononi mwa Misri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka mkononi mwa Misri”; nahau inayomaanisha kutoka katika mamlaka au nguvu ya Misri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַדְּ
  choice: akafurahia
  rationale: Kitenzi hiki huonyesha kufurahi au kushangilia. “Akafurahia” ni Kiswahili cha kawaida kinachoeleza mwitikio chanya wa Yethro bila kuzidisha kiwango cha hisia.
- source_word: יִתְרוֹ
  choice: Yethro
  rationale: Jina limetoholewa kwa tahajia inayofaa Kiswahili na inayokaribia umbo la Kiebrania.
- source_word: עַל כָּל הַטּוֹבָה
  choice: mema yote
  rationale: Nomino ya umoja ya Kiebrania imetumiwa kwa maana ya kijumla. “Mema yote” ni ya asili katika Kiswahili na huhifadhi wazo la jumla la mema aliyotenda Yahwe.
- source_word: אֲשֶׁר עָשָׂה יְהוָה לְיִשְׂרָאֵל
  choice: ambayo Yahwe alikuwa amewatendea Israeli
  rationale: Wakati timilifu “alikuwa amewatendea” unaonyesha kwamba matendo hayo yalitangulia furaha ya Yethro. Kiambishi cha wingi “-wa-” humchukulia Israeli hapa kuwa taifa lenye watu wengi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: אֲשֶׁר הִצִּילוֹ
  choice: kwa kuwa alikuwa amemwokoa
  rationale: Kishazi hiki kinaweza kueleweka kuwa kinaeleza sababu ya mema yaliyotajwa. Kiambishi cha umoja “-mw-” huhifadhi namna Kiebrania kinavyomtazama Israeli kama jumuiya moja.
- source_word: מִיַּד מִצְרָיִם
  choice: kutoka mkononi mwa Misri
  rationale: Huhifadhi sitiari ya Kiebrania ya “mkono,” ambayo hapa humaanisha mamlaka au nguvu ya Misri.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu; kulitohowa kama “Yahwe” hulihifadhi badala ya kuliweka kwa cheo.
- issue: Kiambishi cha umoja katika הִצִּילוֹ kinamrejelea nani na אֲשֶׁר ina kazi gani?
  choice: Israeli kama jumuiya moja; “kwa kuwa alikuwa amemwokoa”
  alternative: 'Kishazi rejeshi: “Israeli, ambaye alikuwa amemwokoa”'
  rationale: Kiebrania kina kiambishi cha umoja kinachoweza kumrejelea Israeli kama taifa moja, na אֲשֶׁר hapa inaweza kuwa na maana ya sababu. Tafsiri ya sababu ni ya asili zaidi katika Kiswahili huku ikidumisha uhusiano na wema alioufanya Yahwe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa masimulizi ya Biblia lakini si wa kizamani; sitiari ya “mkono wa Misri” imehifadhiwa na kufafanuliwa katika tanbihi.
