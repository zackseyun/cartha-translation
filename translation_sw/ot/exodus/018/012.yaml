id: EXO.18.12
reference: Exodus 18:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּ/זְבָחִ֖ים לֵֽ/אלֹהִ֑ים וַ/יָּבֹ֨א אַהֲרֹ֜ן וְ/כֹ֣ל זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶ/אֱכָל לֶ֛חֶם עִם חֹתֵ֥ן מֹשֶׁ֖ה לִ/פְנֵ֥י הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/012.yaml
  text: Then Jethro[a], Moses’ father-in-law, took a burnt offering and sacrifices for God, and Aaron and all the elders of Israel came to eat bread with Moses’ father-in-law before God.
translation:
  language: sw
  text: Ndipo Yethro, baba mkwe wa Musa, akachukua sadaka ya kuteketezwa na dhabihu kwa ajili ya Mungu. Aroni na wazee wote wa Israeli wakaja kula mkate[a] pamoja na baba mkwe wa Musa mbele za Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kula mkate”; huu ni usemi unaoweza kumaanisha “kushiriki mlo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Kitenzi לקח kimsingi humaanisha ‘kuchukua.’ Muktadha unaonyesha kuwa vitu vilivyochukuliwa vilikuwa matoleo ya dhabihu, hivyo tafsiri haiongezi wazo la ‘kutoa’ lisilotajwa moja kwa moja na kitenzi.
- source_word: חֹתֵן מֹשֶׁה
  choice: baba mkwe wa Musa
  rationale: Katika simulizi hili חֹתֵן humtaja Yethro kwa uhusiano wake na Musa; ‘baba mkwe’ ni wazi na sahihi kuliko neno pana ‘mkwe.’
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi ya kawaida ya dhabihu iliyoteketezwa yote. Usemi huu unaeleweka katika Kiswahili cha sasa na kuhifadhi maana ya aina hiyo maalumu ya sadaka.
- source_word: זְבָחִים
  choice: dhabihu
  rationale: זְבָחִים ni wingi unaotaja dhabihu kwa upana, tofauti na sadaka maalumu ya kuteketezwa. Katika Kiswahili ‘dhabihu’ linaweza kutumika kwa maana ya jumla au wingi kulingana na muktadha.
- source_word: לֵאלֹהִים
  choice: kwa ajili ya Mungu
  rationale: Kihusishi ל hapa kinaonyesha kuwa matoleo hayo yalielekezwa au kuwekwa wakfu kwa Mungu; ‘kwa ajili ya Mungu’ ni usemi wa kawaida wa Kiswahili bila kuongeza tendo lisilotajwa.
- source_word: וַיָּבֹא אַהֲרֹן וְכָל זִקְנֵי יִשְׂרָאֵל
  choice: Aroni na wazee wote wa Israeli wakaja
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umoja kabla ya kiima kilichounganishwa, Kiswahili kwa kawaida hutumia upatanisho wa wingi kwa Aroni na wazee wote.
- source_word: לֶאֱכָל לֶחֶם
  choice: kula mkate
  rationale: Hii ndiyo tafsiri ya karibu ya maneno ya Kiebrania. Kwa kuwa usemi unaweza pia kumaanisha kushiriki mlo, maana hiyo ya kinahau imeelezwa katika tanbihi badala ya kubadilisha taswira ya matini kuu.
- source_word: עִם חֹתֵן מֹשֶׁה
  choice: pamoja na baba mkwe wa Musa
  rationale: Kiebrania kinarudia cheo cha uhusiano badala ya jina Yethro; tafsiri inahifadhi urudiaji huo.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: mbele za Mungu
  rationale: Usemi huu wa kawaida unawasilisha maana ya kuwa mbele au katika uwepo wa Mungu na kuhifadhi uzito wa mazingira ya ibada.
theological_decisions:
- issue: Maana ya kula mkate katika muktadha wa dhabihu
  choice: Matini kuu inadumisha usemi ‘kula mkate,’ huku muktadha ukiruhusu kueleweka kuwa walishiriki mlo unaohusiana na dhabihu mbele za Mungu.
  alternative: Kutafsiri moja kwa moja kuwa walikula mlo wa kawaida pamoja, au kutaja wazi kuwa ulikuwa mlo wa agano.
  rationale: Dhabihu, ushiriki wa Aroni na wazee, na maneno ‘mbele za Mungu’ yanaonyesha mazingira matakatifu; hata hivyo, mstari wenyewe hauuiti wazi ‘mlo wa agano.’ Tafsiri na tanbihi zinahifadhi maana pana na mvutano huo bila kuufafanua kupita matini.
- issue: Mrejelewa wa אֱלֹהִים
  choice: Mungu
  alternative: miungu
  rationale: Muktadha wa simulizi unamrejelea Mungu wa Israeli kwa umoja; ‘Mungu’ ndiyo maana inayodaiwa na muktadha bila kuingiza wingi wa miungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Baba mkwe’ imetumiwa kwa usahihi wa uhusiano; ‘mbele za Mungu’ inadumisha mtindo wa kibiblia unaoeleweka. Alama ya tanbihi imewekwa baada ya ‘kula mkate,’ yaani mahali inapohusika.
