base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/023.yaml
  text: If you do this thing[a], and God so commands you, then you will be able to endure[d][c][b], and all this people also will go to their place in peace.
translation:
  language: sw
  text: Kama utafanya jambo hili[a], na Mungu akikuamuru hivyo, utaweza kustahimili[b], na watu hawa wote pia watafika mahali pao kwa amani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shauri hili” au “mpango huu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kusimama”; hapa maana yake ni kustahimili au kuhimili mzigo.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania hutumia nomino ya umoja wa mkusanyiko kwa “watu” na kiambishi cha umoja katika “mahali pake.” Maana yake yaweza kuwa kwamba kila mmoja atarudi mahali pake kwa amani.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Hutanguliza sharti kwa njia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: דָּבָר hapa ni jambo au mpango uliopendekezwa; “jambo hili” ni la asili na linabaki karibu na muundo wa Kiebrania.
- source_word: תַּעֲשֶׂה
  choice: utafanya
  rationale: Kauli ya wakati ujao baada ya “kama” huwasilisha sharti kwa Kiswahili cha kawaida.
- source_word: וְצִוְּךָ אֱלֹהִים
  choice: na Mungu akuamuru hivyo
  rationale: Huhifadhi uratibu wa “na” na kuonyesha kwamba amri ya Mungu ni sharti la ziada, si kwamba Yethro anaidhinisha mpango peke yake.
- source_word: וְיָכָלְתָּ עֲמֹד
  choice: utaweza kustahimili
  rationale: יכל huonyesha uwezo, na עמד katika muktadha huu humaanisha kuhimili mzigo na kuendelea kutekeleza wajibu, si kusimama kimwili tu.
- source_word: וְגַם כָּל־הָעָם הַזֶּה
  choice: na watu hawa wote pia
  rationale: “Pia” huhifadhi nguvu ya nyongeza ya וְגַם; Kiswahili hutumia wingi wa kawaida badala ya kuiga nomino ya mkusanyiko ya Kiebrania.
- source_word: עַל־מְקֹמוֹ יָבֹא
  choice: watafika mahali pao
  rationale: Ingawa umbo la Kiebrania ni umoja unaolingana na nomino ya mkusanyiko, Kiswahili hutumia wingi. בוא inaweza kuwa kuja au kufika; “watafika” huepuka kulazimisha mtazamo wa mwendo na kueleza matokeo kwa ufasaha.
- source_word: בְשָׁלוֹם
  choice: kwa amani
  rationale: Huhifadhi maana pana ya שָׁלוֹם ya amani, hali njema, na mwisho mwema.
theological_decisions:
- issue: Nguvu ya kisharti ya ushauri wa Yethro kuhusiana na amri ya Mungu
  choice: “Kama utafanya … na Mungu akuamuru hivyo” huonyesha masharti mawili yanayohusiana.
  alternative: Kifungu kingeweza kueleweka kwa uhuru zaidi kama “na Mungu atakuamuru” au “Mungu na akuamuru.”
  rationale: Muktadha na uratibu wa Kiebrania vinaunga mkono kuelewa idhini au amri ya Mungu kama sharti la ziada, bila kudokeza kuwa ushauri wa Yethro una mamlaka huru ya kimungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Akuamuru hivyo” huhifadhi sharti la kibali cha Mungu; “watafika mahali pao” ni ya asili kuliko kuiga umoja wa nomino ya mkusanyiko wa Kiebrania.
