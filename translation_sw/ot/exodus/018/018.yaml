  text: You will surely wear yourself out[a], both you and this people who are with you, because the matter is too heavy for you. You are not able to do it by yourself.
translation:
  language: sw
  text: Hakika utaishiwa nguvu kabisa[a], wewe pamoja na watu hawa walio pamoja nawe, kwa maana jambo hilo ni zito sana kwako. Huwezi kulifanya peke yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakika utachoka sana.” Kiebrania hurudia kitenzi kwa msisitizo; kihalisi, “ukinyauka, utanyauka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבֹל תִּבֹּל
  choice: Hakika utajichosha kabisa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi cha wakati usiotimilika unasisitiza uhakika na kiwango cha kuchoka. Kiswahili hiki kinawasilisha msisitizo huo kwa njia ya kawaida bila kutumia urudiaji usio wa kawaida.
- source_word: גַּם אַתָּה גַּם הָעָם הַזֶּה
  choice: wewe pamoja na watu hawa
  rationale: Kurudiwa kwa גַּם kunajumuisha pande zote mbili; ‘wewe pamoja na’ ni muundo wa Kiswahili unaoeleweka, na ‘watu hawa’ huwasilisha nomino ya pamoja עָם pamoja na kiashiria chake.
- source_word: אֲשֶׁר עִמָּךְ
  choice: walio pamoja nawe
  rationale: Huhifadhi maana ya watu wanaokuwa pamoja na Musa, kwa upatanisho wa kawaida wa Kiswahili kwa ‘watu’.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutanguliza sababu ya onyo kwa mtindo wa heshima na wa kawaida katika simulizi la kibiblia.
- source_word: כָבֵד מִמְּךָ הַדָּבָר
  choice: jambo hili ni zito mno kwako
  rationale: ‘Zito’ huhifadhi sitiari ya uzito katika כָבֵד, huku ‘mno kwako’ ikionyesha kwamba jambo hilo linazidi uwezo wa Musa. ‘Jambo hili’ hufaa muktadha bila kulifafanua kupita chanzo.
- source_word: לֹא תוּכַל עֲשֹׂהוּ
  choice: Huwezi kulifanya
  rationale: Huwasilisha kutoweza pamoja na kitenzi pana עשה bila kuongeza wazo mahususi kama ‘kulishughulikia’.
- source_word: לְבַדֶּךָ
  choice: peke yako
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kutenda bila msaada wa wengine.
