  text: עַתָּ֣ה יָדַ֔עְתִּי כִּֽי גָד֥וֹל יְהוָ֖ה מִ/כָּל הָ/אֱלֹהִ֑ים כִּ֣י בַ/דָּבָ֔ר אֲשֶׁ֥ר זָד֖וּ עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/011.yaml
  text: Now I know that Yahweh is greater than all the gods[a], because in the matter in which they acted arrogantly against them, he was above them.
translation:
  language: sw
  text: Sasa najua kwamba Yahwe ni mkuu kuliko miungu yote[a], kwa sababu katika jambo ambalo walitenda kwa kiburi dhidi yao, yeye alikuwa juu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana katika jambo lile hasa ambalo walitenda kwa kiburi dhidi yao.” Kiebrania cha kishazi cha mwisho ni kigumu, na huenda kinarejelea hasa jinsi Wamisri walivyowatendea Waisraeli kwa kiburi.
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה יָדַעְתִּי
  choice: Sasa najua
  rationale: Huonyesha hitimisho la sasa la Yethro baada ya kuona matendo ya Yahwe; Kiswahili hiki ni cha kawaida na kinadumisha hali inayotokana na ufahamu mpya.
- source_word: גָדוֹל ... מִכָּל
  choice: ni mkuu kuliko ... yote
  rationale: Muundo wenye מִן unaonyesha ulinganisho, hivyo ‘mkuu kuliko’ ni wa asili na sahihi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu lililoandikwa kwa Tetragramatoni badala ya kulibadilisha kuwa cheo.
- source_word: הָאֱלֹהִים
  choice: miungu
  rationale: Umbo lenye wingi katika muktadha huu linarejelea miungu inayolinganishwa na Yahwe.
- source_word: בַדָּבָר
  choice: katika jambo lile
  rationale: דבר hapa ni jambo au tukio linalozungumziwa; tafsiri hii inadumisha usemi wa Kiebrania bila kufafanua kupita kiasi.
- source_word: זָדוּ
  choice: waliwatendea kwa kiburi
  rationale: Kitenzi kinaonyesha kutenda kwa majivuno, kiburi, au ukaidi; usemi huu ni wazi na wa kawaida.
- source_word: עֲלֵיהֶם
  choice: juu yao / waliwatendea
  rationale: Kirai hiki ni kigumu na kinaweza kuonyesha kutenda dhidi ya watu fulani au ukuu juu ya watendaji; tafsiri kuu na tanbihi zinahifadhi uwezekano huo.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יְהוָה; ‘Yahwe’ hulihifadhi kama jina badala ya cheo.
- issue: Maana ya kishazi cha mwisho kilichobanwa
  choice: katika jambo lile ambalo waliwatendea kwa kiburi, yeye alikuwa juu yao
  alternative: katika jambo lile hasa ambalo waliwatendea kwa kiburi
  rationale: Kiebrania cha kishazi hiki ni kigumu na hakimtaji wazi mtendaji wa sehemu ya mwisho. Tafsiri kuu inafuata maana inayowezekana ya ukuu wa Yahwe, huku tanbihi ikihifadhi usomaji usioongezea kishazi hicho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa kishazi cha mwisho umeachwa na kiwango fulani cha utata, kama kilivyo chanzo.
