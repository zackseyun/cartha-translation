base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/016.yaml
  text: Whoever kidnaps a man and sells him[a], or he is found in his hand[b], shall surely be put to death.
translation:
  language: sw
  text: Mtu yeyote anayemteka nyara[a] mwanamume na kumuuza, au ambaye mwanamume huyo anapatikana mikononi mwake[b], hakika atauawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “anamwiba mwanamume.” Katika muktadha huu maana yake ni kumteka nyara au kumwiba mtu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “anapatikana mkononi mwake.” Katika Kiebrania, “mkononi mwake” ni nahau yenye maana ya kuwa katika milki au chini ya udhibiti wake. Kiunganishi kinaweza pia kutafsiriwa “na.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹנֵב
  choice: anayemteka nyara
  rationale: Kitenzi גנב kwa kawaida humaanisha kuiba, lakini hapa kitu kinachoibwa ni mtu, na muktadha unahusu kumuuza au kuendelea kumdhibiti. Kwa Kiswahili cha sasa, “kumteka nyara” huwasilisha wazi kosa la kumwiba mtu.
- source_word: אִישׁ
  choice: mwanamume
  rationale: Nomino ya Kiebrania ni umoja wa kiume. “Mwanamume” huhifadhi jinsia ya kisarufi iliyo wazi katika matini, ingawa sheria inaweza kuwa na matumizi mapana ya kiwakilishi.
- source_word: וּמְכָרוֹ
  choice: na kumuuza
  rationale: Kitenzi מכר pamoja na kiambishi cha nafsi ya tatu umoja wa kiume kinamaanisha kumuuza mtu aliyetekwa.
- source_word: וְנִמְצָא בְיָדוֹ
  choice: au anayepatikana akiwa bado anamdhibiti
  rationale: בְיָדוֹ ni kihalisi “mkononi mwake,” lakini hapa ni nahau ya kuwa katika milki au chini ya mamlaka ya mtu. Muundo wa Kiswahili unaweka wazi kuwa mtu aliyetekwa ndiye anayepatikana chini ya udhibiti wa mtekaji, na “au” huonyesha uwezekano wa pili wa kisheria.
- source_word: מֹות יוּמָת
  choice: hakika atauawa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye ukomo unatilia mkazo adhabu ya kifo. “Hakika atauawa” huhifadhi mkazo huo na sauti ya hukumu ya kisheria.
theological_decisions:
- issue: Upeo wa kosa la kisheria
  choice: Kifungu kinakataza kumteka mtu kwa kusudi la kumfanya mali, iwe tayari ameuziwa mwingine au bado yuko chini ya udhibiti wa mtekaji.
  alternative: Kiunganishi kinaweza kusomwa kwa maana ya “na,” yaani, “na akipatikana mkononi mwake,” kama hali nyingine inayoongezwa badala ya uwezekano wa pili.
  rationale: Mfuatano wa Kiebrania unaunganisha kuibwa kwa mtu na kuuzwa kwake au kupatikana kwake bado chini ya udhibiti wa mtekaji. “Au” huwasilisha kwa uwazi maana ya kawaida ya masharti haya ya kisheria bila kuficha uwezekano wa kusoma kiunganishi kama “na.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Kumteka nyara” ni tafsiri ya kimuktadha ya kumwiba mtu, huku tanbihi ikihifadhi maana halisi. Usemi usio wa kawaida “mkononi mwake” umewekwa katika tanbihi, na matini kuu imetumia “anamdhibiti” kwa uwazi wa asili.
