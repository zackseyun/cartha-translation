  yaml_path: translation/ot/exodus/021/001.yaml
  text: These are the judgments that you shall set before them:[a]
translation:
  language: sw
  text: Na hizi ndizo hukumu utakazoweka mbele yao:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sheria,” “kanuni,” au “maagizo ya kisheria.” Neno la Kiebrania linamaanisha hukumu au maamuzi ya kisheria yanayotumika katika kesi mbalimbali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Na hizi
  rationale: Kiunganishi וְ kinaunganisha sehemu hii na yaliyotangulia, huku אֵלֶּה ikitafsiriwa kwa kawaida kuwa “hizi.”
- source_word: הַ/מִּשְׁפָּטִים
  choice: hukumu
  rationale: Neno מִשְׁפָּטִים hapa linahusu maamuzi au masharti ya kisheria yanayotolewa katika kesi mbalimbali. “Hukumu” huhifadhi maana yake ya kimahakama, huku tanbihi ikionyesha tafsiri nyingine zinazowezekana.
- source_word: אֲשֶׁר
  choice: -takazo-
  rationale: Kiwakilishi hiki cha uhusiano kimewasilishwa kiasili ndani ya kitenzi cha Kiswahili “utakazoweka.”
- source_word: תָּשִׂים
  choice: utakazoweka
  rationale: Kitenzi שׂוּם maana yake ni kuweka au kuwasilisha. Wakati ujao wa Kiswahili hapa una nguvu ya agizo katika muktadha huu.
- source_word: לִ/פְנֵי/הֶם
  choice: mbele yao
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya nahau yenye maana ya kuweka jambo mbele ya watu ili walipokee na kulizingatia.
theological_decisions:
- issue: Maana ya מִשְׁפָּטִים katika sheria ya agano
  choice: hukumu
  alternative: sheria, kanuni, au maagizo ya kisheria
  rationale: “Hukumu” huhifadhi wigo wa kisheria na kimahakama wa neno la Kiebrania bila kulifanya liwe neno la jumla tu kama “sheria.” Tofauti halisi za kileksika zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye staha. “Na” imehifadhiwa ili kuonyesha uhusiano wa kifungu hiki na yaliyotangulia; muundo “hizi ndizo” ni wa kawaida na unaweka mkazo wa utambulisho uliopo katika sentensi ya Kiebrania.
