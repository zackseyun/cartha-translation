lexical_decisions:
- source_word: מַכֵּה
  choice: anayempiga
  rationale: 'Kitenzi נכה katika umbo la kisifa kinaanzisha kisa cha kisheria: mtu anayempiga mwingine. “Anayempiga” ni Kiswahili cha kawaida na hakitangulizi matokeo ya kifo ndani ya kitenzi chenyewe.'
- source_word: אִישׁ
  choice: mwanamume
  rationale: אִישׁ hapa humaanisha mwanamume, yaani mwathiriwa wa kiume. Uchaguzi huu unahifadhi jinsia iliyo wazi katika maandishi ya Kiebrania bila kuifanya kuwa “mtu” kwa ujumla.
- source_word: וָמֵת
  choice: naye akafa
  rationale: Kiunganishi pamoja na kitenzi מות huonyesha kifo kinachotokea baada ya kipigo. “Naye akafa” huhifadhi kwa ufasaha muundo wa Kiebrania na pia kiwango fulani cha utata wa uhusiano wake wa kimantiki.
- source_word: מוֹת יוּמָת
  choice: hakika atauawa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi cha kauli ya kutendwa unasisitiza adhabu ya kifo. “Hakika atauawa” huhifadhi msisitizo na kauli ya kutendwa bila kuongeza neno lenye tafsiri pana zaidi kama “atanyongwa” au “atauawa kisheria.”
