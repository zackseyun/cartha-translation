  terminology: '''Mtumwa wa kiume/wa kike,'' ''kuharibu,'' and ''kumwachilia huru'' are appropriate. ''Kama fidia kwa jicho hilo'' expresses the legal force of תַּחַת while the footnote preserves the more literal alternatives.'
