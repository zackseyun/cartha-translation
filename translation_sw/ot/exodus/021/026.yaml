    issue: The main text renders אִישׁ as 'mtu.'
    rationale: Although 'mtu' can function generically in Swahili, the Hebrew wording is masculine singular and the English audit trail deliberately retains this. 'Mwanamume' preserves the stated source form without harming legal intelligibility.
  - severity: medium
    issue: '''Kwa jicho lake'' has an unclear antecedent in Swahili.'
    rationale: It can be read as the man's eye, whereas the Hebrew phrase refers to the eye of the injured slave. 'Kwa jicho hilo' makes the reference clear.
  - severity: low
    issue: The release pronoun can appear to refer only to the male slave.
    rationale: Because the preceding alternatives include a female slave, adding 'mtumwa huyo' explicitly applies the required emancipation to either one.
