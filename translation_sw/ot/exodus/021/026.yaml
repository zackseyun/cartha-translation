base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/026.yaml
  text: And if a man strikes the eye of his male servant or the eye of his female servant and destroys it[c][b][a], he shall let him go free in compensation for his eye.
translation:
  language: sw
  text: Na mwanamume akipiga jicho la mtumwa wake wa kiume au la mtumwa wake wa kike[b], na kuliharibu[a], atamwachilia huru mtumwa huyo kama fidia kwa jicho hilo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kulipofusha.” Kitenzi cha Kiebrania kinaweza kumaanisha kuharibu jicho au kulifanya lisifae, hivyo kikidokeza jeraha la kudumu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mtumwa wake wa kiume ... mtumwa wake wa kike.” Sheria hii inatoa uhuru kama fidia kwa jeraha la kudumu lililosababishwa na bwana.'
    reason: cultural_note
  - marker: c
    text: Kwa neno kwa neno, “kwa jicho hilo” au “badala ya jicho hilo.” Maana ni kwamba mtumwa huyo huachiliwa huru kama fidia kwa jeraha la jicho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Na mtu aki-
  rationale: Muundo huu unaendeleza mfululizo wa sheria za masharti na kuwasilisha kwa Kiswahili cha kawaida maana ya ‘na ikiwa mtu.’
- source_word: יַכֶּה
  choice: akipiga
  rationale: Kitenzi נכה humaanisha kupiga; ‘akipiga’ ni cha moja kwa moja bila kudokeza lazima kipigo cha kurudiwa-rudiwa.
- source_word: אִישׁ
  choice: mtu
  rationale: Katika sheria ya masharti, אִישׁ humtaja mtu binafsi; ‘mtu’ ni ya kawaida na ya asili katika Kiswahili, bila kubadili mhusika kuwa wingi.
- source_word: עַבְדּוֹ
  choice: mtumwa wake wa kiume
  rationale: Katika muktadha huu wa umiliki na kuachiliwa, עבד inaonyesha hali ya utumwa, si tu utumishi; ‘wa kiume’ huhifadhi utofautishaji na אמה.
- source_word: אֲמָתוֹ
  choice: mtumwa wake wa kike
  rationale: אמה humaanisha mwanamke aliye katika hali ya utumwa; tafsiri hii ni wazi na inalingana na fungu sambamba la mtumwa wa kiume.
- source_word: וְשִׁחֲתָהּ
  choice: na kuliharibu
  rationale: שחת hapa inaonyesha kulifanya jicho lisifae kwa madhara ya kudumu. ‘Kuliharibu’ huhifadhi upana wa maana bila kuibana kuwa upofu kamili pekee.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: atamwachilia huru
  rationale: Muungano wa חפשי na שלח unaeleza kuondolewa katika hali ya utumwa na kupewa uhuru; usemi huu ni wa asili na una nguvu ya kisheria.
- source_word: תַּחַת עֵינוֹ
  choice: kama fidia kwa jicho lake
  rationale: תחת katika sheria inaweza kuonyesha badala au malipo ya kufidia. ‘Kama fidia kwa’ huweka wazi kazi ya kisheria ya kuachiliwa kutokana na jeraha.
theological_decisions:
- issue: Istilahi ya hali ya utumwa katika sheria ya Israeli
  choice: mtumwa wake wa kiume / mtumwa wake wa kike
  alternative: mtumishi wake / kijakazi chake
  rationale: Muktadha unahusu mamlaka ya bwana, jeraha analosababisha, na kuachiliwa huru; kwa hiyo ‘mtumwa’ huonyesha hali halisi ya kisheria kuliko ‘mtumishi,’ bila kuhalalisha mfumo huo.
- issue: Jinsia ya mhusika wa sheria
  choice: mtu
  alternative: mwanamume
  rationale: Ingawa אִישׁ ni nomino ya kiume, katika kanuni hii ya masharti humtaja mtu binafsi mwenye watumwa. Kiswahili ‘mtu’ ni uwasilishaji wa kawaida wa kazi hiyo ya jumla, huku jinsia za watumwa zikitajwa wazi.
- issue: Upeo wa jeraha la jicho
  choice: kuliharibu
  alternative: kulipofusha
  rationale: Maana ya שחת inahusu kuharibu au kufanya lisifae na huenda ikajumuisha upofu, lakini maandishi hayalazimishi tafsiri finyu ya upofu kamili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya sheria lakini kinachoeleweka kwa msomaji wa kawaida. ‘Atamwachilia huru’ ni usemi wa moja kwa moja; ‘fidia’ hufafanua kazi ya תחת katika muktadha bila kufuta uwezekano wa maana ya ‘badala ya.’
