  text: However[a], if he survives for a day or two, he shall not be avenged[b], for he is his money.
translation:
  language: sw
  text: Lakini, akiendelea kuishi siku moja au mbili, kisasi hakitalipizwa kwa ajili yake[a], kwa maana yeye ni fedha ya bwana wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bwana huyo hataadhibiwa.” Kiebrania kinazungumzia hasa kulipiza kisasi au kutekeleza ulipizaji wa kisheria.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “yeye ni fedha yake,” yaani mtumwa huyo alikuwa na thamani ya kiuchumi kwa bwana wake.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Inaingiza tofauti au sharti linaloweka mipaka kwa hukumu ya kisa kilichotangulia; “Lakini” ni ya kawaida na wazi katika Kiswahili.
- source_word: אִם
  choice: ikiwa
  rationale: Ni kiunganishi cha kawaida cha kuanzisha sharti katika lugha ya kisheria.
- source_word: יוֹם אוֹ יוֹמַיִם
  choice: kwa siku moja au mbili
  rationale: Inahifadhi muda mfupi unaotajwa na Kiebrania na inaungana kwa kawaida na “ataendelea kuishi.”
- source_word: יַעֲמֹד
  choice: ataendelea kuishi
  rationale: Kitenzi kina maana ya msingi ya “kusimama,” lakini katika muktadha huu kinamaanisha kubaki hai baada ya kupigwa, bila kudokeza kwamba amepona kabisa.
- source_word: לֹא יֻקַּם
  choice: kisasi hakitalipizwa kwa ajili yake
  rationale: Hifadhi ya maana ya kisasi au ulipizaji wa kisheria ni sahihi zaidi kuliko neno la jumla “kuadhibiwa”; muundo huu pia unaonyesha kwamba kisasi hakitatekelezwa kwa ajili ya aliyejeruhiwa.
- source_word: כִּי
  choice: kwa sababu
  rationale: Inaingiza sababu ya hukumu hiyo kwa Kiswahili cha kawaida na wazi.
- source_word: כַסְפּוֹ
  choice: fedha yake
  rationale: Tafsiri ya moja kwa moja ya “fedha yake”; “mali yake” ingekuwa pana na ya kufasiri zaidi kuliko Kiebrania.
- source_word: הוּא
  choice: yeye ni
  rationale: Inadumisha rejeo la kibinadamu la kiwakilishi cha kiume cha umoja, hata ingawa sababu inayotolewa ni ya kiuchumi.
theological_decisions:
- issue: Sababu ya kiuchumi katika sheria kuhusu utumwa
  choice: Kudumisha kauli kali “yeye ni fedha yake.”
  alternative: “yeye ni mali yake” au “hasara ni yake mwenyewe”
  rationale: Kiebrania kinatoa sababu hiyo moja kwa moja kwa lugha ya kiuchumi. Tafsiri haipaswi kuipunguza ukali wake wala kuibadili ili ikubalike zaidi kimaadili.
- issue: Maana ya ulipizaji katika לֹא יֻקַּם
  choice: “kisasi hakitalipizwa kwa ajili yake”
  alternative: “bwana huyo hataadhibiwa”
  rationale: Mzizi נקם unahusu kisasi au ulipizaji wa kisheria. Tafsiri iliyochaguliwa inadumisha maana hiyo maalumu bila kuamua kimyakimya kwamba ni adhabu ya aina gani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida huku ukidumisha ukali wa lugha ya kisheria na sababu ya kiuchumi iliyo katika maandishi ya Kiebrania.
