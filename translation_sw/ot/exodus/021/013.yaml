- from: Lakini ikiwa hakumvizia, bali Mungu akafanya hilo litokee kwa mkono wake[a], nitakuteulia mahali ambapo anaweza kukimbilia.
  to: Lakini ikiwa hakumvizia, na Mungu akamtilia mikononi mwake[a], nitakuteulia mahali atakapoweza kukimbilia.
  rationale: 'The revision removes the unwarranted adversative “bali” and uses the natural idiom “akamtilia mikononi mwake” to reflect אִנָּה לְיָדוֹ. It preserves the source’s tension: the act was not premeditated, yet the event is described as occurring under God’s providence. The footnote clarifies the implied object and the idiom without overresolving the theological meaning.'
