base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/013.yaml
  text: But if he did not lie in wait[a], and God caused it to come into his hand, then I will appoint for you a place to which he may flee.
translation:
  language: sw
  text: Lakini ikiwa hakumvizia, na Mungu akamtilia mikononi mwake[a], nitakuteulia mahali atakapoweza kukimbilia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana iliyo karibu zaidi na Kiebrania, “Mungu alimfanya aje mkononi mwake.” Mtu anayerejelewa anaeleweka kutokana na muktadha uliotangulia. Usemi huu unaeleza tukio lililotokea chini ya majaliwa ya Mungu kupitia tendo la mtu huyo, bila kuonyesha kuwa alilipanga mapema.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Lakini ikiwa
  rationale: Kifungu hiki kinaanzisha hali ya tofauti na mauaji ya kukusudia katika mstari uliotangulia; muundo wa sharti ni wa kawaida na wazi katika Kiswahili.
- source_word: לֹא צָדָה
  choice: hakumvizia
  rationale: Katika muktadha huu wa kisheria, kitenzi kinaonyesha kutomngojea mtu kwa hila ili kumuua, yaani kutokuwa na kusudi lililopangwa mapema.
- source_word: וְהָאֱלֹהִים
  choice: bali Mungu
  rationale: Hapa אֱלֹהִים inaeleweka kwa kufaa zaidi kuwa Mungu, kwa kuwa sentensi inaeleza tukio lililotokea chini ya majaliwa ya Mungu, si uamuzi wa waamuzi.
- source_word: אִנָּה לְיָדוֹ
  choice: akafanya hilo litokee kwa mkono wake
  rationale: Tafsiri hii inadumisha kusababisha kwa Mungu na kutendeka kwa tukio kupitia mkono wa muuaji, bila kulifanya kuwa tendo lililopangwa mapema. Neno “hilo” linarejelea tukio la kifo katika muktadha.
- source_word: וְשַׂמְתִּי לְךָ מָקוֹם
  choice: nitakuteulia mahali
  rationale: “Kuteua” linaonyesha kuwekwa rasmi kwa mahali pa kukimbilia na ni la asili katika Kiswahili cha sasa.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: ambapo anaweza kukimbilia
  rationale: Muundo huu unaonyesha mahali pa kupata hifadhi bila kudai kwamba bila shaka mtu huyo atakimbia huko.
theological_decisions:
- issue: Utendaji wa Mungu katika kifo kisichokusudiwa
  choice: Mungu akafanya hilo litokee kwa mkono wake
  alternative: Mungu akamleta mikononi mwake
  rationale: 'Chaguo kuu linahifadhi mvutano wa maandiko: kifo hakikupangwa na muuaji, lakini tukio linaelezwa kuwa chini ya utendaji wa Mungu na kutekelezwa kupitia mkono wa mtu huyo. Halimwondolei mhusika uwakala wala kulifanya tukio kuwa mauaji ya kukusudia.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa msomaji wa kawaida. Kiambishi cha yambwa katika “hakumvizia” na neno “hilo” vinategemea muktadha wa mstari uliotangulia.
