  yaml_path: translation/ot/exodus/021/020.yaml
  text: And if a man strikes his male servant or his female servant with a rod[a], and the servant dies under his hand, he must surely be avenged.
translation:
  language: sw
  text: Na mtu akimpiga mtumwa wake wa kiume au mtumwa wake wa kike kwa fimbo, naye akafa chini ya mkono wake, lazima alipiziwe kisasi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lazima aliyempiga aadhibiwe.” Kiebrania kwa maana ya karibu zaidi husema, “lazima alipiziwe kisasi,” ikiwa ni kauli ya kisheria yenye msisitizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִֽי
  choice: Na ... aki-
  rationale: Muundo huu huhifadhi kiunganishi ו na maana ya sharti ya כִּי katika sheria ya kimifano, huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: יַכֶּה
  choice: akimpiga
  rationale: Kitenzi נכה kina maana pana ya kupiga; uchaguzi huu hauongezi namna ya tendo, na chombo kinatajwa baadaye.
- source_word: אִישׁ
  choice: mtu
  rationale: Katika mtindo wa sheria, אִישׁ humtaja mtu binafsi, kwa kawaida mwanamume; 'mtu' ni lugha ya kawaida ya sheria ya Kiswahili bila kubadili mhusika kuwa wingi.
- source_word: עַבְדּוֹ
  choice: mtumwa wake wa kiume
  rationale: עבד hapa inaonyesha hadhi ya utumwa, si huduma ya kawaida; 'wa kiume' hudhihirisha utofauti unaolinganishwa na אָמָה.
- source_word: אֲמָתוֹ
  choice: mtumwa wake wa kike
  rationale: אָמָה humaanisha mtumwa wa kike; usemi huu ni wazi, wa sasa, na sambamba na 'mtumwa wake wa kiume'.
- source_word: בַּשֵּׁבֶט
  choice: kwa fimbo
  rationale: שבט inaweza kuwa fimbo, gongo, au fimbo ya mamlaka; hapa ni chombo cha kupigia, hivyo 'fimbo' inafaa.
- source_word: וּמֵת
  choice: naye akafa
  rationale: Huhifadhi mfuatano au matokeo ya tendo bila kuufanya kwa lazima kuwa kauli ya kusudi.
- source_word: תַּחַת יָדוֹ
  choice: chini ya mkono wake
  rationale: Tafsiri ya karibu huhifadhi nahau yenye wazo la kufa kutokana na pigo au akiwa chini ya udhibiti wake wa moja kwa moja.
- source_word: נָקֹם יִנָּקֵם
  choice: lazima alipiziwe kisasi
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unasisitiza uhakika wa kulipiza kisasi. 'Lazima' huwasilisha nguvu hiyo ya kisheria bila kutaja adhabu mahsusi ambayo aya yenyewe haitaji.
theological_decisions:
- issue: Aina ya matokeo ya kisheria katika נָקֹם יִנָּקֵם
  choice: lazima alipiziwe kisasi
  alternative: lazima aadhibiwe
  rationale: Kiebrania kinasisitiza kwamba kisasi au haki ya kulipiza lazima itekelezwe, lakini aya hii haitaji kwa usahihi adhabu hiyo ni ipi. Tafsiri kuu huhifadhi ukali na kutokuwa mahsusi kwa matini.
- issue: Mrejeleo wa anayelipiziwa kisasi
  choice: mtumwa aliyekufa alipiziwe kisasi
  alternative: aliyempiga aadhibiwe
  rationale: Niphal ya נקם huweka aliyekufa kama anayelipiziwa kisasi; kumfanya bwana moja kwa moja kuwa kiima cha 'aadhibiwe' kungekuwa tafsiri ya kimahakama iliyo wazi zaidi lakini isiyo ya moja kwa moja kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Mtumwa' hutumiwa kwa uwazi kwa sababu muktadha ni wa utumwa wa kisheria, si utumishi wa kawaida. Nahau 'chini ya mkono wake' imehifadhiwa ili kutopunguza wigo wa maana ya chanzo.
