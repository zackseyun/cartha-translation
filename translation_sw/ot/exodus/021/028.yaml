  text: וְ/כִֽי יִגַּ֨ח שׁ֥וֹר אֶת אִ֛ישׁ א֥וֹ אֶת אִשָּׁ֖ה וָ/מֵ֑ת סָק֨וֹל יִסָּקֵ֜ל הַ/שּׁ֗וֹר וְ/לֹ֤א יֵאָכֵל֙ אֶת בְּשָׂר֔/וֹ וּ/בַ֥עַל הַ/שּׁ֖וֹר נָקִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/028.yaml
  text: And if an ox gores a man or a woman and he dies[a], the ox shall surely be stoned, and its flesh shall not be eaten; but the owner of the ox is clear.
translation:
  language: sw
  text: “Ikiwa ng’ombe akimchoma mwanamume au mwanamke kwa pembe zake, na mtu huyo akifa, ng’ombe huyo lazima apigwe mawe, na nyama yake isiliwe. Lakini mwenye ng’ombe hana hatia.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hatawajibika” au “ataachiliwa bila adhabu.” Neno la Kiebrania נָקִי (naqi) hapa ni neno la kisheria linaloweza kumaanisha kuwa hana hatia, hana wajibu wa kisheria, au hayuko chini ya adhabu katika kesi hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Ikiwa
  rationale: Hutanguliza sharti katika sheria ya kesi; Kiswahili cha sasa hakihitaji kutafsiri kiunganishi וְ kwa neno tofauti hapa.
- source_word: יִגַּח
  choice: atampiga pembe
  rationale: Kitenzi hiki humaanisha kupiga au kuchoma kwa pembe; usemi huu ni wazi na wa kawaida kuliko kitenzi cha jumla kama ‘kumpiga.’
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: Neno la Kiebrania humaanisha mnyama wa jamii ya ng’ombe katika muktadha huu bila kulazimisha ubainishaji wa jinsia ambao ‘fahali’ ungeleta.
- source_word: אֶת אִישׁ אוֹ אֶת אִשָּׁה
  choice: mwanamume au mwanamke
  rationale: Huhifadhi kutajwa wazi kwa jinsia zote mbili katika Kiebrania.
- source_word: וָמֵת
  choice: naye akafa
  rationale: Kiwakilishi ‘naye’ kinaweza kumrejelea mwanamume au mwanamke, hivyo huepuka kuifanya kauli ihusu jinsia moja tu.
- source_word: סָקוֹל יִסָּקֵל
  choice: ni lazima ng’ombe huyo apigwe mawe
  rationale: Muundo wa Kiebrania wa kitenzi-jina pamoja na kitenzi kilichopigwa huonyesha msisitizo na ulazima; ‘ni lazima’ huwasilisha nguvu hiyo kwa Kiswahili cha kawaida cha kisheria.
- source_word: וְלֹא יֵאָכֵל אֶת בְּשָׂרוֹ
  choice: na nyama yake isiliwe
  rationale: Huhifadhi kauli tendwa na katazo la kula nyama ya mnyama huyo kwa lugha ya kawaida.
- source_word: וּבַעַל הַשּׁוֹר
  choice: Lakini mwenye ng’ombe
  rationale: ‘Mwenye’ huonyesha umiliki wa kisheria kwa uwazi; ‘lakini’ huleta tofauti kati ya hukumu ya ng’ombe na hali ya mwenyewe.
- source_word: נָקִי
  choice: hatakuwa na hatia
  rationale: Ni usemi mfupi na wa kawaida unaofaa muktadha wa kisheria, huku tanbihi ikihifadhi uwezekano mpana wa kutowajibika au kutoadhibiwa.
theological_decisions:
- issue: Hali ya kisheria ya mwenye ng’ombe katika kishazi cha mwisho
  choice: Mwenye ng’ombe hana hatia katika kesi hii, huku maana pana ikifafanuliwa katika tanbihi.
  alternative: Mwenye ng’ombe hatawajibika au ataachiliwa bila adhabu.
  rationale: נָקִי linaweza kueleza kuwa huru kutokana na hatia, wajibu wa kisheria, au adhabu. Tafsiri kuu inabaki fupi na ya asili, na tanbihi huepuka kuifanya maana iwe ya kimaadili, kiraia, au ya adhabu ya kifo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inatumia lugha ya sheria inayoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kishazi kinachotafsiri נָקִי, ambacho ndicho kinachofafanuliwa na tanbihi.
