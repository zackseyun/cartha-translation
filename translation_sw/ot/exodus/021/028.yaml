  verdict: revise
  source_fidelity: Marekebisho yanahitajika kwa usemi wa kitenzi cha kugonga kwa pembe. Kiebrania יִגַּח humaanisha kumchoma/kumgonga mtu kwa pembe; «atampiga pembe» si usemi salama wa Kiswahili, kwa kuwa unaweza kueleweka kama kupiga (kupuliza) pembe. Tafsiri iliyorekebishwa huhifadhi sharti, kutajwa kwa mwanamume au mwanamke, kifo cha mhanga, msisitizo wa hukumu ya ng’ombe kupigwa mawe, katazo la kula nyama yake, na hali ya kisheria ya mwenye ng’ombe bila kuibana kupita kiasi.
  naturalness: «Ng’ombe akimchoma mwanamume au mwanamke kwa pembe zake» ni Kiswahili Sanifu cha wazi na cha asili kwa tendo la kugonga kwa pembe. «Mtu huyo akifa» huepusha utata wa kiwakilishi «naye», ambacho kingeweza kueleweka kimakosa kumrejelea ng’ombe. Muundo wa kisheria unabaki wa heshima na unaoeleweka.
  terminology: «Ng’ombe» haibani jinsia ya שׁוֹר. «Kupigwa mawe» huhifadhi adhabu iliyotajwa bila kuongeza maneno «mpaka afe». «Hana hatia» ni tafsiri inayokubalika kwa נָקִי katika usemi wa sheria, na tanbihi inaeleza kwa tahadhari maana mbadala ya kutokuwa na wajibu wa kisheria au kutoadhibiwa bila kudai aina mahsusi ya dhima.
  issues:
