    rationale: Ingawa muktadha unaweza kueleweka, kiwakilishi kinaweza kuwa na rejeleo lisilo wazi baada ya kutajwa kwa ng’ombe, mwanamume, na mwanamke. «Mtu huyo akifa» huweka wazi kuwa anayekufa ni mhanga.
