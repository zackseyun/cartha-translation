  yaml_path: translation/ot/exodus/021/007.yaml
  text: And if a man sells his daughter as a female servant[b][a], she shall not go out as the male servants go out.
translation:
  language: sw
  text: Na mwanamume akimuuza binti yake kuwa mtumwa wa kike[a], yeye hatatoka kama watumwa wa kiume watokavyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kijakazi.” Neno la Kiebrania אָמָה humaanisha mtumwa wa kike; katika muktadha huu wa kisheria linarejelea hali ya utumwa, si mfanyakazi wa kawaida wa nyumbani.
    reason: lexical_alternative
  - marker: b
    text: Yaani, hataachiliwa kutoka katika utumwa kwa namna ileile watumwa wa kiume wanavyoachiliwa.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: Na ... aki-
  rationale: “Na” huhifadhi kiunganishi ו, na muundo wa masharti wa “aki-” huwasilisha כִּי kwa Kiswahili cha kawaida katika sheria ya tukio maalumu.
- source_word: יִמְכֹּר
  choice: akimuuza
  rationale: Kitenzi kinamaanisha kuuza; hali ya masharti inaunganishwa kwa kawaida na “aki-” bila kuongeza maana ya uwezekano isiyomo wazi katika Kiebrania.
- source_word: אִישׁ
  choice: mtu
  rationale: Katika Kiswahili “mtu” ni neno la kawaida kwa mhusika mmoja katika sheria; muktadha na “binti yake” huonyesha kwamba hapa ni baba au mkuu wa kaya bila kulazimisha ufafanuzi huo ndani ya matini.
- source_word: בִּתּוֹ
  choice: binti yake
  rationale: Huwasilisha moja kwa moja neno la undugu pamoja na kiambishi cha nafsi ya tatu umoja.
- source_word: לְאָמָה
  choice: kuwa kijakazi
  rationale: “Kijakazi” ni neno la Kiswahili lenye hadhi ya utumwa au utumishi wa kufungwa kwa mwanamke; “kuwa” huonyesha jukumu au hadhi inayowasilishwa na לְ.
- source_word: לֹא תֵצֵא
  choice: huyo hatatoka
  rationale: “Hatatoka” huhifadhi nahau ya kisheria ya Kiebrania ya kutoka katika utumishi, badala ya kuifasiri moja kwa moja kuwa kuachiliwa. “Huyo” huondoa utata wa kiwakilishi bila kuongeza mhusika mpya.
- source_word: כְּצֵאת
  choice: kama ... wanavyotoka
  rationale: Muundo huu huhifadhi ulinganisho na urudiaji wa kitenzi “kutoka” katika Kiebrania.
- source_word: הָעֲבָדִים
  choice: watumwa wa kiume
  rationale: Ingawa עֲבָדִים linaweza kumaanisha watumishi au watumwa, muktadha wa kuuza na tofauti na אָמָה hufanya hadhi ya utumwa na jinsia ya kundi linalolinganishwa kuwa muhimu.
theological_decisions:
- issue: Istilahi ya utumwa katika sheria ya agano
  choice: Tumia “kijakazi” na “watumwa wa kiume,” huku tanbihi ikieleza wazi hadhi ya kijakazi.
  alternative: “mtumishi wa kike” na “watumishi”
  rationale: Muktadha unahusu kuuzwa na masharti ya kutoka katika utumishi, kwa hiyo hadhi ya kufungwa haipaswi kufichwa. Hata hivyo, “kijakazi” ni neno la asili na lenye hadhi katika Kiswahili, huku tanbihi ikizuia lisieleweke kama mfanyakazi wa kawaida tu.
- issue: Maana ya kutotoka kama watumwa wa kiume
  choice: Hifadhi ulinganisho wa Kiebrania katika matini na ueleze katika tanbihi kuwa masharti ya kuondoka si yale yale.
  alternative: 'Tafsiri moja kwa moja: “hataachiliwa kwa masharti yale yale kama watumwa wa kiume”'
  rationale: Matini ya Kiebrania haisemi masharti hayo kwa undani katika mstari huu; kuhifadhi nahau huacha ufafanuzi kwa sheria zinazofuata na huepuka kutatua kimya kimya mvutano wa kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sheria wa masharti umetolewa kwa “Na ... aki-”. Nahau “kutoka” imehifadhiwa kwa sababu ndiyo lugha ya kisheria ya chanzo, huku tanbihi ikifafanua maana yake. Alama zote za tanbihi zimewekwa katika matini kuu.
