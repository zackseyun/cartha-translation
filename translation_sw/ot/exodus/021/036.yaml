  text: א֣וֹ נוֹדַ֗ע כִּ֠י שׁ֣וֹר נַגָּ֥ח הוּא֙ מִ/תְּמ֣וֹל שִׁלְשֹׁ֔ם וְ/לֹ֥א יִשְׁמְרֶ֖/נּוּ בְּעָלָ֑י/ו שַׁלֵּ֨ם יְשַׁלֵּ֥ם שׁוֹר֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/036.yaml
  text: Or if it was known that the ox was accustomed to gore from yesterday and the day before[a], and its owner did not keep it in, he must surely pay ox for ox[c][b], and the dead animal will be his.
translation:
  language: sw
  text: Au, ikiwa ilijulikana kwamba ng'ombe huyo alikuwa na tabia ya kupiga kwa pembe tangu jana na juzi[a], na mwenye ng'ombe huyo hakumzuia, lazima alipe ng'ombe badala ya ng'ombe, na ng'ombe aliyekufa atakuwa mali yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “tangu jana na juzi,” nahau inayomaanisha kwamba ng''ombe huyo alikuwa ameonyesha tabia hiyo hapo awali.'
    reason: cultural_note
lexical_decisions:
- source_word: א֣וֹ
  choice: Au ikiwa
  rationale: Inaendeleza kisa mbadala cha sheria kutoka mstari uliotangulia; 'ikiwa' hufanya muundo wa sharti uwe wazi katika Kiswahili.
- source_word: נוֹדַע כִּי
  choice: ilijulikana kwamba
  rationale: Huhifadhi maana ya kauli tendwa isiyo na mtendaji aliyetajwa na kuingiza yaliyokuwa yanajulikana.
- source_word: שׁוֹר
  choice: ng'ombe
  rationale: '''Ng''ombe'' ni neno la kawaida na linalofaa katika muktadha huu wa sheria; Kiebrania hakilazimishi tafsiri yenye ubainisho finyu zaidi hapa.'
- source_word: נַגָּח
  choice: alikuwa na tabia ya kupiga kwa pembe
  rationale: Kivumishi hiki humtambulisha ng'ombe kwa mwenendo wake wa kurudia kupiga kwa pembe, si tukio moja tu.
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  choice: tangu jana na juzi
  rationale: Huhifadhi nahau ya Kiebrania inayorejelea historia ya awali ya tabia hiyo kwa usemi wa asili wa Kiswahili.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: lakini mwenyewe hakumzuia
  rationale: Katika muktadha huu, שמר ni kumdhibiti au kumzuia mnyama anayejulikana kuwa hatari; 'lakini' huonyesha tofauti ya kisheria kwa kawaida.
- source_word: בְּעָלָיו
  choice: mwenyewe
  rationale: Ni njia ya kawaida ya Kiswahili ya kumrejelea mmiliki wa ng'ombe huyo bila kurudia nomino.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: lazima atoe
  rationale: Huonyesha wajibu wa fidia uliosisitizwa na muundo wa Kiebrania; kitakachotolewa kinaelezwa mara moja na kishazi kinachofuata.
- source_word: שׁוֹר תַּחַת הַשּׁוֹר
  choice: ng'ombe badala ya ng'ombe
  rationale: Huhifadhi kanuni ya kubadilisha au kufidia mnyama mmoja kwa mwingine.
- source_word: וְהַמֵּת יִהְיֶה לּוֹ
  choice: na yule aliyekufa atakuwa mali yake
  rationale: Huhifadhi usemi wa Kiebrania ambao kwa kifupi humrejelea ng'ombe aliyekufa, bila kuamua kimya kimya ikiwa 'yake' anamrejelea mmiliki gani.
theological_decisions:
- issue: Mrejelewa wa kiwakilishi katika לּוֹ ('mali yake')
  choice: Kudumisha 'mali yake' bila kumtaja mwenye kupokea mzoga
  alternative: Kusema wazi 'mzoga utakuwa mali ya mwenye ng'ombe aliye hai' au 'mali ya mwenye ng'ombe aliyekufa'
  rationale: Kiebrania kina kiwakilishi tu, na utambulisho wa mrejelewa wake huweza kufasiriwa kwa kuzingatia muktadha wa sheria. Tafsiri kuu haipaswi kutatua kimya kimya utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sheria na msisitizo wa wajibu umehifadhiwa, huku nahau ya Kiebrania ikitolewa kwa usemi wa asili wa Kiswahili.
