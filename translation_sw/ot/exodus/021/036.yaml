  to: Au, ikiwa ilijulikana kwamba ng'ombe huyo alikuwa na tabia ya kupiga kwa pembe tangu jana na juzi[a], na mwenye ng'ombe huyo hakumzuia, lazima alipe ng'ombe badala ya ng'ombe, na ng'ombe aliyekufa atakuwa mali yake.
