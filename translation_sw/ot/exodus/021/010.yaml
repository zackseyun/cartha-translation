lexical_decisions:
- source_word: אִם
  choice: Akijitwalia
  rationale: 'Kiambishi cha masharti -ki- kinahifadhi muundo wa sheria ya tukio: ‘ikiwa atajitwalia.’'
- source_word: אַחֶרֶת יִקַּח לוֹ
  choice: mke mwingine
  rationale: Katika muktadha huu, ‘mwingine’ ni mwanamke mwingine anayechukuliwa kuwa mke; ‘kujitwalia’ pia huakisi לוֹ, ‘kwa ajili yake mwenyewe.’
- source_word: שְׁאֵרָהּ
  choice: chakula chake
  rationale: Katika orodha hii ya wajibu wa ndoa, neno hili linaeleweka kuwa riziki ya chakula, ingawa asili yake ya kileksia ina uhusiano na ‘mwili/nyama.’
- source_word: כְּסוּתָהּ
  choice: mavazi yake
  rationale: Neno linamaanisha kifuniko au mavazi; ‘mavazi’ ni Kiswahili cha kawaida na kinachofaa katika sheria.
- source_word: וְעֹנָתָהּ
  choice: haki yake ya ndoa
  rationale: Neno adimu linaashiria wajibu wa ukaribu wa kimwili katika ndoa; tafsiri hii ni yenye heshima na inaeleweka bila kuwa ya kitabibu kupita kiasi.
- source_word: לֹא יִגְרָע
  choice: hatampunguzia
  rationale: Kitenzi kinamaanisha kupunguza au kufanya pungufu, na hapa kinatawala mambo yote matatu yaliyoorodheshwa.
theological_decisions:
- issue: Mhusika anayerejelewa na viambishi vya kike katika wajibu wa mambo matatu
  choice: yule wa kwanza
  alternative: bila kutaja wazi ni mke yupi
  rationale: Muktadha wa sheria unaelekeza kwamba haki za mwanamke aliyetajwa kabla hazipaswi kupunguzwa baada ya mwanamume kuchukua mke mwingine. Ufafanuzi huu huzuia kiwakilishi cha Kiswahili kuwa na utata usio wa asili, bila kubadili wajibu wa sheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisheria. ‘Akijitwalia’ huhifadhi wazo la לקח לוֹ, huku ‘haki yake ya ndoa’ ikieleza kwa heshima neno adimu וְעֹנָתָהּ. Alama ya tanbihi [a] imewekwa katika matini kuu.
