  yaml_path: translation/ot/exodus/021/017.yaml
  text: Whoever curses his father or his mother shall surely be put to death[a].
translation:
  language: sw
  text: Yeyote anayemlaani baba yake au mama yake lazima auawe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa tafsiri ya neno kwa neno husema, “na mama yake”; katika muundo huu wa kisheria maana yake ni ya mgawanyo, yaani kumlaani mzazi yeyote kati ya hao wawili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְקַלֵּל
  choice: Yeyote anayemlaani
  rationale: Kirai cha kitenzi kilichotumika kama nomino kinatambulisha kwa ujumla mtu anayevunja sheria. “Anayemlaani” huhifadhi maana ya kusema laana dhidi ya mtu, badala ya maana pana zaidi ya kumtukana.
- source_word: אָבִיו
  choice: baba yake
  rationale: Huwakilisha moja kwa moja nomino yenye kiambishi cha nafsi ya tatu umoja wa kiume; katika Kiswahili, “yake” pia inafaa kwa mhusika wa kijumla.
- source_word: וְאִמּוֹ
  choice: au mama yake
  rationale: 'Ingawa וְ kwa kawaida ni “na,” hapa jozi ya wazazi ina nguvu ya mgawanyo: kosa linahusu kumlaani mzazi yeyote mmoja au wote wawili. “Au” huwasilisha wazi maana hiyo ya kisheria katika Kiswahili cha kawaida.'
- source_word: מוֹת יוּמָת
  choice: lazima auawe
  rationale: Muundo wa jina-kitenzi lisilo na kikomo pamoja na kitenzi cha kutendwa unasisitiza hukumu ya kifo inayotekelezwa na wengine. “Lazima auawe” huonyesha wajibu wa hukumu na hali ya kutendwa bila kudokeza kwamba mtu huyo atakufa tu kwa kawaida.
theological_decisions:
- issue: Nguvu ya kisheria ya jozi ya wazazi
  choice: Kosa linahusu kumlaani baba au mama, na hivyo limetafsiriwa “au mama yake.”
  alternative: 'Kufuata umbo la nje zaidi: “na mama yake.”'
  rationale: Kiunganishi cha Kiebrania ni waw, lakini katika sheria hii wazazi wanatajwa kama wahusika wawili ambao kila mmoja analindwa. “Au” huonyesha maana ya mgawanyo bila kupunguza wigo wa sheria.
- issue: Namna ya kutafsiri kauli ya hukumu ya kifo
  choice: “lazima auawe” kama hukumu inayopaswa kutekelezwa.
  alternative: “hakika atakufa” au “ni lazima afe.”
  rationale: Kauli ya Kiebrania iko katika hali ya kutendwa na inasisitizwa; inaeleza adhabu ya kifo inayowekwa, si utabiri wa kifo tu. Tafsiri iliyochaguliwa huhifadhi maana hiyo ya kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisheria lakini kinachoeleweka kwa urahisi. “Yeyote” huwasilisha mhusika wa kijumla, na “lazima auawe” hudumisha uzito wa hukumu.
