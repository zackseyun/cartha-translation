  text: But if a man schemes against his neighbor to kill him by treachery[c][b][a], you shall take him even from my altar to die.
translation:
  language: sw
  text: Lakini mtu akipanga njama[a] dhidi ya mwenzake ili kumuua kwa hila[b], utamwondoa hata kutoka kando ya madhabahu yangu[c] ili afe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akimtendea mwenzake kwa dharau ya makusudi.” Kitenzi cha Kiebrania kinaonyesha tendo la makusudi, la kujua na lisilo la bahati mbaya.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa ujanja” au “kwa udanganyifu.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, hata akitafuta hifadhi kando ya madhabahu, ataondolewa ili auawe.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Lakini ... aki-
  rationale: Kiunganishi hiki kinaanzisha hali ya masharti inayotofautishwa na mauaji yasiyokusudiwa katika sheria iliyotangulia; muundo wa “Lakini ... aki-” ni wa kawaida na wazi katika Kiswahili.
- source_word: יָזִד
  choice: akipanga njama
  rationale: Katika muktadha huu kitenzi kinaonyesha tendo la kukusudia na lililodhamiriwa, si ajali. “Kupanga njama” linaonyesha dhamira ya awali bila kulifanya neno lenyewe kuwa hukumu ya kisheria ya mauaji.
- source_word: אִישׁ
  choice: mtu
  rationale: Katika sheria hii nomino ya kiume ina matumizi ya jumla. “Mtu” ni Kiswahili cha kawaida na sahihi kwa mhusika yeyote anayehusika.
- source_word: עַל רֵעֵהוּ
  choice: dhidi ya mwenzake
  rationale: Kirai hiki kinaonyesha tendo la uhasama linaloelekezwa kwa mtu mwingine wa jamii. “Mwenzake” ni cha asili kuliko “jirani yake” katika muktadha huu wa kisheria.
- source_word: לְהָרְגוֹ
  choice: ili kumuua
  rationale: Huhifadhi maana ya moja kwa moja ya הרג na kusudi linaloonyeshwa na לְ, bila kutumia mapema neno la kisheria “kumwua kwa kukusudia.”
- source_word: בְעָרְמָה
  choice: kwa hila
  rationale: Neno hili linaashiria ujanja wa udanganyifu au hila. “Kwa hila” ni fupi, lenye uzito wa kimaadili, na linafaa katika lugha ya sheria.
- source_word: מֵעִם מִזְבְּחִי
  choice: hata kutoka kando ya madhabahu yangu
  rationale: מֵעִם huonyesha kuondolewa kutoka karibu au kando ya madhabahu. “Hata” huwasilisha mkazo unaodokezwa na amri kwamba mahali patakatifu hapampi kinga mkosaji wa kukusudia.
- source_word: תִּקָּחֶנּוּ
  choice: utamwondoa
  rationale: Kitenzi ni amri ya kisheria katika nafsi ya pili umoja. Katika muktadha wa kumtoa mtu mahali pa hifadhi, “utamwondoa” ni cha asili kuliko tafsiri ya neno kwa neno “utamchukua.”
- source_word: לָמוּת
  choice: ili afe
  rationale: Huhifadhi muundo wa kusudi au matokeo wa infinitivu ya Kiebrania bila kuweka wazi zaidi ya chanzo namna ya kifo hicho.
theological_decisions:
- issue: Iwapo madhabahu inampa muuaji wa kukusudia hifadhi
  choice: Amri inaonyesha kwamba hata madhabahu haimpi kinga mtu aliyepanga mauaji kwa hila.
  alternative: Kirai kinaweza kueleweka tu kuwa madhabahu ndiyo mahali anapoondolewa mtuhumiwa, bila kulenga moja kwa moja desturi ya hifadhi.
  rationale: Katika mfululizo wa sheria hizi na kwa kutajwa kwa “madhabahu yangu,” maana ya hifadhi inadokezwa kwa nguvu. Tafsiri inahifadhi dokezo hilo, huku tanbihi ikilieleza bila kulifanya kuwa maelezo marefu ndani ya mstari.
translation_notes:
  register: Lugha ni ya Kiswahili Sanifu cha Afrika Mashariki, ya sasa na yenye hadhi ya kisheria lakini inayoeleweka kwa urahisi. “Mwenzake,” “kwa hila,” na “kutoka kando ya madhabahu” huepuka tafsiri ngumu au yenye utata wa mahali, huku alama zote za tanbihi zikiwekwa karibu na maneno yanayohusika.
