translation:
  language: sw
  text: Na ikiwa asipomtimizia haya matatu[a], basi ataondoka huru, bila malipo ya fedha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asipomfanyia haya matatu.” Kiebrania husema kihalisi, “asipomfanyia haya matatu,” kikirejelea chakula, mavazi, na haki za ndoa zilizotajwa katika mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Na ikiwa
  rationale: Inaendeleza sharti la sheria kutoka mstari uliotangulia huku ikihifadhi kiunganishi ו kwa Kiswahili cha kawaida.
- source_word: שְׁלָשׁ אֵלֶּה
  choice: mambo haya matatu
  rationale: Neno “mambo” linawekwa wazi kwa kawaida ya Kiswahili na kurejelea wajibu ule wa aina tatu uliotajwa katika mstari uliotangulia.
- source_word: לֹא יַעֲשֶׂה לָהּ
  choice: hatamtendea
  rationale: Kitenzi עשה kina maana pana ya kufanya; “hatamtendea” kinabaki karibu na muundo wa Kiebrania na kuonyesha kuwa wajibu huo unamhusu mwanamke huyo bila kuufasiri kupita kiasi kuwa kutoa mahitaji.
- source_word: וְיָצְאָה
  choice: basi ataondoka
  rationale: יצא katika sheria kuhusu utumwa inaonyesha kutoka katika hali ya utumwa; “ataondoka” huhifadhi taswira hiyo, huku uhuru ukielezwa na neno linalofuata.
- source_word: חִנָּם
  choice: akiwa huru
  rationale: Katika muktadha huu neno linaashiria kuachiliwa bila gharama; “akiwa huru” ni usemi wa kawaida na wazi.
- source_word: אֵין כָּסֶף
  choice: bila kulipa fedha
  rationale: Inaonyesha wazi kwamba hakuna fedha zitakazohitajika kwa kuachiliwa kwake, kwa Kiswahili cha kisheria kinachoeleweka.
