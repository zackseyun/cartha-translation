lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Kifungu hiki kinaanzisha hali ya masharti inayotofautiana na uwezekano wa kuondoka huru katika muktadha uliotangulia.
- source_word: אָמֹר יֹאמַר
  choice: atasema waziwazi
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi chenye ukomo unasisitiza tamko; ‘waziwazi’ huonyesha kuwa ni tamko la dhahiri na la makusudi.
- source_word: הָעֶבֶד
  choice: mtumwa
  rationale: Muktadha wa kisheria unahusu mtu aliye katika utumwa ambaye kuachiliwa kwake kunajadiliwa; ‘mtumwa’ huweka wazi hali hiyo bila kuipunguza.
- source_word: אָהַבְתִּי
  choice: Ninampenda
  rationale: Ingawa Kiebrania kina umbo timilifu, hapa linaonyesha upendo na ushikamanifu wa sasa; wakati wa sasa ni wa kawaida na wazi katika Kiswahili.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Katika mazingira ya nyumba na utumwa, ‘bwana wangu’ huonyesha uhusiano wa mamlaka kwa lugha ya kawaida ya Kiswahili.
- source_word: אִשְׁתִּי
  choice: mke wangu
  rationale: Hii ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha umilikaji.
- source_word: בָּנָי
  choice: watoto wangu
  rationale: Neno hilo lina umbo la wingi wa kiume, yaani ‘wana wangu,’ lakini linaweza kutaja watoto kwa ujumla katika muktadha wa familia; tanbihi inahifadhi uwezekano wa maana finyu.
- source_word: לֹא אֵצֵא
  choice: sitaki kuondoka
  rationale: Katika muktadha wa tamko la hiari la kubaki, Kiswahili hiki huwasilisha maana ya kukataa kuondoka kwa kawaida, ingawa Kiebrania kwa karibu zaidi ni ‘sitaondoka.’
- source_word: חָפְשִׁי
  choice: nikiwa huru
  rationale: Kivumishi hiki kinaeleza hali ambayo angekuwa nayo wakati wa kuondoka; ‘nikiwa huru’ ni Kiswahili asilia na sahihi.
theological_decisions:
- issue: Tafsiri ya עבד katika sheria ya utumwa wa Waisraeli
  choice: mtumwa
  alternative: mtumishi; mtumwa wa kujifunga
  rationale: Aya inahusu kuachiliwa kutoka katika hali ya utumwa na kukataa uhuru huo; kwa hiyo hali ya mtu kuwa chini ya mamlaka ya bwana ni sehemu kuu ya maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Mtumwa’ limetumiwa kwa uwazi wa hali ya kisheria; tamko la moja kwa moja limewekwa katika lugha ya sasa na ya kawaida.
