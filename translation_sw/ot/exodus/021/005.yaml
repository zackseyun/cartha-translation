  text: Lakini ikiwa mtumwa atasema waziwazi[a], ‘Ninampenda bwana wangu, mke wangu na watoto wangu[b]; sitaondoka nikiwa huru,’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
