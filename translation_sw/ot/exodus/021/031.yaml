  language: sw
  text: Ikiwa ng’ombe atampiga pembe mwana wa kiume au mwana wa kike, atatendewa kulingana na hukumu hii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, hukumu ileile ya kisheria iliyotajwa katika mstari uliotangulia itatumika ikiwa ng’ombe atampiga pembe mwana wa kiume au mwana wa kike. Neno “hukumu” hapa linaweza pia kutafsiriwa “kanuni,” “utaratibu,” au “agizo la kisheria.” Neno “atatendewa” linamrejelea mwenye ng’ombe katika muktadha uliotangulia.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: Ikiwa
  rationale: Katika mfululizo huu wa sheria ya masharti, אוֹ inaanzisha hali nyingine inayowezekana; ‘Ikiwa’ ni Kiswahili cha kawaida kinachoendeleza mtiririko wa kisheria.
- source_word: בֵן
  choice: mwana wa kiume
  rationale: Huhifadhi maana ya בן na ulinganifu wake wa kijinsia na בַת, huku ikieleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: יִגָּח
  choice: atampiga pembe
  rationale: Kitenzi נגח humaanisha kupiga au kuchoma kwa pembe. Kirai hiki cha Kiswahili kinaonyesha tendo lenyewe kwa uwazi; mhusika ‘ng’ombe’ ametolewa katika muktadha uliotangulia.
- source_word: בַת
  choice: mwana wa kike
  rationale: Huhifadhi maana ya בַת na jozi yake ya kisheria na ‘mwana wa kiume.’
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: kulingana na hukumu hii
  rationale: מִשְׁפָּט hapa ni hukumu, kanuni, au uamuzi wa kisheria unaorejelea adhabu iliyotajwa katika mstari uliotangulia. ‘Hukumu hii’ hubaki karibu na Kiebrania bila kuondoa upana huo.
- source_word: יֵעָשֶׂה לּוֹ
  choice: mwenye ng’ombe atatendewa
  rationale: Niphal ya עשה ni ya kutendwa. Kiswahili hiki huhifadhi hali ya kutendewa na kinaweka wazi kwamba kiwakilishi לּוֹ kinamrejelea mwenye ng’ombe katika muktadha.
