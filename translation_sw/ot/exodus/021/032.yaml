base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/032.yaml
  text: If the ox gores a male servant or a female servant[a], he shall give thirty shekels of silver to his master, and the ox shall be stoned.
translation:
  language: sw
  text: Ikiwa ng’ombe atampiga kwa pembe mtumwa wa kiume au mtumwa wa kike[a], mwenye ng’ombe atampa bwana wa mtumwa huyo shekeli thelathini za fedha, naye ng’ombe atauawa kwa kupigwa mawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumishi wa kiume au mtumishi wa kike.” Kiebrania kinatumia maneno tofauti kwa mtumwa wa kiume (עֶבֶד) na mtumwa wa kike (אָמָה).
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: mtumwa wa kiume
  rationale: Katika sheria hii neno linaonyesha wazi hadhi ya utumwa, na linatofautishwa kijinsia na אָמָה. Tafsiri hii haipunguzi uzito wa hali hiyo kuwa utumishi wa kawaida.
- source_word: אָמָה
  choice: mtumwa wa kike
  rationale: Likiwa sambamba na עֶבֶד, neno hili humaanisha mwanamke aliye mtumwa. Usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa.
- source_word: יִגַּח
  choice: atampiga kwa pembe
  rationale: Kitenzi נגח katika sheria zinazohusu ng’ombe humaanisha kupiga au kutoboa kwa pembe; usemi huu unaeleweka kwa urahisi kuliko neno lisilo la kawaida.
- source_word: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים
  choice: shekeli thelathini za fedha
  rationale: Huhifadhi kiasi cha fedha kilichopimwa kwa shekeli bila kugeuza shekeli kuwa sarafu ya kisasa.
- source_word: יִתֵּן
  choice: atampa
  rationale: Wakati ujao wa Kiswahili katika muundo wa sheria ya masharti unaonyesha wajibu wa kisheria kwa njia ya asili na yenye hadhi.
- source_word: לַאדֹנָיו
  choice: bwana wa mtumwa huyo
  rationale: Kiambishi cha Kiebrania kinaelekea kumrejelea mtumwa aliyetajwa. Kurudia ‘mtumwa huyo’ huondoa utata usio wa maana katika Kiswahili, ambapo ‘bwana wake’ angeweza kudhaniwa kumrejelea ng’ombe.
- source_word: יִסָּקֵל
  choice: atauawa kwa kupigwa mawe
  rationale: Niphal ya סקל hapa inaeleza adhabu ya kifo kwa kupigwa mawe. Kutaja kifo wazi hutoa maana kamili na ya kawaida kwa msomaji wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisheria umehifadhiwa, huku sentensi ikibainisha kwa kawaida kwamba mlipaji ni mwenye ng’ombe na mpokeaji ni bwana wa mtumwa.
