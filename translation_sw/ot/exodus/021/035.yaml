base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
translation:
  language: sw
  text: Ikiwa ng’ombe wa mtu atampiga[a] ng’ombe wa mwenzake, na huyo akafa, watauza ng’ombe aliye hai na kugawana fedha za mauzo yake[b]. Pia watagawana ng’ombe aliyekufa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atamtia pembe”; kitenzi cha Kiebrania kinaweza kumaanisha pigo kali la ng’ombe.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wagawane fedha yake,” yaani fedha zilizopatikana kwa kumuuza ng’ombe aliye hai.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “aliyekufa,” yaani ng’ombe aliyekufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Ikiwa
  rationale: Kifungu hiki kinaanzisha sharti la kisheria. Kiswahili hakihitaji kiunganishi cha ziada mwanzoni ili kuhifadhi uhusiano wake na sheria zilizotangulia.
- source_word: יִגֹּף
  choice: atampiga
  rationale: Kitenzi hiki kinaweza kumaanisha kupiga kwa nguvu au kutia pembe. ‘Atampiga’ huhifadhi maana pana bila kulazimisha kwamba pigo hilo lilitolewa kwa pembe.
- source_word: שׁוֹר אִישׁ
  choice: ng’ombe wa mtu
  rationale: Hii ni namna ya kawaida na wazi ya kuonyesha umiliki katika Kiswahili.
- source_word: שׁוֹר רֵעֵהוּ
  choice: ng’ombe wa mwenzake
  rationale: ‘Mwenzake’ linafaa katika muktadha wa kisheria na linaonyesha mtu mwingine anayehusika bila kudokeza lazima wanaishi jirani.
- source_word: וָמֵת
  choice: na huyo akafa
  rationale: ‘Huyo’ huonyesha wazi kuwa anayekufa ni ng’ombe aliyepigwa, huku ikihifadhi matokeo rahisi yanayoelezwa na Kiebrania.
- source_word: וּמָכְרוּ
  choice: watauza
  rationale: Wakati ujao wa Kiswahili unaeleza matokeo au utaratibu unaotakiwa chini ya sharti hili la kisheria kwa njia ya kawaida.
- source_word: הַשּׁוֹר הַחַי
  choice: ng’ombe aliye hai
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili inayomtambulisha ng’ombe aliyebaki hai.
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  choice: na kugawana fedha za mauzo yake
  rationale: Kַּסְפּוֹ kihalisi ni ‘fedha yake,’ lakini hapa inamaanisha fedha zinazopatikana kwa kumuuza ng’ombe aliye hai. Tafsiri hii inaeleza maana hiyo kwa Kiswahili cha kawaida.
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  choice: Pia watagawana ng’ombe aliyekufa
  rationale: Kiebrania kinasema kihalisi ‘aliyekufa.’ Kurudia ‘ng’ombe’ huondoa utata usio wa lazima katika Kiswahili bila kutafsiri moja kwa moja kuwa ‘mzoga,’ neno ambalo lingekuwa la kufafanua zaidi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisheria ulio wazi, wa sasa, na wenye heshima. ‘Mwenzake’ ni la kawaida zaidi kuliko ‘jirani yake’ katika shauri la mali, na ‘ng’ombe aliyekufa’ ni wazi zaidi kuliko ‘aliyekufa’ peke yake.
