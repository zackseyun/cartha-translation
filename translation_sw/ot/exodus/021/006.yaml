  text: וְ/הִגִּישׁ֤/וֹ אֲדֹנָי/ו֙ אֶל הָ֣/אֱלֹהִ֔ים וְ/הִגִּישׁ/וֹ֙ אֶל הַ/דֶּ֔לֶת א֖וֹ אֶל הַ/מְּזוּזָ֑ה וְ/רָצַ֨ע אֲדֹנָ֤י/ו אֶת אָזְנ/וֹ֙ בַּ/מַּרְצֵ֔עַ וַ/עֲבָד֖/וֹ לְ/עֹלָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/006.yaml
  text: then his master shall bring him to God[a], and shall bring him to the door or to the doorpost, and his master shall pierce his ear with an awl; and he shall serve him forever.
translation:
  language: sw
  text: basi bwana wake atamleta mbele ya Mungu[a], kisha atamleta kwenye mlango au mwimo wa mlango; bwana wake atatoboa sikio lake kwa sindano ya kutobolea, naye atamtumikia maisha yake yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele ya waamuzi.” Katika baadhi ya miktadha ya kisheria, neno la Kiebrania אֱלֹהִים linaweza kumaanisha waamuzi wa kibinadamu au mamlaka ya mahakama.
    reason: alternative_reading
lexical_decisions:
- source_word: הִגִּישׁוֹ
  choice: atamleta mbele za
  rationale: Hifili ya נגשׁ inaonyesha kumleta mtu mbele ya mamlaka au mahali palipowekwa; usemi huu ni wa kawaida katika Kiswahili na unahifadhi maana ya utaratibu wa kisheria.
- source_word: אֲדֹנָיו
  choice: bwana wake
  rationale: Katika muktadha huu humaanisha mwenye mamlaka juu ya mtumwa; “bwana wake” ni tafsiri ya moja kwa moja na ya kawaida bila kudokeza kuwa ni Mungu.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Maana ya msingi ni Mungu, ingawa katika baadhi ya miktadha ya kisheria neno hili linaweza kueleweka kuwa waamuzi au mamlaka ya mahakama; uwezekano huo umewekwa katika tanbihi.
- source_word: הַדֶּלֶת
  choice: mlango
  rationale: Ni neno rahisi na sahihi kwa mlango halisi unaotajwa kama mahali pa ibada hii ya kisheria.
- source_word: הַמְּזוּזָה
  choice: mwimo wa mlango
  rationale: Hili ni neno la kawaida la Kiswahili kwa sehemu wima ya fremu ya mlango na ni maalumu zaidi kuliko “fremu ya mlango.”
- source_word: רָצַע
  choice: atalitoboa
  rationale: Kitenzi kinamaanisha kutoboa kwa chombo chenye ncha; “atalitoboa” kinaeleweka wazi pamoja na kitu chake, sikio.
- source_word: אָזְנוֹ
  choice: sikio lake
  rationale: Ni tafsiri ya moja kwa moja ya kiungo cha mwili kinachotajwa.
- source_word: בַּמַּרְצֵעַ
  choice: kwa uma
  rationale: מַרְצֵעַ ni chombo chenye ncha cha kutobolea; “uma” ni neno la Kiswahili linaloeleweka kwa chombo kama hicho katika muktadha huu.
- source_word: וַעֲבָדוֹ
  choice: naye atamtumikia
  rationale: Kitenzi עבד hapa kinaeleza huduma inayoendelea kwa bwana wake; “atamtumikia” kinahifadhi tendo badala ya kubadili kishazi kuwa jina la hadhi.
- source_word: לְעֹלָם
  choice: maisha yake yote
  rationale: Katika sheria hii usemi unaonyesha huduma ya kudumu hadi mwisho wa maisha ya mtu, si kutokuwa na mwisho kimetafizikia; tafsiri hii ni ya asili na wazi kwa msomaji wa kisasa.
theological_decisions:
- issue: Maana ya הָאֱלֹהִים katika muktadha wa kisheria
  choice: Mungu
  alternative: waamuzi
  rationale: הָאֱלֹהִים kimsingi humaanisha Mungu na inaweza kueleza kuletwa mbele zake katika tendo la agano lenye upande wa kisheria. Hata hivyo, maana ya waamuzi au mamlaka ya mahakama inawezekana katika baadhi ya maandiko ya sheria, hivyo haijaondolewa bali imehifadhiwa katika tanbihi.
- issue: Upeo wa לְעֹלָם
  choice: maisha yake yote
  alternative: milele
  rationale: Katika muktadha wa huduma ya mwanadamu, usemi huu unaelekea kumaanisha maisha yote au hali ya kudumu, si muda usio na mwisho kabisa. “Maisha yake yote” huwasilisha nguvu ya sheria bila kuingiza dai la kimetafizikia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kisheria umehifadhiwa kwa sentensi iliyo wazi; “mwimo wa mlango” na “maisha yake yote” zinakusudiwa kueleweka kwa wasomaji wa kawaida bila kufuta utata halisi wa הָאֱלֹהִים.
