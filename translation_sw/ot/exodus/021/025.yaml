translation:
  language: sw
  text: Jeraha la kuungua kwa jeraha la kuungua, jeraha kwa jeraha, chubuko[a] kwa chubuko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alama ya pigo kwa alama ya pigo”; neno la Kiebrania linaweza kumaanisha alama iliyoachwa na pigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּוִיָּה
  choice: jeraha la kuungua
  rationale: Nomino hii humaanisha jeraha au alama iliyosababishwa na kuungua. “Jeraha la kuungua” ni wazi katika Kiswahili cha sasa bila kuongeza umahususi wa kutiwa chapa.
- source_word: תַּחַת
  choice: kwa
  rationale: Katika kanuni hii ya kisheria, neno hili linaonyesha ulinganifu wa fidia au adhabu. “Kwa” huhifadhi mtindo mfupi na wa kurudiarudia wa Kiebrania.
- source_word: פֶּצַע
  choice: jeraha
  rationale: Neno hili linamaanisha jeraha la mwili kwa upana. “Jeraha” ni la kawaida, halibanwi na maana ya mkato pekee, na linafaa katika mfuatano huu.
- source_word: חַבּוּרָה
  choice: chubuko
  rationale: Neno hili hurejelea jeraha au alama inayoachwa na pigo. “Chubuko” ni neno linaloeleweka kwa urahisi na huhifadhi maana ya athari ya pigo mwilini.
