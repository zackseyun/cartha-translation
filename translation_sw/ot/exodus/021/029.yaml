  text: וְ/אִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִ/תְּמֹ֣ל שִׁלְשֹׁ֗ם וְ/הוּעַ֤ד בִּ/בְעָלָי/ו֙ וְ/לֹ֣א יִשְׁמְרֶ֔/נּוּ וְ/הֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַ/שּׁוֹר֙ יִסָּקֵ֔ל וְ/גַם בְּעָלָ֖י/ו יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/029.yaml
  text: But if the ox was accustomed to gore from yesterday and the day before[a], and its owner had been warned but did not keep it in, and it kills a man or a woman, the ox shall be stoned[b], and its owner also shall be put to death.
translation:
  language: sw
  text: Lakini ikiwa ng’ombe alikuwa na tabia ya kupiga kwa pembe tangu jana na juzi[a], na mwenye ng’ombe alikuwa ameonywa lakini hakumdhibiti, naye akamuua mwanamume au mwanamke, ng’ombe huyo atapigwa mawe[b], na mwenye ng’ombe pia atauawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “tangu jana na juzi”; hii ni nahau ya Kiebrania inayoonyesha tabia iliyokuwapo na kujulikana hapo awali.
    reason: cultural_note
  - marker: b
    text: Yaani, atapigwa mawe kama adhabu.
    reason: clarification
lexical_decisions:
- source_word: שׁוֹר
  choice: ng'ombe
  rationale: Katika sheria hii neno linamtaja mnyama mmoja wa jamii ya ng'ombe kwa ujumla, bila kulazimisha maana ya ng'ombe dume.
- source_word: נַגָּח
  choice: alikuwa na mazoea ya kupiga watu kwa pembe
  rationale: Umbo la neno la Kiebrania linaonyesha tabia inayojulikana na kujirudia, si tukio moja tu.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: tangu zamani
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kwamba tabia hiyo ilikuwa imekwisha kujulikana hapo awali; tafsiri hii ni ya asili katika Kiswahili.
- source_word: וְהוּעַד בִּבְעָלָיו
  choice: mwenyewe alikuwa ameonywa
  rationale: Katika muktadha wa kisheria, kauli hii inaonyesha kwamba mwenye mnyama alikuwa amearifiwa rasmi kuhusu hatari yake.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: hakumzuia
  rationale: Katika muktadha huu, kitendo cha kumlinda mnyama kinamaanisha kumdhibiti au kumfungia ili asilete madhara.
- source_word: וְהֵמִית
  choice: akamuua
  rationale: Kitenzi kinaeleza moja kwa moja kwamba mnyama alisababisha kifo cha mtu.
- source_word: אִישׁ אֹו אִשָּׁה
  choice: mwanamume au mwanamke
  rationale: Tafsiri inahifadhi kutajwa wazi kwa jinsia zote mbili kama ilivyo katika Kiebrania.
- source_word: יִסָּקֵל
  choice: lazima auawe kwa kupigwa mawe
  rationale: Kitenzi cha Kiebrania kinaagiza adhabu ya kuuawa kwa kupigwa mawe; Kiswahili hiki kinaweka wazi matokeo na njia.
- source_word: וְגַם בְּעָלָיו יוּמָת
  choice: mwenyewe pia lazima auawe
  rationale: Hii ni kauli ya kisheria ya hukumu ya kifo, si taarifa tu kwamba mwenye mnyama atakufa.
theological_decisions:
- issue: Nguvu ya kisheria ya adhabu ya mwenye mnyama
  choice: mwenyewe pia lazima auawe
  alternative: mwenyewe pia atakufa
  rationale: Kauli יוּמָת inaonyesha hukumu ya kifo inayotekelezwa, si kifo cha kawaida; tafsiri haibainishi njia kwa kuwa chanzo hakibainishi.
- issue: Jinsia ya aliyeuawa
  choice: mwanamume au mwanamke
  alternative: mtu
  rationale: Chanzo kinazitaja jinsia zote mbili wazi, kwa hiyo tafsiri inahifadhi ubainifu huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko ya kisheria. 'Mwenyewe' humrejelea mwenye ng'ombe; 'hakumzuia' hutoa kwa kawaida wazo la kutomdhibiti au kutomfungia mnyama hatari.
