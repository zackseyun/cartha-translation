base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/004.yaml
  text: If his master gives him a wife and she bears him sons or daughters[a], the wife and her children shall belong to her master[b], and he shall go out by himself.
translation:
  language: sw
  text: Ikiwa bwana wake atampa mke, naye akamzalia wana au mabinti, mke huyo pamoja na watoto wake watakuwa mali ya bwana wake,[a] naye ataondoka peke yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mke huyo na watoto wake watakuwa wa bwana wake.”
    reason: Njia nyingine ya kutafsiri muundo wa Kiebrania unaoeleza hali ya kisheria ya mke na watoto kuwa wa bwana wake.
  - marker: b
    text: Yaani, ataondoka bila mke na watoto aliopewa wakati wa utumishi wake.
    reason: Ufafanuzi wa nahau ya Kiebrania na hali ya kitamaduni inayodokezwa katika sheria hii.
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Hutambulisha sharti katika sheria ya aina ya kesi, hivyo “ikiwa” linaakisi muundo wa Kiebrania.
- source_word: אֲדֹנָיו
  choice: bwana wake
  rationale: Katika muktadha huu wa kisheria, “bwana” huonyesha mwenye mamlaka juu ya mtumwa bila kutumia neno linaloweza kudokeza tu ajira ya kawaida.
- source_word: יִתֶּן לוֹ אִשָּׁה
  choice: atampa mke
  rationale: אִשָּׁה linaweza kumaanisha mwanamke au mke; kuzaliwa kwa watoto na muktadha wa uhusiano uliopangwa na bwana vinaunga mkono “mke.”
- source_word: וְיָלְדָה לוֹ
  choice: naye akamzalia
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza kwamba mwanamke alimzalia huyo mwanamume watoto, huku ikihifadhi kiwakilishi cha yule mwanamume katika Kiebrania.
- source_word: בָנִים אוֹ בָנוֹת
  choice: wana au mabinti
  rationale: Kiebrania kinataja wazi watoto wa kiume na wa kike; tafsiri haifupishi kuwa “watoto” pekee.
- source_word: הָאִשָּׁה וִילָדֶיהָ
  choice: mke huyo pamoja na watoto wake
  rationale: “Mke huyo” hurejelea kwa uwazi mke aliyetajwa, na “pamoja na” huunda kirai asilia cha Kiswahili.
- source_word: תִּהְיֶה לַאדֹנֶיהָ
  choice: watakuwa wa bwana wake
  rationale: Muundo huu huhifadhi uhusiano wa kumilikiwa au kuwa chini ya mamlaka ya bwana bila kuongeza kwamba walikuwa wafanyakazi wa kawaida.
- source_word: וְהוּא יֵצֵא
  choice: naye ataondoka
  rationale: יצא kimsingi ni kwenda nje au kuondoka; katika sheria hii humaanisha kuondoka kwake mwishoni mwa utumishi, bila kulazimisha neno la kufasiri zaidi kama “ataachiliwa.”
- source_word: בְגַפּוֹ
  choice: peke yake
  rationale: Nahau hii ina maana ya kuondoka bila kuandamana na mke na watoto; “peke yake” ni Kiswahili cha kawaida na sahihi.
theological_decisions:
- issue: Istilahi ya utumwa na umiliki katika sheria hii
  choice: Kutumia “bwana” na “watakuwa wa” bila kupunguza ukali wa uhusiano wa kisheria.
  alternative: Kutumia lugha ya mwajiri na mwajiriwa, au kusema tu kwamba watabaki pamoja na bwana.
  rationale: Andiko linashughulikia hali ya utumwa au utumishi wa kifungo na linaeleza mamlaka ya bwana juu ya mke na watoto. Tafsiri inapaswa kuonyesha hali hiyo ya kisheria bila kuisitiri wala kuiongezea tathmini ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria umehifadhiwa, na sentensi imeunganishwa kwa viunganishi vya kawaida bila kulainisha hali ya utumwa iliyo katika chanzo.
