lexical_decisions:
- source_word: וְ/כִי
  choice: Na ... aki-
  rationale: Muundo huu unaendeleza uhusiano na sheria zilizotangulia na kuanzisha hali ya kisheria kwa Kiswahili cha kawaida.
- source_word: יִפְתַּח
  choice: akifungua
  rationale: Kitenzi cha Kiebrania humaanisha ‘kufungua’; hapa huenda kinarejelea kuacha wazi au kufunua shimo lililokuwapo, tofauti na kulichimba katika kishazi kinachofuata.
- source_word: אִישׁ
  choice: mtu
  rationale: Katika sheria hii אִישׁ ni umoja wa kiume unaotumiwa kwa hali ya jumla; ‘mtu’ ni tafsiri ya kawaida na wazi katika Kiswahili bila kupunguza wajibu wa mhusika.
- source_word: בּוֹר
  choice: shimo
  rationale: ‘Shimo’ ni neno pana na linalofaa kwa hatari iliyochimbwa au kufunuliwa; muktadha haulazimishi maana maalumu ya kisima cha kuhifadhia maji.
- source_word: א֠וֹ כִּי
  choice: au aki-
  rationale: Huonyesha hali nyingine ya kisheria inayolingana na kishazi cha kwanza.
- source_word: יִכְרֶה
  choice: akichimba
  rationale: Hueleza wazi tendo la kuchimba shimo jipya, likitofautishwa na kulifungua.
- source_word: וְ/לֹא יְכַסֶּנּוּ
  choice: na asifunike
  rationale: Hurejelea kutoweka kifuniko cha kimwili juu ya shimo ili kuzuia mnyama asianguke.
- source_word: וְ/נָפַל
  choice: kisha ... akaanguka
  rationale: Katika mfululizo huu wa sheria, tendo hilo ni matokeo yanayofuata hali iliyowekwa; ‘kisha ... akaanguka’ ni mtiririko wa kawaida wa Kiswahili.
- source_word: שָׁמָּה
  choice: ndani yake
  rationale: Hutoa maana ya kuelekea ndani ya shimo kwa Kiswahili cha kawaida badala ya tafsiri halisi ‘huko’.
- source_word: שּׁוֹר
  choice: ng’ombe
  rationale: שׁוֹר ni mnyama mmoja wa jamii ya ng’ombe; ‘ng’ombe’ ni neno la kawaida la Kiswahili na halilazimishi hali ya kuhasiwa ambayo ‘maksai’ ingeweza kudokeza.
- source_word: א֥וֹ חֲמוֹר
  choice: au punda
  rationale: Ni tafsiri ya kawaida na ya sasa ya mnyama huyu wa kufugwa.
