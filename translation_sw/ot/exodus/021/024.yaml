  text: eye for eye[a], tooth for tooth, hand for hand, foot for foot.
translation:
  language: sw
  text: jicho badala ya jicho[a], jino badala ya jino, mkono badala ya mkono, mguu badala ya mguu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jicho kwa jicho, jino kwa jino, mkono kwa mkono, mguu kwa mguu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: jicho
  rationale: Nomino hii inamaanisha jicho la mwili. Kutotumia kibainishi kunahifadhi mtindo mfupi wa kanuni ya kisheria katika Kiebrania.
- source_word: תַּחַת
  choice: badala ya
  rationale: Katika muktadha huu wa kisheria, neno hili halimaanishi mahali palipo chini, bali ulinganifu au fidia inayolingana. “Badala ya” ni ya asili katika Kiswahili na haiingizi ufafanuzi usio katika matini.
- source_word: שֵׁן
  choice: jino
  rationale: Nomino hii humaanisha jino, na inahifadhi mfuatano mfupi wa viungo vya mwili.
- source_word: יָד
  choice: mkono
  rationale: Maana ya kawaida hapa ni mkono wa mwili; chaguo hili linadumisha ulinganifu wa kileksia na mdundo wa mstari.
- source_word: רֶגֶל
  choice: mguu
  rationale: Neno linaweza kutaja wayo au mguu kwa upana zaidi. “Mguu” ni neno la kawaida la Kiswahili na linaacha kiwango hususa cha kiungo kikiwa na upana unaoruhusiwa na Kiebrania.
theological_decisions:
- issue: Asili ya kanuni ya kisheria
  choice: 'Kauli fupi ya malipo yanayolingana: “jicho badala ya jicho ... mguu badala ya mguu.”'
  alternative: Tafsiri yenye ufafanuzi zaidi, kama “adhabu ilingane na jeraha.”
  rationale: Kiebrania kina jozi za majina ya viungo vya mwili zilizounganishwa kwa תַּחַת pekee. Kufafanua kuwa ni “adhabu” kungeamua maana ambayo mstari wenyewe hauitamki wazi; tafsiri inadumisha ufupi na mvutano wa kanuni ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kurudiarudia umehifadhiwa ili kuonyesha ufupi na mdundo wa kanuni ya kisheria ya Kiebrania.
