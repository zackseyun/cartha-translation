  yaml_path: translation/ot/exodus/021/034.yaml
  text: The owner of the pit shall make restitution[a]; he shall pay money to its owner[b], and the dead animal shall be his.
translation:
  language: sw
  text: Mwenye shimo atalipa fidia; atampa mwenye mnyama fedha, na yule mnyama aliyekufa atakuwa mali ya mwenye shimo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּעַל הַבּוֹר
  choice: Mwenye shimo
  rationale: Katika sheria hii, kirai hiki humtaja anayemiliki au kuwajibika kwa shimo. ‘Mwenye shimo’ ni Kiswahili cha kawaida na wazi.
- source_word: יְשַׁלֵּם
  choice: atalipa fidia
  rationale: Katika muktadha wa kisheria, kitenzi hiki humaanisha kulipa ili kufidia hasara, si kulipa kwa maana ya jumla tu.
- source_word: כֶּסֶף יָשִׁיב
  choice: atampa ... fedha
  rationale: כֶּסֶף ni ‘fedha’ na יָשִׁיב kwa msingi ni ‘atarudisha’; pamoja hapa vinaeleza kumrudishia mwenye mnyama thamani yake kwa malipo.
- source_word: לִבְעָלָיו
  choice: mwenye mnyama
  rationale: Kiwakilishi kinamrejelea mwenye mnyama aliyekufa. Kutaja ‘mnyama’ huondoa utata usio wa lazima katika Kiswahili.
- source_word: וְהַמֵּת
  choice: yule mnyama aliyekufa
  rationale: Kwa msingi ni ‘aliyekufa’; nomino ‘mnyama’ imetajwa wazi kutokana na muktadha wa mstari uliotangulia.
- source_word: יִהְיֶה לוֹ
  choice: atakuwa wake
  rationale: Kirai hiki kinaonyesha kwamba mnyama aliyekufa anakuwa mali ya mwenye shimo, lakini Kiebrania hakielezi zaidi matumizi yake.
