base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/027.yaml
  text: And if he knocks out the tooth of his male servant or the tooth of his female servant[a], he shall let him go free in compensation for his tooth.
translation:
  language: sw
  text: Na ikiwa atasababisha jino la mtumwa wake wa kiume au la mtumwa wake wa kike lianguke, atamwachilia huru kwa fidia ya jino lake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Na mtu aki-
  rationale: Huendeleza mfululizo wa masharti ya kisheria kutoka mstari uliotangulia; muundo huu ni wa kawaida katika Kiswahili na unafanya mhusika wa kitendo awe wazi.
- source_word: שֵׁן
  choice: jino
  rationale: Ni neno la kawaida la kiungo hiki, nalo linahifadhi umoja wa Kiebrania.
- source_word: עַבְדּוֹ
  choice: mtumwa wake wa kiume
  rationale: Katika sheria hii עבד humaanisha mtu aliye chini ya utumwa; 'mtumwa' huonyesha hali hiyo ya kijamii na kisheria kwa usahihi kuliko 'mtumishi,' na 'wa kiume' huhifadhi tofauti ya kijinsia na neno linalofuata.
- source_word: אוֹ
  choice: au
  rationale: Kiunganishi cha kawaida kinachoonyesha uchaguzi kati ya hali mbili.
- source_word: אֲמָתוֹ
  choice: mtumwa wake wa kike
  rationale: Ni neno la jinsia ya kike linalolingana na עבד; tafsiri hii ni wazi, ya kisasa, na huhifadhi tofauti ya kijinsia ya chanzo.
- source_word: יַפִּיל
  choice: akiumbua
  rationale: Hifili ya נפל hapa ni kusababisha jino lianguke. 'Kuumbua jino' ni usemi wa asili wa Kiswahili kwa kuling'oa au kulitoa kwa pigo, bila kuongeza njia isiyotajwa wazi katika chanzo.
- source_word: לַחָפְשִׁי
  choice: huru
  rationale: Hueleza kuondolewa katika hali ya utumwa na kuingia katika uhuru; huungana kwa kawaida na kitenzi 'kumwachilia.'
- source_word: יְשַׁלְּחֶנּוּ
  choice: atamwachilia
  rationale: Katika muktadha huu wa sheria, שלח humaanisha kumruhusu aondoke au kumweka huru. Kiambishi cha yambwa katika Kiebrania ni cha kiume umoja, hivyo umbo la umoja limehifadhiwa huku tanbihi ikieleza matumizi yake kwa hali zote mbili.
- source_word: תַּחַת
  choice: kama fidia ya
  rationale: Hapa תחת huonyesha malipo au kufidia jeraha. 'Kama fidia ya' hufanya maana ya kisheria iwe wazi na ya asili katika Kiswahili.
- source_word: שִׁנּוֹ
  choice: jino lake
  rationale: Hurejelea jino la mtumwa aliyejeruhiwa, na umoja wa chanzo umehifadhiwa.
theological_decisions:
- issue: Istilahi ya utumwa katika sheria za Agano
  choice: mtumwa wa kiume / mtumwa wa kike
  alternative: mtumishi / mjakazi
  rationale: Aya hii inahusu haki ya kisheria ya mtu aliye katika hali ya utumwa baada ya kujeruhiwa. 'Mtumwa' huonyesha wazi zaidi uhalisi wa kijamii na kisheria wa עבד na אמה, bila kuficha au kulainisha hali hiyo; tofauti ya kijinsia pia imehifadhiwa kama ilivyo katika Kiebrania.
- issue: Kiambishi cha yambwa cha kiume umoja katika amri ya kuachilia
  choice: atamwachilia, pamoja na tanbihi ya matumizi kwa mtumwa wa jinsia yoyote
  alternative: atawaachilia huru
  rationale: Kiebrania hutumia kiambishi cha kiume umoja katika kanuni hii ya kisheria, ingawa sharti limetaja mtumwa wa kiume au wa kike. Tafsiri huhifadhi umoja wa kisarufi na tanbihi huhifadhi upana wa matumizi bila kutatua kimyakimya mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. 'Kuumbua jino' ni usemi mfupi na wa asili; 'kama fidia ya' huweka wazi uhusiano wa kisheria wa תחת. Alama ya tanbihi imewekwa baada ya sentensi kwa kuwa inaeleza kiwakilishi katika sehemu ya pili na matumizi ya sheria kwa jinsia zote.
