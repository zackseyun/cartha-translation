translation:
  language: sw
  text: Akiingia peke yake[a], atatoka peke yake; ikiwa ana mke[b], mke wake atatoka pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, usemi huu ni nahau inayomaanisha kwamba aliingia akiwa peke yake, bila kuandamana na mtu mwingine.
    reason: lexical_alternative
  - marker: b
    text: Au, “ikiwa ameoa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגַפּוֹ
  choice: peke yake
  rationale: Nahau hii katika sheria hii humaanisha kuwa mwanamume aliingia katika utumishi akiwa peke yake, bila kuandamana na mke; “peke yake” ni Kiswahili cha kawaida na huhifadhi ulinganifu wa sentensi.
- source_word: יָבֹא
  choice: aliingia
  rationale: Katika muktadha huu kitenzi kinahusu kuingia katika utumishi. Wakati uliopita katika Kiswahili unaeleza kwa kawaida hali iliyokuwapo alipoingia, huku sheria yenyewe ikitolewa kwa wakati ujao.
- source_word: יֵצֵא
  choice: ataondoka
  rationale: Katika sheria ya kuachiliwa, kitenzi kinamaanisha kutoka au kuondoka katika utumishi; “ataondoka” ni wazi na cha kawaida katika Kiswahili.
- source_word: בַּעַל אִשָּׁה
  choice: alikuwa na mke
  rationale: Usemi huu wa Kiebrania humaanisha mwanamume mwenye mke, yaani aliyeoa. “Alikuwa na mke” huhifadhi uhusiano uliotajwa na pia huonyesha kwamba hali hiyo ilikuwapo alipoingia katika utumishi.
- source_word: וְיָצְאָה אִשְׁתּוֹ עִמּוֹ
  choice: mke wake ataondoka pamoja naye
  rationale: Tafsiri hii huhifadhi kiima cha kike, uhusiano wa umilikaji, na wazo la mke kuondoka pamoja na mumewe.
