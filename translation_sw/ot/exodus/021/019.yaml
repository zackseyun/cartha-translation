base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/019.yaml
  text: If he gets up and walks about outside on his staff[a], then the one who struck him shall be cleared[c][b]; he must only pay for his lost time and have him thoroughly healed.
translation:
  language: sw
  text: Ikiwa mtu huyo atainuka na kutembea nje akijiegemeza kwa fimbo yake[a], basi aliyempiga atahesabiwa kuwa hana hatia; ila ni lazima amfidie kwa muda aliopoteza[b] na ahakikishe kwamba atapona kabisa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akitumia fimbo yake kujitegemeza.” Kiebrania kinasema kwa ukaribu zaidi, “juu ya fimbo yake,” kikionyesha kutembea kwa msaada kama dalili ya kuanza kupona.
    reason: lexical_alternative
  - marker: b
    text: “Muda aliopoteza” ni kipindi ambacho aliyejeruhiwa hakuweza kufanya kazi au shughuli zake za kawaida, ambacho kilipaswa kulipiwa fidia.
    reason: cultural_note
  - marker: c
    text: Kiebrania kinatumia usemi wa mkazo unaoweza kutafsiriwa neno kwa neno, “kuponya atamponya.” Maana yake ni kwamba aliyempiga lazima ahakikishe uponyaji kamili, yaelekea kwa kugharimia matibabu yanayohitajika.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָקוּם
  choice: Ikiwa mtu huyo atainuka
  rationale: Kisharti אִם kimewasilishwa kwa “ikiwa,” na קום hapa inaonyesha kuweza kuinuka baada ya jeraha.
- source_word: וְהִתְהַלֵּךְ בַּחוּץ
  choice: na kutembea nje
  rationale: Umbo la Hitpael linaonyesha kutembea au kwenda huku na huku; katika muktadha huu, kutembea nje ni ishara ya kuanza kupona.
- source_word: עַל מִשְׁעַנְתּוֹ
  choice: akijiegemeza kwa fimbo yake
  rationale: Hili linaweka wazi maana ya kutembea kwa msaada iliyo katika kirai cha Kiebrania “juu ya fimbo yake,” bila kubadili fimbo kuwa chombo cha aina ya kisasa zaidi.
- source_word: וְנִקָּה הַמַּכֶּה
  choice: aliyempiga atahesabiwa kuwa hana hatia
  rationale: נקה katika muktadha wa sheria humaanisha kuondolewa hatia au kutowajibika kwa adhabu iliyotajwa katika kesi hiyo; lugha hii inadumisha mvutano wa kisheria kwa kuwa wajibu wa fidia bado unafuata.
- source_word: רַק שִׁבְתּוֹ יִתֵּן
  choice: lakini ni lazima amfidie kwa muda aliopoteza
  rationale: רַק inaweka kikomo kwa wajibu unaobaki, na שִׁבְתּוֹ hapa inaelekea kumaanisha kipindi cha kutoweza kufanya shughuli za kawaida na hivyo muda uliopotea.
- source_word: וְרַפֹּא יְרַפֵּא
  choice: na ahakikishe kwamba amepona kabisa
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unatilia mkazo wajibu wa kuleta uponyaji kamili; tafsiri hii haidai kwamba aliyepiga ndiye anayemtibu binafsi.
