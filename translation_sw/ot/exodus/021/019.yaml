translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa kisheria ni wa heshima lakini unaeleweka kwa msomaji wa kawaida. “Akijiegemeza kwa fimbo” ni ya asili zaidi kuliko tafsiri ya neno kwa neno, na “ahakikishe kwamba amepona kabisa” huhifadhi mkazo wa Kiebrania bila kudai kwamba mkosaji ndiye tabibu.
