  text: Lakini ikiwa maafa yatatokea[a], utatoa uhai kwa uhai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jeraha kubwa” au “kifo”; neno la Kiebrania linaweza kumaanisha maafa au madhara makubwa, na wafasiri hutofautiana ikiwa muktadha unamaanisha jeraha kwa ujumla au kifo hasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Inaonyesha sharti lenye utofautishaji na mstari uliotangulia; ni Kiswahili cha kawaida na huhifadhi nguvu ya kiunganishi katika muktadha.
- source_word: אָסוֹן
  choice: madhara
  rationale: Neno hili linaweza kumaanisha madhara makubwa, msiba, au kifo. “Madhara” huhifadhi upana wake bila kuamua kwamba lazima yanahusu jeraha fulani au kifo.
- source_word: יִהְיֶה
  choice: yatatokea
  rationale: Huwakilisha kwa Kiswahili cha kawaida wazo la jambo kuwapo au kutukia katika sentensi hii ya sharti.
- source_word: וְנָתַתָּה
  choice: basi utatoa
  rationale: Huhifadhi maana ya msingi ya kutoa katika kauli ya kisheria bila kuielekeza isivyofaa kwenye malipo ya fedha.
- source_word: נֶפֶשׁ
  choice: uhai
  rationale: Katika fomula hii ya kisheria, neno linamaanisha uhai, si nafsi kama sehemu isiyo ya mwili; pia hudumisha ulinganifu wa kirai.
- source_word: תַּחַת
  choice: kwa
  rationale: Katika lugha ya adhabu yenye uwiano, huonyesha badala au ulinganifu; “kwa” ni fupi na ya kawaida katika “uhai kwa uhai.”
- source_word: נָפֶשׁ
  choice: uhai
  rationale: Kurudia neno lilelile huhifadhi ulinganifu na muundo wa kisheria wa Kiebrania.
theological_decisions:
- issue: Upeo na mhusika wa madhara yanayoelezwa na אָסוֹן
  choice: Kutafsiri kwa upana kuwa “madhara” bila kubainisha ikiwa yanamhusu mwanamke au mtoto, wala ikiwa lazima yawe kifo.
  alternative: “jeraha kubwa” au “kifo”
  rationale: Mstari wenyewe haubainishi kwa wazi mhusika wala kiwango cha madhara. Tafsiri pana huhifadhi utata na mvutano wa kifasiri badala ya kuamua suala linalobishaniwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Uhai kwa uhai” huhifadhi ufupi, marudio, na uzito wa fomula ya kisheria ya Kiebrania.
