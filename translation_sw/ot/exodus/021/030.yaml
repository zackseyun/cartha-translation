review_pass:
  verdict: revise
  source_fidelity: Draft faithfully conveys the conditional legal provision, the imposed ransom, and the payment that preserves the liable owner's life. However, “kiasi chote” narrows כְּכֹל אֲשֶׁר (“according to all that/whatever”) to a stated monetary amount; the Hebrew more broadly repeats whatever is imposed upon him.
  naturalness: “Gharama ya kuukomboa uhai wake” is understandable but somewhat heavy and less idiomatic than “bei ya ukombozi wa uhai wake.” “Kulingana na yote atakayotozwa” is natural legal Kiswahili and retains the source's repeated wording.
  terminology: “Fidia” suitably renders כֹּפֶר in this judicial context. “Bei ya ukombozi” distinctly renders פִּדְיֹן without importing cultic meaning, while “uhai wake” correctly reflects נַפְשׁוֹ here.
  issues:
  - severity: low
    issue: “kiasi chote atakachotozwa” is overly specific.
    rationale: The source says “according to all that is imposed on him,” not explicitly “the entire amount.” Removing “kiasi” preserves the broader repeated legal formulation.
  - severity: low
    issue: “gharama ya kuukomboa uhai wake” is stylistically cumbersome.
    rationale: “Bei ya ukombozi wa uhai wake” more naturally expresses פִּדְיֹן while preserving its lexical distinction from כֹּפֶר.
  revised_text: Ikiwa atatozwa fidia[a], atalipa bei ya ukombozi wa uhai wake, kulingana na yote atakayotozwa.
