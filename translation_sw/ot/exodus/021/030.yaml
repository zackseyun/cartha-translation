  - marker: a
    text: 'Au, “Ikiwa malipo ya fidia yatawekwa juu yake.” Kiebrania kinatumia maneno mawili yanayohusiana lakini tofauti: כֹּפֶר (“fidia”) na פִּדְיֹן (“bei ya ukombozi”).'
    reason: lexical_alternative
  revision_rationale: The revision retains the legal conditional and the two distinct Hebrew payment terms. It improves idiomatic Standard East African Swahili and avoids restricting the final clause to a numeric amount where the Hebrew states more generally that the payment is to correspond to all that is imposed on the person.
