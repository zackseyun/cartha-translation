  text: אִם כֹּ֖פֶר יוּשַׁ֣ת עָלָ֑י/ו וְ/נָתַן֙ פִּדְיֹ֣ן נַפְשׁ֔/וֹ כְּ/כֹ֥ל אֲשֶׁר יוּשַׁ֖ת עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/030.yaml
  text: If a ransom is imposed on him[a], then he shall give the redemption price for his life according to all that is imposed on him.
translation:
  language: sw
  text: Ikiwa atatozwa fidia[a], atalipa bei ya ukombozi wa uhai wake, kulingana na yote atakayotozwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Ikiwa malipo ya fidia yatawekwa juu yake.” Kiebrania kinatumia maneno mawili yanayohusiana lakini tofauti: כֹּפֶר (“fidia”) na פִּדְיֹן (“bei ya ukombozi”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Huanzisha sharti katika sheria inayofuatia; “ikiwa” ni kiunganishi cha kawaida na wazi cha sharti katika Kiswahili.
- source_word: כֹּפֶר
  choice: fidia
  rationale: Neno hili linamaanisha malipo yanayowekwa ili kuepusha adhabu au kuleta kuachiliwa. “Fidia” huhifadhi maana hiyo ya kisheria bila kuingiza moja kwa moja lugha ya kafara ya kidini.
- source_word: יוּשַׁת עָלָיו
  choice: itatozwa kwake
  rationale: Kauli hii inaonyesha wajibu wa malipo unaowekwa juu ya mtu. “Itatozwa kwake” ni Kiswahili cha sasa na cha kisheria kinachoeleweka.
- source_word: וְנָתַן
  choice: atalipa
  rationale: Ingawa kitenzi kwa msingi ni “atatoa,” katika muktadha wa kiasi cha fedha “atalipa” huwasilisha kwa kawaida tendo linalotakiwa kisheria.
- source_word: פִּדְיֹן נַפְשׁוֹ
  choice: gharama ya kuukomboa uhai wake
  rationale: Huhifadhi tofauti kati ya כֹּפֶר, “fidia,” na פִּדְיֹן, gharama au bei ya ukombozi, huku נֶפֶשׁ ikitafsiriwa kwa maana ya uhai katika muktadha huu.
- source_word: נַפְשׁוֹ
  choice: uhai wake
  rationale: Katika kesi hii ya adhabu inayohusu kifo, neno linarejelea uhai wa mtu, si sehemu isiyo ya kimwili iitwayo nafsi.
- source_word: כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו
  choice: kulingana na kiasi chote atakachotozwa
  rationale: Tafsiri hii inaonyesha kwamba lazima alipe kiasi kamili kitakachowekwa, na pia hurudia lugha ya kisheria ya kutoza kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Asili ya malipo katika kesi ambayo kwa kawaida ingehusisha adhabu ya kifo
  choice: Malipo yametafsiriwa kama “fidia” na “gharama ya kuukomboa uhai wake.”
  alternative: Kutafsiri maneno yote mawili kama “faini,” au kutumia lugha yenye maana dhahiri zaidi ya kafara ya kidini.
  rationale: Kifungu kinahusu malipo yanayowekwa kisheria ili kuokoa uhai wa mtu kutokana na adhabu iliyotajwa katika muktadha. Tafsiri huhifadhi msamiati wa kisheria wa fidia na ukombozi bila kudai kutokuwa na hatia kimaadili wala kuingiza fundisho la kafara lisilosemwa wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wenye heshima. “Itatozwa kwake” na “atalipa” ni maumbo ya kawaida, huku “gharama ya kuukomboa uhai wake” ikihifadhi tofauti muhimu ya msamiati wa Kiebrania.
