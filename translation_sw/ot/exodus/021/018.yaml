  text: If men quarrel and one strikes his neighbor with a stone or with his fist[a], and he does not die but is confined to bed,
translation:
  language: sw
  text: Ikiwa wanaume watagombana, na mmoja akampiga mwenzake kwa jiwe au kwa ngumi, naye asiwe amekufa bali awe amelala kitandani[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “aanguke kitandani”—yaani, alazwe au ashindwe kuendelea na shughuli zake kwa sababu ya jeraha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Ikiwa
  rationale: Kifungu hiki kinaanzisha hali ya kisheria; “ikiwa” ni ya kawaida na wazi katika sheria ya masharti.
- source_word: יְרִיבֻן
  choice: watagombana
  rationale: Kitenzi hiki humaanisha kugombana au kuzozana; hapa ugomvi unaongezeka na kuwa wa kimwili.
- source_word: אֲנָשִׁים
  choice: wanaume
  rationale: Nomino ya Kiebrania ni wingi wa kiume na inawataja wahusika wa kiume katika kesi hii.
- source_word: וְהִכָּה אִישׁ אֶת רֵעֵהוּ
  choice: mmoja wao ampige mwenzake
  rationale: Hutambulisha mmoja wa wale wanaume kuwa ndiye anayepiga; “mwenzake” ni Kiswahili cha kawaida kinachofaa kwa uhusiano huu.
- source_word: בְּאֶבֶן
  choice: kwa jiwe
  rationale: Herufi ya kiambishi בְּ inaonyesha chombo kilichotumiwa kupigia; “kwa jiwe” ni usemi wa kawaida wa Kiswahili.
- source_word: אוֹ בְאֶגְרֹף
  choice: au kwa ngumi
  rationale: אֶגְרֹף humaanisha ngumi; Kiswahili hakihitaji kuongeza kiwakilishi cha umilikaji hapa.
- source_word: וְלֹא יָמוּת
  choice: naye asife
  rationale: Huhifadhi uratibu wa Kiebrania na kueleza wazi kwamba aliyepigwa hafi.
- source_word: וְנָפַל לְמִשְׁכָּב
  choice: lakini alazimike kubaki kitandani
  rationale: Kwa neno moja moja ni “aanguke kitandani,” lakini ni nahau ya mtu aliyelazwa au asiyeweza kutoka kitandani kwa sababu ya jeraha.
