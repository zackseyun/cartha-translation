base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/022.yaml
  text: When men struggle together and strike a pregnant woman so that her children come out[a], but there is no harm, he shall surely be fined as the woman's husband imposes on him[c][b], and he shall pay according to the judges.
translation:
  language: sw
  text: Wanaume wakipigana, wakampiga mwanamke mjamzito, na watoto wake wakatoka[a], lakini pasiwe na madhara makubwa[b], lazima atozwe faini kadiri mume wa mwanamke atakavyomtoza, naye atalipa kwa uamuzi wa waamuzi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “watoto wake wakatoka.” Hii inaweza kumaanisha kujifungua kabla ya wakati; wengine huelewa kuwa ni kuharibika kwa mimba.
    reason: lexical_alternative
  - marker: b
    text: Mstari huu hautaji wazi kama madhara hayo yanamhusu mama, mtoto, au yeyote kati yao.
    reason: alternative_reading
  - marker: c
    text: Au, “kwa hukumu ya mahakama” au “mbele ya mahakama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי יִנָּצוּ אֲנָשִׁים
  choice: Wanaume wakipigana
  rationale: Hutanguliza kisa cha sheria na kueleza mapambano ya kimwili kati ya wanaume kwa Kiswahili cha kawaida.
- source_word: וְנָגְפוּ
  choice: na kumpiga
  rationale: Huhifadhi tendo halisi la kumpiga bila kuamua mapema ukubwa wa jeraha.
- source_word: אִשָּׁה הָרָה
  choice: mwanamke mjamzito
  rationale: Ni usemi wa sasa, wazi, na wa kawaida kwa hali inayotajwa.
- source_word: וְיָצְאוּ יְלָדֶיהָ
  choice: na watoto wake wakatoka
  rationale: Hufuata kwa karibu usemi wa Kiebrania na kuepuka kuamua kama ni kujifungua kabla ya wakati au kuharibika kwa mimba.
- source_word: וְלֹא יִהְיֶה אָסוֹן
  choice: lakini pasitokee madhara makubwa
  rationale: Neno אָסוֹן hudokeza madhara mazito au maafa; tafsiri hii huhifadhi uzito wake bila kuyafunga kwa kifo pekee.
- source_word: עָנוֹשׁ יֵעָנֵשׁ
  choice: lazima atozwe faini
  rationale: Muundo wa kusisitiza unaonyesha adhabu ya hakika, na muktadha unaonyesha kwamba adhabu hiyo ni malipo ya fedha.
- source_word: כַּאֲשֶׁר יָשִׁית עָלָיו בַּעַל הָאִשָּׁה
  choice: kulingana na kiasi atakachomwekea mume wa mwanamke
  rationale: Huhifadhi wazo la mume kuweka au kudai kiasi cha adhabu, bila kuficha utata wa uhusiano wake na uamuzi wa mahakama.
- source_word: וְנָתַן בִּפְלִלִים
  choice: naye atalipa kwa uamuzi wa waamuzi
  rationale: Katika muktadha wa kisheria, נתן ni kulipa, na בִּפְלִלִים inaelekeza kwenye tathmini au uamuzi rasmi wa kimahakama.
theological_decisions:
- issue: Je, kutoka kwa watoto kunamaanisha kuharibika kwa mimba au kujifungua kabla ya wakati?
  choice: watoto wake wakatoka
  alternative: akajifungua kabla ya wakati; mimba yake ikaharibika
  rationale: Kiebrania hakiamui wazi kati ya matokeo hayo, hivyo maandishi makuu yanahifadhi usemi wake mpana.
- issue: Madhara makubwa yanamhusu nani?
  choice: Kutotaja kama yanamhusu mama, mtoto, au yeyote kati yao
  alternative: Kuyahusisha na mama pekee; kuyahusisha na mama au mtoto
  rationale: Mstari huu wenyewe hautaji mhusika wa אָסוֹן, kwa hiyo tafsiri haipaswi kutatua kimya kimya utata wenye uzito wa kimaadili na kiteolojia.
- issue: Uhusiano kati ya kiasi anachoweka mume na uamuzi wa waamuzi
  choice: Kutaja dai la mume na malipo kwa uamuzi wa waamuzi
  alternative: Kufanya mume pekee aamue faini; kutafsiri kifungu chote kama uamuzi wa mahakama pekee
  rationale: Muundo wa Kiebrania unataja yote mawili; tafsiri huhifadhi mvutano huo wa kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi “watoto wake wakatoka” umeachwa kwa makusudi ukiwa karibu na Kiebrania ili kuhifadhi utata wa chanzo; maelezo ya chini yanafafanua tafsiri mbadala bila kuifanya mojawapo kuwa ya lazima.
