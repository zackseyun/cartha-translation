base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/037.yaml
  text: If a man steals an ox or a sheep and slaughters it or sells it[b][a], he shall repay five cattle for the ox and four sheep for the sheep.
translation:
  language: sw
  text: Mtu akiiba ng’ombe au kondoo[a], kisha akamchinja au kumuuza, atalipa[b] ng’ombe watano badala ya ng’ombe huyo, na kondoo wanne badala ya kondoo huyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania שֶׂה linaweza kumaanisha mnyama mmoja wa kundi dogo, yaani kondoo au mbuzi.
    reason: lexical_alternative
  - marker: b
    text: Au, “atatoa fidia.” Kitenzi cha Kiebrania hapa kina maana ya kisheria ya kulipa au kufidia hasara.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִגְנֹב אִישׁ
  choice: Mtu akiiba
  rationale: Muundo wa “aki-” unaanzisha sharti la sheria kwa Kiswahili cha kawaida. “Mtu” huwasilisha אִישׁ kwa njia ya asili bila kubadili mhusika kuwa kundi.
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: Katika muktadha huu wa mifugo na fidia, “ng’ombe” ni neno la kawaida na lenye upana unaofaa kuliko neno linalobainisha jinsia ya mnyama.
- source_word: שֶׂה
  choice: kondoo
  rationale: שֶׂה inaweza kumaanisha mnyama mmoja wa kundi dogo, awe kondoo au mbuzi. “Kondoo” inasomeka kwa urahisi hapa, huku tanbihi ikihifadhi upana wa neno la Kiebrania.
- source_word: וּטְבָחוֹ
  choice: kisha akamchinja
  rationale: טבח humaanisha kuchinja, si kuua kwa ujumla. “Kisha” huunganisha kitendo hiki kwa kawaida na wizi uliotajwa.
- source_word: אוֹ מְכָרוֹ
  choice: au kumuuza
  rationale: Tafsiri ya moja kwa moja na ya asili ya tendo mbadala la kumuuza mnyama aliyeibwa.
- source_word: יְשַׁלֵּם
  choice: atalipa
  rationale: Katika sheria hii שלם ina maana ya kulipa fidia au kurejesha kwa malipo. “Atalipa” ni fupi na wazi, na uwiano unaofuata unaonyesha kuwa ni fidia.
- source_word: חֲמִשָּׁה בָקָר
  choice: ng’ombe watano
  rationale: בָקָר ni jina la jumla la ng’ombe; Kiswahili huhesabu kwa kawaida “ng’ombe watano.”
- source_word: וְאַרְבַּע צֹאן
  choice: na kondoo wanne
  rationale: צֹאן ni kundi la mifugo midogo, lakini “kondoo wanne” hudumisha ulinganifu wa wazi na “kondoo” aliyetajwa katika sharti; upana wa istilahi umeelezwa katika tanbihi.
- source_word: תַּחַת
  choice: badala ya
  rationale: Huhifadhi wazi maana ya kitu kinachotolewa mahali pa kingine katika fidia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa kisheria ulio wazi, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa masharti umetolewa kwa “aki- … ata-,” na istilahi za mifugo zimewekwa katika lugha ya kawaida huku upana wa Kiebrania ukihifadhiwa katika tanbihi.
