  text: Whoever strikes his father or his mother shall surely be put to death[a].
translation:
  language: sw
  text: Yeyote anayempiga baba yake au mama yake lazima auawe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “na mama yake”; hapa limetafsiriwa “au mama yake” kuonyesha maana ya kisheria kwamba kumpiga baba au mama, yeyote kati yao, ndiko kunakokusudiwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: anayempiga
  rationale: Kitenzi hiki ni umbo la kishiriki kutoka נכה, likimaanisha mtu anayepiga. ‘Anayempiga’ ni Kiswahili cha kawaida na wazi kinachohifadhi tendo la kimwili bila kuliongezea maana ya kumpiga mara nyingi au kutumia silaha.
- source_word: אָבִיו
  choice: baba yake
  rationale: Kiebrania kinamtaja wazi baba yake katika umoja; ‘baba yake’ huhifadhi umahususi huo.
- source_word: אִמּוֹ
  choice: mama yake
  rationale: Kiebrania kinamtaja wazi mama yake; kutaja baba na mama mmoja mmoja huhifadhi muundo na umahususi wa sheria.
- source_word: מוֹת יוּמָת
  choice: lazima auawe
  rationale: Muundo wa kitenzi-jina cha kusisitiza pamoja na kitenzi cha hali ya kutendwa ni kauli ya kisheria ya hukumu ya kifo. ‘Lazima auawe’ huhifadhi msisitizo na kuonyesha kwamba ni adhabu inayotekelezwa, si taarifa tu kwamba mtu huyo atakufa.
- source_word: וּ / וְ
  choice: au
  rationale: Ingawa kiunganishi cha Kiebrania kwa kawaida ni ‘na’, katika sheria hii maana ni kwamba kumpiga mzazi yeyote kati ya hao wawili kunaleta adhabu. ‘Au’ huzuia dhana potovu kwamba ni lazima awapige wote wawili.
theological_decisions:
- issue: Uwasilishaji wa kauli ya adhabu ya kisheria
  choice: lazima auawe
  alternative: hakika atauawa
  rationale: Aya inaweka hukumu ya kimahakama, si kutabiri tu kifo. Hali ya kutendwa inaonyesha kuuawa chini ya adhabu ya sheria, huku ‘lazima’ ikibeba nguvu ya muundo wa kusisitiza wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya matini ya sheria. ‘Yeyote anayempiga’ ni cha kawaida na kinachoeleweka; ‘lazima auawe’ huhifadhi uzito wa kauli ya adhabu bila kutumia lugha ya kizamani.
