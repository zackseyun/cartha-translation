  yaml_path: translation/ot/exodus/021/002.yaml
  text: If you buy a Hebrew servant[a], he shall serve six years, but in the seventh he shall go out free[b], without payment.
translation:
  language: sw
  text: Ukimnunua[a] mtumwa Mwebrania, atatumikia kwa miaka sita, lakini mwaka wa saba ataondoka akiwa huru, bila malipo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unapomnunua.” Chembe ya Kiebrania inaweza kuanzisha sheria hii kwa maana ya “ikiwa” au “wakati.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “ataondoka kwenda kwenye uhuru, bure.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Uki-
  rationale: Katika sheria ya kutoa mfano wa kesi, chembe hii huanzisha hali inayoweza kutafsiriwa kwa maana ya “ikiwa” au “wakati.” Muundo wa Kiswahili “ukimnunua” ni wa kawaida na wa wazi katika muktadha huu.
- source_word: תִקְנֶה
  choice: mnunua
  rationale: Kitenzi קנה hapa kina maana ya kununua au kujipatia; “kununua” kinaonyesha wazi muktadha wa kibiashara.
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Mtu anayezungumziwa amenunuliwa na yuko katika hali ya utumwa wa muda maalumu. “Mtumwa” linaonyesha hali hiyo kwa uwazi kuliko “mtumishi.”
- source_word: עִבְרִי
  choice: Mwebrania
  rationale: Neno la Kiebrania linamtambulisha mtu huyo kuwa Mwebrania; halipaswi kupanuliwa kimya kimya kuwa “Mwisraeli.”
- source_word: שֵׁשׁ שָׁנִים
  choice: kwa miaka sita
  rationale: Huu ni muda wa utumishi; kihusishi “kwa” kinafanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: יַעֲבֹד
  choice: atakutumikia
  rationale: עבד humaanisha kufanya kazi au kutumikia. Kiambishi cha yambwa “-ku-” kinaweka wazi kuwa utumishi ni kwa mnunuzi anayesemeshwa, jambo linalodokezwa na muktadha wa nafsi ya pili.
- source_word: וּבַשְּׁבִעִת
  choice: lakini mwaka wa saba
  rationale: Ingawa ו kwa msingi ni “na,” hapa inaonyesha tofauti kati ya miaka sita ya utumishi na mwaka wa kuachiliwa. Kutaja “mwaka” wazi ni kwa ajili ya Kiswahili cha kawaida.
- source_word: יֵצֵא לַחָפְשִׁי
  choice: ataondoka akiwa huru
  rationale: Tafsiri hii inahifadhi taswira ya kutoka au kuondoka na pia matokeo yake, yaani kuwa huru, bila kuibadili tu kuwa kauli tendwa “ataachiliwa.”
- source_word: חִנָּם
  choice: bila malipo
  rationale: Neno hili linaonyesha kwamba kuondoka kwake hakutahitaji malipo; “bila malipo” ni wazi na lenye hadhi katika Kiswahili cha sasa.
theological_decisions:
- issue: Tafsiri ya עֶבֶד katika sheria inayohusu mtu aliyenunuliwa
  choice: mtumwa
  alternative: mtumishi; mtumwa wa deni
  rationale: Andiko linazungumzia mtu aliyenunuliwa na aliyefungwa kutumikia kwa kipindi fulani. “Mtumwa” halifichi hali hiyo, huku aya yenyewe ikiweka kikomo cha miaka sita bila kuhitaji kuongeza aina maalumu ya utumwa ambayo haijatajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwebrania” limetumiwa badala ya “Mwisraeli” ili kufuata istilahi mahsusi ya chanzo. Muundo umeweka wazi tofauti kati ya kipindi cha utumishi na kuondoka huru mwaka wa saba.
