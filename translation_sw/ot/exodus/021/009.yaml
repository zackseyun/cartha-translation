  text: Lakini akimtengea mwanawe, atamtendea kulingana na haki za mabinti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na desturi inayofuatwa kwa mabinti.” Kirai cha Kiebrania kinaweza kumaanisha utaratibu wa kisheria uliowekwa au desturi ya kuwatendea mabinti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini aki-
  rationale: Inaendeleza kesi ya kisheria yenye sharti huku ikionyesha tofauti na kesi iliyotangulia.
- source_word: לִבְנוֹ
  choice: kwa ajili ya mwanawe
  rationale: Kihusishi ל hapa kinaonyesha kwamba msichana anawekwa kwa mwana katika mpango wa ndoa; usemi huu ni wa kawaida na hauashirii umilikishaji.
- source_word: יִיעָדֶנָּה
  choice: akimweka
  rationale: Kitenzi יעד hapa kina maana ya kumteua au kumkusudia kwa uhusiano wa ndoa. 'Kumweka' huhifadhi upana wa maana bila kufafanua kupita kiasi kuwa ni kumposa.
- source_word: כְּמִשְׁפַּט
  choice: kulingana na haki za
  rationale: Katika muktadha wa sheria, מִשְׁפָּט inaweza kumaanisha haki au masharti yanayostahili mtu, si hukumu pekee.
- source_word: הַבָּנוֹת
  choice: binti
  rationale: Neno la Kiebrania linamaanisha mabinti; katika Kiswahili, 'haki za binti' hutoa maana ya kundi kwa njia ya kawaida na yenye kueleweka.
- source_word: יַעֲשֶׂה לָּהּ
  choice: amtendee
  rationale: Muundo עשה + ל unaonyesha kitendo kinachoelekezwa kwa mtu; 'amtendee' ni usemi wa kisheria ulio wazi na wa asili.
theological_decisions:
- issue: Wajibu kwa msichana aliyewekwa kwa ajili ya mwana
  choice: Atendewe kulingana na haki zinazowastahili mabinti.
  alternative: Atendewe kulingana na desturi inayofuatwa kwa mabinti.
  rationale: Kirai כמשפט הבנות kinaweza kuwa na nguvu ya kisheria au kurejelea utaratibu uliozoeleka. Matini kuu inaonyesha nguvu ya haki za kisheria, huku tanbihi ikihifadhi uwezekano wa maana ya desturi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Tafsiri inadumisha muundo wa sheria wenye sharti na haitafsiri יעד kwa neno mahususi zaidi la 'kumposa'.
