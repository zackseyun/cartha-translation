base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/008.yaml
  text: If she is displeasing in the eyes of her master[a], who has not designated her for himself, then he shall let her be redeemed. He has no right to sell her to a foreign people[b], since he has dealt deceitfully with her.
translation:
  language: sw
  text: Ikiwa hampendezi bwana wake[a], ambaye hakumteua kwa ajili yake mwenyewe, basi atamruhusu akombolewe. Hana mamlaka ya kumuuza kwa watu wa kigeni, kwa sababu ametenda kwa hila dhidi yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye amemteua au alimchumbia kwa ajili yake mwenyewe.” Kishazi hiki cha Kiebrania kina ugumu wa kimaandishi na wa kufasiri.
    reason: textual_variant
  - marker: b
    text: Au, “kwa sababu amemsaliti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה בְּעֵינֵי
  choice: hampendezi
  rationale: Nahau hii inaonyesha kutokubalika au kutopendeza kwa mtu fulani, si kuwa mwovu kimaadili; Kiswahili cha moja kwa moja ni cha asili na wazi.
- source_word: אֲדֹנֶיהָ
  choice: bwana wake
  rationale: Katika sheria hii neno linamtaja mwanamume mwenye mamlaka ya kijamii na kisheria juu yake; “bwana wake” ni la kawaida na halimaanishi cheo cha Mungu hapa.
- source_word: יְעָדָהּ
  choice: hakumteua kwa ajili yake mwenyewe
  rationale: “Kumteua” huhifadhi upana wa kitenzi, huku muktadha ukidokeza uteuzi kwa uhusiano wa ndoa; utata wa mapokeo ya maandishi umeonyeshwa katika tanbihi.
- source_word: וְהֶפְדָּהּ
  choice: atamruhusu akombolewe
  rationale: Hifili hapa yaweza kumaanisha kuwezesha au kuruhusu ukombozi, bila kudai kwamba bwana mwenyewe ndiye anayelipa gharama.
- source_word: לְעַם נָכְרִי
  choice: kwa watu wa kigeni
  rationale: Usemi wa Kiebrania ni wa kijumla na unaonyesha watu walio nje ya jamii husika; tafsiri hii ni ya asili katika Kiswahili.
- source_word: לֹא יִמְשֹׁל לְמָכְרָהּ
  choice: Hana mamlaka ya kumuuza
  rationale: Muundo wenye משל unaonyesha mamlaka au haki ya kisheria, si uwezo wa kimwili tu.
- source_word: בְּבִגְדוֹ בָהּ
  choice: kwa kuwa amemtendea kwa hila
  rationale: בגד humaanisha kutenda kwa udanganyifu au kukosa uaminifu; tanbihi inahifadhi maana kali zaidi ya usaliti.
theological_decisions:
- issue: Utata wa יְעָדָהּ pamoja na tofauti inayohusishwa na ketiv/qere
  choice: ambaye hakumteua kwa ajili yake mwenyewe
  alternative: ambaye alimchumbia/alimteua kwa ajili yake mwenyewe
  rationale: Maandishi ya Kimasoreti yana ugumu unaojulikana kuhusu kuwepo au kutokuwepo kwa ukanushi na kuhusu kama kitenzi kinapaswa kufafanuliwa mahsusi kuwa uchumba. Matini kuu inafuata לא, huku tanbihi ikihifadhi usomaji mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ya kisheria imewasilishwa kwa uwazi kwa kutumia “mamlaka” na “akombolewe,” huku utata halisi wa maandishi ukihifadhiwa katika tanbihi.
