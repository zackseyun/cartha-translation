  yaml_path: translation/ot/exodus/032/025.yaml
  text: When Moses saw that the people were out of control—for Aaron had let them get out of control[b][a], for a derision among those who rose against them—
translation:
  language: sw
  text: Musa alipoona kwamba watu walikuwa bila kizuizi—kwa maana Haruni alikuwa amewaacha bila kizuizi, hivi kwamba wakawa kitu cha dhihaka miongoni mwa wale waliowainukia[a][b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu walikuwa hawajazuiliwa” / “Haruni alikuwa amewaacha huru.” Kiebrania kinarudia mzizi uleule kueleza hali ya watu na kitendo cha Haruni.
    reason: lexical_alternative
  - marker: b
    text: Au, “mbele ya adui zao” au “miongoni mwa wale waliowapinga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Musa alipoona
  rationale: Muundo huu wa wakati unaunganisha kwa ufasaha alichoona Musa na hatua inayofuata katika simulizi, huku ukiendeleza mtiririko wa waw-consecutive.
- source_word: הָעָם
  choice: watu
  rationale: Hapa neno hili linamaanisha jumuiya ya Israeli kambini; “watu” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: כִּי פָרֻעַ הוּא
  choice: kwamba watu walikuwa wameachiliwa ovyo
  rationale: Umbo hili la mzizi פרע linaonyesha kuondolewa kwa kizuizi au udhibiti. “Wameachiliwa ovyo” linaeleza hali ya kukosa udhibiti bila kulibana neno hilo kuwa uchi au uasherati.
- source_word: כִּי פְרָעֹה אַהֲרֹן
  choice: kwa maana Haruni alikuwa amewaachilia ovyo
  rationale: Tafsiri inarudia maneno “achiliwa/achilia ovyo” ili kuakisi kurudiwa kwa mzizi פרע na inaonyesha wajibu wa Haruni bila kudai kwamba alikusudia matokeo hayo.
- source_word: לְשִׁמְצָה
  choice: na hivyo wakawa kitu cha dhihaka
  rationale: שִׁמְצָה huhusu fedheha, dharau, au maneno ya kuwakejeli. Kauli hii ni ya kawaida katika Kiswahili na hapa inaonyesha matokeo ya hali yao.
- source_word: בְּקָמֵיהֶם
  choice: miongoni mwa wale waliowapinga
  rationale: Kirai hiki kinatokana na קום na kwa maana halisi hurejelea wale wanaoinuka dhidi yao; “wale waliowapinga” huhifadhi wazo hilo bila kulazimisha wawe maadui wa kivita pekee.
theological_decisions:
- issue: Maana ya kijamii na kimaadili ya פרע
  choice: wameachiliwa ovyo / amewaachilia ovyo
  alternative: bila kujizuia; bila kizuizi; uchi au wamefunuliwa
  rationale: Katika muktadha huu mkazo uko katika kuondolewa kwa udhibiti na kuzuka kwa vurugu au ukosefu wa nidhamu chini ya Haruni. Kutafsiri “uchi” kungebana maana isivyo lazima na huenda kungeingiza dai maalumu lisilothibitishwa wazi na mstari.
- issue: Nguvu ya לְ katika לְשִׁמְצָה
  choice: na hivyo wakawa kitu cha dhihaka
  alternative: ili wawe kitu cha dhihaka; kwa dhihaka
  rationale: Kihusishi kinaweza kuonyesha kusudi au matokeo. Muktadha unaelekea kwenye matokeo, lakini uwezekano wa kusudi umehifadhiwa katika tanbihi badala ya kudai uhakika usiokuwapo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wameachiliwa ovyo” ni usemi unaoeleweka kwa wasomaji wa kawaida na unaruhusu kurudiwa kwa mzizi wa Kiebrania. Mistari mirefu imetumiwa kuonyesha sentensi ya maelezo iliyoachwa wazi kuelekea hatua inayofuata katika mstari wa 26.
