  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
translation:
  language: sw
  text: Nikawaambia[a], ‘Yeyote aliye na dhahabu, aivue.’ Basi wakanipa, nami nikaitupa motoni, na ndama huyu akatokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Nikawaambia, ‘Ni nani aliye na dhahabu? Ivunjeni.’” Kiebrania hasa: “Dhahabu iko kwa nani? Jivueni [dhahabu].”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Nikawaambia
  rationale: Wayyiqtol ya אמר inaendeleza mfululizo wa simulizi; kiambishi cha kitu cha wingi katika Kiswahili kinaonyesha wazi kwamba aliwaambia wao bila kuongeza maana nyingine.
- source_word: לְמִי זָהָב
  choice: Yeyote aliye na dhahabu
  rationale: Nahau halisi ‘aliye na dhahabu ni nani’ inaonyesha umilikaji kwa maana isiyoainishwa; ‘yeyote aliye na dhahabu’ ni Kiswahili cha kawaida na kinafaa katika usemi wa moja kwa moja.
- source_word: הִתְפָּרָקוּ
  choice: aivue
  rationale: Hitpael ya פרק hapa inamaanisha kuondoa mwilini mapambo ya dhahabu. ‘Aivue’ ni ya asili katika Kiswahili na kitu kinachorejelewa, dhahabu iliyovaliwa, kinaeleweka kutokana na muktadha.
- source_word: וַיִּתְּנוּ לִי
  choice: Basi wakanipa
  rationale: Kitenzi kina mhusika wa wingi na mpokeaji wa nafsi ya kwanza umoja. Kiswahili kinaweza kuacha kitu kinachotolewa kwa kuwa dhahabu imetajwa tayari; ‘basi’ huonyesha mwendelezo wa kitendo bila kuufafanua kupita kiasi.
- source_word: וָאַשְׁלִכֵהוּ
  choice: nami nikaitupa
  rationale: שלך ni kutupa; kiambishi -i- kinarejelea dhahabu kama kitu cha pamoja, na ‘nami’ huhifadhi mfuatano wa maelezo ya Haruni.
- source_word: בָאֵשׁ
  choice: motoni
  rationale: Ingawa kihusishi cha Kiebrania kimsingi ni ‘katika,’ Kiswahili pamoja na ‘kutupa’ hutumia kwa kawaida ‘motoni’ kuonyesha mwendo wa kuingia ndani ya moto.
- source_word: וַיֵּצֵא
  choice: akatokea
  rationale: Kitenzi kina maana ya kutoka au kutokea. ‘Akatokea’ ni cha kawaida na huhifadhi madai ya moja kwa moja na yenye kukwepa ya Haruni bila kuongeza maelezo.
- source_word: הָעֵגֶל הַזֶּה
  choice: ndama huyu
  rationale: עגל ni ndama au fahali mchanga. ‘Ndama’ ndilo neno la kawaida na linalofaa kwa sanamu iliyotajwa katika muktadha; aya hii haisemi ‘wa kusubu,’ hivyo maelezo hayo hayaongezwi.
theological_decisions:
- issue: Maelezo ya Haruni yanayokwepa kuhusu asili ya sanamu
  choice: Kauli imetafsiriwa moja kwa moja bila kuongeza maneno kama ‘kimiujiza’ au ‘eti.’
  alternative: Kufafanua kejeli au udanganyifu wa Haruni ndani ya matini kuu.
  rationale: Aya inawasilisha maneno ya Haruni yenyewe. Tafsiri inapaswa kuacha muktadha ufunue ukwepaji wake badala ya kuuingiza kama maoni ya mtafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ni wa asili kwa msomaji wa kawaida, huku tanbihi ikihifadhi umbo na utata wa usemi wa Kiebrania.
