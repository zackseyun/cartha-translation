base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/033.yaml
  text: And Yahweh said to Moses[a], “Whoever has sinned against me[b], I will blot him out of my book.”
translation:
  language: sw
  text: Yahwe akamwambia Musa, “Yeyote aliyenitenda dhambi, nitamfuta katika kitabu changu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda ‘kitabu changu’ kikamaanisha kumbukumbu ya Mungu ya wale walio chini ya uangalizi wake; wengine hukielewa hasa kuwa ‘kitabu cha uzima.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa kiambishi cha usimulizi unaendeleza simulizi; ‘akamwambia’ ni wa asili katika Kiswahili na pia unaonyesha kuwa maneno yanaelekezwa kwa Musa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti nne limetoholewa kama jina binafsi badala ya kubadilishwa na cheo ‘BWANA’.
- source_word: אֶל מֹשֶׁה
  choice: Musa
  rationale: ‘Musa’ ndiyo namna sanifu ya Kiswahili ya jina hili; maana ya אֶל imejumuishwa kiasili katika kitenzi ‘akamwambia’.
- source_word: מִי אֲשֶׁר
  choice: Yeyote
  rationale: Huhifadhi maana ya jumla ya kishazi cha uhusiano kisicho na mtajwa maalumu.
- source_word: חָטָא לִי
  choice: aliyenitenda dhambi
  rationale: Huwasilisha kosa lililokamilika na kuelekezwa dhidi ya Mungu kwa Kiswahili cha kawaida na chenye heshima.
- source_word: אֶמְחֶנּוּ
  choice: nitamfuta
  rationale: מחָה hapa ni kufuta jina au mtu kutoka katika kumbukumbu; ‘nitamfuta’ huhifadhi sitiari hiyo kwa ufupi na kwa kawaida.
- source_word: מִסִּפְרִי
  choice: katika kitabu changu
  rationale: Kwa kitenzi ‘futa,’ Kiswahili hutumia kwa kawaida ‘futa katika’; ‘kitabu changu’ huhifadhi sitiari isiyofafanuliwa ya maandishi ya Kiebrania.
- source_word: -נּוּ (3ms suffix in אֶמְחֶנּוּ)
  choice: -m- katika ‘nitamfuta’
  rationale: Kiambishi cha yambwa cha ngeli ya mtu huhifadhi rejeleo la mtu mmoja bila kulazimisha kirai kizito.
theological_decisions:
- issue: Maana ya ‘kitabu changu’
  choice: Kuhifadhi sitiari ‘kitabu changu’ bila kuitambulisha zaidi
  alternative: ‘kitabu cha uzima,’ ‘orodha ya walio hai,’ au ‘daftari la agano’
  rationale: Kiebrania kinasema tu ‘kitabu changu.’ Tafsiri haipaswi kuamua ikiwa kinamaanisha walio chini ya uangalizi wa Mungu, walio hai, washiriki wa agano, au wokovu wa milele.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ni wa kawaida, na sitiari pamoja na utata wa ‘kitabu changu’ vimehifadhiwa. Alama ya tanbihi [a] imewekwa baada ya sentensi inayohusika.
