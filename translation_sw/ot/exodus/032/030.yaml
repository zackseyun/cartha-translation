base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/030.yaml
  text: And it happened on the next day that Moses said to the people[a], “You have sinned a great sin. And now I will go up to Yahweh; perhaps I can make atonement for your sin.”
translation:
  language: sw
  text: Kesho yake, Musa akawaambia watu, “Ninyi mmetenda dhambi kubwa[a]. Sasa nitapanda kwenda kwa Yahwe; labda nitaweza kufanya upatanisho kwa ajili ya dhambi yenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kwa msisitizo, “Ninyi mmetenda dhambi, dhambi kubwa,” kwa kutumia kitenzi na nomino zenye mzizi mmoja ili kuonyesha uzito wa kosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Kesho yake
  rationale: Kirai hiki cha kawaida katika Kiswahili kinaonyesha kwa uwazi kuwa tukio lilitokea siku iliyofuata, bila kuiga kwa uzito fomula ya Kiebrania ya kuendeleza simulizi.
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל־הָעָם
  choice: Musa akawaambia watu
  rationale: Kitenzi cha mfululizo “akawaambia” kinaendeleza simulizi kwa Kiswahili cha kawaida na kuonyesha kuwa maneno yaliwaelekea watu.
- source_word: אַתֶּם
  choice: Ninyi
  rationale: Kiwakilishi huru kinahifadhi msisitizo wa Kiebrania kwa watu wenyewe waliohusika.
- source_word: חֲטָאתֶם חֲטָאָה גְדֹלָה
  choice: mmetenda dhambi kubwa
  rationale: “Kutenda dhambi” ni usemi wa kawaida na wenye hadhi katika Kiswahili; “dhambi kubwa” huhifadhi uzito wa kosa, huku tanbihi ikieleza muundo wa msisitizo wa Kiebrania.
- source_word: וְעַתָּה
  choice: Sasa
  rationale: Neno hili linaonyesha badiliko kutoka kwa shutuma kwenda kwenye hatua ambayo Musa anakusudia kuchukua; kiunganishi cha Kiebrania hakihitaji kuigwa kwa “na” katika Kiswahili.
- source_word: אֶעֱלֶה אֶל־יְהוָה
  choice: nitapanda kwenda kwa Yahwe
  rationale: “Nitapanda” huhifadhi mwendo wa kwenda juu kuelekea mlimani, na “kwenda kwa” huonyesha anayelengwa na safari hiyo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni umbo la kawaida la Kiswahili la jina la Mungu lililoandikwa kwa konsonanti YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: אוּלַי
  choice: labda
  rationale: Neno hili huhifadhi kutokuwa na uhakika na tumaini katika kauli ya Musa.
- source_word: אֲכַפְּרָה בְּעַד חַטַּאתְכֶם
  choice: nitaweza kufanya upatanisho kwa ajili ya dhambi yenu
  rationale: “Kufanya upatanisho” huwasilisha maana ya כפר katika muktadha huu, na “kwa ajili ya” huonyesha kuwa Musa anatenda kwa niaba ya watu. “Nitaweza” pamoja na “labda” huhifadhi uwezekano unaotarajiwa, si hakikisho.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina maalumu la Mungu. Kulitafsiri “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kauli ya Musa kuhusu upatanisho
  choice: labda nitaweza kufanya upatanisho
  alternative: huenda nikapata upatanisho
  rationale: Kauli ya Kiebrania inaonyesha tumaini lisilo na hakikisho. Tafsiri haidai kwamba Musa bila shaka angefanikiwa, wala haibadilishi kimya kimya tendo hilo kuwa kupokea upatanisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetafsiriwa kwa mtiririko wa kawaida, huku msisitizo wa “Ninyi,” kupanda kwa Musa, jina Yahwe, na kutokuwa na uhakika kwa “labda” vikihifadhiwa.
