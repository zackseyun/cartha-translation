review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the rapid turning aside, the self-directed making of the idol, the bodily act of prostration, sacrifice, and the Hebrew plural wording in the acclamation. However, its opening construction is not grammatically clear in Swahili, and 'sanamu ya ndama ya kusubu' is not a natural rendering of a cast-metal image.
  naturalness: ‘Wameiacha upesi njia niliyowaamuru’ is awkward because the object relationships are unclear. ‘Wamekengeuka upesi kutoka katika njia niliyowaamuru waifuate’ is clear and idiomatic. ‘Sanamu ya ndama iliyotengenezwa kwa kusubu’ naturally expresses a calf-image made by casting.
  terminology: '‘Kusujudia,’ ‘kuitolea dhabihu,’ and ‘nchi ya Misri’ are suitable in a modern, respectful biblical register. The main-text wording ‘Hii ndiyo miungu yako ... iliyokupandisha’ appropriately retains the plural morphology: ‘miungu,’ the class-4 demonstrative ‘hii,’ and the class-4 relative ‘iliyo-’ are plural in Swahili. The note should explain this without incorrectly glossing the Hebrew plural demonstrative as only ‘Hawa.’'
  issues:
  - severity: medium
    issue: Opening clause is syntactically unclear
    rationale: ‘Wameiacha upesi njia niliyowaamuru’ can suggest that they abandoned people whom God commanded, rather than turning aside from the commanded way. The source explicitly says they turned aside from the way.
  - severity: medium
    issue: Rendering of עֵגֶל מַסֵּכָה is unnatural
    rationale: ‘Sanamu ya ndama ya kusubu’ is not idiomatic Swahili. A relative clause stating that the image was made by casting clearly conveys the manufacture denoted by מַסֵּכָה.
  - severity: low
    issue: Footnote’s description of Hebrew plurality needs precision
    rationale: The Hebrew has plural demonstrative, noun, and verb. In the Swahili main text, ‘hii ... miungu ... iliyokupandisha’ likewise uses plural class-4 agreement, so the footnote should identify the Hebrew forms accurately and retain the singular alternative.
  revised_text: Wamekengeuka upesi kutoka katika njia niliyowaamuru waifuate. Wamejitengenezea sanamu ya ndama iliyotengenezwa kwa kusubu[a], wameisujudia na kuitolea dhabihu, wakasema, ‘Hii ndiyo miungu yako, Israeli, iliyokupandisha kutoka nchi ya Misri.’
