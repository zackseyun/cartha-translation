  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֣וּ לָ/הֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה וַ/יִּשְׁתַּֽחֲווּ ל/וֹ֙ וַ/יִּזְבְּחוּ ל֔/וֹ וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶֽעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/008.yaml
  text: They have quickly turned aside from the way that I commanded them. They have made for themselves a cast image of a calf[a], and have bowed down to it and sacrificed to it, and said, ‘These are your gods, Israel, who brought you up from the land of Egypt.’
translation:
  language: sw
  text: Wamekengeuka upesi kutoka katika njia niliyowaamuru waifuate. Wamejitengenezea sanamu ya ndama iliyotengenezwa kwa kusubu[a], wameisujudia na kuitolea dhabihu, wakasema, ‘Hii ndiyo miungu yako, Israeli, iliyokupandisha kutoka nchi ya Misri.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Hii ndiyo mungu wako, Israeli.” Kiebrania kina kiashiria, nomino, na kitenzi cha wingi: “Hii ndiyo miungu yako ... iliyokupandisha,” ingawa katika muktadha kinachorejelewa ni sanamu moja ya ndama.'
    reason: alternative_reading
lexical_decisions:
- source_word: סָרוּ מַהֵר
  choice: Wameiacha upesi
  rationale: Kitenzi kinaeleza kugeuka au kukengeuka kutoka njia iliyowekwa; ‘wameiacha’ ni Kiswahili cha kawaida kinachohifadhi wazo la kuikataa njia, na ‘upesi’ linaonyesha uasi wao ulivyotokea mapema.
- source_word: מִן הַדֶּרֶךְ אֲשֶׁר צִוִּיתִם
  choice: njia niliyowaamuru
  rationale: ‘Njia’ huhifadhi sitiari ya mwenendo wa utii, huku kishazi hiki kikitoa kwa kawaida maana ya njia ambayo Mungu aliwaamuru waifuate.
- source_word: עָשׂוּ לָהֶם
  choice: Wamejitengenezea
  rationale: Umbo hili linaonyesha kwamba walijifanyia kitu kwa matumizi yao wenyewe; ‘wamejitengenezea’ linaeleza maana hiyo kwa ufupi na kawaida.
- source_word: עֵגֶל מַסֵּכָה
  choice: sanamu ya ndama ya kusubu
  rationale: מַסֵּכָה ni kitu kilichotengenezwa kwa kumimina metali iliyoyeyushwa katika kalibu. ‘Sanamu ya ndama ya kusubu’ huonyesha kwamba ni sanamu yenye umbo la ndama na huhifadhi namna ya utengenezaji.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: wameisujudia
  rationale: Kitenzi kinaonyesha tendo la kuinama au kujilaza mbele yake. ‘Kuisujudia’ huhifadhi tendo la mwili na maana yake ya kiibada bila kuligeuza tu kuwa neno la jumla ‘kuabudu.’
- source_word: וַיִּזְבְּחוּ לוֹ
  choice: kuitolea dhabihu
  rationale: Hili ni tendo mahususi la ibada ya kutoa dhabihu; tafsiri hii ni wazi na ya kawaida katika Kiswahili cha Biblia.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: Hii ndiyo miungu yako
  rationale: Kiebrania kina kiashiria na nomino za wingi (‘hawa/hizi ... miungu’), lakini rejeleo ni ndama mmoja. Kiswahili kinahitaji upatanisho wa kisarufi na rejeleo hilo, kwa hiyo ‘Hii ndiyo’ hutaja sanamu moja huku ‘miungu’ kikihifadhi wingi wa אֱלֹהֶיךָ.
- source_word: הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: iliyokupandisha kutoka nchi ya Misri
  rationale: ‘Kupandisha’ huhifadhi maana ya msingi ya עלה katika kauli sababishi na mwangwi wa kauli ya kutoka Misri; ‘kutoka nchi ya Misri’ ni ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Idadi katika אֵלֶּה אֱלֹהֶיךָ ikilinganishwa na ndama mmoja
  choice: 'Kuhifadhi nomino ya wingi: ‘Hii ndiyo miungu yako, Israeli’'
  alternative: ‘Huyu ndiye mungu wako, Israeli’
  rationale: Umbo la Kiebrania ni la wingi waziwazi, ingawa muktadha una sanamu moja. Tafsiri kuu inahifadhi mvutano huo badala ya kuusawazisha; tafsiri ya umoja imewekwa katika tanbihi.
- issue: Maana ya tendo la וַיִּשְׁתַּחֲווּ
  choice: ‘wameisujudia’
  alternative: ‘wameiabudu’
  rationale: 'Tafsiri iliyochaguliwa huhifadhi tendo halisi la kuinama au kujilaza na mlolongo wa matendo katika mstari: kusujudu, kutoa dhabihu, kisha kusema.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Kusubu’ ni neno sahihi kwa kutengeneza kitu kwa kumimina metali iliyoyeyushwa katika kalibu; tanbihi huhifadhi mvutano wa umoja na wingi katika Kiebrania.
