base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/031.yaml
  text: Then Moses returned to Yahweh and said[a], “Please, this people has sinned a great sin, and they have made gods of gold for themselves.”
translation:
  language: sw
  text: Ndipo Musa akarudi kwa Yahweh na kusema, “Tafadhali, watu hawa wametenda dhambi kubwa, nao wamejitengenezea miungu ya dhahabu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mungu wa dhahabu kwa ajili yao wenyewe.” Kiebrania kinasema “miungu ya dhahabu” kwa wingi, ingawa kutokana na muktadha mpana wengine huelewa kuwa usemi huo unamhusu ndama wa dhahabu katika umoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi שוב hapa kinaonyesha kwamba Musa alirudi kwa Yahweh baada ya kuwa pamoja na watu; ‘akarudi’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: אֶל יְהוָה
  choice: kwa Yahweh
  rationale: Kihusishi אֶל kinaonyesha mwelekeo wa kurudi kwake, na jina la agano יְהוָה limetoholewa kuwa ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: אָנָּא
  choice: Tafadhali
  rationale: Chembe hii huonyesha ombi la kusihi. ‘Tafadhali’ inadumisha sauti ya Musa ya kuomba bila kutumia lugha ya kizamani.
- source_word: חָטָא הָעָם הַזֶּה חֲטָאָה גְדֹלָה
  choice: watu hawa wametenda dhambi kubwa
  rationale: Kiswahili hutumia upatanisho wa wingi pamoja na ‘watu’. Usemi ‘wametenda dhambi kubwa’ unaeleza kwa lugha ya asili uzito wa muundo wa Kiebrania unaorudia mzizi wa neno ‘dhambi’.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: wamejitengenezea
  rationale: Neno hili linaonyesha kwamba watu walitengeneza kitu kwa ajili yao wenyewe; ‘wamejitengenezea’ linahifadhi maana ya kutengeneza pamoja na manufaa au matumizi yao wenyewe.
- source_word: אֱלֹהֵי זָהָב
  choice: miungu ya dhahabu
  rationale: Muundo wa Kiebrania ni wa wingi, hivyo ‘miungu ya dhahabu’ unahifadhi umbo hilo bila kulipatanisha kimya kimya na ndama mmoja wa dhahabu katika muktadha mpana.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יְהוָה. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Wingi wa אֱלֹהֵי זָהָב licha ya muktadha wa ndama mmoja
  choice: miungu ya dhahabu
  alternative: mungu wa dhahabu
  rationale: Tafsiri kuu inahifadhi wingi halisi wa maandishi ya Kiebrania, huku tanbihi ikieleza uwezekano wa kuelewa usemi huo kuwa unamhusu mungu mmoja wa dhahabu kwa sababu ya muktadha.
translation_notes:
  register: Lugha ni ya Kiswahili sanifu cha Afrika Mashariki, ya sasa na yenye heshima. Muundo wa simulizi ‘Ndipo … akarudi … na kusema’ ni wa asili, huku ‘Tafadhali’ ikihifadhi sauti ya kusihi. Alama ya tanbihi imewekwa moja kwa moja baada ya kirai kinachohusika.
