base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/020.yaml
  text: He took the calf that they had made[a], burned it with fire, ground it until it was fine, scattered it on the surface of the water, and made the sons of Israel drink it.
translation:
  language: sw
  text: Akaichukua ile ndama waliyotengeneza, akaiteketeza kwa moto, akaisaga mpaka ikawa laini, akaitawanya juu ya maji, kisha akawanywesha wana wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kinasema “wana wa Israeli,” usemi wa kawaida wa kiagano unaowataja watu wote wa Israeli kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵגֶל
  choice: ile ndama
  rationale: עֵגֶל ni ndama au ng’ombe mchanga; “ile ndama” ni ya kawaida, wazi, na inamtambulisha sanamu iliyotajwa katika muktadha.
- source_word: אֲשֶׁר עָשׂוּ
  choice: waliyokuwa wameitengeneza
  rationale: Kishazi hiki kinamtambulisha ndama kuwa yule ambaye watu walikuwa wametengeneza kabla ya hatua za Musa; wakati uliotangulia unaeleweka kwa kawaida katika simulizi la Kiswahili.
- source_word: וַיִּשְׂרֹף בָּאֵשׁ
  choice: akaiteketeza kwa moto
  rationale: Kitenzi שרף pamoja na בָּאֵשׁ kinaonyesha kuunguza au kuteketeza kwa moto. “Akaiteketeza kwa moto” ni cha asili na huhifadhi chombo halisi cha tendo.
- source_word: וַיִּטְחַן עַד אֲשֶׁר דָּק
  choice: akaisaga mpaka ikawa laini
  rationale: טחן humaanisha kusaga, na דק huonyesha hali ya kuwa chembechembe ndogo au laini; tafsiri hii haiongezi kwa lazima neno “unga,” ambalo si wazi katika maandishi.
- source_word: וַיִּזֶר
  choice: akaitawanya
  rationale: Katika muktadha huu kitenzi kinaeleza kutawanya mabaki yaliyosagwa; “kutawanya” ni Kiswahili cha sasa na hakifanyi maana kuwa mahususi kupita kiasi.
- source_word: עַל פְּנֵי הַמַּיִם
  choice: juu ya maji
  rationale: Kirai kinamaanisha juu au kwenye uso wa maji. “Juu ya maji” ni cha kawaida katika Kiswahili na kinahifadhi taswira hiyo.
- source_word: וַיַּשְׁקְ אֶת בְּנֵי יִשְׂרָאֵל
  choice: akawanywesha wana wa Israeli
  rationale: Hifili ya שׁקה ni ya kusababisha kunywa, hivyo “akawanywesha” ni tafsiri fupi na sahihi. “Wana wa Israeli” huhifadhi umbo la Kiebrania בְּנֵי יִשְׂרָאֵל.
theological_decisions:
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Kiebrania kinasema kihalisi “wana wa Israeli,” jina la agano linalowakilisha watu kwa ujumla. Maandishi makuu yanahifadhi umbo hilo, huku tanbihi ikifafanua maana yake ya kijumuiya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi na hadhi inayofaa maandiko. Mfululizo wa vitenzi vya “aka-” unaakisi hatua zinazofuatana katika Kiebrania. Lugha imeepuka kubainisha “unga” kwa kuwa דק hueleza ulaini au udogo bila kutaja moja kwa moja unga.
