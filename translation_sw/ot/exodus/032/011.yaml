source:
  edition: WLC
  text: וַ/יְחַ֣ל מֹשֶׁ֔ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יֹּ֗אמֶר לָ/מָ֤ה יְהוָה֙ יֶחֱרֶ֤ה אַפְּ/ךָ֙ בְּ/עַמֶּ֔/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/כֹ֥חַ גָּד֖וֹל וּ/בְ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/011.yaml
  text: But Moses pleaded with Yahweh his God and said[a], “Why, Yahweh, should your anger burn against your people[b], whom you brought out of the land of Egypt with great power and with a strong hand?”
translation:
  language: sw
  text: Lakini Musa akamsihi Yahweh, Mungu wake[a], akasema, “Kwa nini, Ee Yahweh, hasira yako iwake dhidi ya watu wako, ambao uliwatoa katika nchi ya Misri kwa nguvu kuu na kwa mkono wenye nguvu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maana halisi: “aliutafuta uso wa Yahweh, Mungu wake”; hii ni nahau yenye maana ya kutafuta kibali au kusihi kwa bidii.'
    reason: lexical_alternative
  - marker: b
    text: Au “mkono wa uweza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל ... אֶת־פְּנֵי
  choice: akamsihi
  rationale: Kirai hiki kwa maana halisi ni ‘aliutafuta uso wa,’ lakini hapa ni nahau ya kutafuta kibali kwa kuomba kwa bidii. ‘Akamsihi’ linaonyesha ombi la dhati kwa Kiswahili cha kawaida bila kudokeza udanganyifu au kumlazimisha Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Kiambishi cha umilikaji ni cha umoja na kinamhusu Mungu wa Musa; tafsiri hii pia huhifadhi uhusiano unaoelezwa katika kifungu.
- source_word: יֶחֱרֶה אַפְּךָ
  choice: hasira yako iwake
  rationale: Huhifadhi taswira ya Kiebrania ya hasira inayowaka huku ikiepuka tafsiri sisisi isiyo ya kawaida ya ‘pua yako iwake.’
- source_word: בְּעַמֶּךָ
  choice: dhidi ya watu wako
  rationale: Katika muktadha wa hasira, kihusishi kinaonyesha wanaolengwa na hasira; ‘watu wako’ huhifadhi hoja ya Musa kuhusu uhusiano wa Yahweh na Israeli.
- source_word: אֲשֶׁר הוֹצֵאתָ מֵאֶרֶץ מִצְרַיִם
  choice: ambao uliwatoa katika nchi ya Misri
  rationale: Huhifadhi tendo la Yahweh la kuwaokoa watu pamoja na maelezo kamili ya mahali walikotolewa.
- source_word: בְּכֹחַ גָּדוֹל
  choice: kwa nguvu kuu
  rationale: Kihusishi kinaonyesha njia au uwezo uliotumiwa; ‘nguvu kuu’ huwasilisha msisitizo wa chanzo kwa ufupi na kwa kawaida.
- source_word: וּבְיָד חֲזָקָה
  choice: na kwa mkono wenye nguvu
  rationale: Huhifadhi taswira ya kawaida ya simulizi la Kutoka na maana ya msingi ya חֲזָקָה, huku ‘mkono wa uweza’ likibaki chaguo linalowezekana.
theological_decisions:
- issue: Lugha inayomwelezea Mungu kwa taswira ya kibinadamu katika hasira yake
  choice: hasira yako iwake
  alternative: ukasirike
  rationale: Tafsiri inadumisha taswira na uzito wa ombi la Musa bila kuitafsiri kwa namna isiyo ya kawaida kuwa ‘pua yako iwake’ wala kuondoa kabisa sitiari ya joto.
- issue: Uandishi wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Unukuzi ‘Yahweh’ huhifadhi jina binafsi lililo katika maandishi ya chanzo badala ya kulibadilisha kuwa cheo.
- issue: Swali la Musa kuhusu hasira ya Mungu
  choice: Kwa nini ... hasira yako iwake
  alternative: Usiache hasira yako iwake
  rationale: Muundo wa swali la Kiebrania umehifadhiwa, hivyo mvutano wa simulizi kati ya hukumu iliyotangazwa na maombezi ya Musa haujatatuliwa kimyakimya kuwa amri ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Ee’ limetumiwa kuonyesha kwamba Yahweh anaelekezewa maneno moja kwa moja. Alama [b] imewekwa baada ya kirai ‘mkono wenye nguvu,’ ambacho ndicho kinachohusika na tanbihi hiyo.
