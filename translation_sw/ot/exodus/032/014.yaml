  text: And Yahweh relented concerning the harm that he had spoken of doing to his people[a][b].
translation:
  language: sw
  text: Basi Yahweh akaghairi maafa aliyokuwa amesema angewaletea watu wake[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akabadili nia” au “akajuta” kuhusu maafa aliyokuwa amesema angewaletea watu wake.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “uovu/maafa”; hapa neno hilo linamaanisha maafa au madhara yaliyotishiwa, wala si uovu wa kimaadili ndani ya Mungu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: akaghairi
  rationale: Katika muktadha huu, kauli ya Niphal ya נחם inaonyesha kuacha hatua ya hukumu iliyokuwa imetangazwa. “Akaghairi” ni ya asili katika Kiswahili na inadumisha mvutano wa simulizi bila kufafanua kupita kiasi hali ya Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililofunuliwa kwa Israeli.
- source_word: עַל
  choice: kuhusu
  rationale: Pamoja na נחם, kihusishi hiki kinaonyesha jambo ambalo kughairi kulihusu; “kuhusu” ni wazi na cha kawaida katika Kiswahili.
- source_word: הָרָעָה
  choice: maafa
  rationale: Katika muktadha wa hukumu, רָעָה linamaanisha msiba au madhara yaliyotishiwa, wala si uovu wa kimaadili ndani ya Mungu. “Maafa” linaeleza maana hiyo kwa uwazi.
- source_word: אֲשֶׁר דִּבֶּר
  choice: aliyokuwa amesema
  rationale: Kishazi hiki kinarejelea jambo ambalo Yahweh alikuwa ametangaza hapo awali; umbo hili linaweka wazi wakati wa tangazo hilo kwa Kiswahili cha kawaida.
- source_word: לַעֲשׂוֹת
  choice: angewaletea
  rationale: Ingawa maana ya msingi ni “kufanya,” pamoja na “maafa” Kiswahili cha asili husema “kuwaletea maafa.” Huu ni ulinganifu bora unaohifadhi maana katika muktadha.
- source_word: לְעַמּוֹ
  choice: watu wake
  rationale: Kihusishi kinaonyesha wale ambao hatua iliyotishiwa ingewaathiri; “watu wake” ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Maelezo ya Mungu kwa lugha ya kibinadamu katika נחם
  choice: Kutumia “akaghairi” katika matini kuu.
  alternative: “akabadili nia” au “akajuta”
  rationale: Aya inaonyesha badiliko halisi katika hatua iliyotangazwa baada ya maombezi. “Akaghairi” hudumisha nguvu na mvutano huo wa simulizi bila kuingiza hitimisho la kimadhehebu kuhusu kubadilika au kutobadilika kwa Mungu; maana nyingine zinazowezekana zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akaghairi” linaeleweka kwa wasomaji wa kawaida na linafaa katika muktadha wa kuacha hatua iliyotangazwa. Muundo wa sentensi ni wa asili bila kuficha utata wa kitenzi cha Kiebrania.
