  text: וַ/יֹּ֗אמֶר אֵ֥ין קוֹל֙ עֲנ֣וֹת גְּבוּרָ֔ה וְ/אֵ֥ין ק֖וֹל עֲנ֣וֹת חֲלוּשָׁ֑ה ק֣וֹל עַנּ֔וֹת אָנֹכִ֖י שֹׁמֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/018.yaml
  text: And he said[a], “It is not the sound of a cry of victory, and it is not the sound of a cry of defeat; I hear the sound of singing.”
translation:
  language: sw
  text: Akasema, “Hiyo si sauti ya kelele za ushindi, wala si sauti ya kelele za kushindwa; ninasikia sauti ya kuimba.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninasikia sauti ya kelele.” Miundo ya Kiebrania inayotokana na ענה inaweza kumaanisha kuitikiana kwa sauti au kupiga kelele; hivyo kifungu cha mwisho kinaweza pia kutafsiriwa kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Huendeleza mtiririko wa simulizi la Kiebrania kwa Kiswahili cha kawaida bila kulazimisha kiunganishi kisichohitajika.
- source_word: קוֹל
  choice: sauti
  rationale: Ni neno lisiloegemea upande mmoja ambalo linafaa katika matukio yote matatu na halilazimishi maana ya usemi ulio wazi.
- source_word: עֲנוֹת / עַנּוֹת
  choice: kelele / kuimba
  rationale: Katika vifungu viwili vya kwanza, muungano wake na ushindi na kushindwa unaonyesha kelele za vita; katika kifungu cha mwisho, muktadha wa sherehe mbele ya ndama unaunga mkono kuimba, huku tanbihi ikihifadhi uwezekano mpana wa kelele au kuitikiana.
- source_word: גְּבוּרָה
  choice: ushindi
  rationale: Ingawa kimsingi linaweza kumaanisha nguvu au uweza, hapa limewekwa katika mlingano wa kijeshi na חֲלוּשָׁה, hivyo ‘ushindi’ huwasilisha vizuri kelele za upande unaoshinda.
- source_word: חֲלוּשָׁה
  choice: kushindwa
  rationale: Neno linahusiana na udhaifu, lakini katika ulinganisho wa kelele za vita linaelekea kumaanisha hali ya kushindwa au kuzidiwa.
- source_word: אֵין
  choice: si ... wala si
  rationale: Muundo huu wa Kiswahili unahifadhi ukanushaji unaorudiwa na mlingano wa kishairi kwa namna ya asili.
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: ninasikia
  rationale: Huonyesha utambuzi unaoendelea wakati huo kwa Kiswahili cha sasa na cha kawaida.
theological_decisions: []
