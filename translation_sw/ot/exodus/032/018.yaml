  terminology: “Sauti,” “kelele,” “ushindi,” “kushindwa,” na “kuimba” ni uchaguzi wa maneno unaoeleweka na unaofaa kwa rejesta ya simulizi la Biblia. Hakuna istilahi ya kiteolojia au jina inayohitaji marekebisho.
