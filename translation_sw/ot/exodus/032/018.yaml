  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa Kiebrania: ukanushaji unaorudiwa, utofautishaji wa sauti za ushindi na kushindwa, na hitimisho la msikilizaji. “Kelele za ushindi” na “kelele za kushindwa” zinawasilisha vizuri muktadha wa kijeshi wa עֲנוֹת גְּבוּרָה na עֲנוֹת חֲלוּשָׁה. “Sauti ya kuimba” ni tafsiri inayofaa kwa עַנּוֹת katika muktadha huu, huku tanbihi ikihifadhi upeo wa maana mbadala.'
