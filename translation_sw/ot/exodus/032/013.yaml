revisions:
- from: Wakumbuke Abrahamu[a], Isaka na Israeli, watumishi wako, ambao uliwaapia kwa nafsi yako mwenyewe na kuwaambia, ‘Nitawazidisha wazao wenu kama nyota za mbinguni, nami nitawapa wazao wenu nchi hii yote niliyoisema, nao watairithi milele.’
  to: Wakumbuke Abrahamu[a], Isaka na Israeli, watumishi wako, ambao uliwaapia kwa nafsi yako mwenyewe na kuwaambia, ‘Nitawazidisha wazao wenu kama nyota za mbinguni, nami nitawapa wazao wenu nchi hii yote ambayo nimesema nitawapa, nao watairithi milele.’
  rationale: 'The revision makes the land-promise clause idiomatic in Kiswahili: ''ambayo nimesema nitawapa'' retains the Hebrew''s ''which I said, I will give'' sequence and does not paraphrase the promise as a mere prior reference to land. The note is also clarified while preserving the Hebrew textual reading.'
