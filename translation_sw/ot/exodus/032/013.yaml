reference: Exodus 32:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: זְכֹ֡ר לְ/אַבְרָהָם֩ לְ/יִצְחָ֨ק וּ/לְ/יִשְׂרָאֵ֜ל עֲבָדֶ֗י/ךָ אֲשֶׁ֨ר נִשְׁבַּ֣עְתָּ לָ/הֶם֮ בָּ/ךְ֒ וַ/תְּדַבֵּ֣ר אֲלֵ/הֶ֔ם אַרְבֶּה֙ אֶֽת זַרְעֲ/כֶ֔ם כְּ/כוֹכְבֵ֖י הַ/שָּׁמָ֑יִם וְ/כָל הָ/אָ֨רֶץ הַ/זֹּ֜את אֲשֶׁ֣ר אָמַ֗רְתִּי אֶתֵּן֙ לְ/זַרְעֲ/כֶ֔ם וְ/נָחֲל֖וּ לְ/עֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/013.yaml
  text: Remember Abraham[a], Isaac, and Israel, your servants, to whom you swore by yourself and said to them, ‘I will multiply your offspring like the stars of the heavens, and all this land that I have spoken of I will give to your offspring, and they shall inherit it forever.’
translation:
  language: sw
  text: Wakumbuke Abrahamu[a], Isaka na Israeli, watumishi wako, ambao uliwaapia kwa nafsi yako mwenyewe na kuwaambia, ‘Nitawazidisha wazao wenu kama nyota za mbinguni, nami nitawapa wazao wenu nchi hii yote ambayo nimesema nitawapa, nao watairithi milele.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yakobo”—jina la patriarki huyo kabla hajaitwa Israeli. Matini ya Kiebrania hapa inasema “Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Wakumbuke
  rationale: Ni amri ya nafsi ya pili ya kiume umoja inayoelekezwa kwa Mungu. Kiswahili kinahitaji kiambishi cha yambwa kwa watu wanaokumbukwa; neno hili linahifadhi ombi la Musa linalotegemea agano bila kulipanua.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיִשְׂרָאֵל
  choice: Abrahamu, Isaka na Israeli
  rationale: Majina yametoholewa kwa maumbo yaliyozoeleka katika Kiswahili. ‘Israeli’ linahifadhi jina lililo katika Kiebrania badala ya kulibadili kuwa ‘Yakobo.’
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika muktadha huu עבד inaonyesha hadhi yao kama watumishi wa Mungu katika uhusiano wa agano, si hasa hali ya kijamii ya utumwa.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לָהֶם בָּךְ
  choice: ambao uliwaapia kwa nafsi yako mwenyewe
  rationale: Muundo huu unaonyesha kwamba Mungu aliapa huku yeye mwenyewe akiwa dhamana ya kiapo. ‘Kwa nafsi yako mwenyewe’ ni wazi na huhifadhi nguvu ya בָּךְ.
- source_word: וַתְּדַבֵּר אֲלֵהֶם
  choice: na kuwaambia
  rationale: Kabla ya usemi wa moja kwa moja, ‘kuwaambia’ ni Kiswahili cha kawaida na huwasilisha maana ya kusema kwao.
- source_word: אַרְבֶּה אֶת זַרְעֲכֶם
  choice: Nitawazidisha wazao wenu
  rationale: Hifili ya רבה ina maana ya kuongeza au kuzidisha. ‘Wazao’ huwasilisha זרע kama kundi la vizazi bila kutumia ‘mbegu,’ ambalo hapa lingekuwa lisilo la kawaida.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: kama nyota za mbinguni
  rationale: Hili ni tamko la asili na lenye hadhi katika Kiswahili, huku likihifadhi taswira ya Kiebrania.
- source_word: וְכָל הָאָרֶץ הַזֹּאת
  choice: nchi hii yote
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na huhifadhi msisitizo wa eneo lote lililoonyeshwa.
- source_word: אֲשֶׁר אָמַרְתִּי
  choice: niliyoisema
  rationale: Tafsiri hii hudumisha kishazi cha uhusiano kama kilivyo katika Kiebrania bila kukiunganisha kimafasiri na kitenzi kinachofuata cha kutoa.
- source_word: אֶתֵּן לְזַרְעֲכֶם
  choice: nami nitawapa wazao wenu
  rationale: Wakati ujao wa ahadi umehifadhiwa. ‘Nami’ linaonyesha mwendelezo wa nukuu, na muundo wa Kiswahili unaweka wapokeaji kabla ya kitu kinachotolewa kwa usomaji wa kawaida.
- source_word: וְנָחֲלוּ
  choice: nao watairithi
  rationale: Kitenzi נחל humaanisha kupokea kama urithi. Kiambishi ‘-i-’ hurejelea nchi ambayo Kiebrania huiacha ieleweke kutokana na muktadha.
- source_word: לְעֹלָם
  choice: milele
  rationale: Katika ahadi ya agano, ‘milele’ ni tafsiri ya kawaida na ya moja kwa moja ya wazo la muda usio na mwisho uliowekwa wazi.
theological_decisions:
- issue: Kutumia ‘Israeli’ badala ya ‘Yakobo’ kwa babu wa taifa
  choice: Israeli katika matini kuu
  alternative: Yakobo
  rationale: Matini ya Kiebrania inasema ‘Israeli.’ Kulihifadhi jina hilo kunadumisha mwangwi wa jina la agano na huepuka kutafsiri badala ya kutafsiriwa.
- issue: Tafsiri ya kauli ya kiapo בָּךְ
  choice: kwa nafsi yako mwenyewe
  alternative: kwa wewe mwenyewe
  rationale: Kauli hii huonyesha kwa uwazi kwamba Mungu mwenyewe ndiye dhamana ya kiapo chake, bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Uhusiano wa אֲשֶׁר אָמַרְתִּי na אֶתֵּן
  choice: nchi hii yote niliyoisema, nami nitawapa wazao wenu
  alternative: nchi hii yote ambayo ulisema utawapa wazao wenu
  rationale: Chaguo kuu linahifadhi vishazi viwili vya Kiebrania bila kuingiza maana ya ‘nitatoa’ ndani ya kishazi cha uhusiano. Ingawa usemi huo una ukakasi kidogo katika Kiswahili, unalinda muundo na utata wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Lugha ya agano imehifadhiwa bila kuongeza istilahi za kimadhehebu; ukakasi mdogo wa ‘nchi hii yote niliyoisema’ umeachwa ili kutenganisha vishazi vya Kiebrania.
