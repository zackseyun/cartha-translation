translation:
  language: sw
  text: Kisha Aroni akawaambia, “Vueni[a] pete za dhahabu zilizo masikioni mwa wake zenu, wana wenu na binti zenu, mniletee.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Zing'oeni pete za dhahabu …” Kitenzi cha Kiebrania kinaweza kudokeza kuziondoa kwa nguvu au kuzikatua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akawaambia
  rationale: Muundo wa masimulizi unaendeleza tukio; ‘Kisha’ na ‘akawaambia’ ni Kiswahili cha asili kinachohifadhi mtiririko na kiwakilishi cha wingi.
- source_word: אֲלֵהֶם
  choice: akawaambia
  rationale: Kiwakilishi ‘wa-’ kinahifadhi maana ya ‘kwao’ bila kukibadili kiufafanuzi kuwa ‘watu’.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Jina limetolewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: פָּרְקוּ
  choice: Vueni
  rationale: Katika muktadha wa mapambo yaliyoko masikioni, ‘vueni’ ni agizo la kawaida na wazi; uwezekano wa maana kali zaidi umehifadhiwa katika tanbihi.
- source_word: נִזְמֵי הַזָּהָב
  choice: pete za dhahabu
  rationale: ‘Pete’ huhifadhi upana wa nomino, ambayo inaweza kumaanisha pete za pua au masikio, huku kifungu kinachofuata kikibainisha kuwa hizi ziko masikioni.
- source_word: אֲשֶׁר בְּאָזְנֵי
  choice: zilizo masikioni mwa
  rationale: Hii inatoa kwa uaminifu mahali pete zilipokuwa kwa Kiswahili sanifu na cha kawaida.
- source_word: נְשֵׁיכֶם
  choice: wake zenu
  rationale: Katika muktadha huu wa mahusiano ya kifamilia, neno linaeleweka vizuri kuwa ‘wake zenu’ kuliko ‘wanawake wenu’.
- source_word: בְּנֵיכֶם
  choice: wana wenu
  rationale: ‘Wana’ hapa hutaja wana wa kiume na kuhifadhi utofauti na ‘binti’ unaofuata.
- source_word: וּבְנֹתֵיכֶם
  choice: na binti zenu
  rationale: Huhifadhi kwa wazi kundi la mabinti lililotajwa sambamba na wana.
- source_word: וְהָבִיאוּ אֵלָי
  choice: mniletee
  rationale: Agizo hili ni la asili na fupi katika Kiswahili; kiambishi ‘ni-’ kinaonyesha ‘kwangu,’ na kitu kinachorejelewa kinaeleweka kuwa pete.
