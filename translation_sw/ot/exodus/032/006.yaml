base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/006.yaml
  text: And they rose early the next day and offered burnt offerings and brought peace offerings. Then the people sat down to eat and drink[a], and rose up to revel.
translation:
  language: sw
  text: Siku iliyofuata waliamka mapema, wakatoa sadaka za kuteketezwa na wakaleta sadaka za amani. Kisha watu wakaketi ili kula na kunywa, wakainuka kujifurahisha kwa shamrashamra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kucheza” au “kusherehekea.” Kitenzi cha Kiebrania kinaweza kumaanisha kucheza, kusherehekea, au kujifurahisha kwa shamrashamra; hapa muktadha unaelekea kuonyesha sherehe zisizo na kiasi kuliko burudani isiyo na hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ
  choice: wakaamka mapema
  rationale: Kauli ya Kiebrania inasisitiza kuamka mapema; usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: מִמָּחֳרָת
  choice: Kesho yake
  rationale: Hurejelea siku iliyofuata matukio yaliyotangulia; ‘kesho yake’ ni fupi na ya kawaida katika masimulizi.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: wakatoa sadaka za kuteketezwa
  rationale: Muungano huu wa maneno unamaanisha kutoa dhabihu zinazoteketezwa; tafsiri hii huhifadhi aina maalumu ya sadaka.
- source_word: וַיַּגִּשׁוּ שְׁלָמִים
  choice: wakaleta sadaka za amani
  rationale: נגשׁ hapa ni kuleta au kuwasilisha sadaka, na שְׁלָמִים ni aina ya sadaka inayojulikana kama sadaka za amani.
- source_word: וַיֵּשֶׁב הָעָם
  choice: watu wakaketi
  rationale: ישׁב katika mfululizo huu wa masimulizi ina maana ya kuketi, hapa kwa ajili ya mlo.
- source_word: לֶאֱכֹל וְשָׁתוֹ
  choice: kula na kunywa
  rationale: Vitenzi-jina vya Kiebrania vinaeleza shughuli iliyowafanya waketi; Kiswahili hiki ni cha moja kwa moja na cha kawaida.
- source_word: וַיָּקֻמוּ לְצַחֵק
  choice: wakainuka kufanya sherehe za fujo
  rationale: צחק inaweza kumaanisha kucheza, kujifurahisha, au kufanya sherehe zisizo na kiasi. Muktadha wa ibada ya sanamu unaonyesha zaidi ya mchezo usio na hatia, bila kulazimisha maana ya kingono.
theological_decisions:
- issue: Maana ya לְצַחֵק katika tukio la ndama wa dhahabu
  choice: kufanya sherehe za fujo
  alternative: kucheza; kujifurahisha; kufanya sherehe
  rationale: Muktadha wa dhabihu mbele ya ndama, karamu, na hukumu inayofuata unaipa kauli hii uzito hasi. Tafsiri iliyochaguliwa inaonyesha shamrashamra zisizo na kiasi, lakini tanbihi huhifadhi upana halisi wa kitenzi cha Kiebrania na haidai wazi kwamba kulikuwa na uasherati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa masimulizi na istilahi za dhabihu zinazoeleweka. Lugha ni yenye heshima lakini si ya kizamani; tanbihi huhifadhi utata wa neno צחק.
