translation:
  language: sw
  text: Basi watu wote wakavua pete za dhahabu zilizokuwa masikioni mwao, wakazileta kwa Haruni.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakazing’oa” pete za dhahabu. Kitenzi cha Kiebrania kinaweza kusisitiza kuziondoa kwa nguvu.
    reason: lexical_alternative
  - marker: b
    text: Au, “vipuli vya dhahabu.” Neno la Kiebrania linalotafsiriwa “pete” linaweza kumaanisha mapambo ya masikio katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּרְקוּ
  choice: wakavua
  rationale: Kauli ya kujitendea katika Kiebrania inaonyesha watu walijiondolea mapambo hayo. “Wakavua” ni Kiswahili cha kawaida na cha asili kwa kuondoa kitu kilichovaliwa, huku uwezekano wa kuondoa kwa nguvu ukihifadhiwa katika tanbihi.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Kirai hiki huonyesha jumuiya iliyokusanyika kwa ujumla; “watu wote” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: נִזְמֵי הַזָּהָב
  choice: pete za dhahabu
  rationale: Neno נֶזֶם linaweza kumaanisha pete ya pambo inayovaliwa sikioni au puani. “Pete za dhahabu” huhifadhi upana huo wa maana, na kirai kinachofuata kinaonyesha kwamba hapa zilikuwa masikioni.
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: zilizokuwa masikioni mwao
  rationale: Tafsiri hii inaonyesha wazi mahali pete hizo zilipovaliwa na ni ya kawaida katika Kiswahili Sanifu.
- source_word: וַיָּבִיאוּ אֶל אַהֲרֹן
  choice: wakamletea Aroni
  rationale: Kitenzi kinamaanisha kuleta. Muundo wa Kiswahili “wakamletea Aroni” huwasilisha kwa kawaida kwamba vitu vilivyoletwa vilifikishwa kwake, bila kulazimika kurudia kiwakilishi cha vitu hivyo.
