base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/001.yaml
  text: When the people saw that Moses was taking a long time to come down from the mountain[a], the people gathered around Aaron and said to him, “Get up, make gods for us that will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.”
translation:
  language: sw
  text: Watu walipoona kwamba Musa alikuwa amekawia kushuka kutoka mlimani, walimkusanyikia Haruni na kumwambia, “Inuka, ututengenezee miungu itakayotutangulia[a], kwa maana huyu Musa, mtu aliyetupandisha kutoka nchi ya Misri—hatujui kilichompata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mungu atakayetutangulia.” Baadhi huelewa אֱלֹהִים hapa kwa maana ya umoja kwa sababu simulizi linalofuata linazingatia sanamu moja ya ndama; hata hivyo, umbo la neno la Kiebrania ni la wingi, na kitenzi kinacholifuata ni cha wingi.
    reason: alternative_reading
lexical_decisions:
- source_word: בֹשֵׁשׁ
  choice: alikuwa amekawia
  rationale: Huwasilisha kuchelewa kwa Musa kwa mtazamo wa watu kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: לָרֶדֶת מִן הָהָר
  choice: kushuka kutoka mlimani
  rationale: Huhifadhi wazi mwendo wa kushuka na mahali alikotoka.
- source_word: וַיִּקָּהֵל ... עַל אַהֲרֹן
  choice: walimkusanyikia Haruni
  rationale: Kitenzi hiki cha Kiswahili huonyesha watu kukusanyika mahali alipo Haruni na pia hudokeza shinikizo lao bila kuongeza wazi maana ya uhasama.
- source_word: קוּם
  choice: Inuka
  rationale: Ni amri fupi na ya moja kwa moja inayofaa sajili yenye hadhi, huku ikihifadhi msisitizo wa Kiebrania.
- source_word: עֲשֵׂה לָנוּ
  choice: ututengenezee
  rationale: Huhifadhi maana ya kutengeneza kitu kwa ajili yao kwa Kiswahili asilia.
- source_word: אֱלֹהִים ... יֵלְכוּ
  choice: miungu itakayotutangulia
  rationale: Nomino na kitenzi cha Kiebrania vina umbo la wingi; tafsiri ya wingi inalinda ushahidi huo wa kisarufi.
- source_word: הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: aliyetupandisha kutoka nchi ya Misri
  rationale: Huhifadhi taswira ya kitenzi cha Kiebrania ya ‘kupandisha’ na kirai kamili ‘nchi ya Misri.’
- source_word: מֶה הָיָה לוֹ
  choice: kilichompata
  rationale: Ni namna ya kawaida na sahihi ya Kiswahili ya kuuliza yaliyomtokea mtu au hatima yake.
theological_decisions:
- issue: Iwapo אֱלֹהִים itafsiriwe kwa umoja au wingi
  choice: 'wingi: “miungu itakayotutangulia”'
  alternative: 'umoja: “mungu atakayetutangulia”'
  rationale: אֱלֹהִים ina umbo la wingi, na kitenzi יֵלְכוּ pia ni cha wingi. Hata hivyo, kwa kuwa simulizi linalofuata linazingatia sanamu moja ya ndama, usomaji wa umoja umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wa leo; uradidi wa ‘watu’ wa Kiebrania umepunguzwa kwa kutumia kiwakilishi cha kitenzi bila kupoteza mhusika. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
