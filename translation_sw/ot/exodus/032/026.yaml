  text: Then Moses stood at the gate of the camp and said[a], “Whoever is for Yahweh[b], come to me.” And all the sons of Levi gathered to him.
translation:
  language: sw
  text: Ndipo Musa akasimama kwenye lango la kambi, akasema[a], “Yeyote aliye upande wa Yahwe na aje kwangu.” Wana wote wa Lawi wakakusanyika kwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Ni nani aliye wa Yahwe? Kwangu!” Tafsiri inaweka wazi mwito unaodokezwa: “na aje kwangu.”'
    reason: lexical_alternative
  - marker: b
