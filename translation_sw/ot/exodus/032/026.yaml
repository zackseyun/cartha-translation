    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: akasimama
  rationale: Kitenzi עמד katika masimulizi kinaonyesha Musa alisimama mahali hapo; “akasimama” ni Kiswahili cha kawaida bila kuongeza wazo la kijeshi.
- source_word: בְּשַׁעַר הַמַּחֲנֶה
  choice: kwenye lango la kambi
  rationale: שַׁעַר ni lango; “kwenye” huonyesha mahali kwa Kiswahili cha kawaida huku picha halisi ya lango ikihifadhiwa.
- source_word: מִי לַיהוָה
  choice: Ni nani aliye upande wa Yahwe?
  rationale: Huhifadhi umbo la swali la Kiebrania na maana ya uaminifu au kumuunga Yahwe mkono, bila kulifanya kauli ya jumla.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja kwa tahajia inayofaa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֵלַי
  choice: Na aje kwangu
  rationale: Kiebrania kina kifungu kifupi, “kwangu!” Kiswahili huhitaji kitenzi kinachoeleweka; “aje” huweka wazi mwito uliodokezwa bila kuongeza maana nyingine.
- source_word: וַיֵּאָסְפוּ
  choice: wakakusanyika
  rationale: Nifali ya אסף hapa ina maana ya kukusanyika; uchaguzi huu ni wa kawaida na hauna rangi ya kijeshi isiyoelezwa wazi.
- source_word: אֵלָיו
  choice: kwake
  rationale: Hutoa maana ya kuelekea kwa Musa kwa ufupi na kwa kawaida katika Kiswahili.
- source_word: כָּל בְּנֵי לֵוִי
  choice: Wana wote wa Lawi
  rationale: Huhifadhi kwa karibu usemi wa ukoo “wana wa Lawi,” badala ya kuufupisha kuwa “Walawi.”
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina maalumu la Mungu; kulitohowa kama “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מִי לַיהוָה
  choice: Ni nani aliye upande wa Yahwe?
  alternative: Yeyote aliye wa Yahwe
  rationale: Swali la Kiebrania na maana yake ya kuchagua upande zimehifadhiwa, pamoja na mkazo wa uaminifu katika mazingira haya.
- issue: Usemi wa kikabila בְּנֵי לֵוִי
  choice: Wana wote wa Lawi
  alternative: Walawi wote
  rationale: Usemi halisi wa uhusiano wa ukoo umehifadhiwa; tanbihi inatoa namna ya kawaida zaidi ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi umetumia viambishi vya mfululizo “aka-”; jina “Yahwe” limetoholewa kwa tahajia ya Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
