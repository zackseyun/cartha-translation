base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/029.yaml
  text: And Moses said, “Today ordain yourselves to the LORD, for each man has been against his son and against his brother, so that he may bestow a blessing on you today.”
translation:
  language: sw
  text: Musa akasema, “Jiwekeni wakfu leo kwa BWANA,[a] kwa maana kila mmoja amekuwa dhidi ya mwanawe na ndugu yake, ili mpate kupewa baraka leo.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “ijazeni mikono yenu kwa ajili ya BWANA”; hii ni nahau ya kujiweka wakfu au kuwekwa rasmi kwa ajili ya utumishi.
    reason: Kuhifadhi taswira ya Kiebrania na maana yake ya kiibada bila kuifanya sentensi kuu kuwa ngumu.
  - marker: b
    text: Kiebrania hakimtaji wazi anayetoa baraka; huenda ikarejelea BWANA au ikawa njia isiyo ya moja kwa moja ya kusema kwamba watapokea baraka.
    reason: Kuhifadhi utata halisi wa mtendaji katika kifungu cha mwisho.
lexical_decisions:
- source_word: מִלְאוּ יֶדְכֶם
  choice: Jiwekeni wakfu
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kujitenga au kuwekwa rasmi kwa ajili ya utumishi; tafsiri hii ni ya kawaida na inayoeleweka kwa Kiswahili huku tanbihi ikihifadhi taswira halisi ya ‘kujaza mkono’.
- source_word: לַיהוָה
  choice: kwa BWANA
  rationale: Inaonyesha kuwa kujiweka wakfu ni kwa ajili ya YHWH; ‘BWANA’ ni uwasilishaji wa kawaida wa jina la agano katika tafsiri za Kiswahili.
- source_word: כִּי אִישׁ בִּבְנוֹ וּבְאָחִיו
  choice: kwa maana kila mmoja amekuwa dhidi ya mwanawe na ndugu yake
  rationale: Kirai cha Kiebrania ni kifupi na hakina kitenzi wazi. ‘Amekuwa dhidi ya’ huhifadhi hali yake ya kimakusudi bila kuongeza kitenzi mahususi kama ‘ameua,’ ingawa muktadha wa mstari uliotangulia unaonyesha hatua ya vurugu.
- source_word: וְלָתֵת עֲלֵיכֶם הַיּוֹם בְּרָכָה
  choice: ili leo baraka iwekwe juu yenu
  rationale: Muundo wa kutendwa huhifadhi kutotajwa wazi kwa mtendaji wa ‘kutoa’ katika Kiebrania na pia taswira ya baraka kuwa ‘juu’ yao.
theological_decisions:
- issue: Maana ya kujiweka wakfu baada ya kuwageukia jamaa
  choice: Aya inaunganisha uaminifu kwa BWANA na kitendo cha kuwa dhidi ya mwana na ndugu bila kuongeza hukumu ya kimadhehebu kuhusu cheo maalumu cha ukuhani.
  alternative: Kutafsiri kama kupewa rasmi ukuhani au kujiwekea mamlaka ya kikuhani.
  rationale: Nahau inaweza kutumiwa kwa kuwekwa rasmi katika huduma, lakini hapa muundo wa kujirejelea na muktadha unaruhusu maana pana ya kujiweka wakfu; tafsiri haipaswi kudai zaidi ya ushahidi wa aya.
- issue: Mtendaji anayetoa baraka
  choice: 'Kutumia muundo wa kutendwa: ‘baraka iwekwe juu yenu.’'
  alternative: ‘Ili yeye awape baraka leo,’ ambapo ‘yeye’ angeweza kueleweka kuwa BWANA au Musa.
  rationale: Kitenzi kisicho katika hali timilifu hakitaji mtendaji wazi. Muundo wa kutendwa huhifadhi utata huo wa kisarufi na wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Jiwekeni wakfu’ ni wazi kwa msomaji wa kawaida, huku ‘amekuwa dhidi ya’ ikihifadhi ufupi na mvutano wa Kiebrania. Alama za tanbihi [a] na [b] zimewekwa katika matini kuu.
