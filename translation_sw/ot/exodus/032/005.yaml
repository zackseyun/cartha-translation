base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/005.yaml
  text: When Aaron saw it[a], he built an altar before it. Then Aaron proclaimed and said, “Tomorrow will be a feast to Yahweh.”
translation:
  language: sw
  text: Haruni alipoona, akajenga madhabahu mbele yake[a]. Kisha Haruni akatangaza, akisema, “Kesho kutakuwa na sikukuu kwa Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbele yake [Haruni]”; kiambishi cha Kiebrania kinaweza kisarufi kumrejelea Haruni, ingawa muktadha unaelekea zaidi kwa ndama.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: Haruni alipoona hayo
  rationale: Kitenzi kina maana ya ‘aliona’; ‘hayo’ linaeleweka kutokana na muktadha wa ndama aliyekuwa ametengenezwa, huku muundo wa ‘alipo-’ ukionyesha mfuatano wa wakati kwa Kiswahili cha kawaida.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: akajenga madhabahu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya בנה pamoja na מזבח, yenye kuhifadhi maana ya ibada.
- source_word: לְפָנָיו
  choice: mbele yake
  rationale: Kiwakilishi cha Kiebrania ni cha umoja wa kiume na kinaweza kurejelea ndama au, kisarufi, Haruni. Kiswahili ‘yake’ kinahifadhi utata huo bila kuamua kimya kimya rejeleo lake.
- source_word: וַיִּקְרָא ... וַיֹּאמַר
  choice: akatangaza, akisema
  rationale: קרא katika muktadha huu ni tangazo la hadharani; ‘akatangaza, akisema’ ni ya asili na pia huhifadhi vitenzi vyote viwili vya Kiebrania.
- source_word: חַג
  choice: sikukuu
  rationale: ‘Sikukuu’ ni neno la kawaida na lenye hadhi kwa sherehe ya kidini, bila kuongeza dhana mahususi ya hija.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Kiambishi ל kinaonyesha kwamba sikukuu inaelekezwa au kuwekwa wakfu kwa Yahweh; ‘kwa’ ni ya asili katika tangazo hili.
- source_word: מָחָר
  choice: Kesho kutakuwa na
  rationale: Kiebrania kina kishazi nomino bila kitenzi wazi; Kiswahili huhitaji muundo kama ‘kutakuwa na’ ili tangazo lisikike wazi na la kawaida.
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina la agano יהוה moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Rejeleo la kiwakilishi katika לְפָנָיו
  choice: Kuhifadhi utata kwa ‘mbele yake’
  alternative: mbele ya ndama; mbele ya Haruni
  rationale: Muktadha unaelekea zaidi kwa ndama, lakini sarufi inaweza pia kurejelea Haruni. Tafsiri kuu haipaswi kuondoa utata halisi; tanbihi inaueleza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa masimulizi ya Biblia lakini unaeleweka kwa msomaji wa kawaida. Alama zote za tanbihi zinapaswa kuonekana katika matini kuu; kwa hiyo tanbihi [b] imewekwa baada ya ‘yake’.
