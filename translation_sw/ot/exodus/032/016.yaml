  yaml_path: translation/ot/exodus/032/016.yaml
  text: The tablets were the work of God[a], and the writing was the writing of God, engraved on the tablets.
translation:
  language: sw
  text: Vibao hivyo vilikuwa kazi ya Mungu[a], na maandishi yalikuwa maandishi ya Mungu, yaliyochongwa kwenye vibao hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ufundi wa Mungu ... maandishi ya Mungu.” Kiebrania hurudia neno “maandishi” ili kusisitiza kwamba hayo ni maandishi ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלֻּחֹת
  choice: vibao hivyo
  rationale: “Vibao” ni neno la kawaida kwa vitu bapa vinavyotumiwa kuandikia; haliongezi neno “mawe,” ambalo halitajwi wazi katika mstari huu. Kionyeshi “hivyo” kinafaa kwa vibao ambavyo tayari vimetajwa katika muktadha.
- source_word: מַעֲשֵׂה אֱלֹהִים
  choice: kazi ya Mungu
  rationale: Huhifadhi muundo wa nomino wa Kiebrania na msisitizo kwamba vibao vyenyewe vilikuwa kazi ya Mungu, badala ya kuugeuza moja kwa moja kuwa kitenzi.
- source_word: הֵמָּה
  choice: vilikuwa
  rationale: Kiwakilishi cha kusisitiza katika Kiebrania kinawakilishwa kwa kawaida ndani ya kishazi cha Kiswahili bila kuongeza kiwakilishi tofauti.
- source_word: הַמִּכְתָּב מִכְתַּב אֱלֹהִים
  choice: maandishi yalikuwa maandishi ya Mungu
  rationale: Huhifadhi urudiaji wa neno “maandishi,” ambao unaweka mkazo juu ya chanzo cha maandishi hayo.
- source_word: חָרוּת
  choice: yaliyochongwa
  rationale: Neno hili linaonyesha maandishi yaliyokatwa au kuchongwa katika uso mgumu; “yaliyochongwa” ni sahihi na la kawaida katika muktadha wa vibao.
- source_word: עַל הַלֻּחֹת
  choice: kwenye vibao hivyo
  rationale: Hutoa maana ya mahali kwa Kiswahili cha kawaida na kueleweka, huku ikirejelea tena vibao vilevile.
- source_word: וְ
  choice: nayo
  rationale: Kiunganishi kinaendeleza sentensi na kuunganisha maelezo ya vibao na ya maandishi bila kuingiza kielezi cha wakati ambacho hakipo katika chanzo.
theological_decisions:
- issue: Uhusiano wa Mungu na vibao pamoja na maandishi
  choice: Vibao vyenyewe vinaitwa kazi ya Mungu, na maandishi yanaitwa maandishi ya Mungu.
  alternative: “Vibao vilitengenezwa na Mungu, na maandishi yaliandikwa na Mungu.”
  rationale: Muundo wa nomino katika Kiebrania umehifadhiwa ili kuonyesha kwa msisitizo kwamba vyote vinahusishwa moja kwa moja na Mungu, bila kuongeza maelezo kuhusu namna ya utendaji wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Vibao” kimetumiwa badala ya “mbao” ili kuepuka kudokeza kwamba vilikuwa vya mbao; hata hivyo, nyenzo yake haijaongezwa kwa kuwa haitajwi wazi katika mstari huu. Urudiaji wa “maandishi” umehifadhiwa kwa sababu ni sehemu ya msisitizo wa Kiebrania.
