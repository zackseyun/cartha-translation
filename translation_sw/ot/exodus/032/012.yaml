base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/012.yaml
  text: Why should the Egyptians say[a], ‘He brought them out with evil intent, to kill them in the mountains and to wipe them off the face of the earth’? Turn from your burning anger[c][b], and relent concerning the harm intended for your people.
translation:
  language: sw
  text: Kwa nini Wamisri waseme, ‘Aliwatoa kwa nia mbaya[a], ili awaue milimani na kuwafutilia mbali kutoka juu ya uso wa dunia[b]’? Geuka kutoka katika hasira yako kali, na ughairi kuwaletea watu wako maafa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kusudi baya” au “kwa mabaya.” Kirai cha Kiebrania kinaonyesha nia mbaya ambayo Wamisri wangemdai Mungu alikuwa nayo.
    reason: lexical_alternative
  - marker: b
    text: Au, “na kuwateketeza.” Kitenzi cha Kiebrania kina wazo la maangamizi kamili.
    reason: lexical_alternative
  - marker: c
    text: Au, “ubadili nia yako kuhusu maafa.” Kiebrania kinamtaja Mungu kwa lugha ya kibinadamu katika ombi la Musa.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ מִצְרַיִם
  choice: Kwa nini Wamisri waseme
  rationale: Kauli hii ni swali la balagha katika ombi la Musa. ‘Waseme’ huwasilisha kwa kawaida thamani ya kitenzi kisichotimilika katika muktadha huu.
- source_word: בְּרָעָה
  choice: kwa nia mbaya
  rationale: Kirai hiki kinaonyesha kusudi baya ambalo Wamisri wangemdai Mungu alikuwa nalo, si matokeo mabaya tu.
- source_word: הוֹצִיאָם
  choice: Aliwatoa
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi cha Hiphil katika muktadha wa kutoka Misri.
- source_word: לַהֲרֹג אֹתָם
  choice: ili awaue
  rationale: Infinitivu inaonyesha kusudi; ‘ili awaue’ ni Kiswahili cha kawaida na wazi.
- source_word: בֶּהָרִים
  choice: milimani
  rationale: Huhifadhi wingi wa nomino ya Kiebrania na kuelekeza kwenye eneo la milima.
- source_word: וּלְכַלֹּתָם
  choice: na kuwaangamiza kabisa
  rationale: Kitenzi כלה katika Piel kinaonyesha kuharibu kikamilifu; ‘kabisa’ hubainisha nguvu hiyo.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: kutoka juu ya uso wa dunia
  rationale: Huhifadhi taswira ya nahau ya Kiebrania ya kuwaondoa kabisa duniani.
- source_word: שׁוּב מֵחֲרוֹן אַפֶּךָ
  choice: Geuka, uiache hasira yako kali
  rationale: ‘Geuka’ huhifadhi amri ya שוב, huku ‘hasira yako kali’ ikiwasilisha wazo la joto au ukali wa hasira kwa Kiswahili cha kawaida.
- source_word: וְהִנָּחֵם עַל הָרָעָה לְעַמֶּךָ
  choice: na ughairi kuwaletea watu wako maafa
  rationale: ‘Ughairi’ huhifadhi ombi halisi la Musa bila kudokeza toba kutokana na kosa la kimaadili; ‘maafa’ huonyesha madhara ya hukumu yanayotishiwa.
theological_decisions:
- issue: Lugha inayomhusisha Mungu na mwitikio wa kibinadamu katika וְהִנָּחֵם
  choice: ughairi
  alternative: badili nia yako; juta
  rationale: ‘Ughairi’ huhifadhi nguvu ya ombi la Musa na mvutano wa kifungu, lakini haiongezi dai kwamba Mungu alifanya kosa la kimaadili.
- issue: Maana ya הָרָעָה kuhusu tendo la hukumu linalotishiwa
  choice: maafa
  alternative: madhara; mabaya
  rationale: ‘Maafa’ huonyesha janga au madhara kwa watu bila kuita tendo la Mungu uovu wa kimaadili. Pia hutofautisha matumizi haya na בְּרָעָה, ambako Wamisri wangemdai Mungu kuwa na nia mbaya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha na taswira ya ‘uso wa dunia’ zimehifadhiwa; semi ngumu zimefanywa za kawaida bila kufuta utata wa kiteolojia.
