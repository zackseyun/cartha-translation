base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/027.yaml
  text: 'And he said to them[a], “Thus says Yahweh, the God of Israel: Each man, put his sword on his thigh. Pass through and return from gate to gate throughout the camp, and each man kill his brother, and each man his companion, and each man his neighbor.”'
translation:
  language: sw
  text: 'Akawaambia, “Yahweh, Mungu wa Israeli, asema hivi: Kila mwanamume afunge upanga wake kiunoni. Piteni na mrudi kutoka lango hadi lango katika kambi, na kila mwanamume amuue ndugu yake, kila mwanamume amuue mwenzake, na kila mwanamume amuue aliye karibu naye.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mtu aliye karibu naye”; inaweza pia kutafsiriwa “jamaa yake” au “ndugu yake wa karibu.”'
    reason: Neno קְרֹבוֹ linaweza kumaanisha mtu wa karibu kwa ujumla, jamaa, au ndugu wa karibu.
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Akawaambia
  rationale: Muundo wa masimulizi unaunganisha tendo hili na yaliyotangulia kwa njia ya kawaida na ya asili katika Kiswahili.
- source_word: כֹּה אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Yahweh, Mungu wa Israeli, asema hivi
  rationale: Inahifadhi jina la Mungu na fomula ya ujumbe wenye mamlaka, huku mpangilio wake ukiwa wa kawaida katika Kiswahili.
- source_word: שִׂימוּ אִישׁ חַרְבּוֹ עַל יְרֵכוֹ
  choice: Kila mwanamume afunge upanga wake kiunoni
  rationale: Kirai hiki ni nahau ya kujizatiti kwa silaha; “afunge ... kiunoni” ni Kiswahili cha asili kuliko tafsiri ya moja kwa moja ya kuweka upanga juu ya paja.
- source_word: עִבְרוּ וָשׁוּבוּ
  choice: Piteni na kurudi
  rationale: Inadumisha vitenzi viwili vya amri na wazo la kupita kisha kurudi bila kulifanya kwa lazima kuwa tendo la kurudiarudia.
- source_word: מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה
  choice: kutoka lango hadi lango katika kambi yote
  rationale: Inaonyesha mwendo unaoenea katika kambi nzima na kuhifadhi taswira ya lango hadi lango.
- source_word: וְהִרְגוּ אִישׁ אֶת אָחִיו וְאִישׁ אֶת רֵעֵהוּ וְאִישׁ אֶת קְרֹבוֹ
  choice: na kila mwanamume amuue ndugu yake, kila mwanamume amuue mwenzake, na kila mwanamume amuue aliye karibu naye
  rationale: Marudio ya “kila mwanamume” yanahifadhi mkazo wa Kiebrania na ukaribu wa mahusiano hayo matatu; “aliye karibu naye” haifungi קְרֹבוֹ kwa maana moja tu.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu; kulitaja kama “Yahweh” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Marudio ya אִישׁ katika amri
  choice: kila mwanamume ... kila mwanamume ... kila mwanamume
  alternative: kila mmoja ... kila mmoja ... kila mmoja
  rationale: Katika muktadha amri inaelekezwa kwa wanaume Walawi; “mwanamume” huhifadhi marejeo ya jinsia na marudio yenye msisitizo ya chanzo.
- issue: Maana ya קְרֹבוֹ
  choice: aliye karibu naye
  alternative: jamaa yake wa karibu
  rationale: Neno linaweza kumaanisha mtu wa karibu au jamaa; tafsiri pana na tanbihi huhifadhi uwezekano huo badala ya kuamua kimyakimya kuwa ni uhusiano wa damu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ya amri imewekwa wazi bila kupunguza ukali wa hukumu katika chanzo; muundo wa marudio umehifadhiwa kwa msisitizo.
