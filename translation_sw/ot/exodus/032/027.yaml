    issue: Unganifu wa kitenzi katika “Piteni na kurudi”
    rationale: Piteni ni amri ya wingi, lakini kurudi ni kitenzi-jina. Kiebrania kina amri mbili za wingi, עִבְרוּ וָשׁוּבוּ; hivyo “Piteni na mrudi” huhifadhi muundo na maana.
