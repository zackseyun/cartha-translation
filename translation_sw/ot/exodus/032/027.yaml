  verdict: revise
  source_fidelity: Draft generally preserves the Hebrew sequence, the divine name, the distributive repetition of אִישׁ, and the deliberately broad sense of קְרֹבוֹ. However, “Piteni na kurudi” mixes a plural imperative with an infinitive and therefore fails to render the two coordinated plural imperatives עִבְרוּ וָשׁוּבוּ. “Katika kambi yote” slightly strengthens the simple locative “in the camp.”
  naturalness: The proposed revision uses idiomatic, standard East African Swahili while retaining the authoritative command register and the stark repeated structure. “Piteni na mrudi” is grammatically parallel and clear.
  terminology: “Yahweh” appropriately represents יהוה. “Mwanamume,” “ndugu,” “mwenzake,” and “aliye karibu naye” retain the relevant distinctions without prematurely restricting the final term to a blood relative. The footnote is retained and made more idiomatic and precise in Swahili.
