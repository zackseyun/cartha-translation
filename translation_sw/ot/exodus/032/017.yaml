  text: When Joshua heard the sound of the people as they shouted[a], he said to Moses, “There is the sound of war in the camp.”
translation:
  language: sw
  text: Yoshua aliposikia sauti ya watu wakipiga kelele[a], akamwambia Musa, “Kuna sauti ya vita kambini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika makelele yao” au “walipokuwa wakitoa kilio kikubwa.” Usemi wa Kiebrania unarejelea kilio kikubwa au kelele za watu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: aliposikia
  rationale: Kitenzi cha Kiebrania hapa kinaeleza kutambua sauti kwa kusikia katika mfululizo wa simulizi; “aliposikia” ni Kiswahili cha kawaida na huunganisha kwa asili na tendo linalofuata.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: קוֹל
  choice: sauti
  rationale: Neno linaweza kumaanisha sauti, kelele, au sauti ya mtu. “Sauti” huhifadhi upana wake na linafaa kwa msukosuko unaosikika; limetumiwa katika sehemu zote mbili kwa uthabiti.
- source_word: הָעָם
  choice: watu
  rationale: Hapa neno linarejelea watu wa Israeli kwa ujumla; “watu” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: בְּרֵעֹה
  choice: wakipiga kelele
  rationale: Usemi unaonyesha watu wakitoa kilio au kelele kubwa. Kiambishi cha umoja katika Kiebrania kinaafikiana na nomino ya mkusanyiko, lakini Kiswahili hutumia wingi kwa kawaida.
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: akamwambia Musa
  rationale: Huu ni usemi wa kawaida wa kisimulizi; “akamwambia” ni wa asili zaidi katika Kiswahili kuliko “akasema kwa Musa.”
- source_word: קוֹל מִלְחָמָה
  choice: sauti ya vita
  rationale: Tafsiri hii huhifadhi muundo wa Kiebrania na kutobainisha kimyakimya ikiwa ni mapigano yenyewe au sauti inayofanana nayo.
- source_word: בַּמַּחֲנֶה
  choice: kambini
  rationale: Neno linarejelea kambi ya Waisraeli; “kambini” ni fupi, wazi, na la kawaida.
