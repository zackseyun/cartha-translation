  text: Now leave me alone[a], so that my anger may burn against them and I may consume them[b]; and I will make you into a great nation.
translation:
  language: sw
  text: Sasa niache[a], ili hasira yangu iwake dhidi yao nami niwateketeze[b]; nami nitakufanya kuwa taifa kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usinizuie.”
    reason: lexical_alternative
  - marker: b
    text: Au, “niwaangamize.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Kiunganishi hiki kinaendeleza hotuba na kuingiza agizo la papo hapo; “Basi sasa” ni cha kawaida na huhifadhi uhusiano na yaliyotangulia.
- source_word: הַנִּיחָה לִּי
  choice: niache
  rationale: Katika nahau hii, kausativi ya נוח ina maana ya kumwacha mtu au kuacha kumzuia. “Niache” ni agizo la moja kwa moja na la asili katika Kiswahili; tanbihi inaonyesha maana iliyo wazi zaidi ya “acha kunizuia.”
- source_word: וְיִחַר אַפִּי
  choice: ili hasira yangu iwake
  rationale: Nahau ya Kiebrania huonyesha hasira kama inayowaka. Tafsiri hii huhifadhi sitiari hiyo, huku “ili” ikionyesha kusudi au matokeo yanayofuata agizo.
- source_word: בָהֶם
  choice: dhidi yao
  rationale: Katika muktadha wa hasira, kihusishi kinaelekeza hasira kwa watu hao; “dhidi yao” ni wazi na cha kawaida.
- source_word: וַאֲכַלֵּם
  choice: na niwaangamize
  rationale: Piel ya כלה hapa humaanisha kuwakomesha kabisa, kuwaangamiza, au kuwamaliza. “Niwaangamize” ni Kiswahili cha sasa na chenye nguvu kinacholingana na hukumu inayotajwa; tanbihi huhifadhi mbadala wa “niwateketeze.”
- source_word: וְאֶעֱשֶׂה אוֹתְךָ
  choice: kisha nitakufanya wewe kuwa
  rationale: Muundo wa עשה pamoja na ל unaonyesha kumfanya mtu awe kitu kilichotajwa. “Wewe” imetajwa ili kuhifadhi mkazo wa utofautishaji kati ya watu hao na Musa.
- source_word: לְגוֹי גָּדוֹל
  choice: taifa kubwa
  rationale: גוי humaanisha taifa au kundi la watu. “Taifa kubwa” ni tafsiri ya moja kwa moja na huhifadhi mwangwi wa ahadi za agano bila kuongeza maelezo.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu hasira ya Mungu
  choice: Kuhifadhi sitiari ya hasira ya Mungu kuwaka.
  alternative: Kuisawazisha kuwa “nikasirike nao.”
  rationale: Kiebrania kinatumia lugha hai ya hasira inayowaka. Kuihifadhi hudumisha uzito wa simulizi na mvutano wa kitheolojia kuhusu utakatifu na hukumu ya Mungu.
- issue: Nguvu ya agizo הַנִּיחָה לִּי kuhusiana na maombezi ya Musa
  choice: Kulitoa kama agizo halisi, “niache,” bila kueleza kwamba ni mwaliko wa Musa kuombea watu.
  alternative: Kulifasiri moja kwa moja kama mwaliko usiosemwa wa Musa kuingilia kati.
  rationale: Aya yenyewe ina agizo la moja kwa moja pamoja na tangazo la hukumu na ahadi. Dhana kwamba agizo hilo ni mwaliko wa maombezi ni tafsiri ya maana ambayo haipaswi kuongezwa katika matini.
- issue: Uhusiano wa וְ baada ya agizo
  choice: Kutumia “ili” kwa kusudi au matokeo, na “kisha” kabla ya ahadi inayofuata.
  alternative: Kutafsiri viunganishi vyote kwa “na,” kana kwamba ni mfuatano usio na uhusiano wa kusudi au matokeo.
  rationale: Katika muktadha, kuwaka kwa hasira na kuangamizwa kwa watu kunawasilishwa kama jambo litakalofuata Musa akimwacha Mungu; “ili” huonyesha uhusiano huu bila kuamua kwa ukali kati ya kusudi na matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa msomaji wa kawaida. Sitiari ya hasira kuwaka imehifadhiwa; “niwaangamize” huepuka hali ya kizamani huku ikidumisha ukali wa kitenzi. Alama zote za tanbihi [a] na [b] zimo katika matini kuu.
