base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/023.yaml
  text: And they said to me[a], ‘Make gods for us, which will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.’
translation:
  language: sw
  text: Nao wakaniambia[a], “Tutengenezee miungu itakayotutangulia, kwa sababu Musa huyu, mtu aliyetupandisha kutoka nchi ya Misri—hatujui yaliyompata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tutengenezee mungu atakayetutangulia.” Ingawa mstari huu unatumia umbo la wingi pamoja na kitenzi cha wingi (“miungu ... itakayotutangulia”), wengine hutafsiri maana yake kwa umoja kwa kuzingatia sanamu ya ndama katika muktadha unaozunguka.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: Nao wakaniambia
  rationale: Kiunganishi na kitenzi cha masimulizi vinaendeleza mfululizo wa habari; “Nao wakaniambia” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo.
- source_word: עֲשֵׂה לָנוּ
  choice: Tufanyie
  rationale: Huhifadhi amri ya ‘kutengeneza/kufanya’ pamoja na maana ya jambo kufanywa kwa ajili yao.
- source_word: אֱלֹהִים
  choice: miungu
  rationale: Ingawa nomino hii inaweza kuwa na maana ya umoja au wingi, kitenzi cha wingi יֵלְכוּ kinaunga mkono maana ya wingi katika mstari huu.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: watakaotutangulia
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha kwenda mbele ili kuwaongoza; upatanisho wa ngeli unaonyesha wingi na hali ya kiungu/kibinafsi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Huonyesha wazi sababu iliyotolewa kwa ombi hilo.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: huyu Musa, yule mtu
  rationale: “Huyu Musa” huhifadhi ladha ya kumtenga au kumdharau kidogo, huku “yule mtu” ikiwakilisha nomino ya ufafanuzi bila kuifanya sentensi kuwa nzito.
- source_word: אֲשֶׁר הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: aliyetupandisha kutoka nchi ya Misri
  rationale: Huhifadhi maana ya Hifili ya עלה, ‘kuwapandisha/kuwaleta juu,’ na kutaja kikamilifu nchi ya Misri.
- source_word: לֹא יָדַעְנוּ מֶה הָיָה לוֹ
  choice: hatujui yaliyompata
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachoeleza kutokujua hatima au jambo lililompata mtu.
theological_decisions:
- issue: Iwapo אֱלֹהִים itafsiriwe kwa umoja au wingi katika taarifa ya Aroni
  choice: 'wingi: “miungu”'
  alternative: 'umoja: “mungu”'
  rationale: Kitenzi cha wingi יֵלְכוּ (‘watakwenda’) kinaunga mkono sana tafsiri ya wingi. Tafsiri hii haipatanishi kimya kimya maneno ya mstari huu na sanamu moja ya ndama katika muktadha, bali inadumisha mvutano uliopo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa wingi umehifadhiwa katika matini kuu, huku uwezekano wa umoja ukielezwa katika tanbihi.
