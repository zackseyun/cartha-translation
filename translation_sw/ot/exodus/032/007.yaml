base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/007.yaml
  text: Then Yahweh said to Moses[a], “Go down, because your people, whom you brought up from the land of Egypt, have corrupted themselves.”
translation:
  language: sw
  text: Kisha Yahweh akamwambia Musa, “Nenda, shuka, kwa maana watu wako, ambao uliwapandisha kutoka nchi ya Misri, wamejiharibu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wametenda kwa upotovu.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa namna inayosisitiza mwenendo mpotovu badala ya matokeo ya kujiharibu wenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akamwambia
  rationale: Waw ya usimulizi inaendeleza simulizi; “Kisha” na “akamwambia” ni Kiswahili cha kawaida kinachowasilisha kwa ufasaha tendo la kusema kwa Musa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja katika Kiebrania, hivyo linatunzwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: לֶךְ רֵד
  choice: Shuka
  rationale: Ingawa muundo una vitenzi viwili, לֶךְ hapa hutumika pamoja na רֵד kuunda agizo moja la kwenda chini; “Shuka” ni la asili katika Kiswahili na halidokezi kimakosa maagizo mawili tofauti.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya Musa kuagizwa ashuke.
- source_word: שִׁחֵת
  choice: wamejiharibu
  rationale: Huwasilisha nguvu ya uharibifu wa kimaadili unaowahusu wenyewe katika muktadha huu, huku tanbihi ikihifadhi uwezekano wa kusisitiza mwenendo wao mwovu.
- source_word: עַמְּךָ
  choice: watu wako
  rationale: Nomino ya pamoja עַם humaanisha “watu”; kiambishi cha nafsi ya pili kinatunza msisitizo wa kimazungumzo wa “watu wako.”
- source_word: אֲשֶׁר הֶעֱלֵיתָ
  choice: ambao uliwapandisha
  rationale: Kitenzi cha kusababisha kupanda kinamwelekeza Musa kama mtendaji wa kuwatoa na kuwaleta juu kutoka Misri.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: kutoka nchi ya Misri
  rationale: Hufuata wazi usemi wa Kiebrania “kutoka nchi ya Misri” na ni wa kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Maandishi yanatumia Tetragramatoni kama jina binafsi; “Yahweh” hulihifadhi bila kulibadilisha kuwa cheo.
- issue: Nguvu inayoweza kueleweka kuwa ya kujirejelea katika שִׁחֵת
  choice: wamejiharibu
  alternative: wametenda kwa upotovu; wamepotoka
  rationale: Chaguo hili linatunza dhana ya watu kujiletea uharibifu wa kimaadili, bila kuficha uwezekano wa kitenzi kusisitiza matendo yao maovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Sentensi imeundwa kwa mtiririko wa kawaida wa simulizi huku ikihifadhi jina Yahweh, usemi muhimu “watu wako,” na utata wa kitenzi שִׁחֵת kwa tanbihi.
