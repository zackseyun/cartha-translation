  text: Then Yahweh struck the people with a plague because of what they did with the calf that Aaron made[a].
translation:
  language: sw
  text: Ndipo Yahweh akawapiga watu kwa sababu ya yale waliyofanya kuhusu ndama aliyetengenezwa na Aroni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ndipo Yahweh akawapiga watu kwa sababu ya yale waliyofanya kuhusu ndama aliyetengenezwa na Aroni.” Kitenzi cha Kiebrania kinaweza kumaanisha kwa ujumla “kupiga”; katika muktadha huu kinaweza pia kueleweka kuwa kuleta pigo au tauni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: akawapiga ... kwa tauni
  rationale: Kitenzi נָגַף kina maana ya kupiga au kuleta madhara, na mara nyingi hutumiwa kuhusu tauni au hukumu. Tafsiri hii inaonyesha nguvu ya kitenzi na maana yake inayowezekana katika muktadha bila kudai kwamba watu waliuawa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: הָעָם
  choice: watu
  rationale: Hapa עַם linarejelea jamii ya Israeli kwa ujumla; “watu” ni Kiswahili cha kawaida na cha asili.
- source_word: עַל אֲשֶׁר
  choice: kwa sababu ya yale
  rationale: Muundo huu unaonyesha sababu; usemi huu wa Kiswahili unahifadhi uhusiano huo wa kisababishi.
- source_word: עָשׂוּ
  choice: waliyofanya kuhusiana na
  rationale: Ingawa עשה pia linaweza kumaanisha “kutengeneza,” kitenzi cha wingi kinaeleza hatia ya watu kuhusu ndama, huku kishazi kinachofuata kikisema kwamba Aroni ndiye aliyeutengeneza. Tafsiri hii huepuka kumfanya kila mtu kuwa mtengenezaji wa ndama.
- source_word: הָעֵגֶל
  choice: ndama
  rationale: Neno linamaanisha ndama. “Wa dhahabu” halijaongezwa kwa kuwa sifa hiyo haipo katika mstari huu.
- source_word: אֲשֶׁר עָשָׂה אַהֲרֹן
  choice: ambaye Aroni alitengeneza
  rationale: Kishazi hiki kinamtambulisha ndama kuwa yule aliyetengenezwa na Aroni; wakati uliopita wa kawaida unasikika kiasili kwa Kiswahili.
theological_decisions:
- issue: Asili ya hukumu ya Mungu katika וַיִּגֹּף
  choice: “akawapiga watu kwa tauni” katika maandishi makuu
  alternative: “akawapiga watu” bila kutaja tauni
  rationale: Kitenzi cha Kiebrania hakitaji chombo tofauti cha hukumu, lakini kinaweza kumaanisha kupiga kwa tauni au kwa madhara ya hukumu. Maandishi makuu yanatoa maana hiyo ya kimuktadha, na tanbihi inahifadhi tafsiri ya jumla zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka. “Kuhusiana na” hutumiwa kuhifadhi upana wa uhusiano kati ya tendo la watu na ndama bila kutatua kimya kimya mvutano uliopo kati ya kitenzi cha wingi עָשׂוּ na kauli kwamba Aroni ndiye aliyeutengeneza.
