base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/032.yaml
  text: But now[a], if you will forgive their sin—but if not[b], please blot me out of your book that you have written.
translation:
  language: sw
  text: Lakini sasa, ukiwasamehe dhambi yao[a]—lakini kama sivyo, tafadhali nifute kutoka katika kitabu chako[b] ulichoandika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nahau ya Kiebrania hutumia kihalisi wazo la “kuinua,” “kuchukua,” au “kubeba” dhambi; katika muktadha huu inaweza kumaanisha kuiondoa au kuisamehe.
    reason: lexical_alternative
  - marker: b
    text: “Kitabu chako” huenda ni kumbukumbu ya Mungu ya walio hai au, kwa upana zaidi, kitabu cha uzima; Kiebrania hakibainishi zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Lakini sasa
  rationale: Inaonyesha badiliko la hoja na uzito wa ombi la Musa katika muktadha; “lakini” huleta utofautishaji unaodokezwa hapa.
- source_word: תִּשָּׂא חַטָּאתָם
  choice: ukiwasamehe dhambi yao
  rationale: Kitenzi נשׂא humaanisha kihalisi kuinua au kuchukua/kubeba, lakini kinapotumiwa na “dhambi” ni nahau ya kuondoa hatia au kusamehe. “Kuwasamehe dhambi yao” ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: וְאִם אַיִן
  choice: lakini kama sivyo
  rationale: Ni sharti hasi lililofupishwa, linaloleta ugeuko mkali kutoka ombi la msamaha kwenda ombi la Musa kuhusu yeye mwenyewe.
- source_word: מְחֵנִי נָא
  choice: tafadhali nifute
  rationale: מחה ni kufuta au kuondoa kilichoandikwa, na נָא ni neno la kusihi. Kauli hii inafaa kwa taswira ya jina lililo katika kitabu.
- source_word: מִסִּפְרְךָ
  choice: katika kitabu chako
  rationale: סֵפֶר inaweza kuwa kitabu, hati-kunjo, au daftari/kumbukumbu iliyoandikwa. “Kitabu chako” ni ya asili na haibainishi zaidi rejeleo ambalo Kiebrania halibainishi.
- source_word: אֲשֶׁר כָּתָבְתָּ
  choice: ulichoandika
  rationale: Kishazi hiki kinabainisha kuwa Mungu mwenyewe ndiye aliyekiandika kitabu hicho.
theological_decisions:
- issue: Maana halisi ya “kitabu chako”
  choice: kitabu chako
  alternative: daftari lako; kumbukumbu yako iliyoandikwa; kitabu cha uzima
  rationale: Kiebrania hakisemi wazi kama hiki ni kitabu cha walio hai, kitabu cha uzima, au kumbukumbu nyingine ya Mungu. Tafsiri rahisi “kitabu chako” inadumisha utata huo wa msingi.
- issue: Kishazi cha kwanza kisicho na jibu lililotajwa
  choice: kuhifadhi ukatizaji kwa alama ya kistari kirefu
  alternative: kuongeza jibu kama “ni vizuri” au “wasamehe”
  rationale: Baada ya “ukiwasamehe dhambi yao” Kiebrania huacha matokeo ya sharti bila kutamkwa. Kutoongeza maneno kunahifadhi uzito na mvutano wa ombi la Musa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo uliokatizwa kwa kistari kirefu unahifadhi ombi lisilokamilishwa katika Kiebrania bila kulifafanua kwa kuongeza maneno.
