review_pass:
  verdict: revise
  source_fidelity: Draft faithfully preserves the conditional, the deliberately unspoken outcome after the first condition, the singular “their sin,” and the unspecified nature of God’s book. However, מִסִּפְרְךָ is most naturally represented by “kutoka katika kitabu chako” (“out of/from your book”), rather than merely “katika kitabu chako,” which can suggest erasure within the book rather than removal from it.
  naturalness: The register is clear, modern Standard East African Swahili. “Tafadhali nifute kutoka katika kitabu chako” is idiomatic in the record/book metaphor and makes the directional sense explicit.
  terminology: “Dhambi,” “kusamehe,” “kitabu chako,” and “kufuta” are suitable and do not prejudge the referent of the divine book. The footnotes appropriately retain the Hebrew idiom and theological ambiguity.
  issues:
  - severity: medium
    issue: The phrase “nifute katika kitabu chako” does not explicitly render the Hebrew preposition min (“from/out of”).
    rationale: In context, Moses asks to be blotted out from God’s book. Adding “kutoka katika” accurately represents removal from the book while retaining the established Swahili wording and imagery.
  revised_text: Lakini sasa, ukiwasamehe dhambi yao[a]—lakini kama sivyo, tafadhali nifute kutoka katika kitabu chako[b] ulichoandika.
  revised_footnotes:
