    reason: lexical_alternative
  - marker: b
    text: “Kitabu chako” huenda ni kumbukumbu ya Mungu ya walio hai au, kwa upana zaidi, kitabu cha uzima; Kiebrania hakibainishi zaidi.
    reason: alternative_reading
  revision_rationale: Marekebisho pekee ni kuongeza “kutoka katika” ili kuwakilisha kwa wazi מִן (“kutoka/katika”) katika “kutoka katika kitabu chako.” Kistari kirefu baada ya sharti la kwanza na maneno mengine yamehifadhiwa ili kutoongeza jibu ambalo maandishi ya Kiebrania hayalitaji.
