base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/019.yaml
  text: And as soon as he came near the camp and saw the calf and the dancing[a], Moses' anger burned, and he threw the tablets from his hands and shattered them at the foot of the mountain.
translation:
  language: sw
  text: Mara tu Musa alipokaribia kambi, akaiona ndama na dansi[a], hasira yake ikawaka. Akavitupa vile vibao kutoka mkononi mwake, akavivunja chini ya mlima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dansi mbalimbali.” Nomino ya Kiebrania iko katika wingi; “dansi” katika Kiswahili inaweza kutumiwa kwa maana ya kitendo cha kucheza kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Mara tu
  rationale: Fomula hii ya usimulizi inaanzisha tukio linalofuata na ina maana ya wakati; “Mara tu” ni ya asili katika Kiswahili na inafaa kwa mfuatano wa papo hapo katika muktadha.
- source_word: קָרַב אֶל הַמַּחֲנֶה
  choice: alipokaribia kambi
  rationale: Kitenzi קָרַב humaanisha kukaribia au kuja karibu; “alipokaribia kambi” huhifadhi maana ya mahali kwa Kiswahili cha kawaida.
- source_word: וַיַּרְא אֶת הָעֵגֶל
  choice: na kuona ndama
  rationale: רָאָה ni kitenzi cha kawaida cha kuona, na “ndama” humrejelea sanamu iliyotajwa tayari katika muktadha.
- source_word: וּמְחֹלֹת
  choice: na dansi
  rationale: Nomino ya Kiebrania iko katika wingi na hurejelea dansi au kucheza kwa sherehe. “Dansi” ni nomino ya kawaida inayoweza kueleza matendo hayo bila kuongeza tafsiri pana kama “sherehe za ovyo.”
- source_word: וַיִּחַר אַף מֹשֶׁה
  choice: hasira ya Musa ikawaka
  rationale: Huhifadhi taswira hai ya nahau ya Kiebrania ya hasira kuwaka badala ya kuififisha kuwa “Musa akakasirika.”
- source_word: וַיַּשְׁלֵךְ מִיָּדוֹ
  choice: naye akazitupa zile mbao kutoka mikononi mwake
  rationale: שָׁלַךְ humaanisha kutupa. Ingawa Kiebrania kina umoja “mkono wake,” wingi “mikononi” unasikika kwa asili kwa kuwa Musa alikuwa amebeba mbao mbili.
- source_word: הַלֻּחֹת
  choice: zile mbao
  rationale: Katika muktadha wa Kutoka, לוּחֹת ni mbao za agano. “Zile mbao” huonyesha kwamba tayari zimetajwa bila kuongeza neno “mawe,” ambalo halipo katika aya hii.
- source_word: וַיְשַׁבֵּר אֹתָם
  choice: na kuzivunja vipande-vipande
  rationale: שָׁבַר humaanisha kuvunja au kuponda. Usemi huu unaonyesha matokeo makali ya kitendo kwa Kiswahili wazi na chenye hadhi.
- source_word: תַּחַת הָהָר
  choice: chini ya mlima
  rationale: תַּחַת kimsingi humaanisha chini au upande wa chini. “Chini ya mlima” ni ya asili na huepuka kulazimisha zaidi maana maalumu ya “chini kabisa pa mlima.”
