translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unafuata mtiririko wa simulizi la Kiebrania huku ukitumia sentensi ya asili katika Kiswahili. Nahau ya hasira kuwaka imehifadhiwa, na tanbihi inadumisha wingi wa neno la Kiebrania kuhusu dansi.
