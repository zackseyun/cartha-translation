base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/015.yaml
  text: Then Moses turned and went down from the mountain[a], with the two tablets of the testimony in his hand, tablets written on both their sides; on this side and on that they were written.
translation:
  language: sw
  text: Kisha Musa akageuka, akashuka kutoka mlimani, akiwa na vibao viwili vya ushuhuda mkononi mwake. Vibao hivyo viliandikwa pande zake zote mbili; upande huu na upande ule viliandikwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upande mmoja na upande mwingine.”
    reason: Njia nyingine halali ya kutafsiri kirai cha Kiebrania מִזֶּה וּמִזֶּה.
lexical_decisions:
- source_word: וַיִּפֶן
  choice: akageuka
  rationale: Kitenzi פנה kinaonyesha Musa kubadili mwelekeo kabla ya kushuka; “akageuka” ni cha kawaida na hakiongezi wazo lisilosemwa wazi la kugeuka kabisa.
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: ירד humaanisha kwenda chini au kushuka. “Akashuka” ni simulizi la kawaida la Kiswahili na linafaa kwa mwendo kutoka mlimani.
- source_word: הָהָר
  choice: mlimani
  rationale: הַר hapa ni mlima unaojulikana katika muktadha wa Sinai; umbo “kutoka mlimani” ni la asili katika Kiswahili.
- source_word: שְׁנֵי לֻחֹת
  choice: vibao viwili
  rationale: לֻחֹת ni vibao vya kuandikia. Neno “mawe” halijaongezwa kwa kuwa halitajwi wazi katika mstari huu.
- source_word: הָעֵדֻת
  choice: Ushuhuda
  rationale: “Ushuhuda” huhifadhi maana ya msingi na uzito wa istilahi hii ya agano bila kuibadili moja kwa moja kuwa “agano” au “hati ya agano.” Herufi kubwa inaonyesha kwamba hapa ni jina maalumu la yale yaliyokuwa kwenye vibao.
- source_word: בְּיָדוֹ
  choice: mkononi mwake
  rationale: Kiebrania kimetumia umoja, “katika mkono wake”; Kiswahili “mkononi mwake” huhifadhi umoja huo na ni usemi wa kawaida kuhusu kitu anachobeba mtu.
- source_word: לֻחֹת כְּתֻבִים
  choice: Vibao hivyo vilikuwa vimeandikwa
  rationale: כתב hapa ni kauli ya kutendwa yenye maana ya “vilivyoandikwa.” “Vimeandikwa” ni sahihi na hakiongezi dhana maalumu zaidi ya kuchongwa.
- source_word: מִשְּׁנֵי עֶבְרֵיהֶם
  choice: pande zake zote mbili
  rationale: Kirai hiki kinaonyesha kwamba maandishi yalikuwa kwenye nyuso au pande mbili za vibao; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: מִזֶּה וּמִזֶּה
  choice: upande huu na upande ule
  rationale: Tafsiri hii huhifadhi uwiano na msisitizo wa kirai cha Kiebrania kinachotaja kila upande kwa zamu.
- source_word: הֵם כְּתֻבִים
  choice: vilikuwa vimeandikwa
  rationale: Kishazi hiki kinarudia na kusisitiza kwamba vibao viliandikwa pande zote mbili; marudio yamehifadhiwa badala ya kulainishwa.
theological_decisions:
- issue: Tafsiri ya עֵדוּת katika kirai “vibao vya Ushuhuda”
  choice: Ushuhuda
  alternative: agano; ushahidi
  rationale: “Ushuhuda” huhifadhi istilahi ya Kiebrania yenye maana ya kiagano bila kuifupisha kuwa “agano” pekee wala kuipa tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa, fasaha na chenye hadhi. Sentensi mbili zimetumiwa ili kuhifadhi uwazi bila kuondoa marudio ya Kiebrania. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja, si baada ya “mlimani.”
