base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/028.yaml
  text: And the sons of Levi did according to the word of Moses[a], and about three thousand men from among the people fell that day.
translation:
  language: sw
  text: Wana wa Lawi wakafanya kama Mose alivyowaagiza, na siku hiyo wanaume wapatao elfu tatu miongoni mwa watu wakaanguka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “wakaanguka,” nahau ya kawaida inayomaanisha kufa au kuuawa; tafsiri nyingine ni “wakauawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: wakafanya
  rationale: Kitenzi עשה kina maana pana ya kufanya au kutekeleza; “wakafanya” kinaendeleza usimulizi kwa lugha ya kawaida na kuungana vizuri na agizo la Mose.
- source_word: בְנֵי לֵוִי
  choice: Wana wa Lawi
  rationale: Hili linafuata moja kwa moja usemi wa kifamilia wa Kiebrania, “wana wa Lawi,” huku likibaki wazi na lenye heshima katika Kiswahili.
- source_word: כִּדְבַר מֹשֶׁה
  choice: kama Mose alivyowaagiza
  rationale: Ingawa neno kwa neno ni “kulingana na neno la Mose,” katika muktadha דָּבָר ni agizo lililotolewa; tafsiri hii ni ya asili na huonyesha maana bila kuongeza fundisho.
- source_word: וַיִּפֹּל
  choice: wakaanguka
  rationale: Huhifadhi nahau ya Kiebrania ya “kuanguka” inayomaanisha kufa au kuuawa, badala ya kutaja wazi zaidi namna ya kifo kuliko kitenzi chenyewe.
- source_word: מִן הָעָם
  choice: miongoni mwa watu
  rationale: 'Huonyesha maana ya sehemu ya kundi: walioanguka walitoka katika jumuiya hiyo, si kwamba watu wote walianguka.'
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni usemi wa kawaida wa Kiswahili unaowakilisha kikamilifu kirai cha wakati cha Kiebrania.
- source_word: כִּשְׁלֹשֶׁת אַלְפֵי אִישׁ
  choice: wanaume wapatao elfu tatu
  rationale: “Wapatao” huonyesha ukadiriaji unaoletwa na kiambishi כ, na “wanaume” huakisi אִישׁ kwa usahihi wa kijinsia.
theological_decisions:
- issue: Namna ya kutafsiri taarifa ya waliokufa katika muktadha wa hukumu
  choice: wanaume wapatao elfu tatu miongoni mwa watu wakaanguka
  alternative: wanaume wapatao elfu tatu miongoni mwa watu wakauawa
  rationale: Kiebrania kimetumia nahau “wakaanguka,” wala si kitenzi cha wazi cha “kuua.” Kuihifadhi hudumisha uzito na mvutano wa simulizi bila kuongeza ubainisho ambao hauko katika kitenzi chenyewe; tanbihi inaeleza maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Maandiko. “Wana wa Lawi” huhifadhi usemi wa kifamilia wa chanzo; “kama Mose alivyowaagiza” hufanya maana ya kimuktadha ya דָּבָר iwe wazi. Alama ya tanbihi imewekwa baada ya “wakaanguka,” neno linaloelezwa na tanbihi.
