  text: And Aaron said[a], “Do not let my lord’s anger burn hot. You know the people, that they are set on evil.”
translation:
  language: sw
  text: Aaroni akasema, “Hasira ya bwana wangu isiwake. Wewe unawajua watu, kwamba wamejikita katika uovu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wana mwelekeo wa kutenda uovu” au “wameelekea katika uovu.” Usemi wa Kiebrania ni wa kimtindo na unawaeleza watu kuwa na tabia inayotawaliwa na uovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אַהֲרֹן
  choice: Aaroni akasema
  rationale: Muundo wa kawaida wa masimulizi ya Kiebrania unaoanzisha jibu la Aaroni; Kiswahili hakihitaji kiunganishi cha ziada hapa.
- source_word: אַל יִחַר אַף
  choice: Hasira ... isiwake
  rationale: Inahifadhi sitiari ya Kiebrania ya hasira kuwaka huku ikibaki ya kawaida na yenye kueleweka katika Kiswahili.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Ni usemi wa heshima kwa Musa, si jina la Mungu; herufi ndogo inaepusha kuudhania kuwa mtajo wa Mungu.
- source_word: אַתָּה יָדַעְתָּ אֶת הָעָם
  choice: Wewe unawajua watu hawa
  rationale: Kiwakilishi huru אַתָּה kinabeba msisitizo, unaowasilishwa kwa 'Wewe'; 'watu hawa' ni usemi wa asili kwa kundi lililo mbele ya wahusika.
- source_word: כִּי בְרָע הוּא
  choice: kwamba wameelekea kwenye uovu
  rationale: Usemi wa Kiebrania ni wa kimtindo na humwelezea huyo 'watu' kama kundi lenye mwelekeo wa uovu; wingi wa Kiswahili unalingana na maana ya jina la mkusanyiko.
theological_decisions:
- issue: Maana ya אֲדֹנִי katika kumwambia mwanadamu
  choice: bwana wangu
  alternative: Bwana wangu; mkuu wangu
  rationale: Msemaji anamwambia Musa kwa heshima, si Mungu. Herufi ndogo huhifadhi tofauti hiyo bila kupunguza heshima.
- issue: Nguvu ya בְרָע הוּא
  choice: wameelekea kwenye uovu
  alternative: wamezama katika uovu; wana mwelekeo wa kutenda uovu
  rationale: Tafsiri hii huonyesha tabia au mwelekeo unaowatambulisha bila kuamua kwa nguvu kupita maandishi kama ni ukaidi wa kudumu au udhaifu wa mara kwa mara.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya hasira kuwaka imehifadhiwa; usemi wa heshima kwa Musa umetofautishwa na jina la Mungu.
