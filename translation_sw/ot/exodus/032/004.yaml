base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/004.yaml
  text: And he took it from their hands and fashioned it with a graving tool[a], and he made it into a cast calf. Then they said, “These are your gods, Israel[d][c][b], who brought you up from the land of Egypt.”
translation:
  language: sw
  text: Akaichukua kutoka mikononi mwao, akaifanyiza kwa chombo cha kuchongea[a], na akaifanya kuwa ndama wa kusubu[d]. Kisha wakasema[b], “Hawa ndio miungu yako, Ee Israeli[c], waliokupandisha kutoka nchi ya Misri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kifaa cha kuchora,” “kwa kalamu (stylus),” au “kwa patasi”; maana mahususi ya neno la Kiebrania inajadiliwa.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya mapokeo ya maandishi yanasema “akasema” badala ya “wakasema.”
    reason: textual_variant
  - marker: c
    text: 'Kiebrania: “Hawa ndio miungu yako”; kijadi hutafsiriwa pia, “Huyu ndiye mungu wako,” huenda kwa sababu sanamu ya ndama ni moja.'
    reason: alternative_reading
  - marker: d
    text: Au, “akaifanya kuwa ndama wa kusubu, huku akiifanyiza kwa chombo cha kuchongea.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּקַּח מִיָּדָם
  choice: Akaichukua kutoka mikononi mwao
  rationale: Kitenzi לקח kina maana ya kuchukua au kupokea. Kauli hii inafuata tendo la moja kwa moja la simulizi, huku kiwakilishi ‘-i-’ kikirejelea dhahabu iliyotajwa katika mstari uliotangulia.
- source_word: וַיָּצַר אֹתוֹ
  choice: akaifanyiza
  rationale: יצר humaanisha kuumba, kufanyiza, au kuipa kitu umbo. ‘Kuifanyiza’ linaonyesha kazi ya ufundi bila kuamua kwa hakika mbinu iliyotumiwa.
- source_word: בַּחֶרֶט
  choice: kwa chombo cha kuchongea
  rationale: Maana mahususi ya חֶרֶט inajadiliwa; inaweza kuwa chombo cha kuchora, kuchonga, au kufanyia umbo. Tafsiri pana imetumiwa katika maandiko, na uwezekano mwingine umewekwa katika tanbihi.
- source_word: וַיַּעֲשֵׂהוּ
  choice: akaifanya kuwa
  rationale: עשה ni kitenzi kipana cha kufanya au kutengeneza. ‘Akaifanya kuwa’ linaunganisha tendo na umbo linalotajwa mara moja baada yake bila kuondoa uwakala wa Haruni.
- source_word: עֵגֶל מַסֵּכָה
  choice: ndama wa kusubu
  rationale: עֵגֶל ni ndama, na מַסֵּכָה ni kitu kilichotengenezwa kwa kuyeyusha na kumimina metali, mara nyingi sanamu. ‘Ndama wa kusubu’ ni usemi mfupi unaohifadhi namna ya utengenezaji.
- source_word: וַיֹּאמְרוּ
  choice: wakasema
  rationale: Maandishi ya Kimasoreti yana kitenzi cha wingi, kinachowaelekezea watu. Tofauti ya umoja katika baadhi ya mapokeo imehifadhiwa katika tanbihi.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: Hawa ndio miungu yako
  rationale: Kiwakilishi אֵלֶּה na umbo אֱלֹהֶיךָ ni vya wingi. Wingi umehifadhiwa licha ya kutajwa kwa sanamu moja, ili kutatua kimya kimya mvutano wa maandishi.
- source_word: יִשְׂרָאֵל
  choice: Ee Israeli
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili, na ‘Ee’ linaonyesha wazi kwamba ni mwito wa moja kwa moja.
- source_word: אֲשֶׁר הֶעֱלוּךָ
  choice: waliokupandisha
  rationale: Hifili ya עלה ni ‘kusababisha kupanda.’ ‘Waliokupandisha’ inahifadhi taswira ya Kiebrania badala ya kuibadili kuwa ‘waliokutoa.’
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: kutoka nchi ya Misri
  rationale: Kauli hii inafuata maneno kamili ya Kiebrania na kuhifadhi mtiririko wa tamko hilo.
theological_decisions:
- issue: Wingi au umoja katika tamko kuhusu sanamu
  choice: Hawa ndio miungu yako, Ee Israeli
  alternative: Huyu ndiye mungu wako, Ee Israeli
  rationale: Maandishi ya Kimasoreti yana maumbo ya wingi. Tafsiri inahifadhi wingi huo na mvutano wake na sanamu moja ya ndama, badala ya kuupatanisha kimya kimya na mapokeo ya umoja.
- issue: Uwakala katika kutengeneza sanamu
  choice: Haruni ndiye mhusika wa moja kwa moja katika kufanyiza na kufanya sanamu
  alternative: Kutumia maneno yanayodokeza kwamba Haruni alisimamia tu au alipokea dhahabu pekee
  rationale: Vitenzi vya Kiebrania vinamhusisha moja kwa moja mtendaji wa umoja. Tafsiri haipunguzi wajibu wake wala kuingiza utetezi kutoka mistari inayofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. ‘Ndama wa kusubu’ huhifadhi maana ya sanamu iliyotengenezwa kwa metali iliyoyeyushwa; tanbihi zinaweka wazi utata wa chombo, tofauti ya kimaandishi, na mvutano wa wingi na umoja.
