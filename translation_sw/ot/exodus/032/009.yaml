  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/009.yaml
  text: And Yahweh said to Moses[a], “I have seen this people, and behold, it is a stiff-necked people.”
translation:
  language: sw
  text: Yahwe akamwambia Musa, “Nimewaona watu hawa, na tazama, ni watu wenye shingo ngumu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, wakaidi. Nahau ya Kiebrania ni “wenye shingo ngumu,” sitiari ya watu wanaokataa kuongozwa au kutii.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la agano lililoandikwa katika Kiebrania badala ya kulibadili kuwa cheo; tahajia hii ni ya kawaida katika Kiswahili.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa masimulizi wa Kiebrania umeonyeshwa kwa kiambishi cha mfululizo “aka-,” ambacho ni cha kawaida na asilia katika simulizi la Kiswahili.
- source_word: רָאִיתִי אֶת הָעָם הַזֶּה
  choice: Nimewaona watu hawa
  rationale: Kauli timilifu inaonyesha kwamba Yahwe amekwisha kuwaona na tathmini yake ina uzito wa sasa; upatanisho wa wingi ni wa kawaida kwa nomino “watu” katika Kiswahili.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Linadumisha neno la kuvuta fikira na uzito wa tangazo bila kulifanya kuwa hitimisho la kawaida tu.
- source_word: קְשֵׁה עֹרֶף
  choice: wenye shingo ngumu
  rationale: Linahifadhi sitiari hai ya Kiebrania ya shingo isiyokubali kugeuzwa, huku tanbihi ikifafanua maana yake ya ukaidi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina maalumu la Mungu, si cheo; kulitaja kama “Yahwe” kunahifadhi tofauti hiyo bila kuingiza tafsiri ya kimadhehebu.
- issue: Kuhifadhi sitiari ya קְשֵׁה עֹרֶף
  choice: wenye shingo ngumu
  alternative: wakaidi
  rationale: Sitiari ya asili inaonyesha upinzani wa makusudi na inapaswa kubaki katika maandiko; maana yake ya moja kwa moja imeelezwa katika tanbihi badala ya kuondoa taswira hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa wasomaji wa sasa. Muundo “akamwambia” ni wa kawaida katika masimulizi, na “na tazama” huhifadhi msisitizo wa usemi wa Kiebrania.
