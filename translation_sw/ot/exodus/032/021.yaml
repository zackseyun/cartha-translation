translation:
  language: sw
  text: Musa akamwambia Haruni, “Watu hawa walikufanyia nini hata ukawaletea dhambi kubwa?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa masimulizi wa wayyiqtol unaendelezwa kwa kiambishi cha mfululizo ‘aka-’; ‘mwambia’ humtaja mpokeaji wa maneno kwa Kiswahili cha kawaida.
- source_word: מֶה עָשָׂה לְךָ הָעָם הַזֶּה
  choice: Watu hawa walikufanyia nini
  rationale: Huhifadhi swali ‘nini’, maana ya עשה + לְ kama ‘kumfanyia’, na nguvu ya demonstrativi הַזֶּה (‘hawa’). Kiswahili hutumia upatanisho wa wingi kwa ‘watu’.
- source_word: כִּי
  choice: hata
  rationale: 'Katika swali hili ‘hata’ huunganisha kwa kawaida kitendo kinachodaiwa na matokeo yake: walimfanyia nini kiasi cha yeye kuwaletea dhambi kubwa.'
- source_word: הֵבֵאתָ
  choice: ukawaletea
  rationale: Hiphil ya בוא ina maana ya ‘kuleta’; muundo wa ‘uka-’ unaonyesha tendo lililofuata au kutokea kwa msingi wa swali bila kupunguza wajibu wa Haruni.
- source_word: עָלָיו
  choice: -wa- katika ukawaletea
  rationale: Kiwakilishi cha Kiebrania ni cha umoja kwa kurejelea הָעָם kama nomino ya mkusanyiko, lakini Kiswahili cha kawaida hurejelea ‘watu hawa’ kwa wingi.
- source_word: חֲטָאָה גְדֹלָה
  choice: dhambi kubwa hivi
  rationale: ‘Dhambi kubwa’ ni maana ya moja kwa moja; ‘hivi’ huonyesha uzito wa karipio kwa njia ya kawaida bila kubadili dhambi kuwa shida au hatia tu.
theological_decisions:
- issue: Kiwango cha wajibu wa Haruni
  choice: ukawaletea dhambi kubwa hivi
  alternative: ukawaongoza kutenda dhambi kubwa
  rationale: Tafsiri inamhusisha Haruni moja kwa moja na kuwaletea watu dhambi, kama Hiphil ya בוא inavyosema, bila kuongeza wazo mahsusi la kuwaongoza ambalo halijaelezwa wazi.
- issue: Dhambi kama tendo au hatia
  choice: dhambi kubwa
  alternative: hatia kubwa
  rationale: חֲטָאָה kwa kawaida humaanisha dhambi au kosa. ‘Dhambi’ huhifadhi upeo wa neno na mvutano wa kama kilicholetwa juu yao ni tendo la dhambi, hali ya dhambi, au matokeo yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Watu hawa’ ni ya kawaida kuliko ‘watu hii’ na bado huhifadhi sauti ya Musa ya kuwaweka mbali. Sentensi imetungwa kama karipio la moja kwa moja na lenye kueleweka kwa msomaji wa kawaida.
