  text: וְ/עַתָּ֞ה לֵ֣ךְ נְחֵ֣ה אֶת הָ/עָ֗ם אֶ֤ל אֲשֶׁר דִּבַּ֨רְתִּי֙ לָ֔/ךְ הִנֵּ֥ה מַלְאָכִ֖/י יֵלֵ֣ךְ לְ/פָנֶ֑י/ךָ וּ/בְ/י֣וֹם פָּקְדִ֔/י וּ/פָקַדְתִּ֥י עֲלֵי/הֶ֖ם חַטָּאתָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/034.yaml
  text: But now go, lead the people to where I have spoken to you. Look, my angel will go before you; but on the day when I call them to account, I will call them to account for their sin.
translation:
  language: sw
  text: Lakini sasa nenda, uwaongoze watu mpaka mahali nilipokuambia. Tazama, malaika wangu atatangulia mbele yako. Lakini siku nitakapowadai hesabu, nitawadai hesabu kwa ajili ya dhambi yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְחֵה
  choice: uwaongoze
  rationale: Kitenzi hiki kinamaanisha kuongoza au kuelekeza; ‘uwaongoze’ ni Kiswahili cha kawaida na kinaendeleza agizo kwa Musa.
- source_word: מַלְאָכִי
  choice: malaika wangu
  rationale: Huhifadhi maana ya msingi ya mjumbe wa Mungu bila kuamua zaidi utambulisho wake.
- source_word: לְפָנֶיךָ
  choice: atatangulia mbele yako
  rationale: Hutoa kwa kawaida dhana ya kwenda mbele ya Musa kama mwongozi.
- source_word: פָּקְדִי ... וּפָקַדְתִּי
  choice: nitakapowadai hesabu ... nitawadai hesabu
  rationale: Mzizi פקד una wigo mpana unaoweza kumaanisha kuja kukagua, kuwajibisha, au kuadhibu. Kauli hii huhifadhi urudiaji wa Kiebrania na wazo la kuwawajibisha bila kuifanya ‘kuadhibu’ kuwa maana pekee.
theological_decisions:
- issue: Utambulisho wa ‘malaika wangu’
  choice: malaika wangu
  alternative: mjumbe wangu
  rationale: ‘Malaika’ ni tafsiri ya kawaida katika muktadha huu, lakini haiongezi madai kuhusu asili au utambulisho wake.
- issue: Maana ya hukumu katika פקד
  choice: kuwadai hesabu kwa ajili ya dhambi yao
  alternative: kuwaadhibu kwa dhambi yao
  rationale: Chaguo hili linaonyesha uwajibikaji na hukumu inayokuja, huku likihifadhi upana wa kitenzi cha Kiebrania badala ya kulifunga kwa adhabu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazama’ limetumiwa kama ishara ya kuvuta fikira, na urudiaji wa kishazi cha kuwadai hesabu umehifadhiwa kwa sababu upo wazi katika Kiebrania.
