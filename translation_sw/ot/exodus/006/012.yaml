source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה לִ/פְנֵ֥י יְהוָ֖ה לֵ/אמֹ֑ר הֵ֤ן בְּנֵֽי יִשְׂרָאֵל֙ לֹֽא שָׁמְע֣וּ אֵלַ֔/י וְ/אֵיךְ֙ יִשְׁמָעֵ֣/נִי פַרְעֹ֔ה וַ/אֲנִ֖י עֲרַ֥ל שְׂפָתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/012.yaml
  text: But Moses spoke before Yahweh[a], saying, “Behold, the sons of Israel have not listened to me; so how will Pharaoh listen to me[b], since I am uncircumcised in lips?”
translation:
  language: sw
  text: Lakini Musa akasema mbele ya Yahweh, “Tazama, wana wa Israeli hawakunisikiliza; basi Farao atanisikilizaje, ilhali mimi ni mwenye midomo isiyotahiriwa[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “midomo isiyotahiriwa,” nahau inayodokeza usemi uliozuiwa au usiofaa; linganisha Kutoka 4:10.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lakini Musa akasema
  rationale: Waw ya usimulizi inaendeleza habari, huku muktadha ukiweka pingamizi la Musa dhidi ya agizo lililotangulia; ‘Lakini’ huonyesha utofauti huo kwa Kiswahili cha kawaida.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Huhifadhi nahau ya Kiebrania yenye maana ya kuwa mbele au katika uwepo wa Yahweh, bila kuirahisisha kuwa ‘kwa Yahweh’ pekee.
- source_word: הֵן
  choice: Tazama
  rationale: Ni chembe ya kuvuta fikira; ‘Tazama’ ina uzito wa heshima na inaeleweka katika Kiswahili cha sasa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi taswira ya kifamilia ya Kiebrania kuliko tafsiri laini zaidi ‘Waisraeli,’ huku ikiwa ya kawaida katika Kiswahili cha Biblia.
- source_word: לֹא שָׁמְעוּ אֵלַי
  choice: hawakunisikiliza
  rationale: שמע pamoja na אֶל hapa ni kusikiliza au kutii ujumbe; ‘hawakunisikiliza’ huhifadhi maana ya kusikia na kuitikia bila kuifanya moja kwa moja kuwa ‘hawakunitii.’
- source_word: וְאֵיךְ יִשְׁמָעֵנִי פַרְעֹה
  choice: basi Farao atanisikilizaje
  rationale: ‘Basi’ huonyesha hitimisho la hoja ya Musa, na kitenzi kilekile ‘kusikiliza’ huhifadhi urudiaji wa שמע katika aya.
- source_word: וַאֲנִי עֲרַל שְׂפָתָיִם
  choice: ilhali mimi nina midomo isiyotahiriwa
  rationale: ‘Ilhali’ huwasilisha hali anayoitoa Musa kuwa msingi wa pingamizi lake. Tafsiri ya karibu huhifadhi sitiari ya makusudi ya Kiebrania badala ya kuitatua kuwa utambuzi maalumu wa tatizo la usemi.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la agano, si cheo. ‘Yahweh’ hulihifadhi kwa unukuzi badala ya kulibadili kuwa cheo.
- issue: Nahau עֲרַל שְׂפָתָיִם
  choice: nina midomo isiyotahiriwa
  alternative: mimi si msemaji mzuri; nina tatizo la kusema
  rationale: 'Huhifadhi sitiari na mvutano wa maandishi: Musa anajieleza kuwa mwenye kizuizi au asiyefaa katika usemi, lakini aya haitaji kwa usahihi hali hiyo ilikuwa nini.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘mbele za Yahweh’ na sitiari ‘midomo isiyotahiriwa’ huhifadhi uwazi wa chanzo; tanbihi hufafanua nahau bila kuifuta katika matini kuu.
