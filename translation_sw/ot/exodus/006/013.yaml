base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/013.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt[b], to bring the sons of Israel out from the land of Egypt.
translation:
  language: sw
  text: Kisha Yahwe akasema na Musa na Aroni, akawaagiza[a] kuhusu wana wa Israeli na kuhusu Farao, mfalme wa Misri, ili wawatoe wana wa Israeli kutoka nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawaagiza waende kwa wana wa Israeli na kwa Farao, mfalme wa Misri.” Kihusishi cha Kiebrania kinaweza kuonyesha waliolengwa na agizo; lakini katika muktadha huu huenda kinamaanisha kwamba agizo walilopewa Musa na Aroni liliwahusu Israeli na Farao.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akasema
  rationale: Muundo wa simulizi unaendeleza tukio; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: na Musa na Aroni
  rationale: Baada ya kitenzi cha kusema, Kiswahili hutumia kwa kawaida “sema na” kumtaja anayesemeshwa.
- source_word: וַיְצַוֵּם
  choice: akawaagiza
  rationale: Kitenzi hiki huhifadhi nguvu ya amri huku kikisikika kwa ufasaha katika muktadha wa wajibu waliokabidhiwa; kiambishi “-wa-” kinawarejelea Musa na Aroni.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: kuhusu wana wa Israeli
  rationale: אֶל baada ya צוה inaweza kuonyesha wale ambao agizo linawahusu, si lazima wapokeaji wa moja kwa moja. “Kuhusu” hudumisha maana hiyo bila kuondoa uwezekano mwingine.
- source_word: וְאֶל פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: na kuhusu Farao, mfalme wa Misri
  rationale: Ni sambamba na kishazi kilichotangulia na humwonyesha Farao kuwa mmoja wa wanaohusika katika agizo.
- source_word: לְהוֹצִיא
  choice: wawatoe
  rationale: Hifili ya יצא ina maana ya kusababisha watoke; “wawatoe” ni ya kawaida na huhifadhi maana hiyo ya kisababishi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi tamko la kifamilia na kitaifa la Kiebrania; katika Kiswahili “wana” linaweza kuwakilisha wazao au watu wa Israeli kwa ujumla.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Pamoja na kitenzi “wawatoe,” “katika nchi ya Misri” ni muundo wa asili wa Kiswahili na huhifadhi neno אֶרֶץ, “nchi.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: “Yahwe” huhifadhi jina binafsi lililo katika maandishi ya Kiebrania bila kulibadilisha kuwa cheo.
- issue: Maana ya אֶל baada ya וַיְצַוֵּם
  choice: Agizo kuhusu Israeli na Farao
  alternative: Agizo la kwenda kwa Israeli na Farao
  rationale: Sintaksia inaweza kueleweka kwa njia zote mbili. Muktadha unaunga mkono “kuhusu,” lakini tanbihi huhifadhi usomaji mbadala badala ya kuufuta.
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: “Wana wa Israeli” huhifadhi taswira ya asili ya ukoo na taifa huku ikirejelea jumuiya nzima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa wa kawaida kwa Kiswahili bila kuficha utata wa kihusishi cha Kiebrania.
