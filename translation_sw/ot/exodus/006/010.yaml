lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akasema
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi. Kiswahili cha kawaida hutumia “Kisha ... akasema” kwa utangulizi huu wa usemi; ingawa kitenzi דבר kina maana ya kunena au kusema, “akasema” ni cha asili zaidi hapa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA,” hivyo kuhifadhi jina la agano lililo katika maandishi ya Kiebrania.
- source_word: אֶל
  choice: na
  rationale: Katika muundo wa kawaida wa Kiswahili, “akasema na Musa” huonyesha mtu aliyeelekezewa maneno kwa ufasaha; tafsiri ya neno kwa neno “kwa Musa” si ya asili katika sentensi hii.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Infinitivu hii ya Kiebrania hutanguliza maneno yanayofuata. Katika Kiswahili, nukta mbili hutekeleza kazi hiyo kwa njia ya kawaida na huepuka uradidi usio wa asili wa “akisema.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo; tanbihi inataja tofauti halali ya utohozi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Alama ya nukta mbili imetumiwa kutanguliza usemi unaofuata katika mstari unaofuata.
