base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/008.yaml
  text: And I will bring you into the land that I swore to give to Abraham[a], to Isaac, and to Jacob, and I will give it to you as a possession. I am Yahweh.
translation:
  language: sw
  text: Nami nitawaingiza katika nchi ambayo niliinua mkono wangu kuapa kuipa Abrahamu, Isaka na Yakobo; nami nitawapa nchi hiyo iwe milki yenu. Mimi ni Yahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Nami nitawaingiza
  rationale: Hifili ya בוא ina maana ya kuleta au kuingiza; katika muktadha wa kuingia katika nchi, “nitawaingiza” ni ya asili na inadumisha maana ya kisababishi.
- source_word: הָאָרֶץ
  choice: katika nchi
  rationale: אֶרֶץ hapa ni nchi maalumu iliyoahidiwa, si dunia kwa ujumla.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: ambayo niliinua mkono wangu kuapa
  rationale: Tafsiri hii inadumisha picha halisi ya kuinua mkono na pia inaeleza kwa Kiswahili cha kawaida kwamba tendo hilo lilikuwa kiapo.
- source_word: לָתֵת אֹתָהּ
  choice: kwamba nitawapa
  rationale: Muundo wa Kiebrania unaonyesha kusudi la kiapo, yaani kuwapa nchi; kiwakilishi cha wingi kinawarejelea Waisraeli wanaosemeshwa.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abrahamu, Isaka na Yakobo
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili; vihusishi vinavyorudiwa katika Kiebrania havihitaji kurudiwa katika Kiswahili.
- source_word: וְנָתַתִּי אֹתָהּ לָכֶם
  choice: nami nitawapa
  rationale: Ahadi ya moja kwa moja inadumishwa kwa wakati ujao; kitu kinachotolewa, yaani nchi, kinaeleweka kutokana na muktadha.
- source_word: מוֹרָשָׁה
  choice: iwe milki yenu
  rationale: מוֹרָשָׁה ni milki inayopokelewa na kushikiliwa kama haki ya kudumu; “milki yenu” ni wazi na haidokezi tu urithi baada ya kifo cha mtu.
- source_word: אֲנִי יְהוָה
  choice: Mimi ni Yahwe
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahwe,” na kauli fupi inadumisha uzito wa kujitambulisha kwa Mungu.
theological_decisions:
- issue: Nahau ya kiapo נָשָׂאתִי אֶת יָדִי
  choice: niliinua mkono wangu kuapa
  alternative: niliapa
  rationale: Chaguo kuu linahifadhi taswira ya Kiebrania huku likifanya maana ya kiapo ieleweke; tanbihi inaonyesha tafsiri fupi ya kimaanawi.
- issue: Jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מוֹרָשָׁה
  choice: milki yenu
  alternative: urithi wenu
  rationale: Neno linaweza kuhusisha urithi, lakini hapa mkazo ni nchi wanayopewa ili iwe milki yao ya kudumu, si mali wanayorithi kutoka kwa babu wa kibinadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya kiapo imehifadhiwa bila kuacha maana yake kuwa fiche.
