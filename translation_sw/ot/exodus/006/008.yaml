- from: Nami nitawaingiza katika nchi ambayo niliinua mkono wangu kuapa kwamba nitawapa Abrahamu, Isaka na Yakobo[a]; nami nitawapa iwe milki yenu. Mimi ni Yahwe.
  to: Nami nitawaingiza katika nchi ambayo niliinua mkono wangu kuapa kuipa Abrahamu, Isaka na Yakobo; nami nitawapa nchi hiyo iwe milki yenu. Mimi ni Yahwe.
  rationale: The revision corrects the referent and singular agreement of the land in both the main text and footnote. It retains the Hebrew oath imagery in the main text, while the footnote supplies the idiomatic alternative “niliapa.” Repeating “nchi hiyo” in the final clause is a minimal clarification that preserves the source meaning and makes the Swahili construction unambiguous.
