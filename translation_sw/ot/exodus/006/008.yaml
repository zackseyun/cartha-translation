review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the future bringing into the promised land, the oath gesture, the grant of the land as a permanent possession, and the divine self-identification. However, “kwamba nitawapa Abrahamu, Isaka na Yakobo” makes the patriarchs appear to be the direct recipients of an unspecified plural object. The Hebrew says that God raised his hand to give the land to them; this needs explicit singular agreement with nchi.
  naturalness: The revised wording is clear and idiomatic Standard East African Swahili. Explicitly repeating “nchi hiyo” in the second promise prevents ambiguity and makes “iwe milki yenu” flow naturally.
  terminology: “Nchi,” “milki yenu,” and “Yahwe” are suitable in this register. “Yahwe” is an established Swahili form of the divine name and preserves the use of the Tetragrammaton rather than replacing it with a title.
  issues:
  - severity: high
    issue: The infinitive clause after the oath idiom has an incorrect/ambiguous object agreement.
    rationale: '“nitawapa Abrahamu, Isaka na Yakobo” is naturally read as ‘I will give [something] to Abraham, Isaac, and Jacob,’ with the land left unstated and the plural object marker potentially confusing. The source explicitly has a singular feminine pronoun referring to the land: ‘to give it to Abraham, to Isaac, and to Jacob.’ “kuipa” correctly agrees with nchi and preserves this relation.'
  - severity: medium
    issue: The footnote’s literal quotation repeats the same agreement problem.
    rationale: Its “ili kuwapa” means ‘in order to give them’ and does not represent the source’s explicit ‘give it [the land] to them.’ It should read “ili kuipa [nchi]” or otherwise explicitly identify the land as the object.
  revised_text: Nami nitawaingiza katika nchi ambayo niliinua mkono wangu kuapa kuipa Abrahamu, Isaka na Yakobo; nami nitawapa nchi hiyo iwe milki yenu. Mimi ni Yahwe.
  revised_footnotes:
  - marker: a
    text: Au, “ambayo niliapa kuipa Abrahamu, Isaka na Yakobo.” Kiebrania kinasema kihalisi, “ambayo niliinua mkono wangu ili kuipa,” nahau ya kuapa.
    reason: lexical_alternative
  revision_rationale: The revision corrects the referent and singular agreement of the land in both the main text and footnote. It retains the Hebrew oath imagery in the main text, while the footnote supplies the idiomatic alternative “niliapa.” Repeating “nchi hiyo” in the final clause is a minimal clarification that preserves the source meaning and makes the Swahili construction unambiguous.
