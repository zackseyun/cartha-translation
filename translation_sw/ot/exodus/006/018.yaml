  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel. And the years of Kohath’s life were one hundred thirty-three years.'
translation:
  language: sw
  text: 'Wana wa Kohathi: Amramu, Ishari, Hebroni na Uzieli. Miaka ya maisha ya Kohathi ilikuwa mia moja na thelathini na mitatu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Wana wa
  rationale: בְּנֵי ni wingi wa hali ya kuambatanisha wa neno ‘wana.’ Hapa orodha inawataja wana wa moja kwa moja wa Kohathi, kwa hiyo ‘Wana wa’ ni sahihi kuliko ‘Wazao wa.’ Kiunganishi וּ hakijatafsiriwa kwa ‘na’ mwanzoni, kwa kuwa Kiswahili cha orodha ya nasaba kinasomeka kwa kawaida bila kiunganishi hicho.
- source_word: קְהָת
  choice: Kohathi
  rationale: Jina la Kiebrania limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל
  choice: Amramu, Ishari, Hebroni na Uzieli
  rationale: Majina haya manne yametoholewa kwa Kiswahili, huku viunganishi vya Kiebrania vikiwakilishwa kwa koma na ‘na’ kabla ya jina la mwisho.
- source_word: וּשְׁנֵי חַיֵּי
  choice: Miaka ya maisha ya ... ilikuwa
  rationale: Usemi huu wa Kiebrania una maana halisi ya ‘miaka ya maisha ya.’ Muundo wa Kiswahili unahifadhi taswira hiyo bila kutumia neno la kifafanuzi zaidi kama ‘umri.’ Kiunganishi cha mwanzo hakihitajiki katika sentensi mpya ya Kiswahili.
- source_word: שָׁלֹשׁ וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: miaka 133
  rationale: Mpangilio wa tarakimu umewekwa kwa kawaida ya Kiswahili. Kutumia tarakimu kunatoa usomaji wazi na wa sasa, huku nomino ya umoja ya Kiebrania baada ya namba ambatani ikitafsiriwa kwa wingi ‘miaka.’
