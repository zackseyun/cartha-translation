base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/015.yaml
  text: 'And the sons of Simeon: Jemuel[a], and Jamin, and Ohad, and Jakin, and Zohar, and Shaul the son of the Canaanite woman. These are the clans of Simeon.'
translation:
  language: sw
  text: Na wana wa Simeoni walikuwa Yemueli, Yamini, Ohadi, Yakini, Sohari, na Shauli, mwana wa mwanamke Mkanaani. Hizi ndizo koo za Simeoni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: Na wana wa Simeoni walikuwa
  rationale: “Wana” huonyesha kwa kawaida orodha ya ukoo, huku “na” ikihifadhi kiunganishi cha Kiebrania. Kitenzi “walikuwa” kinawekwa wazi kwa Kiswahili cha kawaida katika kishazi hiki kisicho na kitenzi katika Kiebrania.
- source_word: יְמוּאֵל
  choice: Yemueli
  rationale: Unukuzi wa jina la Kiebrania kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: וְיָמִין
  choice: Yamini
  rationale: Unukuzi wa moja kwa moja unaofuata thamani ya konsonanti ya kwanza ya Kiebrania; viunganishi vya orodha vimerahisishwa kwa mtindo wa asili wa Kiswahili.
- source_word: וְאֹהַד
  choice: Ohadi
  rationale: Jina limenukuliwa kwa muundo unaotamkika kwa urahisi katika Kiswahili.
- source_word: וְיָכִין
  choice: Yakini
  rationale: Unukuzi wa Kiebrania יָכִין kwa kuwakilisha yod kwa “Y,” badala ya kufuata tahajia ya Kiingereza.
- source_word: וְצֹחַר
  choice: Zohari
  rationale: Unukuzi wa karibu wa jina la Kiebrania katika mfumo wa sauti wa Kiswahili.
- source_word: וְשָׁאוּל
  choice: Shauli
  rationale: Unukuzi kutoka Kiebrania שָׁאוּל; umbo hili ni la kawaida na linalotamkika kwa Kiswahili bila kulazimisha tahajia ya Kiingereza.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: mwana wa mwanamke Mkanaani
  rationale: Umbo la Kiebrania ni la kike, kwa hiyo “mwanamke Mkanaani” huonyesha wazi jinsia ambayo ingeweza kupotea kwa kusema “Mkanaani” pekee.
- source_word: אֵלֶּה מִשְׁפְּחֹת שִׁמְעוֹן
  choice: Hizi ndizo koo za Simeoni
  rationale: “Koo” hufaa kwa makundi ya undugu ndani ya kabila; “ndizo” huwasilisha kwa kawaida kishazi cha utambulisho kisicho na kitenzi katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina yamenukuliwa kutoka Kiebrania kwa mfumo unaofaa Kiswahili; orodha imetolewa kwa ufasaha wa kawaida bila kurudia “na” kabla ya kila jina.
