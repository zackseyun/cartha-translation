  text: So Moses spoke thus to the sons of Israel[b][a], but they did not listen to Moses because of discouragement and harsh slavery.
translation:
  language: sw
  text: Basi Musa akasema na Waisraeli hivyo, lakini hawakumsikiliza Musa kwa sababu ya kuvunjika moyo[a] na kazi ngumu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kwa ufupi wa roho.” Kirai hiki kinaweza kumaanisha kukata tamaa au roho iliyobanwa na dhiki.
    reason: lexical_alternative
  - marker: b
    text: Au, “utumishi mgumu” au “utumwa mkali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akawaambia
  rationale: Katika taarifa hii ya kisimulizi, kitenzi cha kusema kikielekezwa kwa watu fulani kinatafsirika kwa Kiswahili cha kawaida na cha asili kuwa “akawaambia.”
- source_word: כֵּן
  choice: maneno hayo
  rationale: Neno hili linaelekeza nyuma kwenye ujumbe wa Mungu uliotangulia; “maneno hayo” huonyesha rejeo hilo kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa kiasi kikubwa muundo wa Kiebrania, huku likiwa tamko la heshima linaloeleweka katika Kiswahili cha Biblia.
- source_word: שָׁמְעוּ אֶל
  choice: hawakumsikiliza
  rationale: Muundo huu haumaanishi tu kutosikia sauti, bali kutopokea au kutozingatia aliyosema Musa; “hawakumsikiliza” huhifadhi maana hiyo.
- source_word: מִקֹּצֶר רוּחַ
  choice: kwa sababu ya kuvunjika moyo
  rationale: Kirai hicho kihalisi ni “kwa ufupi wa roho” na huonyesha roho iliyobanwa au iliyokata tamaa kutokana na dhiki. “Kuvunjika moyo” ni Kiswahili cha asili kinachowasilisha hali hiyo bila kuifanya kuwa kutokuwa na subira tu.
- source_word: וּמֵעֲבֹדָה קָשָׁה
  choice: na kazi ngumu ya utumwa
  rationale: “Kazi ngumu” hudumisha maana ya msingi ya עֲבֹדָה קָשָׁה, na “ya utumwa” huweka wazi mazingira ya kazi ya kulazimishwa nchini Misri bila kubadilisha kazi kuwa dhana ya jumla tu ya utumwa.
theological_decisions:
- issue: Namna ya kueleza hali ya Israeli chini ya Misri katika עֲבֹדָה קָשָׁה
  choice: kazi ngumu ya utumwa
  alternative: utumwa mkali; kazi ngumu
  rationale: Neno עֲבֹדָה linaweza kumaanisha kazi au utumishi, huku muktadha ukionyesha kazi ya kulazimishwa ya watu waliokuwa utumwani. Tafsiri iliyochaguliwa inahifadhi vipengele vyote viwili bila kulazimisha neno lenyewe limaanishe “utumwa” peke yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Basi” huendeleza simulizi, “maneno hayo” hurejelea ujumbe uliotangulia, na alama zote za tanbihi zimewekwa baada ya virai vinavyohusika.
