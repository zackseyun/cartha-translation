base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/024.yaml
  text: 'The sons of Korah: Assir[a], Elkanah, and Abiasaph. These are the clans of the Korahites.'
translation:
  language: sw
  text: Wana wa Kora walikuwa Asiri, Elkana na Abiasafu. Hizi ndizo koo za Wakora.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno ‘mwana’ katika hali ya kuunganisha; katika ukoo huu majina matatu yanayotajwa yanaeleweka kuwa wana wa moja kwa moja. Kiunganishi cha mwanzo hakihitaji kutafsiriwa ili sentensi iwe ya asili kwa Kiswahili.
- source_word: קֹרַח
  choice: Kora
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: אַסִּיר
  choice: Asiri
  rationale: Katika muktadha huu ni jina la mtu, si nomino ya kawaida inayoweza kumaanisha mfungwa.
- source_word: וְאֶלְקָנָה
  choice: Elkana
  rationale: Jina la mtu limetoholewa; kiunganishi chake kinawakilishwa kiasili katika orodha kwa ‘na’ kabla ya jina la mwisho.
- source_word: וַאֲבִיאָסָף
  choice: Abiasafu
  rationale: Jina la mtu limetoholewa kwa muundo unaosomeka kwa urahisi katika Kiswahili huku likihifadhi umbo la Kiebrania.
- source_word: אֵלֶּה
  choice: Hizi ndizo
  rationale: Kiwakilishi hiki kinatambulisha koo zilizotokana na wana waliotajwa; ‘hizi ndizo’ ni usemi wa kawaida na wenye mkazo unaofaa.
- source_word: מִשְׁפְּחֹת
  choice: koo
  rationale: Katika mazingira ya kikabila na ya nasaba, neno hili humaanisha vikundi vya jamaa pana ndani ya kabila; ‘koo’ ni sahihi zaidi kuliko ‘familia’ katika Kiswahili.
- source_word: הַקָּרְחִי
  choice: Wakora
  rationale: Ni umbo la kutaja watu walio wa ukoo wa Kora; ‘Wakora’ ni jina la kundi linaloeleweka kwa Kiswahili.
