lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Nami pia
  rationale: Inahifadhi kiunganishi cha nyongeza na msisitizo wa kiwakilishi cha msemaji wa kimungu, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: שָׁמַעְתִּי
  choice: nimesikia
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililotimia ambalo matokeo yake yana umuhimu katika kauli ya sasa.
- source_word: נַאֲקַת
  choice: kuugua
  rationale: Neno hili linaeleza sauti ya uchungu unaotokana na ukandamizaji, bila kuifanya kuwa kilio cha kawaida tu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Linakaribia muundo halisi wa Kiebrania huku likitaja kwa pamoja wazao au watu wa Israeli, si wanaume pekee.
- source_word: מִצְרַיִם מַעֲבִדִים אֹתָם
  choice: Wamisri wanawatumikisha
  rationale: Kitenzi cha kusababisha katika muktadha huu kinaonyesha kuwalazimisha kutumika chini ya ukandamizaji; ‘wanawatumikisha’ kinahifadhi wazo hilo kwa ufupi.
- source_word: וָאֶזְכֹּר
  choice: nami nimelikumbuka
  rationale: Tafsiri inadumisha nahau ya kibiblia ya kukumbuka, badala ya kuifafanua moja kwa moja kuwa hatua ya utekelezaji.
- source_word: בְּרִיתִי
  choice: agano langu
  rationale: ‘Agano’ ndilo neno la kawaida na sahihi kwa uhusiano wa ahadi unaoelezwa na בְּרִית katika muktadha huu.
theological_decisions:
- issue: Maana ya pamoja ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Muundo wa Kiebrania umehifadhiwa bila kudokeza kwamba unawahusu wanaume pekee; tanbihi inaweka wazi maana yake ya kijumuiya.
- issue: Mungu ‘kukumbuka’ agano
  choice: nimelikumbuka agano langu
  alternative: nimeanza kutenda kulingana na agano langu
  rationale: Nahau ya agano imehifadhiwa pamoja na mvutano wake wa kitheolojia. Tanbihi inaeleza kwamba si dai kwamba Mungu alikuwa amesahau, bila kuingiza ufafanuzi huo ndani ya mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa urahisi. Muundo ‘Nami pia’ unahifadhi msisitizo wa Kiebrania; ‘wanawatumikisha’ linaonyesha kazi ya kulazimishwa na ukandamizaji bila kuongeza maelezo yasiyomo katika mstari.
