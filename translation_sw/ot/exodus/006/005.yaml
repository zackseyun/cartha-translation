  text: And I also have heard the groaning of the sons of Israel[a], whom the Egyptians are enslaving[b], and I have remembered my covenant.
translation:
  language: sw
  text: Nami pia nimesikia kuugua kwa wana wa Israeli[a], ambao Wamisri wanawatumikisha, nami nimelikumbuka agano langu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watu wa Israeli.” Kiebrania kinasema kihalisi “wana wa Israeli.”
