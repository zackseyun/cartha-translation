  rationale: Kiunganishi וְ kimetafsiriwa 'na', kikifuatiwa na jina la mwana wa pili.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Katika muktadha wa nasaba na makabila, מִשְׁפָּחָה humaanisha kundi pana la ukoo; 'koo' ni sahihi na ya kawaida kuliko 'familia' ambayo leo mara nyingi hueleweka kuwa kaya ndogo.
