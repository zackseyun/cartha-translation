base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/029.yaml
  text: Then Yahweh spoke to Moses[a], saying, “I am Yahweh. Speak to Pharaoh king of Egypt all that I speak to you.”
translation:
  language: sw
  text: 'Ndipo Yahweh akamwambia Musa: “Mimi ni Yahweh. Mwambie Farao, mfalme wa Misri, yote ninayokuambia[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yote ninayosema nawe” au “yote ninayoendelea kusema nawe.”
    reason: Huhifadhi uwezekano wa participle ya Kiebrania דֹּבֵר katika kirai אֲשֶׁר אֲנִי דֹּבֵר אֵלֶיךָ, na nanga iko kwenye kirai kinachohusika.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Ndipo ... akasema
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha hatua inayofuata kwa Kiswahili cha kawaida, huku “akasema na” ikidumisha maana ya kusema kwa mtu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: לֵאמֹר
  choice: —
  rationale: Katika Kiswahili, kazi yake ya kutambulisha maneno ya moja kwa moja imewasilishwa kwa alama za kunukuu; kuongeza “akisema” baada ya “akasema” kungekuwa marudio yasiyo ya kawaida.
- source_word: אֲנִי יְהוָה
  choice: Mimi ni Yahweh
  rationale: Kiwakilishi “Mimi” kinahifadhi msisitizo wa אֲנִי, na kitenzi “ni” kinakamilisha kishazi kisicho na kitenzi kwa Kiswahili cha kawaida.
- source_word: דַּבֵּר
  choice: Mwambie
  rationale: Katika muktadha huu amri ya kusema ujumbe kwa Farao inaelezwa kwa kawaida zaidi kwa “Mwambie,” bila kubadili walengwa au maudhui ya amri.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Farao, mfalme wa Misri
  rationale: Muundo wa uambatano wa Kiebrania umehifadhiwa kwa kirai elezi cha Kiswahili kilichotengwa kwa koma.
- source_word: אֵת כָּל אֲשֶׁר
  choice: yote
  rationale: “Yote” huwasilisha ujumla wa maudhui ambayo Musa anatakiwa kuyafikisha.
- source_word: אֲנִי דֹּבֵר אֵלֶיךָ
  choice: ninayokuambia
  rationale: Umbo la wakati wa sasa linahifadhi thamani ya participle דֹּבֵר na linaeleza kwa Kiswahili cha kawaida yale Yahweh anayomwambia Musa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya אֲנִי katika kujitambulisha kwa Mungu
  choice: Mimi ni Yahweh
  alternative: Ni Yahweh
  rationale: Kutaja “Mimi” wazi kunahifadhi msisitizo wa kiwakilishi cha Kiebrania bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Tafsiri imetumia muundo wa kawaida wa mazungumzo ya moja kwa moja na imeepuka marudio yasiyo ya kawaida ya “akasema, akisema.” Hakuna tanbihi iliyoongezwa kwa kuwa uwezekano wa participle דֹּבֵר unaingizwa kwa kawaida katika “ninayokuambia,” na tanbihi ya Kiingereza iliyopewa inaonekana kutolingana na alama yake katika matini.
