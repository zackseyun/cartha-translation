base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/020.yaml
  text: Amram took Jochebed[a], his father’s sister, as his wife, and she bore to him Aaron and Moses. The years of Amram’s life were 137 years.
translation:
  language: sw
  text: Amramu akamchukua Yokebedi[a], shangazi yake, kuwa mke wake. Naye akamzalia Haruni na Musa. Miaka ya maisha ya Amramu ilikuwa 137.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana finyu zaidi ya neno la ukoo, dada ya baba yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akamchukua
  rationale: Huhifadhi nahau ya Kiebrania ya ‘kumchukua’ mwanamke awe mke, huku kishazi kinachofuata kikifafanua wazi ndoa.
- source_word: דֹּדָתוֹ
  choice: shangazi yake
  rationale: Umbo la kike la neno la ukoo hapa humaanisha jamaa wa kike wa daraja la shangazi; ‘shangazi yake’ ni tafsiri fupi na ya kawaida bila kulazimisha ufafanuzi mwembamba zaidi.
- source_word: לְאִשָּׁה
  choice: awe mke wake
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba kumchukua huko kulikuwa katika uhusiano wa ndoa.
- source_word: וַתֵּלֶד לוֹ
  choice: Naye akamzalia
  rationale: Kitenzi hiki pamoja na kiwakilishi cha yambwa kisicho cha moja kwa moja humaanisha kwamba alimzalia watoto; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: שְׁנֵי חַיֵּי
  choice: Miaka ya maisha ya
  rationale: Huhifadhi muundo wa kawaida wa Kiebrania wa kutaja urefu wa maisha na unasomeka kwa urahisi katika Kiswahili.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: miaka 137
  rationale: Hutoa thamani kamili ya nambari kwa namna iliyo wazi na ya kisasa.
- source_word: עַמְרָם / יוֹכֶבֶד / אַהֲרֹן / מֹשֶׁה
  choice: Amramu / Yokebedi / Haruni / Musa
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia na matumizi ya Kiswahili cha Afrika Mashariki.
theological_decisions:
- issue: Neno la ukoo wa karibu katika taarifa ya ndoa ambayo aina yake ilikatazwa baadaye katika sheria ya Torati
  choice: shangazi yake
  alternative: dada ya baba yake
  rationale: Aya inasimulia uhusiano wa kifamilia bila kutoa hukumu ya kimaadili. ‘Shangazi yake’ huhifadhi maana ya msingi bila kuupunguza au kuufanya mahususi zaidi kuliko neno la aya lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi la nasaba ni wa heshima, wazi, na wa kisasa. Hakuna tanbihi iliyohitajika kwa sababu ‘shangazi yake’ huhifadhi upana halisi wa neno la ukoo.
