base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/007.yaml
  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
translation:
  language: sw
  text: Nami nitawachukua kuwa watu wangu, nami nitakuwa Mungu wenu. Nanyi mtajua kwamba mimi ni Yahwe, Mungu wenu, ninayewatoa[a] kutoka chini ya mizigo ya Misri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyewatoa.” Kiebrania kinatumia umbo la participle, ambalo linaweza kusisitiza tendo linaloendelea au la kawaida, au tendo hilo kama jambo linalomtambulisha Yahwe.
    reason: lexical_alternative
  - marker: b
    text: Au “kazi ya kulazimishwa ya Misri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: nitawachukua
  rationale: Kitenzi cha Kiebrania katika mfululizo huu wa ahadi kina maana ya wakati ujao. “Nitawachukua” kinadumisha wazo la Mungu kuwachukua Waisraeli wawe wake bila kulifafanua kupita kiasi.
- source_word: לִי לְעָם
  choice: muwe watu wangu
  rationale: Muundo huu unaonyesha kusudi na uhusiano wa kumilikiwa katika agano. Kiswahili hiki ni cha asili na kinaweka wazi utambulisho wao kama watu wa Mungu.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: nitakuwa Mungu wenu
  rationale: Huu ni usemi wa kawaida wa agano unaoonyesha uhusiano kati ya Mungu na watu wake.
- source_word: וִידַעְתֶּם
  choice: mtajua
  rationale: Wakati ujao unalingana na ahadi ya Kiebrania na unaweza kuhusisha kujua kwa ufahamu na kwa uzoefu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi namna linavyotumiwa moja kwa moja katika maandishi ya Kiebrania.
- source_word: הַמּוֹצִיא
  choice: ninayewatoa
  rationale: Umbo la kitenzi-tendaji la Kiebrania linamwonyesha Yahwe kama yule anayefanya tendo la kuwatoa. Wakati wa sasa wa Kiswahili huhifadhi hali ya tendo linaloendelea au linalomtambulisha mtendaji.
- source_word: מִתַּחַת
  choice: kutoka chini ya
  rationale: Tafsiri hii inadumisha taswira halisi ya kuwa chini ya ukandamizaji.
- source_word: סִבְלֹת
  choice: mizigo
  rationale: Neno hilo linaweza kumaanisha mizigo inayobebwa na, kwa upanuzi, kazi nzito ya kulazimishwa. “Mizigo” huhifadhi upana na taswira ya neno la Kiebrania.
- source_word: מִצְרָיִם
  choice: Misri
  rationale: Hili ndilo jina la kawaida la nchi hiyo katika Kiswahili Sanifu.
theological_decisions:
- issue: Usemi wa agano
  choice: nitawachukua muwe watu wangu, nami nitakuwa Mungu wenu
  alternative: nitawachukua kuwa watu wangu, nami nitakuwa Mungu kwenu
  rationale: Uandishi uliochaguliwa ni wa asili katika Kiswahili na unadumisha pande zote mbili za uhusiano wa agano bila kuingiza mfumo wa kiteolojia wa baadaye.
- issue: Uwasilishaji wa jina la Mungu
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina יהוה moja kwa moja; kulitohowa kama “Yahwe” huhifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Wakati wa הַמּוֹצִיא
  choice: ninayewatoa
  alternative: aliyewatoa
  rationale: Kitenzi-tendaji cha Kiebrania kinaweza kuonyesha tendo linaloendelea au tendo linalomtambulisha Yahwe kama mkombozi. Matini kuu inadumisha umbo hilo kwa wakati wa sasa, huku tanbihi ikitaja uwezekano wa kuliona kama tendo lililokamilika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Nami” na “nanyi” vinaunganisha ahadi kwa mtiririko wa kifungu bila kuwa vya kizamani kupita kiasi. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
