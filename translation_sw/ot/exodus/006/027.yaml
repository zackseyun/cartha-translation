base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/027.yaml
  text: These are the ones who spoke to Pharaoh king of Egypt to bring the sons of Israel out of Egypt—this is Moses and Aaron[a][b].
translation:
  language: sw
  text: Hao ndio waliozungumza na Farao, mfalme wa Misri, ili kuwatoa wana wa Israeli[a] kutoka Misri; hao ni Musa na Haruni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa uhalisi, “wana wa Israeli”; usemi huu pia mara nyingi hutafsiriwa “Waisraeli” au “watoto wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kina kiwakilishi cha umoja hapa: kwa uhalisi, “Huyu ndiye Musa na Haruni.”'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הֵם
  choice: Hao ndio
  rationale: Kiwakilishi huru cha wingi kinawatambulisha kwa mkazo watu waliotajwa hapo awali; “Hao ndio” ni Kiswahili cha kawaida chenye nguvu hiyo ya utambulisho.
- source_word: הַמְדַבְּרִים
  choice: waliokuwa wakizungumza
  rationale: Kitenzi kishirikishi cha Kiebrania kinatoa sifa endelevu ya Musa na Haruni kwa tendo lao mbele ya Farao. Muundo huu wa Kiswahili unaonyesha hali hiyo kuliko wakati uliopita sahili.
- source_word: אֶל
  choice: na
  rationale: Pamoja na kitenzi cha kusema au kuzungumza, Kiswahili cha kawaida husema “kuzungumza na” mtu, ingawa Kiebrania kina kihusishi chenye mwelekeo wa ‘kwa’.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Farao, mfalme wa Misri
  rationale: Virai hivi vimewekwa kwa uhusiano wa ufafanuzi, na koma inaonyesha wazi kwamba “mfalme wa Misri” ni cheo kinachomfafanua Farao.
- source_word: לְהוֹצִיא
  choice: ili kuwatoa
  rationale: Hifili ya יצא ina maana ya kusababisha watoke. “Kuwatoa” huhifadhi maana hiyo ya kisababishi, huku “ili” ikionyesha kusudi katika muktadha.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili ni neno la Kiswahili lililo karibu na muundo wa Kiebrania, “wana wa Israeli,” bila kubadilisha moja kwa moja kuwa jina la kikabila “Waisraeli.”
- source_word: מִמִּצְרָיִם
  choice: Misri
  rationale: Baada ya “kuwatoa,” Kiswahili hakihitaji kihusishi kingine ili kutoa maana ya kutoka ndani ya Misri.
- source_word: הוּא
  choice: hao ni
  rationale: Kiebrania kinatumia kiwakilishi cha umoja kisicho cha kawaida kabla ya majina mawili. Matini kuu imetumia wingi wa kawaida wa Kiswahili kwa utambulisho, huku umbo la Kiebrania likibainishwa katika tanbihi.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Musa na Haruni
  rationale: Majina yametolewa kwa maumbo yao yaliyozoeleka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Kiwakilishi cha umoja הוּא kabla ya “Musa na Haruni”
  choice: Hao ni Musa na Haruni
  alternative: Kwa neno moja moja, “Huyo ndiye Musa na Haruni”
  rationale: Wingi ni wa kawaida na wazi katika Kiswahili, lakini tanbihi inahifadhi umoja usio wa kawaida wa matini ya Kiebrania badala ya kuuficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Waliokuwa wakizungumza” huhifadhi tabia endelevu ya kitenzi kishirikishi; alama ya mkato mrefu inaonyesha hitimisho la utambulisho.
