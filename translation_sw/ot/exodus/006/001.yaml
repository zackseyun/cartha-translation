  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַתָּ֣ה תִרְאֶ֔ה אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה לְ/פַרְעֹ֑ה כִּ֣י בְ/יָ֤ד חֲזָקָה֙ יְשַׁלְּחֵ֔/ם וּ/בְ/יָ֣ד חֲזָקָ֔ה יְגָרְשֵׁ֖/ם מֵ/אַרְצֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/001.yaml
  text: Then Yahweh said to Moses[a], “Now you will see what I will do to Pharaoh, for by a strong hand he will let them go, and by a strong hand he will drive them out from his land.”
translation:
  language: sw
  text: Ndipo Yahweh akamwambia Musa, “Sasa utaona nitakachomfanyia Farao, kwa maana kwa mkono wenye nguvu[a] atawaachilia waende, na kwa mkono wenye nguvu atawafukuza kutoka nchini mwake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kulazimishwa atawaachilia waende, na kwa kulazimishwa atawafukuza.” Kirai kinachorudiwa “kwa mkono wenye nguvu” huenda kikamaanisha kwamba Farao atatenda kwa sababu ya nguvu kubwa inayomshurutisha—hatimaye nguvu za Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi ili kuhifadhi jina binafsi la agano badala ya kulibadilisha kuwa cheo.
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha asili na kudumisha wazo la tendo linalofuata.
- source_word: עַתָּה
  choice: Sasa
  rationale: Neno hili linaonyesha wakati na kusisitiza kwamba hatua ya Mungu iliyoahidiwa iko karibu kuonekana.
- source_word: תִרְאֶה
  choice: utaona
  rationale: Wakati ujao unaeleza wazi kwamba Musa atashuhudia udhihirisho unaokuja wa tendo la Mungu.
- source_word: אֲשֶׁר אֶעֱשֶׂה לְפַרְעֹה
  choice: nitakachomfanyia Farao
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayohifadhi uhusiano mpana wa kihusishi ל bila kuongeza wazi maana ya ‘dhidi ya,’ ingawa muktadha unaonyesha hukumu.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza maelezo ya jinsi tendo la Mungu litakavyomfanya Farao awaachilie watu.
- source_word: בְיָד חֲזָקָה
  choice: kwa mkono wenye nguvu
  rationale: Nahau ya Kiebrania na urudiaji wake vimehifadhiwa ili kutotatua kimyakimya utata kuhusu nguvu inayomlazimisha Farao kutenda.
- source_word: יְשַׁלְּחֵם
  choice: atawaachilia waende
  rationale: Katika muktadha huu kitenzi kinamaanisha kuwapa Waisraeli ruhusa na uhuru wa kuondoka.
- source_word: יְגָרְשֵׁם
  choice: atawafukuza
  rationale: Kitenzi hiki kina nguvu kuliko kuwaacha waende tu; kinaonyesha kuwatimua kwa haraka au kwa shinikizo.
- source_word: מֵאַרְצוֹ
  choice: kutoka nchini mwake
  rationale: Kauli hii ni ya asili katika Kiswahili na inaonyesha wazi kuondolewa nje ya nchi ya Farao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Unukuzi ‘Yahweh’ huhifadhi jina binafsi lililofunuliwa kwa Israeli bila kulibadilisha kuwa cheo au kuchagua umbo jingine la kimapokeo.
- issue: Mhusika au chanzo cha ‘mkono wenye nguvu’
  choice: Kuhifadhi nahau ‘kwa mkono wenye nguvu’ katika matini kuu
  alternative: kwa kulazimishwa; kwa sababu ya mkono wenye nguvu wa Mungu
  rationale: Kiebrania kinaweza kudokeza kwamba Farao atatenda chini ya nguvu isiyozuilika ya Mungu, lakini hakisemi hilo kwa uwazi ndani ya kirai. Kuhifadhi nahau kunaacha mvutano huo bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Urudiaji wa nahau ya Kiebrania umehifadhiwa kwa ajili ya msisitizo na uwiano wa sentensi.
