  text: וַ/יְדַבֵּ֥ר אֱלֹהִ֖ים אֶל מֹשֶׁ֑ה וַ/יֹּ֥אמֶר אֵלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/002.yaml
  text: God spoke to Moses and said to him[a], “I am Yahweh.”
translation:
  language: sw
  text: Mungu akasema na Musa, akamwambia, “Mimi ni Yahwe[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH; pia huandikwa “Yahweh.”'
    reason: Huonyesha umbo la konsonanti la jina la Kiebrania na tahajia mbadala ya jina hilo.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Kitenzi דבר katika mtindo wa simulizi kinatanguliza usemi wa Mungu. “Akasema” ni usemi wa kawaida, wa heshima, na unaoeleweka vizuri katika Kiswahili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi, kitenzi chake ni cha umoja na hapa neno hilo linamtaja Mungu wa Israeli.
- source_word: אֶל־מֹשֶׁה
  choice: na Musa
  rationale: Katika Kiswahili, “kusema na mtu” ni namna ya kawaida ya kueleza kwamba usemi ulielekezwa kwa mtu huyo; Musa ni tahajia sanifu ya jina hilo.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: akamwambia
  rationale: “Akamwambia” huunganisha kwa kawaida kitenzi אמר na mhusika anayepokea maneno, huku ikihifadhi kitenzi cha pili cha kusema kilichopo katika Kiebrania.
- source_word: אֲנִי
  choice: Mimi ni
  rationale: Kiwakilishi huru אֲנִי kina mkazo wa kujitambulisha; “Mimi ni” huwasilisha mkazo huo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti YHWH limetoholewa kwa tahajia ya Kiswahili kama “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova; Yahweh
  rationale: Andiko la Kiebrania linatumia jina binafsi YHWH. “Yahwe” hulihifadhi kama jina na kufuata tahajia ya kawaida ya Kiswahili, bila kuamua kwa uhakika zaidi ya ushahidi kuhusu matamshi yake ya kale.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya vitenzi viwili vya kusema yamehifadhiwa kwa njia ya asili: “akasema … akamwambia.”'
