  rationale: בְּנֵי ni wingi wa hali ya kuunganisha wa neno ‘mwana’; katika orodha hii ya ukoo, ‘wana wa’ ndilo chaguo la kawaida na mahususi. Kiunganishi וּ kimetafsiriwa ‘Na’ ili kuhifadhi mwendelezo wa orodha.
- source_word: יִצְהָר
