  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: וָ/נֶפֶג
  choice: Nefegi
  rationale: Jina נֶפֶג limetoholewa kama ‘Nefegi’ ili kuepuka konsonanti g mwishoni, ambayo si ya kawaida katika maneno ya Kiswahili; kiunganishi chake kinawakilishwa katika mpangilio wa orodha.
- source_word: וְ/זִכְרִי
  choice: na Zikri
  rationale: Jina זִכְרִי limetoholewa kwa karibu kama ‘Zikri’; וְ limetafsiriwa ‘na’.
