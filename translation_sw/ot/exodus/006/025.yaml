base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/025.yaml
  text: And Eleazar son of Aaron took for himself a wife from the daughters of Putiel[a], and she bore him Phinehas[b]. These are the heads of the fathers’ houses of the Levites by their clans.
translation:
  language: sw
  text: Eleazari mwana wa Aroni alijitwalia mke kutoka miongoni mwa binti za Putieli[a] kuwa mke wake, naye akamzalia Finehasi. Hawa ndio wakuu wa nyumba za baba za Walawi, kwa koo zao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mmoja wa binti za Putieli.” Kauli ya Kiebrania yaweza kumaanisha kuoa katika familia ya Putieli bila kubainisha ni binti yupi.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “wakuu wa baba”; hii ni istilahi ya ukoo inayowataja wakuu wa nyumba za nasaba ndani ya koo za Walawi.
    reason: cultural_note
lexical_decisions:
- source_word: לָקַח לוֹ ... לְאִשָּׁה
  choice: alijitwalia mke
  rationale: Huhifadhi nahau ya Kiebrania ya kujitwalia mwanamke kuwa mke, huku ikiwa Kiswahili cha asili na kinachoeleweka.
- source_word: מִבְּנוֹת פּוּטִיאֵל
  choice: kutoka miongoni mwa binti za Putieli
  rationale: Huwakilisha מן yenye maana ya kutoka katika kundi, bila kulazimisha maandishi kubainisha ni binti yupi.
- source_word: וַתֵּלֶד לוֹ אֶת־פִּינְחָס
  choice: naye akamzalia Finehasi
  rationale: Kitenzi cha kike humrejelea mke; 'akamzalia' huhifadhi pia kiwakilishi cha yule aliyemzalia mtoto.
- source_word: רָאשֵׁי אֲבוֹת
  choice: viongozi wa jamaa za ukoo
  rationale: Ni istilahi ya kijamii na nasaba kwa wakuu wa nyumba au makundi ya ukoo, si 'vichwa vya baba' kwa maana halisi.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa watu wa kabila lililotokana na Lawi.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kufuatana na koo zao
  rationale: Katika muktadha wa nasaba, מִשְׁפָּחָה hurejelea makundi ya ukoo; 'koo zao' ni wazi na ya kawaida.
- source_word: אֶלְעָזָר / אַהֲרֹן / פּוּטִיאֵל / פִּינְחָס
  choice: Eleazari / Aroni / Putieli / Finehasi
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili.
