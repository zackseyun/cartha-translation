  text: 'And the sons of Merari: Mahli and Mushi[a]. These are the clans of Levi according to their generations.'
translation:
  language: sw
  text: 'Na wana wa Merari: Mahli na Mushi. Hizi ndizo koo za Lawi[a] kwa vizazi vyao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “koo za Walawi.” Kiebrania kimetumia umoja, “Mlawi,” ambao huenda unawakilisha kwa pamoja ukoo wa Lawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Na wana wa
  rationale: Neno בְּנֵי ni wingi wa hali ya utegemezi wa ‘mwana’; katika orodha ya nasaba, ‘wana wa’ ndilo chaguo la kawaida. Kiunganishi וּ kimetafsiriwa ‘Na’ ili kuhifadhi mwendelezo wa orodha.
- source_word: מְרָרִי
  choice: Merari
  rationale: Jina la mtu limetoholewa kwa namna inayotambulika katika Kiswahili.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Jina la mtu limetoholewa kwa namna inayotambulika katika Kiswahili.
- source_word: וּ/מוּשִׁי
  choice: na Mushi
  rationale: Kiunganishi kimehifadhiwa, na jina limetoholewa kwa namna inayotambulika katika Kiswahili.
- source_word: אֵלֶּה
  choice: Hizi ndizo
  rationale: Kiwakilishi hiki kinatanguliza kishazi cha utambulisho; ‘Hizi ndizo’ ni Kiswahili cha asili kinacholingana na nomino ‘koo’.
- source_word: מִשְׁפְּחֹת
  choice: koo
  rationale: Katika muktadha wa kabila na nasaba, neno hili humaanisha migawanyiko ya watu wenye uhusiano wa damu; ‘koo’ ni sahihi zaidi hapa kuliko ‘familia’.
- source_word: הַ/לֵּוִי
  choice: za Lawi[a]
  rationale: Kiebrania kina umbo la umoja lenye kibainishi, linaloweza kutumika kwa maana ya ukoo mzima wa Lawi. ‘Za Lawi’ ni ya kawaida na wazi katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa kulielewa kama jina la kundi la Walawi.
- source_word: לְ/תֹלְדֹתָם
  choice: kwa vizazi vyao
  rationale: Neno תּוֹלְדוֹת katika kauli za nasaba hurejelea vizazi au mistari ya uzao; tafsiri hii inadumisha mtindo rasmi wa orodha ya nasaba.
