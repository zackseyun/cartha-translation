base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/003.yaml
  text: And I appeared to Abraham[a], to Isaac, and to Jacob as God Almighty, but by my name, Yahweh[b], I was not known to them.
translation:
  language: sw
  text: Nami niliwatokea Abrahamu, Isaka, na Yakobo kama Mungu Mwenyezi[a], lakini kwa jina langu, Yahwe[b], sikujulikana kwao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: El Shaddai; kwa kawaida hutafsiriwa “Mungu Mwenyezi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: YHWH, jina binafsi la Mungu; kwa kawaida hutafsiriwa “BWANA.”'
    reason: lexical_alternative
  - marker: c
    text: Au, “sikujitambulisha kwao kwa jina langu Yahwe.” Huenda Kiebrania hakimaanishi kwamba hawakulijua kabisa jina hilo, bali kwamba hawakuwa bado wamejua kikamilifu maana yake katika agano.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵרָא
  choice: niliwatokea
  rationale: Nifali ya ראה hapa ina maana ya moja kwa moja ya ‘nilionekana/niliwatokea.’ ‘Niliwatokea’ ni ya asili katika Kiswahili na inafaa kwa matukio ya Mungu kujidhihirisha kwa mababu bila kuongeza tafsiri ya ‘nilijifunua.’
- source_word: אֶל אַבְרָהָם אֶל יִצְחָק וְאֶל יַעֲקֹב
  choice: Abrahamu, Isaka, na Yakobo
  rationale: Kitenzi ‘kuwatokea’ tayari kinaonyesha walengwa, hivyo kurudia kihusishi cha Kiebrania kwa ‘kwa’ kila mara kungekuwa kizito katika Kiswahili. Majina yametolewa katika maumbo yaliyozoeleka ya Kiswahili.
- source_word: בְּאֵל שַׁדָּי
  choice: kama Mungu Mwenyezi
  rationale: בְּ hapa inaonyesha namna/jina ambalo Mungu alijitambulisha. ‘Mungu Mwenyezi’ hutafsiri cheo אֵל שַׁדָּי kwa lugha iliyo wazi na iliyozoeleka; umbo la Kiebrania limehifadhiwa katika tanbihi.
- source_word: וּשְׁמִי יְהוָה
  choice: lakini kwa jina langu, Yahwe
  rationale: ‘Lakini’ huonyesha utofautishaji uliopo katika muktadha, na ‘kwa jina langu’ huhifadhi muundo wa Kiebrania. יְהוָה imetolewa kama jina binafsi ‘Yahwe,’ si kubadilishwa kuwa cheo ‘BWANA.’
- source_word: לֹא נוֹדַעְתִּי לָהֶם
  choice: sikujulikana kwao
  rationale: Hifadhi umbo la hali/tendwa la Nifali na utata wake. Kiswahili hiki hakiamui kimya kimya ikiwa mababu hawakulijua jina lenyewe au hawakuwa wamemjua Mungu kwa umuhimu wake kamili wa agano.
theological_decisions:
- issue: Maana ya kutokujulikana kwa mababu kwa jina Yahwe
  choice: sikujulikana kwao
  alternative: sikujitambulisha kwao kwa jina langu Yahwe
  rationale: Kiebrania kinaweza kueleweka kama hali ya kutokujulikana au kama tendo la Mungu kutojifanya ajulikane. Maandishi makuu yanadumisha mvutano huo, hasa kwa kuwa jina la Mungu linaonekana katika simulizi za mababu katika Mwanzo; tanbihi inaeleza uwezekano wa maana ya kina ya kiagano bila kuiingiza katika tafsiri.
- issue: Utoaji wa tetragramatoni יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia jina ‘Yahwe’ huhifadhi kwamba kifungu kinazungumzia jina binafsi la Mungu, si cheo. ‘BWANA’ ni desturi ya tafsiri lakini ingeficha tofauti ya kileksia inayosisitizwa na aya.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa msomaji wa kawaida. Muundo ni wa ulinganifu bora: unafuata Kiebrania kwa karibu pale ambapo ni wa asili, huku ukiepuka urudiaji mzito wa vihusishi. Alama zote za tanbihi [a], [b], na [c] zimo katika maandishi makuu.'
