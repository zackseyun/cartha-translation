  choice: ili niwape
  rationale: Inatoa kwa kawaida kusudi la kitenzi-jina cha Kiebrania pamoja na walengwa wake.
- source_word: אֶרֶץ כְּנָעַן
  choice: nchi ya Kanaani
  rationale: Inahifadhi nomino ‘nchi’ na jina maalumu Kanaani.
- source_word: אֶרֶץ מְגֻרֵיהֶם אֲשֶׁר גָּרוּ בָהּ
  choice: nchi walimokaa kama wageni
  rationale: ‘Kukaa kama wageni’ huwasilisha hali ya kuishi ugenini iliyo katika nomino מָגוּר na kitenzi גור, kwa Kiswahili cha kawaida bila kudokeza kuwa walikuwa watalii.
theological_decisions:
