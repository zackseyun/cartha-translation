  choice: nililithibitisha agano langu
  alternative: nililiweka imara agano langu
  rationale: Chaguo hili linadumisha uzito wa ahadi ya Mungu kwa mababu bila kuingiza tofauti za kiteolojia zisizosemwa na nahau ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Pamoja nao’ ni rasmi kidogo kuliko ‘nao’ na kinafaa kwa muktadha wa agano. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachofafanuliwa.
