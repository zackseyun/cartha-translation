  yaml_path: translation/ot/exodus/006/026.yaml
  text: It was Aaron and Moses to whom Yahweh said[c][b][a], “Bring the sons of Israel out from the land of Egypt by their hosts.”
translation:
  language: sw
  text: Hawa ndio Aroni na Musa[a] ambao Yahweh aliwaambia, “Watoeni wana wa Israeli kutoka nchi ya Misri kwa makundi yao yaliyopangwa.”[b]
  philosophy: optimal-equivalence
  footnotes:
