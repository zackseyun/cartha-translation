    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא אַהֲרֹן וּמֹשֶׁה
  choice: Hawa ndio Aroni na Musa
  rationale: Kiwakilishi huru cha umoja הוּא kinatumika kwa msisitizo wa kuwatambulisha watu waliotajwa hapo awali. Kiswahili cha kawaida hutumia muundo wa utambulisho wa wingi, “Hawa ndio,” kwa Aroni na Musa.
- source_word: אֲשֶׁר אָמַר יְהוָה לָהֶם
  choice: ambao Yahweh aliwaambia
  rationale: Muundo huu unaonyesha kwamba Aroni na Musa ndio walioelekezewa maneno ya Yahweh; “aliwaambia” ni ya asili katika Kiswahili na inajumuisha maana ya לָהֶם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: הוֹצִיאוּ
  choice: Watoeni
  rationale: Kauli ya kuamuru ya Hifili ya יצא ina maana ya kuwasababisha watoke, yaani kuwatoa; umbo la wingi linaelekezwa kwa Aroni na Musa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: “Wana wa Israeli” huhifadhi taswira ya kifamilia ya Kiebrania huku ikiwa usemi wa Kiswahili unaoeleweka; hapa inarejelea taifa la Israeli kwa ujumla.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Pamoja na kitenzi “watoeni,” “katika” huonyesha chanzo cha kutoka kwa Kiswahili cha kawaida, huku “nchi” ikihifadhi אֶרֶץ.
- source_word: עַל צִבְאֹתָם
  choice: kwa makundi yao yaliyopangwa
  rationale: צְבָאוֹת inaweza kumaanisha majeshi au vikundi vilivyopangwa. Katika simulizi la kutoka Misri, tafsiri hii huhifadhi dhana ya mpangilio bila kulazimisha maana ya kijeshi pekee.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina maalumu la agano; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha na cheo.
- issue: Upeo wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Usemi wa chanzo ni wa kifamilia lakini katika muktadha unahusu taifa zima; “wana wa Israeli” huhifadhi umbo hilo bila kudokeza kwamba wanaume pekee ndio waliotoka.
- issue: Maana ya עַל צִבְאֹתָם
  choice: kwa makundi yao yaliyopangwa
  alternative: kwa majeshi yao; kwa vikosi vyao
  rationale: Neno linaweza kuwa na ladha ya kijeshi au ya vikundi vilivyopangwa. Tafsiri kuu inahifadhi wazo la mpangilio, na tanbihi inadumisha uwezekano wa maana ya kijeshi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa asili kwa msomaji wa kawaida, huku ukihifadhi msisitizo wa utambulisho, jina Yahweh, taswira ya kifamilia, na utata wa kiwango cha kijeshi katika צִבְאֹתָם.
