source:
  edition: WLC
  text: בֹּ֣א דַבֵּ֔ר אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וִֽ/ישַׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/011.yaml
  text: Go[a], speak to Pharaoh king of Egypt, that he may let the sons of Israel go out from his land.
translation:
  language: sw
  text: Nenda ukazungumze na Farao, mfalme wa Misri, ili awaache wana wa Israeli[a] waondoke katika nchi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania kinasema kihalisi “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּא
  choice: Nenda
  rationale: Ni amri ya kitenzi בוא. Katika muktadha huu Musa anaagizwa aende kwa Farao; kwa hiyo “Nenda” ni Kiswahili cha kawaida na wazi kuliko “Njoo.”
- source_word: דַבֵּר אֶל
  choice: ukazungumze na
  rationale: Muundo huu unaonyesha kusema kunakoelekezwa kwa Farao. “Ukazungumze na” ni wa kawaida katika Kiswahili na, baada ya “Nenda,” unaonyesha vizuri hatua inayofuata bila kubadili maana kuwa ujumbe usio wa moja kwa moja.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: Farao, mfalme wa Misri
  rationale: Huhifadhi jina la cheo na kirai kinacholifafanua kwa mpangilio wa asili, huku koma zikifanya sentensi iwe wazi katika Kiswahili.
- source_word: וִישַׁלַּח
  choice: ili awaache ... waondoke
  rationale: Kitenzi kinachofuata amri kinaeleza lengo au yaliyomo katika maneno ambayo Musa atamwambia Farao. Katika muktadha wa kutoka Misri, “awaache ... waondoke” huwasilisha wazo la kuwaachilia waende bila kulifanya kuwa utabiri tu.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Kirai cha Kiebrania ni cha kifamilia, kihalisi “wana wa Israeli.” Kiswahili “wana wa Israeli” huhifadhi picha hiyo na kinaweza kueleweka kama wazao wa Israeli, huku tanbihi ikitaja mbadala wa kikabila ulio wazi zaidi.
- source_word: מֵאַרְצוֹ
  choice: katika nchi yake
  rationale: Kihusishi מִן kinaonyesha kuondoka kutoka ndani ya eneo la Farao. Kwa kuambatana na “waondoke,” Kiswahili cha kawaida “waondoke katika nchi yake” huwasilisha maana ya kutoka kwenye nchi iliyo chini ya utawala wake.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Hakuna fundisho mahsusi linaloamuliwa hapa. Chaguo hili huhifadhi usemi wa kifamilia wa Kiebrania na uhusiano na Israeli kama babu wa taifa, bila kuufupisha kimyakimya kuwa jina la kikabila pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Nenda ukazungumze” ni wa kawaida na unaeleweka kwa urahisi; “Farao, mfalme wa Misri” huhifadhi ufafanuzi wa cheo, na “wana wa Israeli” huhifadhi usemi wa kifamilia wa chanzo.
