- source_word: וְ/אֶלְצָפָן
  choice: Elsafani
  rationale: Jina limetoholewa moja kwa moja kutoka אֶלְצָפָן; kiunganishi וְ־ kinawakilishwa katika orodha kwa “na.”
- source_word: וְ/סִתְרִי
  choice: Sithri
  rationale: Jina limetoholewa kwa ukaribu na Kiebrania סִתְרִי; kiunganishi וְ־ kinawakilishwa kwa “na.”
