  yaml_path: translation/ot/exodus/006/030.yaml
  text: But Moses said before the LORD, “Look, I am uncircumcised of lips; so how will Pharaoh listen to me?”
translation:
  language: sw
  text: Lakini Musa akasema mbele za BWANA, “Tazama, mimi nina midomo isiyotahiriwa; basi Farao atanisikilizaje?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: mbele za BWANA
  rationale: Inahifadhi maana ya kusema mbele ya uwepo wa Mungu na kuwakilisha jina la agano יהוה kwa desturi ya Kiswahili ya ‘BWANA’.
- source_word: הֵן
  choice: Tazama
  rationale: Ni kiashirio cha kusisitiza kinachovuta fikira kwenye pingamizi la Musa.
- source_word: עֲרַל שְׂפָתַיִם
  choice: nina midomo isiyotahiriwa
  rationale: Inahifadhi sitiari halisi na yenye uzito ya Kiebrania badala ya kuifasiri moja kwa moja kuwa ufasaha mdogo.
- source_word: יִשְׁמַע אֵלַי
  choice: atanisikilizaje
  rationale: Katika muktadha huu ‘kusikia’ kunamaanisha kumsikiliza au kumtilia maanani Musa; muundo wa Kiswahili ni wa kawaida huku swali likibaki wazi.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni uwakilishi wa kawaida na wenye hadhi katika Biblia za Kiswahili, bila kuongeza tanbihi isiyo ya lazima katika mstari huu.
- issue: Maana ya sitiari ‘midomo isiyotahiriwa’
  choice: Sitiari imehifadhiwa katika matini
  alternative: Siwezi kusema kwa ufasaha
  rationale: Chanzo hakifafanui wazi kama Musa anamaanisha kutokuwa fasaha, kutofaa, au kizuizi kingine; tafsiri haipaswi kuondoa utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka. Muundo wa ‘mbele za BWANA’ una ladha ya kibiblia inayofaa; sitiari kuu imehifadhiwa kwa uaminifu.
