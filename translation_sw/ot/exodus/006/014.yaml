base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/014.yaml
  text: 'These are the heads of their fathers’ houses: the sons of Reuben[a], the firstborn of Israel: Hanoch and Pallu, Hezron and Carmi. These are the clans of Reuben.'
translation:
  language: sw
  text: 'Hawa ndio wakuu wa nyumba za baba zao: wana wa Reubeni, mzaliwa wa kwanza wa Israeli, walikuwa Hanoki, Palu, Hesroni na Karmi. Hizi ndizo koo za Reubeni.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה רָאשֵׁי
  choice: Hawa ndio wakuu
  rationale: Kirai hiki kinatanguliza orodha ya watu wenye nafasi ya uongozi katika vikundi vya ukoo; “wakuu” huhifadhi maana na hadhi ya רָאשֵׁי kwa Kiswahili cha kawaida na chenye staha.
- source_word: בֵית אֲבֹתָם
  choice: nyumba za baba zao
  rationale: Hii ni istilahi rasmi ya nasaba inayorejelea vitengo vya ukoo wa upande wa baba. Tafsiri ya karibu imehifadhiwa ili kutofuta tofauti yake na מִשְׁפְּחֹת mwishoni mwa mstari.
- source_word: בְּנֵי רְאוּבֵן
  choice: wana wa Reubeni
  rationale: Orodha inawataja wana wa moja kwa moja wa Reubeni; “wana” ni sahihi zaidi hapa kuliko “wazao,” ambayo inaweza kumaanisha vizazi vingi.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: mzaliwa wa kwanza wa Israeli
  rationale: Kirai hiki kinamtambulisha Reubeni kwa nafasi yake ya kuzaliwa na kuhifadhi muundo rasmi wa nasaba.
- source_word: חֲנוֹךְ וּפַלּוּא חֶצְרוֹן וְכַרְמִי
  choice: Hanoki, Palu, Hesroni na Karmi
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili na yanayokaribia matamshi ya Kiebrania.
- source_word: מִשְׁפְּחֹת
  choice: koo
  rationale: Katika muktadha wa kikabila na kinasaba, neno hili humaanisha vikundi vya undugu ndani ya kabila; “koo” ni mahususi zaidi kuliko “familia” katika Kiswahili cha sasa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo rasmi lakini unaoeleweka. Neno “walikuwa” limeongezwa kwa ulaini wa sentensi ya Kiswahili bila kubadili uhusiano wa majina katika maandishi ya Kiebrania. Tofauti kati ya “nyumba za baba” na “koo” imehifadhiwa.
