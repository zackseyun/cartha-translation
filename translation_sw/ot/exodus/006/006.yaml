language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֥ר לִ/בְנֵֽי יִשְׂרָאֵ֘ל אֲנִ֣י יְהוָה֒ וְ/הוֹצֵאתִ֣י אֶתְ/כֶ֗ם מִ/תַּ֨חַת֙ סִבְלֹ֣ת מִצְרַ֔יִם וְ/הִצַּלְתִּ֥י אֶתְ/כֶ֖ם מֵ/עֲבֹדָתָ֑/ם וְ/גָאַלְתִּ֤י אֶתְ/כֶם֙ בִּ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בִ/שְׁפָטִ֖ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/006.yaml
  text: Therefore say to the sons of Israel[a], ‘I am Yahweh, and I will bring you out from under the burdens of Egypt, and I will deliver you from their slavery[d][c][b], and I will redeem you with an outstretched arm and with great judgments.’
translation:
  language: sw
  text: Kwa hiyo waambie wana wa Israeli[a], ‘Mimi ni Yahweh. Nitawatoa kutoka chini ya mizigo ya Wamisri, nitawaokoa kutoka katika utumwa wao[b], nami nitawakomboa kwa mkono ulionyoshwa na kwa hukumu kubwa[c].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wa Israeli” au “Waisraeli.” Kiebrania kinasema kihalisi “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “utumishi wao wa kulazimishwa.” Neno la Kiebrania linaweza kumaanisha utumishi au kazi, lakini hapa linahusu utumwa wa ukandamizaji.
    reason: lexical_alternative
  - marker: c
    text: Au “matendo makuu ya hukumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na maneno ya Mungu yaliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi kwa ukaribu usemi wa kifamilia wa Kiebrania, huku tanbihi ikitoa tafsiri ya kawaida zaidi.
- source_word: אֲנִי יְהוָה
  choice: Mimi ni Yahweh
  rationale: Inahifadhi kujitambulisha kwa Mungu kwa jina lake la agano lililoandikwa יהוה.
- source_word: וְהוֹצֵאתִי
  choice: Nitawatoa
  rationale: Huwasilisha kwa ufasaha wazo la kuwafanya watoke katika hali ya ukandamizaji.
- source_word: מִתַּחַת סִבְלֹת מִצְרַיִם
  choice: chini ya mizigo ya Wamisri
  rationale: Inadumisha taswira halisi ya kuwa chini ya mizigo; 'Wamisri' huonyesha kwa kawaida watu waliowatwika mizigo hiyo.
- source_word: וְהִצַּלְתִּי
  choice: nitawaokoa
  rationale: Kitenzi hiki huonyesha kuwaondoa katika hatari na utawala dhalimu.
- source_word: מֵעֲבֹדָתָם
  choice: kutoka katika utumwa wao
  rationale: Katika muktadha huu עֲבֹדָה si kazi ya kawaida bali utumishi wa kulazimishwa chini ya Wamisri.
- source_word: וְגָאַלְתִּי
  choice: nitawakomboa
  rationale: '''Kukomboa'' huhifadhi wazo la kuwarejesha au kuwaokoa kwa tendo la mkombozi, pamoja na uzito wake wa kisheria na wa kiagano.'
- source_word: בִּזְרֹעַ נְטוּיָה
  choice: kwa mkono ulionyoshwa
  rationale: Ni usemi wa taswira unaoeleweka katika Kiswahili na unaohifadhi mfano wa nguvu ya Mungu inayotenda.
- source_word: וּבִשְׁפָטִים גְּדֹלִים
  choice: na kwa hukumu kuu
  rationale: Inakaa karibu na Kiebrania huku ikiacha wazi kama neno hilo linamaanisha hukumu zenyewe au matendo makuu ya hukumu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina maalumu la Mungu; kulitamka 'Yahweh' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Kiwango cha uhalisi katika לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: watoto wa Israeli au Waisraeli
  rationale: Chaguo hili huhifadhi usemi wa kifamilia na umbo la kiume la chanzo bila kudai kwamba ujumbe uliwalenga wanaume pekee.
- issue: Maana ya עֲבֹדָה katika muktadha
  choice: utumwa
  alternative: utumishi au kazi
  rationale: Muktadha wa Misri unaonyesha utumishi wa kulazimishwa na wa ukandamizaji; 'utumwa' haupunguzi ukali wa hali hiyo.
- issue: Maana ya שְׁפָטִים
  choice: hukumu kuu
  alternative: matendo makuu ya hukumu
  rationale: Tafsiri kuu inadumisha ufupi na uwezekano mpana wa neno la Kiebrania; tanbihi inaonyesha kwamba linaweza kurejelea matendo ya kutekeleza hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ahadi nne na taswira za Kiebrania zimehifadhiwa bila kufanya sentensi kuwa ngumu kupita kiasi.
