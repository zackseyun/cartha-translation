  yaml_path: translation/ot/exodus/006/023.yaml
  text: Aaron took Elisheba, the daughter of Amminadab and sister of Nahshon, as his wife, and she bore him Nadab, Abihu, Eleazar, and Ithamar.
translation:
  language: sw
  text: Aroni akamwoa Elisheba, binti ya Aminadabu na dada ya Nashoni, kuwa mke wake. Naye akamzalia Nadabu, Abihu, Eleazari na Ithamari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akamchukua
  rationale: Kitenzi לקח kimsingi humaanisha ‘chukua’; katika muktadha huu wa ndoa, kirai kinachofuata ‘awe mke wake’ kinaweka wazi maana ya kumwoa bila kuondoa taswira ya Kiebrania.
- source_word: אֱלִישֶׁבַע
  choice: Elisheba
  rationale: Jina limetoholewa kwa kufuata umbo la Kiebrania na matumizi yanayoeleweka katika Kiswahili.
- source_word: בַּת עַמִּינָדָב
  choice: binti ya Aminadabu
  rationale: Muundo wa nasaba umetafsiriwa kwa Kiswahili cha kawaida kinachoonyesha wazi uhusiano wa mtoto wa kike na baba.
- source_word: אֲחוֹת נַחְשׁוֹן
  choice: dada ya Nashoni
  rationale: ‘Dada ya’ ni namna ya kawaida ya Kiswahili ya kutaja uhusiano huu wa kindugu bila kulazimisha mkubwa au mdogo.
- source_word: לּוֹ לְאִשָּׁה
  choice: awe mke wake
  rationale: Hili linaeleza wazi kusudi na hali ya ndoa inayomaanishwa na kirai cha Kiebrania, kwa lugha ya asili ya Kiswahili.
- source_word: וַתֵּלֶד לוֹ
  choice: Naye akamzalia
  rationale: Kitenzi ‘akamzalia’ kwa kawaida huonyesha kwamba mwanamke alimzalia mume watoto, na kinahifadhi kiwakilishi cha Kiebrania לוֹ.
- source_word: נָדָב
  choice: Nadabu
  rationale: Jina limetoholewa katika umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֲבִיהוּא
  choice: Abihu
  rationale: Jina limetoholewa kwa kufuata matamshi ya Kiebrania na matumizi ya Kiswahili.
- source_word: אֶלְעָזָר
  choice: Eleazari
  rationale: Jina limetoholewa katika umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: אִיתָמָר
  choice: Ithamari
  rationale: Jina limetoholewa katika umbo linalotumika kwa kawaida katika Kiswahili.
