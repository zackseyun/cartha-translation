lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi mpito wa kisimulizi wa umbo hili la היה kwa lugha fupi, ya kawaida katika simulizi, bila kuongeza neno la wakati lisilokuwamo katika Kiebrania.
- source_word: בְּיוֹם
  choice: siku ile
  rationale: Huwakilisha kihalisi wazo la ‘katika/siku ambayo’ kwa Kiswahili cha kawaida; kishazi kinachofuata kinaonyesha siku inayokusudiwa.
- source_word: דִּבֶּר ... אֶל מֹשֶׁה
  choice: aliposema na Musa
  rationale: דבר humaanisha kusema au kunena, na אֶל humtaja anayeelekezewa maneno. Tafsiri hii ni ya asili katika Kiswahili na haibadili tendo hilo kuwa agizo au mazungumzo yenye maana pana zaidi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa na cheo.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Huhifadhi nomino אֶרֶץ, ‘nchi,’ badala ya kufupisha usemi huo kuwa ‘Misri’ pekee.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Kifungu kinatumia jina binafsi YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha na cheo, bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ikawa’ hudumisha mtindo wa kisimulizi bila kutumia usemi mzito kama ‘ikawa kwamba.’ Mstari umeachwa na kistari kirefu kwa sababu sentensi inaendelea katika muktadha unaofuata.
