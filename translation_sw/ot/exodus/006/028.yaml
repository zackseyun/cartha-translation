  text: It happened on the day when Yahweh spoke to Moses in the land of Egypt—[a][b]
translation:
  language: sw
  text: Ikawa[a] siku ile Yahwe[b] aliposema na Musa katika nchi ya Misri—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na ikawa.”
