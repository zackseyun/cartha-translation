    issue: “Utaisubia” has incorrect verbal morphology.
    rationale: The future form of kusubu is “utasubu,” not “utaisubia.” The current form is nonstandard and impairs the rendering of וְיָצַקְתָּ (“you shall cast”).
  - severity: low
    issue: “upande wake mmoja” is less natural word order.
    rationale: “katika upande mmoja wake” clearly expresses placement on one of the object's sides while retaining the source's contrast with the second side.
