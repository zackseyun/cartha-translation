translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye mtindo wa maagizo ulio rasmi lakini unaoeleweka. “Kusubu” limetumiwa kama istilahi sahihi ya ufundi wa metali; sentensi imepangwa kwa urahisi huku ikihifadhi marudio na ulinganifu wa chanzo.
