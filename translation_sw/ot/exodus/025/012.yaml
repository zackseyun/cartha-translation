base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/012.yaml
  text: 'And you shall cast four rings of gold for it and put them on its four feet: two rings on one side of it and two rings on its second side[a].'
translation:
  language: sw
  text: 'Utasubu pete nne za dhahabu kwa ajili yake, na kuziweka kwenye miguu yake minne[a]: pete mbili katika upande mmoja wake, na pete mbili katika upande wake wa pili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pembe zake nne” badala ya “miguu yake minne.” Neno la Kiebrania ni gumu hapa, lakini yaelekea linarejelea miguu au sehemu za chini zinazounga sanduku, si pembe tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצַקְתָּ
  choice: Utaisubia
  rationale: Kitenzi יצק katika muktadha wa kutengeneza vifaa vya dhahabu humaanisha kusubu chuma, si kumimina kwa ujumla. “Kusubu” ni neno sahihi la Kiswahili kwa kutengeneza kitu kwa kumimina metali iliyoyeyushwa katika kalibu.
- source_word: טַבְּעֹת
  choice: pete
  rationale: Nomino hii inamaanisha pete za metali ambazo hapa zilitumiwa kushikilia miti ya kubebea sanduku.
- source_word: זָהָב
  choice: dhahabu
  rationale: Hili ndilo jina la kawaida na sahihi la metali inayotajwa.
- source_word: וְנָתַתָּה
  choice: na kuziweka
  rationale: Kitenzi נתן kina maana pana; “kuziweka” kinaeleza kwa njia ya kawaida agizo la kufunga pete hizo mahali pake bila kuongeza maelezo yasiyokuwapo katika chanzo.
- source_word: פַּעֲמֹתָיו
  choice: miguu yake minne
  rationale: Ingawa neno hili ni gumu katika kifungu hiki, linaelekea kurejelea miguu au sehemu za chini zinazounga sanduku. Tafsiri hii inadumisha taswira halisi ya Kiebrania; uwezekano wa “pembe” umeonyeshwa katika tanbihi.
- source_word: צַלְעוֹ
  choice: upande wake
  rationale: Katika muktadha wa jengo au kitu, צלע humaanisha upande; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: mmoja ... wa pili
  rationale: Uundaji huu unahifadhi mpangilio wa Kiebrania wa upande mmoja na upande wa pili bila kuufanya usemi kuwa mzito.
