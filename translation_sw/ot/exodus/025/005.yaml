  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania תְּחָשִׁים (tahashim) halijulikani kwa uhakika. Huenda linamaanisha ngozi za nguva, ngozi za pomboo, au aina fulani ya ngozi bora.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת
  choice: ngozi
  rationale: Nomino hii ya wingi katika hali ya kuunganisha inamaanisha ngozi za wanyama zinazotumiwa kama nyenzo; “ngozi” ni ya kawaida na haisisitizi kiwango fulani cha uchakataji.
- source_word: אֵילִם
  choice: kondoo dume
  rationale: Neno hili la wingi humaanisha kondoo wa kiume; katika orodha ya vifaa, “ngozi za kondoo dume” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: מְאָדָּמִים
  choice: zilizotiwa rangi nyekundu
  rationale: Umbo hili linaonyesha ngozi zilizofanywa kuwa nyekundu, si ngozi zenye rangi nyekundu kiasili; kauli hii inaonyesha utendaji huo bila kudai njia mahususi ya upakaji.
- source_word: עֹרֹת תְּחָשִׁים
  choice: ngozi za tahashi
  rationale: Utambulisho wa תְּחַשׁ hauna uhakika. Kutumia jina lililotoholewa “tahashi” huepuka kutaja kwa uhakika mnyama au aina ya ngozi ambayo maandishi yenyewe hayaibainishi; tanbihi inaeleza uwezekano mkuu.
- source_word: עֲצֵי
  choice: mbao
  rationale: Ingawa neno linaweza kumaanisha miti au kuni, katika orodha hii ya vifaa vya ujenzi “mbao” ni tafsiri ya asili na inayofaa zaidi.
- source_word: שִׁטִּים
  choice: mshita
  rationale: Neno hili hutambulishwa kwa kawaida kuwa mshita (acacia); “mbao za mshita” ni Kiswahili sanifu na wazi.
theological_decisions: []
