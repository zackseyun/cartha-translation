revisions:
- from: Nawe angalia kwamba unavitengeneza kulingana na kielelezo chake[a] ulichoonyeshwa mlimani.
  to: Angalia ukavifanye kulingana na vielelezo vyao[a] ulivyoonyeshwa mlimani.
  rationale: Revised the sentence to make Moses explicitly the recipient of the showing through the Swahili relative construction “vielelezo vyao ulivyoonyeshwa,” while retaining the Hebrew plural possessive suffix. “Angalia ukavifanye” preserves the admonitory imperative followed by the command to make the objects, in natural Standard East African Swahili. The rendering remains open as to the precise nature of the revealed model.
