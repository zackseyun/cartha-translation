  text: And see that you make them according to their pattern[a], which was shown to you on the mountain.
translation:
  language: sw
  text: Angalia ukavifanye kulingana na vielelezo vyao[a] ulivyoonyeshwa mlimani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Angalia, kisha uvifanye kwa kufuata vielelezo vyao ulivyoonyeshwa mlimani.”
    reason: Hudhihirisha uratibu wa amri mbili na wingi wa kiambishi katika בְּתַבְנִיתָם.
lexical_decisions:
- source_word: וּרְאֵה
  choice: Nawe angalia kwamba
  rationale: Amri ya ראה hapa ni onyo la kuzingatia kwa makini. Kiswahili hiki huhifadhi nguvu ya amri na kuunganisha kwa kawaida jambo linalopaswa kufanywa.
- source_word: וַעֲשֵׂה
  choice: unavitengeneza
  rationale: עשה katika muktadha wa kutengeneza vyombo humaanisha ‘tengeneza.’ Kiambishi -vi- kinarejelea vitu vilivyoelezwa kabla.
- source_word: בְּתַבְנִיתָם
  choice: kulingana na kielelezo chake
  rationale: תבנית inaweza kumaanisha kielelezo, umbo, au mfano wa kufuatwa. Ingawa kiambishi cha Kiebrania ni cha wingi (‘vyao’), Kiswahili cha kawaida hutumia umoja wa pamoja kwa kielelezo kinachohusu vitu hivyo.
- source_word: אֲשֶׁר
  choice: ulicho
  rationale: Kiwakilishi hiki cha uhusiano huunganisha kielelezo na tendo la kukionyesha kwa Musa.
- source_word: אַתָּה מָרְאֶה
  choice: ulichoonyeshwa
  rationale: מָרְאֶה inaeleweka vizuri kama umbo la kutendwa la ראה, ‘kuonyeshwa.’ Wakati uliopita ni wa kawaida katika Kiswahili kwa ufunuo alioupokea Musa mlimani, bila kuondoa maana ya tendo linalowasilishwa katika muktadha.
- source_word: בָּהָר
  choice: mlimani
  rationale: Hii ndiyo namna ya kawaida na fasaha ya kusema ‘juu/kwenye mlima’ katika muktadha huu.
theological_decisions:
- issue: Asili ya kielelezo cha vitu vya maskani
  choice: kielelezo
  alternative: mfano; umbo; mpango
  rationale: ‘Kielelezo’ huonyesha kitu kilichoonyeshwa ili kifuatwe, bila kuamua kama ni nakala ya kitu cha mbinguni, mpango wa usanifu, au umbo la aina nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Nawe angalia kwamba’ huhifadhi msisitizo wa onyo la Kiebrania bila kuwa nzito kupita kiasi.
