  yaml_path: translation/ot/exodus/025/016.yaml
  text: And you shall put into the ark the testimony that I will give you[a].
translation:
  language: sw
  text: Na utaweka ndani ya sanduku ushuhuda nitakaokupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, hasa zaidi katika muktadha huu, “vibao vya ushuhuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Nawe utaweka
  rationale: Katika muundo huu, נתן ina maana ya kuweka kitu mahali fulani; ‘utaweka’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: אֶל
  choice: ndani ya
  rationale: Pamoja na kitenzi cha kuweka na nomino inayotaja chombo, אֶל huonyesha kuingiza kitu ndani ya sanduku.
- source_word: הָאָרֹן
  choice: sanduku
  rationale: Katika muktadha wa maskani, אָרוֹן ni sanduku takatifu; ‘sanduku’ ni neno la kawaida la Biblia ya Kiswahili bila kuongeza maelezo yasiyosemwa katika aya.
- source_word: אֵת
  choice: '[kiashiria cha yambwa tendwa, hakitafsiriwi]'
  rationale: אֵת ni kiashiria cha yambwa tendwa yenye uainifu na hakihitaji neno tofauti katika Kiswahili.
- source_word: הָעֵדֻת
  choice: ushuhuda
  rationale: עֵדוּת humaanisha ‘ushuhuda’ au kitu kinachoshuhudia. ‘Ushuhuda’ huhifadhi usemi wa Kiebrania bila kuutaja wazi kuwa vibao, jambo ambalo aya hii yenyewe haisemi.
- source_word: אֲשֶׁר
  choice: -taka-
  rationale: Kirejeshi cha Kiebrania kimewasilishwa kwa muundo wa kirejeshi wa Kiswahili katika ‘nitakaokupa’.
- source_word: אֶתֵּן
  choice: nitakakupa
  rationale: Qal imperfect nafsi ya kwanza umoja huonyesha tendo la wakati ujao hapa; ‘nitakakupa’ huhifadhi maana ya Mungu kumpa Musa ushuhuda.
- source_word: אֵלֶיךָ
  choice: -ku-
  rationale: Yambwa ‘kwako/wewe’ imeingizwa kiasili katika kitenzi cha Kiswahili ‘nitakakupa’.
theological_decisions:
- issue: Kitu kinachorejelewa na ‘ushuhuda’
  choice: Kutafsiri kwa ujumla kuwa ‘ushuhuda’ bila kutaja vibao katika matini kuu.
  alternative: ‘vibao vya ushuhuda’
  rationale: Kiebrania cha aya hii kinasema ‘ushuhuda’ tu. Muktadha mpana unautambulisha na vibao, lakini matini kuu haipaswi kufafanua zaidi ya maneno ya aya; uwezekano huo umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa asili na unaoeleweka kwa urahisi, huku ukihifadhi istilahi ‘ushuhuda’ na kutofafanua zaidi ya Kiebrania katika matini kuu.
