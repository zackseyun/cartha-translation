translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Marudio ya Kiebrania yamewasilishwa kama jozi ya kwanza, ya pili, na ya tatu ili uhusiano wa mafundo matatu na matawi sita uwe wazi, bila kubadili maudhui.
