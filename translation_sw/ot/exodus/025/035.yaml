  text: and a knob under two branches from it, and a knob under two branches from it, and a knob under two branches from it, for the six branches going out from the lampstand.
translation:
  language: sw
  text: Na kifundo chini ya matawi mawili yaliyotoka katika hicho, na kifundo chini ya matawi mawili yaliyotoka katika hicho, na kifundo chini ya matawi mawili yaliyotoka katika hicho, kwa matawi sita yaliyotoka katika kinara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: fundo
  rationale: Neno hili humaanisha sehemu ya mapambo yenye umbo la duara au uvimbe kwenye kinara; “fundo” ni la kawaida na linaonyesha kitovu kilichofanyizwa kwenye shina bila kudai umbo mahususi kupita kiasi.
- source_word: קָנִים
  choice: matawi
  rationale: Katika maelezo ya kinara, neno hili linarejelea mikono inayochipuka pembeni kama matawi; “matawi” ni wazi na la asili katika Kiswahili.
- source_word: מְנֹרָה
  choice: kinara
  rationale: Hapa ni kinara cha taa cha hema takatifu; “kinara” linafaa katika muktadha na huepuka kuongeza maelezo yasiyotajwa moja kwa moja katika mstari.
- source_word: מִמֶּנָּה / מִן הַמְּנֹרָה
  choice: yaliyotoka kwenye kinara
  rationale: Huhifadhi wazo kwamba matawi hayo yalitokana na mwili wa kinara chenyewe.
