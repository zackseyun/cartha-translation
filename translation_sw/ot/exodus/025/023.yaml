  text: You shall make a table of acacia wood[a], two cubits its length, one cubit its width, and a cubit and a half its height.
translation:
  language: sw
  text: Na utatengeneza meza ya mbao za mshita, urefu wake dhiraa mbili, upana wake dhiraa moja, na kimo chake dhiraa moja na nusu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utatengeneza
  rationale: Kitenzi cha Qal katika mfululizo wa maagizo kina nguvu ya amri. Kiunganishi וְ kimehifadhiwa kwa “Nawe,” ambacho kinaunganisha agizo hili na maagizo yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: שֻׁלְחָן
  choice: meza
  rationale: Hili ndilo neno la kawaida na wazi la Kiswahili kwa samani hii ya ibada.
- source_word: עֲצֵי שִׁטִּים
  choice: mbao za mshita
  rationale: Muundo wa Kiebrania unamaanisha mbao zitokanazo na mti wa mshita; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: אַמָּתַיִם
  choice: dhiraa mbili
  rationale: Kipimo cha kale kimehifadhiwa badala ya kubadilishwa kuwa kipimo cha kisasa, ili kudumisha mazingira na usahihi wa matini chanzi.
- source_word: אָרְכּוֹ
  choice: urefu wake
  rationale: Nomino yenye kiambishi cha nafsi ya tatu umoja wa kiume imetafsiriwa moja kwa moja na kwa kawaida.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: upana wake dhiraa moja
  rationale: Mpangilio huu ni wa asili zaidi katika Kiswahili huku ukihifadhi kipimo na ulinganifu wa vipimo vitatu.
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: na kimo chake dhiraa moja na nusu
  rationale: “Kimo” kinafaa kwa urefu wa kitu kutoka chini kwenda juu, na “dhiraa moja na nusu” huakisi kwa uwazi muundo wa Kiebrania.
