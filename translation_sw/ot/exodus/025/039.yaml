  text: He shall make it[a], with all these utensils, from a talent of pure gold.
translation:
  language: sw
  text: Atakitengeza kwa talanta moja ya dhahabu safi, pamoja na vyombo hivi vyote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na vifaa/zanа hizi zote.” Neno la Kiebrania linaweza kumaanisha kwa upana vyombo, vifaa, au zana zinazohusiana na kinara.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: talanta moja
  rationale: כִּכָּר ni kipimo sanifu cha uzito. Neno la kimapokeo “talanta” linahifadhi usahihi wa kipimo kuliko kusema tu kiasi cha dhahabu.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Hii ndiyo tafsiri ya kawaida na ya asili katika muktadha wa nyenzo za ufundi.
- source_word: יַעֲשֶׂה
  choice: ataitengeneza
  rationale: Kitenzi ni Qal imperfect nafsi ya tatu umoja wa kiume; katika maagizo haya wakati ujao wa Kiswahili unaeleza tendo linalotakiwa kufanywa, huku kiambishi cha yambwa kikirejelea kinara.
- source_word: אֹתָהּ
  choice: hiyo
  rationale: Kiwakilishi cha yambwa cha kike umoja kinarejelea kinara kilichotajwa katika muktadha uliotangulia. “Hiyo” kinaendeleza rejeo hilo bila kurudia nomino.
- source_word: אֵת כָּל הַכֵּלִים הָאֵלֶּה
  choice: pamoja na vyombo hivi vyote
  rationale: כֵּלִים ni neno pana linaloweza kumaanisha vyombo, vifaa, au zana. “Vyombo” ni neno la kawaida katika muktadha wa vifaa vinavyohusiana na kinara, na “pamoja na” linaonyesha kwamba vyote vinahesabiwa katika dhahabu hiyo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi na ya kawaida kwa wasomaji wengi, bila kuongeza ufafanuzi wa kimadhehebu. Hakuna tanbihi iliyohitajika kwa kuwa upana wa כֵּלִים unaweza kuhifadhiwa kwa neno “vyombo” katika muktadha huu.
