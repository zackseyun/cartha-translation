  yaml_path: translation/ot/exodus/025/009.yaml
  text: Exactly according to all that I am showing you—the pattern of the tabernacle and the pattern of all its furnishings—so you shall make it[a][b].
translation:
  language: sw
  text: “Kulingana na yote ninayokuonyesha—kielelezo cha Maskani na kielelezo cha vifaa vyake vyote—ndivyo mtakavyofanya.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ramani,” “mfano,” au “muundo” badala ya “kielelezo” (תַּבְנִית).
    reason: lexical_alternative
  - marker: b
    text: Katika Kiebrania, “mtakavyofanya” ni wingi. Umbo hilo linaelekeza agizo kwa zaidi ya mtu mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: sawasawa kabisa na yote
  rationale: Kifungu hiki kinaonyesha ulinganifu wa karibu na maagizo yanayoonyeshwa. ‘Sawasawa kabisa na yote’ hudhihirisha usahihi unaotakiwa bila kufanya Kiswahili kuwa kizito.
- source_word: מַרְאֶה
  choice: ninayokuonyesha
  rationale: 'Hali ya kitenzi kishirikishi ina nguvu ya tendo linaloendelea sasa: Mungu anamwonyesha Musa wakati huo.'
- source_word: תַּבְנִית
  choice: kielelezo
  rationale: ‘Kielelezo’ kinaweza kumaanisha mfano, muundo, au mpangilio unaopaswa kufuatwa, bila kuamua ikiwa Musa alionyeshwa ramani au kitu cha kuigwa kilichoonekana.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: ‘Maskani’ ni istilahi ya Kiswahili iliyozoeleka kwa hema takatifu katika simulizi la Kutoka, na pia inadumisha uhusiano wa neno la Kiebrania na wazo la kukaa.
- source_word: כָּל כֵּלָיו
  choice: vifaa vyake vyote
  rationale: כֵּלִים ni neno pana kwa vyombo, zana, na vitu vya matumizi. ‘Vifaa’ halilifungi kwa vyombo vya kuhifadhia pekee.
- source_word: וְכֵן תַּעֲשׂוּ
  choice: Mtafanya
  rationale: Muundo wa sentensi ya Kiswahili umeleta agizo mwanzoni kwa ufasaha, huku ‘mtafanya’ ikihifadhi nafsi ya pili wingi na maana ya kutekeleza kazi yote kulingana na kielelezo.
theological_decisions:
- issue: Ikiwa תַּבְנִית linapaswa kutaja wazi kielelezo cha mbinguni
  choice: kielelezo
  alternative: ramani; mfano; muundo
  rationale: Aya inasema Mungu anamwonyesha Musa תַּבְנִית, lakini haifafanui moja kwa moja asili yake. ‘Kielelezo’ hudumisha uwezekano wa mfano uliofunuliwa bila kuongeza dai la kiteolojia lisilotajwa wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio wa agizo umewekwa mwanzoni ili sentensi iwe ya kawaida katika Kiswahili, na vistari virefu vinatenga maelezo yanayofafanua kile Mungu anachoonyesha.
