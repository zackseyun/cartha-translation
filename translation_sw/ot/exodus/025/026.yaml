translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa maagizo ulio wazi, wa sasa na wenye hadhi. Mpangilio wa sentensi umehifadhi uhusiano wa pete, pembe na miguu bila kufuta utata wa פֵּאָה na רֶגֶל.
