  yaml_path: translation/ot/exodus/025/026.yaml
  text: And you shall make for it four gold rings[b][a], and you shall put the rings on the four corners that are at its four feet.
translation:
  language: sw
  text: Utaitengenezea pete nne za dhahabu, nawe utaziweka kwenye pembe zake nne[a], zilizo kwenye miguu yake minne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pande zake nne” au “kingo zake nne.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha “miguu” au sehemu za chini za miguu; hapa linarejelea miguu ya meza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ לּוֹ
  choice: Utaitengenezea
  rationale: Kitenzi cha wakati ujao katika Kiswahili kinaonyesha agizo katika mfululizo huu wa maagizo, na kiambishi -i- pamoja na kauli ya kutendea kinawasilisha maana ya ‘kumtengenezea/kukitengenezea’ meza hiyo.
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: pete nne za dhahabu
  rationale: ‘Pete’ ni neno la kawaida kwa حلقות za kufungia au kupitishia fito, na ‘za dhahabu’ huhifadhi bayana nyenzo iliyotajwa.
- source_word: וְנָתַתָּ אֶת הַטַּבָּעֹת
  choice: nawe utaziweka
  rationale: Katika muktadha wa ujenzi, נתן ina maana ya kuweka; kiwakilishi -zi- kinarejelea pete kwa njia ya kawaida ya Kiswahili.
- source_word: עַל אַרְבַּע הַפֵּאֹת
  choice: kwenye pembe zake nne
  rationale: פֵּאָה inaweza kumaanisha pembe, upande, au ukingo. ‘Pembe’ inafaa zaidi kwa sehemu nne za mwisho za meza, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: zilizo kwenye miguu yake minne
  rationale: Kishazi hiki kinahusianisha pembe hizo na tegemeo nne za meza. ‘Miguu’ ni matumizi ya kawaida ya Kiswahili kwa tegemeo za samani na pia huhifadhi upana wa maana wa רֶגֶל.
