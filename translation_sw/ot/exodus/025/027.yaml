  text: Pete hizo zitakuwa mkabala na ukingo[a], zikiwa vipokezi[b] vya miti ya kuibebea meza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kando ya ukingo” au “kwa kulingana na ukingo.” Kihusishi cha Kiebrania kinaweza kuonyesha mahali kwa uhusiano na kitu kingine bila kubainisha mpangilio wake kamili.
