lexical_decisions:
- source_word: לְעֻמַּת
  choice: mkabala na
  rationale: Huonyesha mahali pa kitu kwa uhusiano na kingine bila kulazimisha mpangilio mahususi kabisa; tanbihi inahifadhi uwezekano wa maana nyingine za kijiometri.
- source_word: הַמִּסְגֶּרֶת
  choice: ukingo
  rationale: Katika maelezo ya meza, neno hili linataja sehemu ya pembeni inayozunguka au kuunda mpaka wa meza; ‘ukingo’ ni la kawaida na linafaa katika muktadha huu.
- source_word: תִּהְיֶיןָ
  choice: zitakuwa
  rationale: Ni kitenzi cha kuwapo katika maagizo ya ujenzi, kikirejelea pete kwa wingi.
- source_word: הַטַּבָּעֹת
  choice: pete hizo
  rationale: ‘Pete’ ni neno la kawaida kwa duara za metali zinazopokea miti ya kubebea; ‘hizo’ huunganisha mstari huu na pete zilizotajwa katika muktadha uliotangulia.
- source_word: לְבָתִּים
  choice: vipokezi
  rationale: Kihalisi ni ‘nyumba,’ lakini hapa maana yake ni sehemu zinazopokea au kushikilia miti; ‘vipokezi’ hueleza kazi hiyo kwa uwazi.
- source_word: לְבַדִּים
  choice: vya miti
  rationale: בַּדִּים katika maelezo ya vifaa vya maskani ni miti mirefu ya kubebea; Kiswahili cha kawaida hutumia ‘miti ya kubebea.’
- source_word: לָשֵׂאת
  choice: ya kubebea
  rationale: Kitenzi-jina kinaonyesha kusudi la miti hiyo, yaani kubeba meza.
- source_word: הַשֻּׁלְחָן
  choice: meza
  rationale: Hili ndilo neno la kawaida na sahihi kwa samani inayofafanuliwa katika kifungu hiki.
