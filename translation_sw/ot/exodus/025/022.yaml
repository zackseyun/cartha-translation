base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/022.yaml
  text: And there I will meet with you[a], and I will speak with you from above the mercy seat, from between the two cherubim that are over the ark of the testimony[b], about all that I will command you for the sons of Israel.
translation:
  language: sw
  text: Huko nitakutana nawe[a], nami nitasema nawe kutoka juu ya kifuniko cha upatanisho, kutoka katikati ya wale makerubi wawili walio juu ya sanduku la ushuhuda, kuhusu yote nitakayokuamuru kwa ajili ya wana wa Israeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitakutana nawe kwa wakati uliowekwa.”
    reason: Nifali ya יעד inaweza kusisitiza mkutano uliopangwa.
  - marker: b
    text: Au, “kwa wana wa Israeli,” yaani amri zinazoelekezwa kwao.
    reason: Kihusishi אֶל kinaweza kuonyesha mwelekeo au walengwa wa amri.
lexical_decisions:
- source_word: וְנוֹעַדְתִּי לְךָ שָׁם
  choice: Hapo nitakutana nawe
  rationale: Nifali ya יעד ina maana ya kukutana kwa wakati au mahali palipopangwa. “Hapo” inarejelea mahali palipoelezwa, na “nitakutana nawe” ni Kiswahili cha kawaida kinachohifadhi wazo la mkutano wa moja kwa moja.
- source_word: וְדִבַּרְתִּי אִתְּךָ
  choice: na kusema nawe
  rationale: Kihusishi אִתְּךָ kinaunga mkono usemi wa uhusiano wa moja kwa moja, “nawe,” badala ya kuonyesha tu mwelekeo wa maneno.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: kutoka juu ya kifuniko cha upatanisho
  rationale: מֵעַל inaonyesha mahali sauti inakotoka. הַכַּפֹּרֶת ni kifuniko maalumu cha dhahabu cha sanduku kinachohusishwa na ibada ya upatanisho; tafsiri hii ni wazi kuliko kuhamisha moja kwa moja istilahi ya kimapokeo isiyo ya kawaida katika Kiswahili.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: katikati ya wale makerubi wawili
  rationale: Inahifadhi nafasi iliyoelezwa na idadi mbili. “Makerubi” ni namna ya kawaida ya Kiswahili kwa viumbe hawa wa mbinguni.
- source_word: אֲשֶׁר עַל אֲרֹן הָעֵדֻת
  choice: walio juu ya sanduku la ushuhuda
  rationale: “Juu ya” inaonyesha mahali makerubi walipokuwa, na “sanduku la ushuhuda” ni tafsiri ya karibu bila kufafanua ushuhuda huo kuwa vibao ndani ya matini kuu.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּה אוֹתְךָ
  choice: kuhusu yote nitakayokuamuru
  rationale: “Kuhusu” huunganisha kwa Kiswahili asilia kitendo cha kusema na jumla ya maagizo, huku “yote” ikihifadhi ukamilifu wa כָּל.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: kwa ajili ya wana wa Israeli
  rationale: Kifungu hiki kinaweza kuonyesha amri zinazoelekezwa kwa Israeli au zinazotolewa kwa ajili yao. “Wana wa Israeli” huhifadhi nahau ya kifamilia ya Kiebrania.
theological_decisions:
- issue: Maana ya הַכַּפֹּרֶת
  choice: kifuniko cha upatanisho
  alternative: kiti cha rehema; kifuniko
  rationale: Neno linataja kifuniko maalumu cha sanduku na lina uhusiano wa kiibada na upatanisho. “Kifuniko cha upatanisho” huhifadhi umbo halisi la kitu na uzito wake wa kiibada bila kulazimisha taswira ya kiti ambayo haijasemwa wazi na Kiebrania.
- issue: Uhusiano wa אֶל בְּנֵי יִשְׂרָאֵל na amri
  choice: kwa ajili ya wana wa Israeli
  alternative: kwa wana wa Israeli; kuwaambia wana wa Israeli
  rationale: Muundo wa Kiebrania ni mfupi na unaweza kueleweka kuwa amri ni kwa ajili ya Israeli au zinaelekezwa kwao. Matini kuu inatumia “kwa ajili ya,” huku tanbihi ikihifadhi uwezekano mwingine.
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Huhifadhi nahau ya kifamilia na umbo la Kiebrania, huku katika muktadha ikilitaja taifa zima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa mara mbili ili kuepuka mnyororo mzito wa vishazi bila kupoteza mwendelezo wa maneno ya Mungu. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
