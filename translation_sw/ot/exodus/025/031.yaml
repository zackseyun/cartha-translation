base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/031.yaml
  text: And you shall make a lampstand of pure gold[a]. The lampstand shall be made of hammered work; its base and its shaft, its cups, its buds[b], and its flowers shall be of one piece with it.
translation:
  language: sw
  text: “Nawe utatengeneza kinara cha taa cha dhahabu safi. Kinara hicho kitatengenezwa kwa kufua[a]; kitako chake na shina lake, vikombe vyake, vifundo vyake[b] na maua yake vitakuwa sehemu moja nacho.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kupigwa nyundo.” Kiebrania kinakazia kwamba kinara kilipaswa kuundwa kwa kufuliwa, yaelekea kutoka kipande kimoja badala ya kuunganishwa kwa vipande tofauti.
    reason: lexical_alternative
  - marker: b
    text: “Vifundo vyake” pia inaweza kutafsiriwa “machipukizi yake.” Kiebrania kinataja mapambo ya mviringo yaliyojitokeza katika mchoro wa kinara wenye sura ya mimea.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת
  choice: kinara cha taa
  rationale: Neno hilo linamaanisha kitu kinachoshikilia taa, si taa zenyewe. ‘Kinara cha taa’ ni Kiswahili cha kawaida na kilicho wazi.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Hili ndilo tamko la kawaida la Kiswahili kwa dhahabu iliyosafishwa na isiyochanganywa.
- source_word: מִקְשָׁה
  choice: kwa kufua
  rationale: Neno la Kiebrania linaeleza kazi ya chuma iliyoundwa kwa kupigwa nyundo, na katika muktadha huu inaonekana kuwa kutoka kipande kimoja badala ya kuunganisha vipande tofauti.
- source_word: תֵּעָשֶׂה
  choice: kitatengenezwa
  rationale: Umbo hili katika maagizo linaeleza jinsi kinara kinavyopaswa kutengenezwa; wakati ujao wa Kiswahili unafaa katika muktadha huu.
- source_word: יְרֵכָהּ
  choice: tako lake
  rationale: Ingawa maana ya msingi inaweza kuwa ‘paja’ au ‘ubavu,’ hapa linataja sehemu ya chini inayotegemeza kinara. ‘Tako’ ni istilahi fupi na inayoeleweka kwa msingi wa kitu.
- source_word: וְקָנָהּ
  choice: shina lake
  rationale: Umoja hapa unataja sehemu ya kati iliyonyooka ya kinara. ‘Shina’ pia linadumisha taswira ya mimea inayoonekana katika mapambo yake.
- source_word: גְּבִיעֶיהָ
  choice: vikombe vyake
  rationale: Neno hilo linataja mapambo yenye umbo la kikombe; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: כַּפְתֹּרֶיהָ
  choice: vifundo vyake
  rationale: Neno hilo linataja mapambo ya mviringo yaliyojitokeza. ‘Vifundo’ kinahifadhi umbo hilo bila kulazimisha tafsiri ya ‘machipukizi.’
- source_word: וּפְרָחֶיהָ
  choice: maua yake
  rationale: Mapambo yenye sura ya maua yametajwa wazi; ‘maua’ ni neno rahisi na sahihi.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: vitakuwa sehemu moja nacho
  rationale: Kifungu kinaonyesha kwamba sehemu hizo zitatokana na kinara chenyewe, si kuunganishwa baadaye kama vipande tofauti.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa agizo na istilahi za ufundi zimehifadhiwa bila kufanya sentensi kuwa nzito.
