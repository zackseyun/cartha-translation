  text: Its tongs and its firepans shall be of pure gold[a][b].
translation:
  language: sw
  text: Makoleo yake[a] na vyombo vyake vya kubebea makaa[b] vitakuwa vya dhahabu safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vikata-utambi vyake”; neno la Kiebrania linamaanisha kifaa cha kushikia au kukata utambi kinachohusiana na kinara.
    reason: lexical_alternative
  - marker: b
    text: Au “visahani vyake,” au, ingawa huenda si hivyo katika muktadha huu, “vyetezo vyake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְקָחֶיהָ
  choice: makoleo yake
  rationale: Neno hilo linamaanisha kifaa cha kushikia au kutengeneza tambi za taa katika muktadha wa kinara. “Makoleo” ni neno la kawaida na halibainishi kazi yake kupita ushahidi wa Kiebrania.
- source_word: מַחְתֹּתֶיהָ
  choice: vyombo vyake vya makaa
  rationale: Neno hilo kwa kawaida humaanisha vyombo vya kubebea makaa au moto. Tafsiri hii inafaa kwa vifaa vya mahali patakatifu bila kulifanya mahsusi kuwa chetezo.
- source_word: זָהָב טָהוֹר
  choice: vya dhahabu safi
  rationale: Kirai hiki kinaeleza moja kwa moja nyenzo ambayo vifaa hivyo vitatengenezwa nayo.
- source_word: וּ
  choice: na
  rationale: Kiunganishi hiki kinaunganisha aina mbili za vifaa.
- source_word: -הָ
  choice: yake / vyake
  rationale: Kiambishi cha nafsi ya tatu umoja wa kike kinarejelea kinara; Kiswahili hutumia viambishi vya ngeli vinavyolingana na majina husika.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Vyombo vya makaa” kimetumiwa badala ya istilahi adimu ili maana ieleweke kwa wasomaji wa kawaida huku utata wa neno la Kiebrania ukihifadhiwa katika tanbihi.
