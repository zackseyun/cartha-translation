lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: mawe ya shohamu
  rationale: Neno la Kiebrania שֹׁהַם hutaja jiwe la thamani ambalo utambulisho wake kamili hauna uhakika. Kutumia jina la kifonetiki “shohamu” huepuka kulifanya kwa uhakika kuwa oniksi, huku tanbihi ikieleza utata huo.
- source_word: אַבְנֵי מִלֻּאִים
  choice: mawe ya kutiwa kwenye nafasi zake
  rationale: מִלֻּאִים linahusiana na kujaza au kuweka kitu mahali palipotengwa; hapa ni mawe yaliyokusudiwa kutiwa katika sehemu zake kwenye mavazi ya kikuhani. Kauli hii ni ya kawaida katika Kiswahili na haibainishi kupita kiasi mbinu ya ufundi.
- source_word: לָאֵפֹד
  choice: kwa ajili ya efodi
  rationale: אֵפוֹד ni istilahi maalumu ya vazi la kikuhani. “Efodi” huhifadhi istilahi hiyo bila kuibadilisha kuwa maelezo yenye utata.
- source_word: וְלַחֹשֶׁן
  choice: na kifuko cha kifuani
  rationale: חֹשֶׁן ni kifaa cha kikuhani kilichovaliwa kifuani na kilichobeba mawe. “Kifuko cha kifuani” kinaeleza umbo na matumizi yake kwa uwazi zaidi kuliko “kifua,” ambalo lingeweza kueleweka kuwa sehemu ya mwili, au “deraya,” ambalo lingedokeza silaha.
