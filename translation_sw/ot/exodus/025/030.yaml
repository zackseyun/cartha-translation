  text: And you shall set the bread of the Presence on the table before me continually[a].
translation:
  language: sw
  text: Nawe utaweka juu ya meza mkate wa uwepo mbele yangu daima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mkate wa uwepo”; kwa mapokeo huitwa “mkate wa wonyesho.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: Nawe utaweka
  rationale: Kitenzi נתן kinaweza kumaanisha kutoa, kuweka, au kutia. Katika maagizo haya kuhusu vyombo vya maskani, “utaweka” ni Kiswahili cha kawaida kinachoonyesha kuwekwa kwa kitu mahali pake palipokusudiwa.
- source_word: עַל הַ/שֻּׁלְחָן
  choice: juu ya meza
  rationale: Kirai hiki kinaonyesha moja kwa moja mahali mikate inapowekwa, yaani juu ya meza maalumu iliyotajwa katika maagizo haya.
- source_word: לֶחֶם פָּנִים
  choice: mikate ya uwepo
  rationale: Kirai cha Kiebrania kwa maana halisi ni “mkate wa nyuso/uwepo.” “Mikate ya uwepo” huhifadhi istilahi ya ibada na maana ya kuwekwa katika uwepo wa Mungu, huku wingi wa Kiswahili ukiakisi mikate kadhaa iliyopangwa mezani katika muktadha huu.
- source_word: לְ/פָנַ/י
  choice: mbele yangu
  rationale: Maana yake halisi ni “mbele ya uso wangu/mbele yangu.” Tafsiri hii ni ya moja kwa moja, ya kawaida, na inadumisha usemi wa Mungu katika nafsi ya kwanza.
- source_word: תָּמִיד
  choice: daima
  rationale: Katika muktadha wa kikuhani, neno hili huonyesha hali au tendo linalodumishwa bila kukoma kupitia utaratibu wa mara kwa mara. “Daima” ni fupi, ya asili, na huhifadhi wajibu wa kuendelea.
theological_decisions:
- issue: Istilahi ya ibada לֶחֶם פָּנִים
  choice: mikate ya uwepo
  alternative: mikate ya wonyesho; mikate iliyowekwa mbele yangu
  rationale: “Mikate ya uwepo” huhifadhi taswira na uzito wa istilahi ya Kiebrania bila kuingiza jargon ya kimapokeo isiyo wazi. Pia hutofautisha kirai hiki na לְפָנַי, kinachofuata na kutafsiriwa “mbele yangu,” badala ya kuvifanya virudiwe kwa maana ileile.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na ulio wazi kwa wasomaji wa kawaida. “Nawe” hudumisha mwendelezo wa maagizo; “daima” huwasilisha wajibu endelevu wa kiibada. Alama ya tanbihi [a] imewekwa katika maandishi.
