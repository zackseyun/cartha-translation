  text: You shall make its plates and its dishes[a], and its pitchers and its bowls with which the drink offering is poured[b]; you shall make them of pure gold.
translation:
  language: sw
  text: Nawe utatengeneza sahani zake na vyombo vyake vidogo, mitungi yake na bakuli zake za kumiminia sadaka za kinywaji[a]. Utavifanya kwa dhahabu safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ambavyo humiminwa kwa hivyo.” Kishazi hiki kinaelekea kwa mitungi na bakuli zilizotajwa mwisho. Majina ya vyombo hivi viwili katika Kiebrania ni adimu, hivyo utambulisho wake kamili hauna uhakika.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: קְּעָרֹתָיו
  choice: sahani zake
  rationale: Neno קְעָרָה humaanisha chombo kipana na bapa; “sahani” linafaa katika muktadha wa meza na kulitofautisha na chombo kinachofuata.
- source_word: כַפֹּתָיו
  choice: vyombo vyake vidogo
  rationale: כַּף linaweza kumaanisha chombo kidogo chenye umbo kama kiganja. Tafsiri pana “vyombo vidogo” ni ya asili na haidai kwa uhakika umbo au matumizi ambayo maandishi hayabainishi.
- source_word: קְשׂוֹתָיו
  choice: mitungi yake
  rationale: Hili ni neno adimu la chombo cha ibada; muktadha wa kumimina kioevu unaunga mkono chombo cha kushikilia na kumimina, kwa hiyo “mitungi” ni tafsiri ya sasa na inayoeleweka.
- source_word: מְנַקִּיֹּתָיו
  choice: bakuli zake
  rationale: Neno hili hutaja vyombo vinavyohusishwa na huduma ya kumimina; “bakuli” ni neno la kawaida, huku kishazi kinachofuata kikieleza matumizi yake.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: ambazo zitatumiwa kumimina sadaka ya kinywaji
  rationale: Kitenzi נסך katika muktadha wa ibada hurejelea kumimina sadaka ya kinywaji. Muundo huu unawakilisha kauli tendwa ya Kiebrania na kuacha wazi ni vyombo gani katika jozi hiyo vinavyotumika moja kwa moja.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Hii ndiyo tafsiri sanifu na ya asili ya maelezo ya nyenzo katika maagizo ya hema takatifu.
- source_word: וְעָשִׂיתָ ... תַּעֲשֶׂה אֹתָם
  choice: Nawe utatengeneza ... Utavitengeneza
  rationale: Marudio ya kitenzi yamehifadhiwa ili kuonyesha kwanza agizo la kutengeneza vyombo na kisha sharti la nyenzo.
