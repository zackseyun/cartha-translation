  text: You shall make the poles of acacia wood and overlay them with gold[a], and by them the table shall be carried.
translation:
  language: sw
  text: Utatengeneza fito za mti wa mshita, na kuzifunika kwa dhahabu; meza itabebwa kwa hizo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Utatengeneza
  rationale: Katika muktadha huu wa maagizo, umbo hili lina nguvu ya amri; wakati ujao wa Kiswahili huwasilisha agizo hilo kwa lugha ya kawaida na yenye hadhi.
- source_word: הַבַּדִּים
  choice: miti ya kubebea
  rationale: Neno hili linamaanisha fito au miti inayotumiwa kubeba samani takatifu. 'Miti ya kubebea' ni wazi kwa msomaji wa sasa na huepuka neno la kizamani.
- source_word: עֲצֵי שִׁטִּים
  choice: kwa mbao za mshita
  rationale: Kirai cha Kiebrania kinataja nyenzo ya miti hiyo. 'Mbao za mshita' ni Kiswahili cha kawaida kwa acacia wood katika muktadha wa utengenezaji.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: na kuifunika kwa dhahabu
  rationale: Kitenzi kinamaanisha kufunika au kupaka kitu kwa tabaka la nyenzo; 'kuifunika kwa dhahabu' ni wazi na cha asili katika Kiswahili.
- source_word: וְנִשָּׂא בָם
  choice: meza itabebwa kwa miti hiyo
  rationale: Kitenzi kina maana ya kupasivu, 'itabebwa,' na kihusishi ב kinaonyesha kifaa au njia ya kubebea. 'Kwa miti hiyo' huhifadhi maana hiyo ya nyenzo.
- source_word: הַשֻּׁלְחָן
  choice: meza
  rationale: Inarejelea meza iliyoelezwa katika muktadha wa karibu; tafsiri rahisi haiingizi ufafanuzi usiotajwa moja kwa moja hapa.
