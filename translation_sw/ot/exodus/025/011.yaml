base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/011.yaml
  text: You shall overlay it with pure gold; from the inside and from the outside you shall overlay it[a], and you shall make on it a gold molding all around.
translation:
  language: sw
  text: Nawe utaifunika kwa dhahabu safi; utaifunika ndani na nje, na utatengeneza juu yake ukingo wa dhahabu[a] kuizunguka pande zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utepe wa dhahabu” au “mpaka wa dhahabu”; kijadi, “taji ya dhahabu.” Neno la Kiebrania זֵר linamaanisha ukingo wa mapambo unaozunguka kitu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ / תְּצַפֶּנּוּ
  choice: utaifunika
  rationale: Katika muktadha wa utengenezaji wa vifaa vya hema, kitenzi צפה humaanisha kufunika kitu kwa tabaka la chuma. “Kuifunika kwa dhahabu” ni Kiswahili cha kawaida kinachoeleza tendo hilo kwa usahihi.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Kirai hiki kinaonyesha dhahabu iliyosafishwa na isiyochanganywa; “dhahabu safi” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: מִבַּיִת וּמִחוּץ
  choice: ndani na nje
  rationale: Maneno haya yanataja sehemu ya ndani na sehemu ya nje ya sanduku. Muundo huu ni wa asili katika Kiswahili na unadumisha ulinganifu wa Kiebrania bila kulazimisha kihusishi kisicho cha kawaida.
- source_word: וְעָשִׂיתָ עָלָיו
  choice: utaifanyia
  rationale: Hapa עַל inaonyesha kwamba ukingo unatengenezwa juu ya au ukiwa umeambatanishwa na sanduku. “Utaifanyia” ni usemi wa asili unaoacha namna halisi ya kuambatanisha bila kuifafanua kupita chanzo.
- source_word: זֵר
  choice: ukingo
  rationale: Katika maelezo ya samani za hema, זֵר ni sehemu ya mapambo inayozunguka kitu. “Ukingo” unaeleweka kwa urahisi na huepuka picha potovu ya taji la kuvaliwa kichwani.
- source_word: סָבִיב
  choice: kuizunguka pande zote
  rationale: Neno hili linaonyesha kuzunguka kila upande. Kirai hiki cha Kiswahili kinahifadhi maana hiyo kamili kwa njia ya kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya “utaifunika” yamedumishwa kwa kuwa yapo katika Kiebrania na yanasisitiza kufunikwa kwa sehemu zote mbili. Alama ya tanbihi imewekwa baada ya “ukingo wa dhahabu,” ambako mbadala wa זֵר unahusika.
