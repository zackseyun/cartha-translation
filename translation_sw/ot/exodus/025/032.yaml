translation:
  language: sw
  text: 'Matawi sita yatatoka katika pande zake: matawi matatu ya kinara cha taa kutoka upande wake mmoja, na matawi matatu ya kinara cha taa kutoka upande wake wa pili.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִים
  choice: matawi
  rationale: Katika maelezo ya kinara cha taa, neno hili linamaanisha sehemu zinazochomoza kama matawi, si mianzi halisi. “Matawi” ni neno la kawaida linalohifadhi taswira ya umbo la mmea.
- source_word: יֹצְאִים
  choice: yatatoka
  rationale: Hueleza matawi yakianzia na kuchomoza katika pande za kinara. Wakati ujao unafaa katika muktadha huu wa maagizo ya kutengeneza.
- source_word: מִצִּדֶּיהָ
  choice: katika pande zake
  rationale: Huhifadhi wingi wa “pande” na kiambishi kinachorejelea kinara cha taa; usemi huu unaeleweka kwa kawaida katika Kiswahili.
- source_word: קְנֵי מְנֹרָה
  choice: matawi ya kinara cha taa
  rationale: Huweka wazi, kama Kiebrania, kwamba matawi hayo ni sehemu za kinara cha taa.
- source_word: מְנֹרָה
  choice: kinara cha taa
  rationale: Ni tafsiri wazi ya kifaa kinachoshikilia taa, badala ya kutumia jina la Kiebrania bila kulitafsiri.
- source_word: הָאֶחָד
  choice: upande wake mmoja
  rationale: Huhifadhi utofautishaji wa Kiebrania kati ya upande mmoja na upande wa pili, huku kiwakilishi “wake” kikirejelea kinara.
- source_word: הַשֵּׁנִי
  choice: upande wake wa pili
  rationale: “Wa pili” huakisi moja kwa moja namba ya mpangilio ya Kiebrania na kudumisha uwiano wa maelezo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye hadhi. Urudiaji wa “matawi matatu ya kinara cha taa yatatoka” umehifadhiwa kwa sababu unaakisi uwazi na ulinganifu wa maandishi ya Kiebrania. Tanbihi ya Kiingereza haikuhamishwa kwa kuwa inarudia maana ileile na maandishi ya Kiebrania hapa hayatoi tofauti halisi inayohitaji tanbihi.
