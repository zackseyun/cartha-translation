  to: Katika tawi moja kuwe na vikombe vitatu vyenye umbo la maua ya mlozi, pamoja na kinundu[a] na ua; na katika tawi moja kuwe na vikombe vitatu vyenye umbo la maua ya mlozi, pamoja na kinundu na ua. Hivyo ndivyo itakavyokuwa kwa matawi yote sita yanayotoka katika kinara cha taa[b].
