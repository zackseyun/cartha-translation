translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa maagizo umehifadhiwa, huku “tawi jingine” likitumika kwa ufasaha; urudiaji halisi wa Kiebrania umeonyeshwa katika tanbihi ili kutoficha uwezekano wa kisarufi.
