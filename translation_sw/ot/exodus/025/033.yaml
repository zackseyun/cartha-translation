base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/033.yaml
  text: three almond-blossom-shaped cups on the one branch[a], with bulb and flower, and three almond-blossom-shaped cups on the one branch, with bulb and flower[c][b]; so it shall be for the six branches coming out from the lampstand.
translation:
  language: sw
  text: Katika tawi moja kuwe na vikombe vitatu vyenye umbo la maua ya mlozi, pamoja na kinundu[a] na ua; na katika tawi moja kuwe na vikombe vitatu vyenye umbo la maua ya mlozi, pamoja na kinundu na ua. Hivyo ndivyo itakavyokuwa kwa matawi yote sita yanayotoka katika kinara cha taa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fundo.” Neno la Kiebrania linamaanisha pambo la mviringo lililochomoza.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania מְנֹרָה (menorah) limetafsiriwa hapa kuwa “kinara cha taa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: vikombe
  rationale: Neno hili hurejelea vyombo au maumbo kama vikombe. Katika maelezo ya mapambo ya kinara, “vikombe” linaeleza umbo hilo kwa usahihi na kwa lugha ya kawaida kuliko “mabakuli.”
- source_word: מְשֻׁקָּדִים
  choice: vyenye umbo la maua ya mlozi
  rationale: Katika muktadha huu neno linalotokana na שקד (“mlozi”) linaeleza nakshi ya vikombe. Tafsiri hii inaonyesha kwamba umbo linalokusudiwa ni la maua ya mlozi, si la kokwa pekee.
- source_word: קָּנֶה
  choice: tawi
  rationale: Hapa neno hilo lina maana ya sehemu inayochomoza kutoka kwenye mhimili wa kinara. “Tawi” ni la kawaida na linaafikiana na mapambo ya mimea yanayotajwa katika mstari huu.
- source_word: כַּפְתֹּר
  choice: kinundu
  rationale: Neno hili linaashiria sehemu ya pambo iliyovimba au iliyoviringika. “Kinundu” linaendeleza taswira ya umbo la mmea bila kulifanya kuwa ua lenyewe.
- source_word: פֶרַח / פָרַח
  choice: ua
  rationale: Neno hilo humaanisha ua au chipukizi la ua. “Ua” ni fupi, la kawaida, na huepuka kurudia maneno ya “maua ya mlozi” kupita kiasi.
- source_word: כֵּן
  choice: Hivyo ndivyo itakavyokuwa
  rationale: Kauli hii inaonyesha kwamba mpangilio uliotajwa utatumika vivyo hivyo kwa matawi yote sita na kuhifadhi nguvu ya maagizo ya Kiebrania.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: kwa matawi yote sita
  rationale: Kihusishi pamoja na nambari kinaonyesha kwamba mpangilio huu unahusu matawi sita kwa ujumla. “Yote” huweka wazi matumizi hayo bila kubadili maana.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: yanayotoka katika kinara cha taa
  rationale: Kirai hiki kinaonyesha matawi yakichomoza kutoka kwenye kinara. Tafsiri hiyo ni wazi na ya kawaida katika Kiswahili.
- source_word: מְנֹרָה
  choice: kinara cha taa
  rationale: Hili ni jina la kawaida la chombo cha kushikilia taa. Kutafsiri maana yake ni wazi zaidi kwa msomaji wa Kiswahili kuliko kutumia tu neno la mkopo “menora.”
