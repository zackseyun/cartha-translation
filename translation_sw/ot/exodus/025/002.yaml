  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
translation:
  language: sw
  text: “Waambie wana wa Israeli[c] waniletee sadaka[a]. Kutoka kwa kila mtu ambaye moyo wake unamsukuma[b], mtapokea sadaka yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mchango.” Neno la Kiebrania linamaanisha kitu kinachotengwa na kutolewa kwa matumizi matakatifu.
    reason: lexical_alternative
  - marker: b
    text: Au “ambaye moyo wake unamchochea” au “ambaye moyo wake unamfanya awe tayari.” Nahau ya Kiebrania inasisitiza utayari wa hiari unaotoka ndani.
    reason: lexical_alternative
  - marker: c
    text: Kwa Kiebrania, “wana wa Israeli,” jina la kawaida la agano kwa watu wa Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Waambie
  rationale: Kauli ya amri ya kitenzi דבר pamoja na אֶל ina maana ya kusema au kuwaambia watu fulani. “Waambie” ni ya kawaida na hudumisha nguvu ya agizo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi taswira ya kifamilia ya Kiebrania, “wana wa Israeli,” badala ya kuibadili moja kwa moja kuwa jina la kitaifa pekee.
- source_word: וְיִקְחוּ לִי
  choice: wanitwalie
  rationale: Huonyesha agizo linalofuata amri ya kusema na pia maana ya לִי, “kwa ajili yangu.” “Wanitwalie” ni usemi wenye hadhi unaofaa muktadha wa kitu kinacholetwa kwa Mungu.
- source_word: תְּרוּמָה
  choice: sadaka
  rationale: Katika muktadha wa ujenzi wa maskani, neno hili ni kitu kilichotengwa na kutolewa kwa matumizi matakatifu. “Sadaka” huonyesha uelekeo wake kwa Mungu bila kuifanya lazima iwe dhabihu ya kuteketezwa.
- source_word: מֵאֵת כָּל אִישׁ
  choice: kutoka kwa kila mtu
  rationale: אִישׁ hapa hutumika kwa maana ya mtu mmoja mmoja katika kusanyiko. “Kila mtu” ni Kiswahili cha kawaida na hakidai kwamba wanawake walitengwa na utoaji huu.
- source_word: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: ambaye moyo wake unamsukuma kutoa
  rationale: Huhifadhi nahau ya moyo kuwa chanzo cha msukumo wa ndani na huweka wazi, kwa Kiswahili cha kawaida, kwamba msukumo huo unaelekea katika kutoa kwa hiari.
- source_word: תִּקְחוּ אֶת תְּרוּמָתִי
  choice: Mtapokea sadaka yangu
  rationale: Nafsi ya pili wingi imehifadhiwa. “Mtapokea” ni ya asili zaidi katika Kiswahili kwa wanaosimamia ukusanyaji, huku “sadaka yangu” ikihifadhi kiambishi kinachoonyesha kuwa sadaka hiyo ni ya Mungu.
theological_decisions:
- issue: Maana ya תְּרוּמָה katika ukusanyaji wa vifaa vya maskani
  choice: sadaka
  alternative: mchango
  rationale: “Sadaka” hudumisha tabia takatifu na uelekeo wa kitu hicho kwa Mungu. “Mchango” ni mbadala sahihi unaosisitiza ukusanyaji na hiari, lakini peke yake unaweza kusikika kama mchango wa kawaida usio wa kidini.
- issue: Hiari katika nahau אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: moyo wake unamsukuma kutoa
  alternative: moyo wake unamfanya awe tayari
  rationale: Tafsiri iliyochaguliwa hudumisha picha ya moyo unaomsukuma mtu bila kugeuza mstari kuwa fundisho pana kuhusu aina zote za utoaji. Inaonyesha utayari wa ndani unaokusudiwa na nahau.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Wanitwalie” hudumisha ladha rasmi ya agizo la Mungu, huku “mtapokea” na “moyo wake unamsukuma kutoa” zikiwa wazi kwa wasomaji wa sasa. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
