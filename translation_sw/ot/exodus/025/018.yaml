base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/018.yaml
  text: And you shall make two cherubim of gold; of hammered work you shall make them[a], at the two ends of the mercy seat.
translation:
  language: sw
  text: Nawe utatengeneza makerubi wawili wa dhahabu; utawatengeneza kwa kufua kwa nyundo, kwenye ncha mbili za kifuniko cha upatanisho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiti cha rehema.” Neno la Kiebrania linamaanisha kifuniko cha sanduku, ambacho katika muktadha huu wa ibada kinahusishwa na upatanisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utatengeneza
  rationale: Kauli timilifu ya Qal yenye kiunganishi, katika muktadha wa maagizo, ina nguvu ya amri. Muundo huu unahifadhi mtiririko wa maagizo huku ukiwa wa kawaida katika Kiswahili.
- source_word: שְׁנַיִם כְּרֻבִים
  choice: makerubi wawili
  rationale: Neno la jadi la kibiblia “makerubi” linadumisha rejeo la viumbe hawa wa pekee bila kuwaweka katika kundi la kawaida la malaika; upatanisho wa ngeli unahitaji “wawili.”
- source_word: זָהָב
  choice: wa dhahabu
  rationale: Hueleza kitu walichotengenezwa nacho makerubi kwa Kiswahili cha kawaida na wazi.
- source_word: מִקְשָׁה
  choice: kwa kufua kwa nyundo
  rationale: Neno hili hueleza ufundi wa kuunda chuma kwa kukipiga kwa nyundo. Tafsiri hii haiongezi moja kwa moja wazo la “kipande kimoja,” ambalo linaweza kudokezwa na muktadha lakini si lazima liwekwe ndani ya neno lenyewe.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: utawatengeneza
  rationale: Kurudiwa kwa kitenzi katika Kiebrania kumehifadhiwa ili kusisitiza namna ya kuwatengeneza.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: kwenye ncha mbili za
  rationale: Hutoa uhusiano wa mahali au chanzo kwenye ncha za kifuniko bila kuamua kupita kiasi kama makerubi wamewekwa tu juu yake au wameundwa kutoka katika ncha zake.
- source_word: הַכַּפֹּרֶת
  choice: kifuniko cha upatanisho
  rationale: Neno hili linaitaja sehemu ya dhahabu iliyofunika sanduku na yenye uhusiano wa ibada na upatanisho. “Kifuniko cha upatanisho” ni wazi zaidi katika Kiswahili kuliko tafsiri ya kimapokeo “kiti cha rehema,” ambayo inaweza kudokeza kiti halisi.
theological_decisions:
- issue: Tafsiri ya הַכַּפֹּרֶת katika muktadha wa hema la ibada
  choice: kifuniko cha upatanisho
  alternative: kiti cha rehema; kifuniko
  rationale: Chaguo hili linabainisha kuwa kitu hicho ni kifuniko cha sanduku huku likidumisha uhusiano wake wa kiibada na upatanisho. Tanbihi inahifadhi istilahi ya kimapokeo bila kulazimisha picha ya kiti ambayo haiko wazi katika neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri na urudiaji wa kitenzi vimedumishwa; istilahi za kiibada zimewekwa wazi bila kuingiza msimamo wa dhehebu.
