  text: Their buds and their branches shall be of one piece with it[b][a], all of it a single hammered work of pure gold.
translation:
  language: sw
  text: Vitumba vyake na matawi yake vitatokana nalo[a]. Kinara lote liwe kazi moja ya dhahabu safi iliyofuliwa kwa nyundo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka nalo.” Maana yake ni kwamba vitumba na matawi yalipaswa kufanyizwa kutoka katika kinara lenyewe, wala si kuunganishwa nalo kama vipande tofauti.
    reason: lexical_alternative
  - marker: b
    text: Au, “iliyopigwa kwa nyundo.” Kiebrania kinakazia kwamba kinara lote lilikuwa kazi moja ya dhahabu safi iliyofuliwa kwa nyundo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: vitumba vyake
  rationale: Katika maelezo ya kinara, neno hili linamaanisha mapambo ya mviringo yenye umbo la mmea. “Vitumba” huhifadhi taswira hiyo vizuri kuliko “mafundo” au istilahi ya usanifu.
- source_word: וּקְנֹתָם
  choice: na matawi yake
  rationale: Ingawa קָנֶה kwa kawaida ni mwanzi au shina, hapa linataja mikono inayotokeza pembeni mwa kinara; “matawi” ni ya kawaida na inafaa taswira ya mmea.
- source_word: מִמֶּנָּה
  choice: vitatokana nalo
  rationale: Kirai hiki kinaonyesha kuwa vitumba na matawi yalifanyizwa kutoka katika kinara lenyewe, si kuunganishwa nalo baadaye.
- source_word: יִהְיוּ
  choice: vitatokana
  rationale: Kauli ya wakati ujao hapa ni agizo katika masharti ya kutengeneza kinara; muundo huu unaonyesha matokeo yanayotakiwa.
- source_word: כֻּלָּהּ
  choice: Kinara lote
  rationale: Kutaja “kinara” wazi kunafanya rejeo la kiwakilishi lieleweke katika Kiswahili huku “lote” likihifadhi msisitizo wa kitu kizima.
- source_word: מִקְשָׁה
  choice: kazi ... iliyofuliwa kwa nyundo
  rationale: Neno hili linaeleza kazi ya chuma iliyoundwa kwa kuipiga au kuifua kwa nyundo, badala ya kuunganisha sehemu tofauti.
- source_word: אַחַת
  choice: kazi moja
  rationale: “Moja” inasisitiza kwamba kinara kizima kilikuwa kazi iliyoungana.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Hili ndilo tamko la kawaida na wazi la Kiswahili kwa dhahabu isiyo na uchafu.
