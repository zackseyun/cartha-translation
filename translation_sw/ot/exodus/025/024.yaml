translation:
  language: sw
  text: Utaifunika kwa dhahabu safi, nawe utaifanyia ukingo wa dhahabu[a] pande zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pambo la dhahabu la ukingoni.” Neno la Kiebrania linaweza kumaanisha ukingo au pambo linalozunguka kitu; kwa desturi wengine hulitafsiri “taji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: Utaifunika
  rationale: Katika muktadha huu kitenzi צפה kinamaanisha kufunika kitu kwa tabaka la metali. “Utaifunika” ni Kiswahili cha kawaida na kinaeleweka kwa urahisi bila kupoteza wazo la kuipaka au kuizingira meza kwa dhahabu.
- source_word: אֹתוֹ
  choice: -i- (katika “Utaifunika”)
  rationale: Kiwakilishi cha yambwa kinarejelea meza iliyotajwa katika mstari uliotangulia; ngeli ya meza huhitaji kiambishi “i”.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Hili ndilo neno la kawaida na wazi la Kiswahili kwa dhahabu yenye usafi wa hali ya juu.
- source_word: וְעָשִׂיתָ
  choice: nawe utaifanyia
  rationale: Kitenzi עשה kimetafsiriwa kwa maana yake ya moja kwa moja, “kufanya”; muundo “utaifanyia” pia unaonyesha kwamba sehemu hiyo inatengenezwa kwa ajili ya meza.
- source_word: לּוֹ
  choice: -i-...-ia (katika “utaifanyia”)
  rationale: Kauli ya kutendea inaonyesha kwa kawaida kwamba ukingo unatengenezwa kwa ajili ya meza.
- source_word: זֵר
  choice: ukingo
  rationale: Katika maelekezo ya utengenezaji wa meza, זֵר inaonyesha sehemu ya pembeni inayozunguka, huenda ikiwa ya mapambo. “Ukingo” ni wazi na wa asili kwa Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana ya pambo la ukingoni.
- source_word: זָהָב
  choice: dhahabu
  rationale: Ni jina la moja kwa moja la metali inayotajwa.
- source_word: סָבִיב
  choice: kuizunguka pande zote
  rationale: Maneno haya yanaonyesha kuwa ukingo unaendelea kuizunguka meza kila upande, na hivyo kuhifadhi nguvu ya סָבִיב.
