  choice: Yahwe
  alternative: Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la herufi nne YHWH. “Yahwe” hulihifadhi kama jina binafsi badala ya kuweka cheo mahali pake; “Yehova” ni umbo jingine la jadi.
translation_notes:
