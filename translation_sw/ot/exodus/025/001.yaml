  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi fomula ya Kiebrania inayoanzisha maneno ya moja kwa moja, bila kuiunganisha kimya kimya na kitenzi kilichotangulia.
theological_decisions:
