base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/017.yaml
  text: And you shall make a mercy seat of pure gold; its length shall be two cubits and a half[a], and its width a cubit and a half.
translation:
  language: sw
  text: “Utengeneze kifuniko cha upatanisho[a] cha dhahabu safi. Urefu wake uwe dhiraa mbili na nusu, na upana wake dhiraa moja na nusu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiti cha rehema.” Neno la Kiebrania כַּפֹּרֶת linataja kifuniko cha dhahabu kilichowekwa juu ya sanduku, nalo linahusiana na mzizi כפר, unaohusu kufanya upatanisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Utengeneze
  rationale: Katika muktadha wa maagizo ya kutengeneza Maskani, kitenzi hiki kina nguvu ya agizo. ‘Utengeneze’ ni Kiswahili cha kawaida na cha heshima kinachowasilisha agizo hilo moja kwa moja.
- source_word: כַפֹּרֶת
  choice: kifuniko cha upatanisho
  rationale: Neno hili linataja kifuniko maalumu cha dhahabu kilichowekwa juu ya sanduku, nalo linahusiana na mzizi כפר unaohusu kufanya upatanisho. ‘Kifuniko cha upatanisho’ hutambulisha kitu chenyewe kwa uwazi kuliko ‘kiti cha rehema,’ bila kuficha maana yake ya kiibada.
- source_word: זָהָב טָהוֹר
  choice: kwa dhahabu safi
  rationale: Kauli hii inaonyesha nyenzo na ubora wake. Kiswahili ‘kwa dhahabu safi’ ni cha asili katika maagizo ya utengenezaji na kinahifadhi vipengele vyote viwili.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dhiraa mbili na nusu
  rationale: Kipimo cha kale kimehifadhiwa bila kugeuzwa kuwa kipimo cha kisasa, na mpangilio huu ni wa kawaida katika Kiswahili.
- source_word: אָרְכָּהּ
  choice: Urefu wake uwe
  rationale: Kiambishi cha nafsi kinarejelea kifuniko. ‘Urefu wake uwe’ huifanya sentensi ya kipimo iwe kamili na ya kawaida katika Kiswahili.
- source_word: וְאַמָּה וָחֵצִי
  choice: na ... dhiraa moja na nusu
  rationale: Tafsiri hii inahifadhi kipimo halisi na usambamba wake na kipimo cha urefu.
- source_word: רָחְבָּהּ
  choice: upana wake
  rationale: Kauli hii inawasilisha kwa ufupi nomino pamoja na kiambishi chake kinachorejelea kifuniko.
theological_decisions:
- issue: Tafsiri ya כַפֹּרֶת, neno lenye maana maalumu ya kiibada
  choice: kifuniko cha upatanisho
  alternative: kiti cha rehema; kifuniko
  rationale: Kitu kinachotajwa ni kifuniko cha dhahabu cha sanduku, na neno lake linahusiana na upatanisho. Tafsiri kuu inaonyesha umbo na kazi yake ya kiibada bila kulifanya kuwa kifuniko cha kawaida tu. Tafsiri ya jadi ‘kiti cha rehema’ imetajwa katika tanbihi ili kuhifadhi istilahi inayojulikana na kuonyesha uzito wa kitheolojia wa neno hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Vipimo vya kale vimehifadhiwa kama ‘dhiraa,’ na sentensi fupi zimechaguliwa ili maagizo yawe wazi.
