  yaml_path: translation/ot/exodus/025/015.yaml
  text: The poles shall remain in the rings of the ark[a]; they shall not be removed from it.
translation:
  language: sw
  text: Miti ya kubebea itabaki katika pete za Sanduku[a]; haitaondolewa katika Sanduku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Miti ya kubebea itakuwa katika pete za Sanduku; haitaondolewa katika Sanduku.”
    reason: Huhifadhi maana ya karibu ya יִהְיוּ, “itakuwa,” badala ya kusisitiza hali ya kuendelea kwa “itabaki.”
lexical_decisions:
- source_word: בְּטַבְּעֹת
  choice: katika pete
  rationale: Kihusishi בְ pamoja na טַבָּעֹת kinaonyesha mahali miti ilipowekwa, yaani ndani ya pete zilizofungwa kwenye Sanduku.
- source_word: הָאָרֹן
  choice: Sanduku
  rationale: Katika muktadha wa Maskani, אָרוֹן ni Sanduku takatifu; herufi kubwa hutofautisha jina hili la kiibada na sanduku la kawaida.
- source_word: יִהְיוּ
  choice: itabaki
  rationale: Ingawa היה kimsingi humaanisha ‘kuwa,’ hapa inaonyesha hali ya kudumu, inayothibitishwa na katazo linalofuata la kutoitoa miti.
- source_word: הַבַּדִּים
  choice: miti ya kubebea
  rationale: בַּדִּים ni miti iliyotumiwa kulibebea Sanduku; ‘miti ya kubebea’ ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: לֹא יָסֻרוּ
  choice: haitatolewa
  rationale: סוּר inaweza kumaanisha kuondoka au kuondolewa; katika muktadha huu kauli ya kutendwa inaeleza katazo la mtu kuiondoa miti.
- source_word: מִמֶּנּוּ
  choice: humo
  rationale: Kiwakilishi kinarejelea Sanduku, na ‘humo’ kwa kawaida hurejelea mahali miti ilimo, yaani katika pete zake, bila kurudia jina.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Miti ya kubebea’ ni ya kueleweka zaidi kuliko istilahi za kale, huku ‘Sanduku’ likitumiwa kama jina la chombo hiki kitakatifu.
