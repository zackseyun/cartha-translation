translation:
  language: sw
  text: Nawe utaingiza miti hiyo katika pete zilizo kwenye pande za Sanduku, ili kulibeba Sanduku kwa miti hiyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֵֽבֵאתָ
  choice: Nawe utaitia
  rationale: Kitenzi בוא kwa msingi wake ni ‘kuleta/kuja,’ lakini katika muundo huu kinaeleza kuweka miti ndani ya pete; ‘utaitia’ ni Kiswahili cha kawaida na huonyesha kitendo hicho kwa uwazi.
- source_word: הַ/בַּדִּים
  choice: hiyo miti
  rationale: בדים ni miti mirefu ya kubebea samani takatifu. ‘Miti’ ni neno la kawaida na linaloeleweka katika muktadha huu, huku kiwakilishi ‘hiyo’ kikirejelea miti iliyotajwa awali.
- source_word: בַּ/טַּבָּעֹת
  choice: kwenye pete
  rationale: Kihusishi hapa huonyesha kuingiza au kuweka miti ndani ya pete; ‘kwenye pete’ ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo katika muktadha.
- source_word: עַל צַלְעֹת הָ/אָרֹן
  choice: zilizo pande za Sanduku
  rationale: צלעות hapa humaanisha pande au sehemu za pembeni; ‘pande za Sanduku’ ni ya asili, wazi, na sahihi.
- source_word: הָ/אָרֹן
  choice: Sanduku
  rationale: Ingawa ארון linaweza kumaanisha sanduku kwa jumla, hapa ni kile chombo kitakatifu cha hema; herufi kubwa hutambulisha kitu hicho maalumu bila kuongeza jina lisilokuwamo katika mstari.
- source_word: לָ/שֵׂאת
  choice: ili kulibeba
  rationale: נשא hapa ni kubeba kitu kimwili. ‘Kulibeba’ ni Kiswahili cha sasa na huonyesha wazi kuwa Sanduku ndilo linalobebwa.
- source_word: בָּ/הֶם
  choice: kwa miti hiyo
  rationale: Kiwakilishi kinarejelea miti kama njia ya kubebea Sanduku. Kurudia ‘miti hiyo’ huondoa utata unaoweza kutokana na ‘kwa hiyo’ au ‘kwao’.
