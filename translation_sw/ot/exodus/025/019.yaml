base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/019.yaml
  text: Make one cherub on one end and one cherub on the other end[a]; from the mercy seat you shall make the cherubim on its two ends.
translation:
  language: sw
  text: Tengeneza kerubi mmoja kwenye ncha moja na kerubi mwingine kwenye ncha nyingine; hao makerubi mtawatengeneza kutokana na kiti cha rehema, kwenye ncha zake mbili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi, “Mtengeneze makerubi yakiwa kitu kimoja na kiti cha rehema, kwenye ncha zake mbili.” Kihusishi cha Kiebrania kinacholeta maana ya “kutokana na” kinaonyesha kwamba makerubi yalipaswa kuumbwa kutoka katika kiti cha rehema chenyewe, wala si kutengenezwa kando na kisha kuunganishwa nacho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Tengeneza
  rationale: Kitenzi hiki kina nguvu ya amri katika mfululizo wa maagizo; kiunganishi cha Kiebrania hakihitajiki hapa katika Kiswahili cha kawaida.
- source_word: כְּרוּב ... וּכְרוּב
  choice: kerubi ... kerubi
  rationale: Maumbo ya umoja yanamtaja kila kiumbe mmoja mmoja; “kerubi” ni istilahi ya kawaida ya Kibiblia katika Kiswahili.
- source_word: אֶחָד
  choice: mmoja ... mwingine
  rationale: “Mmoja” huhifadhi hesabu, huku “mwingine” ikionyesha kwa Kiswahili cha kawaida ulinganifu kati ya ncha moja na ncha ya pili.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: kwenye ncha moja ... kwenye ncha nyingine
  rationale: Ingawa muundo wa Kiebrania una kihusishi מִן, katika vifungu hivi unaonyesha mahali; tafsiri hii ni ya asili na hudumisha ulinganifu wa maagizo.
- source_word: מִן הַכַּפֹּרֶת
  choice: kutokana na kiti cha rehema
  rationale: Hapa מִן inaonyesha chanzo au kitu kilichotumiwa kutengenezea, yaani makerubi yaumbwe kutoka katika kiti chenyewe. “Kiti cha rehema” huhifadhi istilahi ya kitamaduni na maana yake ya kiibada katika muktadha huu.
- source_word: תַּעֲשׂוּ
  choice: mtawatengeneza
  rationale: Nafsi ya pili wingi inaelekezwa kwa watakaofanya kazi; wakati ujao hutumika kwa kawaida kama agizo katika Kiswahili.
- source_word: הַכְּרֻבִים
  choice: hao makerubi
  rationale: Wingi wa “kerubi” ni “makerubi”; kiashiria “hao” kinawarejelea wale wawili waliotajwa tayari.
- source_word: עַל שְׁנֵי קְצוֹתָיו
  choice: kwenye ncha zake mbili
  rationale: Hutoa mahali pa makerubi, na kiambishi cha umilikaji kinarejelea kiti cha rehema.
theological_decisions:
- issue: Maana ya כַּפֹּרֶת
  choice: kiti cha rehema
  alternative: kifuniko
  rationale: Neno hilo ni kifuniko cha Sanduku lakini pia ni istilahi maalumu ya mahali pa upatanisho katika hema takatifu. Tafsiri “kiti cha rehema” hudumisha istilahi hiyo bila kuficha kwamba makerubi yalitokana na kitu hicho chenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa maagizo ulio wazi, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Istilahi za Kibiblia “kerubi/makerubi” na “kiti cha rehema” zimetumiwa kwa uthabiti.
