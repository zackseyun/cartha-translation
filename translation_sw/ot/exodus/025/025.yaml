translation:
  language: sw
  text: Nawe utaitengenezea ukingo unaoizunguka, wenye upana wa kiganja,[a] nawe utatengeneza mpambizo wa dhahabu kuzunguka ukingo wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiganja kilikuwa kipimo cha kale, yaani upana wa mkono.
    reason: cultural_measurement
  - marker: b
    text: Au, “taji ya dhahabu.” Neno la Kiebrania זֵר linaweza kumaanisha mpambizo au ukingo wa pambo; “taji” ni tafsiri ya jadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: ukingo
  rationale: Neno hili linamaanisha sehemu ya pembeni inayounda au kuimarisha fremu ya meza. ‘Ukingo’ ni neno la kawaida na la asili katika Kiswahili kwa sehemu kama hiyo bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: טֹפַח
  choice: upana wa kiganja
  rationale: Hiki ni kipimo cha kale kinacholingana na upana wa kiganja. Kutaja ‘upana’ huonyesha wazi kuwa hapa kipimo kinaeleza ukubwa wa ukingo.
- source_word: סָבִיב
  choice: unaoizunguka / kuzunguka
  rationale: Neno limetafsiriwa katika sehemu zote mbili ili kuhifadhi wazo linalorudiwa la kitu kuenea pande zote.
- source_word: זֵר
  choice: utepe
  rationale: Katika maelezo ya vyombo vya maskani, neno hili linaweza kumaanisha pambo la ukingoni lililoinuka au linalozunguka kitu. ‘Utepe’ unaeleweka kama kipande cha pambo kinachozunguka ukingo, huku maana ya jadi ‘taji’ ikihifadhiwa katika tanbihi.
- source_word: זָהָב
  choice: dhahabu
  rationale: Jina la kitu limetafsiriwa moja kwa moja ili kuonyesha nyenzo iliyotumiwa.
- source_word: לּוֹ / לְמִסְגַּרְתּוֹ
  choice: utaitengenezea / ukingo wake
  rationale: Viwakilishi vinarejelea meza iliyotajwa katika muktadha; kuvihifadhi huepusha kurudia ‘meza’ bila sababu.
- source_word: וְעָשִׂיתָ
  choice: Nawe utaitengenezea / nawe utatengeneza
  rationale: Muundo huu huhifadhi mwendelezo wa maagizo na nguvu yake ya kuelekeza, kwa lugha ya Kiswahili yenye hadhi na inayosomeka vizuri.
