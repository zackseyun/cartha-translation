lexical_decisions:
- source_word: שֶׁמֶן
  choice: mafuta
  rationale: Neno la Kiebrania linamaanisha mafuta kwa ujumla. Ingawa katika muktadha huu kwa kawaida yalikuwa mafuta ya zeituni, mstari huu hautaji zeituni waziwazi.
- source_word: לַמָּאֹר
  choice: kwa ajili ya mwanga
  rationale: Hueleza kusudi la mafuta kama ya kutoa mwanga; tafsiri hii inadumisha usemi mfupi wa Kiebrania bila kuufanya taa yenyewe kuwa maana pekee.
- source_word: בְּשָׂמִים
  choice: viungo vya kunukia
  rationale: Hurejelea vitu vya harufu nzuri vilivyotumiwa kutengeneza mafuta matakatifu na uvumba; usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa.
- source_word: לְשֶׁמֶן הַמִּשְׁחָה
  choice: kwa ajili ya mafuta ya upako
  rationale: Muundo huu unaonyesha kusudi la viungo hivyo, yaani kutengeneza mafuta maalumu yaliyotumiwa kupaka.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Katika muktadha wa maskani, neno hili humaanisha uvumba unaoteketezwa, si moshi au uchomaji kwa ujumla.
- source_word: הַסַּמִּים
  choice: wa viungo vya kunukia
  rationale: Tafsiri hii inafuata kwa karibu muundo wa Kiebrania, ‘uvumba wa vitu vya kunukia,’ na haibadili kimya uhusiano huo kuwa kivumishi tu.
