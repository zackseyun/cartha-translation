  text: And on the lampstand there shall be four cups made like almond blossoms[b][a], with its buds and its flowers.
translation:
  language: sw
  text: Na kwenye kinara cha taa kutakuwa na vikombe vinne vyenye umbo la maua ya mlozi[a], pamoja na vifundo[b] vyake na maua yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vilivyopambwa kwa maua ya mlozi.” Kiebrania kinaeleza vikombe kwa mfano wa mlozi, na huenda kikasisitiza umbo au mapambo yake.
    reason: lexical_alternative
  - marker: b
    text: Au “machipukizi yake.” Neno la Kiebrania linataja sehemu ya pambo yenye umbo la mviringo kwenye kinara cha taa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: Na kwenye kinara cha taa
  rationale: Kiunganishi na kihusishi vinatafsiriwa kwa mtiririko wa kawaida kama “Na kwenye.” מְנֹרָה ni kinara cha taa, si taa moja tu.
- source_word: אַרְבָּעָה
  choice: vinne
  rationale: Ni nambari ya kawaida inayopatana kisarufi na “vikombe.”
- source_word: גְבִעִים
  choice: vikombe
  rationale: Neno hilo hutaja maumbo kama bakuli au vikombe; “vikombe” ni wazi na linafaa katika maelezo ya mapambo ya kinara.
- source_word: מְשֻׁקָּדִים
  choice: vyenye umbo la maua ya mlozi
  rationale: Neno linalotokana na mzizi unaohusiana na mlozi linaeleza muundo wa vikombe. Tafsiri hii inaonyesha picha ya maua ya mlozi bila kudai kwa uhakika kama kinachosisitizwa ni umbo pekee au mapambo.
- source_word: כַּפְתֹּרֶיהָ
  choice: vifundo vyake
  rationale: כפתר hurejelea sehemu za mapambo zilizoviringika au zilizochomoza. “Vifundo” huhifadhi maana hiyo bila kuvifanya moja kwa moja kuwa machipukizi ya mmea.
- source_word: וּפְרָחֶיהָ
  choice: na maua yake
  rationale: פֶּרַח humaanisha ua au chanuo; “maua” ni neno la kawaida, wazi, na linalofaa hapa.
