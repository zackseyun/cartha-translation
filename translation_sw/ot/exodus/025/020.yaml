  text: וְ/הָי֣וּ הַ/כְּרֻבִים֩ פֹּרְשֵׂ֨י כְנָפַ֜יִם לְ/מַ֗עְלָ/ה סֹכְכִ֤ים בְּ/כַנְפֵי/הֶם֙ עַל הַ/כַּפֹּ֔רֶת וּ/פְנֵי/הֶ֖ם אִ֣ישׁ אֶל אָחִ֑י/ו אֶל הַ/כַּפֹּ֔רֶת יִהְי֖וּ פְּנֵ֥י הַ/כְּרֻבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/020.yaml
  text: And the cherubim shall spread out their wings upward[a], overshadowing the mercy seat with their wings, and their faces shall be one toward another; the faces of the cherubim shall be toward the mercy seat.
translation:
  language: sw
  text: Nao makerubi watanyoosha mabawa yao kuelekea juu, wakikisitiri kifuniko cha upatanisho[a] kwa mabawa yao. Nyuso zao zitaelekeana, nazo nyuso za makerubi zitaelekea kifuniko cha upatanisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiti cha rehema.” Neno la Kiebrania linamaanisha kifuniko cha dhahabu cha sanduku.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Nao ... wata-
  rationale: Katika muktadha wa maagizo ya kutengeneza maskani, umbo hili lina nguvu ya maelekezo kuhusu jinsi makerubi watakavyokuwa; wakati ujao wa Kiswahili unatoa maana hiyo kwa kawaida.
- source_word: הַכְּרֻבִים
  choice: makerubi
  rationale: Hili ni umbo la kawaida la Kiswahili kwa viumbe hawa wa mbinguni, likihifadhi istilahi ya kimapokeo bila kuwafanya wawe malaika wa aina fulani isiyotajwa.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: watanyoosha mabawa yao kuelekea juu
  rationale: Linawasilisha mkao hai wa mabawa yaliyotandazwa na mwelekeo wake wa kwenda juu.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: wakikisitiri ... kwa mabawa yao
  rationale: ‘Kisitiri’ huhifadhi wazo la kufunika kutoka juu kwa mabawa, huku ‘kwa mabawa yao’ kikionyesha chombo kinachotumika.
- source_word: הַכַּפֹּרֶת
  choice: kifuniko cha upatanisho
  rationale: Neno hili hutaja kifuniko cha dhahabu cha sanduku chenye kazi ya ibada inayohusiana na upatanisho. Tafsiri hii inaeleweka moja kwa moja kuliko istilahi ya kimapokeo ‘kiti cha rehema’ na haidokezi kuwa kitu hicho ni kiti halisi.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: Nyuso zao zitaelekeana
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya nahau ya mgawanyo ‘kila mmoja kumwelekea mwenzake,’ ikihifadhi maana ya makerubi kukabiliana uso kwa uso.
- source_word: אֶל הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  choice: nyuso za makerubi zitaelekea kifuniko cha upatanisho
  rationale: Inahifadhi kutajwa kwa nyuso na kufafanua mwelekeo wao kuelekea kifuniko, kama ilivyo katika Kiebrania.
theological_decisions:
- issue: Tafsiri ya כַּפֹּרֶת katika maagizo ya maskani
  choice: kifuniko cha upatanisho
  alternative: kiti cha rehema; kifuniko
  rationale: ‘Kifuniko cha upatanisho’ hutambulisha kitu halisi kama kifuniko cha sanduku na pia huhifadhi uhusiano wake wa kiibada na upatanisho. ‘Kiti cha rehema’ ni istilahi ya kimapokeo lakini inaweza kueleweka kimakosa kuwa kiti; ‘kifuniko’ pekee huacha nje umuhimu wake wa kiibada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa mara mbili ili picha ya mabawa na mwelekeo wa nyuso iwe wazi bila kuondoa urudiaji wa Kiebrania.
