  yaml_path: translation/ot/exodus/025/010.yaml
  text: They shall make an ark of acacia wood[a], two and a half cubits its length, a cubit and a half its width[c][b], and a cubit and a half its height.
translation:
  language: sw
  text: Nao watatengeneza sanduku[a] la mbao za mshita[b]. Urefu wake utakuwa dhiraa mbili na nusu, upana wake dhiraa moja na nusu, na kimo chake dhiraa moja na nusu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kasha.” Neno la Kiebrania humaanisha chombo cha kuhifadhia; hapa ni sanduku takatifu ambalo katika muktadha mpana linahusishwa na agano.
    reason: lexical_alternative
  - marker: b
    text: Kwa mapokeo, mbao hizi pia huitwa “mbao za shitimu.”
    reason: lexical_alternative
  - marker: c
    text: Dhiraa ilikuwa kipimo cha kale cha urefu, takriban umbali kutoka kiwiko hadi ncha za vidole.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Nao watatengeneza
  rationale: Katika muktadha huu wa maagizo, umbo hili lina nguvu ya amri ya wakati ujao. Kiunganishi cha mwanzo kimewakilishwa kwa “Nao” ili kudumisha mwendelezo wa maelekezo kwa Kiswahili cha kawaida.
- source_word: אֲרוֹן
  choice: sanduku
  rationale: Neno la Kiebrania humaanisha chombo kama sanduku. “Sanduku” ni la asili na wazi kwa wasomaji wa Kiswahili; muktadha unaonyesha kuwa ni sanduku takatifu linalohusishwa na agano.
- source_word: עֲצֵי שִׁטִּים
  choice: mbao za mshita
  rationale: Hili linataja nyenzo iliyotokana na mti wa mshita. “Mbao za mshita” ni Kiswahili cha kawaida na huepuka tafsiri isiyoeleweka ya jina la Kiebrania.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dhiraa mbili na nusu
  rationale: Kipimo cha kale kimehifadhiwa bila kugeuzwa kuwa kipimo cha kisasa, na idadi imetolewa kwa mpangilio wa asili wa Kiswahili.
- source_word: אָרְכּוֹ
  choice: urefu wake
  rationale: Kiambishi cha nafsi ya tatu umoja kinarejelea sanduku; “urefu wake” ni sahihi na ya kawaida.
- source_word: וְאַמָּה וָחֵצִי
  choice: dhiraa moja na nusu
  rationale: Huwakilisha kwa uwazi muundo wa dhiraa moja pamoja na nusu katika Kiswahili cha sasa.
- source_word: רָחְבּוֹ
  choice: upana wake
  rationale: “Upana” ndilo neno la kawaida la Kiswahili kwa kipimo hiki cha kitu.
- source_word: קֹמָתוֹ
  choice: kimo chake
  rationale: Kwa kitu kinachoelezwa kwa vipimo, “kimo” hutoa kwa kawaida maana ya kipimo chake cha kwenda juu.
theological_decisions:
- issue: Utambulisho wa אֲרוֹן kama chombo kitakatifu
  choice: sanduku
  alternative: Sanduku la Agano
  rationale: Aya yenyewe husema tu אֲרוֹן, ‘sanduku’; kuongeza “la Agano” katika matini kungeliweka wazi jambo linalotokana na muktadha mpana, si maneno ya aya hii. Tanbihi inaeleza matumizi yake matakatifu bila kuongeza maneno katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Vipimo vimepangwa katika sentensi za Kiswahili zilizo wazi, na kipimo cha kale “dhiraa” kimehifadhiwa pamoja na tanbihi ya ufafanuzi.
