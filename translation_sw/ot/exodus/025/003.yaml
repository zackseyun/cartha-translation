  text: 'And this is the contribution that you shall take from them: gold[a], silver, and bronze.'
translation:
  language: sw
  text: 'Na hii ndiyo sadaka mtakayochukua kutoka kwao: dhahabu, fedha, na shaba[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shaba ya bati”; neno la Kiebrania נְחֹשֶׁת linaweza kumaanisha shaba au aloi ya shaba, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Na hii ndiyo
  rationale: Kiunganishi ו pamoja na kiwakilishi זאת kinatanguliza orodha inayofuata; usemi huu ni wa kawaida na unahifadhi nguvu ya utambulisho katika Kiebrania.
- source_word: הַ/תְּרוּמָה
  choice: sadaka
  rationale: תְּרוּמָה hapa ni kitu kinachotengwa na kutolewa kwa matumizi matakatifu. Katika muktadha huu, “sadaka” ni neno la Kiswahili linaloeleweka kwa urahisi kwa vitu vinavyotolewa kwa ajili ya hema takatifu, bila kulazimisha namna maalumu ya ibada.
- source_word: אֲשֶׁר תִּקְח֖וּ מֵ/אִתָּם
  choice: mtakayochukua kutoka kwao
  rationale: Kitenzi לקח ni nafsi ya pili wingi na kina nguvu ya agizo; “mtakayochukua” kinahifadhi uhusiano wa sentensi na maana ya msingi ya kuchukua, huku מֵאִתָּם ikitafsiriwa moja kwa moja “kutoka kwao.”
- source_word: זָהָב
  choice: dhahabu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa metali hii.
- source_word: וָ/כֶסֶף
  choice: fedha
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa metali ya silver katika orodha ya vifaa.
- source_word: וּ/נְחֹשֶׁת
  choice: shaba
  rationale: נְחֹשֶׁת linaweza kumaanisha copper au bronze kulingana na muktadha. “Shaba” ni neno pana na la kawaida katika Kiswahili kwa metali hii, lakini tofauti ya aloi imehifadhiwa katika tanbihi.
