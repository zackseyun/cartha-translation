lexical_decisions:
- source_word: תְּכֵלֶת
  choice: uzi wa buluu
  rationale: Neno hili linamaanisha kitambaa au uzi uliotiwa rangi ya buluu yenye mwelekeo wa zambarau. Katika orodha hii ya vifaa vya Hema la Kukutania, “uzi wa buluu” ni wazi na wa kawaida, huku tanbihi ikihifadhi uwezekano wa “buluu-zambarau.”
- source_word: אַרְגָּמָן
  choice: wa zambarau
  rationale: Neno hili hutaja nyenzo ya thamani iliyotiwa rangi ya zambarau. Kurudia “wa” kunaunganisha kwa kawaida na “uzi” bila kulazimika kurudia nomino nzima.
- source_word: תוֹלַעַת שָׁנִי
  choice: mwekundu
  rationale: Kirai hiki hutaja rangi nyekundu iliyotokana na wadudu na, kwa muktadha, uzi au nyenzo iliyotiwa rangi hiyo. “Uzi ... mwekundu” huwasilisha maana iliyokusudiwa kwa Kiswahili cha kawaida bila kutumia tafsiri ya kizoolojia isiyo ya kawaida.
- source_word: שֵׁשׁ
  choice: kitani safi
  rationale: Katika muktadha wa vifaa vya Hema la Kukutania, neno hili linamaanisha kitani bora au laini. “Kitani safi” ni istilahi inayoeleweka na iliyozoeleka katika sajili ya kibiblia ya Kiswahili.
- source_word: עִזִּים
  choice: manyoya ya mbuzi
  rationale: Kiebrania kinasema kihalisi “mbuzi,” lakini katika orodha ya vifaa kinachokusudiwa ni manyoya yao yaliyotumiwa kutengeneza vitambaa vya kufunika. Tafsiri hii inaweka wazi maana ya kimuktadha.
