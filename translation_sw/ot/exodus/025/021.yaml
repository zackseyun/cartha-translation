base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/021.yaml
  text: And you shall put the mercy seat on top of the ark[a], and into the ark you shall put the testimony that I will give you.
translation:
  language: sw
  text: Utaweka kifuniko cha upatanisho[a] juu ya Sanduku, na ndani ya Sanduku utaweka ushuhuda ambao nitakupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiti cha rehema.” Neno la Kiebrania linataja kifuniko cha Sanduku na lina uhusiano na ibada ya upatanisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֹּרֶת
  choice: kifuniko cha upatanisho
  rationale: Neno hili linataja kifuniko cha Sanduku na pia lina uhusiano na ibada ya upatanisho. Tafsiri hii inaonyesha kazi yake halisi na maana yake ya kiibada bila kulazimisha ufafanuzi mpana zaidi.
- source_word: מִלְמָעְלָה
  choice: juu ya
  rationale: Katika muktadha huu kifuniko kinawekwa moja kwa moja juu ya Sanduku; ‘juu ya’ ni ya kawaida na sahihi kuliko usemi unaoweza kudokeza kuwa kilining’inia juu yake.
- source_word: עֵדֻת
  choice: ushuhuda
  rationale: Hii inahifadhi kwa ukaribu maana ya Kiebrania ya ushahidi wenye uhusiano na agano bila kuongeza hapa kwamba ni vibao, jambo ambalo halijasemwa wazi katika mstari huu.
- source_word: נָתַתָּ / תִּתֵּן / אֶתֵּן
  choice: utaweka / utaweka / nitakupa
  rationale: ‘Kuweka’ linafaa kwa kuwekwa kwa vitu vya hema, ilhali ‘kupa’ linaonyesha kwa kawaida tendo la Mungu la kumkabidhi Musa ushuhuda.
- source_word: אֶל הָאָרֹן
  choice: ndani ya Sanduku
  rationale: Ingawa kihusishi kinaweza kumaanisha ‘kwenda kwa,’ kitenzi na kitu kinachowekwa vinaonyesha wazi kwamba ushuhuda unaingizwa ndani ya Sanduku.
theological_decisions:
- issue: Tafsiri ya כַּפֹּרֶת katika muktadha wa ibada na upatanisho
  choice: kifuniko cha upatanisho
  alternative: kiti cha rehema
  rationale: Neno la Kiebrania linataja kifuniko cha Sanduku, ambacho katika ibada ya Israeli kilihusishwa na upatanisho na mahali pa kukutana na Mungu. ‘Kifuniko cha upatanisho’ kinaweka wazi kwamba ni kifuniko huku kikihifadhi uhusiano wake wa kiibada. Tafsiri ya kimapokeo ‘kiti cha rehema’ imetolewa katika tanbihi ili kudumisha uwazi bila kuifanya ionekane kwamba kitu hicho kilikuwa kiti halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wazi na wa kisasa. ‘Sanduku’ limeandikwa kwa herufi kubwa kwa sababu linataja Sanduku maalumu la agano katika muktadha huu; ‘ushuhuda’ limeachwa bila ufafanuzi wa ziada ili kuhifadhi kiwango cha ubainifu cha Kiebrania.
