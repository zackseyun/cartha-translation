  text: וְ/עָ֥שׂוּ לִ֖/י מִקְדָּ֑שׁ וְ/שָׁכַנְתִּ֖י בְּ/תוֹכָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/008.yaml
  text: And let them make a sanctuary for me[a], so that I may dwell among them.
translation:
  language: sw
  text: Nao wanitengenezee mahali patakatifu, nami nitakaa katikati yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “katikati yao.” Hii inasisitiza kwamba Mungu atakaa miongoni mwa watu, si ndani ya jengo hilo tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Nao wanitengenezee
  rationale: Katika muktadha huu wa maagizo, umbo hili lina nguvu ya agizo kwa nafsi ya tatu wingi. ‘Wanitengenezee’ ni Kiswahili cha kawaida kinachohifadhi maana ya wao kufanya kitu kwa ajili ya Mungu.
- source_word: לִי
  choice: -ni- katika ‘wanitengenezee’
  rationale: Kiambishi cha yambwa ‘-ni-’ pamoja na kauli tendewa ya manufaa ‘-tengenezee’ huonyesha kwa ufasaha kwamba mahali hapo panatengenezwa kwa ajili ya Mungu.
- source_word: מִקְדָּשׁ
  choice: mahali patakatifu
  rationale: Neno hili humaanisha mahali palipotengwa kuwa patakatifu kwa uwepo wa Mungu. ‘Mahali patakatifu’ ni wazi na la kawaida katika Kiswahili, bila kulifanya neno lirejelee jengo pekee.
- source_word: וְשָׁכַנְתִּי
  choice: nami nitakaa
  rationale: Kitenzi שׁכן humaanisha kukaa au kufanya makao. ‘Nitakaa’ huhifadhi kauli ya moja kwa moja ya Mungu na uhusiano wake na agizo lililotangulia bila kulazimisha maana ya kusudi pekee.
- source_word: בְּתוֹכָם
  choice: katikati yao
  rationale: 'Hii inawakilisha kwa karibu usemi wa Kiebrania na kuhifadhi kiambishi cha wingi: Mungu anakaa katikati ya watu, si tu ndani ya mahali patakatifu.'
theological_decisions:
- issue: Kirejelewa cha kukaa kwa Mungu
  choice: katikati yao
  alternative: ndani yake
  rationale: Kiebrania kina kiambishi cha nafsi ya tatu wingi, ‘yao,’ si umoja ‘yake.’ Hivyo tafsiri inahifadhi msisitizo kwamba uwepo wa Mungu ni miongoni mwa watu, ingawa mahali patakatifu ndilo linalohusishwa na uwepo huo.
- issue: Uhusiano wa kishazi cha pili na agizo
  choice: nami nitakaa
  alternative: ili nikae
  rationale: Kiunganishi cha Kiebrania kinaweza kueleweka katika muktadha kuwa matokeo au kusudi, lakini umbo lenyewe pia huruhusu mwendelezo wa moja kwa moja, ‘nami nitakaa.’ Tafsiri hii inalinda utata huo badala ya kuamua kimya kimya kuwa ni kusudi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wanitengenezee’ hutoa agizo la kawaida na linaloeleweka; ‘mahali patakatifu’ huepuka istilahi nzito isiyo ya lazima. Alama ya tanbihi imewekwa baada ya kishazi kinachoelezwa.
