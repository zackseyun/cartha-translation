  text: You shall make its seven lamps[b][a], and he shall set up its lamps so that they give light in front of it.
translation:
  language: sw
  text: Utazitengeneza taa zake saba, naye[b] ataziweka[a] ili ziangaze kuelekea upande wa mbele wa kinara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ataziwasha ili ziangaze kuelekea upande wa mbele wa kinara.” Kitenzi cha Kiebrania humaanisha hasa kusababisha taa zipande; katika muktadha huu kinaweza kumaanisha kuzisimamisha au kuziwasha.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania hapa kiko katika nafsi ya tatu umoja (“naye ataziweka”). Huenda mhusika anayekusudiwa ni kuhani anayehudumia kinara, ingawa hatajwi waziwazi katika mstari huu.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Utazitengeneza
  rationale: Kitenzi hiki ni agizo kwa Musa katika muktadha wa maagizo ya kutengeneza kinara. Kiambishi «-zi-» kinarejelea taa saba.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: taa zake saba
  rationale: נֵרֹת ni taa, na kiambishi cha nafsi ya tatu umoja wa kike kinarejelea kinara; Kiswahili hutumia «zake» kulingana na ngeli ya «taa».
- source_word: וְהֶעֱלָה
  choice: naye ataziweka taa zake mahali pake
  rationale: Hifili ya עלה kimsingi ni kusababisha zipande au ziwekwe juu; kuhusu taa inaweza kumaanisha kuziweka mahali pake au kuziwasha. Chaguo hili halichanganyi moja kwa moja tendo hilo na matokeo yanayotajwa baadaye, huku tanbihi ikihifadhi maana mbadala.
- source_word: וְהֵאִיר
  choice: ili ziangaze
  rationale: Hapa kitenzi kinaonyesha kusudi au matokeo ya kuwekwa kwa taa. Kiswahili cha kawaida hutaja taa zenyewe kuwa ndizo zinazoangaza.
- source_word: עַל־עֵבֶר פָּנֶיהָ
  choice: kuelekea mbele yake
  rationale: Kirai kinaonyesha upande au mwelekeo wa mwanga kuhusiana na sehemu ya mbele ya kinara. «Kuelekea mbele yake» huhifadhi maana hiyo ya mwelekeo.
