  text: Tengeneza fito za mbao za mshita, na uzifunike kwa dhahabu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Utengeneze
  rationale: Kitenzi hiki katika mfululizo wa maagizo kina nguvu ya amri; umbo la utegemezi la Kiswahili linaeleza agizo hilo kwa njia ya kawaida na yenye heshima.
- source_word: בַדֵּי
  choice: miti ya kubebea
  rationale: Neno hili linamaanisha miti iliyotumiwa kubebea sanduku; kirai hiki ni wazi zaidi kwa msomaji wa sasa kuliko neno la jumla 'miti' pekee.
- source_word: עֲצֵי שִׁטִּים
  choice: ya mbao za mshita
  rationale: Muundo wa Kiebrania unataja nyenzo ya miti hiyo. 'Mbao za mshita' ni usemi wa kawaida wa Kiswahili kwa acacia wood.
- source_word: וְצִפִּיתָ
  choice: kisha uifunike
  rationale: Kitenzi kinamaanisha kufunika uso wa kitu kwa nyenzo nyingine. 'Kisha' linaendeleza mfululizo wa maagizo kwa Kiswahili cha kawaida.
- source_word: אֹתָם
  choice: uifunike
  rationale: Kiwakilishi cha Kiebrania kinarejelea miti ya kubebea. Kiswahili hutumia upatanisho wa ngeli ya 'miti' katika kiambishi cha yambwa -i-.
- source_word: זָהָב
  choice: kwa dhahabu
  rationale: Kirai hiki kinaonyesha nyenzo inayotumiwa kuifunika miti na ni cha asili katika Kiswahili.
