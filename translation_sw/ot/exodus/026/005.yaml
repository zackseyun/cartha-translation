base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/005.yaml
  text: You shall make fifty loops on the one curtain[a], and you shall make fifty loops on the edge of the curtain that is in the second set; the loops shall be opposite one another.
translation:
  language: sw
  text: Utatengeneza vitanzi hamsini kwenye pazia moja, na utatengeneza vitanzi hamsini kwenye ukingo wa pazia lililo katika fungu la pili; vitanzi hivyo vitakabiliana, kimoja kwa kingine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “mwanamke kwa dada yake,” nahau inayomaanisha kwamba vitanzi vimepangwa kulingana, kila kimoja kikikabiliana na mwenzake.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: vitanzi
  rationale: Neno hili linamaanisha viambatisho vya umbo la kitanzi vilivyotumiwa kuunganisha mapazia. “Vitanzi” ni neno la kawaida na linavitofautisha na vifungo vya chuma vinavyotajwa katika mstari unaofuata.
- source_word: יְרִיעָה
  choice: pazia
  rationale: Katika muktadha wa Maskani, neno hili linamaanisha kitambaa kikubwa kilichotandazwa au kuning'inizwa; “pazia” ni wazi, la kawaida, na linafaa katika muktadha huu.
- source_word: הָאֶחָת
  choice: moja
  rationale: Kiebrania kinasema kihalisi “moja,” kikilitofautisha pazia hili na linalolingana nalo bila kulifanya kwa lazima kuwa la kwanza katika mfuatano.
- source_word: קְצֵה
  choice: ukingo
  rationale: Neno hilo linataja mpaka wa nje wa pazia. “Ukingo” linafaa kwa tendo la kuweka vitanzi ili kuunganisha mapazia.
- source_word: מַחְבֶּרֶת
  choice: fungu
  rationale: Hapa neno linamaanisha kundi la mapazia yaliyounganishwa kuwa kitengo kimoja. “Fungu” linawasilisha maana hiyo kwa Kiswahili cha kawaida bila kutumia maelezo marefu.
- source_word: הַשֵּׁנִית
  choice: la pili
  rationale: Hii inalitambulisha wazi fungu la pili la mapazia, kama ilivyo katika Kiebrania.
- source_word: מַקְבִּילֹת
  choice: vitakabiliana
  rationale: Neno linaonyesha kwamba vitanzi vya pande hizo mbili vitawekwa vikielekeana na kulingana. “Vitakabiliana” linahifadhi maana ya mahali bila kudai zaidi ya maandishi.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: kimoja kwa kingine
  rationale: Hii ni nahau ya Kiebrania, kihalisi “mwanamke kwa dada yake,” inayomaanisha kwamba vitu vinavyolingana vimewekwa kuelekeana. “Kimoja kwa kingine” ni Kiswahili cha kawaida huku taswira halisi ikihifadhiwa katika tanbihi.
