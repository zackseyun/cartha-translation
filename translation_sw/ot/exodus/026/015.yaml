lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utatengeneza
  rationale: Muundo huu katika mfululizo wa maagizo una nguvu ya amri ya wakati ujao. “Nawe” huhifadhi uendelezaji wa waw, na “utatengeneza” ni Kiswahili cha kawaida kwa kutengeneza sehemu za jengo.
- source_word: הַקְּרָשִׁים
  choice: mbao[a]
  rationale: Neno hili humaanisha sehemu za mbao zilizosimama na kuunda muundo wa Maskani. “Mbao” ni neno halisi, la kawaida na linaloeleweka; tanbihi inataja “viunzi” kama tafsiri inayosisitiza kazi yake ya kimuundo.
- source_word: לַמִּשְׁכָּן
  choice: za Maskani
  rationale: “Maskani” ni istilahi inayofaa kwa mahali patakatifu panapoelezwa katika Kutoka. Muundo wa “za Maskani” unaonyesha kwamba mbao hizo ni sehemu zake.
- source_word: עֲצֵי שִׁטִּים
  choice: kwa mti wa mshita
  rationale: Mnyororo huu wa nomino unaonyesha nyenzo iliyotokana na mshita. “Mti wa mshita” ni usemi wa asili na unaoeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: עֹמְדִים
  choice: zikiwa zimesimama wima
  rationale: Hali ya kushiriki inaeleza mkao wa mbao. “Zikiwa zimesimama wima” huhifadhi maana ya hali inayoendelea na kuweka wazi mwelekeo wake wa kujengwa.
