translation:
  language: sw
  text: Nawe utatengeneza mbao[a] za Maskani za mti wa mshita, zikiwa zimesimama wima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viunzi”; neno la Kiebrania linamaanisha sehemu za mbao zilizounda muundo wa Maskani.
