translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Muundo wa ugawaji wa Kiebrania umetafsiriwa kwa ‘kila fremu’ ili kutoa maana yake kwa Kiswahili cha kawaida. Alama za tanbihi zote zimewekwa katika matini kuu.
