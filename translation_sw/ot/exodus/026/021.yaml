translation:
  language: sw
  text: 'na misingi yake arobaini ya fedha: misingi miwili chini ya kila fremu.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitako” badala ya “misingi”; neno la Kiebrania linamaanisha vitegemezo vya fedha ambamo fremu za Maskani ziliwekwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “ubao”; neno la Kiebrania linaeleza kila sehemu wima ya muundo wa Maskani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים אַדְנֵי/הֶם
  choice: na misingi yake arobaini
  rationale: Kiunganishi kinaendeleza maelezo ya mstari uliotangulia; kiwakilishi cha umoja kinaendana kwa kawaida na upande uliotajwa katika muktadha, huku idadi ya arobaini ikihifadhiwa.
- source_word: כָּסֶף
  choice: ya fedha
  rationale: Nomino hiyo inaonyesha nyenzo ambayo misingi ilitengenezwa; ‘ya fedha’ ni usemi wa kawaida na wazi wa Kiswahili.
- source_word: שְׁנֵי אֲדָנִים
  choice: misingi miwili
  rationale: אֶדֶן ni kitako au tundu la kutegemeza sehemu wima ya Maskani. ‘Misingi’ ni neno linaloeleweka kwa urahisi, ingawa ‘vitako’ pia linawezekana.
- source_word: תַּחַת
  choice: chini ya
  rationale: Linawasilisha moja kwa moja mahali pa kila jozi ya misingi kuhusiana na fremu.
- source_word: הַקֶּרֶשׁ
  choice: fremu
  rationale: Katika ujenzi wa Maskani, קֶרֶשׁ ni sehemu wima ya muundo. ‘Fremu’ huonyesha kazi yake ya kimuundo vizuri kuliko ‘ubao’ pekee.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: kila fremu
  rationale: 'Kurudiwa kwa ‘ile moja’ katika Kiebrania kuna maana ya ugawaji: misingi miwili kwa fremu moja moja. Kiswahili cha asili huwasilisha maana hiyo kwa ufupi kwa ‘kila fremu’ bila kudokeza kwamba jozi zote ziko chini ya fremu ileile.'
