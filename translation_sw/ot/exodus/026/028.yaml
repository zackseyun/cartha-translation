  text: And the middle bar[a], in the midst of the frames, shall extend from end to end.
translation:
  language: sw
  text: Na boriti ya katikati, iliyo katikati ya viunzi[a], itaenea kutoka mwisho mmoja hadi mwingine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbao.” Neno la Kiebrania linamaanisha vipande vya wima vya muundo wa Maskani; hapa “viunzi” limetumiwa ili lisitoe picha ya mbao tambarare tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרִיחַ
  choice: boriti
  rationale: Katika ujenzi wa Maskani, neno hili linamaanisha kipande kirefu cha mlalo kinachoshikilia viunzi pamoja; “boriti” ni istilahi ya kawaida na ya kimuundo kuliko “komeo.”
- source_word: הַתִּיכֹן
  choice: ya katikati
  rationale: Kivumishi hiki kinaitambulisha boriti iliyowekwa katikati ya nyingine.
- source_word: בְּתוֹךְ
  choice: iliyo katikati ya
  rationale: Huhifadhi maana ya mahali ndani au miongoni mwa viunzi bila kudai kwamba boriti ilipitia matundu.
- source_word: הַקְּרָשִׁים
  choice: viunzi
  rationale: Neno linarejelea vipande vya wima vya muundo wa Maskani. “Viunzi” huepuka picha finyu ya mbao tambarare pekee, ingawa “mbao” ni tafsiri nyingine inayowezekana.
- source_word: מַבְרִחַ
  choice: itaenea
  rationale: Hapa umbo la kitenzi linaeleza boriti inayofika katika urefu wote wa muundo; “itaenea” huhifadhi wazo hilo bila kuongeza kwamba ilipenya kwenye matundu.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: kutoka mwisho mmoja hadi mwingine
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha kwamba boriti inafika urefu wote.
