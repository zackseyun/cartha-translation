  text: And you shall make fifty loops on the edge of the one curtain[a], the outermost one in the set joined together, and fifty loops on the edge of the second curtain that is joined to it.
translation:
  language: sw
  text: Nawe utatengeneza vitanzi hamsini kwenye ukingo wa pazia moja, lile la mwisho katika fungu lililounganishwa[a], na vitanzi hamsini kwenye ukingo wa pazia lililo katika fungu la pili lililounganishwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kiungo.” Neno la Kiebrania linamaanisha kitengo kilichofanyizwa kwa kuunganisha mapazia pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utatengeneza
  rationale: Kitenzi cha Qal chenye kiunganishi, katika muktadha wa maagizo, kina nguvu ya amri; wakati ujao wa Kiswahili huwasilisha agizo hili kwa mtindo wa kawaida wa sheria.
- source_word: לֻלָאֹת
  choice: vitanzi
  rationale: Neno hili linamaanisha vitanzi vya kitambaa vinavyotumiwa kuunganisha mapazia.
- source_word: שְׂפַת
  choice: ukingo
  rationale: Maana halisi ni ‘mdomo,’ lakini kwa kitambaa ‘ukingo’ ndiyo tafsiri ya kawaida na sahihi.
- source_word: הַיְרִיעָה
  choice: pazia
  rationale: Katika muktadha wa Maskani, neno hili linataja kipande kikubwa cha kitambaa; ‘pazia’ ni istilahi iliyo wazi na ya kawaida.
- source_word: הָאֶחָת
  choice: lile moja
  rationale: Kiebrania kinasema ‘moja,’ si waziwazi ‘la kwanza’; tafsiri hii inadumisha tofauti hiyo.
- source_word: הַקִּיצֹנָה
  choice: lililo la mwisho
  rationale: Kivumishi kinaonyesha kitu kilicho kwenye mwisho wa fungu lililounganishwa.
- source_word: בַּחֹבָרֶת
  choice: katika fungu lililounganishwa
  rationale: Nomino inataja kitengo kilichofanyizwa kwa kuunganisha mapazia; ‘fungu lililounganishwa’ linaeleweka kwa urahisi na kuhifadhi wazo la muundo huo.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: pazia la fungu la pili
  rationale: Muundo huu unaeleweka vyema kama pazia lililo kwenye kitengo cha pili kilichounganishwa, sambamba na matumizi ya חֹבָרֶת katika Kutoka 26:4–5.
