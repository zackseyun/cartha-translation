translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa maagizo ya ujenzi ulio wazi na wenye heshima. Viwakilishi vya ngeli ya I-ZI vinadokeza mbao zilizotajwa katika muktadha. Tafsiri imehifadhi kutokuwa na uhakika kuhusu namna kamili ya mbao kuunganishwa na kuhusu “pete ile moja,” bila kuifanya kwa lazima kuwa “pete ya kwanza.”
