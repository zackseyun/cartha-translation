base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/024.yaml
  text: They shall be paired at the bottom[a], and together they shall be complete at its top, to the first ring. So it shall be for both of them[c][b]; they shall be for the two corners.
translation:
  language: sw
  text: Ziwe zimeoanishwa chini[a], na kwa pamoja ziwe kamili upande wa juu[b], hadi kwenye pete ile moja[c]. Ndivyo itakavyokuwa kwa zote mbili; ziwe kwenye zile pembe mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zilingane kama jozi” au “ziwe jozi” chini; Kiebrania kinaeleza mbao hizo mbili kuwa jozi inayolingana.
    reason: lexical_alternative
  - marker: b
    text: Tafsiri nyingine ni “zikamilike” au “zitoshe sawasawa” upande wa juu. Neno la Kiebrania hapa linaonyesha ukamilifu wa kimuundo, si ukamilifu wa kimaadili.
    reason: lexical_alternative
  - marker: c
    text: Au, “hadi kwenye pete moja.” Huenda kirai hiki kinarejelea pete inayounganisha mbao hizo mbili juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאֲמִים
  choice: ziwe jozi
  rationale: Neno hili linaonyesha mbao mbili zinazolingana na kuunda jozi. “Ziwe jozi” ni Kiswahili cha kawaida na hudumisha picha ya vipande viwili vilivyooanishwa.
- source_word: מִלְּמַטָּה
  choice: upande wa chini
  rationale: Kirai hiki kinaelekeza kwenye ncha ya chini ya mbao; “upande wa chini” ni wazi katika maelezo ya ujenzi.
- source_word: וְיַחְדָּו
  choice: kwa pamoja
  rationale: Husisitiza kuwa mbao hizo mbili zinafanya kazi pamoja kama sehemu moja.
- source_word: תַמִּים
  choice: ziungane kikamilifu
  rationale: Katika muktadha huu neno linaeleza ukamilifu wa kimuundo, si ukamilifu wa kimaadili. Kitenzi “ziungane” kinafaa kwa ujenzi, huku “kikamilifu” kikihifadhi wazo la ukamilifu bila kubainisha mbinu isiyotajwa.
- source_word: עַל רֹאשׁוֹ
  choice: upande wa juu
  rationale: “Kichwa” kimetumiwa kwa maana ya ncha ya juu. Kiswahili cha maelezo ya ujenzi hutumia kwa kawaida “upande wa juu.”
- source_word: אֶל הַטַּבַּעַת הָאֶחָת
  choice: hadi kwenye pete ile moja
  rationale: Tafsiri hii inafuata kwa karibu kihusishi, kibainishi, na namba ya Kiebrania, bila kuamua kwamba pete hiyo ni ya kwanza katika mfuatano.
- source_word: כֵּן יִהְיֶה לִשְׁנֵיהֶם
  choice: Ndivyo itakavyokuwa kwa zote mbili
  rationale: Kirai hiki kinatoa muhtasari wa mpangilio unaohusu mbao zote mbili.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: ziwe kwenye zile pembe mbili
  rationale: מִקְצֹעֹת inaweza kumaanisha pembe au maungio ya pembe. “Pembe mbili” ni tafsiri ya moja kwa moja isiyoongeza maelezo kutoka muktadha mpana.
