base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/020.yaml
  text: And for the second side of the tabernacle[a], on the north side, twenty frames.
translation:
  language: sw
  text: Na kwa upande wa pili wa Maskani, upande wa kaskazini, viunzi ishirini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbao.” Neno la Kiebrania linaweza kumaanisha vipande vya wima vilivyounda kuta za Maskani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/צֶלַע
  choice: Na kwa upande
  rationale: Muunganiko wa kiambishi cha kuunganisha na kihusishi unaanzisha agizo linalofuata, na צֶלַע hapa humaanisha upande wa jengo, si ubavu halisi.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: Katika Kutoka, מִשְׁכָּן ni neno la kawaida kwa hema takatifu ambamo Mungu anakaa; “Maskani” ni istilahi fupi, yenye heshima, na inayoeleweka katika muktadha huu.
- source_word: הַשֵּׁנִית
  choice: wa pili
  rationale: Kivumishi hiki kinatambulisha upande wa pili kati ya pande mbili ndefu, baada ya upande wa kwanza kutajwa katika mstari uliotangulia.
- source_word: לִפְאַת צָפוֹן
  choice: upande wa kaskazini
  rationale: Kirai hiki kinaonyesha mwelekeo wa sehemu hiyo; Kiswahili hiki ni cha kawaida na kinafaa kwa maelezo ya ujenzi.
- source_word: עֶשְׂרִים
  choice: ishirini
  rationale: Ni tafsiri ya moja kwa moja ya idadi.
- source_word: קָרֶשׁ
  choice: viunzi
  rationale: Katika maelezo ya Maskani, neno hili linamaanisha vipande vya wima vya muundo wa ukuta. “Viunzi” linaonyesha kazi ya kimuundo, huku “mbao” likibaki kuwa tafsiri nyingine inayowezekana.
