  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umehifadhi ufupi wa agizo la Kiebrania, ambalo halina kitenzi wazi. Alama ya tanbihi imewekwa baada ya neno linalohusika.
