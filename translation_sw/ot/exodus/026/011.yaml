  yaml_path: translation/ot/exodus/026/011.yaml
  text: And you shall make fifty bronze clasps[a], and put the clasps into the loops, and join the tent together[c][b], so that it may be one.
translation:
  language: sw
  text: Nawe utatengeneza vifungo hamsini vya shaba[a], utavitia vifungo hivyo katika vitanzi, na utaunganisha hema, nalo litakuwa moja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vifungo hamsini vya bronzi.” Neno la Kiebrania נְחֹשֶׁת linaweza kumaanisha shaba au bronzi kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Yaani, sehemu zilizotengana zitaunganishwa na kuwa hema moja.
    reason: cultural_note
lexical_decisions:
- source_word: קַרְסֵי נְחֹשֶׁת
  choice: vifungo vya shaba
  rationale: קַרְסִים ni vifaa vya kuunganisha vipande vya mapazia; “vifungo” linaeleza kazi yake kwa Kiswahili cha kawaida. נְחֹשֶׁת inaweza kumaanisha shaba au bronzi; “shaba” ni istilahi pana na ya kawaida katika tafsiri za Kiswahili, huku uwezekano wa bronzi ukihifadhiwa katika tanbihi.
- source_word: חֲמִשִּׁים
  choice: hamsini
  rationale: Ni namba ya kawaida inayotaja idadi ya vifungo.
- source_word: וְהֵבֵאתָ אֶת הַקְּרָסִים בַּלֻּלָאֹת
  choice: utavitia vifungo hivyo katika vitanzi
  rationale: Hifili ya בוא hapa ina maana ya kuingiza au kuweka vifungo ndani ya vitanzi; “utavitia ... katika” ni ya asili na wazi kwa Kiswahili.
- source_word: וְחִבַּרְתָּ אֶת הָאֹהֶל
  choice: na kuunganisha hema
  rationale: חבר humaanisha kuunganisha. “Hema” linadumisha nomino ya Kiebrania הָאֹהֶל na picha ya vipande vya kifuniko vinavyounganishwa.
- source_word: וְהָיָה אֶחָד
  choice: ili liwe kitu kimoja
  rationale: Kishazi kinaonyesha matokeo ya kuunganisha; usemi huu wa Kiswahili unaweka wazi kwamba hema lote litakuwa umoja mmoja.
