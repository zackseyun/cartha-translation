  text: וְ/נָתַתָּ֙ אֶת הַ/כַּפֹּ֔רֶת עַ֖ל אֲר֣וֹן הָ/עֵדֻ֑ת בְּ/קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/034.yaml
  text: And you shall place the mercy seat on the ark of the testimony in the Most Holy Place[a][b][c].
translation:
  language: sw
  text: Nawe utaweka kifuniko cha upatanisho[a] juu ya sanduku la Ushuhuda[b], katika Mahali Patakatifu Zaidi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiti cha rehema.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “sanduku la Ushuhuda”; tafsiri nyingi husema “sanduku la Agano.”'
    reason: alternative_reading
  - marker: c
    text: Au, “Patakatifu pa Patakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: Nawe utaweka
  rationale: Kitenzi cha Kiebrania katika mfuatano huu wa maagizo kina nguvu ya amri. Muundo wa wakati ujao wa Kiswahili unafaa kwa maagizo haya, na “kuweka” unaeleza vizuri kukiweka kitu mahali pake.
- source_word: הַכַּפֹּרֶת
  choice: kifuniko cha upatanisho
  rationale: Neno hili linataja kifuniko cha sanduku kilichohusishwa na ibada ya upatanisho. Tafsiri hii ni wazi kwa msomaji wa sasa na haifanyi kitu hicho kionekane kuwa kiti halisi; istilahi ya jadi “kiti cha rehema” imehifadhiwa katika tanbihi.
- source_word: עַל
  choice: juu ya
  rationale: Kihusishi kinaonyesha kwamba kifuniko kinawekwa juu ya sanduku.
- source_word: אֲרוֹן הָעֵדֻת
  choice: sanduku la Ushuhuda
  rationale: Kiebrania kinasema moja kwa moja “sanduku la ushuhuda,” si “sanduku la agano.” “Ushuhuda” hapa ni istilahi maalumu inayohusiana na yale yaliyowekwa sandukuni.
- source_word: בְּ/קֹדֶשׁ הַקֳּדָשִׁים
  choice: katika Mahali Patakatifu Zaidi
  rationale: Nahau ya Kiebrania ina maana ya sehemu takatifu kuliko zote, yaani chumba cha ndani kabisa cha maskani. Usemi huu ni wazi katika Kiswahili cha sasa.
theological_decisions:
- issue: Jinsi ya kutafsiri istilahi ya kifuniko cha sanduku bila kuongeza dai la kimafundisho
  choice: kifuniko cha upatanisho
  alternative: kiti cha rehema
  rationale: Tafsiri iliyochaguliwa inaonyesha kwamba ni kifuniko na inadumisha uhusiano wake wa kiibada na upatanisho. Tafsiri ya jadi imetolewa katika tanbihi bila kulazimisha picha ya kiti.
- issue: Kudumisha istilahi halisi ya Kiebrania kwa sanduku
  choice: sanduku la Ushuhuda
  alternative: sanduku la Agano
  rationale: “Ushuhuda” ndilo neno lililo katika maandishi ya Kiebrania. “Agano” ni istilahi iliyozoeleka katika mapokeo mengine, lakini hapa lingeondoa tofauti ya msamiati wa chanzo.
- issue: Jinsi ya kueleza kiwango cha juu cha utakatifu katika jina la eneo
  choice: Mahali Patakatifu Zaidi
  alternative: Patakatifu pa Patakatifu
  rationale: Chaguo kuu linawasilisha wazi maana ya kiwango cha juu, huku usemi halisi zaidi wa Kiebrania ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi unafuata agizo la Kiebrania bila kuwa mgumu; istilahi maalumu zimefafanuliwa kwa tanbihi.
