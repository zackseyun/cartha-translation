  yaml_path: translation/ot/exodus/026/009.yaml
  text: And you shall join the five curtains separately[a], and the six curtains separately; and you shall fold the sixth curtain double at the front of the tent.
translation:
  language: sw
  text: Uyaunganishe mapazia matano kuwa kundi moja, na mapazia sita kuwa kundi jingine; kisha ulikunje pazia la sita liwe maradufu upande wa mbele wa hema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulikunje pazia la sita liwe maradufu likielekea sehemu ya mbele ya hema.”
    reason: Kirai אֶל מוּל פְּנֵי kinaweza kueleza mahali upande wa mbele au mwelekeo kuelekea/kukabiliana na sehemu ya mbele.
lexical_decisions:
- source_word: חִבַּרְתָּ
  choice: uyaunganishe
  rationale: Kitenzi חָבַר humaanisha kuunganisha au kushikamanisha; ‘uyaunganishe’ ni Kiswahili cha kawaida na kinafaa kwa mapazia yanayofanywa kuwa makundi mawili.
- source_word: יְרִיעֹת / יְרִיעָה
  choice: mapazia / pazia
  rationale: Katika muktadha wa muundo wa hema, יְרִיעָה ni kitambaa kikubwa cha kufunika; ‘pazia’ ni neno linaloeleweka na linalotumika kwa kawaida katika muktadha huu.
- source_word: לְבָד
  choice: kuwa kundi moja ... kuwa kundi jingine
  rationale: 'Neno hili linatenganisha seti mbili: mapazia matano yanaunganishwa pamoja, na sita yanaunganishwa katika seti tofauti. Uundaji huu ni wa asili zaidi kwa Kiswahili kuliko ‘peke yake’ huku ukihifadhi maana ya mgawanyo.'
- source_word: כָפַלְתָּ
  choice: ulikunje ... kuwa maradufu
  rationale: כָּפַל hueleza kukunja au kufanya kitu kiwe mara mbili; ‘kukunja ... kuwa maradufu’ huepuka dhana isiyokusudiwa ya kukunja mara mbili kwa nyakati mbili tofauti.
- source_word: הַשִּׁשִּׁית
  choice: la sita
  rationale: Hiki ni kivumishi cha mpangilio kinacholitambulisha pazia la sita.
- source_word: אֶל מוּל פְּנֵי
  choice: upande wa mbele wa
  rationale: Kirai hiki kinaonyesha mahali panapoelekea au kukabiliana na uso wa mbele. Tafsiri kuu inaeleza eneo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa maana ya ‘kukabiliana na’.
- source_word: הָאֹהֶל
  choice: hema
  rationale: Neno la Kiebrania ni ‘hema’; ‘hema’ huhifadhi neno la chanzo bila kulibadili kuwa jina pana zaidi la jengo takatifu.
