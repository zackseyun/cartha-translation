base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/019.yaml
  text: 'And you shall make forty silver bases under the twenty frames: two bases under one frame for its two tenons[b][a], and two bases under the next frame for its two tenons.'
translation:
  language: sw
  text: 'Nawe utatengeneza vikalio arobaini vya fedha chini ya viunzi ishirini: vikalio viwili chini ya kiunzi kimoja kwa ajili ya ndimi zake mbili,[a] na vikalio viwili chini ya kiunzi kingine kwa ajili ya ndimi zake mbili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vichomozo vyake viwili.” Neno la Kiebrania kwa kawaida humaanisha “mikono,” lakini hapa linamaanisha sehemu zinazochomoza chini ya kiunzi na kuingia katika vikalio.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: vikalio vya fedha
  rationale: Katika ujenzi wa Maskani, אֶדֶן ni sehemu ya chini inayotegemeza na kupokea kiunzi. “Vikalio” ni neno la kawaida na linaloeleweka katika Kiswahili, huku wazo la tundu la kupokelea likifafanuliwa katika tanbihi.
- source_word: תַּעֲשֶׂה
  choice: utatengeneza
  rationale: Kauli ya nafsi ya pili umoja katika maagizo haya ina nguvu ya amri; wakati ujao wa Kiswahili unatoa agizo hilo kwa namna ya asili.
- source_word: תַּחַת
  choice: chini ya
  rationale: Huwasilisha moja kwa moja mahali pa vikalio kuhusiana na viunzi.
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: kiunzi
  rationale: קֶרֶשׁ hapa ni sehemu wima ya muundo wa Maskani. “Kiunzi” huonyesha kazi yake ya kimuundo vizuri kuliko “ubao” pekee.
- source_word: שְׁנֵי אֲדָנִים
  choice: vikalio viwili
  rationale: Hudumisha maana na uthabiti wa istilahi iliyotumiwa kwa vikalio arobaini.
- source_word: לִשְׁתֵּי יְדֹתָיו
  choice: kwa ajili ya ndimi zake mbili
  rationale: Ingawa יָדוֹת kwa kawaida ni “mikono,” hapa ni istilahi ya useremala kwa sehemu mbili zinazochomoza na kuingia katika vikalio. “Ndimi” ni neno la useremala linaloeleweka kwa sehemu hizo.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: kiunzi kimoja ... kiunzi kingine
  rationale: Urudiaji wa Kiebrania una matumizi ya ugawaji kwa viunzi vinavyofuatana. Kiswahili cha asili hutumia “kimoja ... kingine” bila kupoteza maana.
