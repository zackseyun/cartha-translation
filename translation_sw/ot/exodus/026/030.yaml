lexical_decisions:
- source_word: וַהֲקֵמֹתָ
  choice: utaisimamisha
  rationale: Hifili ya קום ina maana ya kusababisha kitu kisimame; katika muktadha wa kujenga hema, “utaisimamisha” ni Kiswahili cha kawaida na chenye nguvu ya agizo.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi fupi na inayotambulika kwa makao matakatifu yanayohamishika katika Kutoka; herufi kubwa inaonyesha kuwa hapa ni jina la jengo hilo maalumu.
- source_word: כְּמִשְׁפָּטוֹ
  choice: kulingana na utaratibu wake
  rationale: מִשְׁפָּט hapa haisemi hasa hukumu ya mahakama, bali mpangilio au namna iliyowekwa kwa ajili ya Maskani. “Utaratibu wake” huhifadhi wazo hilo bila kulifanya tu kuwa mchoro wa ujenzi.
- source_word: אֲשֶׁר הָרְאֵיתָ
  choice: uliouona
  rationale: Kiebrania kinasema moja kwa moja “uliouona.” Tafsiri hii inahifadhi kauli tendi ya chanzo badala ya kuingiza wazi wazo la kuonyeshwa, ambalo linadokezwa na muktadha.
- source_word: בָּהָר
  choice: mlimani
  rationale: בְּ katika mazingira haya inaonyesha mahali Musa alipokuwa; “mlimani” ni usemi wa asili wa Kiswahili.
