  text: Nawe utaisimamisha Maskani kulingana na mpangilio wake[a] uliouona mlimani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha utaratibu, namna iliyowekwa, au mpangilio.
