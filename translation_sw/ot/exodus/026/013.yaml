base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/013.yaml
  text: And the extra cubit on this side and the extra cubit on that side[a], from the surplus in the length of the tent curtains, shall hang over the sides of the tabernacle on this side and on that side[b], to cover it.
translation:
  language: sw
  text: Dhiraa moja iliyozidi upande huu na dhiraa moja iliyozidi upande ule[a], katika urefu wa mapazia ya hema, itashuka ikining’inia juu ya pande za maskani, upande huu na upande ule[b], ili kuifunika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhiraa moja upande mmoja na dhiraa moja upande mwingine.” Kiebrania hurudia “dhiraa” pamoja na maneno ya kuonyesha pande, kikirejelea kipimo kilichobaki kila upande.
    reason: lexical_alternative
  - marker: b
    text: “Maskani” hapa hutafsiri neno la Kiebrania mishkan, yaani muundo mtakatifu wa makao uliokuwa chini ya kifuniko cha hema.
    reason: cultural_note
lexical_decisions:
- source_word: הָאַמָּה
  choice: dhiraa moja iliyozidi
  rationale: אַמָּה ni kipimo cha kawaida cha urefu, yaani dhiraa; muktadha unaonyesha kuwa dhiraa hiyo ndiyo sehemu iliyozidi.
- source_word: מִזֶּה ... מִזֶּה
  choice: upande huu ... upande ule
  rationale: Virai hivi vinaonyesha pande mbili zinazokabiliana; tafsiri hii ni ya kawaida na wazi katika maelezo ya jengo.
- source_word: בָּעֹדֵף
  choice: iliyozidi
  rationale: Neno hili linamaanisha sehemu iliyobaki au iliyokuwa ya ziada; hapa linahusu urefu wa mapazia uliozidi vipimo vya maskani.
- source_word: אֹרֶךְ
  choice: urefu
  rationale: Ni neno la moja kwa moja la kipimo katika muktadha wa ujenzi.
- source_word: יְרִיעֹת הָאֹהֶל
  choice: mapazia ya hema
  rationale: יְרִיעֹת ni vipande vikubwa vya kitambaa au mapazia, na הָאֹהֶל huvitambulisha kuwa vya hema.
- source_word: יִהְיֶה סָרוּחַ
  choice: itaning’inia juu ya
  rationale: Kirai kinaonyesha kitambaa kilichozidi kikishuka au kuvuka kingo za pande za maskani.
- source_word: צִדֵּי הַמִּשְׁכָּן
  choice: pande za maskani
  rationale: מִשְׁכָּן ni makao matakatifu yaliyo chini ya kifuniko cha hema; “maskani” ni istilahi fupi na yenye hadhi katika Kiswahili cha Biblia.
- source_word: לְכַסֹּתוֹ
  choice: ili kuifunika
  rationale: Muundo huu ni kitenzi-jina cha kusudi, ukieleza kazi ya sehemu ya mapazia inayoning’inia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye hadhi na unaoeleweka. “Dhiraa” imehifadhiwa kama kipimo cha kale, na “maskani” imetumiwa kama istilahi ya jengo takatifu bila kulichanganya na hema linalolifunika.
