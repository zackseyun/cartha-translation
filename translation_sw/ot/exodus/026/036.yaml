base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/036.yaml
  text: You shall make a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: sw
  text: Nawe utatengeneza pazia kwa ajili ya mwingilio wa hema,[a] kwa nyuzi za buluu, zambarau, na nyekundu nyangavu, na kitani safi kilichosokotwa, kazi ya mtarizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitambaa cha kufunika” au “sitara” ya mwingilio; hapa “pazia” ni pazia la mwingilio, tofauti na pazia la ndani lililotajwa katika sura hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  choice: pazia
  rationale: Neno hili linamaanisha kitambaa kinachoning’inizwa ili kufunika au kutenga eneo. Katika Kiswahili cha kawaida, “pazia” linaeleza kazi hiyo kwa uwazi; tanbihi inatofautisha pazia hili la mwingilio na pazia la ndani.
- source_word: לְפֶתַח הָאֹהֶל
  choice: kwa ajili ya mwingilio wa hema
  rationale: פֶתַח ni uwazi au mwingilio, na אֹהֶל ni hema. Tafsiri hii ni ya kawaida na haiongezi neno la kifasiri kama “Maskani” katika kirai hiki.
- source_word: תְּכֵלֶת
  choice: nyuzi za buluu
  rationale: Neno hili hutaja kitambaa au nyuzi zilizotiwa rangi ya buluu yenye mwelekeo wa urujuani. “Buluu” ni wazi na ya kawaida, huku “nyuzi” ikifanya maana ya nyenzo za ufumaji iwe dhahiri.
- source_word: אַרְגָּמָן
  choice: zambarau
  rationale: Neno hili hutaja nyenzo iliyotiwa rangi ya zambarau; “zambarau” ni istilahi ya kawaida na inayoeleweka katika Kiswahili sanifu.
- source_word: תוֹלַעַת שָׁנִי
  choice: nyekundu
  rationale: Kirai hiki ni nahau ya nyenzo iliyotiwa rangi nyekundu kali, si rejeo la moja kwa moja kwa mdudu. Katika mfululizo huu wa rangi, “nyekundu” ni ya asili na inaeleweka kwa urahisi.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: kitani safi kilichosokotwa
  rationale: שֵׁשׁ hutaja kitani bora au safi, na מָשְׁזָר huonyesha kuwa nyuzi zimesokotwa. Tafsiri inahifadhi ubora wa kitani na namna kilivyotengenezwa.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: kazi ya mtarizi
  rationale: Kirai hiki huonyesha kazi ya ufundi wa kupamba nguo kwa rangi au tarizi. “Kazi ya mtarizi” huhifadhi mkazo wa Kiebrania juu ya fundi mwenye ustadi.
- source_word: וְעָשִׂיתָ
  choice: Nawe utatengeneza
  rationale: Katika mfululizo huu wa maagizo, muundo huu una nguvu ya agizo. “Nawe utatengeneza” huhifadhi kiunganishi cha Kiebrania na sajili ya maagizo yenye heshima.
