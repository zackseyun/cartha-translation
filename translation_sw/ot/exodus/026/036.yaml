translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa lakini yenye heshima. Mpangilio wa rangi na vifaa umehifadhiwa, na sentensi imeundwa kwa mtiririko wa kawaida wa Kiswahili bila kufuta tofauti kati ya pazia la mwingilio na pazia la ndani.
