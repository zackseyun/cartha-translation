base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/031.yaml
  text: And you shall make a veil of blue[a], purple, and scarlet yarn, and fine twisted linen; it shall be made with cherubim[c][b], the work of a skillful designer.
translation:
  language: sw
  text: “Utengeneze pazia[a] kwa nyuzi za buluu, zambarau, na nyekundu[b], pamoja na kitani bora kilichosokotwa. Litengenezwe kwa ufundi wa kisanaa[c], lenye makerubi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitambaa cha pazia.” Neno la Kiebrania hurejelea pazia la ndani lililotenganisha Patakatifu na Patakatifu Zaidi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinamaanisha kwa uhalisi zaidi nyenzo iliyotiwa rangi nyekundu; kwa desturi rangi hiyo ilihusishwa na rangi iliyotokana na wadudu.
    reason: cultural_note
  - marker: c
    text: Au, “kwa kazi ya fundi wa sanaa” au “kwa ustadi wa kisanaa.” Usemi wa Kiebrania unaonyesha ufundi wa kisanaa wenye ustadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹכֶת
  choice: pazia
  rationale: Neno hili linamaanisha pazia la ndani lililotenganisha Patakatifu na Patakatifu Zaidi. ‘Pazia’ ni neno la kawaida na sahihi katika muktadha huu.
- source_word: תְּכֵלֶת
  choice: nyuzi za buluu
  rationale: Neno hilo hutaja rangi ya thamani iliyotumiwa katika vitambaa. Kutaja ‘nyuzi’ kwa pamoja kunaweka wazi kuwa orodha hii inahusu vifaa vya kutengenezea pazia.
- source_word: אַרְגָּמָן
  choice: zambarau
  rationale: Hii ndiyo tafsiri ya kawaida ya rangi hii ya kifahari katika maelezo ya hema la kukutania.
- source_word: תוֹלַעַת שָׁנִי
  choice: nyekundu
  rationale: Kirai hiki kinamaanisha nyenzo iliyotiwa rangi nyekundu; kihistoria rangi hiyo ilihusishwa na wadudu. ‘Nyekundu’ ni ya asili na inafaa katika orodha hii ya rangi za nyuzi.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: kitani bora kilichosokotwa
  rationale: Tafsiri hii inahifadhi aina ya kitambaa na pia hali yake ya kusokotwa.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: Fundi stadi
  rationale: Kirai hicho kinaonyesha ustadi wa kisanaa katika kazi, bila kulazimisha ufundi maalumu kama vile udarizi.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: atalitengeneza
  rationale: Kiebrania hubadilika kutoka nafsi ya pili kwenda kitenzi cha nafsi ya tatu chenye yambwa ya kike. Kiswahili kinaweza kuhifadhi badiliko hilo kwa kumtaja fundi stadi kama mtendaji.
- source_word: כְּרֻבִים
  choice: kwa michoro ya makerubi
  rationale: Makerubi yalikuwa sehemu ya usanifu wa pazia. ‘Michoro’ inaeleza kwa kawaida kuwa yalionyeshwa katika kazi ya kitambaa bila kudokeza kuwa yalikuwa viumbe halisi juu ya pazia.
theological_decisions:
- issue: Kutafsiri lugha ya ibada na ufundi wa hema bila kuingiza ishara za kiteolojia za baadaye
  choice: Aya imetafsiriwa kama agizo halisi la kutengeneza pazia la hema, likiwa na makerubi katika usanifu wake.
  alternative: Kutumia lugha ya kiishara inayosisitiza maana za pazia katika maandiko ya baadaye.
  rationale: Aya yenyewe inatoa maagizo ya ujenzi na ufundi; haielezi maana ya baadaye ya pazia, kwa hiyo tafsiri haipaswi kuiingiza.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa agizo umehifadhiwa, huku istilahi za ufundi zikielezwa kwa njia ya asili.
