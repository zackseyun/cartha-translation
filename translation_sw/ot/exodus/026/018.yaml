  language: sw
  text: 'Nawe utatengeneza viunzi vya Maskani: viunzi ishirini kwa upande wa kusini, kuelekea kusini.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbao” badala ya “viunzi”; neno la Kiebrania hurejelea vipande vya kimuundo vya Maskani na linaweza kueleweka kwa maana yoyote kati ya hizi mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utatengeneza
  rationale: Kauli timilifu ya Qal yenye kiunganishi katika muktadha wa maagizo ina nguvu ya amri; umbo hili la Kiswahili linahifadhi agizo hilo kwa lugha ya kawaida na yenye heshima.
- source_word: הַקְּרָשִׁים
  choice: viunzi
  rationale: Neno קֶרֶשׁ hapa linataja vipande vya wima vya kimuundo vya Maskani. “Viunzi” linaonyesha kazi yake ya kubeba na kuunda jengo bila kuamua kwa uhakika kuwa vilikuwa mbao bapa tu.
- source_word: לַמִּשְׁכָּן
  choice: vya Maskani
  rationale: מִשְׁכָּן ni jina la kawaida la jengo takatifu katika Kutoka; “Maskani” ni istilahi iliyozoeleka katika Kiswahili cha Biblia na hudumisha wazo la mahali pa kukaa.
- source_word: עֶשְׂרִים קֶרֶשׁ
  choice: viunzi ishirini
  rationale: 'Ingawa Kiebrania hutumia nomino ya umoja baada ya hesabu, Kiswahili sanifu hutumia wingi: “viunzi ishirini.”'
- source_word: לִפְאַת
  choice: kwa upande
  rationale: פֵאָה linaweza kumaanisha upande, ukingo, au mwisho; katika maelezo ya jengo, “upande” ndilo chaguo la asili na linalofaa zaidi.
- source_word: נֶגְבָּה תֵימָנָה
  choice: wa kusini, kuelekea kusini
  rationale: Maneno mawili ya mwelekeo yanabainisha na kusisitiza upande wa kusini. Tafsiri hii inahifadhi marudio ya Kiebrania badala ya kuyafupisha kuwa kivumishi kimoja.
