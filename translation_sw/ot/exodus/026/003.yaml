  text: Mapazia matano yataunganishwa moja na jingine[a], na mapazia matano yataunganishwa moja na jingine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “mwanamke kwa dada yake,” nahau inayomaanisha kwamba vitu vinavyolingana vinaunganishwa kimoja na kingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרִיעֹת
  choice: mapazia
  rationale: Katika maagizo ya ujenzi wa Maskani, neno hili humaanisha vipande vikubwa vya kitambaa vinavyotumika kama mapazia; “mapazia” ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: תִּהְיֶיןָ
  choice: yataunganishwa
  rationale: Kitenzi cha hali ya baadaye hapa kina nguvu ya agizo ndani ya maelekezo ya ujenzi; Kiswahili cha baadaye katika muundo wa kutendwa huwasilisha agizo hilo kwa kawaida.
- source_word: חֹבְרֹת
  choice: yataunganishwa
  rationale: Mzizi חבר una maana ya kuunganisha au kushikamanisha. “Yataunganishwa” ni wazi na wa kawaida kwa maagizo ya ujenzi.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: moja na jingine
  rationale: Kirai hiki kwa neno halisi ni “mwanamke kwa dada yake,” lakini ni nahau ya Kiebrania inayotaja vitu vya jinsi ya kike vinavyolingana na kuunganishwa. “Moja na jingine” huhifadhi uhusiano wa kila pazia na lingine kwa Kiswahili cha kawaida.
- source_word: חֲמֵשׁ ... וְחָמֵשׁ
  choice: matano ... na matano
  rationale: Muundo huu unagawa mapazia katika makundi mawili ya matano na unaakisi urudiaji wa Kiebrania bila kuongeza “kati ya.”
