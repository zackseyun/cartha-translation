base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/035.yaml
  text: And you shall place the table outside the veil[a], and the lampstand opposite the table on the south side of the tabernacle[b]; and you shall put the table on the north side.
translation:
  language: sw
  text: Nawe utaweka meza nje ya pazia[a], na kinara cha taa[b] mkabala na meza, upande wa kusini wa maskani; nawe utaiweka meza upande wa kaskazini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nje ya pazia la kutenganisha.” Neno la Kiebrania פָּרֹכֶת linamaanisha pazia la ndani lililotenganisha sehemu za maskani.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, menorah. Limetafsiriwa “kinara cha taa” ili kueleza maana ya kifaa hicho.
    reason: cultural_note
lexical_decisions:
- source_word: שַׂמְתָּ
  choice: utaiweka
  rationale: Kitenzi שׂוּם humaanisha kuweka au kupanga kitu mahali fulani; “utaiweka” ni Kiswahili cha kawaida na kinafaa kwa agizo kuhusu mahali pa samani za maskani.
- source_word: הַשֻּׁלְחָן
  choice: meza
  rationale: Nomino ya Kiebrania yenyewe ni “meza”; haiongezi hapa maelezo kuhusu mikate, kwa hiyo tafsiri haiongezi utambulisho unaotokana na muktadha.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: nje ya pazia
  rationale: מִחוּץ ni “nje ya,” na פָּרֹכֶת ni pazia la ndani lililotenganisha sehemu za maskani. “Pazia” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: הַמְּנֹרָה
  choice: kinara cha taa
  rationale: Badala ya kunukuu neno menorah, “kinara cha taa” kinaeleza wazi kifaa kinachokusudiwa na kuhifadhi maana ya nomino ya Kiebrania.
- source_word: נֹכַח
  choice: mkabala na
  rationale: Neno hili linaonyesha nafasi ya kitu kilichoelekeana na kingine; “mkabala na” ni usemi sahihi na wa kawaida wa mahali.
- source_word: עַל צֶלַע הַמִּשְׁכָּן תֵּימָנָה
  choice: upande wa kusini wa maskani
  rationale: צֶלַע hapa ni upande, na תֵּימָנָה huonyesha kuelekea kusini. Muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: תִּתֵּן
  choice: utaiweka
  rationale: Katika muktadha wa kupanga samani, נָתַן ina maana ya kuweka. Kurudia “utaiweka” kunadumisha uwazi na ulinganifu wa agizo.
- source_word: עַל צֶלַע צָפוֹן
  choice: upande wa kaskazini
  rationale: צֶלַע ni upande na צָפוֹן ni kaskazini; tafsiri hii inatoa maelekezo ya mahali kwa uwazi.
