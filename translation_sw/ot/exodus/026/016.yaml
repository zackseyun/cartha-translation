  text: The length of each frame shall be ten cubits[a], and the width of each frame one and a half cubits.
translation:
  language: sw
  text: Urefu wa kila kiunzi[a] utakuwa dhiraa kumi, na upana wake dhiraa moja na nusu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya kimapokeo zaidi, “ubao” badala ya “kiunzi” kwa neno la Kiebrania קֶרֶשׁ.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶרֶשׁ
  choice: kiunzi
  rationale: Katika maelezo ya ujenzi wa Maskani, neno hili linaonyesha sehemu wima ya muundo. “Kiunzi” huwasilisha kazi yake ya kimuundo bila kufafanua umbo lake kupita ushahidi wa Kiebrania; “ubao” ni tafsiri ya kimapokeo inayowezekana.
- source_word: עֶשֶׂר אַמּוֹת
  choice: dhiraa kumi
  rationale: Huhifadhi kipimo cha kale kama kilivyo katika chanzo badala ya kukibadili kuwa kipimo cha kisasa.
- source_word: אֹרֶךְ
  choice: urefu
  rationale: Ni neno la kawaida na wazi la Kiswahili kwa kipimo hiki.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: dhiraa moja na nusu
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kwa usahihi thamani ya dhiraa moja na nusu.
- source_word: רֹחַב
  choice: upana
  rationale: Ni neno la kawaida na linaloeleweka kwa urahisi katika maelezo ya vipimo.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: kila kiunzi
  rationale: Umoja wenye kibainishi pamoja na אֶחָד hapa unaeleza vipimo vya kila sehemu moja moja; “kila kiunzi” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
