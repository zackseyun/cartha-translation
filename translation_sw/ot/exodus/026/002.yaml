  text: אֹ֣רֶךְ הַ/יְרִיעָ֣ה הָֽ/אַחַ֗ת שְׁמֹנֶ֤ה וְ/עֶשְׂרִים֙ בָּֽ/אַמָּ֔ה וְ/רֹ֨חַב֙ אַרְבַּ֣ע בָּ/אַמָּ֔ה הַ/יְרִיעָ֖ה הָ/אֶחָ֑ת מִדָּ֥ה אַחַ֖ת לְ/כָל הַ/יְרִיעֹֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/002.yaml
  text: The length of each curtain shall be twenty-eight cubits[a], and the width of each curtain four cubits[b]; all the curtains shall have one measure.
translation:
  language: sw
  text: Urefu wa kila pazia utakuwa dhiraa ishirini na nane, na upana wa kila pazia utakuwa dhiraa nne; mapazia yote yatakuwa na kipimo kimoja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרֶךְ
  choice: urefu
  rationale: Ni neno la kawaida na sahihi la Kiswahili kwa kipimo cha upande mrefu katika maelekezo ya ujenzi.
- source_word: הַיְרִיעָה
  choice: pazia
  rationale: Katika muktadha wa hema takatifu, neno hili linamaanisha kipande kikubwa cha kitambaa kilichotumika kama kifuniko; ‘pazia’ ni istilahi ya kawaida na inayoeleweka.
- source_word: הָאַחַת / הָאֶחָת
  choice: kila
  rationale: 'Ingawa kihalisi ni ‘moja,’ muundo huu una maana ya mgawanyo: vipimo vinahusu kila pazia moja moja.'
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: ishirini na nane
  rationale: Uwasilishaji wa kawaida wa idadi hiyo katika Kiswahili.
- source_word: בָּאַמָּה
  choice: dhiraa
  rationale: ‘Dhiraa’ ni istilahi ya Kiswahili iliyozoeleka kwa kipimo cha kale אַמָּה; baada ya idadi umbo la nomino halibadiliki.
- source_word: וְרֹחַב
  choice: na upana
  rationale: ‘Upana’ huambatana kwa kawaida na ‘urefu’ katika kutaja vipimo.
- source_word: אַרְבַּע
  choice: nne
  rationale: Umbo la nambari linalopatana kisarufi na ‘dhiraa’ katika Kiswahili.
- source_word: מִדָּה אַחַת
  choice: kipimo kimoja
  rationale: Huhifadhi kwa karibu usemi halisi wa Kiebrania huku ukimaanisha kwamba mapazia yote yalikuwa na vipimo sawa.
- source_word: לְכָל הַיְרִיעֹת
  choice: mapazia yote
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kwamba kiwango hicho kimoja cha vipimo kinahusu seti nzima ya mapazia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Marudio ya ‘kila pazia’ yanahifadhi msisitizo wa mgawanyo wa maandishi ya Kiebrania bila kuleta tanbihi isiyohitajika.
