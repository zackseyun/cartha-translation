base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/006.yaml
  text: And you shall make fifty gold clasps[a], and join the curtains to one another with the clasps, so that the tabernacle may be one.
translation:
  language: sw
  text: Utengeneze vifungo hamsini vya dhahabu, na uyaunganishe mapazia hayo, kila moja kwa lingine[a], kwa vifungo hivyo; na Maskani itakuwa moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mwanamke kwa dada yake”—nahau ya Kiebrania inayomaanisha kwamba mapazia yaunganishwe kila moja kwa lingine linalolingana nalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utatengeneza
  rationale: Kitenzi hiki katika mfululizo wa maagizo kina nguvu ya amri; wakati ujao wa Kiswahili huwasilisha agizo hilo kwa lugha ya kawaida na yenye heshima.
- source_word: קַרְסֵי זָהָב
  choice: vifungo ... vya dhahabu
  rationale: קֶרֶס ni kifaa cha kuunganisha mapazia; “vifungo” huepuka kubainisha umbo lisilotajwa na huonyesha kazi yake ya kufungamanisha.
- source_word: וְחִבַּרְתָּ
  choice: kisha utaunganisha
  rationale: חבר humaanisha kuunganisha au kufungamanisha; “utaunganisha” ni ya asili katika maagizo ya ujenzi. “Kisha” huonyesha mwendelezo wa hatua bila kubadili maana.
- source_word: הַיְרִיעֹת
  choice: mapazia
  rationale: יְרִיעָה hapa ni vipande vikubwa vya kitambaa vya Maskani; “mapazia” ni istilahi inayoeleweka na iliyozoeleka katika muktadha huu.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: moja na lingine
  rationale: Hii ni nahau ya Kiebrania inayosema kihalisi “kila moja kwa dada yake,” lakini maana yake ni kuunganisha vitu vinavyolingana. Tafsiri hii ni ya asili huku tanbihi ikihifadhi taswira ya asili.
- source_word: בַּקְּרָסִים
  choice: kwa vifungo hivyo
  rationale: Kihusishi ב hapa huonyesha chombo kinachotumiwa; “kwa vifungo hivyo” kinaonyesha wazi jinsi mapazia yanavyounganishwa.
- source_word: וְהָיָה הַמִּשְׁכָּן אֶחָד
  choice: na Maskani itakuwa kitu kimoja
  rationale: Muundo huu unaeleza matokeo ya kuunganisha mapazia. “Itakuwa kitu kimoja” huhifadhi dai la umoja wa Maskani bila kuligeuza wazi kuwa kishazi cha kusudi.
theological_decisions:
- issue: Tafsiri ya הַמִּשְׁכָּן
  choice: Maskani
  alternative: makao; hema takatifu
  rationale: “Maskani” huhifadhi maana ya kiufundi ya mahali patakatifu pa kuishi kwa Mungu katika simulizi la Kutoka, ilhali “makao” ni ya jumla zaidi na “hema takatifu” huongeza kivumishi kisichopo hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mtiririko wa maagizo ya Kiebrania na matokeo yake; “Maskani” imetumiwa kama istilahi ya mahali patakatifu katika Kutoka.
