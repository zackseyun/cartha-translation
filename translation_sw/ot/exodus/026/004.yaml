base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/004.yaml
  text: And you shall make loops of blue on the edge of the one curtain at the end of the first set joined together[c][b][a]; and so you shall do on the edge of the outermost curtain in the second set joined together.
translation:
  language: sw
  text: Nawe utatengeneza vitanzi vya rangi ya buluu[a] kwenye ukingo wa pazia moja lililo mwishoni mwa fungu la kwanza lililounganishwa[b]; na vivyo hivyo utafanya kwenye ukingo wa pazia la mwisho[c] katika fungu la pili lililounganishwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “buluu yenye kuelekea urujuani”; neno la Kiebrania תְּכֵלֶת linamaanisha kitu kilichotiwa rangi maalumu ya buluu kilichotumiwa katika Maskani.
    reason: lexical_alternative
  - marker: b
    text: Maneno ya Kiebrania yanayotafsiriwa “fungu ... lililounganishwa” (חֹבָרֶת / מַחְבֶּרֶת) yanamaanisha kundi la mapazia yaliyounganishwa kuwa sehemu moja.
    reason: lexical_alternative
  - marker: c
    text: Au “pazia la nje kabisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: vitanzi
  rationale: Neno hili linamaanisha vitanzi vilivyowekwa ili kuunganisha mapazia; “vitanzi” ni neno la kawaida na sahihi katika muktadha huu.
- source_word: תְּכֵלֶת
  choice: vya rangi ya buluu
  rationale: Neno la Kiebrania linataja kitu chenye rangi maalumu ya buluu au buluu yenye kuelekea urujuani. Tafsiri hii haiongezi “uzi,” ambao haukutajwa wazi katika mstari.
- source_word: שְׂפַת
  choice: ukingo
  rationale: Katika muktadha wa kitambaa, “ukingo” hueleza kwa kawaida sehemu ya pembeni ya pazia.
- source_word: יְרִיעָה
  choice: pazia
  rationale: Katika Kutoka 26 neno hili linamaanisha vipande vya kitambaa vya Maskani; “pazia” linaeleweka kwa urahisi na linafaa katika muktadha.
- source_word: הָאֶחָת
  choice: moja
  rationale: Kiebrania kinasema kihalisi “moja,” si kwa wazi “la kwanza”; uchaguzi huu unahifadhi tofauti hiyo.
- source_word: מִקָּצָה
  choice: lililo mwisho
  rationale: Kirai hiki kinaonyesha mahali pa pazia kwenye mwisho wa fungu; muundo huu ni wa asili katika Kiswahili.
- source_word: חֹבָרֶת / מַחְבֶּרֶת
  choice: fungu ... lililounganishwa
  rationale: Maneno haya yanamaanisha mkusanyo wa mapazia yaliyounganishwa kuwa sehemu moja. “Fungu lililounganishwa” linaeleza maana ya kiutendaji na kudumisha uhusiano wa maneno hayo mawili.
- source_word: וְכֵן
  choice: na vivyo hivyo
  rationale: Hutambulisha agizo linalolingana; “na vivyo hivyo” ni wazi na la kawaida.
- source_word: הַקִּיצוֹנָה
  choice: la mwisho
  rationale: Kivumishi hiki humaanisha pazia lililo kwenye ncha au sehemu ya nje ya fungu; “la mwisho” ni fasaha na halilazimishi picha ya kijiometri.
- source_word: הַשֵּׁנִית
  choice: la pili
  rationale: Hutambulisha fungu la pili kati ya mafungu mawili.
