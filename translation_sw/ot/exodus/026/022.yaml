translation:
  language: sw
  text: Kwa upande wa nyuma wa Maskani[a], unaoelekea magharibi, utatengeneza mbao sita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viunzi” badala ya “mbao,” ikiwa vipande hivi vya jengo vinaeleweka kuwa fremu zilizo wazi badala ya mbao pana zilizo imara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: Kwa upande wa nyuma wa
  rationale: Muundo huu unataja sehemu ya mwisho au ya nyuma ya jengo; Kiswahili cha kawaida cha usanifu ni “upande wa nyuma.” Kiunganishi cha Kiebrania kinaeleweka katika mwendelezo wa maagizo bila kulazimisha “na” mwanzoni.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi iliyozoeleka katika Kiswahili cha Biblia kwa jengo takatifu la ibada linaloelezwa katika Kutoka, na hapa limeandikwa kwa herufi kubwa kama jina la jengo hilo mahususi.
- source_word: יָמָּה
  choice: upande wa magharibi
  rationale: Neno hili kihalisi linaelekeza upande wa bahari, yaani magharibi. “Upande wa magharibi” ni wazi na wa kawaida zaidi katika maelezo ya mahali kuliko “kuelekea magharibi” hapa.
- source_word: תַּעֲשֶׂה
  choice: utatengeneza
  rationale: Kauli ya wakati ujao katika muktadha huu wa maagizo ina nguvu ya amri. “Utatengeneza” inadumisha mtindo wa moja kwa moja na wenye hadhi.
- source_word: שִׁשָּׁה
  choice: sita
  rationale: Ni namba ya kawaida inayotaja idadi ya vipande vya ujenzi.
- source_word: קְרָשִׁים
  choice: mbao
  rationale: Katika maelezo ya Maskani, neno hili linataja vipande vya mbao vya kujenga kuta. “Mbao” ni istilahi ya kawaida na inayoeleweka, huku uwezekano wa “viunzi” ukihifadhiwa katika tanbihi.
