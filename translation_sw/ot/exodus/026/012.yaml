base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/012.yaml
  text: And the overhang that remains from the tent curtains[a]—the half curtain that remains over[b]—shall hang over the back of the tabernacle.
translation:
  language: sw
  text: Na ziada inayobaki kutoka mapazia ya hema[a]—yaani, nusu ya pazia linalozidi—itaning’inia juu ya upande wa nyuma wa Maskani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu inayoning’inia iliyobaki kutoka mapazia ya hema.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatofautisha kati ya “hema,” yaani tabaka la kifuniko, na “Maskani,” yaani makao.
    reason: cultural_note
lexical_decisions:
- source_word: סֶרַח
  choice: sehemu ya ziada
  rationale: Nomino hii inaeleza sehemu ya kitambaa iliyozidi na ambayo huning’inia; ‘sehemu ya ziada’ ni ya kawaida na inaeleweka katika muktadha huu wa ujenzi.
- source_word: הָעֹדֵף / הָעֹדֶפֶת
  choice: iliyobaki
  rationale: Vivumishi hivi vinaonyesha kilichosalia au kilichozidi baada ya mapazia kupangwa.
- source_word: יְרִיעֹת
  choice: mapazia
  rationale: Katika maelezo ya Maskani, neno hili hurejelea vipande vikubwa vya kitambaa vilivyotumika kama vifuniko.
- source_word: הָאֹהֶל
  choice: hema
  rationale: Hapa neno hili linataja tabaka la kifuniko cha hema, tofauti na מִשְׁכָּן inayotajwa baadaye.
- source_word: חֲצִי הַיְרִיעָה
  choice: nusu ya pazia
  rationale: Tafsiri hii inahifadhi rejeo la nusu ya pazia moja katika umoja.
- source_word: תִּסְרַח
  choice: itaning’inia
  rationale: Kitenzi kinaeleza sehemu ya ziada ya kitambaa ikining’inia au ikienea chini upande wa nyuma.
- source_word: עַל אֲחֹרֵי
  choice: nyuma ya
  rationale: Usemi huu unaonyesha mahali pa kitambaa kilichoning’inia kwenye upande wa nyuma wa jengo.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: ‘Maskani’ ni istilahi inayofaa kwa jengo takatifu la kukaliwa, na inahifadhi tofauti yake na ‘hema’ katika mstari huu.
theological_decisions:
- issue: Tofauti kati ya אֹהֶל na מִשְׁכָּן
  choice: 'Kutafsiri kwa maneno tofauti: ‘hema’ na ‘Maskani’'
  alternative: Kutumia ‘hema’ au ‘Maskani’ kwa maneno yote mawili
  rationale: Chanzo cha Kiebrania kinatofautisha kifuniko cha hema na jengo la Maskani; tafsiri haipaswi kufuta tofauti hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. ‘Sehemu ya ziada’ huepuka usemi mzito, huku ‘itaning’inia’ ikihifadhi picha halisi ya kitambaa kilichozidi. Alama zote za tanbihi zimewekwa katika matini.
