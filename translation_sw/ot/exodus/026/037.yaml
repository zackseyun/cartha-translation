  text: וְ/עָשִׂ֣יתָ לַ/מָּסָ֗ךְ חֲמִשָּׁה֙ עַמּוּדֵ֣י שִׁטִּ֔ים וְ/צִפִּיתָ֤ אֹתָ/ם֙ זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב וְ/יָצַקְתָּ֣ לָ/הֶ֔ם חֲמִשָּׁ֖ה אַדְנֵ֥י נְחֹֽשֶׁת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/037.yaml
  text: And you shall make for the screen five pillars of acacia wood[a], and overlay them with gold; their hooks shall be of gold[b]; and you shall cast for them five bases of bronze.
translation:
  language: sw
  text: Nawe utatengeneza kwa ajili ya pazia la mlangoni nguzo tano za mshita, na kuzifunika kwa dhahabu; kulabu zake ziwe za dhahabu; nawe utazitengenezea misingi mitano ya shaba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָּסָךְ
  choice: pazia la mlangoni
  rationale: Katika muktadha huu ni pazia linalofunika mwingilio wa Maskani, tofauti na pazia la ndani; kirai hiki kinaeleza kazi yake kwa Kiswahili cha kawaida.
- source_word: עַמּוּדֵי שִׁטִּים
  choice: nguzo tano za mshita
  rationale: עַמּוּדִים ni nguzo, na שִׁטִּים ni miti ya mshita iliyotumiwa katika ujenzi wa Maskani.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: kuzifunika kwa dhahabu
  rationale: Kitenzi צפה hapa humaanisha kufunika uso wa kitu kwa tabaka la metali.
- source_word: וָוֵיהֶם
  choice: kulabu zake
  rationale: וָוִים katika maagizo ya Maskani huelekea kumaanisha kulabu za kushikilia pazia; kiwakilishi kinaweza kurejelea nguzo hizo kama jumla.
- source_word: אַדְנֵי נְחֹשֶׁת
  choice: vikalio vitano vya shaba
  rationale: אַדָן ni msingi au tundu la msingi linalokalia nguzo; 'vikalio' linaeleza kazi hiyo kwa ufupi na kwa ufasaha.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Neno la kawaida la Kiswahili 'shaba' hutumika kwa metali hii ya kale, ambayo katika muktadha huu kwa kawaida hueleweka kuwa bronze.
- source_word: וְיָצַקְתָּ לָהֶם
  choice: utazitengenezea ... kwa kuimimina kwenye kalibu
  rationale: יצק hueleza kutengeneza kitu cha metali kwa kukimimina kikiwa kimeyeyushwa; לָהֶם huonyesha kuwa vikalio vinatengenezwa kwa ajili ya nguzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Pazia la mlangoni' limetumiwa kutofautisha kifuniko cha mwingilio na pazia la ndani bila kulazimisha istilahi ya kiufundi isiyo ya kawaida. Hakuna tanbihi iliyohitajika kwa kuwa tofauti muhimu zimefafanuliwa moja kwa moja katika matini.
