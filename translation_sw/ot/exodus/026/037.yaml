revisions:
- from: Nawe utatengeneza kwa ajili ya pazia la mlangoni nguzo tano za mshita, na kuzifunika kwa dhahabu. Kulabu zake zitakuwa za dhahabu, nawe utazitengenezea vikalio vitano vya shaba kwa kuimimina kwenye kalibu.
  to: Nawe utatengeneza kwa ajili ya pazia la mlangoni nguzo tano za mshita, na kuzifunika kwa dhahabu; kulabu zake ziwe za dhahabu; nawe utazitengenezea misingi mitano ya shaba.
  rationale: The revision removes the unstated reference to a mould, renders the casting instruction without added procedural detail, and uses the more natural 'misingi' for the bronze bases. It retains the entrance-specific wording for מָסָךְ and the formal instructional register.
