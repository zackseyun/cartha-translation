translation:
  language: sw
  text: Kila ubao utakuwa na ndimi mbili zilizounganishwa, moja kwa nyingine[a]; hivyo ndivyo utakavyotengeneza mbao zote za Maskani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “mikono miwili kwa ubao mmoja, iliyounganishwa, mwanamke kwa dada yake.” Hapa “mikono” inamaanisha sehemu zinazochomoza za mbao zinazotumika kuziunganisha, yaani ndimi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹת
  choice: ndimi
  rationale: Neno hili kwa kawaida humaanisha ‘mikono,’ lakini hapa linataja sehemu mbili zinazochomoza kwenye ubao ili ziingizwe katika vikalio. ‘Ndimi’ ni istilahi ya useremala inayoeleweka kwa viungo vya aina hii.
- source_word: מְשֻׁלָּבֹת
  choice: zilizounganishwa
  rationale: Kivumishi hiki kinaonyesha kuwa ndimi hizo mbili zimepangwa au kufungamanishwa kwa ulinganifu; ‘zilizounganishwa’ huhifadhi maana ya kimuundo bila kubainisha zaidi ya maandishi.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: moja na nyingine
  rationale: Nahau hii, kihalisi ‘mwanamke kwa dada yake,’ huonyesha ulinganifu wa sehemu mbili za aina moja. Tafsiri hii ni ya kawaida katika Kiswahili na bado inaonyesha uhusiano wa sehemu hizo.
- source_word: קֶרֶשׁ
  choice: ubao
  rationale: Katika maagizo ya Maskani, neno hili linataja kipande cha mbao kilichosimama katika muundo. ‘Ubao’ ni wazi na hauongezi dhana ya fremu isiyotajwa moja kwa moja.
- source_word: מִשְׁכָּן
  choice: Maskani
  rationale: Ingawa msingi wa neno unahusiana na kukaa, katika Kutoka ni jina maalumu la mahali patakatifu pa Mungu palipoweza kuhamishwa. ‘Maskani’ ni istilahi iliyozoeleka na yenye hadhi katika Kiswahili cha Biblia.
- source_word: כֵּן תַּעֲשֶׂה
  choice: hivyo ndivyo utakavyotengeneza
  rationale: Kauli hii inaelekeza kwamba muundo huo huo ufuatwe kwa mbao zote; tafsiri hii ni ya asili na huhifadhi nguvu ya agizo.
- source_word: שְׁתֵּי
  choice: mbili
  rationale: Ni namba inayovumisha ndimi za kila ubao.
- source_word: לַקֶּרֶשׁ הָאֶחָד
  choice: kila ubao
  rationale: Ingawa muundo wake ni ‘kwa ubao mmoja,’ katika muktadha una maana ya mgawanyo kwa kila ubao mmoja mmoja.
