reference: Exodus 26:33
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה אֶת הַ/פָּרֹכֶת֮ תַּ֣חַת הַ/קְּרָסִים֒ וְ/הֵבֵאתָ֥ שָׁ֨מָּ/ה֙ מִ/בֵּ֣ית לַ/פָּרֹ֔כֶת אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/הִבְדִּילָ֤ה הַ/פָּרֹ֨כֶת֙ לָ/כֶ֔ם בֵּ֣ין הַ/קֹּ֔דֶשׁ וּ/בֵ֖ין קֹ֥דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/033.yaml
  text: And you shall place the veil under the clasps[a], and there, within the veil, you shall bring the ark of the testimony[b]; and the veil shall separate for you between the Holy Place and the Most Holy Place.
translation:
  language: sw
  text: Nawe utaweka pazia chini ya vifungo, kisha utaleta Sanduku la Ushuhuda[a] humo, ndani ya pazia. Pazia hilo litawatenganishia Mahali Patakatifu na Mahali Patakatifu Sana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Sanduku la Agano.” Kiebrania hapa kinasema “Ushuhuda.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “Patakatifu pa Patakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹכֶת
  choice: pazia
  rationale: Neno hili linamaanisha pazia la ndani lililotenga sehemu ya ndani kabisa ya maskani. “Pazia” ni neno la kawaida na linalofaa kwa kizuizi hiki cha mahali patakatifu.
- source_word: קְרָסִים
  choice: vifungo
  rationale: Hivi ni vifaa vya kuunganisha mapazia ya maskani. “Vifungo” linaeleza kazi yake bila kudai umbo maalumu lisiloelezwa na neno la Kiebrania.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: upande wa ndani wa pazia
  rationale: Kirai hiki kinaelekeza mahali palipo ng’ambo ya pazia, ndani ya sehemu iliyotengwa. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi maana ya mahali.
- source_word: אֲרוֹן הָעֵדוּת
  choice: sanduku la Ushuhuda
  rationale: Kiebrania cha mstari huu kinasema “ushuhuda,” si “agano.” Tafsiri inafuata wording ya chanzo badala ya kuibadili iwe jina la kimapokeo “sanduku la agano.”
- source_word: וְהִבְדִּילָה
  choice: litatenganisha
  rationale: Hifili ya בדל ina maana ya kufanya utengano. “Litatenganisha” linaeleza wazi kazi ya pazia.
- source_word: לָכֶם
  choice: kwa ajili yenu
  rationale: Kirai hiki kinahifadhi kiwakilishi cha wingi kilichopo katika Kiebrania na kinaonyesha kazi ya pazia katika mpangilio wa ibada ya Israeli.
- source_word: הַקֹּדֶשׁ
  choice: Mahali Patakatifu
  rationale: Katika muktadha huu ni chumba cha nje cha mahali patakatifu, kinachotofautishwa na chumba cha ndani kabisa. Jina hili linaweka wazi tofauti ya maeneo hayo.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: Mahali Patakatifu Zaidi
  rationale: Muundo wa Kiebrania una nguvu ya kiwango cha juu, yaani “patakatifu kuliko pote.” “Mahali Patakatifu Zaidi” ni Kiswahili cha sasa kinachoeleweka na kinadumisha tofauti ya sehemu ya ndani kabisa.
theological_decisions:
- issue: Jina la sehemu ya ndani kabisa ya maskani
  choice: Mahali Patakatifu Zaidi
  alternative: Patakatifu pa Patakatifu
  rationale: Tafsiri kuu inawasilisha nguvu ya muundo wa kiwango cha juu wa Kiebrania kwa Kiswahili kinachoeleweka kwa urahisi; tafsiri ya karibu zaidi na umbo la Kiebrania imehifadhiwa katika tanbihi.
- issue: Tafsiri ya עֵדוּת katika jina la sanduku
  choice: sanduku la Ushuhuda
  alternative: sanduku la Agano
  rationale: Mstari huu unatumia neno “ushuhuda.” Hivyo tafsiri hailisawazishi kimyakimya na jina la kimapokeo “sanduku la Agano,” ingawa jina hilo limetolewa kama mbadala wa kimuktadha katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa amri ya wakati ujao umehifadhiwa, huku sentensi ikipangwa kwa mtiririko wa kawaida wa Kiswahili. Herufi kubwa katika majina ya maeneo na “Ushuhuda” zinaonyesha matumizi yake kama istilahi maalumu katika muktadha wa maskani.
