translation:
  language: sw
  text: Nawe utatengeneza fito tano za mshita kwa ajili ya viunzi vya upande mmoja wa Maskani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbao” badala ya “viunzi”; neno la Kiebrania linarejelea sehemu za muundo wa Maskani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utatengeneza
  rationale: Kauli timilifu ya Qal yenye kiunganishi katika mfululizo wa maagizo ina nguvu ya amri; Kiswahili cha wakati ujao kinahifadhi mtindo wa maagizo ya ujenzi.
- source_word: בְרִיחִם
  choice: fito
  rationale: Katika muktadha huu neno linamaanisha fito za kuunganisha na kushikilia viunzi; “fito” ni la kawaida na haliongezi maana ya kuvuka isiyotajwa wazi.
- source_word: עֲצֵי שִׁטִּים
  choice: za mbao za mshita
  rationale: Hii ni kauli ya uhusiano inayomaanisha mbao kutoka katika mti wa mshita; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: חֲמִשָּׁה
  choice: tano
  rationale: Namba ya kawaida inayovumiliana na nomino “fito” katika ngeli ya N.
- source_word: לְקַרְשֵׁי
  choice: kwa ajili ya viunzi
  rationale: Neno la Kiebrania humaanisha vipande vya muundo vilivyosimama vya Maskani. “Viunzi” linaonyesha kazi yake ya kimuundo, huku mbadala wa jadi “mbao” ukibainishwa katika tanbihi.
- source_word: צֶלַע
  choice: upande
  rationale: Katika muktadha huu neno linarejelea upande wa jengo, si ubavu halisi.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi ya Kiswahili iliyozoeleka kwa hema takatifu la Kutoka na pia huhifadhi dhana ya mahali pa kukaa.
- source_word: הָאֶחָד
  choice: mmoja
  rationale: Neno linabainisha upande mmoja kati ya pande zinazolingana; “upande mmoja” ni Kiswahili cha kawaida na huandaa ulinganisho na upande wa pili katika mstari unaofuata.
