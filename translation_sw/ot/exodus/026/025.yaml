  text: 'There shall be eight frames[a], with their silver bases: sixteen bases[b], two bases under one frame and two bases under the other frame.'
translation:
  language: sw
  text: 'Kutakuwa na mabamba nane ya mbao[a], yenye vitako vya fedha: vitako kumi na sita[b], vitako viwili chini ya ubao mmoja na vitako viwili chini ya ubao mwingine.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbao.”
    reason: lexical_alternative
  - marker: b
    text: Au “misingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָשִׁים
  choice: nguzo za mbao
  rationale: Katika muktadha wa ujenzi wa Maskani, neno hili linataja vipande vya mbao vilivyosimama na kutegemeza jengo. “Nguzo za mbao” ni wazi kwa msomaji wa Kiswahili na huonyesha kazi yake ya kimuundo; “mbao” peke yake ni mbadala wa karibu zaidi kwa umbo la neno.
- source_word: אַדְנֵי/הֶם ... אֲדָנִים
  choice: vitako
  rationale: Neno linataja sehemu za kutegemezea zilizo chini ya nguzo za mbao. “Vitako” linafaa katika maelezo ya ujenzi na hudumisha wazo la sehemu ambazo nguzo hukalia; “misingi” ni mbadala unaoeleweka kwa upana.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Ni jina la moja kwa moja la nyenzo iliyotumiwa kutengeneza vitako.
- source_word: שִׁשָּׁה עָשָׂר
  choice: kumi na sita
  rationale: Hii ndiyo namna ya kawaida ya kutaja idadi hiyo kwa Kiswahili.
- source_word: תַּחַת
  choice: chini ya
  rationale: Tafsiri ya kawaida ya uhusiano wa mahali katika maelekezo haya ya ujenzi.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: nguzo moja ya mbao ... nguzo nyingine ya mbao
  rationale: Kiebrania hurudia kihalisi “nguzo moja.” Kiswahili cha kawaida hutumia “moja ... nyingine” kuonyesha ugawaji wa vitako viwili kwa kila mojawapo ya nguzo mbili bila kuingiza wazo la mfuatano.
- source_word: וְהָיוּ
  choice: Zitakuwa
  rationale: Huwasilisha kwa kawaida sentensi ya maelezo ya idadi na mpangilio, huku kiambishi cha ngeli kikirejelea nguzo.
