  text: You shall overlay the frames with gold[a], and you shall make their rings of gold as holders for the bars[b], and you shall overlay the bars with gold.
translation:
  language: sw
  text: Utavifunika viunzi hivyo[a] kwa dhahabu, na utatengeneza pete za viunzi hivyo kwa dhahabu ziwe vishikio[b] vya mataruma. Nawe utayafunika mataruma hayo kwa dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbao.” Neno la Kiebrania linataja vipande vya muundo wa Maskani vilivyosimamishwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa maana halisi ni “nyumba za mataruma,” yaani, sehemu za kupokea au kushikilia mataruma.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: viunzi
  rationale: Neno hili linataja vipande vya muundo vilivyosimamishwa kuunda kuta za Maskani. “Viunzi” linaonyesha kazi yake ya kimuundo; “mbao” pia linawezekana.
- source_word: תְּצַפֶּה / וְצִפִּיתָ
  choice: utavifunika / utayafunika
  rationale: Katika muktadha huu צפה katika piel humaanisha kufunika kitu kwa safu ya nyenzo fulani, hapa dhahabu. Kauli hii ni ya kawaida na inaeleweka katika Kiswahili cha sasa.
- source_word: זָהָב
  choice: dhahabu
  rationale: Ni jina la moja kwa moja la nyenzo hiyo. Limedumishwa katika sehemu zote tatu kama ilivyo katika Kiebrania.
- source_word: טַבְּעֹתֵיהֶם
  choice: pete za viunzi hivyo
  rationale: Tafsiri hii inaonyesha wazi kuwa pete hizo zilikuwa za viunzi, huku ikiepuka utata wa kiwakilishi katika Kiswahili.
- source_word: תַּעֲשֶׂה
  choice: utatengeneza
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya עשה katika maagizo ya utengenezaji.
- source_word: בָּתִּים לַבְּרִיחִם
  choice: ziwe vishikio vya mataruma
  rationale: Ingawa maana halisi ni “nyumba za mataruma,” hapa neno hilo linamaanisha sehemu zilizoshikilia au kupokea mataruma. “Vishikio” linaeleza kazi hiyo kwa Kiswahili cha kawaida.
- source_word: הַבְּרִיחִם
  choice: mataruma
  rationale: Neno hili linataja fito imara zilizopita kwenye pete na kushikilia viunzi pamoja. “Mataruma” ni istilahi inayoeleweka katika muktadha huu wa ujenzi.
