  text: And you shall make for the tent a covering of rams’ skins dyed red[a], and a covering of tahash skins above.
translation:
  language: sw
  text: Nawe utafanya kifuniko kwa ajili ya hema cha ngozi za kondoo dume zilizotiwa rangi nyekundu, na kifuniko cha ngozi za tahashi juu yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maana ya neno la Kiebrania tahashi haijulikani kwa hakika. Huenda likarejelea mnyama fulani au aina ya ngozi imara; tafsiri zilizopendekezwa ni pamoja na “ngozi bora,” “ngozi za pomboo,” au “ngozi za nguva.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utaifanyia
  rationale: Kitenzi kamilifu cha Qal chenye kiunganishi katika mfululizo wa maagizo kina nguvu ya amri; wakati ujao wa Kiswahili unatoa agizo hilo kwa namna ya kawaida na yenye heshima.
- source_word: מִכְסֶה לָאֹהֶל
  choice: hema kifuniko
  rationale: מִכְסֶה ni kifuniko au tabaka la kinga, na אֹהֶל humaanisha kihalisi hema. Muundo 'utaifanyia hema kifuniko' unawakilisha לָ kwa Kiswahili cha asili bila kubadili 'hema' kuwa neno pana zaidi la 'Maskani'.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: ngozi za kondoo dume zilizotiwa rangi nyekundu
  rationale: אֵילִם ni kondoo dume, na מְאָדָּמִים huonyesha ngozi zilizofanywa nyekundu. 'Zilizotiwa rangi nyekundu' ni wazi na huepuka kudokeza kwamba kondoo wenyewe walikuwa wekundu.
- source_word: וּמִכְסֵה
  choice: na ... kifuniko
  rationale: Kurudiwa kwa nomino kunaonyesha tabaka la pili la kufunika; tafsiri inahifadhi urudiaji huo bila kuongeza neno kama 'kingine' lisilosemwa wazi.
- source_word: עֹרֹת תְּחָשִׁים
  choice: ngozi za tahashi
  rationale: Utambulisho wa תְּחָשִׁים hauna uhakika. Kutohoa neno kama 'tahashi' huhifadhi utata wa chanzo badala ya kuchagua mnyama au aina ya ngozi kwa kubahatisha.
- source_word: מִלְמָעְלָה
  choice: juu yake
  rationale: Katika muktadha wa matabaka ya vifuniko, neno hili linaonyesha kifuniko cha nje kilichowekwa juu. 'Juu yake' ni Kiswahili cha kawaida kinachoeleza uhusiano huo bila kufafanua zaidi ya muktadha.
