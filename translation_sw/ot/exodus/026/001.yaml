base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/001.yaml
  text: And you shall make the tabernacle with ten curtains of finely twisted linen[a], and blue and purple and scarlet yarn; with cherubim, the work of a skillful designer, you shall make them.
translation:
  language: sw
  text: Nawe utaifanya Maskani kwa mapazia kumi ya kitani safi iliyosokotwa, na nyuzi za buluu, zambarau, na nyekundu ang'avu. Uyafanye yakiwa na makerubi, kwa kazi ya kisanaa ya fundi stadi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uyafanye yakiwa na makerubi yaliyofanywa kwa ustadi.” Kirai cha Kiebrania מַעֲשֵׂה חֹשֵׁב kinamaanisha kazi ya kisanaa yenye usanifu katika kitambaa, lakini hakitaji wazi mbinu iliyotumiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: Neno hili linataja makao matakatifu ya Mungu, yaani hema-takatifu. “Maskani” linahifadhi wazo la mahali pa kukaa na linafaa kama istilahi ya jengo hili maalumu.
- source_word: יְרִיעֹת
  choice: mapazia
  rationale: Katika muktadha wa ujenzi wa Maskani, neno hili linamaanisha vipande vikubwa vya kitambaa vilivyotumika kama mapazia au vifuniko.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: kitani safi iliyosokotwa
  rationale: שֵׁשׁ ni kitani safi, na מָשְׁזָר huonyesha nyuzi zilizosokotwa; tafsiri hii inawasilisha nyenzo pamoja na utayarishaji wake.
- source_word: תְּכֵלֶת
  choice: nyuzi za rangi ya buluu
  rationale: Ni rangi ya kawaida katika vifaa vya Maskani; kutaja nyuzi kunadhihirisha muktadha wa ufumaji.
- source_word: אַרְגָּמָן
  choice: zambarau
  rationale: Neno hili linataja kitambaa au nyuzi zilizotiwa rangi ya zambarau.
- source_word: תֹלַעַת שָׁנִי
  choice: nyekundu
  rationale: Kirai hiki kinataja rangi nyekundu kali inayotokana na rangi ya nguo; “nyekundu” ni ya kawaida na inaeleweka kwa urahisi katika Kiswahili.
- source_word: כְּרֻבִים
  choice: makerubi
  rationale: “Makerubi” linahifadhi istilahi maalumu ya viumbe hawa katika mazingira ya ibada bila kuwaleta karibu na picha za kimapokeo zisizo katika maandiko.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: kazi ya fundi mbunifu
  rationale: Kirai hiki kinasisitiza ufundi wa kisanaa uliopangwa kwa ustadi, bila kulazimisha mbinu fulani kama kushona au kufuma.
- source_word: וְאֶת ... תַּעֲשֶׂה
  choice: Nawe utaifanya
  rationale: Kiunganishi kinaendeleza maagizo yaliyotangulia, huku kiambishi cha nafsi ya pili kikidumisha agizo la moja kwa moja.
- source_word: אֹתָם
  choice: utayafanya
  rationale: Kiambishi cha ngeli ya mapazia kinaonyesha wazi kuwa kitu kinachotengenezwa hapa ni yale mapazia kumi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. “Maskani” limetumiwa kama istilahi ya mahali hapa maalumu, na sentensi imegawanywa mara mbili ili maagizo marefu yasomeke kwa urahisi.
