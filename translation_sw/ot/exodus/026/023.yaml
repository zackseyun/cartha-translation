  text: And you shall make two boards for the corners of the tabernacle at the rear[a].
translation:
  language: sw
  text: Na utatengeneza mbao mbili kwa ajili ya pembe za Maskani, kwenye pande mbili za nyuma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya vipande vya pembe vya Maskani, kwenye sehemu zake mbili za nyuma.” Maneno ya Kiebrania yanahusu ujenzi na yana maana ya kitaalamu kwa kiasi fulani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: Nawe ... mbili
  rationale: Kiunganishi kinaendeleza mfululizo wa maagizo, huku umbo la kutaja idadi likitafsiriwa kwa Kiswahili cha kawaida kama “mbao mbili.”
- source_word: קְרָשִׁים
  choice: mbao
  rationale: Katika muktadha wa ujenzi wa Maskani, neno hili linamaanisha vipande vya mbao vya kimuundo; “mbao” ni neno la kawaida na halidokezi bila msingi kuwa vilikuwa fremu au mbao nyembamba.
- source_word: תַּעֲשֶׂה
  choice: utatengeneza
  rationale: Kauli ya nafsi ya pili umoja katika maagizo haya ina nguvu ya kuagiza; “utatengeneza” huhifadhi muundo wa wakati ujao wenye maana ya agizo kwa Kiswahili cha kawaida.
- source_word: לִ/מְקֻצְעֹת
  choice: kwa ajili ya pembe
  rationale: Neno linarejelea pembe au sehemu zenye kuunganisha kwa mwinamo. Tafsiri hii ni wazi bila kulifafanua kupita kiasi kama vipande maalumu vya pembe.
- source_word: הַ/מִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi iliyozoeleka katika Kiswahili cha Biblia kwa hema takatifu la makao katika Kutoka, na pia huhifadhi wazo la mahali pa kukaa.
- source_word: בַּ/יַּרְכָתָיִם
  choice: upande wa nyuma
  rationale: Umbo la uwili linaashiria sehemu mbili za mwisho upande wa nyuma. Kwa kuwa mbao mbili na pembe tayari zimetajwa, “upande wa nyuma” ni ya asili na huepuka kurudia “pembe” huku tanbihi ikihifadhi uwezekano wa tafsiri ya kiufundi.
