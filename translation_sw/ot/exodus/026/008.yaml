base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/008.yaml
  text: The length of each curtain shall be thirty cubits[a], and the width of each curtain four cubits[b]; all eleven curtains shall have one measure.
translation:
  language: sw
  text: Urefu wa kila pazia utakuwa dhiraa thelathini[a], na upana wa kila pazia utakuwa dhiraa nne; mapazia yote kumi na moja yatakuwa na kipimo kimoja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “pazia lile moja”; Kiebrania kinatumia muundo huu kwa maana ya kila pazia moja moja.
    reason: lexical_alternative
  - marker: b
    text: Au, “kipimo kilekile.” Usemi wa Kiebrania ni “kipimo kimoja,” ukisisitiza kwamba mapazia yote kumi na moja yalikuwa na vipimo vinavyofanana.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: urefu
  rationale: Ni neno la kawaida la vipimo, hapa likioanishwa na רֹחַב, ‘upana’.
- source_word: יְרִיעָה
  choice: pazia
  rationale: Katika muktadha wa maskani, neno hili humaanisha kipande kikubwa cha kitambaa cha kuning'inizwa au kufunika; ‘pazia’ ni la kawaida na wazi katika Kiswahili.
- source_word: הָאַחַת / הָאֶחָת
  choice: kila
  rationale: Ingawa muundo wa Kiebrania ni ‘lile moja,’ hapa umetumiwa kwa maana ya ugaw distributivu, yaani kila pazia moja moja.
- source_word: שְׁלֹשִׁים בָּאַמָּה
  choice: dhiraa thelathini
  rationale: Imehifadhi dhiraa, kipimo cha kale kilichotajwa katika chanzo, badala ya kukibadili kuwa kipimo cha kisasa.
- source_word: רֹחַב
  choice: upana
  rationale: Ni kisawe cha kawaida na cha sasa kinacholingana vizuri na ‘urefu’.
- source_word: אַרְבַּע בָּאַמָּה
  choice: dhiraa nne
  rationale: Huhifadhi moja kwa moja idadi na kipimo cha Kiebrania.
- source_word: מִדָּה אַחַת
  choice: kipimo kimoja
  rationale: Hufuata kwa karibu usemi halisi wa Kiebrania na kusisitiza kuwa mapazia yote yalikuwa na vipimo sawa.
- source_word: לְעַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: mapazia yote kumi na moja
  rationale: Hutambulisha kwa Kiswahili cha kawaida kundi zima ambalo lilipaswa kuwa na kipimo kilekile.
