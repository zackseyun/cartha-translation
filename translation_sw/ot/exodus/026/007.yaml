  text: וְ/עָשִׂ֨יתָ֙ יְרִיעֹ֣ת עִזִּ֔ים לְ/אֹ֖הֶל עַל הַ/מִּשְׁכָּ֑ן עַשְׁתֵּי עֶשְׂרֵ֥ה יְרִיעֹ֖ת תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/007.yaml
  text: You shall make curtains of goats’ hair for a tent over the tabernacle[a]; you shall make them as eleven curtains.
translation:
  language: sw
  text: Utengeneze mapazia ya singa za mbuzi ili yawe hema juu ya Maskani; utengeneze mapazia kumi na moja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Utengeneze
  rationale: Kauli ya maagizo inatolewa kwa Musa; umbo la tegemezi la Kiswahili linawasilisha amri kwa lugha ya kawaida na yenye hadhi.
- source_word: יְרִיעֹת
  choice: mapazia
  rationale: Katika muktadha wa ujenzi wa Maskani, neno hili linamaanisha vipande vikubwa vya kitambaa vinavyoning'inizwa au kutandazwa; “mapazia” ni neno la kawaida na linalofaa.
- source_word: עִזִּים
  choice: singa za mbuzi
  rationale: Kiebrania kinasema kihalisi “mbuzi,” lakini hapa humaanisha nyenzo inayotokana na mbuzi. “Singa za mbuzi” huonyesha wazi nywele ndefu zilizotumiwa kutengeneza kitambaa.
- source_word: לְאֹהֶל
  choice: ili yawe hema
  rationale: 'Kihusishi kinaonyesha kusudi au matokeo: mapazia hayo yanafanyizwa kuwa kifuniko cha hema. Tafsiri hii ni ya asili katika Kiswahili.'
- source_word: עַל הַמִּשְׁכָּן
  choice: juu ya Maskani
  rationale: “Juu ya” huhifadhi maana ya mahali, na “Maskani” hutumiwa kama jina la kiufundi la mahali patakatifu pa kukaa kwa Mungu katika muktadha huu.
- source_word: עַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת תַּעֲשֶׂה אֹתָם
  choice: utengeneze mapazia kumi na moja
  rationale: Huhifadhi idadi ya mapazia kwa Kiswahili fasaha bila kurudia kiwakilishi kisicho cha lazima; kurudiwa kwa kitenzi katika Kiebrania kumehifadhiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Maskani” imeandikwa kwa herufi kubwa kama istilahi maalumu ya jengo takatifu, huku “hema” likibaki jina la kawaida. “Singa” ni sahihi zaidi kuliko “manyoya” kwa nywele ndefu za mbuzi zinazotumiwa kutengeneza kitambaa.
