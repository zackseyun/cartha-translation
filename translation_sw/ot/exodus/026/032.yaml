  text: And you shall hang it on four pillars of acacia wood overlaid with gold[a], their hooks being of gold, on four silver bases.
translation:
  language: sw
  text: Nawe utaitundika juu ya nguzo nne za mti wa mshita zilizofunikwa kwa dhahabu, zenye kulabu za dhahabu; nguzo hizo zitasimama juu ya vitako vinne vya fedha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “soketi nne za fedha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: utaitundika
  rationale: Ingawa נתן kwa kawaida humaanisha kuweka, pazia ndilo kitu kinachowekwa juu ya nguzo zenye kulabu; kwa Kiswahili cha kawaida, “kutundika” hueleza tendo linalokusudiwa kwa usahihi.
- source_word: אֹתָהּ
  choice: -i- katika “utaitundika”
  rationale: Kiwakilishi hiki cha umoja wa kike kinarejelea pazia la mstari uliotangulia; katika Kiswahili rejeo hilo linaonyeshwa kimaumbile kwa kiambishi cha yambwa cha ngeli ya pazia.
- source_word: עַל אַרְבָּעָה עַמּוּדֵי
  choice: juu ya nguzo nne
  rationale: עַל ni kihusishi cha mahali, na עמוד humaanisha tegemeo lililosimama; “nguzo” ni neno la kawaida na linalofaa katika muktadha wa maskani.
- source_word: שִׁטִּים
  choice: mti wa mshita
  rationale: Neno hili linataja mbao za acacia; “mti wa mshita” ni istilahi ya Kiswahili inayoeleweka na, baada ya “nguzo,” inaonyesha nyenzo iliyotumiwa.
- source_word: מְצֻפִּים זָהָב
  choice: zilizofunikwa kwa dhahabu
  rationale: Kauli tendwa ya צפה inaonyesha kwamba nguzo zilipakwa au kufunikwa kwa tabaka la dhahabu; usemi huu ni wa kawaida na haudokezi kwamba zilikuwa dhahabu tupu.
- source_word: וָוֵיהֶם
  choice: kulabu zake
  rationale: וָו hapa ni vifaa vya kuning’inizia pazia kwenye nguzo; “kulabu” hueleza kazi yake kwa uwazi kuliko “vigingi.”
- source_word: זָהָב
  choice: za dhahabu
  rationale: Hii inaeleza nyenzo za kulabu kwa Kiswahili cha kawaida.
- source_word: אַדְנֵי כָסֶף
  choice: vikalio vinne vya fedha
  rationale: אדן ni msingi au tundu la chini linaloshikilia nguzo. “Vikalio” ni wazi kwa msomaji wa kawaida, huku maana mahsusi zaidi ya “soketi” ikihifadhiwa katika tanbihi.
