translation:
  language: sw
  text: na vipingo vya mlalo vitano kwa ajili ya mbao za upande wa pili wa Maskani[a], na vipingo vya mlalo vitano kwa ajili ya mbao za upande wa nyuma wa Maskani, upande wa magharibi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upande mwingine wa Maskani.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “nyuma, kuelekea magharibi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: mataruma
  rationale: Katika maelezo ya ujenzi wa Maskani, neno hili linamaanisha vipande virefu vya mlalo vilivyoshikilia mbao pamoja. “Mataruma” ni neno la kawaida na lenye heshima katika muktadha wa ujenzi.
- source_word: קַרְשֵׁי
  choice: mbao
  rationale: Neno hili linataja vipande vya mbao vilivyounda kuta za Maskani. “Mbao” ni wazi na halilazimishi kuelewa umbo lake kuwa fremu au ubao mpana.
- source_word: צֶלַע
  choice: upande
  rationale: Katika maelezo ya jengo, maana yake ni upande wa muundo; “upande” ni tafsiri ya asili na iliyo wazi.
- source_word: הַשֵּׁנִית
  choice: wa pili
  rationale: Huhifadhi moja kwa moja maana ya mpangilio ya Kiebrania. Katika muktadha inaweza pia kueleweka kuwa upande mwingine.
- source_word: מִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi ya Kiswahili inayofaa kwa makao matakatifu yanayoelezwa katika Kutoka, huku ikihifadhi uhusiano wa neno la Kiebrania na kukaa.
- source_word: לַיַּרְכָתַיִם
  choice: wa nyuma
  rationale: Katika muktadha huu wa usanifu, neno hilo linaonyesha sehemu ya mwisho au ya nyuma ya Maskani.
- source_word: יָמָּה
  choice: kuelekea magharibi
  rationale: Ni kielezi cha mwelekeo kinachomaanisha upande wa magharibi; tafsiri hii ni sahihi na ya kawaida kwa Kiswahili.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: na mataruma matano ... na mataruma matano
  rationale: Kurudia kiunganishi na idadi kunahifadhi muundo wa orodha na urari wa sentensi ya Kiebrania.
