  text: But if it is torn by beasts[a], he shall bring it as evidence; he shall not make restitution for what was torn.
translation:
  language: sw
  text: Lakini ikiwa mnyama huyo ameraruliwa kabisa na wanyama[a], ataleta mnyama huyo kuwa ushahidi; hatalipa fidia kwa mnyama aliyeraruliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini ikiwa mnyama huyo ameraruliwa vipandevipande, ataleta mnyama aliyeraruliwa kuwa ushahidi; hatalipa fidia.”
    reason: Muundo wa Kiebrania husisitiza kwamba mnyama aliraruliwa; neno hilo linaweza kueleweka kama kuraruliwa na mnyama mwingine au kwa ujumla kama kuraruliwa vipandevipande.
lexical_decisions:
- source_word: אִם
  choice: Lakini ikiwa
  rationale: Inaingiza hali nyingine ya kisheria kwa kulinganisha na sharti lililotangulia; “Lakini ikiwa” huendeleza mtiririko huo kwa Kiswahili cha kawaida.
- source_word: טָרֹף יִטָּרֵף
  choice: ameliwararua kabisa mnyama huyo
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichotimilika unasisitiza kuraruliwa. Kutaja mnyama anayewinda kunafaa muktadha, ingawa neno lenyewe linaweza pia kueleweka kwa ujumla kuwa kuraruliwa vipandevipande.
- source_word: יְבִאֵהוּ
  choice: ataleta mabaki yake
  rationale: Hifili ya בוא humaanisha kuleta au kuwasilisha. Katika hali hii, kinacholetwa kwa kawaida ni mabaki ya mnyama aliyeraruliwa; “mabaki yake” hufanya rejeo la kiwakilishi lieleweke kwa Kiswahili.
- source_word: עֵד
  choice: kuwa ushahidi
  rationale: Ingawa עֵד kwa kawaida ni shahidi, hapa mabaki yanawasilishwa kuthibitisha tukio, hivyo “ushahidi” huwasilisha kazi yake ya kisheria kwa lugha ya kawaida.
- source_word: הַטְּרֵפָה
  choice: mnyama aliyeraruliwa
  rationale: Nomino hii humaanisha kile kilichoraruliwa, na katika muktadha ni mnyama au mzoga wake. Uchaguzi huu ni wazi bila kuamua kwamba ni mzoga mzima.
- source_word: לֹא יְשַׁלֵּם
  choice: hatalipa fidia
  rationale: Katika sheria hizi, פיעל ya שלם hueleza kulipa fidia au kurejesha thamani, si malipo ya kawaida tu.
