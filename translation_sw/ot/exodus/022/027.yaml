  text: Usimtukane Mungu[a], wala usimlaani mtawala miongoni mwa watu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waamuzi”; neno אֱלֹהִים katika baadhi ya miktadha linaweza kuwarejelea wenye mamlaka wa kibinadamu, ingawa tafsiri ya “Mungu” inafaa zaidi katika usambamba wa hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa neno hili linaweza kumaanisha miungu au, katika baadhi ya miktadha, waamuzi wenye mamlaka, hapa maana ya umoja ‘Mungu’ inafaa zaidi katika sambamba na katazo la kumlaani mtawala. Tafsiri ‘waamuzi’ imehifadhiwa katika tanbihi.
- source_word: תְקַלֵּל
  choice: usimtukane
  rationale: Kitenzi קלל katika Piel kinaweza kuonyesha kutukana, kudharau, au kunenea vibaya. ‘Usimtukane’ ni Kiswahili cha kawaida kinachoonyesha usemi wa dharau na pia kutofautisha kitenzi hiki na ארר katika kishazi cha pili.
- source_word: נָשִׂיא
  choice: mtawala
  rationale: נָשִׂיא humaanisha mtu aliyeinuliwa kuwa kiongozi au mkuu. ‘Mtawala’ linaonyesha mamlaka yake katika muktadha huu wa kisheria bila kutumia neno la kizamani au lenye maana finyu.
- source_word: בְעַמְּךָ
  choice: miongoni mwa watu wako
  rationale: Kihusishi ב hapa kinaeleza kuwa mtawala huyo yumo ndani ya jamii ya watu wanaozungumziwa. ‘Miongoni mwa watu wako’ ni tafsiri ya asili na iliyo wazi katika Kiswahili.
- source_word: תָאֹר
  choice: usimlaani
  rationale: Kitenzi ארר ni neno la kawaida la Kiebrania linalomaanisha kulaani. ‘Usimlaani’ linatoa maana hiyo kwa uwazi na kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kirejelewa cha אֱלֹהִים
  choice: Mungu
  alternative: waamuzi; miungu
  rationale: 'Muktadha wa sheria na usambamba na ‘mtawala miongoni mwa watu wako’ unaunga mkono maana ‘Mungu’: mstari unakataza kumtukana Mungu na kumlaani kiongozi wa kibinadamu. Hata hivyo, kwa kuwa אֱלֹהִים linaweza katika baadhi ya miktadha kuwarejelea waamuzi au wenye mamlaka, uwezekano huo muhimu umehifadhiwa katika tanbihi badala ya kufichwa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Usimtukane … wala usimlaani …’ ni wa kawaida na unaohifadhi usambamba wa vifungu viwili pamoja na tofauti kati ya vitenzi vya Kiebrania.
