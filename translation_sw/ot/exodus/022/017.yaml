lexical_decisions:
- source_word: מְכַשֵּׁפָה
  choice: mwanamke mchawi
  rationale: Nomino ya Kiebrania iko katika umoja wa kike na humaanisha mwanamke anayefanya uchawi. Kiswahili ‘mchawi’ hakionyeshi jinsia kwa umbo lake, hivyo ‘mwanamke’ imeongezwa ili kuhifadhi jinsia iliyo wazi katika chanzo.
- source_word: לֹא
  choice: usi-
  rationale: Kikanushi cha Kiebrania kimetolewa kwa kiambishi cha kukataza ‘usi-’ katika kitenzi, ambayo ni njia ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: תְחַיֶּה
  choice: usimwache aishi
  rationale: Kitenzi hiki cha Piel, nafsi ya pili umoja wa kiume, kina maana ya kusababisha au kuruhusu kuendelea kuwa hai. ‘Usimwache aishi’ ni Kiswahili cha asili kinachohifadhi nguvu ya maneno ya chanzo bila kuyapanua kuwa tamko la moja kwa moja la namna ya adhabu.
theological_decisions:
- issue: Jinsia ya mtu anayefanya uchawi
  choice: Kuhifadhi umoja wa kike kwa ‘mwanamke mchawi.’
  alternative: Kutumia ‘mchawi’ peke yake au ‘mtu anayefanya uchawi.’
  rationale: Chanzo kimemtaja mwanamke kwa wazi; tafsiri ya kijumla ingeondoa kipengele hicho cha maandishi.
- issue: Nguvu ya katazo la kisheria
  choice: ‘Usimwache aishi.’
  alternative: ‘Lazima auawe.’
  rationale: Ingawa muktadha wa sheria unaonyesha adhabu ya kifo, Kiebrania kinasema kihalisi kutomwacha au kutomhifadhi hai. Tafsiri haiongezi utaratibu wa adhabu ambao haukutajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa kumtaja mhusika kwanza unadumisha mkazo wa Kiebrania.
