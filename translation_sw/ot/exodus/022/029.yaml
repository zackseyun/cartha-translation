base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/029.yaml
  text: 'You shall do the same with your ox and with your flock: seven days it shall remain with its mother[b][a]; on the eighth day you shall give it to me.'
translation:
  language: sw
  text: 'Vivyo hivyo utafanya kwa ng’ombe wako na kwa kundi lako: atakaa pamoja na mama yake kwa siku saba[b][a]; siku ya nane utampa mimi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakuwa pamoja na mama yake.” Kiebrania ni hivyo kihalisi; “atakaa” huonyesha hali ya kuendelea kwa muda katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Agizo hili linaendeleza muktadha uliotangulia kuhusu kutoa wazaliwa wa kwanza; Kiebrania hakirudii neno “mzaliwa wa kwanza” katika aya hii.
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן
  choice: vivyo hivyo
  rationale: Inaunganisha agizo hili na agizo lililotangulia kuhusu wazaliwa wa kwanza, huku ikitoa kwa Kiswahili nguvu ya ulinganisho ya neno la Kiebrania.
- source_word: תַּעֲשֶׂה
  choice: utafanya
  rationale: Ni usemi wa kawaida wa maagizo ya kisheria na unadumisha nguvu ya amri.
- source_word: לְשֹׁרְךָ
  choice: kwa ng’ombe wako
  rationale: Kiambishi ל kinaonyesha jambo ambalo kanuni hii inahusu; “ng’ombe” ni neno pana na la kawaida kuliko kumtaja dume pekee.
- source_word: לְצֹאנְךָ
  choice: kwa kundi lako
  rationale: צאן ni jina la pamoja la mifugo midogo, hasa kondoo na mbuzi; “kundi” linahifadhi maana hiyo bila kuongeza maelezo yasiyosemwa wazi.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Inaeleza kwa Kiswahili fasaha muda unaokusudiwa na kishazi cha Kiebrania.
- source_word: יִהְיֶה עִם אִמּוֹ
  choice: atabaki pamoja na mama yake
  rationale: Kihalisi ni “atakuwa pamoja na mama yake,” lakini “atabaki” huonyesha vizuri zaidi hali ya kudumu kwa muda katika muktadha huu.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: siku ya nane
  rationale: Ni usemi sahihi na wa kawaida wa Kiswahili kwa wakati uliotajwa.
- source_word: תִּתְּנוֹ לִי
  choice: utamtoa kwangu
  rationale: Kitenzi נתן hapa humaanisha kumpa Mungu huyo mnyama; “utamtoa kwangu” ni Kiswahili cha kawaida katika muktadha wa kutoa kilicho mali ya mtu, bila kuongeza maelezo ya aina ya ibada.
theological_decisions:
- issue: Rejeo la amri kwa wazaliwa wa kwanza wa wanyama
  choice: Aya imetafsiriwa kama mwendelezo wa agizo lililotangulia kuhusu wazaliwa wa kwanza, bila kuingiza neno “mzaliwa wa kwanza” ndani ya matini.
  alternative: Kutaja wazi “mzaliwa wa kwanza” kwa ajili ya ufafanuzi.
  rationale: Kiebrania hakirudii neno hilo katika aya hii; maana yake inabebwa na muktadha. Alama ya tanbihi inaeleza uhusiano huo bila kupanua matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Nafsi ya mnyama imetajwa kwa “a-” kwa kuwa mnyama hai ndiye anayerejelewa. Mpangilio wa alama [b][a] umehifadhiwa kama katika matini ya ushauri ya POB, na kila alama imewekwa katika matini kuu.
