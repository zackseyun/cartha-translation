base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/004.yaml
  text: If a man causes a field or vineyard to be grazed over[a], and lets his animal loose so that it grazes in another man's field[b], he shall make restitution from the best of his own field and the best of his own vineyard.
translation:
  language: sw
  text: Mtu akiharibu shamba au shamba la mizabibu[a], kwa kumwacha mnyama wake aingie akale katika shamba la mtu mwingine, atalipa fidia kwa kilicho bora zaidi cha shamba lake na cha shamba lake la mizabibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtu akiteketeza shamba au shamba la mizabibu.” Kitenzi cha Kiebrania בער kinaweza kumaanisha kuteketeza kwa moto katika miktadha fulani, lakini hapa kutajwa kwa kumwacha mnyama wake kunaunga mkono zaidi maana ya kuharibu kwa mnyama kula mimea.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Mtu aki-
  rationale: Katika sheria ya kisa, כִּי huanzisha hali ya masharti. Muundo wa Kiswahili wenye kiambishi -ki- unaeleza ‘ikiwa/atakapo’ kwa kawaida na kwa uwazi.
- source_word: יַבְעֶר
  choice: akilisha mifugo yake
  rationale: Hifili ya בער hapa ina maana ya kusababisha mimea iliwe au kuharibiwa kwa kulishwa mifugo. Tafsiri hii inahifadhi nguvu ya kisababishi na inafaa na kutajwa mara moja kwa kuachwa kwa mnyama.
- source_word: שָׂדֶה אוֹ כֶרֶם
  choice: katika shamba au shamba la mizabibu la mtu mwingine
  rationale: Majina ya kilimo yametafsiriwa moja kwa moja; umilikaji wa mtu mwingine umewekwa hapa kwa mpangilio wa asili wa Kiswahili na kwa maana ya kisheria ya kifungu kizima.
- source_word: וְשִׁלַּח אֶת־בְּעִירֹה
  choice: kwa kuiacha mifugo yake iingie
  rationale: שִׁלַּח ina maana ya kuachilia au kutuma, na בְּעִירֹה ni mnyama wake wa kufugwa. ‘Kuiacha mifugo yake iingie’ ni lugha ya kawaida inayoonyesha uzembe au kitendo kinachosababisha uharibifu.
- source_word: בְּעִירֹה
  choice: mifugo yake
  rationale: Ingawa Kiebrania kina umoja wa kijumla, ‘mifugo yake’ ni tafsiri ya asili ya Kiswahili kwa mnyama anayelishwa shambani bila kulazimisha aina maalumu ya mnyama.
- source_word: וּבִעֵר בִּשְׂדֵה אַחֵר
  choice: na kulisha katika shamba hilo
  rationale: Marudio ya בער yanaendeleza wazo la mnyama kula mimea. ‘Shamba hilo’ hurejelea shamba la mtu mwingine lililotajwa tayari na huepuka marudio yasiyo ya lazima.
- source_word: מֵיטַב שָׂדֵהוּ וּמֵיטַב כַּרְמוֹ
  choice: kwa mazao bora kabisa ya shamba lake mwenyewe na ya shamba lake la mizabibu
  rationale: מֵיטַב ni kilicho bora au sehemu bora. ‘Mazao bora kabisa’ huonyesha kwa kawaida kwamba fidia inatoka katika sehemu bora ya mali ya mkosaji, huku ‘mwenyewe’ ikifafanua umilikaji.
- source_word: יְשַׁלֵּם
  choice: atalipa fidia
  rationale: Pieli ya שׁלם katika sheria hizi ina maana ya kulipa au kufidia hasara. ‘Atalipa fidia’ ni wazi, ya sasa, na ina uzito unaofaa wa kisheria.
