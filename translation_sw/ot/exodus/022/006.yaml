base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/006.yaml
  text: If a man gives his neighbor money or goods to keep[a], and it is stolen from the man's house, if the thief is found[c][b], he shall pay double.
translation:
  language: sw
  text: Mtu akimpa jirani yake fedha au vitu ili avihifadhi, navyo vikaibiwa kutoka katika nyumba ya mtu huyo, mwizi akipatikana, atalipa mara mbili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: akimpa
  rationale: Katika sheria ya masharti, כִּי huanzisha hali inayowezekana; muundo wa Kiswahili wa ‘aki-’ unaeleza sharti hilo kwa kawaida.
- source_word: יִתֵּן אִישׁ
  choice: Mtu akimpa
  rationale: ‘Mtu’ ni Kiswahili cha kawaida na chenye hadhi kwa אִישׁ katika sheria ya jumla; huepuka kufanya kifungu kisikike kana kwamba kinawahusu wanaume pekee bila kupoteza umoja wa kisheria.
- source_word: אֶל רֵעֵהוּ
  choice: jirani yake
  rationale: רֵעַ hapa ni mtu mwenzake katika jamii; ‘jirani yake’ ni tafsiri ya kawaida na inayoeleweka.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Ingawa neno hilo linaweza kumaanisha ‘silver,’ katika muktadha huu wa mali iliyowekwa kwa ulinzi linamaanisha fedha/pesa; ‘fedha’ huhifadhi pia mwangwi wa maana halisi.
- source_word: אוֹ כֵלִים
  choice: au vitu
  rationale: כֵלִים ni neno pana kwa vyombo, vifaa, au mali mbalimbali; ‘vitu’ ni pana na la kawaida bila kulibana kwa aina moja.
- source_word: לִשְׁמֹר
  choice: avihifadhi
  rationale: Kitenzi kinaonyesha kusudi la kukabidhi mali ili itunzwe salama; ‘avihifadhi’ ni cha asili katika Kiswahili na kina maana ya utunzaji.
- source_word: וְגֻנַּב
  choice: navyo vikaibiwa
  rationale: Muundo wa kutendwa umehifadhiwa, na ‘navyo’ hurejelea kwa pamoja fedha au vitu vilivyokabidhiwa.
- source_word: מִבֵּית הָאִישׁ
  choice: kutoka nyumbani mwa mtu huyo
  rationale: Hurejelea nyumba ya yule aliyepokea mali; ‘mtu huyo’ huondoa utata wa marejeo kwa njia ya kawaida.
- source_word: אִם יִמָּצֵא הַגַּנָּב
  choice: mwizi akipatikana
  rationale: Nifali ya מצא ni ‘kupatikana’; tafsiri hii haiongezi wazo la kukamatwa ambalo halijasemwa moja kwa moja.
- source_word: יְשַׁלֵּם שְׁנָיִם
  choice: atalipa mara mbili
  rationale: Nahau hii inaagiza malipo ya kiasi maradufu; ‘atalipa mara mbili’ ni wazi, fupi, na ya kawaida.
