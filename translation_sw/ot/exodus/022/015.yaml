base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/015.yaml
  text: If a man seduces a virgin who is not betrothed[a], and lies with her[b], he must surely pay the bride-price for her to be his wife.
translation:
  language: sw
  text: Mwanamume akimshawishi bikira ambaye hajachumbiwa, na akalala naye, lazima amtolee mahari ili awe mke wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְפַתֶּה
  choice: akimshawishi
  rationale: Kitenzi hiki katika kauli ya Piel humaanisha kumshawishi au kumvuta mtu kwa maneno, hapa katika muktadha wa kingono. “Akimshawishi” ni cha kawaida na hakiongezi matumizi ya nguvu ambayo hayajasemwa katika mstari huu.
- source_word: אִישׁ
  choice: mwanamume
  rationale: Nomino ya Kiebrania hapa ni umoja wa kiume na humtaja mwanamume anayehusika katika sheria hii.
- source_word: בְּתוּלָה
  choice: bikira
  rationale: Katika muktadha huu wa kisheria na wa ndoa, neno hilo humaanisha mwanamke ambaye hajafanya ngono; “bikira” huhifadhi hadhi inayohusika katika sheria.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: ambaye hajaposwa
  rationale: Kitenzi cha Kiebrania humaanisha kuahidiwa rasmi katika ndoa. “Hajaposwa” ni Kiswahili cha asili na chenye usahihi wa kitamaduni kuliko usemi mpana wa kuwa mchumba tu.
- source_word: וְשָׁכַב עִמָּהּ
  choice: kisha akalala naye
  rationale: Kulala na mtu ni nahau inayotumika kwa kufanya ngono. Tafsiri hii inabaki yenye staha na karibu na umbo la Kiebrania; “kisha” huonyesha hatua inayofuata katika sharti la sheria.
- source_word: מָהֹר יִמְהָרֶנָּה
  choice: ni lazima amtolee mahari
  rationale: Muundo wa jina la kitendo pamoja na kitenzi unasisitiza wajibu. “Ni lazima” huwasilisha msisitizo huo, na “amtolee mahari” ni usemi wa kawaida wa Kiswahili kwa malipo yanayohusishwa na ndoa kutoka upande wa mwanamume.
- source_word: לּוֹ לְאִשָּׁה
  choice: ili awe mke wake
  rationale: 'Kirai hiki huonyesha matokeo ya kisheria ya malipo hayo: mwanamke kuwa mke wa mwanamume huyo.'
theological_decisions:
- issue: Aina ya tendo linaloelezwa na פתה
  choice: Kumshawishi katika muktadha wa kingono bila kutaja wazi matumizi ya nguvu
  alternative: Kubaka au kumwingilia kwa nguvu
  rationale: Maana ya kawaida ya kitenzi katika kauli hii ni kushawishi au kuvuta kwa hila. Tafsiri haiongezi ridhaa kamili wala nguvu; hivyo inaacha mvutano wa kifungu na kuitofautisha kesi hii na sheria zinazotaja wazi shambulio la kingono kwa nguvu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha staha na kinachoeleweka kwa wasomaji wa kawaida. “Hajaposwa” na “mahari” huhifadhi mazingira ya kisheria na ya ndoa bila kutumia istilahi ngumu zisizo za lazima.
