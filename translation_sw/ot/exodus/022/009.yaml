base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/009.yaml
  text: If a man gives his neighbor a donkey[a], or an ox, or a sheep, or any animal to keep, and it dies, or is injured, or is carried off, with no one seeing it[c][b],
translation:
  language: sw
  text: Mtu akimpa jirani yake punda, ng’ombe, kondoo[a], au mnyama yeyote ili amtunze, kisha mnyama huyo akafa, akajeruhiwa[b], au akachukuliwa kwa nguvu, bila mtu yeyote kuona kilichotokea[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kondoo au mbuzi”; neno la Kiebrania linaweza kumaanisha mnyama mmoja wa kundi la kondoo au mbuzi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “akavunjika.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, hakuna shahidi aliyeona kilichotokea.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: akimpa
  rationale: Katika sheria ya kisa, כִּי huanzisha sharti. Muundo wa Kiswahili wa -ki- unatoa maana ya ‘ikiwa’ kwa njia ya asili na wazi.
- source_word: יִתֵּן
  choice: ampa
  rationale: נתן kimsingi ni ‘kutoa/kumpa.’ Kirai kinachofuata, ‘amtunze,’ kinaonyesha kwamba hapa ni kumkabidhi mnyama kwa uangalizi.
- source_word: אִישׁ
  choice: mtu
  rationale: Katika sheria hii אִישׁ humwakilisha mtu anayehusika katika kisa. ‘Mtu’ ni Kiswahili cha kawaida na hakiongezi tofauti ya kijinsia ambayo si muhimu kwa matumizi ya sheria.
- source_word: אֶל רֵעֵהוּ
  choice: jirani yake
  rationale: רֵעַ humaanisha mtu wa karibu katika jamii au mwenzake. ‘Jirani yake’ ni usemi wa kawaida katika lugha ya kisheria na kimaadili ya Biblia.
- source_word: חֲמוֹר
  choice: punda
  rationale: Ni kisawe cha moja kwa moja, cha sasa, na kinachoeleweka wazi.
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: שׁוֹר hapa ni mnyama wa jamii ya ng’ombe anayemilikiwa. ‘Ng’ombe’ ni neno la kawaida la Kiswahili na halilazimishi jinsia au hali ya kuhasiwa ambayo muktadha hautaji wazi.
- source_word: שֶׂה
  choice: kondoo
  rationale: שֶׂה inaweza kuwa kondoo au mbuzi mmoja wa kundi. ‘Kondoo’ inafaa katika orodha, huku upana wa neno la Kiebrania ukihifadhiwa katika tanbihi.
- source_word: וְכָל בְּהֵמָה
  choice: au mnyama mwingine yeyote
  rationale: בְּהֵמָה hapa inahusu wanyama wanaofugwa kwa ujumla. ‘Mnyama mwingine yeyote’ huonyesha kwamba baada ya mifano iliyotajwa, wanyama wengine pia wanahusika.
- source_word: לִשְׁמֹר
  choice: amtunze
  rationale: שמר hapa ni kumweka mnyama chini ya uangalizi na matunzo. ‘Amtunze’ ni ya asili kwa mali hai iliyokabidhiwa kwa mtu.
- source_word: וּמֵת
  choice: kisha mnyama huyo akafa
  rationale: Kumtaja tena mnyama huondoa utata wa kiwakilishi katika Kiswahili, bila kubadili maana ya mfuatano wa kisa.
- source_word: נִשְׁבַּר
  choice: akajeruhiwa
  rationale: Maana ya msingi ni ‘akavunjika,’ lakini kwa mnyama neno hilo hueleza kuumia vibaya. ‘Akajeruhiwa’ ni la kawaida; maana halisi zaidi imo tanbihini.
- source_word: נִשְׁבָּה
  choice: akachukuliwa kwa nguvu
  rationale: Niphal ya שׁבה ni kutekwa au kuchukuliwa. ‘Kwa nguvu’ huhifadhi wazo la kunyakuliwa bila kulifanya tukio hilo kuwa wizi wa kawaida tu.
- source_word: אֵין רֹאֶה
  choice: bila mtu yeyote kuona kilichotokea
  rationale: Kiebrania ni kifupi, ‘hakuna anayeona.’ Tafsiri hii inaweka wazi kwamba hakuna shahidi wa tukio, bila kudai kwamba hakuna aliyemwona mnyama wakati mwingine.
