  text: Whoever lies with an animal shall surely be put to death[a].
translation:
  language: sw
  text: Yeyote anayelala na mnyama atauawa hakika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “hakika atakufa.” Fomula hii ya sheria katika Kiebrania inaonyesha kwamba ni adhabu ya kifo ya hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Yeyote
  rationale: כָּל ikifuatiwa na kitenzi-jina cha mtendaji huunda kauli ya jumla isiyomtaja mtu maalumu; “Yeyote” ni Kiswahili cha kawaida na sahihi.
- source_word: שֹׁכֵב
  choice: anayelala
  rationale: Mzizi שׁכב pamoja na עִם umetumiwa kama lugha ya staha kwa tendo la ngono. “Anayelala na” hudumisha tamathali hiyo bila kutumia maelezo ya kitabibu.
- source_word: עִם
  choice: na
  rationale: Hiki ni kihusishi kinachounganisha kitendo hicho na mnyama; katika Kiswahili, muundo wa kawaida ni “kulala na.”
- source_word: בְּהֵמָה
  choice: mnyama
  rationale: בְּהֵמָה humaanisha mnyama au mnyama wa kufugwa. “Mnyama” ni neno pana, la sasa, na haliongezi upeo usiothibitishwa na muktadha huu.
- source_word: מוֹת יוּמָת
  choice: lazima auawe
  rationale: Muundo wa kitenzi-jina halisi pamoja na kitenzi cha hali ya kutendwa unasisitiza uhakika wa adhabu ya kifo. “Lazima auawe” huonyesha wajibu wa kisheria na hali ya kutendwa kwa lugha ya asili ya Kiswahili.
theological_decisions:
- issue: Namna ya kutafsiri fomula ya kisheria ya adhabu ya kifo
  choice: lazima auawe
  alternative: hakika atakufa
  rationale: Kiebrania kinaweza kutafsiriwa kwa ukaribu zaidi kuwa “hakika atakufa,” lakini katika sheria fomula hii inaeleza adhabu ya kifo inayotekelezwa. Tafsiri iliyochaguliwa inaweka wazi hali ya kutendwa na nguvu ya amri bila kutaja mtekelezaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, nzito, na ya kisheria. “Kulala na” inadumisha lugha ya staha ya Kiebrania, huku “lazima auawe” ikieleza kwa kawaida nguvu ya fomula ya adhabu.
