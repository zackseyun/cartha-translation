  yaml_path: translation/ot/exodus/022/023.yaml
  text: then my anger will burn[a], and I will kill you with the sword[b], and your wives will become widows and your sons fatherless.
translation:
  language: sw
  text: ndipo hasira yangu itawaka, nami nitawaua kwa upanga, na wake zenu watakuwa wajane, na wana wenu watakuwa yatima[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania humaanisha hasa watu walioachwa bila baba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: hasira yangu itawaka
  rationale: Hii ni nahau inayosema hasira inawaka. Tafsiri hii inaeleza maana yake kwa Kiswahili cha kawaida huku ikihifadhi sitiari ya kuwaka.
- source_word: וְהָרַגְתִּי אֶתְכֶם
  choice: nami nitawaua
  rationale: Kitenzi הרג ni kuua; kiambishi cha nafsi ya pili wingi kimewakilishwa na -wa- katika 'nitawaua'.
- source_word: בֶּחָרֶב
  choice: kwa upanga
  rationale: Herufi ב hapa inaonyesha chombo au njia ya mauaji; 'kwa upanga' ni usemi wa asili na wazi katika Kiswahili.
- source_word: וְהָיוּ נְשֵׁיכֶם אַלְמָנוֹת
  choice: na wake zenu watakuwa wajane
  rationale: היה inaonyesha hali itakayotokea baada ya hukumu, na נְשֵׁיכֶם katika muktadha huu ni wake zenu.
- source_word: וּבְנֵיכֶם
  choice: na wana wenu
  rationale: בנים ni neno la kiume linalomaanisha wana; 'wana wenu' linahifadhi umahususi huo bila kulibadili kuwa 'watoto wenu'.
- source_word: יְתֹמִים
  choice: yatima
  rationale: Neno hili humaanisha waliofiwa na baba katika mazingira ya kijamii ya maandiko, ingawa Kiswahili 'yatima' linaweza pia kueleweka kwa maana pana zaidi.
theological_decisions:
- issue: Nahau yenye taswira ya kibinadamu kuhusu hasira ya Mungu
  choice: hasira yangu itawaka
  alternative: pua yangu itawaka; ghadhabu yangu itawashwa
  rationale: Tafsiri ya moja kwa moja ya kiungo cha mwili ingeficha maana katika Kiswahili. 'Hasira yangu itawaka' huhifadhi taswira na uzito wa hukumu bila kuwa usemi mgumu.
- issue: Neno mahususi la kijinsia kwa watoto
  choice: wana wenu
  alternative: watoto wenu
  rationale: Chanzo kinatumia בנים, neno linalotaja wana wa kiume. Tafsiri imelihifadhi badala ya kulipanua kimya kimya kuwa watoto wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi na yenye hadhi. Muundo wa sentensi umehifadhi mfululizo wa matokeo ya hukumu katika chanzo. Alama [a] imewekwa baada ya 'yatima' ili kufafanua upeo mahususi wa neno la Kiebrania.
