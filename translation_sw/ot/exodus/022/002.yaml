base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
translation:
  language: sw
  text: Lakini ikiwa jua limemchomozea[a], muuaji atakuwa na hatia ya damu[b]. Mwizi lazima alipe fidia. Ikiwa hana chochote, atauzwa kwa ajili ya wizi wake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kutoa maana yake wazi zaidi, “ikiwa tukio limetokea baada ya jua kuchomoza” au “ikiwa limetendeka mchana.” Kiebrania kinasema kihalisi, “ikiwa jua limemchomozea.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, katika hali hii mtu aliyemuua mwizi anakuwa na hatia ya damu.
    reason: alternative_reading
  - marker: c
    text: Kuuzwa huku ni njia ya kulipa deni la fidia ya wizi wakati mwizi hana mali ya kulipa.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Lakini ikiwa
  rationale: Ingawa אִם yenyewe ni sharti, muktadha unalinganisha hali hii na kisa cha usiku katika mstari uliotangulia; “lakini” linaonyesha utofauti huo kwa Kiswahili cha kawaida.
- source_word: זָרְחָה הַשֶּׁמֶשׁ עָלָיו
  choice: jua limekwisha kumchomozea
  rationale: Huhifadhi taswira halisi ya Kiebrania ya jua kumchomozea mtu, huku likisomeka kwa ufasaha katika Kiswahili. Kisheria, maana ni kwamba tukio limetokea baada ya jua kuchomoza.
- source_word: דָּמִים לוֹ
  choice: muuaji atakuwa na hatia ya damu
  rationale: דָּמִים katika muktadha huu wa sheria huonyesha hatia inayotokana na kumwaga damu. Kutaja “muuaji” kunabainisha rejeo la kiwakilishi katika muktadha bila kubadili hukumu ya kifungu.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: Mwizi lazima alipe fidia kamili
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi unasisitiza wajibu wa kulipa. “Fidia kamili” linafaa kwa sheria ya kurejesha thamani ya kilichoibwa, na “mwizi” linaweka wazi kwamba hapa mhusika anarudi kuwa mwizi.
- source_word: אִם אֵין לוֹ
  choice: Ikiwa hana chochote
  rationale: Ni tafsiri ya kawaida ya msemo wa Kiebrania unaomaanisha kutokuwa na mali au uwezo wa kulipa fidia.
- source_word: וְנִמְכַּר
  choice: atauzwa
  rationale: Huhifadhi kauli tendwa na matokeo ya kisheria yaliyomo katika Kiebrania, bila kuongeza muda au masharti yasiyotajwa.
- source_word: בִּגְנֵבָתוֹ
  choice: kwa sababu ya wizi wake
  rationale: Hutoa msingi wa kisheria wa kuuzwa kwake na kuhifadhi nomino “wizi” ya Kiebrania; katika muktadha, ni hatua ya kulipia deni la fidia.
theological_decisions:
- issue: Athari ya kisheria ya kumuua mwizi baada ya jua kuchomoza
  choice: Muuaji anakuwa na hatia ya damu wakati mwizi anapouawa baada ya jua kuchomoza.
  alternative: Kauli kuhusu jua inaweza kufasiriwa kwa upana kuwa tofauti kati ya tishio linaloonekana wazi na lisiloeleweka, si muda wa mchana pekee.
  rationale: Matini kuu inadumisha taswira halisi ya jua kuchomoza na hukumu ya hatia ya damu. Haipanui sheria kuwa kanuni ya jumla kuhusu aina zote za tishio.
- issue: Mabadiliko ya mhusika kati ya hatia ya damu na wajibu wa fidia
  choice: “Muuaji” ametajwa katika sentensi ya hatia, kisha “mwizi” katika sentensi ya fidia.
  alternative: Kudumisha viwakilishi pekee, jambo ambalo lingeweza kufanya msomaji adhani mtu mmoja ndiye mhusika wa kauli zote mbili.
  rationale: Kiebrania hutegemea muktadha kubainisha wahusika. Kuwataja kwa majina ya kimuktadha kunazuia mkanganyiko wa Kiswahili bila kuingiza fundisho jipya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wenye hadhi. Taswira ya Kiebrania ya jua kuchomoza imehifadhiwa, huku mabadiliko ya wahusika yakifafanuliwa kwa majina “muuaji” na “mwizi” ili kuzuia utata usio wa lazima.
