  yaml_path: translation/ot/exodus/022/016.yaml
  text: If her father absolutely refuses to give her to him[b][a], he shall weigh out silver equal to the bride-price for virgins.
translation:
  language: sw
  text: Ikiwa baba yake atakataa kabisa kumtoa binti yake aolewe na mwanamume huyo,[a] mwanamume huyo atapima fedha kwa uzito, kama mahari ya wanawali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno kwa neno, “kumtoa kwake.” Katika muktadha huu usemi huo unamaanisha baba kukubali binti yake aolewe na mwanamume huyo.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kinamaanisha “kupima kwa uzito,” kwa kuwa fedha ya malipo ilikuwa metali iliyopimwa badala ya sarafu.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Ni kiunganishi cha kawaida cha sharti kinachoanzisha hali hii ya kisheria.
- source_word: מָאֵן יְמָאֵן
  choice: atakataa kabisa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye ukomo unasisitiza kukataa; ‘kabisa’ huonyesha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: אָבִיהָ
  choice: baba yake
  rationale: Huwakilisha wazi nomino pamoja na kiambishi cha nafsi ya tatu, umoja, kike.
- source_word: לְתִתָּהּ לוֹ
  choice: kumpa huyo mwanamume awe mke wake
  rationale: Neno kwa neno ni ‘kumpa kwake,’ lakini katika muktadha huu wa sheria ya ndoa, kumpa kunamaanisha kukubali aolewe naye. Ufafanuzi huu huepuka hali ya Kiswahili cha ‘kumpa’ pekee kusikika kana kwamba mwanamke ni kitu, huku tanbihi ikihifadhi usemi halisi.
- source_word: כֶּסֶף
  choice: fedha
  rationale: ‘Fedha’ kwa Kiswahili inaweza kumaanisha metali ya silver na pia mali ya malipo; hapa muktadha wa kupima uzito unaendeleza maana halisi ya metali.
- source_word: יִשְׁקֹל
  choice: atampimia
  rationale: Kitenzi cha Kiebrania kinamaanisha kupima kwa uzito. ‘Atampimia fedha’ huhifadhi desturi ya kulipa kwa metali iliyopimwa badala ya kuifanya tu ‘atalipa.’
- source_word: כְּמֹהַר
  choice: yenye thamani sawa na mahari
  rationale: מֹהַר ni malipo ya ndoa kwa familia ya bibi arusi. ‘Mahari’ ndiyo istilahi ya kawaida ya Kiswahili, na ‘yenye thamani sawa na’ huonyesha kiwango cha ulinganifu kinachodaiwa na כְּ.
- source_word: הַבְּתוּלֹת
  choice: ya wanawali
  rationale: Wingi wenye kibainishi hurejelea kwa ujumla kiwango cha kawaida kinachohusishwa na wanawali.
