  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Huyo mwanamume’ imerudiwa ili kuepuka utata wa viwakilishi. Mpangilio wa alama za tanbihi umewekwa kulingana na sehemu husika za maandishi.
