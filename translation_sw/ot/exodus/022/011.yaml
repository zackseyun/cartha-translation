lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Inaendeleza sharti la kisheria huku ikionyesha tofauti na hali iliyotangulia.
- source_word: גָּנֹב יִגָּנֵב
  choice: kweli ameibiwa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi finiti unasisitiza tendo la kuibiwa; “kweli” huonyesha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: מֵעִמּוֹ
  choice: kutoka kwake
  rationale: Hufuata kwa karibu maana ya “kutoka pamoja naye,” huku muktadha wa sheria ukionyesha kwamba mali ilikuwa chini ya uangalizi wake.
- source_word: יְשַׁלֵּם
  choice: atamlipa ... fidia
  rationale: Katika muktadha wa kisheria, mzizi huu katika Piel humaanisha kulipa fidia au kurejesha thamani ya hasara.
- source_word: לִבְעָלָיו
  choice: mwenye mali hiyo
  rationale: בעל hapa humaanisha mmiliki; kirai hiki cha Kiswahili kinaweka wazi uhusiano na kitu kilichoibiwa bila kudokeza wamiliki wengi.
