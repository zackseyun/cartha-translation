  footnotes:
  - marker: a
    text: 'Kiebrania, kwa neno kwa neno, “ikiwa kwa kuibiwa ataibiwa kutoka kwake.” Huu ni muundo wa kitenzi unaosisitiza tendo hilo: “ikiwa kweli ameibiwa” au “ikiwa kwa hakika ameibiwa akiwa chini ya uangalizi wake.”'
