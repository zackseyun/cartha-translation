base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/028.yaml
  text: You shall not delay the fullness of your harvest and the outflow of your press[a]. You shall give to me the firstborn of your sons.
translation:
  language: sw
  text: Usicheleweshe kutoa mavuno yako tele na mazao yako ya kimiminiko yaliyokamuliwa[a]. Mzaliwa wa kwanza wa wana wako utanipa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mazao yako kamili na juisi/divai yako.” Maneno ya Kiebrania huenda yanamaanisha mazao yaliyovunwa na mazao ya kimiminiko yaliyokamuliwa; jozi hiyo inaweza kuwa nafaka na divai hasa, au kwa upana zaidi mazao dhabiti na ya kimiminiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָתְךָ
  choice: mavuno yako tele
  rationale: Neno hilo kimsingi humaanisha ujazo au wingi kamili; katika sheria hii linaelekeza kwenye mazao ya mavuno. Tafsiri hii inadumisha picha ya wingi wa mazao kwa Kiswahili cha kawaida.
- source_word: וְדִמְעֲךָ
  choice: kimiminiko cha kikamulio chako
  rationale: Ingawa nomino hii inaweza kumaanisha ‘chozi,’ katika muktadha wa kilimo humaanisha zao la kimiminiko linalotoka kwa kukamuliwa, huenda divai au mafuta. ‘Kimiminiko cha kikamulio chako’ kinahifadhi picha hiyo bila kukitaja kimiminiko hicho kuwa divai pekee.
- source_word: לֹא תְאַחֵר
  choice: Usikawie kuleta
  rationale: Kitenzi kinakataza kuchelewesha au kuahirisha. ‘Usikawie’ ni amri ya moja kwa moja na ya kawaida; ‘kuleta’ huweka wazi tendo linalodaiwa katika muktadha wa matoleo bila kubadili maana ya msingi.
- source_word: בְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Hili ndilo neno la kawaida na sahihi kwa mtoto wa kwanza katika kundi la kisheria linalozungumziwa.
- source_word: בָּנֶיךָ
  choice: wa wanao
  rationale: Kiebrania kinataja wana wa kiume hasa, si watoto kwa ujumla; kwa hiyo jinsia ya neno la chanzo imehifadhiwa.
- source_word: תִּתֶּן לִּי
  choice: Utanipa
  rationale: Muundo huu wa Kiswahili ni wa kawaida, wa moja kwa moja, na unadumisha nguvu ya sharti la kisheria pamoja na Mungu kuwa mpokeaji.
theological_decisions:
- issue: Maana ya jozi ya kilimo מְלֵאָה / דִמְעָה katika sheria ya matoleo
  choice: Amri inakataza kuchelewesha kuleta mazao ya mavuno na mazao ya kimiminiko yaliyokamuliwa.
  alternative: Maneno hayo yanaweza kutaja nafaka na divai hasa, au malimbuko kwa ujumla bila kutofautisha aina za mazao.
  rationale: Kiebrania kinaonekana kuoanisha zao dhabiti la mavuno na zao la kimiminiko linalotoka kikamulioni. Tafsiri haifungi maana katika divai pekee, hivyo inadumisha upana na kiasi cha kutokuwa wazi kilichopo katika chanzo.
- issue: Maana ya בָּנֶיךָ
  choice: wanao
  alternative: watoto wako
  rationale: Chanzo kinatumia neno la kiume ‘wana,’ kwa hiyo tafsiri hailigeuzi kuwa neno lisiloonyesha jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kikamulio’ kinaeleza chombo au mahali pa kukamulia bila kuamua ikiwa kimiminiko ni divai au mafuta; tanbihi inadumisha uwezekano mwingine wa kileksika.
