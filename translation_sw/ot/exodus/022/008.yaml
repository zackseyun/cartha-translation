  text: עַֽל כָּל דְּבַר פֶּ֡שַׁע עַל שׁ֡וֹר עַל חֲ֠מוֹר עַל שֶׂ֨ה עַל שַׂלְמָ֜ה עַל כָּל אֲבֵדָ֗ה אֲשֶׁ֤ר יֹאמַר֙ כִּי ה֣וּא זֶ֔ה עַ֚ד הָֽ/אֱלֹהִ֔ים יָבֹ֖א דְּבַר שְׁנֵי/הֶ֑ם אֲשֶׁ֤ר יַרְשִׁיעֻ/ן֙ אֱלֹהִ֔ים יְשַׁלֵּ֥ם שְׁנַ֖יִם לְ/רֵעֵֽ/הוּ־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/008.yaml
  text: For every case of wrongdoing involving an ox[a], a donkey, a sheep, a garment, or any lost thing about which someone says, ‘This is it,’ the case of both parties shall come before God[b]. The one whom God declares guilty shall pay double to his neighbor.
translation:
  language: sw
  text: Kwa kila shauri la kosa linalohusu ng’ombe, punda, kondoo[a], vazi, au kitu chochote kilichopotea ambacho mtu atasema, “Hiki ndicho,” shauri la pande zote mbili litafikishwa mbele ya Mungu[b]. Yule ambaye Mungu atamtangaza kuwa na hatia atamlipa mwenzake mara mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinatumia neno pana linaloweza kumaanisha kondoo au mbuzi.
    reason: lexical_alternative
  - marker: b
    text: Au “mbele ya waamuzi” au “mahakamani.” Neno la Kiebrania אֱלֹהִים linaweza kumrejelea Mungu moja kwa moja au waamuzi wa kibinadamu wanaotekeleza mamlaka ya kimungu katika mashauri ya kisheria.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר פֶּשַׁע
  choice: shauri la kosa
  rationale: Katika muktadha huu wa kisheria, דָּבָר ni shauri au jambo linalohukumiwa, na פֶּשַׁע ni kosa; usemi huu ni wa kawaida na haubainishi kosa kuliko Kiebrania.
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: Neno hili humaanisha mnyama wa jamii ya ng’ombe; “ng’ombe” ni tafsiri pana na ya kawaida katika Kiswahili cha sasa.
- source_word: חֲמוֹר
  choice: punda
  rationale: Ni neno la kawaida na sahihi kwa mnyama anayelengwa.
- source_word: שֶׂה
  choice: kondoo au mbuzi
  rationale: Neno la Kiebrania ni pana kuliko “kondoo” pekee na linaweza kumaanisha mnyama mmoja wa kundi dogo, yaani kondoo au mbuzi.
- source_word: שַׂלְמָה
  choice: vazi
  rationale: “Vazi” huhifadhi maana ya jumla ya nguo bila kuibana kuwa joho aina fulani.
- source_word: אֲבֵדָה
  choice: kitu chochote kilichopotea
  rationale: Huwasilisha kwa lugha asilia mali au kitu kilichopotea huku ikihifadhi upana wa nomino ya Kiebrania.
- source_word: אֲשֶׁר יֹאמַר כִּי הוּא זֶה
  choice: ambacho mtu atasema, “Hiki ndicho,”
  rationale: Huhifadhi dai la utambulisho wa kitu linaloonyeshwa na הוּא זֶה bila kuongeza ufafanuzi usio katika matini.
- source_word: הָאֱלֹהִים / אֱלֹהִים
  choice: Mungu
  rationale: Maana ya moja kwa moja ya umbo hili ni “Mungu”; maana inayowezekana ya waamuzi au mahakama imehifadhiwa katika tanbihi.
- source_word: יָבֹא דְּבַר שְׁנֵיהֶם
  choice: shauri la pande zote mbili litafikishwa
  rationale: Hii ni lugha asilia ya kisheria inayowakilisha shauri linalowahusu wahusika wote wawili.
- source_word: יַרְשִׁיעֻן
  choice: atamtangaza kuwa na hatia
  rationale: Hiphil ya רשע humaanisha kutoa uamuzi kwamba mtu ana hatia, si tu kumlaumu.
- source_word: יְשַׁלֵּם שְׁנַיִם
  choice: atamlipa ... mara mbili
  rationale: Huwasilisha wazi wajibu wa kulipa fidia maradufu.
- source_word: לְרֵעֵהוּ
  choice: mwenzake
  rationale: Katika shauri hili רֵעַ ni mtu mwenzake, hasa upande mwingine; “mwenzake” ni pana na ya asili kuliko “jirani” katika Kiswahili hiki cha kisheria.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika muktadha huu wa kisheria
  choice: Mungu
  alternative: waamuzi / mahakama
  rationale: Umbo la Kiebrania kwa kawaida humaanisha Mungu, lakini katika mazingira ya kisheria linaweza kueleweka kuwa waamuzi wanaotekeleza mamlaka ya kimungu. Matini kuu huhifadhi maana ya moja kwa moja, na uwezekano wa kisheria huonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Lugha ya kisheria kama “shauri,” “pande zote mbili,” na “hatia” imetumiwa kwa uwazi bila kuwa ya kitaalamu kupita kiasi. Alama zote za tanbihi zimewekwa mara baada ya maneno yanayohusika.
