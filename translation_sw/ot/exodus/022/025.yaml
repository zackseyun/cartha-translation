  text: If you take your neighbor’s cloak as a pledge[b][a], you shall return it to him before the sun sets.
translation:
  language: sw
  text: Ikiwa utachukua vazi la nje la jirani yako kuwa rehani[a], lazima umrudishie vazi hilo kabla ya jua kutua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “joho” au “nguo ya kujifunika.” Neno la Kiebrania linamaanisha hasa vazi la nje ambalo lingeweza kumkinga mtu wakati wa usiku.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mpaka kuja kwa jua”; yaani, kufikia machweo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Hutanguliza sheria ya sharti; “ikiwa” linadumisha muundo wa kisheria wa Kiebrania bila kuufanya kuwa tukio la lazima.
- source_word: חָבֹל תַּחְבֹּל
  choice: utachukua ... kuwa rehani
  rationale: Muundo wa kitenzi pamoja na kitenzi-jina unasisitiza tendo la kuchukua dhamana. Kiswahili cha kawaida hakihitaji kurudia kitenzi; “kuchukua ... kuwa rehani” linaeleza tendo hilo la kisheria kwa uwazi.
- source_word: שַׂלְמַת
  choice: vazi la nje
  rationale: Neno hili linamaanisha vazi la kujifunika la nje, ambalo pia lingeweza kumkinga mtu usiku. “Vazi la nje” ni wazi na sahihi kuliko “nguo” peke yake.
- source_word: רֵעֶךָ
  choice: jirani yako
  rationale: Katika sheria za kijamii za agano, “jirani” ni tafsiri ya kawaida na inayoeleweka ya mtu aliye katika uhusiano wa kijamii na mhusika.
- source_word: עַד בֹּא הַשֶּׁמֶשׁ
  choice: kabla ya jua kutua
  rationale: Maneno halisi yanahusu ‘kuja kwa jua,’ nahau ambayo katika muktadha huu inaashiria machweo; tafsiri hii inaeleza kikomo cha wakati kwa Kiswahili cha kawaida.
- source_word: תְּשִׁיבֶנּוּ לוֹ
  choice: lazima umrudishie vazi hilo
  rationale: Hifili ya שוב humaanisha kusababisha kitu kirudi au kukirejesha. Kutaja tena “vazi hilo” huepusha utata wa kiwakilishi na “umrudishie” humweka wazi mpokeaji.
