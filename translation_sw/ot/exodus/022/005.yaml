base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/005.yaml
  text: If a fire breaks out and catches in thorns[a], so that stacked grain or standing grain or the field is consumed[b], the one who started the fire must surely make restitution.
translation:
  language: sw
  text: Moto ukizuka na kufikia miiba[a], ukateketeza nafaka zilizorundikwa, au nafaka ambazo bado zimesimama shambani, au shamba lenyewe, aliyeuwasha moto huo lazima alipe fidia kamili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kuifikia miiba”; kihalisi, “na kuikuta miiba.”
    reason: lexical_alternative
  - marker: b
    text: Au, “lazima hakika alipe fidia.” Kiebrania kinasisitiza wajibu huo kwa infinitivi kamili pamoja na kitenzi kilichonyambuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ukizuka
  rationale: Muundo wa masharti wa -ki- unafaa kwa sheria ya kisa na kwa Kiswahili ni wa kawaida kuliko kuanza kwa 'ikiwa' hapa.
- source_word: תֵצֵא אֵשׁ
  choice: Moto ukizuka
  rationale: Kitenzi cha Kiebrania kinaeleza moto unaotokea au kutoka na kuenea; 'ukizuka' ni usemi wa kawaida kwa moto unaoanza bila kumaanisha kuzimika.
- source_word: וּמָצְאָה קֹצִים
  choice: na kuenea hadi kwenye miiba
  rationale: Kihalisi ni 'na kukuta miiba'; katika muktadha, moto unaifikia miiba na kuenea kupitia humo. Tanbihi inahifadhi picha halisi ya Kiebrania.
- source_word: קֹצִים
  choice: miiba
  rationale: Ni kisawe cha moja kwa moja kinachohifadhi taswira ya Kiebrania; huenda kinamaanisha mimea au vichaka vya miiba vilivyokauka.
- source_word: וְנֶאֱכַל
  choice: ukateketeza
  rationale: Niphal ya אכל hutumiwa kwa kitu kinacholiwa au kuteketezwa na moto. Muundo tendaji wenye moto kama kiima ni wa asili katika Kiswahili na unaendeleza mtiririko wa sentensi.
- source_word: גָּדִישׁ
  choice: nafaka zilizorundikwa
  rationale: Inamaanisha nafaka iliyovunwa na kukusanywa katika rundo, tofauti na nafaka ambayo bado imesimama shambani.
- source_word: הַקָּמָה
  choice: nafaka ambazo bado zimesimama shambani
  rationale: Hueleza mazao ya nafaka ambayo hayajavunwa; ufafanuzi huu ni wazi kwa msomaji wa kawaida.
- source_word: הַשָּׂדֶה
  choice: shamba lenyewe
  rationale: Huhifadhi uwezekano kwamba uharibifu unaweza kuhusisha shamba kwa upana zaidi, si nafaka peke yake.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: lazima alipe fidia kamili
  rationale: Infinitivi kamili pamoja na kitenzi kilichonyambuliwa inasisitiza wajibu wa kulipa. 'Lazima' huonyesha ulazima wa kisheria, na 'fidia kamili' huwasilisha mkazo huo kwa Kiswahili cha kawaida.
- source_word: הַמַּבְעִר אֶת הַבְּעֵרָה
  choice: aliyeuwasha moto huo
  rationale: Humtambulisha mtu aliyesababisha kuwaka kwa moto; ni wazi na ya asili kuliko tafsiri ya kimofolojia kama 'mteketezaji wa mwako'.
