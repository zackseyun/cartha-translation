  yaml_path: translation/ot/exodus/022/014.yaml
  text: If its owner is with it[a], he shall not make restitution; if it is a hired thing, it came for its hire.
translation:
  language: sw
  text: Ikiwa mwenye mnyama yuko pamoja na mnyama huyo, mkopaji hatalipa fidia. Ikiwa mnyama huyo amekodishwa, hasara hiyo imejumuishwa katika malipo ya kumkodi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa yeye ni mfanyakazi wa kuajiriwa, alikuja kwa ajili ya ujira wake.” Kiebrania ni kifupi na kinaweza kueleweka kuwa kinamhusu ama mnyama aliyekodishwa ama mfanyakazi wa kuajiriwa. Katika muktadha huu wa dhima kwa mali iliyoazimwa, matini kuu inakichukulia kifungu hiki kuwa kinamhusu mnyama aliyekodishwa.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעָלָיו
  choice: mwenye mnyama
  rationale: Katika sheria hii בעל ni mwenye mali. Muktadha wa mstari uliotangulia unahusu mnyama aliyeazimwa, hivyo ‘mwenye mnyama’ ni wazi na wa kawaida katika Kiswahili.
- source_word: עִמּוֹ
  choice: yuko pamoja naye
  rationale: Kiambishi cha nafsi ya tatu ya kiume kinarejelea mnyama. Kiswahili hutumia ngeli ya viumbe hai, kwa hiyo ‘naye’ hudumisha uhusiano huo kwa njia ya kawaida.
- source_word: לֹא יְשַׁלֵּם
  choice: hatalipa fidia
  rationale: Piel ya שלם katika muktadha wa kisheria humaanisha kulipa fidia au kurejesha thamani ya hasara. ‘Hatalipa fidia’ ni sahihi na inaeleweka kwa urahisi.
- source_word: שָׂכִיר
  choice: mnyama huyo amekodishwa
  rationale: Ingawa שָׂכִיר mara nyingi humaanisha mfanyakazi wa kuajiriwa, muktadha huu wa dhima kwa mnyama unaunga mkono maana ya mnyama aliyekodishwa. Kutaja ‘mnyama huyo’ huondoa utata wa kisarufi katika Kiswahili bila kuficha usomaji mwingine, ambao umewekwa katika tanbihi.
- source_word: בָּא בִּשְׂכָרוֹ
  choice: hasara hiyo imejumuishwa katika malipo ya kumkodi
  rationale: Kirai cha Kiebrania ni kifupi sana, kihalisi ‘alikuja kwa ujira wake.’ Tafsiri hii inaeleza maana ya kisheria kwamba hatari au fidia huhesabiwa ndani ya mpango wa kukodi, huku tanbihi ikihifadhi uwezekano wa usomaji wa mfanyakazi.
theological_decisions:
- issue: Utambulisho wa שָׂכִיר na kiambishi katika בִּשְׂכָרוֹ
  choice: Kauli kuu inamhusu mnyama aliyekodishwa na malipo ya kumkodi.
  alternative: 'Kauli inaweza kumhusu mfanyakazi wa kuajiriwa: ‘Ikiwa yeye ni mfanyakazi wa kuajiriwa, alikuja kwa ajili ya ujira wake.’'
  rationale: Muktadha wa karibu unashughulikia dhima kwa mnyama aliyeazimwa au kukodishwa, lakini sintaksia fupi ya Kiebrania inaruhusu usomaji wa mtu; kwa hiyo maana ya kimuktadha imo katika matini na mbadala halisi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ulio wazi na wenye heshima. ‘Fidia’ hudumisha uzito wa kisheria; maelezo ya mwisho yametafsiriwa kwa ulinganifu bora ili kirai kifupi cha Kiebrania kieleweke, huku utata wake halisi ukihifadhiwa katika tanbihi.
