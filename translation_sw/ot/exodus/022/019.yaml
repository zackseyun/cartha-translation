  text: זֹבֵ֥חַ לָ/אֱלֹהִ֖ים יָֽחֳרָ֑ם בִּלְתִּ֥י לַ/יהוָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/019.yaml
  text: Whoever sacrifices to any god[a], except to Yahweh alone, shall be devoted to destruction.
translation:
  language: sw
  text: Yeyote anayemtolea mungu yeyote dhabihu, isipokuwa kwa Yahweh peke yake, atawekwa wakfu kwa maangamizi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atawekwa chini ya marufuku” au “ataangamizwa kabisa.” Kitenzi cha Kiebrania kina wazo la kuwekwa wakfu bila kubatilishwa kwa maangamizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ
  choice: Yeyote anayemtolea ... dhabihu
  rationale: Kitenzi kishirikishi cha Qal kimetumiwa kama nomino ya mtu; muundo huu wa Kiswahili unaonyesha mtu yeyote atendaye tendo hilo na kuhifadhi maana ya ibada ya kutoa dhabihu.
- source_word: לָאֱלֹהִים
  choice: mungu mwingine
  rationale: Ingawa אֱלֹהִים ina umbo la wingi, hapa inarejelea kwa ujumla mungu yeyote asiye Yahweh. Neno “mwingine” linaweka wazi tofauti inayodaiwa na kifungu cha mwisho bila kudokeza uhalali wa miungu mingi.
- source_word: יָחֳרָם
  choice: atawekwa chini ya laana ya kuangamizwa
  rationale: Hofali ya חרם ina maana ya kuwekwa chini ya marufuku au laana isiyoweza kuondolewa, yenye kusudi la kuangamizwa. Tafsiri hii huhifadhi uzito wa kisheria, wa kiibada, na wa adhabu kuliko kusema tu “atauawa” au “ataangamizwa.”
- source_word: בִּלְתִּי
  choice: isipokuwa
  rationale: Hapa neno hili linaanzisha jambo linalotengwa na katazo; “isipokuwa” ni Kiswahili cha kawaida na wazi.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kama “Yahweh,” huku uhusiano wake na tendo la kutoa dhabihu ukionyeshwa katika muundo wa sentensi.
- source_word: לְבַדּוֹ
  choice: peke yake
  rationale: 'Maneno haya yanahifadhi msisitizo wa upekee: dhabihu inapaswa kutolewa kwa Yahweh tu.'
theological_decisions:
- issue: Maana ya adhabu inayotajwa kwa neno חרם katika sheria dhidi ya kumtolea mungu mwingine dhabihu
  choice: atawekwa chini ya laana ya kuangamizwa
  alternative: ataangamizwa kabisa; atawekwa chini ya marufuku
  rationale: Neno la Kiebrania linaunganisha wazo la kutengwa kabisa chini ya חרם na matokeo ya kuangamizwa. Tafsiri iliyochaguliwa haipunguzi adhabu kuwa mauaji ya kawaida wala kutumia istilahi isiyoeleweka bila maelezo.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kumtolea ... dhabihu” ni usemi wa kawaida wa ibada; “mungu mwingine” hufanya maana ya jumla katika muktadha iwe wazi. Tanbihi imewekwa baada ya kifungu cha adhabu ambacho inaeleza.
