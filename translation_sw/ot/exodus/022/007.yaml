base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/007.yaml
  text: If the thief is not found[a], the owner of the house shall come near to God to determine whether he has not laid his hand on his neighbor’s property.
translation:
  language: sw
  text: Ikiwa mwizi hatapatikana, mwenye nyumba atakaribia mbele za Mungu[a] ili kuthibitishwa kama hakuweka mkono wake juu ya mali ya jirani yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele ya waamuzi”; Kiebrania kinasema “Mungu,” lakini katika baadhi ya miktadha ya kisheria neno hilo linaweza kurejelea waamuzi wanaotekeleza mamlaka ya Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא הַגַּנָּב
  choice: mwizi hatapatikana
  rationale: Kauli ya kutendwa ya מצא inaonyesha kwamba mwizi hakupatikana au hakugunduliwa; “hatapatikana” ni ya moja kwa moja na haibainishi kama ni kutambuliwa au kukamatwa.
- source_word: וְנִקְרַב
  choice: atakaribia mbele za
  rationale: Nifali ya קרב inaweza kumaanisha kukaribia au kuletwa karibu. “Atakaribia mbele za” ni ya asili katika Kiswahili na inafaa kwa muktadha wa shauri la kisheria bila kubainisha wakala.
- source_word: בַּעַל הַבַּיִת
  choice: mwenye nyumba
  rationale: Hii humaanisha mwenye nyumba au mwenye mamlaka juu yake; “mwenye nyumba” ni usemi wa kawaida na wazi.
- source_word: אֶל הָאֱלֹהִים
  choice: mbele za Mungu
  rationale: Maandishi yanasema אֱלֹהִים, yaani Mungu, ingawa katika muktadha huu wa kisheria neno hilo linaweza kueleweka kuwa waamuzi wanaotekeleza mamlaka ya Mungu. Tafsiri kuu inahifadhi maana ya moja kwa moja, na uwezekano mwingine umewekwa katika tanbihi.
- source_word: אִם לֹא שָׁלַח יָדוֹ
  choice: kama hakunyoosha mkono wake kuchukua
  rationale: Nahau ya Kiebrania ya kunyoosha mkono juu ya kitu hudokeza kukichukua au kukitumia isivyo halali. Tafsiri hii inahifadhi picha ya mkono huku ikifanya maana ieleweke kwa msomaji wa sasa.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: mali ya jirani yake
  rationale: Katika sheria hii מְלָאכָה hurejelea vitu au mali ya mwingine iliyokabidhiwa kwa uangalizi, si kazi au biashara tu; “mali” ni pana na wazi.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika muktadha huu wa kisheria
  choice: mbele za Mungu
  alternative: mbele ya waamuzi
  rationale: Maana ya moja kwa moja ya maandishi ni Mungu. Kwa kuwa אֱלֹהִים katika baadhi ya vifungu vya sheria inaweza kurejelea waamuzi wanaotenda chini ya mamlaka ya Mungu, uwezekano huo haujaondolewa bali umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kisheria umehifadhiwa, huku nahau ya Kiebrania ikifafanuliwa kwa kiasi kidogo bila kuibadili tu kuwa “kuiba.”
