  source_fidelity: Tafsiri inafuata kwa uaminifu hoja ya כִּי, msisitizo wa kwamba vazi hilo ndilo kifuniko chake pekee, swali la balagha kuhusu kulala, na ahadi ya Mungu kusikia kilio chake. “Mwili wake” kwa עֹרוֹ ni ulainishaji wa Kiswahili unaokubalika katika muktadha wa kazi ya vazi kama kifuniko cha kulalia; hauondoi maana ya msingi.
