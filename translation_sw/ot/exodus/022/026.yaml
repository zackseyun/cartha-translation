  text: כִּ֣י הִ֤וא כסות/ה לְ/בַדָּ֔/הּ הִ֥וא שִׂמְלָת֖/וֹ לְ/עֹר֑/וֹ בַּ/מֶּ֣ה יִשְׁכָּ֔ב וְ/הָיָה֙ כִּֽי יִצְעַ֣ק אֵלַ֔/י וְ/שָׁמַעְתִּ֖י כִּֽי חַנּ֥וּן אָֽנִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/026.yaml
  text: For it is his only covering; it is his cloak for his skin. In what will he lie down? And if he cries out to me[a], I will hear, for I am compassionate.
translation:
  language: sw
  text: Kwa maana hicho ndicho kifuniko chake pekee; ndilo vazi lake la kuufunika mwili wake. Atalala kwa kujifunika nini? Naye akinililia, nitasikia, kwa maana mimi ni mwenye neema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwenye huruma” au “mwenye rehema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutambulisha sababu ya amri iliyotangulia na hudumisha uhusiano wake wa kimantiki.
- source_word: כסות/ה לְבַדָּהּ
  choice: hicho ndicho kifuniko chake pekee
  rationale: כְּסוּת ni kifuniko au vazi, na לְבַדָּהּ huonyesha kwamba hana kifuniko kingine.
- source_word: שִׂמְלָתוֹ לְעֹרוֹ
  choice: ndilo vazi lake la kuufunika mwili wake
  rationale: שִׂמְלָה ni vazi, mara nyingi vazi la nje, na עוֹר ni ngozi; Kiswahili cha kawaida hutumia 'mwili' hapa ili kueleza kazi ya vazi bila taswira isiyo ya kawaida.
- source_word: בַּמֶּה יִשְׁכָּב
  choice: Atalala kwa kujifunika nini?
  rationale: Swali la balagha linahusu kile atakachotumia kujifunika anapolala; tafsiri hii huweka maana wazi kwa Kiswahili cha kawaida.
- source_word: וְהָיָה כִּי יִצְעַק אֵלַי
  choice: Naye akinililia
  rationale: Muundo huu hutambulisha hali inayoweza kutokea; 'akinililia' hubeba wazo la kilio cha dhiki kinachoelekezwa kwa Mungu.
- source_word: וְשָׁמַעְתִּי
  choice: nitasikia
  rationale: Hudumisha maana ya moja kwa moja ya שׁמע na dokezo la Mungu kuitikia kilio cha mwenye kuonewa.
- source_word: חַנּוּן
  choice: mwenye neema
  rationale: חַנּוּן humweleza Mungu kuwa mwenye kutoa kibali kwa huruma; 'mwenye neema' ni usemi wa kawaida wa kibiblia, huku maana mbadala zikitolewa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya sifa ya Mungu חַנּוּן
  choice: mwenye neema
  alternative: mwenye huruma; mwenye rehema
  rationale: Neno linaweza kueleza neema, huruma, au rehema ya Mungu kwa aliye dhaifu. 'Mwenye neema' huhifadhi upana wake bila kufuta njia nyingine halali za kulielewa.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa ulinganifu bora: unahifadhi hoja na swali la balagha la Kiebrania huku ukieleza kwa kawaida kazi ya vazi kama kifuniko cha kulalia.'
