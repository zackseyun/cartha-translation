lexical_decisions:
- source_word: כָּל
  choice: yeyote
  rationale: Katika katazo lenye nomino za umoja, כָּל ina maana ya ujumla kwa kila mmoja; “yeyote” ni ya kawaida na huhifadhi nguvu hiyo.
- source_word: אַלְמָנָה
  choice: mjane
  rationale: Hii ndiyo maana ya kawaida ya neno la Kiebrania na ni Kiswahili cha moja kwa moja.
- source_word: יָתוֹם
  choice: mtoto asiye na baba
  rationale: Katika mazingira ya sheria ya Kiebrania, neno hili mara nyingi humaanisha mtoto aliyefiwa na baba; uchaguzi huu huhifadhi maana hiyo mahususi, huku “yatima” ikitolewa kama mbadala wa kawaida.
- source_word: לֹא
  choice: msije
  rationale: Pamoja na kitenzi kinachofuata, linatoa katazo kwa wingi; “msije mkamtesa” ni katazo la asili na lenye hadhi katika Kiswahili.
- source_word: תְעַנּוּן
  choice: mkamtesa
  rationale: Mzizi ענה katika Piel hapa una maana pana ya kumsababishia mtu mateso au kumtendea kwa ukali. “Kutesa” huhifadhi uzito na upana huo bila kuufungia katika dhuluma ya kiuchumi pekee.
