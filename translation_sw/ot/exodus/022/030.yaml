base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/030.yaml
  text: And you shall be holy men to me[a]. You shall not eat flesh torn in the field[b]; you shall throw it to the dogs.
translation:
  language: sw
  text: Nanyi mtakuwa watu watakatifu kwangu.[a] Msile nyama iliyoraruliwa kondeni;[b] mtaitupa kwa mbwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “watu wa utakatifu.” Neno linalotafsiriwa “watu” lina umbo la wingi wa kiume, ingawa kirai hicho kinaweza kuiwakilisha jamii ya agano.
    reason: lexical_alternative
  - marker: b
    text: Au “nyama iliyoraruliwa na wanyama kondeni.” Kiebrania kinasema tu “nyama ... iliyoraruliwa,” bila kumtaja wazi aliyeraruwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי קֹדֶשׁ
  choice: watu watakatifu
  rationale: Kirai cha muundo wa nomino kinamaanisha kihalisi ‘watu wa utakatifu.’ ‘Watu watakatifu’ ni Kiswahili cha kawaida na chenye heshima, nacho huhifadhi wazo la watu waliotengwa kwa ajili ya Mungu bila kufanya kirai hicho kisikike cha kigeni.
- source_word: תִּהְיוּן לִי
  choice: mtakuwa ... kwangu
  rationale: 'Muundo wa היה pamoja na לִי unaonyesha hadhi na uhusiano wa agano: wawe watakatifu walio wa Mungu. ‘Kwangu’ huhifadhi nguvu hiyo ya kimahusiano.'
- source_word: בָשָׂר
  choice: nyama
  rationale: Ingawa neno linaweza kumaanisha ‘mwili,’ katika sheria hii ya chakula ‘nyama’ ndilo neno la asili na wazi zaidi katika Kiswahili.
- source_word: בַּשָּׂדֶה
  choice: kondeni
  rationale: Hii ni tafsiri fupi na ya kawaida ya eneo la wazi au shamba linalotajwa na שָׂדֶה.
- source_word: טְרֵפָה
  choice: iliyoraruliwa
  rationale: Neno huonyesha nyama ya mnyama aliyeraruliwa, kwa kawaida na mnyama mwingine. Tafsiri haimtaji aliyetenda kwa sababu Kiebrania hakumtaji wazi.
- source_word: לֹא תֹאכֵלוּ
  choice: msile
  rationale: Hii ni amri ya kukataza; ‘msile’ ni namna ya moja kwa moja, ya sasa, na ya kawaida katika Kiswahili.
- source_word: לַכֶּלֶב
  choice: mbwa
  rationale: Nomino ya Kiebrania ni umoja na hutumiwa kwa maana ya jumla. Kiswahili pia kinaweza kutumia ‘mbwa’ kwa kawaida katika muktadha huu.
- source_word: תַּשְׁלִכוּן אֹתוֹ
  choice: mtaitupia
  rationale: Kitenzi kinamaanisha kutupa kitu kwa au kuelekea upande wa mwingine. Kiambishi ‘-i-’ kinarejelea nyama, na kauli ‘-tupia’ huonyesha kuwa inatupwa kwa mbwa.
theological_decisions:
- issue: Lugha ya utakatifu katika sheria ya agano
  choice: mtakuwa watu watakatifu kwangu
  alternative: mtakuwa watu wa utakatifu kwa ajili yangu
  rationale: Kauli hii inaunganisha wajibu wa chakula na hadhi ya jamii kuwa ya Mungu na iliyotengwa kwake. ‘Watakatifu’ huhifadhi uzito wa קֹדֶשׁ, huku ‘kwangu’ ikihifadhi uhusiano wa kuwa mali ya Mungu. Neno אֲנָשִׁים lina umbo la wingi wa kiume, lakini katika Kiswahili ‘watu’ linaweza kuwakilisha jamii bila kufuta taarifa ya umbo la chanzo, ambayo imeelezwa katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Mtindo wa amri ni wa moja kwa moja bila kuwa wa kizamani. Tanbihi zimepangwa kulingana na vifungu vinavyohusika: [a] kwa ‘watu watakatifu’ na [b] kwa ‘iliyoraruliwa.’'
