  yaml_path: translation/ot/exodus/022/020.yaml
  text: You shall not mistreat a foreigner or oppress him[a], for you were foreigners in the land of Egypt.
translation:
  language: sw
  text: Usimtendee mgeni[a] vibaya wala usimkandamize, kwa maana ninyi mlikuwa wageni katika nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkazi asiye mzawa.” Neno la Kiebrania גֵר linamaanisha mtu asiye mzawa anayeishi miongoni mwa Waisraeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: mgeni
  rationale: Katika muktadha huu גֵר ni mtu asiye mzawa anayeishi miongoni mwa jamii ya Israeli, si msafiri anayepita tu. “Mgeni” ni neno la kawaida na linaloeleweka katika Kiswahili, huku tanbihi ikifafanua maana yake mahususi.
- source_word: תוֹנֶה
  choice: usimtendee vibaya
  rationale: Kitenzi ינה katika Hifili kinaonyesha kumtendea mtu isivyo haki. Kauli hii ya Kiswahili huhifadhi upana wa maana bila kuiwekea kikomo cha unyonyaji wa kiuchumi pekee.
- source_word: תִלְחָצֶנּוּ
  choice: kumkandamiza
  rationale: לחץ hapa huonyesha kumwekea mtu shinikizo kali au kumdhulumu. “Kumkandamiza” ni ya asili na yenye uzito unaofaa katika sheria hii, na kiambishi “-m-” kinawakilisha yule mgeni mmoja anayetajwa.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya amri. “Kwa maana” inaendeleza kwa uwazi mtindo wa kisheria wenye maelezo.
- source_word: גֵרִים
  choice: wageni
  rationale: Wingi huu unarudia neno kuu גֵר la kifungu cha kwanza; “wageni” huhifadhi urudiaji huo wa kileksia.
- source_word: הֱיִיתֶם
  choice: mlikuwa
  rationale: היה inaeleza hali ya zamani ya Waisraeli nchini Misri; “mlikuwa” ndiyo tafsiri ya moja kwa moja na ya kawaida.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Kiebrania kinataja wazi “nchi,” na kukihifadhi kunadumisha umbo la chanzo bila kufanya Kiswahili kisikike kigeni.
theological_decisions:
- issue: Umoja wa rejeleo la kiume linalotumika kwa maana ya jumla
  choice: Kudumisha umoja katika “mgeni” pamoja na viambishi vya umoja “-m-.”
  alternative: Kutumia wingi “wageni ... kuwa-” ili kutoa maana ya jumla.
  rationale: Kiebrania kinatumia גֵר katika umoja pamoja na kiambishi cha nafsi ya tatu, umoja wa kiume. Huu ni umoja wa jumla katika lugha ya kisheria; Kiswahili kinaweza kuuhifadhi kwa kawaida bila kulazimika kutaja jinsia kwa kiwakilishi tofauti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri katika umoja umehifadhiwa, pamoja na urudiaji wa “mgeni/wageni.”
