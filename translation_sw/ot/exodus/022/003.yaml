  text: Ikiwa kitu kilichoibwa kitapatikana kweli mikononi mwake—ng’ombe, punda, au kondoo—akiwa hai, atalipa mara mbili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “ikiwa kile kilichoibwa kitapatikana kabisa mkononi mwake.” Kiebrania kinatumia muundo wa kitenzi unaosisitiza kwamba kitu hicho kimepatikana, na “mkononi mwake” ni nahau inayomaanisha kuwa chini ya milki au udhibiti wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Kiunganishi cha kawaida cha sharti kinachotanguliza hali katika sheria.
- source_word: הִמָּצֵא תִמָּצֵא
  choice: kitapatikana kweli
  rationale: Muundo wa Kiebrania wa kitenzi-jina halisi pamoja na kitenzi kilichonyambuliwa unasisitiza kupatikana; “kweli” huonyesha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: בְיָדוֹ
  choice: mikononi mwake
  rationale: Nahau hii kwa maana halisi ni “mkononi mwake,” lakini katika muktadha wa kisheria humaanisha kuwa kitu kiko chini ya milki au udhibiti wake. “Mikononi mwake” ni nahau ya asili ya Kiswahili inayoweza kubeba maana hiyo.
- source_word: הַגְּנֵבָה
  choice: kitu kilichoibwa
  rationale: Nomino hapa inaonyesha mali au kitu kilichoibwa, si tendo la wizi. Chaguo hili ni wazi na la kawaida.
- source_word: מִשּׁוֹר עַד חֲמוֹר עַד שֶׂה
  choice: iwe ni ng’ombe, punda, au kondoo
  rationale: Mfuatano huu hutaja aina za mifugo zinazohusika; muundo wa “iwe ni ... au ...” unaonyesha maana ya kisheria kwa Kiswahili cha asili.
- source_word: חַיִּים
  choice: kikiwa hai
  rationale: Hueleza kwamba mnyama aliyeibwa amepatikana akiwa bado hai, tofauti na kuwa amechinjwa au kuondolewa.
- source_word: שְׁנַיִם יְשַׁלֵּם
  choice: atalipa mara mbili
  rationale: Hii ni kanuni ya fidia yenye thamani maradufu; usemi huu ni mfupi, wazi, na una nguvu ya kisheria.
