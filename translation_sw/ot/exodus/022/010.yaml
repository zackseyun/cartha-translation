base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/010.yaml
  text: an oath of Yahweh shall be between the two of them[a], that he has not put his hand to his neighbor’s property; and its owner shall accept it[c][b], and he shall not make restitution.
translation:
  language: sw
  text: Kiapo cha Yahwe kitakuwa kati ya hao wawili[a], kwamba yule aliyepewa mali hakutia mkono wake katika mali ya mwenzake[b]. Mwenye mali atakubali kiapo hicho[c], na yule aliyepewa mali hatalipa fidia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu, “kiapo cha Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, kwa karibu, “hakutia mkono wake katika mali ya mwenzake,” nahau inayoweza kumaanisha kujitwalia, kuingilia, au kutumia isivyofaa mali ya mwingine.
    reason: cultural_note
  - marker: c
    text: Au, “Mwenye mali atakipokea”; yaani, atakubali kiapo hicho kuwa ushahidi wa kutosha.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻעַת יְהוָה
  choice: kiapo cha Yahwe
  rationale: Muundo wa Kiebrania ni ‘kiapo cha Yahwe.’ Tafsiri hii inahifadhi jina la Mungu na lugha rasmi ya sheria; tanbihi inaeleza kuwa ni kiapo kinachofanywa mbele zake au kwa jina lake.
- source_word: בֵּין שְׁנֵיהֶם
  choice: kati ya hao wawili
  rationale: Inabainisha wazi pande mbili zinazohusika katika mgogoro wa kisheria.
- source_word: אִם לֹא
  choice: kuthibitisha kwamba ... haku-
  rationale: Katika kauli ya kiapo, maneno haya yanatanguliza jambo linaloapwa, wala si sharti la kawaida. ‘Kuthibitisha kwamba’ ni Kiswahili cha kawaida kinachoonyesha kazi ya kiapo katika muktadha huu.
- source_word: שָׁלַח יָדוֹ בִּמְלֶאכֶת רֵעֵהוּ
  choice: hakujichukulia chochote katika mali ya mwenzake
  rationale: Tamathali ya Kiebrania ya ‘kunyoosha/kupeleka mkono’ hapa inadokeza kujitwalia au kutumia isivyofaa mali ya mwingine. Tafsiri kuu inatoa maana hiyo kwa Kiswahili cha asili, huku tanbihi ikihifadhi taswira ya Kiebrania.
- source_word: וְלָקַח בְּעָלָיו
  choice: Mwenye mali atakikubali kiapo hicho
  rationale: Kitenzi ‘atachukua/atapokea’ katika mazingira haya kinamaanisha kwamba mwenye mali anakipokea kiapo kuwa ushahidi wa kutosha. Kutaja ‘kiapo hicho’ kunaweka wazi yambwa iliyodokezwa.
- source_word: יְשַׁלֵּם
  choice: hatalipa fidia
  rationale: Katika sheria hii, shina la Piel la שׁלם linahusu malipo ya kufidia hasara, si malipo ya kawaida tu.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: ‘Yahwe’ linawakilisha jina binafsi la Mungu katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Maana ya ‘kiapo cha Yahwe’
  choice: Kuhifadhi usemi ‘kiapo cha Yahwe’ katika matini na kuufafanua katika tanbihi
  alternative: kiapo mbele za Yahwe
  rationale: Muundo wa asili unaweza kueleweka kuwa kiapo kinachofanywa mbele za Yahwe au kwa jina lake. Tafsiri haifungi maana hiyo kwa ufafanuzi mmoja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya matini ya sheria lakini kinachoeleweka kwa msomaji wa kawaida. ‘Mwenzake’ limetumiwa badala ya ‘jirani yake’ kwa sababu רֵעֵהוּ hapa humaanisha mtu mwingine anayehusika katika shughuli hiyo, si lazima jirani wa makazi. Kurudia ‘yule aliyepewa mali’ kunaondoa utata wa kiwakilishi katika Kiswahili na kuonyesha kwa usahihi mhusika ambaye halazimiki kulipa fidia.
