base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/001.yaml
  text: If the thief is found breaking in and is struck so that he dies[b][a], there is no bloodguilt for him.
translation:
  language: sw
  text: Mwizi akipatikana akivunja na kuingia[a], naye akapigwa hata akafa, aliyempiga hana hatia ya damu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi: “akipatikana katika uvunjaji.” Neno la Kiebrania linamaanisha kuvunja na kuingia, huenda kwa kutoboa ukuta au kuingia kwa siri.'
    reason: lexical_alternative
  - marker: b
    text: Yaani, katika hali hii mtu aliyempiga mwizi hahesabiwi kuwa na hatia ya kumwaga damu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמַּחְתֶּרֶת
  choice: akivunja na kuingia
  rationale: Nomino hii humaanisha uvunjaji wa kuingia, hasa kwa kutoboa ukuta au kuingia kwa siri. Kauli ya Kiswahili ‘akivunja na kuingia’ inaeleza hali hiyo kwa lugha ya kawaida bila kuibana kwenye maana mahususi ya handaki.
- source_word: יִמָּצֵא
  choice: akipatikana
  rationale: Nifali ya מצא katika sharti hili la kisheria ina maana ya kupatikana au kugunduliwa; ‘akipatikana’ ni ya moja kwa moja na ya kawaida.
- source_word: הַגַּנָּב
  choice: mwizi
  rationale: גנב ni neno la kawaida kwa mwizi. Muktadha unaonyesha mwizi anayevunja na kuingia, lakini ‘mwizi’ hudumisha maana ya msingi ya neno.
- source_word: וְהֻכָּה
  choice: akapigwa
  rationale: Kauli tendwa ya נכה hapa humaanisha kupigwa. Tafsiri hii haidokezi bila sababu kwamba kulikuwa na mapigo mengi.
- source_word: וָמֵת
  choice: hata akafa
  rationale: Mfuatano unaonyesha matokeo ya kupigwa. ‘Hata akafa’ huwasilisha matokeo hayo kwa Kiswahili cha kawaida.
- source_word: אֵין לוֹ דָּמִים
  choice: aliyempiga hana hatia ya damu
  rationale: דמים ni nahau ya kisheria inayohusu hatia au uwajibikaji kwa kumwaga damu. Kiwakilishi cha Kiebrania kinaweza kuwa kigumu kwa msomaji wa Kiswahili, hivyo mhusika anayelengwa—aliyempiga mwizi—ameelezwa wazi bila kubadili hukumu ya kifungu.
theological_decisions:
- issue: Nahau ya kisheria kuhusu kuuawa kwa mwizi wakati wa uvunjaji
  choice: hana hatia ya damu
  alternative: hana hatia ya kuua
  rationale: Kiebrania kinatoa hukumu ya kisheria kwamba hakuna hatia ya damu katika hali hii; hakitoi idhini ya jumla ya kuua. ‘Hatia ya damu’ huhifadhi uzito na upana wa nahau hiyo kuliko kuilinganisha moja kwa moja na kosa fulani la kisasa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sharti la sheria umehifadhiwa, huku nahau na marejeo ya viwakilishi yakifanywa yaeleweke kwa msomaji wa kawaida.
