  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
translation:
  language: sw
  text: Na mtu akiazima kitu kwa mwenzake, nacho kikavunjika[a] au kikafa, ikiwa mwenye kitu hicho hayupo pamoja nacho, lazima alipe fidia kamili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “kikavunjika.” Neno la Kiebrania linaweza kumaanisha kitu kilichoazimwa kuharibika au mnyama aliyeazimwa kuumia.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi katika Kiebrania, “atalipa hakika”; yaani, ni lazima atoe fidia kamili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Na mtu aki-
  rationale: Muundo huu unaendeleza mfululizo wa masharti ya sheria na kuanzisha hali mpya ya kisheria kwa Kiswahili cha kawaida.
- source_word: יִשְׁאַל
  choice: akiazima
  rationale: Katika muktadha huu wa sheria, kitenzi kinamaanisha kukopa kitu, si kuuliza tu.
- source_word: אִישׁ
  choice: mtu
  rationale: Ingawa nomino ya Kiebrania ni ya kiume katika umoja, katika sheria hii inamtaja mtu yeyote anayehusika; 'mtu' ni ya kawaida na sahihi katika Kiswahili.
- source_word: מֵעִם רֵעֵהוּ
  choice: kwa mwenzake
  rationale: '''Mwenzake'' linafaa kwa mshiriki mwingine wa jumuiya na halilazimishi maana finyu ya rafiki au jirani wa makazi.'
- source_word: וְנִשְׁבַּר
  choice: nacho kikavunjika
  rationale: Huhifadhi picha halisi ya Kiebrania ya 'kuvunjika'; tanbihi inaeleza kwamba inaweza kumaanisha kuharibika kwa kitu au kuumia kwa mnyama.
- source_word: אוֹ מֵת
  choice: au kufa
  rationale: Huhifadhi sharti la pili kwa lugha rahisi; uwezekano wa kufa unaonyesha kwamba kilichoazimwa kinaweza kuwa mnyama.
- source_word: בְּעָלָיו
  choice: mwenye kitu hicho
  rationale: Nomino hiyo, ingawa ina umbo la wingi katika Kiebrania, hapa humaanisha mmiliki mmoja. Wording hii inaweka wazi uhusiano na kilichoazimwa.
- source_word: אֵין עִמּוֹ
  choice: hayupo pamoja nacho
  rationale: Huhifadhi sharti kwamba mmiliki hakuwa pamoja na kitu au mnyama wakati tukio lilipotokea.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: lazima alipe fidia kamili
  rationale: Muundo wa kusisitiza wa Kiebrania unaonyesha wajibu thabiti wa kulipa; 'fidia kamili' huwasilisha maana ya malipo ya kufidia hasara katika sheria hii.
