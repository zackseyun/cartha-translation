base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/024.yaml
  text: If you lend money to my people[a], to the poor among you, you shall not be like a creditor to him[c][b]; you shall not impose interest on him.
translation:
  language: sw
  text: Ukiwakopesha[a] watu wangu fedha, yaani maskini aliye miongoni mwako, usiwe kwake kama mdai; msimtoze riba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unapowakopesha watu wangu fedha.” Kiebrania hutumia muundo wa masharti unaotumika kwa kawaida katika sheria za matukio.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Uki-
  rationale: Kiambishi cha masharti kinaakisi אִם (‘ikiwa’), huku kikiunda sentensi ya kawaida ya sheria ya tukio katika Kiswahili.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Ingawa maana halisi ni ‘silver’, katika muktadha huu wa mkopo neno hilo humaanisha fedha.
- source_word: תַּלְוֶה
  choice: wakopesha
  rationale: Hifili ya לוה hapa ni ‘kukopesha’. Kiambishi cha mtendewa katika ‘kuwakopesha’ kinarejelea ‘watu wangu’ kwa mtiririko wa kawaida wa Kiswahili.
- source_word: עַמִּי
  choice: watu wangu
  rationale: Huhifadhi nafsi ya kwanza katika kiambishi cha Kiebrania bila kuongeza ‘Israeli’, ambalo halitajwi moja kwa moja katika aya.
- source_word: הֶעָנִי
  choice: maskini
  rationale: Neno ni kivumishi kilichotumika kama nomino katika umoja. ‘Maskini’ ni la asili na lenye heshima, nalo halilazimishi kuongeza neno ‘mwanamume’ ambalo halipo kama nomino katika matini.
- source_word: עִמָּךְ
  choice: aliye miongoni mwenu
  rationale: Hutoa maana ya kuwa ndani ya jumuiya, badala ya tafsiri ngumu ya neno kwa neno ‘aliye pamoja nawe’.
- source_word: כְּנֹשֶׁה
  choice: kama mdai
  rationale: ‘Mdai’ humaanisha mwenye kudai deni; muktadha unaonyesha hasa shinikizo la mdai kwa maskini.
- source_word: תְשִׂימוּן ... נֶשֶׁךְ
  choice: msimtoze riba
  rationale: Hii ni tafsiri ya kawaida ya nahau ya ‘kuweka riba juu yake’. Wingi wa kitenzi cha Kiebrania umehifadhiwa katika ‘msimtoze’.
theological_decisions:
- issue: Nguvu ya kisheria ya אִם
  choice: Ukiwakopesha
  alternative: Unapowakopesha
  rationale: אִם kwa kawaida ni ‘ikiwa’, ingawa katika sheria ya matukio inaweza kuwa na maana ya ‘wakati/unapo-’. Muundo wa masharti umehifadhiwa bila kuondoa matumizi yake ya kisheria.
- issue: Rejeleo la kijinsia katika הֶעָנִי
  choice: maskini
  alternative: mwanamume maskini
  rationale: Kiebrania ni umoja wa kiume kisarufi, lakini halina nomino inayosema ‘mwanamume’. Kiswahili ‘maskini’ huhifadhi umoja na hali ya mtu bila kuongeza jinsia isiyotajwa wazi.
- issue: Mabadiliko kutoka umoja kwenda wingi katika amri
  choice: usiwe ... msimtoze
  alternative: usiwe ... usimtoze
  rationale: Matini ya Kiebrania hubadilika kutoka mhusika wa umoja katika ‘usiwe’ kwenda amri ya wingi katika ‘msiweke/msimtoze’. Mvutano huo wa kisarufi umehifadhiwa badala ya kusawazishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Fedha’, ‘mdai’, na ‘riba’ ni maneno yanayoeleweka katika muktadha wa mkopo. Matini huhifadhi badiliko la Kiebrania kutoka umoja (‘usiwe’) kwenda wingi (‘msimtoze’).
