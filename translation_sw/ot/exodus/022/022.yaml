  text: If you indeed afflict him[a], and if he indeed cries out to me[b], I will surely hear his cry.
translation:
  language: sw
  text: Ukimtesa kabisa mtu huyo[a], naye akinililia kwa sauti[b], hakika nitasikia kilio chake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinatumia viwakilishi vya umoja wa kiume. Hapa vinamrejelea mtu yeyote mmoja—mjane au yatima—aliyetajwa katika mstari uliotangulia.
    reason: cultural_note
  - marker: b
    text: Katika Kiebrania, vitenzi “kutesa,” “kulia,” na “kusikia” kila kimoja kinatumia kitenzi-jina pamoja na kitenzi kilichonyambuliwa ili kutia mkazo; maana yake inaweza kutafsiriwa “kabisa,” “kwa kweli,” au “hakika,” kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Uki-
  rationale: Kiambishi cha masharti “uki-” kinawasilisha kwa kawaida na kwa uwazi sharti linaloanzishwa na אִם.
- source_word: עַנֵּה תְעַנֶּה
  choice: utamtesa kwa vyovyote
  rationale: Kitenzi ענה kina maana ya kumtesa au kumtendea vibaya mtu. Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unasisitiza tendo; “kwa vyovyote” linaonyesha onyo hilo lenye mkazo kwa Kiswahili cha kawaida.
- source_word: אֹתוֹ
  choice: mtu huyo
  rationale: Kiwakilishi cha Kiebrania ni umoja wa kiume na kinarejelea kwa mgawanyo mjane au yatima yeyote aliyetajwa katika mstari uliotangulia. “Mtu huyo” ni rejeleo la umoja linalofaa kwa yeyote kati yao bila kuingiza jinsia isiyolazimishwa na Kiswahili.
- source_word: כִּי אִם
  choice: naye aki-
  rationale: Katika mfuatano huu maneno hayo yanaendeleza hali ya sharti. “Naye aki-” yanaunganisha tendo la kulia na sharti la kwanza kwa Kiswahili cha asili.
- source_word: צָעֹק יִצְעַק
  choice: akinililia kwa sauti
  rationale: צעק ni kulia au kupaza kilio ili kuomba msaada. Muundo uliorudiwa una mkazo; “kwa sauti” linawasilisha hali ya kupaza kilio bila kuongeza sababu ya kilio.
- source_word: אֵלַי
  choice: akinililia
  rationale: Kiambishi “-ni-” kinaonyesha kuwa kilio kinaelekezwa kwa Mungu, sawasawa na אֵלַי, “kwangu.”
- source_word: שָׁמֹעַ אֶשְׁמַע
  choice: hakika nitasikia
  rationale: Muundo wa kusisitiza unaonyesha uhakika wa jibu la Mungu. “Hakika nitasikia” ni Kiswahili cha kawaida na kinahifadhi mkazo huo.
- source_word: צַעֲקָתוֹ
  choice: kilio chake
  rationale: “Kilio” linaendana moja kwa moja na nomino ya Kiebrania na kudumisha uhusiano wake na kitenzi cha kulia katika sentensi hiyo.
theological_decisions:
- issue: Kiwakilishi cha umoja kinachomrejelea anayeteswa
  choice: mtu huyo / chake
  alternative: wao / chao
  rationale: Viambishi vya Kiebrania ni vya umoja wa kiume, lakini vinamrejelea kwa mgawanyo mjane au yatima yeyote wa mstari uliotangulia. Kiswahili halihitaji jinsia katika “mtu huyo,” hivyo umoja wa chanzo unahifadhiwa bila kufanya amri hiyo iwahusu wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa masharti umefanywa wa kawaida katika Kiswahili, huku mkazo wa maumbo matatu ya Kiebrania ukihifadhiwa katika “kwa vyovyote,” “kwa sauti,” na “hakika.”
