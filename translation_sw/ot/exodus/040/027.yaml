base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/027.yaml
  text: And he burned fragrant incense on it[a], just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Naye akafukiza uvumba wenye harufu nzuri juu yake[a], kama vile Yahwe alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uvumba wa manukato” au “uvumba wenye kunukia”; kirai cha Kiebrania kinamaanisha uvumba uliotengenezwa kwa viungo vyenye harufu nzuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: akafukiza
  rationale: Katika muktadha wa ibada, Hiphil ya קטר humaanisha kuunguza uvumba ili moshi wake upande; “akafukiza” ni usemi wa kawaida na mfupi wa Kiswahili kwa tendo hilo.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kiwakilishi kinarejelea madhabahu ya kufukizia uvumba iliyotajwa katika muktadha; “juu yake” huhifadhi uhusiano wa mahali.
- source_word: קְטֹרֶת סַמִּים
  choice: uvumba wenye harufu nzuri
  rationale: Kirai hiki kinataja uvumba uliotengenezwa kwa manukato yenye harufu; tafsiri hii ni ya asili katika Kiswahili na huhifadhi maana bila kulazimisha aina mahususi ya viungo.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Hueleza kwamba tendo lilifanywa sawasawa na agizo lililotangulia.
- source_word: צִוָּה
  choice: alivyomwamuru
  rationale: Muundo huu wa Kiswahili huonyesha kwa kawaida kwamba tendo lililingana na amri iliyokuwa imetolewa tayari.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ni umbo sanifu na linalotambulika kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina na ni umbo la kawaida la Kiswahili, bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Akafukiza uvumba” ni usemi wa kawaida wa muktadha wa ibada; “Naye” hudumisha mwendelezo wa simulizi.
