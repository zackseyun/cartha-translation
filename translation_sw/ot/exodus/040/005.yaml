  text: וְ/נָתַתָּ֞ה אֶת מִזְבַּ֤ח הַ/זָּהָב֙ לִ/קְטֹ֔רֶת לִ/פְנֵ֖י אֲר֣וֹן הָ/עֵדֻ֑ת וְ/שַׂמְתָּ֛ אֶת מָסַ֥ךְ הַ/פֶּ֖תַח לַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/005.yaml
  text: And you shall place the golden altar for incense before the ark of the testimony[b][a], and you shall set the screen for the entrance of the tabernacle.
translation:
  language: sw
  text: Nawe utaiweka madhabahu ya dhahabu kwa ajili ya uvumba[a] mbele ya sanduku la Ushuhuda[b], nawe utaweka pazia la mlango wa maskani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kimapokeo zaidi, “madhabahu ya kufukizia uvumba.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “sanduku la Ushuhuda”; kwa mapokeo mara nyingi huitwa “sanduku la Agano.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: utaiweka
  rationale: Kitenzi נתן hapa kina maana ya kuweka kitu mahali pake; “utaiweka” ni Kiswahili cha kawaida na kinafaa kwa maagizo haya.
- source_word: מִזְבַּח הַזָּהָב
  choice: madhabahu ya dhahabu
  rationale: Muundo huu unaeleza nyenzo iliyotumiwa kutengeneza madhabahu; “ya dhahabu” ni wa asili na wazi katika Kiswahili.
- source_word: לִקְטֹרֶת
  choice: kwa ajili ya uvumba
  rationale: Herufi ל inaonyesha kusudi au matumizi ya madhabahu. Tafsiri hii huhifadhi maana hiyo badala ya kuifanya tu kuwa jina la madhabahu.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Hapa neno hili linaeleza mahali madhabahu ilipopaswa kuwekwa kuhusiana na sanduku.
- source_word: אֲרוֹן הָעֵדֻת
  choice: sanduku la Ushuhuda
  rationale: עֵדֻת humaanisha “ushuhuda,” si “agano” moja kwa moja. Herufi kubwa katika “Ushuhuda” inaonyesha matumizi yake kama jina la kile kilichowekwa katika sanduku.
- source_word: וְשַׂמְתָּ
  choice: utaweka
  rationale: שׂים humaanisha kuweka au kupanga kitu mahali pake; “utaweka” ni sahihi na ya kawaida.
- source_word: מָסַךְ
  choice: pazia
  rationale: Katika muktadha wa maskani, neno hili ni kitambaa kinachositiri sehemu ya kuingilia. “Pazia” ni neno la sasa na linaloeleweka kwa urahisi.
- source_word: הַפֶּתַח
  choice: mlango
  rationale: פֶּתַח ni nafasi au sehemu ya kuingilia; “mlango” ni usemi wa kawaida katika Kiswahili kwa sehemu hiyo.
- source_word: לַמִּשְׁכָּן
  choice: wa maskani
  rationale: Katika kirai kizima, ל inaeleza uhusiano wa pazia na mlango wa maskani. “Maskani” ni istilahi inayofaa kwa מִשְׁכָּן katika muktadha huu wa ibada.
theological_decisions:
- issue: Tafsiri ya עֵדֻת katika jina la sanduku
  choice: sanduku la Ushuhuda
  alternative: sanduku la Agano
  rationale: Maandishi ya Kiebrania yanatumia עֵדֻת, “ushuhuda.” Kutumia “Ushuhuda” huhifadhi jina lililo katika mstari huu bila kuingiza jina la kimapokeo “sanduku la Agano,” ingawa jina hilo linajulikana na linahusiana kimawazo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. “Nawe” hudumisha mwendelezo wa maagizo, na “pazia” limetumiwa badala ya istilahi nzito zaidi ili sentensi iwe ya sasa na wazi.
