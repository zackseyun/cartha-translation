base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/016.yaml
  text: And Moses did according to all that Yahweh commanded him[a]; so he did.
translation:
  language: sw
  text: Musa akafanya kulingana na yote ambayo Yahweh alikuwa amemwamuru[a]; ndivyo alivyofanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi עשה kina maana pana ya ‘kufanya/kutengeneza’; hapa kinaeleza utekelezaji wa amri, hivyo ‘akafanya’ linafaa.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: כְּכֹל
  choice: sawasawa na yote
  rationale: Muundo כ + כֹל unaonyesha kulingana kikamilifu na mambo yote yaliyoamriwa; ‘sawasawa na yote’ huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר
  choice: ambayo
  rationale: Kiambishi cha uhusiano kinachoanzisha maelezo ya yale yaliyoamriwa.
- source_word: צִוָּה
  choice: alikuwa amemwamuru
  rationale: Ingawa Kiebrania kina umbo la wakati timilifu, muktadha unaonyesha kwamba amri ilitangulia tendo la Musa; umbo hili la Kiswahili linaweka mpangilio huo wazi bila kubadili maana.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kwa cheo.
- source_word: אֹתוֹ
  choice: -m- katika ‘amemwamuru’
  rationale: Kiambishi cha yambwa cha nafsi ya tatu umoja kinamrejelea Musa, aliyepokea amri.
- source_word: כֵּן
  choice: ndivyo
  rationale: Kielezi hiki kinarejelea na kusisitiza kwamba tendo la Musa lililingana kikamilifu na amri.
- source_word: עָשָׂה
  choice: alivyofanya
  rationale: Kurudia mzizi wa ‘kufanya’ huhifadhi msisitizo wa Kiebrania kuhusu utii kamili wa Musa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini ina jina la Mungu יְהוָה moja kwa moja. ‘Yahweh’ huhifadhi jina hilo, huku tanbihi ikieleza desturi ya kulitafsiri kwa cheo ‘BWANA’.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Urudiaji wa ‘akafanya/alivyofanya’ umehifadhiwa kwa sababu ni msisitizo wa kimakusudi katika Kiebrania.
