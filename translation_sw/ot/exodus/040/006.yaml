translation:
  language: sw
  text: Nawe utaiweka madhabahu ya sadaka ya kuteketezwa mbele ya mlango wa maskani, hema la kukutania.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָתַתָּה
  choice: Nawe utaiweka
  rationale: Kitenzi נתן katika muktadha wa kupanga vifaa humaanisha kuweka; umbo la wakati ujao linafaa kwa agizo hili, na kiambishi -i- kinarejelea madhabahu.
- source_word: מִזְבַּח
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na lenye hadhi katika Kiswahili kwa mahali pa kutolea dhabihu.
- source_word: הָ/עֹלָה
  choice: ya sadaka ya kuteketezwa
  rationale: עֹלָה ni sadaka inayoteketezwa; tafsiri hii inaweka wazi aina ya sadaka bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: לִ/פְנֵי
  choice: mbele ya
  rationale: Huwasilisha uhusiano wa mahali wa לִפְנֵי kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: פֶּתַח
  choice: mwingilio
  rationale: Neno hili linaonyesha sehemu ya kuingilia au uwazi wa kuingia, kulingana na maana ya פֶּתַח.
- source_word: מִשְׁכַּן
  choice: maskani
  rationale: Maskani ni istilahi ya Kiswahili inayotambulika kwa מִשְׁכָּן kama mahali patakatifu pa kukaa, huku ikidumisha maana yake ya kiufundi katika Kutoka.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hii ni tafsiri ya kawaida na inayoeleweka ya jina hili la mahali ambapo Mungu hukutana na watu wake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kirai “yaani, hema la kukutania” kinaonyesha kwamba “hema la kukutania” linafafanua “maskani,” kama muundo wa Kiebrania unavyodokeza. Hakuna tanbihi iliyohitajika, kwa kuwa tofauti ya Kiingereza kati ya “before” na “in front of” huwakilishwa kwa kawaida na “mbele ya” katika Kiswahili.
