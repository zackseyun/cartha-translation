base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/029.yaml
  text: And he set the altar of burnt offering at the entrance to the tabernacle of the tent of meeting, and offered on it the burnt offering and the grain offering, just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Akaweka madhabahu ya sadaka ya kuteketezwa kwenye ingilio la Maskani, Hema la Kukutania, na juu yake akatoa sadaka ya kuteketezwa na sadaka ya nafaka, kama vile Yahwe alivyomwamuru Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: madhabahu ya sadaka ya kuteketezwa
  rationale: Muundo huu unabainisha madhabahu kwa kazi yake ya msingi na kuhifadhi maana maalumu ya dhabihu ya עֹלָה kwa Kiswahili kinachoeleweka.
- source_word: שָׂם
  choice: akaweka
  rationale: Kitenzi hiki kinafaa kwa tendo la kuweka kifaa cha Maskani mahali palipoagizwa na kinaendeleza simulizi kwa njia ya kawaida.
- source_word: פֶּתַח
  choice: mlangoni mwa
  rationale: Huwasilisha wazi mahali penye uwazi au mwingilio, kwa Kiswahili cha kawaida na fasaha.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: Maskani ya Hema la Kukutania
  rationale: Huhifadhi majina yote mawili na uhusiano wa muundo wa Kiebrania bila kuyafanya kuwa jina moja lililorahisishwa.
- source_word: וַיַּעַל עָלָיו
  choice: na juu yake akatoa
  rationale: Katika muktadha wa dhabihu, עלה humaanisha kutoa sadaka; mpangilio huu pia unaweka wazi kwamba sadaka zilitolewa juu ya madhabahu hiyo.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni tafsiri iliyo wazi ya sadaka iliyoteketezwa madhabahuni na hutofautisha aina hii ya dhabihu na nyingine.
- source_word: הַמִּנְחָה
  choice: sadaka ya nafaka
  rationale: Katika muktadha wa kikuhani, neno hili linataja sadaka inayotokana na mazao ya nafaka, si zawadi ya jumla.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa katika Kiebrania, kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: kama vile Yahwe alivyomwamuru Musa
  rationale: Husisitiza kwamba tendo hilo lililingana na agizo la awali la Yahwe kwa Musa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; kulitafsiri kama Yahwe huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Maana ya מִנְחָה katika ibada ya Maskani
  choice: sadaka ya nafaka
  alternative: sadaka ya zawadi
  rationale: Muktadha wa sheria na ibada ya kikuhani unaelekeza kwenye aina maalumu ya sadaka ya nafaka, ingawa neno hilo linaweza kumaanisha zawadi katika miktadha mingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa heshima, wa sasa na unaoeleweka kwa wasomaji wa kawaida. Istilahi za ibada zimehifadhiwa bila kuongeza maelezo ya kimadhehebu.
