  text: On the first day of the first month[a], you shall set up the tabernacle, the tent of meeting.
translation:
  language: sw
  text: Siku ya kwanza ya mwezi wa kwanza, utasimamisha Maskani, Hema ya Kukutania.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa muundo wa karibu zaidi, “Maskani ya Hema ya Kukutania.” Kiebrania kinaunganisha majina mawili ya mahali patakatifu; yanaweza kueleweka kuwa majina mawili ya kitu kilekile au kuwa na uhusiano ulioshikamana zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יוֹם ... בְּ/אֶחָד לַ/חֹדֶשׁ
  choice: Siku ya kwanza ya mwezi
  rationale: Hii ni kauli ya tarehe; ingawa kwa muundo wa karibu zaidi Kiebrania kinasema ‘siku moja ya mwezi,’ maana yake ya kawaida ni siku ya kwanza ya mwezi.
- source_word: הַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: mwezi wa kwanza
  rationale: Katika muktadha wa kalenda, חֹדֶשׁ humaanisha ‘mwezi,’ na הָרִאשׁוֹן huonyesha kuwa ni wa kwanza katika mpangilio.
- source_word: תָּקִים
  choice: utasimamisha
  rationale: Hifili ya קום hapa ina maana ya kufanya kitu kisimame, yaani kukijenga au kukiweka tayari; ‘utasimamisha’ ni kauli ya kawaida kwa hema au maskani na inadumisha nguvu ya agizo.
- source_word: מִשְׁכַּן
  choice: Maskani
  rationale: Neno hili hutaja mahali patakatifu pa kuhamishwa katika Kutoka. ‘Maskani’ ni istilahi fupi, yenye heshima, inayodokeza mahali pa kukaa.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni jina la kawaida la mahali patakatifu katika Kutoka. ‘Hema la Kukutania’ linaeleza kwa kawaida mahali pa mkutano uliowekwa kati ya Mungu na watu wake.
theological_decisions:
- issue: Uhusiano kati ya מִשְׁכַּן na אֹהֶל מוֹעֵד
  choice: 'Kauli zinazowekwa sambamba: ‘Maskani, Hema la Kukutania’'
  alternative: 'Muundo wenye uhusiano wa umilikaji: ‘Maskani ya Hema la Kukutania’'
  rationale: Kiebrania kinaunganisha majina haya mawili ya mahali patakatifu bila kiungo wazi cha umilikaji. Muktadha unaunga mkono kuyaona kama majina mawili yanayorejelea jengo lilelile, lakini tanbihi inadumisha uwezekano wa muundo ulioshikamana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia muundo wa kawaida wa tarehe na agizo la umoja. Majina ‘Maskani’ na ‘Hema la Kukutania’ yameandikwa kwa herufi kubwa kama majina maalumu ya mahali patakatifu katika muktadha huu.
