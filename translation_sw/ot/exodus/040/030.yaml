translation:
  language: sw
  text: Akaweka beseni[a] kati ya hema la kukutania na madhabahu, akatia humo maji kwa ajili ya kunawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania הַכִּיּוֹר linamaanisha chombo kikubwa cha maji kilichotumiwa kwa kunawa katika huduma ya hema; hapa limetafsiriwa “beseni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Akaweka
  rationale: Kitenzi שׂוּם kina maana ya kuweka kitu mahali fulani; “akaweka” ni Kiswahili cha kawaida na kinafaa kwa kuwekwa kwa beseni katika nafasi yake.
- source_word: הַכִּיֹּר
  choice: beseni
  rationale: כִּיּוֹר hapa ni chombo kikubwa cha maji cha kutawadhia katika huduma ya hema; “beseni” ni neno la sasa na linaloeleweka kuliko istilahi za kale.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: kati ya hema la kukutania na madhabahu
  rationale: Muundo wa Kiebrania בֵּין...וּבֵין umetolewa kwa mtindo wa kawaida wa Kiswahili “kati ya ... na ...”; אֹהֶל מוֹעֵד limetafsiriwa “hema la kukutania,” likihifadhi wazo la mahali pa kukutana lililokusudiwa.
- source_word: וַיִּתֵּן
  choice: akatia
  rationale: נָתַן hapa ina maana ya kuweka au kutia; kwa maji na chombo, “akatia” ni Kiswahili cha asili na cha wazi.
- source_word: שָׁמָּה
  choice: humo
  rationale: Adverbia hii humaanisha “huko/humo”; “humo” inaelekeza kwa kawaida kwenye beseni bila kubadili maana ya muktadha.
- source_word: מַיִם
  choice: maji
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya מַיִם.
- source_word: לְרָחְצָה
  choice: kwa ajili ya kunawa
  rationale: Infinitivi ya רָחַץ inaonyesha kusudi la kuosha; “kunawa” ni ya kawaida kwa kuosha sehemu za mwili kwa maji, huku mhusika akiachwa bila kutajwa kama ilivyo katika Kiebrania.
