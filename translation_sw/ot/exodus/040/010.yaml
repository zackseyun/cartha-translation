base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/010.yaml
  text: You shall anoint the altar of burnt offering and all its utensils[a], and you shall consecrate the altar, and the altar shall be most holy.
translation:
  language: sw
  text: Nawe utaipaka mafuta madhabahu ya sadaka ya kuteketezwa na vyombo vyake vyote; utaweka wakfu madhabahu hiyo, nayo itakuwa takatifu sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “takatifu ya vitakatifu,” usemi wa kusisitiza unaomaanisha “takatifu sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: utaipaka mafuta
  rationale: Katika muktadha wa ibada, kitenzi hiki kinamaanisha kupaka mafuta kwa kusudi la kuweka kitu wakfu. Usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: מִזְבַּח הָעֹלָה
  choice: madhabahu ya sadaka ya kuteketezwa
  rationale: Muundo huu unabainisha madhabahu inayohusishwa na sadaka inayoteketezwa; tafsiri hii inahifadhi maana ya dhabihu hiyo kwa uwazi.
- source_word: כָּל כֵּלָיו
  choice: vyombo vyake vyote
  rationale: כֵּלִים ni neno pana linalotaja vifaa au vyombo vinavyotumiwa pamoja na madhabahu. ‘Vyombo’ ni neno la kawaida na linalofaa katika muktadha wa ibada.
- source_word: וְקִדַּשְׁתָּ
  choice: utaitakasa
  rationale: Katika agizo hili la ibada, קדשׁ humaanisha kuitenga madhabahu iwe takatifu. ‘Kutakasa’ huhifadhi uhusiano wa moja kwa moja na hali ya utakatifu inayotajwa baadaye.
- source_word: וְהָיָה
  choice: nayo itakuwa
  rationale: Kitenzi kinaonyesha hali itakayotokana na kutakaswa kwa madhabahu.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: takatifu sana
  rationale: Huu ni muundo wa Kiebrania wa kusisitiza kiwango cha juu kabisa cha utakatifu. ‘Takatifu sana’ ni usemi wa asili na unaoeleweka katika Kiswahili, huku tanbihi ikihifadhi muundo halisi.
theological_decisions:
- issue: Tafsiri ya kauli ya kiibada קֹדֶשׁ קָדָשִׁים
  choice: takatifu sana
  alternative: patakatifu pa patakatifu
  rationale: Kauli hii inaeleza kiwango cha juu kabisa cha utakatifu wa madhabahu, wala si lazima iwe jina la sehemu ya ndani ya maskani. Tafsiri iliyochaguliwa inaepuka kuingiza maana ya mahali huku ikihifadhi msisitizo wa utakatifu mkuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Nawe’ inadumisha mwendelezo wa agizo, na sentensi mbili zinatoa usomaji wa asili bila kupoteza mpangilio wa matendo katika Kiebrania.
