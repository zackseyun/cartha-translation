  text: And it happened in the first month of the second year[a], on the first day of the month[b], that the tabernacle was set up.
translation:
  language: sw
  text: Ikawa katika mwezi wa kwanza wa mwaka wa pili, siku ya kwanza ya mwezi[a], Maskani ilisimamishwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema kihalisi, “kwa moja ya mwezi,” yaani siku ya kwanza ya mwezi.
    reason: lexical_alternative
  - marker: b
    text: Au, “iliinuliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Muundo huu unaendeleza simulizi kwa njia ya kawaida na yenye hadhi, bila kutumia msemo wa kizamani usio wa lazima.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: katika mwezi wa kwanza
  rationale: Katika muktadha huu wa kalenda, חֹדֶשׁ humaanisha mwezi, na ordinali huonyesha mwezi wa kwanza.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: wa mwaka wa pili
  rationale: 'Hukamilisha fomula ya tarehe kwa Kiswahili cha kawaida: mwezi wa kwanza wa mwaka wa pili.'
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: siku ya kwanza ya mwezi huo
  rationale: Hii ni nahau ya tarehe ambayo kihalisi inasema ‘kwa moja ya mwezi,’ lakini maana yake ya kawaida ni siku ya kwanza ya mwezi.
- source_word: הוּקַם
  choice: ilisimamishwa
  rationale: Hifadhi hali ya kutendwa ya Hophal ya קום na inafaa kwa tendo la kusimamisha au kujenga Maskani.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: ‘Maskani’ ni istilahi ya kibiblia iliyozoeleka kwa mahali patakatifu pa kubebeka linaloelezwa katika Kutoka, na inaepuka maana pana mno ya makao ya kawaida.
