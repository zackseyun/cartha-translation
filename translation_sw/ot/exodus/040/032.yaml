  yaml_path: translation/ot/exodus/040/032.yaml
  text: Whenever they entered the tent of meeting, and whenever they approached the altar, they washed, just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Kila walipoingia katika Hema la Kukutania, na kila walipoikaribia madhabahu, walinawa, kama Yahweh alivyomwamuru Mose.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹאָם
  choice: Kila walipoingia
  rationale: ב pamoja na kitenzi-jina na kiambishi cha nafsi ya tatu wingi huonyesha wakati; katika muktadha huu tendo ni la kurudiwa, hivyo “Kila walipoingia” ni la asili na sahihi.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni jina linaloeleweka la mahali patakatifu ambapo Yahweh alikutana na Israeli; herufi kubwa zinaonyesha kuwa ni jina maalumu la jengo hilo.
- source_word: וּבְקָרְבָתָם
  choice: na kila walipoukaribia
  rationale: Muundo wa ב pamoja na kitenzi-jina unaonyesha hali ya wakati inayojirudia; kiambishi “-u-” kinarejelea madhabahu.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Neno la kawaida la Kiswahili kwa altar; umaalumu wake unaeleweka kwa kiambishi cha yambwa katika “walipoukaribia” na kwa muktadha.
- source_word: יִרְחָצוּ
  choice: walinawa
  rationale: Kauli isiyotimilifu hapa inaeleza desturi ya wakati uliopita. “Kunalawa” kwa kawaida humaanisha kuosha sehemu za mwili, sawasawa na muktadha wa makuhani.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Huonyesha kwamba walitenda kwa kufuata sawasawa amri iliyotangulia.
- source_word: צִוָּה
  choice: alivyokuwa amemwamuru
  rationale: Muundo huu unaonyesha kuwa amri kwa Mose ilitangulia matendo ya kunawa yanayosimuliwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa kunukuu jina lenyewe badala ya kulibadilisha kuwa cheo.
- source_word: אֶת מֹשֶׁה
  choice: Mose
  rationale: Baada ya “amemwamuru,” Mose ndiye mtu aliyepewa amri; Kiswahili hutumia kiambishi cha yambwa “-mw-” na kutaja jina.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina la Mungu moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Marudio ya “kila” yamehifadhiwa ili kuonyesha desturi ya kurudiwa katika vifungu vyote viwili. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika.
