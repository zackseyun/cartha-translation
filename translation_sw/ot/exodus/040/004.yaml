translation:
  language: sw
  text: Kisha utaingiza meza na kupanga vitu vyake kwa utaratibu; utaingiza pia kinara cha taa na kuwasha taa zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuweka taa zake.” Kitenzi cha Kiebrania kwa maana halisi ni “kusababisha zipande,” na kinaweza kurejelea kufanya miali ya taa ipande.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: utaingiza
  rationale: Hifili ya בוא katika maagizo haya inaonyesha kuleta samani ndani ya Maskani; “utaingiza” ni ya asili na inaweka wazi mwendo huo.
- source_word: הַשֻּׁלְחָן
  choice: meza
  rationale: Nomino yenyewe ni “meza”; maelezo ya ziada kuhusu mikate hayajasemwa katika aya hii.
- source_word: וְעָרַכְתָּ אֶת עֶרְכּוֹ
  choice: kupanga vitu vinavyopaswa kuwa juu yake
  rationale: Muundo wa kitenzi na nomino zenye mzizi mmoja unahusu kuweka kwa utaratibu mpangilio wa vitu vya meza. Tafsiri hii inaeleza nahau hiyo kwa Kiswahili cha kawaida bila kuongeza utambulisho mahususi wa vitu hivyo.
- source_word: הַמְּנֹרָה
  choice: kinara cha taa
  rationale: Hii hutafsiri maana ya nomino badala ya kunukuu “menora,” na ni wazi kwa msomaji wa kawaida.
- source_word: וְהַעֲלֵיתָ
  choice: kuweka ... tayari
  rationale: Hifili ya עלה pamoja na taa inaweza kumaanisha kuziweka au kuzitayarisha ili zitumike, na pia inaweza kurejelea kuwasha mwali. Katika muktadha wa kusimamisha Maskani, “kuweka ... tayari” hufuata mlolongo wa kuingiza na kupanga samani; maana nyingine imehifadhiwa katika tanbihi.
- source_word: נֵרֹתֶיהָ
  choice: taa zake
  rationale: נֵר inaweza kumaanisha taa au mwali wake; hapa “taa zake” kwa kawaida hurejelea taa mbalimbali za kinara.
