  text: וְ/לֹא יָכֹ֣ל מֹשֶׁ֗ה לָ/בוֹא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד כִּֽי שָׁכַ֥ן עָלָ֖י/ו הֶ/עָנָ֑ן וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/035.yaml
  text: And Moses was not able to enter the tent of meeting[a], because the cloud settled on it, and the glory of Yahweh filled the tabernacle.
translation:
  language: sw
  text: Musa hakuweza kuingia katika Hema ya Kukutania, kwa sababu wingu lilitulia juu yake[a], na utukufu wa Yahwe ukaijaza maskani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lilikaa juu yake” au “lilifanya makao juu yake.” Kitenzi cha Kiebrania kinaweza kumaanisha kutulia, kukaa, au kufanya makao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכֹל מֹשֶׁה
  choice: Musa hakuweza
  rationale: Hutoa wazi maana ya kutokuwa na uwezo katika Kiswahili cha kawaida; kiunganishi cha Kiebrania kinaendeleza simulizi na hakihitaji kutafsiriwa kwa lazima mwanzoni mwa sentensi.
- source_word: לָבוֹא אֶל
  choice: kuingia ndani ya
  rationale: Katika muktadha wa jengo, huu ni usemi wa kawaida unaoonyesha kuingia katika hema.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Ni tafsiri iliyo wazi na inayotambulika ya jina la mahali pa kukutana katika patakatifu.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu iliyomzuia Musa kuingia.
- source_word: שָׁכַן עָלָיו
  choice: lilitua juu yake
  rationale: Katika tukio hili kitenzi kinaonyesha wingu likitulia juu ya hema; ‘lilitua’ ni cha asili na huhifadhi picha halisi bila kulazimisha maana ya kitheolojia ya kufanya makao.
- source_word: הֶעָנָן
  choice: wingu
  rationale: Muktadha tayari unalitambulisha kuwa wingu la kimungu linalojulikana katika simulizi; Kiswahili hakihitaji kibainishi tofauti cha udefiniti.
- source_word: וּכְבוֹד יְהוָה
  choice: na utukufu wa Yahwe
  rationale: ‘Utukufu’ huhifadhi uzito wa כָּבוֹד, na ‘Yahwe’ huwakilisha jina binafsi יְהוָה badala ya kulibadili kuwa cheo.
- source_word: מָלֵא
  choice: ukaijaza
  rationale: Huwasilisha tendo lililokamilika katika mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: הַמִּשְׁכָּן
  choice: maskani
  rationale: Ni istilahi ya Kiswahili inayofaa kwa patakatifu pa kuhamishika panaporejelewa na מִשְׁכָּן katika Kutoka.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi bila kulibadili kuwa cheo au kutumia umbo la baadaye ‘Yehova’.
- issue: Maana ya שָׁכַן katika teolojia ya Mungu kukaa kati ya watu wake
  choice: lilitua
  alternative: lilikaa; lilifanya makao
  rationale: Muktadha wa karibu unaonyesha wingu likitulia juu ya hema. Tafsiri hii huhifadhi picha hiyo, huku tanbihi ikionyesha kwamba kitenzi pia kinaweza kuwa na maana ya kukaa au kufanya makao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa mtiririko wa kawaida wa simulizi; istilahi ‘hema la kukutania,’ ‘utukufu,’ na ‘maskani’ zimehifadhiwa kwa usahihi wa muktadha wa patakatifu.
