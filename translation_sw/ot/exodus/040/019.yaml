  text: וַ/יִּפְרֹ֤שׂ אֶת הָ/אֹ֨הֶל֙ עַל הַ/מִּשְׁכָּ֔ן וַ/יָּ֜שֶׂם אֶת מִכְסֵ֥ה הָ/אֹ֛הֶל עָלָ֖י/ו מִ/לְ/מָ֑עְלָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/019.yaml
  text: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Kisha akalitandaza hema juu ya Maskani, akaweka kifuniko cha hema juu yake, kama Yahwe alivyomwamuru Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: akalitandaza
  rationale: Kitenzi פרשׂ kina maana ya kutandaza au kunyoosha kitu juu ya kingine; “akalitandaza” ni cha kawaida na kinaeleza tendo hilo bila kuongeza wazo la kusimamisha hema.
- source_word: הָאֹהֶל
  choice: hema
  rationale: אֹהֶל kwa kawaida ni “hema.” Hapa ni tabaka la hema lililotandazwa juu ya Maskani, na tafsiri hii inadumisha tofauti yake na מִכְסֶה, “kifuniko.”
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni neno la Kiswahili linalofaa kwa makao matakatifu yanayozungumziwa katika Kutoka, huku likihifadhi dhana ya mahali pa kukaa iliyo katika מִשְׁכָּן.
- source_word: וַיָּשֶׂם
  choice: akaweka
  rationale: שׂים humaanisha kuweka; “akaweka” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: מִכְסֵה הָאֹהֶל
  choice: kifuniko cha hema
  rationale: Kirai hiki kinatofautisha kifuniko cha nje na hema lenyewe; “kifuniko cha hema” ni wazi na sahihi.
- source_word: עָלָיו מִלְמָעְלָה
  choice: juu yake
  rationale: Mchanganyiko huu unasisitiza mahali pa juu. Katika Kiswahili, “juu yake” huwasilisha maana hiyo kwa kawaida; kuongeza “kutoka juu” kungekuwa na uzito usio wa lazima na kungeweza kudokeza mwelekeo wa tendo badala ya mahali.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: kama Yahwe alivyomwamuru Musa
  rationale: “Kama ... alivyomwamuru” huonyesha kwa kawaida ulinganifu kati ya amri ya awali na utekelezaji wake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu, יהוה, limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi. “Yahwe” hulihifadhi kama jina na ni umbo linalosomeka kwa kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. “Maskani” limeandikwa kwa herufi kubwa kama jina la jengo takatifu maalumu katika muktadha huu. Hakuna tanbihi zinazohitajika.
source_grounding:
  english_pob_role: consult_only
