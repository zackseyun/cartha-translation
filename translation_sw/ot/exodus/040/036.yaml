  yaml_path: translation/ot/exodus/040/036.yaml
  text: Whenever the cloud was taken up from over the tabernacle[a], the sons of Israel would set out in all their journeys.
translation:
  language: sw
  text: Kila mara wingu lilipoinuliwa kutoka juu ya Maskani, wana wa Israeli[a] waliondoka katika safari zao zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Waisraeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהֵעָלֹת
  choice: Wakati wowote ... lilipoinuka
  rationale: Muundo huu unaanzisha kishazi cha wakati na, katika muktadha huu, unaonyesha jambo lililotukia mara kwa mara. “Wakati wowote” huwasilisha hali hiyo ya kurudiwa, na “lilipoinuka” hueleza kwa kawaida wingu kuondoka kwenda juu bila kumtaja mtendaji.
- source_word: הֶעָנָן
  choice: wingu
  rationale: Ni wingu maalumu ambalo tayari limetajwa katika muktadha kuwa ishara ya uwepo wa Mungu.
- source_word: מֵעַל
  choice: kutoka juu ya
  rationale: Huonyesha mwendo wa kuondoka mahali palipo juu ya Maskani.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi iliyozoeleka katika Kiswahili cha Biblia kwa mahali patakatifu pa kuhamishika, na inadumisha wazo la mahali pa kukaa lililo katika neno la Kiebrania.
- source_word: יִסְעוּ
  choice: waliondoka
  rationale: Kitenzi hiki hapa humaanisha kuondoka ili kuanza hatua ya safari. Wakati uliopita pamoja na “wakati wowote” huonyesha tendo la kawaida lililorudiwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu usemi halisi wa Kiebrania, ambao ni wa kiume kwa umbo lakini unalitaja taifa kwa ujumla.
- source_word: בְּכֹל מַסְעֵיהֶם
  choice: katika safari zao zote
  rationale: Huwasilisha kwa ufupi hatua zote za safari zao jangwani bila kuongeza maana isiyokuwapo katika maandishi.
theological_decisions:
- issue: Jina la kijumuiya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi “wana wa Israeli” huhifadhi umbo la Kiebrania na bado unaeleweka kama jina la taifa zima. Tanbihi inatoa tafsiri ya kawaida zaidi bila kuamua kwamba maandishi yanawahusu wanaume peke yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Maskani” imetumiwa kama istilahi ya kibiblia iliyozoeleka, huku muundo wa sentensi ukibaki wa kawaida.
