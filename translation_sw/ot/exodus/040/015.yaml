  text: וּ/מָשַׁחְתָּ֣ אֹתָ֗/ם כַּ/אֲשֶׁ֤ר מָשַׁ֨חְתָּ֙ אֶת אֲבִי/הֶ֔ם וְ/כִהֲנ֖וּ לִ֑/י וְ֠/הָיְתָה לִ/הְיֹ֨ת לָ/הֶ֧ם מָשְׁחָתָ֛/ם לִ/כְהֻנַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/015.yaml
  text: You shall anoint them just as you anointed their father[a], so that they may serve as priests to me. And their anointing shall be for them an everlasting priesthood throughout their generations.
translation:
  language: sw
  text: Nawe utawatia mafuta kama ulivyomtia mafuta baba yao, ili wanitumikie wakiwa makuhani. Na kutiwa mafuta kwao kutakuwa kwa ajili yao kuwaweka wakfu katika ukuhani wa milele[a] katika vizazi vyao vyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukuhani wa kudumu.” Neno la Kiebrania linaweza kumaanisha mwendelezo wenye kudumu katika vizazi katika muktadha wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Nawe utawatia mafuta
  rationale: Kauli hii ni agizo linaloendelea katika mfululizo wa maagizo. ‘Utawatia mafuta’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya agizo, huku ‘nawe’ ikiwakilisha kiunganishi cha Kiebrania.
- source_word: כַּאֲשֶׁר מָשַׁחְתָּ אֶת אֲבִיהֶם
  choice: kama ulivyomtia mafuta baba yao
  rationale: Inahifadhi ulinganisho wa moja kwa moja kati ya kutiwa mafuta kwa wana wa Aroni na kutiwa mafuta kwa baba yao.
- source_word: וְכִהֲנוּ לִי
  choice: ili wanitumikie wakiwa makuhani
  rationale: Kitenzi כהן humaanisha kutenda au kuhudumu kama kuhani. Tafsiri hii inaeleza wazi huduma ya kikuhani inayotolewa kwa Mungu.
- source_word: מָשְׁחָתָם
  choice: Kutiwa kwao mafuta
  rationale: Nomino hii hapa inaelekea kumaanisha tendo au hali ya kuwekwa wakfu kwa kutiwa mafuta, si mafuta yenyewe tu.
- source_word: לִכְהֻנַּת עוֹלָם
  choice: ukuhani wa milele
  rationale: כהנה ni ‘ukuhani,’ na עוֹלָם huonyesha udumifu wa muda mrefu katika muktadha wa agano. ‘Wa milele’ huhifadhi uzito wa usemi wa Kiebrania bila kuficha uwezekano wa maana ya kudumu katika vizazi.
- source_word: לְדֹרֹתָם
  choice: katika vizazi vyao vyote
  rationale: Usemi huu unaonyesha mwendelezo katika vizazi vinavyofuatana vya wazao wa Aroni; ‘katika vizazi vyao vyote’ ni wazi na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Muda unaoonyeshwa na עוֹלָם katika lugha ya agano la kikuhani
  choice: ukuhani wa milele
  alternative: ukuhani wa kudumu
  rationale: Neno עוֹלָם linaweza kuonyesha mwendelezo usiokatizwa katika mfumo wa agano, bila kulazimisha dai la kifalsafa kuhusu kutokuwa na mwisho kabisa. Maandishi makuu yanahifadhi usemi wenye nguvu ‘wa milele,’ na tanbihi inataja uwezekano wa ‘wa kudumu.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ‘wanitumikie wakiwa makuhani’ unaeleza kazi ya kikuhani kwa kawaida, na ‘kutiwa kwao mafuta kutawapa’ huwasilisha matokeo ya ujenzi wa Kiebrania bila kuwa mzito kupita kiasi.
