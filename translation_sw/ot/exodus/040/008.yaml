lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Nawe utaweka
  rationale: Kitenzi שׂים kina maana pana ya kuweka au kusimamisha. Katika muktadha wa kusimamishwa kwa Maskani, “utaweka” ni cha kawaida na hakiongezi maelezo yasiyo katika Kiebrania.
- source_word: הֶחָצֵר
  choice: ua
  rationale: חָצֵר hapa ni eneo lililozungushiwa Maskani. “Ua” ni neno la kawaida la Kiswahili kwa eneo hilo na linafaa katika muktadha huu.
- source_word: סָבִיב
  choice: kuzunguka pande zote
  rationale: Kielezi hiki kinaonyesha kuwa ua unazunguka eneo lote; “pande zote” huonyesha ukamilifu huo kwa Kiswahili cha kawaida.
- source_word: וְנָתַתָּ
  choice: na kutundika
  rationale: Ingawa נתן kwa msingi ni “kuweka,” kitu kinachowekwa hapa ni pazia la mwingilio. “Kutundika” huonyesha kwa kawaida namna pazia hilo linavyowekwa bila kubadili kusudi lake.
- source_word: מָסַךְ
  choice: pazia
  rationale: Katika maelezo ya Maskani, מָסָךְ ni pazia au kisitiri kinachoning’inizwa kwenye mwingilio. “Pazia” ni wazi, la kawaida, na linafaa kwa kifaa hiki.
- source_word: שַׁעַר
  choice: lango
  rationale: שַׁעַר ni sehemu ya kuingilia ua. “Lango” ni tafsiri ya moja kwa moja, ingawa kifuniko chake ni pazia badala ya mlango mgumu.
- source_word: שַׁעַר הֶחָצֵר
  choice: lango la ua
  rationale: Muundo huu wa Kiebrania unabainisha kuwa lango linalotajwa ni lile la ua unaozunguka Maskani.
