lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akasema
  rationale: Kitenzi hiki pamoja na waw ya mfululizo kinaendeleza simulizi. Katika Kiswahili, “Kisha ... akasema” huonyesha kwa kawaida tendo la kusema na hatua inayofuata katika simulizi.
- source_word: יְהוָה
  choice: Yahwe
