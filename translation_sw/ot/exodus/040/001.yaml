- source_word: אֶל
  choice: na
  rationale: Katika muundo wa Kiswahili “kusema na mtu,” “na” humtambulisha kwa kawaida mtu anayeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ndiyo namna sanifu ya jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huu ni mtindo wa kawaida wa Kiebrania wa kutanguliza maneno yanayofuata. “Akisema” huhifadhi muundo huo bila kuongeza maana.
- source_word: וַ
  choice: Kisha
  rationale: “Kisha” huonyesha mwendelezo wa simulizi unaowasilishwa na waw iliyoambatanishwa na kitenzi.
theological_decisions:
