translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Muundo wa “akasema ... akisema” umehifadhiwa kwa kuwa ni fomula ya utangulizi wa hotuba katika chanzo, ingawa una uradidi wa kimtindo.
