base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/033.yaml
  text: Then he set up the courtyard around the tabernacle and the altar[a], and put up the screen for the gate of the courtyard. So Moses finished the work.
translation:
  language: sw
  text: Kisha akasimamisha ua kuzunguka Maskani na madhabahu, akaweka pazia la lango la ua. Hivyo Musa akaimaliza kazi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֶם
  choice: akasimamisha
  rationale: Katika muktadha wa ujenzi, kitenzi hiki humaanisha kusimamisha au kuweka jengo au uzio mahali pake; “akasimamisha” ni cha kawaida na chenye heshima.
- source_word: הֶחָצֵר
  choice: ua
  rationale: חָצֵר hapa ni eneo lililozungushiwa uzio ambalo liliizunguka Maskani; “ua” ni neno la kawaida katika Kiswahili sanifu.
- source_word: סָבִיב
  choice: kuzunguka
  rationale: Huonyesha kwamba ua uliizunguka Maskani pamoja na madhabahu.
- source_word: לַמִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi inayotambulika kwa hema takatifu la kukutania katika Kutoka na huhifadhi maana ya mahali pa kukaa.
- source_word: וְלַמִּזְבֵּחַ
  choice: na madhabahu
  rationale: Ni tafsiri ya moja kwa moja ya מִזְבֵּחַ, huku kiunganishi kikihusisha Maskani na madhabahu kama vitu vilivyo ndani ya ua.
- source_word: וַיִּתֵּן
  choice: akaweka
  rationale: Ingawa maana yake ya msingi ni kutoa au kuweka, hapa inaeleza kufunga pazia mahali pake; “akaweka” ni ya asili bila kuongeza maelezo yasiyo katika chanzo.
- source_word: מָסַךְ
  choice: pazia
  rationale: Neno hili linamaanisha kitambaa kilichotumika kufunika nafasi ya kuingilia. “Pazia” ni wazi na la kawaida katika Kiswahili.
- source_word: שַׁעַר הֶחָצֵר
  choice: lango la ua
  rationale: Kirai hiki hutaja nafasi ya kuingilia ua; “lango la ua” hudumisha muundo wa Kiebrania na linaeleweka hata ikiwa kifuniko chake ni pazia.
- source_word: וַיְכַל
  choice: akaimaliza
  rationale: Kitenzi kinaonyesha kwamba kazi ilifikishwa mwisho; “akaimaliza” ni usemi wa kawaida unaohifadhi wazo la ukamilishaji.
- source_word: הַמְּלָאכָה
  choice: kazi
  rationale: Hapa linajumlisha shughuli yote ya ujenzi na uwekaji; “kazi” ni neno la asili na lenye upana unaofaa.
theological_decisions: []
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa usimulizi umehifadhiwa kwa vitenzi vinavyofuatana: “akasimamisha,” “akaweka,” na “akaimaliza.” Hakuna tanbihi iliyohitajika kwa kuwa “pazia” hutoa maana ya מָסַךְ kwa uwazi katika muktadha huu.'
