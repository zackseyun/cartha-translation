  text: And he arranged on it the bread in order before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Akapanga juu yake mikate[a] kwa utaratibu mbele ya Yahwe, kama vile Yahwe alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpangilio wa mikate”; kwa mapokeo, “mikate ya Uwepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: Akapanga
  rationale: Kitenzi ערך humaanisha kupanga au kuweka kwa utaratibu; “akapanga” ni Kiswahili cha kawaida kinachofaa muktadha huu wa ibada.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kiwakilishi kinarejelea meza iliyotajwa katika mstari uliotangulia na kinahifadhi maana ya mahali.
- source_word: עֵרֶךְ לֶחֶם
  choice: mikate kwa utaratibu
  rationale: Kirai hiki kinaeleza mikate iliyowekwa kwa mpangilio. Tafsiri hii ni ya asili kwa Kiswahili na haikichanganyi moja kwa moja na kirai tofauti לֶחֶם הַפָּנִים.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: “Mbele za” ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya kuwa mbele au katika uwepo wa Yahwe katika muktadha wa ibada.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: kama vile Yahwe alivyomwamuru Musa
  rationale: Kirai hiki kinaonyesha kwamba Musa alitekeleza maagizo sawasawa; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa עֵרֶךְ לֶחֶם
  choice: mikate kwa utaratibu
  alternative: mikate ya Wonyesho / mikate ya Uwepo
  rationale: Mstari huu unatumia kirai kinachoeleza mpangilio wa mikate, si kirai mahususi לֶחֶם הַפָּנִים; hivyo tafsiri kuu haiongezi utambulisho wa kimapokeo, lakini tanbihi unautaja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mikate” limetumiwa kwa sababu muktadha unaonyesha vipande kadhaa vilivyopangwa, ingawa לֶחֶם yenyewe inaweza kuwa nomino ya jumla au ya umoja.
