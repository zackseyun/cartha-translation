base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/003.yaml
  text: And you shall place there the ark of the testimony[b][a], and you shall screen the ark with the curtain.
translation:
  language: sw
  text: Na utaweka humo sanduku la Ushuhuda[b], kisha utalisitiri kwa pazia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kisitiri.” Kiebrania פָּרֹכֶת humaanisha pazia la ndani la maskani lililotenga sanduku.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “sanduku la Ushuhuda,” wala si “sanduku la Agano,” kama linavyoitwa katika baadhi ya tafsiri na katika vifungu vingine.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Nawe utaweka
  rationale: Katika mfululizo wa maagizo, kitenzi hiki kina nguvu ya amri yenye umbo la wakati ujao. ‘Utaweka’ ni Kiswahili cha kawaida na chenye hadhi katika maagizo haya.
- source_word: שָׁם
  choice: humo
  rationale: Kielezi hiki hurejelea ndani ya maskani iliyotajwa katika muktadha. ‘Humo’ huhifadhi rejeo la mahali bila kulitaja zaidi ya maandishi ya Kiebrania.
- source_word: אֲרוֹן הָעֵדוּת
  choice: sanduku la Ushuhuda
  rationale: Kiebrania kinasema kihalisi ‘sanduku la ushuhuda,’ si ‘sanduku la agano.’ Herufi kubwa katika ‘Ushuhuda’ inaonyesha jina la kiufundi la vile vibao vya ushuhuda vilivyowekwa sandukuni.
- source_word: וְסַכֹּתָ
  choice: kisha utalisitiri
  rationale: Mzizi סכך hapa una maana ya kufunika, kuficha, au kuweka kizuizi mbele ya kitu. ‘Kusitiri’ linaeleza kazi ya pazia la ndani la kulificha sanduku lisitazamwe, bila kudokeza kuwa pazia liliwekwa juu yake kama kitambaa.
- source_word: עַל הָאָרֹן
  choice: sanduku
  rationale: Ingawa עַל mara nyingi humaanisha ‘juu ya,’ pamoja na סכך katika mpangilio huu inaeleza kulisitiri sanduku kwa kutumia pazia. Muundo huu wa Kiswahili ni wa asili na hauleti picha potovu ya pazia kulazwa juu ya sanduku.
- source_word: הַפָּרֹכֶת
  choice: pazia
  rationale: Neno hili hutaja pazia la ndani la maskani lililotenga mahali pa sanduku. ‘Pazia’ ni neno la sasa, la kawaida, na linaloeleweka vizuri katika Kiswahili.
theological_decisions:
- issue: Jina la sanduku
  choice: sanduku la Ushuhuda
  alternative: sanduku la Agano
  rationale: Maandishi ya Kiebrania hapa yana עֵדוּת, ‘ushuhuda.’ Tafsiri haijapatanishwa kimyakimya na jina linalojulikana zaidi la ‘sanduku la Agano.’
- issue: Maana ya הַפָּרֹכֶת
  choice: pazia
  alternative: kisitiri
  rationale: ‘Pazia’ ni wazi na la kawaida kwa msomaji wa sasa; ‘kisitiri’ ni mbadala wenye ladha ya lugha ya jadi na huonyesha kazi yake ya kuficha au kutenga.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri umetolewa kwa wakati ujao kama ilivyo kawaida katika maelekezo ya kisheria. ‘Kusitiri’ limechaguliwa ili kueleza kazi ya pazia kama kizuizi, si kama kitambaa kilicholazwa juu ya sanduku. Alama zote za tanbihi zimewekwa katika matini kuu.
