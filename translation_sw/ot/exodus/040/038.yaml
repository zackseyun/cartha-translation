base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/038.yaml
  text: For the cloud of Yahweh was over the tabernacle by day[a], and fire was in it by night[b], before the eyes of all the house of Israel throughout all their journeys.
translation:
  language: sw
  text: Kwa maana wingu la Yahweh lilikuwa juu ya Maskani mchana, na moto ulikuwa ndani yake usiku, machoni pa nyumba yote ya Israeli katika safari zao zote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza muhtasari unaofafanua simulizi lililotangulia; “Kwa maana” linafuata mtiririko huo kwa Kiswahili cha kawaida.
- source_word: עֲנַן יְהוָה
  choice: wingu la Yahwe
  rationale: Muundo huu unahifadhi uhusiano wa wingu na uwepo wa Yahwe bila kuongeza ufafanuzi usio katika chanzo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi iliyozoeleka katika Kiswahili cha Biblia kwa patakatifu pa kubebeka, na pia huakisi wazo la mahali pa kukaa.
- source_word: יוֹמָם
  choice: wakati wa mchana
  rationale: Ni usemi wa Kiswahili ulio wazi na wa kawaida, unaolingana na usemi sambamba “wakati wa usiku.”
- source_word: וְאֵשׁ תִּהְיֶה לַיְלָה בּוֹ
  choice: na wakati wa usiku kulikuwa na moto ndani yake
  rationale: Kitenzi kimetolewa kwa wakati uliopita kama muhtasari wa simulizi; “ndani yake” huhifadhi בּוֹ bila kulazimisha kwa uhakika ikiwa rejeo lake ni wingu au Maskani.
- source_word: לְעֵינֵי
  choice: mbele ya macho ya
  rationale: Inahifadhi taswira halisi ya nahau ya Kiebrania huku ikieleweka kwa Kiswahili.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: nyumba yote ya Israeli
  rationale: Inahifadhi usemi wa kijumuiya na wa kiagano “nyumba ya Israeli” badala ya kuufupisha kuwa “Israeli wote.”
- source_word: בְּכָל מַסְעֵיהֶם
  choice: katika safari zao zote
  rationale: Huwasilisha kwa kawaida hali iliyoendelea katika hatua zote za safari zao bila kuongeza maelezo yasiyo lazima.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Rejeo la kiambishi katika בּוֹ
  choice: ndani yake
  alternative: juu yake
  rationale: Kiwakilishi cha Kiebrania kinaweza kurejelea mazingira ya wingu au Maskani; tafsiri haijataja rejeo kwa jina ili kutatua kimabavu utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa mchana/usiku na nahau ya “mbele ya macho” umehifadhiwa; hakuna tanbihi iliyoongezwa kwa kuwa tofauti zilizoainishwa katika safu ya Kiingereza hazilingani na alama zake na hazihitajiki katika tafsiri hii.
