lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: walinawa
  rationale: Qal wayyiqtol ya רחץ inasimulia tendo lililopita katika mfululizo wa matukio; wakati uliopita wa Kiswahili unafaa hapa.
- source_word: מִמֶּנּוּ
  choice: Kutoka humo
  rationale: מן pamoja na kiambishi cha nafsi ya tatu umoja wa kiume kwa msingi humaanisha ‘kutoka humo/kwake,’ ikirejelea birika lililotajwa kabla; Kiswahili ‘kutoka humo’ huhifadhi wazo la chanzo cha maji.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: וְאַהֲרֹן
  choice: Aroni
  rationale: Umbo la kawaida la jina hili katika Kiswahili; kiunganishi kinawakilishwa katika orodha kwa ‘na’ kabla ya mshiriki wa mwisho.
- source_word: וּבָנָיו
  choice: na wanawe
  rationale: בנים katika muktadha wa kikuhani humaanisha wana wa kiume; kiambishi cha umoja kinamrejelea Aroni.
- source_word: אֶת יְדֵיהֶם
  choice: mikono
  rationale: Tafsiri ya moja kwa moja ya nomino ya wingi yenye kiambishi cha umiliki; ‘yao’ ya mwisho inahusiana kwa kawaida na mikono pamoja na miguu.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: na miguu yao
  rationale: Inahifadhi jozi ya sehemu za mwili na umiliki wa wingi uliotajwa katika Kiebrania.
