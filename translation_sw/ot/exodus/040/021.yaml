  terminology: “Maskani,” “pazia la sitara,” “sanduku la ushuhuda,” and “Yahwe” are suitable Standard East African Swahili renderings. “Ushuhuda” appropriately preserves עֵדוּת without imposing the more interpretive “agano.”
