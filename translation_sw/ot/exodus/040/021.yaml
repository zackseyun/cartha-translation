  text: וַ/יָּבֵ֣א אֶת הָ/אָרֹן֮ אֶל הַ/מִּשְׁכָּן֒ וַ/יָּ֗שֶׂם אֵ֚ת פָּרֹ֣כֶת הַ/מָּסָ֔ךְ וַ/יָּ֕סֶךְ עַ֖ל אֲר֣וֹן הָ/עֵד֑וּת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/021.yaml
  text: He brought the ark into the tabernacle[a], set up the veil of the screen, and screened the ark of the testimony[b], just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Akalileta sanduku ndani ya Maskani, akaliweka pazia la sitara[a], na kwa pazia hilo akalisitiri sanduku la ushuhuda[b], kama vile Yahwe alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pazia la kuficha” au “pazia la kizuizi.” Kiebrania kinaunganisha neno la pazia na kazi yake ya kuwa sitara.
    reason: lexical_alternative
  - marker: b
    text: Au “akalifunika” au “akalificha sanduku la ushuhuda.” Kitenzi cha Kiebrania kinakazia kulificha au kulikinga kwa kutumia pazia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֶת־הָאָרֹן
  choice: Akalileta sanduku
  rationale: Hifili ya בוא inaonyesha kwamba Musa aliliingiza sanduku; “akalileta” ni ya kawaida katika Kiswahili na inaendeleza simulizi.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: Katika Kutoka, מִשְׁכָּן ni patakatifu pa kuhamishwa ambako Mungu anakaa kati ya watu wake; “Maskani” ni istilahi fupi na iliyozoeleka katika Kiswahili cha Biblia.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: pazia la sitara
  rationale: פָּרֹכֶת ni pazia la ndani, na מָסָךְ inaonyesha kazi yake ya kuficha na kutenganisha. “Pazia la sitara” huhifadhi wazo la kitu na kazi yake kwa lugha yenye hadhi.
- source_word: וַיָּשֶׂם
  choice: akaliweka ... mahali pake
  rationale: שׂים ni kuweka; katika muktadha wa kusimamisha na kupanga Maskani, “mahali pake” huonyesha kwamba pazia liliwekwa katika nafasi iliyokusudiwa bila kuongeza maelezo mahususi yasiyomo.
- source_word: וַיָּסֶךְ עַל
  choice: kwa pazia hilo akalisitiri
  rationale: Kitenzi kina maana ya kufunika, kuficha, au kuweka sitara. “Akalisitiri” kinadumisha mwangwi wa “sitara” na kueleza kazi ya pazia; “kwa pazia hilo” huweka wazi chombo kilichotumiwa huku עַל ikibaki na wazo la kufunika/kuficha.
- source_word: אֲרוֹן הָעֵדוּת
  choice: sanduku la ushuhuda
  rationale: Hili ni jina la sanduku linalohusishwa na mbao za ushuhuda. Tafsiri inadumisha neno עֵדוּת bila kulipanua moja kwa moja kuwa “agano” au “mbao.”
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: kama vile Yahwe alivyomwamuru Musa
  rationale: Kauli hii ya mara kwa mara katika Kutoka inasisitiza kwamba Musa alitekeleza agizo kwa usahihi; muundo wa Kiswahili ni wa asili na unaendeleza jina la Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi יְהוָה. “Yahwe” hulihifadhi kama jina na huepuka kulibadilisha kuwa cheo.
- issue: Maana ya הָעֵדוּת katika jina la sanduku
  choice: ushuhuda
  alternative: agano au mbao za ushuhuda
  rationale: “Ushuhuda” huhifadhi istilahi ya Kiebrania na uhusiano wake mpana na yaliyowekwa ndani ya sanduku bila kuamua kimyakimya kwamba neno lenyewe hapa linamaanisha “agano” au “mbao.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Maskani,” “sitara,” na “ushuhuda” zimetumiwa kama istilahi za ibada zilizo fupi na zinazotambulika. Mfuatano wa vitenzi vya “aka-” unahifadhi mwendo wa masimulizi ya Kiebrania.
