  text: Then the cloud covered the tent of meeting[a], and the glory of Yahweh filled the tabernacle.
translation:
  language: sw
  text: Ndipo wingu likafunika Hema la Kukutania, na utukufu wa Yahwe[a] ukaijaza Maskani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina jina la Mungu יהוה (YHWH), linalowakilishwa hapa kwa “Yahwe”; katika desturi nyingine hutumiwa cheo “BWANA” au jina huandikwa “Yehova.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַס
  choice: likaifunika
  rationale: Kitenzi כסה humaanisha ‘kufunika.’ Muundo wa simulizi wenye וַ unaendeleza tukio, jambo linalowasilishwa kwa ‘Ndipo ... lika-’.
- source_word: הֶעָנָן
  choice: lile wingu
  rationale: Nomino ina kibainishi na inarejelea wingu maalumu la uwepo wa Mungu lililotajwa tayari katika simulizi; ‘lile wingu’ hudumisha urejeleo huo kwa Kiswahili cha kawaida.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni jina la mahali palipowekwa kwa ajili ya kukutana. Tafsiri hii ni wazi, ya kawaida katika istilahi za Biblia za Kiswahili, na haiongezi maelezo yasiyomo katika Kiebrania.
- source_word: כְבוֹד יְהוָה
  choice: utukufu wa Yahwe
  rationale: כָּבוֹד hapa ni udhihirisho wenye uzito wa fahari na uwepo wa Mungu. ‘Utukufu wa Yahwe’ huhifadhi muundo na maana ya kifungu cha Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limeandikwa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa kimya kuwa cheo kama ‘BWANA.’ Tanbihi inaeleza msingi wa jina hilo.
- source_word: מָלֵא
  choice: ukaijaza
  rationale: Kitenzi מלא kinaonyesha kwamba utukufu uliijaza Maskani. ‘Ukaijaza’ ni muundo wa Kiswahili ulio wazi na unaoendeleza simulizi.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: מִשְׁכָּן ni istilahi maalumu ya jengo takatifu linalohamishika katika Kutoka. ‘Maskani’ ni istilahi fupi na iliyozoeleka katika Kiswahili cha Biblia, huku ikidumisha tofauti yake na Hema la Kukutania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi יהוה moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo; tanbihi inataja desturi nyingine bila kuifanya kuwa sehemu ya maandishi makuu.
- issue: Maana ya כְבוֹד katika tukio hili
  choice: utukufu
  alternative: uwepo wenye fahari
  rationale: '‘Utukufu’ hudumisha istilahi pana ya Kiebrania na mvutano wake wa kitheolojia: kifungu kinaeleza udhihirisho wa Mungu unaoijaza Maskani bila kuufupisha kuwa ‘uwepo’ pekee.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina ‘Hema la Kukutania’ na ‘Maskani’ yameandikwa kwa herufi kubwa kama istilahi maalumu za mahali patakatifu. Muundo wa sentensi unadumisha mwendo wa simulizi na uwiano wa vifungu viwili vya Kiebrania.
