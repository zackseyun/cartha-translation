  yaml_path: translation/ot/exodus/040/026.yaml
  text: And he placed the gold altar in the tent of meeting[a], before the veil.
translation:
  language: sw
  text: Kisha akaiweka madhabahu ya dhahabu ndani ya Hema la Kukutania, mbele ya pazia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, pazia la ndani lililotenganisha sehemu za Hema.
    reason: Ufafanuzi wa maana maalumu ya neno la Kiebrania katika mpangilio wa maskani.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Kisha akaiweka
  rationale: Wayyiqtol ya שׂוּם inaendeleza mfululizo wa matendo yaliyopita. “Kisha” huonyesha ufuatano huo kwa Kiswahili cha kawaida, na “akaiweka” hufaa kwa uwekaji makusudi wa kifaa cha patakatifu.
- source_word: מִזְבַּח הַזָּהָב
  choice: madhabahu ya dhahabu
  rationale: Muundo huu una maana ya “madhabahu ya dhahabu.” Tafsiri hiyo ni ya kawaida, wazi, na inafuata muundo wa nomino wa Kiebrania.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ndani ya Hema la Kukutania
  rationale: אֹהֶל מוֹעֵד ni jina maalumu la jengo la patakatifu ambako Mungu alikutana na watu wake. “Hema la Kukutania” ni istilahi iliyozoeleka na huhifadhi wazo la kukutana; “ndani ya” huweka wazi mahali madhabahu ilipowekwa.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Kihusishi hiki kinaonyesha mahali kitu kilipo kuhusiana na pazia. “Mbele ya” ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: הַפָּרֹכֶת
  choice: pazia
  rationale: פָּרֹכֶת ni pazia la ndani lililotenganisha sehemu za maskani. “Pazia” ni neno la asili na linaloeleweka kwa urahisi katika Kiswahili cha sasa.
theological_decisions:
- issue: Istilahi ya kifaa cha ibada kwa הַפָּרֹכֶת
  choice: pazia
  alternative: pazia la ndani la kutenganisha sehemu za Hema
  rationale: “Pazia” linaonyesha kitu halisi bila kuliongezea maana ya kimadhehebu. Tanbihi inafafanua kuwa ni kizigeu cha ndani, hivyo uzito wake katika mpangilio wa patakatifu unabaki wazi bila kulazimisha ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Hema la Kukutania” limeandikwa kwa herufi kubwa kama jina maalumu la patakatifu; sentensi inadumisha mtiririko wa simulizi na mpangilio wa maneno ulio wazi.
